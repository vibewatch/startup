      - number: '4.3'
        title: 成本结构应轻于机器人 OEM，但重于纯软件
        blocks:
          - type: paragraph
            body: >
              Covariant 很可能处在机器人经济学中最困难的中间地带。它在结构上应比硬件 OEM 更轻，因为 KNAPP 等伙伴生态承担了许多机器人硬件和更广系统资本开支。公开材料一致把 Covariant
              定位为安装机器人系统之上的智能层。相较全栈自动化厂商，这应有助于降低库存风险和制造营运资本。

              但公司也不像纯企业软件。同一批来源强调部署速度、集成、伙伴工作流、存量场地运营，以及从上料到拆垛的多用例支持。这些都是专业服务、客户工程和缩短价值兑现周期仍很重要的典型信号。即使具体数字是私密的，利润率含义也很直观：站点上线后，经常性软件经济性可能很强，但合并毛利率大概率被部署推广和支持成本稀释。

              公开证据没有披露 CAC、回收期、流失、NRR 或实际毛利率，所以任何单位经济性桥接都必须保持定性和估计驱动。正确的尽调测试是，随着参考架构、伙伴集成和模型性能成熟，软件毛利是否能快于部署工作量扩张。
