  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Covariant 的风险画像由一条单一传导链主导：Amazon
              招走最显眼的技术负责人，许可公司的旗舰模型资产，如今又以更大得多的机器人平台参与竞争。这一序列把经典关键人问题变成复合战略风险，触及技术归属、客户信心、招聘和未来融资。即便 Covariant 仍在运营，具身
              AI 人才和模型迭代的重心也已转向一个本就拥有可观机器人规模的交易对手。


              第二层风险是集中度：Covariant 的公开客户证据真实存在，但高度经由 KNAPP、ABB
              等合作伙伴转述，公开留存指标仍缺席。这让公司对交易后来自渠道伙伴、灯塔客户或潜在投资人的任何犹豫异常敏感。第三层是合规和安全。仓库机器人部署置于 OSHA 式工人安全预期和工业机器人安全标准之内，而 AI
              治理义务也在 NIST 指引和 EU AI Act 下收紧。单看任何因素都不会打破投资逻辑，但合在一起，Covariant 变成一个高监控、低容错的局面：领导层连续性、客户续约证据和 IP
              范围清晰度，比头条式技术验证更重要。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR017
              - CR020
              - CR032
              - CR046
              - CR048
