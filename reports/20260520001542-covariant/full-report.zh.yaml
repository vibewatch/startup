companyProfile:
  summary: >-
    Covariant 是一家 AI 机器人软件公司，2017 年由 Pieter Abbeel、Peter Chen、Rocky Duan 和 Tianhao Zhang 在加州 Berkeley 创立。公司打造
    RFM-1（Robot Foundation Model），这是一种基于机器人抓取数据训练的大规模 AI 模型，让工业机器人能在仓储和物流环境中处理新的、非结构化物品。Covariant 的软件作为智能层，运行在
    FANUC、ABB、 Universal Robots、Kuka 等第三方机器人硬件之上。主要客户包括 DHL、GEODIS、Knapp AG 和 Obeta。2024 年 8 月，Amazon 聘走四位联合创始人并获得
    Covariant AI 模型授权；Covariant 在新领导层下继续作为独立私营公司运营，保留客户合同和员工队伍。
