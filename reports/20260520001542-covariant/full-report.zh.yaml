  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 核心假设
      - 隐含独立价值
      - 溢价入场的回报逻辑
      - 关键风险
    rows:
      - - 乐观
        - 20%
        - 客户基础守住，独立性重新得到证明，收入显著放大，Covariant 作为中立 AI 软件层胜出。
        - $2.5B-$5.0B
        - 只有入场价远低于区间顶部，或新一轮融资证明经济性，才具吸引力。
        - 乐观情景需要 Amazon 之后强执行，而公开证据尚未显示。
      - - 基准
        - 50%
        - 公司仍能存续，但在续约质量、收入结构和领导层稳定性可见之前，增长与融资都会重置。
        - $0.8B-$1.8B
        - 若以数十亿美元溢价进入，回报持平到为负；只有价格重置后才可接受。
        - 基准情景主要受不透明度压制，而不是品类坍塌。
      - - 悲观
        - 30%
        - Amazon 成为更优商业化路径，合作伙伴动能放慢，Covariant 在重新证明自己之前就需要资金。
        - $0.2B-$0.8B
        - 溢价进入会造成永久资本减值；困境战略出售变得可能。
        - 领导层流失和客户犹豫会迅速传导为融资压力。
    notes: 情景价值是分析区间，来自可比结果、收入不透明折扣和里程碑风险，而不是公司披露的指引。
    claimRefs:
      - CV034
      - CV038
      - CV039
      - CV040
      - CV048
      - CV049
  - id: TV004
    title: 可比估值表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Selected comparable companies in AI robotics and warehouse automation software, including public and private
        peers, as of May 2026; several private peer valuations remain undisclosed or partially accessible in public
        sources.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Symbotic
        - Yahoo 估值指标；上市仓库自动化龙头
        - 截至 2026-05-18，市值约 $5.99B，过去 12 个月收入 $2.52B，市销率约 2.26x
        - 衡量规模化仓库自动化经济性和投资人风险偏好的最佳上市基准。
        - 全栈平台，规模远大于 Covariant，且不是纯软件模型同业。
      - - Berkshire Grey
        - SoftBank 私有化交易
        - 2023 年 3 月宣布的约 $375M 全现金交易
        - 对一家公开市场表现失望的仓库自动化厂商，是有用的下行 / 退出可比。
        - 困境 / 战略结果，交钥匙硬件暴露高于 Covariant。
      - - Dexterity
        - 私人 Physical AI 融资轮
        - 2025 年 3 月 $95M 融资，投后估值 $1.65B
        - 显示只要牵引力清晰，私人投资人仍愿为仓储机器人 AI 支付溢价。
        - 轮次定价反映新近融资事件，未披露上市公司式经营指标。
      - - Intrinsic
        - Alphabet 支持的模型层平台
        - 私有；抓取到的公开资料未披露估值
        - 作为软件和开发者层机器人平台，是概念上最接近的可比。
        - 抓取来源没有公开估值锚，限制直接倍数比较。
      - - Covariant
        - 标的公司公开证据集
        - 抓取来源尚未公开验证当前独立估值；只能看到历史融资和经营信号
        - 凸显这里必须用情景法测算的原因。
        - 没有当前价格 + 没有收入披露，意味着仅凭公开证据无法给出站得住的点估值。
    notes: 可比集合混合了公开交易、战略并购和私人轮次，因为没有单一同业组能干净匹配 Covariant 偏软件的仓库 AI 画像。
    claimRefs:
      - CV024
      - CV025
      - CV028
      - CV030
      - CV032
      - CV046
      - CV048
  - id: TV005
    title: 投资逻辑破坏与否决触发因素表
    columns:
      - 触发因素
      - 门槛 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 领导层进一步流失
        - 12 个月内再失去一名核心技术或商业负责人
        - 提高价值随创始人迁移、而非留在公司的概率
        - 立即暂停承销并提高执行折扣。
      - - 客户或 KNAPP 收缩
        - 具名合作伙伴或标杆客户暂停、流失或大幅缩小部署范围
        - 同时损害收入底部假设和数据飞轮逻辑
        - 下调基准情景价值，并重新评估独立存续能力。
      - - Amazon 产品重叠
        - Amazon 推出明显重叠的仓库 AI 能力，并采用类似模型逻辑
        - 压缩中立性溢价，并把最佳商业化路径移到 Covariant 之外
        - 将投资逻辑转向战略出售，而不是成长股投资测算。
      - - 证明前出现融资压力
        - 公司在重新展现客户动能或清晰 2026 年 KPI 之前就需要新资金
        - 把估值风险变成稀释和控制权风险
        - 基准情景假设下轮降价或结构化融资条款。
      - - IP 或许可争议
        - 围绕已许可与保留模型权利出现任何公开矛盾
        - 削弱 Covariant 仍拥有干净、可货币化平台的判断
        - 在法律边界得到外部验证前，暂停估值工作。
      - - 披露没有进展
        - 尽调中管理层仍无法展示收入结构、续约、集中度和支持指标
        - 让公司停留在叙事模式，而非证据模式
        - 无论产品热度如何，建议维持继续研究。
    notes: 这些触发因素设计成外部可监控，并直接映射到估值受损，而不是泛泛的经营担忧。
    claimRefs:
      - CV035
      - CV037
      - CV040
      - CV043
      - CV045
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 和收入结构
        - 按软件、服务、支持和战略许可拆分的月度收入桥
        - 决定 Covariant 应按软件型还是部署型估值
        - 管理层 + CFO 材料包；与董事会材料和合同交叉核对。
      - - 客户续约和集中度
        - 总留存率、NRR、前 5 / 前 10 客户收入集中度，以及 Amazon 之后续约行为
        - 检验客户基础是耐久资产，还是装机收入惯性
        - 客户成功和财务尽调，附队列导出。
      - - Amazon 许可范围
        - 使用领域、排他性、期限、经济条款和任何未来开发义务
        - 界定战略上行还有多少归 Covariant 所有
        - 法务审查商业协议及附表。
      - - 交易后组织和留任
        - 当前组织架构、留任方案、领导层决策权和关键技术负责人
        - 显示公司能否在离任创始人缺席时继续执行
        - CEO / 董事会尽调，加 HR 留任数据。
      - - 股权结构表和优先股堆叠
        - 当前所有权、清算优先权堆叠、期权池、SAFEs 和任何结构化工具
        - 做真实下行测算和回报建模所必需
        - 财务 / 法务资料室，使用最新股权结构表导出和融资文件。
      - - 退出准备度和融资计划
        - 更新后的 2026 年经营计划、融资时点、投行反馈和战略兴趣图
        - 区分可存续的独立情景与被迫出售路径
        - 董事会材料、融资时间表和战略接触摘要。
    notes: 这些缺失事实最可能把建议从继续研究推向观察；如果结果令人失望，也可能从继续研究推向放弃。
    claimRefs:
      - CV013
      - CV041
      - CV042
      - CV043
      - CV044
      - CV049
      - CV050
