      - number: '7.5'
        title: 竞争和财务风险
        blocks:
          - type: paragraph
            body: >-
              竞争风险现在是不对称的。Covariant 仍有真实客户证据和可识别的技术叙事，但 Amazon 可以靠更强规模进攻，Intrinsic 可以从工具和生态深度进攻，Dexterity 可以用生产指标和物理 AI
              品牌进攻，ABB 也凭装机基础信任保持相关性。这不是说 Covariant 不能竞争；而是说，公司现在要赢过一批交易对手，它们要么控制更多部署界面，要么资产负债表更深，要么能被 Covariant
              所依赖的同一批集成商和仓库运营商采用。


              财务上，公开记录证明了历史融资，却不能证明当前偿付能力。SEC 文件和融资报道支持此前较大的融资基础，但当前现金、烧钱速度、现金跑道和债务仍未披露。这一点尤其重要，因为 Amazon
              交易很可能同时改变收入机会和费用结构。员工转移后，公司可能更精简；但如果投资人把这笔交易解读为技术验证叠加独立公司受损，下一轮融资也可能更难。对于一家仍绑定部署节奏和仓库资本开支的深科技公司，这种组合即使没有即时困境证据，也会形成真实融资风险。
