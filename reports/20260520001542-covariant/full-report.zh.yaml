      - number: '4.2'
        title: 公开牵引信号真实，但未达到 ARR 或收入披露
        blocks:
          - type: paragraph
            body: >
              公开材料中最好的财务信号是运营性的，而非会计性的。Covariant 2023 年融资公告和投资人报道称，公司 2022 年增长 6x，客户遍布 15 个国家，并有近 300 台机器人由 Covariant
              Brain 驱动。Amazon 2024 年公告补充说，创始人交接之后，Covariant 将继续服务数十个客户；KNAPP
              相关材料也仍显示，其软件位于多个地区的真实仓储项目中。这些都是有意义的信号，说明公司商业上真实存在，不是只做研究的机器人创业公司。

              即便如此，同一批来源没有说出决定性的运营指标。没有抓取来源给出 ARR、GAAP
              收入、毛利率、客户集中度或留存。因此必须区分牵引和投资判断：公开证据支持一个数千万美元量级的分析性收入框架，因为公司部署太多、融资太充分，不像是前收入阶段；但它不支持一个硬数字。因此，公开图景是有规模但无精度：足以相信
              Covariant 有业务，不足以知道这门业务是由经常性软件主导、由重服务部署项目主导，还是由少数大型伙伴关联账户主导。
