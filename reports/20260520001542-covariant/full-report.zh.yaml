  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与核心投资判断框架
        blocks:
          - type: paragraph
            body: >
              Covariant 仍通过了战略相关性的第一道筛选。公开来源显示，这是一家仍在运营的机器人 AI 公司，所处仓库自动化品类被多家分析机构预计会持续扩张；公开来源也显示，Amazon
              足够想要创始人和机器人基础模型栈，愿意签许可并招走关键人员。这一组合很重要：它说明技术是真的，终端市场够大，公司并不只是早期演示故事。


              问题在于，投资判断现在比技术验证脆弱得多。Amazon 交易带走三位具名创始人和约四分之一员工，同时让一个大得多的平台直接访问 Covariant 模型。与此同时，Covariant
              表示会在新领导层下继续服务数十家客户，KNAPP 不久后也公开延长合作。画面因此很混合：证据足以相信公司仍有有意义的商业价值，但不足以判断这种价值能否独立复利，还是会在 Amazon 阴影下停滞。


              因此，正确结论是继续研究，而不是立刻给出正面建议。公开证据没有披露
              ARR、毛利率、留存、集中度，也没有披露新投资人实际进入的当前价格。缺少这些输入，本章无法支撑精确估值；只能说，考虑到创始人之后的重置，溢价的后期价格很难辩护。正确姿态是先要求更新财务、客户续约证据，以及更清晰的
              Amazon 许可边界，再把 Covariant 视为可大额投资标的。
