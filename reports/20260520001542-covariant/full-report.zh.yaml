      - number: '2.4'
        title: 增长驱动、采用约束与时点摩擦
        blocks:
          - type: paragraph
            body: >
              需求逻辑很强，而且由多种因素共同驱动。劳动力稀缺和劳动力成本仍是最清晰的近端驱动：SupplyChain247 引用的 Peerless Research Group 数据显示，55%
              的运营商把劳动力可得性列为采用机器人的首要原因，42% 提到劳动力成本。LogisticsViewpoints 对 ProMat 2025 的报道，将问题描述为仓储和物流领域不断加剧的劳动力危机；IFR 也明确把
              cobot 动能与劳动力短缺相连。电商增长、当日达承诺和 SKU 扩张构成第二个结构性驱动，迫使运营商以更快速度处理更多单元和更多样的物品。再往上，AI 栈本身也在改善：Mordor 强调 AI
              视觉和车队编排是增长杠杆；Hy-Tek 的 2026 趋势文章则认为，仓库正在变成软件定义环境，AI、WES 和机器人作为一个系统协同工作。

              对 Covariant 来说，软件趋势和机器人趋势一样重要。当买方的注意力从再买一块金属，转向通过感知、推理、编排和更快重派工，从机器人工作流中榨出更多生产率，公司的商业逻辑就会改善。这也是 RaaS
              和类订阅交付模式重要的原因，即使 Covariant 本身不是全栈融资方：支出从大型前置项目转向更灵活的自动化计划后，更多运营商可以测试软件驱动的机器人，而不必批准完整的新建场地改造。

              约束仍然实质存在。存量场地集成是来源集中最持久的摩擦：遗留 WMS/WES/ERP 栈、设施布局、安全流程和本地流程变通都会拖慢部署。资金审批是另一道硬门槛——SupplyChain247 称，即使兴趣高涨，只有
              32% 受访运营商已经获批新机器人项目资金。安全和合规进一步拖累进度。ANSI/A3 R15.06-2025 及其与 ISO 10218 的协调，提高了制造商、集成商和用户的负担；OSHA
              的机器人安全指引也凸显，真实工业场景里仍有大量危险需要通过工程设计绕开。最后，信任和变更管理比多数自上而下 TAM 幻灯片承认的更重要：Hy-Tek
              明确指出，跨职能准备、培训和透明的工作流重设计，是持续采用的前提。
