  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争框架：软件同业、全栈平台与替代方案
        blocks:
          - type: paragraph
            body: >
              Covariant 首先应与其他机器人智能软件厂商比较，而不是只和机器人制造商比较。围绕 RFM-1 的公开报道和 Covariant
              自身表述，都把公司放在帮助机器人在拣选、上料、分拣、拆垛等仓储任务中看见、推理并适应的层。因此，最接近的直接对手，是追逐类似软件或模型层的平台——Intrinsic、Dexterity、Mujin、OSARO，以及范围更窄的
              Realtime Robotics——而不是每一个销售金属和输送线的仓储自动化供应商。


              第二圈竞争，即使产品重叠没那么精确，战略上更危险。Amazon Robotics 和 Symbotic 控制的运营环境、采购预算和部署表面远大于 Covariant。Berkshire Grey、Boston
              Dynamics Stretch 和 Bright Machines 也重要，因为它们销售更打包的自动化结果，可能把预算从纯软件层拉走。从这个意义上，Covariant 既在和同业 AI
              厂商竞争，也在和买方购买更大交钥匙系统的决定竞争。


              最后一类替代者是现状：人工、确定性固定自动化，以及 OEM 主导的机器人工作站，其智能足以应对狭窄、重复流程。当 SKU 变化、存量场地约束和重派工压力高到让静态自动化显得过脆弱时，Covariant 才能赢。
