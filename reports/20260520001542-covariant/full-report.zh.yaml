      - number: '8.2'
        title: 价格背景和可比公司读数
        blocks:
          - type: paragraph
            body: >
              Covariant 的公开融资证据在某个节点前扎实，但恰好在估值判断最关键处变弱。SEC 文件和轮次报道相互印证了 2021 年 Series C、2023 年 $75M 延伸轮，以及约 $222M
              累计披露融资。之后，抓取到的公开来源没有给出清晰、可验证的独立估值，也没有同时给出判断 Covariant 该享受软件溢价、硬件折扣还是重组折价所需的收入和留存指标。这不是小的数据不便，而是核心估值问题。


              因此，最有用的锚来自可比结果。Yahoo 2026 年 5 月的 Symbotic 估值页面列出约 $5.99B 市值、$2.52B 过去十二个月收入和约 2.26x
              销售倍数，为规模大得多的仓库自动化公司提供公开基准。Berkshire Grey 2023 年 3 月以约 $375M 出售给
              SoftBank，说明当规模和独立性令人失望时，仓库自动化股权会多快压缩。Dexterity 2025 年 3 月以投后估值 $1.65B 完成 $95M 融资，说明私募投资人仍愿意为物理 AI
              胜者付高价；但这类溢价通常绑定新融资事件和牵引力叙事，而不是不透明的历史估值标记。


              合在一起，这些可比项意味着 Covariant
              应用宽区间和情景折价估值，而不是单一英雄式目标价。公司或许值得高于困境自动化倍数，因为技术有辨识度，客户基础真实。但在经济性未披露的情况下，任何数十亿美元级进入价，都等于要求投资人支付软件平台价格，同时接受异常高的治理、领导层和商业化不确定性。
