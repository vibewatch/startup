      - number: '2.5'
        title: 尽调缺口与投资判断含义
        blocks:
          - type: paragraph
            body: >
              市场显然真实，但尽调不应夸大精度。公开分析师报告证明仓储机器人市场大且在增长，公开客户证据显示 Covariant 已参与真实生产流程。它们没有给投资人的，是一个只针对 AI 智能层、直接发布且干净的
              TAM。缺失这一层，不只是电子表格上的小麻烦——它会影响 Covariant 究竟按广义仓储机器人赢家、更窄但质量更高的软件切口，还是按伙伴主导且独立定价权弱于纯软件叙事的机器人应用公司来判断。

              两个矛盾应该保留，而不是抹平。第一，市场估计跨度大，因为有些发布方狭义测算仓储机器人，有些则把更广自动化系统纳入，或采用更长预测期。第二，采用动能强，但预算转化弱得多：劳动力稀缺、电商压力和 AI
              进步制造兴趣，可许多运营商仍没有获批资金，也没有干净的集成准备。正确的尽调问题因此应下沉到 TAM
              之下：按买方细分的管线、部署周期、不同场地类型的集成负担、回收期、伙伴渠道经济性、软件附加率、不同部署模型的毛利率，以及当底层机器人硬件和 WES 层由他人提供时，Covariant 模型还能保持多大差异化。

              实际看，若投资逻辑围绕更大自动化建设中的受限、软件牵引切口来展开，Covariant 的样子最好。上行情景是，仓库变得更由 AI 定义，软件捕获增长快于硬件。下行情景是，价值不成比例地流向集成商、OEM
              或更广自动化平台，而 Covariant 仍只是重要但非主导的一层。这种张力正是矛盾测算口径和未解尽调问题应留在本章，而不是被简化掉的原因。
            claimRefs:
