      - number: '5.2'
        title: RFM-1 的公开架构是多模态、偏仿真，目标是减少任务特定编程
        blocks:
          - type: paragraph
            body: >
              Covariant 公开叙事中最重要的技术变化，是从固定工作流自动化转向多模态推理接口。MIT Technology Review 报道称，RFM-1
              可接收五类输入——文本、图像、视频、机器人指令和测量值；TechCrunch 则将面向客户的交互描述为文本或语音提示，刻意做得像
              LLM。两家媒体报道的公开演示显示，模型不仅能识别被要求的物品，还会在执行前生成预测的动作后图像或视频。这很关键，因为产品主张不只是“更好的感知”，而是试图用更高层意图，加上对物理结果的学习式预测，让机器人行为可编程。

              Covariant 和伙伴材料一致主张，这一点重要，是因为传统工业自动化在环境或物体集合变化时会失灵。Radical 的技术文章称，RFM-1
              结合通用互联网数据与多模态物理交互数据，并用学习到的世界模型行为，在严格准确率约束下推理。MIT 报道还补充，模型在抓握不佳时可以请求帮助；这是一个微妙但重要的产品信号：Covariant
              试图让仓储机器人可交互、可恢复，而不只是狭义自治。因此，核心尽调问题不是 RFM-1 在文字上是否听起来亮眼——它确实亮眼——而是这层推理能力有多少已经进入日常生产，又有多少仍停留在引导演示模式。
