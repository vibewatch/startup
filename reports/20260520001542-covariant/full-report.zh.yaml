  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式可读，但实际定价不透明
        blocks:
          - type: paragraph
            body: >
              Covariant 的公开材料一致把公司描述为向仓储机器人销售智能，而不是销售全栈自动化系统。BusinessWire、Index Ventures、Amazon 2024
              年公告和更早产品报道都指向同一种商业形态：公司提供 Covariant Brain 或机器人基础模型层，通过伙伴和客户安装完成部署，并在调试、支持和模型改进中持续参与。这让业务在财务上比干净的 SaaS
              订阅更复杂。工作站上线之后，可能存在软件或平台费、部署或集成工作流，以及某种持续支持或使用组件。

              公开证据没有给出的是定价瀑布。Covariant 当前网站没有标价，伙伴新闻稿不披露实际合同条款，2024 年后最强的变现线索是战略授权：Amazon 称其签署了 Covariant
              机器人基础模型的非独家授权，而 Covariant
              继续服务外部客户。这种组合有吸引力，因为软件和授权长期利润率应高于部署服务；但也意味着，只有在管理层披露合同结构、续约行为，以及软件、服务和一次性战略交易的拆分之后，收入质量才能被判断。
