      - number: '8.4'
        title: 退出准备度和最终尽调负担
        blocks:
          - type: paragraph
            body: >
              公开证据今天不支持 IPO 承销框架。深科技自动化公司的可信 IPO
              路径，通常需要披露收入规模、增长耐久性、利润率轨迹、客户集中度控制，以及足够独立性，让公开市场投资人能评估管理层，而不是猜测主导合作伙伴的影响。Covariant
              还达不到这个公开信息标准。它最强的可见资产是技术相关性、真实部署足迹，以及 Amazon 交易后持续客户运营——这些都有价值，但仍更像战略可选性，而不是近期上市准备度。


              因此，战略 M&A 或继续私营运营更现实。Covariant 仍可能吸引想要成熟仓库 AI
              模型、客户参考和合作伙伴集成的工业、物流或云买家。但即便这一逻辑成立，也取决于公开来源缺失的尽调：当前股权结构和优先股堆叠、收入构成、留存、支持人员配置、Amazon 许可的确切范围，以及外部客户是否仍把
              Covariant 视为中立方。


              这些缺失事实正是本章以继续研究收尾的原因。公开记录足以说明业务有价值、市场很大。但不足以说明有多少价值仍属于少数股东、价值能多快复利，或下一轮融资是否会从强势位置发生。在这些问题得到回答前，有纪律的投资人应把
              Covariant 视为被监测机会，而不是高确信买入。
