  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >
              Covariant 应按 AI 软件和智能层公司来测算，而不是按机器人硬件 OEM。公司公开材料、TechCrunch 对 RFM-1 的报道，以及 Amazon 2024 年 8 月授权公告，都把
              Covariant 描述为构建模型和软件，让机器人能在履约和配送流程中看见、推理和行动。这一点很关键，因为多数公开市场报告测算的是整个仓储机器人或仓储自动化系统——包括硬件、输送线、AS/RS
              和更广的设施自动化——而 Covariant 只捕获其中更窄、由软件牵引的一部分支出。

              因此，本章的实用边界采用三层同心圆。第一层是广义仓储自动化，包含机器人、软件、存储、输送和相邻基础设施。第二层是纯仓储机器人，包含机器人拣选、搬运、分拣、上料及相关系统。第三层是与 Covariant 相关的
              AI 软件 / 智能层：感知、推理、编排、派工、集成、监控和模型更新，叠加在已安装机器人工作站之上。纳入 Covariant 相关需求的支出，因此包括机器人智能软件、接入 WMS/WES/ERP
              的流程集成、部署服务和持续支持。排除项包括大多数机器人硬件、固定自动化基础设施、新建场地改造，以及人工成本本身——除非这些成本构成替代的经济理由。

              现状替代方案同样重要。在许多设施里，既有选择仍是人工，尤其是非规则物品拣选、异常处理，以及单调但变化多的仓储任务。在自动化程度更高的场地，替代者不是人，而是老式固定自动化、基于规则的工业机器人、传统仓储软件，或更简单的
              cobot / AMR 部署——它们解决搬运，但不提供更通用的智能层。正是这套替代逻辑，说明 Covariant 的市场邻近完整仓储机器人 TAM，却不等同于它。买方已经相信自动化，但需要更好的 AI
              表现、更快重派工，或更灵活地处理物流和相邻工业流程中的 SKU 变化时，Covariant 才能赢。
