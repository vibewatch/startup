            body: >-
              公开耐久性证据是定性的，不是合同层面的。Obeta 出现在 2020 年报道中，后来又出现在 KNAPP 材料里；KNAPP 本身在 2024 年 8 月续签并扩展关系；Amazon 也明确表示，创始人交接后
              Covariant 会继续服务数十家客户。FeaturedCustomers 和 CB Insights 还显示，除了深度案例研究，公司还有更广的客户证言和参考界面。


              缺的是典型 SaaS 或企业指标层：抓取包没有找到公开 NRR、GRR、流失率、标准合同期限或头部客户暴露。这意味着本章可以给 Covariant
              评为客户证据可信、连续性指标合理，但不能说它已经公开证明了留存质量。任何投资或收购尽调，在过度依赖公开参考集之前，都应要求队列表、续约历史、按渠道拆分的装机基础 ARR，以及前 10 大客户集中度。
