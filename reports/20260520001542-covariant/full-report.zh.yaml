      - number: '1.4'
        title: 里程碑、客户证明与不利背景
        blocks:
          - type: paragraph
            body: >
              即使部分商业指标不清，Covariant 的公开时间线仍然连贯：2017 年创立；2019 年末前在 Obeta 早期上线部署；2020 年和 2021 年公开完成 Series B、Series C；2023
              年 4 月完成资本扩展；2024 年 3 月发布 RFM-1；2024 年 8 月续签 KNAPP 合作，并与 Amazon 达成授权 /
              人才交易。这足以证明它是一家真实运营的公司：有上线部署、重复融资，也把产品从任务特定型仓储 AI 演进到更宽的基础模型叙事。


              以私营公司标准看，客户和伙伴证明很强。KNAPP 公开点名 McKesson 和 Obeta，GeekWire 点名 Otto Group 和 Radial，公司关联的交易后报道称 Covariant 已与超过
              50 个客户和伙伴合作，打造数百个 AI 驱动的机器人解决方案。这些说法未经审计，但有方向性价值，因为它们伴随具名交易对手和具体用例。


              主要不利视角是结构性的。Amazon 交易验证了技术，但也让 Covariant 面临创始人交接风险，并把这笔交易放进 2025-2026
              年围绕反向收购式招才和反垄断审查的更广讨论中。对投资人更关键的是，收入、ARR、债务、董事会构成、当前员工数，以及任何 2023 年后的估值，在公开来源中都只部分可见。
