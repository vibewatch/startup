      - number: '6.5'
        title: 最大的客户风险是渠道依赖、集中度不透明和 Amazon 之后的信心风险
        blocks:
          - type: paragraph
            body: >-
              Covariant 的客户叙事最强处，也正是风险来源：公司的公开证据高度集中在合作伙伴主导的仓库部署，尤其是 KNAPP 渠道。这带来杠杆——截至 2024 年 8 月，KNAPP 有 26
              家上线客户——但也意味着 Covariant 相当一部分公开市场进入、客户背书和部署可信度压在一个渠道伙伴身上。公开来源没有回答：装机收入有多少来自 KNAPP，续约时这些部署有多粘，或少数灯塔客户是否主导
              ARR。


              Amazon 交易又加了一层风险。交易验证了技术，但也带走三位高知名度创始人和约四分之一员工，并把这一结构置于 2025-2026 年更广泛的反向收购式招揽审查周期中。Amazon、MMH 和 KNAPP
              都给出了客户服务运营延续的理由；但在 Covariant 披露续约队列、支持指标或集中账户暴露之前，客户耐久性应被视为部分证明，而不是完全解决。
