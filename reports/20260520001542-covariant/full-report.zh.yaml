      - number: '4.4'
        title: 资本支持已验证；当前现金充足性未验证
        blocks:
          - type: paragraph
            body: >
              Covariant 财务历史中最具体的部分是融资记录。SEC 搜索结果和原始 Form D 文件显示，2021 年和 2023 年在 Embodied Intelligence 或 Covariant
              名下有豁免发行活动；这些文件中的金额与广泛报道的 2021 年 $80M Series C 和 2023 年 $75M 扩展轮高度一致。BusinessWire、TechCrunch 和多份融资摘要都称，2023
              年扩展轮使披露累计融资达到 $222M。同样重要的是，2023 年融资被明确包装为客户需求资本：管理层称，这笔钱将帮助零售商和物流服务商更快、更少扰动地部署机器人拣选。

              这足以得出结论：Covariant 曾获得有意义的资本支持，并把资金投入研发和部署扩张。但这不足以说明公司目前资金充裕。没有抓取来源给出当前现金、债务、月烧钱或资金跑道；2024 年 Amazon
              交易把创始人和约四分之一员工移出公司，很可能改变了费用基数。因此，最安全的公开结论是有条件的：Covariant
              历史上筹到足够资金，能打造严肃的机器人软件平台；但如果没有管理层账目和当前现金预测视图，就无法判断当下融资依赖度。
