      - number: '1.2'
        title: 创始人、接班与治理可见度
        blocks:
          - type: paragraph
            body: >
              作为机器人应用公司，Covariant 的创始阵容异常强。公开记录一致将 Pieter Abbeel、Peter Chen、Rocky Duan 和 Tianhao Zhang 列为创始团队；Berkeley
              Robot Learning Lab 和 OpenAI 背景解释了公司为何能可信地讲出基础模型叙事。创始人履历重要，是因为公司的差异化更多取决于模型质量、部署学习和技术可信度，而不是商品化硬件。


              2024 年 8 月，Amazon 聘走 Chen、Abbeel 和 Duan，以及约四分之一 Covariant 员工，领导层发生实质变化。抓取到的来源一致显示，Ted Stinson 从 COO 转任
              CEO，联合创始人 Tianhao Zhang 留下协助领导独立公司。运营连续性因此保住了，但关键人风险也很明显：原始投资逻辑的公众面孔转向
              Amazon，剩余公司必须证明，没有三位明星创始人也能继续销售、支持客户并推进技术路线图。


              治理披露仍然很薄。公开材料说明了当前高管交接，但没有给出最新董事会名单、当前投资人控制权，或交易后的清晰股权地图。对尽调来说，领导层连续性可见，治理透明度不可见。
