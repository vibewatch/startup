      - number: '5.4'
        title: 软件层面的公开信任信号比产品营销更薄，外部开发者足迹也明显稀疏
        blocks:
          - type: paragraph
            body: >
              抓取到的来源包显示，产品雄心和公开技术治理之间并不对称。Covariant 及其合作伙伴描述了更强的推理、自然语言任务下达、车队学习和广泛工作流覆盖，但抓取到的官方来源没有披露面向 RFM-1 或
              Covariant Brain
              的产品级软件认证制度、公开安全论证、模型卡、基准测试表、版本策略或外部安全审计。没有这些材料，并不能证明内部控制薄弱；但这意味着投资人无法凭公开证据验证，公司如何处理模型回滚、升级验证、人类接管边界或跨站点数据留存。


              开发者信号更克制。GitHub 的 robot-foundation-model 主题页没有公开仓库，搜索 “covariant” robotics 只找到一个无关运动规划项目，Hugging Face 上
              “covariant” 的模型搜索返回零个模型。抓取包里，GitHub 和 Hugging Face 的直接组织 URL 也返回 404。含义很直接：Covariant
              在以封闭商业栈运营，公开开发者界面极少。这可以保护 IP 和客户专属诀窍，但也意味着生态验证、第三方工具和公开可复现性落后于更广泛的机器人基础模型讨论。
