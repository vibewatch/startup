      nodes:
        - id: founder-exodus
          label: 创始人 / 人才出走
        - id: licensed-models
          label: Amazon 获得模型授权
        - id: product-velocity
          label: 产品 / 模型迭代速度风险
        - id: customer-confidence
          label: 客户信心风险
        - id: partner-confidence
          label: 合作伙伴信心风险
        - id: fundraising
          label: 融资压力
        - id: competition
          label: Amazon 竞争压力
        - id: revenue
          label: 收入 / 部署风险
        - id: valuation
