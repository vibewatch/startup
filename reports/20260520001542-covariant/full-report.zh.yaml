      - number: '7.3'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              Covariant 的监管和法律暴露，比简单贴上“AI 公司”标签更宽。其软件影响在人员周边工作的物理系统，因此相关框架包括 OSHA 的机器人指引、机器防护义务、ISO 10218 等工业机器人安全标准，以及
              EU AI Act 等更广泛 AI 治理进展。公开来源没有展示一套 Covariant
              专属、投资人可直接使用的合规栈，可以把这些制度清晰映射到已披露安全论证中。这不能证明不合规；但意味着买方和投资人必须自行检查站点层面的部署协议、OEM 接口、培训做法和事故处理。


              法律 / IP 层面公开上更不确定。Amazon 交易结构结合了人才转移和模型许可，2026 年法律评论和国会审查显示，反向收购式招揽结构正受到反垄断关注。同时，公开专利检索工具本身无法回答：Amazon
              可以立即利用哪些 IP，Covariant 留下了哪些资产，可访问专利线索是否清晰归属于这家仓库机器人公司，而不是同名或近名实体。结果不是今天已经有确定诉讼，而是围绕 IP
              边界、竞争法观感和长期争议风险的重大尽调缺口；若两家公司产品路线图分化，或前客户指称不公平竞争优势，风险会拉长。
