  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: Covariant 不公开披露正式留存队列，因此该图采用分析师耐久性代理指标，锚定长期标杆账户和合作伙伴续约中可见的公开延续信号。应把它视为情景基准，而不是公司报告的留存。
    data:
      columns:
        - 第 1 年留存率（%）
        - 第 2 年留存率（%）
        - 第 3 年留存率（%）
      rows:
        - label: 早期 KNAPP 相关部署（Obeta / McKesson 类）
          values:
            - 100
            - 95
            - 90
        - label: 企业直客和 3PL 部署（Otto / Capacity / Radial 类）
          values:
            - 100
            - 90
            - 85
        - label: 广泛混合客户基础（方向性代理）
          values:
            - 100
            - 88
            - 82
    approximationNotes: Covariant 不披露 NRR、GRR 或队列留存。这些百分比是保守的分析师代理，基于 Obeta 和 KNAPP 关系的可见持续性，以及缺少相反的公开流失数据。纳入该图只是因为章节需要留存队列图；尽调中应以公司数据替换。
    claimRefs:
      - CU005
      - CU012
      - CU025
      - CU032
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在计入有限可见公开缓释后，对 Covariant 主要风险簇的剩余严重程度视图。
    data:
      columns:
        - 可能性
        - 影响
        - 剩余敞口
        - 监控注记
      rows:
        - label: 领导层 / 技术转移
          values:
            - 高
            - 关键
            - 严重
            - 同时跟踪创始人、模型和客户连续性
        - label: 客户 / 合作伙伴集中度
          values:
            - 中高
            - 高
            - 高
            - KNAPP 和渠道信心是主要外部观察项
        - label: 监管 / 法律 / IP
          values:
            - 中
            - 高
            - 高
            - 授权与保留 IP 的边界、AI 治理清晰度是关键
        - label: 融资 / 现金跑道
          values:
            - 中
            - 高
            - 中高
            - 若尚未重新证明增长牵引力就需要新一轮融资，风险会急剧上升
