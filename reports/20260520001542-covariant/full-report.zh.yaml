      - number: '8.3'
        title: 情景分析和下行纪律
        blocks:
          - type: paragraph
            body: >
              情景框架比点估值更站得住脚，因为 Covariant 的结果分布由里程碑风险驱动，而不是由已披露运营基线驱动。乐观情景下，剩余团队留住客户，把 Amazon
              验证转化为持续外部需求，并最终证明公司能作为中立软件和模型层增长。在那个世界里，Covariant
              有可能支撑数十亿美元独立价值。但乐观情景不是今天的基准情景，因为投资人仍缺少收入结构、续约质量，以及原始技术优势有多少留在 Amazon 之外的证据。


              基准情景更保守。它假设 Covariant 仍存活且具备战略相关性，但市场会围绕客户连续性而不是前沿 AI
              光环重新定价。结果要么是溢价进入后的价值走平，要么在新财务披露出现前重置到较低私有估值。悲观情景也不是理论化的：如果 Amazon
              的招聘和许可交易演变成直接竞争替代，或合作伙伴在管理层需要新资金时放慢部署，可能结果更像承压战略出售候选，而不是软件独角兽。


              对新投资人而言，含义很直接。关键问题不是 Covariant 有没有上行空间；它显然有。问题是，在领导层扰动、融资风险和价值可能迁移到 Amazon
              被计入价格之后，还有多少上行属于外部股东。基于今天的公开证据，只有在进入价显著降低，或新一轮证据点出现之后，期望值计算才会改善。
