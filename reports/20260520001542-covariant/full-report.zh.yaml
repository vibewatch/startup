    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与运营模式
        blocks:
          - type: paragraph
            body: >
              Covariant 成立于 2017 年，今天仍更应被理解为一家私营 AI 机器人软件公司，而不是机器人 OEM。外界反复把公司描述为位于 Bay Area，但本地身份信号并不完全一致。Chamber of
              Commerce、Craft 和 Wikipedia 指向 Emeryville 的 5905 Christie Avenue，LinkedIn 仍标注公司位于 Berkeley，Amazon /
              TechCrunch 则使用更宽泛的 Bay Area 表述。审慎读法是，Covariant 位于 Berkeley 到 Emeryville 的走廊地带，不应被某个营销标签过度锚定。


              地址不清，商业模式更清楚。Covariant 销售 AI 软件，为工业机器人工作站提供拣选、分拣、上料、拆垛等仓储流程所需的智能能力。已落地产品长期是 Covariant Brain；2024 年 3
              月，公司借助既有部署基础推出 RFM-1，一个机器人基础模型，Peter Chen 将其描述为面向机器人语言的大语言模型。公开来源一致把 Covariant
              定位成软件优先、伙伴驱动，先服务物流生产自动化，再扩展到更广的制造和服务场景。
