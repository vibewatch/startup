  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 大市场和真实技术价值仍在，但不透明度叠加创始人离场后的风险，使结论落到继续研究，而不是立即投资。
    data:
      nodes:
        - id: market
          label: 大型仓储自动化市场
        - id: tech
          label: 差异化机器人 AI / 模型资产
        - id: customers
          label: 数十家客户 + KNAPP 延续性
        - id: opacity
          label: 未披露 ARR / 利润率 / 续约
        - id: amazon
          label: 创始人转投 Amazon；模型已授权
        - id: discount
          label: 更高贴现率 + 更宽估值区间
        - id: decision
          label: 建议：继续研究
      edges:
        - from: market
          to: decision
        - from: tech
          to: decision
        - from: customers
          to: decision
        - from: opacity
          to: discount
        - from: amazon
          to: discount
        - from: discount
          to: decision
    approximationNotes: 这条流线表达的是因果关系，不是数字模型；它说明为什么产品证据即便偏正面，仍补不上投资论证缺口。
    claimRefs:
      - CV006
      - CV009
      - CV013
      - CV023
      - CV035
      - CV043
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 即便采用慷慨的软件式收入和倍数假设，得到的区间仍很宽；相对溢价的后期入场价，上限仍受约束。
    data:
      items:
        - label: $25M 收入 @ 4x
          value: 100
        - label: $40M 收入 @ 6x
          value: 240
        - label: $60M 收入 @ 8x
          value: 480
        - label: $80M 收入 @ 10x
          value: 800
        - label: $100M 收入 @ 12x
          value: 1200
    approximationNotes: 数值是以百万美元计的企业价值示例，基于公开收入不透明度假设搭建，并非来自公司披露指引。
    claimRefs:
      - CV014
      - CV024
      - CV025
      - CV033
      - CV034
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 独立价值分布很宽，只有乐观情景能明确支撑溢价入场；基准情景则指向估值重置风险。
    data:
      items:
        - label: 悲观结果
          low: 200
          high: 800
          unit: $M
        - label: 基准结果
          low: 800
          high: 1800
          unit: $M
        - label: 乐观结果
          low: 2500
          high: 5000
          unit: $M
    approximationNotes: 结果区间反映的是可比公司锚点、里程碑风险，以及 Amazon 交易后的贴现率变化，而不是单一正式模型。
    claimRefs:
      - CV034
      - CV038
      - CV039
      - CV040
      - CV048
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会式评分说明：公司战略上有吸引力，但估值支撑还不够干净。
    data:
      items:
        - label: 市场机会
          value: High
        - label: 产品差异化
          value: Strong
        - label: 客户验证
          value: Medium
        - label: 财务披露
          value: Low
        - label: 关键人物延续性
          value: Low
        - label: 独立估值支撑
          value: Low
        - label: 总体判断
          value: research-more
    approximationNotes: KPI 分值由本章证据综合得出，意在作为投委会摘要，不是公司披露指标。
    claimRefs:
      - CV012
      - CV013
      - CV023
      - CV035
      - CV043
      - CV044
      - CV045
