  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层以仓库为先，并分成直接企业客户和集成商主导渠道
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个聚焦但有分量的客户基础，而不是宽泛横向软件足迹。Covariant 的买家主要是仓库运营商、零售商、3PL
              以及医疗或工业分销商，他们想自动化单件拣选、分拣、导入和相关履约瓶颈。用户通常是站点层面的运营或自动化团队，经济买方则在供应链领导层，或是牵头更大仓库现代化项目的系统集成商。


              渠道组合很关键。一些证据像是直接企业赢单——Otto Group、Capacity 和 Radial；另一些来自 KNAPP 和 ABB 等部署伙伴。这种渠道结构扩大触达、加快部署，但也意味着 Covariant
              相当一部分公开客户证据由合作伙伴案例研究转述，而不是直接披露的客户合同。结果是：客户基础看上去商业上真实、国际分布也成立，但客户归属、定价权和收入集中度仍部分不透明。
