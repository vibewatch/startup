      - number: '2.2'
        title: 多重测算口径、相互矛盾的估计与软件切口
        blocks:
          - type: paragraph
            body: >
              公开仓储机器人市场规模在增长方向上一致，但绝对金额并不一致。Grand View Research 认为市场从 2023 年 $4.93B 增至 2030 年 $17.29B，CAGR 为
              19.6%；MarketsandMarkets 估计 2023 年为 $6.1B、2028 年为 $10.5B，CAGR 为 11.4%。Allied Market Research 明显更乐观，给出 2023
              年 $7.07B、2032 年 $31.34B；Mordor Intelligence 则将 2025 年市场定为 $9.33B，并增至 2031 年
              $24.55B。这些不是小的编辑差异，而是反映了不同品类定义、预测窗口、组件边界，以及机器人系统和更广仓储自动化基础设施的不同比重。

              最可辩护的读法，不是选一个数字，而是保留估计区间，并锚定谨慎的共识簇。2023 年，重叠的分析师区间约为 $4.9B-$7.1B，意味着纯仓储机器人的中点约
              $6B。再往上，是大得多的仓储自动化层：Precedence Research 估计 2025 年为 $25.27B，强化了一个判断——机器人智能厂商受益于更广的支出生态，但不会捕获全部。对 Covariant
              来说，更有决策价值的视角，是仓储机器人内部的软件切口。Grand View 认为软件到 2030 年 CAGR 约 21%；Mordor 称硬件仍占 2025 年支出的约
              70%，但软件是增长最快的层；Precedence 称硬件拿走 2025 年仓储自动化收入的 80%。合在一起，这些数据说明 Covariant
              追逐的是总市场美元中的少数份额，但这个份额具有战略价值，且可能利润率更高。

              这套逻辑支持一个受证据约束的金字塔，而不是激进的 TAM/SAM/SOM 模型。广义仓储自动化是外圈，仓储机器人是直接系统市场，软件 / 编排切片是 Covariant
              真正捕获价值的更窄层；当前可取得的切口还要更窄，集中在存量和新建配送作业中的软件牵引拣选、上料、分拣、拆垛和货物转移。本地来源包没有直接发布纯软件 SAM，所以以下图示值刻意标注为近似值，而不是公司背书预测。
