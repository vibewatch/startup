      - number: '3.3'
        title: 既有巨头、相邻平台与重规模威胁
        blocks:
          - type: paragraph
            body: >
              Symbotic 不是一对一的软件同业，但它是最严肃的战略威胁之一，因为它向大型零售商和杂货商销售整座设施的结果。其公开指标——大幅节省人工的说法、42 个 Walmart
              配送中心部署，以及与已融资开发项目绑定的 400-APD 管线——展示了当仓储自动化变成董事会层面的资本开支平台，而非软件层采购时会发生什么。Berkshire Grey
              从拣选、分拣、包装和挂车卸货等相似交钥匙方向竞争，即使其范围和当前规模看起来小于 Symbotic。


              Boston Dynamics Stretch 和 Bright Machines 更相邻，而非直接等同。Stretch 是适合存量场地的卸货和箱件处理机器人；Bright Machines
              是一个软件定义制造平台，连接设计、部署和工厂自动化。当运营商想要打包机器人结果，而不是第三方硬件上的可泛化 AI 层时，两者仍会从同一个自动化预算池里拿钱。


              最深的结构性压力仍来自既有厂商。ABB、FANUC、KUKA/Swisslog 和 Yaskawa 已经销售广泛机器人组合、仿真或控制软件以及现场支持。工业机器人采用率上升意味着，这些厂商不必在每个 AI
              基准上击败 Covariant；它们只要把捆绑自动化做到足以满足已经信任它们的客户即可。
