      - number: '7.4'
        title: 运营和合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Covariant
              的运营模式依赖真实仓库部署、合作伙伴集成，以及来自真实世界使用的持续模型改进。这让运营风险与商业风险异常交织。部署放慢，数据积累就放慢；数据积累放慢，相对更大竞争者的差异化就更难维持。公开来源还显示，许多机器人事故发生在非常规情境，这一点很关键，因为
              Covariant 的部署就在繁忙仓库环境里，调试、维护、异常处理和人机交互恰恰是产生运营压力的时刻。


              合作伙伴集中度会放大这种暴露。KNAPP 是 Covariant 拥有有意义渠道牵引力的最清楚证据，但也提醒我们，相当一部分公开客户验证流经外部集成商。ABB
              关联部署也有同样两面性：触达更广，直接控制更少。如果关键 OEM、集成商或渠道伙伴降低 Covariant
              优先级、推动替代技术栈，或只是暂停铺开以重新评估创始人离开后的支持质量，影响会从待交付订单传导到数据流，再传导到收入信心。因此，Covariant 的合作伙伴风险不只是商业依赖，也是产品学习和执行依赖。
