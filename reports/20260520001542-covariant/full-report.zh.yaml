  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Covariant Brain 仍是商业切口，RFM-1 则把产品扩展为更通用的机器人推理层
        blocks:
          - type: paragraph
            body: >
              公开证据指向清晰的产品演进，而不是硬性的产品重置。Covariant 长期商业资产是 Covariant Brain，一个用于仓储机器人工作站内部的统一 AI 层，而不是独立机器人硬件
              SKU。BusinessWire、Index Ventures、Engineering.com 和 LinkedIn 都把公司描述为构建软件，让机器人能在动态履约场景中看见、推理和行动。到 2023
              年，官方材料称，同一平台已从核心拣选扩展到件拣、箱拣、订单分拣、物品上料、货到人订单拣选、配套和拆垛。这种宽度重要，因为它暗示 Covariant 的差异化不在单次演示，而在跨相邻人工仓储任务复用同一学习栈。

              RFM-1 在这套安装基础之上增加了第二层。TechCrunch、MIT Technology Review 和 Radical Ventures 2024 年 3 月的报道，把它定位成类似 LLM
              之于机器人语言的机器人基础模型，但训练数据来自真实部署的仓储系统，而不只是网页级文本。审慎读法是，Covariant 与其说替换了 Covariant
              Brain，不如说重新包装并扩展了它：更老的商业平台提供部署数据、客户工作流契合度和现场执行语境；RFM-1
              则旨在让这些系统更可泛化、更容易派任务。这在战略上有吸引力，因为它把前沿模型故事绑定到已经承载收入的车队，而不是未发布的实验室原型。
