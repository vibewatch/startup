      - number: '3.2'
        title: 直接软件与模型层对手
        blocks:
          - type: paragraph
            body: >
              Intrinsic 和 Dexterity 是 Covariant 最尖锐的论题级可比公司，因为两者都试图用更高层软件抽象，让机器人行为更具适应性。Intrinsic 的卖点是开发者环境——Flowstate
              加可复用的感知、运动规划和传感器控制能力；Dexterity 则营销企业 Physical AI，如今公开把 Foresight 世界模型放在中心。两者攻击的，正是投资人本来可能认为只属于 Covariant
              的基础模型或世界模型领导权。


              Mujin 和 OSARO 不同，但仍足够直接，值得重视。Mujin 强调无代码控制、快速部署以及跨品牌和跨流程兼容，对那些想要确定性工厂和仓储自动化、又不愿押注更开放式基础模型故事的运营商很有吸引力。OSARO
              更窄，但商业上清晰：它通过 SightWorks 感知栈和 AutoModel 工具，聚焦高变化拣选、装袋、配套和拆垛。Realtime Robotics
              是这一组里最窄的，因为它卖的是运动规划和优化基础设施，而不是仓储应用套件；但在路径规划和编排比通用物品推理更重要的地方，它仍会侵蚀 Covariant 价值栈的一部分。


              似乎没有哪家独立厂商能在基础模型野心、伙伴主导部署和多工作流仓储聚焦这三点上全面匹配 Covariant。但这不代表赛道弱，而是说明买方可以从专业对手那里拼出可信替代方案；这些对手的强项正好对应具体采购优先级。
