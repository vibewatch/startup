      - number: '6.2'
        title: KNAPP 或客户案例研究给出运营细节的地方，具名客户证据最强
        blocks:
          - type: paragraph
            body: >-
              Covariant 过了基本采用门槛，因为抓取包里不只是客户标志。KNAPP 官方材料点名 McKesson、Obeta、Würth 和 Brødrene Dahl；MIT Technology Review
              增加了 Crate & Barrel 和 Bonprix；GeekWire 增加了 Otto Group 和 Radial；Capacity 有一页详细案例研究，明确写到吞吐量和扩张；Material
              Handling 24/7 则把 Active Ants 认定为首个 ABB 与 Covariant 联合安装项目。这一组合足以说明，公司在零售、3PL、医疗分销和工业批发领域都有真实生产参考。


              不过，提示中提到的线索并非同样扎实。GEODIS 最好只视为推断的 Covariant 参与站点，因为抓取到的 GEODIS/KNAPP 报道提到 Pick-it-Easy Robots，却没有直接点名
              Covariant；DHL 关联也无法从可访问的公开抓取来源中证实。换句话说，公开材料确立了真实客户证据，也说明尽调为什么要区分直接具名证据、合作伙伴转述证据、推断的技术栈参与和未证实线索。
