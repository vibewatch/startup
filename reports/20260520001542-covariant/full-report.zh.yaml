      - number: '5.5'
        title: 仓库操作场景的产品成熟度真实存在，更广泛的通用机器人路线图有吸引力，但公开证据仍不完整
        blocks:
          - type: paragraph
            body: >
              Covariant 最强的产品技术论点，不是它已经解决了通用机器人，而是它拥有有意义的仓库装机基础，可以以此继续推进。公开来源支持一条进展线：2019-2020 年 Obeta 部署，2023
              年前后工作流扩展，2024 年发布 RFM-1；Amazon 和 KNAPP 都显示，2024
              年创始人交接后，客户服务型运营仍在继续。足以把仓库操作成熟度评为明显超出试点阶段，尤其是在拣选相关工作流上。但不足以得出 Covariant 已经把这种能力规模化迁移到广泛、跨行业机器人推理上的结论。


              护城河仍是数据飞轮。TechCrunch、MIT Technology Review、Radical、BusinessWire 和 Index 都指向同一个战略想法：Covariant
              已部署系统产生真实世界操作数据，用来训练下一代模型。这比只靠实验室演示或开放权重起步的位置更好。但路线图风险同样真实。Amazon
              现在拿到了机器人基础模型的许可，原先面向公众的创始人离开，公开开发者界面仍然很薄。因此，产品尽调应聚焦：RFM-1 在现场多快替代或增强规则繁重的工作流逻辑；内部安全和发布门槛如何管控更新；2024
