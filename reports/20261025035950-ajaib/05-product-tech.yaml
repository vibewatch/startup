  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: production-architecture
      missingEvidence: System diagrams, cloud and custody dependencies, data flows, capacity tests, recovery objectives, and third-party concentration data.
      whyItMatters: The public product surface cannot establish scalability, resilience, segregation, or the operational blast radius of a dependency failure.
      diligencePath: Request architecture and data-flow diagrams, dependency inventories, capacity results, recovery tests, and recent incident postmortems from engineering leadership.
      relatedQuestionRefs: [QE003]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: security-privacy-reliability
      missingEvidence: Independent security assurance, privacy-control evidence, uptime history, material incident records, suitability testing, and regulator-origin license records.
      whyItMatters: Company-issued product and license descriptions do not prove control effectiveness or continuing regulatory standing.
      diligencePath: Obtain regulator extracts, penetration-test summaries, security certifications, uptime and incident logs, privacy assessments, and AI suitability-control documentation.
