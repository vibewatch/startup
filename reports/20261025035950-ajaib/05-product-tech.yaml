company:
  name: Ajaib
chapter:
  number: 5
  title: Product & Technology
  summary: Ajaib presents a broad, mobile-first investing surface spanning Indonesian securities, mutual funds, bonds, crypto assets, and U.S. stocks, with separate Lite and Pro experiences. Public evidence is strong on the customer-facing product map but weak on internal architecture, measured reliability, independent security assurance, and control effectiveness.
sections:
  - id: product-surface
    title: One account spanning multiple investing workflows
    body: >-
      Ajaib began as a mobile-first brokerage designed to remove branch and broker friction for
      first-time investors, and its public product surface has widened materially since that
      starting point. The current app listing describes Indonesian stocks, mutual funds, crypto
      assets, bonds, and U.S. stocks in one application, while a 2026 investor case study describes
      the strategy as keeping more of a customer's financial activity inside one account. The
      listing also separates Ajaib Lite, which emphasizes guided mutual-fund and bond discovery,
      from Ajaib Pro, which emphasizes active-trading tools and faster execution. This breadth is
      strategically useful because it creates multiple engagement paths, but the available
      evidence establishes product availability rather than adoption, revenue contribution, or
      retention by module. Those product-level performance measures remain a diligence request.
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE007, CE014]
    tableRefs: [TE001]
  - id: customer-workflow
    title: Friction removal is the core workflow design
    body: >-
      The clearest product thesis is workflow compression: replace an offline brokerage process
      with mobile onboarding, education, portfolio access, and trading in a single interface.
      Ajaib's app listing claims that registration, verification, and account opening can be
      completed online in five minutes; older independent reporting confirms that the original
      design deliberately omitted offline brokers and branches. The same listing exposes distinct
      paths for passive or guided investing, active trading, and cross-asset diversification.
      Tracxn separately lists portfolio management, rebalancing, risk-management, goal-management,
      and stock-alert tools, although the public materials do not show how those tools are
      implemented or used. The resulting workflow proposition is credible at the feature level,
      but measurable time-to-value, completion rates, support burden, and cross-product conversion
      are not publicly evidenced.
    claimRefs: [CE001, CE004, CE006, CE007, CE016]
    tableRefs: [TE002]
  - id: operating-architecture
    title: Observable architecture stops at the product and entity boundary
    body: >-
      Public evidence supports an operating map, not a verified software architecture. The visible
      access layer is an Android and iOS application; a third-party Android package page reports a
      92.2 MB package and Android 7.0-or-later requirement. The experience layer includes charting,
      order-book views, stop-loss and take-profit controls, order history, and a company-described
      proprietary Jeus execution engine. Beneath that surface, the app listing assigns Indonesian
      securities, mutual funds, crypto assets, and U.S. stocks to separate named legal entities and
      regulator relationships. This structure implies important service boundaries, but it does
      not disclose data flows, custody dependencies, cloud providers, latency, capacity, recovery
      objectives, or third-party concentration. The public GitHub organization is too sparse and
      fork-heavy to validate the production stack.
    claimRefs: [CE008, CE009, CE010, CE011, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-controls-and-roadmap
    title: Broad maturity signals coexist with control-evidence gaps
    body: >-
      Product maturity is visible through breadth, current Android compatibility, and the move into
      U.S. stocks and leveraged crypto products reported in 2025, but these are market-presence
      signals rather than proof of resilient operations. The app listing states that services are
      licensed or supervised by OJK, Bappebti, and, for the U.S.-stock entity, Bank Indonesia; no
      regulator-origin record in the assigned evidence independently verifies the current scope or
      standing of those permissions. The investor-authored case study also reports extensive use
      of AI for content and customer questions while describing a human-advisor boundary for
      recommendations. That is a relevant control claim, yet public evidence does not establish
      model governance, suitability testing, privacy design, penetration testing, uptime, incident
      history, or disaster-recovery performance. Investment underwriting should therefore treat
      the feature set as demonstrated and the underlying control environment as unverified.
    claimRefs: [CE005, CE009, CE012, CE013, CE014, CE015]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, Primary user, Public status or maturity, Differentiation signal, Diligence gap]
    rows:
      - [Indonesian stocks, Retail and active traders, Live in the current all-in-one app, Mobile-first access plus Pro trading tools, Product-level active accounts and execution-quality data]
      - [Mutual funds and bonds, Guided or longer-term investors, Live with Lite recommendations, Guided discovery inside the same account, Assets under administration and recommendation methodology]
      - [Crypto assets, Retail digital-asset traders, Live and expanded to perpetual futures in 2025, Cross-asset account breadth, Leverage controls and product-level incident record]
      - [U.S. stocks, Indonesian investors seeking global exposure, Reported live with more than 600 selected stocks, Rupiah access and a stated $1 minimum, Custody chain spreads and realized availability]
      - [Ajaib Pro, Experienced and active traders, Live according to the current app listing, Advanced charting order book and expedited execution, Adoption latency benchmarks and willingness to pay]
    notes: Public product availability and company-described features as of the 2026-10-25 access date; adoption, economics, and control effectiveness are not disclosed.
    claimRefs: [CE003, CE005, CE006, CE007, CE009, CE014]
  - id: TE002
    title: Customer workflow and evidence limits
    columns: [User job, Publicly described workflow, Ajaib solution, Measurable benefit, Limitation]
    rows:
      - [Open an investing account, Register and verify online, Mobile onboarding without a branch, Company claims completion in five minutes, No independent completion-rate or abandonment evidence]
      - [Build a diversified portfolio, Select across domestic and global assets, One app for stocks funds bonds crypto and U.S. stocks, Fewer product surfaces to navigate, No cross-product adoption or retention cohort]
      - [Execute and monitor trades, Use charts liquidity views triggers and history, Pro tools plus company-described Jeus engine, More controls in the trading interface, No independent latency fill-quality or uptime benchmark]
      - [Learn and obtain guidance, Use in-app education recommendations and questions, Lite recommendations plus AI-assisted education and support, Scaled access to investing content, No public suitability accuracy or support-resolution metric]
    notes: Benefits are limited to directly described workflow changes; outcomes and conversion rates are unavailable and are not estimated.
    claimRefs: [CE001, CE004, CE006, CE007, CE008, CE015, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or component, Observable role, Dependency, Principal risk or unknown]
    rows:
      - [Mobile client, Android and iOS access to investing workflows, Supported devices app stores and identity verification, Compatibility accessibility and release-quality history are only partially visible]
      - [Trading experience, Charting order book triggers history and fast-trade controls, Market data order routing and execution services, No independent execution-quality capacity or latency evidence]
      - [Jeus engine, Company-described order-processing and queue-placement engine, Internal trading systems and market connectivity, Architecture throughput and failover are undisclosed]
      - [Regulated product entities, Separate entities deliver securities funds crypto and U.S. stocks, Regulatory permissions custody and inter-entity controls, Current permissions and operational segregation need regulator-origin verification]
      - [Public developer surface, Six repositories shown on the GitHub organization page, Mostly forked or archived public code, Public repositories do not validate the production stack or security posture]
    notes: This is an evidence-bounded operating map, not a representation of undisclosed production architecture; null technical details remain diligence gaps.
    claimRefs: [CE008, CE009, CE010, CE012, CE013, CE015]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: The diagram maps only publicly observable layers and keeps undisclosed production internals outside the asserted architecture.
    data:
      layers:
        - label: Customer access
          items:
            - Android and iOS application
            - Fully online onboarding
          outputs:
            - Retail investor account access
        - label: Experience modes
          items:
            - Ajaib Lite
            - Ajaib Pro
            - Education and AI-assisted support
          outputs:
            - Guided and active-trading workflows
        - label: Product modules
          items:
            - Indonesian stocks
            - Mutual funds and bonds
            - Crypto assets
            - U.S. stocks
          outputs:
            - Multi-asset investing surface
        - label: Execution and regulated delivery
          items:
            - Company-described Jeus engine
            - Separate named operating entities
          outputs:
            - Order processing and product-specific delivery
        - label: External dependencies
          items:
            - Mobile operating systems and app distribution
            - Market data and market connectivity
          outputs:
            - Customer access and tradable-market reach
        - label: Public evidence boundary
          items:
            - Sparse public developer footprint
            - Undisclosed reliability and security controls
          outputs:
            - Architecture and control diligence requests
    approximationNotes: Layer order is analytical and does not assert undisclosed data flows, custody topology, infrastructure providers, or system boundaries.
    claimRefs: [CE002, CE008, CE009, CE012, CE014]
callouts:
  - calloutType: recommendation
    title: Underwrite the control plane, not just the feature list
    body: The next diligence step should test execution quality, uptime, recovery, custody dependencies, AI governance, privacy, and product-level incident records before assigning a technology moat.
    claimRefs: [CE008, CE009, CE012, CE013, CE015]
