company:
  name: Ajaib
chapter:
  number: 6
  title: Customers
  summary: Ajaib has assembled a broad, mobile-first retail investing proposition with reported customer scale above three million and a company page advertising five million investors, but public evidence does not establish funded-account activity, retention, or customer-level economics. The 2025 margin-trading controversy also shows that beginner acquisition and credit-enabled expansion carry material suitability and trust risks.
sections:
  - id: segments-and-value-proposition
    title: Segments and customer value proposition
    body: >-
      Ajaib targets Indonesian retail investors, especially beginners and younger, mobile-first users, while also exposing a multi-asset shelf that spans domestic equities, mutual funds, bonds, crypto, U.S. stocks, and other global assets. Its own pages emphasize beginner education, low entry amounts, and online registration, while third-party descriptions position the business as a fully online brokerage without physical branches. The buyer, user, and payer are generally the same retail investor, although Ajaib also reports institutional users for its over-the-counter stablecoin desk. This segmentation is strategically coherent, but public material does not disclose active-account definitions, funded-account conversion, revenue by segment, or whether institutional activity is material to consolidated economics.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-expansion
    title: Adoption trajectory and expansion
    body: >-
      Available evidence indicates meaningful adoption, but the reported counts are not directly comparable. Fintech Global reported more than three million customers, Insignia described a base that had crossed seven million in its 2025 account, Ajaib's current website advertises five million investors, and Fintech Garden cited a figure above 20 million retail investors. Insignia also reported 2025 platform transaction value of $13.4 billion, up 131%, and described roughly 80% of new customers as adopting more than one asset class or use case immediately; these are reported figures, not independently audited cohort data. The company is expanding the customer relationship through U.S. stocks, crypto, margin facilities, education, and institutional settlement, yet no public source in this pool provides churn, renewal, GRR, NRR, cohort curves, or a denominator for active utilization.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: proof-and-customer-risk
    title: Named proof, durability, and concentration risk
    body: >-
      Public customer proof is stronger for product availability and reported scale than for named production outcomes. Ajaib's app listing describes an all-in-one product, rapid online registration, and access to more than 600 U.S. stocks; its corporate pages describe more than three million investors and a five-million-investor headline, but neither establishes retention or investment performance. The 2025 Niyo dispute is adverse customer evidence: OJK requested a detailed explanation and internal-investigation report after a reported Rp1.8 billion transaction, while Ajaib said it found no system malfunction and that the account owner used a registered device and confirmation flow. Independent commentary raised concerns about whether margin could be presented as a default and about the lack of specific technical regulation. This episode supports a high-priority diligence ask on informed consent, complaint resolution, and customer concentration by product, not a conclusion that the platform was at fault.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation
    columns: [Segment, Buyer/user/payer, Use case, Scale or strategic value, Evidence gap]
    rows:
      - [Beginner retail investors, "Individual investor; user and payer", "Online account opening, guided investing, mutual funds and stocks", "Core acquisition wedge; Ajaib says the app is designed for beginners and low starting amounts", "No funded-account conversion, active-account count, or CAC by cohort"]
      - [Active retail traders, "Individual investor; user and payer", "Domestic stocks, U.S. stocks, crypto, ETFs, trading tools and margin", "Higher engagement and potential interest income; 2025 transaction value was reported at $13.4bn", "No product-level contribution margin, utilization, or loss data"]
      - [Multi-asset investors, "Retail investor; user and payer", "Cross-asset portfolio spanning stocks, funds, bonds, crypto and global assets", "Insignia reported roughly 80% of new customers adopting more than one asset class or use case immediately", "No cohort definition, time window, or independent corroboration"]
      - [Institutional and corporate clients, "Institutional investor or corporate treasury; payer", "OTC stablecoin settlement and cross-border digital-asset activity", "Strategic value through SBI's digital-asset network and institutional infrastructure", "No customer names, volumes, revenue share, or concentration disclosure"]
    notes: "Segments combine company-described product surfaces with third-party reported customer and transaction metrics; scale figures are not normalized to the same date or active-account definition."
    claimRefs: [CU001, CU003, CU005, CU008]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source and confidence, Implication, Missing denominator]
    rows:
      - ["Reported customer base", ">3 million", "Undated page retrieved 2026-10-25", "FinTech Global; medium confidence, company-reported", "Demonstrates broad reported reach", "Active, funded, and retained accounts"]
      - ["Advertised investor base", "5 million", "Website page retrieved 2026-10-25", "Ajaib; medium confidence, company-claimed", "Suggests a larger current marketing headline", "Definition, date, and reconciliation to customer count"]
      - ["Reported customer base", "More than 7 million", "2025 account described in 2026-09-03 case study", "Insignia Business Review; medium confidence, reported", "Suggests scale beyond the older 3m figure", "Active users, geography, and methodology"]
      - ["Reported retail investor base", "More than 20 million", "Reported 2026-09-01", "Fintech Garden citing The Straits Times; medium confidence, reported", "Would indicate substantially broader reach if measured on a comparable basis", "Definition, entity scope, activity threshold, and reconciliation to the 3m, 5m, and 7m figures"]
      - ["Platform transaction value", "$13.4 billion; +131% year on year", "2025", "Insignia Business Review; medium confidence, reported", "Signals high transaction activity and possible monetization surface", "Gross versus net value, active accounts, and revenue conversion"]
      - ["Multi-asset adoption", "Roughly 80% of new customers", "Undated founder account reported in 2026-09-03 case study", "Insignia Business Review; low-to-medium confidence", "Supports a cross-sell thesis if measured consistently", "Sample, cohort window, and repeat-use definition"]
    notes: "The figures are intentionally shown without reconciliation because the sources use different dates, issuers, and customer definitions; no retention metric is available in the assigned evidence."
    claimRefs: [CU003, CU006, CU007, CU008, CU009, CU015]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or proof subject, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - ["Niyo / I Nyoman Tri Atmajaya Putra", "Retail investor", "BBTN order through Ajaib Sekuritas; reported 9-lot intent and 16,541-lot matched transaction", "Production account incident, not a pilot", "OJK requested explanation and internal-investigation reporting; Ajaib said the account owner used a registered device", "Single disputed case; resolution and customer remediation are not established"]
      - ["Retail investor base", "Mass-market retail", "All-in-one access to stocks, funds, bonds, crypto and U.S. stocks", "Live product", "Ajaib and third parties report multi-million customer reach", "No named customer outcomes, funded-account data, or retention evidence"]
      - ["Institutional and corporate OTC clients", "Institutional/corporate", "OTC stablecoin settlement and cross-border transfers", "Live capability claimed in third-party reporting", "SBI describes the customer/infrastructure fit as strategic for its APAC digital-asset network", "No named deployments, transaction volumes, or customer references"]
    enumerationScope:
      coverage: partial
      basis: "Publicly documented customer cases and deployment descriptions available in the assigned 2025-2026 source pool"
    notes: "The pool contains one identifiable adverse retail case and broad customer/deployment descriptions, but no independently verified named customer case studies with quantified outcomes; rows therefore preserve limitations rather than treating logos or reach as retention proof."
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from entry to expansion
    type: journey-map
    summary: Ajaib's public customer path runs from low-friction beginner access through multi-asset use and potentially higher-risk margin or institutional settlement, with evidence quality weakening at retention and outcome stages.
    data:
      nodes:
        - id: entry
          label: "Discover and register"
          title: "Mobile-first entry"
          detail: "Ajaib markets fully online registration, beginner education, and low starting amounts."
          value: "Online account opening"
        - id: first-investment
          label: "Make first investment"
          title: "Start with accessible assets"
          detail: "Public product pages list stocks, mutual funds, bonds, crypto, and U.S. stocks."
          value: "Multi-asset shelf"
        - id: multi-asset
          label: "Adopt more assets"
          title: "Cross-sell across the app"
          detail: "Insignia reported roughly 80% of new customers adopting more than one asset class or use case immediately."
          value: "Roughly 80% reported"
        - id: active-trading
          label: "Trade and monitor"
          title: "Increase activity"
          detail: "The app advertises charts, order books, fast trade, alerts, and portfolio monitoring."
          value: "Trading tools"
        - id: margin
          label: "Use leverage"
          title: "Margin expansion"
          detail: "Ajaib markets margin and day-trading buying power; the 2025 dispute makes informed-consent controls a material diligence point."
          value: "Up to 2.85x buying power advertised"
        - id: durable-value
          label: "Retain and expand"
          title: "Unverified durability"
          detail: "No NRR, GRR, churn, renewal, cohort-retention, or active-utilization metric was found in the assigned pool."
          value: "Evidence gap"
    claimRefs: [CU001, CU005, CU008, CU009, CU011]
callouts:
  - calloutType: strength
    title: Broad retail reach with a coherent cross-sell surface
    body: >-
      The evidence supports a real multi-asset retail proposition and reported multi-million customer scale, with product breadth that can increase engagement beyond a single brokerage use case.
    claimRefs: [CU001, CU003, CU005]
  - calloutType: risk
    title: Customer quality and suitability remain unproven
    body: >-
      Conflicting customer counts, absent retention metrics, and the margin-trading complaint leave funded-account quality, durable usage, complaint handling, and product suitability unresolved.
    claimRefs: [CU006, CU007, CU010, CU011, CU012]
  - calloutType: recommendation
    title: Request cohort and complaint-resolution evidence
    body: >-
      Before underwriting expansion, request reconciled active and funded accounts by product, cohort retention and churn, top-customer concentration, margin opt-in and suitability logs, complaint outcomes, and product-level contribution margins.
    claimRefs: [CU007, CU010, CU011, CU014]
