  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is digital distribution of Indonesian retail investment products: domestic equities,
              mutual funds, bonds, exchange-traded products, selected overseas securities, and digital assets delivered
              through a regulated or compliance-dependent account relationship. Ajaib's public descriptions also mention
              payments, deposits, banking, and stablecoin infrastructure, but those adjacencies should not be added to
              brokerage TAM without separate revenue and licensing evidence. The practical substitute set includes
              branch-based brokers, bank-led investment channels, incumbent fund distributors, direct exchange or issuer
              access, and simply holding cash. The boundary therefore includes customer acquisition and transaction
              economics around investment accounts, while excluding the full market capitalization of assets held by
              customers.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
      - number: '2.2'
        title: Multiple sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              Available evidence gives several useful sizing lenses but no defensible single TAM. CEIC reports
              20,347,147 Indonesian capital-market investors in 2025, 19,192,846 mutual fund investors, 17,299,893
              sub-securities accounts in September 2026, and market capitalization of IDR 10,695 trillion in that month.
              These series represent different populations and units, so they cannot be summed or treated as a
              conversion funnel. Ajaib-specific reports range from more than three million customers in older or
              company-positioning accounts to more than seven million in 2026 coverage; the difference is not reconciled
              by a public definition of account, customer, or funded investor. The $1.35 billion implied post-money
              valuation from SBI's reported $270 million for 20% is a financing reference, not market size or proof of
              future share.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary user is a retail investor using mobile onboarding, portfolio monitoring, education, and order
              execution; the economic payer is generally the user through commissions, spreads, interest or product
              economics rather than an enterprise procurement department. Ajaib's platform breadth creates multiple
              adoption paths: a beginner can start with funds or domestic stocks, a more active user can add overseas
              equities or crypto, and institutional or corporate customers may use stablecoin or settlement services.
              Public sources describe younger and first-time investors as a target, while market-account growth
              indicates a widening pool beyond the original niche. The critical diligence question is funded-account
              retention and product-level contribution margin, neither of which is publicly isolated.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Structural drivers are mobile access, online account opening, rising investor participation, and the
              convenience of holding multiple asset classes in one interface. SBI's strategic investment also indicates
              that a large financial institution sees value in an established consumer gateway, not merely a software
              vendor. Constraints are equally material: licensing and disclosure requirements, market volatility,
              suitability and trust, switching costs around assets and compliance records, and competition for a
              now-validated retail market. Indonesia's 2026 ownership-disclosure reforms and the OJK migration of
              statistics to a new data portal show that market transparency and data infrastructure are still evolving.
              These factors can accelerate adoption while raising compliance and execution costs.
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Underwriting implications and open sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a large and expanding category, but not an automatically large Ajaib revenue pool.
              Investor counts, sub-securities accounts, app users, transaction value, and market capitalization have
              different denominators and should remain separate in underwriting. A defensible SAM would require a
              current product-by-product revenue bridge, active and funded-account cohorts, geographic and demographic
              segmentation, take rates or spreads, and an explicit treatment of regulated adjacencies. The market is
              attractive enough to support continued diligence, while the gap between broad investor participation and
              monetizable, retained activity argues against using a headline population number as a valuation shortcut.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM012
              - CM015
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Large, validated retail-investing demand
            body: >-
              Investor and securities-account series show that Indonesian participation has expanded materially, while
              Ajaib's product breadth gives it several ways to monetize a retail relationship.
            calloutType: strength
            claimRefs:
              - CM004
              - CM006
              - CM009
          - type: callout
            title: Category scale is not company revenue scale
            body: >-
              Public sources do not reconcile Ajaib's user counts to active or funded accounts, retention, take rates,
              or product-level margins, so broad market counts should not be used as a direct valuation proxy.
            calloutType: risk
            claimRefs:
              - CM007
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Ajaib's competitive set spans domestic investment super-apps, specialist brokers, traditional financial
              institutions, and the status quo of holding assets across separate providers. An independent Indonesian
              comparison places Bareksa, Bibit, and Ajaib in the same super-app category, while distinguishing their
              product emphases: Bareksa on mutual-fund breadth, Bibit on robo-advice and Bank Jago integration, and
              Ajaib on stocks, U.S. stocks, futures, and crypto. Ajaib's official app description presents an even
              broader shelf, including Indonesian and U.S. stocks, mutual funds, bonds, crypto, gold and silver ETFs,
              and separate Lite and Pro experiences. This breadth reduces the need to multi-home across investment apps,
              but it also places Ajaib in direct competition with platforms that may own a stronger niche or
              distribution relationship. Internal build is a credible alternative for banks and securities firms with
              existing licenses, branches, balances, and trust; the current evidence does not quantify their relative
              customer-acquisition costs.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP010
              - CP013
      - number: '3.2'
        title: Capability, pricing, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The buyer-relevant comparison is not simply the number of instruments. Ajaib combines a single account,
              online registration, trading tools, education, and multiple regulated entities, while Bareksa and Bibit
              can be stronger for particular mutual-fund, government-bond, robo-advisor, or bank-linked workflows. The
              third-party comparison reports that Ajaib has its own securities firm, whereas Bibit and Bareksa use
              broker partners for shares; that distinction can matter for control of execution, product rollout, and
              economics. Ajaib's store listing claims five-minute registration, 600-plus selected U.S. stocks, a $1
              starting point, TradingView charting, order-book data, and a proprietary "Jeus Engine," but these are
              company-authored product claims rather than independent performance benchmarks. Brokercue independently
              describes screeners, alerts, stop-loss and take-profit controls, and access across web, iOS, Android, and
              desktop. Public evidence does not establish realized fee levels, execution quality, service-level
              performance, or comparative compliance outcomes, so those cells remain unknown rather than being scored as
              advantages.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
      - number: '3.3'
        title: Distribution, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Ajaib's strongest apparent moat is accumulated distribution around a broad product surface, not an
              exclusive asset or an independently verified technology advantage. Insignia's 2026 case study says
              Indonesia's registered stock-market investor base grew from fewer than four million in 2020 to roughly 26
              million by early 2026 and describes domestic competition as intensifying; it also identifies Robinhood's
              planned Indonesian entry as an example of well-funded international competition. That evidence supports a
              market-creation advantage that can become brand, installed-account, and cross-sell advantage, but not
              permanent exclusivity. The 2026 SBI investment gives Ajaib a strategic partner with digital-asset
              infrastructure across Asia-Pacific, and TechNode reports a 20% stake, but the public announcement does not
              disclose financial terms. Switching costs are likely higher when customers use several asset classes,
              margin facilities, education, and account history in one place; the available sources do not measure
              retention, funded-account concentration, or the cost of moving positions. Consequently, moat durability is
              medium-confidence and should be tested with cohort, multi-homing, and realized-margin evidence.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the clearest visible differentiator
            body: >-
              Ajaib is consistently described as combining domestic and international equities, funds, bonds, crypto,
              and related products in one online-first experience, a proposition that can reduce the need to use several
              specialist apps.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP008
          - type: callout
            title: Market creation does not equal durable moat
            body: >-
              The assigned independent case study describes a rapidly expanding Indonesian investor base and
              intensifying competition, including a potential well-funded international entrant; brand and distribution
              therefore need validation through retention and economics.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
          - type: callout
            title: Underwrite switching and realized economics before assuming defensibility
            body: >-
              The next diligence step is to obtain cohort retention, funded-account concentration, multi-homing,
              realized fee and spread data, execution quality, and compliance-service metrics by product and customer
              segment.
            calloutType: recommendation
            claimRefs:
              - CP009
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Ajaib's public product surface spans Indonesian and US stocks, ETFs, mutual funds, bonds, crypto, options,
              and high-yield cash. The clearest current description comes from Alpaca, which says Ajaib offers stocks,
              mutual funds, bonds, and crypto through Ajaib Alpha, while its infrastructure supports US stocks, ETFs,
              options, and eligible-user cash interest. This supports a diversified activity base, not a consolidated
              revenue mix. A third-party review of PT Ajaib Sekuritas Asia reports first-quarter 2025 revenue of Rp74.12
              billion, with Rp50.86 billion from transaction commissions and Rp23.26 billion from interest and
              dividends; because that is a regulated securities entity and not necessarily the whole group, it should
              not be treated as group ARR or total-company revenue. Official or audited group-level segment reporting,
              realized take rates, and customer-level monetization remain unavailable in the assigned evidence.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Pricing, distribution, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Public materials describe online onboarding and a beginner-friendly mobile experience, but they do not
              disclose a current fee card that can be reconciled to realized revenue. Alpaca describes users opening
              accounts and accessing products entirely online, and its partner infrastructure makes the global-product
              launch operationally scalable; that is evidence of distribution design, not proof of CAC payback or sales
              efficiency. Ajaib's October 2026 strategy hiring post shows continued investment in high-priority growth,
              operational excellence, and performance metrics. That hiring signal indicates ongoing organizational
              investment, but a job-posting description does not establish burn, productivity, or payback. The diligence
              priority is a cohort-level bridge from acquisition source to funded account, assets, trading activity, net
              revenue, and support/compliance cost.
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI008
      - number: '4.3'
        title: Cost structure, balance-sheet exposure, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The available entity-level financial commentary shows a business with meaningful balance-sheet and
              operating leverage. PintarSaham reports PT Ajaib Sekuritas Asia had Rp1.75 trillion of assets and Rp1.59
              trillion of liabilities at 31 March 2025, including Rp693.13 billion of margin receivables, and describes
              Rp40.86 billion of operating cash flow as materially influenced by margin funding rather than a clean
              measure of recurring operating efficiency. The same analysis reports net profit of Rp2.23 billion on
              Rp74.12 billion of revenue. Separately, portfolio investor Insignia reports a 2025 group performance
              snapshot of IDR474 billion in net revenue, up 152%, and roughly $1.4 million in net profit, but it does
              not provide audited consolidation details. At group level, the August 2026 Series C indicates access to
              capital, but funding raised is not cash on hand and does not establish runway.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Ajaib's financial profile is best viewed as commercially promising but insufficiently transparent for a
              high-confidence underwriting case. The platform has credible evidence of product breadth, a large claimed
              user base, and a recent institutional financing event, yet the assigned public sources do not provide a
              consolidated income statement, cash balance, burn schedule, customer concentration, realized pricing, or
              product-level contribution margin. Regulatory context also matters: OJK's July 2025 release says POJK 16
              of 2025 strengthens competence and compliance assessment for financial-sector technology innovation and
              digital-asset operators, with the rule effective 1 October 2025. That does not allege a problem at Ajaib,
              but it reinforces that compliance, governance, and control costs can be material as the platform expands.
              The investment conclusion should therefore be conditional on entity-to-group reconciliation, margin-loan
              risk controls, and evidence that new capital funds durable unit economics rather than only broader product
              and geographic scope.
            claimRefs:
              - CI014
              - CI015
              - CI017
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI009
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth creates multiple monetization surfaces
            body: >-
              Ajaib has expanded the activity surface beyond domestic brokerage into global products and cash-management
              features, creating potential cross-sell paths that are not yet quantified in public consolidated
              reporting.
            calloutType: strength
            claimRefs:
              - CI001
              - CI004
              - CI005
          - type: callout
            title: Margin exposure is the key disclosed financial risk
            body: >-
              The reported regulated-entity balance sheet includes substantial margin receivables, while the available
              secondary analysis links cash generation and revenue growth to margin-related activity; collateral,
              provisioning, and stress-test evidence are required.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI012
          - type: callout
            title: Underwrite only after group-level reconciliation
            body: >-
              Require consolidated financial statements, a product revenue bridge, cash and burn data, and margin-loan
              risk schedules before treating the recent financing as evidence of durable financial quality.
            calloutType: recommendation
            claimRefs:
              - CI014
              - CI015
              - CI017
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: One account spanning multiple investing workflows
        blocks:
          - type: paragraph
            body: >-
              Ajaib began as a mobile-first brokerage designed to remove branch and broker friction for first-time
              investors, and its public product surface has widened materially since that starting point. The current
              app listing describes Indonesian stocks, mutual funds, crypto assets, bonds, and U.S. stocks in one
              application, while a 2026 investor case study describes the strategy as keeping more of a customer's
              financial activity inside one account. The listing also separates Ajaib Lite, which emphasizes guided
              mutual-fund and bond discovery, from Ajaib Pro, which emphasizes active-trading tools and faster
              execution. This breadth is strategically useful because it creates multiple engagement paths, but the
              available evidence establishes product availability rather than adoption, revenue contribution, or
              retention by module. Those product-level performance measures remain a diligence request.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE006
              - CE007
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE009
              - CE014
      - number: '5.2'
        title: Friction removal is the core workflow design
        blocks:
          - type: paragraph
            body: >-
              The clearest product thesis is workflow compression: replace an offline brokerage process with mobile
              onboarding, education, portfolio access, and trading in a single interface. Ajaib's app listing claims
              that registration, verification, and account opening can be completed online in five minutes; older
              independent reporting confirms that the original design deliberately omitted offline brokers and branches.
              The same listing exposes distinct paths for passive or guided investing, active trading, and cross-asset
              diversification. Tracxn separately lists portfolio management, rebalancing, risk-management,
              goal-management, and stock-alert tools, although the public materials do not show how those tools are
              implemented or used. The resulting workflow proposition is credible at the feature level, but measurable
              time-to-value, completion rates, support burden, and cross-product conversion are not publicly evidenced.
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE008
              - CE015
              - CE016
      - number: '5.3'
        title: Observable architecture stops at the product and entity boundary
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an operating map, not a verified software architecture. The visible access layer
              is an Android and iOS application; a third-party Android package page reports a 92.2 MB package and
              Android 7.0-or-later requirement. The experience layer includes charting, order-book views, stop-loss and
              take-profit controls, order history, and a company-described proprietary Jeus execution engine. Beneath
              that surface, the app listing assigns Indonesian securities, mutual funds, crypto assets, and U.S. stocks
              to separate named legal entities and regulator relationships. This structure implies important service
              boundaries, but it does not disclose data flows, custody dependencies, cloud providers, latency, capacity,
              recovery objectives, or third-party concentration. The public GitHub organization is too sparse and
              fork-heavy to validate the production stack.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE012
              - CE014
      - number: '5.4'
        title: Broad maturity signals coexist with control-evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Product maturity is visible through breadth, current Android compatibility, and the move into U.S. stocks
              and leveraged crypto products reported in 2025, but these are market-presence signals rather than proof of
              resilient operations. The app listing states that services are licensed or supervised by OJK, Bappebti,
              and, for the U.S.-stock entity, Bank Indonesia; no regulator-origin record in the assigned evidence
              independently verifies the current scope or standing of those permissions. The investor-authored case
              study also reports extensive use of AI for content and customer questions while describing a human-advisor
              boundary for recommendations. That is a relevant control claim, yet public evidence does not establish
              model governance, suitability testing, privacy design, penetration testing, uptime, incident history, or
              disaster-recovery performance. Investment underwriting should therefore treat the feature set as
              demonstrated and the underlying control environment as unverified.
            claimRefs:
              - CE005
              - CE009
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite the control plane, not just the feature list
            body: >-
              The next diligence step should test execution quality, uptime, recovery, custody dependencies, AI
              governance, privacy, and product-level incident records before assigning a technology moat.
            calloutType: recommendation
            claimRefs:
              - CE008
              - CE009
              - CE012
              - CE013
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments and customer value proposition
        blocks:
          - type: paragraph
            body: >-
              Ajaib targets Indonesian retail investors, especially beginners and younger, mobile-first users, while
              also exposing a multi-asset shelf that spans domestic equities, mutual funds, bonds, crypto, U.S. stocks,
              and other global assets. Its own pages emphasize beginner education, low entry amounts, and online
              registration, while third-party descriptions position the business as a fully online brokerage without
              physical branches. The buyer, user, and payer are generally the same retail investor, although Ajaib also
              reports institutional users for its over-the-counter stablecoin desk. This segmentation is strategically
              coherent, but public material does not disclose active-account definitions, funded-account conversion,
              revenue by segment, or whether institutional activity is material to consolidated economics.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU008
      - number: '6.2'
        title: Adoption trajectory and expansion
        blocks:
          - type: paragraph
            body: >-
              Available evidence indicates meaningful adoption, but the reported counts are not directly comparable.
              Fintech Global reported more than three million customers, Insignia described a base that had crossed
              seven million in its 2025 account, Ajaib's current website advertises five million investors, and Fintech
              Garden cited a figure above 20 million retail investors. Insignia also reported 2025 platform transaction
              value of $13.4 billion, up 131%, and described roughly 80% of new customers as adopting more than one
              asset class or use case immediately; these are reported figures, not independently audited cohort data.
              The company is expanding the customer relationship through U.S. stocks, crypto, margin facilities,
              education, and institutional settlement, yet no public source in this pool provides churn, renewal, GRR,
              NRR, cohort curves, or a denominator for active utilization.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU008
              - CU009
              - CU011
      - number: '6.3'
        title: Named proof, durability, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public customer proof is stronger for product availability and reported scale than for named production
              outcomes. Ajaib's app listing describes an all-in-one product, rapid online registration, and access to
              more than 600 U.S. stocks; its corporate pages describe more than three million investors and a
              five-million-investor headline, but neither establishes retention or investment performance. The 2025 Niyo
              dispute is adverse customer evidence: OJK requested a detailed explanation and internal-investigation
              report after a reported Rp1.8 billion transaction, while Ajaib said it found no system malfunction and
              that the account owner used a registered device and confirmation flow. Independent commentary raised
              concerns about whether margin could be presented as a default and about the lack of specific technical
              regulation. This episode supports a high-priority diligence ask on informed consent, complaint resolution,
              and customer concentration by product, not a conclusion that the platform was at fault.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad retail reach with a coherent cross-sell surface
            body: >-
              The evidence supports a real multi-asset retail proposition and reported multi-million customer scale,
              with product breadth that can increase engagement beyond a single brokerage use case.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU005
          - type: callout
            title: Customer quality and suitability remain unproven
            body: >-
              Conflicting customer counts, absent retention metrics, and the margin-trading complaint leave
              funded-account quality, durable usage, complaint handling, and product suitability unresolved.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
          - type: callout
            title: Request cohort and complaint-resolution evidence
            body: >-
              Before underwriting expansion, request reconciled active and funded accounts by product, cohort retention
              and churn, top-customer concentration, margin opt-in and suitability logs, complaint outcomes, and
              product-level contribution margins.
            calloutType: recommendation
            claimRefs:
              - CU007
              - CU010
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Ajaib operates inside a securities regime that became more prescriptive in 2026. ARMA's legal analysis
              says OJK Regulation 3/2026 created three PEKU classifications tied to activity scope, capital, adjusted
              net working capital, governance, and reporting. Existing firms had six months from the 29 April 2026
              effective date to submit a classification and action plan; full capital and governance transition extends
              to 29 April 2029, but quarterly progress reporting applies during the transition. The rule also reserves
              foreign-securities facilitation for PEKU 3 firms subject to OJK assessment and approval. Public sources do
              not identify Ajaib's entity-level election, capital headroom, controller filing, or product approvals, so
              the evidence supports a high-impact diligence risk rather than a finding of non-compliance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.2'
        title: Customer-protection and product-control risk
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal is the June 2025 dispute in which a customer said a routine purchase of about
              Rp 1 million was followed by a BBTN transaction valued at about Rp 1.8 billion. Ajaib's reported
              investigation said the registered device and confirmation process authenticated the trade and found no
              system disruption; those positions leave authorization and user understanding contested rather than
              resolved. BEI said the customer could report through OJK or the exchange's whistleblowing channel and did
              not rule out an audit. Separately, the reviewed margin-rule explainer describes 65% financing and
              margin-call thresholds and an 80% forced-sale threshold. Together, the evidence makes consent design,
              feature defaults, surveillance, complaint handling, and independent remediation proof core operating risks
              for a platform aimed partly at first-time investors.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.3'
        title: Operating, financial, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Product breadth compounds the control surface. The retained sources describe domestic equities, mutual
              funds, crypto, US stocks, bonds, banking, payments, savings, and stablecoin infrastructure, while an
              investor-affiliated case study says margin lending helped drive Ajaib's first reported profitable year in
              2025. That account also says the market has become crowded and that Ajaib's early lead created
              distribution and brand recognition, not exclusivity. The 2026 financing reduces near-term capital pressure
              but introduces a material strategic dependency: Insignia and BackScoop report a $270 million SBI-led round
              and a roughly 20% stake. Funding raised is not cash available, reported accounting profit is not cash
              generation, and public sources do not disclose product-level credit losses, compliance costs, liquidity
              buffers, partner rights, or replacement-capital plans.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Monitoring should be entity- and product-specific. Regulatory indicators are the PEKU election, paid-up
              capital, MKBD headroom, positive equity, quarterly transition filings, compliance appointments, controller
              disclosures, and foreign-product approvals. Customer-protection indicators are margin activation and
              eligibility, disputed-trade frequency, margin calls, forced sales, account freezes, complaint-resolution
              time, regulator referrals, confirmed security events, and independently verified remediation. Financial
              indicators should separate trading revenue, margin interest, funding proceeds, cash, credit losses, and
              compliance costs. A material licence or product restriction, missed capital milestone, repeated disputed
              leveraged trades with unresolved customer loss, or withdrawal of strategic capital without replacement
              would break the operating thesis. These are monitorable criteria derived from the retained evidence;
              public sources do not quantify safe thresholds for Ajaib.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR008
              - CR010
              - CR011
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A repeated material leveraged-trade dispute, especially if independent review finds deficient consent,
              suitability, surveillance, or complaint remediation, would break the operating-control thesis even if
              users and reported revenue continue to grow.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: callout
            title: What public evidence cannot establish
            body: >-
              Funding raised is not cash available, reported net profit is not consolidated cash generation, and no
              retained report of a breach or enforcement action is not proof that no incident occurred.
            calloutType: assumption
            claimRefs:
              - CR010
              - CR011
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and current price context
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more rather than buy or pass. Insignia reports that SBI invested $270
              million for 20% of Ajaib in August 2026, implying roughly $1.35 billion, while Tracxn separately records a
              $270 million Series C and $515 million raised across six rounds. That is a meaningful fresh price signal,
              but it is not a complete equity underwriting: the reviewed disclosures do not establish whether the stake
              percentage is fully diluted, what preferences attach, or how net debt and cash bridge enterprise value to
              equity value. The last explicit earlier mark was $1 billion after a $153 million Series B in 2021. Entry
              should therefore be conditioned on primary deal documents and audited consolidated financials, not on
              headline valuation continuity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and evidence quality
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on scale, product breadth, and an emerging profitability signal. Insignia reports 2025
              net revenue of IDR 474 billion, 152% year-over-year growth, a first net profit of about $1.4 million, more
              than 7 million users, and $13.4 billion of platform transaction value. Those figures suggest that
              distribution can support monetization beyond commissions, while the company's multi-asset brokerage
              positioning broadens the addressable wallet. The anti-thesis is equally material: these operating figures
              come through an investor's portfolio publication rather than audited group accounts, the profit is not
              evidence of durable cash conversion, and the financing terms do not reveal preference or dilution
              overhang. A high-quality company can still be a poor investment at an unsupported price.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV015
      - number: '8.3'
        title: Scenario framework and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              Public benchmarks should be treated as calibration inputs, not as an Ajaib valuation. Finro's Q1 2026
              dataset reports a 16.2x median EV/revenue multiple for 34 wealthtech and robo-advisor companies and a 7.2x
              Series C median across 55 companies, with a 3.8x–14.6x interquartile range. Windsor Drake reports much
              lower public-market anchors: 3.3x median forward revenue for asset and wealth management technology and
              3.0x revenue for its wealthtech proxy. These are different populations and metric bases and must not be
              blended. The bear, base, and bull cases therefore state conditional benchmark bands, while withholding a
              company-specific value until comparable net revenue, EBITDA, net debt, and security terms are verified.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, return framing, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Ajaib has strategic-financing evidence and reported profitability, but public evidence does not support a
              target return, hold period, or exit value. Windsor Drake says public fintech multiples were at five-year
              lows at June 30, 2026 and emphasizes matching the valuation metric to the business model; this makes a
              2021 unicorn mark a weak standalone anchor. Before investment, diligence should reconcile regulated
              entities into audited group accounts, separate transaction, lending, and other revenue, verify cohort
              retention and credit performance, and obtain the fully diluted cap table and preference waterfall.
              Thesis-break triggers are failure to reconcile reported profit to cash generation, a preference-adjusted
              entry price that cannot clear the required return under the public wealthtech band, or regulatory and
              credit losses that invalidate the profitability signal.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline dominates the decision
            body: >-
              Treat the reported 2026 stake price as evidence of investor demand, not as proof that a new security
              offers an acceptable return. Require audited group economics, fully diluted ownership, preference terms,
              and an enterprise-to-equity bridge before setting price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV015
              - CV016
