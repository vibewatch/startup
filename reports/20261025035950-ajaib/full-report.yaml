        title: Exhibits
        blocks:
          - type: callout
            title: Strategic validation with meaningful scale
            body: >-
              A $270 million strategic financing, more than seven million reported users, and first profitability
              together provide stronger current validation than the legacy unicorn label alone.
            calloutType: strength
            claimRefs:
              - CO006
