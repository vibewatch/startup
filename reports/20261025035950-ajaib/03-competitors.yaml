figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: "Evidence-backed ordinal positioning places Ajaib high on product breadth and digital convenience, while specialist and incumbent alternatives trade breadth for niche depth or relationship trust."
    data:
      points:
        - {label: Ajaib, x: 0.86, y: 0.78, note: "Broad multi-asset shelf and online-first workflow are source-backed; coordinates are ordinal analyst synthesis, not a measured benchmark."}
        - {label: Bareksa, x: 0.68, y: 0.72, note: "Comparison source emphasizes mutual-fund, SBN, gold, and marketplace breadth."}
        - {label: Bibit, x: 0.63, y: 0.82, note: "Comparison source emphasizes robo-advisor and Bank Jago integration for guided users."}
        - {label: Traditional banks, x: 0.42, y: 0.66, note: "Incumbent trust and distribution are plausible alternatives, but assigned evidence does not quantify capability breadth."}
        - {label: Specialist broker, x: 0.38, y: 0.58, note: "Specialist depth is an analytical category; no named specialist benchmark was retained in this pool."}
        - {label: Separate-provider status quo, x: 0.24, y: 0.31, note: "Multiple apps or providers increase fragmentation; switching and service costs are not measured."}
    approximationNotes: "Coordinates are evidence-backed ordinal scores synthesized from the assigned sources, not market-share, fee, execution, or customer-satisfaction measurements."
    claimRefs: [CP001, CP005, CP010, CP013]
callouts:
  - calloutType: strength
    title: Breadth is the clearest visible differentiator
    body: Ajaib is consistently described as combining domestic and international equities, funds, bonds, crypto, and related products in one online-first experience, a proposition that can reduce the need to use several specialist apps.
    claimRefs: [CP001, CP005, CP008]
  - calloutType: risk
    title: Market creation does not equal durable moat
    body: The assigned independent case study describes a rapidly expanding Indonesian investor base and intensifying competition, including a potential well-funded international entrant; brand and distribution therefore need validation through retention and economics.
    claimRefs: [CP010, CP011]
  - calloutType: recommendation
    title: Underwrite switching and realized economics before assuming defensibility
    body: The next diligence step is to obtain cohort retention, funded-account concentration, multi-homing, realized fee and spread data, execution quality, and compliance-service metrics by product and customer segment.
    claimRefs: [CP009, CP012, CP013]
