      - [Bareksa, "Comparison reports free mutual funds and SBN; share fees described as 0.15% buy and 0.25% sell", "Marketplace and business / institutional offerings", "Mutual funds, SBN, gold, shares, robo-advisor and education", "Data is from an independent comparison with historical product observations", "May win on mutual-fund breadth and specialized savings journeys"]
      - [Bibit, "Comparison reports free mutual funds and bonds; share fees described as 0.15% buy and 0.25% sell", "Robo-advisor and Bank Jago-linked experience", "Mutual funds, SBN, fixed-rate bonds, shares and education", "Promotions and current realized pricing are unknown", "May win where guided allocation or banking integration matters"]
