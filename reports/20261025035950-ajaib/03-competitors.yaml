company:
  name: Ajaib
chapter:
  number: 3
  title: Competitors
  summary: Ajaib competes as a broad, regulated multi-asset investing platform rather than a single-product broker. Its breadth, beginner-oriented onboarding, and own securities entities create differentiation, but the evidence also shows a crowded Indonesian super-app field and limited public proof on realized pricing, retention, and durable economics.
sections:
  - id: landscape
    title: Landscape and buyer alternatives
    body: >-
      Ajaib's competitive set spans domestic investment super-apps, specialist brokers,
      traditional financial institutions, and the status quo of holding assets across
      separate providers. An independent Indonesian comparison places Bareksa, Bibit,
      and Ajaib in the same super-app category, while distinguishing their product
      emphases: Bareksa on mutual-fund breadth, Bibit on robo-advice and Bank Jago
      integration, and Ajaib on stocks, U.S. stocks, futures, and crypto. Ajaib's
      official app description presents an even broader shelf, including Indonesian
      and U.S. stocks, mutual funds, bonds, crypto, gold and silver ETFs, and separate
      Lite and Pro experiences. This breadth reduces the need to multi-home across
      investment apps, but it also places Ajaib in direct competition with platforms
      that may own a stronger niche or distribution relationship. Internal build is
      a credible alternative for banks and securities firms with existing licenses,
      branches, balances, and trust; the current evidence does not quantify their
      relative customer-acquisition costs.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capabilities
    title: Capability, pricing, and trust comparison
    body: >-
      The buyer-relevant comparison is not simply the number of instruments. Ajaib
      combines a single account, online registration, trading tools, education, and
      multiple regulated entities, while Bareksa and Bibit can be stronger for
      particular mutual-fund, government-bond, robo-advisor, or bank-linked workflows.
      The third-party comparison reports that Ajaib has its own securities firm,
      whereas Bibit and Bareksa use broker partners for shares; that distinction can
      matter for control of execution, product rollout, and economics. Ajaib's store
      listing claims five-minute registration, 600-plus selected U.S. stocks, a $1
      starting point, TradingView charting, order-book data, and a proprietary
      "Jeus Engine," but these are company-authored product claims rather than
      independent performance benchmarks. Brokercue independently describes screeners,
      alerts, stop-loss and take-profit controls, and access across web, iOS, Android,
      and desktop. Public evidence does not establish realized fee levels, execution
      quality, service-level performance, or comparative compliance outcomes, so those
      cells remain unknown rather than being scored as advantages.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002, TP003]
  - id: durability
    title: Distribution, switching costs, and moat durability
    body: >-
      Ajaib's strongest apparent moat is accumulated distribution around a broad
      product surface, not an exclusive asset or an independently verified technology
      advantage. Insignia's 2026 case study says Indonesia's registered stock-market
      investor base grew from fewer than four million in 2020 to roughly 26 million
      by early 2026 and describes domestic competition as intensifying; it also
      identifies Robinhood's planned Indonesian entry as an example of well-funded
      international competition. That evidence supports a market-creation advantage
      that can become brand, installed-account, and cross-sell advantage, but not
      permanent exclusivity. The 2026 SBI investment gives Ajaib a strategic partner
      with digital-asset infrastructure across Asia-Pacific, and TechNode reports a
      20% stake, but the public announcement does not disclose financial terms.
      Switching costs are likely higher when customers use several asset classes,
      margin facilities, education, and account history in one place; the available
      sources do not measure retention, funded-account concentration, or the cost of
      moving positions. Consequently, moat durability is medium-confidence and should
      be tested with cohort, multi-homing, and realized-margin evidence.
    claimRefs: [CP010, CP011, CP012, CP013]
    tableRefs: []
    figureRefs: []
