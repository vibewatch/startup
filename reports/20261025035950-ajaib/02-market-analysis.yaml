  - id: TM002
    title: Sizing lenses and limitations
    columns: [publisher, year or period, geography, value, methodology, confidence, limitation]
    rows:
      - [CEIC / KSEI, "2025", Indonesia, "20,347,147 capital-market investors", "Annual reported investor series", "high", "Investor count is not funded-account or revenue data"]
      - [CEIC / KSEI, "2025", Indonesia, "19,192,846 mutual-fund investors", "Annual reported investor series", "high", "Population can overlap other investor categories"]
      - [CEIC / KSEI, "Sep 2026", Indonesia, "17,299,893 sub-securities accounts", "Monthly reported account series", "high", "Accounts are not unique active customers"]
      - [CEIC / KSEI, "Sep 2026", Indonesia, "IDR 10,695 trillion market capitalization", "Monthly reported market series", "medium", "Asset value is not platform revenue opportunity"]
      - [Insignia Business Review, "2026", Indonesia, "roughly 26 million registered stock-market investors by early 2026", "Case-study synthesis of market growth", "medium", "Secondary narrative; denominator and date need primary reconciliation"]
      - [Entrepreneur Asia Pacific, "2026", Indonesia, "30.06 million single investor identifications at end-July", "Reported OJK statistic", "medium", "SIDs and account activity are not equivalent to paying users"]
      - [Ajaib coverage / Entrepreneur Asia Pacific, "2026", Indonesia, "more than 7 million users", "Reported company/user-base figure", "medium", "User definition, funding and retention are undisclosed"]
      - [Entrepreneur Asia Pacific, "Aug 2026 financing", Indonesia, "about $1.35 billion implied post-money valuation", "$270 million divided by reported 20% stake", "medium", "Derived financing reference; neither company disclosed valuation"]
    notes: "The rows are alternative lenses with different units, populations and methodologies; they must not be summed or rendered as a shared conversion funnel."
    claimRefs: [CM004, CM005, CM006, CM007, CM008]
  - id: TM003
    title: Segment and buyer map
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - [First-time retail investors, "Individual consumer", "Account holder", "Individual consumer", "Onboard, learn, buy funds or stocks, monitor portfolio", "Personal savings", "Online onboarding and education"]
      - [Active retail traders, "Individual consumer", "Account holder", "Individual consumer", "Trade domestic or overseas securities and potentially crypto", "Personal investment capital", "Low-friction execution and product breadth"]
      - [Cross-asset retail investors, "Individual consumer", "Account holder", "Individual consumer", "Move among equities, funds, bonds and digital assets", "Personal portfolio", "One account and integrated portfolio visibility"]
      - [Corporate or institutional digital-asset users, "Treasury or institutional operator", "Treasury / operations team", "Corporate or institutional entity", "Settlement or OTC digital-asset workflows", "Treasury or operating budget", "Cross-border liquidity and settlement needs"]
      - [Fund and product partners, "Asset manager or product provider", "Distribution or operations team", "Partner institution", "Distribute products through a digital channel", "Distribution and partnership budget", "Reach to digitally acquired retail demand"]
    notes: "Buyer and payer assignments are evidence-constrained analytical mappings; public sources do not disclose segment-level budgets, conversion or contribution margin."
    claimRefs: [CM009, CM010, CM011, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: Separate population and value lenses show the scale of the surrounding market without implying a shared denominator or conversion rate.
    data:
      items:
        - label: Indonesia population context
          value: 286
          unit: million people
          note: "Insignia-cited founder context; broad context, not investable TAM."
        - label: Capital-market investors
          value: 20.347147
          unit: million persons
          note: "CEIC/KSEI annual 2025 series."
        - label: Sub-securities accounts
          value: 17.299893
          unit: million accounts
          note: "CEIC/KSEI September 2026 series; accounts are not unique active users."
        - label: Ajaib users in 2026 coverage
          value: 7
          unit: million users
          note: "Reported user figure; definition and funded status are not disclosed."
        - label: Mutual-fund investors
          value: 19.192846
          unit: million persons
          note: "CEIC/KSEI annual 2025 series; may overlap other investor categories."
        - label: Market capitalization
          value: 10695
          unit: IDR trillion
          note: "CEIC/KSEI September 2026 value; not comparable to population counts."
    approximationNotes: "The values retain their source units and are presented as distinct sizing lenses in authored order; no aggregation, conversion rate, or value-proportional market share is inferred."
    claimRefs: [CM004, CM005, CM006, CM007]
callouts:
  - calloutType: strength
    title: Large, validated retail-investing demand
    body: Investor and securities-account series show that Indonesian participation has expanded materially, while Ajaib's product breadth gives it several ways to monetize a retail relationship.
    claimRefs: [CM004, CM006, CM009]
  - calloutType: risk
    title: Category scale is not company revenue scale
    body: Public sources do not reconcile Ajaib's user counts to active or funded accounts, retention, take rates, or product-level margins, so broad market counts should not be used as a direct valuation proxy.
    claimRefs: [CM007, CM012, CM015]
