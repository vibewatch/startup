slug: ajaib
runDate: 2026-10-25
company:
  name: Ajaib
chapter:
  number: 2
  title: Market Analysis
  summary: Ajaib operates in a rapidly digitizing Indonesian retail-investment market, but the addressable opportunity is best understood as several related pools rather than one interchangeable TAM. Public evidence supports strong investor-account growth, broadening product access, and a crowded route to the customer; it does not disclose a clean Ajaib-specific SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is digital distribution of Indonesian retail investment products:
      domestic equities, mutual funds, bonds, exchange-traded products, selected overseas
      securities, and digital assets delivered through a regulated or compliance-dependent
      account relationship. Ajaib's public descriptions also mention payments, deposits,
      banking, and stablecoin infrastructure, but those adjacencies should not be added to
      brokerage TAM without separate revenue and licensing evidence. The practical substitute
      set includes branch-based brokers, bank-led investment channels, incumbent fund
      distributors, direct exchange or issuer access, and simply holding cash. The boundary
      therefore includes customer acquisition and transaction economics around investment
      accounts, while excluding the full market capitalization of assets held by customers.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: market-sizing
    title: Multiple sizing lenses and what they do not prove
    body: >-
      Available evidence gives several useful sizing lenses but no defensible single TAM.
      CEIC reports 20,347,147 Indonesian capital-market investors in 2025, 19,192,846 mutual
      fund investors, 17,299,893 sub-securities accounts in September 2026, and market
      capitalization of IDR 10,695 trillion in that month. These series represent different
      populations and units, so they cannot be summed or treated as a conversion funnel.
      Ajaib-specific reports range from more than three million customers in older or
      company-positioning accounts to more than seven million in 2026 coverage; the
      difference is not reconciled by a public definition of account, customer, or funded
      investor. The $1.35 billion implied post-money valuation from SBI's reported $270
      million for 20% is a financing reference, not market size or proof of future share.
    claimRefs: [CM004, CM005, CM006, CM007, CM008]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segments
    title: Buyer, user, payer, and adoption path
    body: >-
      The primary user is a retail investor using mobile onboarding, portfolio monitoring,
      education, and order execution; the economic payer is generally the user through
      commissions, spreads, interest or product economics rather than an enterprise
      procurement department. Ajaib's platform breadth creates multiple adoption paths:
      a beginner can start with funds or domestic stocks, a more active user can add
      overseas equities or crypto, and institutional or corporate customers may use
      stablecoin or settlement services. Public sources describe younger and first-time
      investors as a target, while market-account growth indicates a widening pool beyond
      the original niche. The critical diligence question is funded-account retention and
      product-level contribution margin, neither of which is publicly isolated.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Growth drivers and adoption constraints
    body: >-
      Structural drivers are mobile access, online account opening, rising investor
      participation, and the convenience of holding multiple asset classes in one interface.
      SBI's strategic investment also indicates that a large financial institution sees
      value in an established consumer gateway, not merely a software vendor. Constraints
      are equally material: licensing and disclosure requirements, market volatility,
      suitability and trust, switching costs around assets and compliance records, and
      competition for a now-validated retail market. Indonesia's 2026 ownership-disclosure
      reforms and the OJK migration of statistics to a new data portal show that market
      transparency and data infrastructure are still evolving. These factors can accelerate
      adoption while raising compliance and execution costs.
    claimRefs: [CM013, CM014, CM015]
  - id: sizing-gaps
    title: Underwriting implications and open sizing gaps
    body: >-
      The evidence supports a large and expanding category, but not an automatically large
      Ajaib revenue pool. Investor counts, sub-securities accounts, app users, transaction
      value, and market capitalization have different denominators and should remain
      separate in underwriting. A defensible SAM would require a current product-by-product
      revenue bridge, active and funded-account cohorts, geographic and demographic
      segmentation, take rates or spreads, and an explicit treatment of regulated
      adjacencies. The market is attractive enough to support continued diligence, while
      the gap between broad investor participation and monetizable, retained activity
      argues against using a headline population number as a valuation shortcut.
    claimRefs: [CM004, CM006, CM007, CM008, CM012, CM015]
    callouts:
      - calloutType: assumption
        title: Evidence-constrained sizing
        body: The report treats investor accounts, securities accounts, app users, and market capitalization as separate lenses; it does not derive a conversion rate or aggregate TAM from them.
        claimRefs: [CM004, CM005, CM006, CM007]
