company:
  name: Ajaib
chapter:
  number: 4
  title: Financials
  summary: Ajaib has broadened from a digital brokerage into a multi-asset platform, with current public evidence pointing to transaction, interest, and product-expansion monetization rather than a disclosed consolidated revenue bridge. The main underwriting constraint is not demand evidence but limited public visibility into realized pricing, contribution margins, cash runway, and the relationship between group-level funding and regulated-entity balance sheets.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: Ajaib's public product surface spans Indonesian and US stocks, ETFs, mutual funds, bonds, crypto, options, and high-yield cash. The clearest current description comes from Alpaca, which says Ajaib offers stocks, mutual funds, bonds, and crypto through Ajaib Alpha, while its infrastructure supports US stocks, ETFs, options, and eligible-user cash interest. This supports a diversified activity base, not a consolidated revenue mix. A third-party review of PT Ajaib Sekuritas Asia reports first-quarter 2025 revenue of Rp74.12 billion, with Rp50.86 billion from transaction commissions and Rp23.26 billion from interest and dividends; because that is a regulated securities entity and not necessarily the whole group, it should not be treated as group ARR or total-company revenue. Official or audited group-level segment reporting, realized take rates, and customer-level monetization remain unavailable in the assigned evidence.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-sales-efficiency
    title: Pricing, distribution, and sales efficiency
    body: Public materials describe online onboarding and a beginner-friendly mobile experience, but they do not disclose a current fee card that can be reconciled to realized revenue. Alpaca describes users opening accounts and accessing products entirely online, and its partner infrastructure makes the global-product launch operationally scalable; that is evidence of distribution design, not proof of CAC payback or sales efficiency. Ajaib's October 2026 strategy hiring post shows continued investment in high-priority growth, operational excellence, and performance metrics. That hiring signal indicates ongoing organizational investment, but a job-posting description does not establish burn, productivity, or payback. The diligence priority is a cohort-level bridge from acquisition source to funded account, assets, trading activity, net revenue, and support/compliance cost.
    claimRefs: [CI004, CI005, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-capital
    title: Cost structure, balance-sheet exposure, and capital adequacy
    body: The available entity-level financial commentary shows a business with meaningful balance-sheet and operating leverage. PintarSaham reports PT Ajaib Sekuritas Asia had Rp1.75 trillion of assets and Rp1.59 trillion of liabilities at 31 March 2025, including Rp693.13 billion of margin receivables, and describes Rp40.86 billion of operating cash flow as materially influenced by margin funding rather than a clean measure of recurring operating efficiency. The same analysis reports net profit of Rp2.23 billion on Rp74.12 billion of revenue. Separately, portfolio investor Insignia reports a 2025 group performance snapshot of IDR474 billion in net revenue, up 152%, and roughly $1.4 million in net profit, but it does not provide audited consolidation details. At group level, the August 2026 Series C indicates access to capital, but funding raised is not cash on hand and does not establish runway.
    claimRefs: [CI006, CI009, CI010, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and diligence blockers
    body: >-
      Ajaib's financial profile is best viewed as commercially promising but insufficiently transparent for a high-confidence underwriting case. The platform has credible evidence of product breadth, a large claimed user base, and a recent institutional financing event, yet the assigned public sources do not provide a consolidated income statement, cash balance, burn schedule, customer concentration, realized pricing, or product-level contribution margin. Regulatory context also matters: OJK's July 2025 release says POJK 16 of 2025 strengthens competence and compliance assessment for financial-sector technology innovation and digital-asset operators, with the rule effective 1 October 2025. That does not allege a problem at Ajaib, but it reinforces that compliance, governance, and control costs can be material as the platform expands. The investment conclusion should therefore be conditional on entity-to-group reconciliation, margin-loan risk controls, and evidence that new capital funds durable unit economics rather than only broader product and geographic scope.
    claimRefs: [CI014, CI015, CI017]
    figureRefs: [FI001]
