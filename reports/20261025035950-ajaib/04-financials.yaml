    columns: [Area, Public evidence, List versus realized pricing, Confidence, Diligence ask]
    rows:
      - [Brokerage fees, "No current fee schedule was retained in the assigned evidence", "No current fee schedule reconciled to realized revenue", "Unavailable", "Provide fee card, waivers, rebates, and realized take rate by product"]
      - [Online acquisition, "Users can open accounts and access products entirely online", "Digital onboarding is a channel design, not CAC payback", "Medium", "Provide CAC, funded-account conversion, activation, and payback cohorts"]
      - [Options and high-yield cash, "Launched through Alpaca partnership in 2026", "Terms and economics for Ajaib are not disclosed", "Medium", "Provide partner contract, revenue share, custody, and risk-cost schedule"]
      - [Strategy staffing, "October 2026 COO Office role emphasizes growth, operational excellence, and performance metrics", "Hiring signals do not quantify sales efficiency", "Medium", "Provide hiring plan, fully loaded cost, and productivity targets"]
    notes: "Public descriptions distinguish product availability from realized pricing; no CAC, payback, retention, or customer-level margin metric was found in the assigned evidence."
    claimRefs: [CI004, CI005, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Q1 2025 entity revenue, "Rp74.12bn", "Medium", "Sets the scale of the reported regulated-entity economics", "Reconcile to audited PT Ajaib Sekuritas Asia statements and group accounts"]
      - [Q1 2025 entity net profit, "Rp2.23bn", "Medium", "Implies limited reported profit cushion in the cited period", "Validate accounting basis, taxes, and consolidated profitability"]
      - [Margin receivables at 31 Mar 2025, "Rp693.13bn", "Medium", "Creates exposure to collateral, liquidity, and market-stress losses", "Review collateral haircuts, aging, defaults, provisions, and stress tests"]
      - [Operating cash flow at 31 Mar 2025, "Rp40.86bn", "Medium", "Reported cash generation may reflect margin-funding flows", "Rebuild cash flow excluding financing-related pass-through effects"]
      - [2025 group performance snapshot, "IDR474bn net revenue; approximately $1.4m net profit", "Medium", "Indicates growth and reported profitability but lacks an audited consolidation bridge", "Reconcile the investor-reported snapshot to audited group and entity accounts"]
      - [Consolidated cash balance and runway, null, "Unavailable", "Determines financing dependency and next-round urgency", "Obtain latest group cash, monthly burn, committed facilities, and runway"]
      - [Product-level contribution margin, null, "Unavailable", "Determines whether breadth improves or dilutes economics", "Obtain revenue, direct costs, compliance cost, and support cost by product"]
    notes: "Null means not disclosed in the assigned successful prefetched evidence; funding raised is not substituted for cash available or runway."
    claimRefs: [CI006, CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Public-evidence revenue model bridge
    type: flow
    summary: Customer investment activity can feed several monetization streams, but the assigned evidence does not quantify the conversion from activity to consolidated revenue or gross profit.
    data:
      nodes:
        - id: customer-activity
          label: Retail investing activity
          detail: Stocks, funds, bonds, crypto, options, and cash products are publicly described.
        - id: brokerage
          label: Brokerage commissions
          detail: Entity-level Q1 2025 transaction commissions were reported at Rp50.86bn.
        - id: margin-interest
          label: Interest and dividends
          detail: Entity-level Q1 2025 interest and dividend income was reported at Rp23.26bn.
        - id: product-expansion
          label: Multi-asset expansion
          detail: Alpaca describes US stocks, ETFs, options, and high-yield cash access.
        - id: gross-profit
          label: Consolidated gross profit
          detail: Not disclosed in the assigned evidence; no bridge is asserted.
      edges:
        - [customer-activity, brokerage]
        - [customer-activity, margin-interest]
        - [customer-activity, product-expansion]
        - [brokerage, gross-profit]
        - [margin-interest, gross-profit]
        - [product-expansion, gross-profit]
    approximationNotes: "This is an evidence-backed mechanism map, not a quantitative waterfall; product breadth and entity-level revenue cannot be summed into consolidated gross profit without group accounts."
    claimRefs: [CI001, CI002, CI003, CI004, CI009]
callouts:
  - calloutType: strength
    title: Breadth creates multiple monetization surfaces
    body: Ajaib has expanded the activity surface beyond domestic brokerage into global products and cash-management features, creating potential cross-sell paths that are not yet quantified in public consolidated reporting.
    claimRefs: [CI001, CI004, CI005]
  - calloutType: risk
    title: Margin exposure is the key disclosed financial risk
    body: The reported regulated-entity balance sheet includes substantial margin receivables, while the available secondary analysis links cash generation and revenue growth to margin-related activity; collateral, provisioning, and stress-test evidence are required.
    claimRefs: [CI009, CI010, CI012]
  - calloutType: recommendation
    title: Underwrite only after group-level reconciliation
    body: Require consolidated financial statements, a product revenue bridge, cash and burn data, and margin-loan risk schedules before treating the recent financing as evidence of durable financial quality.
    claimRefs: [CI014, CI015, CI017]
