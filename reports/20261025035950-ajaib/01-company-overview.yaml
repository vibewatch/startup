company:
  name: "Ajaib"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Ajaib is a Jakarta-based, founder-led multi-asset investment platform whose strongest current signals are a $270 million SBI financing, more than seven million reported users, and first profitability in 2025. The financing validates strategic relevance but leaves the exact post-money valuation, cumulative funding, cap table, board composition, and independently verified group financials unresolved."
sections:
  - id: "identity-and-platform"
    title: "Identity and platform scope"
    body: >-
      Ajaib is a private, growth-stage Indonesian investment platform headquartered in Jakarta and led by cofounders Anderson Sumarli and Yada Piyajomkwan. Most reviewed sources describe a 2019 launch or founding, while an archived Dealroom profile says 2018; the discrepancy should be resolved against incorporation records rather than normalized away. The platform has expanded beyond its original stock and mutual-fund proposition into bonds, Indonesian and US equities, crypto assets, and adjacent payments, savings, and stablecoin infrastructure. Recruiting copy presents Ajaib as Indonesia's first fully online stock brokerage without branches or offline brokers, but that remains a company-originated positioning claim rather than an independently established market first.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Public evidence consistently identifies Sumarli and Piyajomkwan as the founding pair: Bloomberg describes them as Stanford MBA classmates, while a 2023 Forbes BrandVoice interview presents both as active cofounders. Sumarli is identified as chief executive in the current Venture Capital Tracker profile; the reviewed pool does not establish Piyajomkwan's current operating title, a complete executive roster, board membership, voting controls, or material leadership changes. That opacity matters more after SBI acquired an approximately 20% strategic position, because an outside shareholder of that size may influence governance, while the analyst profile specifically flags tension between affiliate governance and founder speed.
    claimRefs: [CO003, CO006, CO016]
    tableRefs: [TO002]
  - id: "capital-and-stakeholders"
    title: "Capital history and strategic stakeholders"
    body: >-
      The clearest current capital event is SBI Holdings' August 2026 investment: multiple sources report $270 million for roughly 20%, and Bloomberg says the round was priced above Ajaib's prior valuation while the company withheld the new valuation. The historical anchor is a $153 million Series B led by DST Global in October 2021 at a reported $1 billion valuation. FinTech Global says the new round took cumulative funding above $500 million, whereas Venture Capital Tracker lists only $270 million of total disclosed equity; the mismatch means cumulative proceeds should remain a diligence gap, not a settled cover metric. Ajaib's reported 40% holding in listed Bank Bumi Arta adds strategic reach but also expands the governance perimeter.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO003]
  - id: "scale-and-milestones"
    title: "Scale, economics, and recent milestones"
    body: >-
      Reported scale accelerated materially: Forbes cited more than one million customers in 2023, while BackScoop and Insignia reported more than seven million in 2026. Insignia, an investor-affiliated source, reported IDR 474 billion of 2025 net revenue, 152% year-on-year growth, and roughly $1.4 million of net profit in Ajaib's first profitable year. It attributes the profit mix more to margin facilities layered onto acquired accounts than to trading commissions, which suggests monetization is moving toward balance-sheet and credit exposure. Product breadth also increased through the January 2025 Ajaib Alpha rebrand and perpetual futures launch and February 2025 US-stock access. These figures are useful signals, but they are not a substitute for consolidated audited group accounts or current headcount disclosure.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
