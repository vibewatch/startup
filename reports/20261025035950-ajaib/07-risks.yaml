company:
  name: Ajaib
chapter:
  number: 7
  title: Risks
  summary: Ajaib's highest-evidence risks are the 2026 securities-company transition, leveraged-retail product controls, and the governance burden of a multi-asset platform. A disputed 2025 transaction provides a concrete adverse signal, while public evidence leaves entity-level compliance, incident closure, and risk-adjusted economics unresolved.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      Ajaib operates inside a securities regime that became more prescriptive in 2026. ARMA's legal analysis says OJK Regulation 3/2026 created three PEKU classifications tied to activity scope, capital, adjusted net working capital, governance, and reporting. Existing firms had six months from the 29 April 2026 effective date to submit a classification and action plan; full capital and governance transition extends to 29 April 2029, but quarterly progress reporting applies during the transition. The rule also reserves foreign-securities facilitation for PEKU 3 firms subject to OJK assessment and approval. Public sources do not identify Ajaib's entity-level election, capital headroom, controller filing, or product approvals, so the evidence supports a high-impact diligence risk rather than a finding of non-compliance.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: customer-and-control
    title: Customer-protection and product-control risk
    body: >-
      The clearest adverse signal is the June 2025 dispute in which a customer said a routine purchase of about Rp 1 million was followed by a BBTN transaction valued at about Rp 1.8 billion. Ajaib's reported investigation said the registered device and confirmation process authenticated the trade and found no system disruption; those positions leave authorization and user understanding contested rather than resolved. BEI said the customer could report through OJK or the exchange's whistleblowing channel and did not rule out an audit. Separately, the reviewed margin-rule explainer describes 65% financing and margin-call thresholds and an 80% forced-sale threshold. Together, the evidence makes consent design, feature defaults, surveillance, complaint handling, and independent remediation proof core operating risks for a platform aimed partly at first-time investors.
    claimRefs: [CR005, CR006, CR007, CR008, CR013]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: operating-financial-and-dependency
    title: Operating, financial, and dependency risks
    body: >-
      Product breadth compounds the control surface. The retained sources describe domestic equities, mutual funds, crypto, US stocks, bonds, banking, payments, savings, and stablecoin infrastructure, while an investor-affiliated case study says margin lending helped drive Ajaib's first reported profitable year in 2025. That account also says the market has become crowded and that Ajaib's early lead created distribution and brand recognition, not exclusivity. The 2026 financing reduces near-term capital pressure but introduces a material strategic dependency: Insignia and BackScoop report a $270 million SBI-led round and a roughly 20% stake. Funding raised is not cash available, reported accounting profit is not cash generation, and public sources do not disclose product-level credit losses, compliance costs, liquidity buffers, partner rights, or replacement-capital plans.
    claimRefs: [CR009, CR010, CR011, CR012, CR014, CR015]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators and thesis-break triggers
    body: >-
      Monitoring should be entity- and product-specific. Regulatory indicators are the PEKU election, paid-up capital, MKBD headroom, positive equity, quarterly transition filings, compliance appointments, controller disclosures, and foreign-product approvals. Customer-protection indicators are margin activation and eligibility, disputed-trade frequency, margin calls, forced sales, account freezes, complaint-resolution time, regulator referrals, confirmed security events, and independently verified remediation. Financial indicators should separate trading revenue, margin interest, funding proceeds, cash, credit losses, and compliance costs. A material licence or product restriction, missed capital milestone, repeated disputed leveraged trades with unresolved customer loss, or withdrawal of strategic capital without replacement would break the operating thesis. These are monitorable criteria derived from the retained evidence; public sources do not quantify safe thresholds for Ajaib.
    claimRefs: [CR002, CR003, CR005, CR008, CR010, CR011, CR016]
