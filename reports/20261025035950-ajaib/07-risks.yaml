      - [Market licences and infrastructure, OJK and BEI, "Licensing, supervision, trading eligibility, and complaint escalation", "Essential external dependency", "Licence restriction, capital intervention, delayed approval, or exchange action constrains a product", high, "Formal classifications, deadlines, and escalation channels exist", "Medium-high because Ajaib-specific filings and outcomes are not public"]
      - [Margin funding and customer collateral, "Ajaib securities entity and eligible retail customers", "Funds leveraged positions and supports margin income", "Balances and funding sources are undisclosed", "Market stress raises calls, forced sales, losses, or liquidity needs", high, "Regulatory eligibility, collateral, and liquidation thresholds limit exposure", "High until funding, collateral quality, concentration, and loss data are reviewed"]
      - [Customer activity and digital distribution, "Retail investors and mobile channels", "Supplies trading activity, balances, and cross-product adoption", "Broad reported reach, but funded-account and cohort concentration are unknown", "Competition or a trust event reduces activity and raises acquisition or support cost", medium-high, "Multi-asset breadth and educational positioning can diversify engagement", "High until cohorts, retention, contribution margins, and channel economics are provided"]
    notes: "Reported financing is not treated as available cash, and qualitative concentration labels do not represent disclosed revenue shares or contractual rights."
    claimRefs: [CR005, CR009, CR010, CR011, CR012, CR013, CR014, CR016]
