      - [Cross-asset operational or compliance failure, medium, high, "A broad product shelf and licensed activities are described; control ownership by entity is not public", "Medium-high because product and regulator boundaries multiply execution paths", "Entity map, reconciliations, vendor controls, custody arrangements, incident history, and recovery tests"]
      - [Digital-only availability or account-access failure, medium, high, "Company-reposted material emphasizes fully online delivery; current resilience evidence was not retained", "Medium-high because customers depend on the application to view and manage positions", "Service-level history, status reporting, recovery objectives, penetration tests, access-control reviews, and account-freeze procedures"]
    notes: "Likelihood and residual exposure are qualitative analyst ratings. No retained source proves a current breach or outage, so unavailable incident and resilience evidence is recorded as a gap rather than a clean bill of health."
