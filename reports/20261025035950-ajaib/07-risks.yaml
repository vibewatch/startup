callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: A repeated material leveraged-trade dispute, especially if independent review finds deficient consent, suitability, surveillance, or complaint remediation, would break the operating-control thesis even if users and reported revenue continue to grow.
    claimRefs: [CR005, CR006, CR007, CR008, CR016]
  - calloutType: assumption
    title: What public evidence cannot establish
    body: Funding raised is not cash available, reported net profit is not consolidated cash generation, and no retained report of a breach or enforcement action is not proof that no incident occurred.
    claimRefs: [CR010, CR011, CR014, CR015]
