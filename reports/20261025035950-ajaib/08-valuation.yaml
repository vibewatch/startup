      - ["Thesis", "Reported first net profit of about $1.4M indicates a possible transition from growth to earnings.", "Cash-flow reconciliation and repeat profitability establish durability."]
      - ["Thesis", "Reported scale exceeds 7M users and $13.4B platform transaction value.", "Funded-account cohorts, retention, and product-level contribution margin validate monetizable quality."]
      - ["Anti-thesis", "The latest reported stake implies about $1.35B without disclosed fully diluted terms or preferences.", "Primary financing documents verify ownership, liquidation preferences, and post-money capitalization."]
      - ["Anti-thesis", "Public fintech multiples compressed to five-year lows, weakening reliance on the 2021 unicorn mark.", "Sustained audited growth and profitability justify a premium to model-matched public peers."]
    notes: "Operating metrics are attributed to an investor portfolio publication and are not treated as audited consolidated results."
