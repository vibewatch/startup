company:
  name: "Ajaib"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Ajaib's August 2026 financing supplies a fresh market signal—$270 million for a reported
    20% stake, implying roughly $1.35 billion—but the public record still lacks the audited
    consolidated denominator, net debt, preference stack, and fully diluted capitalization
    needed to underwrite that mark. The recommendation is research-more, with low valuation
    confidence, high underwriting risk, and entry discipline tied to verified financial and
    cap-table evidence rather than a generic fintech multiple.
sections:
  - id: "recommendation-and-price-context"
    title: "Recommendation and current price context"
    body: >-
      The recommendation is research-more rather than buy or pass. Insignia reports that SBI
      invested $270 million for 20% of Ajaib in August 2026, implying roughly $1.35 billion,
      while Tracxn separately records a $270 million Series C and $515 million raised across
      six rounds. That is a meaningful fresh price signal, but it is not a complete equity
      underwriting: the reviewed disclosures do not establish whether the stake percentage
      is fully diluted, what preferences attach, or how net debt and cash bridge enterprise
      value to equity value. The last explicit earlier mark was $1 billion after a $153 million
      Series B in 2021. Entry should therefore be conditioned on primary deal documents and
      audited consolidated financials, not on headline valuation continuity.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis, anti-thesis, and evidence quality"
    body: >-
      The thesis rests on scale, product breadth, and an emerging profitability signal.
      Insignia reports 2025 net revenue of IDR 474 billion, 152% year-over-year growth, a first
      net profit of about $1.4 million, more than 7 million users, and $13.4 billion of platform
      transaction value. Those figures suggest that distribution can support monetization
      beyond commissions, while the company's multi-asset brokerage positioning broadens the
      addressable wallet. The anti-thesis is equally material: these operating figures come
      through an investor's portfolio publication rather than audited group accounts, the
      profit is not evidence of durable cash conversion, and the financing terms do not reveal
      preference or dilution overhang. A high-quality company can still be a poor investment
      at an unsupported price.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "scenario-framework"
    title: "Scenario framework and valuation discipline"
    body: >-
      Public benchmarks should be treated as calibration inputs, not as an Ajaib valuation.
      Finro's Q1 2026 dataset reports a 16.2x median EV/revenue multiple for 34 wealthtech and
      robo-advisor companies and a 7.2x Series C median across 55 companies, with a 3.8x–14.6x
      interquartile range. Windsor Drake reports much lower public-market anchors: 3.3x median
      forward revenue for asset and wealth management technology and 3.0x revenue for its
      wealthtech proxy. These are different populations and metric bases and must not be
      blended. The bear, base, and bull cases therefore state conditional benchmark bands,
      while withholding a company-specific value until comparable net revenue, EBITDA, net
      debt, and security terms are verified.
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness, return framing, and thesis-break triggers"
    body: >-
      Ajaib has strategic-financing evidence and reported profitability, but public evidence
      does not support a target return, hold period, or exit value. Windsor Drake says public
      fintech multiples were at five-year lows at June 30, 2026 and emphasizes matching the
      valuation metric to the business model; this makes a 2021 unicorn mark a weak standalone
      anchor. Before investment, diligence should reconcile regulated entities into audited
      group accounts, separate transaction, lending, and other revenue, verify cohort retention
      and credit performance, and obtain the fully diluted cap table and preference waterfall.
      Thesis-break triggers are failure to reconcile reported profit to cash generation, a
      preference-adjusted entry price that cannot clear the required return under the public
      wealthtech band, or regulatory and credit losses that invalidate the profitability signal.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
