callouts:
  - calloutType: "recommendation"
    title: "Price discipline dominates the decision"
    body: >-
      Treat the reported 2026 stake price as evidence of investor demand, not as proof that a
      new security offers an acceptable return. Require audited group economics, fully diluted
      ownership, preference terms, and an enterprise-to-equity bridge before setting price.
    claimRefs:
      - "CV001"
      - "CV015"
      - "CV016"
