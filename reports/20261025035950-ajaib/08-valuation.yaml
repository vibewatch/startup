  - id: "TV003"
    title: "Bull, base, and bear valuation framework"
    columns:
      - "Case"
      - "Explicit assumptions"
      - "Conditional valuation / return logic"
      - "Probability signal and downside trigger"
    rows:
      - ["Bear", "Profit does not convert to cash; margin lending or trading exposure weakens; preferences are senior.", "No company-specific value; use only the lower portion of Windsor Drake's 2.6x–5.2x forward-revenue asset/wealth-tech quartile after matching the denominator.", "Signal: reconciliation or regulatory gaps persist. Trigger: verified economics cannot support the reported stake implication."]
      - ["Base", "Audited revenue confirms growth, profitability repeats, and net debt plus preferences are manageable.", "No company-specific value; 3.3x forward revenue is a public asset/wealth-tech median reference, subject to private-company and metric-basis adjustments.", "Signal: two audited periods and cohort evidence. Trigger: growth normalizes without durable margin expansion."]
      - ["Bull", "Multi-asset scale produces durable growth, clean cash conversion, low credit losses, and strategic optionality.", "No company-specific value; compare separately with Finro's 7.2x Series C median and 3.8x–14.6x interquartile range only after reconciling metric definitions.", "Signal: audited Rule-of-40-style efficiency and clean cap table. Trigger: premium depends on unaudited or non-comparable revenue."]
      - ["Method constraint", "Enterprise value, equity value, revenue, ARR, transaction value, and funding raised remain distinct.", "Deduct verified net debt and model the preference waterfall before translating any enterprise-value multiple into investor proceeds.", "Signal: complete primary data room. Trigger: any bridge relies on headline funding or transaction volume as revenue."]
    notes: "Ranges are external benchmark multiples with different populations and periods, not a probability-weighted Ajaib valuation or an equity-price recommendation."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
