evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited GAAP financial statements, gross margin percentages, and monthly operating cash burn since Series C/D/E
      financings.
    whyItMatters: >-
      Disclosed annualized run rate of >$250M does not illuminate underlying unit economics, cloud gross margins, or
      operational sustainability.
    diligencePath: >-
      Request confidential financial disclosure package including balance sheet, income statement, and cloud
      infrastructure COGS during formal diligence.
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: traction
    missingEvidence: >-
      Cohort-level gross revenue retention (GRR) and logo churn percentages to evaluate underlying customer stability
      beneath >200% NDR.
    whyItMatters: High NDR can mask customer attrition among smaller accounts if hyperscale logos expand disproportionately.
    diligencePath: Obtain SaaS retention waterfall by customer cohort and ARR tier.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete cap table and minority investor schedule beyond disclosed institutional leads and secondary participants.
    whyItMatters: >-
      Full shareholder distribution table TO003 captures major institutional syndicate leads but omits smaller angel
      investors and non-lead growth funds.
    diligencePath: Review full company stock ledger and cap table breakdown provided via investor data room.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: conversion-funnel
    missingEvidence: >-
      Empirical cohort data detailing the conversion rate and conversion latency of free open-source Temporal clusters
      to paying Temporal Cloud accounts.
    whyItMatters: Directly determines the long-term CAC efficiency and durability of Temporal's developer-led distribution flywheel.
    diligencePath: Request anonymized cohort conversion telemetry from management during commercial and financial diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Audited gross margin and logo churn disclosures for Temporal Cloud versus open-source self-hosted deployments.
    whyItMatters: >-
      Without segmented gross margins, assessing whether managed service pricing covers underlying compute and storage
      infrastructure costs is impossible.
    diligencePath: >-
      Request confidential management presentations detailing cloud cohort margins and infrastructure cost structure
      under NDA.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: gross margin and infrastructure costs
    missingEvidence: Disclosed GAAP gross margins and cloud hosting infrastructure COGS breakdowns across AWS and Azure.
    whyItMatters: >-
      High action volume (1.9T+ monthly actions) could depress software gross margins if underlying hyperscaler compute
      and database replication costs scale linearly.
    diligencePath: >-
      Request management's monthly cloud infrastructure COGS schedules and gross profit margin by customer cohort under
      NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: performance-benchmarks
    missingEvidence: >-
      Independent audited p99 and p999 execution latency benchmarks and multi-region failover recovery timing for
      Temporal Cloud.
    whyItMatters: >-
      Enterprise tier-0 financial services and transaction processing workloads require sub-second p99 latency
      guarantees and verified failover bounds that cannot be substantiated solely through vendor-published marketing
      throughput claims.
    diligencePath: >-
      Request production SLA compliance reports, synthetic benchmark test suites, and multi-region failover post-mortems
      from Temporal's solutions architecture team under NDA.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: >-
      Audited gross revenue retention, net revenue retention, logo churn rates, and average contract length by customer
      tier.
    whyItMatters: >-
      Without disclosure of cohort retention, headline customer count expansion masks underlying gross logo churn and
      contract durability.
    diligencePath: >-
      Request confidential sponsor diligence materials detailing historical annual cohort retention, GRR/NRR waterfalls,
      and contract renewal terms.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue contribution and ARR concentration of the top 5, 10, and 20 largest Temporal Cloud customer accounts.
    whyItMatters: >-
      Given massive execution scale at accounts like Snap and Netflix, a high percentage of ARR may reside in a small
      handful of hyperscale accounts.
    diligencePath: >-
      Obtain an anonymized customer ARR distribution schedule and billing tier breakdown during confirmatory management
      diligence.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-security
    missingEvidence: >-
      Current certifications, DPA and subprocessor terms, regulator and court records, penetration-test results, and
      complete security-incident history.
    whyItMatters: Regulated-workload suitability and downside exposure cannot be established from architecture guidance alone.
    diligencePath: >-
      Obtain current assurance reports and legal schedules, then run regulator, court, sanctions, patent, and incident
      searches with management reconciliation.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: current-liquidity
    missingEvidence: Current cash balance, net burn, committed debt, working-capital needs, and runway.
    whyItMatters: Historical funding raised is not cash available and cannot establish present financing risk.
    diligencePath: Review monthly financial statements, bank and debt schedules, board-approved plan, and downside runway bridge.
    relatedQuestionRefs:
      - QR009
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Customer revenue concentration, cloud-provider spend concentration, partner-sourced pipeline, contract duration,
      renewal terms, and portability-test results.
    whyItMatters: Dependency severity and revenue durability cannot be sized from curated testimonials or solution announcements.
    diligencePath: >-
      Inspect customer and vendor concentration schedules, contracts, renewal cohorts, architecture maps, and recent
      failover or portability exercises.
    relatedQuestionRefs:
      - QR003
      - QR010
  - type: missing-source
    severity: material
    topic: operational-history
    missingEvidence: >-
      Company-wide outage frequency, realized SLA performance, SDK defect incidence, mean time to recovery, and patch
      adoption by customer cohort.
    whyItMatters: Product claims and one candid SDK disclosure do not quantify the frequency or customer impact of failures.
    diligencePath: Obtain status history, incident postmortems, support severity trends, SLA credits, and SDK-version telemetry.
    relatedQuestionRefs:
      - QR001
      - QR006
  - type: private-evidence-only
    severity: material
    topic: financing-terms-and-preference
    missingEvidence: >-
      Audited cap table details, liquidation preference seniority, and secondary transaction discounts from the
      2025-2026 financing rounds.
    whyItMatters: >-
      Heavy preference overhang or ratchets in the Series E round could subordinate early equity holders or restrict
      exit proceeds below the headline $12.55B mark.
    diligencePath: >-
      Review Series E stock purchase agreements, certificate of incorporation amendments, and cap table models during
      confirmatory legal diligence.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: gross-margin-and-infrastructure-unit-economics
    missingEvidence: >-
      Detailed breakdown of Temporal Cloud gross margins and cloud hosting infrastructure costs relative to agentic
      execution action volumes.
    whyItMatters: >-
      High action volume growth (1.9T+ monthly actions) could produce margin compression if cloud infrastructure unit
      costs fail to scale with customer contract tiers.
    diligencePath: >-
      Request management P&L breakdown by product line (OSS support vs. Cloud) and cloud infrastructure hosting bills
      during confirmatory financial review.
    relatedQuestionRefs:
      - QV005
