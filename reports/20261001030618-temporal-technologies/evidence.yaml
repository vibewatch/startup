    keyQuote: >-
      In 2004, Maxim led the development of Amazon’s messaging infrastructure, which became the foundation for Amazon
      SQS. Together, they launched the first public version of Amazon’s Simple Workflow Service. Later, Samar created
      the Azure Durable Task Framework at Microsoft, while Maxim developed groundbreaking tools like the Amazon Flow
      Framework. In 2015, they reunited at Uber to co-create Cadence, a transformative workflow engine that powered many
      of Uber’s services and applications, setting the stage for Temporal’s founding vision.
