chapter:
  number: 1
  title: "Company Overview"
  summary: "Temporal Technologies provides an open-source durable execution platform and managed cloud service that guarantees fault-tolerant, long-running workflow orchestration across distributed microservices and emerging agentic AI architectures. Co-founded in 2019 by distributed systems veterans Maxim Fateev and Samar Abbas following their creation of Uber Cadence and AWS SWF, the company reached a $12.55B valuation in its September 2026 Series E led by Lightspeed, scaling annualized run-rate revenue past $250M with over 4,300 paying enterprise customers."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Founding History, and Governance"
    body: "Temporal Technologies Inc. was founded in 2019 by distributed systems engineers Maxim Fateev and Samar Abbas to address the persistent failure-handling tax in distributed software architectures. Operating dual corporate hubs across Seattle, Washington and San Francisco, California, Temporal develops open-source durable execution software under the permissive MIT license alongside its enterprise commercial offering, Temporal Cloud. The founding team pioneered cloud workflow orchestration over two decades: Fateev led Amazon Simple Queue Service storage engines and AWS Simple Workflow Service (SWF) before co-authoring Cherami at Uber, while Abbas developed the Durable Task Framework at Microsoft Azure before teaming with Fateev at Uber to build Cadence. Cadence proved the paradigm at scale across hundreds of mission-critical Uber services, directly inspiring Temporal's founding in late 2019 with a seed round led by Amplify Partners. Corporate governance expanded significantly in October 2025 with the appointment of former VMware CFO/COO Jonathan Chadwick to the Board of Directors and former Harness CFO John Bonney as Chief Financial Officer, strengthening operational controls ahead of rapid enterprise scaling. While technical direction remains anchored by co-founders Fateev (Chief Technology Officer) and Abbas (Chief Executive Officer), governance maturity reflects institutional oversight from lead investors including Amplify Partners, Index Ventures, Sequoia Capital, Lightspeed Venture Partners, and Goldman Sachs Asset Management."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "capitalization-traction"
    title: "Capitalization Trajectory, Scale, and Enterprise Traction"
    body: "Temporal's capitalization history demonstrates accelerating institutional demand as durable execution transitioned from niche infrastructure into a foundational layer for production AI and mission-critical enterprise workflows. Across seven primary funding rounds and an investor-led tender offer, Temporal has accumulated approximately $1.2B in total primary equity capital. After achieving unicorn status at a $1.5B valuation across consecutive Series B rounds in February 2022 and February 2023, valuation expanded to $1.72B via a $146M Series C in March 2025, followed by a $105M secondary tender led by GIC at a $2.5B valuation in October 2025. In 2026, valuation inflected dramatically, more than doubling from $5B in a $300M Series D led by Andreessen Horowitz in February 2026 to $12.55B in a $550M Series E announced on September 14, 2026, co-led by Lightspeed Venture Partners, Wellington Management, Goldman Sachs Alternatives, and Tiger Global. Commercial traction expanded in lockstep: annualized revenue run rate crossed $250M in September 2026 representing over 200% year-over-year growth, driven by net dollar retention consistently exceeding 200% since February 2026. The commercial customer base reached more than 4,300 paying enterprises—a 139% year-over-year increase—spanning production deployments at Netflix, Snap, Stripe, Nvidia, and JPMorgan Chase. Global open-source adoption surpassed 43M installations in August 2026, while monthly Temporal Cloud action throughput surged to 1.9 trillion actions."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO016"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "product-roadmap-milestones"
    title: "Product Evolution, AI Orchestration, and Strategic Milestones"
    body: "The core technical premise of Temporal—Durable Execution—eliminates bespoke retry, state recovery, and queue plumbing by automatically persisting complete application execution state and event history. When network partitions, underlying host outages, or process crashes occur, Temporal seamlessly resumes workflows from their exact point of interruption. At Replay 2026 in May 2026, Temporal extended this architectural paradigm to address modern AI workloads and platform operations by introducing Serverless Workers on AWS Lambda, Standalone Activities, Workflow Streams for durable real-time token batching, and External Payload Storage via S3 drivers. To capture agentic workflows, Temporal launched first-party SDK integrations with the OpenAI Agents SDK and Google Agent Development Kit (ADK), alongside achieving the AWS AI Competency in Agentic AI. For hyperscale enterprise operations, Temporal Cloud added multi-region and multi-cloud replication with an automated 20-minute Recovery Time Objective (RTO), Worker Versioning, Task Queue Priority and Fairness controls, and Prometheus OpenMetrics telemetry. While these capabilities solidify Temporal as the execution engine for AI agents, critical diligence gaps remain regarding gross revenue retention, private profitability, and infrastructure concentration risk across hyperscale customers."
    claimRefs:
      - "CO010"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
