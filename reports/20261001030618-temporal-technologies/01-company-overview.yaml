callouts:
  - calloutType: "insight"
    title: "Durable Execution as the Agentic AI Runtime Substrate"
    body: "Temporal's commercial and valuation surge in 2026 is structurally coupled to the deployment of agentic AI systems. Because complex multi-step AI agents execute across days or weeks and experience frequent non-deterministic tool failures, standard microservice architectures collapse without durable execution. By persisting state and event history out of the box, Temporal enables AI frameworks like OpenAI and Google ADK to survive process failures and transient API outages without bespoke plumbing."
    claimRefs:
      - "CO003"
      - "CO010"
      - "CO012"
      - "CO014"
  - calloutType: "risk"
    title: "Private Unit Economics and Hyperscaler Co-opetition"
    body: "While Temporal boasts remarkable top-line momentum with >$250M ARR and >200% NDR, the company remains private with undisclosed gross margins, infrastructure hosting COGS, and GAAP operating losses. Furthermore, as cloud-native providers (AWS, Microsoft Azure, Google Cloud) observe Temporal's expanding capture of mission-critical orchestrations, native platform co-opetition and managed pricing pressure represent ongoing structural risks."
    claimRefs:
      - "CO011"
      - "CO013"
      - "CO016"
