company:
  name: "Temporal Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: "Temporal Technologies reached an annualized revenue run rate surpassing $250M in September 2026, scaling over 200% year-over-year behind 4,300+ paying enterprise customers and net dollar retention exceeding 200%. Fueled by a $550M Series E led by Lightspeed at a $12.55B valuation, the company maintains multi-year capital runway, though gross margins, unit costs, and cash burn remain undisclosed private metrics."
sections:
  - id: "revenue-streams-and-pricing-mechanics"
    title: "Revenue Model, Pricing Mechanics, and Monetization"
    body: "Temporal operates a commercial open-core and consumption-based cloud business model built atop its open-source MIT-licensed durable execution platform. The open-source software server enables developers to write resilient distributed applications and orchestrate complex agentic AI workflows, serving as the top-of-funnel adoption engine. Commercial monetization is primarily realized through Temporal Cloud, a fully managed platform-as-a-service offering where customers pay for infrastructure consumption, orchestration throughput, storage, and premium enterprise support. Pricing and billing units center on workflow executions, action volume, data storage, and enterprise namespace retention, while custom annual enterprise subscription commitments are negotiated for volume discounting, dedicated support SLAs, and private cloud deployments. Temporal's monetization strategy pairs developer-led product-led growth (PLG) self-serve signup with dedicated enterprise sales reps targeting Fortune 500 platform and engineering infrastructure teams."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "commercial-traction-and-sales-efficiency"
    title: "Public Commercial Traction and Sales Efficiency Proxies"
    body: "Temporal's commercial trajectory accelerated dramatically throughout 2026 as production agentic AI systems and enterprise microservices scaled on durable execution. By September 2026, Temporal reported that its annualized revenue run rate (ARR) surpassed $250M, growing over 200% year-over-year compared to early 2026 estimates of $125M ARR and 2025 revenues estimated around $61.9M. This expansion is driven by both new customer acquisition and massive net expansion: paying customers exceeded 4,300 organizations by September 2026 (up from ~2,500 at Series C in March 2025), including enterprise leaders such as OpenAI, Netflix, Snap, NVIDIA, and JPMorgan Chase. Crucially, Net Dollar Retention (NDR) has sustained above 200% since February 2026, demonstrating that once developer teams adopt Temporal Cloud for mission-critical workflows, their underlying throughput and transaction volumes compound rapidly across internal business units."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
  - id: "capital-adequacy-and-private-financial-gaps"
    title: "Capital Adequacy, Financing Dependency, and Underwriting Gaps"
    body: "On September 14, 2026, Temporal closed a landmark $550M Series E financing round led by Lightspeed Venture Partners with co-leads Wellington Management, Growth Equity at Goldman Sachs Alternatives, and Tiger Global, alongside T. Rowe Price and SV Angel, valuing the company at $12.55B post-money (reported on some comps as approximately $13B). This financing followed a $300M Series D round in February 2026 and brings cumulative equity and secondary capital raised across all rounds to between $1.1B and $1.2B. With over $550M in fresh primary liquidity and accelerating enterprise cash generation, Temporal faces minimal near-term financing dependency. However, substantial underwriting gaps remain for private diligence: gross margin percentages, cloud infrastructure cost of goods sold (COGS) across AWS/Azure, net cash burn, and customer concentration are strictly withheld from public disclosures, representing essential targets for confirmatory diligence."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
