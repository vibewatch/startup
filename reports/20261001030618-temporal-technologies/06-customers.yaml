        - label: Developer Discovery & Evaluation
          touchpoints:
            - "Open-source GitHub SDK download and quickstart documentation"
            - "Local workflow orchestration prototyping and testing"
          detail: "Individual software engineers evaluate Temporal's programming model for asynchronous retry handling."
        - label: Self-Service Cloud Signup & Activation
          touchpoints:
            - "Self-signup on Temporal Cloud with automated payment verification"
            - "Initial 14-day namespace creation and quickstart execution"
          detail: "PLG onboarding optimized with Amplitude data tracking to remove signup and activation friction."
        - label: Production Workload Deployment
          touchpoints:
            - "Migration of first mission-critical workflow to managed cloud"
            - "Direct integration into team CI/CD and observability tooling"
          detail: "Initial production cutover handling high-availability business processes (e.g., billing, notifications)."
        - label: Team Expansion & Enterprise Engagement
          touchpoints:
            - "Organic adoption spreading to adjacent engineering squads"
            - "Engagement with Solutions Architects and Enterprise Developer Advocates"
          detail: "Multiple namespaces spun up across engineering departments, expanding usage volume."
        - label: Enterprise Platform Standardization
          touchpoints:
            - "Enterprise contract negotiation with custom consumption tiers"
            - "Dedicated Slack support channels and Developer Success SLA coverage"
          detail: "Temporal becomes designated organizational standard for durable execution and distributed microservices."
        - label: Strategic Scaled Operations
          touchpoints:
            - "Billions of monthly actions across distributed multi-region clusters"
            - "Integration with global SI partners (e.g. Prodapt) for enterprise-wide transformation"
          detail: "Deeply entrenched infrastructure dependency with near-zero rip-and-replace probability."
