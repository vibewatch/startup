      - number: '2.3'
        title: 买方画像、客群细分与采购触发条件
        blocks:
          - type: paragraph
            body: >-
              Temporal 的商业化拓展兼具开发者自下而上驱动与企业自上而下审批的双轨模式，主要覆盖三类客户：云原生高成长企业、传统企业 IT 以及 AI
              原生初创公司。平台工程师、后端开发者和系统架构师通常先评估产品，目标是删掉分布式错误处理的样板代码；商业采购和预算审批则由中央基础设施工程负责人、首席信息官（CIO）及企业架构指导委员会决定。推动客户向
              Temporal Cloud 生产迁移的催化剂，是自建开源 Temporal Server 暴露的运维痛点，包括集群扩容瓶颈、数据库 Schema 维护开销以及多租户可观测性盲区。客户案例显示，有工程团队在切换至
              Temporal Cloud 前，每年需投入多达 8 个工程人月用于维护自建服务器；切换后每月直接省下 $30,000
              基础设施与运营成本。企业采购周期涵盖多区域高可用性与合规认证等技术评估，合同金额往往达六至七位数，跨越开发者工具与云基础设施预算。
            claimRefs:
