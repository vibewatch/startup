      - number: '7.2'
        title: 监管、法律与安全风险敞口
        blocks:
          - type: paragraph
            body: >-
              现有尽调证据表明 Temporal 有助于满足审计追踪要求，但这并不能证明任何特定客户的实际部署完全合规。在 AWS
              上托管的参考架构将云厂商故障、长周期运行状态、面向监管的可溯源性以及模型的非确定性表现列为生产落地挑战，并建议实施加密、密钥轮换、私有网络、策略管控、人工审核及监控手段；这些属于落地 Temporal
              时的配套实施义务，绝非引入 Temporal
              即可自动消除的管控负担。所审阅的有效来源中，没有关于当前认证清单、数据处理协议（DPA）条款、诉讼检索、监管记录或历史故障事故的公开证据。因此，本报告将隐私、安全及法律风险视为证据尚不充分的缺口，既非坐实存在合规缺陷，亦不代表从未发生过负面事件。
            claimRefs:
              - CR001
              - CR002
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR016
      - number: '7.3'
        title: 合作伙伴、云平台与运营模式依赖
        blocks:
          - type: paragraph
            body: >-
              Temporal 嵌入的系统架构中，整体表现并不完全取决于自身服务。以所引用的贷款审批设计为例，该方案依赖 AWS 计算、存储、模型基础设施、事件机制、密钥管理及外部数据源；Grid Dynamics
              的发布公告同样将预期收益归为前瞻性陈述，并明确警示实际结果可能存在出入。上述资料展示了生态借力能力，却无法作为衡量生产经济模型或集中度风险的独立证据。Temporal
              招聘页面显示其在安全、云底座、存储、计算、财务、商务合作、技术支持及销售等多部门广纳人才；一份公开的内部岗位说明亦提及针对容量、人效、销售区域及配额构建规划模型。如此广泛的人才布局契合扩张期企业的特征，但也意味着管控体系一旦滞后于业务增速，便会引发执行风险。合作伙伴合同、云厂商集中度及多云可移植性，仍需更直接的尽调核实。
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR013
              - CR014
