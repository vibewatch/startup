      - number: '8.2'
        title: 融资历程与估值变动
        blocks:
          - type: paragraph
            body: >-
              企业对持久执行的刚性需求，推动 Temporal 的资本化进程急剧加速。2026 年 2 月，公司完成由 Andreessen Horowitz 领投的 $300M Series D 轮融资，估值达
              $5.0B。短短六个月内，随着智能体 AI 框架和多云工作流编排在企业加速普及，据报道，融资前市场谈判曾为 $500M 融资提出不低于 $12B 的估值预期。2026 年 9 月 14 日，Temporal 敲定
              $550M Series E 轮融资，投后估值 $12.55B，由 Lightspeed Venture Partners 领投，Goldman Sachs Alternatives、Wellington
              Management 与 Tiger Global 联合领投，将股权融资总额推高至 $1.2B。尽管折算的 50.2x 历史 ARR 倍数，相比上市公有云基础设施公司 8x 至 15x 的预期市销率明显偏高，但
              Temporal 保持着三位数的高速扩张，叠加极高的切换成本，为资本下行风险筑牢了安全垫。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
      - number: '8.3'
        title: 乐观、基准与悲观情景建模
        blocks:
          - type: paragraph
            body: >-
              为评估在当前 $12.55B 入场估值下的风险调整后回报，我们以三年预测期为窗口，测算了乐观、基准与悲观三种运营情景。在乐观情景下，智能体 AI 编排全面普及并推动 NDR 持续保持在 160%
              以上，Temporal 的 ARR 将扩张至 $850M，按 25.0x 倍数计算，退出估值达 $21.25B。在基准情景下，营收增速放缓至成熟企业软件的 60% 至 80% 同比增长水平，ARR 达到
              $550M，前向市销率倍数收缩至 18.0x，退出估值折合 $9.90B。在悲观情景下，云巨头原生竞争挤压业务，ARR 降至 $350M，估值倍数压至 10.0x，退出估值为
              $3.50B。鉴于智能体基础设施蕴藏的不对称上行空间，该情景概率分布展现出颇具吸引力的预期价值，契合耐得住周期的长期资本。
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 退出就绪度、尽调重点与一票否决标准
        blocks:
          - type: paragraph
            body: >-
              Temporal 已为未来推进首次公开募股（IPO）做好战略准备，背后有 Goldman Sachs Alternatives、Wellington Management、T. Rowe Price
              等一线机构支持，也有 Andreessen Horowitz 和 Sequoia Capital 等早期风投支持。投入资金前，应核实经审计股权结构表中的优先级、清算优先权及老股交易折价，并评估 Temporal
              Cloud 托管集群的单位经济性是否能匹配激增的操作量。若净留存率（NRR）跌破 120%、头部企业客户贡献的 ARR 过于集中且缺少长期承诺，或大型超大规模云厂商推出兼容的托管式持久
              执行原语并造成显著开发者流失，应立即下调评级或退出。
            claimRefs:
              - CV003
              - CV007
              - CV011
              - CV013
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资建议：长期品类锚点
            body: >-
              Temporal 少见地兼具广泛的开发者采用和关键基础设施锁定效应，ARR 已超过 $250M，NRR 超过 200%。50x
              倍数几乎不给执行失误留余地，但其在任务关键型及智能体工作负载中的韧性，仍支撑长期投资者作出买入判断。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
