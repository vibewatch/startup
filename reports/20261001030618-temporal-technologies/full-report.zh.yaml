            body: >-
              Growth Market Reports 的独立行业分析显示，2025 年全球托管 Temporal 服务市场规模为 $1.52 billion，预计到 2034 年将以 27.5% 的复合年增长率增至
              $13.4 billion。北美是最大区域市场，占全球 41%（2025 年为 $623 million）；欧洲占 26.5%（$403 million），亚太地区占 21%（$319
              million）。软件层——涵盖核心编排服务器、API 及客户端语言 SDK——贡献了 58.5% 的市场价值，咨询、部署及托管云运营则占剩余的 41.5%。二级市场跟踪机构估计，截至 2026 年 9
              月，Temporal Technologies 的年度订阅收入运行率已达 $250 million，意味着其在托管工作流品类的初期可获取市场（SOM）渗透率约为 13% 至
