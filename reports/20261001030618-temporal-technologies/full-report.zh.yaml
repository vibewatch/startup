  - id: FE001
    title: 产品架构与执行栈
    type: stack
    summary: 从客户端应用代码到底层持久化存储及二级索引的六层架构栈。
    data:
      layers:
        - label: 应用与 SDK 层
          detail: 客户使用 Temporal SDK，以 Go、TypeScript、Python、Java 或 PHP 编写业务逻辑
        - label: Worker 集群与执行边界
          detail: 客户托管 Worker 进程，轮询任务队列并执行确定性工作流任务
        - label: 通信与加密平面
          detail: 单向 gRPC 连接，结合客户端载荷加密和 mTLS 传输安全
        - label: Temporal 服务集群引擎
          detail: Frontend、matching 和 history 服务协同处理状态转换及持久化计时器
        - label: 持久化与历史存储
          detail: 仅追加的工作流事件历史存储记录状态转换，支持崩溃后的确定性重放
        - label: 可见性与可观测性基础设施
          detail: ClickHouse、Elasticsearch、Prometheus 和 Grafana 数据管道负责查询索引与指标
    claimRefs:
      - CE001
      - CE004
      - CE009
      - CE012
      - CE013
  - id: FU001
    title: Temporal 客户采用与扩张路径
    type: journey-map
    summary: 展示从开发者发现产品，到企业平台标准化及持续扩张的生命周期阶段。
    approximationNotes: 阶段划分参照开发者主导型基础设施的常见采用路径，并由 Amplitude 案例研究及公司招聘记录佐证。
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU008
      - CU012
      - CU014
    data:
      items:
        - label: 开发者发现与评估
          touchpoints:
            - 从 GitHub 下载开源 SDK 并查阅快速入门文档
            - 本地搭建工作流编排原型并测试
          detail: 软件工程师个人评估 Temporal 的编程模型能否处理异步重试。
        - label: 自助注册云服务并启用
          touchpoints:
            - 自行注册 Temporal Cloud，自动验证付款方式
            - 前 14 天内创建 namespace 并运行快速入门示例
          detail: 借助 Amplitude 数据追踪优化 PLG 引导流程，减少注册和启用摩擦。
        - label: 生产工作负载部署
          touchpoints:
            - 将首个关键工作流迁移至托管云
            - 直接接入团队 CI/CD 和可观测性工具
          detail: 首次切换至生产环境，承载计费、通知等高可用业务流程。
        - label: 团队扩张与企业合作
          touchpoints:
            - 采用逐步扩展到相邻工程团队
            - 与解决方案架构师及企业开发者布道师合作
          detail: 各工程部门陆续创建多个 namespace，带动使用量增长。
        - label: 企业平台标准化
          touchpoints:
            - 谈判企业合同并定制用量档位
            - 使用专属 Slack 支持频道及 Developer Success SLA 服务
          detail: Temporal 成为组织内持久执行和分布式微服务的指定标准平台。
        - label: 战略级规模化运营
          touchpoints:
            - 分布式多区域集群每月执行数十亿次操作
            - 联合 Prodapt 等全球 SI 合作伙伴推进企业级转型
          detail: 基础设施依赖已深度嵌入，几乎不可能整体替换。
