      - number: '5.2'
        title: 平台模块、SDK 生态与 AI 智能体编排
        blocks:
          - type: paragraph
            body: >
              Temporal 平台由开源内核、全球托管云服务、覆盖主流编程语言的客户端 SDK，以及一套针对现代 AI 系统量身定制且持续扩充的编排原语共同构成。底层基础引擎为开源分布式系统 Temporal
              Server，基于宽松的 MIT 协议发布。追求全托管运维的企业通常选用 Temporal Cloud，这套按用量计费的 Serverless 服务经过压力测试，足以承受超过每秒 2 亿次执行（200
              million executions per second）。Temporal Cloud 屏蔽了集群配置、容量规划、多区域数据库持久化及软件升级等复杂底层细节，同时与开源 SDK 接口保持完全兼容。


              Go、Python、TypeScript、Java 和 PHP 原生语言 SDK 是推动开发者广泛采用的核心抓手。这些 SDK 允许工程师以标准惯用代码构建复杂状态机，同时享有完整的 IDE
              代码补全、静态类型检查与可测试性。针对快速涌现的自主 LLM 负载，Temporal 持续升级其 AI 编排能力。多智能体系统高度依赖持久上下文、长时间工具调用及强容错的外部 API 协调，为此 Temporal
              推出了专属 AI SDK 底座，并积极开发 Nexus——一项跨命名空间通信原语，旨在可靠打通分布式服务与智能体工作流。
