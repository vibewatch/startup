    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Temporal Technologies 从创立、融资跃迁、架构版本发布到企业规模扩张的历程，时间跨度为 2019 至 2026 年。
    data:
      items:
        - label: 公司创立与种子轮融资
          date: 2019-11
          detail: Samar Abbas 和 Maxim Fateev 结束 Uber Cadence 项目后创立公司；Amplify Partners 领投 $6.8M 种子轮。
          tone: neutral
        - label: A 轮融资
          date: 2020-10
          detail: 完成 Sequoia Capital 领投的 $18.8M A 轮融资，用于扩展开源持久执行平台。
          tone: neutral
        - label: B 轮融资，跻身独角兽
          date: 2022-02
          detail: 完成 Index Ventures 领投的 $103M B 轮融资，估值达 $1.5B，确立开发者基础设施领域的领先地位。
          tone: neutral
        - label: B-Prime 轮追加融资
          date: 2023-02
          detail: 获得 Greenoaks 领投的 $75M B-Prime 轮融资，估值为 $1.5B；据报道，Temporal Cloud 客户数增长 20 倍。
          tone: neutral
        - label: C 轮融资
          date: 2025-03
          detail: 完成 Tiger Global 领投的 $146M C 轮融资，估值为 $1.72B，旨在加速企业 AI 采用并完善云平台功能。
          tone: neutral
        - label: 老股要约与高管治理
          date: 2025-10
          detail: GIC 领投 $105M 老股交易，估值为 $2.5B；任命 John Bonney 为 CFO、Jonathan Chadwick 为董事。
          tone: neutral
        - label: D 轮融资
          date: 2026-02
          detail: 完成 Andreessen Horowitz 领投的 $300M D 轮融资，估值为 $5B；Agentic AI 需求推动收入同比增长 >380%。
          tone: neutral
        - label: Replay 2026 产品发布
          date: 2026-05
          detail: 发布 Serverless Workers、Standalone Activities、Workflow Streams，以及与 OpenAI / Google Agent 的原生集成。
          tone: neutral
        - label: E 轮融资与 $12.55B 估值
          date: 2026-09
          detail: 完成 Lightspeed、Wellington、Goldman Sachs 和 Tiger Global 领投的 $550M E 轮融资；收入年化运行率超过 $250M。
          tone: neutral
    approximationNotes: 日期依据融资轮次、治理任命及 Replay 大会产品发布的公开公告时间。
    claimRefs:
      - CO001
      - CO002
      - CO005
      - CO006
      - CO007
      - CO008
      - CO010
      - CO014
      - CO015
  - id: FM001
    title: 市场规模结构：TAM、SAM 与 SOM 分层
    type: pyramid
    summary: 从广义云编排 TAM 到 Temporal 当前可触达的云市场机会，逐层拆解市场规模。
    data:
      items:
        - label: 总可寻址市场（TAM）：托管 Temporal 服务（2034）
          value: 13400
          unit: USD Millions
          detail: Growth Market Reports 预测的全球托管 Temporal 编排平台及相关专业服务市场。
        - label: 可服务市场（SAM）：全球基础市场（2025）
          value: 1520
          unit: USD Millions
          detail: 当前企业 IT 基础设施中托管工作流及 Temporal 服务的全球市场规模。
        - label: 核心组成 SAM：软件引擎层（2025）
          value: 889
          unit: USD Millions
          detail: 2025 年市场中用于软件平台、SDK 和工作流执行引擎的组成部分，占比为 58.5%。
        - label: Temporal 公司收入运行率（2026 年 9 月）
          value: 250
          unit: USD Millions
          detail: 私募市场情报机构估计的订阅收入运行率，代表公司初期市场渗透情况。
        - label: 北美区域市场基准（2025）
          value: 623
          unit: USD Millions
          detail: 最大的区域市场，占企业托管编排总支出的 41%。
        - label: 欧洲区域市场基准（2025）
          value: 403
          unit: USD Millions
          detail: 第二大区域市场，占全球托管编排支出的 26.5%。
    approximationNotes: 市场预测数据取自 Growth Market Reports（2026 年 6 月）；公司收入运行率取自私募市场情报机构 Multiples（2026 年 9 月）。
