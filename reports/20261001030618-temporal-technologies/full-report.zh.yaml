  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范畴与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              Temporal Technologies 面向分布式系统编排、微服务治理和开发者工作流基础设施市场。其核心产品以统一的持久执行运行时取代零散的应用级容错机制，例如自建重试数据库、死信队列、cron
              定时调度器与临时拼凑的 Saga 协调器。纳入考量的企业支出涵盖开发者工具预算、云原生应用基础设施、托管编排订阅及专业集成服务；纯分析型数据管道编排工具（如局限于定时批处理 ELT 的 Apache
              Airflow 或 Prefect）、运维监控平台（如 Datadog 或 Dynatrace）以及通用关系型或文档型持久化引擎则排除在外。Temporal 面临的主要现有替代方案包括：基于分库分表 SQL 或
              NoSQL 数据库自建的分布式事务引擎、点对点消息代理，以及传统企业服务总线（ESB）软件。Attentive 的生产演进印证了这一品类边界：工程团队起初尝试用基于领域特定语言的自研 Automation
              Engine 支撑业务扩张，最终仍迁移至代码优先的持久执行架构。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
