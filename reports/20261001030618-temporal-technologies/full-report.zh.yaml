      - number: '1.2'
        title: 融资历程、业务规模与企业落地
        blocks:
          - type: paragraph
            body: >-
              持久执行已从利基基础设施蜕变为生产级 AI 与核心企业工作流的底层基石，机构资金对 Temporal 的投资意愿持续升温。经历七轮一级市场股权融资及一轮投资方主导的要约收购，Temporal 累计吸纳约
              $1.2B 一级股权资本。公司在 2022 年 2 月与 2023 年 2 月连续两轮 Series B 融资中跨过 $1.5B 独角兽门槛；2025 年 3 月获 $146M Series C 轮融资，估值升至
              $1.72B；随后 GIC 在 2025 年 10 月领投 $105M 老股要约收购，估值升至 $2.5B。进入 2026 年，公司估值突然跃升：从 2026 年 2 月 Andreessen Horowitz
              领投的 $300M Series D 轮（估值 $5B），翻倍飙升至 2026 年 9 月 14 日公布的 $550M Series E 轮（估值 $12.55B，由 Lightspeed Venture
              Partners、Wellington Management、Goldman Sachs Alternatives 及 Tiger Global 联合领投）。商业化拓展同步爆发：2026 年 9
              月年化收入运行率突破 $250M，同比增速超 200%；自 2026 年 2 月以来，净美元留存率持续超过 200%。付费企业客户数突破 4,300 家——同比增长 139%——涵盖
              Netflix、Snap、Stripe、Nvidia 及 JPMorgan Chase 的生产环境部署。2026 年 8 月全球开源安装量突破 43M 次，Temporal Cloud 单月 action
              吞吐量更激增至 1.9 trillion actions。
