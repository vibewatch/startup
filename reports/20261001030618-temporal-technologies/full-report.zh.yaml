      - number: '5.4'
        title: 企业级安全、合规与可靠性管控
        blocks:
          - type: paragraph
            body: >
              Temporal 围绕企业安全边界与零信任原则打造其系统架构。由于 Worker 均使用指向 Temporal Service 的出站单向 gRPC
              连接发起网络通信，客户无需开放入站防火墙端口，也无需向公网暴露私有 VPC 端点。在 Workflow 和 Activity
              中处理的敏感业务数据，可在传输前利用客户自管密钥在客户端完成加密。在客户端加密模式下，Temporal Service 严格充当盲编排器角色，仅存储和调度加密后的事件载荷，自身不掌握明文解密密钥。


              为满足企业采购与治理要求，Temporal 在产品全生命周期和托管云运营中落实全面的合规控制。公司持有 SOC 2 Type II 鉴证报告与 ISO 27001 认证，并满足 GDPR 及 CCPA/CPRA
              等全球隐私法规。为提升运维韧性，官方建议部署多个 Worker 以降低单点故障风险；内部可观测性管道则借助 ClickHouse、Prometheus、Grafana、Loki 与 Thanos
              实时监控高吞吐集群健康状况。
            claimRefs:
              - CE009
              - CE010
              - CE013
