  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 对比工作流编排平台的持久执行能力深度，以及跨云和跨架构的可移植性。
    data:
      points:
        - label: Temporal Technologies
          x: 8.5
          'y': 9
          quadrant: 1
          note: 代码优先的持久执行方案，支持多云部署和灵活的开源自托管
        - label: AWS Step Functions
          x: 7.5
          'y': 2.5
          quadrant: 4
          note: 托管式持久性强，但紧密依赖 AWS 云服务和 JSON 状态定义
        - label: Apache Airflow
          x: 3.5
          'y': 8
          quadrant: 2
          note: 面向批处理数据管道 DAG 的编排，可跨多云环境运行
        - label: Prefect
          x: 5
          'y': 7.5
          quadrant: 2
          note: 以 Python 为核心的数据工作流自动化，开发者体验现代化
        - label: Microsoft BizTalk Server
          x: 4
          'y': 2
          quadrant: 3
          note: 传统企业应用集成及本地部署 XML 中间件
        - label: n8n
          x: 2.5
          'y': 6
          quadrant: 2
          note: 面向轻量业务运营的低代码集成工作流自动化
    approximationNotes: 按持久状态保存深度（X 轴）和云 / 框架可移植性（Y 轴）给出 1（低）至 10（高）的序数评分。
    claimRefs:
      - CP011
