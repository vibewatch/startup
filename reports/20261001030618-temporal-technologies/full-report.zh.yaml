      - number: '7.4'
        title: 资本状况、商业化能力与投资逻辑证伪标准
        blocks:
          - type: paragraph
            body: >-
              公开融资信息多属历史数据，不足以反映当前的流动性状况。Temporal 在 2023 年宣布完成 $75M B-Prime
              轮融资，并披露客户数与营收在过去一年实现二十倍增长，但这组指标无法说明现有的现金结余、烧钱速度、现金跑道、利润率或收入质量。同一新闻稿同时提及免费的 MIT
              开源软件与托管云选项，将开源转化与云端差异化打造推为核心的商业化课题。现有的客户案例多由官方筛选，未披露客户集中度与合同周期。因此，投资逻辑证伪的触发条件应包括：SDK
              或服务接连出现可靠性倒退且未获及时修复；未能证明具备支撑受监管业务的管控能力；出现重大合作伙伴或云厂商绑定且缺乏可移植性；云端转化率下滑；或在业务指标尚无法支撑下一轮估值前产生融资缺口。当前的现金跑道与集中度情况，需要管理层提供内部数据，不可单凭融资总额进行推算。
            claimRefs:
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 可靠性高度取决于架构配置与工程落地
            body: 持久执行减轻了故障处理负担，但 Ruby SDK 的问题披露与依赖网络拓扑的 SLA 表明，代码安全规范、SDK 版本跟进、可观测性以及多区域设计，才是决定最终可靠性的关键。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
          - type: callout
            title: 缺少运营数据支撑前需把好投资关卡
            body: 在获取当前现金与烧钱速度、客户与云厂商集中度、历史故障记录、内控审计报告及可移植性测试数据前，切勿将公开融资信息或架构主张作为残余风险较低的佐证。
            calloutType: recommendation
            claimRefs:
              - CR012
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与评级建议
        blocks:
          - type: paragraph
            body: >-
              在核心分布式系统与智能体 AI 应用编排领域，Temporal Technologies 展现出罕见的品类统治力。坐拥逾 4,300 家付费企业客户与超 43M
              次开源安装，公司已从深受开发者喜爱的开源工作流代码库，蜕变为全球企业事实上的持久执行标准。商业化体量同样得到验证：截至 2026 年 9 月，年化收入运行率达 $250M，同比增速突破
              200%，且净美元留存率持续维持在 200% 以上。尽管 $12.55B 的 Series E 轮投后估值折合约 50.2x
              ARR，估值倍数明显偏高，但鉴于平台对核心业务的强绑定、不断扩大的客户客群，以及在防止长周期自主 AI 工作流故障中的支柱作用，为放眼多年的成长期投资机构提供充分理由，给予长期「买入」（Buy）评级。
            claimRefs:
              - CV002
