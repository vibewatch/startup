      - number: '5.3'
        title: 分布式架构、确定性重放与持久化
        blocks:
          - type: paragraph
            body: >
              Temporal 的底层架构将执行编排与应用计算彻底解耦。客户应用把轻量级 Worker 集群部署在私有基础设施、公有云虚拟机或 Kubernetes 集群上。这些 Worker 借助 gRPC，经由单向
              Task Queue 轮询中央 Temporal Service。Temporal Service 为每次工作流执行维护一份不可变、仅追加的事件历史，详尽记录状态流转、定时器调度、Activity
              完成情况及子工作流调用。


              一旦 Worker 进程崩溃或基础设施发生故障倒换，新拉起的 Worker 依靠确定性重放（deterministic
              replay）恢复状态：从头重放已记录的事件历史，并匹配已完成事件，不再执行已完成的副作用。这套架构源自 Uber 的 Cadence 与 Microsoft 的 Durable Task
              Framework，历经近十年生产实战检验。为支撑超大规模的二级索引、工作流检索与运维可观测性，Temporal 的 Cloud Data Store 团队运用 ClickHouse 与
              Elasticsearch 等分析型后端配合多区域存储抽象，持续对 Visibility 持久化层进行现代化重构。
            claimRefs:
              - CE004
              - CE006
              - CE012
              - CE013
              - CE014
