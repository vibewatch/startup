        - Activity 超时必须仔细调校，以免误报故障引发连锁反应
      - - 基础设施自动化与 CI/CD 流水线
        - 定制 Jenkins/Bash 脚本或脆弱的轮询器
        - 长时韧性工作流可在服务器重启和网络分区后继续运行
        - 连续运行数天或数周仍可保证端到端执行，不丢失状态
        - 事件历史过长时，工作流需用 continue-as-new 创建检查点
      - - 自主 AI 智能体与工具执行
        - 无状态 LLM 提示词循环，依赖脆弱的外部会话存储
        - 持久化后台执行，将多步智能体交互保存在多次工具调用之间
        - 智能体可暂停、恢复，并顺畅应对第三方 API 限流
        - 架构仍在演进，SDK API 与客户端抽象也持续变化
    notes: 应用场景和架构对比依据企业部署及创始人撰写的架构论文整理。
