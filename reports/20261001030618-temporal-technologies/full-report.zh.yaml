            title: 生产工作流的高昂切换成本
            body: >
              Temporal 借助语言 SDK（Go、Java、TypeScript、Python）直接嵌入客户应用架构，使得工作流直接承载关键业务。在 Netflix、Snap 及 Checkr
              等客户内部完成部署后，若要替换底层状态执行引擎，将面临巨大的架构重构风险与高昂的迁移成本。
            calloutType: strength
            claimRefs:
              - CU002
              - CU010
              - CU011
          - type: callout
            title: 客户集中度与运维支持压力
            body: >
              头部客户的 ARR 贡献度与客户 Logo 毛留存率（gross logo retention）均未公开披露，形成了信息盲区。企业级运维支持还需大量人工投入，专属 Slack
              沟通和战略级故障升级占用工程资源；公司需要专门负责人统筹，避免组织承压过重。
            calloutType: risk
            claimRefs:
              - CU012
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 分级风险全景与投资研判
        blocks:
          - type: paragraph
            body: >-
              最高级别的残余风险并非来自 Temporal 持久模型本身的失效，而在于使用者仍可能在模型周边写出不安全的操作。Temporal 的 Ruby SDK 团队曾披露，持久调度器与标准库互斥锁交互曾引发罕见的
              Workflow 卡死，官方随后明令禁止数种隐式持久语法。该技术通告还指出，不安全的阻塞式 I/O 容易触发默认 10 秒的 Workflow 任务超时。上述披露表明，工程落地规范、SDK
              回归测试与客户侧可观测性是尽调的核心考察点。另一项可用性风险源于系统架构层面：所引 AWS 文档标称单区域 99.9%、多区域 99.99%
              的可用性，意味着更强的可用性表现取决于客户是否选配并实际运行更高可用性的架构配置。投资研判上，应当将可靠性视作系统级综合运转的结果，而非产品自带且无条件的既成事实。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
