chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司主体、创立历史与治理结构
        blocks:
          - type: paragraph
            body: >-
              分布式系统工程师 Maxim Fateev 与 Samar Abbas 于 2019 年创立 Temporal Technologies Inc.，旨在化解分布式软件架构中顽固的故障处理负担。Temporal
              在华盛顿州西雅图与加利福尼亚州旧金山设立双总部，基于宽松的 MIT 协议开源其持久执行软件，并同步推出企业商业化产品 Temporal Cloud。两位创始人深耕云端工作流编排二十余年：Fateev 曾主导
              Amazon Simple Queue Service 存储引擎及 AWS Simple Workflow Service（SWF），随后在 Uber 联合开发了 Cherami；Abbas 则在
              Microsoft Azure 开发了 Durable Task Framework，随后在 Uber 与 Fateev 联手打造了 Cadence。Cadence 在 Uber
              数百个核心业务服务中完成了规模化验证，直接促成 Temporal 于 2019 年底正式成立，由 Amplify Partners 领投种子轮。2025 年 10 月，公司治理结构显著升级，前 VMware
              CFO 兼 COO Jonathan Chadwick 加入董事会，前 Harness CFO John Bonney 出任首席财务官，在企业快速扩张前强化了运营管控。目前技术路线仍由联合创始人
              Fateev（首席技术官）与 Abbas（首席执行官）掌握技术方向；Amplify Partners、Index Ventures、Sequoia Capital、Lightspeed Venture
              Partners 及 Goldman Sachs Asset Management 等领投机构也提供机构投资者层面的治理监督。
