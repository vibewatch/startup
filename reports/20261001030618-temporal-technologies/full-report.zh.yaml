              部署的切换成本极高，若要将持久工作流状态、活动定时器及事件历史迁移出该平台，需对代码库进行伤筋动骨的大规模重构。然而，初期采用门槛依然是道阻碍：工程团队必须接受并不熟悉的确定性执行模型与事件溯源心智模型。此外，PeerSpot
