      - number: '2.4'
        title: 增长催化剂与采用阻力
        blocks:
          - type: paragraph
            body: >-
              两大长期架构变革正推动该品类加速增长：一是企业单体架构向异步微服务拆分，二是生产级智能体 AI 应用崛起。由于智能体 LLM
              工作流与长时间运行的自主进程离不开持久状态存储、人机协同（human-in-the-loop）以及可靠的重试机制，开发者基础设施平台纷纷针对 AI
              编排推出专门的产品营销和技术能力。企业采用仍有明显阻力。架构切换成本很高：引入 Temporal 需要研发团队重划事务边界，改用事件驱动的工作流 SDK
              模式。此外，在受到严格监管的银行、金融服务与医疗健康领域，本地部署与数据主权合规要求限制了业务全盘托管至公有云。同时专职开发者人手紧缺，且 AWS Step Functions、Azure Logic Apps
              等传统云厂商编排工具往往打包进现有的企业折扣协议（EDAs），进一步拉长了企业销售周期。
            claimRefs:
              - CM003
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 开源转托管云的 TCO 转化拐点
            body: >-
              可量化的总体拥有成本（TCO）拐点，是驱动 Temporal 商业扩张的核心动力。开源模式降低了开发者的上手门槛，然而一旦业务规模扩大，自建 Temporal Server
              带来了沉重的数据库维护负担、持久化存储分片难题以及可观测性缺陷。以 Attentive 为例，其生产环境运维此前每年耗费 8 个工程人月，迁移至 Temporal Cloud 后每月直接节省
              $30,000。正是这类运维重负，促使自建开源的开发者转变为高意向的企业云买家。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代品类
        blocks:
          - type: paragraph
            body: >-
              工作流编排与业务流程自动化领域有几类路线并存。企业买家通常在三类方案中权衡：以 AWS Step Functions 为代表的云巨头原生编排引擎、以 Apache Airflow 和 Prefect
              为代表的批处理数据管道框架，以及以 Microsoft BizTalk Server 为代表的传统企业应用集成中间件。BizTalk
              这类传统平台主攻本地架构里的企业消息传递与数据转换，但在拥抱云原生微服务与敏捷迭代发布上步履维艰；Apache Airflow 等数据编排工具擅长为 ETL
              批处理调度有向无环图（DAG），却缺乏通用分布式应用后端所需的低延迟状态持久化、事件驱动信号及微秒级检查点机制；AWS Step Functions 虽然提供成熟的托管无服务器编排，却将开发者束缚在基于 JSON
              的状态机语法定义中，且与 AWS 底层基础设施深度绑定。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
      - number: '3.2'
        title: 架构差异化与技术能力
        blocks:
          - type: paragraph
            body: >-
              Temporal 的核心竞争优势源于「代码即工作流」（Workflows-as-Code）编程模型，将错误处理、分布式重试、状态持久化及 Saga 补偿逻辑，从碎片化的业务代码下沉到底层持久执行基座中。AWS
              Step Functions 强制工程团队把业务逻辑转译为 Amazon States Language 的 JSON 声明，Temporal 则允许开发者直接使用 Go、Python、TypeScript 和
              Java 等通用编程语言编写复杂逻辑。这一架构支持原生调试、单元测试与动态工作流组合，摆脱了私有 DSL 语法的束缚。此外，Temporal 具备企业级安全能力，拥有 SOC 2 Type II 认证、HIPAA
              合规支持及基于角色的访问控制（RBAC），契合银行、电商及医疗健康等关键业务部署要求。Netflix、Snap、Datadog 与 Instacart 等头部客户均在核心业务中采用
              Temporal，印证了该平台足以承受每秒数十万次执行（hundreds of thousands of executions per second）的超大规模事务吞吐量。
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP012
              - CP014
