  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品定义与持久执行模型
        blocks:
          - type: paragraph
            body: >
              Temporal Technologies
              提供面向开发者的持久执行平台，旨在从根源上消除分布式系统的复杂性。在现代微服务架构下，开发者往往被迫编写大量专有的错误处理、重试循环、数据库状态检查点及超时监控逻辑，以此协调多步骤工作流。Temporal
              将这套运维负担从应用代码下沉至专用执行引擎。引入持久执行抽象后，无论发生底层基础设施故障、网络分区还是意外进程重启，Temporal
              均可保证工作流代码完整执行完毕。无论是暂停数毫秒还是跨越数年运行，系统状态均能得到持久保存。


              Workflow（工作流）作为核心编排单元，直接采用通用编程语言实现，而非依赖专有的 JSON 或 YAML 配置文件。开发者可以使用熟悉的 async/await
              模式按顺序定义业务逻辑，并将耗时较长、易出错或涉及外部 API 调用的操作委托给 Activity。Activity
              支持自定义自动重试策略、超时配置与异步心跳机制。Snapchat、Coinbase、Netflix 及 OpenAI 等大型企业已将 Temporal
              部署于严苛的核心业务场景，包括实时支付处理、基础设施自动化置备，以及持续运行的后台 AI 智能体管线，在这些场景下事务正确性容不得丝毫差错。
            claimRefs:
