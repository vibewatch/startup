  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 综合开发者采用、商业规模、估值倍数纪律及最终投资立场的决策链。
    data:
      nodes:
        - id: oss-developer-scale
          label: 开发者势能：43M+ 次 OSS 安装及每月 1.9T+ 次操作，印证开发者广泛采用
        - id: commercial-expansion
          label: 商业规模：ARR 年化运行率 $250M，NDR >200%，企业客户 4,300+
        - id: category-dominance
          label: 品类标准：Agentic AI 架构事实上的持久执行底座
        - id: valuation-multiple
          label: 估值压力：$12.55B E 轮估值对应 50.2 倍 ARR，倍数压缩风险高
        - id: downside-protection
          label: 风险缓冲：切换成本高、深度集成关键业务、拥有一线客户
        - id: final-recommendation
          label: 投资结论：买入 / 估值偏高；长期持有需纪律性配置
    approximationNotes: 将定性战略驱动因素与量化门槛结合，作为投资决策的判断依据。
    claimRefs:
      - CV002
      - CV005
      - CV008
      - CV009
      - CV010
      - CV014
