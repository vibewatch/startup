schemaVersion: "report-v2"
artifact: risks
slug: temporal-technologies
runDate: 2026-10-01
company:
  name: Temporal Technologies
chapter:
  number: 7
  title: Risks
  summary: >-
    Temporal's principal evidenced risks are implementation-sensitive reliability, the control burden of regulated
    workloads, multi-system dependency exposure, and the execution demands of scaling a technical enterprise platform.
    Public evidence does not establish current cash runway, customer concentration, legal status, or incident history,
    so those items remain diligence gaps rather than assumed negatives.
sections:
  - id: ranked-risk-view
    title: Ranked risk view and investment implications
    body: >-
      The highest residual exposure is not evidence that Temporal's core durability model is ineffective; it is that
      adopters can still create unsafe behavior around that model. Temporal's Ruby SDK team disclosed a rare Workflow
      hang caused by interaction between the durable scheduler and a standard-library mutex, then prohibited several
      implicitly durable constructs. The same technical note says unsafe blocking I/O can make the default ten-second
      Workflow task timeout more likely to be hit. These disclosures make implementation discipline, SDK regression
      testing, and customer observability central diligence items. A separate availability risk remains architectural:
      the cited AWS reference claims 99.9% single-region and 99.99% multi-region availability, so the stronger posture
      depends on customers selecting and operating the higher-availability configuration. The investment implication
      is to underwrite reliability as a system outcome, not as an unconditional product property.
    claimRefs: [CR003, CR004, CR005, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: regulatory-legal-and-security
    title: Regulatory, legal, and security exposure
    body: >-
      The assigned evidence shows how Temporal can support auditability, but it does not prove that any particular
      customer deployment is compliant. The AWS-hosted reference architecture identifies provider failures,
      long-running state, regulator-facing traceability, and nondeterministic model behavior as production challenges.
      It recommends encryption, secret rotation, private networking, policy controls, human review, and monitoring;
      these are implementation obligations surrounding Temporal rather than controls that disappear when Temporal is
      adopted. No assigned successful source supplies a current certification inventory, DPA terms, litigation search,
      regulator record, or incident history. Accordingly, the register treats privacy, security, and legal posture as
      partially evidenced gaps, not as confirmed deficiencies and not as proof that no adverse event has occurred.
    claimRefs: [CR001, CR002, CR006]
    tableRefs: [TR001]
  - id: dependencies-and-operating-model
    title: Partner, platform, and operating-model dependencies
    body: >-
      Temporal participates in architectures whose outcomes depend on more than its own service. The cited loan
      underwriting design uses AWS compute, storage, model infrastructure, eventing, secrets, and external data
      providers; the Grid Dynamics announcement similarly frames expected benefits as forward-looking and explicitly
      warns that results may differ. These sources demonstrate ecosystem leverage but not independent proof of
      production economics or concentration. Temporal's careers page also shows hiring across security, cloud
      foundations, storage, compute, finance, partnerships, support, and sales, while a reposted company role described
      planning models for capacity, productivity, territories, and quotas. That breadth is consistent with a scaling
      organization and creates execution risk if control systems lag growth. Partner contracts, cloud concentration,
      and portability need direct diligence.
    claimRefs: [CR007, CR009, CR010, CR013, CR014]
    tableRefs: [TR003]
  - id: capital-commercialization-and-kill-criteria
    title: Capital, commercialization, and thesis-break criteria
    body: >-
      Public funding evidence is historical rather than a current liquidity statement. Temporal announced a $75
      million B-Prime financing in 2023 and reported twenty-fold customer and revenue growth over the preceding year,
      but neither metric establishes present cash, burn, runway, margins, or revenue quality. The same release describes
      both free MIT-licensed software and a managed cloud option, making conversion and cloud differentiation important
      commercialization questions. The assigned customer material is company-curated and does not disclose
      concentration or contractual durability. Thesis-break triggers should therefore include repeated SDK or service
      reliability regressions without prompt remediation, failure to evidence regulated-workload controls, material
      partner or cloud lock-in without portability, weakening cloud conversion, or financing needs arising before
      operating evidence supports the next round. Current runway and concentration require management data rather than
      extrapolation from funding raised.
    claimRefs: [CR011, CR012, CR015, CR016]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule area
      - Jurisdiction / scope
      - Evidence status
      - Likelihood assessment
      - Severity
      - Mitigation evidenced
      - Residual exposure
      - Diligence path
    rows:
      - - Regulated AI decision auditability
        - Customer-specific; financial-services example
        - Reference architecture only
        - Medium; required controls are explicit
        - High
        - Immutable history, human review, policy controls, monitoring
        - High until a production control test is reviewed
        - Obtain a customer control matrix, audit export sample, and model-governance test
      - - Privacy and security controls
        - Deployment-specific
        - Best-practice guidance; certification inventory absent
        - Medium; sensitive-data use case is documented
        - High
        - Encryption, secret rotation, private networking, access policy
        - Medium-high because implementation remains customer- and stack-dependent
        - Review SOC reports, DPA, subprocessor list, penetration tests, and breach history
      - - Litigation, IP, and open-source obligations
        - Multi-jurisdictional
        - MIT license documented; legal record not established by assigned sources
        - Unknown
        - Medium-high
        - Permissive licensing reduces some adoption friction
        - Unknown; absence of a cited case is not evidence of no case
        - Run court, patent, sanctions, export-control, and open-source compliance searches
    notes: >-
      Partial register based only on the assigned successful source pool; qualitative likelihood and severity are
      analytical assessments, and missing regulator, court, certification, and incident records remain evidence gaps.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers regulatory and legal themes evidenced by the assigned eight-source pool as of 2026-10-01, not every
        jurisdiction, license, certification, case, or incident.
    claimRefs: [CR001, CR002, CR003, CR006, CR016]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence-based likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitor / unresolved gap
    rows:
      - - Nondeterministic or illegal calls in Workflow code
        - Medium; deterministic constraints are inherent and documented
        - High
        - Documented guardrails and illegal-call tracing
        - Medium; transitive calls and language behavior require testing
        - Illegal-call events, replay failures, and SDK-specific regression coverage
      - - SDK/runtime interaction causes a Workflow hang
        - Low-frequency but observed in the Ruby SDK disclosure
        - High
        - Corrective design change documented
        - Medium until regression incidence and upgrade adoption are known
        - Hang rate by SDK version, mean time to detect, and patch uptake
      - - Unsafe blocking I/O contributes to task timeout
        - Conditional on explicit unsafe opt-in
        - Medium-high
        - Warning and opt-in boundary documented
        - Medium
        - Workflow task timeout rate and unsafe API usage
      - - Regional service disruption or inadequate HA configuration
        - Medium; SLA differs by deployment topology
        - High
        - Multi-region option and monitoring guidance documented
        - Medium-high for customers remaining single-region
        - Regional architecture mix, SLA credits, incident history, recovery tests
    notes: >-
      Ratings distinguish an observed SDK defect from conditional misuse and architecture choices; no assigned source
      provides company-wide incident frequency, customer deployment mix, or realized SLA performance.
    claimRefs: [CR003, CR004, CR005, CR008, CR013]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or surface
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation evidenced
      - Residual exposure
    rows:
      - - Cloud, model, and external data stack
        - AWS services and third-party providers in the cited reference architecture
        - Compute, storage, models, eventing, secrets, and underwriting data
        - Not disclosed for Temporal's business
        - Provider outage, API change, or control failure disrupts the end-to-end solution
        - High
        - Retries, fallback providers, state persistence, and monitoring
        - Medium-high; solution resilience spans several vendors
      - - Joint solution and delivery ecosystem
        - Grid Dynamics
        - Enterprise agentic-AI platform and go-to-market collaboration
        - Economics and customer dependence not disclosed
        - Expected benefits or adoption do not materialize
        - Medium
        - Collaboration and integration are publicly described
        - Medium; announcement is partner-issued and forward-looking
      - - Scaling commercial and operating capacity
        - Internal GTM, finance, security, cloud, and support functions
        - Capacity planning, quotas, platform operation, and customer coverage
        - Headcount and productivity denominators not disclosed
        - Hiring breadth outpaces management systems or efficient growth
        - Medium-high
        - Dedicated planning role and broad functional hiring evidence
        - Medium-high pending productivity, burn, and service-quality data
    notes: >-
      This is a dependency-focused sample, not a complete supplier list; the public evidence does not disclose vendor
      spend concentration, termination rights, portability test results, or partner-sourced revenue.
    claimRefs: [CR007, CR009, CR010, CR011, CR014]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Qualitative residual-risk view separates documented failure modes from unverified financial and concentration gaps.
    data:
      columns:
        - Impact
        - Evidence-based likelihood
        - Mitigation maturity
        - Residual severity
      rows:
        - label: SDK determinism and runtime interaction
          values: [High, Medium, Documented guardrails, Medium-high]
        - label: Regulated-workload control implementation
          values: [High, Medium, Architecture guidance only, High]
        - label: Regional availability configuration
          values: [High, Medium, Multi-region option documented, Medium-high]
        - label: Partner and external-service dependency
          values: [High, Medium, Fallback patterns documented, Medium-high]
        - label: Scaling execution and operating controls
          values: [Medium-high, Medium, Hiring and planning signals, Medium-high]
        - label: Current runway and customer concentration
          values: [High, Unknown, Not publicly evidenced, High uncertainty]
    approximationNotes: >-
      Ordinal assessments use only the assigned sources; "Unknown" and "High uncertainty" flag missing evidence and are
      not numerical probability estimates.
    claimRefs: [CR004, CR008, CR010, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Reliability is configuration- and implementation-dependent
    body: >-
      Durable execution reduces failure-handling burden, but the Ruby SDK disclosure and topology-dependent SLA show
      that safe code, current SDKs, observability, and multi-region design still determine realized reliability.
    claimRefs: [CR003, CR004, CR005, CR008]
  - calloutType: recommendation
    title: Gate investment on missing operating evidence
    body: >-
      Require current cash and burn, customer and cloud-provider concentration, incident history, control reports, and
      portability tests before treating public funding or architecture claims as proof of low residual risk.
    claimRefs: [CR012, CR014, CR015]
