    title: Product Architecture & Execution Stack
    type: stack
    summary: Six-layer architectural stack from client application code down to persistent storage and secondary indexing.
    data:
      layers:
        - label: Application & SDK Layer
          detail: Customer business logic authored in Go, TypeScript, Python, Java, or PHP using Temporal SDKs
        - label: Worker Fleet & Execution Boundary
          detail: Customer-hosted worker processes polling task queues and executing deterministic workflow tasks
        - label: Communication & Encryption Plane
          detail: Unidirectional gRPC connections with client-side payload encryption and mTLS transport security
        - label: Temporal Service Clustering Engine
          detail: Frontend, matching, and history services coordinating state transitions and durable timers
        - label: Persistence & History Store
          detail: Append-only workflow event history store recording state transitions for deterministic crash replay
        - label: Visibility & Observability Infrastructure
          detail: ClickHouse, Elasticsearch, Prometheus, and Grafana pipelines for query indexing and metrics
