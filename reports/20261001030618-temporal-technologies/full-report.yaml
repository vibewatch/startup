  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Evidence & Drivers
      - What Would Change View
    rows:
      - - 'Core Thesis: AI Orchestration Standard'
        - >-
          Temporal is emerging as the default runtime abstraction for multi-step agentic workflows and critical
          distributed systems
        - OpenAI, Snap, NVIDIA, and 4,300+ paying logos build core execution logic on Temporal
        - Hyperscalers launching commoditized, open-compatible durable execution primitives
      - - 'Core Thesis: Exceptional Expansion Efficiency'
        - Platform architecture drives organic land-and-expand dynamics with best-in-class software retention
        - NDR sustained above 200% alongside 43M+ OSS installs and 1.9T monthly actions
        - Deceleration of cloud conversion cohorts or NDR dropping below 130%
      - - 'Anti-Thesis: Valuation Multiple Vulnerability'
        - At 50.2x ARR, the stock suffers extreme vulnerability to multiple compression if growth tapers
        - $12.55B mark prices in near-perfection with public enterprise comps trading at 8-15x
        - Accelerating ARR past $500M within 18 months, compressing multiple naturally
      - - 'Anti-Thesis: Cloud Margin Compression'
        - Surging workflow executions (1.9T/mo) without commensurate pricing leverage could depress cloud gross margins
        - Hosting and cloud compute overhead for stateful distributed execution across multi-cloud
        - Demonstrated gross margin expansion above 75% in commercial cloud contracts
    notes: >-
      Evaluation synthesizes primary investor disclosures, customer operational profiles, and public SaaS infrastructure
      multiple benchmarks as of Q3 2026.
