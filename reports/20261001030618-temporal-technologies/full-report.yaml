        title: Exhibits
        blocks:
          - type: callout
            title: Durable Execution as the Agentic AI Runtime Substrate
            body: >-
              Temporal's commercial and valuation surge in 2026 is structurally coupled to the deployment of agentic AI
              systems. Because complex multi-step AI agents execute across days or weeks and experience frequent
              non-deterministic tool failures, standard microservice architectures collapse without durable execution.
              By persisting state and event history out of the box, Temporal enables AI frameworks like OpenAI and
              Google ADK to survive process failures and transient API outages without bespoke plumbing.
            calloutType: insight
            claimRefs:
