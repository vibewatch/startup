              - CR012
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows how Temporal can support auditability, but it does not prove that any
              particular customer deployment is compliant. The AWS-hosted reference architecture identifies provider
              failures, long-running state, regulator-facing traceability, and nondeterministic model behavior as
              production challenges. It recommends encryption, secret rotation, private networking, policy controls,
              human review, and monitoring; these are implementation obligations surrounding Temporal rather than
              controls that disappear when Temporal is adopted. No assigned successful source supplies a current
              certification inventory, DPA terms, litigation search, regulator record, or incident history. Accordingly,
              the register treats privacy, security, and legal posture as partially evidenced gaps, not as confirmed
              deficiencies and not as proof that no adverse event has occurred.
            claimRefs:
              - CR001
              - CR002
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR016
      - number: '7.3'
        title: Partner, platform, and operating-model dependencies
        blocks:
          - type: paragraph
            body: >-
              Temporal participates in architectures whose outcomes depend on more than its own service. The cited loan
              underwriting design uses AWS compute, storage, model infrastructure, eventing, secrets, and external data
              providers; the Grid Dynamics announcement similarly frames expected benefits as forward-looking and
              explicitly warns that results may differ. These sources demonstrate ecosystem leverage but not independent
              proof of production economics or concentration. Temporal's careers page also shows hiring across security,
              cloud foundations, storage, compute, finance, partnerships, support, and sales, while a reposted company
              role described planning models for capacity, productivity, territories, and quotas. That breadth is
              consistent with a scaling organization and creates execution risk if control systems lag growth. Partner
              contracts, cloud concentration, and portability need direct diligence.
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Capital, commercialization, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Public funding evidence is historical rather than a current liquidity statement. Temporal announced a $75
              million B-Prime financing in 2023 and reported twenty-fold customer and revenue growth over the preceding
              year, but neither metric establishes present cash, burn, runway, margins, or revenue quality. The same
              release describes both free MIT-licensed software and a managed cloud option, making conversion and cloud
              differentiation important commercialization questions. The assigned customer material is company-curated
              and does not disclose concentration or contractual durability. Thesis-break triggers should therefore
              include repeated SDK or service reliability regressions without prompt remediation, failure to evidence
              regulated-workload controls, material partner or cloud lock-in without portability, weakening cloud
              conversion, or financing needs arising before operating evidence supports the next round. Current runway
              and concentration require management data rather than extrapolation from funding raised.
            claimRefs:
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reliability is configuration- and implementation-dependent
            body: >-
              Durable execution reduces failure-handling burden, but the Ruby SDK disclosure and topology-dependent SLA
              show that safe code, current SDKs, observability, and multi-region design still determine realized
              reliability.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
          - type: callout
            title: Gate investment on missing operating evidence
            body: >-
              Require current cash and burn, customer and cloud-provider concentration, incident history, control
              reports, and portability tests before treating public funding or architecture claims as proof of low
              residual risk.
            calloutType: recommendation
            claimRefs:
              - CR012
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Temporal Technologies presents an exceptional profile of category leadership in mission-critical
              distributed systems and agentic AI application orchestration. With over 4,300 paying enterprise
              organizations and more than 43 million open-source installations, the company has transitioned from a
              developer-loved open-source workflow library into the de facto durable execution standard for global
              enterprises. Commercial scale is evidenced by a $250 million annualized revenue run rate growing at more
              than 200% year-over-year as of September 2026, reinforced by sustained net dollar retention exceeding
              200%. Although the $12.55 billion Series E post-money valuation represents a stretched multiple of
              approximately 50.2x ARR, the platform's mission-critical stickiness, expanding customer cohorts, and
              pivotal role in preventing failures across long-running autonomous AI workflows justify a long-term Buy
              recommendation for growth investors with a multi-year horizon.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.2'
        title: Financing History and Valuation Dynamics
        blocks:
          - type: paragraph
            body: >-
              Temporal's capital trajectory reflects rapid acceleration driven by enterprise durable execution demands.
              In February 2026, the company raised a $300 million Series D round led by Andreessen Horowitz at a $5.0
              billion valuation. Within six months, surging enterprise adoption of agentic AI frameworks and multi-cloud
              workflow orchestration prompted pre-round market negotiations reported at $12 billion or higher for a $500
              million facility. On September 14, 2026, Temporal closed a $550 million Series E at a $12.55 billion
              valuation led by Lightspeed Venture Partners, with co-leads Goldman Sachs Alternatives, Wellington
              Management, and Tiger Global, bringing cumulative equity raised to $1.2 billion. While the implied 50.2x
              trailing ARR multiple is elevated relative to public cloud infrastructure comps trading between 8x and 15x
              forward revenue, Temporal's triple-digit expansion rate and high switching costs provide downside
              protection against severe capital destruction.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
      - number: '8.3'
        title: Bull, Base, and Bear Scenario Modeling
        blocks:
          - type: paragraph
            body: >-
              To evaluate risk-adjusted return profiles from the current $12.55 billion entry valuation, we examine
              bull, base, and bear operating scenarios across a three-year forecast window. Under the bull case,
              Temporal scales ARR to $850 million propelled by ubiquitous adoption of agentic AI orchestrations and
              sustained NDR above 160%, supporting an exit valuation of $21.25 billion at a 25.0x multiple. In the base
              case, revenue growth decelerates toward mature enterprise software rates of 60% to 80% YoY, achieving $550
              million ARR with multiple contraction to 18.0x forward revenue, yielding a $9.90 billion valuation. The
              bear case models deceleration to $350 million ARR alongside multiple compression to 10.0x driven by
              hyperscaler native competition, resulting in an exit value of $3.50 billion. Given the asymmetric upside
              in agentic infrastructure, the scenario probability distribution supports an attractive expected value for
              patient capital.
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exit Readiness, Diligence Priorities, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Temporal is strategically positioned for an eventual initial public offering, supported by tier-one
              institutional backing including Goldman Sachs Alternatives, Wellington Management, and T. Rowe Price
              alongside early venture sponsors Andreessen Horowitz and Sequoia Capital. Key diligence priorities prior
              to capital commitment include confirming audited cap table seniority, liquidation preferences, and
              secondary trading discounts, alongside unit economics across managed Temporal Cloud clusters relative to
              surging action volumes. Key kill criteria and thesis-break triggers that would prompt immediate downgrade
              or divestment include net dollar retention deteriorating below 120%, customer concentration where top
              enterprise accounts represent disproportionate ARR without long-term commitments, or major cloud
              hyperscalers offering compatible managed durable execution primitives that trigger significant developer
              defection.
            claimRefs:
              - CV003
              - CV007
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Recommendation: Long-Term Category Anchor'
            body: >-
              Temporal has demonstrated the rare combination of developer ubiquity and critical infrastructure lock-in,
              scaling to >$250M ARR with >200% NDR. While the 50x multiple leaves zero room for execution missteps, the
              franchise durability in mission-critical and agentic workloads supports a Buy recommendation for
              long-duration capital.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
