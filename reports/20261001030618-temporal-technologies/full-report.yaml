      - number: '1.2'
        title: Capitalization Trajectory, Scale, and Enterprise Traction
        blocks:
          - type: paragraph
            body: >-
              Temporal's capitalization history demonstrates accelerating institutional demand as durable execution
              transitioned from niche infrastructure into a foundational layer for production AI and mission-critical
              enterprise workflows. Across seven primary funding rounds and an investor-led tender offer, Temporal has
              accumulated approximately $1.2B in total primary equity capital. After achieving unicorn status at a $1.5B
              valuation across consecutive Series B rounds in February 2022 and February 2023, valuation expanded to
              $1.72B via a $146M Series C in March 2025, followed by a $105M secondary tender led by GIC at a $2.5B
              valuation in October 2025. In 2026, valuation inflected dramatically, more than doubling from $5B in a
              $300M Series D led by Andreessen Horowitz in February 2026 to $12.55B in a $550M Series E announced on
              September 14, 2026, co-led by Lightspeed Venture Partners, Wellington Management, Goldman Sachs
              Alternatives, and Tiger Global. Commercial traction expanded in lockstep: annualized revenue run rate
              crossed $250M in September 2026 representing over 200% year-over-year growth, driven by net dollar
              retention consistently exceeding 200% since February 2026. The commercial customer base reached more than
              4,300 paying enterprises—a 139% year-over-year increase—spanning production deployments at Netflix, Snap,
              Stripe, Nvidia, and JPMorgan Chase. Global open-source adoption surpassed 43M installations in August
              2026, while monthly Temporal Cloud action throughput surged to 1.9 trillion actions.
