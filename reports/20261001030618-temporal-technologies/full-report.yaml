      - number: '3.3'
        title: Commercial Packaging, Pricing Models, and Scale Cliffs
        blocks:
          - type: paragraph
            body: >-
              Temporal commercializes its technology through a dual open-source and managed cloud model. The core
              Temporal Server remains free and open-source under the MIT license, allowing self-hosting engineering
              teams to avoid initial licensing fees while building distributed architectures. For organizations seeking
              operational simplicity, Temporal Cloud provides a consumption-based managed service charging $50 per
              million actions alongside active storage at $0.042 per GB-hour and retained storage at $0.00105 per
              GB-hour. Temporal offers self-service volume discounts down to $25 per million actions, while larger
              enterprise commitments unlock customized contract terms. However, independent software evaluations
              indicate that high-throughput workloads can encounter steep pricing scale-cliffs under heavy volume. To
              mitigate onboarding and scaling friction, Temporal is heavily expanding its post-sales Platform
              Architecture and Solutions Architecture teams, ensuring that enterprise customers successfully navigate
              production architecture and operational cost governance.
