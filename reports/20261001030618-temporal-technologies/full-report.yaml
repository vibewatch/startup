  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and investment implications
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposure is not evidence that Temporal's core durability model is ineffective; it is
              that adopters can still create unsafe behavior around that model. Temporal's Ruby SDK team disclosed a
              rare Workflow hang caused by interaction between the durable scheduler and a standard-library mutex, then
              prohibited several implicitly durable constructs. The same technical note says unsafe blocking I/O can
              make the default ten-second Workflow task timeout more likely to be hit. These disclosures make
              implementation discipline, SDK regression testing, and customer observability central diligence items. A
              separate availability risk remains architectural: the cited AWS reference claims 99.9% single-region and
              99.99% multi-region availability, so the stronger posture depends on customers selecting and operating the
              higher-availability configuration. The investment implication is to underwrite reliability as a system
              outcome, not as an unconditional product property.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
