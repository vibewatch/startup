        title: Exhibits
        blocks:
          - type: callout
            title: The OSS-to-Cloud TCO Conversion Inflection
            body: >-
              Temporal's commercial expansion is propelled by a quantifiable total cost of ownership (TCO) inflection
              point. While open-source adoption allows frictionless developer onboarding, scaling the self-hosted
              Temporal Server introduces severe database maintenance, persistence store sharding challenges, and
              observability deficits. In production environments like Attentive, operations consumed eight
              engineering-months annually before migrating to Temporal Cloud, unlocking $30,000 in monthly direct
              savings. This operational burden transforms self-hosting developers into high-intent enterprise cloud
              buyers.
