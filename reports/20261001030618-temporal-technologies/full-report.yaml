              SDKs—represents 58.5% of market value, while consulting, deployment, and managed cloud operations
              constitute the remaining 41.5%. Secondary market trackers estimate Temporal Technologies' annual
              subscription revenue run-rate reached $250 million by September 2026, implying an initial serviceable
