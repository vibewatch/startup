      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: High Switching Costs in Production Workflows
            body: >
              Because Temporal embeds directly into customer application architectures via language SDKs (Go, Java,
              TypeScript, Python), workflows represent mission-critical business processes. Once deployed at customers
              like Netflix, Snap, and Checkr, replacing the underlying state execution engine carries substantial
              architectural risk and migration overhead.
            calloutType: strength
            claimRefs:
              - CU002
