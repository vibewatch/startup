  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Definition & Durable Execution Model
        blocks:
          - type: paragraph
            body: >
              Temporal Technologies delivers a developer-centric durable execution platform engineered to eliminate the
              fundamental complexity of distributed systems. In modern microservices architectures, developers are
              typically burdened with writing bespoke error handling, retry loops, database state checkpoints, and
              timeout monitors to coordinate multi-step workflows. Temporal shifts this operational burden from
              application code to a specialized execution engine. By introducing the durable execution abstraction,
              Temporal guarantees that workflow code executes to completion regardless of underlying infrastructure
              failures, network partitions, or unexpected process restarts. Whether an execution pauses for milliseconds
              or runs over years, state is durably preserved.


              Workflows represent the orchestration unit, implemented directly in standard programming languages rather
              than proprietary JSON or YAML configuration formats. Developers define business logic sequentially using
              familiar async/await patterns while delegating long-running, failure-prone, or external API operations to
              Activities. Activities support customizable automatic retry policies, timeout configurations, and
              asynchronous heartbeat mechanisms. Enterprise organizations such as Snapchat, Coinbase, Netflix, and
              OpenAI deploy Temporal for mission-critical operations where transactional correctness is non-negotiable,
              spanning real-time payment processing, infrastructure provisioning, and continuous background AI agent
              pipelines.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE011
      - number: '5.2'
        title: Platform Modules, SDK Ecosystem, and AI Agent Orchestration
        blocks:
          - type: paragraph
            body: >
              The Temporal platform spans an open-source core, a global managed cloud service, client SDKs across major
              programming languages, and an expanding suite of orchestration primitives tailored for modern AI systems.
              The foundational engine is Temporal Server, an open-source distributed system released under the
              permissive MIT license. Organizations seeking fully managed operations deploy Temporal Cloud, a serverless
              consumption-based offering tested to scale beyond 200 million executions per second. Temporal Cloud
              abstracts cluster provisioning, capacity planning, multi-region database persistence, and software
              upgrades while maintaining full compatibility with the open-source SDK surface.


              Developer adoption is driven by native language SDKs available for Go, Python, TypeScript, Java, and PHP.
              These SDKs allow engineers to model complex state machines as standard idiomatic code while preserving
              full IDE support, static type checking, and testability. To address the rapid emergence of autonomous LLM
              workloads, Temporal is expanding its AI orchestration capabilities. As multi-agent systems require
              persistent context, long-running tool execution, and resilient external API coordination, Temporal has
              introduced dedicated AI SDK foundations and is developing Nexus, a cross-namespace communication primitive
              designed to connect distributed services and agentic workflows reliably.
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE011
      - number: '5.3'
        title: Distributed Architecture, Deterministic Replay, and Persistence
        blocks:
          - type: paragraph
            body: >
              Temporal's underlying architecture decouples execution orchestration from application compute. Customer
              applications deploy lightweight Worker fleets on private infrastructure, public cloud virtual machines, or
              Kubernetes clusters. These Workers poll the centralized Temporal Service via unidirectional Task Queues
              using gRPC. The Temporal Service maintains an immutable, append-only event history for every workflow
              execution, recording state transitions, timer schedules, activity completions, and child workflow
              invocations.


              When a worker process crashes or an infrastructure failover occurs, a replacement Worker restores state
              through deterministic replay: it replays the recorded event history from the beginning, matching recorded
              completion events without re-executing completed side-effects. This architecture trace descends from
              Cadence at Uber and the Durable Task Framework at Microsoft, reflecting nearly a decade of production
              battle-testing. To support planet-scale secondary indexing, workflow filtering, and operational
              observability, Temporal's Cloud Data Store team is modernizing the Visibility persistence layer using
              analytical backends such as ClickHouse and Elasticsearch alongside multi-region storage abstractions.
            claimRefs:
              - CE004
              - CE006
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE009
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE012
              - CE013
      - number: '5.4'
        title: Enterprise Security, Compliance, and Reliability Controls
        blocks:
          - type: paragraph
            body: >
              Temporal's architecture is engineered around enterprise security boundaries and zero-trust principles.
              Because Workers initiate all network communication via outbound, unidirectional gRPC connections to the
              Temporal Service, customers do not need to open inbound firewall ports or expose private VPC endpoints to
              the public internet. Sensitive business data processed within Workflows and Activities can be encrypted
              client-side using customer-managed encryption keys before transmission. Under this client-side encryption
              paradigm, the Temporal Service acts strictly as a blind orchestrator, storing and managing encrypted event
              payloads without possessing cleartext decryption keys.


              To meet enterprise procurement and governance standards, Temporal enforces comprehensive compliance
              controls across its product lifecycle and managed cloud operations. The company maintains SOC 2 Type II
              attestation, ISO 27001 certification, and compliance with global privacy regulations including GDPR and
              CCPA/CPRA. Operational resilience is further reinforced by recommending multi-worker deployments to
              prevent single points of failure, while internal observability pipelines leverage ClickHouse, Prometheus,
              Grafana, Loki, and Thanos to monitor high-throughput cluster health.
            claimRefs:
              - CE009
              - CE010
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Client-Side Zero-Trust Payload Encryption
            body: >-
              Temporal's unidirectional worker-to-service gRPC architecture ensures that sensitive business payloads
              remain encrypted with customer keys, meaning Temporal Cloud never has access to unencrypted application
              data.
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: Worker Redundancy and Workflow Determinism Constraints
            body: >-
              Because state recovery relies on deterministic replay of historical events, any non-deterministic logic
              introduced into workflow definitions or a failure to maintain multiple worker instances can halt execution
              pipelines in production.
            calloutType: risk
            claimRefs:
              - CE002
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >
              Temporal's customer base spans two complementary consumption models: widespread open-source adoption by
              individual backend engineers and platform teams, and paid enterprise adoption of the managed Temporal
              Cloud service. The primary commercial buyers are platform engineering leaders, Chief Information Officers,
              and distributed systems architects seeking to eliminate custom state machines, saga patterns, and complex
              retry plumbing. Key user cohorts range from fast-scaling technology scale-ups running high-throughput
              consumer services—such as Snap managing Snap Stories and Instacart automating core order fulfillment—to
              enterprise software and compliance platforms like Checkr automating critical background checks. In
              addition, global telecommunications and IT services enterprises access Temporal through specialized system
              integration partners like Prodapt to modernize mission-critical operational workflows.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
