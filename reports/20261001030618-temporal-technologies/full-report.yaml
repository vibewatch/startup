      - number: '2.4'
        title: Growth Catalysts and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Category growth is accelerated by two secular architectural shifts: the decomposition of enterprise
              monoliths into asynchronous microservices and the rise of production-grade agentic AI applications.
              Because agentic LLM workflows and long-running autonomous processes require durable state persistence,
              human-in-the-loop coordination, and reliable retries, developer infrastructure platforms are establishing
              dedicated product marketing and technical capabilities for AI orchestration. Conversely, adoption velocity
              faces material enterprise friction. Architectural switching costs remain substantial: incorporating
              Temporal requires development teams to re-architect transaction boundaries and adopt event-driven workflow
              SDK paradigms. Additionally, on-premises and data sovereignty mandates in heavily regulated banking,
              financial services, and healthcare sectors restrict full public-cloud delegation. The enterprise sales
              cycle is further lengthened by specialized developer skill availability and incumbent cloud provider
              orchestration offerings (such as AWS Step Functions or Azure Logic Apps) bundled into existing enterprise
              cloud enterprise discount agreements.
