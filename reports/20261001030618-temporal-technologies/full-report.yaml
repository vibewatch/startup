  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Temporal Technologies sits within distributed system orchestration,
              microservices management, and developer workflow infrastructure. The core product offering replaces
              fragmented application-level resilience mechanisms—such as custom retry databases, dead-letter queues,
              cron schedulers, and ad-hoc saga coordinators—with a unified durable execution runtime. In-scope
              enterprise spend encompasses developer tooling budgets, cloud-native application infrastructure, managed
              orchestration subscriptions, and professional integration services. Out-of-scope spend includes pure
              analytical data pipeline orchestrators (such as Apache Airflow or Prefect when restricted to scheduled
              batch ELT), operational monitoring platforms (such as Datadog or Dynatrace), and general-purpose
              relational or document persistence engines. Major status-quo substitutes against which Temporal competes
              include internal distributed transaction engines built on sharded SQL or NoSQL databases, point-to-point
              message brokers, and legacy enterprise service bus software. Attentive's production evolution demonstrates
              this boundary: engineering teams initially attempted to support expanding workflows with an internal
              bespoke Automation Engine running a domain-specific language before migrating to code-first durable
              execution.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
