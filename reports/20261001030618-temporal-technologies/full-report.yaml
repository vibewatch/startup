              - CU011
          - type: callout
            title: Customer Concentration and Operational Support Headwinds
            body: >
              The absence of public reporting on top-customer ARR contribution and gross logo retention creates
              visibility gaps. In addition, enterprise operational support demands significant high-touch engineering
              resources across dedicated Slack channels and strategic escalations, requiring dedicated leadership to
              prevent organizational strain.
            calloutType: risk
            claimRefs:
              - CU012
