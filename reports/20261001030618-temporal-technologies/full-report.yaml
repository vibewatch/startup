chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding History, and Governance
        blocks:
          - type: paragraph
            body: >-
              Temporal Technologies Inc. was founded in 2019 by distributed systems engineers Maxim Fateev and Samar
              Abbas to address the persistent failure-handling tax in distributed software architectures. Operating dual
              corporate hubs across Seattle, Washington and San Francisco, California, Temporal develops open-source
              durable execution software under the permissive MIT license alongside its enterprise commercial offering,
              Temporal Cloud. The founding team pioneered cloud workflow orchestration over two decades: Fateev led
              Amazon Simple Queue Service storage engines and AWS Simple Workflow Service (SWF) before co-authoring
              Cherami at Uber, while Abbas developed the Durable Task Framework at Microsoft Azure before teaming with
              Fateev at Uber to build Cadence. Cadence proved the paradigm at scale across hundreds of mission-critical
              Uber services, directly inspiring Temporal's founding in late 2019 with a seed round led by Amplify
              Partners. Corporate governance expanded significantly in October 2025 with the appointment of former
              VMware CFO/COO Jonathan Chadwick to the Board of Directors and former Harness CFO John Bonney as Chief
              Financial Officer, strengthening operational controls ahead of rapid enterprise scaling. While technical
              direction remains anchored by co-founders Fateev (Chief Technology Officer) and Abbas (Chief Executive
              Officer), governance maturity reflects institutional oversight from lead investors including Amplify
              Partners, Index Ventures, Sequoia Capital, Lightspeed Venture Partners, and Goldman Sachs Asset
              Management.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
