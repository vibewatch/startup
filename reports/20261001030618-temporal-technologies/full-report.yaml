              - CU010
      - number: '6.3'
        title: Named Customer Proof, Durability, and Expansion Dynamics
        blocks:
          - type: paragraph
            body: >
              Named enterprise deployments validate that Temporal operates as core infrastructure rather than peripheral
              middleware. Tier-1 enterprise customers run mission-critical production applications handling extreme
              scale, such as production workloads reaching peak throughput of up to 300,000 executions per second.
              Production users include Netflix orchestrating resilient distributed services, Snap providing reliable
              infrastructure for global Stories, Checkr automating background checks, and Instacart streamlining
              business logic. Enterprise durability is supported by high technical friction to rip-and-replace once core
              business workflows are modeled as code. However, while commercial hiring for Developer Success leadership
              highlights premium Slack channels and strategic escalation management, Temporal does not disclose contract
              lengths, logo churn, or customer concentration among its top tier accounts.
            claimRefs:
              - CU010
