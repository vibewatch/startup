  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Categories
        blocks:
          - type: paragraph
            body: >-
              Temporal Technologies operates in a bifurcated workflow orchestration and business process automation
              landscape. Enterprise buyers evaluate solutions across three distinct categories: native cloud hyperscaler
              orchestration engines such as AWS Step Functions, batch-oriented data pipeline frameworks including Apache
              Airflow and Prefect, and legacy enterprise application integration middleware such as Microsoft BizTalk
              Server. While legacy platforms like BizTalk focus on enterprise messaging and data transformation in
              on-premises architectures, they struggle with cloud-native microservices adoption and iterative deployment
              velocity. In contrast, data orchestration tools like Apache Airflow excel at directed acyclic graph
              scheduling for extract-transform-load workloads, but lack the low-latency state persistence, event-driven
              signaling, and microsecond-level checkpointing required for general distributed application backends. AWS
              Step Functions provides robust managed serverless orchestration but constrains developers to JSON-based
              state machine definitions and tight Amazon Web Services infrastructure coupling.
