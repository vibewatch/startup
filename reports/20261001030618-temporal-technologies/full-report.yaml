      - number: '6.2'
        title: Adoption Trajectory and Scaling Metrics
        blocks:
          - type: paragraph
            body: >
              Commercial adoption of Temporal Cloud has expanded rapidly alongside developer community growth. While the
              open-source SDKs reached an estimated community base exceeding 200,000 developers, the managed Temporal
              Cloud service scaled from 350 production customers in early 2023 to surpassing 1,000 customers managing
              over 7,000 namespaces and 15 billion daily actions within its first eighteen months of commercial
              availability. By September 2026, private financial comps recorded over 4,300 paying customers and an
              annualized revenue run rate exceeding $250 million. To convert open-source developers into paying cloud
              tenants, Temporal introduced self-service signups and partnered with Amplitude to measure the full
              product-led growth funnel, achieving a 5x increase in weekly cloud signups and a nearly 50% improvement in
              account activation efficiency.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
