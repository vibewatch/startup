    {
      "id": "capital-history-and-investor-base",
      "title": "Capital history and investor base",
      "body": "Tradeshift has raised substantial capital over multiple cycles, but public sources disagree on totals depending on whether they count debt, grants, and secondary-like events. Tracxn’s 2026 funding history is the broadest tally, showing roughly $1.24 billion across 24 rounds. The latest fully disclosed round was the August 2023 financing expected to raise at least $70 million, led by HSBC with participation from existing investors including Notion, LUN Partners, Fuel, Doha Venture Capital, IDC Ventures, AYTK, and The Private Shares Fund. HSBC’s own release confirms a $35 million investment in two stages, a board seat, and the intention to launch a jointly owned embedded-finance venture. Earlier late-stage financing was heavier: TechCrunch and Tracxn describe a 2021 $200 million Series F / financing event linked to Koch and other backers, while TechCrunch’s 2023 follow-up says the last published valuation benchmark remained the 2021 $2.7 billion level and that the IPO path had been delayed. The result is a late-stage private company with ample capital raised, but still without public financial disclosure or recent price discovery beyond secondary market trackers.",
