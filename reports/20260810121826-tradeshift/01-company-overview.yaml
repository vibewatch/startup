    "number": 1,
    "title": "Company Overview",
    "summary": "Tradeshift is a Copenhagen-rooted, San Francisco-headquartered digital trade and AP automation platform whose public story now combines compliance-led enterprise software with embedded-finance ambitions alongside HSBC. The company has raised roughly $1.24 billion across private rounds, but its 2026 profile is defined as much by a post-founder leadership reset and inconsistent public scale metrics as by its long-standing buyer-supplier network."
  },
  "sections": [
    {
      "id": "identity-history-and-product-scope",
      "title": "Identity, history and product scope",
      "body": "Tradeshift’s identity is best understood as a long-running digital-trade platform with deep roots in European e-invoicing rather than a newly formed fintech. Its founders first worked on Danish public e-invoicing infrastructure and the open-source EasyTrade platform before commercializing Tradeshift in Copenhagen. The company’s own current about page simplifies that history into a 2010 founding date tied to European e-invoicing compliance, while an older corporate profile preserves the fuller chronology of 2005 roots, a 2009 corporate birth, and a 2010 product launch. Publicly, Tradeshift now positions itself as a global AP automation and e-invoicing compliance platform that also spans buyer-supplier collaboration, B2B marketplace workflows, and embedded finance. The headquarters moved from Copenhagen to San Francisco in 2012, and 2026 materials still frame the business as an international platform vendor serving large enterprises with complex supplier networks and regulatory requirements rather than a narrow SMB spend app.",
