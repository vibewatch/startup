  topStrengths:
    - Supplier-network positioning and multinational workflow proof create more moat than a narrow AP point solution.
    - >-
      E-invoicing regulation and Peppol-driven compliance complexity keep Tradeshift relevant to large enterprise buyers
      across many countries.
    - >-
      Named customer evidence from Air France, Unilever, and Schaeffler supports real production usage and cross-border
      deployment depth.
    - Embedded analytics and AI evidence suggests some measurable expansion upside beyond baseline workflow automation.
  topRisks:
    - >-
      The public $2.7B valuation anchor implies a premium multiple that already assumes strong bull-case execution
      despite limited disclosure.
    - >-
      SemFi-related losses, partner dependence, and finance-product complexity create meaningful multiple-compression
      risk versus pure software peers.
    - >-
      Tradeshift does not publicly disclose current ARR by product, margins, NRR, or cap-table waterfall, making equity
      underwriting unusually diligence-heavy.
    - >-
      Litigation, compliance rollout complexity, and any renewed financing stress could quickly weaken both customer
      trust and exit options.
  unresolvedGaps:
    - >-
      No retained public source provides audited 2024-2026 ARR, software-vs-finance revenue mix, or gross margin by
      stream.
    - >-
      The latest 409A, tender activity, and common-equity waterfall are not public, so enterprise-value headlines may
      overstate actual equity upside.
    - >-
      Public evidence does not resolve NRR, GRR, customer concentration, or the durability of cross-sell into
      embedded-finance products after SemFi.
    - >-
      The exact market-clearing price for current secondary liquidity remains opaque despite visible tracker and broker
      surfaces.
