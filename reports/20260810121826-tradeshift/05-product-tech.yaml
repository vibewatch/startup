    {
      "id": "compliance-and-trust-are-product-features-not-just-legal-overlays",
      "title": "Compliance and trust are product features, not just legal overlays",
      "body": "Tradeshift’s product depth is unusually tied to external standards and control surfaces. Monthly and seasonal release notes show that country mandates are not a side issue: the platform shipped France-specific tax-clearance fields, Poland KSeF flows and reconciliation, Malaysia exchange-rate requirements, India GST QR upload, Romania tax-rate updates, and a June 2026 UBL 2.1 migration. The Belgium mandate materials go further by tying the product to Peppol network infrastructure and to Babelway, which Tradeshift says powers Belgium’s Mercurius B2G platform. That means Tradeshift’s product advantage depends partly on how quickly it can operationalize external schema, routing, and clearance changes—not just on generic software usability.\n\nSecurity, privacy, and data governance are similarly productized. Tradeshift’s public security materials describe defense-in-depth, least-privilege access, secure development lifecycle controls, monitoring, backups, disaster recovery, and annual testing. The information-security policy commits to written breach notice within 48 hours, annual SOC 1, SOC 2, ISAE 3402, and ISO 27001 audit reports, annual third-party penetration testing, vulnerability management, and bug bounty programs. The privacy page adds GDPR and CCPA commitments, privacy-by-design training, and a defined DPO contact path. None of this proves perfect real-world execution, but it does show that trust posture is built into how Tradeshift sells the platform: multinational AP automation only works if customers believe the platform can carry regulated invoice data, preserve audit trails, and survive constant changes in local invoicing rules.",
