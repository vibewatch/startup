      - number: '3.5'
        title: Most important unresolved questions are win-loss data, pricing, and supplier overlap
        blocks:
          - type: paragraph
            body: >-
              The public record is still thin where an investor would most want hard evidence. None of the sources
              reviewed provide a clean win-loss dataset showing when Tradeshift beats SAP, Coupa, Basware, Pagero, or
              Tipalti by segment. Realized pricing is also opaque across most enterprise platforms, so headline package
              breadth cannot be converted into reliable TCO or payback comparisons. The same problem applies to network
              overlap: public sources brag about connected suppliers and business partners, but do not show how many
              suppliers are truly active, exclusive, or easily portable between competing compliance networks. These
              gaps matter because the most plausible competitive downside for Tradeshift is not sudden product
              obsolescence; it is slower conversion in accounts where procurement suites, ERP vendors, or
              better-capitalized compliance specialists can meet enough of the buyer’s needs. The diligence burden
              should therefore shift from feature lists to proof of distribution power: actual win rates by ERP
              environment, supplier activation depth, and how often embedded-finance features create a reason to choose
              Tradeshift over broader or better-capitalized rivals.
