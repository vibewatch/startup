      - number: '8.4'
        title: >-
          Exit Readiness, Thesis-Breaks, and Final Diligence: The Missing Proof Is Specific, and the Exit Path Looks
          More Strategic Than Public
        blocks:
          - type: paragraph
            body: >-
              The public record supports continued diligence, not a leap of faith. Windsor Drake’s 2026 exit guidance is
              instructive: IPO windows in this category demand about $200M+ ARR, profitability, and 25%+ growth, while
              most exits happen through strategic M&A. Tradeshift’s customer reach, supplier network, and regulatory
              positioning make it plausibly attractive to a strategic acquirer or structured private buyer. But the same
              record does not show the audited economics that public investors or IPO buyers would demand. The best
              interpretation is that Tradeshift may be a good company whose current public valuation support has lagged
              its disclosure quality.


              That makes the diligence agenda straightforward. Investors need current ARR by product, revenue mix
              between software and finance-related streams, gross margin by stream, retention metrics, customer
              concentration, and the cap-table waterfall. They also need to understand what remains after SemFi: whether
              finance-product exposure is now simpler or whether risk has merely moved off-balance-sheet into partner
              arrangements and legal complexity. The thesis breaks if those asks reveal ordinary retention, weak
              margins, renewed covenant stress, or a valuation structure where common equity is far less valuable than
              enterprise-value headlines imply.
