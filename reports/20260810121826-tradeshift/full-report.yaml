      - number: '3.3'
        title: Pricing and packaging favor mid-market challengers while enterprise suites stay opaque
        blocks:
          - type: paragraph
            body: >-
              On public pricing, the market splits cleanly between transparent upstarts and opaque enterprise vendors.
              Tipalti openly advertises AP plans starting at $99 per month plus transaction pricing and implementation
              caveats, while BILL’s 2026 comparison post lists its own pricing at $49 per user per month and positions
              the product for startups to mid-market companies. By contrast, Tradeshift, SAP, Coupa, Basware, Pagero,
              Tungsten, Oracle, and GEP do not publish equivalent enterprise list pricing on the core sources reviewed
              here, forcing buyers to infer TCO from implementation scope, modules, and transaction complexity instead
              of simple sticker price. That opacity does not necessarily favor Tradeshift. It makes the real buying
              contest less about subscription line items and more about supplier onboarding effort, integration work,
              compliance maintenance, services burden, and how many finance or procurement problems the platform can
              solve once installed. Public pricing transparency therefore becomes a strategic signal: Tipalti and BILL
              are optimized to land faster in less complex organizations, whereas Tradeshift and most of its largest
              enterprise rivals are still sold through tailored, solution-led motions. If budget pressure pushes buyers
              down-market or toward faster proof-of-value, that can compress Tradeshift’s room to win outside the
              largest compliance-heavy accounts.
