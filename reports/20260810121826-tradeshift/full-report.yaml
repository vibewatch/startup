      - number: '1.5'
        title: Milestones, adverse events and current read-through
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern is one of repeated reinvention around the same core thesis: digitize trade documents
              first, then monetize the network with broader workflow and financial services. The company’s roots in
              EasyTrade and PEPPOL governance gave it early compliance credibility; the 2012 move to San Francisco
              widened commercial ambition; the mid-2010s acquisitions and Series D/E capital financed expansion into
              procurement, supplier engagement, AI, and B2B integration; and the 2023 HSBC venture signaled a renewed
              push into embedded finance. The main break in that story is adverse rather than strategic. Bloomberg-cited
              reporting says the board fired founder-CEO Christian Lanng in September 2023 after serious allegations of
              sexual assault, harassment, and gross misconduct, then installed CRO James Stirk as interim CEO before
              later appointing Mike Cowles. That episode increases key-person and governance risk, but it also explains
              why current official materials emphasize execution discipline, compliance mandates, and customer delivery
              instead of the earlier founder-centric narrative.
