  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is broad and execution-sensitive
        blocks:
          - type: paragraph
            body: >-
              Tradeshift’s regulatory and legal risk profile is driven less by one visible enforcement action than by
              the sheer number of rules its product has to operationalize. France’s e-invoicing reform is a good
              example: official sources say all VAT-liable companies in France must be able to receive e-invoices by 1
              September 2026, large and mid-sized companies must also issue them by then, and approved platforms plus
              structured formats become mandatory. Air France-KLM’s supplier portal shows Tradeshift is already being
              used as an AP-certified platform in that context, which turns compliance into both a commercial wedge and
              an execution trap. If Tradeshift misses mandate requirements, customer trust and deployment momentum could
              deteriorate at exactly the point it is selling urgency.


              The legal stack around privacy and contracting is also non-trivial. Tradeshift splits website privacy from
              platform privacy, references a separately executed DPA, participates in data-transfer frameworks, and
              publishes layered terms, agreements, and operational-policy references. That is positive in the sense that
              the company appears policy-mature, but it also means customer deals can carry meaningful review burden
              across data-processing roles, cross-border transfers, and partner terms. The visible Doe v. Tradeshift
              litigation adds a separate governance and distraction vector because the docket still showed activity in
              July 2026 and involved founders, investors, and corporate entities rather than a simple edge-case user
              dispute.
            claimRefs:
              - CR001
              - CR002
