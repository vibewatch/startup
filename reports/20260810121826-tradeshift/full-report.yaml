  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product suite is a networked workflow stack, not a single AP widget
        blocks:
          - type: paragraph
            body: >-
              Tradeshift’s current product surface is best understood as a workflow stack that starts with invoice
              digitization and expands outward into supplier collaboration, compliance, analytics, procurement cards,
              and finance. The homepage and about pages position the platform around AP automation, e-invoicing,
              supplier onboarding, auditability, and real-time insight, while the customer-stories hub makes the
              operational use case concrete: buyers use Tradeshift to receive invoices through multiple channels,
              onboard suppliers, surface document status to both parties, and reduce invoice-processing friction inside
              shared-service environments. Tradeshift Go adds a separate decentralized-procurement motion through
              pre-approved virtual credit cards, showing that the company is not limited to document intake. The product
              map therefore spans buyer workflows, supplier participation, and payment or working-capital adjacencies in
              one environment.


              The most important practical consequence is that the platform only works at full value when both sides of
              the transaction are active. Tradeshift’s supplier network matters because suppliers can submit documents,
              monitor status, and collaborate through the same environment buyers use to validate, approve, and route
              invoices. That is why supplier onboarding shows up so prominently in customer examples and why
              Forrester-style recognition emphasizes the supplier portal rather than only the AP engine. Public proof
              points do not give a complete SKU ledger, but they are enough to say that Tradeshift sells a networked
              invoice-to-pay operating model: document intake, matching, workflow, compliance, supplier collaboration,
              analytics, and finance options are designed to reinforce one another rather than exist as isolated
              add-ons.
