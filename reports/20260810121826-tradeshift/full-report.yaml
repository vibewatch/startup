  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is enterprise-buyer-led, but supplier usage is core to the value loop
        blocks:
          - type: paragraph
            body: >-
              The most important thing to understand about Tradeshift’s customers is that the platform is sold to
              enterprise buyers but only becomes valuable when suppliers participate. The homepage, about page, and
              customer-stories hub consistently frame the product as a buyer-supplier network spanning AP automation,
              e-invoicing, onboarding, and status visibility. That framing is not just marketing language. Air
              France-KLM and Unilever both operate supplier-facing Tradeshift surfaces where suppliers are invited,
              onboarded, submit invoices, and check payment or document status. Those customer-owned workflows make the
              supplier user visible in the public record and show that Tradeshift is embedded in real operating
              processes rather than hidden inside a buyer-only back office.


              This also clarifies the company’s ideal customer profile. The proof points cluster around multinational
              enterprises with complicated procure-to-pay estates, cross-border compliance needs, and large supplier
              populations. Air France-KLM highlights France mandate readiness and invoice traceability. Unilever exposes
              country-specific invoice rules and portal-based support at scale. The customer set visible in case studies
              and market-data pages covers transport, logistics, manufacturing, consumer goods, and real estate. In
              other words, Tradeshift appears best aligned to organizations where invoice automation cannot be separated
              from supplier enablement, geography-specific rules, and operational transparency across many entities or
              branches.
