  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent categories
        blocks:
          - type: paragraph
            body: >-
              Tradeshift does not fit a single neat software box, so the market has to be bounded before it is sized.
              The company’s own current positioning starts with e-invoicing software, global compliance, and AP
              automation, then extends into supplier-network collaboration, virtual-card procurement, and embedded
              finance with HSBC. That means the relevant market is not generic “fintech” or even all B2B payments. The
              core buying problem is the digitization of invoice-to-pay workflows for multinational buyers that must
              exchange structured invoices, comply with tax regimes, and move working capital faster across supplier
              networks. The closest status-quo substitutes are still PDF/email invoicing, manual ERP entry, portals run
              country by country, and bank-led finance products disconnected from AP workflows. Official French tax
              guidance makes that substitution risk explicit: emailed PDFs and scanned paper no longer satisfy the
              coming French regime, which shifts buyers from optional workflow modernization into mandatory platform
              selection. ViDA does the same at the EU level by turning e-invoicing and digital reporting into a
              multi-year regulatory convergence project. As a result, Tradeshift’s true market boundary is the software
              and network layer that sits between ERP, suppliers, tax authorities, and payment rails—not the full value
              of B2B trade itself.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM001
