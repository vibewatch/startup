      - number: '6.2'
        title: Named customer proof is real and often strongly operational
        blocks:
          - type: paragraph
            body: >-
              The strongest part of the customer chapter is that several public references disclose more than brand
              logos. DHL’s case is unusually detailed: it describes why the company replaced a previous provider, how
              many suppliers were onboarded, what share activated, how many invoices were flowing monthly, and how far
              rollout had spread by branches and countries. Kuehne + Nagel goes further in a different direction by
              showing that Tradeshift was not limited to invoice exchange; the company layered supply chain finance on
              top of an existing e-invoicing relationship and publicly disclosed a country and supplier count for the
              program. Schaeffler’s China case adds another high-quality proof point because it combines geographic
              scope, document volume, and a concrete workflow-quality outcome.


              Together these examples matter more than a long logo wall. They show that Tradeshift can survive the
              implementation hurdle, onboard suppliers, and keep flowing through regulated or multi-country invoice
              processes. They also suggest that the company’s best public references come from customers with large,
              distributed finance operations rather than lightweight SMB use cases. Even the looser market-data
              directories reinforce that pattern: the listed implementations skew toward very large enterprises with
              meaningful ERP and AP complexity. The caveat is freshness. Some of the best metric-heavy case studies are
              not dated to 2026, so they prove capability and historical traction better than they prove current
              same-account spend or renewal behavior.
