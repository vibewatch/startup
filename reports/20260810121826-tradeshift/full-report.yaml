      - number: '5.2'
        title: Architecture centers on document intelligence, rules, and extensible integration
        blocks:
          - type: paragraph
            body: >-
              The clearest architectural pattern in public sources is a layered document workflow. Unstructured invoice
              files come in through PDF, image, scan, email, or other capture channels; AI Document Intelligence then
              combines AWS Textract OCR with large language models to interpret document context, infer fields, and
              structure data without fixed templates; Ada 2.0 handles coding, enrichment, supplier matching, and routing
              decisions using a decision-tree engine trained on each company’s historical data; and Matching 2.0 exposes
              configurable business rules through UI and JSON-based controls so non-developers can manage core logic
              without hiding it inside API-only settings. Release notes show this is not marketing abstraction:
              Tradeshift keeps shipping concrete controls such as document-based rules, validation guardrails,
              first-invoice fingerprinting, and jurisdiction-specific clearance fields.


              Around that workflow core sits an explicit integration and developer layer. Tradeshift’s API article says
              the platform exposes full functionality through a REST API using HTTPS, OAuth, and idempotent delivery.
              Developer Center guides show a real app platform with sandbox onboarding, app registration, client IDs and
              secrets, permissions, webhooks, and an API lifecycle policy. In other words, Tradeshift is not merely
              configurable by services teams; it is designed to be extended by partner or customer developers. That
              extensibility matters because Tradeshift’s value depends on fitting heterogeneous ERP estates,
              country-specific compliance logic, and buyer-specific approval or reporting workflows. The public
              materials do not reveal the entire internal system design, but they do reveal a coherent operating model:
              standards-based data exchange, AI-assisted extraction, configurable business rules, and app/API
              extensibility.
