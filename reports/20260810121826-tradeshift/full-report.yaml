      - number: '2.3'
        title: Buyer-user-payer map favors large-enterprise finance programs
        blocks:
          - type: paragraph
            body: >-
              The buyer map is more complex than a normal finance SaaS sale because Tradeshift’s value spans compliance,
              workflow, and capital. In most deployments the economic buyer starts with the CFO or
              finance-transformation leader, because invoice digitization, auditability, and payment-cycle improvement
              sit within finance KPIs. The primary daily users are AP shared-service teams, tax/compliance staff, and
              integration teams responsible for getting structured invoice data into ERP and approval workflows.
              Procurement enters when supplier onboarding, decentralized spend, or virtual-card programs are part of the
              rollout, while treasury becomes a meaningful payer or co-sponsor when early-payment discounts or
              supply-chain-finance programs matter. Supplier onboarding is the hidden denominator behind the model: a
              buyer can sign a platform contract, but value only compounds when long-tail suppliers can receive, submit,
              and reconcile invoices through the same network. Tradeshift’s Air France-KLM and Unilever supplier portals
              show that this is operationally intensive and customer-specific, not a purely self-serve motion. That
              complexity is one reason the strongest fit remains multinational enterprises or large regional buyers with
              enough invoice volume, mandate exposure, and working-capital incentive to justify cross-functional rollout
              costs.
            claimRefs:
              - CM019
              - CM020
              - CM021
