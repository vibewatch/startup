      - number: '4.2'
        title: Traction proxies suggest scale, but public metrics do not normalize cleanly
        blocks:
          - type: paragraph
            body: >-
              The topline traction story is directionally positive, but it is not numerically tidy. The strongest
              explicit revenue estimate in the retained set comes from GetLatka, which lists Tradeshift at $161.5
              million of 2024 revenue versus $119.2 million in 2023, implying roughly 35.5% year-over-year growth if the
              estimate is directionally right. That is meaningful scale for a still-private workflow platform, and it is
              directionally consistent with the company’s continued investment in product and compliance breadth.
              Official sources also provide substantial activity signals: HSBC and Houlihan Lokey describe Tradeshift as
              supporting more than $260 billion of annual GMV for around one million business users, while Tradeshift’s
              France webinar recap claims 42 million monthly documents across 200 countries and 150,000-plus businesses.


              The problem is that these public numbers do not reconcile into one dependable operating KPI set. The
              homepage instead advertises 10 million invoice documents monthly and 70 compliance countries, while
              TechCrunch’s 2021 financing story references cumulative network transaction value surpassing $1 trillion
              and Go charge volume of more than $2.5 billion in 2021. Those metrics are not necessarily
              contradictory—some are cumulative, some annual, some monthly, and some refer to users while others refer
              to businesses—but they are not normalized enough for clean financial modeling. Customer evidence does help
              by proving deployed value: Tradeshift cites supplier onboarding in the thousands, 22-day processing-time
              reductions, material increases in on-time payment, higher automation rates, and more than $1.6 billion of
              funding in one supply-chain-finance program. Those are strong demand signals. They still do not reveal
              realized ARPU, contribution margin, or whether product expansion is translating into software-like
              incremental economics.
