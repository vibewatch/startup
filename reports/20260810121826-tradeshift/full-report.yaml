      - number: '1.2'
        title: Leadership, governance and founder transition
        blocks:
          - type: paragraph
            body: >-
              Leadership is the most material change in the current company-overview story. Christian Lanng, one of the
              three founders, was still signing 2023 funding and partnership statements as CEO and co-founder. But the
              company’s 2026 about page no longer lists him in the operating team. Instead, Tradeshift now presents Mike
              Cowles as chief executive, with Marcus Carr as CFO, Ron Lugo as COO, and Raphael Bres as chief product and
              technology officer. The transition matters because Tradeshift’s public messaging has shifted from
              founder-led evangelism about trade networks toward an operating narrative centered on compliance
              execution, delivery, and monetizing the HSBC-linked embedded-finance opportunity. Governance disclosure
              remains imperfect, however. Public materials identify HSBC joining the board as part of the 2023 round and
              preserve historical investor-board context, but they do not provide a clean, current, full board roster or
              ownership map. That limits diligence on control dynamics, especially after the 2023 founder misconduct
              crisis and executive reset.
