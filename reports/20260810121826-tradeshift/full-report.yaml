companyProfile:
  summary: >-
    Tradeshift is a Copenhagen-founded, San Francisco-headquartered supply chain payments and e-invoicing platform that
    built a two-sided buyer-supplier network around AP automation, invoicing compliance, and embedded-finance
    orchestration. Public evidence supports a broad multinational footprint, current operations across more than 190
    countries, and historical company claims of roughly 1.5 million companies and about $500 billion of annual
    transaction value on the network. The business has raised large amounts of late-stage capital, but the main
    underwriting question in 2026 is valuation quality: public trackers keep pointing to a $2.7 billion mark while
    disclosure on current ARR, margins, retention, and cap table remains limited.
