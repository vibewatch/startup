      - number: '1.4'
        title: Scale, customer proof and current positioning
        blocks:
          - type: paragraph
            body: >-
              On operating scale, Tradeshift’s public evidence is directionally strong but numerically inconsistent. The
              2026 home page emphasizes 10 million invoice documents processed monthly, 70 countries covered for
              compliance, 3 million hours of manual work saved for customers last year, and invoice transaction costs
              reduced by 90%. A 2025 France-mandate article offers a different scale lens: 42 million documents
              exchanged monthly across 200 countries by 150,000-plus businesses. 2023 partner and transaction
              announcements describe approximately 1 million business users and more than $260 billion in annual GMV on
              the platform, while an older corporate profile advertised 1.5 million companies and about $500 billion in
              yearly transacted value. These metrics are not necessarily mutually exclusive—some may refer to users,
              some to businesses, some to document flow, and some to historical marketing benchmarks—but they are not
              reconciled in a single current disclosure set. What is consistent is the enterprise footprint:
              customer-story and supplier-portal evidence confirms deployments with Air France-KLM, Unilever, DHL, and
              other large organizations, plus a product stack spanning AP automation, e-invoicing compliance, virtual
              cards, marketplaces, and embedded finance.
