      - number: '5.2'
        title: 架构围绕文档智能、规则和可扩展集成
        blocks:
          - type: paragraph
            body: >-
              公开来源里最清楚的架构模式，是分层文档工作流。非结构化发票文件通过 PDF、图片、扫描件、email 或其他捕获渠道进入；AI Document Intelligence 结合 AWS Textract OCR
              和大语言模型理解文档上下文、推断字段，并在没有固定模板的情况下结构化数据；Ada 2.0 用基于每家公司历史数据训练的决策树引擎处理编码、补全、供应商匹配和路由决策；Matching 2.0 通过 UI 和基于
              JSON 的控制开放可配置业务规则，让非开发人员管理核心逻辑，而不是把它藏在 API-only 设置里。发布说明显示，这不是营销抽象：Tradeshift
              持续交付具体控制项，例如基于文档的规则、验证护栏、首张发票指纹和特定司法辖区清关字段。


              这个工作流核心外围，是明确的集成和开发者层。Tradeshift 的 API 文章称，平台通过使用 HTTPS、OAuth 和幂等交付的 REST API 开放完整功能。Developer Center
              指南显示，它拥有真实应用平台，包括沙盒上线、应用注册、client ID 和 secret、权限、webhook 以及 API 生命周期政策。换句话说，Tradeshift
              不只是能由服务团队配置；它设计上也允许伙伴或客户开发者扩展。可扩展性重要，因为 Tradeshift 的价值取决于能否适配异构 ERP
              资产、国家特定合规逻辑，以及买方特定的审批或报告工作流。公开材料没有揭示完整内部系统设计，但揭示了一个连贯的运营模型：基于标准的数据交换、AI 辅助提取、可配置业务规则，以及 app / API 可扩展性。
