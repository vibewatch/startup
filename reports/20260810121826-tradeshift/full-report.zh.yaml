    rows:
      - - Tradeshift
        - 未公开披露
        - 企业询价制
        - AP 自动化、合规、供应商网络、金融相邻能力
        - 标价、交易费和服务费未知
        - 没有实际报价和实施范围，很难做基准对比
      - - SAP
        - 未公开披露
        - 企业询价制
        - 支出套件 + 商业网络
        - 实际捆绑方式和对 SAP 的依赖不清楚
        - 竞争更多靠平台广度，而不是标价
      - - Coupa
        - 未公开披露
        - 企业询价制
        - 从寻源到合同、从采购到订单、从发票到付款、支付、资金管理
        - 模块和企业折扣不透明
        - 大型套件买方可能用价格换整合
      - - Basware
        - 未公开披露
        - 企业询价制
        - AP 自动化和全球合规
        - 服务和网络经济性未披露
        - 专业厂商价值主张很可能绑在合规复杂度上
      - - Tipalti
        - $99/月 AP 起步方案 + 交易定价
        - 模块化 SaaS，另加交易和服务附加项
        - 供应商门户、AP 自动化、税务 / 合规、全球支付
        - 复杂环境可能需要额外专业服务
        - 落地摩擦低于 Tradeshift
      - - BILL
        - 其 2026 年对比指南标注 $49/用户/月
        - 按用户 + 套餐打包
        - 发票自动化、PO 匹配、欺诈检测、支付
        - 官方对比博客有自身利益，可能不能反映企业打包
        - SMB / 中端市场替代性强，与企业市场直接重叠较弱
      - - Pagero / Tungsten / Oracle / GEP
        - 未公开披露
        - 方案驱动型企业合同
        - 从合规网络到 ERP 或采购套件不等
        - 实施范围很可能比订阅项目更主导总价
        - TCO 对比要看真实供应商报价，不能只看公开网页
