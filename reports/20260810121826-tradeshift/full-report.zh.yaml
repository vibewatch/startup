  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资锚点
      - 目标细分市场
      - 差异化
      - 相对 Tradeshift 的短板
    rows:
      - - SAP Ariba / SAP Business Network 竞品网络
        - 既有套件 + 网络
        - 全球 SAP 平台；商业网络和支出套件一起销售
        - 大型全球企业
        - ERP 邻近、采购广度、买方-供应商网络、合规
        - 对非 SAP 环境可能偏重，也更以 SAP 为中心
      - - Coupa
        - 企业支出管理套件
        - 2023 年以 $8B 私有化；宣称有 10M+ 买方 / 卖方和 $9T 平台交易额
        - 大型企业和高端中端市场
        - 覆盖支出、AP、支付、资金管理、供应链和 AI 平台
        - 跨境发票合规定位不如专业厂商明确
      - - Basware
        - 合规 / AP 专业厂商
        - 6,500+ 客户、20M 已连接买方 / 供应商，服务 190+ 国家
        - 共享服务和跨国企业
        - 发票生命周期管理、无接触 AP、较深合规能力
        - 嵌入式金融叙事不如 Tradeshift / Coupa 明显
      - - Tipalti
        - 支付驱动的财务运营挑战者
        - 2021 年融资估值 $8.3B；从中端市场起家
        - 中端市场到企业，尤其是全球付款
        - 定价透明，覆盖支付、税务、供应商入驻和模块化扩展
        - 买方-供应商商业网络身份弱于 Tradeshift
      - - Pagero / Thomson Reuters
        - 合规网络专业厂商
        - 以约 $800M 被收购；据 TR 称，网络覆盖 14M 公司和 90k 客户
        - 跨国企业和合规负担重的企业
        - 开放网络、电子发票、税务、监管机构连接，母公司信任度强
        - 采购 / 支出套件广度不如 Coupa 或 SAP
      - - Tungsten Automation
        - 网络 + AP 专业厂商
        - 发票网络和 AP/AR 自动化产品组合
        - 供应商基础复杂的大型企业
        - 高触达供应商入驻、发票数字化、合规
        - 更广的平台品牌不太围绕采购转型
      - - Oracle
        - ERP 驱动的既有厂商
        - 全球 Fusion ERP 平台
        - Oracle 财务体系客户和受监管企业
        - ERP 捆绑、AI 自动化、优先电子发票、财务系统控制
        - 开放网络差异化不如 Tradeshift 或 Pagero 明显
      - - GEP
        - AI 原生采购套件
        - 企业采购平台，用智能体编排结果
        - Global 2000 采购组织
        - 从寻源到付款覆盖面强，采购转型故事完整
        - 公开网络规模证据少于 SAP、Coupa、Basware 或 Pagero
