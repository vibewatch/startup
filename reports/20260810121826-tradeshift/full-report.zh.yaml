      - number: '7.4'
        title: 执行质量是主风险，因为它会贯穿整个系统
        blocks:
          - type: paragraph
            body: >-
              执行风险压在所有类别之上，因为 Tradeshift 的投资逻辑要求公司同时协调合规、供应商上线和客户交付。Mike Cowles 的 CEO
              公告本身，就把当下语境放在数十项政府电子发票强制要求、客户创新、交付卓越和增长上。这是有用的管理层信号：公司似乎知道交付纪律居中。但它也是警示，说明 Tradeshift
              进入了一个产品、合规和商业化执行都必须在相对新的领导班子下协同跑通的阶段。


              最强的客户和分析师引用都说，供应商网络和供应商门户才是差异点。也就是说，最大的执行失败不一定是安全漏洞或诉讼；也可能是支持摩擦、强制要求滑坡、供应商激活问题，削弱 Tradeshift 正在出售的护城河。Air
              France-KLM 和 Unilever 的供应商流程显示实施可以细到什么程度；评论网站则显示 UI
              和支持问题仍在一线出现。公开缓释措施真实存在，但剩余敞口仍为中高，因为三个核心问题披露不足：收入基盘有多集中、客户续约多耐久、SemFi 之后的经济性和风险归属如何在规模化时运作。
