      - number: '6.2'
        title: 具名客户证据真实，且往往运营性很强
        blocks:
          - type: paragraph
            body: >-
              客户章节最有力的一点，是几条公开客户案例不止给出品牌标识。DHL 案例尤其细：它交代了公司为何替换上一家供应商、上线了多少供应商、激活比例、每月流转多少张发票，以及部署已经覆盖多少分支和国家。Kuehne +
              Nagel 则从另一个角度把证据往前推：Tradeshift 不只做发票交换，公司在既有电子发票关系上叠加供应链金融，并公开了该项目覆盖的国家和供应商数量。Schaeffler
              中国案例又补上一条高质量证据，因为它同时给出地理范围、单据量和具体的流程质量结果。


              放在一起看，这些案例比一长串标识墙更有价值。它们证明 Tradeshift
              能跨过实施门槛、拉供应商上线，并在受监管或跨国发票流程里持续运转。它们也说明，公司公开背书质量最高的客户，多是财务运营庞大且分散的企业，而不是轻量 SMB
              场景。即便证据较松的市场数据目录，也强化了这种模式：列出的实施案例明显偏向超大型企业，ERP 和 AP 复杂度都不低。需要扣分的是新鲜度。一些指标最重的最佳案例研究并未标到 2026
              年，因此更能证明能力和历史商业牵引力，而不是当前同一账户支出或续约行为。
