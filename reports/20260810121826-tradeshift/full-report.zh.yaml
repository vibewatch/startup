      - number: '8.2'
        title: 可比估值锚点：2026 年 AP、CFO 与电子发票基准支持优质资产， 但不支持自动沿用独角兽估值
        blocks:
          - type: paragraph
            body: >-
              可比公司图像比 Tradeshift 自身披露更清楚。Windsor Drake 的 2026 年 Q1 AP / 资金管理 / AR 框架直接相关，因为它把纯经常性 SaaS、混合 AP
              和更偏交易的模式区分开。对 Tradeshift 来说这很关键；公司材料和金融条款显示，它是软件、供应商网络服务和嵌入式金融活动的混合体。Windsor 的分层显示，纯经常性资产可在 6x-10x 交易，混合
              AP 为 3.1x-4.0x，交易型模式为 2.3x-3.5x；当浮存金或资金收入变得重要时，类金融收入还会被进一步折价。


              近期战略交易强化了上限。Coupa 私有化和 Pagero 出售都落在高个位数收入倍数附近，而不是十几倍中段或以上。Multiples.vc 显示，2026 年公开软件可比公司倍数区间可以拉得很宽，但市场奖励的是
              AI 相关性、专业化和盈利能力的组合，而不只是大 TAM 故事。Tradeshift
              的网络和合规足迹意味着它应高于最弱的交易型公司；但除非尽调证明优质留存、利润率和资本纪律，公开证据并不支持把它显著抬到已观察到的最佳采购和电子发票交易锚点之上。
