  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 计量单位
      - 当前公开状态
      - 收入质量判断
      - 尽调需确认
    rows:
      - - AP 自动化 + 电子发票核心
        - 面向发票采集、匹配、流转和合规工作流的企业订阅
        - 合同 / 模块订阅
        - 官方网站明确营销，但未公开分部收入
        - 可能是最干净的经常性软件层
        - 按核心平台模块拆分收入结构、ARR、续费率和毛利率
      - - 合规与清算基础设施
        - 各国电子发票、清算以及 PDP/Peppol 连接
        - 国家 / 买方项目 / 交易项目
        - 官方将其定位为覆盖 60+ / 70 个国家的主要差异化领域
        - 如果属于关键任务，切换价值高，但合规支持成本可能不低
        - 按国家包的定价、实施负担和更新维护成本
      - - 供应商网络服务
        - 供应商入驻、状态可视化、消息和跨买方项目的文档交换
        - 买方项目 + 供应商活动
        - 客户案例和门户证明入驻运营仍在活跃运转
        - 支撑粘性，但可能混合了软件与服务经济性
        - 供应商激活成本、支持负担和高级服务附加率
      - - Tradeshift Go
        - 用于分散式 B2B 采购的预批准虚拟卡
        - 卡 / 交易 / 项目
        - 官方在营销，但未公开抽成率或定价
        - 可在 SaaS 之外增加交易经济性，但单位利润率不透明
        - 抽成率、交换费 / 发卡方经济性，以及每个已部署买方的平均支出
      - - 嵌入式金融 / SemFi / SCF
        - 嵌入网络工作流的融资和营运资金产品
        - 融资规模 / 费用 / 合作伙伴收入分成
        - 官方合作存在，客户证据也显示金融工具有效，但 SemFi 后来出现亏损
        - 具备战略价值，但很可能是资本和合作伙伴依赖度最高的收入流
        - 收入分成条款、信用风险归属，以及各金融产品盈利能力
    notes: 公开材料能看清变现方向，但没有一个方向拆出收入贡献或利润率。
