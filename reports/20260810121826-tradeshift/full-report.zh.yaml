        - 已确认泄露、重大隐私投诉，或与数据传输 / 处理方有关的监管行动
        - 暂停投资测算，直到影响范围、补救和责任清晰
      - - 金融伙伴依赖
        - 伙伴或计划不稳定
        - 失去关键银行伙伴、金融产品暂停，或围绕伙伴责任出现重大法律纠纷
        - 从估值中剔除嵌入式金融上行，并重新评估下行
      - - 客户传导风险
        - 重大参考客户失败或收缩
        - 失去旗舰跨国部署、公开监管任务失败，或出现大型客户流失证据
        - 假设护城河变弱、扩张放慢、销售效率下降
  - id: TV001
    title: 建议摘要表
    notes: 这个决策对价格敏感，不是没有投资逻辑：Tradeshift 确有战略质量，但现有证据难以支撑公开估值标记。
    claimRefs:
      - CV007
      - CV008
      - CV018
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV042
    columns:
      - 维度
      - 评估
      - 证据锚点
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 资产质量真实，但价格支撑陈旧，关键分母缺失
        - 继续尽调，但今天不要为溢价入场背书
      - - 置信度
        - 中
        - 跟踪器分歧很大，缺少公司层面经审计指标
        - 使用宽区间，并保持高举证门槛
      - - 风险评级
        - 中高
        - SemFi 悬而未决、伙伴依赖、诉讼和合规执行都可能压缩倍数
        - 即使业务仍具战略性，也要把下行当真
      - - 估值立场
        - ~$2.7B 估值偏贵
        - 隐含 16.7x-33.8x，对比高个位数交易锚点
        - 要求更低价格或实质更好的披露
      - - 公开证据基准 EV
        - ~$1.0B-$1.4B
        - 约 $160M-$180M ARR / 收入区间上取 6x-8x
        - 作为当前投资测算的重心
      - - 可能退出路径
        - 战略 M&A 或结构化二级 recap
        - 2026 年退出市场更偏向 M&A，公开记录也看不出 IPO 准备度
        - 不假设公开市场流动性溢价
  - id: TV002
    title: 投资逻辑 / 反投资逻辑表
    notes: 资产质量论和定价过高论可以同时成立；核心争论是投资人要把价格纪律和披露纪律卡到多严。
