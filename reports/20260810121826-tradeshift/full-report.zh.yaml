  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律：Tradeshift 有战略价值，但 $2.7B 参考估值 已定价太多成功
        blocks:
          - type: paragraph
            body: >-
              Tradeshift
              有足够实质，不能简单得出“私募估值包袱，所以回避”的结论。公司有真实客户验证、可见的跨国供应商工作流、大型供应商网络叙事；当电子发票强制要求在欧洲及其他地区扩散，它也有可信的市场存在理由。留存资料还显示，它不只是功能包：Forrester
              的表述强调发票生命周期编排、通过门户和电子邮件做供应商协作，以及网络规模的供应商上线。这些特质重要，因为它们让 Tradeshift 难以和薄型发票捕获点解决方案直接相比。换句话说，Tradeshift
              相比普通交易型 AP 软件，大概率应享有溢价。


              问题在入场价格。独立跟踪方仍指向 $2.7B 估值，但支撑这一标记的公开资料已经陈旧且不一致。CB Insights 将 $2.7B 归于 2021 年 3 月；TechCrunch 和 HSBC 确认了后续
              2023 年融资，却没有显示更高的公开估值。收入锚点散落在约 $79.9M、$144.6M 和 $161.5M，隐含倍数约为 16.7x 到
              33.8x。没有新披露时，这个价格太贵，不能当作当前公允价值。正确动作因此是跟踪：继续跟踪资产，但在支持更强建议前，要求价格纪律或明显更好的证据。
