      - number: '4.2'
        title: 牵引力代理指标显示规模，但公开指标难以统一归一
        blocks:
          - type: paragraph
            body: >-
              顶线牵引故事方向上积极，但数字并不整齐。保留材料里最强的显性收入估计来自 GetLatka，它列出 Tradeshift 2024 年收入 $161.5 million，2023 年为 $119.2
              million；如果估计方向正确，意味着同比增长约 35.5%。对于一家仍未上市的工作流平台，这是有意义的规模，也与公司继续投入产品和合规广度的方向一致。官方来源也提供了大量活动信号：HSBC 和
              Houlihan Lokey 称 Tradeshift 支持约 100 万商业用户、年 GMV 超过 $260 billion；Tradeshift 法国 webinar 回顾则声称在 200
              个国家、150,000 多家企业中每月处理 4200 万份文件。


              问题是，这些公开数字无法拼成一套可靠的运营 KPI。首页宣传的是每月 1000 万份发票文件和 70 个合规国家；TechCrunch 2021 年融资报道则提到累计网络交易额超过 $1
              trillion，2021 年 Go 收费量超过 $2.5
              billion。这些指标不一定矛盾——有些是累计，有些是年度，有些是月度；有些指用户，另一些指企业——但归一程度不足，不能直接做干净财务模型。客户证据确实通过证明部署价值提供帮助：Tradeshift
              提到数千家供应商上线、处理时间缩短 22 天、按时付款显著增加、自动化率提高，以及一个供应链金融项目中超过 $1.6 billion 的资金支持。这些都是强需求信号。但它们仍没有揭示实际
              ARPU、贡献利润率，或产品扩展是否正在转化成类似软件的增量经济性。
