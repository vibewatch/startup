      - number: '2.3'
        title: 买方、用户、付款方地图偏向大型企业财务项目
        blocks:
          - type: paragraph
            body: >-
              买方地图比普通财务 SaaS 销售更复杂，因为 Tradeshift 的价值横跨合规、工作流和资本。多数部署里，经济买方从 CFO 或财务转型负责人开始，因为发票数字化、可审计性和付款周期改善都落在财务 KPI
              内。日常主用户是应付账款共享服务团队、税务 / 合规人员，以及负责把结构化发票数据送入 ERP
              和审批工作流的集成团队。供应商上线、分散支出或虚拟卡项目进入部署范围时，采购会参与；提前付款折扣或供应链金融项目重要时，财资会成为有意义的付款方或共同赞助方。供应商上线是这个模型背后的隐藏分母：买方可以签平台合同，但只有长尾供应商也能在同一个网络里接收、提交和核对发票，价值才会复利。Tradeshift
              的 Air France-KLM 和 Unilever
              供应商门户显示，这件事运营强、客户定制化高，不是纯自助动作。这种复杂度也是为什么最佳契合仍是跨国企业或大型区域买方——它们有足够发票量、强制令暴露和营运资本激励，能够支撑跨职能上线成本。
