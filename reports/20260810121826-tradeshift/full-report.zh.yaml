companyProfile:
  summary: >-
    Tradeshift 创立于 Copenhagen，总部在 San
    Francisco，是一家供应链支付和电子发票平台。公司围绕应付账款自动化、发票合规和嵌入式金融编排，搭起双边买方—供应商网络。公开证据支持其拥有广泛跨国足迹，目前运营覆盖 190 多个国家；公司历史上声称网络连接约 150
    万家公司，年交易额约 $500 billion。业务已融入大量后期资本，但 2026 年最核心的承销问题是估值质量：公开跟踪平台仍指向 $2.7 billion 标记，而当前 ARR、利润率、留存和股权结构披露仍有限。
