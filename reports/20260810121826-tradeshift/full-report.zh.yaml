  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险面广，且高度依赖执行
        blocks:
          - type: paragraph
            body: >-
              Tradeshift 的监管和法律风险，不是由某一起显眼执法事件驱动，而是来自产品必须落地的规则太多。法国电子发票改革就是好例子：官方来源称，法国所有 VAT 纳税企业必须在 2026 年 9 月 1
              日前能够接收电子发票，大型和中型企业届时还必须开具电子发票，获批平台和结构化格式也将成为强制要求。Air France-KLM 供应商门户显示，在这一背景下，Tradeshift 已作为 AP
              认证平台使用；合规既变成商业切入点，也变成执行陷阱。如果 Tradeshift 未能满足强制要求，客户信任和部署动能可能在它销售紧迫性的关键时点恶化。


              隐私和合同层面的法律栈也不轻。Tradeshift 将网站隐私和平台隐私分开，引用单独签署的
              DPA，参与数据传输框架，并发布分层的条款、协议和运营政策引用。积极的一面是，公司看起来有较成熟的政策体系；但这也意味着客户交易可能在数据处理角色、跨境传输和合作伙伴条款上带来不小审查负担。可见的 Doe v.
              Tradeshift 诉讼又增加了单独的治理风险和管理层分心源，因为案卷到 2026 年 7 月仍有活动，且涉及创始人、投资者和公司实体，而不是简单的边缘用户纠纷。
