      - number: '4.4'
        title: 利润率、跑道和实际定价缺口仍挡住承销判断
        blocks:
          - type: paragraph
            body: >-
              最后一步，是把有希望的运营信号和投资人仍不知道的内容分开。Tradeshift 显然仍服务大型企业，仍在发布产品，并在 2024 年底到 2025 年初之间完成领导层更新，Mike Cowles 任
              CEO，Marcus Carr 任 CFO，Ron Lugo 任 COO。围绕盈利能力的公开话术也已多年保持一致：管理层 2023 年称公司已经走在通往盈利的路上；更早的 2021
              年融资报道则把募资放在资产负债表优化和延后 IPO 路径的背景下。但保留材料中没有已发布的集团财务报表或分部披露能证明这一叙事。


              缺失指标恰好决定 Tradeshift
              到底是强软件复利公司，还是一个仍依赖外部融资的资本密集型企业平台：毛利率、服务收入占比、按产品划分的贡献利润率、CAC、回本周期、净收入留存、流失率、合并现金余额、月度烧钱额和债务到期表。即便是累计融资额这种看似基础的公开数据，不同跟踪平台也有分歧；这就是为什么
              Latka 和 Tracxn 这类数据库适合做方向性辅助，却不能当作可靠账本。HSBC 自己的年报落地页确认存在 2025 年 Form 20-F，但该文件入口没有以能解决 Tradeshift
              承销缺口的方式披露 Tradeshift JV 经济性。因此，正确的财务判断应当平衡但谨慎：需求看起来真实，网络分发有价值，资本也一直可获得；但公开记录仍无法支撑对利润率路径或独立跑道的清晰判断。
