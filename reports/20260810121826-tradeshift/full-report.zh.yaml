      - number: '2.2'
        title: 多组测算口径显示市场很大，但不是单一市场
        blocks:
          - type: paragraph
            body: >-
              市场显然很大，但没有一个头条数字足够干净，可以单独拿来做分析。更好的办法是叠加几组相容的口径。在交易基础层，Qvalia 摘要的 Billentis 2026 估计全球至少有 6000 亿张发票，其中约 3000
              亿张是 B2B，只有约 870 亿张已经电子化。这确立了巨大的模拟到数字转换机会。在基础设施层，Research and Markets 估计全球电子发票市场 2026 年为 $29.79
              billion，2030 年增至 $60.81 billion；Grand View 估计应付账款自动化软件 2023 年为 $3.07 billion，2030 年增至 $7.1
              billion。在变现邻接层，Research and Markets 估计供应链金融 2026 年为 $14.55 billion、B2B 支付为 $1.47 trillion；Mordor 给出类似但略高的
              $1.67 trillion B2B 支付口径。Fortune 的 2026 年 $109.39 trillion B2B 支付数字只适合作为总流量代理来定方向；它不能与软件收入估计相比，也会大幅夸大
              Tradeshift 这类工作流平台可捕获为收入的部分。正确的尽调启示不是“选一个 TAM”，而是把发票量、软件 / 基础设施支出和支付流机会分开，避免估值工作把交易价值和可触达平台收入混为一谈。
