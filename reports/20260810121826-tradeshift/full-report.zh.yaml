  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、历史与产品边界
        blocks:
          - type: paragraph
            body: >-
              Tradeshift 的身份更适合理解为一家长期运营的数字贸易平台，根基在欧洲电子发票，而不是新成立的 fintech。创始人商业化 Tradeshift 之前，先参与过丹麦公共电子发票基础设施和开源
              EasyTrade 平台。公司当前 about 页面把历史简化成 2010 年创立，并绑定欧洲电子发票合规；更早的公司简介则保留了更完整的时间线：2005 年起源、2009 年公司诞生、2010
              年产品发布。公开口径上，Tradeshift 现在把自己定位为全球应付账款自动化和电子发票合规平台，同时覆盖买方—供应商协作、B2B 市场工作流和嵌入式金融。总部 2012 年从 Copenhagen 迁到
              San Francisco；2026 年材料仍把公司描述为服务大型企业的国际平台供应商，这些企业有复杂供应商网络和监管要求，而不是一个狭窄的 SMB 支出应用。
