  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件是网络化工作流栈，不是单一 AP 小工具
        blocks:
          - type: paragraph
            body: >-
              Tradeshift 当前产品表层最适合理解为一个工作流栈：从发票数字化起步，向外扩展到供应商协作、合规、分析、采购卡和金融。首页和 about
              页面围绕应付账款自动化、电子发票、供应商上线、可审计性和实时洞察来定位平台；客户案例中心则把运营用例具体化：买方用 Tradeshift
              通过多个渠道接收发票、上线供应商、向双方展示文件状态，并在共享服务环境里降低发票处理摩擦。Tradeshift Go
              通过预先批准的虚拟信用卡增加了一个去中心化采购动作，说明公司并不局限于文件接收。因此，产品地图把买方工作流、供应商参与，以及支付或营运资本邻接项放在同一个环境里。


              最重要的实际后果是，交易双方都活跃时，平台才能发挥全部价值。Tradeshift
              的供应商网络重要，因为供应商可以在买方用来验证、审批和路由发票的同一环境里提交文件、查看状态并协作。这就是为什么供应商上线在客户案例中如此突出，也解释了为什么 Forrester
              式认可强调供应商门户，而不只是应付账款引擎。公开证明点没有给出完整 SKU 账本，但足以说明 Tradeshift
              销售的是网络化的发票到付款运营模型：文件接收、匹配、工作流、合规、供应商协作、分析和金融选项彼此强化，而不是作为孤立附加项存在。
