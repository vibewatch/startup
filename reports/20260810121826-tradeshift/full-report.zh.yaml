      - 概率信号
      - 关键触发项
    rows:
      - - 空头
        - $120M-$150M
        - 3x-5x
        - $400M-$750M
        - 30%
        - 增长或利润率质量令人失望，投资人把 Tradeshift 更接近混合型 / 交易型 AP 定价
      - - 基准
        - $160M-$180M
        - 6x-8x
        - $1.0B-$1.4B
        - 50%
        - 网络和合规质量支撑真实溢价，但不足以给到品类龙头定价
      - - 多头
        - $220M-$250M
        - 12x-14x
        - $2.6B-$3.5B
        - 20%
        - 尽调证明高质量留存、强利润率，以及监管任务带来的盈利性加速
      - - 当前公开估值标记
        - ~$2.7B 参考
        - 混合
        - ~$2.7B
        - 100% 可观察
        - 名义估值已偏向多头情景区间
  - id: TV004
    title: 可比估值表
    notes: 这组样本有意混合滞后的私募估值标记、当前软件估值带和战略交易锚点，因为 Tradeshift 完全披露的私人二级交易并未公开。
    enumerationScope:
      coverage: partial
      basis: >-
        Partial comparable set covering current tracker marks, 2026 AP/CFO software banding, public-software sector
        ranges, and the most relevant strategic transaction anchors. It excludes undisclosed private secondaries,
        internal 409A work, and non-public cap-table documents.
