      - number: '1.4'
        title: 规模、客户证据与当前定位
        blocks:
          - type: paragraph
            body: >-
              运营规模上，Tradeshift 的公开证据方向上很强，但数字并不一致。2026 年首页强调每月处理 1000 万份发票文件、覆盖 70 个合规国家、去年为客户节省 300 万小时手工作业，并把发票交易成本降低
              90%。一篇 2025 年法国强制令文章给出另一组规模视角：150,000 多家企业在 200 个国家每月交换 4200 万份文件。2023 年合作伙伴和交易公告描述平台上约 100 万商业用户、年 GMV 超过
              $260 billion；更早的公司简介则宣传 150 万家公司、年交易额约 $500
              billion。这些指标不一定相互矛盾——有些可能指用户，有些指企业，有些指文件流，也有些是历史营销基准——但它们没有被归入一套当前披露。能够保持一致的是企业足迹：客户案例和供应商门户证据确认，公司已在 Air
              France-KLM、Unilever、DHL 和其他大型组织中部署，产品栈覆盖应付账款自动化、电子发票合规、虚拟卡、市场和嵌入式金融。
