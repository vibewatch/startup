      - number: '1.5'
        title: 里程碑、不利事件与当前启示
        blocks:
          - type: paragraph
            body: >-
              里程碑模式是一再围绕同一个核心论点重塑：先数字化贸易文件，再靠更广的工作流和金融服务为网络变现。EasyTrade 和 PEPPOL 治理根基给了公司早期合规可信度；2012 年迁往 San Francisco
              拉大了商业野心；2010 年代中期的收购和 Series D/E 资本支持其扩展到采购、供应商互动、AI 和 B2B 集成；2023 年 HSBC
              合资则发出了重新推进嵌入式金融的信号。这个故事的主要断裂不是战略性的，而是不利事件。Bloomberg 引述的报道称，董事会在 2023 年 9 月因严重的性侵、骚扰和重大不当行为指控解雇创始人兼 CEO
              Christian Lanng，随后任命 CRO James Stirk 为临时 CEO，之后又任命 Mike
              Cowles。该事件抬高了关键人和治理风险，但也解释了为什么当前官方材料强调执行纪律、合规强制令和客户交付，而不是更早的创始人中心叙事。
