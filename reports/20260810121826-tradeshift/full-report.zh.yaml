  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局分为套件、专精厂商和支付驱动挑战者
        blocks:
          - type: paragraph
            body: >-
              理解 Tradeshift 的竞争对手，按角色分比按单一软件品类分更清楚。第一类是既有寻源到付款套件：SAP、Coupa、Oracle 和 GEP 都销售广泛的采购和财务平台，能用寻源、合同、供应商管理、财资和
              AI 编排包围发票自动化。第二类是合规和网络专精厂商：Basware、Pagero 和 Tungsten 都强调电子发票、应付账款自动化、多 ERP 互操作、供应商上线和逐国合规深度——这往往正是
              Tradeshift 进入企业账户的楔子。第三类是支付驱动或中端市场挑战者：Tipalti 和 BILL
              以更快采用、公开入门定价、强应付账款或全球付款动作切入，并可能向上扩展到采购、财资和控制。这个框架重要，因为 Tradeshift 很少只是输给“一个 AP 工具”。它更常面对的是更广泛的 ERP /
              采购平台选择、专精合规网络，或一个更简单的模块化替代品，后者能为较小买方解决足够多发票到付款工作流。这个品类的拥挤方式会随公司规模、ERP 环境，以及主要任务是合规、支出控制、付款执行还是供应商协作而变化。
