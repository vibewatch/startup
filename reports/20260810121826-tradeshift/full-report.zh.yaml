  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释 / 推论
      - 尽调需确认
    rows:
      - - 供应商网络形成锁定
        - 供应商可以同时接入多个网络，或按买方要求使用指定门户
        - 高
        - 需要证明活跃且独占的供应商密度
        - 供应商交易量中，活跃、重复且独占的占比是多少？
      - - 合规深度让 Tradeshift 区分开
        - Basware、Pagero 和 Tungsten 都在营销强合规与多国覆盖深度
        - 高
        - 要靠执行质量和入驻效率区分，而不是泛泛的合规叙事
        - 法规强制驱动的交易中，胜负单数据如何？
      - - 采购邻近场景放大平台价值
        - SAP、Coupa、Oracle 和 GEP 已经销售更宽的套件
        - 高
        - Tradeshift 应聚焦套件服务不足的工作流
        - 面对套件整合型采购要求，Tradeshift 多常能赢？
      - - 嵌入式金融提升变现
        - Coupa、SAP、Tipalti 和司库工具也在推支付与流动性价值
        - 中
        - 需要真实附加率证据
        - 使用金融或卡产品的客户占比是多少？
      - - 实施工作抬高切换成本
        - 长实施周期也会拖慢新销售、加重服务负担
        - 中
        - 高切换成本有利于留存，但会拖慢扩张
        - 平均部署时间和服务投入强度是多少？
      - - 不透明定价保护企业客户利润率
        - 透明定价的挑战者会把买方心理价位锚得更低
        - 中
        - 方案价值必须跑赢更简单的替代品
        - 价格透明度多常会让交易流失？
      - - 独立平台的中立性有吸引力
        - 更大的所有者和套件厂商可以靠资产负债表信任赢单
        - 中
        - 品类整合后，母公司规模更重要
        - 客户把供应商耐久性作为采购标准时权重多高？
      - - AI 叙事改善定位
        - 现在所有人都在营销 AI 代理和自动化编排
        - 中
        - 需要可量化结果，而不是相似口号
        - 哪些 AI 功能实质改变胜率或 ROI？
