      - CV025
      - CV027
      - CV028
      - CV029
      - CV042
    columns:
      - 论点
      - 多头解读
      - 空头解读
      - 什么会改变看法
    rows:
      - - 供应商网络护城河
        - 1.5M+ 供应商叙事和开放网络定位，支撑真实转换成本
        - 网络规模本身不能证明收入质量或变现深度
        - cohort 扩张数据证明联网账户带来更高留存和 ARPU
      - - 合规顺风
        - 法国和 Peppol 变化可能迫使现有企业客户更深采用
        - 强制监管任务提高执行负担，也可能暴露本地化弱点
        - 胜率和部署数据证明监管能转化为盈利扩张
      - - 客户证明
        - Air France、Unilever 和 Schaeffler 显示跨国工作流已上线
        - 点名 logo 仍不披露 NRR、集中度或续约经济性
        - 续约 / cohort 数据加集中度明细
      - - 分析 / AI 上行
        - AWS 案例显示交叉销售、采用和支持杠杆可被衡量
        - AI 和分析可能只是增量，未必足以支撑巨大溢价
        - 分析层级的毛利率和 attach rate 证明
      - - 金融邻接
        - 嵌入式金融可以加深钱包份额和战略相关性
        - SemFi 退出和金融产品条款指向质量较低、复杂度更高的收入
        - SemFi 后单位经济和伙伴风险披露
  - id: TV003
    title: 多头 / 基准 / 空头情景表
    notes: 数值为百万美元口径的企业价值区间，用作公开证据下的投资测算区间，不是精确目标。概率信号是定性的。
