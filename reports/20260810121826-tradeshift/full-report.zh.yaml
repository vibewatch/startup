      - number: '6.3'
        title: 客户韧性信号偏正面，但仍多是间接证据
        blocks:
          - type: paragraph
            body: >-
              公开资料能看到客户韧性证据，但大多间接。最清楚的正面信号，是客户自有供应商门户到 2026
              年仍在线，并提供操作指南、账户设置步骤、发票状态工具和强制要求说明。这意味着仍在使用，而不是已经死掉的概念验证页面。Gartner Peer Insights
              给出一条当前外部视角：抓取页面显示评分分布大多正面，且近期一条评论称赞 Tradeshift 在高体量发票集成中的表现。FeaturedCustomers
              也显示大量客户背书和较高综合评分。这些信号方向上令人鼓舞，因为它们说明 Tradeshift 能带来足够用户满意度，继续出现在面向市场的评价和基准评测页面上。


              但这些都不等于能判断续约质量。公开资料没有披露净收入留存、毛留存、客户数流失、合同期限或客户分群扩张。评价证据也不是一边倒。Gartner 的精选评论仍点出 UI 和支持问题；存档 G2
              评论提到加载慢、文档组织笨重、浏览器兼容小毛病和支持流程薄弱。正确解读不是客户基础脆弱，而是公司出售的是关键企业工作流，支持质量和变更管理会实质影响账户韧性。公开证据因此支持中等置信度结论：Tradeshift
              显然在生产环境中使用，也似乎仍可被客户背书，但续约经济性仍不透明。
