      - number: '4.3'
        title: 2023 年资本充足性改善，但 2026 年不利数据让融资风险仍然存在
        blocks:
          - type: paragraph
            body: >-
              资本可获得性看得见；自我造血耐久性看不见。Tradeshift 2021 年融资增加了 $200 million 股权和债务 / 可转债资本，2023 年融资至少带来 $70 million，其中 $35
              million 来自 HSBC；合作方和顾问来源都明确把它描述为资产负债表强化。这些 2023 年来源还称，资金将用于扩张 SaaS、B2B 市场和 fintech
              解决方案，说明管理层和投资人仍看到值得支持的增长路径，而不是纯救援轮。表面看，这是建设性的。它说明，延迟 IPO 叙事失去动能后，投资人和伙伴仍愿意继续给平台融资。


              2026 年的不利视角改变了承销语气。GTR 对 SemFi 的报道称，HSBC 合资企业首份账目显示收入只有 $1.1 million，却录得 $21 million
              税前亏损；报道还称，在经常性亏损和负现金流历史之后，Tradeshift 英国实体通过重大重组削减了员工和成本。最重要的是，同一篇文章称 Tradeshift
              的最终母公司豁免了过往票据契约违约，并把票据到期日延至 2026 年 11 月底，即便公司声称重组已使其在 2025 年初转为正现金流。Companies House 印证了部分图景：Tradeshift
              Network Ltd 在 2026 年 4 月提交了新的集团账目，并短暂收到强制注销通知，但次日即被终止；SemFi 的英国记录显示，2025 年账目在 2026 年 6 月提交，2026 年 7 月
              Tradeshift 退出前后出现了减资和偿付能力声明文件。这些都不能证明公司即将陷入困境，但足以让融资依赖成为真实的尽调议题，而不是后期公司理论性备注。
