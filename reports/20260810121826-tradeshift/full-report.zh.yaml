        title: 最重要的未解问题是赢单 / 输单数据、定价和供应商重叠
        blocks:
          - type: paragraph
            body: >-
              公开记录在投资人最想看到硬证据的地方仍很薄。没有一个已审阅来源提供干净的赢单 / 输单数据集，说明 Tradeshift 在哪些细分里击败 SAP、Coupa、Basware、Pagero 或
              Tipalti。多数企业平台的实际定价同样不透明，因此头条包装宽度无法转成可靠的 TCO
              或回本对比。网络重叠也有同样问题：公开来源会炫耀连接供应商和商业伙伴，但不显示多少供应商真正活跃、独占，或能在相互竞争的合规网络之间轻松迁移。这些缺口重要，因为 Tradeshift
              最可能的竞争下行不是产品突然过时，而是在采购套件、ERP 供应商或资本更厚的合规专精厂商已经能满足买方足够需求的账户里，转化变慢。因此，尽调负担应从功能列表转向分发能力证明：按 ERP
              环境拆分的实际胜率、供应商激活深度，以及嵌入式金融功能有多常构成选择 Tradeshift 而非更广或资本更厚对手的理由。
