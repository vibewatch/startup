          detail: Air France-KLM、Unilever、DHL、Kuehne + Nagel 和 Schaeffler 都有线上运营证据。
        - label: 披露部署指标的账户
          value: 16
          detail: 只有一部分披露入驻、发票量、国家或供应商数量。
        - label: 披露留存经济性的账户
          value: 3
          detail: 公开来源直接给出的续约或合同耐久性数据非常有限。
    claimRefs:
      - CU002
      - CU006
      - CU008
      - CU012
      - CU016
      - CU018
      - CU027
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 比较不同客户验证载体的质量，而不是把所有引用都视为同等有信息量。
    data:
      columns:
        - 结果具体性
        - 生产成熟度
        - 证据新鲜度
        - 留存可见度
      rows:
        - label: Air France-KLM 门户
          values:
            - 中
            - 高
            - 高
            - 低
        - label: Unilever 供应商指南
          values:
            - 中
            - 高
            - 高
            - 低
        - label: DHL 案例研究
          values:
            - 高
            - 高
            - 中
            - 中低
        - label: Kuehne + Nagel SCF 案例
          values:
            - 中高
            - 高
            - 中
            - 低
        - label: Schaeffler 中国案例
          values:
            - 高
            - 高
            - 中
            - 低
        - label: Gartner / 评价载体
          values:
            - 中
            - 高
            - 高
            - 中低
    claimRefs:
      - CU018
      - CU020
      - CU023
      - CU024
      - CU027
      - CU028
      - CU030
  - id: FU004
    title: 扩张与集中度逻辑
    type: flow
    layout: wide
    summary: Tradeshift 如何在大客户内部做深；但公开可见度在哪些节点中断，导致集中度仍难承销。
    data:
      nodes:
        - id: r1
          label: 合规 / AP 痛点
          description: 跨国买方需要发票自动化、可见性和国家规则支持。
        - id: r2
          label: 供应商入驻
          description: 供应商受邀进入带有 Tradeshift 品牌的工作流，并开始交易。
          dependsOn:
            - r1
        - id: r3
          label: 运营标准化
          description: 早期跑通后，买方把工作流扩展到更多实体、分支或国家。
          dependsOn:
            - r2
        - id: r4
          label: 邻近扩张
          description: 一些账户在发票网络之上采用金融或其他更高价值模块。
          dependsOn:
            - r3
        - id: r5
          label: 潜在收入集中度
          description: 如果扩张集中在大跨国账户，它们可能贡献超额收入。
          dependsOn:
            - r3
            - r4
        - id: r6
          label: 公开可见度缺口
          description: 外部记录在披露头部账户 ARR 占比、挂载率或续约时间之前就停止了。
          dependsOn:
            - r5
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 外部监管期限、合作伙伴依赖与客户侧执行交汇处，残余严重度最高。
    data:
      columns:
        - 可能性
        - 残余严重度
        - 缓释成熟度
      rows:
        - label: 法国强制令执行
          values:
            - 高
            - 高
            - 中
        - label: 跨境隐私 / 处理方
          values:
            - 中高
            - 高
            - 中高
        - label: 安全事件
          values:
            - 中
            - 高
            - 高
        - label: 嵌入式金融模型脆弱性
          values:
            - 中高
            - 高
            - 中
        - label: 支持 / 实施摩擦
          values:
            - 中高
            - 中高
            - 中
        - label: 英国流动性 / 契约压力
          values:
            - 中
            - 高
            - 中低
    claimRefs:
      - CR001
      - CR003
      - CR013
      - CR024
      - CR037
      - CR038
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示合规、运营和资本问题如何层层传导到客户信任、增长和估值。
    data:
      nodes:
        - id: t1
          label: 强制令或合规失手
          description: 未能跟上获批平台、格式或申报要求。
        - id: t2
          label: 供应商入驻摩擦
          description: 客户和供应商遇到设置问题，激活变慢，支持负担上升。
          dependsOn:
            - t1
        - id: t3
          label: 客户信任受损
          description: 旗舰账户开始质疑可靠性、支持质量或平台准备度。
          dependsOn:
            - t2
        - id: t4
          label: 扩张放慢 / 背书变弱
          description: 新老账户的落地后扩张和可背书性都会变差。
          dependsOn:
            - t3
        - id: t5
          label: 收入 / 现金流压力
          description: 增长放慢，但支持和合规成本仍维持高位。
          dependsOn:
            - t4
        - id: t6
          label: 估值下行
          description: 投资人剔除嵌入式金融上行，并施加更重的风险折扣。
          dependsOn:
            - t5
      edges:
        - from: t1
          to: t2
          label: 合规失手拖慢入驻
        - from: t2
          to: t3
          label: 供应商摩擦削弱信任
        - from: t3
          to: t4
          label: 背书变弱拖慢扩张
        - from: t4
          to: t5
          label: 成本持续、增长放慢
        - from: t5
          to: t6
          label: 投资人折价不确定性
    claimRefs:
      - CR024
      - CR031
      - CR037
      - CR038
      - CR039
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 这张依赖图聚焦外部机构和供应商，它们会影响 Tradeshift 交付金融、合规和分析工作流的能力。
    data:
      nodes:
        - id: d1
          label: HSBC / 金融伙伴
          description: 资本、资金项目和嵌入式金融分发。
        - id: d2
          label: 合规服务商
          description: 税务、清分和本地发票合规伙伴，包括 Sovos、Avalara、Kingxunlian 和 Baiwang。
        - id: d3
          label: 以 AWS 为中心的基础设施
          description: 核心托管，以及分析和 AI 产品化堆栈。
          dependsOn:
            - d1
        - id: d4
          label: 监管与标准机构
          description: 法国税务机关规则、获批平台、Peppol 格式和强制令日程。
          dependsOn:
            - d2
        - id: d5
          label: 旗舰跨国客户
          description: 大账户验证网络，也暴露交付质量。
          dependsOn:
            - d3
            - d4
        - id: d6
          label: 残余企业风险
          description: 任何一层依赖失效，客户信任、增长和利润率都可能承压。
          dependsOn:
            - d1
            - d2
            - d3
            - d4
            - d5
      edges:
        - from: d1
          to: d6
          label: 金融伙伴不稳定
        - from: d2
          to: d4
          label: 本地合规供应商支撑标准落地
        - from: d3
          to: d5
          label: 云和分析体验塑造客户结果
        - from: d4
          to: d5
          label: 监管变化影响部署
        - from: d5
          to: d6
          label: 标杆客户健康度影响企业风险感知
    claimRefs:
      - CR019
      - CR021
      - CR027
      - CR028
      - CR029
      - CR030
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 投资建议来自一条简单链条：战略质量真实存在，但公开价格支撑偏弱，分母数据缺失，今天还不能给出买入判断。
    data:
      nodes:
        - id: n1
          label: 真实市场角色
          description: 供应商网络、合规密度和跨国客户工作流都是真实资产
        - id: n2
          label: 部分溢价有依据
          description: Tradeshift 强于通用交易型 AP 点解决方案
        - id: n3
          label: 估值锚过期 / 追踪器分歧大
          description: 公开估值锚集中在 $2.7B 左右，但收入锚分散很大
        - id: n4
          label: 金融模型压力
          description: SemFi 退出、伙伴复杂性和盈利细节缺失，压低收入质量信心
        - id: n5
          label: 基准 EV 低于标题估值
          description: 公开证据下的基准情形更接近 ~$1.0B-$1.4B，而不是 $2.7B
        - id: n6
          label: 跟踪
          description: 继续跟踪公司，但需要更好的价格或更强证据
      edges:
        - from: n1
          to: n2
          label: 支撑溢价
        - from: n2
          to: n5
          label: 但只能落在 2026 年可比范围内
        - from: n3
          to: n5
          label: 迫使下调估值
        - from: n4
          to: n6
          label: 阻止买入
        - from: n5
          to: n6
          label: 设定价格纪律
    approximationNotes: 这张图压缩呈现本章决策逻辑，并不建模经营预测。
    claimRefs:
      - CV018
      - CV019
      - CV024
      - CV028
      - CV033
      - CV034
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 按当前公开估值看，Tradeshift 隐含倍数高于近期交易锚，也高于许多可比的 2026 年软件估值带参考点。
    data:
      items:
        - label: Tradeshift / Latka ARR
          value: 16.7
          claimRefs:
            - CV016
        - label: Tradeshift / CBI 收入
          value: 18.7
          claimRefs:
            - CV015
        - label: Tradeshift / CompWorth 收入
          value: 33.8
          claimRefs:
            - CV017
        - label: Coupa 交易锚
          value: 8
          claimRefs:
            - CV013
        - label: Pagero 交易锚
          value: 7.9
          claimRefs:
            - CV014
        - label: Windsor 战略并购上限
          value: 8
          claimRefs:
            - CV011
        - label: Windsor 行业中位路径
          value: 4.4
          claimRefs:
            - CV009
    approximationNotes: 柱形代表 EV/收入 或 EV/ARR 倍数，不是企业价值。交易锚来自外部先例，Tradeshift 柱形则由公开追踪估值推算。
    claimRefs:
      - CV009
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 公开证据给出的区间很宽，但除非 Tradeshift 已经跑出高溢价牛市情形，估值重心仍低于当前追踪估值。
    data:
      items:
        - label: 熊市情形
          low: 400
          high: 750
          mid: 575
        - label: 基准情形
          low: 1000
          high: 1400
          mid: 1200
        - label: 牛市情形
          low: 2600
          high: 3500
          mid: 3050
        - label: 当前公开估值
          low: 2700
          high: 2700
          mid: 2700
    approximationNotes: 数值是以百万美元计的企业价值区间，来自公开收入锚和外部倍数区间。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: KPI 看板把可观察规模标记和推断承销结果放在一起，说明这项资产值得跟踪，但不值得按当前标题估值追高。
    data:
      items:
        - label: 公开追踪估值
          value: $2.7B
          note: 多个市场数据载体重复出现
        - label: 公开收入 / ARR 锚
          value: ~$79.9M-$161.5M
          note: 区间很宽；准确分母仍未验证
        - label: 累计融资额
          value: $1.1B-$1.161B
          note: 后期融资压力很可能影响普通股
        - label: 基准 EV 区间
          value: $1.0B-$1.4B
          note: 公开证据下当前最好的估值重心
        - label: 牛市 EV 区间
          value: $2.6B-$3.5B
          note: 需要高溢价留存和强利润率
        - label: 可能退出路径
          value: Strategic M&A
          note: 2026 年退出数据更支持战略并购，而非 IPO
        - label: 建议
          value: track
          note: 等待更好的价格发现或更强证据
    approximationNotes: 看板有意混合可观察公开事实，以及以引用来源为锚的推断承销区间。
    claimRefs:
      - CV003
      - CV008
      - CV031
      - CV032
      - CV034
      - CV035
      - CV038
