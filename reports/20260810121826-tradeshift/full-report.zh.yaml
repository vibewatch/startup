            body: >-
              公开资料支持继续尽调，而不是贸然押注。Windsor Drake 的 2026 年退出指南有启发：这一类别的 IPO 窗口要求约 $200M+ ARR、盈利能力和 25%+ 增长，多数退出则通过战略 M&A
              发生。Tradeshift 的客户覆盖、供应商网络和监管定位，使它有可能吸引战略收购方或结构化私募买家。但同一份记录没有显示公开投资者或 IPO 买家会要求的经审计经济性。最佳解读是，Tradeshift
              可能是一家好公司，但当前公开估值支撑已经落后于披露质量。


              这让尽调清单很直接。投资人需要按产品拆分的当前 ARR、软件与金融相关收入流之间的收入结构、按收入流拆分的毛利率、留存指标、客户集中度和股权结构瀑布。还需要弄清 SemFi
              之后还剩什么：金融产品敞口现在是否更简单，还是风险只是从资产负债表移到合作伙伴安排和法律复杂性中。若这些要求揭示的只是普通留存、薄弱利润率、新一轮契约压力，或普通股价值远低于企业价值头条数字的估值结构，投资逻辑就会断裂。
