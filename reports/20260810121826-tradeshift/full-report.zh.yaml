  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻品类
        blocks:
          - type: paragraph
            body: >-
              Tradeshift 放不进一个整齐的软件盒子里，所以先要界定市场再谈规模。公司当前定位从电子发票软件、全球合规和应付账款自动化起步，再延伸到供应商网络协作、虚拟卡采购，以及与 HSBC
              的嵌入式金融。因此，相关市场不是泛泛的“fintech”，甚至也不是全部 B2B
              支付。核心购买问题是跨国买方的发票到付款工作流数字化：它们必须交换结构化发票、遵守税制，并让供应商网络里的营运资本更快流动。最接近的现状替代品仍是 PDF / email 发票、手工录入
              ERP、按国家分别运行的门户，以及与应付账款工作流脱节的银行金融产品。法国官方税务指引把这种替代风险说得很清楚：email 发送的 PDF
              和扫描纸质文件不再满足即将到来的法国制度，这会把买方从可选的工作流现代化推向强制平台选择。ViDA 在欧盟层面做了同样的事，把电子发票和数字申报变成一个多年的监管趋同项目。因此，Tradeshift
              真正的市场边界，是夹在 ERP、供应商、税务机关和支付轨道之间的软件与网络层，而不是 B2B 贸易本身的全部价值。
