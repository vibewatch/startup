      - number: '7.3'
        title: 合作伙伴与资本依赖是最非线性的风险簇
        blocks:
          - type: paragraph
            body: >-
              合作伙伴和财务依赖让 Tradeshift 的风险叙事更相互牵连。公开资料里最强的相邻收入故事是嵌入式金融，但同一批证据也显示模式很碎片化。HSBC 的 2023 年公告和 TechCrunch
              的融资报道，将该银行与 Tradeshift 描述为共建合资公司，通过贸易网络提供嵌入式金融和其他服务。但卖方提前付款条款明确说明，Tradeshift 自身提供的是
              SaaS，而不是金融服务；合作伙伴条款管控资金关系；交易数据可能为 KYC、组合分析和监管尽调共享；Tradeshift
              或项目合作伙伴可随时取消项目参与。换句话说，战略上行空间存在，但授信、连续性和经济收益的控制权是共享的。


              到了 2026 年，这种模糊性更关键。GTR Review 报道，Tradeshift 于 2026 年 7 月退出 SemFi，且该合资公司的首份全年账目显示，收入 US$1.1M，税前亏损
              US$21M。同篇文章还把 Tradeshift 英国实体与反复亏损、历史负现金流、契约豁免和票据到期延长至 2026 年 11 月下旬联系起来。Companies House
              备案页面进一步说明，这不是一个静态合资项目：SemFi 在 2026 年 7–8 月出现偿付能力和减资备案以及董事变更；Tradeshift Network
              的备案历史也出现过后来终止的注销噪音。结果不是单点问题，而是一组风险：金融增长取决于银行、法律条款、数据共享和资本韧性持续保持一致。
