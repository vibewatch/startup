      - number: '2.5'
        title: 约束和尽调缺口仍限制份额转化
        blocks:
          - type: paragraph
            body: >-
              主要谨慎点是，采用动能不会自动转化成轻松拿份额或干净的估值可比。法国本身按公司规模错开发票开具义务，所以买方紧迫性先于整个生态准备度到来；EPC 仍指出独立 SCT Inst
              统计不完整，限制了结算层测算精度。Qvalia 的 Billentis 摘要也明确说，AI 无法弥补糟糕的数据基础；商业案例要成立，公司仍需要清理主数据、集成 ERP，并保持治理纪律。Grand View
              从另一个角度强调同样的摩擦，把实施成本和数据安全顾虑列为有意义的约束，尤其是在较小组织中。因此，Tradeshift
              的公开足迹应被解读为相关性证据，而不是直接的市场份额估计。其自身当前指标以及法国页面更大的文档量主张，意味着公司确实进入了对强制令敏感的企业账户；但仍没有投资级公开披露说明，跨国发票量、受监管国家支出或供应商网络吞吐中，有多大比例能经济性地转成
              Tradeshift 收入。最大的未解市场问题因此不是市场是否存在——它显然存在——而是一个必须逐国赢预算、集成系统并上线供应商的平台，到底能实际触达多少市场。
