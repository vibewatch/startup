  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础由企业买方牵引，但供应商使用是价值闭环核心
        blocks:
          - type: paragraph
            body: >-
              理解 Tradeshift 客户时，最重要的一点是：平台卖给企业买方，但只有供应商参与后才有价值。首页、about
              页面和客户案例中心持续把产品描述为覆盖应付账款自动化、电子发票、上线和状态可见性的买方—供应商网络。这不只是营销语言。Air France-KLM 和 Unilever 都运营面向供应商的 Tradeshift
              界面，供应商会被邀请、上线、提交发票，并查询付款或文件状态。这些客户自有工作流让供应商用户进入公开记录，也说明 Tradeshift 嵌在真实运营流程里，而不是藏在只有买方可见的后台。


              这也澄清了公司的理想客户画像。证明点集中在跨国企业：它们有复杂的采购到付款资产、跨境合规需求和庞大供应商群。Air France-KLM 突出法国强制令准备度和发票可追踪性。Unilever
              展示了国家特定发票规则和规模化门户支持。案例研究和市场数据页面可见的客户覆盖交通、物流、制造、消费品和房地产。换句话说，Tradeshift
              看起来最适合这类组织：发票自动化不能与供应商启用、地域特定规则，以及多实体或多分支的运营透明度分开。
