      - number: '6.4'
        title: 扩张逻辑可信，但集中度风险披露仍不足
        blocks:
          - type: paragraph
            body: >-
              扩张故事是 Tradeshift
              投资逻辑里更可信的一块。客户证据显示，既有账户内的钱包份额可以通过几条路径扩大：按国家推进合规上线、让更多实体的供应商接入、叠加更多工作流自动化，部分情况下再延伸到金融产品。Air France-KLM 的
              2026 年强制要求准备，说明监管如何迫使更深采用。Unilever 的分国别指南，说明运营分散度如何把门户固定进日常发票工作。Schaeffler
              称，任何供应商上线都会让所有地区受益，这是典型的网络驱动扩张语言。Kuehne + Nagel 和 HSBC 材料显示，Tradeshift 至少尝试把发票网络关系转化为供应链金融收入流。


              问题在于，公开证据到回报测算前就停住了。没有披露头部客户收入集中度、账户级 ARR
              结构、金融或分析产品附加率，也没有说明多少客户只用发票接收、多少已用更宽的产品族。也就是说，集中度风险可能温和，也可能很大；公开证据无法判断。它还意味着，Tradeshift
              最好的客户故事主要证明产品能落地并运转，而不是存量客户基盘的经济韧性有多强。尽调层面，客户章节因此给出分裂结论：生产证据强、扩张机制可信，但披露不足，无法有把握建模集中度、续约或货币化深度。
