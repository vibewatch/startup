      - number: '3.4'
        title: 切换成本和分发塑造护城河，也限制独特性
        blocks:
          - type: paragraph
            body: >-
              Tradeshift 确实有可防守元素，但比第一眼看到的网络叙事更窄。平台一旦接入
              ERP、映射发票格式、嵌入审批流，并连接到大型供应商群，切换成本就很高。营运资本产品、支付控制或客户定制门户叠加上线时，同样如此。这利好市场里每一个成熟供应商，不只利好 Tradeshift。SAP 和
              Oracle 受益于 ERP 邻接和跨职能 CIO 赞助。Coupa 依靠更广的支出平台和很大的交易数据飞轮。Basware、Tungsten 和 Pagero
              都公开销售同一套“全球合规加供应商启用”故事，而这正是 Tradeshift 护城河的基础。近期整合进一步放大了这一点：Coupa 现在是 Thoma Bravo 支持的 $8 billion
              私有资产，Pagero 已并入 Thomson Reuters 合规组合。买方评估平台耐久性时，不再只拿产品功能对比
              Tradeshift，还能对比更大所有者的资产负债表、装机基础和相邻分发渠道。Tradeshift 最能留下来的楔子，是买方明确想要带嵌入式金融潜力的企业供应商网络；其他场景里，竞争场正收敛到功能平价。
