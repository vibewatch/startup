      - number: '3.2'
        title: 正面产品重叠集中在合规、网络和多 ERP 工作流
        blocks:
          - type: paragraph
            body: >-
              最尖锐的竞争重叠来自能把结构化发票交换、供应商启用和企业工作流控制合在一起的供应商。SAP Business Network 明确营销买卖双方之间的交易交换、贸易伙伴发现、物流和营运资本优化；Coupa
              覆盖从寻源到合同、从采购到下单、从发票到付款、支付、财资和供应商风险功能；GEP 宣传从寻源到支付都有 agent
              覆盖的无接触采购到付款。买方想要一个采购和财务战略控制平面，而不是网络驱动的专精厂商时，这些套件会威胁 Tradeshift。与此同时，Basware、Pagero 和 Tungsten
              从另一侧进攻。Basware 强调跨每个国家、ERP 和供应商的发票生命周期管理，并有 2000 万连接买方和供应商支撑。Pagero 强调自动化 P2P 和 O2C、本地合规，以及 Thomson
              Reuters 称可触达 1400 万家公司的网络。Tungsten 明确营销自有电子发票交换、白手套式供应商上线和作为全球贸易基础设施层的合规覆盖。因此，Tradeshift
              自己的供应商网络和合规故事是真的，但并不独特；多家竞争对手现在都把这些主张与多 ERP 环境、供应商激活和财务控制收益同样明确地绑定在一起。
