      - number: '5.3'
        title: 合规和信任是产品功能，不只是法律叠加层
        blocks:
          - type: paragraph
            body: >-
              Tradeshift 的产品深度异常紧密地绑定外部标准和控制面。月度和季节性发布说明显示，国家强制令不是边缘事项：平台已发布法国特定税务清关字段、波兰 KSeF 流程和对账、马来西亚汇率要求、印度 GST QR
              上传、罗马尼亚税率更新，以及 2026 年 6 月 UBL 2.1 迁移。比利时强制令材料进一步把产品与 Peppol 网络基础设施以及 Babelway 绑定；Tradeshift 称 Babelway
              支撑比利时的 Mercurius B2G 平台。这意味着 Tradeshift 的产品优势部分取决于它能多快把外部 schema、路由和清关变化运营化，而不只是通用软件易用性。


              安全、隐私和数据治理同样被产品化。Tradeshift 的公开安全材料描述纵深防御、最小权限访问、安全开发生命周期控制、监控、备份、灾难恢复和年度测试。信息安全政策承诺在 48 小时内发出书面违规通知，提供年度
              SOC 1、SOC 2、ISAE 3402 和 ISO 27001 审计报告，开展年度第三方渗透测试、漏洞管理和 bug bounty 项目。隐私页面增加了 GDPR 和 CCPA
              承诺、privacy-by-design 培训，以及明确的 DPO 联系路径。这些不能证明现实执行完美，但说明信任姿态已经嵌入 Tradeshift
              销售平台的方式：跨国应付账款自动化只有在客户相信平台能承载受监管发票数据、保留审计轨迹并扛住本地发票规则持续变化时才成立。
