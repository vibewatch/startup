      - number: '8.3'
        title: 情景区间与承保：公开证据支持宽区间，基准情景远低于 头条估值
        blocks:
          - type: paragraph
            body: >-
              情景分析必须给出宽区间，因为缺失数据正是通常用来压缩估值不确定性的输入：当前 ARR、收入结构、毛利率、留存和股权结构。下行情景假设 Tradeshift 的收入质量更像混合 AP /
              金融平台，而不是优质软件复利标的；增长没有明显重新加速；投资人关注金融产品复杂度和 SemFi 包袱。对应约 $0.4B-$0.75B。基准情景假设更高收入锚点方向上真实，网络效应和合规密度足以支撑真正溢价，并且
              Tradeshift 在金融噪音正常化后能维持中高质量软件经济性。对应约 $1.0B-$1.4B。


              上行情景并非不可能，但已经接近当前公开估值标记。若要支撑 $2.6B-$3.5B，投资人需要看到证据：Tradeshift 已经超过 $220M ARR
              或正在快速逼近；尽管靠近嵌入式金融，利润率仍强；监管驱动需求正在转化为耐久的盈利增长。由于这些要求在公开资料中不可见，当前 $2.7B
              锚点更像上行情景价格，而不是基准情景价格。这个错配导致“偏贵”立场，也解释了为什么从这里往后，新披露比讲故事更重要。
