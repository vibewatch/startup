      - number: '1.2'
        title: 领导层、治理与创始人交接
        blocks:
          - type: paragraph
            body: >-
              当前公司概览里，领导层是最重大的变化。三位创始人之一 Christian Lanng 在 2023 年融资和合作声明中仍以 CEO 兼联合创始人身份签署文件。但公司 2026 年 about
              页面已不再把他列入运营团队。Tradeshift 现在展示的 CEO 是 Mike Cowles，CFO 是 Marcus Carr，COO 是 Ron Lugo，首席产品和技术官是 Raphael
              Bres。这一交接重要，因为 Tradeshift 的公开叙事已从创始人主导的贸易网络布道，转向围绕合规执行、交付和 HSBC 相关嵌入式金融机会变现的运营叙事。不过，治理披露仍不完整。公开材料确认 HSBC 在
              2023 年融资中加入董事会，也保留了历史投资方董事背景，但没有给出清晰、当前、完整的董事会名单或所有权地图。这限制了对控制动态的尽调，尤其是在 2023 年创始人不当行为危机和高管重置之后。
