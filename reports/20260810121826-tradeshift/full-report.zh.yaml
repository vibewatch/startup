      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 公开估值标记是核心负面事实
            body: Tradeshift 也许具备战略可信度，但可观察估值锚点意味着溢价倍数，且该倍数已经假设异常好的收入质量和执行。
            calloutType: risk
            claimRefs:
