      - number: '7.2'
        title: 运营和安全风险已有缓释，但并不遥远
        blocks:
          - type: paragraph
            body: >-
              运营上，公开证据显示 Tradeshift
              重视安全和可靠性，但并非免疫于服务风险。安全白皮书和信息安全政策描述了较标准的后期企业级姿态：纵深防御、最小权限、年度审计、年度渗透测试、漏洞管理，以及明确的事件响应承诺，包括 48
              小时内书面通知。支持文章补充了一条对尽调更具体的运营细节：中国以外的平台主要托管在 AWS 爱尔兰区域，集成服务可能位于其他国家。这让数据地理更清楚，但也确认了外部基础设施依赖和跨司法辖区数据处理。


              更重要的是，风险不是理论上的。公开状态页显示，2026 年 8 月 4 日出现过一次真实事件，涉及 Goods Receipts 与 Purchase Requests
              性能问题。单看并非灾难，但它说明平台在生产环境中可能发生影响工作流的降级。合同也限制投资人舒适度：SaaS
              协议明确否认数据或传输无错误、不间断的任何保证，同时把累计责任上限限定在近期费用水平。再叠加当前和历史评论中关于 UI、浏览器行为、加载时间和支持质量的投诉，结论很清楚：Tradeshift
              可能有可信的控制环境，但客户仍要在直接嵌入发票和采购工作流的产品里承受有意义的运营和支持风险。
