      - number: '1.3'
        title: 融资历史与投资方
        blocks:
          - type: paragraph
            body: >-
              Tradeshift 已在多个周期里融入大量资本，但公开来源对累计金额有分歧，取决于是否把债务、补助和类似二级交易的事件纳入统计。Tracxn 的 2026 年融资历史口径最宽，显示 24 轮约 $1.24
              billion。最近一轮充分披露的融资是 2023 年 8 月，预计至少筹集 $70 million，由 HSBC 领投，现有投资方 Notion、LUN Partners、Fuel、Doha Venture
              Capital、IDC Ventures、AYTK 和 The Private Shares Fund 参投。HSBC 自己的公告确认其分两阶段投资 $35
              million、获得一个董事会席位，并计划启动一家共同持有的嵌入式金融合资企业。更早的后期融资更重：TechCrunch 和 Tracxn 描述了 2021 年与 Koch 和其他支持者相关的 $200
              million Series F / 融资事件；TechCrunch 2023 年后续报道则称，最后公开的估值基准仍停在 2021 年 $2.7 billion，IPO
              路径已经延后。结果是，公司作为后期私营企业融入了充足资本，但除二级市场跟踪器外，仍没有公开财务披露或近期价格发现。
