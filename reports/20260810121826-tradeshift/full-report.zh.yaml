    columns:
      - 参考对象
      - 状态
      - 可观察指标
      - 隐含倍数 / 估值语境
      - 重要性
      - 关键限制
    rows:
      - - Tradeshift 公开跟踪器集群
        - 当前但间接
        - 估值 ~$2.7B；收入锚点从 ~$79.9M 到 ~$161.5M ARR
        - 隐含 ~16.7x-33.8x
        - 定义投资人可能想沿用的价格
        - 不是公司新一轮一级市场定价
      - - Windsor Drake AP / CFO 软件指南
        - 2026 年行业基准
        - 纯经常性收入型 6x-10x；混合型 AP 3.1x-4.0x；交易型 2.3x-3.5x
        - 核心模型质量框架
        - 观察混合型 AP / 金融软件的最佳直接市场镜头
        - 是框架，不是公司特定交易可比
      - - Coupa 私有化
        - 已验证战略交易
        - Thoma Bravo 以 $8.0B 收购
        - 按 Windsor Drake 口径约 8.0x 收入
        - 显示成熟采购软件在战略 M&A 中能成交到什么水平
        - 规模、披露质量和业务组合不同
      - - Pagero 出售给 Thomson Reuters
        - 已验证的战略交易
        - ~$800M / SEK 8.1B 收购
        - 按 Windsor Drake 口径约 7.9x 收入
        - 说明全球电子发票合规网络有价值
        - 地域、盈利能力和网络经济性不同
      - - 2026 年上市软件公司倍数区间
        - 当前上市可比公司背景
        - ERP 3.2x-14.0x；财务管理 2.3x-11.3x；供应链 2.2x-14.6x
        - 区间离散很大，但仍低于 Tradeshift 更严苛的隐含情景
        - 避免只套一笔交易
        - 大类中位数并非严格可比
  - id: TV005
    title: 投资论点破裂与否决触发表
    notes: 这些事件可以持续跟踪；即使战略故事仍有吸引力，一旦发生，也会把建议推向更弱一档。
    claimRefs:
      - CV024
      - CV025
      - CV036
      - CV038
      - CV039
      - CV041
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 融资压力回归
        - 新增契约豁免、紧急过桥融资，或内部人以显著稀释方式救援
        - 证明资本质量弱于表面估值显示的水平
        - 从跟踪转向回避 / 等待
      - - 收入质量不及预期
        - ARR 或收入明显低于当前高端跟踪锚点
        - 把投资测算推向熊市情景
        - 大幅下调入场价格
      - - 金融产品复杂度仍高
        - SemFi 之后的经济性仍依赖质量偏低、伙伴占比高的金融收入
        - 相比纯 SaaS 同行，折价有理由
        - 套用更低倍数区间
      - - 客户证据恶化
        - 具名客户背书消失，或旗舰客户出现收缩 / 流失
        - 削弱护城河和交叉销售主张
        - 重估护城河和下行情景假设
      - - 股权结构悬顶严重
        - 优先权堆叠或普通股分配瀑布严重压低上行空间
        - 企业价值故事高估了实际股权回报
        - 要求重做回报模型，否则放弃
  - id: TV006
    title: 最终尽调问题清单
    notes: 这些少数问题决定 Tradeshift 到 2026 年能否支撑接近高溢价后期软件公司估值。
    claimRefs:
      - CV035
      - CV038
      - CV040
      - CV041
      - CV042
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 与增长
        - 按产品和地域拆分的 2024-2026 年月度 ARR / 收入桥
        - 给每个情景确定分母
        - 财务 + 管理层 KPI 包
      - - 按收入流拆分的毛利率
        - 软件与支付 / 金融的毛利率和贡献利润率
        - 决定 Tradeshift 是否配得上 SaaS 档倍数
        - 财务主管 / CFO 尽调
      - - 留存与集中度
        - NRR、GRR、流失、队列扩张和头部客户敞口
        - 区分网络护城河和客户名单作秀
        - RevOps + 客户成功分析
      - - 股权结构与优先权
        - 完全摊薄股权结构、票据条款、分配瀑布，以及近期任何 409A / 要约数据
        - 判断优先权悬顶后普通股上行空间
        - 法务 + 财务尽调
      - - SemFi 后单位经济性
        - 当前金融产品附着率、伙伴经济性、损失敞口和剩余义务
        - 说明金融邻近业务带来上行，还是应当折价
        - 产品 + 资金管理 + 伙伴尽调
