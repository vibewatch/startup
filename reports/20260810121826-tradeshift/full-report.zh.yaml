        - id: connect
          label: 邀请供应商
          actor: 买方赋能团队 + 供应商
          description: 具名买方把供应商拉进带有 Tradeshift 品牌的门户或网络流程，而不是只强推点对点集成。
          channels:
            - 供应商门户
            - 邀请邮件
            - 入驻支持
        - id: transact
          label: 提交并跟踪发票
          actor: 供应商 + AP 运营
          description: 供应商提交发票后，双方都能在工作流里看到可追溯性、校验结果和状态。
          channels:
