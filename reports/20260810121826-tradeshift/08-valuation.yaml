    {
      "id": "scenario-range-and-underwriting",
      "title": "Scenario Range and Underwriting: Public Evidence Supports a Wide Range, with the Base Case Well Below the Headline Mark",
      "body": "Scenario work has to be wide because the missing data are the exact inputs that normally collapse valuation uncertainty: current ARR, revenue mix, gross margins, retention, and cap-table structure. The bear case assumes Tradeshift’s revenue quality looks closer to a hybrid AP / finance platform than a premium software compounder, that growth is not visibly re-accelerating, and that investors focus on finance-product complexity plus the SemFi overhang. That yields roughly $0.4B-$0.75B. The base case assumes the higher revenue anchors are directionally real, that network effects and compliance density justify a real premium, and that Tradeshift can sustain mid-to-high-quality software economics once finance noise is normalized. That produces roughly $1.0B-$1.4B.\n\nThe bull case is not impossible, but it is already close to the current public mark. To support $2.6B-$3.5B, investors would need evidence that Tradeshift is already above $220M ARR or rapidly approaching it, that margins are strong despite embedded-finance adjacency, and that regulation-led demand is converting into durable profitable growth. Because those requirements are not visible publicly, the current $2.7B anchor looks like a bull-case price, not a base-case price. That mismatch drives the expensive stance and explains why fresh disclosure matters more than storytelling from here.",
