    {
      "id": "multiple-sizing-lenses-show-a-large-but-not-single-market",
      "title": "Multiple sizing lenses show a large but non-single market",
      "body": "The market is clearly large, but no single headline number is analytically clean enough to use on its own. The best approach is to stack several compatible lenses. At the transaction base layer, Billentis 2026 as summarized by Qvalia estimates at least 600 billion invoices globally, about 300 billion of them B2B, and only around 87 billion already electronic. That establishes an enormous remaining analog-to-digital conversion opportunity. At the infrastructure layer, Research and Markets sizes global e-invoicing at $29.79 billion in 2026 growing to $60.81 billion by 2030, while Grand View sizes AP automation software at $3.07 billion in 2023 growing to $7.1 billion by 2030. At the monetization-adjacent layer, Research and Markets sizes supply-chain finance at $14.55 billion in 2026 and B2B payments at $1.47 trillion in 2026, while Mordor publishes a similar but somewhat higher $1.67 trillion B2B-payments lens. Fortune\u2019s $109.39 trillion 2026 B2B-payments figure is directionally useful only as a total-flow proxy; it is not comparable to software-revenue estimates and dramatically overstates what a workflow platform like Tradeshift can capture as revenue. The right diligence read-through is therefore not \u201cpick one TAM,\u201d but separate invoice volume, software/infrastructure spend, and payment-flow opportunity so valuation work does not confuse transaction value with addressable platform revenue.",
      "claimRefs": [
