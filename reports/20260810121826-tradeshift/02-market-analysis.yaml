  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Tradeshift sells into a compliance-forced but still fragmented market spanning e-invoicing, AP automation, B2B payment orchestration, and supply-chain finance. The addressable opportunity is clearly large, but public estimates vary wildly because some publishers measure software revenue while others measure underlying payment flows; the strongest read-through is that regulation and ROI keep expanding demand among multinational finance teams, while supplier onboarding, integration complexity, and fuzzy SAM/SOM definitions remain the key constraints."
  },
  "sections": [
    {
      "id": "market-boundary-and-adjacent-categories",
      "title": "Market boundary and adjacent categories",
      "body": "Tradeshift does not fit a single neat software box, so the market has to be bounded before it is sized. The company\u2019s own current positioning starts with e-invoicing software, global compliance, and AP automation, then extends into supplier-network collaboration, virtual-card procurement, and embedded finance with HSBC. That means the relevant market is not generic \u201cfintech\u201d or even all B2B payments. The core buying problem is the digitization of invoice-to-pay workflows for multinational buyers that must exchange structured invoices, comply with tax regimes, and move working capital faster across supplier networks. The closest status-quo substitutes are still PDF/email invoicing, manual ERP entry, portals run country by country, and bank-led finance products disconnected from AP workflows. Official French tax guidance makes that substitution risk explicit: emailed PDFs and scanned paper no longer satisfy the coming French regime, which shifts buyers from optional workflow modernization into mandatory platform selection. ViDA does the same at the EU level by turning e-invoicing and digital reporting into a multi-year regulatory convergence project. As a result, Tradeshift\u2019s true market boundary is the software and network layer that sits between ERP, suppliers, tax authorities, and payment rails\u2014not the full value of B2B trade itself.",
