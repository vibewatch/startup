    {
      "id": "constraints-and-diligence-gaps-still-limit-share-conversion",
      "title": "Constraints and diligence gaps still limit share conversion",
      "body": "The main caution is that adoption momentum does not automatically convert into easy share capture or clean valuation comparables. France itself staggers issuer obligations by company size, so buyer urgency arrives before full ecosystem readiness, and the EPC still notes that standalone SCT Inst statistics are incomplete, limiting precision when sizing the settlement layer. Qvalia\u2019s Billentis summary is also explicit that AI cannot compensate for poor data foundations; companies still need master-data cleanup, ERP integration, and governance discipline for the business case to hold. Grand View highlights the same friction from another angle, naming implementation cost and data-security concerns as meaningful restraints, especially for smaller organizations. This is why Tradeshift\u2019s public footprint should be interpreted as evidence of relevance rather than a direct market-share estimate. Its own current metrics, and its France page\u2019s larger document-volume claims, imply real distribution into mandate-sensitive enterprise accounts, but there is still no investor-grade public disclosure showing what fraction of multinational invoice volume, regulated-country spend, or supplier-network throughput is economically convertible into Tradeshift revenue. The biggest unresolved market question is therefore not whether the market exists\u2014it clearly does\u2014but how much of that market is practically reachable for a platform that must win budgets, integrate systems, and onboard suppliers country by country.",
      "claimRefs": [
