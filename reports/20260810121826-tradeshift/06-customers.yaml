    {
      "id": "durability-signals-are-positive-but-still-mostly-indirect",
      "title": "Durability signals are positive, but still mostly indirect",
      "body": "Public durability evidence exists, but it is mostly indirect. The clearest positive sign is that customer-owned supplier portals remain live in 2026 and contain operational guidance, account setup steps, invoice-status tools, and mandate-specific instructions. That implies ongoing use rather than dead proof-of-concept pages. Gartner Peer Insights adds a current outside view: the fetched page shows a mostly positive rating distribution and a recent review that praises Tradeshift\u2019s performance in high-volume invoice integration. FeaturedCustomers also shows a large pool of references and a strong aggregate score. These signals are directionally encouraging because they suggest that Tradeshift can produce enough user satisfaction to stay referenceable in market-facing review and benchmark surfaces.\n\nBut none of that is the same thing as underwriting renewal quality. The public record does not disclose net revenue retention, gross retention, logo churn, contract duration, or cohort expansion. Review evidence is also mixed, not spotless. Gartner\u2019s featured review still flags UI and support issues, while archived G2 reviews mention load times, cumbersome document organization, browser quirks, and weak support workflows. The right interpretation is not that the customer base is fragile, but that the company sells consequential enterprise workflows where support quality and change management can materially affect account durability. Public evidence therefore supports a moderate confidence view: Tradeshift is clearly used in production and seems referenceable, yet its renewal economics remain opaque.",
