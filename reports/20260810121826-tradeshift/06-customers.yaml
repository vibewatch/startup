  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Tradeshift\u2019s customer evidence is strongest where multinational buyers expose supplier portals or disclose deployment metrics: Air France-KLM, Unilever, DHL, Kuehne + Nagel, and Schaeffler all show live invoice or finance workflows rather than mere logos. The pattern that emerges is a large-enterprise, multi-country, supplier-network sale where value comes from onboarding, compliance, and process visibility. The main weakness is durability disclosure. Public sources can prove production use, cross-border rollout, and some workflow outcomes, but they do not reveal NRR, contract length, concentration, or attach-rate depth across the installed base."
  },
  "sections": [
    {
      "id": "customer-base-is-enterprise-buyer-led-but-supplier-usage-is-core-to-the-value-loop",
      "title": "Customer base is enterprise-buyer-led, but supplier usage is core to the value loop",
      "body": "The most important thing to understand about Tradeshift\u2019s customers is that the platform is sold to enterprise buyers but only becomes valuable when suppliers participate. The homepage, about page, and customer-stories hub consistently frame the product as a buyer-supplier network spanning AP automation, e-invoicing, onboarding, and status visibility. That framing is not just marketing language. Air France-KLM and Unilever both operate supplier-facing Tradeshift surfaces where suppliers are invited, onboarded, submit invoices, and check payment or document status. Those customer-owned workflows make the supplier user visible in the public record and show that Tradeshift is embedded in real operating processes rather than hidden inside a buyer-only back office.\n\nThis also clarifies the company\u2019s ideal customer profile. The proof points cluster around multinational enterprises with complicated procure-to-pay estates, cross-border compliance needs, and large supplier populations. Air France-KLM highlights France mandate readiness and invoice traceability. Unilever exposes country-specific invoice rules and portal-based support at scale. The customer set visible in case studies and market-data pages covers transport, logistics, manufacturing, consumer goods, and real estate. In other words, Tradeshift appears best aligned to organizations where invoice automation cannot be separated from supplier enablement, geography-specific rules, and operational transparency across many entities or branches.",
