      "id": "switching-costs-and-distribution-shape-moat-but-also-limit-uniqueness",
      "title": "Switching costs and distribution shape moat but also limit uniqueness",
      "body": "Tradeshift does have defensible elements, but they are narrower than a first-pass network narrative suggests. Once a platform is integrated to ERP, mapped to invoice formats, embedded into approval flows, and connected to large supplier cohorts, switching costs are high. The same is true when working-capital products, payment controls, or customer-specific portals have been rolled out on top. That helps every established vendor in this market, not only Tradeshift. SAP and Oracle benefit from ERP adjacency and cross-functional CIO sponsorship. Coupa uses a broader spend platform and a very large transaction-data flywheel. Basware, Tungsten, and Pagero all openly sell the same \u201cglobal compliance plus supplier enablement\u201d story that underpins Tradeshift\u2019s moat. Recent consolidation intensifies the effect: Coupa now has Thoma Bravo backing as a private $8 billion asset, while Pagero has been folded into Thomson Reuters\u2019 compliance portfolio. Buyers evaluating platform durability can now compare Tradeshift not only against product features but against the balance sheets, installed bases, and adjacent distribution channels of much larger owners. Tradeshift\u2019s best surviving wedge is where buyers specifically want an enterprise supplier network with embedded-finance potential; everywhere else, the competitive field is converging toward feature parity.",
