    "number": 3,
    "title": "Competitors",
    "summary": "Tradeshift competes against three distinct rival classes: incumbent source-to-pay suites led by SAP, Coupa, Oracle, and GEP; compliance-and-network specialists such as Basware, Pagero, and Tungsten; and payment-led challengers such as Tipalti and BILL. Its best differentiation remains the combination of supplier-network workflows, compliance execution, and embedded-finance optionality, but the category is converging fast and larger rivals increasingly bundle the same themes into broader procurement, ERP, tax, or treasury platforms."
