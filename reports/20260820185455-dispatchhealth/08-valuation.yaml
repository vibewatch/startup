  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: audited-financials
    missingEvidence: Audited 2025 revenue, gross margin, EBITDA, cash, and 2026 year-to-date performance.
    whyItMatters: Without a denominator, any valuation conclusion stays wide and heavily assumption-driven.
    diligencePath: Request audited financials plus monthly bridge through the latest closed quarter.
    relatedQuestionRefs:
    - QV007
    - QV024
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: critical
    topic: cap-table-reconciliation
    missingEvidence: Full stock purchase agreements and cap-table terms for the 2025 and 2026 financings.
    whyItMatters: The open record shows a major valuation spread that may reflect structure, resets, or security-specific pricing.
    diligencePath: Review full cap table, preference stack, conversion mechanics, and investor rights.
