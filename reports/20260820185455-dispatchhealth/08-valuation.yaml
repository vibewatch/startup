- id: scenario-underwriting
  title: A sensible range is below the 2025 headline and above the 2026 trough
  body: |-
    The range work should be framed as underwriting, not as false precision. The March 2025 Forge mark is too fresh and too large to ignore; it tells us credible investors were willing to fund the company near the mid-$3 billions at that time. The April 2026 Forge datapoint is too low and too recent to ignore either; it tells us that something in the 2026 security, cap table, or performance arc materially changed the observable price. Between those points sits the investable question.

    The bear case is a reset story: investors treat DispatchHealth like a hard-to-scale care-delivery operator and anchor close to the 2026 observable trough, producing roughly $0.6-1.0 billion. The base case assumes the platform is strategically important and still growing, but that opacity and execution risk justify a large discount to the 2025 mark; that yields roughly $1.5-2.4 billion. The bull case requires audited proof that growth, density, and payer quality remained strong through 2025-2026, which can support something like $3.0-3.8 billion. In other words, the prior high mark is only defendable if diligence closes the gaps, not before.
  claimRefs:
