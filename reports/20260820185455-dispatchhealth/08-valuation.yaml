company:
  name: DispatchHealth
chapter:
  number: 8
  title: Valuation
  summary: 'Open-web valuation signals for DispatchHealth are directionally useful but sharply inconsistent. Forge surfaces a March 2025 Series E-1 round at roughly $3.58 billion post-money and an April 2026 financing at roughly $703.5 million, while PitchBook corroborates the financing dates without exposing the economics. Public comp anchors across Teladoc, Option Care, CVS, Humana, UnitedHealth, and Best Buy trade at low revenue multiples, which forces valuation discipline in the absence of audited DispatchHealth financials. The practical recommendation is conditional only: keep diligencing the asset, but do not pay anywhere near the high-end 2025 mark unless management reconciles the 2026 pricing and provides audited operating data.'
sections:
- id: observable-marks-and-what-they-mean
  title: The valuation file is real, but internally inconsistent
  body: |-
    DispatchHealth is clearly valuable enough to keep attracting capital, but the open valuation record is not internally clean. The strongest company-scale proof is solid: merger-close materials described a combined platform with more than 50 enterprise customers, more than 1.2 million patients treated, and a footprint spanning more than 20 states. That is real operating relevance, not a slideware asset. The problem starts when price enters the picture.

    Forge reported a March 2025 Series E-1 financing at a $3.58 billion post-money valuation and then an April 2026 financing at a $703.5 million post-money valuation. PitchBook independently corroborates that completed financings occurred on both dates, even if it hides the economic terms. Notice contributes an $888.31 headline with almost no context, and Nasdaq Private Market confirms only that the company is private and tradable through secondary workflows. The conclusion is not that any one alternative-data page is correct. It is that observable price discovery is too dispersed to support blind reliance on a single headline mark.
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV038
