chapter:
  number: 3
  title: Competitors
  summary: DispatchHealth competes in an uneven field that spans direct complex-care-at-home operators, post-acute coordination vendors, hospital-at-home infrastructure platforms, internal health-system build, and lower-acuity consumer adjacencies. Its post-merger breadth and operational depth look differentiated in the public record, especially versus Amazon One Medical and CareCentrix, but the moat is more operational than proprietary. Pricing remains opaque, internal build remains credible, and category churn across Current Health, Contessa, and DispatchHealth itself shows the landscape is still unsettled.
sections:
- id: landscape-boundary
  title: 'Landscape: direct peers, adjacencies, and incumbents'
  body: |-
    DispatchHealth sits in a messy competitive field where the most important rivals do not all look alike. Some competitors are direct: companies that help a hospital or payer move acute care into the home. Others are adjacencies: primary-care memberships, remote-monitoring platforms, post-acute orchestration tools, or internal health-system programs that can absorb part of the same episode. The right comparison set therefore includes CareCentrix, Current Health, Amazon One Medical, Contessa’s legacy footprint, health-system internal build, and the legacy facility pathway itself.

    That framing matters because the core substitution is still brick-and-mortar utilization. Emergency departments, inpatient units, and skilled nursing pathways remain the default alternatives. The real competitive question is which vendor or operating model captures the right to redirect those episodes. DispatchHealth’s edge is that it bundles field delivery, logistics, and enterprise workflow. Its risk is that many components of the stack can be unbundled or built internally.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP010
  - CP031
  - CP032
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: peer-profiles-and-capabilities
  title: Peer profiles show different forms of overlap
  body: |-
    CareCentrix reads as a strong post-acute and site-of-care workflow competitor, but not as a mirror image of DispatchHealth’s bedside clinical model. Amazon One Medical has the opposite shape: exceptional consumer brand reach and explicit pricing, but a lower-acuity product set centered on primary care and telehealth. Current Health is more infrastructure-heavy still, with hospital-at-home enablement, monitoring, and health-system partnerships rather than a national mobile-clinician dispatch layer. Contessa’s inactive public site weakens its visibility as a live independent benchmark, though it remains a proof point that the category has seen consolidation and churn.

    Those differences mean buyers can choose between full-stack outsourced care, point solutions, or internal assembly. DispatchHealth’s post-merger scope is publicly broader than the adjacencies in this source set, especially after absorbing Medically Home’s hospital-at-home assets. But breadth alone does not decide every account; buyer preferences around reimbursement, control, and staffing can still shift deals to other models.
  claimRefs:
