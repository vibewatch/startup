- id: pricing-distribution-and-switching-costs
  title: Pricing opacity and embedded workflows shape competition
  body: |-
    Public pricing is poor across the peer set. Amazon One Medical is the rare outlier with visible membership economics. DispatchHealth publishes patient affordability and insurance language, but not broad enterprise pricing. CareCentrix and Current Health also present capability narratives rather than rate cards. That means investors should assume deal economics are bespoke and negotiated, not standardized. It also makes public price competition hard to underwrite from outside.

    Where evidence is clearer is switching cost. Once a hospital or payer integrates staffing, EMR workflows, command-center processes, clinical protocols, and reimbursement handling into a care-at-home program, the vendor is harder to displace than a simple app subscription. Multi-homing is much easier for lower-acuity front-door products than for hospital-alternative delivery. In that sense, the category rewards operating reliability more than flashy top-of-funnel marketing. Procurement also tends to favor vendors that can shoulder implementation complexity quickly and reliably.
  claimRefs:
  - CP014
  - CP015
  - CP016
  - CP017
  - CP018
  - CP019
