- id: partner-people-and-financial-risk
  title: Partner dependence amplifies both upside and downside
  body: |-
    DispatchHealth depends heavily on partners and institutional channels. Payers and health systems control referrals, covered lives, and workflow embedment, so concentration or partner dissatisfaction could hit harder than in a broad self-serve product. The leaked Medically Home reporting also matters here: merger integration can introduce hidden fragility even when the strategic story is compelling.

    The same amplification applies to people and financial risk. Headcount ambiguity obscures the real shape of the organization, while valuation opacity and missing margin data make it hard to know how much operating slack the company has. If the model requires dense local execution, then weak economics, partner concentration, and org instability can reinforce each other quickly. That is why seemingly separate issues—labor morale, payer breadth, and cash visibility—should be treated as a connected risk cluster instead of isolated boxes.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
