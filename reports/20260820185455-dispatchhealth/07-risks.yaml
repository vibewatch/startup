- id: mitigations-monitoring-and-thesis-breaks
  title: Mitigations exist, but they need measurement
  body: |-
    There are real mitigants in the file. DispatchHealth still shows active launches, named partners, a sharper 2026 strategy, published outcomes, and ACHC accreditation. Those signals argue against an immediate collapse thesis. They suggest management is trying to narrow the operating envelope to where the company can win.

    But mitigations only matter if investors can measure them. The right monitoring set is practical: launches versus exits, payer breadth, customer concentration, staffing stability, service-level quality, and evidence of margin improvement after rationalization. The risk verdict is therefore elevated but investable. The company has enough proof to justify diligence, but not enough disclosure to justify complacency. A disciplined investor should push hard on dashboards, not just narratives. That is especially true because post-merger stories can look healthy in press releases long before operating data is truly stabilized across markets and service lines over time durably yet today.
  claimRefs:
  - CR017
  - CR019
  - CR020
  - CR025
