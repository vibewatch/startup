  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: litigation-and-incidents
    missingEvidence: Claims, litigation, regulatory inquiries, serious adverse events, and quality-incident logs.
    whyItMatters: The public record is too thin to underwrite legal or patient-safety exposure conclusively.
    diligencePath: Request legal docket summary, incident log, and quality-review committee materials.
    relatedQuestionRefs:
    - QR005
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: critical
    topic: economics-and-runway
    missingEvidence: Verified revenue, burn, debt, covenant, and market-level contribution data.
    whyItMatters: Execution risk is impossible to separate from capital adequacy without private economics.
    diligencePath: Request board financial package and lender reporting.
    relatedQuestionRefs:
    - QR013
    - QR024
    relatedTableRefs:
    - TR004
    - TR005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer, payer, and market concentration exposure plus churn and renewal data.
    whyItMatters: Partner dependence could sharply raise downside if a few accounts dominate.
    diligencePath: Request top-10 account exposure and renewal schedule.
    relatedQuestionRefs:
    - QR011
    - QR024
    relatedTableRefs:
    - TR003
    - TR005
