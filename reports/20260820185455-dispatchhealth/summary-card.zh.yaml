  topStrengths:
    - 所在品类很难复制，物流、临床运营和支付方 / 医疗服务方嵌入必须同时跑通，公司战略位置不错。
    - 并购 Medically Home 后，公司拿出有意义的公开规模证据：50+ 企业客户、1.2M+ 治疗患者、覆盖 20+ 州。
    - 对医疗系统和支付方有明确企业价值，不是单纯依赖消费者需求的故事。
    - 大型医疗平台若想补全国性居家急性护理能力，公司可能具备战略买家吸引力。
  topRisks:
    - 估值不透明：可观察私有市场标记约在 $703.5M 到 $3.58B 之间，公开材料没有给出股权结构表解释。
    - 披露不透明：没有经审计的公开收入、利润率、EBITDA 或现金流分母支撑当前定价。
    - 运营很重：现场人员配置、物流、升级处置和市场密度，比软件公司更决定成败。
    - 并购后压力和竞争对手流失说明，品类有战略价值，但变现并不容易跑顺。
  unresolvedGaps:
    - 经审计的 2025 年财务，以及 2026 年 YTD 桥接。
    - 完整 2025 和 2026 年融资文件、优先权堆叠和股权结构表机制。
    - 市场层面单位经济性，以及成熟市场贡献利润率。
    - 客户集中度、续约和留存数据。
    - 临床事件、升级处置和服务水平趋势数据。
