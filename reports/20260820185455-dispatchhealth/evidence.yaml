  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Current financing ledger, post-money valuation, and any secondary trading history after the 2025 merger-related
      financing.
    whyItMatters: Public evidence does not support a precise current valuation or dilution picture.
    diligencePath: Request the cap table, latest financing docs, and board materials covering post-merger funding decisions.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: funding chronology for TO004 milestone table
    missingEvidence: Round-by-round funding table reconciling 2020, 2022, and any 2025 capital raises.
    whyItMatters: Open sources conflict on total raised and debt usage.
    diligencePath: Request a financing chronology from finance and investor-relations contacts.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Management-confirmed full-time-equivalent count by function and geography after the 2025 restructuring.
    whyItMatters: Headcount is a proxy for integration success and cost structure, but public sources diverge sharply.
    diligencePath: Request monthly headcount reports and merger-integration staffing plans.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Current board roster, committees, and observer rights.
    whyItMatters: Public materials identify executives but not the present formal governance stack.
    diligencePath: Request board materials or a governance summary from counsel.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: minor
    topic: reputation
    missingEvidence: Current first-party or third-party review surface with stable URLs.
    whyItMatters: Broken review pages make it harder to judge whether satisfaction signals are broad or curated.
    diligencePath: Pull live NPS, CSAT, complaint trend, and review-channel screenshots directly from customer-success teams.
    relatedQuestionRefs:
