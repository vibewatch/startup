  - FU002
- id: named-proof-and-customer-experience
  title: Named proof is solid across payer and provider channels
  body: |-
    The strongest public customer evidence comes from named partners. MedStar provides health-system proof, Regence provides payer proof, and Saint Francis provides a fresh 2026 hospital-at-home launch. Valley Health adds another useful window because it publishes a patient-facing workflow that shows how the service is actually experienced: symptom intake, APP plus technician visit, prescriptions, and insurance billing support. Taken together, these sources show that DispatchHealth is not selling only an abstract concept. It is being embedded into real delivery and reimbursement contexts.

    Customer experience evidence is directionally positive but uneven. The official outcomes study and repeated operating metrics suggest strong satisfaction and clinically credible service. Consumer-review surfaces are weaker and noisier. BBB and RatingFacts add some complaint color, while the company’s own review pages were unavailable during this run. That means partner references deserve more weight than generic review websites when evaluating customer quality.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU018
  - CU029
  - CU030
