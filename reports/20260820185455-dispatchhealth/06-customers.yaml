- id: durability-expansion-and-channels
  title: Durability likely sits at the account level, but the math is private
  body: |-
    Public sources do not disclose net retention, gross retention, or contract renewal rates, so customer durability cannot be measured directly. Still, the structure of the business suggests that enterprise relationships should be stickier than simple consumer app usage. Once a payer or health system integrates home-based acute care into care pathways, billing, staffing, and escalation workflows, the relationship becomes harder to replace than a casual digital-health subscription.

    Expansion also appears to be channel-driven. The 2026 strategy refinement sharpened the company around enabling health systems to scale care at home, which reads like a land-and-expand motion through institutional channels. Self-pay or direct consumer demand may still provide entry volume, but the real growth engine appears to be partner-enabled adoption. That customer architecture is attractive, but it also means channel dependence and slower enterprise sales cycles remain part of the thesis.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU020
  - CU021
  - CU022
  - CU023
  - CU027
  - CU031
  tableRefs:
  - TU005
  figureRefs:
  - FU004
- id: missing-metrics-and-verdict
  title: Good proof file, incomplete underwriting file
  body: |-
    The core customer verdict is positive. DispatchHealth has credible named references, a meaningful cumulative patient count, and a public enterprise-customer disclosure that is stronger than what many private healthcare startups provide. The partner mix also spans both sides of the market—providers and payers—which strengthens reference quality.

    The main problem is what remains missing. Investors still need account expansion rates, renewal dates, active-program counts, top-customer concentration, and market-level service consistency. The 2025 scale-backs are a reminder that not every local market may have scaled equally well. So the right diligence view is that DispatchHealth has real customer traction and strong reference quality, but the open record still stops short of proving durable cohort economics. Additional partner pages help confirm workflow depth, yet they still do not replace retention math. In practical terms, customer diligence now needs CRM-style evidence rather than more marketing collateral or cumulative patient counts.
  claimRefs:
  - CU019
  - CU024
  - CU025
  - CU026
  - CU033
  - CU034
  - CU035
  - CU036
