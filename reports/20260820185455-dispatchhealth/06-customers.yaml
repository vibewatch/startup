chapter:
  number: 6
  title: Customers
  summary: DispatchHealth appears to have credible institutional customer traction built around health systems, payers, and other partner channels rather than around pure direct-to-consumer demand. Named proofs such as MedStar, Regence, Saint Francis, and Valley Health strengthen the reference file, while the company’s 50+ enterprise-customer and 1.2M+ patients-treated disclosures demonstrate meaningful scale. The main weakness is not lack of customer proof but lack of public retention, concentration, and account-expansion data.
sections:
- id: customer-segmentation-and-scale
  title: The real customer is usually the institution, not the patient
  body: |-
    DispatchHealth serves patients directly, but the more important customer frame is institutional. Health systems, payers, and other risk-bearing entities usually control the budget, referrals, or workflow access that make the home episode possible. The patient remains the end user and care recipient, but the economic relationship is typically mediated by coverage, referral logic, or enterprise program design. That distinction matters because it means customer analysis should focus less on app downloads and more on the strength of institutional proof.

    The scale signals support that framing. DispatchHealth said at merger close that the combined company served more than 50 enterprise customers and had treated more than 1.2 million people across more than 20 states. Those are meaningful numbers for a private healthcare operator. They do not prove revenue concentration or renewal quality, but they do show that the company has moved beyond pilot-stage novelty and into a sizable installed base. That is an important threshold because healthcare buyers usually do not tolerate immature operational proofs for acute episodes at scale over time today.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU016
  - CU017
  - CU027
  - CU028
