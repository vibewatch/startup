- id: leadership-and-governance
  title: Leadership transition and post-merger governance
  body: |-
    Leadership continuity exists, but it is no longer a simple founder-CEO story. Mark Prather remains a critical figure as co-founder and executive chair, and his public comments still anchor strategic messaging around the merger and the clinical case for care at home. However, operating authority has clearly shifted to Jennifer Webster, who is now the chief executive and public face of the combined company. That shift matters because DispatchHealth is no longer just proving a care concept; it is integrating a large merger, resegmenting its go-to-market model, and trying to become an operating partner to health systems at scale.

    The next layer of governance is the post-merger bench. Erin Bartley moved from Medically Home’s COO seat into senior transformation and then president duties at DispatchHealth, while Bill Kramer, David Wilkinson, and Pippa Shulman round out a bench that blends legal, finance, operational, and clinical continuity. Public board detail is still thin, so the main diligence read is not board sophistication but management concentration: Webster, Bartley, Shulman, and Prather are the core human nodes that later chapters repeatedly depend on.
