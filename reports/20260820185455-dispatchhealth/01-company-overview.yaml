company:
  name: DispatchHealth
chapter:
  number: 1
  title: Company Overview
  summary: DispatchHealth is a Denver-founded in-home acute-care platform that merged with Medically Home in 2025 and, by 2026, is repositioning itself as a health-system enablement partner built around ER-alternative care, hospital-at-home, transitional care, and CESIA workflow software. Public operating proof is good on service breadth, enterprise traction, and repeated outcomes metrics, but weaker on current valuation, total capital raised, and true post-merger headcount. The strongest evidence supports a still-active, strategically important company that is integrating a large merger while rationalizing its footprint rather than a simple linear-growth story.
sections:
- id: identity-and-evolution
  title: Identity, founding, and service model
  body: |-
    DispatchHealth started in Denver in 2013 as a high-acuity house-call model built by emergency-care insiders who believed a large share of emergency and post-acute demand could be treated safely outside the hospital. The early company history matters because the model was never a light telehealth front end. Alta Partners, AAPA, and Becker’s all describe a business built around dispatching clinician teams into the home, using logistics and technology to recreate important emergency-department and hospital workflows at lower cost and with less friction.

    That origin still shows up in the current product definition, but the company’s language has become more enterprise-oriented. Official 2025-2026 materials now frame DispatchHealth as a complex-care-at-home platform with three core lines—ER-alternative care, hospital-alternative care, and transitional care—plus CESIA workflow software, specialty networks, mobile imaging, and mobile lab support. The result is a company that sits between direct provider, outsourced operating partner, and care-enablement infrastructure vendor. That broader identity gives later chapters room to analyze DispatchHealth not only as a care-delivery brand but as a health-system infrastructure layer.
