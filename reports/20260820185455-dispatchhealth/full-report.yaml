      - number: '3.2'
        title: Peer profiles show different forms of overlap
        blocks:
          - type: paragraph
            body: >-
              CareCentrix reads as a strong post-acute and site-of-care workflow competitor, but not as a mirror image
              of DispatchHealth’s bedside clinical model. Amazon One Medical has the opposite shape: exceptional
              consumer brand reach and explicit pricing, but a lower-acuity product set centered on primary care and
              telehealth. Current Health is more infrastructure-heavy still, with hospital-at-home enablement,
              monitoring, and health-system partnerships rather than a national mobile-clinician dispatch layer.
              Contessa’s inactive public site weakens its visibility as a live independent benchmark, though it remains
              a proof point that the category has seen consolidation and churn.


              Those differences mean buyers can choose between full-stack outsourced care, point solutions, or internal
              assembly. DispatchHealth’s post-merger scope is publicly broader than the adjacencies in this source set,
              especially after absorbing Medically Home’s hospital-at-home assets. But breadth alone does not decide
              every account; buyer preferences around reimbursement, control, and staffing can still shift deals to
              other models.
