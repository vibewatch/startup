      - number: '2.2'
        title: Policy and reimbursement structure shape the category
        blocks:
          - type: paragraph
            body: >-
              Hospital-at-home growth still depends heavily on policy architecture. CMS launched the Acute Hospital Care
              at Home initiative during the pandemic and Congress has now extended it through September 2030, which
              removes the most immediate existential policy risk for participating hospitals. The AHCAH structure
              matters because it effectively legitimizes inpatient-level care in the home by allowing hospitals to
              preserve inpatient reimbursement while meeting specific safety and staffing conditions. Public
              implementation resources emphasize two daily in-person visits, immediate remote access to care teams, and
              ongoing quality reporting.


              Even with the extension, the payment surface is uneven. CHCS documented strong Medicare participation,
              some Medicare Advantage adoption, and only limited Medicaid fee-for-service coverage across 12 states as
              of 2025. That makes the market real but still unevenly monetizable. For DispatchHealth specifically, this
              means part of the opportunity rides on federal waiver logic while another part rides on direct
              health-system and payer contracts for ER avoidance and transitional care. In other words, reimbursement is
              a layered stack, not a single national fee schedule.
