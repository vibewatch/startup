      - number: '1.4'
        title: Current status, documentation gaps, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The central diligence tension is that DispatchHealth has strong operating proof but messy public
              denominators. The company is clearly active in 2026: it is shipping a sharper B2B story, integrating
              Medically Home, promoting senior operators, and launching hospital-at-home partnerships like Saint
              Francis. Yet public headcount sources now diverge sharply. Healthcare Dive cited more than 2,200 employees
              at merger close, LeadIQ places the company in a 501-1,000 range, Unify’s visible departmental totals imply
              a workforce closer to the high hundreds, and Glassdoor’s archived profile still shows a much broader
              1,001-5,000 range. That is enough to prove restructuring, not enough to publish a clean people count.


              The clearest adverse file is the September 2025 scale-back. Home Health Care News reported one market
              exit, service retrenchment in nine others, and layoffs only months after merger close. That does not
              negate the strategic logic of the combined platform, but it does mean DispatchHealth should be treated as
              a company still rationalizing its footprint rather than one on a smooth linear expansion path. Public
              review surfaces and broken review pages add small but real documentation noise around customer and
              employee sentiment.
