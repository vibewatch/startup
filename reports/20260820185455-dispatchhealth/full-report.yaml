      - - Recommendation
        - Conditional / research-more
        - Asset quality is real, price support is not yet clean
        - Audited 2025 results plus cap-table reconciliation
        - Stay engaged, do not pre-clear price
      - - Confidence
        - Medium
        - Observable marks conflict and denominator is private
        - Better primary financial evidence
        - Avoid high-conviction sizing
      - - Risk rating
        - High
        - Execution, cap-table, and pricing opacity compound each other
        - Proof of durable market-level economics
        - Demand downside protection
      - - Valuation stance
        - Below March 2025 mark
        - Open record cannot justify paying peak observed mark today
        - Management proves premium economics and explains 2026 round
        - Anchor lower in negotiations
      - - Likely exit path
        - Strategic M&A or structured private financing
        - Private-market routing is visible; IPO readiness is not
        - Audited public-company readiness package appears
        - Model returns conservatively
    notes: This is a price-sensitive recommendation table, not a generic company-quality score.
    claimRefs:
      - CV008
      - CV009
