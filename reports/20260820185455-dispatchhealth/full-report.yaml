  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: a full-stack care-at-home operating system'
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth’s product should be read as a workflow system for moving acute and post-acute episodes out
              of facilities and into the home. In practice that means the offering is not one thing. It combines patient
              intake, clinical triage, field-staff dispatch, mobile diagnostics, home-based treatment, follow-up
              recovery workflows, and enterprise coordination for the institutions paying for or operating the program.
              The company’s official materials increasingly present this as a complex-care-at-home platform rather than
              as a house-call brand.


              That framing helps explain the module map. ER-alternative visits address the first acute encounter,
              hospital-at-home extends into higher-acuity episodes, and transitional care addresses recovery and
              readmission risk. CESIA and related workflow tooling tie those services together. Even ancillary services
              like imaging, specialty networks, and pharmacy or lab coordination matter because they reduce the number
              of times an episode has to bounce back into a facility.
