  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation range
      - Key risks
      - Probability signal
    rows:
      - - Bear reset
        - 2026 financing is directionally representative; growth and margin quality disappointed
        - $0.6B-$1.0B
        - Reset, dilution, weak unit economics
        - Meaningful if 2026 round terms are punitive
      - - Base prove-it
        - Scale is real, but opacity and execution risk still deserve a heavy discount
        - $1.5B-$2.4B
        - Cap-table surprises, concentration, margin gaps
        - Most supportable from current open evidence
      - - Bull strategic control
        - Audited results show strong density, payer quality, and durable growth
        - $3.0B-$3.8B
        - Any sign of weak economics breaks the case
        - Requires excellent private diligence
      - - Unacceptable entry
        - Buyer pays at or above the March 2025 mark without reconciling 2026 pricing
        - 3.5B+
        - Overpaying into opaque structure
        - Should be rejected on current evidence
    notes: Ranges are underwriting outputs for committee discussion, not management guidance.
