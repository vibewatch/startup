      - number: '1.3'
        title: Scale proof, financing history, and buyer traction
        blocks:
          - type: paragraph
            body: >-
              The best-supported scale facts come from merger documents and partner announcements rather than audited
              financial disclosures. DispatchHealth said at merger close that it had treated more than 1.2 million
              people, worked in more than 20 states, and supported more than 50 enterprise customers. It also repeated
              operating outcome statistics—58% ER avoidance, 8.5% 30-day readmissions, 98% satisfaction, and roughly
              $1.5 billion in medical savings—that appeared across official releases and the 2023 outcomes study. Even
              if some of those numbers are management-selected, they are directionally corroborated by the company’s
              repeated use of hospital-alternative and transitional-care workflows with named partners.


              Funding history is less clean. Fierce documented a $135.8 million Series C in 2020 led by Optum Ventures,
              while a later Medhealth Outlook write-up described a 2022 $259 million Series E plus debt financing. Home
              Health Care News later summarized total capital raised at more than $700 million. What remains weak is the
              current 2025 valuation story: alternative-data pages point to a $160 million round and a far higher
              valuation, but the accessible open-source record does not corroborate the number with the same confidence
              as the older rounds.
