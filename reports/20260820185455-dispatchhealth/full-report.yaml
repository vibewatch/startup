      - number: '4.2'
        title: Cost base is labor and logistics heavy
        blocks:
          - type: paragraph
            body: >-
              The strongest financial inference available from public sources is that DispatchHealth has a labor-heavy,
              logistics-heavy cost structure. Mobile care teams, command-center staff, routing, diagnostics, supply
              movement, and software all sit inside the same operating model. That is a very different shape from a
              telehealth marketplace or software-only workflow vendor. It explains why investors should expect
              meaningful fixed and semi-variable operating cost even if public gross margin data is absent.


              Public workforce proxies support that read while also exposing uncertainty. Growjo estimated 1,287
              employees, Unify shows a workforce mix tilted toward healthcare, engineering, and business operations, and
              Healthcare Dive cited more than 2,200 employees around the merger. The precise denominator is unclear, but
              every visible signal points toward a large service-delivery base. The 2025 layoffs and market scale-backs
