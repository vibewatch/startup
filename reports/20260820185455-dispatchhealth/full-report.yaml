      - number: '3.4'
        title: DispatchHealth has a real moat, but it is mostly operational
        blocks:
          - type: paragraph
            body: >-
              The most durable elements of DispatchHealth’s moat appear to be operational rather than purely technical.
              The company’s public file emphasizes clinical outcomes, ACHC accreditation, enterprise workflow software,
              and a logistics-heavy field model. That combination should be harder to copy than a lower-acuity digital
              benefit. It also suggests that health systems and payers may value a credible implementation partner more
              than a point feature.


              Still, the moat is not permanent. Internal hospital build remains credible, retailers could keep climbing
              up-acuity, and point-solution vendors can attack individual layers of the workflow. The market is also
              still structurally unsettled: Current Health changed hands again in 2025, Contessa’s public site went
              dark, and DispatchHealth itself scaled back in some markets after the merger. The competitive verdict is
              therefore favorable but conditional. DispatchHealth looks differentiated today, yet investors still need
              win-loss, renewal, and pricing proof before calling the moat durable. The category is fragmented enough
              that several models can coexist until operational winners separate more clearly.
            claimRefs:
