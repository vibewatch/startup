  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - 2026 financing terms look punitive
        - Cap-table docs show severe seniority, ratchets, or reset economics
        - Observed low-end mark becomes more economically real
        - Move to pass or very low bid
      - - Audited revenue underwhelms
        - 2025 or 2026 run-rate is far below what premium pricing requires
        - Bull and base cases compress rapidly
        - Re-anchor to bear case
      - - Market-level economics are weak
        - Mature markets still fail to show healthy contribution margins
        - Strategic scarcity no longer offsets operating heaviness
        - Require major discount
      - - Customer concentration is high
        - A few payer or health-system accounts dominate the book
        - Downside becomes binary rather than diversified
        - Reduce interest materially
      - - Execution stress persists
        - More layoffs, exits, or integration disruption appear
        - Peak mark looks stale rather than durable
        - Pause investment process
    notes: These are kill triggers because each one directly impairs the assumptions needed to defend even the base case.
    claimRefs:
      - CV024
