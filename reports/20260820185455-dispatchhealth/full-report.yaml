  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited 2025 financials
        - Revenue, gross margin, EBITDA, cash, and 2026 bridge
        - Needed to replace guesswork with a denominator
        - CFO diligence pack and auditor materials
      - - 2025 / 2026 financing docs
        - Stock purchase agreements, cap table, preferences, conversion rights
        - Needed to reconcile the $3.58B and $703.5M markers
        - Finance + counsel room
      - - Market-level unit economics
        - Mature versus new market contribution margins and density curves
        - Determines whether strategic premium is earned
        - Ops and FP&A workstream
      - - Customer concentration and retention
        - Top accounts, renewal schedule, churn, mix by payer and provider
        - Tests fragility of enterprise proof
        - Commercial and account analytics
      - - Clinical quality and incident trends
        - Escalations, readmissions, complaints, and incident history
        - Execution risk can cap valuation fast
        - Clinical operations and compliance review
    notes: Each ask could move the acceptable price, not just the narrative comfort level.
    claimRefs:
