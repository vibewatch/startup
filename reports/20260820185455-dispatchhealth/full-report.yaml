      - number: '8.4'
        title: 'Recommendation: conditional interest only, with hard diligence gates'
        blocks:
          - type: paragraph
            body: >-
              The valuation recommendation is straightforward. DispatchHealth looks strategically relevant enough to
              merit diligence, but not transparent enough to merit a blank-check entry price. A buyer should assume
              cap-table complexity, request the full 2025 and 2026 financing documents, and insist on audited 2025
              revenue plus current market-level unit economics before discussing any price near the March 2025 Forge
              mark. Without that package, the right stance is conditional only.


              The biggest reason to stay engaged is that the company still combines real scale, named partner logic, and
              category scarcity. The biggest reason to stay disciplined is that the open record already shows competitor
              churn, post-merger stress, and a valuation spread too wide to dismiss as noise. That combination leads to
              one answer: continue diligence, but anchor negotiations well below the 2025 high-water mark unless
              management can reconcile the 2026 financing, prove durable growth, and show that the platform deserves a
              strategic-control premium today.
