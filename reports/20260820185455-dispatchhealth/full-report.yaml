      - number: '2.4'
        title: Buyer map and adoption constraints define execution difficulty
        blocks:
          - type: paragraph
            body: >-
              The buyer map is unusually multi-sided. Health systems buy care-at-home to create capacity, keep patients
              within branded systems, and manage labor and throughput constraints. Payers and value-based entities buy
              it to reduce avoidable ER and inpatient spend. Patients and caregivers are the end users, but they are
              rarely the budget owners. That is why DispatchHealth’s 2026 strategy sharpened toward B2B enablement. The
              company wins when it fits into institutional workflows and reimbursement structures, not when it behaves
              like a stand-alone consumer app.


              The constraint side is equally important. The model requires staffing, mobile logistics, diagnostics,
              command-center tools, EMR integration, and payer alignment. Those demands create meaningful barriers to
              entry, but they also slow rollout and make the market patchier than the headline TAM suggests. Waiver
              uncertainty delayed some programs during 2025, and Medicaid adaptation remains limited. The practical
              implication is that category growth should continue, but investors should treat adoption as operationally
              staged rather than frictionless.
