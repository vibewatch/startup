  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Why it matters
      - Key evidence
      - What would change the view
    rows:
      - - Scaled strategic asset
        - 50+ enterprise customers and 1.2M+ patients mean the platform matters nationally
        - Merger-close materials and strategy update
        - If scale proves shallow or concentrated, premium falls
      - - Strategic-investor history
        - Optum-linked and payer-adjacent capital implies external belief in category importance
        - Fierce 2020 round and Regence-style partner logic
        - If strategic partners are inactive, scarcity case weakens
      - - Opaque denominator
        - No audited revenue or margin means price cannot be cleanly triangulated
        - Company pages versus public 10-K comp set
        - Audited 2025 bridge would strengthen pricing confidence
      - - Operational heaviness
        - Care delivery deserves less multiple generosity than software
        - Capabilities page plus public comp band
        - Proven mature-market margins would soften this objection
      - - Cap-structure complexity
        - 2022 debt/equity plus conflicting 2025-2026 marks can distort fair value
        - Medhealth and Forge / PitchBook
        - Full cap-table docs could explain dispersion
    notes: Rows separate pro-thesis quality from anti-thesis price discipline.
