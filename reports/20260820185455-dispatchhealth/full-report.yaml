            body: >-
              Because DispatchHealth does not publish audited financials, the public comp set matters more than it
              normally would. The available directional comps are imperfect, but they are still informative. Teladoc,
              Option Care, CVS, Humana, UnitedHealth, and Best Buy all trade at low trailing sales multiples, roughly
              0.29x to 0.77x on the sources reviewed in this run. That is not a venture-style software band. It is the
              valuation environment into which any future DispatchHealth financing, strategic sale, or IPO-like exit
              must ultimately clear.


              That does not mean DispatchHealth deserves only public-comp valuation. A scaled in-home acute-care network
              with payer and provider embedment could justify a premium for scarcity and control value. But the same
              facts that create strategic value also create operational drag: field staffing, logistics, clinical
              escalation, reimbursement complexity, and local density matter more here than in a pure software model.
              Public-company transparency deserves its own premium too. Teladoc and CVS publish audited 10-Ks.
              DispatchHealth does not. Investors therefore need a meaningful discount for missing denominator data, not
              just a generic private-company illiquidity haircut.
            claimRefs:
