  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The valuation file is real, but internally inconsistent
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth is clearly valuable enough to keep attracting capital, but the open valuation record is not
              internally clean. The strongest company-scale proof is solid: merger-close materials described a combined
              platform with more than 50 enterprise customers, more than 1.2 million patients treated, and a footprint
              spanning more than 20 states. That is real operating relevance, not a slideware asset. The problem starts
              when price enters the picture.


              Forge reported a March 2025 Series E-1 financing at a $3.58 billion post-money valuation and then an April
              2026 financing at a $703.5 million post-money valuation. PitchBook independently corroborates that
              completed financings occurred on both dates, even if it hides the economic terms. Notice contributes an
              $888.31 headline with almost no context, and Nasdaq Private Market confirms only that the company is
              private and tradable through secondary workflows. The conclusion is not that any one alternative-data page
              is correct. It is that observable price discovery is too dispersed to support blind reliance on a single
              headline mark.
