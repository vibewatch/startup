  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: complex care at home, not generic virtual care'
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth should be analyzed inside a broader complex-care-at-home market rather than inside consumer
              telehealth or conventional home health. The company’s own post-merger language makes this explicit. Its
              offering now spans ER-alternative visits, inpatient hospital-level care at home, and transitional recovery
              services, each of which substitutes for a different piece of brick-and-mortar utilization. That means the
              true economic comparison set is not “video visit versus office visit.” It is emergency department versus
              home-based acute intervention, inpatient admission versus hospital-at-home episode, and skilled nursing or
              unmanaged discharge versus coordinated recovery at home.


              That distinction matters for sizing. The category is closer to hospital operations, payer medical-loss
              management, and post-acute utilization control than to consumer app growth. Buyers care about bed
              capacity, readmissions, episode cost, and clinical confidence. Substitute pathways remain the emergency
              department, inpatient unit, skilled nursing facility, and fragmented home services. Amazon One Medical and
              similar virtual-care products are still relevant as adjacent comparison points, but they sit materially
              lower in acuity and operational complexity than DispatchHealth’s target use cases.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM020
