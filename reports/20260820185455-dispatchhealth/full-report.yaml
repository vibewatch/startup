              The public evidence supports a coherent strategic financial story even if it fails to support a clean
              model. DispatchHealth is chasing large institutional budgets, has attracted serious capital, and operates
              in a category where buyers care about avoided hospital cost and readmission pressure. Those are all
              positives for revenue quality and category durability. The model also has at least some software leverage
              through CESIA, workflow automation, and enterprise enablement.


              But the missing pieces are central to underwriting. Investors still cannot reconcile post-merger revenue,
              margin, burn, debt load, or market-level contribution economics from open sources. That makes valuation
              discipline especially important. The right financial frame is therefore neither “great software multiple”
              nor “broken services company.” It is a capital-intensive healthcare operations platform with partial
