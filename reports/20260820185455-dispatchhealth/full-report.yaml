  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, adjacencies, and incumbents'
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth sits in a messy competitive field where the most important rivals do not all look alike.
              Some competitors are direct: companies that help a hospital or payer move acute care into the home. Others
              are adjacencies: primary-care memberships, remote-monitoring platforms, post-acute orchestration tools, or
              internal health-system programs that can absorb part of the same episode. The right comparison set
              therefore includes CareCentrix, Current Health, Amazon One Medical, Contessa’s legacy footprint,
              health-system internal build, and the legacy facility pathway itself.


              That framing matters because the core substitution is still brick-and-mortar utilization. Emergency
              departments, inpatient units, and skilled nursing pathways remain the default alternatives. The real
              competitive question is which vendor or operating model captures the right to redirect those episodes.
              DispatchHealth’s edge is that it bundles field delivery, logistics, and enterprise workflow. Its risk is
              that many components of the stack can be unbundled or built internally.
            claimRefs:
