              DispatchHealth’s strongest differentiation is not that it has the slickest patient front end. It is that
              it owns more of the hard middle of the workflow than most comparators. Versus Amazon One Medical, it
              operates at higher acuity and with far more logistics and clinical complexity. Versus Current Health, it
              presents more direct bedside-delivery ownership. Versus health systems building internally, it offers a
              preassembled mix of software, workforce practices, and partner networks.


