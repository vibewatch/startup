  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The real customer is usually the institution, not the patient
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth serves patients directly, but the more important customer frame is institutional. Health
              systems, payers, and other risk-bearing entities usually control the budget, referrals, or workflow access
              that make the home episode possible. The patient remains the end user and care recipient, but the economic
              relationship is typically mediated by coverage, referral logic, or enterprise program design. That
              distinction matters because it means customer analysis should focus less on app downloads and more on the
              strength of institutional proof.


              The scale signals support that framing. DispatchHealth said at merger close that the combined company
              served more than 50 enterprise customers and had treated more than 1.2 million people across more than 20
              states. Those are meaningful numbers for a private healthcare operator. They do not prove revenue
              concentration or renewal quality, but they do show that the company has moved beyond pilot-stage novelty
              and into a sizable installed base. That is an important threshold because healthcare buyers usually do not
              tolerate immature operational proofs for acute episodes at scale over time today.
