companyProfile:
  summary: >-
    DispatchHealth is a Denver-founded in-home acute-care company established in 2013 by Mark Prather and Kevin
    Riddleberger. The company built its business around dispatching advanced-practice clinicians and support teams into
    patients' homes to treat episodes that might otherwise drive emergency-department or inpatient utilization. After
    closing its Medically Home merger in June 2025, DispatchHealth positioned itself less as a house-call brand and more
    as a scaled health-system enablement platform spanning ER-alternative care, hospital-alternative care, transitional
    care, and CESIA workflow software. Public scale proof is meaningful—50+ enterprise customers, 1.2M+ patients
    treated, and 20+ states—but valuation and financing signals remain unusually noisy.
