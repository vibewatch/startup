  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory risk is lower than in 2024, but still not solved
        blocks:
          - type: paragraph
            body: >-
              The most obvious policy overhang was the federal hospital-at-home waiver. That risk improved materially
              when lawmakers extended the AHCAH framework through 2030. In that sense, DispatchHealth no longer faces
              the same near-term cliff risk that previously shadowed the category. But the risk did not disappear; it
              shifted. Monetization still varies by state, Medicaid support is limited, and parts of DispatchHealth’s
              service mix live outside a neat single reimbursement box.


              Legal visibility is less dramatic but still incomplete. No major public litigation or enforcement issue
              was surfaced in this run, yet the public record is too thin to treat that as dispositive. Investors should
              therefore treat regulation as manageable but still material: it is no longer a binary “waiver expires”
              problem, but it remains a messy coverage, compliance, and commercial-terms problem. The company does
              publish a meaningful privacy and legal disclosure surface, but those documents mainly prove policy intent,
              not operational performance. In healthcare, that distinction matters because documented policies can
              coexist with weak field execution or uneven payer realization.
