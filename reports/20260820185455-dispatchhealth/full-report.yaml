  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: institutional episodes, not lightweight subscription'
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth’s economic model is best read as a hybrid of reimbursed care episodes and enterprise
              contracting rather than as a conventional subscription software business. The company sells into expensive
              clinical workflows: ER avoidance, hospital-at-home, and transitional recovery. Those use cases can create
              revenue through claims reimbursement, payer agreements, health-system contracts, or a blend of all three
              depending on market and program design. The consumer-facing website supports this interpretation because
              it talks about insurance coverage and affordability, not about a broad consumer membership plan.


              The July 2026 strategy reset reinforces the same point. DispatchHealth now presents itself as a
              health-system enablement partner for complex care at home. That means go-to-market is institutional and
              solution oriented. It likely requires longer sales cycles and more deployment work than a standard
              digital-health app, but it also means revenue is attached to painful budget lines that hospitals and
              payers actively want to bend.
