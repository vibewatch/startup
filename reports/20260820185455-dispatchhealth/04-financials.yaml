- id: capital-stack-and-adequacy
  title: Capital support exists, but the live balance sheet is opaque
  body: |-
    DispatchHealth has clearly attracted substantial outside capital. Fierce covered a meaningful 2020 Series C, while the 2022 financing narrative described a much larger Series E and structured debt package. That package was explicitly tied to expansion, platform development, and capability buildout. In other words, external investors have already funded the thesis that this company needs both operating scale and technical infrastructure to win.

    What the public record does not provide is a current balance-sheet bridge. There is no accessible disclosure of cash on hand, monthly burn, covenant package, current debt draw, or runway. Alternative-data providers fill the void with modeled revenue and valuation numbers, but those estimates conflict and should not be mistaken for financial statements. The sale of the imaging business to TridentCare is a useful signal of portfolio reshaping, yet it still does not answer the core question of whether the combined business is self-funding, cash consumptive, or preparing for another capital event.
