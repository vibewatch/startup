  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多个根部风险会通过运营传导，叠加到信任、利润率和估值支撑上。
    data:
      nodes:
        - id: policy
          label: 政策复杂度
          description: 豁免和支付方差异
        - id: partner
          label: 合作伙伴依赖
          description: 医疗系统和支付方渠道
        - id: ops
          label: 本地运营
          description: 人员配置、路线、升级、质量
        - id: trust
          label: 信任 / 声誉
          description: 患者、支付方和服务方信心
        - id: margin
          label: 利润率 / 密度
          description: 市场经济性和资本需求
        - id: valuation
          label: 估值支撑
          description: 进入价格纪律和下行空间
      edges:
        - from: policy
          to: partner
        - from: partner
          to: ops
        - from: ops
          to: trust
        - from: ops
          to: margin
        - from: trust
          to: valuation
        - from: margin
          to: valuation
    approximationNotes: 该图展示因果压力流，不是概率模型。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR010
      - CR013
      - CR014
      - CR016
      - CR023
      - CR025
      - CR029
      - CR035
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: DispatchHealth 需要机构渠道、照护运营和披露质量同时撑住。
    data:
      nodes:
        - id: hs
          label: 医疗系统
          description: 服务方合作伙伴和部署载体
        - id: payers
          label: 支付方 / MA
          description: 覆盖、经济性和转诊
        - id: team
          label: 临床人力
          description: 外勤交付和指挥中心
        - id: tech
          label: 工作流平台
          description: 协调、集成、派遣
        - id: ancillary
          label: 辅助合作伙伴
          description: 诊断、监测、支持
        - id: econ
          label: 单位经济性
          description: 利润率和现金跑道可行性
      edges:
        - from: hs
          to: team
        - from: payers
          to: econ
        - from: tech
          to: team
        - from: ancillary
          to: team
        - from: team
          to: econ
        - from: hs
          to: econ
    approximationNotes: 这些依赖简化为投资评估最重要的节点。
    claimRefs:
      - CR010
      - CR011
      - CR013
      - CR015
      - CR016
      - CR024
      - CR029
      - CR030
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 公司证明、价格信号和风险如何共同指向最终判断。
    data:
      nodes:
        - id: d1
          label: 规模证明
          detail: 50+ 家企业客户、1.2M+ 名患者、20+ 个州
          tone: positive
        - id: d2
          label: 战略稀缺性
          detail: 全国性居家急性照护版图很难快速重建
          tone: positive
        - id: d3
          label: 估值标记冲突
          detail: Forge 和其他私募市场界面的信号差异很大
          tone: warning
        - id: d4
          label: 披露缺口
          detail: 没有以上市公司式样披露的经审计收入、利润率或现金流记录
          tone: warning
        - id: d5
          label: 上市可比公司纪律
          detail: 可比上市公司按低销售倍数交易
          tone: warning
        - id: d6
          label: 仅有条件推进
          detail: 继续尽调，但暂不放行高进入价格
          tone: neutral
      edges:
        - from: d1
          to: d6
        - from: d2
          to: d6
        - from: d3
          to: d6
        - from: d4
          to: d6
        - from: d5
          to: d6
    approximationNotes: 这条逻辑链是尽调框架，不是公司披露的流程。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV010
      - CV013
      - CV023
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在私人公司收入分母下，假设收入倍数选取会显著放大隐含价值差异。
    data:
      items:
        - label: 收入 $1.0B、0.8x 销售倍数
          value: 0.8
          detail: 类似上市医疗公司的纪律情景
          tone: negative
        - label: 收入 $1.0B、1.8x 销售倍数
          value: 1.8
          detail: 中等私人市场溢价情景
          tone: warning
        - label: 收入 $1.0B、3.0x 销售倍数
          value: 3
          detail: 强战略溢价情景
          tone: neutral
        - label: 收入 $1.0B、3.58x 销售倍数
          value: 3.58
          detail: 粗略桥接到 2025 年 3 月 Forge 高水位标记
          tone: positive
    approximationNotes: 这是一个示意性倍数敏感性，使用 $1.0B 收入作为占位分母，因为实际当前分母未公开。
    claimRefs:
      - CV013
      - CV021
      - CV027
      - CV028
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持的估值区间很宽，但仍具备可投资性。
    data:
      items:
        - label: 悲观情景
          low: 0.6
          mid: 0.8
          high: 1
          displayValue: $0.6B-$1.0B
          detail: 重置和低倍数情景
          tone: negative
        - label: 基准情景
          low: 1.5
          mid: 1.9
          high: 2.4
          displayValue: $1.5B-$2.4B
          detail: 有战略重要性，但需要大幅折价
          tone: warning
        - label: 乐观情景
          low: 3
          mid: 3.4
          high: 3.8
          displayValue: $3.0B-$3.8B
          detail: 只有私人证明强、条款干净时才成立
          tone: positive
    approximationNotes: 区间是投资评估输出，不是观察到的市场价格或公司指引。
    claimRefs:
      - CV004
      - CV005
      - CV026
      - CV027
      - CV028
      - CV029
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 该资产在战略重要性上得分高，证据质量和价格支撑较弱。
    data:
      items:
        - label: 市场贴合度
          score: 8
          detail: 全国性居家复杂照护版图有意义
          tone: positive
        - label: 客户证明
          score: 8
          detail: 企业规模和具名合作伙伴逻辑可信
          tone: positive
        - label: 战略稀缺性
          score: 7
          detail: 比纯数字服务更难重建的资产
          tone: positive
        - label: 经济性可见度
          score: 3
          detail: 没有经审计的公开分母
          tone: warning
        - label: 股权结构表清晰度
          score: 2
          detail: 2025 和 2026 年价格分歧尚未解决
          tone: warning
        - label: 执行风险
          score: 4
          detail: 运营重、并购后压力仍然显著
          tone: warning
        - label: 估值支撑
          score: 4
          detail: 当前证据支持谨慎，而不是按峰值价格买入
          tone: warning
    approximationNotes: 分数综合了本章证据，不是公司提供的 KPI。
    claimRefs:
      - CV001
      - CV010
      - CV021
      - CV024
      - CV033
      - CV039
      - CV040
