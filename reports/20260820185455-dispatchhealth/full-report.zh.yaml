        title: DispatchHealth 有真实护城河，但主要是运营型
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 护城河中最耐久的部分看起来是运营能力，而非纯技术。公司的公开文件强调临床结果、ACHC
              认证、企业工作流软件，以及物流很重的现场模式。这种组合应比低急性度数字福利更难复制。它也说明，医疗系统和支付方可能更看重可信的实施伙伴，而不只是某个单点功能。


              但护城河并非永久。医院内部自建仍然可信，零售商可能继续向更高急性度爬升，点解决方案供应商也能攻击工作流的单个层。市场结构本身也还未稳定：Current Health 在 2025 年再次易手，Contessa
              公开网站变暗，DispatchHealth 自己也在合并后收缩了一些市场。因此，竞争结论是有利但有条件。DispatchHealth 今天看起来有差异化，但投资者在把护城河称为耐久之前，仍需要赢单 /
              输单、续约和定价证明。这个品类足够分散，多个模式可以共存，直到运营赢家更清晰地拉开距离。
