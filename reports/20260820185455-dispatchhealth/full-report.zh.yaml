      - number: '1.3'
        title: 规模证明、融资历史与买方牵引
        blocks:
          - type: paragraph
            body: >-
              最有支撑的规模事实来自合并文件和合作伙伴公告，而不是经审计的财务披露。DispatchHealth 在合并完成时称，公司已服务超过 1.2 million 人，在 20+ 个州运营，并支持 50+
              家企业客户。公司还反复披露运营结果数据——58% 急诊规避率、8.5% 的 30 天再入院率、98% 满意度，以及大约 $1.5 billion 的医疗节省——这些数据出现在官方新闻稿和 2023
              年结果研究中。即便其中一部分数字由管理层筛选，它们也被公司与具名伙伴反复使用住院替代和过渡护理工作流这一事实方向性佐证。


              融资历史没那么干净。Fierce 记录了 2020 年由 Optum Ventures 领投的 $135.8 million Series C；后来的 Medhealth Outlook 文章描述了 2022 年
              $259 million 的 Series E 加债务融资。Home Health Care News 随后将累计融资概括为超过 $700 million。薄弱之处仍是当前 2025
              年估值故事：另类数据页面指向一轮 $160 million 融资和更高得多的估值，但可访问的公开来源没有像更早轮次那样以同等置信度佐证这个数字。
