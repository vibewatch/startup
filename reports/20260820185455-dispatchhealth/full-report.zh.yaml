companyProfile:
  summary: >-
    DispatchHealth 是一家在 Denver 创立的居家急症护理公司，Mark Prather 与 Kevin Riddleberger 于 2013
    年创办。公司一开始就围绕一个模式搭建业务：派遣高级执业临床人员和支持团队到患者家中，处理原本可能流向急诊科或住院部的病程。2025 年 6 月完成与 Medically Home 的合并后，DispatchHealth
    不再只把自己定位成上门出诊品牌，而是转向规模化医疗系统赋能平台，覆盖急诊替代护理、住院替代护理、过渡护理和 CESIA 工作流软件。公开规模证明有分量——50+ 家企业客户、1.2M+ 名已服务患者、20+
    个州——但估值和融资信号仍异常嘈杂。
