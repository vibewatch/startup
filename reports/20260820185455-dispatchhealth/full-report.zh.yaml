      - number: '3.2'
        title: 同业画像显示不同形式的重叠
        blocks:
          - type: paragraph
            body: >-
              CareCentrix 更像强势的急性期后与服务地点工作流竞争者，但不是 DispatchHealth 床旁临床模式的镜像。Amazon One Medical
              形态相反：消费者品牌触达极强，定价明确，但产品急性度更低，集中在初级保健和远程医疗。Current Health
              更偏基础设施，提供居家住院赋能、监测和医疗系统合作，而不是全国性的移动临床人员派遣层。Contessa 的公开网站不活跃，削弱了它作为活跃独立标杆的可见度，但它仍能证明这个品类已经经历过整合和流失。


              这些差异意味着买方可以在全栈外包护理、点解决方案和内部拼装之间选择。并购 Medically Home 的居家住院资产后，DispatchHealth
              合并后的公开范围比这组来源中的相邻玩家更宽。但广度本身并不能决定每个账户；买方围绕报销、控制权和人员配置的偏好，仍可能把交易推向其他模式。
