      - number: '8.2'
        title: 公开可比公司迫使倍数框架收紧
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 不发布经审计财务，因此公开可比公司集合比平时更重要。可用的方向性可比公司并不完美，但仍有信息量。Teladoc、Option Care、CVS、Humana、UnitedHealth
              和 Best Buy 的过去销售额倍数都偏低，本轮所审来源大约在 0.29x 到 0.77x 之间。这不是风险软件倍数带。未来 DispatchHealth 无论融资、战略出售，还是类似 IPO
              的退出，最终都要在这个估值环境里过关。


              这并不意味着 DispatchHealth
              只配公开可比估值。一个规模化的居家急症护理网络，如果嵌入支付方和服务提供方，可能因稀缺性和控制价值获得溢价。但创造战略价值的同一批事实，也带来运营拖累：现场人员配置、物流、临床升级、报销复杂度和本地密度，在这里比纯软件模型更重要。上市公司透明度也应有自己的溢价。Teladoc
              和 CVS 发布经审计的 10-K。DispatchHealth 没有。因此，投资者需要为缺失分母数据打上有意义折价，而不只是套一个泛泛的私人公司流动性折扣。
