      - number: '2.2'
        title: 政策和报销结构塑造品类
        blocks:
          - type: paragraph
            body: >-
              居家住院的增长仍高度依赖政策架构。CMS 在疫情期间推出 Acute Hospital Care at Home 计划，国会现在已将其延长至 2030 年 9
              月，为参与医院移除了最迫近的生存性政策风险。AHCAH
              结构重要，因为它让医院在满足特定安全和人员条件的同时保留住院报销，从而实质上认可在家中提供住院级护理。公开实施资源强调每天两次面对面到访、可即时远程接入护理团队，以及持续质量报告。


              即便延期落地，支付界面仍不平整。CHCS 记录到，截至 2025 年，Medicare 参与度强，一些 Medicare Advantage 开始采用，但 12 个州的 Medicaid
              按服务收费覆盖仍然有限。这让市场真实存在，却仍难以均匀变现。对 DispatchHealth
              而言，这意味着一部分机会依赖联邦豁免逻辑，另一部分依赖针对急诊规避和过渡护理的医疗系统与支付方直接合同。换句话说，报销是一层叠一层的堆栈，不是一张全国统一收费表。
