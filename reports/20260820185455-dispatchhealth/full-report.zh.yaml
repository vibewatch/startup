      - number: '6.2'
        title: 具名证明在支付方和提供方渠道都扎实
        blocks:
          - type: paragraph
            body: >-
              最强的公开客户证据来自具名伙伴。MedStar 提供医疗系统证明，Regence 提供支付方证明，Saint Francis 提供 2026 年新启动的居家住院项目。Valley Health
              又提供了一个有用窗口，因为它发布了面向患者的工作流，展示服务如何被实际体验：症状接入、APP 加技术员上门、开具处方和保险计费支持。合在一起，这些来源说明 DispatchHealth
              卖的不是抽象概念；它正被嵌入真实的交付和报销场景。


              客户体验证据方向为正，但不均匀。官方结果研究和反复出现的运营指标暗示满意度强、服务具备临床可信度。消费者评论界面更弱、更嘈杂。BBB 和 RatingFacts
              提供了一些投诉色彩，而公司自己的评论页面在本轮运行时不可用。因此，评估客户质量时，合作伙伴推荐应比泛化评论网站权重更高。
