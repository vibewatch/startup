      - number: '7.2'
        title: 运营可靠性是核心执行风险
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 不是低摩擦数字产品。它是一门现场与工作流业务，质量取决于人员密度、派遣可靠性、诊断可及性、升级纪律和本地市场效率。这让运营成为核心风险轴。2025
              年收缩和裁员是最清晰的公开警告：整合和市场密度不会自动在每个地方奏效。


              质量和声誉需要放在这个镜头下解读。正面的结果指标和 ACHC
              认证是有意义的缓释项，但不能消除本地执行失败风险。消费者投诉页面、存档评论片段和失效的公开评论端点都是嘈杂证据，不足以杀死投资逻辑。它们真正重要之处在于提醒投资者：即便顶层品类故事仍有吸引力，服务质量不均或公开证明界面薄弱，也会侵蚀信任。如果服务质量只在少数市场下滑，声誉影响仍可能传导到支付方和服务提供方关系中。
