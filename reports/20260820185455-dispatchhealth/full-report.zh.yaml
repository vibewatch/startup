            body: >-
              DispatchHealth 高度依赖伙伴和机构渠道。支付方和医疗系统控制转诊、覆盖人群和工作流嵌入，因此集中度或伙伴不满带来的打击，可能比宽泛自助式产品更重。泄露的 Medically Home
              报道在这里也重要：即便战略故事有吸引力，合并整合仍可能引入隐藏脆弱性。


              同样的放大效应也适用于人员和财务风险。员工数模糊遮住了组织的真实形态；估值不透明和利润率数据缺失，又让外部难以判断公司有多少运营缓冲。如果模型需要密集本地执行，那么薄弱经济性、伙伴集中和组织不稳定会迅速相互强化。因此，看似分开的议题——劳动力士气、支付方广度和现金可见度——应被视为一个相连的风险簇，而不是孤立方框。
