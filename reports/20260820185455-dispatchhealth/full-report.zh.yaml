      - number: '6.3'
        title: 耐久性可能在账户层，但数学仍是私有信息
        blocks:
          - type: paragraph
            body: >-
              公开来源不披露净留存、总留存或合同续约率，所以客户耐久性无法直接测量。不过，业务结构显示，企业关系应比简单消费者应用使用更有粘性。支付方或医疗系统一旦把居家急症护理整合进护理路径、计费、人员配置和升级工作流，这段关系就比随手可取消的数字健康订阅更难替换。


              扩张似乎也由渠道驱动。2026
              年策略细化把公司更清晰地定位在赋能医疗系统规模化居家护理上，看起来像通过机构渠道落地再扩张。自费或直接消费者需求仍可能贡献入口量，但真正增长引擎似乎是伙伴赋能的采用。这个客户架构有吸引力，但也意味着渠道依赖和更慢的企业销售周期仍是投资逻辑的一部分。
