      - number: '1.4'
        title: 当前状态、文件缺口与反向信号
        blocks:
          - type: paragraph
            body: >-
              核心尽调张力在于，DispatchHealth 有强运营证明，却缺少干净的公开分母。公司在 2026 年显然仍很活跃：它在推出更清晰的 B2B 叙事，整合 Medically Home，提拔高级运营人员，并启动
              Saint Francis 这类居家住院合作。但公开员工数来源已经严重分叉。Healthcare Dive 在合并完成时引用超过 2,200 名员工；LeadIQ 将公司放在 501-1,000 区间；Unify
              可见的部门合计暗示员工数更接近数百人的高端；Glassdoor 的存档资料仍显示更宽的 1,001-5,000 区间。这足以证明公司在重组，却不足以发布一个干净的人数口径。


              最清晰的反向文件是 2025 年 9 月的收缩。Home Health Care News 报道称，公司退出一个市场，在另九个市场收缩服务，并在合并完成仅数月后裁员。这并不否定合并平台的战略逻辑，但意味着
              DispatchHealth 应被视为一家仍在理顺覆盖足迹的公司，而不是沿着平滑线性扩张路径前进的公司。公开评论界面和失效的评论页面，也给客户与员工情绪增加了小但真实的文件噪音。
