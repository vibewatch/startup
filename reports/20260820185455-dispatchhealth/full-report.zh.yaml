      - number: '6.4'
        title: 证明文件好，承销文件不完整
        blocks:
          - type: paragraph
            body: >-
              核心客户结论为正。DispatchHealth 有可信的具名参考、有意义的累计患者数，也有比许多私人医疗创业公司更强的公开企业客户披露。伙伴组合还横跨市场两侧——服务提供方和支付方——增强了参考质量。


              主要问题在于缺失项。投资者仍需要账户扩张率、续约日期、活跃项目数量、头部客户集中度和市场级服务一致性。2025
              年收缩提醒我们，不是每个本地市场都同样顺利地规模化。因此，正确尽调视角是：DispatchHealth
              有真实客户牵引和强参考质量，但公开记录仍不足以证明耐久队列经济性。更多伙伴页面能帮助确认工作流深度，却不能替代留存数学。实际操作上，客户尽调现在需要 CRM 式证据，而不是更多营销材料或累计患者数。
