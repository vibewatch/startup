      - number: '4.4'
        title: 财务结论：战略上有资本背书，数字上披露不足
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个连贯的战略财务故事，即便它撑不起一个干净模型。DispatchHealth
              追逐大型机构预算，吸引过严肃资本，所在品类的买方关心可避免住院成本和再入院压力。这些都利好收入质量和品类耐久性。CESIA、工作流自动化和企业赋能，也让模型至少拥有部分软件杠杆。


              但缺失项正是承销核心。投资者仍无法从公开来源调和合并后收入、利润率、烧钱速度、债务负担或市场级贡献经济性。这让估值纪律尤其重要。因此，正确财务框架既不是“优秀软件倍数”，也不是“坏掉的服务公司”。它是一家资本密集型医疗运营平台，带有部分软件杠杆和重大披露缺口；在给出激进价格之前，这些缺口必须补上。即便是相邻上市公司的文件也提示，当支付方组合或客户形态变化时，居家护理预测可能迅速走弱。
