        title: 成本基底重在劳动力和物流
        blocks:
          - type: paragraph
            body: >-
              公开来源能支持的最强财务推断是，DispatchHealth
              的成本结构很重，劳动力和物流占比高。移动护理团队、指挥中心人员、路线调度、诊断、物资流转和软件都在同一运营模型内。这与远程医疗市场或纯软件工作流供应商的形态非常不同。即便没有公开毛利率数据，它也解释了为什么投资者应预期公司有相当固定和半可变运营成本。


              公开劳动力代理指标支持这个判断，同时也暴露不确定性。Growjo 估计员工 1,287 人；Unify 显示员工组合偏向医疗、工程和业务运营；Healthcare Dive 在合并前后引用超过 2,200
              名员工。精确分母不清楚，但每个可见信号都指向庞大的服务交付基底。2025 年裁员和市场收缩进一步说明，管理层在主动调整足迹和生产率，而不只是单纯增加容量。
