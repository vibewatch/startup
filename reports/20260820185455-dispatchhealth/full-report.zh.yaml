  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 标记
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Forge 2025 年 3 月轮次
        - 投后估值
        - $106.88M Series E-1 轮对应 $3.58B
        - 最好的可观察私有高水位估值
        - 另类数据和证券层级背景不完整
      - - Forge 2026 年 4 月轮次
        - 投后估值
        - $97.71M Series A-1 轮对应 $703.5M
        - 最好的可观察低端私有标记
        - 可能反映特定结构定价
      - - Teladoc
        - 上市公司 P/S
        - 0.48x 销售收入
        - 承压数字健康底部
        - 模式不同，且公开市场承压
      - - Option Care
        - 上市公司 P/S
        - 0.62x 销售收入
        - 最接近的居家护理相邻标的
        - 仍不等同于居家医院
      - - CVS / Humana / UNH
        - 上市公司 P/S 区间
        - 0.29x-0.77x 销售收入
        - 战略买家纪律区间
        - 综合集团业务组合削弱直接可比性
      - - Best Buy
        - 上市公司 P/S
        - 0.44x 销售收入
        - Current Health 持有 / 退出类比
        - 零售业务主导估值
    notes: 枚举聚焦最影响决策的私有标记和公开可比公司。
