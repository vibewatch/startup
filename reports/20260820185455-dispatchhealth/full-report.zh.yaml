  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管风险低于 2024 年，但仍未解决
        blocks:
          - type: paragraph
            body: >-
              最明显的政策阴影是联邦居家住院豁免。立法者将 AHCAH 框架延长至 2030 年后，这一风险明显改善。从这个意义上说，DispatchHealth
              不再面对此前笼罩品类的近端悬崖风险。但风险没有消失，只是转移了。变现仍按州变化，Medicaid 支持有限，DispatchHealth 的部分服务组合也不在一个整齐的单一报销框里。


              法律可见度没那么戏剧化，但仍不完整。本轮没有浮现重大公开诉讼或执法问题，但公开记录太薄，不能据此下定论。因此，投资者应把监管视为可管理但仍重要：它不再是二元的“豁免到期”问题，而是杂乱的覆盖、合规和商业条款问题。公司确实发布了有意义的隐私和法律披露界面，但这些文件主要证明政策意图，而不是运营表现。在医疗行业，这个区别重要，因为成文政策可以与薄弱现场执行或不均匀的支付方兑现并存。
