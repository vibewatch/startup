  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 真正客户通常是机构，而不是患者
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth
              直接服务患者，但更重要的客户框架是机构。医疗系统、支付方和其他承担风险的实体，通常控制预算、转诊或工作流入口，决定居家病程能否发生。患者仍是最终用户和护理接受者，但经济关系通常由保险覆盖、转诊逻辑或企业项目设计中介。这个区别重要，因为客户分析应少看应用下载，多看机构证明的强度。


              规模信号支持这个框架。DispatchHealth 在合并完成时称，合并后公司服务 50+ 家企业客户，并在 20+ 个州服务超过 1.2 million
              人。对一家私人医疗运营商来说，这些数字有意义。它们不能证明收入集中度或续约质量，但能说明公司已经越过试点新奇阶段，进入相当规模的已安装基础。这个门槛重要，因为如今医疗买方通常不会长期容忍急性病程规模化时不成熟的运营证明。
