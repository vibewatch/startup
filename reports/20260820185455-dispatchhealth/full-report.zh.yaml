            body: >-
              区间工作应被框定为承销，而不是虚假精确。2025 年 3 月 Forge 标记足够新、也足够大，不能忽视；它告诉我们，当时有可信投资者愿意在 mid-$3 billions 附近为公司提供资金。2026 年 4
              月 Forge 数据点也足够低、足够近，不能忽视；它告诉我们，2026 年的证券、股权结构表或业绩弧线中，有某些东西显著改变了可观察价格。可投资问题就夹在两者之间。


              悲观情景是重置故事：投资者把 DispatchHealth 当作难以规模化的护理交付运营商，锚定接近 2026 年可观察低谷，得到大约 $0.6-1.0
              billion。基准情景假设平台具备战略重要性且仍在增长，但不透明度和执行风险使其相对 2025 年标记需要大幅折价，对应约 $1.5-2.4 billion。乐观情景需要经审计证明增长、密度和支付方质量在
              2025-2026 年仍然强劲，才可支撑类似 $3.0-3.8 billion 的估值。换句话说，只有尽调补上缺口，过去高点才站得住；在此之前不成立。
