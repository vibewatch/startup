      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计的 2025 财务数据
        - 收入、毛利率、EBITDA、现金和 2026 桥接表
        - 需要用明确分母替代猜测
        - CFO 尽调材料包和审计师材料
      - - 2025 / 2026 融资文件
        - 股份购买协议、股权结构表、优先权、转换权
        - 需要对齐 $3.58B 与 $703.5M 两个标记
        - 财务 + 法务资料室
      - - 市场层面单位经济性
        - 成熟市场与新市场的贡献利润率和密度曲线
        - 决定战略溢价是否成立
        - 运营和 FP&A 工作流
      - - 客户集中度和留存
        - 头部账户、续约排期、流失、按付款方和服务方拆分的组合
        - 检验企业客户验证的脆弱性
        - 商务和账户分析
      - - 临床质量和事件趋势
        - 升级处理、再入院、投诉和事件历史
        - 执行风险会迅速压住估值
        - 临床运营和合规审查
    notes: 每项问题都可能改变可接受价格，而不只是提高叙事上的安心程度。
    claimRefs:
