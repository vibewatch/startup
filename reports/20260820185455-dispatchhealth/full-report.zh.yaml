            body: >-
              DispatchHealth 最强的差异化，不在于它有最顺滑的患者前端，而在于它掌握了多数对照方缺失的工作流硬中段。相较 Amazon One Medical，它处理更高急性度，物流和临床复杂度也高得多。相较
