  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式：机构病程，而非轻量订阅
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth
              的经济模型更像报销护理病程与企业合同的混合体，而不是传统订阅软件业务。公司卖进昂贵的临床工作流：急诊规避、居家住院和过渡恢复。这些用例可以靠理赔报销、支付方协议、医疗系统合同或三者混合产生收入，具体取决于市场和项目设计。面向消费者的网站也支持这一解读，因为它谈的是保险覆盖和可负担性，而不是广泛消费者会员计划。


              2026 年 7 月的策略重置强化了同一点。DispatchHealth
              现在把自己描述为居家复杂护理的医疗系统赋能伙伴。这意味着商业化路径是机构化、解决方案导向的。它可能比标准数字健康应用需要更长销售周期和更多部署工作，但也意味着收入挂在医院和支付方主动想压弯的痛苦预算线上。
