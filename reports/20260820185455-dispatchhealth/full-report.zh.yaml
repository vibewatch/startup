chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与服务模式
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 2013 年起步于
              Denver，最初是一个高急性度上门出诊模式，由熟悉急诊护理的人搭建。他们判断，大量急诊和急性期后需求可以安全地在医院外处理。早期历史很关键，因为这个模式从来不是轻量远程医疗前端。Alta
              Partners、AAPA 和 Becker’s 都把它描述成一门派遣临床团队入户的业务：用物流和技术把急诊科与医院里的关键工作流搬到家中，以更低成本、更少摩擦完成护理。


              这个起点仍能从当前产品定义中看出来，但公司的表述已经更偏企业端。2025-2026 年的官方材料把 DispatchHealth
              定义为居家复杂护理平台，核心有三条线——急诊替代护理、住院替代护理和过渡护理——再加上 CESIA
              工作流软件、专科网络、移动影像和移动实验室支持。最终形成的公司介于直接医疗服务提供方、外包运营伙伴和护理赋能基础设施供应商之间。这个更宽的身份让后文不仅可以把 DispatchHealth
              作为护理交付品牌分析，也可以把它当作医疗系统基础设施层来分析。
