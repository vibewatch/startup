  - id: TV005
    title: 投资逻辑破裂和终止触发条件表
    columns:
      - 触发条件
      - 阈值
      - 对投资逻辑的影响
      - 行动含义
    rows:
      - - 2026 融资条款看起来惩罚性很强
        - 股权结构文件显示严重的优先级、反稀释棘轮或重置经济条款
        - 观察到的低端标记在经济上更坐实
        - 转为放弃，或只给极低报价
      - - 经审计收入不及预期
        - 2025 或 2026 收入运行率远低于高价所需水平
        - 乐观和基准情景迅速压缩
        - 重新锚定悲观情景
      - - 市场层面经济性偏弱
        - 成熟市场仍未显示健康的贡献利润率
        - 战略稀缺性不再抵消沉重运营负担
        - 要求大幅折价
      - - 客户集中度高
        - 少数付款方或医疗系统账户主导收入账本
        - 下行情景从分散风险变成二元结果
        - 显著降低兴趣
      - - 执行压力持续
        - 更多裁员、离职或整合扰动出现
        - 峰值估值看起来过时，而非稳固
        - 暂停投资流程
    notes: 这些都是否决触发项，因为每一项都会直接损伤支撑基准情景所需的假设。
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV035
