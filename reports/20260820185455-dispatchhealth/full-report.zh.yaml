            body: >-
              文件中确实有真实缓释项。DispatchHealth 仍有活跃上线、具名伙伴、更清晰的 2026 年策略、已发布结果和 ACHC
              认证。这些信号不支持立即崩塌的投资逻辑。它们说明管理层正试图把运营边界收窄到公司能赢的地方。


              但缓释项只有能被测量时才有意义。正确监控集合很务实：上线 vs.
              退出、支付方广度、客户集中度、人员稳定性、服务水平质量，以及合理化后利润率改善的证据。因此，风险结论是升高但仍可投资。公司有足够证明支撑继续尽调，但披露不足以支撑自满。纪律严明的投资者应强推仪表盘，而不只是听叙事。合并后故事尤其如此：新闻稿里看起来健康，往往早于运营数据真正在各市场和服务线稳定下来。
