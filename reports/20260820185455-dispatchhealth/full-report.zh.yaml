            body: >-
              DispatchHealth 显然吸引过大量外部资本。Fierce 报道了 2020 年一轮有分量的 Series C；2022 年融资叙事则描述了规模更大的 Series E
              和结构化债务包。该融资包明确用于扩张、平台开发和能力建设。换句话说，外部投资者已经为一个判断买单：这家公司要赢，既需要运营规模，也需要技术基础设施。


              公开记录没有提供的是当前资产负债表桥接。现金余额、月度烧钱速度、契约包、当前债务提取或现金跑道，都没有可访问披露。另类数据提供商用模型化收入和估值数字填补空白，但这些估计互相冲突，不应被误当成财务报表。将影像业务出售给
              TridentCare 是投资组合重塑的有用信号，但仍没有回答核心问题：合并后业务是自我供血、消耗现金，还是在准备下一次资本事件。
