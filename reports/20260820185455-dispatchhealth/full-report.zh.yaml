              路线图似乎也在继续向这个方向走。2026
              年策略更新把重点转向帮助医疗系统规模化居家复杂护理，这意味着更深嵌入、联合品牌部署和更好的编排，而不是转向自助式消费者增长。剥离影像业务也符合这样的产品组合：只要整体工作流仍能撑住，公司可以重新平衡哪些资产层自有、哪些交给伙伴。历史应用发布材料也说明，公司已逐步弱化消费者应用在产品叙事中的中心地位。
