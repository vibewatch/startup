  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值文件真实存在，但内部不一致
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth 显然有足够价值继续吸引资本，但公开估值记录内部并不干净。最强的公司规模证明是扎实的：合并完成材料描述了一个合并平台，拥有 50+ 家企业客户、服务超过 1.2 million
              名患者，足迹覆盖 20+ 个州。这是真实运营相关性，不是幻灯片资产。问题从价格进入画面时开始。


              Forge 报道称，2025 年 3 月 Series E-1 融资的投后估值为 $3.58 billion，随后 2026 年 4 月融资的投后估值为 $703.5 million。PitchBook
              独立佐证了两个日期确有已完成融资，即便它隐藏了经济条款。Notice 给出 $888.31 的标题数字，却几乎没有上下文；Nasdaq Private Market
              只确认公司为私人公司，并可通过二级市场工作流交易。结论不是某个另类数据页面一定正确，而是可观察价格发现过于分散，不能盲目依赖单一标题标记。
