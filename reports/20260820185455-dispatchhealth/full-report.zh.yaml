      - number: '2.3'
        title: 规模测算口径很宽；需求驱动真实存在
        blocks:
          - type: paragraph
            body: >-
              已发布的市场估算方向一致，但量级差异很大。Mordor 预计 2026 年居家住院市场超过 $42 billion；Insight Partners 使用高三百亿美元量级的基线；DispatchHealth
              自己的合并推介引用了 Chilmark 更宽的 $300 billion
              数字。投资者不应平均这些数字。它们捕捉的是不同地域、服务定义和时间范围。它们真正说明的是，只要居家护理报销、物流和人员配置能撑住，这个品类已经大到值得关注。


              市场论点更强的部分不是精确 TAM
              数字，而是背后的需求逻辑。人口老龄化、患者偏好居家护理、床位容量压力和再入院经济性都支持这一模式。同行评审综述进一步增加了实质性证据：与传统住院相比，成本更低、并发症更少，结果经常更好或相当。这些事实支持品类方向为正，哪怕仅凭公开信息还无法精确测算
              DispatchHealth 在该品类中的份额。
