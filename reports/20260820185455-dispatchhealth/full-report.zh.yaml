  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、相邻玩家与既有路径
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth
              所处的竞争场很杂，最重要的对手并不长得一样。有些竞争者是直接同业：帮助医院或支付方把急症护理搬进家庭的公司。另一些是相邻玩家：初级保健会员制、远程监测平台、急性期后编排工具，或能吸收同一病程一部分需求的医疗系统内部项目。因此，正确对照组应包括
              CareCentrix、Current Health、Amazon One Medical、Contessa 的历史业务版图、医疗系统内部自建，以及传统机构路径本身。


              这个框架重要，因为核心替代对象仍是实体医疗使用。急诊科、住院部和专业护理路径仍是默认替代方案。真正的竞争问题在于，哪个供应商或运营模式能拿到重定向这些病程的权利。DispatchHealth
              的优势是把现场交付、物流和企业工作流打包在一起。它的风险在于，技术栈中的许多组件可以被拆开，或由客户内部自建。
