      - number: '3.3'
        title: 定价不透明和嵌入式工作流塑造竞争
        blocks:
          - type: paragraph
            body: >-
              同业集合里，公开定价普遍很差。Amazon One Medical 是少见例外，能看到会员经济性。DispatchHealth 披露患者可负担性和保险表述，但不披露广泛企业定价。CareCentrix 和
              Current Health 也呈现能力叙事，而不是费率表。这意味着投资者应假设交易经济性是定制且谈判出来的，而非标准化价格。也因此，外部很难承销公开价格竞争。


              证据更清晰的地方是切换成本。医院或支付方一旦把人员配置、EMR
              工作流、指挥中心流程、临床协议和报销处理整合进居家护理项目，供应商就比简单应用订阅更难被替换。低急性度前门产品更容易多供应商并用；住院替代交付则难得多。从这个意义上说，这个品类奖励的是运营可靠性，而不是花哨的漏斗顶端营销。采购也往往偏好能快速、可靠扛起实施复杂度的供应商。
