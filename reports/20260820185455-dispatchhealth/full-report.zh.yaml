  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义：全栈居家护理操作系统
        blocks:
          - type: paragraph
            body: >-
              DispatchHealth
              的产品应被看成一个工作流系统，用来把急症和急性期后病程从医疗机构转移到家中。实际操作中，这不是单一产品。它把患者接入、临床分诊、现场人员派遣、移动诊断、居家治疗、后续恢复工作流，以及为付费或运营项目的机构提供的企业协调结合在一起。公司官方材料也越来越多把它呈现为居家复杂护理平台，而不是上门出诊品牌。


              这个框架有助于解释模块地图。急诊替代上门处理第一次急性接触；居家住院延伸到更高急性度病程；过渡护理处理恢复和再入院风险。CESIA
              及相关工作流工具把这些服务连在一起。影像、专科网络、药房或实验室协调等辅助服务也很重要，因为它们减少了一个病程被迫弹回医疗机构的次数。
