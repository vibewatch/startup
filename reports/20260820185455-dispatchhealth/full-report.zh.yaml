        - 可观察估值相互冲突，分母仍是私有数据
        - 更好的第一手财务证据
        - 避免高信念仓位
      - - 风险评级
        - 高
        - 执行、股权结构表和定价不透明相互叠加
        - 证明市场级经济性可持续
        - 要求下行保护
      - - 估值立场
        - 低于 2025 年 3 月估值
        - 公开记录无法支撑今天按可观察峰值估值支付
        - 管理层证明溢价经济性，并解释 2026 年融资
        - 谈判中锚定更低价格
      - - 可能退出路径
        - 战略并购或结构化私募融资
        - 私募市场路径可见，IPO 准备度不可见
        - 出现经审计的上市公司准备材料包
        - 保守建模回报
    notes: 这张建议表对价格敏感，不是泛泛的公司质量评分。
    claimRefs:
      - CV008
      - CV009
      - CV030
      - CV031
      - CV032
      - CV034
      - CV038
      - CV039
      - CV040
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 关键证据
      - 视角改变因素
    rows:
      - - 具备规模的战略资产
        - 50+ 家企业客户和 1.2M+ 名患者说明平台已有全国意义
        - 并购交割材料和战略更新
        - 如果规模被证明偏浅或过于集中，溢价会下降
      - - 战略投资者历史
        - 与 Optum 相关、靠近支付方的资本，说明外部相信该品类重要
        - Fierce 2020 年融资和 Regence 式合作伙伴逻辑
        - 如果战略伙伴并不活跃，稀缺性论点会变弱
      - - 分母不透明
        - 没有经审计收入或利润率，价格就无法干净三角验证
        - 公司页面对照公开 10-K 可比公司组
        - 经审计的 2025 年桥接会增强定价信心
      - - 运营较重
        - 护理交付不该享受软件那样宽松的倍数
        - 能力页面加公开可比公司区间
        - 成熟市场利润率若得到证明，会缓和这一反对意见
      - - 资本结构复杂
        - 2022 年债务 / 股权加上 2025-2026 年冲突估值，可能扭曲公允价值
        - Medhealth 和 Forge / PitchBook
        - 完整股权结构表文件可能解释估值分散
    notes: 各行区分支持逻辑的质量和反向逻辑中的价格纪律。
    claimRefs:
      - CV001
      - CV002
      - CV010
