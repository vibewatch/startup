      - number: '1.2'
        title: 领导层交接与合并后治理
        blocks:
          - type: paragraph
            body: >-
              领导层有延续性，但故事已不再是简单的创始 CEO 叙事。Mark Prather
              仍是关键人物，担任联合创始人兼执行董事长；他公开发言中关于合并和居家护理临床价值的战略表述，仍然是公司叙事的锚点。不过，运营权力已经明显转到 Jennifer Webster
              手中，她现在是合并后公司的首席执行官和公众面孔。这个变化重要，因为 DispatchHealth 不再只是验证一个护理概念；它在整合一场大型合并，重新切分商业化模式，并试图成为医疗系统的规模化运营伙伴。


              治理的下一层是合并后的管理梯队。Erin Bartley 从 Medically Home 的 COO 转入 DispatchHealth，先负责高级转型，后承担总裁职责；Bill Kramer、David
              Wilkinson 和 Pippa Shulman 则补足法律、财务、运营和临床延续性。公开董事会细节仍然很少，所以主要尽调读法不是董事会成熟度，而是管理层集中度：Webster、Bartley、Shulman
              和 Prather 是后文反复依赖的核心人力节点。
