      - number: '2.4'
        title: 买方地图和采用约束决定执行难度
        blocks:
          - type: paragraph
            body: >-
              买方地图异常多边。医疗系统购买居家护理，是为了释放容量、把患者留在品牌体系内，并管理劳动力和吞吐约束。支付方和价值导向实体购买它，是为了减少可避免的急诊和住院支出。患者和护理者是最终用户，但很少掌握预算。因此，DispatchHealth
              的 2026 年策略更锋利地转向 B2B 赋能。公司赢单靠的是嵌入机构工作流和报销结构，而不是像独立消费者应用那样运作。


              约束侧同样重要。这个模式需要人员配置、移动物流、诊断能力、指挥中心工具、EMR 集成和支付方对齐。这些要求构成有意义的进入壁垒，但也拖慢铺开速度，让市场比标题 TAM 看起来更斑驳。2025
              年的豁免不确定性拖延了一些项目，Medicaid 适配仍然有限。实际含义是，品类增长应会继续，但投资者应把采用视为分阶段的运营推进，而非无摩擦扩张。
