      - number: '8.4'
        title: 建议：只保留有条件兴趣，并设置硬性尽调门槛
        blocks:
          - type: paragraph
            body: >-
              估值建议很直接。DispatchHealth 的战略相关性足以支持继续尽调，但透明度不足以支持空白支票式入场价。买方应假设股权结构表复杂，索取完整 2025 和 2026 年融资文件，并坚持先拿到经审计的
              2025 年收入和当前市场级单位经济性，再讨论任何接近 2025 年 3 月 Forge 标记的价格。没有这套材料，正确姿态只能是有条件兴趣。


              继续跟进的最大理由，是公司仍然同时拥有真实规模、具名伙伴逻辑和品类稀缺性。保持纪律的最大理由，是公开记录已经显示竞争者流失、合并后压力，以及宽到不能简单视为噪音的估值价差。这个组合导向一个答案：继续尽调，但除非管理层能调和
              2026 年融资、证明耐久增长，并证明平台今天值得战略控制权溢价，否则谈判锚点应明显低于 2025 年高点。
