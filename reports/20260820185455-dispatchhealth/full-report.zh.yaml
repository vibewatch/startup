      - CV023
      - CV024
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值区间
      - 关键风险
      - 概率信号
    rows:
      - - 悲观重置
        - 2026 年融资大方向有代表性；增长和利润率质量令人失望
        - $0.6B-$1.0B
        - 重置、稀释、单位经济性弱
        - 如果 2026 年轮次条款惩罚性强，该信号就有分量
      - - 基准证明期
        - 规模真实，但不透明和执行风险仍应承受大幅折价
        - $1.5B-$2.4B
        - 股权结构表意外、集中度、利润率缺口
        - 当前公开证据最能支持这一情景
      - - 乐观战略控制
        - 经审计结果显示密度强、支付方质量高、增长可持续
        - $3.0B-$3.8B
        - 任何经济性转弱迹象都会打破该情景
        - 需要出色的私下尽调
      - - 不可接受入场价
        - 买方未对账 2026 年定价，却按 2025 年 3 月估值或更高价格支付
        - 3.5B+
        - 在结构不透明时支付过高价格
        - 基于当前证据应拒绝
    notes: 区间是供投委会讨论的投资判断输出，不是管理层指引。
