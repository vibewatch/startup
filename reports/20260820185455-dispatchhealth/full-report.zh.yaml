  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：居家复杂护理，而非泛虚拟护理
        blocks:
          - type: paragraph
            body: >-
              分析 DispatchHealth
              时，应把它放在更宽的居家复杂护理市场，而不是消费者远程医疗或传统居家健康护理中。公司合并后的表述已经说得很明确。它的服务覆盖急诊替代上门、居家住院级护理和过渡恢复服务，每一项都替代实体医疗使用中的不同环节。因此，真正的经济对照组不是“视频问诊对比门诊”，而是“急诊科对比居家急症干预”、“住院入院对比居家住院病程”，以及“专业护理机构或无人管理出院对比居家协调恢复”。


              这个区别影响市场规模判断。这个品类更接近医院运营、支付方医疗损失管理和急性期后利用率控制，而不是消费者应用增长。买方关心床位容量、再入院率、单病程成本和临床信心。替代路径仍然是急诊科、住院部、专业护理机构和碎片化居家服务。Amazon
              One Medical 及类似虚拟护理产品仍是相邻对照点，但它们在急性度和运营复杂度上明显低于 DispatchHealth 的目标用例。
