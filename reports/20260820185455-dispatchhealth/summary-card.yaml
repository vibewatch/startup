  topStrengths:
    - >-
      Strategic position in a difficult-to-replicate category that combines logistics, clinical operations, and
      payer/provider embedment.
    - >-
      Meaningful public scale proof after the Medically Home merger, including 50+ enterprise customers, 1.2M+ patients
      treated, and 20+ states.
    - Clear enterprise relevance to health systems and payers rather than a purely consumer-demand story.
    - >-
      Potential strategic-buyer appeal for large healthcare platforms that want national in-home acute-care
      capabilities.
  topRisks:
    - >-
      Valuation opacity: observable private-market marks range from roughly $703.5M to $3.58B, with no public cap-table
      explanation.
    - 'Disclosure opacity: no audited public revenue, margin, EBITDA, or cash-flow denominator supports current pricing.'
    - >-
      Operational heaviness: field staffing, logistics, escalation, and market density matter more than in software
      businesses.
    - >-
      Post-merger stress and competitor churn indicate the category is strategically relevant but not easy to monetize
      cleanly.
  unresolvedGaps:
    - Audited 2025 financials and 2026 YTD bridge.
    - Full 2025 and 2026 financing documents, preference stack, and cap-table mechanics.
    - Market-level unit economics and mature-market contribution margins.
    - Customer concentration, renewal, and retention data.
    - Clinical incident, escalation, and service-level trend data.
