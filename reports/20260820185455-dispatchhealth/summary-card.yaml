summary:
  headline: >-
    DispatchHealth has credible strategic relevance and enterprise proof in a hard-to-replicate care-at-home niche, but
    open evidence does not support paying a peak private-market mark without audited operating data and explicit
    reconciliation of the 2026 financing signal.
