company:
  name: DispatchHealth
chapter:
  number: 5
  title: Product & Technology
  summary: DispatchHealth appears to run a real full-stack care-at-home operating system that combines software orchestration with high-acuity field operations. CESIA, partner integrations, and named deployments support a credible product story, especially after the Medically Home merger and the 2026 shift toward health-system enablement. The strongest strengths are workflow depth, clinical breadth, and trust markers like ACHC accreditation; the weakest areas are public disclosure on security, uptime, and deployment economics.
sections:
- id: product-definition-and-modules
  title: 'Product definition: a full-stack care-at-home operating system'
  body: |-
    DispatchHealth’s product should be read as a workflow system for moving acute and post-acute episodes out of facilities and into the home. In practice that means the offering is not one thing. It combines patient intake, clinical triage, field-staff dispatch, mobile diagnostics, home-based treatment, follow-up recovery workflows, and enterprise coordination for the institutions paying for or operating the program. The company’s official materials increasingly present this as a complex-care-at-home platform rather than as a house-call brand.

    That framing helps explain the module map. ER-alternative visits address the first acute encounter, hospital-at-home extends into higher-acuity episodes, and transitional care addresses recovery and readmission risk. CESIA and related workflow tooling tie those services together. Even ancillary services like imaging, specialty networks, and pharmacy or lab coordination matter because they reduce the number of times an episode has to bounce back into a facility.
  claimRefs:
  - CE001
  - CE002
  - CE007
  - CE008
  - CE027
  - CE028
  - CE030
  - CE034
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-and-deployment
  title: Architecture blends software orchestration with local execution
  body: |-
    The technology story is meaningful, but it is inseparable from operations. CESIA appears to handle logistics, resource matching, workflow automation, and EMR-linked coordination, while the clinical model requires mobile teams, supplies, scheduling, and escalation pathways in the field. This is a stronger architecture than a pure consumer app, but it also means product quality depends on local execution, not only code quality.

    The deployment evidence suggests real production use. MedStar, Regence, Saint Francis, and Valley Health all provide external proof that the company can be inserted into partner workflows. The Locus partnership further suggests that DispatchHealth can incorporate third-party monitoring or digital-health tools when needed. The combined picture is of a product that behaves like a deployable operating layer for hospitals and payers, not a narrow software widget. That also means implementation quality and partner onboarding discipline are part of the product, not just post-sale services.
  claimRefs:
  - CE003
