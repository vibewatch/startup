- id: differentiation-and-roadmap
  title: Differentiation comes from workflow depth and enterprise fit
  body: |-
    DispatchHealth’s strongest differentiation is not that it has the slickest patient front end. It is that it owns more of the hard middle of the workflow than most comparators. Versus Amazon One Medical, it operates at higher acuity and with far more logistics and clinical complexity. Versus Current Health, it presents more direct bedside-delivery ownership. Versus health systems building internally, it offers a preassembled mix of software, workforce practices, and partner networks.

    The roadmap appears to be moving further in that direction. The 2026 strategy update shifts emphasis toward helping health systems scale complex care at home, which implies deeper embedment, co-branded deployment, and better orchestration rather than a push toward self-serve consumer growth. The imaging divestiture is consistent with a product portfolio that can rebalance which asset layers are owned and which are partnered so long as the overall workflow still holds together. Historical app-launch materials also suggest the company has steadily deemphasized the consumer app as the center of the product story.
  claimRefs:
  - CE012
  - CE018
  - CE019
  - CE020
  - CE021
  - CE024
  - CE025
  - CE026
  tableRefs:
  - TE005
- id: trust-quality-and-gaps
  title: Trust is solid on outcomes and accreditation, thinner on technical disclosure
  body: |-
    The trust file is stronger than many private healthcare startups. DispatchHealth can point to ACHC accreditation, repeated outcomes metrics, and multiple named enterprise partners. That is valuable because this category is clinical and operationally risky by nature. A company does not get repeated hospital and payer deployments on story alone.

    Where disclosure remains thinner is in the classic software-risk layer. Public materials do not provide a formal uptime dashboard, detailed security certifications, API documentation, or explicit SLAs. Post-merger service pullbacks also remind investors that operating excellence must be maintained market by market. The right diligence conclusion is therefore constructive but incomplete: the public record supports product credibility and maturity, but not yet a clean audit of reliability, security posture, or deployment economics. It is a mature operating product with an immature public technical disclosure surface. That asymmetry should be closed in management diligence before underwriting an aggressive growth story.
  claimRefs:
  - CE013
  - CE014
