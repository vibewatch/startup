- id: sizing-lenses-and-demand-drivers
  title: Sizing lenses are broad; demand drivers are real
  body: |-
    Published market estimates point in the same directional direction but vary widely in magnitude. Mordor pegs the hospital-at-home market above $42 billion in 2026, Insight Partners uses a high-thirties baseline, and DispatchHealth’s own merger pitch referenced a far broader $300 billion figure from Chilmark. Investors should not average those numbers. They capture different geographies, service definitions, and time horizons. What they do show is that the category is already large enough to matter if care-at-home reimbursement, logistics, and staffing can hold.

    The stronger part of the market case is not the exact TAM number but the demand logic behind it. Aging populations, patient preference for home-based care, bed-capacity pressure, and readmission economics all favor the model. Peer-reviewed reviews add substance by showing lower costs, lower complications, and frequently better or comparable outcomes versus traditional hospitalization. Those facts support a positive category direction even if DispatchHealth’s own share of that category cannot yet be sized precisely from public information.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
