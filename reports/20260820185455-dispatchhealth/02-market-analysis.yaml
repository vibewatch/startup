tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - ER-alternative acute care
    - Serious but non-life-threatening episodes that can avoid an ED visit
    - Routine tele-triage and low-acuity retail urgent care
    - Health systems, MA plans, employer or risk-bearing contracts
    - Direct fit with DispatchHealth legacy mobile model
  - - Hospital-at-home / inpatient alternative
    - Inpatient-level acute episodes shifted to the home under waiver or contract
    - Traditional home health without acute escalation
    - Hospitals, health systems, some payers
    - Direct fit with Medically Home integration and hospital programs
  - - Transitional recovery / readmission avoidance
    - Post-discharge, ER-follow-up, and high-risk recovery episodes
    - Long-tail custodial home services
    - Health systems, payers, value-based entities
    - Direct fit with DispatchHealth transitional care
  - - Consumer primary-care subscription
    - Membership primary care and low-acuity virtual access
    - High-acuity field care and command-center logistics
    - Individual consumers and employers
    - Adjacent comparison only; not the core market
  - - Post-acute coordination platforms
    - SNF optimization, discharge orchestration, home-benefit management
    - Owned high-acuity bedside clinical delivery
    - Payers and discharge-management teams
    - Important adjacent competitor layer rather than full substitute
  notes: Table separates the acute-complex category from lower-acuity or purely administrative adjacencies.
