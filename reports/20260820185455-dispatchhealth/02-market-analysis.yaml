- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - AHCAH waiver extended to 2030
    - Positive
    - Near term
    - Reduces the largest policy cliff for hospital-at-home adoption
    - Track whether participating hospitals convert extensions into budget commitments
  - - Aging population and preference for home-based care
    - Positive
    - Structural
    - Supports long-run demand for at-home acute and post-acute models
    - Request cohort mix by age and condition
  - - Health-system bed pressure and labor scarcity
    - Positive
    - Current
    - Makes home-based substitution economically appealing
    - Review hospital partner capacity metrics and avoided bed days
  - - Medicaid coverage remains limited to a minority of states
    - Negative
