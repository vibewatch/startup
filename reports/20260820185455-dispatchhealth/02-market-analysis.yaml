    - Constrains universality and slows addressable reimbursement
    - Request state-by-state payer and Medicaid economics
  - - Operational complexity in staffing, diagnostics, and logistics
    - Negative
    - Current
    - Raises barriers to entry but also slows deployment velocity
    - Request productivity and service-level metrics for field teams and command centers
  - - Market-estimate inconsistency
    - Warning
    - Ongoing
    - Supports thesis direction but weakens precision for valuation work
    - Request internal sizing and pipeline segmentation used by management
  notes: The market is attractive because of structural demand and policy progress, but reimbursement and operations still create real friction.
