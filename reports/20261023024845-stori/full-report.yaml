      - number: '1.3'
        title: Financing, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Stori has disclosed several large equity and debt financings, but the sources use different denominators
              and dates that should not be collapsed into one current cash figure. The 2021 company release described
              $125 million of Series C equity and $75 million of debt; the 2022 release described a $150 million round
              valuing the company at $1.2 billion; and the 2024 release described $105 million of equity plus $107
              million of new debt, or $212 million in combined financing. Forge separately lists a $1.32 billion
              post-money valuation for an August 2024 Series C-3 entry and warns that its private-company data is not
              independently audited. User counts also vary by period, from 1.4 million customers in 2022 to 3 million
              users in the 2024 company release and more than 4 million users in a 2025 report. These differences are
              evidence of growth claims, not a single audited current metric.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO011
              - CO015
              - CO016
              - CO017
      - number: '1.4'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a progression from founding and initial credit-card launch to major
              financing, unicorn status, regulatory expansion, and product broadening. Stori's acquisition of or
              expansion through the MasCaja Sofipo license enabled deposit and savings products, and the official
              product page now presents a multi-product app. Partnerships have extended the distribution model into
              co-branded cards and remittance receipt through Félix Pago. At the same time, the evidence does not
              provide a current audited headcount, revenue or run-rate, cohort retention, loss curves, customer
              concentration, or a complete board and control structure. A diligence process should therefore verify
              current legal entities, regulatory permissions, financing covenants, valuation marks, user definitions,
              and whether stated customer counts represent active users, cardholders, deposit users, or cumulative
              accounts.
