      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The available record consistently identifies Bin Chen as CEO and co-founder and Marlene Garayzar as a
              co-founder and senior growth or governance executive. Investor and company announcements describe an
              experienced, internationally distributed team with backgrounds spanning Capital One, Mastercard, Morgan
              Stanley, GE Money, HSBC, Intel, and Compartamos, but the assigned sources do not provide a current
              complete executive roster or board register. The 2024 financing announcement adds Diego Cabrera Canay as
              CFO, citing prior CFO experience at DLocal and finance leadership at MercadoLibre. This supports
              functional coverage in finance and underwriting, while founder and key-person dependence remains material
              because operating continuity is still closely associated with a small set of named leaders.
