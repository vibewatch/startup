  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Stori's public product and operating model layers from customer access through regulated financial products and
      partner distribution.
    data:
      layers:
        - label: Customer access
          detail: Public customer entry points and card access
          items:
            - label: Mobile app
              detail: Application, card management, payments, statements, and account access
            - label: Physical and virtual cards
              detail: Card delivery and virtual-card use for purchases or bills
        - label: Product modules
          detail: Publicly listed financial products and rewards
          items:
            - label: Credit cards
              detail: Stori Green, Stori Black, and co-branded variants
            - label: Debit and deposits
              detail: Stori Account+ and related account functions
            - label: Investments and rewards
              detail: Stori Investment+, cashback, and Stori Pro benefits
        - label: Decision and servicing
          detail: Identity, underwriting, and customer-support processes
          items:
            - label: Digital onboarding
              detail: Documentation, contact details, and biometric identity validation are described for a co-branded card
            - label: Underwriting
              detail: Data-informed and machine-learning-oriented underwriting is described
            - label: Automated servicing
              detail: Reminders, statements, and basic query handling are described
        - label: Financial rails
          detail: Card networks, payments, transfers, and bill payment
          items:
            - label: Mastercard network
              detail: Card acceptance and co-branded card processing
            - label: Payments and transfers
              detail: Purchases, bill payments, mobile top-ups, and transfers
        - label: Regulation and balance sheet
          detail: SOFIPO-regulated deposits and investment products
          items:
            - label: SOFIPO perimeter
              detail: Stori is described as a regulated Popular Financial Society
            - label: Deposits and fixed terms
              detail: Liquid and fixed-term savings or investment options
        - label: Distribution and merchant tools
          detail: Partner acquisition and merchant acceptance
          items:
            - label: Co-branded channels
              detail: Retail and e-commerce partner cards
            - label: Stori Tap
              detail: Phone-based payment acceptance for businesses
