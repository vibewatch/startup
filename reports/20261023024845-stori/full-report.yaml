    claimRefs:
      - CM016
  - id: FP001
    title: 'Ordinal competitive position: distribution power (X) versus product breadth (Y)'
    type: quadrant
    summary: >-
      Evidence-backed ordinal scores place Stori in the multi-product challenger group but below scaled ecosystems and
      incumbents on distribution power.
    data:
      points:
        - label: Stori
          x: 3.4
          'y': 4.2
          detail: Broad product bundle and emerging partner channels, but smaller disclosed reach.
        - label: Nu
          x: 4.3
          'y': 4.4
          detail: Large Mexico user base and expanding license and product depth.
        - label: Klar
          x: 3.7
          'y': 4
          detail: Multi-product offer and license expansion through acquisition.
        - label: Mercado Pago
          x: 4.8
          'y': 4.5
          detail: Commerce-native distribution and broad fintech ecosystem.
        - label: BBVA Mexico
          x: 5
          'y': 4.8
          detail: Incumbent customer reach, deposits, trust, and full banking breadth.
        - label: Spin by OXXO
          x: 4.7
          'y': 3.2
          detail: Large physical retail footprint, with narrower evidenced product breadth.
    approximationNotes: >-
      Analyst ordinal scores from 1 (low) to 5 (high), derived from cited public product, customer, license, and channel
      evidence; they are not market-share measurements or independent benchmark scores.
