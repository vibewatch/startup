  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and distribution
        blocks:
          - type: paragraph
            body: >-
              Stori's core customer is an underserved or underbanked Mexican consumer seeking first access to revolving
              credit, with the company describing mass-middle and emerging-middle income populations as its target. The
              available evidence also shows a multi-product expansion from cards into deposits, investment products,
              cashback, payments, and merchant acceptance, which broadens the possible buyer and usage surface but does
              not by itself establish cross-sell or durable engagement. A co-branded Farmacias Similares card targets
              first-time banking consumers through a physical retail network, while the company's app remains the
              onboarding and compliance surface. This suggests a distribution model that combines direct digital
              acquisition with partner-led reach, but the public record does not disclose channel-level customer mix,
              CAC, or partner concentration.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU011
      - number: '6.2'
        title: Adoption trajectory and usage proof
        blocks:
          - type: paragraph
            body: >-
              Public milestones indicate rapid acquisition: Lightspeed reported more than one million Mexican
              applications by early 2021, Stori reported more than two million applications in November 2021, and
              Reuters reported more than three million clients in 2024. Bloomberg Línea separately described more than
              three million active users and said Stori was the first credit-card provider for about 80% of its
              cardholders, although that account is an interview-based company disclosure rather than an independently
              audited cohort series. These measures are not interchangeable: applications, clients, active users, and
              first-card status have different denominators and periods. Usage evidence is directional rather than
              complete, with Lightspeed reporting high activity and over 20% of transactions in e-commerce, but no
              public retention, renewal, utilization, or cohort curves.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU011
              - CU013
      - number: '6.3'
        title: Named deployments, retention, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is visible in partner-linked products rather than in audited customer references.
              Farmacias Similares launched a Mastercard co-branded card for first-time customers, with digital
              onboarding, biometric validation, and retail rewards; Stori's public product surface also lists Stori
              Green, Stori Black, Cuenta+, Investment+, Stori Pro, and Stori Tap. Lightspeed's 2021 account names
              Netflix, DiDi, Mercado Libre, and Uber among merchants used by cardholders, while Contxto documents the
              expansion into savings and investment products after the MasCaja acquisition. These examples establish use
              cases and product breadth, not production depth, renewal, or customer profitability. No retained source
              supplies NRR, GRR, churn, contract duration, cohort vintage performance, satisfaction trend, or customer
              concentration, so durability remains a material diligence gap.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU006
              - CU012
      - number: '6.4'
        title: Investment implications
        blocks:
          - type: paragraph
            body: >-
              The customer case is strongest where scale and access are the objective: Stori has reported millions of
              applicants or users, operates a fully digital acquisition path, and uses retail and e-commerce
              partnerships to reach consumers outside traditional banking. The case is weaker on durability and
              economics because the public evidence does not connect reported scale to active-card frequency, repayment
              quality, retention, or contribution margin. A partner-led expansion can lower acquisition friction and
              increase distribution, but it can also create dependence on counterparties and incentives that may not
              persist. Before treating the customer base as a durable moat, diligence should reconcile the different
              population measures, obtain cohort and repayment data by acquisition channel, and test whether
              multi-product adoption is repeat behavior or merely product availability.
            claimRefs:
              - CU007
              - CU008
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale and access are evidenced
            body: >-
              Multiple dated sources report millions of applicants, clients, or active users, and the evidence ties
              Stori to first-credit access for a large share of cardholders.
            calloutType: strength
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
          - type: callout
            title: Durability is not yet evidenced
            body: >-
              The retained public record does not provide cohort retention, churn, repayment, or partner concentration
              data, so customer scale should not be treated as recurring economic value without private diligence.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and financial exposure
        blocks:
          - type: paragraph
            body: >-
              Stori operates through a Mexican Sofipo structure supervised by the CNBV, and public coverage describes
              approval to acquire MasCaja as the route to deposits and broader financial products. That structure is a
              meaningful mitigation relative to an unlicensed lending model, but it also expands the surface area for
              regulatory reporting, consumer protection, liquidity, and governance scrutiny. The 2024 financing combined
              $105 million of equity with $107 million of debt; Bloomberg Línea reported that debt proceeds would be
              used for loans while equity would fund technology and product expansion. This is not evidence of cash burn
              or portfolio losses, but it does create a financing dependency that should be tested against vintage loss
              curves, reserve policy, and debt covenants. The company also markets a 15% annual deposit yield and says
              it is sustainable with the right structure; public sources do not provide the spread, duration, liquidity
              buffer, or stress assumptions needed to validate that statement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR012
      - number: '7.2'
        title: Operating, fraud, and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              Stori's product surface now spans cards, deposits, investments, payments, and partner programs. The
              Farmacias Similares co-branded card uses Stori's platform for compliance and risk assessment and requires
              identity, address, contact, and biometric checks. Those controls are positive evidence of a designed
              onboarding process, not evidence that fraud, credit losses, outages, or complaints are low. The same
              partnership gives Stori a physical distribution network and transaction data while making execution
              dependent on a major retail counterparty, Mastercard acceptance, and the quality of partner-led
              acquisition. The assigned public evidence does not establish partner revenue concentration, service-level
              performance, incident history, or customer outcomes. A risk committee should therefore monitor approval
              quality, fraud loss, first-payment default, uptime, complaint rates, and partner renewal economics by
              channel rather than treating product launch as proof of durable adoption.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR008
              - CR015
      - number: '7.3'
        title: Residual exposure and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports engagement but not a clean risk-adjusted underwriting case. Stori reports
              more than three million customers and a 99% approval rate, yet those are scale and access metrics rather
              than proof of repayment, retention, or contribution margin. The central thesis breaks if credit losses,
              fraud, or funding costs rise faster than pricing and deposit spread; if the Sofipo structure cannot
              support promised liquidity or yield; if a material compliance, privacy, or cyber incident occurs; or if a
              key retail, payments, or funding partner exits. The practical diligence path is to obtain monthly cohort
              and loss data, reserve and liquidity policies, regulatory examination status, incident and complaints
              logs, partner contracts, and debt terms. Until those are available, residual exposure should be treated as
              high for financial and regulatory risk and medium to high for partner and operational risk, with explicit
              kill criteria rather than a claim that no incident exists.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR007
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The key unknown is portfolio quality, not customer reach
            body: >-
              More than three million customers and a 99% approval rate demonstrate reach, but they do not disclose
              repayment, fraud, cohort retention, or unit economics. Investment decisions should require vintage-level
              loss and contribution data before treating scale as risk reduction.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR013
          - type: callout
            title: Treat missing incident evidence as unresolved
            body: >-
              The assigned sources do not establish that Stori has had no outage, privacy event, enforcement action, or
              material complaint trend. The appropriate conclusion is an evidence gap with a defined diligence request,
              not a clean safety record.
            calloutType: assumption
            claimRefs:
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Stori's positive case is a scaled, regulated consumer-finance platform with evidence of repeated
              institutional financing and product expansion. Lowenstein records a September 2024 round totaling $212
              million, split between $105 million of equity and $107 million of new debt, and says the financing
              represented a step up in valuation over the previously announced unicorn round. Reuters independently
              describes the same financing and says Stori served more than 3 million clients, while Bloomberg Línea
              reports that the equity proceeds were intended for technology and product expansion and the debt proceeds
              for lending. These facts support financing access and strategic ambition, not cash earnings or investor
              returns. The anti-thesis is that the latest public valuation evidence is not a current arm's-length mark:
              SetterVC labels its $1.2 billion figure an estimate that may be incomplete, stale, erroneous, or revised,
              and its latest mark is dated April 2024. The same source shows a 1.0x uplift from its September 2021 entry
              mark to April 2024, not realized returns. Stori's valuation therefore remains highly sensitive to loss
              curves, deposit economics, dilution, debt terms, and whether new products generate durable contribution
              profit.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV013
              - CV015
      - number: '8.2'
        title: Price, structure, and scenario discipline
        blocks:
          - type: paragraph
            body: >-
              A defensible entry framework must separate the observable financing amount from the unobservable price
              paid for equity. The 2024 round's mixed capital structure matters: $105 million was equity and $107
              million was debt, so the headline $212 million cannot be used as a proxy for equity value or cash
              available for general corporate use. The only fetched valuation mark is $1.2 billion, and it is explicitly
              caveated as an estimate. A public-comparables lens is also imperfect: CompaniesMarketCap reports Nu
              Holdings at $71.15 billion on October 22, 2026, but that is a listed market capitalization for a much
              larger public company, not a directly comparable private-company equity value. Legal Paradox's 2026 market
              analysis describes a concentrated Mexican neobank market and places Stori among digital challengers, but
              its promotional, AI-produced framing and unsupported-to-this-chapter operating figures make it a
              directional market-context source rather than a valuation anchor. Accordingly, the base case should not
              imply a precise multiple or target return. A new investment should require an updated cap table, fully
              diluted share count, preference stack, debt covenants, current portfolio metrics, and a price that leaves
              room for down-round and multiple-compression risk.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV013
              - CV017
              - CV018
      - number: '8.3'
        title: Recommendation, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              Stori has strategic optionality: Contxto reports that the MasCaja acquisition expanded its ability to
              offer savings and investment products, the Stori product page lists credit, debit, savings, investments,
              cashback, payments, and a merchant phone-terminal product, and Mexico Business reports a July 2026
              co-branded Farmacias Similares card with Mastercard and a digital compliance and biometric onboarding
              flow. That breadth can improve engagement and distribution, but it also increases execution, regulatory,
              funding, and credit-risk complexity. Exit readiness is therefore unproven. The evidence does not show a
              public IPO filing, a current secondary transaction, audited recurring-revenue metric, or a disclosed
              investor liquidity path. The recommendation is research-more with a high risk rating and fair valuation
              stance: proceed only if the company can substantiate current cohort economics and the transaction price is
              protected by terms. Thesis-break triggers are a material deterioration in vintage loss or delinquency
              performance, inability to refinance debt, regulatory limits on deposit or lending products, a down round
              below the prior mark, or evidence that partner-led acquisition does not produce retained, profitable
              customers.
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional engagement only
            body: >-
              Stori merits continued diligence, not a buy recommendation, until a current equity mark, cap-table and
              preference analysis, cohort loss data, deposit economics, and debt terms are verified.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV012
              - CV018
          - type: callout
            title: Headline financing is not equity value
            body: >-
              The retained $212 million round combines $105 million of equity with $107 million of debt; treating the
              headline as valuation support or unrestricted cash would overstate the evidence.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
