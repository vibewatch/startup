chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Stori is described across company and third-party materials as a Mexico-focused fintech serving consumers
              who have limited or no traditional credit history. Its initial product was a mobile-first credit card,
              with underwriting and servicing performed through a digital application. The current official product
              surface is broader: credit cards, debit and deposit products, investment options, cashback, bill payment,
              remittances, and a phone-based merchant acceptance product. Stori's Mexico City office is identified on
              its current product page, while third-party profiles also describe operations or offices in the United
              States and Asia. The sources support the product scope and inclusion orientation, but they do not
              establish current revenue, profitability, or a complete legal-entity map.
            claimRefs:
              - CO001
              - CO002
              - CO003
