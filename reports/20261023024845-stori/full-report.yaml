  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Stori's core market is Mexican mass-market consumer finance for people who are underserved by traditional
              bank underwriting. The included boundary covers revolving card credit, digital deposit and savings
              balances, personal loans, and partner-distributed cards; the current app also exposes remittance receipt
              and a phone-based merchant-acceptance adjacency. This is not the entire Mexican banking market. It
              excludes prime-bank credit, mortgages, corporate banking, wholesale deposits, and full-service
              international banking. Cash, debit-only use, informal borrowing, retailer credit, and established-bank
              products remain status-quo substitutes. The SOFIPO structure expands access but also differentiates the
              deposit proposition from a full-bank account, making regulation and depositor protection part of the
              market boundary rather than a footnote.
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: Sizing evidence, not false precision
        blocks:
          - type: paragraph
            body: >-
              The assigned sources support several sizing lenses but not a single investable TAM. A historical investor
              account put Mexico's population near 130 million and described 2019 as only 37% banked, with more than 85%
              of transactions in cash. Later reporting used broader or different denominators: Reuters said just over
              half of the population used some financial product in 2024, while FinTech Weekly said about one-third of
              adults had formal credit and reported 3.7 million Stori users. These observations are directionally
              consistent with an inclusion gap, but they are not interchangeable. The chapter therefore preserves
              period, population, and metric differences and treats Stori's 80-million-person aspiration as a company
              objective, not an independently measured addressable market.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary buyer, user, and payer is a Mexican household seeking a first formal credit product, a way to
              build credit history, or a higher-yield digital savings account. Adoption can begin with a small credit
              line, then expand into deposits, investments, bill payment, cashback, or loans inside the same app.
              Partner cards add a second route: a retailer supplies physical reach and incentives while Stori performs
              digital onboarding and risk assessment. Stori's app listing also presents remittance receipt and merchant
              acceptance, which broaden the user set but should be treated as adjacencies until their economics and
              adoption are disclosed. Budget ownership remains with the household for financial products and with the
              merchant for acceptance tools.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by low formal-credit access, persistent cash use, digital commerce, simple app
              onboarding, and distribution through consumer brands. Product breadth can raise engagement and reduce
              dependence on one card relationship, while funding provides lending capacity and product-development
              resources. The constraints are equally material: a 23% reported delinquency ratio as of June, an operating
              loss excluding tax credits in the first half of 2025, persistent sector credit costs, and the lower
              deposit-protection framing of a SOFIPO relative to a full bank. Valuation should therefore depend on
              verified cohorts, loss curves, deposit behavior, partner economics, and multi-product attachment rather
              than multiplying a broad inclusion population by an assumed revenue yield.
            claimRefs:
              - CM007
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No defensible TAM/SAM/SOM from the assigned evidence
            body: >-
              The public record demonstrates unmet need but does not provide a current official adult denominator,
              eligible risk population, annual spend pool, or Stori-specific conversion and unit economics. Treating the
              80-million-person aspiration as TAM would overstate evidence quality.
            calloutType: risk
            claimRefs:
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale
        blocks:
          - type: paragraph
            body: >-
              Stori sits between a specialist inclusion lender and a broader digital financial platform. Its relevant
              alternatives therefore extend beyond app-based credit-card providers to Nu and Klar, ecosystem businesses
              such as Mercado Pago and Spin by OXXO, full-license incumbents such as BBVA, and the cash-based status
              quo. The category is not settled: one 2026 analyst view separates digitized incumbents, digital-native
              challengers, and embedded-finance ecosystems, while Tracxn uses a narrower global credit-building peer
              set. Scale is uneven. Reuters reported in August 2024 that Stori had more than 3 million clients, versus 7
              million for Nubank and 1.5 million for Ualá in Mexico at that time. More recent analyst figures put Nu far
              ahead and show that physical and commerce ecosystems can distribute financial products without relying
              only on paid app acquisition.
            claimRefs:
              - CP005
              - CP010
              - CP011
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP010
              - CP011
      - number: '3.2'
        title: Product, pricing, and distribution competition
        blocks:
          - type: paragraph
            body: >-
              Stori's strongest differentiation is the combination of accessible credit with an expanding savings,
              investment, payments, and merchant-tool bundle. Its current app listing includes credit and debit cards,
              savings, fixed-term investment, bill payment, remittance receipt, and phone-based card acceptance.
              Distribution is also becoming less purely digital: the 2026 Farmacias Similares card gives Stori access to
              a national retail footprint, while an earlier Shein card targeted online shoppers. These partnerships can
              lower acquisition friction and add transaction context, but they also create channel dependence and do not
              establish superior unit economics. Public list terms show aggressive customer acquisition across the
              category. Stori markets no-annual-fee cards and partner cashback, while Klar advertised promotional
              deposit yields; realized pricing, risk-adjusted margin, and renewal economics remain undisclosed and
              should not be inferred from those offers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP013
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Stori's funding capacity and reported profitability provide room to keep investing: Reuters and Bloomberg
              Línea both reported a US$212 million 2024 financing split between US$105 million of equity and US$107
              million of debt. The more important moat, however, is whether thin-file underwriting improves with data
              while preserving acceptable loss performance. Legal Paradox reported that Stori produced MXN 253.2 million
              of FY2025 net income and thirteen consecutive profitable months through March 2026, but also reported an
              11.3% non-performing-loan ratio, above Nu's 6.0% and Klar's 9.1%. That combination supports a
              differentiated risk appetite rather than a proven durable underwriting advantage. Licensing is also
              converging as peers acquire or obtain broader permissions. Product breadth can be copied, customers can
              multi-home, and better-capitalized banks or commerce platforms can subsidize acquisition. The defensible
              case therefore depends on cohort-level loss curves, repeat borrowing, cross-product attachment, partner
              concentration, and switching behavior that public sources do not disclose.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting quality is the moat test
            body: >-
              Profitability and a high loan-to-deposit ratio show commercial intensity, but the analyst-reported 11.3%
              NPL ratio makes vintage curves and risk-adjusted contribution margins necessary before treating thin-file
              underwriting as durable differentiation.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Stori's public surfaces describe a product set rather than a reported revenue statement. The company
              offers credit cards, a digital account with savings and returns, debit and payment functionality,
              cashback, and investment-related features through one app. That supports several potential revenue
              streams: card interest and fees, interchange, net interest income on deposits and loans, and possibly
              partner economics. The evidence does not quantify the mix, realized pricing, credit loss deductions, or
              contribution by product. Official pricing also distinguishes a no-annual-fee proposition from an opening
              fee that can vary by applicant, so list-positioning should not be treated as realized revenue. The
              financial model is therefore directionally legible but not sufficiently disclosed for a revenue-quality
              conclusion.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI005
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI008
              - CI016
      - number: '4.2'
        title: Unit economics and cost drivers
        blocks:
          - type: paragraph
            body: >-
              Stori's underwriting proposition is designed for customers with limited or no traditional credit history
              and relies on a mobile application, data-driven underwriting, and a regulated deposit entity. That can
              lower branch and onboarding costs, but it does not establish positive unit economics. The public record
              does not provide CAC, approval-to-activation conversion, utilization, repayment, vintage loss curves,
              servicing cost, deposit beta, or net revenue retention. A co-branded card illustrates a possible
              distribution lever: the Farmacias Similares launch combines Stori's digital onboarding and compliance with
              a physical retail network, but its economics, acquisition cost, and revenue share are undisclosed. The
              correct underwriting posture is to model these as missing inputs, not to infer efficiency from customer
              growth or product breadth.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The August 2024 financing was a $212 million combination of $105 million of equity and $107 million of
              debt, intended to scale existing products and add new ones. Separate reporting says Stori planned MXN 7
              billion of investment over two years and would use debt financing for lending. Stori's current homepage
              says more than 5 million Mexicans already have a Stori relationship, while 2024 reporting described a 15%
              annual deposit yield that management said was sustainable with the right structure. These are company
              scale, financing, and management-plan disclosures, not cash on hand, free cash flow, or runway. The debt
              tranche increases financing dependency, and a high deposit yield can increase funding cost before credit
              losses and operating expenses. Stori therefore appears capitalized for continued expansion, but public
              evidence is insufficient to assess liquidity buffers, reserve adequacy, debt covenants, or the path to
              sustainable profitability. A diligence decision should remain conditional on current portfolio performance
              and entity-level financial statements.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The underwriting gap is not the funding headline
            body: >-
              The financing headline establishes capital raised, not cash available or economic durability. Current loss
              rates, reserve methodology, deposit funding cost, debt terms, and liquidity coverage remain the gating
              financial diligence items.
            calloutType: risk
            claimRefs:
              - CI009
              - CI011
              - CI013
          - type: callout
            title: Require product-level economics before underwriting growth
            body: >-
              Request monthly cohort data separating card, deposit, lending, and partner channels, with realized
              pricing, losses, servicing cost, funding cost, and cash runway. Until those fields are supplied, treat the
              growth plan as financing-dependent rather than self-funding.
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI008
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer product surface
        blocks:
          - type: paragraph
            body: >-
              Stori's customer-facing product is a single mobile-led financial surface rather than a standalone card.
              The current app listing describes credit cards, debit, a digital account, savings, investment, cashback,
              and payments in one app, while the product page identifies distinct Stori Green, Stori Black, Account+,
              Investment+, Credit + Debit, Stori Pro, and Stori Tap offers. This breadth gives the company several entry
              points for underserved customers and creates potential cross-sell, but the public material does not
              disclose activation, attach, repeat-use, or profitability by module. The strongest evidence therefore
              supports product availability and intended workflow, not adoption or unit economics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Operating architecture and workflow
        blocks:
          - type: paragraph
            body: >-
              The observable operating model has four linked layers: digital acquisition and identity checks,
              underwriting and credit-line decisions, account and payment servicing, and regulated deposits or
              partner-enabled distribution. Stori says its application-to-bill-pay experience is mobile, and an
              independent investor account describes underwriting models shaped by Capital One experience. A 2025
              company interview adds automated reminders, statements, basic-query handling, and plans to build internal
              infrastructure while using AI for real-time customer analysis. These statements indicate an integrated
              workflow, but they do not establish model accuracy, uptime, latency, explainability, or control
              effectiveness.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
              - CE012
      - number: '5.3'
        title: Maturity, dependencies, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Product maturity is clearest at the feature and distribution layer: the company has multiple card
              variants, deposit and investment products, a regulated SOFIPO vehicle, and co-branded distribution. The
              less visible layer is production assurance. Public sources do not provide a service-status history,
              security architecture, independent penetration-test results, model-governance documentation, loss or fraud
              performance by vintage, or recovery objectives. The Google Play listing is a limited developer-signal
              proxy because it confirms a public app-distribution surface, but it supplies no usable
              engineering-activity, integration-adoption, reliability, or security evidence. Main dependencies are
              mobile connectivity, card and payment rails, identity/compliance processes, the SOFIPO regulatory
              perimeter, and partner channels.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Product and technology verdict
        blocks:
          - type: paragraph
            body: >-
              Stori appears technically credible as a scaled fintech operating model, not as a publicly verifiable
              proprietary-technology story. The evidence supports a mobile-first product portfolio, data-informed
              underwriting, automated servicing, regulated deposit expansion, and embedded distribution. It does not
              support a conclusion that Stori has durable software defensibility, superior risk models, or
              institutional-grade resilience. A product diligence process should request architecture diagrams, control
              ownership, incident and uptime records, model validation, vendor and partner concentration, release
              governance, and module-level adoption and contribution data before treating breadth as maturity.
            claimRefs:
              - CE006
              - CE008
              - CE010
              - CE011
              - CE012
              - CE013
