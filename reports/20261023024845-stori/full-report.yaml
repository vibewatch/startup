  - id: FU001
    title: Customer journey from access to expansion
    type: journey-map
    summary: >-
      Public evidence supports a path from underserved-customer acquisition through digital onboarding, card use,
      partner distribution, and adjacent financial products, while retention remains unverified.
    data:
      nodes:
        - id: access
          label: Underserved consumer access
          detail: Target population includes emerging-middle and underbanked consumers seeking credit access.
          touchpoints:
            - Credit-card application
            - First formal credit product
        - id: onboarding
          label: Digital onboarding
          detail: Partner-linked applications use Stori's digital platform for compliance and identity validation.
          touchpoints:
            - App application
            - Biometric validation
        - id: card-use
          label: Card usage
          detail: Early evidence reported high usage and more than 20% e-commerce transactions.
          touchpoints:
            - Retail purchases
            - E-commerce merchants
        - id: partner-reach
          label: Partner-led reach
          detail: Farmacias Similares and Shein show co-branded distribution surfaces.
          touchpoints:
            - Retail pharmacy
            - Digital commerce
        - id: multi-product
          label: Multi-product expansion
          detail: Public product surfaces include savings, investment, payments, cashback, and merchant acceptance.
          touchpoints:
            - Cuenta+
            - Investment+
            - Stori Tap
        - id: durability
          label: Durability and expansion
          detail: Cohort retention, repeat use, and channel economics are not publicly established.
          touchpoints:
            - Renewal
            - Repeat transacting
            - Cross-sell
