callouts:
  - calloutType: risk
    title: The underwriting gap is not the funding headline
    body: >-
      The financing headline establishes capital raised, not cash available or
      economic durability. Current loss rates, reserve methodology, deposit
      funding cost, debt terms, and liquidity coverage remain the gating financial
      diligence items.
    claimRefs: [CI009, CI011, CI013]
  - calloutType: recommendation
    title: Require product-level economics before underwriting growth
    body: >-
      Request monthly cohort data separating card, deposit, lending, and partner
      channels, with realized pricing, losses, servicing cost, funding cost, and
      cash runway. Until those fields are supplied, treat the growth plan as
      financing-dependent rather than self-funding.
    claimRefs: [CI006, CI008, CI012]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Public value or status, Quality, Diligence ask]
    rows:
      - [Credit cards, "Interest, fees, interchange, and credit economics are possible mechanisms", "Digital cards offered; no public revenue split", "Mechanism observed; economics unavailable", "Monthly active cards, utilization, APR/fees, loss and recovery by vintage"]
      - [Deposits and digital account, "Deposit balances and returns may create net interest income or funding cost", "Cuenta+ / Account+ marketed with savings and returns", "Product confirmed; balances and spread unavailable", "Average balances, rate paid, asset yield, duration, and deposit concentration"]
      - [Personal loans, "Loan interest and fees", "Personal loans described in external coverage; no public book size", "Product reported; portfolio economics unavailable", "Originations, yield, delinquency, charge-offs, reserves, and servicing cost"]
      - [Partner and co-branded channels, "Acquisition, interchange, cashback, and partner revenue-share economics", "Farmacias Similares co-branded card launched", "Channel confirmed; realized economics unavailable", "CAC, approval-to-activation, revenue share, incentives, and renewal terms"]
    notes: "Public company and third-party product descriptions identify mechanisms but do not disclose a revenue mix; null economics are evidence gaps, not zero values."
    claimRefs: [CI001, CI002, CI003, CI007]
  - id: TI002
    title: Pricing and monetization signals
    columns: [Product or offer, List or stated terms, Realized pricing, Interpretation, Diligence ask]
    rows:
      - [Stori Green, "No annual fee; credit line increases may follow responsible spending", "Not disclosed", "Acquisition proposition, not revenue evidence", "APR, opening-fee incidence, interchange, and activation conversion"]
      - [Stori account, "Savings, debit, returns, and fixed-term investment options are described", "Rate and balance history not disclosed in the assigned current product listing", "Funding proposition; spread cannot be calculated", "Current rate card, deposit beta, liquidity limits, and asset allocation"]
      - [Farmacias Similares card, "Up to MX$20,000 line; up to 50-day interest-free window; cashback terms reported", "Partner economics and realized yield not disclosed", "Promotional terms may raise acquisition and reward costs", "Contribution margin after cashback, interchange, and partner share"]
      - [2024 financing, "$105M equity plus $107M debt", "Capital raised is not revenue or cash runway", "Financing capacity, with debt obligations", "Debt pricing, maturity, covenants, use-of-funds, and cash reconciliation"]
    notes: "Terms are list or reported promotional terms from the cited sources; they are not realized revenue, ARR, margin, or cash available."
    claimRefs: [CI001, CI005, CI009, CI010]
  - id: TI003
    title: Unit-economics underwriting inputs
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Customer acquisition cost, null, low, "Determines whether expansion is self-funding", "CAC by organic, paid, and partner channel with payback"]
      - [Credit loss and reserve rate, null, low, "Primary determinant of lending contribution margin", "Vintage delinquency, charge-offs, recoveries, and reserve methodology"]
      - [Deposit funding cost and asset yield, null, low, "Determines net interest spread and liquidity pressure", "Average rate paid, asset yield, duration, and repricing sensitivity"]
      - [Cash runway and liquidity buffer, null, low, "Separates raised capital from ability to meet obligations", "Current cash, restricted cash, undrawn facilities, maturities, and stress scenarios"]
      - [Servicing and support cost, null, low, "Tests whether mobile distribution translates into contribution margin", "Cost per active account, collections, fraud, support, and infrastructure"]
    notes: "No public source in the assigned pool supplies these unit-economics values; null means unavailable, not zero. Each row states a concrete diligence request."
    claimRefs: [CI006, CI008, CI011, CI012, CI013]
