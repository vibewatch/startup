company:
  name: Stori
chapter:
  number: 4
  title: Financials
  summary: Stori has built a multi-product consumer-finance model around credit cards, deposits, and adjacent financial services, but public evidence does not disclose the revenue, loss, reserve, or cash metrics needed for underwriting. The 2024 financing added both growth capital and debt capacity, while the mix of high-yield deposits and credit lending makes funding costs, credit losses, and liquidity the decisive unresolved variables.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: >-
      Stori's public surfaces describe a product set rather than a reported revenue
      statement. The company offers credit cards, a digital account with savings and
      returns, debit and payment functionality, cashback, and investment-related
      features through one app. That supports several potential revenue streams:
      card interest and fees, interchange, net interest income on deposits and loans,
      and possibly partner economics. The evidence does not quantify the mix, realized
      pricing, credit loss deductions, or contribution by product. Official pricing
      also distinguishes a no-annual-fee proposition from an opening fee that can
      vary by applicant, so list-positioning should not be treated as realized
      revenue. The financial model is therefore directionally legible but not
      sufficiently disclosed for a revenue-quality conclusion.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-drivers
    title: Unit economics and cost drivers
    body: >-
      Stori's underwriting proposition is designed for customers with limited or no
      traditional credit history and relies on a mobile application, data-driven
      underwriting, and a regulated deposit entity. That can lower branch and
      onboarding costs, but it does not establish positive unit economics. The
      public record does not provide CAC, approval-to-activation conversion,
      utilization, repayment, vintage loss curves, servicing cost, deposit beta,
      or net revenue retention. A co-branded card illustrates a possible
      distribution lever: the Farmacias Similares launch combines Stori's digital
      onboarding and compliance with a physical retail network, but its economics,
      acquisition cost, and revenue share are undisclosed. The correct underwriting
      posture is to model these as missing inputs, not to infer efficiency from
      customer growth or product breadth.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The August 2024 financing was a $212 million combination of $105 million of
      equity and $107 million of debt, intended to scale existing products and add
      new ones. Separate reporting says Stori planned MXN 7 billion of investment
      over two years and would use debt financing for lending. Stori's current
      homepage says more than 5 million Mexicans already have a Stori relationship,
      while 2024 reporting described a 15% annual deposit yield that management
      said was sustainable with the right structure. These are company scale,
      financing, and management-plan disclosures, not cash on hand, free cash flow,
      or runway. The debt tranche increases financing dependency, and a high deposit
      yield can increase funding cost before credit losses and operating expenses.
      Stori therefore appears capitalized for continued expansion, but public
      evidence is insufficient to assess liquidity buffers, reserve adequacy, debt
      covenants, or the path to sustainable profitability. A diligence decision
      should remain conditional on current portfolio performance and entity-level
      financial statements.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
    tableRefs: []
