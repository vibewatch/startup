company:
  name: Stori
chapter:
  number: 8
  title: Valuation
  summary: >-
    Stori has credible financing, product expansion, and distribution evidence, but public evidence does not establish a current mark, recurring revenue base, portfolio quality, or investor return path. The appropriate posture is research-more: engage only with disciplined price, structure, and diligence conditions.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Stori's positive case is a scaled, regulated consumer-finance platform with evidence of repeated institutional financing and product expansion. Lowenstein records a September 2024 round totaling $212 million, split between $105 million of equity and $107 million of new debt, and says the financing represented a step up in valuation over the previously announced unicorn round. Reuters independently describes the same financing and says Stori served more than 3 million clients, while Bloomberg Línea reports that the equity proceeds were intended for technology and product expansion and the debt proceeds for lending. These facts support financing access and strategic ambition, not cash earnings or investor returns. The anti-thesis is that the latest public valuation evidence is not a current arm's-length mark: SetterVC labels its $1.2 billion figure an estimate that may be incomplete, stale, erroneous, or revised, and its latest mark is dated April 2024. The same source shows a 1.0x uplift from its September 2021 entry mark to April 2024, not realized returns. Stori's valuation therefore remains highly sensitive to loss curves, deposit economics, dilution, debt terms, and whether new products generate durable contribution profit.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Price, structure, and scenario discipline
    body: >-
      A defensible entry framework must separate the observable financing amount from the unobservable price paid for equity. The 2024 round's mixed capital structure matters: $105 million was equity and $107 million was debt, so the headline $212 million cannot be used as a proxy for equity value or cash available for general corporate use. The only fetched valuation mark is $1.2 billion, and it is explicitly caveated as an estimate. A public-comparables lens is also imperfect: CompaniesMarketCap reports Nu Holdings at $71.15 billion on October 22, 2026, but that is a listed market capitalization for a much larger public company, not a directly comparable private-company equity value. Legal Paradox's 2026 market analysis describes a concentrated Mexican neobank market and places Stori among digital challengers, but its promotional, AI-produced framing and unsupported-to-this-chapter operating figures make it a directional market-context source rather than a valuation anchor. Accordingly, the base case should not imply a precise multiple or target return. A new investment should require an updated cap table, fully diluted share count, preference stack, debt covenants, current portfolio metrics, and a price that leaves room for down-round and multiple-compression risk.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Recommendation, exit readiness, and thesis breaks
    body: >-
      Stori has strategic optionality: Contxto reports that the MasCaja acquisition expanded its ability to offer savings and investment products, the Stori product page lists credit, debit, savings, investments, cashback, payments, and a merchant phone-terminal product, and Mexico Business reports a July 2026 co-branded Farmacias Similares card with Mastercard and a digital compliance and biometric onboarding flow. That breadth can improve engagement and distribution, but it also increases execution, regulatory, funding, and credit-risk complexity. Exit readiness is therefore unproven. The evidence does not show a public IPO filing, a current secondary transaction, audited recurring-revenue metric, or a disclosed investor liquidity path. The recommendation is research-more with a high risk rating and fair valuation stance: proceed only if the company can substantiate current cohort economics and the transaction price is protected by terms. Thesis-break triggers are a material deterioration in vintage loss or delinquency performance, inability to refinance debt, regulatory limits on deposit or lending products, a down round below the prior mark, or evidence that partner-led acquisition does not produce retained, profitable customers.
    claimRefs: [CV013, CV014, CV015, CV016, CV017, CV018]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence boundary, Decision implication]
    rows:
      - [Recommendation, research-more, "No current price or audited unit economics were disclosed in the retained evidence", "Engage conditionally; do not underwrite a buy"]
      - [Confidence, medium, "Financing and product evidence are corroborated, but valuation and portfolio disclosures are incomplete", "Require primary diligence before commitment"]
      - [Risk rating, high, "Mixed equity/debt financing, consumer-credit exposure, and multi-product expansion", "Demand downside protection and monitoring rights"]
      - [Valuation stance, fair, "The only retained mark is an estimated $1.2B April 2024 figure", "Accept only a disciplined entry price or superior terms"]
    notes: "Assessment is analytical; the retained sources do not disclose a current transaction price, audited profitability, or realized investor return."
    claimRefs: [CV001, CV007, CV008, CV012]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Financing access is a strength", "2024 equity and debt financing totaled $212M", "A failed refinancing or materially adverse covenant disclosure"]
      - ["Product breadth can deepen monetization", "Credit, deposits, investments, payments, and merchant tools are listed", "Evidence of weak attach, low retention, or negative contribution by product"]
      - ["Distribution can scale efficiently", "Farmacias Similares co-branded card targets first-time banking consumers", "Partner concentration, poor activation, or partner termination"]
      - ["Valuation support is incomplete", "SetterVC's $1.2B mark is caveated as an estimate and dated April 2024", "A current priced round, secondary mark, or audited valuation support"]
    notes: "Rows distinguish company/product evidence from valuation evidence; no row treats a financing amount as a valuation."
    claimRefs: [CV001, CV002, CV003, CV007, CV013, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Key risk]
    rows:
      - [Bull, "Current cohorts remain profitable; deposits and new products scale; financing terms remain supportive", "A new mark above $1.2B could be defensible, but no numeric target is supportable from retained evidence", "Low-to-medium; requires verification", "Credit losses or funding costs outrun product expansion"]
      - [Base, "Stori preserves financing access and grows products without proving a higher mark", "Treat $1.2B as a stale reference point, not a target; require price discipline and downside terms", "Medium", "Unknown cohort, margin, dilution, and preference economics"]
      - [Bear, "Loss curves worsen, debt becomes expensive, or regulatory/partner constraints slow growth", "Down-round or impaired equity value is plausible; downside cannot be quantified publicly", "Material", "Consumer-credit losses, refinancing, or regulatory shock"]
    notes: "Scenario ranges are deliberately qualitative because the pool contains no current cap table, revenue run rate, loss curves, or priced secondary transaction."
    claimRefs: [CV004, CV007, CV008, CV009, CV010, CV012, CV018]

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Financing and product evidence support engagement, while missing price and risk evidence constrain the recommendation.
    data:
      nodes:
        - {id: scale, label: "Financing and users", tone: positive}
        - {id: breadth, label: "Product expansion", tone: positive}
        - {id: price, label: "Current price unknown", tone: warning}
        - {id: risk, label: "Credit and funding risk", tone: risk}
        - {id: terms, label: "Require protective terms", tone: opportunity}
        - {id: decision, label: "Research-more", tone: neutral}
    claimRefs: [CV001, CV003, CV013, CV017, CV018]

callouts:
  - calloutType: recommendation
    title: Conditional engagement only
    body: Stori merits continued diligence, not a buy recommendation, until a current equity mark, cap-table and preference analysis, cohort loss data, deposit economics, and debt terms are verified.
    claimRefs: [CV007, CV008, CV012, CV018]
  - calloutType: risk
    title: Headline financing is not equity value
    body: The retained $212 million round combines $105 million of equity with $107 million of debt; treating the headline as valuation support or unrestricted cash would overstate the evidence.
    claimRefs: [CV001, CV002, CV003]

