company:
  name: Stori
chapter:
  number: 1
  title: Company Overview
  summary: Stori is a Mexico-based consumer-finance platform that began with app-based credit cards for underserved consumers and has expanded into deposits, investments, payments, and remittance-linked use cases. The evidence supports a substantial financing history and multi-product ambition, while current private valuation, governance detail, and operating scale remain only partly verifiable.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: "Stori is described across company and third-party materials as a Mexico-focused fintech serving consumers who have limited or no traditional credit history. Its initial product was a mobile-first credit card, with underwriting and servicing performed through a digital application. The current official product surface is broader: credit cards, debit and deposit products, investment options, cashback, bill payment, remittances, and a phone-based merchant acceptance product. Stori's Mexico City office is identified on its current product page, while third-party profiles also describe operations or offices in the United States and Asia. The sources support the product scope and inclusion orientation, but they do not establish current revenue, profitability, or a complete legal-entity map."
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: "The available record consistently identifies Bin Chen as CEO and co-founder and Marlene Garayzar as a co-founder and senior growth or governance executive. Investor and company announcements describe an experienced, internationally distributed team with backgrounds spanning Capital One, Mastercard, Morgan Stanley, GE Money, HSBC, Intel, and Compartamos, but the assigned sources do not provide a current complete executive roster or board register. The 2024 financing announcement adds Diego Cabrera Canay as CFO, citing prior CFO experience at DLocal and finance leadership at MercadoLibre. This supports functional coverage in finance and underwriting, while founder and key-person dependence remains material because operating continuity is still closely associated with a small set of named leaders."
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, valuation, and operating scale
    body: "Stori has disclosed several large equity and debt financings, but the sources use different denominators and dates that should not be collapsed into one current cash figure. The 2021 company release described $125 million of Series C equity and $75 million of debt; the 2022 release described a $150 million round valuing the company at $1.2 billion; and the 2024 release described $105 million of equity plus $107 million of new debt, or $212 million in combined financing. Forge separately lists a $1.32 billion post-money valuation for an August 2024 Series C-3 entry and warns that its private-company data is not independently audited. User counts also vary by period, from 1.4 million customers in 2022 to 3 million users in the 2024 company release and more than 4 million users in a 2025 report. These differences are evidence of growth claims, not a single audited current metric."
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-open-diligence
    title: Milestones and unresolved diligence
    body: "The milestone sequence shows a progression from founding and initial credit-card launch to major financing, unicorn status, regulatory expansion, and product broadening. Stori's acquisition of or expansion through the MasCaja Sofipo license enabled deposit and savings products, and the official product page now presents a multi-product app. Partnerships have extended the distribution model into co-branded cards and remittance receipt through Félix Pago. At the same time, the evidence does not provide a current audited headcount, revenue or run-rate, cohort retention, loss curves, customer concentration, or a complete board and control structure. A diligence process should therefore verify current legal entities, regulatory permissions, financing covenants, valuation marks, user definitions, and whether stated customer counts represent active users, cardholders, deposit users, or cumulative accounts."
    claimRefs: [CO015, CO016, CO017, CO018]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Multi-product expansion is evidenced
    body: "The official product surface and financing disclosures show a transition from a single credit-card proposition toward deposits, investments, payments, remittances, and merchant tools."
    claimRefs: [CO003, CO015, CO016]
  - calloutType: risk
    title: Private-market metrics need reconciliation
    body: "Valuation and user figures are period-specific and issuer-specific; neither the latest valuation nor the user denominator should be treated as a current audited operating metric."
    claimRefs: [CO012, CO013, CO014]
