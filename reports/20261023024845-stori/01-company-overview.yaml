  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: A current private-market mark, secondary transaction evidence, cap table, and financing terms after the 2024 round.
      whyItMatters: The latest observed valuation is a transaction or estimated post-money mark rather than a current liquid price or audited fair value.
      diligencePath: Request the latest board-approved valuation, cap table, preferred terms, secondary activity, and lender or investor valuation materials.
      relatedQuestionRefs: [QO005, QO009]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: operating-scale
      missingEvidence: Reconciled active customers, cardholders, deposit users, revenue, run-rate, headcount, and geographic operating metrics.
      whyItMatters: Public user counts use different dates and definitions and cannot substitute for active cohorts or financial scale.
      diligencePath: Request monthly active users, funded accounts, card activation, revenue by product, headcount by function, and location data for the latest twelve months.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Current board composition, committee structure, ownership/control rights, and succession coverage.
      whyItMatters: A concentrated leadership structure can create execution and key-person risk that is not visible in financing announcements.
      diligencePath: Obtain the current board register, shareholder agreement, reserved-matters schedule, executive employment terms, and succession plan.
      relatedQuestionRefs: [QO003, QO004]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: minor
      topic: customers
      missingEvidence: A source-reconciled definition for the 3 million and more-than-4-million user figures.
      whyItMatters: The figures may measure different populations such as registered users, cardholders, deposit users, or combined accounts.
      diligencePath: Request a metric dictionary and monthly bridge from registered users to active card, deposit, and investment customers.
      relatedQuestionRefs: [QO006]
      relatedTableRefs: [TO001]
    - type: conflicting-data
      severity: minor
      topic: identity
      missingEvidence: A primary legal record that reconciles the 2018 and 2019 founding-year references.
      whyItMatters: Founding year is a basic identity fact and should not depend on inconsistent third-party profiles.
      diligencePath: Obtain incorporation records and distinguish legal formation from the start of commercial operations.
      relatedQuestionRefs: [QO001, QO008]
      relatedTableRefs: [TO001]

