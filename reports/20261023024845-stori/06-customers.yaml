chapter:
  number: 6
  title: Customers
  summary: Stori has demonstrated material customer acquisition and product expansion in Mexico, but public evidence is stronger for applications, active-user counts, and named channel launches than for retention, cohort durability, or customer economics. The evidence supports a broad underbanked consumer target and several distribution experiments, while leaving concentration and repeat-use questions open.
sections:
  - id: customer-segments
    title: Customer segments and distribution
    body: Stori's core customer is an underserved or underbanked Mexican consumer seeking first access to revolving credit, with the company describing mass-middle and emerging-middle income populations as its target. The available evidence also shows a multi-product expansion from cards into deposits, investment products, cashback, payments, and merchant acceptance, which broadens the possible buyer and usage surface but does not by itself establish cross-sell or durable engagement. A co-branded Farmacias Similares card targets first-time banking consumers through a physical retail network, while the company's app remains the onboarding and compliance surface. This suggests a distribution model that combines direct digital acquisition with partner-led reach, but the public record does not disclose channel-level customer mix, CAC, or partner concentration.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and usage proof
    body: >-
      Public milestones indicate rapid acquisition: Lightspeed reported more than one million Mexican applications by early 2021, Stori reported more than two million applications in November 2021, and Reuters reported more than three million clients in 2024. Bloomberg Línea separately described more than three million active users and said Stori was the first credit-card provider for about 80% of its cardholders, although that account is an interview-based company disclosure rather than an independently audited cohort series. These measures are not interchangeable: applications, clients, active users, and first-card status have different denominators and periods. Usage evidence is directional rather than complete, with Lightspeed reporting high activity and over 20% of transactions in e-commerce, but no public retention, renewal, utilization, or cohort curves.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named deployments, retention, and concentration
    body: Named customer proof is visible in partner-linked products rather than in audited customer references. Farmacias Similares launched a Mastercard co-branded card for first-time customers, with digital onboarding, biometric validation, and retail rewards; Stori's public product surface also lists Stori Green, Stori Black, Cuenta+, Investment+, Stori Pro, and Stori Tap. Lightspeed's 2021 account names Netflix, DiDi, Mercado Libre, and Uber among merchants used by cardholders, while Contxto documents the expansion into savings and investment products after the MasCaja acquisition. These examples establish use cases and product breadth, not production depth, renewal, or customer profitability. No retained source supplies NRR, GRR, churn, contract duration, cohort vintage performance, satisfaction trend, or customer concentration, so durability remains a material diligence gap.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
  - id: customer-implications
    title: Investment implications
    body: >-
      The customer case is strongest where scale and access are the objective: Stori has reported millions of applicants or users, operates a fully digital acquisition path, and uses retail and e-commerce partnerships to reach consumers outside traditional banking. The case is weaker on durability and economics because the public evidence does not connect reported scale to active-card frequency, repayment quality, retention, or contribution margin. A partner-led expansion can lower acquisition friction and increase distribution, but it can also create dependence on counterparties and incentives that may not persist. Before treating the customer base as a durable moat, diligence should reconcile the different population measures, obtain cohort and repayment data by acquisition channel, and test whether multi-product adoption is repeat behavior or merely product availability.
    claimRefs: [CU007, CU008, CU012, CU013, CU014]
