  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Monthly or quarterly cohort tables showing activation, purchase frequency, repayment, renewal, churn, GRR, and NRR by card vintage and acquisition channel."
      whyItMatters: "Reported applications, clients, and active users establish scale but cannot show whether customer relationships are durable or economically attractive."
      diligencePath: "Request anonymized cohort waterfalls and vintage loss/retention data for direct, retail-partner, and co-branded acquisition channels."
      relatedQuestionRefs: [QU004, QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: "A complete current register of named customers and partners with production status, deployment scope, outcomes, and commercial terms."
      whyItMatters: "Public examples mix partner launches, merchant usage, and product listings, so they do not establish the breadth or depth of production adoption."
      diligencePath: "Obtain a customer reference list with active status, first-use date, product, geography, and measurable outcome for a representative sample."
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Customer and partner concentration by balances, active accounts, origination volume, revenue, and acquisition spend."
      whyItMatters: "Retail and co-brand channels may improve reach but can expose Stori to counterparty bargaining power or sudden distribution loss."
      diligencePath: "Review the top-10 customer, partner, and channel concentration schedule and termination provisions."
      relatedQuestionRefs: [QU005, QU008]
    - type: stale
      severity: minor
      topic: customer-scale
      missingEvidence: "A current 2026 reconciliation of applications, approved accounts, active users, funded balances, and repeat transactors."
      whyItMatters: "The retained public metrics span 2021-2024 and use different denominators, limiting direct comparison with the refresh date."
      diligencePath: "Request a dated KPI bridge from applications through active and repeat customers, with definitions and period-end denominators."
      relatedQuestionRefs: [QU002, QU009]
