callouts:
  - calloutType: strength
    title: "Scale and access are evidenced"
    body: "Multiple dated sources report millions of applicants, clients, or active users, and the evidence ties Stori to first-credit access for a large share of cardholders."
    claimRefs: [CU005, CU007, CU008, CU009]
  - calloutType: risk
    title: "Durability is not yet evidenced"
    body: "The retained public record does not provide cohort retention, churn, repayment, or partner concentration data, so customer scale should not be treated as recurring economic value without private diligence."
    claimRefs: [CU013, CU014]
