  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: credit-loss
      missingEvidence: Monthly vintage loss curves, first-payment default, roll rates, reserve methodology, and approval-quality trends by product and channel.
      whyItMatters: Customer counts and approval rates cannot show whether lending growth creates acceptable risk-adjusted returns or hidden loss acceleration.
      diligencePath: Request a lender data room export covering at least 24 months of cohorts, reconciled to management accounts and funding facilities.
      relatedQuestionRefs: [QR007, QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: deposit-economics
      missingEvidence: Deposit balances, asset duration, funding cost, liquidity buffer, repricing behavior, and stress tests supporting the 15% yield.
      whyItMatters: A high advertised yield can create liquidity or margin pressure even when regulatory permissions are in place.
      diligencePath: Obtain ALM policy, liquidity coverage reports, product terms, and sensitivity cases for rate and withdrawal shocks.
      relatedQuestionRefs: [QR002]
    - type: missing-source
      severity: material
      topic: incidents
      missingEvidence: Current regulatory examination status, privacy and cyber incidents, uptime, complaints, enforcement, and remediation logs.
