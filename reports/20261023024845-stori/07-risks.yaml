chapter:
  number: 7
  title: Risks
  summary: Stori has built a regulated, multi-product consumer-finance platform, but its risk profile is rising with product breadth, a debt-funded lending program, high-yield deposits, and partner-led distribution. Public evidence supports a monitored research-more posture; the largest unresolved items are portfolio performance, deposit economics, operational incidents, and partner concentration.
sections:
  - id: regulatory-and-financial
    title: Regulatory and financial exposure
    body: >-
      Stori operates through a Mexican Sofipo structure supervised by the CNBV, and public
      coverage describes approval to acquire MasCaja as the route to deposits and broader
      financial products. That structure is a meaningful mitigation relative to an unlicensed
      lending model, but it also expands the surface area for regulatory reporting, consumer
      protection, liquidity, and governance scrutiny. The 2024 financing combined $105 million
      of equity with $107 million of debt; Bloomberg Línea reported that debt proceeds would be
      used for loans while equity would fund technology and product expansion. This is not
      evidence of cash burn or portfolio losses, but it does create a financing dependency that
      should be tested against vintage loss curves, reserve policy, and debt covenants. The
      company also markets a 15% annual deposit yield and says it is sustainable with the right
      structure; public sources do not provide the spread, duration, liquidity buffer, or stress
      assumptions needed to validate that statement.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
    tableRefs: [TR001]
  - id: operating-and-partner
    title: Operating, fraud, and dependency exposure
    body: >-
      Stori's product surface now spans cards, deposits, investments, payments, and partner
      programs. The Farmacias Similares co-branded card uses Stori's platform for compliance and
      risk assessment and requires identity, address, contact, and biometric checks. Those
      controls are positive evidence of a designed onboarding process, not evidence that fraud,
      credit losses, outages, or complaints are low. The same partnership gives Stori a physical
      distribution network and transaction data while making execution dependent on a major
      retail counterparty, Mastercard acceptance, and the quality of partner-led acquisition.
      The assigned public evidence does not establish partner revenue concentration, service-level
      performance, incident history, or customer outcomes. A risk committee should therefore
      monitor approval quality, fraud loss, first-payment default, uptime, complaint rates, and
      partner renewal economics by channel rather than treating product launch as proof of
      durable adoption.
    claimRefs: [CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR002, TR003]
  - id: thesis-breaks
    title: Residual exposure and thesis-break triggers
    body: >-
      The current evidence supports engagement but not a clean risk-adjusted underwriting case.
      Stori reports more than three million customers and a 99% approval rate, yet those are
      scale and access metrics rather than proof of repayment, retention, or contribution
      margin. The central thesis breaks if credit losses, fraud, or funding costs rise faster
      than pricing and deposit spread; if the Sofipo structure cannot support promised liquidity
      or yield; if a material compliance, privacy, or cyber incident occurs; or if a key retail,
      payments, or funding partner exits. The practical diligence path is to obtain monthly
      cohort and loss data, reserve and liquidity policies, regulatory examination status,
      incident and complaints logs, partner contracts, and debt terms. Until those are available,
      residual exposure should be treated as high for financial and regulatory risk and medium to
      high for partner and operational risk, with explicit kill criteria rather than a claim that
      no incident exists.
    claimRefs: [CR012, CR013, CR014, CR015, CR016]
    figureRefs: [FR001]
