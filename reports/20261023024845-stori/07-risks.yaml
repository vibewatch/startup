      - ["High-yield deposit economics", "Mexico; 15% annual yield reported for Cuenta+", "Medium", "High", "Management says yield is sustainable with the right structure", "High because spread and stress assumptions are undisclosed", "Reconcile asset yield, funding cost, duration, liquidity buffer, and repricing sensitivity"]
      - ["Consumer-credit and onboarding compliance", "Mexico; digital underwriting and biometric checks described for a partner card", "Medium", "High", "Identity and documentation requirements plus platform risk assessment", "Medium-high because fraud, complaints, and model governance are not public", "Review model validation, fair-lending controls, complaint trends, fraud losses, and regulator correspondence"]
    notes: Public sources describe regulatory status and controls; likelihood and residual exposure are analyst assessments pending company and regulator diligence.
    enumerationScope:
      coverage: partial
      basis: Publicly described Mexican regulatory and legal exposures for Stori's deposit, credit, and digital onboarding activities as of 2026-10-23.
    claimRefs: [CR004, CR005, CR006, CR007, CR009, CR012]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Credit loss and model drift as approval expands", "Medium-high", "High", "Underwriting platform and data-driven assessment are described", "High", "No vintage loss curves, reserve methodology, approval-quality trend, or denominator is public"]
      - ["Fraud or identity failure in digital onboarding", "Medium", "High", "Biometric and document checks are described for the Farmacias card", "Medium-high", "No fraud-rate, chargeback, account-takeover, or incident series is public"]
      - ["Service outage, privacy incident, or customer-complaint escalation", "Unknown", "High", "Customer-service channel and app-based controls are visible", "High", "Assigned sources do not establish incident, uptime, privacy, or complaint performance"]
      - ["Execution complexity from cards, deposits, investments, and payments", "Medium", "Medium-high", "Single-app product integration and regulated structure are described", "Medium-high", "No product-level profitability, staffing, reconciliation, or control metrics are public"]
    notes: Likelihood, severity, maturity, and residual exposure are qualitative assessments; no absence-of-incident conclusion is implied by missing public records.
    claimRefs: [CR007, CR009, CR010, CR012, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Retail acquisition and transaction data", "Farmacias Similares", "Unknown; public source describes a broad physical network but not revenue share", "Partner termination or weak conversion reduces new-user acquisition and underwriting data", "High", "Co-branded product and Mastercard network", "High until contract, cohort, and renewal data are reviewed"]
      - ["Card acceptance and payments", "Mastercard and merchant ecosystem", "Unknown", "Network or merchant acceptance disruption impairs card utility and customer trust", "Medium-high", "International network and digital/physical card formats", "Medium"]
      - ["Debt capital and lending capacity", "Goldman Sachs and Davidson Kempner", "Unknown; $107 million debt tranche reported", "Refinancing, covenant, or funding-cost shock constrains loan growth or liquidity", "High", "Equity plus debt financing and diversified named investors", "High until debt terms, maturity, and borrowing-base data are reviewed"]
      - ["Regulated deposit platform", "Sofipo / CNBV framework and MasCaja path", "Unknown", "Regulatory restriction or liquidity mismatch limits deposits, yield, or product expansion", "High", "License/approval path and regulated entity", "High pending current status and stress testing"]
    notes: Counterparty concentration is not quantified in the assigned evidence; unknown fields are deliberate gaps, not zero concentration.
    claimRefs: [CR002, CR003, CR006, CR008, CR015]

figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Qualitative risk heatmap showing where public evidence leaves the greatest residual exposure.
    data:
      columns: [Likelihood, Impact, Residual exposure]
      rows:
        - label: Credit loss and model drift
          values: [Medium-high, High, High]
        - label: Deposit yield and liquidity mismatch
          values: [Medium, High, High]
        - label: Regulatory and consumer-compliance failure
          values: [Medium, High, Medium-high]
        - label: Partner or debt-provider dependency
          values: [Medium, High, High]
        - label: Fraud, privacy, or outage event
          values: [Unknown, High, High]
        - label: Execution complexity across products
          values: [Medium, Medium-high, Medium-high]
    approximationNotes: Likelihood and residual exposure are qualitative analyst assessments based on the cited public evidence and explicit missing-data gaps; they are not measured probabilities.
    claimRefs: [CR004, CR007, CR012, CR013, CR014, CR015]

callouts:
  - calloutType: risk
    title: The key unknown is portfolio quality, not customer reach
    body: More than three million customers and a 99% approval rate demonstrate reach, but they do not disclose repayment, fraud, cohort retention, or unit economics. Investment decisions should require vintage-level loss and contribution data before treating scale as risk reduction.
    claimRefs: [CR010, CR011, CR013]
  - calloutType: assumption
    title: Treat missing incident evidence as unresolved
    body: The assigned sources do not establish that Stori has had no outage, privacy event, enforcement action, or material complaint trend. The appropriate conclusion is an evidence gap with a defined diligence request, not a clean safety record.
    claimRefs: [CR012, CR016]

