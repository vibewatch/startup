company:
  name: "Stori"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Stori competes in a crowded Mexican financial-services market against scaled digital
    challengers, ecosystem distributors, and incumbent banks. Its multi-product breadth,
    thin-file credit focus, and partner-led distribution are meaningful differentiators,
    but larger rivals have stronger customer reach and Stori's reported credit-risk metrics
    make underwriting durability the central competitive question.
sections:
  - id: "competitive-landscape"
    title: "Competitive landscape and scale"
    body: >-
      Stori sits between a specialist inclusion lender and a broader digital financial
      platform. Its relevant alternatives therefore extend beyond app-based credit-card
      providers to Nu and Klar, ecosystem businesses such as Mercado Pago and Spin by OXXO,
      full-license incumbents such as BBVA, and the cash-based status quo. The category is
      not settled: one 2026 analyst view separates digitized incumbents, digital-native
      challengers, and embedded-finance ecosystems, while Tracxn uses a narrower global
      credit-building peer set. Scale is uneven. Reuters reported in August 2024 that Stori
      had more than 3 million clients, versus 7 million for Nubank and 1.5 million for Ualá
      in Mexico at that time. More recent analyst figures put Nu far ahead and show that
      physical and commerce ecosystems can distribute financial products without relying
      only on paid app acquisition.
    claimRefs: ["CP005", "CP010", "CP011", "CP016"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "product-pricing-and-distribution"
    title: "Product, pricing, and distribution competition"
    body: >-
      Stori's strongest differentiation is the combination of accessible credit with an
      expanding savings, investment, payments, and merchant-tool bundle. Its current app
      listing includes credit and debit cards, savings, fixed-term investment, bill payment,
      remittance receipt, and phone-based card acceptance. Distribution is also becoming
      less purely digital: the 2026 Farmacias Similares card gives Stori access to a national
      retail footprint, while an earlier Shein card targeted online shoppers. These
      partnerships can lower acquisition friction and add transaction context, but they
      also create channel dependence and do not establish superior unit economics. Public
      list terms show aggressive customer acquisition across the category. Stori markets
      no-annual-fee cards and partner cashback, while Klar advertised promotional deposit
      yields; realized pricing, risk-adjusted margin, and renewal economics remain
      undisclosed and should not be inferred from those offers.
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP013", "CP014"]
    tableRefs: ["TP002", "TP003"]
  - id: "moat-and-displacement-risk"
    title: "Moat durability and displacement risk"
    body: >-
      Stori's funding capacity and reported profitability provide room to keep investing:
      Reuters and Bloomberg Línea both reported a US$212 million 2024 financing split
      between US$105 million of equity and US$107 million of debt. The more important moat,
      however, is whether thin-file underwriting improves with data while preserving
      acceptable loss performance. Legal Paradox reported that Stori produced MXN 253.2
      million of FY2025 net income and thirteen consecutive profitable months through March
      2026, but also reported an 11.3% non-performing-loan ratio, above Nu's 6.0% and Klar's
      9.1%. That combination supports a differentiated risk appetite rather than a proven
      durable underwriting advantage. Licensing is also converging as peers acquire or
      obtain broader permissions. Product breadth can be copied, customers can multi-home,
      and better-capitalized banks or commerce platforms can subsidize acquisition. The
      defensible case therefore depends on cohort-level loss curves, repeat borrowing,
      cross-product attachment, partner concentration, and switching behavior that public
      sources do not disclose.
    claimRefs: ["CP006", "CP007", "CP008", "CP009", "CP012", "CP015"]
