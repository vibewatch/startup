      - ["Nu", "Scaled digital-native challenger", "15 million Mexico users reported for March 2026", "Large direct consumer base and a broader banking path", "Brand scale, deposits, and full-stack product expansion", "Public scale does not by itself show segment-level profitability or retention"]
      - ["Klar", "Digital-native challenger / consolidator", "More than 4.7 million users reported in 2026; 2025 financing cited by the analyst", "Digital account, credit, deposits, and acquisition-led license expansion", "M&A path toward a bank and broad savings packaging", "Competitor-issued rates are promotional; analyst reported elevated credit provisions"]
      - ["Mercado Pago", "Commerce ecosystem", "83 million fintech monthly active users globally in Q1 2026; Mexico fintech revenue reported up 75.7% year over year", "Embedded distribution through Mercado Libre's commerce network", "Payments data and potentially lower acquisition cost", "Mexico-only active-user and directly comparable credit-risk data were not available"]
      - ["BBVA Mexico", "Digitized incumbent", "More than 27 million customers reported in 2026", "Established trust, deposits, branches, and banking license", "Capital, product breadth, and incumbent distribution", "Legacy processes may be less tailored to thin-file first-card users"]
      - ["Cash / internal build", "Status quo or self-managed alternative", "No comparable public scale metric in the assigned evidence", "Immediate familiarity and no new provider relationship", "Avoids onboarding and app switching", "Cannot replicate formal credit-building or insured deposit products; economics are unquantified"]
    notes: >-
      Scale metrics have different dates, geographies, and denominators and are not ranked as
      directly comparable; the table preserves source periods and marks unavailable fields.
