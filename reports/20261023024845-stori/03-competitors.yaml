      - ["Deposits and savings", "Cuenta+ and savings products", "Deposit product and banking expansion reported", "Sight account, yield funds, and term deposits advertised", "Banks have broad deposit capability; Mercado Pago offers ecosystem finance", "Product availability is converging, so rates and trust can dominate"]
      - ["Investment products", "Fixed-term Investment+ advertised", "Broad full-stack direction reported; exact comparable term product not verified", "Multiple term-deposit modalities advertised", "Incumbents generally have broader shelves; exact like-for-like terms not compared", "Breadth alone is unlikely to remain a durable moat"]
      - ["Embedded / partner distribution", "Farmacias Similares and Shein co-brands", "No equivalent partner evidence retained for this chapter", "No equivalent partner evidence retained for this chapter", "Mercado Pago and Spin benefit from native commerce or retail footprints", "Stori has credible channels but ecosystems control larger captive audiences"]
      - ["Merchant acceptance", "Stori Tap turns a phone into a card terminal", "Unknown in retained evidence", "Unknown in retained evidence", "Mercado Pago has a native payments ecosystem; incumbent tools not compared", "Merchant tools widen engagement but expose Stori to specialist acquiring competition"]
