      - ["Klar yield funds", "15.00% fixed annual rate advertised for Light and Plus", "MXN 100 minimum; calculation valid through May 31, 2026", "Yield-bearing balance modality", "Promotional terms were subject to change; current rate was not verified", "Aggressive savings offers can pressure Stori's acquisition and funding costs"]
    notes: >-
      These are public list terms, not realized customer pricing or unit economics; Klar
      rates are preserved with their May 31, 2026 validity date and treated as stale.
