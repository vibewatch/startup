      - ["Accept card payments", "Receive payments without a dedicated terminal", "Stori Tap on a phone", "Lower apparent hardware friction", "Settlement, fraud, and merchant uptime are not public"]
    notes: "Benefits are described as product mechanisms or intended use cases, not independently measured outcomes; null operational metrics require diligence."
