  evidenceGaps:
    - type: missing-source
      severity: material
      topic: assurance
      missingEvidence: Independent security assessment, penetration-test summary, incident history, uptime and recovery objectives, and control ownership.
      whyItMatters: A broad financial-product surface increases the impact of outages, fraud, privacy failures, and operational incidents.
      diligencePath: Request the latest SOC or equivalent control report, penetration-test scope and remediation log, incident register, uptime history, and disaster-recovery test results.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: underwriting
      missingEvidence: Vintage-level approval, delinquency, loss, fraud, and model-validation metrics by product and customer segment.
      whyItMatters: Public descriptions of AI, Big Data, or underwriting experience do not demonstrate risk-adjusted performance.
      diligencePath: Obtain model cards, validation reports, adverse-action monitoring, vintage curves, override rates, and fairness testing under confidentiality.
      relatedQuestionRefs: [QE003, QE007]
    - type: missing-source
      severity: material
      topic: product-economics
      missingEvidence: Module-level activation, attach, retention, contribution margin, and partner-channel economics.
