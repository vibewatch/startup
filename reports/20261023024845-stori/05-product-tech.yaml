    columns: [Layer or process, Role, Dependency, Public evidence, Risk or diligence gap]
    rows:
      - ["Mobile experience", "Application, account management, payments", "Mobile connectivity", "App-led customer journey", "App reliability and accessibility"]
      - ["Identity and compliance", "Applicant screening and biometric validation", "Identity documents, address, email, phone, and biometrics", "Partner-card onboarding description", "False positives, fraud controls, and privacy governance"]
      - ["Underwriting and data", "Credit decisions and line management", "Internal data and credit-bureau or partner inputs", "AI and Big Data models are described", "Model drift, explainability, validation, and adverse-action controls"]
      - ["Servicing automation", "Reminders, statements, and basic questions", "Messaging and customer-support systems", "AI automation is described", "Escalation, hallucination, and complaint handling"]
      - ["Payments and cards", "Authorization, billing, and rewards", "Mastercard and payment rails", "Card and co-brand products are described", "Rail outages, settlement, fraud, and partner economics"]
      - ["Regulated deposits", "Savings and fixed-term investments", "SOFIPO license and acquired MasCaja perimeter", "Deposit and investment products are described", "Capital, liquidity, conduct, and regulatory controls"]
      - ["Distribution partnerships", "Retail and embedded acquisition", "Farmacias Similares, Shein, and other partners", "Co-branded and partner channels are described", "Concentration, renewal, data-sharing, and channel CAC"]
    notes: "The architecture is an evidence-based operating model assembled from public product, partner, official, and reporting sources; it is not a disclosed internal system diagram."
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE011, CE012, CE013]
figures:
