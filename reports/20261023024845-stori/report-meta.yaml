  topStrengths:
    - Repeated institutional financing and debt access support continued strategic and operating optionality.
    - Multi-product expansion and partner distribution broaden the addressable customer and usage surface.
    - Reported user scale and first-credit access indicate meaningful reach among underserved Mexican consumers.
  topRisks:
    - Current credit losses, vintage performance, reserves, and portfolio profitability are not publicly disclosed.
    - High-yield deposits and debt-funded lending create funding, liquidity, and regulatory sensitivity.
    - Retention, partner concentration, governance, and current private-market valuation remain insufficiently verified.
  unresolvedGaps:
    - Updated private-market mark, cap table, and secondary price discovery after the 2024 financing.
    - Cohort retention, activation, multi-product attach, and repayment quality by acquisition channel.
    - Vintage loss curves, reserve methodology, delinquency trend, and current liquidity or debt covenants.
    - Deposit-balance behavior, trust and complaint trends, and regulatory status across products.
    - Partner-channel concentration, CAC, renewal or termination economics, and current governance structure.
