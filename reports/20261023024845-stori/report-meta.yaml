companyProfile:
  summary: >-
    Stori is a Mexico-based consumer-finance platform that began with app-based credit cards for underserved consumers
    and has expanded into deposits, investments, payments, remittances, and merchant acceptance. The company has
    disclosed substantial equity and debt financing and operates through a regulated deposit entity, but public evidence
    does not establish current revenue, portfolio quality, retention, or a complete governance picture.
