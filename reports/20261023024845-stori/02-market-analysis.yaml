    title: Evidence-constrained market sizing lenses
    columns:
      - Publisher
      - Period
      - Geography and denominator
      - Value
      - Method or metric
      - Confidence and limitation
    rows:
      - - Lightspeed Venture Partners
        - 2021 article using 2019 context
        - Mexico, total population
        - Approximately 130 million people
        - Macro population reference
        - Low; historical investor-issued context
      - - Lightspeed Venture Partners
        - "2019"
        - Mexico, population and transactions
        - 37% had bank accounts; over 85% of transactions were cash
        - Historical inclusion and payment-use indicators
        - Low; stale and two different denominators
      - - Reuters via Yahoo
        - "2024"
        - Mexico, total population
        - Just over half used some financial product
        - Condusef figure reported by Reuters
        - Medium; broad product definition, not formal credit
      - - FinTech Weekly
        - First half of 2025 context
        - Mexico, adults
        - About one-third had formal credit
        - Secondary report on formal-credit penetration
        - Medium; no underlying survey table in fetched text
      - - Reuters via Yahoo and Stori release
        - "2024"
        - Stori clients or users
        - More than 3 million
        - Company-reported installed customer base
        - High for the reported figure; not active-use or revenue evidence
      - - FinTech Weekly
        - First half of 2025 context
        - Stori users in Mexico
        - 3.7 million users; 99% card approval rate
        - Company-reported scale and approval
        - Medium; activity, approval denominator, and cohort quality undisclosed
      - - Contxto
        - "2023"
        - Mexicans targeted by company objective
        - 80 million people
        - Stori aspiration for credit-card access
        - Low as sizing evidence; objective is not measured TAM or SAM
    notes: >-
      Values use different populations, definitions, and vintages; they are not additive,
      do not establish CAGR, and cannot be converted into TAM/SAM/SOM without current
      official denominators, spend, eligibility, and risk-adjusted economics.
    claimRefs: [CM002, CM003, CM004, CM005, CM006]
  - id: TM003
    title: Segment, buyer, user, payer, and adoption map
    columns:
      - Segment
      - Buyer
      - User
      - Payer or budget owner
      - Workflow
      - Adoption trigger
    rows:
      - - First formal-credit seeker
        - Household applicant
        - Cardholder
        - Cardholder
        - Apply digitally, receive an entry line, spend, repay, and build history
        - Rejection by a traditional bank or lack of formal income proof
      - - Mass-market digital saver
        - Household saver
        - Account holder
        - Account holder
        - Open Cuenta+, deposit pesos, save, transfer, and use debit
        - Yield, liquidity, and an app-based account
      - - Multi-product household
        - Existing Stori user
        - Cardholder and account holder
        - Household
        - Combine credit, debit, savings, investment, cashback, and bill payment
        - Convenience and benefits tied to broader product use
      - - Partner-channel consumer
        - First-time co-brand applicant
        - Pharmacy or e-commerce shopper
        - Cardholder; partner funds or shares incentives under undisclosed terms
        - Apply through Stori, transact on Mastercard, and earn partner rewards
        - Retail access, no annual fee, and targeted cashback
      - - Remittance recipient
        - Mexican household
        - Digital-account holder
        - Recipient household
        - Receive funds from the United States and manage them in-app
        - Consolidating incoming funds with savings and payments
      - - Micro-merchant
        - Small-business operator
        - Phone-based seller
        - Merchant
        - Use Stori Tap to accept card payments from a phone
        - Low-hardware path to digital acceptance
    notes: >-
      This is a source-bounded segmentation, not an exhaustive customer enumeration;
      partner economics, segment sizes, conversion, retention, and attach rates remain undisclosed.
    claimRefs: [CM008, CM009, CM010, CM011, CM015]
figures:
  - id: FM001
    title: Market-sizing evidence ladder
    type: pyramid
    summary: >-
      Six published reference points show the size of the inclusion gap and Stori's
      disclosed reach without asserting that the layers form a nested TAM/SAM/SOM.
    data:
      items:
        - label: Mexico population reference
          displayValue: Approximately 130 million
          value: 130
          unit: million people
          detail: Historical 2021 investor article; macro reference only.
          claimRefs: [CM004]
        - label: Cash transaction share
          displayValue: More than 85%
          value: 85
          unit: percent of transactions
          valueNote: Historical 2019 context reported in a 2021 investor article.
          claimRefs: [CM004]
        - label: Bank-account penetration
          displayValue: 37%
          value: 37
          unit: percent of Mexicans
          valueNote: Historical 2019 context; not the same as formal-credit access.
          claimRefs: [CM004]
        - label: Any financial-product use
          displayValue: Just over half
          value: 50
          unit: percent of population, lower bound
          valueNote: 2024 Reuters report citing Condusef; exact share not disclosed.
          claimRefs: [CM003]
        - label: Formal-credit access
          displayValue: About one-third
          value: 33
          unit: percent of adults, approximate
          valueNote: First-half 2025 context from FinTech Weekly.
          claimRefs: [CM002]
        - label: Stori reported users
          displayValue: 3.7 million
          value: 3.7
          unit: million users
          valueNote: Company-reported figure carried by FinTech Weekly.
          claimRefs: [CM006]
    approximationNotes: >-
      The points mix counts and percentages, populations and adults, and 2019-2025
      vintages. They are not nested, additive, or a conversion funnel; pyramid width
      indicates authored order only. "Just over half" is displayed at a 50% lower-bound
      proxy solely to retain the source wording and is not a precise estimate.
    claimRefs: [CM016]
callouts:
  - calloutType: risk
    title: No defensible TAM/SAM/SOM from the assigned evidence
    body: >-
      The public record demonstrates unmet need but does not provide a current official
      adult denominator, eligible risk population, annual spend pool, or Stori-specific
      conversion and unit economics. Treating the 80-million-person aspiration as TAM
      would overstate evidence quality.
    claimRefs: [CM016]
