artifact: market-analysis
slug: stori
runDate: 2026-10-23
company:
  name: Stori
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Stori addresses Mexico's underbanked consumer-finance market through entry-level
    credit, deposits, loans, partner cards, and adjacent merchant tools. The evidence
    shows a large inclusion gap and growing digital-product breadth, but incompatible
    denominators and vintages prevent a defensible TAM/SAM/SOM or spend-based valuation
    bridge from the assigned public sources.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Stori's core market is Mexican mass-market consumer finance for people who are
      underserved by traditional bank underwriting. The included boundary covers
      revolving card credit, digital deposit and savings balances, personal loans, and
      partner-distributed cards; the current app also exposes remittance receipt and a
      phone-based merchant-acceptance adjacency. This is not the entire Mexican banking
      market. It excludes prime-bank credit, mortgages, corporate banking, wholesale
      deposits, and full-service international banking. Cash, debit-only use, informal
      borrowing, retailer credit, and established-bank products remain status-quo
      substitutes. The SOFIPO structure expands access but also differentiates the
      deposit proposition from a full-bank account, making regulation and depositor
      protection part of the market boundary rather than a footnote.
    claimRefs: [CM001, CM010, CM011, CM012]
    tableRefs: [TM001]
  - id: sizing-evidence
    title: Sizing evidence, not false precision
    body: >-
      The assigned sources support several sizing lenses but not a single investable
      TAM. A historical investor account put Mexico's population near 130 million and
      described 2019 as only 37% banked, with more than 85% of transactions in cash.
      Later reporting used broader or different denominators: Reuters said just over
      half of the population used some financial product in 2024, while FinTech Weekly
      said about one-third of adults had formal credit and reported 3.7 million Stori
      users. These observations are directionally consistent with an inclusion gap, but
      they are not interchangeable. The chapter therefore preserves period, population,
      and metric differences and treats Stori's 80-million-person aspiration as a
      company objective, not an independently measured addressable market.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The primary buyer, user, and payer is a Mexican household seeking a first formal
      credit product, a way to build credit history, or a higher-yield digital savings
      account. Adoption can begin with a small credit line, then expand into deposits,
      investments, bill payment, cashback, or loans inside the same app. Partner cards
      add a second route: a retailer supplies physical reach and incentives while Stori
      performs digital onboarding and risk assessment. Stori's app listing also presents
      remittance receipt and merchant acceptance, which broaden the user set but should
      be treated as adjacencies until their economics and adoption are disclosed. Budget
      ownership remains with the household for financial products and with the merchant
      for acceptance tools.
    claimRefs: [CM008, CM009, CM010, CM011, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Demand is driven by low formal-credit access, persistent cash use, digital commerce,
      simple app onboarding, and distribution through consumer brands. Product breadth
      can raise engagement and reduce dependence on one card relationship, while funding
      provides lending capacity and product-development resources. The constraints are
      equally material: a 23% reported delinquency ratio as of June, an operating loss
      excluding tax credits in the first half of 2025, persistent sector credit costs,
      and the lower deposit-protection framing of a SOFIPO relative to a full bank.
      Valuation should therefore depend on verified cohorts, loss curves, deposit
      behavior, partner economics, and multi-product attachment rather than multiplying
      a broad inclusion population by an assumed revenue yield.
    claimRefs: [CM007, CM012, CM013, CM014, CM015, CM016]
tables:
  - id: TM001
    title: Market definition and boundary
    columns:
      - Segment or category
      - Included spend or use
      - Excluded spend or substitute
      - Buyer or payer
      - Relevance to Stori
    rows:
      - - Entry-level revolving credit
        - Card purchases, revolving balances, and credit-history building
        - Prime-bank cards, retailer-only credit, cash, and informal borrowing
        - Household cardholder
        - Core credit-card-first proposition
      - - Digital deposits and savings
        - Retail peso balances, savings goals, debit use, and fixed-term investments
        - Wholesale deposits, full-bank services, and uninsured excess balances
        - Household saver
        - Cross-sell enabled after the MasCaja/SOFIPO expansion
      - - Personal loans
        - Digital unsecured consumer borrowing
        - Mortgages, auto finance, secured lending, and business credit
        - Household borrower
        - Reported product within the multi-product platform
      - - Partner and co-branded cards
        - Retail-linked credit, rewards, and first-time formal-credit acquisition
        - Existing Stori-card holders and unrelated partner economics
        - Consumer payer; retail partner as distribution sponsor
        - Extends acquisition through Farmacias Similares and other brands
      - - Remittance-linked account use
        - Receipt of money from the United States into the digital account
        - Full cross-border banking, FX services, and international wire infrastructure
        - Recipient household
        - App-listed adjacency with undisclosed scale
      - - Merchant acceptance
        - Phone-based card acceptance through Stori Tap
        - Full acquiring stack, enterprise payments, and merchant lending
        - Micro-merchant
        - App-listed adjacency outside the core household-credit boundary
    notes: >-
      Boundary is based only on assigned sources; excluded categories and substitutes
      prevent the chapter from treating all Mexican financial-services spend as addressable.
    claimRefs: [CM001, CM009, CM010, CM011, CM012]
