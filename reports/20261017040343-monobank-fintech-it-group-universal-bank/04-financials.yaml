schemaVersion: report-v2
artifact: financials
slug: monobank-fintech-it-group-universal-bank
runDate: 2026-10-17
company:
  name: monobank (Fintech-IT Group / Universal Bank)
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a broad consumer-banking and adjacent-services monetization model for
    monobank, plus very large scale proxies around 10 million users/cards, but it does not disclose
    the realized price list, revenue mix, or unit-economics needed for full underwriting. The 2025
    UMAEF-led round established a $1 billion-plus valuation and additional capital, yet the exact
    amount, terms, cash runway, and mono-specific profitability remain opaque.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: >-
      monobank's public surfaces show a multi-product retail-banking model rather than a single-card
      feature. The company markets debit and credit cards, cash loans, split payments, deposits,
      bill payments, currency exchange, insurance, entrepreneur accounts, and in-app marketplaces,
      which implies several possible revenue pools spanning interest income, interchange, service
      fees, and partner commissions. What public evidence does not provide is a clean price book:
      the official pages repeatedly say rates, fees, and limits are shown in the app before
      confirmation, so list-pricing transparency remains product-by-product and session-specific
      rather than published in a durable investor-facing schedule. Scale is clearly large, with
      third-party and official proxies clustering around 9.9 million active cards/clients and app
      store copy later claiming more than 11 million users, but those figures use different
      denominators and dates, so they are traction proxies rather than one audited operating metric.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics visibility
    body: >-
      The publicly visible operating structure is split between Universal Bank as the regulated bank
      and Fintech-IT Group as the technology developer behind the mono ecosystem. That distinction
      matters because the available evidence mixes bank-level balance-sheet data with holdco-level
      software-company reporting. Kyiv Post, citing Forbes Ukraine, reported that about 90% of the
      holding's 2024 revenue came from FintechBand, while Scroll said the broader group employs
      around 630 specialists and plans further hiring, which points to a material software and
      product-development cost base. The NBU profile adds current bank-level assets, liabilities,
      equity, and profit, but public sources still do not disclose mono-specific CAC, payback,
      portfolio yields, credit losses, provisioning by product, gross margin, or contribution margin
      from adjacent products. That leaves the public record better at proving product breadth and
      scale than proving revenue quality or efficiency.
    claimRefs: [CI006, CI008, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy-and-underwriting-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The latest financing event is strategically important but still incomplete for underwriting.
      Multiple sources agree that the UMAEF-led transaction pushed Fintech-IT Group above a
      $1 billion valuation and brought in its first institutional financial investor plus a group of
      American private investors, while the stated use of proceeds focused on product expansion and
      SME-service growth. However, Kyiv Post also reported that the exact round size was not
      disclosed and only secondary estimates circulated for the stake sold, which means investors
      still cannot infer cash on hand, dilution terms, liquidation preferences, or a next-round
      trigger from public materials alone. Combined with wartime operating context and only
      unconfirmed reporting about legacy legal-risk motivations, the financial verdict is that mono
      looks strategically well positioned and well capitalized relative to local peers, but the
      margin path, holdco cash runway, and bank-level credit-risk sensitivity remain diligence
      blockers rather than investable facts.
    claimRefs: [CI006, CI007, CI009, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Consumer card and payments
        - Debit/credit cards, transfers, bill pay, FX, and everyday transaction activity in the mono app
        - Active cards / users
        - 9.89m active cards at Universal Bank as of 2025-06-01; app-store copy later said 11m+ users
        - Large-scale proxy is corroborated, but revenue mix is undisclosed
        - Break out interchange, fee income, FX spread, and active-user monetization
      - - Consumer lending
        - Credit limits, cash loans, split payments, and installment plans
        - Yield / balances / loss rates
        - Product availability is public; APRs, balances, and credit performance are not
        - Revenue mechanism is clear, realized economics are not
        - Provide vintage yields, NPLs, reserve coverage, and contribution margin by credit product
      - - Deposits and treasury-linked products
        - Deposits in UAH/FX plus government-bond distribution inside the app
        - Deposit balances / cost of funds
        - Deposit products are public; bank liabilities are current, but mono-specific deposit mix is not
        - Funding base is evident, pricing and concentration are opaque
        - Disclose mono deposit balances, blended funding cost, and rate sensitivity
      - - SME / entrepreneur services
        - Business Portal and digital-payment support for SMEs and sole proprietors
        - Accounts / payment volume / take rate
        - Presence is public and proceeds are earmarked to expand SME services
        - Strategy is visible, economics are not
        - Share SME account counts, GPV, take rates, and servicing costs
      - - Adjacent commissions
        - Insurance, marketplace, eSIM, cashback/partner commerce, and other ecosystem services
        - Policies / orders / attach rate / commission
        - Offerings are public but monetization terms are not
        - Likely supplemental rather than core until proven otherwise
        - Quantify attach rates, commission terms, and gross profit by adjacent product
    notes: >-
      Public sources prove product breadth and some scale, but they do not publish realized pricing,
      revenue shares, or mono-specific segment P&L. Current-value cells mix product visibility with
      the few disclosed operating proxies; they are not a booked revenue schedule.
    claimRefs: [CI001, CI003, CI004, CI005, CI009]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Price/unit/contract
      - List vs realized pricing
      - Discounts/unknowns
      - Source
    rows:
      - - Credit limits
        - Terms, rates, and limits shown in-app before confirmation
        - Public evidence shows the disclosure mechanism, not a persistent posted tariff
        - Underwriting still needs APR ranges, utilization, and default-adjusted yield
        - mono website / app-store listings
      - - Split payments
        - Customer-facing interest may be zero because the seller covers it
        - Public evidence shows a promotional/list mechanism only
        - Seller subsidy economics, merchant fees, and loss absorption are undisclosed
        - mono website
      - - Deposits
        - Rates and terms available in the app
        - Public pages confirm product availability, not posted rates
        - Missing current deposit APRs, tenor mix, and repricing behavior
        - mono website / app-store listings
      - - Transfers and bill payments
        - Zero fees are marketed for at least some transfer/payment actions
        - Public evidence indicates a customer-facing claim, not the full fee matrix
        - Missing exceptions, partner economics, FX spreads, and business-account pricing
        - Google Play / Apple App Store listings
      - - Insurance and marketplace services
        - Policy terms and marketplace offers shown before payment or checkout
        - Public evidence shows presence in-app, not commission schedules
        - Missing carrier commissions, seller fees, refunds, and attach-rate data
        - Google Play / Apple App Store listings
    notes: >-
      This is a monetization-mechanism table, not a realized pricing table. The fetched official
      pages repeatedly defer numerical rates, limits, and many fees to in-app flows, so nulls and
      unknowns reflect absent public disclosure rather than missing research effort.
    claimRefs: [CI001, CI003, CI012]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Active cards
        - 9.89m active cards at Universal Bank as of 2025-06-01
        - Medium
        - Best public operating-scale proxy tied to monthly activity
        - Reconcile active cards, customers, and funded accounts
      - - Users / clients
        - 9.9m clients (Sep-2025 company-linked article); 11m+ users (current app-store copy)
        - Medium
        - Shows very large consumer reach but mixed denominators
        - Supply one audited KPI definition and monthly history
      - - Fintech-IT Group 2024 revenue
        - Hr. 3.7bn ($89.6m), with about 90% from FintechBand
        - Medium
        - Only public holdco revenue datapoint in the assigned pool
        - Provide audited revenue by legal entity and by product line
      - - Headcount
        - Around 630 specialists, including roughly 400 IT professionals; +50 planned hires
        - Medium
        - Proxy for fixed operating cost and capacity to launch new products
        - Share payroll mix, contractor share, and headcount by business unit
      - - Universal Bank assets
        - UAH 241,252.5m
        - Medium
        - Indicates current bank balance-sheet scale
        - Map how much balance-sheet intensity is attributable to mono portfolios
      - - Universal Bank liabilities
        - UAH 210,192.3m
        - Medium
        - Proxy for funding base and deposit dependence
        - Break out deposits, wholesale funding, and concentration
      - - Universal Bank equity
        - UAH 31,060.3m
        - Medium
        - Useful for solvency context but not mono-specific capital needs
        - Provide capital ratios and buffers linked to mono growth plans
      - - Universal Bank profit or loss
        - UAH 5,378.2m
        - Medium
        - Suggests current bank-level profitability, but not the app's standalone margin
        - Separate mono unit economics from bank-wide earnings
      - - Latest valuation
        - ">$1bn"
        - Medium
        - Frames financing expectations and return hurdle
        - Disclose round size, security terms, and ownership dilution
      - - CAC / payback / NPL / burn / runway
        - null
        - Low
        - Core underwriting inputs remain unavailable in the assigned public evidence
        - Provide cohort CAC, payback, retention, charge-offs, provisions, cash, and debt schedule
    notes: >-
      Bank-level NBU figures and holdco-level press/interview data are not the same denominator, so
      this table intentionally keeps them side by side rather than forcing false comparability. Null
      means the public assigned pool did not disclose the metric in a supportable form.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI010, CI011, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports the activity-to-revenue logic, but not the realized economics.
    data:
      nodes:
        - id: scale
          label: Customers / cards
          value: 9.89
          unit: million active cards
          summary: Public scale proxies cluster around roughly 10 million clients/cards.
        - id: banking
          label: Core banking activity
          summary: Transfers, bill pay, FX, deposits, and daily account usage run through the mono app.
        - id: credit
          label: Credit products
          summary: Credit limits, cash loans, installments, and split payments add lending monetization.
        - id: adjacent
          label: Adjacent services
          summary: Insurance, SME tools, eSIM, and marketplaces broaden commission opportunities.
        - id: revenue
          label: Revenue pools
          summary: Interest, interchange, fees, and partner commissions are plausible pools, but not publicly split.
        - id: cost
          label: Cost / capital filters
          summary: Funding cost, provisions, compliance, servicing, and product investment determine margin quality.
        - id: outcome
          label: Residual profit / financing need
          summary: Public evidence reaches bank-level profit and a new funding round, not mono-specific burn or runway.
      edges:
        - from: scale
          to: banking
          label: Acquisition and daily usage
        - from: scale
          to: credit
          label: Credit conversion
        - from: scale
          to: adjacent
          label: Ecosystem cross-sell
        - from: banking
          to: revenue
          label: Payments and balance activity
        - from: credit
          to: revenue
          label: Lending income
        - from: adjacent
          to: revenue
          label: Commissions / partner economics
        - from: revenue
          to: cost
          label: Gross-to-net margin bridge
        - from: cost
          to: outcome
          label: Determines self-funded growth vs. new capital need
    approximationNotes: >-
      This is a conceptual bridge based on disclosed products, scale proxies, and bank-level
      financial context. The assigned public evidence does not disclose product-level revenue shares,
      loss rates, or gross-margin math, so no cumulative or value-proportional bridge is asserted.
    claimRefs: [CI001, CI003, CI004, CI011, CI012]
callouts:
  - calloutType: insight
    title: Broad monetization surface, narrow public disclosure
    body: >-
      The mono ecosystem clearly spans cards, lending, deposits, payments, entrepreneur tools, and
      adjacent commission products, but the public record discloses the existence of those levers
      far more clearly than the economics each lever contributes.
    claimRefs: [CI001, CI003, CI012]
  - calloutType: risk
    title: The latest valuation is more visible than the financing terms
    body: >-
      The UMAEF-led round established a $1 billion-plus valuation and new institutional backing, but
      public sources still do not disclose round size, security terms, cash balances, or runway,
      which keeps capital-adequacy underwriting unresolved.
    claimRefs: [CI006, CI007, CI012]
  - calloutType: recommendation
    title: Request a bank-plus-holdco financial pack before underwriting
    body: >-
      Investor diligence should request audited entity-level financials, mono-specific lending and
      payment unit economics, deposit/funding breakdowns, and current cash/debt data rather than
      relying on bank-profile snapshots and media-reported holdco metrics.
    claimRefs: [CI008, CI011, CI012]
