callouts:
  - calloutType: "insight"
    title: "The product is a daily-finance bundle, not just a current account"
    body: >-
      The strongest product signal is usage density: cards, payments, loans,
      fundraising, marketplace, entrepreneur tools, and adjacent fintech assets
      all point to a super-app strategy built around repeated consumer contact.
    claimRefs: ["CE002", "CE007", "CE010", "CE015"]
  - calloutType: "risk"
    title: "Technical dependence is concentrated inside a private holding"
    body: >-
      Public reporting suggests FintechBand still supplies the core monobank
      technology and represents most group revenue, while Kilobyte and ACDC add
      more entity-level dependencies that outsiders cannot diligence through
      public operating metrics alone.
    claimRefs: ["CE011", "CE012", "CE013", "CE014"]
  - calloutType: "assumption"
    title: "Public trust evidence is indirect"
    body: >-
      Investors can see bank-regulatory status, app-store privacy disclosures,
      and reported payment certifications, but not direct evidence on app-layer
      uptime, secure-development practice, fraud controls, or incident response.
    claimRefs: ["CE006", "CE008", "CE009", "CE013"]
