      - ["monobank client app", "Customer UI, onboarding shell, support entry point, and feature surface", "Official site plus iOS/Android store listings", "Mobile release cadence and app-store policies", "No public uptime, SLA, fraud, or independent security-assurance metrics"]
      - ["FintechBand core technology", "Core software supplier behind the monobank app", "KyivPost says ~90% of 2024 holding revenue came from FintechBand supplying monobank technology", "Concentration on one private tech entity", "Opaque service terms, transfer pricing, and failure domains"]
      - ["Kilobyte1024 / monobank 2.0", "Integration layer for individual and business services", "Scroll says Kilobyte built monobank 2.0 in 2023", "Roadmap execution across B2C and SME workflows", "Scope, performance, and migration status are not publicly documented"]
      - ["ACDC Processing", "Payment-services operator inside the group", "Scroll says ACDC was recognized by NBU in 2021-2025 and holds Visa, Mastercard, and PCI DSS certifications", "Card and payment-processing resilience", "Credentials are reported publicly, but primary certificates and operational KPIs are not disclosed"]
      - ["Shared services / group governance", "HR, finance, legal, and knowledge-sharing layer", "Scroll says companies share administrative resources while product teams stay dedicated by domain", "Cross-entity coordination and control environment", "No public SLAs, continuity segregation, or cost-allocation detail"]
    notes: "This is an operating-model table rather than a system diagram; it combines official, regulatory, and media evidence and flags where the public record stops."
    claimRefs: ["CE005", "CE006", "CE011", "CE012", "CE013", "CE014"]
