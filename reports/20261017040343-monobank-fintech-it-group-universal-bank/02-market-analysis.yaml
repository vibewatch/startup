company:
  name: monobank (Fintech-IT Group / Universal Bank)
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    monobank addresses a broad Ukrainian digital-banking demand stack rather than a single narrow feature niche: official
    surfaces show an app-led retail bundle spanning cards, deposits, credit, insurance, entrepreneur tools, and
    fundraising rails, while regulatory and third-party sources show large existing usage proxies. The evidence is strong
    on adoption breadth and macro backdrop, but the assigned pool does not contain a methodology-transparent Ukrainian
    neobank TAM/SAM/SOM study, so market sizing must rely on mixed proxy lenses rather than one comparable market report.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The evidence supports defining monobank's core market as mass-market, mobile-first everyday banking in Ukraine, not
      simply "cards in an app." Official product surfaces combine remote onboarding, payment cards, deposits, government
      bonds, consumer credit, insurance, currency exchange, and utility or peer-to-peer payments in one interface, while
      Universal Bank and TechUkraine both describe the service as a branchless digital layer built on licensed-bank rails.
      That boundary includes routine household money movement, savings, short-duration credit, and in-app ancillary
      financial services, but excludes full corporate treasury, branch-advice-heavy banking, and any claim that monobank
      replaces every cash or foreign-currency workflow. The status-quo substitute is therefore still a licensed bank with
      physical infrastructure, because some cash operations continue through Universal Bank or partner branches even though
      the primary acquisition and service model is digital-first.
    claimRefs: [CM001, CM002, CM003, CM007, CM008]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Proxy sizing lenses and current demand signals
    body: >-
      The assigned evidence pool gives several strong demand proxies but not a clean TAM/SAM/SOM stack. Company and
      third-party sources point to very large usage, with monobank marketed at over 11 million users and a Wikipedia summary
      of NBU-linked data showing 9.77 million active cards plus nearly UAH 108 billion in deposits. The official product page
      adds a separate engagement lens: more than 1.6 million people donate through Banka each month, with cumulative
      donations reported at UAH 100 billion. The World Bank frames a much larger macro backdrop through Ukraine's almost
      $588 billion reconstruction need and the potential for private finance to cover 40% of recovery costs. These measures
      are not directly comparable: users, cards, deposits, monthly participants, cumulative flows, and decade-long recovery
      needs use different populations, units, and periods. They bound adoption and financial activity but do not combine
      into a defensible revenue TAM, SAM, or SOM.
    claimRefs: [CM005, CM006, CM009, CM010, CM011, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer segments, adoption drivers, and constraints
    body: >-
      Buyer and user evidence points to three practical demand clusters: retail households using monobank for daily money
      management, entrepreneurs and small businesses using the same app stack for acceptance and operating workflows, and
      donors or community organizers using Banka as a trusted collection rail. Adoption is helped by remote onboarding,
      fast virtual-card issuance, broad everyday feature coverage, transparent fees shown before confirmation, and adjacent
      services that keep more activity inside the ecosystem. The merchant side is economically relevant because monobank
      says sellers cover the cost of interest-free split payments, while entrepreneur tools place tax, reporting, and
      payment tasks inside the same app. The main constraints are equally clear: some foreign-currency cash workflows still
      rely on banking infrastructure outside the app, and the World Bank's 2026 outlook highlights weaker growth, labor
      shortages, and high energy costs. Those factors can slow borrower demand and merchant investment even while digital
      adoption remains high.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM008, CM012, CM015]
    tableRefs: [TM003]
