callouts:
  - calloutType: insight
    title: The market boundary is broader than retail card issuance
    body: >-
      The product evidence points to a financial super-app pattern: monobank combines everyday banking, savings, credit,
      donations, entrepreneur tooling, and commerce adjacencies, which expands the relevant buyer journeys beyond a narrow
      "digital card" market definition.
    claimRefs: [CM003, CM004, CM005, CM006, CM012]
  - calloutType: risk
    title: Adoption breadth is clear, but precise SAM and SOM are not
    body: >-
      The assigned sources support very large usage and a large macro-financing backdrop, yet they do not provide a
      methodology-transparent Ukrainian neobank market study with consistent denominators, so valuation work should not
      treat the proxy lenses as a proven monetizable market stack.
    claimRefs: [CM009, CM010, CM011, CM013, CM014, CM016]
