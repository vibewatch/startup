  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: A methodology-transparent Ukraine neobank or mobile-banking market study that separates TAM, SAM, and SOM with explicit denominators, geography, and monetization assumptions.
      whyItMatters: Without a comparable market-study baseline, valuation work can over-read adoption proxies such as users, cards, deposits, or macro recovery spend.
      diligencePath: Retrieve a current NBU payment-market report, a credible analyst-market study on Ukrainian retail digital banking, or bank-level segment disclosures that isolate monetizable product revenue by user cohort.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: adoption-metrics
      missingEvidence: A reconciled bridge among users, customers, active cards, funded accounts, deposit balances, and segment revenue.
      whyItMatters: The current evidence mixes different unit definitions and time bases, so conversion from broad usage to addressable revenue remains uncertain.
      diligencePath: Ask management for a metric dictionary and cohort bridge, then reconcile it to Universal Bank regulatory disclosures and any current investor materials.
      relatedQuestionRefs: [QM002, QM006, QM008]
      relatedTableRefs: [TM002]
