evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investor-rights
    missingEvidence: >-
      Exact round size, post-money cap table, board or observer rights, preferences, and liquidation terms for UMAEF and
      the co-investor consortium.
    whyItMatters: The public valuation headline is clear, but ownership economics and downside protections are still opaque.
    diligencePath: Request the signed cap table, term sheet, and shareholder or investment agreements for the October 2025 round.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: consolidated-financials
    missingEvidence: >-
      Current audited or management-certified consolidated Fintech-IT Group revenue, profitability, cash generation, and
      intercompany economics with Universal Bank.
    whyItMatters: >-
      Valuation analysis cannot be tied cleanly to operating performance without a bridge between bank metrics and
      developer-group economics.
    diligencePath: >-
      Request FY2025 and trailing-2026 consolidated financials plus a revenue-share bridge between Universal Bank and
      the developer entities.
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: customer-metrics
    missingEvidence: >-
      A reconciled methodology note that explains the difference between monobank's announced 11 million users and
      Universal Bank's 10,823,709 individual depositors.
    whyItMatters: >-
      Customer-scale claims are directionally strong, but denominator drift can distort retention, monetization, and
      market-share assumptions.
    diligencePath: >-
      Ask management for the exact customer-count definitions, cut-off dates, and overlap assumptions used in investor
      materials.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: leadership-table disclosure coverage
    missingEvidence: >-
      A fuller public roster for Fintech-IT Group and Universal Bank board seats, senior operators, and decision-rights
      boundaries.
    whyItMatters: >-
      The visible founders and controlling bank owner explain concentration, but not the day-to-day governance
      architecture investors would underwrite.
    diligencePath: >-
      Request current board lists, committee charters, executive roster details, and any intercompany governance
      memorandum.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A methodology-transparent Ukraine neobank or mobile-banking market study that separates TAM, SAM, and SOM with
      explicit denominators, geography, and monetization assumptions.
    whyItMatters: >-
      Without a comparable market-study baseline, valuation work can over-read adoption proxies such as users, cards,
      deposits, or macro recovery spend.
    diligencePath: >-
      Retrieve a current NBU payment-market report, a credible analyst-market study on Ukrainian retail digital banking,
      or bank-level segment disclosures that isolate monetizable product revenue by user cohort.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: adoption-metrics
    missingEvidence: A reconciled bridge among users, customers, active cards, funded accounts, deposit balances, and segment revenue.
    whyItMatters: >-
      The current evidence mixes different unit definitions and time bases, so conversion from broad usage to
      addressable revenue remains uncertain.
    diligencePath: >-
      Ask management for a metric dictionary and cohort bridge, then reconcile it to Universal Bank regulatory
      disclosures and any current investor materials.
    relatedQuestionRefs:
      - QM002
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: peer-benchmark
    missingEvidence: >-
      Current primary and independent profiles for named Ukrainian mobile banks, licensed incumbents, and specialist
      fintechs covering active users, funding, pricing, retention, product scope, service quality, and strategic
      direction.
    whyItMatters: >-
      Without like-for-like named-peer evidence, the report cannot distinguish category attractiveness from
      company-specific moat durability or quantify displacement risk.
    diligencePath: >-
      Obtain current competitor tariffs and product documents, NBU bank statistics, audited filings where available,
      app-store trend data, customer research, and management win-loss and multi-homing analyses.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: stale
    severity: material
    topic: pricing
    missingEvidence: >-
      A dated, current monobank tariff schedule and equivalent named-peer tariffs with eligibility, funding-source,
      destination, and promotional conditions.
    whyItMatters: Undated third-party fee descriptions cannot establish current relative price or realized customer economics.
    diligencePath: >-
      Export the effective tariff from the app and contract documents, then conduct matched test transactions and
      collect peer tariffs on the same date.
    relatedQuestionRefs:
      - QP003
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort retention, primary-account share, salary-account penetration, product attachment, multi-homing, and churn
      by customer segment.
    whyItMatters: Product breadth does not by itself prove durable lock-in or pricing power.
    diligencePath: >-
      Request anonymized cohort dashboards and reconcile them to bank-account activity, then benchmark the results
      through customer interviews and transaction-level samples.
    relatedQuestionRefs:
      - QP004
      - QP005
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Mono-specific price books or realized pricing by product, including interchange, lending yield, transfer fees, FX
      spread, and commission schedules.
    whyItMatters: >-
      Without realized pricing, revenue quality cannot be separated from customer-friendly product breadth or
      promotional positioning.
    diligencePath: Request current tariff books, product P&Ls, and a monthly revenue-mix bridge by monetization stream.
    relatedQuestionRefs:
      - QI001
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      CAC, payback period, cohort retention, ARPU, lending yields, charge-offs, reserve coverage, and gross margin by
      major product line.
    whyItMatters: >-
      These are the core variables needed to judge whether mono's scale compounds efficiently or simply masks uneconomic
      growth.
    diligencePath: >-
      Request cohort tables for acquisition, activity, credit performance, and contribution margin, segmented by cards,
      lending, and SME products.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash position, debt obligations, covenant package, planned use of funds by amount, and the next-round
      trigger at both holdco and bank levels.
    whyItMatters: >-
      The public round headline implies financial strength, but not whether the company can self-fund growth or faces
      another financing need soon.
    diligencePath: >-
      Obtain the latest board deck or financing memo, cash bridge, debt schedule, and regulatory-capital plan tied to
      growth scenarios.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: credit-risk
    missingEvidence: >-
      Product-level NPL ratios, forward provisions, reserve coverage, deposit concentration, and mono-specific
      sensitivity to wartime credit stress.
    whyItMatters: >-
      Bank-level profitability and scale do not show whether consumer-credit economics remain resilient under Ukrainian
      macro and legal stress.
    diligencePath: >-
      Request portfolio mix, vintage curves, stress tests, reserve methodology, and monthly asset-quality reports by
      mono product.
    relatedQuestionRefs:
      - QI005
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: architecture-docs
    missingEvidence: >-
      Public architecture diagrams, API or integration docs, and a source-of-truth description of how monobank,
      Kilobyte, ACDC, and Universal Bank systems interact.
    whyItMatters: >-
      Without documented boundaries, it is hard to underwrite migration risk, vendor concentration, resilience, or the
      blast radius of failures between the bank and the private tech holding.
    diligencePath: >-
      Request the current architecture deck, system-dependency map, ownership by service, and any monobank 2.0 migration
      documentation.
  - type: private-evidence-only
    severity: material
    topic: reliability-kpis
    missingEvidence: Service-level metrics for uptime, failed payments, fraud, chargebacks, incident frequency, and recovery times.
    whyItMatters: >-
      Product breadth is only valuable if the service is dependable; no public KPI set shows whether mono's convenience
      claims translate into production-grade reliability.
    diligencePath: >-
      Obtain internal SLA dashboards, incident logs, fraud-loss trends, and on-call or postmortem materials for the last
      12 months.
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      App-specific secure-development, pentest, privacy-governance, and breach-history evidence beyond app-store
      disclosures and entity-level certifications.
    whyItMatters: >-
      Bank-regulatory status and ACDC certifications do not prove the monobank app itself is operated with robust SDLC,
      privacy, and incident-response controls.
    diligencePath: >-
      Request the latest pentest and remediation summary, privacy impact assessments, PCI scope definition, and
      security-operations runbook for the app.
  - type: missing-source
    severity: material
    topic: retention-concentration-gap
    missingEvidence: >-
      Public or management-supplied NRR, GRR, churn, renewal cohorts, top-customer concentration, and partner/channel
      concentration metrics.
    whyItMatters: >-
      Without these, the customer chapter can prove scale and usage surfaces but not durability, wallet share, or
      concentration risk.
    diligencePath: >-
      Request cohort tables, active funded-account definitions, churn by vintage, and top-10 customer / partner exposure
      from management.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: entrepreneur-monetization
    missingEvidence: User counts, TPV, revenue mix, and retention data for Business Portal / SP workflows.
    whyItMatters: >-
      Entrepreneur adoption could materially change customer quality and monetization, but public evidence only proves
      feature availability.
    diligencePath: Ask for active entrepreneur accounts, TPV, attach rate, and contribution margin for business features.
    relatedTableRefs:
      - TU003
  - type: stale
    severity: minor
    topic: customer-count-corroboration
    missingEvidence: >-
      A regulator, filing, or independently audited current customer-count disclosure that reconciles the 2023, 2025,
      and app-store figures.
    whyItMatters: >-
      The adoption trend is clearly positive, but today's exact customer denominator still rests on mixed methodologies
      and company-controlled descriptors.
    diligencePath: >-
      Request investor materials or audit support that define funded accounts, MAUs, and unique customers on a common
      basis.
  - type: missing-source
    severity: material
    topic: legal-overhang
    missingEvidence: >-
      Current counsel-reviewed docket and entity map covering any PrivatBank-linked exposure, board indemnities, and
      Hallstatt / Fintech-IT Group shareholder protections.
    whyItMatters: >-
      Public reporting only reaches the level of speculation and says the legal-risk hypothesis remains unconfirmed, so
      downside severity cannot be underwritten from press sources alone.
    diligencePath: Obtain external counsel memo plus cap-table and shareholder-rights documents tied to the 2025 financing.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: mono-linked-credit-quality
    missingEvidence: >-
      Product-level NPLs, reserve coverage, vintage performance, funding mix, and liquidity indicators for the retail
      mono portfolio inside Universal Bank.
    whyItMatters: >-
      The biggest financial downside is not whether the bank exists but how wartime macro stress translates into loss
      rates, capital usage, and funding resilience at the relevant product layer.
    diligencePath: >-
      Request recent management packs or regulatory submissions with portfolio segmentation, provisioning, and
      delinquency trends.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Contract map, SLA metrics, concentration by provider, and contingency arrangements for issuing, KYC, network, and
      processing partners.
