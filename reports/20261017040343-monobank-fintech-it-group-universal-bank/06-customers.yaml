schemaVersion: report-v2
artifact: customers
slug: monobank-fintech-it-group-universal-bank
runDate: 2026-10-17
company:
  name: monobank (Fintech-IT Group / Universal Bank)
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows monobank serving a broad consumer base plus adjacent entrepreneur,
    family, and community use cases inside one app, with platform and media sources pointing
    to customer scale that moved from 6 million in 2023 to roughly 10 million in 2025 and
    "over 11 million users" in current app-store descriptions. The adoption proof is real but
    mostly company-controlled or platform-proxied; public retention, churn, and concentration
    disclosures remain absent.
sections:
  - id: customer-segmentation
    title: Customer base is wider than retail banking alone
    body: >-
      The retained sources show monobank starting with mass-market retail banking but expanding
      into adjacent user groups that increase usage frequency and embed the app deeper into
      day-to-day money movement. Official and app-store surfaces position mono around cards,
      transfers, deposits, loans, insurance, installment products, and day-to-day payments for
      individuals, while separate in-app flows target entrepreneurs through the Business Portal
      and SP tools. Family and community features matter too: child cards, group expenses, and
      Banka move the product from a single-user spending app toward a household and fundraising
      workflow. EBA's company profile reinforces that Universal Bank serves both individuals and
      legal entities, with monobank positioned as the digital customer package rather than a
      narrow standalone niche offer.
    claimRefs: [CU002, CU003, CU004, CU005, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Public adoption proof is strong, but definitions are inconsistent
    body: >-
      The clearest customer-adoption signal is directional rather than perfectly normalized.
      BestChange reported 6 million customers in 2023, Scroll and KyivPost both described
      monobank at around 10 million customers in 2025, and the current Google Play and Apple
      App Store descriptions now market the app as having "over 11 million users." Apple adds a
      second useful proxy by showing a 4.9 rating from 967,000 ratings, which suggests a very
      large and still-engaged consumer surface even if ratings are not the same thing as primary
      account usage or retention. The result is convincing scale proof, but not a regulator-grade
      active-customer or paying-customer denominator.
    claimRefs: [CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
  - id: public-proof-of-production-use
    title: Production use is visible in named workflows, not in audited customer rosters
    body: >-
      The public record does provide real production-use proof, just not in the classic SaaS
      case-study format. The entrepreneur workflow is visible in both app stores as an in-app
      operating surface for taxes, reports, and payments. Banka is more than a feature teaser:
      monobank's own site says it has connected more than 1,300 foundations and supports more
      than 1.6 million monthly donors, implying a large repeat-engagement loop around charitable
      collections. BestChange adds a named ATB co-branded card use case for retail shoppers. What
      is still missing is a public list of large enterprise accounts, audited merchant cohorts, or
      customer-level outcome studies that tie these surfaces to monetization, renewal, or
      concentration data.
    claimRefs: [CU003, CU004, CU005, CU011]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Durability is inferred from banking infrastructure, but retention remains opaque
    body: >-
      Customer durability has to be inferred from infrastructure and product breadth, not from
      disclosed cohort metrics. Google Play ties mono to Universal Bank's banking license, and
      the National Bank of Ukraine classifies Universal Bank as solvent, a Deposit Guarantee Fund
      participant, and systemically important, which strengthens confidence in the regulated
      wrapper behind the app. That does not solve the core diligence gap: none of the retained
      public sources disclose NRR, GRR, churn, renewal cohorts, top-customer concentration, or
      partner/channel revenue dependence. Scroll also says growth remains focused on Ukraine while
      keeping foreign expansion details undisclosed and prior overseas efforts on hold, so customer
      expansion is evident inside the domestic market but not yet diversified across geographies.
      The World Bank's October 2026 outlook adds an external demand-side caution: it projects
      Ukrainian growth slowing to 1.2% in 2026 from 1.8% in 2025 as the prolonged invasion weighs
      on investment and business activity.
    claimRefs: [CU011, CU012, CU013, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Mass-market retail consumers
        - Self-serve individual is buyer, user, and payer
        - Cards, transfers, deposits, FX, split payments, loans, insurance
        - "Current public proxy: over 11 million users in app-store descriptions"
        - Core volume engine and brand anchor
        - No public active-user, primary-bank, or ARPU denominator
      - - Entrepreneurs / SP
        - Owner-manager is buyer and user; business ultimately pays
        - Business Portal for taxes, reports, and payments in the same app
        - Publicly visible feature, but no disclosed customer count
        - Extends mono from consumer banking into SMB workflow
        - No penetration, monetization, or retention disclosure
      - - Household / family
        - Parent is payer; child becomes supervised user
        - Child card, parental controls, group expenses
        - Feature-level proof in both app stores
        - Increases multi-seat retention potential within one household
        - No disclosed share of users adopting family features
      - - Community / fundraising users
        - Foundation or organizer launches collection; donors participate
        - Banka fundraising and donation collections
        - "1,300+ foundations; 1.6 million monthly donors; 100 billion UAH total"
        - High-frequency engagement loop that compounds brand reach
        - No public revenue conversion or repeat-donor cohort data
    notes: >-
      Public segmentation reflects feature- and workflow-level evidence, not disclosed revenue mix;
      scale cells combine direct counts with platform descriptors where audited denominators are absent.
    claimRefs: [CU002, CU003, CU004, CU005, CU008, CU010]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Customer count proxy
        - 6 million customers
        - "2023-11-13"
        - BestChange
        - Medium
        - Shows monobank had already reached national-scale adoption by 2023
        - No active-customer or paying-customer definition
      - - Customer count proxy
        - About 10 million customers
        - "2025 media coverage"
        - Scroll.media and KyivPost
        - Medium
        - Suggests continued wartime expansion before the latest refresh
        - No cohort, wallet-share, or funding-account denominator
      - - App-store user descriptor
        - Over 11 million users
        - "Accessed 2026-10-17"
        - Google Play and Apple App Store descriptions
        - Medium
        - Signals current-scale marketing claim and continued growth narrative
        - Company-controlled descriptor, not audited MAU or unique funded accounts
      - - Consumer satisfaction proxy
        - 4.9 / 5 from 967k ratings
        - "Accessed 2026-10-17"
        - Apple App Store
        - Medium
        - Very broad consumer-review footprint supports real engagement
        - Ratings do not equal retention, deposits, or primary-bank status
      - - Community engagement proxy
        - "1,300+ foundations; 1.6 million donors / month; 100 billion UAH total"
        - "Accessed 2026-10-17"
        - monobank official site
        - Medium
        - Shows expansion into repeated fundraising behavior beyond pure payments
        - No overlap disclosure between donors and core banking customers
    notes: >-
      Values mix reported customers, platform descriptors, and engagement proxies; the absence of a
      consistent "active customer" definition is the main comparability limitation.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / cohort
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Entrepreneurs using SP tools
        - Sole proprietors / micro-businesses
        - Business Portal for taxes, reports, and payments inside mono
        - Production feature in both app stores
        - Evidence of real B2B-adjacent workflow beyond consumer payments
        - No public user count, payment volume, or revenue contribution
      - - Foundations using Banka
        - Nonprofits / community fundraisers
        - Public fundraising and donation collections
        - Production feature on official site
        - "1,300+ foundations and 1.6 million monthly donors indicate repeat use"
        - No cohort, monetization, or retention disclosure
      - - ATB card users
        - Value-seeking retail shoppers
        - Co-branded payment / loyalty card at ATB supermarkets
        - Production card program described in BestChange
        - "5% to 45% discount when paying at an ATB shop"
        - No disclosed active-cardholder count or spend frequency
    notes: >-
      Enumeration is partial because retained public evidence exposes named customer workflows and
      cohorts, not a complete public roster of monobank deployments.
    enumerationScope:
      coverage: partial
      basis: >-
        Retained public evidence covers visible named workflows and cohorts from official, app-store,
        and secondary sources as of the 2026-10-17 refresh, not the full customer population.
    claimRefs: [CU003, CU004, CU005, CU011, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports a consumer-led journey that expands from instant onboarding into
      daily money movement, charitable collections, and entrepreneur workflows.
    data:
      items:
        - label: Acquire
          detail: Mobile-first proposition reaches users through app stores and word of mouth around speed and convenience.
          touchpoints:
            - "Google Play / Apple App Store descriptions"
            - "Mobile-first positioning"
        - label: Onboard
          detail: ID verification yields a virtual card immediately, with a physical card delivered separately.
          touchpoints:
            - "Diia or ID-document verification"
            - "Virtual card first, physical card delivered later"
        - label: Transact
          detail: Core loop centers on transfers, bills, cards, FX, deposits, and credit inside one interface.
          touchpoints:
            - "Peer-to-peer and IBAN payments"
            - "Cards, deposits, loans, cashback"
        - label: Expand wallet share
          detail: Installments, insurance, and marketplace surfaces widen use beyond simple current-account behavior.
          touchpoints:
            - "Split payments / installment plan"
            - "Insurance and monomarket"
        - label: Community loop
          detail: Banka creates repeat donation and fundraising behavior that keeps mono visible beyond pure banking tasks.
          touchpoints:
            - "1,300+ foundations"
            - "1.6 million monthly donors"
        - label: Entrepreneur extension
          detail: SP tools pull sole proprietors into the same app rather than requiring a separate SME banking stack.
          touchpoints:
            - "Business Portal for taxes, reports, and payments"
            - "Ukraine-focused expansion path"
    approximationNotes: >-
      The journey map shows supported workflow stages in authored order; it does not imply measured conversion rates.
    claimRefs: [CU001, CU003, CU004, CU005, CU013]
callouts:
  - calloutType: strength
    title: Engagement surfaces extend beyond a checking-account app
    body: >-
      Banka, family controls, marketplaces, and SP workflows all increase the odds that mono stays
      in the customer's daily operating loop instead of remaining a single-purpose debit card.
    claimRefs: [CU003, CU004, CU005]
  - calloutType: risk
    title: Public adoption proof is much better than public retention proof
    body: >-
      The market can see customer scale and visible usage surfaces, but not NRR, GRR, churn,
      renewal, concentration, or channel economics, so durability still needs management data-room support.
    claimRefs: [CU008, CU013, CU014]
