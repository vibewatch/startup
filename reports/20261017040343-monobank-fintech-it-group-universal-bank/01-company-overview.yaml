artifact: company-overview
slug: monobank-fintech-it-group-universal-bank
runDate: 2026-10-17
company:
  name: monobank (Fintech-IT Group / Universal Bank)
chapter:
  number: 1
  title: Company Overview
  summary: >-
    monobank is a consumer-facing digital banking service layered on Universal Bank's license and
    product distribution, while Fintech-IT Group remains the technology and corporate vehicle behind
    the mono ecosystem. Public evidence supports a very large retail footprint and a 2025 unicorn
    valuation, but exact round economics, consolidated group financials, and the governance interface
    between the bank and the developer remain only partially disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: |-
      monobank still has to be understood as a two-entity system rather than a standalone licensed
      bank. Its own about page describes monobank as Ukraine's first branchless bank, but the same
      page and independent synthesis from Ukrainavi make clear that the retail product sits on the
      license of JSC Universal Bank and was created with the mono IT team. The company therefore sells
      a branchless consumer experience while relying on a conventional bank balance sheet and banking
      permissions underneath.

      That structure matters because the operating perimeter mixes a public-facing product brand, a
      regulated bank, and a separate developer group. The legal address disclosed on the official
      monobank page is in Kyiv, while the developer interview and the EBA profile reinforce that
      Universal Bank implements the monobank project for digital customers rather than acting merely as
      a passive shell. The product breadth is also broader than a card app: the current homepage
      markets cards, credit, deposits, government bonds, business tools, insurance, Banka
      fundraising, marketplaces, and eSIM services in one interface.
    claimRefs: [CO001, CO002, CO004, CO011]
  - id: leadership-and-control
    title: Leadership, control, and governance dependencies
    body: |-
      Control is split across the developer side and the license-holder side. Scroll's founder
      interview says Oleg Gorokhovskyi and Mykhailo Rogalskyi remain equal majority owners of
      Fintech-IT Group even after the 2025 financing, while NBU-linked reporting cited by Ukrainavi
      identifies Serhii Tihipko as the ultimate owner with an indirect significant stake in Universal
      Bank. In practice, the product therefore depends on alignment between founder-controlled product
      and technology leadership and a separately controlled bank entity that owns the license and the
      prudential balance sheet.

      The public record supports strong founder-market fit but also clear key-person concentration.
      Komersant describes Gorokhovskyi and Rogalskyi as former PrivatBank top managers, and Scroll
      shows them still sitting at the center of ownership after the rebrand from Fintech Band to
      Fintech-IT Group. Ukrainavi also surfaces the most important governance wrinkle for later
      chapters: NBU Governor Andriy Pyshnyi said the developer company is not supervised by the
      central bank and that Universal Bank's model carries third-party risk because it relies on an
      outside company.
    claimRefs: [CO006, CO007, CO010, CO012, CO016]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-disclosure
    title: Funding, scale, and disclosure quality
    body: |-
      The October 2025 financing is the key public step-change in monobank's company profile. Kyiv
      Post and Komersant both report that the UMAEF-led round lifted Fintech-IT Group's valuation to
      $1 billion, creating Ukraine's first fintech unicorn and confirming that the developer entity is
      still privately held rather than public. Both outlets also cite Forbes Ukraine and registry work
      implying that the check size was only about $18.5 million to $18.55 million for roughly a 1.9%
      effective stake, which means the valuation signal is clearer than the disclosed cash proceeds.

      The operating scale is easier to verify than the economics. Scroll says the group employs around
      630 specialists, while NBU and DGF-linked figures collected by Ukrainavi show Universal Bank at
      more than 10.8 million individual depositors and the company itself at 11 million people who had
      chosen monobank as of September 2026. NBU's supervisory profile shows a large bank balance sheet
      as well. What remains missing is a current public bridge from those banking metrics to
      consolidated Fintech-IT Group revenue, profitability, and investor rights, so later valuation
      work will still rely on partial disclosures.
    claimRefs: [CO007, CO008, CO009, CO013, CO014, CO015]
    tableRefs: [TO001]
  - id: milestones-and-open-issues
    title: Milestones and open issues
    body: |-
      The milestone sequence is coherent even though the public disclosures are not yet fully joined
      up. Universal Bank provides the 1994 banking foundation, Fintech Band built the first monobank
      app in 2017, the group revisited a cleaner corporate structure in 2024 and 2025, and the UMAEF
      round in October 2025 made the developer side legible to outside investors by putting a $1
      billion price on it. By late 2026, the remaining uncertainty is less about whether monobank is a
      scaled business and more about how to reconcile the bank's regulated metrics, the developer's
      private-company economics, and the exact rights held by new minority investors.

      The biggest near-term diligence issue is denominator quality. Company-announced user counts and
      regulator-linked depositor counts both point to exceptional scale, but they are not the same
      population, and the public material does not yet provide a clean conversion between them. The
      other unresolved issue is governance transparency: the monobank product, Universal Bank, and
      Fintech-IT Group are clearly connected, but the exact economic sharing, cap-table protections,
      and board or consent rights disclosed to outside investors are still thin in the retained public
      sources.
    claimRefs: [CO003, CO005, CO006, CO008, CO009, CO014, CO016]
    figureRefs: [FO001]
