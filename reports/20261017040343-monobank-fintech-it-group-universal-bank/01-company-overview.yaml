    summary: >-
      Public milestones show a regulated-bank foundation, a 2017 product build-out, a 2025 corporate
      formalization and unicorn round, and fresh 2026 evidence of scale.
    data:
      items:
        - year: "1994"
          label: Universal Bank banking foundation
          detail: Universal Bank's banking registration and NBU license provide the licensed base that monobank still uses.
          tone: neutral
          claimRefs: [CO003]
        - year: "2017"
          label: Fintech Band builds the first monobank app
          detail: Scroll says Fintech Band was the first company established in 2017 and built the first monobank app for individuals at Universal Bank.
          tone: positive
          claimRefs: [CO005]
        - year: "2024"
          label: Corporate restructuring work resumes
          detail: The founders said they revisited long-delayed corporate-structure improvements in 2024 after prioritizing wartime operational stability.
          tone: neutral
          claimRefs: [CO006]
        - period: April 2025
          label: Bank-side control cleanup receives approval
          detail: Scroll says the group received Antimonopoly Committee approval in April 2025 to control Fintech Band and ACDC.
          tone: neutral
          claimRefs: [CO006]
        - date: 2025-10-06
          label: UMAEF-led financing prices the group at $1 billion
          detail: Kyiv Post and Komersant report that the October 6 financing created Ukraine's first fintech unicorn and implied roughly $18.5 million to $18.55 million of new capital.
          tone: positive
          claimRefs: [CO008, CO009]
        - date: 2025-11-27
          label: Founder interview details the new group structure
          detail: Scroll lays out the Fintech-IT Group brand, founder control, and a workforce of around 630 specialists.
          tone: neutral
          claimRefs: [CO007, CO013]
        - period: 2026-08-01
          label: Regulator-linked scale snapshot lands
          detail: NBU and DGF-linked figures cited by Ukrainavi show 10,823,709 individual depositors at Universal Bank and a large regulated balance sheet.
          tone: neutral
          claimRefs: [CO014, CO015]
        - date: 2026-09-01
          label: Company announces 11 million monobank users
          detail: The official September 2026 announcement cited by Ukrainavi says 11 million people had chosen monobank, underscoring scale but not reconciling the denominator to bank depositor counts.
          tone: positive
          claimRefs: [CO014]
    approximationNotes: null
    claimRefs: [CO003, CO005, CO006, CO007, CO008, CO009, CO013, CO014, CO015]
