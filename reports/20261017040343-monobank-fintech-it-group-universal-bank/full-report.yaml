  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The evidence supports defining monobank's core market as mass-market, mobile-first everyday banking in
              Ukraine, not simply "cards in an app." Official product surfaces combine remote onboarding, payment cards,
              deposits, government bonds, consumer credit, insurance, currency exchange, and utility or peer-to-peer
              payments in one interface, while Universal Bank and TechUkraine both describe the service as a branchless
              digital layer built on licensed-bank rails. That boundary includes routine household money movement,
              savings, short-duration credit, and in-app ancillary financial services, but excludes full corporate
              treasury, branch-advice-heavy banking, and any claim that monobank replaces every cash or foreign-currency
              workflow. The status-quo substitute is therefore still a licensed bank with physical infrastructure,
              because some cash operations continue through Universal Bank or partner branches even though the primary
              acquisition and service model is digital-first.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM008
