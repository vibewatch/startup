      - number: '3.2'
        title: Capability breadth, trust, and customer choice
        blocks:
          - type: paragraph
            body: >-
              monobank's strongest visible differentiation is integration rather than a single exclusive feature.
              Official surfaces describe rapid digital onboarding, continuous support, cards, payments, savings, credit,
              investments, insurance, merchant tools, fundraising, and commerce in one interface. Google Play identifies
              Universal Bank as the licensed provider and claims more than 11 million users; Apple's storefront displays
              a 4.9 rating across 967,000 ratings. These are useful reach and engagement signals, but they are
              platform-displayed or company-supplied rather than independently audited retention measures. A capability
              comparison against named peers cannot be completed from this pool, so unsupported cells remain unknown
              instead of being converted into false competitive scores.
