  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a four-layer stack: customer app, engagement products, regulated bank rails, and
      Fintech-IT Group delivery entities.
    data:
      layers:
        - label: Customer surface
          detail: What users see and touch in mono
          items:
            - Remote onboarding with Diia or ID documents
            - Virtual and physical cards
            - Transfers, bill pay, deposits, bonds, loans
          outputs:
            - App-first banking workflow
            - 24/7 support entry point
        - label: Engagement products
          detail: High-frequency modules layered into the same shell
          items:
            - Banka fundraising
            - Installments and cash loans
            - monomarket / monobazar
            - eSIM and group expenses
          outputs:
            - 1,300+ foundations connected
            - 1.6M monthly donors
            - UAH 100B donations
        - label: Regulated bank rail
          detail: Universal Bank provides the licensed banking substrate
          items:
            - NBU License No. 92
            - Deposit Guarantee Fund participation
            - Systemically important bank status
          outputs:
            - Retail and entrepreneur card products
            - Deposit, bond, and lending permissions
        - label: Trust and transparency surface
          detail: What public users can verify without internal access
          items:
            - App Store privacy labels
            - Visible terms, fees, rates, and limits before confirmation
            - 24/7 chat or call support claims
          outputs:
            - Concrete privacy-disclosure surface
            - Limited direct operating-assurance evidence
        - label: Fintech-IT Group delivery layer
          detail: Private entities that build and operate major parts of the stack
          items:
            - FintechBand core technology
            - Kilobyte monobank 2.0
            - ACDC payment-services operator
            - Shared HR / finance / legal resources
          outputs:
            - Product modularity by legal entity
            - Concentrated technical dependency
            - Reported PCI DSS + card-network certifications at ACDC
        - label: Adjacent ecosystem layer
          detail: Non-core assets that can deepen wallet share or partner reach
          items:
            - Expirenza
            - Base by mono
            - Loyalty.ai
            - market by mono
          outputs:
            - More monetization vectors than a standalone current account
            - Harder diligence boundary between core and experimental products
    approximationNotes: >-
      Qualitative public-stack reconstruction only; internal interfaces, vendors, and service boundaries are not
      publicly documented.
