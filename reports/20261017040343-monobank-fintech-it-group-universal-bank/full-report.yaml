      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The latest financing event is strategically important but still incomplete for underwriting. Multiple
              sources agree that the UMAEF-led transaction pushed Fintech-IT Group above a $1 billion valuation and
              brought in its first institutional financial investor plus a group of American private investors, while
              the stated use of proceeds focused on product expansion and SME-service growth. However, Kyiv Post also
              reported that the exact round size was not disclosed and only secondary estimates circulated for the stake
              sold, which means investors still cannot infer cash on hand, dilution terms, liquidation preferences, or a
              next-round trigger from public materials alone. Combined with wartime operating context and only
              unconfirmed reporting about legacy legal-risk motivations, the financial verdict is that mono looks
              strategically well positioned and well capitalized relative to local peers, but the margin path, holdco
              cash runway, and bank-level credit-risk sensitivity remain diligence blockers rather than investable
              facts.
