          detail: NBU still shows Universal Bank as solvent, systemically important, and profitable.
        - id: asset
          label: Different investable asset
          detail: The priced entity is Fintech-IT Group, the software holdco behind mono, not Universal Bank alone.
        - id: opacity
          label: Missing underwriting data
          detail: >-
            Public evidence does not disclose round size, preferences, ownership dilution, or audited consolidated
            holdco economics.
        - id: macro
