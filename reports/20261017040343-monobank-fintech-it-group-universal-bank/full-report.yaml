      - number: '5.3'
        title: Trust signals are stronger at the bank and payments layers than at the app layer
        blocks:
          - type: paragraph
            body: >-
              Deployment is clearly consumer-mobile first: onboarding is self-serve in app, physical cards are fulfilled
              through external delivery partners, and support is marketed as 24/7 chat or call. Public trust signals
              exist, but they cluster around the regulated bank and payment-infrastructure layers rather than around the
              app-engineering process itself. Universal Bank's NBU profile labels it solvent, systemically important,
              and a Deposit Guarantee Fund participant, while Scroll attributes Visa, Mastercard, and PCI DSS
              credentials to ACDC. The App Store page also exposes a concrete privacy surface and current release
              signal. What is still missing are public uptime, fraud-loss, incident-response, or independent security
              assessment metrics for monobank's own app and service operations.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
              - CE013
      - number: '5.4'
        title: Differentiation comes from usage density, but diligence gaps stay material
        blocks:
          - type: paragraph
            body: >-
              mono's differentiation is product bundling and engagement density rather than a publicly documented
              technical moat. Banka's published scale, embedded installment commerce, entrepreneur tools, and adjacent
              assets such as Expirenza, Base, Loyalty.ai, and market by mono all broaden the ecosystem beyond a simple
              retail current account. The trade-off is that public evidence still does not show architecture boundaries,
              service-level metrics, fraud controls, or which adjacent products are meaningful businesses versus
              strategic experiments. Because the stack is spread across private group entities, diligence should focus
              on intercompany dependencies, security operations, and which product modules are truly production-grade.
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The product is a daily-finance bundle, not just a current account
            body: >-
              The strongest product signal is usage density: cards, payments, loans, fundraising, marketplace,
              entrepreneur tools, and adjacent fintech assets all point to a super-app strategy built around repeated
              consumer contact.
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE010
              - CE015
          - type: callout
            title: Technical dependence is concentrated inside a private holding
            body: >-
              Public reporting suggests FintechBand still supplies the core monobank technology and represents most
              group revenue, while Kilobyte and ACDC add more entity-level dependencies that outsiders cannot diligence
              through public operating metrics alone.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
          - type: callout
            title: Public trust evidence is indirect
            body: >-
              Investors can see bank-regulatory status, app-store privacy disclosures, and reported payment
              certifications, but not direct evidence on app-layer uptime, secure-development practice, fraud controls,
              or incident response.
            calloutType: assumption
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is wider than retail banking alone
        blocks:
          - type: paragraph
            body: >-
              The retained sources show monobank starting with mass-market retail banking but expanding into adjacent
              user groups that increase usage frequency and embed the app deeper into day-to-day money movement.
              Official and app-store surfaces position mono around cards, transfers, deposits, loans, insurance,
              installment products, and day-to-day payments for individuals, while separate in-app flows target
              entrepreneurs through the Business Portal and SP tools. Family and community features matter too: child
              cards, group expenses, and Banka move the product from a single-user spending app toward a household and
              fundraising workflow. EBA's company profile reinforces that Universal Bank serves both individuals and
              legal entities, with monobank positioned as the digital customer package rather than a narrow standalone
              niche offer.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU013
      - number: '6.2'
        title: Public adoption proof is strong, but definitions are inconsistent
        blocks:
          - type: paragraph
            body: >-
              The clearest customer-adoption signal is directional rather than perfectly normalized. BestChange reported
              6 million customers in 2023, Scroll and KyivPost both described monobank at around 10 million customers in
              2025, and the current Google Play and Apple App Store descriptions now market the app as having "over 11
              million users." Apple adds a second useful proxy by showing a 4.9 rating from 967,000 ratings, which
              suggests a very large and still-engaged consumer surface even if ratings are not the same thing as primary
              account usage or retention. The result is convincing scale proof, but not a regulator-grade
              active-customer or paying-customer denominator.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Production use is visible in named workflows, not in audited customer rosters
        blocks:
          - type: paragraph
            body: >-
              The public record does provide real production-use proof, just not in the classic SaaS case-study format.
              The entrepreneur workflow is visible in both app stores as an in-app operating surface for taxes, reports,
              and payments. Banka is more than a feature teaser: monobank's own site says it has connected more than
              1,300 foundations and supports more than 1.6 million monthly donors, implying a large repeat-engagement
              loop around charitable collections. BestChange adds a named ATB co-branded card use case for retail
              shoppers. What is still missing is a public list of large enterprise accounts, audited merchant cohorts,
              or customer-level outcome studies that tie these surfaces to monetization, renewal, or concentration data.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU016
      - number: '6.4'
        title: Durability is inferred from banking infrastructure, but retention remains opaque
        blocks:
          - type: paragraph
            body: >-
              Customer durability has to be inferred from infrastructure and product breadth, not from disclosed cohort
              metrics. Google Play ties mono to Universal Bank's banking license, and the National Bank of Ukraine
              classifies Universal Bank as solvent, a Deposit Guarantee Fund participant, and systemically important,
              which strengthens confidence in the regulated wrapper behind the app. That does not solve the core
              diligence gap: none of the retained public sources disclose NRR, GRR, churn, renewal cohorts, top-customer
              concentration, or partner/channel revenue dependence. Scroll also says growth remains focused on Ukraine
              while keeping foreign expansion details undisclosed and prior overseas efforts on hold, so customer
              expansion is evident inside the domestic market but not yet diversified across geographies. The World
              Bank's October 2026 outlook adds an external demand-side caution: it projects Ukrainian growth slowing to
              1.2% in 2026 from 1.8% in 2025 as the prolonged invasion weighs on investment and business activity.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Engagement surfaces extend beyond a checking-account app
            body: >-
              Banka, family controls, marketplaces, and SP workflows all increase the odds that mono stays in the
              customer's daily operating loop instead of remaining a single-purpose debit card.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Public adoption proof is much better than public retention proof
            body: >-
              The market can see customer scale and visible usage surfaces, but not NRR, GRR, churn, renewal,
              concentration, or channel economics, so durability still needs management data-room support.
            calloutType: risk
            claimRefs:
              - CU008
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Core downside concentration
        blocks:
          - type: paragraph
            body: >-
              The core risk picture is concentrated rather than diffuse. monobank's retail product set sits inside
              Universal Bank's licensed perimeter, which is helpful for credibility and deposit protection but also
              creates a single-bank dependency for credit decisions, consumer protection, and supervisory outcomes. The
              macro overlay remains harsh: the World Bank still expects slower Ukrainian growth in 2026, cites labor
              shortages and high energy costs, and calls 2027 external financing a major uncertainty. That backdrop
              matters because monobank combines large retail scale, credit products, payments, deposits, donations, and
              insurance-like distribution surfaces. The risk heatmap therefore ranks wartime macro stress and
              regulated-bank dependence as the top residual exposures, ahead of expansion and app-distribution risks.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory, credit, and customer-trust exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest public mitigation is that Universal Bank is not an unlicensed shell: the NBU profile shows a
              solvent, privately owned, systemically important bank that participates in the Deposit Guarantee Fund and
              reports substantial assets, equity, and profit. That does not remove downside. Consumer lending,
              installment products, deposits, government bonds, and donations all raise conduct, AML, fraud, and
              liquidity sensitivities. The Apple App Store listing also shows a large consumer footprint and a sensitive
              data surface linked to user identity, increasing the blast radius of any privacy, outage, or fraud-control
              failure. On legal and governance risk, the October 2025 $1 billion valuation headline is easier to observe
              than to underwrite: public reporting says the exact round size was undisclosed and that speculation about
              historical PrivatBank-related legal exposure remained unconfirmed, so legal diligence cannot stop at press
              coverage.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.3'
        title: Partner dependencies and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Public materials point to meaningful partner and execution dependencies, especially for growth beyond the
              core Ukrainian retail base. monobank.com's separate MONOBANK rollout is explicitly staged, with timing and
              availability dependent on market and partner readiness, while the same site lists multiple evaluated or
              confirmed providers across issuing, identity, processing, and payment rails. Scroll's interview adds two
              more execution signals: corporate-structure work was delayed by the full-scale invasion, and at least two
              international projects (Stereo and Koto) are currently on hold. The practical kill criteria are
              monitorable: any NBU supervisory action that changes Universal Bank's status, any visible deterioration in
              bank-level credit or capital metrics, or a continuing inability to convert staged rollout plans into live
              partner-backed launches should lower conviction materially.
            claimRefs:
              - CR001
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Single-stack concentration is the main downside
            body: >-
              monobank's public risk surface still concentrates on one regulated bank, one war-exposed geography, and
              several external delivery partners rather than on a single sensational event.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR009
          - type: callout
            title: Diligence should focus on files the public record does not show
            body: >-
              The fastest way to change conviction is not another press article but direct access to Universal Bank
              retail-credit performance, partner SLAs, incident history, and counsel-reviewed litigation exposure.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR005
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a "research-more" recommendation, low-to-medium conviction, a high risk
              rating, and a stretched valuation stance at the public $1.0 billion mark. The supportive side of the case
              is real: multiple independent reports say UMAEF's October 2025 investment valued Fintech-IT Group at $1.0
              billion, the bank-facing software group sits behind monobank, and official/regulatory pages still show
              broad product coverage plus a solvent, systemically important Universal Bank. The blocking issue is that
              those same public materials stop short of disclosing the size of the round, investor preferences, or
              audited consolidated holdco economics. Because the priced asset is Fintech-IT Group rather than Universal
              Bank itself, bank-level resilience is helpful but not sufficient proof that a new investor should enter at
              the same mark today.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV007
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: What the public record does and does not prove
        blocks:
          - type: paragraph
            body: >-
              Public financing coverage consistently frames the transaction as a growth-equity investment into
              Fintech-IT Group, with UMAEF becoming the first financial investor and assembling a consortium of American
              private investors. Coverage also says proceeds are meant to expand SME services, payment infrastructure,
              and the broader product suite. That is enough to infer management's intended use of capital, but not
              enough to translate a $1.0 billion mark into an investable underwriting case. The best current operating
              data in the assigned pool comes from the National Bank of Ukraine's supervisory profile for Universal Bank
              and from mono's own product surfaces; those inputs show scale, breadth, and regulatory footing, but they
              do not bridge to Fintech-IT Group's consolidated revenue, cash generation, or minority-investor
              protections.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
      - number: '8.3'
        title: Scenario framing and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases should be framed around evidence quality rather than around a
              false-precision multiple. The upside case requires management to convert the October 2025 financing into
              visible monetization of SME and adjacent services while preserving banking resilience. The base case is
              that monobank remains a dominant Ukrainian digital-banking distribution layer, but outside investors still
              lack the consolidated holdco disclosures required to justify paying through the last round. The bear case
              is that wartime macro drag, tighter financing, or weaker bank profitability compresses exit options before
              Fintech-IT Group proves software-like economics. Entry discipline should therefore hinge on receiving
              audited group accounts, complete round documents, and a clear explanation of how bank economics map into
              the investable entity.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is not more storytelling about brand strength; it is documentary proof about the
              asset being priced. Priority asks are the full October 2025 term sheet and shareholder documents, audited
              consolidated financials for Fintech-IT Group and its subsidiaries, and a bridge from Universal Bank
              operating metrics to the cash flows actually accruing to the holdco. Until those are produced, a
              disciplined investor should treat the $1.0 billion mark as a reference point rather than validated fair
              value. Thesis-break triggers are straightforward: a weaker macro path for Ukraine, delayed external
              financing and reform progress, any deterioration in Universal Bank's regulatory or profitability profile,
              or evidence that new products are broadening scope without producing attractive holdco economics.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
