      - number: '2.2'
        title: Proxy sizing lenses and current demand signals
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence pool gives several strong demand proxies but not a clean TAM/SAM/SOM stack. Company
              and third-party sources point to very large usage, with monobank marketed at over 11 million users and a
              Wikipedia summary of NBU-linked data showing 9.77 million active cards plus nearly UAH 108 billion in
              deposits. The official product page adds a separate engagement lens: more than 1.6 million people donate
              through Banka each month, with cumulative donations reported at UAH 100 billion. The World Bank frames a
              much larger macro backdrop through Ukraine's almost $588 billion reconstruction need and the potential for
              private finance to cover 40% of recovery costs. These measures are not directly comparable: users, cards,
              deposits, monthly participants, cumulative flows, and decade-long recovery needs use different
              populations, units, and periods. They bound adoption and financial activity but do not combine into a
              defensible revenue TAM, SAM, or SOM.
            claimRefs:
              - CM005
              - CM006
