      - number: '2.3'
        title: Buyer segments, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Buyer and user evidence points to three practical demand clusters: retail households using monobank for
              daily money management, entrepreneurs and small businesses using the same app stack for acceptance and
              operating workflows, and donors or community organizers using Banka as a trusted collection rail. Adoption
              is helped by remote onboarding, fast virtual-card issuance, broad everyday feature coverage, transparent
              fees shown before confirmation, and adjacent services that keep more activity inside the ecosystem. The
              merchant side is economically relevant because monobank says sellers cover the cost of interest-free split
              payments, while entrepreneur tools place tax, reporting, and payment tasks inside the same app. The main
              constraints are equally clear: some foreign-currency cash workflows still rely on banking infrastructure
              outside the app, and the World Bank's 2026 outlook highlights weaker growth, labor shortages, and high
              energy costs. Those factors can slow borrower demand and merchant investment even while digital adoption
              remains high.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
              - CM015
