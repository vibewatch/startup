chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: |-
              monobank still has to be understood as a two-entity system rather than a standalone licensed
              bank. Its own about page describes monobank as Ukraine's first branchless bank, but the same
              page and independent synthesis from Ukrainavi make clear that the retail product sits on the
              license of JSC Universal Bank and was created with the mono IT team. The company therefore sells
              a branchless consumer experience while relying on a conventional bank balance sheet and banking
              permissions underneath.

              That structure matters because the operating perimeter mixes a public-facing product brand, a
              regulated bank, and a separate developer group. The legal address disclosed on the official
              monobank page is in Kyiv, while the developer interview and the EBA profile reinforce that
              Universal Bank implements the monobank project for digital customers rather than acting merely as
              a passive shell. The product breadth is also broader than a card app: the current homepage
              markets cards, credit, deposits, government bonds, business tools, insurance, Banka
              fundraising, marketplaces, and eSIM services in one interface.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO011
      - number: '1.2'
        title: Leadership, control, and governance dependencies
        blocks:
          - type: paragraph
            body: |-
              Control is split across the developer side and the license-holder side. Scroll's founder
              interview says Oleg Gorokhovskyi and Mykhailo Rogalskyi remain equal majority owners of
              Fintech-IT Group even after the 2025 financing, while NBU-linked reporting cited by Ukrainavi
              identifies Serhii Tihipko as the ultimate owner with an indirect significant stake in Universal
              Bank. In practice, the product therefore depends on alignment between founder-controlled product
              and technology leadership and a separately controlled bank entity that owns the license and the
              prudential balance sheet.

              The public record supports strong founder-market fit but also clear key-person concentration.
              Komersant describes Gorokhovskyi and Rogalskyi as former PrivatBank top managers, and Scroll
              shows them still sitting at the center of ownership after the rebrand from Fintech Band to
              Fintech-IT Group. Ukrainavi also surfaces the most important governance wrinkle for later
              chapters: NBU Governor Andriy Pyshnyi said the developer company is not supervised by the
              central bank and that Universal Bank's model carries third-party risk because it relies on an
              outside company.
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO012
              - CO016
