  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              monobank's public surfaces show a multi-product retail-banking model rather than a single-card feature.
              The company markets debit and credit cards, cash loans, split payments, deposits, bill payments, currency
              exchange, insurance, entrepreneur accounts, and in-app marketplaces, which implies several possible
              revenue pools spanning interest income, interchange, service fees, and partner commissions. What public
              evidence does not provide is a clean price book: the official pages repeatedly say rates, fees, and limits
              are shown in the app before confirmation, so list-pricing transparency remains product-by-product and
              session-specific rather than published in a durable investor-facing schedule. Scale is clearly large, with
              third-party and official proxies clustering around 9.9 million active cards/clients and app store copy
              later claiming more than 11 million users, but those figures use different denominators and dates, so they
              are traction proxies rather than one audited operating metric.
