      - number: '4.2'
        title: Cost structure and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The publicly visible operating structure is split between Universal Bank as the regulated bank and
              Fintech-IT Group as the technology developer behind the mono ecosystem. That distinction matters because
              the available evidence mixes bank-level balance-sheet data with holdco-level software-company reporting.
              Kyiv Post, citing Forbes Ukraine, reported that about 90% of the holding's 2024 revenue came from
              FintechBand, while Scroll said the broader group employs around 630 specialists and plans further hiring,
              which points to a material software and product-development cost base. The NBU profile adds current
              bank-level assets, liabilities, equity, and profit, but public sources still do not disclose mono-specific
              CAC, payback, portfolio yields, credit losses, provisioning by product, gross margin, or contribution
              margin from adjacent products. That leaves the public record better at proving product breadth and scale
              than proving revenue quality or efficiency.
