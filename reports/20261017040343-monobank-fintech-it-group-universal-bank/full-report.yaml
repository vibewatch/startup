      - number: '3.3'
        title: Pricing, distribution, and switching friction
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is asymmetric. monobank advertises a no-fee card and transparent in-app terms,
              while an undated third-party payment-method page describes zero commission for own-money transfers, 4% for
              credit-funded transfers, and a 1% charge with a one-dollar or one-euro minimum for transfers to
              foreign-bank cards using own funds. Those third-party figures require current in-app verification and
              cannot stand in for realized pricing. Product aggregation can raise convenience-based switching friction,
              but customers can still multi-home across cards and specialist applications. A reported lack of a
              developed ATM network also gives branch- and cash-rich incumbents a structural channel advantage for
              cash-intensive users.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP015
