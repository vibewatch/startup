        title: The operating model is modular but dependency-heavy
        blocks:
          - type: paragraph
            body: >-
              Public reporting indicates monobank runs on a split operating model. Universal Bank owns the regulated
              banking relationship, while Fintech-IT Group entities build the software, processing, and adjacent-product
              layers. Scroll describes a "companies by direction" structure with dedicated legal entities and teams,
              Kilobyte as the builder of monobank 2.0, and ACDC as a certified payment-services operator. KyivPost adds
              that roughly 90% of 2024 holding revenue still came from FintechBand, which supplies the core technology
              behind the monobank app. That modular architecture can speed product launches and ring-fence experiments,
              but it also means investors are underwriting service dependencies, transfer pricing, and governance
              arrangements that are mostly opaque in public materials.
