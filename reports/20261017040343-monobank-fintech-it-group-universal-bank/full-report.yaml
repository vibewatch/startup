  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and alternatives
        blocks:
          - type: paragraph
            body: >-
              The defensible landscape is broader than a list of neobanks. monobank competes for the primary financial
              relationship against direct mobile-bank peers and licensed incumbents, for individual jobs against
              specialist payments, lending, savings, insurance, marketplace, and telecom applications, and against a
              fragmented multi-provider or cash-based status quo. Its public proposition spans cards, deposits,
              government bonds, credit, transfers, insurance, business tools, a marketplace, and eSIM services.
              Universal Bank supplies the regulated banking perimeter, while the National Bank of Ukraine classifies the
              bank as solvent, privately owned, a Deposit Guarantee Fund participant, and systemically important. The
              profile table therefore treats unnamed categories as analytical alternatives, not verified peer companies,
              and leaves their scale and funding unresolved.
