      - number: '1.3'
        title: Funding, scale, and disclosure quality
        blocks:
          - type: paragraph
            body: |-
              The October 2025 financing is the key public step-change in monobank's company profile. Kyiv
              Post and Komersant both report that the UMAEF-led round lifted Fintech-IT Group's valuation to
              $1 billion, creating Ukraine's first fintech unicorn and confirming that the developer entity is
              still privately held rather than public. Both outlets also cite Forbes Ukraine and registry work
              implying that the check size was only about $18.5 million to $18.55 million for roughly a 1.9%
              effective stake, which means the valuation signal is clearer than the disclosed cash proceeds.

              The operating scale is easier to verify than the economics. Scroll says the group employs around
              630 specialists, while NBU and DGF-linked figures collected by Ukrainavi show Universal Bank at
              more than 10.8 million individual depositors and the company itself at 11 million people who had
              chosen monobank as of September 2026. NBU's supervisory profile shows a large bank balance sheet
              as well. What remains missing is a current public bridge from those banking metrics to
              consolidated Fintech-IT Group revenue, profitability, and investor rights, so later valuation
              work will still rely on partial disclosures.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO013
              - CO014
