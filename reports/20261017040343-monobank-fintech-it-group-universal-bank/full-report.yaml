        title: Exhibits
        blocks:
          - type: callout
            title: Competitive ranking remains unverified
            body: >-
              The evidence supports monobank's product breadth and regulated-bank linkage, but not a current named-peer
              ranking on scale, price, retention, service quality, or economics.
            calloutType: risk
            claimRefs:
              - CP014
              - CP016
          - type: callout
            title: Obtain a like-for-like peer pack
            body: >-
              Before underwriting moat durability, collect current tariffs, active-user and retention data, credit
              performance, service levels, and product roadmaps for the leading licensed incumbents, mobile-bank peers,
              and specialist substitutes.
            calloutType: recommendation
            claimRefs:
