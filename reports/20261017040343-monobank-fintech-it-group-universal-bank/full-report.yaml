      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The near-term moat case rests on a large installed base, a regulated bank relationship, broad product
              bundling, and adjacent Fintech-IT Group infrastructure. The durability case is less proven. The founder
              told Scroll that the Stereo and Koto projects were on hold, which weakens evidence that the domestic model
              transfers cleanly into foreign markets. Ukraine's 2026 macro backdrop also includes war damage, labor
              shortages, energy constraints, and investment uncertainty. Most product and usage evidence in this pool is
              company-controlled, and no current named-peer source discloses comparable scale, funding, pricing,
              retention, or strategic direction. Underwriting should therefore treat distribution strength as plausible,
              but a category-wide moat ranking as an open diligence item.
            claimRefs:
              - CP003
              - CP006
              - CP010
              - CP011
              - CP013
              - CP014
              - CP015
              - CP016
