        - id: credit
          label: Credit products
          summary: Credit limits, cash loans, installments, and split payments add lending monetization.
        - id: adjacent
          label: Adjacent services
          summary: Insurance, SME tools, eSIM, and marketplaces broaden commission opportunities.
        - id: revenue
          label: Revenue pools
          summary: Interest, interchange, fees, and partner commissions are plausible pools, but not publicly split.
        - id: cost
          label: Cost / capital filters
          summary: Funding cost, provisions, compliance, servicing, and product investment determine margin quality.
        - id: outcome
          label: Residual profit / financing need
