      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 单一体系集中是主要下行风险
            body: monobank 的公开风险面仍集中于一家受监管银行、一个受战争影响的地理市场和数个外部交付伙伴，而不是某个单一轰动事件。
