  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开规模和银行韧性支持继续关注，但控股公司透明度不足叠加宏观风险，使建议仍停留在继续研究。
    data:
      nodes:
        - id: scale
          label: 公开规模证明
          detail: 独立报道和产品触点显示，mono 已达到全国规模，覆盖广泛的零售和 SME 功能。
        - id: bank
          label: 银行韧性
          detail: NBU 仍显示 Universal Bank 具备偿付能力、系统重要性和盈利能力。
        - id: asset
          label: 另一项可投资资产
          detail: 定价对象是 Fintech-IT Group——mono 背后的软件控股公司，而不是 Universal Bank 单独实体。
        - id: opacity
          label: 缺少投资判断数据
          detail: 公开证据未披露融资轮规模、优先权条款、所有权稀释程度或经审计的控股公司合并口径财务数据。
        - id: macro
          label: 宏观 / 退出压力
          detail: 世界银行预计 2026 年增长放缓，并指出 2027 年外部融资存在不确定性。
        - id: outcome
          label: 建议 = research-more
          detail: 只有在完成更深入尽调或进入价格更有利时，才重新考虑。
      edges:
        - from: scale
          to: bank
          label: 支持关注
        - from: bank
          to: asset
          label: 但不等于
        - from: asset
          to: opacity
          label: 造成
        - from: opacity
          to: macro
          label: 被进一步放大
        - from: macro
          to: outcome
          label: 推动
    approximationNotes: 这条逻辑链是定性的，因为分配到的资料池缺少公开估值机制和控股公司合并口径财务数据。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
