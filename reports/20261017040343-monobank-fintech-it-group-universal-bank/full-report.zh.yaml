      - number: '8.4'
        title: 最终尽调要求与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              下一步尽调不是继续讲述品牌实力，而是用文件证明被定价的资产。优先索取完整的 2025 年 10 月条款清单和股东文件、Fintech-IT Group 及其子公司的经审计合并财务报表，以及从 Universal
              Bank 运营指标到实际归属于控股公司的现金流桥接。在这些文件出示前，纪律严明的投资者应把 $1.0 billion
              估值视为参考点，而非经验证的公允价值。论点失效触发点很直接：乌克兰宏观路径走弱、外部融资和改革进展延迟、Universal Bank 监管或盈利状况恶化，或新产品扩大范围却没有带来有吸引力的控股公司经济性。
            claimRefs:
