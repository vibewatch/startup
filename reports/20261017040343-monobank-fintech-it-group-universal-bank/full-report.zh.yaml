  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              证据支持将 monobank
              的核心市场定义为乌克兰的大众市场、移动优先的日常银行业务，而不只是“应用里的卡”。官方产品页面把远程开户、支付卡、存款、政府债券、消费信贷、保险、货币兑换和公用事业或点对点支付整合在一个界面；Universal
              Bank 与 TechUkraine
              也都将其描述为建立在持牌银行轨道上的无网点数字层。这一边界覆盖家庭日常资金流转、储蓄、短期限信贷及应用内附加金融服务，但不包括完整的企业资金管理、重度依赖网点咨询的银行业务，也不能据此声称 monobank
              能替代所有现金或外币流程。因此，现状替代方案仍是拥有实体基础设施的持牌银行，因为即便主要获客和服务模式以数字为先，部分现金业务仍通过 Universal Bank 或合作网点完成。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM008
