      - number: '8.2'
        title: 公开记录证明了什么、没有证明什么
        blocks:
          - type: paragraph
            body: >-
              公开融资报道一贯将这笔交易描述为对 Fintech-IT Group 的成长股权投资，UMAEF 成为首个金融投资者，并组织一批美国私人投资者。报道还称资金将用于扩展 SME
              服务、支付基础设施和更广泛的产品组合。这足以推断管理层计划如何使用资本，但不足以把 $1.0 billion 估值转化为可投资的判断依据。指定证据池中最好的当前运营数据来自乌克兰国家银行对 Universal
              Bank 的监管资料和 mono 自身产品页面；这些输入展示了规模、广度和监管基础，却没有连接到 Fintech-IT Group 的合并收入、现金创造或少数投资者保护。
