  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              可辩护的竞争格局不只是新银行名单。monobank
              既与直接移动银行同行和持牌传统银行争夺主要金融关系，也在单项需求上面对支付、借贷、储蓄、保险、市场及电信应用，还要面对多供应商或现金为主的分散化现状。其公开产品覆盖银行卡、存款、政府债券、信贷、转账、保险、商业工具、市场和
              eSIM 服务。Universal Bank
              提供受监管的银行边界；乌克兰国家银行则将该行列为偿付能力充足、私人所有、存款保障基金参与者和系统重要性银行。因此，画像表把未具名类别视为分析性替代方案，而非已核实的同业公司，并保留其规模和融资信息未解。
