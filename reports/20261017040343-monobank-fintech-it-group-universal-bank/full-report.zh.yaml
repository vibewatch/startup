      - number: '3.3'
        title: 定价、分销与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              公开定价证据并不对称。monobank 宣传免年费卡和应用内透明条款；一份无日期的第三方支付方式页面则称，使用自有资金转账免佣金、使用信贷资金转账收取 4%，而使用自有资金向外国银行卡转账收取 1%，最低 1
              美元或 1 欧元。这些第三方数字需要在当前应用内核实，不能代表实际成交价格。产品聚合可能提高基于便利性的切换摩擦，但客户仍可同时使用多张卡和专业应用。据报道，缺乏成熟 ATM
              网络也让网点和现金资源丰富的传统银行在现金密集型用户中获得结构性渠道优势。
