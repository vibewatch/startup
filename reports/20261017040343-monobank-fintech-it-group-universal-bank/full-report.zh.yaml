      - number: '2.2'
        title: 代理规模视角与当前需求信号
        blocks:
          - type: paragraph
            body: >-
              指定证据池提供了若干强需求代理指标，但没有清晰的 TAM/SAM/SOM 链条。公司及第三方来源指向极大使用量：monobank 宣称用户超过 11 million，Wikipedia 汇总的 NBU
              关联数据显示活跃卡 9.77 million 张，存款接近 UAH 108 billion。官方产品页面还提供了另一种参与度视角：每月有超过 1.6 million 人通过 Banka 捐赠，累计捐赠额为 UAH
              100 billion。世界银行则通过乌克兰近 $588 billion 的重建需求，以及私人资本可能承担 40%
              恢复成本，描绘了更大的宏观背景。这些指标不能直接比较：用户、卡片、存款、月度参与者、累计资金流和持续十年的恢复需求对应不同人群、单位和期间。它们可以界定采用率和金融活动，但无法合并成可信的收入 TAM、SAM 或
              SOM。
            claimRefs:
              - CM005
              - CM006
              - CM009
