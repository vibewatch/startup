      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              牛市、基准和悲观情景应以证据质量为框架，而不是围绕虚假的精确倍数构建。上行情景要求管理层在保持银行韧性的同时，把 2025 年 10 月融资转化为 SME 和相邻服务的可见变现。基准情景是 monobank
              继续作为乌克兰主导的数字银行分销层，但外部投资者仍缺少足以证明应高于上一轮价格支付的控股公司合并披露。熊市情景是战时宏观拖累、融资收紧或银行盈利能力走弱，在 Fintech-IT Group
              证明软件式经济性前压缩退出选择。入场纪律因此应取决于能否取得经审计的集团账目、完整融资文件，以及清晰解释银行经济效益如何映射到可投资实体。
            claimRefs:
