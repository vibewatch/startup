      - number: '2.3'
        title: 买方细分、采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              买方和用户证据指向三类实际需求：用 monobank 管理日常资金的零售家庭；用同一应用栈处理收款和运营流程的创业者与小企业；以及把 Banka
              当作可信收款通道的捐赠者或社区组织者。远程开户、快速发放虚拟卡、覆盖广泛的日常功能、确认前透明显示费用，以及将更多活动留在生态内的相邻服务，都在推动采用。商户端也具有经济意义，因为 monobank
              称商家承担免息分期付款成本，而创业者工具把税务、报送和支付任务放在同一应用中。约束同样清晰：部分外币现金流程仍依赖应用之外的银行基础设施，世界银行 2026
              年展望则强调增长疲弱、劳动力短缺和高能源成本。即便数字采用率仍高，这些因素也会拖慢借款需求和商户投资。
            claimRefs:
