  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据支持从业务活动到收入的逻辑，但不支持已实现的经济性。
    data:
      nodes:
        - id: scale
          label: 客户 / 卡
          value: 9.89
          unit: million active cards
          summary: Public scale proxies cluster around roughly 10 million clients/cards.
        - id: banking
          label: 核心银行业务
          summary: Transfers, bill pay, FX, deposits, and daily account usage run through the mono app.
        - id: credit
          label: 信贷产品
          summary: Credit limits, cash loans, installments, and split payments add lending monetization.
        - id: adjacent
          label: 相邻服务
          summary: Insurance, SME tools, eSIM, and marketplaces broaden commission opportunities.
        - id: revenue
          label: 收入池
          summary: Interest, interchange, fees, and partner commissions are plausible pools, but not publicly split.
        - id: cost
          label: 成本 / 资本筛选
          summary: Funding cost, provisions, compliance, servicing, and product investment determine margin quality.
        - id: outcome
          label: 剩余利润 / 融资需求
          summary: Public evidence reaches bank-level profit and a new funding round, not mono-specific burn or runway.
      edges:
        - from: scale
          to: banking
          label: 获客与日常使用
        - from: scale
          to: credit
          label: 信贷转化
        - from: scale
          to: adjacent
          label: 生态交叉销售
        - from: banking
          to: revenue
          label: 支付与余额活动
        - from: credit
          to: revenue
          label: 借贷收入
        - from: adjacent
          to: revenue
          label: 佣金 / 伙伴经济性
        - from: revenue
          to: cost
          label: 毛收入到净收入的利润率桥接
        - from: cost
          to: outcome
          label: 决定自筹增长还是需要新资本
    approximationNotes: 这是基于已披露产品、规模代理指标和银行层面财务背景的概念性桥接。现有公开证据没有披露产品层面的收入占比、损失率或毛利率计算，因此不主张累计桥接或按价值比例呈现的桥接。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI011
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向四层堆栈：客户应用、互动产品、受监管银行基础设施和 Fintech-IT Group 交付实体。
    data:
      layers:
        - label: 客户触点
          detail: 用户在 mono 中看到和使用的内容
          items:
            - 使用 Diia 或身份证件远程开户
            - 虚拟卡和实体卡
            - 转账、账单支付、存款、债券、贷款
          outputs:
            - 应用优先的银行工作流
            - 24/7 支持入口
        - label: 互动产品
          detail: 叠加在同一应用外壳中的高频模块
          items:
            - Banka 筹款
            - 分期和现金贷款
            - monomarket / monobazar 产品
            - eSIM 和团体支出
          outputs:
            - 已连接 1,300+ 个基金会
            - 1.6M 月度捐赠者
            - UAH 100B 捐款
        - label: 受监管银行基础设施
          detail: Universal Bank 提供持牌银行底座
          items:
            - NBU 第 92 号牌照
            - 参与存款保障基金
            - 系统重要性银行地位
          outputs:
            - 零售和企业主卡产品
            - 存款、债券和放贷权限
        - label: 信任与透明度触点
          detail: 公众无需内部权限即可验证的内容
          items:
            - App Store 隐私标签
            - 确认前可见的条款、费用、利率和限额
            - 24/7 在线聊天或电话支持口径
          outputs:
            - 具体的隐私披露触点
            - 直接运营保障证据有限
        - label: Fintech-IT Group 交付层
          detail: 构建并运营堆栈主要部分的私人实体
          items:
            - FintechBand 核心技术
            - Kilobyte 的 monobank 2.0
            - ACDC 支付服务运营商
            - 共享 HR / 财务 / 法务资源
          outputs:
            - 按法律实体划分的产品模块化
            - 集中的技术依赖
            - 据报告 ACDC 具备 PCI DSS + 卡组织认证
        - label: 相邻生态层
          detail: 可以深化钱包份额或伙伴触达的非核心资产
          items:
            - Expirenza
            - mono 基础设施
            - Loyalty.ai
            - mono 市场
          outputs:
            - 比单独的活期账户拥有更多变现路径
            - 核心产品与实验性产品之间的尽调边界更难划分
    approximationNotes: 仅为定性的公开堆栈重构；内部接口、供应商和服务边界没有公开记录。
    claimRefs:
      - CE005
      - CE006
      - CE011
      - CE012
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持一条以消费者为主导的旅程：从即时开户延伸到日常资金流转、慈善募款和企业主工作流。
    data:
      items:
        - label: 获客
          detail: 移动优先的产品主张通过应用商店，以及围绕速度和便利性的口碑触达用户。
          touchpoints:
            - Google Play / Apple App Store 描述
            - 移动优先定位
        - label: 开户
          detail: 身份验证后立即获得虚拟卡，实体卡另行寄送。
          touchpoints:
            - Diia 或身份证件验证
            - 先发虚拟卡，实体卡稍后寄送
        - label: 交易
          detail: 核心循环围绕同一界面内的转账、账单、卡、外汇、存款和信贷展开。
          touchpoints:
            - 点对点和 IBAN 支付
            - 卡、存款、贷款、返现
        - label: 扩大钱包份额
          detail: 分期、保险和市场平台触点把使用范围扩展到简单活期账户行为之外。
          touchpoints:
            - 分拆支付 / 分期计划
            - 保险和 monomarket
        - label: 社区循环
          detail: Banka 促成重复捐款和筹款行为，让 mono 不只在纯银行任务中保持可见。
          touchpoints:
            - 1,300+ 个基金会
            - 1.6 million 名月度捐赠者
        - label: 企业主延伸
          detail: SP 工具把个体经营者吸引到同一个应用中，而不要求他们另用一套 SME 银行堆栈。
          touchpoints:
            - 用于税务、报告和支付的 Business Portal
            - 聚焦乌克兰的拓展路径
    approximationNotes: 旅程图按作者编排顺序展示有证据支持的工作流阶段；不代表经过测量的转化率。
