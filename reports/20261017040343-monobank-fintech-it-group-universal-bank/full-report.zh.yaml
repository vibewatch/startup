            title: 尽调应聚焦公开记录没有展示的文件
            body: 改变投资判断最快的方法不是再读一篇新闻，而是直接获取 Universal Bank 零售信贷表现、合作伙伴 SLA、事件历史和经律师审阅的诉讼风险资料。
            calloutType: recommendation
