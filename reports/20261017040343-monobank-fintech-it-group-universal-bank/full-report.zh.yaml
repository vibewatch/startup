        title: 能力广度、信任与客户选择
        blocks:
          - type: paragraph
            body: >-
              monobank 可见的最强差异化来自整合，而非某项独占功能。官方页面描述了快速数字开户、持续支持、银行卡、支付、储蓄、信贷、投资、保险、商户工具、募资和商业服务都在一个界面内。Google Play 将
