  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              指定证据支持“继续研究”建议、低至中等信心、高风险评级，以及在公开 $1.0 billion 估值下偏高的估值判断。支持性因素是真实存在的：多家独立报道称 UMAEF 2025 年 10 月投资将
              Fintech-IT Group 估值定为 $1.0 billion；面向银行的软件集团位于 monobank 背后，官方和监管页面也显示产品覆盖广泛，Universal Bank
              具备偿付能力且具有系统重要性。但阻碍在于，同一批公开材料没有披露融资额、投资者优先权或经审计的控股公司合并经济情况。由于定价资产是 Fintech-IT Group，而不是 Universal Bank
              本身，银行层面的韧性有帮助，却不足以证明新投资者今天应按同一估值进入。
            claimRefs:
