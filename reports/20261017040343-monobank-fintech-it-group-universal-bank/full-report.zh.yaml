    data:
      points:
        - label: monobank
          x: 3
          'y': 3
          detail: 公开产品集合证明其银行关系广泛，并具备原生数字化整合能力。
        - label: 直接移动银行同业
          x: 2
          'y': 3
          detail: 概念类别；没有证据证明具体同业的广度。
        - label: 持牌既有银行
          x: 3
          'y': 1
          detail: 强调关系广度和实体分发的概念类别。
        - label: 专业金融科技公司
          x: 1
