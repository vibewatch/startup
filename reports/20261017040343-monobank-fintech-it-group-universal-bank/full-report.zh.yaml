chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              monobank 仍应被理解为一个双实体体系，而不是独立持牌银行。其官网“关于”页面称 monobank 是乌克兰首家无网点银行，但同一页面以及 Ukrainavi 的独立梳理都表明，零售产品依托 JSC
              Universal Bank 的牌照，并由 mono IT 团队参与打造。因此，公司销售的是无网点的消费者体验，底层仍依赖传统银行的资产负债表和银行权限。


              这一结构很重要，因为运营边界同时包含面向公众的产品品牌、受监管银行和独立开发者集团。monobank 官方页面披露的法定地址位于基辅；开发者访谈和 EBA 资料也说明，Universal Bank 为数字客户实施
              monobank 项目，而不是充当被动壳体。产品范围也不只是卡片应用：当前首页在同一界面推广银行卡、信贷、存款、政府债券、商业工具、保险、Banka 募资、市场和 eSIM 服务。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO011
      - number: '1.2'
        title: 领导层、控制权与治理依赖
        blocks:
          - type: paragraph
            body: >-
              控制权分布在开发者一侧和牌照持有者一侧。Scroll 的创始人访谈称，即使完成 2025 年融资，Oleg Gorokhovskyi 和 Mykhailo Rogalskyi 仍是 Fintech-IT
              Group 的平等大股东；Ukrainavi 援引与 NBU 相关的报道，则将 Serhii Tihipko 列为 Universal Bank
              的最终所有者，并持有间接重大股权。实际上，产品依赖创始人控制的产品与技术领导层，和另一个拥有牌照及审慎资产负债表的银行实体保持一致。


              公开记录支持创始人与市场的高度匹配，但也显示出明显的关键人物集中。Komersant 将 Gorokhovskyi 和 Rogalskyi 描述为 PrivatBank 前高管，Scroll 则显示改名为
              Fintech-IT Group 后，两人仍处于所有权核心。Ukrainavi 还揭示了后续章节最重要的治理问题：NBU 行长 Andriy Pyshnyi 表示，开发者公司不受央行监管，而 Universal
              Bank 的模式存在第三方风险，因为它依赖外部公司。
            claimRefs:
