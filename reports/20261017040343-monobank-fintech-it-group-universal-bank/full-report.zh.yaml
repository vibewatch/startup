      - number: '1.4'
        title: 里程碑与待解问题
        blocks:
          - type: paragraph
            body: >-
              尽管公开披露尚未完全衔接，里程碑顺序仍然清晰。Universal Bank 提供了 1994 年的银行基础，Fintech Band 于 2017 年打造首个 monobank 应用，集团在 2024 和
              2025 年重新梳理更清晰的公司结构，2025 年 10 月的 UMAEF 融资则通过给开发者一侧定出 $1 billion 价格，让外部投资者看清了这一实体。到 2026 年末，剩余不确定性已不在于
              monobank 是否是规模化业务，而在于如何对齐银行的受监管指标、开发者公司的私人公司经济情况，以及新少数股东拥有的确切权利。


              近期最大的尽调问题是分母质量。公司公布的用户数和监管机构关联的储户数都指向极大规模，但两者并非同一人群，公开材料也没有提供清晰换算。另一个未解问题是治理透明度：monobank 产品、Universal Bank
              和 Fintech-IT Group 明显相互关联，但保留的公开资料对确切的经济分成、股权表保护措施以及向外部投资者披露的董事会或同意权仍语焉不详。
            claimRefs:
