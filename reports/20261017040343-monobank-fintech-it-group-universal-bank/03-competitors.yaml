schemaVersion: "report-v2"
artifact: competitors
slug: monobank-fintech-it-group-universal-bank
runDate: 2026-10-17
company:
  name: "monobank (Fintech-IT Group / Universal Bank)"
chapter:
  number: 3
  title: Competitors
  summary: >-
    monobank combines a broad mobile-banking proposition with the licensed balance-sheet
    perimeter of Universal Bank and an expanding Fintech-IT Group product ecosystem. That
    breadth creates distribution and engagement advantages, but the assigned evidence does
    not support a named, current peer ranking; ATM dependence, stalled foreign-market
    projects, and Ukraine's operating environment limit confidence in moat durability.
sections:
  - id: competitive-landscape
    title: Competitive landscape and alternatives
    body: >-
      The defensible landscape is broader than a list of neobanks. monobank competes for the
      primary financial relationship against direct mobile-bank peers and licensed
      incumbents, for individual jobs against specialist payments, lending, savings,
      insurance, marketplace, and telecom applications, and against a fragmented
      multi-provider or cash-based status quo. Its public proposition spans cards, deposits,
      government bonds, credit, transfers, insurance, business tools, a marketplace, and
      eSIM services. Universal Bank supplies the regulated banking perimeter, while the
      National Bank of Ukraine classifies the bank as solvent, privately owned, a Deposit
      Guarantee Fund participant, and systemically important. The profile table therefore
      treats unnamed categories as analytical alternatives, not verified peer companies,
      and leaves their scale and funding unresolved.
    claimRefs: [CP002, CP005, CP006, CP010, CP014, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-customer-choice
    title: Capability breadth, trust, and customer choice
    body: >-
      monobank's strongest visible differentiation is integration rather than a single
      exclusive feature. Official surfaces describe rapid digital onboarding, continuous
      support, cards, payments, savings, credit, investments, insurance, merchant tools,
      fundraising, and commerce in one interface. Google Play identifies Universal Bank as
      the licensed provider and claims more than 11 million users; Apple's storefront
      displays a 4.9 rating across 967,000 ratings. These are useful reach and engagement
      signals, but they are platform-displayed or company-supplied rather than
      independently audited retention measures. A capability comparison against named
      peers cannot be completed from this pool, so unsupported cells remain unknown instead
      of being converted into false competitive scores.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP012, CP016]
    tableRefs: [TP002]
  - id: pricing-distribution-and-switching
    title: Pricing, distribution, and switching friction
    body: >-
      Public pricing evidence is asymmetric. monobank advertises a no-fee card and
      transparent in-app terms, while an undated third-party payment-method page describes
      zero commission for own-money transfers, 4% for credit-funded transfers, and a 1%
      charge with a one-dollar or one-euro minimum for transfers to foreign-bank cards using
      own funds. Those third-party figures require current in-app verification and cannot
      stand in for realized pricing. Product aggregation can raise convenience-based
      switching friction, but customers can still multi-home across cards and specialist
      applications. A reported lack of a developed ATM network also gives branch- and
      cash-rich incumbents a structural channel advantage for cash-intensive users.
    claimRefs: [CP001, CP002, CP008, CP009, CP015]
    tableRefs: [TP003]
  - id: moat-durability
    title: Moat durability and displacement risk
    body: >-
      The near-term moat case rests on a large installed base, a regulated bank
      relationship, broad product bundling, and adjacent Fintech-IT Group infrastructure.
      The durability case is less proven. The founder told Scroll that the Stereo and Koto
      projects were on hold, which weakens evidence that the domestic model transfers
      cleanly into foreign markets. Ukraine's 2026 macro backdrop also includes war damage,
      labor shortages, energy constraints, and investment uncertainty. Most product and
      usage evidence in this pool is company-controlled, and no current named-peer source
      discloses comparable scale, funding, pricing, retention, or strategic direction.
      Underwriting should therefore treat distribution strength as plausible, but a
      category-wide moat ranking as an open diligence item.
    claimRefs: [CP003, CP006, CP010, CP011, CP013, CP014, CP015, CP016]
tables:
  - id: TP001
    title: Competitor and alternative profile
    columns:
      - Alternative
      - Category
      - Public scale or funding
      - Target job or segment
      - Differentiation
      - Limitation or evidence status
    rows:
      - [monobank, "Direct mobile-first bank proposition", ">11 million users claimed in current app-store copy; funding not assessed here", "Ukrainian individuals and entrepreneurs", "Broad in-app banking and adjacent services backed by Universal Bank", "User count is company-supplied; retention and peer-comparable economics are unavailable"]
      - ["Licensed incumbent bank", "Incumbent / direct alternative", unknown, "Customers valuing full-service banking and physical cash access", "Potential branch, ATM, balance-sheet, and trust distribution", "No named incumbent profile was returned in the assigned evidence"]
      - ["Direct mobile-bank peer", "Direct digital peer", unknown, "Digitally engaged retail and small-business customers", "Potentially similar onboarding and mobile servicing", "No named peer scale, funding, pricing, or strategy was supported"]
      - ["Specialist fintech application", "Adjacent / unbundled substitute", unknown, "Customers selecting payments, credit, investing, insurance, or commerce separately", "Depth in one workflow and ability to multi-home", "No named specialist was supported for a current comparison"]
      - ["Fragmented multi-provider stack", "Substitute / internal assembly", "Not applicable", "Households or merchants combining bank accounts, apps, and manual workflows", "Provider choice and reduced single-platform dependence", "Convenience cost and integration quality are not quantified"]
      - ["Cash and branch-led status quo", "Status quo substitute", "Not applicable", "Cash-intensive or digitally reluctant users", "Physical access and established branch habits", "No current usage share was available"]
    notes: >-
      Category map based on the jobs covered by monobank's public product surfaces. Unknown
      means the assigned pool did not contain current competitor-specific evidence; category
      alternatives are analytical constructs, not assertions about a named provider.
    claimRefs: [CP002, CP003, CP005, CP006, CP008, CP010, CP012, CP016]
  - id: TP002
    title: Feature and capability matrix
    columns:
      - Buying criterion
      - monobank
      - Direct mobile-bank peers
      - Licensed incumbents
      - Specialist fintechs
      - Fragmented or cash status quo
    rows:
      - ["Mobile onboarding", "Document or Diia verification; virtual card issued in-app", unknown, unknown, unknown, "Not integrated"]
      - ["Core money movement", "Card, account, phone-number, IBAN, and international transfers described", unknown, unknown, unknown, "Manual or provider-specific"]
      - ["Credit and installments", "Credit limit, split payments, installments, and cash loan described", unknown, unknown, unknown, "Separate provider or unavailable"]
      - ["Savings and investment", "Digital savings, deposits, and government bonds described", unknown, unknown, unknown, "Separate provider or manual"]
      - ["Adjacent services", "Insurance, eSIM, marketplace, fundraising, and business tools described", unknown, unknown, "Potential single-workflow depth; not evidenced by named provider", "Multiple providers required"]
      - ["Regulatory and balance-sheet posture", "Universal Bank is NBU-licensed and listed as systemically important", unknown, unknown, "Varies by license and product; not evidenced", "No integrated licensed provider"]
    notes: >-
      monobank cells reflect official, platform, association, and NBU pages. Competitor cells
      are deliberately unknown where no named-provider evidence was assigned; descriptive
      category text is not a benchmark score.
    claimRefs: [CP001, CP002, CP003, CP005, CP006, CP010, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Product or action
      - Public monobank term
      - Evidence vintage and unit
      - Named-peer comparison
      - Underwriting implication
    rows:
      - ["Base card", "Official site advertises no fees", "Current webpage; card-level claim", unknown, "Acquire the full current tariff before treating the card as free"]
      - ["Own-money card transfer", "Third-party page states no commission", "Undated fetched text; percentage fee", unknown, "Verify destination and network exceptions in-app"]
      - ["Credit-funded transfer", "Third-party page states 4%", "Undated fetched text; percentage of transfer", unknown, "Funding source changes effective price"]
      - ["Foreign-bank card transfer using own funds", "Third-party page states 1%, minimum USD 1 or EUR 1", "Undated fetched text; percentage plus minimum", unknown, "Cross-border or foreign-bank use may erode the free-price message"]
      - ["Split payments", "Official site says the customer pays no interest because the seller covers it", "Current webpage; merchant-subsidized model", unknown, "Merchant economics and realized eligibility remain undisclosed"]
      - ["Competitor packages", unknown, "No assigned named-peer tariff", unknown, "A like-for-like price ranking is not supportable"]
    notes: >-
      Official statements are list terms, not realized revenue or unit economics. Third-party
      fee figures have no visible publication date in the fetched text and require direct
      tariff confirmation; null peer cells represent missing evidence, not zero price.
    claimRefs: [CP001, CP009, CP016]
figures:
  - id: FP001
    title: Competitive positioning by relationship breadth and digital integration
    type: quadrant
    summary: >-
      An ordinal category map places monobank against broad alternatives without implying a
      measured market ranking.
    data:
      points:
        - label: monobank
          x: 3
          y: 3
          detail: "Broad banking relationship and digital-native integration evidenced by the public product set."
        - label: Direct mobile-bank peer
          x: 2
          y: 3
          detail: "Conceptual category; named-peer breadth was not evidenced."
        - label: Licensed incumbent
          x: 3
          y: 1
          detail: "Conceptual category emphasizing relationship breadth and physical distribution."
        - label: Specialist fintech
          x: 1
          y: 3
          detail: "Conceptual category emphasizing digital depth in a narrower job."
        - label: Fragmented multi-provider stack
          x: 2
          y: 2
          detail: "Conceptual category assembled across providers rather than one integrated interface."
        - label: Cash and manual status quo
          x: 1
          y: 1
          detail: "Conceptual substitute with limited integrated digital functionality."
    approximationNotes: >-
      Ordinal axes run from 1 (narrow or low) to 3 (broad or high). Only monobank's placement
      is grounded in retained product evidence; all other points are category archetypes and
      must not be read as measured company scores.
    claimRefs: [CP002, CP005, CP014, CP016]
callouts:
  - calloutType: risk
    title: Competitive ranking remains unverified
    body: >-
      The evidence supports monobank's product breadth and regulated-bank linkage, but not a
      current named-peer ranking on scale, price, retention, service quality, or economics.
    claimRefs: [CP014, CP016]
  - calloutType: recommendation
    title: Obtain a like-for-like peer pack
    body: >-
      Before underwriting moat durability, collect current tariffs, active-user and retention
      data, credit performance, service levels, and product roadmaps for the leading licensed
      incumbents, mobile-bank peers, and specialist substitutes.
    claimRefs: [CP015, CP016]
