    title: Risk heatmap
    type: matrix
    summary: >-
      Wartime macro stress and regulated-bank dependency remain the two highest residual risks; partner rollout and
      privacy/service integrity sit one tier lower because public mitigations are visible but incomplete.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Banking-license and conduct supervision
          values: ["High", "High", "Medium", "High"]
        - label: Wartime macro and financing environment
          values: ["High", "High", "Low", "High"]
        - label: Litigation and governance transparency
          values: ["Medium", "Medium-High", "Low", "Medium-High"]
        - label: Platform and partner rollout dependency
          values: ["Medium", "Medium-High", "Medium", "Medium-High"]
        - label: Privacy and service-integrity at scale
          values: ["Medium-High", "High", "Medium", "Medium-High"]
        - label: Talent availability and execution bandwidth
          values: ["Medium", "Medium", "Medium", "Medium"]
    approximationNotes: >-
      Heatmap cells are qualitative analyst ratings synthesized from the cited public evidence; they are not modeled
      probabilities or audited control scores.
    claimRefs: [CR001, CR002, CR004, CR005, CR008, CR009, CR010, CR011, CR012]
callouts:
  - calloutType: risk
    title: Single-stack concentration is the main downside
    body: >-
      monobank's public risk surface still concentrates on one regulated bank, one war-exposed geography, and several
      external delivery partners rather than on a single sensational event.
    claimRefs: [CR001, CR002, CR004, CR005, CR009]
  - calloutType: recommendation
    title: Diligence should focus on files the public record does not show
    body: >-
      The fastest way to change conviction is not another press article but direct access to Universal Bank retail-credit
      performance, partner SLAs, incident history, and counsel-reviewed litigation exposure.
    claimRefs: [CR003, CR005, CR014]
