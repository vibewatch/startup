      - ["Wartime macro, credit, and funding stress", "Ukraine economy and banking system", "Ongoing 2026 macro slowdown and external-financing uncertainty", "High", "High", "Profitable bank, donor-supported economy, no evidence of immediate distress in the assigned pool", "High", "Request current NPL, reserve, funding-mix, and liquidity disclosures for Universal Bank's mono-linked portfolio"]
      - ["Historical litigation or structure overhang around the 2025 financing", "Ukraine / Cyprus holding structure", "Public reports note unconfirmed legal-risk hypotheses and undisclosed round size", "Medium", "Medium-High", "Institutional UMAEF backing and 2025 group formalization", "Medium-High", "Commission local counsel memo on PrivatBank-linked exposure, shareholder rights, and Hallstatt-level protections"]
    notes: >-
      Severity ordering is qualitative and based only on retained public evidence. Residual exposure is the post-mitigation
      view; it does not substitute for bank-level supervisory files or legal diligence.
    enumerationScope:
      coverage: partial
      basis: >-
        Public-source register covering the most decision-relevant legal and regulatory exposures visible in the assigned
        pool as of the 2026-10-17 run date, not an exhaustive docket or supervisory inventory.
    claimRefs: [CR001, CR002, CR004, CR005, CR013, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Evidence
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Privacy or service incident at mass retail scale", "Medium-High", "High", "11M+ users, 967k App Store ratings, and identity-linked data categories increase blast radius", "Medium", "Medium-High", "No public incident log or breach-history disclosure appears in the assigned pool"]
      - ["Credit, AML, or consumer-conduct failure in lending and installment flows", "High", "High", "Credit limits, installments, deposits, and donation/payment products create multiple regulated decision points", "Medium", "High", "No public mono-specific complaint, loss-rate, or underwriting-vintage data in the assigned pool"]
      - ["Execution slippage from broad product surface and parallel initiatives", "Medium", "Medium-High", "Retail banking, Banka, insurance, business tools, and staged new-market rollout all compete for execution focus", "Medium", "Medium-High", "No segment-level staffing, roadmap, or service-level disclosure in the assigned pool"]
      - ["Talent and operating-rhythm strain under wartime conditions", "Medium", "Medium", "630 specialists plus planned hiring sit inside an economy facing labor shortages and infrastructure stress", "Medium", "Medium", "No attrition, bench, or redundancy data in the assigned pool"]
    notes: >-
      The register mixes direct public facts with risk synthesis. Null-free ratings are directional management judgments
      anchored to the cited claims, not measured loss frequencies.
    claimRefs: [CR003, CR005, CR007, CR010, CR011, CR012, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / surface
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Visible mitigation
      - Residual exposure
    rows:
      - ["Regulated-bank sponsor", "Universal Bank / NBU perimeter", "Accounts, credit decisions, deposits, and licensing umbrella", "Very high", "Any supervisory, capital, or conduct issue at Universal Bank constrains mono product economics and change velocity", "High", "Systemically important, solvent, profitable bank with deposit-guarantee participation", "High"]
      - ["Expansion and payments infrastructure", "Issuing, BIN, network, KYC, and processing providers", "Cross-border launch and transaction enablement", "High for new-market rollout", "Launch timing or feature scope slips when partner readiness lags or jurisdictional approvals differ", "Medium-High", "Multi-provider architecture and phased rollout", "Medium-High"]
      - ["Mobile distribution and customer trust rails", "Apple App Store / Google Play / in-app partner ecosystem", "App distribution, updates, wallet integrations, and consumer discovery", "High on mobile channels", "Store-policy, ratings, privacy, or release friction weakens acquisition and trust", "Medium", "Presence on both major app stores and strong visible ratings on iOS", "Medium"]
    notes: >-
      Concentration reflects practical dependency rather than contractual exclusivity. Public materials do not disclose
      partner SLAs, switching costs, or contingency arrangements.
    claimRefs: [CR001, CR002, CR008, CR009, CR010, CR011]
figures:
