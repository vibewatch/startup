company:
  name: monobank (Fintech-IT Group / Universal Bank)
chapter:
  number: 7
  title: Risks
  summary: >-
    monobank's highest residual risk is concentration on one regulated-bank stack inside a war-stressed Ukrainian
    economy, not a single isolated red flag. Universal Bank's licensed, profitable, systemically important status is a
    meaningful mitigation, but public evidence still leaves product-level credit quality, litigation edge cases, and
    partner concentration materially under-disclosed.
sections:
  - id: core-downside-concentration
    title: Core downside concentration
    body: >-
      The core risk picture is concentrated rather than diffuse. monobank's retail product set sits inside Universal
      Bank's licensed perimeter, which is helpful for credibility and deposit protection but also creates a single-bank
      dependency for credit decisions, consumer protection, and supervisory outcomes. The macro overlay remains harsh:
      the World Bank still expects slower Ukrainian growth in 2026, cites labor shortages and high energy costs, and
      calls 2027 external financing a major uncertainty. That backdrop matters because monobank combines large retail
      scale, credit products, payments, deposits, donations, and insurance-like distribution surfaces. The risk heatmap
      therefore ranks wartime macro stress and regulated-bank dependence as the top residual exposures, ahead of
      expansion and app-distribution risks.
    claimRefs: [CR001, CR002, CR004, CR005, CR011, CR012]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-credit-and-customer-trust
    title: Regulatory, credit, and customer-trust exposure
    body: >-
      The strongest public mitigation is that Universal Bank is not an unlicensed shell: the NBU profile shows a
      solvent, privately owned, systemically important bank that participates in the Deposit Guarantee Fund and reports
      substantial assets, equity, and profit. That does not remove downside. Consumer lending, installment products,
      deposits, government bonds, and donations all raise conduct, AML, fraud, and liquidity sensitivities. The Apple
      App Store listing also shows a large consumer footprint and a sensitive data surface linked to user identity,
      increasing the blast radius of any privacy, outage, or fraud-control failure. On legal and governance risk, the
      October 2025 $1 billion valuation headline is easier to observe than to underwrite: public reporting says the
      exact round size was undisclosed and that speculation about historical PrivatBank-related legal exposure remained
      unconfirmed, so legal diligence cannot stop at press coverage.
    claimRefs: [CR002, CR003, CR010, CR011, CR012, CR013, CR014]
    tableRefs: [TR002]
  - id: partner-dependencies-and-kill-criteria
    title: Partner dependencies and kill criteria
    body: >-
      Public materials point to meaningful partner and execution dependencies, especially for growth beyond the core
      Ukrainian retail base. monobank.com's separate MONOBANK rollout is explicitly staged, with timing and availability
      dependent on market and partner readiness, while the same site lists multiple evaluated or confirmed providers
      across issuing, identity, processing, and payment rails. Scroll's interview adds two more execution signals:
      corporate-structure work was delayed by the full-scale invasion, and at least two international projects
      (Stereo and Koto) are currently on hold. The practical kill criteria are monitorable: any NBU supervisory action
      that changes Universal Bank's status, any visible deterioration in bank-level credit or capital metrics, or a
      continuing inability to convert staged rollout plans into live partner-backed launches should lower conviction
      materially.
    claimRefs: [CR001, CR006, CR007, CR008, CR009, CR015]
    tableRefs: [TR003]
tables:
