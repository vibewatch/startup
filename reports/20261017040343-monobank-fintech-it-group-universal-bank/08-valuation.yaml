      - Current support
      - What would change the view
      - Evidence weight
    rows:
      - ["Thesis: proven consumer distribution", "Mono's official surfaces still show broad cards, lending, deposits, payments, business tools, insurance, eSIM, and Banka functionality.", "Show segment economics proving this breadth converts into durable holdco cash flow.", "Supported on product breadth; weak on monetization disclosure."]
      - ["Thesis: regulated operating backbone", "NBU still lists Universal Bank as solvent, privately owned, a Deposit Guarantee Fund participant, and systemically important.", "Provide explicit agreements showing how bank performance accrues to Fintech-IT Group minority investors.", "Strong for operating resilience; incomplete for equity value."]
      - ["Anti-thesis: priced round without underwriting visibility", "Independent reports repeat the $1.0 billion mark but not the round size, preferences, or governance protections.", "Share term sheet, security type, investor rights, and post-money ownership.", "High conviction concern."]
      - ["Anti-thesis: macro and exit timing risk", "World Bank projects slower 2026 growth and flags 2027 financing uncertainty for Ukraine.", "Demonstrate a financing path or exit route that is resilient to slower growth and tighter capital markets.", "High conviction concern."]
    notes: "Rows separate what the assigned evidence proves today from the missing documents required to convert those proofs into an investable valuation case."
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV008, CV009, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Public assumptions
      - Valuation / return logic
      - Probability signal
    rows:
      - ["Bull", "New capital accelerates SME services and adjacent products, Universal Bank stays profitable/systemically important, and management opens auditable holdco economics.", "Only then could the $1.0 billion mark look like an early entry into a broader fintech platform rather than a peak headline valuation.", "Possible, but not demonstrated in public evidence yet."]
      - ["Base", "Mono keeps strong distribution and product breadth, but outsiders still see mostly bank-level and product-level data rather than consolidated holdco disclosures.", "A wait posture is rational because the public mark exists but cannot yet be underwritten on economics or investor protections.", "Most consistent with the assigned evidence."]
      - ["Bear", "Ukraine growth slows, external financing stays uncertain, bank profitability weakens, or new products fail to monetize.", "The current mark would look stretched and vulnerable to a down-round, delayed IPO, or long hold period with weak visibility.", "Credible downside given macro and disclosure risk."]
    notes: "Scenarios are milestone-based rather than model-based because the assigned pool lacks public round size, cap-table mechanics, and audited group financial statements."
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
