  topStrengths:
    - >-
      Crimson has crossed the threshold from boutique consultancy to scaled global education platform, with reported
      $100M+ revenue and a unicorn financing event.
    - >-
      CGA and Revision Village diversify the company beyond one-off admissions consulting into recurring tuition and
      software-like exam-prep demand.
    - >-
      Public evidence supports meaningful international reach, premium brand positioning, and multiple distinct customer
      entry points.
    - >-
      Revision Village adds a potentially higher-quality digital revenue stream than the labor-heavy counseling business
      alone.
    - >-
      The latest round included recognizable investors and signals that sophisticated capital still sees strategic
      upside in the platform.
  topRisks:
    - Audited financials, segment margins, churn, and cohort retention are not public, limiting valuation confidence.
    - >-
      Premium pricing and category criticism expose Crimson to reputational and affordability risk if outcomes or
      service quality disappoint.
    - >-
      The school product depends materially on accreditors, external exam ecosystems, and a labor-heavy teacher/advisor
      base.
    - >-
      The latest $1B valuation leaves limited margin for error unless internal metrics are materially stronger than
      public evidence shows.
    - >-
      Cap-table and liquidation-preference terms are undisclosed, so true equity economics could differ sharply from
      enterprise-value narratives.
  unresolvedGaps:
    - Audited FY2023-FY2025 financial statements with revenue, gross margin, EBITDA, and cash flow by segment.
    - Cohort retention, churn, attach-rate, and CAC data across counseling, CGA, and Revision Village.
    - Full cap table, liquidation preferences, dilution terms, and any secondary-market transfer restrictions.
    - >-
      Evidence on school-unit economics including teacher utilization, student retention, and exam-centre completion
      outcomes.
    - Governance and IPO-readiness materials that would show whether a near-term public-listing path is realistic.
