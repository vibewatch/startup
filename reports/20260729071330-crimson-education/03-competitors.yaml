callouts:
- calloutType: strength
  title: Crimson is differentiated by scope rather than by a single feature
  body: Most direct peers specialize in counseling, tutoring, or test prep. Crimson’s combination of premium consulting, online schooling, and exam-prep adjacencies creates a broader student-lifecycle proposition than typical admissions boutiques.
  claimRefs:
  - CP009
  - CP021
  - CP030
- calloutType: risk
  title: Competitive pressure is intensifying at the lower-complexity layers
  body: Essay coaching, basic application planning, and tutoring are becoming easier to compare across review sites and easier to substitute with scaled or AI-enabled tools. Premium providers must therefore defend value through outcomes and scope, not just prestige.
  claimRefs:
  - CP008
  - CP024
  - CP032
- calloutType: insight
  title: Public comps matter mostly as cautionary signals, not direct peer multiples
  body: Duolingo, Coursera, Chegg, and Nerdy help frame how the market values education businesses with very different models. They are useful for understanding investor appetite and downside risk, but not as clean one-for-one substitutes for Crimson’s consulting economics.
