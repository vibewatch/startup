- id: scaled-alternatives
  title: Scaled Tutoring, Test-Prep, and Public-Platform Alternatives
  body: 'Kaplan, Princeton Review, Varsity Tutors, and broader public education platforms matter because they compete for overlapping household education budgets even when they do not replicate Crimson’s exact service. Kaplan and Princeton Review bring brand familiarity and standardized delivery. Varsity Tutors, through Nerdy, shows that live online instruction can be scaled into a public-company platform. At the edge of the peer set, Duolingo and Coursera are not admissions-consulting competitors, but they are important reference points for how education brands can convert engagement into large public valuations—or fail to do so if differentiation weakens.


    Chegg is the most useful adverse signal in this wider set. Its public-market compression illustrates how fast an education brand can lose investor confidence when perceived defensibility erodes under AI pressure or category saturation. That does not mean Crimson is “the next Chegg,” but it does mean investors should not assume all education platforms deserve premium multiples merely because the broader theme is attractive. The category contains both compounding winners and sharp deratings.'
