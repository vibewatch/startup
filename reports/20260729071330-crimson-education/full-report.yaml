            body: >-
              Crimson is no longer a single-product admissions consultancy. The visible stack now spans high-touch
              counseling, CGA as a full online school, and Revision Village as a scaled exam-prep platform. That matters
              because the customer jobs are distinct: families can buy help winning admissions outcomes, replace or
              supplement a local school with portable credentials, or purchase self-serve revision support for IB exams.
              Public sources consistently present those surfaces as complementary rather than separate experiments.


              The portfolio design also explains why Crimson sits awkwardly in simple peer sets. A pure counseling firm
              would not need curriculum approvals, student handbooks, or school operations; a pure online school would
              not naturally own a dominant IB revision brand; and a pure software subscription business would not rely
              so heavily on advisors, teachers, and family-facing policies. The combination is strategically attractive,
