      - number: '8.4'
        title: Comparables, Disclosure Gap, and Diligence Triggers
        blocks:
          - type: paragraph
            body: >-
              The comp set is useful mainly as a set of valuation guardrails. Duolingo is the upper bound, Coursera and
              Udemy show middle-ground scaled education platforms, and Chegg, Nerdy, and 2U show how badly
              education-market sentiment can compress when quality or resilience are doubted. Pearson adds a mature
              incumbent reference point but not a direct peer. None of them match Crimson’s exact model, yet together
              they provide a better pricing frame than the private round alone.


              The other comp lesson is governance and disclosure. Public peers file annual reports and expose investors
              to far more operating detail than Crimson currently provides. Until Crimson can bridge that disclosure gap
              with audited numbers and customer-economics data, the proper posture is to keep the recommendation
              conditional and the valuation stance disciplined. The diligence triggers are therefore not cosmetic. They
              are the specific items that determine whether Crimson should be priced closer to premium public brands or
              closer to the market’s more skeptical education-platform outcomes.
            claimRefs:
              - CV009
