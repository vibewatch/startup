              diversified than a single tuition product.


              What the public record does not show is the durability math. There is no disclosed NRR, GRR, churn,
              renewal rate, or attach rate across the portfolio. As a result, analysts can say the business has
              meaningful customer proof, but not whether that proof compounds efficiently over time. The retention story
              therefore remains an inference based on continuity, satisfaction, and breadth of use cases rather than on
              hard cohort evidence. That missing disclosure matters more here than in many consumer categories because
              education relationships can look durable in anecdotes while quietly churning at transition points such as
              exam completion, school re-entry, or university admission. A data room should therefore break continuity
