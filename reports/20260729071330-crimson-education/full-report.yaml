  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Crimson sits in a crowded but segmented landscape. Its closest direct competitors are not generic tutoring
              brands; they are premium college-admissions consultancies that sell strategy, counselor access, essay
              support, and application project management over months or years. Collegewise and IvyWise fit that
              direct-comparison bucket best based on their own positioning and on multiple ranking and review sites.
              Kaplan, Princeton Review, and Varsity Tutors matter too, but they compete more through tutoring, test
              prep, or broad learning support than through the same prestige-oriented full-journey consulting model.


              The practical result is that Crimson faces competition on several layers at once: bespoke premium
              consultancies for affluent families; scaled tutoring and test-prep brands for narrower budgets or narrower
              needs; and self-service or school-counselor alternatives for families unwilling to pay. No single
              competitor perfectly mirrors Crimson’s international positioning plus adjacent products such as online
              school and IB-prep. That is a meaningful differentiation point, but it also means the relevant peer set
              must be constructed rather than taken from one standard industry list.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
              - CP021
