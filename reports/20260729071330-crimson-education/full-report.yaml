            body: >-
              Crimson’s visible financing story culminates in the November 2024 Series D that multiple independent
              outlets place at roughly NZ$67.6 million and about a NZ$1 billion valuation. The investor roster is
              unusually strong for a company that still sits in the grey zone between consultancy, edtech platform, and
              school operator: Movac led, while HEAL Partners, Icehouse Ventures, U.S. News, HighSage Ventures, and Five
              Sigma also appeared in round coverage. HEAL and Icehouse both maintain public materials that reinforce
              their active involvement.


              Earlier valuation markers show a staircase rather than a single leap. Public sources cite a valuation
              around NZ$410 million in 2019, then about US$550 million in 2022, before the 2024 unicorn mark. Database
              tallies of total capital raised are less consistent, with CB Insights, Tracxn, and other profile sites
              differing on exact totals. The most reasonable diligence view is that Crimson has raised well north of
              US$100 million, but that only a full cap table will reconcile the exact mix of primary financings, earlier
