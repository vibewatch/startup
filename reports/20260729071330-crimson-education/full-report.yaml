      - number: '1.2'
        title: Portfolio Evolution from Counseling into Schools and Exam Resources
        blocks:
          - type: paragraph
            body: >-
              Crimson’s business has expanded beyond admissions consulting into a broader portfolio that tries to
              accompany students across multiple phases of the education journey. The clearest expansion vehicle is
              Crimson Global Academy, the online private high school the group launched in 2019. CGA positions itself as
              a live, globally delivered online school rather than a static self-paced course catalog, and its official
              pages say it offers Cambridge IGCSEs, A Levels, Advanced Placement, and a US high school diploma.
              Fundraising coverage adds scale context by describing roughly 1,700 students from about 60 countries and
              more than 200 teachers. Those numbers make CGA strategically meaningful rather than peripheral.


              Crimson has also built or acquired adjacent products to deepen wallet share with the same customer base.
              Revision Village is the most visible example: the IB-prep platform says it is trusted by 85% of IBDP
              students worldwide, giving Crimson a stronger foothold in the high-achievement academic support segment.
              Series D reporting and company-adjacent sources describe Crimson as having assembled a broader roll-up
              that includes NumberWorks’nWords and Collegewise alongside Revision Village and online-school assets. That
              portfolio logic supports management’s stated ambition to become a long-horizon educational partner rather
              than a one-off admissions consultant.
