companyProfile:
  summary: >-
    Crimson Education was founded in 2013 in New Zealand by Jamie Beaton, Sharndre Kushor, and Fangzhou Jiang as a
    premium university-admissions advisory business. It has since expanded into a broader education platform that
    includes Crimson Global Academy (CGA), an accredited online school serving 1,700+ students from 60+ countries, and
    Revision Village, a scaled IB exam-prep product. In November 2024 the company raised NZ$67.6M at a unicorn valuation
    and reported trailing annual revenue above $100M, but it remains privately held and selectively disclosed.
