  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The cleanest public risk evidence sits in consumer law, privacy, and contract design. Commerce Commission
              materials show that unfair terms, cancellations, and subscription practices are actively policed areas in
              New Zealand, while the Privacy Commissioner materials spell out meaningful rights for data subjects. Those
              obligations matter more here than in a simple content website because CGA and related surfaces interact
              with minors, parents, payment flows, and cross-border records.


              Crimson’s own documents make the exposure concrete. The privacy notice describes substantial data
              collection and third-party storage, while the terms require advance fees, structured withdrawals, and
              acceptance of some third-party exam-centre risk. None of that proves non-compliance; it does show where
              legal diligence should concentrate. The adverse reporting history adds a second layer, because lawsuits or
              reputation controversies can turn a contract or disclosure weakness into a broader trust problem. Another
              reason to take the legal surface seriously is that education contracts are often signed by stressed
              families making time-sensitive decisions. If billing, cancellation, or outcome expectations are not
              handled cleanly, a small dispute can escalate into both a legal issue and a word-of-mouth problem. That
              transmission is especially important for a premium brand.
            claimRefs:
