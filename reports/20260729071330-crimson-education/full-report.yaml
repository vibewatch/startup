            body: >-
              The customer base visible in public materials is not a generic education mass market. Crimson’s core
              buyers are households willing to spend heavily on outcomes: selective-university admissions, flexible
              accredited schooling, or high-performance exam preparation. The parents pay, the students use, and the
              value proposition is outcome leverage rather than cheap access. That is obvious in the consulting stories
              and reinforced by independent descriptions of CGA as a premium online-school option.


              Within that broad frame, three customer segments recur most clearly: internationally mobile families that
              need schedule portability, advanced learners who want acceleration or non-age-bound placement, and
              university-ambitious students seeking an edge in admissions or exam performance. The segment map matters
              because it suggests strong willingness to pay, but also a narrower and more affluent demand base than
              mainstream tutoring or public online-school products.
