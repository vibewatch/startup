  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Crimson is easier to like strategically than to price confidently. The company appears to have real scale,
              a credible unicorn funding event, and a more diversified education portfolio than most
              admissions-consulting businesses. Those are meaningful positives. But the same public record that proves
              scale also reveals how little the market truly knows about margin quality, retention, and the capital
              structure.


              That leads to a disciplined but not dismissive recommendation. Investors should treat Crimson as a track
              or research-more candidate rather than as an automatic buy at the latest private valuation. The company
              may deserve that mark in the best case, but public evidence alone does not yet justify paying up without a
              data room. Said differently, this is a business where company quality and investment quality may currently
              diverge: the asset can be impressive while the price still leaves too little room for uncertainty.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV018
              - CV019
              - CV027
