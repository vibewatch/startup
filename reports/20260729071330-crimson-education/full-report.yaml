              - CV019
              - CV029
              - CV035
              - CV038
      - number: '8.3'
        title: Bull, Base, and Bear Scenario Logic
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a wide but not unbounded scenario range. The bear case assumes Crimson should
              trade closer to broad education or pressured EdTech assets, especially if its service-heavy model carries
              lower margins or weaker retention than the market hopes. The base case assumes the current round is
              directionally fair but not obviously cheap. The bull case assumes strong underlying metrics and sustained
              premium positioning closer to best-in-class education brands.


              Importantly, the scenarios are not just multiple games. They are confidence games. Missing cap-table,
              retention, and segment-margin data mean that even a mathematically plausible base case should be
              discounted when thinking about actual investment execution. That is why entry discipline matters as much
              as scenario construction here. Investors should therefore read the scenarios as bands around confidence
              rather than as point estimates. When disclosure is weak, a valuation range is only as good as the hidden
              economics that could move the company toward the top or bottom of that band.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV023
              - CV024
