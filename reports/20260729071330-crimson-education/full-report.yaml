  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Crimson does not operate in one simple “edtech” market. The business sits at the overlap of premium
              admissions consulting, private tutoring, online private schooling, and formal-exam support for globally
              recognized curricula such as the IB and Cambridge pathways. For diligence purposes, the relevant market
              should therefore exclude the entire education sector and focus instead on privately paid, high-intent
              services that families purchase to improve selective-university outcomes or to replace part of the
              traditional school experience. That boundary includes admissions strategy, tutoring, test preparation,
              online private high-school tuition, and IB-oriented revision tools; it excludes mass public schooling
              budgets, enterprise learning software, and generalized K-12 classroom infrastructure.


              UNESCO’s “shadow education” framing is useful here because it captures the economic logic of Crimson’s
              core consulting product: spending that mirrors, supplements, or attempts to outperform mainstream
              schooling. The online-school and IB-prep adjacencies widen the market boundary but do not eliminate the
              same underlying customer motive, which is willingness to pay for educational advantage, flexibility, or
              globally portable credentials. This is why Crimson’s serviceable market is materially narrower than
              headline education-spend numbers yet broader than a pure college-counseling niche.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM017
              - CM019
