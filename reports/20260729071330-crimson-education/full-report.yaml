      - number: '2.2'
        title: Sizing the Tutoring, Consulting, and Online-School Opportunity
        blocks:
          - type: paragraph
            body: >-
              The broadest external TAM lens is private tutoring. Grand View Research estimates the global private
              tutoring market at USD 91.65 billion in 2022 and projects USD 154.8 billion by 2030, while UNESCO and IIEP
              supply the qualitative context that this is a worldwide and increasingly normalized category. The
              premium-admissions-consulting segment nested inside that broader tutoring universe is much smaller.
              Generic market-research vendors place college admissions consulting at roughly USD 2.8-3.1 billion in 2024
              and admissions-consulting platforms at roughly USD 3.28 billion. Those figures should be used cautiously
              because they come from lower-reputation market vendors rather than official statistical agencies, but they
              do suggest that Crimson is addressing a meaningful niche rather than a trivial cottage industry.


              The online-school adjacency is also significant. Market Research Future and Polaris both present private
              K-12 education as a multi-billion-dollar market with online or blended models growing inside it. Crimson’s
              actual serviceable segment is smaller again because CGA targets families willing to pay for
              internationally recognized curricula and synchronous online delivery, not the entire private-K-12
              universe. The important point for valuation is not one exact TAM number; it is that Crimson has assembled
              products spanning several paid education markets with different duration, ARPU, and retention
              characteristics.
