  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Accreditation, regulatory, or reputational shock
        - Any material event that undermines premium trust
        - Weakens pricing power and comp selection immediately
        - Pause or pass pending remediation
      - - Weak retention or negative unit economics in diligence
        - Cohorts or margins materially below premium-comp expectations
        - Collapses bull/base support
        - Reprice closer to bear-case range
      - - Heavy preference stack or unfavorable dilution
        - Cap-table overhang meaningfully subordinates new equity
        - Reduces actual return even if enterprise value holds
        - Pass or require much lower entry price
      - - No path to disclosure improvement
        - Management cannot provide audited statements and cohort data
        - Keeps valuation confidence permanently low
        - Maintain track / research-more only
    notes: These triggers are the key reasons a superficially attractive growth story can become uninvestable.
    claimRefs:
      - CV016
      - CV019
      - CV029
      - CV035
      - CV038
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financials
        - Revenue, gross margin, EBITDA, cash flow by segment
        - Needed to decide where in the comp range Crimson belongs
        - Finance diligence with audited statements
      - - Retention and cohorts
        - CGA, counseling, and Revision Village churn / renewal
        - Separates premium platform from narrative-rich services business
        - Growth diligence and CRM analysis
      - - Cap table and preferences
        - Liquidation stack, dilution, and rights
        - Determines true entry economics and downside recovery
        - Legal + finance diligence
      - - Cross-sell economics
        - Attach rates across counseling, school, and Revision Village
        - Tests portfolio-synergy claim
        - Revenue operations and data-room funnel extracts
      - - IPO / liquidity readiness
        - Governance, reporting, and listing prep status
        - Matters for exit pathway and public-market optionality
        - Board and CFO diligence
    notes: No recommendation upgrade is justified until at least the first three asks are answered.
    claimRefs:
      - CV022
      - CV026
      - CV028
      - CV035
      - CV037
