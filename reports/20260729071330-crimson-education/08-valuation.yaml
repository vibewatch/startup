- id: price-context
  title: Current Valuation Context and Entry Discipline
  body: 'The November 2024 round sets the current anchor: roughly NZ$67.6 million raised at around a $1 billion valuation with revenue reportedly above $100 million. That puts Crimson in a zone where it no longer looks like an early-stage narrative asset; it looks like a late-stage company that should already be compared against public-market discipline. The problem is that the public evidence only partially supports that transition.


    The IPO or liquidity path is also less mature than the narrative might suggest. Forge tracks the company, but ASX’s own process notes make clear that formal applications should appear on the upcoming-floats page, and Crimson did not. So the correct pricing posture is to analyze Crimson as a still-private company with limited disclosure, not as a soon-to-list issuer where the public process would force more transparency. That distinction is important because private investors still bear the burden of discovering problems that a listing process would normally flush out, from accounting detail to governance hygiene.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV015
  - CV016
  - CV017
