- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation status
  - Relevance
  - Limitation
  rows:
  - - Duolingo
    - Public premium consumer education platform
    - High market-cap / revenue proxy and premium sentiment
    - Shows ceiling for strong brand + retention + disclosure
    - Much stronger software and public-market profile
  - - Coursera
    - Scaled public online learning platform
    - Mid-range public multiple
    - Shows market value for broad digital education scale
    - Enterprise / consumer mix differs from Crimson
  - - Udemy
    - Scaled content marketplace
    - Moderate public multiple
    - Useful for content-led education monetization
    - Marketplace model differs materially
  - - Chegg
    - Mature education help platform
    - Depressed public multiple
    - Shows downside when market doubts durability
    - Different product and market cycle
  - - Nerdy
    - Live-learning marketplace
    - Low public multiple
    - Relevant for labor-heavy delivery risk
    - Marketplace economics differ
  - - 2U
    - Education-platform cautionary case
    - Distressed public equity value
    - Shows that scale and partnerships do not guarantee durable value
    - Balance-sheet and business mix differ
  - - Pearson
    - Mature incumbent education brand
    - Large public incumbent valuation
    - Provides adult benchmark for global education brand durability
    - Not a startup-style comp
  - - Education-sector M&A medians
    - Analyst market data
    - Low-to-mid single-digit revenue medians
    - Grounds downside discipline
    - Private, segment, and size mix vary
  notes: Comps are used as guardrails, not as direct one-for-one peers.
