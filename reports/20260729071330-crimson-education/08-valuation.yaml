  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - 4x-6x revenue, weaker retention, service-heavy margins, or preference overhang
    - ~US$0.4B-US$0.6B value; large markdown to last round
    - Demand-quality slippage, cap-table overhang, reputational damage
    - Possible if public gaps hide weak economics
  - - Base
    - 8x-10x revenue on US$100M+ scale with decent but unproven quality
    - ~US$0.8B-US$1.0B value; roughly around last round
    - Still depends on missing margin and churn data
    - Most defensible from public evidence
  - - Bull
    - 12x-15x revenue with strong retention, premium margins, and portfolio cross-sell
    - ~US$1.2B-US$1.5B value; upside above last round
    - Requires data-room evidence not public today
    - Only if internal metrics look closer to top-tier EdTech
  notes: All values are scenario estimates built from public press and multiple frameworks; they are not management guidance.
