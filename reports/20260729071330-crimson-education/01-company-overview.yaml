  title: The company has expanded beyond consulting into a multi-product education platform
  body: Crimson now spans premium admissions consulting, online schooling through CGA, and IB-prep resources through Revision Village. That breadth improves revenue diversification versus a pure admissions-consulting firm and helps explain investor appetite for late-stage funding.
