- calloutType: risk
  title: Disclosure is strong enough for brand-building but still thin for underwriting
  body: Core public metrics such as total capital raised, office count, employee count, and revenue mix vary by source and are not supported by audited consolidated financials. The company is clearly at scale, but it is not yet transparent enough for clean underwriting from public data alone.
