company:
  name: Crimson Education
chapter:
  number: 1
  title: Company Overview
  summary: 'Crimson Education is an Auckland-founded, founder-led premium admissions-consulting company that has expanded into online schooling and IB exam-prep products. Public reporting indicates the business crossed roughly NZ$1 billion in valuation in November 2024 after a NZ$67.6 million Series D led by Movac, with FY2024 revenue above US$100 million and meaningful scale in Crimson Global Academy. The key diligence caveat is disclosure quality: Crimson is clearly larger than a boutique consultancy, but it still offers private-company rather than audited transparency on core operating metrics.'
sections:
- id: identity-founding
  title: Identity, Founding Story, and Business Scope
  body: 'Crimson Education is a private Auckland-headquartered education company built around premium university-admissions consulting rather than mass-market tutoring. Public profiles consistently describe the business as multinational and focused on helping ambitious students target elite institutions in the United States and United Kingdom, especially the Ivy League and Oxbridge. The origin story is unusually founder-centric: Jamie Beaton publicly recounts being accepted to 25 top universities as a teenager, then turning that personal admissions playbook into a business with fellow co-founders Sharndre Kushor and Fangzhou Jiang. Wikipedia and later media coverage both say the three founders met through Model United Nations circles while still in high school, giving Crimson a founder-market-fit narrative rooted in the same elite-education aspiration it sells to customers.


    That founder narrative matters because Crimson’s brand promise is not generic tutoring efficiency; it is access to highly curated, high-touch strategy over several years. Independent reviews and fundraising coverage consistently frame the company as a premium, often expensive service designed for globally mobile or highly ambitious families. Public company-profile databases confirm the private-company status, Auckland base, and multinational footprint, but they also show how selective Crimson’s formal disclosure remains. Even basic public descriptors such as total raised, office count, and employee count vary by source and date, which is an important diligence signal in itself for later chapters.'
