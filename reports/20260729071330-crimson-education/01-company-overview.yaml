- calloutType: insight
  title: Crimson’s biggest asset and biggest criticism are the same thing
  body: The company’s founder-led, elite-outcomes brand has given it powerful market positioning with ambitious families and investors. That same positioning also attracts criticism about privilege, commercialization, and authenticity in selective admissions.
