- id: funding-scale
  title: Funding History, Scale Indicators, and Capital Structure Signals
  body: 'Crimson’s public funding story inflects sharply upward in late 2024. Startup Daily, B2B News, and EdTechReview all report that the company closed a roughly NZ$67.6 million Series D and crossed a NZ$1 billion valuation, earning unicorn status in Australasian edtech. Those stories agree on the core investor syndicate—Movac, HEAL Partners, Icehouse Ventures, U.S. News, HighSage Ventures, and Five Sigma—and on the board consequences, with Movac’s Mark Vivian and HEAL’s Martin Dalgleish joining after the round. Public company databases add a second signal: CB Insights now profiles Crimson at more than US$131 million total capital raised, indicating a much larger financing history than older profiles implied.


    The operating scale signals are equally notable but less cleanly disclosed. Multiple 2024 sources say Crimson exceeded US$100 million of annual revenue and maintained a footprint of roughly 22 offices across five continents. A company-authored 2022 milestone story goes further, claiming US$110 million revenue, approximately 600 employees, 95% of counseling revenue outside New Zealand, and CGA contributing around 20% of group revenue. Those claims are directionally useful because they explain why investors view Crimson as more than a niche consultancy, but they are still private-company statements rather than audited disclosures. Investors should therefore treat them as important but only partially verified operating indicators.'
