  summary: >-
    Crimson Education 由 Jamie Beaton、Sharndre Kushor 和 Fangzhou Jiang 于 2013
    年在新西兰创立，最初是一家高端大学申请咨询公司。此后，公司扩展成更宽的教育平台，旗下包括 Crimson Global Academy（CGA）——一所经认证的线上学校，服务来自 60+ 个国家的 1,700+ 名学生，以及规模化
    IB 备考产品 Revision Village。2024 年 11 月，公司以独角兽估值融资 NZ$67.6M，并披露过去 12 个月年收入超过 $100M，但公司仍为私营，披露选择性很强。
