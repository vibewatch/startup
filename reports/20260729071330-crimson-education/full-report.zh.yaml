      - number: '8.2'
        title: 当前估值语境与入场纪律
        blocks:
          - type: paragraph
            body: >-
              2024 年 11 月一轮融资给出当前锚点：融资约 NZ$67.6M，估值约 $1B，收入据称超过 $100M。融资后，Crimson
              不再像早期叙事资产，更像一家应当接受公开市场纪律检验的后期公司。问题在于，公开证据只能部分支撑从叙事资产到后期公司的跃迁。


              IPO 或流动性路径也没有叙事暗示的那么成熟。Forge 跟踪这家公司，但 ASX 自身流程说明显示，正式申请应出现在 upcoming-floats 页面，Crimson 没有出现。因此，正确的定价姿态，是把
              Crimson
              当作披露有限的未上市公司分析，而不是当成即将上市、公开流程会倒逼更多透明度的发行人。区分两类资产很重要，因为私募投资者仍要自己承担发现问题的负担；若进入上市流程，通常会从会计细节到治理规范性把问题筛出来。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV015
              - CV016
              - CV017
              - CV026
