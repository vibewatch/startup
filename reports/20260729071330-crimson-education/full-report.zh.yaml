  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资历史与估值里程碑
        blocks:
          - type: paragraph
            body: >-
              Crimson 可见的融资故事，最终落在 2024 年 11 月的 Series D；多家独立媒体把该轮金额放在约 NZ$67.6 million，估值约 NZ$1
              billion。对一家仍处在咨询公司、edtech 平台和学校运营方灰色地带的公司来说，投资人名单异常强：Movac 领投，HEAL Partners、Icehouse Ventures、U.S.
              News、HighSage Ventures 和 Five Sigma 也出现在融资报道中。HEAL 和 Icehouse 都保留了公开材料，进一步印证其积极参与。


              更早的估值标记显示，这是一段阶梯式上升，而不是一次跳跃。公开来源提到，2019 年估值约 NZ$410 million，2022 年约 US$550 million，随后在 2024
              年达到独角兽标记。总融资额的数据库统计不那么一致，CB Insights、Tracxn 和其他资料网站在精确总额上存在差异。最合理的尽调判断是，Crimson 总融资额已明显超过 US$100
              million；但只有完整 cap table 才能对齐初级融资、早期天使资本和任何二级交易活动的精确组合。
