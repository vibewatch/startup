            body: >-
              公开来源显示市场意识到潜在流动性路径，但没有具体时间表。Forge 把 Crimson 作为 pre-IPO
              公司跟踪，并为二级市场参与者提供融资历史背景，说明公司已有足够成熟度和投资人关注，值得这层监测。然而，ASX upcoming-floats 页面没有列出
              Crimson，本报告获取的材料中也没有正式公开时间表。因此，当前正确解读很简单：从叙事上看 Crimson 可能具备 IPO 能力，但它没有公开承诺上市日程。


              这个区别对财务尽调很重要。一家公司可以规模很大、具有新闻性，甚至在二级场所非正式交易，却仍未解决公开上市会迫使其摊开的披露、治理和盈利问题。对 Crimson 来说，存在 pre-IPO
              可见度是成熟度信号；但没有提交正式流程，意味着投资人仍应把它当作后期私营公司尽调，而不是即将上市的发行人。
