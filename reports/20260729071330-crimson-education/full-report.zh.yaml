      - number: '1.4'
        title: 治理、领导网络与声誉摩擦
        blocks:
          - type: paragraph
            body: >-
              Crimson 的领导层仍与 Jamie Beaton 的公众形象紧密绑定，但随着公司成熟，围绕他的治理网络也变厚了。Education Today 报道称，新西兰前总理 Sir John Key 于 2026
              年出任董事长，前 Uber 和 Google 产品高管 Sundeep Jain 加入董事会。Kevin Rudd
              在公开报道中更像是外围顾问和投资人圈层的一员，而不是运营管理层。这些任命很重要，因为它们显示公司在为更大的机构化未来做准备——可能包括 IPO
              准备、新学校扩张或更多收购——而不是永远停留在创始人主导的精品机构状态。


              与此同时，Crimson 的声誉一直存在争议。The Spinoff 记录了 Rhodes Scholars 的反弹，他们批评把精英学术履历导向服务富裕家庭的业务；一篇 2026 年 Medium
              文章则攻击该品牌在标准化考试和精英录取焦虑商业化中的角色。Wikipedia
              还汇总了此前关于诉讼、版权纠纷和客户合同条款批评的报道。单看这些问题，没有一个像是生死问题；但合在一起，它们形成持续的叙事风险：Crimson
              的高端定位也是它最持久批评的来源。这个张力应被视为公司概览的核心部分，而不是风险章节里的孤立脚注。
