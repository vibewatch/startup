  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Crimson
              处在拥挤但分层的竞争格局中。它最接近的直接竞争者不是普通补习品牌，而是高端大学申请咨询机构；这些机构在数月乃至数年里销售策略、顾问触达、文书支持和申请项目管理。基于自身定位以及多个排名和评价网站，Collegewise
              和 IvyWise 最符合这个直接对比桶。Kaplan、Princeton Review 和 Varsity Tutors
              也重要，但它们更多通过补习、标化备考或广义学习支持竞争，而不是通过同样强调声望的全旅程咨询模型竞争。


              实际结果是，Crimson 同时面对几层竞争：面向富裕家庭的定制化高端咨询机构；服务预算或需求更窄的规模化补习和备考品牌；以及不愿付费家庭会选择的自助或校内顾问替代方案。没有单一竞争者能完全复刻 Crimson
              的国际化定位，以及线上学校、IB 备考等相邻产品。这是一个有意义的差异化点，但也意味着相关同业集合需要主动构建，不能直接从某一张标准行业名单中拿来。
