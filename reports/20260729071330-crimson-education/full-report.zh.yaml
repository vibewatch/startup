              - CV038
      - number: '8.3'
        title: 牛、基准与熊情景逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据支持较宽、但并非无限的情景区间。熊情景假设 Crimson 的交易倍数应更接近广义教育资产或承压 EdTech
              资产，尤其是在服务重的模式带来低于市场预期的利润率或留存时。基准情景假设当前融资轮大方向公平，但并不明显便宜。牛情景则假设底层指标强劲，并且高端定位能持续，更接近一流教育品牌。


              重要的是，情景不只是倍数题，也是信心题。缺少股权结构表、留存和分部利润率数据，意味着即便数学上合理的基准情景，落实到真实投资执行时也应打折。因此，这里入场纪律和情景搭建一样重要。投资者应把情景理解为围绕信心展开的区间，而不是点估计。披露薄弱时，估值区间的质量取决于隐藏经济性；隐藏经济性可能把公司推向区间顶部，也可能推向底部。
            claimRefs:
              - CV005
