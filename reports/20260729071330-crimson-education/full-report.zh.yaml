      - number: '1.2'
        title: 从申请咨询延伸到学校与备考资源
        blocks:
          - type: paragraph
            body: >-
              Crimson 的业务已经越过申请咨询，扩展成一个更宽的产品组合，试图陪伴学生走过教育旅程的多个阶段。最清晰的扩张载体是 Crimson Global Academy，即集团 2019
              年推出的线上私立高中。CGA 把自己定位为实时授课、全球交付的线上学校，而不是静态自学课程目录；官方页面称，它提供 Cambridge IGCSEs、A Levels、Advanced Placement
              和美国高中文凭。融资报道补充了规模背景：约 1,700 名学生来自约 60 个国家，教师超过 200 名。这个规模让 CGA 具有战略意义，而不是边缘业务。


              Crimson 也通过自建或收购相邻产品，加深同一客户群的钱包份额。Revision Village 是最显眼的例子：这个 IB 备考平台称，全球 85% 的 IBDP 学生信任它，让 Crimson
              在高成就学术支持领域有了更强抓手。Series D 报道和公司周边来源称，Crimson 已拼出更大的并购式组合，除 Revision Village 和线上学校资产外，还包括
              NumberWorks’nWords 与 Collegewise。这个组合逻辑支撑了管理层的目标：成为长期教育伙伴，而不是一次性的申请顾问。
