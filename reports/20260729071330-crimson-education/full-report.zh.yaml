  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >-
              战略上，Crimson
              不难让人喜欢，但定价上很难有把握。公司似乎已有真实规模、可信的独角兽融资事件，也拥有比大多数升学咨询机构更分散的教育产品组合。这些都是有意义的正面因素。但同一套证明规模的公开记录，也暴露市场对利润率质量、留存和资本结构所知很少。


              因此，建议应保持纪律，但不必轻易否定。投资者应把 Crimson 视为跟踪或继续研究标的，而不是按最新私募估值自动买入。最佳情况下，公司也许配得上这个估值，但仅凭公开证据，还不足以支持在没有 data room
              的情况下溢价买入。换句话说，这家公司当前可能出现公司质量与投资质量分化：资产可以很出色，但价格仍可能给不确定性留出的空间太小。
            claimRefs:
              - CV001
