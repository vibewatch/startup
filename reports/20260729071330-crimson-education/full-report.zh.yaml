      - number: '8.4'
        title: 可比公司、披露缺口与尽调触发项
        blocks:
          - type: paragraph
            body: >-
              可比公司组的主要价值，是提供估值护栏。Duolingo 是上限，Coursera 和 Udemy 展示中间地带的规模化教育平台，Chegg、Nerdy 和 2U
              则说明，一旦市场怀疑质量或韧性，教育市场情绪能把估值压得多狠。Pearson 提供成熟龙头参考点，但不是直接可比公司。它们都不完全匹配 Crimson 的模式，但合在一起，比单看私募融资轮更能定价。


              另一个可比结论是治理和披露。上市同行提交年报，向投资者暴露的运营细节远多于 Crimson 目前提供的内容。在 Crimson
              用审计数据和客户经济性数据补上披露缺口之前，合适姿态是让建议保持有条件、让估值立场保持纪律。尽调触发项不是装饰，而是具体判断标准：Crimson
              究竟应按高端上市教育品牌定价，还是按市场对教育平台较悲观的结果定价。
