        title: 信任、认证与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任层是 Crimson 产品中公开文档最清晰的部分之一。CGA 突出 WASC、Pearson Edexcel、Cambridge、AP 和 NCAA
              认可；手册和条款定义行为、支持与评估预期；隐私通知给出数据处理基线。对一家全球线上学校来说，这是合理的控制系统，因为客户需要可携带文凭，也需要相信大学和考试体系会认真对待这套运营。


              缺失的信息同样重要。本报告获取的材料没有揭示公开可用的 uptime
              历史、独立安全认证集合或详细事故报告。换句话说，公司披露治理和政策控制，远比披露技术可靠性控制更清楚。这不能证明存在弱点，但意味着公开记录更支持对认证的信任，而不是对软件韧性的信任。对尽调来说，公开记录可用于检查教育合法性和面向家庭的治理，但仍不足以检查软件运营、事故响应和供应商安全纪律。
