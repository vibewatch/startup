      - - 基准
        - 在 US$100M+ 规模上按收入 8x-10x，质量尚可但未经证明
        - 估值约 US$0.8B-US$1.0B；大致接近上一轮
        - 仍取决于缺失的利润率和流失数据
        - 从公开证据看最站得住脚
      - - 牛市
        - 收入倍数 12x-15x，留存强、利润率具备高端溢价，组合交叉销售跑通
        - 估值约 US$1.2B-US$1.5B；较上一轮有上行空间
        - 需要目前未公开的数据室证据
        - 只有内部指标更接近顶级 EdTech 时才成立
    notes: 所有估值都是基于公开媒体报道和多套倍数框架搭建的情景估算；不是管理层指引。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV028
      - CV029
      - CV030
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值状态
      - 参考价值
      - 局限
    rows:
      - - Duolingo
        - 公开市场高端消费者教育平台
        - 高市值 / 收入代理指标和溢价情绪
        - 展示强品牌 + 留存 + 披露的估值上限
        - 软件属性和公开市场画像强得多
      - - Coursera
        - 规模化公开在线学习平台
        - 公开市场中档倍数
        - 展示广义数字教育规模的市场价值
        - 企业 / 消费者组合不同于 Crimson
      - - Udemy
        - 规模化内容市场
        - 公开市场倍数中等
        - 可参考内容驱动教育变现
        - 市场平台模式存在实质差异
      - - Chegg
        - 成熟教育辅导平台
        - 公开市场倍数低迷
        - 展示市场质疑持久性时的下行空间
        - 产品和市场周期不同
      - - Nerdy
        - 直播学习市场
        - 公开市场低倍数
        - 可参考人力密集交付风险
        - 市场平台经济性不同
      - - 2U
        - 教育平台警示案例
        - 公开股权价值承压
        - 说明规模和合作伙伴不保证持久价值
        - 资产负债表和业务组合不同
      - - Pearson
        - 成熟在位教育品牌
        - 大型公开在位者估值
        - 为全球教育品牌耐久性提供成熟基准
        - 不是创业公司式可比对象
      - - 教育行业 M&A 中位数
        - 分析师市场数据
        - 低至中个位数收入倍数中位数
        - 为下行情景提供纪律约束
        - 私有市场、细分赛道和规模组合各异
    notes: 可比对象只是护栏，不是逐一直接对标的同业。
    enumerationScope:
      coverage: partial
      basis: >-
        Captures the most valuation-relevant public and analyst comparables fetched for this run, not every education
        asset in the market.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV005
    title: 投资论点破裂和否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 认证、监管或声誉冲击
        - 任何削弱高端信任的重大事件
        - 立即削弱定价权和可比对象选择
        - 暂停或放弃，等待整改
      - - 尽调中发现留存偏弱或单位经济性为负
        - 用户同期群表现或利润率显著低于高端可比对象预期
        - 摧毁牛市 / 基准情景支撑
        - 重新定价，向熊市区间靠拢
      - - 优先权层级沉重或稀释条件不利
        - 股权结构包袱使新股权明显劣后
        - 即使企业价值不变，实际回报也会下降
        - 放弃或要求低得多的进入价格
      - - 披露改善没有路径
        - 管理层无法提供经审计报表和同期群数据
        - 估值置信度会长期偏低
        - 仅维持跟踪 / 继续研究
    notes: 这些触发项是一个表面有吸引力的增长故事可能变得无法投资的关键原因。
    claimRefs:
      - CV016
      - CV019
      - CV029
      - CV035
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计财务
        - 按分部拆分的收入、毛利率、EBITDA、现金流
        - 需要用它判断 Crimson 应落在可比区间的什么位置
        - 财务尽调，基于经审计报表
      - - 留存和同期群数据
        - CGA、升学咨询和 Revision Village 的流失 / 续约
        - 区分高端平台与故事丰满的服务型业务
        - 增长尽调和 CRM 分析
      - - 股权结构和优先权
        - 清算顺位、稀释和权利
        - 决定真实进入经济性和下行回收
        - 法律 + 财务尽调
      - - 交叉销售经济性
        - 升学咨询、学校和 Revision Village 之间的附加率
        - 验证组合协同主张
        - 收入运营和数据室漏斗摘录
      - - IPO / 流动性准备度
        - 治理、报告和上市准备状态
        - 关系到退出路径和公开市场可选性
        - 董事会与 CFO 尽调
    notes: 在至少前三项要求得到回答之前，不应上调建议。
    claimRefs:
      - CV022
      - CV026
      - CV028
      - CV035
      - CV037
