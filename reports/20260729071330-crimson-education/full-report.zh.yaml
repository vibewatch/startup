  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户任务
        blocks:
          - type: paragraph
            body: >-
              Crimson 不再是一家单产品申请咨询公司。可见的产品栈现在覆盖高触达咨询、作为完整线上学校的 CGA，以及作为规模化备考平台的 Revision
              Village。这一点重要，因为客户任务并不相同：家庭可以购买录取结果支持，可以用可携带文凭替代或补充本地学校，也可以为 IB 考试购买自助复习支持。公开来源一贯把这些界面描述为互补，而不是彼此分离的实验。


              产品组合设计也解释了为什么 Crimson 很难被放进简单同业集合。纯咨询机构不需要课程认证、学生手册或学校运营；纯线上学校通常不会自然拥有一个主导性的 IB
              复习品牌；纯软件订阅业务也不会如此依赖顾问、教师和面向家庭的政策。这个组合有战略吸引力，但也带来运营复杂性，后续尽调应更严格测试。
            claimRefs:
              - CE001
