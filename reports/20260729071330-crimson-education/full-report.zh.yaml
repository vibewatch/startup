      - number: '2.4'
        title: 增长驱动、采用约束与信心边界
        blocks:
          - type: paragraph
            body: >-
              Crimson 式产品的需求由三股长期力量支撑。第一，正如 NACAC
              记录的那样，大学录取仍然复杂且多因素，这提高了外部解读和策略的价值。第二，国际申请量仍在上升，扩大了需要专业指导的全球化家庭池。第三，线上学校和绑定课程的备考产品让公司能在主要申请年份前后继续变现同一客户，提升生命周期价值。


              约束同样重要。UNESCO
              把私人补习和私人教育框定为对不平等高度敏感的行业，会招来批评，也可能面临更严格监管；这对一家建立在高端定位上的公司很重要。咨询市场大部分价格透明度也偏弱，这会让获客更依赖销售和信任。最后，投资人最想得到的精确答案——Crimson
              的真实 SAM、高端咨询支出的收入和地理结构、付费 IB 备考平台的市场份额——当前公开数据都无法回答。这些不是小细节；它们正是市场章节只能建立方向和规模、却无法给出精度的主要原因。
