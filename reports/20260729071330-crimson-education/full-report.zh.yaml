        title: 谁付费，以及他们为什么购买
        blocks:
          - type: paragraph
            body: >-
              公开材料中可见的客户群，不是泛化教育大众市场。Crimson
              的核心买方，是愿意为结果重金投入的家庭：选择性大学录取、灵活的经认证学校教育，或高表现备考。父母付费，学生使用，价值主张是撬动结果，而不是低价获取。这一点在咨询案例中很明显，也被独立来源对 CGA
              作为高端线上学校选项的描述进一步印证。


              在这个大框架内，最清晰反复出现的有三类客户：需要时间表可携带性的国际流动家庭，想要加速或不受年龄绑定分班限制的进阶学习者，以及希望在申请或考试表现中取得优势的大学志向学生。这个分层图很重要，因为它暗示强支付意愿，但也意味着需求基础比主流补习或公共线上学校产品更窄、更富裕。
