            body: >-
              CGA 材料显示，这是一套高度管理的教育运营，而不是完全自动化的产品。学生会经历 Canvas 入学引导、迎新、学业建议、课程规划、直播课程、office
              hours、社团和支持职能。费用、出勤、退学和考试中心安排都有文档记录，看起来更像学校运营，而不是简单的补习 marketplace。


              Revision Village 位于工作流光谱的另一端。它围绕可复用内容库、专家撰写解析、模拟考试和 AI 辅助辅导构建，因此比学校产品更像软件，排课强度也更低。这两个界面合在一起，让 Crimson
              能同时服务同步和异步使用场景，但它们大概率会产生不同的利润率和支持负担。
