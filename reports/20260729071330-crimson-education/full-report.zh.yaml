      - number: '2.2'
        title: 补习、咨询与线上学校机会测算
        blocks:
          - type: paragraph
            body: >-
              最宽的外部 TAM 视角是私人补习。Grand View Research 估算，2022 年全球私人补习市场为 USD 91.65 billion，并预计到 2030 年达到 USD 154.8
              billion；UNESCO 和 IIEP 则提供定性背景，说明这是一个全球存在且日益常态化的品类。嵌在更大补习宇宙里的高端申请咨询细分市场要小得多。通用市场研究机构把 2024 年大学申请咨询市场放在约 USD
              2.8-3.1 billion，把申请咨询平台市场放在约 USD 3.28 billion。这些数字应谨慎使用，因为它们来自公信力较低的市场研究供应商，而不是官方统计机构；但它们确实显示，Crimson
              面向的是一个有意义的小众市场，而不是微不足道的家庭作坊行业。


              线上学校相邻机会同样重要。Market Research Future 和 Polaris 都把私立 K-12 教育描述为数十亿美元市场，线上或混合模式正在其中增长。Crimson 的实际可服务细分再次更小，因为
              CGA 面向的是愿意为国际认可课程和同步线上交付付费的家庭，而不是整个私立 K-12 宇宙。对估值更重要的不是某一个精确 TAM 数字，而是 Crimson
              已经拼出一组产品，覆盖多个付费教育市场；这些市场在持续时间、ARPU 和留存特征上各不相同。
