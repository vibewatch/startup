  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Crimson 并不处在一个简单的“edtech”市场里。它的业务位于高端申请咨询、私人补习、线上私立学校，以及 IB、Cambridge
              这类全球认可课程体系的正式考试支持之间。出于尽调目的，相关市场不应包含整个教育行业，而应聚焦家庭自费、高意图的服务：这些服务被购买来提升选择性大学录取结果，或替代部分传统学校体验。这个边界包括申请策略、补习、标化和考试准备、线上私立高中学费，以及面向
              IB 的复习工具；不包括大众公立教育预算、企业学习软件和泛化 K-12 课堂基础设施。


              UNESCO 的“影子教育”框架在这里有用，因为它抓住了 Crimson 核心咨询产品的经济逻辑：这类支出映射、补充，甚至试图超越主流学校教育。线上学校和 IB
              备考相邻业务扩大了市场边界，但没有改变底层客户动机，即愿意为教育优势、灵活性或全球可携带的文凭付费。因此，Crimson 的可服务市场明显窄于头部教育支出数字，却又宽于纯大学咨询小众市场。
