    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创始故事与业务边界
        blocks:
          - type: paragraph
            body: >-
              Crimson Education 是一家总部位于奥克兰的私营教育公司，核心不是大众补习，而是高端大学申请咨询。公开资料一贯把它描述为一家跨国公司，专注帮助有雄心的学生冲刺美国和英国顶尖院校，尤其是常春藤盟校和
              Oxbridge。公司起源故事高度围绕创始人：Jamie Beaton 公开讲述自己十几岁时被 25 所顶尖大学录取，随后把个人申请方法论与联合创始人 Sharndre Kushor、Fangzhou Jiang
              一起做成公司。Wikipedia 和后来的媒体报道都称，三位创始人在高中时通过模拟联合国圈子相识，这让 Crimson 的创始人—市场匹配叙事直接扎根于它卖给客户的精英教育愿景。


              这种创始人叙事很关键，因为 Crimson
              的品牌承诺不是普通补习效率，而是多年期、高度定制、高触达的策略服务。独立评价和融资报道一贯把公司描述为高端且往往价格不低的服务，面向全球流动家庭或高度进取的家庭。公开公司资料库确认了它的私营状态、奥克兰总部和跨国足迹，但也显示
              Crimson 的正式披露仍然很克制。即便是总融资额、办公室数量、员工数这类基础公开描述，也会因来源和日期而不同；这本身就是后续章节需要关注的尽调信号。
