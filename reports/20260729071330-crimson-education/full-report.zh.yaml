      - number: '7.4'
        title: 缓释、监控与终止标准
        blocks:
          - type: paragraph
            body: >-
              多数可见风险都能尽调。买方可以审阅合同、隐私工作流、客户投诉、事故日志、认证往来以及交叉销售或退课数据。这是好信号，说明未知项多半是文件缺口，而不是不可知问题。即便如此，趋势更重要：一家高端教育公司如果在监管关注、错配退课或服务不一致开始上升的同时仍维持高营销预期，恶化会很快。


              实际的终止标准很直接。若认证丢失、消费者法纠纷扩大、隐私失误出现，或高价下家庭付费意愿明显走弱，投资者应停止或重置论点。同样，如果管理层拿不出投诉解决、留存或服务质量数据，不透明本身就会进入风险评级。因此，高质量尽调既要收文件，也要拿运营证据：家长沟通样本、投诉解决时长、退款案例、考试中心问题日志、教师支持升级记录。这些运营痕迹能说明纸面政策是否真的在实践中保护品牌。
            claimRefs:
              - CR032
              - CR033
              - CR034
              - CR035
              - CR038
              - CR039
              - CR040
