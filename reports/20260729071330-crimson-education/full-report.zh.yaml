      - number: '1.3'
        title: 资金历史、规模指标与资本结构信号
        blocks:
          - type: paragraph
            body: >-
              Crimson 的公开融资叙事在 2024 年末明显上台阶。Startup Daily、B2B News 和 EdTechReview 均报道称，公司完成约 NZ$67.6 million 的 Series
              D，估值跨过 NZ$1 billion，成为澳大拉西亚教育科技独角兽。这些报道在核心投资方上说法一致：Movac、HEAL Partners、Icehouse Ventures、U.S.
              News、HighSage Ventures 和 Five Sigma；董事会变化也一致，Movac 的 Mark Vivian 和 HEAL 的 Martin Dalgleish
              在本轮后加入董事会。公开公司数据库给出第二个信号：CB Insights 现在把 Crimson 的总融资额列为超过 US$131 million，说明它的融资历史远大于早期资料暗示的规模。


              运营规模信号同样值得注意，但披露更不整齐。多家 2024 年来源称，Crimson 年收入超过 US$100 million，在五大洲有约 22 个办公室。一篇公司 2022
              年自撰里程碑文章说得更进一步，称收入为 US$110 million、员工约 600 人、咨询收入 95% 来自新西兰以外、CGA 贡献集团收入约 20%。这些说法方向上有价值，因为它们解释了投资人为何把
              Crimson 看作不止一家小众咨询公司；但它们仍是私营公司陈述，而非审计披露。因此，投资人应把它们视为重要但只得到部分验证的运营指标。
