      - number: '2.3'
        title: 买方、用户、付款方与地理分层
        blocks:
          - type: paragraph
            body: >-
              Crimson 的买方地图以家庭为中心。在核心咨询业务中，父母或监护人通常付费，学生是直接用户，大学录取结果是主导成功指标。在 CGA
              中，同一个家庭仍然付费，但购买决策更像私立学校学费，而不是一次性的补习支出。在 Revision Village 式 IB
              备考中，用户可以更自主；但三个产品的共同线索，都是高动机学习者和愿意为学术信号优势花钱的家庭。


              从地理上看，家庭同时具备全球流动性、英语或国际认可课程，以及顶尖大学名额激烈竞争的地方，可触达市场最强。Common App 国际申请增长强化了跨境需求上升的判断。IB 的 1.95 million 学生足迹和
              Cambridge 的 10,000 所学校网络解释了为什么绑定课程体系的产品可以跨越单一国家。对 Crimson
              最相关的可服务地理范围，因此不只是“新西兰”或“美国”，而是亚太、北美、欧洲和中东已经参与全球教育路径的富裕都市家庭。
