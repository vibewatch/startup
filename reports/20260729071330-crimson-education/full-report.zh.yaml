              公开采用证据在宽度上强于耐久性。记录支持一个数千到上万级客户基础、多种交付模式，以及全日制、非全日制和自助用户的混合。Good Schools Guide
              在这里尤其有用，因为它把直播小组课、一对一补习和异步学习描述为三种不同学习模型。这让 Crimson 的客户引擎看起来比单一学费产品更多元。


              公开记录没有展示的是耐久性数学。没有披露
              NRR、GRR、流失率、续费率或产品组合附加率。因此，分析师可以说这家公司有有意义的客户证明，但无法判断这些证明是否会随时间高效复利。留存故事因此仍是基于连续性、满意度和使用场景宽度的推断，而不是硬队列证据。这个缺失披露在这里比许多消费品类更重要，因为教育关系可以在案例中看起来很持久，却在考试结束、重新回到学校或大学录取等转换点悄悄流失。因此，data
              room 应按产品、家庭类型、地理市场和获客渠道拆解连续性。
