              7 月的年度收入为 US$110 million、咨询收入 95% 来自新西兰以外、无债务，且 CGA 贡献集团收入约 20%。这些是有意义的信号，因为它们说明 Crimson
              不是一家只有叙事、烧钱丰富的后期公司，也解释了投资人为什么愿意支持 2024 年的大额融资。


              局限在于，这些数字没有一个在公开领域经过审计。Prospeo 和 IncFact
              发布模型估算，但应把它们视为方向性信号，而不是一手证据。可能的收入引擎，是高端多年期咨询包、线上学校学费，以及备考或相邻学术产品的组合，并可能由 U.S. News
              关系这类媒体或转介合作补充。这个组合有吸引力，因为它分散了持续时间和 ARPU，但仅靠公开来源无法真正承销。
