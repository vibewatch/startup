  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开风险证据集中在消费者法、隐私和合同设计。Commerce Commission 材料显示，不公平条款、取消和订阅实践是新西兰积极执法的领域；Privacy Commissioner
              材料则列出了数据主体的重要权利。对 Crimson 来说，这些义务比简单内容网站更重要，因为 CGA 及相关界面会接触未成年人、父母、支付流和跨境记录。


              Crimson
              自己的文件让风险敞口变得具体。隐私通知描述了大量数据收集和第三方存储；条款要求预付费用、结构化退学流程，并接受部分第三方考试中心风险。这些都不能证明公司不合规；它们只是显示法律尽调应集中在哪里。负面报道历史增加了第二层风险，因为诉讼或声誉争议会把合同或披露弱点放大成更宽的信任问题。另一个必须认真看待法律表面的原因是，教育合同往往由处在压力中的家庭在时间敏感决策下签署。如果账单、取消或结果预期处理不干净，小纠纷可能升级成法律问题和口碑问题。这种传导对高端品牌尤其重要。
