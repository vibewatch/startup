- id: mitigation-kill
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'Most of the visible risks are diligenceable. A buyer can review contracts, privacy workflows, customer complaints, incident logs, accreditation correspondence, and cross-sell or withdrawal data. That is a good sign because it means the unknowns are mostly documentary rather than unknowable. Even so, the direction of travel matters: a premium education company can deteriorate quickly if regulator attention, poor-fit withdrawals, or service inconsistency begin to climb while marketing expectations stay high.


    The practical kill criteria are straightforward. Investors should stop or reset the thesis if accreditation is lost, consumer-law disputes broaden, privacy failures emerge, or household willingness to pay visibly weakens against premium pricing. Likewise, if management cannot produce data on complaint resolution, retention, or service quality, the opacity itself becomes part of the risk rating. A high-quality diligence process should therefore collect both documents and operating evidence: sample parent communications, complaint-resolution timings, refund cases, exam-centre problem logs, and teacher-support escalations. Those are the operational traces that show whether policies on paper are actually protecting the brand in practice.'
  claimRefs:
  - CR032
  - CR033
  - CR034
  - CR035
  - CR038
  - CR039
  - CR040
