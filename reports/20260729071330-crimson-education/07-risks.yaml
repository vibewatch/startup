- id: dependency-people
  title: Dependency, Partner, and People Risk
  body: 'Crimson’s product surface depends on accreditors, exam bodies, external centres, and a large people base. Those are not incidental supports; they are central to the value proposition. Families pay premium prices partly because the credentials are portable and the service feels hands-on. That means failures at external nodes—accreditation, exam access, or partner continuity—can damage value even if Crimson’s internal team performs well.


    The people side is similarly material. The jobs surface, the live-class model, and the advisory intensity all suggest a labor-heavy cost base where quality control and hiring discipline will affect both margins and reputation. Investors should treat this as an execution-risk system, not a static school website. In practical terms, investors should think of external dependencies and people dependencies as the same system. When staff are stretched, coordination with accreditors, regulators, and exam partners tends to weaken first, which can make a localized issue travel quickly across the platform.'
  claimRefs:
  - CR010
  - CR011
  - CR021
  - CR022
  - CR028
  - CR029
  - CR030
  - CR031
  - CR037
  tableRefs:
