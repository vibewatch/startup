- id: operational-quality
  title: Operational, Security, and Quality Risk
  body: 'Running a global live online school creates a larger operational surface than the brand might imply. The handbook covers attendance, integrity, conduct, and AI-tool use; independent reviewers stress that online fit is not universal; and the company’s own customer stories show how heavily the experience depends on teacher quality, community, and family support. That combination means service consistency matters as much as product design.


    The public weakness is that reliability evidence is thin. We did not find a public incident history, uptime track record, or security-certification package. A buyer can therefore verify educational governance better than technical resilience. That asymmetry is manageable for a small online-school operator, but it becomes more material as scale, international scope, and brand expectations rise. The company also serves minors and internationally dispersed households, which means even small operational failures can feel more severe than in a typical consumer app. A missed class, a weak advisor handoff, or a confusing exam-centre process can affect academic records and family trust simultaneously.'
  claimRefs:
  - CR004
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
