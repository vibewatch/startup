callouts:
- calloutType: insight
  title: Crimson is selling educational advantage across adjacent paid markets, not just tutoring
  body: 'The company’s real strategic market is the paid-education-advantage layer: admissions strategy, tutoring, online schooling, and exam-prep products for ambitious globally mobile families. That makes the opportunity broader than counseling alone but also harder to benchmark against any single peer set.'
  claimRefs:
