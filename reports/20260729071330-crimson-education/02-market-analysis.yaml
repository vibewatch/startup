- id: buyers-geography
  title: Buyer, User, Payer, and Geographic Segmentation
  body: 'Crimson’s buyer map is household-centric. In the core consulting business, parents or guardians usually pay while students are the direct users and university-placement outcomes are the dominant success metric. In CGA, the same household still pays, but the buying decision resembles private-school tuition rather than episodic tutoring spend. In Revision Village-style IB prep, the user can be more self-directed, but the common thread across all three products is a high-motivation learner and a household willing to spend in pursuit of academic signaling advantages.


    Geographically, the addressable market is strongest wherever families combine global mobility, English-language or internationally recognized curricula, and intense competition for top-university places. Common App’s growth in international applications reinforces the idea that cross-border demand is rising. The IB’s 1.95 million-student footprint and Cambridge’s 10,000-school network explain why curriculum-linked products can scale beyond any one country. The most relevant serviceable geographies for Crimson are therefore not simply “New Zealand” or “the US,” but affluent metropolitan families across Asia-Pacific, North America, Europe, and the Middle East that already engage with global education pathways.'
