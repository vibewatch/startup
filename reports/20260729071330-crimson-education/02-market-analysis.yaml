- calloutType: risk
  title: Market-size estimates are directionally useful but not precise enough for underwriting
  body: Private-tutoring TAM is large and well documented, but the premium admissions-consulting and online-school subsets rely heavily on lower-reputation market vendors or private-company claims. Investors should treat top-down TAM numbers as framing devices, not as underwriteable operating truth.
  claimRefs:
  - CM003
  - CM007
  - CM008
  - CM010
  - CM019
- calloutType: strength
  title: Structural demand drivers appear durable even after admissions-policy change
  body: Common App application growth, international student mobility, and the continued complexity of holistic admissions all support persistent demand for expert guidance. Those drivers are not dependent on one test regime or one geography.
