chapter:
  number: 2
  title: Market Analysis
  summary: Crimson operates inside a layered paid-education-advantage market spanning premium admissions consulting, private tutoring, online private schooling, and IB-linked exam prep. The best-corroborated public TAM is the global private tutoring market at roughly USD 91.65 billion in 2022 growing toward USD 154.8 billion by 2030, while the narrower admissions-consulting niche appears to be a USD 2.8-3.3 billion market based on lower-confidence vendor estimates. Demand drivers—application complexity, international mobility, and online-school flexibility—look durable, but precise SAM/SOM measurement still requires private company data.
sections:
- id: market-boundary
  title: Market Boundary and Included Spend
  body: 'Crimson does not operate in one simple “edtech” market. The business sits at the overlap of premium admissions consulting, private tutoring, online private schooling, and formal-exam support for globally recognized curricula such as the IB and Cambridge pathways. For diligence purposes, the relevant market should therefore exclude the entire education sector and focus instead on privately paid, high-intent services that families purchase to improve selective-university outcomes or to replace part of the traditional school experience. That boundary includes admissions strategy, tutoring, test preparation, online private high-school tuition, and IB-oriented revision tools; it excludes mass public schooling budgets, enterprise learning software, and generalized K-12 classroom infrastructure.


    UNESCO’s “shadow education” framing is useful here because it captures the economic logic of Crimson’s core consulting product: spending that mirrors, supplements, or attempts to outperform mainstream schooling. The online-school and IB-prep adjacencies widen the market boundary but do not eliminate the same underlying customer motive, which is willingness to pay for educational advantage, flexibility, or globally portable credentials. This is why Crimson’s serviceable market is materially narrower than headline education-spend numbers yet broader than a pure college-counseling niche.'
