- id: drivers-constraints
  title: Growth Drivers, Adoption Constraints, and Confidence Limits
  body: 'Demand for Crimson-style offerings is supported by three durable forces. First, university admissions remain complex and multi-factor, as NACAC documents, which increases the value of external interpretation and strategy. Second, international application volume is still rising, expanding the pool of globally oriented families that want specialist guidance. Third, online schooling and curriculum-linked prep products let companies monetize the same customer before and after the main application years, improving lifetime value.


    The constraints are equally important. UNESCO frames private tutoring and private education as inequality-sensitive sectors that attract criticism and may face tighter oversight, which matters for a company built on premium positioning. Pricing transparency is also weak across much of the consultant market, which can make customer acquisition more sales-led and trust-dependent. Finally, the most precise questions an investor would want answered—Crimson’s true SAM, the income and geography mix of premium counseling spend, and the market share of paid IB-prep platforms—are not answered by current public data. Those are not minor details; they are the main reasons a market chapter like this can establish direction and scale but not precision.'
