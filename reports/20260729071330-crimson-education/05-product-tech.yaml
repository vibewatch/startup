- id: dependencies-roadmap
  title: Dependencies, Engineering Signal, and Roadmap Direction
  body: 'Crimson’s product surfaces depend on a wide external network: accrediting bodies, exam organizations, external exam centres, and partner programs. Those dependencies are not incidental; they are part of the value proposition because recognized curricula and prestigious partners help justify premium pricing. But they also mean some failure modes sit outside Crimson’s control, especially around exam access, recognition, and partner continuity.


    The engineering picture is visible only in slices. The public GitHub organization and repository list prove there is a technical function, and the jobs page shows a substantial live operating footprint, but the company does not publicly map its software architecture or release discipline. That leaves investors with a mixed conclusion: there is enough surface to say Crimson is more than a services brand, yet not enough to underwrite software depth without direct management access. The roadmap evidence is therefore mostly indirect: more programs, more pathways, more repositories, and more hiring rather than a polished public release log. That is enough to show motion, but not enough to measure engineering velocity or defect discipline.'
  claimRefs:
  - CE019
