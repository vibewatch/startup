company:
  name: Crimson Education
chapter:
  number: 5
  title: Product & Technology
  summary: 'Crimson’s public product surface is broader than a typical admissions consultancy: it combines CGA as an accredited online-school operator, Revision Village as a scaled digital exam-prep asset, and a smaller set of partner-led enrichment programs. The visible trust layer is strong because curricula, terms, and accreditations are documented, and there is modest public developer signal through GitHub and hiring. The main missing pieces are the internal software architecture, technical reliability metrics, and quantified AI usage.'
sections:
- id: product-portfolio
  title: Product Portfolio and Customer Jobs
  body: 'Crimson is no longer a single-product admissions consultancy. The visible stack now spans high-touch counseling, CGA as a full online school, and Revision Village as a scaled exam-prep platform. That matters because the customer jobs are distinct: families can buy help winning admissions outcomes, replace or supplement a local school with portable credentials, or purchase self-serve revision support for IB exams. Public sources consistently present those surfaces as complementary rather than separate experiments.


    The portfolio design also explains why Crimson sits awkwardly in simple peer sets. A pure counseling firm would not need curriculum approvals, student handbooks, or school operations; a pure online school would not naturally own a dominant IB revision brand; and a pure software subscription business would not rely so heavily on advisors, teachers, and family-facing policies. The combination is strategically attractive, but it also creates operational complexity that later diligence should test more rigorously.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE014
  - CE018
  - CE023
  - CE032
  - CE035
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: delivery-workflow
  title: Delivery Workflow and Operating Model
  body: 'The CGA materials show an education operation that is heavily managed rather than fully automated. Students move through induction on Canvas, orientation, advising, course planning, live classes, office hours, clubs, and support functions. Fees, attendance, withdrawal, and exam-centre arrangements are documented in ways that look more like school operations than like a simple tutoring marketplace.


    Revision Village sits at the opposite end of the workflow spectrum. It is built around reusable content libraries, expert-authored explanations, mock exams, and AI-assisted coaching, which makes it more software-like and less scheduling-intensive than the school product. Together, those two surfaces let Crimson serve both synchronous and asynchronous use cases, but they likely produce different margin profiles and support burdens.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE017
  - CE022
  - CE027
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: trust-controls
  title: Trust, Accreditation, and Quality Controls
  body: 'The trust layer is one of the clearest publicly documented parts of Crimson’s product. CGA foregrounds WASC, Pearson Edexcel, Cambridge, AP, and NCAA recognition; the handbook and terms define behavior, support, and assessment expectations; and the privacy notice sets a baseline for data handling. This is a sensible control system for a global online school whose customers need portable credentials and confidence that the operation will be taken seriously by universities and exam systems.


    What is missing is equally important. The fetched materials did not reveal a public uptime history, independent security certification set, or detailed incident reporting. In other words, the company exposes governance and policy controls much more clearly than technical reliability controls. That does not prove a weakness, but it does mean the public record supports trust in accreditation more than trust in software resilience. For diligence, that means the public record is useful for checking educational legitimacy and family-facing governance, but still weak for checking software operations, incident response, and vendor-security discipline.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE028
  - CE030
  - CE031
  - CE034
