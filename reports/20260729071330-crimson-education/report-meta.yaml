companyProfile:
  summary: Crimson Education was founded in 2013 in New Zealand by Jamie Beaton, Sharndre Kushor, and Fangzhou Jiang as a premium university-admissions advisory business. It has since expanded into a broader education platform that includes Crimson Global Academy (CGA), an accredited online school serving 1,700+ students from 60+ countries, and Revision Village, a scaled IB exam-prep product. In November 2024 the company raised NZ$67.6M at a unicorn valuation and reported trailing annual revenue above $100M, but it remains privately held and selectively disclosed.
  foundedDate: '2013-01-01'
  founders:
  - name: Jamie Beaton
    role: Co-founder and CEO
    background: New Zealand-born entrepreneur and repeat top-university admit whose personal admissions story became an early part of Crimson's brand and go-to-market narrative.
    claimRefs: []
  - name: Sharndre Kushor
    role: Co-founder
    background: Co-founded Crimson with Beaton and helped scale the business from a local advisory service into a global premium-education platform.
    claimRefs: []
  - name: Fangzhou Jiang
    role: Co-founder
    background: Early co-founder involved in the company's formative product and business build-out.
    claimRefs: []
  foundingLocation: Auckland, New Zealand
  headquarters: Auckland, New Zealand
  productSummary: The portfolio now includes premium college-admissions consulting, mentoring, and tutoring; CGA's full-time and part-time accredited online-school pathways across AP, US Diploma, IGCSE, and A Levels; and Revision Village's subscription exam-prep platform for IB students and teachers. The company also markets adjacent enrichment and partner-led programs.
  customerFocus: High-aspiration households seeking elite admissions outcomes, flexible accredited online schooling, and exam-prep advantages, with particular relevance for internationally mobile families, accelerated learners, and students targeting top universities.
  businessModel: Premium counseling fees, recurring school tuition, and subscription-style digital study revenue from Revision Village. The portfolio also appears to support cross-sell across different stages of the family education journey, though public attach-rate evidence is absent.
  stage: Late-stage private unicorn
  fundingStatus: Latest disclosed financing was the November 2024 Series D of roughly NZ$67.6M at a unicorn valuation. Public databases and round coverage indicate total capital well above early-stage levels, but the precise lifetime amount and current preference stack are not reconciled in public sources.
