- id: durability
  title: Durability, Delivery Modes, and Repeatability
  body: 'Public adoption evidence is better on breadth than on durability. The record supports a customer base in the high thousands, several delivery modes, and a mixture of full-time, part-time, and self-serve users. Good Schools Guide is especially useful here because it describes live group lessons, one-to-one tutoring, and asynchronous study as three distinct learning models. That makes Crimson’s customer engine look more diversified than a single tuition product.


    What the public record does not show is the durability math. There is no disclosed NRR, GRR, churn, renewal rate, or attach rate across the portfolio. As a result, analysts can say the business has meaningful customer proof, but not whether that proof compounds efficiently over time. The retention story therefore remains an inference based on continuity, satisfaction, and breadth of use cases rather than on hard cohort evidence. That missing disclosure matters more here than in many consumer categories because education relationships can look durable in anecdotes while quietly churning at transition points such as exam completion, school re-entry, or university admission. A data room should therefore break continuity by product, family type, geography, and acquisition channel.'
  claimRefs:
  - CU023
  - CU024
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
