- id: proof
  title: Named Customer Proof and Adoption Signals
  body: 'The named customer proof is strongest in story form. CGA’s own student-stories pages and blogs provide concrete examples of students balancing global travel, creative projects, community life, acceleration, and elite-university aspirations. The Lara case study serves the same function for Crimson’s counseling business, even though it is overtly promotional. These stories do not prove retention or average outcomes, but they do prove that the company has a substantial library of referenceable families and students across different geographies and use cases.


    Independent reviewers make that proof more credible. Good Schools Guide and Spears supply outside perspectives on student numbers, fees, curriculum breadth, customer fit, and outcomes. Those sources matter because they go beyond admissions marketing and help confirm that CGA is selling a real school product to a real international base rather than only a narrative of elite aspiration.'
