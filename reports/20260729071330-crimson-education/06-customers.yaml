  - FU004
- id: concentration
  title: Expansion and Concentration Risk
  body: 'The strongest concentration risk is not a single enterprise customer; it is a specific household archetype. Crimson’s pricing signals, luxury-positioning cues, and adverse commentary all imply reliance on families with unusually high willingness or ability to pay for education outcomes. That is powerful in good times, but it can produce cyclicality, reputation sensitivity, and fairness criticism.


    Expansion across the portfolio is strategically plausible because Crimson can sell consulting, accredited schooling, and revision tools to adjacent stages of the same family journey. But public evidence does not yet quantify that land-and-expand loop. Until management discloses cross-sell and segment economics, the customer chapter supports a thesis of genuine adoption with incomplete visibility into durability and concentration. There is also a messaging concentration risk: if most visible proof is built from exceptional success stories, the customer narrative can drift toward best-case marketing rather than representative outcomes. Investors should compare the headline stories with full placement, completion, and withdrawal distributions.'
