  topStrengths:
    - Crimson 已从精品咨询公司跨过门槛，成为规模化全球教育平台，据报道收入超过 $100M，并完成独角兽融资事件。
    - CGA 和 Revision Village 让公司不再只靠一次性升学咨询，扩展到周期性学费收入和类软件化考前备考需求。
    - 公开证据支持其拥有可观国际覆盖、高端品牌定位和多个不同客户入口。
    - Revision Village 增加了一条数字收入流，质量可能高于单纯人力密集型咨询业务。
    - 最新一轮纳入了可识别的投资人，也释放出成熟资本仍看好平台战略上行空间的信号。
  topRisks:
    - 经审计财务、分部利润率、流失率和队列留存未公开，限制了估值信心。
    - 如果结果或服务质量不及预期，高端定价和品类争议会让 Crimson 暴露在声誉与可负担性风险下。
    - 学校产品对认证机构、外部考试生态和人力密集型教师 / 顾问队伍有实质依赖。
    - 最新 $1B 估值容错空间有限，除非内部指标明显强于公开证据所显示的水平。
    - 股权结构表和清算优先权条款未披露，真实股权经济性可能与企业价值叙事相差很大。
  unresolvedGaps:
    - FY2023-FY2025 经审计财务报表，以及按分部拆分的收入、毛利率、EBITDA 和现金流。
    - 咨询、CGA 和 Revision Village 的队列留存、流失、附加率和 CAC 数据。
    - 完整股权结构表、清算优先权、稀释条款和任何二级市场转让限制。
    - 学校单位经济性的证据，包括教师利用率、学生留存和考试中心完成结果。
    - 能显示近期公开上市路径是否现实的治理与 IPO 准备材料。
