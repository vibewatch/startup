- calloutType: risk
  title: The biggest financial diligence questions remain private
  body: Audited margins, segment revenue, CAC, churn, and the exact cap table are not in the public domain. Those are the metrics that determine whether a billion-dollar mark is justified, so this chapter necessarily stops short of a full underwriting view.
