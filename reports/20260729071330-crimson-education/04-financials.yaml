chapter:
  number: 4
  title: Financials and Capitalization
  summary: Public evidence indicates that Crimson closed a roughly NZ$67.6 million Series D in late 2024 at a unicorn valuation and that trailing annual revenue had crossed US$100 million. The business appears to have multiple revenue streams and strong investor support, but exact lifetime funding, segment mix, and earnings quality remain private. This is enough to establish late-stage scale and financing maturity, but not enough to underwrite margins, cash flow, or downside economics without management materials.
sections:
- id: round-history
  title: Funding History and Valuation Milestones
  body: 'Crimson’s visible financing story culminates in the November 2024 Series D that multiple independent outlets place at roughly NZ$67.6 million and about a NZ$1 billion valuation. The investor roster is unusually strong for a company that still sits in the grey zone between consultancy, edtech platform, and school operator: Movac led, while HEAL Partners, Icehouse Ventures, U.S. News, HighSage Ventures, and Five Sigma also appeared in round coverage. HEAL and Icehouse both maintain public materials that reinforce their active involvement.


    Earlier valuation markers show a staircase rather than a single leap. Public sources cite a valuation around NZ$410 million in 2019, then about US$550 million in 2022, before the 2024 unicorn mark. Database tallies of total capital raised are less consistent, with CB Insights, Tracxn, and other profile sites differing on exact totals. The most reasonable diligence view is that Crimson has raised well north of US$100 million, but that only a full cap table will reconcile the exact mix of primary financings, earlier angel capital, and any secondary activity.'
