- id: revenue-model
  title: Revenue Scale, Mix, and Publicly Visible Monetization
  body: 'On revenue, the public record is directionally strong but still not clean. Startup Daily and B2B News both reported that FY2024 annual revenue exceeded US$100 million. A 2022 company-authored milestone article went further, claiming US$110 million revenue for the year to July, 95% of counseling revenue from outside New Zealand, no debt, and CGA contributing about 20% of group revenue. Those are meaningful signals because they suggest Crimson is not simply a narrative-rich, cash-burning late-stage company. They also help explain why investors were willing to support a large 2024 round.


    The limitation is that none of those figures are audited in the public domain. Prospeo and IncFact publish modeled estimates, but those should be treated as directional rather than primary evidence. The likely revenue engine is a mix of premium multi-year consulting packages, online-school tuition, and exam-prep or adjacent academic products, potentially supplemented by media or referral partnerships such as the U.S. News relationship. That mix could be attractive because it diversifies duration and ARPU, but it cannot be properly underwritten from public sources alone.'
  claimRefs:
