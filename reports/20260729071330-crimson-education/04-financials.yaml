- calloutType: insight
  title: Crimson is no longer analyzable as “just a consultancy”
  body: Online schooling, product adjacencies, and institutional partnerships mean the company’s financial model likely mixes services, tuition, and software-like revenue. That complexity can improve resilience, but it also makes public comps and margin assumptions more difficult.
