- id: liquidity-path
  title: IPO and Liquidity Signals
  body: 'Public sources show awareness of a potential liquidity path but not a concrete timetable. Forge tracks Crimson as a pre-IPO company and provides financing-history context for secondary-market participants, suggesting enough maturity and investor curiosity to support that monitoring layer. Yet the official ASX upcoming-floats page does not list Crimson, and no formal public timetable appears in the materials fetched for this report. That makes the correct current interpretation simple: Crimson may be IPO-capable in narrative terms, but it is not publicly committed to a listing calendar.


    This distinction matters for financial diligence. A company can be large, headline-worthy, and even trade informally on secondary venues without having resolved the disclosure, governance, and profitability questions a public listing would force into the open. For Crimson, the existence of pre-IPO visibility is a maturity signal, but the absence of a filed process means investors still need to diligence the business as a late-stage private company rather than an imminent public issuer.'
