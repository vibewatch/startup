  - type: private-evidence-only
    severity: blocking
    topic: cap table
    missingEvidence: Current cap table, ownership %, preferences, and any secondary transactions.
    whyItMatters: Valuation, dilution, and downside protection cannot be judged from public sources without the actual financing stack.
    diligencePath: Request cap table and signed financing documents.
