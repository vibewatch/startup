    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: audited financials
    missingEvidence: Audited income statement, balance sheet, and cash flow by segment.
    whyItMatters: Reported revenue scale is encouraging, but underwriting requires verified margins, cash conversion, and segment economics.
    diligencePath: Request audited FY2023-FY2025 statements and management segment bridge.
    relatedQuestionRefs:
    - QI022
    - QI024
    - QI025
    relatedTableRefs:
