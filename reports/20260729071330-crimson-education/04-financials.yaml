- calloutType: strength
  title: Public evidence is consistent on scale even if not on precision
  body: Independent coverage, investor pages, and company-adjacent sources all point to a business that has crossed US$100 million revenue and raised a substantial late-stage round. That matters more than whether every database agrees on the exact lifetime funding total.
