evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board composition
    missingEvidence: Current board roster, committee structure, and governance documents for Crimson Education Group.
    whyItMatters: >-
      Public reporting names the chair and selected directors but not the full board or committee architecture, limiting
      governance assessment.
    diligencePath: Request corporate governance pack, board list, committee charters, and shareholder-rights summary.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: financial disclosure
    missingEvidence: Audited consolidated revenue, margin, cash flow, and business-line mix for counseling, CGA, and acquired products.
    whyItMatters: >-
      Public scale indicators suggest meaningful size, but underwriting cannot rely on unaudited company-claimed or
      media-reported numbers alone.
    diligencePath: Obtain audited financial statements and segment reporting for FY2023-FY2025.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: global footprint
    missingEvidence: An official current office, market, and employee count from the company.
    whyItMatters: Public sources disagree on offices, markets, and headcount, making operating-scale comparisons less precise.
    diligencePath: Request current org chart, headcount by geography, and official office directory.
    relatedQuestionRefs:
      - QO010
      - QO011
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: geographic revenue mix
    missingEvidence: Updated 2025-2026 country-level revenue concentration data.
    whyItMatters: >-
      The only clear public statements about 95% offshore counseling revenue and <10% per market appear to come from a
      2022 company-authored article.
    diligencePath: Request latest revenue-by-country bridge and the definition of “market” used internally.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: milestone coverage
    missingEvidence: Exact dates and transaction terms for every acquisition and school expansion milestone in TO004.
    whyItMatters: >-
      The overview chapter can outline Crimson's roll-up strategy, but public materials do not provide a complete
      acquisition-by-acquisition ledger with terms and exact close dates.
    diligencePath: >-
      Request M&A list with close dates, purchase prices, earn-outs, and whether assets sit at parent or subsidiary
      level.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam and som
    missingEvidence: >-
      A management-built TAM/SAM/SOM model that isolates premium globally oriented households likely to buy Crimson
      products.
    whyItMatters: Public top-down market reports do not isolate the exact segment that underpins Crimson’s real addressable market.
    diligencePath: Request the company’s segmentation model with conversion assumptions by geography and product.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer spend segmentation
    missingEvidence: Public spend data by geography, income band, and school stage for premium admissions counseling.
    whyItMatters: Without spend segmentation, market concentration and resilience by customer cohort remain hard to assess.
    diligencePath: Request internal pricing, package mix, and geography-by-revenue disclosure.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: ib prep market share
    missingEvidence: A credible public source showing the paid-versus-free share split in IB-prep resources.
    whyItMatters: The IB learner base is visible, but the monetizable share for paid prep platforms is not.
    diligencePath: Request product-category market-share research or platform-level user benchmarks.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive win loss
    missingEvidence: A true win/loss view by lead source, region, and competitor.
    whyItMatters: Public positioning shows likely peers but not which competitors Crimson actually beats in live deals.
    diligencePath: Request CRM-level lead attribution and closed-lost reasons.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: cross-sell overlap
    missingEvidence: Lead-flow overlap between counseling, CGA, and Revision Village.
    whyItMatters: Without overlap data, it is hard to quantify the advantage of Crimson’s broader product surface.
    diligencePath: Request funnel and cohort data by product entry point.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: retention benchmark
    missingEvidence: Retention and renewal metrics across the direct premium-consulting peer set.
    whyItMatters: >-
      Moat durability depends on more than branding; retention would show whether customers really stay through
      multi-year journeys.
    diligencePath: Request cohort retention data and compare against management’s stated peer set.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: cap table
    missingEvidence: Current cap table, ownership %, preferences, and any secondary transactions.
