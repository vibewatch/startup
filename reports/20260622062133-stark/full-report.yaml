  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Context and Financing Round History
        blocks:
          - type: paragraph
            body: >-
              STARK's valuation trajectory is documented almost entirely through third-party media rather than official
              company statements. The company's last publicly verifiable valuation anchor is the approximately $500
              million post-money mark set by Sequoia Capital's $62 million round in August 2025, as reported by DroneXL.
              Between August 2025 and February 2026 — a period of approximately six months — third-party media sources
              Deutsche Startups and TechFundingNews both reported that Founders Fund (Peter Thiel) invested a
              "double-digit million EUR" amount, lifting the valuation to approximately $1.2 billion (€1.1 billion) and
              confirming STARK's status as a unicorn. No official STARK press release, regulatory filing, or investor
              statement has confirmed either the Founders Fund investment amount or the post-money valuation.

              The $1.2B reported mark represents a 140 percent uplift over the $500M Sequoia mark in approximately six
              months. This step-up coincided with the Bundeswehr framework contract announcement (14 February 2026) and
              the unnamed NATO member contract (4 February 2026), which provides a plausible catalyst narrative.
              However, the Bundeswehr framework is explicitly conditional on successful BAAINBw product qualification,
              and no call-off orders have been publicly confirmed. The absence of recognised revenue means the $1.2B
              mark is a pure forward option on contract execution, not a reflection of current financial performance.

              STARK's total disclosed investor base — Sequoia Capital, Project A, NATO Innovation Fund, In-Q-Tel, 8VC,
              and Founders Fund — represents a remarkably high-quality and government-proximate cap table for a defence
              hardware startup less than two years old. The NATO Innovation Fund is a €1 billion fund backed by 24 NATO
              allies specifically designed to invest in deep technology addressing defence and security challenges; its
              participation provides genuine sovereign endorsement beyond commercial VC signalling. In-Q-Tel is the
              CIA's strategic venture arm; its presence signals US government intelligence-community interest in STARK's
              technology, which is operationally significant for interoperability-dependent NATO procurement. These
              strategic backing signals are a genuine valuation-positive that peers without government endorsement
              cannot replicate. STARK's German commercial register (SKD SE, Amtsgericht Charlottenburg, HRB 260878 B)
              shows no publicly filed annual accounts, consistent with a 2024-incorporated company that has not yet
              completed its first full financial year requiring mandatory public disclosure. Investors considering entry
              at the reported $1.2B price must therefore rely entirely on contract forward optionality and strategic
              analogy, without any publicly verifiable financial data.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
