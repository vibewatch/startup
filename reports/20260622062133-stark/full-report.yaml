      - number: '2.2'
        title: Buyer Segments, Payer Workflow, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Defence procurement splits the buyer, user, and payer roles in ways that differ from commercial markets.
              In STARK's primary segment, the payer is a national ministry of defence or allied procurement agency, the
              user is a brigade or naval unit in the field, and the buyer decision is a formal acquisition process
              involving capability requirement offices, procurement bureaux, budget committee approval, and
              qualification testing. In Germany the Bundestag's Budget Committee must approve large-scale arms
              purchases, and the Bundeswehr Procurement Office manages the technical qualification and
              framework-contract mechanics. The February 2026 approval of the Virtus framework agreement - after
              extensive joint testing - illustrates how Germany's buy-test-iterate approach can compress timelines when
              political urgency aligns with capability gaps. Beyond Germany, NATO member states across the Baltic,
              Nordic, and Eastern European flanks represent an emergent procurement cluster seeking deployable loitering
              munitions fast. Estonia's EUR 400 million seven-year framework and STARK's unnamed second NATO member
              state contract announced in February 2026 indicate the buyer map is already expanding. Maritime buyers
              show the same split: NATO maritime command and allied navies are the payer and acquisition authority,
              while surface action groups and patrol units are the operators. STARK's Vanta series is positioned for
              NATO's maritime domain coverage, where approximately five million square kilometres of European waters
              strain existing naval capacity.
