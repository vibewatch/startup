      - number: '3.3'
        title: US-Anchored Rivals — Anduril, Shield AI, AeroVironment, Auterion
        blocks:
          - type: paragraph
            body: >-
              Anduril Industries (Costa Mesa, CA; founded 2017) generated US$2 billion in revenue in 2025 with
              approximately 7,000 employees. Its Lattice OS C2 platform most directly competes with STARK's Minerva —
              Lattice aggregates sensor data from heterogeneous platforms, enables autonomous kill-chain orchestration,
              and is embedded across US DoD programmes including border surveillance, air dominance, and
              submarine-launched drone systems. Anduril's Roadrunner (autonomous jet-powered air vehicle) and Barracuda
              (stealth strike drone) partially overlap with Virtus's strike role, though public combat-deployment data
              for Barracuda is limited. Anduril is primarily US-DoD focused with limited confirmed European procurement
              relationships as of mid-2026, preserving STARK's sovereignty window. Shield AI (San Diego, CA; founded
              2015) raised US$1.5 billion at a US$12.7 billion post-money valuation in a Series G in March 2026,
              employing approximately 1,000 people. Its Hivemind AI pilot autonomy stack powers drones and manned
              aircraft in GPS- and communication-degraded environments; Nova was the first AI-powered drone deployed in
              US combat history. Shield AI's European penetration is currently minimal. AeroVironment (Arlington, VA;
              NASDAQ: AVAV; revenue US$820.6 million FY2025, 3,750 employees) is the world's most battle-proven
              loitering munition supplier via Switchblade 300 and 600, deployed across 15-plus years in Afghanistan,
              Iraq, and Ukraine with over 50,000 total deployments in 55-plus countries. Ukraine EW degradation of
              Switchblade 300 effectiveness and subsequent software-based jamming-resistance upgrades are the most
              comparable adverse reliability cycle to STARK's October 2025 trial controversy. AeroVironment completed
              the US$4.1 billion BlueHalo acquisition in May 2025, adding directed energy, space communications, and
              counter-UAS. Auterion (Switzerland/US) was nominated by the US government as the standard for its future
              drone programme; its AuterionOS open platform and Long Range One Way Attack capability (up to 1,000 miles
              range) compete with STARK's software and strike layers; critically, Rheinmetall chose Auterion as drone
              autonomy partner after the Helsing relationship collapsed in 2024.
