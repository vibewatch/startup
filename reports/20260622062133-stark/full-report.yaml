      - number: '2.3'
        title: Evidence-Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              A single canonical TAM does not exist for STARK's combined product scope, so this section uses multiple
              overlapping lenses. The first lens is the standalone global loitering munition market, estimated by Mordor
              Intelligence at $635.88 million in 2025, growing to $1,066.43 million by 2030 at a 10.89% CAGR. Europe's
              share is anchored by large national rearmament programs: Germany earmarked EUR 1.2 billion for immediate
              off-the-shelf loitering munition purchases from its EUR 100 billion Zeitenwende fund, France committed EUR
              2 billion for 1,800 systems under Colibri and Larinae programs, and Estonia committed EUR 400 million over
              seven years. The second lens is the unmanned surface vehicle market, which Mordor estimates at $1.13
              billion in 2025, expanding to $2.18 billion by 2030 at a 13.98% CAGR; defence applications commanded
              52.21% of that market in 2024. Together these two hardware lenses imply a combined global TAM for STARK's
              hardware classes of roughly $1.77 billion in 2025, growing toward approximately $3.25 billion by 2030.
              STARK's Minerva software layer does not fit neatly into either lens and creates a sizing gap. The macro
              context is a third lens: global military expenditure reached $2,718 billion in 2024 - the steepest annual
              rise since 1988 at 9.4% - with SIPRI noting spending growth for ten consecutive years. Germany's budget
              trajectory aims for 2.8-3.5% of GDP on defence by end of decade and the Bundestag approved a EUR 52
              billion military expenditure package in December 2025. The European NATO SAM floor is at least EUR 3.6
              billion from three disclosed national commitments, though this covers only three of 32 NATO members.
              Contradictory estimates are preserved: analyst reports provide narrow product-line sizing that understates
              the full autonomy software opportunity, while broad defence-spending totals overstate the actual
              penetrable budget.
