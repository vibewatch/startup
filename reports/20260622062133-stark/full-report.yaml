      - number: '4.3'
        title: Cost structure, capital intensity, and manufacturing economics
        blocks:
          - type: paragraph
            body: >-
              STARK's cost structure is dominated by three areas that are each capital-intensive by nature: research and
              development, warhead and component inventory, and multi-site production and staffing. The company
              discloses that more than 45 percent of its total expenditure goes to R&D, which is substantially above the
              European Defence Agency collective benchmark of 2 percent of total defence spending for collaborative R&T
              and signals a deliberate investment-phase posture rather than a margin-optimisation posture. Against that
              R&D intensity, gross margins at early production volumes for defence hardware typically range from 20 to
              45 percent for comparable startups, but there is no company-specific data to narrow that estimate.

              The most unusual capital deployment signal in the public record is the company's October 2025 statement
              that it had already invested in thousands of warheads to secure delivery of a certified system before
              2027. This pre-purchase represents a significant working-capital outflow before contract revenue is earned
              and likely sits on the balance sheet as inventory rather than being expensed as incurred. The multi-site
              production footprint — Germany (HQ), UK (production opened July 2025), Ukraine (2,000 sqm R&D hub for
              200-plus specialists), Sweden (EW engineering), and Greece (regional office) — adds meaningful fixed costs
              in rent, equipment, and local staffing across multiple currencies. Headcount growth from 120 to 400
              employees over 2025 compounds these cost pressures: at a rough European defence startup blended
              fully-loaded cost of €80,000–€120,000 per employee per year, the annualised payroll alone approaches
              €32–€48 million, equating to monthly cash burn of roughly €3–€8 million before facility and inventory
              costs. That estimate is highly uncertain because the actual salary mix, equity-versus-cash compensation
              ratio, and facility costs are not disclosed.
