        - >-
          ICRC recommends legally binding rules including prohibition on systems targeting persons; HRW campaigns for
          binding treaty
        - Could restrict or delay deployment of more automated configurations of Virtus, Cascade, or Minerva
        - Assess STARK's design compliance posture relative to ICRC/HRW minimum criteria for human-in-the-loop control
      - - Export controls (MTCR - systems above 100 km range)
        - Constraint
        - Current
        - >-
