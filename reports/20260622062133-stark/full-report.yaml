      - number: '5.5'
        title: Trust, compliance, regulatory risk, and technical uncertainty
        blocks:
          - type: paragraph
            body: >-
              STARK's published product descriptions emphasise human-in-the-loop design, CWES certification intent, and
              STANAG compliance for Gambit's fuze system. These are substantive architectural commitments, but public
              evidence of completed certifications, national authority accreditations, or independent safety testing is
              absent. The Bundeswehr qualification process for Virtus — a prerequisite for call-off orders under the
              February 2026 framework — has not been publicly described in terms of milestone schedule, test criteria,
              or completion timeline, and no independent qualification body has made a public statement.

              OTA update capability, described for both Virtus and Cascade, creates a cyber-physical security surface
              that is not addressed in any public STARK documentation. Software-defined weapons with over-the-air
              capability require secure update delivery chains, firmware signature verification, and rollback controls;
              none of these are publicly confirmed. The MOSA architecture provides integration flexibility but also
              creates an integration testing burden for each third-party system added. As Minerva's swarming and
              automated targeting features evolve, they attract increasing scrutiny from the ICRC, which requires that
              any autonomous weapon system have meaningful human control over individual targeting decisions, and from
              HRW's Stop Killer Robots campaign, which calls for a treaty prohibition. The EU's emerging AI Act
              regulation and the German legal framework on weapons authorisation could also constrain how Minerva's
              automated target prioritisation and swarming features are marketed and certified as Bundeswehr
              qualification advances. None of these regulatory risks are publicly quantified by STARK.
            claimRefs:
              - CE031
              - CE032
              - CE033
              - CE034
