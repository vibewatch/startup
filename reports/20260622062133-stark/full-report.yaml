  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and export-control risk
        blocks:
          - type: paragraph
            body: >-
              STARK operates at the intersection of German national security law, EU harmonised export controls, and
              evolving international humanitarian law (IHL) for autonomous weapon systems—a regulatory three-way that
              creates friction on every commercial transaction involving lethal munitions.

              Germany's core export-control regime under the Außenwirtschaftsgesetz (AWG) and the
              Außenwirtschaftsverordnung (AWV) requires individual export authorisation from the Bundesamt für
              Wirtschaft und Ausfuhrkontrolle (BAFA) for all Category ML4 loitering munitions. Each export contract to a
              new country triggers a fresh BAFA review, the outcome of which can be delayed by coalition politics,
              parliamentary scrutiny, or changes in the recipient country's human rights record. Germany's Politische
              Grundsätze für Rüstungsexporte historically produced significant refusal rates for sales to non-EU,
              non-NATO partners, creating real uncertainty for STARK's claimed Ukraine and unnamed-NATO-member sales
              pipeline. For domestic Bundeswehr deliveries, BAFA licensing is also required for production batches,
              though the approval trajectory for a domestically classified system is more predictable.

              At the international level, the United Nations Group of Governmental Experts (GGE) on Lethal Autonomous
              Weapons Systems has deliberated under the Convention on Certain Conventional Weapons (CCW) since 2014
              without producing binding rules. This stalemate creates dual risk for STARK: if binding rules emerge, they
              may constrain the autonomy features in Virtus and Cascade; if they do not, HRW- and ICRC-backed voluntary
              moratoria create reputational and export-market friction even absent formal prohibitions. The ICRC's
              published position explicitly holds that autonomous systems selecting and engaging targets without
              meaningful human control are incompatible with IHL. STARK's marketing of AI-enabled targeting
              functionality puts the company squarely within the scope of this critique. The HRW "Stop Killer Robots"
              campaign, active since 2012, has expanded its scope to include AI-targeted loitering munitions and is
              cited by European NGOs in parliamentary submissions.

              NATO's Principles of Autonomy in Weapons Systems commit allied members including Germany to maintaining
              meaningful human control over lethal decisions, adding a further compliance layer. STARK's EU EDIS
              positioning and potential European Defence Fund grant eligibility also require demonstrating sovereign EU
              supply chain compliance, which is complicated by the company's UK production facility. Any UK-domiciled
              production of key components could trigger EDIS eligibility questions post-Brexit.
            claimRefs:
