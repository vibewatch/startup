          equipment sourcing
        - Creates political and procurement incentives for member states to choose sovereign European suppliers
        - Determine how EDIS procurement incentives translate into specific contract criteria STARK can satisfy
      - - Germany EUR 500B expanded defence investment framework
        - Driver
        - Short to medium term (2025 onward)
        - >-
          Bundestag approved EUR 500B framework relaxing debt brake March 2025; EUR 52B military package Dec 2025;
          trajectory to 2.8-3.5% GDP
        - Germany is STARK's primary market; structural budget increase sustains multi-year procurement pipeline
        - >-
