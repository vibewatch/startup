      - number: '1.3'
        title: Milestones, contracts, and scale-up evidence
        blocks:
          - type: paragraph
            body: >-
              The milestone record is unusually dense for a company that appears to have formed in 2024. By late 2025,
              STARK was already publicizing Ukraine deployment, NATO maritime trials for Vanta, and the appointment of a
              specialist defence-growth CEO. By early 2026, it had announced a Swedish footprint for electronic-warfare
              talent, a 2,000 square metre Ukraine R&D hub for more than 200 specialists, a Greek office, a second
              unnamed NATO-member contract, and—most importantly—a Bundeswehr framework agreement for several thousand
              Virtus systems. Those disclosures matter because they provide evidence of buyer pull and manufacturing
              ambition rather than just concept-stage rhetoric. The April 2026 Bundeswehr exercise also showed STARK
              integrating Virtus and Minerva with Quantum Systems’ Vector ISR drone in a recon-to-strike chain, which
              supports the view that STARK is trying to become part of a broader European autonomous-systems stack. Even
              so, public data still stops short of disclosing contract values, production yields, unit economics, or
              sustainment obligations, so the evidence supports strategic momentum more strongly than it supports
              financial predictability.
