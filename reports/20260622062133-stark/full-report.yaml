    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating scope
        blocks:
          - type: paragraph
            body: >-
              STARK is most credibly described as a Berlin-based sovereign defence-technology company rather than a
              generic drone startup. The strongest identity evidence is the company imprint, which names the legal
              entity as SKD SE, gives a Berlin address at Französische Str. 12, and lists an executive board that
              already looks more mature than a one-year-old venture. The homepage, mission framing, and systems pages
              show a business model centered on three connected layers: loitering munitions for strike missions,
              unmanned maritime systems for persistent patrol and interdiction, and software that links reconnaissance,
              targeting, and engagement. This integrated positioning matters because it moves STARK from a
              single-product munition story toward a broader NATO-oriented autonomy platform story. Public materials
              also emphasize speed, scale, and sovereign production, suggesting the company is selling a procurement
              thesis as much as an individual airframe. The company claims it moved from founding to frontline
              deployment in 13 months, which is directionally impressive, but exact founding-date documentation still
              remains thin in public sources and should be confirmed under diligence.
