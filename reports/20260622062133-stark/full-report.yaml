          licence questionnaires
        - >-
          Virtus at 130 km range sits at the edge of Category I sensitivity; international sales outside NATO/EU face
          licence scrutiny
        - >-
          Clarify STARK's export-control classification for Virtus; determine which export markets are structurally
          foreclosed
      - - Electronic warfare countermeasures
        - Constraint
        - Current and ongoing
        - >-
          Mordor: Russian EW reportedly cut GNSS availability for small drones to 18 seconds in Donbas; EW hardening
          raises unit cost up to 8%
        - Forces R&D investment in jam-resistant navigation; raises production cost
        - Request STARK's EW hardening roadmap and how it affects Virtus unit economics at scale
