      - number: '3.2'
        title: Direct European Rivals — Helsing, Tekever, ARX Robotics, Quantum Systems
        blocks:
          - type: paragraph
            body: >-
              Helsing SE is STARK's most direct European rival and the most significant competitive risk in the German
              and broader NATO European procurement channel. Founded in Munich in March 2021, Helsing has raised total
              capital of approximately €1.37 billion across four rounds, reaching a €12 billion valuation in June 2025
              after a €600 million round led by Daniel Ek's Prima Materia. Its product portfolio spans the HF-1 and HX-2
              loitering munitions (GPS-independent using stored map data and the Altra multi-drone targeting software),
              the SG-1 Fathom underwater surveillance system, and AI software integrated into the Eurofighter Typhoon EK
              and Saab JAS 39 Gripen E. Helsing has secured a contract to build AI infrastructure for the Future Combat
              Air System (FCAS), partnered with Airbus to develop the Wingman loyal-wingman AI, and delivered
              approximately 4,000 HF-1 drones to Ukraine in early 2025 with a further 6,000 HX-2 units committed. The
              April 2025 Bloomberg investigation alleging overpriced drones and glitchy software, and the 2024 collapse
              of its Rheinmetall partnership, are material adverse signals that deserve diligence attention. Helsing's
              September 2025 ARX Robotics partnership and October 2025 Blue Ocean AUV acquisition are extending its
              competitive footprint into UGV-drone and underwater coordination domains. Tekever (Portuguese-founded,
              UK-headquartered) focuses on fixed-wing maritime ISR (AR5 family, €30 million EMSA maritime framework
              2025) but is expanding toward autonomous strike with the British Army's Project Nyx loyal wingman
              programme. ARX Robotics (Munich, founded 2022) has raised €42 million and is the largest supplier of
              western unmanned ground vehicles to Ukraine; it is a Helsing partner and Project A co-portfolio company.
              Quantum Systems (Munich) provides the Trinity Pro VTOL ISR drone and MOSAIC UXS multi-domain software; it
              is a STARK ecosystem partner in the April 2026 Bundeswehr recon-to-strike exercise but a potential
              competitor if it adds strike capability.
