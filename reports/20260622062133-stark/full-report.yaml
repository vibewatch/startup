  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-ready scoring across the seven investment dimensions that matter most for STARK's valuation judgment: market,
      product proof, moat, economics, risk, valuation, and evidence quality. Each item is scored on a 1–5 scale where 5
      is strongest. Overall investment attractiveness is constrained by evidence quality, financial opacity, and
      unresolved product qualification.
    approximationNotes: >-
      Scores are analyst judgments synthesised from all seven prior chapters. Market and moat scores reflect genuine
      structural strengths. Product proof, economics, and evidence quality scores reflect the unresolved adverse DroneXL
      record and zero financial disclosure.
    data:
      items:
        - label: Market opportunity
          value: 4/5
          unit: IC score
          trend: growth
          detail: >-
            Germany's €83B 2025 procurement plus NATO 9.4% expenditure growth and European rearmament urgency are
            genuine multi-year structural drivers; loitering munition TAM growing at 10.89% CAGR to $1.07B by 2030;
            European share substantially larger.
        - label: Product differentiation and proof
          value: 2/5
          unit: IC score
          trend: mixed
          detail: >-
            Ukraine combat deployment claim provides differentiation but lacks full independent verification; TDW
            hot-strike demonstration is manufacturer-partnered; DroneXL adverse four-strikes record remains unrefuted;
            qualification status cannot be confirmed.
        - label: Competitive moat
          value: 3/5
          unit: IC score
          trend: growth
          detail: >-
            Bundeswehr framework contract is a genuine first-mover moat; sovereign EU supply chain and In-Q-Tel/NIF
            investor base are non-replicable quickly; Helsing and AeroVironment represent real competitive threats if
            STARK qualification is delayed.
        - label: Unit economics and financial quality
          value: 1/5
          unit: IC score
          trend: neutral
          detail: >-
            Zero public revenue, margin, burn rate, or audited accounts; R&D intensity >45% of expenditure signals
            pre-margin phase; cannot construct unit economics from public data; this is the single lowest-scoring
            dimension.
        - label: Risk profile
          value: 2/5
          unit: IC score
          trend: adverse
          detail: >-
            Product qualification, LAWS regulatory overhang, extreme customer concentration, financial opacity, and
            Thiel/Founders Fund political controversy create a compound risk stack rated High in Chapter 7; multiple
            risks are partially correlated.
        - label: Valuation attractiveness at $1.2B
          value: 2/5
          unit: IC score
          trend: adverse
          detail: >-
            $1.2B unconfirmed; funding-to-valuation multiple 12x exceeds Helsing's 9x despite weaker proof; requires
            ~$114M revenue at AeroVironment P/S to support; six-month 140% step-up driven by contract announcement
            rather than revenue conversion.
        - label: Evidence quality and diligence confidence
          value: 1/5
          unit: IC score
          trend: adverse
          detail: >-
            Unconfirmed valuation, zero financial disclosure, contested product qualification, Bundesanzeiger no filed
            accounts, zero independent test verification, DroneXL adverse record unresolved — evidence quality is the
            binding constraint on the overall rating.
        - label: Exit readiness and strategic value
          value: 3/5
          unit: IC score
          trend: neutral
          detail: >-
            Strategic acquisition by Rheinmetall, L3Harris, or AeroVironment is a plausible pathway; M&A market active
            in European defence tech; In-Q-Tel and NIF presence adds US government acquirer optionality; IPO feasible
            only in 2028+ on bull schedule.
