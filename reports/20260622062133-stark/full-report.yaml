      - number: '5.2'
        title: Virtus, Cascade, and Gambit — hardware architecture and weapons integration
        blocks:
          - type: paragraph
            body: >-
              Virtus is a software-defined one-way effector using electric vertical take-off and landing (eVTOL)
              technology that enables launch from any terrain without catapults, tubes, or pads. Published
              specifications show flight time up to 90 minutes, range 130 km plus, cruising speed 120 km/h, attack speed
              250 km/h, modular payload up to 5 kg, and operating altitude up to 2,000 m. The wingspan and height are
              each 1.8 m; deployment time is under 10 minutes. Penetration capability is stated as 800 mm high-hardness
              armour, achieved through the TDW LION STRIKE 110 warhead whose first hot strike in Germany was confirmed
              jointly by STARK and TDW in December 2025. The LS110 design supports tandem-shaped charges and
              fragmentation jackets, with TDW describing above-average penetration performance. The modular system
              design means Virtus can be modified between software releases to meet operational requirements, and STARK
              specifically describes an EW-resilient data link using multiple communications layers and a navigation
              system combining visual odometry with satellite imagery and known-landmark localisation for GNSS-denied
              environments.

              Cascade is a tube-launched effector with published specs of 100 km range, 100 km/h cruise, 220 km/h dive,
              and 60 minutes flight time; launcher and effector combined weigh under 20 kg, enabling more than 10 units
              on a single vehicle. The platform uses AI and sensor fusion for GNSS-free navigation, object recognition,
              and terminal guidance. A software-defined architecture supports OTA updates. The modular warhead
              accommodates up to 4.5 kg payloads. Gambit is a 6 kg foldable quadcopter with strike range under 25 km and
              ISR range under 40 km; deployment time is under 5 minutes. It carries an EO/IR sensor suite for day and
              night operation, a NATO STANAG-compliant fuze, and an optional fibre-optic guidance link for high-EW
              environments. If a mission is aborted, Gambit returns to its launch point, making it a recoverable asset —
              a significant logistical advantage over single-use effectors.
