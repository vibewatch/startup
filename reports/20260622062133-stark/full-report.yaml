        title: Incumbent Prime Contractors — Rheinmetall, Saab, Elbit, IAI, Rafael
        blocks:
          - type: paragraph
            body: >-
              The large defence prime contractors represent a structural competitive force rather than nimble rivals:
              they hold qualification frameworks, procurement relationships, and multi-year platform contracts that can
              crowd out or constrain startup wins. Rheinmetall (Düsseldorf; €9.75 billion revenue 2024, 40,000
              employees) is simultaneously STARK's home-market incumbent and a potential supply-chain partner (the LION
              STRIKE 110/TDW warhead integration). However, Rheinmetall selected Auterion over Helsing — and implicitly
              over STARK — for drone autonomy, signalling a preference for an open platform rather than a
              startup-branded proprietary stack. Saab (Sweden; SEK 79.1 billion revenue 2025, 26,100 employees) is a
              strategic investor in Helsing (the July 2024 €450 million round) and acquired UK autonomous-swarm company
              Blue Bear Research Systems in 2023. Elbit Systems (Israel; NASDAQ; revenue US$6.83 billion 2024, 18,407
              employees) operates Hermes 450/900 and Skylark ISR platforms across NATO member states, but the NATO
              Support and Procurement Agency barred Elbit from arms contracts since May 2025 due to an ongoing
              corruption investigation — creating a material near-term procurement window for STARK in previously
              Elbit-served NATO channels. IAI (Israel; state-owned; US$4.97 billion revenue 2022; US$26 billion order
              backlog January 2026) invented modern loitering munitions with Harop and Harpy and holds a dominant export
              position; its Harop is estimated at US$100,000-plus per unit, representing a cost-based entry opportunity
              for STARK's Virtus at a lower price point. Rafael (Israel; US$4.85 billion revenue 2024, 10,000 employees)
              signed a US$3.5 billion Arrow 3 air-defence export agreement with Germany in late 2025, demonstrating that
              Israeli prime contractors have active deep Bundeswehr commercial access that STARK competes alongside.
