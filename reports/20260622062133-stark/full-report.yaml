  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Category Map
        blocks:
          - type: paragraph
            body: >-
              STARK sits at the intersection of four procurement categories that European defence buyers are
              simultaneously accelerating: loitering munitions, unmanned surface vessels (USVs), AI command-and-control
              software, and autonomous ground systems. The competitive set is therefore layered rather than monolithic.
              Tier-1 incumbents are the large Western and Israeli prime contractors — AeroVironment, IAI, Elbit, Rafael,
              Rheinmetall, and Saab — which have decades of qualification history, bilateral government trust, and
              established logistics networks but which move slowly and price units at premium margins. Tier-2
              venture-backed defence-tech startups — Helsing, Anduril, Shield AI, and Auterion — are well-capitalised,
              software-first, and increasingly winning platform contracts, but most are US-anchored or, in Helsing's
              case, competing in overlapping German and European procurement channels. Tier-3 European peer startups —
              Tekever, ARX Robotics, and Quantum Systems — address adjacent categories (fixed-wing maritime ISR,
              unmanned ground vehicles, and multi-domain ISR respectively) and represent both partnership targets and
              nascent rivals. The status-quo substitutes — conventional artillery, anti-tank guided missiles, manned ISR
              aircraft, and shore-based patrol vessels — remain the baseline from which procurement officials are
              actively trying to shift but which carry sunk-cost and qualification bias that slows transition velocity.
              STARK is the only competitor in the full set reviewed that combines aerial strike, maritime USV, and an AI
              C2 software layer in a single European-sovereign corporate entity.
            claimRefs:
