      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Disconfirming Evidence
        blocks:
          - type: paragraph
            body: >-
              The demand case for STARK's market is driven by six inter-locking forces. First, European rearmament:
              SIPRI recorded a 9.4% global military-expenditure increase in 2024, the steepest in 36 years, led
              substantially by European NATO members responding to the Russia-Ukraine war. Second, Ukraine combat
              validation: battlefield use of loitering munitions demonstrated that affordable mass production and
              swarming can saturate adversary defences at a fraction of conventional missile cost, compressing
              procurement timelines for NATO states. Third, European industrial policy: EDIS creates political and
              procurement incentives for member states to source defence equipment from European suppliers rather than
              from the United States or Israel, benefiting a Berlin-based company with claimed sovereign production.
              Fourth, NATO maritime gap: approximately five million square kilometres of European maritime waters cannot
              be continuously patrolled with existing naval assets, creating explicit demand for affordable persistent
              USV coverage. Fifth, AI integration trend: STARK's Minerva software positions it to capture the growing
              convergence of ISR, targeting, and engagement in AI-enabled kill chains, as evidenced by the April 2026
              Bundeswehr exercise integrating Virtus, Minerva, and Quantum Systems' Vector drone. Sixth, national
              defence budget expansion: Germany's EUR 500 billion expanded defence investment framework approved in
              March 2025 and the December 2025 EUR 52 billion procurement package create sustained buyer purchasing
              power. Adoption constraints are equally material. Export-control restrictions (MTCR Category I) on
              loitering munitions above 100 km range raise compliance costs and slow international sales. Autonomous
              weapon regulation risk is real: the ICRC has formally called for legally binding rules on AWS,
              recommending prohibition on unpredictable systems and systems targeting persons, while HRW leads the Stop
              Killer Robots coalition. Qualification and certification cycles remain long in European defence even under
              accelerated regimes. Electronic warfare countermeasures - Russian EW reportedly cut GNSS availability for
              small drones to 18 seconds in Donbas - force expensive EW-hardening investments. STARK's own adverse
              events - the October 2025 DroneXL report of four missed strikes in military trials, and STARK's published
              rebuttal - show that product reliability remains a live procurement risk that buyers will probe in every
              subsequent qualification cycle.
