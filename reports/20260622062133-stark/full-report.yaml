      - number: '4.2'
        title: Capital formation and investor base
        blocks:
          - type: paragraph
            body: >-
              STARK's capital formation history is partially opaque because the company has not made a single official
              statement disclosing the total amount raised, round sizes, or post-money valuations. What is publicly
              available comes from third-party reporting and investor signals. The company's October 2025 CEO
              announcement confirmed that Sequoia Capital led the company through two funding rounds and that the
              investor group also includes the NATO Innovation Fund, Project A, and In-Q-Tel. This confirms a
              high-quality, multi-geography investor base that combines commercial VC (Sequoia), European
              defence-focused VC (Project A), a NATO-mandate fund (NIF), and the CIA's strategic venture arm (In-Q-Tel).

              Third-party media reporting adds additional detail that the company has not confirmed. DroneXL reported in
              October 2025 that total funding reached $100 million through two rounds, with Sequoia's August 2025 round
              at $62 million valuing the company at $500 million, and named 8VC as an additional participant. Deutsche
              Startups and Tech Funding News both reported in February 2026 that Founders Fund (Peter Thiel) invested a
              double-digit million-euro amount in a new round, lifting the valuation to approximately $1.2 billion. No
              official STARK statement, filing, or investor press release has confirmed the Founders Fund investment or
              the $1.2 billion valuation. SKD SE's commercial register entry at Amtsgericht Charlottenburg (HRB 260878
              B) shows five board members, three Prokura holders, and five known active subsidiary stakes, but contains
              no public financial data. The Bundesanzeiger search returns no publicly filed annual accounts for SKD SE,
              consistent with a company incorporated in 2024 that has not yet completed its first full financial year
              requiring public disclosure.
