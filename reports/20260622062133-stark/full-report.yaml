  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              STARK's addressable market spans three interconnected sub-markets: (1) loitering munitions - also called
              one-way attack drones or OWA-UAS - for land-based or air-launched precision strike at ranges from tens to
              hundreds of kilometres; (2) autonomous unmanned surface vessels (USVs) for maritime patrol, ISR, and in
              future strike operations; and (3) AI-enabled command-and-control software (Minerva) that ties multiple
              unmanned platforms into networked strike chains. Included spend covers expenditure by defence ministries,
              armed forces procurement agencies, and allied-nation capability programs for hardware, integration,
              software, and sustainment of these autonomous systems. Excluded spend includes commercial drone markets,
              civilian logistics drones, non-defence ISR satellites, traditional artillery, conventional cruise
              missiles, and manned combat aviation - all of which can partially substitute for STARK's products.
              Status-quo substitutes remain important: legacy precision-guided munitions and manned strike aircraft
              provide the same battlefield output at higher cost and lower mass-production potential, while conventional
              patrol vessels and coast guard cutters cover the maritime-domain awareness mission at much higher per-unit
              cost and personnel exposure. The relevant market boundary sits where buyers need (a) affordable mass, (b)
              reduced personnel risk, and (c) AI-enabled targeting speed that conventional platforms cannot match at
              equivalent cost. STARK's systems specifically address NATO member states' identified capability gaps in
              man-in-the-loop strike at range, maritime persistent presence, and multi-domain recce-to-strike timelines,
              which distinguishes the addressable market from broader unmanned-systems or defence-electronics totals.
