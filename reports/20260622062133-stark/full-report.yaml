  - id: FE002
    title: Customer workflow — recon-to-strike operating flow
    type: flow
    layout: standard
    summary: >-
      How STARK's multi-domain platform is used in a recon-to-strike mission, from ISR collection through Minerva target
      prioritisation to effector strike, illustrating the sensor-to-shooter loop that the April 2026 Bundeswehr exercise
      was designed to compress.
    data:
      nodes:
        - id: isr-collection
          label: ISR reconnaissance
          detail: >-
            ISR drone (Quantum Systems Vector or Gambit in ISR mode) collects imagery and positional data on targets.
            STARK does not manufacture the primary ISR layer for long-range missions — this is a partner dependency.
          tone: warning
        - id: data-uplink
          label: Data link to Minerva
          detail: >-
            Reconnaissance data transmitted to Minerva ground control station over EW-resilient datalink. Loop time
            between detection and strike tasking was reduced to "minutes" per April 2026 exercise claim.
          tone: neutral
        - id: target-prioritisation
          label: 'Minerva: automated target prioritisation'
          detail: >-
            Minerva AI ranks targets by priority; operator reviews and approves or modifies prioritisation.
            Human-in-the-loop design means final engagement decision rests with the operator, not the algorithm.
          tone: neutral
        - id: effector-tasking
          label: 'Minerva: effector selection and swarming'
          detail: >-
            Operator defines intent; Minerva translates intent into group behaviour and assigns individual effectors
            (Virtus, Cascade, or Gambit) to targets. Swarm coordination enables simultaneous multi-effector saturation
            of a target set.
          tone: neutral
        - id: strike-execution
          label: Strike execution
          detail: >-
            Effector navigates using GNSS or GNSS-denied mode; terminal guidance via visual odometry, sensor fusion, or
            fibre-optic link. Virtus dives at 250 km/h; Cascade at 220 km/h; Gambit at 120 km/h.
          tone: neutral
        - id: bda
          label: Battle damage assessment
          detail: >-
            Post-strike feedback from surviving ISR assets or remaining sensors. Minerva logs full decision audit trail
            for certification review. BDA loop initiates next mission cycle.
          tone: neutral
        - id: abort-return
          label: Abort / safe return (Gambit)
          detail: >-
            If mission is aborted before terminal phase, Gambit returns to launch point as a recoverable asset. Virtus
            and Cascade are one-way effectors with no abort-and-recover capability.
          tone: neutral
      edges:
        - from: isr-collection
          to: data-uplink
        - from: data-uplink
          to: target-prioritisation
        - from: target-prioritisation
          to: effector-tasking
        - from: effector-tasking
          to: strike-execution
        - from: strike-execution
          to: bda
        - from: bda
          to: isr-collection
        - from: target-prioritisation
          to: abort-return
    approximationNotes: >-
      Flow is inferred from STARK product descriptions, the April 2026 Bundeswehr exercise press release, and Six
      Robotics partnership announcement. Loop timing ("minutes") is a company-claimed figure from one exercise; no
      independent KPI or kill-chain timing data has been published.
    claimRefs:
