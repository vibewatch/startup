      - number: '3.5'
        title: Moat Durability, Switching Cost, and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              STARK's claimed differentiation rests on four pillars: European sovereignty, integrated
              hardware-software-C2 across domains, speed-to-field, and an asset-light scaling thesis. Each faces a
              credible counter-argument. The sovereignty advantage is real but not permanent — Anduril and Shield AI are
              building European footprints and Helsing already occupies the same German/NATO channels. Integration
              advantage is contested: Anduril's Lattice C2 competes directly at the software layer, and STARK's
              recon-to-strike chain in the April 2026 Bundeswehr exercise required Quantum Systems' Vector for ISR
              input, exposing a stack-completeness gap. Speed-to-field is impressive but has been challenged by the
              October 2025 DroneXL adverse trial narrative, which the Bundeswehr framework award partially rebuts but
              does not fully extinguish. The asset-light thesis is plausible at early framework volumes but Helsing's
              June 2025 Grob Aircraft acquisition is a directional signal that software-first European defence startups
              eventually require manufacturing assets at multi-thousand-unit scales. The aggregate adverse risk profile
              for STARK's moat includes at least eight concurrent threats: Anduril Lattice displacing Minerva as a NATO
              C2 standard; Helsing winning competing Bundeswehr budget slots (FCAS AI, Gripen integration); Rheinmetall
              internalising autonomy via Auterion; AeroVironment's sustained reliability and volume benchmark; IAI and
              Rafael's deep Bundeswehr relationships; Elbit's potential ban recovery and reputational contagion risk for
              all defence AI startups; STARK's production scale-up execution risk at several-thousand-unit framework
              delivery; and the adverse trial narrative that remains unresolved without public qualification-test data.
              Multi-homing risk is low in the short term because loitering munition procurement involves long
              qualification cycles and single-vendor framework contracts, but platform-lock-in at the C2 software layer
              (where Lattice, Minerva, Hivemind, and Auterion all compete) is the most durable differentiator for the
              long run.
