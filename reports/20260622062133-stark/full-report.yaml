  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product catalogue, platform scope, and system architecture
        blocks:
          - type: paragraph
            body: >-
              STARK has publicly disclosed five products that form a vertically integrated autonomous-weapons platform
              spanning air-strike, maritime, and software layers. Virtus (OWE-V) is the flagship fixed-wing loitering
              munition, positioned for long-range precision strikes against armoured and point targets. Cascade is a
              tube-launched effector designed for mass saturation attacks using simultaneous multi-launcher fires from
              vehicles, vessels, or containers. Gambit (OWE-Q) is a man-portable foldable quadcopter for short-range ISR
              and strike. Vanta is a family of unmanned surface vessels for maritime ISR, patrol, and naval deterrence.
              Minerva is the AI-enabled command and control software that orchestrates all four hardware platforms and
              can integrate third-party unmanned systems through standardised interfaces.

              The architectural intent is clear from the product naming and cross-references: Minerva acts as the brain,
              the three munition platforms act as effectors at different range bands and mobility profiles, and Vanta
              extends the kill chain to the maritime domain. STARK explicitly describes Minerva as middleware linking
              its own systems and those of other manufacturers — positioning the stack as an open-architecture European
              platform rather than a closed single-vendor system. The career page shows active hiring for software
              engineers, embedded systems, and systems integration roles, consistent with a platform-first development
              strategy. All five products have dedicated product pages on the STARK website but provide limited
              independent technical verification beyond company-authored specifications.
            claimRefs:
