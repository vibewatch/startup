      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              STARK's public financial evidence quality is low across all metrics that matter for investment
              underwriting. Revenue quality cannot be assessed because there is no revenue disclosure of any kind — no
              ARR, no backlog value, no units delivered, no ASP, and no gross margin. Capital intensity is directionally
              clear (high R&D, warhead pre-purchase, multi-site production) but cannot be quantified. The reported
              unicorn valuation of $1.2 billion is unconfirmed by the company and therefore cannot be reconciled with
              any earnings or revenue multiple. The Bundeswehr framework agreement is the most concrete financial signal
              but its undisclosed contract value means it cannot anchor a revenue model or a valuation calculation.

              The adverse evidence adds further uncertainty. DroneXL's October 2025 report that Virtus failed all four
              strikes in military trials is directly relevant to the Bundeswehr qualification condition: if the system
              fails qualification, the framework agreement does not convert to orders, and the contract backlog
              disappears. STARK's own rebuttal statement and subsequent Bundeswehr exercise evidence (April 2026)
              support continued engagement, but the qualification milestone is not yet publicly confirmed as cleared.
              The key diligence blockers are: absence of audited accounts, unconfirmed round size and cap table, no
              backlog value or order-book disclosure, no gross-margin data for any product, and no confirmed
              qualification status for the Bundeswehr contract. Any financial underwriting of STARK requires access to
              management accounts, a board-approved cap table, signed order-book summaries, and a qualification
              milestone plan, all of which require NDA-protected data room access.
