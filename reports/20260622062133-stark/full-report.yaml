      - number: '5.4'
        title: Testing history, strategic partnerships, and integration validation
        blocks:
          - type: paragraph
            body: >-
              STARK's publicly confirmed testing milestones include the September 2025 NATO DYNAMIC MESSENGER exercise
              in Portugal, where Vanta-4 and Vanta-6 were introduced and tested alongside NATO capabilities; the
              December 2025 first hot strike of the TDW LS110 warhead integrated with Virtus; and the April 2026
              Bundeswehr exercise demonstrating the Virtus-Minerva-Vector recon-to-strike chain. These milestones
              represent meaningful technical validation steps, particularly the warhead integration, which STARK
              describes as evidence of mass-producible German-manufactured munitions.

              Partnership activity has been intense in the first half of 2026. The Six Robotics MoU (March 2026)
              provides autonomy and swarming software from a Norwegian company with FFI links, enabling joint
              recce-strike missions across national boundaries. The INLEAP Photonics partnership (April 2026, Hannover
              Messe) integrates the FASTLIGHT SHIELD laser C-UAS into Vanta USV, broadening the platform's counter-drone
              defensive capability. Both partnerships are at MoU or early integration stage and have not yet produced
              independently verified field results. The adverse evidence record is also significant: the DroneXL article
              from October 2025 reported that Virtus failed all four strike attempts in trials with British and German
              armed forces, citing unnamed Financial Times sources, and characterised it as a catastrophic failure for a
              company valued at $500 million. STARK published a defensive statement citing a Ukrainian military unit
              that had requested additional Virtus systems after "high efficiency and combat effectiveness," and
              pointing to system improvements since those trials. Neither account is independently verifiable from
              public sources.
