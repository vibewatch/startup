  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing structure
        blocks:
          - type: paragraph
            body: >-
              STARK operates a business-to-government defence hardware and software revenue model with no consumer or
              commercial-SaaS component visible in any public source. Revenue is generated through government
              procurement contracts — most publicly evidenced by the Bundeswehr framework agreement for several thousand
              Virtus loitering munitions approved by the German Bundestag Budget Committee on 25 February 2026, and a
              second contract with an unnamed NATO member state announced 4 February 2026 with delivery completed by
              August 2026. Both contracts are undisclosed in value. A third ongoing revenue stream covers active
              combat-zone delivery to Ukrainian armed forces, which operate under emergency procurement arrangements
              rather than standard parliamentary procurement cycles. The Vanta USV line and Minerva C2 software
              represent additional future revenue streams but remain at early commercial maturity with no disclosed
              customer contracts beyond demonstration engagements.

              Revenue recognition for this model is milestone-driven: delivery of hardware lots against framework
              call-off orders triggers revenue, not contract signing. This matters because the Bundeswehr framework is
              conditional on successful qualification, meaning the contract backlog does not convert to firm recognised
              revenue until STARK clears the qualification gate. STARK has not disclosed pricing for any product; its
              own February 2026 statement confirmed there is no Virtus pricing in German media. The absence of pricing,
              ASP, or any revenue figure means it is not possible to build a revenue model from public data — the
              architecture of the model is visible but the inputs are entirely private.
