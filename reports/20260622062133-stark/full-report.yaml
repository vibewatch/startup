companyProfile:
  summary: >-
    STARK is a Berlin-based defence technology company operating as SKD SE and focused on sovereign European autonomous
    strike capability. Its public product stack spans the Virtus and Cascade loitering munitions, the Gambit short-range
    effector, Vanta unmanned surface vessels, and Minerva command-and-control software. Official sources confirm backing
    from Sequoia Capital, Project A, NATO Innovation Fund, and In-Q-Tel, while February 2026 media reports describe an
    unconfirmed Founders Fund-linked round at roughly a $1.2 billion valuation. The company has meaningful public demand
    proof through a February 2026 Bundeswehr framework for several thousand Virtus systems, but it still discloses no
    revenue, margins, total capital raised, or audited accounts.
