      - number: '7.6'
        title: Reputational, political, and execution risk
        blocks:
          - type: paragraph
            body: >-
              STARK occupies an unusually exposed reputational position for a European defence startup. The confirmed
              Founders Fund (Peter Thiel) investor association triggered sufficient political controversy in Germany
              that the company issued a formal public statement in February 2026 explicitly denying "far-right"
              association allegations. This episode reveals a structural political risk: in a German defence-market
              context where parliamentary approval, government grants, and coalition sensitivity all bear on procurement
              outcomes, investor optics can directly affect business viability. Any future Thiel-related
              controversy—political, legal, or media—could re-contaminate STARK by association.

              Human rights organisations including HRW and the ICRC maintain active campaigns against AI-enabled
              loitering munitions and autonomous weapons, creating reputational risk with European institutional
              investors (pension funds, insurance pools) that have ESG mandates restricting investments in autonomous
              lethal systems. This may limit STARK's access to European capital pools at scale—an important
              consideration if future financing needs grow beyond current VC participation.

              On the execution side, STARK's management team combines venture-investor experience (Horstmann from
              Project A), defence-sales experience (Helmsen from Rheinmetall), and scale-operations experience (Rost
              from Zalando), but no member of the public executive team has a track record of running high-volume weapon
              systems production. The 13-month founding-to-frontline claim, while impressive for market positioning, is
              a double-edged signal: it may indicate qualified performance under favourable conditions, or it may
              indicate that qualification shortcuts were taken that will surface under formal BAAINBw evaluation.
              Competition from better-capitalised incumbents (Rheinmetall, AeroVironment, Elbit) and well-funded peers
