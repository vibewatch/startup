  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: stark-virtus-unit-pricing
    missingEvidence: STARK does not publicly disclose Virtus ASP, Bundeswehr framework unit pricing, or total contract value; comparative pricing analysis relies on AeroVironment public contract data and IAI analyst estimates.
    whyItMatters: Without pricing data, diligence cannot assess whether STARK's value proposition against AeroVironment and IAI is based on cost, capability, or political preference — each of which has different moat durability.
    diligencePath: Request ASP schedule and total Bundeswehr framework value under NDA; compare against known AeroVironment and IAI pricing in comparable NATO procurements.
    relatedQuestionRefs:
    - QP017
    - QP018
    relatedTableRefs:
    - TP003

  - type: missing-source
    severity: material
    topic: helsing-deployment-evidence
    missingEvidence: Helsing's April 2025 Bloomberg overpriced/glitchy-software allegations and the operational effectiveness of HF-1 in Ukraine are not independently corroborated in sources reviewed; Helsing's 4,000 HF-1 unit delivery is Wikipedia-reported and unverified at chapter source level.
    whyItMatters: STARK's most direct European rival may itself have product reliability issues; corroboration would either increase or reduce the Helsing threat level and affect the European loitering munition credibility benchmark overall.
    diligencePath: Obtain Bloomberg original investigation; request Ukrainian military after-action reports on HF-1 effectiveness; cross-reference with Bundeswehr Virtus qualification results.
    relatedQuestionRefs:
    - QP010
    - QP013
    relatedTableRefs:
    - TP002

  - type: missing-source
    severity: material
    topic: anduril-europe-market-entry
    missingEvidence: Anduril's confirmed European procurement footprint as of mid-2026 is not well-documented in public sources; it is unclear whether Anduril has won European NATO contracts or remains aspirational in the region.
    whyItMatters: If Anduril is actively competing for EU/NATO contracts the sovereignty advantage erosion timeline is accelerating; if US-only, STARK's window is wider.
    diligencePath: Survey European defence procurement databases for Anduril contract wins; check DIANA and NATO STO partnership lists; review Anduril press releases for any European government announcements.
    relatedQuestionRefs:
    - QP014
    relatedTableRefs:
    - TP002

  - type: conflicting-data
    severity: material
    topic: stark-product-reliability
    missingEvidence: The October 2025 DroneXL adverse trial report and STARK's rebuttal remain unreconciled; the Bundeswehr framework award provides corroboration of buyer acceptance but does not independently validate field reliability rates or failure modes.
    whyItMatters: Product reliability is the primary buying criterion for loitering munitions; if STARK's failure rate in subsequent qualification cycles is materially higher than Switchblade or HX-2, the competitive positioning collapses.
    diligencePath: Request Bundeswehr qualification test results, MTBF data, and after-action reports; obtain independent technical assessment of Virtus against comparable systems.
    relatedQuestionRefs:
    - QP013
    - QP025
    relatedTableRefs:
    - TP004

  - type: private-evidence-only
    severity: minor
    topic: stark-minerva-standalone-c2-capability
    missingEvidence: No independent technical evaluation of Minerva's standalone C2 capability is available; the April 2026 Bundeswehr exercise required Quantum Systems' Vector for the ISR input, suggesting Minerva may not yet fully replace a dedicated ISR layer.
    whyItMatters: Minerva's software moat depends on whether it can operate as a platform-agnostic C2 system or only as a Virtus/Vanta controller; the former is a much larger opportunity and moat against Lattice.
    diligencePath: Request Minerva architecture documentation; confirm whether Minerva can ingest sensor feeds from third-party ISR platforms independently of STARK hardware.
    relatedQuestionRefs:
    - QP009
    - QP011
    relatedTableRefs:
    - TP002
