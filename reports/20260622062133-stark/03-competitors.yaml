- id: TP004
  title: Moat durability / competitive risk register
  notes: Severity ratings (High / Medium / Low-Medium / Low) are analyst judgements based on available evidence; they reflect the potential impact on STARK's competitive position if the threat materialises, not the probability of occurrence.
  columns:
  - STARK moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - European sovereignty differentiation
    - Anduril/Shield AI establish EU manufacturing or joint ventures; EDIS criteria weaken
    - Medium
    - Monitor US firm EU footprint expansion; confirm EDIS qualifying criteria for STARK SKD SE
  - - Integrated hardware-software-C2 stack
    - Anduril Lattice becomes NATO C2 standard; Minerva forced to integrate as subordinate module
    - High
    - Evaluate Lattice interoperability roadmap; confirm whether Minerva can function standalone for EU buyers
  - - Speed-to-field advantage
    - Adverse trial history resurfaces in qualification cycles; Helsing closes the gap
    - Medium
    - Request Bundeswehr qualification test results; compare MTBF with Switchblade and HX-2
  - - Bundeswehr as anchor customer
    - Helsing wins competing Bundeswehr programme (FCAS AI, Gripen) displacing STARK budget slots
    - High
    - Map active Bundeswehr procurement programmes; confirm STARK and Helsing bid on different line items
  - - Naval/maritime USV whitespace (Vanta)
    - NATO ally navies select Saab Blue Bear or Tekever for maritime patrol instead
    - Medium
    - Benchmark Vanta vs competing maritime USV on endurance, payload, autonomy depth
  - - Rheinmetall/TDW warhead partnership
    - Rheinmetall deepens Auterion relationship; LION STRIKE 110 warhead dependency risk increases
    - Medium
    - Confirm contractual exclusivity and pipeline for LION STRIKE 110 integration
  - - Production scale-up thesis
    - Asset-light model faces capex bottleneck at multi-thousand-unit framework delivery
    - High
    - Request production plan, supply-chain audit, and capacity evidence for Bundeswehr framework delivery
  - - Israeli incumbent displacement opportunity
    - Elbit recovers NATO procurement access; IAI/Rafael recover political standing and buyers revert
    - Low-Medium
    - Track Elbit NATO ban timeline; confirm STARK has won competitive evaluations not just framework selections
