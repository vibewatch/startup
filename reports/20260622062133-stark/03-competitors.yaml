    sourceRefs:
    - SP002
    - SP003
    - SP021
    confidence: high
    freshness: recent
    answersQuestionRefs:
    - QP004
    - QP008

  - id: CP016
    statement: Quantum Systems positions itself as a multi-domain ISR platform provider with the Trinity Pro VTOL drone and the MOSAIC UXS software stack for integrated operations across air, land, sea, and counter-UAS domains.
    type: observed
