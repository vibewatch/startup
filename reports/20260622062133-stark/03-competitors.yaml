  claims:
  - id: CP001
    statement: The loitering munition competitive landscape for STARK involves at least four distinct tiers — large prime contractors, well-capitalised defence-tech startups, European peer startups, and status-quo substitutes — none of which overlap completely with STARK's combined loitering munition, USV, and AI C2 portfolio.
    type: inferred
    topic: competitive-landscape
    sourceRefs:
    - SP001
    - SP008
    - SP011
    - SP015
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP001
    - QP002

  - id: CP002
    statement: European sovereignty is a genuine procurement differentiator in post-2022 NATO Europe, with EU EDIS and national buy-European mandates creating preference for EU-origin defence systems over US and Israeli alternatives.
    type: inferred
    topic: differentiation
    sourceRefs:
    - SP022
    - SP004
    - SP002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP003
    - QP014

  - id: CP003
    statement: Status-quo substitutes for loitering munitions include conventional artillery, anti-tank guided missiles, manned close air support, and shore-based patrol vessels; these hold large procurement budget shares and represent the cost-and-familiarity baseline for all loitering munition entrants.
    type: inferred
    topic: substitutes
    sourceRefs:
    - SP008
    - SP015
    - SP019
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QP002
    - QP005

  - id: CP004
    statement: Quantum Systems (Munich) is a current STARK ecosystem partner — the April 2026 Bundeswehr exercise paired Quantum Systems' Vector ISR drone with Virtus in a recon-to-strike chain — but the partnership dynamic could shift to competition if Quantum Systems adds strike capability or C2 software overlapping with Minerva.
    type: observed
    topic: ecosystem-partner-competitor
    sourceRefs:
    - SP023
    - SP020
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP004
    - QP009

  - id: CP005
    statement: ARX Robotics and Tekever are complementary European-sovereign peers to STARK's portfolio — ARX provides autonomous UGVs and Tekever provides fixed-wing maritime ISR — creating potential partner-or-compete dynamics depending on future product roadmap overlap.
    type: inferred
    topic: ecosystem-peers
    sourceRefs:
    - SP002
    - SP004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP004
    - QP009

  - id: CP006
    statement: Helsing SE was founded in Munich in March 2021, has 900 employees as of 2025, and raised total capital of approximately €1.37 billion across four rounds, reaching a €12 billion valuation in June 2025 after a €600 million round led by Daniel Ek's Prima Materia.
    type: third-party-reported
    topic: helsing-profile
    sourceRefs:
    - SP001
    - SP007
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP006
    - QP008

  - id: CP007
    statement: Helsing's product portfolio includes the HF-1 and HX-2 loitering munitions (GPS-independent using stored map data and the Altra multi-drone targeting software), the SG-1 Fathom underwater surveillance system, and AI software integrated into the Eurofighter Typhoon EK and Saab JAS 39 Gripen E.
    type: third-party-reported
    topic: helsing-products
    sourceRefs:
    - SP001
    - SP007
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP006
    - QP007

  - id: CP008
    statement: Helsing delivered approximately 4,000 HF-1 strike drones to Ukraine in early 2025 and committed to a further 6,000 HX-2 units, making it the most battle-relevant European loitering munition supplier ahead of STARK at present.
    type: third-party-reported
    topic: helsing-deployment
    sourceRefs:
    - SP001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP006
    - QP007
    - QP013

  - id: CP009
    statement: Helsing secured a contract to build AI infrastructure for the Future Combat Air System and partnered with Airbus to develop AI for the Wingman loyal-wingman concept — placing it in a deeper institutional Bundeswehr and NATO programme position than STARK holds as of mid-2026.
    type: third-party-reported
    topic: helsing-moat
    sourceRefs:
    - SP001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP010
    - QP015

  - id: CP010
    statement: In April 2025, Bloomberg News reported that Helsing faced allegations of overpriced drones and glitchy software from former employees, investors, and military experts, raising concerns about technology reliability and business integrity; this is material adverse evidence for the most directly comparable European competitor to STARK.
    type: third-party-reported
    topic: helsing-adverse
    sourceRefs:
    - SP001
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP013
    - QP025

  - id: CP011
    statement: Helsing's partnership with Rheinmetall dissolved in 2024; Rheinmetall instead partnered with Auterion for drone autonomy, demonstrating that Rheinmetall evaluates and substitutes startup partners and that Auterion is now a direct platform-layer competitor to STARK's Minerva in the Rheinmetall ecosystem.
    type: third-party-reported
    topic: helsing-rheinmetall-auterion
    sourceRefs:
    - SP001
    - SP005
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP010
    - QP024

  - id: CP012
    statement: In September 2025, Helsing and ARX Robotics formed a partnership to develop AI-based networked reconnaissance and strike systems integrating drones and unmanned ground vehicles — extending Helsing's competitive footprint into UGV-drone coordination that STARK does not yet cover.
    type: third-party-reported
    topic: helsing-arx-partnership
    sourceRefs:
    - SP001
    - SP002
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP009
    - QP010

  - id: CP013
    statement: Saab AB invested in Helsing as part of the July 2024 €450 million funding round and integrated Helsing AI into Gripen radar systems, creating a strategic alignment between STARK's key Nordic market (Sweden became a STARK expansion base in early 2026) and its nearest European rival.
    type: third-party-reported
    topic: saab-helsing-investment
    sourceRefs:
    - SP001
    - SP016
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP010
    - QP016

  - id: CP014
    statement: Tekever secured a €30 million EMSA maritime ISR framework contract in November 2025 and was selected for the British Army's Project Nyx loyal wingman programme in May 2026, expanding from ISR toward autonomous strike — creating future adjacency overlap with STARK's Virtus.
    type: observed
    topic: tekever-profile
    sourceRefs:
    - SP004
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QP004
    - QP008

  - id: CP015
    statement: ARX Robotics (Munich, founded 2022) raised €42 million in total funding (€1.15M pre-seed, €9M seed, €31M Series A, €11M Series A extension) and is the largest supplier of western unmanned ground vehicles to Ukraine with several hundred GEREON UGVs contracted.
    type: observed
