  topStrengths:
    - 具名 Bundeswehr 数千套 Virtus 系统框架，给 STARK 提供了比多数欧洲国防创业公司更罕见的公开需求证据。
    - 公司把 loitering munitions、海上系统和 Minerva C2 软件拼成主权欧洲技术栈，贴合 NATO 和 EU 产业政策优先级。
    - 投资人与合作伙伴组合给这家年轻国防公司带来罕见战略可信度，尤其是 Sequoia、Project A、NATO Innovation Fund 和 In-Q-Tel。
  topRisks:
    - 没有公开收入、利润率、积压订单或经审计账目披露，估值支撑无法拿实际财务表现检验。
    - Bundeswehr 框架仍取决于资格认证；2025 年 10 月试验失败的不利报道，也让产品可靠性问题悬而未决。
    - 客户集中、出口管制和自主武器监管审查，可能显著拖慢德国及少数盟友买家之外的规模化。
  unresolvedGaps:
    - 经审计收入、积压订单、毛利率、现金消耗和现金跑道仍未在公开来源中提供。
    - 报道中 2026 年 2 月融资的确切规模、条款和领投方经济性未获官方确认。
    - 仍缺少独立证据，把 DroneXL 不利试验叙事与 STARK 后续反驳及 Bundeswehr 资格进展对上。
