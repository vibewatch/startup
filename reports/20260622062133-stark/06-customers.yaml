- id: retention-and-durability
  title: Retention, durability, and repeat-usage visibility
  body: Durability is the weakest part of STARK’s public customer evidence. None of the reviewed sources disclose NRR, GRR, churn, renewal rates, contract values, or even a total customer count. The best public repeat-usage proxy is the Bundeswehr chain from testing to framework award and the company’s claim that a Ukrainian unit requested additional systems, but neither proxy is enough to infer durable recurring revenue. The Bundeswehr framework is explicitly conditioned on successful qualification, which means call-offs and revenue timing remain uncertain. The unnamed NATO contract shows an export order with a defined delivery window, but there is no public evidence of follow-on orders, extension terms, or satisfaction metrics. As a result, the chapter can speak confidently about adoption surfaces and live procurement interest, but not about retention quality. Any investor or acquirer would still need contract schedules, acceptance milestones, reorder behavior, and after-action reference
    calls to determine whether STARK is becoming a sticky defence supplier or is still proving first purchases one by one.
  claimRefs:
  - CU003
