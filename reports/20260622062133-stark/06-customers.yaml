- id: adoption-and-growth
  title: Adoption trajectory and scaling signals
  body: 'The reviewed sources show a plausible adoption ladder, but not a broad installed-base disclosure. The ladder begins with experimentation and integration: NATO maritime trials in September 2025, adverse and mixed performance feedback from Ukraine and European trials in October 2025, Panzerbrigade 45 modernization spending in December 2025, then public customer announcements in January through April 2026. STARK’s own language consistently describes a rapid-development, rapidly deployed model, and the timing of the unnamed NATO contract suggests the company can at least move from signature to delivery within months. Staffing signals point in the same direction, though imperfectly. STARK said it grew from 120 to 400 employees over the prior year, while LinkedIn shows a 201-500 size band, 140 visible employees, and active hiring across autopilot, flight testing, software business development, maritime R&D, and Nordic recruiting. Those proxies suggest scaling capacity for deployments
    and customer support, but they do not translate into transparent customer counts or utilization data.'
