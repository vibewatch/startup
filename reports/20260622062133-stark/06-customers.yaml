- id: named-customer-proof
  title: Named customer proof, deployment maturity, and evidence freshness
  body: The strongest named proof is Germany. STARK announced a Bundeswehr framework for several thousand systems after qualification and then followed it with an April 2026 exercise showing Virtus, Minerva, and Quantum Systems’ Vector in a combined recce-strike workflow. That creates a meaningful chain from pilot-style testing to procurement intent, although qualification still gates full realization. The next-best proof is the unnamed NATO member contract, where STARK disclosed a rapid first tranche and an end-August 2026 delivery window, but withheld the customer’s identity and value. Ukraine is the hardest line to underwrite. STARK says a Ukrainian unit requested additional systems after positive battlefield use, yet DroneXL reported all four October 2025 live-fire attempts missed their targets. NATO’s REPMUS/Dynamic Messenger exercise adds credible third-party proof that STARK was present in a major experimentation venue, but that venue is better treated as an access and validation
    surface than as a paying-customer reference.
