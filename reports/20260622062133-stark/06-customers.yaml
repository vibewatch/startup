  - Gap
  rows:
  - - German Army / Bundeswehr land-forces modernization
    - 'Buyer: Bundeswehr; User: Brigade 45 and related land-force operators; Payer: German federal defence budget'
    - Long-range loitering strike and recce-strike integration
    - Framework for several thousand systems within two years after qualification; April 2026 live exercise
    - Highest-quality named customer proof and likely anchor account
    - Qualification milestones, contract value, and actual call-off cadence are undisclosed
  - - Unnamed NATO member armed forces
    - Buyer/User/Payer undisclosed beyond NATO-state military
    - Initial loitering munition procurement into a new European market
    - First tranche in February 2026; full delivery claimed by end-August 2026
    - Evidence of export demand outside Germany
    - Customer identity, value, and reference quality withheld
  - - Ukrainian armed forces / military units
    - 'User: Ukrainian units; Payer not disclosed; STARK also building local R&D and production footprint'
    - Battlefield feedback, integration, training, and rapid iteration near frontline conditions
    - 2,000 sqm hub planned for 200+ specialists; repeat-request claim from one unit
    - Operationally important because Ukraine is STARK’s fastest feedback loop
    - Public performance evidence is disputed and unit names are withheld
  - - NATO maritime / experimentation ecosystem
    - 'Users: NATO naval experimentation community, Portuguese-hosted REPMUS-DYMS participants; Payer: none disclosed'
    - Vanta maritime ISR, patrol, and multi-domain command-and-control testing
    - Serial missions during September 2025 exercise; 2,000+ participants and 260 systems in venue
    - Strong access and validation surface for future maritime customers
    - Not a disclosed revenue customer or contract
  - - Partner-mediated security operators
    - Prospective users via Six Robotics, INLEAP, and related operator networks
    - Recce-strike interoperability and laser-based counter-UAS
    - MoU / integration stage rather than customer order stage
    - Can widen market access beyond one German buyer
    - Partner proof currently outpaces named end-customer proof
  notes: Segmentation reflects publicly disclosed buyers, users, and access surfaces only; blank contract values and unnamed counterparties are evidence limits, not hidden estimates.
