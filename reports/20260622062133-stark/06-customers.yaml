company:
  name: Stark
chapter:
  number: 6
  title: Customers
  summary: 'STARK’s public customer proof is strongest in Germany: the company announced a February 2026 Bundeswehr framework for Virtus, linked it to Brigade 45, and then externally corroborated an April 2026 Bundeswehr recce-strike exercise with Quantum Systems. Beyond Germany, STARK disclosed an unnamed NATO-member export contract and claimed Ukrainian field-use traction, but those proofs are materially weaker because customer identity, contract value, qualification milestones, and battlefield outcomes remain opaque or contested. Overall, the customer story shows meaningful operator access and procurement momentum, but still high concentration around one named buyer and limited visibility into retention or diversified repeat demand.'
sections:
- id: customer-base-segmentation
  title: Customer base segmentation by buyer, user, geography, and mission set
  body: 'STARK’s public customer surface is concentrated in defence and security institutions rather than broad enterprise accounts. The clearest buyer is the Bundeswehr, where STARK announced a framework agreement for Virtus and explicitly linked the award to Brigade 45 in Lithuania. A second disclosed buyer exists, but STARK withholds the identity of the NATO member state. Ukraine appears in the record as a user environment and R&D hub rather than a fully transparent contracting counterparty: STARK says it has partnerships with Ukrainian armed forces and is building a 2,000 square metre local hub with support for more than 200 specialists, but the company does not publish unit names, volumes, or contract value. Sweden, Greece, and the UK sit one step earlier in the funnel as footprint or relationship signals. Sweden and Greece are office footprints; the UK is described as an armed-forces partnership and production-capacity location, but no named British customer is disclosed. Mission-wise,
    the public surface spans land strike, recce-strike integration, maritime experimentation, and counter-UAS partnerships rather than a single narrow use case.'
