    - id: UJ2
      label: Exercise or field-trial entry
      detail: STARK gains access through NATO experimentation, Bundeswehr trials, or frontline feedback loops in Ukraine.
      actor: Operator / test authority
      sentiment: positive
    - id: UJ3
      label: Integration proof
      detail: Products are linked with ISR, C2, and partner systems such as Quantum Vector, Six Robotics software, or INLEAP payloads.
      actor: Systems integration team
      sentiment: positive
    - id: UJ4
      label: Framework or initial order
      detail: Customer announces a framework, export order, or first-tranche shipment after successful trials.
      actor: Procurement authority
      sentiment: positive
    - id: UJ5
      label: Qualification and repeat use
      detail: Long-term durability depends on qualification, delivered systems, additional orders, and support cadence.
      actor: Procurement + operations
      sentiment: neutral
