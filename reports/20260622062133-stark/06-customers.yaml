  - FU004
- id: expansion-and-concentration-risk
  title: Expansion logic, partner leverage, and concentration risk
  body: 'STARK is expanding faster in footprint and partner disclosures than in named end-customer disclosures. Sweden, Greece, Ukraine, and the UK all appear in the 2026 record, but only Germany clearly appears as a named procurement customer. That creates concentration risk around the Bundeswehr and, specifically, around a framework whose economic conversion still depends on qualification. The partner set partially offsets that concentration by widening access: Six Robotics brings links to the Norwegian Armed Forces and FFI, while INLEAP opens a counter-UAS path to armed forces and critical infrastructure operators. NATO exercises likewise help STARK meet operators and validate integration. Still, partner proof is not the same as customer diversification. The imbalance between a reported $1.2 billion valuation and a still-thin set of public buyer references matters. It suggests that STARK may be winning strategic credibility inside Europe’s defence ecosystem, but investors should assume
    economic exposure remains concentrated until management discloses top-customer mix, export conversion, and qualification-to-call-off cadence.'
