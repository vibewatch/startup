  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Bundeswehr framework qualification milestones
    missingEvidence: Detailed qualification milestones, acceptance criteria, call-off mechanics, and revenue timing for the Bundeswehr framework.
    whyItMatters: The framework is the chapter’s strongest named customer proof, but its economic weight depends on what must happen after public approval.
    diligencePath: Request the signed framework summary, qualification schedule, and any milestone-based payment or acceptance conditions from management.
    relatedQuestionRefs:
    - QU004
  - type: conflicting-data
    severity: material
    topic: Ukraine field-performance dispute
    missingEvidence: Independent after-action reports, named-unit references, or objective trial data reconciling STARK’s positive Ukraine claim with negative trial reporting.
    whyItMatters: Ukraine is a major customer-signal surface for STARK, but the quality of that proof directly affects confidence in battlefield adoption and repeat purchase claims.
    diligencePath: Request anonymized user references, delivery logs, incident reports, and any third-party test results covering the same units or configurations.
    relatedQuestionRefs:
    - QU008
  - type: missing-source
    severity: material
    topic: UK customer identity gap
    missingEvidence: A named UK ministry, unit, contract, pilot, or procurement notice connecting STARK’s UK footprint to a real customer.
    whyItMatters: The UK appears repeatedly in STARK’s expansion story, but market-access language is weaker than a named customer reference.
    diligencePath: Request the UK entity name, contract stage, and referenceable programme owner, or find a public UK procurement or exercise record.
    relatedQuestionRefs:
    - QU009
  - type: enumeration-incomplete
    severity: material
    topic: Named customer proof table coverage
    missingEvidence: A fuller customer roster, customer-count disclosure, or additional named procurement references beyond Germany and one unnamed NATO state.
    whyItMatters: Without a fuller roster, concentration analysis can only use the thin public proof surface and may understate or overstate diversification.
    diligencePath: Request top-customer list, country mix, and anonymized roster by stage; add any public procurement or exercise documents naming STARK end users.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: Retention and commercial durability metrics
    missingEvidence: Renewal, reorder, churn, NRR, GRR, contract value, and customer-support SLA data for STARK accounts.
    whyItMatters: The chapter can show adoption surfaces, but it cannot underwrite recurring economics or customer stickiness without private operating data.
    diligencePath: Request cohort tables, order histories, contract terms, and top-customer revenue concentration from management.
    relatedQuestionRefs:
    - QU017
    - QU018
