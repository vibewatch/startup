- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Bundeswehr framework and Brigade 45 relevance
    - Germany is the only clearly named procurement customer in the public record
    - A pause in qualification or call-offs would heavily affect visible customer credibility
    - Request framework mechanics, acceptance criteria, and FY2026 call-off schedule
  - - Unnamed NATO export order
    - The second disclosed contract cannot be sized or reference-checked because the buyer is withheld
    - Export diversification may be real, but investors cannot weight it economically
    - Request country, ministry, order value, and support obligations under NDA
  - - Ukraine field-feedback loop
    - Ukraine is strategically valuable but its public performance record is disputed
    - Operational learnings may be strong, but commercial durability and reference quality are unclear
    - Request named unit references, delivery history, and incident-resolution record
  - - Partner-led market access via Six and INLEAP
    - Partner ecosystem can widen reach, but partner proof currently exceeds end-customer proof
    - Could accelerate channel access while masking weak direct-customer breadth
    - Request pipeline attribution by partner and conversion from pilot integrations to contracts
  - - 2026 footprint expansion to Sweden, Greece, and UK
    - Offices and hiring do not prove booked customers
    - Expansion narrative may outrun monetized customer conversion in the near term
    - Request country-by-country pipeline, signed users, and support staffing plan
  notes: Rows focus on concentration and conversion risk rather than on whether the relationships exist; most relationships appear real, but their economic weight is opaque.
