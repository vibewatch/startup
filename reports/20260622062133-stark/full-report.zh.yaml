      - number: '7.3'
        title: 供应链、制造与运营风险
        blocks:
          - type: paragraph
            body: >-
              STARK 公开披露中的供应链和制造风险画像明显不足，形成很大的尽调缺口。最重要的已知依赖是 TDW（Gesellschaft für Wehrtechnische Erprobung），它是 STARK
              唯一公开披露的战斗部集成伙伴。TDW 是一家专业德国弹药测试与生产实体；公开信息没有显示 STARK 拥有备用战斗部供应商，也没有显示 TDW 承诺排他合作安排或批量定价。任何 TDW
              产能限制、定价争议或合同终止，都会成为 Virtus 交付的单点故障。

              STARK 宣布了英国生产设施，这代表地域多元化，但也引入新的复杂性：EU EDIS 主权供应链合规、英国特定出口许可（独立于
              BAFA），以及英德生产设施共同用于机密军事硬件时的知识产权司法管辖问题。该设施当前产能、生产就绪度和成本结构均未披露。

              小型 UAS
              的物料清单（BoM）高度依赖先进微电子、电池和导航芯片；在全球组件市场现实下，这些供应链仍有部分中国来源。一家以主权欧洲国防能力为卖点的公司，如果制导或电力系统依赖中国来源芯片，就会产生政治和运营上敏感的战略依赖。STARK
              没有公开披露任何系统的 BoM、组件采购策略或备用供应商安排。

              从原型生产扩展到 Bundeswehr 框架合同下的 BAAINBw 交付规模，是性质完全不同的制造挑战，需要显著更大的设施、质量管理体系和供应链深度。STARK
              当前员工规模暗示仍是原型级运营；生产扩张需要资本投入、招聘和提前期，而这些尚未公开规划。
