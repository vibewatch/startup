      - number: '8.6'
        title: 建议、信心评估与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议：跟踪——不要按当前报道估值投资。现有证据基础不足以支持按报道的约 $1.2B 估值进行高确信投资。三个关键未知数——独立 BAAINBw 资格状态、任何形式的财务披露、以及 DroneXL
              负面测试记录的解决——必须先被厘清，才能在充分证据支持下提出价格敏感建议。这不是对 STARK 长期机会的负面判断：结构性国防顺风、先发 Bundeswehr
              关系和战略投资者基础都确实有吸引力。问题完全在于证据质量与价格之间不匹配。

              证据信心折扣很大。$1.2B 标记依赖单一未确认第三方媒体报道（Deutsche Startups，2026 年 2
              月），虽有第二家独立媒体（TechFundingNews）支持，但没有任何公司官方沟通确认。Bundeswehr 框架存在，但以资格为条件。尽管 STARK 自身已发布反驳，DroneXL
              负面测试记录仍未被独立证据推翻。在独角兽估值下，经审计财务、公开收入披露和合格产品证据全部缺失，形成异常严重的尽调缺口——即便与其他后期私有国防科技公司相比也是如此。

              再进入纪律：在资格确认后以 $600M–$800M 投后估值进入，最好同时伴随至少一个 Bundeswehr call-off 订单签发和首个确认交付里程碑，将显著降低结构性下行风险，同时保留对多头情景
              $2–5B 区间的有意义上行敞口。自 2025 年 8 月以来，估值基于合同公告（而非已交付收入）上调 140%，这是一个警示信号。坚持以 $1.2B 标记进入的投资者，应在承诺前要求完整尽调访问 BAAINBw
              资格记录、经审计财务、独立测试结果和完整 cap table。

              战略投资者基础（NIF、In-Q-Tel、Sequoia、Founders Fund）提供可信度底线，使大多数空头情景下不会出现零价值结果。STARK 不太可能完全失败：Bundeswehr
              关系、德国国防支出动能，以及财务利益相关方愿意为合格欧洲主权巡飞弹能力支付的战略溢价倍数，都能防止全损。不过，在资格得到独立确认前，相对当前 $1.2B 进入价的股权价值压缩，仍是实质且不可忽视的风险。
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
