      - number: '3.3'
        title: 美国锚定对手——Anduril、Shield AI、AeroVironment、Auterion
        blocks:
          - type: paragraph
            body: >-
              Anduril Industries（Costa Mesa, CA；2017 年成立）2025 年收入 US$2 billion，员工约 7,000 人。其 Lattice OS C2 平台最直接地与 STARK
              的 Minerva 竞争——Lattice 聚合异构平台传感器数据，支持自主杀伤链编排，并嵌入美国 DoD 多个项目，包括边境监视、空中优势和潜射无人机系统。Anduril 的
              Roadrunner（自主喷气动力飞行器）和 Barracuda（隐身打击无人机）与 Virtus 的打击角色部分重叠，但 Barracuda 的公开战斗部署数据有限。截至 2026 年中，Anduril
              主要聚焦美国 DoD，已确认的欧洲采购关系有限，这保留了 STARK 的主权窗口。Shield AI（San Diego, CA；2015 年成立）于 2026 年 3 月 Series G 融资中以
              US$12.7 billion 投后估值融得 US$1.5 billion，员工约 1,000 人。其 Hivemind AI 飞行员自主栈驱动无人机和有人飞机在 GPS 与通信受损环境中运行；Nova
              是美国作战史上第一架部署的 AI 驱动无人机。Shield AI 目前在欧洲渗透极低。AeroVironment（Arlington, VA；NASDAQ: AVAV；FY2025 收入 US$820.6
              million，3,750 名员工）通过 Switchblade 300 和 600 成为全球最经战场验证的游荡弹药供应商，产品在阿富汗、伊拉克和乌克兰部署超过 15 年，在 55 多个国家累计部署超过
              50,000 次。乌克兰 EW 削弱 Switchblade 300 效能、随后公司用软件升级提升抗干扰能力，是与 STARK 2025 年 10 月试验争议最可比的负面可靠性周期。AeroVironment 于
              2025 年 5 月完成 US$4.1 billion 收购 BlueHalo，加入定向能、太空通信和反 UAS 能力。Auterion（瑞士 / 美国）被美国政府提名为未来无人机项目标准；其
              AuterionOS 开放平台和 Long Range One Way Attack 能力（射程最高 1,000 miles）与 STARK 的软件和打击层竞争；关键是，2024 年 Helsing
              关系破裂后，Rheinmetall 选择 Auterion 作为无人机自主伙伴。
