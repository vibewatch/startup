  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >-
              STARK 位于欧洲防务买方正在同时加速的四个采购品类交叉处：游荡弹药、无人水面艇（USV）、AI
              指挥控制软件和自主地面系统。因此，竞争集合不是单层整体，而是分层结构。第一层是大型西方和以色列主承包商——AeroVironment、IAI、Elbit、Rafael、Rheinmetall 和
              Saab——它们拥有几十年资质历史、双边政府信任和成熟物流网络，但行动慢，单位定价带有高端利润率。第二层是风险投资支持的防务科技初创公司——Helsing、Anduril、Shield AI 和
              Auterion——资本充足、软件优先，并且越来越多赢得平台合同；但多数锚定美国，或像 Helsing 一样在重叠的德国和欧洲采购渠道中竞争。第三层是欧洲同业初创公司——Tekever、ARX Robotics
              和 Quantum Systems——分别覆盖相邻品类（固定翼海上 ISR、无人地面车辆和多域 ISR），既是潜在合作对象，也是新生对手。现状替代品——常规火炮、反坦克制导导弹、有人 ISR
              飞机和岸基巡逻艇——仍是采购官员试图主动转移的基线，但沉没成本和资质偏好会放慢迁移速度。在本报告审视的全部竞争者中，只有 STARK 把空中打击、海上 USV 和 AI C2 软件层放在同一个欧洲主权公司实体里。
