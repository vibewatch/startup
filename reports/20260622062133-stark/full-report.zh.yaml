        - 火炮、空袭或有人航空；人员和平台风险高；传感器到射手链路长
        - Virtus OWE-V 通过 Minerva 执行：操作员定义目标，系统导航，以 250 km/h 俯冲，搭载 LS110 弹头
        - 130 km+ 航程；800 mm HHA 侵彻；任意地形 eVTOL 发射；<10 min 部署
        - 2025 年 10 月试验失败仍未解决；无独立 CEP 数据；目标锁定依赖 ISR 层
      - - 下车部队 ISR 和短程战术打击
        - 手持 ISR 无人机 + 迫击炮或 ATGM；系统分离，训练负担和后勤开销高
        - Gambit OWE-Q 双用途：同一平台可做 ISR（EO/IR，40 km）或打击（弹头，25 km）；<5 min 部署
        - 单套 6 kg 便携系统；中止后可回收；EO/IR 支持昼夜；高 EW 环境可选光纤
        - 射程短；无确认战斗记录；打击载荷 <2 kg，限制对硬目标杀伤力
      - - 对防空系统或点目标实施饱和攻击
        - MLRS 或火炮齐射；精度有限；成本高；需要后勤尾巴
        - Cascade 管式发射器：多效应器同步发射；AI 末端制导；<20 kg/系统；每车 >10
        - 单车实现高性价比饱和；无 GNSS 末端制导；可 OTA 升级
        - 未发布交战结果；OTA 更新安全公开未说明；无独立精度数据
      - - 海上区域拒止和持久 ISR
        - 有人巡逻艇；船员风险高；运营成本高；持续性有限
        - Vanta USV（910 nm 航程、45+ 节、200 kg 载荷）配 Minerva C2；符合 IMO COLREG 的导航
        - 无船员风险的持久巡逻；可规模化（多艇同时运行）；NATO DYNAMIC MESSENGER 已验证
        - 无确认作战合同；C-UAS 集成（INLEAP）处于 MoU 阶段；无独立性能审计
      - - 多域侦察到打击协同
        - ISR 和打击系统分离，由人工中介交接；传感器到射手链路慢
        - Minerva C2 + ISR 无人机（Quantum Vector 或 Six Robotics）+ Virtus/Cascade/Gambit；自动化优先级排序
        - 2026 年 4 月 Bundeswehr 演习：从发现到交战缩短到数分钟
        - 依赖合作伙伴 ISR 层（Quantum、Six Robotics），非 STARK 自供；未发布回路时间 KPI
