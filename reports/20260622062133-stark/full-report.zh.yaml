      - number: '5.2'
        title: Virtus、Cascade 与 Gambit——硬件架构与武器集成
        blocks:
          - type: paragraph
            body: >-
              Virtus 是一款软件定义的一次性效应器，采用电动垂直起降（eVTOL）技术，可在任何地形起飞，不需要弹射器、发射管或发射垫。已发布规格显示，续航最长 90 分钟，射程 130 km 以上，巡航速度 120
              km/h，攻击速度 250 km/h，模块化载荷最高 5 kg，作业高度最高 2,000 m。翼展和高度均为 1.8 m；部署时间低于 10 分钟。穿透能力标称为 800 mm 高硬度装甲，通过 TDW LION
              STRIKE 110 弹头实现；STARK 与 TDW 于 2025 年 12 月共同确认，该弹头在德国完成首次热打击。LS110 设计支持串联成形装药和破片套筒，TDW
              称其穿透表现高于平均水平。模块化系统设计意味着 Virtus 可以在不同软件版本之间修改，以适配作战需求；STARK 还特别描述了一条具 EW
              韧性的数据链，使用多层通信，并以视觉里程计、卫星图像和已知地标定位组合成导航系统，服务 GNSS 受拒环境。

              Cascade 是管射效应器，公开规格为射程 100 km、巡航 100 km/h、俯冲 220 km/h、续航 60 分钟；发射器和效应器合计重量低于 20 kg，单车可搭载超过 10 套。平台使用 AI
              和传感器融合，实现无 GNSS 导航、物体识别和末端制导。软件定义架构支持 OTA 更新。模块化弹头可容纳最高 4.5 kg 载荷。Gambit 是 6 kg 折叠四旋翼，打击射程低于 25 km，ISR
              射程低于 40 km；部署时间低于 5 分钟。它搭载 EO/IR 传感器套件，支持昼夜作业，配备符合 NATO STANAG 的引信，并可选配光纤制导链路，用于高 EW 环境。如果任务中止，Gambit
              会返回发射点，使其成为可回收资产——相比一次性效应器，这是显著后勤优势。
