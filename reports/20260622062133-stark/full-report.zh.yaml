        - Deutsche Startups（2026 年 2 月 16 日）和 TechFundingNews（2026 年 2 月 13 日）均报道 $1.2B；没有官方 STARK 声明、新闻稿或备案确认该估值
        - STARK 或 Founders Fund 官方确认，并提供 cap table 文件；投资在公司记录中正式登记
      - - 反论点——产品资质受到 DroneXL 四次打击负面记录质疑
        - DroneXL（2025 年 10 月）——Virtus 在 2025 年 10 月军事试验中四次打击测试全部失败；STARK 反驳称测试具备研发性质；双方说法均无独立佐证
        - BAAINBw 正式资质证书（MPCV 或同等文件）；2025 年 10 月试验的独立第三方测试主办方记录
      - - 反论点——独角兽估值下公开财务披露为零，结构上异常
        - 截至 2026 年 6 月，Bundesanzeiger 未显示 SKD SE 提交年度账目；公开来源未披露收入、利润率、烧钱速度或资本充足性
