  - id: FE001
    title: 产品架构图
    type: stack
    layout: standard
    summary: STARK 的五个产品按分层技术栈组织：底层是硬件平台，向上依次是导航与 EW 韧性层、战斗部集成、通信，顶层是 Minerva C2；集成层连接外部系统。
    data:
      layers:
        - id: hardware
          label: 硬件平台
          detail: >-
            Virtus OWE-V（固定翼，130 km+ 航程，5 kg 载荷）、Cascade（筒射，100 km，4.5 kg）、Gambit OWE-Q（四旋翼，25 km 打击 / 40 km ISR，6
            kg）、Vanta USV（910 nm，45+ 节，200 kg 载荷）。所有平台均为软件定义，并在 Germany、UK 和 Ukraine 制造。
          tone: neutral
        - id: navigation
          label: 导航与制导
          detail: >-
            GNSS 主模式：所有平台；GNSS 拒止模式：Virtus 使用视觉里程计 + 卫星影像定位；Gambit 使用 EO/IR 视觉导航；Cascade 使用 AI 传感器融合。三款打击平台均声称具备无 GNSS
            末段制导能力。
          tone: neutral
        - id: ew-resilience
          label: EW 韧性与通信
          detail: 多层数据链（具体技术栈未披露）为 Virtus 和 Cascade 提供低连接和 RF 拒止环境下的韧性。Gambit 在最高 EW 场景下增加可选光纤制导。Vanta 使用 IGNSS、视觉和罗盘导航。
          tone: warning
        - id: warhead-payload
          label: 战斗部与载荷集成
          detail: >-
            Virtus：TDW LION STRIKE 110（LS110）——串联破甲 + 破片，800 mm HHA 穿深，德国制造。Cascade：最高 4.5 kg 模块化战斗部。Gambit：最高 2 kg
            战斗部载荷或 EO/IR 传感器。Vanta：200 kg 载荷舱，支持 INLEAP FASTLIGHT SHIELD 激光 C-UAS（MoU 阶段）。
          tone: neutral
        - id: minerva-c2
          label: Minerva C2 软件（MOSA）
          detail: 指挥与武器交战系统（CWES）、模块化开放系统架构（MOSA）、多域（陆 / 空 / 海）、蜂群和自动目标优先级排序、人在回路交战授权、完整决策日志。软件认证正在与国家主管机关推进。
          tone: warning
        - id: integration
          label: 集成与互操作层
          detail: >-
            标准化接口和开放协议支持第三方集成（Quantum Systems Vector ISR、Six Robotics 自主软件、现有 BMS）。可与 NATO Battle Management Systems
            互操作。Six Robotics MoU（2026 年 3 月）和 Quantum 演习（2026 年 4 月）是两个已确认集成案例。
          tone: neutral
    approximationNotes: >-
      技术栈层级从公开产品页和新闻稿推断。技术栈细节（具体 EW 协议、OTA 更新架构、MOSA 组件清单）未公开披露。战斗部和 C-UAS 载荷集成成熟度不一——Virtus/TDW 战斗部已确认；INLEAP C-UAS 处于
      MoU 阶段。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE008
      - CE011
      - CE016
      - CE017
      - CE018
      - CE020
  - id: FE002
    title: 客户工作流——侦察到打击作业流程
    type: flow
    layout: standard
    summary: STARK 的多域平台在侦察到打击任务中如何使用：从 ISR 采集，经 Minerva 目标优先级排序，到效应器打击；该流程展示 2026 年 4 月 Bundeswehr 演习试图压缩的传感器到射手闭环。
    data:
      nodes:
        - id: isr-collection
          label: ISR 侦察
          detail: ISR 无人机（Quantum Systems Vector，或 ISR 模式下的 Gambit）采集目标影像和位置数据。长航程任务中的主要 ISR 层并非 STARK 自产——这是合作伙伴依赖。
          tone: warning
        - id: data-uplink
          label: 到 Minerva 的数据链
          detail: 侦察数据通过具备 EW 韧性的数据链传输至 Minerva 地面控制站。按 2026 年 4 月演习主张，发现到打击分配之间的闭环时间缩短到“数分钟”。
          tone: neutral
        - id: target-prioritisation
          label: Minerva：自动目标优先级排序
          detail: Minerva AI 按优先级对目标排序；操作员复核，并批准或修改排序。人在回路设计意味着最终交战决策由操作员掌握，而不是算法。
          tone: neutral
        - id: effector-tasking
          label: Minerva：效应器选择与蜂群
          detail: 操作员定义意图；Minerva 将意图转化为群体行为，并把单个效应器（Virtus、Cascade 或 Gambit）分配给目标。蜂群协调支持多个效应器同时对目标集形成饱和。
          tone: neutral
        - id: strike-execution
          label: 打击执行
          detail: 效应器使用 GNSS 或 GNSS 拒止模式导航；末段制导依靠视觉里程计、传感器融合或光纤链路。Virtus 以 250 km/h 俯冲；Cascade 为 220 km/h；Gambit 为 120 km/h。
          tone: neutral
        - id: bda
          label: 战损评估
          detail: 由幸存 ISR 资产或剩余传感器提供打击后反馈。Minerva 记录完整决策审计轨迹，供认证审查。BDA 闭环启动下一轮任务周期。
          tone: neutral
        - id: abort-return
          label: 中止 / 安全返航（Gambit）
          detail: 如果任务在末段前中止，Gambit 会返回发射点，作为可回收资产。Virtus 和 Cascade 是单向效应器，不具备中止并回收能力。
          tone: neutral
      edges:
        - from: isr-collection
          to: data-uplink
        - from: data-uplink
          to: target-prioritisation
        - from: target-prioritisation
          to: effector-tasking
        - from: effector-tasking
          to: strike-execution
        - from: strike-execution
          to: bda
        - from: bda
          to: isr-collection
        - from: target-prioritisation
          to: abort-return
    approximationNotes: 流程从 STARK 产品描述、2026 年 4 月 Bundeswehr 演习新闻稿和 Six Robotics 合作公告推断。闭环时间（“数分钟”）是公司基于一次演习的主张；没有独立 KPI 或杀伤链时序数据发布。
    claimRefs:
      - CE016
      - CE018
      - CE019
      - CE022
      - CE025
      - CE033
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: standard
    summary: STARK 产品平台依靠的主要外部依赖，展示战斗部供应、ISR 伙伴、影像提供方、资格认证流程和制造地域如何在交付链中形成集中风险。
    data:
      nodes:
        - id: tdw-warhead
          label: TDW 战斗部供应（LION STRIKE 110）
          detail: Virtus 唯一已确认的战斗部伙伴。德国制造商；串联破甲；对满足 Bundeswehr 资格认证至关重要。如果 TDW 产能受限，就会出现供应集中风险。
          tone: warning
        - id: isr-partners
          label: ISR 无人机伙伴（Quantum Systems / Six Robotics）
          detail: >-
            STARK 不生产自己的长航程 ISR 平台。杀伤链依赖 Quantum Systems Vector（Bundeswehr 演习）和 Six Robotics
            软件（MoU）。二者都处于合作伙伴阶段，尚未以合同方式嵌入 Bundeswehr 交付物。
          tone: warning
        - id: imagery-gnss
          label: 卫星影像与 GNSS 基础设施
          detail: Virtus 的 GNSS 拒止导航依赖预加载卫星影像和地标数据库。影像和定位精度是任务关键输入，但不由 STARK 控制。
          tone: warning
        - id: bundeswehr-qual
          label: Bundeswehr 资格认证流程
          detail: Bundeswehr 资格认证里程碑是 2026 年 2 月框架下 call-off 订单的关口。通过之前，框架不会产生收入。时间表、标准和主管机构均未公开披露。
          tone: warning
        - id: national-accreditation
          label: 国家主管机关软件认证（Minerva CWES）
          detail: Minerva 的武器交战功能在 Bundeswehr 场景下投入作战部署前，需要国家主管机关认证。认证范围和时间线未公开披露。
          tone: warning
        - id: production-sites
          label: 多地制造（Germany、UK、Ukraine）
          detail: 横跨三个地区生产能提供韧性，但也带来出口合规、物流和跨厂质量协调风险。Ukraine 站点（2,000 sqm、200+ 名专家）位于活跃冲突区。
          tone: warning
      edges:
        - from: tdw-warhead
          to: bundeswehr-qual
        - from: isr-partners
          to: bundeswehr-qual
        - from: imagery-gnss
          to: bundeswehr-qual
        - from: national-accreditation
          to: bundeswehr-qual
        - from: production-sites
          to: bundeswehr-qual
        - from: bundeswehr-qual
          to: isr-partners
    approximationNotes: 依赖关系从产品描述、合作公告和 Bundeswehr 框架条款推断。STARK 与 TDW、ISR 伙伴、国家主管机关之间的实际合同结构未公开披露。该 DAG 简化了更复杂的相互依赖网络。
    claimRefs:
