  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              STARK 处在德国国家安全法、欧盟协调出口管制，以及自主武器系统国际人道法（IHL）演进的交叉点。凡涉及致命弹药的商业交易，都会被这组三向监管结构摩擦。

              德国核心出口管制制度由 Außenwirtschaftsgesetz（AWG）和 Außenwirtschaftsverordnung（AWV）构成，要求所有 ML4 类巡飞弹都必须取得 Bundesamt
              für Wirtschaft und Ausfuhrkontrolle（BAFA）的单项出口授权。每一份面向新国家的出口合同都会触发新的 BAFA
              审查，结果可能因联合政府政治、议会审视或接收国人权记录变化而延迟。德国的 Politische Grundsätze für Rüstungsexporte 历来导致对非欧盟、非 NATO
              伙伴销售的拒绝率显著，这给 STARK 所声称的乌克兰和未具名 NATO 成员销售管线带来真实不确定性。国内 Bundeswehr 交付同样需要 BAFA 对生产批次发牌，尽管国内分类系统的批准轨迹更可预测。

              在国际层面，United Nations Group of Governmental Experts（GGE）自 2014 年起在 Convention on Certain Conventional
              Weapons（CCW）框架下讨论致命自主武器系统，但尚未形成有约束力规则。这一僵局给 STARK 带来双重风险：若有约束力规则出台，可能限制 Virtus 和 Cascade 的自主功能；若规则不出台，HRW
              和 ICRC 支持的自愿暂停也会在没有正式禁令的情况下带来声誉和出口市场摩擦。ICRC 已发布立场明确认为，缺乏有意义人类控制却能选择并攻击目标的自主系统，与 IHL 不相容。STARK 对 AI
              赋能目标功能的营销，使公司正落在这一批评范围内。HRW 的 Stop Killer Robots 运动自 2012 年活跃至今，已将范围扩展到 AI 定向巡飞弹，并被欧洲 NGO 在议会提交材料中引用。

              NATO 的 Principles of Autonomy in Weapons Systems 要求包括德国在内的盟国成员，对致命决策保持有意义的人类控制，这又增加了一层合规要求。STARK 的 EU EDIS
              定位和潜在 European Defence Fund 资助资格，也要求证明主权欧盟供应链合规；公司的英国生产设施让这一点更复杂。英国境内生产关键组件，可能在英国脱欧后触发 EDIS 资格问题。
