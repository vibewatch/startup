      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              在所有影响投资承销的指标上，STARK 的公开财务证据质量都很低。收入质量无法评估，因为没有任何形式的收入披露——没有 ARR、没有 backlog value、没有已交付单位、没有
              ASP，也没有毛利率。资本强度方向上清楚（高 R&D、预购弹头、多地点生产），但无法量化。报道中的 $1.2 billion 独角兽估值未经公司确认，因此无法与任何利润或收入倍数对齐。Bundeswehr
              框架协议是最具体的财务信号，但合同金额未披露，无法锚定收入模型或估值计算。

              负面证据进一步增加不确定性。DroneXL 2025 年 10 月报道称，Virtus 在军事试验中四次打击全部失败；这与 Bundeswehr
              资质条件直接相关：如果系统无法通过资质认证，框架协议不会转化为订单，合同积压也会消失。STARK 自身反驳声明和后续 Bundeswehr 演习证据（2026 年 4
              月）支持双方仍在继续接触，但资质里程碑尚未公开确认已清除。关键尽调阻塞项包括：没有经审计账目、轮次规模和 cap table 未确认、没有 backlog value 或订单簿披露、任何产品都没有毛利率数据，以及
              Bundeswehr 合同的资质状态未确认。对 STARK 做任何财务承销，都需要访问管理账、董事会批准的 cap table、已签署订单簿摘要和资质里程碑计划；这些都需要 NDA 保护的数据室访问。
