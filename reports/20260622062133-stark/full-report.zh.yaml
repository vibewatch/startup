      - number: '4.2'
        title: 资本形成与投资人基础
        blocks:
          - type: paragraph
            body: >-
              STARK 的资本形成历史部分不透明，因为公司从未正式声明累计融资额、轮次规模或投后估值。公开可得的信息来自第三方报道和投资人信号。公司 2025 年 10 月 CEO 任命公告确认，Sequoia
              Capital 通过两轮融资领投公司，投资人阵容还包括 NATO Innovation Fund、Project A 和 In-Q-Tel。这确认了一个高质量、跨地域投资人基础：商业
              VC（Sequoia）、欧洲防务聚焦 VC（Project A）、具 NATO 授权的基金（NIF），以及 CIA 的战略风险投资机构（In-Q-Tel）。

              第三方媒体报道补充了公司尚未确认的细节。DroneXL 2025 年 10 月报道称，两轮融资累计达到 $100 million，其中 Sequoia 2025 年 8 月一轮为 $62 million，公司估值
              $500 million，并点名 8VC 为额外参与方。Deutsche Startups 和 Tech Funding News 均在 2026 年 2 月报道称，Founders Fund（Peter
              Thiel）在新一轮中投资了两位数百万欧元金额，把估值推至约 $1.2 billion。没有任何 STARK 官方声明、备案或投资人新闻稿确认 Founders Fund 投资或 $1.2 billion
              估值。SKD SE 在 Amtsgericht Charlottenburg 的商业登记（HRB 260878 B）显示，公司有五名董事会成员、三名 Prokura
              持有人和五个已知活跃子公司持股，但不包含公开财务数据。Bundesanzeiger 搜索没有返回 SKD SE 公开提交的年度账目；这与一家 2024 年注册、尚未完成首个需要公开披露完整财年的公司相一致。
