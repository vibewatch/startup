      - number: '8.2'
        title: 投资逻辑与反逻辑
        blocks:
          - type: paragraph
            body: >-
              STARK 的多头投资逻辑，建立在结构性市场、产品和投资者信号的汇合上；对于现阶段欧洲硬件初创，这种组合并不常见。STARK 拥有唯一公开宣布的 Bundeswehr 欧洲主权 AI 巡飞弹框架合同。考虑到
              BAAINBw 的资格周期，以及当前 Zeitenwende 环境下德国制造国防能力的政治偏好，这一位置确实难以复制。德国 2025 年国防采购在 103 个重大项目中超过 €83
              billion，创造了后冷战欧洲史无前例的结构性需求环境。乌克兰作战部署即便未被完全独立验证，也为 STARK
              提供了概念验证差异化，使其区别于没有实弹参考的桌面设计型欧洲国防初创。战略投资者基础（In-Q-Tel、NIF）提供真正的情报界和 NATO 主权背书。上述因素叠加，足以支持其相对早期通用科技公司的实质溢价。

              反逻辑则锚定同一批要素，只是放在风险调整视角下审视。报道中的 $1.2B 估值依赖单一未确认第三方媒体报道；STARK 没有发布官方声明、新闻稿或 Bundesanzeiger 备案来确认估值或 Founders
              Fund 投资条款。Bundeswehr 框架明确以资格为条件；DroneXL 的四次打击负面报道——称 Virtus 在 2025 年 10 月四次打击测试全部失败——尚未被独立反驳。STARK
              自身反驳（STARK Statement）否认这些测试属于正式资格测试，但没有提供独立佐证。公开收入、经审计账目或烧钱速度披露全部缺失，使公开数据下的财务承保不可能。与最接近的欧洲同业 Helsing
              相比，后者只有在取得多个 Bundeswehr 和 FCAS 合同、HX-2 与 HF-1 数千套在乌克兰经受战斗验证、累计融资 €1.37B 之后，才达到 €12B 估值；其证据基础明显强于 STARK 在
              $1.2B 标记时拥有的基础。客户集中风险（本质上几乎 100% 依赖 Bundeswehr 框架转化）是额外下行放大器，而当前报道价格并未充分折价这一点。
