      - number: '3.4'
        title: 主承包商巨头——Rheinmetall、Saab、Elbit、IAI、Rafael
        blocks:
          - type: paragraph
            body: >-
              大型防务主承包商是一股结构性竞争力量，而非敏捷对手：它们掌握资质框架、采购关系和多年平台合同，足以挤出或约束初创公司的胜利。Rheinmetall（杜塞尔多夫；2024 年收入 €9.75
              billion，40,000 名员工）既是 STARK 本土市场的既有巨头，也可能成为供应链伙伴（LION STRIKE 110/TDW 弹头集成）。但 Rheinmetall 在无人机自主上选择
              Auterion 而非 Helsing——也隐含地没有选择 STARK——说明它偏好开放平台，而不是初创公司品牌的专有栈。Saab（瑞典；2025 年收入 SEK 79.1 billion，26,100
              名员工）是 Helsing 的战略投资人（2024 年 7 月 €450 million 轮），并在 2023 年收购英国自主蜂群公司 Blue Bear Research Systems。Elbit
              Systems（以色列；NASDAQ；2024 年收入 US$6.83 billion，18,407 名员工）在 NATO 成员国运营 Hermes 450/900 和 Skylark ISR 平台，但 NATO
              Support and Procurement Agency 自 2025 年 5 月起因一项持续腐败调查禁止 Elbit 获得武器合同——这为 STARK 在此前由 Elbit 服务的 NATO
              渠道中创造了实质近期开口。IAI（以色列；国有；2022 年收入 US$4.97 billion；2026 年 1 月订单积压 US$26 billion）用 Harop 和 Harpy
              开创现代游荡弹药，并占据主导出口地位；Harop 估计单价超过 US$100,000，为价格更低的 STARK Virtus 创造了基于成本的进入机会。Rafael（以色列；2024 年收入 US$4.85
              billion，10,000 名员工）在 2025 年末与德国签署 US$3.5 billion Arrow 3 防空出口协议，说明以色列主承包商在 Bundeswehr 商业渠道中仍有活跃且深的准入，STARK
              要与它们并肩竞争。
