      - number: '7.6'
        title: 声誉、政治与执行风险
        blocks:
          - type: paragraph
            body: >-
              作为欧洲国防初创，STARK 的声誉位置异常暴露。已确认的 Founders Fund（Peter Thiel）投资者关联，在德国引发了足够大的政治争议，以至于公司在 2026 年 2
              月发布正式公开声明，明确否认与「far-right」有关的指控。该事件暴露了一种结构性政治风险：在德国国防市场语境下，议会批准、政府补助和联合政府敏感性都会影响采购结果，投资者观感可以直接影响业务可行性。未来任何与
              Thiel 相关的政治、法律或媒体争议，都可能再次通过关联污染 STARK。

              HRW 和 ICRC 等人权组织持续推动反对 AI 赋能巡飞弹和自主武器的运动，给 STARK 带来声誉风险。欧洲机构投资者（养老基金、保险资金池）常有 ESG 授权，限制投资自主致命系统。若未来融资需求超出当前
              VC 参与范围，这可能限制 STARK 大规模进入欧洲资本池。

              执行层面，STARK 管理团队结合了风险投资经验（Horstmann 来自 Project A）、国防销售经验（Helmsen 来自 Rheinmetall）和规模化运营经验（Rost 来自
              Zalando），但公开高管团队中没有成员拥有高产量武器系统生产运营记录。13
              个月从创立到前线的说法，对市场定位很有吸引力，却也是双刃剑：它可能说明公司在有利条件下表现合格，也可能说明公司走了资格捷径，而这些捷径会在正式 BAAINBw 评估中暴露。资本更雄厚的
              incumbents（Rheinmetall、AeroVironment、Elbit）和资金充足的同业（Helsing、ARX Robotics）带来竞争，意味着 STARK
              不能指望在执行放慢时仍有受保护的市场窗口。
