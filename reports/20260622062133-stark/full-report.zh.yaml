      - number: '7.4'
        title: 客户集中与采购风险
        blocks:
          - type: paragraph
            body: >-
              STARK 公开记录中的客户基础事实上集中在一个具名主权买方：德国 Bundeswehr。2026 年 2 月 Virtus 框架合同是框架协议，不是列明数量、单价和交付日期的约束性生产合同；收入兑现完全取决于
              call-off 订单，而这些订单需要 BAAINBw 另行拨款和采购动作。

              德国采购法要求超过 €25M 的国防项目取得 Bundestag 额外拨款批准，也就是说，即使 Virtus
              系统完全通过资格，也无法在没有议会预算投票的情况下进入量产交付。Haushaltsausschuss（预算委员会）历来会给较新供应商的国防采购项目附加条件并造成延迟。即使是成熟系统和成熟供应商，德国无人系统采购周期也曾在框架协议和首次量产交付之间经历
              12–24 个月。

              STARK 还声称拥有一个未具名 NATO 成员国出口合同和乌克兰外场使用，但两项说法均未通过合同规模、单位数量或交付排期独立验证。如果 Bundeswehr 框架 call-off 延迟或重新竞争，STARK
              将没有已确认的替代性大规模收入来源。因此，Bundeswehr 层面的单一买方集中不只是收入风险；一旦采购长时间暂停，还可能成为生存风险。

              STARK 的 VC 融资模式放大了这一风险：不同于已有现金流的主承包商，STARK 依赖持续外部资本，来跨过框架合同与首批量产收入之间的缺口。如果首批交付前投资者耐心耗尽或 runway
              用尽，采购延迟会直接叠加成融资风险。
