      - number: '5.4'
        title: 测试历程、战略合作与集成验证
        blocks:
          - type: paragraph
            body: >-
              STARK 已公开确认的测试里程碑包括：2025 年 9 月在葡萄牙举行的 NATO DYNAMIC MESSENGER 演习，Vanta-4 和 Vanta-6 在该演习中亮相，并与 NATO
              能力一起接受测试；2025 年 12 月，搭载在 Virtus 上的 TDW LS110 战斗部完成首次实弹打击；2026 年 4 月，Bundeswehr 演习展示了 Virtus-Minerva-Vector
              的侦察到打击链路。上述节点是有意义的技术验证步骤，尤其是战斗部集成。STARK 将其描述为德国制造弹药可规模化生产的证据。

              2026 年上半年，合作进展密集。Six Robotics MoU（2026 年 3 月）引入了一家与 FFI 有联系的挪威公司的自主与蜂群软件，使跨国联合侦察打击任务成为可能。INLEAP Photonics
              合作（2026 年 4 月，Hannover Messe）把 FASTLIGHT SHIELD 激光 C-UAS 集成进 Vanta USV，拓宽了该平台的反无人机防御能力。两项合作仍处于 MoU
              或早期集成阶段，尚未产生独立验证的外场结果。反向证据同样重要：DroneXL 2025 年 10 月文章援引未具名 Financial Times 消息源称，Virtus
              在英德武装力量试验中的四次打击全部失败，并把这描述为一家估值 $500 million 公司的灾难性失败。STARK 随后发布防御性声明，称一个乌克兰军事单位在看到「high efficiency and
              combat effectiveness」后要求追加 Virtus 系统，并指向上述试验之后的系统改进。两种说法都无法从公开来源独立核验。
