        - <$600M（下轮重定价；较 $1.2B 入场价出现 50%+ 按市值计价损失；只能以折价战略收购退出）
        - DroneXL 负面报告被证明有先见之明；德国防务采购领导层更替；Rhinemetall 或 Helsing 以低于入场价收购 STARK 资产
        - 低-中；考虑到 DroneXL 记录未解决，不能排除；主权投资人基础和 Bundeswehr 关系提供底线，避免接近归零场景
