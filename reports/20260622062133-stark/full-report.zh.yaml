      - number: '7.2'
        title: 产品资格、可靠性与技术风险
        blocks:
          - type: paragraph
            body: >-
              STARK 的核心技术风险，也是公开争议最大的风险，在于 Virtus 是否已经达到，或能否达到 BAAINBw 采购规则下 Bundeswehr 全面量产交付所需的资格标准。

              2025 年 10 月，DroneXL 发布报道称，STARK 在独立评估下进行的四次实弹打击测试全部失败，没有任何一次成功把战斗部送达目标并引爆。同月稍早，DroneXL 另一篇文章也提出了相关担忧。STARK
              的正式回应——「STARK Statement」——反驳了这一表述，称测试是开发性测试而非正式资格测试，并称没有系统发生失控引爆。两种说法无法调和；若无法取得独立测试赞助方记录，就无法从公开来源确认 Virtus
              的真实资格状态。截至报告日期，尽管 2026 年 2 月框架合同已经宣布，Virtus 仍没有公开记录显示获得 BAAINBw 正式资格证书（MPCV）。

              TDW-STARK 实弹打击演示确认了战斗部在目标上实爆，但这是制造商伙伴共同参与的演示，不是独立 BAAINBw
              资格测试。在德国，战斗部集成和实弹打击资格通常是多机构流程，从首次实弹演示到正式安全与系统资格签署，通常需要 12–24 个月。

              除资格争议外，STARK 没有公开回应小型 UAS 在对抗环境中运行的几类已知技术脆弱性：GPS 拒止和电子对抗（ECM）韧性、数据链干扰，以及部署中的打击弹药因 OTA
              固件更新能力带来的网络攻击面。任何能够攻破 OTA 更新通道的对手，原则上都可能削弱可靠性、操纵末段制导，或制造不安全待击状态。STARK
              的公司行为准则和公开披露没有讨论针对这些攻击面的渗透测试或第三方安全审计。
