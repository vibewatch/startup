      - number: '2.2'
        title: 买方分层、付款流程与采购动态
        blocks:
          - type: paragraph
            body: >-
              防务采购会把买方、用户和付款方拆开，运行方式不同于商业市场。在 STARK
              的主要细分市场中，付款方是国家国防部或盟国采购机构，用户是前线旅级单位或海军单位，买方决策则是正式采办流程，涉及能力需求办公室、采购局、预算委员会批准和资质测试。在德国，大规模武器采购必须经 Bundestag
              预算委员会批准，Bundeswehr Procurement Office 负责技术资质和框架合同机制。2026 年 2 月，Virtus
              框架协议在大量联合测试后获批，说明当政治紧迫性与能力缺口对齐时，德国“买入—测试—迭代”的做法可以压缩时间线。德国之外，波罗的海、北欧和东欧侧翼的 NATO
              成员国正在形成一个新兴采购集群，寻求快速部署游荡弹药。爱沙尼亚为期七年、金额 EUR 400 million 的框架，以及 STARK 于 2026 年 2 月宣布的未具名第二个 NATO
              成员国合同，表明买方地图已经扩张。海上买方也有同样分工：NATO 海上司令部和盟国海军是付款方和采办权威，水面行动群和巡逻单位才是操作方。STARK 的 Vanta 系列定位于 NATO 海上区域覆盖；约 500
              万平方公里欧洲水域正在挤压现有海军能力。
