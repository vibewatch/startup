      - number: '2.4'
        title: 增长驱动、采用约束与反证
        blocks:
          - type: paragraph
            body: >-
              STARK 所在市场的需求逻辑由六股相互咬合的力量驱动。第一，欧洲再武装：SIPRI 记录 2024 年全球军费增长 9.4%，为 36 年来最大升幅，主要由应对俄乌战争的欧洲 NATO
              成员拉动。第二，乌克兰战斗验证：游荡弹药的战场使用证明，可负担的大规模生产和蜂群能够以常规导弹一小部分成本压饱和对手防御，进而压缩 NATO 国家采购时间线。第三，欧洲产业政策：EDIS
              为成员国从欧洲供应商而非美国或以色列采购防务装备创造政治和采购激励，利好一家位于柏林且声称主权生产的公司。第四，NATO 海上缺口：约 500 万平方公里欧洲海域无法靠现有海军资产持续巡逻，明确催生对可负担、持续
              USV 覆盖的需求。第五，AI 集成趋势：STARK 的 Minerva 软件让公司有机会捕捉 ISR、瞄准和交战在 AI 赋能杀伤链中融合的增长，2026 年 4 月 Bundeswehr 演习把
              Virtus、Minerva 与 Quantum Systems 的 Vector 无人机整合在一起，就是证据。第六，国家国防预算扩张：德国 2025 年 3 月批准的 EUR 500 billion
              扩大防务投资框架，以及 2025 年 12 月 EUR 52 billion 采购方案，创造了持续买方购买力。采用约束同样实质存在。射程超过 100 km 的游荡弹药受出口管制限制（MTCR Category
              I），推高合规成本并拖慢国际销售。自主武器监管风险真实存在：ICRC 已正式呼吁制定具法律约束力的 AWS 规则，建议禁止不可预测系统和以人为目标的系统；HRW 则领导 Stop Killer Robots
              联盟。即便在加速机制下，欧洲防务资质和认证周期仍然很长。电子战反制也会迫使昂贵的抗 EW 投资——据报道，俄罗斯 EW 在 Donbas 把小型无人机的 GNSS 可用时间压到 18 秒。STARK
              自身负面事件——DroneXL 2025 年 10 月报道军事试验四次打击全部失手，以及 STARK 发布的反驳——说明产品可靠性仍是活跃采购风险，买方会在后续每一轮资质认证中追问。
