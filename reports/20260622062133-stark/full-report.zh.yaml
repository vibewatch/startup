      - number: '8.4'
        title: 情景分析——多头、基准与空头情景
        blocks:
          - type: paragraph
            body: >-
              情景分析受一个根本数据缺口限制：STARK 没有披露收入、利润率、单位经济、定价或烧钱速度。因此，所有情景都不是自下而上的财务建模，而是由合同选择权、可比基准和结构性市场数据搭建。

              多头情景下，Virtus 到 2027 年初获得 BAAINBw 正式资格，Bundeswehr 对数千套框架至少 call off 1,000 套。按估计平均售价 €100,000–€150,000
              每套（该区间与先进欧洲巡飞弹一致，并由可比产品推断），1,000 套将产生 €100M–€150M 首批 call-off 收入。如果未具名 NATO 成员合同转化为复购，且 STARK
              增加第二个欧洲主权客户，到 2028 年收入基础可能达到 €150M–€250M。套用 Anduril 等价成长倍数（成熟平台 10-15x 远期收入），2028–2029 年多头情景股权价值达到 $2–5
              billion 是可信的。这意味着以 $1.2B 进入可获得 1.7–4x 回报。

              基准情景下，资格相对框架日期延迟 12–18 个月。300–500 套的部分 call-off 到 2027 年底产生 €30M–€75M 确认收入。$1.2B
              标记可在下一轮内部估值中维持，但需要进一步稀释。下一次融资事件大概率是 $1.5B–$2B 投后估值的 Series C，STARK 投资者承受 15–20% 稀释。以 $1.2B 进入的净回报为
              0.5–1.5x，持有期 4–5 年，低于典型 VC 门槛收益率。

              空头情景下，独立测试证据证实 DroneXL 四次打击报道，BAAINBw 正式暂停或延迟资格路径，STARK 被迫在 2026 年底或 2027 年以显著更低估值融资。Founders Fund
              轮成为价格高点。$500M–$800M 的 down-round 会让最近一轮投资者承受严重按市值计价损失。德国巡飞弹市场很可能转向 Helsing 的 HX-2 和 AeroVironment 的
              Switchblade 等合格替代品，STARK 唯一可行退出将是以大幅低于 $1.2B 标记的价格出售给战略收购方。

              各情景概率信号在结构上不确定，因为 Virtus 资格状态无法通过公开数据确认。鉴于 DroneXL 负面记录尚未解决，空头情景概率不能被压到 25% 以下。德国结构性国防支出承诺和 STARK
              的战略投资者基础，使压力下近零结果不太可能——公司不太可能完全失败——但股权价值相对 $1.2B 进入价压缩，是一个真实且实质的风险。
