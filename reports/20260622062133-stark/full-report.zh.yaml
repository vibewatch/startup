  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价结构
        blocks:
          - type: paragraph
            body: >-
              STARK 采用面向政府的防务硬件和软件收入模式，公开来源中看不到任何消费者或商业 SaaS 成分。收入来自政府采购合同——最公开的证据是 German Bundestag 预算委员会于 2026 年 2 月
              25 日批准的 Bundeswehr 框架协议，覆盖数千套 Virtus 游荡弹药；以及 2026 年 2 月 4 日宣布、面向一个未具名 NATO 成员国的第二份合同，交付将于 2026 年 8
              月前完成。两份合同金额均未披露。第三条持续收入流来自向乌克兰武装部队交付活跃战区装备；该类采购走紧急采购安排，而非标准议会采购周期。Vanta USV 产品线和 Minerva C2
              软件代表额外未来收入流，但商业成熟度仍早，除演示项目外没有披露客户合同。

              这一模式的收入确认由里程碑驱动：针对框架订单交付硬件批次触发收入，而不是合同签署触发收入。关键在于，Bundeswehr 框架以成功资质认证为条件，这意味着 STARK
              通过资质门槛前，合同积压不会转化为确定的已确认收入。STARK 未披露任何产品定价；其 2026 年 2 月声明确认，德国媒体中没有 Virtus 定价。缺少定价、ASP
              或任何收入数字，意味着无法用公开数据搭建收入模型——模型架构可见，但输入完全私有。
