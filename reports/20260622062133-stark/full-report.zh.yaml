      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              可用来对标 STARK $1.2B 报道估值的参考框架有四个：欧洲和美国国防 AI 独角兽的私募轮可比、最接近上市公司（AeroVironment）的公开市场 P/S
              倍数、现有国防主承包商（Rheinmetall）的收入倍数，以及相对 Helsing 的融资—估值比分析。

              私募可比中，Helsing SE 是最接近的欧洲参照。Helsing 在 2025 年 6 月轮次达到 €12 billion 估值，累计融资 €1.37 billion，对应约 9x
              的融资—估值倍数。STARK 报道的 $1.2B 估值和约 $100M 融资额，意味着约 12x 倍数——明显高于 Helsing，尽管其产品证明记录实质更弱。Helsing 已在乌克兰部署数千套 HX-2 和
              HF-1 巡飞弹，持有 Bundeswehr AI 合同，并已接入 FCAS 项目。Helsing 在 2023 年 9 月 Series B 达到 €1.7B 投后估值时，背后已有多年 Bundeswehr
              合作和乌克兰活动。STARK 则试图在成立后约一年内走出相近估值轨迹。

              Anduril Industries 报告 2025 年收入约 $2 billion，隐含估值约 $28.7 billion，对应收入倍数约 14x。该倍数反映了产品规模、Pentagon
              合同深度、Lattice OS 平台收入，以及 STARK 不具备的制造基础（包括 $1 billion 俄亥俄设施）。Shield AI 在 2026 年 3 月 Series G 达到 $12.7
              billion 估值，同样建立在 Hivemind AI 自主能力跨多种美国军事平台部署的记录之上。

              AeroVironment 是最直接适用的公开市场参照，因为它是巡飞弹专门公司。FY2025 收入 $820.6 million，经营利润 $146.4 million（17.9% 利润率），截至 2026 年
              6 月市值约 $8.58 billion，AeroVironment 的交易倍数约为 10.5x 滚动收入。把该倍数用于 STARK 报道的 $1.2B 估值，意味着所需收入 run-rate 约为 $114
              million——STARK 没有披露这一数字，考虑到其 2024 年成立时间和以资格为条件的框架，也不太可能已经达到。

              Rheinmetall 公开市场收入倍数约 2.5x，基于 2024 年 €9.75B 收入，代表的是成熟主承包商折价，不是增长溢价。它不是 STARK
              的直接估值基准，但可作为成熟欧洲国防公司交易水平的上限参照。Rheinmetall 若要以 $1.2B 收购 STARK，相对自身倍数需要支付的隐含收购溢价，相当于在现有主承包商常态上扩张 4-5x；只有在
              STARK 贡献独特可防御的 AI 自主能力，并确认收入轨迹时，这才站得住。
