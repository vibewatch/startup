      - number: '5.5'
        title: 信任、合规、监管风险与技术不确定性
        blocks:
          - type: paragraph
            body: >-
              STARK 已发布的产品描述强调人在回路设计、CWES 认证意图，以及 Gambit 引信系统的 STANAG
              合规。这些都是实质性的架构承诺，但公开证据里没有已完成认证、国家主管机构认可或独立安全测试。Virtus 的 Bundeswehr 资格流程是 2026 年 2 月框架下 call-off
              订单的前提；公开材料没有说明里程碑排期、测试标准或完成时间，也没有独立资格机构公开表态。

              Virtus 和 Cascade 都被描述为具备 OTA 更新能力，这带来一个网络—物理安全暴露面，而 STARK
              的任何公开文件都没有处理这一点。具备空中更新能力的软件定义武器需要安全的更新交付链、固件签名验证和回滚控制；这些能力均未获得公开确认。MOSA
              架构提供集成灵活性，但每增加一个第三方系统，也会增加集成测试负担。Minerva 的蜂群和自动化目标功能继续演进后，将受到 ICRC 更严格审视；ICRC
              要求任何自主武器系统都必须让人类对单个目标决策保持有意义控制。HRW 的 Stop Killer Robots 运动则呼吁条约性禁令。欧盟正在成形的 AI Act 监管，以及德国武器授权法律框架，也可能随着
              Bundeswehr 资格推进，约束 Minerva 自动目标排序和蜂群功能的营销与认证方式。STARK 没有公开量化这些监管风险。
