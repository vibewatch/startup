  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从 STARK 关键证据信号到估值判断，再到最终 Track 建议的因果链；图中区分哪些因素支持投资，哪些因素拉低信心，使当前据报 $1.2B 价格下无法给出买入。
    data:
      nodes:
        - id: market
          label: 市场信号 — 正面
          detail: 德国 2025 年 €83B 国防采购和 NATO 9.4% 支出增长，提供真实且持续的结构性需求顺风；NATO 重新武装的紧迫性是多年驱动因素，不是一次性事件。
          tone: positive
        - id: contract
          label: 合同信号 — 有条件正面
          detail: Bundeswehr 2026 年 2 月数千套 Virtus 框架，是目前最重要的产品市场验证。前提是通过 BAAINBw 资格认证；它还不是已经产生收入的事实。
          tone: warning
        - id: product
          label: 产品信号 — 存在争议
          detail: STARK 声称已在乌克兰作战部署，并完成 TDW 热打击演示。DroneXL 则称其在 2025 年 10 月正式军事试验中四次打击失败。两套说法无法调和；公开渠道没有独立验证。
          tone: negative
        - id: investors
          label: 投资者信号 — 正面但有保留
          detail: >-
            NIF + In-Q-Tel + Sequoia + Founders Fund 的股东阵容是真实的信用信号，意味着有政府背书的严肃尽调。不过，Founders Fund 投资和 $1.2B 估值未获 STARK
            确认，只来自第三方媒体。
          tone: warning
        - id: financials
          label: 财务信号 — 阻断
          detail: 没有收入、没有审计账目、没有毛利数据、没有烧钱速度。截至 2026 年 6 月，Bundesanzeiger 显示 SKD SE 没有提交年度账目。以独角兽估值融资却财务不透明，这是最严重的证据缺口。
          tone: negative
        - id: valuation
          label: 估值判断
          detail: >-
            据报 $1.2B 估值处在基准情景区间上沿；若按 AeroVironment 10.5x P/S，需要约 $114M 收入才有基本面支撑。STARK 产品证明更弱，但融资额对应估值倍数（约 12x）高于
            Helsing（约 9x）。
          tone: negative
        - id: recommendation
          label: Track — 按当前据报估值不投资
          detail: 产品资格认证存在争议、财务披露为零、估值标记未经确认，战略潜力与证据质量之间的缺口过大，无法支持以 $1.2B 做高信心投资。若资格认证确认，$600–800M 是更合适的重新进入区间。
          tone: neutral
      edges:
        - from: market
          to: valuation
          label: 需求顺风支撑期权价值
        - from: contract
          to: valuation
          label: 框架取决于资格认证
        - from: product
          to: valuation
          label: 未解决的负面记录压低信心
        - from: investors
          to: valuation
          label: 战略信用底线；$1.2B 未确认
        - from: financials
          to: valuation
          label: 阻断 — 没有收入数据无法承销
        - from: valuation
          to: recommendation
          label: 证据与信心缺口导向 Track
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV013
      - CV041
  - id: FV002
    title: 估值对收入假设的敏感性
    type: bar
    layout: standard
    summary: >-
      以 AeroVironment 公开市场 10.5x P/S 倍数为参照，测算 STARK 在五种收入情景下的隐含企业价值。若按该倍数，据报 $1.2B 估值需要约 $114M
      经确认年收入才有基本面支撑。所有收入数字均由分析师根据合同期权性推断；STARK 未披露收入。
    approximationNotes: >-
      AeroVironment 10.5x P/S 被用作巡飞弹专业公司的公开市场基准；实际私营公司的增长溢价可能更高（例如高增长平台 15–20x）。收入情景是分析师根据合同期权性构造，不是 STARK
      披露数据。牛市和高增长情景采用与 Anduril 相当的 14x 远期 P/S。
    data:
      items:
        - label: 无确认收入（当前）
          value: 0
          unit: implied revenue $M
          detail: STARK 披露收入为零，也没有提交账目。只要 P/S 倍数为正，确认收入为零就意味着 $1.2B 估值没有基本面支撑——该估值完全押在远期合同期权性和战略溢价上。
          tone: negative
        - label: 熊市情景 — 未通过资格认证（估计约 $0–20M）
          value: 20
          unit: implied revenue $M
          detail: 若资格认证失败或继续延迟，STARK 来自乌克兰交付和非 Bundeswehr 活动的估计收入可能达到约 $20M。按 10.5x P/S 计算，公允价值仅约 $210M，较据报 $1.2B 估值折价 83%。
          tone: negative
        - label: 部分订购 — 基准情景（约 $30–75M）
          value: 55
          unit: implied revenue $M (mid-point)
          detail: >-
            以 €100K–€150K ASP 计算，300–500 套部分订购可产生约 €30M–€75M（约 $35M–$88M）。按 10.5x P/S，中点收入约 $55M 对应约 $578M 公允价值，低于 $1.2B
            估值，说明基准情景仍不足以完全支撑当前据报估值。
          tone: warning
        - label: 支撑 $1.2B 的全额订购门槛（需要约 $114M 收入）
          value: 114
          unit: implied revenue $M
          detail: 按 AeroVironment 10.5x P/S，$114M 经确认年收入可精确支撑据报 $1.2B 估值。按估计 ASP 区间，需要约 760–1,140 套交付——牛市情景可实现，基准或熊市情景做不到。
          tone: warning
        - label: 牛市情景 — 完整框架 + 第二个 NATO 成员国（约 $150–250M）
          value: 200
          unit: implied revenue $M (mid-point)
          detail: >-
            Bundeswehr 订购 ≥1,000 套，再加一个 NATO 成员国复购，中点约 $200M；按 AeroVironment 10.5x 倍数可支撑 $2.1B，按 Anduril 14x 可支撑
            $2.8B——相对 $1.2B 入场价，牛市情景回报为 1.7–2.3x。
          tone: positive
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV025
      - CV026
      - CV027
  - id: FV003
    title: 分情景估值与回报区间
    type: range
    layout: standard
    summary: 相对于据报 $1.2B 入场价，列出牛市、基准、熊市三种情景的低 / 中 / 高估值结果区间，并明确各边界的驱动假设。所有数字均为分析师估计；STARK 未披露收入、利润率或财务数据。
    approximationNotes: 牛市和基准估值把同业推导的 P/S 倍数套用于分析师推断的收入情景。熊市估值反映下轮降价融资风险，以及在竞争激烈的欧洲市场中资格认证失败的巡飞弹初创公司市场出清价格。EUR/USD 汇率按 1.17。
    data:
      items:
        - label: 熊市情景（2027 年视角）
          low: 300
          mid: 500
          high: 700
          unit: $M enterprise value
          detail: >-
            低位：资格认证暂停后以困境价格出售资产；收购方（如 Rheinmetall 或 Helsing）以大幅折扣买入 IP、人才和 Bundeswehr 关系。中位：被迫降价融资，以 $500M 估值维持持续经营，但相对
            $1.2B 入场价亏损 58%。高位：延迟 18 个月后部分挽回资格认证；部分订购支撑最低可行公司。
          source: Analyst synthesis from DroneXL adverse record, bear scenario assumptions
          tone: negative
        - label: 基准情景（2027–2028 年视角）
          low: 800
          mid: 1250
          high: 1600
          unit: $M enterprise value
          detail: >-
            低位：资格认证延迟；部分订购；以 $800M 平轮融资；相对 $1.2B 入场价亏损 33%。中位：$1.25B 区间使价值接近当前估值，但 Series C 带来 15–20%
            稀释；稀释前回报持平。高位：完成资格认证、获得部分订购，国际客户增加 €50M+ 增量价值；$1.6B 可支撑。
          source: Analyst synthesis from base case assumptions; AeroVironment P/S comparables
          tone: warning
        - label: 牛市情景（2028–2029 年视角）
          low: 2000
          mid: 3500
          high: 5000
          unit: $M enterprise value
          detail: >-
            低位：2027 年 Q1 确认资格认证；仅订购 500–700 套；第二客户有限；按推断收入约 $200M 的 10x 计算，公允价值 $2B。中位：全额订购 + NATO 成员国复购 + 第二个主权客户；获得
            Anduril 式平台溢价；按 $250M 远期收入 14x 计算，$3.5B 可支撑。高位：主承包商溢价战略收购；IPO 定价享有国防科技增长溢价；按 $250M+ 收入 20x+ 远期 P/S，估值上限 $5B。
          source: Analyst synthesis from Helsing/Anduril growth trajectories and AeroVironment P/S
          tone: positive
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: >-
      围绕 STARK 估值判断最关键的七个投资维度，给出可提交 IC 的评分：市场、产品证明、护城河、经济性、风险、估值和证据质量。每项按 1–5 分打分，5
      分最强。整体投资吸引力受证据质量、财务不透明和未解决的产品资格认证问题约束。
    approximationNotes: 评分是分析师综合前七章后的判断。市场和护城河得分反映真实结构性优势。产品证明、经济性和证据质量得分反映 DroneXL 负面记录未解决，以及财务披露为零。
    data:
      items:
        - label: 市场机会
          value: 4/5
          unit: IC score
          trend: growth
          detail: 德国 2025 年 €83B 采购、NATO 9.4% 支出增长和欧洲重新武装的紧迫性，构成真实的多年结构性驱动；巡飞弹 TAM 到 2030 年以 10.89% CAGR 增至 $1.07B；欧洲份额明显更大。
        - label: 产品差异化与证明
          value: 2/5
          unit: IC score
          trend: mixed
          detail: 乌克兰作战部署主张带来差异化，但缺少完整独立验证；TDW 热打击演示由制造商伙伴参与；DroneXL 的四次打击负面记录仍未被驳倒；资格认证状态无法确认。
        - label: 竞争护城河
          value: 3/5
          unit: IC score
          trend: growth
          detail: >-
            Bundeswehr 框架合同是真实的先发护城河；主权 EU 供应链和 In-Q-Tel/NIF 投资者基础难以快速复制；若 STARK 资格认证延迟，Helsing 和 AeroVironment
            会构成真实竞争威胁。
        - label: 单位经济性与财务质量
          value: 1/5
          unit: IC score
          trend: neutral
          detail: 公开收入、利润率、烧钱速度和审计账目均为零；研发强度超过支出的 45%，说明仍处于利润率形成前阶段；公开数据无法拼出单位经济性；这是单项得分最低的维度。
        - label: 风险画像
          value: 2/5
          unit: IC score
          trend: adverse
          detail: 产品资格认证、LAWS 监管压力、极高客户集中度、财务不透明，以及 Thiel/Founders Fund 政治争议，叠成第 7 章评为高的复合风险栈；多项风险存在部分相关性。
        - label: $1.2B 估值下的吸引力
          value: 2/5
          unit: IC score
          trend: adverse
          detail: >-
            $1.2B 未确认；尽管证明更弱，融资额对应估值倍数 12x 高于 Helsing 的 9x；若按 AeroVironment P/S 支撑，需要约 $114M 收入；六个月估值上调
            140%，驱动来自合同公告而非收入转化。
        - label: 证据质量与尽调信心
          value: 1/5
          unit: IC score
          trend: adverse
          detail: 估值未经确认、财务披露为零、产品资格认证存在争议、Bundesanzeiger 无提交账目、独立测试验证为零、DroneXL 负面记录未解决——证据质量是整体评级的硬约束。
        - label: 退出准备度与战略价值
          value: 3/5
          unit: IC score
          trend: neutral
          detail: >-
            Rheinmetall、L3Harris 或 AeroVironment 战略收购是可行路径；欧洲国防科技 M&A 市场活跃；In-Q-Tel 和 NIF 的存在增加了美国政府相关收购方的期权；IPO
            只有在牛市节奏下才可能于 2028 年之后实现。
