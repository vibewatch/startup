      - number: '4.4'
        title: 资本充足性与未来融资依赖
        blocks:
          - type: paragraph
            body: >-
              仅凭公开数据无法精确评估 STARK 的资本充足性，但方向图景很清楚：公司尚未在规模上产生收入，现金消耗跨多个地域展开，并且在 Bundeswehr 和 NATO
              合同交付足够的里程碑付款来支撑运营之前，依赖持续股权融资。报道中的融资轨迹——到 2025 年 10 月通过两轮 Sequoia 领投融资约 $100 million，2026 年 2 月又有一轮未确认的
              Founders Fund 融资——意味着现金头寸可能低至 $30–50 million，也可能高达 $100 million 或更多，取决于实际 burn rate
              和最近一轮融资时间。这个宽区间反映出公司没有披露任何现金头寸、burn rate 或资金用途声明。

              Bundeswehr 框架协议是最可信的未来收入信号，但它附带资质条件，且两年交付窗口会把现金流入分散到 2026–2028 年。欧洲防务政府采购付款条款通常按里程碑执行，常见 10–30%
              的预付款，余额在交付验收里程碑时支付；STARK 需要在这些款项到账前为生产和库存扩张融资。NATO Innovation Fund 提供具联盟授权的战略耐心资本，可能降低近期流动性压力，但 NIF
              是股权投资人，不是授信额度。European Defence Fund 的 2026 年工作计划为协作 R&D 分配 €1 billion，并包含与 STARK
              组合直接对齐的自主系统主题，代表潜在非稀释性资助路径；但尚未披露任何 EDF 拨款授予。公司在已审阅公开来源中没有披露任何债务、授信额度或项目融资安排。
