      - - 正论点——德国 2025 年 €83B 采购顺风与 NATO 重整军备紧迫性
        - 2025 年 Bundeswehr 103 个重大项目合计 €83B（DefenseNews）；SIPRI 显示 2024 年全球军费同比增长 9.4%；多数成员国已超过 NATO 2% GDP 底线
        - 德国或 NATO 防务预算结构性逆转；政治常态化削弱采购时间表中的紧迫性溢价
      - - 正论点——战略投资人基础（NIF、In-Q-Tel、Sequoia）提供主权背书和下行保护
        - NIF 是由 24 个 NATO 盟友支持的 €1B 基金；In-Q-Tel 是 CIA 的战略 VC 机构；这些机构很少在没有严肃尽调战略契合度时投资
        - 投资人以重大折价退出；治理争议；NIF 或 In-Q-Tel 二级出售发出信心恶化信号
