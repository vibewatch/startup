        - >-
          Virtus 在 2027 年 Q1 前通过 BAAINBw 资质；≥1,000 架 call-off，ASP €100K–€150K（首批 call-off €100M–€150M）；NATO 成员国复购；第二个 EU
          主权客户；2028 年收入 €150M–€250M
        - $3B–$5B（已验证平台按 10–15x 远期收入；Anduril 同等增长溢价）
        - Helsing HX-2 竞争（同类配置已获资质）；NATO 防务预算逆转；LAWS 监管收窄 AI 瞄准边界
        - 低-中；需要在特定窗口内取得资质，但当前没有独立确认；未解决的负面测试记录压低上行概率
      - - 基准
        - 资质延迟 12–18 个月；部分 call-off 300–500 架；2027 年底收入 €30M–€75M；下一轮（Series C）投后 $1.5B–$2B，稀释 15–20%
        - $1.0B–$1.5B（在无收入确认时，当前 $1.2B 标记处于基准区间上沿；3–4 年持有期内可维持但难显著增长）
        - 资质延迟让现金消耗超过现有 runway；Series C 稀释把净回报压到 VC 门槛以下；延迟窗口中 Helsing/AeroVironment 抢走可服务份额
        - 中；最符合当前证据模糊状态；框架存在，但资质条件下的转换没有确认时间线
