      - number: '1.4'
        title: 尽调含义与未解缺口
        blocks:
          - type: paragraph
            body: >-
              现有公开记录支持一个可信论点：STARK
              已成为欧洲扩张最快的防务初创公司之一，但记录中也有重要矛盾。积极一面是，法律身份、产品目录、地域扩张、投资人质量，以及至少一个德国大客户决策都已公开可见。谨慎一面是，公司仍没有公开收入披露、确认客户数、2026
              年 2 月报道融资的轮次规模披露，也没有生产利润率或合同盈利能力的经审计证据。产品就绪风险同样实质存在：STARK 自己发布过防御性声明，反驳一支乌克兰军事单位的批评；而 DroneXL 的负面文章则把 2025
              年 10 月试验描述为完全失败。这两类来源并不能最终否定产品，但它们说明，战场反馈和运行可靠性仍是活跃尽调议题。最后，随着 Virtus、Cascade 和 Minerva
              等系统向蜂群和更自动化的杀伤链演进，人权和自主武器审查很可能加剧。结论是：这家公司战略动能很强，但最影响投资承销的变量，证据质量仍停留在私有层面。
