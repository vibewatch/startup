companyProfile:
  summary: >-
    STARK 是一家总部位于柏林、以 SKD SE 运营的防务科技公司，聚焦欧洲主权自主打击能力。其公开产品栈覆盖 Virtus 和 Cascade 游荡弹药、Gambit 短程效应器、Vanta 无人水面艇，以及 Minerva
    指挥控制软件。官方来源确认 Sequoia Capital、Project A、NATO Innovation Fund 和 In-Q-Tel 参投；2026 年 2 月媒体报道则称，Founders Fund
    相关一轮融资尚未确认，估值约 $1.2 billion。2026 年 2 月，Bundeswehr 为数千套 Virtus 系统设立框架协议，给公司提供了有分量的公开需求验证；但公司仍未披露收入、利润率、总融资额或经审计账目。
