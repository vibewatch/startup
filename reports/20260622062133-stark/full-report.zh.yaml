      - number: '1.2'
        title: 领导层、治理与资本形成
        blocks:
          - type: paragraph
            body: >-
              对一家年轻的欧洲防务公司来说，STARK 的管理团队异常深，且看起来有意把风险投资速度和工业可信度拼在一起。Uwe Horstmann 在 Project A 孵化 STARK 后，于 2025 年 10 月出任
              CEO；法律落款和后续董事任命公告显示，公司还有更宽的高管梯队，包括 Johannes Schaback、Dr. André Schneider、Jan-Patrick Helmsen 和 Martin
              Rost。Helmsen 有 Rheinmetall 武器销售一线经验，Rost 则带来 Zalando
              的大规模运营经验，这支撑了公司反复强调的一个信息：生产规模和供应链执行是核心差异点。资本形成记录则没那么干净。公司官方材料明确列出 Sequoia Capital、NATO Innovation
              Fund、Project A 和 In-Q-Tel 为投资方；2026 年 2 月第三方报道又加入了尚未确认的 Founders Fund 投资和 $1.2 billion
              估值叙事。也就是说，公司已经能主张高质量投资人背书，但在公司声明、备案或投资人确认出现之前，具体轮次规模、累计融资、稀释和领投经济条款都只能视为部分验证，而非既定事实。
