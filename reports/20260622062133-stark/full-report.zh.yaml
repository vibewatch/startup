  - id: TV004
    title: 可比估值表
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >-
        Five comparables selected as the most relevant publicly documented reference set: one European AI defence peer
        (Helsing), two US AI defence platforms (Anduril, Shield AI), one public-market loitering munition specialist
        (AeroVironment), and one European defence prime (Rheinmetall). Excludes Israeli incumbents, Ukrainian
        manufacturers, and smaller EU startups for which mid-2026 valuation data is not publicly available.
    notes: >-
      收入和估值数据来自截至 2026 年中 Wikipedia 引用来源、SEC 备案和金融数据提供商。私营公司估值为最后一轮投后标记，可能不同于公允市值。STARK 收入未披露；因此 P/S
      倍数展示在同业倍数下，要支撑其报告估值需要多少收入。
    columns:
      - 可比公司
      - 阶段与规模
      - 关键指标与倍数
      - 与 STARK 估值的相关性
      - 局限
    rows:
      - - Helsing SE（德国）
        - 私营；Series C/D 同等阶段；已融资 €1.37B；估值 €12B（2025 年 6 月）
        - 融资额 / 估值约 9x；收入未披露；HX-2 和 HF-1 已部署乌克兰战场
        - 最接近的欧洲可比公司；AI 游荡弹；Bundeswehr 合同；主权 EU 品牌
        - Helsing 多出 3 年以上产品验证、多份政府合同和战场部署记录，STARK 尚未匹配；€12B 是 STARK 报告标记的 10x
      - - Anduril Industries（美国）
        - 后期私营；隐含约 $28.7B；FY2025 收入 $2B；7,000 名员工
        - $2B 收入对应 P/S 约 14x；Lattice OS 平台；$1B 俄亥俄制造设施
        - 美国防务 AI 平台基准；证明已验证平台可达到 10–15x P/S
        - 主要面向美国 DoD；无 EU 采购履历；收入基础与 STARK 以框架条件为起点的状态根本不同
      - - Shield AI（美国）
        - 后期私营；估值 $12.7B（2026 年 3 月 $1.5B Series G）
        - 估值 $12.7B；收入未披露，但有记录的 DoD Hivemind 部署
        - 军事平台 AI 自主；拒止 GPS 环境作业；Pentagon 合同深度
        - 无游荡弹产品；EU 存在感有限；空军自主 vs 打击聚焦；$12.7B 是 STARK 报告标记的 10.6x
      - - AeroVironment Inc — NASDAQ AVAV
        - 上市公司；FY2025 收入 $820M；市值 $8.58B（2026 年 6 月）
        - P/S 约 10.5x；经营利润率 17.9%；Switchblade/Puma 在 55+ 个国家部署 50,000+ 套
        - 唯一的公开市场游荡弹专营公司；作为 P/S 锚点，STARK 需约 $114M 收入才能以同等倍数支撑 $1.2B
        - 公开市场折价 vs 私营增长溢价；15 年以上资质和部署历史；STARK 确认交付收入为零
      - - Rheinmetall AG — DAX 上市
        - DAX 主要上市公司；2024 年收入 €9.75B；市值约 €24B；40,000 名员工
        - 收入倍数约 2.5x（成熟主承包商）；EBIT 利润率约 15%；德国最大主承包商
        - 董事会成员与 STARK 有重叠；最可能的战略收购方；高于 Rheinmetall 自身倍数的收购溢价必须由 STARK 的 AI 差异化支撑
        - 成熟主承包商倍数不是成长期初创公司的估值基准；2.5x P/S 上限意味着 Rheinmetall 需要变革性战略理由才会支付 $1.2B
