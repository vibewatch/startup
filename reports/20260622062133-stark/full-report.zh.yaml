  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              STARK 的可服务市场横跨三个相互连接的子市场：（1）游荡弹药——也称一次性攻击无人机或
              OWA-UAS——用于陆基或空射精确打击，射程从数十到数百公里；（2）自主无人水面艇（USV），用于海上巡逻、ISR，以及未来打击任务；（3）AI 驱动的指挥控制软件
              Minerva，把多类无人平台接入网络化打击链。纳入支出包括国防部、武装部队采购机构和盟国能力项目为这些自主系统采购硬件、集成、软件和保障的开支。排除支出包括商用无人机市场、民用物流无人机、非防务 ISR
              卫星、传统火炮、常规巡航导弹和有人作战航空——这些都能部分替代 STARK
              的产品。现状替代品仍然重要：传统精确制导弹药和有人打击飞机能交付相同战场效果，但成本更高、量产潜力更低；常规巡逻舰艇和海岸警卫队巡逻艇能承担海上态势感知任务，但单件成本和人员暴露都高得多。相关市场边界出现在买方同时需要三件事时：（a）可负担的规模，（b）更低人员风险，（c）传统平台在同等成本下无法匹配的
              AI 赋能瞄准速度。STARK 的系统专门针对 NATO 成员国已识别的能力缺口：人在回路中的远程打击、海上持续存在，以及多域侦察到打击时间线；这使其可服务市场区别于更宽泛的无人系统或防务电子总量。
