      - number: '2.3'
        title: 受证据约束的市场规模视角
        blocks:
          - type: paragraph
            body: >-
              STARK 的组合产品范围没有一个单一权威 TAM，因此本节采用多组重叠视角。第一个视角是独立的全球游荡弹药市场，Mordor Intelligence 估计 2025 年为 $635.88 million，到
              2030 年增长至 $1,066.43 million，CAGR 为 10.89%。欧洲份额由大型国家再武装项目锚定：德国从 EUR 100 billion Zeitenwende 基金中划拨 EUR 1.2
              billion，用于立即采购现货游荡弹药；法国在 Colibri 和 Larinae 项目下承诺 EUR 2 billion，采购 1,800 套系统；爱沙尼亚则承诺七年投入 EUR 400
              million。第二个视角是无人水面艇市场，Mordor 估计 2025 年为 $1.13 billion，到 2030 年扩张至 $2.18 billion，CAGR 为 13.98%；2024
              年防务应用占该市场 52.21%。合并这两个硬件视角，STARK 硬件类别的全球 TAM 在 2025 年约为 $1.77 billion，到 2030 年约增至 $3.25 billion。STARK 的
              Minerva 软件层无法整齐归入任一视角，因此形成规模测算缺口。宏观背景是第三个视角：2024 年全球军费达到 $2,718 billion，增长 9.4%，为 1988 年以来最陡年度升幅；SIPRI
              指出军费已连续十年增长。德国预算轨迹瞄准到十年末国防开支达到 GDP 的 2.8–3.5%，Bundestag 于 2025 年 12 月批准 EUR 52 billion 军费方案。欧洲 NATO SAM
              下限至少为 EUR 3.6 billion，来自三个已披露国家承诺，但这只覆盖 32 个 NATO
              成员中的三个。相互矛盾的估计需要保留：分析师报告给出的窄产品线规模会低估完整自主软件机会，而宽泛防务支出总量又会高估实际可渗透预算。
