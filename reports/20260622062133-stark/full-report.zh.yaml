      - number: '3.5'
        title: 护城河耐久性、切换成本与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              STARK 声称的差异化建立在四根支柱上：欧洲主权、跨域硬件-软件-C2 集成、快速入场，以及轻资产扩张论点。每根支柱都有可信反驳。主权优势真实存在，但并非永久——Anduril 和 Shield AI
              正在建设欧洲足迹，Helsing 已经占据同一组德国 / NATO 渠道。集成优势存在争议：Anduril 的 Lattice C2 在软件层直接竞争，STARK 在 2026 年 4 月 Bundeswehr
              演习中的侦察到打击链需要 Quantum Systems 的 Vector 提供 ISR 输入，暴露了栈完整性缺口。快速入场令人印象深刻，但 2025 年 10 月 DroneXL
              的负面试验叙事提出挑战；Bundeswehr 框架授予部分反驳了这一点，却没有完全消除。轻资产论点在早期框架数量下有合理性，但 Helsing 2025 年 6 月收购 Grob Aircraft
              是一个方向性信号：软件优先的欧洲防务初创公司到数千套规模时，最终会需要制造资产。STARK 护城河的总体负面风险至少包括八项并发威胁：Anduril Lattice 取代 Minerva 成为 NATO C2
              标准；Helsing 赢得竞争性 Bundeswehr 预算席位（FCAS AI、Gripen 集成）；Rheinmetall 通过 Auterion 内部化自主能力；AeroVironment
              持续可靠性和规模基准；IAI 和 Rafael 深厚的 Bundeswehr 关系；Elbit 可能解除禁令，以及对所有防务 AI 初创公司的声誉传染风险；STARK
              在数千套框架交付中的生产扩张执行风险；以及没有公开资质测试数据就仍未解决的负面试验叙事。短期内，多供应商并用风险较低，因为游荡弹药采购涉及长期资质周期和单供应商框架合同；但在 C2
              软件层，平台锁定才是长期最耐久的差异点，Lattice、Minerva、Hivemind 和 Auterion 都在这里竞争。
