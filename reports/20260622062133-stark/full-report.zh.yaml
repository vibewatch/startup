    rows:
      - - 正论点——以 Bundeswehr 为锚点的欧洲主权游荡弹先发特许权
        - 2026 年 2 月 Bundeswehr 数千架 Virtus 框架；Bundestag 预算委员会批准；没有其他 EU 主权游荡弹初创公司持有同等框架
