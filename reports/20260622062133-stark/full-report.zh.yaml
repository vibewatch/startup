  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素或约束
      - 方向
      - 时间
      - 证据
      - 对 STARK 的含义
      - 尽调问题
    rows:
      - - 欧洲重整军备（SIPRI 全球军费激增）
        - 驱动因素
        - 当前且持续
        - SIPRI：2024 年 $2,718B；增长 9.4%，为 1988 年以来最陡；支出连续 10 年增长
        - 扩大所有 NATO 欧洲成员国的可触达预算池
        - 核实 STARK 有资格从扩大的预算中拿到哪些具体采购条目
      - - 游荡弹在乌克兰获得实战验证
        - 驱动因素
        - 短至中期
        - Mordor：战场成功压缩了美国海军陆战队和法国的采购周期；德国划出 EUR 1.2B 用于现货采购
        - 加快资质认定节奏；STARK Virtus 已出现在 Bundeswehr 演习语境中
        - 跟踪乌克兰冲突延续如何影响欧洲采购周期
      - - EU EDIS 欧洲防务工业战略
        - 驱动因素
        - 中期（2025-2035 目标）
        - EU EDIS 把协同采购目标和强化 EDTIB 写成政策；EDA 基准鼓励采购欧洲装备
        - 为成员国选择欧洲主权供应商制造政治和采购激励
        - 判断 EDIS 采购激励会如何落到 STARK 能满足的具体合同标准
      - - 德国 EUR 500B 扩大防务投资框架
        - 驱动因素
        - 短至中期（2025 起）
        - Bundestag 2025 年 3 月批准 EUR 500B 框架，放松债务刹车；2025 年 12 月推出 EUR 52B 军事方案； 轨迹指向 GDP 的 2.8-3.5%
        - 德国是 STARK 的主市场；结构性预算上调支撑多年采购管线
        - 核实除初始 Virtus 框架外，德国采购管线中有多少项目 STARK 已正式参与竞争
      - - 自主武器监管（ICRC、HRW、CCW 谈判）
        - 约束
        - 中长期
        - ICRC 建议制定具法律约束力的规则，包括禁止以人为目标的系统；HRW 推动有约束力的条约
        - 可能限制或推迟 Virtus、Cascade 或 Minerva 更高自动化配置的部署
        - 评估 STARK 的设计合规姿态，是否满足 ICRC/HRW 对人类在环控制的最低标准
      - - 出口管制（MTCR - 射程超过 100 km 的系统）
        - 约束
        - 当前
        - Mordor：美国 2025 年 4 月把游荡弹部件加入导弹技术管制清单；EU 统一了许可证问卷
        - Virtus 射程 130 km，踩在 Category I 敏感性边缘；NATO/EU 以外的国际销售会面临许可证审查
        - 厘清 STARK 对 Virtus 的出口管制分类；判断哪些出口市场在结构上已被关闭
      - - 电子战反制
        - 约束
        - 当前且持续
        - Mordor：据称俄罗斯电子战在 Donbas 把小型无人机的 GNSS 可用时间压到 18 秒；抗电子战加固最多推高单位成本 8%
        - 迫使公司投入抗干扰导航研发；抬高生产成本
        - 要求 STARK 提供电子战加固路线图，以及它如何影响 Virtus 规模化后的单位经济性
      - - Bundeswehr 资质认定与采购周期长度
        - 约束
        - 短至中期
        - globalsecurity.org：Bundeswehr 采购历史上以避险和完美主义著称； 大额采购需要预算委员会批准
        - 即便政治上有紧迫感，从框架到交付的时间线仍可能拉长；新型号资质认定可能需要新的测试周期
        - 量化 Virtus 完整认证耗时，并梳理下一代型号仍需跨过哪些资质门槛
    notes: 本表区分两类驱动因素：扩大预算包络的宏观因素，以及加快采购决定的微观因素；也区分监管约束（长期、法律）和技术约束（当前、偏成本）。
