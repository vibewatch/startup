  - id: TV006
    title: 最终尽调要求表
    notes: 项目按阻断严重程度排序。前三项是任何资本承诺在 $1.2B 估值下获得专业背书前的最低要求。第 4–5 项是完整承销所需，但可通过管理层陈述和 NDA 保护的数据室访问部分满足。
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人和尽调路径
    rows:
      - - BAAINBw Virtus 资质状态
        - BAAINBw 出具的正式资质证书（MPCV 或同等文件），确认 Virtus 满足 Bundeswehr 生产交付的所有军事采购要求
        - 没有该文件，框架合同无法转为有约束力的 call-off 订单；这是最重要的论点确认材料；DroneXL 负面记录也无法解决
        - 在 NDA 下直接向 STARK 索取；向 BAAINBw 采购办公室独立核验；审查 Bundesanzeiger 中的 BWB/BAAINBw 采购通知
      - - SKD SE 经审计财务报表
        - SKD SE 及任何合并子公司的年度账目，包括收入、毛利率、经营亏损、现金余额、runway 和 burn rate
        - 没有财务披露，$1.2B 独角兽估值无法专业承销；burn rate 和 runway 未知；资本充足性无法验证
        - 任何 term sheet 前要求在 NDA 下提供；与 Bundesanzeiger 未来备案交叉核对；作为共同投资条件，向主投方（Sequoia、Founders Fund）索取
      - - 2025 年 10 月试验的独立产品测试记录
        - 2025 年 10 月英德武装部队评估的测试主办方记录，提供实际资质评分、打击结果和测试条件
        - DroneXL 四次打击负面报告与 STARK 研发测试反驳之间的冲突未解决；这是产品论点中影响最大的未结尽调项
        - 在 NDA 下向 STARK 和测试主办方索取；聘请独立军事测试评估方；获取 STARK 版本的测试协议和评分标准
      - - Founders Fund 投资条款和股本结构表
        - Founders Fund 正式确认投资金额、投前 / 投后估值和优先权条款；完整股本结构表列明所有投资人持股和优先权
        - 当前 $1.2B 估值基于第三方媒体；法律尽调需要一手文件；清算优先权可能在退出时实质侵蚀普通股价值
        - 在 NDA 下向 STARK 索取股本结构表、term sheet 和投资人协议；直接向 Founders Fund 核验
      - - Bundeswehr call-off 时间表和框架 call-off 触发条件
        - 2026 年 2 月框架下有约束力的 call-off 订单或预测时间表，包括交付里程碑、单价、资质触发条件和取消权
        - 在发出 call-off 且资质确认前，框架 backlog 不是确定收入；缺失该项会阻断任何合同价值或 DCF 分析
        - 在 NDA 下要求提供；与 Bundestag 预算委员会公开采购记录，以及通过信息请求可获得的任何 BAAINBw Leistungsbeschreibung 文件交叉核对
    claimRefs:
