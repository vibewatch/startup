    summary: 呈现 VC 资本流入和四类主要资本密集型流出，说明资金如何投向 R&D、战斗部库存、生产基础设施和营运资本。
    data:
      nodes:
        - id: vc-funding
          label: VC 股权流入（报道约 $100M+）
          detail: 第三方报道显示，Sequoia 领投的两轮合计约 $100M；Founders Fund 追加（未确认）可能增加 $15–$60M 等值。迄今公开披露的主要且唯一资本来源；未确认有债务或项目融资。
          tone: positive
        - id: rd-spend
          label: R&D 支出（>45% 总支出）
          detail: 公司披露，超过全部支出的 45% 投向 R&D；覆盖五个地区的软件开发、系统集成、战斗部资格认证和作战测试。
          tone: neutral
        - id: warhead-inventory
          label: 战斗部预购（数千枚）
          detail: CEO 2025 年 10 月公告确认预购数千枚 TDW 战斗部，以在 2027 年前锁定经认证弹药供应；这是重大的前置营运资本投入，会以库存形式留在资产负债表上。
          tone: warning
        - id: production-capex
          label: 多地生产 capex（UK、Ukraine、Germany）
          detail: UK 生产设施 2025 年 7 月启用；Ukraine 2,000 sqm R&D / 生产枢纽（2026 年 2 月）；Berlin 总部；COO 职责包括推动三地生产扩张；合同收入确认之前仍需持续 capex。
          tone: warning
        - id: working-capital
          label: 合同交付营运资本
          detail: 防务采购付款条款按里程碑走；合同签署到交付验收之间，STARK 需要为生产和库存建设垫资；多币种敞口（EUR、GBP、UAH）增加 FX 营运资本复杂度。
          tone: warning
        - id: cash-position
          label: 净现金头寸（未披露）
          detail: 没有资产负债表或现金流披露；鉴于截至 2026 年 Q2 仍在招聘和扩张，推断为正；runway 取决于上述所有流出后的实际剩余现金。
          tone: warning
      edges:
        - from: vc-funding
          to: rd-spend
        - from: vc-funding
          to: warhead-inventory
        - from: vc-funding
          to: production-capex
        - from: vc-funding
          to: working-capital
        - from: rd-spend
          to: cash-position
        - from: warhead-inventory
          to: cash-position
        - from: production-capex
          to: cash-position
        - from: working-capital
          to: cash-position
    approximationNotes: 节点不提供美元金额，因为所有输入要么未披露，要么由第三方报道推断。该流程展示资本类别和结构依赖，不是资产负债表科目。VC 节点中的约 $100M 融资数字来自第三方报道，且未经确认。
    claimRefs:
