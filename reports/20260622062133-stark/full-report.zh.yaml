      - number: '3.2'
        title: 欧洲直接对手——Helsing、Tekever、ARX Robotics、Quantum Systems
        blocks:
          - type: paragraph
            body: >-
              Helsing SE 是 STARK 最直接的欧洲对手，也是德国和更广 NATO 欧洲采购渠道中最重要的竞争风险。Helsing 于 2021 年 3 月在慕尼黑成立，四轮累计融资约 €1.37
              billion；2025 年 6 月 Daniel Ek 的 Prima Materia 领投 €600 million 后，公司估值达到 €12 billion。其产品组合包括 HF-1 和 HX-2
              游荡弹药（利用存储地图数据和 Altra 多无人机瞄准软件实现 GPS 独立）、SG-1 Fathom 水下监视系统，以及集成到 Eurofighter Typhoon EK 和 Saab JAS 39
              Gripen E 的 AI 软件。Helsing 已拿到为 Future Combat Air System（FCAS）建设 AI 基础设施的合同，与 Airbus 合作开发 Wingman 忠诚僚机 AI，并于
              2025 年初向乌克兰交付约 4,000 架 HF-1 无人机，另承诺再交付 6,000 套 HX-2。2025 年 4 月 Bloomberg 调查指控其无人机定价过高、软件故障频发，以及 2024 年
              Rheinmetall 合作关系破裂，都是值得尽调关注的实质负面信号。Helsing 2025 年 9 月与 ARX Robotics 合作、2025 年 10 月收购 Blue Ocean
              AUV，正在把竞争足迹延伸到 UGV-无人机和水下协同领域。Tekever（葡萄牙创立、英国总部）聚焦固定翼海上 ISR（AR5 系列、2025 年 €30 million EMSA 海事框架），但正通过英国陆军
              Project Nyx 忠诚僚机项目向自主打击扩张。ARX Robotics（慕尼黑，2022 年成立）已融资 €42 million，是向乌克兰供应西方无人地面车辆的最大供应商；它既是 Helsing
              伙伴，也是 Project A 被投公司。Quantum Systems（慕尼黑）提供 Trinity Pro VTOL ISR 无人机和 MOSAIC UXS 多域软件；它是 2026 年 4 月
              Bundeswehr 侦察到打击演习中的 STARK 生态伙伴，但如果加入打击能力，也可能成为竞争者。
