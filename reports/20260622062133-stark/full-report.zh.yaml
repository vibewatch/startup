    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与经营范围
        blocks:
          - type: paragraph
            body: >-
              最可信的定位是：STARK 是一家总部位于柏林的主权防务科技公司，而不是普通无人机初创公司。最强的身份依据来自公司落款：法律实体为 SKD SE，地址位于柏林 Französische Str.
              12，执行董事会配置也已经比一家成立仅一年的公司更成熟。官网、使命表述和系统页面显示，公司商业模式围绕三层相互连接的能力展开：执行打击任务的游荡弹药、用于持续巡逻和拦截的无人海上系统，以及把侦察、瞄准和交战串起来的软件。这个一体化定位很关键，因为它让
              STARK 从单一弹药故事，转向更广的、面向 NATO 的自主平台故事。公开材料也反复强调速度、规模和主权生产，说明公司卖的不只是某一款机体，也是在卖一套采购论点。公司称从创立到前线部署只用了 13
              个月，这在方向上令人印象深刻；但确切成立日期的公开文件仍然偏薄，尽调中需要确认。
