      - number: '7.5'
        title: 财务不透明、治理与资本风险
        blocks:
          - type: paragraph
            body: >-
              对一家处在独角兽估值的公司而言，STARK 的财务风险画像异常不透明。SKD SE 是一家低于大型公司披露门槛的德国 Societas Europaea，因此其 Bundesanzeiger
              备案只包含很少财务细节。公司没有公开发布经审计收入、毛利率、烧钱速度或 runway 数据。STARK 约 €1B 的估值被多家媒体（TechFundingNews、Manager Magazin 经
              Reuters、Deutsche Startups）引用，但公司本身没有直接发布正式融资公告，确认轮次规模、条款、投后估值或领投方。

              把一个巡飞弹项目从原型扩展到 BAAINBw 生产规模，需要在工装、质量管理体系、生产设施、供应链和团队上投入资本，而公开披露没有量化这些需求。一家员工少于 200 人、依靠 VC
              融资的初创公司，如果一边维持研发节奏，一边试图扩张到 Bundeswehr 合同规模，会面对复合型资本需求。德国国防初创如果未能在 VC
              耐心耗尽前把框架合同转化为量产交付，历史上曾陷入财务困境；这种「死亡谷」动态在 STARK 身上结构性存在。

              STARK 对 Founders Fund、Sequoia Capital、NIF Fund 和 IQT 的资本依赖，形成了 VC
              导向投资者集中度。这些投资者对国防硬件项目所需的多年、资本密集型量产爬坡，未必有充分胃口。政府补助（EDF、BMBF）可以补充股权资本，但会带来合规开销、报告要求和主权供应链条件，进而可能限制运营灵活性。
