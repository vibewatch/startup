  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资轮历史
        blocks:
          - type: paragraph
            body: >-
              STARK 的估值轨迹几乎完全由第三方媒体记录，而非公司官方声明。公司最后一个可公开验证的估值锚点，是 DroneXL 报道的 2025 年 8 月 Sequoia Capital $62 million
              轮次所设定的约 $500 million 投后估值。从 2025 年 8 月到 2026 年 2 月，大约六个月内，Deutsche Startups 和 TechFundingNews 两家第三方媒体均报道称
              Founders Fund（Peter Thiel）投资了「double-digit million EUR」金额，将估值推升至约 $1.2 billion（€1.1 billion），并确认 STARK
              成为独角兽。没有 STARK 官方新闻稿、监管备案或投资者声明确认 Founders Fund 投资金额或投后估值。

              报道中的 $1.2B 标记，相比 $500M 的 Sequoia 标记，在约六个月内提升了 140%。这次上调与 Bundeswehr 框架合同公告（2026 年 2 月 14 日）和未具名 NATO
              成员合同（2026 年 2 月 4 日）同时发生，提供了一个合理的催化叙事。不过，Bundeswehr 框架明确以 BAAINBw 产品资格成功为条件，且没有公开确认任何 call-off
              订单。缺少已确认收入意味着 $1.2B 标记是合同执行的纯前瞻期权，不是当前财务表现的反映。

              STARK 已披露的投资者基础——Sequoia Capital、Project A、NATO Innovation Fund、In-Q-Tel、8VC 和 Founders
              Fund——对于一家成立不到两年的国防硬件初创而言，质量和政府邻近性都异常高。NATO Innovation Fund 是一个由 24 个 NATO 盟国支持的 €1 billion
              基金，专门投资面向国防与安全挑战的深科技；其参与提供了超出商业 VC 信号的真正主权背书。In-Q-Tel 是 CIA 的战略风险投资机构；它的出现说明美国政府情报界对 STARK
              技术有兴趣，而这对依赖互操作性的 NATO 采购具有运营意义。这些战略背书信号是真正的估值正项，没有政府背书的同业难以复制。STARK 的德国商业登记（SKD SE，Amtsgericht
              Charlottenburg，HRB 260878 B）显示没有公开提交年度账目，这与一家 2024 年注册、尚未完成首个需要强制公开披露完整财年的公司一致。因此，考虑按报道的 $1.2B
              价格进入的投资者，必须完全依赖合同前瞻选择权和战略类比，而没有任何可公开验证的财务数据。
