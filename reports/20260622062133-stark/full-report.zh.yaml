      - number: '4.3'
        title: 成本结构、资本强度与制造经济性
        blocks:
          - type: paragraph
            body: >-
              STARK 的成本结构由三个天然资本密集领域主导：研发、弹头和部件库存、多地点生产与人员配置。公司披露，超过 45% 的总支出投向 R&D，远高于 European Defence Agency 对协作 R&T
              占国防总支出 2% 的集体基准，表明公司处于有意投资阶段，而不是利润率优化阶段。对照这一 R&D 强度，可比防务硬件初创公司在早期生产规模下的毛利率通常为 20% 至 45%，但没有公司特定数据可以收窄这一估计。

              公开记录中最不寻常的资本部署信号，是公司 2025 年 10 月声明称，已投资采购数千枚弹头，以确保 2027
              年前交付一套认证系统。这次预采购在合同收入赚到之前造成显著营运资本流出，且很可能以库存而非发生即费用的方式留在资产负债表上。多地点生产足迹——德国（总部）、英国（2025 年 7 月投产）、乌克兰（2,000
              sqm R&D 中心，200 多名专家）、瑞典（EW 工程）和希腊（区域办公室）——在多币种下增加了租金、设备和本地人员的固定成本。员工数在 2025 年从 120 增至
              400，进一步放大成本压力：按欧洲防务初创公司粗略混合全负担成本每人每年 €80,000–€120,000 计算，仅年化薪酬就接近 €32–€48 million；在设施和库存成本之前，月度现金消耗约 €3–€8
              million。这个估计高度不确定，因为实际薪酬组合、股权与现金薪酬比例，以及设施成本均未披露。
