      - number: '5.3'
        title: Minerva C2 软件、MOSA 架构与多域集成
        blocks:
          - type: paragraph
            body: >-
              Minerva 是 STARK
              的指挥控制软件，用于在陆、空、海域部署无人系统。公司将其描述为指挥与武器交战系统（CWES），设计目标是满足可认证武器效应的法律和军事要求。软件采用模块化开源架构（MOSA）；STARK
              称其提供完整数字主权、最大灵活性，并避免供应商锁定、面向未来。它通过标准化接口和开放协议集成其他制造商系统，在专有硬件和既有指挥流程之间充当中间件。Minerva
              的核心能力包括自动目标优先级排序、效应器选择、蜂群任务，以及从单一地面控制站执行组合式多域作战；操作员始终保留最终交战授权。

              2026 年 4 月 Bundeswehr 演习验证了 Minerva 与 Quantum Systems 的 Vector ISR 无人机在侦察到打击链中的集成，展示了数分钟内从发现到交战的能力。STARK
              称这是一个更长期项目的一部分，目标是在 2027 年前向 Bundeswehr 交付可扩展、可运行能力。2026 年 3 月宣布的 Six Robotics 合作，把挪威自主和蜂群软件加入 Minerva
              生态，把这套中间件延伸到北欧伙伴，并可能通过双边 Hansa Arrangement 连接其他 NATO 国家系统。鉴于 Minerva 明确采用开放接口设计，STARK 的 MOSA
              定位有可信度；但认证深度、国家主管机构认可状态，以及 Bundeswehr 演习之外的集成测试结果仍未公布，构成实质尽调缺口。
