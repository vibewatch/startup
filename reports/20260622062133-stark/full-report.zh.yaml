  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品目录、平台范围与系统架构
        blocks:
          - type: paragraph
            body: >-
              STARK 已公开披露五款产品，组成一套纵向整合的自主武器平台，覆盖空中打击、海上和软件层。Virtus（OWE-V）是旗舰固定翼游荡弹药，定位于对装甲目标和点目标执行远程精确打击。Cascade
              是管射效应器，设计目标是从车辆、船只或集装箱同时多发射器齐射，执行大规模饱和攻击。Gambit（OWE-Q）是一款可由单兵携带的折叠四旋翼，用于短程 ISR 和打击。Vanta 是无人水面艇家族，用于海上
              ISR、巡逻和海军威慑。Minerva 是 AI 驱动的指挥控制软件，负责编排四类硬件平台，并能通过标准化接口集成第三方无人系统。

              从产品命名和交叉引用可以看出清晰的架构意图：Minerva 充当大脑，三类弹药平台在不同射程带和机动画像中充当效应器，Vanta 则把杀伤链延伸到海上域。STARK 明确把 Minerva
              描述为中间件，连接自有系统和其他制造商系统——这把整套栈定位为开放架构欧洲平台，而非封闭的单供应商系统。招聘页面显示公司正在招聘软件工程师、嵌入式系统和系统集成岗位，符合平台优先的开发策略。五款产品在 STARK
              官网都有专门产品页，但除公司自写规格外，独立技术验证有限。
