      - number: '8.5'
        title: 退出准备度与战略价值评估
        blocks:
          - type: paragraph
            body: >-
              STARK 的退出准备度仍处早期。公司成立于 2024 年，拥有一个框架合同，没有已确认 call-off 收入，产品资格记录存在争议。按报道的 $1.2B 标记，早期投资者（Sequoia、Project
              A）已经有显著账面收益，但流动性路径需要三类退出之一：战略收购、二级出售或最终 IPO。

              大型国防主承包商的战略收购，是最可能的流动性路径。Rheinmetall 是最突出的自然收购方：它已经在 STARK 董事会有席位，核心能力互补（Rheinmetall 供应装甲车、火炮和弹药，而不是 AI
              自主巡飞弹），也展示过收购式增长胃口（2025 年 9 月收购 Blohm+Voss）。其他可信收购方包括 BAE Systems、Safran、Thales 和 L3Harris；这些公司都表达过对欧洲主权
              AI 国防能力的战略兴趣。战略收购方若要在 $1.2B 之上支付溢价，需要 Virtus 资格确认、可展示的 call-off 交付记录，以及持续的 Bundeswehr 关系排他性。AeroVironment
              以 $4.1 billion 收购 BlueHalo（2025 年 5 月）——一个定向能和反 UAS
              技术平台——说明战略收购方会为可防御的细分能力支付实质溢价。作为同类巡飞弹专门公司，AeroVironment 也可能是潜在收购方，尽管 STARK 的欧洲主权身份和 EU EDIS
              定位可能让一笔美国买方交易更复杂。

              二级出售路径受到 cap table 中 In-Q-Tel 和 NIF 存在的支持。两家机构都有战略理由持有 STARK 敞口，持有期可能超过典型 VC；早期投资者把股份二级出售给主权财富基金、Paladin
              Capital 这类国防专项基金，或欧洲机构投资者，可以在不进行完整退出的情况下提供流动性。该路径不依赖产品资格确认，因此在基准或空头情景下更容易实现。

              IPO 在结构上可能——Anduril 和 AeroVironment 说明国防科技公开上市可获得溢价估值——但需要多年路径，建立收入透明度、盈利轨迹和客户多元化，而 STARK
              尚未证明这些能力。如果产品资格和初始交付按多头排期推进，2028–2030 年窗口是最早可信 IPO 时间。In-Q-Tel 的参与增加了一条面向美国政府的退出路径，可能加速 L3Harris、Northrop
              Grumman 或 Textron 等美国主承包商的战略买方兴趣；这些公司各自都有欧洲无人机收购先例。欧洲国防科技整体 M&A
              环境活跃（Rheinmetall/Blohm+Voss、AeroVironment/BlueHalo、Saab 战略 AI 国防合作），验证了战略价值叙事——但这股顺风惠及所有欧洲国防科技资产，并非 STARK
              独享。
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
