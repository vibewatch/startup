      - number: '1.3'
        title: 里程碑、合同与规模化证据
        blocks:
          - type: paragraph
            body: >-
              对一家似乎在 2024 年才成形的公司来说，STARK 的里程碑记录异常密集。到 2025 年末，STARK 已经公开宣传乌克兰部署、Vanta 的 NATO 海上试验，以及任命一名专攻防务增长的 CEO。到
              2026 年初，公司又宣布为电子战人才设立瑞典据点、在乌克兰设立 2,000 平方米且容纳 200 多名专家的 R&D 中心、开设希腊办公室、获得第二个未具名 NATO 成员国合同，最重要的是与
              Bundeswehr 签下数千套 Virtus 系统的框架协议。这些披露重要，因为它们证明的不只是概念阶段话术，而是买方拉力和制造野心。2026 年 4 月的 Bundeswehr 演习还显示，STARK 把
              Virtus、Minerva 与 Quantum Systems 的 Vector ISR 无人机整合进一条侦察到打击链，支持了一个判断：STARK
              正试图成为更广欧洲自主系统栈的一部分。即便如此，公开数据仍未披露合同金额、生产良率、单位经济性或保障义务；因此，证据对战略动能的支撑强于对财务可预测性的支撑。
