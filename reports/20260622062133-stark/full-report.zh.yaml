  - id: TV005
    title: 论点破裂与终止触发项表
    notes: 触发项按当前证据下的发生可能性排序。阈值 / 事件列出构成触发的可观察条件。传导路径说明触发项如何损害投资论点。
    columns:
      - 触发项
      - 阈值或事件
      - 对论点的传导
      - 行动含义
    rows:
      - - BAAINBw Virtus 资质失败或暂停
        - 独立报告或 BAAINBw 官方通知确认测试失败、资质路径暂停，或撤回框架条件批准
        - 收入论点崩塌；框架无法转化为 call-off 订单；熊市场景落地；收入确认前 Bundeswehr 关系受损
        - 若已持有，立即卖出或对冲；停止考虑入场；等重新资质尝试结果出来后再重新介入
      - - Founders Fund 或 Sequoia 以较 $1.2B 重大折价二级出售
        - 已确认二级市场交易将 STARK 股权定价低于 $900M
        - 聪明钱发出恶化信号；早期投资人与后期入场者之间的信息不对称加剧；$1.2B 标记被确认是价格峰值
        - 降低敞口或同步退出；继续投入资本前，要求透明说明投资人动机
      - - 下一轮融资中官方确认估值显著低于 $1.2B
        - STARK 官方 term sheet 或交割公告显示投后估值低于 $1.0B
        - 第三方报道被夸大；当前标记高于可验证公允价值；其他投资人接受更低价格，表明交易条款发生根本变化
        - 下轮场景启动；此前按 $1.2B 入场立即出现按市值计价损失；按确认清算价格和稀释后 IRR 重评
      - - 有约束力的 LAWS 禁令或德国全国暂停 AI 瞄准打击系统
        - UN 层面通过 CCW 约束性议定书；或联邦内阁暂停开发适用于 Virtus 的 AI 选择目标致命自主武器
        - 核心产品商业化受损；AI 瞄准功能受限或被移除；需要重新设计产品；EU/NATO 出口认证被撤回
        - 停止新增投资；按季度监测 UN GGE 和 Bundestag 自主武器委员会；就产品范围聘请法律顾问
    claimRefs:
