  rows:
  - - NATO land forces - loitering munitions
    - National defence ministry acquisition office (e.g. BAAINBw in Germany)
    - Brigade and battalion operators at tactical level
    - National defence ministry
    - Qualification -> budget committee approval -> framework contract -> phased delivery
    - Defence ministry procurement budget; special funds (Zeitenwende in Germany)
    - Identified capability gap, Ukraine lessons, NATO capability target requirement
  - - NATO naval / maritime forces - USV patrol
    - National navy procurement command; NATO maritime command
    - Surface action group commanders; patrol unit operators
    - National navy budget; NATO maritime program budgets
    - Concept-of-operations development -> sea trials (e.g. REP/MUS) -> procurement decision
    - Navy capex and operational budget
    - NATO maritime domain awareness gaps; undersea cable and shipping lane protection mandate
  - - Allied / partner military forces - loitering munitions
    - Allied defence ministry or procurement agency (e.g. Estonia, Baltic states)
    - Infantry and artillery fire-support units
    - Allied national defence budget
    - Expedited off-the-shelf procurement enabled by NATO interoperability and prior validation
    - National defence ministry and NATO capability-funding programs
    - Urgency from proximity to Russia; NATO collective capability targets
  - - Ukraine active-combat buyer
    - Ukrainian MoD or frontline procurement channel
    - Front-line operators in active conflict
    - Ukrainian defence budget; allied weapon support programs
    - Direct wartime procurement; accelerated qualification under combat conditions
    - Ukrainian defence ministry; allied military aid programs
    - Active high-intensity conflict requiring immediate strike capability
  - - Future commercial maritime security (adjacent)
    - Maritime security agencies, coast guards, critical infrastructure operators
    - Patrol operators and monitoring centres
    - Government security budgets; port and energy-sector security spending
    - Pilot programs -> regulatory approval -> operational deployment
    - National security ministry or regulatory agency
    - Pipeline and cable protection mandates; illicit-activity interdiction requirements
  notes: These buyer rows are representative archetypes, not a verified account list. The workflow column highlights that the payer (defence ministry budget committee) and the user (tactical operator) are always distinct in defence procurement, and that qualification and certification drive adoption timing more than product capability alone.
