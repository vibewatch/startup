      detail: Germany EUR 1.2B (~$1.4B) alone as the most concrete single-country procurement commitment for off-the-shelf loitering munitions; highly conservative because only one of 32 NATO members.
      source: Mordor Intelligence + globalsecurity.org
      tone: neutral
    - label: Base - top-3 European frameworks combined
      low: 3.5
      mid: 4.2
      high: 4.9
      unit: $B
      detail: Germany EUR 1.2B + France EUR 2B + Estonia EUR 0.4B = EUR 3.6B (~$4.2B) in disclosed or publicly estimated loitering munition procurement frameworks across three NATO members; mid uses 1.17 EUR/USD.
      source: Mordor Intelligence + globalsecurity.org
      tone: neutral
    - label: High - European share of global market by 2030
      low: 5.0
      mid: 6.5
      high: 8.0
      unit: $B
