    - label: NATO members with defence budget commitment
      value: 32
      description: All 32 NATO members have made political commitments to reach 2% GDP on defence; at least 23 met this target in 2024 according to NATO data, creating the broadest potential buyer pool.
    - label: Members with active loitering munition programs
      value: 10
      description: Mordor identifies a subset of NATO European members with active loitering munition procurement programs; includes Germany, France, Estonia, and others; exact count not publicly disclosed.
    - label: Programs with European-origin requirement or preference
      value: 5
      description: EDIS and EDA benchmarks create explicit preference for European Defence Technological and Industrial Base (EDTIB) sources, narrowing the field for US and Israeli suppliers and favouring STARK's sovereign positioning.
    - label: Programmes where STARK has qualified or is trialling
      value: 2
      description: As of 2026-06, STARK has disclosed active qualification and delivery in Germany (Bundeswehr Virtus framework) and one unnamed second NATO member state; Vanta is in NATO maritime trials.
    - label: Signed framework agreements delivering revenue
      value: 1
      description: One publicly confirmed framework agreement (Bundeswehr Virtus, Feb 2026) with phased delivery starting 2026; the second NATO member contract was also announced but framework terms not disclosed.
