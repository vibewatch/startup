chapter:
  number: 2
  title: Market Analysis
  summary: STARK operates at the intersection of three high-growth defence-technology segments - loitering munitions, autonomous maritime patrol, and AI-enabled command-and-control software - against a backdrop of the sharpest increase in global military expenditure since 1988. The global loitering munition market sits at roughly $636 million in 2025 growing to $1.07 billion by 2030 (Mordor, 10.89% CAGR), while the unmanned surface vehicle market stands at $1.13 billion in 2025 on a path to $2.18 billion by 2030 (Mordor, 13.98% CAGR). STARK's SAM is concentrated in NATO/EU defence procurement budgets, where Germany alone earmarked EUR 1.2 billion for immediate loitering munition off-the-shelf purchases and France committed EUR 2 billion for 1,800 loitering munitions. Buyer access requires navigating defence acquisition offices and budget committees, making procurement timelines the binding constraint. Disconfirming angles include autonomous weapon regulation risk from the ICRC and HRW, MTCR Category I export controls on systems above 100 km range, and historical Bundeswehr risk aversion that can extend qualification cycles despite political appetite to accelerate.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'STARK''s addressable market spans three interconnected sub-markets: (1) loitering munitions - also called one-way attack drones or OWA-UAS - for land-based or air-launched precision strike at ranges from tens to hundreds of kilometres; (2) autonomous unmanned surface vessels (USVs) for maritime patrol, ISR, and in future strike operations; and (3) AI-enabled command-and-control software (Minerva) that ties multiple unmanned platforms into networked strike chains. Included spend covers expenditure by defence ministries, armed forces procurement agencies, and allied-nation capability programs for hardware, integration, software, and sustainment of these autonomous systems. Excluded spend includes commercial drone markets, civilian logistics drones, non-defence ISR satellites, traditional artillery, conventional cruise missiles, and manned combat aviation - all of which can partially substitute for STARK''s products. Status-quo substitutes remain important: legacy precision-guided munitions and manned strike aircraft provide the same battlefield output at higher cost and lower mass-production potential, while conventional patrol vessels and coast guard cutters cover the maritime-domain awareness mission at much higher per-unit cost and personnel exposure. The relevant market boundary sits where buyers need (a) affordable mass, (b) reduced personnel risk, and (c) AI-enabled targeting speed that conventional platforms cannot match at equivalent cost. STARK''s systems specifically address NATO member states'' identified capability gaps in man-in-the-loop strike at range, maritime persistent presence, and multi-domain recce-to-strike timelines, which distinguishes the addressable market from broader unmanned-systems or defence-electronics totals.'
