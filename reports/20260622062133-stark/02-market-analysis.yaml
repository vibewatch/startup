- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver or constraint
  - Direction
  - Timing
  - Evidence
  - Implication for STARK
  - Diligence ask
  rows:
  - - European rearmament (SIPRI global military-expenditure surge)
    - Driver
    - Current and ongoing
    - SIPRI $2,718B in 2024; 9.4% increase, steepest since 1988; spending increased 10 consecutive years
    - Enlarges the addressable budget pool across all NATO European member states
    - Verify which specific procurement line items STARK is eligible to receive from expanded budgets
  - - Ukraine combat validation of loitering munitions
    - Driver
    - Short to medium term
    - 'Mordor: battlefield success compressed US Marine Corps and French procurement timelines; Germany earmarked EUR 1.2B for off-the-shelf purchases'
    - Accelerates qualification timelines; STARK Virtus referenced in Bundeswehr exercise context
    - Track how continued Ukraine conflict affects European procurement cycles
  - - EU EDIS European defence industrial strategy
    - Driver
    - Medium term (2025-2035 target)
    - EU EDIS sets collaborative procurement goals and EDTIB strengthening as policy; EDA benchmarks reward European equipment sourcing
    - Creates political and procurement incentives for member states to choose sovereign European suppliers
    - Determine how EDIS procurement incentives translate into specific contract criteria STARK can satisfy
  - - Germany EUR 500B expanded defence investment framework
    - Driver
    - Short to medium term (2025 onward)
    - Bundestag approved EUR 500B framework relaxing debt brake March 2025; EUR 52B military package Dec 2025; trajectory to 2.8-3.5% GDP
    - Germany is STARK's primary market; structural budget increase sustains multi-year procurement pipeline
    - Verify how much of Germany's procurement pipeline STARK is formally competing for beyond the initial Virtus framework
  - - Autonomous weapon regulation (ICRC, HRW, CCW talks)
    - Constraint
    - Medium to long term
    - ICRC recommends legally binding rules including prohibition on systems targeting persons; HRW campaigns for binding treaty
    - Could restrict or delay deployment of more automated configurations of Virtus, Cascade, or Minerva
    - Assess STARK's design compliance posture relative to ICRC/HRW minimum criteria for human-in-the-loop control
  - - Export controls (MTCR - systems above 100 km range)
    - Constraint
    - Current
    - 'Mordor: US added loitering munition components to missile-technology control list April 2025; EU harmonised licence questionnaires'
    - Virtus at 130 km range sits at the edge of Category I sensitivity; international sales outside NATO/EU face licence scrutiny
    - Clarify STARK's export-control classification for Virtus; determine which export markets are structurally foreclosed
  - - Electronic warfare countermeasures
    - Constraint
    - Current and ongoing
    - 'Mordor: Russian EW reportedly cut GNSS availability for small drones to 18 seconds in Donbas; EW hardening raises unit cost up to 8%'
    - Forces R&D investment in jam-resistant navigation; raises production cost
    - Request STARK's EW hardening roadmap and how it affects Virtus unit economics at scale
  - - Bundeswehr qualification and procurement cycle length
    - Constraint
    - Short to medium term
    - 'globalsecurity.org: Bundeswehr procurement historically characterised by risk aversion and perfectionism; large purchases need Budget Committee approval'
    - Even with political urgency, framework-to-delivery timelines can extend; qualification for new variants may require new test cycles
    - Quantify how long full Virtus certification took and what qualification hurdles remain for next-generation variants
  notes: The table distinguishes between drivers that expand the budget envelope (macro) and drivers that accelerate procurement decisions (micro), and between regulatory constraints (long-term, legal) and technical constraints (current, cost-focused).
