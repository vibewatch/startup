  evidenceGaps:
  - type: missing-source
    severity: material
    topic: ai-c2-software-market-size
    missingEvidence: No third-party analyst estimate for the military AI C2 software sub-market exists in publicly accessible sources reviewed for this chapter; Minerva's standalone market opportunity cannot be sized from open data.
    whyItMatters: Minerva's software layer could carry higher margins and more durable competitive moats than hardware products; without a market-size anchor the SOM calculation for the software layer cannot be completed.
    diligencePath: Commission or obtain independent market-sizing study for military AI C2 software; review adjacent markets such as battlefield management systems for proxy data.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-values-and-unit-economics
    missingEvidence: No contract values, ASPs, or unit-economics information have been disclosed for any STARK product; the Bundeswehr framework and second NATO member state contract remain unpriced in public sources.
    whyItMatters: Without contract values it is impossible to verify SOM conversion from SAM or to compare STARK's unit pricing against French, Israeli, or US competitors.
    diligencePath: Request signed framework-contract details, ASP schedules, and backlog information under NDA; compare against comparable disclosed contracts (e.g. Estonia, AeroVironment).
    relatedQuestionRefs:
    - QM012
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: european-loitering-munition-market-share
    missingEvidence: No public analyst report provides a direct European share of the global loitering munition market or a Europe-only market size figure; the EUR 3.6B floor is constructed from three disclosed national commitments and cannot be verified as comprehensive.
    whyItMatters: STARK's SAM is concentrated in the European NATO market and the EUR 3.6B floor may significantly undercount total European demand (Poland, Nordic states, Southern flank nations are absent from disclosed data).
    diligencePath: Obtain or commission European-specific loitering munition market sizing; survey NATO procurement databases and national defence white papers for additional country-level demand data.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: product-qualification-reliability
    missingEvidence: The adverse DroneXL report of four missed strikes in October 2025 trials and the STARK rebuttal remain unreconciled in public sources; the subsequent Bundeswehr framework award is consistent with STARK's account but does not independently validate all reliability claims.
    whyItMatters: Procurement adoption is constrained by product reliability; if adverse trial evidence resurfaces in subsequent qualification cycles it could delay or limit scale-up.
    diligencePath: Request independent after-action reports from Bundeswehr Virtus testing; obtain current field-failure rates, warranty data, and qualification test results.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: nato-capability-targets-loitering-munition
    missingEvidence: No publicly accessible NATO document specifies formal member-state capability targets for loitering munitions by name; the NATO Defence Planning Process requires that member states meet capability targets but target specifics are not published.
    whyItMatters: Formal NATO capability targets for loitering munitions would be a key procurement trigger for allied nations and help bound the SAM more precisely; without them the analyst must infer from national budgets and disclosed programs.
    diligencePath: Request NATO Defence Planning Process outputs for loitering munition capability codes; review partner-nation procurement white papers.
    relatedQuestionRefs:
    - QM014
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: european-incumbent-supplier-relationships
    missingEvidence: No comprehensive public source documents which European NATO member states have existing loitering munition supplier relationships with AeroVironment, Israel Aerospace Industries, or other incumbents that would constrain STARK's SAM.
    whyItMatters: Incumbent procurement relationships in defence can be difficult to displace; knowing which countries already have long-term contracts with competing suppliers narrows STARK's realistic SAM from the EUR 3.6B floor.
    diligencePath: Survey national defence procurement records and NATO tender databases; review trade press coverage of European loitering munition award announcements.
    relatedQuestionRefs:
    - QM016
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: startup-financial-resilience-for-framework-contracts
    missingEvidence: No public revenue, backlog, cash burn, or balance-sheet data has been disclosed for STARK; buyers evaluating multi-year framework contracts need financial durability evidence before committing long-term.
    whyItMatters: Procurement adoption risk includes supplier insolvency during a multi-year framework delivery window; without financial disclosures, procurement officials and diligence teams cannot assess whether STARK can sustain delivery over 2-3 years.
    diligencePath: Request audited management accounts, latest balance sheet, and cash position from STARK under NDA; compare capitalisation against comparable defence startup delivery obligations.
    relatedQuestionRefs:
    - QM028
