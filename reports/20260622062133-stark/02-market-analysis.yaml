figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: Market sizing layers from broadest context to narrowest evidence-constrained floor for STARK's addressable opportunity, illustrating why no single TAM captures all three product lines.
  data:
    items:
    - label: Global military expenditure (macro context)
      value: $2,718B (2024)
      detail: SIPRI total world military spend; serves as macro demand context showing that defence budgets globally hit a 36-year high in growth rate, providing the underlying budget pool from which STARK's niche is carved.
      tone: neutral
    - label: Global loitering munition + USV market (product TAM)
      value: ~$1.77B combined in 2025
      detail: Mordor loitering munition ($636M in 2025) + Mordor USV ($1.13B in 2025) combined hardware markets; growing to ~$3.25B by 2030 at blended ~12% CAGR; excludes AI C2 software for which no public sizing exists.
      tone: neutral
    - label: European NATO loitering munition SAM floor
      value: EUR 3.6B+ (three countries)
      detail: Sum of Germany EUR 1.2B + France EUR 2B + Estonia EUR 0.4B disclosed national procurement commitments for loitering munitions; covers only three of 32 NATO members so is a floor, not a ceiling.
      tone: neutral
    - label: STARK disclosed contract base (SOM evidence)
      value: Several thousand Virtus (Germany) + second unnamed NATO member
      detail: Only directly disclosed framework agreements as of 2026-06; company has not published contract values, unit economics, or ASP, making this an evidence floor, not a revenue projection.
      tone: neutral
