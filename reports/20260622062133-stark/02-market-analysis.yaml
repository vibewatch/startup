tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to STARK
  rows:
  - - Loitering munitions (land / air strike)
    - Procurement, integration, and sustainment of man-in-the-loop strike drones 20-200 km range; software updates, training, logistics
    - Commercial FPV drones, agriculture drones, non-weaponised ISR-only drones, conventional cruise missiles, guided artillery shells
    - Defence ministries, armed forces acquisition commands, NATO capability-target programs
    - Core wedge; Virtus at 130 km competes in medium-to-long range segment with fastest CAGR
  - - Autonomous maritime patrol / ISR (USV)
    - Procurement and operation of unmanned surface vessels for patrol, escort, harbour control, over-the-horizon investigation, and littoral ISR
    - Commercial port logistics vessels, civilian offshore survey vessels, subsurface autonomous systems
    - National navies, coast guards, NATO maritime command, allied nation maritime-security programs
    - Core wedge; Vanta-4 and Vanta-6 target the defence-USV segment growing at 14.81% CAGR
  - - AI command-and-control software (C2/BAMS)
    - Multi-platform mission management software, autonomy stack, battle management integration, targeting workflow, and ISR fusion
    - Standalone commercial AI software, non-military analytics platforms
    - Defence primes, armed forces digital commands, national military integration programs
    - Core differentiator; Minerva ties hardware products into multi-domain kill chains; no standalone TAM available
  - - Status-quo substitutes
    - Manned strike aviation, conventional precision artillery, manned patrol vessels, existing battlefield management systems
    - Hardware that STARK replaces rather than supplements
    - Same defence ministries and armed forces commands as primary segments
    - Defines pricing ceiling; addressable when STARK displaces or complements these systems
  notes: This table separates STARK's three product layers from status-quo substitutes to clarify the correct boundary for market sizing rather than inflating the addressable market by adding all defence spend.
