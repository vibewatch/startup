- id: FM003
  title: Buyer / segment map
  type: flow
  layout: standard
  summary: Procurement flow from NATO/EU policy mandate through national ministry, procurement office, and budget committee approval to STARK product deployment, showing the multi-gated defence acquisition process that differentiates this market from commercial sales.
  data:
    nodes:
    - id: policy
      label: NATO/EU policy mandate
      detail: NATO 2% GDP target, capability requirements, EDIS European industrial incentives create top-down procurement pressure on member-state ministries.
      tone: neutral
    - id: ministry
      label: National defence ministry
      detail: Political budget decision; special fund allocation (e.g. Germany Zeitenwende EUR 100B, EUR 500B expanded framework) determines overall procurement envelope.
      tone: neutral
    - id: procurement
      label: Defence procurement office
      detail: BAAINBw (Germany) or equivalent national procurement bureau; requirement definition, market research, RFP/RFQ, supplier qualification.
      tone: neutral
    - id: budget
      label: Parliamentary budget committee
      detail: Formal approval gate for large-scale acquisitions; Bundestag Budget Committee approved Virtus framework on 25 February 2026; added latency in procurement cycle.
      tone: neutral
    - id: trials
      label: Joint qualification / trials
      detail: Multi-phase testing with armed forces; STARK completed extensive Bundeswehr joint testing for Virtus before framework agreement; adverse trial history (Oct 2025) is a risk at this stage.
      tone: neutral
    - id: framework
      label: Framework agreement
      detail: Legally binding multi-year contract; STARK signed Bundeswehr Virtus framework Feb 2026; EDIS policy favours European-origin equipment at this stage.
      tone: positive
    - id: delivery
      label: Phased delivery and integration
      detail: Production scale-up; delivery beginning 2026; full delivery within 2 years of qualification; Virtus VTOL enables reuse training.
      tone: neutral
    - id: operator
      label: Military operator
      detail: Brigade 45 (Lithuania) and other Bundeswehr units; NATO maritime forces (Vanta); Ukraine (active combat buyer).
      tone: positive
    edges:
    - from: policy
      to: ministry
    - from: ministry
      to: procurement
    - from: procurement
      to: budget
    - from: budget
      to: trials
    - from: trials
      to: framework
    - from: framework
      to: delivery
    - from: delivery
      to: operator
