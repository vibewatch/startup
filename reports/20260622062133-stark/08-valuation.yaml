  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: BAAINBw Virtus qualification certificate
      missingEvidence: >-
        Official BAAINBw documentation (MPCV or equivalent) confirming that Virtus has
        received formal military qualification for Bundeswehr production deliveries and
        call-off order issuance under the February 2026 framework.
      whyItMatters: >-
        The framework contract does not generate revenue without this; it is the single most
        material thesis-confirming piece of evidence absent from the public record. The
        DroneXL adverse test report cannot be dismissed without it.
      diligencePath: >-
        Request formal qualification status from STARK under NDA; independently verify with
        BAAINBw procurement office; review BWB procurement notices in Bundesanzeiger for
        any Virtus qualification reference.
      relatedQuestionRefs:
