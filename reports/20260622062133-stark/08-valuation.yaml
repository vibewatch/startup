  - id: TV002
    title: Thesis and anti-thesis table
    notes: >-
      Each argument is grounded in evidence from prior chapters and this chapter. The 'what would
      change the view' column identifies the specific evidence that would shift the argument from
      thesis to confirmed or anti-thesis to resolved.
    columns:
      - Argument
