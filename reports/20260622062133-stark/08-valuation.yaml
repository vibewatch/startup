      - - 'Thesis — first-mover European sovereign loitering munition franchise with Bundeswehr anchor'
        - February 2026 Bundeswehr framework for several thousand Virtus; Bundestag Budget Committee
          approval; no other EU-sovereign loitering munition startup holds an equivalent framework
        - Loss of Bundeswehr framework through qualification failure or contract cancellation;
          Helsing or AeroVironment achieving equivalent EU-sovereign qualification first
      - - 'Thesis — Germany''s €83B 2025 procurement tailwind and NATO rearmament urgency'
        - >-
          €83B across 103 major Bundeswehr projects in 2025 (DefenseNews); SIPRI 9.4% YoY increase
          in world military expenditure 2024; NATO 2% GDP floor exceeded by most members
        - Structural reversal in German or NATO defence budgets; political normalisation reducing
          the urgency premium embedded in procurement timelines
      - - >-
          Thesis — strategic investor base (NIF, In-Q-Tel, Sequoia) provides sovereign endorsement
          and downside protection
        - NIF is a €1B fund backed by 24 NATO allies; In-Q-Tel is the CIA's strategic VC arm;
          these institutions rarely invest without serious due diligence on strategic fit
        - Investor exit at a material discount; governance dispute; NIF or In-Q-Tel secondary sale
          signalling deterioration of confidence
      - - 'Anti-thesis — valuation is unconfirmed and based on single third-party media report'
        - Deutsche Startups (16 Feb 2026) and TechFundingNews (13 Feb 2026) both report $1.2B;
          no official STARK statement, press release, or filing confirms the valuation
        - Official STARK or Founders Fund confirmation with cap table documentation; formal
          registration of the investment in company records
      - - 'Anti-thesis — product qualification contested by DroneXL four-strikes adverse record'
        - >-
          DroneXL (Oct 2025) — Virtus failed all four strike tests in October 2025 military trials;
          STARK rebuttal asserts developmental nature of tests; no independent corroboration of
          either account
        - BAAINBw formal qualification certificate (MPCV or equivalent); independent third-party
          test-sponsor record from October 2025 trials
      - - 'Anti-thesis — zero public financial disclosure at a unicorn valuation is structurally anomalous'
        - >-
          Bundesanzeiger shows no filed annual accounts for SKD SE as of June 2026; no revenue,
          margin, burn rate, or capital adequacy disclosed anywhere in public sources
        - Audited financial statements under NDA with recognised Bundeswehr framework revenue;
          at minimum, a CEO-confirmed revenue range in any public forum
