        - QV011

    - id: CV002
      statement: >-
        STARK's last publicly confirmed valuation anchor is the approximately $500 million
        post-money mark set by Sequoia Capital's $62 million round in August 2025, as reported
        by DroneXL; this represents a 140% step-up to the reported $1.2B in February 2026.
      type: third-party-reported
      topic: funding-history
      sourceRefs:
        - SV003
        - SV019
      confidence: medium
      freshness: recent
      answersQuestionRefs:
        - QV006

    - id: CV003
      statement: >-
        The $1.2B-to-$500M valuation step-up of approximately 140% in six months coincides
        with the Bundeswehr framework announcement (February 2026) but precedes any publicly
        confirmed product qualification, call-off order, or revenue recognition event; the step-up
        is therefore driven by contract optionality, not delivered financial performance.
      type: inferred
      topic: valuation-step-up
      sourceRefs:
