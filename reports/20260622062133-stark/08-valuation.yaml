  - id: comparable-analysis
    title: Comparable Valuation Analysis
    body: >-
      Four reference frameworks are available for benchmarking STARK's $1.2B reported valuation:
      private-round comparables among European and US defence AI unicorns, public-market P/S multiples
      from the closest listed company (AeroVironment), incumbent defence prime revenue multiples
      (Rheinmetall), and a funding-to-valuation ratio analysis against Helsing.

      Among private comparables, Helsing SE is the closest European reference. Helsing reached a
      €12 billion valuation in its June 2025 round at €1.37 billion total raised, yielding a
      funding-to-valuation multiple of approximately 9x. STARK's reported $1.2B at approximately
      $100M raised implies a ~12x multiple — meaningfully higher than Helsing despite a product
      proof record that is materially weaker. Helsing has deployed thousands of HX-2 and HF-1
      loitering munitions in Ukraine, holds Bundeswehr AI contracts, and is integrated into the
      FCAS programme. At the time Helsing reached a €1.7B post-money in its September 2023 Series B,
      it already had multiple years of Bundeswehr partnership and Ukraine activity behind it. STARK
      is attempting to achieve a comparable valuation trajectory in roughly one year from founding.

      Anduril Industries reported approximately $2 billion in revenue for 2025 at an implied
      valuation of approximately $28.7 billion, yielding a revenue multiple of roughly 14x. This
      multiple reflects product scale, Pentagon contract depth, Lattice OS platform revenue, and
      a manufacturing base (including a $1 billion Ohio facility) that STARK does not possess.
      Shield AI's $12.7 billion March 2026 Series G valuation similarly rests on documented Hivemind
      AI autonomy deployments across multiple US military platforms.

      AeroVironment provides the most directly applicable public-market reference as a loitering
      munition specialist. With FY2025 revenue of $820.6 million, an operating income of $146.4
      million (17.9% margin), and a market capitalisation of approximately $8.58 billion as of
      June 2026, AeroVironment trades at approximately 10.5x trailing revenue. Applying this
      multiple to STARK's $1.2B reported valuation implies a required revenue run-rate of
      approximately $114 million — a figure STARK has not disclosed and is unlikely to have
      achieved given its 2024 founding date and qualification-conditional framework.

      Rheinmetall's public-market revenue multiple of approximately 2.5x on €9.75B in 2024 revenue
      represents an incumbent-prime discount, not a growth premium. It is not a direct valuation
      benchmark for STARK but serves as a ceiling reference for what mature European defence
      companies trade at. The implied acquisition premium Rheinmetall would need to pay over its
      own multiple to buy STARK at $1.2B represents a 4-5x multiple expansion over the incumbent
      norm, which is only justifiable if STARK contributes uniquely defensible AI autonomy
      capability and confirmed revenue trajectory.
