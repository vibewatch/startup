  - id: TV004
    title: Comparable valuation table
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >-
        Five comparables selected as the most relevant publicly documented reference set:
        one European AI defence peer (Helsing), two US AI defence platforms (Anduril, Shield AI),
        one public-market loitering munition specialist (AeroVironment), and one European defence
        prime (Rheinmetall). Excludes Israeli incumbents, Ukrainian manufacturers, and smaller EU
        startups for which mid-2026 valuation data is not publicly available.
    notes: >-
      Revenue and valuation data from Wikipedia-cited sources, SEC filings, and financial data
      providers as of mid-2026. Private company valuations are last-round post-money marks and may
      differ from fair market value. STARK revenue is undisclosed; P/S multiples therefore show
      what revenue would be required to justify its reported valuation at peer multiples.
    columns:
      - Comparable
      - Stage and scale
      - Key metric and multiple
      - Relevance to STARK valuation
      - Limitation
    rows:
      - - Helsing SE (Germany)
        - Private; Series C/D equivalent; €1.37B raised; €12B valuation (Jun 2025)
        - 'Funding-to-valuation ~9x; revenue undisclosed; Ukraine-combat-deployed HX-2 and HF-1'
        - Closest European comparable; AI loitering munition; Bundeswehr contracts; sovereign EU brand
        - Helsing has 3+ years more product proof, multiple government contracts, and a combat
          deployment record STARK has not matched; €12B is 10x STARK reported mark
      - - Anduril Industries (US)
        - Late-stage private; ~$28.7B implied; $2B revenue FY2025; 7,000 employees
        - 'P/S ~14x on $2B revenue; Lattice OS platform; $1B Ohio manufacturing facility'
        - US defence AI platform benchmark; demonstrates 10–15x P/S achievable for proven platforms
        - Primarily US DoD; no EU procurement track record; revenue base fundamentally different
          from STARK's framework-conditional starting point
      - - Shield AI (US)
        - Late-stage private; $12.7B valuation (Mar 2026 Series G of $1.5B)
        - 'Valuation $12.7B; revenue undisclosed but documented DoD Hivemind deployments'
        - AI autonomy in military platforms; GPS-denied operations; Pentagon contract depth
        - No loitering munition product; minimal EU presence; air-force autonomy vs strike focus;
          $12.7B is 10.6x STARK reported mark
      - - AeroVironment Inc — NASDAQ AVAV
        - Public company; $820M FY2025 revenue; market cap $8.58B (Jun 2026)
        - 'P/S ~10.5x; operating margin 17.9%; 50,000+ Switchblade/Puma deployments across 55+ countries'
        - Only public-market loitering munition specialist; P/S anchor for STARK implied revenue
          requirement of ~$114M to justify $1.2B at equivalent multiple
        - Public market discount vs private growth premium; 15+ year qualification and deployment
          history; STARK has zero confirmed delivery revenue
      - - Rheinmetall AG — DAX listed
        - Public DAX prime; €9.75B revenue (2024); ~€24B market cap; 40,000 employees
        - 'Revenue multiple ~2.5x (mature incumbent); EBIT margin ~15%; Germany''s largest prime'
