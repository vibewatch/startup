        - DroneXL adverse report prescient; regime change in German defence procurement leadership;
          Rhinemetall or Helsing acquisition of STARK assets below entry price
        - Low-medium; not dismissible given unresolved DroneXL record; sovereign investor base and
          Bundeswehr relationship provide a floor preventing near-zero scenarios
