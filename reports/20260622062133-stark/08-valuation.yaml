figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Causal chain from STARK's key evidence signals through valuation judgment to the final
      Track recommendation, showing which factors support investment and which impose confidence
      penalties that prevent a Buy at the current reported $1.2B price.
    data:
      nodes:
        - id: market
          label: Market signal — positive
          detail: >-
            Germany's €83B 2025 defence procurement and NATO 9.4% expenditure growth provide
            a structural demand tailwind that is genuine and sustained; NATO rearmament urgency
            is a multi-year driver, not a temporary event.
          tone: positive
        - id: contract
          label: Contract signal — conditionally positive
          detail: >-
            Bundeswehr framework (February 2026) for several thousand Virtus units is the
            single most important product-market validation available. Conditional on BAAINBw
            qualification; not yet a revenue-generating fact.
          tone: warning
        - id: product
          label: Product signal — contested
          detail: >-
            STARK claims Ukraine combat deployments and a TDW hot-strike demonstration. DroneXL
            asserts four-strikes failure in October 2025 formal military trials. The two accounts
            are irreconcilably in conflict; no independent verification is publicly available.
          tone: negative
        - id: investors
          label: Investor signal — positive with caveats
          detail: >-
            NIF + In-Q-Tel + Sequoia + Founders Fund cap table is a genuine credibility signal
            implying serious government-endorsed due diligence. However, Founders Fund investment
            and the $1.2B valuation are unconfirmed by STARK and based on third-party media only.
          tone: warning
        - id: financials
          label: Financial signal — blocking
          detail: >-
            No revenue, no audited accounts, no margin data, no burn rate. Bundesanzeiger shows
            no filed annual accounts for SKD SE as of June 2026. Financial opacity at a unicorn
            valuation is the single most severe evidence gap.
          tone: negative
        - id: valuation
          label: Valuation judgment
          detail: >-
            $1.2B reported mark is at the upper end of the base-case range; requires ~$114M in
            revenue at AeroVironment's 10.5x P/S to be fundamentally supported. STARK's funding-
            to-valuation multiple (~12x) exceeds Helsing's (~9x) despite weaker product proof.
          tone: negative
        - id: recommendation
          label: Track — Do Not Invest at Current Reported Valuation
          detail: >-
            The combination of contested product qualification, zero financial disclosure, and
            unconfirmed valuation mark creates too wide a gap between strategic potential and
            evidence quality to support a high-conviction investment at $1.2B. Re-entry at
            $600–800M on qualification confirmation is the preferred entry point.
          tone: neutral
      edges:
        - from: market
          to: valuation
          label: Demand tailwind supports option value
        - from: contract
          to: valuation
          label: Framework conditional on qualification
        - from: product
          to: valuation
          label: Unresolved adverse record suppresses confidence
        - from: investors
          to: valuation
          label: Strategic credibility floor; unconfirmed at $1.2B
        - from: financials
          to: valuation
          label: 'Blocking — cannot underwrite without revenue data'
        - from: valuation
          to: recommendation
          label: Evidence-confidence gap leads to Track
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV008
      - CV013
      - CV041

  - id: FV002
    title: Valuation sensitivity to revenue assumption
    type: bar
    layout: standard
    summary: >-
      Implied enterprise value for STARK under five revenue scenarios, using AeroVironment's
      public-market P/S multiple of 10.5x as the reference. The $1.2B reported valuation requires
      approximately $114M in confirmed annual revenue to be fundamentally supported at this multiple.
      All revenue figures are analyst-inferred from contract optionality; STARK has disclosed no revenue.
    approximationNotes: >-
      AeroVironment P/S of 10.5x is applied as a loitering-munition specialist public-market benchmark;
      actual private-company growth premiums may be higher (e.g., 15–20x for a high-growth platform).
      Revenue scenarios are analyst constructions from contract optionality, not STARK-disclosed figures.
      Bull and high-growth scenarios use Anduril-equivalent 14x forward P/S.
    data:
      items:
        - label: No confirmed revenue (current)
          value: 0
          unit: implied revenue $M
          detail: >-
            STARK has disclosed zero revenue and has no filed accounts. At any positive P/S multiple,
            zero confirmed revenue implies no fundamental support for the $1.2B mark — which instead
            rests entirely on forward contract optionality and strategic premium.
          tone: negative
        - label: Bear case — no qualification (~$0–20M estimated)
          value: 20
          unit: implied revenue $M
          detail: >-
            If qualification fails or is further delayed, estimated STARK revenue from Ukraine
            deliveries and non-Bundeswehr activities could reach ~$20M. At 10.5x P/S this implies
            only ~$210M fair value — an 83% discount to the $1.2B reported mark.
          tone: negative
        - label: Partial call-off — base case (~$30–75M)
          value: 55
          unit: implied revenue $M (mid-point)
          detail: >-
            300–500 unit partial call-off at €100K–€150K ASP generates ~€30M–€75M (~$35M–$88M).
            At 10.5x P/S mid-point ~$55M revenue implies ~$578M fair value — below the $1.2B mark,
            suggesting the base case still does not fully support current reported valuation.
          tone: warning
        - label: Full call-off threshold to support $1.2B (requires ~$114M revenue)
          value: 114
          unit: implied revenue $M
          detail: >-
            At 10.5x AeroVironment P/S, $114M in confirmed annual revenue would precisely support
            the $1.2B reported valuation. This requires approximately 760–1,140 unit deliveries
            at the estimated ASP range — achievable in the bull scenario but not in base or bear.
          tone: warning
        - label: Bull case — full framework + second NATO member (~$150–250M)
          value: 200
          unit: implied revenue $M (mid-point)
          detail: >-
            ≥1,000 unit Bundeswehr call-off plus NATO member repeat at mid-point ~$200M would
            support $2.1B at AeroVironment's 10.5x multiple, or $2.8B at Anduril's 14x — a
            1.7–2.3x return from the $1.2B entry in the bull scenario.
          tone: positive
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV025
      - CV026
      - CV027

  - id: FV003
    title: Valuation and return range by scenario
    type: range
    layout: standard
    summary: >-
      Low/mid/high valuation outcome ranges for each of the three scenarios (bull, base, bear)
      relative to the reported $1.2B entry price, with explicit assumptions driving each bound.
      All figures are analyst estimates; STARK has not disclosed revenue, margin, or financial data.
    approximationNotes: >-
      Bull and base valuations apply peer-derived P/S multiples to analyst-inferred revenue scenarios.
      Bear valuation reflects down-round repricing risk and market clearing price for a qualification-
      failed loitering munition startup in a competitive European market. EUR/USD conversion at 1.17.
    data:
      items:
        - label: Bear scenario (2027 horizon)
          low: 300
          mid: 500
          high: 700
          unit: $M enterprise value
          detail: >-
            Low: asset sale at distressed price after qualification suspension; acquirer (e.g.,
            Rheinmetall or Helsing) buys IP, talent, and Bundeswehr relationship at steep discount.
            Mid: down-round forced financing preserves going concern at $500M but imposes 58% loss
