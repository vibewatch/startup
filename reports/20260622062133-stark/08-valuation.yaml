  - id: exit-readiness
    title: Exit Readiness and Strategic Value Assessment
    body: >-
      STARK's exit readiness is early-stage. The company was founded in 2024, has one framework
      contract, no confirmed call-off revenue, and a contested product qualification record. At
      the $1.2B reported mark, early investors (Sequoia, Project A) are already sitting on
      significant paper gains, but the path to liquidity requires one of three exits: strategic
      acquisition, secondary sale, or eventual IPO.

      Strategic acquisition by a large defence prime is the most likely liquidity pathway. Rheinmetall
      is the most prominent natural acquirer: it already has a board member at STARK, its core
      competency is complementary (Rheinmetall supplies armoured vehicles, artillery, and ammunition
      rather than AI-autonomous loitering munitions), and it has demonstrated appetite for acquisitive
      growth (Blohm+Voss acquisition in September 2025). Other credible acquirers include BAE Systems,
      Safran, Thales, and L3Harris — all of whom have expressed strategic interest in European-sovereign
      AI defence capability. For a strategic acquirer, the premium above $1.2B would require confirmed
      Virtus qualification, a demonstrated call-off delivery record, and continued Bundeswehr
      relationship exclusivity. The AeroVironment acquisition of BlueHalo for $4.1 billion (May 2025)
      — a directed-energy and counter-UAS technology platform — demonstrates that strategic acquirers
      will pay material premiums for defensible niche capabilities. AeroVironment, as a fellow
      loitering-munition specialist, is also a conceivable acquirer, though STARK's European-
      sovereign identity and EU EDIS positioning may complicate a US-based transaction.

      A secondary sale pathway is supported by the presence of In-Q-Tel and NIF in the cap table.
      Both institutions have strategic reasons to hold STARK exposure beyond typical VC holding
      periods, and a secondary sale of early investor stakes to a sovereign wealth fund, a defence-
      focused fund such as Paladin Capital, or a European institutional investor would provide
      liquidity for early investors without requiring a full exit. This pathway does not depend on
      product qualification confirmation, making it more accessible in the base or bear scenarios.

      An IPO exit is structurally possible — Anduril and AeroVironment demonstrate that defence
      tech public listings attract premium valuations — but requires a multi-year path to revenue
      transparency, profitability trajectory, and customer diversification that STARK has not yet
      demonstrated. The 2028–2030 window is the earliest plausible IPO timeframe if product
      qualification and initial deliveries proceed on the bull schedule. In-Q-Tel's involvement
      adds a US government-facing exit pathway that may accelerate strategic buyer interest from
      US primes such as L3Harris, Northrop Grumman, or Textron, each of which has European drone
      acquisition precedent. The overall M&A environment in European defence tech is active
      (Rheinmetall/Blohm+Voss, AeroVironment/BlueHalo, Saab's strategic AI defence partnerships)
      and validates the strategic value narrative — but this tailwind benefits all European defence
      tech assets, not STARK uniquely.
