  claims:
    - id: CV001
      statement: >-
        STARK's reported ~$1.2B valuation as of February 2026 is documented by two independent
        third-party media sources — Deutsche Startups (16 February 2026) and TechFundingNews
        (13 February 2026) — but no official STARK press release, regulatory filing, investor
        statement, or Bundesanzeiger entry has confirmed the valuation or the Founders Fund
        investment terms.
      type: third-party-reported
      topic: valuation-confirmation
      sourceRefs:
        - SV001
        - SV002
        - SV005
      confidence: high
      freshness: recent
      answersQuestionRefs:
