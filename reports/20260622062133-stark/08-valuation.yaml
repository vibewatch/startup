  - id: TV005
    title: Thesis-break and kill triggers table
    notes: >-
      Triggers are ordered by likelihood of occurrence given current evidence. Threshold/event
      specifies the observable condition that constitutes the trigger. Transmission describes the
      causal pathway from trigger to investment thesis impairment.
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - BAAINBw Virtus qualification failure or suspension
        - Independent report or official BAAINBw notice confirming test failure, suspension of
          qualification pathway, or withdrawal of framework conditional approval
        - Revenue thesis collapses; framework does not convert to call-off orders; bear scenario
          materialises; Bundeswehr relationship damaged before revenue confirmation
        - Immediate divestment or hedge if held; cease entry consideration; await outcome of
          re-qualification attempt before re-engaging
      - - Founders Fund or Sequoia secondary sale at material discount to $1.2B
        - Confirmed secondary market transaction placing STARK equity below $900M
        - Smart money signalling deterioration; information asymmetry between early investors and
          late entrants compounds; $1.2B mark confirmed as price peak
        - Reduce exposure or exit alongside; seek transparency on investor motivation before
          committing further capital
      - - Official valuation confirmed materially below $1.2B in next financing round
        - Official term sheet or closing announcement from STARK at post-money below $1.0B
        - Third-party reporting inflated; current marks above verifiable fair value; other investors
          accepting a lower price signals fundamental change in deal terms
        - Down-round scenario active; prior entry at $1.2B has immediate mark-to-market loss;
          reassess at confirmed clearing price and dilution-adjusted IRR
      - - Binding LAWS prohibition or German national moratorium on AI-targeted strike systems
        - CCW-binding protocol enacted at UN level; or Federal Cabinet moratorium on development
          of AI-selected lethal autonomous weapons applicable to Virtus
        - Core product commercially impaired; AI targeting functionality restricted or removed;
          product redesign required; EU/NATO export certification withdrawn
        - Cease new investment; monitor UN GGE and Bundestag autonomous weapons committee
          quarterly; engage legal counsel on product scope
