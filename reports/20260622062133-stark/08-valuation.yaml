  - id: scenario-analysis
    title: Scenario Analysis — Bull, Base, and Bear Cases
    body: >-
      The scenario analysis is constrained by a fundamental data gap: STARK has disclosed no revenue,
      margin, unit economics, pricing, or burn rate. All scenarios are therefore constructed from
      contract optionality, comparable benchmarks, and structural market data rather than bottoms-up
      financial modelling.

      In the bull scenario, Virtus receives formal BAAINBw qualification by early 2027 and the
      Bundeswehr calls off at least 1,000 units of the several-thousand-unit framework. At an
      estimated average selling price of €100,000–€150,000 per unit (a range consistent with
      advanced European loitering munitions and inferred from comparable products), 1,000 units
      would generate €100M–€150M in first call-off revenue. If the unnamed NATO member contract
      converts to a repeat purchase and STARK adds a second European sovereign customer, the
      revenue base by 2028 could reach €150M–€250M. Applying Anduril-equivalent growth multiples
      (10-15x forward revenue for a proven platform), a bull-scenario equity value of $2–5 billion
      by 2028–2029 is plausible. This would represent a 1.7–4x return on a $1.2B entry.

      In the base scenario, qualification is delayed 12–18 months beyond the framework date.
      Partial call-off of 300–500 units generates €30M–€75M in recognised revenue by end-2027.
      The $1.2B mark is maintainable at next-round internal valuation but requires further dilution.
      A Series C at $1.5B–$2B post-money is the likely next financing event, with STARK investors
      absorbing 15–20% dilution. Net return for a $1.2B entry is 0.5–1.5x over a 4–5 year hold —
      below typical VC hurdle rates.

      In the bear scenario, independent test evidence corroborates the DroneXL four-strikes
      reporting, BAAINBw formally suspends or delays the qualification pathway, and STARK is forced
      to raise at a materially lower valuation in late 2026 or 2027. The Founders Fund round is
      the price peak. A down-round at $500M–$800M would impose severe mark-to-market losses on
      the most recent investors. Germany's loitering munition market would likely shift to
      Helsing's HX-2 and AeroVironment's Switchblade as qualified alternatives, and STARK's
      only viable exit would be a strategic acquisition at a substantial discount to the $1.2B mark.

      The probability signal for each scenario is structurally uncertain because the qualification
      status of Virtus cannot be confirmed from public data. The bear scenario cannot be assigned
      a probability below 25% given the unresolved DroneXL adverse record. Germany's structural
      defence spending commitment and STARK's strategic investor base prevent a near-zero outcome
      even under stress — the company is unlikely to fail entirely — but equity value compression
      from the $1.2B entry is a real and material risk.
