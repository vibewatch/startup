  - id: TV003
    title: Bull, base, and bear scenario table
    notes: >-
      All revenue estimates are analyst-inferred from market comparables and contract optionality;
      STARK has disclosed no revenue, pricing, or margin data. Valuation outcomes are based on
      peer multiples applied to estimated revenue trajectories. Probability signals are qualitative.
    columns:
      - Scenario
      - Key assumptions
      - Implied valuation by 2028
      - Key risks and downside triggers
      - Probability signal
    rows:
      - - Bull
        - Virtus BAAINBw qualification by Q1 2027; ≥1,000 unit call-off at €100K–€150K ASP
          (€100M–€150M first call-off); NATO member repeat; second EU sovereign customer;
          revenue €150M–€250M by 2028
        - $3B–$5B (10–15x forward revenue on proven platform; Anduril-equivalent growth premium)
        - Competition from Helsing HX-2 (already qualified in comparable configurations); NATO
          defence budget reversal; LAWS regulation narrowing AI targeting envelope
        - Low-medium; requires qualification in a specific window with no current independent
          confirmation; unresolved adverse test record suppresses upside probability
      - - Base
        - Qualification delayed 12–18 months; partial call-off 300–500 units; revenue €30M–€75M
          by end-2027; second round (Series C) at $1.5B–$2B post-money with 15–20% dilution
        - $1.0B–$1.5B (current $1.2B mark at upper end of base case range without revenue confirmation;
          sustains but does not significantly grow on a 3–4 year hold)
        - Qualification delay extends cash burn beyond current runway; dilution from Series C
          compresses net return to below VC hurdle; Helsing/AeroVironment take addressable share
          during delay window
        - Medium; most consistent with current evidence ambiguity; framework exists but
          qualification-conditional conversion has no confirmed timeline
