            call-off maintains minimum viable company.
          source: Analyst synthesis from DroneXL adverse record, bear scenario assumptions
          tone: negative
        - label: Base scenario (2027–2028 horizon)
          low: 800
          mid: 1250
          high: 1600
          unit: $M enterprise value
          detail: >-
            Low: qualification delayed; partial call-off; flat-round financing at $800M; 33% loss
            vs $1.2B entry. Mid: $1.25B range maintains value near current mark but requires 15–20%
            dilution from Series C; flat return before dilution. High: qualification achieved, partial
            call-off, international customer adds €50M+ incremental value; $1.6B supportable.
          source: Analyst synthesis from base case assumptions; AeroVironment P/S comparables
          tone: warning
        - label: Bull scenario (2028–2029 horizon)
          low: 2000
          mid: 3500
          high: 5000
          unit: $M enterprise value
          detail: >-
            Low: qualification confirmed Q1 2027; 500–700 unit call-off only; limited second customer;
            $2B fair value at 10x inferred revenue ~$200M. Mid: full call-off + NATO member repeat +
            second sovereign customer; Anduril-style platform premium; $3.5B supportable on $250M
            forward revenue at 14x. High: strategic acquisition at premium by prime; IPO pricing
            with defence-tech growth premium; $5B ceiling at 20x+ forward P/S on $250M+ revenue.
          source: Analyst synthesis from Helsing/Anduril growth trajectories and AeroVironment P/S
          tone: positive
