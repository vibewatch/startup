companyProfile:
  summary: STARK is a Berlin-based defence technology company operating as SKD SE and focused on sovereign European autonomous strike capability. Its public product stack spans the Virtus and Cascade loitering munitions, the Gambit short-range effector, Vanta unmanned surface vessels, and Minerva command-and-control software. Official sources confirm backing from Sequoia Capital, Project A, NATO Innovation Fund, and In-Q-Tel, while February 2026 media reports describe an unconfirmed Founders Fund-linked round at roughly a $1.2 billion valuation. The company has meaningful public demand proof through a February 2026 Bundeswehr framework for several thousand Virtus systems, but it still discloses no revenue, margins, total capital raised, or audited accounts.
  foundingLocation: Berlin, Germany
  headquarters: Berlin, Germany
  productSummary: Loitering munitions, unmanned surface vessels, and AI-enabled command-and-control software for land and maritime operations.
  customerFocus: European and NATO defence ministries, armed forces, and allied procurement programmes with emphasis on Germany and frontline European users.
  businessModel: Government procurement of hardware, software, integration, and sustainment under long qualification cycles and framework agreements.
  stage: growth-stage private
  fundingStatus: Officially undisclosed; public company materials confirm Sequoia, Project A, NATO Innovation Fund, and In-Q-Tel backing, while February 2026 third-party reporting describes an unconfirmed Founders Fund-linked round at about a $1.2 billion valuation.
