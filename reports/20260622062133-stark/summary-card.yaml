  topStrengths:
    - >-
      A named Bundeswehr framework for several thousand Virtus systems gives STARK rarer public demand proof than most
      European defence startups.
    - >-
      The company combines loitering munitions, maritime systems, and Minerva C2 software in a sovereign European stack
      that aligns with NATO and EU industrial-policy priorities.
    - >-
      Its investor and partner set provides unusual strategic credibility for a young defence company, especially
      through Sequoia, Project A, NATO Innovation Fund, and In-Q-Tel.
  topRisks:
    - >-
      No public revenue, margin, backlog, or audited-account disclosure exists, so valuation support cannot be tested
      against actual financial performance.
    - >-
      The Bundeswehr framework remains qualification-conditional, and adverse reporting around October 2025 trial
      failures leaves product-reliability questions unresolved.
    - >-
      Customer concentration, export controls, and autonomous-weapons regulatory scrutiny could materially slow scaling
      outside Germany and a small set of allied buyers.
  unresolvedGaps:
    - Audited revenue, backlog, gross margin, burn rate, and cash runway remain unavailable in public sources.
    - The exact size, terms, and lead economics of the reported February 2026 financing are not officially confirmed.
    - >-
      Independent evidence reconciling the DroneXL adverse trial narrative with STARK’s later rebuttal and Bundeswehr
      qualification progress is still missing.
