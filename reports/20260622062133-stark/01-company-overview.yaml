- id: diligence-implications
  title: Diligence implications and unresolved gaps
  body: 'The current public record supports a credible thesis that STARK has become one of Europe’s fastest-scaling defence startups, but it also contains important contradictions. On the positive side, legal identity, product catalogue, geographic expansion, investor quality, and at least one major German customer decision are all publicly visible. On the caution side, the company still has no public revenue disclosure, no confirmed customer count, no round-size disclosure for the reported February 2026 financing, and no audited evidence on production margins or contract profitability. Product-readiness risk also remains material: STARK itself published a defensive statement rebutting criticism from a Ukrainian military unit, while an adverse DroneXL article framed October 2025 trials as a complete failure. Those two sources do not conclusively disprove the product, but they do show that battlefield feedback and operational reliability are live diligence topics. Finally, human-rights and
    autonomous-weapons scrutiny will likely intensify as systems like Virtus, Cascade, and Minerva evolve toward swarming and more automated kill chains. The result is a company with strong strategic momentum but still-private evidence quality on the variables that matter most for investment underwriting.'
