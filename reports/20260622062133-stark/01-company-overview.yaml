- id: leadership-and-capital
  title: Leadership, governance, and capital formation
  body: The management bench is unusually deep for a young European defence company and appears intentionally designed to combine venture pace with industrial credibility. Uwe Horstmann became CEO in October 2025 after helping incubate STARK through Project A, while the legal imprint and later board appointment release show a broader executive bench including Johannes Schaback, Dr. André Schneider, Jan-Patrick Helmsen, and Martin Rost. Helmsen brings direct Rheinmetall weapons-sales experience, while Rost brings large-scale operating experience from Zalando, which supports the company’s repeated message that production scale and supply-chain execution are core differentiators. Capital formation is less cleanly documented. Official company materials explicitly name Sequoia Capital, NATO Innovation Fund, Project A, and In-Q-Tel as backers, while February 2026 third-party reports add an unconfirmed Founders Fund investment and a $1.2 billion valuation narrative. That means the company can already
    claim high-quality investor sponsorship, but the exact round size, total capital raised, dilution, and lead-investor economics should be treated as partially verified rather than settled fact until a company statement, filing, or investor confirmation appears.
