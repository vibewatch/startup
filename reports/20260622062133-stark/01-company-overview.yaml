  title: Strategic reading of the public record
  body: The evidence suggests STARK is trying to become a sovereign European autonomy prime, not merely a single-drone vendor. That ambition is visible in the combination of loitering munitions, maritime systems, and command-and-control software rather than in one isolated product launch.
