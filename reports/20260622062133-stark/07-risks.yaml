  - id: supply-chain-operational
    title: Supply chain, manufacturing, and operational risk
    body: >-
      STARK's supply chain and manufacturing risk profile is materially underspecified
      in public disclosures, creating a wide due-diligence gap. The most significant
      known dependency is TDW (Gesellschaft für Wehrtechnische Erprobung), which
      served as STARK's sole publicly disclosed warhead integration partner. TDW is
      a specialised German ordnance testing and production entity; there is no public
      indication that STARK has a backup warhead supplier or that TDW has committed
      to exclusive partnership arrangements or volume pricing. Any TDW capacity
      constraint, pricing dispute, or contractual termination would create a
      single-point-of-failure for Virtus deliveries.

      STARK announced a UK production facility, which represents geographic
      diversification but introduces new complications: EU EDIS sovereign supply
      chain compliance, UK-specific export licensing (separate from BAFA), and
      intellectual property jurisdiction issues if UK and German production facilities
      are jointly used for classified military hardware. The facility's current output
      capacity, production readiness, and cost structure have not been disclosed.

      For small UAS, the bill of materials (BoM) is critically dependent on
      advanced microelectronics, batteries, and navigation chips—supply chains
      that remain partially Chinese-origin given global component market realities.
      A company marketing sovereign European defence capability that relies on
      Chinese-origin chips for guidance or power systems creates a strategic
      dependency that is politically and operationally sensitive. STARK has not
      publicly disclosed its BoM, component sourcing strategy, or backup supplier
      arrangements for any of its systems.

      Scaling from prototype production to BAAINBw delivery volumes for a Bundeswehr
      framework contract is a qualitatively different manufacturing challenge
      requiring significantly larger facilities, quality management systems, and
      supply chain depth. STARK's current headcount implies prototype-scale
      operations; production scaling will require capital investment, hiring, and
      lead times not yet publicly planned.
