  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: BAAINBw formal qualification certificate
      missingEvidence: >-
        Official BAAINBw documentation confirming or denying that Virtus has
        received formal military qualification (MPCV) certification for Bundeswehr
        production deliveries.
      whyItMatters: >-
        Without confirmed qualification status, the framework contract's transition
        to production call-offs is uncertain, and the revenue thesis cannot be
        validated. This is the single most material evidence gap.
      diligencePath: >-
        Request formal qualification status from BAAINBw programme office; review
        any BWB or BAAINBw procurement notices referencing Virtus.
      relatedQuestionRefs:
        - QR011

    - type: private-evidence-only
      severity: blocking
      topic: STARK audited financial statements
      missingEvidence: >-
        Audited financial statements showing revenue, gross margin, operating loss,
        cash balance, and runway for SKD SE.
      whyItMatters: >-
        Absence of audited financials makes burn rate, runway, and capital adequacy
        completely opaque, which is unusually severe for a €1B-valued company.
      diligencePath: >-
        Request audited accounts from STARK under NDA; review full Bundesanzeiger
        filing history; ask lead investors for financial summary.
      relatedQuestionRefs:
        - QR013

    - type: missing-source
      severity: material
      topic: Ukraine deployment and battlefield performance
      missingEvidence: >-
        Independent confirmation of STARK system deployments in Ukraine, including
        unit counts, delivery dates, field performance data, and operational outcomes.
      whyItMatters: >-
        Ukraine deployment claims form a material part of STARK's product-proven
        narrative; without independent confirmation, the claims are unverified and
        could be overstated.
      diligencePath: >-
        Cross-reference with Ukrainian MoD procurement records; seek confirmation
        from Ukrainian battlefield reporting outlets; request operator testimony.
      relatedQuestionRefs:
        - QR014

    - type: missing-source
      severity: material
      topic: ITAR/EAR US-origin component licence
      missingEvidence: >-
