callouts:
  - calloutType: risk
    title: Kill criterion — product qualification failure
    body: >-
      If BAAINBw formally disqualifies or indefinitely suspends the Virtus
      qualification process, the investment thesis breaks: no Bundeswehr production
      revenue, no credible export story, and no alternative product at equivalent
      maturity. This is the single highest-severity monitorable risk trigger.
    claimRefs:
      - CR009
      - CR012
      - CR024

  - calloutType: risk
    title: Kill criterion — LAWS regulatory prohibition
    body: >-
      A binding CCW/GGE treaty or German national moratorium prohibiting AI-enabled
      autonomous targeting would require STARK to fundamentally redesign its core
      products. With UN GGE negotiations unresolved through 2026 and HRW/ICRC
      pressure intensifying, the probability of binding action in the 2027–2030
      horizon is non-trivial and warrants active monitoring.
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR043

  - calloutType: strength
    title: Regulatory tailwind — European rearmament urgency
    body: >-
      Germany's accelerating defence budget (towards 3% of GDP) and the EU EDIS
      push for sovereign industrial capacity create a procurement environment that
      is broadly favourable to qualified European munitions suppliers. These
      tailwinds partially offset STARK's regulatory friction risks, but only if
      product qualification is achieved.
    claimRefs:
      - CR007
      - CR008
      - CR044

