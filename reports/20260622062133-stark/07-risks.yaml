  - id: product-qualification-technical
    title: Product qualification, reliability, and technical risk
    body: >-
      The central technical risk for STARK—and the most publicly contested—is
      whether Virtus has achieved, or can achieve, the qualification standard
      required for full Bundeswehr production deliveries under BAAINBw procurement
      rules.

      In October 2025, DroneXL published a report asserting that STARK failed all
      four live-strike tests conducted under independent evaluation, with no
      warhead detonation successfully delivered on target in any of the runs.
      A second DroneXL article published earlier that month raised related concerns.
      STARK's formal response—the "STARK Statement"—disputed the characterisation,
      asserting the tests were developmental rather than official qualification runs
      and that no system detonated in an uncontrolled manner. These two accounts are
      irreconcilably in conflict, and without access to the independent test
      sponsor's records, the true qualification status of Virtus cannot be confirmed
      from public sources. No BAAINBw formal qualification certificate (MPCV) for
      Virtus has been publicly documented as of the report date, despite the
      February 2026 framework contract announcement.

      The TDW-STARK hot-strike demonstration confirmed a live warhead detonation
      on a target, but this was a manufacturer-partnered demonstration rather than
      an independent BAAINBw qualification test. In Germany, warhead integration
      and hot-strike qualification is a multi-agency process typically requiring
      12–24 months between initial live-fire demonstration and formal safety and
      system qualification sign-off.

      Beyond the qualification controversy, STARK has not publicly addressed several
      known technical vulnerability classes for small UAS operating in contested
      environments: GPS-denial and electronic countermeasure (ECM) resilience,
      datalink jamming, and the cyber-attack surface created by OTA firmware update
      capability on deployed strike munitions. Any adversary who can compromise an
      OTA update channel could in principle degrade reliability, manipulate terminal
      guidance, or create unsafe-arm conditions. STARK's company code of conduct and
      public disclosures do not address penetration-testing or third-party security
      auditing for these attack surfaces.
    claimRefs:
