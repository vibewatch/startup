  - id: customer-procurement
    title: Customer concentration and procurement risk
    body: >-
      STARK's publicly documented customer base is effectively concentrated in a
      single named sovereign buyer: the German Bundeswehr. The February 2026
      framework contract for Virtus is a framework agreement rather than a binding
      production contract with stated volumes, unit prices, and delivery dates;
      revenue realisation depends entirely on call-off orders that require separate
      appropriation and procurement action by BAAINBw.

      German procurement law requires additional Bundestag appropriation approval
      for defence items exceeding €25M, meaning even a fully qualified Virtus
      system cannot move to production deliveries without a parliamentary budget
      vote. The Haushaltsausschuss (Budget Committee) has historically attached
      conditions to and delayed defence acquisition programs from newer suppliers.
      German procurement cycles for unmanned systems have historically experienced
      12–24 months between framework agreement and first production delivery, even
      for mature systems from established suppliers.

      STARK has also claimed an export contract with an unnamed NATO-member state
      and Ukrainian field use, but neither claim has been independently verified
      with contract size, unit count, or delivery schedule. If the Bundeswehr
      framework call-off is delayed or re-competed, STARK would have no confirmed
      alternative revenue source of material scale. Single-buyer customer
      concentration at the Bundeswehr level is thus not merely a revenue risk but
      potentially an existential risk if procurement pauses for any extended period.

      The risk is amplified by STARK's VC-financed model: unlike a prime contractor
      with existing cash flows, STARK depends on continued external capital to bridge
      the gap between framework contract and first production revenue. Procurement
      delays compound directly into financing risk if investor patience or runway
      runs out before the first batch delivery.
