  - id: financial-governance
    title: Financial opacity, governance, and capital risk
    body: >-
      STARK's financial risk profile is unusually opaque for a company at unicorn
      valuation. SKD SE is a German Societas Europaea below the large-company
      disclosure threshold, so its Bundesanzeiger filings contain minimal financial
      detail. No audited revenue, gross margin, burn rate, or runway figures have
      been publicly released. STARK's ~€1B valuation has been cited by multiple
      media outlets (TechFundingNews, Manager Magazin via Reuters, Deutsche Startups)
      but no formal funding announcement with confirmed round size, terms, post-money
      valuation, or lead-investor confirmation has been issued by the company
      directly.

      Scaling a loitering munition program from prototype to BAAINBw production
      volumes requires capital investment in tooling, quality management systems,
      production facilities, supply chain, and workforce that has not been
      quantified in any public disclosure. A startup with under 200 employees and
      VC financing attempting to scale to Bundeswehr contract volumes in parallel
      with maintaining R&D cadence faces compounding capital demands. German defence
      startups that fail to convert framework contracts into production deliveries
      before VC patience runs out have historically entered financial distress—a
      "valley of death" dynamic that is structurally present here.

      STARK's capital dependency on Founders Fund, Sequoia Capital, NIF Fund, and
      IQT creates a concentration of VC-oriented investors who may have limited
      appetite for the multi-year, capital-intensive ramp to production that defence
      hardware programs require. Government grants (EDF, BMBF) could supplement
      equity capital but add compliance overhead, reporting requirements, and
      sovereign-supply-chain conditions that may constrain operational flexibility.
