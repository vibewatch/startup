        ITAR restrictions could constrain third-country exports and require US
        re-export approval, adding a hidden regulatory layer that is not visible
        from public sources.
      diligencePath: >-
        Conduct full BoM review under NDA; engage US export counsel; request
        STARK's export compliance opinion on component sourcing.
      relatedQuestionRefs:
        - QR016

    - type: private-evidence-only
      severity: material
      topic: Non-dilutive government financing share
      missingEvidence: >-
        Breakdown of STARK's funding mix between equity (Founders Fund, Sequoia,
        NIF, IQT) and non-dilutive government grants (EDF, BMBF, other).
      whyItMatters: >-
        A higher non-dilutive share would reduce VC dependency risk and extend
        effective runway; the current mix is unknown.
      diligencePath: >-
        Request grant award history from STARK; search EU EDF project database
        and BMBF Förderdatenbank for SKD SE entries.
      relatedQuestionRefs:
        - QR010

    - type: missing-source
      severity: minor
      topic: Customer concentration vs peer defence startups
      missingEvidence: >-
        Comparable data on customer concentration for peer European defence tech
        companies at a similar stage, to benchmark STARK's concentration risk.
      whyItMatters: >-
        Without a peer benchmark, it is difficult to determine whether STARK's
        single-customer concentration is exceptional or normal for early-stage
        defence tech.
      diligencePath: >-
        Review public filings and press releases from Helsing, ARX Robotics, and
        AeroVironment for customer breakdown at comparable growth stage.
      relatedQuestionRefs:
        - QR028

    - type: enumeration-incomplete
      severity: minor
