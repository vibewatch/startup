  - TI003
  figureRefs:
  - FI002
  - FI004

- id: capital-adequacy
  title: Capital adequacy and forward funding dependency
  body: >-
    Assessing STARK's capital adequacy from public data is not possible with precision, but the directional
    picture is clear: the company is pre-revenue at scale, burning cash across multiple geographies, and
    dependent on continued equity financing until its Bundeswehr and NATO contracts deliver sufficient
    milestone-based payment receipts to fund operations. The reported funding trajectory — roughly $100
    million raised through two Sequoia-led rounds by October 2025, with an unconfirmed additional
    Founders Fund round in February 2026 — implies a cash position that could be as low as $30–50 million
    or as high as $100 million or more, depending on the actual burn rate and timing of the most recent
    capital raise. That wide range reflects the absence of any disclosed cash position, burn rate, or
    use-of-funds statement.

    The Bundeswehr framework agreement is the most credible forward revenue signal, but it is subject to
    a qualification condition and a two-year delivery window that will spread cash inflows across 2026–2028.
    Government procurement payment terms in European defence are typically milestone-based, often with
    mobilisation payments of 10–30 percent upfront and the balance due on delivery acceptance milestones;
    STARK will need to fund production and inventory build-out before those payments arrive. NATO Innovation
    Fund provides strategic patient capital with an alliance mandate, which may reduce near-term liquidity
    pressure, but NIF is an equity investor, not a credit facility. The European Defence Fund's 2026
    work programme allocates €1 billion for collaborative R&D and includes autonomous-systems topics
    directly aligned with STARK's portfolio, representing a potential non-dilutive grant path, but no
    EDF grant award has been disclosed. The company has disclosed no debt, credit facility, or project
    finance arrangement in any public source reviewed.
  claimRefs:
  - CI003
  - CI004
  - CI021
  - CI022
  - CI024
  - CI025
  - CI026
