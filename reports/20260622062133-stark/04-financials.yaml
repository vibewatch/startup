callouts:
- calloutType: risk
  title: Qualification condition blocks Bundeswehr backlog conversion
  body: >-
    The Bundeswehr framework agreement for several thousand Virtus systems is explicitly conditional
    on successful qualification. Until STARK clears the Bundeswehr qualification gate, the framework
    does not generate firm delivery orders or recognized revenue. Given the October 2025 adverse trial
    reports and the February 2026 qualification status not yet confirmed in any public source, this
    condition is a material near-term financial risk.
  claimRefs:
  - CI003
  - CI021
  - CI031
  - CI033

- calloutType: risk
  title: No public financials; every underwriting input requires NDA access
  body: >-
    SKD SE has not filed public annual accounts, has not disclosed revenue, and has not confirmed its
    funding round sizes. Sequoia Capital has confirmed its two rounds but not their sizes; all other
    financial data comes from third-party media. Financial underwriting of STARK requires a full
    NDA-protected data-room review covering management accounts, cap table, order book, and
    qualification plan.
  claimRefs:
  - CI002
  - CI015
  - CI035
  - CI037

- calloutType: insight
  title: Warhead pre-purchase signals conviction but front-loads balance-sheet risk
  body: >-
    The decision to pre-purchase thousands of warheads before the Bundeswehr framework was signed is
    strategically credible — it de-risks supply-chain certification timing — but it means STARK
    deployed significant capital into inventory that cannot be recovered if the product fails
    qualification or if contracts are cancelled. This is an unusual working-capital profile for
    a company of this age and should be confirmed and reconciled in any financial review.
  claimRefs:
  - CI020
  - CI021
  - CI038

