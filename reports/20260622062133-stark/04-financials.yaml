figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: standard
  summary: >-
    How government customer activity flows through contract award, production, and delivery to (undisclosed)
    revenue and gross profit for STARK.
  data:
    nodes:
    - id: customer
      label: Government / military customer
      detail: >-
        NATO member armed forces (Bundeswehr, unnamed second NATO member) and Ukrainian military; primary
        and only publicly evidenced buyers; no enterprise or consumer revenue.
      tone: neutral
    - id: contract
      label: Contract or framework award
      detail: >-
        Parliamentary budget committee approval (Germany); or urgent operational contract (NATO member,
        Ukraine); framework provides for several thousand Virtus units over two years post-qualification.
      tone: neutral
    - id: qualification
      label: Qualification gate (Bundeswehr)
      detail: >-
        Bundeswehr framework conditional on successful product qualification; until cleared, call-off
        orders cannot be issued and revenue cannot be recognised under the framework.
      tone: warning
    - id: production
      label: Production and delivery
      detail: >-
        Multi-site manufacturing in Germany, UK, and Ukraine; delivery begins 2026 per Bundeswehr
        framework; milestone-based acceptance triggers revenue recognition.
      tone: neutral
    - id: revenue
      label: Revenue (undisclosed)
      detail: >-
        Revenue recognised on milestone delivery acceptance; no ASP, backlog value, or revenue figure
        publicly disclosed for any product or period.
      tone: warning
    - id: gross-profit
      label: Gross profit (undisclosed)
      detail: >-
        Gross margin driven by warhead COGS, airframe production costs, multi-site overhead absorption,
        and software bundling; no disclosure; estimated range 20–45% from comparable hardware startups.
      tone: warning
    edges:
    - from: customer
      to: contract
    - from: contract
      to: qualification
    - from: qualification
      to: production
    - from: production
      to: revenue
    - from: revenue
      to: gross-profit
  approximationNotes: >-
    Revenue and gross profit nodes contain no numeric values; they describe the structural position in the
    flow only. All financial inputs are private. The qualification node is a risk gate specific to the
    Bundeswehr framework; Ukraine and second-NATO-member contracts may not have the same condition.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
  - CI021
  - CI022

- id: FI002
  title: Unit economics bridge
  type: flow
  layout: standard
  summary: >-
    Qualitative map of the cost and revenue inputs that determine gross margin per Virtus system, with
    all numeric inputs marked as unavailable from public sources.
  data:
    nodes:
    - id: asp
      label: Average selling price (undisclosed)
      detail: >-
        No pricing disclosed publicly; STARK's Feb 2026 statement confirms no Virtus pricing in German
        media; list price likely negotiated per-framework with each NATO customer.
      tone: warning
    - id: warhead-cogs
      label: Warhead COGS (TDW/LION STRIKE 110)
      detail: >-
        STARK pre-purchased thousands of warheads upfront; warhead unit cost undisclosed; this front-loaded
        inventory investment reduces per-unit warhead cost at scale but compresses near-term cash.
      tone: warning
    - id: airframe-cogs
      label: Airframe and system assembly COGS
      detail: >-
        Multi-site production (Germany, UK, Ukraine) adds per-unit logistics complexity; VTOL reuse
        capability reduces unit consumption for training but not for operational missions.
      tone: neutral
    - id: software-amort
      label: Minerva software amortisation (estimated)
      detail: >-
        Minerva C2 appears bundled with hardware systems; no standalone pricing or standalone R&D
        capitalisation disclosure; development cost likely amortised across hardware units.
      tone: neutral
    - id: gross-margin
      label: Gross margin (estimated 20–45% range)
      detail: >-
        No company disclosure; range based on comparable early-stage European defence hardware; actual
        margin highly sensitive to warhead pre-purchase amortisation and early production scale efficiency.
      tone: warning
    edges:
    - from: asp
      to: gross-margin
    - from: warhead-cogs
      to: gross-margin
    - from: airframe-cogs
      to: gross-margin
    - from: software-amort
      to: gross-margin
  approximationNotes: >-
    All nodes except the structural flow represent undisclosed inputs. The 20–45% gross margin estimate
    is a benchmark range from comparable hardware-defence startups and should not be attributed to STARK
    specifically. Actual margins could be higher (if ASPs are premium) or lower (if early batches have
    high fixed-cost absorption).
  claimRefs:
  - CI007
  - CI008
  - CI019
  - CI020
  - CI023
  - CI038

- id: FI003
  title: Financial estimate range
  type: range
  layout: standard
  summary: >-
    Source-backed low/mid/high ranges for the four most material financial indicators, reflecting wide
    uncertainty from third-party reporting and indirect inference only.
  data:
    items:
    - label: Total VC funding raised ($M)
      low: 62.0
      mid: 100.0
      high: 160.0
      unit: $M
      detail: >-
        Low: Sequoia Aug 2025 round alone ($62M per DroneXL). Mid: total reported by DroneXL as of
        Oct 2025 ($100M). High: mid plus Founders Fund double-digit-million-EUR addition (~$15–$60M
        equivalent) per Deutsche Startups Feb 2026; upper bound reflects maximum plausible Founders
        Fund contribution and potential European co-investors mentioned in the article.
      source: DroneXL Oct 2025; Deutsche Startups Feb 2026
      tone: neutral
    - label: Post-money valuation ($M)
      low: 500.0
      mid: 1000.0
      high: 1200.0
      unit: $M
      detail: >-
        Low: $500M valuation at Aug 2025 Sequoia round (DroneXL). Mid: interpolated between the two
        reported data points. High: ~$1.2B valuation per Feb 2026 Founders Fund round reporting
        (Deutsche Startups, TechFundingNews). Neither valuation is company-confirmed.
      source: DroneXL Oct 2025; TechFundingNews Feb 2026; Deutsche Startups Feb 2026
      tone: neutral
    - label: Monthly operating burn ($M/month)
      low: 2.0
      mid: 5.0
      high: 9.0
      unit: $M/month
      detail: >-
        Estimated from 400 employees at €80K–€120K average fully-loaded cost ≈ €32–€48M/year ≈
        €2.7–€4M/month; add facility costs (UK plant, Ukraine 2,000 sqm hub, Germany HQ, Sweden,
        Greece), warhead inventory financing, and travel/logistics. Low assumes lean ops; high assumes
        warhead build-up and capital investment phase overlap.
      source: Estimated from public headcount and footprint signals; not company-disclosed
      tone: neutral
    - label: Estimated runway (months from Jun 2026)
      low: 6.0
      mid: 18.0
      high: 36.0
      unit: months
      detail: >-
        Depends entirely on undisclosed cash balance and actual burn. Low: if Feb 2026 round was small
        (~$15M) and burn is high (~$8M/month). Mid: if cash is ~$60M and burn ~$4M/month. High: if
        cash is ~$100M+ and burn is closer to $3M/month with early Bundeswehr milestone payments.
      source: Estimated; all inputs undisclosed
      tone: neutral
  approximationNotes: >-
    All ranges are inferred from third-party media reports and public headcount signals, not from
    company-disclosed financials. The funding and valuation figures are explicitly third-party-reported
    and unconfirmed. The burn and runway estimates are rough approximations that could be materially
    wrong. Do not use these ranges as valuation inputs without access to actual management accounts.
  claimRefs:
  - CI009
  - CI010
  - CI012
  - CI013
  - CI018
  - CI019
  - CI034

