- id: capital-formation
  title: Capital formation and investor base
  body: >-
    STARK's capital formation history is partially opaque because the company has not made a single
    official statement disclosing the total amount raised, round sizes, or post-money valuations. What
    is publicly available comes from third-party reporting and investor signals. The company's October
    2025 CEO announcement confirmed that Sequoia Capital led the company through two funding rounds
    and that the investor group also includes the NATO Innovation Fund, Project A, and In-Q-Tel. This
    confirms a high-quality, multi-geography investor base that combines commercial VC (Sequoia),
    European defence-focused VC (Project A), a NATO-mandate fund (NIF), and the CIA's strategic
    venture arm (In-Q-Tel).

    Third-party media reporting adds additional detail that the company has not confirmed. DroneXL
    reported in October 2025 that total funding reached $100 million through two rounds, with Sequoia's
    August 2025 round at $62 million valuing the company at $500 million, and named 8VC as an additional
    participant. Deutsche Startups and Tech Funding News both reported in February 2026 that Founders Fund
    (Peter Thiel) invested a double-digit million-euro amount in a new round, lifting the valuation to
    approximately $1.2 billion. No official STARK statement, filing, or investor press release has
    confirmed the Founders Fund investment or the $1.2 billion valuation. SKD SE's commercial register
    entry at Amtsgericht Charlottenburg (HRB 260878 B) shows five board members, three Prokura holders,
    and five known active subsidiary stakes, but contains no public financial data. The Bundesanzeiger
    search returns no publicly filed annual accounts for SKD SE, consistent with a company incorporated
    in 2024 that has not yet completed its first full financial year requiring public disclosure.
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI035
  figureRefs: []

- id: cost-structure
  title: Cost structure, capital intensity, and manufacturing economics
  body: >-
    STARK's cost structure is dominated by three areas that are each capital-intensive by nature:
    research and development, warhead and component inventory, and multi-site production and staffing.
    The company discloses that more than 45 percent of its total expenditure goes to R&D, which is
    substantially above the European Defence Agency collective benchmark of 2 percent of total defence
    spending for collaborative R&T and signals a deliberate investment-phase posture rather than a
    margin-optimisation posture. Against that R&D intensity, gross margins at early production volumes
    for defence hardware typically range from 20 to 45 percent for comparable startups, but there is no
    company-specific data to narrow that estimate.

    The most unusual capital deployment signal in the public record is the company's October 2025 statement
    that it had already invested in thousands of warheads to secure delivery of a certified system before
    2027. This pre-purchase represents a significant working-capital outflow before contract revenue is
    earned and likely sits on the balance sheet as inventory rather than being expensed as incurred. The
    multi-site production footprint — Germany (HQ), UK (production opened July 2025), Ukraine (2,000 sqm
    R&D hub for 200-plus specialists), Sweden (EW engineering), and Greece (regional office) — adds
    meaningful fixed costs in rent, equipment, and local staffing across multiple currencies. Headcount
    growth from 120 to 400 employees over 2025 compounds these cost pressures: at a rough European defence
    startup blended fully-loaded cost of €80,000–€120,000 per employee per year, the annualised payroll
    alone approaches €32–€48 million, equating to monthly cash burn of roughly €3–€8 million before
    facility and inventory costs. That estimate is highly uncertain because the actual salary mix,
    equity-versus-cash compensation ratio, and facility costs are not disclosed.
  claimRefs:
  - CI008
  - CI017
  - CI018
  - CI019
  - CI020
  - CI023
  - CI038
