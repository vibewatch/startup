  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue and unit economics
    missingEvidence: >-
      Revenue, backlog value, average selling price, gross margin, and cost of goods sold for any
      STARK product in any period. STARK has not disclosed any commercial metric. The Bundesanzeiger
      returns no public financial accounts.
    whyItMatters: >-
      Without revenue and margin data, financial underwriting is impossible; valuation can only be
      inferred from third-party round reporting, not fundamentals.
    diligencePath: >-
      Request audited or management-reviewed P&L, balance sheet, and cash-flow statement for all
      periods since incorporation under NDA; request unit-level P&L for Virtus and Vanta.
    relatedQuestionRefs:
    - QI010
    - QI011
    relatedTableRefs:
    - TI003
    - TI005

  - type: conflicting-data
    severity: material
    topic: funding confirmation
    missingEvidence: >-
      Official STARK confirmation of the Founders Fund investment, February 2026 round size, and
      post-money valuation; the conflict between third-party media reporting ($1.2B valuation) and
      the absence of any company statement is unresolved.
    whyItMatters: >-
      Cap table, governance rights, liquidation preferences, and dilution schedule cannot be
      assessed without a confirmed round summary.
    diligencePath: >-
      Request company-confirmed cap table, signed term sheets for all rounds, and board resolution
      approving each financing under NDA.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004

  - type: private-evidence-only
    severity: material
    topic: bundeswehr qualification status
    missingEvidence: >-
      Formal confirmation that the Bundeswehr qualification milestone for Virtus has been initiated,
      milestone schedule, pass/fail criteria, and estimated completion date.
    whyItMatters: >-
      Until qualification is cleared, the Bundeswehr several-thousand-unit framework does not
      generate call-off orders or revenue; qualification failure is the primary near-term
      revenue-cancellation risk.
    diligencePath: >-
      Request Bundeswehr qualification milestone plan, test schedule, and any formal Bundeswehr
      acceptance documentation from STARK's programme management team under NDA.
    relatedQuestionRefs:
    - QI017
    - QI023
    relatedTableRefs:
    - TI005

  - type: private-evidence-only
