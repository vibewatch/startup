callouts:
- calloutType: risk
  title: Unresolved October 2025 trial failures represent material technical risk
  body: >-
    DroneXL reported in October 2025 that Virtus failed all four strike attempts in trials with British and
    German armed forces. STARK's published rebuttal cites a Ukrainian unit that requested more systems and
    points to post-trial improvements, but does not directly address the reported trial results. Until
    independent validation evidence is available, the October 2025 failure record remains a live technical
    risk for Bundeswehr qualification and any NATO customer evaluation.
  claimRefs:
  - CE027
  - CE028
  - CE037

- calloutType: risk
  title: OTA update architecture creates unaddressed cyber-physical attack surface
  body: >-
    Cascade's over-the-air software update capability, described as enabling continuous capability integration,
    introduces a cyber-physical security surface that STARK has not publicly addressed. For weapons systems, OTA
    updates require secure delivery chains, firmware signing, and rollback controls. None of these have been
    disclosed. This gap is material for defence customers performing their own cybersecurity assessments.
  claimRefs:
  - CE014
  - CE031
  - CE038

- calloutType: strength
  title: German warhead integration is a sovereign-supply differentiator
  body: >-
    The December 2025 hot strike demonstration with TDW's LS110 warhead positions STARK as one of the first
    European defence startups to deliver a fully German-manufactured loitering munition system. STARK explicitly
    frames this as demonstrating that "Germany can deliver" to NATO and Ukraine — directly addressing the
    procurement-political requirement for sovereign defence supply chains. This integration is a genuine
    product-technical milestone that supports the Bundeswehr framework and differentiates STARK from
    non-European suppliers.
  claimRefs:
  - CE008
  - CE024

