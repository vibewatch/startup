company:
  name: Stark
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    STARK operates a five-product platform covering loitering munitions (Virtus OWE-V, Gambit OWE-Q, Cascade tube-launched),
    an unmanned surface vessel (Vanta), and multi-domain C2 software (Minerva). Published specifications place Virtus at
    130 km range, 90 minutes endurance, 250 km/h dive speed, and 800 mm HHA penetration via a TDW LION STRIKE 110 warhead
    whose first hot strike was demonstrated in Germany in December 2025. Minerva uses a modular open source architecture
    (MOSA), supports swarming and human-in-the-loop engagement, and was demonstrated integrating with Quantum Systems
    Vector ISR in a live Bundeswehr exercise in April 2026. Independently corroborated strengths include warhead integration,
    multi-domain C2 design, and maritime trials in a live NATO exercise; the principal technical uncertainties are the
    October 2025 trial failures reported by DroneXL, absence of independent benchmark data on accuracy or CEP, dependence
    on a partner ISR layer, OTA update security exposure, and unresolved autonomy-regulation risk as Minerva's swarming
    and automated targeting features evolve.

sections:
- id: product-catalogue
  title: Product catalogue, platform scope, and system architecture
  body: >-
    STARK has publicly disclosed five products that form a vertically integrated autonomous-weapons platform spanning
    air-strike, maritime, and software layers. Virtus (OWE-V) is the flagship fixed-wing loitering munition, positioned
    for long-range precision strikes against armoured and point targets. Cascade is a tube-launched effector designed for
    mass saturation attacks using simultaneous multi-launcher fires from vehicles, vessels, or containers. Gambit (OWE-Q)
    is a man-portable foldable quadcopter for short-range ISR and strike. Vanta is a family of unmanned surface vessels
    for maritime ISR, patrol, and naval deterrence. Minerva is the AI-enabled command and control software that orchestrates
    all four hardware platforms and can integrate third-party unmanned systems through standardised interfaces.

    The architectural intent is clear from the product naming and cross-references: Minerva acts as the brain, the three
    munition platforms act as effectors at different range bands and mobility profiles, and Vanta extends the kill chain
    to the maritime domain. STARK explicitly describes Minerva as middleware linking its own systems and those of other
    manufacturers — positioning the stack as an open-architecture European platform rather than a closed single-vendor
    system. The career page shows active hiring for software engineers, embedded systems, and systems integration roles,
    consistent with a platform-first development strategy. All five products have dedicated product pages on the STARK
    website but provide limited independent technical verification beyond company-authored specifications.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  tableRefs:
  - TE001
  figureRefs:
  - FE001

- id: platform-architecture
  title: Virtus, Cascade, and Gambit — hardware architecture and weapons integration
  body: >-
    Virtus is a software-defined one-way effector using electric vertical take-off and landing (eVTOL) technology that
    enables launch from any terrain without catapults, tubes, or pads. Published specifications show flight time up to
    90 minutes, range 130 km plus, cruising speed 120 km/h, attack speed 250 km/h, modular payload up to 5 kg, and
    operating altitude up to 2,000 m. The wingspan and height are each 1.8 m; deployment time is under 10 minutes.
    Penetration capability is stated as 800 mm high-hardness armour, achieved through the TDW LION STRIKE 110 warhead
    whose first hot strike in Germany was confirmed jointly by STARK and TDW in December 2025. The LS110 design supports
    tandem-shaped charges and fragmentation jackets, with TDW describing above-average penetration performance. The
    modular system design means Virtus can be modified between software releases to meet operational requirements, and
    STARK specifically describes an EW-resilient data link using multiple communications layers and a navigation system
    combining visual odometry with satellite imagery and known-landmark localisation for GNSS-denied environments.

    Cascade is a tube-launched effector with published specs of 100 km range, 100 km/h cruise, 220 km/h dive, and
    60 minutes flight time; launcher and effector combined weigh under 20 kg, enabling more than 10 units on a single
    vehicle. The platform uses AI and sensor fusion for GNSS-free navigation, object recognition, and terminal guidance.
    A software-defined architecture supports OTA updates. The modular warhead accommodates up to 4.5 kg payloads.
    Gambit is a 6 kg foldable quadcopter with strike range under 25 km and ISR range under 40 km; deployment time is
    under 5 minutes. It carries an EO/IR sensor suite for day and night operation, a NATO STANAG-compliant fuze, and
    an optional fibre-optic guidance link for high-EW environments. If a mission is aborted, Gambit returns to its
    launch point, making it a recoverable asset — a significant logistical advantage over single-use effectors.
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
