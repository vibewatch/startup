  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: independent performance benchmarks
    missingEvidence: >-
      No independent benchmark data for Virtus CEP, terminal guidance accuracy, or kill probability exists
      in any public source. The October 2025 DroneXL adverse report and STARK's rebuttal are both
      unverifiable. No CEP, miss distance, or engagement success rate data is publicly disclosed for
      any STARK product.
    whyItMatters: >-
      Without independent accuracy and reliability data, the primary military value proposition cannot be
      verified; Bundeswehr qualification outcome is unpredictable from public information alone.
    diligencePath: >-
      Request certified test reports, acceptance test records, and independent range results for Virtus
      from any completed evaluation; obtain Bundeswehr qualification test schedule and criteria under NDA.
