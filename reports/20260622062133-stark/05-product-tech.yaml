- id: minerva-stack
  title: Minerva C2 software, MOSA architecture, and multi-domain integration
  body: >-
    Minerva is STARK's command and control software for deploying unmanned systems across land, air, and maritime domains.
    It is described as a command and weapon engagement system (CWES), designed to meet legal and military requirements for
    certifiable weapons effects. The software uses a modular open source architecture (MOSA), which STARK describes as
    providing full digital sovereignty, maximum flexibility, and future-proofing without vendor lock-in. It integrates
    other manufacturers' systems through standardised interfaces and open protocols, acting as middleware between proprietary
    hardware and existing command processes. Core Minerva capabilities include automated target prioritisation, effector
    selection, swarming missions, and combined multi-domain operations from a single ground control station, with the
    operator retaining final engagement authority at all times.

    The April 2026 Bundeswehr exercise validated Minerva's integration with Quantum Systems' Vector ISR drone in a
    recon-to-strike chain, demonstrating detection-to-engagement capability within minutes. STARK describes this as part
    of a longer programme to deliver a scalable, operational capability to the Bundeswehr by 2027. The Six Robotics
    partnership announced in March 2026 adds Norwegian autonomy and swarming software into the Minerva ecosystem,
    extending the middleware's reach to Nordic partners and potentially to other NATO-nation systems through the
    bilateral Hansa Arrangement. STARK's MOSA positioning is credible given Minerva's explicit open-interface design,
    but certification depth, accreditation status with national authorities, and integration testing results outside
    the Bundeswehr exercise remain unpublished and represent material diligence gaps.
  claimRefs:
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE022
