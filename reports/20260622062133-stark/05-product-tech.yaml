figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: >-
    STARK's five-product platform organised as a layered technology stack from hardware platforms at the base
    through navigation and EW-resilience layers, warhead integration, communications, and Minerva C2 at the top,
    with the integration layer connecting to external systems.
  data:
    layers:
    - id: hardware
      label: Hardware platforms
      detail: >-
        Virtus OWE-V (fixed-wing, 130 km+ range, 5 kg payload), Cascade (tube-launched, 100 km, 4.5 kg),
        Gambit OWE-Q (quadcopter, 25 km strike / 40 km ISR, 6 kg), Vanta USV (910 nm, 45+ knots, 200 kg payload).
        All platforms are software-defined and manufactured across Germany, UK, and Ukraine.
      tone: neutral
    - id: navigation
      label: Navigation and guidance
      detail: >-
        GNSS-primary mode: all platforms; GNSS-denied mode: Virtus uses visual odometry + satellite imagery
        localisation; Gambit uses EO/IR visual navigation; Cascade uses AI sensor fusion.
        All three strike platforms claim GNSS-free terminal guidance capability.
      tone: neutral
    - id: ew-resilience
      label: EW resilience and communications
      detail: >-
        Multi-layer datalink (specific technology stack undisclosed) for Virtus and Cascade providing resilience
        in low-connectivity and denied RF environments. Gambit adds optional fibre-optic guidance for highest-EW
        scenarios. Vanta uses IGNSS, visual, and compass navigation.
      tone: warning
    - id: warhead-payload
      label: Warhead and payload integration
      detail: >-
        Virtus: TDW LION STRIKE 110 (LS110) — tandem-shaped charge + fragmentation, 800 mm HHA penetration,
        German-manufactured. Cascade: modular warhead up to 4.5 kg. Gambit: up to 2 kg warhead payload or EO/IR sensor.
        Vanta: 200 kg payload bay supporting INLEAP FASTLIGHT SHIELD laser C-UAS (MoU stage).
      tone: neutral
    - id: minerva-c2
      label: Minerva C2 software (MOSA)
      detail: >-
        Command and weapon engagement system (CWES), modular open source architecture (MOSA), multi-domain
        (land/air/sea), swarming and automated target prioritisation, human-in-the-loop engagement authority,
        full decision logs. Software accreditation ongoing with national authorities.
      tone: warning
    - id: integration
      label: Integration and interoperability layer
      detail: >-
        Standardised interfaces and open protocols enable third-party integration (Quantum Systems Vector ISR,
        Six Robotics autonomy software, existing BMS). Interoperates with NATO Battle Management Systems.
        Six Robotics MoU (Mar 2026) and Quantum exercise (Apr 2026) are the two confirmed integration instances.
      tone: neutral
  approximationNotes: >-
    Stack layers are inferred from public product pages and press releases. Technology stack details
    (specific EW protocols, OTA update architecture, MOSA component list) are not publicly disclosed.
    The warhead and C-UAS payload integration is at varying maturity levels — Virtus/TDW warhead is
    confirmed; INLEAP C-UAS is at MoU stage.
  claimRefs:
  - CE001
  - CE006
  - CE007
  - CE008
