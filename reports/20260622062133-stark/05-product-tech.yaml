- id: FE002
  title: Customer workflow — recon-to-strike operating flow
  type: flow
  layout: standard
  summary: >-
    How STARK's multi-domain platform is used in a recon-to-strike mission, from ISR collection through
    Minerva target prioritisation to effector strike, illustrating the sensor-to-shooter loop that the
    April 2026 Bundeswehr exercise was designed to compress.
  data:
    nodes:
    - id: isr-collection
      label: ISR reconnaissance
      detail: >-
        ISR drone (Quantum Systems Vector or Gambit in ISR mode) collects imagery and positional data on
        targets. STARK does not manufacture the primary ISR layer for long-range missions — this is a
        partner dependency.
      tone: warning
    - id: data-uplink
      label: Data link to Minerva
      detail: >-
        Reconnaissance data transmitted to Minerva ground control station over EW-resilient datalink.
        Loop time between detection and strike tasking was reduced to "minutes" per April 2026 exercise claim.
      tone: neutral
    - id: target-prioritisation
      label: 'Minerva: automated target prioritisation'
      detail: >-
        Minerva AI ranks targets by priority; operator reviews and approves or modifies prioritisation.
        Human-in-the-loop design means final engagement decision rests with the operator, not the algorithm.
      tone: neutral
    - id: effector-tasking
      label: 'Minerva: effector selection and swarming'
      detail: >-
        Operator defines intent; Minerva translates intent into group behaviour and assigns individual
        effectors (Virtus, Cascade, or Gambit) to targets. Swarm coordination enables simultaneous
        multi-effector saturation of a target set.
      tone: neutral
    - id: strike-execution
      label: Strike execution
      detail: >-
        Effector navigates using GNSS or GNSS-denied mode; terminal guidance via visual odometry, sensor
        fusion, or fibre-optic link. Virtus dives at 250 km/h; Cascade at 220 km/h; Gambit at 120 km/h.
      tone: neutral
    - id: bda
      label: Battle damage assessment
      detail: >-
        Post-strike feedback from surviving ISR assets or remaining sensors. Minerva logs full decision
        audit trail for certification review. BDA loop initiates next mission cycle.
      tone: neutral
    - id: abort-return
      label: Abort / safe return (Gambit)
      detail: >-
        If mission is aborted before terminal phase, Gambit returns to launch point as a recoverable asset.
        Virtus and Cascade are one-way effectors with no abort-and-recover capability.
      tone: neutral
    edges:
    - from: isr-collection
      to: data-uplink
    - from: data-uplink
      to: target-prioritisation
    - from: target-prioritisation
      to: effector-tasking
    - from: effector-tasking
      to: strike-execution
    - from: strike-execution
      to: bda
    - from: bda
      to: isr-collection
    - from: target-prioritisation
      to: abort-return
  approximationNotes: >-
    Flow is inferred from STARK product descriptions, the April 2026 Bundeswehr exercise press release,
    and Six Robotics partnership announcement. Loop timing ("minutes") is a company-claimed figure from
    one exercise; no independent KPI or kill-chain timing data has been published.
  claimRefs:
  - CE016
  - CE018
  - CE019
  - CE022
  - CE025
  - CE033

- id: FE003
  title: Critical dependency map
  type: dag
  layout: standard
  summary: >-
    The principal external dependencies that STARK's product platform relies on, showing how warhead supply,
    ISR partners, imagery providers, qualification process, and manufacturing geography create concentration risks
    in the delivery chain.
  data:
    nodes:
    - id: tdw-warhead
      label: TDW warhead supply (LION STRIKE 110)
      detail: >-
        Single confirmed warhead partner for Virtus. German manufacturer; tandem-shaped charge; critical for
        Bundeswehr qualification compliance. Supply concentration risk if TDW capacity is constrained.
      tone: warning
    - id: isr-partners
      label: ISR drone partners (Quantum Systems / Six Robotics)
      detail: >-
        STARK does not produce its own long-range ISR platform. The kill chain depends on Quantum Systems
        Vector (Bundeswehr exercise) and Six Robotics software (MoU). Both are partnership-stage, not
        contractually embedded in Bundeswehr deliverable.
      tone: warning
    - id: imagery-gnss
      label: Satellite imagery and GNSS infrastructure
      detail: >-
        GNSS-denied navigation for Virtus depends on pre-loaded satellite imagery and landmark databases.
        Accuracy of imagery and localisation is a mission-critical input not controlled by STARK.
      tone: warning
    - id: bundeswehr-qual
      label: Bundeswehr qualification process
      detail: >-
        The Bundeswehr qualification milestone is the gate for call-off orders under the Feb 2026 framework.
        Until cleared, the framework does not generate revenue. Schedule, criteria, and governing body
        are not publicly disclosed.
      tone: warning
    - id: national-accreditation
      label: National authority software accreditation (Minerva CWES)
      detail: >-
        Minerva's weapons engagement features require accreditation by national authorities before
        operational deployment in Bundeswehr context. Accreditation scope and timeline not publicly disclosed.
      tone: warning
    - id: production-sites
      label: Multi-site manufacturing (Germany, UK, Ukraine)
      detail: >-
        Production across three geographies provides resilience but creates export compliance, logistics,
        and inter-site quality coordination risks. Ukraine site (2,000 sqm, 200+ specialists) operates in an
        active conflict zone.
      tone: warning
    edges:
    - from: tdw-warhead
      to: bundeswehr-qual
    - from: isr-partners
      to: bundeswehr-qual
    - from: imagery-gnss
      to: bundeswehr-qual
    - from: national-accreditation
      to: bundeswehr-qual
    - from: production-sites
      to: bundeswehr-qual
    - from: bundeswehr-qual
      to: isr-partners
  approximationNotes: >-
    Dependencies are inferred from product descriptions, partnership announcements, and the Bundeswehr
    framework terms. Actual contractual structure between STARK and TDW, the ISR partners, and the
    national authorities is not publicly disclosed. The DAG simplifies a more complex inter-dependency
    network.
