  - FE003

- id: testing-partnerships
  title: Testing history, strategic partnerships, and integration validation
  body: >-
    STARK's publicly confirmed testing milestones include the September 2025 NATO DYNAMIC MESSENGER exercise in Portugal,
    where Vanta-4 and Vanta-6 were introduced and tested alongside NATO capabilities; the December 2025 first hot strike
    of the TDW LS110 warhead integrated with Virtus; and the April 2026 Bundeswehr exercise demonstrating the
    Virtus-Minerva-Vector recon-to-strike chain. These milestones represent meaningful technical validation steps,
    particularly the warhead integration, which STARK describes as evidence of mass-producible German-manufactured munitions.

    Partnership activity has been intense in the first half of 2026. The Six Robotics MoU (March 2026) provides
    autonomy and swarming software from a Norwegian company with FFI links, enabling joint recce-strike missions
    across national boundaries. The INLEAP Photonics partnership (April 2026, Hannover Messe) integrates the
    FASTLIGHT SHIELD laser C-UAS into Vanta USV, broadening the platform's counter-drone defensive capability.
    Both partnerships are at MoU or early integration stage and have not yet produced independently verified
    field results. The adverse evidence record is also significant: the DroneXL article from October 2025 reported
    that Virtus failed all four strike attempts in trials with British and German armed forces, citing unnamed
    Financial Times sources, and characterised it as a catastrophic failure for a company valued at $500 million.
    STARK published a defensive statement citing a Ukrainian military unit that had requested additional Virtus
    systems after "high efficiency and combat effectiveness," and pointing to system improvements since those
    trials. Neither account is independently verifiable from public sources.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  tableRefs:
  - TE005

- id: risks-compliance
  title: Trust, compliance, regulatory risk, and technical uncertainty
  body: >-
    STARK's published product descriptions emphasise human-in-the-loop design, CWES certification intent, and STANAG
    compliance for Gambit's fuze system. These are substantive architectural commitments, but public evidence of
    completed certifications, national authority accreditations, or independent safety testing is absent. The
    Bundeswehr qualification process for Virtus — a prerequisite for call-off orders under the February 2026 framework —
    has not been publicly described in terms of milestone schedule, test criteria, or completion timeline, and no
    independent qualification body has made a public statement.

    OTA update capability, described for both Virtus and Cascade, creates a cyber-physical security surface that is
    not addressed in any public STARK documentation. Software-defined weapons with over-the-air capability require
    secure update delivery chains, firmware signature verification, and rollback controls; none of these are
    publicly confirmed. The MOSA architecture provides integration flexibility but also creates an integration
    testing burden for each third-party system added. As Minerva's swarming and automated targeting features evolve,
    they attract increasing scrutiny from the ICRC, which requires that any autonomous weapon system have meaningful
    human control over individual targeting decisions, and from HRW's Stop Killer Robots campaign, which calls for
    a treaty prohibition. The EU's emerging AI Act regulation and the German legal framework on weapons authorisation
    could also constrain how Minerva's automated target prioritisation and swarming features are marketed and certified
    as Bundeswehr qualification advances. None of these regulatory risks are publicly quantified by STARK.
  claimRefs:
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
  - CE037
  - CE038
