  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue and backlog
        - No public ARR, revenue run rate, or contracted backlog from BAM-3 customers
        - >-
          Without revenue, EV/Sales comp anchors cannot be applied; valuation reduces to tech-option
          framing which cannot support a buy call.
        - Management and finance diligence; voluntary press disclosure.
      - - Gross margin and unit economics
        - No disclosed cost per kilogram, gross margin, or manufacturing economics for SCC55
        - >-
          Gross margin determines whether Group14 can be cash-flow positive at BAM-3 scale before
          BAM-2 capital is fully deployed.
        - Operations and finance diligence.
      - - Cap-table and preference terms
        - No public post-money, liquidation preference stack, or participating terms
        - >-
          Preference overhang from $1B-plus raised could eliminate common equity upside even in a
          successful base-case exit scenario.
        - Legal and cap-table diligence via secondary-market data providers.
      - - BAM-2 commissioning timeline
        - No confirmed commissioning date or ramp schedule post-furloughs
        - >-
          BAM-2 is the largest driver of bull-case upside; its timeline determines when Group14 has
          two operating factories supporting a credible exit multiple.
        - Operations diligence; site visit or public press update.
      - - AI and data-center demand validation
        - No disclosed signed offtake or commercial contract for battery-in-data-center applications
        - >-
          The data-center pivot is the primary stated offset to EV tariff headwinds; without a
          contract, it is speculative demand and should be excluded from base-case assumptions.
        - Commercial diligence; customer reference verification.
    notes: >-
      These five asks are the minimum package required to move from watchlist to an entry price
      opinion; no other diligence workstream should start before these are addressed.
