  - id: TV003
    title: Bull, base, and bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          BAM-2 reaches full capacity by end of 2027; EV market recovers; silane factory commissions
          on schedule; Group14 begins disclosing revenue or contracted backlog.
        - >-
          $8B-$10B range becomes credible if revenue emergence supports an EV/Sales multiple anchored
          between Sila's private mark and Enovix's public comp; strategic M&A at premium is plausible.
        - >-
          Requires multiple simultaneous execution wins; any one miss compresses the range materially.
        - >-
          Currently low given two prior BAM-2 slips; signal rises if BAM-2 commissions by Q4 2026.
      - - Base
        - >-
          BAM-3 runs normally; BAM-2 ramps partially by mid-2026; EV market stabilizes; tariffs
          moderate; revenue remains undisclosed but backlog grows.
        - >-
          $5B-$6B is directionally consistent with the Series D anchor; investors who entered at the
          D can sustain a hold posture pending a 2027-2028 liquidity event.
        - >-
          Continued opacity on revenue and cap-table terms makes precise return underwriting impossible;
          dilution and timing risk are material.
        - Best fit for current public evidence; most likely scenario absent specific BAM-2 news.
      - - Bear
        - >-
          BAM-2 delays extend 12-plus months into late 2026 or 2027; Chinese tariff losses compound;
          down-round becomes necessary to fund operations; AI-data center channel does not scale.
        - >-
          $2B-$3B reflects significant multiple compression; down-round impairs Series C and D
          investors; BAM-3 alone cannot justify the existing capital stack at current scale.
        - >-
          Capital intensity, further layoffs, and a constrained U.S. market could accelerate cash burn.
        - Risk rises quickly if BAM-2 produces no operational update by Q3 2026.
    notes: >-
      Scenario logic is directional because Group14's valuation and revenue are not public; ranges
      are anchored to comparable company data and financing history.
