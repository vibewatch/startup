callouts:
  - calloutType: recommendation
    title: Track while awaiting BAM-2 and revenue proof
    body: >-
      Group14 is a genuine technology and commercial leader in silicon anode materials, but the current
      evidence base does not support a buy recommendation at the ~$5.27 billion estimated mark. Track
      the company through BAM-2 commissioning and any revenue disclosure event; a confirmed ramp plus
      backlog transparency would move the call to buy. A further BAM-2 slip or down-round would move
      it to avoid.
    claimRefs:
      - CV022
      - CV032
      - CV038
      - CV039
      - CV040
  - calloutType: risk
    title: BAM-2 execution delay is the central valuation risk
    body: >-
      Two prior commissioning slips, July 2025 layoffs, and March 2026 furloughs at Moses Lake signal
      that BAM-2's path to full production is not resolved. Until the factory achieves sustained
      commissioning, the bull-case multiple is not achievable and the bear-case risk of a down-round
      remains live. Investors should treat any BAM-2 update as the highest-priority monitoring signal.
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV032
      - CV033
  - calloutType: strength
    title: BAM-3 commercial production de-risks technology but not entry price
    body: >-
      BAM-3's 10 GWh of commercial SCC55 production since September 2024 is meaningful differentiation
      from pre-commercial battery startups. It proves the manufacturing process, not just the laboratory
      chemistry. That proof is the main reason the track recommendation is not avoid. However, BAM-3
      alone at its current scale does not justify the $5.27 billion estimated mark without revenue
      disclosure; it is a necessary but not sufficient condition for a buy call.
    claimRefs:
      - CV005
      - CV021
      - CV025
      - CV027
