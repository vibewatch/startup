  - id: thesis-and-diligence
    title: Recommendation, thesis-break triggers, and diligence asks
    body: >-
      The most defensible call on Group14 as of 2026-05-25 is track with medium confidence, a high risk
      rating, and a fair valuation stance. The positive side of the ledger is real: commercial production at
      BAM-3, 150-plus customers, strategic investor validation, a strong patent portfolio, and $1.76 billion
      in total capital deployment. The negative side is also concrete: BAM-2 has slipped twice, U.S.
      employees were laid off in July 2025, further furloughs occurred in March 2026, tariffs damaged
      Chinese demand that represents 70 to 80 percent of the global battery market, and Group14 has never
      disclosed revenue. That combination prevents a buy recommendation because it leaves price precision
      and downside protection unresolved.

      The recommendation improves to buy only if BAM-2 achieves full commissioning, the company discloses
      revenue or contracted backlog, and a credible IPO or secondary timeline emerges. It would deteriorate
      to avoid if BAM-2 delays trigger a down-round below the Series D mark or if Chinese tariff exposure
      leads to customer loss concentrated enough to threaten BAM-3 utilization. Investors currently tracking
      the company should focus due diligence on four variables: BAM-2 commissioning trajectory, any revenue
      or backlog disclosure, post-Series D cap-table preference terms, and whether the AI-data center channel
      produces signed offtake agreements rather than stated interest. None of those variables are publicly
      visible today. Until they are, the right posture is disciplined watchlist interest rather than entry
      at the current estimated mark without those diligence answers in hand.
