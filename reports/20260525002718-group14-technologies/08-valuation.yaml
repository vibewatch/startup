  - id: financing-history
    title: Financing history and capital structure context
    body: >-
      Group14 has assembled one of the largest private capital stacks in the silicon battery materials
      category. The financing timeline runs from a $17 million Series B in 2020 from SK Materials, through
      a $614 million Series C in 2022 led by Porsche AG with a subsequent $214 million extension, to the
      $463 million Series D in August 2025 led by SK Inc. Total disclosed equity raised exceeds $1 billion.
      On top of equity, the U.S. Department of Energy committed $100 million under the Bipartisan
      Infrastructure Law in 2022 for the BAM-2 anode factory and selected Group14 for up to $200 million in
      September 2024 for a 7,200 metric ton per year silane gas factory — both in Moses Lake, Washington.
      Combined public and private capital deployment exceeds $1.76 billion, a scale that significantly narrows
      the addressable investor universe and raises the bar for exit multiples.

      The Series D structure includes a strategically important transaction: Group14 acquired 100 percent
      ownership of BAM-3 from SK Inc. as part of the deal, converting a joint venture into a wholly owned
      asset. That structural move improves Group14's long-run economics if BAM-3 is profitable, but it also
      removes a capital-sharing partner and concentrates manufacturing risk on Group14's balance sheet. SEC
      Form D records confirm Group14's Delaware incorporation and 2021 equity offering structure, providing
      regulatory corroboration of the fundraising timeline. The DOE Environmental Assessment EA-2220 prepared
      by the National Energy Technology Laboratory further confirms the scope and terms of the BAM-2 grant.
    claimRefs:
