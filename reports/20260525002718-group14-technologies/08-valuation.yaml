  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - BAM-2 commissioning misses again
        - No operational update by Q3 2026 or slip into 2027
        - >-
          Undermines the U.S. manufacturing scale thesis; raises capital requirement and down-round
          probability; further workforce reductions likely.
        - Downgrade to avoid if slip extends beyond Q4 2026; demand capital runway disclosure.
      - - Revenue disclosure fails to materialize
        - No backlog, ARR, or revenue announcement by end of 2026
        - >-
          Prevents EV/Sales multiple anchoring; forces investors to rely on tech-option premium alone;
          comp set collapses to QS pre-revenue scenario, not Enovix revenue-growth scenario.
        - Hold valuation stance at unknown; require material discount to estimated mark.
      - - Chinese tariff losses persist or deepen
        - Chinese battery maker demand contracts through Q4 2026
        - >-
          Concentrates revenue risk on non-Chinese customer base; reduces the 150-customer metric
          to a smaller effective commercial base.
        - Reassess BAM-3 utilization; widen the bear case range.
      - - Down-round financing occurs
        - New equity priced below the ~$5.27B Series D mark
        - >-
          Signals strategic investors lack confidence to maintain the mark; raises preference overhang
          for earlier investors; makes exit at attractive terms harder.
        - Exit watchlist unless new financing is accompanied by revenue visibility and ramp proof.
    notes: >-
      Triggers are observable from public announcements and disclosed financing events; each has a
      specific monitorable signal trackable without management access.
    claimRefs:
