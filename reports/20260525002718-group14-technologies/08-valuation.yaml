  - id: comparable-set
    title: Comparable set and valuation benchmarks
    body: >-
      Group14's $5.27 billion analyst estimate sits at the high end of a three-tier comparable landscape.
      Among public pre-revenue battery technology companies, QuantumScape had a market capitalization of
      approximately $5.04 billion and an enterprise value of $4.21 billion as of May 2026, with zero reported
      revenue. That comparison illustrates the tech-option premium that public markets assign to battery
      innovations with credible intellectual property, but QuantumScape has not yet reached Group14's level
      of commercial production. Among early-commercial public comps, Enovix Corporation had an enterprise
      value of approximately $1.47 billion against trailing-twelve-month revenue of roughly $34 million as of
      mid-2026, implying an EV/Sales multiple of approximately 42 times — a reference point for what a
      commercial-stage silicon battery company actually trades at with revenue transparency.

      Among private comps, Sila Nanotechnologies reached a reported $3.3 billion valuation in 2021 and raised
      a $375 million Series G in 2024 to scale U.S. production. Sila subsequently opened its first U.S.
      factory in 2025, heightening competitive pressure on Group14's BAM-2 ramp. Battery energy storage M&A
      tracked 227 deals totaling $24.1 billion in 2023 according to White & Case, providing a floor reference
      for strategic acquirer valuations in the broader sector. Against this comp set, Group14's $5.27 billion
      estimate appears plausible given BAM-3's operating proof but stretched relative to Enovix's $1.47
      billion EV if revenue remains undisclosed. The comparable set is not a precise fair-value tool; it is
      a discipline framework that sets an upper and lower bound on acceptable price entry.
    claimRefs:
