  - id: exit-readiness
    title: Exit readiness and optionality
    body: >-
      Group14 has not disclosed an IPO timeline, but the composition of its investor base provides
      meaningful strategic optionality. Porsche Investments, SK Inc., Microsoft Climate Innovation Fund,
      and OMERS each represent potential strategic or financial sponsors who could facilitate a secondary
      transaction, a trade sale, or a structured IPO process. Porsche's automotive-grade validation
      relationship gives Group14 a credible path to OEM-led M&A if BAM-2 ramps successfully and EV
      electrification accelerates in Europe. Microsoft's participation signals data-center adjacent demand
      channels that could diversify the customer base away from EV cyclicality.

      Group14's defensible foundation for any exit path includes three core assets: BAM-3 as a 10 GWh
      commercial factory with paying customers, a 170-plus patent portfolio protecting SCC55, and supply
      agreements with five leading cell manufacturers representing a material portion of global
      lithium-ion production. These assets lower the execution risk of any exit scenario relative to a
      purely pre-commercial company. The most important remaining variable is BAM-2: a fully operational
      dual-factory configuration would command meaningfully better M&A pricing than a single-factory
      story. Additionally, the pivot toward AI-data center battery demand announced in 2025 — where energy
      density and cycle life matter independently of EV market dynamics — could become a genuine second
      revenue channel if validated with disclosed offtake agreements before the next expected liquidity
      window.
    claimRefs:
