  - id: scenario-analysis
    title: Bull, base, and bear scenario analysis
    body: >-
      Three scenarios span the credible valuation range given the current evidence set. The bull case — a
      valuation of $8 billion to $10 billion — requires BAM-2 to reach full capacity by 2027, EV market
      recovery to accelerate silicon adoption in North America, and the silane factory to come online on
      schedule. In that scenario, Group14 would control both upstream silane supply and anode production,
      materially improving its cost position and reducing its exposure to Chinese silane imports. The bull
      case also requires some form of revenue disclosure, because without financial evidence, public markets
      and acquirers cannot pay a premium multiple with confidence.

      The base case — approximately $5 billion to $6 billion — reflects Group14's current trajectory:
      BAM-3 operating at full capacity, BAM-2 ramping partially in 2026, EV market stabilizing without
      significant recovery, and tariff pressure moderating as customers diversify. In the base case,
      Group14's Series D price roughly holds, and the company retains optionality for a 2027 or 2028
      liquidity event. The bear case — $2 billion to $3 billion — would materialize if BAM-2 delays extend
      another 12 or more months, forcing a down-round, or if Chinese customer tariff losses persist through
      2027 without an AI-data center offset reaching material scale. In the bear case, the company's ability
      to service a $1.76 billion total capital deployment from a single operating factory would be questioned
      by subsequent investors. Each scenario is directional rather than precise because revenue and margin
      data remain private.
    claimRefs:
      - CV033
