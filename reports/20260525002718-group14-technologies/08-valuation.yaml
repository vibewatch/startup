company:
  name: Group14 Technologies
chapter:
  number: 8
  title: Valuation
  summary: >-
    Group14 Technologies carries an analyst-estimated post-money valuation of approximately $5.27 billion
    following its $463 million Series D in August 2025, positioning it as the highest-valued private silicon
    anode company globally; a track recommendation with medium confidence reflects strong technology
    credentials, commercial production at BAM-3 in South Korea, and strategic backing from Porsche, SK, and
    Microsoft, offset by repeated BAM-2 production delays, U.S. workforce reductions, EV market headwinds,
    tariff-driven Chinese demand erosion, and the complete absence of public revenue or margin disclosure.
sections:
  - id: investment-context
    title: Investment context and valuation anchor
    body: >-
      Group14's Series D in August 2025 set the most recent private-market price-setting event at $463 million
      raised, with secondary market analysts estimating a post-money valuation of approximately $5.27 billion.
      That figure is not company-confirmed — a Reuters source described the new valuation only as higher than
      the 2022 price, which exceeded $1 billion. The gap between what is publicly known and what an investor
      needs to underwrite is large: Group14 does not disclose annual revenue, gross margin, or cap-table terms.
      In that environment, the right discipline is to use the analyst-estimated mark as an anchor rather than
      a confirmed fair value, and to treat it as a starting point for scenario analysis rather than a
      definitive conclusion.

      The investment case for Group14 rests on a narrow but demonstrable set of facts: BAM-3, the joint
      venture factory in South Korea, achieved 10 GWh of annual capacity and began shipping SCC55 commercially
      in September 2024, confirming that the technology works at production scale. The company counts more than
      150 customers representing approximately 95 percent of global lithium-ion battery production. Its patent
      portfolio exceeds 170 issued patents globally. These are not paper claims — they are operating proof
      that distinguishes Group14 from purely pre-commercial battery material startups. The anti-thesis is
      equally grounded: BAM-2 in Moses Lake, Washington slipped its commissioning target at least twice and
      triggered U.S. workforce reductions in July 2025 and further furloughs in March 2026. Without public
      revenue, the five-billion-dollar mark hangs on execution confidence rather than financial evidence.
