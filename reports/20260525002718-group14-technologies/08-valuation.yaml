  - id: TV002
    title: Thesis and anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - >-
          BAM-3 commercial production at 10 GWh annually proves silicon-carbon anode technology works
          at manufacturing scale, distinguishing Group14 from pre-commercial competitors.
        - >-
          If BAM-3 utilization rates fall or customer offtake contracts are renegotiated downward,
          the production-proof pillar weakens materially.
      - - >-
          150-plus customers representing 95 percent of global lithium-ion battery production create
          a market-penetration base that incumbents cannot easily replicate.
        - >-
          If tariff-driven Chinese demand destruction persists through 2027, the customer count alone
          does not protect revenue because Chinese manufacturers dominate the battery market.
      - - >-
          Strategic investors including Porsche, SK, and Microsoft signal multi-dimensional value:
          automotive validation, manufacturing partnership, and data-center adjacency.
        - >-
          If these investors exit at reduced marks or if new co-investment rights are dilutive, the
          strategic investor signal inverts.
      - - >-
          A 170-plus patent portfolio and BASF-validated 1,500-cycle performance benchmark represent
          durable IP moats in the silicon anode space.
        - >-
          If Sila or Nexeon achieve comparable patent depth and manufacturing scale before Group14
          reaches BAM-2 full capacity, IP moat value narrows.
      - - >-
          $300M-plus in DOE grant funding reduces capital intensity for BAM-2 and the silane factory,
          improving the effective cost of the U.S. manufacturing build.
        - >-
          If the DOE grant is drawn down conditionally and performance milestones are not met, grant
          support could be reduced or clawed back.
    notes: >-
      The anti-thesis currently outweighs the thesis on price support because revenue, margins, and
      cap-table terms remain undisclosed; the thesis is stronger on technology and market position.
