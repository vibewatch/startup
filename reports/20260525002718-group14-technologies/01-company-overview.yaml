  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >
        Group14 has not disclosed annual revenue, EBITDA, or gross margin. All financial performance
        must be inferred from funding milestones and customer counts. Gap persists as of May 2026.
      whyItMatters: >
        Without revenue data, it is impossible to assess unit economics, pricing power, or the
        commercial return on more than $1 billion in invested capital. Investor valuation models
        cannot be grounded in actual financial performance.
      diligencePath: >
        Request commercial dataroom disclosure including annual revenue by geography and customer tier,
        SCC55 average selling price per kilogram, and gross margin by product application.
      relatedQuestionRefs: [QO010]

    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >
        No audited or disclosed valuation figure exists. Press characterizations of unicorn-class are
        not sourced to a formal data point. Post-Series D implied valuation is unknown.
      whyItMatters: >
        Without a disclosed valuation, it is impossible to assess whether the $1B+ in equity raised
        implies a reasonable return path for investors or whether dilution risk is material.
      diligencePath: >
        Request Series D term sheet or cap table disclosure showing pre-money valuation, share price,
        and liquidation preferences per investor class.
      relatedQuestionRefs: [QO010]
      relatedTableRefs: [TO003]

    - type: missing-source
      severity: material
      topic: manufacturing
      missingEvidence: >
        Group14 has not announced a firm commissioning date for BAM-2 Moses Lake as of May 2026.
        At least four prior timeline targets have been missed. Gap is active and unresolved.
      whyItMatters: >
        BAM-2 is Group14 primary US capacity asset; continued delay limits US supply commitments,
        creates customer delivery risk, and may give competitors time to establish alternative supply.
      diligencePath: >
        Request written construction schedule with milestone dates, third-party project management
        certification, and utility interconnection agreements from Moses Lake facility.
      relatedQuestionRefs: [QO006]

    - type: private-evidence-only
      severity: minor
      topic: adverse-events
      missingEvidence: >
        Group14 has not disclosed the precise headcount following July 2025 US layoffs. Third-party
        estimates of 260-270 are unverified by the company. BAM-3 Korea headcount is also undisclosed.
      whyItMatters: >
        Accurate headcount supports assessment of organizational capacity to commission BAM-2 and
        support 160+ customers while managing a multi-continent manufacturing footprint.
      diligencePath: >
        Request current organizational chart, headcount by location and function, and BAM-3 Korea
        workforce size from Group14 management.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002]

    - type: missing-source
      severity: minor
      topic: manufacturing
      missingEvidence: >
        No public update on construction or disbursement status of the up-to-$200M DOE silane factory
        award as of May 2026. The conditional nature of the award means actual disbursement is unconfirmed.
      whyItMatters: >
        The silane factory is a critical upstream feedstock investment; delays or non-disbursement would
        increase Group14 dependency on the Germany Schmid Silicon plant and extend domestic supply
        chain vulnerability.
      diligencePath: >
        Review DOE Office of Manufacturing and Energy Supply Chains project status page; request project
        schedule and disbursement milestones from Group14.
      relatedQuestionRefs: [QO012]

    - type: enumeration-incomplete
      severity: minor
      topic: commercial-traction
      missingEvidence: >
        Group14 claim that customers represent 95% of worldwide lithium-ion battery production volume
        is a company assertion not independently verified by any third-party analyst or auditor. The
        methodology for calculating this percentage is undisclosed.
      whyItMatters: >
        The 95% claim anchors Group14 market positioning narrative; if the methodology is flawed or
        the denominator is narrowly defined, the competitive moat implied by this figure could be
        overstated.
      diligencePath: >
        Request from Group14 the methodology, denominator definition, and date basis for the 95%
        worldwide Li-ion production volume claim. Cross-reference against BNEF or BloombergNEF cell
        manufacturer market share data.
      relatedQuestionRefs: [QO024]

    - type: missing-source
      severity: minor
      topic: adverse-events
      missingEvidence: >
        Group14 has not publicly described any strategy for managing revenue concentration risk
        from Chinese battery customers given US-China tariff escalation and EV policy uncertainty.
        No press release, investor letter, or management commentary addresses this directly.
      whyItMatters: >
        If 70-80% of global Li-ion production capacity sits in China, Group14 revenue exposure
        to Chinese customers could be material; a tariff-driven demand pullback could impair
        BAM-3 utilization and Series D return assumptions.
      diligencePath: >
        Review any investor communications or management presentations for geographic revenue
        breakdown; request customer concentration data by country from Group14 management.
      relatedQuestionRefs: [QO028, QO021]
