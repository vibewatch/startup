  - id: adverse-events
    title: Headwinds & Adverse Events
    body: >
      Group14's scale-up trajectory has confronted several intersecting headwinds beginning
      in mid-2025. First, the US Senate eliminated the $7,500 federal EV tax credit in mid-2025
      as part of broader budget reconciliation legislation, reducing near-term demand certainty
      for domestic EV battery supply chains. Second, tariff uncertainty associated with US trade
      policy toward China compounded the concern, particularly because Chinese battery makers
      represent an estimated 70-80% of global lithium-ion capacity—a substantial portion of
      Group14's existing and potential customer base.


      In July 2025, Group14 implemented an undisclosed round of US workforce reductions,
      citing federal policy uncertainty. Third-party employment databases suggest headcount
      declined from approximately 400 to roughly 260-270 employees following the layoffs.
      In January 2026, the company furloughed a portion of its Moses Lake construction workforce
      as the BAM-2 facility neared but had not yet reached commissioning readiness.


      BAM-2's repeated construction schedule slippage—at least four disclosed timeline revisions
      from late 2024 through early 2026—creates execution risk for the Moses Lake campus, which
      remains Group14's primary US production asset. Meanwhile, Sila Nanotechnologies, a direct
      SiC anode competitor, commissioned its own Moses Lake production facility in September 2025,
      intensifying local and product-level competition.
