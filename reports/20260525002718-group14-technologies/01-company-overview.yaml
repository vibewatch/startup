  - id: leadership-governance
    title: Leadership & Governance
    body: >
      Rick Luebbe serves as Chief Executive Officer and co-founder, providing continuity from
      founding through the company's multi-factory scale-up phase. Rick Costantino, also a
      co-founder, serves as Chief Technology Officer with responsibility for materials science
      and process engineering. Aaron Feaver, the third co-founder, has been publicly named in
      connection with the company's early scientific work and patent portfolio.


      The Board of Directors reflects a deliberate mix of operational experience, strategic investor
      representation, and automotive industry credibility. Dr. Kim Mink, former CEO of specialty
      chemicals company Innophos, serves as a director. Dr. Michael Steiner represents Porsche AG
      as Executive Vice President of Research and Development. Bob Lutz—former Vice Chairman of GM,
      Ford, and Chrysler—provides legacy OEM perspective. Gerry Langeler of OVP Venture Partners
      has served since the Series A round. Richard K. Palmer, former CFO of Stellantis, joined the
      board in March 2025, adding automotive-scale finance and M&A expertise ahead of the Series D.


      Group14 has not publicly disclosed an independent audit committee composition, total board
      size beyond named members, or any non-US subsidiary board structures. Leadership compensation
      is also undisclosed, consistent with the company's private status.
