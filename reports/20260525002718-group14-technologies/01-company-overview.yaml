  - id: manufacturing-milestones
    title: Manufacturing Footprint & Key Milestones
    body: >
      Group14 operates a three-facility manufacturing strategy designed to supply anode material
      at gigawatt-hour scale to global battery makers. Each factory is designated a Battery Active
      Material facility (BAM).


      BAM-1, located at the company's Woodinville, WA headquarters, opened in April 2021 and
      demonstrated ton-scale SCC55 production. It remains operational as a process development
      and qualification center. BAM-2, Group14's flagship US commercial facility, broke ground
      in Moses Lake, Washington in April 2023 on a campus planned at one million square feet.
      Two initial production modules are each rated at 2,000 metric tons per year (approximately
      10 GWh of anode capacity each). The facility has experienced meaningful construction delays:
      the original late-2024 target slipped to Q2 2025, then to fall 2025, and was subsequently
      described as early 2026 and then nearing completion as of March 2026. In January 2026,
      Group14 announced temporary furloughs of Moses Lake workers while construction continued.
      As of May 2026, the Moses Lake campus is approximately 90% complete with commissioning
      underway.


      BAM-3 in Sangju, South Korea was established through a joint venture with SK Inc. in 2021.
      The facility delivered SCC55 to more than 100 customers beginning in September 2024.
      In August 2025, Group14 acquired SK Inc.'s remaining 75% ownership stake as part of the
      Series D transaction, making BAM-3 a wholly owned subsidiary. BAM-3 reached full EV-scale
      commercial production—10 GWh per year (2,000 metric tons per year)—on March 12, 2026,
      representing the first confirmed Group14 facility at full rated capacity.


      Group14 also owns Schmid Silicon GmbH (acquired July 2023) in Spreetal, Germany, which
      produces monosilane—the key chemical precursor to SCC55. A second, larger silane facility
      is planned for Moses Lake under the DOE award.
