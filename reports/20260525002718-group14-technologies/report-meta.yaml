companyProfile:
  summary: |
    Group14 Technologies is a Woodinville, Washington-based battery materials company founded in
    2015 to commercialize SCC55®, a silicon-carbon composite anode material that can replace part
    or all of conventional graphite in lithium-ion batteries. The company positions SCC55 as a
    drop-in material for existing cell lines that delivers materially higher energy density,
    faster charging, and better cycle life than graphite-only anodes. Group14 has raised more
    than $1.1B in equity, counts strategic investors including SK, Porsche, ATL, Microsoft,
    OMERS, and Decarbonization Partners, and now operates a commercial footprint spanning
    Woodinville, Moses Lake, and the wholly owned BAM-3 plant in Sangju, South Korea. The core
    investment debate is whether real customer traction and BAM-3 production are enough to offset
    repeated BAM-2 delays, policy exposure, and very limited public financial disclosure.
  foundedDate: '2015-01-01'
  founders:
    - name: Rick Luebbe
      role: CEO, Co-founder
      background: Battery entrepreneur leading Group14's commercialization, capital raising, and strategic partnerships.
      claimRefs: [CO002]
    - name: Rick Costantino
      role: CTO, Co-founder
      background: Technical co-founder overseeing SCC55 materials science, process development, and manufacturing scale-up.
      claimRefs: [CO002]
    - name: Aaron Feaver
      role: Co-founder
      background: Early company builder who helped establish Group14's founding team and silicon-anode commercialization path.
      claimRefs: [CO002]
  foundingLocation: Woodinville, WA
  headquarters: Woodinville, WA
  productSummary: |
    Group14's core product is SCC55®, a silicon-carbon composite anode made by depositing
    nano-silicon into a porous hard-carbon scaffold using a chemical-vapor-deposition process.
    The company sells SCC55 as a battery-material input to cell manufacturers and OEM supply
    chains, while also pursuing vertically supportive infrastructure such as BAM-2 in Moses Lake
    and a planned domestic silane facility.
  customerFocus: Cell manufacturers, EV platforms, consumer electronics OEM supply chains, eVTOL programs, and emerging high-performance energy-storage applications.
  businessModel: Direct B2B sale of SCC55 anode material, with potential future licensing and silane-feedstock sales once the domestic silane plant is finalized.
  stage: Late venture / growth-stage private company
  fundingStatus: More than $1.1B raised across venture and strategic rounds, capped by a $463M Series D in August 2025; exact post-money valuation undisclosed, with secondary estimates around $5.27B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO021, CO024, CO032, CI001, CI010, CV034]

summary:
  headline: |
    Group14 is one of the most credible private battery-materials platforms in advanced anodes:
    it has real commercial deployments, a blue-chip strategic cap table, and a now-operating
    Korean production asset. But the underwriting case is constrained by BAM-2 execution slippage,
    policy and supply-chain dependencies, and sparse financial disclosure. On today's estimated
    valuation, the name looks interesting enough to track closely, but not yet de-risked enough
    to underwrite aggressively.
