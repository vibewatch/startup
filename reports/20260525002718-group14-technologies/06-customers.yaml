figures:
  - id: FU001
    title: Group14 customer journey map — sampling to production
    type: journey-map
    layout: wide
    summary: >-
      Illustrates the typical Group14 customer lifecycle from initial SCC55 sampling
      through R&D qualification, pilot production, and full commercial supply, mapped
      against key milestones for representative named accounts.
    data:
      nodes:
        - id: cj1
          label: Initial sampling
          detail: >-
            Customer requests SCC55 samples; lab benchmarking against graphite on
            energy density, cycle life, and rate capability.
          tone: neutral
        - id: cj2
          label: R&D qualification
          detail: >-
            Cell design integration; cycling tests; capacity and safety validation;
            NDA supply agreement for pilot runs.
          tone: neutral
        - id: cj3
          label: Pilot production
          detail: >-
            Small-scale commercial cell runs; safety and reliability testing; customer
            internal qualification gate.
          tone: positive
        - id: cj4
          label: Commercial contract
          detail: >-
            Binding offtake or supply agreement; volume and price committed over
            multiple years.
          tone: positive
        - id: cj5
          label: Production deployment
          detail: >-
            SCC55 shipped in commercial products; volume scaling with BAM factory
            capacity; downstream product launches (Molicel P50B, ATL smartphones).
          tone: positive
        - id: cj6
          label: Deeper partnership
          detail: >-
            Technical co-development or joint go-to-market (BASF Licity, Sionic RISP,
            StoreDot XFC) expanding the customer relationship beyond supply.
          tone: positive
    approximationNotes: >-
      This journey abstracts several observed buying motions into one qualitative path;
      actual customer timelines and stage gates differ by cell format, application, and
      geography.
    claimRefs:
      - CU006
      - CU009
      - CU012
      - CU013
      - CU014
      - CU021

