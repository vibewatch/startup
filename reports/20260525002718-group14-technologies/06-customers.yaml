      Group14's customer path moves from initial SCC55 sampling through qualification
      and contracting to production deployment, with some customers deepening into
      technology co-development partnerships.
    data:
      nodes:
        - id: af1
          label: Sampling / evaluation
          detail: >-
            Battery manufacturer requests SCC55 samples; benchmark vs. graphite on
            energy density, cycle life, fast-charge capability.
          tone: neutral
        - id: af2
          label: R&D qualification
          detail: >-
            Full cell integration; NDA pilot supply; cycling, safety, and thermal
            characterisation under customer cell-design requirements.
          tone: neutral
        - id: af3
          label: Commercial contract
          detail: >-
