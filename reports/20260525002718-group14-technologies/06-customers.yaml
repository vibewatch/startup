  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: >-
        Group14 does not publish NRR, GRR, or customer churn rates in any reviewed press
        release, investor communication, or public filing. Retention metrics cannot be
        reconstructed from available public sources.
      whyItMatters: >-
        Absence of retention data prevents investors from underwriting the durability and
        value of the customer base; it is the primary blind spot in this chapter.
      diligencePath: >-
        Request audited customer concentration schedule, NRR and GRR by customer cohort,
        waterfall of contracted vs. sampling revenue, and contract renewal history for
        top 10 customers.
      relatedQuestionRefs:
        - QU009
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: offtake-agreements
      missingEvidence: >-
        All five June 2024 offtake-agreement counterparties remain confidential under NDA.
        The identities, credit quality, and volume schedules of the 3 EV and 2 CE
        manufacturers cannot be independently verified from public sources.
      whyItMatters: >-
        Anonymous counterparty commitments of $300 M+ cannot be underwritten without
        knowing counterparty credit quality and contract enforceability.
      diligencePath: >-
        Request redacted or direct disclosure of offtake counterparty identities,
        volume schedules, take-or-pay clauses, and termination provisions for all
        five June 2024 agreements.
      relatedQuestionRefs:
        - QU002
      relatedTableRefs:
        - TU003
    - type: enumeration-incomplete
      severity: minor
      topic: Named customer proof table TU003 remains a partial public enumeration
      missingEvidence: >-
        Public sources do not support an exhaustive enumeration of Group14's 160+
        customers; named accounts in TU003 represent only the publicly verifiable subset.
      whyItMatters: >-
        The table is analytically useful but completeness cannot be demonstrated from the
        public record alone; the true production-stage vs. sampling-stage split is unknown.
      diligencePath: >-
        Request an internally maintained customer list with stage classification and
        revenue contribution to complete the named-customer proof table.
      relatedTableRefs:
        - TU003
      relatedQuestionRefs: []
