  - id: SU003
    title: "Retention, expansion, and concentration risk"
    body: >-
      No public net revenue retention (NRR) or gross revenue retention (GRR) figures
      exist for Group14. As a materials supplier to battery cell manufacturers,
      churn risk differs structurally from SaaS: switching from silicon-carbon to
      graphite requires cell re-qualification (cycle testing, safety certification,
      potentially months of delay), creating a meaningful barrier to customer exit.
      Long-term agreements — CustomCells through 2030+ and the five June 2024 offtake
      agreements — provide contracted revenue visibility, although production-side delays
      could trigger renegotiation clauses. Concentration risk is material: a single
      disclosed deal (CustomCells) accounts for a reported $300 M+ of contracted revenue,
      potentially representing a disproportionate share of near-term revenue given
      Group14's total funding of $463 M+ through Series D. Investor-customers (ATL,
      Porsche/Cellforce, SK Inc.) have structural incentives to remain qualified adopters
      but the equity alignment is not a binding commitment to purchase volumes beyond
      contracted agreements. The company's 95% Li-ion TAM coverage claim, if accurate,
      reduces ecosystem concentration risk but does not eliminate single-customer
      dependency risk at the revenue level. Expansion evidence exists: StoreDot and
      BASF deepened technical integration in 2021 and 2025 respectively, suggesting a
      trend of partners upgrading to deeper commercial relationships over time. No
      customer has publicly announced cancellation or reduction of a Group14 order as of
      May 2026.
    claimRefs:
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU030
      - CU034
      - CU036
    tableRefs:
      - TU004
      - TU005
    figureRefs: []

  - id: SU004
    title: "Demand signals: product launches, roadmaps, and pipeline"
    body: >-
      The strongest near-term demand signals come from production-confirmed products
      already in the market. Molicel's P50B and P60B cells are commercial SKUs shipping
      to drone, power-tool, and eVTOL integrators. Archer Aviation's production Midnight
      eVTOL uses those cells and its August 2025 88 km flight test demonstrates
      real-world silicon-anode performance under certification-level conditions. ATL's
      smartphone deployment — from 2 M to 20 M+ devices across Vivo handsets — provides
      a consumer electronics pull signal at meaningful commercial volume. BASF's May 2025
      Licity 2698 X F binder partnership delivers a drop-in silicon anode solution that
      simplifies OEM qualification and expands Group14's addressable customer set among
      graphite-focused cell manufacturers. Sionic Energy's 2025 demos at 400 Wh/kg
      using SCC55 on its Rapid Integration Silicon Platform represent a proof-point for
      broad EV applications where energy density commands premium pricing, with EV
      customer validation targeting 2026. StoreDot's 0-80% charge-in-10-minutes XFC
      roadmap validated with Group14 creates demand pull from fleet-charging network
      operators and premium EV OEMs. One ton of SCC55 replaces approximately five tons
      of graphite, a volume efficiency advantage that strengthens the value proposition
      for battery manufacturers seeking to reduce graphite dependency. The June 2024
      offtake basket ($300 M+, 5 agreements) demonstrates binding forward demand
      validated through commercial diligence, though volume and ramp schedules remain
      undisclosed.
    claimRefs:
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU038
    tableRefs:
      - TU006
    figureRefs:
      - FU003

  - id: SU005
    title: "Adverse evidence: delays, workforce reductions, and production risks"
    body: >-
      Several adverse developments require scrutiny. Moses Lake BAM-2 (targeted
      8,000 metric tons per year of SCC55 capacity) was originally expected in late 2024,
      slipped to Q2 2025, and as of the May 2026 report date has not produced
      commercially. The Columbia Basin Herald and Hagadone News Network corroborated the
      delay and a July 2025 workforce reduction at the facility; Group14 characterised
      the layoffs as a commissioning-related restructuring rather than a demand shortfall,
      but no public financial disclosure has verified that interpretation. TheElec
      (Korea) published a 2023 report describing production difficulties at the
      SK/Group14 BAM-3 facility, citing yield and process challenges in the early
      production ramp; Group14 subsequently acquired 100% ownership of BAM-3 as part
      of its August 2025 Series D, which could indicate either a strategic consolidation
      or a rescue of a troubled joint venture. Together, these signals point to execution
      risk at the manufacturing layer that could constrain customer supply fulfilment,
      even if underlying demand is genuine. No customer has publicly announced
      cancellation or reduction of a Group14 order, but the absence of disclosed churn
      data limits independent visibility into any deterioration.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
    tableRefs: []
    figureRefs: []

callouts:
  - calloutType: strength
    title: Production eVTOL deployment is the sharpest single proof-point
    body: >-
      Group14's clearest customer proof is Molicel's P50B/P60B commercial cells
      powered by SCC55 and deployed in Archer Aviation's production Midnight eVTOL —
      a live, revenue-relevant product in a safety-certified aerospace application that
      demonstrates real-world silicon-anode performance beyond lab or pilot conditions.
    claimRefs:
      - CU006
      - CU007
      - CU025

  - calloutType: risk
    title: BAM-2 delay creates supply-fulfilment risk for contracted customers
    body: >-
      Moses Lake BAM-2 remains offline as of the report date. If the facility continues
      to slip, Group14's ability to fulfil the five June 2024 offtake agreements and
      meet the 160+ customer base's growing volume needs could be materially constrained,
      creating counterparty risk even where demand is genuine.
    claimRefs:
      - CU026
      - CU027

  - calloutType: insight
    title: Retention and concentration data are the chapter's main blind spots
    body: >-
      No NRR, GRR, or churn data have been disclosed. All five offtake counterparties
      are under NDA. Investors should request a customer concentration schedule,
      waterfall of contracted vs. sampling revenue, and standard retention metrics
      before closing.
    claimRefs:
      - CU016
      - CU018
      - CU034

