chapter:
  number: 6
  title: Customers
  summary: >-
    Group14 Technologies serves 160+ customers across electric vehicles, consumer
    electronics, eVTOL aviation, smartphones, and emerging grid-storage applications.
    The sharpest proof-points are Molicel's P50B/P60B commercial cells incorporating
    SCC55 (deployed in Archer Aviation's production Midnight eVTOL), ATL's integration
    of SCC55 in 20 M+ smartphones by early 2026, and a $300 M+ multi-year supply
    agreement with CustomCells Germany through 2030+. Five binding offtake agreements
    totalling $300 M+ were signed in June 2024, with three EV and two CE manufacturers
    across Europe, Asia, and North America — all counterparties remain confidential
    under NDA. Adverse evidence includes ongoing BAM-2 Moses Lake delays, a July 2025
    workforce reduction, and a 2023 TheElec report on SK/Group14 production
    difficulties. No public NRR, GRR, or churn data exist; all five offtake
    counterparties are under NDA; named OEM-level EV customers remain undisclosed.

sections:
  - id: SU001
    title: "Customer base: scale, segments, and geographic spread"
    body: >-
      Group14 reports 160+ active customers as of March 2026, up from 100+ at the BAM-3
      South Korea factory launch in September 2024 and 150+ at the August 2025 Series D
      close. Customers span five end-markets: EV battery cell manufacturers, consumer
      electronics cell manufacturers, eVTOL and aerospace battery integrators,
      smartphone OEM supply chains, and pilot or R&D accounts in data centres and grid
      storage. Geographic spread covers North America (Woodinville WA headquarters;
      Moses Lake WA BAM-2), Europe (CustomCells Germany; StoreDot; InoBat), and Asia
      (BAM-3 Sangju South Korea; ATL/TDK China-based JV; SK Inc.). The company states
      that entities representing approximately 95% of global lithium-ion battery
      production capacity sit within its customer roster — a claim anchored by the
      presence of investors ATL, SK Inc., Resonac, and BASF, each of whom is also a
      paying or qualified-prospective customer. The 60-customer increase from August 2025
      to March 2026 (150 to 160+) coincides with the Sangju BAM-3 EV-scale production
      ramp and suggests pull-through demand as supply became reliably available at scale.
      R&D sampling accounts are not publicly distinguished from production-grade accounts
      in the 160+ figure, which limits precision in interpreting the number.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU031
      - CU032
      - CU035
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001

  - id: SU002
    title: "Named customers and binding offtake agreements"
    body: >-
      Named and independently verifiable customer proof-points cluster in four
      categories. First, Molicel Canada qualified SCC55 into its P50B and P60B
      cylindrical cells, which are commercially shipping to drone, power-tool, and eVTOL
      integrators; Archer Aviation's production Midnight eVTOL uses Molicel cells and
      completed an 88 km flight in August 2025, confirming real-product deployment in an
      aviation-grade application. Second, CustomCells Germany signed a $300 M+
      multi-year supply agreement in July 2024 covering 4695-format cylindrical cells
      through 2030+, making it one of the largest publicly disclosed single-customer
      silicon-anode contracts in the industry. Third, ATL (TDK joint venture and Series D
      investor) integrated SCC55 into consumer smartphones — the Vivo X200 Pro is a
      publicly verified device — with shipment volume estimated at roughly 2 M devices by
      late 2024 and 20 M+ by early 2026. Fourth, five anonymised offtake agreements
      covering 3 EV and 2 CE manufacturers across Europe, Asia, and North America were
      signed in June 2024, totalling $300 M+ in committed volume over multiple years;
      all counterparties remain confidential under NDA. Additional qualified customers
      include Porsche's Cellforce joint venture (Series D investor and prospective
      high-performance EV customer), StoreDot (2021 XFC partnership, 300 Wh/kg roadmap),
      Sionic Energy (silicon-carbon anode co-development, 400 Wh/kg demos in 2025),
      and InoBat (European prismatic cell integration). No EV OEM has been publicly named
      as a direct Group14 customer; all OEM-side exposure runs through Tier-1 and Tier-2
      cell manufacturers.
    claimRefs:
      - CU006
      - CU007
