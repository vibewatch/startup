  topStrengths:
    - 'Commercial proof now exists: SCC55 has powered 25M+ devices and Group14 disclosed 160+ customers by early 2026.'
    - >-
      Strategic investors and partners including SK, Porsche, ATL, Microsoft, OMERS, and Decarbonization Partners
      provide capital depth and ecosystem credibility.
    - >-
      BAM-3 in South Korea reached full EV-scale commercial production in March 2026, reducing pure technology risk
      versus earlier lab-stage peers.
    - Group14 holds 170+ issued patents protecting both SCC55 composition and manufacturing process know-how.
  topRisks:
    - >-
      BAM-2 Moses Lake is more than a year behind earlier expectations and remained incomplete after January 2026
      furloughs.
    - >-
      Public financial disclosure is thin: no audited statements, gross margin, burn, cash balance, or
      customer-concentration metrics are available.
    - >-
      Silane feedstock remains a critical dependency, while the larger DOE-backed silane project is still subject to
      federal negotiation and policy risk.
    - >-
      EV-market, tariff, and U.S. tax-credit changes could slow silicon-anode adoption just as Group14 is funding
      domestic scale-up.
    - >-
      Many large customer agreements remain confidential, limiting visibility into pricing power, retention, and true
      concentration.
  unresolvedGaps:
    - Exact Series D post-money valuation was not disclosed; the ~$5.27B figure is a secondary-market estimate.
    - No audited revenue, gross margin, EBITDA, cash, or burn-rate figures are publicly available.
    - BAM-2 commissioning date, yield ramp, and contract-backed utilization remain uncertain.
    - Customer retention, renewal cohorts, and OEM-level concentration are not publicly disclosed.
    - Final disposition of the DOE-backed $200M silane award and long-term silane supply security remains unresolved.
