  - id: manufacturing-economics-capex
    title: Manufacturing Economics & Capital Intensity
    body: >
      Group14's business model is fundamentally capital-intensive: each 2,000-ton-per-year BAM module requires
      an estimated $100+ million in plant investment based on BAM-2's disclosed financials ($100M DOE + $223M
      Group14 = $323M+ for a two-module design). This implies roughly $160 million per 2,000-ton module at
      full private cost. The Sangju (BAM-3) acquisition adds balance-sheet manufacturing assets previously
      carried as a joint-venture investment. The Germany silane plant (Spreetal, up to ~1,000 tons/year of
      silane) is being funded separately and is expected online before a larger Moses Lake silane facility.

      Operating cost structure is not disclosed, but silicon-carbon anode manufacturing is energy- and
      process-intensive: primary inputs are silane gas (converted to silicon via chemical vapor deposition),
      carbon scaffold, and energy. Group14's co-location strategy (silicon material plant adjacent to silane
      supply in Moses Lake) aims to reduce input logistics costs once both facilities are running. The company
      relies on hydroelectric power from the Columbia Basin for relatively low-cost, clean electricity—a
      structural cost advantage that is now under pressure from data-center competition for available power.

      The manufacturing capex cycle is long: BAM-2 broke ground in April 2023, is approximately 90% complete
      as of early 2026, and has already absorbed several hundred million dollars in construction spending.
      BAM-2's delayed start (from Q4 2024 to 2026) has increased holding costs and reduced the near-term
      revenue contribution that was underwritten in the Series C and early Series D theses.
    claimRefs:
      - CI021
