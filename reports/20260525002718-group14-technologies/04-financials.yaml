  - id: capital-adequacy-runway
    title: Capital Adequacy & Runway
    body: >
      With $463 million closed in August 2025, Group14 has material near-term liquidity. The primary uses of
      Series D proceeds are: (1) completing and commissioning BAM-2 in Moses Lake; (2) covering the BAM-3
      full-acquisition payment to SK; (3) ramping production at both facilities; and (4) funding ongoing
      operating expenses for a ~400-person organization. Monthly burn rate is not disclosed. The company has
      indicated the $100M DOE BAM-2 grant is largely spent as of mid-2025; incremental BAM-2 costs (residual
      construction, commissioning, first-production working capital) will draw on Series D equity.

      The potential $200M DOE silane grant, if finalized, would offset capex for the Moses Lake silane plant
      and reduce the equity call for that project. If the grant is rescinded or delayed, Group14 would need to
      fund the silane facility from its own balance sheet or raise additional capital. Given the capex intensity
      of the platform and the pre-profitability operating model, Group14's financial position is likely to
      require a Series E or project-financing facility before reaching cash-flow breakeven—the timeline for
      which depends on BAM-2 production ramp speed, realized ton pricing, and demand pull from the EV and
      data-center storage markets.
    claimRefs:
      - CI035
      - CI036
      - CI037
      - CI038
    tableRefs:
      - TI004

  - id: financial-gaps-verdict
    title: Financial Gaps, Risks & Verdict
    body: >
      Group14 is a deep-capex, pre-profitability advanced-materials manufacturer with one of the strongest
      IP and customer-breadth profiles in its category. The financial story is driven by capital deployment
      and production ramp rather than operating cash flows: $1.1B+ raised, two U.S. factories, one Korea
      factory (now wholly owned), and a Germany silane operation in progress represent a substantial asset base
      under construction. Revenue of ~$39M against that capital base yields a revenue/capital ratio below 4%,
      typical of hardware-scale manufacturing at this stage but a critical underwriting risk.

      Adverse signals include: three production-start delays at BAM-2 (Q4 2024 → Q2 2025 → 2026); two U.S.
      workforce reductions in 2025-2026; power-grid competition from data centers constraining Washington
      State capacity additions; the potential rescission of the $200M DOE silane grant; and a demand shortfall
      from China due to tariffs. The shift of manufacturing focus to South Korea partially hedges the tariff
      risk but concentrates geopolitical exposure in a different jurisdiction.

      The primary financial diligence blockers are: (a) no public gross margin or unit cost data; (b) burn
      rate and runway unquantifiable from public sources; (c) contract pricing and take-or-pay terms undisclosed;
      (d) BAM-2 commissioning cost overruns unknown; (e) silane grant status unresolved. These gaps are material
      to any valuation underwrite above the $1B Series C floor.
    claimRefs:
      - CI039
      - CI040
      - CI041
      - CI042
      - CI043
    tableRefs:
      - TI005

