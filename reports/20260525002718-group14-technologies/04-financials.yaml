company:
  name: Group14 Technologies
chapter:
  number: 4
  title: Financials
  summary: >
    Group14 Technologies has raised over $1.1 billion in equity across four rounds plus $100 million in DOE grants,
    funding a capital-intensive global silicon-carbon anode material manufacturing platform. Revenue is estimated at
    approximately $39 million annually—modest relative to capital deployed—while the company remains pre-profitability
    with significant capex obligations as BAM-2 (Moses Lake) ramps in 2026 and the BAM-3 Korea acquisition absorbs
    Series D proceeds. Gross margins, burn rate, and detailed unit economics are not publicly disclosed, constituting
    the primary diligence gap for underwriting.

sections:
  - id: revenue-model-monetization
    title: Revenue Model & Monetization
    body: >
      Group14's core revenue is generated through direct B2B sales of SCC55®, its proprietary silicon-carbon composite
      anode material, to battery cell manufacturers and automotive OEMs. All pricing is custom-negotiated under
      multi-year supply agreements; no public price list exists. The company announced five binding multi-year offtake
      agreements in 2024 representing more than $300 million in minimum contract value, spanning EV, consumer electronics,
      eVTOL, and grid storage end-markets across Europe, Asia, and North America. As of March 2026, Group14 supplies
      160+ customers whose collective output represents 95% of global lithium-ion battery production.

      Revenue quality is pre-scale: most customer engagements are still in qualification or early commercial stage.
      BAM-3 (South Korea, 10 GWh capacity) began commercial deliveries in September 2024 and is the primary revenue-
      generating facility as of the run date. BAM-1 in Woodinville, WA (~120 tons/year) contributes a smaller volume
      base. BAM-2 in Moses Lake is not yet in production. Total estimated annual revenue for 2025–2026 is approximately
      $39 million per industry trackers—unverified by the company—implying revenue per employee of roughly $112,000
      and a very early-stage monetization profile relative to $1.1B+ raised. A secondary licensing revenue path is
      mentioned in investor materials but no confirmed licensing revenue has been publicly disclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
