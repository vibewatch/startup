  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: Audited gross margin by factory, product grade, and period
      whyItMatters: Without gross margin data, it is impossible to underwrite a profitability path or assess whether the SCC55® material business can sustain the capital intensity of the manufacturing platform
      diligencePath: Request management accounts, investor-deck financials, or data-room access for FY2023–FY2025; confirm revenue recognition policy for take-or-pay contracts
      relatedQuestionRefs: [QI004]

    - type: private-evidence-only
      severity: blocking
      topic: burn rate and cash position
      missingEvidence: Monthly cash burn, total cash on hand post-Series D, and BAM-3 acquisition price
      whyItMatters: Without burn and cash data, runway calculations are speculative; the BAM-3 acquisition price is an unknown absorber of Series D proceeds that materially affects remaining liquidity
      diligencePath: Request monthly P&L and cash-flow statements; confirm BAM-3 purchase price paid to SK Inc. as part of the Series D transaction
      relatedQuestionRefs: [QI006, QI025]

    - type: private-evidence-only
      severity: material
      topic: offtake contract terms
      missingEvidence: Annual minimum volumes, take-or-pay provisions, pricing escalators, and cancellation clauses in the five disclosed offtake agreements
      whyItMatters: The $300M headline contract value is a minimum commitment, but the annual draw schedule, pricing per ton, and off-ramps are unknown, making forward revenue underwriting imprecise
      diligencePath: Request redacted contract summaries; at minimum obtain total annual minimums, pricing escalation clauses, and material adverse change or cancellation provisions
      relatedQuestionRefs: [QI019]

    - type: stale
      severity: material
      topic: cost per ton production economics
      missingEvidence: Fully-loaded cost per metric ton of SCC55® at BAM-3 commercial ramp, broken down by silane, energy, labor, and D&A
      whyItMatters: Without cost-per-ton data, gross margin per unit cannot be verified and the unit economics bridge remains unanchored; silane input cost in particular is volatile given REC Silicon's closure
      diligencePath: Request cost model for BAM-3 at current utilization; obtain silane contract terms with current supplier (post-REC Silicon); benchmark against comparable silicon-carbon producers
      relatedQuestionRefs: [QI021]

    - type: missing-source
      severity: material
      topic: customer cancellations or volume reductions
      missingEvidence: Any evidence of contract renegotiations, volume reductions, or cancellations driven by tariff disruption or EV demand slowdown as of 2026
      whyItMatters: Tariffs have reduced Chinese demand per management statements; whether this has translated into formal contract modifications or deferrals is unknown and affects the $300M+ offtake coverage ratio
      diligencePath: Obtain status update on all five disclosed offtake agreements; confirm whether any volume has been deferred, reduced, or rerouted to the South Korea factory to avoid U.S. tariffs
      relatedQuestionRefs: [QI017]

    - type: private-evidence-only
      severity: material
      topic: DOE silane grant finalization and contingency
      missingEvidence: Formal confirmation of $200M DOE grant finalization or written notification of rescission/delay under current administration policy
      whyItMatters: If rescinded, the silane plant requires full equity funding (~$200M+), materially altering the forward capex demand and Series E timeline
      diligencePath: Obtain written DOE program officer update; review Bipartisan Infrastructure Law appropriations language for rescission risk; assess whether Group14 can fund the silane facility from operations if DOE funding is unavailable
      relatedQuestionRefs: [QI011, QI023, QI006]

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      TI001 (Revenue Streams), TI002 (Pricing), TI003 (Unit Economics), TI004 (Capital Adequacy), TI005 (Public Gaps),
      and TI006 (Funding Rounds) all include substantive notes explaining data-source conventions, estimation basis,
      partial coverage, and what null or undisclosed values mean. Each notes field is populated with specific caveats.
