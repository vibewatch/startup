  - id: TI005
    title: Public Financial Gaps
    columns:
      - Missing Metric
      - Impact on Analysis
      - Diligence Path
    rows:
      - - Audited revenue and gross margin by period and factory
        - Cannot verify monetization progress, margin trajectory, or path to profitability
        - Request management accounts or investor-deck financials for 2023–2025; confirm revenue recognition policy for take-or-pay contracts
      - - Monthly burn rate and cash balance
        - Cannot model runway or next-round timing with confidence
        - Request monthly P&L and cash-flow statement; confirm actual BAM-3 acquisition price
      - - COGS breakdown by major input (silane, energy, labor, D&A)
        - Cannot assess unit economics or margin leverage as volume scales
        - Request per-ton cost model; confirm silane spot prices and contracted supply terms with REC Silicon successor or alternative provider
      - - BAM-2 total completion cost and residual capex
        - Material to Series D allocation and future capital needs; construction delays may have inflated costs
        - Request construction contract values, change-order history, and commissioning budget; confirm insurance and warranty coverage
      - - Offtake contract pricing and annual minimum volumes
        - Critical for revenue underwriting; cannot assess take-or-pay coverage ratio without terms
        - Request redacted contract summaries; at minimum obtain total annual minimums, pricing escalation clauses, and cancellation provisions
      - - DOE $200M silane grant finalization status and policy risk
        - If rescinded, silane plant business case requires full equity funding (~$200M+ additional capex)
        - Obtain written update from DOE program officer; review whether Bipartisan Infrastructure Law rescission language applies
    notes: >
      Group14 does not publish audited financials. All six gaps above are material to an investment decision
      and represent standard private-company data-room disclosures. Each diligence path assumes the company
