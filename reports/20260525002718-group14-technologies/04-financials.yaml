  - id: capital-structure-funding
    title: Capital Structure & Funding Rounds
    body: >
      Group14 has assembled more than $1.1 billion in equity through four venture rounds and supplemented operations
      with $100 million in non-dilutive federal grants. The Series D (August 2025), the largest round at $463 million
      and led by SK Inc., was simultaneously used to acquire the remaining 75% stake in BAM-3 from SK, converting a
      joint-venture asset into wholly-owned manufacturing. Prior rounds include a $614 million Series C in 2022 (led
      by Porsche AG, with Microsoft, OMERS, Decarbonization Partners, Lightrock, and others), a $34.3 million PE
      tranche from ShawKwei & Partners in 2023, and an early Series B (~$17M) led by SK Materials in 2020.

      The U.S. Department of Energy provided a $100 million Bipartisan Infrastructure Law grant in October 2022
      toward the BAM-2 construction in Moses Lake; that grant is substantially spent as of mid-2025. In September 2024
      the DOE selected Group14 for an additional up-to-$200 million award negotiation to build a 7,200 metric-ton-per-
      year silane gas plant in Moses Lake—a critical raw-material precursor. This second grant remains under negotiation
      and faces policy uncertainty under the current administration, representing a material contingent liability for the
      silane plant business case.

      The company has not disclosed post-money valuation officially; a source familiar with the matter told Reuters that
      Series D valuation exceeded the 2022 Series C valuation of "more than $1 billion." Secondary-market data aggregators
      suggest a Series D post-money range of $5.1–5.3 billion, though these figures are unverified estimates.
    claimRefs:
