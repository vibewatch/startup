callouts:
  - calloutType: risk
    title: Revenue Lag vs. Capital Deployed
    body: >
      Group14 has deployed more than $1.1 billion in equity plus $100 million in government grants, yet
      estimated annual revenue is approximately $39 million—a revenue/capital ratio of roughly 3–4%.
      Even assuming BAM-2 reaches commercial production in 2026 and BAM-3 runs at full 2,000-ton capacity,
      consolidated revenue at full utilization (estimated $200–$400M/year) still implies a 4–10-year
      equity payback before breakeven at undisclosed margins. This is not unusual for deep-capex advanced
      materials manufacturers, but it is a significant underwriting risk for late-stage venture investors.
    claimRefs:
      - CI003
      - CI007
      - CI010
      - CI038

  - calloutType: risk
    title: BAM-2 Delays & Policy Headwinds Compound Capital Risk
    body: >
      BAM-2's production start has been delayed at least three times (Q4 2024 → Q2 2025 → 2026). Each delay
      extends the period over which construction cost is carried without generating revenue offset. Simultaneously,
      the potential rescission of the $200M DOE silane grant—a consequence of Trump administration clean-energy
      policy reversals—could force Group14 to fund the silane plant entirely from equity, consuming a material
      portion of Series D proceeds and accelerating the timeline for a Series E raise. These compounding risks
      make the capital adequacy picture more fragile than the headline $463M Series D implies.
    claimRefs:
      - CI023
      - CI026
      - CI027
      - CI037
      - CI039

  - calloutType: insight
    title: BAM-3 Acquisition Converts Contingent Asset to Owned Manufacturing
    body: >
      The Series D simultaneously raised capital and converted BAM-3 from a joint-venture equity interest into
      a wholly-owned balance-sheet asset. This has two financial effects: (1) it removes the JV profit-sharing
      drag on Korean manufacturing economics, and (2) it gives Group14 direct control over its primary revenue-
      generating factory—a structurally more favorable position for customer contracting and future project-
      finance conversations. The financial terms of the SK stake buyout are not disclosed.
    claimRefs:
      - CI011
      - CI018
      - CI019
      - CI020

