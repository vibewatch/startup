evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >
      Group14 has not disclosed annual revenue, EBITDA, or gross margin. All financial performance must be inferred from
      funding milestones and customer counts. Gap persists as of May 2026.
    whyItMatters: >
      Without revenue data, it is impossible to assess unit economics, pricing power, or the commercial return on more
      than $1 billion in invested capital. Investor valuation models cannot be grounded in actual financial performance.
    diligencePath: >
      Request commercial dataroom disclosure including annual revenue by geography and customer tier, SCC55 average
      selling price per kilogram, and gross margin by product application.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >
      No audited or disclosed valuation figure exists. Press characterizations of unicorn-class are not sourced to a
      formal data point. Post-Series D implied valuation is unknown.
    whyItMatters: >
      Without a disclosed valuation, it is impossible to assess whether the $1B+ in equity raised implies a reasonable
      return path for investors or whether dilution risk is material.
    diligencePath: >
      Request Series D term sheet or cap table disclosure showing pre-money valuation, share price, and liquidation
      preferences per investor class.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: manufacturing
    missingEvidence: >
      Group14 has not announced a firm commissioning date for BAM-2 Moses Lake as of May 2026. At least four prior
      timeline targets have been missed. Gap is active and unresolved.
    whyItMatters: >
      BAM-2 is Group14 primary US capacity asset; continued delay limits US supply commitments, creates customer
      delivery risk, and may give competitors time to establish alternative supply.
    diligencePath: >
      Request written construction schedule with milestone dates, third-party project management certification, and
      utility interconnection agreements from Moses Lake facility.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: minor
    topic: adverse-events
    missingEvidence: >
      Group14 has not disclosed the precise headcount following July 2025 US layoffs. Third-party estimates of 260-270
      are unverified by the company. BAM-3 Korea headcount is also undisclosed.
    whyItMatters: >
      Accurate headcount supports assessment of organizational capacity to commission BAM-2 and support 160+ customers
      while managing a multi-continent manufacturing footprint.
    diligencePath: >
      Request current organizational chart, headcount by location and function, and BAM-3 Korea workforce size from
      Group14 management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: manufacturing
    missingEvidence: >
      No public update on construction or disbursement status of the up-to-$200M DOE silane factory award as of May
      2026. The conditional nature of the award means actual disbursement is unconfirmed.
    whyItMatters: >
      The silane factory is a critical upstream feedstock investment; delays or non-disbursement would increase Group14
      dependency on the Germany Schmid Silicon plant and extend domestic supply chain vulnerability.
    diligencePath: >
      Review DOE Office of Manufacturing and Energy Supply Chains project status page; request project schedule and
      disbursement milestones from Group14.
    relatedQuestionRefs:
      - QO012
  - type: enumeration-incomplete
    severity: minor
    topic: commercial-traction
    missingEvidence: >
      Group14 claim that customers represent 95% of worldwide lithium-ion battery production volume is a company
      assertion not independently verified by any third-party analyst or auditor. The methodology for calculating this
      percentage is undisclosed.
    whyItMatters: >
      The 95% claim anchors Group14 market positioning narrative; if the methodology is flawed or the denominator is
      narrowly defined, the competitive moat implied by this figure could be overstated.
    diligencePath: >
      Request from Group14 the methodology, denominator definition, and date basis for the 95% worldwide Li-ion
      production volume claim. Cross-reference against BNEF or BloombergNEF cell manufacturer market share data.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >
      Group14 has not publicly described any strategy for managing revenue concentration risk from Chinese battery
      customers given US-China tariff escalation and EV policy uncertainty. No press release, investor letter, or
      management commentary addresses this directly.
    whyItMatters: >
      If 70-80% of global Li-ion production capacity sits in China, Group14 revenue exposure to Chinese customers could
      be material; a tariff-driven demand pullback could impair BAM-3 utilization and Series D return assumptions.
    diligencePath: >
      Review any investor communications or management presentations for geographic revenue breakdown; request customer
      concentration data by country from Group14 management.
    relatedQuestionRefs:
      - QO028
      - QO021
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >
      Group14's actual contracted revenue pipeline, average selling price per kilogram of SCC55, and customer
      concentration breakdown are not publicly disclosed, making bottom-up SOM sizing dependent on management-provided
      capacity figures and estimated ASPs.
    whyItMatters: >
      Without ASP and revenue pipeline data, SOM estimates carry a wide error band; investor valuation models built on
      addressable market size cannot be verified against actual commercial terms.
    diligencePath: >
      Request commercial dataroom disclosure including SCC55 ASP by customer tier, contracted volume for 2025–2027, and
      customer concentration by revenue contribution.
    relatedQuestionRefs:
      - QM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >
      Analyst estimates for the silicon anode market in 2025 differ by 3–4× across reputable publishers (e.g., Fortune
      Business Insights at $345.7M vs. Custom Market Insights at $1.2B), and the methodological basis for each estimate
      is not publicly disclosed.
    whyItMatters: >
      The wide spread makes it impossible to triangulate a single reliable base market size; both the growth narrative
      and the competitive positioning claims depend on which estimate is used as the reference point.
    diligencePath: >
      Request from analysts or industry associations (e.g., BATTERY2030+, BNEF) a definition- harmonized estimate that
      uses identical boundary conditions (material-only vs. cell-level) and published primary data sources.
    relatedQuestionRefs:
      - QM015
  - type: private-evidence-only
    severity: minor
    topic: competitive-landscape
    missingEvidence: >
      Sila Nanotechnologies' production capacity, ASP, and customer qualification pipeline details are not publicly
      disclosed, limiting a rigorous head-to-head capacity and revenue comparison with Group14.
    whyItMatters: >
      Without Sila's capacity data, it is unclear whether Group14's 2,000 mt/yr BAM-3 is ahead of, at parity with, or
      behind Sila's manufacturing scale; this affects the competitive positioning narrative.
    diligencePath: >
      Monitor Sila's press releases, investor briefings, and procurement announcements; request a Sila commercial
      reference from a shared customer.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: Group14 automotive OEM production contract
    missingEvidence: |
      No public disclosure identifies a named automotive OEM that has moved from testing SCC55 to a
      binding production supply agreement. Porsche is an investor, not a disclosed production customer.
      Group14 announced agreements with five cell manufacturers in 2024, but no OEM name was disclosed.
    whyItMatters: |
      A named automotive OEM production win would be the most significant commercial de-risking event
      for Group14 and would directly validate SCC55's automotive-grade qualification. Its absence in
      public disclosures is a key diligence gap versus Sila's confirmed Mercedes-Benz and Panasonic wins.
    diligencePath: |
      Request Group14 dataroom disclosure of existing supply agreements, including customer names,
      volume commitments, ASPs, and production start dates. Ask management directly: which of the
      five disclosed cell-maker agreement partners has achieved production-grade qualification?
    relatedQuestionRefs:
      - QP013
  - type: missing-source
    severity: material
    topic: Nexeon delivery timeline for Korea and North America
    missingEvidence: |
      Nexeon broke ground in Korea in April 2024 targeting 2025–2026 delivery, but no confirmed
      production start date or volume delivery milestone for the Panasonic Energy North America
      supply agreement has been publicly disclosed as of the research date.
    whyItMatters: |
      If Nexeon delivers material to Panasonic Energy North America before Group14 converts any
      West-Coast cell maker to production, it would establish another Western silicon anode supplier
      in the automotive supply chain, intensifying competition for Panasonic's next EV cell generations.
    diligencePath: |
      Monitor Panasonic Energy North America press releases and Nexeon investor communications.
      Request Nexeon delivery confirmation and production start data from industry contacts.
    relatedQuestionRefs:
      - QP011
  - type: private-evidence-only
    severity: material
    topic: Competitor silicon anode pricing not publicly disclosed
    missingEvidence: |
      Sila, Nexeon, and Shin-Etsu have not publicly disclosed their silicon anode material pricing.
      Group14's $10–11/kg estimate is an industry estimate; actual negotiated pricing between all
      suppliers and their cell maker customers is proprietary.
    whyItMatters: |
      Without actual pricing data, the competitive cost-structure analysis relies on estimates that
      may differ materially from negotiated reality. Price undercutting by BTR or a funded Western
      peer could accelerate customer switching faster than the 2028 graphite-parity projection.
    diligencePath: |
      Request Group14 ASP data and customer pricing ranges in the dataroom. Cross-check with
      cell-maker procurement contacts and industry consultant benchmarks.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: Multi-homing behavior after automotive production commitment
    missingEvidence: |
      While it is known that cell makers multi-home in testing phases, no public evidence confirms
      how often EV production programs maintain dual silicon anode suppliers versus committing to
      a single primary source post-qualification. The degree of multi-homing at commercial scale
      is unconfirmed.
    whyItMatters: |
