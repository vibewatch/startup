      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural graphite supply-chain risk creates durable tailwind
            body: >
              China controls 75–95% of global natural graphite processing and battery-grade graphite supply. US IRA FEOC
              provisions—even with the 2027 delayed implementation—signal that US and EU OEMs face a long-term strategic
              obligation to qualify non-Chinese anode alternatives. Group14's US-headquartered, Korea-manufactured, and
              DOE-subsidized production position directly addresses this motivation, providing a durable competitive
              moat beyond pure product performance.
            calloutType: strength
            claimRefs:
              - CM025
              - CM031
          - type: callout
            title: LFP chemistry shift narrows near-term EV SAM
            body: >
              LFP battery chemistry exceeded 50% of EV pack shipments in 2025 and is growing fastest in the
              price-sensitive mass-market EV segment. LFP cells typically contain no silicon in the anode; the silicon
              density benefit applies primarily to high-nickel NMC configurations. If EV OEM platforms continue to shift
              toward LFP—driven by cost pressure and Chinese supplier advantages— Group14's addressable market within
              EVs is structurally narrowed to premium OEM tiers and markets where energy density outweighs cost.
            calloutType: risk
            claimRefs:
              - CM033
              - CM034
          - type: callout
            title: Contradictory market sizing estimates preserved—readers should use ranges
            body: >
              Silicon anode market sizing estimates span 3–4× depending on whether analysts count finished battery cell
              revenue, anode material input costs only, or the full silicon anode composite market. Fortune Business
              Insights puts the 2025 silicon anode battery market at $345.7 million; Custom Market Insights estimates
              $1.2 billion for the same period. Neither figure is objectively wrong—they use different boundary
              conditions. Investors and strategists should use low/base/high ranges rather than single-point estimates,
              and triangulate against Group14's disclosed manufacturing capacity as a bottom-up supply-side check on
              near-term SOM.
            calloutType: insight
