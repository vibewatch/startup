            body: >
              China dominates global silane production—the same supply-chain risk Group14 highlights for graphite
              applies to its own key manufacturing input. Group14's acquisition of the Spreetal silane plant (Germany)
              and the negotiated $200M DOE award for a Moses Lake silane plant directly address this concentration risk.
