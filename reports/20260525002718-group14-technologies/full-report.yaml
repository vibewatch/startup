            title: BAM-3 Acquisition Converts Contingent Asset to Owned Manufacturing
            body: >
              The Series D simultaneously raised capital and converted BAM-3 from a joint-venture equity interest into a
              wholly-owned balance-sheet asset. This has two financial effects: (1) it removes the JV profit-sharing
              drag on Korean manufacturing economics, and (2) it gives Group14 direct control over its primary revenue-
              generating factory—a structurally more favorable position for customer contracting and future project-
              finance conversations. The financial terms of the SK stake buyout are not disclosed.
