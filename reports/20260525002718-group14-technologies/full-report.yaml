      - number: '4.6'
        title: Financial Gaps, Risks & Verdict
        blocks:
          - type: paragraph
            body: >
              Group14 is a deep-capex, pre-profitability advanced-materials manufacturer with one of the strongest IP
              and customer-breadth profiles in its category. The financial story is driven by capital deployment and
              production ramp rather than operating cash flows: $1.1B+ raised, two U.S. factories, one Korea factory
              (now wholly owned), and a Germany silane operation in progress represent a substantial asset base under
              construction. Revenue of ~$39M against that capital base yields a revenue/capital ratio below 4%, typical
              of hardware-scale manufacturing at this stage but a critical underwriting risk.

              Adverse signals include: three production-start delays at BAM-2 (Q4 2024 → Q2 2025 → 2026); two U.S.
              workforce reductions in 2025-2026; power-grid competition from data centers constraining Washington State
              capacity additions; the potential rescission of the $200M DOE silane grant; and a demand shortfall from
              China due to tariffs. The shift of manufacturing focus to South Korea partially hedges the tariff risk but
              concentrates geopolitical exposure in a different jurisdiction.

              The primary financial diligence blockers are: (a) no public gross margin or unit cost data; (b) burn rate
              and runway unquantifiable from public sources; (c) contract pricing and take-or-pay terms undisclosed; (d)
              BAM-2 commissioning cost overruns unknown; (e) silane grant status unresolved. These gaps are material to
              any valuation underwrite above the $1B Series C floor.
