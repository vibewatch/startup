  - id: FU001
    title: Group14 customer journey map — sampling to production
    type: journey-map
    layout: wide
    summary: >-
      Illustrates the typical Group14 customer lifecycle from initial SCC55 sampling through R&D qualification, pilot
      production, and full commercial supply, mapped against key milestones for representative named accounts.
    data:
      nodes:
        - id: cj1
          label: Initial sampling
          detail: >-
            Customer requests SCC55 samples; lab benchmarking against graphite on energy density, cycle life, and rate
            capability.
          tone: neutral
        - id: cj2
          label: R&D qualification
          detail: Cell design integration; cycling tests; capacity and safety validation; NDA supply agreement for pilot runs.
          tone: neutral
        - id: cj3
          label: Pilot production
          detail: Small-scale commercial cell runs; safety and reliability testing; customer internal qualification gate.
          tone: positive
        - id: cj4
          label: Commercial contract
          detail: Binding offtake or supply agreement; volume and price committed over multiple years.
          tone: positive
        - id: cj5
          label: Production deployment
          detail: >-
