        title: Exhibits
        blocks:
          - type: callout
            title: Silane Supply Discontinuity Is the Most Acute Near-Term Risk
            body: >
              REC Silicon's January 2025 closure of its only US silane plant left Group14 dependent on REC's smaller
              Montana facility, whose capacity is insufficient for full BAM-2 scale. Group14's own silane plant (DOE
              $200M award in negotiation) is at least 3 years from completion. This creates a critical feedstock
              bottleneck that limits US production scale regardless of construction progress at BAM-2.
            calloutType: risk
