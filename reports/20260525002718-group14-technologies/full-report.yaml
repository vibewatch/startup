      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              Analyst estimates for the silicon anode battery and silicon anode materials markets vary significantly by
              market boundary and methodology. At the broadest level, the global lithium-ion battery market exceeded
              $150 billion in 2025 and grew approximately 29% in demand volume year-over-year, with EV applications
              accounting for over 70% of deployment. The silicon anode materials sub-market (materials only, not
              finished batteries) is estimated at $450–$655 million in 2025 by Business Research Insights and related
              sources, growing to approximately $1.15 billion by 2026 and projected at $20+ billion by 2035 at a CAGR of
              ~42%. A parallel set of estimates, which size the silicon anode battery market (including finished battery
              cells), puts the 2025 figure at $345 million (Fortune Business Insights), rising to $489 million in 2026
              at a 49% CAGR to 2034. The spread across estimates reflects differing inclusion boundaries—some reports
              count entire battery revenue attributable to silicon content, others count only the anode material itself.
              Both lenses confirm high-double-digit to mid-50% CAGR expectations through the early 2030s. Serveable
              Addressable Market for Group14 is the silicon-carbon composite sub-segment (approximately 40% of all
              silicon anode materials in 2025), applied to automotive, consumer electronics, and grid end-markets where
              SCC55's performance profile is qualified. Serviceable Obtainable Market is constrained by current
              manufacturing capacity: Group14's BAM-3 factory in Sangju, South Korea began production in September 2024
              at a stated 2,000 metric-ton annual run-rate, sufficient to supply roughly 10 GWh of battery cells and
              approximately 200,000 EVs—placing the near-term SOM well below $200 million even at full utilization,
              before the Moses Lake BAM-2 expansion brings additional capacity online. Contradictory estimates exist
              between analyst houses and should be read as range bounds; the wide spread (3–4× difference at the low and
              high) reflects genuine uncertainty about silicon adoption penetration rates in EV platforms.
