      - number: '4.5'
        title: Capital Adequacy & Runway
        blocks:
          - type: paragraph
            body: >
              With $463 million closed in August 2025, Group14 has material near-term liquidity. The primary uses of
              Series D proceeds are: (1) completing and commissioning BAM-2 in Moses Lake; (2) covering the BAM-3
              full-acquisition payment to SK; (3) ramping production at both facilities; and (4) funding ongoing
              operating expenses for a ~400-person organization. Monthly burn rate is not disclosed. The company has
              indicated the $100M DOE BAM-2 grant is largely spent as of mid-2025; incremental BAM-2 costs (residual
              construction, commissioning, first-production working capital) will draw on Series D equity.

              The potential $200M DOE silane grant, if finalized, would offset capex for the Moses Lake silane plant and
              reduce the equity call for that project. If the grant is rescinded or delayed, Group14 would need to fund
              the silane facility from its own balance sheet or raise additional capital. Given the capex intensity of
              the platform and the pre-profitability operating model, Group14's financial position is likely to require
              a Series E or project-financing facility before reaching cash-flow breakeven—the timeline for which
              depends on BAM-2 production ramp speed, realized ton pricing, and demand pull from the EV and data-center
              storage markets.
