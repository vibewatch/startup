            title: Federal Policy Has Already Materially Damaged the Execution Timeline
            body: >
              Three separate workforce reductions (July 2025 layoffs, January 2026 furloughs, and a prior workforce
              trim), construction contract restructuring, and a 12+ month production delay are all directly linked to
              the Trump administration's tariff regime and IRA credit rollbacks. The OBBB Act's FEOC rules add new
              compliance risk to the 45X credit Group14's US production economics depend on.
            calloutType: risk
            claimRefs:
              - CR004
              - CR013
              - CR015
              - CR014
          - type: callout
            title: Sila's Production Ramp Is the Critical Technology Competitive Threat
            body: >
              Sila Nanotechnologies commissioned its Moses Lake facility in 2025 and targeted customer production that
              year, running directly concurrent with Group14's BAM-2 delay. Automotive OEM silicon-anode qualification
              slots are available once per battery design cycle; Group14 risks permanent loss of these slots to Sila if
              BAM-2 delays persist into mid-2026.
            calloutType: risk
            claimRefs:
              - CR028
              - CR010
              - CR032
          - type: callout
            title: No Active Litigation or Regulatory Enforcement Actions Identified
            body: >
              As of May 2026, no active lawsuits, SEC enforcement actions, EPA violations, or OSHA citations against
              Group14 Technologies have been identified through public records search. This does not confirm absence —
              private arbitration or regulatory investigations may not be publicly disclosed. Due diligence should
              include direct inquiry to the company, a PACER search, and EPA ECHO facility compliance check.
            calloutType: assumption
