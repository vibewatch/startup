          Continued opacity on revenue and cap-table terms makes precise return underwriting impossible; dilution and
          timing risk are material.
        - Best fit for current public evidence; most likely scenario absent specific BAM-2 news.
      - - Bear
        - >-
          BAM-2 delays extend 12-plus months into late 2026 or 2027; Chinese tariff losses compound; down-round becomes
          necessary to fund operations; AI-data center channel does not scale.
        - >-
          $2B-$3B reflects significant multiple compression; down-round impairs Series C and D investors; BAM-3 alone
          cannot justify the existing capital stack at current scale.
        - Capital intensity, further layoffs, and a constrained U.S. market could accelerate cash burn.
        - Risk rises quickly if BAM-2 produces no operational update by Q3 2026.
    notes: >-
      Scenario logic is directional because Group14's valuation and revenue are not public; ranges are anchored to
      comparable company data and financing history.
    claimRefs:
      - CV033
      - CV038
      - CV039
      - CV040
