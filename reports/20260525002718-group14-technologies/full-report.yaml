      - number: '3.4'
        title: Substitute and Adjacent Technologies
        blocks:
          - type: paragraph
            body: |
              The primary long-term substitute threat to silicon anode suppliers is solid-state batteries, which
              promise step-change energy density improvements without conventional anode materials. However, as
              of late 2024, industry analysis confirmed that silicon anodes are commercially ahead of solid-state
              alternatives for near-term EV deployment, with solid-state facing unresolved electrolyte and
              manufacturing challenges that delay commercial automotive use to the late 2020s at the earliest.

              Within the silicon anode category, two competing chemistries represent substitution risk. Silicon
              oxide (SiO/SiOx) technologies from Shin-Etsu, Nexeon, and Daejoo offer an alternative to
              silicon-carbon composites, with lower first-cycle efficiency but strong cycle stability, and are
              already qualified in many Japanese and Korean cell supply chains. Pure silicon architectures from
              Enovix and Amprius achieve extreme energy density in non-automotive form factors.

              Enevate Corporation's XFC-Energy technology enables silicon-dominant lithium-ion cells designed
              for full EV charge in under ten minutes, competing with Group14 on the fast-charging performance
              narrative rather than energy density. OneD SiNAnode's plasma silane–based low-cost silicon anode
              process failed to reach commercial viability and its Moses Lake pilot plant was shut down in 2025.
              The graphite anode status quo—priced at approximately $6–8 per kilogram versus silicon at
              $10–11 per kilogram—remains the default for cost-sensitive cell makers until silicon-carbon
              composites reach parity, projected around 2028.
            claimRefs:
              - CP020
              - CP021
