      - number: '7.4'
        title: Supply Chain and Partner Concentration Risks
        blocks:
          - type: paragraph
            body: >
              Silane gas is the critical upstream input for Group14's SCC55 manufacturing process. Until January 2025,
              REC Silicon's Moses Lake plant was the only US producer of silane gas and was a key anchor for Group14's
              US manufacturing plans. On January 6 2025, REC Silicon announced it was ceasing Moses Lake operations and
              laying off 224 workers — Group14 CEO Rick Luebbe publicly called this "a bit of a curveball for the
              battery industry." Root cause was Hanwha Solutions (REC's largest shareholder as of April 2022) securing
              the majority of Moses Lake polysilicon output for its solar panel operations, leaving insufficient silicon
              for battery-grade silane production.

              Group14 is now reliant on REC Silicon's smaller Montana plant for near-term silane supply, but its
              capacity is insufficient for full BAM-2 scale. The DOE $200M silane plant award (September 2024) would
              fund a 7,200-metric-ton/year dedicated silane factory in Moses Lake, but CEO Luebbe noted it will take
              approximately three years to build — meaning silane supply remains a bottleneck risk through at least
              2027.

              Partner concentration is visible on the customer-investor side: SK (South Korea), Porsche, ATL, Microsoft,
              and OMERS collectively led the Series D and represent the most strategically prominent customer
              relationships. SK's 75% stake in BAM-3 was bought out in August 2025, eliminating JV governance risk but
              concentrating financial exposure in one relationship. Porsche's investment creates customer concentration
              risk if it reduces EV production targets or shifts battery chemistry strategy.

              Geographic concentration in Moses Lake, Washington creates community and political risk. Multiple
              workforce reductions have strained community relations and the company's long-term credibility with local
              government partners who expected hundreds of permanent jobs quickly.
