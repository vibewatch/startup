      - number: '7.5'
        title: Execution, Financial, and Workforce Risks
        blocks:
          - type: paragraph
            body: >
              Group14 is a capital-intensive hardware manufacturer in a sector where US construction costs run 9-34%
              above global averages. The company has raised $1.11B in total equity through its Series D (August 2025),
              giving it significant financial resources, but capital deployment depends on BAM-2 commissioning that has
              slipped repeatedly. Federal funding dependency is a structural risk: $300M in DOE grants ($100M for BAM-2,
              $200M for silane) represent a meaningful share of total project financing and are conditioned on NEPA
              compliance, domestic content, and other performance milestones.

              Workforce risk is elevated. Two rounds of US workforce reductions — a July 2025 layoff of undisclosed size
              and a January 2026 furlough — have affected morale, retention of specialized process engineers, and the
              timeline for commissioning BAM-2's highly automated continuous-process manufacturing. The pre-layoff
              headcount was approximately 400 worldwide. A third workforce action risks permanent attrition of
              specialized talent needed to commission and operate the facility.

              Section 45X production tax credits for battery electrode active materials — a critical part of Group14's
              US production economics — remain available through at least 2033 for battery components, but the OBBB
              Act's FEOC restrictions create compliance complexity. If any foreign precursor in Group14's supply chain
              is traced to a prohibited foreign entity, credits could be disqualified retroactively. The clean energy
              investment environment in Q1 2025 saw $6.9B in project cancellations — the highest quarterly value on
              record — illustrating that sector-wide capital market stress is real.
            claimRefs:
