      - number: '3.3'
        title: Incumbent Asian Anode Suppliers
        blocks:
          - type: paragraph
            body: |
              BTR New Energy, headquartered in Shenzhen, dominates the silicon anode material market with an
              estimated 70% share and sells primarily to CATL, BYD, and Korean cell makers. BTR's FY2025
              consolidated revenue reached RMB 16.98 billion (~$2.35 billion), up 19.3% year-over-year,
              driven by graphite and silicon-graphite composite anode volumes. Its scale translates into
              procurement leverage that Western pure-play silicon anode suppliers cannot yet match: BTR can
              bundle silicon anode pricing into graphite supply negotiations, pressuring cell makers to
              consolidate with a single incumbent supplier.

              Shin-Etsu Chemical (Japan) holds an estimated 22% share in silicon anode materials via its
              silicon monoxide (SiO)-based technology, qualified in Japanese and Korean OEM supply chains.
              Daejoo Electronic Materials (South Korea) holds approximately 7% of the silicon anode market,
              supplying SiOx-based materials to LG Energy Solution and SK On. Samsung SDI's internally
              developed Silicon Carbon Nano (SCN) program is designed to reduce or eliminate reliance on
              third-party silicon anode suppliers for its next-generation EV cells, setting a potential
              precedent for other integrated cell makers. CATL and BYD have documented internal silicon
              anode development programs that similarly create demand uncertainty for all third-party suppliers.
              These incumbents compete not by out-innovating Group14 on pure chemistry performance, but by
              leveraging procurement scale, integrated supply chains, entrenched OEM relationships, and
              significantly lower labor and raw-material costs.
