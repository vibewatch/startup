      - number: '5.6'
        title: Trust, Safety, Compliance, and Quality Controls
        blocks:
          - type: paragraph
            body: >
              SCC55 is produced at commercial scale with ISO-class process controls at each BAM factory. Group14 has not
              published independent certification data (ISO 9001, IATF 16949, UN 38.3) in its public press materials;
              these are diligence gaps requiring direct verification with customers and the company.

              From a safety perspective, the Exponent engineering analysis (2024) noted that silicon- anode cells carry
              higher thermal-runaway energy than equivalent graphite cells due to greater stored energy. Volume
              expansion during cycling can cause mechanical deformation of winding structures in cylindrical cell
              designs, potentially leading to electrolyte leakage and cell failure during aging—a failure mode not seen
              in traditional graphite cells. Group14 mitigates this with the scaffold void architecture, but independent
              long-term aging data beyond 3,000 cycles in automotive thermal environments are not publicly available.

              The BASF/Group14 testing confirmed stable cycling at 45°C (>500 cycles) and the Sionic/ Group14 joint
              testing confirmed stability at 45°C and 60°C storage with reduced gas generation, supporting EV battery
              pack thermal management compatibility. Full-temperature automotive qualification data (−40°C to +85°C
              cycling, vibration, nail penetration) are not in public domain.

              On supply-chain security, Group14 has designed its infrastructure to reduce dependence on Chinese graphite
              (>90% of global supply) and Chinese silane. The Moses Lake silane plant and German silane facility
              together are intended to create domestic and allied supply of this pyrophoric gas. Silane remains a
              safety-critical material (highly pyrophoric, requiring specialized handling), and the concentration of
              global silane supply in China has been identified by Group14 and competitors as a systemic industry risk.
            claimRefs:
