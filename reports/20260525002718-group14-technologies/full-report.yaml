            title: Revenue Lag vs. Capital Deployed
            body: >
              Group14 has deployed more than $1.1 billion in equity plus $100 million in government grants, yet
              estimated annual revenue is approximately $39 million—a revenue/capital ratio of roughly 3–4%. Even
              assuming BAM-2 reaches commercial production in 2026 and BAM-3 runs at full 2,000-ton capacity,
              consolidated revenue at full utilization (estimated $200–$400M/year) still implies a 4–10-year equity
              payback before breakeven at undisclosed margins. This is not unusual for deep-capex advanced materials
              manufacturers, but it is a significant underwriting risk for late-stage venture investors.
