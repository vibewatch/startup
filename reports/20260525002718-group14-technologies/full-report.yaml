  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: SCC55® Product Architecture and Core Technology
        blocks:
          - type: paragraph
            body: >
              Group14 Technologies produces a single commercial product: SCC55®, a synthetic silicon- carbon composite
              (Si/C) anode material designed to replace graphite anodes in lithium-ion cells. The name derives from
              Group 14 of the periodic table, which includes carbon and silicon. At the molecular level, SCC55 consists
              of a porous hard-carbon scaffold whose internal nanopore network is infused with amorphous, nano-sized
              silicon particles deposited via chemical vapor deposition (CVD). This scaffold-and-silicon architecture
              solves silicon's most fundamental commercial obstacle: pure silicon expands up to 300% in volume during
              lithiation, causing mechanical fracture and rapid capacity fade. Group14's scaffold pre-allocates void
              space for silicon expansion, mechanically constraining swelling and preserving electrical connectivity
              across thousands of cycles.

              The silicon precursor is silane gas (SiH₄), which Group14 obtains from its acquired facility in Spreetal,
              Germany (formerly Schmid Silicon Technology Holding) and plans to supplement with a new Moses Lake, WA
              plant. Silane is decomposed at elevated temperature inside the carbon scaffold, precipitating amorphous
              nano-silicon uniformly throughout the pore network. The resulting composite is processed and sized to
              produce a drop-in powder that replaces graphite in the anode slurry without requiring cell manufacturers
              to change production equipment. SCC55 is compatible with NMC, LFP, LMFP, high-nickel, and solid- state
              battery chemistries, and works with cylindrical, prismatic, and pouch cell formats.

              Because SCC55 can replace or blend with graphite, OEMs gain a spectrum of adoption paths: full silicon
              replacement (maximum energy density), partial blending (balanced cost/ performance), or
              fast-charging-optimized designs. The gravimetric capacity of silicon versus graphite is approximately 10:1
              per unit mass, enabling one tonne of SCC55 to replace roughly five tonnes of graphite while delivering
              superior volumetric and gravimetric performance.
