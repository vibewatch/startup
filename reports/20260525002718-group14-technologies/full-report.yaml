      - number: '7.6'
        title: Technology and Competitive Risks
        blocks:
          - type: paragraph
            body: >
              Silicon anode technology has historically suffered from rapid capacity degradation due to the volumetric
              expansion (up to 300%) of silicon during lithium insertion, leading to mechanical fracture and electrode
              failure. Group14's SCC55 addresses this through an engineered carbon scaffold with internal voids. The
              company publicly benchmarked SCC55 at 1,500+ charge cycles — and in some applications 3,000+ cycles —
              across 20+ customer datasets as of June 2025, resetting a prior 1,000-cycle benchmark. This is a
              company-reported milestone; independent long-term automotive duty-cycle validation remains a diligence
              gap.

              Sila Nanotechnologies, with 250+ patents and a Moses Lake factory now commissioning for 2025-2026
              production, is the primary domestic IP and market competitor. Both companies are in a race for OEM
              qualification slots available only once per battery design cycle. Group14's Moses Lake delay while Sila
              ramps is the most acute near-term technology-execution risk.

              Chinese competitors (BTR New Material Group, Shanshan, others) benefit from state subsidies, lower labor
              and energy costs, and a captive domestic battery manufacturing base that represents 70%+ of global demand.
              These producers are beginning to develop SCC55-analogous silicon-carbon materials. Group14's patent
              enforcement in China is limited by Chinese court dynamics. The South Korea production route bypasses
              US-China tariffs but still competes against Chinese domestic producers for Asian OEM contracts.

              The competitive landscape is also subject to disruption from alternative next-generation chemistries
              (solid-state batteries, sodium-ion, lithium-sulfur) that could reduce the total addressable market for
              silicon anode materials if they commercialize ahead of expectations.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR028
              - CR007
              - CR006
