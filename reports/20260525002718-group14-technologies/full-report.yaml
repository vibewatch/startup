chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Business Identity & Core Technology
        blocks:
          - type: paragraph
            body: >
              Group14 Technologies was incorporated in 2015 by co-founders Aaron Feaver, Rick Luebbe (CEO), and Rick
              Costantino (CTO) in Woodinville, Washington. The company's singular product focus is SCC55—a
              silicon-carbon composite (SiC) anode material engineered to replace graphite as the active anode component
              in lithium-ion cells. SCC55 is produced by embedding nano-scale silicon particles inside a hard-carbon
              scaffold whose internal void space absorbs silicon's volumetric expansion during lithiation, eliminating
              the mechanical degradation that has historically prevented silicon adoption at commercial scale.


              Independent cell testing and customer validation confirm that SCC55 delivers approximately 43% higher
              gravimetric energy density than conventional graphite anodes, supports 0-100% charge in roughly 90 seconds
              under optimized protocols, and sustains 1,500 to 3,000+ charge cycles depending on application. These
              attributes address the three most persistent pain points in consumer electronics and EV battery design:
              energy density, charge speed, and cycle life.


              As of May 2026, Group14 reports that more than 25 million devices have been enabled by SCC55, spanning
              laptops, power tools, and electric two-wheelers. The company claims its 160+ commercial customers
              represent roughly 95% of worldwide lithium-ion battery production capacity by volume. Group14 holds more
              than 170 issued patents protecting SCC55 composition, manufacturing process, and application know-how.
