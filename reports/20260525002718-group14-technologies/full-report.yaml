          detail: >-
            Metallurgical-grade silicon (earth-abundant); converted to silane (SiH₄) via proprietary low-energy process.
            Low supply risk.
        - label: Silane Gas (SiH₄)
          detail: >-
            CVD precursor; pyrophoric gas requiring specialized handling. Sourced from Germany plant; Moses Lake U.S.
            plant planned at 7,200 mt/yr.
        - label: Organic Carbon Precursor
          detail: >-
            Sugars, phenolics, or polymer-based feedstocks; pyrolyzed to form porous hard carbon. Low-cost with broad
            global supply.
        - label: Porous Hard-Carbon Scaffold
          detail: >-
            Tunable micropore/mesopore network provides void space for silicon volume expansion; prevents particle
            fracture. Core patented architecture.
        - label: CVD Nano-Silicon Deposition
          detail: >-
            Amorphous nano-Si uniformly infused into scaffold pores at elevated temperature via SiH₄ CVD. Protected by
            170+ patents covering both composition and process.
        - label: SCC55® Silicon-Carbon Composite
          detail: >-
            Final black powder anode material; drop-in replacement for graphite in Li-ion slurry. Compatible with NMC,
            LFP, LMFP, high-nickel, and solid-state chemistries.
    approximationNotes: Layer ordering reflects manufacturing sequence; relative proportions are qualitative.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
