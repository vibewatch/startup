      - number: '1.3'
        title: Funding History & Capital Structure
        blocks:
          - type: paragraph
            body: >
              Group14 has raised more than $1 billion in total equity across six identified priced rounds plus two
              significant US Department of Energy awards. The funding trajectory reflects a deliberate progression from
              venture-backed materials startup to infrastructure-scale manufacturer.


              The Series A ($18 million, November 2019) was co-led by OVP Venture Partners and ATL (Amperex Technology
              Limited), establishing the company's first relationship with a major cell manufacturer. The Series B ($17
              million, December 2020) was led by SK Materials (now SK Specialty), connecting Group14 to the South Korean
              chemicals arm of SK Group and presaging the BAM-3 joint venture. The Series C—structured in two
              tranches—raised $400 million in May 2022 (led by Porsche AG, with ATL and BASF) and $214 million in
              December 2022 (led by Microsoft Climate Innovation Fund, with Lightrock, Oman IA, Moore Strategic
              Ventures, and Molicel). The DOE Bipartisan Infrastructure Law grant of $100 million (October 2022)
              validated Group14's Moses Lake expansion plan.


              A $34.3 million private equity co-investment from ShawKwei and Partners closed in September 2023,
              providing bridge capital during a period of global battery-market softness. In September 2024, DOE
              announced an additional award of up to $200 million for a domestic silane manufacturing facility at Moses
              Lake. The Series D ($463 million, August 2025) was led by SK Inc. (the parent of SK Materials), which
              simultaneously sold its 75% stake in the BAM-3 South Korea joint venture back to Group14. Other Series D
              co-investors include Porsche Investments Management, ATL, OMERS, Decarbonization Partners, Lightrock, and
              Microsoft.


              Group14 has not publicly disclosed revenue, EBITDA, or a formal valuation. The company remains privately
              held with no publicly stated IPO timeline.
