      - number: '5.2'
        title: Manufacturing Platform, Factory Network, and Scale
        blocks:
          - type: paragraph
            body: >
              Group14 has built its manufacturing platform around what it calls the Applied Innovation framework—a
              parallel investment in product performance and repeatable, modular process engineering. The core
              manufacturing architecture is the Battery Active Materials (BAM) factory: a standardized, modular building
              block each rated at 2,000 metric tonnes of SCC55 per year (≈10 GWh of cell capacity). Factories are
              designed to be sited near customers, powered by low-carbon energy, and replicated rapidly without
              re-engineering.

              The current network consists of three factories. BAM-1, in Woodinville, WA, has manufactured SCC55 at the
              tonne scale since 2021 and established the process baseline that was replicated at subsequent sites.
              BAM-3, in Sangju, South Korea, was established as a JV with SK Inc. in 2021; Group14 acquired 100%
              ownership from SK in August 2025 and began EV- scale production in March 2026. BAM-3's 2,000 mt/year
              output covers ≈10 GWh of capacity, strategically co-located with the world's largest battery
              manufacturers. BAM-2, under construction in Moses Lake, WA, is designed for an initial 2,000 mt module (10
              GWh) with a six-module site plan totaling 12,000 mt/year. BAM-2 was originally targeted for Q4 2024 start
              but was delayed over 12 months; as of May 2026 the website indicates production expected to begin in 2026.

              A silane supply chain underlies all factories. Silane is currently sourced globally, with the Spreetal,
              Germany plant securing European supply. The U.S. DOE awarded Group14 up to $200M in September 2024 to
              construct a 7,200 mt/year silane factory co-sited in Moses Lake— enough to serve BAM-2 and sell surplus to
              peer silicon anode companies. This silane plant uses Group14's proprietary IP to reduce capital and energy
              intensity versus conventional Siemens-process silane.

              Adverse intelligence: A 2023 report by The Elec cited insiders saying the Korea JV factory had never
              operated continuously, with processes frequently halted for adjustment and funding from SK having been
              exhausted. SK Materials disputed this characterization, stating samples were being manufactured and mass
              production was possible after customer testing. The August 2025 acquisition gave Group14 full control, and
              by March 2026 commercial deliveries were confirmed. BAM-2's delay of more than a year, announced in the
              August 2025 Series D release, was attributed to tariff uncertainty and clean-tech macro headwinds.
