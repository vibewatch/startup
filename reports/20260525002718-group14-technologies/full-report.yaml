      - number: '3.2'
        title: Direct Silicon Anode Peers
        blocks:
          - type: paragraph
            body: |
              Sila Nano is Group14's most comparable Western rival. Sila has raised $1.3 billion or more in
              total funding, opened its Moses Lake, Washington factory in September 2025, and secured
              Mercedes-Benz and Panasonic Energy as named EV anchor customers with Q4 2025 production deliveries.
              Its Titan Silicon uses a dry-process nanocomposite approach distinct from Group14's chemical
              vapor deposition (CVD) method; Sila targets automotive cell makers requiring high silicon loading,
              while Group14 emphasizes broad drop-in compatibility across multiple cell chemistries. By mid-2026,
              Sila will have commercially de-risked its process in automotive applications—an important
              milestone ahead of Group14's own BAM-2 ramp.

              Nexeon, backed by OCI (silane feedstock) and Panasonic Energy, broke ground on its South Korea
              facility in April 2024 targeting 2025–2026 delivery, and signed a supply agreement with Panasonic
              Energy North America for EV battery production at Panasonic's planned De Soto, Kansas facility.
              Nexeon's silicon oxide–based (SiOx) chemistry offers strong cycle stability but lower first-cycle
              efficiency versus silicon-carbon composites.

              Enovix (NASDAQ: ENVX) reported FY2025 revenue of $31.8 million, up 38% year-over-year, with
              $621 million in cash as of year-end. Its 100%-silicon EZcell architecture targets mobile devices,
              IoT, and wearables rather than automotive applications, which limits direct head-to-head competition
              with Group14 for EV cell-maker programs but competes for the same cell-maker validation bandwidth.
              Amprius Technologies' silicon nanowire architecture achieves up to 450 Wh/kg, focusing on
              aerospace, defense, and UAV markets where cost is secondary to performance. NanoGraf, a
              100%-silicon nanoparticle supplier, was acquired by Monomyth Materials (rebranded M2Innovations)
              in May 2026, removing it as an independent competitor.
