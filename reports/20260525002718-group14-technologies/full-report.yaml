      - number: '7.3'
        title: Operational and Manufacturing Risks
        blocks:
          - type: paragraph
            body: >
              The BAM-2 facility in Moses Lake represents Group14's single largest execution risk. The 1,000,000-sq-ft
              factory broke ground in April 2023 with Clayco as general contractor, initially targeting late 2024
              production across two modules each capable of 2,000 metric tons per year of SCC55. Production start was
              first pushed to Q2 2025 (February 2025 update), then to H2 2025 (April 2025 update, citing US-China tariff
              demand collapse), then to early 2026 (July 2025 update accompanying layoffs), and as of January 2026 the
              facility is approximately 90% built with workers furloughed and construction proceeding at a measured
              pace. The company restructured construction contracts in February 2025, sequenced contractors to reduce
              cost, and laid off an undisclosed number of US workers in July 2025 and furloughed more in January 2026.

              Root causes of delay include: (1) demand-side collapse — approximately 70-80% of the global battery market
              is in China, and reciprocal tariffs caused Chinese customers to de-prioritize US-made materials; (2)
              contract restructuring with construction trades causing schedule disruption; and (3) the REC Silicon
              silane supply disruption eliminating the confidence buffer in feedstock availability.

              Operational safety risk is significant. Silane gas (SiH4), used in Group14's SCC55 manufacturing process,
              is a pyrophoric material that spontaneously ignites in air at low concentrations. OSHA Process Safety
              Management (PSM, 29 CFR 1910.119) applies at threshold quantities. The BAM-2 facility requires continuous
              gas monitoring, automated delivery systems, interlock shut-offs, explosion-proof electrical systems, and
              regular PSM audits. Any silane-related incident would halt production, trigger regulatory investigation,
              and potentially void DOE grant conditions.

              Competitor Sila Nanotechnologies has commissioned its Moses Lake factory targeting production in
              2025-2026, directly competing for OEM qualifications at a time when Group14's Moses Lake capacity is still
              offline. OneD Battery Sciences shut down its Moses Lake pilot plant in May 2025, illustrating that
              scale-up failures are real across the peer group.
