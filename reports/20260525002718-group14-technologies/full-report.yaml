      - number: '6.3'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              No public net revenue retention (NRR) or gross revenue retention (GRR) figures exist for Group14. As a
              materials supplier to battery cell manufacturers, churn risk differs structurally from SaaS: switching
              from silicon-carbon to graphite requires cell re-qualification (cycle testing, safety certification,
              potentially months of delay), creating a meaningful barrier to customer exit. Long-term agreements —
              CustomCells through 2030+ and the five June 2024 offtake agreements — provide contracted revenue
              visibility, although production-side delays could trigger renegotiation clauses. Concentration risk is
              material: a single disclosed deal (CustomCells) accounts for a reported $300 M+ of contracted revenue,
              potentially representing a disproportionate share of near-term revenue given Group14's total funding of
              $463 M+ through Series D. Investor-customers (ATL, Porsche/Cellforce, SK Inc.) have structural incentives
              to remain qualified adopters but the equity alignment is not a binding commitment to purchase volumes
              beyond contracted agreements. The company's 95% Li-ion TAM coverage claim, if accurate, reduces ecosystem
              concentration risk but does not eliminate single-customer dependency risk at the revenue level. Expansion
              evidence exists: StoreDot and BASF deepened technical integration in 2021 and 2025 respectively,
              suggesting a trend of partners upgrading to deeper commercial relationships over time. No customer has
              publicly announced cancellation or reduction of a Group14 order as of May 2026.
