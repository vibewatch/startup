  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              Silicon anode material has attracted a three-tier competitive field. At the frontier are Western
              deep-tech challengers—Group14 Technologies, Sila Nano, Nexeon, Enovix, and Amprius—each pursuing
              distinct chemistry and manufacturing strategies to displace graphite in lithium-ion cells.
              Incumbent Asian producers, led by BTR New Energy (~70% silicon anode market share) and Shin-Etsu
              Chemical (~22% SiO-based share), supply the Chinese and Japanese OEM ecosystem at scale and
              declining cost. A third tier encompasses substitute technologies: solid-state batteries, silicon
              anode programs developed in-house by OEM-adjacent cell makers such as Samsung SDI, and smaller
              niche players recently consolidated (NanoGraf acquired by Monomyth/M2Innovations May 2026;
              OneD SiNAnode shut its pilot plant in 2025). Group14 competes most directly with Sila in the West
              for automotive cell-maker wins, and with BTR and Shin-Etsu in Asia for volume supply agreements.
              The competitive window for independent silicon anode suppliers is real but time-constrained:
              Group14 must convert its 150+ customer testing relationships to production volume before Asian
              incumbents reach cost parity or before cell makers scale in-house silicon programs. The company's
              $1.11 billion in total capital raised and dual-continent manufacturing footprint place it among
              the best-resourced Western competitors, but execution risk on BAM-2 and an absence of named
              automotive OEM production contracts remain watch items for investors assessing competitive durability.
