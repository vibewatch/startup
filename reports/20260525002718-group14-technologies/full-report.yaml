companyProfile:
  summary: |
    Group14 Technologies is a Woodinville, Washington-based battery materials company founded in
    2015 to commercialize SCC55®, a silicon-carbon composite anode material that can replace part
    or all of conventional graphite in lithium-ion batteries. The company positions SCC55 as a
    drop-in material for existing cell lines that delivers materially higher energy density,
    faster charging, and better cycle life than graphite-only anodes. Group14 has raised more
    than $1.1B in equity, counts strategic investors including SK, Porsche, ATL, Microsoft,
    OMERS, and Decarbonization Partners, and now operates a commercial footprint spanning
    Woodinville, Moses Lake, and the wholly owned BAM-3 plant in Sangju, South Korea. The core
    investment debate is whether real customer traction and BAM-3 production are enough to offset
    repeated BAM-2 delays, policy exposure, and very limited public financial disclosure.
