            title: BAM-2 Delays & Policy Headwinds Compound Capital Risk
            body: >
              BAM-2's production start has been delayed at least three times (Q4 2024 → Q2 2025 → 2026). Each delay
              extends the period over which construction cost is carried without generating revenue offset.
              Simultaneously, the potential rescission of the $200M DOE silane grant—a consequence of Trump
              administration clean-energy policy reversals—could force Group14 to fund the silane plant entirely from
              equity, consuming a material portion of Series D proceeds and accelerating the timeline for a Series E
              raise. These compounding risks make the capital adequacy picture more fragile than the headline $463M
              Series D implies.
