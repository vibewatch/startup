  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - BAM-2 commissioning misses again
        - No operational update by Q3 2026 or slip into 2027
        - >-
          Undermines the U.S. manufacturing scale thesis; raises capital requirement and down-round probability; further
          workforce reductions likely.
        - Downgrade to avoid if slip extends beyond Q4 2026; demand capital runway disclosure.
      - - Revenue disclosure fails to materialize
        - No backlog, ARR, or revenue announcement by end of 2026
        - >-
          Prevents EV/Sales multiple anchoring; forces investors to rely on tech-option premium alone; comp set
          collapses to QS pre-revenue scenario, not Enovix revenue-growth scenario.
        - Hold valuation stance at unknown; require material discount to estimated mark.
      - - Chinese tariff losses persist or deepen
        - Chinese battery maker demand contracts through Q4 2026
        - >-
          Concentrates revenue risk on non-Chinese customer base; reduces the 150-customer metric to a smaller effective
          commercial base.
        - Reassess BAM-3 utilization; widen the bear case range.
      - - Down-round financing occurs
        - New equity priced below the ~$5.27B Series D mark
        - >-
          Signals strategic investors lack confidence to maintain the mark; raises preference overhang for earlier
          investors; makes exit at attractive terms harder.
        - Exit watchlist unless new financing is accompanied by revenue visibility and ramp proof.
    notes: >-
      Triggers are observable from public announcements and disclosed financing events; each has a specific monitorable
      signal trackable without management access.
    claimRefs:
      - CV022
      - CV032
      - CV033
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue and backlog
        - No public ARR, revenue run rate, or contracted backlog from BAM-3 customers
        - >-
          Without revenue, EV/Sales comp anchors cannot be applied; valuation reduces to tech-option framing which
          cannot support a buy call.
        - Management and finance diligence; voluntary press disclosure.
      - - Gross margin and unit economics
        - No disclosed cost per kilogram, gross margin, or manufacturing economics for SCC55
        - >-
          Gross margin determines whether Group14 can be cash-flow positive at BAM-3 scale before BAM-2 capital is fully
          deployed.
        - Operations and finance diligence.
      - - Cap-table and preference terms
        - No public post-money, liquidation preference stack, or participating terms
        - >-
          Preference overhang from $1B-plus raised could eliminate common equity upside even in a successful base-case
          exit scenario.
        - Legal and cap-table diligence via secondary-market data providers.
      - - BAM-2 commissioning timeline
        - No confirmed commissioning date or ramp schedule post-furloughs
        - >-
          BAM-2 is the largest driver of bull-case upside; its timeline determines when Group14 has two operating
          factories supporting a credible exit multiple.
        - Operations diligence; site visit or public press update.
      - - AI and data-center demand validation
        - No disclosed signed offtake or commercial contract for battery-in-data-center applications
        - >-
          The data-center pivot is the primary stated offset to EV tariff headwinds; without a contract, it is
          speculative demand and should be excluded from base-case assumptions.
        - Commercial diligence; customer reference verification.
    notes: >-
      These five asks are the minimum package required to move from watchlist to an entry price opinion; no other
      diligence workstream should start before these are addressed.
    claimRefs:
      - CV010
      - CV022
      - CV036
      - CV037
      - CV050
