      - number: '4.4'
        title: Unit Economics & Margin Profile
        blocks:
          - type: paragraph
            body: >
              Group14 does not publicly disclose gross margins, cost per ton of SCC55, or EBITDA. Industry data on
              comparable silicon-carbon anode producers suggests gross margins for technology leaders with protected IP
              and commercial-scale processes are in the 20–30% range, improving toward profitability as volume ramps and
              yield stabilizes. New-entrant producers with lower process maturity operate at 10–15% gross margins.
              Group14's position—170+ patents, a multi-year IP moat, and the only EV-scale silicon anode plant as of
              mid-2025—positions it toward the higher end, but the claim is unverifiable without private financials.

              On the revenue side, the company sells SCC55 by the metric ton under negotiated contracts. Industry
              estimates for advanced silicon-carbon composite materials in commercial volumes range from approximately
              $50 to $100 per kilogram ($50,000–$100,000 per ton). If Group14's 2025 estimated revenue (~$39M) is
              attributed primarily to BAM-3 output (beginning September 2024), this implies partial-year throughput at
              volumes well below the 2,000-ton design capacity—consistent with a ramp-up phase where qualification
              programs and initial commercial orders drive revenue rather than full-capacity utilization.

              Customer acquisition for B2B battery materials involves multi-year qualification cycles (12–24+ months for
              automotive), so CAC is embedded in R&D, application engineering, and sample-supply budgets rather than
              discrete sales spend. Payback horizon is therefore measured in qualification-to-volume timelines, not
              traditional SaaS or consumer payback metrics. The >$300M offtake contract value, once fully drawn,
              provides a revenue floor that backstops near-term unit economics uncertainty.
