      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Exceptional Cycle Life Enables Commercial Scale Adoption
            body: >
              SCC55 achieves 1,500-3,000+ charge cycles, matching or exceeding graphite in commercial cell
              configurations. This resolves the historically fatal tradeoff of silicon anodes—high initial energy
              density offset by rapid capacity fade—and is the primary technical gate that unlocked 160+ paying
              customers spanning consumer electronics and EV applications.
            calloutType: strength
            claimRefs:
              - CO006
              - CO008
              - CO011
          - type: callout
            title: BAM-2 Moses Lake Schedule Slippage Remains Unresolved
            body: >
              Group14's flagship US production facility has missed at least four disclosed completion deadlines (late
              2024, Q2 2025, fall 2025, early 2026). As of May 2026 the campus is approximately 90% complete but not yet
              commercially operational. Until BAM-2 achieves commissioning, Group14's US anode supply capacity is
              limited to BAM-1's ton-scale output, creating customer delivery risk and potentially ceding volume to
              competitors.
            calloutType: risk
            claimRefs:
              - CO028
              - CO029
              - CO041
          - type: callout
            title: South Korea Pivot Provides Near-Term Revenue Bridge
            body: >
              By acquiring SK Inc.'s 75% stake in BAM-3 as part of the Series D transaction, Group14 consolidated
              ownership of the only Group14 facility currently operating at full EV-scale capacity (10 GWh/yr, confirmed
              March 2026). This structural move—turning a joint-venture into a wholly owned asset—provides Group14 with
              full revenue recognition from South Korean production while BAM-2 commissioning continues, and reduces
              SK's governance leverage over that facility.
            calloutType: insight
            claimRefs:
