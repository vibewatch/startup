summary:
  headline: |
    Group14 是先进负极材料里最可信的私营电池材料平台之一：
    它已有真实商业部署、蓝筹战略股东，也有已经投运的韩国生产资产。
    但 BAM-2 执行滑坡、政策与供应链依赖、财务披露稀薄，仍压住承销判断。
    按目前估算估值看，这家公司值得密切观察，但风险还没有降到可以激进承销的程度。
