  evidenceGaps:
    - type: missing-source
      severity: material
      topic: silane-supply-volume
      missingEvidence: >
        Exact metric-ton volume of silane available from REC Silicon's Montana plant for Group14 on an
        annual basis, and what fraction this covers of BAM-2's initial production module requirement.
      whyItMatters: >
        Without knowing the Montana silane volume versus BAM-2 module requirement, it is impossible to
        determine how long Group14 can operate before silane becomes a hard production ceiling.
      diligencePath: >
        Request silane supply agreement with REC Silicon Montana; confirm annual volumes and take-or-pay
        terms; cross-reference with module 1+2 silane consumption at design capacity.
      relatedQuestionRefs:
        - QR003

    - type: private-evidence-only
      severity: material
      topic: DOE-grant-terms
      missingEvidence: >
        Full terms of the DOE $100M BAM-2 grant agreement and the $200M silane plant award negotiation,
        including performance milestones, clawback provisions, and grant conditions.
      whyItMatters: >
        Grant terms determine how exposed Group14 is to clawback risk under policy change and what
        conditions could trigger grant termination.
      diligencePath: >
        Request grant agreement under FOIA if not voluntarily disclosed; review milestone reporting
        requirements with DOE program officer.
      relatedQuestionRefs:
        - QR002
        - QR018
      relatedTableRefs:
        - TR001

    - type: missing-source
      severity: material
      topic: FEOC-supply-chain-audit
      missingEvidence: >
        Independent legal analysis of whether any tier-2 or tier-3 suppliers in Group14's silane or
        silicon precursor supply chain qualify as Prohibited Foreign Entities under the OBBB Act's 45X
        FEOC rules.
      whyItMatters: >
        If any precursor is found to constitute PFE material assistance, 45X credits could be denied or
        clawed back, materially worsening US production economics.
      diligencePath: >
        Commission independent supply-chain FEOC audit using OBBB Treasury guidance; obtain legal opinion
        from tax counsel on material assistance risk in current supply chain.
      relatedQuestionRefs:
        - QR005
        - QR023

    - type: missing-source
      severity: material
      topic: BAM-2-binding-offtake
      missingEvidence: >
        Whether any of Group14's 160+ customers have signed binding purchase agreements or offtake
        contracts for BAM-2 production specifically, versus letters of intent or testing agreements.
      whyItMatters: >
        Binding offtake determines whether revenue generation is contractually assured once production
        starts, or whether Group14 must compete for orders post-commissioning.
      diligencePath: >
        Request binding customer contract summary from company; review any publicly disclosed supply
        agreements.
      relatedQuestionRefs:
        - QR015
        - QR027

    - type: missing-source
      severity: material
      topic: independent-automotive-validation
      missingEvidence: >
        Independent third-party automotive duty-cycle validation of SCC55 at OEM-specified cycle counts,
        as opposed to company-reported customer data.
      whyItMatters: >
        Company-reported cycle-life data from 20+ customers is not equivalent to OEM-certified
        qualification; without independent validation, automotive adoption risk remains.
      diligencePath: >
        Request customer qualification letters or test reports from Porsche/Cellforce and other named
        automotive partners; seek UL, TUV, or independent lab certification documentation.
      relatedQuestionRefs:
        - QR021

    - type: missing-source
      severity: minor
      topic: OSHA-PSM-readiness
      missingEvidence: >
        Whether Group14 has retained a third-party Process Safety Management (PSM) consultant or
        completed a pre-start-up safety review (PSSR) for silane handling at BAM-2.
      whyItMatters: >
        First-of-kind scale silane handling at BAM-2 represents a safety risk where PSM readiness is a
        key indicator of incident probability.
      diligencePath: >
        Request PSSR documentation and PSM program status from Group14 EHS team before BAM-2
        commissioning.
      relatedQuestionRefs:
        - QR004

    - type: missing-source
      severity: material
      topic: IP-enforcement-status
      missingEvidence: >
        Whether Group14 has filed any patent infringement actions, cease-and-desist letters, or formal
        enforcement proceedings against Chinese silicon-carbon anode manufacturers as of May 2026; and
        whether any Chinese or other competitor has filed invalidity proceedings against Group14 patents.
      whyItMatters: >
        Active enforcement actions would confirm Group14's willingness to defend its IP moat; absence
        of enforcement could indicate either confidence in barriers or inability to enforce in China.
      diligencePath: >
        Search USPTO PAIR, PTAB, ITC, and PACER for filings referencing Group14 or SCC55; search EPO
        opposition proceedings; conduct in-country searches in key jurisdictions (Korea, Japan, China).
      relatedQuestionRefs:
        - QR008

    - type: missing-source
      severity: material
      topic: BAM-2-expansion-NEPA
      missingEvidence: >
