callouts:
  - calloutType: risk
    title: Silane Supply Discontinuity Is the Most Acute Near-Term Risk
    body: >
      REC Silicon's January 2025 closure of its only US silane plant left Group14 dependent on REC's
      smaller Montana facility, whose capacity is insufficient for full BAM-2 scale. Group14's own
      silane plant (DOE $200M award in negotiation) is at least 3 years from completion. This creates
      a critical feedstock bottleneck that limits US production scale regardless of construction
      progress at BAM-2.
    claimRefs:
      - CR019
      - CR020
      - CR023
      - CR024

  - calloutType: risk
    title: Federal Policy Has Already Materially Damaged the Execution Timeline
    body: >
      Three separate workforce reductions (July 2025 layoffs, January 2026 furloughs, and a prior
      workforce trim), construction contract restructuring, and a 12+ month production delay are all
      directly linked to the Trump administration's tariff regime and IRA credit rollbacks. The OBBB
      Act's FEOC rules add new compliance risk to the 45X credit Group14's US production economics
      depend on.
    claimRefs:
      - CR004
      - CR013
      - CR015
      - CR014

  - calloutType: risk
    title: Sila's Production Ramp Is the Critical Technology Competitive Threat
    body: >
      Sila Nanotechnologies commissioned its Moses Lake facility in 2025 and targeted customer
      production that year, running directly concurrent with Group14's BAM-2 delay. Automotive OEM
      silicon-anode qualification slots are available once per battery design cycle; Group14 risks
      permanent loss of these slots to Sila if BAM-2 delays persist into mid-2026.
    claimRefs:
      - CR028
      - CR010
      - CR032

  - calloutType: assumption
    title: No Active Litigation or Regulatory Enforcement Actions Identified
    body: >
      As of May 2026, no active lawsuits, SEC enforcement actions, EPA violations, or OSHA citations
      against Group14 Technologies have been identified through public records search. This does not
      confirm absence — private arbitration or regulatory investigations may not be publicly disclosed.
      Due diligence should include direct inquiry to the company, a PACER search, and EPA ECHO facility
      compliance check.
    claimRefs:
      - CR007
      - CR009

