  - id: regulatory-legal
    title: Regulatory and Legal Risks
    body: >
      Group14's BAM-2 facility in Moses Lake received a DOE Finding of No Significant Impact (FONSI) in
      October 2024 under NEPA (DOE/EA-2220), clearing the $100M BIL grant. The EA assessed air quality,
      water usage, waste management, employment, environmental justice, and greenhouse gas emissions and
      found no significant adverse environmental impacts. Ongoing compliance with Washington State Department
      of Ecology permits, air quality standards, and federal OSHA PSM rules for silane gas (a pyrophoric
      material) is a continuous obligation — any permit violation could halt operations.

      Legislative risk accelerated with the OBBB Act (signed July 4, 2025). The law introduces FEOC
      "material assistance" disqualification rules effective for tax years after July 4 2025 that would deny
      45X credits if Group14 receives material assistance from prohibited-foreign-entity partners in its
      supply chain, and creates accuracy-related penalties for overstated cost-ratio claims. Group14's South
      Korea JV (now wholly owned) and any Chinese silane or precursor sourcing must be carefully audited
      against FEOC compliance. The battery-materials 45X credit timeline to December 31 2033 is longer than
      wind/solar but faces declining credit amounts from 2031.

      IP and patent risk is material but currently managed. Group14 surpassed 170 issued patent matters
      worldwide as of March 2026, covering both SCC55 composition and commercial-scale manufacturing
      processes across five major jurisdictions representing more than 90% of global battery materials
      consumption. The company is publicly warning of increased market efforts to emulate its approaches,
      with active monitoring and enforcement ongoing. No active litigation against Group14 has been
      identified. Patent enforcement against Chinese producers is expensive, slow, and often ineffective in
      Chinese courts.

      Export control risk: the US Commerce Department tightened controls on advanced battery materials and
      technologies in late 2024. Group14's SK (South Korean) JV structure is viewed favorably from a CFIUS
      standpoint as South Korea is a US ally; however, any Chinese co-investment or technology transfer
      would be subject to CFIUS review and could trigger mandatory divestiture.
    claimRefs:
