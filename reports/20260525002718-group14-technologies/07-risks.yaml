        4 modules beyond the 2 currently under construction.
      whyItMatters: >
        If modules 3-6 require new NEPA review, this could add 12-24 months to the BAM-2 full build-out
        timeline and create regulatory uncertainty around the total capacity scale.
      diligencePath: >
        Review the DOE/EA-2220 scope statement to confirm whether all 6 modules are within the assessed
