chapter:
  number: 7
  title: Risks
  summary: >
    Group14 Technologies faces a compounding risk stack: federal grant dependence (DOE EA/FONSI-cleared BAM-2
    and $200M silane award under negotiation amid shifting US policy), IRA Section 45X credit erosion from
    the One Big Beautiful Bill Act (OBBB) signed July 2025, silane supply concentration in a single US
    producer (REC Silicon) that shuttered its Moses Lake plant in January 2025, a BAM-2 manufacturing
    scale-up more than 12 months behind original schedule with furloughs active as of January 2026, and
    customer and demand concentration anchored by a handful of strategic partners. Legal risk centers on
    Chinese imitation of SCC55 and multi-jurisdiction patent enforcement; no active litigation identified.
    Technology risk is partially mitigated by publicly benchmarked 1,500+ cycle performance from 20+ customers.

sections:
  - id: risk-overview
    title: Risk Landscape — Severity Ranking and Investment Implications
    body: >
      Group14 Technologies operates in a risk environment defined by five interlocking categories:
      regulatory/legal, operational/manufacturing, supply-chain/partner, execution/financial, and
      technology/competitive. As of May 2026 the most severe and least-mitigated risks are (1) the silane
      supply-chain discontinuity created by REC Silicon's January 2025 Moses Lake closure — Group14's
      only near-term US silane source is now REC's smaller Montana plant while its own silane factory is
      years from commissioning; (2) the multi-year construction delay at BAM-2 Moses Lake, which broke
      ground April 2023 and was originally planned for late 2024 production but now targets 2026 ramp-up
      while workers remain furloughed as of January 2026; and (3) federal policy risk materializing through
      the OBBB Act signed July 4 2025, which accelerates IRA Section 45X phaseouts and introduces
      prohibited-foreign-entity (FEOC) disqualification rules.

      Secondary risks include customer concentration (Porsche, SK, ATL represent the bulk of disclosed
      investor-customers), China demand collapse from reciprocal tariffs that removed the first wave of
      anticipated Moses Lake demand per CEO Rick Luebbe, and IP enforcement challenges as Chinese imitators
      scale. The risks are not independent: a federal grant cancellation or silicon supply gap would
      simultaneously delay BAM-2, stress cash flow, and shrink the window before competitors (Sila, which
      started production in 2025) capture key OEM qualifications.

      Events that would materially break the investment thesis include: DOE grant cancellation or clawback
      of the $200M silane award, REC Montana plant closure or silane rationing that forces BAM-2 to idle,
      and any EV-sector contraction that renders the high-capex US factory economically non-viable.
