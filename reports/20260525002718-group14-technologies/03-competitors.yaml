  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "Group14 automotive OEM production contract"
      missingEvidence: |
        No public disclosure identifies a named automotive OEM that has moved from testing SCC55 to a
        binding production supply agreement. Porsche is an investor, not a disclosed production customer.
        Group14 announced agreements with five cell manufacturers in 2024, but no OEM name was disclosed.
      whyItMatters: |
        A named automotive OEM production win would be the most significant commercial de-risking event
        for Group14 and would directly validate SCC55's automotive-grade qualification. Its absence in
        public disclosures is a key diligence gap versus Sila's confirmed Mercedes-Benz and Panasonic wins.
      diligencePath: |
        Request Group14 dataroom disclosure of existing supply agreements, including customer names,
        volume commitments, ASPs, and production start dates. Ask management directly: which of the
        five disclosed cell-maker agreement partners has achieved production-grade qualification?
      relatedQuestionRefs: [QP013]

    - type: missing-source
      severity: material
      topic: "Nexeon delivery timeline for Korea and North America"
      missingEvidence: |
        Nexeon broke ground in Korea in April 2024 targeting 2025–2026 delivery, but no confirmed
        production start date or volume delivery milestone for the Panasonic Energy North America
        supply agreement has been publicly disclosed as of the research date.
      whyItMatters: |
        If Nexeon delivers material to Panasonic Energy North America before Group14 converts any
        West-Coast cell maker to production, it would establish another Western silicon anode supplier
        in the automotive supply chain, intensifying competition for Panasonic's next EV cell generations.
      diligencePath: |
        Monitor Panasonic Energy North America press releases and Nexeon investor communications.
        Request Nexeon delivery confirmation and production start data from industry contacts.
      relatedQuestionRefs: [QP011]

    - type: private-evidence-only
      severity: material
      topic: "Competitor silicon anode pricing not publicly disclosed"
      missingEvidence: |
        Sila, Nexeon, and Shin-Etsu have not publicly disclosed their silicon anode material pricing.
        Group14's $10–11/kg estimate is an industry estimate; actual negotiated pricing between all
        suppliers and their cell maker customers is proprietary.
      whyItMatters: |
        Without actual pricing data, the competitive cost-structure analysis relies on estimates that
        may differ materially from negotiated reality. Price undercutting by BTR or a funded Western
        peer could accelerate customer switching faster than the 2028 graphite-parity projection.
      diligencePath: |
        Request Group14 ASP data and customer pricing ranges in the dataroom. Cross-check with
        cell-maker procurement contacts and industry consultant benchmarks.
      relatedQuestionRefs: [QP025]

    - type: missing-source
      severity: material
      topic: "Multi-homing behavior after automotive production commitment"
      missingEvidence: |
        While it is known that cell makers multi-home in testing phases, no public evidence confirms
        how often EV production programs maintain dual silicon anode suppliers versus committing to
        a single primary source post-qualification. The degree of multi-homing at commercial scale
        is unconfirmed.
      whyItMatters: |
        If cell makers routinely dual-qualify and maintain two silicon anode suppliers in production,
        Group14's first-to-qualify advantage is diluted; if lock-in is near-total post-commitment,
        Group14's 150+ testing relationships are more durable competitive assets.
      diligencePath: |
        Interview procurement teams at major cell makers (Samsung SDI, Panasonic, LG ES). Review
        publicly available supply agreements (e.g., DOE program requirements) for exclusivity terms.
      relatedQuestionRefs: [QP023]

    - type: missing-source
      severity: minor
      topic: "Independent cycle-life validation for Group14 SCC55"
      missingEvidence: |
        Group14 has announced 1,500 charge-discharge cycles at higher energy density and faster
        charging as a company-reported benchmark; no independently peer-reviewed or third-party
        test-lab cycle-life validation of SCC55 at commercial anode loading has been identified.
      whyItMatters: |
        Company-reported cycle data is susceptible to favorable test conditions (depth of discharge,
        C-rate, temperature). Without independent validation, cycle-life comparisons across silicon
        anode suppliers are unreliable for investment underwriting.
      diligencePath: |
        Request access to full-cell test data under standardized automotive conditions (e.g., IEC/SAE
        protocols) from Group14 or its cell maker partners. Look for published academic or standards-body
        characterization data.
      relatedQuestionRefs: [QP024]

    - type: missing-source
      severity: minor
      topic: "Samsung SDI SCN production timeline and silicon content specification"
      missingEvidence: |
        Samsung SDI's SCN program documentation describes targeting higher silicon content for
        next-generation cells, but the specific silicon percentage target, production start date,
        and whether SCN cells will be produced at scale before 2028 are not publicly confirmed.
      whyItMatters: |
        The timing of Samsung SDI's in-house silicon scale-up directly determines how quickly the
        disintermediation risk materializes for all third-party silicon anode suppliers including Group14.
      diligencePath: |
        Monitor Samsung SDI investor day presentations and battery technology conference proceedings.
        Request Samsung SDI cell qualification timelines from Group14 (Samsung SDI may be one of the
        five undisclosed cell-maker agreement partners).
      relatedQuestionRefs: []

    - type: stale
      severity: minor
      topic: "Competitor distribution channel and GTM strategy details"
      missingEvidence: |
        Available sources describe silicon anode suppliers' B2B direct-to-cell-maker model at a high
        level, but specific distribution channel structures (direct vs. distributor vs. JDA), geographic
        GTM prioritization, and channel economics for non-automotive verticals are not publicly documented
        for Sila, Nexeon, or BTR.
      whyItMatters: |
        Distribution channel structure affects customer access, margin, and speed-to-market. If BTR or
        Sila use distributors or integrated supply-chain partners to access customers Group14 sells to
        directly, competitive dynamics in those segments may differ from the automotive tier analysis.
      diligencePath: |
        Review Sila, Nexeon, and BTR job postings for sales/business development roles to infer GTM
