callouts:
  - calloutType: strength
    title: "Group14 leads Western silicon anode IP depth"
    body: |
      Group14's 170+ issued patents across five jurisdictions are claimed to cover more than 90% of
      global EV markets. This portfolio spans precursor chemistry through cell integration, creating
      licensing friction for competitors pursuing CVD-adjacent silicon-carbon composite processes.
      No public evidence shows Sila or Nexeon operating outside Group14's stated patent claims.
    claimRefs: [CP026, CP027, CP045]

  - calloutType: risk
    title: "BAM-2 execution risk persists despite March 2026 opening"
    body: |
      Group14's Moses Lake BAM-2 factory opened in limited production in March 2026 after at least
      12 months of delay. Workers were laid off in July 2025 and furloughed again in early 2026,
      coinciding with rival Sila ramping its own Moses Lake facility. The pace of BAM-2 commercial
      ramp and the company's true module-level COGS remain undisclosed and critical to competitive
      cost positioning.
    claimRefs: [CP029, CP034, CP035]

  - calloutType: risk
    title: "OEM vertical integration threatens third-party silicon anode addressable market"
    body: |
      Samsung SDI's SCN program, CATL's and BYD's documented internal silicon anode R&D, and the
      broader trajectory of large cell makers capturing upstream value create structural demand risk
      for all independent silicon anode suppliers. BTR's bundled graphite-silicon supply strategy
      adds procurement leverage that pure-play Western suppliers cannot easily match at current scale.
    claimRefs: [CP018, CP019, CP043]

  - calloutType: strength
    title: "150+ customer breadth provides validation advantage over single-OEM peers"
    body: |
      Group14's 150+ testing customers across automotive, CE, aerospace, and industrial verticals
      is substantially broader than the disclosed customer bases of Sila (2 named EV OEMs) and
      Nexeon (1 named OEM). This breadth provides diversified validation data and reduces the binary
      risk of a single program cancellation, while signed multi-year supply agreements with five
      leading cell manufacturers anchor the commercial pipeline.
    claimRefs: [CP030, CP038, CP039]

