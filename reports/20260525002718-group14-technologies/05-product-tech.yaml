callouts:
  - calloutType: strength
    title: "Dual-Layer IP Fortress Covering Composition and Process"
    body: >
      With 170+ issued patents across the five jurisdictions representing >90% of global battery
      manufacturing, Group14's IP covers both what SCC55 is (hard-carbon scaffold + CVD nano-Si)
      and how it is made at scale (CVD manufacturing method). This dual-layer protection
      materially raises the barrier for competitors to replicate the commercial manufacturing
      process—not just the material design—and provides legal clarity for customers building
      long-term supply programs.
    claimRefs:
      - CE025
      - CE026
      - CE027

  - calloutType: risk
    title: "Production Ramp Risk: BAM-2 Delay and Korea Process History"
    body: >
      BAM-2 (Moses Lake, WA)—Group14's flagship U.S. production asset—was delayed more than
      12 months from its Q4 2024 target amid clean-tech macro headwinds and tariff uncertainty.
      A 2023 adverse industry report (The Elec) described the Korea JV factory as never having
      operated continuously, with processes halted repeatedly and SK funds depleted—though SK
      disputed the account. While BAM-3 has since achieved commercial delivery status (March 2026),
      investors should probe BAM-2 commissioning progress, current yield rates, and capex
      requirements to close the funding-to-revenue gap at the primary U.S. asset.
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE044

  - calloutType: insight
    title: "Silane Supply Chain: Hidden Critical Dependency"
    body: >
      China dominates global silane production—the same supply-chain risk Group14 highlights for
      graphite applies to its own key manufacturing input. Group14's acquisition of the Spreetal
      silane plant (Germany) and the negotiated $200M DOE award for a Moses Lake silane plant
      directly address this concentration risk. Until the Moses Lake plant is commissioned,
      Group14's manufacturing cost and supply security remain partially dependent on global silane
      market conditions that China can influence.
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE045

