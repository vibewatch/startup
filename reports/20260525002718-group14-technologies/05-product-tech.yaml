  - id: performance-ip
    title: "Performance Benchmarks, Technology Differentiation, and IP"
    body: >
      Group14 published a performance benchmark in June 2025 based on data from 20+ customers
      worldwide: SCC55-enabled cells consistently achieve more than 1,500 charge cycles, with
      some applications exceeding 3,000 cycles at 80% capacity retention. This surpasses the
      historical 1,000-cycle threshold considered necessary for commercial lithium-ion viability.
      Specific performance gains reported by Group14 customers include 0-100% recharge in 90
      seconds (Molicel-type fast-charge design) and a 43% boost in energy density versus
      graphite. Joint testing by Sionic Energy using SCC55 achieved energy densities up to
      400 Wh/kg in NMC 83 pouch cells while maintaining >1,200 cycles and stable cycling at 45°C.
      BASF and Group14's jointly announced drop-in solution (using BASF Licity 2698 X F binder
      with SCC55) demonstrated >1,000 cycles at room temperature and >500 cycles at 45°C with
      ~4× the capacity of graphite.

      These figures are primarily company-reported or partner-reported in press releases; no
      peer-reviewed independent cell test data has been published publicly. The Exponent
      engineering firm noted that silicon-anode batteries have higher thermal-runaway severity
      than graphite cells at equivalent capacity due to greater energy content, and that real-
      world aging can introduce mechanical deformation failure modes not seen in legacy cells.

      The IP position is substantial. As of March 2026, Group14 holds 170+ issued patents across
      five major jurisdictions (representing >90% of global battery materials consumption). The
      portfolio protects both the composition of SCC55 (hard-carbon scaffold with nano-silicon)
      and the scalable CVD manufacturing methods. The CTO, Rick Costantino, co-invented the
      foundational material patents; patent US11174167B1 (Silicon carbon composites comprising
      ultra low Z) is a core example. Group14 stated it actively monitors and enforces its
      patent estate as adoption accelerates, citing concern over market emulation attempts.
