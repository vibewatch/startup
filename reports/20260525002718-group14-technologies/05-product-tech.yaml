  - id: roadmap-pipeline
    title: "Product Roadmap and Development Pipeline"
    body: >
      Group14's near-term roadmap is primarily a manufacturing scale-up story rather than a
      discrete feature pipeline. The product (SCC55) is commercially mature and customer-proven;
      the primary development work is in (a) ramping BAM-2 to full 2,000 mt first-module
      capacity in 2026, (b) commissioning the Spreetal silane plant in Germany to secure
      European supply, and (c) obtaining the $200M DOE grant for the 7,200 mt Moses Lake silane
      plant. The BAM-2 six-module build-out targets 12,000 mt/year (≈60 GWh) at full site
      capacity; the company website cites 20 GWh (two modules) by 2027.

      On the material side, Group14 is working on integration with solid-state battery
      chemistries and continues to expand SCC55 performance optimization with partners such as
      BASF (binder co-development) and Sionic (graphite-free 100% silicon anode designs). The
      CEO stated that full silicon replacement of graphite—rather than blending—is achievable
      with SCC55 today, with Sionic demonstrating commercial proof.

      Long-term, Group14 intends to replicate its BAM module globally (Europe BAM factory is
      planned but not yet sited). The Applied Innovation program also targets ongoing cost
      reduction to close the price gap with graphite-based anodes, which remains a barrier to
      mainstream automotive OEM adoption at high volume.
