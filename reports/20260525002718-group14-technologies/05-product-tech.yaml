  - id: applications-integration
    title: "Application Domains, Customer Integration, and Workflow"
    body: >
      SCC55 is deployed across four primary domains: electric mobility (EVs, eVTOLs, hyper-EVs),
      consumer electronics (smartphones, laptops, AI-enabled devices), AI/data center backup
      power, and grid-scale energy storage. As of March 2026, Group14 delivers to 160+ customers
      representing 95% of worldwide lithium-ion battery production by volume.

      In consumer electronics, Group14's highest-profile deployment is the Honor Magic7 Pro
      smartphone (launched October 2024 in China), powered by a 5,850 mAh third-generation
      silicon battery manufactured by ATL using SCC55. ATL stated that Group14 technology is
      integrated into millions of ATL batteries powering AI-enabled smartphones. SCC55 also
      powers the Honor Magic5 Pro and V2 models. Molicel's ultra-high-power P50B cylindrical
      cell uses SCC55 for fast-discharge applications and was cited as a Group14 commercial
      partner milestone. Sionic Energy has commercially validated a 100% silicon-carbon anode
      design (displacing graphite entirely) in partnership with Group14.

      EV integration requires a 6–8 month qualification cycle post-material delivery: cell
      manufacturer qualification, program scheduling, and vehicle validation before volume ramp.
      Group14's CEO noted BYD's announced 10%-to-70% flash-charge capability in 5 minutes is
      likely silicon-carbon enabled. Porsche, an investor and strategic partner, plans to
      incorporate silicon battery technology in its electric vehicles via the Cellforce Group
      affiliate.

      For AI data centers, silicon batteries' extreme fast-discharge capability addresses the
      instantaneous power response demands of AI-inference loads that exceed the response rate
      of traditional lead-acid UPS systems. For grid/eVTOL, the combination of high energy
      density, fast charging, and >1,000 cycle life supports economical deployment in applications
      where graphite-based cells previously fell short on cycle economics.
