  - id: growth-drivers-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      The most powerful structural growth driver is EV adoption itself: in 2025, approximately one in four
      cars sold globally was electric, and global EV battery demand approached 1,970 GWh—six times the
      level of 2020. Every additional GWh of EV capacity that incorporates even a small percentage of
      silicon anode material directly expands Group14's addressable market. China's geopolitical control
      over graphite (75–95% of global supply and processing) is a second major tailwind: the US Inflation
      Reduction Act's Foreign Entity of Concern provisions aimed to exclude Chinese battery materials
      from the $7,500 EV tax credit, driving US and EU OEMs to qualify alternative anode suppliers.
      Although the Treasury has delayed the hard ban on Chinese graphite until 2027 (with China also
      temporarily easing export controls until November 2026), the strategic motivation for diversification
      remains intact and benefits silicon-carbon anode producers with non-Chinese supply chains. Rising
      energy density requirements for AI-enabled devices and wearables create a complementary consumer
      electronics tailwind; Group14 has explicitly cited AI device power demand as a growth vector.
      US DOE investment ($200 million award for a 7,200 mt/yr silane gas plant in Moses Lake, Washington,
      supplementing an earlier $100 million grant) reduces Group14's domestic manufacturing cost basis
      and strengthens supply chain resilience. On the constraint side, the primary technical barrier is
      silicon's ~300% volume expansion during lithiation, which causes mechanical stress, electrode
      cracking, and accelerated capacity fade; Group14's SCC55 addresses this through a pre-lithiation
      scaffold architecture but high-silicon-content cells remain more expensive and more difficult to
      manufacture than graphite-dominant equivalents. OEM qualification timelines of 18–36 months
      create a structural lag between customer wins and revenue contribution; this is particularly acute
      in automotive where safety and durability standards require extensive validation. Chinese battery
      manufacturers maintain a 30–35% cost advantage over Western equivalents using conventional graphite,
      constraining the speed at which silicon premiums can be absorbed by buyers. Growth in LFP chemistry
      (which exceeded 50% of EV pack shipments in 2025) represents a mixed signal: LFP cells rarely
      incorporate silicon anodes, so the shift away from high-nickel NMC—where silicon density benefits
      are most valuable—partially offsets the EV volume tailwind.
