  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: market-sizing
      missingEvidence: >
        Group14's actual contracted revenue pipeline, average selling price per kilogram of SCC55,
        and customer concentration breakdown are not publicly disclosed, making bottom-up SOM sizing
        dependent on management-provided capacity figures and estimated ASPs.
      whyItMatters: >
        Without ASP and revenue pipeline data, SOM estimates carry a wide error band; investor
        valuation models built on addressable market size cannot be verified against actual commercial
        terms.
      diligencePath: >
        Request commercial dataroom disclosure including SCC55 ASP by customer tier, contracted
        volume for 2025–2027, and customer concentration by revenue contribution.
      relatedQuestionRefs: [QM002]

    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >
        Analyst estimates for the silicon anode market in 2025 differ by 3–4× across reputable
        publishers (e.g., Fortune Business Insights at $345.7M vs. Custom Market Insights at $1.2B),
        and the methodological basis for each estimate is not publicly disclosed.
      whyItMatters: >
        The wide spread makes it impossible to triangulate a single reliable base market size; both
        the growth narrative and the competitive positioning claims depend on which estimate is used
        as the reference point.
      diligencePath: >
        Request from analysts or industry associations (e.g., BATTERY2030+, BNEF) a definition-
        harmonized estimate that uses identical boundary conditions (material-only vs. cell-level)
        and published primary data sources.
      relatedQuestionRefs: [QM015]

    - type: private-evidence-only
      severity: minor
      topic: competitive-landscape
      missingEvidence: >
        Sila Nanotechnologies' production capacity, ASP, and customer qualification pipeline
        details are not publicly disclosed, limiting a rigorous head-to-head capacity and revenue
        comparison with Group14.
      whyItMatters: >
        Without Sila's capacity data, it is unclear whether Group14's 2,000 mt/yr BAM-3 is ahead
        of, at parity with, or behind Sila's manufacturing scale; this affects the competitive
        positioning narrative.
      diligencePath: >
