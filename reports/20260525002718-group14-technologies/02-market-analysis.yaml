company:
  name: Group14 Technologies

chapter:
  number: 2
  title: Market Analysis
  summary: >
    The global battery silicon anode materials market sat at roughly $450–$655 million in 2025 and is
    forecast to exceed $20 billion by 2035 at a CAGR of 42–50%, driven overwhelmingly by EV demand
    (~70% of silicon anode consumption), consumer electronics, and an emerging grid-storage segment.
    Group14's SCC55 silicon-carbon composite competes in the fastest-growing sub-segment of a total
    lithium-ion battery market that exceeded $150 billion in 2025; favourable IRA policy, China graphite
    risk, and rising AI-device energy density requirements are structural tailwinds, while long OEM
    qualification cycles, silicon volume-expansion challenges, and China's cost advantage in conventional
    graphite remain material constraints.

sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >
      Group14's addressable market is the global supply of battery-grade silicon-carbon composite anode
      materials—a narrower slice of the broader lithium-ion battery anode materials space that remains
      dominated by natural and synthetic graphite (>95% share as of 2025). The company's core product,
      SCC55, is a scaffold-based silicon-carbon composite that battery cell manufacturers purchase as a
      drop-in precursor to replace or supplement graphite anode slurry in lithium-ion cells. The
      included spend covers OEM purchases of silicon-based anode materials for integration into
      cylindrical, prismatic, and pouch cells destined for electric vehicles, consumer electronics, and
      stationary energy storage. Excluded spend includes natural graphite, synthetic graphite, cathode
      materials (NMC, LFP, NCA), electrolytes, separators, cell assembly, pack integration, and battery
      management electronics. Adjacent markets include silicon oxide (SiOx/SiO) anode materials, which
      represented approximately 60% of all silicon anode material production in 2025, with silicon-carbon
      composites making up the remaining 40%; Group14 competes in the composite segment. Status-quo
      substitutes are battery-grade natural and synthetic graphite, which OEMs source predominantly from
      China (75–95% of global processing) and continue to use in the vast majority of lithium-ion cells
      in 2025. The market boundary is intentionally constrained to silicon anode materials at the cell
      chemistry input layer; Group14 does not sell finished cells or packs, so battery system integrators,
      module assemblers, and OEMs sit on the demand side of this market, not within it. Adjacencies
      include solid-state electrolyte development (where silicon anodes are also being evaluated) and
      advanced cathode materials markets, but these adjacencies have not yet generated revenue for Group14
      and are excluded from the base sizing analysis.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
