  - id: buyer-segmentation
    title: Buyer and Segment Structure
    body: >
      Silicon anode materials flow through a tiered supply chain: Group14 sells SCC55 to battery cell
      manufacturers (Tier-1 suppliers), who incorporate the material into cells sold to battery packs
      integrators and directly to OEMs across three primary end-market segments. The EV segment is the
      dominant demand driver, accounting for an estimated 65–80% of silicon anode material consumption
      in 2025. Battery cell manufacturers—CATL, Samsung SDI, LG Energy Solution, Panasonic, ATL, and
      SK Innovation—are the direct buyers; their procurement decisions are driven by OEM battery
      specifications, energy-density mandates, range targets, and total-cost-of-ownership models.
      Consumer electronics represents the second-largest demand segment (~35% of silicon anode battery
      market revenue in 2025 per Fortune Business Insights), driven by demand from smartphone and
      wearable OEMs—primarily in Asia-Pacific—seeking longer battery life, faster charging, and
      physically smaller cells. The payer in this channel is the consumer electronics OEM (e.g., Samsung,
      Apple through Foxconn/ATL supply chains), while end-users are individual device consumers. Grid
      and stationary energy storage is an emerging segment representing approximately 15% of silicon
      anode material demand in 2025; this market favors LFP chemistry, which currently carries minimal
      silicon content, so silicon-carbon composites face a more limited opportunity here than in EV and
      CE channels in the near term. Defense and eVTOL applications represent a small but strategically
      significant niche where Group14 has disclosed shipments; the payer is typically a government
      program office or early-stage aircraft OEM, and the primary adoption trigger is energy density per
      unit weight rather than cost. Budget ownership within direct buyer organizations sits at the VP
      of battery engineering or advanced materials procurement level; Group14 must win specification-in
      decisions typically made 18–36 months before commercial volume ramp.
