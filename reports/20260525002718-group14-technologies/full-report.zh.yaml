      - - 覆盖全球锂离子电池产量 95% 的 150+ 客户，构成现有厂商不易复制的市场渗透基础。
        - 如果关税导致的中国需求破坏持续到 2027，客户数量本身无法保护收入，因为中国制造商主导电池市场。
      - - Porsche、SK 和 Microsoft 等战略投资者释放多维价值信号：汽车验证、制造合作，以及数据中心邻近性。
        - 如果这些投资者以更低标记退出，或新的共同投资权带来稀释，战略投资者信号会反转。
      - - 170+ 项专利组合和 BASF 验证的 1,500 次循环性能基准，构成硅负极领域可持续的 IP 护城河。
