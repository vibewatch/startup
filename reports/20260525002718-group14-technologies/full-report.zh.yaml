              million。Sangju（BAM-3）收购把此前作为合资投资列账的制造资产加入资产负债表。 德国硅烷工厂（Spreetal，最高约 1,000 tons/year 硅烷）独立融资，预计早于更大的 Moses
              Lake 硅烷设施上线。

              运营成本结构未披露，但硅碳负极制造耗能且工艺密集：主要输入包括硅烷气体（通过化学气相沉积转化为硅）、碳骨架和能源。 Group14 的共址策略（硅材料工厂贴近 Moses Lake
              的硅烷供应）目标是在两类设施都运行后降低输入物流成本。公司依赖 Columbia Basin 水电获得相对低成本、清洁电力——这是结构性成本优势，但如今正受到数据中心争夺可用电力的压力。

