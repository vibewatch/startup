  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 建议链条从商业证据和战略定位出发，经过执行风险和财务不透明，最终落到观察而非买入。
    data:
      nodes:
        - label: BAM-3 已运营 — 韩国 10 GWh 自 2024 年 9 月起投运
        - label: 150+ 家客户，代表全球锂离子电池产量的 95%
        - label: 战略投资方 — Porsche、SK、Microsoft、OMERS 验证技术与应用
        - label: BAM-2 延期 12+ 个月 — 2025 年 7 月裁员；2026 年 3 月无薪休假
        - label: 收入和利润率未披露 — EV/Sales 倍数无法锚定
        - label: 关税侵蚀中国需求 — 占全球电池市场 70% 至 80%
        - label: 硅负极竞争加剧 — Sila 2025 年开设美国工厂
        - label: 建议为观察，置信度中、风险高、估值立场合理
    approximationNotes: null
    claimRefs:
      - CV001
      - CV021
      - CV025
      - CV022
      - CV010
      - CV029
      - CV049
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最能改变投资判断的两个变量是 BAM-2 爬坡证明和收入披露；AI 数据中心包销验证是第三个有意义的摆动因素。
    data:
      items:
        - label: BAM-2 投产证明
          value: 10
        - label: 收入或积压订单披露
          value: 9
        - label: AI 和数据中心包销验证
          value: 7
        - label: 股权结构表和优先权清晰度
          value: 7
        - label: EV 市场需求复苏
          value: 6
        - label: 中国客户的美国关税问题解决
          value: 5
    approximationNotes: 0 到 10 的序数评分概括了新正面证据出现时各变量改变投资建议的能力；这是作者判断，不是模型输出。
    claimRefs:
      - CV022
      - CV010
      - CV050
      - CV033
      - CV031
      - CV029
  - id: FV003
    title: 估值与回报区间
    type: range
    layout: standard
    summary: 乐观到悲观区间为 $2B 至 $10B，以可比公司证据锚定；基准情景与分析师估计的 $5.27B Series D 估值标记一致。
    data:
      items:
        - label: 悲观情景
          low: 2
          mid: 2.5
          high: 3
        - label: 基准情景
          low: 4.5
          mid: 5.27
          high: 6
        - label: 乐观情景
          low: 7
          mid: 8.5
          high: 10
    approximationNotes: >-
      数值以十亿美元计，币种为 USD。以 Enovix 企业价值（EV）$1.47B、销售收入 42x，Sila 约 $3.3B 私人公司估值，QuantumScape 企业价值（EV） $4.21B 且收入前，以及分析师估计的
      Series D 估值标记为锚。由于收入未披露，不采用 DCF。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV011
      - CV012
      - CV013
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Group14 在市场机会和技术证据上得分强，但生产爬坡居中，财务可见度和估值支撑得分偏弱。
    data:
      items:
        - label: 市场机会
          score: 8
        - label: 技术证据（SCC55 循环寿命、BASF 验证）
          score: 8
        - label: 商业牵引（BAM-3 收入、150+ 家客户）
          score: 7
        - label: 生产爬坡（BAM-2 时间线）
          score: 4
        - label: 财务可见度（收入、利润率、股权结构表）
          score: 2
        - label: 估值支撑（以可比公司锚定，而非收入锚定）
          score: 5
    approximationNotes: 评分为 0-10 的序数判断，基于截至 2026-05-25 的公开证据；并非管理层提供的 KPI。
    claimRefs:
      - CV016
      - CV027
      - CV028
      - CV022
      - CV010
      - CV011
