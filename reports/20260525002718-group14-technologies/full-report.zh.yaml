      - number: '6.3'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Group14 没有公开净留存率（NRR）或总留存率（GRR）数据。作为电池电芯制造商的材料供应商，它的流失风险与 SaaS
              在结构上不同：从硅碳切回石墨需要重新认证电芯（循环测试、安全认证，可能造成数月延迟），这为客户退出设置了实质门槛。长期协议——CustomCells 到 2030+ 年，以及 2024 年 6
              月的五份承购协议——提供了合同收入可见性，尽管生产端延期可能触发重新谈判条款。集中度风险很高：单笔已披露交易（CustomCells）据称贡献 $300 M+ 合同收入，考虑到 Group14 D 轮累计融资
              $463 M+，这可能占近期收入的非成比例大头。投资方客户（ATL、Porsche/Cellforce、SK Inc.）有结构性动机保持合格采用方身份，但股权绑定并不等于在既有合同之外承诺采购量。如果公司 95%
              锂离子 TAM 覆盖声明准确，它能降低生态集中度风险，但不能消除收入层面的单客户依赖。扩张证据存在：StoreDot 和 BASF 分别在 2021 年、2025
              年加深技术整合，显示合作伙伴随时间升级为更深商业关系的趋势。截至 2026 年 5 月，没有客户公开宣布取消或削减 Group14 订单。
