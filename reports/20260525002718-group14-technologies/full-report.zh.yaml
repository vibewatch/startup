  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险图谱——严重性排序与投资含义
        blocks:
          - type: paragraph
            body: >
              Group14 Technologies 所处风险环境由五类相互咬合的风险定义：监管 / 法律、运营 / 制造、供应链 / 合作伙伴、执行 / 财务，以及技术 / 竞争。截至 2026 年 5
              月，最严重且缓释最不足的风险是：（1）REC Silicon 2025 年 1 月关闭 Moses Lake 造成硅烷供应链断裂——Group14 短期唯一美国硅烷来源变成 REC 更小的 Montana
              工厂，而自有硅烷工厂距离投产仍需数年；（2）BAM-2 Moses Lake 多年建设延期，该项目 2023 年 4 月破土，原计划 2024 年底生产，现在目标改为 2026 年爬坡，且截至 2026 年 1
              月工人仍处于停工；（3）2025 年 7 月 4 日签署的 OBBB Act 让联邦政策风险落地，它加速 IRA 第 45X 条退坡，并引入受禁外国实体（FEOC）取消资格规则。

              次级风险包括客户集中度（Porsche、SK、ATL 构成已披露投资方客户的大头）、互惠关税导致中国需求崩塌（CEO Rick Luebbe 称这移除了第一波预期 Moses Lake
              需求），以及中国模仿者规模化后带来的 IP 执法挑战。这些风险并不独立：联邦补助取消或硅供应缺口，会同时推迟 BAM-2、压迫现金流，并缩短窗口，让竞争对手（Sila 已于 2025 年开始生产）抢走关键 OEM
              认证。

              会实质性打破投资逻辑的事件包括：DOE 取消或追回 $200M 硅烷奖励；REC Montana 工厂关闭或硅烷配给迫使 BAM-2 闲置；以及任何 EV 行业收缩，使高资本开支的美国工厂在经济性上站不住。
