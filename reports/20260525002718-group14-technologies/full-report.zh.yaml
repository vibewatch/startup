      - number: '1.4'
        title: 制造版图与关键里程碑
        blocks:
          - type: paragraph
            body: >
              Group14 采用三工厂制造策略，目标是以 GWh 级规模向全球电池制造商供应负极材料。每座工厂都被命名为 电池活性材料（BAM）工厂。


              BAM-1 位于公司华盛顿州 Woodinville 总部，于 2021 年 4 月启用，已证明吨级 SCC55 生产能力。 它仍作为工艺开发和认证中心运行。BAM-2 是 Group14
              旗舰美国商业工厂，2023 年 4 月在华盛顿州 Moses Lake 破土动工，园区规划面积 1 million 平方英尺。最初两个生产模块各自额定年产 2,000 metric tons（约 10 GWh
              负极产能）。该设施遭遇实质性施工延误：最初的 2024 年末目标推迟到 2025 年 Q2，再推到 2025 年秋，随后又被描述为 2026 年初，并在 2026 年 3 月时接近完工。 2026 年 1
              月，Group14 宣布在施工继续推进期间，临时让 Moses Lake 工人休假。截至 2026 年 5 月， Moses Lake 园区约 90% 完工，调试正在进行。


              韩国 Sangju 的 BAM-3 于 2021 年通过与 SK Inc. 的合资公司设立。该设施自 2024 年 9 月开始向 100 多家客户交付 SCC55。2025 年 8 月，Group14 在
              Series D 交易中收购 SK Inc. 剩余 75% 所有权， 将 BAM-3 变为全资子公司。BAM-3 于 2026 年 3 月 12 日达到完整 EV 规模商业化生产——每年 10 GWh （每年
              2,000 metric tons）——成为 Group14 第一座已确认达到满额定产能的工厂。


              Group14 还拥有位于德国 Spreetal 的 Schmid Silicon GmbH（2023 年 7 月收购），该公司生产单硅烷， 即 SCC55 的关键化学前驱体。DOE
              奖励下，第二座更大的硅烷设施规划建在 Moses Lake。
