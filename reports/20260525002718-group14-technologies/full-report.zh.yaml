              BAM-3 自 2024 年 9 月以来实现 10 GWh 商业 SCC55
              生产，相比商业化前电池创业公司构成有意义差异。它证明的是制造流程，而不只是实验室化学。这项证明是跟踪建议没有降为回避的主要原因。不过，BAM-3 以当前规模单独存在，若没有收入披露，仍不足以支撑 $5.27
              billion 估算价位；它是给出买入判断的必要条件，但不是充分条件。
