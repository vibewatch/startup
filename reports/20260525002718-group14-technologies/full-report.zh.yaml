chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 商业身份与核心技术
        blocks:
          - type: paragraph
            body: >
              Group14 Technologies 由联合创始人 Aaron Feaver、Rick Luebbe（CEO）和 Rick Costantino（CTO）于 2015 年在华盛顿州 Woodinville
              注册成立。公司只聚焦一个产品： SCC55，一种硅碳复合（SiC）负极材料，目标是在锂离子电芯中替代石墨，成为活性负极组分。 SCC55
              的做法是把纳米级硅颗粒嵌入硬碳骨架，骨架内部孔隙吸收硅在嵌锂过程中的体积膨胀， 从而消除过去阻碍硅材料商业化采用的机械退化问题。


              独立电芯测试和客户验证显示，在优化方案下，SCC55 的重量能量密度比传统石墨负极高约 43%，支持约 90 秒完成 0-100% 充电，并可维持 1,500 至 3,000+ 次充放电循环，具体取决于应用。
              这些属性正击中消费电子和 EV 电池设计中最顽固的三个痛点：能量密度、充电速度和循环寿命。


              截至 2026 年 5 月，Group14 称已有超过 25 million 台设备搭载 SCC55，覆盖笔记本电脑、 电动工具和电动两轮车。公司称其 160+ 家商业客户按产能计约代表全球 95%
              的锂离子电池产能。 Group14 持有超过 170 项已授权专利，覆盖 SCC55 配方、制造工艺和应用经验。
