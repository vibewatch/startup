      - number: '5.4'
        title: 应用场景、客户导入与工作流
        blocks:
          - type: paragraph
            body: >
              SCC55 部署在四个主要领域：电动出行（EV、eVTOL、超高性能 EV）、消费电子（智能手机、笔记本电脑、支持 AI 的设备）、AI / 数据中心备用电源，以及电网级储能。截至 2026 年 3
              月，Group14 向 160+ 客户交付，这些客户按产量代表全球 95% 的锂离子电池生产。

              在消费电子领域，Group14 最具代表性的部署是 Honor Magic7 Pro 智能手机（2024 年 10 月在中国发布），它搭载 ATL 使用 SCC55 制造的 5,850 mAh
              第三代硅电池。ATL 表示，Group14 技术已整合进数百万块 ATL 电池，用于支持 AI 的智能手机。SCC55 也为 Honor Magic5 Pro 和 V2 机型供电。Molicel 的超高功率
              P50B 圆柱电芯使用 SCC55 面向快放电应用，并被列为 Group14 商业合作伙伴里程碑。Sionic Energy 已与 Group14 合作，商业验证了 100% 硅碳负极设计（完全取代石墨）。

              EV 导入在材料交付后需要 6–8 个月认证周期：电芯制造商认证、项目排期、整车验证，然后才会放量。Group14 CEO 指出，BYD 公布的 5 分钟 10%-to-70%
              闪充能力很可能由硅碳技术支撑。投资方和战略伙伴 Porsche 计划通过 Cellforce Group 关联公司，将硅电池技术纳入其电动车。

              面向 AI 数据中心，硅电池的极快速放电能力对应 AI 推理负载的瞬时电力响应需求；这些负载超过传统铅酸 UPS 系统的响应速度。面向电网 / eVTOL，高能量密度、快充和 >1,000
              次循环寿命的组合，支撑那些石墨基电芯过去在循环经济性上不足的应用实现经济化部署。
