      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              最强的结构性增长驱动因素就是 EV 普及本身：2025 年，全球每卖出约四辆车就有一辆是电动车，全球 EV 电池需求接近 1,970 GWh，是 2020 年水平的六倍。每新增 1 GWh
              采用哪怕少量硅负极材料的 EV 产能，都会直接扩大 Group14 的可触达市场。中国对石墨的地缘政治控制（全球供应和加工份额 75–95%）是第二个主要顺风：美国《Inflation Reduction
              Act》 的受关注外国实体（FEOC）条款，原本旨在把中国电池材料排除出 $7,500 EV 税收抵免之外，推动美国和欧盟 OEM 认证替代负极供应商。虽然财政部已把中国石墨硬禁令推迟到 2027
              年（中国也临时放松出口管制至 2026 年 11 月）， 供应多元化的战略动机仍然存在，并利好拥有非中国供应链的硅碳负极生产商。AI 设备和可穿戴设备对能量密度的要求提高，
              又给消费电子带来补充顺风；Group14 明确把 AI 设备电力需求称为增长向量。美国 DOE 投资（为华盛顿州 Moses Lake 一座 7,200 mt/yr 硅烷气体工厂提供 $200 million
              奖励，并补充早前 $100 million 补助）降低 Group14 本土制造成本基础， 并增强供应链韧性。约束端，主要技术壁垒是硅在嵌锂过程中的约 300% 体积膨胀，会造成机械应力、电极开裂和容量加速衰减；
              Group14 的 SCC55 通过预锂化骨架架构处理这一问题，但高硅含量电芯仍比石墨主导的同类产品更昂贵、制造难度更高。 OEM 认证周期长达 18–36
              个月，使客户赢单与收入贡献之间存在结构性滞后；汽车领域尤为明显，因为安全和耐久标准要求大量验证。 中国电池制造商使用传统石墨时，相比西方同类厂商保持 30–35% 成本优势，这限制了买方吸收硅溢价的速度。LFP
              化学体系增长 （2025 年超过 EV PACK 出货的 50%）释放的是混合信号：LFP 电芯很少采用硅负极，因此从高镍 NMC 转向 LFP——而高镍 NMC 最能体现硅的密度收益——会部分抵消 EV
              放量顺风。
