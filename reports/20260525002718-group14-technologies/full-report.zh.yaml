      - number: '3.2'
        title: 直接硅负极同行
        blocks:
          - type: paragraph
            body: >
              Sila Nano 是 Group14 最可比的西方对手。Sila 累计融资 $1.3 billion 或更多，2025 年 9 月启用位于华盛顿州 Moses Lake 的工厂，并拿下
              Mercedes-Benz 和 Panasonic Energy 作为具名 EV 锚定客户，2025 年 Q4 开始生产交付。其 Titan Silicon 使用干法纳米复合路线，不同于 Group14
              的化学气相沉积（CVD）方法；Sila 面向需要高硅装载量的汽车电芯制造商，而 Group14 强调可广泛直接导入多种电芯化学体系。到 2026 年中，Sila
              将已在汽车应用中完成商业化工艺去风险——这一里程碑领先于 Group14 自己的 BAM-2 放量。


              Nexeon 背后有 OCI（硅烷原料）和 Panasonic Energy 支持，2024 年 4 月为韩国设施破土动工，目标是 2025–2026 年交付，并与 Panasonic Energy North
              America 签署供货协议，用于 Panasonic 规划中的堪萨斯州 De Soto 工厂 EV 电池生产。Nexeon 的硅氧基（SiOx）化学路线循环稳定性强，但首圈效率低于硅碳复合材料。


              Enovix（NASDAQ: ENVX）报告 FY2025 收入 $31.8 million，同比增长 38%，年末现金 $621 million。其 100% 硅 EZcell 架构面向移动设备、IoT
              和可穿戴设备，而非汽车应用；这限制了它与 Group14 在 EV 电芯制造商项目上的直接正面竞争，但仍会争夺同一批电芯制造商验证带宽。Amprius Technologies 的硅纳米线架构最高达到 450
              Wh/kg，聚焦航空航天、国防和 UAV 市场，这些场景中性能优先于成本。NanoGraf 作为 100% 硅纳米颗粒供应商，于 2026 年 5 月被 Monomyth Materials（改名为
              M2Innovations）收购，不再是独立竞争者。
