      - number: '2.2'
        title: 市场规模——TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >
              分析师对硅负极电池和硅负极材料市场的估计，会随市场边界和方法论显著变化。在最宽口径下，全球锂离子电池市场在 2025 年超过 $150 billion，需求量同比增长约 29%，EV 应用占部署量超过
              70%。硅负极材料子市场（只含材料， 不含成品电池）由 Business Research Insights 及相关来源估计为 2025 年 $450–$655 million，2026 年增至约 $1.15
              billion，并按约 42% CAGR 到 2035 年超过 $20 billion。另一组估算测算的是硅负极电池市场 （包括成品电芯），Fortune Business Insights 给出的 2025
              年数字为 $345 million，2026 年升至 $489 million， 到 2034 年 CAGR 为 49%。估算差距来自纳入口径不同：有些报告计入归因于硅含量的整块电池收入，有些只计入负极材料本身。
              两种视角都确认，到 2030 年代初，市场预期 CAGR 处在高双位数至 50% 中段。Group14 的可服务市场（SAM）是硅碳复合细分市场 （约占 2025 年全部硅负极材料的
              40%），并应用于汽车、消费电子和电网终端市场中 SCC55 性能画像已获认证的场景。 可获取市场（SOM）受当前制造产能约束：Group14 位于韩国 Sangju 的 BAM-3 工厂于 2024 年 9
              月开始生产， 披露年化运行率为 2,000 metric-ton，足以供应约 10 GWh 电池电芯和约 200,000 辆 EV；因此在 Moses Lake BAM-2 扩张带来新增产能前，即便满产，近端
              SOM 也远低于 $200 million。分析机构之间存在互相矛盾的估计， 应按区间边界阅读；高低端相差 3–4×，反映的是 EV 平台硅采用渗透率的真实不确定性。
