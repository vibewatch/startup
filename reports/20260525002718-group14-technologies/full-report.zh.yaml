      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              以当前证据看，三个情景覆盖可信估值区间。乐观情景——估值 $8 billion 至 $10 billion——要求 BAM-2 在 2027 年达到满产、EV
              市场复苏加速北美硅负极采用、硅烷工厂按计划投产。在该情景下，Group14
              将同时控制上游硅烷供应和负极生产，成本位置会明显改善，对中国硅烷进口的敞口也会下降。乐观情景还要求某种形式的收入披露；没有财务证据，公开市场和收购方无法有信心支付溢价倍数。

              基准情景——约 $5 billion 至 $6 billion——反映 Group14 当前轨迹：BAM-3 满负荷运行，BAM-2 在 2026 年部分爬坡，EV
              市场企稳但没有明显复苏，客户多元化后关税压力缓和。基准情景下，Group14 的 Series D 价格大致守住，公司保留在 2027 年或 2028 年发生流动性事件的可选空间。悲观情景——$2 billion
              至 $3 billion——会在 BAM-2 延误再延长 12 个月或更久并迫使 down-round 时出现；或者中国客户的关税损失持续到 2027 年，而 AI
              数据中心补位尚未形成实质规模。悲观情景下，后续投资人会质疑公司能否靠单一运营工厂支撑 $1.76 billion 总资本部署。由于收入和毛利率数据仍为私有，每个情景都只能给方向，不能给精确值。
