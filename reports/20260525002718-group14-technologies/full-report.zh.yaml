      - number: '5.3'
        title: 性能基准、技术差异化与知识产权
        blocks:
          - type: paragraph
            body: >
              Group14 于 2025 年 6 月发布一项基于全球 20+ 客户数据的性能基准：使用 SCC55 的电芯稳定实现超过 1,500 次充电循环，部分应用在 80% 容量保持率下超过 3,000
              次循环。这高于过去认为商业锂离子电池可行所必需的 1,000 次循环门槛。Group14 客户报告的具体性能增益包括 90 秒完成 0-100% 充电（Molicel 类型快充设计），以及相对石墨能量密度提升
              43%。Sionic Energy 使用 SCC55 进行联合测试，在 NMC 83 软包电芯中实现最高 400 Wh/kg 能量密度，同时保持 >1,200 次循环，并在 45°C 下稳定循环。BASF 与
              Group14 联合发布的可直接导入方案（BASF Licity 2698 X F 粘结剂 + SCC55）展示了室温下 >1,000 次循环、45°C 下 >500 次循环，并达到约 4× 石墨容量。

              这些数字主要来自公司或合作伙伴在新闻稿中的披露；公开渠道没有发布经过同行评议的独立电芯测试数据。工程公司 Exponent
              指出，在相同容量下，硅负极电池因能量含量更高，热失控严重程度高于石墨电芯；真实世界老化还可能引入传统电芯中未出现的机械变形失效模式。

              IP 底盘扎实。截至 2026 年 3 月，Group14 在五个主要司法辖区持有 170+ 已授权专利（代表全球电池材料消费量的 >90%）。专利组合同时保护 SCC55 的材料组成（硬碳骨架 +
              纳米硅）和可规模化的 CVD 制造方法。CTO Rick Costantino 是基础材料专利的共同发明人；专利 US11174167B1（Silicon carbon composites comprising
              ultra low Z）是核心样本。Group14 表示，随着采用加速，公司会主动监测并执行其专利资产，原因是担心市场出现模仿尝试。
