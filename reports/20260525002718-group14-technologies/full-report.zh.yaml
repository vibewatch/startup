      - number: '6.2'
        title: 具名客户与有约束力的承购协议
        blocks:
          - type: paragraph
            body: >-
              具名且可独立验证的客户证据集中在四类。第一，Molicel Canada 将 SCC55 认证进 P50B 和 P60B 圆柱电芯，这些电芯已商业出货给无人机、电动工具和 eVTOL 集成商；Archer
              Aviation 的量产 Midnight eVTOL 使用 Molicel 电芯，并在 2025 年 8 月完成 88 km 飞行，确认其在航空级应用中的真实产品部署。第二，CustomCells
