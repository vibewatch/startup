  - id: FE001
    title: SCC55® 产品架构栈
    type: stack
    layout: standard
    summary: 从原始投入到商业负极粉体，构成 SCC55 的材料层
    data:
      layers:
        - label: 原始硅来源
          detail: 冶金级硅（地壳丰富）；通过自研低能耗工艺转化为硅烷（SiH₄）。供应风险低。
        - label: 硅烷气（SiH₄）
          detail: CVD 前驱体；自燃气体，需要专门处理。来自德国工厂；Moses Lake 美国工厂计划 7,200 mt/yr。
        - label: 有机碳前驱体
          detail: 糖类、酚醛或聚合物基原料；经热解形成多孔硬碳。成本低，全球供应广。
        - label: 多孔硬碳骨架
          detail: 可调微孔 / 介孔网络为硅体积膨胀提供空隙，防止颗粒破裂。核心专利架构。
        - label: CVD 纳米硅沉积
          detail: 非晶纳米 Si 在高温下通过 SiH₄ CVD 均匀灌入骨架孔隙。170+ 项专利保护成分和工艺。
        - label: SCC55® 硅碳复合材料
          detail: 最终黑色粉末负极材料；在锂离子浆料中可直接替代石墨。兼容 NMC、LFP、LMFP、高镍和固态化学体系。
    approximationNotes: 层级顺序反映制造流程；相对比例为定性描述。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
