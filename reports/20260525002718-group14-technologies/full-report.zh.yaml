  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资背景与估值锚点
        blocks:
          - type: paragraph
            body: >-
              Group14 在 2025 年 8 月的 Series D 是最近一次为私募市场定价的事件：融资 $463 million，二级市场分析师估算投后估值约 $5.27
              billion。该数字尚未获公司确认——Reuters 信源只说新估值高于 2022 年超过 $1 billion 的价格。公开信息与投资人承销所需信息之间仍有很大缺口：Group14
              不披露年收入、毛利率或股权结构条款。在这种环境下，正确纪律是把分析师估算值当作锚点，而不是已确认的公允价值；把它作为情景分析起点，而不是最终结论。

              Group14 的投资逻辑建立在一组范围不宽但可以验证的事实之上：BAM-3 这座韩国合资工厂已达到 10 GWh 年产能，并在 2024 年 9 月开始商业出货 SCC55，证明技术可以在量产规模跑通。公司拥有
              150 多家客户，覆盖全球锂离子电池产量约 95%。其专利组合在全球已授权超过 170 项。这些不是纸面说法，而是运营层面的证明，把 Group14
              与仍处纯商业化前阶段的电池材料创业公司区分开来。反面证据同样扎实：华盛顿州 Moses Lake 的 BAM-2 至少两次推迟投产目标，并引发 2025 年 7 月美国裁员以及 2026 年 3
              月进一步临时停薪休假。没有公开收入数据，五十亿美元级估值就更多悬在执行信心上，而不是财务证据上。
