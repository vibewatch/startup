      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Group14 位于 Moses Lake 的 BAM-2 设施于 2024 年 10 月根据 NEPA（DOE/EA-2220）获得 DOE 的无重大影响认定（Finding of No Significant
              Impact, FONSI），为 $100M BIL 补助扫清障碍。EA 评估了空气质量、用水、废弃物管理、就业、环境正义和温室气体排放，并认定没有重大不利环境影响。持续遵守 Washington State
              Department of Ecology 许可、空气质量标准，以及硅烷气体（自燃材料）相关的联邦 OSHA PSM 规则，是长期义务——任何许可违规都可能使运营停摆。

              OBBB Act（2025 年 7 月 4 日签署）让立法风险加速。该法引入 FEOC「实质援助」取消资格规则，对 2025 年 7 月 4 日之后的纳税年度生效；如果 Group14
              从其供应链中的受禁外国实体伙伴获得实质援助，将无法取得 45X 抵免，并对夸大成本比率申报设立准确性相关罚则。Group14 的韩国 JV（现已全资拥有）以及任何中国硅烷或前驱体采购，都必须围绕 FEOC
              合规做细致审计。电池材料 45X 抵免期限到 2033 年 12 月 31 日，长于风电 / 太阳能，但从 2031 年开始抵免金额下降。

              IP 和专利风险重大，但目前处于可管理状态。截至 2026 年 3 月，Group14 全球已授权专利事项超过 170 项，覆盖 SCC55 组成和商业规模制造工艺，横跨五个主要司法辖区，代表全球电池材料消费量的
              90% 以上。公司公开警告，市场上模仿其路线的努力增加，并正在主动监测和执法。尚未发现针对 Group14 的进行中诉讼。针对中国生产商的专利执法成本高、周期长，且在中国法院往往效果有限。

              出口管制风险：美国商务部在 2024 年底收紧了先进电池材料和技术管制。Group14 的 SK（韩国）JV 架构从 CFIUS 角度较有利，因为韩国是美国盟友；但任何中国共同投资或技术转让都会受到 CFIUS
              审查，并可能触发强制剥离。
