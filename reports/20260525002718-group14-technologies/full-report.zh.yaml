companyProfile:
  summary: >
    Group14 Technologies 是一家位于华盛顿州 Woodinville 的电池材料公司，2015 年成立，核心任务是商业化 SCC55®——一种硅碳复合负极材料，可部分或全部替代锂离子电池中的传统石墨。公司把
    SCC55 定位为可直接导入现有电芯产线的材料，并声称相比纯石墨负极，它能显著提升能量密度、充电速度和循环寿命。Group14 已融资超过 $1.1B，战略投资者包括 SK、Porsche、ATL、Microsoft、OMERS 和
    Decarbonization Partners；商业制造版图已覆盖 Woodinville、Moses Lake，以及位于韩国 Sangju 的全资 BAM-3 工厂。核心投资分歧在于：真实客户牵引力和 BAM-3 量产，能否抵消
    BAM-2 反复延误、政策敞口和极少公开财务披露带来的折价。
