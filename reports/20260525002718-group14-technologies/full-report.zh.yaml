      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Group14 通过六轮已识别的定价股权融资，加上两项重要美国能源部奖励，累计获得超过 $1 billion 股权资金。融资轨迹显示，公司有意从风险投资支持的材料初创公司，推进到基础设施规模制造商。


              Series A（$18 million，2019 年 11 月）由 OVP Venture Partners 和 ATL（Amperex Technology
              Limited）共同领投，为公司建立了第一段与大型电芯制造商的关系。Series B（$17 million，2020 年 12 月）由 SK Materials（现 SK Specialty）领投，把
              Group14 连接到 SK Group 的韩国化学品业务，也预示了后来的 BAM-3 合资公司。Series C 分两笔完成：2022 年 5 月融资 $400 million（Porsche AG
              领投，ATL 和 BASF 参投），2022 年 12 月融资 $214 million（Microsoft Climate Innovation Fund 领投，Lightrock、Oman IA、Moore
              Strategic Ventures 和 Molicel 参投）。 2022 年 10 月的 DOE Bipartisan Infrastructure Law $100 million 补助，验证了
              Group14 的 Moses Lake 扩张计划。


              ShawKwei and Partners 于 2023 年 9 月完成 $34.3 million 私募股权共同投资，在全球电池市场走软期间提供过桥资本。 2024 年 9 月，DOE 宣布为 Moses
              Lake 本土硅烷制造设施提供最高 $200 million 的追加奖励。 Series D（$463 million，2025 年 8 月）由 SK Inc.（SK Materials 母公司）领投；SK
              Inc. 同时把其在韩国 BAM-3 合资公司的 75% 股权卖回 Group14。其他 Series D 共同投资者包括 Porsche Investments
              Management、ATL、OMERS、Decarbonization Partners、Lightrock 和 Microsoft。


              Group14 尚未公开披露收入、EBITDA 或正式估值。公司仍为私营状态，也未公开给出 IPO 时间表。
