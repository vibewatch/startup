      - number: '8.6'
        title: 建议、论点失效触发器与尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至 2026-05-25，对 Group14 最可辩护的判断是跟踪，置信度中等、风险评级高、估值立场公允。账本正面确实存在：BAM-3 已商业化生产、150 多家客户、战略投资人背书、强专利组合，以及
              $1.76 billion 总资本部署。账本负面也很具体：BAM-2 两次延期，美国员工在 2025 年 7 月被裁，2026 年 3 月又出现进一步临时停薪休假，关税冲击了占全球电池市场 70% 至 80%
              的中国需求，而且 Group14 从未披露收入。这个组合使买入建议站不住脚，因为价格精度和下行保护都还没有解决。

              只有在 BAM-2 完成全面投产、公司披露收入或合约 backlog，并出现可信 IPO 或二级交易时间表时，建议才会提升为买入。如果 BAM-2 延误触发低于 Series D 标记的
              down-round，或中国关税敞口导致客户流失集中到足以威胁 BAM-3 利用率，建议将恶化为回避。当前跟踪公司的投资人应把尽调集中在四个变量上：BAM-2 投产轨迹、任何收入或 backlog
              披露、Series D 后股权结构中的优先权条款，以及 AI
              数据中心渠道产出的是已签承购协议，还是停留在意向表达。今天，这些变量没有一个公开可见。在它们出现之前，正确姿态是把公司放在纪律化观察名单上，而不是在缺少这些尽调答案的情况下按当前估算价位入场。
