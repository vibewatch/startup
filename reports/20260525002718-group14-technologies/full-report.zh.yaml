      - number: '8.2'
        title: 融资历史与资本结构背景
        blocks:
          - type: paragraph
            body: >-
              Group14 已经搭出硅电池材料赛道里规模最大的私募资本栈之一。融资时间线从 2020 年 SK Materials 的 $17 million Series B 开始，到 2022 年由 Porsche AG
              领投的 $614 million Series C 及随后 $214 million 延展，再到 2025 年 8 月由 SK Inc. 领投的 $463 million Series D。已披露股权融资总额超过
              $1 billion。除股权融资外，美国能源部在 2022 年根据《两党基础设施法》为 Moses Lake 的 BAM-2 负极工厂承诺 $100 million，并在 2024 年 9 月选择 Group14
              给予最高 $200 million，用于同在华盛顿州 Moses Lake 建设年产 7,200 公吨的硅烷气体工厂。公私资本合计部署超过 $1.76
              billion，这一规模显著缩小了可进入的投资人范围，也抬高了退出倍数门槛。

              Series D 结构里有一笔战略意义很强的交易：Group14 在交易中从 SK Inc. 手中取得 BAM-3 的 100% 所有权，把合资工厂变成全资资产。如果 BAM-3 能盈利，这一步会改善
              Group14 的长期经济性；但它也拿掉了一个分担资本的伙伴，把制造风险集中到 Group14 资产负债表上。SEC Form D 记录确认 Group14 在 Delaware 注册以及 2021
              年股权发行结构，为融资时间线提供监管层面的旁证。National Energy Technology Laboratory 编制的 DOE EA-2220 环境评估进一步确认了 BAM-2 拨款的范围和条款。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV041
              - CV042
              - CV043
              - CV046
      - number: '8.3'
        title: 可比公司组与估值基准
        blocks:
          - type: paragraph
            body: >-
              Group14 的 $5.27 billion 分析师估算值处在三层可比版图的高端。在公开上市、尚无收入的电池技术公司中，截至 2026 年 5 月，QuantumScape 市值约 $5.04
              billion，企业价值为 $4.21 billion，报告收入为零。这个比较说明，公开市场会给拥有可信知识产权的电池创新支付技术期权溢价，但 QuantumScape 还没有达到 Group14
              的商业化生产水平。在早期商业化上市可比公司中，截至 2026 年中，Enovix Corporation 企业价值约 $1.47 billion，对应过去十二个月收入约 $34 million，意味着
              EV/Sales 倍数约 42 倍——这可以作为收入透明的商业阶段硅电池公司实际交易位置的参照。

              私募可比公司中，Sila Nanotechnologies 在 2021 年据报达到 $3.3 billion 估值，并在 2024 年完成 $375 million Series G，用于扩大美国生产。Sila
              随后在 2025 年开出第一座美国工厂，加大了 Group14 BAM-2 爬坡压力。White & Case 统计，2023 年电池储能 M&A 共 227 笔、总额 $24.1
              billion，为更广泛板块里的战略收购方估值提供底线参照。放在这组可比样本中，Group14 的 $5.27 billion 估算值在 BAM-3 运营证明支撑下看起来合理；但如果收入仍不披露，相比
              Enovix 的 $1.47 billion 企业价值就显得偏紧。可比公司组不是精确的公允价值工具，而是一套纪律框架，用来给可接受的入场价格划出上下限。
