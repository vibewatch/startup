  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              硅负极材料吸引了三层竞争者。前沿层是西方深科技挑战者——Group14 Technologies、Sila Nano、Nexeon、Enovix 和
              Amprius——各自用不同化学路线和制造策略，试图在锂离子电芯中替代石墨。亚洲既有厂商由 BTR New Energy（约 70% 硅负极市场份额）和 Shin-Etsu Chemical（约 22% SiO
              路线份额）领跑，能以规模和下降成本服务中国和日本 OEM 生态。第三层是替代技术：固态电池、Samsung SDI 等贴近 OEM 的电芯制造商内部开发的硅负极项目，以及近期被整合的小型利基玩家（NanoGraf
              于 2026 年 5 月被 Monomyth/M2Innovations 收购；OneD SiNAnode 于 2025 年关闭试点工厂）。Group14 在西方最直接与 Sila
              争夺汽车电芯制造商订单，在亚洲则与 BTR 和 Shin-Etsu 争夺批量供货协议。独立硅负极供应商确实有竞争窗口，但时间有限：Group14
              必须在亚洲既有厂商达到成本平价之前，或电芯制造商把内部硅项目做大之前，把 150+ 个客户测试关系转化为生产量。公司累计融资 $1.11
              billion，且拥有横跨两大洲的制造版图，使其跻身资源最充足的西方竞争者之列；但 BAM-2 执行风险，以及缺少具名汽车 OEM 量产合同，仍是投资者评估竞争耐久性时必须盯住的事项。
