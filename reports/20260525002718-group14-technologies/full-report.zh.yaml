      - number: '2.3'
        title: 买方与细分结构
        blocks:
          - type: paragraph
            body: >
              硅负极材料沿分层供应链流动：Group14 把 SCC55 卖给电池电芯制造商（Tier-1 供应商），后者把材料整合进电芯， 再销售给电池 PACK 集成商，并直接供应三大终端市场的 OEM。EV
              细分市场是主导需求驱动因素，估计占 2025 年硅负极材料消费的 65–80%。电池电芯制造商——CATL、Samsung SDI、LG Energy Solution、Panasonic、ATL 和 SK
              Innovation——是直接买方； 它们的采购决策由 OEM 电池规格、能量密度要求、续航目标和总拥有成本模型驱动。消费电子是第二大需求细分 （Fortune Business Insights 数据显示，约占
              2025 年硅负极电池市场收入的 35%），需求来自智能手机和可穿戴设备 OEM——主要在亚太——它们追求更长续航、更快充电和物理尺寸更小的电芯。该渠道的付款方是消费电子 OEM （例如
              Samsung、Apple 通过 Foxconn/ATL 供应链），终端用户则是个人设备消费者。电网和固定式储能是新兴细分， 约占 2025 年硅负极材料需求的 15%；该市场偏好 LFP 化学体系，而 LFP
              目前硅含量极低，因此硅碳复合材料在这里的机会， 短期小于 EV 和消费电子渠道。国防和 eVTOL 应用规模小，但战略意义高，Group14 已披露发货；付款方通常是政府项目办公室 或早期飞机
              OEM，主要采用触发因素是单位重量能量密度，而非成本。直接买方组织内部，预算所有权通常在电池工程 VP 或先进材料采购层级；Group14 必须赢得规格导入，而这类决定通常在商业放量前 18–36 个月作出。
