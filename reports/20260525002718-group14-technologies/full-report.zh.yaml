      - number: '5.2'
        title: 制造平台、工厂网络与规模
        blocks:
          - type: paragraph
            body: >
              Group14 围绕其所谓 Applied Innovation 框架搭建制造平台，也就是同时投入产品性能和可重复、模块化的工艺工程。核心制造架构是电池活性材料（Battery Active Materials,
              BAM）工厂：一个标准化、模块化的生产单元，每个单元年产 2,000 公吨 SCC55（约对应 10 GWh 电芯产能）。工厂设计成靠近客户选址、使用低碳能源，并可快速复制，无需重新工程设计。

              当前网络由三座工厂组成。BAM-1 位于 Woodinville, WA，自 2021 年以来以吨级规模制造 SCC55，并确立了后续基地复制的工艺基线。BAM-3 位于韩国 Sangju，2021 年作为与
              SK Inc. 的 JV 设立；Group14 于 2025 年 8 月从 SK 手中收购 100% 所有权，并在 2026 年 3 月开始 EV 规模生产。BAM-3 年产 2,000 mt，覆盖约 10
              GWh 产能，战略上与全球最大电池制造商集群共址。BAM-2 位于 Moses Lake, WA，正在建设中，初始设计为一个 2,000 mt 模块（10 GWh），整体场地规划为六个模块、合计 12,000
              mt/year。BAM-2 原定 Q4 2024 启动，但已延期超过 12 个月；截至 2026 年 5 月，公司网站显示预期 2026 年开始生产。

              所有工厂背后都有一条硅烷供应链。硅烷目前在全球采购，德国 Spreetal 工厂锁定欧洲供应。美国 DOE 于 2024 年 9 月授予 Group14 最高 $200M，用于在 Moses Lake
              共址建设一座 7,200 mt/year 硅烷工厂——足以服务 BAM-2，并把剩余产能卖给其他硅负极公司。该硅烷工厂使用 Group14 自有 IP，相比传统 Siemens 工艺硅烷，可降低资本和能耗强度。

              反向信息：The Elec 2023 年报道援引知情人士称，韩国 JV 工厂从未连续运行，工艺频繁停下调整，且 SK 提供的资金已经耗尽。SK Materials
              对此说法提出异议，称样品正在制造，客户测试后可实现量产。2025 年 8 月收购后，Group14 获得完全控制权；到 2026 年 3 月，商业交付已得到确认。BAM-2 在 2025 年 8 月 D
              轮公告中披露延期超过一年，原因归于关税不确定性和清洁技术宏观逆风。
