      - number: '4.3'
        title: 制造经济性与资本强度
        blocks:
          - type: paragraph
            body: >
              Group14 的商业模式本质上资本密集：基于 BAM-2 披露的财务数据（$100M DOE + $223M Group14 = 两模块设计 $323M+），每个年产 2,000 ton 的 BAM
