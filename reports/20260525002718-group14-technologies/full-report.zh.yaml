      - number: '7.4'
        title: 供应链与合作伙伴集中风险
        blocks:
          - type: paragraph
            body: >
              硅烷气体是 Group14 SCC55 制造工艺的关键上游投入。直到 2025 年 1 月，REC Silicon 的 Moses Lake 工厂都是美国唯一硅烷气体生产商，也是 Group14
              美国制造计划的关键锚点。2025 年 1 月 6 日，REC Silicon 宣布停止 Moses Lake 运营并裁员 224 人——Group14 CEO Rick Luebbe
              公开称这对电池行业来说「有点出乎意料」。根因是 Hanwha Solutions（截至 2022 年 4 月为 REC 最大股东）锁定了 Moses Lake
              大部分多晶硅产出用于其太阳能板业务，留给电池级硅烷生产的硅不足。

              Group14 现在依赖 REC Silicon 更小的 Montana 工厂来满足近期硅烷供应，但其产能不足以支撑完整 BAM-2 规模。DOE $200M 硅烷工厂奖励（2024 年 9 月）将为 Moses
              Lake 一座 7,200 公吨 / 年专用硅烷工厂提供资金，但 CEO Luebbe 指出建设大约需要三年——也就是说，硅烷供应至少到 2027 年仍是瓶颈风险。

              客户兼投资方一侧的合作伙伴集中度很明显：SK（韩国）、Porsche、ATL、Microsoft 和 OMERS 共同领投 D 轮，并代表最具战略重要性的客户关系。SK 在 BAM-3 的 75% 股权已于
              2025 年 8 月被买断，消除了 JV 治理风险，但也把财务暴露集中到一段关系中。Porsche 投资带来客户集中风险：如果它下调 EV 产量目标或改变电池化学策略，Group14 会受影响。

              Washington 的 Moses Lake 地域集中也带来社区和政治风险。多轮裁员 / 停工已经拉紧社区关系，并削弱公司在当地政府伙伴面前的长期可信度；当地原本期待公司快速创造数百个长期岗位。
