        - 索取商业规模下的独立循环寿命数据；核验 BASF 验证数据
      - - 汽车 OEM 电池认证周期为 18–36 个月
        - 负向
        - 约束
        - 持续
        - 拖慢新获认证客户的收入转化；项目取消风险高
        - 按阶段梳理 Group14 当前客户认证管线
      - - 2025 年 LFP 化学体系在 EV 电池包出货中增至 >50%；LFP 通常不使用硅
