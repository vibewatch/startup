      - number: '7.5'
        title: 执行、财务与人力风险
        blocks:
          - type: paragraph
            body: >
              Group14 是资本密集型硬件制造商，而美国建设成本在该行业比全球平均水平高 9-34%。公司通过 D 轮（2025 年 8 月）累计获得 $1.11B 股权融资，财务资源充足，但资本部署取决于 BAM-2
              调试，而该项目已多次延期。联邦资金依赖是结构性风险：DOE 补助合计 $300M（BAM-2 $100M、硅烷 $200M），占项目融资的显著比例，并受 NEPA 合规、本土内容和其他绩效里程碑约束。

              人力风险升高。两轮美国人力缩减——2025 年 7 月未披露规模的裁员，以及 2026 年 1 月停工——影响了士气、专业工艺工程师留存，以及 BAM-2 高度自动化连续工艺制造的调试时间线。裁员前全球员工数约
              400 人。第三轮人力动作可能导致调试和运营该设施所需的专业人才永久流失。

              针对电池电极活性材料的 Section 45X 生产税收抵免，是 Group14 美国生产经济性的关键组成部分；这些抵免至少到 2033 年仍适用于电池组件，但 OBBB Act 的 FEOC
              限制带来合规复杂性。如果 Group14 供应链中的任何外国前驱体被追溯到受禁外国实体，抵免可能被追溯取消。2025 年 Q1 清洁能源投资环境中出现 $6.9B
              项目取消——创下季度最高值——说明全行业资本市场压力是真实的。
