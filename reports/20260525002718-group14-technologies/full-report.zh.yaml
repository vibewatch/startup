          - type: paragraph
            body: >
              2025 年 8 月完成 $463 million 融资后，Group14 短期流动性较充足。D 轮资金主要投向四件事：（1）完成并投产 Moses Lake 的 BAM-2；（2）向 SK 支付 BAM-3
