        - BAM-3 正常运行；BAM-2 到 mid-2026 局部爬坡；EV 市场企稳；关税缓和；收入仍未披露但订单储备增长。
        - $5B-$6B 与 Series D 轮锚点方向一致；D 轮进入的投资者可以维持持有姿态，等待 2027-2028 流动性事件。
