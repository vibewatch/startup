      - number: '3.3'
        title: 亚洲既有负极供应商
        blocks:
          - type: paragraph
            body: >
              BTR New Energy 总部位于深圳，以估计 70% 份额主导硅负极材料市场，主要向 CATL、BYD 和韩国电芯制造商销售。BTR FY2025 合并收入达到 RMB 16.98 billion（约
              $2.35 billion），同比增长 19.3%，由石墨和硅石墨复合负极出货驱动。规模带来采购杠杆，西方纯硅负极供应商目前还无法匹配：BTR
              可以把硅负极定价打包进石墨供应谈判，推动电芯制造商向单一既有供应商集中。


              Shin-Etsu Chemical（日本）通过其硅一氧化物（SiO）路线技术，估计持有 22% 硅负极材料份额，并已进入日本和韩国 OEM 供应链认证。Daejoo Electronic
              Materials（韩国）约持有 7% 硅负极市场，向 LG Energy Solution 和 SK On 供应 SiOx 基材料。Samsung SDI 内部开发的 Silicon Carbon
              Nano（SCN）项目，目标是降低或消除下一代 EV 电芯对第三方硅负极供应商的依赖，并可能为其他一体化电芯制造商树立先例。CATL 和 BYD
              也有已记录的内部硅负极开发项目，同样给所有第三方供应商制造需求不确定性。这些既有厂商不是靠纯化学性能创新压过 Group14，而是靠采购规模、一体化供应链、稳固 OEM
              关系，以及显著更低的劳动力和原材料成本竞争。
