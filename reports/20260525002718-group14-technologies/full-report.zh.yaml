      - 角色
      - 依赖
      - 关键风险
    rows:
      - - 冶金级硅（原料）
        - 硅烷气生产的硅原料
        - 全球储量充足；由砂或矿石还原 SiO₂
        - 供应风险很小；硅是地壳丰度高的元素
      - - 硅烷气（SiH₄）生产
        - 自燃性硅气；CVD 纳米 Si 沉积前驱体
        - 目前全球采购；中国主导供应（约为最大生产方）
        - 硅烷供应集中在中国；自燃品要求安全处理
      - - 有机前驱体碳化 / 热解
        - 用糖、酚醛或聚合物前驱体制备多孔硬碳支架
        - 低成本、广泛可得的有机原料
        - 规模化时孔结构一致性；前驱体配方质量控制
      - - 向支架沉积 CVD 硅
        - 在受控温度 / 气氛下注入纳米 Si；核心制造步骤
        - 硅烷气供应；自研反应器设计；170+ 专利保护工艺
        - CVD 吞吐量和良率直接决定生产成本；2023 年韩国 JV 曾记录工艺稳定性问题
      - - 下游处理（研磨、分级、涂覆）
        - 按客户规格产出成品负极粉体
        - 电芯制造商浆料兼容性；粒径分布控制
        - 批次一致性会影响电芯级循环寿命
      - - BAM 模块化工厂
        - 可复制的即插即用设施，容纳 CVD 反应器和配套设备
        - 电力供应（偏好水电）；硅烷进料；本地劳动力
        - 建设和投产时间表风险（BAM-2 延迟 >12 个月）
      - - 电池电芯制造（客户）
        - 客户将 SCC55 集成进负极浆料；无需设备改造
        - 标准锂离子产线；只需调整浆料配方
        - 客户认证周期（EV 为 6-8 个月）；电芯级集成风险
      - - 电池管理系统（客户）
        - 管理硅化学体系的充电协议；可能需要参数调校
        - 电芯制造商固件；OEM BMS 规格
        - 硅负极充电协议不同于石墨；BMS 校准错误会降低循环寿命
