      - number: '1.5'
        title: 逆风与不利事件
        blocks:
          - type: paragraph
            body: >
              从 2025 年中开始，Group14 的放大路径遭遇多重交织逆风。第一，美国参议院在 2025 年中作为更广泛预算协调立法的一部分， 取消 $7,500 联邦 EV 税收抵免，削弱了美国本土 EV
              电池供应链的近端需求确定性。第二，美国对华贸易政策带来的关税不确定性， 进一步放大这一担忧；中国电池制造商估计占全球锂离子产能的 70-80%，是 Group14 现有和潜在客户群的重要部分。


              2025 年 7 月，Group14 实施一轮未披露规模的美国裁员，理由是联邦政策不确定性。第三方就业数据库显示， 裁员后员工数从约 400 人降至约 260-270 人。2026 年 1 月，BAM-2
              设施接近但尚未达到调试准备状态时， 公司让一部分 Moses Lake 施工人员临时休假。


              BAM-2 施工时间表反复滑坡——从 2024 年末到 2026 年初，至少四次公开修订时间线——给 Moses Lake 园区带来执行风险，而该园区仍是 Group14 在美国的主要生产资产。与此同时，直接
              SiC 负极竞争对手 Sila Nanotechnologies 于 2025 年 9 月投产自己的 Moses Lake 生产设施，加剧了本地和产品层面的竞争。
