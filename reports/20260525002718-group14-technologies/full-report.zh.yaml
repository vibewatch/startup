      - number: '4.6'
        title: 财务缺口、风险与结论
        blocks:
          - type: paragraph
            body: >
              Group14 是一家资本开支极重、尚未盈利的先进材料制造商，但在同类公司里，它的 IP 和客户覆盖面都处于强势位置。财务叙事不靠经营现金流驱动，而靠资本部署和产能爬坡：累计融资
              $1.1B+、两座美国工厂、一座韩国工厂（现已全资拥有），再加上一项推进中的德国硅烷业务，共同构成一块仍在建设中的重资产底盘。收入约 $39M，相对于这块资本底盘，收入 / 资本比低于
              4%。这符合硬件规模化制造在当前阶段的特征，但也是承销判断中的关键风险。

              反向信号包括：BAM-2 已三次推迟投产（Q4 2024 → Q2 2025 → 2026）；2025-2026 年美国两轮裁员 / 停工；数据中心争夺电力，压缩 Washington State
              新增供给；DOE $200M 硅烷补助可能被撤销；关税导致中国需求不足。制造重心转向韩国能部分对冲关税风险，但也把地缘暴露集中到另一司法辖区。

              财务尽调的主要卡点是：（a）没有公开毛利率或单位成本数据；（b）公开资料无法量化烧钱速度和现金跑道；（c）合同价格和 take-or-pay 条款未披露；（d）BAM-2
              调试成本超支未知；（e）硅烷补助状态未定。这些缺口会直接影响任何高于 $1B C 轮底价的估值承销。
