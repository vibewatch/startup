      - number: '2.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 结构性石墨供应链风险形成持久顺风
            body: >
              中国控制全球天然石墨加工和电池级石墨供应的 75–95%。即便 2027 年才延迟实施，美国 IRA FEOC 条款也释放出明确信号： 美国和欧盟 OEM 长期必须认证非中国负极替代品。Group14
              以美国总部、韩国制造和 DOE 补贴生产组合，直接承接这一动机， 在纯产品性能之外提供更持久的竞争护城河。
            calloutType: strength
            claimRefs:
              - CM025
              - CM031
          - type: callout
            title: LFP 化学体系转向压缩近端 EV SAM
            body: >
              2025 年，LFP 电池化学体系已超过 EV PACK 出货量的 50%，并在价格敏感的大众市场 EV 细分中增长最快。LFP 电芯的负极通常不含硅； 硅的密度收益主要适用于高镍 NMC 配置。如果 EV
              OEM 平台在成本压力和中国供应商优势驱动下继续转向 LFP，Group14 在 EV 内部的可触达市场将被结构性收窄，只剩高端 OEM 层级和能量密度重于成本的市场。
            calloutType: risk
            claimRefs:
              - CM033
              - CM034
          - type: callout
            title: 保留互相矛盾的市场规模估计——读者应使用区间
            body: >
              硅负极市场规模估算相差 3–4×，取决于分析师计入成品电芯收入、只计入负极材料输入成本，还是计入整个硅负极复合材料市场。 Fortune Business Insights 估计 2025 年硅负极电池市场为
              $345.7 million；Custom Market Insights 对同一时期的估计为 $1.2 billion。两个数字并非谁客观错误——它们使用的边界条件不同。投资者和战略团队应使用低 / 基准 /
              高区间， 而非单点估计，并用 Group14 披露的制造产能做自下而上的供给侧校验，判断近端 SOM。
            calloutType: insight
