  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Group14 的可触达市场，是全球电池级硅碳复合负极材料供应——这只是更大锂离子电池负极材料市场中的较窄切片； 截至 2025 年，后者仍由天然和人造石墨主导（份额 >95%）。公司核心产品 SCC55
              是一种骨架型硅碳复合材料， 电池电芯制造商采购后，可作为直接导入的前驱材料，在锂离子电芯中替代或补充石墨负极浆料。纳入的支出包括 OEM
              采购硅基负极材料，并将其整合进圆柱、方形和软包电芯，用于电动汽车、消费电子和固定式储能。排除的支出包括 天然石墨、人造石墨、正极材料（NMC、LFP、NCA）、电解液、隔膜、电芯组装、PACK
              集成和电池管理电子件。 相邻市场包括硅氧（SiOx/SiO）负极材料；2025 年，硅氧约占全部硅负极材料产量的 60%，硅碳复合材料占余下 40%，Group14
              竞争的是复合材料细分市场。现状替代品是电池级天然和人造石墨，OEM 主要从中国采购 （全球加工份额 75–95%），并在 2025 年绝大多数锂离子电芯中继续使用。市场边界有意限定在电芯化学输入层的硅负极材料；
              Group14 不销售成品电芯或 PACK，因此电池系统集成商、模组组装商和 OEM 位于该市场的需求侧，而非市场内部。
              相邻领域还包括固态电解质开发（硅负极也在其中接受评估）和先进正极材料市场，但这些相邻领域尚未为 Group14 贡献收入，因此排除在基础规模测算之外。
