              Elec）称，韩国 JV 工厂从未连续运行，工艺反复停摆且 SK 资金已耗尽——尽管 SK 对该说法提出异议。BAM-3 此后已达到商业交付状态（2026 年 3 月），但投资人仍应追问 BAM-2
              调试进度、当前良率和资本开支需求，以缩小主要美国资产的资金到收入缺口。
