            body: >-
              最强的短期需求信号来自已在市场中的量产确认产品。Molicel 的 P50B 和 P60B 电芯是商业 SKU，正出货给无人机、电动工具和 eVTOL 集成商。Archer Aviation 的量产
              Midnight eVTOL 使用这些电芯，其 2025 年 8 月 88 km 飞行测试展示了认证级条件下的真实硅负极性能。ATL 的智能手机部署——通过 Vivo 手机从 2 M 台增加到 20 M+
              台——在有意义的商业体量上给出消费电子拉动信号。BASF 2025 年 5 月的 Licity 2698 X F 粘结剂合作提供可直接导入的硅负极方案，简化 OEM 认证，并扩大 Group14
              在以石墨为中心的电芯制造商中的可服务客户集。Sionic Energy 2025 年使用 SCC55 和 Rapid Integration Silicon Platform 做到 400 Wh/kg
              演示，为广泛 EV 应用提供证据点；在这些应用中，能量密度可获得溢价，EV 客户验证目标为 2026 年。StoreDot 通过 Group14 验证的 0-80% 10 分钟充电 XFC
              路线图，从车队充电网络运营商和高端 EV OEM 拉动需求。1 吨 SCC55 可替代约 5 吨石墨，这一体积效率优势强化了电池制造商降低石墨依赖时的价值主张。2024 年 6 月承购组合（$300 M+、5
