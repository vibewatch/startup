      - - 中国电池厂商成本优势：电池包价格比美国 / 欧盟低约 30–35%
        - 负向
        - 约束
        - 持续
        - 将可服务市场压缩到高端 OEM 层级；硅溢价拉大成本差距
        - 评估硅负极 NMC 电芯与石墨 LFP 的总成本差；预测盈亏平衡点
