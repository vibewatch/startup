              的增量成本（剩余施工、调试、首批生产营运资本）将消耗 D 轮股权资金。

              潜在的 DOE $200M 硅烷补助若最终落地，将抵消 Moses Lake 硅烷工厂的资本开支，并降低该项目的股权出资需求。如果补助被撤销或延迟，Group14
              就需要用自有资产负债表为硅烷设施出资，或再融资。考虑到平台资本开支很重、运营模型尚未盈利，Group14 大概率需要在现金流打平前完成 E 轮或项目融资；具体时间取决于 BAM-2 产能爬坡速度、实际吨价，以及
