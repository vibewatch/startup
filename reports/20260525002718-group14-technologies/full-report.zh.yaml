        - 按季度跟踪 EV 电池需求 GWh 增长；监测每 kWh 硅含量
      - - 中国石墨地缘政治风险：中国控制全球 75–95% 加工环节
        - 正向
        - 驱动
        - 2025–2027
        - 美国 / 欧盟 OEM 有动力认证非中国负极供应商；IRA FEOC 条款适用
        - 监测 IRA FEOC 执行时间表；确认 Group14 美国材料符合非 FEOC 资格
      - - IRA 石墨 FEOC 禁令被美国财政部推迟至 2027 年
        - 混合
        - 约束 / 驱动
        - 2025–2027
        - 降低马上认证的紧迫性，但保留长期战略激励
        - 确认 Group14 美国投产时间线与 2027 年 FEOC 执行日期的匹配度
      - - AI 设备能耗需求：AI PC、智能眼镜、可穿戴设备需要更高密度电芯
        - 正向
        - 驱动
        - 2025–2026
        - 在智能手机之外打开新的消费电子终端市场；Group14 提到 AI 设备需求
        - 量化 AI 设备电池规格要求；跟踪 Samsung SDI 和 ATL 采用信号
      - - DOE 投资：$200M 硅烷工厂奖励 + 此前美国 BAM 工厂 $100M 拨款
        - 正向
        - 驱动
        - 2024–2026
        - 补贴 Group14 美国制造成本基础；降低硅烷供应链风险
        - 确认 DOE 奖励拨付条件和里程碑；监测 Moses Lake 施工
      - - 硅体积膨胀（嵌锂时约 300%）和 SEI 不稳定
        - 负向
