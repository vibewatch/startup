      - number: '7.6'
        title: 技术与竞争风险
        blocks:
          - type: paragraph
            body: >
              硅负极技术历史上一直受困于快速容量衰减，因为硅在嵌锂过程中会发生体积膨胀（最高 300%），导致机械断裂和电极失效。Group14 的 SCC55 通过带内部空隙的工程化碳骨架处理这个问题。公司公开称，截至
              2025 年 6 月，SCC55 在 20+ 客户数据集中达到 1,500+ 次充电循环，部分应用达到 3,000+ 次循环，重设了此前 1,000
              次循环基准。这是公司披露的里程碑；长期汽车工况的独立验证仍是尽调缺口。

              Sila Nanotechnologies 拥有 250+ 专利，Moses Lake 工厂正为 2025-2026 年生产调试，是主要的国内 IP 和市场竞争对手。两家公司正在争夺 OEM
              认证名额，而这些名额每个电池设计周期通常只开放一次。Group14 的 Moses Lake 延期与 Sila 爬坡同时发生，是最尖锐的短期技术执行风险。

              中国竞争对手（BTR New Material Group、Shanshan 等）受益于国家补贴、更低劳动力和能源成本，以及占全球需求 70%+ 的本土电池制造基地。这些生产商正开始开发与 SCC55
              类似的硅碳材料。Group14 在中国的专利执法受中国法院环境限制。韩国生产路线绕开美中关税，但仍要与中国本土生产商争夺亚洲 OEM 合同。

              竞争格局还可能被其他下一代化学体系打断（固态电池、钠离子、锂硫）。如果这些技术比预期更早商业化，硅负极材料的总可服务市场可能被压缩。
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR028
