      - number: '8.5'
        title: 退出准备度与可选路径
        blocks:
          - type: paragraph
            body: >-
              Group14 尚未披露 IPO 时间表，但投资人构成给了公司有意义的战略可选性。Porsche Investments、SK Inc.、Microsoft Climate Innovation Fund 和
              OMERS 都可能成为战略或财务赞助方，推动二级交易、产业出售或结构化 IPO 流程。如果 BAM-2 顺利爬坡且欧洲 EV 电动化加速，Porsche 的车规级验证关系给 Group14 提供了一条由 OEM
              牵头的 M&A 路径。Microsoft 入股则释放出数据中心邻近需求渠道的信号，有机会把客户基础从 EV 周期性中分散出来。

              Group14 任何退出路径的可防守基础都包括三项核心资产：BAM-3 是一座 10 GWh 商业工厂且已有付费客户；170 多项专利保护
              SCC55；与五家领先电芯制造商的供应协议覆盖全球锂离子产量的实质部分。与纯商业化前公司相比，这些资产降低了任何退出情景的执行风险。剩下最重要的变量是 BAM-2：如果双工厂配置完全投运，M&A
              定价会明显好于单一工厂故事。此外，2025 年宣布转向 AI 数据中心电池需求——在这个场景里，能量密度和循环寿命的重要性不完全受 EV
              市场动态左右——如果能在下一次预期流动性窗口前用已披露的承购协议验证，可能成为真正的第二收入渠道。
