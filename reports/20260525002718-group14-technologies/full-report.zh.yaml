      - number: '3.4'
        title: 替代与相邻技术
        blocks:
          - type: paragraph
            body: >
              对硅负极供应商而言，主要长期替代威胁是固态电池，它承诺在不使用传统负极材料的情况下，实现能量密度跃迁。不过，截至 2024 年末，行业分析确认，硅负极在近端 EV
              部署上商业化进度领先于固态替代方案；固态电池仍面临未解决的电解质和制造挑战，最早也要到 2020 年代末才能进入汽车商业化使用。


              在硅负极类别内部，两种竞争化学路线构成替代风险。Shin-Etsu、Nexeon 和 Daejoo
              的硅氧（SiO/SiOx）技术，是硅碳复合材料的替代方案，首圈效率较低但循环稳定性强，并已在许多日本和韩国电芯供应链中通过认证。Enovix 和 Amprius 的纯硅架构，则在非汽车形态中实现极高能量密度。


              Enevate Corporation 的 XFC-Energy 技术支持硅主导锂离子电芯在十分钟内完成 EV 充电，它与 Group14 竞争的是快充性能叙事，而非能量密度。OneD SiNAnode
              基于等离子硅烷的低成本硅负极工艺未能达到商业可行性，其 Moses Lake 试点工厂已于 2025 年关闭。石墨负极现状——价格约 $6–8/kg，而硅约
              $10–11/kg——在硅碳复合材料达到平价前，仍是成本敏感型电芯制造商的默认选择；平价预计在 2028 年左右出现。
            claimRefs:
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
      - number: '3.5'
        title: Group14 的竞争位置与护城河
        blocks:
          - type: paragraph
            body: >
              Group14 的竞争护城河有四根支柱。第一，IP 深度：公司声称在五个司法辖区（美国、欧盟、日本、韩国、澳大利亚）拥有 170+ 项已授权专利，覆盖超过 90% 全球 EV
              市场；这会给仿制硅碳复合路线制造授权摩擦。Group14 的 SCC55 在 2025 年达到 1,500 次循环性能基准，并具备更快充电和更高能量密度，不过独立第三方循环寿命验证仍是证据缺口。


              第二，制造规模：韩国 BAM-3 自 2024 年起全面运行，华盛顿州 Moses Lake 的 BAM-2 于 2026 年 3 月开始有限生产——第一模块拥有 2,000 metric ton（10
              GWh）产能，规划总计六个模块，为美国本土 60 GWh 产能提供分阶段路径。第三，生态覆盖：汽车、消费电子、航空航天和工业垂直中的 150+ 家客户降低了客户集中度风险，并提供单一 OEM
              竞争者（Sila、Nexeon）无法复制的供应验证数据。Group14 还在 2024 年与五家领先 EV 和消费电子电芯制造商签署多年供货协议。第四，原料整合：规划中的硅烷工厂获得 $200 million
              DOE 补助支持，产能 7,200 metric tons，将纵向整合 Group14 的关键原材料。


              三类风险削弱这条护城河。执行风险：BAM-2 相比原定 2025 年计划至少推迟 12 个月，工人于 2025 年 7 月被裁员，并在 2026 年初再次临时休假，放量速度因此受质疑。成本风险：BTR
              的规模优势意味着，亚洲既有厂商的硅石墨复合材料能以相当或更低价格销售，并已拥有成熟 OEM 关系。去中介化风险：Samsung SDI 的 SCN 项目、CATL 和 BYD
