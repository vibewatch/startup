      - number: '4.4'
        title: 单位经济与利润率画像
        blocks:
          - type: paragraph
            body: >
              Group14 未公开披露毛利率、每吨 SCC55 成本或 EBITDA。可比硅碳负极生产商的行业数据显示，拥有受保护 IP 和商业规模工艺的技术领先者，毛利率大约在 20–30%
              区间；随着产量放大、良率稳定，盈利性会改善。工艺成熟度较低的新进入者 毛利率为 10–15%。Group14 的位置——170+ 项专利、多年 IP 护城河，以及截至 2025 年中唯一 EV 规模硅负极工厂——
              使其偏向较高端，但没有私有财务数据便无法验证这一判断。

              收入端，公司按 metric ton 在谈判合同下销售 SCC55。行业估计，商业化产量中的先进硅碳复合材料价格约为 $50 至 $100/kg（$50,000–$100,000/ton）。如果把 Group14
              2025 年估计收入（约 $39M）主要归因于 BAM-3 产出（2024 年 9 月开始），则意味着部分年度吞吐量远低于 2,000-ton 设计产能——这与放量阶段一致：认证项目和初始商业订单驱动收入，
              而非满产利用。

              B2B 电池材料的客户获取涉及多年认证周期（汽车为 12–24+ 个月），因此 CAC 嵌在 R&D、应用工程和样品供应预算中， 而不是独立销售支出。回本周期因此按从认证到放量的时间线衡量，而非传统 SaaS
              或消费品回本指标。超过 $300M 的承购合同价值， 一旦完全提取，将提供收入底线，支撑近端单位经济不确定性。
