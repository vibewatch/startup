      - - DOE $300M+ 补助降低 BAM-2 和硅烷工厂的资本强度，改善美国制造建设的有效成本。
        - 如果 DOE 补助按条件提款且绩效里程碑未达成，补助支持可能被削减或追缴。
    notes: 在价格支撑上，反向逻辑目前强于投资逻辑，因为收入、利润率和股权结构表条款仍未披露；投资逻辑在技术和市场位置上更强。
