      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Rick Luebbe 担任首席执行官兼联合创始人，从创立到多工厂放大阶段为公司提供连续领导。 Rick Costantino 同为联合创始人，担任首席技术官，负责材料科学和工艺工程。第三位联合创始人 Aaron
              Feaver 因公司早期科学工作和专利组合而公开出现。


              董事会有意混合运营经验、战略投资者代表和汽车行业信誉。特种化学品公司 Innophos 前 CEO Dr. Kim Mink 担任董事。Dr. Michael Steiner 以 Porsche AG
              研发执行副总裁身份代表 Porsche。 Bob Lutz 曾任 GM、Ford 和 Chrysler 副董事长，带来传统 OEM 视角。OVP Venture Partners 的 Gerry Langeler
              自 Series A 起任董事。Stellantis 前 CFO Richard K. Palmer 于 2025 年 3 月加入董事会， 在 Series D 前补上汽车规模级财务和并购经验。


              Group14 未公开披露独立审计委员会构成、除具名成员外的董事会总人数，或任何美国以外子公司董事会结构。 管理层薪酬也未披露，符合私营公司状态。
