        - BAM-2 在 2027 年底前满产；EV 市场复苏；硅烷工厂按期投产；Group14 开始披露收入或已签约订单储备。
        - 如果收入浮现，支撑 EV/Sales 倍数锚定在 Sila 私募标记与 Enovix 公开可比公司之间，$8B-$10B 区间就具备可信度；溢价战略 M&A 也有可能。
        - 需要多个执行点同时兑现；任何一处失手都会明显压缩区间。
