      - number: '5.5'
        title: 产品路线图与开发管线
        blocks:
          - type: paragraph
            body: >
              Group14 的短期路线图主要是制造规模化，而不是离散功能管线。产品 SCC55 已商业成熟并经客户验证；核心开发工作在于：（a）2026 年把 BAM-2 爬坡至首个模块满产 2,000 mt；（b）投产德国
              Spreetal 硅烷工厂以锁定欧洲供应；（c）拿到用于 7,200 mt Moses Lake 硅烷工厂的 DOE $200M 补助。BAM-2 六模块完全建成后目标为 12,000 mt/year（约 60
              GWh）；公司网站称 2027 年达到 20 GWh（两个模块）。

              材料端，Group14 正在推进与固态电池化学体系的整合，并继续与 BASF（粘结剂共同开发）、Sionic（无石墨 100% 硅负极设计）等伙伴扩展 SCC55 性能优化。CEO 表示，用 SCC55
              今天就可以实现对石墨的全硅替代，而不只是混合使用；Sionic 已展示商业证明。

              长期看，Group14 计划在全球复制其 BAM 模块（欧洲 BAM 工厂已有规划但尚未选址）。Applied Innovation 项目还瞄准持续降本，缩小与石墨基负极的价格差距；该差距仍是主流汽车 OEM
              大批量采用的障碍。
