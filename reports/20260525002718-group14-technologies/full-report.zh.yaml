            - label: 强
              tone: positive
              detail: Sionic 新闻稿 + CleanTechnica + IndianChemicalNews 报道。
            - label: 弱
              tone: warning
              detail: 无留存数据；商业化前阶段。
    approximationNotes: 评分反映公开证据质量，而非该客户对 Group14 的战略价值；Group14 不披露任何客户的留存指标，因此留存可见度普遍为“弱”。
    claimRefs:
      - CU006
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU016
  - id: FU003
    title: Group14 客户获取与部署流程
    type: flow
    layout: wide
    summary: Group14 的客户路径从 SCC55 初始送样出发，经验证、签约到量产部署；部分客户进一步深化为技术共研合作。
    data:
      nodes:
        - id: af1
          label: 送样 / 评估
          detail: 电池制造商索取 SCC55 样品；以石墨为基准，测试能量密度、循环寿命、快充能力。
          tone: neutral
        - id: af2
          label: 研发验证
          detail: 完整电芯集成；NDA 试点供货；按客户电芯设计要求做循环、安全和热特性表征。
          tone: neutral
        - id: af3
          label: 商业合同
          detail: 有约束力的包销或多年供货协议；锁定销量、价格和交付计划。
          tone: positive
        - id: af4
          label: 量产部署
          detail: SCC55 导入已出货的商业产品；销量随 BAM 工厂爬坡放大。
          tone: positive
        - id: af5
          label: 共同开发合作
          detail: 技术与市场拓展协作让关系超出标准供货（BASF Licity、Sionic RISP、StoreDot XFC）。
          tone: positive
        - id: af6
          label: 供应风险
          detail: BAM-2 延期和 2025 年 7 月裁员，为已签约客户带来潜在履约风险。
          tone: warning
      edges:
        - from: af1
          to: af2
        - from: af2
          to: af3
        - from: af3
          to: af4
        - from: af4
          to: af5
        - from: af3
          to: af6
    approximationNotes: 该流程是对已观察到客户接触模式的定性综合；各阶段之间的转化率未公开披露。
    claimRefs:
      - CU006
      - CU009
      - CU021
      - CU023
      - CU026
  - id: FR001
    title: 风险热力图 — Group14 Technologies（影响 vs 可能性）
    type: matrix
    layout: standard
    summary: |
      截至 2026 年 5 月，Group14 前 12 项风险的严重性（影响 × 可能性）和缓释成熟度。高严重性、低缓释象限包含硅烷供应、BAM-2 延期和联邦补助风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 高影响
          values:
            - 安全事故（硅烷）
            - DOE 补助取消；FEOC 不合格判定
            - 硅烷供应缺口；BAM-2 延期；人才流失
        - label: 中等影响
          values:
            - 竞争对手 IP 诉讼；CFIUS 审查
            - EV 需求放缓；45X 税收抵免逐步退出
            - 建设成本超支；中国需求坍塌
        - label: 低影响
          values:
            - WA Ecology 许可违规；质量召回
            - 社区关系恶化
            - ''
    approximationNotes: |
      可能性和影响是基于截至 2026 年 5 月公开证据的定性判断；并非基于概率模型。
    claimRefs:
      - CR010
      - CR017
      - CR019
      - CR004
      - CR038
      - CR033
  - id: FR002
    title: 风险传导图 — 核心风险如何传到收入与资本
    type: dag
    layout: wide
    summary: |
      有向无环图展示上游风险（硅烷、联邦政策、关税）如何通过运营传导至收入和估值结果。
    data:
      nodes:
        - id: silane-supply
          label: 硅烷供应缺口（REC Silicon 关闭）
        - id: bam2-delay
          label: BAM-2 投产延期
        - id: federal-grant
          label: 联邦补助风险（DOE / OBBB）
        - id: tariff-china
          label: 美中关税 / 需求坍塌
        - id: workforce-risk
          label: 员工无薪休假 / 流失
        - id: sila-competition
          label: Sila OEM 认证竞赛
        - id: feoc-compliance
          label: FEOC 45X 资格取消风险
        - id: revenue-delay
          label: 美国收入落地延迟
        - id: capital-pressure
          label: 现金 / 资本投放压力
        - id: oem-qualification
          label: OEM 认证机会丧失
        - id: valuation-risk
          label: 估值 / 下一轮稀释风险
      edges:
        - from: silane-supply
          to: bam2-delay
          label: 原料缺口使生产停摆
        - from: federal-grant
          to: bam2-delay
          label: 补助取消拖住建设
        - from: tariff-china
          to: bam2-delay
          label: 中国需求坍塌削弱紧迫性
        - from: bam2-delay
          to: revenue-delay
          label: 没有美国产能就没有美国收入
        - from: workforce-risk
          to: bam2-delay
          label: 人才流失拖慢投产
        - from: bam2-delay
          to: sila-competition
          label: 竞争对手占据 OEM 认证名额
        - from: sila-competition
          to: oem-qualification
          label: Group14 错失认证窗口
        - from: oem-qualification
          to: valuation-risk
          label: 收入延迟压低估值
        - from: revenue-delay
          to: capital-pressure
          label: 无收入下持续烧钱
        - from: feoc-compliance
          to: capital-pressure
          label: 失去 45X 税收抵免推高生产成本
        - from: capital-pressure
          to: valuation-risk
          label: 稀释性融资或投资停滞
    approximationNotes: |
      边表示从公开证据中识别出的因果风险传导路径；边权重为定性判断。
    claimRefs:
      - CR010
      - CR019
      - CR004
      - CR015
      - CR028
      - CR038
  - id: FR003
    title: 依赖图 — Group14 Technologies 的关键外部依赖
    type: dag
    layout: wide
    summary: |
      Group14 依赖的关键供应商、合作伙伴、监管方和资本提供方；关键路径上任何节点失效都会影响生产。
    data:
