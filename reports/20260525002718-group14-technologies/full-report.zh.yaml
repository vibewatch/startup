      - number: '5.6'
        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >
              SCC55 在每座 BAM 工厂以 ISO 级工艺控制进行商业规模生产。Group14 尚未在公开新闻材料中发布独立认证数据（ISO 9001、IATF 16949、UN
              38.3）；这些是需要直接向客户和公司核验的尽调缺口。

              从安全角度看，Exponent 2024
              年工程分析指出，由于储能更高，硅负极电芯相比同等石墨电芯具有更高热失控能量。循环过程中的体积膨胀可能导致圆柱电芯绕组结构机械变形，并在老化过程中造成电解液泄漏和电芯失效——这是传统石墨电芯没有的失效模式。Group14
              用骨架空隙架构缓解该问题，但公开渠道没有看到汽车热环境下超过 3,000 次循环的独立长期老化数据。

              BASF/Group14 测试确认了 45°C 下稳定循环（>500 次），Sionic/Group14 联合测试确认了 45°C 与 60°C 存储稳定性及较低气体生成，支持 EV
              电池包热管理兼容性。全温域汽车认证数据（−40°C 至 +85°C 循环、振动、针刺）不在公开领域。

              在供应链安全上，Group14 设计基础设施以降低对中国石墨（全球供应 >90%）和中国硅烷的依赖。Moses Lake
              硅烷工厂与德国硅烷设施合在一起，意图建立这种自燃气体的本土及盟友供应。硅烷仍是安全关键材料（高度自燃，需要专业处理），全球硅烷供应集中在中国，已被 Group14 及竞争对手识别为系统性行业风险。
