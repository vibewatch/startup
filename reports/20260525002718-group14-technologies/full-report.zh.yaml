    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 主要买方 / 付款方
      - 对 Group14 的意义
    rows:
      - - 硅碳复合负极材料（SiC）
        - OEM 购买用于电池电芯浆料的硅碳复合前驱体
        - 石墨、仅 SiOx 材料、正极、电解液、隔膜
        - 电池电芯制造商（Samsung SDI、CATL、LG Energy、ATL、SK）
        - SCC55 核心产品市场；直接收入机会
      - - 硅氧（SiOx / SiO）负极材料
        - 按低重量百分比掺入石墨浆料的 SiO 基负极添加剂
        - 硅碳复合材料、纯硅、石墨
        - 同上方电池电芯制造商
        - 相邻子赛道；Group14 想替代的竞争技术
      - - 电池硅负极材料（所有类型）
        - 全球 Si 基负极投入全口径：SiC + SiOx + nano-Si
        - 石墨负极；正极、电解液、电池包、BMS
        - 全球电池电芯制造商
        - TAM 边界：~$450–655M（2025E），增长至 $20B+（2035E）
      - - EV 电池制造（需求驱动）
        - EV 电芯生产预算中嵌入的硅负极材料支出
        - 整车装配、充电基础设施、软件
        - 经 Tier-1 电芯制造商触达的汽车 OEM
        - 最大需求板块；贡献硅负极材料约 65–80% 用量
      - - 消费电子电池（CE）
        - 智能手机、可穿戴设备、平板电脑电芯生产中的硅负极材料支出
        - EV 和电网储能电芯生产
        - 设备 OEM（Samsung、Apple/Foxconn、Xiaomi），经合同电芯厂商采购
        - 第二大板块；约占硅负极电池市场收入 35%（2025E）
      - - 固定式 / 电网储能
        - BESS 电芯中的硅负极材料支出（在化学体系允许时）
        - LFP 电网电芯（2025 年占 BESS >90%，不含硅）；EV 电芯
        - 公用事业公司、项目开发商、ESS 集成商
        - 新兴板块（约 15% 硅负极需求）；当前以 LFP 为主，近期 SAM 有限
    notes: |
      细分边界和支出数值是根据分析师市场报告及公司披露推导出的估算值；没有单一权威来源能统一覆盖所有细分。排除支出项反映 Group14 产品范围之外的组件。EV 需求驱动行展示的是下游拉动市场，不是 Group14 的直接收入流。
