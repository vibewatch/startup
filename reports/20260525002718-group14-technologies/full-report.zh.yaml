  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: SCC55® 产品架构与核心技术
        blocks:
          - type: paragraph
            body: >
              Group14 Technologies 生产单一商业化产品：SCC55®，一种合成硅碳复合（Si/C）负极材料，用来替代锂离子电芯中的石墨负极。名称来自元素周期表第 14
              族，其中包括碳和硅。在分子层面，SCC55 由多孔硬碳骨架组成，骨架内部的纳米孔网络通过化学气相沉积（CVD）灌入无定形纳米级硅颗粒。这种骨架 + 硅架构解决了硅商业化最根本的障碍：纯硅在嵌锂过程中体积最多膨胀
              300%，会造成机械断裂和容量快速衰减。Group14 的骨架预先为硅膨胀留出空隙，从机械上约束膨胀，并在数千次循环中保持电连接。

              硅前驱体是硅烷气体（SiH₄）。Group14 目前从其收购的德国 Spreetal 设施（原 Schmid Silicon Technology Holding）获得硅烷，并计划用新的 Moses Lake,
              WA 工厂补充供应。硅烷在高温下于碳骨架内部分解，使无定形纳米硅均匀沉积在整个孔网络中。所得复合材料随后被处理并控制粒径，形成可直接导入的粉体，在负极浆料中替代石墨，不要求电芯制造商更换生产设备。SCC55 兼容
              NMC、LFP、LMFP、高镍和固态电池化学体系，也适用于圆柱、方形和软包电芯形态。

              因为 SCC55 既可以替代石墨，也可以与石墨混用，OEM 获得了一组采用路径：全硅替代（最大化能量密度）、部分混合（平衡成本 / 性能），或为快充优化的设计。硅相对石墨的质量比容量约为 10:1，因此 1 吨
              SCC55 大约可替代 5 吨石墨，同时提供更好的体积和质量性能。
