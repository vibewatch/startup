        - 资本强度、进一步裁员和受限的美国市场可能加速烧钱。
        - 如果 BAM-2 到 Q3 2026 仍无运营更新，风险会快速上升。
    notes: 情景逻辑为方向性判断，因为 Group14 的估值和收入并未公开；区间锚定可比公司数据和融资历史。
