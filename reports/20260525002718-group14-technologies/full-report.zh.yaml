  - id: TV005
    title: 推翻投资逻辑的触发条件表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - BAM-2 投产再次落空
        - 到 Q3 2026 仍无运营更新，或延后到 2027
        - 动摇美国制造规模化逻辑；推高资金需求和降估值融资概率；进一步裁员的可能性上升。
        - 若延误超过 Q4 2026，降级为回避；要求披露资金跑道。
      - - 收入披露迟迟不出现
        - 到 2026 年底仍未公布订单积压、ARR 或收入
        - 无法用 EV/Sales 倍数锚定；投资人只能依赖技术期权溢价；可比集退到 QS 的前收入场景，而不是 Enovix 的收入增长场景。
        - 维持估值立场为未知；要求相对估计账面估值有实质折扣。
      - - 中国关税损失持续或加深
        - 到 Q4 2026，中国电池厂需求继续收缩
        - 收入风险集中到非中国客户群；150 个客户指标的有效商业基数缩小。
        - 重估 BAM-3 利用率；扩大悲观情景区间。
      - - 发生降估值融资
        - 新股定价低于 ~$5.27B Series D 轮估值标记
        - 意味着战略投资人没有信心维持该估值标记；早期投资人的优先权负担上升；以有吸引力条款退出更难。
        - 列入退出观察名单，除非新融资同时带来收入可见性和爬坡证明。
    notes: 这些触发因素都能从公开公告和披露融资事件观察到；每项都有具体、可监测的信号，无需管理层访问也能跟踪。
    claimRefs:
      - CV022
      - CV032
      - CV033
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 收入和订单积压
        - 未公开 BAM-3 客户带来的 ARR、收入运行率或已签约订单积压
        - 没有收入，就无法套用 EV/Sales 可比锚点；估值只能退回技术期权框架，支撑不了买入结论。
        - 管理层和财务尽调；自愿新闻披露。
      - - 毛利率和单位经济
        - 未披露 SCC55 每公斤成本、毛利率或制造经济性
        - 毛利率决定 Group14 在 BAM-3 规模下能否转正现金流，且是在 BAM-2 资本完全投入前就做到。
        - 运营和财务尽调。
      - - 股权结构表和优先权条款
        - 未公开投后估值、清算优先权堆叠或参与型条款
        - 累计融资超过 $1B 带来的优先权负担，可能在基准情景顺利退出时也吃掉普通股上行。
        - 通过老股市场数据提供商做法律和股权结构表尽调。
      - - BAM-2 投产时间线
        - 强制休假后，没有确认投产日期或爬坡计划
        - BAM-2 是乐观情景上行的最大驱动项；它的时间线决定 Group14 何时拥有两座运营工厂，从而支撑可信退出倍数。
        - 运营尽调；实地访厂或公开新闻更新。
      - - AI 和数据中心需求验证
        - 未披露电池用于数据中心场景的已签承购或商业合同
        - 数据中心转向是公司声称抵消 EV 关税逆风的主要抓手；没有合同，这部分需求仍属投机，基准情景应剔除。
        - 商业尽调；客户背调验证。
    notes: 这五项是从观察名单推进到入场价格判断所需的最低材料包；这些问题解决前，不应启动其他尽调工作流。
    claimRefs:
      - CV010
      - CV022
      - CV036
      - CV037
      - CV050
