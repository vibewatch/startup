      - number: '7.3'
        title: 运营与制造风险
        blocks:
          - type: paragraph
            body: >
              Moses Lake 的 BAM-2 设施是 Group14 最大的单一执行风险。这座 1,000,000-sq-ft 工厂于 2023 年 4 月破土，由 Clayco 担任总承包商，最初目标是在 2024
              年底投产两个模块，每个模块可年产 2,000 公吨 SCC55。投产时间先被推迟到 Q2 2025（2025 年 2 月更新），再推迟到 H2 2025（2025 年 4
              月更新，称原因为美中关税导致需求崩塌），随后推迟到 2026 年初（2025 年 7 月更新，同时伴随裁员）；截至 2026 年 1 月，设施约建成 90%，工人停工，建设以较慢节奏推进。公司在 2025 年 2
              月重组施工合同，安排承包商分阶段进入以降低成本，并在 2025 年 7 月裁撤未披露数量的美国员工，2026 年 1 月又让更多员工停工。

              延期根因包括：（1）需求端崩塌——全球电池市场约 70-80% 在中国，互惠关税让中国客户降低美国制造材料优先级；（2）与施工工种重组合同，扰乱工期；（3）REC Silicon
              硅烷供应中断，消除了对原料可得性的信心缓冲。

              运营安全风险很高。硅烷气体（SiH4）用于 Group14 的 SCC55 制造工艺，是一种在空气中低浓度即可自燃的材料。OSHA 过程安全管理（PSM, 29 CFR
              1910.119）在达到阈值数量时适用。BAM-2 设施需要连续气体监测、自动化输送系统、联锁切断、隔爆电气系统和定期 PSM 审计。任何硅烷相关事故都会让生产停摆、触发监管调查，并可能使 DOE 补助条件失效。

              竞争对手 Sila Nanotechnologies 已投产其 Moses Lake 工厂，目标 2025-2026 年生产；当 Group14 的 Moses Lake 产能仍离线时，Sila 正直接争夺
              OEM 认证。OneD Battery Sciences 于 2025 年 5 月关闭其 Moses Lake 试点工厂，说明同业规模化失败是真实存在的。
