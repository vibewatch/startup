        title: 单位经济性与成本结构现实
        blocks:
          - type: paragraph
            body: >-
              跨境支付聚合和收单的直接单位经济性天然受到下游金融基础设施成本及监管合规开销挤压。Rapyd
              网络处理的每笔跨境交易都要承担代理行费用、国际支付体系和卡组织评估费，以及覆盖反洗钱控制和制裁核验的强制合规筛查成本。这些不可协商的成本会侵蚀商户利润，除非依靠足够规模或高毛利外汇点差抵消，否则会显著拖累毛利。由于
              Rapyd 聚合数百个本地支付网络，其净费率只占商户名义交易费的一部分，毛利率对走廊组合和代理行定价高度敏感。
