  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务范围与可寻址支出
        blocks:
          - type: paragraph
            body: >-
              Rapyd 位于全球 Fintech-as-a-Service（FaaS）、嵌入式金融和多币种支付处理基础设施的交汇处。平台把跨境收款、全球付款、电子钱包管理、虚拟账户创建和发卡等模块化金融能力整合到一次 API
              集成中。可寻址市场包括数字商业企业、零工经济市场平台、旅游平台和跨境数字平台，它们需要多区域支付路由及自动化监管合规。

              另一方面，市场边界明确排除封闭式国内零售销售点系统、非数字纸钞分发渠道、封闭的专有企业 ERP 会计系统，以及缺乏国际结算能力的单一市场国内支付网关。Rapyd
              的核心客户价值主张面向跨国企业，帮助其应对碎片化国内支付体系和跨境监管走廊带来的运营复杂性。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模、TAM/SAM/SOM 边界与分析约束
        blocks:
          - type: paragraph
            body: >-
              评估嵌入式 fintech
              和跨境支付编排的全球可寻址市场，需要采用多种分析视角，而不能照单全收供应商的宽泛营销预测。行业叙事强调全球交易量达万亿规模，但可获取的软件和处理支出受企业费率及可服务支付走廊限制。Target Global
              和市场观察者在 Rapyd 2021 年 Series E 融资后，强调数字支付、嵌入式金融和云支付基础设施的快速扩张。

              但对 Rapyd 可服务市场（SAM）和可获取市场（SOM）的独立验证存在显著方法约束。未经审计的供应商自述称其覆盖 100 多个国家的 900
              多种支付方式，却把理论网络覆盖与签约商户交易量混为一谈。此外，宏观压力和 fintech
              估值重估——同行支付平台的私募二级及一级融资均被重新定价——表明现实的软件费率提取受到卡组织交换费和区域国内银行轨道的严格限制。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
