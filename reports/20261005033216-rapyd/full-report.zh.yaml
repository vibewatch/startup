      - number: '1.3'
        title: 资本化轨迹、下轮融资压力与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              Rapyd 经过多轮风险投资和成长融资累计获得大量股权资本，最终在 2021 年 8 月由 Target Global 领投的 $300 million Series E 融资中达到 名义 $8.75
              billion 投后估值。Coatue、General Catalyst、Oak HC/FT、Stripe、Dragoneer Investment Group 和 Tiger Global Management
              等知名机构投资者为其提供支持，公司利用充足资本建设国内网络并扩大程序化收购。然而，2021 年后私营 fintech 估值收缩带来明显重估。二级市场私下交易和 2025 年广泛报道的融资谈判显示，Rapyd
              曾寻求约 $300 million 新成长融资，对应 $3.5 billion 估值，较峰值账面估值大幅下调；市场基准同时追踪到 $4.5 billion 的 Series F
              临时估值里程碑。这些倍数压缩反映支付基础设施提供商面临的宏观修正，也凸显审计后的独立现金创造能力是关键问题。
            claimRefs:
