      - number: '1.4'
        title: 运营规模、战略收购与平台扩张
        blocks:
          - type: paragraph
            body: >-
              公司商业轨迹把程序化开发者平台推广与重大转型收购结合起来，以集中获取跨境支付市场份额。Rapyd 成立于 2015-2016 年，先从本地支付方式聚合扩展到综合收单，并在 Series B 期间获得 Stripe
              等行业同业的战略支持，随后加快机构融资。2022 年，公司完成对冰岛支付服务商 Valitor 的 $100 million 收购；2023 年又以 $610 million 收购 PayU
              的全球支付业务。运营员工数增至约 1,600 人，分布在伦敦、特拉维夫、迈阿密、阿姆斯特丹、新加坡和拉丁美洲等国际科技及监管中心。近期产品和市场动作包括部署稳定币支付基础设施、跨境资金管理结算整合，以及 AI
              驱动的争议和欺诈监控工具。尽管如此，净收入留存率、有机毛利率以及与并购融资相关的债务偿付契约等关键商业指标仍不透明，是必须重点核查的领域。
            claimRefs:
              - CO011
              - CO012
              - CO016
