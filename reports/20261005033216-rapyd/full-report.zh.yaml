  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策树展示了支持 Rapyd 采取审慎 TRACK 立场的证据链。
    data:
      nodes:
        - id: market-scale
          label: 全球覆盖与规模：900+ 种支付方式，以及主要并购资产（Valitor、PayU GPO）
        - id: financial-reset
          label: 资本轨迹：$4.5B Series F 轮融资使峰值 $8.75B 估值下调约 49%
        - id: structural-headwinds
          label: 利润率摩擦：中间代理行费用与高昂合规成本
        - id: debt-servicing-burden
          label: 资本结构：$250M 债务融资使现金流持续承担优先受偿权
        - id: disclosure-opacity
          label: 信息不对称：独立 ARR、净 take rate、现金消耗和债务条款均未披露
        - id: final-recommendation
          label: 尽调立场：TRACK（等待经审计的财务披露和债务契约）
      edges:
        - from: market-scale
          to: financial-reset
          label: 提供坚实的处理基础
        - from: financial-reset
          to: structural-headwinds
          label: 但利润率收窄形成对冲
        - from: structural-headwinds
          to: debt-servicing-burden
          label: 债务偿付义务进一步放大影响
        - from: debt-servicing-burden
          to: disclosure-opacity
          label: 缺乏公开申报文件使问题更加突出
        - from: disclosure-opacity
          to: final-recommendation
          label: 决定审慎的投资姿态
    approximationNotes: 流程图展示了综合运营覆盖、估值重置和披露障碍后的定性决策逻辑。
    claimRefs:
      - CV001
