  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 按顺序展示总交易量如何在扣除网络处理与合规费用后转化为净收入和毛利。
    data:
      nodes:
        - id: gross-volume
          label: 客户交易活动
          description: 通过 Rapyd API 发起的全球收款、电子商务结账与对外付款交易
        - id: gross-take
          label: 商户处理费率
          description: 向客户收取的交易处理百分比、固定路由费与外汇转换价差
        - id: network-costs
          label: 网络与中介扣除项
          description: 卡组织评估费、交换费转嫁与代理行交易通道费
        - id: compliance-overhead
          label: 监管与合规成本负担
          description: AML 监控、KYC 验证开销与制裁筛查基础设施运营成本
        - id: operating-overheads
          label: 运营与工程支出
          description: 核心云基础设施、工程团队人力与多司法辖区许可维护
        - id: net-gross-profit
          label: 净贡献 / 毛利
          description: 可用于技术平台开发、GTM 扩张与运营烧钱的剩余资金
      edges:
        - from: gross-volume
          to: gross-take
          label: 应用合同定价与外汇价差
        - from: gross-take
          to: network-costs
          label: 承担第三方银行与通道费用
        - from: network-costs
          to: compliance-overhead
          label: 扣除持续监管监控成本
        - from: compliance-overhead
          to: operating-overheads
          label: 分配核心平台交付费用
        - from: operating-overheads
          to: net-gross-profit
          label: 产生平台净贡献
    approximationNotes: 概念性展示支付基础设施的单位转换机制；具体费用扣除因国家、支付通道与客户交易量而异。
    claimRefs:
      - CI002
      - CI004
      - CI006
      - CI007
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Rapyd 平台的软件、数据持久化与银行连接分层架构。
    data:
      layers:
        - id: client-surfaces
          label: 客户集成与呈现层
          detail: REST API、托管结账页面、虚拟终端、支付链接与客户门户
        - id: core-fintech-services
          label: 核心金融科技即服务引擎
          detail: Rapyd Collect（收款）、Rapyd Disburse（付款）、Rapyd Wallet 与 Rapyd Issuing
        - id: application-runtime
          label: 微服务与应用运行时
          detail: Node.js 分布式后端服务与异步交易处理
        - id: resilient-persistence
          label: 数据库与账本持久化
          detail: 带有组复制与 MySQL Router 的 MySQL Enterprise Edition InnoDB Cluster
        - id: infrastructure-devops
          label: 云与 DevOps 基础设施
          detail: 通过 Terraform 配置、Ansible 与 Jenkins CI/CD 自动化的 Amazon EC2 实例
        - id: global-financial-rails
          label: 全球清算与银行通道
          detail: Visa/Mastercard 卡组织、200 多家连接银行与 60 多个实时支付网络
    approximationNotes: 根据官方开发者文档与企业基础设施案例研究整理的逻辑架构拆分。
    claimRefs:
      - CE001
