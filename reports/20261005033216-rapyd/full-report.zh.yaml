  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 隐含估值 / 回报逻辑
      - 主要风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - PayU 无缝整合、稳定币付款快速普及、企业端费率持续提升
        - 通过伦敦 / 美国 IPO 成功退出，估值为 $6.5B - $8.0B，对应净收入 12x-15x 倍数
        - 平台中断、卡组织罚款，或新兴市场的反垄断 / 许可延误
        - 25%（要求并购后执行无瑕，且公开科技市场环境支持）
      - - 基准情景
        - 交易量稳定增长 15-20%，代理行费用压力持续，市场份额稳定
        - 估值维持在当前 Series F 标记（$4.5B）附近的 $4.0B - $5.0B，回报温和
        - 金融科技同业倍数压缩，企业采购周期延后
        - 50%（与当前私募市场二级定价及 Series F 轮条款一致）
      - - 悲观情景
        - 整合摩擦、PayU 收购后商户流失、监管审查、债务契约违约
        - $2.0B - $3.0B 的困境出售或资本重组，较 Series F 下行 35-55%
        - 无法偿付 $250M 债务融资额度，或客户流失至 Stripe/Adyen
        - 25%（反映激烈的下轮融资谈判与私募金融科技流动性压力）
    notes: 情景模型计入 $250M 债务融资额度义务、$4.5B Series F 投后估值与公开市场可比公司倍数。
    claimRefs:
      - CV002
      - CV005
      - CV007
      - CV010
      - CV011
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 Rapyd 从早期种子轮融资到数十亿美元估值峰值、战略并购及下轮融资资本重组的演进。
    data:
      items:
        - label: 公司成立
          date: '2015'
          detail: Rapyd 成立，旨在搭建金融科技即服务基础设施，将全球企业连接到本地支付方式。
          tone: neutral
        - label: Series B 与 Stripe 支持
          date: 2019-02
          detail: 获得由 General Catalyst 与 Stripe 联合领投的 $40M Series B 融资，用于建设本地支付网络。
          tone: positive
        - label: Series D 独角兽轮
          date: 2021-01
          detail: 完成 Coatue 领投的 $300M Series D 融资，公司估值达 $2.5B。
          tone: positive
        - label: Series E 估值峰值
          date: 2021-08
          detail: 在金融科技扩张期完成 Target Global 领投的 $300M Series E，投后估值 $8.75B。
          tone: positive
        - label: 收购 Valitor
          date: 2022-07
          detail: 以 $100M 收购总部位于冰岛的支付公司 Valitor，扩大欧洲商户收单业务。
          tone: neutral
        - label: PayU 收购协议
          date: 2023-08
          detail: 同意以 $610M 收购 PayU 在 8 个国家的全球支付业务，加速企业规模扩张。
          tone: positive
        - label: 估值重置至 $3.5B-$4.5B
          date: '2025'
          detail: 面对下轮融资的市场压力，融资估值据报道为 $3.5B（Bloomberg）及 $4.5B Series F。
          tone: warning
        - label: 稳定币与 B2B 扩张
          date: '2026'
          detail: 推出稳定币支付解决方案与嵌入式资金管理工具，服务跨境企业商业活动。
          tone: neutral
    approximationNotes: 日期与交易金额取自公司新闻稿、TechCrunch 报道及市场数据库。仅披露年份或季度时，月份精度为近似值。
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO013
  - id: FM001
    title: 金融科技即服务规模层级与机会漏斗
    type: pyramid
    summary: 分层展示从全球可触达数字商业流量到可触达 FaaS 费率收入的市场规模。
    data:
      items:
        - label: 全球数字商业交易量（宏观 TAM）
          value: 100
          details: 更广泛的数万亿美元全球数字商业与跨境商业交易流量。
        - label: 跨境替代支付与付款交易量（SAM）
          value: 50
          details: 全球线上转账中超过 50% 通过 100 多个国家的本地或替代支付方式完成。
        - label: 高机会企业延迟与 RTP 交易量（SOM）
          value: 38
          details: 高增长垂直领域中，38% 的企业正积极优先采用实时支付，以解决现金流摩擦。
        - label: 企业跨境支付延迟交易量
          value: 26
          details: 26% 的企业称跨境支付延迟是扰乱现金流的重大运营挑战。
        - label: 目标可触达 FaaS 软件与外汇费率
          value: 15
          details: 平台在支付编排、多币种外汇加价与发卡业务上的净费率提取空间受限。
        - label: 高毛利嵌入式金融服务核心
          value: 8
          details: 专属虚拟账户、资金管理账本与发卡软件订阅收入层。
    approximationNotes: 指数刻度（100 至 8）代表从宏观交易量向可触达软件与费率收入层的相对体量筛选。
    claimRefs:
      - CM004
      - CM005
      - CM011
      - CM012
  - id: FP001
