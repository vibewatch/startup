      - number: '3.3'
        title: 经济性、切换壁垒与不利脆弱点
        blocks:
          - type: paragraph
            body: >-
              评估 Rapyd 竞争护城河的持久性，会同时看到显著的客户切换成本和持续的运营摩擦。对全球市场平台、零工经济网络和跨境数字服务平台而言，接入 Rapyd 的批量付款
              API、多币种钱包和区域合规工具会形成运营黏性：重构跨境付款链路，并在数十个司法辖区重新建立本地 KYC/AML 流程，需要大量工程投入，也会带来监管切换延迟 [CP001,
              CP006]。但独立评估语料和不利财务报告所记录的商户脆弱性，会抵消一部分这种黏性 [CP002, CP007, CP010]。

              不同于费率透明且标准化的开发者友好平台，Rapyd、Global Payments 和 Ingenico 等企业 fintech 基础设施提供商往往采用不透明的定制销售报价 [CP001, CP002,
              CP004]。跨境环境下，商户经济性取决于综合交换费加价、外汇点差、按走廊收取的付款附加费和拒付罚金，导致买方抱怨费用不透明和结算对账困难 [CP001, CP002,
              CP010]。公开评价汇总还显示，商户对结算延迟、账户验证冻结以及特定付款走廊争议中的客户支持摩擦持负面态度 [CP002, CP010]。这些运营障碍与 fintech 估值压缩同时出现：Rapyd 曾寻求对应
              $3.5 billion 估值的成长融资，较 2021 年 $9 billion 峰值大幅下调，类似于 Stripe 及整个风险资本支持 fintech 行业在债务和股权驱动的连续并购后进行的估值重估
              [CP007, CP012]。
