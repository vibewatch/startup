            title: 代理行成本与合规开销挤压利润
            body: >-
              跨境支付基础设施并不是无摩擦的高毛利软件。代理行费用、国际卡组织评估费和持续 AML/KYC
              合规监控会消耗交易总费率的很大部分。若缺乏大规模内部净清算效率，毛利率仍容易受到第三方支付轨道定价和不断变化的司法辖区合规负担影响。
