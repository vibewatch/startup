chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、运营结构与核心平台
        blocks:
          - type: paragraph
            body: >-
              Rapyd 是全球 fintech-as-a-service 基础设施平台，把企业、市场平台和数字平台连接到本地及国际支付轨道。公司正式注册并以伦敦为主要运营中心，在欧洲、美洲、非洲和亚太拥有广泛子公司，提供
              API
              驱动的金融服务，包括直接卡收单、即时付款、多币种虚拟账户、发卡以及正在兴起的稳定币结算流程。其架构围绕端到端资金流转，把不同的国内清算系统、本地电子钱包和区域银行轨道整合到统一的开发者环境中，解决跨境企业商业中长期存在的结算延迟和外汇摩擦。公司还整合了主要区域资产，包括以
              $610 million 收购 PayU 在八个国家的企业业务，显著扩大了地理覆盖和高增长国际走廊的交易处理密度。
            claimRefs:
