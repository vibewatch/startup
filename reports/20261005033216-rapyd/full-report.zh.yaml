      - number: '4.3'
        title: 资本充足性、融资轨迹与估值缺口
        blocks:
          - type: paragraph
            body: >-
              Rapyd 在多阶段融资中筹集了大量股权资本，累计股权融资超过 $957 million，支持者包括 Durable Capital Partners、Target Global、Coatue、General
              Catalyst、Oak HC/FT 和 Stripe。早期融资曾在 2019 年末达到 $1.2 billion 私募名义估值，并在 2021 年 8 月 Series E 达到 $8.75 billion
              峰值，但私募二级市场已下调私营 fintech 股权定价。Nasdaq Private Market 的二级市场数据反映出每股约 $30.40 至 $31.16 的交易指示价，较 2024 年末下跌超过
              21%。此外，Rapyd 是没有公开监管披露的私营公司，审计后总收入、净现金跑道、月度烧钱速度和债务杠杆义务等关键偿付能力指标仍是尽调阻碍。
