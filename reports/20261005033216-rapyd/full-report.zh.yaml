        blocks:
          - type: paragraph
            body: >-
              Rapyd 将自身定位为综合 fintech-as-a-service 平台，把支付、付款、商业账户和发卡整合到一个集成界面，服务全球商业。商户和平台通过单一
              API、软件开发工具包（SDK）、用户界面和第三方插件与 Rapyd 交互，取代碎片化的多供应商网关设置，支持跨境 SaaS、数字市场平台、B2B 平台和零工经济等高潜、高增长垂直领域。主要交易入口 Rapyd
              Collect 支持全渠道支付受理，包括主要卡组织的直接卡收单，以及覆盖 150 多种货币的 900 多种替代支付方式（APM）。Rapyd Disburse 则支持在 190 多个国家、120
              多种本地货币中批量付款，直接连接银行清算系统、本地实时支付（RTP）网络、Visa 和 Mastercard 卡轨道以及第三方数字钱包。通过统一的多币种钱包基础设施、18
              种结算货币和程序化虚拟账户（vIBAN）路由收付款，Rapyd 支持企业资金自动化和实时对账。然而，尽管 Rapyd 声称授权率最高可达 97%、即时开户审批率为
