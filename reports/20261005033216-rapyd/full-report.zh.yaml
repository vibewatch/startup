      - number: '2.3'
        title: 企业买方分层、预算归属与采购触发因素
        blocks:
          - type: paragraph
            body: >-
              全球 fintech 基础设施的企业采购由高潜行业中的技术和财务利益相关者共同参与。首席技术官和工程副总裁团队评估 API
              易用性、开发者文档和集成速度；首席财务官与资金主管则根据外汇波动、营运资金管理和交易费透明度控制预算。需求主要来自跨境电商平台、创作者市场、在线旅行社和数字游戏网络。

              采用通常由国际地域扩张触发：此时国内卡处理的授权拒付率过高，或跨境评估费过重。Rapyd 的客户研究称，快速增长行业中 45% 的企业因支付延迟 2 至 15 天而承受现金流压力，38%
              的企业把快速便利的转账列为首要运营优先事项。因此，当跨境结算摩擦威胁供应商和创作者留存时，买方会从传统代理行网络转向嵌入式 fintech 平台。
            claimRefs:
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 市场增长驱动、结构性约束与运营摩擦
        blocks:
          - type: paragraph
            body: >-
              跨境金融服务市场扩张由两个结构性催化剂推动：实时支付（RTP）在全球普及，以及人工智能融入自动化合规和反欺诈流程。欧洲消费者调查显示，67%
              的欧洲消费者偏好直接银行转账作为付款方式；全球在线转账中超过一半通过本地或替代支付方式完成。另有 38% 的企业预计在未来十二个月采用实时支付，以减轻现金流中断。

              尽管结构性驱动因素有利，运营和监管壁垒仍限制市场快速采用。跨境支付必须应对 AML/KYC 要求、包括 GDPR 和 PDPA
              在内的域外数据隐私法规，以及不同司法辖区的强制制裁筛查。代理行费用、货币转换加价和卡组织国际服务评估费还会制造不可预测的支出，对中端市场企业影响尤其大，持续阻碍其整合到单一供应商。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 结算速度与替代支付广度提升企业赢单率
            body: >-
              全球 fintech 基础设施的企业买方需求已从泛化卡处理转向本地化替代支付受理和快速付款。由于 73% 的高潜数字企业遭遇多日结算延迟，且 67% 的欧洲消费者要求银行转账付款，能通过统一 API
              接入区域支付轨道的平台，相比单一轨道的传统处理商拥有明显竞争优势。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场分层
        blocks:
          - type: paragraph
            body: >-
              全球商业和跨境数字运营要求商户应对碎片化的区域支付生态、不同的监管标准和多样化的消费者支付偏好。在这一环境下，Rapyd 将自身定位为模块化的 Fintech-as-a-Service
              基础设施平台，而非单点网关，覆盖本地支付受理、批量付款、虚拟账户、发卡和资金管理 [CP001]。竞争者分为几类：以 Stripe 为代表的开发者优先型现代支付服务商（PSP）；以 Adyen
              为核心的企业级全球统一商业平台；Global Payments 和 Ingenico 等传统收单及终端巨头；以及 Spreedly 等独立路由层 [CP001, CP002, CP003, CP004]。

              相比 Stripe 等开发者优先的传统厂商，Rapyd 的差异化集中在新兴市场覆盖、广泛的替代支付方式（APM）连接，以及拉丁美洲、亚太、中东欧和中东的本地化付款轨道 [CP001, CP005]。Stripe
              在自助开户、文档质量以及北美和西欧创业生态密度方面明显领先，但新兴市场客户占比较高的商户通常需要 Pix、欧洲银行跳转或区域移动钱包等替代轨道，而标准卡体系只占消费者交易量少数 [CP001,
              CP006]。Adyen 同样主导大型跨国零售和统一 POS 商业，拥有稳定的直接收单牌照；Rapyd 则聚合多司法辖区牌照、本地银行合作和 Valitor、PayU 等收购实体，以打通跨境走廊 [CP001,
              CP007]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP009
      - number: '3.2'
        title: 同业画像、能力与编排模式
        blocks:
          - type: paragraph
            body: >-
              细看竞争者可以发现其商业规模、地理护城河和技术架构差异明显。现代支付编排框架通常分为三类：把路由、开户、收单连接和合规整合到统一托管运营环境的全栈编排平台；为内部工程团队提供路由端点和令牌化的 API
              优先模块化编排层，例如 Spreedly；以及在既有直接商户收单合同上优化授权率的路由引擎 [CP003]。Rapyd 兼具全栈编排和直接基础设施能力，既与传统收单商竞争，也充当收单聚合商 [CP003,
              CP008]。

              相比之下，Global Payments（包括 Heartland、Genius POS 和 Worldpay/企业渠道）拥有巨大的交易处理规模，并深耕成熟零售垂直领域的销售点体系 [CP002,
              CP009]。但多次收购带来了碎片化的后端迁移和不透明的账单费用结构，与跨境数字平台所需的云原生、API 统一模式不同 [CP002, CP010]。在硬件和销售点终端领域，Ingenico 主导终端资产，包括
              AXIUM、TETRA 硬件系列和 SoftPOS 产品，但依靠银行和经销商渠道而非自助云开发者模式，因此无法充分满足需要即时数字化部署的跨境数字平台 [CP004, CP011]。
