  - id: FU001
    title: 客户生命周期与扩张旅程图
    type: journey-map
    summary: 展示客户从多币种入驻，到随交易量扩大的支付方式拓展、稳定币资金管理集成，再到跨境锁定的演进。
    data:
      items:
        - label: 评估与 RFP
          stage: 评估与 RFP
          actor: 金融科技与企业采购团队
          action: Benchmark gateway coverage, PCI-DSS compliance, and SLA guarantees
          touchpoints:
            - 供应商 RFP 评分
            - 开发者沙盒测试
          barrier: Lack of transparent interchange fee schedules and published SLA incident histories
        - label: 入驻与集成
          stage: 入驻与集成
          actor: 工程与合规负责人
          action: Deploy unified API for card acquiring and regional payment methods
          touchpoints:
            - 托管结账页面
            - Webhook 与 API 配置
          barrier: Multi-jurisdictional KYC/AML verification and regional onboarding delays
        - label: 初始生产
          stage: 初始生产
          actor: 商业运营
          action: Process live customer transactions across domestic and core regional routes
          touchpoints:
            - 卡收单通道
            - 商户仪表盘
          barrier: Soft decline retry logic and authorization rate fluctuations
        - label: 通道扩张
          stage: 通道扩张
          actor: 国际产品负责人
          action: Activate local alternative payment methods across 100+ markets
          touchpoints:
            - 900+ 种本地支付方式
            - 多币种账户
          barrier: Cross-border assessment fees, FX spreads, and local regulatory controls
        - label: 资金管理集成
          stage: 资金管理集成
          actor: CFO 与资金管理高管
          action: Incorporate instant payouts and stablecoin settlement rails
          touchpoints:
            - 稳定币解决方案
            - 24/7/365 付款 API
          barrier: Corporate digital asset governance policies and banking partner stability
        - label: 嵌入式平台锁定
          stage: 嵌入式平台锁定
          actor: 平台管理层
          action: Orchestrate split payments, ewallets, and programmatic global seller disbursements
          touchpoints:
            - 电子钱包管理
            - 市场平台分账
          barrier: High switching costs and token portability limitations
    approximationNotes: 综合采购评估框架、技术 API 指南与商户入驻流程。
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU009
