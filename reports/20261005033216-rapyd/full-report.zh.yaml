        blocks:
          - type: paragraph
            body: >-
              Rapyd 的公司治理和战略执行由首席执行官兼联合创始人 Arik Shtilman 主导，并与联合创始人 Omer Priel（副总裁）和 Arkady
              Karpman（首席技术官）协作。管理团队还包括经验丰富的企业 fintech 运营者，如收单合作副总裁 Sarel Tal，以及负责并购整合的 William Nejo；后者牵头在八个目标司法辖区整合 PayU
              的合并后运营。公司对 CEO Arik Shtilman 存在明显的关键人物依赖，他推动了 Rapyd
              的外部融资、高风险并购战略以及向统一平台编排的商业转向。尽管平台合作、产品运营和资金工程团队均有经验丰富的负责人，董事会监督披露和正式独立委员会治理细节仍被私有机构文件严密保留，机构联合投资者需要开展正式尽调。
