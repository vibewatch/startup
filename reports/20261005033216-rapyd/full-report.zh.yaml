      - number: '5.2'
        title: 运营技术栈与数据基础设施
        blocks:
          - type: paragraph
            body: >-
              Rapyd 的核心软件栈和运营架构围绕分布式微服务及企业级数据库韧性构建，目标是消除单点故障。平台应用运行环境建立在 Node.js
              之上，利用其异步执行、高吞吐和跨数据库、支付网络与云端点的集成能力。主要交易数据持久化已从独立的 AWS Amazon RDS 托管数据库实例，重构为在 Amazon EC2 实例上自管的 MySQL
              Enterprise Edition InnoDB Cluster。通过组复制和 MySQL Router 连接共享运行自管 InnoDB 集群，使 Rapyd 转向零停机政策，在机器故障和配置更新期间实现
              100% 数据库韧性。此前需要超过 12 小时维护窗口的数据库架构和机器升级，现在可在数秒内完成且不影响客户。MySQL Enterprise Performance Schema 和 Enterprise
              Monitor 提供查询延迟、资源瓶颈和锁的详细可见性；通过定制存储和 IOPS 配置，云计算资源支出下降 30%。底层基础设施生命周期则由 Terraform 模板、Ansible playbook 和
