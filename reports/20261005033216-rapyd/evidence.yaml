evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-and-financing-terms
    missingEvidence: >-
      Audited credit agreements and debt documents detailing debt facility sizing, interest rate pricing, maturity
      schedules, and financial covenants for 2023-2025 M&A transactions.
    whyItMatters: >-
      Material debt service obligations could constrain operational cash flows and increase downside risk under
      down-round valuation conditions.
    diligencePath: >-
      Request confidential credit agreements, debt repayment schedules, and compliance certificates from Rapyd's finance
      team during data room diligence.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-coverage-TO002
    missingEvidence: >-
      Comprehensive regulatory filing detailing full board of directors composition, independent governance committees,
      and complete executive officer roster.
    whyItMatters: >-
      Table TO002 represents a sample of disclosed executive founders and operational leaders; independent committee
      oversight cannot be confirmed without statutory filings.
    diligencePath: >-
      Inspect Rapyd UK Companies House filings, statutory annual returns, and data room corporate governance records to
      map complete board and officer appointments.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-investor-cap-table-TO003
    missingEvidence: >-
      Fully diluted cap table schedules disclosing exact share class counts, series-by-series liquidation preferences,
      seniority waterfall, and conversion ratios.
    whyItMatters: >-
      Table TO003 enumerates a sample of major institutional leads; precise downside recovery under reported $3.5B
      down-round conditions depends on exact preferred rights.
    diligencePath: >-
      Obtain fully diluted cap table and investor rights agreement from Rapyd's counsel during confirmatory investment
      diligence.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: tam-take-rate
    missingEvidence: >-
      Audited merchant payment volume and standalone Rapyd take-rate breakdown across payment acceptance, mass payouts,
      and FX conversion services.
    whyItMatters: >-
      Without segmented volume and take-rate disclosures, precise serviceable obtainable market (SOM) calculations
      cannot be distinguished from aggregate gross payment volume.
    diligencePath: >-
      Request audited revenue bridges, merchant take-rate schedules, and transaction volume breakdowns during formal
      management diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: blocking
    topic: undisclosed-financial-performance
    missingEvidence: >-
      Audited financial statements detailing gross payment volume (GMV), net revenue, gross margin, operating expenses,
      and cash burn.
    whyItMatters: >-
      Without audited financial statements, underwriting Rapyd's profitability path, unit economics sustainability, and
      solvency runway is impossible.
    diligencePath: >-
      Request audited annual financial statements, management discussion of net take-rates, and trailing twelve-month
      cash flow reports under non-disclosure agreement.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sla-and-pricing-transparency
    missingEvidence: Audited multi-year platform uptime SLA logs, error budgets, and itemized interchange-plus gateway fee schedules.
    whyItMatters: >-
      Enterprise underwriters require verified service level guarantees and transparent unit economics to assess
      technical reliability and net transaction margin defensibility.
    diligencePath: >-
      Request customer master service agreements (MSAs) and technical SLA addenda covering platform availability and
      corridor-specific pricing tiers.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-rates
    missingEvidence: Audited net revenue retention (NRR), gross revenue retention (GRR), and logo churn rates across merchant tiers.
    whyItMatters: >-
      Without retention figures, investors cannot determine whether rapid volume growth is masking high underlying
      merchant turnover.
    diligencePath: Request confidential historical cohort retention schedules from Rapyd investor relations and management.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: top-customer-concentration
    missingEvidence: Percentage of processing volume and net revenue generated by Rapyd's top 5 and top 10 merchants.
    whyItMatters: >-
      High customer concentration creates severe downside risk if a major marketplace or merchant churns or migrates to
      in-house rails.
    diligencePath: >-
      Review customer concentration tables in the confidential information memorandum during pre-IPO or financing
      diligence.
    relatedQuestionRefs:
      - QU008
  - type: access-blocked
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Audited multi-jurisdictional regulatory examination reports and capital adequacy ratios across Rapyd's regional
      acquiring and payment entities (including Valitor and PayU GPO subsidiaries).
    whyItMatters: >-
      Without primary regulatory inspection records, compliance posture and capital safeguarding buffer health cannot be
      verified independently.
    diligencePath: >-
      Request regulatory inspection letters, supervisory correspondence, and safeguarding audit reports under NDA in
      data room diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: debt-financing-covenants
    missingEvidence: >-
      Full credit agreements, debt facilities, covenants, interest terms, and lender controls governing Rapyd's M&A
      transactions.
    whyItMatters: >-
      Opaque debt structures and potential minimum cash or EBITDA covenants could constrain liquidity or trigger
      accelerated repayment in downside scenarios.
    diligencePath: Review executed credit facility documentation and bank covenant compliance certificates directly from management.
    relatedQuestionRefs:
      - QR010
  - type: private-evidence-only
    severity: material
    topic: debt-and-cash-burn-transparency
    missingEvidence: >-
      Audited loan agreements, covenant constraints, interest rate spreads, and maturity schedules for the March 2025
      $250 million debt facility.
    whyItMatters: >-
      Debt service requirements directly constrain equity free cash flow and increase downside risk during operating
      downturns.
    diligencePath: >-
      Obtain credit agreements and compliance certificates under formal non-disclosure agreement during pre-investment
      diligence.
    relatedQuestionRefs:
      - QV010
  - type: missing-source
    severity: material
    topic: standalone-revenue-and-take-rate-bridge
    missingEvidence: >-
      Audited post-PayU consolidated revenue breakdown distinguishing organic Rapyd take-rates from acquired GPO
      transaction processing fees.
    whyItMatters: >-
      Gross processing volume does not equate to net high-margin revenue; fee compression heavily influences justifiable
      valuation multiples.
    diligencePath: >-
      Request management presentation with audited historical financial statements and bridge to combined pro-forma
      EBITDA.
    relatedQuestionRefs:
      - QV010
