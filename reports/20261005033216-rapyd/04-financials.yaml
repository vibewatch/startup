callouts:
  - calloutType: "risk"
    title: "Intermediary Banking Tolls and Compliance Overhead Squeeze Margins"
    body: "Cross-border payment infrastructure is not frictionless high-margin software. Correspondent banking fees, international card scheme assessments, and continuous AML/KYC compliance monitoring consume substantial portions of gross transaction take-rates. Without large-scale internal net-clearing efficiency, gross margins remain vulnerable to third-party rail pricing and evolving jurisdictional compliance burdens."
    claimRefs:
      - "CI006"
      - "CI007"
  - calloutType: "insight"
    title: "Secondary Market Valuation Compression Reflects Post-2021 Tech Repricing"
    body: "Rapyd's capital trajectory illustrates the broader repricing across late-stage private fintech. While 2021 funding reached an $8.75 billion peak, secondary market indications on private exchanges show shares trading around $30.40 to $31.16, down over 21% since 2024. Investors underwriting fresh capital must treat historical peak valuations as obsolete and demand fully audited cash burn and runway disclosures."
    claimRefs:
      - "CI010"
      - "CI012"
      - "CI013"
