callouts:
  - calloutType: "insight"
    title: "The Inorganic Scale Paradox"
    body: "Rapyd's acquisition of PayU GPO for $610M instantly elevated its operational footprint to over $100B in projected annual transaction volume and $1.1B in 2025 revenue. However, acquiring transaction scale in emerging markets does not automatically resolve customer disclosure gaps regarding organic net revenue retention, churn rates, or client concentration."
    claimRefs:
      - "CU003"
      - "CU010"
      - "CU012"
  - calloutType: "risk"
    title: "Enterprise Valuation Multiple Compression"
    body: "Despite reporting $100B+ processing scale and over 1,600 employees, Rapyd's pursuit of a $300M funding round at a $3.5B valuation represents a steep 61% decline from its $9B peak mark in 2021. For prospective enterprise customers assessing long-term counterparty risk, private valuation compression highlights broader fintech liquidity scrutiny."
    claimRefs:
      - "CU007"
      - "CU011"
