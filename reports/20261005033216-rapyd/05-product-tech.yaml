chapter:
  number: 5
  title: "Product & Technology"
  summary: "Rapyd delivers an enterprise fintech-as-a-service infrastructure spanning card acquiring, global payouts across 190+ countries, multi-currency wallet accounts, and business card issuing. Technical disclosures confirm a cloud-native distributed architecture operating on Node.js and distributed MySQL InnoDB Clusters, supported by AI-native transaction monitoring and automated onboarding, though corridor-level pricing schedules and third-party reliability SLA audits remain undisclosed."
sections:
  - id: "product-surface-and-service-definition"
    title: "Product Surface and Customer Workflow Architecture"
    body: "Rapyd positions itself as a comprehensive fintech-as-a-service platform designed to liberate global commerce by unifying payments, payouts, business accounts, and card issuing into a single integration surface. In customer workflow terms, merchants and platforms interact with Rapyd via a single API, software development kits (SDKs), user interfaces, and third-party plugins. This unified interface replaces fragmented multi-vendor gateway setups and enables end-to-end commerce operations across high-opportunity and high-growth verticals, including cross-border software-as-a-service (SaaS), digital marketplaces, B2B platforms, and the gig economy. The primary transaction intake surface, Rapyd Collect, supports omni-channel payment acceptance encompassing direct card acquiring across major card schemes and over 900 alternative payment methods (APMs) across 150+ currencies. In parallel, Rapyd Disburse facilitates mass payouts and disbursements across 190+ countries in 120+ local currencies, linking directly into bank clearing systems, local real-time payment (RTP) networks, card rails via Visa and Mastercard networks, and third-party digital wallets. By routing inbound pay-ins and outbound disbursements through a unified multi-currency wallet infrastructure supporting 18 settlement currencies and programmatic virtual accounts (vIBANs), Rapyd enables corporate treasury automation and real-time reconciliation. However, while Rapyd claims authorization rates up to 97% and 80% instant onboarding approvals, comprehensive country-by-country gateway take-rates and transaction pricing schedules remain unpublished."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "operating-architecture-and-stack-infrastructure"
    title: "Operating Stack and Data Infrastructure"
    body: "Rapyd's core software stack and operating architecture are engineered around distributed microservices and enterprise database resilience designed to eliminate single points of failure. The platform's application runtime environment is built on top of Node.js, chosen for its asynchronous execution, high throughput, and seamless integration capabilities across databases, payment networks, and cloud endpoints. Primary transactional data persistence was re-architected from standalone AWS Amazon RDS managed database instances to a self-managed MySQL Enterprise Edition InnoDB Cluster deployment on Amazon EC2 instances. Operating self-managed InnoDB clusters with group replication and MySQL Router connection sharing enabled Rapyd to transition toward a zero-downtime policy, delivering 100% database resilience during machine failures and configuration updates. Furthermore, database schema and machine upgrades that previously required maintenance windows exceeding 12 hours can be completed in seconds without customer disruption. Detailed visibility into query latencies, resource bottlenecks, and locks is maintained via MySQL Enterprise Performance Schema and Enterprise Monitor, yielding a 30% reduction in cloud compute resource expenditures through customized storage and IOPS provisioning. The underlying infrastructure lifecycle is automated via Terraform templates for EC2 instance orchestration, Ansible playbooks for standardized cluster configuration management, and Jenkins CI/CD automation pipelines maintained by distributed backend engineering teams."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "security-trust-controls-and-differentiation"
    title: "Security Controls, Compliance Defense, and Platform Differentiation"
    body: "Rapyd operates under strict international financial security standards, maintaining certified PCI-DSS Level 1 compliance, SOC 2 Type 2 attestation, and GDPR compliance across its global processing network. Its dedicated risk and compliance suite, marketed as Rapyd Defence, provides automated Know Your Business (KYB) and Know Your Customer (KYC) onboarding verifications alongside real-time transaction monitoring and dispute management. To combat escalating financial crime across high-risk sectors such as online gaming, digital entertainment, and cross-border digital commerce, the platform embeds machine learning models and computer vision document verification directly into payment execution flows. Real-time transaction monitoring contextualizes payment behavior to mitigate fraud, prevent transaction laundering, and optimize authorization rates while minimizing chargeback liabilities. At the database layer, MySQL Enterprise Edition tools enforce data masking, transparent encryption, and granular access permissions to protect cardholder information and sensitive account data. Platform differentiation centers on Rapyd's combined acquiring and issuing licenses across 40+ countries—expanding toward 50+ emerging markets—and direct principal membership with Visa and Mastercard. However, third-party audited incident rates, public uptime status dashboards, and specific false-positive metrics for automated fraud filters remain opaque in public documentation."
    claimRefs:
      - "CE015"
      - "CE016"
    calloutRefs: []
