  topStrengths:
    - Verified global acquiring and payout infrastructure across a broad multi-rail footprint.
    - Meaningful inorganic scale from the Valitor and PayU acquisitions.
    - Optionality from stablecoin settlement, treasury, and embedded finance workflows.
  topRisks:
