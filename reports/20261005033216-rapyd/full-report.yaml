  - id: TV001
    title: Recommendation summary table
    columns:
      - Evaluation Dimension
      - Assessment Stance
      - Supporting Evidence
      - Key Risks & Caveats
      - Decision Implication
    rows:
      - - Recommendation
        - TRACK
        - Extensive global infrastructure across 100+ markets with established $100B+ volume ambition
        - Unverified standalone profitability, debt covenants, and opaque private disclosure
        - Monitor integration execution and wait for verified financial disclosures before capital commitment
      - - Confidence
        - Medium
        - Corroborated Series F equity financing, debt records, and extensive acquisition footprint
        - Lack of primary regulatory filings and audited revenue or burn figures
        - Maintain analytical discipline; avoid aggressive position sizing
      - - Risk Rating
        - High
        - M&A integration across PayU/Valitor, correspondent bank toll drag, and secondary discounts
        - Multi-jurisdiction regulatory compliance and complex cross-border liquidity management
        - Require downside protections and structured liquidation rights in any transaction
      - - Valuation Stance
        - Fair
        - $4.5B Series F valuation mark reflects substantial reset from $8.75B Series E peak
        - High revenue multiples (92.9x) on unverified net revenues leave little margin of safety
        - Insist on strict entry price discipline below or at current Series F equity valuation mark
    notes: >-
