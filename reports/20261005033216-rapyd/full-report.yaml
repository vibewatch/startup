      - number: '5.2'
        title: Operating Stack and Data Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Rapyd's core software stack and operating architecture are engineered around distributed microservices and
              enterprise database resilience designed to eliminate single points of failure. The platform's application
              runtime environment is built on top of Node.js, chosen for its asynchronous execution, high throughput,
              and seamless integration capabilities across databases, payment networks, and cloud endpoints. Primary
              transactional data persistence was re-architected from standalone AWS Amazon RDS managed database
              instances to a self-managed MySQL Enterprise Edition InnoDB Cluster deployment on Amazon EC2 instances.
              Operating self-managed InnoDB clusters with group replication and MySQL Router connection sharing enabled
              Rapyd to transition toward a zero-downtime policy, delivering 100% database resilience during machine
              failures and configuration updates. Furthermore, database schema and machine upgrades that previously
              required maintenance windows exceeding 12 hours can be completed in seconds without customer disruption.
              Detailed visibility into query latencies, resource bottlenecks, and locks is maintained via MySQL
              Enterprise Performance Schema and Enterprise Monitor, yielding a 30% reduction in cloud compute resource
              expenditures through customized storage and IOPS provisioning. The underlying infrastructure lifecycle is
              automated via Terraform templates for EC2 instance orchestration, Ansible playbooks for standardized
              cluster configuration management, and Jenkins CI/CD automation pipelines maintained by distributed backend
              engineering teams.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
