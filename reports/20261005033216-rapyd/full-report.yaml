  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation / Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Seamless PayU integration, rapid stablecoin payout adoption, expanding enterprise take-rates
        - $6.5B - $8.0B valuation exit via successful London/US IPO at 12x-15x net revenue multiple
        - Platform outages, card scheme fines, or antitrust/licensing delays in emerging markets
        - 25% (Requires flawless post-merger execution and supportive public tech markets)
      - - Base Case
        - Steady 15-20% volume growth, ongoing correspondent fee pressure, stable market share
        - $4.0B - $5.0B valuation hold around current Series F mark ($4.5B) with modest return
        - Multiple compression across fintech peers and delayed enterprise procurement cycles
        - 50% (Consistent with current private market secondary pricing and Series F round terms)
      - - Bear Case
        - Integration friction, merchant churn post-PayU, regulatory scrutiny, debt covenant breach
        - $2.0B - $3.0B distressed sale or recapitalization representing 35-55% downside from Series F
        - Inability to service $250M debt facility or customer loss to Stripe/Adyen
        - 25% (Reflects steep down-round discussions and private fintech liquidity strain)
    notes: >-
      Scenario models account for $250M debt facility obligations, $4.5B Series F post-money valuation, and public comp
      multiples.
