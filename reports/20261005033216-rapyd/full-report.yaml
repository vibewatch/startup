            body: >-
              Despite reporting $100B+ processing scale and over 1,600 employees, Rapyd's pursuit of a $300M funding
              round at a $3.5B valuation represents a steep 61% decline from its $9B peak mark in 2021. For prospective
              enterprise customers assessing long-term counterparty risk, private valuation compression highlights
              broader fintech liquidity scrutiny.
            calloutType: risk
            claimRefs:
