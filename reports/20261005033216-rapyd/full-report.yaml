      - number: '6.3'
        title: Customer Deployments, Retention Durability, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Publicly referenced commercial deployments demonstrate production utility across distinct vertical niches,
              ranging from retail store point-of-sale modernization to cross-border financial operations [CU004, CU005,
              CU008]. Named client case studies highlighted by the company include investment platform GoTrade for local
              payment method expansion, maritime operations fintech Kadmos for cross-border payroll disbursements,
              public transit payment specialist Littlepay for fare collection, and financial consultancy Alcaston for
              emerging market onboarding [CU005, CU008]. Furthermore, retail chains such as Bagel Factory utilize
              Rapyd's merchant acquiring across 35 branch locations to eliminate processing friction and transaction
              failure rates [CU004]. Despite these referenced integrations, independent vendor evaluations highlight
              operational vulnerabilities: procurement buyers evaluate Rapyd against stringent uptime service level
              agreements, while cross-border merchants encounter correspondent bank fees, currency volatility, and
              evolving compliance frictions [CU006, CU009]. The platform's durability remains vulnerable to undisclosed
              customer churn rates, enterprise account concentration, and reliance on marketing testimonials over
              audited cohort disclosures [CU012].
            claimRefs:
