      - number: '6.2'
        title: Adoption Trajectory and Processing Scale
        blocks:
          - type: paragraph
            body: >-
              Rapyd's commercial adoption trajectory is anchored in massive inorganic payment processing volume
              expansion following its acquisition of PayU's Global Payment Organisation for approximately $610 million
              [CU003, CU010]. According to executive leadership, total processed annual transaction volume is projected
              to reach approximately $100 billion in 2025 and $150 billion in 2026, supported by an expanded operational
              presence in Central and Eastern Europe and Latin America [CU003, CU010]. To accelerate corporate treasury
              and high-velocity B2B settlement, Rapyd launched Stablecoin Payment Solutions enabling enterprises to
              bypass traditional SWIFT and ACH correspondent clearing networks [CU002, CU006]. However, this reported
              transaction volume trajectory has occurred alongside external funding headwinds, including an attempted
              down-round equity raise at a $3.5 billion valuation—down steeply from its $9 billion peak valuation in
              2021—underscoring that gross processing volume does not shield the platform from macroeconomic multiples
              compression or private market liquidity constraints [CU007, CU011].
            claimRefs:
              - CU002
