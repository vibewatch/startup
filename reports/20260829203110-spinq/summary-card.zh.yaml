  topStrengths:
    - NMR 与超导量子系统双路线定位少见，SpinQ 的产品可选项比许多单模态同行更宽。
    - 2026H1 快速融资，加上国资和产业相关投资人底座，释放出战略相关性和长期资本可得性。
    - 公开证据支持公司在教育硬件、出口系统、云访问和软件工具上已有真实商业化界面，而不只是实验室主张。
    - 如果国产量子产业化加速，中国制造和平台集成可能变成优势。
  topRisks:
    - 公开来源仍未披露审计收入、毛利率、现金消耗或股权结构条款，估值精度很弱。
    - 具名客户证据在教育和科研端强得多，在可复制的工业量产部署上仍不足。
    - 量子品类估值波动大、被里程碑牵引，商业化证据一旦落空，价格可能快速压缩。
    - 资本强度、政策敏感性、出口或海外支持约束，可能同时伤到承销逻辑。
  unresolvedGaps:
    - 2026 年各轮融资的确切投后估值、摊薄后持股和清算优先权。
    - FY2025 和 FY2026 审计财务报表，含分部收入和毛利率明细。
    - 云服务或 SpinQit 经常性变现证据，包括付费使用、续约和附加率。
    - 超导系统的具名工业在手订单、复购和试点转量产证据。
    - 具体上市前退出准备材料，证明任何 pre-IPO 路径是否真实、有时间表且治理就绪。
