- id: differentiation-and-trust-controls
  title: Differentiation, trust, and product-control gaps
  body: SpinQ’s clearest differentiation is not a single benchmark claim but the architecture of its offering. Very few peers combine room-temperature NMR teaching systems, full-stack software, cloud access, private-cloud deployment, and an industrial superconducting roadmap under one brand. That can matter a great deal in education-heavy markets and in China-centered procurement settings where a complete domestic stack carries strategic value. But trust and control evidence is noticeably thinner than the company’s product marketing. The reviewed pages show after-sales support, training, monitoring, and private deployment language, yet they do not provide public enterprise-grade security or reliability disclosures comparable to mature infrastructure vendors. Even the user-agreement and privacy-policy links on the Chinese site surfaced as broken in review, which is not catastrophic but is a small warning sign on product-surface polish and governance hygiene. The net assessment is that SpinQ’s
    technical differentiation is real, but its public trust, quality, and compliance surface still looks underdeveloped relative to the ambition of the stack.
