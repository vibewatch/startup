- id: architecture-and-operating-model
  title: Architecture and operating model
  body: 'SpinQ’s public materials show a credible full-stack operating model. Hardware begins with NMR education devices and extends to superconducting systems and QPU roadmap work. Software is anchored by SpinQit, which supports Python, Qiskit syntax, OpenQASM 2.0, classical-quantum hybrid workflows, CPU and GPU simulators, and multiple execution targets including local hardware and the cloud platform. The private-cloud service adds a deployment layer with customized architecture, resource scheduling, monitoring, and higher-security institutional environments. That means SpinQ’s technical architecture is not just a machine; it is a layered system: user interface and teaching resources, programming and simulation framework, cloud or private-cloud orchestration, and physical hardware back ends. This breadth is strategically attractive because it lets customers start with software or education devices and later connect into more advanced infrastructure. It also creates technical dependency
    complexity. Maintaining compilers, simulators, hardware integrations, cloud reliability, and on-prem support at the same time is substantially harder than shipping a single-purpose device.'
