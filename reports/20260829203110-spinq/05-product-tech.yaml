- id: deployment-maturity-and-roadmap
  title: Deployment, maturity, support, and roadmap
  body: 'Public evidence supports real deployment maturity in parts of the stack, but not uniformly. The strongest signs of maturity are around the education-facing NMR systems and developer tooling. Those products are concrete, documented, and tied to specific learning, experimentation, and programming workflows. PyPI data shows SpinQit had a 0.2.4 beta release in April 2026 with wheels for Linux, Windows, and macOS, which is meaningful practitioner evidence that the software is packaged for external use rather than only described in marketing prose. Another sign of maturity is overseas delivery of a superconducting system, which shows that at least some hardware is moving outside internal labs. At the same time, the roadmap remains asymmetric. Independent reporting describes 25-qubit and 103-qubit superconducting QPU validation plus error-correction-related milestones, but SpinQ still provides less transparent benchmark, uptime, and roadmap disclosure than IBM, IonQ, Quantinuum, or Rigetti.
    The maturity verdict is therefore mixed: SpinQ is clearly beyond concept stage, yet the most technically ambitious part of the portfolio still requires deeper diligence on reproducibility, supportability, and performance.'
