- id: gtm-motion-and-unit-economics
  title: GTM motion and unit-economics proxies
  body: 'Public evidence is thin on CAC, sales productivity, payback, or channel economics, so the financial analysis has to rely on directional GTM proxies. SpinQ’s NMR products are positioned for universities, teaching labs, and research training, which usually implies consultative but shorter-cycle selling than sovereign or industrial superconducting deployments. The company’s private-cloud and industrial-system offers suggest a much longer enterprise cycle with technical pre-sales, customization, procurement review, and post-installation service work. That points to at least two very different go-to-market motions inside one company. Educational products may support broader top-of-funnel reach and more standardized packaging, while superconducting systems likely require far higher sales effort per deal but also much larger ticket sizes. The unit-economics question is whether software, cloud access, maintenance, and training are large enough to offset the irregularity of hardware project
    revenue. Public sources do not answer that. They do, however, show the mechanisms that could matter: attachment of SpinQit, cloud usage, deployment support, and repeat academic or institutional purchasing. As a result, SpinQ’s GTM looks potentially sensible, but not yet measurable from disclosed data.'
