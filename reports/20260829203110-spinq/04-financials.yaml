chapter:
  number: 4
  title: Financials
  summary: SpinQ’s revenue architecture looks diversified across education hardware, superconducting systems, cloud access, private-cloud deployments, and software tooling, but public disclosure remains far below what an investor would normally require to underwrite revenue quality or runway. The strongest public evidence supports capital intensity and product breadth, not audited operating performance. The practical conclusion is that SpinQ may have multiple monetization paths, yet investors still need private data on revenue mix, gross margin, backlog, burn, and renewal behavior before treating the company as financially underwritten.
sections:
- id: revenue-streams-and-recognition
  title: Revenue streams and recognition complexity
  body: SpinQ’s product catalog strongly suggests a mixed revenue model rather than a single-line hardware business. The company sells or markets portable NMR systems such as Gemini Mini, desktop NMR systems such as Triangulum, the Gemini Lab experimental platform, superconducting quantum systems, a cloud quantum computing platform, private-cloud deployment services, and the SpinQit development framework. That mix matters because each line probably carries different contract value, implementation burden, and recognition timing. Educational NMR units can likely close as product sales with attached training or support. Superconducting systems more likely resemble solution deals with milestones, installation, acceptance, and after-sales obligations. Private-cloud deployments appear service-heavy and could involve customization, integration, and ongoing support. Software and cloud access could create the best recurring-revenue path, but public evidence does not quantify usage, conversion, or
    average contract size. The result is a plausible but unproven multi-stream revenue architecture. Investors should avoid treating SpinQ like a clean SaaS company or a pure device OEM; it appears to be a blended hardware, software, and services business whose accounting quality cannot yet be verified from public materials.
