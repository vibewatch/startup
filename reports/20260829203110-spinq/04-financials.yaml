- id: TI005
  title: Public financial gaps table
  columns:
  - missing metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Annual revenue and segment mix
    - Cannot judge scale or dependence on any one product
    - Request audited annual revenue by line and geography
  - - Recurring revenue share
    - Cannot distinguish project revenue from durable subscriptions/support
    - Request ARR, maintenance, and cloud recurring share
  - - Gross margin by line
    - Cannot model profitability path
    - Request gross margin by hardware, software, and services
  - - Backlog and pipeline conversion
    - Cannot test whether signed demand covers roadmap burn
    - Request qualified backlog and conversion history
  - - Cash balance and burn
    - Cannot estimate runway
    - Request monthly cash bridge for 24 months
  - - Customer concentration
    - Cannot assess dependence on a few universities or strategic buyers
    - Request top-20 customer concentration table
  - - Renewal / churn / NRR
    - Cannot test whether cloud or support revenue is sticky
    - Request renewal cohorts and churn by line
  - - Capex and inventory intensity
    - Cannot judge future financing need
    - Request capex plan, inventory policy, and vendor terms
  notes: These are the minimum missing data points that prevent an investment-grade financial underwriting case.
