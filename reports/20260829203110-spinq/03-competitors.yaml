chapter:
  number: 3
  title: Competitors
  summary: 'SpinQ competes in several different arenas at once: against frontier full-stack quantum companies such as Quantinuum, IonQ, Rigetti, IBM, and Origin Quantum; against Chinese strategic peers in the domestic ecosystem; and against non-quantum substitutes such as classical HPC and optimization software. Its clearest differentiation is a dual-track NMR-plus-superconducting product strategy, but better-funded peers still hold major advantages in disclosure depth, enterprise proof, and platform scale.'
sections:
- id: competitive-set
  title: Competitive set and strategic positioning
  body: 'SpinQ does not face a single clean competitor set because its business spans educational NMR systems, superconducting quantum hardware, software, and cloud access. The most relevant direct quantum peers are full-stack hardware-software vendors such as Quantinuum, IonQ, Rigetti, IBM Quantum, D-Wave, and Origin Quantum. Within China, Origin Quantum is the most obvious domestic full-stack peer on superconducting systems, while broader ecosystem players like QuantumCTek, Tencent Quantum Lab, and other state-backed organizations compete for mindshare, policy support, and procurement access. In educational access, SpinQ’s desktop NMR systems occupy a more unusual niche: they compete less against hyperscale frontier machines and more against simulators, lab courseware, and alternative routes to hands-on quantum learning. This layered competition matters because SpinQ’s strongest pitch is not absolute frontier leadership. It is a combination of accessibility, hardware breadth, and China-centered
    commercialization. The right question is therefore not whether SpinQ is bigger than IonQ or IBM; it is whether SpinQ owns a distinctive portion of the market where portable education, research onboarding, and sovereign superconducting capability intersect.'
