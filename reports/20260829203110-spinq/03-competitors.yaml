  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Verified public list pricing or standard contract structures for SpinQ and key peers.
    whyItMatters: Packaging is visible, but price transparency is too thin to compare acquisition friction or unit economics directly.
    diligencePath: Request commercial proposals, average deal sizes, and deployment pricing by product family.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Retention, NRR, renewal, and contract-duration data for SpinQ’s education and superconducting businesses.
    whyItMatters: Switching-cost claims remain mostly qualitative without evidence of durable revenue retention.
    diligencePath: Request customer cohort, renewal, and support-contract data by segment.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: A ranked customer list and revenue contribution by account for SpinQ versus comparable public peers.
    whyItMatters: A company can look competitively broad while still depending on a handful of institutions or projects.
    diligencePath: Request top-20 account revenue, deployment status, and renewal likelihood.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: performance benchmarking
    missingEvidence: A standardized benchmark set comparing SpinQ’s systems directly with trapped-ion, superconducting, and annealing peers on relevant workloads.
    whyItMatters: Modality differences make apples-to-apples competitive claims difficult from marketing pages alone.
    diligencePath: Run workload-specific benchmark diligence on educational, optimization, and simulation tasks.
    relatedQuestionRefs:
    - QP008
    - QP025
    relatedTableRefs:
    - TP002
  - type: missing-source
    severity: minor
    topic: broader substitute set
    missingEvidence: More direct evidence on classical optimization, AI, and HPC substitutes that displace quantum budgets today.
    whyItMatters: The most important competitor may still be “do nothing” or “stay classical” in many workloads.
    diligencePath: Interview buyers who chose simulators, classical HPC, or SaaS tools instead of quantum hardware.
    relatedQuestionRefs:
    - QP013
    relatedTableRefs:
    - TP001
