  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited economics disappoint
        - Private diligence shows weak take rates, low gross margins, or no durable profitability path.
        - Base and bull cases compress because current narrative premium depends on hidden economic quality.
        - Move to avoid or demand a reprice toward the bear range.
      - - Cloud / software monetization is mostly strategic
        - Paid usage, renewal, or attach rates are immaterial.
        - Removes one of the key reasons to value SpinQ as more than a lumpy hardware project business.
        - Cut premium assumptions and re-underwrite around hardware-only logic.
      - - Industrial backlog is thinner than implied
        - Named enterprise demand proves small, pilot-like, or non-repeatable.
        - Customer-quality signal weakens and valuation multiple should contract.
        - Pause investment until repeat production demand is demonstrated.
      - - Late-stage financing terms are investor-unfriendly
        - Ratchets, preferences, or governance constraints absorb economics ahead of common-equity headlines.
        - Headline valuation stops mapping to effective new-investor value.
        - Re-underwrite on fully diluted and net-economics terms.
      - - Policy or export sensitivity worsens
        - New restrictions, slower overseas delivery, or policy shocks reduce addressable commercial pathways.
        - Raises discount rate and lowers confidence in bull-case international scaling.
        - Hold or step back until exposure is clearer.
    notes: >-
      Triggers are framed as monitorable events that would directly alter valuation support, not as generic operating
      concerns.
    claimRefs:
      - CV032
      - CV037
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Audited financials
        - FY2025 and FY2026 revenue, gross margin, operating loss, and cash-flow statements
        - Core prerequisite for any direct valuation work beyond scenario triangulation
        - Request audit package, board-approved accounts, and monthly management reporting bridge.
      - - Segment economics
        - Revenue, gross margin, and support burden by NMR, superconducting, cloud, private cloud, and software
        - Shows whether breadth creates value or masks weak lines
        - Request product-family P&L and contribution-margin bridge.
      - - Recurring monetization
        - Paid cloud usage, SpinQit monetization, support renewal, and cohort retention data
        - Tests whether SpinQ has high-quality recurring value under the hardware story
        - Request cohort tables, renewal schedules, and attach-rate data.
      - - Industrial demand quality
        - Named pipeline, backlog, repeat orders, and conversion rates for superconducting systems
        - Separates demos and pilots from real enterprise valuation support
        - Request top-20 opportunity list and shipment-to-revenue bridge.
      - - Cap table and preferences
        - Ownership, board rights, liquidation preferences, ratchets, and anti-dilution terms
        - Headline valuation may differ sharply from effective entry economics
        - Review dataroom cap table and counsel summary.
      - - Exit readiness
        - Audit readiness, governance infrastructure, and any real pre-IPO timetable
        - Determines whether valuation can migrate toward a public-market evidence standard
        - Request governance memo, auditor status, and listing-workstream materials.
    notes: >-
      These are the minimum diligence conditions for moving SpinQ from “interesting late-stage quantum platform” to
      “buyable at a disciplined price.”
    claimRefs:
      - CV004
      - CV006
      - CV025
      - CV033
      - CV040
