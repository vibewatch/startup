  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision flow linking SpinQ’s financing scale, platform breadth, disclosure gap, public comp discipline, and final
      recommendation.
    data:
      nodes:
        - id: n1
          label: Late-stage funding is real
          detail: RMB 1B Series D and RMB 2B raised over six months prove serious capital access.
        - id: n2
          label: Platform breadth is unusual
          detail: NMR, superconducting, cloud, private cloud, and software create multiple monetization narratives.
        - id: n3
          label: Commercial proof exists but skews academic
          detail: Named customers and overseas deployment matter, yet public proof remains education-heavy.
        - id: n4
          label: Disclosure gap remains large
          detail: No public audited revenue pack, no cap table, and no primary-source post-money valuation.
        - id: n5
          label: Public comps permit billion-dollar values
          detail: IonQ, Rigetti, and D-Wave show that the category can clear large marks despite thin current profits.
        - id: n6
          label: 'Recommendation: track / research-more'
          detail: Interesting asset, but price must stay disciplined until proof catches up.
        - id: n7
          label: Upgrade path
          detail: Audited economics, better customer-quality proof, and clean terms can move the call higher.
