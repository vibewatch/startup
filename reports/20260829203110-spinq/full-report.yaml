        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The core financial question is not whether SpinQ has products to sell; it clearly does. The problem is
              that public disclosure does not reveal enough to judge revenue quality, margin profile, or financing
              dependency with confidence. Investors do not know annual revenue, recurring revenue share, gross margin by
              line, backlog conversion, implementation cost, renewal behavior, or monthly cash burn. Even comparison
              with public peers cuts both ways. IonQ shows that quantum companies can scale revenue into nine figures
              and still remain deeply investment-led, while Rigetti and D-Wave show how revenue can stay small and
              volatile relative to market value. Those comps support the idea that SpinQ may need large, repeated
              financing long before the business reaches self-funding scale. The good news is that SpinQ appears to have
              more than one monetization lever and a meaningful China-centered capital base. The bad news is that,
              absent private data, the underwriting case remains structurally incomplete. Financially, SpinQ looks
              promising enough to continue diligence, but not transparent enough to clear an investment committee on
              public information alone.
