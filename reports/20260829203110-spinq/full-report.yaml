      - number: '3.3'
        title: Pricing, packaging, distribution, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              Public pricing across quantum computing remains surprisingly opaque, and SpinQ is no exception. Most
              reviewed companies route buyers toward quote-based system sales, cloud access, or partnership-led
              deployments rather than simple list prices. Even so, packaging differences are visible. SpinQ’s education
              offer bundles equipment, resources, and training; its cloud and software layers lower the threshold for
              onboarding; and its superconducting systems appear to be sold as integrated solutions rather than
              component-only offerings. Quantinuum emphasizes hardware-as-a-service across on-premise and cloud
              delivery, IBM emphasizes fleet access through platform and network membership, IonQ distributes through
              major clouds and enterprise partnerships, and D-Wave commercializes through Leap cloud access, hybrid
              solvers, and optimization-oriented solutions. These differences shape switching costs. SpinQ can create
              lock-in when a university standardizes labs, curricula, or tooling around Gemini, Triangulum, or SpinQit.
              But cloud-based access also lowers switching costs for casual or exploratory users, especially when
              competitors expose machines through popular public-cloud channels. In other words, SpinQ’s packaging helps
              acquisition and onboarding, but it does not guarantee the harder kind of lock-in associated with audited
              multi-year enterprise software revenue.
