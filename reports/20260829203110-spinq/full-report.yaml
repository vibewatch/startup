      - number: '1.2'
        title: Founder profile, leadership concentration, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              SpinQ’s public identity is heavily concentrated around founder and chief executive Dr. Jingen Xiang.
              Official financing releases, Seedtable’s company profile, and 36Kr’s April 2026 report all identify Xiang
              as founder and CEO, while 36Kr adds a detailed technical pedigree: Tsinghua physics training, a Harvard
              postdoctoral stint, and more than fifteen years of quantum-computing R&D experience. That background helps
              explain why the company is comfortable competing in two technology routes at once and why investors appear
              to underwrite the team as a deep-tech execution group rather than a software start-up. Public disclosure
              beyond Xiang is thinner. Seedtable surfaces only a small leadership bench, listing SVP/CTO Tiejun Meng and
              Senior Scientist Guanru Feng, while the official website emphasizes the academic quality of the broader
              founding team rather than a fully disclosed board or independent-governance structure. For diligence, that
              means the technical-leadership signal is stronger than the governance-transparency signal. There is enough
              public evidence to believe SpinQ has a serious engineering organization, but not enough to map full board
              composition, minority-investor protections, or public-company-grade finance and control infrastructure
              with confidence.
