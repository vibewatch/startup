  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and recognition complexity
        blocks:
          - type: paragraph
            body: >-
              SpinQ’s product catalog strongly suggests a mixed revenue model rather than a single-line hardware
              business. The company sells or markets portable NMR systems such as Gemini Mini, desktop NMR systems such
              as Triangulum, the Gemini Lab experimental platform, superconducting quantum systems, a cloud quantum
              computing platform, private-cloud deployment services, and the SpinQit development framework. That mix
              matters because each line probably carries different contract value, implementation burden, and
              recognition timing. Educational NMR units can likely close as product sales with attached training or
              support. Superconducting systems more likely resemble solution deals with milestones, installation,
              acceptance, and after-sales obligations. Private-cloud deployments appear service-heavy and could involve
              customization, integration, and ongoing support. Software and cloud access could create the best
              recurring-revenue path, but public evidence does not quantify usage, conversion, or average contract size.
              The result is a plausible but unproven multi-stream revenue architecture. Investors should avoid treating
              SpinQ like a clean SaaS company or a pure device OEM; it appears to be a blended hardware, software, and
              services business whose accounting quality cannot yet be verified from public materials.
