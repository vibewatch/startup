companyProfile:
  summary: >-
    SpinQ is a Shenzhen-based quantum-computing company founded in 2018 that combines two unusual strategic bets in one
    platform: desktop and lab-scale NMR systems for education and research, and superconducting quantum hardware aimed
    at more advanced industrial and scientific workloads. The company also markets a cloud platform, private-cloud
    deployment services, and the SpinQit software stack, making it one of the few Chinese quantum startups with visible
    product surfaces across hardware, software, and access layers. By mid-2026 it had raised rapidly across Series C,
    C+, and D rounds, announced meaningful overseas deployment breadth, and positioned itself as a strategic domestic
    quantum infrastructure asset, though public disclosure still lags what investors would need to underwrite exact
    economics or current valuation with confidence.
  foundedDate: '2018-08-27'
  founders:
