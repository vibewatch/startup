      - number: '8.4'
        title: Recommendation, upgrade conditions, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The clean call is track / research-more with medium confidence, high risk, and a fair-to-stretched
              valuation stance. That judgment is not a rejection of SpinQ’s strategic importance. On the contrary, the
              company is unusual: it has real late-stage funding, a broader product stack than many peers, meaningful
              overseas deployment claims, and a credible narrative around Chinese quantum industrialization. The reason
              to stop short of a buy call is that the current public evidence does not yet let an investor separate
              fundraising momentum from durable economics. Public quantum peers show that large values can coexist with
              thin current fundamentals, but they also show that public markets punish missed milestones, weak revenue
              quality, and disclosure disappointments.


              The diligence package that could move the call is concrete. Investors need audited FY2025 and FY2026
              financials, segment-level revenue and gross-margin bridges, clearer proof of recurring cloud or software
              monetization, named industrial backlog or repeat-order evidence, and the real cap-table plus preference
              structure for the 2026 rounds. If those materials validate the bullish narrative and effective entry price
              is disciplined, the case can upgrade. If they do not, the lesson is not that SpinQ lacks promise. It is
              that price has run ahead of proof.
            claimRefs:
              - CV033
              - CV034
