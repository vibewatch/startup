      - number: '8.2'
        title: Comparable set and what the quantum category is really paying for
        blocks:
          - type: paragraph
            body: >-
              The most useful comparable set for SpinQ mixes public quantum names with milestone-oriented private
              references. D-Wave, Rigetti, and IonQ are not clean operating analogues, but they do show that public
              investors are willing to ascribe multi-billion-dollar values to quantum companies even when current
              revenue bases remain small and profitability is weak or absent. D-Wave sits around $6.3 billion of market
              value on roughly $24.6 million of annual sales; Rigetti around $5.2 billion on roughly $7.1 million; and
              IonQ near $15 billion on roughly $130 million. Those numbers are not arguments that SpinQ should
              automatically clear a similar multiple. They are arguments that the category is still priced on option
              value, leadership expectations, and strategic positioning as much as on present-day income statements.


              Private references cut both ways. Quantinuum’s 2025 $10 billion pre-money round shows how high frontier
              private quantum marks can go when the company combines perceived technical leadership, strategic backers,
              and clearer enterprise positioning. But Quantinuum should be treated as an upper-bound aspiration rather
              than a direct comp. The CB Insights comparison with IQM is more immediately useful for SpinQ because it
              shows similar latest-round size but a much smaller cumulative capital base for SpinQ. The commercial proof
              set also matters. SpinQ’s public evidence still leans heavily toward education and research deployments,
              with named university customers easier to verify than recurring industrial production contracts. That
              nuance argues for a real premium to a generic hardware story, but not for category-leader pricing by
              default.
            claimRefs:
              - CV007
              - CV008
              - CV009
