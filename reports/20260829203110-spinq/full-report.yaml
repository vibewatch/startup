      - number: '3.2'
        title: Capability breadth, modality, and customer focus
        blocks:
          - type: paragraph
            body: >-
              Capability comparison begins with modality. SpinQ combines room-temperature NMR products for education and
              research with superconducting systems for more demanding use cases. Quantinuum and IonQ, by contrast, are
              trapped-ion companies with stronger global enterprise ecosystems, while Rigetti, IBM, and Origin Quantum
              are more clearly superconducting. D-Wave follows a different path again through annealing and its newer
              gate-model ambitions. Against that field, SpinQ’s combination of accessible NMR systems and industrial
              superconducting systems is genuinely differentiated. It lets the company address a much broader
              learning-to-research continuum than most peers. But capability breadth is not the same as frontier depth.
              Quantinuum publicizes industry-leading Helios accuracy, a broad software suite, and 150-plus organizations
              on Nexus. IonQ publicizes a much wider platform spanning computing, networking, sensing, and security,
              plus multiple cloud channels and large enterprise partnerships. IBM offers the world’s largest fleet of
              100-plus-qubit systems with 300-plus network members, and Rigetti emphasizes deployable QPUs plus a
              107-qubit system. SpinQ’s breadth is real, but its public proof on enterprise-grade scale and production
              use remains thinner than those better-disclosed rivals.
