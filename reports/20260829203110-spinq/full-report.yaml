      - number: '3.4'
        title: Moat durability, disclosure gaps, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              SpinQ’s moat is strongest where accessibility and sovereignty matter more than absolute frontier
              performance. The NMR education business is a real wedge because it turns quantum learning into a physical
              product rather than only a simulator. The domestic Chinese context also matters: export controls,
              procurement priorities, and a state-backed quantum ecosystem increase the value of home-grown hardware
              capability. Those factors can favor SpinQ even when Western peers lead on scale or disclosure. But the
              adverse evidence is equally important. IonQ, Quantinuum, and IBM all disclose stronger enterprise
              ecosystems or financial markers. Rigetti and D-Wave show how public investors can place very high values
              on quantum optionality, but they also show how early revenue and profitability remain fragile across the
              sector. SpinQ still discloses much less about recurring revenue, contract depth, churn, or customer
              concentration than those public peers. The competitive verdict is therefore balanced: SpinQ owns a
              differentiated lane and can be strategically relevant, but its moat looks contextual and segment-specific
              rather than globally dominant. Investors should treat SpinQ as a credible specialist with upside, not as a
              proven winner across the whole quantum landscape.
