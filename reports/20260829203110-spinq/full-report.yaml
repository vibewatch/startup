        title: Cost structure, capital intensity, and adequacy of funding
        blocks:
          - type: paragraph
            body: >-
              SpinQ’s June 2026 Series D and earlier 2026 financing rounds make sense only in a capital-intensive
              context. The company and independent coverage both describe use of proceeds that include fault-tolerant
              general-purpose quantum computing R&D, core-process iteration, cleanroom or fabrication capability,
              packaging, and expansion of global ecosystem capacity. Independent reporting also connects SpinQ’s roadmap
              to tape-out and validation of 25-qubit and 103-qubit superconducting processors plus batch deliveries of
              Ursa Major systems. This is not a light-capex software model. It is a hardware-plus-platform company whose
              cost structure likely includes chip design, materials, cryogenic or laboratory infrastructure, control
              systems, engineering headcount, simulation resources, field support, and international delivery. The
              positive read-through is that SpinQ raised very substantial capital in H1 2026, with the Series D alone
              worth RMB 1 billion and total six-month financing reported at RMB 2 billion. The negative read-through is
              that public sources do not disclose cash on hand, burn, debt, working-capital strain, or runway. Investors
              can conclude that SpinQ secured meaningful financial support, but not that it is comfortably financed to a
              clear commercialization milestone.
