  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and line-up in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              SpinQ’s product portfolio should be understood as a progression through the user journey rather than a
              grab bag of unrelated SKUs. At the entry level, the company offers NMR devices such as Gemini Mini,
              Triangulum, and Gemini Lab that let schools, laboratories, and researchers move from conceptual quantum
              education into real-machine experimentation. Those systems are paired with software and cloud access so
              users can learn, code, simulate, run experiments, and analyze results without immediately buying
              frontier-scale hardware. At the advanced end, SpinQ also markets superconducting quantum systems and
              private-cloud deployments, which shift the workflow from classroom or lab enablement toward institutional
              infrastructure. SpinQit is the connective layer across those steps because it supports programming,
              simulation, and execution across multiple back ends. That lineup is commercially coherent: it lowers the
              barrier to entry with approachable devices and then offers an upgrade path into more serious platforms.
              The product question is less whether SpinQ has enough modules, and more whether each module is mature
              enough and supported enough to convert into durable institutional adoption.
