  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context, funding anchors, and the disclosure gap
        blocks:
          - type: paragraph
            body: >-
              SpinQ has earned the right to be discussed as a serious late-stage quantum company. Official and
              independent 2026 coverage all converge on the same core fact pattern: a RMB 1 billion Series D announced
              on 2026-06-30, total fundraising of RMB 2 billion over the prior six months, and a company narrative
              centered on scaling fault-tolerant superconducting quantum computing while maintaining its NMR education
              and research franchise. CB Insights separately records the last round at about $147.22 million and total
              capital raised at about $256.94 million. That is enough to say SpinQ is not a seed-stage science project;
              it is a real capitalized platform company.


              What it does not prove is the exact market-clearing valuation. The strongest public financing sources
              describe round size, investors, and use of proceeds, but not a primary-source post-money valuation,
              diluted share count, or preference stack. FreshFromChina adds pre-IPO color around the Series C+ period,
              yet that still stops short of prospectus-grade evidence. For valuation purposes, this distinction is
              critical. Investors have proof of financing momentum and category relevance, but not proof that the
              current price is fully underwritten on clean economic terms. That pushes the analysis toward scenario
              ranges and entry discipline rather than a single heroic fair-value number.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV026
              - CV033
