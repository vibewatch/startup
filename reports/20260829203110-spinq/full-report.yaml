      - number: '7.4'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The good news is that several risks are monitorable. Investors can ask for benchmark and uptime evidence,
              cohort expansion from education into higher-value products, support-organization metrics, security
              controls for cloud and private deployments, and a cash bridge tied to technical milestones. If SpinQ can
              demonstrate that educational footholds turn into sticky institutional accounts, that its superconducting
              roadmap is moving from milestones to reproducible deployment, and that support quality is scaling with
              geography, many of the current concerns become manageable rather than fatal. But the kill criteria are
              also clear. If deeper diligence shows that customer breadth masks weak revenue concentration, that
              superconducting benchmarks are not reproducible, that support capacity lags global claims, or that runway
              is shorter than the capital raises imply, the thesis weakens materially. SpinQ is investable only if its
              transparency catches up with its breadth. Until then, the company should be treated as high-potential but
              high-residual-risk.
