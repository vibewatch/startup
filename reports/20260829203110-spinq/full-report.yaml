            body: >-
              The weakest part of SpinQ’s customer story is durability disclosure. No public NRR, GRR, churn,
              contract-length, renewal-rate, or cohort data was found. That means investors cannot directly test whether
              a university that buys a Gemini system later adds more seats, more devices, cloud usage, private
              deployment, or superconducting infrastructure. Even so, public workflow evidence implies a plausible
              expansion path: a school can begin with teaching devices, add training and SpinQit, then graduate into
              broader lab use or hosted access. Solution pages in education, finance, and other sectors show where SpinQ
              wants that expansion to go. The concentration risk is that a large share of public proof still appears
              education-heavy and institution-heavy. That is not inherently bad, but it can mean long procurement
              cycles, grant or public-budget dependence, and slower land-and-expand dynamics than top-line customer
              counts imply. Because contract economics are hidden, the real question is not how many institutions exist,
