  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lens
        blocks:
          - type: paragraph
            body: >-
              The relevant market for SpinQ is narrower than the full quantum-technology complex. SpinQ sells or markets
              superconducting hardware, NMR education systems, cloud access, and software that support optimization,
              simulation, machine learning, and research workflows. That means the company participates primarily in
              quantum-computing infrastructure and services, not the much broader buckets of quantum communications,
              sensing, or academic grant spending that often inflate China quantum headlines. Public market research is
              still imperfect, but it is directionally useful. IMARC estimates the China quantum-computing market at USD
              258.64 million in 2025 and projects it to USD 3.56 billion by 2034 at a 33.84 percent CAGR. The Quantum
              Insider separately frames a wider Chinese quantum-industry scale of roughly CNY 11.56 billion in 2025,
              which captures a broader ecosystem than SpinQ’s immediate addressable market. For diligence, the right
              view is layered: TAM is China quantum-computing spend; SAM is the subset around systems, cloud, and
              application workflows in sectors SpinQ actually serves; and SOM is the much smaller near-term pool of
              education, research, and selective industrial pilots that can buy or use SpinQ products today.
