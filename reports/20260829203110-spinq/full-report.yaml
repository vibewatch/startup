      - number: '1.3'
        title: Capital formation, scale proxies, and commercialization signal
        blocks:
          - type: paragraph
            body: >-
              By mid-2026 SpinQ had clearly entered late-stage capital formation. The January 2026 Series C, April 2026
              Series C+, and June 2026 Series D together show a rapid sequence of progressively larger financings,
              culminating in a RMB 1 billion Series D and RMB 2 billion raised across the prior six months. The investor
              mix is as notable as the amounts: multiple sources describe strong participation from state-backed or
              industrial capital, and the Chinese Series D release shows a cross-regional syndicate spanning CICC
              Capital, Shanghai semiconductor capital, AVIC-linked capital, and other policy-adjacent funds.
              Commercialization signals are meaningful but uneven. Official and third-party sources repeatedly state
              that products have been deployed in more than 40 countries and at more than 200 institutions, while 36Kr
              and Quantum Computing Report add stronger revenue-adjacent proxies: NMR systems as a recurring educational
              business, order volume up 80 percent year over year in the first quarter of 2026, and superconducting
              business becoming the majority of revenue. Those are encouraging indicators, but they stop short of
              audited financial disclosure. Public sources still do not provide revenue, gross margin, cash, or runway
              with enough precision for full underwriting.
