    sections:
      - number: '6.1'
        title: Customer-base segmentation and who buys SpinQ
        blocks:
          - type: paragraph
            body: >-
              SpinQ’s public customer surface points to a buyer mix led by education and research institutions, with
              selective evidence of industrial and financial use cases layered on top. The strongest named-customer
              evidence comes from universities and schools: UNAM in Mexico, the University of Western Australia, Oslo
              Metropolitan University, Bandung Institute of Technology, and a longer list of institutions cited on
              SpinQ’s own global expansion page. The 36Kr profile similarly says SpinQ has entered universities,
              research institutions, and industrial fields across more than 40 countries and regions, while highlighting
              more than 200 universities and middle schools globally for its education products and services. That
              segmentation matters. It suggests the current customer base is not dominated by Fortune-500 production
              infrastructure buyers; rather, SpinQ appears strongest where quantum education, lab enablement, and
              early-stage experimentation are the primary jobs to be done. The company does have commercial-use-case
              signaling in finance, biomedicine, and AI, but those proofs look narrower and more case-study-driven than
              the education footprint. Customer breadth is real; customer monetization depth remains less visible.
