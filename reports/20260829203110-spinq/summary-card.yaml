  topStrengths:
    - >-
      Rare dual-route positioning across NMR and superconducting quantum systems gives SpinQ broader product optionality
      than many single-modality peers.
    - >-
      Rapid H1 2026 fundraising and a state- and industry-linked investor base signal strategic relevance and access to
      patient capital.
    - >-
      Public evidence supports real commercialization surfaces across education hardware, exported systems, cloud
      access, and software tooling rather than only lab claims.
    - >-
      China-based manufacturing and platform integration could become an advantage if domestic quantum industrialization
      accelerates.
  topRisks:
    - >-
      Public sources still do not disclose audited revenue, gross margin, cash burn, or cap-table terms, making
      valuation precision weak.
    - >-
      Named customer proof remains much stronger in education and research than in repeatable industrial production
      deployments.
    - >-
      Quantum category valuations can be volatile and milestone-driven, so missed commercialization proof can compress
      price quickly.
    - >-
      Capital intensity, policy sensitivity, and export or overseas-support constraints can all damage the underwriting
      case at once.
  unresolvedGaps:
    - Exact post-money valuation, diluted ownership, and liquidation preferences for the 2026 rounds.
    - Audited FY2025 and FY2026 financial statements with segment revenue and gross-margin detail.
    - Proof of recurring cloud or SpinQit monetization, including paid usage, renewals, and attach rates.
    - Named industrial backlog, repeat orders, and pilot-to-production conversion evidence for superconducting systems.
    - Concrete exit-readiness materials showing whether any pre-IPO path is real, timed, and governance-ready.
