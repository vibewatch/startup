- id: milestones-and-adverse-read-throughs
  title: Milestones, technical breadth, and adverse read-throughs
  body: SpinQ’s milestone record is stronger on engineering breadth and delivery proof than on transparent economics. The official chronology shows a sequence from the 2020 launch of a programmable desktop NMR quantum computer, to the 2021 Triangulum desktop model, the 2022 Gemini Mini portable device, a 2024 Gemini Lab teaching platform, and an expanding superconducting stack that now includes chips, control systems, cloud software, private-cloud deployment, and up-to-103-qubit system configurations. The most commercially important milestone claims are the first overseas delivery of a Chinese superconducting chip in 2023 and the first overseas delivery of a complete Chinese superconducting quantum computer in 2024, followed by batch deliveries of Ursa Major systems in 2025. Those are unusual proof points for a Chinese private quantum company. The adverse read-through is that the public narrative still leans heavily on company claims, milestone marketing, and financing press coverage. Independent
    confirmation of exact customer concentration, the durability of overseas demand, and the exact path from engineering demos to repeatable industrial revenue is limited. External macro analysis also suggests China’s quantum investment wave is partly policy-led, so capital access should not be mistaken for proof that commercialization risk has already been solved.
