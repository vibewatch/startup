  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A priced-round post-money valuation or filed ownership table for the 2026 financings.
    whyItMatters: Series D size is public, but unicorn status and dilution math remain partly inferential without a disclosed valuation or cap table.
    diligencePath: Request the Series C/C+/D term sheets, shareholder register, and board minutes showing priced-round valuation and post-round ownership.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: blocking
    topic: financial disclosure
    missingEvidence: Audited revenue, gross margin, cash balance, burn, and runway for FY2025 and H1 2026.
    whyItMatters: Funding scale alone cannot establish whether SpinQ has a durable commercialization engine or how urgently it needs additional capital.
    diligencePath: Obtain management accounts, audited statements, and bank/budget materials for FY2024-FY2026 YTD.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: ipo timing
    missingEvidence: Primary documentation confirming whether a formal pre-IPO round or listing workstream exists beyond secondary reporting.
    whyItMatters: IPO readiness affects governance expectations, liquidity timing, and whether late-stage capital is strategic or bridge financing.
    diligencePath: Request banker mandate letters, listing-prep materials, or direct management confirmation of target market and timetable.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Complete board roster, independent-director status, committee structure, and late-stage control rights.
    whyItMatters: Public technical credibility does not answer governance, minority-protection, or public-company-control questions.
    diligencePath: Request constitutional documents, board observer agreements, and latest board deck or governance presentation.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Named paying-customer roster, contract sizes, renewals, and the split between institutions, pilots, and recurring production users.
    whyItMatters: The 40-country and 200-plus-institution claims are helpful, but they do not show whether revenue is diversified or repeatable.
    diligencePath: Request top-20 customer list, revenue concentration analysis, and reference calls covering NMR and superconducting deployments.
    relatedQuestionRefs:
    - QO017
    - QO018
    relatedTableRefs:
    - TO001
