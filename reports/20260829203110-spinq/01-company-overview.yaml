company:
  name: SpinQ
chapter:
  number: 1
  title: Company Overview
  summary: SpinQ is a Shenzhen quantum-computing company founded in 2018 that has assembled an unusually broad commercial stack spanning NMR education systems, superconducting quantum hardware, cloud software, and chip-tooling. Public 2026 evidence supports real late-stage financing momentum and global deployment claims, but governance depth, exact economics, and pre-IPO timing remain materially under-disclosed.
sections:
- id: identity-and-business-model
  title: Identity, roots, and business model
  body: 'SpinQ presents itself as a one-stop quantum-computing company rather than a single-product hardware lab. The strongest official description comes from the company’s English and Chinese about pages, which describe a dual mission of industrializing and popularizing quantum computing through a full-stack mix of industrial superconducting systems, educational NMR machines, cloud access, and software tooling. That framing matters because it explains why SpinQ’s public story combines research hardware with classroom devices and developer software. Unlike many quantum startups that focus on a single modality, SpinQ explicitly markets both superconducting and nuclear-magnetic-resonance routes, using NMR systems to widen adoption in research and education while pushing superconducting systems toward harder industrial use cases. The company says it serves scientific research, education, drug discovery, fintech, and artificial-intelligence scenarios, which makes SpinQ read less like a pure
    component supplier and more like a vertically integrated infrastructure platform. The founding and location evidence is also consistent: official materials and third-party profiles place the company’s origin in Shenzhen in August 2018. That combination of Shenzhen hardware roots, broad product packaging, and commercialization language is the ground truth later chapters should reuse.'
  claimRefs:
