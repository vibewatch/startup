- id: leadership-and-governance
  title: Founder profile, leadership concentration, and governance visibility
  body: 'SpinQ’s public identity is heavily concentrated around founder and chief executive Dr. Jingen Xiang. Official financing releases, Seedtable’s company profile, and 36Kr’s April 2026 report all identify Xiang as founder and CEO, while 36Kr adds a detailed technical pedigree: Tsinghua physics training, a Harvard postdoctoral stint, and more than fifteen years of quantum-computing R&D experience. That background helps explain why the company is comfortable competing in two technology routes at once and why investors appear to underwrite the team as a deep-tech execution group rather than a software start-up. Public disclosure beyond Xiang is thinner. Seedtable surfaces only a small leadership bench, listing SVP/CTO Tiejun Meng and Senior Scientist Guanru Feng, while the official website emphasizes the academic quality of the broader founding team rather than a fully disclosed board or independent-governance structure. For diligence, that means the technical-leadership signal is stronger
    than the governance-transparency signal. There is enough public evidence to believe SpinQ has a serious engineering organization, but not enough to map full board composition, minority-investor protections, or public-company-grade finance and control infrastructure with confidence.'
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO024
  - CO035
  - CO040
  tableRefs:
  - TO002
- id: capital-scale-and-commercial-footprint
  title: Capital formation, scale proxies, and commercialization signal
  body: 'By mid-2026 SpinQ had clearly entered late-stage capital formation. The January 2026 Series C, April 2026 Series C+, and June 2026 Series D together show a rapid sequence of progressively larger financings, culminating in a RMB 1 billion Series D and RMB 2 billion raised across the prior six months. The investor mix is as notable as the amounts: multiple sources describe strong participation from state-backed or industrial capital, and the Chinese Series D release shows a cross-regional syndicate spanning CICC Capital, Shanghai semiconductor capital, AVIC-linked capital, and other policy-adjacent funds. Commercialization signals are meaningful but uneven. Official and third-party sources repeatedly state that products have been deployed in more than 40 countries and at more than 200 institutions, while 36Kr and Quantum Computing Report add stronger revenue-adjacent proxies: NMR systems as a recurring educational business, order volume up 80 percent year over year in the first quarter
    of 2026, and superconducting business becoming the majority of revenue. Those are encouraging indicators, but they stop short of audited financial disclosure. Public sources still do not provide revenue, gross margin, cash, or runway with enough precision for full underwriting.'
