  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与确认复杂度
        blocks:
          - type: paragraph
            body: >-
              SpinQ 的产品目录强烈暗示，它是混合收入模型，而不是单线硬件生意。公司销售或推广 Gemini Mini 等便携 NMR 系统、Triangulum 等桌面 NMR 系统、Gemini Lab
              实验平台、超导量子系统、量子计算云平台、私有云部署服务和 SpinQit 开发框架。这个组合很重要，因为每条线的合同价值、实施负担和收入确认时点大概率不同。教育 NMR
              设备可能作为产品销售成交，并附带培训或支持。超导系统更可能像解决方案交易，需要里程碑、安装、验收和售后义务。私有云部署看起来服务成分重，可能涉及定制、集成和持续支持。软件和云访问可能带来最好的经常性收入路径，但公开证据没有量化使用量、转化率或平均合同规模。因此，SpinQ
              有一个合理但未验证的多流收入架构。投资者不应把 SpinQ 当作干净 SaaS 公司或纯设备 OEM；它看起来是硬件、软件和服务混合体，其会计质量目前无法从公开材料验证。
