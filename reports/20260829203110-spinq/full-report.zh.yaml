  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 口径评分，以 2026-08-29 时点评估 SpinQ 的估值设定，重点看战略重要性与披露仍薄之间的张力。
    data:
      items:
        - label: 品类重要性
          score: 8
          detail: 后期融资和双路线定位，让 SpinQ 在量子赛道具备战略重要性。
        - label: 产品宽度
          score: 8
          detail: 公司显然不止是单一原型或研究主张。
        - label: 商业验证质量
          score: 5
          detail: 部署证据真实存在，但仍偏教育和研究。
        - label: 披露质量
          score: 2
          detail: 缺少公开且经审计的财务资料包，也缺少已定价股权结构表支撑。
        - label: 上市可比公司支撑
          score: 7
          detail: 量子品类能撑住大额估值，独角兽结果因此可信。
        - label: 非上市可比公司支撑
          score: 6
          detail: 非上市同行显示资金胃口很强，但 SpinQ 还不是明确的天花板资产。
        - label: 溢价下的安全边际
          score: 3
          detail: 如果没有尽调证据支撑，定价又跑出中低位独角兽区间，安全边际就弱。
        - label: 综合评分
          value: 5.6
          score: null
          detail: 今天更适合观察并继续尽调，而不是追逐激进溢价。
    approximationNotes: 评分是分析师按 1-10 量表对本章证据的综合判断，不是公司报告指标。
