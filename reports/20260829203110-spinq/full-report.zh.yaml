      - number: '7.4'
        title: 风险缓释、监控指标与放弃标准
        blocks:
          - type: paragraph
            body: >-
              好消息是，几类风险都能跟踪。投资人可以要求基准测试和在线率证据、从教育客户向高价值产品扩展的队列数据、支持组织指标、云和私有部署的安全控制，以及与技术里程碑绑定的现金接续安排。如果 SpinQ
              能证明教育切入点会转成黏性机构账户，超导路线正从里程碑走向可复现部署，支持质量也能随着地域扩张同步放大，很多担忧会从致命风险降为可管理风险。但放弃标准同样清楚：如果更深尽调显示客户广度掩盖了收入集中度薄弱，超导基准无法复现，支持能力跟不上全球化主张，或现金跑道比融资规模暗示的更短，投资逻辑就会明显走弱。只有透明度追上业务宽度，SpinQ
              才值得投资。在那之前，应把公司看作高潜力但剩余风险很高的标的。
