              Australia、Oslo Metropolitan University、Bandung Institute of Technology，以及 SpinQ 自己全球扩张页面列出的更长机构名单。36Kr
              画像同样称 SpinQ 已进入 40 多个国家和地区的高校、科研机构和工业领域，并重点提到其教育产品和服务覆盖全球 200 多所高校和中学。这个分层很重要。它说明当前客户群并非由 Fortune-500
              生产级基础设施买方主导；SpinQ 似乎在量子教育、实验室赋能和早期实验这些核心任务上最强。公司确实在金融、生物医药和 AI
              方向释放了商业用例信号，但这些证明比教育足迹更窄、更依赖案例。客户宽度真实；客户变现深度仍不太可见。
