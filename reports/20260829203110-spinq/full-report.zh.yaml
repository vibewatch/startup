chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、起点与商业模式
        blocks:
          - type: paragraph
            body: >-
              SpinQ 把自己呈现为一站式量子计算公司，而不是单一产品的硬件实验室。最有力的官方表述来自公司英文和中文「关于我们」页面：SpinQ 的使命是用工业超导系统、教育用 NMR
              机器、云访问和软件工具组成的全栈组合，把量子计算工业化、普及化。这个定位很关键，因为它解释了为什么 SpinQ 的公开叙事同时包含科研硬件、课堂设备和开发者软件。许多量子初创公司押注单一技术路线，SpinQ
              则明确销售超导和核磁共振两条路线：用 NMR 系统扩大科研和教育采用，同时把超导系统推向更硬的工业用例。公司称其服务科研、教育、药物发现、金融科技和人工智能场景，因此 SpinQ
              看起来不像纯组件供应商，更像垂直整合的基础设施平台。成立和地点证据也一致：官方材料与第三方画像都把公司起点放在 2018 年 8 月的深圳。深圳硬件根基、宽产品打包和商业化表述，构成了后续章节应复用的事实底座。
