        - RMB 1B Series D 轮；此前六个月累计融资 RMB 2B；聚合数据源显示最新轮约 ~$147M
        - 资产本身最好的直接锚点
        - 未披露投后估值或干净的新投资人经济性
      - - SpinQ 对比 IQM
        - 私人市场数据对比，2026
        - 最新轮规模大致相当（~$146M 对 ~$147M），但 SpinQ 累计融资低得多
        - 有助于校准私人超导时代标尺
        - 聚合数据对比，不是正式融资备忘录
      - - D-Wave Quantum
        - 上市，2026 年 8 月
        - ~$6.3B 市值；MarketBeat 显示约 255.6x 销售额
        - 说明公开市场可以给量子叙事很高估值
        - 退火路线模型和上市市场流动性不同于 SpinQ
      - - Rigetti Computing
        - 上市，2026 年 8 月
        - ~$5.2B 市值；MarketBeat 显示约 733.9x 销售额
        - 最接近的上市超导硬件可比公司，可约束估值纪律
        - 收入基数很小，上市市场波动很大
      - - IonQ
        - 上市，2026 年 8 月
        - ~$15B 市值；MarketBeat 显示约 114.8x 销售额
        - 说明被视为品类龙头时存在上行空间
        - 披露基础大得多，市场能见度更强
      - - Quantinuum
        - 私人轮次，2025 年 9 月
        - 融资 US$600M，对应投前 US$10B
        - 私人量子龙头的上限里程碑参照
        - 愿景天花板，不是 SpinQ 今天的直接定价类比
    notes: 这里使用可比对象是为了三角校准和保持估值纪律。没有哪一行能提供机械套用的倍数，因为 SpinQ 缺少这种方法所需的披露。
