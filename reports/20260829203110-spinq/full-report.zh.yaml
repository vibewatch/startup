      - number: '6.3'
        title: 持久性、扩张路径与集中风险
        blocks:
          - type: paragraph
            body: >-
              SpinQ 客户故事最弱处是持久性披露。没有发现公开 NRR、GRR、流失、合同期限、续约率或队列数据。这意味着投资者无法直接检验：一所大学购买 Gemini
              系统后，是否会增加席位、设备、云使用、私有部署或超导基础设施。即便如此，公开工作流证据暗示了一条合理扩张路径：学校可以从教学设备开始，增加培训和
              SpinQit，再升级到更广实验室使用或托管访问。教育、金融和其他行业解决方案页面展示了 SpinQ
              想把这种扩张带向何处。集中风险在于，大量公开证明仍显得偏教育、偏机构。这不一定坏，但可能意味着采购周期长、依赖拨款或公共预算，落地后扩张动态也慢于表面客户数量暗示。合同经济性被隐藏后，真正问题不是有多少机构，而是其中多少持久、扩张且高价值。
