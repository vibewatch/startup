  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从客户工作流看产品定义与阵容
        blocks:
          - type: paragraph
            body: >-
              SpinQ 的产品组合应该按用户旅程理解，而不是一堆互不相干的 SKU。入门层，公司提供 Gemini Mini、Triangulum 和 Gemini Lab 等 NMR
              设备，让学校、实验室和研究人员从概念性量子教育走向真机实验。软件和云访问与这些系统配套，使用户无需立刻购买前沿规模硬件，也能学习、编码、仿真、跑实验并分析结果。高阶端，SpinQ
              还销售超导量子系统和私有云部署，把工作流从课堂或实验室赋能推向机构级基础设施。SpinQit
              是这些步骤之间的连接层，因为它支持在多个后端上编程、仿真和执行。这套阵容在商业上自洽：用容易上手的设备降低进入门槛，再提供通往更严肃平台的升级路径。产品问题不在于 SpinQ
              模块够不够多，而在于每个模块是否足够成熟、支持是否足够到位，能否转化为持久的机构采用。
