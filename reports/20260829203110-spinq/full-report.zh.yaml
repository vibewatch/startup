  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景、融资锚点与披露缺口
        blocks:
          - type: paragraph
            body: >-
              SpinQ 已经有资格被当作严肃的后期量子公司讨论。官方和独立的 2026 年报道都指向同一组核心事实：2026-06-30 宣布 RMB 1 billion 的 Series D 轮，过去六个月累计融资 RMB
              2 billion；公司叙事围绕容错超导量子计算扩容，同时保住 NMR 教育和科研基本盘。CB Insights 另行记录，最近一轮约 $147.22 million，累计融资约 $256.94
              million。足以说明 SpinQ 不是种子期科学项目，而是一家真正拿到资本支持的平台公司。


              但它没有证明精确的市场出清估值。最强的公开融资来源披露了轮次规模、投资人和资金用途，却没有一手的投后估值、摊薄股数或优先股堆叠。FreshFromChina 给 Series C+
              阶段补充了上市前色彩，但离招股书级证据仍差一截。做估值时，这个差别很关键：投资人已经看到融资动能和赛道相关性，却还没看到当前价格能否被干净经济条款充分支撑。因此，分析更应落在情景区间和入场纪律上，而不是押一个英雄式公允价值数字。
            claimRefs:
              - CV001
              - CV002
              - CV003
