      - number: '5.3'
        title: 部署、成熟度、支持与路线图
        blocks:
          - type: paragraph
            body: >-
              公开证据支持技术栈的一部分已经具备真实部署成熟度，但并不均匀。最强成熟信号来自面向教育的 NMR 系统和开发者工具。这些产品具体、有文档，并绑定学习、实验和编程工作流。PyPI 数据显示，SpinQit 在
              2026 年 4 月发布 0.2.4 beta 版，并提供 Linux、Windows 和 macOS wheel
              包；这对实践者来说是有意义证据，说明软件不只是营销文案，而是打包给外部使用。另一个成熟信号是超导系统海外交付，说明至少部分硬件已走出内部实验室。与此同时，路线图仍不对称。独立报道描述了 25-qubit 和
              103-qubit 超导 QPU 验证以及纠错里程碑，但相比 IBM、IonQ、Quantinuum 或 Rigetti，SpinQ 仍少披露基准、正常运行时间和路线图。成熟度结论因此是混合的：SpinQ
              显然越过概念阶段，但产品组合中技术野心最大的部分，仍需要更深入尽调来验证可复现性、可支持性和性能。
