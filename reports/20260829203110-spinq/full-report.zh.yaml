      - number: '1.2'
        title: 创始人画像、领导层集中度与治理可见度
        blocks:
          - type: paragraph
            body: >-
              SpinQ 的公共身份高度集中在创始人兼 CEO Jingen Xiang 博士身上。官方融资稿、Seedtable 公司画像和 36Kr 2026 年 4 月报道都将 Xiang 标识为创始人兼
              CEO；36Kr 还补充了更细的技术履历：清华物理训练、Harvard 博士后经历，以及超过 15
              年量子计算研发经验。这一背景解释了公司为何敢同时竞争两条技术路线，也解释了投资者为何愿意把团队视为深科技执行团队，而不是软件初创公司来下注。Xiang 之外的公开披露更薄。Seedtable
              只露出一个很小的领导层阵容，包括高级副总裁/CTO Tiejun Meng 和高级科学家 Guanru
              Feng；官网则强调更广泛创始团队的学术质量，而不是完整披露董事会或独立治理结构。尽调上，技术领导力信号强于治理透明度信号。公开证据足以相信 SpinQ
              有严肃工程组织，但还不足以有把握画出完整董事会构成、少数股东保护，或上市公司级财务与内控基础设施。
