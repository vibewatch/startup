      - number: '8.4'
        title: 建议、上调条件与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              最干净的结论是观察 / 继续研究，置信度中等、风险高，估值立场介于合理到偏高。这个判断不是否定 SpinQ
              的战略重要性。恰恰相反，公司很少见：它有真实的后期融资，产品栈比很多同行更宽，海外部署主张有一定分量，也围绕中国量子产业化讲出了可信叙事。暂不下买入结论，是因为当前公开证据还不足以让投资人把融资动能和耐久经济性拆开。公开量子同业说明，高估值可以和薄弱的当前基本面并存；但它们也说明，一旦里程碑落空、收入质量弱或披露不及预期，公开市场会惩罚得很重。


              能够推动结论上调的尽调包很具体。投资人需要 2025 财年和 2026 财年审计财务、分板块收入和毛利率桥、经常性云或软件变现的更清晰证据、具名工业积压订单或复购证据，以及 2026
              年各轮真实股权结构表和优先股条款。如果这些材料验证乐观叙事，并且有效入场价格有纪律，结论可以上调。否则，教训不是 SpinQ 没有前景，而是价格已经跑在证据前面。
