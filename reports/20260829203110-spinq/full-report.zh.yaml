  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              SpinQ
              受益于北京希望发展的战略行业，但这种支持伴随不均衡的监管和治理画像。国内采购偏好可以帮助本土冠军拿单，也意味着需求可能受政策周期和机构审批流程影响，而不完全来自商业紧迫性。国际上，量子计算位于敏感技术栈内部，越来越受地缘政治和更紧技术合作约束影响。关于中国行业的独立报道强调了国内融资增长和战略重要性，也提到国际技术合作收紧，以及部分上游环节依赖进口组件。公司表面层面，SpinQ
              的公开信任和治理层比其雄心更薄：被审阅的中文隐私政策和用户协议链接返回失效页面，且未找到公开安全认证或可靠性计划。这些单独看不是推翻投资逻辑的因素，但确实提高了私有尽调对治理卫生、出口暴露、合规控制和客户数据保护的要求。
