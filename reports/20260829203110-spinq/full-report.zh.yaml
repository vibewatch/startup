      - number: '8.2'
        title: 可比公司组合，以及量子赛道真正买单的东西
        blocks:
          - type: paragraph
            body: >-
              对 SpinQ 最有用的可比组，应把上市量子公司和以里程碑定价的私人标的混在一起看。D-Wave、Rigetti 和 IonQ
              不是干净的经营可比，但它们说明，即使当前收入基数很小、盈利能力弱或缺失，公开市场仍愿意给量子公司数十亿美元估值。D-Wave 市值约 $6.3 billion，年销售额约 $24.6
              million；Rigetti 市值约 $5.2 billion，销售额约 $7.1 million；IonQ 市值接近 $15 billion，销售额约 $130 million。这些数字不是在说 SpinQ
              自动应该拿到类似倍数，而是在说赛道定价仍大量押注期权价值、领先预期和战略位置，眼前损益表只是其中一部分。


              私募参照会把结论拉向两边。Quantinuum 2025 年投前估值 $10 billion 的融资轮说明，当公司叠加被认可的技术领先、战略支持方和更清晰的企业定位时，前沿私人量子公司的估值标记可以冲得很高。但
              Quantinuum 更适合作为上限愿景，而不是直接可比。CB Insights 与 IQM 的对比对 SpinQ 更直接：二者最近一轮规模接近，但 SpinQ 的累计资本基数小得多。商业证据集也重要。SpinQ
              的公开证据仍明显偏教育和科研部署；具名大学客户比反复发生的工业生产合同更容易验证。这个细节支持其相对普通硬件故事拿到真实溢价，但默认给赛道龙头价格还不够。
