        - 付费使用、续费或附加率不重要。
        - SpinQ 不再有足够理由被估成高于项目制硬件公司的一类资产。
        - 削减溢价假设，按纯硬件逻辑重新承销。
      - - 工业订单积压比暗示更薄
        - 具名企业需求被证明规模小、像试点，或不可复购。
        - 客户质量信号变弱，估值倍数应收缩。
        - 暂停投资，直到复购型生产需求得到证明。
      - - 后期融资条款对投资人不友好
        - 棘轮、优先权或治理约束先于普通股头条估值吸走经济性。
        - 头条估值不再对应新投资人的有效价值。
        - 按完全稀释和净经济性重新承销。
      - - 政策或出口敏感性恶化
        - 新限制、海外交付变慢或政策冲击减少可服务商业路径。
        - 贴现率上升，乐观情景的国际扩张信心下降。
        - 持有观望或后退，直到敞口更清楚。
    notes: 触发项被写成可监控事件，会直接改变估值支撑，而不是泛泛经营担忧。
    claimRefs:
      - CV032
      - CV037
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调资料清单表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 经审计财务
        - FY2025 和 FY2026 收入、毛利率、经营亏损和现金流报表
        - 任何超出情景三角校准的直接估值工作的核心前置条件
        - 要求提供审计包、董事会批准账目和月度管理报表桥接。
      - - 分部经济性
        - 按 NMR、超导、云、私有云和软件拆分的收入、毛利率和支持负担
        - 说明宽度是在创造价值，还是掩盖弱线
        - 要求提供产品家族 P&L 和贡献毛利桥接表。
      - - 经常性变现
        - 付费云使用、SpinQit 变现、支持续费和队列留存数据
        - 检验硬件故事下 SpinQ 是否有高质量经常性价值
        - 要求提供队列表、续费计划和附加率数据。
      - - 工业需求质量
        - 超导系统的具名管线、订单积压、复购和转化率
        - 把演示和试点同真实企业估值支撑分开
        - 要求提供前 20 个机会清单和发货到收入桥接。
      - - 股权结构表和优先权
        - 所有权、董事会权利、清算优先权、棘轮和反稀释条款
        - 头条估值可能与有效入场经济性明显不同
        - 审阅数据室股权结构表和律师摘要。
      - - 退出准备度
        - 审计准备度、治理基础设施和任何真实 Pre-IPO 时间表
        - 决定估值能否迁移到公开市场证据标准
        - 要求提供治理备忘录、审计师状态和上市工作流材料。
    notes: 这些是把 SpinQ 从「有意思的后期量子平台」推进到「可以按纪律价格买入」的最低尽调条件。
    claimRefs:
      - CV004
      - CV006
      - CV025
      - CV033
      - CV040
      - CV041
