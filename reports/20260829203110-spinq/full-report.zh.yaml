            body: >-
              能力比较先看技术路线。SpinQ 把用于教育和科研的室温 NMR 产品，与面向更高要求用例的超导系统组合起来。相比之下，Quantinuum 和 IonQ 是离子阱公司，全球企业生态更强；Rigetti、IBM
              和 Origin Quantum 更明确走超导路线。D-Wave 又走另一条路，先是退火，后来推进门模型野心。在这个场域里，SpinQ 将可及的 NMR
              系统和工业超导系统放在一起，确实形成差异化。公司由此能覆盖比多数同业更宽的“学习到科研”连续谱。但能力宽度不等于前沿深度。Quantinuum 公开宣传行业领先的 Helios 精度、宽软件套件和 Nexus 上
              150 多家组织。IonQ 公开宣传更宽的平台，覆盖计算、网络、传感和安全，并拥有多个云渠道和大型企业合作。IBM 拥有全球最大 100-plus-qubit 系统队列和 300 多个网络成员，Rigetti
