      - number: '1.4'
        title: 里程碑、技术宽度与反向解读
        blocks:
          - type: paragraph
            body: >-
              SpinQ 的里程碑记录在工程宽度和交付证明上强于透明经济性。官方时间线从 2020 年推出可编程桌面 NMR 量子计算机开始，到 2021 年 Triangulum 桌面型号、2022 年 Gemini
              Mini 便携设备、2024 年 Gemini Lab 教学平台，再到持续扩张的超导栈；目前栈里包含芯片、控制系统、云软件、私有云部署，以及最高 103-qubit 的系统配置。最具商业意义的里程碑主张，是
              2023 年首次将中国超导芯片交付海外、2024 年首次将完整中国超导量子计算机交付海外，随后在 2025 年批量交付 Ursa Major
              系统。对中国私营量子公司来说，这些是少见的证明点。反向解读是，公开叙事仍重度依赖公司主张、里程碑营销和融资新闻。精确客户集中度、海外需求持久性，以及从工程演示走向可重复工业收入的精确路径，独立确认仍有限。外部宏观分析也提示，中国量子投资浪潮部分由政策驱动，因此不能把拿到资本误读为商业化风险已经解除。
