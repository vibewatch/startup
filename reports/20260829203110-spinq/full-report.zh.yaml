companyProfile:
  summary: >-
    SpinQ 是一家 2018 年成立、总部位于深圳的量子计算公司，把两个少见战略押注合在一个平台里：面向教育和科研的桌面与实验室级 NMR 系统，以及面向更高阶工业和科研负载的超导量子硬件。公司还销售云平台、私有云部署服务和
    SpinQit 软件栈，因此是少数能在硬件、软件和访问层都拿出可见产品面的中国量子初创公司之一。到 2026 年中，它已在 Series C、C+ 和 D
    轮快速融资，宣布了相当广的海外部署，并把自己定位为国内战略性量子基础设施资产；但公开披露仍不足以让投资者有把握判断精确经济性或当前估值。
