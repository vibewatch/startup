      - number: '8.3'
        title: 情景区间、价格纪律，以及市场还必须相信什么
        blocks:
          - type: paragraph
            body: >-
              SpinQ
              没有公布审计收入、毛利率、经常性软件占比或股权结构表细节，与其假装精确，不如做情景分析。悲观情景假设公开客户证据仍过度偏教育，工业需求转化比叙事更慢，投资人在缺少硬财务数据时不愿支付完整的前沿溢价。在这个框架下，SpinQ
              应落在低位独角兽区间以下或附近。基准情景承认今天已经清楚存在的东西：2026 年上半年快速融资、横跨 NMR
              和超导路线的异常产品宽度、硬件出口，以及以中国为中心的扎实战略位置。这指向低到中位独角兽区间，而不是很小的创投估值。


              乐观情景不能只靠乐观。投资人需要看到私下证据：36Kr
              的盈利表述方向上成立，超导收入确实在扩张而不只是被强调，云和软件层不止演示、有变现空间，治理和退出准备也比公开记录更干净。因此，入场纪律格外重要。如果有效价格靠近合理区间下沿，上行仍可能补偿风险；如果在披露升级前，定价已经远高于大概率区间，投资人就是在为尚未到来的证据买单。
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
