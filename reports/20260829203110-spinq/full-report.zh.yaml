      - number: '1.3'
        title: 融资进展、规模代理指标与商业化信号
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，SpinQ 已明显进入后期融资阶段。2026 年 1 月 Series C、4 月 Series C+ 和 6 月 Series D 连在一起，显示融资节奏快速且规模逐轮变大，最终落到 RMB
              1 billion 的 Series D，以及此前六个月累计 RMB 2 billion 的融资。投资人结构和金额一样值得注意：多方来源都描述了国资或产业资本的强参与；中文 Series D
              新闻稿显示一个跨区域财团，横跨 CICC Capital、上海半导体资本、AVIC 关联资本和其他政策邻近基金。商业化信号有意义，但不均匀。官方和第三方来源反复称产品已部署到 40 多个国家、200
              多家机构；36Kr 和 Quantum Computing Report 则给出更接近收入的代理指标：NMR 系统作为可重复教育业务、2026 年一季度订单量同比增长
              80%、超导业务成为收入多数。这些指标令人鼓舞，但还没达到经审计财务披露。公开来源仍没有足够精确地给出收入、毛利率、现金或现金跑道，难以完成完整投资审查。
