      - number: '2.2'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              SpinQ 自己的解决方案页面把买方图谱讲得很清楚。高校、K-12 项目和科普机构是明确客户段，因为 SpinQ
              把设备、课件和培训打包成一站式教育方案。教育楔子重要：公司不用等到大规模工业容错实现，也能先把量子访问变现。科研机构和高阶大学实验室位于采用曲线上一层，使用桌面 NMR
              系统、实验平台和云工具做动手研究与教学。再往上是企业或准企业试点。SpinQ
              的金融页面强调投资组合优化、风险管理、预测建模、市场分析、信用评分和欺诈检测；生物医药页面强调基因测序、药物发现、疾病建模和基因组组装；AI
              页面强调梯度优化、神经网络训练和量子机器学习。横跨这些类别，云和软件都重要，因为它们降低试验门槛：买方不必一开始就安装完整超导系统，也能用上平台。这条分阶段采用路径——先教育、再科研和试点、最后工业系统——是
              SpinQ 在完全容错前变现的核心。
