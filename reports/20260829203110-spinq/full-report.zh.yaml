        blocks:
          - type: paragraph
            body: >-
              量子计算领域公开定价出人意料地不透明，SpinQ 也不例外。大多数被审阅公司把买方引向按报价销售系统、云访问或合作伙伴驱动部署，而不是简单标价。即便如此，打包差异仍能看见。SpinQ
              的教育方案捆绑设备、资源和培训；云和软件层降低上手门槛；超导系统似乎以集成解决方案出售，而不是只卖组件。Quantinuum 强调跨本地部署和云交付的硬件即服务，IBM 强调通过平台和网络会员访问机群，IonQ
              通过主要云和企业合作伙伴分发，D-Wave 则靠 Leap 云访问、混合求解器和面向优化的方案商业化。这些差异塑造切换成本。大学如果围绕 Gemini、Triangulum 或 SpinQit
              标准化实验室、课程或工具，SpinQ 就能形成锁定效应。但云访问也会降低休闲或探索型用户的切换成本，尤其当竞争对手通过热门公有云渠道开放机器时。换句话说，SpinQ
              的打包有助于获客和上手，但不能保证那种由经审计多年企业软件收入支撑的更硬锁定。
