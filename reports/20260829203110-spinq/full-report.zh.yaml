  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争对手范围与战略定位
        blocks:
          - type: paragraph
            body: >-
              SpinQ 没有一个干净单一竞争组，因为业务横跨教育 NMR 系统、超导量子硬件、软件和云访问。最相关的直接量子同业是 Quantinuum、IonQ、Rigetti、IBM Quantum、D-Wave 和
              Origin Quantum 等全栈软硬件供应商。在中国，Origin Quantum 是超导系统上最明显的国内全栈同业；QuantumCTek、Tencent Quantum Lab
              和其他国资背景组织等更广生态玩家，则争夺心智、政策支持和采购入口。在教育访问领域，SpinQ 的桌面 NMR
              系统占据更少见的细分位：它们不太是在和超大规模前沿机器竞争，更像是在和模拟器、实验课程包，以及其他动手量子学习路径竞争。这种分层竞争很重要，因为 SpinQ
              最强卖点不是绝对前沿领先，而是可及性、硬件宽度和以中国为中心的商业化组合。因此，正确问题不是 SpinQ 是否比 IonQ 或 IBM 更大，而是 SpinQ
              是否拥有一个独特市场片段：便携教育、科研上手和主权超导能力在这里交汇。
