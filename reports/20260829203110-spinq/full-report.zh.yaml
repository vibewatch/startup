      - number: '2.4'
        title: 采用约束、监管与尽调注意事项
        blocks:
          - type: paragraph
            body: >-
              市场逻辑成立，但投资者不该把政策支持等同于无摩擦需求。IMARC 强调量子专业人才严重短缺；法律评论和生态分析也显示，出口管制和国内采购规则不是短期噪音，而是中国量子市场的结构性特征。Entangled
              Future 和 PostQuantum 都把中国量子生态描述为越来越自给自足、政治上更可读，这有利于主权供应商，但也可能收窄国际合作并拉长供应链周期。技术本身仍不成熟：IMARC
              将通用商业量子计算描述为长期开发项目，纠错、低温和扩展仍未解决。McKinsey 全球监测报告对商业化乐观，但即便在那份报告里，重点也是付费共同开发和混合工作流，而不是像软件一样常态化放量。具体到
              SpinQ，近期市场在教育、科研和试点部署上有吸引力；若没有更好的公开数据证明经常性需求、预算和客户从实验转向生产的转化，它仍难以按广义企业平台做投资测算。
