  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              SpinQ 的适用市场窄于整个量子技术综合体。SpinQ 销售或推广超导硬件、NMR
              教育系统、云访问和软件，支撑优化、仿真、机器学习和科研工作流。这意味着公司主要参与量子计算基础设施与服务，而不是量子通信、传感或学术拨款支出这些更宽泛篮子；后者常常抬高中国量子行业标题数字。公开市场研究仍不完美，但方向上有用。IMARC
              估计中国量子计算市场 2025 年为 USD 258.64 million，并预计 2034 年达到 USD 3.56 billion，对应 33.84% CAGR。The Quantum Insider
              另行给出更宽的中国量子产业规模，2025 年约 CNY 11.56 billion，覆盖的生态系统比 SpinQ 眼前可服务市场更大。尽调视角应分层：TAM 是中国量子计算支出；SAM 是 SpinQ
              实际服务行业中的系统、云和应用工作流子集；SOM 则是更小的近期池子，即今天能购买或使用 SpinQ 产品的教育、科研和选择性工业试点。
