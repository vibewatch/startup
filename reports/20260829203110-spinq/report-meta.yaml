companyProfile:
  summary: 'SpinQ is a Shenzhen-based quantum-computing company founded in 2018 that combines two unusual strategic bets in one platform: desktop and lab-scale NMR systems for education and research, and superconducting quantum hardware aimed at more advanced industrial and scientific workloads. The company also markets a cloud platform, private-cloud deployment services, and the SpinQit software stack, making it one of the few Chinese quantum startups with visible product surfaces across hardware, software, and access layers. By mid-2026 it had raised rapidly across Series C, C+, and D rounds, announced meaningful overseas deployment breadth, and positioned itself as a strategic domestic quantum infrastructure asset, though public disclosure still lags what investors would need to underwrite exact economics or current valuation with confidence.'
  foundedDate: '2018-08-27'
  founders:
  - name: Jingen Xiang
    role: Founder & CEO
    background: Physicist and quantum-computing researcher publicly described by 36Kr as Tsinghua-trained, Harvard-postdoc, and backed by more than fifteen years of quantum R&D experience.
    claimRefs:
    - CO005
    - CO006
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: SpinQ sells NMR desktop and lab quantum systems, superconducting quantum computers and chips, quantum cloud access, private-cloud deployments, and the SpinQit programming framework.
  customerFocus: Universities, research institutions, and increasingly industrial or scientific buyers evaluating quantum workflows in finance, healthcare, AI, and materials-related contexts.
  businessModel: Monetization appears to combine hardware sales, education platforms, deployment and support services, cloud access, and software enablement rather than a single pure-SaaS or pure-hardware model.
  stage: late-stage private / Series D
  fundingStatus: SpinQ publicly announced a January 2026 Series C, an April 2026 Series C+ that brought total Series C financing near RMB 1 billion, and a June 2026 RMB 1 billion Series D. CB Insights records the latest round at about US$147.22 million and total raised at about US$256.94 million, but public sources still do not disclose an exact post-money valuation or preference stack.
