- id: TM004
  title: Growth drivers and constraints table
  columns:
  - factor
  - direction
  - evidence
  - market implication
  rows:
  - - 15th Five-Year Plan and MIIT policy
    - Positive
    - Quantum named among future industries; fault-tolerance and cloud/software targets specified
    - Sustains funding and procurement interest
  - - Large state and strategic investment vehicles
    - Positive
    - CNY 121.8B guidance vehicles and larger 2026 rounds
    - Improves capital formation for suppliers like SpinQ
  - - Cloud and hybrid access models
    - Positive
    - Quantum-as-a-service and cloud delivery lower adoption barriers
    - Expands SAM beyond buyers who can host hardware
  - - Education demand and talent building
    - Positive
    - Universities and K-12 adoption create training budgets and user pipeline
    - Supports near-term revenue and long-run ecosystem growth
  - - Talent shortage
    - Negative
    - Quantum skills gap and interdisciplinary hiring bottlenecks remain severe
    - Slows deployment and service quality at scale
  - - Export controls and supply-chain bifurcation
    - Negative
    - Controls accelerate localization but raise costs and complexity
    - Rewards domestic capability while limiting global flexibility
  - - Technology maturity gap
    - Negative
    - Error correction and scalable production use remain unresolved
    - Pushes broad enterprise adoption further out
  notes: Pairs positive commercialization drivers with the structural constraints that keep the near-term market smaller than headline forecasts imply.
