- id: constraints-and-diligence-caveats
  title: Adoption constraints, regulation, and diligence caveats
  body: 'The market case is real, but investors should not confuse policy support with frictionless demand. IMARC highlights a severe shortage of skilled quantum professionals, and both legal reviews and ecosystem analysis show that export controls and domestic-procurement rules are structural features of the Chinese quantum market rather than temporary noise. Entangled Future and PostQuantum both frame China’s quantum ecosystem as increasingly self-sufficient and politically legible, which helps sovereign suppliers but can also narrow international collaboration and lengthen supply-chain cycles. The technology itself remains immature: IMARC describes general-purpose commercial quantum computing as an extended development project with error correction, cryogenics, and scaling still unresolved. McKinsey’s global monitor is optimistic about commercialization, but even there the emphasis is on paid codevelopment and hybrid workflows rather than normalized software-like scale. For SpinQ specifically,
    this means the near-term market is attractive in education, research, and pilot deployments, yet still difficult to underwrite as a broad enterprise platform without better public data on recurring demand, budgets, and customer conversion from experimentation to production.'
