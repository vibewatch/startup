- id: dependency-people-and-financial-risks
  title: Dependency, people, and financial-model risks
  body: 'SpinQ’s dependency profile spans capital, talent, customers, and ecosystem infrastructure. Financially, the company has raised huge sums in 2026, which is positive, but that does not remove financing risk—it mostly proves how capital-intensive the roadmap is. Public peers show the category’s challenge clearly: quantum companies can command very high values while still posting small or volatile revenues and large cash needs. Customer-wise, the public proof set is still education-heavy, which may expose SpinQ to slower procurement cycles and budget sensitivity if higher-value enterprise adoption does not deepen. Talent and leadership are another hidden risk. The founder and core team appear technically strong, but public governance disclosure is still far from public-company depth, making succession, hiring depth, and execution bandwidth hard to judge. Finally, private-cloud and software claims imply dependence on continuous engineering upkeep; a broad stack without equally broad
    support capacity can create hidden failure points as deployments scale.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
