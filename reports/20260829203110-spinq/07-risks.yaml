chapter:
  number: 7
  title: Risks
  summary: SpinQ’s most material risks are not cosmetic. They cluster around deep-tech execution, capital intensity, incomplete trust disclosure, customer-quality opacity, and the geopolitical or supply-chain realities of scaling quantum hardware in China. The company has real strengths—especially domestic full-stack positioning and demonstrated global deliveries—but those same ambitions create dependency on technical milestones, manufacturing stability, and patient capital. The investment case survives these risks only if management can convert educational breadth into durable, higher-value infrastructure adoption while reducing opacity around reliability and finances.
sections:
- id: regulatory-and-legal-risks
  title: Regulatory, legal, and governance risks
  body: 'SpinQ benefits from operating in a strategic sector that Beijing wants to develop, but that support comes with an uneven regulatory and governance profile. Domestic procurement preferences can help a local champion win business, yet they also mean demand may be influenced by policy cycles and institutional approval processes rather than purely commercial urgency. Internationally, quantum computing sits inside a sensitive technology stack increasingly affected by geopolitics and tighter technical cooperation. Independent coverage on China’s sector highlights growing domestic financing and strategic importance, but also notes tighter international technical cooperation and dependence on imported components in some upstream areas. On the company surface itself, SpinQ’s public trust and governance layer looks thinner than its ambition: the reviewed Chinese privacy-policy and user-agreement links returned broken pages, and no public security certification or reliability program was found.
    Those are not thesis-killers alone, but they do raise the standard for private diligence on governance hygiene, export exposure, compliance controls, and customer data protections.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  tableRefs:
