- id: operational-and-quality-risks
  title: Operational, quality, and technology execution risks
  body: 'Operational risk is the core risk category for SpinQ because the company is trying to do several hard things simultaneously: maintain education products, evolve software tooling, operate cloud and private-cloud environments, scale superconducting hardware, and support international customers. That breadth is strategically attractive but operationally expensive. Public sources show real execution capability—overseas delivery, packaged software, multiple NMR products, cloud access, and a superconducting roadmap—but they do not provide the uptime, support SLAs, defect history, calibration stability, or field-service metrics needed to assess quality maturity. Independent and peer materials underline the challenge. Quantinuum, IBM, IonQ, Rigetti, and D-Wave all disclose deeper benchmark, hardware, or reliability surfaces than SpinQ does publicly. Even SpinQ’s own product-education material makes clear that the more advanced systems depend on chip design, measurement and control, simulators,
    cloud orchestration, and service support. In short, operational execution risk is not hypothetical; it is structurally embedded in the company’s chosen full-stack strategy.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
