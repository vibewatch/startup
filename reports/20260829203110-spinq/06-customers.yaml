- id: customer-verdict
  title: Customer verdict
  body: 'SpinQ has enough customer evidence to clear the threshold of “real demand exists.” Named institutions, multiple geographies, official deployment stories, and independent summaries all support that conclusion. The company also deserves credit for proving that quantum education can be commercialized through tangible physical systems rather than only cloud simulators. But the customer chapter does not clear the threshold of “durable, compounding customer engine proven.” Public information is simply too sparse on renewal quality, budget ownership, contract value, or product-line migration from education into higher-value infrastructure sales. For diligence purposes, the right stance is constructive but disciplined: SpinQ appears to have genuine global customer traction, especially in education and research, yet investors should treat current public evidence as breadth proof rather than retention proof or enterprise-depth proof. The next step is to request cohort, renewal, and concentration
    data before using customer adoption as a major valuation premium.'
