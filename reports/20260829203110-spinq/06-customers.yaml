- id: adoption-trajectory-and-proof
  title: Adoption trajectory and named customer proof
  body: 'SpinQ’s adoption trajectory appears to start with low-friction educational deployments and then branch into deeper institutional engagement. The UNAM case is the cleanest example: two Gemini Mini Pro systems were delivered to the School of Engineering, after which the university planned curriculum redesign, faculty training, thematic courses, and expanded student use. That is more valuable than a vague logo slide because it shows the product entering an operational teaching workflow. CB Insights provides corroborating proof for the University of Western Australia, Oslo Metropolitan University, Bandung Institute of Technology, and UNAM, while SpinQ’s own blog and global-expansion page broaden the list of named institutions and geographies. Independent coverage from 36Kr and GDToday supports the export and global-distribution narrative, including overseas delivery of superconducting hardware and presence across five continents. The pattern that emerges is not one of explosive self-serve
    software virality. It is a deployment model where one institutional win can expand into curriculum adoption, training, and broader visibility. The caveat is that public proof is still much stronger on named academic use than on repeat industrial production usage.'
