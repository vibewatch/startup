    - Improves margin of safety versus buying a premium narrative.
  - - Upgrade trigger
    - Audited financials plus cap-table and backlog proof
    - Would convert ambition into underwritable value.
  - - Primary downside trigger
    - Premium pricing without disclosure step-up
    - Leaves the investor paying ahead of proof.
