    - Industrial conversion lags, customer proof stays education-heavy, and investors discount missing financial disclosure.
    - Narrative loses premium and SpinQ prices as an opaque hardware-plus-project company.
  - - Base
    - 50%
    - US$1.1B-US$1.4B
    - Funding momentum, overseas deployments, and dual-route breadth are real, but audited economics remain incomplete.
    - Company is interesting and likely unicorn-class, yet not disclosed enough for a major premium.
  - - Bull
    - 25%
    - US$1.4B-US$1.8B
    - Private diligence validates profitability direction, strong superconducting mix, cloud/software monetization, and cleaner governance readiness.
    - Investors conclude the operating proof is still too thin for category-leader pricing.
  - - Probability-weighted central view
    - 100%
    - approx. US$1.2B-US$1.3B
    - Evidence improves somewhat, but not enough to justify paying far above the plausible band today.
    - Buying materially above the range before disclosure arrives destroys margin of safety.
  notes: Ranges are analyst estimates in USD billions anchored on financing scale, public comp discipline, product breadth, and identified downside channels rather than on an audited revenue model.
