- id: scenario-range-and-entry-discipline
  title: Scenario range, price discipline, and what the market still has to believe
  body: 'Because SpinQ does not publish audited revenue, gross margin, recurring-software mix, or cap-table mechanics, scenario analysis is more honest than pretending to precision. The bear case assumes that the public customer proof remains too education-heavy, that industrial demand conversion takes longer than the narrative suggests, and that investors refuse to pay a full frontier premium without harder financial data. Under that framing, SpinQ belongs below or around the low-unicorn zone. The base case gives the company credit for what is clearly real today: rapid H1 2026 fundraising, unusual product breadth across NMR and superconducting routes, exported hardware, and a legitimate China-centric strategic position. That points to a low- to mid-unicorn range rather than a tiny venture mark.


    The bull case requires more than optimism. Investors would need private evidence that the 36Kr profitability framing is directionally right, that superconducting revenue is scaling rather than simply being promoted, that cloud and software layers have monetization potential beyond demos, and that governance plus exit readiness are cleaner than the public record currently reveals. That is why entry discipline matters so much. If effective pricing is near the lower part of the plausible range, upside can still compensate for risk. If pricing is already well above the likely range without a disclosure step-up, the investor is paying for proof that has not yet arrived.'
