    severity: material
    topic: industrial-backlog-and-repeat-demand
    missingEvidence: Named industrial customers, backlog quality, repeat orders, and pilot-to-production conversion data for superconducting systems.
    whyItMatters: The biggest valuation debate is whether SpinQ is mostly an education-and-strategy platform today or already building repeatable industrial demand.
    diligencePath: Request top-customer pipeline, shipment history, and repeat-order evidence by account type.
