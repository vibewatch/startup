- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Platform breadth
    - SpinQ is a rare Chinese full-stack quantum company spanning NMR, superconducting, cloud, private cloud, and software.
    - Breadth can also hide uneven economics across hardware, services, and software lines.
    - Segment revenue and gross-margin bridges by product family.
  - - Commercial proof
    - 40+ countries, 200+ institutions, and named deployments show the story is not purely conceptual.
    - Named proof still skews toward education and research rather than high-value industrial production.
    - Named industrial backlog, repeat orders, and expansion case studies.
  - - Funding momentum
    - H1 2026 fundraising signals strategic importance and capital access.
    - Large rounds do not reveal effective valuation, dilution, or eventual investor economics.
    - Term sheets, cap table, and preference stack.
  - - Category multiple support
    - Public quantum equities prove billion-dollar values are possible in this sector.
    - Public names are volatile, loss-making, and much more disclosed than SpinQ.
    - Evidence that SpinQ can clear similar milestones with cleaner unit economics.
  - - IPO / exit optionality
    - Pre-IPO language suggests possible path to broader liquidity and credibility.
    - Public evidence still falls far short of IPO-grade readiness.
    - Prospectus-style KPI pack, governance map, and audit readiness.
  - - China strategic position
    - Domestic policy and industrial backing could help SpinQ reach scale faster than under-capitalized peers.
    - Policy-led capital should not be mistaken for proven commercial durability.
    - Customer-quality, margin, and exportability proof that survives beyond policy support.
  notes: The anti-thesis is driven mostly by evidence quality and economics visibility, not by a belief that SpinQ lacks technical ambition.
