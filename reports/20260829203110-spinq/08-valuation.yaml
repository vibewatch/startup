  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: priced-cap-table-and-preferences
    missingEvidence: Post-money valuation, diluted share count, board rights, liquidation preferences, ratchets, and anti-dilution mechanics for the 2026 rounds.
    whyItMatters: Headline financing size is public, but investor economics may differ materially from the headline valuation once terms are known.
    diligencePath: Request final term sheets, the current cap table, and counsel memos covering investor rights and IPO-conversion mechanics.
    relatedQuestionRefs:
    - QV002
    - QV025
    relatedTableRefs:
    - TV001
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: audited-segment-economics
    missingEvidence: Audited FY2025/FY2026 revenue, gross margin, operating loss, cash flow, and segment contribution by NMR, superconducting, cloud, and software.
    whyItMatters: Valuation today is being asked to carry platform breadth without proof of which layers actually monetize and at what quality.
    diligencePath: Request audited accounts, monthly management reporting, and product-line revenue/gross-margin bridges.
    relatedQuestionRefs:
    - QV026
    - QV024
    - QV017
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
