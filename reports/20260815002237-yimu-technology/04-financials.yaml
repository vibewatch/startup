- id: financial-verdict-and-disclosure-gaps
  title: The underwriting problem is opacity, not absence of a business model
  body: 'The bullish financial case is straightforward: Yimu has repeatedly raised capital, entered real supply chains, demonstrated multi-scenario commercialization, and now appears to have enough capital to pursue a larger embodied-AI ramp. The adverse case is equally important: public sources still do not disclose revenue, gross margin, backlog, monthly burn, receivables, capex, or runway. Even the most useful valuation anchors come from funding announcements and secondary databases rather than audited operating performance. Public growth hints—such as 2023 smart-home growth of 14x or management saying performance growth improved further in 2026—show momentum, but they do not solve the underwriting question. For investors, the right conclusion is not that Yimu lacks economics; it is that Yimu has not published enough economics to prove that its current valuation is supported by durable, internally financed growth. Books-open diligence must focus on segment mix, realized ASP, gross margin,
    burn, and cash conversion.'
