- id: funding-history-and-capital-adequacy
  title: Funding depth is credible and now geared toward scale-up
  body: Yimu’s financing history is publicly visible enough to support a basic capital map. The January 2025 D round brought in several hundred million yuan led by SAIF, with Nanjing Innovation Investment Group and Songlin Technology also participating. That reporting also said Yimu had already completed five earlier rounds, with investor names including Shunwei Capital, Toukong Donghai, TCL, Yingfeng Investment, and GigaDevice-affiliated capital. By July 2026, the company announced a Series E exceeding RMB1 billion at a valuation above RMB10 billion, with proceeds earmarked for tactile materials, chips, algorithms, models, and large-scale production plus order delivery. Several coverage sources repeat the same use-of-proceeds language, which matters because it suggests the round is not just a research reset; it is also a working-capital and manufacturing-capacity round. Database-style sources convert that signal into a roughly US$140M-$148M round and a US$1.4B-$1.5B valuation, but those
    sources are incomplete and should be treated as secondary calibration rather than canonical truth.
