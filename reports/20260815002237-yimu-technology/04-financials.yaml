    - No public price
    - Shows Yimu can monetize complete solutions, not only raw components
    - No ASP, margin, or service-content disclosure
  - - Tactile sensor modules
    - E-round and WAIC coverage show order delivery and customer demand
    - No public price
    - Shows customers are paying for tactile perception, not just R&D demos
    - No view on per-unit revenue, discounts, or bundling
  - - Data / model layer
    - Official models page plus WAIC interview suggest sellable model/data infrastructure
    - No public price
    - Suggests possible higher-value software or service attachment
    - No visibility into recurring revenue or contract structure
  - - Market-level tactile component benchmark
    - GIR summary suggests ~US$295 average 2025 tactile-sensor price globally
    - Indirect only
    - Provides a narrow component benchmark for the sensor layer
    - Not a like-for-like benchmark for Yimu’s full-stack solutions
  - - Customer-specific enterprise solutions
    - Interviews stress different clients need different interfaces and workflows
    - Quote-led
    - Suggests lumpy project revenue with solution-specific packaging
    - Makes margin inference impossible without invoices or quotes
  notes: Yimu discloses enough to prove commercial intent but not enough to expose realized pricing mechanics.
