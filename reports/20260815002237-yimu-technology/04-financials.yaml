company:
  name: Yimu Technology
chapter:
  number: 4
  title: Financials
  summary: 'Yimu’s public record shows a company that has raised substantial capital, broadened its commercial footprint from water and smart-home systems into embodied-intelligence tactile sensing, and is now funding both R&D and scale-up for order delivery. What it does not show is the actual operating P&L: no revenue, gross margin, burn, working-capital, or cash-runway figures are disclosed. The most defensible financial read is therefore that Yimu has credible financing depth and multiple monetization paths, but still needs books-open diligence before its $1.4B-$1.5B valuation can be tied to durable cash generation.'
sections:
- id: revenue-model-and-monetization-surface
  title: Revenue model is visible at the surface, but not in the numbers
  body: 'Public reporting shows that Yimu is not a single-product startup. Its earlier commercialization base spans smart water, smart home, and life-science instrumentation, while its newer growth push centers on tactile sensing for embodied intelligence. Multiple interviews and articles say the company entered TCL, Whirlpool, and Panasonic supply chains, supplied TENET and TCL on AI wash-care robotics, and now sells to at least two buyer classes in tactile sensing: large technology companies with model teams and data-service providers. That implies several monetization layers: component or module sales, integrated solutions, model or algorithm attachment, and potentially tactile-data or platform services. However, none of the public sources disclose the realized revenue split among those layers, the contract sizes, the attachment rate of software or data services, or whether the newer embodied-AI business has already overtaken the legacy smart-home and water businesses. The result is a
    company with visible revenue engines but opaque revenue quality.'
