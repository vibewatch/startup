- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Status
  - Why it matters
  - Risk if absent
  - Priority diligence ask
  rows:
  - - Revenue by segment
    - Not public
    - Needed to know whether legacy verticals or tactile growth drive the business
    - Valuation may overweight a still-small segment
    - Get 2024-2026 revenue split and growth rates
  - - Gross margin
    - Not public
    - Needed to judge product economics
    - High growth could still destroy value if margin is thin
    - Get product-level and blended gross margin
  - - Backlog / order book
    - Not public
    - Needed to validate order-delivery narrative
    - Scale-up financing may not map to durable demand
    - Get backlog, pipeline, and cancellation rate
  - - Burn and runway
    - Not public
    - Needed to assess capital adequacy
    - Large rounds can be consumed quickly in hardware scale-up
    - Get monthly burn, cash balance, and runway
  - - Working-capital profile
    - Not public
    - Needed to understand scaling friction
    - Inventory and receivables can stress cash even with growth
    - Get DSO, DPO, inventory turns, and advance payment terms
  - - Customer concentration
    - Not public
    - Needed to judge dependence on a few appliance or robot customers
    - Revenue quality may be weak if tied to a small number of design wins
    - Get top-10 customers and concentration by revenue
  - - Capex / manufacturing model
    - Not public
    - Needed to determine capital intensity and partner dependence
    - Margins and delivery risk vary by in-house versus outsourced production
    - Get factory model, capex plan, and yield data
  notes: The central financial problem is missing disclosure, not lack of strategic narrative.
