tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Public monetization evidence
  - Revenue quality read
  - Main uncertainty
  - Diligence ask
  rows:
  - - Smart water / environmental sensing
    - Legacy commercialization repeatedly described in interviews and company history
    - Potentially steadier enterprise / infrastructure revenue than frontier robotics
    - Current size versus newer businesses is unknown
    - Need 2024-2026 revenue by segment and customer type
  - - Smart-home / appliance AI modules
    - Entered TCL, Whirlpool, Panasonic supply chains; TENET/TCL wash-care robot program
    - Could provide bridge revenue and validation before humanoid scale
    - Contract duration, volume, and gross margin are undisclosed
    - Need design-win list, production volumes, and realized ASP
  - - Life-science instrumentation
    - 36Kr and follow-on interviews describe high-throughput spectral detection use cases
    - Likely higher-value but narrower enterprise sales
    - No public bookings or customer concentration data
    - Need current sales pipeline and installed base
  - - Embodied-AI tactile sensors and modules
    - 2026 E-round coverage and WAIC reporting show tactile sensor commercialization and order delivery
    - Strategic high-growth revenue engine with higher valuation relevance
    - Actual shipment volume and attach rate are unknown
    - Need 2025-2026 tactile revenue, shipments, and backlog
  - - Data / model / platform services
    - WAIC interview says customers include model teams and data-service providers; official site sells models and data logic
    - Could become higher-quality recurring or service revenue
    - No public pricing or recurrence data
    - Need software/data revenue share and retention metrics
  notes: The revenue streams are visible from product and customer evidence, but their mix and margin profile remain undisclosed.
