- id: unit-economics-proxies-and-capital-intensity
  title: The business appears capital intensive, with reuse benefits but customization burdens
  body: 'Even without a P&L, public interviews reveal a cost structure that is unlikely to be light. Li Zhiqiang says a single chip can require 18 to 24 months of development and at least RMB30 million of investment, with yield and tape-out learning accrued iteratively. Multiple sources also emphasize that Yimu’s scale-up spending now spans materials, chips, algorithms, models, and production lines, while customer deployments require product consistency, stability, data alignment, and real-world order delivery. These are classic capital-intensity signals. At the same time, management argues that core sensing and algorithmic layers are reusable across water, home, life-science, and robotics applications, which, if true, could improve R&D leverage over time. The counterweight is customization and service burden: different end customers still need application-specific interfaces, data pipelines, calibration, and deployment support. That means Yimu may achieve attractive product-level economics
    on successful modules while still consuming significant cash at the company level until volumes stabilize.'
