- id: TI003
  title: Unit economics table
  columns:
  - Metric or proxy
  - Public value / signal
  - Confidence
  - Why it matters
  - Exact diligence ask
  rows:
  - - Current revenue
    - Not disclosed
    - high
    - Without top line, valuation multiples cannot be normalized
    - Need monthly and annual revenue by segment
  - - Current gross margin
    - Not disclosed
    - high
    - Margin determines whether scale can self-fund growth
    - Need product-level gross margin and blended gross margin
  - - Chip-development investment
    - At least RMB30M and 18-24 months per chip in management interview
    - medium
    - Shows deep upfront R&D and process cost
    - Need actual capex/R&D capitalization and payback per chip family
  - - R&D reuse across verticals
    - Management says core platform tech is highly reusable across scenarios
    - medium
    - Could improve economics if one core stack serves many markets
    - Need evidence of code/hardware reuse and incremental gross margin by vertical
  - - Customization burden
    - Different customers need different interfaces and application tuning
    - medium
    - Can absorb gross profit through services and support
    - Need implementation cost, deployment time, and support headcount
  - - Working-capital demand
    - Series E earmarked for mass production and order delivery
    - medium
    - Scale-up often requires inventory, receivables, and manufacturing cash
    - Need inventory turns, receivables days, and advance-payment terms
  notes: The table is proxy-based because the company does not publish standard operating metrics.
