- id: named-proof-and-adoption-trajectory
  title: Named proof is strongest in appliance and ecosystem channels
  body: 'Open-source customer proof is strongest where Yimu’s technology already touched visible products or supply chains. Multiple 2025-2026 articles say Yimu entered the supply chains of TCL, Whirlpool, and Panasonic. Several sources also connect Yimu to TENET and TCL on an AI wash-care robot shown at CES 2025, with follow-on reports saying mass production was progressing steadily. By contrast, the robot-OEM side is commercially legible but less named. 2026 articles discuss orders, industry-head cooperation, and commercial application in humanoid robots, industrial assembly, pharmaceuticals, food, and automotive contexts, but most do not disclose the specific robot customers. Partner proof is clearer than robot-customer proof: multiple sources say the company is working with Stanford-linked institutions and other international organizations on TouchNet. The net effect is a customer set that is broadening, but whose named proof remains concentrated in the smart-home bridge market and research
    ecosystem.'
