- id: customer-verdict-and-diligence-blockers
  title: The prudent customer verdict is positive on adoption, negative on transparency
  body: 'The bullish customer read is that Yimu has already crossed from concept into real customer environments: it appears in appliance supply chains, co-builds visible AI products, serves model/data customers, and has enough demand to talk publicly about order delivery and scale-up. The adverse read is that almost every metric an investor would want—customer count, active deployments, expansion rate, churn, top-customer concentration, and satisfaction—remains unreported. That means the company’s customer chapter is not weak because there is no evidence; it is weak because the available evidence is concentrated, narrative-heavy, and only partly named. The right conclusion is therefore balanced: Yimu likely has real customer traction and a widening ecosystem, but customer-quality underwriting still depends on direct company disclosure, customer references, and contract-level diligence. That distinction is central to diligence. Publicly, this remains incomplete.'
