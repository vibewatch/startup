chapter:
  number: 6
  title: Customers
  summary: Yimu’s customer evidence is real but uneven. The clearest named proof sits in the appliance and smart-home ecosystem—TCL, Whirlpool, Panasonic, and TENET-linked wash-care robotics—while 2026 tactile-sensing demand is described more through customer classes, orders, and partner ecosystems than through long public lists of robot OEM names. That pattern supports a company that is commercially engaged and expanding, but still under-disclosed on customer count, retention, concentration, and repeat usage.
sections:
- id: customer-segments-and-buying-centers
  title: Customer segments and buyer map
  body: 'Yimu’s public materials and interviews imply a multi-segment customer base rather than a single buyer archetype. The official ecosystem page groups counterparties into hardware vendors, model developers, skill builders, and academic researchers. 2026 management interviews narrow the active customer base further: one class is large technology companies with model teams, and another is data-service providers. Earlier commercialization reporting adds appliance and smart-home OEMs, while newer tactile-sensing coverage points to robot OEMs and integrators embedding Yimu’s modules into dexterous hands and operational stacks. These segments matter because budget ownership is unlikely to sit in one place. Appliance buyers probably purchase through product, engineering, or ecosystem channels; tactile-data customers may buy through model or data teams; robot OEMs likely buy through advanced hardware or manipulation programs. The company’s customer story is therefore not “many identical logos,”
    but “several buyer classes buying different layers of the stack.”'
