- id: retention-expansion-and-concentration
  title: Retention, repeat usage, and concentration are mostly disclosure gaps
  body: The public record gives only proxies for customer quality. There is no disclosed customer count, no net revenue retention, no cohort data, no renewal rates, and no published satisfaction or uptime metrics. The strongest indirect signals are that Yimu raised successive rounds while expanding from water and home applications into embodied AI, that its smart-home business reportedly grew 14x in 2023, and that management said 2026 performance growth became more obvious over the prior half year. Those are momentum signals, not retention metrics. Concentration risk is likely meaningful because the named proof set is short and clustered around appliance and ecosystem relationships, while the robot-OEM demand story remains largely unnamed. At the same time, the expansion path across multiple industries may reduce dependence on any single end market over time. The evidence supports commercial relevance, but not yet a clean read on whether customers expand, repeat, or renew in a durable, diversified
    way. In practical terms, investors should assume the published customer evidence is only a floor, not a complete map, until the company opens segment counts, reorder behavior, and referenceable deployments.
