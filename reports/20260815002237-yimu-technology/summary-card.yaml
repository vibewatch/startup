  topStrengths:
    - >-
      Yimu is positioned as tactile and physical-AI infrastructure rather than a single demo product, with official
      materials spanning sensing, data, models, and ecosystem layers.
    - >-
      The company has repeated financing support culminating in a July 2026 unicorn-mark Series E tied to both R&D and
      production or order delivery.
    - >-
      Public customer and commercialization evidence extends beyond pure robotics hype into appliance and adjacent
      industrial contexts, reducing zero-revenue risk.
    - >-
      Tactile sensing remains a strategically scarce capability inside embodied-intelligence stacks, which can support
      premium positioning if Yimu proves repeatability.
    - >-
      China’s embodied-intelligence boom and emerging standards can favor a supplier that aligns early with component,
      data, and safety expectations.
  topRisks:
    - >-
      Revenue, gross margin, backlog, concentration, and cash-generation quality are still undisclosed, limiting
      underwriting confidence at the current price.
    - Public proof is stronger for adjacent commercialization than for a large set of named robot-OEM production wins.
    - >-
      Tactile hardware can commoditize unless Yimu converts module adoption into sticky data, software, or workflow
      attachment.
    - >-
      Standards evolution, export-control spillover, and cross-border procurement friction can compress attainable
      multiples even if domestic demand remains strong.
    - >-
      If future rounds or public benchmarks prioritize profitability and auditable delivery more harshly, unicorn-era
      pricing could re-rate downward.
  unresolvedGaps:
    - Segmented 2024-2026 revenue, growth, and gross margin disclosure.
    - Backlog, pilot-conversion, cancellation, and repeat-order evidence for robot-OEM programs.
    - Top-customer concentration, realized ASPs, and service/support burden by product family.
    - Preferred-equity, liquidation, anti-dilution, and employee-pool terms that determine actual equity returns.
    - Whether appliance and other bridge businesses are durable profit centers or transitional proof points.
