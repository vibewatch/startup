- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer
  - Public description
  - Key dependencies
  - Output
  - Main risk
  rows:
  - - Sensor layer
    - Visuotactile module captures microscopic deformation optically
    - Flexible materials, optics, packaging, calibration
    - Pressure, shear, texture, slip, contact-state signals
    - Yield, durability, fit inside robot fingers
  - - Collection layer
    - Real-world manipulation data captured in UMI / DexUMI / Ego-like workflows
    - Customer hardware access, storage, labeling, synchronization
    - Success/failure tactile datasets
    - Inconsistent data quality across deployments
  - - Encoding layer
    - Tactile Transformer Encoder turns raw signals into standardized representations
    - Model design, compute, cross-hardware normalization
    - Reusable tactile features
    - Weak benchmark transparency
  - - Fusion / model layer
    - Touch fused with visual and language signals for embodied models
    - Model training stack, multimodal alignment
    - Better action selection and grounded control
    - Generalization and latency unknown
  - - Execution layer
    - Robots use tactile signals for force-adaptive manipulation and slip correction
    - Controller integration, runtime performance, safety logic
    - More precise real-world action
    - Failure handling and safety disclosure limited
  notes: The architecture table translates public messaging into an operational stack view.
