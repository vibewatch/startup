- id: roadmap-readiness-and-verdict
  title: Roadmap, maturity, and the main technical verdict
  body: 'The roadmap signal is clear even if the release discipline is not. By 2025, Yimu was already publicly planning humanoid tactile modules and overall algorithm solutions; by mid-2026, it was presenting a full-stack visuotactile solution at WAIC, describing customer orders, and saying TouchNet would open more real tactile data by the end of 2026. One 2026 report also references a December 2025 D2 round earmarked for deeper sensor R&D, mass-production progress, and ecosystem building, which fits the broader scale-up narrative. Taken together, the evidence supports a company that has progressed beyond research-only prototypes into early commercialization with a coherent architecture. The conservative caveat is that product maturity remains uneven: the tactile hardware story is relatively concrete, while software interfaces, standardization, compliance, and sustained field reliability are still under-disclosed. The correct chapter verdict is therefore positive on technical seriousness
    and negative on public de-risking completeness. Publicly, today.'
