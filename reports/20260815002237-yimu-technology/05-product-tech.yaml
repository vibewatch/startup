  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-benchmarks
    missingEvidence: Independent benchmark data on durability, drift, response time, and success rates under repeated robotic tasks.
    whyItMatters: The chapter can describe the architecture, but not prove industrial robustness without test results.
    diligencePath: Request third-party validation, customer acceptance-test data, and lifetime test protocols.
    relatedQuestionRefs:
    - QE013
    - QE015
    - QE019
    - QE024
  - type: missing-source
    severity: material
    topic: software-and-interface-discipline
    missingEvidence: Public API documentation, versioning policy, compatibility guarantees, and failure-mode handling for model/data interfaces.
    whyItMatters: A touch stack becomes sticky only if the interfaces are stable enough for external users and long-lived deployments.
