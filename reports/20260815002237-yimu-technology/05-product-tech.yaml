callouts:
- calloutType: insight
  title: Yimu is selling a touch stack, not just a touch chip
  body: The public material repeatedly connects hardware, data capture, encoding, and model fusion. That makes Yimu’s product story more ambitious than a commodity sensor vendor’s, and harder to benchmark by one spec sheet alone.
  claimRefs:
  - CE001
  - CE009
  - CE010
  - CE015
- calloutType: risk
  title: The biggest product risk is scale consistency, not concept validity
  body: Open sources support the existence of the technology and its architecture. They do not yet prove production consistency, qualification discipline, or long-run reliability under broad deployment.
  claimRefs:
  - CE021
  - CE022
  - CE026
  - CE027
  - CE038
- calloutType: assumption
  title: TouchNet is strategically important only if it becomes operationally useful
  body: An open-data ecosystem can strengthen Yimu’s moat, but only if the released data is standardized enough to matter to developers and customers rather than to publicity alone.
