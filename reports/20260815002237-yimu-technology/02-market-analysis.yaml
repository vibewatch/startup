callouts:
- calloutType: insight
  title: The tactile-sensor SAM is smaller than the humanoid narrative, but strategically central
  body: Yimu does not need the full humanoid market to be enormous in order to matter. If touch remains a bottleneck for reliable manipulation, a supplier that can solve sensing, data, and integration can capture disproportionate value inside a smaller but more indispensable layer.
  claimRefs:
  - CM001
  - CM008
  - CM023
  - CM031
- calloutType: risk
  title: Market estimates are only directionally useful because scope varies wildly
  body: The spread between narrow GIR-style sensor estimates and broad Chinese white-paper or dexterous-hand estimates shows how easy it is to overstate TAM. Investors should underwrite Yimu against the narrower direct-sensor market first, then treat broader hand-system figures as upside scenarios.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM014
- calloutType: strength
  title: Yimu has a bridge market outside pure humanoids
  body: Because Yimu already emerged from smart-home and multisignal sensing applications, it is not as exposed to a single humanoid deployment timetable as a pure humanoid startup or a one-customer hand maker.
  claimRefs:
  - CM021
  - CM022
  - CM030
