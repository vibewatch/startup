- id: growth-drivers
  title: Growth drivers accelerating adoption
  body: 'Several forces are clearly expanding demand for tactile sensing. First, humanoid and dexterous-hand production is rising fast enough that touch is no longer a lab-only topic. Chyxx says China sold 19,200 dexterous hands in 2025, up 236.84% year over year, while Gongboshi and Ofweek both describe 2025-2026 as a transition from prototypes toward scaled delivery. Second, falling costs are widening the use-case envelope. TechBuzzChina notes that dexterous hands now represent around 15-20% of a humanoid robot’s total cost, and that Chinese producers are driving some hand prices down below US$1,000 from far higher import benchmarks. Third, the application map is expanding beyond humanoids alone: industrial precision assembly, logistics handling, medical and rehabilitation robots, service robots, and even appliance-like household systems all need better force, slip, or texture understanding. Finally, Yimu’s own strategy benefits from the market’s need for data and integration layers, not
    only hardware. Its TouchNet and world-action-model messaging is aligned with a market increasingly concerned that touch is useful only when it can be standardized, interpreted, and transferred into control policies.'
