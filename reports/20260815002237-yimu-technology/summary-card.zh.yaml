  topStrengths:
    - Yimu 定位为触觉和物理 AI 基础设施，而不是单一 demo 产品；官方材料覆盖感知、数据、模型和生态层。
    - 公司多次获得融资支持，2026 年 7 月 Series E 把估值推至独角兽区间，资金用途同时指向研发、生产或订单交付。
    - 公开客户和商业化证据不止机器人热潮，还延伸到家电及相邻工业场景，降低零收入风险。
    - 触觉传感仍是具身智能栈里的战略稀缺能力；若 Yimu 证明可复制性，溢价定位就有支撑。
    - 中国具身智能热潮和正在形成的标准，可能利好较早对齐部件、数据和安全预期的供应商。
  topRisks:
    - 收入、毛利率、订单储备、客户集中度和现金生成质量仍未披露，限制了按当前价格承销的信心。
    - 公开证据更能证明相邻商业化，而不是大批具名机器人 OEM 量产胜利。
    - 若 Yimu 不能把模块采用转成有粘性的数据、软件或工作流绑定，触觉硬件可能商品化。
    - 即便国内需求保持强劲，标准演进、出口管制外溢和跨境采购摩擦也可能压缩可实现倍数。
    - 若后续融资或公开市场基准更严厉地看重盈利能力和可审计交付，独角兽时期定价可能下修。
  unresolvedGaps:
    - 分部披露 2024-2026 年收入、增长和毛利率。
    - 机器人 OEM 项目的订单储备、试点转化、取消和复购证据。
    - 按产品家族拆分的头部客户集中度、实际 ASP 和服务 / 支持负担。
