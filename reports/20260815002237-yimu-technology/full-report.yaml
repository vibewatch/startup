      - number: '1.3'
        title: Capital base and investor signal
        blocks:
          - type: paragraph
            body: >-
              The public funding arc is one of the clearest supports for Yimu’s current market position. July 2026
              coverage from TechNode, China Securities Journal, Economic Information Daily, Tencent News, TMTPost, and
              others consistently says the company completed a Series E of more than RMB1 billion at a valuation above
              RMB10 billion. Those same reports say the new money is intended for tactile-perception materials, chips,
              algorithms, and models, plus mass production and delivery of production-line orders. Earlier financing
              coverage from January 2025 shows a several-hundred-million-RMB D round led by SAIF with Nanjing Innovation
