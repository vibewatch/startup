  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and rivalry structure
        blocks:
          - type: paragraph
            body: >-
              Yimu’s competitive arena is best understood as a layered field. At the narrowest layer are dedicated
              tactile-sensor specialists that sell fingertips, skins, pressure arrays, or related force-sensing
              components into robot hands and grippers. XELA Robotics, GelSight, Pressure Profile Systems, SynTouch, and
              Tekscan all appear in third-party market lists or public product material as touch-sensing benchmarks. A
              second layer includes Chinese embodied-intelligence suppliers such as PaXini and other Shenzhen- or
              Shanghai-based tactile entrants listed in market studies. A third layer is substitute technology: high-end
              force/torque sensors, better machine vision, and end-effector software that can sometimes reduce the need
              for dense tactile hardware. This matters because Yimu is not fighting a simple feature-for-feature battle
              against one standard product. It is competing simultaneously on sensor performance, ease of integration,
              ecosystem fit, data readiness, and whether customers want a component specialist or a fuller physical-AI
              partner.
            claimRefs:
