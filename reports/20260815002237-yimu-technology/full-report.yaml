      - number: '1.4'
        title: Technology arc and milestones
        blocks:
          - type: paragraph
            body: >-
              Yimu’s recent narrative is not simply “a sensor company raised money.” The evidence shows a deliberate arc
              from multimodal sensing in water and smart-home systems into embodied-AI tactile infrastructure. January
              2025 coverage says Yimu’s earlier business base included smart water, smart home, and life-science sensing
              products, and that the company already sat in TCL, Whirlpool, and Panasonic supply chains before the
              robot-tactile narrative became central. CES 2025 then gave the company a visible bridge product: an AI
              laundry robot / washing-care system co-developed with TCL ecosystem partner TENET, with multimodal
              clothing recognition and dexterous handling. By July 2026, the corporate story had shifted further toward
              robot touch. Multiple sources describe a sub-3mm visuotactile sensor, more than 10,000 sensing points,
              milligram-level force precision, 0.005N force resolution, and a three-layer architecture of tactile data
              capture, tactile encoding, and multimodal world-model training. The company is also using the open-dataset
              concept to widen its moat: several July 2026 reports say Yimu is working with Stanford-affiliated
              researchers on TouchNet, with more real tactile data planned for open release by the end of 2026.
