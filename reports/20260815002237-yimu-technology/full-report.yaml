            body: >-
              Public reporting shows that Yimu is not a single-product startup. Its earlier commercialization base spans
              smart water, smart home, and life-science instrumentation, while its newer growth push centers on tactile
              sensing for embodied intelligence. Multiple interviews and articles say the company entered TCL,
              Whirlpool, and Panasonic supply chains, supplied TENET and TCL on AI wash-care robotics, and now sells to
              at least two buyer classes in tactile sensing: large technology companies with model teams and
              data-service providers. That implies several monetization layers: component or module sales, integrated
              solutions, model or algorithm attachment, and potentially tactile-data or platform services. However, none
              of the public sources disclose the realized revenue split among those layers, the contract sizes, the
              attachment rate of software or data services, or whether the newer embodied-AI business has already
              overtaken the legacy smart-home and water businesses. The result is a company with visible revenue engines
