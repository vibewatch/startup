      - number: '2.3'
        title: Buyers, users, and budget owners
        blocks:
          - type: paragraph
            body: >-
              The buyer map for tactile sensing is different from the buyer map for finished robots. At the component
              layer, Yimu’s most natural customers are robot OEM engineering teams, dexterous-hand manufacturers,
              industrial integrators, and research organizations that need sensing hardware plus data and model support.
              The official ecosystem page reinforces this by segmenting counterparties into hardware vendors, model
              developers, skill builders, and academic researchers. In downstream application terms, MarketResearch.com
              and the Chinese white-paper sources identify dexterous hands, humanoid robots, industrial grippers,
              medical or rehabilitation robots, warehouse robots, and service robots as relevant end-use domains. Budget
              ownership typically sits with R&D, advanced manufacturing, or platform procurement teams early in the
              cycle, then shifts toward program management or operations only after the sensing stack is proven in
              stable deployments. Yimu also has a bridge segment outside pure robotics: 2025 reporting shows its
              multimodal AI systems already entered smart-home and appliance supply chains, which gives it an additional
              route into customers that are experimenting with robotized household devices before committing to full
              humanoid programs.
