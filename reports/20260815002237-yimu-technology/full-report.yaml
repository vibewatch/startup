      - number: '8.2'
        title: Financing context and why price discipline still matters
        blocks:
          - type: paragraph
            body: >-
              The current valuation anchor is substantial by any China industrial-hardware standard. Multiple July 2026
              reports converge on a Series E of more than RMB1 billion at a valuation above RMB10 billion, while
              secondary English-language and database-style sources translate the mark into roughly US$1.4B-US$1.5B.
              That is not obviously irrational in a market where embodied-intelligence funding is abundant and where
              high-quality tactile sensing remains strategically scarce. Yimu also has advantages that can support
              premium framing: management consistently presents the business as a cross-vertical sensing-and-data
              platform, not a single demo product, and earlier commercialization in home and appliance settings reduces
              the chance that 2026 financing is funding a zero-revenue science project.


              But price discipline still matters because the next layer of proof is missing. The strongest public
              benchmark in China is now Unitree, whose 2026 IPO materials put valuation and financial output into the
              same frame. Yimu does not yet provide that level of disclosure. Public listed comparables such as Keyence,
              Cognex, and Ambarella also remind investors that valuation multiples are ultimately paid on disclosed
              economics, not on technological importance alone. Yimu may deserve a specialist premium if it converts
              tactile modules into sticky software, data, and system attachment. Until that conversion is shown in
              disclosed numbers, investors should treat the current mark as fair-to-stretched rather than obviously
              cheap.
            claimRefs:
              - CV001
