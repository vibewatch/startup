      - number: '3.5'
        title: Moat durability and competitive risk register
        blocks:
          - type: paragraph
            body: >-
              No player appears to have a complete moat today. The entire sector still faces reliability, standards, and
              integration problems, which means customer lock-in remains weaker than in mature component markets. Yimu’s
              best moat candidate is a system-level one: tactile hardware plus data assets plus embodied-model
              interfaces plus customer-specific integrations. If that stack works in production, switching costs could
              rise meaningfully. But specialists can still attack from below with cheaper or easier-to-integrate
              modules, while larger robotics platforms may decide to internalize touch sensing if it becomes strategic
              enough. Third-party reviews also warn that evaluation protocols remain inconsistent across tactile-hand
              systems, making it hard for any vendor to prove universal superiority. As a result, Yimu’s moat is
              promising but not yet settled; its near-term competitive risk comes from faster integrators, lower-cost
              Chinese peers, and customers who decide that simpler force sensing is good enough for first-generation
              deployments.
