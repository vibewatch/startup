      - number: '8.4'
        title: The next decision depends more on diligence than on more storytelling
        blocks:
          - type: paragraph
            body: >-
              The most important diligence asks are straightforward. Investors need segmented revenue, gross margin,
              backlog and cancellation data, top-customer concentration, cap-table and liquidation terms, and direct
              evidence that robot-OEM demand is becoming repeatable rather than promotional. Those items matter more
              than another broad market deck because they determine whether the current valuation represents a
              defensible entry into a future platform business or merely an expensive option on a still-forming
              category.


              Exit readiness is also conditional. China’s robotics IPO cohort shows that public markets will now give
              strong companies a route to rerating, but it also shows that markets will compare delivery quality,
              profitability, and funding efficiency more harshly than private rounds did. For Yimu, the most supportable
              near-term path is a better-informed private round or domestic capital-markets progression once books-open
              diligence exists. The recommendation improves if Yimu discloses revenue quality, converts more named robot
              customers, and offers downside structure. It breaks if the next round is flat-to-down, if appliance bridge
              revenue proves non-repeatable, if robot pilots stall, or if policy friction materially reduces the
              addressable foreign market.
            claimRefs:
