      - number: '1.2'
        title: Founder origins, team, and footprint
        blocks:
          - type: paragraph
            body: >-
              Open sources depict Yimu as founder-led and research-heavy. Multiple interview-based and financing stories
              identify founder and CEO Li Zhiqiang as a Carnegie Mellon-trained researcher with prior work in
              microfluidic biosensing, spectroscopy, and AI modeling. The official About page does not name Li directly,
              but does say the team combines talent from Carnegie Mellon, Harvard, and Tsinghua; the ecosystem page adds
              that Yimu operates a multi-city footprint spanning Nanjing, Shenzhen, Suzhou, and a Tsinghua
              tactile-sensing lab in Beijing. The 2025-2026 interview record also suggests a more complicated
              company-origin story than the one-line Shenzhen description seen in databases: 2025 long-form coverage
              says the company started in Silicon Valley in 2015 and shifted core R&D to China in 2016, while 2026
              financing coverage routinely describes Yimu as a Shenzhen company founded in 2016. The most defensible
              synthesis is that Yimu’s origin story starts in Silicon Valley around 2015, its China operating build-out
              accelerated in 2016, and by 2026 Shenzhen is the headline headquarters used in financing coverage while
              Nanjing remains an important engineering node.
