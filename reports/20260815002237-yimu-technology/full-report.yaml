chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and strategic positioning
        blocks:
          - type: paragraph
            body: >-
              Yimu now presents itself publicly as a physical-AI platform built around tactile sensing, world models,
              and embodied execution rather than as a single-component sensor vendor. The official English-language site
              frames the company mission as building AI foundations for the physical world, while the About page says
              Yimu is building the foundational stack for general-purpose physical AI from tactile sensing through world
              models and embodied execution. Across the homepage, sensing page, models page, and ecosystem page, the
              same architecture appears repeatedly: Sentra for physical sensing, a world-action-model layer for
              tactile-augmented reasoning, and Dextra-style execution systems for dexterous manipulation. That framing
              matters because it places Yimu in the infrastructure layer of embodied AI, where value can come from
              sensors, data, model-enablement, and integration rather than from selling one branded humanoid robot.
              Independent July 2026 coverage broadly matches this positioning and describes the company as an
              embodied-AI tactile-perception developer using visuotactile sensing and standardized data pipelines to
              bridge sensing, reasoning, and action.
