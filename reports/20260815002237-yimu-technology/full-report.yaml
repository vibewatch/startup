      - number: '8.3'
        title: Bull, base, and bear ranges should be milestone-driven
        blocks:
          - type: paragraph
            body: >-
              Because Yimu does not disclose current revenue, the right valuation method is milestone-driven rather than
              faux-precise point-estimate modeling. The bull case assumes the company converts its tactile lead into
              repeat robot-OEM programs, sustains adjacent appliance and industrial demand, and proves that data or
              model attachment lifts economics above pure component pricing. Under that outcome, a US$1.8B-US$3.2B
              valuation range is plausible by the end of the decade. The base case is more conservative and closer to
              today’s evidence: Yimu keeps scaling, but revenue remains mostly component- and solution-led, customer
              disclosure remains selective, and margin quality is still only partially visible. That supports a
              valuation band roughly around the current mark, with modest upside rather than a step-function rerating.


              The bear case is not that tactile sensing disappears; it is that it commoditizes faster than Yimu can
              build a defensible software-and-data moat. If IPO-era benchmarks harden around profitability, if robot
              OEMs internalize more sensing work, or if standards and export-control friction compress multiples, a
              company with incomplete disclosure can re-rate sharply even while demand exists. Comparable analysis
              reinforces that point. Unitree’s priced IPO sets a much richer disclosed-growth benchmark, while public
              sensor and automation peers span about 9x-20x sales on transparent reporting. Yimu can reasonably argue it
              deserves scarcity value, but the burden of proof is now shifting from TAM rhetoric to auditable
              commercialization quality.
            claimRefs:
              - CV010
