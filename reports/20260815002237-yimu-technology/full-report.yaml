      - number: '5.2'
        title: Data, encoding, and the operating loop from touch to action
        blocks:
          - type: paragraph
            body: >-
              Yimu’s differentiation rests heavily on what happens after sensing. Official and interview material
              repeatedly describe a three-layer stack: tactile data acquisition and dataset construction; a Tactile
              Transformer Encoder that standardizes raw signals from diverse hardware; and multimodal model training
              that fuses touch with vision and language to support embodied decision-making. The company’s public
              rhetoric around world-action models, grounded transition logic, and TouchNet reflects an attempt to treat
              touch as infrastructure rather than as a one-off peripheral. Operationally, the workflow appears to be:
              embed sensors in real manipulation scenes, capture successful and failed interactions, encode the tactile
              signal into a reusable representation, and use it to improve force-adaptive control and task execution.
              This is a persuasive technical architecture on paper, especially for customers who care about data
              flywheels. The missing proof is how much of this stack is already standardized across live customer
              deployments rather than still curated project by project.
