      - number: '3.2'
        title: Peer profiles and positioning by technology route
        blocks:
          - type: paragraph
            body: >-
              The public peer set shows materially different technology routes. XELA markets uSkin as a three-axis
              tactile system paired with uAi software, optimized for robot hands, grippers, and larger contact surfaces
              across fingertips, phalanges, and palms. GelSight emphasizes optical or imaging-style tactile sensing with
              very high surface-resolution claims and strong positioning in precision manufacturing, biomedical use, and
              research. Pressure Profile Systems highlights capacitive tactile sensing, repeatability, temperature
              stability, and broader force/pressure mapping heritage through products like SingleTact and RoboTact.
              Third-party market reports continue to list SynTouch and Tekscan among key tactile vendors, reflecting the
              importance of BioTac-like anthropomorphic touch benchmarks and industrial pressure-sensing incumbency.
              Yimu’s public materials place it closer to a visuotactile-plus-model stack than a pure pressure-array
              vendor. That suggests its strongest relative position is in advanced manipulation programs that need
              tactile data interpreted in a larger embodied-AI workflow, rather than in low-cost commodity pressure
              mapping.
