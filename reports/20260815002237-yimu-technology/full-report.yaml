      - number: '3.3'
        title: Where Yimu appears stronger versus weaker
        blocks:
          - type: paragraph
            body: >-
              Yimu appears strongest where customers need a combination of compact hardware, embodied-data logic, and
              application framing around dexterous manipulation. Multiple 2026 news reports and the company’s own site
              describe a sub-3 mm tactile architecture, more than ten thousand sensing points, and a roadmap that
              connects sensors to TouchNet and world-action-model style tooling. That breadth can create a sticky
              differentiation if customers want not only hardware but also data schemas, simulation or training support,
              and a clearer path from sensing to control. By contrast, specialists like GelSight and PPS may look
              stronger where buyers want one narrowly defined sensing job—such as surface inspection, repeatable
              pressure mapping, or legacy industrial integration—without adopting a broader platform. XELA appears
              especially competitive in hardware-agnostic integrations and palm/finger coverage for robot hands, which
              is close to Yimu’s target zone. The competitive outcome therefore likely depends less on abstract sensor
              specs and more on whether a buyer values deep tactile-system integration or best-of-breed modules.
