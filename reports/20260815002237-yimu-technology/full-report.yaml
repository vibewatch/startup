  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Sensor modules and core architecture
        blocks:
          - type: paragraph
            body: >-
              The official product surface presents Yimu as more than a single tactile part. The sensing page describes
              Sentra T0 for tactile sensing and Sentra E0 for environmental sensing, while 2026 media coverage adds more
              concrete specs for the tactile route: under-3 mm thickness, over ten thousand sensing points, force
              resolution around 0.005N, and industrial life above one million presses. Multiple sources describe the
              route as visuotactile rather than purely resistive or capacitive: microscopic deformation inside a
              flexible structure is captured optically, then decoded into pressure, shear, texture, slip, and related
              contact-state information. That matters because Yimu is trying to solve the “can’t fit, can’t feel, can’t
              generalize” problem at once—small enough to embed in robot fingers, dense enough to capture useful
              physical signals, and structured enough to feed downstream models. Public evidence is strongest for the
              tactile module and weaker for broader subsystem SKUs, BOM composition, and field-service details. Public
              disclosures also remain thin on maintenance tooling and replacement cycles.
