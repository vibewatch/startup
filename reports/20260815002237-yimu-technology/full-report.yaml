  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Yimu deserves a TRACK recommendation rather than a blind buy. The positive case is real. The company is
              not just a concept for humanoid hype: public sources show a tactile-sensing hardware and model stack,
              repeated financing support, a commercialization bridge from water and appliances into robotics, and a July
              2026 Series E that explicitly funds production and order delivery as well as R&D. That is better evidence
              than many frontier-robotics stories can show. Yimu also sits in an attractive strategic position. It is
              selling enabling infrastructure for manipulation and embodied intelligence rather than trying to win the
              entire robot-OEM stack, which can make the customer universe broader if the modules become standard
              components across hands, arms, and visuotactile systems.


              The anti-thesis is that the current mark is easier to describe than to underwrite. Public sources still do
              not disclose revenue, gross margin, backlog, concentration, renewal behavior, or the preference stack.
              Named proof is stronger in appliance and adjacent industrial channels than in fully enumerated robot-OEM
              production programs. The company may be building a valuable infrastructure layer, but investors cannot yet
              tell whether that layer is already producing high-quality revenue or is still being valued mainly on
              strategic narrative. The right read is therefore price-sensitive: Yimu looks real and potentially
              important, but the evidence today supports disciplined tracking and structured diligence, not a conviction
              entry on common-equity terms at the headline unicorn price.
            claimRefs:
              - CV001
