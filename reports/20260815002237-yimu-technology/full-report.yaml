  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, standards, and policy risk
        blocks:
          - type: paragraph
            body: >-
              Yimu operates in a field where the rules are still being written. China’s 2026 humanoid and
              embodied-intelligence standard system introduced six pillars spanning basic commonality, intelligent
              computing, limbs and components, complete systems, application, and safety and ethics. Both the official
              release and comparative analysis sources make clear that tactile sensors, data lifecycle management,
              deployment, and safety now sit inside a formalizing national framework. For Yimu, that cuts both ways.
              Early alignment can become an advantage if its interfaces, test methods, and data processes match emerging
              norms. But it also means product definitions, data governance, and safety requirements can move faster
              than a young company’s documentation or certification practice. Internationally, the framework is still
              unsettled: humanoid-specific ISO coverage is incomplete, and broader safety standards still come from
              industrial or collaborative-robot traditions that do not map perfectly to mobile, human-facing physical-AI
              systems. Compliance risk is therefore both domestic and cross-border.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
