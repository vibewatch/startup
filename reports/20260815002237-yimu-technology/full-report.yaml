      - number: '2.2'
        title: Sizing lenses and upper bounds
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for touch-related robot infrastructure is highly sensitive to scope. The narrowest
              defensible lens is the global humanoid tactile-sensor market, which the Global Info Research summary on
              MarketResearch.com places at US$130 million in 2025 and US$412 million by 2032, a 17.4% CAGR. That same
              summary reports about 428,000 units sold in 2025 at an average price of roughly US$295 per unit and a
              gross-margin benchmark near 45%. A much more aggressive lens comes from Chinese industry white-paper style
              coverage, which says the 2026 global humanoid tactile-sensor market could exceed US$1.2 billion and the
              China market alone could exceed US$320 million. Those estimates likely include a broader mix of sensor
              classes, installation positions, and commercialization assumptions than the narrower GIR market note.
              Adjacent dexterous-hand estimates are larger again: TechBuzzChina cites GIR research showing global
              multi-finger hand revenue at roughly US$123 million in 2024 with a path toward US$5.849 billion by 2031,
              while Ofweek and Chyxx describe China’s dexterous-hand market as being in a 2025-2026 volume and
              commercialization surge. For Yimu, the practical reading is that the direct tactile-sensor SAM is still
              measured in hundreds of millions of dollars globally today, but the adjacent platform spend it can
              influence is materially larger.
