      - number: '3.4'
        title: Pricing, packaging, and commercialization posture
        blocks:
          - type: paragraph
            body: >-
              Direct apples-to-apples pricing is mostly opaque, but packaging differences are visible. Market studies
              suggest the average 2025 humanoid tactile sensor sold globally for around US$295 per unit, while broader
              dexterous-hand system prices span from sub-US$1,000 low-end Chinese hands to far higher imported
              benchmarks. XELA’s public material stresses cost-effective integration into existing hands and grippers,
              suggesting a modular commercialization posture. GelSight frames its offer around premium precision and
              structured data for demanding industrial or research use cases, which implies a high-value rather than
              low-cost sales motion. PPS positions around engineering collaboration and repeatable pressure data,
              fitting an industrial instrumentation purchase model more than a flashy embodied-AI narrative. Yimu’s
              commercialization stance seems hybrid: it sells specialized tactile hardware, but it also markets data,
              models, and full-stack solutions at events such as WAIC. That can expand account value, yet it may
              lengthen sales cycles if customers need to buy into a broader architecture before ordering volume.
