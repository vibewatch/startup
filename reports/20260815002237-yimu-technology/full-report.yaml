            title: The tactile-sensor SAM is smaller than the humanoid narrative, but strategically central
            body: >-
              Yimu does not need the full humanoid market to be enormous in order to matter. If touch remains a
              bottleneck for reliable manipulation, a supplier that can solve sensing, data, and integration can capture
              disproportionate value inside a smaller but more indispensable layer.
            calloutType: insight
            claimRefs:
