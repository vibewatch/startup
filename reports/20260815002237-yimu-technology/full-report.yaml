  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and scope definition
        blocks:
          - type: paragraph
            body: >-
              Yimu does not compete in the full global robotics market; it competes in the narrower but strategic layer
              where robots gain touch, contact-state awareness, and tactile data for control. The official ecosystem and
              product pages show the company selling into hardware vendors, model developers, skill builders, and
              academic researchers rather than directly selling a finished humanoid platform. That means the most
              relevant market boundary starts with humanoid and dexterous-hand tactile sensors, then expands outward to
              dexterous-hand modules, end-effector sensing, and embodied-AI data infrastructure. It should explicitly
              exclude unrelated categories such as general industrial sensors, traditional machine vision, or full
              humanoid robot revenue when those dollars do not accrue to tactile-sensing suppliers. MarketResearch.com’s
              2026 GIR summary defines humanoid tactile sensors as devices simulating human skin through piezoresistive,
              capacitive, piezoelectric, photoelectric, and Hall-effect approaches, and ties downstream demand to
              dexterous hands, humanoid robots, industrial end-effectors, surgical robots, and teleoperation systems.
              That definition is close to Yimu’s direct product lane. Broader dexterous-hand market studies are still
              useful, but they should be treated as adjacent TAM rather than Yimu’s immediate revenue pool.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
