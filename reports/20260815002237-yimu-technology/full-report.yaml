          - type: callout
            title: Market estimates are only directionally useful because scope varies wildly
            body: >-
              The spread between narrow GIR-style sensor estimates and broad Chinese white-paper or dexterous-hand
              estimates shows how easy it is to overstate TAM. Investors should underwrite Yimu against the narrower
              direct-sensor market first, then treat broader hand-system figures as upside scenarios.
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
          - type: callout
            title: Yimu has a bridge market outside pure humanoids
            body: >-
              Because Yimu already emerged from smart-home and multisignal sensing applications, it is not as exposed to
              a single humanoid deployment timetable as a pure humanoid startup or a one-customer hand maker.
