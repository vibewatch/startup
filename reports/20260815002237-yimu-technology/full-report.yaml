              vehicles linked to TCL and chip ecosystems, and other industrial-capital names. Taken together, those
              disclosures imply Yimu has moved from early technology incubation into growth-stage scale-up with both
              financial and strategic investors, especially from appliance, chip, and industrial ecosystems. What
              remains opaque is the detailed cap table, liquidation structure, and exact total capital raised across all
