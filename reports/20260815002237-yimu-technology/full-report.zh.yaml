      - number: '3.2'
        title: 可比公司画像与技术路线定位
        blocks:
          - type: paragraph
            body: >-
              公开可比公司展示出明显不同的技术路线。XELA 将 uSkin 定位为三轴触觉系统，并搭配 uAi 软件，优化对象是机器人手、夹爪，以及覆盖指尖、指节和手掌的更大接触表面。GelSight
              强调光学或成像式触觉感知，主打极高表面分辨率，并在精密制造、生物医学用途和研究场景中定位强。Pressure Profile Systems 突出电容式触觉感知、可重复性、温度稳定性，以及通过
              SingleTact、RoboTact 等产品积累的更宽力 / 压力映射传统。第三方市场报告仍把 SynTouch 和 Tekscan 列为关键触觉厂商，反映 BioTac
              式仿人触觉基准和工业压力感知存量厂商的重要性。Yimu 的公开材料则更接近“视触觉 + 模型”产品栈，而不是纯压力阵列厂商。这意味着，它相对最强的位置，可能在需要把触觉数据放进更大具身 AI
              工作流的高级操作项目中，而不是低成本商品化压力映射。
