  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与对抗结构
        blocks:
          - type: paragraph
            body: >-
              理解 Yimu 的竞争场，最好把它看成分层市场。最窄一层是专门的触觉传感器厂商，向机器人手和夹爪销售指尖、皮肤、压力阵列或相关力感知组件。XELA Robotics、GelSight、Pressure
              Profile Systems、SynTouch 和 Tekscan 都出现在第三方市场名单或公开产品材料中，是触觉感知的基准玩家。第二层包括 PaXini
              等中国具身智能供应商，以及市场研究中列出的其他深圳或上海触觉新进入者。第三层是替代技术：高端力 / 扭矩传感器、更好的机器视觉，以及有时能降低稠密触觉硬件需求的末端执行器软件。这很重要，因为 Yimu
              不是在和某个标准产品打一场简单的功能对功能之战。它同时竞争传感器性能、集成难度、生态适配、数据就绪度，以及客户到底想要组件专家还是更完整的物理 AI 伙伴。
            claimRefs:
              - CP001
