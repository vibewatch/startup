  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 重要性
      - 反向逻辑 / 削弱因素
      - 哪些证据会改变判断
    rows:
      - - 专用触觉基础设施切口
        - 不必做整机，也能切入多种机器人和工业形态
        - 若 OEM 多源采购或自研感知，专用部件仍会商品化
        - 证明多个 OEM 产品族的重复定点和稳定定价权
      - - 跨垂直场景商业化桥梁
        - 家电和工业项目降低了 2026 年融资投向零收入概念的概率
        - 桥接业务可能毛利低，也不一定代表机器人上行空间
        - 披露分部收入、毛利率和客户集中度
      - - 数据与模型附着上行空间
        - 若触觉数据、编码器和模型能附着到硬件，经营经济性会明显改善
        - 若 Yimu 不能把开放生态和伙伴投入转成自有工作流，护城河会被削弱
        - 拿出附着率、软件收入占比和留存
      - - 中国机器人顺风
        - 具身智能资本和标准支持可加速国内采用
        - 热潮期资本也会抬高估值；没有可审计牵引力的公司，融资窗口会变窄
        - 证明 Yimu 在交付和收入质量上越过新的证据门槛
      - - 估值低于最热人形机器人公司
        - Yimu 远低于 Figure 这类叙事极值，也低于 Unitree 2026 年 IPO 估值锚
        - 低于最热标的不等于便宜
        - 用披露的经营经济性证明 Yimu 配得上专用型溢价倍数
    notes: 只有最后一列开始填入披露的经营证据，而不是叙事支撑，投资逻辑才会上调。
