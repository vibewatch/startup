      - number: '2.4'
        title: 推动采用加速的增长因素
        blocks:
          - type: paragraph
            body: >-
              几股力量正在明确拉动触觉感知需求。第一，人形机器人和灵巧手产量上升足够快，触觉不再只是实验室话题。Chyxx 称，中国 2025 年售出 19,200 只灵巧手，同比增长 236.84%；Gongboshi 和
              Ofweek 也都把 2025–2026 年描述为从原型走向规模交付的过渡期。第二，成本下降正在拓宽用例边界。TechBuzzChina 指出，灵巧手现在约占人形机器人总成本的
              15-20%，中国厂商正在把部分手部价格从远高的进口基准压到 US$1,000
              以下。第三，应用地图正从人形机器人向外扩展：工业精密装配、物流搬运、医疗和康复机器人、服务机器人，甚至家电化家庭系统，都需要更好的力、滑移或纹理理解。最后，Yimu
              自身策略受益于市场对数据和集成层的需求，而不只是硬件需求。其 TouchNet 和世界—动作模型叙事，契合了市场越来越关注的问题：触觉只有在能被标准化、解释并转化为控制策略时才真正有用。
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
