      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              触觉感知的买方地图不同于成品机器人的买方地图。在组件层，Yimu 最自然的客户是机器人 OEM
              工程团队、灵巧手制造商、工业集成商，以及需要感知硬件叠加数据和模型支持的研究机构。官方生态页把交易对手分成硬件厂商、模型开发者、技能构建者和学术研究者，也强化了这一点。从下游应用看，MarketResearch.com
              和中国白皮书来源把灵巧手、人形机器人、工业夹爪、医疗或康复机器人、仓储机器人和服务机器人列为相关终端场景。周期早期，预算通常在研发、先进制造或平台采购团队手里；只有在感知产品栈通过稳定部署验证后，预算才会转向项目管理或运营。Yimu
              还在纯机器人之外有一个桥梁客群：2025 年报道显示，其多模态 AI 系统已经进入智能家居和家电供应链，让公司能触达那些在承诺完整人形机器人项目之前，先试验机器人化家用设备的客户。
