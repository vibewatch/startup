      - number: '7.3'
        title: 依赖、供应链与商业化风险
        blocks:
          - type: paragraph
            body: >-
              Yimu 的技术栈不只依赖一种稀缺投入。公司自己的叙事横跨材料、光学、芯片、算法、模型和产线交付。2025-2026 年 BIS 指引显示，美国围绕与中国和 D:5
              实体相关的先进计算物项仍在政策摇摆；电子标准更新也说明，工业电子在组件级安全、EMC、热管理和环境认证上的门槛还在抬高。即便 Yimu 能把大部分栈本地化，只要专用芯片、连接器可靠性、EMC
              表现或工业封装难以验证，就仍有供应和验证风险。商业化风险会进一步叠加。公开客户证据仍集中且部分未具名；机器人 OEM
              转化、订单质量和跨垂直复用还没有完全跑通。因此，上游依赖冲击和下游需求转化慢于融资叙事，都可能伤到公司。
