  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 2029 年收入代理
      - 估值区间
      - 按当前入场价的含义
      - 概率信号
    rows:
      - - 乐观
        - 机器人 OEM 项目放量，家电桥接业务保持健康，软件 / 数据附着把质量拉到纯硬件之上
        - US$220M-US$320M
        - US$1.8B-US$3.2B
        - 上行有吸引力，但前提是经营经济性披露和重复订单显著改善
        - 需要具名 OEM 转化、附着率证明和更清晰毛利率
      - - 基准
        - Yimu 继续增长，但主要仍是部件和解决方案供应商；披露有选择性，客户集中度表现混合
        - US$120M-US$180M
        - US$0.9B-US$1.8B
        - 相比当前估值，仅有温和上行，甚至大致持平
        - 最符合当前公开证据
      - - 悲观
        - 触觉模块商品化，机器人试点转化慢，公开市场更严的基准压缩私募倍数
        - US$60M-US$100M
        - US$0.3B-US$0.7B
        - 从当前价格进入会亏损本金
        - 由持平或下行融资、重复需求疲弱或政策冲击触发
    notes: 这些是分析师情景区间，不是公司原生预测。区间按里程碑驱动，因为 Yimu 没有披露当前收入基线。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV037
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 当前可支撑估值或状态
      - 获取证据可支撑的内容
      - 为什么可比
      - 主要限制
    rows:
      - - Yimu Technology
        - '>RMB10B / 大约 US$1.4B-US$1.5B 私募估值'
        - 多篇 2026 年 7 月报道支持 Series E 轮和独角兽估值；翻译来源将其换算成 USD 口径
        - 本章主要估值锚
        - 无公开收入、毛利率或优先股堆叠披露
      - - Unitree
        - 基于 RMB1.7B 2025 年收入，隐含 RMB42B-RMB61B 的 2026 年 IPO 区间
        - CNBC 和 RobotToday 将估值与财务规模放进同一公开框架
        - 衡量已披露规模与投资人胃口的最佳中国具身 AI 基准
        - 机器人 OEM 与传感器基础设施不是同一商业模式
      - - Keyence
        - US$6.83B TTM 收入对应 US$133.4B 市值（约 19.5x 销售额）
        - 公开市值和收入页面给出自动化龙头的披露倍数
        - 高端自动化经济性的公开上沿基准
        - 规模大、成熟、更多元，运营也更强
      - - Cognex
        - US$1.04B TTM 收入对应 US$11.0B 市值（约 10.6x 销售额）
        - 公开市值和收入页面给出机器视觉披露倍数
        - 更接近工业感知的传感器与检测参照
        - 视觉不是触觉，经济性质量也透明得多
      - - Ambarella
        - US$0.40B TTM 收入对应 US$3.59B 市值（约 9.0x 销售额）
        - 公开市值和收入页面给出边缘 AI / 感知披露倍数
        - 有用的低端感知芯片参照
        - 无晶圆厂半导体经济性不同于集成式触觉系统
      - - 中国机器人 IPO 队列（Unitree / DEEP / Leju）
        - 基准正围绕可审计交付、盈利能力和商业模式质量变硬
        - ChinaBizInsider 显示，拟 IPO 标的正把估值方法从纯 TAM 叙事拉回现实
        - 看私募市场估值膨胀风险的重要反向镜头
        - 队列框架只提供方向，不是直接可比估值倍数
    notes: 这个组合刻意混合了私募轮次、IPO 基准和公开可比公司，因为没有任何单一同业能完全匹配一家触觉基础设施公司。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the six most decision-relevant references visible in the fetched evidence: Yimu itself, the best Chinese
        disclosed robotics benchmark, three public perception/automation analogs, and the broader China IPO cohort that
        shapes multiple compression risk.
