      - number: '2.5'
        title: 约束条件与 Yimu 的市场含义
        blocks:
          - type: paragraph
            body: >-
              支撑乐观增长故事的同一批来源，也说明这个市场仍然难做。TechBuzzChina 总结了灵巧手的三类反复瓶颈：极高成本、可靠性不足和控制复杂度。2026 年 arXiv 综述和 Springer
              综述还补充，触觉手研究仍受评估协议不一致、长周期可靠性数据有限、校准漂移、安全认证缺口，以及从仿真到真实部署泛化弱等问题困扰。中国白皮书来源还指出，标准仍不完整，高端 ASIC
              国产化仍有限，许多产品还不能把感知数据和实时控制闭环打通。这些都影响 Yimu 的市场节奏。积极一面是，如果 OEM
              不想自建触觉产品栈，专业供应商就有机会赢。消极一面是，如果机器人厂商推迟量产、改用低规格传感器，或无法证明 ROI，Yimu 就会暴露在部署慢于预期的风险里。因此，本章判断是：Yimu
              的市场真实且具战略重要性，但仍处早期；采纳节奏、可靠性和标准化会比标题式 TAM 叙事更能决定价值。
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: 证据要点
        blocks:
          - type: callout
            title: 触觉传感器 SAM 小于人形机器人叙事，但战略位置居中
            body: Yimu 不需要整个人形机器人市场巨大，自己才重要。只要触觉仍是可靠操作的瓶颈，能解决感知、数据和集成的供应商，就能在更小但更不可或缺的一层里拿到超额价值。
            calloutType: insight
            claimRefs:
