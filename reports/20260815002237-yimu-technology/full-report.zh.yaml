        title: 监管、标准与政策风险
        blocks:
          - type: paragraph
            body: >-
              Yimu 所在赛道的规则仍在成形。中国 2026
              年人形机器人与具身智能标准体系提出六大支柱，覆盖基础共性、智能计算、肢体与部组件、整机系统、应用、安全与伦理。官方发布和对比分析都说得很清楚：触觉传感器、数据生命周期管理、部署和安全，已经被纳入正在制度化的国家框架。放到
              Yimu
              身上，标准化进程是一把双刃剑。接口、测试方法和数据流程如果及早贴合新规范，合规可变成优势；但产品定义、数据治理和安全要求也可能跑得比一家年轻公司的文档和认证实践更快。国际上，框架同样未定：面向人形机器人的 ISO
              覆盖还不完整，更宽泛的安全标准仍沿用工业机器人或协作机器人传统，无法完全映射到移动、面向人的物理 AI 系统。因此，合规风险既在国内，也在跨境。
