      - number: '8.4'
        title: 下一次决策更取决于尽调，而不是更多故事
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调问题很直接。投资人需要分部收入、毛利率、积压订单和取消数据、头部客户集中度、股权结构表和清算条款，以及机器人 OEM 需求正在变得可重复而非宣传性的直接证据。上述材料比又一份大市场叙事 PPT
              更重要，因为它们决定当前估值代表的是进入未来平台型业务的可防守入口，还是押注仍在成形品类的一张昂贵期权。


              退出准备也有条件。中国机器人 IPO 队列显示，公开市场现在会给强公司一条重估路径；但也显示，市场会比私募轮更严厉地比较交付质量、盈利能力和融资效率。对 Yimu
              而言，近期更可支撑的路径，是在账本开放式尽调之后完成信息更充分的私募轮，或推进国内资本市场路径。如果 Yimu
              披露收入质量、转化更多具名机器人客户并提供下行结构，建议会改善。若下一轮持平到下行，家电桥梁收入被证明不可重复，机器人试点停滞，或政策摩擦实质性压缩可服务的海外市场，投资逻辑就会破裂。
