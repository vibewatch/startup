  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围定义
        blocks:
          - type: paragraph
            body: >-
              Yimu
              不参与整个全球机器人市场竞争；它竞争的是更窄但战略性更强的一层：机器人在这里获得触觉、接触状态感知，以及用于控制的触觉数据。官方生态和产品页面显示，公司面向硬件厂商、模型开发者、技能构建者和学术研究者销售，而不是直接销售成品人形机器人平台。因此，最相关的市场边界应从人形机器人和灵巧手触觉传感器开始，再向外扩展到灵巧手模块、末端执行器感知和具身
              AI 数据基础设施。与触觉感知供应商收入无关的一般工业传感器、传统机器视觉或整机人形机器人收入，应明确排除。MarketResearch.com 的 2026 年 GIR
              摘要把人形机器人触觉传感器定义为通过压阻、电容、压电、光电和霍尔效应方案模拟人类皮肤的设备，并把下游需求连接到灵巧手、人形机器人、工业末端执行器、手术机器人和遥操作系统。这一定义接近 Yimu
              的直接产品赛道。更宽的灵巧手市场研究仍有用，但应视为相邻 TAM，而不是 Yimu 的即时收入池。
