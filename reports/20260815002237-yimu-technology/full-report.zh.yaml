            title: 智能家居是通向机器人的商业化桥梁
            body: 从公开记录看，最合理的解读是：Yimu 先用水务和智能家居感知打磨芯片、数据管线和客户信任，再转向机器人触觉感知。CES 2025 洗护机器人就是这两个阶段之间可见的转轴。
