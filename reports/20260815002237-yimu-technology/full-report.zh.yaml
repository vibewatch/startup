      - number: '3.3'
        title: Yimu 看起来更强与更弱的位置
        blocks:
          - type: paragraph
            body: >-
              Yimu 看起来最强的场景，是客户同时需要紧凑硬件、具身数据逻辑，以及围绕灵巧操作的应用框架。多篇 2026 年新闻报道和公司官网描述了低于 3 mm 的触觉架构、超过一万个感知点，以及把传感器连接到
              TouchNet
              和世界—动作模型式工具的路线图。如果客户想要的不只是硬件，还包括数据模式、仿真或训练支持，以及从感知走向控制的更清晰路径，这种宽度可以形成粘性差异。反过来，当买方只想完成一个定义很窄的感知任务——例如表面检测、可重复压力映射或传统工业集成——且不愿采纳更宽平台时，GelSight
              和 PPS 等专家可能更强。XELA 在硬件无关集成，以及机器人手掌 / 指尖覆盖上显得尤其有竞争力，距离 Yimu
              的目标区很近。因此，竞争结果可能不太取决于抽象传感器规格，而更取决于买方看重深度触觉系统集成，还是最优单点模块。
