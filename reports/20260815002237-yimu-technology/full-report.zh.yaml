              Panasonic 供应链，在 AI 洗护机器人上为 TENET 和 TCL
              供货；如今在触觉感知上至少面向两类买方：拥有模型团队的大型科技公司和数据服务商。这意味着几层变现：组件或模块销售、集成解决方案、模型或算法挂载，以及潜在触觉数据或平台服务。但公开来源都没有披露这些层级之间的实际收入拆分、合同规模、软件或数据服务挂载率，也没有说明新的具身
              AI 业务是否已经超过传统智能家居和水务业务。结果是，公司收入引擎可见，但收入质量不透明。
