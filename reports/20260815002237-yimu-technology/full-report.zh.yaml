      - number: '2.2'
        title: 规模测算口径与上限
        blocks:
          - type: paragraph
            body: >-
              与触觉相关的机器人基础设施公开市场规模，对范围设定高度敏感。最窄且站得住脚的口径是全球人形机器人触觉传感器市场。MarketResearch.com 上的 Global Info Research
              摘要将其规模列为 2025 年 US$130 million、2032 年 US$412 million，对应 17.4% CAGR。同一摘要称，2025 年销量约 428,000 个，平均单价约
              US$295，毛利率基准接近 45%。更激进的口径来自中国行业白皮书式报道，称 2026 年全球人形机器人触觉传感器市场可能超过 US$1.2 billion，仅中国市场也可能超过 US$320
              million。这些估计很可能纳入了比 GIR 窄口径更宽的传感器类别、安装位置和商业化假设。相邻的灵巧手估计更大：TechBuzzChina 引用 GIR 研究称，全球多指手收入 2024 年约 US$123
              million，到 2031 年可能走向 US$5.849 billion；Ofweek 和 Chyxx 则描述中国灵巧手市场正处在 2025–2026 年的放量和商业化跃迁中。对 Yimu
              而言，务实解读是：今天直接触觉传感器 SAM 在全球仍以数亿美元计，但它能影响的相邻平台支出明显更大。
