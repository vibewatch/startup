      - number: '8.3'
        title: 乐观、基准、悲观区间应由里程碑驱动
        blocks:
          - type: paragraph
            body: >-
              因为 Yimu 不披露当前收入，正确估值方法应由里程碑驱动，而不是做看似精确的点估值模型。乐观情景假设公司把触觉领先转化为可重复的机器人 OEM
              项目，维持相邻家电和工业需求，并证明数据或模型绑定能把经济性抬到纯组件定价之上。在乐观结果下，到十年末，US$1.8B-US$3.2B 的估值区间可以成立。基准情景更保守，也更贴近今天的证据：Yimu
              继续扩张，但收入仍主要由组件和解决方案拉动，客户披露仍有选择性，利润率质量只部分可见。上述证据支撑大致围绕当前估值锚的区间，有温和上行，而不是台阶式重估。


              悲观情景不是触觉感知消失，而是商品化速度快过 Yimu 建立可防守的软件和数据护城河。如果 IPO 阶段基准更强调盈利能力，如果机器人 OEM
              将更多传感工作内化，或如果标准与出口管制摩擦压低倍数，一家披露不完整的公司即便有需求，也可能被大幅重估。可比分析强化了同一判断。Unitree 已定价的 IPO
              设定了更高的披露增长基准；公开传感器和自动化同业在透明报告下约按 9x-20x 销售额交易。Yimu 可以合理主张稀缺价值，但证明责任正在从 TAM 话术转向可审计的商业化质量。
