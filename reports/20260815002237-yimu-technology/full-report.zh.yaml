      - number: '1.4'
        title: 技术路径与里程碑
        blocks:
          - type: paragraph
            body: >-
              Yimu 近年的叙事并不只是“传感器公司融了钱”。证据显示，公司有意从水务和智能家居系统里的多模态感知，推进到具身 AI 触觉基础设施。2025 年 1 月报道称，Yimu
              早期业务基础包括智慧水务、智能家居和生命科学感知产品；在机器人触觉叙事成为中心之前，公司已经进入 TCL、Whirlpool 和 Panasonic 供应链。CES 2025 随后给了公司一个可见的桥梁产品：与
              TCL 生态伙伴 TENET 共同开发的 AI 洗护机器人 / 洗护系统，具备多模态衣物识别和灵巧处理能力。到 2026 年 7 月，公司故事进一步转向机器人触觉。多家来源提到低于 3 mm 的视触觉传感器、超过
              10,000 个感知点、毫克级力精度、0.005N 力分辨率，以及触觉数据采集、触觉编码、多模态世界模型训练三层架构。公司还在用开放数据集概念拓宽护城河：多篇 2026 年 7 月报道称，Yimu 正与
              Stanford 相关研究者合作 TouchNet，并计划在 2026 年底前开放更多真实触觉数据。
