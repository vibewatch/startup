              - CM023
              - CM031
          - type: callout
            title: 市场规模估计只能看方向，因为口径差异很大
            body: 窄口径 GIR 式传感器估计，与宽口径中国白皮书或灵巧手估计之间的差距，说明 TAM 很容易被高估。投资人应先按更窄的直接传感器市场核验 Yimu，再把更宽的手部系统数字当作上行情景。
            calloutType: risk
            claimRefs:
