      - number: '3.5'
        title: 护城河耐久性与竞争风险清单
        blocks:
          - type: paragraph
            body: >-
              今天还没有玩家拥有完整护城河。整个行业仍面对可靠性、标准和集成问题，客户锁定效应弱于成熟组件市场。Yimu 最有希望的护城河是系统级的：触觉硬件 + 数据资产 + 具身模型接口 +
              客户特定集成。如果这套产品栈能在生产中跑通，切换成本可能显著上升。但专家厂商仍可以用更便宜或更易集成的模块从下方进攻；更大的机器人平台也可能在触觉足够战略化后选择内化。第三方综述还警告，触觉手系统之间评估协议仍不一致，任何厂商都很难证明普适性优势。因此，Yimu
              的护城河有前景，但尚未定局；近期竞争风险来自速度更快的集成商、成本更低的中国同行，以及认为第一代部署用更简单力感知就够了的客户。
