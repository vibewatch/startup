      - number: '1.3'
        title: 资本基础与投资人信号
        blocks:
          - type: paragraph
            body: >-
              公开融资轨迹是支撑 Yimu 当前市场位置的最清晰证据之一。TechNode、China Securities Journal、Economic Information Daily、Tencent
              News、TMTPost 等 2026 年 7 月报道一致称，公司完成了超过 RMB 1 billion 的 E 轮融资，估值超过 RMB 10
              billion。同批报道还称，新资金将投向触觉感知材料、芯片、算法和模型，以及产线订单的大规模生产与交付。2025 年 1 月的早期融资报道显示，公司 D 轮融资达数亿元人民币，由 SAIF 领投，Nanjing
              Innovation Investment Group 和 Songlin Technology 跟投；报道还称，更早投资方包括 Shunwei、与 TCL
              和芯片生态相关的投资载体，以及其他产业资本。合在一起看，这些披露意味着 Yimu
              已从早期技术孵化走向成长期扩张，背后既有财务投资人，也有战略投资人，尤其来自家电、芯片和工业生态。仍不透明的是详细股权结构表、清算结构，以及所有轮次累计融资的准确金额。
