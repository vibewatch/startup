      - number: '1.2'
        title: 创始人起点、团队与版图
        blocks:
          - type: paragraph
            body: >-
              公开来源描绘的 Yimu 是创始人主导、研发权重高的公司。多篇访谈和融资报道都把创始人兼 CEO Li Zhiqiang 描述为受训于 Carnegie Mellon 的研究者，此前做过微流控生物传感、光谱学和
              AI 建模。官方 About 页面没有直接点名 Li，但称团队汇集 Carnegie Mellon、Harvard、Tsinghua 人才；生态页还补充，Yimu 在南京、深圳、苏州，以及北京 Tsinghua
              触觉感知实验室形成多城市版图。2025–2026 年访谈记录也显示，公司起源比数据库里一句“深圳公司”更复杂：2025 年长篇报道称公司 2015 年起步于 Silicon Valley，2016
              年把核心研发转向中国；而 2026 年融资报道通常称 Yimu 是一家 2016 年成立的深圳公司。最稳妥的综合判断是：Yimu 的起源叙事约从 2015 年 Silicon Valley 开始，中国运营建设在
              2016 年加速；到 2026 年，深圳成为融资报道里的主要总部口径，南京仍是重要工程节点。
