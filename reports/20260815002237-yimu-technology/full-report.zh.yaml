        title: 证据要点
        blocks:
          - type: callout
            title: 公司故事不止一个传感器 SKU
            body: Yimu 最强的战略信号，是它试图占住感知、触觉数据与模型使能之间的产品栈，而不是只卖一个孤立组件。如果生态真的围绕它的数据标准和集成层形成，这一位置可以支撑更好利润率和更深锁定效应。
            calloutType: strength
            claimRefs:
