              年管理层访谈进一步收窄活跃客户基础：一类是拥有模型团队的大型科技公司，另一类是数据服务商。更早商业化报道补充了家电和智能家居 OEM；较新的触觉感知报道则指向机器人 OEM 和集成商，它们把 Yimu
              模块嵌入灵巧手和运营产品栈。这些分层重要，因为预算不太可能集中在一个部门。家电买方可能通过产品、工程或生态渠道采购；触觉数据客户可能通过模型或数据团队采购；机器人 OEM
