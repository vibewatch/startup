  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 传感模块与核心架构
        blocks:
          - type: paragraph
            body: >-
              官方产品呈现出的 Yimu，不只是一个单一触觉部件。感知页面描述了用于触觉感知的 Sentra T0 和用于环境感知的 Sentra E0；2026 年媒体报道则为触觉路线补充了更具体规格：厚度低于 3
              mm、超过一万个感知点、力分辨率约
              0.005N、工业寿命超过一百万次按压。多方来源把这条路线描述为视触觉，而不是纯电阻或电容：柔性结构内部的微观形变由光学方式采集，再解码成压力、剪切力、纹理、滑移和相关接触状态信息。关键在于，Yimu
              试图一次性解决“装不进、摸不准、泛化不了”的问题——足够小，可以嵌进机器人手指；足够密，可以捕捉有用物理信号；结构化程度也足够高，可以喂给下游模型。公开证据对触觉模块最强，对更宽子系统 SKU、BOM
              构成和现场服务细节较弱。维护工具和更换周期的公开披露也仍然很薄。
