    layout: standard
    summary: 这条选择性时间线展示了若干里程碑，解释 Yimu 如何从多模态感知应用转向具身 AI 触觉基础设施。
    data:
      items:
        - label: 起点故事
          date: '2015-01-01'
          detail: 基于访谈的报道显示，公司创立源头在硅谷，由 Li Zhiqiang 牵头。
          tone: positive
        - label: 中国布局
          date: '2016-01-01'
          detail: 公司将核心运营建设转向中国，后来被描述为 2016 年成立。
          tone: neutral
        - label: 智能家居桥梁
