      - number: '8.2'
        title: 融资背景，以及为什么价格纪律仍重要
        blocks:
          - type: paragraph
            body: >-
              无论按中国工业硬件的哪个标准看，当前估值锚都不低。多家 2026 年 7 月报道都指向超过 RMB1B 的 Series E 轮、估值高于 RMB10B；二手英文报道和数据库式来源则把估值换算为约
              US$1.4B-US$1.5B。在具身智能融资充裕、优质触觉感知仍具战略稀缺性的市场里，该估值并不明显荒谬。Yimu
              也有支撑溢价叙事的优势：管理层一贯把公司定位为跨垂直的传感与数据平台，而不是单一演示产品；更早在家庭和家电场景商业化，也降低了 2026 年融资只是资助零收入科研项目的概率。


              但价格纪律仍重要，因为下一层证据缺失。中国最强的公开基准现在是 Unitree，其 2026 年 IPO 材料把估值和财务产出放在同一个框架里。Yimu
              还没有提供这种披露水平。Keyence、Cognex、Ambarella 等上市可比公司也提醒投资人，估值倍数最终支付给披露出来的经济性，而不只是技术重要性。如果 Yimu
              能把触觉模块转化为粘性软件、数据和系统绑定，它也许应享有专业化溢价。在这种转化进入披露数字之前，投资人应把当前估值视为合理到偏高，而不是明显便宜。
