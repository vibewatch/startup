      - number: '1.5'
        title: 商业证明与公开披露缺口
        blocks:
          - type: paragraph
            body: >-
              商业层面，Yimu 比许多具身智能初创公司更扎实，因为公司似乎已有机器人之前的业务线和真实工业客户。开源报道反复称，其感知产品栈已经进入头部家电供应链，CES 2025
              洗护机器人也在走向量产。但在投资核验最关键的位置，公司概况层面的公开记录仍披露不足。已审阅来源没有给出当前收入、毛利率、现金余额、客户集中度、机器人收入占比，也没有给出能完全对齐的逐轮累计融资数字。第三方文章也因取数时间不同，对历史专利数量说法不一：2025
              年 1 月报道引用约 200 多项专利和 61 项软件著作权；2026 年 7 月报道则称全球知识产权资产超过 700 项，或专利 400 多项、软件著作权 80 项。这些数字可以共同构成一条增长轨迹，但也说明
              Yimu 的公开记录仍有大量宣传性、时点性材料，还没达到投资级披露。后续章节的核心结论因此需要平衡：Yimu 有可信技术、投资人需求和客户牵引信号，但公开证据在技术前景上远强于经营经济性。
