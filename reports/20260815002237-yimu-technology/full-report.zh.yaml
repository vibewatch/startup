      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV035
  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - 下行轮或持平融资
        - 下一轮机构融资在当前估值或以下定价，且没有经营经济性证据抵消
        - 说明私募市场已在下调叙事价值
        - 按悲观情景区间重新承做
      - - 机器人 OEM 试点未能转化
        - 到下一融资周期仍没有可信的机器人客户重复订单证据
        - 会削弱核心机器人上行叙事
        - 不以当前或更高价格加仓
      - - 毛利率被证明结构性偏薄
        - 尽调显示硬件或服务负担吃掉大部分价值创造
        - 即使收入增长，也会压住倍数
        - 将规模视为低质量增长，而非护城河
      - - 政策或出口摩擦显著上升
        - 跨境限制或采购排除压缩可触达的海外需求
        - 会压缩战略可选性和投资人愿付倍数
        - 切到更保守估值区间
      - - 家电桥接收入不可重复
        - 具名相邻项目无法转化成稳定队列或毛利
        - 会拿掉从存量商业化通往机器人规模化的最强桥梁
        - 降低对基准情景的确信度
    notes: 每个否决触发器都击中 Yimu 的需求质量、可实现倍数或通向干净未来融资事件的路径。
    claimRefs:
      - CV030
      - CV032
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 按分部拆分收入
        - 没有公开拆分家电、水务、生命科学、触觉硬件和软件 / 数据服务
        - 决定当前估值是否由最高质量收入流支撑
        - 索取管理账和分部桥接表
      - - 毛利率与服务负担
        - 没有公开产品族毛利率、部署成本或质保准备数据
        - 区分高端基础设施与昂贵定制硬件
        - 按产品线索取贡献毛利分析
      - - 在手订单、转化与取消
        - 没有公开订单簿或试点转化披露
        - 检验订单交付叙事是否对应可持续需求
        - 索取管线账龄、取消和重复订单历史
      - - 客户集中度
        - 没有公开头部客户名单或收入集中度披露
        - 少数客户可能扭曲增长和议价能力
        - 索取前 10 大客户和队列分析
      - - 股权结构表与优先股堆叠
        - 没有公开清算、参与分配、反稀释或员工期权池细节
        - 股权回报可能与企业价值逻辑大幅背离
        - 获取当前及过往优先股条款法律摘要
      - - 机器人 OEM 商业化证明
        - 尽管叙事高度贴合，公开具名机器人量产胜利很少
        - 这是最能显著改善建议的事项
        - 索取具名案例、出货量和附着率证据
    notes: 前四项最重要，因为它们直接决定当前估值是可投资，还是仅仅可以理解。
    claimRefs:
      - CV004
      - CV028
      - CV029
      - CV032
      - CV038
      - CV039
      - CV041
