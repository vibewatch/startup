  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议、正向逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Yimu 更适合给“观察”，而不是盲目买入。正向逻辑真实存在。公司不只是人形机器人热潮里的概念股：公开资料显示，它已经有触觉感知硬件和模型栈、多轮融资支持、从水务和家电走向机器人场景的商业化桥梁，以及 2026
              年 7 月明确投入量产、订单交付和研发的 Series E 轮。上述证据比许多前沿机器人故事拿得出的证据更强。Yimu 的战略位置也有吸引力。它卖的是支撑操作和具身智能的基础设施，而不是试图吃下整个机器人 OEM
              栈；如果模块成为手、臂和视触觉系统的标准组件，客户范围会更宽。


              反向逻辑在于，当前估值锚说起来容易，真正做投资审查更难。公开资料仍未披露收入、毛利率、积压订单、客户集中度、续约行为或优先股堆叠。具名证据在家电和相邻工业渠道更强，完全列明的机器人 OEM
              量产项目则不足。公司可能正在搭建有价值的基础设施层，但投资人还看不出这一层已经产出高质量收入，还是主要由战略叙事定价。因此，正确读法是价格敏感：Yimu
              看起来真实且可能重要，但今天的证据支持有纪律的跟踪和结构化尽调，不支持按头部独角兽价格、以普通股条款做信念型入场。
