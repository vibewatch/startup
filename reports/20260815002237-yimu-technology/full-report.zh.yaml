      - number: '7.4'
        title: 人员、执行与投资逻辑失效风险
        blocks:
          - type: paragraph
            body: >-
              最后一组是执行风险。Yimu 试图一次跨过几门难生意：传感硬件、数据基础设施、模型工具，以及面向多个垂直场景的商业交付。管理层自己说过，芯片项目需要 18 到 24
              个月和大额前期投入，也承认没有数据，算法本身不足以形成强壁垒，并重度依赖 TouchNet
              等生态叙事。战略野心在方向上自洽，但执行上很脆。如果公司无法标准化部署，触觉需求转化为复购订单的时间更长，或更便宜的竞争对手抢下早期集成位，护城河会很快变窄。还有一类典型组织风险：擅长前沿研究和跨域发明的团队，未必能同时平衡平台宽度、产品纪律、认证、支持和客户成功。审慎的风险结论不是
              Yimu 异常脆弱，而是它暴露在多种耦合失效模式下，多种风险会彼此放大。投资人应把这些相互作用单独列出来评估。
