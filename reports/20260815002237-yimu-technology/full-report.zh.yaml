companyProfile:
  summary: >-
    Yimu Technology 是一家总部在深圳的物理 AI
    基础设施公司，重点是让机器人具备触觉感知。公开材料显示，公司产品栈覆盖视触觉传感模块、世界—动作模型，以及一个把硬件厂商、模型团队、技能构建者和研究者连接起来的生态。与其把它看成品牌化人形机器人
    OEM，不如把它理解成服务机器人操作和具身智能的使能层。公开报道还显示，公司从更早的感知应用和家电项目切入，再过渡到机器人商业化；这一点让 Yimu 不同于仍停在实验室阶段的纯触觉初创公司。公司仍是私人企业，财务披露不透明，但
    2026 年融资和产品叙事足以把它视为一家严肃运营公司，而不是概念故事。
