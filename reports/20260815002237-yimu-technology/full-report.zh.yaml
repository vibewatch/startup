chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与战略定位
        blocks:
          - type: paragraph
            body: >-
              Yimu 现在公开呈现的是一个围绕触觉感知、世界模型和具身执行搭建的物理 AI 平台，而不是单一组件传感器供应商。官方英文网站把公司使命定义为为物理世界构建 AI 基础；About 页面进一步说，Yimu
              正在从触觉感知到世界模型再到具身执行，搭建通用物理 AI 的基础栈。主页、感知页、模型页和生态页反复出现同一套架构：Sentra 负责物理感知，世界—动作模型层负责加入触觉后的推理，Dextra
              风格执行系统负责灵巧操作。这一定位很关键，因为它把 Yimu 放在具身 AI 的基础设施层。价值不只来自卖一台品牌化人形机器人，也可能来自传感器、数据、模型使能和集成。2026 年 7
              月的独立报道大体匹配这一定位，将公司描述为一家具身智能触觉感知开发商，借助视触觉感知和标准化数据管线，把感知、推理和行动串起来。
