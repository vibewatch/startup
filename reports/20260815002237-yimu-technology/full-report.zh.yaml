      - number: '3.4'
        title: 定价、包装与商业化姿态
        blocks:
          - type: paragraph
            body: >-
              直接可比的定价大多不透明，但包装差异可见。市场研究显示，2025 年全球人形机器人触觉传感器平均单价约 US$295；更宽的灵巧手系统价格则从中国低端手的低于 US$1,000，到远高得多的进口基准不等。XELA
              的公开材料强调以具成本效益的方式接入现有机器人手和夹爪，显示出模块化商业化姿态。GelSight 围绕高端精密能力和面向严苛工业或研究用例的结构化数据来组织产品，意味着它走的是高价值而非低成本销售路径。PPS
              围绕工程协作和可重复压力数据定位，更像工业仪器采购模式，而不是炫目的具身 AI 叙事。Yimu 的商业化姿态则是混合型：它销售专门触觉硬件，也在 WAIC
              等活动上营销数据、模型和全栈解决方案。这能扩大单客价值，但如果客户需要先接受更宽架构才会下批量订单，销售周期也可能拉长。
