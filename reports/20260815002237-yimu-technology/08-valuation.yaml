- id: comparables-and-scenarios
  title: Public robotics and automation benchmarks show upside exists, but they also show how much proof the market usually demands
  body: The comparable set is helpful only if it is used to bound the debate rather than to force a false direct multiple. Unitree's August 2026 IPO pricing around $9 billion matters because it gives China's robotics market its first transparent public benchmark for a leading humanoid builder, complete with disclosed revenue. Public automation and sensing names such as Cognex, Keyence, Symbotic, Teradyne, and Ambarella show how valuable enabling technologies and industrial-automation platforms can become once scale and public-market proof exist. But those businesses are materially larger, more mature, and more transparent than Yimu. For Yimu itself, scenario analysis is more defensible than comp transfer. In the bull case, the company becomes the default tactile infrastructure layer for multiple robot OEMs and data-model workflows. In the base case, it wins meaningful but still concentrated demand and needs another proof cycle. In the bear case, standards, reliability, or funding pressure
    push the valuation down toward harsher supplier-style bands.
