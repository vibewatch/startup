- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger Event
  - Description
  - Timeline
  - Impact
  - Monitoring Signal
  rows:
  - - Named robot OEM proof still absent
    - Commercial narrative remains class-level while valuation moves up again
    - Next financing / next 12 months
    - Keeps Yimu in narrative-led rather than proof-led territory
    - Referenceable deployments, customer list, and reorder data
  - - Reliability metrics disappoint
    - MTBF, drift, or field-failure data undercut the tactile-quality narrative
    - 6-18 months
    - Collapses willingness to pay a strategic premium for the stack
    - Independent test results and warranty / failure dashboards
  - - Standards or qualification lag appears
    - Domestic or export compliance work falls behind customer expectations
    - 6-18 months
    - Turns policy support into a gating commercial risk
    - Certification matrix, audit trail design, and customer qualification requests
  - - Preference-heavy round resets economics
    - Headline valuation rises but investor protections absorb much of the upside
    - Next financing
    - Reduces actual return economics for new capital
    - Liquidation waterfall, preference stack, and pro-rata rights
  - - Public comp derating or funding squeeze hits suppliers
    - Sector multiples compress as markets demand stronger proof
    - 12-24 months
    - Narrows room for opaque late-stage pricing
    - Unitree post-IPO trading, private-round pace, and China funding-policy signals
  notes: These triggers are monitorable within the next financing and commercialization cycle; none require a long-dated macro verdict to observe.
