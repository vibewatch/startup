- id: recommendation-and-entry-discipline
  title: At the current mark the right call is track, because the upside is real but the proof gap is still wide
  body: A buy call today would require treating product ambition, fundraising velocity, and sector enthusiasm as acceptable substitutes for operating disclosure. They are not. Yimu may absolutely grow into or beyond the current mark if tactile sensing becomes a must-have layer across several robot platforms and if the company converts that strategic role into repeatable commercial economics. But the public evidence does not yet show enough to underwrite that outcome with conviction. The correct call is therefore track or research more, not avoid forever and not buy now. That stance is not a dismissal of the company; it is an acknowledgement that the next few datapoints matter more than another round of abstract robotics TAM debate. Better terms, milestone-linked capital, stronger downside protections, or much clearer customer and margin disclosure would improve the setup quickly. Another step-up round without much better evidence would make the valuation harder to defend, not easier.
  claimRefs:
