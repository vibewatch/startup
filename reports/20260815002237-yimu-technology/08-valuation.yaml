- id: exit-readiness-and-final-diligence-gates
  title: Strategic optionality exists, but the next investment decision should be gated by concrete diligence asks and thesis-break triggers
  body: 'Yimu looks much closer to a strategic-asset story than to an IPO-ready standalone company today. A sensor, automation, test, semiconductor, or robot-platform buyer could plausibly value the company for tactile-data assets, ecosystem positioning, or component leverage well before public markets would reward it as a fully transparent independent business. For current investors, the right next step is not philosophical agreement that touch matters; it is structured diligence. The key asks are straightforward: segment revenue mix, top-customer share, repeat-order behavior, gross margin and support burden, reliability metrics, and the actual rights embedded in the cap table. The thesis should upgrade only if anonymous or class-level demand converts into named deployments and repeatable economics. It should downgrade quickly if reliability lags, standards and qualification work slip, or the next financing reveals that the headline valuation was much stronger than the actual investor economics.'
