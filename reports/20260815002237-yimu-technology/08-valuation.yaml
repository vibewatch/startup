  title: Thesis / anti-thesis table
  columns:
  - Thesis Leg
  - Support
  - Anti-Thesis Leg
  - Challenge
  rows:
  - - Tactile bottleneck winner
    - Embodied-AI manipulation needs touch, and Yimu is building a full tactile stack rather than a single part
    - Touch can commoditize or be internalized
    - OEMs may treat tactile hardware as a subsystem to own or squeeze once interfaces standardize
  - - Stack breadth creates leverage
    - Sensors, data, and model tooling can raise wallet share and switching costs
    - Breadth can become platform sprawl
    - Too many layers can slow product discipline, support quality, and sales efficiency
  - - Bridge-market commercialization helps
    - Appliance and public-company references show more grounding than a pure lab project
    - Robot-OEM proof is still under-named
    - The most valuation-relevant customers remain only partly disclosed
  - - Capital depth supports scale-up
    - Series E proceeds target production, chips, algorithms, and order delivery
    - Capital can arrive before unit economics
    - A large round does not prove durable margins, retention, or healthy concentration
  - - China ecosystem tailwind matters
    - Robotics funding, talent, and policy support are all moving in Yimu's favor
    - Public benchmarks may narrow tolerance for opacity
    - As public robotics comps appear, private suppliers may need much stronger proof to defend similar step-ups
  enumerationScope:
    coverage: exhaustive
    basis: Pairs every thesis leg and anti-thesis leg retained after reviewing chapters 1-7 and the net-new valuation sources.
  notes: The core debate is not whether Yimu has a real product. It is whether the current price already assumes supplier power and execution quality before they are publicly proven.
