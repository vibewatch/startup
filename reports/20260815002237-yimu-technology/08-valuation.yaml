  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Segment revenue, gross margin, burn, backlog conversion, and working-capital detail by business line.
    whyItMatters: Without the denominator, the current valuation cannot be tied cleanly to durable cash generation or operating leverage.
    diligencePath: Request management KPI pack, board materials, and finance-room exports for 2024-2026.
    relatedQuestionRefs:
    - QV003
    - QV007
    - QV023
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Named robot OEM customers, top-customer share, repeat-order cadence, and referenceable deployment metrics.
    whyItMatters: Customer concentration and reorder quality are the biggest variables separating a premium supplier from a fragile narrative.
    diligencePath: Run customer reference calls and review pipeline, cohort, and concentration schedules.
    relatedQuestionRefs:
    - QV009
    - QV018
    - QV023
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Preference stack, liquidation waterfall, pro-rata rights, and protective provisions for the current and next round.
    whyItMatters: Headline valuation can materially overstate actual investor economics if late-stage protections are heavy.
    diligencePath: Review financing documents, updated cap table, and term-sheet summary with counsel.
    relatedQuestionRefs:
    - QV021
    - QV024
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A broader set of directly comparable tactile-sensing private rounds with disclosed pricing and operating context.
    whyItMatters: The current comp set is decision-useful but mixed across public automation, enabling layers, and full-stack robot platforms.
    diligencePath: Expand the comp set with private financing data, M&A precedents, and any disclosed supplier transactions.
    relatedQuestionRefs:
    - QV010
    - QV012
    relatedTableRefs:
    - TV004
