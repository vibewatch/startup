company:
  name: Yimu Technology
chapter:
  number: 8
  title: Valuation
  summary: Yimu Technology's $1.4B-$1.5B unicorn mark is understandable in strategic terms, but the public record still leaves too much of the underwriting denominator unproven. The company has real financing depth, bridge-market commercialization, and a differentiated tactile-data narrative, yet it has not disclosed the revenue, margin, concentration, and reliability metrics that would make the current price look obviously cheap. The most defensible stance today is track / research more with medium confidence, high risk, and a fair-to-slightly-stretched valuation read. Upside exists if Yimu becomes a default tactile infrastructure layer across multiple robot OEMs, but the public proof gap is still doing too much work.
sections:
- id: valuation-framework-and-price-context
  title: The price is visible, but the operating denominator is still mostly private
  body: 'Yimu is easier to value strategically than financially. Public reporting is clear that the company closed a July 2026 Series E of more than RMB1 billion at a valuation above RMB10 billion and joined the year''s robotics-unicorn wave. Public reporting is also clear that management wants investors to view Yimu as physical-AI infrastructure: tactile sensing hardware, tactile encoding, model-enablement, and order-delivery scale-up rather than a single sensor SKU. The harder part is that the public record still does not disclose revenue, gross margin, bookings conversion, customer concentration, or burn. That means classic revenue-multiple valuation is not available without inventing the denominator. The right underwriting frame is therefore milestone-based. Investors should ask what evidence would make the current price look cheap, fair, or expensive: named robot OEM customers, repeat orders, reliability metrics, and proof that the company can capture value as an enabling layer rather
    than as an interesting but replaceable module vendor.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  figureRefs:
  - FV002
- id: thesis-vs-anti-thesis
  title: The bullish case is a tactile bottleneck winner; the anti-thesis is that suppliers get priced before they get proven
  body: The positive case for Yimu is strong enough to merit serious attention. Tactile sensing sits at the junction between perception and manipulation, and Yimu is pitching a full operating loop from tactile hardware to encoded data and model training. That is a much stronger strategic story than simply selling a commodity pressure sensor. The company also has evidence of bridge-market commercialization in appliances and customer classes beyond research labs, which makes it more credible than a concept-stage humanoid startup. The negative case is just as real. Public evidence still does not show customer count, repeat-order behavior, top-account concentration, or unit economics. Independent technical sources continue to describe tactile sensing as a domain with unresolved reliability, calibration, and standardization challenges. At today's price, investors are therefore underwriting not just technical promise, but the much harder claim that Yimu becomes a default infrastructure layer before
    broader market or customer discipline compresses supplier premiums.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  tableRefs:
