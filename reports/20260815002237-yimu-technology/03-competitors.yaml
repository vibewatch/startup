callouts:
- calloutType: insight
  title: Yimu’s real peer is the “touch plus stack” vendor, not the generic sensor vendor
  body: If a customer only wants pressure mapping, Yimu will not always be the natural choice. Its strongest angle appears when tactile hardware must be connected to data infrastructure and embodied control logic.
  claimRefs:
  - CP003
  - CP015
  - CP017
  - CP019
- calloutType: risk
  title: XELA looks like the closest public peer in hand-centric commercialization
  body: XELA’s hardware-agnostic integrations, palm-plus-fingertip coverage, and public commercialization cadence make it a credible benchmark for what an internationally legible tactile-sensing company looks like in 2026.
  claimRefs:
  - CP008
  - CP009
  - CP020
  - CP027
- calloutType: assumption
  title: No public peer proves that tactile sensing has already become a stable winner-take-most market
  body: The landscape still looks fragmented and immature. That helps Yimu’s entry case, but it also means moat claims need field data, not only product positioning.
