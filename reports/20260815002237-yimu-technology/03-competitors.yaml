  evidenceGaps:
  - type: missing-source
    severity: material
    topic: like-for-like-benchmarking
    missingEvidence: Head-to-head lab and field data comparing Yimu against XELA, GelSight, PPS, and domestic Chinese peers on the same manipulation tasks.
    whyItMatters: Public positioning can overstate real differentiation if the tasks, object sets, or integration assumptions differ.
    diligencePath: Request customer bake-off data, third-party benchmark results, and failure-rate comparisons on common tasks.
    relatedQuestionRefs:
    - QP010
    - QP011
    - QP023
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Actual quote-level pricing, gross-margin targets, and support requirements for Yimu and its closest peers.
    whyItMatters: Competitive posture depends heavily on whether Yimu wins on performance, bundling, or unit economics.
    diligencePath: Collect distributor quotes, channel partner data, and customer procurement records for comparable configurations.
    relatedQuestionRefs:
    - QP014
    - QP015
    - QP016
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: Evidence of multi-year renewals, standardized data interfaces, or customer integrations that would raise switching costs in practice.
    whyItMatters: A system-level moat is only credible if customers actually become operationally dependent on Yimu’s stack.
    diligencePath: Review renewal rates, product attach data, APIs in active use, and customer migration costs.
