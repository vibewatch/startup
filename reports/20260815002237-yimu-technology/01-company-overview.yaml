- id: commercial-proof-and-open-disclosure-gaps
  title: Commercial proof and open disclosure gaps
  body: 'Commercially, Yimu looks more grounded than many embodiment startups because the company appears to have pre-robot business lines and real industrial customers. Open-source reporting repeatedly says its sensing stack already entered leading appliance supply chains and that the CES 2025 wash-care robot is moving toward production. At the same time, the company-overview record is still materially under-disclosed in the places that matter for underwriting. No reviewed source provided current revenue, gross margin, cash balance, customer concentration, robotics revenue split, or a fully reconciled round-by-round total-raised figure. Third-party articles also disagree on historic patent counts because they are taken from different moments in time: January 2025 stories cite roughly 200-plus patents and 61 software copyrights, while July 2026 reporting claims more than 700 global intellectual-property assets or 400-plus patents and 80 software copyrights. Those numbers can coexist as a
    growth trajectory, but they also illustrate that much of the public Yimu record is still promotional and point-in-time rather than investor-grade. The core conclusion for later chapters is therefore balanced: Yimu has credible technology, investor demand, and customer traction signals, but the public evidence base is much stronger on technical promise than on operating economics.'
