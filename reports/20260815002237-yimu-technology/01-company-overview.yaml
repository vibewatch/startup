company:
  name: Yimu Technology
chapter:
  number: 1
  title: Company Overview
  summary: Yimu Technology is a Shenzhen-headquartered physical-AI infrastructure company centered on tactile sensing, embodied models, and dexterous execution. Public 2025-2026 evidence shows the company evolved from multimodal sensing roots in water and smart-home applications into robot tactile sensing, closed a more-than-RMB1 billion Series E in July 2026 at a valuation above RMB10 billion, and is positioning itself as an infrastructure supplier rather than a full humanoid OEM. The opportunity is real, but open-source disclosure on revenue, exact customer mix, and legal-entity chronology still lags the valuation narrative.
sections:
- id: identity-and-strategic-positioning
  title: Identity and strategic positioning
  body: 'Yimu now presents itself publicly as a physical-AI platform built around tactile sensing, world models, and embodied execution rather than as a single-component sensor vendor. The official English-language site frames the company mission as building AI foundations for the physical world, while the About page says Yimu is building the foundational stack for general-purpose physical AI from tactile sensing through world models and embodied execution. Across the homepage, sensing page, models page, and ecosystem page, the same architecture appears repeatedly: Sentra for physical sensing, a world-action-model layer for tactile-augmented reasoning, and Dextra-style execution systems for dexterous manipulation. That framing matters because it places Yimu in the infrastructure layer of embodied AI, where value can come from sensors, data, model-enablement, and integration rather than from selling one branded humanoid robot. Independent July 2026 coverage broadly matches this positioning
    and describes the company as an embodied-AI tactile-perception developer using visuotactile sensing and standardized data pipelines to bridge sensing, reasoning, and action.'
