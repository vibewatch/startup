callouts:
- calloutType: strength
  title: The company story is broader than one sensor SKU
  body: Yimu’s strongest strategic signal is that it is trying to own the stack between sensing, tactile data, and model-enablement rather than sell an isolated component. That position can support better margins and deeper lock-in if the ecosystem actually forms around its data standards and integration layers.
  claimRefs:
  - CO001
  - CO002
  - CO005
  - CO006
  - CO015
  - CO032
- calloutType: insight
  title: Smart home was the commercialization bridge into robotics
  body: The most plausible reading of the public record is that Yimu used water and smart-home sensing to build chips, data pipelines, and customer credibility before attacking robot tactile sensing. The CES 2025 wash-care robot is the visible hinge between those two eras.
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
- calloutType: risk
  title: Disclosure quality is still much weaker than the valuation narrative
  body: Yimu’s public coverage is rich on mission, demos, technical promise, and financing headlines, but thin on revenue, customer concentration, gross margin, cash burn, and legal-entity detail. That mismatch should temper any attempt to underwrite the July 2026 valuation on open sources alone.
