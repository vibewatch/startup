- id: capital-base-and-investor-signal
  title: Capital base and investor signal
  body: The public funding arc is one of the clearest supports for Yimu’s current market position. July 2026 coverage from TechNode, China Securities Journal, Economic Information Daily, Tencent News, TMTPost, and others consistently says the company completed a Series E of more than RMB1 billion at a valuation above RMB10 billion. Those same reports say the new money is intended for tactile-perception materials, chips, algorithms, and models, plus mass production and delivery of production-line orders. Earlier financing coverage from January 2025 shows a several-hundred-million-RMB D round led by SAIF with Nanjing Innovation Investment Group and Songlin Technology following, and says earlier backers included Shunwei, investment vehicles linked to TCL and chip ecosystems, and other industrial-capital names. Taken together, those disclosures imply Yimu has moved from early technology incubation into growth-stage scale-up with both financial and strategic investors, especially from appliance,
    chip, and industrial ecosystems. What remains opaque is the detailed cap table, liquidation structure, and exact total capital raised across all rounds.
