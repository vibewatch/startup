- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk Category
  - Kill Signal
  - Recovery Path
  - Diligence Ask
  rows:
  - - Reliability
    - Repeated field failures or inability to produce credible MTBF and drift data
    - Pause new deployment expansion and requalify the module stack with independent testing
    - Request lifetime, drift, and failure-analysis dashboards
  - - Compliance
    - No credible domestic or export qualification path for core tactile products
    - Map products to HEIS, ISO, and target-customer qualification regimes before scaling
    - Request certification matrix, safety cases, and audit trail design
  - - Customer quality
    - Pilots do not convert into repeat orders or named references
    - Refocus on the highest-conviction verticals and reduce speculative platform breadth
    - Request named reference customers, reorder history, and concentration data
  - - Supply chain
    - Critical chips or materials have no qualified fallback and cause delivery slippage
    - Dual-source critical inputs and redesign around substitute components where possible
    - Request alternate BOMs, supplier concentration, and qualification timelines
  - - Data moat
    - TouchNet and private data fail to show practical customer advantage
    - Prioritize proprietary workflow data and paid deployments over ecosystem narrative
    - Request evidence that data assets improve win rates, model quality, or retention
  notes: These kill criteria focus on the handful of risks most likely to invalidate the investment thesis rather than the entire long-tail risk set.
