company:
  name: Yimu Technology
chapter:
  number: 7
  title: Risks
  summary: Yimu’s main risks are not generic startup risks; they are the risks of industrializing an ambitious physical-AI stack before standards, reliability benchmarks, and supply chains are fully settled. The company faces a moving compliance landscape for humanoid and embodied systems, dependence on materials/chips/data/model integration, pressure from rapid Chinese competition and price compression, and the classic execution problem of turning strong demos into repeatable field performance. The mitigating fact is that many of these risks are also sector-wide, which creates upside for a supplier that aligns early with emerging standards and proves reliability first.
sections:
- id: regulatory-standards-and-policy-risk
  title: Regulatory, standards, and policy risk
  body: 'Yimu operates in a field where the rules are still being written. China’s 2026 humanoid and embodied-intelligence standard system introduced six pillars spanning basic commonality, intelligent computing, limbs and components, complete systems, application, and safety and ethics. Both the official release and comparative analysis sources make clear that tactile sensors, data lifecycle management, deployment, and safety now sit inside a formalizing national framework. For Yimu, that cuts both ways. Early alignment can become an advantage if its interfaces, test methods, and data processes match emerging norms. But it also means product definitions, data governance, and safety requirements can move faster than a young company’s documentation or certification practice. Internationally, the framework is still unsettled: humanoid-specific ISO coverage is incomplete, and broader safety standards still come from industrial or collaborative-robot traditions that do not map perfectly to mobile,
    human-facing physical-AI systems. Compliance risk is therefore both domestic and cross-border.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
