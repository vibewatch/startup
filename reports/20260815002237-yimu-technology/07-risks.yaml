  - FR003
- id: people-execution-and-thesis-break-risk
  title: People, execution, and thesis-break risk
  body: 'The final cluster is execution. Yimu is attempting to bridge several hard businesses at once: sensing hardware, data infrastructure, model tooling, and commercial delivery into multiple verticals. Management itself has described chip programs that take 18 to 24 months and large upfront investment, has admitted that algorithms alone are not strong enough barriers without data, and has leaned heavily on ecosystem-building narratives such as TouchNet. That ambition is strategically coherent but executionally brittle. If the company cannot standardize deployments, if tactile demand takes longer to convert into repeat orders, or if cheaper competitors win early integration slots, the moat can narrow quickly. There is also a classic organizational risk: a team optimized for frontier research and cross-domain invention may struggle to balance platform breadth with product discipline, certification, support, and customer success. The prudent risk verdict is therefore not that Yimu is unusually
    fragile, but that it is exposed to several coupled failure modes that can amplify one another. Investors should treat these interactions explicitly.'
