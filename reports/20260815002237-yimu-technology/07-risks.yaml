- id: dependency-and-supply-chain-risk
  title: Dependency, supply chain, and go-to-market risk
  body: Yimu’s stack depends on more than one scarce input. The company’s own messaging spans materials, optics, chips, algorithms, models, and production-line delivery. The BIS guidance in 2025-2026 shows continuing U.S. policy churn around advanced computing items connected to China and D:5 entities, while electronics standards updates underline how component-level safety, EMC, thermal, and environmental qualification requirements continue to rise for industrial electronics. Even if Yimu can localize much of its stack, it still faces supply and validation risk anywhere specialized chips, connector reliability, EMC performance, or industrial packaging are hard to qualify. Go-to-market risk compounds this. Public customer proof is still concentrated and partly unnamed; robot OEM conversion, order quality, and cross-vertical reuse are not fully proven. The company can therefore be hurt both by upstream dependency shocks and by downstream demand converting more slowly than financing headlines
    suggest.
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR038
  - CR039
