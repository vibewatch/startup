summary:
  headline: Yimu appears to be one of China’s more strategically interesting tactile-infrastructure companies, but the current unicorn valuation still outruns the public evidence on revenue quality and downside structure, supporting a TRACK stance rather than a buy.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
