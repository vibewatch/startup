    - CO009
    - CO010
  foundingLocation: 2015 Silicon Valley origin story; later China build-out
  headquarters: Shenzhen, China
  productSummary: Yimu sells tactile-sensing modules and a broader visuotactile stack that includes sensing hardware, data infrastructure, and world-model tooling for robotic hands, arms, manipulation systems, and related physical-AI use cases.
  customerFocus: Robot OEMs, large technology companies with model teams, data-service providers, appliance and industrial partners, and ecosystem researchers or integrators.
  businessModel: Hardware modules plus higher-layer data/model tooling and services; the company appears to monetize both component-level sensing and broader solution or platform attachments.
  stage: Late-stage private (Series E completed in July 2026)
  fundingStatus: Public reporting converges on a July 2026 Series E of more than RMB 1 billion at a valuation above RMB 10 billion, following a January 2025 D round and several earlier financings.
