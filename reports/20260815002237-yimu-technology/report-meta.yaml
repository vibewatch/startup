companyProfile:
  summary: Yimu Technology is a Shenzhen-based physical-AI infrastructure company focused on giving robots tactile perception. Public materials show a stack spanning visuotactile sensor modules, world-action models, and an ecosystem meant to connect hardware vendors, model teams, skill builders, and researchers. The business is better understood as an enabling layer for robotic manipulation and embodied intelligence than as a branded humanoid OEM. Public reporting also indicates a commercialization bridge from earlier sensing applications and appliance programs into robotics, which helps distinguish Yimu from pure lab-stage tactile startups. The company remains private and financially opaque, but its 2026 financing and product narrative are strong enough to treat it as a serious operating company rather than a speculative concept story.
  foundedDate: '2016-01-01'
  founders:
  - name: Li Zhiqiang
    role: Founder and CEO
    background: Public profiles describe Li as a Carnegie Mellon-trained founder who previously worked across biosensing, spectroscopy, and AI-related technologies before building Yimu.
