evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-disclosure
    missingEvidence: Audited or management-confirmed revenue, gross margin, and robotics-vs-legacy-business mix.
    whyItMatters: The current public record cannot support underwriting of the July 2026 valuation on operating performance.
    diligencePath: Request board deck, monthly financial package, and business-line revenue bridge for 2024-2026 YTD.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: Full financing chronology with round sizes, dates, lead investors, ownership, and preferences.
    whyItMatters: Growth-stage valuation and dilution risk cannot be assessed from headline funding articles alone.
    diligencePath: Obtain cap table, charter docs, term sheets, and most recent financing summary from counsel or CFO.
    relatedQuestionRefs:
      - QO014
      - QO025
  - type: conflicting-data
    severity: minor
    topic: founding-chronology
    missingEvidence: Primary legal-entity timeline clarifying 2015 Silicon Valley origin versus 2016 China operating-company date.
    whyItMatters: The discrepancy is not thesis-breaking, but it affects company-age references and background diligence accuracy.
    diligencePath: Confirm incorporation dates, redomiciliation history, and legal-entity map from corporate records.
    relatedQuestionRefs:
      - QO004
      - QO025
  - type: missing-source
    severity: material
    topic: customer-economics
    missingEvidence: Contract size, duration, renewal, and revenue contribution for TCL/Whirlpool/Panasonic or other named customers.
    whyItMatters: Supply-chain entry is useful proof, but revenue durability and concentration are still unknown.
    diligencePath: Request top-customer schedule and shipped-program list split by legacy sensing versus tactile robotics.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: minor
    topic: ip-count
    missingEvidence: A current company-issued patent and software-rights summary with filing jurisdictions and active status.
    whyItMatters: Open-source IP counts appear to be time-stamped and not directly comparable.
    diligencePath: Request current IP docket summary from legal or IP counsel.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone table public chronology remains partial
    missingEvidence: A complete internal milestone chronology covering seed rounds, pilot launches, and legal-entity transitions.
    whyItMatters: >-
      The public milestone record is adequate for narrative orientation but not exhaustive enough to reconstruct Yimu's
      full company history.
    diligencePath: >-
      Request a management-approved timeline deck or board materials that reconcile entity formation, product launches,
      and financing events.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
