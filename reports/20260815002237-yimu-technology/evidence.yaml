    whyItMatters: >-
      Founder dependence and governance quality cannot be fully assessed from public materials that only name Li
      Zhiqiang and broad team pedigree.
    diligencePath: Request org chart, board composition, and key-leader biographies from management or data room materials.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
