companyProfile:
  summary: >-
    Drata is a late-stage private compliance and trust-management company founded by Adam Markowitz, Troy Markowitz, and
    Daniel Marashlian. It began as a SOC 2 automation platform, then broadened into SafeBase-led trust centers, risk
    workflows, and AI-assisted questionnaire handling. Public materials now frame the company as the trust layer between
    great companies, and third-party estimates put it near $100M revenue / $98M ARR with 8,500+ customers and roughly
    732 employees, but the current financing structure and operating margins remain opaque.
