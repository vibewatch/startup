      - ['Late-stage private market', 'capital context', 'Current valuation reference is stale', 'What were the 2025 round terms and preferences?']
    notes: Investor mapping is representative rather than exhaustive; it is intended to surface diligence questions around control, signaling, and preference structure.
    claimRefs: [CO001, CO007, CO008, CO009]
    enumerationScope:
      coverage: sample
      basis: publicly visible investors and strategic backers across disclosed rounds
