schemaVersion: report-v2
artifact: company-overview
slug: drata
runDate: '2026-09-24'
company:
  name: Drata
chapter:
  number: 1
  title: Company Overview
  summary: Drata is a late-stage private compliance and trust-management company that has scaled from SOC 2 automation into a broader agentic trust platform, but its latest financing terms and current operating metrics remain only partly disclosed.
sections:
  - id: identity-and-scale
    title: Identity and Scale
    body: >-
      Drata presents itself as the trust layer between great companies and now markets an agentic trust management platform rather than a single-purpose SOC 2 tool. The company says it serves 8,500+ global customers, has 1,300+ alliance partners, and offers 250+ integrations. Public materials also show a shift toward trust centers, AI-assisted questionnaires, and broader GRC workflows, which supports a larger platform story than the original compliance-automation wedge. That broader story matters because it makes Drata look more like a multi-product trust platform than a one-feature compliance utility.
    claimRefs: [CO001, CO003, CO004, CO005, CO011]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-financing
    title: Leadership and Financing
    body: >-
      The founding team remains central to the company narrative: Adam Markowitz, Troy Markowitz, and Daniel Marashlian are still the names most consistently attached to the company, and Adam Markowitz is the CEO. The financing arc is also clear. Drata completed a Series A, then a Series B that pushed it into unicorn territory, and then a Series C that doubled valuation to $2B. What is not public is the precise structure of the more recent 2025 financing activity. The governance question is therefore not who built the company, but how much economic control the latest private round may have shifted.
    claimRefs: [CO002, CO006, CO007, CO008, CO009, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-and-gaps
    title: Milestones and Open Questions
    body: >-
      Drata's visible milestones show a fast transition from launch to category leadership: founder-led launch, rapid fundraising, a scaling customer base, and a product expansion into SafeBase and AI-assisted workflows. The unanswered diligence issue is not whether the company has scaled; it clearly has. The open question is how much of that growth now converts into durable economics, because the company still does not publicly disclose ARR, margin, retention, or the latest financing terms in a way that would support precise underwriting. That matters because the last visible valuation is already old enough to be a reference point rather than a live market mark, and because the customer and partner story is stronger than the operating-data story. The practical diligence ask is therefore simple: confirm whether the 2025 financing changed ownership or economics in a way that the public record cannot show. A refreshed data room would narrow that uncertainty more than any additional public marketing claim.
    claimRefs: [CO004, CO009, CO010, CO011]
