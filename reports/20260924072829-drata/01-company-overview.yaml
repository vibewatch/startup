      - [GGV Capital, 'lead investor', 'Series B/C backer with category credibility', 'Did its support continue into the latest round?']
      - [Salesforce Ventures, 'strategic investor', 'Ecosystem and distribution signal', 'What partnership rights or commercial ties exist?']
