evidenceGaps:
  - type: missing-source
    severity: material
    topic: financing-terms
    missingEvidence: >-
      The amount, lead investor, and preference structure of the 2025 private financing are not publicly disclosed in
      the reviewed corpus.
    whyItMatters: The current valuation and control picture are too stale to underwrite precisely without the latest round terms.
    diligencePath: Request the latest cap-table summary and financing documents directly from the company.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: investor-map
    missingEvidence: The current investor map does not disclose side letters, board rights, or any hidden preference structure.
    whyItMatters: The investor table is representative, not a substitute for a current cap table.
    diligencePath: Obtain a refreshed investor and governance schedule from management.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: market-size
    missingEvidence: >-
      A formal third-party TAM/SAM/SOM study specific to Drata's exact category boundary was not found in the reviewed
      corpus.
    whyItMatters: The chapter can bound the market, but not defensibly size it with a single authoritative model.
    diligencePath: Pull a paid analyst report or the company's internal market model.
    relatedQuestionRefs:
      - QM002
  - type: unresolved-question
    severity: minor
    topic: unresolved-sizing
    missingEvidence: QM007 remains unresolved because no source gives a clean, authoritative sizing model.
    whyItMatters: The chapter can only bracket the market, not collapse the uncertainty into a single answer.
    diligencePath: Obtain management's current segmentation model and market-sizing deck.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: minor
    topic: exact-vendor-share
    missingEvidence: >-
      No public source in this corpus quantifies share of wallet or win-rate by vendor in the compliance automation
      category.
    whyItMatters: Without win-rate data, competitor strength remains directional rather than measurable.
    diligencePath: Request pipeline and win-loss data from the company or a neutral analyst dataset.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: blocking
    topic: margin-and-runway
    missingEvidence: Gross margin, NRR, and burn-rate disclosures are absent from the reviewed public corpus.
    whyItMatters: Without those fields, the chapter cannot produce a precise valuation or capital-adequacy view.
    diligencePath: Request an investor data room or audited financial summary.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: minor
    topic: roadmap-precision
    missingEvidence: Public sources do not fully disclose the roadmap for AI depth, model governance, or future module sequencing.
    whyItMatters: The chapter can describe the current stack, but not verify how far the AI layer will go.
    diligencePath: Request a product roadmap and security architecture review.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: Public evidence for NRR, GRR, churn, and top-customer concentration is not available in this corpus.
    whyItMatters: Customer breadth is visible, but the durability of that base remains unproven.
    diligencePath: Request retention cohorts and top-account concentration from management.
    relatedQuestionRefs:
