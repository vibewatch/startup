      - [Secureframe, direct peer, 'Mid-market scale', 'Compliance-led SaaS and fintech', 'Strong automation and audit support', 'Less scale than Vanta']
      - [Scrut, direct peer, 'Smaller private company', 'India / global mid-market', 'Transparent packaging in some comparisons', 'Less category mindshare']
      - [Delve, AI-first challenger, 'Newer and smaller', 'Engineering-heavy startups', 'Agentic AI-led workflow', 'Early product maturity']
      - [Manual process, substitute, 'Zero software revenue', 'Very small or resource-constrained teams', 'No software lock-in', 'High labor cost and error risk']
    notes: Scale and funding figures are public estimates and comparison-page claims, not audited company financials.
    claimRefs: [CP001, CP002, CP003, CP006, CP007]
    enumerationScope:
      coverage: sample
      basis: public comparison pages and company materials covering the Drata buying set
  - id: TP002
    title: "Feature / capability matrix"
    columns: [buying criterion, Drata, Vanta, Secureframe, Scrut]
    rows:
      - [Trust center, 'SafeBase-led trust center and AI questionnaire assistance', 'Built-in trust center on higher tiers', 'Available, but less externally emphasized', 'Available with transparent packaging']
      - [Integrations, '250+ integrations', 'Broad integration base', 'Broad but smaller public surface', 'Solid but less documented']
      - [Pricing transparency, 'Custom-quoted', 'Custom-quoted', 'Custom-quoted', 'More transparent in comparisons']
      - [AI workflow, 'AI-assisted trust and questionnaire workflows', 'Agentic AI with deeper workflow automation', 'Basic or emerging AI features', 'AI-led positioning']
      - [Enterprise readiness, 'Growing upmarket', 'Strongest among the set', 'Good mid-market readiness', 'Smaller enterprise proof set']
    notes: This matrix reflects public messaging and comparison pages; unsupported cells are intentionally summarized as "smaller" or "less documented" rather than guessed.
    claimRefs: [CP004, CP005, CP006, CP007, CP008]
  - id: TP003
    title: "Pricing / packaging comparison"
    columns: [vendor, price/unit/contract model, included capabilities, discount or unknowns, implication]
    rows:
      - [Drata, 'Custom quote by company size and framework scope', 'Automation, trust center, risk workflows', 'Exact discounts and renewal terms not public', 'Sales-led buying motion']
      - [Vanta, 'Custom quote with tiering', 'Broader enterprise breadth and auditor workflow', 'Exact deal price not public', 'Competitive benchmark rather than clear winner']
      - [Scrut, 'Some public comparison pages cite transparent tiers', 'Compliance and trust basics', 'Exact enterprise discounts still unclear', 'Lower perceived procurement friction']
      - [Manual process, 'Labor-only', 'Spreadsheets and consultant time', 'Hidden labor cost', 'Looks cheap until audit or sales pressure hits']
    notes: Pricing data is intentionally high-level because most vendors in this category quote by deal and change packaging often.
    claimRefs: [CP005, CP008, CP009]
    enumerationScope:
      coverage: sample
      basis: public pricing pages, comparison sites, and review commentary
