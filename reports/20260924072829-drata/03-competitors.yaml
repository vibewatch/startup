          tone: neutral
          claimRefs: [CP003]
        - label: Scrut
          x: 4
          y: 5
          detail: Smaller peer with price and packaging pressure
          tone: neutral
          claimRefs: [CP006]
        - label: Delve
          x: 3
          y: 7
          detail: Newer AI-first challenger with smaller scale
          tone: neutral
          claimRefs: [CP007]
        - label: Manual process
          x: 1
          y: 2
          detail: Spreadsheet and consultant-led substitute
          tone: warning
          claimRefs: [CP009]
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007]
tables:
