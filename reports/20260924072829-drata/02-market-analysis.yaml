    title: "Market definition table"
    columns: [segment/category, included spend, excluded spend, buyer/payer, relevance]
    rows:
      - [Compliance automation, 'SOC 2 / ISO 27001 / evidence collection / policy management', 'Generic SIEM, endpoint, IAM, and audit labor', 'Security/GRC leaders; finance approves', 'Core spend bucket']
      - [Vendor-risk / trust management, 'External trust centers, VRM, AI-assisted evidence', 'General CRM, ticketing, and generic CMS tools', 'Security + sales enablement', 'Adjacent expansion bucket']
      - [Manual compliance work, 'Spreadsheet tracking, consultant labor, auditor prep', 'Software licenses themselves', 'Operations and security teams', 'Status-quo substitute']
      - [Point solutions, 'Audit evidence collectors / policy managers / QBR tools', 'Broad GRC suite upgrades that replace the use case', 'Individual budget holders', 'Adjacent or partial substitute']
    notes: This is a boundary table, not a market-size estimate; it defines what is in and out of scope for Drata's buying motion.
    claimRefs: [CM001, CM002, CM010]
    enumerationScope:
      coverage: sample
      basis: publicly sourced buyer workflow and adjacent compliance/trust tooling
  - id: TM002
    title: "Sizing lens table"
    columns: [publisher, year, geography, value, CAGR, methodology, confidence, limitation]
    rows:
      - [Sacra, '2025', Global, 'Drata-specific ARR estimate', n/a, 'Bottom-up public-source estimate', medium, 'Private-company estimate']
      - [Built In, '2026', Global, 'Mature-growth framing', n/a, 'Editorial analysis', medium, 'Not a formal market size']
      - [YipitData, '2026', Global, 'Competitive category leader vs challenger', n/a, 'Analyst comparison', medium, 'Buyer behavior not a TAM model']
      - [Tech Insider, '2026', Global, 'Platform-war framing', n/a, 'Competitor comparison', medium, 'Pricing and adoption are qualitative']
    notes: Because the chapter does not have a single authoritative market report, this table keeps multiple lenses separate rather than forcing them into one false TAM figure.
    claimRefs: [CM003, CM007, CM009]
  - id: TM003
    title: "Segment / buyer map"
    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - [High-growth SaaS, 'CISO / security lead', 'GRC analysts and founders', 'Security / IT budget', 'SOC 2 readiness and evidence collection', 'Security leader', 'Enterprise deal requires compliance proof']
      - [Fintech / regulated software, 'Security, risk, or compliance lead', 'Cross-functional team', 'Security + compliance budget', 'Framework expansion and continuous monitoring', 'Security / finance', 'Regulatory or customer diligence pressure']
      - [Enterprise trust programs, 'GRC / trust org', 'Sales enablement and trust-center teams', 'Security + sales support budget', 'External trust center and questionnaire handling', 'Trust / sales ops', 'Large customer due diligence becomes a bottleneck']
      - [Partner / auditor ecosystem, 'Audit firms / advisors', 'External reviewers', 'Partner / services budget', 'Review workflow and advisory assistance', 'Channel or services owner', 'Need to scale client compliance delivery']
    notes: Buyer mapping is indicative rather than exhaustive; it is meant to show who feels the pain first and who actually signs the check.
    claimRefs: [CM004, CM005, CM010, CM011]
    enumerationScope:
      coverage: sample
      basis: public materials showing the most common compliance-buying motions
