      - number: '4.3'
        title: 资本储备与核心阻碍
        blocks:
          - type: paragraph
            body: >-
              Drata 融资规模足以支持多年扩张，但最近一次完整公开的估值仍是 2022 年的 $2B。公司看起来资金充足，信息披露却不完整。主要障碍不是现金能否撑下去，而是当前
              ARR、毛利率、烧钱速度和最新私募融资条款都没有公开；这些信息比历史融资轮次更影响估值。在缺口补齐前，只能给估值区间，无法给出可靠的点估值；公开市场信号更多反映过去，而非当前定价。资产负债表看起来有支撑，但公开尽调材料仍跟不上业务发展。这让
              Drata 值得关注，却难以定价。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI012
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品版图
        blocks:
          - type: paragraph
            body: >-
              Drata 已不只是 SOC 2 检查清单工具。公开产品还包括持续合规、Trust Center、风险管理、AI
              辅助问卷处理，以及伙伴驱动的设备和身份集成。产品版图更广，也更贴近企业需求；但客户必须先把平台接入现有技术栈，自动化才有价值。这既带来粘性，也带来风险：接入后产品可能更难替换，但每增加一个模块，实施要求也随之提高。这也是
              Drata 的宣传更强调信任成果，而非单纯罗列功能的原因。
            claimRefs:
