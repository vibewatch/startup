              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 切换成本与护城河
        blocks:
          - type: paragraph
            body: >-
              Drata 的护城河主要来自切换成本和生态深度，而非新功能。企业接入证据工作流、审计师协作、信任中心页面和伙伴集成后，换供应商并不轻松。这有利于
              Drata，但对手若能简化首次部署，或降低对外信任页面的成本，也能抢走客户。这个品类既有一定锁定效应，也持续承受同质化压力。客户把 Drata 当作日常运营基础设施，而非一次性合规采购时，护城河最牢。若
              Drata 持续减少这套运营流程中的人工步骤，即使竞品功能相近，壁垒仍会加深；否则，价格和易用性竞争会让市场继续流动。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
