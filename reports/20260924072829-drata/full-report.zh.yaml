              - CM006
              - CM011
      - number: '2.2'
        title: 市场规模与客群分层
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，市场增长很快，但仍不透明。Sacra 对 Drata 2025 年 ARR
              的估算，加上公司自身的增长说法，都表明其规模已不小；第三方对比资料显示，买方会看公司规模、框架覆盖和实施负担。比行业更能解释采购的，是合规紧迫度：高增长
              SaaS、受监管的金融科技公司和重视安全的成长型企业先买；等信任与供应商风险流程直接关系到收入时，大型企业才会采用。更多团队把信任运营视为基础设施，而非临时项目，推动了品类扩张。机会在于触达更多预算；代价是每增加一类工作流，实施要求和工作量也会上升。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM007
              - CM009
      - number: '2.3'
        title: 驱动因素与发展瓶颈
        blocks:
          - type: paragraph
            body: >-
              监管复杂度是最强的结构性驱动力：SOC 2 和 ISO 27001 已是基本要求，DORA、GDPR 与 AI
              治理又不断增加工作量。限制因素也很明确：价格不透明、迁移不顺，以及买方需要验证实时控制覆盖，而非只看某一时点的检查清单。市场增长的关键不只是提高认知，更要消除买方的顾虑：别让他们为一款无法迅速投入运营的工具买单。买方越来越希望平台能接手相邻工作，又不必另起一套信任项目。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
