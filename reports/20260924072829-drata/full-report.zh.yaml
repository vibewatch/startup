  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规法律与运营风险
        blocks:
          - type: paragraph
            body: >-
              已审阅的资料中，Drata
              似乎没有遭遇引人注目的法律或监管危机，但运营风险仍不可忽视。产品依赖大量客户集成、外部系统和工作流配置，任何故障都可能打断其持续鉴证承诺。评论和帮助文档也显示，用户会遇到导航不顺、报表问题和支持响应等摩擦；信任软件必须运行可靠，才能让承诺可信。风险会逐步累积：即使没有重大宕机，配置、支持或数据更新不及时等小问题也会侵蚀信任。买方看重的正是少出意外，因此这些摩擦不容轻视。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
      - number: '7.2'
        title: 市场竞争与生态依赖风险
        blocks:
          - type: paragraph
            body: >-
              最重要的非运营风险是竞争。Vanta 仍是规模更大的老牌厂商，第三方对比资料也持续将 Drata 视为挑战者，给定价、功能广度和买方认知带来压力。Drata
              还依赖自己无法控制的云、身份和设备信任系统；外部供应商宕机或 API 变更可能直接造成产品故障。竞争与依赖风险彼此叠加，可能迫使 Drata
              增加投入，才能维持简洁的使用体验。平台越大，依赖环节出错就越可能演变为产品问题，而不只是后台细节。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 缓解举措与逻辑证伪点
        blocks:
          - type: paragraph
            body: >-
              缓解风险的方向明确，但做起来并不容易：加深集成、保持信任中心内容更新、提升支持响应速度，并证明 AI
              不只会总结问题，也确实能减少工作量。如果实施成本过高、定价仍不透明，或竞品凭更简单的采购体验压价，投资逻辑就会受损。核心风险不是公司突然失败，而是逐渐失去品类领先地位。Drata
              需要把产品可靠性、清晰的定价和可见的客户成效结合起来，持续让复杂工作比替代方案更容易处理。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              看多 Drata
              的理由是客户规模大、产品已扩展到信任管理，收入规模似乎也有一定分量。看空理由同样明确：公司没有公开评估经营效率所需的数据，最后一次完整公开的估值也已过时。估值的关键不是公司有没有价值，而是在没有最新数据室信息时，当前价格是否合理。业务看起来有韧性，值得跟踪；但披露不足以支撑坚定判断。规模与信息披露之间的落差，正是投资判断的核心难题。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: 可比标的与估值参照
        blocks:
          - type: paragraph
            body: >-
              Drata 没有完全匹配的上市 SaaS 可比公司；更合适的参照是结合私募市场估算、竞品规模和历史估值。现有资料将 Drata 描述为高速增长的挑战者：累计融资约 $328M，2025 年收入达到
              $100M，此后未再公开更新利润率和当前估值。因此，最近一次可见价格更像历史参照，而非实时市场信号。上市可比公司能提供背景，却无法消除当前私募估值的不确定性；更多公开信息或许能收窄区间，但不能完全解决问题。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
      - number: '8.3'
        title: 情景推演与投资决策
        blocks:
          - type: paragraph
            body: >-
              基准情景是 Drata
              继续成为有价值的私营平台，并靠信任管理扩张和国际增长打开上行空间。悲观情景是价格和实施压力拖累增长，公司也始终未能公开足够数据，解释使用规模如何转化为经营收益。综合现有证据，宜维持“继续研究”：业务值得跟踪，但披露不足以支撑清晰的投资判断。估值上应审慎等待，而非直接否定；下一轮融资或更完整的数据室可能改变判断。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV012
