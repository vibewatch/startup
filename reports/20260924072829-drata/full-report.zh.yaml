      - number: '3.2'
        title: 产品能力与定价模式
        blocks:
          - type: paragraph
            body: >-
              竞争不只看合规框架覆盖，还看集成、信任中心的对外展示、定价透明度和实施支持。Vanta 对外强调覆盖广、适合企业客户；Drata 则突出信任管理与
              SafeBase。对比资料一再指出，多数价格仍按客户商谈，不公开标价，采购因此往往要经过销售流程，难以自助完成。买方付费买的不只是功能，也是在减少运营摩擦。采购更像运营决策，而不只是软件比选。
