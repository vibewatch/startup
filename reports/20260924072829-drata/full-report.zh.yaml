        title: 领导层与融资历程
        blocks:
          - type: paragraph
            body: >-
              Adam Markowitz、Troy Markowitz 和 Daniel Marashlian 始终是最常与 Drata 联系在一起的创始人，Adam Markowitz 现任
              CEO。融资历程也很清楚：公司完成 Series A，Series B 后跻身独角兽行列，Series C 又将估值翻倍至 $2B。2025
              年后续融资的具体结构并未公开。治理尽调的重点因此不是创始人是谁，而是最新一轮私募融资可能转移了多少经济控制权。
