              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品格局
        blocks:
          - type: paragraph
            body: >-
              这个赛道没有一组边界清晰的直接同类。Vanta 是明显更大的老牌厂商；Secureframe、Scrut 和新一批 AI 原生厂商则说明竞争仍在分化。买方也会把传统 GRC
              与信任中心流程纳入比较，因为他们更关心工具能省下多少人工，而非功能清单有多相似。竞争一看工作流是否合用，二看采购是否简单。配置越省事，挑战者即使功能没有明显优势，也越容易吸引买方注意。
