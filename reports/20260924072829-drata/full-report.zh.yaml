      - number: '1.3'
        title: 关键里程碑与核心疑点
        blocks:
          - type: paragraph
            body: >-
              Drata 从创立到品类领先的扩张很快：创始人带队起步、迅速融资、客户增长，并将产品扩展到 SafeBase 和 AI
              辅助工作流。尽调的悬念不在于公司是否做大——答案显然是肯定的，而在于增长能转化为多少持久的经济回报。公司尚未公开
              ARR、利润率、留存率或最新融资条款，因而无法据此作出精准投资判断。上一次公开估值已久，现更适合作为历史参照，而非当前市场定价；客户和合作伙伴的故事也比经营数据更充分。下一步应确认 2025
              年融资是否改变了公开记录未能反映的股权或经济条款。相比再增加一条公开营销主张，更新的数据室更能消除这部分不确定性。
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO011
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Drata 属于更广泛 GRC
              技术栈中的合规自动化领域，但实际采购范围不止一个软件品类。买方会把它与电子表格、审计师主导的流程，以及将信任中心、供应商风险和问卷自动化纳入同一预算的相邻厂商比较。现有来源不足以支持一个精确的市场支出数字；更稳妥的做法是界定核心市场及其相邻领域，而不是硬凑一个看似精确的
              TAM 市场规模说法。随着客户要求单个平台覆盖更多信任工作，市场边界也在外扩。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
