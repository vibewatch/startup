      - number: '4.2'
        title: 单元经济与经营效率
        blocks:
          - type: paragraph
            body: >-
              现有证据显示收入规模不小，但不足以测算真实获客成本或利润率。GetLatka 和 Sacra 的估算合起来指向：Drata 2025 年收入接近或超过 $100M；但公司未披露毛利率、NRR
              和烧钱速度，无法完整评估单位经济。业务可能已具相当规模，投资者仍缺少判断经营效率所需的数据。因此，这是一家规模可观、运营表现尚缺完整验证的公司，而不是财务状况已充分摸清的标的。
