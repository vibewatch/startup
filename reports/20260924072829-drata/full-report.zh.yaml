      - number: '5.2'
        title: 技术架构与外部依赖
        blocks:
          - type: paragraph
            body: >-
              Drata
              更像架在客户现有系统之上的工作流层，而非底层基础设施平台。因此，集成、证据连接器和告警构成核心价值链路。官方文档与伙伴页面显示，产品覆盖安全、设备信任、供应商风险和支持工作流，集成深度也就成了产品壁垒的一部分。可靠性不取决于厂商宣称的内部基础设施指标，而取决于客户技术栈变化时，外部集成能否持续运转。客户已有记录系统的部分做得轻；能靠工作流协同创造价值的部分，则做得更深。
            claimRefs:
              - CE005
