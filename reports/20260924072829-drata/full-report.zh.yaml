chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与规模定位
        blocks:
          - type: paragraph
            body: >-
              Drata 将自己定位为优秀企业之间的信任层，如今主打智能体信任管理平台，不再只是单一用途的 SOC 2 工具。公司称服务全球 8,500+ 家客户，拥有 1,300+ 家联盟伙伴，提供 250+
              种集成。公开资料显示，产品已从合规自动化切入，扩展到信任中心、AI 辅助问卷和更广泛的 GRC 工作流。这让 Drata 更像多产品信任平台，而不是单功能合规工具。
