      - number: '6.2'
        title: 客户标杆与增购逻辑
        blocks:
          - type: paragraph
            body: >-
              最有力的公开证据来自具名客户案例和伙伴视角。Brex、Clari 与 Ecosystems 案例都显示，企业希望加快安全审查、改善对外信任展示并让合规工作更可预测时，会使用
              Drata。这证明产品确有实际使用，但不能说明客户部署后合同有多牢固。案例也显示，产品已从静态合规清单延伸到日常商业和运营流程。不过，现有证据仍是定性案例，没有队列留存数据；它们有助于说明产品用途，却不能量化客户黏性。
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: 集中度与留存盲区
        blocks:
          - type: paragraph
            body: >-
              留存和客户集中度仍是关键问题。Drata 未公开
              NRR、GRR、流失率或头部客户集中度，客户情况因此尚不完整。现有迹象显示，公司可能在老客户中继续扩张，但证据更能说明客户覆盖面，无法证明留存持久。客户名单背后的续约质量，决定广泛采用能否转化为长期收入。在拿到相关数据前，集中度仍是重要的尽调盲点。知名客户
              Logo 值得关注，但尽调才刚开始。
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
