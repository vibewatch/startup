        title: 收入模式
        blocks:
          - type: paragraph
            body: >-
              Drata 的收入模式不复杂：按公司规模和框架范围销售年度 SaaS 订阅，再靠 Trust Center
              与风险模块增收。第三方估算显示，客户增加框架、集成和信任中心功能后，定价也会提高。不过，实际成交价、折扣和续约提价幅度都未公开。订阅模式可信，但现有信息还不足以从基本经营数据判断收入质量。公司看起来已能规模化变现，披露透明度却不足以让投资者有把握地定价。
