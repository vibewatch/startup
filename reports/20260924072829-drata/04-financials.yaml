schemaVersion: report-v2
artifact: financials
slug: drata
runDate: '2026-09-24'
company:
  name: Drata
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Drata appears to generate substantial SaaS revenue, but the exact margin profile, retention rate, and current financing terms remain opaque enough to block precise underwriting.
sections:
  - id: revenue-model
    title: "Revenue Model"
    body: >-
      Drata's revenue model is straightforward at a high level: annual SaaS subscriptions sold by company size and framework scope, with add-on value from Trust Center and risk-related modules. Public third-party estimates suggest that pricing rises as customers add frameworks, integrations, and trust-center functionality. The result is a classic subscription business, but one where actual realized price, discounting, and renewal uplift are still not public. That leaves the commercial story believable, but not yet precise enough to model revenue quality from first principles.
      Put differently, the company looks monetized enough to scale, but not transparent enough to price with confidence.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: economics-and-efficiency
    title: "Economics and Efficiency"
    body: >-
      The available evidence points to healthy top-line scale, but it does not provide enough detail to calculate a real customer-acquisition or margin model. GetLatka and Sacra together imply a 2025 revenue base close to or above $100M, while the absence of gross-margin, NRR, and burn disclosures prevents a full unit-economics view. In other words, the business may be large, but the investment case still lacks the operating data needed to judge efficiency precisely.
      That makes this a scale story with incomplete operating proof rather than a fully underwritten financial profile.
    claimRefs: [CI005, CI006, CI007, CI011]
    tableRefs: [TI003]
  - id: capital-and-blockers
    title: "Capital and Blockers"
    body: >-
      Drata has raised enough capital to support multi-year scaling, yet the last fully public valuation reference is still $2B from 2022. The company therefore looks well-capitalized but not fully transparent. The main blocker is not cash survival; it is the absence of public information on current ARR, gross margin, burn, and the terms of the latest private financing, all of which matter more for valuation than the historical round history itself. Until those gaps close, any price judgment is necessarily a range rather than a point estimate, and the market signal is more about history than current marks. In other words, the balance sheet looks supportive, but the public diligence package still trails the business itself.
      That is enough to keep the company interesting, but not enough to make the valuation easy.
    claimRefs: [CI008, CI009, CI010, CI012]
tables:
  - id: TI001
    title: "Revenue streams table"
    columns: [stream, mechanism, unit, current value/status, quality, diligence ask]
    rows:
      - [Annual subscriptions, 'Core software access by company size and framework scope', 'annual contract', 'Primary revenue stream', 'High', 'What is the realized ASP by segment?']
      - [Trust Center / SafeBase, 'Add-on external trust workflow and customer assurance layer', 'module add-on', 'Higher-value expansion module', 'Medium', 'How much of bookings comes from this module?']
      - [Risk management / VRM, 'Expanded workflow for risk and vendor management', 'module add-on', 'Growing but not quantified', 'Medium', 'Is this bundled or separately priced?']
      - [Services / implementation, 'Onboarding and support may be bundled in some deals', 'project / services', 'Not publicly disclosed', 'Low', 'How material is services revenue?']
    notes: Revenue mix is inferred from public positioning and comparison pages; the table does not imply GAAP segment reporting.
    claimRefs: [CI001, CI002, CI004, CI009]
  - id: TI002
    title: "Pricing / monetization table"
    columns: [price/unit/contract, list vs realized pricing, discounts/unknowns, source]
    rows:
      - ['Custom quote by company size', 'No public list price', 'Exact discounting not public', 'Drata and comparison pages']
      - ['Framework-based pricing', 'No public list price', 'Price scales with scope', 'Sacra / comparison pages']
      - ['Trust Center add-on', 'Often bundled at higher tiers', 'Incremental pricing not public', 'Comparisons and customer stories']
      - ['AI / questionnaire workflow', 'Packaging still changing', 'Renewal uplift unknown', 'Official product marketing']
    notes: This table is intentionally coarse because the vendors in this category do not publish durable list pricing.
    claimRefs: [CI001, CI002, CI004, CI009]
  - id: TI003
    title: "Unit economics table"
    columns: [metric, value/null, confidence, why it matters, diligence ask]
    rows:
      - [ARR, '≈$98M (2025 estimate)', medium, 'Sets the scale of the revenue base', 'Confirm actual 2026 run-rate']
      - [Revenue, '$100M (2025 estimate)', medium, 'Indicates monetization scale', 'Request revenue bridge']
      - [Gross margin, null, low, 'Needed for valuation and operating leverage', 'Request margin schedule']
      - [NRR, null, low, 'Needed for retention and expansion quality', 'Request cohort retention']
      - [Burn / runway, null, low, 'Needed for financing dependency assessment', 'Request cash-flow summary']
    notes: Null cells mean the reviewed public corpus did not support a reliable number.
    claimRefs: [CI005, CI006, CI007, CI011, CI012]
figures:
  - id: FI001
    title: "Revenue model bridge"
    type: flow
    summary: >-
      Drata monetizes annual subscriptions that expand via frameworks and add-on modules, but the exact realized price and margin bridge remain hidden.
    data:
