          detail: Enterprise-trust need or compliance deadline creates demand
          tone: positive
        - id: base
          label: Base subscription
          detail: Annual SaaS contract keyed to company size and framework scope
          tone: positive
        - id: addons
          label: Add-on modules
          detail: Trust Center, SafeBase, risk, and questionnaire workflows
