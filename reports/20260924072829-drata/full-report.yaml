        title: Leadership and Financing
        blocks:
          - type: paragraph
            body: >-
              The founding team remains central to the company narrative: Adam Markowitz, Troy Markowitz, and Daniel
              Marashlian are still the names most consistently attached to the company, and Adam Markowitz is the CEO.
              The financing arc is also clear. Drata completed a Series A, then a Series B that pushed it into unicorn
              territory, and then a Series C that doubled valuation to $2B. What is not public is the precise structure
              of the more recent 2025 financing activity. The governance question is therefore not who built the
              company, but how much economic control the latest private round may have shifted.
