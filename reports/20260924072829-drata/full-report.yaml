      - number: '7.3'
        title: Mitigations and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              The mitigants are straightforward but not trivial: deepen integrations, keep the trust center current,
              improve support response, and prove that the AI layer does not just summarize issues but actually reduces
              work. The thesis breaks if the product becomes too expensive to implement, too opaque to price, or too
              easy for competitors to undercut with a simpler buyer experience. In that sense, the risk profile is less
              about existential failure and more about gradual erosion of category leadership. A stronger answer would
              pair product reliability with clearer pricing discipline and visible customer outcomes. In short, the
              company has to keep making the hard thing feel simpler than the alternatives.
            claimRefs:
