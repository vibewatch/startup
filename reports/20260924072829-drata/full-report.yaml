      - number: '7.2'
        title: Market and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              The most important non-operational risk is competitive pressure. Vanta remains the larger incumbent, and
              comparison pages consistently frame Drata as the challenger. That creates pressure on pricing, feature
              breadth, and buyer perception. At the same time, Drata's own product depends on cloud, identity, and
              device-trust systems that it does not control, so external vendor outages or API changes can become
              internal product problems. In practice, the market risk and the dependency risk reinforce each other
              because both can force Drata to spend more just to keep the experience simple. The more the platform
              scales, the more any dependency mistake becomes a product problem rather than a background detail.
            claimRefs:
              - CR005
