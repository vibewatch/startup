      - number: '2.2'
        title: Sizing and Segmentation
        blocks:
          - type: paragraph
            body: >-
              The evidence base points to a fast-growing but still opaque market. Sacra's 2025 ARR estimate and Drata's
              own growth claims imply meaningful scale, while third-party comparison pages show that buyers evaluate
              tools by company size, framework coverage, and implementation burden. The best-supported segmentation is
              not by industry alone but by compliance urgency: high-growth SaaS, regulated fintech, and
              security-conscious scale-ups buy first, then larger enterprises adopt when trust and vendor-risk processes
              become revenue-critical. That pattern suggests the category is expanding because more teams are treating
              trust operations as an infrastructure layer rather than an occasional project. The upside is broader
              budget access; the downside is that each new workflow adds implementation expectations and more
              implementation lift.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM007
              - CM009
      - number: '2.3'
        title: Drivers and Constraints
        blocks:
          - type: paragraph
            body: >-
              Regulatory complexity is the strongest structural driver: SOC 2 and ISO 27001 are baseline expectations,
              and DORA, GDPR, and AI-governance requirements keep widening the workload. The main constraints are just
              as clear: price opacity, migration friction, and the need to prove real-time control coverage rather than
              point-in-time checklists. In practice, that means market growth is less about awareness and more about
              reducing the buyer's fear of paying for a tool they cannot quickly operationalize. Buyers increasingly
              want a platform that can absorb adjacent work without forcing a separate trust-program rebuild.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
