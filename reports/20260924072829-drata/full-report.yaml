              - CV011
      - number: '8.3'
        title: Scenarios and Decision
        blocks:
          - type: paragraph
            body: >-
              A reasonable base case is that Drata remains a valuable private platform with upside from trust-management
              expansion and international growth. A bear case is that pricing and implementation pressure compress
              growth and the company never fully closes the gap between usage scale and disclosed economics. On the
              evidence available here, that makes the correct stance research-more: the business is interesting enough
              to follow, but not transparent enough to underwrite cleanly. The valuation posture is therefore a
              disciplined wait, not a negative verdict. That is the right call until the next financing or a fuller data
              room changes the picture.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
