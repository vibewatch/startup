        title: Trust, Safety, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Trust, safety, and compliance are central rather than peripheral. Drata's messaging repeatedly emphasizes
              continuous assurance, customer-facing trust surfaces, and AI-assisted questionnaire handling, while
              customer stories show value only once the platform is wired into actual audit and sales workflows. That
              means roadmap claims matter, but they are less important than evidence that the current stack works
              reliably in production. A credible roadmap here is mostly about reducing friction, improving connector
              depth, and making the trust layer feel operational rather than aspirational. The most meaningful future
              claims will be the ones that reduce human handoffs rather than just add new labels.
            claimRefs:
