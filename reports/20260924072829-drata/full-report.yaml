  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Peer Landscape
        blocks:
          - type: paragraph
            body: >-
              The direct set is not a single clean peer group. Vanta is the obvious larger incumbent, while Secureframe,
              Scrut, and newer AI-first vendors show that the category is still fragmenting. In the buyer's mind, the
              comparison also includes older GRC and trust-center workflows because many teams evaluate tools by how
              much manual work they remove rather than by how closely they match a feature checklist. That means the
              real competition is partly about workflow fit and partly about whether the vendor can make the buying
              motion feel simple. The simpler the setup, the easier it is for a challenger to steal attention even
              without a dramatically better feature set.
