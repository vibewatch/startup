  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              Drata does not appear to face a single headline legal or regulatory crisis in the reviewed corpus, but the
              operational risk profile is still meaningful. The product relies on many customer integrations, external
              systems, and workflow setup, so any breakage can interrupt the promise of continuous assurance. Review
              pages and help articles also show that customers notice navigation friction, reporting issues, and support
              responsiveness, which matters because trust software has to work cleanly to remain believable. The risk is
              cumulative: small issues in setup, support, or data freshness can erode the trust story even without a
              major outage. Small frictions here matter because trust software is judged by the absence of surprises.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
