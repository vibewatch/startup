        title: Customer Mix
        blocks:
          - type: paragraph
            body: >-
              Drata's customer base is clearly broader than a single vertical. Public materials point to startups,
              fintechs, and enterprise trust teams, with named logos and partner stories spanning infrastructure,
              finance, and SaaS. The company also uses customer count and partner count as a central marketing signal,
              which is a sign that adoption itself is part of the product moat. The breadth matters because it suggests
              the product is being sold as a trust layer that can travel across segments rather than a one-off tool for
              a narrow compliance niche. A wide customer mix also makes it harder for any single vertical slowdown to
              define the whole story. It also hints that the product may be useful in more than one buying motion.
