  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface
        blocks:
          - type: paragraph
            body: >-
              Drata is no longer just a SOC 2 checklist product. The public surface now includes continuous compliance,
              Trust Center, risk management, AI-assisted questionnaire work, and partner-driven device or identity
              integrations. The product story is therefore broader and more enterprise-like, but it still depends on
              customers wiring the platform into their stack before the automation becomes valuable. That dependency is
              a feature and a risk at the same time: once embedded, the product can be sticky, but implementation
              expectations rise with every added module. That also helps explain why the public story keeps emphasizing
              trust outcomes rather than raw feature counts.
