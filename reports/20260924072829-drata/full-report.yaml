        title: Concentration and Gaps
        blocks:
          - type: paragraph
            body: >-
              The key unanswered questions are retention and concentration. Drata does not publicly disclose NRR, GRR,
              churn, or top-customer concentration, so the customer story is still incomplete. The business looks like
              it can expand inside accounts, but the evidence base remains better at showing breadth than durability.
              That gap matters because the renewal quality behind the customer list is what determines whether broad
              adoption turns into long-lived revenue. Until that math appears, concentration remains a material blind
              spot rather than a solved question. Public logos are useful, but they are only the start of the diligence
              story.
