      - number: '3.2'
        title: Capability and Pricing
        blocks:
          - type: paragraph
            body: >-
              The main competitive axis is not just framework coverage but the combination of integrations, trust-center
              exposure, pricing transparency, and implementation support. Vanta's public positioning emphasizes breadth
              and enterprise readiness; Drata's own materials emphasize trust management and SafeBase. Comparison pages
              repeatedly note that price is still negotiated rather than published, so procurement often becomes a live
              sales process rather than a simple self-serve decision. In that environment, buyers are effectively paying
              for reduced operational friction as much as for a feature set. That makes procurement feel closer to an
              operating decision than a pure software comparison.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
