    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Scale
        blocks:
          - type: paragraph
            body: >-
              Drata presents itself as the trust layer between great companies and now markets an agentic trust
              management platform rather than a single-purpose SOC 2 tool. The company says it serves 8,500+ global
              customers, has 1,300+ alliance partners, and offers 250+ integrations. Public materials also show a shift
              toward trust centers, AI-assisted questionnaires, and broader GRC workflows, which supports a larger
              platform story than the original compliance-automation wedge. That broader story matters because it makes
              Drata look more like a multi-product trust platform than a one-feature compliance utility.
