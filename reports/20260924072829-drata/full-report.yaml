      - number: '1.3'
        title: Milestones and Open Questions
        blocks:
          - type: paragraph
            body: >-
              Drata's visible milestones show a fast transition from launch to category leadership: founder-led launch,
              rapid fundraising, a scaling customer base, and a product expansion into SafeBase and AI-assisted
              workflows. The unanswered diligence issue is not whether the company has scaled; it clearly has. The open
              question is how much of that growth now converts into durable economics, because the company still does
              not publicly disclose ARR, margin, retention, or the latest financing terms in a way that would support
              precise underwriting. That matters because the last visible valuation is already old enough to be a
              reference point rather than a live market mark, and because the customer and partner story is stronger
              than the operating-data story. The practical diligence ask is therefore simple: confirm whether the 2025
              financing changed ownership or economics in a way that the public record cannot show. A refreshed data
              room would narrow that uncertainty more than any additional public marketing claim.
            claimRefs:
              - CO004
              - CO009
              - CO010
              - CO011
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Drata belongs in the compliance-automation slice of the broader GRC stack, but the practical buying
              boundary is wider than a software category label. Buyers compare it against manual spreadsheets,
              auditor-managed process, and adjacent compliance vendors that package trust centers, vendor-risk
              workflows, and questionnaire automation into the same budget conversation. The sources do not support a
              single neat spend number, so the right framing is a constrained market definition with adjacent edges
              rather than a false-precision TAM claim. In practice, the boundary keeps moving outward as customers ask
              one platform to cover more of the trust workflow.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
