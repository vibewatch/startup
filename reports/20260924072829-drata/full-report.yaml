      - number: '5.2'
        title: Architecture and Dependencies
        blocks:
          - type: paragraph
            body: >-
              The technology model is best thought of as a workflow layer above customer systems rather than a deep
              infrastructure platform. That makes integrations, evidence connectors, and alerting the core value path.
              Official docs and partner pages show the product sitting across security, device trust, vendor-risk, and
              support workflows, which makes implementation depth a key part of the product moat. It also means
              reliability is less about internal infrastructure claims and more about whether the surrounding
              integrations keep working as the customer's stack changes. In other words, the architecture is
              intentionally thin where the customer already has systems of record and thick where workflow coordination
              creates value.
