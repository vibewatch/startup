      - number: '4.3'
        title: Capital and Blockers
        blocks:
          - type: paragraph
            body: >-
              Drata has raised enough capital to support multi-year scaling, yet the last fully public valuation
              reference is still $2B from 2022. The company therefore looks well-capitalized but not fully transparent.
              The main blocker is not cash survival; it is the absence of public information on current ARR, gross
              margin, burn, and the terms of the latest private financing, all of which matter more for valuation than
              the historical round history itself. Until those gaps close, any price judgment is necessarily a range
              rather than a point estimate, and the market signal is more about history than current marks. In other
              words, the balance sheet looks supportive, but the public diligence package still trails the business
              itself. That is enough to keep the company interesting, but not enough to make the valuation easy.
