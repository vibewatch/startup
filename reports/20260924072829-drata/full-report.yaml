      - number: '3.3'
        title: Switching and Moat
        blocks:
          - type: paragraph
            body: >-
              The moat question is mostly about switching cost and ecosystem depth, not pure feature novelty. Once a
              company has populated evidence workflows, auditor touchpoints, trust-center pages, and partner
              integrations, it has real friction to change vendors. That helps Drata, but it also means competitors can
              win by making the first implementation easier or the public trust surface cheaper. The result is a
              category with meaningful lock-in but still active commoditization pressure. In practice, the moat is
              strongest when the customer treats Drata as operating infrastructure rather than a one-time compliance
              purchase. If Drata keeps reducing manual steps inside that operating layer, the moat strengthens even when
              rival feature lists look similar. If it does not, price and simplicity pressure will keep the category
              fluid.
