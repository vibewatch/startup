  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Antithesis
        blocks:
          - type: paragraph
            body: >-
              The bullish case is clear: Drata has scaled to a large customer base, broadened the product into trust
              management, and appears to have material revenue. The bearish case is equally clear: the company does not
              publicly disclose the operating metrics needed to judge efficiency, and the last fully public valuation
              reference is now stale. That means the valuation question is less about whether the company matters and
              more about whether the current price is still justified without a current data room. In other words, the
              business looks durable enough to merit attention, but not transparent enough to justify a sharp conviction
              without more disclosure. The gap between scale and disclosure is the whole investment problem here.
            claimRefs:
              - CV001
