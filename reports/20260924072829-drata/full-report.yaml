      - number: '8.2'
        title: Comparables and Context
        blocks:
          - type: paragraph
            body: >-
              The best comparable frame is not a clean public SaaS peer but a mix of private market estimates,
              competitor scale, and valuation history. Sources in the corpus point to Drata as a high-growth challenger
              that has raised roughly $328M, reached $100M revenue in 2025, and then stopped updating the public market
              on margins and current valuation. That combination makes the last visible price look more like a reference
              point than a live market signal. Public comparables are therefore useful for context, but they do not
              collapse the uncertainty around the current private mark. The extra public signals mostly refine the
              range; they do not eliminate it.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
