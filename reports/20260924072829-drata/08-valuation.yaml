          detail: No public gross margin, NRR, or burn data
          tone: warning
        - id: decision
          label: Decision
          detail: Research-more until a data room narrows the range
          tone: neutral
    claimRefs: [CV001, CV002, CV003, CV004, CV008, CV009, CV012]
