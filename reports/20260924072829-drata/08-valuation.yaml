schemaVersion: report-v2
artifact: valuation
slug: drata
runDate: '2026-09-24'
company:
  name: Drata
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Drata still looks like a category leader, but the stale $2B valuation reference, opaque operating metrics, and ongoing competitor pressure keep the recommendation at research-more rather than buy.
sections:
  - id: thesis-and-antithesis
    title: "Thesis and Antithesis"
    body: >-
      The bullish case is clear: Drata has scaled to a large customer base, broadened the product into trust management, and appears to have material revenue. The bearish case is equally clear: the company does not publicly disclose the operating metrics needed to judge efficiency, and the last fully public valuation reference is now stale. That means the valuation question is less about whether the company matters and more about whether the current price is still justified without a current data room. In other words, the business looks durable enough to merit attention, but not transparent enough to justify a sharp conviction without more disclosure. The gap between scale and disclosure is the whole investment problem here.
    claimRefs: [CV001, CV002, CV003, CV008]
    tableRefs: [TV001, TV002]

  - id: comps-and-context
    title: "Comparables and Context"
    body: >-
      The best comparable frame is not a clean public SaaS peer but a mix of private market estimates, competitor scale, and valuation history. Sources in the corpus point to Drata as a high-growth challenger that has raised roughly $328M, reached $100M revenue in 2025, and then stopped updating the public market on margins and current valuation. That combination makes the last visible price look more like a reference point than a live market signal. Public comparables are therefore useful for context, but they do not collapse the uncertainty around the current private mark. The extra public signals mostly refine the range; they do not eliminate it.
    claimRefs: [CV004, CV005, CV006, CV007]
    tableRefs: [TV003]
  - id: scenarios-and-decision
    title: "Scenarios and Decision"
    body: >-
      A reasonable base case is that Drata remains a valuable private platform with upside from trust-management expansion and international growth. A bear case is that pricing and implementation pressure compress growth and the company never fully closes the gap between usage scale and disclosed economics. On the evidence available here, that makes the correct stance research-more: the business is interesting enough to follow, but not transparent enough to underwrite cleanly. The valuation posture is therefore a disciplined wait, not a negative verdict. That is the right call until the next financing or a fuller data room changes the picture.
    claimRefs: [CV009, CV010, CV011, CV012]
    figureRefs: [FV001]

tables:
  - id: TV001
    title: "Recommendation summary table"
    columns: [recommendation, confidence, risk rating, valuation stance, decision implication]
    rows:
      - [research-more, medium, medium, unknown, 'Hold until a data room clarifies unit economics']
      - [buy, low, high, fair, 'Would require better public margin and retention proof']
      - [avoid, low, critical, expensive, 'Would fit only if price rose without new proof']
    notes: This summary is deliberately conservative because the public corpus does not support a precise discounted-cash-flow style answer.
    claimRefs: [CV001, CV008, CV009, CV012]
  - id: TV002
    title: "Thesis / anti-thesis table"
    columns: [argument, what would change the view]
    rows:
      - [Trust-management expansion broadens the TAM, 'If AI and trust-center modules are weak in production']
      - [Large customer scale supports category leadership, 'If customer count is mostly logo inflation or free-tier noise']
      - [Revenue appears large enough for a meaningful private franchise, 'If actual ARR or margin is much lower than estimates']
      - [The valuation is stale but not obviously broken, 'If the latest financing terms are punitive or highly dilutive']
    notes: The table keeps the thesis tied to evidence rather than to a static valuation multiple.
    claimRefs: [CV001, CV002, CV003, CV004]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns: [scenario, assumptions, valuation / return logic, key risks, probability signal]
    rows:
      - [Bull, 'Trust-management expansion lands; growth stays strong', 'A premium private valuation remains plausible', 'Competition and disclosure risk', 'Medium']
      - [Base, 'Large but opaque private SaaS business', 'Hold / follow rather than add', 'Metrics remain underdisclosed', 'High']
      - [Bear, 'Pricing and implementation pressure slow growth', 'Downward re-rating or flat private marks', 'Category commoditization', 'Medium']
    notes: Scenario ranges are qualitative because the public corpus does not support an exact current multiple.
    claimRefs: [CV001, CV004, CV005, CV006, CV008, CV011]
figures:
  - id: FV001
    title: "Recommendation logic"
    type: flow
    summary: >-
      Drata's scale and product expansion support a positive long-term view, but lack of current financial disclosure keeps the decision below a true buy.
    data:
