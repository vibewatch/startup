callouts:
  - calloutType: "risk"
    title: "Suite Encroachment and Non-Standalone Architecture"
    body: |
      Degreed's core market risk stems from its architectural positioning as a non-standalone platform. Independent analyst reviews emphasize that Degreed is routinely procured alongside, rather than instead of, an enterprise LMS due to its compliance tracking limitations (3.7/5.0). As core HCM suite vendors like Workday and SAP enhance their native skills matching, enterprises face pressure to consolidate software spend and eliminate third-party experience layers.
    claimRefs:
      - "CP007"
      - "CP010"
      - "CP013"
