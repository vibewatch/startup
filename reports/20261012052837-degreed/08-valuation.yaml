callouts:
  - calloutType: "recommendation"
    title: "Valuation Reset and Secondary Discipline"
    body: "Prospective secondary buyers or co-investors must not anchor on Degreed's historical $1.4B valuation. In today's normalized SaaS valuation climate, an estimated $100M ARR business growing at modest rates merits an enterprise value between $400M and $540M (4.0x–5.4x ARR). Entering at prior peak valuations creates severe downside vulnerability."
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV007"
  - calloutType: "risk"
    title: "Senior Liquidation Preference Overhang"
    body: "With over $437M in cumulative funding raised across twelve equity rounds and venture debt facilities, junior equity holders face substantial distribution risk in any exit below $500M unless senior preference terms are fully understood."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV005"
