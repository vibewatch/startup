chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding, and Core Mission
        blocks:
          - type: paragraph
            body: >-
              Founded in 2012 by David Blake and Eric Sharp, Degreed established itself as a category creator in
              corporate education with an explicit mission to 'jailbreak the degree' by tracking, curating, and
              recognizing all informal and formal learning that occurs beyond traditional academic institutions.
              Originally operating as the industry's pioneering learning experience platform (LXP), Degreed has since
              expanded its product scope beyond pure content aggregation into comprehensive workforce skills
              intelligence, capability academies, and automated learner development pathways. The company maintains its
              corporate headquarters in Pleasanton, California, while also operating significant administrative and
              operational presences in South Jordan and Salt Lake City, Utah, alongside distributed global hubs across
              New York, London, Amsterdam, and Brisbane. Degreed operates primarily as a late-stage private enterprise
              software-as-a-service (SaaS) vendor targeting large multinational employers seeking centralized talent
              transformation and internal mobility systems.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
