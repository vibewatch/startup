  - id: FE001
    title: Evidence-backed product architecture map
    type: stack
    summary: Six documented layers connect the employee experience to skills intelligence and enterprise data exchange.
    data:
      layers:
        - label: Employee experience
          detail: Central discovery, saved learning, pathways, nudges, and completion visibility.
          items:
            - label: Personalized learning hub
              detail: Role- and interest-oriented learning experience.
        - label: Learning orchestration
          detail: Aggregates internal and external learning resources into one discovery surface.
          items:
            - label: Catalog aggregation
              detail: Indexes provider titles and descriptions.
        - label: Skills intelligence
          detail: Custom taxonomies, proficiency rubrics, normalization, gap insight, and personalization.
          items:
            - label: Skills+ data layer
              detail: Connects fragmented skills signals to workforce planning.
        - label: Learning records
          detail: Required learning, completions, skills, and assessment data move between systems.
          items:
            - label: Completion and assessment signals
              detail: Provider activity can update the Degreed profile.
        - label: Integration methods
          detail: APIs, webhooks, and files connect HCM, LMS, and content-provider systems.
          items:
            - label: Named enterprise connectors
              detail: Documentation lists Workday, SAP SuccessFactors, Cornerstone, and content providers.
        - label: Identity and telemetry
          detail: SAML 2.0, OAuth 2.0, and xAPI support access and activity exchange.
          items:
            - label: Customer-managed configuration
              detail: Credentials, identifiers, settings, and administrators must align.
