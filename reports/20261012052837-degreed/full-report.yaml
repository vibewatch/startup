      - number: '5.2'
        title: Architecture, deployment, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The documented operating model is an orchestration layer rather than a closed content repository.
              Degreed's integration documentation separates user data, content catalogs, required learning, completion
              data, and skills or assessment signals, with connectors using APIs, webhooks, files, SAML 2.0, OAuth 2.0,
              and xAPI. Named integrations include enterprise learning and HCM systems plus major content providers.
              Microsoft's implementation guide shows the deployment burden behind the product promise: customers need
              active licenses, administrators in both systems, provisioned API credentials, aligned identity fields, and
              Degreed-side settings or support. This makes interoperability credible and technically inspectable, while
              also making data quality, identity mapping, third-party API stability, and implementation coordination
              material dependencies. The public developer documentation is meaningful developer signal, but the
              allocated evidence contains no public repository, release cadence, package usage, or
              practitioner-community activity from which to assess engineering velocity.
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
              - CE014
              - CE015
              - CE016
