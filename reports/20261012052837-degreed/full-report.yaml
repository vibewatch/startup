  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Functional Scope, and Ecosystem Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The corporate learning technology market has evolved beyond administrative course tracking toward
              continuous, learner-centric capability development. Degreed established the learning experience platform
              (LXP) category to address the functional rigidities of traditional learning management systems (LMS),
              which primarily manage mandatory compliance training and administrative records. While legacy LMS
              platforms enforce top-down course completions, LXPs serve as an employee-facing discovery layer that
              aggregates diverse content libraries from third-party providers such as Coursera, edX, LinkedIn Learning,
              and DataCamp alongside internal enterprise resources. Over recent product cycles, the competitive boundary
              has extended into workforce skills intelligence. Through products like Skills+, organizations attempt to
              transform unstructured skill assertions into standardized enterprise taxonomies, mapping employee
              capabilities directly to internal mobility and corporate transformation goals.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
      - number: '2.2'
        title: Addressable Market Sizing, Sizing Tiers, and Adoption Horizons
        blocks:
          - type: paragraph
            body: >-
              Evaluating the enterprise addressable market requires decoupling total corporate training expenditures
              from specialized enterprise software subscriptions. Macro corporate training spend exceeds $350 billion
              annually across global enterprises, but the vast majority of this capital is allocated to internal
              instructor payroll, physical facilities, consulting fees, and third-party content creation. The dedicated
              enterprise digital learning and LXP software subscription market represents a more focused addressable
              segment estimated between $1.5 billion and $2.5 billion. Within this addressable envelope, Degreed has
              demonstrated substantial commercial reach, reporting over 6 million registered learners across nearly 300
              global enterprise organizations. However, addressable market expansion faces ceiling constraints as core
              human capital management (HCM) platforms embed native learning interfaces and skill profiling directly
              into core enterprise employee suites.
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM010
              - CM013
