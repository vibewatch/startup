      - number: '1.2'
        title: Executive Leadership, Governance Transitions, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Degreed's governance and executive suite have experienced pronounced leadership churn, punctuated by
              strategic disagreements regarding company trajectory. In June 2022, Degreed announced the acquisition of
              talent academy platform Learn In, accompanied by the dramatic return of co-founder David Blake as Chief
              Executive Officer. Blake had previously stepped down from active leadership of Degreed to found and lead
              Learn In. His return followed an amicable but decisive parting of ways with outgoing CEO Dan Levin, whose
              strategic direction diverged from Blake's long-term vision after a 15-month tenure. The leadership
              turnover underscored significant key-person dependence on Blake's founder narrative while signaling
              persistent friction in balancing operational scalability against product category expansion. The broader
              management team draws experienced enterprise software executives from institutions including Bank of
              America, Mastercard, Danone, LinkedIn, Adobe, SAP, and Saba, supported on the board and cap table by
              venture capital sponsors such as Owl Ventures, Riverwood Capital, and Sapphire Ventures.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capitalization History, Enterprise Adoption, and Commercial Opacity
        blocks:
          - type: paragraph
            body: >-
              From its initial seed and Series A financings in 2015, Degreed steadily capitalized its category
              expansion, culminating in an April 2021 Series D funding round that raised $155.5M at a $1.39B post-money
              valuation led by Riverwood Capital and Sapphire Ventures. Across its lifecycle, Degreed has raised
              approximately $338.3M to $367M in total equity financing across successive preferred series carrying 1.0x
              non-participating liquidation preferences and 8% non-cumulative dividend rates. Commercially, the company
              claims its platform has reached over 6 million learners across nearly 300 global customer organizations,
              including deployments with major enterprise accounts such as Cigna Healthcare, PepsiCo, Citi, Cisco,
              Airbnb, and BMO Financial Group. However, independent software evaluations indicate notable operational
              friction, citing heavy administrative overhead for skills taxonomy governance, integration complexity
              across fragmented human capital stacks, and a lack of public disclosure regarding net revenue retention,
              burn rate, and current post-2021 valuation resets.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
