    title: Product module and capability matrix
    columns:
      - Module or surface
      - Primary user or buyer
      - Evidence-backed maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Degreed Learning, "Employees; L&D administrators", "Marketed production LXP with named enterprise integrations", "Unifies internal and external learning with personalized pathways", "No module-level usage, retention, or outcome data"]
      - [Degreed Skills+, "CHRO; workforce planning; L&D", "Current marketed skills-intelligence product", "Customer-defined taxonomies, proficiency rubrics, and normalized skills data", "No public validation benchmark for inference or normalization accuracy"]
      - [Integration ecosystem, "Enterprise IT; implementation teams", "Detailed public documentation and named connectors", "Multiple data objects and API, webhook, and file methods", "No public implementation-time or connector-reliability benchmark"]
      - [AI-enabled experience, "Employees; learning and talent leaders", "Current positioning, with limited technical disclosure", "Skills inference and personalized learning are presented as embedded capabilities", "No model cards, bias tests, accuracy results, or human-oversight documentation"]
    notes: "Status reflects only the eight allocated public sources reviewed on 2026-10-12; marketing claims are not treated as independent performance verification."
    claimRefs: [CE001, CE003, CE004, CE005, CE009, CE012, CE013, CE014]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Prior workflow problem
      - Degreed-supported workflow
      - Publicly measurable benefit
      - Limitation
    rows:
      - ["Find learning across sources", "Content distributed across LMS and external providers", "Aggregate and index catalogs in a central discovery experience", "LinkedIn Learning catalog refreshes daily; new content is available within 24 hours", "The timing is specific to the documented LinkedIn integration"]
      - ["Access provider content", "Separate registration and sign-in flows", "Use SAML SSO between Degreed and LinkedIn Learning", null, "Requires centrally managed identity configuration and matching identifiers"]
      - ["Track learning activity", "Completions remain in provider systems", "Send activity through xAPI and register completions in Degreed", null, "Requires credentials, endpoint configuration, and settings enabled in both products"]
      - ["Plan skill development", "Fragmented skill names, scales, and profiles", "Normalize skills data and connect it to personalized learning", null, "No public accuracy, adoption, or business-outcome benchmark in the assigned evidence"]
    notes: "Null benefit cells mean the allocated sources describe a workflow but do not publish a quantified outcome; they do not mean that no benefit exists."
    claimRefs: [CE003, CE004, CE005, CE007, CE008, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Documented role
      - Key dependency
      - Principal underwriting risk
    rows:
      - ["Experience layer", "Central learning discovery, pathways, nudges, and employee hub", "Content coverage and employee engagement", "Relevance and adoption are not independently benchmarked"]
      - ["Skills intelligence", "Taxonomy customization, skills normalization, gap insight, and personalization", "Input quality, profile participation, and inference quality", "No public accuracy, bias, or drift testing"]
      - ["Integration and data exchange", "Moves user, catalog, required-learning, completion, skills, and assessment data", "Third-party APIs, webhooks, files, credentials, and mapping", "Connector failure or schema change can degrade freshness and completeness"]
      - ["Identity and reporting", "SAML SSO, OAuth-based credentials, and xAPI activity tracking", "Identifier alignment and coordinated customer/vendor administration", "Misconfiguration can block access or fragment completion records"]
    notes: "Architecture is reconstructed from Degreed and Microsoft integration documentation; it is not a full internal system diagram or security architecture."
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE009, CE015]
