  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、功能范围与生态相邻领域
        blocks:
          - type: paragraph
            body: >-
              企业学习技术市场已从行政式课程追踪转向持续的、以学习者为中心的能力发展。Degreed 创建 LXP 品类，是为了解决传统学习管理系统（LMS）的功能僵化；传统 LMS 主要管理强制合规培训和行政记录。传统
              LMS 自上而下推动课程完成，LXP 则面向员工，聚合 Coursera、edX、LinkedIn Learning 和 DataCamp
              等第三方供应商的多样内容库，以及企业内部资源。近几轮产品迭代中，竞争边界已延伸至劳动力技能智能。借助 Skills+
              等产品，企业试图把非结构化技能陈述转化为标准化企业分类，并将员工能力直接映射到内部流动和企业转型目标。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM012
