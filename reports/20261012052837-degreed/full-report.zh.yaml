figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示 2012 至 2026 年间的关键公司里程碑，包括创立、风险融资轮、领导层变动、并购及产品发布。
    data:
      items:
        - label: 公司创立
          date: '2012-01-01'
          detail: David Blake 和 Eric Sharp 在美国加州 Pleasanton 创立 Degreed，使命是“jailbreak the degree”。
          tone: positive
        - label: Series A 融资
          date: '2015-03-19'
          detail: Degreed 以每股 $0.61 融资 $6.88M，由 Signal Peak Ventures 和 GSV 领投，用于扩大初始 LXP 采用。
          tone: positive
        - label: Series B 融资
          date: '2016-08-16'
          detail: Degreed 完成 $25.65M 的 Series B 融资，每股价格 $2.28，用于加快企业市场渗透。
          tone: positive
        - label: Series C 扩张
          date: '2018-03-06'
          detail: 公司完成 $44.06M 的 Series C 融资，每股 $4.03，由 Owl Ventures 和 Jump Capital 领投。
          tone: positive
        - label: Series D 独角兽估值
          date: '2021-04-13'
          detail: Degreed 完成 $155.5M 的 Series D 融资，每股 $16.43，获得 $1.39B 投后估值，由 Riverwood 和 Sapphire 领投。
          tone: positive
        - label: Degreed Intelligence 发布
          date: '2021-12-02'
          detail: Degreed 与 Visier 合作推出 Degreed Intelligence，提供先进的劳动力技能数据可视化。
          tone: positive
        - label: 收购 Learn In 与 CEO 回归
          date: '2022-06-23'
          detail: Degreed 收购人才学院平台 Learn In；联合创始人 David Blake 回任 CEO，接替 Dan Levin。
          tone: warning
        - label: BT Group 技能部署
          date: '2024-01-15'
