      - CI002
      - CI003
      - CI008
      - CI011
  - id: FE001
    title: 有证据支持的产品架构图
    type: stack
    summary: 六个有文档记录的层级，将员工体验连接到技能智能与企业数据交换。
    data:
      layers:
        - label: 员工体验
          detail: 集中发现、保存学习内容、学习路径、提醒及完成情况可见性。
          items:
            - label: 个性化学习中心
              detail: 面向角色与兴趣的学习体验。
        - label: 学习编排
          detail: 将内部与外部学习资源聚合到一个发现界面。
          items:
            - label: 目录聚合
              detail: 为提供商的标题与描述建立索引。
        - label: 技能智能
          detail: 自定义分类、熟练度标准化、规范化、差距洞察与个性化。
          items:
            - label: Skills+ 数据层
              detail: 将分散的技能信号连接到劳动力规划。
        - label: 学习记录
          detail: 必修学习、完成情况、技能及评估数据在系统间流转。
          items:
            - label: 完成与评估信号
              detail: 提供商活动可以更新 Degreed 个人档案。
        - label: 集成方式
          detail: API、webhook 与文件连接 HCM、LMS 及内容提供商系统。
          items:
            - label: 指定企业连接器
              detail: 文档列出 Workday、SAP SuccessFactors、Cornerstone 及内容提供商。
        - label: 身份与遥测
          detail: SAML 2.0、OAuth 2.0 与 xAPI 支持访问及活动交换。
          items:
            - label: 客户管理的配置
              detail: 凭据、标识符、设置与管理员必须保持一致。
    approximationNotes: 这是根据公开文档整理的功能性证据图，不代表 Degreed 的内部部署拓扑。
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示企业从 L&D 内容聚合、初始试点，到全企业技能智能与内部人才流动扩张的旅程。
    approximationNotes: 该序列综合企业客户披露的标准企业入驻与采用路径，以及供应商集成文档。
    claimRefs:
      - CU011
      - CU012
      - CU013
    data:
      items:
        - label: 发现与内容摄取
          stage: 发现与内容摄取
          actor: 企业 L&D 与 IT
          action: Catalog existing LMS, internal assets, and third-party content libraries into unified hub
          touchpoints:
            - LMS 连接器
            - HRIS 身份同步
            - SSO 集成
        - label: 试点部署与角色映射
          stage: 试点部署与角色映射
          actor: 业务部门推动者
          action: Roll out initial learning pathways across targeted roles such as data analytics or managers
          touchpoints:
            - 策划学习路径
            - 初始技能档案
            - 管理者仪表盘
        - label: 企业激活与路径策划
          stage: 企业激活与路径策划
          actor: 全体员工与教学设计师
          action: Scale platform enterprise-wide with role-based curricula and mobile/on-demand access
          touchpoints:
            - Degreed 移动应用
            - 自助策划
            - 同事推荐
        - label: 自动化与日常参与
          stage: 自动化与日常参与
          actor: 学习者与 HR 管理员
          action: Trigger automated nudges, onboarding journeys, and completion reminders without IT code
          touchpoints:
            - Degreed Automations
            - 邮件提醒
            - 应用内通知
        - label: 技能智能与差距分析
          stage: 技能智能与差距分析
          actor: 人员分析与高管层
          action: Aggregate skill ratings and workforce capability data to identify organizational gaps
          touchpoints:
            - Degreed Skills+
            - 技能分类分析
            - 高管仪表盘
        - label: 人才学院与内部流动
          stage: 人才学院与内部流动
          actor: 首席学习官与业务领导者
          action: Expand into structured capability academies, tuition assistance, and experiential projects
          touchpoints:
            - Learn In 人才学院
            - 项目匹配
            - 体验式任务
