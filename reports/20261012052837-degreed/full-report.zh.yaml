      - number: '1.2'
        title: 高管领导、治理变动与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Degreed 的治理结构和高管团队经历了明显的领导层更迭，并伴随围绕公司方向的战略分歧。2022 年 6 月，公司宣布收购人才学院平台 Learn In，同时联合创始人 David Blake
              戏剧性回任首席执行官。Blake 此前已退出 Degreed 的日常领导岗位，转而创办并领导 Learn In。他回任前，卸任 CEO Dan Levin 在任 15 个月后与 Blake
              友好但明确地分道扬镳，双方的战略方向已偏离 Blake 的长期愿景。这次换帅凸显公司对 Blake 创始人叙事的关键人物依赖，也暴露出运营规模化与产品品类扩张之间持续存在的张力。更广泛的管理团队吸纳了来自
              Bank of America、Mastercard、Danone、LinkedIn、Adobe、SAP 和 Saba 的企业软件高管，董事会与股权结构表则有 Owl Ventures、Riverwood
              Capital 和 Sapphire Ventures 等风投机构支持。
