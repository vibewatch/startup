  - id: FI001
    title: Degreed 企业价值实现与收入转化流程
    type: flow
    summary: 展示从漏斗顶部的学习者获取，到企业合同变现、毛利率留存及资本配置的端到端流程。
    data:
      nodes:
        - id: learner-acquisition
          label: 漏斗顶部学习者参与
          description: 通过免费的 Degreed Personal 及企业推广完成学习者入驻
          tone: neutral
        - id: enterprise-contract
          label: 企业年度合同
          description: 核心 LXP 平台席位的多年期企业 SaaS 协议
          tone: positive
        - id: module-expansion
          label: Skills+ 与市场增购
          description: 来自分类基准测试及第三方内容交易的扩张收入
          tone: positive
        - id: gross-revenue
          label: 平台毛收入
          description: 合并后的企业 ARR 与交易佣金收入
          tone: positive
        - id: cogs-deduction
          label: 交付 COGS 与托管成本
          description: 云基础设施、技能数据处理及合作伙伴内容许可成本
          tone: risk
        - id: net-cash-flow
          label: 净贡献与经营现金流
          description: 可用于持续研发、企业销售及偿还债务的毛利润
          tone: neutral
