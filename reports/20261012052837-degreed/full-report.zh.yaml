      - number: '7.3'
        title: 合作伙伴依赖、客户集中度与资本悬置
        blocks:
          - type: paragraph
            body: >-
              Degreed 的商业模式依赖集中的企业客户结构，以及与外部企业平台的深度双向技术集成。技术画像分析显示，已追踪的 Degreed for Business 客户中有 67.86% 是员工超过 10,000
              人的全球企业；员工少于 100 人的小企业占活跃部署的 0%。这种在银行、保险和消费品大型跨国公司中的结构性集中，带来客户集中脆弱性和较长采购周期。对 Workday、SAP SuccessFactors 等主要
              HCM 供应商的集成依赖，构成运营故障的单点：任何 API 结构变化或合作伙伴市场政策调整，都会直接影响 Degreed 的核心数据同步和学习者认证流程。商业上，Degreed
              面临显著的财务和估值悬置。公司最近一次一级股权融资是在 2021 年 4 月，以 $155.47 million D 轮资本换取 $1.39 billion 投后估值。该轮在早期风投系列之前设立了 8.0%
              股息率的高级清算优先权。五年多没有披露一级融资、二级交易活动又很有限，如果公司在正常化倍数环境下寻求公开退出流动性或成长资本，就会面临估值重置风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR008
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
