chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立经过与核心使命
        blocks:
          - type: paragraph
            body: >-
              Degreed 由 David Blake 和 Eric Sharp 于 2012
              年创立，并以“打破学历束缚”为明确使命，在企业教育领域开创了一个品类：追踪、整理并认可传统学术机构之外发生的非正式与正式学习。公司最初作为行业先驱学习体验平台（LXP）运营，后来从单纯内容聚合扩展到全面的劳动力技能智能、能力学院和自动化学习者发展路径。公司总部仍在加州
              Pleasanton，同时在犹他州 South Jordan 和 Salt Lake City 设有重要行政与运营团队，并在 New York、London、Amsterdam 和 Brisbane
              设有分布式全球枢纽。Degreed 主要是一家后期私有 SaaS 企业软件供应商，面向寻求集中式人才转型与内部流动系统的大型跨国雇主。
