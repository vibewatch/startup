      - number: '2.4'
        title: 增长驱动、结构性约束与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              企业对技能优先劳动力架构的需求，受到技术快速颠覆、生成式 AI 跨岗位集成以及专业职能领域人才短缺的推动。此外，Degreed 遵守 SOC2、GDPR 和 TISAX
              等企业安全与数据隐私框架，为风险敏感型企业买方建立了必要的采购信任。尽管顺风因素明显，市场扩张仍受重大结构约束，其中首要问题是软件栈合理化：当现有 HCM
              供应商以边际成本提供集成学习模块时，企业采购团队会反复审视独立 LXP 许可。与此同时，缺少关于 Degreed 净留存率、客户集中度和席位流失的经审计公开指标，仍是评估长期收入耐久性的未解障碍。
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM011
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 套件整合对独立 LXP 的威胁
            body: Degreed 通过把外部和内部内容整理进灵活的员工门户，建立了 LXP 品类；但大型 HCM 和 LMS 套件供应商正越来越多地把技能智能和学习信息流捆绑进核心人力资本合同，对独立点解决方案施加定价压力。
            calloutType: insight
            claimRefs:
