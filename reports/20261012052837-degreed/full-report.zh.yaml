      - number: '2.3'
        title: 买方分层、预算归属与集成工作流
        blocks:
          - type: paragraph
            body: >-
              企业采购和学习体验软件预算分配，遵循不同于一般企业 IT
              基础设施的机构路径。主要经济买方和预算负责人是首席人力资源官（CHRO）、首席学习官（CLO）及企业学习与发展（L&D）高管，他们要解决劳动力再技能化和留存问题。最匹配的平台客户是拥有超过 10,000 名员工的
              Global 2000 企业；分散劳动力、多部门 LMS 部署和内容泛滥使集中整理变得必要。企业采用与深度生态集成紧密相连；Degreed 出现在 Workday Marketplace
              上，说明企业买方在批准多年软件承诺前，需要平台与核心 HCM 记录无缝互操作。
            claimRefs:
