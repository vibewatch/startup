              AI
              驱动技能与推荐的人类监督流程。同样，现有页面描述了当前能力，却没有提供有日期的产品路线图、发布历史、可扩展性基准或灾难恢复证据。这些是证据缺口，不是控制不存在的证明。把产品成熟度纳入投资判断前，尽调应要求安全资料包、架构和数据流图、子处理商清单、当前服务指标、事件摘要、模型卡、评估结果，以及区分已承诺与探索性事项的路线图。
