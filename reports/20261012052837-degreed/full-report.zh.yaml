        title: 可服务市场规模、规模层级与采用周期
        blocks:
          - type: paragraph
            body: >-
              评估企业可服务市场，必须把企业培训总支出与专业企业软件订阅拆开。全球企业每年的宏观培训支出超过 $350 billion，但其中绝大部分用于内部讲师薪酬、实体设施、咨询费和第三方内容制作。专门的企业数字学习与
              LXP 软件订阅市场更聚焦，估计规模为 $1.5 billion 至 $2.5 billion。在这一市场范围内，Degreed 报告已覆盖超过 600 万名注册学习者、近 300
              家全球企业组织，显示出较大商业触达。但随着核心 HCM 平台把原生学习界面和技能画像直接嵌入企业员工套件，可服务市场的扩张也受到上限约束。
