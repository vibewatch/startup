      - number: '1.3'
        title: 资本化历史、企业采用与商业透明度
        blocks:
          - type: paragraph
            body: >-
              Degreed 从 2015 年的种子轮和 A 轮融资起持续为品类扩张筹资，最终在 2021 年 4 月的 D 轮融资中由 Riverwood Capital 和 Sapphire Ventures 领投，募资
              $155.5M，投后估值 $1.39B。公司生命周期内通过连续优先股轮次累计融资约 $338.3M 至 $367M，各轮带有 1.0x 不参与型清算优先权和 8% 非累积股息率。商业方面，公司称平台已覆盖超过
              600 万名学习者、近 300 家全球客户组织，其中包括 Cigna Healthcare、PepsiCo、Citi、Cisco、Airbnb 和 BMO Financial Group
              等大型企业客户。但独立软件评估指出，技能分类治理的行政负担重、碎片化人力资本系统之间的集成复杂，且公司没有公开披露净收入留存率、现金消耗率和 2021 年之后的当前估值重置。
