      - number: '4.2'
        title: 市场进入动态与企业客户牵引
        blocks:
          - type: paragraph
            body: >-
              Degreed 的企业市场进入策略把战略直销组织与产品驱动的漏斗顶部扩张结合起来。面向个人学习者，Degreed
              提供免费的个人技能提升门户，让专业人士整理终身学习记录，并以零直接成本评估核心能力。免费层既带来自然用户获取和品牌认知，也通过自下而上的员工兴趣影响企业采购讨论。在企业规模上，Degreed 报告覆盖超过 6M
              名学习者、近 300 家全球企业组织；管理层披露则称覆盖 200 个国家的 8M 名学习者，并渗透 Fortune 100 的三分之一。独立买方追踪也确认其在全球大型企业中大规模部署，包括医疗健康企业 Cigna
              Healthcare 和消费品跨国公司 PepsiCo。但人力资本管理软件的企业销售周期依旧漫长且耗费资源，通常需要 6 至 12 个月完成采购、IT 安全审批，以及与 Workday、SAP
              等核心人力资源系统的双向集成。与主要 HCM 供应商的战略合作提升生态合法性，却也让 Degreed 暴露于竞争性合作和平台替代风险：企业买方可能更看重整合套件，而非专业的最佳单品学习体验软件。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI012
      - number: '4.3'
        title: 成本驱动、交付经济性与利润率可见度
        blocks:
          - type: paragraph
            body: >-
              Degreed 的成本结构受软件托管开销、专有技能分类的数据工程需求，以及第三方内容合作分成支配。实时技能匹配、个性化学习推荐和 AI 能力分析，需要可扩展的多租户云托管基础设施。跨碎片化 HR
              架构处理复杂企业技能数据，会持续产生计算、存储和 API 延迟成本，相比轻量工作流工具压低软件毛利率。此外，当企业客户通过 Degreed
              内容市场交易时，支付给合作伙伴的转售分成会降低整体毛利率，即便毛利润金额扩大。尽管公司广泛宣传企业规模，Degreed 对核心单位经济性仍完全不透明，没有公开 GAAP
              毛利率、净收入留存率、客户获取成本和回收期。缺少经审计的留存队列与扩张指标，软件投资评估者无法验证成熟客户队列中的净扩张是否抵消企业客户流失，也无法确认近期高管重组后销售效率是否改善。
            claimRefs:
              - CI008
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI014
      - number: '4.4'
        title: 资本充足性、流动性画像与尽调结论
        blocks:
          - type: paragraph
            body: >-
              自 2012 年成立以来，Degreed 通过 23 轮股权和债务融资累计筹资约 $367 million。公司在 2021 年 4 月由 Sapphire Ventures 和 Riverwood
              Capital 领投的 $153 million D 轮融资后达到独角兽地位，投后估值为 $1.4 billion。与此同时，Degreed 承担了 $30 million
              的传统债务融资，引入强制利息偿付义务以及潜在债务契约约束。距离上一次主要股权估值基准已超过五年，期间企业 SaaS
              公开市场估值倍数大幅收缩，后期成长资本获取也趋紧。私募二级流动性平台显示价格停滞、交易深度有限，Degreed
              股份没有活跃的成交清算价。公司当前现金跑道、净现金消耗和高级债务义务缺乏公开可见度，带来重大尽调风险。2026 年评估 Degreed 时，投资评估者必须把历史 $1.4 billion
              估值视为未经验证的基准，并在考虑投入资本前，明确要求数据室访问权限以核实跑道可持续性和股权结构表中的次级地位。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI014
