              多万人，这说明生产部署广度，但不能证明活跃使用、留存或产品层面的采用。实际客户工作流是汇聚内外部学习、个性化发现、记录完成情况，再用产生的技能信号进行劳动力规划。公开材料清楚描述了这一工作流，但只有
              LinkedIn Learning 集成给出具体服务级结果：每日刷新目录，使新发布内容在 24 小时内可用。
