  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 企业学习与技能版图架构
        blocks:
          - type: paragraph
            body: >-
              企业学习与人才发展架构分布在多个技术层：传统学习管理系统（LMS）、专用学习体验平台（LXP）、专业技能智能本体，以及综合人力资本管理（HCM）套件。Degreed 主要充当体验与能力层，位于底层行政
              HR/LMS 系统和分散的外部内容供应商之间。它的市场定位是聚合分散学习内容、建立标准化技能分类，并推动企业劳动力的职业流动路径。

              但这一定位也把 Degreed 置于架构整合的交叉火力中。SAP SuccessFactors 和 Workday 等大型企业 HCM 平台不断扩展原生学习、人才市场和技能智能能力。Degreed
              并不取代这些核心交易骨干，而是通过应用连接器和开放 API 与其并行运行。这种共存形成复杂动态：Degreed 提供专业整理、个人学习中心和分类灵活性，但企业持续评估，独立 LXP
              层是否值得承担集成、采购和行政维护成本，而不是直接使用套件功能。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 功能差异化与平台评估标准
        blocks:
          - type: paragraph
            body: >-
              在企业采购评估中，Degreed 在面向用户的体验、内容生态编排和灵活技能映射方面优势明显。独立分析师评测和 RFP
              评分显示，它在外部内容聚合（4.8/5.0）、学习路径编排（4.8/5.0）和个性化引擎（4.8/5.0）方面得分顶尖。Degreed
              吸收内部文档库、专有学习库、第三方内容平台，以及播客、文章等非正式资源，提供统一的学习者入口；传统行政型 LMS 架构很难复制这一点。

              反过来，功能评估也凸显出 Degreed 落后于专业或传统替代品的结构性限制。它在合规认证管理（3.7/5.0）以及原生评估和熟练度验证（3.8/5.0）上的能力得分最低。Degreed 不像专用合规 LMS
              套件那样，主要用于自动化严格的监管再培训周期、到期审计或监考技术测评。因此，大型组织通常把 Degreed 作为专用合规 LMS 的补充层，而不是独立替代品，既保留传统系统支出，也扩大软件总占用。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: 转换成本、护城河持久性与现有厂商替代
        blocks:
          - type: paragraph
            body: >-
              Degreed 的防御力主要来自工作流集成和累积数据引力，而不是专有内容排他性。企业在全球业务部门部署 Degreed 后，按岗位整理的路径、员工生成的内容集合以及映射到岗位架构的定制技能分类，会形成转换壁垒。把
              Degreed 的 API 和连接器接入核心 HCM 套件、单点登录（SSO）和身份配置流水线，也会让平台更深地嵌入日常企业工作流，提高 IT 与人员运营团队的迁移摩擦。

              不过，Degreed 的护城河面临明显的替代和商品化压力。由于它不拥有员工薪资或 HR
              主数据的核心记录系统，因此容易受到套件捆绑和供应商整合影响。当企业采购团队寻求削减软件预算时，独立体验与整理层会受到更严格审视，尤其是在 HCM 供应商升级原生 AI
              技能匹配和职业中心功能之后。此外，高保真技能数据需要客户 HR 团队持续治理；组织若在分类清洁上投入不足，参与度就会下降，使 Degreed 更容易被捆绑式平台替代。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 套件侵入与非独立架构
            body: >-
              Degreed 的核心市场风险来自其非独立平台的架构定位。独立分析师评测强调，由于合规追踪能力有限（3.7/5.0），Degreed 通常与企业 LMS 一起采购，而不是取代企业 LMS。随着 Workday 和
              SAP 等核心 HCM 套件供应商增强原生技能匹配能力，企业面临整合软件支出、取消第三方体验层的压力。
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
