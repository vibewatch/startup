              Cigna Healthcare、金融服务业的 Citi Group、消费品行业的 PepsiCo 和 Unilever，以及技术和专业服务业的 Cisco。但 Degreed
              没有公开披露这些企业层级的收入贡献或合同金额，因此分层利润率和每个账户的平均收入仍属于私有尽调事项。
