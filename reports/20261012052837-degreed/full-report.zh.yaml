  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业变现架构
        blocks:
          - type: paragraph
            body: >-
              Degreed 主要通过按席位许可核心学习体验平台，以年度经常性 SaaS
              订阅实现企业能力平台变现。大型企业客户把核心平台部署到大规模员工群体中，带来多年订阅的基础稳定性。为把平均年度合同额提升到基础学习内容聚合之上，Degreed 还销售模块化能力增值产品，尤其是 Degreed
              Skills+：该产品以更高的席位价格提供自动技能基准、按岗位定制分类和全组织分析。公司还运营企业内容市场，对通过平台采购的第三方学习资产收取交易佣金和分发费。Degreed 与 edX for
              Business、BetterUp 和 Skillable 等主要内容供应商及企业人才平台合作，充当外部企业学习支出的行政结算与内容整理中心。包括 2022 年 6 月收购 Learn In
              在内的补充性收购，又把变现范围拓展到学费援助管理和预付学习津贴。企业目录价通常为每席位每年 $50 至 $150，但实际合同经济性会受到大幅数量折扣和协商式企业套件让利影响。
