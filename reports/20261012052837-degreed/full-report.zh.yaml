  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规与 AI 治理风险
        blocks:
          - type: paragraph
            body: >-
              随着平台从内容聚合工具转向主动的技能智能与劳动力编排层，Degreed 的合规覆盖面显著扩大。公司维持了关于欧盟《通用数据保护条例》和全球网络无障碍标准的正式基础合规披露。但自动技能标记、岗位匹配和 AI
              代理能力的引入，使 Degreed 面临欧盟 AI 法案、纽约市第 144
              号地方法和联邦就业反歧视指令下更严格的监管审查。由于企业人才架构会直接影响晋升、职业流动和内部岗位分配，算法偏差或不透明的推荐逻辑会给企业客户带来重大的法律和监管风险。Degreed
              目前没有公开第三方审计文件、算法影响评估或可验证的偏差测试报告，无法确认其机器学习模型在不同人口群体中运行时没有不利影响。此外，公司没有自助式或公开的中端市场定价条款，也限制了监管透明度；条款和数据处理保障是在定制企业合同下双边协商，而不是按标准化公开合规计划执行。
            claimRefs:
              - CR001
              - CR004
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR013
              - CR015
      - number: '7.2'
        title: 运营复杂度、技能分类治理与技术债务
        blocks:
          - type: paragraph
            body: >-
              Degreed 的企业部署包含大量实施复杂度和运营负担，经常拖慢企业买方实现价值的速度。独立供应商评估显示，企业部署周期通常需要 3 至 6
              个月的密集技术配置、系统集成和变革管理，之后才会在员工群体中形成有意义的活跃使用。这种摩擦的关键来源，是持续整理、协调和更新技能分类所需的行政治理。Degreed 的技能架构旨在跨不同 HCM
              系统标准化碎片化劳动力能力，但客户组织必须持续投入内部资源维护岗位分类、路径标记和内容相关性。技术架构上，Degreed 原生 SCORM 合规能力有限；虽然平台支持基础 SCORM
              包上传，却缺少细粒度交互遥测和题目级完成报告。需要严格监管培训记录或运营面向外部客户的学院的组织，会发现这一限制难以接受，往往必须补充辅助 LMS 基础设施或第三方学习记录库。Degreed
              通过正式事件管理流程和公开状态披露降低服务中断风险，但对内部 L&D 人员配置的运营依赖仍是持续的采用障碍。
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR002
