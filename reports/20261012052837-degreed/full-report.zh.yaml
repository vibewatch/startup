              2022 年联合创始人 David Blake 因与 Dan Levin 的战略观点分歧而突然回任
              CEO，凸显运营标准化与激进产品品类重塑之间持续的领导层张力。第三方软件评论还指出，企业实施经常在技能分类治理、复杂 HRIS 集成和持续行政负担方面遇到显著摩擦，给买方带来采用阻力。
