  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 决策流程图将企业市场地位和已报告的盈利能力，与估值压力相对照，得出“继续研究”的判断。
    data:
      nodes:
        - id: market-scale
          label: 企业覆盖面：覆盖约 300 家全球企业、财富 50 强客户，用户数超过 6M
        - id: product-evolution
          label: 产品演进：拓展至 Skills+ 智能能力和 Maestro AI 教练服务
        - id: profitability-milestone
          label: 财务里程碑：2025 年 1 月实现经营盈利
        - id: valuation-overhang
          label: 估值压力：最高 $1.4B 的 D 轮估值对应预估 $100M ARR 的约 14 倍
        - id: information-opacity
          label: 信息不透明：NRR、流失率和清算优先权均无公开披露
        - id: final-recommendation
          label: 建议：评级为继续研究，同时标注高风险和估值偏高
      edges:
        - from: market-scale
          to: product-evolution
        - from: product-evolution
          to: profitability-milestone
        - from: profitability-milestone
          to: valuation-overhang
        - from: valuation-overhang
          to: information-opacity
        - from: information-opacity
          to: final-recommendation
    approximationNotes: 展示分析框架如何通过决策流程得出最终建议。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV007
