chapter:
  number: 6
  title: "Customers"
  summary: "Degreed demonstrates established enterprise penetration with over 6 million cumulative users across nearly 300 global organizations and one-third of the Fortune 50, but private retention rates, governance overhead, and lack of customer concentration disclosures leave commercial durability to be verified in confirmatory diligence."
sections:
  - id: "enterprise-customer-segmentation"
    title: "Enterprise Customer Segmentation and Target Audiences"
    body: "Degreed primarily targets large multinational corporations, global enterprises, and regulated industry institutions that require unified skills intelligence across disparate learning catalogs. Across its customer base, purchasing authority typically resides with Chief Learning Officers, Chief Human Resources Officers, and Heads of Talent Development, while end users comprise enterprise knowledge workers, operational staff, and people managers. The platform addresses core organizational needs in workforce upskilling, role-based onboarding, and internal talent mobility. Enterprise client examples include Cigna Healthcare in insurance, Citi Group in financial services, PepsiCo and Unilever in consumer goods, and Cisco in technology and professional services. However, Degreed does not publicly disclose revenue contributions or contract values across these enterprise tiers, leaving segment-level margins and average revenue per account as private diligence items."
    claimRefs:
      - "CU002"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-scale"
    title: "Adoption Trajectory and Cumulative Scale"
    body: "Degreed's historical growth reflects an evolution from an early consumer and individual learning tracker to an enterprise-wide learning experience platform (LXP). Originally launched in 2012 with a public beta of 20,000 founding scholars, the company expanded into corporate upskilling with the 2014 introduction of its enterprise platform. By 2026, Degreed reports having reached over 6 million learners across nearly 300 global customer organizations, establishing penetration in approximately one-third of the Fortune 50. Despite these cumulative figures, public disclosures lack essential recurring engagement denominators, such as monthly active user (MAU) percentages or cohort-level seat utilization. Consequently, headline user numbers establish brand reach and initial deployment footprint, but confirmatory diligence must verify daily workflow habituation versus passive employee registration."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU009"
    tableRefs:
      - "TU002"
  - id: "named-customer-evidence-and-outcomes"
    title: "Named Customer Deployments and Operational Outcomes"
    body: "Public case studies and independent buyer tracking databases provide documented evidence of multi-thousand seat production deployments across prominent enterprise organizations. At Bank of Montreal (BMO), Degreed was deployed to 46,000 employees globally, achieving 34,000 activated users representing a 74% adoption rate and enabling continuous on-demand upskilling across 22 countries. British Telecom implemented Degreed across 600 core roles in 2024, leveraging automated triggers and onboarding flows to replace fragmented administrative tools. Similarly, Airbnb deployed Degreed in 2015 to support manager development and data analytics competencies. Enterprise testimonials emphasize that Degreed successfully shifts training from formal classroom instruction into daily workflow learning, though detailed financial metrics on employee productivity and program return on investment remain self-reported by customer sponsors."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU008"
    tableRefs:
      - "TU003"
  - id: "customer-expansion-retention-and-tradeoffs"
    title: "Customer Expansion Dynamics, Retention Risks, and Implementation Tradeoffs"
    body: "Enterprise account expansion for Degreed relies on transitioning clients from basic content curation into deeper skills taxonomy mapping, automated workflows, and talent academies. The 2022 acquisition of Learn In provided extended capabilities in bespoke capability academies and tuition benefit management, creating an additional upsell mechanism. Nevertheless, independent procurement evaluations highlight meaningful implementation tradeoffs. Buyers frequently encounter integration complexity across existing human capital management systems, significant administrative governance overhead to maintain custom skills frameworks, and end-user confusion distinguishing between learning pathways and broader job architectures. Furthermore, Degreed maintains complete opacity regarding gross revenue retention (GRR), net revenue retention (NRR), and top-customer concentration, making contractual renewal durability a primary diligence focus."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
    figureRefs:
      - "FU001"
