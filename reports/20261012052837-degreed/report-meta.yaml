companyProfile:
  summary: >-
    Degreed is a late-stage private enterprise learning platform founded in 2012 by David Blake and Eric Sharp. The
    company combines a learning experience layer, skills intelligence, and workflow integrations to help large
    enterprises aggregate content, personalize development, and support internal mobility programs. It is headquartered
    in Pleasanton, California, and sells primarily into global enterprises that need centralized learning and skills
    infrastructure.
