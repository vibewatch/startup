evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-reset
    missingEvidence: Audited secondary market transaction records or updated preferred share pricing post-2021
    whyItMatters: >-
      Without recent transaction data or 409A valuations, the $1.39B valuation from April 2021 cannot be confirmed in
      the 2026 software multiple environment
    diligencePath: Request confidential cap table statements, recent 409A valuation reports, and secondary transaction disclosures
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: revenue-retention
    missingEvidence: Audited annual recurring revenue (ARR), gross retention, and net revenue retention (NRR) cohorts
    whyItMatters: >-
      Revenue durability and customer contract expansion cannot be quantitatively underwritten without cohort retention
      disclosures
    diligencePath: Obtain audited financial statements, historical SaaS metric dashboards, and customer cohort renewal schedules
    relatedQuestionRefs:
      - QO004
      - QO007
  - type: private-evidence-only
    severity: material
    topic: retention-and-revenue-durability
    missingEvidence: >-
      Audited gross and net revenue retention rates, annual contract value (ACV) distributions, and enterprise seat
      renewal data for Degreed's core enterprise platform.
    whyItMatters: >-
      Without verified retention and seat renewal metrics, evaluating the durability of Degreed's addressable market
      penetration and LXP budget defensibility against suite consolidation is speculative.
    diligencePath: >-
      Request confidential customer cohort retention schedules, gross margin profiles, and net expansion rates under NDA
      as part of financial and commercial diligence.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Publicly audited gross margins, net revenue retention (NRR), customer acquisition payback period, and monthly cash
      burn rate.
    whyItMatters: >-
      Without retention cohorts and unit economics data, underwriting organic growth durability and forward runway is
      impossible under normalized 2026 SaaS valuation multiples.
    diligencePath: >-
      Request audited GAAP financial statements, detailed cohort retention matrices, customer concentration schedules,
      and monthly cash flow models in data room diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: trust-evidence-gap
    missingEvidence: >-
      Current security certifications and scope, privacy and retention controls, subprocessors, penetration-test
      summary, uptime history, incident record, and disaster-recovery results.
    whyItMatters: >-
      Enterprise learning and skills profiles contain sensitive workforce data, and identity or availability failures
      can affect company-wide access and records.
    diligencePath: >-
      Request the trust-center package, data-flow and deployment diagrams, DPA and subprocessor list, recent pen-test
      summary, service-level history, incident summaries, and business-continuity test results.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: roadmap-and-performance
    missingEvidence: >-
      A dated roadmap, release history, scalability benchmark, connector uptime, support response metrics, and
      implementation-time distribution.
    whyItMatters: >-
      Without these measures, current technical maturity and the cost or risk of operating the integration layer cannot
      be underwritten.
    diligencePath: >-
      Obtain the last 12 months of release notes and service metrics, roadmap commitments, reference architecture,
      load-test evidence, implementation plans, and support SLA attainment.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: ai-evidence-gap
    missingEvidence: >-
      Model cards, skills-inference validation, recommendation-quality results, bias and drift tests, human-review
      controls, and customer-level outcome studies.
    whyItMatters: >-
      Skills inference and personalization are central differentiation claims, but unmeasured error or bias could reduce
      adoption and create workforce-governance risk.
    diligencePath: >-
      Request model documentation, evaluation datasets and results, subgroup testing, monitoring thresholds, override
      workflows, audit logs, and customer studies with denominators.
    relatedQuestionRefs:
      - QE006
      - QE010
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof-enumeration-gap
    missingEvidence: >-
      Comprehensive customer census detailing all active enterprise accounts, contract values, and actual user adoption
      percentages.
    whyItMatters: >-
      Public customer lists only showcase self-selected marketing case studies, obscuring customer churn, contract
      down-sizing, and pilot dropouts.
    diligencePath: >-
      Request an audited anonymized customer cohort analysis showing gross retention, net retention, and expansion
      across contract cohorts.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-retention-and-concentration-gap
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and top-10 customer revenue concentration
      figures.
    whyItMatters: >-
      Degreed does not disclose public retention rates or customer concentration percentages, creating uncertainty
      regarding revenue durability and renewal dynamics.
    diligencePath: >-
      Obtain vendor customer master data during confirmatory diligence, including cohort retention, ARR concentration by
      top accounts, and multi-year contract renewal rates.
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Audited third-party assessments of Degreed's AI recommendation engines and automated skills tagging for
      algorithmic bias and compliance with emerging AI regulations such as the EU AI Act.
    whyItMatters: >-
      Enterprise buyers and regulatory authorities increasingly mandate verifiable algorithmic auditing and bias
      assessments for employment-related AI tools that influence talent mobility, promotion pathways, and compensation.
    diligencePath: >-
      Request Degreed's third-party AI model audit reports, algorithmic impact assessments, and vendor compliance
      disclosures under the EU AI Act and New York City Local Law 144.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: capital-structure-and-burn
    missingEvidence: >-
      Audited financial statements detailing Degreed's current cash burn rate, gross margin profile, net revenue
      retention (NRR), and runway since the 2021 Series D funding.
    whyItMatters: >-
      Without current burn and NRR data, underwriters cannot verify whether Degreed is operating near cash-flow
      breakeven or will require an equity financing round under current software multiples.
    diligencePath: >-
      Examine Degreed's confidential financial disclosures, trailing 12-month P&L, customer cohort retention schedules,
      and senior debt covenant terms during confirmatory diligence.
    relatedQuestionRefs:
      - QR005
  - type: missing-source
    severity: material
    topic: financial-durability
    missingEvidence: >-
      Audited financial statements confirming trailing-twelve-month revenue, gross margins, EBITDA, and net revenue
      retention.
    whyItMatters: Without certified financial results, revenue durability cannot be modeled with institutional confidence.
    diligencePath: Request audited GAAP financial statements and subscription renewal schedules under NDA.
    relatedQuestionRefs:
      - QV005
      - QV008
    relatedTableRefs:
      - TV003
  - id: null
    type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Fully diluted capitalization table detailing preference seniority, participation rights, and debt covenants.
    whyItMatters: >-
      Senior liquidation preferences across $437M+ raised could impair or eliminate equity returns for junior
      shareholders.
    diligencePath: Obtain company capitalization ledger and investor rights agreements from management.
    relatedQuestionRefs:
      - QV006
      - QV008
    relatedTableRefs:
      - TV001
