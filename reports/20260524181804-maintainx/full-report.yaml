      - number: '4.4'
        title: Financial Disclosure Gaps, Revenue Quality, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              As a private company subject only to Delaware corporate law and SEC Regulation D filing obligations,
              MaintainX is not required to publish audited financial statements, and none are publicly available. The
              company's financial opacity is common at its stage but creates material barriers for external
              underwriting. The following gaps are categorized by severity.

              The most material gap is the absence of any gross-margin confirmation. CMMS software with no embedded
              hardware has the structural profile for 70–80% gross margins, but the actual figure—which reflects support
              staff ratios, cloud hosting costs, professional services delivery, and partner revenue sharing—is unknown.
              Related to this, CAC payback and NRR are both undisclosed; without these, the sustainability of
              MaintainX's claimed revenue growth rate cannot be independently validated. A high-growth top line combined
              with elevated churn or poor unit economics would materially change the investment thesis.

              The revenue figure itself rests entirely on third-party inference. No Growjo-class data provider has
              confirmed its methodology, and the $115.5M versus $73.5M spread across two third-party sources illustrates
              the estimation risk. Byron Deeter (Bessemer) cited "remarkable product-market fit" and strong customer
              feedback as investment drivers but did not disclose specific financial metrics.

              On capital adequacy, MaintainX's stated use of its $150 million Series D is expansion- focused (AI product
              development, talent acquisition, global growth) rather than defensive (bridge financing or debt service).
              The company's decision to remain private amid "choppy IPO market conditions" (per Reuters) indicates no
              near-term liquidity event; investor return timelines are extended accordingly. The absence of a disclosed
              burn rate prevents verification of the implied 18–30 month runway estimate.

              Customer count shows a minor discrepancy: the July 2025 Series D press release cited over 11,000 companies
              while LeadIQ's more recent profile listed over 13,000, suggesting continued organic growth but also
              highlighting how even operational metrics drift between reporting dates without a formal disclosure
              cadence.
