      - number: '1.5'
        title: Adverse Evidence and Risk Factors
        blocks:
          - type: paragraph
            body: >-
              The primary documented legal matter is a federal trademark lawsuit filed by Upkeep Technologies, Inc. in
              February 2019 (Case 4:19-cv-00857, U.S. District Court N.D. California). The case was terminated in May
              2019 with no ongoing litigation found as of the run date. MaintainX, Inc. should not be confused with a
              separate Tampa-based 'MaintainX' entity that faced sexual harassment lawsuits—those records involve an
              unrelated maintenance services company. On the competitive front, independent 2026 CMMS review sites
              document structural product limitations: the platform's asset hierarchy is capped at two levels (Asset →
              Sub-asset), which frustrates complex industrial plant structures; custom fields cannot be added to
              reports; and AI predictive maintenance features are gated to premium pricing tiers ($49/user/month), while
              some competitors offer comparable AI capabilities at significantly lower entry prices. These constraints
              have driven documented user migration to alternatives including OxMaint, Limble CMMS, and UpKeep. ARR
              figures conflict across sources ($115.5 million vs. other estimates of ~$73.5 million), and MaintainX as a
              private company does not disclose audited financials, gross margin, or net revenue retention—all material
              gaps for valuation diligence.
            claimRefs:
              - CO038
              - CO039
              - CO040
