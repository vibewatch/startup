      - number: '8.4'
        title: Scenario Analysis, Return Potential, and Probability Signals
        blocks:
          - type: paragraph
            body: >-
              Bull case: ARR grows at 45–50% annually, reaching $250M by end of 2026 and $375M by end of 2027. NRR
              exceeds 120%, Rule of 40 score crosses 45, and the company demonstrates a path to 20%+ operating margins.
              In this scenario, a 12–15x ARR exit multiple in a 2027–2028 IPO or strategic acquisition yields an implied
              valuation of $4.5–5.6B — a 1.8–2.2x return on the $2.5B Series D mark. Probability signal: strong if Q3/Q4
              2026 ARR growth tracks above 40%.

              Base case: ARR grows at 30–35% annually, reaching $200M by end of 2026. Multiple normalizes to 10–12x ARR
              for AI-enabled vertical SaaS with solid growth, implying a 2027 valuation of $2.0–2.4B. This is
              effectively flat-to-slightly-down from the current mark — a value-preservation scenario for Series D
              investors but not a strong return. IPO window extends to 2028–2029 as the company needs to improve margin
              profile to attract public market appetite.

              Bear case: ARR growth slows to 15–20% due to competitive displacement, macro pullback in industrial capex,
              or customer churn. Multiple compresses to 5–7x as growth premium dissipates. Implied valuation falls to
              $750M–$1.2B — a down-round scenario of 50–70% from the current mark. Preferred liquidation preferences
              absorb the first $254M of proceeds, leaving common shareholders and later-series preferred at risk of
              significant mark-downs.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV037
              - CV038
              - CV039
              - CV043
