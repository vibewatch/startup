      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Enterprise churn acceleration
        - Net Revenue Retention decline
        - NRR < 90% for two consecutive quarters
        - 'Thesis break: re-evaluate demand durability; consider reducing position'
      - - Competitive displacement by AI-native rivals
        - Market share data from Gartner/G2 peer surveys
        - Tractian, Facilio, or Limble captures >20% of MaintainX's core segment
        - Downgrade conviction; monitor product roadmap response
      - - Regulatory enforcement action
        - SEC, state AG, or data regulator enforcement notice
        - Any published enforcement action naming MaintainX
        - Immediate full re-assessment; monitor customer response
      - - Cloud-infrastructure failure event
        - AWS or platform outage longer than 4 hours confirmed by status page
        - Customer SLA breach claims filed or public incident disclosed
        - Monitor; require disclosure of multi-region DR strategy as condition of continued hold
      - - Data breach or security incident
        - GDPR/CCPA breach notification or public disclosure
        - Material breach notified to regulator or customers
        - Full legal and reputational risk assessment; review SOC 2 response
      - - IPO delay / liquidity failure
        - No IPO or strategic M&A event
        - No liquidity event by end of 2028
        - Reassess exit timeline with fund constraints; evaluate secondary market or PE buyer
      - - Burn-rate escalation without proportionate revenue growth
        - Quarterly burn versus ARR growth proxy
        - Implied runway drops below 12 months without new round announced
        - Demand financial disclosure; accelerate diligence on cash position
    notes: >-
      Kill criteria thresholds are proposed diligence anchors, not confirmed company targets. MaintainX does not
      publicly disclose NRR, burn rate, or enterprise account concentration.
