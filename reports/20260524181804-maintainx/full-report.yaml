        title: Exhibits
        blocks:
          - type: callout
            title: 41% of Facilities Still Running on Paper — Large Undigitized Market
            body: >-
              More than four in ten industrial facilities globally had not adopted a CMMS platform as of 2026. With the
              market growing at ~9–12% CAGR, the remaining paper-and-spreadsheet installed base represents a substantial
              conversion opportunity for mobile-first platforms like MaintainX, particularly in SME manufacturing and
              logistics where awareness and budget constraints remain the primary barriers.
            calloutType: insight
            claimRefs:
              - CM010
              - CM001
              - CM004
          - type: callout
            title: AI Adoption Does Not Automatically Translate to Reliability Improvement
            body: >-
              MaintainX's own 2026 State of Industrial Maintenance survey found that 79% of teams saw unplanned downtime
              stay the same or increase despite embracing AI. This finding tempers the TAM expansion narrative and
              signals that the addressable opportunity is concentrated in customers who combine technology adoption with
              disciplined PM execution — a more complex sales and success motion than pure license conversion.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
          - type: callout
            title: Bessemer SAM Estimate Uses Broader Definition Than Pure CMMS Revenue
            body: >-
              BVP's cited $10–25B SAM encompasses workflow, asset data platform, and operational intelligence spend
              beyond traditional CMMS software licenses. The pure cloud CMMS market is approximately $1.6–2.55B in 2026;
              MaintainX's practical addressable slice is best framed as a constrained $3–5B when including adjacent
              maintenance workflow and EAM-lite functionality for mid-market and enterprise buyers.
            calloutType: assumption
            claimRefs:
              - CM011
              - CM001
