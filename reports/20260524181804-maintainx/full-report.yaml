      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              In the CMMS/EAM procurement structure, purchasing decisions typically involve three roles: the budget
              owner (VP Operations, VP Facilities, or CFO), the champion and evaluator (Maintenance Manager, Plant
              Manager, or Reliability Engineer), and the end user (frontline technician or field worker). The payer is
              almost always on the operations or facilities P&L, not IT, though IT security review remains a gate for
              cloud deployments. MaintainX's product-led growth strategy has historically targeted maintenance managers
              and technicians directly — bypassing IT — to drive grassroots adoption before expanding to enterprise
              contract conversations.

              The five strongest buyer segments for MaintainX are: (1) Industrial Manufacturing, where unplanned
              downtime costs and regulatory compliance drive highest urgency; (2) Facilities and Real Estate Management,
              where multi-site visibility and preventive maintenance scheduling are the primary triggers; (3) Energy and
              Utilities, where aging asset bases and ESG mandates accelerate investment; (4) Healthcare, where Joint
              Commission and FDA compliance requirements create non-negotiable maintenance traceability needs; and (5)
              Hospitality and Food Service, where brand standard compliance and multi-location preventive maintenance
              drive adoption. Manufacturing holds approximately 40% of global CMMS market share by end-user segment,
              making it the single largest vertical.

              Small and medium enterprises (SMEs) hold approximately 69% of CMMS market share by customer count,
              consistent with MaintainX's historical SMB-first trajectory. However, enterprise accounts represent
              disproportionate revenue per customer, which explains MaintainX's current upmarket motion toward larger
              multi-site deployments. The budget owner in an SMB context is often the owner-operator or plant manager;
              in enterprise deployments, it typically escalates to VP Operations or Finance, extending the sales cycle
              and requiring a formal ROI justification.
