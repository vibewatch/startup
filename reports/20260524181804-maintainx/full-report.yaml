      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              MaintainX closed its first institutional round—a $3.8 million Seed—in March 2019, led by August Capital
              and Amity Ventures. A previously undisclosed $11 million Series A followed later in 2019, also led by
              August Capital. The company announced a $39 million Series B in June 2021, led by Bessemer Venture
              Partners, at which time the company disclosed 12x revenue growth from early 2020 and a 98% customer
              retention rate. In December 2023 Bain Capital Ventures led a $50 million Series C, bringing total raised
              to $104 million and valuation to $1 billion (unicorn status), reflecting 13x revenue growth since the
              Series B. The Series C attracted strategic angel investors including former GE CEO Jeff Immelt, Twilio CEO
              Jeff Lawson, PagerDuty CEO Jennifer Tejada, and others. On July 9, 2025, MaintainX announced a $150
              million Series D co-led by Bessemer Venture Partners and Bain Capital Ventures with participation from
              D.E. Shaw Ventures, Founders Circle Capital, Sozo Ventures, and Fifth Down Capital, plus angel investors
              Rahul Mehta and Dave McJannet. The Series D brought total raised to $254 million and valuation to $2.5
              billion—more than doubling the Series C valuation in under two years. All rounds have been equity; no
              public evidence of secondary transactions or debt facilities has been identified. Diligence should verify
              cap-table waterfall and any undisclosed preferred-stock terms.
