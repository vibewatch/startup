      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Contradictory Estimates'
        blocks:
          - type: paragraph
            body: >-
              Analyst estimates for the 2026 CMMS market vary substantially — from $1.44B (Business Research Company,
              conservative methodology) to $2.55B (Coherent Market Insights, broader scope) — reflecting differing
              definitions of included segments, service revenue, and freemium adoption. Future Market Insights places
              the 2026 CMMS market at $2.4B with a 9.3% CAGR to reach $5.9B by 2036. Adding the EAM segment ($7.29B in
              2026 per Fortune Business Insights) puts the combined software TAM at approximately $8.7–9.7B globally.

              MaintainX's serviceable addressable market is narrower: Bessemer Venture Partners estimated the SAM at
              $10–25B, which uses a broad definition including workflow and asset data platform spending beyond pure
              CMMS license revenue. A more conservative estimate anchored to cloud CMMS targeting mobile-first
              mid-market and enterprise operations suggests an SAM of approximately $3–5B in 2026. MaintainX's current
              ARR of approximately $115M implies it captures roughly 2–4% of the most conservative SAM estimate,
              indicating substantial growth runway.

              The predictive maintenance market, valued at $18.9B in 2026 with a 34% CAGR per Mordor Intelligence, is a
              frequently cited super-category that encompasses IoT sensor hardware, services, and analytics alongside
              CMMS software. This figure is not a proxy for MaintainX's SaaS addressable market. Contradictory estimates
              arise from analysts applying different scope definitions; reconciliation requires sourced methodology
              footnotes that are not publicly available from most research publishers. The diligence path is to request
              revenue disaggregation from independent data providers such as IDC or Gartner for cloud-CMMS-only figures.
