  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger Event
      - Threshold / Signal
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration
        - Consecutive quarters with <25% YoY ARR growth
        - Growth premium disappears; EV/ARR multiple compresses to 6–8x; implies valuation $900M–$1.5B
        - Downgrade to Avoid; model down-round in next financing
      - - NRR below 100%
        - Published or leaked NRR below 100%
        - Customer value creation not confirmed; churn accelerates dilution of installed base
        - Immediate thesis break; SME churn vulnerability becomes systemic risk
      - - Competitor AI launch
        - Rockwell Automation (Fiix), SAP, or IFS ships credible mobile AI CMMS at comparable pricing
        - Win-rate and new ARR growth compress; switching cost advantage erodes
        - Reduce conviction; seek win/loss data confirmation before next decision point
      - - Down-round financing
        - Any Series E or bridge announced at <$2B valuation
        - Confirms market repricing of growth premium; employee morale and retention at risk
        - Move to Avoid; down-rounds trigger anti-dilution protections and preference resets
      - - Data breach or major outage
        - Customer data exposure or >48-hour platform outage affecting >10% of customers
        - Trust damage in regulated industries; churn spike and regulatory exposure
        - Pause assessment; evaluate scope and customer response before reassigning stance
    notes: >-
      Triggers are structured as observable signals mapped to valuation mechanics. Thresholds are approximate and based
      on analogous SaaS precedents.
    claimRefs:
      - CV024
      - CV039
      - CV041
      - CV045
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR growth rate (current)
        - Audited or management-confirmed ARR as of Q1 2026 and YoY growth rate
        - 21.6x multiple is only defensible at >40% ARR growth; current rate is unconfirmed
        - MaintainX CFO data room; triangulate with Latka, Growjo, headcount signals
      - - Net Revenue Retention
        - Published or verified NRR figure for 2025–2026 cohort
        - NRR >115% is required to justify premium AI-SaaS multiple; enterprise expansion is thesis-critical
        - Reference calls with 10+ enterprise customers; request from data room
      - - Gross margin and operating loss
        - Audited gross margin %, operating loss, and burn rate for FY2025
        - No profitability path disclosed; without margin profile, Rule of 40 and cash runway are unverifiable
        - Request audited financials or investor deck with P&L; pre-IPO S-1 would resolve
      - - Enterprise customer composition
        - '% of ARR from customers >$50K ACV; number of Fortune 1000 accounts'
        - Customer concentration in SME/mid-market limits ACV expansion thesis and increases churn risk
        - Sales force deck; customer reference calls at enterprise tier
      - - Cap table and anti-dilution terms
        - >-
          Full cap table post-Series D with liquidation preferences, anti-dilution provisions, and participating rights
          by series
        - >-
          Liquidation waterfall determines actual returns under various exit scenarios; $254M cumulative preferred is
          material overhang
        - Request from company or secondary data provider; EquityZen/PremierAlts cap table data
    notes: >-
      Diligence asks are prioritized by materiality to the valuation thesis. Items 1–3 are blocking for a
      high-conviction investment decision.
    claimRefs:
      - CV006
      - CV007
      - CV025
      - CV026
      - CV044
      - CV040
