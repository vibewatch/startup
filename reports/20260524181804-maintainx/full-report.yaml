      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              MaintainX was co-founded in 2018 by Chris Turlica (CEO), Hugo Dozois-Caouette (CTO), Mathieu
              Marengère-Gosselin (Head of Engineering), and Nick Haase (GTM/Sales). Before MaintainX, Turlica and
              Dozois-Caouette had built and sold a consumer messaging startup called Voo. Turlica, who holds a Finance
              degree from McGill University and served as an Entrepreneur in Residence at Deutsche Telekom Capital
              Partners, drives fundraising and commercial strategy. Dozois-Caouette earned his engineering degree from
              Université de Sherbrooke and previously worked at Fujitsu and Autodesk before co-founding Voo; under his
              technical leadership the platform has grown to nearly one million users. Marengère-Gosselin brings over a
              decade of engineering experience as the platform's first lead engineer. Haase leads community and growth
              efforts. The executive team has been complemented by Will Lehrmann as President and Tyson Gwaltney as
              Chief Growth Officer. Board directors include Byron Deeter (Bessemer Venture Partners), David Hornik
              (Lobby Capital/founding partner), CJ Reim (Amity Ventures), and Peter Yared. The founding team's prior
              shared startup experience and technical depth mitigate execution risk, but Chris Turlica and Hugo
              Dozois-Caouette are disproportionately prominent public faces, creating moderate key-person concentration.
              Control Engineering magazine named Dozois-Caouette a 2025 Engineering Leader Under 40.
