          - type: callout
            title: Minimum Diligence Package for Financial Underwriting
            body: >-
              Any investment or enterprise partnership assessment must obtain: (1) audited ARR and revenue for the
              trailing two fiscal years; (2) gross margin disaggregated by tier; (3) cohort NRR for at least two annual
              vintages; (4) blended CAC payback by channel; (5) trailing 12-month P&L and cash position; (6) ACV
              distribution and top-10 customer revenue concentration. Without these, financial analysis relies entirely
              on third-party inference and company-controlled marketing claims.
