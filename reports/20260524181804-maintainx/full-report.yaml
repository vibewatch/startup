chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              MaintainX, Inc. is a private technology company headquartered at 185 Clara St., Suite 101C, San Francisco,
              CA 94107. Founded in 2018, the company provides an AI-powered Computerized Maintenance Management System
              (CMMS) and Enterprise Asset Management (EAM) platform purpose-built for industrial and frontline teams.
              The core product is mobile-first and cloud-based, targeting the roughly 2.7 billion deskless workers
              worldwide who manage physical assets in manufacturing, facilities management, food and beverage,
              distribution centers, and other asset-intensive industries. The platform digitizes work orders, preventive
              and predictive maintenance schedules, safety procedures, regulatory audits, and parts inventory
              management. Its revenue model is subscription SaaS with tiered pricing (Essential, Premium, Enterprise)
              and native integrations with SAP and other ERP systems. MaintainX holds SOC2 Type 2 Compliance and ISO/IEC
              27001:2022 certification, and has earned the SAP Silver Partner designation as of 2026. The company's
              stated mission is to eliminate unplanned equipment downtime and transform frontline workers into
              data-driven knowledge workers through AI-assisted workflows.
            claimRefs:
