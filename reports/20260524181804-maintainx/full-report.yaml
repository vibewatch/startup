      - number: '8.3'
        title: Comparable Company Valuation Analysis
        blocks:
          - type: paragraph
            body: >-
              The comparable set spans public industrial and enterprise SaaS bellwethers, private CMMS peers, and
              adjacent M&A transactions. ServiceNow (NYSE: NOW), the closest public analog for mission-critical workflow
              software, traded at approximately 7x EV/revenue as of May 2026 with $3.77B quarterly revenue and 22% YoY
              growth — setting the ceiling multiple for what public markets pay for highly differentiated enterprise
              SaaS. The BVP Nasdaq Emerging Cloud Index stood at 8.0x in Q1 2026, while the SaaS Capital Index median
              was 6.4x and the narrower Aventis Advisors public sample showed 3.4x, reflecting the valuation bifurcation
              between premium and median-growth software companies.

              For private comparable transactions, the Aventis Advisors 543-deal dataset places the median SaaS M&A deal
              at 4.5x EV/revenue, with a 2026 compression to 3.1x for smaller deals. In the CMMS segment specifically,
              Limble CMMS announced a $450M post-money valuation at its Goldman Sachs-led Series B in 2023. UpKeep
              received a PE investment from Accel-KKR in May 2026 at undisclosed terms. Fiix (Rockwell Automation) was
              acquired at an undisclosed multiple in 2021. Fracttal raised $35M at an implied sub-$200M valuation.

              MaintainX's implied 21.6x ARR sits at least 2.4x above the AI-native high-growth private SaaS ceiling of
              ~9x from Livmo and Acquiry benchmarks. Even under the most generous AI-premium framing (10–15x ARR for
              >40% ARR-growth companies), the current mark demands the upper bound of credible market evidence. The
              valuation is defensible only if growth is demonstrably above 40% ARR annually and NRR is confirmed above
              120%; neither has been publicly disclosed.
            claimRefs:
