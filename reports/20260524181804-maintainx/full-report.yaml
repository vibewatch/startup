  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              MaintainX generates revenue exclusively through a per-user, per-month SaaS subscription model. The pricing
              ladder has four tiers. The Basic plan is free, providing small teams with unlimited work orders and
              unlimited requester-user seats but capping analytics access to one month and limiting repeating work
              orders and procedure-attached jobs. The Essential tier, at $20 per licensed user per month (annual
              billing) or $25 per month (monthly billing), unlocks unlimited repeating work orders, full image
              attachments, and three months of analytics access—but excludes inventory management, purchase-order
              modules, and API access. The Premium tier, at $65 per user per month (annual) or $75 (monthly), adds full
              analytics, parts inventory, purchase-order management, a REST API, meter-based maintenance, time-and-cost
              tracking, and a dedicated account manager. Enterprise pricing is custom and includes IoT sensor
              integrations, escalation protocols, single sign-on, multi-site management, and the MaintainX CoPilot AI
              module. Requester accounts—used by employees who submit work requests but do not manage them—are free at
              every tier, enabling wide organizational deployment without per-seat cost for non-managers.

              The product-led-growth (PLG) entry via the free Basic tier drives top-of-funnel adoption among small and
              mid-market facilities teams, with upgrade triggers at the need for inventory management (Premium) or
              enterprise governance features (Enterprise). PricingNow's 2026 benchmark places MaintainX approximately
              59% below the average cost of comparable CMMS platforms such as eMaint ($110/user/month), underscoring a
              value-based pricing position. The revenue recognition model is subscription-based with annual billing
              collecting cash upfront, which improves short-term cash conversion relative to monthly-only billing.
              Annual billing also reduces churn risk by locking customers into full-year commitments. Revenue-per-user
              at the Premium tier compounds significantly for large enterprise accounts; a 50-user Premium customer
              paying annually would generate $39,000 per year in list revenue. There is no public disclosure of average
              contract value (ACV), enterprise discount rates, or realized average revenue per user (ARPU) versus list
              pricing, which are critical inputs for underwriting.
