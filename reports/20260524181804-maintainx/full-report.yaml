    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Dimension
      - Thesis Argument
      - Anti-Thesis Argument
      - What Would Change the View
    rows:
      - - Market Size
        - True $7B+ EAM/CMMS TAM with <20% digital penetration; reindustrialization tailwind
        - Market growth is incremental; SMEs churn faster than enterprise accounts
        - Disclosure of NRR >115% and ACV expansion above $25K would confirm enterprise stickiness
      - - Product Differentiation
        - AI-first, mobile-native platform with 27M work orders of training data creates defensible data moat
        - Rockwell (Fiix), SAP, and IFS are closing the AI feature gap with greater distribution
        - Third-party AI benchmark from Gartner or Forrester placing MaintainX ahead of incumbents
      - - Customer Proof
        - 11,000+ organizations, 34% claimed unplanned downtime reduction, G2 category leader
        - Majority of customers are SME/mid-market; limited disclosed enterprise logos
        - Disclosure of Fortune 500 or Global 2000 customer list; enterprise >$100K ARR percentage
      - - Financial Trajectory
        - 12x reported revenue growth from founding; $115.5M ARR with high-quality investor validation
        - No disclosed gross margin, NRR, or operating loss; burn rate unknown
        - Audited financials or S-1 filing with revenue, gross margin, and NRR disclosure
      - - Competitive Position
        - 'Category leadership in mobile-first CMMS; Verdantix benchmark recognition; G2 #1 rating'
        - CMMS market is fragmented with many capable alternatives at lower price points
        - Win-rate data above 60% against Fiix/UpKeep in enterprise deals
      - - Valuation Risk
        - 2.5x step-up in 18 months signals real growth; AI premium in SaaS is empirically supported
        - 21.6x ARR multiple is above the AI-native private SaaS ceiling; down-round risk is elevated
        - ARR growth confirmed >40% YoY and Rule of 40 above 50 would justify current mark
    notes: >-
