      - number: '4.2'
        title: Capital Structure, Funding History, and Use of Proceeds
        blocks:
          - type: paragraph
            body: >-
              MaintainX (CIK 0001762155, Delaware corporation) has raised a total of $254 million across at least four
              rounds of equity financing, all structured as Regulation D Rule 506(b) exempt offerings. The most recent
              and largest was a Series D round with a first sale date of 2025-03-20 and an SEC Form D filing date of
              2025-07-10, disclosing $149,749,979 raised from 13 accredited investors under accession number
              0001762155-25-000002. A separate special-purpose vehicle, FDC MaintainX LLC (CIK 0002078643), filed its
              own Form D on 2025-07-25 disclosing $4.2 million raised through Founders Circle Capital, a co-investor in
              the Series D.

              The Series D was co-led by Bessemer Venture Partners and Bain Capital Ventures (BCV), with participation
              from D.E. Shaw Ventures, Amity Ventures, August Capital, Founders Circle Capital, Sozo Ventures, Fifth
              Down Capital, and angels Rahul Mehta (DST Global co-founder) and Dave McJannet (Hashicorp CEO). The prior
              Series C was documented in a Form D filed 2024-01-05 (accession 0001762155-24-000001), covering Series B
              and C preferred stock with a first sale date of 2023-09-29 and total proceeds of approximately $50.0
              million from 17 investors. Bessemer Venture Partners first led MaintainX's Series B in 2021 and has
              participated in every subsequent round.

              The post-money valuation at the Series D was $2.5 billion, more than doubling the $1 billion valuation
              established at the Series C in late 2023. The Company's stated use of Series D proceeds is to accelerate
              AI and machine health monitoring capabilities, advance predictive maintenance solutions, develop
              enterprise asset management (EAM) features, and attract top technical and domain talent. No specific
              budget allocation by function or geography is publicly disclosed. With approximately $150 million raised,
              and no public disclosure of existing cash position or burn rate, the forward capital adequacy picture
              relies on inference rather than confirmed data. Burn-rate estimates for late-stage B2B SaaS companies of
              similar scale suggest monthly expenditure in the range of $5–15 million, implying an estimated runway of
              10–30 months from the Series D close date (July 2025), though this range is speculative absent audited
              financials.
