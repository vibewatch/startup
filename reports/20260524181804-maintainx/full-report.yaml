      - number: '7.2'
        title: Operational, Security & Platform Risks
        blocks:
          - type: paragraph
            body: >
              MaintainX's platform is entirely cloud-hosted and mobile-first, making operational risk synonymous with
              platform availability, data security, and dependency on internet connectivity. UpGuard's May 2026 vendor
              risk assessment gives MaintainX a score of 879 out of 950 (Grade A), indicating a well-maintained external
              attack surface. However, two specific misconfigurations were identified: the Content Security Policy is
              implemented with 'unsafe-inline' directives rather than strict nonces or hashes, elevating cross-site
              scripting (XSS) attack risk; and the X-Content-Type-Options HTTP header is missing the 'nosniff'
              directive, creating a MIME-confusion attack vector. Neither vulnerability has been linked to an observed
              breach or exploitation, and no public security incident has been reported as of May 2026. The MaintainX
              status page shows operational status through mid-May 2026 with no prolonged outages recorded. The
              platform's cloud dependency creates a structural exposure: users in poor Wi-Fi or offline environments
              report sync delays and data recording gaps. MaintainX provides an offline mode for mobile but its coverage
              is incomplete for complex work orders. The company does not publicly disclose whether it uses a
              multi-region or active-active cloud architecture, meaning a major AWS-region event could cause a full
              platform outage. Incident runbooks target 15-minute response times for critical integration failures.
              Customer operational data—asset inventories, work orders, personnel logs—represents sensitive operational
              IP whose loss or corruption would be materially disruptive to customers.
            claimRefs:
