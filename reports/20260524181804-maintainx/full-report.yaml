  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal & Compliance Risks
        blocks:
          - type: paragraph
            body: >
              MaintainX operates as a private SaaS company in jurisdictions subject to CCPA/CPRA, GDPR, and
              sector-specific regulations that touch its industrial and municipal customers. The company's only
              confirmed litigation history is a 2019 trademark suit by UpKeep Technologies, voluntarily dismissed within
              three months with no judgment or ongoing obligation. As of May 2026, there is no public record of any
              regulatory enforcement action, active lawsuit, or material IP dispute involving MaintainX Inc. the
              software company. The company holds SOC 2 Type II and ISO 27001:2022 certifications, which represent the
              operative compliance baseline for enterprise procurement. The most material prospective legal exposure
              arises from California's revised CCPA/CPRA rules effective January 2026, which require companies serving
              California consumers to conduct documented cybersecurity audits covering 18 program components, submit
              written certifications to the CPPA, and honor Global Privacy Control opt-out signals. GDPR exposure is
              real for MaintainX's growing European customer base; penalties can reach €20 million or 4% of global
              annual revenue for major violations. OSHA's 2026 GHS Revision 7 deadline (May 19, 2026) mandates
              customers' updated SDS documentation—creating an indirect compliance-workflow demand the MaintainX
              platform must serve. No environmental, export-control, or licensing risks have been identified. The
              private-company disclosure posture means audit reports and DPA terms require negotiation; enterprise
              buyers should request SOC 2 reports and execute Data Processing Agreements before go-live.
