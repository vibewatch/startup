      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Stretched Beyond Comparable Benchmarks
            body: >-
              MaintainX's $2.5B Series D mark implies a ~21.6x trailing ARR multiple. The SaaS Capital public index
              median is 6.4x; private SaaS M&A median is 4.5x (Aventis, 543 deals). Even the highest credible AI-native
              private SaaS ceiling is 10–15x. At current mark, any growth slowdown below 30% ARR creates significant
              down-round risk. Investors entering at this valuation require exceptional growth confirmation before the
              price can be defended.
            calloutType: risk
            claimRefs:
              - CV007
              - CV010
              - CV012
              - CV021
              - CV039
              - CV045
          - type: callout
            title: Top-Tier Institutional Validation and AI Narrative Premium
            body: >-
              The co-lead position of Bessemer Venture Partners and Bain Capital Ventures, combined with D.E. Shaw
              Ventures' participation, represents some of the highest-quality institutional signaling available in
              private markets. Bessemer publicly articulated MaintainX's "remarkable product-market fit" in the Series D
              announcement. The AI industrial operations narrative is well-timed: nearly 45% of global venture funding
              in 2025 flowed to AI-related companies. This institutional halo reduces near-term bankruptcy risk and
              validates the product narrative.
            calloutType: strength
            claimRefs:
              - CV003
              - CV031
              - CV042
          - type: callout
            title: Track at Current Valuation; Re-Entry Discipline Required
            body: >-
              The recommendation is Track. MaintainX is a high-quality company executing well in a genuine market with
              strong product-market fit. However, the $2.5B valuation is stretched and does not leave enough margin of
              safety for a high-conviction buy. An attractive entry would require either (a) disclosure of ARR >$200M
              with >40% growth and NRR >115%, making the current multiple defensible, or (b) a re-entry opportunity at
              10–12x ARR following a valuation reset. Monitor quarterly growth signals, enterprise customer
              announcements, and competitor AI feature launches.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV022
              - CV023
              - CV024
              - CV040
