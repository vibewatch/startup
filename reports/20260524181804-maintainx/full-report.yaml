  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              The CMMS and EAM software market in 2026 is served by at least four distinct competitor classes. Direct
              cloud-native peers—UpKeep, Limble, Fiix by Rockwell Automation, and eMaint by Fluke Corporation—contest
              the same maintenance teams and facilities management buyers that MaintainX targets. Legacy incumbents IBM
              Maximo and SAP EAM dominate large, asset-intensive enterprises requiring multi-site, compliance-heavy
              deployments and deep ERP integration. Adjacent substitutes include purpose-built EAM platforms (Eptura,
              IFS, Oracle EAM, Hexagon EAM), field-service tools (Salesforce ServiceMax), and the enduring status quo of
              spreadsheets and paper-based work orders that still account for a material fraction of facilities
              management workflows. Fracttal, a Madrid-based AI-maintenance platform, emerged as a funded competitor in
              2026 with $35M raised from Riverwood Capital and 1,500+ customers across 60 countries, representing an
              accelerating international threat in Latin America and Europe.

              Independent analyst validation anchors MaintainX's market standing. Verdantix's inaugural Green Quadrant:
              Industrial CMMS (2025) assessed 19 CMMS vendors and identified Brightly Software, eMaint, Eptura, Fiix by
              Rockwell Automation, IBM, Limble, and MaintainX as market leaders demonstrating the most advanced and
              comprehensive capabilities. IDC MarketScape (2024) separately named Fiix a Leader for SaaS CMMS, and
              Eptura was designated a global SaaS CMMS leader in August 2024. The concentration of analyst recognition
              across a handful of platforms indicates that the competitive field is consolidating at the top, though 19+
              vendors participated in the Verdantix assessment, illustrating the fragmentation that still prevails in
              the broader market. IBM Maximo's end-of-regular-support for its on-premise version 7.6.1 in September 2025
              creates migration pressure on legacy customers that modern cloud CMMS vendors, including MaintainX, are
              positioned to capture.
