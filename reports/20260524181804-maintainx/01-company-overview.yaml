callouts:
  - calloutType: strength
    title: "Dominant G2 Position and Tier-1 VC Backing"
    body: "MaintainX holds the #1 CMMS satisfaction score on G2 (perfect 100) and top-100 software globally recognition, corroborating strong product-market fit. Co-lead backing from both Bessemer Venture Partners and Bain Capital Ventures across multiple rounds signals durable institutional conviction."
    claimRefs: [CO013, CO031]

  - calloutType: risk
    title: "Private Financials and Conflicting Metric Estimates"
    body: "MaintainX is a private company that does not disclose audited financials. ARR estimates from third parties range from $73.5M to $115.5M; headcount estimates range from 600 to 1,000. Gross margin and net revenue retention are undisclosed. At a $2.5B valuation implying roughly 22x ARR (at the $115.5M estimate), the multiple is high and sensitive to the underlying revenue figure, making independent financial verification a critical diligence priority."
    claimRefs: [CO024, CO025]

  - calloutType: risk
    title: "Product Scalability Limitations at Enterprise Tier"
    body: "Independent CMMS review sites and user feedback in 2026 identify a two-level asset hierarchy cap, limited custom field reporting, and AI features gated to premium pricing tiers as structural limitations. These constrain MaintainX's competitiveness in complex industrial environments and may drive churn to deeper-capability competitors as customer operations scale."
    claimRefs: [CO039, CO040]

