company:
  name: MaintainX

chapter:
  number: 1
  title: Company Overview
  summary: "MaintainX is a San Francisco-based AI-powered CMMS and EAM platform founded in 2018 by four co-founders with a shared prior startup exit. The company has raised $254 million across five rounds, most recently a $150 million Series D at a $2.5 billion valuation (July 2025), and serves 14,000+ customers globally. Revenue reached an estimated $115.5 million ARR in 2025, and G2 and Deloitte recognition confirm rapid growth and market leadership in industrial maintenance software."

sections:
  - id: identity-and-business-model
    title: Identity and Business Model
    body: "MaintainX, Inc. is a private technology company headquartered at 185 Clara St., Suite 101C, San Francisco, CA 94107. Founded in 2018, the company provides an AI-powered Computerized Maintenance Management System (CMMS) and Enterprise Asset Management (EAM) platform purpose-built for industrial and frontline teams. The core product is mobile-first and cloud-based, targeting the roughly 2.7 billion deskless workers worldwide who manage physical assets in manufacturing, facilities management, food and beverage, distribution centers, and other asset-intensive industries. The platform digitizes work orders, preventive and predictive maintenance schedules, safety procedures, regulatory audits, and parts inventory management. Its revenue model is subscription SaaS with tiered pricing (Essential, Premium, Enterprise) and native integrations with SAP and other ERP systems. MaintainX holds SOC2 Type 2 Compliance and ISO/IEC 27001:2022 certification, and has earned the SAP Silver Partner designation as of 2026. The company's stated mission is to eliminate unplanned equipment downtime and transform frontline workers into data-driven knowledge workers through AI-assisted workflows."
    claimRefs: [CO001, CO002, CO003, CO004, CO034, CO037]
    figureRefs: [FO002]

  - id: leadership-and-governance
    title: Leadership and Governance
    body: "MaintainX was co-founded in 2018 by Chris Turlica (CEO), Hugo Dozois-Caouette (CTO), Mathieu Marengère-Gosselin (Head of Engineering), and Nick Haase (GTM/Sales). Before MaintainX, Turlica and Dozois-Caouette had built and sold a consumer messaging startup called Voo. Turlica, who holds a Finance degree from McGill University and served as an Entrepreneur in Residence at Deutsche Telekom Capital Partners, drives fundraising and commercial strategy. Dozois-Caouette earned his engineering degree from Université de Sherbrooke and previously worked at Fujitsu and Autodesk before co-founding Voo; under his technical leadership the platform has grown to nearly one million users. Marengère-Gosselin brings over a decade of engineering experience as the platform's first lead engineer. Haase leads community and growth efforts. The executive team has been complemented by Will Lehrmann as President and Tyson Gwaltney as Chief Growth Officer. Board directors include Byron Deeter (Bessemer Venture Partners), David Hornik (Lobby Capital/founding partner), CJ Reim (Amity Ventures), and Peter Yared. The founding team's prior shared startup experience and technical depth mitigate execution risk, but Chris Turlica and Hugo Dozois-Caouette are disproportionately prominent public faces, creating moderate key-person concentration. Control Engineering magazine named Dozois-Caouette a 2025 Engineering Leader Under 40."
    claimRefs: [CO005, CO006, CO007, CO008, CO019, CO044, CO045]
    tableRefs: [TO002]

  - id: funding-history-and-capital
    title: Funding History and Capital Structure
    body: "MaintainX closed its first institutional round—a $3.8 million Seed—in March 2019, led by August Capital and Amity Ventures. A previously undisclosed $11 million Series A followed later in 2019, also led by August Capital. The company announced a $39 million Series B in June 2021, led by Bessemer Venture Partners, at which time the company disclosed 12x revenue growth from early 2020 and a 98% customer retention rate. In December 2023 Bain Capital Ventures led a $50 million Series C, bringing total raised to $104 million and valuation to $1 billion (unicorn status), reflecting 13x revenue growth since the Series B. The Series C attracted strategic angel investors including former GE CEO Jeff Immelt, Twilio CEO Jeff Lawson, PagerDuty CEO Jennifer Tejada, and others. On July 9, 2025, MaintainX announced a $150 million Series D co-led by Bessemer Venture Partners and Bain Capital Ventures with participation from D.E. Shaw Ventures, Founders Circle Capital, Sozo Ventures, and Fifth Down Capital, plus angel investors Rahul Mehta and Dave McJannet. The Series D brought total raised to $254 million and valuation to $2.5 billion—more than doubling the Series C valuation in under two years. All rounds have been equity; no public evidence of secondary transactions or debt facilities has been identified. Diligence should verify cap-table waterfall and any undisclosed preferred-stock terms."
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO041, CO042]
    tableRefs: [TO003]

  - id: scale-traction-and-milestones
    title: Scale, Traction, and Milestones
    body: "As of July 2025 (Series D), MaintainX served over 11,000 companies globally managing 11 million assets; by 2026 the company's homepage reported 14,000+ customers and 14 million assets, reflecting continued growth. The platform processes over 27 million work orders and 370,000+ safety procedures annually. MaintainX has reported reducing customers' unplanned downtime by an average of 34% within the first 12 months of use, increasing production capacity by 15%, and achieving up to 32% savings in monthly maintenance costs—all company-claimed operational outcomes. An independent third-party data aggregator (Latka) pegged ARR at approximately $115.5 million as of September 2025. Employee count is approximately 1,000 per Forbes (March 2026), though other sources cited a range of 600–856. Revenue grew 13x from Series B to Series C and 12x in the prior post-pandemic period, consistent with the company's #82 ranking on the Deloitte Technology Fast 500 for fiscal year growth 2021–2024. Enterprise customers include Hunter Douglas, Cintas, Duracell, AB InBev, Univar, McDonald's, and Titan America. The platform has nearly 1 million users globally and holds a perfect 100 satisfaction score in CMMS on G2. In March 2026, MaintainX and Augury announced a closed-loop integration combining Augury's AI-driven machine health diagnostics with MaintainX's work order platform."
    claimRefs: [CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO035, CO036, CO043]
    tableRefs: [TO001, TO004]
    figureRefs: [FO001, FO003]

  - id: adverse-evidence-and-risk-factors
    title: Adverse Evidence and Risk Factors
    body: "The primary documented legal matter is a federal trademark lawsuit filed by Upkeep Technologies, Inc. in February 2019 (Case 4:19-cv-00857, U.S. District Court N.D. California). The case was terminated in May 2019 with no ongoing litigation found as of the run date. MaintainX, Inc. should not be confused with a separate Tampa-based 'MaintainX' entity that faced sexual harassment lawsuits—those records involve an unrelated maintenance services company. On the competitive front, independent 2026 CMMS review sites document structural product limitations: the platform's asset hierarchy is capped at two levels (Asset → Sub-asset), which frustrates complex industrial plant structures; custom fields cannot be added to reports; and AI predictive maintenance features are gated to premium pricing tiers ($49/user/month), while some competitors offer comparable AI capabilities at significantly lower entry prices. These constraints have driven documented user migration to alternatives including OxMaint, Limble CMMS, and UpKeep. ARR figures conflict across sources ($115.5 million vs. other estimates of ~$73.5 million), and MaintainX as a private company does not disclose audited financials, gross margin, or net revenue retention—all material gaps for valuation diligence."
    claimRefs: [CO038, CO039, CO040]

