  - id: valuation-context
    title: Valuation Context, Financing Structure, and Entry Discipline
    body: >-
      MaintainX's Series D, filed with the SEC on July 10, 2025 under accession
      0001762155-25-000002, reported $149,749,979 in new equity raised, establishing
      a post-money valuation of $2.5 billion and lifting total cumulative funding to
      $254 million. The round was co-led by Bain Capital Ventures and Bessemer Venture
      Partners, with participation from D.E. Shaw Ventures, Amity Ventures, August Capital,
      Founders Circle Capital, Sozo Ventures, Fifth Down Capital, and angels Rahul Mehta
      (DST Global) and Dave McJannet (HashiCorp). The valuation more than doubled from
      the $1 billion mark established in the December 2023 Series C, reflecting an implied
      2.5x step-up in under 18 months.

      The cap table structure contains standard 1x non-participating liquidation preferences
      across all preferred series. With $254M in cumulative preferred capital ahead of
      common stock, the liquidation overhang is material: in any exit below approximately
      $350–400M, preferred holders capture the majority of proceeds. At the $2.5B mark,
      the waterfall structure is not punitive for downstream investors at current price,
      but a 40–60% valuation reset would create significant preference absorption
      dynamics that dilute common shareholder and option-holder returns.

      Entry discipline matters at this stage. Investing at or near the $2.5B mark requires
      conviction that ARR will scale to $250M+ within 24 months to maintain a supportable
      EV/ARR ratio, or that a strategic acquirer pays a control premium above the current
      mark. Neither is impossible but both require execution on the aggressive side of
      guidance.
