  - id: exit-readiness
    title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
    body: >-
      MaintainX's exit readiness is intermediate. The company has top-tier VC sponsors,
      a growing SaaS customer base, and an attractive narrative around AI-driven industrial
      operations — all attributes that translate well to public market positioning.
      EquityZen and PremierAlts list MaintainX for pre-IPO secondary trading, signaling
      legitimate institutional demand for shares. The private equity "Great Unlocking"
      cycle that accelerated in January 2026 further improves the exit environment.

      However, the lack of disclosed operating metrics — burn rate, gross margin, NRR,
      operating leverage — limits the diligence case and would need to be remedied
      before a credible S-1 filing. The company has not signaled an IPO timeline publicly.
      A strategic acquisition by Honeywell, Emerson, Siemens, or a major ERP vendor
      remains plausible: the industrial IoT and EAM integration opportunity is compelling
      for large industrials seeking software-attached revenue streams.

      Thesis-break triggers include: ARR growth declining below 25% for two consecutive
      quarters; a major incumbent (Rockwell Automation, SAP, IFS) launching a credible
      mobile-first AI CMMS product at competitive price points; a data privacy or security
      incident affecting customer trust; or a down-round financing event that would confirm
      valuation compression and reset morale/option economics. Any of these would shift
      the recommendation from "track" to "avoid."
