callouts:
  - calloutType: strength
    title: "MaintainX's UX Moat Is Analyst-Validated"
    body: >
      Verdantix's 2025 Green Quadrant specifically highlighted MaintainX's built-in AI capabilities
      for smart work order creation and performance deviation detection as standout features among the
      seven CMMS leaders it identified. Combined with a 4.8/5 G2 score from 820+ reviews, MaintainX
      has built a demonstrably strong frontline adoption moat that gives it defensible retention in
      the SMB and mid-market segments.
    claimRefs:
      - CP005
      - CP004
      - CP037

  - calloutType: risk
    title: "Enterprise Feature Gap Poses Upmarket Displacement Risk"
    body: >
      Multiple independent reviewers (Facilio, Taqtics, swotanalysis Q4-2025) and user reviews on
      G2 and Capterra explicitly flag MaintainX's limited enterprise ERP integration depth, weak
      complex workflow automation, and gated analytics as vulnerabilities as the company pushes into
      Fortune 500 accounts. Meanwhile, Limble (Goldman Sachs backed, $450M valuation) and Fiix
      (Rockwell distribution) are better capitalized and better positioned for enterprise expansion
      respectively. The risk is not displacement at current SMB accounts but competition for the
      next growth tier.
    claimRefs:
      - CP024
      - CP025
      - CP038
      - CP009
      - CP015

