  evidenceGaps:
    - type: missing-source
      severity: material
      topic: maintainx-sam
      missingEvidence: "A credible independent analyst providing a specific, sourced SAM figure for cloud-native mobile-first CMMS (not the broader $10–25B BVP definition) with defined segment and geographic scope."
      whyItMatters: "The wide SAM range ($10–25B) conflates CMMS, EAM, and broader workflow spend; investors need a defensible constrained estimate to assess MaintainX's market penetration rate and growth ceiling."
      diligencePath: "Request MaintainX's internal TAM/SAM model; cross-check against IDC or Gartner cloud-CMMS-only revenue data; triangulate with bottom-up per-segment calculation using disclosed customer counts and ARR."
      relatedQuestionRefs: [QM020]

    - type: private-evidence-only
      severity: material
      topic: maintainx-revenue
      missingEvidence: "Independently verified MaintainX ARR figure with audited growth rate to validate the ~$115M estimate used in the SOM calculation."
      whyItMatters: "Without independently verified ARR, the market penetration narrative rests on unaudited company claims; accuracy affects confidence in SOM penetration rate and valuation runway assessment."
      diligencePath: "Request audited financials or independently sourced ARR from SaaS databases such as Latka, Sacra, or similar; alternatively cross-check against disclosed headcount-to-revenue ratios in the sector."
      relatedQuestionRefs: [QM026]

    - type: conflicting-data
      severity: minor
      topic: cmms-market-sizing
