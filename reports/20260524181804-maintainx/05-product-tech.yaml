  - id: tech-architecture-integrations
    title: Technical Architecture and Integration Ecosystem
    body: >
      MaintainX's public-facing architecture signals a cloud-hosted multi-tenant SaaS deployment.
      Its status page exposes four service tiers: MaintainX Application, REST API, GraphQL API,
      and REST API Documentation—confirming a dual-API architecture that supports both synchronous
      REST integrations and query-flexible GraphQL endpoints. Authentication uses API key or JWT
      tokens issued from the MaintainX dashboard's integrations page. The OpenAPI/Swagger
      specification is publicly available. Composio's AI toolkit integrates 30 discrete MaintainX
      API tools spanning work order creation, asset operations, user management, location
      management, procedure templates, and cost retrieval as of April 2026.

      On the integration side, MaintainX offers three pathways: self-serve via Zapier and Make.com
      (connecting 7,000+ SaaS apps with no-code automation), MX Integration Services (managed
      implementation by MaintainX's own team), and direct API/systems integrator engagements.
      MaintainX is a SAP Silver Partner with certified integrations for SAP S/4HANA Public Cloud,
      SAP S/4HANA Private Cloud, and SAP ECC—syncing work orders, parts inventory, purchase
      orders, and KPIs bidirectionally. The MachineMetrics IIoT integration requires Premium tier
      for work-order creation and Enterprise for meter updates, demonstrating that deeper
      machine-connectivity features carry a tier premium. The platform supports IoT connectivity
      through Zapier webhooks, direct API, and certified plug-and-play partnerships with machine
      health monitoring vendors. MaintainX's GitHub organization hosts 9 utility repositories
      (Yarn plugins, React components) but does not expose core application source code, limiting
      external developer insight into architecture.
