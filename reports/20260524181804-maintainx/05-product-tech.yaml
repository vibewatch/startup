chapter:
  number: 5
  title: Product & Technology
  summary: >
    MaintainX delivers a cloud-native CMMS and EAM platform centered on mobile-first work-order
    execution, preventive and predictive maintenance, asset management, and AI-powered reporting.
    Its integration ecosystem spans SAP ERP systems (Silver Partner), IoT sensor networks (Augury,
    KCF Technologies), and 7,000+ apps via Zapier. The platform holds SOC 2 Type II, ISO
    27001:2022, and GDPR certifications, and reports 100% uptime over 90 days as of May 2026.
    MaintainX earned G2's #1 CMMS ranking for four consecutive quarters and a perfect 100
    satisfaction score. Differentiation rests on fast deployment, mobile UX, and a growing AI
    layer—but advanced workflow controls, formal 21 CFR compliance, and API access remain gated
    behind higher-tier plans.

sections:
  - id: product-modules-workflow
    title: Product Modules and Customer Workflow
    body: >
      MaintainX is a cloud-native, mobile-first CMMS and EAM platform that serves industrial and
      frontline maintenance teams by digitizing the full maintenance work cycle—from work request
      submission through completion and asset history logging. The platform's core workflow unit is
      the Work Order, which supports creation, assignment, prioritization, photo and checklist
      attachment, and real-time status tracking. Six integrated product modules address distinct
      user jobs: Work Orders (reactive and proactive execution), Preventive Maintenance (time,
      meter, and condition-based scheduling), Asset Management (lifecycle tracking, QR/barcode
      scan, maintenance history), Inventory and Parts (stock level monitoring, automated re-order
      alerts, AI-predicted part needs), Procedures and SOPs (embedded checklists and safety
      instructions), and Reporting and Analytics (prebuilt dashboards and the 2026-launched Report
      Builder AI).

      The platform is offered across four tiers: free Basic (unlimited work orders, 2 attached
      procedures), paid Essential at $20/user/month annually, Premium at $65/user/month annually
      (adds meter-based maintenance, inventory, and purchase order management, plus API access),
      and custom Enterprise (IoT integrations, multi-site governance, SSO, advanced permissions,
      CoPilot AI features). Over 14,000 companies use MaintainX. The mobile app for iOS (12.4+)
      and Android (5.0+) supports offline caching of assigned work orders, enabling technicians in
      areas with poor connectivity to continue updating tasks; changes sync automatically when
      connectivity is restored. Users in competitive analyses note that creating brand-new work
      orders requires internet connectivity, and that advanced workflow approvals are restricted
      to Premium and Enterprise tiers.
