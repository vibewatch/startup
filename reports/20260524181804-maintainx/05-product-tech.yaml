  - id: trust-security-compliance
    title: Trust, Security, Compliance, and Reliability
    body: >
      MaintainX holds three externally validated security certifications as of May 2026: SOC 2
      Type II (attested by an independent CPA firm across Security, Availability, Processing
      Integrity, Confidentiality, and Privacy criteria), ISO 27001:2022 (certified by Insight
      Assurance for the MaintainX platform and its Montreal office), and GDPR readiness
      (including data protection policies, retention and deletion controls, and cookie
      transparency). The Security Center page confirms additional controls: data encryption,
      unique authentication, disaster recovery planning, cybersecurity insurance, and penetration
      testing. SSO, custom permissions, and role-based access controls are available at Enterprise
      tier.

      The MaintainX status page records 100% uptime across the Application, REST API, GraphQL
      API, and Website over the 90-day window ending May 24, 2026, with no incidents reported for
      May 24, 2026. A Trust Center is accessible at trust.getmaintainx.com (requires JavaScript
      to render compliance report content). From a regulatory compliance perspective, MaintainX
      offers OSHA and FDA-adjacent checklist support, but formal 21 CFR Part 11 compliance for
      pharmaceutical electronic records is not built in—an identified gap relative to Limble's
      optional Enterprise 21 CFR package. Users citing SAP PM migration also note the platform
      lacks strategy plans and maintenance plan schedule overviews available in heavier ERP-native
      tools.
    claimRefs:
      - CE024
      - CE025
