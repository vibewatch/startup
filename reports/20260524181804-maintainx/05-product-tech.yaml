callouts:
  - calloutType: strength
    title: G2 #1 CMMS and Perfect Satisfaction Score
    body: >
      MaintainX earned the G2 #1 CMMS ranking for the fourth consecutive quarter in Spring 2026,
      including #1 in Enterprise CMMS and Facility Management (tenth consecutive quarter), with a
      perfect 100% customer satisfaction score. It was also named to G2's 2026 Best Software
      Awards top 100 globally. These achievements reflect broad customer validation of its mobile-
      first UX and fast time-to-value—a durable competitive signal in a market where adoption
      friction is high.
    claimRefs:
      - CE028
      - CE029
      - CE030

  - calloutType: risk
    title: AI and IoT Features Require Third-Party Sensor Platforms
    body: >
      MaintainX's predictive maintenance capabilities depend on integrations with Augury, KCF
      Technologies, and MachineMetrics for the actual sensing and anomaly-detection layer. The
      company does not own or manufacture industrial sensors. This creates a dependency risk: value
      delivery to enterprise reliability customers requires customers to also license and deploy
      third-party machine health platforms, adding procurement complexity and vendor exposure. If
      competing platforms (e.g., Fiix backed by Rockwell Automation) develop tighter OEM sensor
      bundles, MaintainX's condition-based maintenance differentiation may narrow.
    claimRefs:
      - CE020
      - CE021
      - CE042

  - calloutType: risk
    title: Feature Gating Limits Mid-Market Product Depth
    body: >
      Critical capabilities—API access, meter-based maintenance, inventory management, IoT
      integrations, Report Builder AI, and Root Cause Analysis—are gated at Premium ($65/user/month)
      or Enterprise (custom). This tier structure accelerates revenue per seat but creates a
      product ceiling for customers who start on lower tiers and discover key features require
      a 3× pricing step-up. Reviewers migrating from SAP PM note missing strategy plans and
      maintenance plan schedule overviews, and the absence of formal 21 CFR support limits
      expansion into pharmaceutical manufacturing.
    claimRefs:
      - CE033
      - CE034
      - CE035
      - CE036

