companyProfile:
  summary: >-
    MaintainX is a San Francisco-based industrial operations software company founded in 2018 by
    Chris Turlica, Hugo Dozois-Caouette, Mathieu Marengère-Gosselin, and Nick Haase. The company
    sells a mobile-first CMMS and EAM platform used to manage work orders, preventive maintenance,
    asset health, safety procedures, and parts inventory for industrial and frontline teams. As of
    2026 public sources indicate 14,000+ customers, roughly 1,000 employees, and $254M of capital
    raised, including a $150M Series D at a $2.5B valuation in July 2025. Public diligence is still
    limited by the absence of audited financial disclosure.
  foundedDate: "2018-01-01"
  founders:
    - name: "Chris Turlica"
      role: "CEO & Co-Founder"
      background: "Former Entrepreneur in Residence at Deutsche Telekom Capital Partners and co-founder of Voo; leads fundraising and commercial strategy."
      claimRefs: [CO005, CO007]
    - name: "Hugo Dozois-Caouette"
      role: "CTO & Co-Founder"
      background: "Former Fujitsu and Autodesk engineer who co-founded Voo before leading MaintainX technical strategy."
      claimRefs: [CO005, CO008]
    - name: "Mathieu Marengère-Gosselin"
      role: "Co-Founder, Head of Engineering"
      background: "Early engineering leader with deep product and platform continuity from MaintainX's founding period."
      claimRefs: [CO005]
    - name: "Nick Haase"
      role: "Co-Founder, GTM / Growth"
      background: "Leads growth and go-to-market efforts for MaintainX's frontline operations platform."
      claimRefs: [CO005]
  foundingLocation: "San Francisco, California"
  headquarters: "San Francisco, CA"
  productSummary: >-
    MaintainX provides subscription software for industrial maintenance and operations teams,
    combining mobile work-order management, preventive and predictive maintenance, asset tracking,
    standard operating procedures, inventory, analytics, and AI-assisted troubleshooting.
  customerFocus: >-
    Frontline-heavy, asset-intensive organizations in manufacturing, food and beverage, facilities,
    distribution, and related industrial environments, spanning SMB to enterprise accounts.
  businessModel: >-
    Subscription SaaS sold on a per-user basis with tiered plans, custom enterprise pricing, and
    free requester seats that support broad plant-floor adoption.
  stage: "Series D"
  fundingStatus: >-
