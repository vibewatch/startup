    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              MaintainX, Inc. 是一家私营科技公司，总部位于 185 Clara St., Suite 101C, San Francisco, CA 94107。公司成立于 2018 年，提供一套由 AI
              驱动的计算机化维护管理系统（CMMS）和企业资产管理（EAM）平台， 专为工业和一线团队设计。核心产品移动优先、基于云，瞄准全球约 2.7 billion 名不坐办公室的员工；他们在制造、设施管理、
              食品饮料、配送中心和其他资产密集行业里管理实物资产。平台把工单、预防性与预测性维护计划、安全流程、监管审计和备件库存管理数字化。 收入模式是分层定价的订阅
              SaaS（Essential、Premium、Enterprise），并原生集成 SAP 等 ERP 系统。MaintainX 持有 SOC2 Type 2 Compliance 和 ISO/IEC
              27001:2022 认证，截至 2026 年已获得 SAP Silver Partner 身份。公司宣称的使命，是借助 AI 辅助工作流消除计划外设备停机，并把一线员工转变为数据驱动的知识型员工。
