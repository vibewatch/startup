  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 分析影响
      - 严重程度
      - 具体尽调路径
    rows:
      - - 经审计收入 / ARR
        - 没有公司确认的数据，无法核实增长率、收入质量或估值倍数
        - 阻断
        - 在 NDA 下索取最近 2 年经审计财报，或董事会批准的 ARR 明细
      - - 毛利率（产品与综合）
        - 无法判断单位盈利能力或服务交付成本结构；类似公司的 CMMS 毛利率区间通常为 60–80%
        - 重大
        - 索取按收入类型和 COGS 构成拆分的 GAAP 利润表
      - - 净收入留存（NRR）
        - 高 NRR 才能支撑高估值；缺少该指标，留存质量和扩张引擎都无法验证
        - 重大
        - 按获客批次、客户段（SMB vs. Enterprise）和地域索取客户分群级 NRR
      - - CAC 回收期
        - 无法验证 S&M 效率，也无法判断持续增长需要多少资本
        - 重大
        - 索取综合 CAC、按渠道拆分的全口径 CAC、ACV，以及按客户分群计算的毛利率
      - - 月度经营烧钱和现金余额
        - 无法判断资金是否充足、现金跑道还剩多久；对评估意外过桥融资风险至关重要
        - 阻断
        - 索取过去 12 个月 P&L、现金流量表，以及最近月末银行余额
      - - 企业客户 ACV 与折扣政策
        - 无法判断收入集中风险，也无法评估定价纪律
        - 重大
        - 索取按客户层级拆分的 ACV 分布，以及匿名化前 10 大客户收入贡献
    notes: 所有缺口都源于没有公开提交的财务报表。严重程度按其对投资判断的影响评定。尽调路径假设 双方已签署标准 NDA，且公司正在主动融资或推进 M&A。
    claimRefs:
      - CI027
      - CI038
      - CI039
