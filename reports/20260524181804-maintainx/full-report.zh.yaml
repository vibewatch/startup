      - number: '5.2'
        title: 技术架构与集成生态
        blocks:
          - type: paragraph
            body: >
              MaintainX 对外呈现的架构指向云托管、多租户 SaaS 部署。状态页暴露四个服务层：MaintainX Application、REST API、GraphQL API 和 REST API
              Documentation——确认其双 API 架构，既支持同步 REST 集成，也支持查询更灵活的 GraphQL 端点。认证使用从 MaintainX 仪表盘集成页面签发的 API key 或 JWT
              token。OpenAPI/Swagger 规范公开可用。截至 April 2026，Composio 的 AI 工具包集成了 30 个独立 MaintainX API
              工具，覆盖工单创建、资产操作、用户管理、位置管理、流程模板和成本检索。

              集成侧，MaintainX 提供三条路径：通过 Zapier 和 Make.com 自助连接（以无代码自动化接入 7,000+ SaaS 应用）、MX Integration Services（由
              MaintainX 自有团队托管实施），以及直接 API / 系统集成商项目。MaintainX 是 SAP Silver Partner，拥有面向 SAP S/4HANA Public Cloud、SAP
              S/4HANA Private Cloud 和 SAP ECC 的认证集成，可双向同步工单、零件库存、采购订单和 KPI。MachineMetrics IIoT 集成要求 Premium
              档才能创建工单、Enterprise 档才能更新仪表，说明更深的机器连接能力带有档位溢价。平台通过 Zapier webhooks、直接 API，以及与机器健康监测厂商的认证即插即用合作支持 IoT
              连接。MaintainX 的 GitHub 组织托管 9 个工具仓库（Yarn 插件、React 组件），但不公开核心应用源码，外部开发者因而难以看清底层架构。
