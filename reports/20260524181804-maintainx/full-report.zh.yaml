  - id: TR005
    title: 退出标准与监测触发器
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 企业客户流失加速
        - 净留存率（NRR）下降
        - NRR 连续两个季度 < 90%
        - 投资逻辑破裂：重新评估需求韧性；考虑减仓
      - - AI 原生对手带来的竞争替代
        - Gartner/G2 同行调查中的市场份额数据
        - Tractian、Facilio 或 Limble 拿下 MaintainX 核心细分市场 >20% 份额
        - 下调信心；监测产品路线图响应
      - - 监管执法行动
        - SEC、州总检察长或数据监管机构执法通知
        - 任何点名 MaintainX 的公开执法行动
        - 立即全面重评；监测客户反应
      - - 云基础设施故障事件
        - 状态页确认 AWS 或平台宕机超过 4 小时
        - 客户提出 SLA 违约主张，或公开披露事故
        - 监测；要求披露多区域灾备策略，作为继续持有的条件
      - - 数据泄露或安全事件
        - GDPR/CCPA 泄露通知或公开披露
        - 向监管机构或客户通知重大泄露
        - 全面评估法律和声誉风险；审查 SOC 2 响应
      - - IPO 延迟 / 流动性失败
        - 无 IPO 或战略 M&A 事件
        - 到 2028 年底仍无流动性事件
        - 结合基金约束重评退出时间线；评估二级市场或 PE 买方
      - - 烧钱速度上升但收入未同比例增长
        - 季度烧钱额与 ARR 增长代理指标对比
        - 未宣布新融资时，隐含现金跑道降至 12 个月以下
        - 要求财务披露；加快现金状况尽调
    notes: 退出标准阈值是建议的尽调锚点，并非公司已确认目标。MaintainX 不公开披露 NRR、烧钱速度或企业账户集中度。
