      - number: '8.2'
        title: 估值背景、融资结构与入场纪律
        blocks:
          - type: paragraph
            body: >-
              MaintainX 的 Series D 于 July 10, 2025 向 SEC 备案，备案编号 0001762155-25-000002，报告新增股权融资 $149,749,979，确立 $2.5
              billion 投后估值，并将累计融资提高到 $254 million。本轮由 Bain Capital Ventures 和 Bessemer Venture Partners 共同领投，D.E. Shaw
              Ventures、Amity Ventures、August Capital、Founders Circle Capital、Sozo Ventures、Fifth Down Capital，以及天使投资人
              Rahul Mehta（DST Global）和 Dave McJannet（HashiCorp）参与。估值较 December 2023 Series C 确立的 $1 billion 标记翻倍以上，意味着不到
              18 个月内隐含 2.5x 跃升。

              股权结构表包含各优先股系列标准的 1x 不参与分配清算优先权。普通股前面有 $254M 累计优先资本，清算悬挂不轻：任何低于约 $350–400M 的退出中，优先股持有人会拿走多数回款。在 $2.5B
              标记下，分配瀑布结构对按当前价格入场的后续投资人并不惩罚；但如果估值重置 40–60%，偏好吸收机制会显著稀释普通股股东和期权持有人回报。

              这个阶段需要入场纪律。按或接近 $2.5B 标记投资，必须相信 ARR 能在 24 个月内扩到 $250M+，以维持可支撑的 EV/ARR
              比率；或者相信战略收购方会在当前标记之上支付控制权溢价。两者都不是不可能，但都要求执行明显偏激进。
