          - type: callout
            title: 财务承销所需最低尽调包
            body: >-
              任何投资或企业合作评估都必须取得：（1）过去两个财年的经审计 ARR 和收入；（2）按套餐拆分的毛利率；（3）至少两个年度队列的 NRR；（4）按渠道混合的 CAC 回本周期；（5）过去 12 个月 P&L
              和现金状况；（6）ACV 分布以及前 10 大客户收入集中度。 缺少这些，财务分析只能完全依赖第三方推断和公司控制的营销说法。
