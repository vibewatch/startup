          - type: callout
            title: AI 与 IoT 功能依赖第三方传感器平台
            body: >
              MaintainX 的预测性维护能力依赖与 Augury、KCF Technologies 和 MachineMetrics
              的集成，实际传感和异常检测层由这些平台提供。公司不拥有也不制造工业传感器。由此产生依赖风险：要向企业可靠性客户交付价值，客户还必须授权和部署第三方机器健康平台，增加采购复杂度和供应商暴露。如果竞品平台（例如
              Rockwell Automation 支持的 Fiix）做出更紧的 OEM 传感器套装，MaintainX 在基于状态维护上的差异化可能收窄。
