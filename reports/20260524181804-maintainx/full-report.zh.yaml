            title: G2 领先地位与一线 VC 背书
            body: >-
              MaintainX 在 G2 的 CMMS 满意度得分排名 #1（满分 100），并获全球软件前 100 认可，印证了强产品市场匹配。Bessemer Venture Partners 和 Bain
              Capital Ventures 多轮共同领投，说明机构信心具有持续性。
            calloutType: strength
            claimRefs:
              - CO013
              - CO031
          - type: callout
            title: 私营财务与相互冲突的指标估计
            body: >-
              MaintainX 是私营公司，不披露经审计财务。第三方 ARR 估计区间为 $73.5M 至 $115.5M；员工数估计区间为 600 至 1,000。毛利率和净留存率未披露。按 $2.5B 估值计算，若采用
              $115.5M 估计值，隐含约 22x ARR；这个倍数偏高， 且对基础收入数字高度敏感，因此独立财务核验是关键尽调优先事项。
            calloutType: risk
            claimRefs:
              - CO024
              - CO025
          - type: callout
            title: 企业级产品扩展性存在限制
            body: >-
              2026 年独立 CMMS 评测网站和用户反馈指出，两级资产层级上限、自定义字段报表受限、AI 功能锁在高价套餐之后，是结构性限制。 客户运营规模扩大后，上述限制会削弱 MaintainX
              在复杂工业环境中的竞争力，并可能把客户推向能力更深的竞争对手。
            calloutType: risk
            claimRefs:
