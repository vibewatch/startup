      - number: '1.2'
        title: 管理团队与治理
        blocks:
          - type: paragraph
            body: >-
              MaintainX 由 Chris Turlica（CEO）、Hugo Dozois-Caouette（CTO）、Mathieu Marengère-Gosselin（工程负责人）和 Nick
              Haase（GTM/销售）于 2018 年联合创立。在 MaintainX 之前， Turlica 和 Dozois-Caouette 创办并出售了消费消息初创公司 Voo。Turlica 拥有 McGill
              University 金融学位， 曾任 Deutsche Telekom Capital Partners 驻场企业家，主导融资和商业战略。Dozois-Caouette 毕业于 Université de
              Sherbrooke 工程专业，在联合创办 Voo 前曾任职 Fujitsu 和 Autodesk；在他的技术领导下，平台用户数已接近 1 million。Marengère-Gosselin
              是平台第一位首席工程师，拥有超过十年工程经验。Haase 负责社区和增长。高管团队又引入 Will Lehrmann 担任总裁、Tyson Gwaltney 担任首席增长官。董事包括 Byron
              Deeter（Bessemer Venture Partners）、 David Hornik（Lobby Capital/创始合伙人）、CJ Reim（Amity Ventures）和 Peter
              Yared。创始团队此前共同创业的经历和技术深度降低了执行风险， 但 Chris Turlica 和 Hugo Dozois-Caouette 在公开叙事中过于突出，形成中等程度的关键人物集中。Control
              Engineering 杂志将 Dozois-Caouette 评为 2025 Engineering Leader Under 40。
