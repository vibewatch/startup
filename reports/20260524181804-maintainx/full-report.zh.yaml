      - number: '8.4'
        title: 情景分析、回报潜力与概率信号
        blocks:
          - type: paragraph
            body: >-
              乐观情景：ARR 每年增长 45–50%，到 2026 年底达到 $250M，到 2027 年底达到 $375M。NRR 超过 120%，Rule of 40 得分越过 45，公司证明通向 20%+
              运营利润率的路径。在这个情景下，2027–2028 IPO 或战略收购给出 12–15x ARR 退出倍数，隐含估值为 $4.5–5.6B——相当于 Series D $2.5B 标记上的 1.8–2.2x
              回报。概率信号：如果 Q3/Q4 2026 ARR 增长保持在 40% 以上，则信号强。

              基准情景：ARR 每年增长 30–35%，到 2026 年底达到 $200M。AI 加持的纵向 SaaS 增长稳健，倍数回归到 10–12x ARR，隐含 2027 估值为
              $2.0–2.4B。相较当前标记，这基本是持平到小幅下行——对 Series D 投资人是保值情景，但不是强回报。IPO 窗口延至 2028–2029，因为公司需要改善利润率画像，才更能吸引公共市场胃口。

              悲观情景：ARR 增速因竞争替代、工业 capex 宏观回落或客户流失降至 15–20%。增长溢价消散后，倍数压缩到 5–7x。隐含估值降至 $750M–$1.2B——较当前标记下降
              50–70%，形成下轮降估值融资情景。优先股清算优先权先吸收前 $254M 回款，普通股股东和后续系列优先股面临显著减记风险。
