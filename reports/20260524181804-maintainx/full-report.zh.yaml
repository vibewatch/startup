            title: AI 功能分档制造 SMB 向企业档过渡风险
            body: >
              MaintainX 将最先进的 AI 能力（CoPilot、预测性维护、IoT 分析）全部锁在定制定价的 Enterprise 档。这给 SMB
              和中端市场客户制造了结构性留存风险：他们在低价档会撞上功能天花板；如果企业定价门槛超过客户支付意愿，增购速度也会受限。随着 Tractian、Facilio 和 AI 原生新进入者把 AI
