  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              MaintainX 的收入完全来自按用户、按月计费的 SaaS 订阅模式。定价阶梯有四层。Basic 套餐免费，为小团队提供无限工单和无限请求者用户席位，
              但分析访问限制在一个月，重复工单和附带流程的任务也受限。Essential 层按年计费为每授权用户每月 $20，按月计费为 $25，可解锁无限重复工单、
              完整图片附件和三个月分析访问，但不包括库存管理、采购订单模块和 API 访问。Premium 层按年为每用户每月 $65，按月为 $75， 增加完整分析、备件库存、采购订单管理、REST
              API、基于仪表读数的维护、工时和成本追踪，以及专属客户经理。Enterprise 定制定价， 包括 IoT 传感器集成、升级协议、单点登录、多站点管理和 MaintainX CoPilot AI
              模块。Requester 账户由提交工作请求但不管理请求的员工使用， 各层级均免费，使组织能够大范围部署，而无需为非管理人员支付席位成本。

              免费 Basic 层带来的产品驱动增长（PLG）入口，为小型和中端设施团队拉动漏斗顶部采用；升级触发点通常是库存管理需求（Premium）或企业治理功能（Enterprise）。 PricingNow 的
              2026 年基准显示，MaintainX 成本比 eMaint（$110/user/month）等可比 CMMS 平台平均低约 59%，
              凸显价值型定价定位。收入确认模式基于订阅，按年计费会预收现金，相比仅按月计费改善短期现金转化。年度计费也把客户锁进全年承诺，降低流失风险。 Premium 层在大型企业账户中会显著放大单用户收入；一个 50 用户
              Premium 客户按年付费，标价收入为每年 $39,000。平均合同价值（ACV）、 企业折扣率、实际平均每用户收入（ARPU）相对标价水平，均未公开披露，而这些都是承销的关键输入。
