      - number: '4.2'
        title: 资本结构、融资历史与资金用途
        blocks:
          - type: paragraph
            body: >-
              MaintainX（CIK 0001762155，Delaware 注册公司）至少通过四轮股权融资累计筹集 $254 million，所有融资均采用 Regulation D Rule 506(b)
              豁免发行结构。最近且规模最大的是 Series D 轮，首次出售日期为 2025-03-20，SEC Form D 申报日期为 2025-07-10；文件披露向 13 名合格投资者融资
              $149,749,979，档案号为 0001762155-25-000002。另一个特殊目的载体 FDC MaintainX LLC（CIK 0002078643）在 2025-07-25 提交自身 Form
              D，披露通过 Series D 共同投资方 Founders Circle Capital 融资 $4.2 million。

              Series D 由 Bessemer Venture Partners 和 Bain Capital Ventures（BCV）共同领投，D.E. Shaw Ventures、 Amity
              Ventures、August Capital、Founders Circle Capital、Sozo Ventures、Fifth Down Capital，以及天使 Rahul Mehta（DST
              Global 联合创始人）和 Dave McJannet（Hashicorp CEO）参投。此前 Series C 记录在 2024-01-05 提交的 Form D（档案号
              0001762155-24-000001）中，覆盖 Series B 和 C 优先股，首次出售日期为 2023-09-29，17 名投资者总认购额约 $50.0 million。Bessemer Venture
              Partners 先是在 2021 年领投 MaintainX 的 Series B，此后每一轮都参与。

              Series D 投后估值为 $2.5 billion，比 2023 年底 Series C 确立的 $1 billion 估值翻了一倍以上。公司称 Series D 资金用途是加速 AI
              和机器健康监测能力、推进预测性维护解决方案、开发企业资产管理（EAM）功能，并吸引顶尖技术与领域人才。 公司未公开按职能或地域拆分的具体预算分配。公司融资约 $150
              million，但现有现金余额或烧钱速度未披露，因此未来资本充足性更多依赖推断而非确认数据。 同规模后期 B2B SaaS 公司的烧钱速度估计显示，每月支出区间为 $5–15 million，意味着自
              Series D 交割日（2025 年 7 月）起估计现金跑道为 10–30 个月；不过在缺少经审计财务的情况下，这一区间仍属推测。
