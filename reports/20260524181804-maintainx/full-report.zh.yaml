  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与格局
        blocks:
          - type: paragraph
            body: >-
              MaintainX 处在计算机化维护管理系统（CMMS）和企业资产管理（EAM）的交叉点竞争。这两个软件分支相关但不同，共同服务于实物资产维护的数字化。 CMMS
              软件为一线维护团队自动化工单、预防性维护排期和资产追踪。EAM 则延伸到完整资产生命周期管理，包括大型企业的资本开支规划、折旧和合规审计轨迹。 MaintainX
              横跨两个类别，提供云原生、移动优先的平台，定位于服务从 SMB 到企业级规模的工业和设施维护团队。

              市场边界包括云端和本地部署的 CMMS/EAM 软件许可证、SaaS 订阅收入、与维护平台部署绑定的专业服务，以及内嵌预测分析模块。 核心 CMMS/EAM 定义排除了完整企业 ERP
              套件（SAP、Oracle、IBM）、独立现场服务管理（FSM）软件和独立 IoT 传感器硬件， 尽管三者都是重叠度很高的相邻市场。IWMS（Integrated Workplace Management
              Systems）市场在 2026 年价值 $6.59B， 是一个重要邻近市场，聚焦设施层面的空间管理和可持续合规；MaintainX 主要在维护执行上与其重叠。

              现状替代方案仍是手工流程——电子表格、纸质工单和夹板——它们在小型和中型运营里仍占主导。Maintainly 汇总的调查数据显示，2026 年约 41%
              的工业设施仍没有集中式维护软件。这片庞大的纸张和电子表格存量，是 MaintainX 最主要的替代机会。IBM Maximo、SAP EAM 和 Oracle EAM
              等传统企业平台主导大型企业市场，既是云原生进入者的替换目标，也是竞争逆风。
