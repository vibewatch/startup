            title: 收入不透明——无经审计财务，第三方估计相互冲突
            body: >-
              MaintainX 不发布经审计财务报表。第三方收入估计从 $73.5 million（RocketReach，2026）到 $115.5 million （Growjo，2025），相差
              57%。叠加毛利率、NRR 和烧钱速度未披露，$2.5 billion 估值无法独立验证。隐含收入倍数 21.6–34×，显著高于 SaaS 行业 7–10× 中位数，必须由只有在 NDA
              下才能取得的增长率和留存数据支撑。
            calloutType: risk
