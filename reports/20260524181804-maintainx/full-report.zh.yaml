  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块与客户工作流
        blocks:
          - type: paragraph
            body: >
              MaintainX 是云原生、移动优先的 CMMS 和 EAM 平台，面向工业与一线维护团队，把从提交维护请求、执行到记录资产历史的完整维护周期数字化。平台的核心工作单元是 Work
              Order，支持创建、分派、优先级排序、附加照片和检查清单，以及实时状态跟踪。六个集成产品模块对应不同用户任务：Work Orders（响应式和主动执行）、Preventive
              Maintenance（按时间、仪表和状态排程）、Asset Management（生命周期跟踪、QR/条码扫描、维护历史）、Inventory and Parts（库存水位监控、自动补货提醒、AI
              预测零件需求）、Procedures and SOPs（嵌入式检查清单和安全指引），以及 Reporting and Analytics（预置仪表盘和 2026 年推出的 Report Builder AI）。

              平台分为四档：免费的 Basic（不限量工单、2 个附加流程）、付费 Essential（年付 $20/user/month）、Premium（年付
              $65/user/month，增加基于仪表的维护、库存和采购订单管理，以及 API 访问），以及定制 Enterprise（IoT 集成、多站点治理、SSO、高级权限、CoPilot AI 功能）。超过
              14,000 家公司使用 MaintainX。iOS（12.4+）和
              Android（5.0+）移动应用支持已分派工单离线缓存，技术员在网络差的区域仍可继续更新任务；连接恢复后，变更会自动同步。竞品分析中的用户指出，新建全新工单需要互联网连接，高级工作流审批也只开放给
              Premium 和 Enterprise 档。
