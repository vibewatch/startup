        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 7 月（Series D），MaintainX 在全球服务 11,000 多家公司，管理 11 million 项资产；到 2026 年， 公司官网披露客户 14,000+ 家、资产 14
              million 项，显示增长仍在延续。平台每年处理超过 27 million 张工单和 370,000+ 条安全流程。MaintainX 称，客户使用后前 12 个月内，计划外停机平均减少 34%，产能提升
              15%，每月维护成本最多节省 32%——这些都是公司声称的运营结果。独立第三方数据聚合方 Latka 估计，截至 2025 年 9 月，公司 ARR 约为 $115.5 million。Forbes（2026 年
              3 月）称员工数约 1,000 人，其他来源则给出 600–856 人区间。公司从 Series B 到 Series C 收入增长 13x，在此前疫情后阶段增长 12x，与其按 2021–2024 财年增长入选
              Deloitte Technology Fast 500 第 #82 名相一致。企业客户包括 Hunter Douglas、Cintas、Duracell、AB InBev、Univar、 McDonald's
              和 Titan America。平台全球用户接近 1 million，并在 G2 的 CMMS 类别中拿到满分 100 的满意度得分。 2026 年 3 月，MaintainX 与 Augury 宣布闭环集成，把
              Augury 的 AI 驱动机器健康诊断与 MaintainX 工单平台结合起来。
