  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >
              MaintainX 是一家私营 SaaS 公司，运营辖区受 CCPA/CPRA、GDPR 以及触达其工业和市政客户的行业特定法规约束。公司唯一确认的诉讼记录，是 UpKeep Technologies 在
              2019 提起的商标诉讼；该案三个月内自愿撤诉，没有判决，也没有持续义务。截至 May 2026，没有公开记录显示作为软件公司的 MaintainX Inc. 涉及任何监管执法、未决诉讼或重大 IP
              争议。公司持有 SOC 2 Type II 和 ISO 27001:2022 认证，这是企业采购可用的实际合规基线。最重要的潜在法律暴露来自加州修订后的 CCPA/CPRA 规则，January 2026
              生效；规则要求服务加州消费者的公司执行覆盖 18 个项目组成部分的书面网络安全审计，向 CPPA 提交书面认证，并尊重 Global Privacy Control 退出信号。MaintainX
              欧洲客户基础增长，GDPR 暴露真实存在；重大违规罚款可达 €20 million 或全球年收入 4%。OSHA 的 2026 GHS Revision 7 截止日（May 19, 2026）要求客户更新 SDS
              文档——这会产生 MaintainX 平台必须承接的间接合规工作流需求。尚未发现环境、出口管制或许可风险。私营公司的披露姿态意味着审计报告和 DPA 条款需要谈判；企业买家应在上线前索取 SOC 2
              报告并签署数据处理协议（DPA）。
