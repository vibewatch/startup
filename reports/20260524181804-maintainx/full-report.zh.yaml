      - number: '2.2'
        title: 市场规模：TAM、SAM 与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              分析师对 2026 年 CMMS 市场的估计差异很大——从 $1.44B（Business Research Company，保守方法）到 $2.55B （Coherent Market
              Insights，范围更宽）——反映出纳入分支、服务收入和免费增值采用口径不同。Future Market Insights 估计 2026 年 CMMS 市场为 $2.4B，并以 9.3% CAGR 增长，到
              2036 年达到 $5.9B。再加上 EAM 市场（Fortune Business Insights 称 2026 年为 $7.29B），全球合并软件 TAM 约为 $8.7–9.7B。

              MaintainX 的可服务市场更窄：Bessemer Venture Partners 估计 SAM 为 $10–25B，但该口径较宽，把纯 CMMS 许可收入之外的工作流和资产数据平台支出也算入。若锚定云
              CMMS，并面向移动优先的中端市场和企业运营，一个更保守的估计是 2026 年 SAM 约为 $3–5B。MaintainX 当前 ARR 约 $115M，意味着其仅拿下最保守 SAM 估计约
              2–4%，增长跑道仍然充足。

              Mordor Intelligence 称，预测性维护市场 2026 年价值 $18.9B，CAGR 为 34%；这个常被引用的超级类别除了 CMMS 软件，还包含 IoT 传感器硬件、服务和分析。该数字不能替代
              MaintainX 的 SaaS 可服务市场。估计相互矛盾，源于分析师采用不同范围定义； 要调和这些数字，需要带来源的方法论脚注，而大多数研究出版商并未公开。尽调路径是向 IDC 或 Gartner
              等独立数据提供商索取仅云端 CMMS 收入的拆分数据。
