      - number: '4.3'
        title: 单位经济模型与 SaaS 经营指标
        blocks:
          - type: paragraph
            body: >-
              MaintainX 不公开成熟投资者和企业买方用来承销收入质量的单位经济模型指标。毛利率、净留存率（NRR）、获客成本（CAC）回本周期、 经营性现金烧钱速度和 LTV:CAC
              比率，公司未发布，也没有任何监管文件或独立审计确认。第三方估计和可得数据推断只能拼出局部图像。

              收入侧，公司情报数据库 Growjo 估计 MaintainX 2025 年 ARR 约 $115.5 million，每名员工收入约 $178,000， 隐含约 649 名员工。按 $115.5 million
              ARR 估计，$2.5 billion Series D 投后估值隐含收入倍数约 21.6×——显著高于 SaaS Mag 和 Benchmarkit 估计的 2025 年 SaaS 行业 7–10×
              中位数。公司称 2021 年 Series B 到 2023 年 Series C 期间收入增长 13×，因此 ARR 从 2021 年低于 $10 million 的运行率扩张到 2025
              年三位数百万美元水平是可能的。 但 RocketReach 的另一项第三方估计把 2026 年年收入放在 $73.5 million，差异很大，凸显私营公司第三方推断模型的不确定性。

              成本结构基准方面，Benchmarkit 2025 年针对私营 B2B SaaS 公司的调查显示，VC 支持公司销售与营销费用中位数为收入的 47%，研发为 34%，NRR 约 101%。SaaS Mag
              2026 年基准显示，CAC 回本周期中位数为 15 个月，烧钱倍数在 Series A 为 1.2×，到后期降至 1.0× 以下，最低可行 LTV:CAC 比率为 3:1。对 MaintainX
              这种规模的公司（估计 ARR $100M+），Benchmarkit 指出每名全职员工 ARR 中位数升至 $300,000，高于 MaintainX 估计的 $178,000；
              这说明其员工投入可能高于同业，收入可能低于 $300,000 基准区间，或者估计所用员工数被高估。CMMS 类别 SaaS 交付的毛利率通常为
              70–80%，资本开支要求低，因为产品是云托管软件，没有硬件或库存组件。
