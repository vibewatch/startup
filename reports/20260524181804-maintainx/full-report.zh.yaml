      - number: '6.4'
        title: 留存、扩张与反向信号
        blocks:
          - type: paragraph
            body: >-
              MaintainX 声称客户留存率为 98%，该数字见于 Apps Run the World 技术画像数据库评论，来源于公司披露。独立队列分析、财务文件或已披露 NRR
              指标均未佐证该数字；以当前阶段（Series D，私营公司）看，公司没有义务披露 NRR。如果 98% 准确，它将符合以中端市场为锚的纵向 SaaS 一流水平留存。

              扩张信号在定性层面很强。Bessemer 的 Series D 公告称 MaintainX 已“从数字剪贴板替代品演进为综合工业工作流平台”，指向 AI 附加模块、IoT
              集成和企业席位扩张带来的增购增长。企业页面引用的一个企业部署称，200 个站点在 9 周内完成实施。Michaels Stores 在 2026 State of Industrial Maintenance
              报告中的引语——“最让我夜里睡不着的事情之一，是我们网络里的部落知识正在流失”——说明企业扩张不只是席位增长，也受到劳动力知识捕获需求推动。

              反向信号存在，但相对评论语料规模不大。一名 Gartner Peer Insights 评论者（采购助理，制造业，收入低于 $50M）在 April 2026 给出
              3/5，明确提到聊天支持等待时间以小时计、请求的软件更新要数月才出现。多名 Capterra 和 Software Advice 评论者指出工作流和表单自定义有限。若干受访者提到 Wi-Fi
              较差环境中偶发同步延迟，以及移动端到桌面端功能一致性缺口。尚未发现大规模客户流失、失败的企业部署或公开合同终止。SMB 客户集中度（估计占客户数 80%+）在企业扩张停滞时会带来收入暴露，NRR
              未披露也限制了对留存的独立验证。
