      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              MaintainX 在 2019 年 3 月完成首轮机构融资——$3.8 million 种子轮，由 August Capital 和 Amity Ventures 领投。2019
              年晚些时候，公司又完成此前未披露的 $11 million Series A 轮，同样由 August Capital 领投。2021 年 6 月，公司宣布由 Bessemer Venture Partners
              领投的 $39 million Series B 轮；当时公司披露，自 2020 年初以来收入增长 12x，客户留存率为 98%。2023 年 12 月，Bain Capital Ventures 领投 $50
              million Series C 轮，累计融资增至 $104 million，估值达到 $1 billion（独角兽状态），反映 Series B 以来收入增长 13x。Series C 吸引了前 GE CEO
              Jeff Immelt、Twilio CEO Jeff Lawson、PagerDuty CEO Jennifer Tejada 等战略天使投资人。2025 年 7 月 9 日， MaintainX 宣布
              $150 million Series D 轮，由 Bessemer Venture Partners 和 Bain Capital Ventures 联合领投， D.E. Shaw
              Ventures、Founders Circle Capital、Sozo Ventures、Fifth Down Capital 参投，天使投资人 Rahul Mehta 和 Dave McJannet
              也参与。Series D 将累计融资推至 $254 million，估值推至 $2.5 billion——不到两年就把 Series C
              估值翻了一倍以上。所有轮次均为股权融资；尚未发现二级交易或债务融资的公开证据。尽调应核验股权结构瀑布，以及任何未披露的优先股条款。
