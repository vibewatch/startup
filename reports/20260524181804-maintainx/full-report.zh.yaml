      - number: '8.3'
        title: 可比公司估值分析
        blocks:
          - type: paragraph
            body: >-
              可比集覆盖上市工业和企业 SaaS 风向标、私营 CMMS 同行，以及相邻 M&A 交易。ServiceNow（NYSE: NOW）是任务关键型工作流软件最接近的上市参照，截至 May 2026 约以 7x
              EV/revenue 交易，季度收入 $3.77B、YoY 增长 22%——这给公共市场愿意为高度差异化企业 SaaS 支付的倍数设了上限。BVP Nasdaq Emerging Cloud Index 在 Q1
              2026 为 8.0x，SaaS Capital Index 中位数为 6.4x，更窄的 Aventis Advisors 上市样本为 3.4x，反映出优质软件公司与中位增长软件公司之间的估值分化。

              私营可比交易方面，Aventis Advisors 的 543-deal 数据集显示，SaaS M&A 交易中位数为 4.5x EV/revenue，2026 年小型交易压缩到 3.1x。在 CMMS
              细分中，Limble CMMS 于 2023 宣布 Goldman Sachs 领投的 Series B，投后估值 $450M。UpKeep 在 May 2026 获得 Accel-KKR 的 PE
              投资，条款未披露。Fiix（Rockwell Automation）在 2021 被收购，倍数未披露。Fracttal 融资 $35M，隐含估值低于 $200M。

              MaintainX 隐含 21.6x ARR，至少比 Livmo 和 Acquiry 基准给出的 AI 原生高增长私营 SaaS 上限 ~9x 高 2.4x。即便按最慷慨的 AI 溢价框架（ARR 增长 >40%
              的公司可给 10–15x ARR），当前标记也要求落在可信市场证据的上沿。只有当 ARR 年增长明确高于 40%、且 NRR 被确认高于 120% 时，这个估值才站得住；两者目前都未公开披露。
