  - id: TV005
    title: 投资逻辑破裂与退出触发器
    columns:
      - 触发事件
      - 阈值 / 信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 增长减速
        - 连续多个季度 ARR 同比增长 <25%
        - 增长溢价消失；EV/ARR 倍数压缩至 6–8x；隐含估值 $900M–$1.5B
        - 下调至回避；将下一轮降价融资纳入模型
      - - NRR 低于 100%
        - 公开或泄露的 NRR 低于 100%
        - 客户价值创造未被确认；流失加速稀释装机基础
        - 投资逻辑立即破裂；SME 流失脆弱性变成系统性风险
      - - 竞争对手发布 AI
        - Rockwell Automation（Fiix）、SAP 或 IFS 以相当价格推出可信的移动 AI CMMS
        - 胜率和新增 ARR 增长被压缩；切换成本优势被侵蚀
        - 降低信心；在下一个决策点前寻求赢单 / 输单数据确认
      - - 降价轮融资
        - 宣布任何估值 <$2B 的 Series E 或过桥轮
        - 确认市场重定价增长溢价；员工士气和留存承压
        - 转为回避；降价轮触发反稀释保护和优先权重置
      - - 数据泄露或重大宕机
        - 客户数据暴露，或影响 >10% 客户的平台宕机超过 48 小时
        - 监管行业信任受损；流失激增，监管敞口上升
        - 暂停评估；先评估影响范围和客户反应，再重新分配立场
    notes: 触发器按可观察信号组织，并映射到估值机制。阈值为近似值，基于类似 SaaS 先例。
    claimRefs:
      - CV024
      - CV039
      - CV041
      - CV045
  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 增长率（当前）
        - 截至 Q1 2026 的经审计或管理层确认 ARR 及同比增长率
        - 只有 ARR 增长 >40%，21.6x 倍数才站得住；当前增速未确认
        - MaintainX CFO 数据室；用 Latka、Growjo 和员工数信号交叉验证
      - - 净收入留存率
        - 2025–2026 队列已发布或经验证的 NRR 数据
        - NRR >115% 才能支撑 AI-SaaS 溢价倍数；企业客户扩张是投资逻辑的关键
        - 访谈 10+ 家企业客户做参考；向数据室索取
      - - 毛利率与经营亏损
        - FY2025 经审计毛利率%、经营亏损和烧钱速度
        - 公司未披露盈利路径；没有利润率画像，Rule of 40 和现金跑道无法验证
        - 索取经审计财务报表或含 P&L 的投资人材料；pre-IPO S-1 可解决
      - - 企业客户构成
        - 来自 ACV >$50K 客户的 ARR 占比；Fortune 1000 账户数量
        - 客户集中在 SME/中端市场，会限制 ACV 扩张逻辑并抬高流失风险
        - 销售团队材料；企业层级客户访谈
      - - 股权结构表与反稀释条款
        - Series D 轮后完整股权结构表，按轮次列示清算优先权、反稀释条款和参与分配权
        - 清算瀑布决定不同退出情景下的实际回报；$254M 累计优先股是实质性负担
        - 向公司或二级市场数据提供方索取；EquityZen/PremierAlts 股权结构表数据
    notes: 尽调请求按其对估值逻辑的实质性排序。第 1–3 项会直接决定能否高确信度投资。
    claimRefs:
      - CV006
      - CV007
      - CV025
      - CV026
      - CV044
      - CV040
