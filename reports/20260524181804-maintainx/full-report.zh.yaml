      - number: '7.4'
        title: 伙伴、依赖与否决条件
        blocks:
          - type: paragraph
            body: >
              MaintainX 的伙伴和依赖风险集中在云基础设施提供商（基于架构足迹推定为 AWS）、Augury 预测性维护集成（作为闭环维护执行合作发布），以及少数 Series D
              领投投资人。公司没有向市场披露云供应商细节、多云应急方案或正式基础设施 SLA。Augury 依赖带来风险：如果该集成被弃用，或 Augury 被收购，某些企业客户的 AI 驱动预测分析价值主张可能被削弱。IPO
              前 MaintainX 股份在 Forge、Nasdaq Private Market 等二级平台交易，但截至 May 2026 尚未宣布正式 IPO
              日期。退出路径时间不清晰，对有固定基金期限的投资人是资本风险。可监控否决条件包括：NRR 连续两个季度低于 90%；MaintainX 遭遇任何监管执法；AI
