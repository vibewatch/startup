      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              在 CMMS/EAM 采购结构中，购买决策通常涉及三个角色：预算所有者（运营副总裁、设施副总裁或 CFO）、拥护者和评估者（维护经理、工厂经理或可靠性工程师），
              以及终端用户（一线技师或现场工人）。付款方几乎总在运营或设施 P&L，而不是 IT；不过云部署仍要过 IT 安全审查这一关。MaintainX 过去的产品驱动增长策略，直接瞄准维护经理和技师，绕过
              IT，先推动基层采用，再扩展到企业合同谈判。

              MaintainX 最强的五类买方是：（1）工业制造，计划外停机成本和监管合规带来最高紧迫性；（2）设施与房地产管理，多站点可见性和预防性维护排期是主要触发点； （3）能源与公用事业，老化资产基础和 ESG
              要求加速投入；（4）医疗健康，Joint Commission 和 FDA 合规要求使维护可追溯性成为硬约束； （5）酒店与餐饮，品牌标准合规和多地点预防性维护推动采用。按终端用户分部，制造业约占全球 CMMS
              市场份额 40%，是最大的单一垂直。

              按客户数量，中小企业（SMEs）约占 CMMS 市场份额 69%，与 MaintainX 历史上 SMB 优先的路径一致。但企业账户贡献的单客户收入不成比例更高， 这解释了 MaintainX
              当前向更大规模多站点部署上行的动作。在 SMB 场景中，预算所有者通常是业主经营者或工厂经理；在企业部署中， 通常会上升到运营副总裁或财务负责人，销售周期因此拉长，也需要正式 ROI 论证。
