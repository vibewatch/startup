      - number: '7.2'
        title: 运营、安全与平台风险
        blocks:
          - type: paragraph
            body: >
              MaintainX 平台完全云托管、移动优先，因此运营风险几乎等同于平台可用性、数据安全和对互联网连接的依赖。UpGuard May 2026 供应商风险评估给 MaintainX 879/950（Grade
              A），说明其外部攻击面维护较好。不过，评估识别出两个具体配置问题：Content Security Policy 使用 'unsafe-inline' 指令，而不是严格的 nonce 或
              hash，抬高跨站脚本（XSS）攻击风险；X-Content-Type-Options HTTP header 缺少 'nosniff' 指令，形成 MIME
              混淆攻击向量。两项漏洞都未与已观察到的入侵或利用挂钩；截至 May 2026，也没有公开安全事件报告。MaintainX 状态页显示运营状态持续到 mid-May
              2026，未记录长时间宕机。平台对云的依赖形成结构性暴露：在 Wi-Fi 差或离线环境中，用户报告同步延迟和数据记录缺口。MaintainX
              为移动端提供离线模式，但复杂工单覆盖不完整。公司没有公开披露是否采用多区域或 active-active 云架构，意味着重大 AWS-region 事件可能造成整个平台宕机。事故运行手册要求关键集成故障 15
              分钟响应。客户运营数据——资产清单、工单、人员日志——属于敏感运营 IP，丢失或损坏会对客户造成实质性中断。
