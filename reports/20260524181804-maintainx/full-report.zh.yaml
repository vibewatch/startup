  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              2026 年的 CMMS 和 EAM 软件市场至少由四类竞争者服务。直接云原生同业——UpKeep、Limble、Rockwell Automation 旗下 Fiix、Fluke Corporation 旗下
              eMaint——争夺 MaintainX 瞄准的同一批维护团队和设施管理买方。传统巨头 IBM Maximo 和 SAP EAM 主导大型、资产密集型企业，这些客户需要多站点、重合规部署和深度 ERP
              集成。相邻替代品包括专用 EAM 平台（Eptura、IFS、Oracle EAM、Hexagon EAM）、现场服务工具（Salesforce
              ServiceMax），以及电子表格和纸质工单这一长期存在的现状替代方案； 后者仍占设施管理工作流的相当一部分。总部在 Madrid 的 AI 维护平台 Fracttal 在 2026
              年成为有融资支持的竞争者，从 Riverwood Capital 融资 $35M，拥有 60 个国家的 1,500+ 客户，代表拉丁美洲和欧洲加速成形的国际威胁。

              独立分析师验证支撑了 MaintainX 的市场地位。Verdantix 首份 Green Quadrant: Industrial CMMS（2025）评估了 19 家 CMMS 厂商，并将 Brightly
              Software、eMaint、Eptura、Rockwell Automation 旗下 Fiix、IBM、Limble 和 MaintainX 认定为市场领导者，认为它们展示了最先进、最全面的能力。IDC
              MarketScape（2024）另行将 Fiix 评为 SaaS CMMS 领导者，Eptura 也在 2024 年 8 月被认定为全球 SaaS CMMS
              领导者。分析师认可集中在少数平台，说明竞争版图正向头部集中； 但 Verdantix 评估中仍有 19+ 家厂商参与，也显示更广阔市场仍然分散。IBM Maximo 本地部署版本 7.6.1 将在 2025 年
              9 月结束常规支持，这给传统客户带来迁移压力，包括 MaintainX 在内的现代云 CMMS 厂商有机会承接。
