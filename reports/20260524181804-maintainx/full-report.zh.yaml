  - id: TV002
    title: 投资逻辑与反向逻辑
    columns:
      - 维度
      - 投资逻辑论点
      - 反向逻辑论点
      - 什么会改变判断
    rows:
      - - 市场规模
        - 真正的 $7B+ EAM/CMMS TAM，数字化渗透率 <20%；再工业化提供顺风
        - 市场增长偏增量；SME 流失快于企业客户
        - 披露 NRR >115% 且 ACV 扩张超过 $25K，可确认企业客户粘性
      - - 产品差异化
        - AI 优先、移动原生平台，拥有 27M 工单训练数据，能筑起可防守的数据护城河
        - Rockwell（Fiix）、SAP 和 IFS 分发更强，正在缩小 AI 功能差距
        - Gartner 或 Forrester 的第三方 AI 基准将 MaintainX 排在既有厂商前面
      - - 客户证明
        - 11,000+ 家组织，声称计划外停机减少 34%，G2 品类领导者
        - 客户多数为 SME/中端市场；披露的企业 logo 有限
        - 披露 Fortune 500 或 Global 2000 客户名单；企业客户 >$100K ARR 占比
      - - 财务轨迹
        - 自创立以来报告收入增长 12x；$115.5M ARR，并获高质量投资人验证
        - 未披露毛利率、NRR 或经营亏损；烧钱速度未知
        - 经审计财务报表或 S-1 文件披露收入、毛利率和 NRR
      - - 竞争位置
        - '移动优先 CMMS 品类领导地位；Verdantix 基准认可；G2 #1 评分'
        - CMMS 市场分散，低价位也有许多可用替代品
        - 企业交易中对 Fiix/UpKeep 胜率超过 60% 的数据
      - - 估值风险
        - 18 个月内估值上调 2.5x，说明增长真实；SaaS 中的 AI 溢价有经验证据支撑
        - 21.6x ARR 倍数高于 AI 原生私营 SaaS 上限；降价轮风险升高
        - ARR 增长确认 >40% YoY，且 Rule of 40 超过 50，才能支撑当前估值
    notes: 论点来自截至 2026-05-24 的公开证据。反向逻辑条目代表结构性风险因素，不是已确认结果。
