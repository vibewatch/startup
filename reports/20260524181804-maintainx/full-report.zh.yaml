      - number: '3.2'
        title: 直接同业画像与功能对比
        blocks:
          - type: paragraph
            body: >
              UpKeep 是 MaintainX 最直接的可比公司，由 Ryan Chan 在 Los Angeles 创立，服务 4,000+ 个维护团队，起价 $20/user/month。UpKeep 获得
              Insight Partners 和 Emergence Capital 的 $36M Series B 支持，并在 2026 年 5 月又从 Accel-KKR 获得一轮私募股权融资，累计融资约
              $48.8M。UpKeep 的差异化在于 500+ 个第三方集成以及高级 API/webhook 能力，对技术栈复杂的运营团队有吸引力。其 AI 助手 Nova
              处理自动工单摘要和检查清单生成。独立对比（SelectHub 2026 年 5 月）发现，UpKeep 移动应用需要持续联网；在连接较差的工业环境里，这会构成限制，而 MaintainX 支持离线功能。Coast
              App 的竞争分析指出，在 G2 Winter 2026 Report 中，MaintainX 在易用性和实施便利度上低于 UpKeep，尽管两者总体评分相近。

              Limble CMMS 是 MaintainX 在定价和 UX 上最接近的竞争者。Limble 成立于 2015 年，2023 年 6 月从 Goldman Sachs Asset Management 融资
              $58M Series B，估值达到 $450M。到 2024 年 6 月，四轮累计融资达到 $113.5M。Limble 2023 年收入同比增长 130%，员工数增长 240%。仅 2022 年，Limble
              客户合计节省 $134M 停机成本、$68M 备件支出和 $442M 劳动力成本；这些数字来自公司自己的 Series B 新闻稿。Limble 的 G2 评分为 4.8/5，与 MaintainX
              完全相同；截至 2026 年 5 月的 Software Advice 对比数据显示，两者用户满意度相近， 对许多买方而言几乎可以互相替代。Limble 更强的企业报表能力和 Goldman Sachs 背书，在
              MaintainX 上行企业市场时构成可信竞争威胁。

              Rockwell Automation 旗下 Fiix 占据高端中端市场到企业级层级。Rockwell 于 2020 年收购 Fiix，并将其嵌入自身工业自动化生态。 Fiix 服务 100+ 个国家的
              4,100+ 个维护团队，每天管理 2M 项资产，每年处理 7.2M 张工单。其 Professional 套餐（$75/user/month）通过 Fiix Foresight 和 Asset Risk
              Predictor 提供 AI 驱动的预测性维护；入门套餐不含这些能力。 Fiix 在 2024 年被 IDC MarketScape 评为 SaaS CMMS Applications 领导者；同一评估覆盖
              13 家厂商。Rockwell Automation 的 27,000 人全球销售和支持网络，为 Fiix 提供了 MaintainX 作为独立公司无法复制的分销杠杆。

              Fluke Corporation 旗下 eMaint 定价为 $69/user/month（至少 3 名用户），Enterprise 套餐需定制报价。其差异化来自可配置性、 合规功能，以及 Fluke
              在工业测试设备中的客户基础。Fracttal 创立于 Spain，管理 60+ 个国家的 20M+ 项资产，并在 2026 年 1 月从 Riverwood Capital 融资
              $35M，以加速拉丁美洲和欧洲扩张。
