      - number: '1.5'
        title: 反向证据与风险因素
        blocks:
          - type: paragraph
            body: >-
              有记录的主要法律事项，是 Upkeep Technologies, Inc. 于 2019 年 2 月提起的联邦商标诉讼（Case 4:19-cv-00857, U.S. District Court N.D.
              California）。该案于 2019 年 5 月终结；截至运行日，未发现仍在进行的诉讼。 不应把 MaintainX, Inc. 与 Tampa 另一家名为 'MaintainX'
              的实体混淆，后者曾面临性骚扰诉讼；这些记录涉及一家无关的维护服务公司。 竞争层面，独立 2026 CMMS 评测网站记录了结构性产品限制：平台资产层级被限制在两级（Asset →
              Sub-asset），这会卡住复杂工业工厂结构； 报表无法添加自定义字段；AI 预测性维护功能被放在高价套餐（$49/user/month）之后，而部分竞争对手以明显更低的入门价提供可比 AI 能力。
              这些约束已经推动有记录的用户迁移到 OxMaint、Limble CMMS 和 UpKeep 等替代方案。不同来源给出的 ARR 数字相互冲突（$115.5 million vs. 其他估计约 ~$73.5
              million）；MaintainX 作为私营公司也不披露经审计财务、毛利率或净留存率——这些都是估值尽调的重大缺口。
            claimRefs:
              - CO038
              - CO039
              - CO040
