          - type: paragraph
            body: >
              截至 May 2026，MaintainX 持有三项外部验证的安全认证：SOC 2 Type II（由独立 CPA 事务所按安全性、可用性、处理完整性、保密性和隐私标准出具鉴证）、ISO 27001:2022（由
              Insight Assurance 对 MaintainX 平台及其蒙特利尔办公室认证），以及 GDPR 准备状态（包括数据保护政策、保留和删除控制、cookie 透明度）。Security Center
              页面确认了更多控制：数据加密、唯一身份认证、灾难恢复规划、网络安全保险和渗透测试。SSO、自定义权限和基于角色的访问控制在 Enterprise 档可用。

              MaintainX 状态页显示，在截至 May 24, 2026 的 90 天窗口内，Application、REST API、GraphQL API 和 Website 均为 100% uptime，May
              24, 2026 无事件报告。Trust Center 可通过 trust.getmaintainx.com 访问（合规报告内容需要 JavaScript 渲染）。从监管合规看，MaintainX 提供贴近
              OSHA 和 FDA 场景的检查清单支持，但并未内置面向制药电子记录的正式 21 CFR Part 11 合规能力——相较 Limble 可选的 Enterprise 21 CFR 包，这是已识别缺口。提到
              SAP PM 迁移的用户也指出，平台缺少更重型 ERP-native 工具中的策略计划和维护计划排程概览。
