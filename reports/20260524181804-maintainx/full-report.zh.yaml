      - number: '3.3'
        title: 定价、分销与 GTM 动态
        blocks:
          - type: paragraph
            body: >
              MaintainX 公布四层套餐：Basic（免费）、Essential（按年 $20/user/month 或按月 $25/user/month）、Premium（按年 $65/user/month 或按月
              $75/user/month）和 Enterprise（定制报价）。所有套餐都为仅提交工作请求的 Requester
              账户免费。按用户定价在大团队中会放大成本，这是用户评论中反复出现的批评。高级分析（MaintainX Intelligence）和停机报告被锁在 Enterprise 套餐之后，降低了中端买方自助发现的可能性。

              在直接同业中，MaintainX 的 Essential 定价（$20/user/month）与 UpKeep（$20/user/month）和 Limble （$25/user/month）相比有竞争力。但
              Fiix 的 Basic 套餐起价 $45/user/month，eMaint 起价 $69/user/month， IBM Maximo 通常从 $100/user/month
              以上起步，实施成本动辄达到七位数。这个价格阶梯形成自然分层：MaintainX 和 Limble 争夺 SMB 与成本敏感型中端市场，Fiix 和 eMaint 瞄准重合规的中端市场与企业，IBM Maximo
              和 SAP EAM 只服务最大的资产密集型组织。

              不同竞争者类别的分销动态差异很大。IBM Maximo 依赖大型 SI 合作伙伴（IBM 自身、Accenture、Deloitte）做企业实施，通常耗时 12–24 个月、花费数百万。SAP EAM 部署绑定
              S/4HANA 推出，借既有 SAP 关系形成深嵌且粘性的销售。Fiix 借 Rockwell Automation 的全球销售团队和工业自动化 OEM 关系获得分销杠杆。MaintainX、UpKeep 和
              Limble 主要依赖产品驱动增长（PLG）漏斗， 用入站数字营销、免费层和低接触销售服务 SMB，再转向大客户直销。MaintainX 与 SAP 的合作（SAP North America SVP
              Michael O'Donnell 在 Series C 公告中提及）以及预构建 SAP 集成，可能为其切入 SAP 管理账户提供渠道楔子， 这是单纯直接 PLG 触达不到的。
