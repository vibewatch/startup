  topStrengths:
    - >-
      MaintainX has credible product-market fit with 14,000+ customers, 14M+ assets managed, and broad recognition
      across G2, Deloitte, and enterprise reference logos.
    - >-
      The product combines mobile CMMS workflows, preventive maintenance, AI-assisted troubleshooting, and growing
      partner integrations, supporting multi-product expansion inside industrial accounts.
    - >-
      Repeat backing from Bessemer and Bain Capital Ventures plus a $150M Series D provides substantial runway to scale
      enterprise distribution and product depth.
  topRisks:
    - >-
      The $2.5B valuation implies a premium revenue multiple that appears aggressive versus public SaaS and private CMMS
      comparables.
    - >-
      MaintainX does not disclose audited revenue, gross margin, burn, cash runway, or NRR, limiting underwriting
      confidence.
    - >-
      Feature limitations documented by independent reviewers and active incumbent competition could compress win rates
      or pricing over time.
    - >-
      Customer concentration, contract-size distribution, and enterprise expansion quality remain opaque despite
      headline customer-count growth.
  unresolvedGaps:
    - Audited revenue, gross margin, burn rate, and cash runway remain non-public.
    - Net revenue retention, churn, and cohort expansion metrics are not publicly disclosed.
    - Customer concentration by industry, account size, and logo-level revenue exposure remains unclear.
    - Preference stack details, side letters, and any secondary components in recent rounds need cap-table confirmation.
