  evidenceGaps:
    - type: missing-source
      severity: minor
      topic: named-customer-proof-table-completeness
      missingEvidence: "Full production customer roster beyond the 12 publicly documented named accounts; the 14,000+ customer base is only partially visible through case studies, ARTW database, and Enlyft tracking."
      whyItMatters: "The named customer proof table covers only a small fraction of the 14,000+ customer base; enterprise and Fortune 500 logos beyond the documented set are unknown, limiting due diligence confidence in enterprise penetration claims."
      diligencePath: "Request complete customer list with industry, ARR, and deployment status from MaintainX management in formal due diligence; cross-reference with Salesforce CRM data."
      relatedQuestionRefs: [QU005, QU006]
      relatedTableRefs: [TU003]

    - type: private-evidence-only
      severity: material
      topic: nrr-disclosure
      missingEvidence: "Disclosed Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) rates, ideally segmented by SMB vs. enterprise cohort, from a formal data room or investor materials."
      whyItMatters: "NRR is the single most important SaaS retention metric for investors; its absence prevents independent verification of the 98% retention claim and makes it impossible to assess expansion vs. flat renewal dynamics."
      diligencePath: "Request from MaintainX management in formal DD: NRR/GRR by cohort year and by segment (SMB, mid-market, enterprise) for at least 3 years."
      relatedQuestionRefs: [QU015, QU016]

    - type: private-evidence-only
      severity: material
      topic: top-customer-concentration
      missingEvidence: "Revenue share from top 10 customers, top 20 customers, and largest single customer as a percentage of total ARR."
      whyItMatters: "SMB-heavy portfolios can mask high concentration if a handful of enterprise accounts drive a disproportionate share of ARR, creating churn risk from any single departure."
      diligencePath: "Request customer-level ARR waterfall or anonymized concentration breakdown in formal due diligence."
      relatedQuestionRefs: [QU023]

    - type: missing-source
      severity: minor
      topic: smb-enterprise-revenue-mix
      missingEvidence: "Disclosed revenue split between SMB (under $100K ACV), mid-market ($100K–$500K), and enterprise ($500K+) customer cohorts."
      whyItMatters: "The firmographic data suggests ~80%+ of customers are SMB, but if enterprise accounts disproportionately drive ARR, the platform's retention and expansion trajectory may be stronger than the logo count implies."
      diligencePath: "Request segment-level ARR, logo count, and ACV distribution from management; cross-reference with Enlyft firmographic tracking."
      relatedQuestionRefs: [QU022]

    - type: stale
      severity: minor
      topic: cohort-retention-data
      missingEvidence: "Year-over-year customer cohort retention rates (annual), ideally from 2021 to 2025 cohorts, to validate the 98% claim across multiple seasons."
      whyItMatters: "A single cross-sectional retention claim does not capture early-cohort churn patterns, which tend to be higher in SMB-anchored SaaS platforms."
      diligencePath: "Request cohort-level retention waterfall from customer success team covering 2021–2025 cohorts."
      relatedQuestionRefs: [QU030]
