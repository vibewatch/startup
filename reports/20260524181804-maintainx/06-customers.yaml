  - id: named-customer-proof
    title: Named Customer Evidence and Case Studies
    body: >-
      MaintainX has published or enabled 32+ case studies with quantified outcomes.
      The Titan America case study—available as a PDF authored jointly by MaintainX
      and the customer's Senior Reliability Manager Jorge Pinzon—documents a 30%
      reduction in unplanned maintenance at the company's Florida cement plant after
      deploying MaintainX to digitize a reliability-centered maintenance program.
      Magnera, a specialty-materials manufacturer, reported saving more than $575,000
      per year by using predictive tools to cut equipment downtime; in a separate
      video case study, Magnera credited MaintainX with enabling the same output
      level with four fewer technicians. Redimix, a concrete producer, achieved
      a 53% year-over-year reduction in maintenance costs through fully paperless
      operations. ColdTrack reduced mean time to repair by 70% post-deployment.

      At the enterprise tier, Duracell documented $50,000+ savings per site on
      parts inventory costs via MaintainX's SAP integration. A McDonald's franchise
      owner reports saving 20–30 hours per week. INX International, a global ink
      and coatings manufacturer, combined AssetWatch sensor data with MaintainX
      workflows to catch a critical bearing failure on a three-roll mill before
      catastrophic failure—avoiding emergency shutdown with no production loss.
      Suominen, a global nonwoven materials maker, unified maintenance operations
      across multiple sites by integrating MaintainX with SAP. DNP, a Japanese
      packaging manufacturer, achieved a 17% increase in asset availability by
      routing machine data into MaintainX work orders.

      Bessemer Venture Partners' Series D announcement cites Hunter Douglas, Cintas,
      and Titan America as representative enterprise deployments, while Apps Run
      the World's technographic database independently confirms AB InBev (143,000+
      employees, CPG Belgium), Univar Solutions (10,000 employees, life sciences),
      and Ergon Inc. (3,000 employees, oil and gas) as production MaintainX users.
      Of the 32+ published case studies, all documented deployments appear to be
      in full production rather than pilot status, with technician-level outcomes
      validated through customer-authored testimonials or third-party sources.
