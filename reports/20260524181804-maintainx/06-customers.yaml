callouts:
  - calloutType: strength
    title: Industry-Leading Review Consensus Across All Channels
    body: >-
      MaintainX holds the #1 G2 CMMS ranking for four consecutive quarters with
      a perfect 100/100 satisfaction score, 4.9/5 iOS rating, and 4.8/5 across
      Capterra, Gartner Peer Insights, and Software Advice. This breadth of
      independent, platform-verified review sentiment is unusual and reflects
      genuine product-market fit with frontline maintenance teams.
    claimRefs:
      - CU020
      - CU021
      - CU023

  - calloutType: risk
    title: Limited NRR Disclosure Constrains Independent Retention Verification
    body: >-
      MaintainX's 98% retention claim is company-stated and unaudited; no
      third-party confirms it. NRR is undisclosed, making it impossible to
      distinguish seat-level retention from revenue retention. SMB dominance
      (estimated 80%+ of customer count) historically carries higher churn
      than enterprise, and this dynamic is not independently verifiable from
      public data.
    claimRefs:
      - CU030
      - CU037
      - CU038

  - calloutType: insight
    title: Enterprise Proof Set Is Growing But Still Partial
    body: >-
      While 32+ case studies document quantified outcomes, the majority feature
      mid-market or SMB operators. The enterprise tier (AB InBev, Univar, Cintas)
      is documented via ARTW database or brief testimonials rather than
      full-length case studies with financial outcomes—a gap that matters for
      enterprise sales credibility and should be filled in due diligence.
    claimRefs:
      - CU014
      - CU016
      - CU033

