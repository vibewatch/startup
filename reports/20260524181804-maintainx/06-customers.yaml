          label: "Awareness"
          description: "G2/Capterra discovery; peer referral; field technician champion; industry event demos"
        - id: trial
          label: "Free Trial / Demo"
          description: "Free Basic plan (unlimited work orders); 3-week structured implementation onboarding"
        - id: purchase
          label: "Paid Conversion"
          description: "Essential ($21/user/mo), Premium ($59/user/mo), or Enterprise (custom ACV) plans"
        - id: onboarding
          label: "3-Week Site Onboarding"
          description: "Dedicated CSM; 3-week rollout per site; SOC 2/ISO 27001 compliance verification"
