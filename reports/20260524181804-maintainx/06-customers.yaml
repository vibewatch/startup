  - id: review-platform-sentiment
    title: Multi-Platform Review Sentiment
    body: >-
      MaintainX's review profile across all major procurement channels is
      uniformly strong. G2's Spring 2026 report ranked MaintainX #1 in CMMS
      for the fourth consecutive quarter, #1 in Enterprise CMMS, #1 in Facility
      Management for the tenth consecutive quarter, and #1 in Asset Performance
      Management. The company received the 2026 G2 Best Software Award, placing
      it among the top 100 software companies globally across all categories.
      MaintainX's G2 satisfaction score is a perfect 100/100—the highest of any
      platform in the CMMS category—validated by authentic user reviews on the
      world's largest B2B software marketplace.

      On Capterra, MaintainX holds a 4.8/5 aggregate from 654+ verified reviews
      as of October 2024 (Wayback-cached), with most reviewers specifically
      citing ease of use, mobile app quality, and customer support responsiveness.
      Gartner Peer Insights reports a 4.8/5 from 424 enterprise reviewer ratings
      as of January 2026, with a critical minority (including a 3/5 from a
      procurement associate) noting slow chat support response times (hours rather
      than minutes) and software update lag times measured in months rather than
      weeks. TrustRadius shows 9.6/10, with the Cintas maintenance supervisor
      testimonial serving as an anchor review. Software Advice captures 4.8/5
      across 964 verified ratings. FeaturedCustomers aggregates 4.8/5 from 1,794
      reference ratings with 82 individual testimonials and 32 case studies, making
      it the largest independent repository of MaintainX customer narratives.

      Mobile app stores independently validate day-to-day user satisfaction. The
      iOS App Store shows 4.9/5 from 4,800+ ratings as of the latest app update
      (Version 5.25, five days before the run date). AppBrain reports the Android
      app has 1M+ downloads with a 4.64/5 from 4,937 reviews, reflecting slightly
      lower but still strong satisfaction likely driven by the wider hardware
      diversity of the Android install base.
