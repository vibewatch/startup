  - id: retention-expansion-risks
    title: Retention, Expansion, and Adverse Signals
    body: >-
      MaintainX claims a 98% customer retention rate, cited in the Apps Run the
      World technographic database commentary derived from company disclosures.
      This figure is not corroborated by independent cohort analysis, financial
      filings, or a disclosed NRR metric; at the current stage (Series D, private),
      the company has no obligation to publish NRR. The 98% figure, if accurate,
      would be consistent with best-in-class vertical SaaS retention for a
      mid-market-anchored platform.

      Expansion signals are qualitatively strong. Bessemer's Series D announcement
      notes MaintainX's evolution "from a digital clipboard replacement to a
      comprehensive industrial workflow platform," signaling upsell growth through
      AI add-ons, IoT integrations, and enterprise seat expansion. One enterprise
      deployment cited by the enterprise page describes 200 sites implemented in
      nine weeks. The Michaels Stores quote from the 2026 State of Industrial
      Maintenance report—"one of the things that keeps me up at night is the
      tribal knowledge in our network leaving"—signals active enterprise expansion
      driven by workforce knowledge-capture needs, not just seat growth.

      Adverse signals are present but modest relative to the review corpus. A
      Gartner Peer Insights reviewer (procurement associate, manufacturing,
      sub-$50M revenue) gave a 3/5 rating in April 2026, specifically citing
      chat support wait times measured in hours and requested software updates
      taking months to appear. Multiple Capterra and Software Advice reviewers
      flag limited workflow and form customization. Several respondents note
      occasional sync delays in low-WiFi environments and mobile-to-desktop
      feature parity gaps. No large-scale customer churns, failed enterprise
      deployments, or public contract terminations have been identified. The SMB
      customer concentration (estimated 80%+ of customer count) creates revenue
      exposure if enterprise expansion stalls, and the absence of disclosed NRR
      limits independent retention verification.
