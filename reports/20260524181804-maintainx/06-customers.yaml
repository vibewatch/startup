chapter:
  number: 6
  title: Customers
  summary: >-
    MaintainX counts 14,000+ global organizations on its platform as of May 2026,
    managing 17M+ assets and 92M+ completed work orders across manufacturing, food
    and beverage, facilities, hospitality, retail, and 11 additional verticals.
    Named enterprise customers including AB InBev, Cintas, Titan America, Duracell,
    and Univar Solutions provide production-grade deployment evidence alongside 32+
    published case studies. Multi-platform review sentiment is industry-leading
    with G2 naming MaintainX #1 in CMMS for four consecutive quarters and awarding
    it a perfect 100/100 satisfaction score; iOS rating stands at 4.9/5 and
    Capterra/Gartner Peer Insights at 4.8/5. Customer retention is company-claimed
    at 98%, and expansion signals are visible through multi-site rollouts. Key risks
    include limited public NRR disclosure, SMB-heavy concentration, and a minority
    of adverse reviews citing slow support response times and delayed software
    update cycles.

sections:
  - id: customer-base-overview
    title: Customer Base Scale and Segmentation
    body: >-
      As of May 2026 MaintainX serves 14,000+ organizations worldwide, managing
      more than 17 million assets and having processed over 92 million work orders
      since inception. This scale firmly positions MaintainX as one of the largest
      active CMMS deployments globally, and the growth trajectory from approximately
      11,000 customers cited in Bessemer's Series D announcement through 14,000+
      on the official About page implies substantial net-new logo acquisition in
      the 2024-to-2026 window.

      The customer base is dominated by asset-intensive industries. Manufacturing
      (general, food and beverage, chemicals, automotive, building materials) forms
      the largest vertical by use-case volume. Facilities management, hospitality,
      energy and utilities, retail, logistics and distribution, and healthcare
      round out the top segments, with growing traction in government/defense tied
      to the U.S. reindustrialization trend highlighted in the company's 2026
      State of Industrial Maintenance report. Cuspera and Enlyft technographic
      data confirm adoption across more than 15 distinct SIC-level industry
      categories.

      Geographically, Enlyft's tracking data puts approximately 71% of identified
      deployments in the United States, with meaningful presence in the United
      Kingdom, Canada, France, Australia, and Singapore. Firmographic analysis
      shows the modal customer is a 50–200 employee company generating $10–50M
      in annual revenue, consistent with MaintainX's SMB-and-mid-market roots.
      However, enterprise logos (10,000+ employees) including AB InBev, Univar
      Solutions, Xylem, and Vertiv Holdings confirm growing reach upmarket. The
      standard deployment timeline is three weeks per site, enabling rapid
      multi-site rollouts for enterprises standardizing across dozens of plants.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
