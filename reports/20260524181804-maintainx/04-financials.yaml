  - id: unit-economics
    title: Unit Economics and SaaS Performance Indicators
    body: >-
      MaintainX does not publicly disclose the unit-economics metrics that sophisticated
      investors and enterprise buyers use to underwrite revenue quality. Gross margin, net
      revenue retention (NRR), customer acquisition cost (CAC) payback period, operating
      cash burn, and lifetime-to-CAC ratio have not been published by the company or
      confirmed in any regulatory filing or independent audit. Third-party estimates and
      inference from available data provide only a partial picture.

      On the revenue side, Growjo, a company-intelligence database, estimates MaintainX's
      2025 ARR at approximately $115.5 million with revenue per employee of about $178,000,
      implying roughly 649 employees. At the $115.5 million ARR estimate, the $2.5 billion
      Series D post-money valuation implies a revenue multiple of approximately 21.6×—well
      above the 7–10× SaaS industry median for 2025 as estimated by SaaS Mag and Benchmarkit.
      The company claimed 13× revenue growth between its 2021 Series B and its 2023 Series C,
      making it plausible that ARR scaled from a sub-$10 million run rate in 2021 to the
      triple-digit level by 2025. However, a conflicting third-party estimate from RocketReach
      placed 2026 annual revenue at $73.5 million, a material discrepancy that underscores the
      uncertainty of third-party inference models for private companies.

      For cost structure benchmarking, Benchmarkit's 2025 survey of private B2B SaaS companies
      reports median S&M expense at 47% of revenue for VC-backed companies, R&D at 34%, and
      NRR at approximately 101%. SaaS Mag's 2026 benchmarks report median CAC payback of
      15 months, median burn multiple of 1.2× at Series A declining below 1.0× at later stages,
      and a minimum viable LTV:CAC ratio of 3:1. For a company at MaintainX's scale ($100M+
      estimated ARR), Benchmarkit notes median ARR per FTE rises to $300,000—above MaintainX's
      estimated $178,000, suggesting either above-peer headcount investment, revenue below the
      $300,000 benchmark range, or the estimate's underlying employee-count being overstated.
      CMMS-category gross margins for SaaS delivery are typically 70–80%, with low capex
      requirements as the product is cloud-hosted software with no hardware or inventory component.
