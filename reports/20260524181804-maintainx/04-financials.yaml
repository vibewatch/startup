  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ARR
      missingEvidence: >-
        Company-confirmed or audited ARR figure for the most recent fiscal year; current
        estimates span $73.5M–$115.5M from third-party sources with unverified methodology.
      whyItMatters: >-
        Without confirmed ARR, the revenue multiple, growth rate, and valuation justification
        cannot be independently validated, making financial underwriting infeasible.
      diligencePath: >-
        Request board-approved ARR schedule or audited revenue for the most recent two fiscal
        years under NDA as a condition of any investment or partnership diligence process.
      relatedQuestionRefs:
        - QI003
        - QI008
        - QI022

    - type: private-evidence-only
      severity: blocking
      topic: burn rate
      missingEvidence: >-
        Monthly operating burn rate and current cash position; no public source available;
        runway estimate is entirely speculative.
      whyItMatters: >-
        Cannot assess capital adequacy, refinancing risk, or timing of next capital event
        without confirmed burn rate and cash balance.
      diligencePath: >-
        Request trailing 12-month income statement, cash flow statement, and bank balance
        as of latest month-end under NDA.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: material
      topic: gross margin
      missingEvidence: >-
        Actual gross margin by tier and in aggregate; current estimate of 70–80% is benchmark
        inference, not MaintainX-specific data.
      whyItMatters: >-
        Gross margin is the primary driver of unit economics; a 10-point difference (e.g., 65%
        vs. 75%) materially changes cash-on-cash return and CAC payback period.
      diligencePath: >-
        Request GAAP income statement disaggregated by revenue stream and COGS components
        under NDA.
      relatedQuestionRefs:
        - QI010
        - QI028

    - type: private-evidence-only
      severity: material
      topic: NRR
      missingEvidence: >-
        Net revenue retention by customer segment and vintage; industry benchmark of 101%
        cited but MaintainX-specific figure not available.
      whyItMatters: >-
        High NRR would be the primary justification for a premium revenue multiple; low NRR
        would signal structural growth decay from the existing customer base.
      diligencePath: >-
        Request cohort-level NRR broken down by SMB, mid-market, and enterprise segments
        for at least two annual cohort vintages.
      relatedQuestionRefs:
        - QI011

    - type: private-evidence-only
      severity: material
      topic: CAC payback
      missingEvidence: >-
        Blended and channel-segmented CAC payback period; no public disclosure from
        MaintainX or any investor statement.
      whyItMatters: >-
        CAC payback drives the capital intensity of growth; above 24 months is a structural
        red flag for any growth-stage SaaS company (per SaaS Mag 2026 benchmarks).
      diligencePath: >-
        Request fully-loaded CAC by channel (PLG, inside sales, field sales) and associated
        ACV and gross-margin inputs under NDA.
      relatedQuestionRefs:
        - QI012
        - QI024

    - type: missing-source
      severity: minor
      topic: revenue mix
      missingEvidence: >-
        Tier mix (share of ARR from Basic, Essential, Premium, Enterprise) and
        free-to-paid conversion rate from the Basic PLG funnel.
      whyItMatters: >-
        Tier mix determines ARPU trajectory and the revenue-quality weighting; an
        enterprise-heavy mix implies lower churn and higher ACV.
      diligencePath: >-
        Request ARR waterfall by pricing tier and historical conversion funnel metrics.
      relatedQuestionRefs:
        - QI003
        - QI006
        - QI024
        - QI025

    - type: private-evidence-only
      severity: material
      topic: investors
      missingEvidence: >-
        Individual investor ownership percentages and any liquidation preference or
        anti-dilution terms associated with the Series D preferred stock.
      whyItMatters: >-
        Preferred stock terms determine effective per-share valuation and common-stock
        implied value, critical for assessing returns at exit.
      diligencePath: >-
        Request preferred-stock purchase agreement and cap-table summary from legal
        counsel under NDA.
      relatedQuestionRefs:
        - QI006

