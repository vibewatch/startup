callouts:
  - calloutType: strength
    title: SEC-Confirmed Series D Raise of $149.75M at $2.5B Valuation
    body: >-
      SEC Form D filings (accession 0001762155-25-000002, filed 2025-07-10) confirm MaintainX
      raised $149,749,979 in a Series D with a first sale date of 2025-03-20. Combined with
      independently corroborated post-money valuation of $2.5 billion (BusinessWire, BVP, Crunchbase),
      this represents the highest-conviction financial fact available for MaintainX and provides
      a confirmed capital-adequacy baseline.
    claimRefs:
      - CI001
      - CI002
      - CI003

  - calloutType: risk
    title: Revenue Opacity — No Audited Financials and Conflicting Third-Party Estimates
    body: >-
      MaintainX does not publish audited financial statements. Third-party revenue estimates
      range from $73.5 million (RocketReach, 2026) to $115.5 million (Growjo, 2025), a 57%
      spread. This uncertainty, combined with undisclosed gross margin, NRR, and burn rate,
      means the $2.5 billion valuation cannot be independently validated. The implied revenue
      multiple of 21.6–34× is materially above the 7–10× SaaS industry median and must be
      justified by growth-rate and retention data available only under NDA.
    claimRefs:
      - CI026
      - CI027
      - CI039

  - calloutType: recommendation
    title: Minimum Diligence Package for Financial Underwriting
    body: >-
      Any investment or enterprise partnership assessment must obtain: (1) audited ARR and
      revenue for the trailing two fiscal years; (2) gross margin disaggregated by tier;
      (3) cohort NRR for at least two annual vintages; (4) blended CAC payback by channel;
      (5) trailing 12-month P&L and cash position; (6) ACV distribution and top-10 customer
      revenue concentration. Without these, financial analysis relies entirely on third-party
      inference and company-controlled marketing claims.
    claimRefs:
      - CI027
      - CI038

