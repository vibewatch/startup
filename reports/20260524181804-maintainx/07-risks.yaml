  - id: partner-dependency-kill-criteria
    title: "Partner, Dependency & Kill Criteria"
    body: >
      MaintainX's partner and dependency risk is concentrated in its cloud infrastructure provider (presumed AWS
      based on architecture footprint), its Augury predictive-maintenance integration (announced as a closed-loop
      maintenance execution partnership), and a small group of Series D lead investors. The company has not
      disclosed cloud provider details, multi-cloud contingency, or formal infrastructure SLAs to the market.
      Augury dependency creates risk: if the integration is deprecated or Augury is acquired, the AI-driven
      predictive analytics value proposition for certain enterprise customers could erode. Pre-IPO MaintainX
      shares trade on secondary platforms including Forge and Nasdaq Private Market, but no formal IPO date
      has been announced as of May 2026. The exit-path timeline ambiguity is a capital risk for investors with
      fixed fund horizons. Monitorable kill criteria include: NRR falling below 90% for two consecutive quarters,
      any regulatory enforcement action against MaintainX, competitive market share loss to AI-native rivals
      confirmed by independent analyst data, or a prolonged cloud outage exceeding 4 hours.
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
