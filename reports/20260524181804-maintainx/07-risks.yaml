callouts:
  - calloutType: risk
    title: "AI Feature Gating Creates SMB-to-Enterprise Transition Risk"
    body: >
      MaintainX gates its most advanced AI capabilities (CoPilot, predictive maintenance, IoT analytics) exclusively
      at the Enterprise tier with custom pricing. This creates a structural retention risk for SMB and mid-market
      customers who discover the feature ceiling at lower price points, and it constrains upsell velocity if
      enterprise pricing thresholds exceed customers' willingness to pay. As AI capabilities commoditize across
      Tractian, Facilio, and AI-native entrants, the value gap between Premium and free/lower-cost alternatives
      narrows.
    claimRefs:
      - CR021
      - CR028
      - CR022

  - calloutType: risk
    title: "Private-Company Opacity Is a Persistent Diligence Gap"
    body: >
      MaintainX has not filed an S-1, does not publish quarterly financials, and discloses no NRR, gross margin,
      customer concentration, or burn rate. At a 21.6x implied ARR multiple, this opacity is a material diligence
      risk. Investors and enterprise buyers making multi-year commitments have no independently verified financial
      health signal. A request for audited financials, NDA-protected SOC 2 Type II report, and customer-concentration
      disclosure should be a pre-condition for significant capital deployment.
    claimRefs:
      - CR009
      - CR025
      - CR044
      - CR050

  - calloutType: recommendation
    title: "Require Financial Transparency Covenants Before Full Conviction"
    body: >
      Before reaching full investment conviction, investors should require at minimum: (1) audited or reviewed
      annual financials; (2) NRR and gross retention metrics; (3) top-5 customer concentration as a share of ARR;
      (4) burn rate and runway; (5) board composition and key-person insurance. The kill criteria in this chapter
      provide a monitoring framework for post-investment surveillance. Enterprise buyers should execute a formal DPA
      and request the latest SOC 2 Type II report before deploying the platform for safety-critical or compliance-sensitive workflows.
    claimRefs:
      - CR025
      - CR046
      - CR050
      - CR009

