  topStrengths:
    - 'Real operating scale: 16,000+ customers, 1,500+ employees, and an official $100M ARR milestone.'
    - Product breadth supports a platform thesis rather than a point-solution thesis for European SMEs.
    - Capital access from Series D equity plus prior structured financing gives the company room to keep expanding.
  topRisks:
    - Public evidence still lacks NRR, GRR, EBITDA, detailed margin data, and fully transparent debt terms.
    - The $2.5B valuation depends heavily on continued growth and better-than-publicly-visible revenue quality.
    - Competition remains intense from Personio, HiBob, Rippling, and large incumbents such as Workday and SAP.
  unresolvedGaps:
    - Audited revenue quality, retention cohorts, and gross-margin trend remain non-public.
    - Debt terms, covenant structure, and the exact downside profile of structured financing remain unclear.
    - Public evidence confirms historical Ruby on Rails usage but not the full current frontend/cloud stack.
