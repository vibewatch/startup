    {
      "id": "named-customer-proof-and-adoption",
      "title": "Named customer proof and adoption surfaces",
      "body": "Named customer proof is where the chapter becomes more concrete. Factorial's customer pages provide specific quotes from Globalfy, Kimpton Hotels & Restaurants, Vendoo, and Oliant, and those logos map to real operating contexts rather than generic marketing badges. Globalfy points to globally distributed document workflows; Kimpton points to replacing disconnected systems; Vendoo points to automation helping a lean HR function during rapid headcount growth; and Oliant points to using Factorial as one central point across time off, shifts, payroll, and hiring. Those stories are directionally strong because they tie the product to actual use cases instead of only to brand logos. Independent surfaces also show there is a real customer-proof ecosystem around the company. FeaturedCustomers lists reviews, case studies, and videos, while mobile app listings show Factorial is not only an admin back-office tool but a product employees can touch directly. The limitation is freshness and representativeness: public stories tend to highlight happy customers, and Factorial does not disclose what percentage of its installed base looks like these examples. Still, the open-web evidence clears the threshold for real production adoption across multiple customer archetypes.",
