  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Factorial has credible public customer proof for a scaled SME HR platform: 16,000+ companies, international usage, named customer testimonials across service, hospitality, software, and global-team contexts, plus mobile and Slack adoption surfaces. The expansion case is plausible because the product reaches employees and managers in daily workflows, not just HR admins. What remains missing is the hard underwriting layer—NRR, GRR, contract duration, churn, and customer concentration—so durability still relies more on product logic and testimonials than on disclosed cohort evidence."
  },
  "sections": [
    {
      "id": "customer-segmentation-and-footprint",
      "title": "Customer mix, segment, and geographic footprint",
      "body": "Factorial's customer evidence is strongest on breadth of deployment and fit with smaller, fast-growing organizations. Official surfaces repeatedly say the company serves more than 16,000 customers and frame the buyer as an SMB or growth-stage employer that wants one system for time off, records, payroll inputs, recruiting, and related workflows. The pricing entry point and the language on review pages also support that reading: this is not marketed as heavyweight enterprise transformation software, but as a practical operating layer for teams that need faster onboarding and less admin burden. Geography is the one place where the public narrative needs caution. Different official pages mention different country counts, which may reflect the difference between active customers, supported geographies, or general market presence. Even so, the named customer list clearly shows cross-border usage across the US, Spain, Brazil, Bulgaria, Argentina, and other global contexts. That pattern matters because it suggests Factorial is not only a Spain-only HR tool. It is already selling to international teams, albeit still with public ambiguity about the exact scale of that multinational footprint and how much of the customer base sits in its core European markets. The public customer base therefore looks broad, but not yet perfectly normalized across company disclosures.",
