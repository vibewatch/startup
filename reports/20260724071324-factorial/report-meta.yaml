companyProfile:
  summary: Factorial is a Barcelona-based HR and business-management software company founded in 2016. It sells a modular SaaS platform for SMEs spanning core employee records, time and attendance, leave, payroll-adjacent workflows, recruiting, performance, documents, expenses, integrations, and a growing finance/IT layer. By mid-2026 the company had reached an official $100M ARR floor, served 16,000+ customers, and raised a $150M Series D at a $2.5B valuation after multiple financings from General Catalyst.
  foundedDate: '2016-01-01'
  founders:
    - name: Jordi Romero
      role: Co-founder and CEO
      background: Co-founded Factorial and continues to lead the company through European expansion and the 2026 Series D.
      claimRefs: [CO005]
    - name: Pau Ramírez
      role: Co-founder and COO
      background: Co-founded Factorial and helped build its SME operating-platform scope.
      claimRefs: [CO006]
    - name: Bernat Farrero
      role: Co-founder
      background: Co-founder associated with the company’s early go-to-market and growth trajectory.
      claimRefs: [CO007]
  foundingLocation: Barcelona, Spain
  headquarters: Barcelona, Spain
  productSummary: Factorial delivers all-in-one HR software for SMEs with modules across employee data, time, payroll-adjacent workflows, recruiting, performance, documents, expenses, integrations, and employee self-service. Public API and marketplace surfaces expand the product into Slack, Zapier, payroll, ERP, and other adjacent systems.
  customerFocus: SMEs and growth-stage companies, especially European and cross-border teams that want to replace fragmented HR tooling with one operating layer.
  businessModel: Per-user SaaS subscriptions with module upsell, annual contracts, partner integrations, and workflow expansion across HR, finance, and IT operations.
  stage: late-stage private
  fundingStatus: Series D completed June 2026 at a $2.5B valuation; General Catalyst also expanded structured growth financing support before the equity round.
  claimRefs: [CV001, CV002, CV006, CE003, CE011, CU001]
summary:
  headline: Factorial looks like a real European category leader in SME HR software, but the $2.5B valuation is best underwritten as a premium-growth bet rather than as a low-risk or fully transparent financial story.
