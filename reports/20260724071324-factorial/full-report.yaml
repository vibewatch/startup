figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Factorial's public record shows a rapid climb from 2016 founding to 2022 unicorn status, followed by a 2025-2026
      capital and AI reset centered on Germany-led expansion.
    data:
      items:
        - date: '2016'
          label: Founded in Barcelona
          detail: Factorial launches as an HR software company for SMEs.
          tone: positive
        - date: 2020-04
          label: Series A led by CRV
          detail: Institutional funding supports early scale-out.
          tone: positive
        - date: 2021-09
          label: Series B — $80M
          detail: Tiger Global leads; total funding hits $100M.
          tone: positive
        - date: 2022-10
          label: Series C — $120M at $1B
          detail: Atomico-led round makes Factorial a unicorn.
          tone: positive
        - date: 2025-03
          label: GC grows commitment to $200M
          detail: Non-dilutive capital is expanded for Germany, France, and Italy.
          tone: positive
        - date: '2026-06-03'
          label: Series D — $150M at $2.5B
          detail: General Catalyst leads the first new equity round since 2022.
          tone: positive
        - date: '2026-06-03'
          label: $540M additional CVF commitment
          detail: Total committed non-dilutive capital surpasses $700M.
          tone: positive
        - date: '2026-06-09'
          label: $100M ARR milestone publicized
          detail: Company says it now serves 14,000+ customers across 10 countries and has added 500+ people in-year.
          tone: positive
        - date: 2026-06
          label: Germany push deepens
          detail: Munich office opens and Germany is called the number one international growth market.
          tone: positive
    approximationNotes: >-
      Series A date and amount are corroborated via later public summaries rather than a fetched primary release in this
      run.
