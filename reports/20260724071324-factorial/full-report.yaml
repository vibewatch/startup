      - number: '8.3'
        title: What would change the call
        blocks:
          - type: paragraph
            body: >-
              The current evidence base is good enough to justify leaning in, but not good enough to stop asking hard
              questions. The principal diligence blockers are unchanged from the financial and customer chapters: no
              public NRR or GRR, no clean cohort retention disclosure, no EBITDA or margin bridge, incomplete clarity on
              debt terms, and only filing-derived glimpses into current profitability. Those are not minor details at
              this valuation; they are exactly the numbers that determine whether Factorial deserves to trade as a
              category leader or merely as a fast-growing but expensive software asset. The exit story is still credible
              because the company has real scale and category visibility, but it remains more plausible than proven from
              public evidence alone. What would move me off Buy? A materially weaker ARR base than the third-party
              estimate suggests, evidence of heavy discounting or weak retention, or financing terms that imply more
              capital dependence than the round headline conveys. What would raise conviction? Audited evidence of
              strong retention, improving operating leverage, and a capital structure that is simpler than the current
              public mosaic implies. Until then, the public case remains investable but not fully de-risked.
            claimRefs:
