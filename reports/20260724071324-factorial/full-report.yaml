      - number: '1.3'
        title: Funding history, valuation path, and investor concentration
        blocks:
          - type: paragraph
            body: >-
              Factorial's financing path shows three distinct phases. First, the company built its early platform
              through seed, seed-extension, and Series A capital that culminated in roughly $100 million of total
              funding by the September 2021 Series B announcement. Second, the company crossed the unicorn threshold in
              October 2022 with a $120 million Series C led by Atomico at a $1 billion valuation. Third, after a gap in
              public equity rounds, Factorial leaned heavily on General Catalyst's customer-value financing structure,
              expanding that commitment to $200 million in March 2025 before reopening equity in June 2026 with a $150
              million Series D at a $2.5 billion valuation. This sequence matters because it implies that General
              Catalyst has become more than just another investor: it is now the dominant external capital partner
              across both growth financing and new equity. Public data providers disagree on lifetime raised totals
              depending on whether debt-like facilities are counted, so the cleanest framing is to separate disclosed
              equity history from committed non-dilutive facilities. On that basis, Factorial is demonstrably better
              capitalized in 2026 than at any prior point in its history, but also more exposed to one capital partner
              than the 2022 syndicate alone would suggest.
