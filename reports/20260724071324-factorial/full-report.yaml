chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, product, and stage
        blocks:
          - type: paragraph
            body: >-
              Factorial is a Barcelona-founded software company that began in 2016 as an HR-focused workflow platform
              for small and medium-sized businesses and, by 2026, was presenting itself as a broader business-management
              and AI operations platform. The company's current product posture blends classic HR modules such as time
              tracking, payroll support, recruiting, performance, and document workflows with finance, procurement, IT,
              and AI-agent layers. That progression matters because it changes how investors should think about market
              scope: the company is no longer describing itself as a narrow HR tool, but as a horizontal operating layer
              for people, finance, and IT work in European SMEs. Public contact and headquarters evidence continues to
              anchor the company in Barcelona even as it expands internationally. The strongest current scale markers
              come from the June 2026 Series D announcement and the about page: 16,000+ business customers, operations
              in 90+ countries at minimum, and a workforce now measured in the low thousands rather than the hundreds.
              Factorial therefore screens as a private, late-stage European application-software company with verified
              momentum but still uneven disclosure on exact revenue and cap-table details.
