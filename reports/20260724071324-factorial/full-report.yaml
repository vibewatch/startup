      - number: '3.2'
        title: Relative scale, packaging, and feature comparisons
        blocks:
          - type: paragraph
            body: >-
              Public scale disclosures already show meaningful separation across the field. Personio’s 2022 $8.5B
              valuation and 6,000-customer base, HiBob’s 2023 $574M total funding and 3,500+ customers, and Rippling’s
              2025 $16.8B valuation with 20,000+ customers all create reference points above or adjacent to Factorial’s
              current $2.5B mark. At the same time, not every rival is trying to solve the same problem. Factorial’s
              breadth across HR, finance, and IT workflows makes it more horizontal than BambooHR or Kenjo, while still
              more SME-readable than Workday or SAP. Public pricing also matters. Factorial exposes a clear $8-per-user
              starting point, which is valuable in SME acquisition because many large-suite rivals hide pricing behind
              sales motions. Integrations and APIs reinforce the breadth story by making Factorial easier to embed into
              existing SME tooling. In practice, the competition is not just feature-vs-feature; it is also
              packaging-vs-complexity and transparency-vs-enterprise-sales friction. That distinction matters because a
              company can lose the SMB funnel without being out-featured in every dimension; sometimes the deciding
              factor is simply whether a buyer can understand price, implementation effort, and adjacent workflow value
              quickly enough to get internal approval. Public disclosures therefore support a nuanced view of
              competition: it is not enough for Factorial to be better than one rival on one feature; it must stay
              legible, local, and cost-effective across multiple buyer paths at once.
