companyProfile:
  summary: >-
    Factorial is a Barcelona-based HR and business-management software company founded in 2016. It sells a modular SaaS
    platform for SMEs spanning core employee records, time and attendance, leave, payroll-adjacent workflows,
    recruiting, performance, documents, expenses, integrations, and a growing finance/IT layer. By mid-2026 the company
    had reached an official $100M ARR floor, served 16,000+ customers, and raised a $150M Series D at a $2.5B valuation
    after multiple financings from General Catalyst.
