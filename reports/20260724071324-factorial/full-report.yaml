  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The right market definition for Factorial is broader than core HRIS but narrower than all business
              software. The retained sources support a market boundary built around employee record, time,
              payroll-adjacent, recruiting, performance, self-service, and workflow automation spend, with finance,
              procurement, and IT modules treated as adjacency expansion rather than the original core. Three
              independent market-size lenses then matter. First, the Business Research Company / GII and Research and
              Markets pages place the global HR software market around $58.9 billion in 2026. Second, Fortune Business
              Insights offers a much lower 2026 starting point of $26.2 billion, illustrating methodology dispersion
              across syndicated research. Third, Mordor’s HRIS lens isolates a $19.9 billion 2026 subsegment that is
              narrower but directionally useful for understanding the software-of-record layer Factorial began in. The
              practical takeaway is not to average these numbers mechanically. It is to treat them as a high/base/low
              framing set and then constrain Factorial’s real addressable opportunity toward European SMEs rather than
              the full global enterprise-software universe. Another reason to stay disciplined is that published market
              reports frequently mix software license value, cloud subscriptions, implementation services, and adjacent
              workforce tooling. Factorial clearly benefits from the general digitization trend, but its real
              opportunity is where buyers need an integrated system of record plus automation, not every dollar in broad
              enterprise software.
