      - number: '7.3'
        title: Financial model and competitive risks
        blocks:
          - type: paragraph
            body: >-
              The third risk cluster sits at the intersection of valuation, capital structure, and competition.
              Factorial has unquestionably achieved meaningful revenue and fundraising scale, but the business still
              carries public opacity on profitability, debt burden, and the exact economics justifying its $2.5B price.
              Filing-derived summaries point to negative profitability and rising indebtedness even as growth stayed
              strong. That makes the repeated General Catalyst financings a strategic strength and a dependency at the
              same time: they preserved growth capacity, but they also concentrate confidence in one capital provider.
              The valuation debate is similarly live because official ARR disclosure and third-party ARR estimates
              differ sharply, which changes the implied multiple dramatically. Against that backdrop, competition is
              intense from nearly every angle: Personio and HiBob in Europe and the mid-market, Rippling at global
              scale, and incumbents such as Workday, SAP, and Sage that can pressure pricing or product expectations.
              Regional players such as Lucca and Kenjo add more localized pressure. The company can still win, but the
              current valuation leaves less room for execution misses, pricing compression, or slower-than-expected
              expansion monetization. Investors therefore need both better data and continued execution to keep the
              downside contained. That is the core asymmetry investors must price.
