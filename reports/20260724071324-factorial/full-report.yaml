      - number: '4.3'
        title: Unit economics, valuation multiples, and missing disclosure
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports the outline of an efficient-growth narrative but not a complete unit-economics
              model. Management explicitly described the company as both hyper-growth and financially sustainable, and
              the funding structure itself suggests confidence in customer acquisition returns. Even so, no retained
              public source discloses gross margin, CAC payback, NRR, EBITDA, burn, or cash runway. That means any
              investor view of profitability timing remains inferential. The 2026 round price illustrates why the
              missing data matters. Using the $263M GetLatka estimate, the $2.5B valuation implies roughly 9.5x ARR,
              which is premium but understandable for a fast-growing horizontal SaaS platform. Using only the
              company-confirmed $100M ARR floor, the same price implies about 25x ARR, which is far harder to justify
              without very strong growth durability and margin confidence. Review-platform complaints about support and
              module repricing do not invalidate the business, but they do remind investors that monetization quality
              and customer goodwill still require verification. The filing-derived signals point in the same direction.
              eInforma’s summary of deposited accounts indicates negative 2024 profitability and sharply higher
              indebtedness, but without enough line-item disclosure in the retained public materials to reconcile burn,
              cash balance, or covenant risk. That combination is not a thesis-breaker for a scaling SaaS company, yet
              it does mean the underwriting case depends on diligence access to full annual accounts, board materials,
              and customer-cohort reporting before one can defend the latest valuation with high confidence.
