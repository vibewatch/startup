      - number: '3.3'
        title: Moat durability and where Factorial is vulnerable
        blocks:
          - type: paragraph
            body: >-
              Factorial’s best moat claim is that it combines SME accessibility with multi-module breadth and European
              localization. That is a real positioning advantage, but it is not unassailable. Personio is the most
              dangerous direct European rival because it already proved the same “SME Workday” narrative can attract far
              larger valuation support. Rippling is strategically threatening because its expansion path across HR, IT,
              and finance mirrors the same horizontal ambition Factorial now articulates, only from a larger US scale
              base. HiBob raises the bar in the upper mid-market with stronger multinational proof and an earlier $100M
              ARR milestone. Meanwhile, Workday and SAP remain dangerous when buyers outgrow lighter suites and
              prioritize deep compliance or enterprise integration. Factorial’s own review-site complaints around
              support and workflow rigidity show that execution quality still matters: if implementation or service
              falls short, the company can lose the very simplicity advantage it needs against both point tools and
              large incumbents. The practical diligence question is whether Factorial can keep landing accounts quickly
              enough to preserve its simplicity advantage while still adding the deeper localization, reporting, and
              service layers needed to resist larger rivals. Public disclosures therefore support a nuanced view of
              competition: it is not enough for Factorial to be better than one rival on one feature; it must stay
              legible, local, and cost-effective across multiple buyer paths at once.
