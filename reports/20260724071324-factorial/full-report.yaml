      - number: '8.2'
        title: Scenarios, comparables, and valuation range
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to value Factorial from public data is by scenario analysis rather than by one hard
              number. The comparable set is mixed. Personio, HiBob, and Rippling are the closest private software
              references, but each differs in size, geography, and go-to-market. BambooHR, Sage, Kenjo, and Lucca help
              frame packaging and market-positioning pressure more than direct mark parity. Workday and SAP are even
              less direct as multiple comps, but they matter because they show where category expectations and incumbent
              responses can migrate. That leaves three practical scenarios. In a bull case, Factorial is much closer to
              the upper ARR estimate, cross-sells aggressively, and deserves a double-digit ARR multiple because it is
              becoming the European SME work platform. In a base case, growth remains strong but disclosure gaps and
              competition keep investors from paying peak software multiples. In a bear case, the company proves less
              efficient than the current mark assumes and valuation support compresses toward the lower end of the
              private-software range. That framework argues for a premium but not unlimited valuation envelope, with the
              current round acceptable only if the business sustains category-leader momentum. In other words, the
              public data justify a range and a stance, not false precision about fair value.
