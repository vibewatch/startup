              Durability is the weakest part of the public customer record. Review and customer-proof surfaces imply
              users find the product easy to adopt and useful for everyday HR administration, but Factorial does not
              publish NRR, GRR, logo churn, cohort retention, average contract length, or concentration data in the
              retained materials. That means public sources support a land-and-expand story more than they prove one.
              The positive side of the expansion case is obvious: mobile usage, Slack distribution, Zapier automation,
              and adjacent modules such as expenses, ATS, payroll, and time tracking all create additional reasons for a
              customer to stay once the product is embedded. Reviews from People Managing People also frame the tool as
              strong for fast onboarding and simple workflows. The negative side is that some of those same reviews flag
              limited reporting, packaging constraints, support friction, and workflow depth limitations. Those are
              exactly the types of issues that can cap expansion or create churn at the moment customers become more
              complex. In short, Factorial appears to have real adoption and credible expansion vectors, but the public
              record still lacks the retention and concentration data needed to underwrite durability with high
