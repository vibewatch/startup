      - number: '2.2'
        title: Buyer, user, and geography map
        blocks:
          - type: paragraph
            body: >-
              The core buyer inside Factorial’s natural segment is usually an HR lead or operations lead, but the payer
              can shift toward the CEO or CFO as companies grow and add finance, expenses, procurement, or IT modules.
              Factorial’s own materials explicitly support this multi-buyer reading by describing value to HR directors,
              CFOs, and CEOs rather than only to one HR administrator. The strongest geographic logic sits in Europe’s
              SME base. The European Commission’s SME definition gives the policy frame, while Germany’s country fact
              sheet and IfM Bonn statistics show why Germany matters: more than 3.2 million SMEs, over half of
              enterprise employment, and still-recovering but durable mid-market density. Factorial’s own March 2025 and
              June 2026 announcements line up with this market logic, naming Germany first and France and Italy next.
              That means the company’s practical SAM is not the entire global HR market; it is the subset of European
              SMEs that need cross-border workflow standardization while still caring about local labor-law and payroll
              compliance. The implication for underwriting is that the buyer map is a progression, not a single persona.
              Small accounts can land with one admin-centric use case, while larger accounts only justify higher ACV
              when the platform becomes relevant to finance, operations, and country-management workflows as well.
