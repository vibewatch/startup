  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Factorial's strongest product signal is breadth that is legible from public surfaces. The company does not
              market a single-point HR tool; it markets a system that begins with employee records and basic HR
              administration, then expands into time tracking, payroll-adjacent workflows, recruiting, performance,
              expenses, documents, and a wider operational layer spanning finance, procurement, and IT. That breadth
              matters because the core underwriting question is not simply whether Factorial can win a payroll or
              time-tracking budget, but whether it can become the daily operating layer for SMEs that want one place to
              run people operations. The workflow evidence is concrete. Public pages show clock-ins from mobile, QR,
              facial recognition, and geolocation; payroll workflows that consolidate attendance, reimbursements,
              benefits, and taxes; ATS flows that connect hiring to onboarding; and mobile surfaces that let employees
              complete routine actions without returning to a desktop portal. The main limitation is that public pages
              show what Factorial can do, not the attach-rate by module or the share of customers that actually activate
              the full stack. Still, the open-web evidence clearly supports a modular land-and-expand design rather than
              a narrow single-feature product. The breadth is especially relevant in Europe, where SMEs often prefer
              fewer systems of record because payroll, attendance, and leave data must stay aligned across local
              compliance workflows.
