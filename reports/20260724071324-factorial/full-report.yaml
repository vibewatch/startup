      - number: '7.2'
        title: Operational, dependency, and execution risks
        blocks:
          - type: paragraph
            body: >-
              The second risk cluster comes from scale and operational complexity. Factorial now serves more than 16,000
              customers, runs customer-facing mobile surfaces, distributes workflows into Slack and Zapier, and supports
              daily use cases such as time, absences, documents, and payroll inputs. That breadth strengthens retention
              logic, but it also means failures propagate quickly. Support complaints, workflow-depth limits, and
              release quality now matter at a much larger scale than when the company was a small point solution. The
              status page is encouraging, and independent status monitoring gives some confidence that availability is
              actively managed. Even so, once a product becomes embedded in attendance, payroll-adjacent, and approval
              workflows, even short-lived issues can create outsized downstream customer pain. Execution risk also rises
              with headcount and geographic footprint. A 1,500+ person company spanning multiple languages and markets
              has to coordinate product, go-to-market, compliance, and support with much more rigor than an
              earlier-stage startup. That does not make the business fragile, but it does mean operational excellence
              now has to be institutional, not founder-heroic. That scaling challenge is operationally normal, but it
              becomes investment-material at this size. Even contact-surface localization hints at added coordination
              overhead.
