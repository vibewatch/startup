  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, modules, and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Factorial’s monetization logic is clearer than many private SaaS peers because the company publishes an
              entry point and exposes a wide module catalog. The plans page starts at $8 per user per month for
              Factorial Core and then layers optional modules across time, talent, finance, procurement, IT, and
              security. That structure matters because it supports a classic land-and-expand model: core HR workflows
              can land smaller employers, while higher-value modules such as recruitment, performance, expenses, payroll
              connectors, procurement, SaaS management, device management, and endpoint security expand account value
              over time. The public product pages also show that the company is deliberately widening monetizable
              surface area beyond traditional HR administration. Retention should benefit from this breadth because
              integrations, self-service mobile workflows, and embedded operational data can increase switching costs
              once customers activate multiple modules. The main caveat is that public pages are far more transparent on
              what can be bought than on how attach rates, churn, or net revenue retention actually behave. Public
              evidence, however, still stops short of revenue recognition detail. The site does not disclose how much
              revenue comes from core subscriptions versus add-on modules, what share is sold annually versus monthly,
              or how implementation, payroll localization, and partner-delivered services are recognized. That leaves
              investors with solid visibility into list monetization architecture but little visibility into realized
              ARPU or contraction risk.
