            body: >-
              Founder continuity is a clear strength in Factorial's public record. Jordi Romero remains the company's
              CEO and lead external narrator across funding, product, and market-positioning announcements. Bernat
              Farrero remains visible in founder communications around product expansion and the AI transition, while
              Pau Ramírez continues to appear in public profiles as a co-founder. The leadership story is stronger than
