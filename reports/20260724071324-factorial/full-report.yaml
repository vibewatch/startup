  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct, indirect, and substitute competitor set
        blocks:
          - type: paragraph
            body: >-
              Factorial competes in a layered market rather than against one clean peer group. The closest direct rivals
              are European or international HR suites that target SMEs and the mid-market with broad functionality:
              Personio is the clearest like-for-like strategic rival, HiBob competes from the upper mid-market and
              multinational side, and Lucca plus BambooHR represent credible alternatives for buyers prioritizing ease
              of use, HR depth, or local brand familiarity. A second layer consists of local or niche specialists such
              as Kenjo, which can win specific deskless or workflow-heavy segments without matching Factorial’s full
              breadth. A third layer is made up of enterprise incumbents such as Workday and SAP, which are less direct
              for the smallest accounts but can still absorb more complex or compliance-intensive buyers as customers
              scale up. This layering matters because it means Factorial must defend itself simultaneously on
              affordability, breadth, localization, and usability. The result is a market where competitive pressure
              changes as customers mature: very small employers may compare Factorial to point tools, 50-500 employee
              firms may compare it to Personio or BambooHR, and larger multi-country accounts may compare it to HiBob,
              Rippling, or enterprise suites. Public disclosures therefore support a nuanced view of competition: it is
              not enough for Factorial to be better than one rival on one feature; it must stay legible, local, and
              cost-effective across multiple buyer paths at once.
            claimRefs:
              - CP001
              - CP002
