    {
      "id": "architecture-and-developer-surface",
      "title": "Architecture, APIs, and ecosystem operating model",
      "body": "Public technical evidence is materially better on Factorial's interfaces than on its hidden infrastructure. The company maintains developer documentation, an integrations framework, a marketplace, and independent API-directory coverage that collectively show a mature external integration posture. The API surface is versioned, REST-based, and broad enough to touch not only employee and attendance data but also payroll, approvals, projects, finance, procurement, IT assets, and documents. That is important because it suggests the platform is becoming an operational graph, not only an HR database. The operating model also looks partner-aware. Official documentation says the integrations framework moves compensation and expense data into payroll and ERP systems, while Slack and Zapier integrations prove the company is exposing workflow value into common communication and automation environments. Public evidence also confirms one piece of the user-supplied tech stack: Factorial's engineering writing says the team moved early from Phoenix to Ruby on Rails to ship quickly. What remains unproven from retained sources is the current frontend and cloud substrate. I found no direct public proof for React or AWS in the retained materials, so those claims should stay in diligence-gap status rather than in the chapter's verified architecture narrative.",
