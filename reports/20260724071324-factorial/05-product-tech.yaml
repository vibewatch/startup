  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Factorial's public product footprint is unusually broad for an SME HR platform: core HR, time, payroll-adjacent workflows, recruiting, performance, expenses, documents, integrations, and a growing finance/IT layer are all visible. The company also exposes a credible developer surface through public API docs, a marketplace, webhook guidance, and partner integrations such as Slack and Zapier. Trust and maturity signals are real—Trust Center, privacy/GDPR pages, legal entity disclosures, and a live status page—but infrastructure transparency is still incomplete, especially around the current frontend/cloud stack and deeper security attestations."
  },
  "sections": [
    {
      "id": "product-scope-and-workflows",
      "title": "Product scope and customer workflow coverage",
      "body": "Factorial's strongest product signal is breadth that is legible from public surfaces. The company does not market a single-point HR tool; it markets a system that begins with employee records and basic HR administration, then expands into time tracking, payroll-adjacent workflows, recruiting, performance, expenses, documents, and a wider operational layer spanning finance, procurement, and IT. That breadth matters because the core underwriting question is not simply whether Factorial can win a payroll or time-tracking budget, but whether it can become the daily operating layer for SMEs that want one place to run people operations. The workflow evidence is concrete. Public pages show clock-ins from mobile, QR, facial recognition, and geolocation; payroll workflows that consolidate attendance, reimbursements, benefits, and taxes; ATS flows that connect hiring to onboarding; and mobile surfaces that let employees complete routine actions without returning to a desktop portal. The main limitation is that public pages show what Factorial can do, not the attach-rate by module or the share of customers that actually activate the full stack. Still, the open-web evidence clearly supports a modular land-and-expand design rather than a narrow single-feature product. The breadth is especially relevant in Europe, where SMEs often prefer fewer systems of record because payroll, attendance, and leave data must stay aligned across local compliance workflows.",
