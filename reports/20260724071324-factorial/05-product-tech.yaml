    {
      "id": "trust-reliability-and-maturity",
      "title": "Trust, reliability, and maturity signals",
      "body": "Factorial's trust story is visible but incomplete. On the positive side, the company publishes a Trust Center, a privacy policy updated in January 2026, a GDPR-specific page, a legal notice naming the Barcelona legal entity, and a public status page that exposes major product components and reports 99.99% uptime over the prior 90 days. Those are meaningful maturity signals for an HR platform handling sensitive employee and payroll-adjacent data. They indicate the company understands that compliance, privacy, and service reliability are part of the product, not post-sale paperwork. The public status page is especially useful because it shows operations across the app, API, authentication, and AI features rather than hiding all reliability evidence behind a sales process. At the same time, the trust surface remains lighter than what a large buyer or investor would want for final diligence. The retained sources do not provide a full attestation packet, deep security-control mappings, or public module-level SLA commitments. Review evidence also shows that support and integration friction can still affect implementation quality, so the company's technical maturity should be viewed as credible but not yet fully transparent from public evidence alone. Procurement teams will still ask for more.",
