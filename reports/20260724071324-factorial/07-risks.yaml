  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Factorial’s risk profile is that of a scaled, multi-country HR platform whose upside is real but whose obligations are widening faster than its public disclosures. The biggest risks are privacy/compliance execution, support and workflow quality at scale, capital-provider and model dependence around the $2.5B valuation, and competitive compression from both European HR rivals and large incumbents. Public trust, status, and financing signals are meaningful positives, but they do not eliminate the need for deeper diligence on attestation depth, retention quality, debt terms, and capital concentration."
  },
  "sections": [
    {
      "id": "regulatory-and-trust-risks",
      "title": "Regulatory, privacy, and trust risks",
      "body": "Factorial's first-order risk category is not lack of demand but the burden of handling sensitive employment data across jurisdictions. The public record makes clear that the company operates under EU and UK privacy frameworks, markets GDPR compliance directly, and exposes a formal Trust Center. That is positive. It means compliance is part of the company's product and sales motion. But it also means privacy failures are potentially thesis-breaking rather than peripheral. HR platforms store absences, compensation context, documents, identity data, and operational records that can trigger immediate legal, reputational, and customer-renewal consequences when controls fail. Public evidence also shows limits: the trust surface is visible, but deeper attestations remain gated; the company explains its legal entity and privacy posture, but not the full detail a security review would want before signing a large contract. The risk is therefore best framed as manageable but always on. Factorial has enough public trust scaffolding to show seriousness, yet investors should assume regulatory, privacy, and customer-trust execution remain continuous obligations rather than solved checkboxes. Buyers with stricter procurement gates will still demand much more detail than the public web currently offers. The presence of Article 32, 33, 34, and 35 duties in the retained materials also shows why this risk is structural, not optional. That governance burden does not disappear after launch.",
