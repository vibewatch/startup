  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Factorial deserves a positive investment stance because the company has already reached real scale, a broad SME operating-platform product shape, and strong strategic relevance in European HR software. But the $2.5B June 2026 valuation is supportable only under a premium-growth lens, not under a disclosure-rich or low-risk lens. I land on Buy with medium confidence and high risk: attractive enough to back, but only with disciplined assumptions about revenue quality, retention, margins, and capital structure."
  },
  "sections": [
    {
      "id": "thesis-and-recommendation",
      "title": "Recommendation, confidence, and price sensitivity",
      "body": "Factorial is a business I would rather own than avoid, but the call is inseparable from price discipline. The June 2026 Series D at $2.5B clearly reflects a company that has crossed relevance thresholds: official $100M ARR, 16,000+ customers, a large multinational employee base, and a product story that stretches beyond core HR into a broader SME operating platform. Those facts support a positive directional view. The problem is that the valuation sits on top of large public uncertainty about the true revenue run-rate, retention quality, margin structure, and debt profile. If investors anchor to the company-confirmed ARR floor, the round price screens very rich. If they anchor to the higher third-party estimate, it screens like a premium but still arguable growth-software deal. My recommendation is therefore Buy, but specifically as a premium-growth Buy with medium confidence and high risk. This is not a cheap entry and it is not a disclosure-rich underwriting case. It is a thesis that the company has already become important enough in European SME HR software to keep compounding into its valuation, provided later diligence does not reveal weak retention or fragile unit economics. That nuance is the difference between enthusiasm and discipline. Investors should remember that nuance before celebrating the headline.",
