  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Factorial operates inside a large and still-growing HR software market, but the usable opportunity is narrower than broad syndicated TAM figures suggest. Retained sources support a range of roughly $26B-$59B for global HR software in 2026 and about $19.9B for the HRIS core, while Germany alone contributes one of Europe’s deepest SME buyer pools at 3.2M-3.5M businesses. The strongest adoption drivers are compliance complexity, cloud migration, AI-enabled workflow automation, and hybrid-work administration; the main brakes are switching costs, privacy concerns, and SME budget constraints."
  },
  "sections": [
    {
      "id": "market-boundary-and-size",
      "title": "Market boundary and sizing lenses",
      "body": "The right market definition for Factorial is broader than core HRIS but narrower than all business software. The retained sources support a market boundary built around employee record, time, payroll-adjacent, recruiting, performance, self-service, and workflow automation spend, with finance, procurement, and IT modules treated as adjacency expansion rather than the original core. Three independent market-size lenses then matter. First, the Business Research Company / GII and Research and Markets pages place the global HR software market around $58.9 billion in 2026. Second, Fortune Business Insights offers a much lower 2026 starting point of $26.2 billion, illustrating methodology dispersion across syndicated research. Third, Mordor’s HRIS lens isolates a $19.9 billion 2026 subsegment that is narrower but directionally useful for understanding the software-of-record layer Factorial began in. The practical takeaway is not to average these numbers mechanically. It is to treat them as a high/base/low framing set and then constrain Factorial’s real addressable opportunity toward European SMEs rather than the full global enterprise-software universe. Another reason to stay disciplined is that published market reports frequently mix software license value, cloud subscriptions, implementation services, and adjacent workforce tooling. Factorial clearly benefits from the general digitization trend, but its real opportunity is where buyers need an integrated system of record plus automation, not every dollar in broad enterprise software.",
