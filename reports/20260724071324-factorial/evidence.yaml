evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-composition
    missingEvidence: Current board composition, observer rights, and voting thresholds.
    whyItMatters: Investor-control and governance quality cannot be fully assessed from public evidence alone.
    diligencePath: Request the latest board list, governance documents, and investor rights summary from company counsel.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: current-scale-metrics
    missingEvidence: >-
      Reconciled customer-country-headcount definitions across official pages and third-party trackers, including which
      milestone table values should be treated as canonical.
    whyItMatters: Later chapters need canonical scale anchors to avoid metric drift and overstated valuation confidence.
    diligencePath: Ask management for a dated KPI pack defining customers, countries served, and full-time-equivalent headcount.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Fully diluted cap table and separation of equity raised versus structured financing.
    whyItMatters: Capital concentration and valuation mechanics cannot be judged cleanly without instrument-level detail.
    diligencePath: Request cap table, debt or revenue-share terms, and post-Series D investor ownership.
    relatedQuestionRefs:
      - QO010
      - QO022
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: arr-range
    missingEvidence: Company-confirmed 2025 ARR above the $100M floor or rebuttal of the $263M GetLatka estimate.
    whyItMatters: Revenue range materially changes implied valuation multiple work in Chapter 8.
    diligencePath: Request audited or board-approved ARR history for 2024-2026 and definitions of ARR versus recognized revenue.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: operational-risks
    missingEvidence: Management-level explanation of support, pricing-change, and product-quality complaints visible on review sites.
    whyItMatters: >-
      The public record is strongly positive, so even small adverse customer patterns should be contextualized before
      scaling assumptions are made.
    diligencePath: Request churn reasons, NPS trend, and support-ticket backlog by market.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: europe-sme-hr-spend
    missingEvidence: A precise Europe-only SME HR software spend estimate built on transparent methodology.
    whyItMatters: >-
      The chapter can bound the market, but it cannot prove one exact Europe TAM for Factorial from retained public
      sources.
    diligencePath: Ask management or sector specialists for bottoms-up spend by employee band and core module adoption.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM001
  - type: private-evidence-only
    severity: minor
    topic: actual-som
    missingEvidence: Factorial internal segmentation by company size, country, and sales conversion rates.
    whyItMatters: Without pipeline and conversion data, public SOM framing remains illustrative rather than underwritten.
    diligencePath: Request pipeline by country and employee band plus CAC payback by segment.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: private-pricing
    missingEvidence: Current private pricing and commercial discounting for Personio, HiBob, Rippling, BambooHR, and Lucca.
    whyItMatters: >-
      Packaging and pricing power are central to competitive durability, but public pages reveal very little for most
      rivals.
    diligencePath: Collect competitor quotes from channel checks or customer references in Germany, France, and Spain.
    relatedQuestionRefs:
      - QP024
      - QP025
    relatedTableRefs:
      - TP003
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: win-loss-data
    missingEvidence: Factorial win/loss rates against each major rival by country and employee band.
    whyItMatters: >-
      The public narrative can describe threats, but only internal CRM data can rank which ones actually matter most
      today.
    diligencePath: Request sales win/loss reporting for Personio, HiBob, Rippling, and local incumbents.
    relatedQuestionRefs:
      - QP017
      - QP018
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, NRR, CAC payback, and cohort-level expansion data.
    whyItMatters: >-
      These metrics determine whether premium valuation and non-dilutive financing are justified by repeatable
      economics.
    diligencePath: Request board or lender materials showing ARR, gross margin, CAC payback, and cohort retention by country.
    relatedQuestionRefs:
      - QI012
      - QI016
      - QI022
      - QI023
    relatedTableRefs:
      - TI003
      - TI005
  - type: conflicting-data
    severity: material
    topic: arr-range
    missingEvidence: >-
      Reconciled explanation for the gap between the official $100M ARR confirmation and the much higher $263M GetLatka
      estimate.
    whyItMatters: The valuation multiple can look reasonable or demanding depending on which revenue denominator is closer to truth.
    diligencePath: Request management ARR bridge and accounting definitions for invoiced revenue, ARR, and recognized revenue.
    relatedQuestionRefs:
      - QI004
      - QI009
      - QI010
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: minor
    topic: pricing-realization
    missingEvidence: Realized pricing by module, discounting, and expansion attach rates.
    whyItMatters: Public plans show structure but not monetization quality.
    diligencePath: Request price realization and module attach by cohort and geography.
    relatedQuestionRefs:
      - QI014
      - QI020
    relatedTableRefs:
      - TI002
