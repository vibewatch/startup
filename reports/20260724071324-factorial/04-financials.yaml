    {
      "id": "capital-and-scale",
      "title": "Revenue scale, capital stack, and growth funding",
      "body": "The strongest disclosed financial scale marker is the June 2026 confirmation that Factorial had reached $100M ARR. Third-party estimates are materially higher: GetLatka puts 2025 ARR at $263M, while Forbes España reported €84.4M of invoiced revenue and a 500-hire plan during 2025. Rather than forcing those numbers into false precision, the better read is that Factorial has clearly crossed meaningful scale but still with wide public uncertainty on exact run-rate and recognition definitions. The capital stack is equally notable. By 2026 the company had added a $150M Series D at a $2.5B valuation on top of a General Catalyst relationship that had already expanded to $200M of non-dilutive growth financing and then a further $540M of Customer Value Fund capacity. This gives Factorial unusual firepower for GTM and product expansion while preserving more founder and shareholder equity than a fully equity-funded path would have required. Registry-derived filings strengthen the picture but also complicate it. eInforma reports that the latest deposited accounts available are for 2024, that sales grew 72.83% from 2023 to 2024, and that the latest-year result remained negative. In other words, Factorial appears to have paired very fast top-line growth with continuing accounting losses, which makes access to structured growth capital strategically important rather than merely opportunistic.",
