    - Personio、HiBob、Rippling 以及 Workday、SAP 等大型既有厂商带来的竞争仍然激烈。
  unresolvedGaps:
    - 经审计收入质量、留存队列和毛利率趋势仍未公开。
    - 债务条款、契约结构，以及结构化融资在下行情景下的确切风险仍不清楚。
    - 公开证据确认历史上使用 Ruby on Rails，但无法确认完整的当前前端 / 云端技术栈。
