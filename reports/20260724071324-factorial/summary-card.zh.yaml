  topStrengths:
    - 真实运营规模：16,000+ 家客户、1,500+ 名员工，以及官方公布的 $100M ARR 里程碑。
    - 产品宽度支撑的是欧洲 SME 平台逻辑，而不是单点方案逻辑。
    - Series D 股权融资加上此前结构化融资，让公司有空间继续扩张。
  topRisks:
