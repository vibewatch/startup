      - number: '1.3'
        title: 融资历史、估值路径和投资人集中度
        blocks:
          - type: paragraph
            body: >-
              Factorial 的融资路径分三段。第一段，公司靠种子轮、种子延展轮和 Series A 资金搭早期平台，到 2021 年 9 月 Series B 公告时累计融资约 $100M。第二段，2022 年 10
              月，公司完成 Atomico 领投的 $120M Series C，以 $1B 估值跨过独角兽门槛。第三段，在公开股权融资空窗之后，Factorial 大量使用 General Catalyst
              的客户价值融资结构，2025 年 3 月将该承诺扩大到 $200M；到 2026 年 6 月，公司重新开启股权融资，以 $2.5B 估值完成 $150M Series D 轮。这个顺序重要，因为它意味着
              General Catalyst
              已不只是另一个投资人：它现在是增长融资和新股权两端的主导外部资本伙伴。公开数据提供方对累计融资总额有分歧，关键在于是否计入类债务工具；最干净的表述，是把已披露股权历史和已承诺的非稀释融资分开看。在这个口径下，Factorial
              2026 年的资本充足度明显高于历史任何时点，但对单一资本伙伴的暴露也高于仅看 2022 年财团时的印象。
