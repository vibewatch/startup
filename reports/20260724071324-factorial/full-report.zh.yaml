      - number: '7.2'
        title: 运营、依赖和执行风险
        blocks:
          - type: paragraph
            body: >-
              第二组风险来自规模和运营复杂度。Factorial 如今服务超过 16,000 家客户，运行面向客户的移动端表面，把工作流分发到 Slack 和
              Zapier，并支持考勤、缺勤、文档和薪酬输入等日常用例。这个宽度强化留存逻辑，但也意味着故障会快速传播。支持投诉、工作流深度限制和发布质量，现在比公司还是小型点状解决方案时重要得多。状态页令人鼓舞，独立状态监控也让人对可用性主动管理有一定信心。即便如此，一旦产品嵌入考勤、薪酬衔接和审批工作流，即使短暂问题也会给客户造成放大的下游痛感。执行风险还会随员工规模和地理足迹上升。一家
              1,500+
              人、横跨多种语言和市场的公司，必须比早期创业公司更严密地协调产品、商业化、合规和支持。这不会让业务变脆弱，但意味着运营优秀必须制度化，不能再靠创始人英雄主义。这个扩张挑战在运营上很正常，但放到这个规模就具备投资重要性。就连联系入口本地化也暗示了额外协调成本。
