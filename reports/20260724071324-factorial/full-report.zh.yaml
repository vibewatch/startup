      - number: '1.4'
        title: 里程碑、国际扩张和剩余披露缺口
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，作为欧洲中小企业软件供应商，Factorial 扩张速度异常快。公司 2021 年完成成长期 Series B，2022 年成为独角兽，2025 年转向结构化非稀释资本，2026 年中公开跨过
              $100M ARR，数周后又借 Series D 公告把产品叙事重置到 AI。地理叙事同样重要。德国在 2025 年 3 月还是快速增长市场，到 2026 年 6
              月已成为第一大国际增长市场，并有科隆和慕尼黑办公室开设支撑。法国和意大利也反复出现在获融资支持的扩张优先事项中，公开联系入口则确认公司在墨西哥和巴西有活跃的拉美运营点。主要披露缺口不在于公司是否增长，而在于如何调和相互冲突的规模信号。公开记录支持
              16,000+ 家客户和 $100M ARR 下限，但第三方追踪器发布的收入和员工数估计显著更高，且未经公司确认。这个缺口应进入后续章节，作为明确的承销提醒，而不是被悄悄平均掉。
