      - number: '1.2'
        title: 创始人、管理层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人延续性是 Factorial 公开记录中的明确强项。Jordi Romero 仍担任 CEO，并继续在融资、产品和市场定位公告中承担公司对外叙事主角。Bernat Farrero 在产品扩张和 AI
              转型相关的创始人沟通中仍然可见，Pau Ramírez
              也继续以联合创始人身份出现在公开资料里。管理层故事强于治理故事：公开材料足以描出创始人和各自职能覆盖，但无法给出完整董事会名单、治理委员会结构或股权分布。对私人公司来说，这种不对称很常见，但会限制外部对治理风险和投资人控制权的判断精度。创始人与市场的匹配可信：几位创始人持续围绕工作流简化、生产力软件和务实扩张来讲公司，而不是只靠品类理论包装。尽调结论是，管理连续性很强，但董事会可见度仍然有限，应作为后续尽调问题，而不是已解决的问题。
