      - number: '5.3'
        title: 信任、可靠性和成熟度信号
        blocks:
          - type: paragraph
            body: >-
              Factorial 的信任叙事可见，但不完整。正面来看，公司发布 Trust Center、2026 年 1 月更新的隐私政策、GDPR 专页、写明 Barcelona
              法人实体的法律声明，以及公开状态页；状态页列出主要产品组件，并报告过去 90 天可用时间为 99.99%。对一个处理敏感员工和薪酬衔接数据的 HR
              平台来说，这些是有意义的成熟度信号。它们说明公司理解，合规、隐私和服务可靠性是产品的一部分，不是售后文书。公开状态页尤其有用，因为它展示了应用、API、身份认证和 AI
              功能的运行情况，而不是把全部可靠性证据藏在销售流程后面。同时，信任表面仍轻于大型买方或投资人做最终尽调所需的程度。留存来源没有提供完整审计证明包、深度安全控制映射，或公开的模块级 SLA
              承诺。评论证据也显示，支持和集成摩擦仍会影响实施质量，因此仅从公开证据来看，公司的技术成熟度可信，但尚未完全透明。采购团队仍会要求更多材料。
