      - number: '6.3'
        title: 耐久性、扩张和集中度问题
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开客户记录中最弱的一环。评论和客户验证表面暗示用户觉得产品易采用、日常 HR 管理有用，但 Factorial 未在留存材料中公布
              NRR、GRR、客户流失、客户分群留存、平均合同期限或集中度数据。这意味着公开来源更能支持先落地再扩张故事，而不是证明它。扩张案例的正面很明显：移动使用、Slack 分发、Zapier
              自动化，以及费用、ATS、薪酬和考勤等邻近模块，都让产品嵌入后多出客户继续使用的理由。People Managing People
              的评论也把该工具描述为适合快速入职和简单工作流。负面在于，同一批评论也指出报表有限、包装约束、支持摩擦和工作流深度不足。这些问题正是客户变复杂时会压住扩张或制造流失的类型。简言之，Factorial
              看起来有真实采用和可信扩张向量，但公开记录仍缺少足以高置信度承销耐久性的留存和集中度数据。缺失客户分群细节，是本章没有仅凭公开证据就称耐久性已被证明的最主要原因。
