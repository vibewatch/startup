  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与价格敏感度
        blocks:
          - type: paragraph
            body: >-
              Factorial 是我宁愿持有而不是回避的公司，但这个判断离不开价格纪律。2026 年 6 月的 Series D 估值 $2.5B，清楚说明公司已经跨过重要性门槛：官方披露 ARR $100M、客户
              16,000+、庞大的跨国员工基础，产品叙事也从核心 HR 延伸到更宽的 SME
              运营平台。这些事实支撑方向上偏正面的判断。问题在于，估值压在几项公开不确定性之上：真实收入运行率、留存质量、利润率结构和债务状况。如果投资人锚定公司确认的 ARR
              下限，这轮价格显得很贵；如果锚定第三方更高估算，它更像一笔带溢价但仍说得通的成长软件交易。因此，我的建议是买入，但具体说是带溢价成长属性的买入，信心中等、风险高。这不是便宜的入场点，也不是披露充分的投资判断。这个论点押注的是：Factorial
              在欧洲 SME HR 软件里已经足够重要，只要后续尽调没有发现留存偏弱或单位经济脆弱，公司就能继续复合增长、撑住当前估值。这个分寸，正是热情和纪律的区别。投资人庆祝融资新闻标题之前，应该记住这个分寸。
