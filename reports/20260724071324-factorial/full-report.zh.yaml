  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围和客户工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Factorial 最强的产品信号，是公开表面能够看清的宽度。公司并不营销单点 HR 工具；它营销的是一套系统：从员工档案和基础 HR
              管理起步，再扩展到考勤、薪酬衔接工作流、招聘、绩效、费用、文档，以及横跨财务、采购和 IT 的更广运营层。这个宽度重要，因为核心承销问题不只是 Factorial
              能否赢下一笔薪酬或考勤预算，而是它能否成为中小企业处理人力运营的日常运营层。工作流证据很具体。公开页面显示，员工可通过移动端、QR、人脸识别和地理定位打卡；薪酬工作流整合考勤、报销、福利和税务；ATS
              流程把招聘连到入职；移动端界面让员工无需回到桌面门户也能完成日常动作。主要限制在于，公开页面展示了 Factorial
              能做什么，而不是各模块的附加率，或实际激活完整产品栈的客户占比。即便如此，开放网络证据清楚支持一种模块化先落地再扩张设计，而不是狭窄单功能产品。宽度在欧洲尤其相关，因为中小企业往往偏好更少的记录系统，薪酬、考勤和休假数据必须在本地合规工作流中保持一致。
