      - number: '2.2'
        title: 买方、用户和地理版图
        blocks:
          - type: paragraph
            body: >-
              Factorial 自然客群里的核心买方通常是 HR 负责人或运营负责人，但公司成长并叠加财务、费用、采购或 IT 模块后，付款决策可能转向 CEO 或 CFO。Factorial
              自身材料明确支持这种多买方读法：公司描述给 HR 主管、CFO 和 CEO 的价值，而不只服务一个 HR 管理员。最强的地理逻辑在欧洲中小企业底盘。European Commission
              的中小企业定义给出政策框架，德国的国家事实页和 IfM Bonn 统计则说明德国为什么重要：超过 3.2M 家中小企业，承载逾半企业就业，并且拥有仍在恢复但韧性很强的中端市场密度。Factorial 2025 年
              3 月和 2026 年 6 月的公告也与这一市场逻辑对齐，先点名德国，再点名法国和意大利。这意味着公司的实际 SAM 不是整个全球 HR
              市场，而是欧洲中小企业中那部分需要跨境工作流标准化、同时仍重视本地劳动法和薪酬合规的企业。对承销而言，买方版图是一条递进路径，不是单一画像。小账户可以通过一个以管理员为中心的用例落地；更大账户只有在平台也进入财务、运营和国家管理工作流后，才更容易证明更高
              ACV。
