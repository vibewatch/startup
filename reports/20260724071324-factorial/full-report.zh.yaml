  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私和信任风险
        blocks:
          - type: paragraph
            body: >-
              Factorial 的一阶风险不是缺少需求，而是跨司法辖区处理敏感雇佣数据的负担。公开记录清楚显示，公司在欧盟和英国隐私框架下运营，直接营销 GDPR 合规，并提供正式 Trust
              Center。这是正面因素，说明合规是公司产品和销售动作的一部分。但这也意味着隐私失败可能打破投资论点，而不是外围问题。HR
              平台存储缺勤、薪酬语境、文档、身份数据和运营记录；一旦控制失效，可能立即触发法律、声誉和客户续约后果。公开证据也显示边界：信任表面可见，但更深的审计证明仍设门槛；公司解释了法人实体和隐私姿态，却没有给出大型合同签署前安全审查想看的完整细节。因此，这项风险最适合被表述为可管理但始终存在。Factorial
              有足够公开信任脚手架来显示认真程度，但投资人应假设监管、隐私和客户信任执行是持续义务，而不是已经勾选完成的事项。采购门槛更严的买方仍会要求远多于当前公开网络的信息。留存材料中 Article 32、33、34 和
              35 义务的存在，也说明这项风险是结构性的，不是可选项。治理负担不会在产品上线后消失。
