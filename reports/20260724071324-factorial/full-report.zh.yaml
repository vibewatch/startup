      - number: '8.3'
        title: 什么会改变判断
        blocks:
          - type: paragraph
            body: >-
              现有证据足以支持偏积极，但还不足以停止追问硬问题。主要尽调卡点与财务和客户章节一致：没有公开 NRR 或 GRR，没有清晰的 cohort 留存披露，没有 EBITDA
              或利润率桥，债务条款不完整，当前盈利能力也只能从备案文件中窥见。这些在当前估值下不是细枝末节；它们正是决定 Factorial
              应该按品类领导者交易，还是只是一只高增长但昂贵软件资产的数字。退出故事仍可信，因为公司有真实规模和品类可见度，但单靠公开证据，它仍是更可能而非已经证明。什么会让我从买入转向？ARR
              基础显著弱于第三方估算、出现大幅折扣或留存弱的证据，或者融资条款显示资本依赖比轮次新闻传达得更重。什么会提高确信度？经审计的强留存证据、经营杠杆改善，以及比当前公开信息拼图显示更简单的资本结构。在那之前，公开案例可以投，但风险尚未充分解除。
