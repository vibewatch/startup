      - number: '3.3'
        title: 护城河耐久性和 Factorial 的脆弱点
        blocks:
          - type: paragraph
            body: >-
              Factorial 最有力的护城河主张，是把中小企业可访问性、多模块宽度和欧洲本地化放在一起。这是真实定位优势，但并非不可攻破。Personio 是最危险的直接欧洲对手，因为它已经证明，同样的“中小企业
              Workday”叙事可以拿到更高得多的估值支持。Rippling 的战略威胁在于，它在 HR、IT 和财务上的扩张路径，与 Factorial 如今表达的横向野心相互镜像，只是 Rippling
              的美国规模基础更大。HiBob 在高端中端市场提高了门槛，跨国客户验证更强，也更早达到 $100M ARR 里程碑。同时，当买方长出轻量套件、转而优先考虑深度合规或企业集成时，Workday 和 SAP
              仍然危险。Factorial 自己在评论网站上暴露的支持和工作流僵硬投诉说明，执行质量仍然重要：如果实施或服务不到位，公司会失去它对点状工具和大型存量巨头都必须依赖的简单性优势。实际尽调问题是，Factorial
              能否继续足够快地拿下账户、保住简单性优势，同时补上抵御更大对手所需的更深本地化、报表和服务层。因此，公开披露支持一种更细的竞争判断：Factorial
