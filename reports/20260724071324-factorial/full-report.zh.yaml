      - number: '4.2'
        title: 收入规模、资本结构和增长资金
        blocks:
          - type: paragraph
            body: >-
              最强的已披露财务规模标记，是 2026 年 6 月确认 Factorial 已达到 $100M ARR。第三方估计显著更高：GetLatka 把 2025 年 ARR 估为 $263M，Forbes España
              则报道 2025 年开票收入为 €84.4M，并提到 500 人招聘计划。与其把这些数字压成虚假的精确值，更好的读法是：Factorial
              明显跨过了有意义的规模门槛，但公开层面对准确收入运行率和收入确认定义仍有很大不确定性。资本结构同样值得注意。到 2026 年，公司新增了 $150M Series D，估值 $2.5B；在此之前，General
              Catalyst 关系已扩展到 $200M 非稀释增长融资，随后又增加 $540M Customer Value Fund 容量。这让 Factorial
              在商业化和产品扩张上拥有少见火力，同时比完全依靠股权融资的路径保留了更多创始人和股东权益。登记文件衍生信息强化了这幅图景，也让它更复杂。eInforma 报告称，当前可得的最新提交账目为 2024 年，销售额从
              2023 到 2024 年增长 72.83%，且最新年度结果仍为负。换句话说，Factorial 似乎把极快的收入增长和持续会计亏损放在了一起，这让获得结构化增长资本具有战略意义，而不只是机会主义选择。
