  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、模块和变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Factorial 的变现逻辑比许多私有 SaaS 同业更清楚，因为公司公布了入门价格，并展示了很宽的模块目录。套餐页显示 Factorial Core 起价为每用户每月 $8，然后在考勤、人才、财务、采购、IT
              和安全等方向叠加可选模块。这个结构重要，因为它支撑经典的先落地再扩张模型：核心 HR 工作流可以先落地小雇主，而招聘、绩效、费用、薪酬连接器、采购、SaaS
              管理、设备管理和端点安全等更高价值模块，会随时间扩大账户价值。公开产品页也显示，公司有意把可变现表面积扩到传统 HR
              管理之外。宽度应有利于留存，因为客户激活多个模块后，集成、自助移动工作流和嵌入式运营数据会提高切换成本。主要保留意见是，公开页面对能买什么很透明，却远不透明于附加率、流失或净收入留存的真实表现。公开证据也仍停在收入确认细节之外。网站没有披露收入中核心订阅与附加模块各占多少、年度与月度销售占比，也没有说明实施、薪酬本地化和伙伴交付服务如何确认收入。因此，投资人能清楚看到标价变现架构，却很难看到实际
              ARPU 或收缩风险。
