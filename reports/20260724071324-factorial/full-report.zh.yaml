chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、产品和阶段
        blocks:
          - type: paragraph
            body: >-
              Factorial 是一家创立于 Barcelona 的软件公司，2016 年从面向中小企业的 HR 工作流平台起步；到 2026 年，公司已把自己定位成更广义的企业管理和 AI 运营平台。当前产品姿态把经典
              HR 模块——如考勤、薪酬支持、招聘、绩效和文档工作流——同财务、采购、IT 和 AI 智能体层混在一起。这个变化很关键，因为它改变了投资人对市场边界的判断：Factorial 已不再把自己描述成狭窄的 HR
              工具，而是欧洲中小企业处理人、财务和 IT 工作的横向运营层。公开联系信息和总部证据仍把公司锚定在 Barcelona，即便公司在国际上扩张。当前最强的规模标记来自 2026 年 6 月 Series D
              公告和关于页面：16,000+ 家企业客户，至少覆盖 90+ 个国家，员工规模也已从数百人进入低千人区间。因此，Factorial
              更像一家晚期、未上市的欧洲应用软件公司：动能已经验证，但精确收入和股权结构细节披露仍不均衡。
