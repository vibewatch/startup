      - number: '7.3'
        title: 财务模型和竞争风险
        blocks:
          - type: paragraph
            body: >-
              第三组风险位于估值、资本结构和竞争的交叉点。Factorial 无疑已经达到有意义的收入和融资规模，但业务在盈利能力、债务负担，以及支撑 $2.5B
              价格的具体经济性上仍有公开不透明。文件衍生摘要显示，公司在增长保持强劲的同时，盈利为负、债务上升。这让 General Catalyst
              的反复融资同时成为战略强项和依赖：它们保住了增长能力，也把信心集中到单一资本提供方。估值争论同样仍在进行，因为官方 ARR 披露和第三方 ARR
              估计差距很大，会显著改变隐含倍数。在这一背景下，竞争几乎从每个角度都很激烈：欧洲和中端市场有 Personio 与 HiBob，全球规模上有 Rippling，Workday、SAP 和 Sage
              等存量巨头也会压迫定价或产品预期。Lucca 和 Kenjo 等区域玩家增加了更多本地化压力。公司仍能赢，但当前估值给执行失误、价格压缩或扩张变现慢于预期留下的空间更小。因此，投资人既需要更好的数据，也需要
              Factorial 持续执行，才能控制下行。这是投资人必须定价的核心不对称。
