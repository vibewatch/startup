  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接、间接和替代竞争者集合
        blocks:
          - type: paragraph
            body: >-
              Factorial 面对的是分层市场，而不是一个干净的同业组。最接近的直接对手，是面向中小企业和中端市场、功能宽的欧洲或国际 HR 套件：Personio 是最清晰的同类战略对手，HiBob
              从高端中端市场和跨国公司侧切入，Lucca 与 BambooHR 则是买方重视易用性、HR 深度或本地品牌熟悉度时的可信替代。第二层是本地或垂直专家，例如
              Kenjo，它们可以赢下特定的无桌面员工或工作流密集细分场景，而不必匹配 Factorial 的完整宽度。第三层是 Workday 和 SAP
              等企业级存量巨头；它们对最小账户不那么直接，但客户规模变大、合规要求加深时，仍可能吸走更复杂的买方。这样的分层很重要，因为 Factorial
              必须同时守住可负担性、宽度、本地化和易用性。结果是，竞争压力会随客户成熟而变化：很小的雇主可能拿 Factorial 和点状工具比较，50–500 人公司可能拿它和 Personio 或 BambooHR
              比，规模更大的多国账户则可能比较 HiBob、Rippling 或企业套件。因此，公开披露支持一种更细的竞争判断：Factorial
              不能只在一个功能上胜过一个对手；它必须在多条买方路径上同时保持清晰、本地化和性价比。
