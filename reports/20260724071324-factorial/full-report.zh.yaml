  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Factorial 的正确市场定义应比核心 HRIS 更宽，但比全部企业软件更窄。留存来源支持把市场边界放在员工档案、考勤、薪酬衔接、招聘、绩效、自助服务和工作流自动化支出上；财务、采购和 IT
              模块应视为邻近扩张，而不是最初核心。随后需要看三组独立市场规模口径。第一，Business Research Company / GII 和 Research and Markets 页面把 2026 年全球
              HR 软件市场放在约 $58.9B。第二，Fortune Business Insights 给出低得多的 2026 年起点 $26.2B，显示综合行业研究的方法差异很大。第三，Mordor 的 HRIS
              口径拆出一个 $19.9B 的 2026 年子市场，它更窄，但能帮助理解 Factorial 起步时所在的记录系统层。实际结论不是机械平均这些数字，而是把它们当成高 / 基准 / 低三档框架，再把
              Factorial 的真实可服务机会收束到欧洲中小企业，而不是完整的全球企业软件宇宙。还要保持克制的另一个原因是，公开市场报告经常混合软件许可价值、云订阅、实施服务和邻近劳动力工具。Factorial
              明显受益于整体数字化趋势，但真正机会在于买方需要一套集成的记录系统加自动化，而不是广义企业软件中的每一美元。
