      - number: '4.3'
        title: 单位经济、估值倍数和缺失披露
        blocks:
          - type: paragraph
            body: >-
              公开证据支持高效增长叙事的轮廓，但支撑不了完整的单位经济模型。管理层明确把公司描述为高速增长且财务可持续，融资结构本身也暗示其对获客回报有信心。即便如此，留存公开来源没有披露毛利率、CAC
              回收期、NRR、EBITDA、现金消耗或现金续航。这意味着任何关于盈利时间点的投资人判断都只能推断。2026 年轮次价格说明了缺失数据的重要性。若采用 GetLatka 的 $263M 估计，$2.5B
              估值约等于 9.5x ARR，虽有溢价，但对一家快速增长的横向 SaaS 平台仍可理解。若只采用公司确认的 $100M ARR 下限，同一价格约等于 25x
              ARR；除非增长耐久性和利润率信心非常强，否则难以辩护。评论平台上关于支持和模块重新定价的投诉不会否定业务，但提醒投资人仍需核实变现质量和客户好感。文件衍生信号也指向同一方向。eInforma
              对提交账目的摘要显示，2024 年利润为负，债务显著上升；但留存公开材料缺少足够逐项披露，无法调和现金消耗、现金余额或债务约束风险。对正在扩张的 SaaS
              公司来说，这组情况并不打破投资论点，但意味着只有拿到完整年度账目、董事会材料和客户分群报告后，才能高置信度捍卫最新估值。
