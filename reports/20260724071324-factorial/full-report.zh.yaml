      - number: '3.2'
        title: 相对规模、包装和功能比较
        blocks:
          - type: paragraph
            body: >-
              公开规模披露已经显示出赛道内的明显分层。Personio 2022 年 $8.5B 估值和 6,000 家客户，HiBob 2023 年 $574M 累计融资和 3,500+ 家客户，Rippling 2025
              年 $16.8B 估值和 20,000+ 家客户，都在 Factorial 当前 $2.5B 标记之上或附近形成参照。与此同时，并非每个对手都在解决同一个问题。Factorial 横跨 HR、财务和 IT
              工作流，因而比 BambooHR 或 Kenjo 更横向；但相比 Workday 或 SAP，它对中小企业仍更容易理解。公开定价也重要。Factorial 把入门价清楚展示为每用户
              $8，这对获取中小企业客户有价值，因为许多大型套件对手把价格藏在销售流程后面。集成和 API 进一步强化宽度叙事，让 Factorial
              更容易嵌入现有中小企业工具。实际竞争不只是功能对功能，也是在包装与复杂度、透明度与企业销售摩擦之间竞争。这个区别重要，因为一家公司可能在每个维度都没有被功能碾压，却仍输掉 SMB
              漏斗；有时决定因素只是买方能否足够快地理解价格、实施工作量和邻近工作流价值，从而拿到内部批准。因此，公开披露支持一种更细的竞争判断：Factorial
