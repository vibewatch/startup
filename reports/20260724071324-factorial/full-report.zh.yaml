companyProfile:
  summary: >-
    Factorial 是一家总部在 Barcelona 的 HR 与企业管理软件公司，成立于 2016 年。公司向中小企业销售模块化 SaaS
    平台，覆盖核心员工档案、考勤、休假、薪酬衔接流程、招聘、绩效、文档、费用、集成，以及正在扩展的财务 / IT 层。到 2026 年中，Factorial 官方 ARR 下限已达 $100M，服务 16,000+ 家客户；在
    General Catalyst 多轮融资之后，公司又以 $2.5B 估值完成 $150M Series D 轮。
