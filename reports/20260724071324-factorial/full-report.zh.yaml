            body: >-
              公开技术证据在 Factorial 的接口上明显好于隐藏基础设施。公司维护开发者文档、集成框架、应用市场和独立 API 目录覆盖，这些合在一起显示出成熟的外部集成姿态。API 面是有版本的、基于
              REST，宽到不仅触及员工和考勤数据，也覆盖薪酬、审批、项目、财务、采购、IT 资产和文档。这很重要，因为它说明平台正变成一张运营图谱，而不只是 HR
              数据库。运营模式也看起来重视伙伴。官方文档称，集成框架会把薪酬和费用数据送入薪酬系统和 ERP 系统；Slack 和 Zapier
              集成则证明，公司正把工作流价值暴露到常见沟通和自动化环境中。公开证据还确认了用户提供技术栈中的一项：Factorial 的工程文章称，团队早期为了快速交付，从 Phoenix 转到 Ruby on
              Rails。留存来源仍未证明的是当前前端和云底座。我在留存材料中没有找到 React 或 AWS 的直接公开证据，因此这些说法应留在尽调缺口状态，而不是写入本章已验证的架构叙事。
