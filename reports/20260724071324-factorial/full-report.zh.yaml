        title: 客户结构、细分市场和地理足迹
        blocks:
          - type: paragraph
            body: >-
              Factorial 的客户证据最强之处，在于部署宽度，以及与规模较小、快速增长组织的匹配。官方表面反复表示，公司服务超过 16,000
              家客户，并把买方描述为希望用一套系统处理休假、档案、薪酬输入、招聘及相关工作流的 SMB
              或成长阶段雇主。入门定价和评论页措辞也支持这一读法：它并不按重型企业转型软件来营销，而是给需要更快入职、更少行政负担的团队提供务实运营层。地理是公开叙事需要谨慎的一点。不同官方页面提到的国家数量不同，可能反映活跃客户、支持地区或一般市场存在之间的差异。即便如此，具名客户列表清楚显示了跨境使用，覆盖美国、西班牙、巴西、保加利亚、阿根廷和其他全球语境。这个模式重要，因为它说明
              Factorial 不只是西班牙本土 HR
              工具。公司已经在卖给国际团队，尽管其跨国足迹的确切规模，以及客户基础中有多少位于核心欧洲市场，公开层面仍不清楚。因此，公开客户基础看起来很宽，但公司披露之间尚未完全标准化。
