      - number: '8.2'
        title: 情景、可比对象和估值区间
        blocks:
          - type: paragraph
            body: >-
              仅靠公开数据给 Factorial 估值，最干净的方法不是给一个硬数字，而是做情景分析。可比对象并不纯。Personio、HiBob 和 Rippling 是最接近的私营软件参照，但规模、地域、GTM
              都不一样。BambooHR、Sage、Kenjo 和 Lucca 更适合拿来框定包装与市场定位压力，而不是直接对标估值。Workday 和 SAP
              作为倍数可比更间接，但它们重要，因为它们显示品类预期和在位厂商反击会往哪里移动。因此只剩三个实用情景。牛市情景下，Factorial 更接近 ARR 上限估算，交叉销售跑得激进，并且因为正在变成欧洲 SME
              工作平台，配得上两位数 ARR
              倍数。基准情景下，增长仍强，但披露缺口和竞争让投资人不愿支付软件峰值倍数。熊市情景下，公司效率低于当前估值假设，估值支撑向私营软件区间低端压缩。这个框架支持一个有溢价但非无限的估值区间；当前轮只有在业务维持品类领导者动能时才算可接受。换句话说，公开数据能支撑一个区间和一个立场，不能支撑对公允价值的虚假精确。
