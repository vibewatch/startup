    {
      "id": "founders-and-governance",
      "title": "Founders, leadership, and governance visibility",
      "body": "Founder continuity is a clear strength in Factorial's public record. Jordi Romero remains the company's CEO and lead external narrator across funding, product, and market-positioning announcements. Bernat Farrero remains visible in founder communications around product expansion and the AI transition, while Pau Ramírez continues to appear in public profiles as a co-founder. The leadership story is stronger than the governance story: the public corpus provides enough evidence to map founders and their functional coverage, but not a complete board roster, governance committee structure, or ownership split. That asymmetry is normal for a private company, but it limits precision on governance risk and investor control. Founder-market fit is credible: the founders consistently frame the company around workflow simplification, productivity software, and pragmatic scaling rather than category-theory branding alone. For diligence purposes, the governance takeaway is that management continuity is strong, but board visibility remains partial and should be treated as a follow-up diligence ask rather than a solved question.",
