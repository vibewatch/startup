    {
      "id": "milestones-and-expansion",
      "title": "Milestones, international expansion, and remaining disclosure gaps",
      "body": "The milestone record shows a company that scaled unusually quickly for a European SME software vendor. Factorial raised a growth-stage Series B in 2021, became a unicorn in 2022, turned to structured non-dilutive capital in 2025, publicly crossed $100 million ARR by mid-2026, and then reset the product narrative around AI with the Series D announcement weeks later. The geographic storyline is just as important. Germany moved from a fast-growing market in March 2025 to the number one international growth market in June 2026, backed by office openings in Cologne and Munich. France and Italy also appear repeatedly as funded expansion priorities, while public contact surfaces confirm active Latin American operating points in Mexico and Brazil. The main disclosure gaps are not about whether the company is growing; they are about how to reconcile conflicting scale signals. The public record supports 16,000+ customers and a $100M ARR floor, but third-party trackers publish materially higher revenue and headcount estimates that are not company-confirmed. That gap should travel into later chapters as an explicit underwriting caution, not be silently averaged away.",
