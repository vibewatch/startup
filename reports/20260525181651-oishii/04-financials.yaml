callouts:
  - calloutType: strength
    title: A real premium pricing umbrella is visible publicly
    body: >-
      Public list and observed retailer prices show Oishii can span $4.99 grab-and-go packs, mid-tier daily-use berry
      formats, premium flagship trays, and a $34.99 preserve extension. That is a more credible premium price
      architecture than most failed leafy-greens peers ever demonstrated publicly.
    claimRefs:
      - CI003
      - CI004
      - CI006
      - CI022
      - CI025
  - calloutType: risk
    title: Fresh financing is not the same as visible runway
    body: >-
      The $150 million first close and ~$370 million lifetime funding base are strong signals, but no public source
      translates them into current cash, burn, leverage, or covenant headroom. Investors therefore cannot tell whether
      the latest round is abundant runway or simply the next required capital step.
    claimRefs:
      - CI036
      - CI037
      - CI038
      - CI039
      - CI044
  - calloutType: recommendation
    title: Private diligence must force four bridges
    body: >-
      Before underwriting Oishii, request SKU-level gross margin, per-door velocity and repeat rate, spoilage and rebate
      data, and a current cash/debt bridge by farm. Without those four bridges, management’s unit-economics narrative
      remains directionally positive but still unproven for investment sizing.
    claimRefs:
      - CI015
      - CI019
      - CI021
      - CI045
      - CI046
