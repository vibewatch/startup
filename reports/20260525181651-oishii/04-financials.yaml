      - TI004
    figureRefs:
      - FI003
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial read is constructive but incomplete. Oishii appears to have chosen a better revenue wedge than the
      failed leafy-greens cohort: premium strawberries, a brand consumers and retailers can talk about, a visible price
      ladder from snackable entry points to luxury gifting, and a shelf-stable preserves extension that may help capture
      more value from berry output. The latest financing also suggests there is still investor appetite for the story.
      Those are real positives.


      But none of them closes the underwriting gap. Public evidence still does not disclose the numbers that matter
      most: revenue scale, realized net pricing, gross margin by SKU or channel, spoilage and rebate rates, headcount,
      cash, burn, debt, and capex payback by farm. Even management’s strongest statement on unit economics remains a
      quote in an interview rather than auditable financial disclosure. The practical verdict is therefore not bearish
      on the business model, but cautious on the underwriting process. Oishii looks like a company with real premium
      revenue potential and better strategic positioning than many CEA peers, yet it is still finance-incomplete. Before
      treating the $370 million capital base as evidence of adequacy, an investor should force a private diligence
      package that bridges revenue quality, margin path, and liquidity.
    claimRefs:
      - CI016
      - CI017
      - CI018
      - CI019
      - CI025
      - CI036
      - CI037
      - CI039
      - CI044
      - CI045
      - CI046
