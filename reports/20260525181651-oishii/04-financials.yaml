  title: Financials
  summary: >-
    Oishii now presents a clearer premium-produce revenue model than most vertical-farming peers, with public list
    prices from $4.99 to roughly $15, 300-plus retail doors, and a fresh $150 million Series C first close. But the
    public record still stops short of revenue, gross margin, cash, debt, burn, and runway disclosure, so the business
    looks directionally financeable but remains materially underwriteable on core economics.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model, pricing ladder, and commercialization surface
    body: >-
      Oishii’s public financial story starts with a simple point: this is a physical-product revenue model, not a
      subscription business. The official story and product pages frame the company around premium fruit, while the 2026
      pricing announcements and current FreshDirect listings show that monetization now spans multiple berry formats
      plus higher-priced preserves. The current public lineup is no longer just a prestige strawberry sold at
      exceptional price points. Instead, Oishii has built a visible ladder from a $4.99 Strawberry Bento Box and $7.99
      daily-use formats up to $11.99 reserve-grade berries, while observed retailer pricing still shows the flagship
      Omakase Berry at $14.99 and the Daifuku-Inspired Strawberry Spread at $34.99. That matters because it suggests
      management is trying to widen trial occasions without abandoning premium positioning.


      Just as important, the GTM evidence points to retail and e-grocery shelf presence rather than direct long-term
      contracts. The store locator showed multi-state availability on the run date, and April 2026 packaging coverage
      said Oishii products were already in more than 300 U.S. retail locations, with an ambition to double that
      footprint by year-end. Revenue quality therefore looks more like branded premium CPG produce than like project
      revenue or software ARR. The problem is that public evidence still gives only list or observed shelf prices. It
      does not reveal realized wholesale pricing, retailer deductions, trade spend, spoilage allowances, or the mix
      between flagship trays, everyday formats, and preserves.
    claimRefs:
