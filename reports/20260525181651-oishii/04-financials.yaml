  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: Monthly net revenue or ARR by SKU, channel, and geography.
      whyItMatters: >-
        Without top-line disclosure, investors cannot size the business or test fixed-cost absorption against premium
        pricing.
      diligencePath: >-
        Request monthly net revenue by product family and channel for the last 24 months, including retailer
        concentration.
      relatedQuestionRefs:
        - QI013
        - QI026
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: margin-disclosure
      missingEvidence: Gross margin by SKU, channel, and farm plus spoilage, rebate, and markdown rates.
      whyItMatters: This is the core bridge between premium list prices and actual unit economics.
      diligencePath: >-
        Request a gross-margin bridge for flagship berries, access formats, preserves, and blended company total,
        including spoilage and trade-spend adjustments.
      relatedQuestionRefs:
        - QI016
        - QI017
        - QI019
        - QI026
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-bridge
      missingEvidence: Current cash balance, monthly burn, debt schedule, lease obligations, and covenant package.
      whyItMatters: Fresh financing cannot be translated into runway or next-round timing without a balance-sheet bridge.
      diligencePath: Request current cash, 24-month cash bridge, debt/lease schedule, and covenant summary by lender and facility.
      relatedQuestionRefs:
        - QI008
        - QI016
        - QI022
        - QI024
        - QI026
      relatedTableRefs:
        - TI004
        - TI005
    - type: private-evidence-only
      severity: material
      topic: retail-productivity
      missingEvidence: Per-door velocity, reorder cadence, repeat purchase, and retailer chargebacks by SKU.
      whyItMatters: Retail-door growth alone does not show whether broader access formats create durable, profitable demand.
      diligencePath: >-
        Request weekly units per door, repeat purchase, reorder rate, and retailer-specific trade spend for each major
        SKU.
      relatedQuestionRefs:
        - QI006
        - QI007
        - QI010
        - QI026
      relatedTableRefs:
        - TI001
        - TI005
    - type: missing-source
      severity: material
      topic: farm-costs
      missingEvidence: Facility-level electricity, HVAC, packaging, and labor cost per pound or tray.
      whyItMatters: >-
        Academic evidence identifies these as the main indoor-farming cost drivers, but no Oishii-specific public source
        quantifies them.
      diligencePath: >-
        Request facility-level cost accounting for electricity, HVAC, packaging, labor, and maintenance, broken out by
        farm and SKU.
      relatedQuestionRefs:
        - QI017
        - QI019
        - QI021
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: capex-intensity
      missingEvidence: Capex per new farm, automation payback, and regional budget allocation for U.S. and Japan expansion.
      whyItMatters: Growth-oriented use of proceeds can consume capital quickly even in a premium-priced model.
      diligencePath: >-
        Request build cost, ramp schedule, automation capex, and payback assumptions for each farm cohort and major
        robotics module.
      relatedQuestionRefs:
        - QI008
        - QI019
        - QI025
        - QI026
      relatedTableRefs:
        - TI004
        - TI005
