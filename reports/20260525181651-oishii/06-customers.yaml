- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Named proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Premium grocery chain retail
    - Regional produce buyer / household shopper / consumer
    - Flagship and everyday berry trial on shelf
    - Whole Foods regional pages across NYC, NJ, New England, Philadelphia, and D.C.
    - Strongest named chain proof and the clearest bridge from novelty to scale
    - Door count, sell-through, and retailer share are undisclosed
  - - Regional chain diversification
    - Regional produce buyer / household shopper / consumer
    - Daily-use Koyo access beyond Whole Foods
    - Washington, D.C. page adds Harris Teeter alongside Whole Foods
    - Shows at least one named non-Whole-Foods chain on an official surface
    - No public door count or volume by chain
  - - E-grocery / home delivery
    - E-grocery merchandiser / online grocery shopper / consumer
    - Convenience purchase and basket add-on
    - FreshDirect current listing with Omakase, Nikko, Bento, and preserves cross-sell
    - Live pricing and assortment proof without visiting a store
    - Conversion, margin, and reorder behavior are private
  - - Chef and fine-dining seeding
    - Chef or restaurant buyer / diner / restaurant and diner
    - Taste validation, prestige, and early discovery
    - Chef’s Table at Brooklyn Fare plus other chef references in Modern Retail and Global AgInvesting
    - Built premium credibility before grocery rollout
    - Recurring foodservice volume and contract economics are not public
  - - Owned pickup / delivery surface
    - Direct shopper / gifting or treat buyer / consumer
    - Pre-retail pickup, delivery, and gifting
    - Oishii press page advertised pick-up and delivery in select NYC areas
    - Captured early demand before shelf expansion
    - Current DTC mix versus wholesale is unknown
  - - Pantry extension / preserves
    - Grocery buyer / household shopper / consumer
    - Share of wallet beyond fresh fruit
    - Nosh and FoodBev coverage plus FreshDirect spread listing
    - May smooth seasonal usage occasions and widen basket value
    - No public reorder or mix data for preserves
  notes: Segmentation distinguishes who buys, who uses, and who ultimately pays across premium grocery, e-grocery, chef seeding, and owned consumer surfaces; it does not imply disclosed revenue share.
