- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Whole Foods regional rollout
    - Named-customer proof is heavily concentrated in Whole Foods pages and launch coverage
    - A chain slowdown or category reset could hit the clearest household acquisition channel
    - Request current revenue share, weekly velocity, and door count by Whole Foods region
  - - Everyday price points and new formats
    - Broader access may increase trial but could lower blended ASP or shift mix away from flagship economics
    - Expansion can improve household frequency while pressuring premium positioning
    - Request gross margin, repeat rate, and incrementality by Bento, Koyo, Nikko, and Reserve formats
  - - 300-plus to 600-plus door ambition
    - Door growth can outrun sell-through if brand hype fades or retailer labor and freshness economics disappoint
    - Retail expansion could magnify markdowns or shrinkage if repeat does not follow trial
    - Request door-opening cadence, sell-through thresholds, and retailer scorecards
  - - Sparse second-chain proof
    - Harris Teeter is the clearest named non-Whole-Foods chain, but public diversification proof is otherwise thin
    - Channel concentration may be higher than the broad footprint narrative suggests
    - Request top ten customers by revenue and door count
  - - E-grocery and owned pickup / delivery surfaces
    - Conversion proof exists, but public margin structure and order frequency do not
    - These channels may be strategically useful but economically opaque
    - Request contribution margin and retention by DTC, e-grocery, and grocery wholesale
  - - 18 states plus Toronto reporting mismatch
    - Official run-date customer surfaces do not fully corroborate the higher reported footprint
    - Investors cannot tell whether Toronto is material expansion or a small proof point
    - Request current retailer master list with store count by state, chain, and Canada status
  notes: Risks focus on channel concentration and commercialization execution, not farm operations. Impacts are framed around customer and retailer behavior because public revenue concentration is not disclosed.
