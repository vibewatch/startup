  title: Customers
  summary: Oishii's customer proof has moved beyond chef buzz into named premium-grocery and e-grocery availability, with official run-date pages showing Whole Foods regional placements plus Washington-area Harris Teeter expansion and FreshDirect showing a live multi-SKU price ladder. The evidence is strongest on named channel presence, launch demand, and lower-price everyday-use experimentation; it is still weak on repeat-purchase cohorts, retailer reorder data, and customer concentration disclosure.
sections:
- id: channel-segmentation-and-buying-contexts
  title: Channel segmentation and buying contexts
  body: 'Public customer evidence shows Oishii now serves several distinct buyer-user-payer configurations, but they all still sit inside a premium consumer food ecosystem rather than enterprise contracting. The clearest paying customer remains the end consumer buying through premium grocery, e-grocery, pickup, and limited pantry-extension surfaces. Official run-date pages show named Whole Foods regional availability in New York City, New Jersey, New England, Philadelphia, and Washington, D.C., while the D.C. page also adds Harris Teeter as the clearest non-Whole-Foods chain named on an official regional surface. FreshDirect provides current merchandising proof that consumers can buy Omakase, Nikko, Bento, and preserves through a live e-grocery flow. Foodservice still matters, but mainly as taste-validation and discovery infrastructure: Oishii''s own story and press pages plus independent reporting tie early demand to chefs and high-end menus before retail scale. The product and pricing
    architecture also maps to multiple occasions rather than one luxury gift only. Koyo is framed for breakfast and snacking, Nikko for cooking and baking, and Reserve formats for sharing or special occasions. That segmentation broadens the reachable household, but it does not yet prove recurring mass-market behavior.'
