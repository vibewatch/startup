- id: named-retail-and-foodservice-proof
  title: Named retail and foodservice proof
  body: 'Named customer proof is real, current, and more granular than a logo wall. Oishii''s own regional pages identify specific Whole Foods footprints in New York City and New Jersey, then widen the proof set to New England, Philadelphia, and Washington-area stores, with Harris Teeter appearing in the D.C. region. Supermarket News and AndNowUKnow corroborate the original NoMad Whole Foods launch and the lower price ladder that accompanied it. FreshDirect adds current digital-shelf proof, showing not just one flagship SKU but a multi-SKU assortment spanning Omakase, Nikko, Bento, and preserves. Foodservice proof is older but strategically important: Modern Retail says the brand first seeded demand through Michelin-starred restaurants such as Chef''s Table at Brooklyn Fare before expanding to Dominique Ansel and abcV, while Global AgInvesting lists additional chef and premium-customer references including Masa, Atera, Atomix, L''Atelier de Joël Robuchon, Café Kitsuné, and Murray''s Cheese.
    The result is not broad enterprise diversification; it is a credible premium-channel stack in which foodservice built brand authority and grocery converted that authority into household trial.'
