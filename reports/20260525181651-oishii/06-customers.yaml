  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: repeat-retention-metrics
    missingEvidence: Household repeat-purchase cohorts, retailer reorder cadence, and any NRR, GRR, or churn-style retention metrics by SKU and channel.
    whyItMatters: Launch sell-outs and review anecdotes do not show whether Oishii becomes a habitual grocery purchase or remains an occasional luxury splurge.
    diligencePath: Request retailer velocity and reorder dashboards plus household repeat cohorts by SKU, channel, and geography for the last 12 months.
    relatedQuestionRefs:
    - QU020
    - QU021
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: TU003 named customer proof is directionally strong but still incomplete outside the named chain and chef references visible on public surfaces.
    missingEvidence: A current customer master list that identifies all live retail banners, specialty accounts, foodservice references, and geographic rollout status behind the named proof table.
    whyItMatters: The chapter can verify several named channels, but investors still cannot tell whether those examples represent the core revenue base or only the most marketable references.
    diligencePath: Request a current customer and channel master list with banner names, active-door counts, foodservice accounts, and whether each relationship is pilot, live, or discontinued.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, channel mix by retailer, and any chain-level margin or dependency disclosures.
    whyItMatters: Whole Foods-heavy named proof can look strong while still masking concentration to one banner, one distributor, or a narrow regional mix.
    diligencePath: Request top ten customers by revenue, gross margin, and door count, plus channel mix across Whole Foods, Harris Teeter, e-grocery, owned DTC, foodservice, and specialty retail.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: material
    topic: footprint-reconciliation
    missingEvidence: A current retailer master list that reconciles the official store-locator snapshot with reported 18-state and Toronto expansion claims.
    whyItMatters: Investors need to know whether Toronto and the higher state count reflect meaningful live distribution, a partial pilot, or stale marketing language.
    diligencePath: Request the current retailer master file with chain, store count, state, and Canada status, then compare it to the official store locator used in live marketing.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU002
