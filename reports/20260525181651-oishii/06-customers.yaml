- id: expansion-path-and-concentration-risk
  title: Expansion path and concentration risk
  body: 'The expansion narrative is legible: Oishii says it is already in more than 300 U.S. retail locations, trade coverage says management wants to double that footprint by the end of 2026, and the pricing architecture now explicitly targets everyday consumption rather than only luxury gifting. Several 2026 financing stories also say distribution has already widened to 18 states and Toronto. But concentration and verification risk remain material. The official run-date store locator only supports a 14-states-plus-D.C. view, and the chapter''s official regional pages are still concentrated around Whole Foods plus one clearly named second chain, Harris Teeter. FreshDirect proves e-grocery availability, but public sources do not disclose what share of revenue comes from Whole Foods, FreshDirect, owned pickup-delivery, foodservice, or regional specialty accounts. Likewise, there is no public top-customer list, no retailer reorder cadence, and no disclosure of whether Toronto is a major launch
    or a small pilot. In practice, Oishii looks like a company with credible premium-channel expansion, but with customer durability and concentration still substantially under-evidenced relative to the brand''s visibility.'
