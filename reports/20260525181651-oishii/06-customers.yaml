- id: durability-repeat-and-price-sensitivity
  title: Durability, repeat purchase, and price sensitivity
  body: 'Durability evidence is directionally positive but still incomplete. Modern Retail reports two strong top-of-funnel signals from the earlier launch period: a pre-retail waitlist of a few thousand people and near-daily sell-outs once Oishii reached Whole Foods. That is meaningful because it shows demand was not purely social-media theater. The same article also says Whole Foods sampling and local-program merchandising helped convert awareness into shelf trial. But the public evidence stops short of the metrics investors actually need to underwrite repeat behavior. HortiDaily says Oishii''s category work found strawberries are a stressful purchase because they are expensive and can spoil before consumption; more than half of consumers throw away some strawberries and some leave the category entirely. Oishii''s answer is lower price points, top-seal packaging, and a Stay-Fresh Guarantee, and HortiDaily says those packaging changes have driven jumps in demand at core retailers. Even
    so, Bustle''s review remains the clearest adverse counterweight: the berries are exceptional, but the flagship tray is still not practical for an everyday budget. Public proof therefore supports trial and premium enthusiasm, not durable cohort retention.'
