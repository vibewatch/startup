- id: FU002
  title: Adoption / deployment flow
  type: flow
  layout: wide
  summary: The current public adoption path runs from chef and media proof into named grocery trial, then into freshness and price tests that determine whether the customer becomes repeat demand.
  data:
    nodes:
    - id: chef-proof
      label: Chef and prestige proof
      detail: High-end restaurant references and press build early credibility.
    - id: consumer-hype
      label: Waitlist and viral interest
      detail: Curiosity builds through scarcity, influencer buzz, and waitlists.
    - id: retail-launch
      label: Named grocery launch
      detail: Whole Foods regional pages and FreshDirect create live shelf or digital-shelf trial.
    - id: portfolio-fit
      label: SKU and occasion fit
      detail: Consumers choose among Reserve, Premium, Bento, Nikko, and preserves.
    - id: freshness-test
      label: Freshness and price test
      detail: Packaging, guarantee, and perceived value shape whether a buyer returns.
    - id: expansion-loop
      label: Regional expansion loop
      detail: More doors, more chains, and more formats widen access if demand stays durable.
    edges:
    - from: chef-proof
      to: consumer-hype
    - from: consumer-hype
      to: retail-launch
    - from: retail-launch
      to: portfolio-fit
    - from: portfolio-fit
      to: freshness-test
    - from: freshness-test
      to: expansion-loop
  approximationNotes: This is a qualitative flow of the observed customer path, not a numeric conversion funnel; public sources do not disclose stage-by-stage conversion rates.
