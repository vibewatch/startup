figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Oishii acquires customers through chef prestige and social buzz, converts them through premium-grocery trial, and then tries to expand usage with lower price points and freshness-risk reduction.
  data:
    items:
    - label: Discovery
      actor: Chef-curious or premium-food shopper
      touchpoints:
      - Michelin-chef references
      - Press headlines about $50 strawberries
      - Influencer / social buzz
      emotion: Intrigued by rarity and taste proof
      painpoint: Feels like a luxury novelty rather than a normal purchase
      opportunity: Chef prestige lowers initial trust barrier
    - label: First trial
      actor: NYC or NJ household shopper
      touchpoints:
      - Whole Foods launch
      - Pickup / delivery in select NYC areas
      - FreshDirect listing
      emotion: Excited to finally try the product
      painpoint: Price and limited access still constrain purchase
      opportunity: Shelf presence converts curiosity into paid trial
    - label: Occasion fit
      actor: Household shopper choosing among SKUs
      touchpoints:
      - Reserve Omakase for sharing
      - Premium Koyo for breakfast or snacking
      - Premium Nikko for cooking or baking
      emotion: Compares indulgence versus everyday use
      painpoint: Need clearer value for repeat household occasions
      opportunity: Tiered lineup broadens the addressable occasion set
    - label: Repeat decision
      actor: Existing buyer or household evaluator
      touchpoints:
      - Top-seal packaging
      - Stay-Fresh Guarantee
      - Per-tray price check
      emotion: Satisfied on taste but sensitive to spoilage and budget
      painpoint: No public proof of sustained repeat rates
      opportunity: Freshness-risk reduction can improve confidence and usage frequency
    - label: Expansion
      actor: Regional retailer or repeat household
      touchpoints:
      - More regional Whole Foods pages
      - Harris Teeter in D.C.
      - 300-plus to 600-plus door ambition
      - Preserves extension
      emotion: Interested if availability and value keep improving
      painpoint: Channel concentration and economics are still opaque
      opportunity: Broader channels and formats can widen share of wallet
