companyProfile:
  summary: Oishii is a premium indoor-fruit company founded in 2016 to bring Japanese-quality berries to the U.S. market through a robotics-heavy indoor farming model. The company grows flagship Omakase, Koyo, and Nikko berries in New Jersey, has expanded into premium grocery and e-grocery channels, and raised a $150 million first close of Series C in May 2026, but still discloses little publicly about realized revenue, margins, utilization, or valuation.
  foundedDate: '2016-01-01'
  founders:
