  productSummary: Premium indoor-grown strawberries and related preserves sold year-round through premium grocery, specialty e-grocery, and foodservice channels.
  customerFocus: Premium grocery retailers, e-grocery channels, chefs, and affluent consumers seeking differentiated fresh fruit.
  businessModel: Premium-priced berry sales through wholesale retail, e-grocery, and selective foodservice, with new consumer-packaged formats broadening trial.
