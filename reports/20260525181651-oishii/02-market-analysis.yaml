- id: sizing-implications-for-oishii
  title: Evidence-Constrained Sizing and What It Means for Oishii
  body: 'Public evidence supports a clear conclusion: the underlying strawberry category is large enough, but Oishii''s serviceable market is constrained by price, channel fit, and supply economics rather than by abstract TAM. AgMRC''s multibillion-dollar market anchor and California''s 2026 shipment momentum show there is ample category demand. The harder question is how much of that demand will consistently clear at Oishii''s price points and quality promise. The company''s $4.99 entry point suggests management knows the answer cannot remain “special occasion only” forever. Yet consumer reviews and current channel mix imply that Oishii still occupies a premium niche, not a mass staple. That is not inherently bad; premium berries can still support a valuable business. But it means investors should frame sizing with humility. The right underwriting question is not whether strawberries are a big market. It is whether Oishii can keep broadening the premium fresh-fruit segment it already serves
    while holding taste leadership and eventually lowering cost enough to sustain repeat purchase. Public data does not yet answer that with precision, so the chapter ends with an evidence-constrained view rather than a heroic TAM claim.'
