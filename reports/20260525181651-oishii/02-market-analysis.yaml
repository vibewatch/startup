  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam
    missingEvidence: Door-level sell-through, repeat purchase, and retailer margin data by channel and SKU.
    whyItMatters: Without channel economics, Oishii's SAM and obtainable share remain story-led rather than measured.
    diligencePath: Request weekly sell-through by retailer, reorder cadence, and gross margin by SKU/channel.
    relatedQuestionRefs:
    - QM021
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: energy-costs
    missingEvidence: Per-pack energy spend and utilities intensity at the current farm base.
    whyItMatters: Energy is the most important structural market constraint for indoor berries and directly affects serviceable price bands.
    diligencePath: Request farm-level utility bills, energy intensity per pound, and hedging or flexibility-market strategy.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Price elasticity and repeat-purchase behavior at each recent price point.
    whyItMatters: The investment case depends on widening the premium niche without destroying demand or margin.
    diligencePath: Request cohort repurchase data for each packaging tier introduced in 2026.
    relatedQuestionRefs:
    - QM012
    - QM020
    relatedTableRefs:
    - TM003
    - TM004
