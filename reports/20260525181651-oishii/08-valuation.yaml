- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Current round is priced above supportable public bands
    - Management asks investors to pay through the base band without opening the data pack
    - Turns a promising business into a bad entry price
    - Pass or force a materially lower price with stronger downside protection
  - - Cap-table seniority is worse than implied
    - Large liquidation preferences, ratchets, warrants, or debt layers sit ahead of new equity
    - Absorbs upside even if operations improve
    - Reprice toward the bear band or walk away
  - - Revenue and margin bridge is weak
    - Private data shows low realized gross margin, high spoilage, or short runway despite premium shelf prices
    - Converts the premium wedge into a fragile narrative
    - Hold at research-more or move to avoid
  - - Demand durability fails
    - Velocity, repeat purchase, or retailer retention do not justify premium shelf space
    - Breaks the case for broader-access formats as a growth lever
    - Cut the valuation band and tighten diligence requirements
  - - Rescue-financing language emerges
    - Creditor stress, covenant pressure, or emergency capital appears
    - Makes Oishii look more like stressed CEA precedents than a premium-produce platform
    - Treat as a thesis break until the balance sheet is re-underwritten
  notes: These are explicit kill criteria rather than generic risks. Each one directly changes either the realized seniority of the investment or the plausibility of the upside case.
  claimRefs:
  - CV038
  - CV041
  - CV049
  - CV050
  - CV055
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Round valuation and share count
    - Exact post-money, share price, shares outstanding, and dilution by security class
    - Needed to convert public scenario bands into an actual entry price and ownership outcome
    - CFO pack plus signed term sheet
  - - Preference stack and debt
    - Liquidation waterfall, warrants, debt seniority, covenants, and side letters
    - Determines how much of any exit value reaches new equity
    - Counsel review of definitive financing documents
  - - Revenue and margin bridge
    - Monthly revenue, gross margin by SKU and channel, spoilage, and burn
    - Tests whether premium shelf pricing becomes durable cash generation
    - Finance diligence with board-grade monthly reporting
  - - Sell-through and repeat demand
    - Door-level velocity, reorder cadence, promo intensity, and customer concentration
    - Separates novelty demand from sustainable grocery behavior
    - Commercial diligence with retailer cohort data
  - - Automation and energy proof
    - Labor-hours-per-pack, energy cost per pack, and yield improvement by farm vintage
    - Checks whether automation is really offsetting structural indoor-farming cost burden
    - Operations diligence with farm KPI dashboards
  - - Exit path and board process
    - Current sponsor outreach, banker feedback, and board view on strategic versus public exits
    - Needed to underwrite a realistic realization path instead of a theoretical rerating
    - CEO, board, and advisor reference calls
  notes: Each diligence ask is designed to convert the chapter from a public-only screening judgment into an investable underwriting file. If management cannot produce these materials, the recommendation should not be upgraded.
