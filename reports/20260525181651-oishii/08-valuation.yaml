- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Indicative underwriting band
  - Return logic
  - Probability signal
  - Key failure mode
  rows:
  - - Bear
    - Public diligence never clears valuation, cap-stack, or unit-economics opacity and Oishii is treated like a stressed CEA asset with a premium niche story but weak proof
    - USD 100M to 200M
    - Entry only works as downside-protected optionality rather than conviction growth equity
    - More financing stress, weaker sell-through, or worsening sector sentiment
    - Premium narrative fails to outrun energy, labor, and capital-intensity drag
  - - Base
    - Private diligence later confirms repeat demand, a manageable stack, and some real margin progress but not enough transparency for a full premium-platform mark
    - USD 250M to 450M
    - Acceptable only if entry leaves room for upside without assuming a heroic rerating
    - Stable retail expansion, cleaner cap table, and board-grade operating data
    - Disclosure remains partial and upside is capped by hidden dilution or mediocre margins
  - - Bull
    - Management proves premium-produce economics, clean seniority, and repeatable demand broadening from new formats and automation
    - USD 500M to 800M
    - Upside depends on private evidence showing Oishii deserves a premium above public ag and CEA comps
    - Audited revenue and margin proof, healthy repeat behavior, and disciplined cap table
    - A single weak diligence packet collapses the case back toward the base or bear band
  notes: These are illustrative underwriting bands, not observed market marks. Equity value could be materially lower if liquidation preferences, debt, or other senior claims are larger than public evidence currently implies.
  claimRefs:
