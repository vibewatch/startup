tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Lens
  - Current verdict
  - Public support
  - Decision implication
  - What would change the view
  rows:
  - - Recommendation
    - Research-more
    - Funding momentum is visible but equity priceability is not
    - Do not issue a buy on an undisclosed round price
    - Move toward track only after price, revenue quality, and seniority are opened
  - - Confidence
    - Medium
    - Direction of evidence is clear while precision remains weak
    - Use ranges as guardrails rather than a point estimate
    - Confidence rises with board-grade revenue, margin, and cash data
  - - Risk rating
    - High
    - Sector failure precedents keep downside asymmetric
    - Require downside protection and hard diligence gates
    - Risk falls only if repeat demand and stack cleanliness are proven
  - - Valuation stance
    - Unknown at undisclosed price; stretched above the base band
    - Public valuation support is weak because the current mark is not disclosed
    - Avoid paying premium-produce multiples off headlines alone
    - Stance improves only if entry lands in the lower half of the range with clean seniority
  - - Most supportable exit path
    - Private strategic or sponsor sale before IPO
    - Public ag-tech comps still trade at harsh or middling levels
    - Underwrite to a private exit path, not a heroic public rerating
    - View changes if Oishii discloses public-market-grade reporting and public comps materially re-rate
  notes: This table is a decision summary rather than a financial model. It converts the chapter's evidence into current posture, price discipline, and the diligence required to move the recommendation.
