  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: current-valuation
    missingEvidence: Exact post-money valuation, price per share, basic share count, and board-approved cap-table snapshot for the May 2026 Series C first close.
    whyItMatters: Without the actual round price, public scenario bands cannot be translated into an investable entry price or dilution-adjusted upside.
    diligencePath: Request the current financing deck, signed term sheet, and cap-table export reviewed by finance and counsel.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: blocking
    topic: core-financials
    missingEvidence: Current revenue run-rate, gross margin by SKU or channel, cash balance, monthly burn, and runway bridge.
    whyItMatters: The recommendation cannot move beyond research-more while revenue quality and cash durability remain undisclosed.
    diligencePath: Request a board-grade monthly financial pack, SKU margin bridge, and 12-18 month operating plan.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Liquidation preferences, debt seniority, warrants, anti-dilution terms, and any side letters attached to the 2025-2026 financings.
    whyItMatters: Even a strong operating business can produce weak common-equity returns if senior layers absorb most exit value.
    diligencePath: Obtain definitive financing documents and have counsel map the waterfall and conversion mechanics.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: demand-durability
    missingEvidence: Door-level velocity, repeat-purchase rates, discounting cadence, spoilage, and customer concentration by SKU and channel.
    whyItMatters: The bull case depends on premium berries becoming repeatable grocery behavior rather than a novelty purchase.
    diligencePath: Request retailer cohort data, syndicated sell-through, and channel-level gross-to-net analysis.
    relatedQuestionRefs:
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-set
    missingEvidence: Subscription-only private board marks, signed term sheets, and secondary-price references for premium produce or ag-tech peers.
    whyItMatters: Public comparables bound the discussion, but they do not fully capture what private investors may actually be paying for differentiated premium-food platforms.
    diligencePath: Supplement the public comp set with banker checks, secondary market color, and investor reference calls.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV004
