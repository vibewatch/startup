- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Reference metric
  - Valuation or status
  - Relevance to Oishii
  - Limitation
  rows:
  - - Oishii disclosed financing context
    - Current private funding signal
    - $150M first close; ~$370M total raised; no public post-money valuation
    - Best direct public anchor for scale of capital available to the company today
    - Funding size is not the same thing as a defendable current equity mark
  - - Local Bounti
    - Public CEA downside comp
    - $48.4M 2025 sales; about $43.3M May 2026 market cap; ongoing losses and financing need
    - Shows how harsh public markets can be on controlled-environment assets even after commercial scale
    - Leafy-greens mix and debt structure differ from Oishii's premium berry model
  - - Village Farms
    - Public produce-platform upper analogue
    - $215.9M 2025 sales; about $0.29B to $0.30B May 2026 market cap; positive net income
    - Shows where public equity can land when produce economics and disclosure are materially stronger
    - Business mix is broader and more profitable than Oishii's visible record
  - - Plenty
    - Direct indoor-strawberry restructuring analogue
    - Filed chapter 11 in 2025; emerged with a narrower strawberry focus
    - Closest like-for-like reminder that even strawberry-first indoor farming can require a reset
    - No clean current public equity valuation is available
  - - AppHarvest
    - Cost and yield failure precedent
    - Bankruptcy after lower-than-expected crop yields and elevated operating costs
    - Useful downside boundary for what happens when indoor-ag assumptions break operationally
    - Tomato greenhouse model is not a premium-berry consumer brand
  - - Bowery and AeroFarms reset
    - Asset-recovery or narrowed-survivor precedent
    - Bowery facility liquidation; AeroFarms survival tied to a narrower crop focus
    - Shows that capital and technology alone do not preserve valuation when the operating model slips
    - These are sector boundary markers, not one-for-one multiples
  notes: This comparable set intentionally mixes public equity references, financing context, and adverse sector precedents because no clean public peer basket maps perfectly to Oishii. Read the rows as valuation boundaries for underwriting discipline, not as one-for-one multiples.
  enumerationScope:
    coverage: partial
    basis: This enumeration covers the main directly accessible public references most relevant to Oishii's premium indoor-berry model in 2025-2026, but it excludes subscription-only private board marks, signed term sheets, and secondary transactions that would sharpen an exact private-market multiple.
