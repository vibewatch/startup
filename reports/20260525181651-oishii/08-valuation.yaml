- id: diligence-gates-and-thesis-breakers
  title: The final call depends on private diligence, not another funding headline
  body: The remaining work is straightforward in concept and decisive in effect. First, management has to open the current round terms so an investor can see the exact valuation, share count, dilution, and preference layering attached to the 2025-2026 capital stack. Second, the company has to provide a board-grade bridge from premium shelf price to realized revenue, gross margin, spoilage, and cash burn. Third, Oishii needs to show that broader retail access is creating repeat demand rather than just novelty trial. Those asks are what would move the call from research-more toward track or conditional buy. The thesis breaks if the cap table is more senior than implied, if door-level velocity fails to justify premium shelf space, or if rescue-style financing language begins to appear. Public-market evidence also makes the most supportable exit path a private strategic or sponsor sale rather than a near-term public listing. Until private diligence closes those gaps, the right posture is downside-first
    engagement and willingness to walk away on price.
