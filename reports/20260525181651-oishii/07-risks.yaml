company:
  name: Oishii
chapter:
  number: 7
  title: Risks
  summary: Oishii's biggest underwriting risk is not a visible live federal recall or public bankruptcy today; it is that an expensive, automation-heavy vertical-farming model still has to prove durable premium pricing, smooth scale-up, and capital efficiency in a sector littered with restructurings. The reviewed FDA and FoodSafety.gov pages did not show an obvious Oishii recall entry on the run date, but public evidence still leaves major blind spots around food-safety telemetry, unit economics, supplier concentration, and true sell-through. Against a backdrop that includes AppHarvest and AeroFarms Chapter 11 cases, Plenty's 2025 bankruptcy, and Bowery's liquidation, the key risk question is whether Oishii can turn a 300-plus-door premium berry footprint and a $150 million Series C first close into repeatable throughput and margin proof before the model needs more capital or more discounting.
sections:
- id: risk-overview
  title: Risk overview
  body: 'Oishii enters the risks chapter from a stronger position than many controlled-environment agriculture peers because it still has product novelty, premium brand permission, a visible retail footprint, and fresh capital. But the public record shows that those strengths sit on top of the same structural stressors that broke multiple vertical-farming peers: expensive facilities, automation dependence, biological complexity, and a need to keep investors patient long enough for scale economics to emerge. The most important current comfort is negative rather than affirmative: the FDA recall page and FoodSafety.gov recall surface reviewed on 2026-05-25 did not show an obvious Oishii recall entry. That reduces evidence of an active federal food-safety event, but it does not solve the harder underwriting problems around hidden energy intensity, incomplete operating telemetry, or whether lower entry prices can expand demand without collapsing the luxury margin umbrella. The heatmap and transmission
    map therefore treat premium-price durability, energy-cost pressure, expansion execution, and capital-market dependence as the core risk cluster.'
