- id: dependency-financial-and-execution-risk
  title: Dependency, financial, and execution risk
  body: 'The next layer of risk is dependency: Oishii depends on premium retail partners, premium consumer willingness to pay, automation and component partners, and capital providers all at the same time. The current public footprint spans 15 jurisdictions and more than 300 retail locations, with management aiming to double doors by the end of 2026. That is a meaningful distribution goal, but it raises the execution bar because Oishii still does not publicly disclose per-door velocity, repeat purchase, or price elasticity after its new lower entry points. The company also appears materially tied to MISUMI for automation, digital manufacturing, and component support, and its careers page shows simultaneous demand for business, farm, and engineering talent. Financially, the 2026 Series C first close buys time, but the sector''s public comparables remain sobering: Local Bounti and Village Farms still show tight liquidity or leverage trade-offs, and Plenty''s 2025 bankruptcy demonstrated that
    even a strawberry-focused strategy can run into construction, creditor, and fundraising stress. Oishii may be better positioned than those peers, but the combination of opaque private-company unit economics and multi-front expansion means residual model risk stays elevated.'
