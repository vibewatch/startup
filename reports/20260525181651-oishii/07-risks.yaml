  evidenceGaps:
  - type: missing-source
    severity: material
    topic: food-safety-certification
    missingEvidence: Third-party food-safety certification detail, audit cadence, retailer complaint rates, and archived recall checks by SKU/company name.
    whyItMatters: A premium fresh-fruit brand can be damaged quickly by even a limited quality incident, and current public evidence does not show the internal control surface.
    diligencePath: Request QA documentation, audit summaries, insurer loss history, and archived recall/litigation searches from management.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR004
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Cash balance, burn, debt, gross margin, throughput by farm, power cost per pound, and SKU-level contribution margin.
    whyItMatters: The category’s main failure mode is capital intensity before proven unit economics, so public narrative evidence is not enough for sizing risk.
    diligencePath: Request detailed board materials, monthly cash bridge, facility-level operating metrics, and downside financing scenarios.
    relatedQuestionRefs:
    - QR014
    - QR015
    - QR027
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
  - type: missing-source
    severity: material
    topic: sell-through-and-elasticity
    missingEvidence: Per-door velocity, repeat purchase, price elasticity, promo cadence, and retailer churn by SKU or pack format.
    whyItMatters: Oishii’s premium-pricing durability is the central commercial risk, and current public price points alone do not prove recurring demand.
    diligencePath: Request retailer cohort dashboards, reorder curves, and elasticity tests before underwriting aggressive retail expansion.
