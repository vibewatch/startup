- id: mitigations-monitors-and-kill-criteria
  title: Mitigations, monitors, and kill criteria
  body: 'Oishii does have visible mitigants. The business is not trying to sell commodity lettuce at commodity prices; it has a premium fruit position, fresh capital, an expanded price ladder, and a strategic automation partner. The store locator and retail-door evidence suggest the brand has escaped pure novelty status, and the absence of an obvious live federal recall on the reviewed pages is better than the opposite. Still, the public record is not good enough to underwrite the model on trust alone. The most useful monitors are therefore operational and commercial rather than narrative: whether retail doors keep expanding without broad price erosion, whether food-safety or quality incidents stay absent, whether MISUMI-linked automation actually improves repeatability, and whether Oishii can avoid another major financing event before public evidence of stronger throughput or margin quality appears. In practice, the thesis breaks if Oishii has to keep lowering prices to sustain trial, if
    a future FDA/USDA recall or broad spoilage event damages trust, if scale-out triggers contractor or creditor friction that resembles Plenty, or if another round is needed before the company can show durable sell-through and capital discipline.'
