- id: operational-and-quality-risk
  title: Operational and quality risk
  body: 'Operationally, Oishii is trying to industrialize a product that is biologically delicate and commercially unforgiving. The official farm materials point to a more than 237,500-square-foot Amatelas facility with multiple growing levels, bee pollination, water recycling, and robotics analyzing 60 billion datapoints annually. Those capabilities support differentiation, but they also imply a larger fixed-cost and uptime burden than a simpler field-grown berry business. Academic and technical sources are consistent that vertical-farm viability remains constrained by capex and by recurring energy loads from lighting, HVAC, and dehumidification, while Oishii''s own public material does not disclose how much of that burden is offset by solar adjacency or how often robotics, conveyors, or pollination systems miss target performance. The premium brand also amplifies freshness risk: if cold-chain quality, packaging claims, or shelf-life execution disappoint, the same luxury positioning that
    supports a $14.99 online pack can magnify consumer disappointment. In short, Oishii''s operational story is impressive, but the absence of public defect, yield, recall, and utilization telemetry leaves residual exposure high.'
