      - number: '5.4'
        title: Roadmap, Replication Ambition, and Product-Tech Risks
        blocks:
          - type: paragraph
            body: >-
              Oishii's roadmap is legible in direction even if it is not precise in engineering milestones. The clearest
              near-term themes are more capacity, more robotics integration, more packaging and format experimentation,
              and more Japan-based R&D. The Tokyo Open Innovation Center is important because it shifts the company from
              operating a large smart farm toward standardizing the system itself. Official Japanese materials say the
              center will research factory automation and AI environmental control, and both the Japan release and the
              Worldfolio interview frame the end goal as a turnkey package that can be deployed without bespoke on-site
              engineering. That is the right strategic target for a company that still appears dependent on highly
              specialized tuning, partner-supplied components, and internally integrated robotics. The risk is that much
              of the remaining evidence is still directional. Oishii talks about scaling automated harvesting, component
              standardization, and broader U.S./Japan infrastructure, but public materials do not yet disclose the
              operational telemetry that would prove the automation stack is economically dominant at scale. Likewise,
              formal food-safety certifications, software reliability metrics, and deeper partner-commercial terms
              remain outside the public record. The roadmap is coherent; the public proof of repeatable, auditable,
              turnkey execution is still incomplete.
