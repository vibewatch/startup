        - Oishii is not currently showing distress language and has fresh capital
        - Keep showing commercial traction without rescue-style financing
      - - Current anti-thesis
        - Public evidence still fits a promising but opaque private company with weak valuation support
        - Private diligence may still prove the business deserves a premium to public CEA comps
