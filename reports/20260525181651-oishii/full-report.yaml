  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold or event
      - Action implication
    rows:
      - - Food safety / recall risk
        - FDA/USDA recall surfaces and retailer complaint signals
        - Any federal recall, multi-market spoilage wave, or public food-safety incident tied to Oishii products
        - Pause the growth thesis and re-underwrite brand durability and QA systems before adding exposure
      - - Premium-pricing durability
        - Visible shelf prices and retailer breadth
        - Broad price cuts below current ladder without public sell-through proof, or lost premium-door momentum
        - Reduce conviction in margin expansion and treat the business as a narrower niche brand
      - - Capital-intensity / financing risk
        - Fundraising cadence versus disclosed operating proof
        - >-
          Need for another major financing round before public evidence of stronger throughput, margin, or cash
          discipline
        - Re-rate dilution and downside risk materially higher
      - - Automation / supplier concentration
        - Operational incidents and supplier diversification progress
        - Major robotics or component bottleneck with no credible backup path
        - Move dependency risk to top tier and require supplier and uptime remediation
      - - Expansion execution
        - Retail-door growth against management target
        - Failure to move meaningfully beyond 300-plus doors toward the stated end-2026 doubling objective
        - Question whether price resets and new formats are creating repeatable demand
      - - Sector contagion / construction discipline
        - New capex announcements, contractor disputes, or lien signals
        - Oishii begins large new build-outs without stronger unit-economics proof or shows Plenty-like project friction
        - Treat growth capex as risk-amplifying rather than moat-building
    notes: >-
      These kill criteria are intentionally monitorable from public or diligence-room evidence so the investment team
      can update the thesis without relying on narrative alone.
