  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct rivals, substitutes, and the real decision set
        blocks:
          - type: paragraph
            body: >-
              Oishii does not compete in a vacuum, and the buyer decision is broader than “which vertical farm is best.”
              The company's own materials and consumer-facing retail evidence still place it in a premium-flavor lane: a
              small-pack, high-sensory strawberry sold through premium grocery, e-grocery, and chef-adjacent channels
              rather than through commodity produce programs. That makes Plenty the clearest direct peer because Plenty
              is also now explicitly centered on indoor strawberries rather than leafy greens. But the larger decision
              set for produce buyers remains conventional supply. California and Florida growers anchor enormous
              incumbent strawberry volume, established field economics, and retailer familiarity, while broader produce
              operators such as Village Farms and Local Bounti show what scale and distribution look like in adjacent
              controlled-environment categories. Oishii's differentiation is real, but its true battleground is
              flavor-led premium berries inside a shelf set still defined by field-grown alternatives.
