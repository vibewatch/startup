  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence in favor
      - Counterpoint
      - What would change the view
    rows:
      - - Financing momentum
        - Oishii has repeatedly raised large rounds and just closed a $150M Series C first close
        - Funding size does not reveal the current equity price or preference stack
        - Show the current round valuation, share count, and waterfall
      - - Premium pricing wedge
        - The company now spans roughly $4.99 to $15 instead of a single ultra-premium tray
        - Lower-price formats could broaden trial while compressing blended ASP
        - Provide realized gross-to-net pricing and repeat purchase by SKU
      - - Automation and crop focus
        - Robotics, automation, and premium berries give Oishii a more defensible story than commodity greens
        - Energy intensity and operating complexity still cap what indoor fruit can earn
        - Show farm-level labor, energy, and yield improvement versus prior vintages
      - - Public comp upside exists
        - Village Farms shows produce-adjacent platforms can hold roughly a $0.3B public value with profit proof
        - Village Farms discloses far more revenue and profitability than Oishii does
        - Close the disclosure gap enough to justify a premium platform comparison
      - - Distress downside is real
