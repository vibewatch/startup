  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview
        blocks:
          - type: paragraph
            body: >-
              Oishii enters the risks chapter from a stronger position than many controlled-environment agriculture
              peers because it still has product novelty, premium brand permission, a visible retail footprint, and
              fresh capital. But the public record shows that those strengths sit on top of the same structural
              stressors that broke multiple vertical-farming peers: expensive facilities, automation dependence,
              biological complexity, and a need to keep investors patient long enough for scale economics to emerge. The
              most important current comfort is negative rather than affirmative: the FDA recall page and FoodSafety.gov
              recall surface reviewed on 2026-05-25 did not show an obvious Oishii recall entry. That reduces evidence
              of an active federal food-safety event, but it does not solve the harder underwriting problems around
              hidden energy intensity, incomplete operating telemetry, or whether lower entry prices can expand demand
              without collapsing the luxury margin umbrella. The heatmap and transmission map therefore treat
              premium-price durability, energy-cost pressure, expansion execution, and capital-market dependence as the
              core risk cluster.
