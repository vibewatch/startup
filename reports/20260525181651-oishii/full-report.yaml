      - number: '8.3'
        title: A range is possible, but only as a discipline tool rather than a current mark
        blocks:
          - type: paragraph
            body: >-
              Given that dispersion, the right public-only output is not a precise mark but an underwriting discipline.
              The bear case treats Oishii as an opaque, capital-intensive CEA asset whose premium-berry story is not
              enough to overcome financing risk and missing economics, which supports only a roughly $100 million to
              $200 million band. The base case assumes the premium wedge is real, broader-access formats are helping
              without fully collapsing price, and private diligence will eventually show a manageable stack, which
              supports a roughly $250 million to $450 million band. The bull case requires non-public proof that Oishii
              already behaves more like a premium branded produce platform than a lossmaking vertical farm, which is why
              the upside band only becomes credible above roughly $500 million. Crucially, these are discipline ranges,
              not observed current valuations. Because the current round price is undisclosed and public valuation
              support is weak, the recommendation is research-more rather than buy. The ranges are useful as guardrails
              on what to pay, not as evidence that an undisclosed mark is already attractive.
