      - number: '8.2'
        title: Comparable signals show both a premium upside path and severe downside risk
        blocks:
          - type: paragraph
            body: >-
              The comparable set does not support a single neat multiple for Oishii. It supports a wide corridor whose
              endpoints are shaped by disclosure depth, operating quality, and balance-sheet risk. At the weak end,
              Local Bounti shows what public markets do to a real controlled-environment operator with sales but thin
              gross profit and ongoing financing dependence: its 2025 and Q1 2026 filings showed meaningful revenue,
              continuing losses, and a May 2026 equity value of only about $43 million. At the stronger end, Village
              Farms shows that produce-adjacent platforms can sustain a roughly $0.3 billion market cap, but only
              alongside far better revenue and profitability proof than Oishii has disclosed. StockAnalysis also implied
              roughly 0.9x trailing sales for Local Bounti and about 1.3x trailing sales for Village Farms in late May
              2026, underscoring how little public valuation premium even scaled operators receive without clearer proof
              or cleaner economics. The adverse analogues matter just as much. Plenty's chapter 11 filing, Bowery's
              facility liquidation, and AppHarvest's bankruptcy after lower-than-expected yields and elevated costs show
              how quickly indoor-farming equity can unravel. AeroFarms' post-bankruptcy crop narrowing reinforces the
              same lesson: survivors often become more selective, not more expansive. Academic energy-cost sources add
              the structural reason this dispersion exists. Indoor farming remains highly sensitive to energy and
              operating discipline, so crop quality and automation only matter if they overpower a hard cost curve.
