  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation chain runs from visible capital access through comp dispersion and disclosure gaps to a
      research-more decision.
    data:
      nodes:
        - id: funding
          label: Capital access is visible
          detail: Public evidence confirms a $150M first close and about $370M total raised
        - id: premium
          label: Premium wedge is visible
          detail: Oishii now spans roughly $4.99 to $15 and still frames itself as premium produce
        - id: dispersion
          label: Comparable outcomes are wide
          detail: Public references range from distressed CEA equity to a roughly $0.3B produce-platform market cap
        - id: opacity
          label: Core equity inputs remain private
          detail: No public post-money valuation, revenue, margin, or preference stack is disclosed
        - id: range
          label: Public output is a range, not a mark
          detail: The chapter can defend only underwriting bands and entry discipline
        - id: diligence
          label: Private diligence is decisive
          detail: Round terms, margin bridge, and repeat demand data are required to move the call
        - id: recommendation
          label: Research-more
          detail: Upgrade only after price and operating proof become visible
      edges:
        - from: funding
          to: premium
          label: Scale plus product proof
        - from: premium
          to: dispersion
          label: Quality alone does not price the equity
        - from: dispersion
          to: opacity
          label: Wide comps raise the burden of proof
        - from: opacity
          to: range
          label: Missing data blocks precision
        - from: range
          to: diligence
          label: Bands only guide what to pay
        - from: diligence
          to: recommendation
          label: Price and proof determine the call
