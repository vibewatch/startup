  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Priceability starts with capital access, but stops at the equity layer
        blocks:
          - type: paragraph
            body: >-
              Public evidence says Oishii is financed and commercially progressing, but equity priceability stops at the
              funding layer. The May 2026 official release and multiple independent writeups verify a $150 million first
              close, roughly $370 million of cumulative capital, named Japanese strategic and financial backers, and a
              broader $4.99 to $15 product ladder. CB Insights complicates, but does not invalidate, that story: it
              shows $380.58 million over 11 rounds, a $121.38 million Series C entry, and a same-day loan entry, which
              suggests the public data set mixes equity and non-equity capital rather than revealing a clean post-money
              mark. That distinction matters because public evidence now supports scale of capital raised, but not the
              price a new investor would actually pay for the equity. The same public record still omits revenue, gross
              margin, cash burn, runway, and even headcount. The right interpretation is therefore neither bullish
              certainty nor bearish collapse. Oishii looks financeable and differentiated, but it is not publicly
              priceable. A price-sensitive investor should treat the current record as evidence of momentum plus
              opacity, not as permission to assume that an undisclosed valuation is fair.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
