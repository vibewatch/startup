chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Focus, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              Oishii presents itself as a premium fruit company rather than a generic indoor-farming platform. Its
              official story and farm pages frame the business around recreating Japanese fruit quality in the United
              States with indoor vertical farming, year-round climate control, and pesticide-free production. The
              flagship product remains the Omakase Berry, but by spring 2026 the assortment had expanded to Koyo and
              Nikko berries plus preserves and spreads that reuse berry supply in higher-value formats. That matters
              because the company is not trying to win on commodity volume alone; it is trying to monetize taste,
              consistency, and scarcity. Public operating-footprint evidence is strong on New Jersey production and
              retail availability but still imperfect on exact scale. Oishii says its berries are grown in Jersey City,
              official product pages tie the flagship berry to Jersey City, and multiple trade outlets described the
              company's 74,000-square-foot Jersey City farm as a major scale step. At the same time, current
              retail-footprint reporting is inconsistent: the official store locator showed fourteen states plus
              Washington, D.C. on the run date, while May 2026 funding coverage claimed eighteen states plus Toronto.
              That discrepancy does not negate expansion, but it does mean later chapters should treat exact
              distribution breadth as directionally positive rather than perfectly pinned down.
