      - number: '3.4'
        title: Moat durability, displacement risk, and the proof still missing
        blocks:
          - type: paragraph
            body: >-
              The practical competitive verdict is that Oishii's moat is visible but not yet fully proven. The strongest
              part of the story is premium flavor positioning, tight brand control, and crop selection that looks more
              defensible than the leafy-greens models that failed across the sector. The weakest part is proof of
              repeatable economics at scale. Plenty remains a direct strawberry threat if its post-restructuring
              buildout converts into real volume, and incumbent California and Florida supply remains a constant pricing
              benchmark. Public evidence also does not yet answer the questions that matter most to an investor
              underwriting durability: store-level velocity, repeat purchase, realized pricing after discounts, or
              competitor-coded wins and losses. In produce, switching costs are low unless the product earns its place
              through sell-through and retailer margins. Oishii may have chosen the right crop and the right consumer
              wedge, but the burden of proof still sits on whether flavor can become durable shelf economics across
              mainstream retail over time.
