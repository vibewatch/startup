  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Counts as Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for Oishii is not “all agriculture,” and it is not even the entire
              controlled-environment-agriculture sector. Oishii sells a premium fresh berry with gifting, chef, and
              premium-grocery attributes, so the relevant stack starts with the U.S. fresh strawberry market and then
              narrows toward shoppers and buyers willing to pay for taste, consistency, pesticide-free production, and
              year-round supply. AgMRC's strawberry industry overview gives the most conservative anchor: U.S.
              strawberry production is a multibillion-dollar category dominated by California and supported by Florida
              in winter. That means Oishii sits inside a real and valuable produce market, not a novelty market. But the
              company's actual serviceable slice is much smaller than total strawberry spend because it excludes
              processed berries, most private-label value packs, and many price-sensitive mainstream shoppers. Oishii's
              own channel evidence reinforces that narrower boundary. Whole Foods, FreshDirect, Instacart, and premium
              specialty retail are useful signals because they show where the company can plausibly win today. They do
              not prove the company is close to serving the full household strawberry basket. The practical boundary is
              therefore premium fresh strawberries in retail and foodservice channels that value flavor and off-season
              reliability more than lowest unit price.
