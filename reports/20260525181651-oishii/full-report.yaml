      - number: '4.2'
        title: Unit economics, cost structure, and what peers imply
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics evidence is suggestive but far from decisive. AgFunder quoted management saying
              Oishii focused on proving unit economics before chasing revenue and had “crossed the chasm” that trapped
              other vertical-farming companies. Investors should treat that as useful signal, but still as management
              narrative. No public source in this chapter discloses revenue, gross margin, CAC, payback, or runway. What
              the public record does disclose is the logic management is trying to make work: premium strawberries
              rather than leafy greens, a broader price ladder, packaging aimed at freshness and retailer confidence,
              and continued automation and in-house iteration. HortiDaily’s reporting adds an important commercial
              nuance: Oishii says the new top-seal pack improves labor efficiency and freshness, has driven jumps in
              demand at core retailers, and sits alongside growing-space expansion over the last 18 months.


              The cost side remains the harder part. Technical sources on vertical farming consistently describe high
              capital and operating costs, with lighting, HVAC, dehumidification, and climate control as core burdens.
              That means Oishii’s margin path likely depends on keeping premium realized pricing while using automation,
              packaging, and crop choice to reduce waste and labor drag. Public-company proxies show why that matters.
              Local Bounti generated real revenue in 2025 and Q1 2026 but still posted thin gross profit and meaningful
              losses under heavy financing pressure. Village Farms, by contrast, shows that scaled produce-adjacent
              operations can produce far healthier gross margins and profitability. Oishii’s likely future sits
              somewhere between those two poles, but public evidence does not yet say where.
