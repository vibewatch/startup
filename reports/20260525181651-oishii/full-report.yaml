      - number: '4.3'
        title: Capital adequacy, financing dependency, and sector context
        blocks:
          - type: paragraph
            body: >-
              Company Overview owns the round-by-round chronology; the financial question here is whether Oishii’s
              current capital base is strong enough to underwrite the next stage. The verified positives are meaningful.
              Oishii announced a first close of $150 million in Series C financing on 2026-05-13 and said total capital
              raised since founding is about $370 million. Public coverage consistently ties that financing to
              production-capacity growth, farm infrastructure, automation, new product formats, and R&D in both the U.S.
              and Japan. Those are growth investments, not rescue-language uses of proceeds, which is directionally
              encouraging.


              At the same time, fresh capital is not the same as visible runway. CB Insights’ public page shows a
              slightly different data picture—$380.58 million total raised, a $121.38 million Series C entry, and a
              same-day loan entry—which suggests there may be debt or timing nuances outside the simplified company
              press narrative. More importantly, none of the reviewed public sources discloses current cash, monthly
              burn, debt balances, lease obligations, project financing, or covenant package. That means investors still
              cannot convert the headline raise into months of runway or next-round timing. Sector history makes that
              omission material rather than academic. Plenty’s 2025 bankruptcy and Bowery’s facility liquidation show
              how quickly controlled-environment agriculture can move from premium growth narrative to creditor
              negotiation when facility commitments outrun financing durability. Oishii clearly looks healthier than
              those examples today, but the public record still does not let an investor prove it with a cash bridge.
