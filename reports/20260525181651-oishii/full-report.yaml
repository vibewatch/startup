      - number: '5.3'
        title: Trust, Quality Controls, and Practitioner Signal
        blocks:
          - type: paragraph
            body: >-
              Public trust evidence centers on food quality and freshness rather than on enterprise-style software or
              compliance artifacts. Oishii repeatedly emphasizes pesticide-free growing, Non-GMO Project verification,
              and peak-ripeness harvesting, while the 2026 packaging refresh adds a more explicit freshness layer
              through top-seal packaging and a Nikko Berry Stay-Fresh Guarantee. Those are meaningful commercial-quality
              controls because berries are a high-spoilage category and packaging performance directly affects repeat
              purchase. At the same time, the company does not expose much software-layer detail through a public
              developer surface. There is no visible public GitHub repository, public API documentation, or
              package-registry presence in this run, so the best available developer-signal comes from hiring and
              practitioner evidence. Oishii's careers page says engineers build and maintain the company's
              climate-control and robotics systems, while its Japan open-innovation release says hiring will expand
              across software/hardware engineering, agriculture, and business roles. That is enough to show the
              technology stack is still being actively built, but it is not enough to inspect code quality, release
              cadence, or systems observability the way a software investor could in a more open developer ecosystem. As
              a result, the public trust case is strong on product quality and weaker on inspectable engineering
              process.
