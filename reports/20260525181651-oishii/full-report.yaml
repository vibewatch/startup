      - number: '1.3'
        title: Funding History, Strategic Backers, and Milestone Record
        blocks:
          - type: paragraph
            body: >-
              Oishii's capital history shows continued investor conviction even after the vertical-farming washout of
              2023-2025. AgFunder reported a $134 million Series B in 2024 led by NTT and joined by Japanese strategic
              and financial investors. In May 2026, Oishii announced the first closing of a $150 million Series C led by
              SPARX Asset Management, with Nomura Real Estate Development, MISUMI Group, Mizuho Bank, and others
              participating. Official and republished round coverage repeatedly state that the latest financing brings
              total capital raised since founding to roughly $370 million. Private-database coverage diverges slightly,
              with CB Insights showing $380.58 million over eleven rounds and a $121.38 million latest Series C entry,
              suggesting either debt, grant, or reporting-timing differences rather than a clean contradiction of the
              company's public total. What public sources do not provide is a robust valuation anchor. The May 2026
              official round announcement does not disclose a post-money valuation, and the data services that mention
              funding do not expose a public number readers can independently verify from filings. That means later
              valuation work should treat the capital base as verified, the cap-table quality as strong, and the current
              valuation as an unresolved diligence point rather than a settled fact.
