      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              The reviewed public record does not currently show an obvious Oishii recall on the main federal food
              recall surfaces, which is a meaningful near-term positive for a perishable premium brand. However, that is
              only a limited signal. FDA itself says the main recalls page is not complete and archives items after
              three years, so absence on the reviewed page is not proof of no historical issue or no future food-safety
              event. Oishii is also broadening from a flagship berry tray into more formats and preserves, which
              increases the number of packaging, labeling, and handling surfaces that must remain clean and consistent.
              More importantly, sector legal history shows how quickly expansion projects can become creditor or
              contractor problems when execution slips. AppHarvest and AeroFarms both filed Chapter 11 in 2023, Plenty
              filed Chapter 11 in 2025 while still operating a strawberry site, and Richmond BizSense linked Plenty's
              filing to contractor-payment lawsuits tied to farm expansion. For Oishii, the legal risk is therefore less
              about a known live case and more about the combination of food-safety exposure, marketing-claim
              substantiation, and scale-build obligations inside a capital-intensive category.
            claimRefs:
              - CR001
              - CR002
              - CR003
