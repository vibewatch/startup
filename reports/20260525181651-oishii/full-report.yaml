      - number: '3.2'
        title: Sector reset, bankruptcies, and what public comps actually show
        blocks:
          - type: paragraph
            body: >-
              The competitive chapter cannot be separated from the sector washout that hit vertical farming after 2023.
              Plenty, AeroFarms, and Bowery all provide relevant context, but for different reasons. Plenty matters
              because it survived Chapter 11 and doubled down on strawberries, which makes it a live direct threat if
              the Richmond buildout succeeds. AeroFarms matters because it emerged around a narrower, now-profitable
              microgreens focus, which suggests premium niche crops can work better than commodity greens. Bowery
              matters because liquidation of a large unused facility is a reminder that capital raised and technology
              ambition do not guarantee durable commercial advantage. Public produce comps sharpen the same lesson.
              Local Bounti has a broad retail footprint yet a small public equity value, while Village Farms commands a
              larger public base through diversified greenhouse and adjacent businesses. For Oishii, competitive
              strength therefore includes capital discipline and crop choice, not just flavor or branding.
