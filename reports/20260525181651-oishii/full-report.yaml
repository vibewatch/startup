      - number: '2.3'
        title: 'Supply-Side Reality: Field Competition, Energy Burden, and Sector Correction'
        blocks:
          - type: paragraph
            body: >-
              The sector context cuts both ways. On the one hand, strawberries are more attractive than leafy greens for
              vertical farming because they can carry meaningful price premiums and because year-round quality matters.
              On the other hand, the crop remains expensive to grow indoors. Frontiers, arXiv, and a 2025 MDPI review
              all converge on the same broad lesson: vertical farming remains highly exposed to energy costs, especially
              lighting and climate control. That burden is especially important for fruiting crops that require tighter
              environmental control than easy leafy greens. Oishii benefits from this reality because it picked a crop
              where taste can justify higher pricing. But the same reality also caps how far the company can push into
              the mainstream. At the field-supply level, 2026 trade coverage shows California acreage and output
              recovering, supported by new varieties and strong shipment volumes. That means Oishii is not competing in
              a permanently undersupplied category. It is competing in a category where conventional growers continue to
              improve. Meanwhile, Bowery's liquidation, AeroFarms' bankruptcy, and Plenty's restructuring all show that
              capital-intensive indoor farming remains a hard business even when the technology story sounds compelling.
