  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Post-money valuation, liquidation preferences, and any structured debt terms from the 2026 financing.
    whyItMatters: Without a verified valuation and round structure, later recommendation and return math can only be scenario-based.
    diligencePath: Request the Series C term sheet, cap table, and any lender side letters from management.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, committee structure, and delegation below the founders.
    whyItMatters: Founder-market fit is strong, but governance concentration and succession depth remain unclear.
    diligencePath: Request a board list, org chart, and recent executive-hiring summary.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: distribution
    missingEvidence: A reconciled current door-count and geographic footprint by retail partner and market.
    whyItMatters: Store-count inflation would distort customer concentration, revenue-per-door, and distribution-velocity analysis in later chapters.
    diligencePath: Ask Oishii for a current retailer list with active doors and compare it with the live store locator export.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Current revenue, gross margin, headcount, and utilization metrics.
    whyItMatters: The company overview is capital-rich but operating-metric poor, which limits all downstream judgment calls.
    diligencePath: Request monthly revenue bridge, farm utilization, and headcount by function for the last twelve months.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
