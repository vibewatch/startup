- id: milestones-adverse-context-and-open-questions
  title: Milestones, Adverse Sector Context, and Remaining Unknowns
  body: 'The central positive in Oishii''s company-overview story is that it appears to have found a more defensible wedge than the leafy-greens vertical-farm cohort that collapsed. Official and trade sources show a progression from premium chef demand, to a 2022 Whole Foods launch, to broader retail distribution, to 2026 product-format expansion, robotics partnerships, and a fresh institutional financing round. The central negative is that public proof still leans much more heavily on brand, product quality, and fundraising than on disclosed economics. Bowery''s Georgia liquidation, AeroFarms'' bankruptcy case, and Plenty''s Chapter 11 restructuring remind readers that access to capital and technical novelty alone are not enough in controlled-environment agriculture. Bustle''s consumer review also reinforces a softer demand-side version of that risk: Oishii''s berries are admired, but often treated as an occasional luxury rather than an everyday staple. Oishii may deserve credit for focusing
    on premium berries rather than commodity lettuce, but the company overview cannot close the loop on realized demand durability, headcount discipline, or valuation support. Those remain the most important unresolved inputs for the later financial, risk, and valuation chapters.'
