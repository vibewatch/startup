- id: founders-and-leadership
  title: Founders, Leadership Roles, and Public Expansion Signals
  body: 'Public founder attribution is consistent across independent and official sources: Hiroki Koga is the co-founder and CEO, and Brendan Somerville is the co-founder and COO. Koga is the visible product-and-mission narrator in official and earned media, while Somerville appears in interviews as the operating counterpart focused on building a scalable agriculture company. The background evidence is directionally strong even if not exhaustively documented on the company website. Tokyo Metropolitan Government coverage says Koga conceived Oishii with Somerville; PBS identifies Somerville directly as co-founder and COO; and AgFunder''s 2024 Series B report labels both executives and roles in one place. Official surfaces do not publish a full board list, independent directors, or a detailed executive bench below the founders. The careers page, however, shows Oishii is hiring across business, engineering, and farm functions, which supports the inference that the organization is still in active
    build-out mode rather than harvest-only steady state. For investors, the key implication is that founder-market fit is strong, but governance transparency and second-layer management depth still need confirmation in diligence.'
