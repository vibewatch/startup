- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Oishii
    - Direct premium indoor berry brand
    - Private; premium retail and chef-adjacent channel proof; Jersey City scale expansion
    - Premium grocery, e-grocery, chefs, gifting buyers
    - Flavor-led Japanese fruit positioning, indoor consistency, premium brand control
    - Public proof on repeat purchase, mass-grocery expansion, and realized economics remains thin
  - - Plenty
    - Direct indoor strawberry peer
    - Virginia strawberry farm designed for >4M lb/year; emerged from Chapter 11
    - Retail and distribution partners seeking local year-round strawberries
    - Explicit strawberry focus, public capacity ambition, year-round indoor berry thesis
    - Bankruptcy, contractor disputes, and unfinished buildout raise execution risk
  - - AeroFarms
    - Sector analogue / premium indoor greens
    - Post-bankruptcy microgreens specialist; claims ~70% retail microgreens share
    - Retailers and foodservice buying premium microgreens
    - Shows a niche premium crop can work after restructuring
    - Not currently a strawberry competitor
  - - Local Bounti
    - Public CEA produce comp
    - ~13,000 retail locations across 35 states; market cap about $43M
    - Mass and regional grocery produce buyers
    - Broad greens distribution and hybrid Stack & Flow model
    - Current crop mix is leafy greens rather than strawberries
  - - Village Farms
    - Public greenhouse produce comp
    - Large-scale CEA supplier; market cap about $0.29B
    - Grocery and large-format retailers across U.S. and Canada
    - Produce-category breadth and retailer familiarity
    - Fresh portfolio is tomatoes, cucumbers, peppers, and related produce, not strawberries
  - - California strawberry growers
    - Status-quo incumbent supply base
    - '>40,000 acres, 400+ family farmers, 90% of U.S. strawberries'
    - Mass grocery, wholesale, and every mainstream berry buyer
    - Scale, retailer familiarity, broad seasonal availability
    - Less differentiated on premium indoor flavor narrative
  - - Florida strawberry growers
    - Seasonal incumbent supply base
    - Second-largest U.S. producer; 15,000+ berry acres
    - Winter-season retailers and buyers needing domestic berry supply
    - Winter availability and established field economics
    - Smaller overall footprint than California and no indoor quality story
  notes: Rows mix direct rivals, public produce comps, and incumbent field-grown alternatives because buyers can solve the same berry shelf problem through multiple production models, not just other vertical farms.
