- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Premium flavor and luxury positioning
    - Retailers may still treat berries as replaceable if velocity does not justify shelf space
    - High
    - Consumer-review and channel evidence still skew toward occasional luxury purchase
    - Request door-level sell-through, repeat purchase, and wastage by SKU and retailer
  - - Indoor year-round strawberry control
    - Plenty now has the clearest like-for-like indoor-strawberry strategy and public capacity claim
    - High
    - Plenty is post-Chapter-11 and still expanding Richmond strawberry capacity
    - Track Plenty's buildout completion, launch partners, and measured output versus design capacity
  - - Category choice superior to leafy greens
    - Sector failures show good crop choice alone does not prevent capital destruction
    - High
    - Bowery liquidation plus Plenty and AeroFarms restructurings show capital discipline remains decisive
    - Test Oishii's capex efficiency, payback period, and funding runway against comp outcomes
  - - Premium channel focus creates defensibility
    - Conventional California and Florida supply still anchors retailer expectations on price and availability
    - High
    - Official grower associations show overwhelming incumbent acreage and category growth
    - Request retailer win-loss notes and premium-buyer willingness-to-pay evidence
  - - Brand halo and premium story
    - Broad produce incumbents can win with distribution density and produce-buyer trust rather than berry mystique
    - Medium
    - Local Bounti and Village Farms demonstrate wider retail-door reach or public-market scale
    - Compare Oishii assortment economics against adjacent premium produce benchmarks
  - - Potential scale upside from new farms
    - Public proof of Oishii mass-grocery penetration remains limited
    - Medium
    - Current public channel signals remain premium grocery and e-grocery oriented
    - Request expansion roadmap by retailer class and proof of mainstream repeat purchase
  - - Operational uniqueness
    - Switching costs in produce are low unless buyers consistently see better sell-through and margin
    - Medium
    - Public evidence shows shelf presence but not hard lock-in
    - Request buyer interviews, assortment history, and competitor-coded retention data
  notes: This table focuses on durability rather than on whether Oishii's berries taste better. The central question is whether premium flavor becomes enduring shelf economics before rivals or incumbents compress the niche.
