- id: FP003
  title: Moat / readiness KPIs
  type: kpi
  layout: standard
  summary: Oishii's best visible edge is flavor premium, while the highest-severity threats are incumbent price anchors, Plenty execution, and missing sell-through proof.
  approximationNotes: Each KPI is an analytical judgment based on retained evidence, not a management KPI. Strong means visible current advantage; Weak means thin public proof; High means severe current threat.
  data:
    items:
    - label: Flavor moat
      value: Strong
      note: Premium taste and presentation remain Oishii's clearest visible advantage.
    - label: Direct indoor-rival intensity
      value: Moderate
      note: Plenty is the clearest peer, but it is still rebuilding after Chapter 11.
    - label: Incumbent price pressure
      value: High
      note: California and Florida still define the shelf's scale and price anchor.
    - label: Public scale proof
      value: Weak
      note: Oishii still lacks disclosed velocity, repeat-rate, and mass-grocery evidence.
    - label: Category capital resilience
      value: Weak
      note: Bowery, Plenty, and AeroFarms all show how fragile indoor-farm funding can be.
    - label: Diligence urgency
      value: High
      note: The next underwriting step is sell-through, pricing, and competitor win-loss proof.
