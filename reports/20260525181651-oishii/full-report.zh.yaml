      - number: '4.3'
        title: 资本充足性、融资依赖和行业背景
        blocks:
          - type: paragraph
            body: >-
              逐轮融资时间线由公司概况章节负责；这里的财务问题是，Oishii 当前资本基础是否足以支撑下一阶段。已验证的正面因素很有分量。Oishii 于 2026-05-13 宣布完成 $150 million
              Series C 首次交割，并称自创立以来累计融资约 $370 million。公开报道持续把这笔融资与产能增长、农场基础设施、自动化、新产品形态，以及美国和日本两地 R&D
              绑定。这些是增长投资，不是救援语境下的资金用途，方向上令人鼓舞。


              同时，新资本不等于可见现金跑道。CB Insights 公开页面呈现出略不同的数据图景——累计融资 $380.58 million、Series C 条目 $121.38
              million，以及同日贷款条目——暗示简化版公司新闻稿之外，可能存在债务或时点细节。更重要的是，已审阅公开来源没有一个披露当前现金、月度烧钱速度、债务余额、租赁义务、项目融资或限制性条款组合。因此，投资人仍无法把融资标题换算成现金跑道月数或下一轮时间点。行业历史让这个缺口具有实质意义，而不是学术问题。Plenty
              2025 年破产和 Bowery 设施清算表明，一旦设施承诺跑在融资耐久性前面，可控环境农业可以很快从高端增长叙事进入债权人谈判。Oishii
              今天显然比这些例子更健康，但公开记录仍不足以让投资人用现金桥证明这一点。
