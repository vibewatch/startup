      - number: '4.4'
        title: 财务结论和尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              财务读数是建设性但不完整。Oishii
              似乎选择了一个比失败叶菜公司更好的收入切口：高端草莓、消费者和零售商都愿意谈论的品牌、从可零食化入门价到奢侈礼赠的可见价格阶梯，以及可能帮助从浆果产出中捕获更多价值的常温果酱延伸。最新融资也说明投资人仍愿意为这个故事买单。这些都是真实正面因素。


              但它们都没有填上投资测算缺口。公开证据仍未披露最关键的数字：收入规模、已实现净价、按 SKU
              或渠道拆分的毛利率、损耗和返利率、员工数、现金、烧钱速度、债务，以及按农场拆分的资本开支回本。即使管理层关于单位经济模型最强的表述，也仍是访谈引用，而不是可审计财务披露。因此，实务结论不是看空商业模式，而是对投资测算保持谨慎。Oishii
              看起来拥有真实高端收入潜力，战略定位也好于许多 CEA 同行；但财务信息仍不完整。投资人不应直接把 $370 million
              资本基础当作充足性证据，而应要求一套私下尽调材料，把收入质量、利润率路径和流动性接起来。
