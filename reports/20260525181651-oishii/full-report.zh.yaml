      - number: '7.5'
        title: 缓释措施、监测指标和放弃标准
        blocks:
          - type: paragraph
            body: >-
              Oishii
              确实有看得见的缓释因素。公司不是按大宗价格卖大宗生菜；它有高端水果定位、新进资本、更宽的价格梯度，也有战略自动化伙伴。门店定位器和零售门店证据显示，品牌已经脱离纯猎奇阶段；已审阅页面上没有明显仍在执行的联邦召回，也总比相反情形好。尽管如此，仅靠信任还不足以支撑这个模型。最该盯的是运营和商业指标，而不是叙事：零售门店能否在不大幅降价的情况下继续扩张，食品安全或质量事故是否继续缺席，MISUMI
              绑定的自动化是否真能提高可重复性，以及在更强吞吐量或利润率质量的公开证据出现前，Oishii 能否避免又一次重大融资。落到执行上，几种情况会打破投资逻辑：Oishii 必须持续降价才能维持消费者尝鲜；未来
              FDA/USDA 召回或大范围腐坏事件伤到信任；扩产引发类似 Plenty 的承包商或债权人摩擦；或者公司在证明持久动销和资本纪律前就需要再融一轮。
