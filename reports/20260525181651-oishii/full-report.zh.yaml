  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品重心和运营版图
        blocks:
          - type: paragraph
            body: >-
              Oishii 把自己定位成高端水果公司，而不是泛化的室内农业平台。官网故事和农场页面都围绕一件事展开：用室内垂直农业、全年气候控制和无农药生产，在美国复刻日本水果品质。旗舰产品仍是 Omakase
              Berry，但到 2026 年春，产品已经扩到 Koyo、Nikko
              浆果，以及用浆果供应做成的果酱和抹酱等更高价值形态。这一点很关键：公司不是只靠大宗产量取胜，而是想把风味、稳定性和稀缺性变现。公开运营版图里，新泽西生产和零售可得性证据很强，但精确规模仍不完整。Oishii
              称浆果在 Jersey City 种植，官方产品页也把旗舰浆果绑定到 Jersey City，多家行业媒体还把公司 74,000 平方英尺的 Jersey City
              农场称为重要规模化节点。与此同时，当前零售覆盖报道并不一致：运行日的官方门店定位器显示 14 个州加 Washington, D.C.，而 2026 年 5 月融资报道称覆盖 18 个州加
              Toronto。差异不否定扩张，但后续章节应把分销广度视为方向性利好，而不是完全锁定的事实。
