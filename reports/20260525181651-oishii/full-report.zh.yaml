        title: 渠道分层和购买场景
        blocks:
          - type: paragraph
            body: >-
              公开客户证据显示，Oishii
              现在服务多个不同的买方—用户—付款方组合，但它们仍都处在高端消费食品生态里，而不是企业合同。最清晰的付费客户仍是通过高端商超、生鲜电商、取货和有限食品柜延伸场景购买的终端消费者。运行日官方页面显示，Whole
              Foods 在 New York City、New Jersey、New England、Philadelphia 和 Washington, D.C. 有具名区域可得性；D.C. 页面还加入 Harris
              Teeter，这是官方区域页面上最清晰的非 Whole Foods 连锁。FreshDirect 提供当前数字货架证明，消费者可以在实时生鲜电商流程中购买 Omakase、Nikko、Bento
              和果酱。餐饮服务仍重要，但主要是风味验证和发现基础设施：Oishii
              自己的故事和新闻页，以及独立报道，都把早期需求与厨师和高端菜单连接起来，再进入零售规模化。产品和定价架构也映射到多个场景，而不是只有奢侈礼赠。Koyo 被用于早餐和零食，Nikko 用于烹饪和烘焙，Reserve
              形态用于分享或特殊场合。这样的分层扩大了可触达家庭，但还没有证明可重复的大众市场行为。
