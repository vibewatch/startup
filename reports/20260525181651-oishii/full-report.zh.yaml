      - number: '2.3'
        title: 供给侧现实：田间竞争、能源负担和行业修正
        blocks:
          - type: paragraph
            body: >-
              行业背景是双刃剑。一方面，草莓比叶菜更适合垂直农场，因为它能承载有意义的价格溢价，且全年品质很重要。另一方面，这种作物在室内种植仍很昂贵。Frontiers、arXiv 和一篇 2025 年 MDPI
              综述都指向同一条大结论：垂直农场仍高度暴露于能源成本，尤其是照明和气候控制。结果类作物比容易种的叶菜需要更严格的环境控制，能源负担更重。Oishii
              因此受益，因为它挑了一个风味能支撑更高定价的作物；但同一个现实也限制了公司向主流市场推进的边界。田间供给层面，2026 年行业报道显示 California
              种植面积和产量在恢复，新品种和强劲出货量提供支撑。也就是说，Oishii 并不是在一个长期供给不足的品类中竞争。它所在的品类里，传统种植者也在持续改进。与此同时，Bowery 清算、AeroFarms 破产和
              Plenty 重组都说明，即使技术故事听起来有说服力，资本密集型室内农业仍是难做的生意。
