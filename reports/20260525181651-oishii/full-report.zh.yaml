  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接对手、替代品和真实决策集合
        blocks:
          - type: paragraph
            body: >-
              Oishii
              不是在真空中竞争，买方决策也不只是“哪家垂直农场最好”。公司自己的材料和面向消费者的零售证据，仍把它放在高端风味赛道：小包装、高感官的草莓，经由高端商超、生鲜电商和贴近厨师的渠道销售，而不是进入大宗生鲜项目。Plenty
              因此是最清晰的直接可比对象，因为 Plenty 现在也明确把重心放在室内草莓，而不是叶菜。但生鲜买手面对的更大决策集合仍是传统供给。California 和 Florida
              种植者掌握庞大的既有草莓量、成熟田间经济模型和零售商熟悉度；Village Farms、Local Bounti 等更广泛的生鲜运营商，则展示了相邻可控环境品类里的规模和分销样貌。Oishii
              的差异化真实存在，但真正战场是在仍由田间种植替代品定义的货架集合里，争夺风味驱动的高端浆果位置。
