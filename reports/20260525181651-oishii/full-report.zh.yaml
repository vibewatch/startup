  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览
        blocks:
          - type: paragraph
            body: >-
              Oishii
              进入风险章节时的位置强于许多可控环境农业同行，因为它仍有产品新意、高端品牌许可、可见零售版图和新资本。但公开记录显示，这些优势仍压在同一组结构性压力之上，而这些压力已经击垮多家垂直农场同行：昂贵设施、自动化依赖、生物复杂性，以及必须让投资人有足够耐心等到规模经济浮现。当前最重要的安慰是负面而非正面：2026-05-25
              审阅的 FDA 召回页和 FoodSafety.gov 召回界面没有显示明显 Oishii
              召回条目。这降低了存在活跃联邦食品安全事件的证据，但没有解决更难的投资测算问题：隐藏能源强度、不完整运营遥测，以及更低入门价能否在不压垮奢侈利润伞的情况下扩大需求。因此，热力图和传导图把高端价格耐久度、能源成本压力、扩张执行和资本市场依赖列为核心风险集群。
