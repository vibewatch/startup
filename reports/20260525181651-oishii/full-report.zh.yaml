              实务竞争结论是：Oishii 的护城河看得见，但尚未完全证明。故事里最强的部分，是高端风味定位、严格品牌控制，以及比行业里失败叶菜模式更有防守性的作物选择。最弱的部分，是规模化后可重复经济模型的证明。如果
