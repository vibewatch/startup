      - number: '7.2'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              已审阅公开记录目前没有在主要联邦食品召回界面上显示明显 Oishii 召回，这对一个易腐高端品牌是有意义的近期正面信号。不过，这只是有限信号。FDA
              自己称主召回页面并不完整，并会在三年后归档条目，所以已审阅页面上没有记录，并不能证明历史上没有问题，也不能证明未来没有食品安全事件。Oishii
              还在从旗舰浆果托盘扩到更多形态和果酱，这会增加必须保持清洁和一致的包装、标签和处理界面。更重要的是，行业法律史显示，一旦执行滑坡，扩张项目可以很快变成债权人或承包商问题。AppHarvest 和
              AeroFarms 都在 2023 年申请 Chapter 11；Plenty 在 2025 年仍运营草莓场地时申请 Chapter 11；Richmond BizSense 还把 Plenty
              申请破产与农场扩张相关的承包商付款诉讼联系起来。因此，Oishii 的法律风险不太来自已知活跃案件，更多来自食品安全暴露、营销主张佐证，以及资本密集型品类里的规模建设义务叠加。
