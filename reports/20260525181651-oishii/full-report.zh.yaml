  - id: TV005
    title: 投资逻辑破裂与否决触发条件表
    columns:
      - 触发条件
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 本轮定价高于公开证据可支撑区间
        - 管理层不开放数据包，却要求投资者付出高于基准区间的价格
        - 把一个有希望的业务变成糟糕入场价
        - 放弃，或压出显著更低价格并要求更强下行保护
      - - 股权结构表里的优先顺位比暗示更差
        - 大额清算优先权、反稀释棘轮、认股权证或债务层级排在新股之前
        - 即便运营改善，也会吃掉上行空间
        - 按悲观区间重定价，或直接离场
      - - 收入和毛利率桥接薄弱
        - 私有数据显示，即便货架价格高端，实际毛利率仍低、损耗高或现金跑道短
        - 把高端楔子变成脆弱叙事
        - 维持继续研究，或转为回避
      - - 需求耐久性未通过
        - 动销、复购或零售商留存撑不起高端货架位
        - 打断把更易触达规格作为增长杠杆的逻辑
        - 下调估值区间，并收紧尽调要求
      - - 出现救援融资措辞
        - 出现债权人压力、契约压力或紧急资本需求
        - 让 Oishii 看起来更像承压 CEA 先例，而不是高端农产品平台
        - 在重新承销资产负债表前，按投资逻辑破裂处理
    notes: 这些是明确否决标准，不是泛泛风险。每一项都会直接改变投资实际优先顺位，或改变上行情景的可信度。
    claimRefs:
      - CV038
      - CV041
      - CV049
      - CV050
      - CV055
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 本轮估值和股数
        - 精确投后估值、每股价格、流通股数，以及按证券类别拆分的稀释
        - 需要用它把公开情景区间转成实际入场价格和持股结果
        - CFO 材料包加已签署投资条款清单
      - - 优先股堆叠和债务
        - 清算瀑布、认股权证、债务优先顺位、契约和附函
        - 决定任何退出价值有多少能流向新股
        - 律师审阅最终融资文件
      - - 收入和毛利率桥接
        - 月度收入、按 SKU 和渠道拆分的毛利率、损耗和烧钱速度
        - 检验高端货架定价能否变成可持续现金生成
        - 财务尽调，配董事会级别月度报告
      - - 动销和复购需求
        - 门店级动销、补货节奏、促销强度和客户集中度
        - 区分猎奇需求和可持续食品零售行为
        - 商业尽调，使用零售商队列数据
      - - 自动化和能源证据
        - 每包人工小时、每包能源成本，以及按农场批次拆分的产量改善
        - 检查自动化是否真的抵消室内农业结构性成本负担
        - 运营尽调，配农场 KPI 看板
      - - 退出路径和董事会流程
        - 当前财务投资人接触、投行反馈，以及董事会对战略退出与公开上市退出的看法
        - 需要用它承销现实的变现路径，而不是理论性重估
        - CEO、董事会和顾问背景访谈
    notes: 每项尽调要求都旨在把本章从仅基于公开信息的筛查判断，转成可投资承销文件。若管理层拿不出这些材料，建议不应上调。
    claimRefs:
      - CV016
      - CV017
      - CV020
      - CV049
      - CV050
      - CV055
