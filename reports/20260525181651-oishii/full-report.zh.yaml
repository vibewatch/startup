        title: 耐久度、复购和价格敏感度
        blocks:
          - type: paragraph
            body: >-
              耐久度证据方向正面，但仍不完整。Modern Retail 报道，早期上架阶段有两个强漏斗顶端信号：进入零售前有数千人等待名单，进入 Whole Foods
              后几乎天天售罄。这很有意义，因为它说明需求不只是社交媒体戏剧。同一篇文章还称，Whole Foods
              试吃和本地项目陈列帮助把认知转成货架试用。但公开证据没有给出投资人真正需要用来测算复购行为的指标。HortiDaily 称，Oishii
              的品类研究发现，草莓是一种有压力的购买，因为它价格高，而且可能在食用前变质；超过半数消费者会丢弃一部分草莓，有些人甚至离开这个品类。Oishii 的回答是更低价格点、顶封包装和 Stay-Fresh
              Guarantee，HortiDaily 称这些包装变化已经带动核心零售商需求跃升。即便如此，Bustle
              的测评仍是最清晰的反向权重：浆果确实出色，但旗舰托盘对日常预算仍不实际。因此，公开证明支持试用和高端热情，不支持已经形成持久队列留存。
