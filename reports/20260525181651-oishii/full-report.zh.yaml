  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与哪些支出算可触达
        blocks:
          - type: paragraph
            body: >-
              Oishii 的正确市场边界不是“全部农业”，甚至也不是整个可控环境农业行业。Oishii
              卖的是带有礼赠、厨师和高端商超属性的高端新鲜浆果，所以适用市场栈应从美国新鲜草莓市场出发，再收窄到愿意为风味、稳定性、无农药生产和全年供应付费的消费者与买家。AgMRC
              的草莓行业概览给出最保守的锚：美国草莓生产是一个数十亿美元级品类，由 California 主导，并由 Florida 在冬季补充供给。也就是说，Oishii
              处在一个真实且有价值的生鲜市场里，而不是新奇玩具市场。但公司真正可服务的切片远小于草莓总支出，因为它排除了加工浆果、大多数自有品牌低价大包装，以及许多价格敏感的主流购物者。Oishii
              自身渠道证据也强化了这个更窄边界。Whole Foods、FreshDirect、Instacart
              和高端特色零售都是有用信号，因为它们显示公司今天在哪些地方可能赢。它们并不证明公司已经接近覆盖家庭草莓消费篮子的全部。实践中的边界，是零售和餐饮渠道里的高端新鲜草莓；这些渠道更看重风味和淡季可靠性，而不是最低单位价格。
