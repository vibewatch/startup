  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、SKU 策略和客户工作流
        blocks:
          - type: paragraph
            body: >-
              Oishii 不再只是卖一盘奢侈草莓。公开产品表面现在更像围绕三种浆果品种、多种包装规格、等级层次和新的果酱延伸搭出的组合策略，品牌边界也从鲜果扩大出去。官方和转载的 2026 年材料显示，公司用 Premium
              和 Reserve 等级映射不同消费任务：Omakase 仍是招牌特殊场合浆果，Koyo 被推向日常高端零食，Nikko
              则通过更大号保鲜包装定位于烹饪、烘焙和更高频使用。这一点重要，因为产品定义正从一个厨师喜爱的单一新奇
              SKU，变成可重复的消费者系统——品种加形态、包装和渠道。果酱线再进一步，把浆果品牌资产转成食品柜产品，既能平滑使用场景的季节性，也能在不放弃高端品牌的前提下创造更高利润率延伸。Oishii 自有门店定位器和
              Nosh 2026 年报道还显示，这个产品组合正通过实时零售可得界面和 300 多个零售门店铺开，因此产品已经进入主流零售工作流，而不是停留在手工直销实验。
