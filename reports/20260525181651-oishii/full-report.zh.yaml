      - number: '8.3'
        title: 可以给出区间，但它只是纪律工具，不是当前标记
        blocks:
          - type: paragraph
            body: >-
              在这种分化下，纯公开信息能输出的不是精确估值，而是一套承销纪律。悲观情景把 Oishii 视为一个不透明、资本密集的 CEA 资产；高端浆果故事不足以覆盖融资风险和缺失的经济性，因此只能支撑大约 $100
              million 到 $200 million 区间。基准情景假设高端切口真实存在，更广触达的产品形式正在帮忙，且没有彻底压垮价格；非公开尽调最终会显示成本和资本结构可控，因此支撑大约 $250 million 到
              $450 million 区间。乐观情景需要非公开证据证明，Oishii 已经更像高端品牌化农产品平台，而不是亏损的垂直农场；所以上行区间只有在大约 $500 million
              以上才可信。关键是，这些都是纪律区间，不是观察到的当前估值。当前轮次价格未披露，公开估值支撑又弱，因此建议是继续研究，而不是买入。区间的价值在于约束出价，不是证明一个未披露标记已经有吸引力。
