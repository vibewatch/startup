      - number: '3.2'
        title: 行业重置、破产案例与公开可比公司真正说明什么
        blocks:
          - type: paragraph
            body: >-
              竞争章节绕不开 2023 年后打击垂直农场行业的洗牌。Plenty、AeroFarms 和 Bowery 都提供了背景，但原因不同。Plenty 重要，是因为它走出 Chapter 11 后加码草莓；如果
              Richmond 建设跑通，它就是仍然活跃的直接威胁。AeroFarms 重要，是因为它转向更窄、如今已盈利的微型叶菜重心，暗示高端利基作物可能比大宗叶菜更可行。Bowery
              重要，是因为一座大型闲置设施被清算，提醒市场：已融资本和技术野心不等于持久商业优势。公开生鲜可比公司让同一教训更尖锐。Local Bounti 零售覆盖广，但公开股权价值很小；Village Farms
              则靠多元化温室和相邻业务撑起更大的公开市场基础。因此，Oishii 的竞争实力不只包括风味或品牌，还包括资本纪律和作物选择。
