      - number: '2.4'
        title: 证据约束下的规模判断及其对 Oishii 的含义
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个清晰结论：底层草莓品类足够大，但 Oishii 的可服务市场受价格、渠道匹配和供给经济模型约束，而不是受抽象 TAM 约束。AgMRC 的数十亿美元市场锚和 California 2026
              年出货动能显示，品类需求充足。更难的问题是，有多少需求会持续接受 Oishii 的价格点和质量承诺。公司的 $4.99
              入门价说明管理层知道答案不能永远停留在“只为特殊场合购买”。但消费者测评和当前渠道组合也暗示，Oishii
              仍处在高端利基，而非大众主食。这本身并不坏；高端浆果仍可支撑有价值的业务。但投资人做规模判断时需要克制。正确的投资测算问题，不是草莓是不是一个大市场，而是 Oishii
              能否一边守住风味领先，一边继续扩大已经服务的高端新鲜水果细分，并最终把成本降到足以支撑复购。公开数据还不能精确回答，所以本章以证据约束视角收尾，而不是给出夸张的 TAM 叙事。
