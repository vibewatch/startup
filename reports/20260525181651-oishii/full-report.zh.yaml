      - number: '5.4'
        title: 路线图、复制雄心和产品技术风险
        blocks:
          - type: paragraph
            body: >-
              Oishii 的路线图方向清楚，尽管工程里程碑不精确。最清晰的近期主题是更多产能、更深机器人整合、更多包装和形态试验，以及更多日本 R&D。Tokyo Open Innovation Center
              很重要，因为它把公司从运营一座大型智能农场，推向标准化系统本身。日本官方材料称，该中心将研究工厂自动化和 AI 环境控制；日本新闻稿和 Worldfolio
              访谈都把最终目标描述为一套交钥匙方案，可以在没有定制现场工程的情况下部署。Oishii
              看起来仍依赖高度专门调校、合作伙伴供应组件和内部集成机器人，这个战略目标是正确的。风险在于，剩余证据大多仍是方向性信息。Oishii 谈到扩大自动化采摘、组件标准化和更广泛的美国 /
              日本基础设施，但公开材料尚未披露能证明自动化栈在规模上经济占优的运营遥测。同样，正式食品安全认证、软件可靠性指标和更深入的合作伙伴商业条款仍不在公开记录里。路线图连贯；可重复、可审计的交钥匙执行，公开证明仍不完整。
