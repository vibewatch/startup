  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 定价可行性始于资本可得性，但止步于股权层
        blocks:
          - type: paragraph
            body: >-
              公开证据表明 Oishii 拿得到资金，商业进展也在推进，但股权层面的定价只能到融资信息为止。2026 年 5 月的官方新闻稿和多篇独立报道核实了几件事：$150 million 首次交割、累计融资约 $370
              million、具名的日本战略和财务支持方，以及 $4.99 到 $15 的更宽产品价格梯度。CB Insights 让这条叙事更复杂，但没有推翻它：其数据显示，公司 11 轮融资合计 $380.58
              million，另有一条 $121.38 million 的 Series C
              记录和同日贷款记录，说明公开数据集可能混合了股权和非股权资本，而不是给出干净的投后估值标记。这个区别很重要：公开证据现在能支持已募资本规模，却不能支持新投资人实际要为股权支付的价格。同一份公开记录仍然缺少收入、毛利率、烧钱速度、现金跑道，甚至员工数。因此，合理解读既不是看多确定性，也不是看空崩盘。Oishii
              看起来融资能力强、差异化明确，但公开信息无法给它定价。价格敏感的投资人应把现有记录视为动量加不透明，而不是默认未披露估值合理的通行证。
