companyProfile:
  summary: >-
    Oishii 是一家高端室内水果公司，2016 年创立，想用重机器人化的室内农业模式，把日本级浆果品质带进美国市场。公司在新泽西种植旗舰 Omakase、Koyo 和 Nikko 浆果，渠道已经扩到高端商超和生鲜电商，并在 2026
    年 5 月完成 $150 million Series C 首次交割；但已实现收入、利润率、产能利用率和估值仍少有公开披露。
  foundedDate: '2016-01-01'
  founders:
    - name: Hiroki Koga
      role: 联合创始人兼 CEO
      background: 公开资料把他列为联合创始人兼 CEO。他为 Oishii 定下高端日本水果使命，并继续带队。
      claimRefs:
