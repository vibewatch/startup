      - number: '7.3'
        title: 运营和质量风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Oishii 想把一个生物上脆弱、商业上不宽容的产品工业化。官方农场材料指向一座超过 237,500 平方英尺的 Amatelas 设施，包含多层种植、蜜蜂授粉、水循环，以及每年分析 60 billion
              个数据点的机器人。这些能力支撑差异化，但也意味着固定成本和正常运行时间负担比更简单的田间草莓业务更大。学术和技术来源都认为，垂直农场可行性仍受资本开支以及照明、HVAC、除湿等经常性能耗约束；Oishii
              自身公开材料没有披露太阳能邻近性抵消了多少负担，也没有披露机器人、输送带或授粉系统偏离目标表现的频率。高端品牌还会放大新鲜度风险：如果冷链质量、包装承诺或货架期执行令人失望，支撑 $14.99
              线上包装的奢侈定位也会放大消费者失望。简言之，Oishii 的运营故事令人印象深刻，但公开缺少缺陷率、产量、召回和利用率遥测，残余暴露仍高。
