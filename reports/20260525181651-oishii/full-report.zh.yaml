        title: 创始人、领导分工和公开扩张信号
        blocks:
          - type: paragraph
            body: >-
              独立来源和官方来源对创始人归属说法一致：Hiroki Koga 是联合创始人兼 CEO，Brendan Somerville 是联合创始人兼 COO。Koga
              在官方和媒体报道中是最可见的产品与使命叙事者；Somerville 在访谈里更像运营搭档，重心是搭建可规模化的农业公司。背景证据方向上很强，尽管公司网站没有完整列出。Tokyo Metropolitan
              Government 报道称 Koga 与 Somerville 一起构想了 Oishii；PBS 直接称 Somerville 为联合创始人兼 COO；AgFunder 的 2024 年 Series B
              报道则在同一处标出两位高管和职务。官方页面没有披露完整董事会名单、独立董事，也没有给出创始人以下的详细高管梯队。不过招聘页显示 Oishii
              在招聘商业、工程和农场岗位，说明组织仍处在积极搭建期，而不是只收成的稳定状态。投资人的核心判断是：创始人与市场匹配度强，但治理透明度和第二层管理深度仍需在尽调中确认。
