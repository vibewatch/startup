        - label: 厨师和餐饮服务引用
          values:
            - 历史证据但可信
            - 中
            - 参考客户证据
            - None
        - label: 300 多家门店与翻倍说法
          values:
            - 近期
            - 中
            - 广泛铺货说法
            - None
        - label: 复购 / 集中度指标
          values:
            - 当前缺失
            - 缺口指向清晰
            - 未披露
            - None
    approximationNotes: 单元格按定性方式给证据质量打分。矩阵评估公开来源能让投资者验证什么，而不是客户质量本身。
    claimRefs:
      - CU003
      - CU005
      - CU007
      - CU010
      - CU013
      - CU017
      - CU018
      - CU036
      - CU037
      - CU038
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最高优先级风险集中在高端价格韧性、资本强度和食品安全信任可能相互叠加而非彼此独立的地方。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 极高严重度
          values:
            - label: 未来联邦召回或重大食品安全事件
            - label: 运营证据出现前再次需要融资
            - label: 高端价格被侵蚀且门店扩张放慢
        - label: 高严重度
          values:
            - label: 跨境执行失误
            - label: MISUMI / 自动化瓶颈
            - label: 能源与 HVAC 成本挤压
        - label: 中严重度
          values:
            - label: 包装承诺兑现滑坡
            - label: 零售渠道集中
            - label: 招聘深度不足
        - label: 低严重度
          values:
            - label: 生鲜电商价格噪音
            - label: 高端水果新鲜感降温
            - label: 规格增多带来的复杂度
    claimRefs:
      - CR001
      - CR011
      - CR018
      - CR021
      - CR026
      - CR034
      - CR037
      - CR040
      - CR044
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: Oishii 的下行情景最终汇到信任和资本：价格压力、能源负担或质量事件，都可能导向动销转弱、融资更难。
    data:
      nodes:
        - id: rn1
          label: 能源 / HVAC 负担
          type: cost
        - id: rn2
          label: 毛利率压力
          type: financial
        - id: rn3
          label: 需要守住高端定价
          type: commercial
        - id: rn4
          label: 消费者支付意愿走弱
          type: commercial
        - id: rn5
          label: 动销变慢 / 有效门店减少
          type: commercial
        - id: rn6
          label: 需要更多外部资本
          type: financial
        - id: rn7
          label: 稀释 / 投资逻辑重置
          type: financial
        - id: rn8
          label: 食品安全事件
          type: operational
        - id: rn9
          label: 召回 / 品牌信任冲击
          type: regulatory
      edges:
        - from: rn1
          to: rn2
          label: 推高
        - from: rn2
          to: rn3
          label: 迫使
        - from: rn4
          to: rn5
          label: 降低
        - from: rn3
          to: rn5
          label: 可能约束
        - from: rn5
          to: rn6
          label: 提前触发
        - from: rn6
          to: rn7
          label: 造成
        - from: rn8
          to: rn9
          label: 可能触发
        - from: rn9
          to: rn5
          label: 损害
        - from: rn2
          to: rn6
          label: 增加
    claimRefs:
      - CR011
      - CR012
      - CR021
      - CR025
      - CR034
      - CR040
      - CR044
      - CR046
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: Oishii 模式同时依赖多个外部支撑——自动化合作伙伴、高端零售门店、战略资本、能源输入和人才深度——所以集中风险是系统性的，不是孤立风险点。
    data:
      nodes:
        - id: dn1
          label: Oishii Smart Farm 模式
          type: core
        - id: dn2
          label: MISUMI 自动化 / 零部件
          type: partner
        - id: dn3
          label: 高端零售商与特色杂货店
          type: channel
        - id: dn4
          label: FreshDirect / Instacart 价格展示界面
          type: channel
        - id: dn5
          label: 战略资本基础
          type: capital
        - id: dn6
          label: 电网供电与气候控制负载
          type: energy
        - id: dn7
          label: 农场 + 工程招聘
          type: people
      edges:
        - from: dn1
          to: dn2
          label: 自动化扩张
        - from: dn1
          to: dn3
          label: 高端动销
        - from: dn1
          to: dn4
          label: 价格发现
        - from: dn1
          to: dn5
          label: 现金跑道与资本开支
        - from: dn1
          to: dn6
          label: 运营成本基底
        - from: dn1
          to: dn7
          label: 执行深度
        - from: dn2
          to: dn7
          label: 集成负担
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR027
      - CR029
      - CR037
      - CR041
      - CR045
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议链条从可见资本获取能力，经过可比公司结果分散和披露缺口，走向继续研究的决定。
    data:
      nodes:
        - id: funding
          label: 资本获取能力可见
          detail: 公开证据确认首轮交割 $150M，累计融资约 $370M
        - id: premium
          label: 高端切入点可见
          detail: Oishii 目前覆盖约 $4.99 到 $15 的价格带，仍把自己定位为高端农产品
        - id: dispersion
          label: 可比结果分散
          detail: 公开参照从陷入困境的 CEA 股权，到市值约 $0.3B 的农产品平台都有
        - id: opacity
          label: 核心股权输入仍未公开
          detail: 未披露公开投后估值、收入、利润率或优先股堆叠
        - id: range
          label: 公开输出是区间，不是定价点
          detail: 本章只能支撑承销区间和入场纪律
        - id: diligence
          label: 私下尽调决定结论
          detail: 需要轮次条款、利润率桥和复购需求数据，才能调整判断
        - id: recommendation
          label: 继续研究
          detail: 只有价格和运营证据可见后才上调判断
      edges:
        - from: funding
          to: premium
          label: 规模加产品证据
        - from: premium
          to: dispersion
          label: 仅有品质不足以给股权定价
        - from: dispersion
          to: opacity
          label: 可比分散提高举证门槛
        - from: opacity
          to: range
          label: 数据缺失挡住精确定价
        - from: range
          to: diligence
          label: 区间只指导出价
        - from: diligence
          to: recommendation
          label: 价格和证据决定结论
    approximationNotes: 这是决策流程，不是按时间缩放的运营模型。它突出驱动建议的分析依赖。
    claimRefs:
      - CV008
      - CV020
      - CV039
      - CV041
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 0-10 序数敏感度分数，显示哪些缺失输入或市场力量最影响 Oishii 可支撑入场估值。
    data:
      items:
        - label: 轮次估值披露
          value: 10
        - label: 收入与毛利率证据
          value: 9
        - label: 股权结构表与优先权清晰度
          value: 9
        - label: 零售复购动销
          value: 8
        - label: 能源和自动化成本证据
          value: 8
        - label: 公开可比公司情绪
          value: 7
    approximationNotes: 数值是定性敏感度分数，不是百分比变化或估值点估计。分数越高，该因素越能推动 Oishii 可支撑估值区间。
    claimRefs:
      - CV020
      - CV038
      - CV041
      - CV044
      - CV049
      - CV055
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准、乐观情景下的低、中、高承销区间。这些区间限制能出多少钱，而不是预测隐藏的当前估值点。
    data:
      items:
        - label: 悲观承销区间
          low: 100
          mid: 150
          high: 200
          unit: USD M
          detail: 按不透明 CEA 资产处理，融资和成本压力压过高端莓果故事
        - label: 基准承销区间
          low: 250
          mid: 350
          high: 450
          unit: USD M
          detail: 高端小众需求存续，后续私下尽调确认股权堆叠可控，但不足以支撑完整平台溢价
        - label: 乐观承销区间
          low: 500
          mid: 650
          high: 800
          unit: USD M
          detail: 非公开证据证明高端农产品经济性、强复购需求和清晰的优先权结构
    approximationNotes: 这些是仅基于公开信息的承销区间，来自融资背景、公开市场可比公司和行业失败案例。它们不是已观察到的当前估值，也没有扣除未披露的优先股堆叠。
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV054
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 基于公开证据质量而非管理层接触的投资案例简明评分视图。
    approximationNotes: 分数是综合本章证据得出的 0-10 定性判断，不是正式评分算法计算结果。
    data:
      items:
        - label: 资本获取能力
          value: 8
          unit: /10
          detail: 新资金和可信背书方在公开信息中可见
          claimRefs:
            - CV001
            - CV002
            - CV003
        - label: 披露质量
          value: 2
          unit: /10
          detail: 估值、收入、利润率和员工数仍未公开
          claimRefs:
            - CV004
            - CV016
            - CV017
        - label: 需求与产品证据
          value: 6
          unit: /10
          detail: 高端价格梯度和 300 多家门店信号真实但不完整
          claimRefs:
            - CV010
            - CV011
            - CV013
            - CV014
        - label: 下行不对称
          value: 3
          unit: /10
          detail: 行业失败案例使下行保护必不可少
          claimRefs:
            - CV033
            - CV036
            - CV037
            - CV038
        - label: 估值支撑
          value: 4
          unit: /10
          detail: 本章能支撑区间，不能支撑干净的当前估值点
          claimRefs:
            - CV041
            - CV044
            - CV045
        - label: 退出准备度
          value: 4
          unit: /10
          detail: 私下退出有可能，但公开记录还达不到公开市场准备度
          claimRefs:
            - CV050
            - CV055
    claimRefs:
      - CV003
      - CV013
      - CV020
      - CV038
      - CV041
      - CV045
      - CV050
