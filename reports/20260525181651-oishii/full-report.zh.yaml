  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、价格阶梯和商业化表面
        blocks:
          - type: paragraph
            body: >-
              Oishii 的公开财务故事先从一个简单点开始：它是实物产品收入模式，不是订阅业务。官方故事和产品页把公司放在高端水果上；2026 年定价公告和当前 FreshDirect
              商品页显示，变现现在覆盖多种浆果形态和更高价的果酱。当前公开产品线已不再只是用异常高价售卖的声望型草莓。相反，Oishii 已经搭出一条可见阶梯：从 $4.99 的 Strawberry Bento
              Box、$7.99 的日常使用形态，到 $11.99 的 Reserve 级浆果；观察到的零售商价格仍显示旗舰 Omakase Berry 为 $14.99，Daifuku-Inspired Strawberry
              Spread 为 $34.99。这一点重要，因为它说明管理层想扩大试用场景，但不放弃高端定位。


              同样重要的是，GTM 证据指向零售和生鲜电商货架存在，而不是直接长期合同。运行日门店定位器显示多州可得，2026 年 4 月包装报道称 Oishii 产品已进入美国 300
              多个零售点，并计划到年底把覆盖翻倍。因此，收入质量更像品牌化高端 CPG 生鲜，而不是项目收入或软件
              ARR。问题在于，公开证据仍只给出标价或观察到的货架价格。它没有披露实际批发价、零售商扣减、渠道费用、损耗补贴，也没有披露旗舰托盘、日常形态和果酱之间的组合。
