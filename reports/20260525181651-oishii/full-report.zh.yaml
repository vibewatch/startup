      - number: '7.4'
        title: 依赖、财务和执行风险
        blocks:
          - type: paragraph
            body: >-
              下一层风险是依赖：Oishii 同时依赖高端零售伙伴、高端消费者付费意愿、自动化和组件伙伴，以及资本提供方。当前公开版图覆盖 15 个辖区和 300 多个零售点，管理层目标是在 2026
              年底前把门店数翻倍。这是有意义的分销目标，但也抬高了执行门槛，因为 Oishii 仍没有公开披露单店动销、复购，或新低入门价之后的价格弹性。公司看起来也在自动化、数字制造和组件支持上与 MISUMI
              有实质绑定，招聘页则显示商业、农场和工程人才都在同时需要。财务上，2026 年 Series C 首次交割买来了时间，但行业公开可比对象仍让人清醒：Local Bounti 和 Village Farms
              仍显示紧张流动性或杠杆取舍，Plenty 2025 年破产也证明，即便聚焦草莓的策略，也可能遭遇建设、债权人和融资压力。Oishii
              可能比这些同行位置更好，但私有公司单位经济模型不透明，再加多线扩张，意味着残余模型风险仍偏高。
