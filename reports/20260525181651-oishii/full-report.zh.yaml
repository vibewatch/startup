      - number: '5.3'
        title: 信任、质量控制和从业者信号
        blocks:
          - type: paragraph
            body: >-
              公开信任证据围绕食品质量和新鲜度，而不是企业软件式的合规文件。Oishii 反复强调无农药种植、Non-GMO Project 认证和峰值成熟度采摘；2026 年包装刷新又通过顶封包装和 Nikko Berry
              保鲜保证，加入更明确的新鲜度层。这些都是有意义的商业质量控制，因为浆果是高损耗品类，包装表现会直接影响复购。同时，公司没有通过公开开发者界面暴露太多软件层细节。本轮调研没有看到公开 GitHub 仓库、公开
              API 文档或包注册表存在，因此最好的开发者信号来自招聘和从业者证据。Oishii 招聘页称工程师负责搭建和维护公司的气候控制及机器人系统，日本开放创新新闻稿称招聘将扩到软件 /
              硬件工程、农业和商业岗位。这足以说明技术栈仍在积极搭建，但不足以像更开放的开发者生态那样检查代码质量、发布节奏或系统可观测性。因此，公开信任案例在产品质量上很强，在可检查工程流程上较弱。
