      - number: '8.2'
        title: 可比信号同时指向高端上行路径和严重下行风险
        blocks:
          - type: paragraph
            body: >-
              可比公司并不能给 Oishii 一个整齐的单一倍数。它们只划出一条很宽的走廊，两端由披露深度、运营质量和资产负债表风险决定。弱端是 Local Bounti：一家真实、有收入的 CEA
              运营商，毛利薄、持续依赖融资，公开市场会怎样惩罚这类公司。其 2025 年和 2026 年 Q1 文件显示，公司有可观收入、持续亏损，2026 年 5 月股权价值却只有约 $43 million。强端是
              Village Farms：农产品相邻平台可以守住约 $0.3 billion 市值，但前提是收入和盈利证明远好于 Oishii 已披露的信息。StockAnalysis 还显示，截至 2026 年 5
              月下旬，Local Bounti 的过去十二个月销售倍数约 0.9x，Village Farms 约
              1.3x，说明即便有规模的运营商，如果证明不够清楚、经济性不够干净，公开市场给的估值溢价也很有限。反向类比同样重要。Plenty 的 Chapter 11 破产保护申请、Bowery 的设施清算，以及
              AppHarvest 在产量低于预期、成本高企后破产，说明室内农业股权会多快解体。AeroFarms
              破产后收窄作物范围，也强化了同一课：活下来的公司往往更选择性，而不是更扩张。学术能源成本来源给出了这种分化的结构性原因。室内农业对能源和运营纪律高度敏感，因此作物质量和自动化只有压过坚硬的成本曲线时才有意义。
