  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性承保区间
      - 回报逻辑
      - 概率信号
      - 关键失败模式
    rows:
      - - 悲观
        - 公开尽调始终无法厘清估值、资本栈或单位经济性不透明，Oishii 被当成承压 CEA 资产：有高端小众故事，但证明不足
        - USD 100M 至 200M
        - 只有作为带下行保护的期权，而非确信型成长股权，进入才说得通
        - 融资压力加大、动销转弱，或行业情绪恶化
        - 高端叙事跑不过能源、人工和资本密集度的拖累
      - - 基准情景
        - 后续私有尽调确认复购需求、可控技术栈和部分真实利润率改善，但透明度仍不足以支撑完整的高端平台估值。
        - USD 250M 至 450M
        - 只有入场价格不靠英雄式重估也留出上行空间，才可接受
        - 零售稳定扩张、股权结构表更干净、经营数据达到董事会级别
        - 披露仍不完整，隐藏稀释或平庸毛利率封住上行空间
      - - 乐观情景
        - 管理层证明高端农产品经济性跑得通，优先权结构干净，新规格和自动化能持续拓宽需求。
        - USD 500M 至 800M
        - 上行取决于私有证据能否证明 Oishii 值得高于上市农业和 CEA 可比公司的溢价
        - 经审计的收入与毛利率证据、健康复购行为、纪律性股权结构表
        - 任何一份薄弱尽调包都会把投资逻辑压回基准或悲观区间
    notes: 这些是示范性承销区间，并非已观察到的市场标记。若清算优先权、债务或其他优先索偿权大于目前公开证据所暗示的水平，股权价值可能显著更低。
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV051
      - CV052
      - CV053
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 参考指标
      - 估值或状态
      - 对 Oishii 的意义
      - 局限
    rows:
      - - Oishii 已披露融资背景
        - 当前私募融资信号
        - $150M 首次交割；累计融资约 $370M；未公开投后估值
        - 衡量公司当前可用资本规模时，最直接的公开锚点
        - 融资规模不等于可辩护的当前股权估值
      - - Local Bounti
        - 上市 CEA 下行情景可比公司
        - $48.4M 2025 年销售额；2026 年 5 月市值约 $43.3M；仍在亏损且需要融资
        - 说明即使达到商业规模，公开市场也可能严厉惩罚受控环境资产
        - 叶菜品类组合和债务结构不同于 Oishii 的高端莓果模型
      - - Village Farms
        - 上市农产品平台上沿参照
        - $215.9M 2025 年销售额；2026 年 5 月市值约 $0.29B 至 $0.30B；净利润为正
        - 当农产品经济性和披露显著更强时，上市股权可能落在哪个区间
        - 业务组合比 Oishii 公开可见记录更广，也更赚钱
      - - Plenty
        - 室内草莓重组的直接参照
        - 2025 年申请 Chapter 11；重整后聚焦更窄的草莓业务
        - 最接近的同类提醒：即便草莓优先的室内农业，也可能需要重置
        - 没有可用的清晰当前公开股权估值
      - - AppHarvest
        - 成本和产量失败先例
        - 作物产量低于预期、运营成本高企后破产
        - 室内农业假设在运营上破裂时，这是有用的下行边界
        - 番茄温室模型不是高端莓果消费品牌
      - - Bowery 和 AeroFarms 重置
        - 资产回收或收缩幸存者先例
        - Bowery 设施清算；AeroFarms 的存续绑定更窄的作物聚焦
        - 运营模型一旦滑坡，仅有资本和技术也守不住估值
        - 这些是行业边界标记，不是一一对应的倍数
    notes: 这组可比对象有意混合上市股权参照、融资背景和行业反向先例，因为没有一篮子干净的上市同行能完全映射 Oishii。阅读这些行时，应把它们当作承销纪律的估值边界，而不是一一对应的倍数。
    enumerationScope:
      coverage: partial
      basis: >-
        This enumeration covers the main directly accessible public references most relevant to Oishii's premium
        indoor-berry model in 2025-2026, but it excludes subscription-only private board marks, signed term sheets, and
        secondary transactions that would sharpen an exact private-market multiple.
