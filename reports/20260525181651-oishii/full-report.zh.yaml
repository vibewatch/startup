        - 机器人、自动化和高端浆果，让 Oishii 的叙事比大宗绿叶菜更能防守
        - 能耗强度和运营复杂度仍会限制室内水果盈利上限
        - 展示农场层面劳动力、能源和产量相较既往批次的改善
      - - 公开可比公司的上行空间存在
        - Village Farms 说明，有利润证明的生鲜邻近平台可维持大约 $0.3B 的公开市场价值
        - Village Farms 披露的收入和盈利能力远多于 Oishii
        - 把披露缺口补到足以支持高端平台对比
      - - 困境下行是真实风险
        - Plenty、Bowery 和 AppHarvest 说明，室内农业股权重置或归零可以非常快
        - Oishii 当前未出现困境表述，且手里有新资金
        - 持续展示商业牵引力，同时不依赖救援式融资
      - - 当前反向逻辑
        - 公开证据仍指向一家有潜力但不透明的私营公司，估值支撑偏弱
        - 私下尽调仍可能证明，该业务相对公开 CEA 可比公司值得溢价
        - 打开股权结构表和月度运营数据，才能直接检验价格
    notes: 投资逻辑和反向逻辑刻意保持价格敏感。即便公司很强，如果投资人穿透不了不透明性和优先级风险还付高价，仍可能是一笔差投资。
