      - number: '4.2'
        title: 单位经济模型、成本结构和同行暗示
        blocks:
          - type: paragraph
            body: >-
              公开单位经济模型证据有启发，但远未定论。AgFunder 引述管理层称，Oishii
              先聚焦验证单位经济模型，再追逐收入，并已经“跨过困住其他垂直农场公司的鸿沟”。投资人应把这当作有用信号，但仍应视为管理层叙事。本章没有任何公开来源披露收入、毛利率、CAC、回本周期或现金跑道。公开记录披露的是管理层试图跑通的逻辑：高端草莓而非叶菜、更宽价格阶梯、面向新鲜度和零售商信心的包装，以及持续自动化和内部迭代。HortiDaily
              的报道补上一层重要商业细节：Oishii 称新的顶封包装提升了劳动效率和新鲜度，带动核心零售商需求跃升，并与过去 18 个月的种植空间扩张并行。


              成本侧仍是更难的部分。关于垂直农场的技术来源一致描述了高资本成本和高运营成本，照明、HVAC、除湿和气候控制都是核心负担。这意味着 Oishii
              的利润率路径大概率取决于两件事：守住高端实际价格，同时用自动化、包装和作物选择降低浪费和劳动力拖累。公开公司代理指标说明了为什么这很重要。Local Bounti 在 2025 年和 2026 年 Q1
              产生了真实收入，但在沉重融资压力下，毛利仍很薄，亏损也明显。相比之下，Village Farms 显示，规模化且贴近生鲜的运营可以产生健康得多的毛利率和盈利能力。Oishii
              的可能未来落在这两极之间，但公开证据还没有说明具体位置。
