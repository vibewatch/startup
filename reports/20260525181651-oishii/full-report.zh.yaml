      - number: '5.2'
        title: 智能农场运营模式、蜜蜂授粉和自动化栈
        blocks:
          - type: paragraph
            body: >-
              Oishii
              的技术核心，是一套把生物过程与工厂式自动化结合起来的可控环境农业系统。官方农场材料描述了一个在室内复刻空气、雨水、热量、光照、养分和天然蜜蜂授粉的系统；外部报道则补上系统实际运转的重要细节。Forbes 描述
              Amatelas 农场使用 250 个移动架、8 层种植位，在昼夜条件间循环；Oishii 自有页面则提到机器人和其他机器监测温度、湿度、CO2、风速和光照。这是值得注意的架构选择，因为 Oishii
              并不是把机器人当作静态植物旁边的外挂助手；它是在让植物穿过受控工位，让蜜蜂、人和机器人共享同一个空间。公司还配有内部育苗实验室和专利组合，覆盖授粉控制、昼夜输送架构、灌溉工位和机器人采摘系统。技术栈看起来也在加深，而不只是横向变宽。AgFunder
              报道称，Oishii 在加入 Tortuga 的采摘 IP、AI 模型、定制硬件和工程团队之前，已经自建内部自动化；MISUMI 现在通过 Fictiv 供应组件，并共同开发农业自动化组件。这些拼在一起，让
              Oishii 更像工业系统集成商，而不是外挂一座温室的高端生鲜品牌。
