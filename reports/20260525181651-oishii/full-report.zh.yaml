      - number: '8.4'
        title: 最终判断取决于非公开尽调，而不是又一条融资新闻
        blocks:
          - type: paragraph
            body: >-
              剩下的工作概念上很简单，却足以决定结论。第一，管理层必须打开当前轮次条款，让投资人看清 2025-2026
              资本堆叠对应的准确估值、股数、稀释和优先权层级。第二，公司必须提供董事会级别的桥接表，把高端货架价格一路连到实际收入、毛利率、腐损和烧钱速度。第三，Oishii
              需要证明，更广的零售触达带来的是复购需求，而不只是猎奇尝鲜。拿到这些答案，结论才可能从继续研究推向观察或有条件买入。投资逻辑会在几种情况下破裂：股权结构表里的高级权利比暗示更多；门店层面动销无法证明高端货架空间合理；或者救援式融资语言开始出现。公开市场证据也表明，最站得住的退出路径是私下出售给战略方或财务买家，而不是近期上市。在非公开尽调补上这些缺口前，正确姿态是先看下行，带着价格纪律接触，并随时准备走开。
