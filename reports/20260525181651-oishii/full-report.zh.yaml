      - number: '2.2'
        title: 买方分层、需求驱动和采纳路径
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方逻辑是分层的。零售品类经理关心高端差异化、损耗和货架故事；厨师关心风味、稳定性和菜单戏剧性；高端生鲜电商关心可发现性和加购；大众商超买手则更看重每盒价格和周转速度。Oishii
              迄今的证据更偏向前三类。Whole Foods 上架报道、当前生鲜电商商品页和消费者测评来源，都指向一个能吸引注意并促成试用的产品。2026 年 4 月包装刷新和 $4.99
              入门价很重要，因为它们把漏斗顶端从奢侈礼赠扩到“可负担高端”试用。不过购买旅程大概率仍是多步：消费者先因品牌或社交证明注意到产品，再因风味或礼赠理由为更高价格找依据，最后决定是否值得复购。零售商的采纳路径也类似：好奇心和差异化打开大门，但复购动销和毛利决定产品能否成为长期陈列。因此，Oishii
              的市场机会真实存在，但路径依赖很强。需求已经存在，公司还必须不断扩大高端草莓“值得买”的消费场景。
