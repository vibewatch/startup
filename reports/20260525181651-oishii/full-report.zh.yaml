      - number: '3.3'
        title: 渠道权力、既有种植者压力与为什么货架经济模型重要
        blocks:
          - type: paragraph
            body: >-
              Oishii 的公开牵引力，在买家能用风味、新奇感和礼赠吸引力来合理化溢价的场景中最强。这个策略上讲得通，但也意味着公司所在渠道里，买手能很快把它与传统高端浆果、进口浆果和其他品牌化生鲜对比。California
              Strawberry Commission 和 Florida Strawberry Growers 数据显示，既有田间供给仍然庞大、季节上灵活，并且零售商很熟悉。这一点重要，因为 Oishii
              不是在填补空货架；它是在一个已经有数十亿美元销售额、包装规格广泛增长的品类里，要求买家给高端浆果留出空间。相邻 CEA 和温室运营商也从另一个角度强调同一点：即使不共享 Oishii
              的草莓命题，也能搭建零售门店触达和生鲜买手熟悉度。结果是，Oishii 的优势更少来自独占性，更多取决于风味能否反复证明自己值得货架空间和利润率。
