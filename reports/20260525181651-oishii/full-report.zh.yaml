      - number: '1.3'
        title: 融资历史、战略股东和里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Oishii 的融资历史显示，哪怕 2023-2025 年垂直农场行业大洗牌，投资人信心仍在延续。AgFunder 报道，2024 年公司完成 $134 million Series B，由 NTT
              领投，日本战略和财务投资人参投。2026 年 5 月，Oishii 宣布完成由 SPARX Asset Management 领投的 $150 million Series C 首次交割，Nomura Real
              Estate Development、MISUMI Group、Mizuho Bank 等参与。官方和转载的轮次报道反复称，最新融资使公司自创立以来累计融资约 $370
              million。私有数据库口径略有差异：CB Insights 显示公司 11 轮融资共 $380.58 million，最新 Series C 为 $121.38
              million。这更像是债务、补助或报道时点差异，而不是对公司公开总额的直接矛盾。公开来源没有给出稳固的估值锚。2026 年 5
              月官方融资公告未披露投后估值，提到融资的数据服务也没有公开可由读者从文件中独立核验的数字。因此，后续估值工作应把资本基础视为已验证，把股权结构质量视为较强，把当前估值视为尚未解决的尽调点，而不是既定事实。
