      - number: '1.4'
        title: 里程碑、行业逆风和剩余未知
        blocks:
          - type: paragraph
            body: >-
              Oishii 公司概况里最核心的正面信息，是它似乎找到了一个比已崩盘叶菜类垂直农场更有防守性的切口。官方和行业来源显示，公司从高端厨师需求起步，到 2022 年进入 Whole
              Foods，再到更广泛零售分销、2026 年产品形态扩张、机器人合作和新一轮机构融资。核心负面信息也很明确：公开证据仍更多落在品牌、产品质量和融资上，而不是已披露的经济模型。Bowery 的 Georgia
              清算、AeroFarms 的破产案、Plenty 的 Chapter 11 重组都提醒读者，在可控环境农业里，资本可得性和技术新意本身并不够。Bustle 的消费者测评也从需求侧给出更温和的风险版本：Oishii
              的浆果受人欣赏，但常被当作偶尔消费的奢侈品，而不是日常主食。Oishii
              选择高端浆果而非大宗生菜，或许值得肯定；但公司概况还无法闭环已实现需求韧性、员工数纪律或估值支撑。这些仍是后续财务、风险和估值章节最重要的未解输入。
