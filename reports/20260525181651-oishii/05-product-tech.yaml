- id: smart-farm-operating-architecture
  title: Smart Farm Operating Model, Bee Pollination, and Automation Stack
  body: The technical core of Oishii is a controlled-environment farming system that combines biological processes with factory-style automation. Official farm materials describe a system that recreates air, rain, heat, light, nourishment, and natural bee pollination indoors; outside reporting adds important operating detail on how the system actually moves. Forbes describes the Amatelas farm as using 250 moving racks with eight growing levels that cycle through day and night conditions, while Oishii's own pages describe robots and other machines monitoring temperature, humidity, CO2, windspeed, and light. This is a notable architectural choice because Oishii is not presenting robotics as a bolt-on helper around static plants; it is moving plants through controlled stations so bees, humans, and robots can share one footprint. The company complements that with an in-house propagation lab and a patent estate that now covers pollination control, day/night conveyor architecture, irrigation stations,
    and robotic harvesting systems. The technical stack also appears to be getting deeper rather than merely broader. AgFunder reports that Oishii had already built in-house automation before adding Tortuga's harvesting IP, AI models, custom hardware, and engineering team, while MISUMI now supplies components through Fictiv and is jointly developing agricultural-automation components. Together, those pieces make Oishii look more like an industrial system integrator than a premium produce brand with a greenhouse attached.
