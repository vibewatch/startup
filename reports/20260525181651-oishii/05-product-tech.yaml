chapter:
  number: 5
  title: Product & Technology
  summary: Oishii's product-tech story is a vertically integrated Smart Farm system rather than a single premium berry SKU. Public evidence is strongest on the operating architecture—bee pollination inside a controlled environment, moving-rack farm design, machine-vision robotics, component partnerships, and 2025-2026 SKU expansion—but still thin on auditable software artifacts, formal food-safety telemetry, and independently verified automation economics.
sections:
- id: product-definition-and-portfolio
  title: Product Definition, SKU Strategy, and Customer Workflow
  body: 'Oishii is no longer just selling one luxury strawberry tray. The public product surface now looks like a portfolio strategy built around three berry varietals, multiple pack sizes, grade tiers, and a new preserves extension that broadens the brand beyond fresh fruit. Official and republished 2026 materials show the company using Premium and Reserve grades to map different jobs-to-be-done: Omakase remains the signature special-occasion berry, Koyo is pushed toward everyday premium snacking, and Nikko is positioned for cooking, baking, and higher-frequency use through larger stay-fresh packs. That matters because the product definition is increasingly a repeatable consumer system—varietal plus format plus packaging plus channel—rather than a single chef-loved novelty SKU. The preserves line goes one step further by turning berry equity into pantry products, which can smooth seasonality in usage occasions and create a higher-margin extension without abandoning the premium brand. Oishii''s
    own store locator and Nosh''s 2026 coverage also show that this portfolio is being deployed through a live retail availability surface and more than 300 retail doors, so the product is already operating in mainstream retail workflows rather than remaining an artisanal direct-sales experiment.'
