    - No public velocity data by retailer or region
  - - Nikko Berry
    - Household cooking, baking, and snacking user
    - Newer scaled SKU; launched 2025 with March 2026 packaging refresh
    - Top-seal freshness pack and larger-format everyday use case
    - Public freshness telemetry is limited to company and trade claims
  - - Premium Preserves line
    - Pantry shopper, gifting buyer
    - New line extension in 2026
    - Uses berry brand equity in small-batch shelf-stable formats
    - Unknown gross margin and reorder behavior versus fresh fruit
  - - Amatelas Smart Farm platform
    - Internal production system
    - Production-scale and operating in New Jersey
    - Bee pollination, moving racks, robotics, solar adjacency, water recycling
    - Unit economics and throughput by farm unit remain private
  - - Tokyo Open Innovation Center / turnkey program
    - Internal R&D and future replication partners
    - In development
    - Focuses on factory automation, AI environmental control, and packaged deployment
    - No public build timeline, capex budget, or deployment SLA
  notes: Mixes shipped consumer SKUs with the internal production platform and the replication program because Oishii's product surface depends on both the berries and the Smart Farm system behind them.
