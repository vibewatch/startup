company:
  name: o9 Solutions
chapter:
  number: 1
  title: Company Overview
  summary: >-
    o9 Solutions is an enterprise-planning software company founded by Sanjiv Sidhu and
    Chakri Gottemukkala; the latest valuation supported by the assigned evidence is
    $3.7 billion from July 2023, while current revenue, ARR, customer count, headcount,
    ownership, and audited financials remain unverified.

sections:
  - id: identity-and-business
    title: Identity, Founders, and Business Model
    body: >-
      o9 describes the Digital Brain as a platform connecting planning, forecasting, and
      execution across enterprise functions, while its homepage identifies an Enterprise
      Knowledge Graph as a differentiating architectural element. The official company
      history names Sanjiv Sidhu and Chakri Gottemukkala as co-founders with prior experience
      delivering supply-chain planning solutions. Owler reports a 2009 founding date and
      identifies Chakri Gottemukkala as chief executive, but those particulars are
      third-party profile data rather than a dated corporate filing. Dallas datelines on
      company announcements and Owler's description of a Texas-based business support a
      Dallas/Texas operating identity, not a verified legal headquarters address. The
      available pages support an enterprise-software platform model; they do not establish
      pricing, contract duration, services mix, or the legal entity structure.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
    tableRefs:
      - TO001
    figureRefs: []

  - id: capital-and-governance
    title: Capitalization and Governance Signals
    body: >-
      The strongest capitalization anchor in the assigned evidence is o9's July 2023
      announcement of a $116 million investment by existing investors led by General
      Atlantic's BeyondNetZero, with KKR and Generation Investment Management also
      participating. The same announcement placed the transaction valuation at $3.7
      billion, compared with $2.7 billion at the January 2022 investment round. These are
      transaction disclosures, not a current 2026 market value, and capital raised should
      not be read as cash available. Owler displays a $536 million funding estimate, but
      the assigned sources do not reconcile that estimate to primary round documents.
      Governance evidence is similarly event-based: Gary Reiner joined the board in July
      2023, and o9 announced Gabe Cortes as chief financial officer in April 2026. A current
      board roster, ownership percentages, voting rights, preference stack, debt, and
      secondary transactions remain private-evidence diligence items.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO016
    tableRefs:
      - TO002
      - TO003
    figureRefs: []

  - id: disclosed-scale-and-momentum
    title: Disclosed Scale and Operating Momentum
    body: >-
      Historical company disclosures show operating expansion but do not reveal current
      absolute recurring revenue. The January 2023 release said ARR added in 2022 grew more
      than 84% year over year; that metric is growth in added ARR, not growth in total ARR
      and not accounting revenue. The same release reported 74 go-lives during 2022 and a
      worldwide talent pool above 2,400. In April 2026, o9 reported record booking growth
      for the first quarter without disclosing the booking amount or an ARR bridge. Owler's
      undated public profile shows an estimated annual-revenue range of $100 million to
      $500 million, too broad and insufficiently sourced to substitute for audited revenue.
      Futurum reported in 2024 that o9 had attained AWS Advanced Tier partner status, which
      supports ecosystem reach but does not independently verify company financial scale.
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs: []
    figureRefs:
      - FO001

  - id: diligence-interpretation
    title: Diligence Interpretation and Evidence Limits
    body: >-
      This evidence set is weighted toward company-controlled material. The Business Wire
      page is a syndicated o9 release, so its hosting domain does not make the operating
      metrics independent. Futurum is the issuer of its AWS analysis, but its disclosure
      says the firm has provided services to technology companies including those
      discussed, leaving the relationship insufficiently clear for an independence claim.
      Owler is independent of o9, yet its estimate ranges are not audited evidence and are
      best treated as an adverse transparency signal rather than precise scale. The assigned
      adverse search returned no retained result URL; that does not establish the absence of
      lawsuits, outages, breaches, leadership churn, or other incidents. Investment diligence
      should therefore obtain audited financials, a current cap table and board list,
      customer and retention schedules, current headcount records, and legal or regulatory
      representations before treating the snapshot as current ground truth.
    claimRefs:
      - CO010
      - CO013
      - CO015
      - CO016
    tableRefs: []
    figureRefs: []

