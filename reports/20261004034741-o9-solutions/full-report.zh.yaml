      - number: '2.3'
        title: 买方画像、预算归属与采纳经济学
        blocks:
          - type: paragraph
            body: >-
              企业采购 o9 Digital Brain
              平台通常依赖业务执行层与高管层多方共识。核心出资人主要是掌握企业数字化转型及运营资本预算的首席供应链官（CSCO）、首席运营官（COO）以及集成计划副总裁。最终用户则涵盖一线需求计划员、供应链分析师、库存计划员及商业品类经理，其核心诉求是摆脱割裂电子表格与部门脱节计划带来的繁琐手工对账。


              触发采购决策的诱因通常包括严重的供应链中断事件、过低的基础预测准确率、高昂的库存持有成本，或是需要多工厂协同的监管与商业扩张。企业采纳遵循分步落地路径：先进行试点范围界定与数据接入，再与核心交易型 ERP（如
              SAP S/4HANA 或 Oracle）打通，随后按区域或产品线分阶段上线。仅在 2026 年上半年，o9 就完成了覆盖北美、欧洲及亚太地区的 80 多起部署，印证了其在离散制造和流程工业领域的持续扩张。
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
