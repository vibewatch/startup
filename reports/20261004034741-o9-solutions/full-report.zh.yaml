        title: 资本化与治理信号
        blocks:
          - type: paragraph
            body: >-
              既有证据中最明确的资本化依据，是 o9 在 2023 年 7 月宣布获得的 $116 million 融资。该轮由老股东 General Atlantic 旗下的 BeyondNetZero 领投，KKR 与
              Generation Investment Management 跟投。该公告将交易估值定为 $3.7 billion，高于 2022 年 1 月投资轮次的 $2.7
              billion。上述数字仅为单笔交易披露，并非 2026 年最新市场公允价值，且累计融资额不可等同于当前可用现金。Owler 显示其融资总额估计为 $536
              million，但既有材料无法将该预估值与一手融资文件核对对应。公司治理方面的证据同样基于偶发事件：Gary Reiner 于 2023 年 7 月加入董事会，o9 随后于 2026 年 4 月宣布 Gabe
              Cortes 出任首席财务官。最新的董事会完整名册、持股比例、投票权归属、优先股堆叠、负债状况及老股交易记录，依然属于需要私有数据室核验的尽调事项。
