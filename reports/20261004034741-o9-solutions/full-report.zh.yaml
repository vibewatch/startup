      - number: '6.4'
        title: 留存稳定性、客群集中度与尽调核心关切
        blocks:
          - type: paragraph
            body: >
              评估 o9 客户基本盘时最核心的软肋，在于其从未对外公开任何留存率、客户流失率或账户集中度数据。尽管 o9 宣称实现了连续 28 个季度的 ARR
              增长，并在消费品、零售与电信板块持续斩获老客增购，但从未披露经审计的净留存率（NRR）、总留存率（GRR）或客户流失数（Logo Churn）统计。


              企业级供应链计划合同通常锁定 3 至 5 年的长期服务期，一旦客户将 ERP、MES 及仓储管理系统深度接入 o9 Digital
              Brain，就会形成极高的结构性切换壁垒。然而，这种深度架构绑定也意味着，即便客户在复杂的部署阶段心存不满，往往也表现为项目停滞或高成本补救，而非立刻直接流失，从而掩盖了潜在的续约阻力。


              此外，头部大客户的收入集中度仍是未解的尽调风险。鉴于 o9
              服务的都是数十亿美元体量的跨国巨头，平台年化合同金额（ACV）动辄数百万美元，一旦两三家标杆客户流失或发生并购整合，将对收入的可预测性造成不成比例的剧烈冲击。严谨核查分批次续约率、存量客户净增购速度以及前 10
              大客户收入集中度，对潜在投资者而言不可或缺。
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 顶级供应链同行中罕见的权威背书
            body: >-
              o9 Solutions 在 2025 年 Gartner Peer Insights“客户之声”报告中斩获独家背书，成为供应链计划解决方案领域唯一入选“客户选择”（Customers'
              Choice）的软件厂商，在企业用户中斩获 4.8 分（满分 5 分）的平均评分与 94% 的推荐率。
            calloutType: strength
            claimRefs:
              - CU009
          - type: callout
            title: 主数据基础薄弱与总体拥有成本失控
            body: >-
              RFP.wiki 的独立采购情报指出，o9 部署经常受到批评，问题集中在层级化数据接入限制与系统偶发故障。一旦叠加大规模算力优化模块带来的潜在隐性账单以及漫长的系统集成服务，总体拥有成本可能会大幅超出最初的
              SaaS 软件预算预期。
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 合规、法律纠纷与知识产权风险暴露
        blocks:
          - type: paragraph
            body: >
              企业级供应链计划软件处于企业 IT 基础架构的核心枢纽，直接面临重大的法律、知识产权与合规风险。对 o9 Solutions 而言，最突出的未决法律隐患，当属传统企业计划巨头 SAP
              在美国德克萨斯北区联邦地区法院提起的侵犯商业秘密诉讼。该诉讼指控关键技术人员从 SAP 跳槽至 o9
              后，未经授权擅自使用并转移专有供应链计划方法论、商业秘密及技术专长。由于企业计划算法、图数据模型与集成业务计划逻辑构成了支撑 o9 Digital Brain
              平台的核心知识产权，任何不利判决、临时禁令或巨额和解金，都将对公司的估值、资产负债表及客户采购信心构成严重威胁。


              与此同时，现代跨国多级供应链计划平台面临跨国界加速收紧的合规监管要求。o9
              在其发布的供应商风险管理研究中明确指出，若未能遵循欧盟《企业可持续发展报告指令》（CSRD）及美国《防止强迫维吾尔人劳动法》（UFLPA），企业买方将承担直接的法律责任。随着全球大型企业日益依赖 o9 平台与
              Control Tower 来追踪 1 至 3 级供应商合规、环境指标及劳工来源合规性，o9 数据校验管道若未能筛查出违规供应商，将直接给客户带来下游法律与品牌声誉损失。此外，跨北美、欧洲和亚太的跨国业务部署让
              o9 必须严格遵守数据主权与隐私法规（包括欧洲 GDPR），其多租户云架构必须执行严密的数据隔离与本地化治理要求。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营复杂度、交付瓶颈与软件可靠性
        blocks:
          - type: paragraph
            body: >
              o9 Solutions 商业模式中最主要的运营软肋，在于企业级供应链软件上线部署本身固有的极端复杂性、漫长周期以及技术摩擦。RFP.wiki 的独立采购分析显示，多模块计划系统上线普遍耗时 12 至 24
              个月，总体拥有成本（TCO）的大头是专业服务、系统集成、数据工程和组织变革管理，而非单纯的软件授权费。Gartner Peer Insights 收集的用户评价（158 条评价中保持 4.8 / 5.0
              的高分）反复强调，尽管系统磨合稳定后 o9 能提供可靠的伙伴支持与灵活的建模能力，但能否顺利采纳，与严密的实施边界把控、内部数据就绪度以及经验丰富的专职运维团队深度绑定。


              第三方评测记录的具体操作痛点包括：层级化数据接入限制、系统偶发故障、页面可见行数受限，以及在筛选复杂多属性计划视图时的界面卡顿。上游数据质量是至关重要的前提条件；主数据不一致或底层 ERP 数据缺陷，会直接拉低
              AI 预测质量与情景模拟精度。为减轻人工预测失误与归因偏差，o9 推出了
              APEX（敏捷、自适应、自主）运行模型与赛后复盘分析（PGA），系统性追踪人工干预和计划偏差的根本原因。然而，配置并跑通这些前沿的决策复盘与图分析工作流需要极度稀缺的技术专才。从需求计划解决方案架构师等职位的官方招聘要求来看，o9
              明确要求至少 7 年的企业实施经验，并拥有运筹学或工程学硕士学位，这印证了其在扩张合格专业服务团队时面临着持续的运营瓶颈。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
