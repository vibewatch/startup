  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Digital Brain 架构与 Enterprise Knowledge Graph
        blocks:
          - type: paragraph
            body: >-
              o9 Solutions 围绕其核心产品 o9 Digital Brain 平台构建方案，这是一个企业级云原生计划环境，架构上架设于传统核心业务系统之上，而非替换底层的交易型 ERP 数据库。Digital
              Brain 的架构中枢是 Enterprise Knowledge
              Graph（EKG，企业知识图谱），通过将产品、客户节点、生产基地、物料清单（BOM）依赖关系与外部市场信号映射为统一的数字孪生模型，对企业多级价值链进行精准建模。与图模型配套的是 o9 自研的
              GraphCube
              数据层，这套专有多维计算引擎专为处理供应链与商业计划中的复杂聚合、拆解以及跨周期假设情景模拟而设计。第三方独立架构审查证实，这套统一建模底座在差异极大的各类计划场景间建立了高度一致的架构协同，明显优于靠松散并购拼凑而成的老旧传统软件套件。不过，外部评估同样指出，o9
              本质上是一套重型、极度依赖配置的系统，在企业落地初期需要大量的定制建模、数据管道工程搭建与系统集成开销。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
