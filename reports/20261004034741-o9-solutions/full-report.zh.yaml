      - number: '2.2'
        title: 市场测算视角与受限的 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              评估 o9 Solutions
              的市场空间，需要区分分析机构自上而下的宽泛口径与企业自下而上的实际预算。第三方调研机构将全行业各层级企业的供应链管理软件支出汇总，得出数百亿美元的全球庞大预测。然而，从证据链来看，o9 Solutions
              仅切入其中一个特定子集：面向消费品、零售、电子制造服务、汽车及重型装备等 30 多个垂直行业中，管理着复杂多级供应网络、多工厂制造基地以及庞杂物料清单（BOM）架构的跨国集团。


              其可服务市场（SAM）受限于年营收超过 $1 billion、具备足够交易数据成熟度以支撑多年期企业数字化转型的 Fortune 500
              级及同等规模跨国企业。可获取市场（SOM）则进一步受到企业年度采购周期、传统核心系统（如 SAP IBP 和 Oracle Fusion
              SCM）的高切换壁垒，以及具备图模型交付能力的专业实施顾问稀缺性的制约。由于公开披露仅选择性公布订单签约动态，而非经审计的全市场 ARR，完整的 TAM/SAM/SOM 测算仍属于需要持续核实的尽调分析缺口。
            claimRefs:
              - CM002
