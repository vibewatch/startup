      - number: '1.4'
        title: 尽调研判与证据边界
        blocks:
          - type: paragraph
            body: >-
              现有证据明显偏向公司自主掌控的信息。Business Wire 页面属于 o9 统一分发的新闻稿，外部发布渠道并不能赋予经营指标独立性。Futurum 虽为自身 AWS
              分析报告的发布方，但其合规声明提及曾为文中所述科技公司提供商业服务，两者的利益关联导致其难以被视作完全独立的第三方。Owler 虽独立于
              o9，但其估算区间未经审计，更宜视作透明度不足的反向警示信号，而非精准的规模衡量。本次针对反向信息的检索未保留有效结果链接，但这绝不意味着不存在诉讼、系统宕机、数据泄露、高管动荡或其他负面事件。在将当前研判结论视作事实前，投资尽调必须调取经审计财务报表、最新股权结构表与董事会名录、客户明细与留存排期表、实际员工名册，以及法律与监管层面的书面陈述保证。
            claimRefs:
