      - number: '5.2'
        title: 计划功能模块与业务工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              o9 平台通过模块化应用套件，全面覆盖企业运营、战术与商业计划领域。在运营级供应链管理中，o9 提供需求计划与感知（Demand Planning and
              Sensing）模块，借助机器学习算法综合分析历史消耗、促销活动、季节性规律与外部需求驱动变量，同时支持实时的人工共识调整。供应链计划与分析（Supply Chain Planning and
              Analytics）模块则在需求目标与多级物料可用性、产能瓶颈、生产排程及库存策略之间寻找最优平衡。针对上游协同，系统通过供应商关系管理（SRM）与集成式供应链控制塔（Supply Chain Control
              Tower）提供支撑，持续感知异常、评估解决方案并协同供应商响应。除核心物流计划外，o9 还将能力版图拓展至商业促销定价与产品组合优化的收入增长管理（RGM），以及可计算多级供应商风险指标与 Scope 3
              碳排放数据的嵌入式 ESG 与可持续发展套件。尽管广泛的功能覆盖助力全球跨国集团归并计划工作流，但第三方技术分析指出，该平台在对外公开的技术宣贯中更重管理视角的业务编排，未充分披露明确的底层数学公式与求解模型。
