      - number: '6.3'
        title: 标杆客户实证、满意度信号与交付权衡
        blocks:
          - type: paragraph
            body: >
              独立同行反馈与第三方评测证实，在一线投产的企业计划员群体中，o9 赢得了极高的满意度评价，但同时也暴露出反复出现的落地实施阻碍。2025 年 10 月，在 2025 年度 Gartner Peer
              Insights 供应链计划解决方案“客户之声”报告中，o9 成为唯一入选“客户选择”（Customers' Choice）象限的软件厂商，基于 54 份企业用户评价斩获 4.8 分（满分 5
              分）的综合得分，企业用户推荐意愿高达 94%。


              第三方采购对标平台 RFP.wiki 的评测印证了这一口碑，在客户满意度（CSAT）与净推荐值（NPS）上给 o9 打出 4.5 分（满分 5 分），同时其功能广度与深度获评 4.6 分（满分 5
              分），情景建模与假设分析获评 4.5 分（满分 5 分）。来自电信、医疗/生物科技及制造行业的企业一线人员称赞 o9 能够理解复杂的供应链网络拓扑、运行假设模拟、优化库存网络并提升交付履约水平。


              不过，采购评估报告与用户评价同样指出了持续存在的落地摩擦。RFP.wiki
              采购纪要警示称，频繁出现的负面评价集中在层级化数据接入限制以及系统偶发故障。企业买方还面临诸多落地风险：主数据不一致拉低计划精准度、系统集成时序拖延整体上线切换进度，以及大规模优化运算产生的高额额外算力账单，致使总体拥有成本大幅超出基础
              SaaS 订阅协议的初始预算。
