  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场细分
        blocks:
          - type: paragraph
            body: >-
              围绕 o9 Solutions 的竞争格局主要分为三大阵营：传统 ERP 巨头、垂直细分供应链计划平台，以及新一代偏向执行层的单点方案。以 SAP IBP 和 Blue Yonder
              为代表的传统巨头提供深度嵌入现有 ERP 交易架构的全面供应链套件，但往往受制于数十年历史的代码包袱与拼凑并购带来的应用割裂。在专注集成业务计划（IBP）和并发供应链计划领域，Kinaxis
              RapidResponse 是 o9 最核心的直接竞品，双方在全球 Fortune 500 制造业、消费品及工业企业项目中展开正面争夺。在更下游的专业零售与生鲜杂货预测领域，RELEX Solutions
              专注于本地化需求驱动的自动补货与品类管理。与此同时，Nauta 等新兴自主智能体平台主打运营执行与异常分流，摒弃了繁重的数据工程门槛，与 o9 依赖重度分析师建模的路线形成鲜明区隔，主打中端市场客户。
            claimRefs:
              - CP001
              - CP002
