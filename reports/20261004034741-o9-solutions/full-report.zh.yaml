            - label: 文档门户宕机
              tone: low
            - label: 外部基准测试方法论争议
              tone: low
            - label: 次要零部件采购瓶颈
              tone: medium
            - label: 系统性云区域基础设施瘫痪
              tone: high
            - label: 平台全面禁令与资产冻结
              tone: critical
    approximationNotes: 发生概率与严重度分级系定性评估，综合自法庭记录、采购基准评级以及客户评价。
