  - id: FE001
    title: o9 Digital Brain 分层系统架构
    type: stack
    summary: 从用户界面延伸到底层多云基础设施的 o9 软件与运营分层架构图。
    data:
      layers:
        - label: 用户交互与应用层
          detail: 基于角色的规划界面、移动端应用、IBPL 查询接口以及预置模块工作区。
        - label: 认知决策与智能体层（APEX）
          detail: 神经符号 AI、复合智能体、异常管理工作流及自动化方差归因分析。
        - label: 计算引擎层（GraphCube）
          detail: 多维内存立方体计算、多情景模拟、数据聚合与下钻分解引擎。
        - label: 企业建模层（Enterprise Knowledge Graph）
          detail: 对企业节点、供应链梯队、业务约束及关联依赖进行建模的数字孪生图数据库。
        - label: 集成、数据接入与共存层
          detail: 双向 API、ETL 服务、数据湖连接器（Snowflake/BigQuery）与 ERP 集成管线。
        - label: 云基础设施与多租户底座
          detail: 跨 Microsoft Azure、AWS 和 GCP 的超大规模云底座，配备企业级安全控制。
    claimRefs:
      - CE001
      - CE002
      - CE009
      - CE014
  - id: FU001
    title: 企业客户全旅程与平台扩张架构
    type: journey-map
    summary: 展示企业客户采用 o9 Solutions 的典型全生命周期，涵盖初始云采购、多阶段部署与跨职能 APEX 平台扩张。
    data:
      items:
        - label: 采购与范围界定
          stage: 采购与范围界定
          actor: 供应链副总裁 / 采购委员会
          touchpoints:
            - RFP 评估优先考察基于约束的场景建模能力
            - 采用 AWS Marketplace 专属要约采购，撬动 ISV 资金支持
            - 引入系统集成商界定变革管理范围
          sentiment: positive
        - label: 集成与初次上线
          stage: 集成与初次上线
          actor: 企业计划团队与 IT 架构师
          touchpoints:
            - 主数据治理拉齐与企业知识图谱建模
            - 解决层级驱动的数据摄取约束与传统 ERP 数据对接
            - 初步部署需求感知或供应计划模块
          sentiment: neutral
        - label: 日常业务采用
          stage: 日常业务采用
          actor: 供应链计划员与 S&OP 负责人
          touchpoints:
            - 计划员常态化运行 what-if 假设场景比对
            - 跨区域、跨职能协同开展 S&OP 计划对齐
            - 参与 Gartner Peer Insights 评分，录得 94% 推荐率
          sentiment: positive
        - label: 复盘分析与治理
          stage: 复盘分析与治理
          actor: 计划卓越中心 / S&OP 负责人
          touchpoints:
            - 持续跟踪计划与实际偏差，复盘排查根本原因
            - 细化运营策略并校准约束模型
            - 压缩跨区域计划周期，落实异常治理
          sentiment: positive
        - label: APEX 与多领域扩张
          stage: APEX 与多领域扩张
          actor: 管理高层与业务单元负责人
          touchpoints:
            - 拓展至财务 IBP、品类管理与采购领域
            - 引入神经符号 AI 智能体，复盘分析计划与实际偏差
            - 签署长期订阅续约，扩展多级库存网络
          sentiment: positive
        - label: 全企业规模化与生态编排
          stage: 全企业规模化与生态编排
          actor: 首席供应链官与执行委员会
          touchpoints:
            - 多级供应商协同与联合库存缓冲
            - 实行无边界运营模式，拉通商业与运营 P&L
            - 面向全企业向 30 多个垂直行业扩张
          sentiment: positive
    approximationNotes: 基于采购 RFP 指南、AWS 迁移方案蓝图与同行评审访谈记录综合整理，定性刻画企业客户各阶段采用路径。
    claimRefs:
      - CU002
      - CU006
      - CU009
      - CU011
  - id: FR001
    title: 企业风险评估矩阵
    type: matrix
    summary: 直观呈现已识别企业风险在影响严重度与发生概率两个维度的分布。
    data:
      columns:
        - 可忽略影响
        - 轻微影响
        - 中等影响
        - 显著影响
        - 重大影响
        - 灾难性影响
      rows:
        - label: 几乎必然
          values:
            - label: UI 筛选器缓存延迟
              tone: low
            - label: 视图导航轻微延迟
              tone: low
            - label: 偶发即席报表格式瑕疵
              tone: low
            - label: 上游 ERP 数据清洗整治
              tone: medium
            - label: 专业服务占比高推升 TCO
              tone: high
            - label: 复杂多级供应商中断事件
              tone: critical
        - label: 很可能
          values:
            - label: 本地化语言标签例行调整
              tone: low
            - label: 维护窗口周期性调整
              tone: low
            - label: 偶发工具轻微功能故障
              tone: low
            - label: 层级驱动的数据接入瓶颈
              tone: medium
            - label: 跨季度实施进度延期
              tone: high
            - label: 二级供应商供应链中断
              tone: critical
        - label: 可能
          values:
            - label: 标准沙箱刷新延迟
              tone: low
            - label: 计划员面对 UI 存在上手门槛
              tone: low
            - label: 旺季求解器容量调优
              tone: medium
            - label: 专业方案架构师人才短缺
              tone: medium
            - label: 多司法管辖区监管尽调（CSRD/UFLPA）
              tone: high
            - label: 涉 SAP 商业秘密侵权未决诉讼
              tone: critical
        - label: 不太可能
          values:
            - label: API 网关临时限流
              tone: low
            - label: 区域服务器故障转移轻微异常
              tone: low
            - label: 升级期间老旧适配器不兼容
              tone: medium
            - label: GSI 合作伙伴资源分配瓶颈
              tone: medium
            - label: 超大规模公有云基础设施宕机
              tone: high
            - label: 大型企业客户重大项目终止
              tone: critical
        - label: 罕见
          values:
            - label: 冗余备份同步延迟
              tone: low
            - label: 个别测试租户配置错误
              tone: low
            - label: 非关键网络路由抖动
              tone: low
            - label: 客户对租户数据隔离审计的顾虑
