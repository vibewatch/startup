      - number: '6.2'
        title: 采纳轨迹、上线速度与上云迁移
        blocks:
          - type: paragraph
            body: >
              o9 Solutions 在 2025 年及 2026 年上半年展现出持续的系统交付速度与获客动能，连续多个季度录得年度经常性收入增长。公司通报 2025 年完成了 130
              多次成功上线，涉及需求与供应计划、主生产计划、采购分析以及零售品类管理工作流。这一势头延续至 2026 年，o9 宣布第一季度订单签约额创下历史新高，仅在 2026 年第二季度就完成 40 多次上线，使 2026
              年上半年在北美、欧洲及亚太地区的部署总数突破 80 起。


              加速企业采纳的关键抓手，在于 o9 与超大规模云厂商（特别是 Amazon Web Services）持续深化的战略同盟。作为 AWS Advanced Tier 合作伙伴及 AWS
              供应链能力认证的首批发起伙伴，o9 借助 AWS ISV 工作负载迁移计划获得资金补贴，推动客户将传统本地部署的老旧计划软件迁移至云端 SaaS。此外，入驻 AWS Marketplace
              简化了企业预算采购流程，允许企业买方直接抵扣此前承诺的云资源消费额度。


              其商业拓展还得益于 Columbus Consulting International
              等系统集成咨询伙伴的支持，协助消费品与零售客户推进全渠道统一商业转型与组织变革。尽管披露的上线频率颇具规模，但关于计划员日常活跃度、席位授权使用率以及全面投产周期等具体指标，在官方通报中依然语焉不详。
