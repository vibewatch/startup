  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群体细分与目标企业画像
        blocks:
          - type: paragraph
            body: >
              o9 Solutions 的大客户获客策略聚焦于 30
              多个垂直行业中规模庞大、业务复杂的跨国集团，重点渗透零售、快速消费品（CPG）、汽车、工业装备、电信及医药领域。核心采购方多为首席供应链官、首席运营官及首席财务官，希望通过集成业务计划（IBP）与产销协同计划（S&OP），淘汰各自分立的老旧
              ERP 计划烟囱和割裂的手工电子表格。


              大客户分层主要依据业务复杂度与计划跨度，而非单纯的员工规模。拥有跨国多级供应链的全球顶级企业引入
              o9，以实现端到端同步计划、需求感知及真实产能约束下的供应分配。该平台已在众多知名头部品牌实际投产上线，包括荷美尔食品（Hormel
              Foods）、泰利福（Teleflex）、始祖鸟（Arc'teryx）以及冠捷科技（TPV Technology Limited），横跨离散制造、食品饮料流程工业、服饰鞋帽及特种医疗器械供应链。


              采购通常以签署多年期订阅协议为基础，多依托超大规模云厂商基础设施交付，借助 AWS Marketplace 与 AWS ISV 工作负载迁移计划推进。尽管 o9
              锁定了具备复杂网络拓扑的数十亿美元级全球跨国巨头，但这一客群定位也让销售流程面临采购决策周期漫长、定制化组织变革阵痛期长，以及重度依赖系统集成咨询伙伴等问题。
            claimRefs:
              - CU001
