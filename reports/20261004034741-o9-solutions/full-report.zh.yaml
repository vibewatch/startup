            body: >-
              o9 将 Digital Brain 描述为连接企业各部门计划、预测与执行的平台，并在官网上将 Enterprise Knowledge Graph 列为核心差异化架构。公司官方历史显示，Sanjiv Sidhu
              与 Chakri Gottemukkala 为联合创始人，此前均有交付供应链计划解决方案的经验。第三方数据平台 Owler 称公司成立于 2009 年，并由 Chakri Gottemukkala
              担任首席执行官，但上述信息仅来自第三方档案，并非带日期的正式企业登记文件。公司公告所带的达拉斯电头以及 Owler
              对其德州企业的描述，仅能印证其达拉斯/德克萨斯州的实际运营身份，并非经核实的法定总部注册地址。现有公开页面能够证实其属于企业软件平台模式，但并未载明定价机制、合同期限、专业服务占比或法人实体架构。
