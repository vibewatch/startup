            body: >-
              公司历史披露显示其业务持续扩张，但未公布当前的绝对经常性收入。2023 年 1 月的新闻稿称，2022 年新增 ARR 同比增长超过 84%；该指标衡量的是新增 ARR 的增速，既非 ARR
              总额增速，亦非会计口径营业收入。该通报同时披露 2022 年完成 74 次上线，全球员工规模超过 2,400 人。2026 年 4 月，o9 宣布第一季度订单签约额创历史新高，却未公开具体订单金额或 ARR
              变动明细。Owler 未标注日期的公开主页给出了 $100 million 至 $500 million 的年营收估算区间，该区间过宽且缺乏信源支撑，无法替代经审计的实际营收。Futurum 在 2024 年报道
