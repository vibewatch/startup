  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达支出与范畴
        blocks:
          - type: paragraph
            body: >-
              o9 Solutions
              的核心可触达市场聚焦于企业级供应链计划（SCP）与集成业务计划（IBP）软件平台。该领域致力于拉通跨职能决策协同，涵盖需求预测、多级库存优化（MEIO）、供应分配、主生产计划以及财务对账。可触达的软件支出包括面向大型跨国企业的云订阅软件许可、专用
              AI/ML 计划模块、企业知识图谱能力及配套实施服务。


              不在范畴内的支出包括交易型企业资源计划（ERP）核心系统、执行层面的仓储管理系统（WMS）、运输执行软件（TMS），以及缺乏数学优化与情景模拟引擎的通用商业智能或看板工具。上游相邻细分包括企业绩效管理（CPM）与财务计划与分析（FP&A）；下游相邻领域涵盖制造执行系统（MES）和物流可视化网络。目标企业内部的传统替代方案根深蒂固：极度依赖人工的电子表格建模（主要为
              Microsoft Excel）、定制化的老旧本地部署 ERP 计划插件，以及针对单一生产厂区或特定产品线的碎片化单点方案。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
