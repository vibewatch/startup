callouts:
  - calloutType: "insight"
    title: "Architectural Integrity vs. Quantitative Opacity"
    body: "o9's greatest architectural asset is the coherence of its Enterprise Knowledge Graph and GraphCube foundation, which cleanly separates planning intelligence from underlying transactional ERPs. However, third-party technical assessments caution that o9 markets heavily on AI and optimization capabilities while publicly concealing its solver formulations, probabilistic distributions, and objective arbitration logic, operating closer to a configuration-heavy enterprise planning suite than an inspectable mathematical decision engine."
