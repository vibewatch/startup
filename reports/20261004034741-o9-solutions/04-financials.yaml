  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-disclosure
      missingEvidence: Audited consolidated revenue, ARR, deferred revenue, and a revenue-recognition bridge.
      whyItMatters: Revenue scale and quality cannot be inferred from deployments, bookings language, or one legal entity.
      diligencePath: Obtain audited statements and reconcile monthly billings, recognized revenue, ARR, and deferred revenue by product.
      relatedQuestionRefs: [QI005, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: pricing-opacity
      missingEvidence: Actual contract values, discounting, renewal uplifts, sales-cycle length, CAC, and payback.
      whyItMatters: Public contract descriptions do not establish realized pricing or enterprise sales efficiency.
      diligencePath: Sample signed contracts and invoices, then reconcile bookings to cohort CAC and cash payback.
      relatedQuestionRefs: [QI002, QI003]
      relatedTableRefs: [TI002, TI003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics-gaps
      missingEvidence: Gross margin by subscription, implementation, partner delivery, and infrastructure cost.
      whyItMatters: The margin path cannot be inferred from software positioning or a solve-time benchmark.
      diligencePath: Review cost-of-revenue ledger detail and customer-level contribution margins for representative deployments.
      relatedQuestionRefs: [QI004, QI008]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
      severity: material
      topic: capital-adequacy
      missingEvidence: Current unrestricted cash, monthly burn, runway, debt, covenants, and next-round triggers.
      whyItMatters: Funding raised historically is not current cash available and does not establish financing independence.
      diligencePath: Obtain current bank statements, debt schedules, the board-approved operating plan, and downside runway cases.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: growth-metric-conflict
      missingEvidence: A company-issued reconciliation of the 37% figure to a defined revenue or ARR denominator.
      whyItMatters: Subscription revenue growth and ARR growth are not interchangeable underwriting metrics.
      diligencePath: Request period-specific subscription revenue and ARR schedules with definitions and audit tie-outs.
      relatedQuestionRefs: [QI005, QI007]
      relatedTableRefs: [TI003]
