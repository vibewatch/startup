      - [Module expansion, Additional functionality for enterprise needs, Module and functional depth, Pricing said to vary by functionality and complexity, Expansion potential is plausible but unquantified, Provide expansion ARR and module attach rates]
      - [Customization and deployment, Customer-specific configuration and implementation, Project or bundled service, Customization is described but separate monetization is not disclosed, Services mix and margin effect unknown, Separate subscription implementation and partner-delivered revenue]
      - [Customer value creation, Platform used to improve enterprise planning outcomes, Customer benefit rather than o9 revenue, o9 claims multiple large annual-value cases, Not a contractual revenue stream without pricing linkage, Reconcile customer value cases to contract economics]
    notes: "Public descriptions only; rows distinguish reported monetization from unverified or non-revenue value claims."
    claimRefs: [CI001, CI002, CI011]
  - id: TI002
    title: Pricing and monetization visibility
    columns: [Pricing element, Public evidence, List vs realized, Unknowns, Underwriting implication]
    rows:
      - [Base subscription, Contact-based enterprise sale with no posted amount, Neither list nor realized price disclosed, Base fee user metric and minimum commitment, No public ACV baseline]
      - [Module pricing, Cost varies with functionality used, Pricing logic only, Module rate card and bundle discounts, Expansion economics cannot be quantified]
      - [Contract term, Transactions typically involve long-term contracts, Term structure reported but economics absent, Renewal uplift termination and prepaid terms, Revenue durability is unverified]
      - [Implementation and customization, Offerings are tailored to operational needs, Separate fee status unavailable, Services rate card partner share and capitalization policy, Gross-margin effect is unknown]
    notes: "No reviewed source discloses actual customer invoices, realized discounts, or revenue-recognition policy."
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics and capital adequacy scorecard
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Consolidated revenue or ARR, null, Low, Establishes scale and valuation denominator, Audited revenue ARR bridge and recognition policy]
      - [2024 growth, 37% with conflicting revenue-versus-ARR labels, Low, Metric definition changes the growth interpretation, Monthly subscription revenue and ARR schedules]
      - [Gross margin, null, Low, Tests software quality and delivery burden, Gross margin by subscription services and partner delivery]
      - [CAC and payback, null, Low, Tests enterprise sales efficiency, Fully loaded CAC sales cycle win rate and payback]
      - [Retention and expansion, null, Low, Tests durability of long-term contracts, GRR NRR churn cohorts and expansion by module]
      - [Cash burn and runway, null, Low, Determines financing dependency, Current cash monthly burn runway and board plan]
      - [Debt and obligations, null, Low, Determines claims on liquidity, Debt schedule covenants leases and committed implementation spend]
      - [Employee count proxy, 3310 as of 2026-08-31 per Tracxn, Medium, Indicates a potentially substantial payroll base but not burn, Payroll and contractor cost by function and geography]
    notes: "Null means the metric was not disclosed in the assigned public evidence; the 37% figure is not treated as a verified ARR metric."
    claimRefs: [CI004, CI005, CI006, CI014]
figures:
  - id: FI001
    title: Evidence-bounded revenue-to-economics bridge
    type: flow
    summary: >-
      Public evidence supports the subscription pathway through contracting, but the realized
      price, recognized revenue, delivery cost, and gross-profit stages remain undisclosed.
    data:
      nodes:
        - id: enterprise-demand
          label: Enterprise planning demand
          detail: Large organizations evaluate integrated planning capabilities.
        - id: configured-scope
          label: Selected platform modules
          detail: Functional depth and customer complexity shape the offering.
        - id: long-term-contract
          label: Long-term subscription contract
          detail: Preqin identifies subscriptions as the primary revenue model.
        - id: realized-price
          label: Realized contract price unavailable
          detail: No public rate card, invoice, discount, or ACV evidence was retained.
        - id: recognized-revenue
          label: Recognized subscription revenue unavailable
          detail: Revenue recognition and services allocation are not disclosed.
        - id: delivery-cost
          label: Delivery and infrastructure cost unavailable
          detail: Implementation labor, partner economics, and compute cost are unknown.
        - id: gross-profit
          label: Gross profit unavailable
          detail: No public gross-margin denominator supports a quantified endpoint.
      edges:
        - source: enterprise-demand
          target: configured-scope
          label: scopes
        - source: configured-scope
          target: long-term-contract
          label: contracts
        - source: long-term-contract
          target: realized-price
          label: prices
        - source: realized-price
          target: recognized-revenue
          label: recognizes
        - source: recognized-revenue
          target: delivery-cost
          label: incurs
        - source: delivery-cost
          target: gross-profit
          label: yields
    approximationNotes: "The sequence is conceptual; unavailable stages are gaps, not zero values or estimates."
    claimRefs: [CI001, CI002, CI003, CI006]
callouts:
  - calloutType: strength
    title: Recurring model with current deployment momentum
    body: >-
      Long-term subscriptions and more than 80 reported first-half 2026 deployments support
      recurring-revenue and expansion potential, subject to contract and retention evidence.
    claimRefs: [CI001, CI002, CI010]
  - calloutType: risk
    title: Financial scale remains unverified
    body: >-
      Public sources do not supply audited consolidated revenue, ARR, gross margin, retention,
      cash burn, or runway, and one secondary source inconsistently labels its growth metric.
    claimRefs: [CI004, CI005, CI006, CI007]
  - calloutType: recommendation
    title: Require a finance-led data room
    body: >-
      Underwriting should remain conditional until management reconciles revenue and ARR,
      supplies cohort economics and gross-margin detail, and proves current liquidity against
      operating and financing obligations.
    claimRefs: [CI006, CI012, CI013, CI015]
