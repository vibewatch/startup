  title: "Customers"
  summary: "o9 Solutions demonstrates high enterprise customer validation and commercial momentum across global manufacturing, retail, and CPG sectors, evidenced by over 130 go-lives in 2025, 80 deployments in H1 2026, and sole recognition as a Customers' Choice in the 2025 Gartner Peer Insights Voice of the Customer. However, adoption remains characterized by implementation frictions around master data and hierarchy-driven ingestion constraints, while crucial retention metrics like NRR and customer concentration remain undisclosed."
sections:
  - id: "customer-segmentation-and-targeting"
    title: "Customer Base Segmentation and Enterprise Target Profile"
    body: |
      o9 Solutions focuses its enterprise customer acquisition on large, complex multi-national enterprises across more than 30 industry verticals, with heavy concentration in retail, consumer packaged goods (CPG), automotive, industrial equipment, telecommunications, and pharmaceuticals. Target buyers typically comprise Chief Supply Chain Officers, Chief Operating Officers, and Chief Financial Officers seeking integrated business planning (IBP) and sales and operations planning (S&OP) to replace fragmented legacy enterprise resource planning (ERP) planning silos and disconnected spreadsheet routines.
      
      Enterprise accounts are segmented primarily by operational complexity and planning scope rather than simple headcounts. Global tier-1 enterprises operating multi-echelon global supply chains engage o9 for end-to-end synchronized planning, demand sensing, and supply allocation under real operating constraints. The platform is deployed in production by major brands such as Hormel Foods, Teleflex, Arc'teryx, and TPV Technology Limited, spanning discrete manufacturing, process food and beverage, apparel, and specialized medical device supply chains.
      
      Procurement pathways are structured around multi-year subscription commitments, often deployed on hyperscaler infrastructure via the AWS Marketplace and the AWS ISV Workload Migration Program. While o9 targets global multi-billion-dollar corporations with complex planning topologies, this focus exposes the sales cycle to elongated procurement friction, extensive customized change-management phases, and heavy reliance on systems integration consulting partners.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment-velocity"
    title: "Adoption Trajectory, Go-Live Velocity, and Cloud Migration"
    body: |
      o9 Solutions has exhibited sustained deployment velocity and client acquisition across 2025 and the first half of 2026, recording consecutive quarters of annual recurring revenue expansion. The vendor reported completing more than 130 successful go-lives in 2025, spanning demand and supply planning, master planning, procurement analytics, and retail category management workflows. This momentum continued into 2026, with o9 reporting record first-quarter booking growth and completing more than 40 go-lives in Q2 2026 alone, bringing total first-half 2026 deployments to over 80 across North America, Europe, and Asia-Pacific.
      
      A critical vector accelerating enterprise adoption is o9's deepening strategic alliance with cloud hyperscalers, particularly Amazon Web Services. As an AWS Advanced Tier partner and launch partner for the AWS Supply Chain competency, o9 leverages the AWS ISV Workload Migration Program to fund and transition legacy on-premises planning installations into cloud SaaS deployments. Furthermore, listing on the AWS Marketplace simplifies enterprise procurement budgets, allowing corporate buyers to draw down committed enterprise cloud spend.
      
      Commercial traction has also been supported by systems integration partnerships, such as Columbus Consulting International, which assist consumer goods and retail clients in executing unified commerce transformations and change management. Despite this reported pace of go-lives, precise metrics on active planner daily usage, seat license utilization, and time-to-full-operational-readiness remain opaque in company-reported milestones.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "customer-proof-and-satisfaction-benchmarks"
    title: "Named Customer Proof, Satisfaction Signals, and Implementation Tradeoffs"
    body: |
      Independent peer feedback and third-party evaluations substantiate robust user satisfaction among production enterprise planners, while also highlighting recurring operational implementation hurdles. In October 2025, o9 was recognized as the sole software vendor in the Customers' Choice quadrant of the 2025 Gartner Peer Insights Voice of the Customer for Supply Chain Planning Solutions, receiving an overall rating of 4.8 out of 5 based on 54 customer reviews and a 94% willingness-to-recommend rate across enterprise users.
      
      Third-party procurement benchmark evaluation from RFP.wiki corroborates this sentiment, rating o9 at 4.5 out of 5 on CSAT and NPS, alongside high scores for functional breadth and depth (4.6 out of 5) and scenario modeling and what-if analysis (4.5 out of 5). Enterprise practitioners across telecommunications, healthcare/biotech, and manufacturing commend o9 for its ability to comprehend complex supply chain topologies, run what-if scenarios, and optimize inventory networks while elevating service levels.
      
      Nonetheless, procurement evaluations and user reviews consistently signal operational friction. RFP.wiki procurement notes warn that recurring critiques cite hierarchy-driven data ingestion constraints and occasional tool glitches. Furthermore, enterprise buyers face implementation risks where master data inconsistencies degrade planning accuracy, integration sequencing delays schedule cutovers, and extra compute charges for optimization scale can expand total cost of ownership beyond base SaaS subscription agreements.
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "retention-and-concentration-risks"
    title: "Retention Durability, Account Concentration, and Diligence Inquiries"
    body: |
      A primary vulnerability in evaluating o9's customer franchise is the complete absence of publicly disclosed retention, churn, and account concentration figures. While o9 reports 28 consecutive quarters of ARR growth and claims client expansions across consumer products, retail, and telecommunications, it does not release audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or logo churn statistics.
      
      Enterprise supply chain planning contracts typically feature multi-year terms ranging from three to five years, creating substantial structural switching barriers once an enterprise integrates its ERP, MES, and warehouse management systems into the o9 Digital Brain. However, this same architectural entrenchment means that customer dissatisfaction during complex deployments can result in stalled rollouts or expensive remediation rather than immediate outright churn, concealing potential underlying renewal friction.
      
      Furthermore, revenue concentration among o9's top enterprise tier remains an unresolved diligence risk. Given that o9 serves multi-billion-dollar conglomerates with platform deployments that can represent multi-million-dollar annual contract values, the loss or consolidation of a handful of flagship accounts would exert disproportionate pressure on revenue predictability. Rigorous audit of cohort renewal rates, expansion velocity within existing accounts, and top-10 customer revenue concentration remains essential for prospective investors.
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
