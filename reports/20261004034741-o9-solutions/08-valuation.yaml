callouts:
  - calloutType: "recommendation"
    title: "Disciplined Underwriting Posture"
    body: "Investors should maintain a research-more stance on o9 Solutions. Although the enterprise AI planning platform demonstrates strong operational traction and top-tier enterprise deployments, underwriting private equity shares at or near the July 2023 headline valuation of $3.7 billion exposes capital to severe multiple contraction without verifiable financial audit support."
    claimRefs:
      - "CV004"
      - "CV007"
      - "CV012"
  - calloutType: "risk"
    title: "Secondary Market Pricing Divergence"
    body: "Alternative trading systems and private secondary platforms reflect limited liquidity and downward pricing adjustments for late-stage venture unicorns. Without a near-term IPO liquidity window or primary equity validation, existing preferred liquidation stacks could create significant impairment risks for common shareholders and unhedged late-stage secondary buyers."
    claimRefs:
      - "CV009"
      - "CV011"
      - "CV013"
