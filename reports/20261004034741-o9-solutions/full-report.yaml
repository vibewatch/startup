              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Integrity vs. Quantitative Opacity
            body: >-
              o9's greatest architectural asset is the coherence of its Enterprise Knowledge Graph and GraphCube
              foundation, which cleanly separates planning intelligence from underlying transactional ERPs. However,
              third-party technical assessments caution that o9 markets heavily on AI and optimization capabilities
              while publicly concealing its solver formulations, probabilistic distributions, and objective arbitration
              logic, operating closer to a configuration-heavy enterprise planning suite than an inspectable
              mathematical decision engine.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Enterprise Target Profile
        blocks:
          - type: paragraph
            body: >
              o9 Solutions focuses its enterprise customer acquisition on large, complex multi-national enterprises
              across more than 30 industry verticals, with heavy concentration in retail, consumer packaged goods (CPG),
              automotive, industrial equipment, telecommunications, and pharmaceuticals. Target buyers typically
              comprise Chief Supply Chain Officers, Chief Operating Officers, and Chief Financial Officers seeking
              integrated business planning (IBP) and sales and operations planning (S&OP) to replace fragmented legacy
              enterprise resource planning (ERP) planning silos and disconnected spreadsheet routines.


              Enterprise accounts are segmented primarily by operational complexity and planning scope rather than
              simple headcounts. Global tier-1 enterprises operating multi-echelon global supply chains engage o9 for
              end-to-end synchronized planning, demand sensing, and supply allocation under real operating constraints.
              The platform is deployed in production by major brands such as Hormel Foods, Teleflex, Arc'teryx, and TPV
              Technology Limited, spanning discrete manufacturing, process food and beverage, apparel, and specialized
              medical device supply chains.


              Procurement pathways are structured around multi-year subscription commitments, often deployed on
              hyperscaler infrastructure via the AWS Marketplace and the AWS ISV Workload Migration Program. While o9
              targets global multi-billion-dollar corporations with complex planning topologies, this focus exposes the
              sales cycle to elongated procurement friction, extensive customized change-management phases, and heavy
              reliance on systems integration consulting partners.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU008
      - number: '6.2'
        title: Adoption Trajectory, Go-Live Velocity, and Cloud Migration
        blocks:
          - type: paragraph
            body: >
              o9 Solutions has exhibited sustained deployment velocity and client acquisition across 2025 and the first
              half of 2026, recording consecutive quarters of annual recurring revenue expansion. The vendor reported
              completing more than 130 successful go-lives in 2025, spanning demand and supply planning, master
              planning, procurement analytics, and retail category management workflows. This momentum continued into
              2026, with o9 reporting record first-quarter booking growth and completing more than 40 go-lives in Q2
              2026 alone, bringing total first-half 2026 deployments to over 80 across North America, Europe, and
              Asia-Pacific.


              A critical vector accelerating enterprise adoption is o9's deepening strategic alliance with cloud
              hyperscalers, particularly Amazon Web Services. As an AWS Advanced Tier partner and launch partner for the
              AWS Supply Chain competency, o9 leverages the AWS ISV Workload Migration Program to fund and transition
              legacy on-premises planning installations into cloud SaaS deployments. Furthermore, listing on the AWS
              Marketplace simplifies enterprise procurement budgets, allowing corporate buyers to draw down committed
              enterprise cloud spend.


              Commercial traction has also been supported by systems integration partnerships, such as Columbus
              Consulting International, which assist consumer goods and retail clients in executing unified commerce
              transformations and change management. Despite this reported pace of go-lives, precise metrics on active
              planner daily usage, seat license utilization, and time-to-full-operational-readiness remain opaque in
              company-reported milestones.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU006
              - CU009
              - CU011
      - number: '6.3'
        title: Named Customer Proof, Satisfaction Signals, and Implementation Tradeoffs
        blocks:
          - type: paragraph
            body: >
              Independent peer feedback and third-party evaluations substantiate robust user satisfaction among
              production enterprise planners, while also highlighting recurring operational implementation hurdles. In
              October 2025, o9 was recognized as the sole software vendor in the Customers' Choice quadrant of the 2025
              Gartner Peer Insights Voice of the Customer for Supply Chain Planning Solutions, receiving an overall
              rating of 4.8 out of 5 based on 54 customer reviews and a 94% willingness-to-recommend rate across
              enterprise users.


              Third-party procurement benchmark evaluation from RFP.wiki corroborates this sentiment, rating o9 at 4.5
              out of 5 on CSAT and NPS, alongside high scores for functional breadth and depth (4.6 out of 5) and
              scenario modeling and what-if analysis (4.5 out of 5). Enterprise practitioners across telecommunications,
              healthcare/biotech, and manufacturing commend o9 for its ability to comprehend complex supply chain
              topologies, run what-if scenarios, and optimize inventory networks while elevating service levels.


              Nonetheless, procurement evaluations and user reviews consistently signal operational friction. RFP.wiki
              procurement notes warn that recurring critiques cite hierarchy-driven data ingestion constraints and
              occasional tool glitches. Furthermore, enterprise buyers face implementation risks where master data
              inconsistencies degrade planning accuracy, integration sequencing delays schedule cutovers, and extra
              compute charges for optimization scale can expand total cost of ownership beyond base SaaS subscription
              agreements.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
      - number: '6.4'
        title: Retention Durability, Account Concentration, and Diligence Inquiries
        blocks:
          - type: paragraph
            body: >
              A primary vulnerability in evaluating o9's customer franchise is the complete absence of publicly
              disclosed retention, churn, and account concentration figures. While o9 reports 28 consecutive quarters of
              ARR growth and claims client expansions across consumer products, retail, and telecommunications, it does
              not release audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or logo churn statistics.


              Enterprise supply chain planning contracts typically feature multi-year terms ranging from three to five
              years, creating substantial structural switching barriers once an enterprise integrates its ERP, MES, and
              warehouse management systems into the o9 Digital Brain. However, this same architectural entrenchment
              means that customer dissatisfaction during complex deployments can result in stalled rollouts or expensive
              remediation rather than immediate outright churn, concealing potential underlying renewal friction.


              Furthermore, revenue concentration among o9's top enterprise tier remains an unresolved diligence risk.
              Given that o9 serves multi-billion-dollar conglomerates with platform deployments that can represent
              multi-million-dollar annual contract values, the loss or consolidation of a handful of flagship accounts
              would exert disproportionate pressure on revenue predictability. Rigorous audit of cohort renewal rates,
              expansion velocity within existing accounts, and top-10 customer revenue concentration remains essential
              for prospective investors.
            claimRefs:
              - CU013
              - CU014
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unrivaled Peer Endorsement Among Tier-1 Supply Chain Providers
            body: >-
              o9 Solutions achieved distinct validation in the 2025 Gartner Peer Insights Voice of the Customer by
              emerging as the sole software provider recognized as a Customers' Choice in Supply Chain Planning
              Solutions, securing an average rating of 4.8 out of 5 and a 94% recommendation rate across enterprise
              practitioners.
            calloutType: strength
            claimRefs:
              - CU009
          - type: callout
            title: Master Data Fragility and Total Cost of Ownership Inflation
            body: >-
              Independent procurement intelligence from RFP.wiki highlights that o9 deployments face recurring critiques
              around hierarchy-driven data ingestion constraints and tool glitches. When combined with potential hidden
              costs from compute-intensive optimization modules and extended systems integration services, total cost of
              ownership can materially exceed initial SaaS budget expectations.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal & Intellectual Property Exposures
        blocks:
          - type: paragraph
            body: >
              Enterprise supply chain planning software occupies a mission-critical position within corporate IT
              infrastructure, exposing vendors to substantial legal, intellectual property, and compliance risks. For o9
              Solutions, the most prominent unresolved legal overhang is the trade-secret misappropriation lawsuit
              initiated by legacy enterprise planning incumbent SAP in the U.S. District Court for the Northern District
              of Texas. The litigation alleges unauthorized use and transfer of proprietary supply chain planning
              methodologies, trade secrets, and technical know-how following the departure of key technical personnel
              from SAP to o9. Because enterprise planning algorithms, graph data models, and integrated business
              planning logic represent the core intellectual property underpinning o9's Digital Brain platform, any
              adverse ruling, injunction, or substantial financial settlement would represent a severe threat to the
              company's valuation, balance sheet, and customer procurement assurance.


              In parallel, modern multi-tier global supply chain planning platforms face accelerating regulatory
              compliance demands across international jurisdictions. In published research on supplier risk management,
              o9 highlights that non-compliance with the European Union's Corporate Sustainability Reporting Directive
              (CSRD) and the United States Uyghur Forced Labor Prevention Act (UFLPA) now creates direct legal liability
              for corporate buyers. As global enterprises increasingly rely on o9's platform and Control Tower to track
              Tier 1 through Tier 3 supplier compliance, environmental metrics, and labor provenance, any failure of
              o9's data validation pipelines to surface non-compliant suppliers creates downstream legal and brand
              exposure for its clients. Furthermore, cross-border deployment across North America, Europe, and
              Asia-Pacific subjects o9 to strict data sovereignty and privacy mandates, including GDPR in Europe, where
              multi-tenant cloud architectures must enforce rigorous data segregation and localized governance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Complexity, Implementation Bottlenecks & Software Dependability
        blocks:
          - type: paragraph
            body: >
              The primary operational vulnerability in o9 Solutions' business model is the extreme complexity, lengthy
              duration, and technical friction inherent in deploying enterprise supply chain software. Independent
              procurement analysis from RFP.wiki indicates that multi-module planning rollouts commonly span 12 to 24
              months, with total cost of ownership (TCO) heavily dominated by professional services, system integration,
              data engineering, and organizational change management rather than software licensing alone. Customer
              reviews collected across Gartner Peer Insights (where o9 maintains a 4.8 out of 5.0 rating across 158
              reviews) repeatedly emphasize that while o9 delivers dependable partner support and flexible modeling once
              stabilized, successful adoption is tightly coupled to rigorous scoping discipline, internal data
              readiness, and experienced administrative ownership.


              Specific operational friction points documented in independent evaluations include hierarchy-driven data
              ingestion constraints, occasional software glitches, visible row limitations, and interface latency when
              filtering complex, multi-attribute planning views. Upstream data readiness represents a critical
              prerequisite; inconsistent master data or flawed enterprise resource planning (ERP) records directly
              degrade AI-driven forecast quality and scenario modeling precision. To mitigate human forecasting errors
              and attribution bias, o9 introduced its APEX (Agile, Adaptive, Autonomous) operating model and Post-Game
              Analytics (PGA) to systematically trace forecast overrides and planning deviations back to root causes.
              However, executing and configuring these sophisticated decision-replay and graph-analytics workflows
              requires scarce technical talent. As evidenced by official hiring requirements for roles such as Solution
              Architect in Demand Planning, o9 demands at least 7 years of enterprise implementation experience and
              Master's degrees in Operations Research or Engineering, highlighting a persistent operational bottleneck
              in scaling qualified professional services capacity.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Counterparty Dependencies, Partner Concentration & Disruption Multipliers
        blocks:
          - type: paragraph
            body: >
              o9 Solutions operates within an intricate web of external technological and commercial dependencies that
              introduce severe counterparty and concentration risks. From a systems implementation perspective, o9 is
              heavily dependent on global systems integrators (GSIs)—such as Accenture, Deloitte, EY, and specialized
              boutiques like Columbus Consulting—to configure the Digital Brain, map legacy ERP data, and guide client
              change management. When systems integrators suffer capacity constraints, assign inexperienced personnel,
              or miscalculate project scope, deployment timelines slip and customer dissatisfaction reflects directly on
              o9. On the infrastructure layer, o9 delivers its cloud-native platform across public cloud providers
              including Amazon Web Services, Microsoft Azure, Google Cloud, and Snowflake, leaving its service-level
              agreements and operational availability exposed to underlying hyperscaler downtime and infrastructure cost
              inflation.


              Third-party research cited by o9 underscores the vulnerability of extended networks: in 2024, nearly 80%
              of organizations experienced at least one supply chain disruption, with third-party supplier failures as
              the primary driver, while 30% of supplier disruptions cost companies over $5 million each. o9's own
              commercial concentration mirrors this exposure: the company focuses on massive, multi-billion-dollar
              global enterprises in retail, consumer goods, telecommunications, and industrial manufacturing, having
              completed over 40 go-lives in Q2 2026 and more than 80 across H1 2026. Because individual enterprise
              contracts frequently reach seven-figure annual recurring revenue with extensive upfront integration
              investments, the cancellation, delay, or failed rollout of even two or three major client programs would
              materially impair o9's revenue growth trajectory and cash flow predictability.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Risk Monitoring Indicators, Thesis-Break Triggers & Diligence Mandates
        blocks:
          - type: paragraph
            body: >
              Evaluating o9 Solutions as an investment asset requires establishing rigorous, measurable indicators to
              monitor operational health and detect structural thesis breaks before catastrophic value erosion occurs.
              While o9 continues to report commercial momentum and leadership recognition in enterprise
              planning—including Leader placement in the 2026 Nucleus Research Control Tower Technology Value Matrix and
              2026 Gartner Magic Quadrant reports—private-company opacity obscures critical underlying metrics. Crucial
              operating data, including gross margin profile, net revenue retention (NRR), services-versus-software
              margin splits, customer churn cohorts, and specific top-customer concentration percentages, remain
              entirely undisclosed in the public record.


              A structural thesis break would be signaled by specific adverse developments across four distinct fronts:
              (1) an adverse legal outcome, preliminary injunction, or punitive financial damages ruling in the SAP
              trade-secret litigation; (2) a measurable deceleration in enterprise deployment velocity, signaled by
              go-lives falling below 30 per quarter or public reports of abandoned implementations at tier-1 accounts;
              (3) partner channel defection, where major GSIs reduce their dedicated o9 practice benches in favor of
              Kinaxis, Blue Yonder, or native hyperscaler tools; or (4) severe cloud infrastructure outages or data
              privacy breaches that compromise client confidentiality across shared multi-tenant clusters. Future
              investment rounds must condition commitment on unredacted disclosure of litigation liability reserves,
              audited financials, cohort retention schedules, and GSI delivery benchmarks.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Double-Edged Sword of Enterprise Planning Transformations
            body: >-
              While o9 Solutions achieves standout customer satisfaction once implementations stabilize (evidenced by a
              4.8/5.0 rating on Gartner Peer Insights), the platform's multi-year deployment cycles create acute
              vulnerability to systems integrator execution risks and customer master data deficiencies. Investors must
              recognize that enterprise planning software is fundamentally an organizational transformation engine: when
              upstream data is fragmented or change management falters, customer frustration threatens renewals and
              expansion regardless of underlying software capabilities.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for o9 Solutions rests on its position as an enterprise AI software platform
              provider transforming supply chain planning, commercial operations, and integrated business planning
              across more than 30 industry verticals. By orchestrating complex enterprise workflows through its
              proprietary Digital Brain platform and next-generation APEX operating model, o9 captures
              multi-million-dollar digital transformations at major multinational corporations. Continued enterprise
              adoption is evidenced by large-scale client additions and recurring deployment expansions across North
              America, EMEA, and APAC.


              Conversely, the counter-thesis centers on valuation overhang and private-market liquidity discounts. The
              company has not closed a primary equity financing round since July 2023, leaving its headline $3.7 billion
              valuation unvalidated by institutional price discovery for over three years. Concurrently, secondary
              trading signals on alternative trading systems reflect steep pricing discounts, while macroeconomic
              enterprise software multiples have contracted. Compounding these valuation headwinds, the absence of
              publicly disclosed audited revenue run-rates, gross margin profiles, or net revenue retention metrics
              forces private-market investors to underwrite high execution uncertainty.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV011
      - number: '8.2'
        title: Financing History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              o9 Solutions' historical capital accumulation reflects a series of large private equity commitments that
              established its high-water valuation benchmark. In January 2022, the company completed a $295 million to
              $296 million equity financing round backed by General Atlantic, BeyondNetZero, Generation Investment
              Management, and KKR, achieving a $2.7 billion post-money valuation. This round followed its initial
              unicorn milestone reached in April 2020 at a $1.0 billion valuation.


              In July 2023, existing private equity backers infused an additional $116 million growth commitment, which
              pushed o9's headline post-money valuation to $3.7 billion. However, no primary equity capital has been
              recorded since that transaction. While management has continued to expand executive leadership and
              governance in 2026—including the appointments of a Chief Financial Officer, Chief Operating Officer, and
              Chief Technology Officer—the company has not filed an S-1 registration statement or finalized public
              listing plans, leaving late-stage investors reliant on opaque secondary marks and illiquid share
              transfers.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV007
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV009
              - CV012
      - number: '8.3'
        title: Valuation Scenarios and Market Multiples
        blocks:
          - type: paragraph
            body: >-
              Evaluating o9 Solutions across bull, base, and bear scenarios demonstrates asymmetric return profiles
              under current private-market conditions. In a bull case scenario, o9 sustains accelerating enterprise
              adoption, scales recurring software revenue toward $450 million to $500 million, and achieves a successful
              initial public offering at 8.0x to 10.0x forward sales multiples, delivering equity enterprise valuations
              between $4.0 billion and $4.5 billion. This scenario requires flawless commercial execution and resolution
              of competitive pressures against legacy enterprise vendors.


              In the base case scenario, steady enterprise demand is balanced by elongated B2B sales cycles and multiple
              compression across supply chain software peers. Assuming estimated recurring revenue ranges between $300
              million and $350 million, a normalized public multiple of 6.0x to 7.0x yields an enterprise value between
              $2.1 billion and $2.5 billion, representing a 32% to 43% discount relative to the $3.7 billion round. In
              the bear case scenario, persistent lack of audited financial disclosures, customer concentration friction,
              or prolonged litigation risks trigger a down-round restructuring or distressed secondary repricing toward
              $1.2 billion to $1.5 billion. Given that secondary indications already price private shares at steep
              discounts, underwriting equity at the historical $3.7 billion mark presents negative risk-adjusted
              asymmetry.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Exit Readiness and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              o9 Solutions demonstrates mixed exit readiness characteristics as of late 2026. On organizational
              maturity, the company has bolstered senior leadership with seasoned operators and expanded international
              customer support hubs across North America, Europe, and Asia-Pacific. Furthermore, customer expansion
              momentum across consumer goods, retail, automotive, and capital equipment demonstrates strong
              technological relevance and strategic stickiness.


              Nonetheless, critical diligence hurdles remain unaddressed for public-market transition. Foremost among
              these is the lack of verifiable, audited disclosures regarding annual recurring revenue, subscription
              gross margins, net revenue retention rates, and professional services dependency. Prospective investors
              must condition capital deployment on explicit verification of customer concentration, balance sheet
              liquidity, liquidation preference seniorities, and resolution of competitive IP disputes. Until these
              financial parameters are validated by independent audit documentation, maintaining a disciplined
              research-more posture is essential.
            claimRefs:
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disciplined Underwriting Posture
            body: >-
              Investors should maintain a research-more stance on o9 Solutions. Although the enterprise AI planning
              platform demonstrates strong operational traction and top-tier enterprise deployments, underwriting
              private equity shares at or near the July 2023 headline valuation of $3.7 billion exposes capital to
              severe multiple contraction without verifiable financial audit support.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV007
              - CV012
          - type: callout
            title: Secondary Market Pricing Divergence
            body: >-
              Alternative trading systems and private secondary platforms reflect limited liquidity and downward pricing
              adjustments for late-stage venture unicorns. Without a near-term IPO liquidity window or primary equity
              validation, existing preferred liquidation stacks could create significant impairment risks for common
              shareholders and unhedged late-stage secondary buyers.
            calloutType: risk
            claimRefs:
              - CV009
              - CV011
              - CV013
