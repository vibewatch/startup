      - number: '5.2'
        title: Planning Modules & Functional Workflow Coverage
        blocks:
          - type: paragraph
            body: >-
              The functional surface of o9's platform spans operational, tactical, and commercial enterprise planning
              domains through modular application packages. In operational supply chain management, o9 provides Demand
              Planning and Sensing, which leverages machine learning algorithms to evaluate historical consumption,
              promotional events, seasonality, and external demand drivers alongside real-time consensus overrides. The
              Supply Chain Planning and Analytics module balances demand requirements against multi-echelon material
              availability, capacity constraints, production schedules, and inventory policies. Upstream coordination is
              supported by Supplier Relationship Management (SRM) and an integrated Supply Chain Control Tower, which
              continuously cycles through sensing exceptions, evaluating resolution options, and coordinating supplier
              responses. Beyond core logistics, o9 has expanded its perimeter into Revenue Growth Management (RGM) for
              commercial promotional pricing and product mix optimization, as well as an embedded ESG and Sustainability
              suite that computes multi-tier supplier risk indicators and Scope 3 carbon metrics. While broad functional
              coverage allows global enterprises to consolidate planning workflows, third-party technical analysis
              indicates that the platform's public doctrine leans heavily on managerial orchestration rather than
              exposing explicit mathematical formulations.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE005
