  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Scope
        blocks:
          - type: paragraph
            body: >-
              The core addressable market for o9 Solutions is centered on enterprise supply chain planning (SCP) and
              integrated business planning (IBP) software platforms. This software domain addresses cross-functional
              decision synchronization across demand forecasting, multi-echelon inventory optimization (MEIO), supply
              allocation, master production scheduling, and financial reconciliation. Addressable software spend
              consists of cloud subscription software licenses, specialized AI/ML planning modules, enterprise knowledge
              graph capabilities, and related implementation services for large global operating entities.


              Excluded spend includes transactional enterprise resource planning (ERP) systems of record, operational
              warehouse management systems (WMS), transportation execution software (TMS), and generic business
              intelligence or dashboarding tools that lack mathematical optimization and scenario simulation engines.
              Upstream adjacent categories comprise corporate performance management (CPM) and financial planning and
              analysis (FP&A), while downstream adjacencies include manufacturing execution systems (MES) and logistics
              visibility networks. Traditional status-quo substitutes remain deeply entrenched across target
              enterprises: highly manual spreadsheet modeling (primarily Microsoft Excel), legacy customized on-premise
              ERP planning add-ons, and fragmented point solutions tailored to single operational facilities or
              individual product lines.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing Lenses and Constrained TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Evaluating market scale for o9 Solutions requires distinguishing broad top-down analyst categories from
              operational bottom-up budget realities. Broad third-party research benchmarks aggregate enterprise supply
              chain management software spend into expansive global projections spanning tens of billions of dollars
              across all enterprise tiers. However, o9 Solutions targets an evidence-constrained subset of this space:
              multinational corporations managing complex multi-tier supply networks, multi-site manufacturing
              facilities, and intricate bill-of-materials structures across 30-plus industry verticals including
              consumer products, retail, electronics manufacturing services, automotive, and capital equipment.


              The Serviceable Addressable Market (SAM) is bounded by Fortune 500-scale and equivalent multinational
              corporations generating over $1 billion in annual revenue that possess sufficient transactional data
              maturity to justify multi-year enterprise transformation programs. The Serviceable Obtainable Market (SOM)
              is further constrained by annual enterprise procurement cycles, high switching barriers surrounding
              entrenched legacy systems (such as SAP IBP and Oracle Fusion SCM), and the availability of specialized
              implementation consultants capable of deploying graph-based planning models. Because public disclosures
              provide selective booking announcements rather than audited total market ARR, comprehensive TAM/SAM/SOM
              sizing remains an analytical diligence gap requiring ongoing verification.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
