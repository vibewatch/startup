  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Digital Brain Architecture & Enterprise Knowledge Graph
        blocks:
          - type: paragraph
            body: >-
              o9 Solutions structures its core offering around the o9 Digital Brain platform, an enterprise-grade
              cloud-native planning environment designed to sit above legacy systems of record rather than replacing
              underlying transactional ERP databases. At the architectural center of the Digital Brain is the Enterprise
              Knowledge Graph (EKG), which models an organization's multi-echelon value chain by mapping products,
              customer nodes, production facilities, bill-of-materials dependencies, and external market signals into a
              coherent digital twin. Complementing the graph model is o9's GraphCube data layer, a proprietary
              multi-dimensional computation engine engineered to process complex aggregations, disaggregations, and
              what-if scenario simulations across supply and commercial planning horizons. Independent architectural
              reviews confirm that this shared modeling substrate creates strong architectural coherence across
              disparate planning use cases, contrasting favorably with legacy software suites formed by loosely
              integrated corporate acquisitions. However, external evaluations also highlight that o9 operates as a
              heavy, configuration-intensive platform that demands substantial custom modeling, data pipeline
              engineering, and systems-integration overhead during initial enterprise rollouts.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE003
