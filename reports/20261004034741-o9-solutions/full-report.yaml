      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Economics
        blocks:
          - type: paragraph
            body: >-
              Enterprise purchasing of o9's Digital Brain platform is governed by multi-stakeholder consensus across
              operational and executive leadership. Primary economic buyers are Chief Supply Chain Officers (CSCO),
              Chief Operating Officers (COO), and Vice Presidents of Integrated Planning who control specialized
              enterprise transformation and operational capital budgets. End users comprise operational demand planners,
              supply chain analysts, inventory planners, and commercial category managers who seek to eliminate manual
              reconciliation across disconnected spreadsheets and disjointed departmental plans.


              Procurement triggers typically stem from acute supply chain disruptions, unacceptably low baseline
              forecast accuracy, excessive inventory carrying costs, or regulatory and commercial expansion requiring
              multi-site coordination. Enterprise adoption follows a phased deployment path: initial pilot scoping and
              data ingestion, integration with transactional ERP cores (such as SAP S/4HANA or Oracle), followed by
              staged go-lives across specific regional or product business units. In the first half of 2026 alone, o9
              completed more than 80 deployments across North America, Europe, and APAC, demonstrating sustained
              enterprise expansion across discrete and process industries.
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM010
      - number: '2.4'
        title: Growth Drivers and Critical Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Market demand is propelled by rising macroeconomic and geopolitical volatility, supplier lead-time
              unpredictability, and expanding corporate mandates to connect commercial demand signals with physical
              production constraints. Platforms offering agile what-if scenario planning, multi-echelon inventory
              optimization, and touchless exception-based forecasting enable enterprises to protect gross operating
              margins and improve asset utilization.


              Conversely, enterprise adoption faces substantial structural constraints. Independent review aggregations
              and market comparisons highlight that o9's platform entails high total cost of ownership (TCO), multi-year
              enterprise contract commitments, and steep implementation efforts spanning 6 to 12 months. Crucially,
              successful deployment requires rigorous organizational data readiness and governance; messy transactional
              data and complex ERP hierarchies create performance friction and delay time-to-value. Furthermore, for
              mid-market businesses or smaller operations, the significant services overhead, custom modeling
              requirements, and lack of transparent pricing make o9 economically unviable compared to accessible point
              solutions.
            claimRefs:
              - CM004
              - CM009
              - CM011
              - CM012
              - CM013
