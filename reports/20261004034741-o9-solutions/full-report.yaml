  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Market Segmentation
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding o9 Solutions spans three primary categories: legacy enterprise
              resource planning incumbents, dedicated best-of-breed supply chain planning platforms, and next-generation
              execution-oriented point solutions. Enterprise incumbents such as SAP IBP and Blue Yonder offer broad
              supply chain suites deeply embedded within existing ERP transactional architectures, though often burdened
              by multi-decade legacy codebases and fragmented application acquisitions. In dedicated integrated business
              planning (IBP) and concurrent supply chain planning, Kinaxis RapidResponse represents o9's primary direct
              peer, competing head-to-head for global Fortune 500 manufacturing, consumer goods, and industrial
              deployments. Downstream in specialized retail and grocery forecasting, RELEX Solutions offers localized
              demand-driven replenishment and category management. Concurrently, emerging autonomous agent platforms
              such as Nauta target operational execution and exception triage, distinguishing themselves from o9's
              analyst-intensive modeling by eliminating heavy data engineering prerequisites for mid-market operators.
            claimRefs:
