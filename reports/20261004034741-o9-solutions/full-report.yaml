        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Market Boundary Dictated by Supply Chain Complexity
            body: >-
              o9 Solutions does not address broad mid-market planning; its addressable boundary is defined by complex
              multi-echelon enterprises where planning latency directly impacts working capital and multi-facility
              operating margins.
