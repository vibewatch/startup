  - id: TV001
    title: Recommendation and Valuation Stance Summary
    columns:
      - Dimension
      - Assessment
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Public operating proof remains incomplete without audited ARR, margins, or retention figures.
        - Defer unhedged primary equity commitment pending access to confidential financial disclosures.
      - - Confidence
        - medium
        - Primary financing rounds are verified via multiple publishers, but secondary pricing is illiquid.
        - Maintain disciplined hurdle rates and demand downside structural protection.
      - - Risk Rating
        - high
        - Three-year lapse since last primary raise, secondary discounts, and enterprise sales concentration.
        - Require full liquidation preference schedule and cap table review.
      - - Valuation Stance
        - stretched
        - Headline $3.7B mark is unanchored to public revenue metrics and exceeds secondary trading indicators.
        - Reject transactions pegged to historical round valuations without steep discount.
    notes: >-
      Assessment synthesizes verified private rounds, secondary platform metrics, and disclosed corporate deployments as
      of Q4 2026.
    claimRefs:
      - CV004
      - CV007
      - CV011
      - CV012
  - id: TV002
    title: Investment Thesis and Anti-Thesis Balance
    columns:
      - Perspective
      - Core Argument
      - Evidence Anchor
      - Thesis Invalidation Trigger
    rows:
      - - Investment Thesis
        - Category leadership in enterprise planning and AI-driven decisioning across complex global supply chains.
        - Gartner Magic Quadrant leadership recognitions and over 80 commercial deployments completed in H1 2026.
        - Material slowdown in net customer additions or loss of major reference enterprise logos.
      - - Investment Thesis
        - High-conviction backing from premier institutional private equity sponsors supporting strategic scale.
        - Capital syndication from General Atlantic, BeyondNetZero, KKR, and Generation Investment Management.
        - Sponsor refusal to support follow-on equity or internal structured recapitalization.
      - - Anti-Thesis
        - Unsubstantiated valuation multiple unsupported by audited GAAP revenue or cash flow benchmarks.
        - Over three years since July 2023 $3.7B round without public financial filing or audited run-rate data.
        - Release of audited S-1 showing ARR growth above 40% with net expansion exceeding 120%.
      - - Anti-Thesis
        - Down-round pricing risk driven by secondary market illiquidity and comparable public multiple contraction.
        - Secondary platform reports showing market trading activity at limited liquidity and significant discounts.
        - Institutional secondary prints clearing at or above historical $3.7B preferred terms.
    notes: Arguments balance disclosed commercial momentum against structural valuation and disclosure gaps.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
      - CV011
  - id: TV003
    title: Scenario Valuation and Return Logic
    columns:
      - Scenario
      - Implied Valuation
      - Operating & Multiple Assumptions
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - $4.0B - $4.5B
        - ARR reaches $450M-$500M with 35%+ growth; IPO multiple of 8.0x-10.0x forward sales.
        - Execution bottleneck in complex global deployments; competitive displacement by legacy ERP.
        - Low (15-20%)
      - - Base Case
        - $2.1B - $2.5B
        - ARR scales to $300M-$350M; exit multiple contracts to 6.0x-7.0x sales in line with supply chain peers.
        - Elongated enterprise procurement cycles; margin dilution from heavy professional services.
        - Moderate (55-60%)
      - - Bear Case
        - $1.2B - $1.5B
        - ARR stagnates at $200M-$250M; distressed or down-round recapitalization at 4.0x-5.0x sales.
        - Customer churn, litigation liabilities, or severe secondary-market preference overhang.
        - Material (25-30%)
    notes: >-
      Implied enterprise valuations assume normalized software multiples against estimated ARR bands; figures do not
      represent audited company guidance.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
