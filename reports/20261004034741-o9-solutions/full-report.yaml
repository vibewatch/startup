      - number: '3.3'
        title: Pricing Dynamics, Switching Costs & Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement dynamics in the supply chain planning sector reveal substantial price flexibility
              and protracted deployment timelines that shape long-term moat durability. Third-party contract
              benchmarking indicates that o9 Solutions' annual contract values typically range from $600K to $3.5M+,
              scaling from $500K to $900K for single-domain deployments up to $2M to $4M+ for full end-to-end IBP
              implementations across global enterprises. Because o9 pursues aggressive market-share expansion against
              incumbents, competitive displacement evaluations against Kinaxis or SAP routinely unlock realized
              discounts of 25% to 42% off initial list proposals, with o9 list pricing generally positioned 10% to 20%
              below Kinaxis. However, o9 deployments routinely incur professional services and integration costs equal
              to 80% to 150% of first-year subscription fees and require 12 to 24 months to reach full operational
              maturity. These multi-year implementation cycles and high technical customization create formidable
              customer lock-in once operationalized, but simultaneously expose o9 to pilot fatigue and displacement
              vulnerability during procurement bake-offs.
