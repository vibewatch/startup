        - 私募基准，置信度低
        - 提醒私募平台估值标记可能超过上市可比公司的逻辑
        - 数据质量较低，且部分受门槛限制
    notes: 可比行按证据强度排序，从最强的公开市场锚点到较弱的私募参考点。
