  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 哪些证据会改变判断
    rows:
      - - MediTrust 值得溢价，因为它卡在保险方、药企、患者之间的支付层，并且已经跑出真实规模
        - 若能给出具名保险方变现、留存数据和稳定盈利，判断会进一步增强
      - - MediTrust 的交易估值应低于上一轮私募标记，因为上市可比公司更便宜，公司仍有亏损和披露风险
        - 如果 2026/2027 年报显示利润转化可持续、上市公司控制更扎实，反向判断会减弱
      - - 私募和相邻可比公司表明，稀缺平台仍可能拿到溢价结果
        - 若这些私募基准更透明、可比性更直接，权重会更高
    notes: 两边可以同时成立：战略稀缺性可能值得溢价，但公开证据质量仍会约束理性溢价上限。
