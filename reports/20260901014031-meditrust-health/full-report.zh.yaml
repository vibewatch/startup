      - number: '3.3'
        title: 切换成本、锁定效应和护城河为何有价值但不绝对
        blocks:
          - type: paragraph
            body: >-
              MediTrust
              的护城河最好理解为生态触达，而不是大众流量。最强的正面论点是，创新药支付很难从零拼出来：它需要保险产品设计、理赔运营、药房路由逻辑、伙伴接入，以及围绕敏感患者旅程建立的现实信任。这些都会形成有意义的切换摩擦，一旦项目进入市场，就能带来留存能力。但护城河并不绝对。多平台并用完全可能，因为药企可以把不同疗法或不同地区的项目交给多个伙伴，保险公司也可以从不同供应商采购不同能力。对超大型机构而言，内部自建同样可信，尤其是已经控制健康计划设计和结算的保险公司。更大的上市同业可以把更宽的医疗服务或药房分发打包进企业关系；线上处方和合规监管变化也提高了信任和规模的价值。这里的反向证据很重要：MediTrust
              的 IPO
              路径已经启动但尚未完成，买方和投资者仍缺少长期上市同业那种周期性披露历史。这也意味着，采购方和投资者仍在承销一家尚未被迫进入反复公开市场报告节奏的专业公司。因此，竞争结论是平衡的：在创新药商业化与保险相关支付交汇处，MediTrust
              看起来最强；但它仍处在一个规模、打包和透明度都可能侵蚀窄领域专业公司的市场里。
