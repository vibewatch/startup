      - number: '5.3'
        title: 技术架构、信任控制和成熟度边界
        blocks:
          - type: paragraph
            body: >-
              公开证据支持公司拥有实质性的 AI 赋能运营能力，但不足以完成全面技术承销。最强的可见技术披露来自 2025–2026 年围绕 mind42.ai 和 mind42.ins 的报道。管理层称，公司已通过 AI
              Hub mind42.ai 处理近 400 million 条理赔数据；Bamboo Works 还补充，面向保险公司的 mind42.ins 产品使用这套语料完成产品设计、营销推广和理赔运营等任务。Bamboo
              还报道，AI 驱动的理赔审核覆盖超过 60% 的案件，平均处理时间低于 10 分钟，这比泛泛的“AI
              赋能”品牌更有用。与此同时，同一独立来源指出了主要约束：保险公司必须从遗留系统迁移，并先把碎片化数据标准化，AI 才能可靠地规模化交付。信任和质量证据比产品功能证据更薄。管理层的 AI Inside
              原则明确提到专业、精准、安全和隐私，但留存公开记录仍缺少关于正常运行时间、模型治理、安全认证或事故历史的直接披露。同时，香港和大湾区路线图在战略上合理，但从证据角度看仍偏早。净判断是，MediTrust
              在流程层面看起来运营成熟，但在外部可验证的控制层面只部分成熟。
