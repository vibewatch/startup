companyProfile:
  summary: >-
    MediTrust Health 是一家创立于上海的医疗支付与商业化平台，核心任务是帮助中国高价创新药疗法跨过融资和可及性门槛。公司把 Smart Pharma、Smart Insurance、One-Code Direct
    Payment、MediTrust Rx 以及 mind42.ai 时代的工具组合在一起，在同一套流程里连接患者、保险公司、药企和医疗渠道伙伴。由备案资料衍生的公开报道显示，到 2024 年底，公司服务约 1.6 million
    名患者，累计 GPV 达 RMB39.7 billion；到 2025 年 10 月，患者数约 2.0 million，GPV 达 RMB50.2 billion；2024 年收入增至 RMB2.035
    billion。因此，它显然已是有规模的平台，但公开披露仍不完整，通往 IPO 流动性的路径也尚未走完。
