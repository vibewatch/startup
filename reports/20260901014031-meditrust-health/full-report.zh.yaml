chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、市场位置和运营模式
        blocks:
          - type: paragraph
            body: >-
              MediTrust Health 是一家 2017 年创立于上海的医疗金融科技平台，围绕一个核心判断搭建：中国高价创新药不能只靠单一支付方放量，因此支付编排和临床可及性同样关键。留存的 IPO
              报道一致把公司描述为中国最大的多元化医药支付平台，并把它定位为患者、保险公司和药企之间的中介，而不是纯线上药房或纯软件供应商。


              从 2025 年递表报道、2026 年重新递表报道和更早融资材料看，公司的运营模式已经比最初的 Care2Pay / One-Code Direct Payment 切入口更宽。MediTrust 现在围绕
              Smart Pharma 和 Smart Insurance 组织产品。Smart Pharma 面向药企提供商业化支持，例如整合商业保险、患者管理项目和多元支付供应链选项。Smart Insurance
              为希望卖出更有用医疗产品的保险公司提供端到端的产品设计、分发、理赔运营和增值健康管理支持。One-Code Direct Payment
              仍是面向消费者的关键验证点，因为它把平台逻辑落到患者流程里：识别支付资格，并完成直付交易。


              本章之所以影响后续判断，是因为 MediTrust 不只是理赔工具，不只是线上健康服务，也不只是 DTP 药房连接点。留存来源描述的是三层架构：mind42.ai 承担分析和自动化，MediTrust Rx
              连接供应链和支付，MediTrust Healthcare 赋能健康服务和医生网络。这个框架解释了为什么后续章节应把公司评估为多边基础设施业务，而不是单功能应用。
