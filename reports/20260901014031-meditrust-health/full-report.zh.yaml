      - number: '8.2'
        title: 可比公司组合、溢价逻辑和乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              可比公司给出两组相反信号。利好的一面是，MediTrust
              比许多互联网医疗公司更垂直；它不只是聚合患者流量或零售药品销售，而是卡在支付规则层，把保险公司、创新药厂、药房和患者连起来。这是它相对普通药房或简单远程医疗估值应享受溢价的最强理由。利空的一面是，公开市场倍数证据远低于
              MediTrust 上一轮估值标记。JD Health 约按 1.28x 销售额交易，Ping An Good Doctor 约 2.20x，Fangzhou 约
              0.22x。即便考虑商业模式差异，这一区间也说明，仅凭现有证据很难支撑公开市场大幅上修估值。Yuanxin Tech、WeDoctor
              等相邻私有公司基准有方向性参考价值，但也有前提：相邻公司业务组合未必相同，私有数据源也不如上市披露可靠。因此更适合用情景框架，而不是给一个单点答案。乐观情景要求市场继续把 MediTrust
              当作稀缺平台定价，并相信盈利就在眼前。基准情景假设它相对公开可比公司有溢价，但较 2022 年估值标记大幅折价。悲观情景则假设公开可比公司和融资压力主导叙事。
