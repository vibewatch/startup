  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和政策依赖风险
        blocks:
          - type: paragraph
            body: >-
              MediTrust 运营在中国医疗体系中政策最敏感的交汇处之一：创新药可及、商业保险、线上药品分发和 AI 辅助运营流程。监管者希望扩大可及性时，公司有上行空间；但规则也可能在商业模式脚下移动。NMPA 2025
              年改革意见、2026 年药品管理修订，以及 Freyr 和 GIR 的更广泛咨询评论都显示，监管环境仍活跃，而不是稳定。对 MediTrust 最直接的风险在于线上药品销售和数字药房运营。2026
              年修订加强了线上药品销售监管；CityNews 报道称，买方必须实名并使用有效处方，同时 AI 不能在处方审核中取代持证药师。对一家 DTC
              和支付体验受益于流程压缩的公司来说，这在运营上很关键。Greenberg Traurig
              对反腐和反垄断进展的总结又加了一层：医药商业化项目现在面临更严格的行为预期和行业特定竞争监管。上海本地对商业保险和创新药可及的支持是正面信号，但也提醒投资者，投资逻辑依赖持续政策背书，而不是一个纯粹放松管制的市场。
