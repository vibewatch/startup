      - number: '4.3'
        title: 融资历史、流动性压力和资本充足性
        blocks:
          - type: paragraph
            body: >-
              MediTrust 已经融到足够私募资本来搭建真实平台，但留存证据不支持对流动性掉以轻心。公司七轮融资超过 RMB3.1 billion，亮点包括 2021 年超过 RMB2 billion 的 Series
              C，以及 2022 年 C+ 轮；后者确立了最清晰的估值锚点 RMB11.678 billion。这些轮次引入了 Boyu、Janchor、HSBC、Ant Group 和 Shanghai
              Pharmaceuticals 等投资方，是保荐质量的重要正面证据。问题在 Chinaventure 描述的现金消耗模式：现金及等价物据报道从 2021 年底的 RMB2.201 billion 降至 2025
              年 4 月的 RMB166 million；2024 年还包含 RMB587 million 银行债务偿还，2025 年 4 月仍有 RMB259 million 计息借款。基于这些证据，HKEX IPO
              不只是声望事件，而是重要的资本充足性杠杆。它也可能是外部投资者首次检验公司能否用好于另一轮私募的条件为增长再融资的机会。相较 JD Health、Ping An Good Doctor 和 Fangzhou
              等上市同业，MediTrust
              仍是一个更小、更不透明、也更少经历公开市场考验的财务故事，尤其是对按公开市场方式做尽调的委员会而言。因此，承销结论应是：资本渠道存在，但平台仍需要证明交易量增长能转化为持续现金生成。
