    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和模块地图
        blocks:
          - type: paragraph
            body: >-
              MediTrust 的公开产品叙事比单一 App 或药房门店更宽。由备案资料衍生的报道反复点名 mind42.ai、MediTrust Rx 和 MediTrust Healthcare
              三个旗舰界面；后续报道和合作伙伴公告则显示，应把它们理解为同一运营堆栈的不同层，而不是孤立产品。MediTrust Rx 承接药品可及、商业化和供应链执行；MediTrust Healthcare
              代表医生网络和医疗服务协调；mind42.ai 是决策和自动化层，管理层越来越把它包装为保险公司、药企和患者支付体验之间的连接组织。公司 2026 年 AI Inside
              备忘录进一步收紧了这一定位，把未来建设聚焦在两个具体领域：帮助药企理解可及性和市场策略的分析能力，以及用 AI 增强 One-Code Direct
              Payment，用于实时支付、权益匹配和理赔流程。不同来源的共同线索是，MediTrust
              出售的是流程压缩：它试图减少产品设计、患者进入、治疗可及、支付授权和理赔结算之间的割裂步骤。这个框架也解释了为什么同一家公司在不同来源中会被描述成支付平台、保险赋能公司、商业化伙伴或患者服务网络。
