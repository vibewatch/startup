      - number: '1.2'
        title: 领导层、治理和所有权集中
        blocks:
          - type: paragraph
            body: >-
              治理仍带有强烈创始人色彩。由备案资料衍生的报道显示，张晓栋是创始人、CEO、总经理，也是最大单一股东，合计持股
              26.22%。从战略上看，这是正面因素，因为商业模式需要在保险公司、药企和医疗服务渠道之间长期谈判；但这也是集中风险，因为公开记录把公司的战略、融资和 AI 叙事异常紧密地绑定在一个小规模领导核心上。


              2026 年重新递表摘要披露，公司董事会有 11 名成员，包括 3 名执行董事、4 名非执行董事和 4 名独立非执行董事。执行层以张晓栋、副董事长黄培杰、CFO /
              联席公司秘书齐磊为核心。董事长是李志刚，也来自上海医药生态，因此治理图景明确连接到公司战略股东之一。媒体摘要还指出，主要股东包括 Ant Group 和 Sinovation 相关投资方；保荐报道则点名
              Goldman Sachs、CICC 和 HSBC 参与 IPO 路径。


              主要尽调含义并不是治理薄弱，而是治理高度网络化。创始人控制、大型战略股东和保荐人密集的资本市场准备，可以帮助分发和背书。但同一结构也提高了关键人物敏感性，并意味着后续章节需要跟踪关联方影响、董事会独立性的实际执行，以及战略投资者是否与公开市场小股东利益一致。
