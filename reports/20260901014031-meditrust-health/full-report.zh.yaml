      - number: '3.2'
        title: 能力、范围和定价：MediTrust 更窄但更深
        blocks:
          - type: paragraph
            body: >-
              能力对比的核心是深度与广度。JD Health 规模无可匹敌，药房分发姿态很可能最强，但其披露模式远宽于创新药支付。Ping An Good Doctor
              是保险医疗整合上最相关的公开可比公司：它披露了保险赋能收入流和直结网络，因此在战略上比 JD 更接近 MediTrust。Fangzhou 在慢病管理、医生流量和药房运营交汇处很强。WeDoctor
              在历史上仍值得关注，但本轮可得公开记录更薄，且融资总额信息内部不一致。Yuanxin Tech
              重要，是因为它证明大型线上线下一体化药房和商业化网络可以与反复冲刺香港上市、以及高于许多上市同业的私募估值并存。定价本身大多不透明。同业之间缺少透明价格表，意味着竞争通常按账户逐一谈判，并嵌在更宽的保险公司、雇主、药房或药企关系中。这也意味着采购优势可能来自结算速度、伙伴接入和保障设计，而不是公开可见的标价。这个动态有利于拥有伙伴触达和流程整合的公司，而不是每单位价格最会对外宣传的公司。
