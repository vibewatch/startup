      - number: '6.3'
        title: 留存、持久性和集中度边界
        blocks:
          - type: paragraph
            body: >-
              客户故事很宽，也有商业可信度，但公开的持久性证据仍不完整。留存公开披露中没有 NRR、GRR、logo
              流失、续约率、平均合同期限、满意度评分或任何主要分部的队列行为。因此，投资者可以验证宽度和蓝筹触达，却无法验证收入到底有多粘。最强的间接持久性论点是结构性的：一旦支付方流程、支付规则集和患者支持路径一起运转，替换难度应高于简单消费者
              App。最强的警惕点是，关系数量不等于集中度披露。90 或 100 多家保险公司仍可能掩盖对少数项目的高度依赖，140 多家药企关系也可能包含许多规模较小或收入较低的合作。同时，Huibao
              这类城市保险项目说明，如果 MediTrust 持续嵌在运营层，联合承保和面向公众的权益规则可以形成持久渠道。因此，本章观点应保持建设性但有纪律：MediTrust
              拥有少见的生态宽度，并反复证明生产相关性；但在称客户基础充分去风险化之前，承销文件仍需要队列、续约和集中度数据。
