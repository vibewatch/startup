        - 上市 AI 慢病管理 / 互联网医疗可比公司
        - 可反映公开市场对中国互联网医疗公司的折价
        - 毛利率更低，专注方向不同
      - - Yuanxin Tech
        - ~RMB19.5B 估值申报语境
        - 相邻私募 / IPO 前基准
        - 在医疗可及性和药品商业化基础设施上，是主题最接近的邻居
        - 披露深度或精确业务组合并不可直接比较
      - - WeDoctor
