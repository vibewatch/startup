  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 MediTrust Health 按普通远程医疗公司来分析，也不应把它当成整个中国医药市场的代理变量。公司真正可触达的场域更窄，也更适合投资判断：创新药商业化、商业保险、患者融资、DTP
              药房路由和直付编排交汇的那一层。由备案资料衍生的报道反复把公司放在患者、保险公司和药企面对的融资与支付摩擦中，而不是日常基层诊疗流量或基本医保报销中。因此，纳入的支出池是医疗支出中需要支付设计、患者可及支持或高价值疗法渠道协调的部分。实际覆盖商业保险相关理赔、城市补充或雇主健康计划、患者援助和融资流程，以及把专科处方送到患者手中的履约路线。主要替代方案仍是碎片化手工流程：自费、慈善
              / PAP 机制、保险公司内部权益设计，以及药企商业团队在没有中立编排层的情况下直接推动医院或 DTP 放量。这个边界很重要，因为它避免把 MediTrust 并不直接变现的类别塞进
              TAM，同时仍保留医院、药房零售和更广义医药支出的相邻规模，这些因素决定机会天花板。
