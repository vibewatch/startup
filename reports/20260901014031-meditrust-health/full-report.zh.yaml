      - number: '1.4'
        title: 融资历程、IPO 路径和里程碑延续
        blocks:
          - type: paragraph
            body: >-
              MediTrust Health 的融资史显示，这家公司扩张足够快，吸引了战略投资者和财务投资者。2021 年 Series C 融资超过 RMB2 billion，由 Boyu Capital 和
              Janchor Partners 联合领投；更早和更晚的融资报道把公司与 Ant Group、China Re、Shanghai Pharmaceuticals、Sinovation 以及最终作为战略 C+
              投资者的 HSBC 联系在一起。由备案资料衍生的报道把最好的公开估值锚点定在 C+ 轮的 RMB11.678 billion，并显示 IPO 前七轮融资累计超过 RMB3.1 billion。


              公开市场时间线同样关键。HKEX 指数数据和递表报道确认，公司于 2025-06-30 首次递交主板申请，首份申请失效后于 2026-01-16 重新递表。同一批报道点名 Goldman Sachs、CICC 和
              HSBC 为保荐人，说明公司处在严肃但尚未完成的 IPO 进程中。香港市场申请失效后重新递表并不罕见，但仍是需要警惕的里程碑，因为证明责任又回到经营表现和披露质量上。


              运营里程碑进一步强化了公司的生态角色。与 JW Therapeutics、Eisai、Mabwell、Sino Biopharm 的合作说明，MediTrust
              被用作创新药可及和报销赋能层，而不只是消费者药房门店。同时，Pedaily 2026 年 2 月关于 AI Inside 战略的报道显示，管理层正试图把多年积累的理赔、保单和支付数据转成更可防守的 AI
              层。这条演进线——从 Care2Pay，到多元支付基础设施，再到面向 IPO 的 AI 赋能平台——就是后续章节需要检验的核心时间轴。
