      - number: '1.3'
        title: 规模、牵引力和公开证据质量
        blocks:
          - type: paragraph
            body: >-
              即使完整申请材料尚未完全可得，公开可见规模已经有分量。由备案资料衍生的媒体报道称，截至 2024 年底，MediTrust 已服务约 1.6 million 名患者，中介累计 GPV 达 RMB39.7
              billion，合作保险公司超过 90 家，其中包括中国保费收入前 20 大保险公司的全部；连接药企超过 140 家，其中包括按 2024 年收入计全球前 20 大药企约
              90%。这些不是普通创业公司指标，而是生态级信号，说明公司已经成为高成本疗法商业化和支付可及的重要层。


              2026 年重新递表摘要显示，首轮递表后平台仍在增长：到 2025 年 10 月，累计患者约 2.0 million，GPV 达 RMB50.2 billion，保险公司超过 100
              家。与此同时，公开证据并不均衡。患者、保险公司、药企和 GPV 数字在留存来源中反复出现，可信度较高；但公开员工数并不清晰。招聘证据能证明公司具备多城市运营宽度，并仍在招 AI
              人才，却无法给出可防守的员工总数。因此，读者应把规模指标理解为对外部生态触达更强，对内部运营披露更弱。


              因此，公开证据足以支持“这是一家严肃公司”的结论，但还不足以抹平全部尽调缺口。从外部看，公司很大且有相关性；但内部运营细节仍有一定不透明度。这组张力很重要，因为它会在财务、客户和估值章节反复出现。
