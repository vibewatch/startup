  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层、买方 / 用户 / 支付方角色和采用规模
        blocks:
          - type: paragraph
            body: >-
              MediTrust 的客户基础比单边消费者健康 App
              更容易被误读。公司处在三边流程中：药企需要商业化和患者可及支持，保险公司需要产品设计和理赔运营，患者需要以可承受成本获得高价疗法。在这个结构里，付费客户往往在企业侧，用户常常是患者或保险运营人员，价值主张则取决于是否真的产生更多可支付治疗。披露的采用规模有意义。截至
              2024 年底，MediTrust 称其已服务约 1.6 million 名患者，并处理 RMB39.7 billion 累计医疗支出 GPV，同时连接超过 90 家保险公司和超过 140 家药企。到 2025
              年末，这些数字升至约 2.0 million 名患者、RMB50.2 billion GPV 和超过 100 家保险公司。历史报道补充了重要质感：早在 2021 年，Care2Pay 就被描述为与超过 50
              家药企和保险公司、2,000 多家 DTP 药房以及超过 400 个城市合作。2026 年政府对 Huibao 的报道又增加了一层规模证据：一个城市保险生态已经累计超过 33 million
              人次。正确解读是，MediTrust 不是把一个产品卖给一个买方；它在协调一个多方支付和可及网络，其规模看起来真实，即使经济性仍不透明。
