  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、风险评级和当前价格支撑
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这是一家有真实规模的严肃公司，但不足以在最后一轮私募估值上给出干净的后期价格背书。最强估值锚点仍是 2022 年 C+ 轮 RMB11.678
              billion。当时投资者承销的是快速增长，中国互联网医疗公司尚未经历完整公开市场重估，这个数字更容易防守。今天，同一估值约等于 2024 年收入的 5.7x，也略高于年化 2025 年收入的
              5x。对稀缺平台资产来说，这些倍数并不荒谬；但相对公开可比公司偏高，对一家 2025
              年前十个月亏损明显扩大的公司也偏苛刻。递表失效和重新递表又增加了一个警示，因为它显示通往流动性的路径并不顺畅。因此，正确立场应是有条件的。MediTrust
              作为差异化医疗支付基础设施公司仍具可投资性；但如果没有关于持久盈利、集中度和现金跑道的更好证据，公开记录不支持在 2022 年估值之上无保护地加价。相比只为叙事付全价，结构性轮次或折价入场更可防守。
