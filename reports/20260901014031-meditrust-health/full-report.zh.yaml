      - number: '8.3'
        title: 退出准备度、投资逻辑破裂触发点和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              最现实的问题不是 MediTrust 能不能讲出一个好故事，而是披露质量能否支撑它以强价格通过公开市场检验。JD 等公开同行有可访问的投资者关系页面和常规报告，而 MediTrust
              自身官网在检索时仍有部分页面受阻，多个私有同行来源也有门槛或噪音。估值折价往往不是来自市场不相信业务本身，而是来自投资者不信任围绕业务的计量系统，这一点很关键。MediTrust
              公开递表本身已是进展，但留存证据仍不足以让投资者放心判断客户集中度、留存、付费保险公司 AI 部署，或下行情景下的融资预案。这些缺口拉宽了估值区间，也削弱了任何单点估值的可信度。最重要的投资逻辑破裂触发点包括
              IPO
              再次长期延迟、重亏持续且没有现金补充，或新监管拖慢数字支付和药房工作流。如果管理层能补上披露缺口，并证明盈利有韧性，公司就能守住更接近上一轮的估值。在此之前，纪律严明的投资者要么要求结构化安排，要么要求价格保护，或者两者都要，然后才承销后期上行。
