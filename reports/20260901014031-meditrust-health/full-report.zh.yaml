      - number: '2.4'
        title: 增长驱动、采用约束和市场时点
        blocks:
          - type: paragraph
            body: >-
              最可信的乐观驱动来自政策与创新药可及、多元支付的同向。NMPA 2025 年 3 月改革意见明确支持创新药、支付多元化和更强的商业化基础设施；2026
              年监管修订延续了鼓励创新的立场，同时收紧线上药品销售合规。KPMG、IQVIA
              和药房渠道来源从不同角度描述了同一条需求曲线：中国在老龄化，创新肿瘤和自免疗法占比提升，数字基础设施让药房和理赔流程更可操作。这些力量为能够连接保险公司、药企和履约渠道的平台创造了真实需求。但约束同样实质。报销扩容往往伴随大幅降价，也就是说，患者可及性的增长不会自动转化为制造商或中介的强单位经济。2026
              年线上处方规则通过要求有效处方、实名购买、商户监测和药师审核，给运营加了更多纪律，同时明确禁止 AI 取代持证专业人员进行处方审核。更广泛的监管改革评论也指向更严格的生命周期、GMP
              和上市后义务。ChinaVenture 给出了最有用的独立提醒：一个庞大且政策支持的市场，如果获客、现金转化或资产负债表纪律跟不上交易量增长，平台仍未必能获得持久利润。因此，这个市场有吸引力，但并不无摩擦。
