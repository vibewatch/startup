  - id: TV005
    title: 投资逻辑破裂与止损触发表
    columns:
      - 触发事项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 再次长期延迟
        - 没有清晰上市路径或替代融资路径
        - 时间风险转化为偿付能力和议价能力风险
        - 立即切换到悲观情景承销
      - - 下一披露期亏损仍然沉重
        - 看不到从规模走向盈利的路径
        - 打破稀缺性溢价叙事
        - 拒绝任何上调估值，并要求更大折价
      - - 监管放慢 DTC / 数字支付流程
        - 摩擦或人工审核负担明显增加
        - 削弱增长，也削弱便利性护城河
        - 下调增长倍数，并降低基准情景区间
      - - 集中度或留存不及预期
        - 头部账户占比高于预期，或续约偏弱
        - 表明网络广度的经济厚度低于公司所称
        - 按集中型服务平台看待业务
    notes: 这些触发事项聚焦会改变估值的事件，而不是只会带来运营不便的事件。
