  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、结构和确认
        blocks:
          - type: paragraph
            body: >-
              MediTrust 的公开财务故事，是一个平台在医疗支付堆栈的多个层次变现，而不是收取单一清晰的软件费。由备案资料衍生的报道把 Smart Pharma 和 Smart Insurance
              描述为两条主要业务线，另有 BluePass 等消费者产品和 DTC
              药房界面。这个组合很关键，因为它意味着总报告收入几乎肯定混合了服务费、分发相关活动、支付方赋能合同、患者服务工作和部分消费者交易流。最好的量化锚点是收入曲线和 2024 年结构拆分：收入从 2022 年
              RMB1.069 billion 增至 2023 年 RMB1.255 billion、2024 年 RMB2.035 billion；其中 Smart Pharma 贡献约 59.3% 的 2024
              年收入，Smart Insurance 贡献约 35.9%。公开定价仍不透明，这强烈暗示 MediTrust
              靠谈判型企业项目和生态合同赢单，而不是靠可见价格表。这一点重要，因为报告收入对账户范围和合同结构的敏感度，高于简单 SaaS-ARR 视角所暗示的水平。因此，这家公司更像商业化与支付服务混合公司，而不是纯订阅
              SaaS 供应商。
