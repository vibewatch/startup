  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 增长维持接近 2025 年运行率，保险方 / 药企护城河被市场认可，盈利看起来近在眼前
        - ~RMB11.3B-RMB13.5B，约为 2025 年年化收入的 ~5.0x-6.0x
        - 需要市场忽略当前亏损，并接受稀缺性溢价
        - 公开证据下概率为低至中
      - - 基准
        - 公司相对多数上市可比公司有溢价，但相对上一轮私募标记有折价
        - ~RMB7.9B-RMB10.1B，约为 2025 年年化收入的 ~3.5x-4.5x
        - 需要没有重大监管冲击，并且融资路径可信
        - 基于当前证据，这是概率最高的结果
      - - 悲观
        - IPO 时间推迟、亏损延续，或上市可比公司的估值压力占主导
        - ~RMB4.5B-RMB6.8B，约为 2025 年年化收入的 ~2.0x-3.0x
        - 资本需求和披露缺口迫使估值重置
        - 如果市场环境恶化，这一情景很可能发生
    notes: 情景采用 2025 年年化收入作为最新的宽口径分母。这些是估值区间，不是点估计。
