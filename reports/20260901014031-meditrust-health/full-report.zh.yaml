      - number: '7.2'
        title: 运营、伙伴和数据治理风险
        blocks:
          - type: paragraph
            body: >-
              第二组主要风险是运营风险。MediTrust 的价值来自协调本来不在同一系统上运行的各方：保险公司、药企、药房、患者，以及内部 AI 或支付引擎。Bamboo Works
              给出了最清晰的独立警示：实践中这很难。保险公司常运行在遗留 IT 堆栈上，数据碎片化，流程标准化薄弱。这意味着，放大面向保险公司的 AI
              故事不只是产品挑战，也是跨交易对手的变革管理挑战。公司也仍依赖伙伴基础设施。轻资产模式有助于避免自营大规模药房网络的拖累，但服务连续性取决于保险公司数据访问、药企项目经济性，以及药房或 DTP
              伙伴的渠道执行。数据治理风险也在同一组风险里。Pedaily 明确指出，理赔、保单和支付数据是 AI 堆栈的战略燃料；Freyr
              关于更严格生命周期合规和供应链审计的讨论则强化了一个判断：运营复杂度会继续上升，而不是变平。留存公开记录仍缺少关于安全控制、事故历史或模型治理的决策级披露。换句话说，平台在运营上可能真实存在，但在监管者和企业买方最关心的位置仍部分不透明。
