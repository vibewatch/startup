      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 资本充足性
        - 融资窗口恶化
        - IPO 再次延迟，且没有备用资金或清晰资金跑道延长方案
        - 暂停激进估值，重新承销偿债路径
      - - 线上药房合规
        - 执法强度上升
