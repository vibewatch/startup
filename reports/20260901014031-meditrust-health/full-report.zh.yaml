      - number: '6.2'
        title: 具名客户证据、渠道触达和扩展面
        blocks:
          - type: paragraph
            body: >-
              最有说服力的客户证据来自具名药企和疗法伙伴，而不是匿名统计。Eisai 显示 MediTrust 嵌入从预防到治疗再到支付的疾病服务流程。Mabwell 显示该模式被用于自免疾病、骨健康和肿瘤，并明确提到
              One-Code Direct Payment 和商业保险路径。Sino Biopharm 把这一模式扩展到一家追求药险融合的大型本土药企集团；JW Therapeutics 则显示架构延伸到 CAR-T
              可负担性和补充型商业保险设计。合在一起看，这些不是轻量级联合营销公告：它们显示公司围绕高成本创新疗法反复部署，而支付设计会实质影响采用。渠道故事也支持这个结论。历史证据指向广泛 DTP
              药房和城市覆盖，后续报道称网络已扩张到全国超过 30,000 家药房。来自 China Daily、上海主管部门和 Hubbis 的额外政策与生态报道也显示，MediTrust 的客户触面超出直接
              logo，延伸到城市保险项目和金融机构渠道。证据组合仍不够均衡：公开记录中具名药企客户更丰富，而具名保险公司较少，尽管保险公司看起来是收入质量和经营杠杆的核心。
