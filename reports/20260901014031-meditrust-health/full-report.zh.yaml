      - number: '4.2'
        title: 利润率结构、经营杠杆和盈利质量
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的部分，是 2022–2024 年的改善方向。三年里，毛利从 RMB332 million 增至 RMB729 million，毛利率也从 2022 年的 31.08% 明显提升到此后的
              mid-30s。销售强度也大幅改善，销售费用从 2022 年超过收入一半，降至 2024 年约三分之一。Chinaventure 对 Smart Insurance 线的讨论尤其重要，因为它报告该分部 2024
              年毛利率为 81.5%，支持 MediTrust 正在转向更高质量服务组合的判断。净亏损从 2022 年 RMB446 million 收窄至 2024 年 RMB76 million，看起来像强劲经营杠杆。但
              2025 年前十个月让故事复杂化：收入仍高达 RMB1.873 billion，净亏损却再次扩大到 RMB389
              million。这个组合意味着公司可能仍背负启动、投资或营运资本负担，而这些负担在简化的公开摘要中并不可见。自由现金流的持久性也仍未解决。最佳解读不是 2024
              年改善是假的，而是持久性尚未被证明。公开证据支持单位经济改善，但不支持财务成熟已经完成。
