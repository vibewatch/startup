      - number: '7.3'
        title: 资本、竞争和治理风险
        blocks:
          - type: paragraph
            body: >-
              最后一组风险最可能决定未来 12 到 24 个月的投资者结果。公开递表流程已经显示时间摩擦：首次香港申请失效，公司不得不在 2026 年重新递表。如果现金生成已经安全，这件事影响会小得多；但第三方分析指向
              2025 年 4 月现金储备大幅下降、持续净亏损、2024 年仍为负经营现金流，以及尚未偿还的银行债务。因此，资本充足性是现实风险，不是理论风险。竞争会放大问题。JD Health 规模大得多；Ping An
              Good Doctor 已经盈利，并与保险渠道深度绑定；Fangzhou 则在相邻互联网医疗流程中展示了盈利性的 AI 赋能增长。MediTrust
              可能比这些同业都更专业，但专业化不能消除更大上市公司在渠道触达、品牌或打包产品上加大投入的风险。治理又加了一层。创始人持股仍集中，股东基础包括 Shanghai Pharmaceuticals 和 Ant
              Group。Ant 自身监管历史不会直接损害 MediTrust
              运营，但在公开市场环境中会增加标题和感知风险。如果市场窗口再次关闭，也看不到清晰的公开备用融资方案。合在一起，资本充足性、竞争和治理应成为尽调监控的最高优先级领域。
