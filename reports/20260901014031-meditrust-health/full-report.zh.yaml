  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：大型平台、保险主导运营商和相邻商业化网络
        blocks:
          - type: paragraph
            body: >-
              MediTrust 所在的竞争版图，远不只是几款医疗健康 App 的简单清单。最有用的组织方式是按待完成任务来划分。第一类是已上市的互联网医疗和药房龙头，尤其是 JD
              Health；它的收入和市值远大于本组其他可比公司，分发能力也让它在买方想要一站式药房、配送和数字健康服务时，成为可信替代或打包威胁。第二类是 Ping An Good
              Doctor，它是保险相关医疗赋能上最接近的上市类比公司，因为它明确在规模化变现商业保险和企业健康流程。第三类是
              Fangzhou，它证明慢病管理、医生网络和药企服务模式即使公开市场估值偏弱，也能达到较大消费者规模。第四类是 Yuanxin Tech 等线上线下一体化的相邻商业化网络，以及影响较小的 WeDoctor
              早期平台模式。第五类是在企业采购中往往最关键的替代方案：大型保险公司或药企内部自建，以及医疗服务方、分销商和患者援助项目之间碎片化的现状流程。在这张地图上，MediTrust
              不是最大的平台；但在当前公开证据中，它最专注于创新药支付问题。
