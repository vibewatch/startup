      - number: '2.3'
        title: 买方、用户、支付方和流程分层
        blocks:
          - type: paragraph
            body: >-
              MediTrust
              的市场在结构上是多边的。当目标是加速高价疗法可及时，药企是最清晰的经济买方：市场准入、商业化、患者服务和数据团队会为工具付费，帮助药品进入商业保险产品、融资方案和专科配药网络。保险公司是第二组核心买方：产品、精算、理赔、运营和健康管理团队需要定价、权益设计、核赔和增值服务伙伴，才能卖出差异化健康产品，同时不失去风险控制。医院和
              DTP
              药房是必要的流程节点，但通常不是主要战略预算拥有者；它们重要，是因为处方开具、交接、配药和后续照护都会经过这些节点。患者是最直接感受摩擦的终端用户，但很少是唯一支付方。最终支付往往由保险报销、雇主计划支持、PAP
              或慈善叠加、融资产品和自付共同构成。因此，普通 SaaS 买方地图不够用：MediTrust
              参与的是一段旅程，从诊断和处方开始，经过保障设计和资格判断，最后才变成真实已支付理赔或直付事件。买方—用户—支付方分裂的复杂性，本身就是公司市场逻辑的一部分。
