      - number: '2.2'
        title: 规模测算视角：从狭义实时支付到医药经济上限
        blocks:
          - type: paragraph
            body: >-
              留存证据支持多个规模测算视角，而不是一个单一、干净的 TAM 数字。最窄、也最贴近当前资金流的视角来自 2026 年与 China Re Life 联合发布的白皮书：2025
              年，创新药和创新器械的商业保险支付达到 RMB15.2 billion。这个数字有用，因为它反映 MediTrust
              正在组织的精确多支付方细分场景中的实际已支付流量。更宽的中间层来自由备案资料衍生的市场数据：不含基本医保的中国创新药解决方案市场 2024 年 GPV 为 RMB91.0 billion，预计 2030 年达到
              RMB243.3 billion。再往上是更宽的商业健康险保费池，2019 年为 RMB242.9 billion，2024 年增至 RMB430.0 billion，预计 2030 年约 RMB1.3517
              trillion。这些数字不能直接相加；它们代表同一堆栈的不同层。更宽的上限还要大得多：IQVIA 预计中国医药市场 2028 年达到 RMB1.351 trillion，KPMG 则给出 2024 年
              US$226.7 billion、2035 年 US$448.0
              billion。与此同时，药房渠道研究和线上药品零售数据表明，配药和最后一公里基础设施已经非常庞大。正确结论是：市场无疑很大，但如果没有对抽成率、支付方结构和履约路径份额的假设，公开证据无法支撑精确的
              MediTrust 专属 SOM。
