- id: leadership-governance
  title: Leadership, governance, and ownership concentration
  body: |-
    Governance is still founder-shaped. Filing-derived coverage identifies Zhang Xiaodong as founder, CEO, general manager, and the largest single shareholder with a 26.22% aggregate stake. That is strategically positive because the business model requires sustained ecosystem negotiation across insurers, pharma companies, and provider channels; it is also a concentration risk because the public record ties the company's strategy, capital formation, and AI narrative unusually tightly to a small leadership nucleus.

    The 2026 refiling summary discloses an 11-member board with three executive directors, four non-executive directors, and four independent non-executive directors. The executive layer centers on Zhang Xiaodong, vice chairman Huang Peijie, and CFO / joint company secretary Qi Lei. The board chair is Li Zhigang, who also comes from the Shanghai Pharmaceuticals ecosystem, making the governance picture explicitly linked to one of the company's strategic shareholders. Media summaries also point to Ant Group and Sinovation-linked investors among the top shareholders, while sponsor coverage names Goldman Sachs, CICC, and HSBC on the IPO path.

    The main diligence implication is not that governance looks weak; it is that governance looks highly networked. Founder control, large strategic shareholders, and sponsor-heavy capital-markets preparation can help distribution and credibility. But this same structure increases key-person sensitivity and means later chapters should track related-party influence, board independence in practice, and whether strategic investors are aligned with public minority shareholders.
