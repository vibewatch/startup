company:
  name: MediTrust Health
chapter:
  number: 1
  title: Company Overview
  summary: |-
    MediTrust Health is a Shanghai-founded 2017 healthcare payment platform that has expanded from Care2Pay / One-Code Direct Payment into a wider Smart Pharma and Smart Insurance stack supported by mind42.ai, MediTrust Rx, and MediTrust Healthcare. Filing-derived coverage says the company served about 1.6 million patients and RMB39.7 billion GPV by end-2024, then about 2.0 million patients and RMB50.2 billion GPV by October 2025, while revenue grew from RMB1.069 billion in 2022 to RMB2.035 billion in 2024 and net loss narrowed to RMB76 million. Founder-CEO Zhang Xiaodong remains the largest single shareholder at 26.22%, and the company is on a live-but-unfinished HKEX path after filing in June 2025 and refiling in January 2026 after the first application lapsed.
sections:
- id: identity-platform
  title: Identity, market position, and operating model
  body: |-
    MediTrust Health is a Shanghai-founded 2017 healthcare-fintech platform built around one core idea: expensive innovative medicines in China do not scale through a single payer, so payment orchestration matters as much as clinical access. Retained IPO coverage consistently describes the company as China's largest diversified pharmaceutical payment platform and frames its role as an intermediary among patients, insurers, and pharmaceutical companies rather than as a pure online-pharmacy or software-only vendor.

    The operating model shown across the 2025 filing coverage, the 2026 refiling coverage, and earlier financing materials is broader than the original Care2Pay / One-Code Direct Payment wedge. MediTrust now organizes its offer around Smart Pharma and Smart Insurance. Smart Pharma handles commercialization support for drug makers, such as integrating commercial insurance, patient-management programs, and diversified payment supply-chain options. Smart Insurance provides end-to-end design, distribution, claims-operation, and value-added health-management support for insurers trying to sell more useful medical products. One-Code Direct Payment remains the consumer-facing proof point because it turns that platform logic into a patient workflow that can identify payment eligibility and complete direct-billing transactions.

    What makes this chapter important for the rest of the report is that MediTrust is not just a claims tool, not just an online health service, and not just a DTP pharmacy link. The retained sources describe a three-layer stack: mind42.ai for analytics and automation, MediTrust Rx for supply-chain and payment connectivity, and MediTrust Healthcare for health-service and physician-network enablement. That framing explains why later chapters should evaluate the company as a multi-sided infrastructure business rather than a single-feature app.
