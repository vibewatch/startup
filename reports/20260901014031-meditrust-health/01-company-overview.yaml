  evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount-disclosure
    missingEvidence: A current employee count from the company, an exchange filing, or a regulator-linked profile.
    whyItMatters: Headcount is a standard late-stage operating metric and affects cost-base, execution capacity, and runway analysis in later chapters.
    diligencePath: Request an updated employee total from investor relations or obtain a full application proof / annual filing that includes workforce statistics.
    relatedQuestionRefs:
    - QO016
  - type: missing-source
    severity: material
    topic: debt-and-credit-facilities
    missingEvidence: A primary disclosure of bank facilities, borrowings, or other credit arrangements outstanding before the IPO.
    whyItMatters: Capital-structure detail is needed to separate equity-funded growth from balance-sheet risk and to support the later financials chapter.
    diligencePath: Obtain the full application proof or audited financial statements that include borrowings, cash, and maturity schedules.
    relatedQuestionRefs:
    - QO014
  - type: conflicting-data
    severity: minor
    topic: governance-lineup-change
    missingEvidence: A side-by-side primary source confirming whether the vice-chair or board lineup changed between the June 2025 filing and the January 2026 refiling.
    whyItMatters: Governance continuity matters for key-person and sponsor-readiness analysis, but the current discrepancy is not large enough to block the overview.
    diligencePath: Compare the complete 2025 and 2026 application proof documents rather than relying on media summaries.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-partial-coverage
    missingEvidence: A full pre-IPO shareholder table covering every sub-5% investor, board observer, and any secondary transfer before listing.
    whyItMatters: The stakeholder map is decision-useful but not exhaustive, so later ownership or governance analysis could miss minor but meaningful rights holders.
    diligencePath: Use the full application proof cap-table and lock-up schedule to expand the stakeholder enumeration.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-partial-coverage
    missingEvidence: The complete first-submission and refiling document sets, including every appointment notice and submittal revision.
    whyItMatters: The milestone table intentionally captures only the most material public events, so a more exhaustive chronology may matter for refresh work.
    diligencePath: Extract the complete event history from the original HKEX application proof package and related announcements.
    relatedQuestionRefs:
    - QO021
