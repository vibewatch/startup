company:
  name: MediTrust Health
chapter:
  number: 2
  title: Market Analysis
  summary: |-
    MediTrust Health operates inside a specific and growing slice of China's healthcare economy: the innovative-drug payment and commercialization layer that sits between pharmaceutical companies, commercial insurers, providers, and patients. The retained evidence supports several nested market lenses rather than one flat TAM. The narrowest current-flow lens is the RMB15.2 billion of commercial-insurance payments for innovative drugs and devices recorded in 2025; the closest category lens to MediTrust's thesis is the RMB91.0 billion innovative-drug-solution GPV market in 2024, projected to reach RMB243.3 billion by 2030; and the broader upstream commercial-medical-insurance premium pool reached RMB430.0 billion in 2024 with a 2030 projection of roughly RMB1.35 trillion. Policy support, aging-driven specialty-drug demand, and digitized pharmacy channels are strong tailwinds, but price pressure, strict online-prescription rules, and the need for human-reviewed compliance workflows prevent this from being an effortless software market.
sections:
- id: market-definition
  title: Market Boundary, Included Spend, and Substitutes
  body: |-
    MediTrust Health should not be analyzed as a generic telehealth company or as a proxy for the entire Chinese pharmaceutical market. Its real addressable arena is narrower and more decision-useful: the layer where innovative-drug commercialization, commercial insurance, patient financing, DTP pharmacy routing, and direct-payment orchestration meet. Filing-derived coverage repeatedly frames the company around financing and payment frictions faced by patients, insurers, and pharmaceutical companies, not around routine primary-care traffic or basic medical-insurance reimbursement. That means the included spend pool is the part of healthcare expenditure that requires payment design, patient-access support, or channel coordination for high-value therapies. In practice, that covers commercial-insurance-linked claims, supplementary-city or employer health plans, patient-assistance and financing workflows, and the fulfillment routes that move specialty prescriptions to patients. The main substitutes are still fragmented manual processes: self-pay, charity/PAP mechanisms, insurer in-house benefit design, and direct pharma commercial teams pushing hospital or DTP uptake without a neutral orchestration layer. This boundary matters because it avoids inflating TAM with categories MediTrust does not directly monetize, while still preserving the adjacent scale of hospitals, pharmacy retail, and broader pharma spending that set the opportunity ceiling.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM015
