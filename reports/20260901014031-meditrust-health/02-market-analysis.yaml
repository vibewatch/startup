- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Policy support for innovative-drug access and diversified payment
    - Positive
    - Now
    - Expands legitimacy for multi-payer models
    - Which policies create monetizable contracts rather than only system volume?
  - - Growth in commercial medical insurance
    - Positive
    - 2024-2030
    - Expands the premium pool and product experimentation
    - How much of premium growth flows into specialty-drug benefits?
  - - Aging population and oncology / rare-disease demand
    - Positive
    - Structural
    - Sustains need for high-value therapy access tools
    - Which therapy categories drive the highest take rate?
  - - Digital pharmacy and online-drug infrastructure
    - Positive
    - Now
    - Improves fulfillment and patient handoff
    - How much of channel growth is actually reachable by MediTrust?
  - - Price concessions / NRDL pressure
    - Negative
    - Structural
    - Can compress economics even as access expands
    - Do lower drug prices reduce platform revenue pools?
  - - 2026 online prescription-sales rules
    - Negative / disciplining
    - Immediate
    - Raises compliance burden and constrains AI-only automation
    - How costly is human review at scale?
  - - Lifecycle GMP and post-market regulation
    - Negative / disciplining
    - 2025-2027
    - Raises operating and partner compliance requirements
    - Which partners bear the heaviest compliance cost?
  notes: 'Several items act as both drivers and constraints: they expand the market while also increasing compliance and pricing pressure.'
