summary:
  headline: >-
    MediTrust Health is a real scaled China healthcare-payments infrastructure asset with strong
    insurer and pharma reach, but current public evidence still points to high execution and pricing
    risk, making the last private valuation look stretched unless investors get better disclosure,
    a discounted entry, or explicit downside protection.
