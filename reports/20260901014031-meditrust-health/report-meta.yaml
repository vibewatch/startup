    One-Code Direct Payment, MediTrust Rx, and mind42.ai / insurer-enablement tools for payment
    routing, reimbursement support, patient management, and innovative-drug access.
  customerFocus: >-
    Commercial insurers, pharmaceutical companies, patients requiring expensive specialty therapies,
    and channel partners such as hospitals, DTP pharmacies, and municipal insurance programs.
  businessModel: >-
    MediTrust monetizes a blended mix of pharmaceutical-commercialization support, insurer
    enablement, patient-service programs, direct-payment orchestration, and adjacent supply-chain /
    pharmacy workflows rather than a single pure-SaaS subscription stream.
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
