  topStrengths:
    - 生态规模看得见：公开来源一致支持截至 2025 年 10 月累计患者约 2.0 million、GPV RMB50.2 billion、100+ 家保险合作方和 140+ 家药企合作方。
    - 平台不像简单互联网医疗同行，它卡在患者、保险公司、药企和医疗渠道之间的支付规则与报销层。
    - 到 2024 年，财务进展明显：收入升至 RMB2.035 billion，毛利率改善，销售强度下降，净亏损较 2022 年大幅收窄。
    - 股东和融资底座可信，包含 Ant Group、Shanghai Pharmaceuticals、Boyu、Janchor、HSBC 等战略和机构名字。
  topRisks:
    - 盈利尚未稳住：2024 年净亏损收窄至 RMB76 million 后，2025 年前 10 个月仍录得更大的 RMB389 million 亏损。
    - 上市中国数字医疗同行收入倍数明显低于 MediTrust 2022 年 C+ 轮标记隐含水平，估值支撑偏弱。
    - 作为后期公司，披露质量仍不完整：采集时官方页面部分受阻，公开来源也无法回答现金跑道、集中度、留存和合同经济性等关键尽调问题。
    - 创新药可及、线上药房和保险支付流程在中国政策敏感、运营复杂，监管和执行风险仍高。
    - IPO 失效再申报路径意味着，时间风险仍可能直接传导为融资压力和定价让步。
  unresolvedGaps:
    - 公开来源仍未披露现金跑道、备用融资计划，或 IPO 时点再次滑后的管理层级流动性桥。
    - 客户集中度、续约率和净收入留存公开不可见，保险和药企关系的耐久性仍未被充分证明。
    - 面向保险公司的 AI 和自动化产品（如 mind42.ins）尚未拿出决策级 monetization 证据。
    - 一手官方披露仍比上市同行更薄，拉宽估值区间，也降低对任何精确点估计的信心。
    - 仅凭保留的公开证据，过往融资轮对资本结构的确切影响仍不清晰。
