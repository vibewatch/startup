summary:
  headline: MediTrust Health 是中国真实成规模的医疗支付基础设施资产，保险和药企触达强；但现有公开证据仍显示执行和定价风险高。除非投资人拿到更充分披露、折价入场或明确下行保护，否则上一轮私募估值偏高。
