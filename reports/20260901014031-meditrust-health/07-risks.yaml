  evidenceGaps:
  - type: missing-metric
    severity: high
    topic: control-transparency
    missingEvidence: No retained public evidence provides uptime, incident, security-audit, or model-governance metrics for MediTrust's core workflows.
    whyItMatters: A company operating on medical, claims, and payment data can look commercially credible while still carrying hidden operational or regulatory risk.
    diligencePath: Request security certifications, incident logs, SLA dashboards, privacy controls, and model-governance documentation.
    relatedQuestionRefs:
    - QR015
    - QR017
    relatedTableRefs:
    - TR002
  - type: missing-metric
    severity: high
    topic: concentration
    missingEvidence: No retained public evidence discloses top-customer, top-program, or top-partner concentration by revenue, GPV, or gross profit.
    whyItMatters: Diversified headline counts can conceal economically concentrated exposure, which magnifies downside if a few anchor relationships move.
    diligencePath: Request top-10 concentration, largest-program economics, and account-level renewal history.
    relatedQuestionRefs:
    - QR026
    - QR024
    relatedTableRefs:
    - TR003
  - type: missing-proof
    severity: medium
    topic: legal-cleanliness
    missingEvidence: The retained public source set does not provide a decision-grade legal or enforcement history package for MediTrust itself.
    whyItMatters: For a heavily regulated cross-sector platform, absence of disclosed incidents is not equivalent to verified compliance cleanliness.
    diligencePath: Request litigation schedule, regulator inquiry history, partner audit findings, and internal compliance incident reporting.
    relatedQuestionRefs:
    - QR009
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-corroboration
    severity: medium
    topic: funding-contingency
    missingEvidence: Public evidence shows IPO dependence and cash pressure but not a documented contingency-financing plan if market windows close.
    whyItMatters: Late-stage funding risk can dominate every other operating strength if no credible backup capital path exists.
    diligencePath: Request runway model, downside plan, lender terms, and strategic-investor bridge options.
    relatedQuestionRefs:
    - QR002
    - QR028
    - QR029
    relatedTableRefs:
    - TR005
