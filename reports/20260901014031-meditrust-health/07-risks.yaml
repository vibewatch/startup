- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Capital adequacy
    - Funding window deteriorates
    - IPO delayed again without backup funding or clear runway extension
    - Pause aggressive valuation and re-underwrite solvency path
  - - Online-pharmacy compliance
    - Enforcement intensity rises
    - Material operating restrictions on digital prescription or DTC workflows
    - Cut growth assumptions for DTC and settlement speed
  - - Competitive pressure
    - Public peers widen profitability or share gap
    - JD / Ping An / Fangzhou keep scaling while MediTrust remains loss-making
    - Demand larger valuation discount and clearer moat proof
  - - Data / control risk
    - Control disclosure remains weak
    - No security, SLA, or model-governance package during diligence
    - Treat enterprise-sales and regulatory risk as under-mitigated
  - - Partner concentration
    - Revenue concentration revealed
    - Top accounts or programs dominate beyond acceptable threshold
    - Reframe company as concentrated services platform rather than diversified network
  notes: These are IC-style decision triggers rather than operational KPIs. They translate qualitative risk into actionable diligence thresholds.
