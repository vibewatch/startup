  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Risk Rating, and Current Price Support
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a serious company with real scale, but not a clean late-stage price
              endorsement at the last private mark. The strongest valuation anchor remains the 2022 C+ round at
              RMB11.678 billion. That number looked more defendable when investors were underwriting rapid growth and
              before the full public market reset in China healthcare internet names. Today, the same mark implies
              roughly 5.7x on 2024 revenue and a little above 5x on an annualized 2025 revenue base. Those are not
              absurd multiples for a rare platform asset, but they are demanding relative to the public comp set and
              demanding for a business that still showed a much wider loss in the first ten months of 2025. The filing
              lapse and refiling add another caution flag because they show the path to liquidity has not been
              frictionless. The correct stance is therefore conditional. MediTrust remains investable as a
              differentiated healthcare-payments infrastructure company, but the public record does not support paying a
              clean step-up above the 2022 mark without better evidence on durable profitability, concentration, and
              cash runway. A structured round or a discounted entry is more defensible than paying full price on
              narrative alone.
            claimRefs:
              - CV001
