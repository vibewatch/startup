  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Mix, and Recognition
        blocks:
          - type: paragraph
            body: >-
              MediTrust's public financial story is that of a platform whose monetization spans several layers of the
              healthcare-payment stack rather than a single clean software fee. Filing-derived coverage describes Smart
              Pharma and Smart Insurance as the two main business lines, with additional consumer-facing products such
              as BluePass and a DTC pharmacy surface. That mix matters because it means total reported revenue almost
              certainly blends service fees, distribution-linked activity, payer enablement contracts, patient-service
              work, and some consumer transaction flows. The best quantitative anchors are the top-line trajectory and
              the 2024 mix split: revenue rose from RMB1.069 billion in 2022 to RMB1.255 billion in 2023 and RMB2.035
              billion in 2024, while Smart Pharma contributed about 59.3% of 2024 revenue and Smart Insurance about
              35.9%. Public pricing remains opaque, which strongly suggests that MediTrust wins business through
              negotiated enterprise programs and ecosystem contracts rather than through visible price cards. That is
              important because it makes reported revenue more sensitive to account scope and contract structure than a
              simple SaaS-ARR lens would imply. This makes the business more comparable to a hybrid
              commercialization-and-payments services company than to a pure subscription-SaaS vendor.
