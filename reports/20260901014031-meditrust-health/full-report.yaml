      - number: '7.3'
        title: Capital, Competition, and Governance Risks
        blocks:
          - type: paragraph
            body: >-
              The final risk cluster is the one most likely to determine investor outcomes over the next 12 to 24
              months. The public filing process already shows timing friction: the first Hong Kong application lapsed,
              and the company had to return with a fresh filing in 2026. That would matter less if cash generation were
              already secure, but third-party analysis points to sharply lower cash reserves by April 2025, continued
              net losses, negative operating cash flow through 2024, and remaining bank debt. This makes capital
              adequacy a live risk, not a theoretical one. Competition compounds the problem. JD Health is vastly
              larger, Ping An Good Doctor is profitable and deeply linked to insurance channels, and Fangzhou is
              demonstrating profitable AI-enabled growth in adjacent internet-health workflows. MediTrust may be more
              specialized than each of these peers, but specialization does not remove the risk that bigger listed
              companies out-invest it on channel access, branding, or bundled offerings. Governance adds a final layer.
              Founder ownership remains concentrated, while the shareholder base includes Shanghai Pharmaceuticals and
              Ant Group. Ant's own regulatory history does not create direct operational impairment for MediTrust, but
              it does add headline and perception risk in a public-market context. There is also no clearly visible
              public backup financing plan if market windows close again. Put together, these factors make capital
              adequacy, competition, and governance the highest-priority areas for diligence monitoring.
