      - number: '3.2'
        title: 'Capability, Scope, and Pricing: Where MediTrust Is Narrower but Deeper'
        blocks:
          - type: paragraph
            body: >-
              The capability comparison turns on depth versus breadth. JD Health has unmatched scale and likely the
              strongest pharmacy-distribution posture, but its disclosed model is far broader than innovative-drug
              payment. Ping An Good Doctor is the most relevant public comparator for insurance-healthcare integration:
              it discloses both an insurance-enablement revenue stream and a direct-settlement network, which makes it
              strategically closer to MediTrust than JD is. Fangzhou is strong where chronic-disease management,
              physician traffic, and pharmacy operations intersect. WeDoctor remains notable historically, but the
              public record available in this run is thinner and internally inconsistent on funding totals. Yuanxin Tech
              matters because it demonstrates that large, integrated online-offline pharmacy and commercialization
              networks can coexist with repeated Hong Kong listing attempts and private valuations above many listed
              peers. Pricing itself is mostly opaque. The absence of transparent price cards across the peer set implies
              that competition is negotiated account by account and often embedded in broader insurer, employer,
              pharmacy, or pharma relationships. It also means procurement strength may sit in settlement speed, partner
              onboarding, and coverage design rather than in a visible sticker price. That dynamic benefits companies
              with partner access and process integration rather than the best publicly advertised per-unit price.
