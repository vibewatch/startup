        title: Operational, Partner, and Data-Governance Risks
        blocks:
          - type: paragraph
            body: >-
              The second major risk cluster is operational. MediTrust's value comes from coordinating parties that do
              not naturally run on one system: insurers, pharmaceutical companies, pharmacies, patients, and internal AI
              or payment engines. Bamboo Works provides the clearest independent warning that this is difficult in
              practice. Insurers often operate on legacy IT stacks, data is fragmented, and workflow standardization is
              weak. That means scaling the insurer-facing AI story is not just a product challenge but a
              change-management challenge across counterparties. The company also remains dependent on partner
              infrastructure. Its lighter-asset model helps avoid the drag of owning large pharmacy fleets, yet it
              leaves service continuity dependent on insurer data access, pharmaceutical-program economics, and channel
              execution by pharmacies or DTP partners. Data-governance risk sits inside this same cluster. Pedaily makes
              clear that claims, policy, and payment data are strategic fuel for the AI stack, while Freyr's discussion
              of tighter lifecycle compliance and supply-chain audits reinforces that operating complexity will keep
              increasing rather than flattening. The retained public record still lacks decision-grade disclosure on
              security controls, incident history, or model governance. In other words, the platform may be
              operationally real while still being partially opaque in the exact place where regulators and enterprise
              buyers care most.
