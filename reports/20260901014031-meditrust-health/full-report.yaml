      - number: '1.4'
        title: Funding chronology, IPO path, and milestone carry-forward
        blocks:
          - type: paragraph
            body: >-
              MediTrust Health's capital history shows a business that scaled fast enough to attract both strategic and
              financial investors. The 2021 Series C brought in more than RMB2 billion with Boyu Capital and Janchor
              Partners as co-leads, while earlier and later financing coverage links the company to Ant Group, China Re,
              Shanghai Pharmaceuticals, Sinovation, and eventually HSBC as a strategic C+ investor. Filing-derived
              coverage pegs the best public valuation marker at RMB11.678 billion from the C+ round, and total pre-IPO
              financing above RMB3.1 billion across seven rounds.


              The public-market timeline matters just as much as the private capital timeline. HKEX index data and
              filing coverage confirm an initial Main Board submission on 2025-06-30 and a refiling on 2026-01-16 after
              the first application lapsed. The same reporting names Goldman Sachs, CICC, and HSBC as sponsors, which
              places the company in a serious but not yet completed IPO process. Lapse-and-refile is not unusual in Hong
              Kong, but it is still a cautionary milestone because it pushes the burden of proof back onto operating
              performance and disclosure quality.


              Operational milestones reinforce the company's ecosystem role. Partnerships with JW Therapeutics, Eisai,
              Mabwell, and Sino Biopharm show that MediTrust is being used as an innovative-drug access and
              reimbursement-enablement layer, not merely as a consumer pharmacy storefront. Meanwhile, Pedaily's
              February 2026 reporting on the AI Inside strategy shows that management is now trying to convert years of
              claims, policy, and payment data into a more defensible AI layer. That progression — from Care2Pay, to
              diversified payment infrastructure, to IPO-ready AI-enabled platform — is the central chronology later
              chapters should test.
