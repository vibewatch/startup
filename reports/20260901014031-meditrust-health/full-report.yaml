      - number: '2.3'
        title: Buyer, User, Payer, and Workflow Segmentation
        blocks:
          - type: paragraph
            body: >-
              MediTrust's market is structurally multi-sided. Pharmaceutical companies are the clearest economic buyers
              when the objective is to accelerate access for expensive therapies: market-access, commercialization,
              patient-services, and data teams pay for tools that help move drugs into commercial-insurance products,
              financing plans, and specialty-dispensing networks. Insurers are the second core buyer set: product,
              actuarial, claims, operations, and health-management teams need pricing, benefit design, adjudication, and
              value-added-service partners to sell differentiated health products without losing control of risk.
              Hospitals and DTP pharmacies are essential workflow nodes but are usually not the primary strategic budget
              owners; they matter because prescription origination, handoff, dispensing, and after-care all pass through
              them. Patients are the end users who experience the friction most directly, but they are rarely the sole
              payer. Final payment often combines insurer reimbursement, employer-plan support, PAP or charity overlays,
              financing products, and out-of-pocket spend. This is why an ordinary SaaS buyer map is insufficient:
              MediTrust participates in a journey that begins with diagnosis and prescription, moves through coverage
              design and eligibility, and only then turns into an actual paid claim or direct-billing event. The
              complexity of the buyer-user-payer split is itself part of the company's market rationale.
