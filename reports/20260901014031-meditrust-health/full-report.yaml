      - number: '4.3'
        title: Funding History, Liquidity Pressure, and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              MediTrust raised enough private capital to build a real platform, but the retained evidence does not
              support complacency on liquidity. The company completed more than RMB3.1 billion of financing across seven
              rounds, highlighted by the 2021 Series C of more than RMB2 billion and a 2022 C+ round that established
              the clearest valuation marker at RMB11.678 billion. Those rounds brought in investors such as Boyu,
              Janchor, HSBC, Ant Group, and Shanghai Pharmaceuticals, which is important positive proof of sponsor
              quality. The problem is the cash-consumption pattern described by Chinaventure: cash and equivalents
              reportedly fell from RMB2.201 billion at end-2021 to RMB166 million by April 2025, while 2024 also
              included RMB587 million of bank-debt repayment and April 2025 still showed RMB259 million of
              interest-bearing borrowings. On that evidence, the HKEX IPO is not just a prestige event but a meaningful
              capital-adequacy lever. It may also be the first chance for outside investors to test whether the company
              can refinance growth on better terms than another private round. Relative to listed peers such as JD
              Health, Ping An Good Doctor, and Fangzhou, MediTrust remains a smaller, less transparent, and less
              battle-tested financial story, especially for public-market style diligence committees. The underwriting
              conclusion should therefore be that capital access exists, but the platform is still dependent on proving
              that volume growth can convert into sustained cash generation.
