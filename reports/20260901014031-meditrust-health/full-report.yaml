      - number: '8.2'
        title: Comparable Set, Premium Logic, and Bull/Base/Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Comparable work points in two directions at once. On the positive side, MediTrust is more specialized than
              many internet-health names because it is not just aggregating patient traffic or retail drug sales; it
              sits inside the payment-rule layer connecting insurers, innovative-drug manufacturers, pharmacies, and
              patients. That is the best argument for a premium to commodity pharmacy or simple telehealth valuations.
              On the negative side, the public multiple evidence is much lower than the last MediTrust mark. JD Health
              trades at roughly 1.28x sales, Ping An Good Doctor around 2.20x, and Fangzhou about 0.22x. Even allowing
              for business-model differences, that range shows how hard it is to justify a broad public-market step-up
              on current evidence. Adjacent private benchmarks such as Yuanxin Tech and WeDoctor are directionally
              useful, but both come with caveats: adjacent companies may not share the same mix, and private-data
              sources are less reliable than listed disclosures. That leads to a scenario framework rather than a single
              answer. The bull case requires the market to continue valuing MediTrust as a scarce platform and to
              believe profitability is around the corner. The base case assumes a premium to public comps, but a
              significant discount to the 2022 mark. The bear case assumes public comps and funding pressure dominate
              the narrative.
