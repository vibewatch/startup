      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Market Timing
        blocks:
          - type: paragraph
            body: >-
              The most credible bullish driver is policy alignment with innovative-drug access and diversified payment.
              The March 2025 NMPA reform opinion explicitly supports innovative drugs, payment diversification, and
              stronger commercialization infrastructure; the January 2026 regulation revision continues the
              pro-innovation stance while tightening compliance around online drug sales. KPMG, IQVIA, and
              pharmacy-channel sources all describe the same demand arc from different angles: China is aging,
              innovative oncology and autoimmune therapies are taking more share, and digital infrastructure is making
              pharmacy and claims workflows more operable. Those forces create real demand for platforms that can
              connect insurers, pharma companies, and fulfillment channels. But the constraints are material.
              Reimbursement expansion often comes with steep price concessions, meaning growth in patient access does
              not automatically translate into strong unit economics for manufacturers or intermediaries. The 2026
              online-prescription rules add more operational discipline by requiring valid prescriptions, real-name
              purchasing, merchant monitoring, and pharmacist review while explicitly preventing AI from replacing
              licensed professionals in prescription adjudication. Broader regulatory-overhaul commentary also points to
              tougher lifecycle, GMP, and post-market obligations. ChinaVenture adds the most useful independent
              caution: a large, policy-favored market still may not yield durable profits for a platform if customer
              acquisition, cash conversion, or balance-sheet discipline lag behind volume growth. The market therefore
              looks attractive, but not frictionless.
