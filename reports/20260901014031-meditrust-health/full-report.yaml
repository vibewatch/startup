  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Policy-Dependence Risks
        blocks:
          - type: paragraph
            body: >-
              MediTrust operates in one of the most policy-sensitive corners of China's healthcare system: the
              intersection of innovative-drug access, commercial insurance, online medicine distribution, and
              AI-assisted operating workflows. That gives the company upside when regulators want to expand access, but
              it also means the rulebook can move underneath the business model. NMPA's 2025 reform opinions, the 2026
              drug-administration revisions, and broader advisory commentary from Freyr and GIR all show that the
              regulatory environment remains active rather than stable. The most immediate risk for MediTrust is on
              online drug sales and digital pharmacy operations. The 2026 revisions strengthened oversight of online
              medicine sales, and CityNews reports that buyers must use real names and valid prescriptions while AI
              cannot replace licensed pharmacists in prescription review. For a company whose DTC and payment
              experiences benefit from workflow compression, that matters operationally. Greenberg Traurig's summary of
              anti-corruption and anti-monopoly developments adds another layer: commercialization programs in pharma
              now face tighter conduct expectations and sector-specific competition oversight. Shanghai's local support
              for commercial insurance and innovative-drug access is a positive sign, but it also reminds investors that
              the thesis depends on continued policy sponsorship rather than on a purely deregulated market.
