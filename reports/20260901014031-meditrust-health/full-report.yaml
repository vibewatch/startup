      - number: '1.3'
        title: Scale, traction, and public proof quality
        blocks:
          - type: paragraph
            body: >-
              Publicly visible scale is meaningful even before the full application proof is in hand. Filing-derived
              media coverage says that by the end of 2024 MediTrust had served approximately 1.6 million patients,
              intermediated cumulative GPV of RMB39.7 billion, worked with more than 90 insurers including all of
              China's top 20 by premium income, and connected more than 140 pharmaceutical companies including roughly
              90% of the global top 20 by 2024 revenue. Those are not ordinary startup metrics; they are ecosystem-level
              indicators showing that the company has already become an important commercialization and payment-access
              layer for high-cost therapies.


              The 2026 refiling summary suggests the platform kept growing after the first filing, reporting roughly 2.0
              million cumulative patients, RMB50.2 billion GPV, and 100-plus insurers by October 2025. At the same time,
              public proof is uneven. Patient, insurer, pharma-company, and GPV numbers are reasonably well repeated
              across retained sources, but public headcount is not. Recruiting evidence proves multi-city operating
              breadth and ongoing AI hiring, yet it does not yield a defensible employee total. That means readers
              should treat scale metrics as stronger on external ecosystem reach than on internal operating disclosure.


              The public proof base is therefore good enough to support a serious-company conclusion but not good enough
              to remove all diligence gaps. The company looks large and relevant on the outside; it is still somewhat
              opaque on internal operating details. That tension is important because it recurs in the financial,
              customer, and valuation chapters.
