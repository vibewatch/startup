  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              MediTrust Health should not be analyzed as a generic telehealth company or as a proxy for the entire
              Chinese pharmaceutical market. Its real addressable arena is narrower and more decision-useful: the layer
              where innovative-drug commercialization, commercial insurance, patient financing, DTP pharmacy routing,
              and direct-payment orchestration meet. Filing-derived coverage repeatedly frames the company around
              financing and payment frictions faced by patients, insurers, and pharmaceutical companies, not around
              routine primary-care traffic or basic medical-insurance reimbursement. That means the included spend pool
              is the part of healthcare expenditure that requires payment design, patient-access support, or channel
              coordination for high-value therapies. In practice, that covers commercial-insurance-linked claims,
              supplementary-city or employer health plans, patient-assistance and financing workflows, and the
              fulfillment routes that move specialty prescriptions to patients. The main substitutes are still
              fragmented manual processes: self-pay, charity/PAP mechanisms, insurer in-house benefit design, and direct
              pharma commercial teams pushing hospital or DTP uptake without a neutral orchestration layer. This
              boundary matters because it avoids inflating TAM with categories MediTrust does not directly monetize,
              while still preserving the adjacent scale of hospitals, pharmacy retail, and broader pharma spending that
              set the opportunity ceiling.
