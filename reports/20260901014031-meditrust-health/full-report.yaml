      - number: '2.2'
        title: 'Sizing Lenses: From Narrow Live Payments to the Upper-Bound Pharma Economy'
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports multiple sizing lenses rather than one single, clean TAM number. The
              narrowest and most relevant current-flow lens comes from the 2026 white paper co-published with China Re
              Life, which says commercial-insurance payments for innovative drugs and devices reached RMB15.2 billion in
              2025. That figure is useful because it reflects actual paid flow in the exact multi-payer niche MediTrust
              is trying to organize. A broader middle layer comes from filing-derived market data, which sizes China's
              innovative-drug-solution market, excluding basic medical insurance, at RMB91.0 billion GPV in 2024 and
              projects RMB243.3 billion by 2030. Above that sits the broader commercial-health-insurance premium pool,
              which grew from RMB242.9 billion in 2019 to RMB430.0 billion in 2024 and is projected at roughly RMB1.3517
              trillion by 2030. Those are not directly additive; they represent different layers of the same stack. The
              broader upper bound is even larger: IQVIA projects the China pharmaceutical market at RMB1.351 trillion by
              2028, while KPMG puts the market at US$226.7 billion in 2024 and US$448.0 billion by 2035. Meanwhile,
              pharmacy-channel studies and online-drug-retail data show that the dispensing and last-mile infrastructure
              is already massive. The right conclusion is that the market is unquestionably large, but public evidence
              does not support a precise MediTrust-specific SOM without assumptions about take rate, payer mix, and
              route-to-fulfillment share.
