      - number: '3.3'
        title: Switching Costs, Lock-In, and Why the Moat Is Valuable but Not Absolute
        blocks:
          - type: paragraph
            body: >-
              MediTrust's moat is best understood as ecosystem access rather than mass traffic. The strongest positive
              case is that innovative-drug payment is hard to assemble from scratch: it requires insurer product design,
              claims operations, pharmacy-routing logic, partner onboarding, and real-world trust around sensitive
              patient journeys. Those are meaningful switching frictions and can create staying power once a program is
              in market. But the moat is not absolute. Multi-homing is plausible, because pharma companies can run
              therapy-specific or region-specific programs with multiple partners, and insurers can source different
              capabilities from different vendors. Internal build is also credible for very large institutions,
              particularly insurers that already control health-plan design and settlement. Larger listed peers can
              bundle broader healthcare services or pharmacy distribution into enterprise relationships, while
              regulatory changes around online prescriptions and compliance increase the value of trust and scale.
              Adverse evidence matters here: MediTrust's live-but-unfinished IPO path means buyers and investors still
              lack the periodic disclosure history that long-listed peers provide. It also means procurement and
              investor audiences are still underwriting a specialist that has not yet been forced into repeated
              public-market reporting cadence. The competitive conclusion is therefore balanced: MediTrust appears
              strongest where innovative-drug commercialization and insurer-linked payment intersect, but it still
              competes in a field where scale, bundling, and transparency can erode narrow specialists.
