  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Large Platforms, Insurance-Led Operators, and Adjacent Commercialization Networks'
        blocks:
          - type: paragraph
            body: >-
              MediTrust competes in a landscape that is broader than a simple list of healthcare apps. The most useful
              way to organize the field is by job-to-be-done. First are the listed internet-health and pharmacy
              incumbents, especially JD Health, whose revenue and market cap dwarf every other comparable in this set
              and whose distribution power makes it a credible substitute or bundling threat whenever a buyer wants
              one-stop pharmacy, delivery, and digital-health services. Second is Ping An Good Doctor, the closest
              listed analogue on insurance-linked healthcare enablement because it explicitly monetizes
              commercial-insurance and corporate-health workflows at scale. Third is Fangzhou, which proves that
              chronic-care, physician-network, and pharma-service models can reach large consumer scale even if
              public-market valuation remains weak. Fourth are adjacent online-offline commercialization networks such
              as Yuanxin Tech and, to a lesser extent, WeDoctor's older platform model. Fifth are the substitutes that
              often matter most in enterprise buying: internal build by large insurers or pharma companies, and
              fragmented status-quo workflows across providers, distributors, and patient-assistance programs. On this
              map, MediTrust is not the biggest platform; it is the most specialized around the innovative-drug payment
              problem in current public evidence.
