chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, market position, and operating model
        blocks:
          - type: paragraph
            body: >-
              MediTrust Health is a Shanghai-founded 2017 healthcare-fintech platform built around one core idea:
              expensive innovative medicines in China do not scale through a single payer, so payment orchestration
              matters as much as clinical access. Retained IPO coverage consistently describes the company as China's
              largest diversified pharmaceutical payment platform and frames its role as an intermediary among patients,
              insurers, and pharmaceutical companies rather than as a pure online-pharmacy or software-only vendor.


              The operating model shown across the 2025 filing coverage, the 2026 refiling coverage, and earlier
              financing materials is broader than the original Care2Pay / One-Code Direct Payment wedge. MediTrust now
              organizes its offer around Smart Pharma and Smart Insurance. Smart Pharma handles commercialization
              support for drug makers, such as integrating commercial insurance, patient-management programs, and
              diversified payment supply-chain options. Smart Insurance provides end-to-end design, distribution,
              claims-operation, and value-added health-management support for insurers trying to sell more useful
              medical products. One-Code Direct Payment remains the consumer-facing proof point because it turns that
              platform logic into a patient workflow that can identify payment eligibility and complete direct-billing
              transactions.


              What makes this chapter important for the rest of the report is that MediTrust is not just a claims tool,
              not just an online health service, and not just a DTP pharmacy link. The retained sources describe a
              three-layer stack: mind42.ai for analytics and automation, MediTrust Rx for supply-chain and payment
              connectivity, and MediTrust Healthcare for health-service and physician-network enablement. That framing
              explains why later chapters should evaluate the company as a multi-sided infrastructure business rather
              than a single-feature app.
