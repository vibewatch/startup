companyProfile:
  summary: >-
    MediTrust Health is a Shanghai-founded healthcare payment and commercialization platform built to help expensive
    innovative-drug therapies clear financing and access barriers in China. The company combines Smart Pharma, Smart
    Insurance, One-Code Direct Payment, MediTrust Rx, and mind42.ai-era tooling to connect patients, insurers,
    pharmaceutical companies, and care-channel partners in a single workflow. Public filing-derived coverage indicates
    the business reached about 1.6 million patients and RMB39.7 billion of cumulative GPV by end-2024, then about 2.0
    million patients and RMB50.2 billion of GPV by October 2025, while growing revenue to RMB2.035 billion in 2024. It
    is therefore clearly a scaled platform, but still one with incomplete public disclosure and an unfinished path to
    IPO liquidity.
