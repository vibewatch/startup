  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              MediTrust's public product narrative is broader than a single app or a pharmacy storefront. Filing-derived
              coverage repeatedly names mind42.ai, MediTrust Rx, and MediTrust Healthcare as the three flagship
              surfaces, while later reporting and partner announcements show that these should be read as layers of one
              operating stack rather than isolated products. MediTrust Rx captures drug-access, commercialization, and
              supply-chain execution; MediTrust Healthcare represents physician-network and healthcare-service
              coordination; and mind42.ai is the decisioning and automation layer that management increasingly presents
              as the connective tissue between insurers, pharmaceutical companies, and patient payment experiences. The
              company’s 2026 AI Inside memo sharpened this positioning by focusing future build-out on two concrete
              domains: analytics that help drug makers understand accessibility and market strategy, and AI-driven
              enhancement of One-Code Direct Payment for real-time payment, benefit matching, and claims workflows. The
              common thread across sources is that MediTrust sells workflow compression: it aims to reduce the number of
              disconnected steps between product design, patient onboarding, treatment access, payment authorization,
              and claim settlement. That framing also explains why the same company can appear, depending on the source,
              as a payment platform, an insurer-enablement company, a commercialization partner, or a patient-service
              network.
