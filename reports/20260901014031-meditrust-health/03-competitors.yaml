  - - Ping An Good Doctor
    - Listed insurance-led managed-care platform
    - RMB5.45B LTM revenue; HKD13.87B market cap
    - Ping An ecosystem, corporates, insured users
    - Insurance-healthcare synergy and direct settlement
    - Broader managed-care scope
  - - Fangzhou
    - Listed AI-driven chronic-care / internet-health platform
    - RMB3.86B TTM revenue; HKD983.67M market cap
    - Chronic-disease patients, physicians, pharma
    - Large physician and patient traffic
    - Weaker explicit insurance-payment depth
  - - WeDoctor
    - Private doctor-patient platform
    - 2025 revenue $423.6M; 2022 valuation $7B; funding disputed
    - Online medical consultation users
    - Brand history and physician-access platform
    - Recent disclosure inconsistency
  - - Yuanxin Tech
    - Private online-offline pharmacy / commercialization network
    - 10B+ RMB annual revenue; ~RMB19.5B valuation
    - Patients, doctors, pharmacies, pharma, insurers
    - Integrated online-offline network and scale
    - Model not identical; repeated IPO lapses
  - - Internal build
    - Substitute
    - Varies by insurer or pharma size
    - Large institutions
    - Control and customization
    - Slow, expensive, partner-heavy
  - - Fragmented status quo
    - Substitute
    - No unified platform cost
    - Patients, hospitals, PAP administrators
    - Low switching barrier
    - Poor user experience and weak scalability
  notes: The profile table mixes direct peers, adjacencies, and substitutes because buyers can solve the same job in multiple ways.
