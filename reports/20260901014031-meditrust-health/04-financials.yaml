- id: margin-unit-economics
  title: Margin Structure, Operating Leverage, and Quality of Earnings
  body: |-
    The strongest part of the public record is the 2022-2024 direction of travel. Gross profit rose from RMB332 million to RMB729 million over the three-year span, and gross margin improved materially from 31.08% in 2022 to the mid-30s thereafter. Sales intensity also improved sharply, with selling expense falling from more than half of revenue in 2022 to roughly one-third in 2024. Chinaventure's discussion of the Smart Insurance line is especially important because it reports 81.5% gross margin in 2024 for that segment, which supports the view that MediTrust was shifting toward a higher-quality service mix. Net loss narrowing from RMB446 million in 2022 to RMB76 million in 2024 looked like powerful operating leverage. But the first ten months of 2025 complicate the story: revenue remained high at RMB1.873 billion, yet net loss widened again to RMB389 million. That combination implies the company may still be carrying launch, investment, or working-capital burdens that are not visible in the simplified public summaries. It also leaves free-cash-flow durability unresolved. The best interpretation is not that the 2024 improvement was false, but that durability is still unproven. Public evidence supports improving unit economics, not completed financial maturity.
