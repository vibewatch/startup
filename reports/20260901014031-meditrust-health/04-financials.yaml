company:
  name: MediTrust Health
chapter:
  number: 4
  title: Financials
  summary: |-
    MediTrust Health's public financial record is strong enough to show real progress, but not strong enough to underwrite the company as fully de-risked. Filing-derived coverage shows revenue of RMB1.069 billion in 2022, RMB1.255 billion in 2023, and RMB2.035 billion in 2024, with gross profit rising to RMB729 million and net loss narrowing sharply to RMB76 million. The visible improvement appears to come from a mix shift toward higher-value insurance and service revenue, with selling-expense intensity also falling materially. At the same time, the first ten months of 2025 still produced RMB1.873 billion of revenue but a widened RMB389 million net loss, which means 2024 did not yet prove durable profitability. On capital, the company has raised more than RMB3.1 billion across seven rounds and carried a 2022 C+ valuation of RMB11.678 billion, yet third-party analysis also points to sharply lower cash reserves by 2025 and continuing debt obligations. The appropriate conclusion is that MediTrust is financially improving, still loss-making, and meaningfully dependent on continued capital access and better disclosure.
sections:
- id: revenue-model
  title: Revenue Model, Mix, and Recognition
  body: |-
    MediTrust's public financial story is that of a platform whose monetization spans several layers of the healthcare-payment stack rather than a single clean software fee. Filing-derived coverage describes Smart Pharma and Smart Insurance as the two main business lines, with additional consumer-facing products such as BluePass and a DTC pharmacy surface. That mix matters because it means total reported revenue almost certainly blends service fees, distribution-linked activity, payer enablement contracts, patient-service work, and some consumer transaction flows. The best quantitative anchors are the top-line trajectory and the 2024 mix split: revenue rose from RMB1.069 billion in 2022 to RMB1.255 billion in 2023 and RMB2.035 billion in 2024, while Smart Pharma contributed about 59.3% of 2024 revenue and Smart Insurance about 35.9%. Public pricing remains opaque, which strongly suggests that MediTrust wins business through negotiated enterprise programs and ecosystem contracts rather than through visible price cards. That is important because it makes reported revenue more sensitive to account scope and contract structure than a simple SaaS-ARR lens would imply. This makes the business more comparable to a hybrid commercialization-and-payments services company than to a pure subscription-SaaS vendor.
