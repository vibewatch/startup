evidenceGaps:
  - type: missing-source
    severity: material
    topic: headcount-disclosure
    missingEvidence: A current employee count from the company, an exchange filing, or a regulator-linked profile.
    whyItMatters: >-
      Headcount is a standard late-stage operating metric and affects cost-base, execution capacity, and runway analysis
      in later chapters.
    diligencePath: >-
      Request an updated employee total from investor relations or obtain a full application proof / annual filing that
      includes workforce statistics.
    relatedQuestionRefs:
      - QO016
  - type: missing-source
    severity: material
    topic: debt-and-credit-facilities
    missingEvidence: A primary disclosure of bank facilities, borrowings, or other credit arrangements outstanding before the IPO.
    whyItMatters: >-
      Capital-structure detail is needed to separate equity-funded growth from balance-sheet risk and to support the
      later financials chapter.
    diligencePath: >-
      Obtain the full application proof or audited financial statements that include borrowings, cash, and maturity
      schedules.
    relatedQuestionRefs:
      - QO014
  - type: conflicting-data
    severity: minor
    topic: governance-lineup-change
    missingEvidence: >-
      A side-by-side primary source confirming whether the vice-chair or board lineup changed between the June 2025
      filing and the January 2026 refiling.
    whyItMatters: >-
      Governance continuity matters for key-person and sponsor-readiness analysis, but the current discrepancy is not
      large enough to block the overview.
    diligencePath: Compare the complete 2025 and 2026 application proof documents rather than relying on media summaries.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-partial-coverage
    missingEvidence: >-
      A full pre-IPO shareholder table covering every sub-5% investor, board observer, and any secondary transfer before
      listing.
    whyItMatters: >-
      The stakeholder map is decision-useful but not exhaustive, so later ownership or governance analysis could miss
      minor but meaningful rights holders.
    diligencePath: Use the full application proof cap-table and lock-up schedule to expand the stakeholder enumeration.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-partial-coverage
    missingEvidence: >-
      The complete first-submission and refiling document sets, including every appointment notice and submittal
      revision.
    whyItMatters: >-
      The milestone table intentionally captures only the most material public events, so a more exhaustive chronology
      may matter for refresh work.
    diligencePath: Extract the complete event history from the original HKEX application proof package and related announcements.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: mediTrust-specific-som
    missingEvidence: >-
      A primary disclosure of platform take rate, active hospital / DTP coverage, and the share of category GPV actually
      routed through MediTrust contracts.
    whyItMatters: >-
      Without those variables, public evidence supports market size but not a clean serviceable obtainable market for
      the company.
    diligencePath: Use full prospectus detail or management disclosure to derive contract economics and reachable share.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: premiums-vs-claims-vs-gpv
    missingEvidence: >-
      A standard industry mapping that reconciles premiums, paid claims, GPV, and platform-fee revenue into one
      consistent funnel.
    whyItMatters: >-
      Different sources describe adjacent but non-identical market layers, which can create false precision if mixed
      carelessly.
    diligencePath: Rebuild the funnel using actuarial data, claims ratios, and platform take-rate disclosures.
    relatedQuestionRefs:
      - QM021
      - QM022
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: dtp-hospital-enumeration
    missingEvidence: >-
      A current primary count of DTP pharmacies, hospitals, and provider nodes contractually connected to MediTrust's
      payment workflows.
    whyItMatters: Channel scale determines how much of the theoretical market can actually be fulfilled.
    diligencePath: Obtain channel-partner disclosure from the prospectus or a detailed investor presentation.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: contract-pricing-and-retention
    missingEvidence: >-
      Primary disclosure of customer retention, program renewal, and contract pricing / take-rate by peer and by
      MediTrust.
    whyItMatters: Competitive strength in this market depends on renewal quality and economics, not just partner count.
    diligencePath: Use full prospectus detail, peer annual reports, or management commentary to map renewal and contract structure.
    relatedQuestionRefs:
      - QP013
      - QP014
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: wedoctor-funding-disclosure
    missingEvidence: A current primary funding history or audited filing for WeDoctor that reconciles the Tracxn and GetLatka totals.
    whyItMatters: WeDoctor is a commonly cited Chinese internet-health peer, but the public record retained here is inconsistent.
    diligencePath: Obtain a primary filing or a more authoritative database export before using WeDoctor as a valuation anchor.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: buyer-switching-evidence
    missingEvidence: >-
      Case-study or filing evidence showing actual platform switching or exclusive wins between Chinese
      healthcare-payment peers.
    whyItMatters: Without observed switch events, switching-cost claims remain evidence-backed but partly inferred.
    diligencePath: Collect procurement notices, customer case studies, or churn disclosures.
    relatedQuestionRefs:
      - QP017
      - QP018
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: full-cash-flow-and-balance-sheet
    missingEvidence: Directly retrieved audited cash-flow, balance-sheet, and note disclosures from the full application proof.
    whyItMatters: Without primary statements, the chapter can assess trajectory but not fully underwrite cash conversion or runway.
    diligencePath: Retrieve the complete prospectus PDF and extract financial statements and footnotes.
    relatedQuestionRefs:
      - QI022
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: take-rate-and-cohort-economics
    missingEvidence: Business-line take rates, renewal rates, and customer-cohort economics.
    whyItMatters: Those inputs determine whether reported GPV and program volume convert into attractive contribution profit.
    diligencePath: Use management disclosures, detailed segment notes, or investor presentations.
    relatedQuestionRefs:
      - QI023
      - QI024
    relatedTableRefs:
      - TI002
      - TI005
  - type: conflicting-data
    severity: minor
    topic: profile-database-coverage
    missingEvidence: A more complete and current third-party database record that is not blocked or stale.
