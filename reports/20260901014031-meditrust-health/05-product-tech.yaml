tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module or asset
  - Primary user
  - Current status or maturity
  - Differentiation
  - Diligence gap
  rows:
  - - mind42.ai AI hub
    - Insurers, pharma teams, internal operations
    - Production-scale data and workflow engine; explicitly prioritized in 2026 strategy
    - Uses accumulated claims, policy, and payment data tied to payment workflows
    - No public model-card, accuracy benchmark, or governance disclosure
  - - mind42.ins insurer AI platform
    - Insurance carriers and benefit-plan operators
    - Launched publicly in 2025 per Bamboo Works
    - Decision support for product design, marketing, and claims operations
    - Customer logos, conversion metrics, and SLA evidence absent
  - - Care2Pay / One-Code Direct Payment
    - Patients, insurers, pharma-sponsored access programs
    - Core flagship workflow with long-running deployment evidence
    - Real-time QR-triggered policy matching and settlement at payment point
    - No audited settlement-speed or denial-rate series
  - - MediTrust Rx / diversified supply chain
    - Pharma companies, pharmacies, patient-service teams
    - Commercially embedded and repeatedly referenced
    - Combines innovative-drug access, commercialization support, and pharmacy fulfillment
    - Unit economics by channel undisclosed
  - - MediTrust Healthcare / physician network
    - Insurers, patients, physician network
    - Named in filing-derived coverage but less deeply described publicly
    - Connects payment and benefit management with clinical-service routing
    - Network breadth and service-quality metrics not publicly disclosed
  notes: The matrix separates branded modules that recur in public disclosures. Maturity labels refer to external evidence quality, not internal engineering readiness.
