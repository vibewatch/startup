  evidenceGaps:
  - type: missing-metric
    severity: medium
    topic: product-reliability
    missingEvidence: No retained public uptime, SLA, incident, or API-availability metrics for Care2Pay, mind42.ai, or mind42.ins.
    whyItMatters: Without service-quality metrics, investors cannot distinguish between a workflow that is strategically compelling and one that is operationally brittle.
    diligencePath: Request internal reliability dashboards, incident logs, SLA commitments, and major partner escalation metrics.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-proof
    severity: medium
    topic: trust-controls
    missingEvidence: No retained evidence set enumerates security certifications, privacy audits, model-risk governance, or external compliance attestations for AI workflows.
    whyItMatters: MediTrust operates on regulated medical, insurance, and payment data; weak control proof would raise enterprise-sales and regulatory risk.
    diligencePath: Request security certifications, privacy impact assessments, AI governance policies, and any regulator or client audits.
    relatedQuestionRefs:
    - QE017
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-corroboration
    severity: medium
    topic: insurer-ai-adoption
    missingEvidence: mind42.ins launch and automation metrics are strong but still rest on a narrow set of sources without named customer deployment case studies.
    whyItMatters: The valuation case for MediTrust improves materially if insurer-AI modules are sticky and monetized, not merely showcased.
    diligencePath: Ask for named insurer references, deployment counts, paid-contract evidence, and cohort metrics for AI-enabled workflows.
    relatedQuestionRefs:
    - QE007
    - QE010
    relatedTableRefs:
    - TE001
    - TE002
  - type: missing-proof
    severity: low
    topic: roadmap-detail
    missingEvidence: Public sources show milestone direction for Hong Kong, AI Inside, and partner expansion but not a dated release roadmap or product backlog.
    whyItMatters: Roadmap uncertainty affects how quickly MediTrust can convert its narrative into revenue and moat expansion.
    diligencePath: Request 12- to 24-month product roadmap, launch dependencies, and capex / hiring budget tied to AI initiatives.
    relatedQuestionRefs:
    - QE013
    - QE021
    relatedTableRefs:
    - TE005
