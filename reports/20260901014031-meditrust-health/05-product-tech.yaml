- id: technology-and-controls
  title: Technology Architecture, Trust Controls, and Maturity Limits
  body: |-
    Public evidence supports the existence of substantive AI-enabled operating capabilities, but not a full technical underwrite. The strongest visible technical disclosure comes from 2025–2026 reporting around mind42.ai and mind42.ins. Management said the company had processed nearly 400 million claims-data entries through AI Hub mind42.ai, and Bamboo Works adds that the insurer-facing mind42.ins product uses that corpus for tasks such as product design, marketing promotion, and claims operation. Bamboo also reports that AI-driven claim review covered more than 60% of cases with sub-10-minute average processing time, which is materially more useful than generic “AI-enabled” branding. At the same time, that same independent source identifies the main constraint: insurers must migrate from legacy systems and normalize fragmented data before AI can deliver reliably at scale. Trust and quality evidence is thinner than product-function evidence. Management’s AI Inside principles explicitly reference professionalism, precision, safety, and privacy, but the retained public record still lacks direct disclosure on uptime, model governance, security certifications, or incident history. Meanwhile, the Hong Kong and Greater Bay Area roadmap looks strategically logical but still early from a proof perspective. The net view is that MediTrust looks operationally mature at the workflow level and only partially mature at the externally verifiable control level.
