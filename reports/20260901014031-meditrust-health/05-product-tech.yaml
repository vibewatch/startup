- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - MediTrust solution
  - Measurable benefit
  - Limitation
  rows:
  - - Patient needs innovative drug with limited reimbursement
    - Search access channel, verify policy manually, pay first, claim later
    - Care2Pay / One-Code Direct Payment plus DTP and patient-service routing
    - Real-time matching and settlement; lower friction for expensive therapies
    - Public sources do not disclose approval-rate denominators or exception handling
  - - Insurer designs or prices specialty-health product
    - Manual actuarial and rule design on fragmented historical data
    - mind42.ai / mind42.ins decision support
    - Uses real insurance and claims records; supports pricing and rule design
    - No third-party audit of model performance
  - - Pharma partner wants patient-access program
    - Coordinate manufacturers, pharmacies, patient support, and payers separately
    - Integrated commercialization, payment, and service workflow
    - Shorter path from diagnosis to medication and payment
    - Partner case studies are specific but not standardized
  - - Claim needs medical review
    - Human-heavy review with multiple system handoffs
    - AI-driven claim review within insurer workflow
    - Bamboo reports over 60% automation coverage and under-10-minute average processing time
    - Coverage ratio not broken out by claim type or partner
  notes: Benefits combine company-described and independently reported outcomes. Only the claim-review coverage and processing-time numbers are quantitative.
