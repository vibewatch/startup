- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - 'AI deployment principles: useful / professional / precise / safe'
    - Explicitly stated
    - Applies to 2026 AI Inside strategy
    - Principles are not the same as audited controls
  - - Privacy and data-security emphasis
    - Explicitly stated
    - Applies to patient, policy, and claims data use
    - No public certification list or incident history retained
  - - Official product documentation availability
    - Weak
    - Multiple English and Chinese pages blocked to automated retrieval
    - Makes direct verification of product controls difficult
  - - Operational performance disclosure
    - Partial
    - Quant proof exists for claims review coverage and processing time
    - No uptime, API, or model-failure reporting
  - - Independent critical validation
    - Moderate
    - Bamboo identifies legacy-IT and data-standardization constraints
    - No regulator or auditor product review found
  notes: The strongest trust evidence is management intent plus limited operational metrics; the weakest area is independently verifiable control documentation.
