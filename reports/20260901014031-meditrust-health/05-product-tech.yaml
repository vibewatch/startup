- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Layered view of MediTrust's operating architecture from data ingestion through patient payment and drug fulfillment.
  data:
    layers:
    - label: Data and rules layer
      detail: Claims, policy, payment, and patient-journey data accumulated across insurer and payment workflows; used to train and tune mind42.ai
    - label: AI decision layer
      detail: mind42.ai and mind42.ins support pricing, rule interpretation, claim review, and insurer operational decisions
    - label: Payment orchestration layer
      detail: Care2Pay / One-Code Direct Payment matches entitlement and drives real-time settlement via QR-led workflow
    - label: Access and fulfillment layer
      detail: MediTrust Rx, DTP pharmacies, and commercialization programs connect innovative-drug access to payment resolution
    - label: Healthcare-service layer
      detail: MediTrust Healthcare and patient-service programs connect physician-network, benefit, and care-support workflows
    - label: Enterprise-partner layer
      detail: Insurers, drug makers, reinsurers, and pharmacy partners embed modules into production programs
  approximationNotes: The stack represents logical operating layers synthesized from filings, partner announcements, and AI/product coverage. MediTrust has not published a single formal architecture diagram in the retained source set.
