- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer or component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Claims / policy / payment data layer
    - Provides training and rule inputs for AI and benefit matching
    - Insurer and program data-sharing permissions
    - Data fragmentation and privacy obligations
  - - AI hub (mind42.ai)
    - Supports rule interpretation, recommendation, and workflow automation
    - Model quality, compute, and domain tuning
    - Opaque benchmark quality and governance externally
  - - Insurer operations layer (mind42.ins)
    - Embeds AI in product design, marketing, and claims processes
    - Insurer IT integration and workflow change management
    - Legacy-system migration slows adoption
  - - Payment and settlement layer
    - Generates QR-triggered settlement and policy matching
    - Insurer benefit rules and payment-network execution
    - Mismatch or exception handling not publicly described
  - - Supply-chain and pharmacy layer
    - Fulfills innovative-drug access and related services
    - Pharmacy network and pharma partnerships
    - Partner dependence and economics vary by program
  notes: This architecture is logical rather than source-published. It synthesizes repeated descriptions from product, partner, and financing coverage.
