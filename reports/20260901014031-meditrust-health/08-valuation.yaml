- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cash runway and funding contingency
    - Runway model and backup financing plan
    - Capital timing is central to valuation support
    - Management / CFO
  - - Customer concentration
    - Top-10 revenue, GPV, and gross-profit concentration
    - Diversified headline counts may mask economic concentration
    - Finance / data room
  - - Retention and renewal
    - NRR, GRR, logo churn, program renewal
    - Durability determines whether a premium multiple is deserved
    - Revenue operations / finance
  - - Paid insurer-AI deployment proof
    - Named customers, ACV, automation economics
    - Would directly strengthen premium thesis
    - Product / sales leadership
  - - Control and governance package
    - Security certifications, model governance, incident logs
    - Improves public-market readiness and narrows valuation band
    - CTO / compliance
  notes: These asks are prioritized by likely impact on price confidence, not just by general curiosity.
