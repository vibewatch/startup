- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Another prolonged IPO delay
    - No clear listing or replacement funding path
    - Turns timing risk into solvency and bargaining-power risk
    - Move immediately to bear-case underwriting
  - - Losses remain heavy into next reported period
    - No visible path from scale to profitability
    - Breaks the scarcity-premium narrative
    - Refuse any step-up and demand larger discount
  - - Regulation slows DTC / digital payment workflow
    - Material increase in friction or human-review burden
    - Cuts growth and weakens convenience moat
    - Reduce growth multiple and lower base-case range
  - - Concentration or retention disappoints
    - Top accounts dominate more than expected or renewals are weak
    - Shows network breadth is economically thinner than claimed
    - Treat business as concentrated services platform
  notes: These triggers focus on events that would change valuation, not simply events that would create operational inconvenience.
