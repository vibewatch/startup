company:
  name: MediTrust Health
chapter:
  number: 8
  title: Valuation
  summary: |-
    MediTrust Health's valuation case is attractive enough to keep the company investable, but not strong enough to justify a clean step-up above its 2022 C+ mark on current public evidence. The last private valuation of RMB11.678 billion implied roughly 5.7x 2024 revenue and a little above 5x on an annualized 2025 revenue base, while visible public comps such as JD Health, Ping An Good Doctor, and Fangzhou trade at materially lower sales multiples. MediTrust can argue for a premium because it sits at a scarcer payment-and-insurer integration layer than simpler internet-health or pharmacy models, and adjacent private benchmarks like Yuanxin Tech show that strategic assets in this category can still command high marks. Even so, 2025 losses, capital dependence, the refiling process, and weaker disclosure quality all argue for a discount to the last round unless a new investor gets structure or fresh internal proof. The most defensible posture is therefore conditional: invest only with price protection or at a lower entry range, with a public-evidence base case around RMB7.9 billion to RMB10.1 billion and a bull case roughly encompassing the old C+ mark.
sections:
- id: recommendation-and-price-support
  title: Recommendation, Risk Rating, and Current Price Support
  body: |-
    The public evidence supports a serious company with real scale, but not a clean late-stage price endorsement at the last private mark. The strongest valuation anchor remains the 2022 C+ round at RMB11.678 billion. That number looked more defendable when investors were underwriting rapid growth and before the full public market reset in China healthcare internet names. Today, the same mark implies roughly 5.7x on 2024 revenue and a little above 5x on an annualized 2025 revenue base. Those are not absurd multiples for a rare platform asset, but they are demanding relative to the public comp set and demanding for a business that still showed a much wider loss in the first ten months of 2025. The filing lapse and refiling add another caution flag because they show the path to liquidity has not been frictionless. The correct stance is therefore conditional. MediTrust remains investable as a differentiated healthcare-payments infrastructure company, but the public record does not support paying a clean step-up above the 2022 mark without better evidence on durable profitability, concentration, and cash runway. A structured round or a discounted entry is more defensible than paying full price on narrative alone.
