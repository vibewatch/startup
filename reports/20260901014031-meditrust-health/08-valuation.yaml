- id: exit-readiness-and-diligence
  title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
  body: |-
    The biggest practical question is not whether MediTrust can tell an attractive story, but whether it can tell one with enough disclosure quality to clear the public market at a strong price. Public peers such as JD offer accessible investor-relations surfaces and routine reporting, while MediTrust's own official pages remained partially blocked during retrieval and several private-peer sources were gated or noisy. That matters because valuation discounts often emerge not from disbelief in the business, but from poor confidence in the measurement system around the business. MediTrust has made progress simply by filing publicly, yet the retained evidence still does not provide the comfort an investor would want on customer concentration, retention, paid insurer-AI deployments, or downside funding contingency. Those gaps widen the valuation band and reduce confidence in any point estimate. The most important thesis-break triggers are another prolonged IPO delay, continued heavy losses without cash replenishment, or new regulation that slows digital payment and pharmacy workflows. If management can close the disclosure gap and prove earnings durability, the company can defend a valuation much closer to the last round. Until then, disciplined investors should ask for structure, price protection, or both before underwriting late-stage upside.
