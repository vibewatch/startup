    - Listed insurance-linked health platform
    - Relevant because of insurance enablement and health-management overlap
    - Different ownership ecosystem and profitability profile
  - - Fangzhou
    - TTM revenue 3.86B CNY; P/S 0.22x
    - Listed AI-chronic-care / internet-health comp
    - Relevant for public-comp discounting of China internet-health names
    - Lower-margin and different specialization
  - - Yuanxin Tech
    - ~RMB19.5B valuation filing context
    - Adjacent private / pre-IPO benchmark
    - Closest thematic neighbor on healthcare access and drug-commerce infrastructure
    - Not directly comparable on disclosure depth or exact mix
  - - WeDoctor
    - 'GetLatka: ~$7B valuation, ~$423.6M ARR'
    - Private benchmark, low-confidence
    - Useful as a reminder that private platform marks can exceed public-comp logic
    - Data quality lower and partially gated
  notes: Comparable rows are ordered from strongest public anchors to weaker private reference points.
