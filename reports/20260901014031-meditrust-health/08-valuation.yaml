- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Growth holds near 2025 run-rate, insurer/pharma moat is believed, profitability looks imminent
    - ~RMB11.3B-RMB13.5B at ~5.0x-6.0x annualized 2025 revenue
    - Requires market to overlook current losses and accept scarcity premium
    - Low-medium probability on public evidence
  - - Base
    - Company gets a premium to most public comps but a discount to the last private mark
    - ~RMB7.9B-RMB10.1B at ~3.5x-4.5x annualized 2025 revenue
    - Needs no major regulatory shock and a credible funding path
    - Highest-probability outcome on current evidence
  - - Bear
    - IPO timing slips, losses persist, or public comp pressure dominates
    - ~RMB4.5B-RMB6.8B at ~2.0x-3.0x annualized 2025 revenue
    - Capital needs and disclosure gaps force reset
    - Very plausible if market conditions worsen
  notes: Scenarios use annualized 2025 revenue as the freshest broad denominator. They are valuation ranges, not point estimates.
