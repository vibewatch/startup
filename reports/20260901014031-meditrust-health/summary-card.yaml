  topStrengths:
    - >-
      Real ecosystem scale is visible: public sources consistently support roughly 2.0 million cumulative patients by
      October 2025, RMB50.2 billion of GPV, 100+ insurer relationships, and 140+ pharmaceutical-company relationships.
    - >-
      The platform appears structurally differentiated from simpler internet-health peers because it sits at the
      payment-rule and reimbursement layer between patients, insurers, pharma companies, and care channels.
    - >-
      Financial progress through 2024 was meaningful, with revenue reaching RMB2.035 billion, improved gross margin,
      lower selling-intensity, and net loss narrowing sharply versus 2022.
    - >-
      Sponsor quality is credible: the shareholder and financing base includes strategic and institutional names such as
      Ant Group, Shanghai Pharmaceuticals, Boyu, Janchor, and HSBC.
  topRisks:
    - >-
      Profitability is not yet durable: after 2024 narrowed net loss to RMB76 million, the first ten months of 2025
      still showed a much wider RMB389 million loss.
    - >-
      Valuation support is weak versus public comps, with listed China digital-health peers trading at materially lower
      revenue multiples than MediTrust's 2022 C+ mark implies.
    - >-
      Disclosure quality remains incomplete for a late-stage company because official pages were partially blocked
      during collection and public sources do not resolve key diligence questions on cash runway, concentration,
      retention, and contract economics.
    - >-
      Regulatory and execution risk remain high because innovative-drug access, online-pharmacy, and insurance-payment
      workflows in China are policy-sensitive and operationally complex.
    - >-
      The lapse-and-refile IPO path means timing risk can still translate directly into financing pressure and pricing
      concessions.
  unresolvedGaps:
    - >-
      Public sources still do not disclose cash runway, fallback financing plans, or a management- grade liquidity
      bridge if IPO timing slips again.
    - >-
      Customer concentration, renewal rates, and net revenue retention are not publicly visible, leaving the durability
      of insurer and pharma relationships under-proven.
    - >-
      Public evidence does not yet show decision-grade monetization proof for insurer-facing AI and automation products
      such as mind42.ins.
    - >-
      Official first-party disclosure remains thinner than that of listed peers, widening the valuation band and
      limiting confidence in any precise point estimate.
    - >-
      The exact capital-structure implications of prior financing rounds remain unclear from retained public evidence
      alone.
