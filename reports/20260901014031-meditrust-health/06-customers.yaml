      detail: Innovative-drug maker needs payment, reimbursement, and patient-support path
    - id: insurer-design
      label: Insurer designs or embeds benefit
      detail: MediTrust helps shape product, rules, and operating workflow
    - id: patient-entry
      label: Patient enters eligibility and payment path
      detail: Patient seeks affordable access to therapy via payer- or sponsor-linked workflow
    - id: settlement
      label: Payment and settlement executed
      detail: Care2Pay / One-Code Direct Payment compresses claim and settlement steps
    - id: fulfillment
      label: Pharmacy / service fulfillment
      detail: DTP or broader pharmacy network plus patient services complete the experience
    - id: data-loop
      label: Data and proof feed back
      detail: Program experience informs later payer design, pharma expansion, and customer acquisition
  approximationNotes: This journey map abstracts a multi-sided process rather than a single linear consumer funnel. It is based on filing-derived operating descriptions and named partner case studies.
