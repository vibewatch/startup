company:
  name: MediTrust Health
chapter:
  number: 6
  title: Customers
  summary: |-
    MediTrust Health has unusually strong public proof of customer breadth for a private Chinese health-tech platform. Filing-derived coverage says the company had served about 1.6 million patients, more than 90 insurers, and more than 140 pharmaceutical companies by end-2024, rising to about 2.0 million patients and more than 100 insurers by late 2025. The quality of that footprint also looks high: disclosed insurer relationships include all of China's top 20 insurers by premium income, while pharma coverage includes 90% of the global top 20 by 2024 revenue. Named proof is strongest on the pharma side, with Eisai, Mabwell, Sino Biopharm, and JW Therapeutics all demonstrating deployment around innovative-drug access and payment. Government sources around Huibao add evidence of city-insurance scale and endurance. The main missing piece is durability: the public record does not disclose churn, renewals, NRR, GRR, or concentration by account, so breadth is verified more strongly than stickiness.
sections:
- id: customer-segmentation
  title: Customer Segmentation, Buyer/User/Payer Roles, and Adoption Scale
  body: |-
    MediTrust's customer base is much easier to misunderstand than that of a single-sided consumer health app. The company sits inside a three-sided workflow where pharmaceutical companies need commercialization and patient-access support, insurers need product design and claims operations, and patients need affordable access to expensive therapies. In that structure, the paying customer is often the enterprise side, the user is often the patient or insurer operator, and the value proposition is judged by whether more payable treatment actually happens. The disclosed adoption scale is meaningful. By end-2024 MediTrust said it had served about 1.6 million patients and handled RMB39.7 billion of cumulative medical-spend GPV, while connecting with more than 90 insurers and more than 140 pharmaceutical companies. By late 2025 those figures had risen to about 2.0 million patients, RMB50.2 billion of GPV, and more than 100 insurers. Historical coverage adds important texture: as early as 2021, Care2Pay was described as working with more than 50 pharma and insurance companies, 2,000-plus DTP pharmacies, and more than 400 cities. Government coverage of Huibao in 2026 adds another layer of scale proof by showing a city-insurance ecosystem that had already accumulated more than 33 million participant-times. The right read is that MediTrust is not selling one product to one buyer; it is coordinating a multi-party payment and access network whose scale looks real even if its economics remain opaque.
