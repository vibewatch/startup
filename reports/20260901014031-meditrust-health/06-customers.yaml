- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Winning more blue-chip pharma logos
    - High revenue may still be concentrated in a subset of brands or therapy programs
    - Can overstate breadth if many relationships are small
    - Request revenue by top 10 pharma accounts and therapy area
  - - Adding more insurer partners
    - Program count may be broad but economically shallow per insurer
    - Breadth may not equal durable margin pool
    - Request GMV, premium, and revenue by top insurer programs
  - - Deepening patient throughput
    - Cumulative patient counts may mask episodic rather than recurring usage
    - Makes cohort forecasting difficult
    - Request active-patient and repeat-treatment cohorts
  - - City-insurance channels
    - Consortium structures may be large but commercially diffuse
    - Brand proof may not map cleanly to revenue capture
    - Request Huibao and other city-program revenue share and role
  - - Cross-ecosystem data flywheel
    - Regulatory or partner limits on data sharing could slow expansion
    - Would weaken underwriting of AI and payment optimization
    - Request data-rights terms and privacy constraints by segment
  notes: Expansion logic is credible, but concentration and monetization depth remain the biggest unresolved customer questions.
