  evidenceGaps:
  - type: missing-metric
    severity: high
    topic: retention
    missingEvidence: No retained public NRR, GRR, renewal, churn, or contract-duration metrics for insurer or pharma segments.
    whyItMatters: Customer breadth can look impressive while revenue durability remains weak; retention data is essential for underwriting cash-flow quality.
    diligencePath: Request segment-level retention dashboards, logo cohorts, and top-account renewal history for 2022-2025.
    relatedQuestionRefs:
    - QU021
    - QU028
    relatedTableRefs:
    - TU004
  - type: missing-metric
    severity: medium
    topic: concentration
    missingEvidence: No retained public revenue, GPV, or gross-profit concentration by top insurer, pharma logo, city program, or therapy area.
    whyItMatters: A small set of anchor accounts could dominate economics despite large relationship counts.
    diligencePath: Request top-10 customer concentration, top-program GPV, and therapy-level contribution analysis.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-proof
    severity: medium
    topic: patient-outcomes
    missingEvidence: Public sources do not provide standardized satisfaction, adherence, or outcome data at the patient level.
    whyItMatters: Patient value is core to MediTrust's narrative, but without outcome or satisfaction proof it is hard to quantify end-user stickiness.
    diligencePath: Request patient NPS, complaint rates, adherence improvements, and claim-resolution experience metrics.
    relatedQuestionRefs:
    - QU022
    - QU015
    relatedTableRefs:
    - TU004
  - type: missing-corroboration
    severity: medium
    topic: insurer-proof-balance
    missingEvidence: Named insurer case studies are materially thinner than named pharma case studies in the retained evidence set.
    whyItMatters: If the most profitable customer segment is insurers, weak named proof there raises sales-durability questions.
    diligencePath: Request named insurer references, program case studies, and ACV / retention data for top insurer deployments.
