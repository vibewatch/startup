- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue or strategic value
  - Gap
  rows:
  - - Patients needing innovative drugs
    - User = patient; payer often insurer, pharma program, or family
    - Real-time payment, access, and support for high-cost therapies
    - 1.6M patients by end-2024; 2.0M by 2025-10-31
    - Proof of network usage and access relevance
    - No cohort, satisfaction, or repeat-usage disclosure
  - - Commercial insurers
    - Buyer = insurer; user = operations / actuarial / claims teams and insured members
    - Product design, pricing, marketing, claims, health management
    - 90+ partners by end-2024; 100+ by 2025-10-31
    - Likely highest-quality service economics
    - No concentration, renewal, or ACV disclosure
  - - Pharmaceutical companies
    - Buyer = pharma; user = commercialization and patient-service teams
    - Innovative-drug access, payment pathway design, commercialization support
    - 140+ partners; 90% of global top 20 pharma by 2024 revenue
    - Blue-chip proof and expansion flywheel
    - Named proof exists, but spend per logo undisclosed
  - - Pharmacy / DTP channel
    - Buyer varies; user = dispensing and service network
    - Fulfillment, dispensing, and patient handoff
    - 2,000+ DTP pharmacies in 2021; 30,000+ pharmacy network in 2026 coverage
    - Critical delivery and reach layer
    - Economics and exclusivity unclear
  - - Reinsurers / ecosystem institutions
    - Influencer / partner rather than direct end user
    - White papers, payment design, and insurer ecosystem enablement
    - China Re Life, leading reinsurers, and HSBC-linked financial channels referenced
    - Raises credibility in product design and customer acquisition
    - Commercial monetization unclear
  notes: Scale metrics mix disclosed cumulative counts with ecosystem breadth indicators. They show presence, not revenue concentration.
