- id: named-customer-proof
  title: Named Customer Proof, Channel Reach, and Expansion Surfaces
  body: |-
    The most persuasive customer proof comes from named pharmaceutical and therapy partners rather than from anonymous statistics. Eisai shows MediTrust embedded in a disease-service workflow linking prevention through treatment and payment. Mabwell shows the model applied to autoimmune disease, bone health, and oncology while explicitly referencing One-Code Direct Payment and commercial-insurance pathways. Sino Biopharm extends the pattern into a large domestic pharma group pursuing drug-insurance integration, and JW Therapeutics shows the architecture reaching into CAR-T affordability and supplementary private-insurance design. Taken together, these are not lightweight co-marketing announcements: they show repeated deployment around high-cost innovative therapies where payment design materially affects uptake. The channel story supports that conclusion. Historical evidence points to broad DTP-pharmacy and city coverage, while later coverage says the network had grown to more than 30,000 pharmacies nationwide. Additional policy and ecosystem coverage from China Daily, Shanghai authorities, and Hubbis also suggests that MediTrust's customer surface extends beyond direct logos into city-insurance programs and financial-institution channels. What remains less balanced is the proof mix: the public record is richer on named pharma customers than on named insurers, even though insurers appear central to revenue quality and operating leverage.
