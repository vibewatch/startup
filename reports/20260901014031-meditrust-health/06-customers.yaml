- id: durability-and-concentration
  title: Retention, Durability, and Concentration Limits
  body: |-
    The customer story is broad and commercially credible, but public durability evidence is still incomplete. There is no retained public disclosure of NRR, GRR, logo churn, renewal rate, average contract duration, satisfaction score, or cohort behavior for any major segment. That means an investor can verify breadth and blue-chip access without being able to verify how sticky the revenue really is. The strongest indirect durability argument is structural: once a payer workflow, payment rule set, and patient-support path are operating together, replacement should be harder than for a simple consumer app. The strongest caution is that relationship count is not the same as concentration disclosure. More than 90 or 100 insurers could still mask heavy reliance on a small number of programs, and 140-plus pharma relationships could still include many smaller or lower-revenue engagements. At the same time, city-insurance programs such as Huibao show how consortium underwriting and public-facing benefit rules can create durable channels if MediTrust remains embedded in the operating layer. The chapter-level view should therefore be constructive but disciplined: MediTrust has unusual ecosystem breadth and repeated proof of production relevance, yet the underwriting file still needs cohort, renewal, and concentration data before calling the customer base fully de-risked.
