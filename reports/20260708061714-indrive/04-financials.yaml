callouts:
  - calloutType: strength
    title: "2025 is the first clear public signal of scaled operating viability"
    body: "The combination of $6.4B gross bookings, $601.6M revenue, and positive adjusted EBITDA and net income marks a step-change from earlier years where inDrive's financial story was mostly capital-raising and growth rhetoric."
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: "Capital adequacy still cannot be fully underwritten"
    body: "Without audited statements, cash balances, burn, debt detail, or segment P&Ls, public investors still cannot tell whether 2025 profitability is durable or how much external capital the company may need next."
    claimRefs: [CI010, CI016, CI032, CI037]

