    - type: private-evidence-only
      severity: material
      topic: active-users-and-cohorts
      missingEvidence: "Public sources do not disclose active users, cohort retention, churn, or trip frequency by market for inDrive."
      whyItMatters: "Downloads and ratings do not prove durable customer quality or repeat behavior."
      diligencePath: "Request rider and driver cohorts by country and top cities, including repeat frequency, churn, and reactivation."
      relatedQuestionRefs: [QU019, QU023]
    - type: private-evidence-only
      severity: material
      topic: driver-net-earnings
      missingEvidence: "There is no reliable public dataset on net driver earnings after fuel, maintenance, wait time, and platform fees."
      whyItMatters: "Driver liquidity and satisfaction depend on net income, not on marketing claims about flexibility."
      diligencePath: "Request per-city driver earnings, wait times, take-home pay, and attrition by cohort."
      relatedQuestionRefs: [QU008, QU017]
      relatedTableRefs: [TU002, TU003]
