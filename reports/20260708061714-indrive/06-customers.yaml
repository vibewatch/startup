    claimRefs: [CU002, CU004, CU005]
  - id: FU002
    title: "Customer workflow / operating flow"
    type: flow
    summary: "The customer experience links passenger choice and driver selectivity inside one negotiated marketplace."
    data:
      nodes:
        - id: rider
          label: "Passenger proposes fare"
          type: demand
        - id: drivers
          label: "Drivers review route and offer"
          type: supply
        - id: select
          label: "Passenger selects driver"
          type: matching
        - id: ride
          label: "Trip completed"
          type: fulfillment
        - id: review
          label: "Ratings / feedback"
          type: loop
        - id: finance
          label: "Driver loan or retention layer"
          type: adjacent
      edges:
        - from: rider
          to: drivers
          label: "price request broadcast"
        - from: drivers
          to: select
          label: "accept / counteroffer"
        - from: select
          to: ride
          label: "match executed"
        - from: ride
          to: review
          label: "quality feedback"
        - from: review
          to: finance
          label: "ongoing driver relationship"
    claimRefs: [CU003, CU008, CU014, CU016, CU028]
  - id: FU003
    title: "Customer satisfaction and friction map"
    type: matrix
    summary: "Public customer evidence is strongest on app-store satisfaction and weakest on support consistency and market-specific economics."
    approximationNotes: "Matrix values use ordinal scores from 1 to 4, where 4 is strongest or most severe depending on the column label."
    data:
      columns: ["App-store satisfaction", "Perceived safety tools", "Driver earning appeal", "Support / friction severity"]
      rows:
        - label: "Global app-store surfaces"
          values: [4, 3, 3, 2]
        - label: "Colombia survey"
          values: [3, 4, 4, 3]
        - label: "Bangladesh reporting"
          values: [2, 2, 3, 4]
        - label: "Nigeria driver reporting"
          values: [2, 1, 1, 4]
        - label: "Kazakhstan grocery pilot"
          values: [4, 3, 3, 1]
    claimRefs: [CU011, CU012, CU019, CU021, CU023, CU031, CU032, CU037]

callouts:
  - calloutType: strength
    title: "Customer reach is already mass-market"
    body: "Downloads, ratings, country coverage, and recurring-use signals all indicate that inDrive is not a niche experiment but a large-scale consumer platform."
    claimRefs: [CU001, CU002, CU005, CU010]
  - calloutType: risk
    title: "Support quality and driver economics are still uneven"
    body: "Market-specific reporting shows that slow support, long-distance dispatch, low fares, and safety concerns can still erode loyalty even when headline ratings remain high."
    claimRefs: [CU019, CU020, CU021, CU023, CU036]

