callouts:
  - calloutType: strength
    title: "Scale is real"
    body: "The official 2025 revenue, gross-bookings, and profitability statements are strong enough to treat inDrive as a scaled late-stage platform rather than a venture narrative alone."
    claimRefs: [CV001, CV002]
  - calloutType: risk
    title: "The valuation problem is disclosure quality"
    body: "The biggest reason to avoid a premium entry price is not lack of growth but lack of audited, segment-level, and market-level data."
    claimRefs: [CV007, CV019, CV025]
  - calloutType: risk
    title: "Public comps do not justify automatic super-app pricing"
    body: "inDrive may deserve a premium to low-multiple public peers, but not a Grab-like premium unless management proves profitability durability and adjacency economics."
    claimRefs: [CV013, CV014, CV016, CV017]

