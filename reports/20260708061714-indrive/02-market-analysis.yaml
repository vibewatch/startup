callouts:
  - calloutType: insight
    title: "inDrive's real market is emerging-market digital mobility"
    body: "The company competes in the global ride-hailing market on paper, but the commercial sweet spot is the subset of emerging cities where consumers are highly price-sensitive and alternatives are weak or inconvenient."
    claimRefs: [CM012, CM013, CM020, CM031]
  - calloutType: risk
    title: "Demand is large, but realizable SAM is regulation- and trust-constrained"
    body: "Even in high-growth regions, licensing disputes, labor rules, and driver dissatisfaction can materially narrow the revenue opportunity that broad TAM figures imply."
    claimRefs: [CM024, CM025, CM027, CM040]

