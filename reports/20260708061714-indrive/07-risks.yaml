callouts:
  - calloutType: risk
    title: "Malaysia is the live red flag"
    body: "Malaysia provides the most concrete public example that local compliance failures can escalate from warnings to potential licence loss, making it the most important real-world monitor for inDrive's regulatory maturity."
    claimRefs: [CR010, CR011, CR012, CR013]
  - calloutType: risk
    title: "Safety tooling helps but does not settle the issue"
    body: "The company has published safety features for riders and drivers, yet repeated external complaints about verification, panic-button effectiveness, insecurity, and low fares show that execution quality remains a live operating risk."
    claimRefs: [CR005, CR006, CR018, CR022, CR023]
  - calloutType: strength
    title: "Compliance scaffolding is becoming more visible"
    body: "The compliance program, code-of-conduct language, procurement rules, and whistleblower system are all signs that governance processes are becoming more formal as the company scales."
    claimRefs: [CR002, CR003, CR004]

