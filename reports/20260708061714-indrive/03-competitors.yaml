callouts:
  - calloutType: strength
    title: "Negotiated pricing is a real point of difference"
    body: "Among the public competitor surfaces reviewed, inDrive is the clearest major platform built around passenger-proposed fares and explicit low-commission messaging."
    claimRefs: [CP001, CP017]
  - calloutType: risk
    title: "Scale and ecosystem breadth still favor incumbents"
    body: "Uber, Grab, and Bolt all show that the strategic battleground has expanded well beyond core rides into delivery, enterprise, and ecosystem services, where inDrive is smaller and less transparent."
    claimRefs: [CP014, CP015, CP021, CP022]

