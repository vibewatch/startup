    columns: ["Competitor", "Category", "Scale / public signal", "Target segment", "Differentiation", "Limitation for comparison"]
    rows:
      - ["inDrive", "Emerging-market ride-hailing and urban services platform", "2025 revenue $601.6M; 48 countries; 400M+ downloads", "Price-sensitive riders and drivers in emerging markets", "Passenger-proposed fares, lower-commission positioning, expanding multi-service stack", "Private company with limited market-by-market disclosure"]
      - ["Uber", "Global incumbent mobility platform", "2025 revenue $52.0B; market cap about $151.3B; thousands of cities", "Mass-market rides, enterprise travel, delivery, freight", "Largest global network, enterprise channel, broad multimodal ecosystem", "Product breadth is far larger than inDrive's current disclosed stack"]
      - ["Bolt", "European mobility super-app", "200M+ riders; 4.5M+ partners", "Cost-conscious urban riders, drivers, couriers, merchants", "Ride-hailing plus food, grocery, scooters, parcel, fleet tools", "Public revenue and market-share disclosure are limited"]
      - ["Grab", "Southeast Asia super-app", "900+ cities in 8 countries; TTM revenue $3.229B; market cap about $16.07B", "Consumers, drivers, merchants, enterprise and financial-services users in SEA", "Dense local ecosystem spanning transport, delivery, ads, and financial services", "Geographic overlap with inDrive is limited outside parts of Asia"]
      - ["Yango", "Regional emerging-market ride-hailing peer", "600+ cities, 17 countries, 700k drivers, 36M users", "Riders in large cities seeking fast and affordable transport", "Machine-learning routing plus scaled city footprint", "Public financial disclosure is limited and competitive overlap is uneven by country"]
      - ["Lyft / DiDi", "Public market comparables", "Lyft market cap about $5.86B; DiDi market cap about $15.95B", "Primarily U.S. or China-centered mobility markets", "Useful as valuation and monetization comparables", "Not direct like-for-like geographic competitors in most inDrive core markets"]
    notes: "The table mixes direct operating competitors and public-market comparables because inDrive's competitive and valuation sets only partially overlap."
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011, CP012, CP033]
  - id: TP002
    title: "Feature / capability matrix"
    columns: ["Buying criterion", "inDrive", "Uber", "Bolt", "Grab", "Yango"]
    rows:
      - ["Passenger-set fare negotiation", "Yes", "No public evidence on core product", "No public evidence on core product", "No public evidence on core product", "No public evidence on core product"]
      - ["Enterprise / managed business travel", "Unknown / limited public evidence", "Yes", "Unknown", "Yes via business / merchant ecosystem", "Unknown"]
      - ["Food / parcel / grocery adjacency", "Yes", "Yes", "Yes", "Yes", "Unknown from public extract"]
      - ["Driver earnings / payout tooling", "Yes", "Yes", "Yes", "Yes", "Unknown from public extract"]
      - ["Consumer safety tooling emphasized", "Yes", "Yes", "Yes", "Yes", "Yes"]
      - ["Financial-services adjacency", "Yes", "Limited from cited surfaces", "Unknown from cited surfaces", "Yes", "Unknown"]
    notes: "Unsupported cells are marked unknown rather than guessed. The matrix compares only what the cited public surfaces exposed clearly."
    claimRefs: [CP001, CP013, CP014, CP015, CP017, CP019, CP020, CP027, CP028, CP036]
  - id: TP003
    title: "Pricing / packaging comparison"
    columns: ["Platform", "Price / unit / contract model", "Included capabilities", "Public pricing / fee cue", "Implication"]
    rows:
      - ["inDrive", "Negotiated fare between rider and driver", "Core city rides plus adjacent services", "Media and company messaging emphasize lower commissions and transparent fees", "Strong local differentiation where riders and drivers distrust opaque algorithmic pricing"]
      - ["Uber", "Algorithmic app-based pricing with multiple ride products", "Consumer rides, delivery, freight, and business travel", "Public surfaces emphasize breadth rather than low commission", "Broad product stack and enterprise workflow matter more than fare negotiation"]
      - ["Bolt", "App-based rides with partner earnings after commission", "Ride-hailing, scooters, food, grocery, parcel, fleet", "Driver page references weekly net earnings after commission", "Competes on affordability and flexible supply, narrowing inDrive's driver-acquisition edge"]
      - ["Grab", "App-based rides and partner program economics", "Transport, food, express, merchant, ads, financial services", "Singapore driver page shows explicit platform fee examples and instant cash-out", "High local ecosystem density can outweigh inDrive's simpler value proposition"]
      - ["Yango", "App-based price discovery using mapping and routing systems", "Core ride-hailing", "Public extract emphasizes affordability and routing, not detailed fee terms", "Competes in some emerging markets on low-friction ride access rather than full super-app breadth"]
    notes: "The comparison focuses on publicly visible fare-formation and partner-economics cues; it is not a normalized take-rate model."
    claimRefs: [CP001, CP014, CP017, CP019, CP027, CP037, CP038]
  - id: TP004
    title: "Moat durability / competitive risk register"
    columns: ["Moat claim", "Threat", "Severity", "Mitigation / diligence ask"]
    rows:
      - ["Negotiated pricing is highly differentiated", "Competitors can copy some flexibility or offset it with promotions", "high", "Test rider and driver retention after price promotions by competitor city"]
      - ["Low commissions win supply loyalty", "Driver multi-homing keeps switching costs low", "high", "Measure exclusive-driver share and cross-app activity by city"]
      - ["Emerging-market focus creates defensibility", "Regional peers such as Yango or local apps can match price-sensitive positioning", "medium", "Map local competitor density in top 20 inDrive cities"]
      - ["Download scale translates into dominance", "Downloads do not guarantee ride liquidity or margin durability", "high", "Request trip density, repeat rates, and city contribution margins"]
      - ["Super-app expansion increases lock-in", "Larger rivals already have denser adjacency stacks", "medium", "Track cross-sell attach rates into delivery and finance"]
      - ["Safety tools build trust", "Recurring complaints on safety and fares can weaken the brand", "high", "Track incident rates, resolution times, and NPS by market"]
      - ["Private status enables focus", "Lower public disclosure makes institutional underwriting harder than for public peers", "medium", "Request cohort, take-rate, and city profitability data room exports"]
      - ["Regional scale can support valuation", "Public subscale peers trade at far lower valuations than Uber", "medium", "Benchmark valuation on realized revenue quality, not download rank alone"]
    notes: "Competitive durability depends less on brand slogans than on whether inDrive can create dense local liquidity and repeat behavior that rivals cannot easily buy away."
    claimRefs: [CP018, CP021, CP022, CP024, CP025, CP026, CP031, CP032, CP034, CP035, CP039, CP040]

