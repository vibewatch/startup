    - type: private-evidence-only
      severity: material
      topic: market-share
      missingEvidence: "There is no consistent public country-by-country market share dataset showing inDrive against Uber, Bolt, Grab, Yango, and local rivals in its top cities."
      whyItMatters: "Without city-level market share and liquidity data, it is difficult to distinguish a strong local wedge from a broadly commoditized marketplace."
      diligencePath: "Request top-50 city trip share, active rider share, and active driver share benchmarks versus named competitors."
      relatedQuestionRefs: [QP024]
