callouts:
  - calloutType: strength
    title: "The product is differentiated at the transaction layer"
    body: "inDrive's strongest product difference is not feature count but the rider-driver interaction model: negotiated fares, visible counteroffers, and explicit user choice."
    claimRefs: [CE001, CE002, CE026]
  - calloutType: risk
    title: "Engineering disclosure still lags product ambition"
    body: "The company publishes meaningful safety and strategy material, but public diligence still lacks software architecture detail, reliability metrics, security certifications, and quantified roadmap milestones."
    claimRefs: [CE016, CE027, CE035, CE038]

