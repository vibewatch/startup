  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与政策敞口
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清晰的一线风险信号是，当本地合规薄弱时，inDrive 的运营模式可能撞上硬监管边界。Malaysia 是最近最具体的案例：多篇 2025 年报道称，交通监管部门因强制 e-hailing
              许可和司机文件合规相关失败，发出或支持撤销行动，之后在上诉后允许一段试用期。这不是理论上的政策争论，而是直接证据：如果 inDrive
              的本地控制不到位，市场准入可能被中断。平台业务面对的更大政策环境也在收紧。European 政策材料称，Platform Work Directive 创造了新的算法管理和劳动者保护义务；inDrive
              自己的合规页面则称，公司正在全球范围内正式化风险评估、反腐规则、举报人保护和法律政策。合在一起，这些点支持一个平衡判断：inDrive
              正更认真地对待合规，但本地执行不一致的成本，正比公司单靠交易平台增长所能覆盖的速度更快地上升。inDrive
              只是聚合器这一法律模型抗辩，可能有助于塑造责任边界，但不能消除在未来扩张最重要司法辖区中的牌照、劳动者分类、隐私或消费者保护风险。
