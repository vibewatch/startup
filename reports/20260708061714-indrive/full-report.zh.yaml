      - number: '8.2'
        title: 可比公司、敏感性与情景区间
        blocks:
          - type: paragraph
            body: >-
              公开可比公司框架在这里有用，但只适合用来框定区间。Multiples.vc 和 CompaniesMarketCap
              显示，公开上市的网约车平台会因地域、盈利能力和投资者信心不同，交易在差异很大的收入倍数上。Uber 享有数倍的溢价，Grab 的倍数也相对较高，而 Lyft 和 DiDi 明显更低。把这些 2026 年末公开
              P/S 倍数套到 inDrive 已披露的 2025 年 $601.6 million 收入上，得到的隐含股权价值区间非常宽，大约从 $474 million 到 $2.48
              billion。这个跨度本身就是重点：公开市场给移动出行平台定价，看的是收入质量、披露水平和对利润率韧性的信心，不只是覆盖范围或下载份额。按同业中位数计算，结果更接近约 $1.05 billion，低于
              Tracxn 在 2024 年 3 月给出的 $1.7 billion 私人估值信号。合理解读是，如果 inDrive
              的盈利里程碑真实且可持续，它可能配得上相对低倍数公开同业的溢价；但没有经审计证明之前，还不配拿到类似 Grab 或超级 App
              的倍数。由此得到一个谨慎的情景框架：悲观情景绑定低倍数和较高风险；基准情景接近上一轮私人估值低端；乐观情景则要求盈利能力得到验证，并且有更强证据证明相邻业务是在创造价值，而不是分散注意力。
