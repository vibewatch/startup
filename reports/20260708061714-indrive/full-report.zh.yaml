      - number: '4.2'
        title: 单位经济、同业基准与资本强度
        blocks:
          - type: paragraph
            body: >-
              公开基准数据能帮助框定 inDrive 的承销问题，但不能解决它。Grab 2025 年 20-F 显示，按需 GMV 为 $22.1 billion，收入 $3.37 billion，激励约 $2.3
              billion、相当于按需 GMV 的 10.2%，调整后 EBITDA 为 $500 million。Uber 2025 年 10-K 显示收入 $52.0 billion，并称总订单额增长 19%；Lyft
              2025 年 10-K 披露第四季度活跃乘客 29.2 million，全年总订单额 $18.5 billion，调整后 EBITDA $528.8
              million。这些文件重要，因为它们说明即便已具规模的出行平台，也仍在非常精细地管理激励、流动性缓冲和运营杠杆。放在这个背景下，inDrive 报告 2025
              年盈利为正是积极信号，但质量较弱，因为数字仍是初步且未经审计。公司也不披露乘客队列、司机支出比例、贡献利润率、城市级抽成率或分部盈利能力。因此，最好的公开结论不是 inDrive
              已完全证明交易平台经济模型，而是它已经从增长故事跨入潜在可行的规模化交易平台，同时仍未公开提供今天严谨单位经济分析所需的底层证据。这个缺口在竞争激烈的城市尤其重要，因为激励强度和安全投入可能很快改变贡献利润率。
