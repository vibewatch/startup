        blocks:
          - type: paragraph
            body: >-
              资本充足性是公开图景先改善、又很快变得不透明的地方。多家 2024 年来源称，inDrive 将 General Catalyst 的融资安排从 2023 年获得的初始 $150 million 扩大到 $300
              million，该结构旨在为产品投资、服务扩张和市场进入增加灵活性。这很重要，因为它表明公司在 2025 年盈利里程碑之前，已有外部能力继续资助增长。但与 Uber、Lyft 和 Grab
              不同，这些公司会在申报文件中发布详细现金和流动性披露；inDrive 仍不公开披露手头现金、不受限流动性、烧钱速度或正式 runway。比如 Lyft 在 2025 年末持有约 $1.1 billion
              现金、$705.2 million 短期投资，以及 $420 million 未提取循环信贷；Uber 年末持有 $7.6 billion
              不受限现金、现金等价物和短期投资。因此，公开证据支持一个谨慎判断：General Catalyst 扩容之后，inDrive 的资本灵活性很可能优于此前；2025
              年实现盈利为正之后，运营质量也优于此前。但没有私有尽调材料，投资者仍无法承销资金充足性、信用敞口或下一次融资触发点。他们也看不到应收款质量、受限现金或国家级盈利能力。
