  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、论点质量与价格纪律
        blocks:
          - type: paragraph
            body: >-
              inDrive 的投资逻辑概念上有吸引力，但写进模型时很脆弱。积极一面是，公司现在既有差异化的市场定位，也有比早期独角兽叙事大得多的规模：2026 年官方沟通提到，2025 年总预订额为 $6.4
              billion，收入 $601.6 million，调整后 EBITDA 和净利润为正，业务覆盖 48 个国家、1,200 多座城市。这个量级足以把 inDrive
              看作已成规模的后期移动出行平台，而不是一个带区域概念的投机性
              App。但估值离不开证据质量。今天不发出买入建议，最强理由是最关键指标仍处在初步、未经审计或未公开状态。投资者仍看不到经审计财报、现金余额、队列经济，以及生鲜杂货、信贷和其他相邻业务如何影响利润率与资本强度的清晰公开视图。因此审慎建议是观察：保持关注，估值有纪律时可以接触，但不要只凭叙事去承销溢价结果。落到操作上，最近可信的私人估值信号值得尊重；但在披露质量显著改善、管理层拿出经审计硬证据支撑核心假设之前，不能把这些信号视为已经被公开市场可比公司自动验证。
