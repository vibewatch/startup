  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与使用模式
        blocks:
          - type: paragraph
            body: >-
              inDrive 的客户基础不只包括乘客。公开 App Store 描述明确把产品呈现为乘客 App 和司机
              App，同时把同一工作流延伸到骑手、货车预订用户和本地服务提供者。这很重要，因为平台需求侧其实是一组相邻城市服务任务，被议价定价和用户选择这一共同理念串在一起。使用信号显示覆盖范围很大。AppBrain 报告
              Android 下载量为 370 million、评分数为 15 million；iPhone 列表显示 376,000 个评分给出 4.8 分，并支持 24 多种语言。公司页面和城市目录也显示，其足迹覆盖 48
              个国家和 1,100 多座城市。公开的具体市场证据又增加了深度。在 Colombia，一份公司背书的安全报告称，2024 年有 21.5 million 人使用基于 App 的出行服务，35%
              的乘客每周使用多次。含义是，inDrive
              服务的是广泛、高频的大众城市出行人群，尤其是在新兴市场，日常出行中可负担性和控制感比高端品牌更重要。这也意味着，客户视角必须同时包括终端消费者便利性和劳动者侧流动性，因为同一个 App 试图同时留住两边。
