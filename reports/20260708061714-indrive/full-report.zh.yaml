      - number: '7.3'
        title: 依赖、财务模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              inDrive 的下一层风险来自它正在变成什么，而不只是它已经是什么。公司不再是单一服务网约车 App；它在增加生鲜杂货、金融服务、采购基础设施和更大的合规栈，同时仍在 48 个国家和 1,200
              多座城市运营。这会制造合作伙伴、资本和管理依赖，并可能快速传导到客户信任和估值。采购规则显示出更正式的供应商管理姿态，但也意味着公司依赖外部软件、入驻系统和供应商。Colombia 和 Peru 的
              fintech 启动，把许可、承销、还款和欺诈敞口提升到核心出行之外。Uber、Lyft 和 Grab 等公开同业会发布经审计申报文件，内含详细风险因素、激励负担和流动性披露；inDrive
              仍没有。这个缺口让外界更难判断，如果几个主要市场转向不利，管理层能否同时资助安全、合规、新服务和激励。它还带来人才风险：业务现在同时需要本地监管运营者、信任与安全领导、贷款控制和有纪律的资本配置。公司有动能，但公开证据仍支持一个残余论点：执行复杂度上升快于披露质量，因此投资者需要围绕牌照丢失、司机反复动荡、监管收紧，以及任何新相邻业务稀释焦点却没有增加持久经济性的迹象，设定明确止损条件。
