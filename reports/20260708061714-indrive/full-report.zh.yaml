  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，inDrive 主要以交易平台身份变现，而不是传统交通运营商。公司自己的 2025
              年增长文章把总订单额定义为已完成出行和配送在扣除司机收入、激励、退款及其他调整之前的总价值；收入则是在这类交易活动流经平台后留下的更小金额。2025 年，公司报告初步总订单额 $6.4 billion，收入
              $601.6 million，同比上升 31%；2026 年 CFO 任命公告重复了这些数字，并称公司实现调整后 EBITDA 和净利润为正。这是最清晰的公开证据，说明业务如今具备真实运营规模。公开披露隐含的收入
              / 总订单额比率约为
              9.4%，方向上符合一个佣金驱动的出行交易平台：大部分交易价值仍流向司机、骑手、商户或交易对手。问题在于，公开披露远未构成完整收入模型。管理层称出行业务仍是核心，但公司也提到配送、附加服务和合作伙伴，却没有拆分各条线贡献多少收入，也没有说明
              fintech 变现是否已经重要。
