        title: 护城河耐久性、多平台使用与负面证据
        blocks:
          - type: paragraph
            body: >-
              支持 inDrive
              耐久性的最强论点，是议价定价和较低抽成叙事，比高度优化的算法定价更适合渗透不足、对可负担性敏感的市场。当在位者被视为昂贵或不透明时，这会提升本地品牌共鸣和司机获取。但同一组证据也说明护城河为何脆弱。Grab
              明确允许司机非独家参与，这是供给侧多平台使用在出行行业仍很普遍的直接公开信号。Bolt 对司机的招募话术围绕灵活工时和每周净收入，意味着 inDrive
              并不是唯一在销售独立性和透明度的平台。公开市场可比公司也显示，中小规模出行公司很难把使用量转化为持久估值溢价：Uber 拥有巨大的规模优势，而 Lyft、Grab 和 DiDi
              即便有数十亿美元收入，市值也只在百亿美元中段或个位数十亿美元。inDrive
              自身的用户评价和投诉足迹进一步强化了这一点。采纳很强，但围绕低价、安全和价格谈判的司机与乘客纠纷反复出现。结果是，公司有真实区域适配性，但护城河耐久性只能算中等；除非它能把下载份额转化为更深的生态锁定、更强的安全信任和逐城密度优势。
