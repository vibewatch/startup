        title: 平台扩张与运营架构
        blocks:
          - type: paragraph
            body: >-
              证据现在显示出更广的多服务运营模型。公司页面和 PRNewswire 发布材料描述了一串正在扩张的城市服务，超出城市出行本身，包括城际交通、同城配送、货运配送，以及就业或任务协助。TechCrunch 2025
              年和 2026 年报道又加上下一层：通过 Kazakhstan 的前置仓做生鲜杂货配送、在 Pakistan
              以合作伙伴主导方式启动，以及一个旨在提高前沿和新兴市场使用频次、忠诚度和生态价值的超级应用战略。管理层还称，公司对不同本地运营模型持开放态度，包括在夫妻店网络密集市场采用合作伙伴模式；这说明产品架构是模块化、因地制宜的，而不是全球固定模板。Fintech
              相邻业务强化了同一模式。inDrive Money 在 Mexico、Colombia 和 Peru 推出，作为面向司机的贷款与金融普惠层，旨在提升留存、忠诚度和
              GMV。因此，虽然公司没有公开软件架构图，运营架构已经可见：一个聚合 App 位于中心，周围是本地支付、安全控制、物流或前置仓运营，以及合作伙伴集成。Kazakhstan 的前置仓细节和 Pakistan
              的合作伙伴主导路径也说明，inDrive 愿意根据本地市场结构采用不同履约打法；这在碎片化新兴市场是一项重要运营能力。
