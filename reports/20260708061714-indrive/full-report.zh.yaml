            body: >-
              公开证据显示，inDrive 最可见的产品差异化仍是车费形成机制和供给侧经济。平台让乘客先报价，司机接受或还价；管理层和媒体报道也反复把服务定位为比在位 App
              佣金更低、更透明。这在成本敏感城市是有意义的差异，但周边产品栈正在逐渐趋同。Uber 提供消费者出行、配送和企业差旅；Grab 把交通与餐饮、包裹、贷款、保险和合作伙伴计划叠在一起；Bolt
              将自己营销为出行超级应用；Yango 强调算法派单、地图和区域规模。竞争对手也大量投入司机侧工具，例如即时提现、支持、保险或金融服务。即便 inDrive
              的定价机制不同，这些投入也削弱了其更广供给主张的独特性。企业分发是另一个缺口。Uber for Business 为大型组织提供受管理差旅流程，inDrive 公开层面尚未匹配；Grab
              已在密集本地生态中销售企业和商户服务。简言之，inDrive 拥有独特的核心交易模型，但它竞争的市场里，相邻能力和分发渠道正越来越多地被打包在一起。
