chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、规模与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              inDrive 的起源故事今天仍重要，因为公司的产品逻辑直接从那里长出来。平台把源头追溯到 2012 年新年前夜 Yakutsk
              的一次民间自发行动：严寒天气下，当地出租车运营者据称把价格涨到三倍，居民便用社交媒体组织搭车。公司现在称自己成立于 2013 年，并于 2018
              年在美国注册，这反映出民间运动的起点与后来正式公司结构之间的差异。这个起源与产品高度吻合：乘客提出车费，附近司机可以接受或还价，公司把这种议价模式定位为一种公平替代方案，用来对抗不透明的算法定价。到 2026 年
              7 月，inDrive 官方公司页面称其在 48 个国家和 1,200 多座城市运营，App 安装量超过 400 million；独立的 2025–2026 年报道也把它列入全球下载量最高的网约车 App
              之一。平台还从网约车扩展到城际出行、同城与货运配送、司机贷款、生鲜杂货、广告，以及面向新兴市场价格敏感消费者的更大超级应用战略。
