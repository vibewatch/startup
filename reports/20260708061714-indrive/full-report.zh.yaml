      - number: '8.3'
        title: 尽调关口、退出准备度与投资逻辑破坏项
        blocks:
          - type: paragraph
            body: >-
              inDrive 仍留在观察档，并不是因为业务弱，而是证据还不完整。公开同业会发布经审计年报、现金头寸、风险因素和分部明细，让投资者把增长转化为有纪律的估值。inDrive
              还没有做到。它已经展现出足够牵引力，值得认真关注；但公开披露还不足以支持今天以开放式溢价建立高确信度仓位。最重要的尽调关口很直接：经审计财务报表；当前股权结构表和优先股堆叠；现金、债务和融资契约；按市场拆分的单车经济；以及信贷账簿和监管姿态的完整视图。退出准备度同样好坏参半。规模、地域覆盖和新
              CFO
              都有帮助，但劳工、监管和披露问题未解，仍应相对最干净的公开同业打折。若市场准入问题加剧、初步盈利经不起审计、信贷带来隐藏亏损，或公司继续扩张相邻业务却不讲清资本配置，投资逻辑就会破裂。反过来，如果管理层拿出经审计盈利、按市场拆分的留存和抽佣率数据，并证明新服务提升客户终身价值而不只是扩大业务范围，建议就会改善。
