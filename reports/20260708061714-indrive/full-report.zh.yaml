  - id: TV005
    title: 投资逻辑失效与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 审计质量不及预期
        - 审计后的收入、EBITDA 或现金显著弱于公开信号
        - 削弱「规模 + 盈利」逻辑
        - 除非重新定价，否则从跟踪转为回避
      - - 重要市场丢失牌照
        - 重点司法辖区最终暂停或被迫退出
        - 说明合规系统没有跟上覆盖范围扩张
        - 上调风险评级，下调可接受倍数
      - - 放贷损失意外
        - 重大违约、核销或合作伙伴退出
        - 业务组合从出行上行变成隐性信贷风险
        - 剔除金融科技上行，并拉宽悲观情景
      - - 邻近业务无证据扩张
        - 上线更多业务，但仍没有分部经济性或 LTV 证据
        - 说明范围在扩大，价值却未创造
        - 拒绝给予超级应用溢价
      - - 持续劳工不安
        - 公开罢工反复出现，或低车费争议迟迟未解决
        - 指向市场健康度偏弱和留存压力
        - 上调激励假设，下调情景概率
    notes: 这些触发因素把章节证据转成具体估值护栏。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV024
      - CV036
      - CV037
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 审计财务
        - 利润表、资产负债表、现金流量表、审计意见
        - 公开数字仍是初步口径
        - 索取 CFO 材料包和审计师材料
      - - 股权结构表和优先权堆栈
        - 最新所有权、债务、认股权证、清算优先权
        - 入场纪律取决于真实经济优先级和稀释
        - 索取董事会批准的股权结构表材料包
      - - 现金、债务和契约
        - 流动性、现金跑道、受限现金、融资条款
        - 增长质量取决于融资灵活性
        - 索取资金管理和融资明细表
      - - 市场级单位经济性
        - 主要市场的行程量、抽佣率、激励和贡献利润率
        - 任何上市可比公司溢价都需要这些数据支撑
        - 索取前 10 大市场 KPI 包
      - - 放贷和监管敞口
        - 贷款账簿、损失、合作伙伴结构、各国法律状态
        - 金融科技上行可能藏着下行风险
        - 索取金融风险材料包和各国法律顾问备忘录
    notes: 这些是把公开市场框架推进到投资级私有估值判断所需的最低要求。
    claimRefs:
      - CV006
