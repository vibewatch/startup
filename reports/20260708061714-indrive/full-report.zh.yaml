        - 估值维持在有纪律的后期阶段区间，约 USD 1.0B-1.6B
        - 没有经审计 KPI，投资人拒绝支付高于上市可比公司中位数的价格
        - 最符合当前公开证据
      - - 悲观
        - 监管或劳工压力加剧，公开市场投资人锚定低倍数可比公司
        - 估值压缩至约 USD 0.5B-0.8B
        - 牌照丢失、审计结果偏弱或隐性信贷损失带来下行
        - 由未解决的不利证据触发
    notes: 这些情景锚定公开收入、上市可比公司区间和风险传导，而不是精确的 DCF 式预测。
