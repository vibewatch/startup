      - number: '2.2'
        title: 新兴市场机会地图
        blocks:
          - type: paragraph
            body: >-
              对 inDrive 最相关的市场机会，不是全球网约车市场的平均值，而是那些可负担性、智能手机普及和弱替代品共同让议价定价模式有吸引力的地区子集。公开证据显示，Asia Pacific
              仍是最大且增长最快的网约车区域，Latin America 和 Middle East/Africa 也继续从较小基数扩张。Global Market Insights
              把这种增长归因于城市化、数字支付发展，以及消费者对便捷交通偏好的上升；IMARC 也明确强调 Latin America 和 MEA 是持续增长区域。这种区域画像与 inDrive 自身足迹高度贴合。管理层在
              2026 年称，Latin America 略高于 inDrive 业务的一半；公司页面和 TechCrunch 也描述了一个已横跨 48 个国家、重点服务发展中市场成本敏感用户的平台。公司在
              Kazakhstan、Pakistan、Colombia、Peru、Mexico 和 Brazil 推进生鲜杂货、配送和嵌入式金融的超级应用战略，也进一步确认 inDrive
              把新兴市场视为一个可扩展服务生态，而不只是网约车订单量池。因此，这个机会最好理解为新兴市场、多服务、智能手机原生的出行与服务市场，而不是同质化的全球出租车替代品。
