      - number: '5.3'
        title: 工程信号、差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              inDrive 的公开工程披露，在谈产品哲学时最强，在投资者希望看到硬系统细节时最弱。AV Initiative 微站是公司发布过最清晰的技术宣言：它认为，更便宜的硬件、持续进步的 AI 模型、来自 1,100
              多座城市的自有运营数据、监管存在，以及合作伙伴主导生态，可以让自动驾驶出行在新兴市场变得可行。它还明确说，inDrive
              想贡献数据、市场准入、标准工作、试点基础设施和合作伙伴关系，而不是成为资本密集型汽车制造商或 robotaxi
              车主。这是有用的产品战略披露，但不同于发布技术栈图、模型架构、延迟指标、安全认证或可靠性历史。最好的开发者信号和产品组织代理，反而来自 AppBrain 的 App 规模数据，以及 inDrive 的 Women
              Drive hackathon；后者有来自 10 个国家、横跨工程、产品、分析、设计和运营的 100 多人参与。因此，关键技术风险是双重的：inDrive
              看起来有创新性，也能适应运营环境，但除信任与安全功能外，它披露的实现细节仍远少于尽调流程理想所需。投资者能看到产品意图，却看不到足够量化证据来判断发布可靠性、欺诈压制、模型表现或逐模块可扩展性。
