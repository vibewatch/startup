      - number: '6.2'
        title: 司机生态与经济价值主张
        blocks:
          - type: paragraph
            body: >-
              供给侧是客户故事的核心，因为司机也是用户，他们是否愿意留下决定了流动性和服务质量。公开材料持续把 inDrive
              宣传为比传统出租车或网约车平台更划算的司机选择：司机可以选择订单，接单前看到目的地和价格，提出不同车费，并且在某些情境下在启动期支付低服务费甚至零服务费。公司还通过 inDrive Money
              延伸关系；citybiz、Financial IT、FinTech Magazine 和 PYMNTS 都把它描述为面向难以获得传统信贷司机的金融普惠产品。同一批来源称，该产品可以支撑忠诚度、留存和
              GMV。但司机生态并非没有摩擦。Bangladesh 报道提到长距离派单带来的挫败感、佣金政策不清、没有可见办公室和支持响应缓慢；Nigerian
              司机工会批评则集中在低车费和安全薄弱。因此，真实的司机主张最好理解为：用更高感知控制和更低费用，换取比严格管理派单系统更大的交易平台波动。实践中，这让司机体验混合了自由、定价灵活性和不确定性，在一座城市可能有吸引力，在另一座城市则令人沮丧。
