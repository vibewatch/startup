      - number: '6.3'
        title: 评分、满意度与反复出现的痛点
        blocks:
          - type: paragraph
            body: >-
              客户情绪强到足以证明产品—市场匹配，但也弱到让信任仍是活的尽调主题。积极一面在多个界面可见。AppBrain 显示 Android 评分为 4.74；JustUseApp 基于大规模评价语料给 App 99.5
              的安全得分和 99.6 的合法性得分。在 Colombia，用户把监控、地理定位、路线分享和身份验证归功于信任建立；TechCrunch 引用的 Kazakhstan 生鲜杂货试点据称达到 NPS
              83，每位用户每月下 5 个生鲜杂货订单。但负面证据同样重要。TechCrunch 称，India 十多名乘客和司机因为安全担忧和竞价模式被滥用，不再偏好使用 inDrive。TBS Bangladesh
              报道了支持响应缓慢和长距离匹配投诉；Nigerian 司机代表称，低车费和验证薄弱危及收入与安全。总体结论是，客户满意度在 App Store
              和试点层面较高，但支持一致性、安全感知和本地市场经济性仍随地理而变。这种不均衡，是公开客户证据应被视为鼓舞但仍非定论的主要原因。它也提出了集中度问题：哪些市场贡献了最强复购。
