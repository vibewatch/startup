      - number: '1.3'
        title: 资本轨迹与财务披露
        blocks:
          - type: paragraph
            body: >-
              相比早期独角兽叙事，最重要的新变化是 inDrive 的财务规模看起来已明显大于许多二级数据库暗示的水平。公司 2026 年官方沟通称，2025 年总订单额达到 $6.4 billion，收入达到 $601.6
              million，均为初步且未经审计数据，并且业务实现调整后 EBITDA 和净利润为正。资本形成方面，公开证据支持三个层次。第一，公司在 2021 年完成一轮 $150 million 融资，参与方包括
              Insight Partners、General Catalyst 和 Bond Capital，公司估值为 $1.23 billion，并由此成为独角兽。第二，General Catalyst 在 2023
              年提供了进一步的 $150 million 融资安排，并在 2024 年把承诺扩大到 $300 million。第三，Tracxn 等数据库保留了更早由 Bond Capital 和 Leta Capital
              领投的风险轮次，并把 2024 年 3 月融资事件关联到 $1.7 billion 的投后估值估算。由于公开来源对 General Catalyst
              结构应视为债务、混合融资，还是累计融资总额的一部分并不一致，投资者应谨慎看待头条式累计融资数字，把重点放在已披露资本获取的时间线，以及 2025 年业绩所暗示的运营规模改善上。
