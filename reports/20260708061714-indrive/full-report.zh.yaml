      - number: '2.4'
        title: 增长驱动、采纳约束与监管过滤器
        blocks:
          - type: paragraph
            body: >-
              证据中反复出现四个结构性需求驱动：智能手机和互联网渗透、快速城市化与拥堵、数字支付采纳，以及避免私家车拥有成本的经济性。GSMA 称，移动订阅用户已约占全球人口
              70%；市场研究机构也反复把智能手机可得性和无现金支付视为网约车采纳的前提。具体到
              inDrive，较低佣金和乘客—司机议价扩大了吸引力，尤其是在消费者看重对车费的直接控制、司机反感不透明算法定价的地方。但同样的特征也制造真实约束。来自 Nigeria 和 India
              的司机投诉报道显示，议价定价可能恶化为低价压力；安全感知在部分市场仍是现实问题。监管风险同样实质。European Parliament 的 2024 年平台工作简报称，2021 年有 28 million
              人通过数字平台工作，并预计 2025 年达到 43 million；新的 EU 指令引入就业推定和算法管理规则，成员国必须在两年内落实。欧洲之外，Bangladesh 和 Malaysia
              呈现的是另一组约束：即便消费需求存在，本地牌照和合规也可能限制增长。因此，市场在增长，但可实现机会先要经过信任、本地规则制定和供给侧经济的过滤，而不是只由需求决定。
