  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心流程：议价出行、用户选择与安全层
        blocks:
          - type: paragraph
            body: >-
              inDrive 核心服务中最关键的产品机制，不只是基于 App
              的派单，而是用户议价的交易流程。公开材料称，乘客输入上车和下车地点，提出价格，再根据成本、评分和车型评估可用司机给出的还价或接受的报价。这意味着产品围绕选择和价格发现设计，而不是完全算法自动化。公司反复把这种流程描述为对交易平台双方都更公平、更透明。安全和身份直接嵌入行程流程。乘客材料称，司机会接受背景检查和证件验证；行程参与者可以使用匿名通信、实时行程分享、紧急呼叫、支持入口和可信联系人通知。面向司机的安全材料又加入乘客自拍验证、评分系统和接单前身份提示。合在一起，产品最好被理解为一种出行工作流：它把议价定价、行前信息不对称降低，以及
              App 内信任工具结合起来，而不是一个简单按需出租车克隆。接单前显式展示司机身份、评分和车辆信息，也是一种设计选择，用透明度替代更多算法竞争对手采用的部分隐藏逻辑。
