      - number: '1.4'
        title: 里程碑、扩张动作与负面信号
        blocks:
          - type: paragraph
            body: >-
              对公司概览的判断，不只取决于增长里程碑，也取决于 inDrive 的历史如何制造持续尽调风险。2023 年以来，inDrive 打开美国市场，设立专门的风险投资与并购部门，推进司机金融服务，在
              Kazakhstan 和 Pakistan 启动生鲜杂货战略，并发布了面向新兴市场的自动驾驶宣言。这些动作说明，公司想成为多服务平台，而不是单一网约车 App。与此同时，负面记录也很实质。公司称其已于 2022
              年退出 Russia，外部追踪方称俄罗斯法人实体在 2023 年 4 月转入一个 Kazakh 结构，后来以 INDELS 品牌运营。其他地区的运营与声誉挑战仍在继续：一项 Bangladesh 调查称公司缺少
              BRTA 批准，Malaysia 监管部门在 2025 年推动撤销其中介许可证，Nigerian 司机群体也公开抨击平台在安全、身份验证和不可持续低价上的问题。这些问题并不否定增长故事，但意味着投资者应把
              inDrive 视为一个已具规模的新兴市场平台，同时伴随显著监管与信任管理执行风险，而不是一个无摩擦的出行成功案例。
