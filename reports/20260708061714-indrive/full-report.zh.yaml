      - number: '7.2'
        title: 运营、安全与劳工风险
        blocks:
          - type: paragraph
            body: >-
              inDrive
              的运营风险与交易平台质量不可分割。公司披露了对乘客和司机都有意义的安全功能，包括验证、匿名通信、行程分享、紧急帮助和支持渠道；这说明管理层把信任理解为产品要求，而不是营销附加项。但外部证据显示，这些工具无法完全抵消一线问题。Bangladesh
              报道强调，用户对许可和平台责任感到困惑；来自 Nigeria 的 2025 年和 2026 年报道则显示，关于不安全、低车费、乘客验证薄弱，以及需要可用 panic button 和保险保护的投诉反复出现。由于
              inDrive
              的定价模式给用户更多直接控制，交易平台可能凭公平和可负担性赢得用户，同时仍让司机承受比高度优化派单系统更波动的经济和支持负担。这很重要，因为糟糕的安全感知、缓慢支持或收入挫败，会同时损害两边流动性：乘客失去信任，司机多平台接单或罢工。因此，公司面对的是典型的新兴市场执行问题。它有足够产品差异化来吸引用量，但要守住这些用量，需要逐城运营纪律、更快事件处理和更一致执行；公开披露尚无法证明它在所有市场都做到了。
