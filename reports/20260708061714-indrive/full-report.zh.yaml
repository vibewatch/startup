      - number: '1.2'
        title: 领导层、总部与治理背景
        blocks:
          - type: paragraph
            body: >-
              目前公开证据显示，inDrive 以美国为总部；公司背书的新闻材料提到 Mountain View, California，Reuters 报道也称其为美国总部公司，同时指出 Kazakhstan
              是最大的员工中心。创始人 Arsen Tomsky 仍担任 CEO，也是公司使命驱动品牌的象征锚点。2026 年，公司补强高管层，任命 Abhey Lamba 为 CFO、Sidd Mantri 为
              CPO；公司页面还列出 Evgenia Matrosova、Andries Smit、Tatiana Terentieva 和 Yuri
              Misnik，覆盖核心运营、增长、法务和技术职能。这足以说明公司有一支严肃的职能领导团队，但不足以完成治理尽调：公司没有公开提供详细董事名单、独立性图谱或委员会结构。公开证据对员工规模同样不一致。同一个官方公司页面在
              Arsen Tomsky 简介中提到全球团队近 3,000 人，又在里程碑模块写到 3,700 多名员工；Tracxn 则报告截至 2026 年 5 月有 11,657
              名员工。审慎结论是，员工数存在重大披露不足且相互冲突，不能仅靠公开来源精确得知。
