      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              inDrive 可触达市场里的买方、用户和付款方角色，比简单的乘客—司机交易平台更复杂。在个人网约车核心业务中，终端用户是乘客，付款方通常也是同一个人，用现金或数字支付自掏腰包。供给侧上，司机不是经典 SaaS
              意义上的买方，但他们是关键经济参与者，因为他们承担车辆、燃油和时间成本，同时通过平台支付佣金或偿还融资。随着 inDrive
              扩张，分层变得更丰富：企业出行买方可以是为员工交通付费的雇主或差旅经理；生鲜杂货或同城配送服务引入商户、托运方和家庭；inDrive Money 则把司机和骑手变成金融服务用户，R2
              或合作机构提供资本。公开市场研究支持这种更宽的视角。Research and Markets 纳入商业和个人终端用户；Global Market Insights
              强调企业出行是增长细分，并指出集中计费和行程管理工具正在把企业拉向平台化交通。对 inDrive 来说，最重要的采纳模式是，一个 App
              可以服务成本敏感城市用户的多种高频出行或挣钱任务，但每个细分仍有不同预算所有者、信任门槛和切换触发点。
