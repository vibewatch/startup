companyProfile:
  summary: >-
    inDrive 是一家全球出行交易平台，由 Arsen Tomsky 创立于 Yakutsk，如今以美国为总部运营，在新兴市场覆盖很深。它最鲜明的产品机制是议价定价：乘客先提出车费，司机可以接受或还价。这个模式帮助平台扩展到 48
    个国家、1,200 多座城市。公司 2026 年官方沟通称，2025 年初步总订单额为 $6.4 billion，收入为 $601.6 million，并实现调整后 EBITDA
    和净利润为正；但公开市场投资者仍拿不到经审计报表、市场级单位经济、以及完整股权结构。
