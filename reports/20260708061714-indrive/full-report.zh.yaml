  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              inDrive 的相关市场比出租车叫车更宽，但比全部城市交通更窄。公开市场研究机构通常把网约车定义为通过 App
              预订的按需客运收入或订单额；根据发布方方法论不同，相邻层还可能包括企业出行、城际、汽车共享、同城配送以及其他 App 介导的交通类别。这个区分很重要，因为 inDrive
              自己已不再只是一个网约车交易平台：公司现在把网约车、城际、配送、货运、生鲜杂货和司机金融产品打包成多服务平台。聚焦核心网约车层，当前证据指向一个很大的全球市场。Global Market Insights 估算
              2025 年为 $188.6 billion、2026 年为 $213.2 billion；IMARC 则把 2025 年规模定为 $206.5 billion，并预计 2034 年达到 $398.4
              billion。这些估算不完全相同，但方向一致。Statista 的方法说明提到，它用订单额和收入自下而上建模网约车，而不是采用单一自上而下叙事；Research and Markets
              则通过多个细分市场、车型和区域拆分来框定该类别。实际结论是，inDrive 的 TAM 显然很大，但精确市场规模取决于口径：只算乘客 e-hailing，还是算 inDrive 越来越想参与的更广义出行服务栈。
