  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、超级应用与替代品
        blocks:
          - type: paragraph
            body: >-
              inDrive 不是在单一同业集合里竞争。全球层面，Uber 仍是规模最清晰的在位者，把网约车、配送、货运和商务出行组合在一起，服务数千座城市，公开市值超过 $150
              billion。公开市场可比公司也让竞争层级变得可见：Grab 和 DiDi 的市值位于百亿美元中段，而 Lyft 虽有数十亿美元收入，交易市值仍远低于 Uber。区域超级应用一端，Grab 和 Bolt
              展示了相邻服务如何加深参与度：Grab 在 Southeast Asia 组合出行、餐饮、包裹、企业和金融服务；Bolt 在 Europe 和其他市场覆盖网约车、餐饮和生鲜配送、滑板车以及车队工具。Yango
              占据另一侧，强调机器学习路径规划和新兴市场大城市覆盖。即便与 inDrive 的地理重叠较少，DiDi 和 Lyft 仍是财务和运营可比对象。放在这个格局里，inDrive
              在其强势城市最贴近的真实待完成任务竞争，往往不是 Uber Black 式高端出行，而是 Uber、本地出租车队、非正式搭车选项，以及其他服务价格敏感乘客和司机的低成本 App
              交易平台的组合。实际后果是，inDrive 的竞争由可负担性、司机流动性和日常服务广度定义，而不只由品牌定义。因此，这是一场密度游戏，不只是品牌竞赛。
