evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee structure, and any independent-director disclosures are not publicly available.
    whyItMatters: >-
      Board and committee visibility is necessary to judge governance maturity, founder control, and readiness for
      larger financing or public-market scrutiny.
    diligencePath: >-
      Request a current board deck or governance appendix directly from the company; confirm observer and committee
      rights from major investors.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: Public headcount disclosures conflict between nearly 3,000, 3,700+, and 11,657 employees.
    whyItMatters: >-
      Headcount is a core scale and operating-efficiency KPI; conflicting figures make margin and productivity analysis
      less reliable.
    diligencePath: Request a current employee census by function and geography, or verify via payroll / legal-entity records.
    relatedQuestionRefs:
      - QO022
  - type: conflicting-data
    severity: material
    topic: total-capital-raised
    missingEvidence: >-
      Public sources do not clearly reconcile whether the 2023-2024 General Catalyst arrangement should be counted as
      debt, hybrid financing, or part of cumulative funding totals.
    whyItMatters: >-
      The answer changes total-raised calculations materially and affects leverage, dilution, and liquidity
      interpretation.
    diligencePath: >-
      Obtain transaction documents or a management capitalization summary that classifies every round by instrument type
      and outstanding balance.
    relatedQuestionRefs:
      - QO012
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      The company disclosed 2025 revenue, gross bookings, EBITDA, and net income on a preliminary unaudited basis, but
      no audited public financial statements were available.
    whyItMatters: >-
      Without audited statements, investors cannot validate revenue recognition, margins, cash generation, or leverage
      from the company-overview figures alone.
    diligencePath: Request audited FY2025 financial statements or lender-grade management accounts.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: customer-count
    missingEvidence: Public sources provide strong download data but not a clean current active-user or monthly-rider count.
    whyItMatters: >-
      Downloads overstate actual active demand and are less useful for cohort or penetration analysis than active
      riders, trips, or MAUs.
    diligencePath: Ask management for active riders, monthly order frequency, repeat rate, and market-level trip density.
    relatedQuestionRefs:
      - QO005
      - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone completeness
    missingEvidence: >-
      Public sources support the major milestones, but they do not expose a complete country-by-country launch and
      rebrand chronology.
    whyItMatters: The milestone table is sufficient for company-overview work, but it is not an exhaustive operating-history ledger.
    diligencePath: >-
      Request an internal corporate timeline that reconciles every major launch, legal-entity change, and brand
      transition by year.
    relatedQuestionRefs:
      - QO015
      - QO019
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      inDrive does not publicly disclose regional GMV, net revenue, active riders, or trip volumes in enough detail to
      compute a defensible regional SAM or SOM.
    whyItMatters: >-
      Without regional operating data, investors cannot translate broad market size into realistic market share
      assumptions for valuation models.
    diligencePath: Request regional GMV, order count, active users, and take rate by top 10 countries and top 50 cities.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      Public market publishers give materially different 2025 and long-term forecasts because they use different market
      boundaries and forecasting methods.
    whyItMatters: >-
      Overstating precision on TAM can distort valuation upside and make cross-chapter assumptions look more certain
      than they are.
    diligencePath: >-
      Normalize TAM definitions across publishers before using them in valuation work, and separate core rides from
      adjacencies.
    relatedQuestionRefs:
      - QM003
      - QM026
  - type: private-evidence-only
    severity: material
    topic: regional-mix
    missingEvidence: >-
      Management disclosed only that Latin America is slightly more than half of the business, without
      country-by-country or region-by-region percentages.
    whyItMatters: >-
      A single regional headline does not reveal concentration risk, local-market dependency, or where margins are
      earned.
    diligencePath: >-
      Request a region and country revenue / GMV bridge that reconciles Latin America, Africa, Asia, Middle East, and
      any smaller markets.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: minor
    topic: trust-and-safety-demand-elasticity
    missingEvidence: >-
      Public reporting shows qualitative safety complaints, but there is no disclosed market-level churn or conversion
      impact attributable to safety perceptions.
    whyItMatters: Trust problems can shrink demand faster than TAM models suggest, especially in new cities.
    diligencePath: >-
      Ask for incident rates, verified-account share, repeat usage, and churn before and after safety interventions by
      market.
    relatedQuestionRefs:
      - QM019
  - type: private-evidence-only
    severity: material
    topic: driver-unit-economics
    missingEvidence: >-
      Public sources do not provide driver-level net earnings, utilization, or wait-time economics across inDrive's key
      markets.
    whyItMatters: Supply depth depends on take-home driver economics, not just rider demand or app downloads.
    diligencePath: Request cohort-level driver earnings and retention by city after fuel, incentives, and downtime.
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    severity: material
    topic: market-share
    missingEvidence: >-
      There is no consistent public country-by-country market share dataset showing inDrive against Uber, Bolt, Grab,
      Yango, and local rivals in its top cities.
    whyItMatters: >-
      Without city-level market share and liquidity data, it is difficult to distinguish a strong local wedge from a
      broadly commoditized marketplace.
    diligencePath: Request top-50 city trip share, active rider share, and active driver share benchmarks versus named competitors.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: take-rates
    missingEvidence: Public sources do not normalize realized take rates or driver commissions across inDrive and peer platforms.
    whyItMatters: Competitive pricing claims are much harder to underwrite without a like-for-like economic comparison.
    diligencePath: Request by-city take rate, incentive spend, and effective driver payout comparisons versus key rivals.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: bolt-financials
    missingEvidence: Bolt's public surfaces reviewed here expose riders and partners but not a comparable public revenue figure.
    whyItMatters: The lack of normalized revenue disclosure limits apples-to-apples benchmarking against public peers.
    diligencePath: Pull latest audited Bolt financial statements or investor disclosures if available.
    relatedQuestionRefs:
      - QP005
      - QP023
  - type: missing-source
    severity: minor
    topic: enterprise-distribution
    missingEvidence: >-
      Public evidence for inDrive's enterprise or managed-travel product depth is sparse compared with Uber's published
      business-travel surface.
    whyItMatters: Enterprise distribution can create stickier demand and higher willingness to pay than pure consumer acquisition.
    diligencePath: Request current enterprise accounts, ride volumes, and road map for corporate mobility.
    relatedQuestionRefs:
      - QP011
  - type: missing-source
    severity: minor
    topic: diDi-careem-overlap
    missingEvidence: >-
      Accessible public source quality for DiDi and Careem product surfaces was weaker than for Uber, Bolt, Grab, and
      Yango.
    whyItMatters: >-
      The peer map may understate competitive nuance in markets where DiDi, Careem, or local champions are stronger than
      the accessible sources suggest.
    diligencePath: Add local-language filings or official product pages for those peers before making market-by-market conclusions.
    relatedQuestionRefs:
      - QP001
      - QP007
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
    missingEvidence: No public source discloses inDrive's unrestricted cash, debt schedule, monthly burn, or runway.
    whyItMatters: Capital adequacy cannot be underwritten without liquidity and burn information.
    diligencePath: Request latest balance sheet, treasury dashboard, debt agreements, and 18-month cash-flow forecast.
    relatedQuestionRefs:
      - QI019
      - QI022
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: segment-mix
    missingEvidence: >-
      Public evidence does not split inDrive revenue or gross bookings across rides, delivery, freight, intercity, and
      finance.
    whyItMatters: Investors cannot assess revenue quality or segment-margin durability without a mix breakdown.
    diligencePath: Request segment P&L and management reporting bridge for the last eight quarters.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, cohort retention, contribution margins, and city-level take rates are not publicly disclosed.
    whyItMatters: These are the core metrics needed to determine whether growth is efficient and durable.
    diligencePath: Request rider and driver cohort dashboards, contribution-margin bridges, and market-level take-rate data.
    relatedQuestionRefs:
      - QI013
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: credit-risk
    missingEvidence: >-
      Public sources do not provide loan-book balances, funding structure, charge-offs, or delinquency trends for
      inDrive Money.
    whyItMatters: Financial-services expansion can materially change risk, liquidity, and capital needs.
    diligencePath: >-
      Request loan origination vintages, outstanding balances, default curves, and any warehouse or partner funding
      arrangements.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI005
  - type: conflicting-data
    severity: minor
    topic: financial-quality
    missingEvidence: >-
      Public sources corroborate inDrive's 2025 growth and profitability claims but still rely on company-supplied
      preliminary figures rather than audited filings.
    whyItMatters: >-
      The market should not treat company-provided preliminary metrics as fully equivalent to audited public-company
      disclosures.
    diligencePath: Obtain audited FY2025 statements and monthly management accounts to test the durability of profitability.
    relatedQuestionRefs:
      - QI002
      - QI021
  - type: private-evidence-only
    severity: material
    topic: software-stack
    missingEvidence: >-
      Public sources do not disclose inDrive's core software architecture, infrastructure vendors, observability stack,
