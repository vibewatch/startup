    whyItMatters: Technical diligence cannot assess resilience, scalability, or vendor concentration without these details.
    diligencePath: Request system architecture diagrams, incident history, SLOs, and vendor-dependency maps.
    relatedQuestionRefs:
      - QE009
      - QE023
      - QE024
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: security-and-compliance
    missingEvidence: >-
