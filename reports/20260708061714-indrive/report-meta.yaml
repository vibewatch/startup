companyProfile:
  summary: "inDrive is a global mobility marketplace founded by Arsen Tomsky in Yakutsk and now operated as a U.S.-headquartered company with a large emerging-markets footprint. Its defining feature is a negotiated-pricing model that lets riders propose fares and drivers accept or counteroffer, which has helped the platform expand across 48 countries and 1,200+ cities. Official 2026 communications say the company produced preliminary 2025 gross bookings of $6.4 billion and revenue of $601.6 million and reached positive adjusted EBITDA and net income, but public investors still lack audited statements, market-level unit economics, and full cap-table visibility."
  foundedDate: "2013-01-01"
  founders:
    - name: "Arsen Tomsky"
      role: "Founder & CEO"
      background: "Founder from Yakutsk who continues to lead the company in 2026."
      claimRefs: [CO015]
  foundingLocation: "Yakutsk, Russia"
  headquarters: "Mountain View, California, United States"
  productSummary: "Ride-hailing platform centered on negotiated fares, now extended into intercity, delivery, freight, grocery, and driver-focused financial services."
  customerFocus: "Urban riders, drivers, couriers, and adjacent-service users in emerging and frontier markets."
  businessModel: "Marketplace intermediary that retains only a fraction of gross bookings as revenue and increasingly tests adjacent monetization through finance and commerce."
  stage: "Late-stage private / unicorn"
  fundingStatus: "Latest credible public private-market signal is a March 2024 Tracxn-linked valuation estimate of $1.7B; General Catalyst financing capacity expanded to $300M."
  disclosureProfile: "private-undisclosed"
