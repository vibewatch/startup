  topStrengths:
    - Negotiated pricing remains a real strategic differentiator in price-sensitive emerging markets.
    - Official 2025 revenue, gross bookings, and profitability statements support a scaled late-stage-company profile.
    - Footprint across 48 countries and 1,200+ cities gives the company meaningful global relevance in mobility.
    - A new CFO and positive profitability signals suggest improving financial maturity.
  topRisks:
    - >-
      Malaysia shows that local compliance failures can escalate into licence threats or probationary remediation
      windows.
    - >-
      Driver unrest and safety complaints in Nigeria show that marketplace health is still vulnerable to low-fare and
      trust issues.
    - >-
      Public valuation precision is weak because the company has not published audited financial statements, cash
      balances, or market-level unit economics.
    - Grocery and lending adjacencies may widen upside, but they also add execution, credit, and regulatory complexity.
  unresolvedGaps:
    - Audited FY2025 financial statements and current trailing-twelve-month cash-flow detail.
    - Current cap table, preference stack, warrant overhang, and financing covenants.
    - Top-market take rates, incentives, rider and driver retention, and contribution-margin data.
    - Lending-book size, defaults, partner structures, and country-level regulatory opinions for fintech products.
    - Formal public closeout of Malaysia's probationary licence-monitoring process.
