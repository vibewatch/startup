      - number: '7.3'
        title: Dependency, financial-model, and execution risk
        blocks:
          - type: paragraph
            body: >-
              inDrive's next-layer risks come from what it is becoming, not just what it already is. The company is no
              longer a single-service ride-hailing app; it is adding grocery, financial services, procurement
              infrastructure, and a larger compliance stack while still operating across 48 countries and 1,200-plus
              cities. That creates partner, capital, and management dependencies that can transmit quickly into customer
              trust and valuation. The procurement rules show a more formal vendor-management posture, but they also
              imply dependence on external software, onboarding systems, and suppliers. Fintech launches in Colombia and
              Peru increase licensing, underwriting, repayment, and fraud exposure beyond core mobility. Public peers
              such as Uber, Lyft, and Grab publish audited filings with detailed risk factors, incentive burdens, and
              liquidity disclosures; inDrive still does not. That gap makes it harder to know whether management can
              fund safety, compliance, new services, and incentives simultaneously if a few major markets turn adverse.
              It also raises people risk: the business now needs local regulatory operators, trust-and-safety
              leadership, lending controls, and disciplined capital allocation at the same time. The company has
              momentum, but the public evidence still supports a residual thesis that execution complexity is rising
              faster than disclosure quality, so investors need explicit kill criteria around licence losses, repeated
              driver unrest, regulatory tightening, and any sign that new adjacencies dilute focus without adding
              durable economics.
