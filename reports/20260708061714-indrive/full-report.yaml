      - number: '1.3'
        title: Capital Trajectory and Financial Disclosure
        blocks:
          - type: paragraph
            body: >-
              The most important update since the earlier unicorn narrative is that inDrive now looks financially larger
              than many secondary databases imply. Official 2026 company communications state that 2025 gross bookings
              reached $6.4 billion and revenue reached $601.6 million, both on preliminary unaudited figures, and that
              the business achieved positive adjusted EBITDA and net income. On capital formation, public evidence
              supports three separate layers. First, the company became a unicorn in 2021 after a $150 million round
              involving Insight Partners, General Catalyst, and Bond Capital at a stated $1.23 billion company value.
              Second, General Catalyst provided a further $150 million financing arrangement in 2023 and expanded that
              commitment to $300 million in 2024. Third, database sources such as Tracxn preserve earlier venture rounds
              led by Bond Capital and Leta Capital and associate the March 2024 financing event with a $1.7 billion
              post-money valuation estimate. Because public sources differ on whether the General Catalyst structure
              should be treated as debt, hybrid financing, or part of cumulative fundraising totals, investors should
              treat headline total-raised numbers cautiously and focus instead on the chronology of disclosed capital
              access and the improving operating scale implied by 2025 results.
