companyProfile:
  summary: >-
    inDrive is a global mobility marketplace founded by Arsen Tomsky in Yakutsk and now operated as a U.S.-headquartered
    company with a large emerging-markets footprint. Its defining feature is a negotiated-pricing model that lets riders
    propose fares and drivers accept or counteroffer, which has helped the platform expand across 48 countries and
    1,200+ cities. Official 2026 communications say the company produced preliminary 2025 gross bookings of $6.4 billion
    and revenue of $601.6 million and reached positive adjusted EBITDA and net income, but public investors still lack
    audited statements, market-level unit economics, and full cap-table visibility.
