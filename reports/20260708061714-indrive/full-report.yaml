      - number: '3.2'
        title: Capability, pricing, and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows that inDrive's most visible product differentiation remains fare formation and
              supply economics. The platform lets riders propose a price and drivers accept or counteroffer, while
              management and media coverage repeatedly position the service as lower commission and more transparent
              than incumbent apps. That is a meaningful distinction in cost-sensitive cities, but the surrounding
              product stack is increasingly converging. Uber offers consumer rides, delivery and enterprise travel; Grab
              layers transport with food, parcel, lending, insurance and partner programs; Bolt markets itself as a
              mobility super-app; and Yango emphasizes algorithmic dispatch, mapping, and regional scale. Competitors
              also invest heavily in driver-side tooling such as instant cash-out, support, insurance or financial
              services, which reduces the uniqueness of inDrive's broader supply proposition even if its pricing
              mechanic is different. Corporate distribution is another gap. Uber for Business gives large organizations
              managed travel workflows that inDrive has not publicly matched, while Grab already sells business and
              merchant services within a dense local ecosystem. In short, inDrive has a distinctive core transaction
              model, but it competes in a market where adjacent capabilities and distribution channels are increasingly
              bundled.
