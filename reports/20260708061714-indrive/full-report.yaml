  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and usage patterns
        blocks:
          - type: paragraph
            body: >-
              inDrive's customer base is broader than passengers alone. Public app-store descriptions explicitly present
              the product as both a rider app and a driver app, while also extending the same workflow to couriers,
              truck-booking users, and local service providers. That matters because the platform's demand side is
              really a collection of adjacent urban-service jobs tied together by a shared idea of negotiated pricing
              and user choice. Usage signals point to very large reach. AppBrain reports 370 million Android downloads
              and 15 million ratings, while the iPhone listing shows a 4.8 score from 376,000 ratings and 24-plus
              language support. The company page and city directory also show a footprint across 48 countries and
              1,100-plus cities. Public market-specific evidence adds depth. In Colombia, a company-backed safety report
              said 21.5 million people used app-based mobility services in 2024 and 35% of passengers used them several
              times a week. The implication is that inDrive serves a broad, recurring mass-market urban-mobility
              audience, especially in emerging markets where affordability and control matter more than premium branding
              for daily mobility. It also means the customer lens must include both end-consumer convenience and
              worker-side liquidity, because the same app is trying to retain both.
