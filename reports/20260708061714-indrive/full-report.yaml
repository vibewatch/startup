      - number: '2.2'
        title: Emerging-Market Opportunity Map
        blocks:
          - type: paragraph
            body: >-
              The market opportunity most relevant to inDrive is not the average global ride-hailing market but the
              subset of geographies where affordability, smartphone access, and weak substitutes make its
              negotiated-pricing model attractive. Public evidence shows Asia Pacific remains the largest and
              fastest-growing ride-hailing region, while Latin America and the Middle East/Africa also continue
              expanding from smaller bases. Global Market Insights attributes that growth to urbanization,
              digital-payment development, and increasing consumer preference for convenient transport, and IMARC
              explicitly highlights Latin America and MEA as ongoing growth regions. That regional profile maps closely
              to inDrive's own footprint. Management said in 2026 that Latin America accounted for slightly more than
              half of inDrive's business, while the company page and TechCrunch describe a platform already spread
              across 48 countries with a strong focus on cost-conscious users in developing markets. The super-app push
              into groceries, delivery, and embedded finance in Kazakhstan, Pakistan, Colombia, Peru, Mexico, and Brazil
              further confirms that inDrive sees emerging markets as an expandable services ecosystem rather than simply
              a ride volume base. The opportunity is therefore best read as an emerging-market, multi-service,
              smartphone-native mobility and services market rather than a homogeneous global taxi substitute.
