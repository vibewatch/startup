      - number: '3.3'
        title: Moat durability, multi-homing, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest argument for inDrive's durability is that negotiated pricing and lower take-rate messaging
              fit underpenetrated, affordability-sensitive markets better than heavily optimized algorithmic pricing
              does. That can improve local brand resonance and driver acquisition when incumbents are perceived as
              expensive or opaque. But the same evidence base also shows why the moat is fragile. Grab explicitly allows
              non-exclusive driver participation, which is a direct public signal that supply-side multi-homing remains
              common in mobility. Bolt's driver pitch centers on flexible hours and weekly net earnings, meaning inDrive
              is not alone in selling independence and transparency. Public market comparables also show how hard it is
              for subscale mobility companies to convert usage into durable valuation premiums: Uber trades at an
              enormous scale advantage, while Lyft, Grab, and DiDi all sit in the mid-teens or single-digit billions of
              market capitalization despite billions in revenue. InDrive's own user-review and complaint footprint
              reinforces the point. Adoption is strong, but driver and rider disputes over low fares, safety, and price
              negotiation are recurring. The result is a business with real regional fit but only moderate moat
              durability unless it can convert download share into deeper ecosystem lock-in, stronger safety trust, and
              city-by-city density advantages.
