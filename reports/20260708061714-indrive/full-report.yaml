      - number: '1.2'
        title: Leadership, Headquarters, and Governance Context
        blocks:
          - type: paragraph
            body: >-
              Current public evidence points to inDrive being U.S.-headquartered, with Mountain View, California cited
              in company-backed press materials and Reuters reporting referring to the business as U.S.-headquartered
              while also highlighting Kazakhstan as its largest employee hub. Founder Arsen Tomsky remains CEO and the
              symbolic anchor of the company's mission-led branding. In 2026 the company upgraded the leadership bench
              with Abhey Lamba as CFO and Sidd Mantri as CPO, while the company page also names Evgenia Matrosova,
              Andries Smit, Tatiana Terentieva, and Yuri Misnik across core operating, growth, legal, and technology
              functions. That is enough to establish a serious functional leadership team, but not enough to resolve
              governance diligence: the company does not publicly provide a detailed board roster, independence map, or
              committee structure. Public evidence is similarly inconsistent on workforce scale. The same official
              company page references both a global team of nearly 3,000 employees in Arsen Tomsky's biography and
              3,700+ employees in a milestone block, while Tracxn reports 11,657 employees as of May 2026. The prudent
              conclusion is that headcount is materially under-disclosed and conflicting rather than precisely knowable
              from public sources.
