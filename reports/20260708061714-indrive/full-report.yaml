  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, monetization, and public traction
        blocks:
          - type: paragraph
            body: >-
              The public record shows that inDrive monetizes primarily as a marketplace rather than a traditional
              transport operator. Its own 2025 growth post defines gross bookings as the total value of completed rides
              and deliveries before deductions such as driver earnings, incentives, refunds, and other adjustments,
              while revenue is the much smaller amount retained after that marketplace activity flows through the
              platform. In 2025, the company reported preliminary gross bookings of $6.4 billion and revenue of $601.6
              million, up 31% year over year, and the 2026 CFO announcement repeated those figures while also saying the
              company reached positive adjusted EBITDA and net income. That is the clearest public evidence that the
              business now has real operating scale. The implied public revenue-to-gross-bookings ratio is roughly 9.4%,
              which is directionally consistent with a commission-driven mobility marketplace that still passes most
              transaction value through to drivers, couriers, merchants, or counterparties. The catch is that public
              disclosures stop well short of a full revenue model. Management says mobility remains at the core, but the
              company also cites deliveries, additional services, and partnerships, without breaking out how much
              revenue each line contributes or whether fintech monetization is already material.
