      - number: '7.2'
        title: Operational, safety, and labor risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk in inDrive is inseparable from marketplace quality. The company discloses meaningful
              safety features for riders and drivers, including verification, masked communications, ride sharing,
              emergency help, and support channels, which indicates that management understands trust as a product
              requirement rather than a marketing add-on. But external evidence shows that those tools do not fully
              neutralize field-level problems. Bangladesh reporting highlighted user confusion about licensing and
              platform responsibility, while Nigeria reporting from 2025 and 2026 shows recurring complaints about
              insecurity, low fares, weak rider verification, and the need for working panic buttons and insurance
              protections. Because inDrive's pricing model gives users more direct control, the marketplace may win on
              fairness and affordability while still exposing drivers to more variable economics and support burdens
              than heavily optimized dispatch systems. That matters because poor safety perception, slow support, or
              earnings frustration can damage both sides of liquidity simultaneously: riders lose trust and drivers
              multi-home or strike. The company therefore faces a classic emerging-markets execution problem. It has
              enough product differentiation to attract usage, but sustaining that usage requires city-level operational
              discipline, faster incident handling, and more consistent enforcement than public disclosures can yet
              prove across all markets.
