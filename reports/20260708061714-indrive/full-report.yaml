      - number: '6.2'
        title: Driver ecosystem and economic value proposition
        blocks:
          - type: paragraph
            body: >-
              The supply side is central to the customer story because drivers are also users whose willingness to stay
              determines liquidity and service quality. Public materials consistently pitch inDrive as a better deal for
              drivers than traditional cab or ride-hailing platforms because they can choose rides, see the destination
              and price before accepting, suggest a different fare, and in some contexts pay low or even zero service
              fees for a launch period. The company also extends the relationship through inDrive Money, which citybiz,
              Financial IT, FinTech Magazine, and PYMNTS all describe as a financial-inclusion product for drivers who
              struggle to access traditional credit. Those same sources say the product can support loyalty, retention,
              and GMV. But the driver ecosystem is not frictionless. Bangladesh reporting described long-distance
              dispatch frustration, unclear commission policy, no visible office, and slow support response; Nigerian
              driver-union criticism focused on low fares and weak security. So the real driver proposition is best read
              as higher perceived control and lower fees in exchange for more marketplace variability than tightly
              managed dispatch systems. In practice, that makes the driver experience a mix of freedom, pricing
              flexibility, and uncertainty that can look attractive in one city and frustrating in another.
