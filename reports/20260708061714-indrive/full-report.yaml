      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Buyer, user, and payer roles in inDrive's addressable market are more varied than a simple rider-driver
              marketplace suggests. In the personal ride-hailing core, the end user is the passenger and the payer is
              usually the same person paying out of pocket through cash or digital payments. On the supply side, drivers
              are not buyers in the classic SaaS sense but they are critical economic participants because they absorb
              vehicle, fuel, and time costs while paying commissions or financing repayments through the platform. As
              inDrive expands, the segmentation becomes richer: corporate mobility buyers can be employers or travel
              managers paying for worker transport; grocery or courier services bring in merchants, shippers, and
              households; and inDrive Money turns drivers and couriers into financial-services users with R2 or partner
              institutions as capital providers. Public market research supports this broader lens. Research and Markets
              includes commercial and personal end-users, while Global Market Insights highlights corporate mobility as
              a growing segment and notes that centralized billing and trip-management tools are pulling businesses
              toward platform-based transport. For inDrive, the most important adoption pattern is that one app can
              serve multiple recurring mobility or earning jobs for cost-sensitive urban users, but each segment still
              has different budget owners, trust thresholds, and switching triggers.
