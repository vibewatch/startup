  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, super-apps, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              inDrive is not competing in a single peer set. At the global level, Uber remains the clear scale
              incumbent, combining ride-hailing with delivery, freight, and business travel while serving thousands of
              cities and commanding a public market capitalization above $150 billion. Public-market comparables also
              make the competitive hierarchy visible: Grab and DiDi sit in the mid-teens of billions in market value,
              while Lyft trades far below Uber despite multi-billion-dollar revenue. At the regional super-app end, Grab
              and Bolt show how adjacent services can deepen engagement: Grab combines mobility, food, parcel,
              enterprise, and financial services across Southeast Asia, while Bolt spans ride-hailing, food and grocery
              delivery, scooters, and fleet tools across Europe and other markets. Yango occupies a different flank,
              emphasizing machine-learning routing and large-city coverage across emerging markets. DiDi and Lyft matter
              as financial and operating comparables even where they overlap less directly with inDrive's geography.
              Against this field, inDrive's closest real job-to-be-done competition in its strongest cities is often not
              Uber Black-style premium mobility but the combination of Uber, local taxi fleets, informal ride options,
              and other low-cost app marketplaces serving price-sensitive riders and drivers. The practical consequence
              is that inDrive's competition is defined by affordability, driver liquidity, and breadth of everyday
              services rather than by brand alone. It is therefore a density game, not just a branding contest.
            claimRefs:
