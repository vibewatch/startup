  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and policy exposure
        blocks:
          - type: paragraph
            body: >-
              The clearest top-tier risk signal in the public record is that inDrive's operating model can run into hard
              regulatory boundaries when local compliance is weak. Malaysia is the most concrete recent example:
              multiple 2025 reports say transport authorities issued or backed revocation action tied to failures around
              mandatory e-hailing permits and driver-document compliance, then allowed a probationary period after
              appeal. That is not a theoretical policy debate; it is direct evidence that market access can be
              interrupted if inDrive's local controls fall short. The broader policy environment is also getting tighter
              for platform businesses. European policy materials say the Platform Work Directive creates new
              algorithmic-management and worker-protection obligations, while inDrive's own compliance page says the
              company is formalizing risk assessments, anti-corruption rules, whistleblower protections, and legal
              policies globally. Together these points support a balanced view: inDrive is taking compliance more
              seriously, but the cost of inconsistent local execution is rising faster than the company can rely on
              marketplace growth alone. The legal-model defense that inDrive is only an aggregator may help shape
              liability boundaries, but it does not eliminate licensing, worker-classification, privacy, or
              consumer-protection risk in the jurisdictions that matter most for future expansion.
            claimRefs:
