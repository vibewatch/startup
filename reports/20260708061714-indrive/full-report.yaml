            body: >-
              Capital adequacy is where the public picture improves and then quickly turns opaque. Multiple 2024 sources
              say inDrive expanded its financing arrangement with General Catalyst to $300 million from an initial $150
              million secured in 2023, with the structure designed to add flexibility for product investment, service
              expansion, and market entry. That matters because it suggests the company had external capacity to keep
              funding growth before its 2025 profitability milestone. But unlike Uber, Lyft, and Grab, which publish
              detailed cash and liquidity disclosures in filings, inDrive still does not publicly disclose cash on hand,
              unrestricted liquidity, burn, or a formal runway. Lyft, for example, ended 2025 with about $1.1 billion of
              cash, $705.2 million of short-term investments, and a $420 million undrawn revolver, while Uber ended the
              year with $7.6 billion of unrestricted cash, cash equivalents, and short-term investments. Public evidence
              therefore supports a cautious verdict: inDrive likely has better capital flexibility than it did before
              the General Catalyst expansion and better operating quality than it had before positive 2025
              profitability, but investors still cannot underwrite funding sufficiency, credit exposure, or the next
              financing trigger without private diligence materials. They also cannot see receivables quality,
              restricted cash, or country-level profitability.
