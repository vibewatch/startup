      - number: '1.4'
        title: Milestones, Expansion Moves, and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The company-overview judgment turns not only on growth milestones but also on how inDrive's history
              creates ongoing diligence risk. Since 2023, inDrive has opened a U.S. market, launched a dedicated venture
              and M&A arm, pushed into driver financial services, started a grocery strategy in Kazakhstan and Pakistan,
              and published an autonomous-vehicle manifesto tailored to emerging markets. Those moves suggest ambition
              to become a multi-service platform rather than a single-product ride-hailing app. At the same time, the
              adverse record is material. The company says it pulled out of Russia in 2022, and external trackers say
              the Russian legal entity was transferred in April 2023 to a Kazakh structure that later operated under the
              INDELS brand. Operational and reputational challenges have continued elsewhere: a Bangladeshi
              investigation said the company lacked BRTA approval, Malaysian authorities moved to revoke its
              intermediation licence in 2025, and Nigerian driver groups publicly attacked the platform over security,
              identity verification, and unsustainably low fares. These issues do not negate the growth story, but they
              do mean investors should treat inDrive as a scaled emerging-markets platform with meaningful regulatory
              and trust-management execution risk rather than as a frictionless mobility success story.
