  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis quality, and price discipline
        blocks:
          - type: paragraph
            body: >-
              The investment case for inDrive is attractive in concept but fragile in underwriting. On the positive
              side, the company now pairs differentiated marketplace positioning with much larger scale than older
              unicorn narratives captured: official 2026 communications cite 2025 gross bookings of $6.4 billion,
              revenue of $601.6 million, positive adjusted EBITDA and net income, and a footprint spanning 48 countries
              and 1,200-plus cities. That is enough to justify treating inDrive as a scaled late-stage mobility platform
              rather than a speculative regional app. But valuation cannot be separated from evidence quality. The
              strongest reason not to issue a buy today is that the most important metrics remain either preliminary,
              unaudited, or privately held. Investors still lack audited statements, cash balances, cohort economics,
              and a clean public view of how grocery, lending, and other adjacencies affect margins and capital
              intensity. The prudent recommendation is therefore track: pay attention, engage if valuation is
              disciplined, but avoid underwriting a premium outcome on narrative alone. In practice, that means the last
              credible private valuation signals deserve respect, yet they should not be treated as automatically
              validated by public-market comps until disclosure quality improves materially and management provides hard
              audited evidence for core assumptions.
            claimRefs:
