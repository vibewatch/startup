      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Regulatory Filters
        blocks:
          - type: paragraph
            body: >-
              Four structural demand drivers recur across the evidence base: smartphone and internet penetration, rapid
              urbanization and congestion, digital payment adoption, and the economics of avoiding personal-car
              ownership. GSMA says mobile subscribers already represent roughly 70% of the global population, while
              market researchers repeatedly point to smartphone access and cashless payments as preconditions for
              ride-hailing adoption. For inDrive specifically, lower commissions and rider-driver price negotiation
              broaden appeal where consumers value direct control over fares and drivers resent opaque algorithmic
              pricing. But the same features create real constraints. Driver complaint reporting from Nigeria and India
              shows that negotiated pricing can deteriorate into low-fare pressure, while safety perception remains a
              live issue in some markets. Regulatory risk is equally material. The European Parliament's 2024
              platform-work briefing says 28 million people worked through digital platforms in 2021 and projects 43
              million by 2025, while the new EU directive introduces employment-presumption and algorithmic-management
              rules that member states must implement within two years. Outside Europe, Bangladesh and Malaysia
              illustrate a different constraint set: local licensing and compliance can cap growth even where consumer
              demand exists. The market is therefore growing, but the realizable opportunity is filtered by trust, local
              rulemaking, and supply-side economics rather than by demand alone.
