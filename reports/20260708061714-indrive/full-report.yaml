  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Core workflow: negotiated rides, user choice, and safety layer'
        blocks:
          - type: paragraph
            body: >-
              The defining product mechanic in inDrive's core service is not merely app-based dispatch but a
              user-negotiated transaction flow. Public materials say riders enter pickup and drop-off points, propose a
              price, then evaluate counteroffers or accepted offers from available drivers based on cost, rating, and
              vehicle model. That means the product is designed around choice and price discovery rather than full
              algorithmic automation. The company repeatedly frames this as a fairer and more transparent workflow for
              both sides of the marketplace. Safety and identity are layered directly into the trip flow. Passenger
              materials say drivers are background-checked and document-verified, while ride participants can use masked
              communications, live ride sharing, emergency calling, support access, and trusted-contact notifications.
              Driver-facing safety materials add passenger selfie verification, rating systems, and identity cues before
              trip acceptance. Taken together, the product is best understood as a mobility workflow that combines
              negotiated pricing, pre-ride information asymmetry reduction, and in-app trust tooling rather than as a
              simple on-demand taxi clone. The explicit visibility of driver identity, rating, and vehicle context
              before trip acceptance is also a design choice meant to substitute transparency for some of the hidden
              logic used by more algorithmic competitors.
            claimRefs:
