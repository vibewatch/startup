  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              The relevant market for inDrive is broader than taxi-hailing but narrower than all urban transport. Public
              market researchers generally define ride-hailing around app-booked, on-demand passenger mobility revenues
              or bookings, with adjacent layers that can include corporate mobility, intercity, car-sharing, courier,
              and other app-mediated transport categories depending on publisher methodology. That distinction matters
              because inDrive itself is no longer only a rides marketplace: the company now bundles ride-hailing,
              intercity, delivery, freight, grocery, and driver-finance products into a multi-service platform. For the
              core ride-hailing layer, the current evidence base converges on a very large global market. Global Market
              Insights estimates $188.6 billion in 2025 and $213.2 billion in 2026, while IMARC puts 2025 at $206.5
              billion and projects $398.4 billion by 2034. These estimates are directionally consistent even if they are
              not identical. Statista's methodology notes that it models ride-hailing bottom-up using bookings and
              revenues rather than a single top-down narrative, while Research and Markets frames the category through
              multiple segments, vehicle types, and regional splits. The practical takeaway is that inDrive's TAM is
              clearly large, but exact market size depends on whether one counts only passenger e-hailing or the broader
              mobility-services stack in which inDrive increasingly wants to participate.
