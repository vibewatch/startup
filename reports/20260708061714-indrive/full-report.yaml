chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Scale, and Core Business Model
        blocks:
          - type: paragraph
            body: >-
              inDrive's origin story still matters because its product logic flows directly from the way the company
              began. The platform traces itself to a grassroots response in Yakutsk on New Year's Eve 2012, when
              residents used social media to organize rides after local taxi operators allegedly tripled prices in
              severe winter weather. The company now describes itself as founded in 2013 and incorporated in the United
              States in 2018, reflecting the difference between the movement's origin and the later formal corporate
              structure. That origin story maps cleanly onto the product: riders propose a fare, nearby drivers can
              accept or counter, and the company positions that negotiated model as a fairness alternative to opaque
              algorithmic pricing. By July 2026, inDrive's official company page says it operates in 48 countries and
              1,200+ cities with 400+ million app installs, while independent 2025-2026 reporting places it among the
              world's most-downloaded ride-hailing apps. The platform has also expanded beyond ride-hailing into
              intercity travel, courier and freight delivery, driver lending, groceries, advertising, and a broader
              super-app strategy built for price-sensitive consumers in emerging markets.
