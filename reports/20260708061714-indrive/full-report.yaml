      - number: '8.2'
        title: Comparable set, sensitivity, and scenario range
        blocks:
          - type: paragraph
            body: >-
              A public-comp framework is useful here, but only as a range-setting device. Multiples.vc and
              CompaniesMarketCap show that public ride-hailing platforms trade at very different revenue multiples
              depending on geography, profitability, and investor confidence. Uber commands a multi-turn premium, Grab
              also holds a relatively rich multiple, while Lyft and DiDi trade meaningfully lower. Applying those
              end-2026 public P/S ratios to inDrive's disclosed $601.6 million of 2025 revenue yields a very wide
              implied equity-value band of roughly $474 million to $2.48 billion. That spread is exactly the point:
              public markets value mobility platforms on quality of revenue, disclosure, and confidence in margin
              durability, not just on reach or download share. The peer-median math lands closer to about $1.05 billion,
              which is below Tracxn's $1.7 billion private valuation signal from March 2024. A reasonable interpretation
              is that inDrive may deserve a premium to the weakest public comps if its profitability milestone is real
              and durable, but it does not yet deserve a Grab-like or super-app-style multiple without audited proof.
              That leads to a cautious scenario framework: a bear case tied to low multiple and elevated risk, a base
              case near the low end of the last private mark, and a bull case that requires both verified profitability
              and stronger evidence that adjacencies create value rather than distraction.
