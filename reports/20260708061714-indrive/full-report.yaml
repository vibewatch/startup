      - number: '8.3'
        title: Diligence gates, exit readiness, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              What keeps inDrive in the track bucket is not a weak business; it is still incomplete proof. Public peers
              publish audited annual filings, cash positions, risk factors, and segment detail that allow investors to
              translate growth into valuation discipline. inDrive does not. It has shown enough traction to earn serious
              attention, but not enough disclosure to support a conviction entry at an open-ended premium today
              publicly. The most important diligence gates are straightforward: audited financial statements; current
              cap table and preference stack; cash, debt, and financing covenants; market-level ride economics; and a
              full view of the lending book and regulatory posture. Exit readiness is similarly mixed. Scale, geography,
              and a new CFO help, but unresolved labour, regulatory, and disclosure issues still argue for a discount to
              the cleanest public peers. The thesis breaks if market-access issues intensify, if preliminary
              profitability does not survive audit, if lending introduces hidden losses, or if the company continues to
              expand adjacencies without clarifying capital allocation. Conversely, the recommendation would improve if
              management produced audited profitability, market-level retention and take-rate data, and evidence that
              new services lift lifetime value rather than just broaden scope.
