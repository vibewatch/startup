      - number: '4.2'
        title: Unit economics, peer benchmarks, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Public benchmark data helps frame, but not solve, the inDrive underwriting problem. Grab's 2025 20-F shows
              $3.37 billion of revenue on $22.1 billion of on-demand GMV, about $2.3 billion of incentives equal to
              10.2% of on-demand GMV, and adjusted EBITDA of $500 million. Uber's 2025 10-K shows revenue of $52.0
              billion and says gross bookings rose 19%, while Lyft's 2025 10-K disclosed fourth-quarter active riders of
              29.2 million, gross bookings of $18.5 billion for the year, and adjusted EBITDA of $528.8 million. These
              filings matter because they show that even scaled mobility platforms still manage incentives, liquidity
              buffers, and operational leverage very closely. Against that backdrop, inDrive's reported positive
              profitability in 2025 is encouraging, but it remains a weaker-quality signal because the numbers are
              preliminary and unaudited. The company also does not disclose rider cohorts, driver payout ratios,
              contribution margins, city-level take rates, or segment-level profitability. So the best public conclusion
              is not that inDrive has fully proven marketplace economics, but that it has crossed from growth story to
              potentially viable scaled marketplace while still withholding the underlying evidence needed for rigorous
              unit-economic analysis today in public now. That gap is especially important in contested cities where
              incentive intensity and safety spending can swing contribution margins quickly.
