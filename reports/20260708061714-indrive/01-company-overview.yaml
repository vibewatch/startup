callouts:
  - calloutType: strength
    title: "The fairness-origin story still aligns with the product"
    body: "Unlike many growth-stage mobility companies that back-fill a mission after scaling, inDrive's bid-based pricing model still maps directly to the Yakutsk origin story that created the company."
    claimRefs: [CO001, CO003, CO032]
  - calloutType: risk
    title: "Scale is real, but disclosure quality is uneven"
    body: "Headline metrics improved sharply in 2025, yet headcount, funding treatment, and governance disclosures remain inconsistent enough that investors should avoid over-precision in company-overview KPIs."
    claimRefs: [CO011, CO022, CO025, CO026]

