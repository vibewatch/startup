  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "A current board roster, committee structure, and any independent-director disclosures are not publicly available."
      whyItMatters: "Board and committee visibility is necessary to judge governance maturity, founder control, and readiness for larger financing or public-market scrutiny."
      diligencePath: "Request a current board deck or governance appendix directly from the company; confirm observer and committee rights from major investors."
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: headcount
      missingEvidence: "Public headcount disclosures conflict between nearly 3,000, 3,700+, and 11,657 employees."
      whyItMatters: "Headcount is a core scale and operating-efficiency KPI; conflicting figures make margin and productivity analysis less reliable."
      diligencePath: "Request a current employee census by function and geography, or verify via payroll / legal-entity records."
      relatedQuestionRefs: [QO022]
    - type: conflicting-data
      severity: material
      topic: total-capital-raised
      missingEvidence: "Public sources do not clearly reconcile whether the 2023-2024 General Catalyst arrangement should be counted as debt, hybrid financing, or part of cumulative funding totals."
      whyItMatters: "The answer changes total-raised calculations materially and affects leverage, dilution, and liquidity interpretation."
      diligencePath: "Obtain transaction documents or a management capitalization summary that classifies every round by instrument type and outstanding balance."
      relatedQuestionRefs: [QO012]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: audited-financials
      missingEvidence: "The company disclosed 2025 revenue, gross bookings, EBITDA, and net income on a preliminary unaudited basis, but no audited public financial statements were available."
      whyItMatters: "Without audited statements, investors cannot validate revenue recognition, margins, cash generation, or leverage from the company-overview figures alone."
      diligencePath: "Request audited FY2025 financial statements or lender-grade management accounts."
      relatedQuestionRefs: [QO006]
    - type: missing-source
      severity: minor
      topic: customer-count
      missingEvidence: "Public sources provide strong download data but not a clean current active-user or monthly-rider count."
      whyItMatters: "Downloads overstate actual active demand and are less useful for cohort or penetration analysis than active riders, trips, or MAUs."
      diligencePath: "Ask management for active riders, monthly order frequency, repeat rate, and market-level trip density."
      relatedQuestionRefs: [QO005, QO026]
    - type: enumeration-incomplete
      severity: minor
      topic: "TO004 milestone completeness"
      missingEvidence: "Public sources support the major milestones, but they do not expose a complete country-by-country launch and rebrand chronology."
      whyItMatters: "The milestone table is sufficient for company-overview work, but it is not an exhaustive operating-history ledger."
      diligencePath: "Request an internal corporate timeline that reconciles every major launch, legal-entity change, and brand transition by year."
      relatedQuestionRefs: [QO015, QO019]
      relatedTableRefs: [TO004]
