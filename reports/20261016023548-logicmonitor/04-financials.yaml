    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a recurring-software model that starts with hybrid observability,
      expands through AI and FinOps workflows, and broadens through channel and acquisition-led cross-sell.
    data:
      nodes:
        - id: estate
          label: Customer telemetry estate
          description: "Hybrid infrastructure, cloud workloads, applications, and AI systems to be monitored in one environment."
          claimRefs: [CI001, CI002]
        - id: platform
          label: LM Envision platform subscription
          description: "Unified observability, automated discovery, and broad integrations anchor the base subscription."
          claimRefs: [CI001, CI010]
        - id: ai
          label: Edwin AI expansion
          description: "Agentic AIOps, alert correlation, and root-cause guidance create add-on bookings expansion."
          claimRefs: [CI006, CI012]
        - id: finops
          label: Cost and budget workflows
          description: "Spend breakdowns, forecasting, and budget-threshold alerts strengthen ROI narratives."
          claimRefs: [CI010, CI013]
        - id: distribution
          label: Channel and product-surface expansion
          description: "VARs, MSPs, GSIs, and the Catchpoint acquisition widen route-to-market and wallet share."
          claimRefs: [CI002, CI011]
        - id: outcome
          label: Recurring revenue outcomes
          description: "Observed public scale signals include ARR above $400M, growth in $100k+ customers, and multi-product adoption."
          claimRefs: [CI004, CI005, CI006]
      edges:
        - from: estate
          to: platform
          relationship: "Monitoring scope creates the base software need"
          claimRefs: [CI001]
        - from: platform
          to: ai
          relationship: "Core observability becomes an automation upsell"
          claimRefs: [CI010, CI012]
        - from: ai
          to: finops
          relationship: "Operational telemetry supports cost and budget workflows"
          claimRefs: [CI013]
        - from: finops
          to: distribution
          relationship: "Broader value proposition supports partner-assisted expansion"
          claimRefs: [CI002, CI010]
        - from: distribution
          to: outcome
          relationship: "Broader product and channel surface feeds recurring revenue growth"
          claimRefs: [CI004, CI005, CI006, CI011]
    approximationNotes: >-
      Sequence reflects public product and go-to-market logic, not a disclosed quantitative conversion funnel.
    claimRefs: [CI002, CI004, CI005, CI006, CI010, CI011, CI012, CI013]
