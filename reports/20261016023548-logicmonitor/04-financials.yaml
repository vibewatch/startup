      - [Edwin AI / Agentic AIOps, "Expansion module embedded in incident investigation and automation workflows", "Bookings contribution / add-on module", "TipRanks says Edwin AI is about one third of bookings and growing about 200% YoY", "Strong expansion signal, but only lightly corroborated", "SKU pricing, attach rate, gross margin, and proof of durable renewal"]
      - [Cloud cost and FinOps workflows, "Spend dashboards, forecasting, and budget alerts inside the platform", "Subscription feature / expansion module", "Capability is public; no standalone price or usage metric is public", "Supports ROI messaging more than revenue quantification", "Module pricing, adoption, and savings verification by customer segment"]
      - [Catchpoint-led digital experience expansion, "Cross-sell Internet performance and digital-experience monitoring into existing accounts", "Bundled upsell / platform expansion", "Acquisition closed in December 2025 and integration is underway", "Broader wallet share potential, integration economics still unproven", "Cross-sell attach rate, services mix, and incremental gross margin"]
      - [Channel and MSP distribution, "Partner-assisted subscription sales through VARs, MSPs, and GSIs", "Partner-sold enterprise subscription", "Partner network is explicit; partner economics are not public", "Can widen coverage but may compress realized pricing", "Direct versus indirect mix, reseller discounts, and partner take-rates"]
    notes: >-
      Synthesizes public product, partner, acquisition, and third-party revenue signals; null-style
      uncertainty appears as narrative status when no numeric revenue split is publicly disclosed.
    claimRefs: [CI001, CI002, CI005, CI006, CI010, CI011, CI012]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price, unit, or contract signal
      - List versus realized pricing visibility
      - Source
      - Underwriting implication
    rows:
      - ["LM Envision core platform", "No reviewed source publishes a rate card", "Public pages describe outcomes and demos, not realized price", "Official LogicMonitor product / solutions pages", "Need signed order forms or price book to bridge list-to-realized ACV"]
      - ["Edwin AI / AIOps", "No reviewed source publishes a module price", "Bookings contribution is disclosed by TipRanks, not customer price points", "TipRanks plus official product pages", "Need SKU packaging, attach rate, and discount data before modeling upsell economics"]
      - ["Cloud spend optimization features", "No standalone public price", "Value is framed as savings and budget control rather than fee schedule", "Cloud, AI observability, and Microsoft Marketplace pages", "Need to know whether the feature is bundled, tiered, or usage priced"]
      - ["Partner / MSP route", "No public reseller economics", "Marketplace and partner pages show route-to-market but not rebates or rev share", "Solutions page plus Microsoft Marketplace", "Need partner margin, discounting, and implementation ownership by channel"]
    notes: >-
      Reviewed public pages in this pool emphasize contact-led enterprise selling and value messaging;
      they do not expose realized discounts or customer-level monetization terms.
    claimRefs: [CI002, CI005, CI006, CI010, CI014, CI017]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Annual recurring revenue", ">$400M", medium, "Confirms scale and helps size operating leverage potential", "Reconcile ARR definition to GAAP revenue and deferred revenue bridge"]
      - [">$100k customer cohort growth", "50% CAGR over five years", medium, "Proxy for enterprise expansion and willingness to buy more than one product", "Current cohort count, ACV distribution, churn, and NRR by cohort"]
      - ["Deployment time to initial value", "Most customers see insights within days", high, "Suggests lower onboarding friction and faster payback potential", "Time-to-live by segment, services burden, and implementation cost"]
      - ["Cloud / AI spend management capability", "Forecasting, budget alerts, and spend breakdowns are public features", high, "Creates a monetizable FinOps adjacency and a margin-improvement narrative for buyers", "Adoption rate, price premium, and measured customer savings"]
      - ["Cash balance and runway", null, low, "Without liquidity data investors cannot judge dependence on another financing event", "Current cash, monthly burn, covenant package, minimum liquidity, and runway under plan / stress"]
      - ["Gross margin, CAC, and payback", null, low, "These are the core tests for revenue quality and scalability", "Gross margin by product, support / hosting COGS, CAC, payback, and direct-versus-channel mix"]
    notes: >-
      Null values indicate metrics not disclosed in the reviewed public record, not zero economics.
      Public values mix company statements and third-party summaries rather than audited financials.
    claimRefs: [CI003, CI004, CI005, CI013, CI014, CI017]
figures:
