    body: >-
      LogicMonitor has a clearer right to win where buyers need one platform across
      network, cloud, on-prem, and external internet dependencies, but do not want to
      accept the instrumentation burden of a deepest-APM stack.
    claimRefs: ["CP001", "CP002", "CP003"]
