callouts:
  - calloutType: "strength"
    title: "Breadth creates multiple buying centers"
    body: "LogicMonitor is not pitching only a monitoring console. The assigned sources show a platform that can enter through hybrid infrastructure pain, then expand into cloud-cost control, compliance-heavy public-sector operations, MSP workflows, and digital-experience monitoring."
    claimRefs: [CM003, CM004, CM007, CM013, CM014]
  - calloutType: "risk"
    title: "The market story is broader than the hard sizing evidence"
    body: "Public footprint proxies support a credible reach narrative, but the assigned pack still lacks an independent spend-based TAM/SAM/SOM. Cloud-only deployment and hybrid unit pricing also narrow adoption in self-hosted or highly usage-variable segments."
    claimRefs: [CM008, CM009, CM010, CM011, CM012]
