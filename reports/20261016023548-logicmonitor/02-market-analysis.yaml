      - ["Catchpoint / LogicMonitor", 2025, "Global", "Thousands of vantage points worldwide", null, "Adjacency-expansion proxy tied to the Catchpoint acquisition", "Medium", "Shows workflow expansion into digital experience monitoring, not standalone market share."]
