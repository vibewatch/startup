    rows:
      - ["Hybrid IT observability", "Infrastructure, cloud, network, application, and incident-response observability for mixed estates", "Pure developer-first APM or security tools when not tied to hybrid-operations workflows", "Enterprise ITOps / CIO budget", "Core market defined by official platform, cloud, and marketplace positioning."]
      - ["MSP monitoring", "Multi-tenant monitoring, onboarding, alerting, and service-health workflows for managed estates", "Single-tenant SMB point tools with no managed-service workflow", "MSP operations leader / service-line budget", "Accio and Microsoft marketplace both point to MSP demand as a distinct wedge."]
      - ["Public-sector and regulated operations", "FedRAMP-eligible, audit-ready hybrid observability across on-prem, GovCloud, Azure Government, and edge", "Organizations that require self-hosted deployments not offered by LogicMonitor", "Agency IT / compliance programs", "Carahsoft and public-sector copy show compliance as a route to market, not just a feature."]
      - ["Cloud cost and capacity operations", "Cloud visibility, cost optimization, spend forecasting, and budget-threshold alerting inside hybrid operations", "Standalone FinOps suites sold without broader observability workflows", "CloudOps / infrastructure budget", "Budget-alert and forecasting language broadens the buyer beyond traditional monitoring."]
      - ["Digital experience and Internet reliability", "Synthetic, real-user, endpoint, and Internet-performance observability after Catchpoint", "General web analytics or marketing tooling", "Platform / SRE / digital-operations budget", "Catchpoint extends LogicMonitor's scope beyond owned infrastructure into dependency and user-experience monitoring."]
    notes: "Rows describe observed scope from the assigned source pack; exclusions mark adjacent spend categories that the same pack does not support treating as fully served by LogicMonitor."
    claimRefs: [CM001, CM003, CM006, CM007, CM013, CM014]
