figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      LogicMonitor's public customer evidence shows a partner-assisted path from hybrid
      complexity discovery to broader enterprise expansion, with renewal proof still missing.
    data:
      items:
        - label: Discover hybrid complexity
          actor: Enterprise IT, CloudOps, or MSP buyer
          phase: Discovery
          tone: neutral
          touchpoints:
            - Hybrid and multi-cloud observability positioning
            - Industry and role-based solution pages
        - label: Technical evaluation
          actor: Operations and platform teams
          phase: Evaluation
          tone: neutral
          touchpoints:
            - Marketplace availability for Azure-centric buyers
            - Claims of fast setup and broad integrations
        - label: Land in a scoped environment
          actor: Initial workload owner or public-sector procurement team
          phase: Initial deployment
          tone: positive
          touchpoints:
            - Most customers see insights within days
            - FedRAMP and government-cloud packaging for sensitive accounts
        - label: Prove day-to-day value
          actor: Operations teams
          phase: Production
          tone: positive
          touchpoints:
            - Anonymous customer quote about one-tool visibility
            - Hundreds-of-hours time-savings testimonial
        - label: Expand inside larger accounts
          actor: Enterprise platform owner
          phase: Expansion
          tone: positive
          touchpoints:
            - ">$100k customers grew at 50% CAGR over five years"
            - More than two-thirds of that cohort used more than one product
            - Catchpoint integration thesis broadens cross-sell surface
        - label: Renew and defend concentration
          actor: CFO, CRO, and customer success
          phase: Durability
          tone: risk
          touchpoints:
            - No public NRR, GRR, churn, or contract-length disclosure
            - No public top-customer or partner-mix disclosure in retained sources
    claimRefs: [CU001, CU006, CU007, CU010, CU011, CU012, CU014]
callouts:
  - calloutType: strength
    title: Broad buyer map
    body: >-
      LogicMonitor has enough current evidence to support a wide enterprise, MSP, regulated, and
      public-sector customer surface rather than a single-vertical niche story.
    claimRefs: [CU001, CU002, CU003]
  - calloutType: risk
    title: Durability is still under-disclosed
    body: >-
      Public customer proof is materially weaker on renewals, churn, concentration, and named
      production references than on top-of-funnel segment coverage.
    claimRefs: [CU013, CU014, CU015]
