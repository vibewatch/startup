  evidenceGaps:
    - type: stale
      severity: material
      topic: adoption-scale
      missingEvidence: A current 2026 customer-count update, large-account count, and regional installed-base split.
      whyItMatters: The strongest quantified customer-scale metric in the retained pool is from February 2024 and may no longer reflect current commercial traction.
      diligencePath: Request current customer count, customers over key spend bands, and regional split from management or a fresh 2026 source.
      relatedQuestionRefs: [QU002]
    - type: missing-source
      severity: material
      topic: retention-durability
      missingEvidence: Public or management-backed NRR, GRR, churn, renewal rate, contract length, and cohort retention data.
      whyItMatters: Without durability metrics, customer quality cannot be distinguished cleanly from logo acquisition or cross-sell storytelling.
      diligencePath: Ask management for retention cohorts, renewal rates, contract-length distribution, and customer-success KPIs.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named current production deployments with customer identity, workload scope, implementation status, and measurable outcomes.
      whyItMatters: The chapter has current customer-proof surfaces, but not enough attributable deployments to test reference quality or production depth.
      diligencePath: Request three to five referenceable customers with deployment scope, start date, ROI, and renewal status.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-channel-dependence
      missingEvidence: Top-customer revenue share, direct-versus-partner mix, partner concentration, and procurement friction by segment.
      whyItMatters: Channel leverage can accelerate growth, but it can also hide concentration or margin dependence that changes underwriting quality.
      diligencePath: Request customer concentration, partner-sourced ARR share, and pipeline / renewal mix by direct versus indirect channel.
      relatedQuestionRefs: [QU007]
