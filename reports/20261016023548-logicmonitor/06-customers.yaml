      - [Public-sector channel surface via Carahsoft, "Federal, state/local, and education buyers", "FedRAMP-oriented observability for GovCloud, Azure Government, and Zero Trust operations", "Channel and compliance proof; no named deployment in fetched text", "Shows procurement readiness for sensitive buyers", "No named agencies, seat counts, or production outcomes"]
