        - Not disclosed publicly in the retained pool
        - Provider outage, API change, or degraded telemetry quality reduces monitoring fidelity and customer trust.
        - High
        - Multi-cloud positioning and broad integration coverage reduce single-surface lock-in.
        - High until historical incident impact and fallback behavior are tested.
      - - Channel and implementation ecosystem
        - VARs, MSPs, GSIs, Microsoft, ServiceNow
        - Partners extend distribution, onboarding, and workflow integration depth.
        - Not disclosed publicly in the retained pool
        - Weak enablement or connector quality slows expansion, damages deployment quality, or raises churn risk.
        - Medium-High
