        - Medium because partner-sourced ARR, churn, and top-partner concentration are not public here.
      - - Public-sector route-to-market and authorization maintenance
        - Carahsoft and FedRAMP-linked channel motion
        - Government expansion depends on maintaining authorization scope and partner execution quality.
        - Not disclosed publicly in the retained pool
        - Authorization drift or channel underperformance reduces federal and SLED conversion velocity.
        - Medium
        - FedRAMP Moderate and public-sector packaging improve baseline credibility.
        - Medium pending renewal cadence, agency-win detail, and concentration proof.
    notes: >-
      Concentration is marked undisclosed when the retained public pool does not quantify partner or
      provider dependence.
    claimRefs: [CR002, CR003, CR004, CR008, CR012, CR014]
