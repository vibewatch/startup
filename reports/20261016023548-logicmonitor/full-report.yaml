  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly evidenced layers show hybrid telemetry collection feeding a SaaS observability plane, then AI-guided
      operational workflows.
    data:
      layers:
        - label: Telemetry sources
          detail: Hybrid infrastructure, cloud services, applications, logs, and AI systems
          items:
            - On-prem servers, storage, and network devices
            - AWS, Azure, and GCP resources
            - Containers, Kubernetes, and applications
            - Logs, service events, and security signals
            - AI telemetry from LLM, GPU, and vector-database tooling
        - label: Collection plane
          detail: Collector-based plus API-based ingestion
          modules:
            - Collectors on Windows/Linux inside customer environments
            - Cloud-provider APIs such as Azure Monitor and AWS service APIs
            - Discovery workflows and topology/resource mapping
        - label: SaaS observability plane
          detail: Hosted analytics, views, and alerting surface
          modules:
            - Dashboards, reports, and unified visibility
            - LM Logs and log-to-metric correlation
            - Alerting, escalation, and anomaly detection
            - Cost and security-event views
        - label: Automation layer
          detail: AI-guided correlation and response workflows
          modules:
            - Edwin AI correlation, triage, and guidance
            - Workflow integrations such as ServiceNow and Jira
        - label: Internet and experience layer
          detail: Post-Catchpoint telemetry expansion beyond internal infrastructure
          modules:
            - Catchpoint synthetic, network, and real-user monitoring feed
        - label: Operator outcomes
          detail: User-facing actions the platform is marketed to improve
          outputs:
            - Faster incident isolation and remediation
            - Cloud-cost and resource-optimization decisions
            - Cross-team operational visibility
    approximationNotes: null
    claimRefs:
