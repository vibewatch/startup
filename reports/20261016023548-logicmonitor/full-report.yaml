      - number: '3.3'
        title: Pricing, distribution, and switching cost shape deal outcomes
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is limited across the peer set, but the available record still shows
              meaningful buyer tradeoffs. LogicMonitor is unusual in publishing a Signature-tier list price, which helps
              procurement model cost but also makes the AIOps premium explicit. Dynatrace and Datadog can justify higher
              spend where application performance is revenue-critical, yet both create more burden around
              instrumentation or usage governance. BigPanda's custom pricing and multi-week rollout are easier to
              justify only when a customer insists on preserving its incumbent tools. Channel and MSP orientation also
              matter: LogicMonitor's official messaging leans into partner, MSP, and hybrid-estate operations more
              directly than the direct-comparison sources do for Dynatrace or BigPanda. Switching cost therefore cuts
              both ways: LogicMonitor can displace fragmented monitoring stacks, but it can also be displaced by deeper
              application platforms, by overlays that preserve incumbent tools, or by lower-cost internal builds.
            claimRefs:
              - CP006
              - CP008
              - CP011
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability depends on consolidation demand holding up against specialization
        blocks:
          - type: paragraph
            body: >-
              The durability case is credible but conditional. LogicMonitor's own survey evidence supports a market
              moving toward consolidation, which should help broad platforms that unify metrics, logs, applications, and
              external dependencies. Catchpoint also improves LogicMonitor's story versus pure infrastructure incumbents
              because it adds internet and digital-experience visibility that buyers increasingly care about. The
              counterpoint is equally important: Dynatrace still owns the most application-centric narrative, and
              overlay vendors such as BigPanda remain viable if the customer wants smarter incident response without
              ripping out its existing tools. Meanwhile, legacy or self-managed substitutes persist because some buyers
              optimize for control or license cost, not for fastest time to value. LogicMonitor's moat is therefore
              breadth plus deployment speed, not an uncontested technical monopoly.
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP013
              - CP014
              - CP016
