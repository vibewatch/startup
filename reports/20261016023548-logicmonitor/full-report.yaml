  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Retention stays above 110%, AI / Catchpoint broadens platform share, and sponsor-backed growth converts into
          cleaner economics disclosure.
        - Current valuation can look justified or conservative if expansion economics and strategic scarcity improve.
        - Integration execution, competitive response, and whether AI features monetize rather than merely market.
        - Requires independent confirmation of revenue quality, margins, and successful cross-sell.
      - - Base
        - >-
          The platform remains credible and differentiated, but public disclosure stays partial and investors still
          underwrite around missing debt and cash-flow detail.
        - 'A fair stance persists: good company, but the entry only works at disciplined terms.'
        - Paying the 2024 mark without better evidence leaves limited margin for error.
        - Best match to current public evidence.
      - - Bear
        - >-
          The 2024 headline valuation proves to have embedded optimism that public evidence cannot support, while
          competition and platform-integration complexity compress exit confidence.
        - >-
          The current mark becomes full and downside protection depends on liquidation rights or a better future entry
          point.
        - Opaque debt, hidden churn pockets, or weak monetization of AI / Catchpoint expansion.
        - Triggered by weak diligence read-through on debt, margins, or cohort quality.
    notes: >-
      Scenario table uses public-evidence decision logic rather than a modeled DCF or public-multiple worksheet because
      the assigned pool does not provide auditable revenue, margin, or cash-flow inputs.
