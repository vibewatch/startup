        title: Revenue model and observed commercial scale
        blocks:
          - type: paragraph
            body: >-
              The observable revenue engine is enterprise software sold around LM Envision, LogicMonitor's SaaS
              hybrid-observability platform, with adjacent monetization from AI automation, cloud-cost workflows, and
              partner-assisted delivery rather than from one-time infrastructure sales. Official pages position the
              platform across enterprise IT roles, CloudOps, DevOps, and MSP use cases, while Microsoft Marketplace also
              frames it for enterprise IT and MSP buyers. Commercial scale is real but imperfectly disclosed:
              LogicMonitor said in February 2024 that it served about 2,400 customers and that the number of customers
              spending more than $100k grew at a 50% CAGR over five years, and TipRanks reported in July 2026 that ARR
              surpassed $400 million with Edwin AI already contributing about one third of bookings. That supports a
              land-and-expand subscription story, but it does not disclose contract duration, renewal economics, net
