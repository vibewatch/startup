        blocks:
          - type: paragraph
            body: >-
              The assigned pack points to a multi-persona buying center instead of a single NOC tool buyer. LogicMonitor
              explicitly markets to CIO, ITOps, AIOps, CloudOps, and DevOps roles, while Microsoft marketplace and Accio
              summaries reinforce two distinct motions: direct enterprise infrastructure teams and MSP operators running
              multi-tenant estates. Public-sector and regulated-industry pages broaden that buyer map again by tying
