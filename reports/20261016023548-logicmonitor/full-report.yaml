      - number: '4.2'
        title: Economics signals from product, deployment, and channel evidence
        blocks:
          - type: paragraph
            body: >-
              Public evidence is stronger on value proposition than on unit economics. LogicMonitor's own pages
              repeatedly emphasize fewer tools, lower cloud spend, budget alerts, and faster incident handling, while
              the AI observability page says most customers see insights within days because onboarding relies on
              automated discovery and prebuilt dashboards. Those are favorable proxies for deployment speed and product
              breadth, and the Catchpoint acquisition expands the cross-sell surface into Internet performance and
              digital-experience monitoring. Still, none of the reviewed sources disclose the realized price attached to
              those modules, the margin impact of services or support, channel take-rates, or the cost to acquire and
              expand customers. The economic signal is therefore directional: LogicMonitor appears to sell a broad,
              sticky software bundle with multiple upsell levers, but the public record does not yet show whether that
              breadth converts into premium pricing or superior contribution margin. [CI010][CI011][CI012][CI017]
