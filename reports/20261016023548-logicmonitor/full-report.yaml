  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor's market boundary is broader than legacy infrastructure monitoring but still centered on
              operations-led observability rather than every analytics or security workflow. Official product, cloud,
              solutions, and marketplace copy consistently position LM Envision as a single platform for infrastructure,
              cloud, applications, networks, and—after Catchpoint—digital experience telemetry. That means the included
              spend centers on hybrid IT monitoring, incident-response tooling, cloud-operations visibility, and
              selected digital-experience use cases. The assigned sources do not support treating pure developer-first
              APM, self-hosted monitoring stacks, or standalone FinOps/security tools as fully inside the same served
              market unless they connect back to hybrid-operations workflows.
