  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and module map
        blocks:
          - type: paragraph
            body: >-
              Reviewed sources consistently position LM Envision as a hybrid observability platform rather than a single
              infrastructure-monitoring point tool. LogicMonitor's own cloud and solutions pages frame the product
              around unified visibility across on-premises, multi-cloud, applications, and operations workflows, while
              AWS's partner write-up corroborates that the platform is meant to span AWS, other clouds, and on-premises
              environments in one monitoring surface. Independent editorial coverage reinforces the same market fit: the
              strongest public differentiation is breadth for hybrid IT operations and MSP-style environments, not a
              developer-first tracing moat. That makes the module mix important for diligence because the company is
              selling a platform bundle with multiple adjacent surfaces—core monitoring, LM Logs, Edwin AI, cost
              optimization, and now Catchpoint-linked internet monitoring—rather than a narrowly bounded SKU.
            claimRefs:
              - CE001
              - CE004
              - CE009
              - CE012
