        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the assigned evidence are complexity, consolidation, and response-time
              pressure. Official pages repeatedly frame the product around reducing tool sprawl, correlating hybrid
