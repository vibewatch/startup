      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Forward capital adequacy remains the largest financial diligence gap. Clay attributes at least $942.95
              million of disclosed funding to LogicMonitor, including an $800 million November 2024 private-equity round
              at an approximately $2.4 billion valuation inclusive of debt, but the same profile also says undisclosed
              debt-financing and acquisition rounds sit outside that disclosed total. That means the public record
              supports scale and sponsor access, yet not the current burden of debt, covenant tightness,
              minimum-liquidity requirements, or post-2024 cash runway. The evidence base is also noisy at the margin:
              one assigned OpenTools funding URL returned unrelated AI and NASA snippets, and the reviewed independent
              surfaces still do not publish usable pricing or downside detail. The financial verdict is therefore mixed:
              revenue quality looks enterprise-software-led, but margin path and financing dependency are still
              management-only questions. [CI007][CI008][CI009][CI014][CI015][CI016]
