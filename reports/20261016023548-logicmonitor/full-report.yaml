      - number: '5.4'
        title: Trust posture and technical diligence risks
        blocks:
          - type: paragraph
            body: >-
              The independent signal in the assigned pack is directionally positive but not clean enough to remove
              technical diligence risk. Gartner's vendor page shows a sizable review base and a solid aggregate score,
              yet it also highlights a critical review that calls out customization and support friction. Public
              developer-signal exists through the company's GitHub organization, but the visible footprint is relatively
              small for a scaled enterprise platform and does not by itself prove a deep open ecosystem or durable
              developer moat. Official materials mention audit logging, security-log ingestion, and compliance use cases
              such as HIPAA and SOC 2, but the reviewed sources stop short of naming current certifications,
              trust-center artifacts, uptime commitments, or incident-history evidence. Net: product breadth is
              credible, but diligence still needs primary proof on security posture, operational reliability, and
              adoption depth for the newer AI and internet-monitoring layers.
            claimRefs:
              - CE007
              - CE008
              - CE011
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is evident; proof depth is not
            body: >-
              LogicMonitor's public materials credibly show a broad platform surface, but the reviewed pack still lacks
              independent proof on security attestations, public uptime commitments, collector scaling ceilings, and
              attach-rate evidence for Edwin AI and Catchpoint-enabled workflows.
            calloutType: risk
            claimRefs:
              - CE005
              - CE007
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment coverage is broad, with notable regulated and partner-led routes
        blocks:
          - type: paragraph
            body: >-
              Current go-to-market materials show LogicMonitor selling to enterprise IT teams, MSPs, and hybrid-cloud
              operators rather than to a narrow developer niche. The Microsoft Marketplace listing specifically frames
              the product for enterprise IT and MSP buyers, while current solutions pages carve the offering by industry
              and business function across financial services, healthcare, public sector, manufacturing, retail,
              hospitality, technology, professional services, and MSP workflows. Public-sector coverage is more than a
              generic logo strategy: the partner page reviewed for this chapter highlights FedRAMP Moderate, AWS
              GovCloud, Azure Government, and separate federal, state/local, and education motions. That breadth is
              strategically useful, but it also suggests some customer acquisition in sensitive segments still depends
              on partners, procurement paths, and compliance-oriented packaging rather than purely direct self-serve
              adoption.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
