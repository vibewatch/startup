      - number: '5.2'
        title: Delivery architecture and technical dependencies
        blocks:
          - type: paragraph
            body: >-
              The public operating model is a classic SaaS control plane with mixed collection methods. AWS and CubeAPM
              both describe LogicMonitor as collector-based, with collectors running inside customer environments and
              gathering telemetry via standard protocols and APIs before forwarding data to LogicMonitor's hosted
              platform. That architecture supports the buyer promise of fast onboarding and broad device coverage, and
              it avoids the customer having to run a full self-hosted observability backend. It also creates clear
              dependencies: local collector placement, outbound network reachability, cloud-provider APIs, and continued
              management-plane availability remain part of the production design. Azure-specific materials show that
              some cloud use cases are deeper than dashboard-only visibility, but the reviewed pack does not provide
              public scaling benchmarks, reference architectures, or public SLA/status evidence that would let an
              investor underwrite reliability with high confidence.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
