  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct peers, overlays, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than "other monitoring tools." LogicMonitor sits in the middle of
              three buyer choices. First are direct hybrid-observability competitors that can replace a broad part of
              the stack, especially Dynatrace and Datadog. Second are overlay AIOps products such as BigPanda that
              assume the buyer keeps existing telemetry tools and mainly wants correlation, incident triage, and
              change-risk intelligence. Third are substitutes: Splunk-style log-centric operations stacks, legacy
              self-managed tools, and internal build paths that preserve control but push more tuning, integration, and
              operating burden back onto the customer. The key implication is that LogicMonitor rarely wins by matching
              one feature; it wins when a buyer values broad hybrid coverage, lower agent friction, and enough
              automation to consolidate tools without rebuilding the estate around deep instrumentation.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP010
              - CP014
              - CP016
