      - number: '3.2'
        title: Capability tradeoffs are driven by telemetry ownership and operating model
        blocks:
          - type: paragraph
            body: >-
              The architecture choice is the real fault line. LogicMonitor's collector-based model is optimized for
              heterogeneous infrastructure where agent deployment is politically or technically hard, while Datadog and
              Dynatrace extract more value when buyers accept broad instrumentation and ongoing tuning. BigPanda is
              different again: it does not replace telemetry collection, so it is strongest when customers already like
              their existing stack and mainly need correlation and response workflow intelligence. Splunk and
              self-managed stacks stay relevant because some buyers still prefer forensic depth or operational control
              even at the cost of higher engineering overhead. That means LogicMonitor's best accounts are not "deepest
              APM" buyers; they are teams trying to unify hybrid operations, networks, cloud, and external dependencies
              faster than a cloud-native observability stack or an overlay rollout would allow.
            claimRefs:
