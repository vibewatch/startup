              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.2'
        title: Adoption proof exists, but the freshest quantified scale data is still dated
        blocks:
          - type: paragraph
            body: >-
              The strongest numerical adoption evidence in the retained pool remains LogicMonitor's February 2024
              business update, which said the company served about 2,400 customers, saw more than 30% of new customers
              come from outside the United States, and grew customers spending more than $100k at a 50% CAGR over five
              years, with more than two-thirds of that cohort using more than one product. Current pages add operating
              proof, but mostly in sales-ready form: the observability-platform page says most customers see insights
              within days, includes an anonymous testimonial claiming hundreds of hours of savings, and the resource hub
              shows a steady stream of recent case studies. Together that indicates live deployment activity and
              land-and-expand intent, but not a clean 2026 customer count or a fresh independently verified adoption
              denominator.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
          - type: table
