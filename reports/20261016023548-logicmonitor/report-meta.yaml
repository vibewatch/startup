companyProfile:
  summary: >-
    LogicMonitor is a sponsor-backed hybrid observability and IT operations software platform that sells LM Envision
    plus AI, FinOps, and digital-experience capabilities to enterprise IT, CloudOps, MSP, and regulated buyers. The
    current public record shows real scale, a broadened product surface, and a Catchpoint acquisition, but it still does
    not fully disclose debt, margin, or current cohort quality.
