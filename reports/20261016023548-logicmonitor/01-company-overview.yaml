          tone: neutral
          claimRefs: [CO004, CO005, CO009]
    approximationNotes: >-
      Years are used where the assigned fetched text supports only a current
      dated badge or present-tense page state rather than a separately dated
      publication timestamp.
    claimRefs: [CO004, CO005, CO008, CO009, CO010, CO011, CO013]
callouts:
  - calloutType: strength
    title: Platform breadth is the clearest supported strength
    body: >-
      Across company pages, marketplace copy, and an independent review, the
      most consistent story is breadth: hybrid infrastructure coverage, broad
      integrations, MSP relevance, and AI-assisted operations all show up in
      current assigned evidence.
    claimRefs: [CO001, CO003, CO004, CO005, CO012]
  - calloutType: risk
    title: Capital structure and governance are still under-disclosed
    body: >-
      This chapter cannot responsibly restate valuation, total raised,
      investors, board composition, or debt terms from stale context because
      the assigned current fetched sources do not support those facts.
    claimRefs: [CO014, CO015, CO016]
