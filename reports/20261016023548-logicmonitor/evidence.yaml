  - type: private-evidence-only
    severity: material
    topic: concentration-and-capital-structure
    missingEvidence: >-
      The assigned sources do not quantify top-partner concentration, hyperscaler exposure, top-customer mix, debt
      covenants, or gross-margin durability.
