evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: A current board roster, founder list, named investors, and formal post-acquisition leadership structure.
    whyItMatters: >-
      These facts determine control, succession risk, and whether acquisition integration depends on a narrow executive
      set.
    diligencePath: Request a current board slide, cap-table summary, and named executive roster from management or sponsor materials.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: capital-gap
    missingEvidence: Current valuation, total capital raised, debt amount, covenant package, and customer count.
    whyItMatters: >-
      These are chapter-one anchor metrics for later valuation, financial, and customer analysis; publishing stale
      numbers would misstate present risk.
    diligencePath: >-
      Obtain a current financing history, debt summary, and KPI dashboard from management or a sponsor-backed
      lender/board package.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: company milestone timeline
    missingEvidence: A sourced pre-2025 founding, financing, regulatory, and partnership chronology.
    whyItMatters: >-
      The current timeline is recent and AI/acquisition heavy, which is useful for refresh context but incomplete for
      long-run company-history analysis.
    diligencePath: >-
      Pull an official about/history page, financing announcements, and independent historical coverage into the source
      pool before final publication.
  - type: missing-source
    severity: material
    topic: standalone-market-sizing
    missingEvidence: >-
      An independent 2026 market study or management-ready model that isolates hybrid observability, MSP monitoring,
      compliance-heavy operations, and digital-experience spend into TAM, SAM, and SOM values with a stated CAGR.
    whyItMatters: >-
      Current public evidence supports footprint proxies but not a spend-based ceiling, so valuation upside can be
      overstated if installed-base or telemetry scale is treated as total market size.
    diligencePath: >-
      Obtain a current Gartner, IDC, or equivalent segmentation study, or request management's market model with
      explicit assumptions on hybrid observability, MSP, public-sector, and DEM subsegments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: telemetry-scale-proxy
    missingEvidence: >-
      A dated company-defined metric for daily telemetry volume that explains whether the count refers to raw
      datapoints, correlated events, or another unit.
    whyItMatters: >-
      Accio cites more than one trillion metrics daily while Zaira Labs cites 2 trillion+ daily metrics, so the sizing
      proxy is directionally useful but not precise.
    diligencePath: >-
      Ask LogicMonitor for a current telemetry-volume definition or find a dated technical benchmark that states the
      same numerator and scope.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current realized pricing, discount bands, and renewal step-ups for LogicMonitor, Dynatrace, Datadog, and BigPanda.
    whyItMatters: >-
      Public list prices and custom-pricing descriptions are enough for directional positioning, but not enough to
      underwrite procurement leverage or all-in ownership cost.
    diligencePath: >-
      Request recent enterprise proposals or customer references with effective price per monitored unit, committed
      consumption, and renewal history.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: >-
      Verified win-loss rates showing where LogicMonitor consistently beats Dynatrace, Datadog, BigPanda, or internal
      builds by segment.
    whyItMatters: >-
      Competitive posture is inferential without buyer-level conversion evidence, especially for moat durability and
      likely displacement paths.
    diligencePath: >-
      Ask management for recent competitive-loss logs segmented by customer size, cloud complexity, and partner-led
      versus direct sales motion.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: >-
      Current cash balance, debt balance, covenant package, burn rate, and base / downside runway after the 2024
      financing.
    whyItMatters: >-
      Without liquidity and covenant evidence, investors cannot tell whether the company is financing for acceleration
      or because capital structure now constrains operating flexibility.
    diligencePath: >-
      Request latest board package, debt summary, covenant schedule, and monthly cash bridge through the next planned
      financing milestone.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Signed order forms or SKU price book showing list price, discount ranges, overage terms, and partner discounting
      by segment.
    whyItMatters: >-
      Public pages show solution breadth and value framing, but realized price discipline determines revenue quality and
      payback.
    diligencePath: Review anonymized enterprise contracts, channel agreements, and win / loss pricing memos by segment.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by product, hosting and support COGS, sales and marketing efficiency, CAC, payback, and retention
      metrics.
    whyItMatters: >-
      ARR scale without margin and payback data is not enough to underwrite the durability of growth or the path to
      free-cash-flow conversion.
    diligencePath: >-
      Obtain management KPI pack with GAAP revenue bridge, segment gross margin, CAC cohorting, NRR / GRR, and services
      burden.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: independent-capital-corroboration
    missingEvidence: Usable independent 2026 financing coverage matching the assigned OpenTools funding URL title.
    whyItMatters: >-
      A second current independent financing source would improve corroboration of the 2024 round and any current
      capital-markets narrative.
    diligencePath: >-
      Retain another successful independent funding or sponsor-coverage source during convergence or finalization if it
      already exists in the approved run-level pool.
    relatedQuestionRefs:
      - QI005
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Current public trust-center, certification, or SLA materials naming LogicMonitor's active security attestations,
      uptime commitments, and incident-handling controls.
    whyItMatters: >-
      Security posture and contractual reliability are core underwriting items for an observability platform embedded in
      production infrastructure.
    diligencePath: >-
      Request current SOC 2 / ISO materials, public or customer trust-center documentation, standard MSA/SLA terms, and
      any recent incident postmortems.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: aiops-adoption
    missingEvidence: Customer-level adoption, attach-rate, and realized-ROI data for Edwin AI and the newer AI-observability workflows.
    whyItMatters: >-
      The growth thesis increasingly depends on automation and AI-assisted operations being sticky production modules
      rather than marketing extensions.
    diligencePath: >-
      Ask management for module penetration by tier, retention/expansion data for Edwin AI users, and named production
      case studies with before/after incident metrics.
  - type: missing-source
    severity: material
    topic: integration-depth
    missingEvidence: >-
      Independent benchmarks or reference architectures showing collector scaling limits, cross-cloud telemetry
      normalization, and post-acquisition Catchpoint workflow integration depth.
    whyItMatters: >-
      Breadth claims are easier to market than to operationalize, and integration quality affects deployment friction,
      support load, and durable differentiation.
    diligencePath: >-
      Request reference architecture decks, large-environment deployment examples, product integration timelines, and
      customer references using unified LogicMonitor-plus-Catchpoint workflows.
  - type: stale
    severity: material
    topic: adoption-scale
    missingEvidence: A current 2026 customer-count update, large-account count, and regional installed-base split.
    whyItMatters: >-
      The strongest quantified customer-scale metric in the retained pool is from February 2024 and may no longer
      reflect current commercial traction.
    diligencePath: >-
      Request current customer count, customers over key spend bands, and regional split from management or a fresh 2026
      source.
    relatedQuestionRefs:
      - QU002
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: Public or management-backed NRR, GRR, churn, renewal rate, contract length, and cohort retention data.
    whyItMatters: >-
      Without durability metrics, customer quality cannot be distinguished cleanly from logo acquisition or cross-sell
      storytelling.
    diligencePath: Ask management for retention cohorts, renewal rates, contract-length distribution, and customer-success KPIs.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named current production deployments with customer identity, workload scope, implementation status, and measurable
      outcomes.
    whyItMatters: >-
      The chapter has current customer-proof surfaces, but not enough attributable deployments to test reference quality
      or production depth.
    diligencePath: Request three to five referenceable customers with deployment scope, start date, ROI, and renewal status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-channel-dependence
    missingEvidence: Top-customer revenue share, direct-versus-partner mix, partner concentration, and procurement friction by segment.
    whyItMatters: >-
      Channel leverage can accelerate growth, but it can also hide concentration or margin dependence that changes
      underwriting quality.
    diligencePath: >-
      Request customer concentration, partner-sourced ARR share, and pipeline / renewal mix by direct versus indirect
      channel.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: control-depth
    missingEvidence: >-
      The retained pool does not include the underlying security packet, DPA terms, incident history, or
      model-governance controls for AI-led actions.
    whyItMatters: >-
      These materials are necessary to judge whether autonomous remediation can be used safely in regulated and
      mission-critical environments.
    diligencePath: >-
      Request SOC 2 and ISO materials, DPA and subprocessor terms, incident postmortems, approval boundaries, rollback
      controls, and model-governance documentation.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: outcome-validation
    missingEvidence: >-
      The retained public evidence does not include independent customer cohorts, benchmark studies, or renewal data
      validating the marketed MTTR and efficiency improvements.
    whyItMatters: >-
      Without independent proof, investors cannot tell whether the AI-observability narrative is durable economics or
      mainly positioning.
    diligencePath: >-
      Ask for customer before-after studies, renewal and expansion cohorts, reference calls, and any audited ROI or
      SLA-improvement analysis.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
