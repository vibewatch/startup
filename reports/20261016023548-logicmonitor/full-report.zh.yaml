  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据指向一种经常性软件模式：从混合可观测性起步，经由 AI 和 FinOps 工作流扩张，再通过渠道和收购驱动的交叉销售扩大。
    data:
      nodes:
        - id: estate
          label: 客户遥测资产
          description: 在一个环境中监控混合基础设施、云工作负载、应用和 AI 系统。
          claimRefs:
            - CI001
            - CI002
        - id: platform
          label: LM Envision 平台订阅
          description: 统一可观测性、自动发现和广泛集成构成基础订阅的锚点。
          claimRefs:
            - CI001
            - CI010
        - id: ai
          label: Edwin AI 扩张
          description: 代理式 AIOps、告警关联和根因指导带来附加订单扩张。
          claimRefs:
            - CI006
            - CI012
        - id: finops
          label: 成本和预算工作流
          description: 支出拆分、预测和预算阈值告警强化 ROI 叙事。
          claimRefs:
            - CI010
            - CI013
        - id: distribution
          label: 渠道和产品触点扩张
          description: VAR、MSP、GSI 以及 Catchpoint 收购扩大市场路径和钱包份额。
          claimRefs:
            - CI002
            - CI011
        - id: outcome
          label: 经常性收入结果
          description: 观测到的公开规模信号包括 ARR 超过 $400M、$100k+ 客户增长以及多产品采用。
          claimRefs:
            - CI004
            - CI005
            - CI006
      edges:
        - from: estate
          to: platform
          relationship: 监控范围形成基础软件需求
          claimRefs:
            - CI001
        - from: platform
          to: ai
          relationship: 核心可观测性转化为自动化增购
          claimRefs:
            - CI010
            - CI012
        - from: ai
          to: finops
          relationship: 运营遥测支撑成本和预算工作流
          claimRefs:
            - CI013
        - from: finops
          to: distribution
          relationship: 更广价值主张支撑合作伙伴协助扩张
          claimRefs:
            - CI002
            - CI010
        - from: distribution
          to: outcome
          relationship: 更广产品和渠道触点推动经常性收入增长
          claimRefs:
            - CI004
            - CI005
            - CI006
            - CI011
    approximationNotes: 该顺序体现公开的产品和市场拓展逻辑，不是已披露的量化转化漏斗。
    claimRefs:
      - CI002
      - CI004
      - CI005
      - CI006
      - CI010
      - CI011
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 有公开证据的各层显示，混合遥测采集先进入 SaaS 可观测性平面，再进入 AI 引导的运营工作流。
    data:
      layers:
        - label: 遥测来源
          detail: 混合基础设施、云服务、应用、日志和 AI 系统
          items:
            - 本地服务器、存储和网络设备
            - AWS、Azure 和 GCP 资源
            - 容器、Kubernetes 和应用
            - 日志、服务事件和安全信号
            - 来自 LLM、GPU 和向量数据库工具的 AI 遥测
        - label: 采集平面
          detail: 基于采集器并结合 API 的摄取
          modules:
            - 客户环境内 Windows / Linux 上的采集器
            - Azure Monitor 和 AWS 服务 API 等云厂商 API
            - 发现工作流以及拓扑 / 资源映射
        - label: SaaS 可观测性平面
          detail: 托管分析、视图和告警界面
          modules:
            - 仪表盘、报告和统一可见性
            - LM Logs 以及日志到指标的关联
            - 告警、升级和异常检测
            - 成本和安全事件视图
        - label: 自动化层
          detail: AI 引导的关联和响应工作流
          modules:
            - Edwin AI 关联、分诊和指导
            - ServiceNow 和 Jira 等工作流集成
        - label: 互联网和体验层
          detail: 收购 Catchpoint 后，遥测范围扩展到内部基础设施之外
          modules:
            - Catchpoint 合成监控、网络监控和真实用户监控数据流
        - label: 操作员结果
          detail: 平台宣传要改善的面向用户的行动
          outputs:
            - 更快定位和修复事件
            - 云成本和资源优化决策
            - 跨团队运营可见性
    approximationNotes: null
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: LogicMonitor 的公开客户证据显示，客户可在合作伙伴协助下从发现混合复杂性走向更广泛的企业扩张，但续约证据仍缺失。
    data:
      items:
        - label: 发现混合复杂性
          actor: 企业 IT、CloudOps 或 MSP 买方
          phase: 发现
          tone: neutral
          touchpoints:
            - 混合和多云可观测性定位
            - 按行业和角色划分的解决方案页面
        - label: 技术评估
          actor: 运营和平台团队
          phase: 评估
          tone: neutral
          touchpoints:
            - 面向 Azure 核心买方的市场可用性
            - 快速设置和广泛集成的主张
        - label: 落地于限定环境
          actor: 初始工作负载负责人或公共部门采购团队
          phase: 初始部署
          tone: positive
          touchpoints:
            - 大多数客户几天内即可看到洞察
            - 面向敏感账户的 FedRAMP 和政府云方案
        - label: 证明日常价值
          actor: 运营团队
          phase: 生产
          tone: positive
          touchpoints:
            - 关于单一工具可见性的匿名客户引述
            - 节省数百小时的客户证言
        - label: 在大型客户内部扩张
          actor: 企业平台负责人
          phase: 扩张
          tone: positive
          touchpoints:
            - '>$100k 客户五年复合增长率为 50%'
            - 该 cohort 超过三分之二使用了多个产品
            - Catchpoint 集成论点扩大交叉销售空间
        - label: 续约并守住客户集中度
          actor: CFO、CRO 和客户成功团队
          phase: 持续性
          tone: risk
          touchpoints:
            - 没有公开 NRR、GRR、流失率或合同期限披露
            - 留存的公开来源中未见最大客户或伙伴构成
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU010
      - CU011
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 当前风险主要集中在治理、生态依赖和证明深度缺口。
    data:
      columns:
        - label: 可能性
          note: 该问题影响实际客户部署的概率。
        - label: 影响
          note: 对客户信任、增长或尽调信心的潜在损害。
        - label: 缓释成熟度
          note: 数值越高，说明公开的缓释证据越强。
        - label: 剩余暴露
          note: 考虑可见缓释措施后的净评估。
      rows:
        - label: AI 修复治理
          note: 自主行动的上行空间明确，但公开证据池中的控制深度证据仍薄弱。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: Catchpoint 集成执行
          note: 管理层讲述了更广的平台故事，但商业整合能否持久，公开证据仍有限。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中-高
              tone: high
        - label: 超大规模云厂商和 API 依赖
          note: 外部平台健康状况直接影响遥测覆盖和告警质量。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 合规证明深度缺口
          note: FedRAMP 有帮助，但指定证据不包含完整控制包或事件记录。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 结果证明缺口
          note: 公司层面的效率主张强于此处留存的第三方验证。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 低
              tone: low
            - label: 中
              tone: medium
        - label: 财务和集中度不透明
          note: 此处留存的公开材料没有量化烧钱速度、毛利率、债务条款或伙伴和客户集中度。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
            - label: 高
              tone: high
    approximationNotes: 热力图等级是根据留存来源证据综合出的定性标签，而非公司披露的评分标准。
    claimRefs:
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR010
      - CR011
      - CR013
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 推荐从真实融资锚点和平台证明出发，最终给出跟踪结论，因为披露缺口仍大于当前公开证据能够填补的范围。
    data:
      nodes:
        - id: valuation-anchor
          label: 估值锚点
          detail: 含债务约 $2.4B 的 $800M 融资
        - id: commercial-proof
          label: 商业验证
          detail: 100,000 用户、覆盖 30 个国家、>110% NRR、多产品采用率 80%
        - id: platform-breadth
          label: 平台广度
          detail: 混合可观测性、3,000+ 个集成以及公司披露的运营结果
        - id: expansion-optionality
          label: 扩张期权
          detail: Catchpoint 将 LogicMonitor 延伸至互联网性能和数字体验监控
        - id: disclosure-gap
          label: 披露缺口
          detail: 指定公开证据池没有经审计收入、利润率、自由现金流或债务契约细节
        - id: recommendation
          label: 推荐
          detail: 跟踪 / 中等信心 / 高风险 / 估值合理
      edges:
        - from: valuation-anchor
          to: commercial-proof
          label: 支持
        - from: commercial-proof
          to: platform-breadth
          label: 得到强化
        - from: platform-breadth
          to: expansion-optionality
          label: 扩展至
        - from: expansion-optionality
          to: disclosure-gap
          label: 但仍被抵消
        - from: disclosure-gap
          to: recommendation
          label: 因此
    approximationNotes: 仅为定性决策链；图中没有编码隐含转化率或加权评分。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
