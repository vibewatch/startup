          axis.
      yAxis:
        label: 部署摩擦和持续调优负担
        min: 1
        max: 5
        lowLabel: Lower burden / faster value
        highLabel: Higher burden / slower value
        description: >-
          Ordinal synthesis from cited instrumentation, rollout, and governance evidence; not a measured
          implementation-time benchmark.
      points:
        - label: LogicMonitor
          x: 4
          'y': 2
          note: 混合环境和互联网侧可见性广，代理部署摩擦较低，但高级自动化集中在 Signature。
        - label: Dynatrace
          x: 5
          'y': 4
          note: 原生应用可观测性和因果 AI 最深，但更广泛的埋点与用量治理提高了负担。
        - label: BigPanda
          x: 2
          'y': 4
          note: 覆盖层智能和变更风险工作流较强，但依赖现有遥测工具，且集成需要数周。
        - label: Datadog
          x: 4
          'y': 4
          note: 云原生广度很强，但代理优先模式在规模化时增加生命周期管理开销。
        - label: Splunk
          x: 3
          'y': 5
          note: 取证和日志深度较强，但计算、存储和专业调优需求高。
        - label: 传统自管理技术栈
          x: 2
          'y': 5
          note: 控制力高，但团队要自行承担最慢的价值实现速度和最多的调优工作。
    approximationNotes: 坐标轴是根据引用来源综合出的、有证据支撑的序数评分，用于比较运营模式取舍；它们不是实测基准或厂商披露的 KPI。
    claimRefs:
