      - number: '3.2'
        title: 能力取舍由遥测所有权与运营模式决定
        blocks:
          - type: paragraph
            body: >-
              真正的分水岭是架构选择。LogicMonitor 的 collector 模型适合异构基础设施，尤其是 agent 部署在政治或技术上都困难的环境；Datadog 和 Dynatrace
              则在买方接受广泛埋点和持续调优时更能释放价值。BigPanda 又不同：它不替代遥测采集，因此最适合客户已经认可现有技术栈、主要需要关联和响应工作流智能的场景。Splunk
              与自管栈仍有市场，因为部分买方宁愿换取取证深度或运营控制，也接受更高的工程负担。因此 LogicMonitor 最佳客户不是追求“最深
              APM”的团队，而是希望比云原生可观测性栈或叠加层部署更快地统一混合运维、网络、云和外部依赖的团队。
            claimRefs:
