            body: >-
              公开运营模式是带混合采集方式的典型 SaaS 控制平面。AWS 和 CubeAPM 都称 LogicMonitor 采用 collector 架构：collector 在客户环境内运行，通过标准协议和 API
              收集遥测，再转发到 LogicMonitor 托管平台。这既支持快速上线和广泛设备覆盖，也避免客户自行运行完整的可观测性后端。但它也带来明确依赖：本地 collector 部署、出站网络可达性、云服务商 API
              和管理平面持续可用性都是生产设计的一部分。Azure 专属资料显示部分云场景不止是仪表盘可见性，但审阅的资料没有公开扩展基准、参考架构或 SLA / 状态证据，投资人无法据此高置信度判断可靠性。
