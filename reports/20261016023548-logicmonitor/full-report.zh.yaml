  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、叠加层与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不只是“其他监控工具”。LogicMonitor 处在三类买方选择的交汇处。第一类是能替代大部分技术栈的直接混合可观测性竞争者，尤其是 Dynatrace 和 Datadog；第二类是
              BigPanda 这类 AIOps 叠加产品，假定买方保留现有遥测工具，主要需要关联分析、事件分流和变更风险智能；第三类是替代方案，包括 Splunk
              式以日志为中心的运维栈、传统自管工具和内部自建路径。后者保留控制权，却把更多调优、集成和运维负担推回客户。关键在于，LogicMonitor 很少靠单一功能取胜；只有当买方看重广泛混合覆盖、较低 agent
              摩擦，并希望用足够自动化整合工具而不围绕深度埋点重建资产时，它才更有胜算。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP010
              - CP014
              - CP016
