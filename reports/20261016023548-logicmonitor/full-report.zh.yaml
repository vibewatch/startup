      - number: '3.3'
        title: 定价、分销与切换成本塑造交易结果
        blocks:
          - type: paragraph
            body: >-
              同行之间的公开定价透明度有限，但现有记录仍显示出明显的买方取舍。LogicMonitor 少见地公布 Signature 层级标价，便于采购测算成本，却也让 AIOps
              溢价变得直接。应用性能对收入至关重要时，Dynatrace 和 Datadog 能支撑更高支出，但会带来更多埋点或用量治理负担。BigPanda
              的定制定价和数周上线周期，只有客户坚持保留既有工具时才更容易合理化。渠道和 MSP 取向同样重要：LogicMonitor 官方叙事比 Dynatrace 或 BigPanda
              的直接对比资料更强调合作伙伴、MSP 和混合资产运维。切换成本因此是双向的：LogicMonitor 能替代碎片化监控栈，也可能被更深的应用平台、保留既有工具的叠加层或低成本内部构建替代。
            claimRefs:
              - CP006
              - CP008
              - CP011
              - CP012
              - CP014
              - CP015
