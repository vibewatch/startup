schemaVersion: report-v2
artifact: customers
slug: altruist
runDate: 2026-10-18
company:
  name: Altruist
chapter:
  number: 6
  title: Customers
  summary: >-
    Altruist's direct customer is the independent advisory firm rather than the end investor, and the public record shows
    meaningful adoption growth from early traction with smaller and breakaway RIAs toward larger advisory practices. The
    evidence is directionally strong on adoption counts and named logos, but weak on durability because the assigned public
    source pool does not disclose NRR, GRR, churn, renewal, or customer concentration.
sections:
  - id: customer-base-and-segment-fit
    title: Customer base and segment fit
    body: >-
      The evidence consistently shows Altruist selling first to RIAs and their operations teams, not directly to retail
      investors. The customer pitch is a vertically integrated custody-plus-software stack that reduces paperwork,
      onboarding friction, and multi-vendor sprawl for advisory firms, while still exposing a branded digital experience to
      end clients. The early fit appears strongest with smaller firms, breakaway advisors, and firms willing to move custody,
      because Altruist's value proposition improves when billing, trading, reporting, and account opening live inside one
      operating environment. Public comparison material also suggests that multi-custodian enterprises may still need a
      custodian-neutral system of record, which limits how much of the market can adopt Altruist as a full-stack replacement
      without a migration program.
    claimRefs: [CU001, CU006, CU010]
    tableRefs: [TU001]
  - id: adoption-proof-and-named-deployments
    title: Adoption proof and named deployments
    body: >-
      Public adoption proof is strongest at the top of the funnel and in selected named deployments. In 2023 Altruist
      disclosed over 1,700 RIA firms on platform and said it was adding 40 to 50 firms each month; a later 2023 trade
      report cited 3,300 RIAs on platform; and Forbes reported 6,500 advisors on platform in August 2026. Those figures do
      not use a consistent denominator, so they show momentum more clearly than they show exact customer economics. Named
      customer proof is also partial rather than exhaustive: MDRN Capital appears in a company-issued product launch
      testimonial, while Forbes names Ritholtz Asset Management and Bryn Mawr Trust Advisors as customers. That is enough to
      show live market acceptance, but not enough to prove renewal quality or deployment depth across the installed base.
    claimRefs: [CU002, CU003, CU004, CU005, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion-signals
    title: Durability and expansion signals
    body: >-
      Altruist's expansion story is easier to verify than its retention story. The company and trade press frame current
      product expansion around winning larger advisory relationships and helping existing firms serve more end households:
      the 2026 launch of alternatives, margin, options, and faster money movement is positioned as a way for advisors to
      broaden what they can offer clients, and Financial Planning reported a deliberate push into firms managing $100
      million to $1 billion. The AI positioning reinforces the same land-and-expand thesis by arguing that firms can handle
      more client work without proportional headcount growth. What remains missing is customer durability evidence specific
      to Altruist itself; the assigned source pool offers no disclosed NRR, GRR, renewal, or cohort behavior for advisor
      customers.
    claimRefs: [CU007, CU011, CU013]
  - id: procurement-and-concentration-risks
    title: Procurement and concentration risks
    body: >-
      The main customer-side risks are implementation friction, ownership transition risk, and missing concentration data.
      Public comparison work emphasizes that moving to Altruist is fundamentally a custody migration, which means ACATs,
      new account setup, and client communication rather than a simple software toggle. That makes the product more
      attractive to greenfield or breakaway advisors than to incumbent multi-custodian enterprises. The pending Vanguard
      acquisition can strengthen distribution and balance-sheet confidence, but it also creates a procurement question for
      advisors that value platform independence and need clarity on post-close roadmap continuity. Because public materials
      in this pool do not disclose top-customer mix, channel concentration, or revenue by cohort, the concentration question
      remains a diligence gap rather than a cleared risk.
    claimRefs: [CU010, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Breakaway and smaller RIAs
        - Buyer/payer = RIA firm owner; user = advisor + ops; end client sees onboarding/app
        - Replace fragmented custody, onboarding, billing, and reporting workflows
        - Early traction came from new entrants and smaller accounts; 2023 platform count exceeded 1,700 firms
        - Greenfield customer acquisition where custody can move with lower incumbent lock-in
        - Current share of revenue by small-firm cohort is not disclosed
      - - Mid-sized RIAs ($100M-$1B AUM target)
        - Buyer = firm leadership/operations; user = advisor teams
        - Upgrade legacy custodian stack with more complete workflow and product breadth
        - Financial Planning said Altruist aimed to broaden into firms managing $100M-$1B
        - Higher ACV and larger-wallet accounts if upmarket motion holds
        - Public win-rate, conversion, and renewal data for this segment are not disclosed
      - - Multi-custodian / enterprise-style firms
        - Buyer = COO / operations lead; user = ops + reporting teams
        - Use Altruist custody while keeping an external system of record such as Orion
        - USTech said Altruist fits best when a firm is willing to move assets, while multi-custodian firms may still need neutral software
        - Expansion path into more complex firms without replacing every workflow at once
        - Attach rate and post-implementation satisfaction for this hybrid model are not public
      - - Advisors selling broader client capability
        - Buyer = growth-oriented advisory firm; user = advisor + client service team
        - Add alternatives, margin, options, faster money movement, and AI-enabled workflow support
        - 2026 launches positioned these capabilities as ways to win clients and scale service
        - Cross-sell and upsell motion inside existing firms plus appeal to larger advisory relationships
        - Public data does not show how much of the installed base actually adopts these add-on surfaces
    notes: >-
      Segment boundaries are synthesized from mixed official and third-party descriptions; public sources do not disclose
      customer counts or revenue by segment, so the table should be read as fit-and-motion analysis rather than a closed
      customer census.
    claimRefs: [CU001, CU006, CU007, CU010, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Platform breadth
        - Over 1,700 RIA firms using the platform; 40-50 new firms per month
        - "2023"
        - WealthManagement.com interview with Jason Wenk
        - Medium
        - Shows credible early traction after self-clearing launch
        - Firms disclosed, but not advisors, households, or revenue retention
      - - Platform breadth
        - 3,300 RIAs on platform
        - "2023"
        - Financial Planning funding report
        - Medium
        - Suggests sharp expansion later the same year and stronger distribution
        - RIAs are not directly comparable to advisors, accounts, or paying firms
      - - Platform breadth
        - 6,500 advisors on platform
        - "2026-08-26"
        - Forbes acquisition report
        - High
        - Indicates much larger installed base by 2026
        - Advisors are not the same denominator as firms or client households
      - - Named deployment proof
        - Ritholtz Asset Management and Bryn Mawr Trust Advisors named as customers
        - "2026-08-26"
        - Forbes acquisition report
        - High
        - Shows adoption by recognizable advisory firms, not just anonymous logos
        - No disclosed deployment scope, revenue value, or renewal depth
    notes: >-
      The public record mixes firms, RIAs, and advisors rather than using one denominator, so the trajectory is best read
      as directional adoption momentum instead of a clean cohort analysis.
    claimRefs: [CU002, CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - MDRN Capital
        - Independent advisory firm
        - Uses Altruist's new alternatives workflow inside advisor operations
        - Appears live feature usage, but disclosed only in a company-issued launch release
        - Customer quote says work that took hours now takes minutes
        - No independent confirmation, baseline volume, or renewal evidence
      - - Ritholtz Asset Management
        - Independent RIA
        - Named by Forbes as an Altruist customer
        - Customer status appears active; production scope is not disclosed
        - Independent publication confirms customer name
        - No disclosed use case, duration, or quantified operating outcome
      - - Bryn Mawr Trust Advisors
        - Advisory / trust-oriented wealth firm
        - Named by Forbes as an Altruist customer
        - Customer status appears active; production scope is not disclosed
        - Independent publication confirms customer name
        - No disclosed wallet share, workflow depth, or retention signal
    notes: >-
      This is a sample of publicly named customers rather than an exhaustive roster. The pool contains one company-issued
      testimonial and one independent article naming customers, so production depth and outcome quality remain only
      partially verified.
    enumerationScope:
      coverage: sample
      basis: Publicly named customers and quoted deployments visible in the assigned 2026 source pool only.
    claimRefs: [CU008, CU009, CU012]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Altruist's customer motion starts with RIAs seeking lower-friction custody operations and expands only after a firm
      is willing to migrate assets and trust roadmap continuity.
    data:
      nodes:
        - label: Breakaway / smaller RIA evaluates the stack
          actor: Founder, COO, or operations lead
          stage: Acquisition
          channel: Sales demo + diligence
          detail: Early traction was strongest with new entrants, breakaways, and firms prioritizing operational simplicity.
          note: The initial fit is strongest where custody can move and incumbent integrations are lighter.
          tone: positive
        - label: Custody migration and digital onboarding
          actor: Advisor + operations team
          stage: Onboarding
          channel: Account opening, ACATs, billing, reporting
          detail: The value proposition improves when onboarding, trading, and reporting move into one custodian-led workflow.
          note: Switching custodians is still the biggest practical hurdle in adoption.
          tone: neutral
        - label: Day-to-day advisory workflow consolidation
          actor: Advisor, client service, and operations
          stage: Core use
          channel: Web/mobile operating platform
          detail: Altruist aims to replace multiple point solutions with one operating environment for RIAs.
          note: Multi-custodian enterprises may still keep a separate system of record.
          tone: positive
        - label: Product expansion to serve larger or broader books
          actor: Growth-oriented advisory firm
          stage: Expansion
          channel: Alternatives, margin, options, money movement
          detail: New 2026 features are positioned as tools to help firms win more clients and move upmarket.
          note: Public data does not quantify attach rates by cohort.
          tone: positive
        - label: AI-enabled engagement and retention pitch
          actor: Advisor and client service teams
          stage: Expansion
          channel: AI workflow + personalization
          detail: The company markets AI as a way to scale client service and reduce manual work.
          note: Public retention claims are industry benchmarks, not Altruist-specific renewal proof.
          tone: neutral
        - label: Ownership and procurement review
          actor: Investment committee or enterprise buyer
          stage: Risk check
          channel: Procurement / legal diligence
          detail: The Vanguard transaction can add distribution and capital support but requires advisors to underwrite roadmap continuity.
          note: Public materials do not yet close the loop on post-acquisition customer retention or concentration.
          tone: risk
    approximationNotes: >-
      Stage order is analytical rather than measured; the figure summarizes the observed customer motion and friction points
      from the assigned source set.
    claimRefs: [CU001, CU006, CU007, CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Public adoption proof is real but denominator-messy
    body: >-
      The assigned pool gives credible traction data and named customers, but it alternates between firms, RIAs, and
      advisors, so the growth story is clearer than the exact installed-base economics.
    claimRefs: [CU002, CU003, CU004, CU005]
  - calloutType: risk
    title: Durability is still under-documented
    body: >-
      Altruist's public 2026 customer narrative emphasizes feature breadth and workflow speed, yet the pool does not disclose
      NRR, GRR, churn, renewal, or contract-duration evidence for advisory customers.
    claimRefs: [CU011, CU013]
  - calloutType: risk
    title: Ownership change can slow procurement
    body: >-
      Advisors evaluating a custodian migration now have to diligence the pending Vanguard close and decide whether
      long-term platform independence still matters to their operating model.
    claimRefs: [CU010, CU012]
