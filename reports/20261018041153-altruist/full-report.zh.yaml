      - 用例
      - 规模证据
      - 收入 / 战略价值
      - 缺口
    rows:
      - - 转型出走型和较小 RIA
        - 买方 / 付费方 = RIA 公司所有者；用户 = 顾问 + 运营；终端客户看到开户 / 应用
        - 替代割裂的托管、开户、计费和报告工作流
        - 早期增长来自新进入者和较小账户；2023 年平台公司数量超过 1,700 家
        - 在托管可以迁移且现有机构锁定较弱的情况下获取新客户
        - 小公司客户群当前收入占比未披露
      - - 中型 RIA（目标 AUM $100M-$1B）
        - 买方 = 公司领导层 / 运营；用户 = 顾问团队
        - 用更完整的工作流和更广的产品覆盖升级传统托管技术栈
        - Financial Planning 称 Altruist 计划拓展至管理 $100M-$1B 的公司
        - 如果向高端市场推进成立，可获得更高 ACV 和更大钱包
        - 该分层的公开赢单率、转化率和续约数据未披露
      - - 多托管 / 企业式公司
        - 买方 = COO / 运营负责人；用户 = 运营 + 报告团队
        - 使用 Altruist 托管，同时保留 Orion 等外部系统记录
        - USTech 称，当公司愿意迁移资产时 Altruist 最合适；多托管公司可能仍需要中立软件
        - 不必一次替换所有工作流，也能向更复杂的公司拓展
        - 这种混合模式的附加率和实施后满意度没有公开
      - - 销售更广客户能力的顾问
        - 买方 = 以增长为导向的咨询公司；用户 = 顾问 + 客户服务团队
