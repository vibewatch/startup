      - CU001
      - CU006
      - CU007
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 主要风险剩余敞口矩阵
    type: matrix
    summary: 最大的剩余敞口同时具备较高潜在影响，且公开缓解措施只是有明确表述，尚未在指定证据中得到独立验证。
    data:
      columns:
        - label: 影响
          detail: 公开业务和交易证据支持的后果
        - label: 缓解措施成熟度
          detail: 指定公开来源中可见的缓解措施强度
        - label: 剩余敞口
          detail: 只考虑这些公开缓解措施后仍然存在的敞口
      rows:
        - label: 收购批准与自主性
          note: 2026 年 8 月的描述称交易须获批准
          values:
            - label: 高
              detail: 交易失败或大幅延迟会改变所有权和融资假设
            - label: 已表述
              detail: 公开承诺保持独立领导、品牌和运营模式
            - label: 高
              detail: 指定证据中没有交割证明和交割后的行为证据
        - label: 托管与工作流整合的连续性
          note: 自营清算托管和多项顾问工作流共享一个平台
          values:
            - label: 高
              detail: 控制失效可能影响托管和多个运营工作流
            - label: 公开证据有限
              detail: 可以看到被点名的控制负责人，但没有指定独立控制材料包
            - label: 高
              detail: 韧性、检查和事故证据仍是尽调缺口
        - label: 经济性与收购溢价
          note: 变现渠道多元，但缺少经审计的分项和利润率数据
          values:
            - label: 高
              detail: 经济性较弱会削弱相对 2025 年估值的大幅上调
            - label: 资本支持
              detail: 公司报告累计融资超过 $600 million
            - label: 高
              detail: 融资历史无法证明利润率、烧钱速度或现金可用性
        - label: 顾问留存与集中度
          note: 顾问规模已公开，但队列持久性和经济集中度尚未公开
          values:
            - label: 中高
              detail: 留存或集中度较弱会降低收入的持续性
            - label: 仅有点名证明
              detail: 公开证据包括顾问数量和公司发布的 Lifeworks 部署案例
            - label: 中高
              detail: 独立的留存和集中度队列数据仍不可得
        - label: 客户证言证据质量
          note: Altruist 披露的收益可能影响部分为其站台的顾问
          values:
            - label: 中
              detail: 有偏的推荐可能扭曲采购和投资判断结论
            - label: 已披露
              detail: 公司明确说明了利益冲突和证言局限
            - label: 中
              detail: 仍需独立复现结果
        - label: 收购整合治理
          note: Vanguard 在本次交易前已解决其上一笔金融科技收购引发的诉讼
          values:
            - label: 中
              detail: 再次出现整合争议可能扰乱领导层和执行
            - label: 仅有和解
              detail: 前案已经结束，但和解条款未披露
            - label: 中
              detail: 流程经验和针对 Altruist 的保护措施需要查阅文件
    approximationNotes: 定性分类总结引用事实和明确的证据缺口；它们不是数值概率、独立审计的控制评级或风险价值估计。
