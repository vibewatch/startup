      - number: '1.3'
        title: 融资、规模与商业模式
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Altruist 的私募融资历史规模可观，但仍部分不透明。Altruist 称累计融资超过 $600 million，2025 年 Series F 融资 $152 million，估值 $1.9
              billion。行业报道补充称，此前未披露的 $110 million Series C 于 2021 年 11 月完成，2023 年 Series D 又融资 $112 million，使当时披露的累计融资约为
              $290 million。公司和 Forbes 还描述了一套超越软件订阅的变现模式：Altruist 从闲置现金、证券借贷、执行费和高级工具中获利，同时用整合式软件降低 RIA
              的运营成本。规模趋势较强，但并非一套经过审计的指标。官网称有 6,000+ 名顾问使用 Altruist；Forbes 称截至 2026 年 8 月平台上有 6,500 名顾问；AdvizorPro 2026 年
              10 月的 RIA 数据集中，则显示多家在 Altruist 披露了数亿美元 AUM 的公司。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO012
              - CO014
              - CO015
      - number: '1.4'
        title: 里程碑、风险与未决缺口
        blocks:
          - type: paragraph
            body: >-
              公司近期里程碑展现的是一连串快速的战略动作，而非稳定态运营图景。2023 年，管理层将 Series D 融资与收购 Shareholders Service Group 以及推出自营清算托管商联系起来；2026
              年，Forbes 突出报道 Hazel，这项 AI 税务规划产品计划扩展到相邻的规划工作流。现在的问题不再主要是 Altruist 是否有产品势头，而是这些势头在 Vanguard
              旗下如何转化。InvestmentNews 指出，这笔交易发生在 Vanguard 先前收购 Just Invest
              相关诉讼和解之后，因此需要提高对收购经济、整合护栏、治理和留任计划的尽调标准。指定来源池没有披露当前确切收入、员工数或交割后的资本表/控制结构，因此这些仍是重大的尽调缺口，不能自行推断成事实。
