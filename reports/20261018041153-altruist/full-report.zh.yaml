              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
      - number: '7.4'
        title: 公开缓释是有用信号，不是尽调替代品
        blocks:
          - type: paragraph
            body: >-
              来源集合支持一组可监测触发器。交易方面，跟踪审批里程碑、交割时间、领导层留任以及独立运营模式是否变化。运营方面，要求对托管、网络安全、业务连续性、交易执行、对账和事故响应进行独立保证。客户方面，应区分公司发布的已点名引用与独立验证的留存、集中度和服务质量
              cohort。Altruist
              自己披露，部分推广顾问获得了可能影响见证内容的利益，因此应核验结果，而不是直接否定这些材料。如果交易失败、独立控制明显削弱、出现未解决的资产保护或执行故障、经审计经济显示利润率结构性偏弱或持续依赖资本，或留存与集中度数据显示的脆弱性与公开规模叙事不符，就应停止投资或重新判断。
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 主要论点失效触发器
            body: 如果收购失败或明显延迟、独立运营承诺发生变化，或托管与执行控制暴露出未解决的重大缺陷，应立即重新判断。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR014
          - type: callout
            title: 必要尽调材料
            body: 在把公开缓释视为投资级证据前，应要求交割证明、经审计财务报表、完全稀释资本表、独立控制报告、事故和监管检查历史，以及客户留存与集中度 cohort。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开价格背景显示战略溢价，但不足以支撑完整投资判断
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开估值锚点是 Altruist 2025 年 4 月 Series F 轮约 $1.9 billion 的估值，以及独立媒体将 2026 年 8 月宣布的 Vanguard 收购价格放在约
              $4.0-$4.6 billion。估值跃升显示了真实的战略稀缺性：Altruist 已建立垂直整合的 RIA 托管系统，仍在增加顾问，并为 Vanguard
              提供了控制工作流而非简单分销基金的入口。公开记录没有提供的内容同样重要。买卖双方没有披露确切价格，Altruist
              没有公布当前年度收入或毛利率，公开来源也没有显示当前托管资产规模或股权结构表及优先股堆叠。因此，标题式溢价是战略价值的证据，但不足以支持精确的独立倍数判断，或在传闻收购价格上做出新的买入建议。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV016
      - number: '8.2'
        title: 因运营证明跑在估值透明度之前，建议保持跟踪
        blocks:
          - type: paragraph
            body: >-
              公开运营证明足以支持建设性基准情景。公司和第三方来源显示，Altruist 从 2025 年 4 月的 4,700 多名顾问扩展到 2026 年 8 月的 6,500
              名顾问，正在进入更大的公司，并通过多条与工作流相关的收入流变现，而不是只收一项软件费。客户证据和此前融资报道也显示，市场确实需要一种比老牌托管商摩擦更低、整合程度更高的替代方案。即便如此，对新投资者而言，情景分化仍不对称。乐观情景要求
              Vanguard
              按报道条款完成交易，且私有尽调证明战略溢价背后存在持久经济。基准情景假设交易完成，但公开证据仍不足以支持除交易本身之外的额外上行空间。悲观情景则是价格重估或交割延迟，暴露出当前估值有多大程度依赖战略买方意愿，而非公开财务产出。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV016
      - number: '8.3'
        title: 最终尽调应聚焦经济、条款与交易脆弱性
        blocks:
          - type: paragraph
            body: >-
              最有价值的尽调问题，是能把当前的战略胜利标题转化为可投资回报逻辑的问题。第一，投资人需要 2024-2026
              年经审计或达到董事会级别的收入、毛利率、净收入留存和托管资产数据，检验工作流深度是否转化为持久的盈利质量。第二，需要当前股权结构表、优先股堆叠、投资人权利及任何合并同意机制，以理解不同交割价格下谁受益。第三，需要合并协议、监管条件，以及可能改变时间或经济结果的客户或平台契约。主要论点失效触发器是交割延迟或价格重定、私有尽调显示变现质量弱于顾问增长叙事所暗示的水平，或治理/整合问题削弱
              Altruist 在 Vanguard 旗下的开放平台定位价值。
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议：跟踪
            body: 公开证据支持战略质量和现有持有者可能实现价值创造的退出，但不足以支持在报道的收购价格上给出新的买入建议。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV016
          - type: callout
            title: 判断的主要风险
            body: 当前标题估值最终可能更多依赖 Vanguard 特有的协同效应和交易确定性，而不是外部投资人可见的独立经济。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV010
