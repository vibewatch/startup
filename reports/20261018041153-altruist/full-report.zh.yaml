  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可站得住脚的市场边界，是面向独立 RIA 的合规托管和自营清算经纪，以及依托托管记录的开户、交易、投资组合管理、计费、报告和再平衡工作流。除非通用
              CRM、规划软件、零售自主经纪、基金制造和泛消费者咨询产品直接接入 RIA 托管工作流，否则都不属于这一边界。这个边界反映了 Vanguard、Forbes 和 InvestmentNews 对 Altruist
              的描述，而不是把每一笔财富科技支出都视为可触达市场。现状替代方案是大型老牌托管商，加上分散的运营工具和人工交接。因此，Altruist 的主张是整合托管与运营系统，而不只是再做一个顾问应用。公司称可以服务 AUM
              从 $1 million 到 $1 billion 的公司，但这一区间是公司自述，不是独立测量的可服务市场。
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: 受证据约束的规模与渗透率
        blocks:
          - type: paragraph
            body: >-
              最有力的广义视角来自 Forbes 的报道：独立 RIA 管理着 $10 trillion 的美国资产。但这描述的是渠道资产，不是年度托管或软件收入。另一项由 US Tech Automations 归因于
              AdvizorPro 的备案存在度比较，覆盖 15,722 家报告至少有一家独立管理账户托管商的 RIA，显示 Schwab 的存在度为 67.8%，Altruist 为 7.4%。该比较还称，88% 的
              Altruist 关联 RIA 管理的 AUM 低于 $100 million，其中位 AUM 为 $17 million；Schwab 关联公司的对应数字为 $107
              million。这些数据显示其偏向小公司并已建立采用据点，但一家机构可以列出多家托管商，因此备案存在度既不是客户资产份额，也不是收入份额。Schwab $5.7 trillion、Fidelity 约 $1.5
              trillion 的老牌托管规模进一步凸显集中度挑战。这些分母无法相加成一套站得住脚的 TAM/SAM/SOM。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
