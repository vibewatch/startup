              - CO014
              - CO016
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Jason Wenk 仍是核心运营人物，也是创始人与市场契合度最清晰的来源。公司和 Forbes 的人物介绍都把 Altruist 的起源与 Wenk
              建立顾问公司的经历，以及他对纸张繁重、摩擦高的托管流程的不满联系起来。除 Wenk
              外，公开领导层信息主要覆盖当前职能，而非详细履历：公司列出了运营与合规、产品、财务、法务、安全、客户成功、销售、工程和企业业务负责人。治理也与投资人基础紧密相连。Vanguard 前 CEO Bill
              McNabb 任 Altruist 董事；已披露的董事和投资人则将公司与 Venrock、Insight Partners、Declaration Partners、ICONIQ 和 GIC
              联系起来。即使首日管理层连续性得以保留，这种集中度也使交割后董事会结构和少数股东保护成为重要尽调事项。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
