chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与平台
        blocks:
          - type: paragraph
            body: >-
              Altruist 于 2018 年成立，总部位于加州 Culver City。从官网、关于页面到 Vanguard 的收购公告，公司始终把自己定位为面向独立顾问、以 AI
              为先的托管商和财富平台：将自营清算经纪基础设施与开户、交易、投资组合管理、计费和报告整合到同一套系统。这个整合定位很关键，因为它既支撑公司相对传统托管商的差异化，也构成 Vanguard
              宣布收购它的逻辑。2026 年 8 月 26 日宣布的最终收购协议意味着 Altruist 仍处于待交割状态：管理层称公司预计会保持独立运营，领导层和品牌不变，但截至审阅来源，购买价格尚未披露，监管审批仍未完成。
            claimRefs:
              - CO001
              - CO002
              - CO003
