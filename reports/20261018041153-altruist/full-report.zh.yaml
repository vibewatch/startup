companyProfile:
  summary: >-
    Altruist 是一家垂直整合、自营清算的 RIA 托管商和顾问软件平台，2018 年创立于 Culver City。公司把开户、交易、投资组合管理、计费、报告和新近的 AI
    工作流工具整合到同一套系统，顾问规模已达数千人；目前已与 Vanguard 签署最终收购协议，在交割前仍独立运营。公开来源支持其平台逻辑和采用势头，但确切收入、利润率以及交割后的治理经济仍不透明。
