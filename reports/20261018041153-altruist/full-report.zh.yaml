              - CM014
              - CM015
      - number: '2.3'
        title: 买方、采用路径与增长驱动
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是掌握托管商选择权的 RIA 主理人或运营负责人；顾问和运营人员是日常用户，顾问公司负责付费。创始人主导的小公司与其最匹配：备案比较显示，大多数 Altruist 关联 RIA 的 AUM 低于
              $100 million；Altruist 自有材料则强调减少开户和持续服务中的人工工作及供应商数量。Vanguard
              将宏观驱动描述为咨询需求相对顾问产能过剩，因此当自动化让同一团队服务更多客户时，经济价值就会显现。Forbes 报道称 2026 年 8 月平台上有 6,500 名顾问；Altruist 则称 Hazel 自
              2025 年 9 月发布以来已被 1,000 多名财富管理人使用。这是不同人群，不能合并，但两者分别显示核心平台采用和相邻生产力工具的附着。
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 约束、控制权变化与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用 Altruist 要求 RIA 把客户资产、运营连续性、数据和转移执行交给一家较新的托管商，而老牌机构仍拥有大得多的规模。已签署的 Vanguard
              交易增加了资源，也带来控制权变化问题：官方公告称条款未披露，交割仍取决于监管审批，Altruist 预计保持独立运营。这种计划中的结构不等于已经完成的整合结果。InvestmentNews
              还报道，Vanguard 在其收购 Just Invest 后，因与 earnout 相关的行为指控而与创始人达成诉讼和解；和解条款未披露。这段历史不能预测 Altruist
              的结果，但在评估执行和中立性风险时属于相关反向证据。估值应基于经过验证的客户经济、定价、资产、留存和迁移 cohort 来判断，而不是把软件倍数套在 $10 trillion 的资产渠道标题数字上。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 渠道资产规模不等于收入 TAM
            body: $10 trillion 的 RIA 资产视角说明了渠道规模，但可服务收入仍取决于托管经济、软件附着、定价和可触达的公司 cohort。
            calloutType: insight
            claimRefs:
              - CM003
              - CM014
          - type: callout
            title: 控制权变化的执行仍未得到验证
            body: Vanguard 和 Altruist 宣布的是已签署的交易，而非已完成的整合；监管审批、运营独立性和顾问反应仍是未决变量。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：挑战者对阵高度集中的老牌机构
        blocks:
          - type: paragraph
            body: >
              Altruist 并非在一个分散、尚未开发的品类中竞争；它挑战的是顾问基础设施中最集中的控制点之一。AlphaPilot 报道称，仅 Schwab 托管的 RIA 资产就超过 $3
              trillion，Fidelity 约为 $1.5 trillion，前四大托管商合计控制预计 84% 的 RIA 托管资产。在这一背景下，Altruist
              的战略卖点不只是更低价格，而是不同的产品形态：一家同时拥有顾问工作流软件的自营清算托管商，而非藏在拼接式供应商堆栈下方。Investopedia 将 Altruist
              描述为传统托管平台的替代方案，与这一逻辑一致；其关于 Fidelity、Schwab 和 Pershing 调整定价模式的报道，也说明 RIA 仍愿意评估挑战者。
            claimRefs:
              - CP002
              - CP005
              - CP009
