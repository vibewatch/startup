  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 立场
      - 论点
      - 什么会改变判断
    rows:
      - - 论点
        - Altruist 的战略价值稀缺：它把自营清算托管与顾问工作流软件结合起来，顾问采用规模已经扩大，如今又处在 Vanguard 扩张财富管理基础设施的布局中。
        - 若要更积极地看待它，需要私下证据证明，即使没有战略买家，收入质量、留存和利润率结构也足以支撑溢价。
      - - 反论点
        - 据报道的收购区间可能更多反映买方特有的协同效应，而不是独立经营的经济性；公开记录仍缺少经审计收入、毛利率、股权结构表和优先股堆叠、确切交易条款等核心投资判断输入。
        - 如果合并协议、经审计运营指标和优先股堆叠显示价值可持续、并非狭隘依赖战略收购假设，更负面的判断可以缓和。
    notes: 这张表把战略稀缺性和独立投资判断分开。公开来源既支持上行叙事，也说明为何不能制造虚假的精确度。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV007
      - CV008
      - CV016
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Vanguard 接近据报道的 $4.0-$4.6 billion 区间完成收购，保留 Altruist 品牌和开放架构，且私下尽调确认收入质量强劲。
        - 现有持有人实现高于 2025 年 4 月 $1.9 billion 基准的战略溢价；上行由交易完成驱动，而不是公开市场式的重估。
        - 监管延迟、客户反弹或私下尽调结果较弱，都会压低实际价值。
        - 需要合并执行顺利，且私下财务披露提供支持。
      - - 基准
        - 交易完成，但公开证据始终没有足够细节，无法支持超出已宣布收购叙事的上行空间。
        - 结果是让现有持有人变现，而不是给外部投资者提供可重复使用的新资金投资判断框架。
        - 透明度有限，仍可能掩盖优先权结构或业绩补偿安排的复杂性。
        - 在确切价格和经济数据仍未披露时，这是最可能的情景。
      - - 悲观
        - 交割推迟、价格被重新定价，或尽调揭示的经济性更弱、条款限制更多，超出增长叙事所暗示的程度。
        - 由于溢价失去战略确定性，价值回落至上次披露的私募基准附近或以下。
        - 治理摩擦、监管审查或较弱的变现质量，可能触发重置。
        - 交割延迟、尽调访问受限或私下运营指标令人失望，都会发出这一信号。
    notes: 区间仅锚定于公开披露的标记：2025 年 4 月 $1.9 billion 私募估值，以及据报道的 2026 年 8 月交易区间。这不是完整的倍数估值模型。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV009
      - CV010
      - CV016
