  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Altruist 的客户路径从寻求更低摩擦托管运营的 RIA 开始，只有企业愿意迁移资产并相信产品路线能延续，合作才会进一步扩大。
    data:
      nodes:
        - label: 离开原机构 / 小型 RIA 评估这套栈
          actor: Founder, COO, or operations lead
          stage: Acquisition
          channel: Sales demo + diligence
          detail: 早期增长在新进入者、离开原机构的顾问团队，以及重视运营简洁性的企业中最强。
          note: 最初的匹配度在托管可以迁移、且现有集成较少的场景中最高。
          tone: positive
        - label: 托管迁移和数字化开户
          actor: Advisor + operations team
          stage: Onboarding
          channel: Account opening, ACATs, billing, reporting
          detail: 当开户、交易和报告进入同一个由托管机构主导的工作流时，价值主张更强。
          note: 更换托管机构仍是采用过程中最大的实际障碍。
          tone: neutral
        - label: 日常顾问工作流整合
          actor: Advisor, client service, and operations
          stage: Core use
          channel: Web/mobile operating platform
          detail: Altruist 试图用一个面向 RIA 的运营环境替代多个点状解决方案。
          note: 多托管企业仍可能保留独立的系统记录。
          tone: positive
        - label: 扩展产品以服务更大或更广的客户组合
          actor: Growth-oriented advisory firm
          stage: Expansion
          channel: Alternatives, margin, options, money movement
          detail: 新的 2026 年功能被定位为帮助企业赢得更多客户、向高端市场上移的工具。
          note: 公开数据没有按队列量化附加率。
          tone: positive
        - label: AI 驱动的互动与留存诉求
          actor: Advisor and client service teams
          stage: Expansion
          channel: AI workflow + personalization
          detail: 公司将 AI 包装成扩大客户服务、减少人工工作的方式。
          note: 公开留存说法是行业基准，不是 Altruist 特有的续约证明。
          tone: neutral
        - label: 所有权与采购审查
          actor: Investment committee or enterprise buyer
          stage: Risk check
          channel: Procurement / legal diligence
          detail: Vanguard 交易可以带来分销和资本支持，但顾问需要评估产品路线能否延续。
          note: 公开材料尚未说明收购后的客户留存或集中度。
          tone: risk
    approximationNotes: 阶段顺序是分析性的，不是测量结果；图表根据指定来源集总结观察到的客户路径和摩擦点。
