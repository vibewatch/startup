      - number: '3.3'
        title: Vanguard 之后的持久性：更强支持与新的独立性风险
        blocks:
          - type: paragraph
            body: >
              Vanguard 交易把竞争讨论从生存风险转为所有权风险。多个来源报道购买价格约为 $4 billion 至 $5 billion，超过 Altruist 2025
              年估值的两倍，说明买方看重的是平台的托管和软件能力，而非近期盈利。更重要的是，Vanguard 表示 Altruist
              将保持独立运营，领导层、品牌和顾问重点不变；如果公司想保留挑战者身份，这是正确的运营承诺。但尽调问题在于，RIA 长期是否会相信这一承诺。AlphaPilot
              引用的证据显示，顾问已经会增加托管商来防范宕机和并购不确定性；InvestmentNews 则显示，Vanguard 先前收购 Just Invest 后在 Altruist
              交易交割前以法律和解收场。资本和分销能力增强了，但中立性叙事更难守住。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP015
              - CP016
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 产品卖点不止是折扣托管
            body: 公开证据始终将 Altruist 描述为垂直整合的托管加软件平台；2026 年的另类资产、保证金、期权和资金流转产品发布，说明它正在扩大老牌机构必须回应的产品范围。
            calloutType: strength
            claimRefs:
              - CP001
              - CP011
              - CP012
          - type: callout
            title: 所有权可能削弱独立性优势
            body: Vanguard 保持 Altruist 独立的承诺很重要，因为 RIA 已经会同时使用多个托管商来降低对单一托管商的依赖；而 Vanguard 近期整合咨询科技收购的历史，也留下了值得怀疑的空间。
