      - number: '3.2'
        title: 差异化与购买标准
        blocks:
          - type: paragraph
            body: >
              最清晰的公开差异化证据是垂直整合和持续的功能扩展。Altruist
              自有材料和第三方报道都将公司描述为把自营清算托管与开户、交易、投资组合管理、计费和报告整合到一套系统中。这一点重要，因为顾问的公开评论仍在强调老旧、多供应商设置中的运营拖累。公开的产品包装也强化了这一点，但还不足以完全证明当前已实现的经济效益：Investopedia
              报道早期低价入口为前 100 个客户免费开户，之后每个账户每月 $1；Altruist 2026
              年产品发布则增加了私募市场访问、保证金、期权和更快的资金流转，并称合作基金上线时不收托管费。其核心信息是：Altruist 试图靠压缩工作流步骤和扩展产品范围取胜，而不是提供狭窄的单点方案。
            claimRefs:
              - CP001
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
