      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 整合式平台仍是核心战略资产
            body: 公开记录中最稳定的主线不是某一轮融资或某一次功能发布，而是反复出现的主张：Altruist 为 RIA 将托管、清算和顾问软件整合到一套工作流系统中。这也是 Vanguard 实际上要买下的能力组合。
            calloutType: insight
            claimRefs:
              - CO002
              - CO010
              - CO012
          - type: callout
            title: 控制权变更尽调比再看一次产品演示更重要
            body: 产品势头清晰可见，但尽调重点已经转向已签署、尚未交割的收购：购买价格、少数投资人待遇、交割后治理和留任方案，在指定公开来源池中仍严重披露不足。
            calloutType: risk
            claimRefs:
