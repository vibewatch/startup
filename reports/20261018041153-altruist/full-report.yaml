      - number: '4.2'
        title: Public traction is strong, but unit economics stay mostly private
        blocks:
          - type: paragraph
            body: >-
              The public footprint suggests real distribution fit with smaller RIAs, but it does not close the
              unit-economics case. Altruist's official materials say 6,000+ independent advisors use the platform and
              that the number of RIAs served grew 112% year over year. Winthrop cited FINTRX data showing 1,341 RIA
              firms on the platform, including 706 sole-custody relationships, and described the user base as skewing
              heavily toward one-to-five-person firms. Operational-efficiency proxies are directionally positive rather
              than fully financial: company pages claim onboarding up to 91% faster, under-60-second support response
              times, and 96% support satisfaction, while Forbes reported new-investor onboarding can take less than two
              minutes versus 30 to 60 minutes on incumbent platforms. Financial Planning also reported that Altruist
              nearly tripled AUM in 2022 and grew revenue by more than 1,700% year over year, but attributed both
              figures to the company. None of the public sources disclose CAC, sales-cycle length, payback, churn, NRR,
              gross margin, or service cost per advisor cohort.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.3'
        title: Capital access looks strong, but underwriting still hinges on private data
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence suggests Altruist has been able to raise and reprice capital aggressively, but
              those milestones are not substitutes for current cash-on- hand or runway. The 2023 Series D announcement
              said Altruist raised $112 million and brought total funding at that point to approximately $290 million,
              while the current company profile says Altruist later closed a $152 million Series F in 2025 at a $1.9
              billion valuation and had raised more than $600 million by 2026. Independent reporting then put Vanguard's
              announced 2026 acquisition at roughly $4.0 billion to $4.6 billion. That history lowers immediate
              survival-risk optics, but it does not answer how much cash remains, what gross margins look like after
              self-clearing and service delivery, or whether post-close capital allocation will prioritize
              advisor-facing roadmap velocity. The owner-transition risk is not theoretical: InvestmentNews reported
              Vanguard settled Just Invest shareholder litigation on July 29, 2026, weeks before the Altruist
              announcement, reinforcing the need to diligence governance, integration incentives, and control over
              realized monetization.
            claimRefs:
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public evidence supports breadth, not revenue quality
            body: >-
              The retained sources make the monetization stack legible, but none discloses audited revenue recognition,
              realized take rates, gross margin, or attach-rate mix, so public evidence cannot underwrite revenue
              quality on its own.
            calloutType: insight
            claimRefs:
