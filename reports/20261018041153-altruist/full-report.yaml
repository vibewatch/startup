        - id: monetization
          label: Monetization breadth
          detail: Idle cash, securities lending, execution, and premium tools.
        - id: evidence-gaps
          label: Missing underwriting inputs
          detail: No public revenue, gross margin, current AUC, exact price, or cap-table terms.
        - id: recommendation
          label: Recommendation
          detail: Track; do not underwrite fresh capital at the headline price from public evidence alone.
