  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence points to a layered advisor operating stack: workflow applications on top of self-clearing
      custody, with newer AI and migration tooling widening the product surface.
    data:
      layers:
        - label: Advisor workflow surface
          detail: Customer-facing workflow layer covering onboarding, trading, reporting, billing, and client experience.
          modules:
            - label: Digital account opening
            - label: Trading + rebalancing
            - label: Reporting + billing
        - label: Client and household experience
          detail: Extends the advisor system of record into ongoing client servicing and communication.
          modules:
            - label: Client mobile / web experience
            - label: Beneficiary and household views
        - label: AI and analytics layer
          detail: Hazel uses live custodial context to automate analysis and advisor follow-up work.
          modules:
            - label: Concentration analysis
            - label: Exposure / beneficiary summaries
            - label: Meeting prep + email drafting
            - label: Firm-wide AI reporting
        - label: Migration and integration layer
          detail: Implements customer transitions and third-party connectivity around the custody core.
          modules:
            - label: ACAT migration workflow
            - label: Integration suite
            - label: Onboarding documentation
        - label: Self-clearing + operations core
          detail: Public and partner evidence points to owned clearing workflows plus middle-office support tooling.
          modules:
            - label: Brokerage custody + clearing
            - label: Cashiering + background screening
            - label: Customer-care middle office
        - label: Infrastructure and controls
          detail: >-
            Disclosed controls are narrower than the product surface and still rely heavily on company and partner
            testimony.
          outputs:
            - label: TLS 1.2+ encryption
            - label: Zero-retention model-provider arrangements
            - label: Monitoring + performance tooling
    approximationNotes: >-
