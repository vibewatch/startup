              - CP005
              - CP008
              - CP009
              - CP011
              - CP015
      - number: '3.2'
        title: Differentiation and buying criteria
        blocks:
          - type: paragraph
            body: >
              The clearest public evidence of differentiation is vertical integration plus ongoing feature expansion.
              Across Altruist's own materials and third-party coverage, the company is described as combining
              self-clearing custody with account opening, trading, portfolio management, billing, and reporting in one
              stack. That matters because public commentary from advisors continues to emphasize operational drag in
              legacy and multi-vendor setups. Public packaging signals reinforce the point without fully proving current
              realized economics: Investopedia reported an early low-cost entry offer of free accounts for the first 100
              clients and $1 per account monthly thereafter, while Altruist's 2026 product launch added private-market
              access, margin, options, and faster money movement and said partner funds launched with no custody fees.
              The message is that Altruist is trying to win by collapsing workflow steps and extending product scope,
              not by offering a narrow point solution.
            claimRefs:
              - CP001
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.3'
        title: 'Durability after Vanguard: stronger backing, new independence risk'
        blocks:
          - type: paragraph
            body: >
              The Vanguard transaction changes the competitive debate from survival risk to ownership risk. Multiple
              sources reported a roughly $4 billion to $5 billion purchase price, more than double Altruist's 2025
              valuation, which implies buyers value the platform's custody and software capability rather than near-term
              profitability. Just as important, Vanguard said Altruist will remain a standalone business with its
              leadership, brand, and advisor focus intact, which is the right operating promise if the company wants to
              preserve its challenger identity. But the diligence question is whether RIAs will believe that promise
              over time. AlphaPilot cited evidence that advisors already add custodians to hedge outages and merger
              uncertainty, and InvestmentNews showed that Vanguard's earlier Just Invest acquisition ended in a legal
              settlement before the Altruist deal closed. Capital and distribution improve, but the neutrality narrative
              becomes harder to defend.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The product pitch is broader than discount custody
            body: >-
              Public evidence consistently presents Altruist as a vertically integrated custody-plus-software platform,
              and the 2026 alternatives, margin, options, and money-movement launch suggests it is widening the surface
              area on which incumbents must respond.
            calloutType: strength
            claimRefs:
              - CP001
              - CP011
              - CP012
          - type: callout
            title: Ownership could blunt the independence advantage
            body: >-
              Vanguard's promise to keep Altruist standalone matters because RIAs already multi-home to reduce
              dependence on any one custodian, and Vanguard's recent history integrating advice-tech acquisitions leaves
              some room for skepticism.
            calloutType: risk
            claimRefs:
              - CP006
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Blended custody economics, with only partial list pricing visible
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Altruist behaving less like a pure workflow SaaS vendor and more like a
              vertically integrated custodian that monetizes both platform usage and balance-sheet activity. Forbes
              reported that the company earns interest on idle cash, securities-lending fees, trading-execution fees,
              and premium-tool revenue, while Altruist's own disclosures say it also earns revenue from advisors who use
              its software and from assets handled through its broker-dealer and RIA affiliates. Public pricing
              visibility remains incomplete: a 2023 company release framed reporting, billing, rebalancing, portfolio
              accounting, and the client portal as included at no additional cost, while a 2026 comparison of published
              fee documents listed $0 account maintenance, $50 full transfer-out fees, $15 online wires, and a
              0.01%-per-month optional subscription. That leaves the monetization stack understandable in shape but not
              in mix, because none of the retained sources disclose realized take rates, spread capture, lending
              utilization, execution margins, or premium-tool attach rates.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
