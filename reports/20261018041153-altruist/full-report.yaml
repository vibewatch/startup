            consume too much advisor time.
          tone: positive
          claimRefs:
            - CO001
            - CO005
        - year: 2020
          label: Vanguard becomes a minority investor
          detail: >-
            Vanguard said it first invested in Altruist in 2020 to increase competition in RIA custody before later
            signing the acquisition agreement.
          tone: positive
          claimRefs:
            - CO004
        - date: 2021-11
          label: Series C adds institutional capital
          detail: >-
            401k Specialist reported a previously undisclosed $110 million Series C led by Declaration Partners with
            Venrock, Insight Partners, and Vanguard participating.
          tone: positive
          claimRefs:
