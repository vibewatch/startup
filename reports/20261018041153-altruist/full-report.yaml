            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Controls, dependencies, and diligence gaps
        blocks:
          - type: paragraph
            body: |-
              Control disclosures and dependencies remain the weakest part of the public record.
              Altruist says Hazel uses TLS 1.2+ encryption and zero-retention arrangements with
              key model providers, but the assigned source pool does not provide independent audit
              artifacts, uptime history, or current external API documentation to validate
              operational resilience at the same depth as the feature set. The ownership transition
              adds another dependency: public reporting says Altruist should keep its leadership,
              brand, and distinct operating model under Vanguard, yet board overlap and prior
              minority investment mean product strategy will increasingly sit inside a much larger
              acquirer. For diligence, that makes security documentation, integration evidence,
              and post-close governance boundaries more important than another feature demo.
            claimRefs:
              - CE006
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Why the stack matters
            body: >-
              Altruist's differentiation is not one feature but the combination of self-clearing custody, workflow
              software, and newer AI tooling in a single advisor operating surface. That can improve switching economics
              and margin capture if the company can keep integrations and service levels strong as ownership changes.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE014
          - type: callout
            title: Public diligence still trails product ambition
            body: >-
              The strongest technical evidence is still company or partner controlled. Without independent uptime,
              certification, or post-acquisition governance materials, the next diligence step should test whether the
              platform's control environment has matured as quickly as its feature set.
            calloutType: risk
            claimRefs:
              - CE006
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segment fit
        blocks:
          - type: paragraph
            body: >-
              The evidence consistently shows Altruist selling first to RIAs and their operations teams, not directly to
              retail investors. The customer pitch is a vertically integrated custody-plus-software stack that reduces
              paperwork, onboarding friction, and multi-vendor sprawl for advisory firms, while still exposing a branded
              digital experience to end clients. The early fit appears strongest with smaller firms, breakaway advisors,
              and firms willing to move custody, because Altruist's value proposition improves when billing, trading,
              reporting, and account opening live inside one operating environment. Public comparison material also
              suggests that multi-custodian enterprises may still need a custodian-neutral system of record, which
              limits how much of the market can adopt Altruist as a full-stack replacement without a migration program.
            claimRefs:
              - CU001
              - CU006
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption proof and named deployments
        blocks:
          - type: paragraph
            body: >-
              Public adoption proof is strongest at the top of the funnel and in selected named deployments. In 2023
              Altruist disclosed over 1,700 RIA firms on platform and said it was adding 40 to 50 firms each month; a
              later 2023 trade report cited 3,300 RIAs on platform; and Forbes reported 6,500 advisors on platform in
              August 2026. Those figures do not use a consistent denominator, so they show momentum more clearly than
              they show exact customer economics. Named customer proof is also partial rather than exhaustive: MDRN
              Capital appears in a company-issued product launch testimonial, while Forbes names Ritholtz Asset
              Management and Bryn Mawr Trust Advisors as customers. That is enough to show live market acceptance, but
              not enough to prove renewal quality or deployment depth across the installed base.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Durability and expansion signals
        blocks:
          - type: paragraph
            body: >-
              Altruist's expansion story is easier to verify than its retention story. The company and trade press frame
              current product expansion around winning larger advisory relationships and helping existing firms serve
              more end households: the 2026 launch of alternatives, margin, options, and faster money movement is
              positioned as a way for advisors to broaden what they can offer clients, and Financial Planning reported a
              deliberate push into firms managing $100 million to $1 billion. The AI positioning reinforces the same
              land-and-expand thesis by arguing that firms can handle more client work without proportional headcount
              growth. What remains missing is customer durability evidence specific to Altruist itself; the assigned
              source pool offers no disclosed NRR, GRR, renewal, or cohort behavior for advisor customers.
            claimRefs:
              - CU007
              - CU011
              - CU013
      - number: '6.4'
        title: Procurement and concentration risks
        blocks:
          - type: paragraph
            body: >-
              The main customer-side risks are implementation friction, ownership transition risk, and missing
              concentration data. Public comparison work emphasizes that moving to Altruist is fundamentally a custody
              migration, which means ACATs, new account setup, and client communication rather than a simple software
              toggle. That makes the product more attractive to greenfield or breakaway advisors than to incumbent
              multi-custodian enterprises. The pending Vanguard acquisition can strengthen distribution and
              balance-sheet confidence, but it also creates a procurement question for advisors that value platform
              independence and need clarity on post-close roadmap continuity. Because public materials in this pool do
              not disclose top-customer mix, channel concentration, or revenue by cohort, the concentration question
              remains a diligence gap rather than a cleared risk.
            claimRefs:
              - CU010
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public adoption proof is real but denominator-messy
            body: >-
              The assigned pool gives credible traction data and named customers, but it alternates between firms, RIAs,
              and advisors, so the growth story is clearer than the exact installed-base economics.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Durability is still under-documented
            body: >-
              Altruist's public 2026 customer narrative emphasizes feature breadth and workflow speed, yet the pool does
              not disclose NRR, GRR, churn, renewal, or contract-duration evidence for advisory customers.
            calloutType: risk
            claimRefs:
              - CU011
              - CU013
          - type: callout
            title: Ownership change can slow procurement
            body: >-
              Advisors evaluating a custodian migration now have to diligence the pending Vanguard close and decide
              whether long-term platform independence still matters to their operating model.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Transaction conditions and governance dominate near-term risk
        blocks:
          - type: paragraph
            body: >-
              Three August 2026 accounts described Vanguard's agreement to acquire Altruist as expected to close later
              in 2026 subject to regulatory approval; none of the assigned evidence establishes that the transaction had
              closed by the report date. Public deal coverage consistently relayed a mitigation: Altruist was expected
              to retain its leadership, brand, advisor focus, and operating model. That promise is relevant but remains
              a forward-looking commitment rather than proof of post-close autonomy. Governance diligence is also
              warranted because Vanguard had invested in Altruist since 2020, former Vanguard chief executive Bill
              McNabb sat on Altruist's board, and Vanguard settled litigation arising from its prior Just Invest
              acquisition shortly before announcing this deal. A delayed approval, changed standalone commitment, or
              undisclosed integration dispute would materially weaken confidence in an orderly ownership transition.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Vertical integration raises the cost of control failure
        blocks:
          - type: paragraph
            body: >-
              Altruist combines self-clearing brokerage and custody with account opening, trading, portfolio management,
              billing, and reporting. This breadth is the product advantage, but it also means a continuity, data,
              reconciliation, or execution failure could affect several advisor workflows at once rather than one
              replaceable software module. Company materials identify legal, compliance, security, and operating leaders
              and describe continued investment in automation and integrations, yet the assigned evidence contains no
              third-party control report, regulator examination result, incident history, recovery test, or
              service-level record. Public scale indicators of 6,000-plus to 6,500 advisors and a named Lifeworks
              deployment show that the platform is consequential, not that its controls are independently proven. The
              operating thesis breaks if outages, reconciliation errors, control findings, or support deterioration
              emerge without timely remediation.
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.3'
        title: Financial opacity leaves the acquisition premium difficult to underwrite
        blocks:
          - type: paragraph
            body: >-
              Forbes reported that Altruist earns interest on idle client cash, securities- lending fees,
              trading-execution fees, and revenue from premium tools. That mix implies exposure to interest rates,
              client cash allocations, asset balances, transaction activity, and product adoption, while the assigned
              sources provide no audited revenue, margin, cash-burn, or segment-contribution data. One lower- reputation
              publication described Altruist as loss-making despite approximately $600 million raised; the company
              separately says it raised more than $600 million and reached a $1.9 billion valuation in its 2025 Series
              F. Forbes reported a proposed acquisition value of $4 billion to $5 billion, so the price represents a
              substantial step-up from the prior financing mark. The appropriate response is not a fabricated burn
              estimate: it is a requirement for audited statements, revenue attribution, unit economics, and the
              definitive transaction economics.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR015
      - number: '7.4'
        title: Public mitigations are useful signals, not diligence substitutes
        blocks:
          - type: paragraph
            body: >-
              The source set supports monitorable triggers. For the transaction, track approval milestones, closing
              timing, leadership retention, and any change to the standalone model. For operations, require independent
              assurance over custody, cybersecurity, business continuity, trade execution, reconciliation, and incident
              response. For customers, distinguish named company-issued references from independently verified
              retention, concentration, and service-quality cohorts. Altruist itself discloses that some promoting
              advisors received benefits that could influence testimonials, which is a reason to verify outcomes rather
              than discard them. Investment should stop or be re-underwritten if the deal fails, standalone control is
              materially reduced, an unresolved safeguarding or execution failure occurs, audited economics show
              structurally weak margins or continuing capital dependence, or retention and concentration data reveal
              fragility inconsistent with the public scale narrative.
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              Re-underwrite immediately if the acquisition fails or slips materially, the standalone commitment changes,
              or custody and execution controls show an unresolved material weakness.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR014
          - type: callout
            title: Required diligence package
            body: >-
              Require closing evidence, audited financials, a fully diluted capitalization schedule, independent control
              reports, incident and examination history, and customer retention and concentration cohorts before
              treating public mitigations as investment-grade evidence.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public price context shows strategic premium, not full underwriting support
        blocks:
          - type: paragraph
            body: >-
              The clearest public valuation markers are Altruist's April 2025 Series F round at an approximately $1.9
              billion valuation and the August 2026 announced Vanguard acquisition that independent outlets place at
              roughly $4.0-$4.6 billion. That step-up indicates real strategic scarcity: Altruist has built a vertically
              integrated RIA custody stack, is still adding advisors, and offers Vanguard a route into workflow
              ownership rather than simple fund distribution. What the public record does not provide is equally
              important. The buyer and seller have not disclosed the exact price, Altruist has not published current
              annual revenue or gross margin, and public sources do not show a current assets-under-custody figure or
              the cap-table preference stack. That means the headline premium is evidence of strategic value, but not
              enough to justify a precise standalone multiple or a fresh buy call at the rumored takeout price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV016
      - number: '8.2'
        title: Recommendation stays track because operating proof outruns valuation transparency
        blocks:
          - type: paragraph
            body: >-
              Public operating proof is good enough to support a constructive base case. Company and third-party sources
              show Altruist scaling from more than 4,700 advisors in April 2025 to 6,500 advisors by August 2026,
              pushing into larger firms, and monetizing through several workflow-linked revenue streams rather than a
              single software fee. Customer evidence and prior funding coverage also point to genuine demand for a
              lower-friction, integrated alternative to incumbent custodians. Even so, the scenario split remains
              asymmetric for a new investor. The bull case requires the Vanguard transaction to close on the reported
              terms and for private diligence to show durable economics behind the strategic premium. The base case
              assumes the deal closes but that public evidence remains insufficient for underwriting additional upside
              beyond the transaction itself. The bear case is a repricing or delayed close that exposes how much of the
              current mark depends on strategic-buyer willingness rather than published financial outputs.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV016
      - number: '8.3'
        title: Final diligence should focus on economics, terms, and transaction fragility
        blocks:
          - type: paragraph
            body: >-
              The highest-value diligence asks are the ones that would convert the current view from a headline
              strategic win into an investable return case. First, investors need audited or board-grade revenue, gross
              margin, net revenue retention, and assets-under-custody data for 2024-2026 to test whether workflow depth
              is translating into durable earnings quality. Second, they need the current cap table, liquidation
              preferences, investor rights, and any merger-consent mechanics to understand who benefits at different
              closing prices. Third, they need the merger agreement, regulatory conditions, and any customer or platform
              covenants that could alter timing or economics. The main thesis-break triggers are a delayed or repriced
              close, private diligence that shows weaker monetization quality than the advisor-growth narrative implies,
              or governance/integration issues that reduce the value of Altruist's open-platform positioning under
              Vanguard ownership.
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track'
            body: >-
              Public evidence supports strategic quality and a likely value-creating exit for existing holders, but it
              does not support a fresh buy recommendation at the reported takeout price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV016
          - type: callout
            title: Main risk to the call
            body: >-
              The current headline valuation could prove more dependent on Vanguard-specific synergies and transaction
              certainty than on standalone economics visible to outside investors.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV009
              - CV010
