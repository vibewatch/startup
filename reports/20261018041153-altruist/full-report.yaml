    type: flow
    summary: >-
      The recommendation follows the chain from scarce platform proof and a strategic takeout signal to a
      price-sensitive track call.
    data:
      nodes:
        - id: benchmark
          label: April 2025 benchmark
          detail: $152M Series F at approximately $1.9B.
        - id: operating-proof
