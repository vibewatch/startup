          The reported acquisition range may reflect buyer-specific synergies more than standalone economics, and the
          public record still omits core underwriting inputs such as audited revenue, gross margin, cap-table
          preferences, and exact transaction terms.
        - >-
          A more negative view would soften if the merger agreement, audited operating metrics, and preference stack
          show that value is durable and not narrowly dependent on strategic takeout assumptions.
    notes: >-
      This table separates strategic scarcity from standalone underwriting. Public sources support both the upside
      narrative and the reasons to avoid false precision.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV007
      - CV008
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Vanguard closes the acquisition near the reported $4.0-$4.6 billion range, preserves Altruist's brand and open
          architecture, and private diligence confirms strong revenue quality.
        - >-
          Existing holders realize a strategic premium above the April 2025 $1.9 billion benchmark; upside is driven by
          transaction completion rather than public-market-style re-rating.
        - Regulatory delay, customer pushback, or weaker private diligence could reduce realized value.
        - Requires clean merger execution and supportive private financial disclosures.
      - - Base
        - >-
          The transaction closes, but public evidence never provides enough detail to justify upside beyond the
          announced takeout narrative.
        - >-
          Outcome is monetization for current holders rather than a repeatable new-money underwriting framework for
          outside investors.
        - Limited transparency can still hide preference-stack or earnout complexity.
        - Most likely while exact price and economics remain undisclosed.
      - - Bear
        - >-
          Closing slips, price is repriced, or diligence exposes weaker economics or more restrictive terms than the
          growth narrative implies.
        - >-
          Value falls back toward or below the last disclosed private benchmark because the premium loses strategic
          certainty.
        - Governance friction, regulatory review, or weaker monetization quality could trigger the reset.
        - Would be signaled by delayed close, guarded diligence access, or disappointing private operating metrics.
    notes: >-
      Ranges are anchored only to publicly disclosed markers: the April 2025 $1.9 billion private valuation and the
      reported August 2026 transaction range. This is not a full multiple-based valuation model.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV009
      - CV010
      - CV016
