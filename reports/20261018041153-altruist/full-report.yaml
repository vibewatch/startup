companyProfile:
  summary: >-
    Altruist is a vertically integrated, self-clearing RIA custodian and advisor software platform founded in 2018 in
    Culver City. The company combines account opening, trading, portfolio management, billing, reporting, and newer AI
    workflow tooling in one stack, has scaled to thousands of advisors, and is now under a definitive acquisition
    agreement with Vanguard while remaining operationally standalone pending close. Public sources support the platform
    thesis and adoption momentum, but exact revenue, margins, and post-close governance economics remain opaque.
  founders:
    - name: Jason Wenk
      role: Founder & CEO
      background: >-
        Built advisory firms before founding Altruist; that operating experience shaped the company around reducing
        custody and workflow friction for advisors.
      claimRefs:
        - CO005
  foundingLocation: Culver City, California
  headquarters: Culver City, CA
