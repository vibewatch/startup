chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform
        blocks:
          - type: paragraph
            body: >-
              Altruist was founded in 2018 and is based in Culver City, California. Across its homepage, about page, and
              Vanguard's acquisition announcement, the company consistently presents itself as an AI-forward custodian
              and wealth platform for independent advisors, combining self-clearing brokerage infrastructure with
              account opening, trading, portfolio management, billing, and reporting in one stack. That integrated
              positioning matters because it underpins both the company's differentiation against legacy custodians and
              Vanguard's stated logic for buying it. The definitive acquisition agreement announced on August 26, 2026
              keeps Altruist in a pending-close state: management says the company is expected to remain a standalone
              business with its leadership and brand intact, but the purchase price was not disclosed and regulatory
              approvals were still outstanding as of the reviewed sources.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO010
              - CO014
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder-CEO Jason Wenk remains the central operating figure and the clearest source of founder-market fit.
              Company and Forbes profiles tie Altruist's origin to Wenk's experience building advisory firms and to his
              frustration with paper- heavy, high-friction custody workflows. Public leadership coverage beyond Wenk is
              strongest on current role coverage rather than detailed biographies: the company identifies leaders for
              operations/compliance, product, finance, legal, security, customer success, sales, engineering, and
              enterprise. Governance is also closely linked to the investor base. Bill McNabb, Vanguard's former CEO,
              sits on Altruist's board, while named directors and investors tie the company to Venrock, Insight
              Partners, Declaration Partners, ICONIQ, and GIC. That concentration makes governance diligence around
              post-close board structure and minority protections important even if day-one management continuity is
              preserved.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
