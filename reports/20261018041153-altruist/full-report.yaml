              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
          - type: callout
            title: Capital history is stronger than cash visibility
            body: >-
              Multiple fundraising milestones and a reported strategic sale price reduce immediate solvency concerns,
              but they do not substitute for current cash, burn, debt, or post-close roadmap-budget evidence.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
          - type: callout
            title: Post-close incentive alignment still needs diligence
            body: >-
              Vanguard's strategic rationale and the recent Just Invest litigation settlement make ownership and
              integration incentives a real underwriting topic rather than a cosmetic governance note.
            calloutType: risk
            claimRefs:
