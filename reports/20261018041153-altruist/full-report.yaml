  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Altruist's customer motion starts with RIAs seeking lower-friction custody operations and expands only after a
      firm is willing to migrate assets and trust roadmap continuity.
    data:
      nodes:
        - label: Breakaway / smaller RIA evaluates the stack
          actor: Founder, COO, or operations lead
          stage: Acquisition
          channel: Sales demo + diligence
          detail: Early traction was strongest with new entrants, breakaways, and firms prioritizing operational simplicity.
          note: The initial fit is strongest where custody can move and incumbent integrations are lighter.
          tone: positive
        - label: Custody migration and digital onboarding
          actor: Advisor + operations team
          stage: Onboarding
          channel: Account opening, ACATs, billing, reporting
          detail: The value proposition improves when onboarding, trading, and reporting move into one custodian-led workflow.
          note: Switching custodians is still the biggest practical hurdle in adoption.
          tone: neutral
        - label: Day-to-day advisory workflow consolidation
          actor: Advisor, client service, and operations
          stage: Core use
          channel: Web/mobile operating platform
          detail: Altruist aims to replace multiple point solutions with one operating environment for RIAs.
          note: Multi-custodian enterprises may still keep a separate system of record.
          tone: positive
        - label: Product expansion to serve larger or broader books
          actor: Growth-oriented advisory firm
          stage: Expansion
          channel: Alternatives, margin, options, money movement
          detail: New 2026 features are positioned as tools to help firms win more clients and move upmarket.
          note: Public data does not quantify attach rates by cohort.
          tone: positive
        - label: AI-enabled engagement and retention pitch
          actor: Advisor and client service teams
          stage: Expansion
          channel: AI workflow + personalization
          detail: The company markets AI as a way to scale client service and reduce manual work.
          note: Public retention claims are industry benchmarks, not Altruist-specific renewal proof.
          tone: neutral
        - label: Ownership and procurement review
          actor: Investment committee or enterprise buyer
          stage: Risk check
          channel: Procurement / legal diligence
          detail: >-
            The Vanguard transaction can add distribution and capital support but requires advisors to underwrite
            roadmap continuity.
          note: Public materials do not yet close the loop on post-acquisition customer retention or concentration.
          tone: risk
    approximationNotes: >-
      Stage order is analytical rather than measured; the figure summarizes the observed customer motion and friction
      points from the assigned source set.
    claimRefs:
      - CU001
      - CU006
      - CU007
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: Top-risk residual exposure matrix
    type: matrix
    summary: >-
      The largest residual exposures combine high potential impact with public mitigations that are stated but not
      independently verified in the assigned evidence.
    data:
      columns:
        - label: Impact
          detail: Consequence supported by the public business and transaction evidence
        - label: Mitigation maturity
          detail: Strength of the mitigation visible in the assigned public sources
        - label: Residual exposure
          detail: Exposure remaining after considering only those public mitigations
      rows:
        - label: Acquisition approval and autonomy
          note: Transaction was described as subject to approval in August 2026
          values:
            - label: High
              detail: Failure or material delay changes ownership and financing assumptions
            - label: Stated
              detail: Standalone leadership, brand, and operating model were publicly promised
            - label: High
              detail: Closing proof and post-close behavior are absent from the assigned evidence
        - label: Integrated custody and workflow continuity
          note: Self-clearing custody and several advisor workflows share one platform
          values:
            - label: High
              detail: A control failure can affect custody and multiple operating workflows
            - label: Limited public evidence
              detail: Named control leaders are visible, but no independent control package is assigned
            - label: High
              detail: Resilience, examination, and incident evidence remains a diligence gap
        - label: Economics and acquisition premium
          note: Monetization is diversified, but audited contribution and margin data are absent
          values:
            - label: High
              detail: Weak economics would undermine the substantial step-up from the 2025 valuation
            - label: Capital-backed
              detail: The company reports more than $600 million raised
            - label: High
              detail: Funding history does not establish margin, burn, or cash availability
        - label: Advisor retention and concentration
          note: Advisor scale is public, but cohort durability and economic concentration are not
          values:
            - label: Medium-high
              detail: Weak retention or concentration would reduce revenue durability
            - label: Named proof only
              detail: Public evidence includes advisor counts and a company-issued Lifeworks deployment
            - label: Medium-high
              detail: Independent retention and concentration cohorts remain unavailable
        - label: Testimonial evidence quality
          note: Altruist discloses benefits that may influence some promoting advisors
          values:
            - label: Medium
              detail: Biased references can distort procurement and underwriting conclusions
            - label: Disclosed
              detail: The company expressly describes the conflict and testimonial limitation
            - label: Medium
              detail: Independent outcome replication is still required
        - label: Acquisition-integration governance
          note: Vanguard settled litigation from its prior fintech acquisition before this deal
          values:
            - label: Medium
              detail: A repeated integration dispute could disrupt leadership and execution
            - label: Settlement only
              detail: The prior case ended, but settlement terms were not disclosed
            - label: Medium
              detail: Process lessons and Altruist-specific protections require document review
    approximationNotes: >-
      Qualitative classifications summarize cited facts and explicit evidence gaps; they are not numeric probabilities,
      independently audited control ratings, or value-at-risk estimates.
