  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary is qualified custody and self-clearing brokerage for independent RIAs
              together with the account-opening, trading, portfolio-management, billing, reporting, and rebalancing
              workflows that depend on the custodial record. It excludes generic CRM, planning software, retail
              self-directed brokerage, fund manufacturing, and broad consumer advice unless those products attach
              directly to the RIA custody workflow. This boundary reflects how Vanguard, Forbes, and InvestmentNews
              describe Altruist rather than treating every wealth-technology dollar as addressable. The status quo
              substitute is a large incumbent custodian combined with separate operating tools and manual handoffs.
              Altruist's proposition is therefore consolidation of the custody-and-operations stack, not simply another
              advisor application. The company says it can serve firms from $1 million to $1 billion in AUM, but that
              target range is a company claim rather than an independently measured serviceable market.
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
      - number: '2.2'
        title: Evidence-constrained sizing and penetration
        blocks:
          - type: paragraph
            body: >-
              The strongest broad lens is Forbes' report that independent RIAs oversee $10 trillion in U.S. assets. That
              describes assets in the channel, not annual custody or software revenue. A separate filing-presence
              comparison, attributed by US Tech Automations to AdvizorPro, covers 15,722 RIAs that report at least one
              separately managed account custodian and assigns 67.8% presence to Schwab versus 7.4% to Altruist. It also
              reports that 88% of Altruist-associated RIAs manage under $100 million and that their median AUM is $17
              million, versus $107 million for Schwab-associated firms. Those figures indicate a smaller-firm skew and
              adoption foothold, but a firm can name more than one custodian, so filing presence is neither client-asset
              share nor revenue share. Incumbent custody figures of $5.7 trillion for Schwab and about $1.5 trillion for
              Fidelity reinforce the concentration challenge. None of these denominators can be added into a defensible
              TAM/SAM/SOM stack.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM014
              - CM015
      - number: '2.3'
        title: Buyers, adoption path, and growth drivers
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is typically the RIA principal or operations leader who controls custodian selection,
              while advisors and operations staff are daily users and the advisory firm is the payer. Smaller
              founder-led firms have the clearest public fit: the filing comparison reports that most
              Altruist-associated RIAs are below $100 million in AUM, and Altruist's own materials emphasize removing
              manual work and reducing the number of vendors involved in account opening and ongoing service. Vanguard
              frames the macro driver as excess demand for advice relative to advisor capacity, making automation
              economically relevant when it allows the same team to serve more clients. Forbes reported 6,500 advisors
              on Altruist's platform in August 2026, while Altruist reported that Hazel had been used by more than 1,000
              wealth managers since its September 2025 launch. These are different populations and should not be
              combined, but they indicate both core-platform adoption and an adjacent productivity attach.
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Constraints, control change, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption requires an RIA to trust a newer custodian with client assets, operational continuity, data, and
              transfer execution while incumbents retain far greater scale. The signed Vanguard transaction adds
              resources but also introduces a control-change question: the official announcement said terms were
              undisclosed, closing remained subject to regulatory approval, and Altruist was expected to remain a
              standalone business. That intended structure is not the same as a completed integration outcome.
              InvestmentNews also reported that Vanguard settled litigation brought by the founders of its prior
              acquisition, Just Invest, after allegations concerning earnout-related conduct; the settlement terms were
              not disclosed. That history does not predict the Altruist outcome, but it is relevant adverse evidence
              when assessing execution and neutrality risk. For valuation, the opportunity should be underwritten from
              verified customer economics, pricing, assets, retention, and migration cohorts rather than by applying a
              software multiple to the $10 trillion asset-channel headline.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Asset-channel size is not revenue TAM
            body: >-
              The $10 trillion RIA asset lens establishes channel scale, but serviceable revenue still depends on
              custody economics, software attach, pricing, and reachable firm cohorts.
            calloutType: insight
            claimRefs:
              - CM003
              - CM014
          - type: callout
            title: Control-change execution remains unproven
            body: >-
              Vanguard and Altruist announced a signed transaction, not a completed integration; regulatory approval,
              operating independence, and advisor response remain open variables.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: challenger versus concentrated incumbents'
        blocks:
          - type: paragraph
            body: >
              Altruist is not competing in a fragmented greenfield category; it is attacking one of the most
              concentrated control points in advisor infrastructure. AlphaPilot reported that Schwab alone custodied
              more than $3 trillion in RIA assets, Fidelity followed at about $1.5 trillion, and the top four custodians
              together controlled an estimated 84% of RIA-custodied assets. Against that backdrop, Altruist's strategic
              pitch is not simply lower price, but a different product shape: a self-clearing custodian that also owns
              the advisor workflow software rather than sitting underneath a patched-together vendor stack.
              Investopedia's framing of Altruist as an alternative to traditional custodian platforms is consistent with
              that thesis, while its reporting on pricing-model changes at Fidelity, Schwab, and Pershing highlights why
              RIAs remain open to evaluating challengers.
            claimRefs:
              - CP002
              - CP005
              - CP009
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP009
