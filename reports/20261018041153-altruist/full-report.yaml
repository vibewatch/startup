      - number: '1.3'
        title: Funding, scale, and business model
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a sizeable but still partly opaque private-company financing history. Altruist
              says it has raised more than $600 million and that its 2025 Series F brought in $152 million at a $1.9
              billion valuation. Trade reporting adds that a previously undisclosed $110 million Series C was raised in
              November 2021, and the 2023 Series D added $112 million, bringing disclosed cumulative funding to about
              $290 million at that point. The company and Forbes also describe a monetization model that goes beyond
              software subscriptions: Altruist earns from idle cash, securities lending, execution fees, and premium
              tools, while using integrated software to reduce operational cost for RIAs. Scale is directionally strong
              but not presented as one audited metric set. The website says 6,000+ advisors use Altruist, Forbes said
              6,500 advisors were on the platform in August 2026, and AdvizorPro's October 2026 RIA dataset shows
              multiple firms with hundreds of millions of AUM disclosed at Altruist.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO012
              - CO014
              - CO015
      - number: '1.4'
        title: Milestones, risks, and open gaps
        blocks:
          - type: paragraph
            body: >-
              The company's recent milestones show a fast sequence of strategic moves rather than a steady-state
              operating picture. In 2023 management linked its Series D financing to the Shareholders Service Group
              acquisition and to the rollout of a self-clearing custodian, and in 2026 Forbes highlighted Hazel, an AI
              tax- planning launch that management intends to extend into adjacent planning workflows. The open question
              now is less whether Altruist has product momentum and more how that momentum will translate under Vanguard
              ownership. InvestmentNews noted that the deal followed the settlement of litigation tied to Vanguard's
              earlier Just Invest acquisition, which raises the bar for diligence on purchase economics, integration
              guardrails, governance, and retention plans. Public sources in the assigned pool do not disclose exact
              current revenue, headcount, or the post-close cap-table/control structure, so those remain material
              diligence gaps rather than facts to infer.
