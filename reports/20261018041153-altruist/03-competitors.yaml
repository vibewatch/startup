      - ["Altruist partner-fund alternatives launch", "Altruist said partner funds launched with no custody fees", "In-platform documents, signatures, reporting, and billing for alternatives", "Applies to partner funds at launch; other custody economics not disclosed here", "Suggests Altruist is using packaging to widen wallet share beyond core custody"]
