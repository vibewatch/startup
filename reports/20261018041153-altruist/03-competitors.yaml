company:
  name: "Altruist"
chapter:
  number: 3
  title: "Competitors"
  summary: "Altruist is still a challenger inside an RIA-custody market dominated by Schwab, Fidelity, Pershing, and LPL, but its self-clearing plus software bundle gives it a more integrated product story than the status quo. The Vanguard acquisition strengthens capital and distribution while also testing whether a once-independent challenger can keep winning advisors who increasingly multi-home to hedge outages, mergers, and platform dependence."
sections:
  - id: "competitive-landscape"
    title: "Competitive landscape: challenger versus concentrated incumbents"
    body: >
      Altruist is not competing in a fragmented greenfield category; it is attacking one of the
      most concentrated control points in advisor infrastructure. AlphaPilot reported that Schwab
      alone custodied more than $3 trillion in RIA assets, Fidelity followed at about $1.5
      trillion, and the top four custodians together controlled an estimated 84% of
      RIA-custodied assets. Against that backdrop, Altruist's strategic pitch is not simply
      lower price, but a different product shape: a self-clearing custodian that also owns the
      advisor workflow software rather than sitting underneath a patched-together vendor stack.
      Investopedia's framing of Altruist as an alternative to traditional custodian platforms is
      consistent with that thesis, while its reporting on pricing-model changes at Fidelity,
      Schwab, and Pershing highlights why RIAs remain open to evaluating challengers.
    claimRefs: [CP002, CP005, CP009]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: "differentiation-and-buying-criteria"
    title: "Differentiation and buying criteria"
    body: >
      The clearest public evidence of differentiation is vertical integration plus ongoing
      feature expansion. Across Altruist's own materials and third-party coverage, the company is
      described as combining self-clearing custody with account opening, trading, portfolio
      management, billing, and reporting in one stack. That matters because public commentary from
      advisors continues to emphasize operational drag in legacy and multi-vendor setups. Public
      packaging signals reinforce the point without fully proving current realized economics:
      Investopedia reported an early low-cost entry offer of free accounts for the first 100
      clients and $1 per account monthly thereafter, while Altruist's 2026 product launch added
      private-market access, margin, options, and faster money movement and said partner funds
      launched with no custody fees. The message is that Altruist is trying to win by collapsing
      workflow steps and extending product scope, not by offering a narrow point solution.
    claimRefs: [CP001, CP010, CP011, CP012]
    tableRefs: [TP002, TP003]
  - id: "durability-after-vanguard"
    title: "Durability after Vanguard: stronger backing, new independence risk"
    body: >
      The Vanguard transaction changes the competitive debate from survival risk to ownership
      risk. Multiple sources reported a roughly $4 billion to $5 billion purchase price, more
      than double Altruist's 2025 valuation, which implies buyers value the platform's custody
      and software capability rather than near-term profitability. Just as important, Vanguard
      said Altruist will remain a standalone business with its leadership, brand, and advisor
      focus intact, which is the right operating promise if the company wants to preserve its
      challenger identity. But the diligence question is whether RIAs will believe that promise
      over time. AlphaPilot cited evidence that advisors already add custodians to hedge outages
      and merger uncertainty, and InvestmentNews showed that Vanguard's earlier Just Invest
      acquisition ended in a legal settlement before the Altruist deal closed. Capital and
      distribution improve, but the neutrality narrative becomes harder to defend.
    claimRefs: [CP006, CP007, CP008, CP015, CP016]
callouts:
  - calloutType: "strength"
    title: "The product pitch is broader than discount custody"
    body: "Public evidence consistently presents Altruist as a vertically integrated custody-plus-software platform, and the 2026 alternatives, margin, options, and money-movement launch suggests it is widening the surface area on which incumbents must respond."
    claimRefs: [CP001, CP011, CP012]
  - calloutType: "risk"
    title: "Ownership could blunt the independence advantage"
    body: "Vanguard's promise to keep Altruist standalone matters because RIAs already multi-home to reduce dependence on any one custodian, and Vanguard's recent history integrating advice-tech acquisitions leaves some room for skepticism."
    claimRefs: [CP006, CP015, CP016]
