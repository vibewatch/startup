            - label: "Exposure / beneficiary summaries"
            - label: "Meeting prep + email drafting"
            - label: "Firm-wide AI reporting"
        - label: "Migration and integration layer"
          detail: "Implements customer transitions and third-party connectivity around the custody core."
          modules:
            - label: "ACAT migration workflow"
            - label: "Integration suite"
            - label: "Onboarding documentation"
        - label: "Self-clearing + operations core"
          detail: "Public and partner evidence points to owned clearing workflows plus middle-office support tooling."
          modules:
            - label: "Brokerage custody + clearing"
            - label: "Cashiering + background screening"
            - label: "Customer-care middle office"
        - label: "Infrastructure and controls"
          detail: "Disclosed controls are narrower than the product surface and still rely heavily on company and partner testimony."
          outputs:
            - label: "TLS 1.2+ encryption"
            - label: "Zero-retention model-provider arrangements"
            - label: "Monitoring + performance tooling"
    approximationNotes: >-
      Internal module boundaries are inferred from public product, partner, and media
      descriptions rather than current vendor documentation or architecture diagrams.
    claimRefs: [CE001, CE004, CE006, CE007, CE008]
callouts:
  - calloutType: "insight"
    title: "Why the stack matters"
    body: >-
      Altruist's differentiation is not one feature but the combination of self-clearing
      custody, workflow software, and newer AI tooling in a single advisor operating
      surface. That can improve switching economics and margin capture if the company can
      keep integrations and service levels strong as ownership changes.
    claimRefs: [CE001, CE004, CE007, CE014]
  - calloutType: "risk"
    title: "Public diligence still trails product ambition"
    body: >-
      The strongest technical evidence is still company or partner controlled. Without
      independent uptime, certification, or post-acquisition governance materials, the
      next diligence step should test whether the platform's control environment has
      matured as quickly as its feature set.
    claimRefs: [CE006, CE011, CE012]
