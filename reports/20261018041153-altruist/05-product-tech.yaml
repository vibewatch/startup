    type: "stack"
    summary: >-
      Public evidence points to a layered advisor operating stack: workflow applications on
      top of self-clearing custody, with newer AI and migration tooling widening the
      product surface.
    data:
      layers:
        - label: "Advisor workflow surface"
          detail: "Customer-facing workflow layer covering onboarding, trading, reporting, billing, and client experience."
          modules:
            - label: "Digital account opening"
            - label: "Trading + rebalancing"
            - label: "Reporting + billing"
        - label: "Client and household experience"
