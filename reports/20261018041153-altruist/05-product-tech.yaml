schemaVersion: "report-v2"
artifact: "product-tech"
slug: "altruist"
runDate: "2026-10-18"
company:
  name: "Altruist"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Altruist's product thesis is a vertically integrated RIA custodian: self-clearing
    brokerage plus account opening, trading, reporting, billing, and newer AI workflow
    tooling in one operating surface. Public evidence supports real module breadth and
    advisor adoption, but technical validation still leans heavily on company and partner
    disclosures, with limited independent proof on resilience, certifications, or
    post-acquisition governance boundaries.
sections:
  - id: "platform-scope"
    title: "Platform scope and advisor workflow"
    body: |-
      Altruist's public product story is consistently positioned as a vertically integrated
      RIA custodian rather than a point solution. The 2023 self-clearing launch described
      a single workflow spanning custody, digital onboarding, trading, reporting, billing,
      model portfolios, rebalancing, and client-facing experiences, while 2026 coverage
      still described the platform as the place where advisors open accounts, execute and
      clear trades, and safeguard client assets. That continuity matters because the
      product promise is not just cheaper software; it is lower reconciliation work and
      fewer handoffs across vendors. It also matches Investopedia's earlier framing of
      Altruist as a digital brokerage intended to replace fragmented advisor tooling.
      Adoption signals improved from 3,300 RIAs in 2023 to 6,500 advisors on platform in
      2026, suggesting the core workflow has moved beyond an early pilot surface.
    claimRefs: [CE001, CE002, CE003, CE009, CE010, CE013]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-maturity"
    title: "Architecture, maturity, and differentiation"
    body: |-
      Architecture evidence is narrower than the marketing surface but still points to a
      real operating stack. Company materials say Hazel now uses live custodial data such
      as account, household, holdings, and beneficiary records, extending Altruist from
      workflow software into an advisor copilot layer. A partner implementation case study
      adds the deepest public technical detail: a self-clearing build covering client and
      broker accounts, cashiering, background screening, ACAT automation, an integration
      suite, and a middle-office app, using Java, microservices, event-driven systems,
      Kafka, and monitoring tooling. Forbes also shows the stack is monetized across
      multiple surfaces—cash spread, securities lending, execution, and premium tools like
      Hazel—so the product is built as an operating stack, not a single subscription SKU.
      Together these sources imply the moat is the combination of custody operations and
      software orchestration, not just a nicer advisor UI.
    claimRefs: [CE004, CE005, CE007, CE008, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "controls-and-dependencies"
    title: "Controls, dependencies, and diligence gaps"
    body: |-
      Control disclosures and dependencies remain the weakest part of the public record.
      Altruist says Hazel uses TLS 1.2+ encryption and zero-retention arrangements with
      key model providers, but the assigned source pool does not provide independent audit
      artifacts, uptime history, or current external API documentation to validate
      operational resilience at the same depth as the feature set. The ownership transition
      adds another dependency: public reporting says Altruist should keep its leadership,
      brand, and distinct operating model under Vanguard, yet board overlap and prior
      minority investment mean product strategy will increasingly sit inside a much larger
      acquirer. For diligence, that makes security documentation, integration evidence,
      and post-close governance boundaries more important than another feature demo.
    claimRefs: [CE006, CE011, CE012]
tables:
  - id: "TE001"
    title: "Product module / asset matrix"
    columns:
      - "Module / asset"
      - "Primary user"
      - "Status / maturity"
      - "Differentiation"
      - "Diligence gap"
    rows:
      - ["Self-clearing custody core", "Advisor operations / compliance", "Production since 2023 launch; still core in 2026 reporting", "Custody, brokerage clearing, and workflow software sit under one operating model", "Need current clearing volumes, exception rates, and service-level history"]
      - ["Advisor workstation", "Advisor", "Publicly described as production", "Digital onboarding, trading, reporting, and billing in one workflow", "Need role-based permissions, audit logging, and admin controls"]
      - ["Portfolio automation + client experience", "Advisor and end client", "Publicly described as production", "Fractional shares, model portfolios, automated rebalancing, and client-facing mobile/web experience", "Need feature-usage penetration and retention by cohort"]
      - ["Hazel AI layer", "Advisor / firm ops", "Launched 2025; deeper custodial-data integration announced in 2025", "Uses live custodial context rather than only CRM or note data", "Need independent testing of permissions, hallucination controls, and review workflows"]
      - ["Migration / integration layer", "Implementation / operations", "Partner-evidenced, not directly documented by Altruist in the assigned pool", "ACAT automation, integration suite, and technical documentation reduce conversion friction", "Need current API docs, integration references, and deployment SLAs"]
    notes: "Compiled from company launch materials, 2025 Hazel release, partner implementation evidence, and 2026 press coverage; row maturity reflects public evidence depth, not audited usage."
    claimRefs: [CE001, CE002, CE004, CE005, CE007, CE008]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow pain"
      - "Altruist solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Open and fund new accounts", "Legacy custodians require rekeying and slower manual onboarding", "Digital account opening plus ACAT-enabled migration workflow", "Forbes cites onboarding in under two minutes versus 30 to 60 minutes with incumbents", "No independent time-and-motion study or conversion-failure data in the assigned pool"]
      - ["Trade and rebalance portfolios", "Fragmented custody and software increase reconciliation work", "One-click commission-free trading, model portfolios, and automated rebalancing inside the custodian stack", "Company materials frame this as fewer manual steps and lower software-license spend", "Public sources do not quantify production usage by advisor segment"]
      - ["Bill clients and report performance", "Separate reporting and billing vendors add cost and data handoffs", "Integrated reporting and flexible fee billing inside the same operating surface", "Integrated stack can capture more of the advisor workflow than point tools", "No independent evidence on reporting accuracy, close-cycle timing, or audit workflows"]
      - ["Answer client and firm questions faster", "Advisors typically stitch together CRM, meeting notes, and custodial data manually", "Hazel uses live custodial data for concentration, exposure, beneficiary, and follow-up workflows", "Official release describes seconds-level analysis and broader firm reporting use cases", "Public sources do not show external validation of AI review controls or production error rates"]
    notes: "Benefits are limited to publicly described outcomes and should not be treated as independently benchmarked ROI."
    claimRefs: [CE002, CE003, CE004, CE005, CE010, CE013]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Advisor-facing workflow apps", "Expose onboarding, trading, reporting, billing, and client experience in a single UI surface", "Depends on accurate orchestration across custody, portfolio, and reporting systems", "Without independent uptime evidence, smooth UX claims remain mostly vendor-authored"]
      - ["Self-clearing brokerage core", "Owns account, broker, cashiering, and clearance workflows rather than outsourcing the full experience", "Relies on regulated brokerage operations and internal exception handling", "Operational incidents here would affect both custody and software layers simultaneously"]
      - ["Migration / integration services", "Support ACAT transitions, future customer integrations, and onboarding documentation", "Depends on implementation tooling and customer-specific integrations", "Public evidence comes mainly from a partner case study rather than first-party current docs"]
      - ["AI + control plane", "Adds Hazel copiloting on top of live custodial data and firm knowledge", "Depends on data permissions, model-provider arrangements, and secure data pipelines", "Publicly disclosed controls are narrow relative to feature ambition and leave certification questions open"]
    notes: "Architecture layers combine company, partner, and media disclosures; internal boundaries are illustrative and not a substitute for vendor technical documentation."
    claimRefs: [CE001, CE004, CE006, CE007, CE008, CE011]
