schemaVersion: report-v2
artifact: company-overview
slug: altruist
runDate: 2026-10-18
company:
  name: Altruist
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Altruist entered October 2026 as a venture-backed, self-clearing RIA custodian
    and advisory software platform with meaningful advisor adoption, but the business
    is in the middle of a strategic ownership transition after Vanguard signed a
    definitive acquisition agreement in August 2026. Public sources support its
    integrated product position, funding history, and board/investor roster, while
    exact revenue, headcount, and post-close control economics remain diligence gaps.
sections:
  - id: identity-and-platform
    title: Identity and platform
    body: >-
      Altruist was founded in 2018 and is based in Culver City, California. Across
      its homepage, about page, and Vanguard's acquisition announcement, the company
      consistently presents itself as an AI-forward custodian and wealth platform for
      independent advisors, combining self-clearing brokerage infrastructure with
      account opening, trading, portfolio management, billing, and reporting in one
      stack. That integrated positioning matters because it underpins both the
      company's differentiation against legacy custodians and Vanguard's stated logic
      for buying it. The definitive acquisition agreement announced on August 26,
      2026 keeps Altruist in a pending-close state: management says the company is
      expected to remain a standalone business with its leadership and brand intact,
      but the purchase price was not disclosed and regulatory approvals were still
      outstanding as of the reviewed sources.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: leadership-governance
    title: Leadership and governance
    body: >-
      Founder-CEO Jason Wenk remains the central operating figure and the clearest
      source of founder-market fit. Company and Forbes profiles tie Altruist's origin
      to Wenk's experience building advisory firms and to his frustration with paper-
      heavy, high-friction custody workflows. Public leadership coverage beyond Wenk
      is strongest on current role coverage rather than detailed biographies: the
      company identifies leaders for operations/compliance, product, finance, legal,
      security, customer success, sales, engineering, and enterprise. Governance is
      also closely linked to the investor base. Bill McNabb, Vanguard's former CEO,
      sits on Altruist's board, while named directors and investors tie the company
      to Venrock, Insight Partners, Declaration Partners, ICONIQ, and GIC. That
      concentration makes governance diligence around post-close board structure and
      minority protections important even if day-one management continuity is
      preserved.
    claimRefs: [CO004, CO005, CO006, CO007]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-business-model
    title: Funding, scale, and business model
    body: >-
      Public evidence supports a sizeable but still partly opaque private-company
      financing history. Altruist says it has raised more than $600 million and that
      its 2025 Series F brought in $152 million at a $1.9 billion valuation. Trade
      reporting adds that a previously undisclosed $110 million Series C was raised
      in November 2021, and the 2023 Series D added $112 million, bringing disclosed
      cumulative funding to about $290 million at that point. The company and Forbes
      also describe a monetization model that goes beyond software subscriptions:
      Altruist earns from idle cash, securities lending, execution fees, and premium
      tools, while using integrated software to reduce operational cost for RIAs.
      Scale is directionally strong but not presented as one audited metric set. The
      website says 6,000+ advisors use Altruist, Forbes said 6,500 advisors were on
      the platform in August 2026, and AdvizorPro's October 2026 RIA dataset shows
      multiple firms with hundreds of millions of AUM disclosed at Altruist.
    claimRefs: [CO008, CO009, CO010, CO012, CO014, CO015]
  - id: milestones-risks-and-open-gaps
    title: Milestones, risks, and open gaps
    body: >-
      The company's recent milestones show a fast sequence of strategic moves rather
      than a steady-state operating picture. In 2023 management linked its Series D
      financing to the Shareholders Service Group acquisition and to the rollout of a
      self-clearing custodian, and in 2026 Forbes highlighted Hazel, an AI tax-
      planning launch that management intends to extend into adjacent planning
      workflows. The open question now is less whether Altruist has product momentum
      and more how that momentum will translate under Vanguard ownership. InvestmentNews
      noted that the deal followed the settlement of litigation tied to Vanguard's
      earlier Just Invest acquisition, which raises the bar for diligence on purchase
      economics, integration guardrails, governance, and retention plans. Public
      sources in the assigned pool do not disclose exact current revenue, headcount,
      or the post-close cap-table/control structure, so those remain material
      diligence gaps rather than facts to infer.
    claimRefs: [CO003, CO010, CO011, CO013, CO016]
    figureRefs: [FO001]
