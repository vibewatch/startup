      Null values mark metrics that the assigned public-source pool did not support
      precisely as of the run date; where multiple public figures exist, the row
      preserves the range rather than implying one audited point estimate.
    claimRefs: [CO001, CO002, CO003, CO008, CO010, CO014, CO016]
  - id: TO002
    title: Leadership and founder table
    columns: [Person, Role, Background, Founder-market fit or functional coverage, Key-person dependency]
    rows:
      - [Jason Wenk, Chief Executive Officer and Founder, Started in finance at Morgan Stanley and previously built advisory firms with multiple billions in client assets, Highest founder-market fit because the product thesis comes directly from his prior RIA operating pain, high]
      - [Mazi Bahadori, Chief Operating Officer and Chief Compliance Officer, Reviewed company page lists the current operating and compliance role but does not summarize prior employment, Concentrates operating and compliance coverage in one named executive role for a regulated custody platform, medium]
      - [Harpreet Ahluwalia, Chief Product Officer, Public sources identify Ahluwalia as product leader and spokesperson on automation and innovation, Covers core product roadmap and the AI-forward platform promise, medium]
      - [Amit Miglani, Chief Financial Officer, Reviewed company page identifies the current finance leader but does not provide a detailed public bio in the assigned pool, Central finance owner while the company stays private and while acquisition economics remain undisclosed, medium]
      - [Bill McNabb, Director, Former Vanguard chairman and CEO and current Altruist board member, Strong governance link between long-time minority investor Vanguard and the pending acquirer, low]
    notes: >-
      This table reflects only the executives and directors that the assigned public
      sources named with enough context to evaluate role coverage; it is not a full
      management-bio dossier and should be supplemented with full resumes and retention
      plans in diligence.
    enumerationScope:
      coverage: partial
      basis: Publicly named leaders and directors visible in reviewed company and media sources as of October 2026.
    claimRefs: [CO004, CO005, CO006, CO007]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    rows:
      - [Vanguard, Minority investor since 2020 and announced acquirer in 2026, Most consequential stakeholder because it may convert a minority position into full ownership subject to approvals, Confirm signed transaction economics regulatory conditions and post-close operating autonomy commitments.]
      - [Insight Partners, Lead investor in the 2023 Series D and still named as a backer, Important late-stage software-growth investor with likely information and governance rights, Request current ownership percentage pro-rata rights and board observer or approval rights.]
      - [Declaration Partners, Reported leader of the 2021 Series C, Early large-check participant in the financing stack before later rounds, Confirm current stake and how the announced sale treats any preferred liquidation rights.]
      - [ICONIQ Growth, Named investor and represented on the public board roster through Yoonkee Sull, Board-linked growth investor with influence beyond pure capital, Confirm board voting rights and post-close treatment of minority protections.]
      - [GIC, Named investor and represented on the public board roster through Vinay Yarlagadda, Sovereign capital source relevant to later-stage ownership concentration, Confirm economic stake side letters and any change-of-control consent mechanics.]
    notes: >-
      The reviewed sources identify important stakeholders but do not provide a full
      cap table, liquidation stack, or voting agreement, so the map highlights who
      appears economically and governably important rather than claiming exhaustive
      ownership coverage.
    enumerationScope:
      coverage: partial
      basis: Stakeholders named in reviewed funding, board, and acquisition sources; percentages and legal rights are not publicly complete.
    claimRefs: [CO004, CO007, CO008, CO009, CO010, CO016]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Financing, product, and ownership milestones show a company that scaled quickly and is now moving into a change-of-control phase.
    data:
      items:
        - year: 2018
          label: Company founded in Culver City
          detail: Jason Wenk founded Altruist in 2018 after operating advisory firms and seeing legacy custody workflows consume too much advisor time.
          tone: positive
          claimRefs: [CO001, CO005]
        - year: 2020
          label: Vanguard becomes a minority investor
          detail: Vanguard said it first invested in Altruist in 2020 to increase competition in RIA custody before later signing the acquisition agreement.
          tone: positive
          claimRefs: [CO004]
        - date: 2021-11
          label: Series C adds institutional capital
          detail: 401k Specialist reported a previously undisclosed $110 million Series C led by Declaration Partners with Venrock, Insight Partners, and Vanguard participating.
          tone: positive
          claimRefs: [CO009]
        - date: 2023-04-12
          label: Series D announced
          detail: Altruist said its $112 million Series D brought total funding to about $290 million and would accelerate product development.
          tone: positive
          claimRefs: [CO010]
        - year: 2023
          label: SSG acquisition and self-clearing milestone
          detail: Management tied the Series D announcement to the Shareholders Service Group acquisition and the launch of a self-clearing custodian, then described Altruist as the third-largest custodian by firms served.
          tone: positive
          claimRefs: [CO010, CO011]
        - year: 2025
          label: Series F resets valuation
          detail: The company says it closed a $152 million Series F in 2025 at a $1.9 billion valuation and had raised more than $600 million overall.
          tone: positive
          claimRefs: [CO008]
        - date: 2026-02
          label: Hazel extends the product set
          detail: Forbes said Altruist launched Hazel, an AI-powered tax-planning tool, in February 2026 and plans to expand it into additional planning workflows.
          tone: opportunity
          claimRefs: [CO013]
        - date: 2026-08-26
          label: Vanguard signs a definitive acquisition agreement
          detail: Vanguard said Altruist should remain a standalone business after close, but terms were undisclosed and the deal still required regulatory approvals.
          tone: warning
          claimRefs: [CO003, CO016]
    claimRefs: [CO003, CO004, CO008, CO009, CO010, CO011, CO013, CO016]
callouts:
  - calloutType: insight
    title: Integrated platform remains the core strategic asset
    body: >-
      The strongest through-line in the public record is not one funding round or one
      feature launch; it is the repeated claim that Altruist combines custody, clearing,
      and advisory software in one workflow stack for RIAs. That is also the capability
      set Vanguard is effectively buying.
    claimRefs: [CO002, CO010, CO012]
  - calloutType: risk
    title: Change-of-control diligence matters more than another product demo
    body: >-
      Product momentum is visible, but the open diligence burden has shifted toward the
      signed-but-unclosed acquisition: purchase price, minority-investor treatment,
      post-close governance, and retention packages are still materially underdisclosed
      in the assigned public pool.
    claimRefs: [CO003, CO004, CO016]
