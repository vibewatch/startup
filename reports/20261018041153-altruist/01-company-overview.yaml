  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: control-and-exit-economics
      missingEvidence: Signed purchase price, merger agreement economics, current cap table, liquidation stack, and post-close minority-investor treatment.
      whyItMatters: These documents determine who gets paid, who controls governance after close, and whether management continuity comes with meaningful autonomy.
      diligencePath: Request the signed transaction documents, full cap table, board consents, and any retention or rollover agreements from management and counsel.
      relatedQuestionRefs: [QO003, QO007]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: material
      topic: financial-performance
      missingEvidence: Audited 2024-2026 revenue, gross margin, operating loss or profitability bridge, and mix of custody versus software revenue.
      whyItMatters: Valuation and quality-of-growth judgments are weak without current financial statements and without a clear view into how recurring software and balance-sheet-linked economics combine.
      diligencePath: Request audited statements, management accounts, and a quality-of-earnings bridge that breaks out subscription, spread, securities-lending, and trading revenue.
      relatedQuestionRefs: [QO004, QO006]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: operating-scale
      missingEvidence: Exact current headcount, exact current RIA-firm count, and any verified end-client or household count.
      whyItMatters: Capacity, support quality, and operating leverage are hard to judge from directional advisor counts alone, especially in a pending acquisition.
      diligencePath: Request HRIS headcount by function, a current customer cohort table, and board materials that define active advisors, firms, and households consistently.
      relatedQuestionRefs: [QO004, QO009]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: governance-structure
      missingEvidence: Current board committee structure and the planned post-close governance model for Altruist as a standalone Vanguard-owned business.
      whyItMatters: Governance design will affect product velocity, risk oversight, and the practical limits on Altruist's promised standalone operating model.
      diligencePath: Request current board materials, committee charters, and the post-close governance memo prepared for the transaction approval process.
      relatedQuestionRefs: [QO002, QO007, QO009]
      relatedTableRefs: [TO002, TO003]
