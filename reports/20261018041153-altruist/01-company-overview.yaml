      - [Headcount, null, "2026", low, Current employee count is not supported by the assigned public-source pool.]
      - [Ownership status, Pending Vanguard acquisition; terms undisclosed and approvals outstanding, "2026-08-26", high, Final purchase price and post-close governance terms remain nonpublic.]
