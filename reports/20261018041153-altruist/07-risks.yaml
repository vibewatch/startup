  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-risk-register
      missingEvidence: Complete closing conditions, approval requirements, licenses, examinations, litigation, and post-close compliance responsibilities.
      whyItMatters: Public reporting identifies headline transaction risk but cannot establish the full legal and regulatory perimeter.
      diligencePath: Obtain counsel's closing memorandum, regulator correspondence, license inventory, examination history, and post-close responsibility matrix.
      relatedQuestionRefs: [QR001, QR002, QR009]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-underwriting
      missingEvidence: Audited revenue, gross margin, cash burn, cash availability, channel contribution, working capital, and capitalization terms.
      whyItMatters: Funding raised and transaction value do not establish sustainable economics or the capital available to absorb operating risk.
      diligencePath: Obtain audited statements, monthly management accounts, revenue attribution, unit economics, cash records, and the fully diluted capitalization schedule.
      relatedQuestionRefs: [QR003, QR010]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: control-assurance
      missingEvidence: Independent security, custody, resilience, incident, reconciliation, and regulatory-examination evidence.
      whyItMatters: The integrated platform expands the consequence of a control failure, while public role descriptions do not verify control effectiveness.
      diligencePath: Review SOC reports, penetration tests, recovery tests, incident logs, safeguarding reconciliations, regulator examinations, and remediation closure.
      relatedQuestionRefs: [QR009]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: concentration-and-retention
      missingEvidence: Customer and counterparty concentration, NRR, GRR, churn, cohort retention, migration failures, complaint trends, and support service levels.
      whyItMatters: Advisor counts and named customer stories do not establish revenue durability or the downside from losing a large relationship.
      diligencePath: Obtain customer-level revenue and asset cohorts, concentration schedules, retention bridges, migration postmortems, complaint logs, and reference calls.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR002, TR003]
