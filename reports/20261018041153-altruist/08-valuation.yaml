slug: altruist
runDate: "2026-10-18"
company:
  name: Altruist
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports Altruist's strategic scarcity and operating momentum, but not a clean standalone underwriting case at the reported takeout price. The April 2025 $1.9 billion private mark, the reported $4.0-$4.6 billion Vanguard acquisition range, and continuing advisor growth are directionally positive, yet undisclosed revenue, gross margin, assets under custody, and cap-table terms keep the recommendation at track."
sections:
  - id: public-price-context
    title: Public price context shows strategic premium, not full underwriting support
    body: "The clearest public valuation markers are Altruist's April 2025 Series F round at an approximately $1.9 billion valuation and the August 2026 announced Vanguard acquisition that independent outlets place at roughly $4.0-$4.6 billion. That step-up indicates real strategic scarcity: Altruist has built a vertically integrated RIA custody stack, is still adding advisors, and offers Vanguard a route into workflow ownership rather than simple fund distribution. What the public record does not provide is equally important. The buyer and seller have not disclosed the exact price, Altruist has not published current annual revenue or gross margin, and public sources do not show a current assets-under-custody figure or the cap-table preference stack. That means the headline premium is evidence of strategic value, but not enough to justify a precise standalone multiple or a fresh buy call at the rumored takeout price."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: recommendation-and-scenarios
    title: Recommendation stays track because operating proof outruns valuation transparency
    body: "Public operating proof is good enough to support a constructive base case. Company and third-party sources show Altruist scaling from more than 4,700 advisors in April 2025 to 6,500 advisors by August 2026, pushing into larger firms, and monetizing through several workflow-linked revenue streams rather than a single software fee. Customer evidence and prior funding coverage also point to genuine demand for a lower-friction, integrated alternative to incumbent custodians. Even so, the scenario split remains asymmetric for a new investor. The bull case requires the Vanguard transaction to close on the reported terms and for private diligence to show durable economics behind the strategic premium. The base case assumes the deal closes but that public evidence remains insufficient for underwriting additional upside beyond the transaction itself. The bear case is a repricing or delayed close that exposes how much of the current mark depends on strategic-buyer willingness rather than published financial outputs."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV002, TV003]
  - id: diligence-and-thesis-breakers
    title: Final diligence should focus on economics, terms, and transaction fragility
    body: "The highest-value diligence asks are the ones that would convert the current view from a headline strategic win into an investable return case. First, investors need audited or board-grade revenue, gross margin, net revenue retention, and assets-under-custody data for 2024-2026 to test whether workflow depth is translating into durable earnings quality. Second, they need the current cap table, liquidation preferences, investor rights, and any merger-consent mechanics to understand who benefits at different closing prices. Third, they need the merger agreement, regulatory conditions, and any customer or platform covenants that could alter timing or economics. The main thesis-break triggers are a delayed or repriced close, private diligence that shows weaker monetization quality than the advisor-growth narrative implies, or governance/integration issues that reduce the value of Altruist's open-platform positioning under Vanguard ownership."
    claimRefs: [CV004, CV009, CV010, CV011, CV016]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - ["Recommendation", "track", "Strategic premium is visible, but public underwriting inputs remain incomplete.", "Do not stretch on price without private financial and transaction diligence."]
      - ["Confidence", "medium", "The valuation markers are recent and corroborated, but exact price and economic disclosures remain limited.", "Conviction can rise only after management-quality and financial-quality diligence."]
      - ["Risk rating", "medium-high", "Execution, regulatory-close, and governance risks remain meaningful because the outcome now depends on a large strategic transaction.", "Model downside from repricing or delay, not just operating slowdown."]
      - ["Valuation stance", "fully priced on public evidence", "The reported $4.0-$4.6 billion takeout range sits well above the last disclosed $1.9 billion private mark.", "Only a negotiated discount or stronger private economics would justify new-money underwriting."]
      - ["Target return / hold / exit", "not supportable from public sources alone", "Current public evidence does not disclose the economics needed for a return model beyond the rumored strategic takeout.", "Treat the announced transaction as the exit reference until better data is available."]
    notes: "Public sources disclose milestone valuations and transaction reports, but not audited revenue, gross margin, cap-table terms, or a current assets-under-custody figure."
    claimRefs: [CV001, CV002, CV003, CV004, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - ["Thesis", "Altruist has scarce strategic value because it pairs self-clearing custody with advisor workflow software, has scaled advisor adoption, and now sits inside Vanguard's push to expand wealth-management infrastructure.", "A stronger positive view would require private evidence that revenue quality, retention, and margin profile justify a premium even without a strategic buyer."]
      - ["Anti-thesis", "The reported acquisition range may reflect buyer-specific synergies more than standalone economics, and the public record still omits core underwriting inputs such as audited revenue, gross margin, cap-table preferences, and exact transaction terms.", "A more negative view would soften if the merger agreement, audited operating metrics, and preference stack show that value is durable and not narrowly dependent on strategic takeout assumptions."]
    notes: "This table separates strategic scarcity from standalone underwriting. Public sources support both the upside narrative and the reasons to avoid false precision."
    claimRefs: [CV002, CV004, CV005, CV007, CV008, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Vanguard closes the acquisition near the reported $4.0-$4.6 billion range, preserves Altruist's brand and open architecture, and private diligence confirms strong revenue quality.", "Existing holders realize a strategic premium above the April 2025 $1.9 billion benchmark; upside is driven by transaction completion rather than public-market-style re-rating.", "Regulatory delay, customer pushback, or weaker private diligence could reduce realized value.", "Requires clean merger execution and supportive private financial disclosures."]
      - ["Base", "The transaction closes, but public evidence never provides enough detail to justify upside beyond the announced takeout narrative.", "Outcome is monetization for current holders rather than a repeatable new-money underwriting framework for outside investors.", "Limited transparency can still hide preference-stack or earnout complexity.", "Most likely while exact price and economics remain undisclosed."]
      - ["Bear", "Closing slips, price is repriced, or diligence exposes weaker economics or more restrictive terms than the growth narrative implies.", "Value falls back toward or below the last disclosed private benchmark because the premium loses strategic certainty.", "Governance friction, regulatory review, or weaker monetization quality could trigger the reset.", "Would be signaled by delayed close, guarded diligence access, or disappointing private operating metrics."]
    notes: "Ranges are anchored only to publicly disclosed markers: the April 2025 $1.9 billion private valuation and the reported August 2026 transaction range. This is not a full multiple-based valuation model."
    claimRefs: [CV001, CV002, CV003, CV004, CV009, CV010, CV016]
