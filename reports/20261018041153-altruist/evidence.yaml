evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: control-and-exit-economics
    missingEvidence: >-
      Signed purchase price, merger agreement economics, current cap table, liquidation stack, and post-close
      minority-investor treatment.
    whyItMatters: >-
      These documents determine who gets paid, who controls governance after close, and whether management continuity
      comes with meaningful autonomy.
    diligencePath: >-
      Request the signed transaction documents, full cap table, board consents, and any retention or rollover agreements
      from management and counsel.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited 2024-2026 revenue, gross margin, operating loss or profitability bridge, and mix of custody versus
      software revenue.
    whyItMatters: >-
      Valuation and quality-of-growth judgments are weak without current financial statements and without a clear view
      into how recurring software and balance-sheet-linked economics combine.
    diligencePath: >-
      Request audited statements, management accounts, and a quality-of-earnings bridge that breaks out subscription,
      spread, securities-lending, and trading revenue.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: operating-scale
    missingEvidence: Exact current headcount, exact current RIA-firm count, and any verified end-client or household count.
    whyItMatters: >-
      Capacity, support quality, and operating leverage are hard to judge from directional advisor counts alone,
      especially in a pending acquisition.
    diligencePath: >-
      Request HRIS headcount by function, a current customer cohort table, and board materials that define active
      advisors, firms, and households consistently.
    relatedQuestionRefs:
      - QO004
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-structure
    missingEvidence: >-
      Current board committee structure and the planned post-close governance model for Altruist as a standalone
      Vanguard-owned business.
    whyItMatters: >-
      Governance design will affect product velocity, risk oversight, and the practical limits on Altruist's promised
      standalone operating model.
    diligencePath: >-
      Request current board materials, committee charters, and the post-close governance memo prepared for the
      transaction approval process.
    relatedQuestionRefs:
      - QO002
      - QO007
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-methodology
    missingEvidence: >-
      A current study using one consistent denominator for RIA custody and custody-attached software revenue across the
      firm segments Altruist can serve.
    whyItMatters: >-
      Asset-channel scale and filing presence cannot establish annual revenue TAM, reachable SAM, or obtainable SOM
      without pricing and segment economics.
    diligencePath: >-
      Obtain an independent custodian-market study or management cohort model with firm counts, assets, pricing, and
      software attach by RIA size.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Altruist customer counts, custody assets, pricing, gross profit, retention, and migration cohorts by RIA size.
    whyItMatters: >-
      Public sources identify likely buyers and adoption signals but do not reveal which cohort drives durable economics
      or how efficiently assets convert to revenue.
    diligencePath: Request internal cohort schedules and reconcile them to audited revenue, asset, and customer-retention reporting.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM007
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: acquisition-execution
    missingEvidence: >-
      Regulatory status, post-close operating commitments, data-governance terms, product-neutrality safeguards, and
      advisor migration or churn plans for the Vanguard transaction.
    whyItMatters: >-
      The transaction can expand resources but may also alter advisor trust, platform neutrality, and switching
      behavior.
    diligencePath: >-
      Review transaction filings and regulator decisions, then interview representative Altruist RIAs about
      change-of-control reactions before underwriting post-close growth.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: incumbent-pricing-parity
    missingEvidence: >-
      Current enterprise custody price schedules and economics for Schwab, Fidelity, Pershing, and LPL against
      Altruist's 2026 packaging.
    whyItMatters: >-
      Without normalized schedules, the chapter can show directional price pressure but not precise switching savings or
      margin tradeoffs.
    diligencePath: >-
      Request current fee schedules, cash-sweep economics, ticket charges, minimums, and bundled software terms directly
      from the custodians or the diligence room.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: post-acquisition-retention
    missingEvidence: Advisor win-loss, churn, asset-transfer, and NPS data after the Vanguard announcement.
    whyItMatters: >-
      The acquisition improves capital and distribution, but the durability question is whether RIAs still view Altruist
      as independent enough to consolidate assets there.
    diligencePath: >-
      Request post-August 2026 pipeline, churn, and asset movement data segmented by single-custody versus multi-custody
      firms.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: access-blocked
    severity: minor
    topic: celent-independent-benchmark
    missingEvidence: >-
      Readable text of Celent's 'How Altruist Is Redefining the RIA Tech Stack' analysis rather than the captured
      sign-up interstitial.
    whyItMatters: >-
      An independent analyst benchmark would help separate vendor positioning from third-party assessment of front-,
      middle-, and back-office completeness.
    diligencePath: Obtain the licensed Celent note or a readable export from the original publisher.
    relatedQuestionRefs:
      - QP002
  - type: missing-source
    severity: material
    topic: incumbent-feature-parity
    missingEvidence: >-
      Current public evidence on Schwab, Fidelity, Pershing, and LPL parity for AI workflow, in-platform alternatives,
      and onboarding speed.
    whyItMatters: The moat assessment is stronger when competitor parity is documented rather than inferred from incumbent scale.
    diligencePath: >-
      Collect current incumbent product docs, demo materials, or advisor comparisons and normalize them against the same
      buying criteria used here.
    relatedQuestionRefs:
      - QP007
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited 2024-2026 revenue, gross margin, operating expenses, and burn or cash-flow statements.
    whyItMatters: Public funding and valuation milestones do not establish revenue quality, margin path, or runway.
    diligencePath: Request audited annual financials plus latest monthly management accounts and revenue-recognition policy.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: monetization-mix
    missingEvidence: >-
      Realized take rates for sweep cash, securities lending, execution, subscription attach rates, and premium-tool
      revenue mix.
    whyItMatters: >-
      The public evidence shows revenue channels but not which ones actually drive gross profit or carry concentration
      risk.
    diligencePath: >-
      Request product-line revenue bridge, net interest income detail, lending utilization, and subscription attach-rate
      cohorts.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI008
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales-cycle length, gross retention, net retention, and cohort service-cost data by advisor segment.
    whyItMatters: Speed and adoption proxies do not prove efficient or durable customer acquisition economics.
    diligencePath: Request funnel conversion, cohort retention, CAC payback, and implementation-cost reporting by firm-size cohort.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI008
  - type: private-evidence-only
    severity: material
    topic: post-close-capital-allocation
    missingEvidence: Current cash on hand, debt or covenant obligations, expected close timing, and post-close roadmap or capex budget.
    whyItMatters: >-
      Funding raised and announced deal value do not show available liquidity or whether owner incentives will preserve
      advisor-facing investment pace.
    diligencePath: >-
      Request current cash and debt schedule, merger-condition summary, and budgeted product and service investments for
      the next 12-24 months.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: security-validation
    missingEvidence: >-
      Independent audit artifacts such as SOC 2 or ISO certifications, penetration-test summaries, status-history
      evidence, or documented incident disclosures for Altruist and Hazel.
    whyItMatters: >-
      The product surface now touches custody workflows and AI-assisted advice operations, so operational resilience and
      control maturity are underwriting questions rather than marketing details.
    diligencePath: >-
      Request the trust-center package, external audit letters, historical status-page exports, and customer security
      questionnaires from Altruist.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
