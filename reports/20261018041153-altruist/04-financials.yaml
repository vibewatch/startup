schemaVersion: report-v2
artifact: financials
slug: altruist
runDate: 2026-10-18
company:
  name: Altruist
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a blended financial model at Altruist: custody balances
    and transaction activity appear to generate spread, lending, execution, and
    ancillary-fee revenue, while the software layer adds optional subscription and
    connected-account monetization. Adoption and capital access look strong, but
    public underwriting still lacks audited revenue, gross margin, cash, burn, CAC,
    and realized take-rate disclosures, so revenue quality and capital adequacy remain
    diligence-dependent.
sections:
  - id: blended-revenue-model
    title: Blended custody economics, with only partial list pricing visible
    body: >-
      Public evidence points to Altruist behaving less like a pure workflow SaaS vendor
      and more like a vertically integrated custodian that monetizes both platform usage
      and balance-sheet activity. Forbes reported that the company earns interest on
      idle cash, securities-lending fees, trading-execution fees, and premium-tool
      revenue, while Altruist's own disclosures say it also earns revenue from advisors
      who use its software and from assets handled through its broker-dealer and RIA
      affiliates. Public pricing visibility remains incomplete: a 2023 company release
      framed reporting, billing, rebalancing, portfolio accounting, and the client
      portal as included at no additional cost, while a 2026 comparison of published fee
      documents listed $0 account maintenance, $50 full transfer-out fees, $15 online
      wires, and a 0.01%-per-month optional subscription. That leaves the monetization
      stack understandable in shape but not in mix, because none of the retained sources
      disclose realized take rates, spread capture, lending utilization, execution
      margins, or premium-tool attach rates.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Public traction is strong, but unit economics stay mostly private
    body: >-
      The public footprint suggests real distribution fit with smaller RIAs, but it does
      not close the unit-economics case. Altruist's official materials say 6,000+
      independent advisors use the platform and that the number of RIAs served grew 112%
      year over year. Winthrop cited FINTRX data showing 1,341 RIA firms on the
      platform, including 706 sole-custody relationships, and described the user base as
      skewing heavily toward one-to-five-person firms. Operational-efficiency proxies are
      directionally positive rather than fully financial: company pages claim onboarding
      up to 91% faster, under-60-second support response times, and 96% support
      satisfaction, while Forbes reported new-investor onboarding can take less than two
      minutes versus 30 to 60 minutes on incumbent platforms. Financial Planning also
      reported that Altruist nearly tripled AUM in 2022 and grew revenue by more than
      1,700% year over year, but attributed both figures to the company. None of the
      public sources disclose CAC, sales-cycle length, payback, churn, NRR, gross margin,
      or service cost per advisor cohort.
    claimRefs: [CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-and-underwriting-gaps
    title: Capital access looks strong, but underwriting still hinges on private data
    body: >-
      Public financing evidence suggests Altruist has been able to raise and reprice
      capital aggressively, but those milestones are not substitutes for current cash-on-
      hand or runway. The 2023 Series D announcement said Altruist raised $112 million
      and brought total funding at that point to approximately $290 million, while the
      current company profile says Altruist later closed a $152 million Series F in 2025
      at a $1.9 billion valuation and had raised more than $600 million by 2026.
      Independent reporting then put Vanguard's announced 2026 acquisition at roughly
      $4.0 billion to $4.6 billion. That history lowers immediate survival-risk optics,
      but it does not answer how much cash remains, what gross margins look like after
      self-clearing and service delivery, or whether post-close capital allocation will
      prioritize advisor-facing roadmap velocity. The owner-transition risk is not
      theoretical: InvestmentNews reported Vanguard settled Just Invest shareholder
      litigation on July 29, 2026, weeks before the Altruist announcement, reinforcing
      the need to diligence governance, integration incentives, and control over realized
      monetization.
    claimRefs: [CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["Idle-cash spread", "Interest earned on customer cash balances", "Custodied cash balances", "Publicly described; exact spread capture undisclosed", "Independent current reporting", "Provide sweep balances by product and quarterly net interest income contribution."]
      - ["Securities lending and execution", "Lending fees on customer holdings plus trading-execution economics", "Custodied holdings and order flow", "Publicly described; attach rate and margin undisclosed", "Independent current reporting", "Break out securities-lending revenue and trading-execution margin by quarter."]
      - ["Ancillary custody and service fees", "Transfer and wire fees visible in published schedule", "Per transfer or wire event", "Public list pricing visible; realized fee incidence undisclosed", "Secondary synthesis of current fee schedule", "Provide fee-waiver policy and trailing-12-month ancillary-fee revenue."]
      - ["Software and premium tools", "Advisor software usage plus premium subscriptions and tools such as Hazel and One", "Per account, per subscription, or asset-linked charges", "Shape is visible but realized mix is undisclosed", "Mixed official and independent evidence", "Provide attach rates, ARPA, and premium-tool gross margin."]
    notes: >-
      Public evidence identifies revenue channels but not their realized mix; list pricing
      and narrative descriptions should not be treated as recognized revenue or margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["$0 annual account maintenance", "List pricing only", "Realized revenue depends on ancillary fees and other monetization", "Current published-fee comparison"]
      - ["$50 full transfer-out and $15 online wire", "List pricing only", "Waivers and actual incidence not disclosed", "Current published-fee comparison"]
      - ["One subscription at 0.01% of assets per month", "Public subscription price", "Attach rate, household/account scope, and pass-through practice require diligence", "Current published-fee comparison"]
      - ["First 100 third-party connected accounts free then $1/account/month", "Company-published pricing", "Scope is limited to connected accounts rather than total custody economics", "2023 company release"]
    notes: >-
      This table records public list pricing only; none of these rows reveals realized
      net revenue, blended take rate, discounting, or contribution margin.
    claimRefs: [CI005, CI006, CI007]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Advisor adoption footprint", "6,000+ advisors and 1,341 RIA firms publicly cited", "Medium", "Indicates commercial reach and potential monetization base", "Reconcile advisor count, firm count, and revenue per advisor cohort."]
      - ["Onboarding efficiency proxy", "Public sources cite less-than-two-minute onboarding and up-to-91%-faster transfers", "Medium", "Faster onboarding can compress implementation labor and improve sales efficiency", "Provide measured onboarding cost per account and conversion-rate data."]
      - ["AUM / revenue growth proxy", "Nearly tripled AUM in 2022 and revenue growth over 1700% year over year", "Medium", "Suggests rapid scaling but not durable margin quality", "Provide audited 2022-2025 revenue bridge and normalized growth definition."]
      - ["Gross margin and CAC / payback", null, "Low", "Core underwriting metrics are missing from public evidence", "Provide gross margin by product line plus CAC, payback, and sales-cycle cohorts."]
      - ["Cash runway and financing dependency", null, "Low", "Funding raised is not cash available and does not prove current runway", "Provide cash on hand, burn, debt obligations, and post-close capital-allocation plan."]
    notes: >-
      Null rows mark genuinely unavailable public underwriting inputs rather than zero
      values; management disclosure is required to convert these into underwriteable
      metrics.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to a blended bridge from custodied assets and workflow usage
      into spread, transaction, and software monetization rather than a single pricing
      lever.
    data:
      nodes:
        - label: Advisor assets and cash balances
          claimRefs: [CI001, CI002, CI003]
        - label: Self-clearing custody and trading workflow
          claimRefs: [CI004, CI005]
        - label: Idle-cash spread income
          claimRefs: [CI001, CI016]
        - label: Securities-lending and execution fees
          claimRefs: [CI002, CI003]
        - label: Subscription, connected-account, and premium-tool fees
          claimRefs: [CI004, CI006, CI007]
        - label: Integrated gross profit pool
          claimRefs: [CI001, CI002, CI003, CI004, CI016]
      edges:
        - from: Advisor assets and cash balances
          to: Idle-cash spread income
          label: cash sweep balances
          claimRefs: [CI001, CI016]
        - from: Advisor assets and cash balances
          to: Securities-lending and execution fees
          label: custodied holdings and trading activity
          claimRefs: [CI002, CI003]
        - from: Self-clearing custody and trading workflow
          to: Securities-lending and execution fees
          label: execution workflow
          claimRefs: [CI002, CI003]
        - from: Self-clearing custody and trading workflow
          to: Subscription, connected-account, and premium-tool fees
          label: platform adoption
          claimRefs: [CI004, CI005, CI006, CI007]
        - from: Idle-cash spread income
          to: Integrated gross profit pool
          label: spread economics
          claimRefs: [CI001, CI016]
        - from: Securities-lending and execution fees
          to: Integrated gross profit pool
          label: transaction economics
          claimRefs: [CI002, CI003]
        - from: Subscription, connected-account, and premium-tool fees
          to: Integrated gross profit pool
          label: software monetization
          claimRefs: [CI004, CI006, CI007]
    approximationNotes: >-
      This is a structure diagram rather than a quantified bridge because public sources
      do not disclose revenue mix, contribution margins, or attach rates by stream.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI016]
callouts:
  - calloutType: insight
    title: Public evidence supports breadth, not revenue quality
    body: >-
      The retained sources make the monetization stack legible, but none discloses
      audited revenue recognition, realized take rates, gross margin, or attach-rate mix,
      so public evidence cannot underwrite revenue quality on its own.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
  - calloutType: risk
    title: Capital history is stronger than cash visibility
    body: >-
      Multiple fundraising milestones and a reported strategic sale price reduce
      immediate solvency concerns, but they do not substitute for current cash, burn,
      debt, or post-close roadmap-budget evidence.
    claimRefs: [CI013, CI014]
  - calloutType: risk
    title: Post-close incentive alignment still needs diligence
    body: >-
      Vanguard's strategic rationale and the recent Just Invest litigation settlement make
      ownership and integration incentives a real underwriting topic rather than a
      cosmetic governance note.
    claimRefs: [CI015]
