  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Founder-led or sub-$100M RIA
        - Founder or principal
        - Advisors and a small operations team
        - Advisory firm
        - Open and fund accounts, trade, bill, report, and service clients
        - Founder or COO
        - Reduce manual work and the number of vendors needed to operate
      - - Growing RIA approaching greater operational complexity
        - Firm leadership or operations executive
        - Advisors, service staff, and portfolio operations
        - Advisory firm
        - Scale onboarding, portfolio operations, billing, and reporting
        - COO or principal
        - Add client capacity without adding operating headcount linearly
      - - Breakaway or custodian-switching team
        - Team lead or firm principal
        - Advisors and transition staff
        - Advisory firm
        - Move client accounts and replace legacy or fragmented workflows
        - Principal or transition lead
        - Desire for a self-clearing, integrated alternative to incumbent processes
      - - Existing firm evaluating AI workflow attach
        - Firm leadership
        - Advisors and client-service staff
        - Advisory firm
        - Use custodial and firm data for analysis, preparation, and client responses
        - Principal or operations leader
        - Improve advisor throughput and personalization from the same data layer
    notes: >-
      Buyer and budget-owner roles are analytical inferences from the workflows described
      in the retained sources; no source in the assigned pool provides segment ACV or win rates.
    claimRefs: [CM005, CM006, CM008, CM009, CM010, CM011]
