schemaVersion: report-v2
artifact: market-analysis
slug: altruist
runDate: 2026-10-18
company:
  name: Altruist
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Altruist addresses RIA custody plus the operating software attached to the custodial
    record, with a particularly visible foothold among smaller independent firms. Public
    evidence supports a large asset channel and workflow demand, but not a clean revenue
    TAM, SAM, or SOM because the available figures use different populations and units.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The defensible market boundary is qualified custody and self-clearing brokerage for
      independent RIAs together with the account-opening, trading, portfolio-management,
      billing, reporting, and rebalancing workflows that depend on the custodial record.
      It excludes generic CRM, planning software, retail self-directed brokerage, fund
      manufacturing, and broad consumer advice unless those products attach directly to
      the RIA custody workflow. This boundary reflects how Vanguard, Forbes, and
      InvestmentNews describe Altruist rather than treating every wealth-technology dollar
      as addressable. The status quo substitute is a large incumbent custodian combined
      with separate operating tools and manual handoffs. Altruist's proposition is therefore
      consolidation of the custody-and-operations stack, not simply another advisor
      application. The company says it can serve firms from $1 million to $1 billion in
      AUM, but that target range is a company claim rather than an independently measured
      serviceable market.
    claimRefs: [CM001, CM002, CM010]
    tableRefs: [TM001]
  - id: sizing-and-penetration
    title: Evidence-constrained sizing and penetration
    body: >-
      The strongest broad lens is Forbes' report that independent RIAs oversee $10 trillion
      in U.S. assets. That describes assets in the channel, not annual custody or software
      revenue. A separate filing-presence comparison, attributed by US Tech Automations to
      AdvizorPro, covers 15,722 RIAs that report at least one separately managed account
      custodian and assigns 67.8% presence to Schwab versus 7.4% to Altruist. It also reports
      that 88% of Altruist-associated RIAs manage under $100 million and that their median
      AUM is $17 million, versus $107 million for Schwab-associated firms. Those figures
      indicate a smaller-firm skew and adoption foothold, but a firm can name more than one
      custodian, so filing presence is neither client-asset share nor revenue share.
      Incumbent custody figures of $5.7 trillion for Schwab and about $1.5 trillion for
      Fidelity reinforce the concentration challenge. None of these denominators can be
      added into a defensible TAM/SAM/SOM stack.
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM014, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, adoption path, and growth drivers
    body: >-
      The economic buyer is typically the RIA principal or operations leader who controls
      custodian selection, while advisors and operations staff are daily users and the
      advisory firm is the payer. Smaller founder-led firms have the clearest public fit:
      the filing comparison reports that most Altruist-associated RIAs are below $100 million
      in AUM, and Altruist's own materials emphasize removing manual work and reducing the
      number of vendors involved in account opening and ongoing service. Vanguard frames
      the macro driver as excess demand for advice relative to advisor capacity, making
      automation economically relevant when it allows the same team to serve more clients.
      Forbes reported 6,500 advisors on Altruist's platform in August 2026, while Altruist
      reported that Hazel had been used by more than 1,000 wealth managers since its
      September 2025 launch. These are different populations and should not be combined,
      but they indicate both core-platform adoption and an adjacent productivity attach.
    claimRefs: [CM005, CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: constraints-and-valuation-relevance
    title: Constraints, control change, and valuation relevance
    body: >-
      Adoption requires an RIA to trust a newer custodian with client assets, operational
      continuity, data, and transfer execution while incumbents retain far greater scale.
      The signed Vanguard transaction adds resources but also introduces a control-change
      question: the official announcement said terms were undisclosed, closing remained
      subject to regulatory approval, and Altruist was expected to remain a standalone
      business. That intended structure is not the same as a completed integration outcome.
      InvestmentNews also reported that Vanguard settled litigation brought by the founders
      of its prior acquisition, Just Invest, after allegations concerning earnout-related
      conduct; the settlement terms were not disclosed. That history does not predict the
      Altruist outcome, but it is relevant adverse evidence when assessing execution and
      neutrality risk. For valuation, the opportunity should be underwritten from verified
      customer economics, pricing, assets, retention, and migration cohorts rather than by
      applying a software multiple to the $10 trillion asset-channel headline.
    claimRefs: [CM012, CM013, CM014, CM015]
callouts:
  - calloutType: insight
    title: Asset-channel size is not revenue TAM
    body: >-
      The $10 trillion RIA asset lens establishes channel scale, but serviceable revenue
      still depends on custody economics, software attach, pricing, and reachable firm cohorts.
    claimRefs: [CM003, CM014]
  - calloutType: risk
    title: Control-change execution remains unproven
    body: >-
      Vanguard and Altruist announced a signed transaction, not a completed integration;
      regulatory approval, operating independence, and advisor response remain open variables.
    claimRefs: [CM012, CM013]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend or workflow
      - Excluded spend or workflow
      - Buyer / payer
      - Relevance to Altruist
    rows:
      - - RIA custody and clearing core
        - Custody, clearing, asset safeguarding, transfers, and trading
        - Retail self-directed brokerage and bank trust custody outside the independent-RIA channel
        - RIA principal or operations leader / advisory firm
        - Core market because Altruist operates a self-clearing brokerage for independent RIAs
      - - Custody-attached advisor operations
        - Account opening, portfolio management, rebalancing, billing, reporting, and client access
        - Stand-alone CRM or planning tools that do not depend on custodial records
        - RIA principal or COO / advisory firm
        - Core adjacency and principal differentiation from a custody-only service
      - - Data-attached productivity tools
        - Household analysis, tax-planning support, meeting preparation, and client-response workflows
        - Horizontal AI tools without RIA or custodial context
        - Firm leadership / advisory firm
        - Monetization and retention adjacency rather than the base custody market
      - - Status-quo substitute
        - Large incumbent custodian plus separate software and manual operating handoffs
        - Consumer advice products that do not serve the firm's operating workflow
        - RIA principal or operations leader / advisory firm
        - Primary substitute because it solves the same custody need with a fragmented stack
    notes: >-
      Boundary classifications synthesize source-backed product descriptions; publishers do
      not provide a common spending taxonomy, and excluded categories are analytical limits.
    claimRefs: [CM001, CM002, CM010, CM011]
