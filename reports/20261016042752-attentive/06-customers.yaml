callouts:
  - calloutType: "strength"
    title: "Production depth is visible at Sigma Sports"
    body: "The Sigma case documents a dated migration, multiple deployed modules, subscriber reactivation, and year-over-year commercial outcomes rather than a logo-only relationship."
