artifact: "customers"
slug: "attentive"
runDate: "2026-10-16"
company:
  name: "Attentive"
chapter:
  number: 6
  title: "Customers"
  summary: >
    Attentive has credible production adoption among consumer brands, with more than
    8,000 customers claimed across 70-plus industries and a detailed 2025-2026
    Sigma Sports deployment showing substantial post-migration gains. Public evidence
    is much stronger for adoption and account expansion than for durability: retention,
    renewal, contract-length, and concentration metrics remain unavailable.
sections:
  - id: "customer-base-and-fit"
    title: "The public customer footprint centers on scaled consumer brands"
    body: |
      Attentive's own recruiting text says the company serves more than 8,000 customers across over 70 industries, while Wikipedia separately reports more than 8,000 businesses using the software. These figures are directionally consistent but do not define whether the denominator means contracted, paying, active, or currently sending brands. The same company-issued material names Crate and Barrel, Urban Outfitters, and Carter's, providing recognizable references without revealing contract size or deployment scope.

      The product and review evidence points to a clearer segment pattern than the headline count does. Attentive is positioned for retail, ecommerce, food and beverage, travel, and entertainment marketers that coordinate SMS with email, RCS, and push. The likely buyer and payer is a CRM, retention, ecommerce, or marketing leader; day-to-day users are lifecycle marketers and CRM operators. Quote-based, usage-linked pricing and account-led support indicate stronger alignment with mid-market and enterprise programs than with teams seeking a simple self-serve texting product.
    claimRefs: ["CU001", "CU002", "CU003", "CU009", "CU010"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-and-named-proof"
    title: "Sigma Sports provides the strongest production and outcome evidence"
    body: |
      Sigma Sports is the best-documented customer in the assigned evidence. Attentive's case study says Sigma migrated from Ometria and Wunderkind on August 27, 2025 and rebuilt its CRM foundation across Attentive Email, SMS, and AI. By January 2026, the case study reports total platform revenue up 279% year over year while total sends rose 32%; active subscribers had also grown 55% within six weeks, and four warm-up campaigns reactivated nearly 10,000 contacts at a 30% rate among warmer segments. The same source attributes a 10% revenue uplift to AI Pro after implementation in October 2025.

      These metrics demonstrate production use across acquisition, orchestration, reactivation, and expansion rather than a pilot or logo-only relationship. They are nevertheless company-published, single-customer outcomes. Other names in the evidence are mostly references embedded in Attentive-authored job text, an official product-page testimonial, or a reviewer's list of brands named by the vendor. Those references broaden the apparent customer set but do not independently establish current production status, renewal, or comparable outcomes.
    claimRefs: ["CU004", "CU005", "CU006", "CU007", "CU008", "CU015"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-expansion-and-friction"
    title: "Expansion is visible, while retention and concentration remain opaque"
    body: |
      Attentive's account-expansion logic is visible in both product and hiring evidence. SMS can extend into email, RCS, push, shared behavioral data, additional integrations, and AI-led journeys. Current product roles describe data and integration capabilities as a company priority and tie success to adoption, measurable business outcomes, and retention. That supports a plausible land-and-expand mechanism, but a strategic hiring plan is not proof that customers have adopted each module or renewed after expansion.

      The adverse evidence is useful but requires issuer discipline. Ground and Textedly are competitors, not independent benchmarks; they describe rising or opaque costs, enterprise complexity, limited flexibility, and potential support or integration friction. Ecommerceguide's synthesis of 11 public reviews adds an arms-length signal: it reports praise for named customer-success managers and an intuitive interface, alongside slower-than-expected onboarding, delayed campaign reporting, and weaker support responsiveness during setup. No retained source discloses NRR, GRR, churn, renewal rates, contract duration, or customer concentration, leaving durability as the central customer diligence gap.
    claimRefs: ["CU010", "CU011", "CU012", "CU013", "CU014", "CU016"]
