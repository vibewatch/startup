evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-transition
    missingEvidence: >-
      A primary announcement or governance disclosure showing when Eric Miao became CEO and what role Amit Jhawar or the
      founders held immediately before and after the change.
    whyItMatters: >-
      Management continuity, founder involvement, and board process all influence diligence on execution risk and
      decision rights.
    diligencePath: >-
      Request the CEO transition announcement, current org chart, board roster, and any executive employment or
      separation disclosures.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: >-
      A post-2021 primary financing, secondary trade, mark, or lender package confirming today's valuation and
      capitalization.
    whyItMatters: >-
      The last public valuation point is from a very different market environment and should not anchor underwriting
      without an updated price signal.
    diligencePath: >-
      Request the current cap table, financing history since 2021, any secondary tender data, and debt or credit
      agreements.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: >-
      A current management-supplied headcount or payroll-backed figure reconciling the official 1,000+ employee
      disclosure with Forbes' 5,000 employee figure.
    whyItMatters: >-
      People scale is a shorthand for burn, sales coverage, and execution capacity, so large mismatches can distort
      later operating assumptions.
    diligencePath: >-
      Ask management for current employees, contractors, and office-by-office staff counts together with the date each
      figure was last updated.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: board-composition
    missingEvidence: A current board list with investor seats, observer rights, and committee structure.
    whyItMatters: >-
      Without a board view, it is hard to judge control, escalation paths, and whether the visible investor list still
      matches actual governance.
    diligencePath: Request the current board deck front matter, bylaws summary, and any investor rights or voting agreements.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: private-evidence-only
    severity: material
    topic: tam-sam-sizing
    missingEvidence: >-
      An independent market study or management disclosure that quantifies included spend for commerce-retention
      messaging across SMS, email, RCS, and push.
    whyItMatters: >-
      Without a methodology-backed external market denominator, valuation work can overstate market upside by using
      generic marketing-software TAMs that include excluded workflows.
    diligencePath: >-
      Request management's internal market model, then reconcile it to an external analyst or trade-association estimate
      using the same included channels and buyer segments.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: integrations
    missingEvidence: >-
      A dated primary-source integration count or product catalog that resolves whether the current ecosystem should be
      described as 100+ or 150+ integrations.
    whyItMatters: >-
      Precise ecosystem breadth influences switching-cost and serviceability narratives, and the retained sources
      preserve a meaningful range rather than a single audited number.
    diligencePath: >-
      Obtain Attentive's current integration directory or a product-team statement with a published date, then replace
      the third-party range with the primary count.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner
    missingEvidence: >-
      Direct procurement, customer interview, or pricing-pack evidence showing contract size, budget owner, and
      deployment scope by segment.
    whyItMatters: >-
      The buyer and payer map is currently inferred from integrations and reviewer positioning, which is directionally
      useful but not enough to benchmark sales efficiency or ACV distribution.
    diligencePath: >-
      Ask management for sample price books and win-loss notes, and validate them with reference calls across SMB,
      mid-market, and enterprise customers.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: internal-build
    missingEvidence: >-
      Public evidence on internal-build, agency-operated, or status-quo spreadsheet/ESP alternatives is sparse in the
      assigned pool.
    whyItMatters: >-
      Those substitutes affect real win-loss decisions, especially for buyers that view Attentive as a workflow bundle
      rather than a standalone product.
    diligencePath: >-
      Add customer win-loss interviews, competitive battlecards, or independent case studies covering DIY and
      incumbent-stack alternatives.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Negotiated rate cards, carrier pass-through formulas, renewal clauses, and export provisions for Attentive and
      peers are not directly available in the assigned sources.
    whyItMatters: >-
      Realized economics and exit friction determine whether public list prices or editorial comparisons hold up in
      underwriting.
    diligencePath: >-
      Request current quotes and redlined contracts from Attentive, Klaviyo, Postscript, Omnisend, and Emotive for an
      apples-to-apples commercial compare.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: incumbent-depth
    missingEvidence: >-
      The assigned pool lacks official product, security, and pricing detail for Braze, Marketo, or other enterprise
      incumbents shown on the G2 alternatives page.
    whyItMatters: >-
      Without direct incumbent evidence, the chapter can place Attentive in the buyer-visible set but cannot make a
      high-confidence feature-depth ranking against every large-suite competitor.
    diligencePath: >-
      Add official competitor pages or customer references for Braze, Marketo, and other listed incumbents before
      treating the matrix as exhaustive.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Anonymized contract cohorts showing net price per message, minimum-commitment incidence, discounting, and module
      attach by customer segment.
    whyItMatters: Revenue quality and ARPA cannot be underwritten from quote-based public pricing alone.
    diligencePath: >-
      Request cohort-level contract exports or board reporting that bridges list size, message volume, minimums, and
      realized revenue.
    relatedQuestionRefs:
      - QI001
      - QI004
    relatedTableRefs:
      - TI002
