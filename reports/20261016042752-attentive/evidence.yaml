      target-return model.
    diligencePath: Request audited FY2024-FY2025 financials, cohort retention data, and board KPI packs before underwriting a price.
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Updated IPO readiness, governance posture, banker feedback, and timeline for a credible liquidity event.
    whyItMatters: >-
      Exit timing materially affects holding-period risk, return expectations, and whether a premium private valuation
      can clear.
    diligencePath: >-
      Ask management and sponsors for the latest financing strategy, banker materials, and governance updates alongside
      scenario planning.
