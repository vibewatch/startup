      - ["Andrew Jones", "Co-founder", "TapCommerce co-founder background retained in independent profiles", "Product and mobile-growth origin point for the company", "Current executive remit is not described on the official about page."]
      - ["Eric Miao", "Chief Executive Officer", "Current CEO listing on Attentive's official about page", "High dependency because current strategic and operating authority appears centralized in the CEO role", "No retained announcement explains when he replaced the prior CEO."]
      - ["Brian Malkerson", "President", "Officially listed as part of current senior leadership", "Supports go-to-market and operating continuity below the CEO", "Public background is not included in the assigned pool."]
      - ["Andrew Sega", "Chief Technology Officer", "Officially listed technical lead", "Important for product platform, AI, and systems roadmap continuity", "Prior leadership history is not retained here."]
      - ["Waqas Ajaib", "Chief Financial Officer", "Officially listed finance lead", "Key dependency for financing, planning, and eventual reporting discipline", "No public commentary on capital structure or profitability is retained."]
      - ["Ned Nurick", "Chief Legal Officer", "Officially listed legal lead", "Important for messaging compliance, contracts, and governance hygiene", "No board or committee disclosure is retained alongside the role listing."]
    notes: "This is a partial public roster combining founders from independent profiles with the current executive list on Attentive's about page; it is not a complete board-and-management view."
    enumerationScope:
      coverage: partial
      basis: "Rows include publicly named founders plus current executives visible in the retained official and independent profile pages, but the source set does not disclose the full board, reporting lines, or founder role transitions."
    claimRefs: [CO002, CO005, CO006, CO007]
