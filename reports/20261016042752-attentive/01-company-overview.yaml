      - "Value / status"
      - "Date"
      - "Confidence"
      - "Gap"
    rows:
      - ["Category / stage", "Growth-stage omnichannel consumer martech platform", "2026 synthesis", "medium", "Stage is inferred from scale and product breadth rather than management labeling."]
      - ["Headquarters / offices", "New York headquarters; offices in San Francisco, London, and Sydney", "Current", "high", "Legal entity footprint is not disclosed in the assigned sources."]
      - ["Product scope", "SMS, email, RCS, push, identity resolution, and AI-assisted campaign tools", "Current", "high", "Capabilities are primarily company-described rather than independently benchmarked here."]
      - ["Employees", "Official site: 1,000+ employees; Forbes (Mar 2026): 5,000 employees", "2026", "low", "Current headcount is not reconciled across retained sources."]
      - ["Customer scale", "8,000+ brands", "2025-2026", "medium", "The count is repeated by independent profiles but not confirmed by a primary filing."]
      - ["ARR / platform activity", "Official milestone says ARR surpassed $500M in 2024; Forbes says customers sent 53B+ texts in 2024", "2024-2026", "medium", "No audited revenue, growth, or margin disclosure is public in the assigned pool."]
