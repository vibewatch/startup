      - ["Andrew Jones", "Co-founder", "Founder history matters for product strategy and institutional memory", "Confirm current title, shareholding, and any continuing product influence."]
      - ["Bain Capital Ventures", "Series A lead per retained profile", "Earliest named institutional backer", "Confirm current ownership and any pro rata or governance rights that persisted."]
      - ["Sequoia Capital", "Series B backer per retained profile", "Important follow-on validation in the company's early scale phase", "Confirm whether Sequoia still holds a board or observer role."]
      - ["Coatue", "Lead on Series D and co-lead on Series E in retained profile summaries", "Most visibly associated with the last public valuation step-up", "Confirm current ownership, preferences, and any secondary activity."]
      - ["Tiger Global", "Co-lead on Series E per retained profile", "Linked to the 2021 peak-cycle valuation", "Confirm whether later marks, secondaries, or governance rights changed after 2021."]
    notes: "This map is intentionally partial and reflects only publicly named founders and investors visible in the assigned pool; it is not a substitute for a cap table."
    enumerationScope:
      coverage: partial
      basis: "Rows are limited to stakeholders explicitly named in the retained founder, funding, and valuation sources; no primary cap-table, debt schedule, or board-rights document is included in the assigned evidence."
    claimRefs: [CO002, CO007, CO010, CO011]
figures:
  - id: FO001
    title: "Company milestone timeline"
    type: timeline
    summary: "The retained evidence shows Attentive evolving from SMS-first startup to broader AI-led messaging platform, while later-stage governance and valuation visibility remain less complete than product and funding milestones."
    data:
      items:
        - date: "2016"
          label: "Founded in New York by Brian Long and Andrew Jones"
          detail: "Independent profiles connect Attentive's origin to the TapCommerce founders and frame the early company around compliant mobile messaging."
          tone: positive
          claimRefs: [CO002]
        - date: "2018"
          label: "Series A financing brought in $13M"
          detail: "The retained funding profile marks 2018 as the first major institutional round."
          tone: positive
          claimRefs: [CO010]
        - date: "2019"
          label: "Series B added $40M as the SMS category scaled"
          detail: "Public round summaries show follow-on capital arriving before the pandemic-era ecommerce surge."
          tone: positive
          claimRefs: [CO010]
        - date: "2020"
          label: "Series C and D scaled funding to $340M+ and took valuation to unicorn territory"
          detail: "Public round summaries associate 2020 with the largest pre-Series-E step-up."
          tone: positive
          claimRefs: [CO010, CO011]
        - date: "2021"
          label: "Series E raised $470M at an approximately $7B valuation"
          detail: "This remains the last public valuation point retained in the assigned source set."
          tone: positive
          claimRefs: [CO010, CO011]
        - date: "2023"
          label: "Leadership shifted to Amit Jhawar while the company expanded its AI posture"
          detail: "Independent retained evidence places a CEO transition in 2023, setting up today's governance-readback questions."
          tone: warning
          claimRefs: [CO005, CO007]
        - date: "2024"
          label: "Official milestone log says ARR surpassed $500M"
          detail: "The same milestone set also links 2024 to broader email and AI product scale."
          tone: positive
          claimRefs: [CO008]
        - date: "2025-03"
          label: "Attentive launched U.S. RCS Business Messaging"
          detail: "The press release positioned Attentive as the only marketing company on the CTIA board and framed RCS as the next big channel shift."
          tone: opportunity
          claimRefs: [CO012]
        - date: "2026-10"
          label: "Official leadership page now lists Eric Miao as CEO"
          detail: "That current-state update is visible, but the retained source set does not include the announcement or governance narrative behind the handoff."
          tone: risk
          claimRefs: [CO006, CO007]
    approximationNotes: null
    claimRefs: [CO002, CO005, CO006, CO007, CO008, CO010, CO011, CO012]
callouts:
  - calloutType: risk
    title: "Scale is visible; governance and valuation are not."
    body: "The assigned evidence is strong enough to anchor Attentive's identity, product breadth, and historical funding cadence, but not strong enough to resolve who drove the latest CEO handoff, how the board is structured, or what price sophisticated investors would assign to the company after the 2021 peak-cycle round."
    claimRefs: [CO007, CO011, CO014]
