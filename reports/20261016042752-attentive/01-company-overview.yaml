      - ["Last public valuation", "~$7B at the 2021 Series E", "2021", "medium", "No newer public valuation or secondary-price evidence is confirmed."]
      - ["Funding raised", "Five disclosed primary rounds are listed; public total beyond those rounds remains unconfirmed", "2018-2021", "medium", "Yespress summarizes ~$893M raised, but current cap-table, debt, and any secondary proceeds are not independently confirmed."]
    notes: "Rows mix company-claimed, third-party, and inferred metrics; the gap column names where the assigned evidence stops short of a verifiable current figure."
    claimRefs: [CO001, CO003, CO004, CO008, CO009, CO011, CO013, CO015, CO016]
