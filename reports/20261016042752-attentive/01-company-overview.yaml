artifact: "company-overview"
slug: "attentive"
runDate: "2026-10-16"
company:
  name: "Attentive"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Attentive presents as a growth-stage consumer martech platform built around AI-personalized SMS, email, RCS, and push messaging, with public evidence supporting broad brand adoption and a claimed 2024 ARR milestone above $500M. The same source set also leaves two material uncertainties for later diligence: leadership appears to have changed again after March 2026, and no post-2021 valuation or cap-table evidence is publicly confirmed in the assigned pool."
sections:
  - id: "identity-scale"
    title: "Identity, footprint, and scale anchors"
    body: >
      The retained evidence consistently describes Attentive as an AI-powered
      messaging platform for consumer brands, with SMS still central but email,
      RCS, push, and identity resolution now part of the standard pitch. The
      official site positions the company as a platform for planning, sending,
      and measuring across channels, while the messaging page adds the usage-based
      commercial model and cross-channel data loop. Third-party profiles support
      meaningful operating scale, but they do not fully reconcile it: official
      materials say 1,000+ employees and four offices, whereas Forbes listed
      5,000 employees in March 2026. That gap matters because the chapter can
      safely reuse Attentive's product identity and category positioning, but
      should treat headcount and current scale metrics as directional rather than
      settled until management or primary disclosures close the difference.
    claimRefs: [CO001, CO003, CO004, CO008, CO009, CO013, CO015, CO016]
    tableRefs: [TO001]
  - id: "leadership-governance"
    title: "Leadership, founder continuity, and governance visibility"
    body: >
      Founding identity is reasonably clear: independent profiles trace Attentive
      to Brian Long and Andrew Jones in 2016 after TapCommerce. The current
      leadership picture is less clean. The official about page now names Eric
      Miao as chief executive officer and lists the rest of the senior team, but
      Forbes still showed Amit Jhawar as CEO as of March 2026, and the retained
      source set does not include the primary announcement, board explanation,
      or founder role update that would reconcile the handoff. That makes
      governance one of the chapter's biggest diligence gaps: the company can be
      described as founder-originated with an apparent professional-management
      transition, but not yet as governance-transparent.
    claimRefs: [CO002, CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: "capital-milestones"
    title: "Capital formation and milestone progression"
    body: >
      Publicly retained evidence supports a large private-capital history and a
      steady product-breadth story. Yespress summarizes five disclosed primary
      rounds totaling hundreds of millions of dollars, with the 2021 Series E
      associated with an approximately $7B valuation. Official materials then
      shift the emphasis away from financing toward product and scale milestones:
      the about page says ARR surpassed $500M, and a March 2025 press release
      framed the U.S. RCS launch as the next major messaging surface. Even so,
      current valuation, debt, secondary pricing, and control rights remain
      opaque in the assigned evidence. The company therefore looks well-funded
      and still expanding, but later chapters should not treat the last public
      financing price as a current fair value.
    claimRefs: [CO008, CO010, CO011, CO012, CO014, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
