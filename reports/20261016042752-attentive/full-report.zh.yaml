            body: >-
              公开产品页面和评价始终将 Attentive 描述为面向消费品牌的多渠道生命周期营销平台。短信仍是锚点，但电子邮件、RCS、推送和双向支持正越来越多地纳入同一买方工作流。核心模式是先增长名单并解析身份，再用 AI
