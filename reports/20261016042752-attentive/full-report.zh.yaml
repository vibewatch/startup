            body: >-
              现有来源没有提供独立分析师或行业机构给出的完整公开 TAM/SAM/SOM，因此本章改用受限的采用和可服务性视角。这些视角仍有价值。公开评价称 Attentive 已进入 20+ 个国家，拥有至少 100
              个、最多 150+ 个集成，并列出平台上的 8,000+
              个品牌。合在一起，这些数字说明其可服务版图覆盖多个地域、渠道和配套软件，当前客户基础也构成真实的采用下限。但它们不能证明多渠道商业消息市场的总金额规模，所以估值时应把这些规模证据视为方向性的适配度和渗透率数据，而不是完整市场模型。
