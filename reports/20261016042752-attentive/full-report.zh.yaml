            - CP006
        - label: Postscript
          x: 1
          'y': 5
          detail: 专注 Shopify 的 SMS 专业厂商，据引用的综述采用月付定价。
          claimRefs:
            - CP007
        - label: Omnisend
          x: 4
          'y': 5
          detail: 面向电商的全渠道套件，有免费层级并支持推送，据引用的综述所述。
          claimRefs:
            - CP008
        - label: Emotive
          x: 2
          'y': 2
          detail: 对话式 AI 加人工客服，但仍倾向年度合同。
          claimRefs:
            - CP009
        - label: SimpleTexting
          x: 1
          'y': 5
          detail: 面向 SMB 和服务业 SMS 工作流、复杂度最低的替代方案。
          claimRefs:
            - CP010
        - label: Braze
          x: 4
          'y': 2
          detail: 广度较大的成熟替代方案，但 G2 对比线索指向更慢的 ROI 和更高的成本。
          claimRefs:
            - CP016
    approximationNotes: 坐标是依据引用来源描述编制的序数评分，仅表示指定资料池中的相对广度和灵活性，不代表实测市场份额、功能完整度或总拥有成本。
