            body: >-
              Attentive 的历史融资背景足以解释当前平台版图，但过时且不完整，无法据此评估当前现金跑道。独立资料仍追溯至 2021 年 E 轮融资及超过 $800 million
              的累计融资；当前官方材料则强调推送通知、分析升级等产品持续扩张。这说明公司仍在投资扩大平台版图，但现有证据没有披露当前现金余额、烧钱速度、债务额度或下一轮融资触发条件。融资时间线可以放在公司概况章节；本章的财务判断是，仅凭公开证据无法验证未来资本充足性。
            claimRefs:
              - CI006
              - CI011
              - CI012
      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              最强证据支持这样一个判断：Attentive 是规模较大、面向企业的营销科技平台，收入质量方向上可信，但仍难以完成充分尽调。Attentive
              看起来确实有多产品引擎、广泛客户采用，以及足以搭建大型运营平台的历史融资。缺失的则是决定投资判断质量的指标：折扣和最低消费之后的实际价格、渠道或服务收入结构、毛利率、CAC 效率、流失率、客户
              集中度和当前现金跑道。在管理层财务披露填补这些缺口前，正确结论不是商业模式很弱，而是透明度明显低于形成高确信度投资逻辑所需的水平。
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.5'
        title: 图表
        blocks:
          - type: callout
            title: 定价不透明掩盖实际经济性
            body: 公开证据更清楚地呈现了合同形态，而非实际经济性。报价制、最低承诺和据报的超额费用可以与强劲收入质量并存，但没有管理层数据，外部人士仍无法评估真实 ARPA、折扣和利润率。
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI009
          - type: callout
            title: 规模信号真实，但资本充足性仍未验证
            body: Attentive 看起来是一个已有规模的平台，而不是早期试验；但本章公开记录始终没有触及当前现金、烧钱速度或债务。这足以支持“规模可信”的结论，却不足以评估现金跑道。
            calloutType: insight
            claimRefs:
