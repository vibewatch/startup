    columns:
      - 立场
      - 论点
      - 哪些事实会改变判断
    rows:
      - - 投资逻辑
        - 平台广度如今覆盖 SMS、电子邮件、RCS 和推送，可在现有品牌中扩大钱包份额。
        - 如果经验证的数据表明跨渠道广度能改善留存、毛利率和增购，投资逻辑会更强。
      - - 投资逻辑
        - 据报道，公司 ARR 约为 $500M，客户超过 8,000 家，说明公司具备退出相关性，也仍在持续投入运营。
        - 新鲜的经审计增长、NRR 和利润率披露，才能把规模叙事转化为估值锚点。
      - - 反向逻辑
        - 最近一次清晰的公开估值基准已经过时，而且按当时收入计算本就带有溢价。
        - 如果出现条款审慎的新一轮融资或老股交易，价格讨论的基准可能重置。
      - - 反向逻辑
        - 独立评价仍指出定价不透明、上线复杂、集成摩擦，以及报告和支持响应参差不齐。
        - 如果有可供参考的队列数据证明部署更快、支持更顺畅、扩张能力更强，这一担忧会减弱。
    notes: 各行将最有力的正面和负面保留证据，与改变建议所需的具体证明配对。
