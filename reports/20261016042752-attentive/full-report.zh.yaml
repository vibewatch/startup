  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据支持从名单增长和编排到可计费消息量的商业链条，但没有支持量化抽成率或利润率桥接。
    data:
      nodes:
        - label: 订阅者获取
          detail: AI Grow 和注册工具提升消费品牌的 SMS 与电子邮件名单获取。
        - label: 身份与分群
          detail: 行为数据和身份解析将跨渠道受众统一起来。
        - label: 活动编排
          detail: AI 辅助旅程跨 SMS、电子邮件、RCS 和推送选择受众、时间和内容。
        - label: 消息发送
          detail: 跨渠道发送形成底层可计费活动基础。
        - label: 转化归因
          detail: Attentive 向客户营销转化、支出和 ROI 改善。
        - label: 平台收入和毛利
          detail: 收入按报价确定并受合同约束；毛利取决于未披露的运营商、支持和服务成本。
      edges:
        - from: Subscriber acquisition
          to: Identity and segmentation
          label: 新增选择加入扩大可触达受众
        - from: Identity and segmentation
          to: Campaign orchestration
          label: 客户信号为定位和时机提供信息
        - from: Campaign orchestration
          to: Message delivery
          label: 更协调的活动推动渠道使用
        - from: Message delivery
          to: Conversion attribution
          label: 绩效报告为客户 ROI 说法提供锚点
        - from: Conversion attribution
          to: Platform revenue and gross profit
          label: 报价合同将规模、使用量和扩张变现
    approximationNotes: 顺序和标签均有来源支撑；指定资料池没有公开证据支持量化转化或毛利瀑布图。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI009
  - id: FE001
    title: 以身份为核心的营销架构图
    type: stack
    summary: 公开证据指向一套分层模型：从同意获取和身份开始，再叠加 AI 决策、旅程、渠道和控制措施。
    data:
      layers:
        - label: 同意与获取
          detail: 双击注册单元和 AI Grow 扩大已选择加入的 SMS / 电子邮件受众。
          modules:
            - label: 双击注册
            - label: AI Grow
        - label: 身份与受众状态
          detail: Single Customer ID / Attentive Signal 统一跨渠道的客户行为。
          modules:
            - label: Single Customer ID
            - label: Attentive Signal
        - label: AI 决策和内容
          detail: AI Essentials、AI Pro 和智能体 AI 个性化文案、时机和受众。
          modules:
            - label: AI Essentials
            - label: AI Pro
            - label: Agentic AI
        - label: 旅程编排
          detail: AI Journeys 和活动排期根据行为触发生命周期流程。
          modules:
            - label: AI Journeys
            - label: 活动排期
        - label: 渠道执行
          detail: SMS、电子邮件、RCS、推送和礼宾式支持作为协同触点运行。
          outputs:
            - label: SMS
            - label: Email
            - label: RCS
            - label: Push
            - label: Concierge
        - label: 衡量与控制
          detail: 分析、合规工具和送达能力构成共享控制层。
          outputs:
            - label: Analytics dashboard
            - label: Compliance tooling
            - label: Deliverability controls
    approximationNotes: 这是根据公开产品描述推断的逻辑堆栈，并非披露的软件架构图。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE010
      - CE013
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 可见的客户推进从规模化 SMS 需求开始，经集成渠道和数据扩展，最终到达公开指标无法说明的续约决策。
    data:
      items:
        - label: 筛选有规模的消费品牌
          stage: 评估
          actor: CRM 或留存负责人
          touchpoints:
            - 订阅者和消息量
            - 定制定价讨论
          note: 生命周期消息已经具备战略价值的客户，适配度最强。
        - label: 接入电商数据
          stage: 实施
          actor: CRM 和电商运营
          touchpoints:
            - 电商与支持集成
            - 行为和身份信号
          note: 当前招聘重点强调集成采用和运营落地。
        - label: 激活订阅者增长
          stage: 上线
          actor: 生命周期营销人员
          touchpoints:
            - 双击注册
            - 名单增长和受众分群
          note: Attentive 将订阅者识别定位为初始采用入口。
        - label: 运行协同旅程
          stage: 生产
          actor: CRM 团队
          touchpoints:
            - SMS 和电子邮件旅程
            - 个性化时机和内容
          note: Sigma 为这一阶段的生产环境使用提供直接证据。
        - label: 扩展渠道和 AI
          stage: 扩张
          actor: 营销负责人
          touchpoints:
            - RCS 和推送
            - AI Pro 和额外集成
          note: 模块扩展清晰可见，但存量基础渗透率并未披露。
        - label: 续约或整合
          stage: 持久性
          actor: 营销负责人和采购部门
          touchpoints:
            - 绩效评估
            - 定价、报告、支持和集成评估
          note: 留存和集中度指标未公开披露。
    approximationNotes: 各阶段综合指定证据，仅表示顺序；这不是实测漏斗，也不暗示转化率。
    claimRefs:
      - CU003
      - CU004
      - CU010
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险是商业僵化、集成摩擦和对合规敏感的自动化，而不是当前已有记录的公开执法事件。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
        - label: 剩余严重程度
      rows:
        - label: 定价 / 合同僵化
          note: 独立评价来源中证据最充分的风险。
          values:
            - label: 高
            - label: 高
            - label: 低—中
            - label: 高
        - label: 集成 / 报告摩擦
          note: 同步、上线或归因工作流出现延误时，执行风险会上升。
          values:
            - label: 中—高
            - label: 高
            - label: 中
            - label: 高
        - label: 合规 / AI 治理
          note: 控制措施已有记录，但指定资料池中的公开第三方验证有限。
          values:
            - label: 中
            - label: 高
            - label: 中
            - label: 中—高
        - label: 跨境合规复杂度
          note: 在 20 多个国家运营，扩大了必须正确实施的本地规则集数量。
          values:
            - label: 中
            - label: 高
            - label: 中
            - label: 中—高
        - label: 替代 / 工作流适配风险
          note: 替代方案强调透明定价和更强的对话式工作流。
          values:
            - label: 中
            - label: 中—高
            - label: 中
            - label: 中
        - label: 企业级规模客户依赖
          note: 溢价定价似乎最适合规模化电商品牌，但集中度和续约数据属于私有信息。
          values:
            - label: 中
            - label: 高
            - label: 低—中
            - label: 中—高
    claimRefs:
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议保持价格纪律：可信的规模和产品广度，被过时的估值锚点与尚未解决的执行摩擦抵消。
    data:
      nodes:
        - id: scale
          label: 规模证明
          detail: 公开证据支持约 8,000+ 家客户，以及约 2024 年接近 $500M 的 ARR。
        - id: breadth
          label: 全渠道广度
          detail: SMS、电子邮件、RCS 和推送打包销售，支撑平台广度。
        - id: investment
          label: 持续投入
          detail: 2025 年发布和 2026 年招聘表明产品与 GTM 支出仍在继续。
        - id: friction
          label: 执行摩擦
          detail: 独立评价仍指出上线、定价、集成和报告方面存在摩擦。
        - id: price
          label: 过时的价格锚点
          detail: 此处保留的最有力公开估值标记，仍围绕 2021 年约 $6.9B 的估值。
        - id: recommendation
          label: 继续研究
          detail: 在当前利润率、留存和条款披露缺失的情况下，入场纪律应保持严格。
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: investment
        - from: investment
          to: friction
        - from: friction
          to: price
        - from: price
          to: recommendation
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV011
      - CV015
      - CV016
