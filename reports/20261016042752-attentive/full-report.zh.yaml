        - 私有尽调确认增长持久、毛利率健康、留存强劲，且不存在惩罚性优先权拖累；2025-2026 年的产品投入转化为更高的钱包份额。
        - 这可能足以支持以不低于最近一次披露的公开估值买入，并判断公司通往 IPO 或战略退出的路径会更短。
        - 执行摩擦持续存在，或移动渠道需求在经营杠杆显现前走弱。
        - 需要保留的公开资料之外的最新私有证据。
      - - 基准
        - ARR 规模真实存在，产品广度有价值，但当前经济性和融资条款仍只能部分看清。
        - 最佳做法是加入观察名单，或只有在相对过时公开估值有明显折价时才谨慎入场。
        - 持有期拉长，公开市场时点仍不确定。
        - 与当前公开证据最一致。
      - - 悲观
        - 增长放缓，独立摩擦拉长价值实现时间，且融资条款证明对投资者并不像假设中那样友好。
        - 下轮降价融资或长期持有风险压过平台广度带来的上行空间。
        - 倍数压缩、退出延迟和条款堆叠拖累。
        - 尽调期间留存或利润率证明疲弱时触发。
