        title: 资本形成与里程碑进展
        blocks:
          - type: paragraph
            body: >
              公开留存证据显示，公司有较大规模的私募融资历史，产品版图也在稳步扩张。Yespress 汇总了五轮已披露的新股融资，总额达数亿美元；2021 年 E 轮对应估值约
              $7B。此后，官方材料将重点从融资转向产品和规模里程碑：关于页面称 ARR 已超过 $500M，2025 年 3 月的新闻稿则将美国 RCS
              上线定位为下一块主要消息阵地。不过，在现有证据中，当前估值、债务、老股价格和控制权仍不透明。因此，公司看起来资金充足且仍在扩张，但后续章节不应把最近一次公开融资价格当作当前公允价值。
