  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与排除支出
        blocks:
          - type: paragraph
            body: >-
              Attentive 的公开产品和第三方评价始终将其放在消费品牌外发消息，而不是整个营销软件市场中。相关边界是覆盖短信、电子邮件、RCS
              和推送的跨渠道生命周期及促销消息，并在这些渠道外包裹身份解析、分群、合规和触发式旅程。因此，本章应纳入留存和商业消息工作流相关支出，但排除通用 B2B 培育自动化、没有电商重点的广义 CRM 套件，以及可能与
              Attentive 集成却不属于其核心任务的邻近支持软件。主要替代方案不只是直接短信竞争者，也包括用不同工具分别运行这些渠道、再手工拼接受众的现状。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              证据显示，实际买方中心是电商、CRM 和留存团队。Attentive 列出的集成主要围绕电商平台、忠诚度工具、退货软件、客服工具和数据系统，说明预算通常掌握在以收入为导向的数字营销或生命周期负责人手中，而不是独立
              IT 管理员。现有使用场景也集中在外发消息已成为重要收入杠杆的品牌：重度使用 Shopify
              的中小及中型商家、大型全渠道零售商，以及服饰、美妆、食品饮料、旅游和娱乐等消费品类。公开评价还给出一个重要的收窄信号：名单较小或月收入较低的团队被认为不太适合，因此可采用市场同时受工作流复杂度和预算承受力约束。
            claimRefs:
