              年报告了这一数字。同时，留存证据中最近一个清晰的公开估值锚是 Sacra 的 2021 年 $6.90 billion，按其说法相当于 2021 年 $125 million 收入的 55.2
              倍。这是昂贵的历史基准，不是当前定价证明。公开证据确实显示公司仍在投资：Attentive 2025 年的发布增加了推送通知、AI 个性化升级和重建的分析仪表盘；2026
              年招聘信息仍强调定价纪律、佣金设计、上线准备、合作伙伴工作流和运营规模。这些是良好的运营信号，但如果没有当前利润率、NRR、增长或融资条款的新披露，就不足以证明旧的高溢价仍然合理。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 情景、退出时点与尽调要求
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：如果私有尽调显示 Attentive
              报告的规模能够转化为持久增长、有吸引力的毛利率、强劲留存和干净的融资条款，那么更广的产品套件和运营势头仍可能支持以不低于最近披露价格的估值买入。基准情景更谨慎，也更符合当前公开证据：这是一家已有规模且产品覆盖相关的私营公司，但在当前经济性和条款结构得到验证前，入场价格应保持纪律。悲观情景集中在价格不透明、价值实现延迟和退出延期。Wikipedia
              称公司推迟了原本考虑在 2024 年进行的 IPO，而独立评价仍指向上线、集成和支持/报告摩擦。最终尽调因此应少关注产品故事，多关注当前增长质量、客户留存、股权结构悬置和下行保护。
            claimRefs:
              - CV008
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 继续研究，而非买入
            body: Attentive 在战略上具有相关性，但在没有对当前增长质量、利润率、留存和融资条款进行新一轮尽调前，公开证据不足以支持相对于旧高溢价估值支付更高价格。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV013
              - CV014
              - CV016
          - type: callout
            title: 真实规模与更广的产品范围
            body: 报告称 ARR 接近 $500M，客户数为 8,000+，产品覆盖短信、电子邮件、RCS 和推送，这使 Attentive 成为一个可信的规模化平台，而不是早期产品故事。
            calloutType: strength
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV015
          - type: callout
            title: 价格不透明与执行拖累是主要下行风险
            body: 独立评价仍描述了价格不透明、集成/上线摩擦，以及报告或支持响应不一；公开退出时间表也已经延期过一次。
            calloutType: risk
            claimRefs:
              - CV008
              - CV013
              - CV014
