        title: 领导层、创始人延续性与治理透明度
        blocks:
          - type: paragraph
            body: >
              创始脉络相对清楚：独立资料显示，TapCommerce 之后，Brian Long 和 Andrew Jones 于 2016 年创办 Attentive。当前领导层则没那么清晰。官网关于页面现列 Eric
              Miao 为 CEO，并列出其他高管；但 Forbes 截至 2026 年 3 月仍显示 Amit Jhawar 为
              CEO。留存来源没有一手公告、董事会说明或创始人角色更新来解释这次交接。因此，治理透明度是本章最大的尽调缺口之一：可以把公司描述为源自创始人、显然正在转向职业经理人管理，但还不能称其治理透明。
