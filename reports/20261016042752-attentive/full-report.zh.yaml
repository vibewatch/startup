        title: 公开客户版图以规模化消费品牌为中心
        blocks:
          - type: paragraph
            body: >
              Attentive 自己的招聘文案称，公司服务超过 70 个行业的 8,000+ 名客户；Wikipedia 则单独报告有 8,000+
              家企业使用该软件。这些数字方向一致，但没有说明分母指的是已签约、付费、活跃还是当前正在发送消息的品牌。同一份公司材料列出 Crate and Barrel、Urban Outfitters 和
              Carter's，提供了知名客户参考，却没有透露合同规模或部署范围。


              产品和评价证据比客户总数更清楚地揭示了细分模式。Attentive 面向协调短信、电子邮件、RCS 和推送的零售、电商、食品饮料、旅游及娱乐营销团队。可能的买方和付款方是
              CRM、留存、电商或营销负责人；日常用户则是生命周期营销人员和 CRM 运营人员。报价制、与使用量挂钩的定价以及客户经理式支持，说明它更适合中型市场和企业项目，而不是寻求简单自助短信产品的团队。
