        title: 商业刚性是证据最充分的近期风险
        blocks:
          - type: paragraph
            body: >-
              独立评价基本形成了一个简单结论：Attentive 对规模化电商项目可能很强，但与自助替代方案相比，更难预算、更难退出，也更难比较。官方产品页确认订阅者、消息、渠道和高级 AI
              产品均按使用量计价；评价来源还补充了更棘手的运营细节：季度最低消费、附加费、回复费用，以及至少一条评价中的排他性条款和提前终止罚金。如果买方高估短信量、无法证明增量，或需要快速更换供应商，这种组合会带来真实下行风险。对投资者而言，这一点重要，因为同一套帮助大品牌变现的商业设计，也可能限制价格敏感或低量客户的
              TAM，并在业绩走弱时让净留存更容易受到采购反弹影响。
