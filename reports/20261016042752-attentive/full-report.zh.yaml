    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、业务版图与规模锚点
        blocks:
          - type: paragraph
            body: >
              留存证据始终将 Attentive 描述为面向消费品牌的 AI
              消息平台。短信仍是核心，但电子邮件、RCS、推送和身份解析已成为标准叙事的一部分。官网将其定位为跨渠道规划、发送和衡量的平台，消息页面则补充了按使用量计价的商业模式和跨渠道数据闭环。第三方资料支持其具备一定运营规模，但数字并未完全对齐：官方材料称有
              1,000+ 名员工和四个办公室，而 Forbes 在 2026 年 3 月列出 5,000 名员工。因而本章可以稳妥采用 Attentive
              的产品身份和品类定位，但在管理层或一手披露弥合差异前，员工数和当前规模只能视为方向性指标。
