  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有来源支持的是广泛竞争集合，而非单一直接同业名单。G2 的替代方案页面将 Attentive 与 Braze、Klaviyo、Omnisend、SimpleTexting
              及其他短信/移动营销工具并列；即使这不是市场份额排名，也能反映买方行为。Wiser 2026 年综述将最相关的公开替代方案收窄为
              Klaviyo、Postscript、Omnisend、Emotive、SimpleTexting、TxtCart 和 GoHighLevel，并分别对应更低入门价格、Shopify
              专项能力或更简单的合同结构等取舍。公开来源对软件替代方案覆盖较好，但对内部自建、既有 ESP 加短信技术栈或代理商运营的定制工作流证据较弱，因此这些仍是部分尽调领域，而不是已被证伪的替代方案。
