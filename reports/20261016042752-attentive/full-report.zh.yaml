            body: >-
              Attentive 确实有实质性的公开治理表述：其 AI 治理文章明确提到 TCPA、GDPR、CAN-SPAM、Quiet
              Hours、消息频率上限、基于角色的权限、允许名单、审批闸门、沙盒和审计轨迹。这是积极信号，说明公司认识到客户侧自动化若缺乏约束，会带来法律、隐私和声誉风险。风险不在于完全没有控制，而在于这些控制似乎取决于配置质量、访问设计，以及客户和
              Attentive 团队的持续监督。公开评价还将产品放在 20+
