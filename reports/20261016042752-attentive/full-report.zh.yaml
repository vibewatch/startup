      - number: '2.4'
        title: 增长驱动、约束与未决缺口
        blocks:
          - type: paragraph
            body: >-
              留存证据中的采用驱动因素较为一致：高互动移动消息、基于身份的个性化、AI
              辅助的营销活动优化，以及用一个平台编排多渠道的便利性。同一批证据也说明，市场并非没有摩擦。定制定价、多轮销售沟通、复杂的上线流程，以及对低量或非消费场景适配较弱，都会拖慢采用，并限制能够为该平台买单的客户。最大的未决缺口是，没有任何留存来源以独立且方法充分的方式估算
              Attentive 真实市场边界内的支出。因此，在管理层或外部研究说明当前产品范围究竟能触达多少商业留存支出前，市场规模主张应保持保守。
            claimRefs:
              - CM004
              - CM013
              - CM014
