      - number: '3.3'
        title: 定价压力、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              现有来源中最强的反向信号来自商业而非技术。Wiser 认为，Attentive 的季度最低消费、运营商转嫁费用和续约结构，使其成为企业规模以下品类中入门价格最高的选择；Toolradar
              也认为，该产品更适合营销预算充足且能接受合同约束的企业。Klaviyo、Postscript、Omnisend 和 SimpleTexting
              正是从这里发起攻击：提供更低或免费的入门层级、更清晰的自助经济性和更轻的承诺。同一合同结构也会制造锁定：品牌一旦围绕 Attentive
              建好旅程、积累名单并习惯高触达支持，就更难离开。因此护城河确实存在，但部分带有强制性：对规模化电商运营商较耐久；当买方重新评估总成本和灵活性，并与透明替代方案比较时则会暴露脆弱性。
