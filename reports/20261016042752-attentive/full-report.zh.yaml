      - number: '3.2'
        title: Attentive 仍有差异化的地方
        blocks:
          - type: paragraph
            body: >-
              Attentive 的差异化，重点不在于成为最便宜的直接短信工具，而在于减少规模化消费品牌的编排工作。官方页面称，一个平台即可覆盖短信、电子邮件、RCS 和推送，并提供 AI
              驱动的发送时间、受众、文案和旅程工具；消息页面还称每月收发消息超过 10 亿条。独立综述普遍认可其平台覆盖广、适合企业使用，G2 评价汇总也将易用性、分群和支持列为真实优势。主要保留意见是：至少一名从
              Klaviyo 转到 Attentive 的买方仍认为 Klaviyo 的高度定制化、数据驱动分群和预测分析能力更强。这说明 Attentive
              的产品优势在广泛编排和服务模式，而非在每个工作流基础能力上都绝对领先。
