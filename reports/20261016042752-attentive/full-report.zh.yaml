              产品。收入逻辑大致清楚：品牌购买跨多个渠道的客户获取、编排和消息发送能力；公开评价称合同按名单规模和发送消息量报价，而非采用公开价目表。最有价值的反向定价证据还显示存在最低消费承诺和超额费用，因此公开定价信息不足以推断实际
