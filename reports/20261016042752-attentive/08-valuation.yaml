      - [Risk rating, high, "Opaque pricing, implementation friction, and uncertain exit timing raise execution and mark-to-market risk.", "Require downside protection and milestone-based diligence."]
      - [Valuation stance, stretched, "Sacra's last public mark is ~$6.9B and it says that mark implied a 55.2x multiple on 2021 revenue.", "Only pay up if updated private evidence clearly supports the premium."]
    notes: >-
      Synthesizes retained public evidence; ratings are analyst judgments built from the cited
      claims rather than direct source labels.
    claimRefs: [CV001, CV002, CV004, CV005, CV013, CV014, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Platform breadth now spans SMS, email, RCS, and push, supporting wallet-share expansion with existing brands.", "Verified data showing that cross-channel breadth improves retention, gross margin, and upsell would strengthen the case."]
      - [Thesis, "Reported scale of roughly $500M ARR and 8,000+ customers suggests the company is exit-relevant and still operationally investing.", "Fresh audited growth, NRR, and margin disclosure would convert scale from a narrative to a valuation anchor."]
      - [Anti-thesis, "The last clear public valuation benchmark is old and was already premium on then-current revenue.", "A newer financing or secondary mark at disciplined terms could reset the price debate."]
      - [Anti-thesis, "Independent reviews still flag opaque pricing, onboarding complexity, integration friction, and mixed reporting/support responsiveness.", "Referenceable cohort data showing faster deployment, cleaner support, and stronger expansion would reduce this concern."]
    notes: >-
      Rows pair the strongest retained positive and negative evidence with the specific proof
      needed to move the recommendation.
    claimRefs: [CV002, CV005, CV006, CV008, CV011, CV013, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Private diligence confirms durable growth, healthy gross margins, strong retention, and no punitive preference overhang; 2025-2026 product investment converts into higher wallet share.", "Could justify paying at or above the last disclosed public mark and underwriting a shorter path to IPO or strategic exit.", "Execution friction persists or mobile-channel demand softens before operating leverage arrives.", "Requires fresh private evidence beyond the retained public pool."]
      - [Base, "ARR scale is real, product breadth matters, but current economics and financing terms remain only partially visible.", "Best posture is watchlist or disciplined entry only at a meaningful discount to stale public marks.", "Hold period extends and public-market timing remains uncertain.", "Most consistent with current public evidence."]
      - [Bear, "Growth decelerates, independent frictions slow time-to-value, and financing terms prove less investor-friendly than assumed.", "Down-round or long-duration hold risk dominates upside from platform breadth.", "Multiple compression, delayed exit, and term-stack overhang.", "Triggered by weak retention or margin proof during diligence."]
    notes: >-
      Scenario ranges are qualitative because the retained public pool does not disclose current
      cap-table terms, secondary pricing, or a full 2025-2026 financial stack.
    claimRefs: [CV002, CV008, CV009, CV011, CV013, CV014, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays price-disciplined: credible scale and product breadth are offset
      by stale valuation anchors and unresolved execution friction.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: Public evidence supports ~8,000+ customers and ~2024 ARR near $500M.
        - id: breadth
          label: Omnichannel breadth
          detail: SMS, email, RCS, and push are sold together, supporting platform breadth.
        - id: investment
          label: Ongoing investment
          detail: 2025 launches and 2026 hiring indicate continued product and GTM spend.
        - id: friction
          label: Execution friction
          detail: Independent reviews still flag onboarding, pricing, integration, and reporting friction.
        - id: price
          label: Stale price anchor
          detail: The strongest public valuation marker retained here still centers on the 2021 ~$6.9B mark.
        - id: recommendation
          label: Research-more
          detail: Without current margin, retention, and term disclosure, entry discipline should stay tight.
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: investment
        - from: investment
          to: friction
        - from: friction
          to: price
        - from: price
          to: recommendation
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV011, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: >-
      Attentive looks strategically relevant, but public evidence does not justify paying up
      against an old premium valuation mark without fresh diligence on current growth quality,
      margins, retention, and financing terms.
    claimRefs: [CV001, CV002, CV005, CV013, CV014, CV016]
  - calloutType: strength
    title: Real scale and broader product scope
    body: >-
      Reported ARR near $500M, 8,000+ customers, and product coverage across SMS, email, RCS,
      and push make Attentive a credible scaled platform rather than an early product story.
    claimRefs: [CV004, CV005, CV006, CV015]
  - calloutType: risk
    title: Price opacity and execution drag are the main downside
    body: >-
      Independent reviews still describe opaque pricing, integration/onboarding friction, and
      mixed reporting or support responsiveness, while public exit timing already slipped once.
    claimRefs: [CV008, CV013, CV014]
