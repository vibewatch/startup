  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-terms
      missingEvidence: Current primary-source financing terms, valuation marks, investor rights, liquidation preferences, and any 2024-2026 secondary pricing.
      whyItMatters: Public valuation support remains anchored to an old premium mark, so term-stack details determine real downside and whether any current entry is investable.
      diligencePath: Request the latest financing documents, cap table, board materials, and any secondary transaction summaries from management or lead investors.
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: Current audited ARR, growth, gross margin, free cash flow, net revenue retention, and customer concentration.
      whyItMatters: Without current economics, the report can frame scenarios but cannot support a precise comp multiple or target-return model.
      diligencePath: Request audited FY2024-FY2025 financials, cohort retention data, and board KPI packs before underwriting a price.
    - type: private-evidence-only
      severity: material
      topic: exit-readiness
      missingEvidence: Updated IPO readiness, governance posture, banker feedback, and timeline for a credible liquidity event.
      whyItMatters: Exit timing materially affects holding-period risk, return expectations, and whether a premium private valuation can clear.
      diligencePath: Ask management and sponsors for the latest financing strategy, banker materials, and governance updates alongside scenario planning.
