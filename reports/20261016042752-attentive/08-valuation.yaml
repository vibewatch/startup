company:
  name: Attentive
chapter:
  number: 8
  title: Valuation
  summary: >-
    Attentive's retained public evidence still supports meaningful scale and product breadth:
    third-party sources place 2024 ARR around $500 million, company-issued materials cite
    8,000+ customers, and the platform now spans SMS, email, RCS, and push. The problem is
    price discipline rather than company relevance, because the latest public valuation anchor
    remains the 2021 ~$6.9 billion mark while current margin, retention, and cap-table terms
    stay undisclosed and independent reviews still flag onboarding, reporting, and pricing
    friction.
sections:
  - id: recommendation-frame
    title: Recommendation and price discipline
    body: |-
      The evidence supports a **research-more** posture rather than a buy call. Public sources
      support that Attentive is a scaled, strategically relevant omnichannel marketing platform:
      third-party coverage places 2024 ARR near $500 million, company-issued materials say it
      works with more than 8,000 customers across 70+ industries, and the product scope now
      spans SMS, email, RCS, and push. Those are real strengths, but they do not answer the
      pricing question on their own. The retained public valuation anchor is still the old
      2021-era mark, while current growth quality, margins, retention, and financing terms are
      not publicly substantiated in this pool. Independent reviews also keep surfacing
      commercialization friction around opaque pricing, onboarding, integration, and reporting,
      which makes it hard to underwrite a premium entry multiple from public evidence alone.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV012, CV013, CV015, CV016]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: valuation-context
    title: Public valuation support is stale relative to current operating signals
    body: |-
      The strongest public scale signal is that Sacra estimates Attentive reached $500 million
      of ARR by the end of 2024, which Wikipedia separately says the company reported in 2025.
      At the same time, the last clear public valuation anchor in the retained evidence is
      Sacra's $6.90 billion 2021 mark, which it says equated to a 55.2x multiple on $125
      million of 2021 revenue. That is a rich historical benchmark, not a current pricing
      proof. Public evidence does show continuing investment: Attentive's 2025 release added
      push notifications, AI-personalization upgrades, and a rebuilt analytics dashboard, while
      2026 job postings still emphasize pricing discipline, commission design, launch
      readiness, partner workflows, and operating scale. Those are good operating signals, but
      without fresh disclosure on current margins, NRR, growth, or financing terms, they are
      insufficient to prove that the old premium mark remains justified.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV007, CV008, CV009, CV010, CV011, CV014]
  - id: scenarios-and-diligence
    title: Scenarios, exit timing, and diligence asks
    body: |-
      The bull case is straightforward: if private diligence shows that Attentive's reported
      scale converts into durable growth, attractive gross margins, strong retention, and clean
      financing terms, then the company's broader product suite and operating momentum could
      still support paying at or above the last disclosed mark. The base case is more cautious
      and better aligned with public evidence today: a scaled private company with relevant
      product breadth, but one whose entry price should remain disciplined until current
      economics and term stack are verified. The bear case centers on price opacity, delayed
      value realization, and exit slippage. Wikipedia says the company postponed an IPO it had
      considered for 2024, and independent reviews still point to onboarding, integration, and
      support/reporting friction. Final diligence should therefore focus less on product story
      and more on present-day growth quality, customer retention, cap-table overhang, and
      downside protection.
    claimRefs: [CV008, CV011, CV013, CV014, CV016]
    tableRefs: [TV003]
tables:
