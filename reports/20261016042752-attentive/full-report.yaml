  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The visible customer motion begins with scaled SMS needs, expands through integrated channels and data, and
      reaches a renewal decision that public metrics do not illuminate.
    data:
      items:
        - label: Qualify scaled consumer brand
          stage: Evaluation
          actor: CRM or retention leader
          touchpoints:
            - Subscriber and message volume
            - Custom pricing discussion
          note: Fit is strongest where lifecycle messaging already carries strategic value.
        - label: Connect commerce data
          stage: Implementation
          actor: CRM and ecommerce operations
          touchpoints:
            - Ecommerce and support integrations
            - Behavior and identity signals
          note: Current hiring emphasizes integration adoption and operationalization.
        - label: Activate subscriber growth
          stage: Launch
          actor: Lifecycle marketer
          touchpoints:
            - Two-tap sign-up
            - List growth and audience segmentation
          note: Attentive positions subscriber recognition as an initial adoption surface.
        - label: Run coordinated journeys
          stage: Production
          actor: CRM team
          touchpoints:
            - SMS and email journeys
            - Personalized timing and content
          note: Sigma provides direct evidence of production use at this stage.
        - label: Expand channels and AI
          stage: Expansion
          actor: Marketing leadership
          touchpoints:
            - RCS and push
            - AI Pro and additional integrations
          note: Module expansion is visible, but installed-base penetration is not.
        - label: Renew or consolidate
          stage: Durability
          actor: Marketing leadership and procurement
          touchpoints:
            - Performance review
            - Pricing, reporting, support, and integration assessment
          note: Retention and concentration metrics are not publicly disclosed.
    approximationNotes: >-
      Stages synthesize the assigned evidence and indicate sequence only; they are not a measured funnel and imply no
      conversion rate.
    claimRefs:
      - CU003
      - CU004
      - CU010
      - CU013
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual risks are commercial rigidity, integration friction, and compliance-sensitive automation
      rather than a currently documented public enforcement event.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
        - label: Residual severity
      rows:
        - label: Pricing / contract rigidity
          note: Best-evidenced risk across independent review sources.
          values:
            - label: High
            - label: High
            - label: Low-Medium
            - label: High
        - label: Integration / reporting friction
          note: Execution risk rises when sync, onboarding, or attribution workflows slip.
          values:
            - label: Medium-High
            - label: High
            - label: Medium
            - label: High
        - label: Compliance / AI governance
          note: Controls are documented, but public third-party validation is limited in the assigned pool.
          values:
            - label: Medium
            - label: High
            - label: Medium
            - label: Medium-High
        - label: Cross-border compliance complexity
          note: Operating across 20+ countries expands the number of local rule sets that must be implemented correctly.
          values:
            - label: Medium
            - label: High
            - label: Medium
            - label: Medium-High
        - label: Substitution / workflow-fit risk
          note: Alternatives emphasize transparent pricing and stronger conversation workflows.
          values:
            - label: Medium
            - label: Medium-High
            - label: Medium
            - label: Medium
        - label: Enterprise-volume customer dependence
          note: >-
            Premium pricing appears best suited to scaled ecommerce brands, but concentration and renewal data are
            private.
          values:
            - label: Medium
            - label: High
            - label: Low-Medium
            - label: Medium-High
    claimRefs:
      - CR011
      - CR013
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays price-disciplined: credible scale and product breadth are offset by stale valuation
      anchors and unresolved execution friction.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: Public evidence supports ~8,000+ customers and ~2024 ARR near $500M.
        - id: breadth
          label: Omnichannel breadth
          detail: SMS, email, RCS, and push are sold together, supporting platform breadth.
        - id: investment
          label: Ongoing investment
          detail: 2025 launches and 2026 hiring indicate continued product and GTM spend.
        - id: friction
          label: Execution friction
          detail: Independent reviews still flag onboarding, pricing, integration, and reporting friction.
        - id: price
          label: Stale price anchor
          detail: The strongest public valuation marker retained here still centers on the 2021 ~$6.9B mark.
        - id: recommendation
          label: Research-more
          detail: Without current margin, retention, and term disclosure, entry discipline should stay tight.
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: investment
        - from: investment
          to: friction
        - from: friction
          to: price
        - from: price
          to: recommendation
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV011
      - CV015
      - CV016
