              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and open gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are relatively consistent across the retained evidence: high-engagement mobile messaging,
              identity-aware personalization, AI-assisted campaign optimization, and the convenience of orchestrating
              multiple channels from one platform. The same evidence also highlights why the market should not be
              treated as frictionless. Custom pricing, multi-call sales, onboarding complexity, and weaker fit for
              low-volume or non-consumer use cases all slow adoption and limit who can justify the platform. The most
              material unresolved gap is that none of the retained sources provide an independent, methodology-rich
              estimate of included spend for Attentive's true market boundary, so market-size claims should stay
              conservative until management or outside research can show how much commerce-retention spend is actually
              reachable at the company's current product scope.
            claimRefs:
              - CM004
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Serviceability is broad, but addressability is narrower
            body: >-
              Attentive can operate across many channels, integrations, and geographies, yet the public fit signals
              consistently narrow the practical market to consumer brands with enough message volume and budget to
              tolerate custom pricing.
            calloutType: insight
            claimRefs:
              - CM002
              - CM008
              - CM011
              - CM012
          - type: callout
            title: Market-size confidence is limited by missing independent TAM evidence
            body: >-
              The retained pool is good enough to bound product scope and buyer fit, but not to prove the full dollar
              size of included commerce-messaging spend; any market-upside claim should therefore stay conservative.
            calloutType: risk
            claimRefs:
