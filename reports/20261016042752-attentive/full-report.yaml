  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Attentive's public and independent coverage consistently describe an omnichannel messaging platform that
              monetizes SMS, email, RCS, and push for larger consumer brands rather than a transparent self-serve SaaS
              product. The revenue mechanism is visible at a high level: brands buy access to customer acquisition,
              orchestration, and message delivery across multiple channels, and public reviews say contracts are quoted
              off list size and messages sent rather than a published rate card. The most useful adverse pricing
              evidence also indicates minimum-spend commitments and overage penalties, which means the public
              list-pricing picture is not enough to infer realized ARPA, net retention, or contribution margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI008
              - CI009
