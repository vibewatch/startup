  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >-
              The assigned sources support a broad competitive set rather than a single direct-peer list. G2's
              alternative page places Attentive alongside Braze, Klaviyo, Omnisend, SimpleTexting, and other
              SMS/mobile-marketing tools, which is a useful buyer-behavior signal even if it is not a market-share
