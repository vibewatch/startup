      - number: '5.2'
        title: Architecture, integration, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The public architecture story centers on customer identity plus orchestration rather than on exposed
              infrastructure primitives. Attentive and third-party reviews describe a Single Customer ID or Attentive
              Signal layer that links subscriber behavior across channels, then uses AI and journeys tooling to decide
              audience, timing, and content. Deployment appears integration-led and service-assisted: Shopify is the
              clearest verified commerce surface, while review sources also cite CRM, CDP, loyalty, support, and data
              connectors. Commercially, the product is not positioned as self-serve software; pricing is custom,
              message-volume sensitive, and typically sold through demos and sales conversations. That package is
              coherent for larger retail brands but raises onboarding and implementation-dependency risk for leaner
              teams.
            claimRefs:
