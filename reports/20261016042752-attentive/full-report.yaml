      audited dollar TAM.
    data:
      items:
        - label: Broad multichannel consumer messaging workflow
          detail: 'Included job: outbound SMS, email, RCS, and push coordination for consumer-brand lifecycle messaging.'
        - label: International service footprint
          value: 20
          unit: + countries
          valueNote: Review-based proxy for geographic serviceability.
        - label: Confirmed integration perimeter
          value: 100
          unit: + integrations
          valueNote: Multiple third-party summaries converge on at least this scale.
        - label: Higher vendor-reported ecosystem claim
          value: 150
          unit: + integrations
          valueNote: AI Agent Index reports a broader upper-bound count.
        - label: Installed-base floor
          value: 8000
          unit: + brands
          valueNote: Independent reviews and summaries consistently cite 8,000+ users.
        - label: Practical lower-fit threshold
          value: 5000
          unit: + contacts
          valueNote: Teams below this list size are described as overbuilt for Attentive.
    approximationNotes: >-
