              - CU004
              - CU013
              - CU015
      - number: '6.3'
        title: Expansion is visible, while retention and concentration remain opaque
        blocks:
          - type: paragraph
            body: >
              Attentive's account-expansion logic is visible in both product and hiring evidence. SMS can extend into
              email, RCS, push, shared behavioral data, additional integrations, and AI-led journeys. Current product
              roles describe data and integration capabilities as a company priority and tie success to adoption,
              measurable business outcomes, and retention. That supports a plausible land-and-expand mechanism, but a
              strategic hiring plan is not proof that customers have adopted each module or renewed after expansion.


              The adverse evidence is useful but requires issuer discipline. Ground and Textedly are competitors, not
              independent benchmarks; they describe rising or opaque costs, enterprise complexity, limited flexibility,
              and potential support or integration friction. Ecommerceguide's synthesis of 11 public reviews adds an
              arms-length signal: it reports praise for named customer-success managers and an intuitive interface,
              alongside slower-than-expected onboarding, delayed campaign reporting, and weaker support responsiveness
              during setup. No retained source discloses NRR, GRR, churn, renewal rates, contract duration, or customer
              concentration, leaving durability as the central customer diligence gap.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Production depth is visible at Sigma Sports
            body: >-
              The Sigma case documents a dated migration, multiple deployed modules, subscriber reactivation, and
              year-over-year commercial outcomes rather than a logo-only relationship.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Public customer evidence does not establish durability
            body: >-
              Neither customer references nor aggregate activity metrics disclose renewal, churn, contract term, or
              concentration, so adoption cannot be translated into durable revenue without private diligence.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Commercial rigidity is the most evidenced near-term risk
        blocks:
          - type: paragraph
            body: >-
              Independent reviews converge on a simple pattern: Attentive can be powerful for scaled ecommerce programs,
              but it is harder to budget, harder to unwind, and harder to compare than self-serve alternatives. The
              official product page confirms usage-based economics across subscribers, messages, channels, and premium
              AI products, while review sources add the more difficult operational details: quarterly minimums, add-on
              fees, reply charges, and, in at least one review, exclusivity language and early-termination penalties.
              That combination creates real downside if a buyer overestimates SMS volume, fails to prove incrementality,
              or needs to change vendors quickly. For investors, that matters because the same commercial design that
              helps monetize large brands can also cap the TAM among price-sensitive or lower-volume customers and make
              net retention more exposed to procurement pushback when results soften.
            claimRefs:
              - CR001
              - CR002
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR012
              - CR013
      - number: '7.2'
        title: Compliance controls exist, but governance remains a monitored rather than solved risk
        blocks:
          - type: paragraph
            body: >-
              Attentive does have substantive public governance language: its own AI governance write-up explicitly
              references TCPA, GDPR, CAN-SPAM, Quiet Hours, messaging frequency caps, role-based permissions,
              allowlists, approval gates, sandboxing, and audit trails. That is a positive sign, because it shows the
              company recognizes that customer-facing automation can create legal, privacy, and reputational risk if
              left unchecked. The risk is not that no controls exist; the risk is that these controls appear to depend
              on configuration quality, access design, and continuous oversight by the customer and Attentive teams.
              Public review sources also place the product across more than 20 countries, which expands the operational
              burden of getting local messaging rules right. Without external regulator, court, or certification
              artifacts in the assigned pool, underwriting should assume the control framework is promising but not
              independently closed.
            claimRefs:
              - CR003
              - CR007
              - CR014
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR007
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR011
              - CR013
              - CR016
      - number: '7.3'
        title: Execution risk sits in integrations, reporting, and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Attentive's cross-channel pitch depends on shared identity, third-party integrations, and coordinated
              suppression and triggering logic. That architecture is strategically useful, but it also creates points of
              failure outside the core messaging engine. Review sources specifically mention slower onboarding, delayed
              reporting, and sync issues with adjacent tooling such as Klaviyo. Those are not cosmetic complaints:
              attribution drift or failed audience sync can distort ROI measurement, over-message users, or break
              lifecycle journeys. Competitive pressure sharpens the issue. Alternative-focused reviews frame transparent
              pricing and stronger two-way messaging as reasons to switch, while at least one competitor argues that
              Attentive remains optimized for one-to-many ecommerce broadcasting rather than conversation-led use cases.
              If that framing becomes a broader buyer preference, substitution risk rises even without a direct product
              failure.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Scale is visible, but financial and external-risk underwriting is still incomplete
        blocks:
          - type: paragraph
            body: >-
              The assigned public pool does show enough scale to matter: Wikipedia reports more than 8,000 business
              customers and cites a March 2025 note that Attentive reached $500 million of ARR in 2024, while also
              noting that a contemplated 2024 IPO was postponed in late 2023. Those facts suggest a company with real
              commercial traction but also an unresolved public-market timing story. What the pool does not provide is
              the harder underwriting layer investors actually need for a high-conviction risk call: current audited
              growth, gross margin, cash flow, NRR, customer concentration, external legal/security history, and the
              prevalence of restrictive contract terms. The practical kill criteria are therefore measurable: evidence
              of rising churn among larger brands, weak migration outcomes after onboarding friction, a material
              compliance incident, or private financials that fail to justify the sales-process and integration burden
              embedded in the current model.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: |-
              The evidence supports a **research-more** posture rather than a buy call. Public sources
              support that Attentive is a scaled, strategically relevant omnichannel marketing platform:
              third-party coverage places 2024 ARR near $500 million, company-issued materials say it
              works with more than 8,000 customers across 70+ industries, and the product scope now
              spans SMS, email, RCS, and push. Those are real strengths, but they do not answer the
              pricing question on their own. The retained public valuation anchor is still the old
              2021-era mark, while current growth quality, margins, retention, and financing terms are
              not publicly substantiated in this pool. Independent reviews also keep surfacing
              commercialization friction around opaque pricing, onboarding, integration, and reporting,
              which makes it hard to underwrite a premium entry multiple from public evidence alone.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV012
              - CV013
              - CV015
              - CV016
