      - number: '5.3'
        title: Differentiation, maturity, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Attentive’s visible differentiation is strongest where SMS-first performance marketing meets
              identity-linked orchestration and packaged AI automation. Recent materials emphasize agentic decisioning,
              analytics, and channel expansion, and Forbes' March 2026 snapshot suggests the email module has reached
              meaningful scale rather than remaining a feature stub. The counterweight is that public diligence still
              leaves important product risk unanswered. Independent sources flag limited geographic SMS breadth, missing
              WhatsApp and web-push coverage, beta-stage push maturity, and some integration or support friction. More
              importantly, the assigned pool does not contain public trust-center, uptime, certification, or developer
              ecosystem evidence robust enough to validate deeper technical quality. The result is a credible enterprise
              product narrative with incomplete external verification of resilience and technical defensibility.
