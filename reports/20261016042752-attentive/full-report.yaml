      - number: '3.3'
        title: Pricing pressure, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse signal in the assigned pool is commercial rather than technical. Wiser argues that
              Attentive's quarterly minimums, carrier pass-through fees, and renewal structure make it the
              highest-entry-price option in the category below enterprise scale, while Toolradar similarly frames the
              product as best suited for businesses with significant marketing budgets and contract tolerance. That
              pressure is exactly where Klaviyo, Postscript, Omnisend, and SimpleTexting attack: lower or free entry
              tiers, clearer self-serve economics, and lighter commitments. The same contract structure also creates
              lock-in once a brand has built journeys, collected lists, and normalized white-glove support around
              Attentive, so the moat is real but partly coercive: durable for scaled ecommerce operators, vulnerable
              when buyers re-underwrite total cost and flexibility against transparent substitutes.
