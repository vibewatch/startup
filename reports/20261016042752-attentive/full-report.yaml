      - number: '6.2'
        title: Sigma Sports provides the strongest production and outcome evidence
        blocks:
          - type: paragraph
            body: >
              Sigma Sports is the best-documented customer in the assigned evidence. Attentive's case study says Sigma
              migrated from Ometria and Wunderkind on August 27, 2025 and rebuilt its CRM foundation across Attentive
              Email, SMS, and AI. By January 2026, the case study reports total platform revenue up 279% year over year
              while total sends rose 32%; active subscribers had also grown 55% within six weeks, and four warm-up
              campaigns reactivated nearly 10,000 contacts at a 30% rate among warmer segments. The same source
              attributes a 10% revenue uplift to AI Pro after implementation in October 2025.


              These metrics demonstrate production use across acquisition, orchestration, reactivation, and expansion
              rather than a pilot or logo-only relationship. They are nevertheless company-published, single-customer
              outcomes. Other names in the evidence are mostly references embedded in Attentive-authored job text, an
              official product-page testimonial, or a reviewer's list of brands named by the vendor. Those references
              broaden the apparent customer set but do not independently establish current production status, renewal,
              or comparable outcomes.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU015
