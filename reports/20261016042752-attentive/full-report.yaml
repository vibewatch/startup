  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and excluded spend
        blocks:
          - type: paragraph
            body: >-
              Attentive's public product and third-party reviews consistently place the company in consumer-brand
              outbound messaging rather than the full universe of marketing software. The relevant boundary is
              cross-channel lifecycle and promotional messaging across SMS, email, RCS, and push, with identity
              resolution, segmentation, compliance, and triggered journeys wrapped around those channels. That means the
              chapter should include spend attached to retention and commerce messaging workflows, while excluding
              generic B2B nurture automation, broad CRM suites with no commerce focus, and adjacent support software
              that may integrate with Attentive but is not the product's core job-to-be-done. The main substitute is not
              just a direct SMS competitor; it is the status quo of running these channels in separate tools and
              stitching audiences together manually.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence points to ecommerce, CRM, and retention teams as the practical buying center. Attentive's
              named integrations cluster around commerce platforms, loyalty tools, returns software, customer-service
              tools, and data systems, which suggests the budget owner is usually a revenue-oriented digital marketing
              or lifecycle leader instead of a standalone IT administrator. The installed use cases also skew toward
              brands where outbound messaging is already a meaningful revenue lever: Shopify-heavy SMB and mid-market
              merchants, larger omnichannel retailers, and consumer categories such as apparel, beauty, food and
              beverage, travel, and entertainment. Public reviews add an important narrowing signal here: teams with
              small lists or low monthly revenue are described as poor fits, so the adoptable segment is constrained by
              both workflow complexity and budget tolerance.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM012
      - number: '2.3'
        title: Evidence-constrained sizing lens
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool does not expose a clean public TAM/SAM/SOM stack from an independent analyst or
              trade body, so the chapter relies on constrained adoption and serviceability lenses instead. Those lenses
              are still useful. Public reviews put Attentive in 20+ countries, describe at least 100 integrations and as
              many as 150+, and cite more than 8,000 brands on the platform. Together, those figures show that the
              serviceable footprint is broad across geographies, channels, and supporting software, while the current
              installed base provides a real adoption floor. What they do not prove is the total dollar size of the
              multichannel commerce-messaging market, so any valuation work should treat the sizing evidence as
              directional fit and penetration data rather than as a complete market model.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
