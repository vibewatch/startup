  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The public customer footprint centers on scaled consumer brands
        blocks:
          - type: paragraph
            body: >
              Attentive's own recruiting text says the company serves more than 8,000 customers across over 70
              industries, while Wikipedia separately reports more than 8,000 businesses using the software. These
              figures are directionally consistent but do not define whether the denominator means contracted, paying,
              active, or currently sending brands. The same company-issued material names Crate and Barrel, Urban
              Outfitters, and Carter's, providing recognizable references without revealing contract size or deployment
              scope.


              The product and review evidence points to a clearer segment pattern than the headline count does.
              Attentive is positioned for retail, ecommerce, food and beverage, travel, and entertainment marketers that
              coordinate SMS with email, RCS, and push. The likely buyer and payer is a CRM, retention, ecommerce, or
              marketing leader; day-to-day users are lifecycle marketers and CRM operators. Quote-based, usage-linked
              pricing and account-led support indicate stronger alignment with mid-market and enterprise programs than
              with teams seeking a simple self-serve texting product.
            claimRefs:
              - CU001
              - CU002
              - CU003
