              - CI004
              - CI009
      - number: '4.2'
        title: Public traction is clearer than unit economics
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports that Attentive has reached meaningful operating scale: multiple sources
              cite more than 8,000 brands or businesses on the platform, independent profiles repeat $500M+ ARR in 2024,
              and Attentive's own messaging page cites more than 1 billion messages sent and received per month. Those
              are useful scale and demand signals, but they are not substitutes for vendor-level economics. Public
              materials emphasize customer outcomes, integrations, and channel breadth, while leaving CAC, payback,
              gross margin, churn, and revenue mix undisclosed in the reviewed evidence set.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI007
              - CI010
      - number: '4.3'
        title: Capital adequacy remains the main underwriting blocker
        blocks:
          - type: paragraph
            body: >-
              Attentive's historical financing backdrop appears strong enough to explain the current platform footprint,
              but it is too stale and incomplete to underwrite current runway. Independent profiles still point back to
              the 2021 Series E and an overall funding base above $800 million, while current official materials
              emphasize continued product expansion such as push notifications and analytics upgrades. That combination
              suggests a business still investing in platform breadth, but the assigned evidence does not expose current
              cash on hand, burn, debt facilities, or next-round triggers. Company Overview can carry the funding
              chronology; the financial judgment here is that forward capital adequacy cannot be verified from public
              evidence alone.
            claimRefs:
              - CI006
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence supports a high-scale, enterprise-oriented martech platform whose revenue quality
              is directionally credible but still hard to diligence. Attentive appears to have a real multi-product
              engine, broad customer adoption, and enough historical funding to have built a substantial operating
              platform. What remains missing are the metrics that decide underwriting quality: realized pricing after
              discounts and minimums, channel or services mix, gross margin, CAC efficiency, churn, customer
              concentration, and current cash runway. Until management-level financial disclosure fills those gaps, the
              right conclusion is not that the model is weak, but that transparency is materially below what a
              conviction investment case would require.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pricing opacity hides realized economics
            body: >-
              Public evidence shows the contract shape more clearly than the realized economics. Quote-based pricing,
              minimum commitments, and reported overage penalties can all coexist with strong revenue quality, but they
              also prevent outsiders from underwriting true ARPA, discounting, and margin without management data.
            calloutType: risk
            claimRefs:
              - CI002
              - CI003
              - CI009
          - type: callout
            title: Scale signals are real, but capital adequacy is still unverified
            body: >-
              Attentive looks like a scaled platform rather than an early experiment, yet the public record in this
              chapter never gets to current cash, burn, or debt. That is enough to support a credible-scale conclusion,
              but not enough to underwrite runway.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Public product and review surfaces consistently describe Attentive as a multi-channel lifecycle marketing
              platform for consumer brands, with SMS still acting as the anchor surface but email, RCS, push, and
              two-way support increasingly folded into the same buyer workflow. The core pattern is list growth plus
              identity resolution, followed by AI-assisted campaign design and behavior-triggered journeys. That matters
              because Attentive is no longer just selling outbound messaging volume; it is selling a closed loop in
              which opt-in capture, customer recognition, content generation, and channel orchestration sit inside one
              commercial surface. The product appears mature enough to cover acquisition, retention, and service handoff
              use cases, although most recent proof for newer layers such as push and agentic AI remains company-issued
              rather than independently benchmarked.
            claimRefs:
