    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and scale anchors
        blocks:
          - type: paragraph
            body: >
              The retained evidence consistently describes Attentive as an AI-powered messaging platform for consumer
              brands, with SMS still central but email, RCS, push, and identity resolution now part of the standard
              pitch. The official site positions the company as a platform for planning, sending, and measuring across
              channels, while the messaging page adds the usage-based commercial model and cross-channel data loop.
              Third-party profiles support meaningful operating scale, but they do not fully reconcile it: official
              materials say 1,000+ employees and four offices, whereas Forbes listed 5,000 employees in March 2026. That
              gap matters because the chapter can safely reuse Attentive's product identity and category positioning,
              but should treat headcount and current scale metrics as directional rather than settled until management
              or primary disclosures close the difference.
