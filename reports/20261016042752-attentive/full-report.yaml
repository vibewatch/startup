      - number: '1.2'
        title: Leadership, founder continuity, and governance visibility
        blocks:
          - type: paragraph
            body: >
              Founding identity is reasonably clear: independent profiles trace Attentive to Brian Long and Andrew Jones
              in 2016 after TapCommerce. The current leadership picture is less clean. The official about page now names
              Eric Miao as chief executive officer and lists the rest of the senior team, but Forbes still showed Amit
              Jhawar as CEO as of March 2026, and the retained source set does not include the primary announcement,
              board explanation, or founder role update that would reconcile the handoff. That makes governance one of
              the chapter's biggest diligence gaps: the company can be described as founder-originated with an apparent
              professional-management transition, but not yet as governance-transparent.
