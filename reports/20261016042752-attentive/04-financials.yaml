schemaVersion: report-v2
artifact: financials
slug: attentive
runDate: 2026-10-16
company:
  name: Attentive
chapter:
  number: 4
  title: Financials
  summary: >-
    Attentive shows credible commercial scale, but the public evidence is much
    stronger on product breadth and customer reach than on realized pricing,
    margin, or cash efficiency. The most defensible financial read is a
    quote-based, enterprise-skewed messaging platform with meaningful ARR and
    customer breadth, offset by opaque contract economics and limited public
    visibility into capital adequacy.
sections:
  - id: revenue-model
    title: Revenue model and pricing mechanics
    body: >-
      Attentive's public and independent coverage consistently describe an
      omnichannel messaging platform that monetizes SMS, email, RCS, and push
      for larger consumer brands rather than a transparent self-serve SaaS
      product. The revenue mechanism is visible at a high level: brands buy
      access to customer acquisition, orchestration, and message delivery
      across multiple channels, and public reviews say contracts are quoted off
      list size and messages sent rather than a published rate card. The most
      useful adverse pricing evidence also indicates minimum-spend commitments
      and overage penalties, which means the public list-pricing picture is not
      enough to infer realized ARPA, net retention, or contribution margin.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI008
      - CI009
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-unit-economics
    title: Public traction is clearer than unit economics
    body: >-
      The assigned evidence supports that Attentive has reached meaningful
      operating scale: multiple sources cite more than 8,000 brands or
      businesses on the platform, independent profiles repeat $500M+ ARR in
      2024, and Attentive's own messaging page cites more than 1 billion
      messages sent and received per month. Those are useful scale and demand
      signals, but they are not substitutes for vendor-level economics. Public
      materials emphasize customer outcomes, integrations, and channel breadth,
      while leaving CAC, payback, gross margin, churn, and revenue mix
      undisclosed in the reviewed evidence set.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI007
      - CI010
    tableRefs:
      - TI003
  - id: capital-adequacy
    title: Capital adequacy remains the main underwriting blocker
    body: >-
      Attentive's historical financing backdrop appears strong enough to
      explain the current platform footprint, but it is too stale and
      incomplete to underwrite current runway. Independent profiles still point
      back to the 2021 Series E and an overall funding base above $800
      million, while current official materials emphasize continued product
      expansion such as push notifications and analytics upgrades. That
      combination suggests a business still investing in platform breadth, but
      the assigned evidence does not expose current cash on hand, burn, debt
      facilities, or next-round triggers. Company Overview can carry the
      funding chronology; the financial judgment here is that forward capital
      adequacy cannot be verified from public evidence alone.
    claimRefs:
      - CI006
      - CI011
      - CI012
  - id: verdict
    title: Financial verdict
    body: >-
      The strongest evidence supports a high-scale, enterprise-oriented
      martech platform whose revenue quality is directionally credible but
      still hard to diligence. Attentive appears to have a real multi-product
      engine, broad customer adoption, and enough historical funding to have
      built a substantial operating platform. What remains missing are the
      metrics that decide underwriting quality: realized pricing after
      discounts and minimums, channel or services mix, gross margin, CAC
      efficiency, churn, customer concentration, and current cash runway. Until
      management-level financial disclosure fills those gaps, the right
      conclusion is not that the model is weak, but that transparency is
      materially below what a conviction investment case would require.
    claimRefs:
      - CI009
      - CI010
      - CI011
      - CI013
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - SMS campaigns
        - Quote-based platform fees linked to subscriber list size, campaign volume, and enterprise contract structure
        - Message volume plus minimum commitment
        - Core monetization surface is repeatedly described, but no public rate card is published
        - Medium; mechanism is corroborated, realized pricing is opaque
        - Provide anonymized contract cohorts with net effective price per message and attach services
      - - Email campaigns
        - Sold inside the same omnichannel stack rather than as a clearly separated public SKU
        - Contracted module / usage
        - Public evidence confirms email is part of the platform, but not standalone revenue mix
        - Low; packaging is visible, revenue allocation is not
        - Break out email ARR, attach rate, and standalone pricing logic
      - - RCS messaging
        - Extension of the same messaging platform for richer branded messaging
        - Campaign / message usage
        - Supported publicly as a live channel, with no separate public pricing
        - Low; feature availability is clear, monetization is not
        - Disclose RCS adoption, pricing uplift, and carrier-cost pass-through
      - - Push notifications and AI modules
        - Upsell surface layered onto the core identity and orchestration stack
        - Module / usage / bundled enterprise expansion
        - Push launched in 2025 and AI modules are marketed as platform enhancements, but revenue contribution is undisclosed
        - Low; expansion surface is visible, economics are not
        - Show module attach rates, services effort, and gross-margin impact by product line
    notes: >-
      Public evidence supports revenue mechanics and expansion surfaces, not
      channel-level mix or realized net pricing.
    claimRefs:
      - CI001
      - CI002
      - CI011
      - CI012
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / contract element
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Quote-based enterprise pricing tied to list size and messages sent
        - Public reviews describe quote-based pricing rather than posted tiers
        - Realized price by brand size, discounting, and minimums are not disclosed
        - ecommerceguide; Gappsy; GetOmnichannel
      - - Quarterly minimum spend
        - Third-party reviews cite commitments in the ~$2,000-$3,000 range
        - Unknown how broadly this applies across customer cohorts
        - GetOmnichannel; Gappsy
      - - Overage penalties above committed volume
        - Independent review cites 20-50 percent overage penalties
        - Terms appear contract-specific; no official confirmation of prevalence
        - GetOmnichannel
      - - Shopify entry point / trial
        - Free-to-install app with a 30 day free trial is visible publicly
        - Not representative of enterprise contract economics or expansion pricing
        - ecommerceguide
    notes: >-
      These rows reflect list-pricing signals and third-party contract
      observations; they do not establish realized revenue, margin, or
      customer-level discounts.
    claimRefs:
      - CI002
      - CI003
      - CI009
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR scale
        - $500M+ ARR (2024)
        - Medium
        - Shows the platform has real commercial scale and supports enterprise operating complexity
        - Provide audited 2025 and 2026 ARR, revenue growth, and revenue mix bridge
      - - Customer base
        - 8,000+ brands / businesses
        - Medium
        - Gives a rough denominator for ARPA but not concentration or retention
        - Disclose active paying customers by segment, concentration, churn, and NRR
      - - Usage intensity
        - 1B+ messages sent and received per month
        - Medium
        - Useful proxy for platform throughput and billable activity
        - Show revenue per message, gross profit per message, and carrier-cost exposure
      - - Customer outcome proof
        - 2x+ higher conversion rates, 50% higher spend from replies, 97x ROI from SMS journeys
        - Low
        - Indicates customer value proposition, but not Attentive's own margin structure
        - Provide cohort-level realized ROI, services load, and retention by customer tier
      - - Gross margin
        - null
        - Low
        - Core software economics cannot be underwritten without it
        - Provide GAAP gross margin and contribution margin by channel and services content
      - - CAC / payback
        - null
        - Low
        - Sales-efficiency quality is unknown without acquisition-cost and recovery data
        - Provide fully loaded CAC, payback, and sales-cycle by segment and channel
      - - Cash / runway / debt
        - null
        - Low
        - Financing dependency cannot be assessed without current liquidity and obligations
        - Provide latest cash balance, burn, debt facilities, covenants, and runway
    notes: >-
      Null values mean the assigned public evidence does not disclose the
      metric directly; each null row lists the diligence request needed to
      underwrite it.
    claimRefs:
      - CI004
      - CI005
      - CI007
      - CI010
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the commercial sequence from list growth and
      orchestration to billable message volume, but not a quantified take-rate
      or margin bridge.
    data:
      nodes:
        - label: Subscriber acquisition
          detail: AI Grow and signup tooling increase SMS and email list capture for consumer brands.
        - label: Identity and segmentation
          detail: Behavioral data and identity resolution unify audiences across channels.
        - label: Campaign orchestration
          detail: AI-assisted journeys choose audience, timing, and content across SMS, email, RCS, and push.
        - label: Message delivery
          detail: Cross-channel sends create the underlying billable activity base.
        - label: Conversion attribution
          detail: Attentive markets conversion, spend, and ROI improvements back to customers.
        - label: Platform revenue and gross profit
          detail: Revenue is quote-based and contract-shaped; gross profit depends on undisclosed carrier, support, and services costs.
      edges:
        - from: Subscriber acquisition
          to: Identity and segmentation
          label: New opt-ins enlarge the addressable audience
        - from: Identity and segmentation
          to: Campaign orchestration
          label: Customer signals inform targeting and timing
        - from: Campaign orchestration
          to: Message delivery
          label: More coordinated campaigns drive channel usage
        - from: Message delivery
          to: Conversion attribution
          label: Performance reporting anchors customer ROI claims
        - from: Conversion attribution
          to: Platform revenue and gross profit
          label: Quote-based contracts monetize scale, usage, and expansion
    approximationNotes: >-
      Sequence and labels are source-backed; no public evidence in the assigned
      pool supports a numeric conversion or gross-margin waterfall.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI009
callouts:
  - calloutType: risk
    title: Pricing opacity hides realized economics
    body: >-
      Public evidence shows the contract shape more clearly than the realized
      economics. Quote-based pricing, minimum commitments, and reported
      overage penalties can all coexist with strong revenue quality, but they
      also prevent outsiders from underwriting true ARPA, discounting, and
      margin without management data.
    claimRefs:
      - CI002
      - CI003
      - CI009
  - calloutType: insight
    title: Scale signals are real, but capital adequacy is still unverified
    body: >-
      Attentive looks like a scaled platform rather than an early experiment,
      yet the public record in this chapter never gets to current cash, burn,
      or debt. That is enough to support a credible-scale conclusion, but not
      enough to underwrite runway.
    claimRefs:
      - CI005
      - CI006
      - CI010
      - CI011
