      This comparison mixes vendor-published pricing, editorial roundups, and review-site
      summaries; realized enterprise pricing, discounts, carrier pass-through fees, and
      renewal terms remain material diligence gaps.
    claimRefs: [CP002, CP006, CP007, CP008, CP009, CP010, CP011, CP014]
