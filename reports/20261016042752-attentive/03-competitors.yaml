      - [Klaviyo, "$20/mo email starter; $85 combined at 2.5K contacts + 1,250 SMS credits", "Tiered software + per-SMS", "No contract minimums in cited roundup", "Unified email + SMS", "Cheaper default for smaller ecommerce teams if public pricing matches realized quotes"]
      - [Postscript, "$0 starter; $500 professional + $0.007-$0.015/SMS", "Per-message pricing", "Month-to-month in cited roundup", "SMS-only specialist depth", "Best fit when a buyer already owns the email stack and wants lower lock-in"]
      - [Omnisend, "$0 free; $59 standard; $99 pro + $0.015/SMS", "Contact-based tiers + SMS credits", "Self-serve tiering in cited roundup", "Email + SMS + push / web push", "Strong value substitute for smaller omnichannel ecommerce programs"]
      - [Emotive, "$300+/month custom quote", "Custom quote", "Annual contract in cited roundup", "AI + live-agent conversational SMS", "Premium alternative for brands valuing brand-voice conversations over lowest cost"]
      - [SimpleTexting, "$29 lite; $79 standard; $249 premium", "Tiered credits", "No minimum in cited roundup", "Bulk SMS, autoresponders, two-way messaging", "Lowest-friction substitute for SMB and service-business use cases"]
