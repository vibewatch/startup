callouts:
  - calloutType: insight
    title: Attentive wins when the buyer values orchestration over transparency
    body: >-
      The public evidence supports Attentive as a premium bundle for brands that want SMS,
      email, RCS, push, AI tooling, and service wrapped together rather than stitched from
      separate vendors.
    claimRefs: [CP001, CP003, CP012, CP014]
  - calloutType: risk
    title: Price opacity is the main opening for substitutes
    body: >-
      Below clear enterprise scale, lower-cost alternatives attack Attentive on published
      entry pricing, lighter commitments, and easier exit paths more than on outright
      product inadequacy.
    claimRefs: [CP006, CP007, CP008, CP010, CP011, CP014]
