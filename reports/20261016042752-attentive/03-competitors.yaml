      - ["Support / onboarding model", "Dedicated support and white-glove positioning", "Self-serve workflows emphasized", "Self-service list management emphasized", "Self-serve ecommerce automation emphasized", "SMB-friendly self-serve usage", "Support praised, but enterprise process detail is limited in assigned pool"]
