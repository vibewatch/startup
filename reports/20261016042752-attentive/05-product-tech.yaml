  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public developer-signal or practitioner-community evidence for APIs, SDKs, package usage, GitHub activity, or technically detailed integration-partner validation.
      whyItMatters: The chapter cannot independently assess ecosystem adoption or technical moat without a credible proxy for external builder usage.
      diligencePath: Request public API docs, integration-partner technical case studies, package-registry metrics, or internal ecosystem usage telemetry.
      relatedQuestionRefs: [QE004, QE006]
    - type: missing-source
      severity: material
      topic: trust-security
      missingEvidence: Public trust-center, certification, privacy architecture, incident-history, or uptime documentation tied to the current platform.
      whyItMatters: Messaging workflows touch identity, consent, and deliverability, so missing trust evidence limits underwriting of resilience and compliance depth.
      diligencePath: Obtain current SOC 2 or ISO materials, uptime SLA, status history, and security or privacy architecture documentation.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: implementation-metrics
      missingEvidence: Module-level onboarding time, activation rates for push and RCS, deliverability performance, and independent ROI or retention metrics by channel.
      whyItMatters: Public feature coverage alone does not show how quickly brands realize value or whether newer modules improve economics.
      diligencePath: Request customer deployment timelines, activation funnels, deliverability benchmarks, and retention or expansion data split by module.
      relatedQuestionRefs: [QE003, QE004, QE007]
