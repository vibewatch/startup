schemaVersion: report-v2
artifact: product-tech
slug: attentive
runDate: 2026-10-16
company:
  name: Attentive
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Attentive now presents as an identity-led messaging platform spanning SMS,
    email, RCS, push, and two-way concierge support rather than a single-channel
    SMS point solution. Public evidence is strongest for cross-channel workflow
    orchestration, AI-assisted campaign tooling, and broad ecommerce
    integrations, while public proof of security architecture, uptime, and
    developer-signal depth remains limited.
sections:
  - id: delivered-platform
    title: Delivered product and customer workflow
    body: >-
      Public product and review surfaces consistently describe Attentive as a
      multi-channel lifecycle marketing platform for consumer brands, with SMS
      still acting as the anchor surface but email, RCS, push, and two-way
      support increasingly folded into the same buyer workflow. The core pattern
      is list growth plus identity resolution, followed by AI-assisted campaign
      design and behavior-triggered journeys. That matters because Attentive is
      no longer just selling outbound messaging volume; it is selling a closed
      loop in which opt-in capture, customer recognition, content generation,
      and channel orchestration sit inside one commercial surface. The product
      appears mature enough to cover acquisition, retention, and service
      handoff use cases, although most recent proof for newer layers such as
      push and agentic AI remains company-issued rather than independently
      benchmarked.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE010, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment
    title: Architecture, integration, and deployment model
    body: >-
      The public architecture story centers on customer identity plus
      orchestration rather than on exposed infrastructure primitives. Attentive
      and third-party reviews describe a Single Customer ID or Attentive Signal
      layer that links subscriber behavior across channels, then uses AI and
      journeys tooling to decide audience, timing, and content. Deployment
      appears integration-led and service-assisted: Shopify is the clearest
      verified commerce surface, while review sources also cite CRM, CDP,
      loyalty, support, and data connectors. Commercially, the product is not
      positioned as self-serve software; pricing is custom, message-volume
      sensitive, and typically sold through demos and sales conversations. That
      package is coherent for larger retail brands but raises onboarding and
      implementation-dependency risk for leaner teams.
    claimRefs: [CE002, CE003, CE007, CE008, CE009, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-technical-risk
    title: Differentiation, maturity, and technical risk
    body: >-
      Attentive’s visible differentiation is strongest where SMS-first
      performance marketing meets identity-linked orchestration and packaged AI
      automation. Recent materials emphasize agentic decisioning, analytics, and
      channel expansion, and Forbes' March 2026 snapshot suggests the email
      module has reached meaningful scale rather than remaining a feature stub.
      The counterweight is that public diligence still leaves important product
      risk unanswered. Independent sources flag limited geographic SMS breadth,
      missing WhatsApp and web-push coverage, beta-stage push maturity, and some
      integration or support friction. More importantly, the assigned pool does
      not contain public trust-center, uptime, certification, or developer
      ecosystem evidence robust enough to validate deeper technical quality. The
      result is a credible enterprise product narrative with incomplete external
      verification of resilience and technical defensibility.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014]
tables:
