    claimRefs: [CE002, CE004, CE005, CE010, CE013]
callouts:
  - calloutType: strength
    title: Cross-channel orchestration is the clearest product strength
    body: >-
      The strongest public evidence is not any single feature but the way
      identity, journeys, and messaging channels are packaged into one operating
      surface for consumer marketers.
    claimRefs: [CE001, CE002, CE003, CE007, CE010]
  - calloutType: risk
    title: Public technical diligence remains shallow on trust and resilience
    body: >-
      The pool supports a credible feature narrative, but it does not provide
      enough independent evidence on uptime, certifications, developer adoption,
      or implementation quality to underwrite technical durability with high
      confidence.
    claimRefs: [CE011, CE012, CE013]
