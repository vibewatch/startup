      - ["Email marketing", "CRM / lifecycle marketer", "Scaled extension", "Unified with SMS plus AI Pro and shared identity", "Need evidence on builder depth, template flexibility, and comparative reporting quality"]
      - ["RCS business messaging", "Brand / mobile marketer", "Live but channel-constrained", "Richer branded messaging inside the same orchestration layer", "Need carrier coverage, activation rate, and production adoption data"]
      - ["Push notifications", "App marketer / retention team", "Newer module", "Extends identity-led journeys into owned mobile apps", "Need proof of customer adoption, reliability, and whether beta limits persist"]
      - ["AI orchestration and concierge", "Marketing ops / support teams", "Actively expanding", "Agentic AI, AI Grow, AI Journeys, and AI/live-agent handoff", "Need independent proof of lift, guardrails, and workflow transparency"]
    notes: >-
      Mixes vendor and third-party descriptions; maturity labels reflect public
      evidence depth, not internal release-stage data.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE010, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Capture compliant subscribers", "Acquire opt-ins from mobile traffic and promotions", "Two-tap sign-up units and AI Grow capture SMS/email preferences", "Faster list growth with consent baked into the flow", "Public pool lacks conversion benchmarks by traffic source"]
      - ["Coordinate lifecycle campaigns", "Marketers stitch separate channel campaigns manually", "Shared customer identity plus AI Journeys orchestrate triggered messaging", "Cross-channel coordination around browsing, cart, and purchase behavior", "Independent evidence does not verify journey setup effort or maintenance load"]
      - ["Optimize send timing and content", "Campaign managers choose segments and sends by hand", "AI Essentials and AI Pro generate copy, segments, and timing suggestions", "Potential faster campaign production and better relevance", "Independent A/B test evidence is thin outside vendor anecdotes"]
      - ["Handle shopper replies or service handoff", "Support issues leave the campaign surface for service tools", "Concierge combines AI and live-agent handoff in messaging", "Keeps commerce and support interaction inside the thread", "Need proof of resolution quality and staffing economics"]
      - ["Extend messaging into richer channels", "Brands add app or rich-media channels through separate tools", "RCS and push sit beside SMS/email in one platform", "More surfaces without a separate orchestration stack", "Coverage and maturity vary by carrier, device, and app footprint"]
    notes: >-
      Benefits are workflow-level implications from documented capabilities; the
      pool does not provide audited ROI by module or deployment profile.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ["Consent and capture", "Turn mobile traffic into opted-in subscriber records", "Signup units, two-tap flows, policy/compliance configuration", "Public evidence does not expose fraud controls or consent-audit mechanics"]
      - ["Identity and profiles", "Link browsing, cart, purchase, and preference data across channels", "Single Customer ID / Attentive Signal plus ecommerce and CDP data", "Identity quality likely depends on integration hygiene and first-party data completeness"]
      - ["Decisioning and content AI", "Generate copy, choose timing, and shape segments or recommendations", "AI Essentials, AI Pro, product recommendation models, campaign data", "Black-box optimization and limited public benchmarking make model governance hard to assess"]
      - ["Journey orchestration", "Trigger campaigns or replies from customer behavior", "AI Journeys, campaign scheduler, service workflows", "Setup complexity and integration reliability can slow time-to-value"]
      - ["Channel execution", "Deliver SMS, email, RCS, push, and concierge conversations", "Carrier/device support, app footprint, deliverability operations, support routing", "RCS constraints and newer push maturity can create uneven channel coverage"]
      - ["Measurement and controls", "Report performance and enforce compliant messaging", "Analytics dashboard, compliance tooling, deliverability controls", "No public SLA, uptime, certification, or incident-history evidence in the assigned pool"]
    notes: >-
      Architecture layers are synthesized from public product descriptions rather
      than technical documentation or source code.
    claimRefs: [CE002, CE003, CE007, CE011, CE012, CE013]
