    claimRefs: [CM002, CM008, CM009, CM010, CM011, CM012]
callouts:
  - calloutType: insight
    title: Serviceability is broad, but addressability is narrower
    body: Attentive can operate across many channels, integrations, and geographies, yet the public fit signals consistently narrow the practical market to consumer brands with enough message volume and budget to tolerate custom pricing.
    claimRefs: [CM002, CM008, CM011, CM012]
  - calloutType: risk
    title: Market-size confidence is limited by missing independent TAM evidence
    body: The retained pool is good enough to bound product scope and buyer fit, but not to prove the full dollar size of included commerce-messaging spend; any market-upside claim should therefore stay conservative.
    claimRefs: [CM008, CM010, CM011, CM014]
