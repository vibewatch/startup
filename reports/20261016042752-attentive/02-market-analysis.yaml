  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: tam-sam-sizing
      missingEvidence: An independent market study or management disclosure that quantifies included spend for commerce-retention messaging across SMS, email, RCS, and push.
      whyItMatters: Without a methodology-backed external market denominator, valuation work can overstate market upside by using generic marketing-software TAMs that include excluded workflows.
      diligencePath: Request management's internal market model, then reconcile it to an external analyst or trade-association estimate using the same included channels and buyer segments.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: minor
      topic: integrations
      missingEvidence: A dated primary-source integration count or product catalog that resolves whether the current ecosystem should be described as 100+ or 150+ integrations.
      whyItMatters: Precise ecosystem breadth influences switching-cost and serviceability narratives, and the retained sources preserve a meaningful range rather than a single audited number.
      diligencePath: Obtain Attentive's current integration directory or a product-team statement with a published date, then replace the third-party range with the primary count.
