callouts:
  - calloutType: "insight"
    title: "The Cost-Exchange Dilemma in Tactical Counter-Drone Warfare"
    body: "ACS's primary competitive advantage is economic rather than ballistic: firing a 50-cent or 10-dollar bullet to neutralize an incoming loitering munition circumvents the magazine depletion inherent in surface-to-air missile defenses. However, this creates a distinct operational boundary: kinetic gun turrets only protect local assets within line-of-sight and cannot provide theater-wide area denial."
    claimRefs:
      - "CP001"
      - "CP010"
  - calloutType: "risk"
    title: "Incumbent Software Adaptation and Caliber Obsolescence"
    body: "As established remote weapon station manufacturers upgrade their targeting software with commercial computer vision, ACS's pure-software edge may erode. Furthermore, small 7.62 mm machine guns lack terminal kinetic energy against larger, armored Group 3 drones, forcing ACS into heavier 30 mm weapon classes that compete directly with armored vehicle prime contractors."
    claimRefs:
      - "CP003"
      - "CP015"
