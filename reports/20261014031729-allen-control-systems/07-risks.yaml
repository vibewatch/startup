callouts:
  - calloutType: risk
    title: The Prototype-to-Production Chasm in Defense Procurement
    body: Although ACS has achieved significant visibility through the Marine Corps GBAD selection and Army deployments, contracts remain prototype Other Transaction Agreements (OTAs) rather than multi-year Program of Record production contracts. If defense appropriations face delays or if integration testing encounters software bugs, cash flow could stall before high-volume manufacturing reaches break-even.
    claimRefs:
      - CR001
      - CR003
  - calloutType: recommendation
    title: Diligence Priorities for Confirmatory Review
    body: Investors must condition further capital commitments on inspecting ACS's bill-of-materials cost structure, verifying manufacturing scrap rates during the Austin facility ramp, and confirming formal DoD Directive 3000.09 compliance reviews for autonomous tracking and targeting.
    claimRefs:
      - CR004
      - CR006
      - CR014
