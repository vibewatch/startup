          detail: 被动光电摄像头提供 360 度探测和跟踪，不发射雷达信号。
          modules:
            - 被动 EO/IR 视觉系统
            - 光学搜索与瞄准单元
        - label: 第 2 层：边缘 AI 与计算机视觉
          detail: 机载嵌入式 GPU 运行深度学习模型，用于分类和 3D 轨迹跟踪。
          modules:
            - 目标分类神经网络
            - 轨迹状态估计器
        - label: 第 3 层：自主火控
          detail: 高速弹道计算引擎配合陀螺炮塔稳定系统，补偿载体运动。
          modules:
            - 动态弹道提前量求解器
            - 亚毫弧度机器人伺服控制器
        - label: 第 4 层：指挥、控制与安全
          detail: 开放架构军事网络网关，强制执行人在回路上的明确开火授权。
          modules:
            - 互操作 C2 数据网关
            - 人工开火控制联锁
        - label: 第 5 层：模块化动能效应器
          detail: 通用枪架支持标准军用枪械，使用现有军种通用弹药库存。
          modules:
            - M240 7.62mm 枪架与供弹
            - M2 .50 口径枪架与供弹
        - label: 第 6 层：低附带损伤效应器
          detail: 面向敏感或民用空域交战的模块化非动能及非致命选项。
          modules:
            - 高功率光学激光致盲器
            - 复合型非致命弹药
