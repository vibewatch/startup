  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议框架
        blocks:
          - type: paragraph
            body: >-
              评估 Allen Control Systems（ACS）时，必须在非凡的运营拉力与高要求的估值里程碑之间取得平衡。ACS 由前美国海军工程师创立，将 Bullfrog
              自主武器站置于现代防空经济学的核心：利用人工智能和计算机视觉，把军种通用机枪变成精确的反无人机系统。Bullfrog 以估计每次击杀 $10 的成本击落第 1 至第 3
              组无人机，扭转了向商用或低成本巡飞无人机发射数百万美元拦截导弹时不可持续的成本不对称。这一技术突破帮助 ACS 以 $2.2 billion 投后估值完成 $200 million B
              轮融资。然而，这一估值较上一年的 A 轮估值大幅增长 65
              倍，并在经审计的财务披露或生产毛利率尚未建立前，就计入了快速工业化的预期。因此，我们启动跟踪评级并给予高风险评级，建议成长型投资者先等待经验证的单位生产盈利能力和持久的采购项目转型，再以私人市场顶端估值倍数投入资本。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
