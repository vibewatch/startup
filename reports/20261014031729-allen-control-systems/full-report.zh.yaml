      - number: '4.2'
        title: 单位经济、生产成本驱动与利润率路径
        blocks:
          - type: paragraph
            body: >-
              ACS 的商业逻辑是用低价 Bullfrog 逆转无人机防御的成本失衡。公司称标准 7.62 mm、每发 50 美分弹药可实现约 $10 的击杀成本，但分析师指出这是未经审计的公司声明，不是验证过的战地指标；这一
              $10 数字仍未得到审计。不同点射长度、维护和光学校准会增加生命周期成本；扩建 191,000 平方英尺工厂并让员工数同比增长 95% 也需要大量资本。因此规模化单台成本尚未证明，毛利率无法独立验证。
