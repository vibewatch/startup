      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 防空中的非对称成本经济学
            body: 现代无人机战争暴露出严重成本失衡：军方用数百万美元拦截弹对付数百美元的消费级无人机。Bullfrog 将精确计算机视觉与标准弹药结合，目标是把每次击落成本压到数十美元。
            calloutType: insight
            claimRefs:
              - CO002
              - CO008
          - type: callout
            title: 向持续工业化制造转型
            body: 从交付 12 座原型炮塔转向跨军种持续生产 80 座以上，会引入复杂的供应链、质量控制和零部件依赖。ACS 已承诺在 Austin 建设 191,000 平方英尺设施，但工厂落地仍是核心风险。
            calloutType: risk
            claimRefs:
              - CO007
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、威胁环境与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              廉价无人机系统在全球冲突地区迅速普及，改变了战术防空需求。ACS 的市场包括可在战术距离击落 Group 1 至 Group 3 无人机和巡飞弹的自主动能 C-UAS
              武器站、自动枪架、计算机化火控、计算机视觉瞄准套件及 7.62 mm 和 12.7 mm
              机枪集成套件；不包括高层级战区拦截器、远程地空导弹、通用汽车底盘和不能实施实体拦截的电子战干扰吊舱。传统替代方案是人工机枪和雷达制导导弹：前者反应慢、跟踪误差大，后者用数百万美元拦截弹对付数百或数千美元的机体。自主动能武器站以低弹药成本提供软件驱动的精度，并覆盖海上远征无人平台。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM013
      - number: '2.2'
        title: 市场规模：TAM、SAM 与受约束的可服务层
        blocks:
          - type: paragraph
            body: >-
              自主反无人机机器人市场需要拆分为可触达的战术硬件和软件层。预测认为全球反无人机市场到 2030 年将达到 $20.31 billion，但 TAM
              还包括固定雷达、声学传感器、射频欺骗阵列和高能激光。美国国防部及盟国战术动能 C-UAS 的 SAM 约为每年 $1.85 billion，受地面防空和机动力量防护预算约束。2026 年军方客户承诺采购 80 座
              Bullfrog，按代理成本估算，初始硬件管线约 $160 million。ACS 的 $200 million Series B 和 $2.2 billion
              融资后估值体现投资者信心，但公开信息未拆分售价、软件许可利润或维护收入；长期份额取决于原型部署能否转为多年预算拨款。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM008
              - CM011
              - CM014
              - CM015
