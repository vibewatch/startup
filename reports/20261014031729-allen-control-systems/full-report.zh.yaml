      - number: '7.2'
        title: 运营扩张、供应链依赖与硬件可靠性
        blocks:
          - type: paragraph
            body: >-
              从低速率初始演示单元转向大批量制造，是 ACS 近期最紧迫的运营挑战。公司将在 Austin 增加 191,000 平方英尺生产设施，并在 Mountain View
              设工程办公室。扩大产能需要库存管理、精确配套和可靠的商用现货及政府提供零部件供应。Bullfrog 使用 M240、M2
              等通用机枪以绕开专用弹药瓶颈，但炮塔硬件仍易受零部件短缺、机电磨损和持续射击下枪管过热影响。其能力边界也很明确：Bullfrog 只能击落 Group 1 至 Group 3
              无人机，无法动能拦截来袭巡航导弹、战术弹道导弹或高超音速武器。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
