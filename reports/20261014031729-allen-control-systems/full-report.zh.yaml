  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管要求、出口管制与自主系统治理
        blocks:
          - type: paragraph
            body: >-
              自主动能武器处于高度审查的监管和法律环境，安全合规是客户采用前提。海军陆战队虽选择 Bullfrog 集成至 L-MADIS，但合同仍是原型
              OTA，后续生产不享有联邦采购法规保障；若正式项目集成停滞，公司将面临采购转换风险。自主火控还必须遵守 Department of Defense Directive
              3000.09，开火前需要经过验证的人在回路授权。国际扩张则受 ITAR 和 EAR 约束，行政延迟或出口分类障碍可能限制国际收入兑现。
