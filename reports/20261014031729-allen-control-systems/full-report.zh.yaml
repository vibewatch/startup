            body: >-
              Bullfrog 是用于击落 Group 1 至 Group 3 无人机的自主武器站，将标准军用枪械与高速精密机器人、计算机视觉结合。Bullfrog M240C 使用 7.62 mm 机枪，有效动能交战距离最高
