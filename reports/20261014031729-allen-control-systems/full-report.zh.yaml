chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、使命与产品模式
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems（ACS）成立于 2024 年，旨在应对武器化无人机系统（UAS）造成的战术与经济失衡。公司总部位于 Texas 州 Austin，并在 Virginia 州
              Alexandria 和 Alabama 州 Huntsville 设有工程办公室，开发可实施精确动能打击的自主武器站。旗舰系统 Bullfrog 将计算机视觉、人工智能算法和高速机器人执行机构结合起来，把
              7.62 mm M240 等标准军用机枪改造成可击落 Group 1 至 Group 3 无人系统的自主反无人机炮塔。ACS
              使用库存标准弹药实施动能拦截，将单次交战成本压到普通弹药消耗水平，而不是依赖每次成本高达数十万美元的地空导弹。技术演示已引起军方兴趣，但商业收入、单台利润率和运营现金消耗仍未披露。
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO014
      - number: '1.2'
        title: 创始团队、组织架构与治理
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems 由首席执行官 Mike Wior 和总裁 Steve Simoni 共同创立，两人均深耕国防机器人、自主硬件和军事系统工程。Wior
              负责公司战略、政府事务及与国防部利益相关方的关系；Simoni 负责运营执行、先进制造扩产和硬件系统架构。两位创始人对早期客户信任和技术设计都至关重要，关键人依赖度较高。公司在 California 州
              Mountain View 设立技术办公室，以吸引计算机视觉和自主软件工程人才。公开文件尚未披露完整高管构成、独立董事监督和 Series B 后的委员会章程，这部分仍需保密尽调。
            claimRefs:
              - CO003
              - CO004
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO012
      - number: '1.3'
        title: 融资历程、估值与利益相关方分配
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月，Allen Control Systems 完成 $200 million Series B，融资后估值为 $2.2b。Smash Capital 领投，Craft
              Ventures、Rally Ventures 和 Inspired Capital 等现有机构继续参投。ACS 累计融资达到 $242 million，此前于 2024 年完成 $12 million
              种子轮、2025 年 3 月完成 $30 million Series A。投资方将公司从产品原型快速推进到一线部署视为重要理由。不过，该 $2.2b
              估值是在经审计商业收入披露前给出的高溢价资本化结果；具体股权权利、投票控制、清算优先权和债务安排仍未得到验证。
            claimRefs:
              - CO005
              - CO006
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.4'
        title: 运营里程碑、军方采用与生产规模
        blocks:
          - type: paragraph
            body: >-
              从 2024 年成立到 2026 年底，ACS 在测试、军方采购和实体制造扩张上取得多项里程碑。2026 年初，Bullfrog 参加五角大楼 Technology Readiness Experiment
              2026（T-REX 26-1），公司声称对目标无人机的成功率为 100%，但具体交战条件和运行参数未披露。伊朗冲突爆发后，美国陆军采购 12 座 Bullfrog 炮塔，并与美国海军和 Joint
              Interagency Task Force 401 继续测试。2026 年 7 月，美国海军陆战队在 Ground Based Air Defense（GBAD）项目下授予 ACS 原型 Other
              Transaction Agreement（OTA），将 Bullfrog 集成到 Light Marine Air Defense Integrated System（L-MADIS）。为兑现 2026 年
              80 座炮塔的承诺，ACS 将 Austin 总部扩至 57,000 平方英尺，并承诺建设 191,000 平方英尺生产工厂。
            claimRefs:
