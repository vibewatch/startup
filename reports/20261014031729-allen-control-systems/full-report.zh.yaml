      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              自主反无人机方案通过各军种、联合司令部和国际盟友的不同采购渠道落地。美国海军陆战队通过原型 OTA，在 GBAD 项目下选择将 Bullfrog 集成到 L-MADIS；美国陆军为应对中东升级采购 12
              座炮塔。USSOCOM 需要被动感知以避免主动雷达暴露位置。Joint Interagency Task Force 401 还与韩国和阿联酋买家评估 Bullfrog。Bullfrog 在 Technology
              Readiness Experiment 2026（T-REX 26-1）中展示 100% 成功率，为军方评估者决定部署提供实证依据。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、产业约束与规模尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求由弹匣深度和单次击杀成本推动：陆军称 Bullfrog 使用每发 50 美分弹药，ACS 声称平均每次击杀约 $10，从而可交战数百架低价无人机而不耗尽拦截弹。被动光电瞄准还保持电磁隐蔽。另一方面，ACS
              扩建 191,000
              平方英尺设施面临供应链和质量控制难题；持续高速生产需要精密机器人、加固传感器和军用计算机外壳的可靠供应。传统主承包商和机器人初创公司也在争夺资金。单台毛利率、软件许可经济性和紧急采购结束后的复购持续性仍有尽调缺口。
            claimRefs:
              - CM005
              - CM006
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 经济失衡颠覆防空逻辑
            body: ACS 的核心需求驱动不是机器人自动化本身，而是用数百美元无人机消耗数百万美元导弹的不可持续成本失衡。Bullfrog 使用低于一美元的通用弹药，提供传统导弹无法匹敌的弹匣深度和单次击杀成本。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM006
          - type: callout
            title: 扩大生产并超越原型 OTA
            body: ACS 已在陆军、海军陆战队和盟军取得覆盖，并承诺 80 座炮塔，但仍需把 191,000 平方英尺工厂提升至军用品质标准，并在竞争加剧时把早期原型 OTA 转为多年期正式项目。
            calloutType: risk
            claimRefs:
              - CM007
