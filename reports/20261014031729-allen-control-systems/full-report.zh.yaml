            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: 客户集中度、项目转型与集成瓶颈
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems 呈现出早期国防科技初创公司常见的高客户及交易对手集中度。经公开信息验证的采用情况仍集中在少数国防机构，主要包括美国陆军、美国海军陆战队和联合跨机构特遣部队
              401。因此，ACS 对五角大楼年度拨款安排、持续决议，以及各军种反无人机采购优先级的潜在变化都极为敏感。为了拓展地面车辆安装之外的应用，ACS 已与 Red Cat Holdings 建立集成合作，评估在
              Red Cat 海事部门 Blue Ops 运营的无人水面艇（USV）上加装 Bullfrog
              炮塔。然而，多域平台集成会带来技术接口风险，也依赖多家承包商同步推进。此外，这套自主系统高度依赖商用高性能嵌入式计算模块，具体为 NVIDIA Jetson
              架构，因此边缘推理硬件的供应链依赖十分关键，而这些硬件必须在严苛的野外环境中稳定运行。
            claimRefs:
