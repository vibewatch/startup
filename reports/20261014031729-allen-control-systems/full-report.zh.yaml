        title: 资本密集度、B 轮估值压力与论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems 的财务结构反映出投资者在 2026 年 6 月完成 $200 million B 轮融资后的激进预期；该轮融资将公司投后估值定为 $2.2
              billion。相比数百万美元一枚的防空导弹，使用标准 7.62mm 弹药的低单次击杀成本颇具吸引力，但 ACS
              尚未披露经审计的毛利率、单位生产成本或经常性软件收入。奥斯汀重型制造基础设施的建设需要大量营运资金；如果单位销量落后于初始生产承诺，公司可能面临现金消耗加速。明确的论点失效触发因素包括：海军陆战队原型 OTA
              未能转为多年期生产合同；发生违反安全指令的灾难性非指令性击发事故；或工厂长期爬坡延误，无法达到目标单位交付量。
            claimRefs:
              - CR002
