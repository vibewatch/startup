            body: 投资者在追加资本承诺前，必须审查 ACS 的物料清单成本结构，核实奥斯汀工厂爬坡期间的制造报废率，并确认其是否正式完成 DoD 指令 3000.09 关于自主跟踪与目标指示的合规审查。
            calloutType: recommendation
