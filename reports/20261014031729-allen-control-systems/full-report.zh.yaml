  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: C-UAS 格局与替代方案范式
        blocks:
          - type: paragraph
            body: >-
              C-UAS 竞争包括自主机器人动能武器站、高成本制导拦截弹、定向能与高功率微波、电子战干扰和无人拦截机五类范式。ACS 的 Bullfrog 通过 M240、M2 和 M230
              等标准机枪、计算机视觉和自动火控，瞄准 Group 1 至 Group 3 无人机。RTX、Lockheed Martin 等主承包商拥有 Coyote、Stinger 等拦截器，但每发数十万美元。Dedrone
              和 Aaronia 的软杀伤干扰对光纤制导、末端自主制导和无 GPS 蜂群效果有限；定向能系统则受热负荷、大气衰减和高功率限制。ACS 用通用弹药降低成本，但仍受弹道距离、弹匣容量和饱和攻击下热限制约束。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 竞争者类型、规模与战略定位
        blocks:
          - type: paragraph
            body: >-
              竞争者包括国防科技独角兽、主承包商、电子战专业公司和自主无人拦截机制造商。Anduril 以 Lattice、Anvil 和 Pulsar 构成直接威胁；RTX、Northrop Grumman 和
              Leonardo DRS 依靠既有武器站及军种渠道。Fortem Technologies 和 Red Cat Holdings 提供空中防御方案。ACS 加入 Red Cat Futures
              Initiative，评估将 Bullfrog 集成到 Blue Ops 无人水面舰和 Red Cat ISR 架构，以弥补缺乏自有空中 ISR，但也增加平台依赖和竞争集成风险。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP007
              - CP009
      - number: '3.3'
        title: 能力对比、成本动态与平台打包
        blocks:
          - type: paragraph
            body: >-
              反 UAS 采购越来越看重弹匣深度和单次击杀成本，而非理论拦截速度。ACS 声称使用 7.62 mm NATO 或 .50 BMG 时每次击杀成本为 50 美分至
              $10，并依靠被动光学和计算机视觉避免雷达暴露。Kongsberg（Protector）和 Leonardo DRS 的武器站拥有成熟稳定、装甲防护和多传感器热成像。ACS 已获得陆军 12 座采购、海军陆战队
              L-MADIS 集成和 $2 million SBIR 奖项验证，但在长时间蜂群作战中，枪管过热和补弹可能削弱其经济性。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 转换成本、分销壁垒与替代风险
        blocks:
          - type: paragraph
            body: >-
              ACS 的差异化取决于火控精度、制造扩张和项目集成壁垒。Bullfrog 集成进 L-MADIS 的原型 OTA 提高了短期替代摩擦；191,000 平方英尺 Austin
              工厂则回应了国防初创公司无法进行规模生产的历史弱点。但主流武器制造商可以通过软件升级加入计算机视觉和自动提前角火控。随着无人机装甲化、电子干扰化和机动化，7.62 mm 可能过时，ACS 需要集成更重的 30
              mm M230LF，代价是重量、后坐力和单发成本上升。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 战术反无人机战争中的成本交换困境
            body: ACS 的优势主要是经济而非弹道：用 50 美分或 10 美元子弹击落巡飞弹，可避免地空导弹防御的弹匣消耗。但动能炮塔只能保护视距内的局部资产，无法提供战区级区域拒止。
            calloutType: insight
            claimRefs:
              - CP001
              - CP010
          - type: callout
            title: 现有软件适配与口径过时
            body: >-
              既有武器站厂商若用商用计算机视觉升级瞄准软件，ACS 的纯软件优势可能减弱。小口径 7.62 mm 对大型装甲 Group 3 无人机的末端动能不足，迫使 ACS 进入与装甲车主承包商直接竞争的 30 mm
              武器类别。
            calloutType: risk
            claimRefs:
              - CP003
              - CP015
