      - number: '8.2'
        title: 融资背景、股权结构动态与估值倍数纪律
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems 的资本历史反映出投资者对动能反无人机能力的信心正在加速。从 2024 年 $12 million 种子轮、2025 年 $30 million A 轮，到 2026 年
              6 月的 $200 million B 轮，ACS 累计获得 $242 million 的全生命周期股权资本。B 轮由 Smash Capital 领投，Craft Ventures、Rally Ventures
              和 Inspired Capital 参与，公司投后估值为 $2.2 billion（投前 $2.0 billion）。ACS 通过拿下累计超过 $120 million
              的军方及盟友合同，验证了市场拉力；但按估计的当前年度合同吞吐量计算，其私人估值隐含约 15x 至 20x 的远期收入倍数。成熟国防主承包商的收入倍数约为 1.5x 至 2.5x，像 Shield AI 和
              Anduril 这样的风险投资支持型国防龙头则按软件与自主能力溢价倍数交易；相比之下，ACS
              的估值隐含了持续超高速增长的激进预期。投资者必须严格遵守倍数纪律，因为合同转化放缓或制造爬坡期间利润率受到挤压，都可能触发严重的下轮融资或倍数压缩风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: 可比国防科技倍数与情景分析
        blocks:
          - type: paragraph
            body: >-
              为建立严格的估值护栏，我们基于国防合同可比公司和工业执行能力，评估 Allen Control Systems 在三种不同的 5 年投资情景下的表现。乐观情景中，Bullfrog
              成功转入美国陆军和海军陆战队的正式项目，在北约及中东伙伴中扩大国际采购，并在规模化生产时实现 35% 毛利率，以 12x 收入倍数支撑 $5.4 billion 企业价值。基准情景中，ACS
              依靠其他交易协议下的选择性任务订单采购和海外销售维持业务（年度收入跑速 $80 million 至 $150 million），但营运资金摩擦和集成成本将毛利率限制在 22% 至 25%，企业价值为 $1.4
              billion 至 $1.8 billion（相当于已投入 B 轮资本的 0.6x 至
              0.8x）。悲观情景中，采购停留在演示周期，竞争性的定向能或拦截平台吸收军方预算，重型工厂扩建耗尽现金储备，企业价值在困境下被主承包商收购时降至 $150 million 至 $300
              million。鉴于回报分布高度不对称，入场纪律至关重要。
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV012
      - number: '8.4'
        title: 尽调要求、下行触发因素与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              考虑入场或进行老股交易的机构投资者，必须围绕五个核心运营与结构领域开展定向尽调。第一，核实原型其他交易协议（OTA）转入未来国防拨款中专门的国防部正式项目预算科目的转型管线。第二，审查制造物料清单成本、供应商集中度，以及奥斯汀
              191,000 平方英尺工厂的实际单位利润。第三，法律尽调应审查未公开的 B 轮清算优先权顺位和治理权，以评估普通股的下行估值压力。最后，出现以下三个可量化触发因素中的任意一个，投资论点就会失效：未能获得专门的
              FY2027 国防预算科目；工厂交付延误导致合同毛利为负；或商业市场出现与 Bullfrog 单次击杀成本相当、但有效交战距离更远的竞争性定向能或制导弹丸平台。
            claimRefs:
              - CV004
              - CV013
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 估值不对称与正式项目转型风险
            body: >-
              Allen Control Systems $2.2 billion 的投后估值已经计入即时的品类主导地位和快速工业化吞吐。然而，公司目前主要依靠其他交易协议和 JIATF-401
              等特遣部队运作，而不是成熟的国防正式项目。在 Bullfrog 获得未来国防预算周期中的专门预算科目前，收入仍容易受到采购周期延迟和持续决议的影响。
            calloutType: risk
            claimRefs:
              - CV001
              - CV004
              - CV013
          - type: callout
            title: 投资立场：跟踪评级与明确的失效标准
            body: >-
              我们建议潜在成长股权投资者采取跟踪立场。在没有披露生产毛利率和积压订单数据的情况下，按 $2.2 billion 的名义估值直接投资的风险回报并不理想。要升级为买入评级，必须确认正式的 DoD
              正式项目转型、规模化生产时单位生产成本带来的 >30% 毛利率，以及经验证的后续合同转化额超过 $200 million。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV014
