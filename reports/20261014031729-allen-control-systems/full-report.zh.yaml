            title: 国防采购中的原型到量产鸿沟
            body: >-
              尽管 ACS 凭借海军陆战队 GBAD 选型和陆军部署获得了显著曝光，但当前合同仍是原型阶段的其他交易协议（OTA），而非多年期正式项目（Program of
              Record）生产合同。如果国防拨款延迟，或集成测试遇到软件缺陷，在大批量制造达到盈亏平衡前，现金流可能就会停滞。
