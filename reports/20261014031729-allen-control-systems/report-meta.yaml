companyProfile:
  summary: >-
    Allen Control Systems develops Bullfrog, a mobile autonomous counter-drone weapon station that uses passive computer
    vision and robotic fire control to retrofit standard machine guns for military air defense. The company has early
    U.S. Army and Marine Corps traction, is scaling manufacturing in Austin, and remains opaque on revenue, margins, and
    burn.
