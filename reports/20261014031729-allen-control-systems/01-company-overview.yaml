  name: "Allen Control Systems"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Allen Control Systems (ACS) is an Austin-based defense technology robotics startup founded in 2024 that manufactures Bullfrog, an autonomous AI-powered counter-drone weapon station. In June 2026, ACS raised $200 million in Series B funding at a $2.2 billion post-money valuation led by Smash Capital, scaling from early Army and Marine Corps prototype deployments to high-volume manufacturing."
sections:
  - id: "company-identity-and-mission"
    title: "Company Identity, Mission, and Product Model"
    body: "Allen Control Systems (ACS) was established in 2024 to tackle the acute tactical and economic imbalance created by weaponized unmanned aerial systems (UAS). Operating from corporate headquarters in Austin, Texas, alongside engineering offices in Alexandria, Virginia, and Huntsville, Alabama, the company develops autonomous weapon stations capable of precision kinetic engagement. Its flagship system, Bullfrog, fuses computer vision, artificial intelligence algorithms, and high-speed robotic actuation to convert standard military machine guns, such as the 7.62 mm M240, into autonomous counter-drone turrets capable of defeating Group 1 through Group 3 unmanned systems. Rather than relying on expensive surface-to-air missiles that cost hundreds of thousands of dollars per engagement, ACS focuses on kinetic defeat utilizing standard inventory ammunition, reducing per-engagement costs to nominal ammunition expenditure. While the company's technical demonstrations have attracted significant military interest, commercial revenue, unit margins, and operational cash burn remain undisclosed private metrics."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "founding-leadership-and-governance"
    title: "Founding Leadership, Team Architecture, and Governance"
    body: "Allen Control Systems was co-founded by Chief Executive Officer Mike Wior and President Steve Simoni, both of whom possess substantial backgrounds in defense robotics, autonomous hardware, and military systems engineering. Wior leads executive strategy, government affairs, and strategic relationship development with Department of Defense stakeholders, while Simoni directs operational execution, advanced manufacturing scale, and hardware systems architecture. Key-person dependency on both co-founders remains elevated given their centrality to early customer trust and technical system design. As the company expands into high-volume manufacturing, it is establishing technical offices in Mountain View, California, to attract specialized computer vision and autonomy software engineering talent. However, the broader composition of the executive leadership team, independent board oversight, and specific committee charters post-Series B remain undisclosed in public corporate filings, representing an area requiring confidential diligence review."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-investors-and-stakeholders"
    title: "Capitalization History, Valuation, and Stakeholder Distribution"
    body: "In June 2026, Allen Control Systems completed a $200 million Series B capitalization round that valued the business at a post-money valuation of $2.2 billion. The financing round was led by Smash Capital, with ongoing participation from existing institutional venture firms including Craft Ventures, Rally Ventures, and Inspired Capital. This transaction brought ACS's cumulative lifetime venture capital raised to $242 million, following a $12 million seed round in 2024 and a $30 million Series A round in March 2025. Smash Capital partners Kevin Mayer and Paul Szurek highlighted ACS's rapid transition from initial product prototyping to frontline field deployment as key rationale for the investment. Nevertheless, the $2.2 billion valuation multiple represents a premium capitalization ahead of audited commercial revenue disclosures, and specific equity rights, voting control, liquidation preferences, and debt arrangements remain unverified outside non-disclosure agreements."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "operational-milestones-and-scale-trajectories"
    title: "Operational Milestones, Military Adoption, and Production Scale"
    body: "Between its 2024 founding and late 2026, Allen Control Systems achieved multiple operational milestones across testing, military procurement, and physical manufacturing expansion. In early 2026, Bullfrog participated in the Pentagon's Technology Readiness Experiment 2026 (T-REX 26-1), where the company claimed a 100 percent success rate against target drones, although independent defense analysts noted that specific engagement conditions and operational parameters were not disclosed. Following the outbreak of conflict in Iran, the U.S. Army procured 12 Bullfrog turrets for rapid operational deployment, complementing active testing with the U.S. Navy and Joint Interagency Task Force 401. In July 2026, the U.S. Marine Corps awarded ACS a prototype Other Transaction Agreement (OTA) under the Ground Based Air Defense (GBAD) program to integrate Bullfrog onto the Light Marine Air Defense Integrated System (L-MADIS). To fulfill commitments for 80 turrets in 2026, ACS expanded its Austin headquarters to 57,000 square feet and committed to a new 191,000-square-foot production plant."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO014"
    figureRefs:
      - "FO001"
