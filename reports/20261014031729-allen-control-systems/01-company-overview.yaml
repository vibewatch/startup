callouts:
  - calloutType: "insight"
    title: "Asymmetric Cost Economics in Air Defense"
    body: "Modern drone warfare has exposed severe cost asymmetries where militaries deploy million-dollar interceptor missiles against consumer-grade drones costing hundreds of dollars. ACS's Bullfrog system addresses this economic imbalance by combining precision computer vision with standard ammunition, targeting drone defeat at tens of dollars per engagement."
    claimRefs:
      - "CO002"
      - "CO008"
  - calloutType: "risk"
    title: "Transition to Sustained Industrial Manufacturing"
    body: "Scaling from delivering twelve prototype turrets to sustained high-volume production of eighty or more units across military branches introduces complex supply chain, quality control, and component availability dependencies. While ACS has committed to a 191,000-square-foot facility in Austin, factory execution remains a central risk factor."
    claimRefs:
      - "CO007"
      - "CO014"
