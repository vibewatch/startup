      - number: '6.2'
        title: Production Contracts, OTAs, and Operational Adoption Trajectory
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems' adoption trajectory has transitioned rapidly from experimental prototyping to
              initial production commitments following the expansion of drone warfare in regional conflicts. Public
              defense market reporting indicates that ACS has accumulated more than $120 million in contracts across
              domestic and international military customers. Adoption gained urgent momentum when Army Secretary Dan
              Driscoll disclosed that the U.S. Army purchased 12 Bullfrog turrets for operational deployment. ACS claims
              its kinetic approach fundamentally alters counter-drone economics, delivering engagements at approximately
              $10 per kill using standard 50-cent machine gun bullets compared to interceptor missiles costing hundreds
              of thousands of dollars. Recent reporting indicates approximately 80 Bullfrog turrets have been committed
              across customer organizations in 2026, encompassing the Army, Marine Corps, Special Operations Command,
              and foreign buyers in South Korea and the United Arab Emirates. To fulfill these commitments, ACS is
              expanding its Austin manufacturing facility to 191,000 square feet.
