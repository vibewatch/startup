      - number: '3.3'
        title: Capability Comparison, Cost Dynamics, and Platform Packaging
        blocks:
          - type: paragraph
            body: >-
              Military procurement in counter-UAS is increasingly dictated by magazine depth and unit cost-per-kill
              rather than raw theoretical intercept speed. In contested theater deployments across Ukraine and the
              Middle East, high-volume drone swarms rapidly exhaust conventional missile magazines, creating
              catastrophic vulnerability for forward maneuver units. ACS positions Bullfrog specifically to reverse this
              economic imbalance, claiming engagement costs as low as 50 cents to 10 dollars per kill when utilizing
              service-common machine-gun cartridges like 7.62 mm NATO or .50 BMG. The system emphasizes passive optical
              and computer vision detection, which avoids emitting active radar signatures that adversary electronic
              support measures could target. However, competitive packaging tradeoffs are pronounced. Remote weapon
              stations from traditional primes like Kongsberg (Protector) and Leonardo DRS offer mature dual-axis
              stabilization, proven ballistic armor, and multi-sensor thermal integration developed over decades of
              armored vehicle operations. While ACS achieved early contract validations—including 12 Bullfrog turrets
              acquired by the U.S. Army, selection by the Marine Corps for L-MADIS integration, and participation in the
              U.S. Army xTechOverwatch competition ($2 million SBIR award)—its unit economics remain uncorroborated in
              prolonged combat against massed simultaneous swarms where gun barrels overheat and ammunition
              replenishment becomes a critical tactical constraint.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Switching Costs, Distribution Barriers, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              The durability of ACS's competitive differentiation hinges on software fire-control precision,
              manufacturing scalability, and program integration barriers. Defense procurement cycles impose severe
              switching costs once a counter-UAS effector is qualified into a military formation's base architecture.
              For instance, the Marine Corps's integration of Bullfrog into the Light Marine Air Defense Integrated
              System (L-MADIS) under a prototype Other Transaction Agreement (OTA) creates high institutional friction
              against near-term displacement by rival turret makers. Similarly, ACS's expansion of a 191,000-square-foot
              factory in Austin, Texas, addresses a primary historical vulnerability of defense tech startups: the
              inability to deliver series production at defense scale. Nevertheless, ACS's technological moat faces
              structural long-term pressures. Major weapon manufacturers and remote weapon station incumbents can
              incorporate upgraded computer vision and automated lead-angle fire control algorithms into their existing
              fielded mounts via software modernization. Furthermore, as drone threats evolve toward armored airframes,
              standoff electronic jamming, and autonomous evasive flight paths, small-caliber ballistics like 7.62 mm
              risk obsolescence, forcing ACS to continuously integrate larger calibers (such as 30 mm M230LF) that carry
              heavier platform weight, greater recoil penalties, and higher per-shot costs.
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Cost-Exchange Dilemma in Tactical Counter-Drone Warfare
            body: >-
              ACS's primary competitive advantage is economic rather than ballistic: firing a 50-cent or 10-dollar
              bullet to neutralize an incoming loitering munition circumvents the magazine depletion inherent in
              surface-to-air missile defenses. However, this creates a distinct operational boundary: kinetic gun
              turrets only protect local assets within line-of-sight and cannot provide theater-wide area denial.
            calloutType: insight
            claimRefs:
              - CP001
              - CP010
          - type: callout
            title: Incumbent Software Adaptation and Caliber Obsolescence
            body: >-
              As established remote weapon station manufacturers upgrade their targeting software with commercial
              computer vision, ACS's pure-software edge may erode. Furthermore, small 7.62 mm machine guns lack terminal
              kinetic energy against larger, armored Group 3 drones, forcing ACS into heavier 30 mm weapon classes that
              compete directly with armored vehicle prime contractors.
            calloutType: risk
            claimRefs:
              - CP003
              - CP015
