        title: Founding Leadership, Team Architecture, and Governance
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems was co-founded by Chief Executive Officer Mike Wior and President Steve Simoni, both
              of whom possess substantial backgrounds in defense robotics, autonomous hardware, and military systems
              engineering. Wior leads executive strategy, government affairs, and strategic relationship development
              with Department of Defense stakeholders, while Simoni directs operational execution, advanced
              manufacturing scale, and hardware systems architecture. Key-person dependency on both co-founders remains
              elevated given their centrality to early customer trust and technical system design. As the company
              expands into high-volume manufacturing, it is establishing technical offices in Mountain View, California,
              to attract specialized computer vision and autonomy software engineering talent. However, the broader
              composition of the executive leadership team, independent board oversight, and specific committee charters
              post-Series B remain undisclosed in public corporate filings, representing an area requiring confidential
              diligence review.
