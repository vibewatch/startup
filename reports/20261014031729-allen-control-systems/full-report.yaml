        title: Fielded Deployments & Named Reference Program Evidence
        blocks:
          - type: paragraph
            body: >-
              Concrete customer proof for Allen Control Systems is anchored by formal U.S. military selection and
              validation events. In July 2026, the U.S. Marine Corps selected Bullfrog under its Ground Based Air
              Defense (GBAD) program, integrating the autonomous turret into the Light Marine Air Defense Integrated
              System (L-MADIS) through a prototype Other Transaction Agreement. L-MADIS serves as the Marine Corps'
              primary mobile counter-UAS vehicle platform, validating Bullfrog's physical form factor and weapon
              compatibility in expeditionary environments. Beyond the Marine Corps, Bullfrog has seen operational
              fielding with the U.S. Army and Navy, as well as testing under Joint Interagency Task Force 401. The
              company highlighted a 100 percent defeat rate at the Pentagon's Technology Readiness Experiment 2026
              (T-REX 26-1). However, defense analysts caution that specific target velocities, engagement ranges, and
              sensor constraints from T-REX 26-1 remain undisclosed, leaving full operational effectiveness under
              contested conditions partially verified.
