  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Mandates, Export Controls, and Autonomy Governance
        blocks:
          - type: paragraph
            body: >-
              Autonomous kinetic weapon systems operate in a highly scrutinized regulatory and legal environment where
              safety compliance is a prerequisite for customer adoption. While Allen Control Systems has achieved
              notable visibility with the U.S. Marine Corps selection of Bullfrog for the Light Marine Air Defense
              Integrated System (L-MADIS), the underlying contract is a prototype Other Transaction Agreement (OTA).
              Prototype OTAs do not carry Federal Acquisition Regulation guarantees for follow-on production awards,
              exposing the company to procurement transition risk if formal Program of Record integration stalls.
              Furthermore, deployment of autonomous fire-control platforms must strictly adhere to Department of Defense
              Directive 3000.09 policies regarding lethal force authorization, requiring verified human-in-the-loop
              consent before weapon discharge. International market expansion also introduces stringent compliance
              obligations under International Traffic in Arms Regulations (ITAR) and Export Administration Regulations
              (EAR), where administrative delays or export classification hurdles could constrain international revenue
              realization.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
