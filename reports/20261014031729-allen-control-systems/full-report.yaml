      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Financing Trajectory
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems secured substantial balance-sheet liquidity in June 2026 by closing a $200 million
              Series B financing round at a $2.2 billion post-money valuation led by Smash Capital, bringing total
              equity funding to $242 million across seed, Series A, and Series B rounds. The capital injection provides
              ACS with critical runway to fund aggressive operational expansion, including establishing its
              191,000-square-foot manufacturing plant in Austin and opening a software engineering office in Mountain
              View, California. However, high fixed-cost absorption from real estate commitments, rapid personnel
              growth, and long government accounts receivable cycles will accelerate monthly operational cash burn.
              Because defense procurement typically requires multi-year qualification and delivery cycles before
              large-scale program-of-record cash collections materialize, managing working capital and inventory
              requirements will remain a primary operational hurdle.
            claimRefs:
