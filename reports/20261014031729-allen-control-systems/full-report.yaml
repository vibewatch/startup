      - number: '7.3'
        title: Procurement Concentration, Program Transition, and Integration Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems exhibits high customer and counterparty concentration characteristic of early-stage
              defense technology startups. Publicly validated adoption remains concentrated within a small cluster of
              defense organizations, primarily the U.S. Army, Marine Corps, and Joint Interagency Task Force 401.
              Consequently, ACS remains acutely sensitive to annual Pentagon appropriations schedules, continuing
              resolutions, and potential shifts in counter-UAS procurement priorities across service branches. To expand
              beyond ground vehicle installations, ACS has formed an integration partnership with Red Cat Holdings to
              evaluate mounting Bullfrog turrets on uncrewed surface vessels (USVs) operated by Red Cat's Blue Ops
              maritime division. However, multi-domain platform integration introduces technical interface risks and
              multi-contractor synchronization dependencies. Additionally, the autonomy stack relies heavily on
              commercial high-performance embedded compute modules, specifically NVIDIA Jetson architectures, creating
              critical supply chain dependencies for edge inference hardware that must operate reliably under austere
              field conditions.
            claimRefs:
