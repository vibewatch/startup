        title: Exhibits
        blocks:
          - type: callout
            title: The Prototype-to-Production Chasm in Defense Procurement
            body: >-
              Although ACS has achieved significant visibility through the Marine Corps GBAD selection and Army
              deployments, contracts remain prototype Other Transaction Agreements (OTAs) rather than multi-year Program
              of Record production contracts. If defense appropriations face delays or if integration testing encounters
              software bugs, cash flow could stall before high-volume manufacturing reaches break-even.
            calloutType: risk
            claimRefs:
