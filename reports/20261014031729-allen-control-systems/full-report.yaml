      - number: '7.4'
        title: Capital Intensity, Series B Valuation Overhang, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The financial structure of Allen Control Systems reflects aggressive investor expectations following its
              $200 million Series B round in June 2026, which valued the business at a post-money capitalization of $2.2
              billion. While the low cost-per-kill proposition of firing standard 7.62mm ammunition is compelling
              relative to multi-million-dollar air defense missiles, ACS has not disclosed audited gross margins, unit
              production costs, or recurring software revenue figures. Building out heavy manufacturing infrastructure
              in Austin demands substantial working capital, exposing the company to cash burn acceleration if unit
              sales lag initial production commitments. Clear thesis-break triggers include any failure to convert the
              Marine Corps prototype OTA into a multi-year production contract, catastrophic uncommanded discharge
              incidents violating safety directives, or prolonged factory ramp delays that fail to achieve targeted unit
              delivery volumes.
            claimRefs:
