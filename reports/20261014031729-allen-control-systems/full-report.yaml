      - number: '5.2'
        title: Passive Optical Detection and Edge Autonomy Computing
        blocks:
          - type: paragraph
            body: >-
              A central architectural differentiator of the Bullfrog system is its reliance on passive optical computer
              vision rather than active radiofrequency radar for target detection and tracking. Active radar emitters
              broadcast electromagnetic signatures that modern adversaries can detect and target with anti-radiation
              loitering munitions or electronic direction finding. Bullfrog circumvents this battlefield vulnerability
              by maintaining a passive detection posture, utilizing high-resolution electro-optical sensors to scan
              airspace and acquire incoming unmanned threats visually. Target video is ingested by onboard edge
              processors running proprietary machine learning algorithms trained on synthetic data generation pipelines
              to classify micro-drones, fixed-wing UAS, and dynamic swarms against complex backgrounds. Once target
              acquisition is established, the autonomous fire control system computes microsecond ballistic lead
              solutions and controls robotic gimbal motors to track the most vulnerable structural components of
              incoming drones. The platform is designed with an open architecture to communicate with higher-echelon
              command and control networks, while maintaining mandatory human-in-the-loop fire control authorization
              under standard military engagement doctrine.
            claimRefs:
              - CE005
              - CE006
              - CE014
          - type: figure
            figureRef: FE001
