    title: Counter-UAS Alternative Solution Profiles and Tradeoffs
    columns:
      - Solution Class
      - Representative Vendors
      - Primary Defeat Mechanism
      - Unit Cost per Intercept
      - Key Advantage
      - Critical Limitation
    rows:
      - - Autonomous Kinetic Turrets
        - Allen Control Systems (Bullfrog), EOS Defense
        - Precision robotic gun fire control (7.62mm / .50 cal / 30mm)
        - $0.50 to $100 per burst
        - Low cost per kill; deep magazine using service ammunition
        - Effective range limited to direct line-of-sight (<1 km)
      - - Guided Missile Interceptors
        - RTX (Coyote), Lockheed Martin (Stinger)
        - Rocket-propelled hit-to-kill or proximity fragmentation
        - $100,000 to $1,000,000+
        - Extended standoff range; all-weather intercept capability
        - Prohibitive cost asymmetry; rapid magazine exhaustion
      - - Uncrewed Kinetic Drones
        - Anduril (Anvil), Fortem (DroneHunter)
        - Direct kinetic ramming or net capture
        - $5,000 to $25,000
        - Flexible engagement geometry; reusable or low-cost airframes
        - Speed limits against fast UAS; battery cycle constraints
      - - Electronic Warfare Jamming
        - Dedrone, Aaronia, SRC Inc.
        - RF link disruption and GNSS signal jamming
        - Negligible per-engagement marginal cost
        - Area-wide coverage without kinetic debris hazard
        - Ineffective against autonomous navigation or fiber-optic links
      - - Directed Energy / Laser
        - Lockheed Martin, Epirus (Leonidas HPM)
        - High-energy laser thermal burn or high-power microwave
        - <$10 in electrical prime power
        - Speed-of-light engagement; deep magazine if powered
        - Extreme thermal load; weather and line-of-sight constraints
