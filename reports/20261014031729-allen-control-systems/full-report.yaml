            body: >-
              To expand its operational deployment surfaces beyond ground vehicles, Allen Control Systems has pursued
              strategic integration partnerships. In March 2026, ACS joined the Red Cat Futures Initiative to integrate
              the Bullfrog turret onto Blue Ops Uncrewed Surface Vessels, providing autonomous maritime counter-drone
