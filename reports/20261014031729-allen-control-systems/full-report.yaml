  - id: TV002
    title: Core Investment Thesis and Anti-Thesis Balance
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counterpoint
      - View-Breaker Trigger
    rows:
      - - Economics
        - >-
          Low-cost kinetic defeat ($10/kill) solves asymmetric drone threat and preserves multi-million dollar
          interceptors
        - Kinetic gun turrets have restricted engagement envelopes against high-speed or terminal-dive threats
        - Adoption of directed energy or micro-missiles achieving sub-$1,000 kill cost at superior range
      - - Procurement
        - $120M+ across USSOCOM, Navy, Army, and international buyers indicates strong defense pull
        - Current procurement relies on prototype OTAs and task forces rather than established Programs of Record
        - Failure to secure dedicated FY2027 budget line item in formal DoD procurement exhibits
      - - Industrial Base
        - 191,000 sq ft Austin plant and 90% COTS components enable rapid scale to thousands of units annually
        - Transition from low-rate prototyping to high-rate serial manufacturing creates severe working-capital drag
        - Factory ramp delays leading to delivery defaults or negative gross margins under fixed-price contracts
      - - Valuation Entry
        - Market-leading position in kinetic counter-UAS justifies premium defense-tech valuation multiple
        - $2.2B post-money valuation prices in flawless execution and rapid conversion to $1B revenue trajectory
        - Secondary trades at >30% discount or down-round financing by comparable defense unicorns
    notes: >-
      Pillars evaluate verified military operational evidence against structural defense contracting and hardware
      scaling risks.
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV007
      - CV008
      - CV011
  - id: TV003
    title: Bull, Base, and Bear Valuation Scenarios (5-Year Horizon)
    columns:
      - Scenario
      - Core Assumptions
      - Revenue & Multiple Logic
      - Implied Valuation
      - Probability Signal
      - Downside Triggers
    rows:
      - - Bull Case
        - >-
          Bullfrog achieves Program of Record status across Army and USMC; international sales expand across NATO and
          Middle East; margins reach 35%
        - >-
          Scales to $450M revenue by Year 5; valued at 12x revenue multiple in line with premium defense prime
          software/autonomy multiples
        - $5.4B Enterprise Value (2.5x MOIC)
        - 20%
        - Program cancellation, export license rejections, or prime integrator acquisition of competing RWS
      - - Base Case
        - >-
          Sustains task-order deployments and OTA conversions ($80M-$150M annual delivery volume); gross margins settle
          at 22-25% under supply constraints
        - >-
          Reaches $180M revenue by Year 5; valued at 8x revenue multiple reflecting hybrid hardware-software defense
          tier
        - $1.4B - $1.8B Enterprise Value (0.6x - 0.8x MOIC)
        - 55%
        - DoD continuing resolutions stalling procurement; margin erosion from custom integration costs
      - - Bear Case
        - >-
          Procurement stalls in demonstration phase; counter-UAS spending shifts to directed-energy and drone
          interceptors; heavy manufacturing CapEx drain
        - Revenue peaks below $50M; valued at 2-3x hardware multiple or distressed asset sale to defense prime
        - $150M - $300M Enterprise Value (-85% loss)
        - 25%
        - Failure of serial production quality control; lethal autonomous weapon regulatory restrictions
    notes: >-
      Projections assume 5-year hold period from 2026 Series B baseline; probabilities reflect private defense tech
      hardware conversion historical rates.
