      - number: '8.2'
        title: Financing Context, Cap-Table Dynamics, and Valuation Multiple Discipline
        blocks:
          - type: paragraph
            body: >-
              The capital history of Allen Control Systems reflects accelerating investor conviction in kinetic
              counter-UAS capabilities. Across its $12 million seed round in 2024, $30 million Series A in 2025, and
              $200 million Series B in June 2026, ACS has secured $242 million in total lifetime equity capital. The
              Series B round, led by Smash Capital with participation from Craft Ventures, Rally Ventures, and Inspired
              Capital, pegged the company's valuation at $2.2 billion post-money ($2.0 billion pre-money). While ACS has
              validated market pull by securing over $120 million in cumulative military and allied contracts, its
              private valuation implies a forward revenue multiple of approximately 15x to 20x against estimated current
              annual contract throughput. In comparison with mature defense primes trading at 1.5x to 2.5x revenue and
              venture-backed defense leaders like Shield AI and Anduril trading at premium software-and-autonomy
              multiples, ACS's valuation embeds aggressive expectations of sustained hyper-growth. Investors must
              maintain strict multiple discipline, as any slowdown in contract conversion or margin compression during
              manufacturing ramp-up could trigger severe down-round or multiple-compression risks.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV011
      - number: '8.3'
        title: Comparable Defense-Tech Multiples and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              To establish rigorous valuation guardrails, we evaluate Allen Control Systems across three distinct 5-year
              investment scenarios grounded in defense contracting comparables and industrial execution. In the bull
              case, Bullfrog successfully transitions into formal Programs of Record across the U.S. Army and Marine
              Corps, scales international procurement across NATO and Middle Eastern partners, and delivers 35% gross
              margins at volume, supporting a $5.4 billion enterprise value at a 12x revenue multiple. In the base case,
              ACS sustains selective task-order procurement under Other Transaction Agreements and foreign sales ($80
              million to $150 million annual run rate) but encounters working capital friction and integration costs
              that restrict gross margins to 22% to 25%, yielding an enterprise value between $1.4 billion and $1.8
              billion (a 0.6x to 0.8x multiple of invested Series B capital). In the bear case, procurement stalls in
              demonstration cycles, competing directed-energy or interceptor platforms absorb military budgets, and
              heavy factory expansion drains cash reserves, reducing enterprise valuation to $150 million to $300
              million in a distressed prime acquisition. Given these asymmetric return profiles, entry discipline is
              critical.
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV012
      - number: '8.4'
        title: Diligence Asks, Downside Triggers, and Thesis-Break Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Institutional investors contemplating entry or secondary transactions must execute targeted diligence
              across five core operational and structural frontiers. First, diligence must verify the transition
              pipeline from prototype Other Transaction Agreements (OTAs) into dedicated Department of Defense Program
              of Record line items in future defense appropriations. Second, analysts must examine manufacturing
              bill-of-materials costs, supplier concentration, and actual unit margins across the 191,000-square-foot
              Austin plant. Third, legal diligence should review non-public Series B liquidation preference seniority
              and governance rights to evaluate downside common equity overhang. Finally, the thesis would break upon
              any of three measurable triggers: failure to secure dedicated FY2027 defense budget line items; factory
              delivery delays resulting in negative contract gross margins; or the commercial emergence of competing
              directed-energy or guided-projectile platforms that match Bullfrog's cost-per-kill while exceeding its
              effective engagement range.
            claimRefs:
              - CV004
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Asymmetry and Program of Record Transition Risk
            body: >-
              Allen Control Systems' $2.2 billion post-money valuation prices in immediate category dominance and rapid
              industrial throughput. However, the company currently operates primarily through Other Transaction
              Agreements and task forces like JIATF-401 rather than established defense Programs of Record. Until
              Bullfrog secures dedicated line-item appropriations in future defense budget cycles, revenue remains
              vulnerable to procurement cycle delays and continuing resolutions.
            calloutType: risk
            claimRefs:
              - CV001
              - CV004
              - CV013
          - type: callout
            title: 'Investment Stance: Track Recommendation with Concrete Kill Criteria'
            body: >-
              We recommend a track stance for prospective growth equity investors. Direct investment at the $2.2 billion
              headline valuation offers an unfavorable risk-reward profile without disclosed production gross margins
              and backlog data. An upgrade to buy would require confirmation of a formal DoD Program of Record
              transition, unit production costs yielding >30% gross margins at volume, and verified follow-on contract
              conversions exceeding $200 million.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV010
              - CV014
