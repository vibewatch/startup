      - number: '4.2'
        title: Unit Economics, Production Cost Drivers, and Margin Path
        blocks:
          - type: paragraph
            body: >-
              The core commercial thesis of Allen Control Systems rests on reversing the unfavorable cost asymmetry of
              modern drone defense, where militaries deploy million-dollar interceptors against low-cost commercial
              drones. ACS markets Bullfrog as achieving engagements at approximately $10 per defeat by utilizing
              standard military munitions such as 7.62 mm bullets costing 50 cents each. However, defense manufacturing
              analysts caution that this $10 figure is an unaudited company assertion rather than a verified field
              operational metric. Real-world engagements require variable burst lengths, system maintenance, and optics
              calibration that increase overall lifecycle costs. Furthermore, ACS is currently undergoing a
              capital-intensive manufacturing scaling phase, committing to a 191,000-square-foot production plant in
              Austin and increasing headcount by 95% year-over-year. As a result, unit manufacturing costs remain
              unproven at scale and gross margins cannot be independently verified.
