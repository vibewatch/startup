      - number: '5.4'
        title: Industrial Manufacturing Scale and Environmental Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              To support fielding commitments following combat procurement by the Army and Navy, ACS has established a
              191,000-square-foot manufacturing facility in Austin, Texas. Producing autonomous turrets at military
              scale requires rigorous quality assurance across precision robotic actuators, optical glass housings, and
              embedded computing hardware that must withstand heavy weapon recoil and hostile field environments. While
              ACS claims Bullfrog flips the air defense cost curve by achieving roughly $10 per UAS engagement using
              standard 50-cent ammunition rounds, several material technical and environmental risks remain unverified.
              Chief among these diligence gaps is the lack of public independent data regarding optical tracking
              fidelity in heavy fog, precipitation, battlefield smoke, and active optical dazzling. Furthermore, while
              passive machine vision eliminates active radar emissions, the system's reliance on edge neural processing
              introduces vulnerability to adversarial camouflage, rapid drone maneuvers at visual detection limits, and
              optical lens contamination in dirty battlefield environments.
            claimRefs:
              - CE010
