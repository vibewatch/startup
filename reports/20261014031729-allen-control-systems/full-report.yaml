  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Military Customer Segmentation & Mission Profiles
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems operates squarely as a defense technology contractor focused on
              government-to-government (B2G) sales to the U.S. Department of Defense and allied international
              militaries. The company's customer base is structured around four primary demand segments: expeditionary
              ground forces requiring mobile air defense, fixed-site and critical infrastructure defense units, naval
              and maritime operators seeking perimeter protection, and international allied defense ministries facing
              asymmetric drone swarms. In the expeditionary ground segment, tactical warfighters face low-cost Group 1
              through Group 3 commercial and weaponized drones that overwhelm traditional air defenses. ACS addresses
              this demand by offering its Bullfrog robotic weapon station, which mounts onto legacy infantry firearms
              such as M240 and M2 machine guns without requiring dedicated radar emitters. Buyer authority is
              distributed across rapid procurement organizations such as the Joint Interagency Task Force 401, service
              branch modernization offices, and combatant command urgent operational needs statements.
            claimRefs:
