  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Modular Weapon Station Architecture and Kinetic Payloads
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems develops Bullfrog, an autonomous weapon station engineered to defeat Group 1 through
              Group 3 unmanned aerial systems across contested ground and maritime environments. Bullfrog functions by
              mounting standard military firearms and pairing them with high-speed precision robotics and computer
              vision to deliver accurate fire without relying on guided missile interceptors. The core product line
              includes the Bullfrog M240C, which mounts a 7.62 mm machine gun providing an effective kinetic engagement
              range of up to 800 meters against commercial and weaponized drones. For heavier targets and extended
              defense envelopes, ACS is preparing the Bullfrog M2 variant featuring a .50 caliber heavy machine gun with
              a 1,500-meter range for protective fire missions, alongside roadmap configurations planned around the M230
              30 mm cannon and M134 minigun for high-rate convoy protection. In addition to kinetic firearms, the
              Bullfrog architecture supports non-kinetic capabilities, including an optical laser dazzler designed to
              saturate sensors at 2 km and disable drone focal planes at 1 km, as well as composite rubber rounds with a
              300-yard effective range for low-collateral perimeter defense.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
