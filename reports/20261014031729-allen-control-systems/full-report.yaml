      - number: '1.3'
        title: Capitalization History, Valuation, and Stakeholder Distribution
        blocks:
          - type: paragraph
            body: >-
              In June 2026, Allen Control Systems completed a $200 million Series B capitalization round that valued the
              business at a post-money valuation of $2.2 billion. The financing round was led by Smash Capital, with
              ongoing participation from existing institutional venture firms including Craft Ventures, Rally Ventures,
              and Inspired Capital. This transaction brought ACS's cumulative lifetime venture capital raised to $242
              million, following a $12 million seed round in 2024 and a $30 million Series A round in March 2025. Smash
              Capital partners Kevin Mayer and Paul Szurek highlighted ACS's rapid transition from initial product
              prototyping to frontline field deployment as key rationale for the investment. Nevertheless, the $2.2
              billion valuation multiple represents a premium capitalization ahead of audited commercial revenue
              disclosures, and specific equity rights, voting control, liquidation preferences, and debt arrangements
              remain unverified outside non-disclosure agreements.
