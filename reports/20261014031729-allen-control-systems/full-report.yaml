      - number: '1.4'
        title: Operational Milestones, Military Adoption, and Production Scale
        blocks:
          - type: paragraph
            body: >-
              Between its 2024 founding and late 2026, Allen Control Systems achieved multiple operational milestones
              across testing, military procurement, and physical manufacturing expansion. In early 2026, Bullfrog
              participated in the Pentagon's Technology Readiness Experiment 2026 (T-REX 26-1), where the company
              claimed a 100 percent success rate against target drones, although independent defense analysts noted that
              specific engagement conditions and operational parameters were not disclosed. Following the outbreak of
              conflict in Iran, the U.S. Army procured 12 Bullfrog turrets for rapid operational deployment,
              complementing active testing with the U.S. Navy and Joint Interagency Task Force 401. In July 2026, the
              U.S. Marine Corps awarded ACS a prototype Other Transaction Agreement (OTA) under the Ground Based Air
              Defense (GBAD) program to integrate Bullfrog onto the Light Marine Air Defense Integrated System
              (L-MADIS). To fulfill commitments for 80 turrets in 2026, ACS expanded its Austin headquarters to 57,000
              square feet and committed to a new 191,000-square-foot production plant.
