      - number: '5.3'
        title: Vehicle Integration Programs and Operational Testing
        blocks:
          - type: paragraph
            body: >-
              ACS is pursuing multi-domain vehicle integration across U.S. and allied armed forces to validate Bullfrog
              on mobile tactical platforms. Under a $1.5 million contract with the U.S. Army Applications Laboratory,
              which includes potential options up to $4.5 million, ACS is developing an integration readiness plan
              across five widely deployed Army combat vehicle platforms in collaboration with the Ground Vehicle Systems
              Center and the 1st Cavalry Division. In July 2026, the U.S. Marine Corps selected Bullfrog for integration
              into the Light Marine Air Defense Integrated System under the Ground Based Air Defense program through a
              prototype Other Transaction Agreement. Beyond ground combat vehicles, ACS partnered with Red Cat Holdings
              in March 2026 to integrate Bullfrog onto maritime Uncrewed Surface Vessels operated by Blue Ops, extending
              autonomous counter-UAS protection to naval edge operations. Operational utility was demonstrated during
              the Department of War Technology Readiness Experiment 2026, where Bullfrog achieved a 100 percent kill
              rate across all engaged targets, validating kinetic precision before early operational procurement by the
              Army and Navy.
            claimRefs:
              - CE007
