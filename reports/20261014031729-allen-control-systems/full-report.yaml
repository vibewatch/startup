      - number: '7.2'
        title: Operational Scaling, Supply Chain Dependencies, and Hardware Reliability
        blocks:
          - type: paragraph
            body: >-
              Transitioning from low-rate initial demonstration units to high-volume manufacturing represents Allen
              Control Systems' most acute near-term operational challenge. To satisfy accelerating military demand
              across U.S. and allied armed forces, ACS is expanding its manufacturing footprint by adding a
              191,000-square-foot production facility in Austin, Texas, alongside an engineering office in Mountain
              View, California. Scaling industrial throughput requires robust inventory management, precise kitting
              protocols, and dependable vendor deliveries of commercial-off-the-shelf and government-furnished
              components. Although Bullfrog's software architecture utilizes standard service-common machine guns such
              as the M240 and M2 to bypass specialized munition supply bottlenecks, physical turret hardware remains
              vulnerable to component shortages, electromechanical wear, and barrel overheating under sustained firing
              cadences. Moreover, the system's operational envelope is fundamentally bounded: Bullfrog is engineered
              specifically to defeat Group 1 through Group 3 unmanned aerial systems and provides no kinetic intercept
              capability against incoming cruise missiles, tactical ballistic missiles, or hypersonic weapons.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
