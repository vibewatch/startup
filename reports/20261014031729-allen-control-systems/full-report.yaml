chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Mission, and Product Model
        blocks:
          - type: paragraph
            body: >-
              Allen Control Systems (ACS) was established in 2024 to tackle the acute tactical and economic imbalance
              created by weaponized unmanned aerial systems (UAS). Operating from corporate headquarters in Austin,
              Texas, alongside engineering offices in Alexandria, Virginia, and Huntsville, Alabama, the company
              develops autonomous weapon stations capable of precision kinetic engagement. Its flagship system,
              Bullfrog, fuses computer vision, artificial intelligence algorithms, and high-speed robotic actuation to
              convert standard military machine guns, such as the 7.62 mm M240, into autonomous counter-drone turrets
              capable of defeating Group 1 through Group 3 unmanned systems. Rather than relying on expensive
              surface-to-air missiles that cost hundreds of thousands of dollars per engagement, ACS focuses on kinetic
              defeat utilizing standard inventory ammunition, reducing per-engagement costs to nominal ammunition
              expenditure. While the company's technical demonstrations have attracted significant military interest,
              commercial revenue, unit margins, and operational cash burn remain undisclosed private metrics.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
