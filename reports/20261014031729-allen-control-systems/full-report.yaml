        title: Exhibits
        blocks:
          - type: callout
            title: Cost Asymmetry Inversion via Machine-Vision Kinetic Defeat
            body: >-
              By retrofitting ubiquitous standard-issue machine guns with autonomous computer vision fire control,
              Bullfrog delivers a sub-$10 per engagement cost curve against Group 1-3 drones, directly solving the
              magazine depth crisis facing conventional missile defense.
            calloutType: strength
