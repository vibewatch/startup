    title: "Disrupting the Counter-UAS Cost Curve"
    body: "Allen Control Systems' key customer value proposition is economic asymmetry: by pairing computer vision with standard machine guns firing 50-cent ammunition, Bullfrog offers military operators an engagement cost estimated under $10 per drone defeat compared to hundred-thousand-dollar interceptor missiles."
    claimRefs:
      - "CU005"
      - "CU007"
  - calloutType: "risk"
    title: "Concentration in Early-Stage DoD Evaluation OTAs"
    body: "Despite reported contract totals exceeding $120 million, ACS remains heavily reliant on prototype Other Transaction Agreements and urgent-need purchases (such as 12 turrets for the U.S. Army), leaving conversion to multi-year Programs of Record as an unproven adoption hurdle."
    claimRefs:
      - "CU004"
      - "CU009"
      - "CU014"
