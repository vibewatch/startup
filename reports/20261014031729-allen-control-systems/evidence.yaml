  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited financial statements detailing ARR, gross margins, cash burn rate, and capital runway.
    whyItMatters: >-
      Without financial disclosures, ACS's $2.2B valuation cannot be evaluated against standard software or hardware
      revenue multiples.
    diligencePath: Request confidential management financial package under NDA or review board-approved budget models.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance-and-board
    missingEvidence: Formal board of directors composition and specific committee assignments following the Series B round.
    whyItMatters: >-
      Board governance structures and investor voting control determine executive oversight and secondary share
      transaction rights.
    diligencePath: Review state corporate registry filings in Delaware/Texas and investor rights agreements.
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: testing-parameters
    missingEvidence: >-
      Specific evaluation parameters, engagement distances, weather conditions, and target profiles from the T-REX 26-1
      test.
    whyItMatters: >-
      Independent defense reporting noted that the parameters behind the reported 100 percent success rate remain
      undisclosed.
    diligencePath: Submit Freedom of Information Act (FOIA) request or request unclassified test summaries from JIATF 401.
