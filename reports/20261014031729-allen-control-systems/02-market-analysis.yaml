callouts:
  - calloutType: "insight"
    title: "Economic Asymmetry Inverts Air Defense Logic"
    body: "The core driver of military demand for ACS's Bullfrog is not merely robotic automation, but the unsustainable cost asymmetry of firing million-dollar missile interceptors against mass-produced drones costing hundreds of dollars. By using service-common ammunition rounds costing under a dollar to defeat incoming threats, Bullfrog provides a magazine depth and cost-per-kill ratio that conventional guided interceptors cannot match."
    claimRefs:
      - "CM003"
      - "CM005"
      - "CM006"
  - calloutType: "risk"
    title: "Scaling Production and Transitioning Beyond Prototype OTAs"
    body: "While ACS has secured an impressive footprint across the Army, Marine Corps, and allied militaries with 80 committed turrets, the company faces two significant market hurdles: scaling a 191,000-square-foot manufacturing plant to military quality standards, and transitioning early prototype Other Transaction Agreements into recurring, multi-year Programs of Record amidst rising competition."
    claimRefs:
      - "CM007"
      - "CM008"
      - "CM012"
      - "CM014"
