callouts:
  - calloutType: risk
    title: Valuation Asymmetry and Program of Record Transition Risk
    body: Allen Control Systems' $2.2 billion post-money valuation prices in immediate category dominance and rapid industrial throughput. However, the company currently operates primarily through Other Transaction Agreements and task forces like JIATF-401 rather than established defense Programs of Record. Until Bullfrog secures dedicated line-item appropriations in future defense budget cycles, revenue remains vulnerable to procurement cycle delays and continuing resolutions.
    claimRefs:
      - CV001
      - CV004
      - CV013
  - calloutType: recommendation
    title: "Investment Stance: Track Recommendation with Concrete Kill Criteria"
    body: We recommend a track stance for prospective growth equity investors. Direct investment at the $2.2 billion headline valuation offers an unfavorable risk-reward profile without disclosed production gross margins and backlog data. An upgrade to buy would require confirmation of a formal DoD Program of Record transition, unit production costs yielding >30% gross margins at volume, and verified follow-on contract conversions exceeding $200 million.
    claimRefs:
      - CV003
      - CV010
      - CV014
