- calloutType: risk
  title: Unverified Per-Engagement Economics and Capital Intensity
  body: While ACS markets Bullfrog as an economical $10-per-engagement solution leveraging 50-cent ammunition, this metric represents an unverified company claim rather than an independently audited operational cost. In addition, aggressive operational expansion into a 191,000-square-foot Austin factory alongside 95% headcount growth substantially raises fixed overhead, creating high cash burn before long-cycle military production contracts convert into steady cash collections.
  claimRefs:
  - CI004
  - CI011
  - CI012
  - CI014
- calloutType: insight
  title: Valuation Multiple Ahead of Disclosed Commercial Realities
  body: ACS's $2.2 billion Series B post-money valuation prices the startup at a significant premium ahead of disclosed recurring revenue. While 12 turrets deployed with the U.S. Army and a Marine Corps OTA prototype agreement demonstrate initial customer interest, long Department of War procurement horizons mean commercial viability hinges on successfully transitioning prototype agreements into durable, recurring production programs.
  claimRefs:
  - CI001
  - CI006
  - CI008
  - CI013
