- id: TE002
  title: Workflow and Use-Case Table
  columns:
  - User Job
  - Legacy Workflow
  - Fresha Solution
  - Measurable Benefit
  - Platform Limitation
  rows:
  - - Appointment Booking & Rescheduling
    - Phone calls, paper appointment books, disconnected web forms
    - Real-time online booking via web widget, social links, and consumer mobile marketplace
    - 24/7 self-service booking availability and reduced front-desk administrative overhead
    - Customer lock-in to Fresha discovery ecosystem rather than merchant-owned app
  - - No-Show & Cancellation Mitigation
    - Unenforced cancellation policies, manual reminder calls
    - Automated SMS/email reminders with mandatory upfront card deposits or prepayment
    - Company-reported reduction in no-shows and late cancellations of up to 89%
    - Potential friction for walk-in or phone-booking clientele resisting card pre-authorization
  - - Multi-Location Staff & Inventory Management
    - Fragmented point-of-sale software and standalone inventory spreadsheets
    - Centralized multi-venue management portal with shared catalog and unified reporting
    - Single-pane visibility across regional salon chains (e.g. Menspire, Ted's Grooming Room)
    - Absence of public API endpoints for bespoke enterprise ERP synchronization
  - - Marketing & Client Re-engagement
    - Manual discount text blasts and generic email newsletters
    - Trigger-based automated marketing workflows and AI-driven client retention campaigns
    - Targeted promotions to lapsed clients with claimed 9x return on marketing spend
    - Delivery costs and regulatory compliance constraints around commercial SMS messaging
  notes: Operational workflows and efficiency metrics based on Fresha merchant product documentation, enterprise case studies,
    and company marketing disclosures.
