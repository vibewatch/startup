- id: TE003
  title: Technology and Operating Architecture Table
  columns:
  - Layer / Component
  - Role & Technology
  - Dependency & Provider
  - Technical Risk & Diligence Focus
  rows:
  - - Consumer & Merchant Web/Mobile Clients
    - Native iOS and Android apps, responsive merchant web portal, embeddable booking widgets
    - Apple App Store, Google Play Store, CDN edge caching
    - App store policy compliance, mobile release cadence, and cross-platform UI latency
  - - Booking Core & Calendar State Management
    - Distributed database and real-time scheduling engine handling 35M+ monthly appointments
    - Cloud hosting infrastructure (AWS/GCP), managed relational and caching layers
    - Database locking and concurrency during peak morning booking windows across time zones
  - - Payment Processing & Hardware POS
    - Embedded payment gateway, card-present terminals, tokenized card vaulting
    - Stripe/Adyen payment acquiring partners, terminal hardware manufacturers
    - Payment processor downtime, PCI DSS compliance scope, and hardware terminal firmware supply chain
  - - AI Orchestration & Marketing Engine
    - Machine learning ranking algorithms, automated communication triggers, generative messaging
    - Third-party LLM providers (Google Gemini), SMS gateway providers
    - Model drift, hallucinated service pricing or availability, and third-party API rate limits
  notes: Architecture components, operational roles, and platform dependencies derived from official product disclosures,
    technical reports, and public partner announcements.
