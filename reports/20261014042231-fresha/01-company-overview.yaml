chapter:
  number: 1
  title: Company Overview
  summary: Founded in 2015, London-headquartered Fresha operates an integrated beauty and wellness commerce platform combining SaaS business management, embedded payments, and a consumer discovery marketplace. In May 2026, Fresha secured an $80 million growth investment from KKR at an estimated $1 billion valuation, lifting total capital raised to $285 million while supporting over 130,000 partner venues and processing $15 billion in annual gross merchandise volume.
sections:
- id: corporate-identity-and-leadership
  title: Corporate Identity, Operating Model, and Governance
  tableRefs:
  - TO002
  figureRefs: []
  claimRefs:
  - CO001
  - CO002
  - CO006
  - CO007
  - CO011
  body: Fresha is a London-headquartered technology company that has built a vertically integrated commerce and workflow platform for the beauty and wellness industry. Founded in 2015 by William Zeqiri and Nick Miller, the company emerged to replace outdated, fragmented salon management software with an intuitive, cloud-native platform. Over the past decade, Fresha expanded from its initial UK base into a multinational organization maintaining corporate hubs across London, New York, Paris, Amsterdam, Warsaw, Sydney, Singapore, and Dubai. The core product combines salon scheduling, client record management, inventory, and automated marketing with embedded point-of-sale payments and a consumer-facing discovery marketplace. William Zeqiri leads the business as Chief Executive Officer, driving overarching strategy, international growth, and capital allocation, while co-founder Nicholas Miller directs product architecture as Chief Product Officer. Commercial strategy and enterprise relationships
    are overseen by Chief Commercial Officer James Hayward-Browne. While the founders retain significant executive oversight, governance details regarding board representation and minority veto rights following recent institutional investments remain confidential.
- id: capital-structure-and-valuation
  title: Financing History, Capital Structure, and Unicorn Valuation
  tableRefs:
  - TO003
  figureRefs: []
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO014
  - CO015
  body: Fresha has financed its rapid international expansion through a sequence of high-profile growth equity rounds. In earlier financing milestones, the business secured capital from General Atlantic and strategic backer Huda Kattan, achieving a valuation benchmark of $640 million in late 2021. In May 2026, Fresha solidified its market-leading position by closing an $80 million primary growth funding round led by KKR Next Generation Technology Growth fund. This round valued Fresha at more than $1 billion, officially inducting the business into the European unicorn cohort and elevating its cumulative lifetime funding to $285 million. KKR extensive pre-investment diligence spanned surveys across more than 1,000 service businesses, validating Fresha high software satisfaction and marketplace liquidity. However, this unicorn valuation lands against an adverse backdrop across public SaaS markets in 2026, where cloud multiples have compressed significantly and public software peers faced substantial
    de-ratings. Furthermore, Fresha has not disclosed an intended initial public offering timetable, leaving liquidity expectations tethered to private market execution.
- id: operational-scale-and-market-traction
  title: Operational Scale, Revenue Traction, and Enterprise Momentum
  tableRefs:
  - TO001
  figureRefs: []
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO013
  body: Fresha operational metrics reflect massive category scale across fragmented service sectors including hair, beauty, nails, aesthetics, and wellness spas. The platform supports an active network of over 130,000 merchant businesses and approximately 500,000 beauty professionals worldwide. In terms of transaction throughput, Fresha processes over 35 million appointments monthly, translating into more than $15 billion in annual gross merchandise volume. Financially, the company disclosed an annual revenue run-rate exceeding $140 million alongside a year-over-year revenue growth rate surpassing 60%, while maintaining operational profitability. Growth momentum is increasingly propelled by multi-location enterprise accounts and franchise chains, such as Ted Grooming Room, Gould Barbers, and Masaj Studios, which rely on Fresha centralized multi-site reporting, automated payout routing, and unified point-of-sale processing to consolidate previously disparate software stacks.
- id: strategic-milestones-and-diligence-outlook
  title: Strategic Milestones and Investment Diligence Outlook
  tableRefs: []
  figureRefs:
  - FO001
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO010
  - CO012
  - CO014
  - CO015
  body: Since its 2015 inception, Fresha has systematically progressed from an appointment scheduling utility into a comprehensive commercial operating system and marketplace engine. Key historical milestones include its initial international rollout in 2018, its 2021 General Atlantic growth financing round, its 2023 placement on the a16z Top 100 Global Marketplaces roster at rank 59, and its 2026 enterprise expansion. Recent product innovation has accelerated with the April 2026 rollout of searchable Professional Profiles, enabling consumers to discover and book individual stylists rather than just venues. While Fresha operational trajectory and $1B valuation highlight strong execution, private diligence must scrutinize unaudited gross margins, payment processing take-rate sustainability, and governance dynamics to determine whether current growth adequately insulates the business from broader software multiple compression.
