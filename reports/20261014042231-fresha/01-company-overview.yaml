callouts:
- calloutType: strength
  title: Full-Stack Operating Layer with Embedded Payments Moat
  body: Unlike traditional appointment scheduling tools that rely solely on software subscription fees, Fresha integrates merchant scheduling, consumer marketplace discovery, and embedded point-of-sale payments into a unified operating layer. Processing over $15 billion in annual GMV across 130,000 businesses generates high payment transaction monetization while insulating the company from pure seat-based SaaS churn.
  claimRefs:
  - CO010
  - CO011
  - CO013
- calloutType: risk
  title: Private Disclosure Opacity and SaaS Valuation De-Rating Context
  body: Although Fresha reports $140M+ in annual revenue run-rate and profitability, public disclosures omit audited GAAP financial statements, gross margin splits between SaaS and payment processing, and senior liquidation preferences attached to KKR $80M investment. Furthermore, European tech analysis emphasizes that 2026 SaaS multiple compression poses valuation friction should growth decelerate before an eventual exit.
  claimRefs:
  - CO004
  - CO008
  - CO015
