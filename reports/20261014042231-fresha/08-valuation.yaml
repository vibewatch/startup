chapter:
  number: 8
  title: Valuation
  summary: Fresha commands an implied valuation of over $1.0 billion following an $80 million primary growth round from KKR, reflecting strong top-line scale with over $140 million in revenue run-rate and reported profitability. However, broader public vertical SaaS multiple contraction, ongoing private transparency gaps around segment gross margins, and expanding competition from medspa-focused platforms warrant a disciplined 'track' stance rather than a fresh buy.
sections:
  - id: investment-thesis-and-recommendation
    title: Investment Thesis and Recommendation
    body: Fresha presents an impressive combination of operational scale and transactional volume, managing over 35 million appointments monthly across 130,000 businesses globally. The company commands an annual gross merchandise volume exceeding $15 billion and reports annual run-rate revenue surpassing $140 million alongside operational profitability. This market footprint reflects strong network effects across beauty, spa, and wellness merchants who rely on the platform as their central operating layer. However, from an investment underwriting standpoint, Fresha is assigned a recommendation of track, with medium confidence, high risk rating, and a valuation stance of stretched. The primary growth investment from KKR at an equity valuation exceeding $1.0 billion prices the business at roughly 7.1x run-rate revenue. In an environment where public vertical software peers trade between 4.5x and 5.5x revenue, this valuation provides limited margin of safety. While Fresha's marketplace and payments monetization is compelling, the absence of publicly audited segment financials and increasing competition in high-value medspa verticals warrant disciplined observation before initiating new equity exposure.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
    tableRefs:
      - TV001
  - id: current-financing-and-valuation-context
    title: Current Financing and Valuation Context
    body: In May 2026, Fresha secured an $80 million primary growth investment from funds managed by KKR Next Generation Technology Growth fund, elevating the London-headquartered business to unicorn status at a post-money valuation of more than $1.0 billion. This transaction brought cumulative lifetime equity financing to approximately $285 million since co-founders William Zeqiri and Nick Miller established the company in 2015. Prior to this round, Fresha's last public valuation benchmark was $640 million, recorded during a Series C extension in late 2021. The KKR growth equity infusion reflects institutional validation following extensive proprietary due diligence spanning over 1,000 beauty and wellness businesses. Nevertheless, entering at a $1.0 billion valuation requires rigorous examination of cap-table preference overhang and underlying unit economics. While company-reported revenue run-rate stands at more than $140 million with over 60% annualized growth, public disclosures do not disaggregate software subscription revenue from payments processing interchange. Consequently, investors must treat headline top-line figures with caution, distinguishing between gross payments volume and net retained transaction margin.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV007
    tableRefs:
      - TV002
  - id: comparable-benchmarks-and-category-headwinds
    title: Comparable Benchmarks and Category Headwinds
    body: Benchmarking Fresha against comparable vertical software and commerce platforms highlights both structural advantages and valuation friction. Precedents in vertical operations—such as Toast in restaurants, Mindbody in fitness and wellness, and Shopify in retail commerce—demonstrate that combining core scheduling workflows with payment monetization unlocks substantial customer lifetime value. Fresha's ranking at number 59 on the Andreessen Horowitz Top 100 Global Marketplaces index further substantiates its consumer traction. However, the macro software landscape in 2026 presents notable headwinds. Broader software multiples have experienced meaningful contraction, exemplified by Salesforce declining approximately 30% year-to-date as markets reassess traditional seat-based and software pricing models. Furthermore, specialized competitors are aggressively targeting lucrative self-care sub-sectors. Boulevard secured $80 million to expand its dominant footprint across approximately 15% of United States medical spas, while Vagaro introduced integrated aesthetic electronic prescribing and Zenoti expanded fitness workflows. These focused competitors threaten Fresha's ability to capture high-average-order-value aesthetic accounts, potentially capping long-term payments take-rate expansion.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
    tableRefs:
      - TV003
  - id: bull-base-bear-scenario-analysis
    title: Bull, Base, and Bear Scenario Analysis
    body: Evaluating Fresha under three discrete operating scenarios illuminates the return distribution and downside vulnerabilities associated with the current $1.0 billion valuation. In the Bull Case (25% probability), Fresha sustains 60%+ revenue growth into 2027, scaling revenue to $225 million as multi-location enterprise adoption accelerates across North America and continental Europe. Under this scenario, net payments take-rates remain resilient and expanded AI scheduling tools drive higher booking conversion, justifying a valuation expansion to $1.6 billion to $1.8 billion (7.0x to 8.0x NTM revenue). In the Base Case (55% probability), revenue growth moderates to 35-45%, achieving $190 million run-rate while GMV expands steadily to $18 billion. With public vertical SaaS multiples stabilizing around 5.0x to 5.5x revenue, Fresha's valuation holds near $950 million to $1.05 billion, delivering roughly flat returns for new entrants. In the Bear Case (20% probability), top-line growth decelerates below 20% to $165 million as merchant churn increases in response to transaction fee fatigue, while medspa competitors erode premium appointment volume. Applying a compressed 3.0x to 3.6x revenue multiple lowers implied equity value to $500 million to $600 million, exposing unhedged common equity to severe multiple drawdown.
    claimRefs:
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
    figureRefs:
      - FV001
  - id: exit-readiness-and-diligence-path
    title: Exit Readiness and Diligence Path
    body: 'Fresha has not announced an active IPO timeline or public filing readiness roadmap, suggesting that management and lead investors are prioritizing private international scale over public listing liquidity in the near term. Given market volatility in tech listings, a secondary recapitalization or majority sponsor buyout represents the most viable intermediate liquidity mechanism. Before upgrading conviction from track to buy, prospective investors should execute three critical diligence inquiries: first, obtain audited financial statements detailing net payments take-rates versus subscription software margins; second, examine merchant cohort retention tables across mature and recently onboarded multi-location accounts following recent pricing revisions; and third, inspect full cap-table waterfall mechanics, including KKR''s liquidation preference seniority and anti-dilution protections. A formal thesis-break trigger would occur if annualized top-line revenue growth drops below 30% or if merchant churn among multi-location accounts exceeds 10% annually, which would dismantle the underlying operating leverage narrative.'
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV014
      - CV015
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation
        - track
        - Profitable operations and $140M+ revenue run-rate balanced by limited private financial auditability
        - Maintain active monitoring across enterprise adoption and margin metrics before committing capital
      - - Confidence
        - medium
        - Verified primary funding records from KKR and company press releases without public audited filings
        - Require audited revenue breakdown and customer retention cohorts for higher conviction
      - - Risk Rating
        - high
        - Vertical SaaS multiple compression, intense medspa competition, and unverified merchant churn post-pricing change
        - Cap valuation entry multiple and apply senior preference protections in any secondary transaction
      - - Valuation Stance
        - stretched
        - Implied revenue multiple of ~7.1x run-rate exceeds median public vertical SaaS trading range of 4.5x-5.5x
        - Wait for entry discount, primary down-round reset, or audited margin confirmation before new buy
    notes: Evaluated as of 2026-10 based on disclosed $80M KKR round, reported $140M run-rate revenue, and public vertical SaaS market benchmarks.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change View
    rows:
      - - Bull Thesis
        - Dominant marketplace scale with embedded payments and 130K+ merchants creates powerful network effects and operating leverage
        - Facilitates 35M+ monthly appointments, >$15B annual GMV, and claims operational profitability
        - Slowing merchant acquisition, net payments volume stagnation, or merchant payment disintermediation
      - - Bull Thesis
        - Enterprise multi-location adoption expands high-value GMV throughput across regional and national self-care chains
        - Enterprise adoption across brands including Ted's Grooming Room, Gould Barbers, and MASAJ Studios
        - Rising churn among multi-location accounts or enterprise resistance to bundled payment processing
      - - Anti-Thesis
        - Valuation multiple is vulnerable to macroeconomic SaaS multiple compression and shifting software pricing paradigms
        - The Next Web notes deal lands amid SaaS valuation scrutiny with Salesforce down ~30% year-to-date
        - Broad software multiple re-rating or acceleration of organic revenue growth above 80% YoY
      - - Anti-Thesis
        - Specialized competitors like Boulevard and Zenoti aggressively contest high-margin aesthetics and medspa verticals
        - Fitt Insider reports Boulevard raised $80M while powering ~15% of US medspas; Vagaro added e-prescribing
        - Fresha establishing clear clinical/aesthetic workflow moat or acquiring a specialized medspa software provider
    notes: Synthesizes primary growth evidence from KKR partnership against public SaaS multiple contraction and vertical medspa competitive pressures.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & GMV Assumptions
      - Valuation Range ($M)
      - Implied Multiple
      - Probability & Downside Triggers
    rows:
      - - Bull Case
        - Revenue expands to $225M+ (60%+ YoY), GMV exceeds $22B, payments take-rate stable, international enterprise surge
        - $1,600M - $1,800M
        - 7.0x - 8.0x NTM Revenue
        - 25% probability; triggered by US market share leadership and accelerating multi-location enterprise conversion
      - - Base Case
        - Revenue grows 35-45% to $190M, GMV reaches $18B, modest payment take-rate compression, steady profitability
        - $950M - $1,050M
        - 5.0x - 5.5x NTM Revenue
        - 55% probability; triggered by continued core UK/ANZ dominance and steady international expansion
      - - Bear Case
        - Revenue growth decelerates to <20% ($165M), payments churn rises, medspa rivals capture high-AOV bookings
        - $500M - $600M
        - 3.0x - 3.6x NTM Revenue
        - 20% probability; triggered by merchant pushback against fee increases, processor outages, or macro consumer spending drop
    notes: Scenario multiples benchmarked against vertical SaaS peers; assumes enterprise mix and payments take-rate remain stable across 2026-2027.
    claimRefs:
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
