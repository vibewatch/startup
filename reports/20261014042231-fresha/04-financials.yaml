    title: Revenue model bridge
    type: flow
    summary: Visualizing the operational sequence through which merchant scheduling activity and consumer discovery convert into platform revenue streams and operating profit.
    data:
      nodes:
        - id: consumer-intake
          label: Consumer Discovery & Booking
          detail: Appointments initiated via Fresha marketplace, direct salon links, or Google Gemini AI search
          tone: neutral
        - id: merchant-workflow
          label: Merchant Workflow Execution
          detail: Core calendar management, employee scheduling, and consultation records across 130k+ businesses
          tone: neutral
        - id: transaction-checkout
          label: In-Store & Online Checkout
          detail: Point-of-sale terminal and online payment execution processing over $15B in annual gross merchandise value
          tone: neutral
        - id: monetization-capture
          label: Multi-Stream Fee Monetization
          detail: Simultaneous capture of per-seat SaaS (£9.95/staff), payment spread (1.19%+20p), 20% marketplace fee, and SMS
          tone: positive
        - id: platform-gross-revenue
          label: Top-Line Revenue Generation
          detail: Consolidated platform take-rate yielding over $140M in annual revenue run-rate growing at >60% YoY
          tone: positive
        - id: service-delivery-cost
          label: Cost of Service Delivery
          detail: Interchange pass-through, card acquiring fees, SMS carrier termination rates, and cloud infrastructure
          tone: risk
        - id: net-operating-margin
          label: Operating Profitability
          detail: Positive self-reported operating cash generation affirmed during KKR growth equity diligence
          tone: positive
      edges:
        - from: consumer-intake
          to: merchant-workflow
          label: Appointment Booking Request
          relationship: initiates
        - from: merchant-workflow
          to: transaction-checkout
          label: Service Completion
          relationship: triggers
        - from: transaction-checkout
          to: monetization-capture
          label: Gross Transaction Volume
          relationship: monetizes
        - from: monetization-capture
          to: platform-gross-revenue
          label: Take Rate Conversion
          relationship: aggregates
        - from: platform-gross-revenue
          to: service-delivery-cost
          label: COGS Deduction
          relationship: incurs
        - from: service-delivery-cost
          to: net-operating-margin
          label: Residual Net Margin
          relationship: yields
    approximationNotes: Edge conversions represent structural revenue flow rather than audited financial accounting reconciliations. Cost allocations reflect industry standard payment and SMS cost drivers.
