company:
  name: Fresha
chapter:
  number: 4
  title: Financials
  summary: Fresha operates a multi-stream monetization model across merchant SaaS subscriptions, integrated payment processing, marketplace commissions, and messaging fees, generating more than $140M in annual revenue run-rate across $15B+ in annual GMV. While the company claims operating profitability supported by an $80M KKR growth investment at a $1B+ valuation, lack of audited gross margin disclosures and the recent end of its free-forever tier create material fee-stacking and merchant retention questions for diligence.
sections:
  - id: revenue-architecture-and-model
    title: Revenue Architecture and Multi-Stream Monetization
    body: 'Fresha has engineered a hybrid monetization architecture that departs fundamentally from conventional vertical SaaS models. For nearly a decade following its 2015 founding, the company championed a free-forever software narrative, driving rapid merchant onboarding across beauty, wellness, and selfcare verticals before activating comprehensive monetization. As of 2026, the company operates four interconnected revenue streams: merchant software subscriptions, integrated card payment processing, one-off consumer marketplace commissions, and metered messaging add-ons. By embedding financial services directly into merchant booking operations, Fresha monetizes both operational software usage and underlying commercial transaction flow. This structural shift allows Fresha to generate revenue on multiple operational events per merchant, compounding software fees with variable payment processing and customer acquisition commissions.'
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI012
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-structure-and-merchant-economics
    title: Pricing Structure and Merchant Unit Economics
    body: Fresha's commercial pricing transition culminated in July 2026 with the formal cessation of its unmetered free tier, introducing mandatory subscription plans across all participating merchants. In the UK market, the platform prices single-operator businesses at approximately £14.95 per month under its Independent tier, while multi-staff businesses incur roughly £9.95 per bookable team member per month under its Team tier. Crucially, feature access remains un-gated across tiers, meaning that merchant hiring events directly trigger price escalation. Layered atop software subscriptions, Fresha charges card payment processing starting from 1.19% plus 20p per transaction, alongside a one-off 20% commission on appointments booked by first-time clients acquired through the consumer marketplace. For an illustrative three-chair salon, cumulative platform fees regularly exceed £300 per month, generating fee-stacking friction and raising long-term disintermediation risks for price-sensitive SMB operators.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI011
      - CI013
    tableRefs:
      - TI002
  - id: financial-traction-and-unit-benchmarks
    title: Scale Benchmarks and Reported Financial Traction
    body: Commercial scale indicators reported in conjunction with Fresha's growth financing round demonstrate substantial platform throughput and accelerating commercial adoption. In May 2026, Fresha disclosed an annual revenue run-rate exceeding $140 million, expanding at a year-over-year rate of more than 60%. Platform activity spans more than 130,000 beauty and wellness businesses globally, facilitating upwards of 35 million appointments monthly and exceeding $15 billion in annual gross merchandise value. Furthermore, native booking integrations with Google Gemini and search agents contribute over 1.2 million appointments monthly, accelerating booking conversion. However, because Fresha operates as a private entity, critical underwriting unit economics—specifically gross margin percentage, net payment processing take rates, and cohort net revenue retention (NRR)—remain unverified in public disclosures, posing underwriting ambiguity.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI010
      - CI014
    tableRefs:
      - TI003
  - id: capital-adequacy-and-diligence-verdict
    title: Capital Adequacy, Financing Dependency, and Diligence Verdict
    body: From a balance-sheet perspective, Fresha achieved a notable financing milestone in May 2026 by securing an $80 million primary growth equity investment from KKR's Next Generation Technology Growth fund at a post-money valuation exceeding $1 billion. This transaction lifted cumulative equity capital raised to date to $285 million, providing substantial liquidity to support ongoing international expansion in North America, Europe, and Asia, as well as capital expenditure for AI booking infrastructure. KKR's commitment followed a comprehensive multi-jurisdiction diligence process spanning more than a year. Fresha claims self-sustaining operating profitability, indicating low near-term insolvency risk. Nevertheless, from an investment diligence perspective, underwriting cannot be finalized without full management disclosure of post-paywall cohort retention, gross payment take-rate margins, and processor escrow requirements.
    claimRefs:
      - CI006
      - CI009
      - CI010
      - CI014
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current Value / Status
      - Quality
      - Diligence Ask
    rows:
      - - Merchant Software Subscription
        - Fixed monthly recurring tier based on bookable team headcount (£14.95/mo single, ~£9.95/staff/mo)
        - Per bookable professional / month
        - ~£14.95 individual / ~£9.95 per team member UK list price
        - High predictability recurring SaaS; transitioned from free-forever model
        - Audited churn and merchant retention cohorts following the 2025-2026 pricing transition
      - - Integrated Payment Processing
        - Card processing spread on merchant transactions processed through card terminals or online checkouts
        - '% of transaction volume + fixed fee per transaction'
        - List UK rate ~1.19% + 20p; $15B+ total annual GMV facilitated
        - High volume but merchant pass-through dependent; gross margin compressed by interchange and network fees
        - Breakdown of net payment processing margin vs gross volume and blended take rate by geography
      - - Marketplace Client Discovery
        - One-off commission charged on transactions from new clients acquired through Fresha marketplace
        - Percentage commission on first appointment value
        - 20% one-off fee on initial booking transaction value
        - Transactional and volatile; high gross margin per event but non-recurring per individual client
        - Share of total GMV originating from marketplace discovery vs direct salon repeat client links
      - - Metered Messaging & Value-Add Add-ons
        - Usage-based fees for automated appointment reminder SMS, marketing blast texts, and AI booking tools
        - Per-message credit / add-on subscription fee
        - Metered SMS package rates; reported 1 in 4 bookings influenced by AI integrations
        - Variable recurring revenue; high gross margin on AI software, telecom carrier cost pass-through on SMS
        - Unit economics and message delivery gross margin across international carrier networks
    notes: Data synthesized from Fresha UK published terms and Bizzly 2026 pricing analysis. Realized multi-currency blended take rates and net software margins are private and unverified.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI007
      - CI012
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Pricing Component
      - Price / Unit / Contract
      - List vs Realized Pricing
      - Discounts / Unknowns
      - Source
    rows:
      - - Independent Professional Subscription
        - £14.95 / month per single bookable user
        - List price on Fresha UK; realized price unverified across international tiers
        - Currency parity discounts and legacy free-tier grandfathering terms unknown
        - Bizzly Pricing Guide (2026); Fresha official terms
      - - Team Software Subscription
        - ~£9.95 / month per bookable team member
        - List price; multi-location enterprise rates negotiable
        - Enterprise volume discounts and annual contract prepayment concessions undisclosed
        - Bizzly Pricing Guide (2026); Business Wire enterprise report
      - - Marketplace New Client Commission
        - 20% of first appointment value
        - List commission applied to new marketplace users
        - Client re-attribution disputes, cash-payment leakage, and repeat booking bypass rules unknown
        - Bizzly Pricing Guide (2026); Fresha marketplace terms
      - - Payment Processing Fee
        - 'UK list: from ~1.19% + 20p per transaction'
        - List headline rate; card-not-present, international card, and AMEX surcharges vary
        - Blended realized take rate, interchange plus spreads, and volume-tier fee reductions undisclosed
        - Bizzly Pricing Guide (2026)
    notes: Rates reflect published UK pricing as of July 2026. International pricing schedules differ by jurisdiction and currency. Realized enterprise discounting remains private.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI011
      - CI013
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Reported Value
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - Annual Revenue Run-Rate (ARR proxy)
        - '>$140M'
        - medium
        - Establishes top-line commercial scale and valuation multiple baseline
        - Certified trailing-twelve-month audited revenue breakdown by stream and geography
      - - Year-over-Year Revenue Growth
        - '>60% YoY'
        - medium
        - Validates growth momentum against SaaS market contraction
        - Historical quarterly growth decomposition into organic merchant expansion vs price increases
      - - Annual Gross Merchandise Value (GMV)
        - '>$15B'
        - high
        - Measures aggregate platform throughput and payments expansion headroom
        - Total transaction volume segmented by in-person card terminal, online prepayment, and off-platform cash
      - - Monthly Appointment Volume
        - 35M+ appointments
        - high
        - Reflects core consumer engagement frequency and scheduling throughput
        - Breakdown between platform-booked appointments and merchant-entered manual appointments
      - - Gross Margin Percentage
        - null
        - low
        - Determines gross profit available to cover operating overhead and R&D
        - Audited COGS schedule separating payment interchange, SMS telecom costs, and hosting infrastructure
      - - Net Revenue Retention (NRR)
        - null
        - low
        - Critical indicator of merchant expansion and churn resilience following paid pricing launch
        - Cohort-level net expansion and logo retention rates pre- and post-2025 paywall introduction
      - - Merchant Lifetime Value to CAC (LTV/CAC)
        - null
        - low
        - Dictates GTM capital efficiency and payback period for sales and marketing investments
        - Unit acquisition cost across organic marketplace pull vs paid merchant marketing spend
    notes: Reported figures derived from KKR funding disclosures (May 2026). Null cells represent private metrics unreleased in public reporting, requiring management diligence verification.
