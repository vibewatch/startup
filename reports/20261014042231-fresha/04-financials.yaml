callouts:
  - calloutType: risk
    title: Merchant Fee Stacking and Churn Exposure
    body: The simultaneous combination of per-staff subscription fees (£9.95/seat), 20% new-client marketplace commissions, and 1.19% + 20p payment processing elevates total monthly software spend above £300 for small salons, creating disintermediation incentives and potential logo churn among price-sensitive operators.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI013
  - calloutType: insight
    title: Embedded Fintech and AI Discovery Drive Take Rate Expansion
    body: By capturing card processing across $15B in GMV and integrating directly with Google Gemini and LLM discovery for high-intent booking referrals, Fresha expands its revenue capture per merchant beyond traditional vertical SaaS seat limits into transaction-based fintech revenue.
    claimRefs:
      - CI001
      - CI004
      - CI007
      - CI012
