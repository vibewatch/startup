  topStrengths:
    - Large two-sided network spanning 130,000+ venues, 500,000+ professionals, and 35M+ monthly bookings
    - Embedded payments and marketplace discovery diversify monetization beyond basic seat-based SaaS
    - Enterprise adoption and reported profitability signal operating leverage at meaningful scale
  topRisks:
    - Valuation is stretched versus public vertical SaaS peers at roughly 7.1x revenue
    - Private disclosure gaps around gross margin, NRR, and segment mix limit underwriting confidence
    - Payment, compliance, and processor dependencies create operational and regulatory exposure
    - Specialized competitors can pressure high-value medspa and enterprise segments
  unresolvedGaps:
    - Audited revenue split and gross margin detail by subscription, payments, marketplace, and messaging
    - Post-pricing-change retention, churn, and NRR across SMB and enterprise cohorts
    - Full cap-table, liquidation preference, and payment processor reserve / escrow mechanics
    - Customer concentration and enterprise cohort performance by region and segment
