companyProfile:
  summary: >-
    Fresha is a London-based vertical commerce platform for beauty and wellness operators, combining scheduling,
    payments, messaging, and consumer discovery across more than 130,000 partner businesses and roughly 500,000
    professionals in more than 120 countries. The business monetizes through subscriptions, embedded payments, and
    marketplace commissions, and reported profitability alongside a $140M+ revenue run-rate and $15B+ GMV after a May
    2026 $80M KKR growth investment at a valuation above $1B.
