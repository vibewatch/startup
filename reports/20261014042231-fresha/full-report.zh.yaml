        - 垂直 SaaS 倍数压缩、医疗美容竞争激烈，以及调价后商户流失未经验证
        - 限制估值进入倍数，并在任何老股交易中要求高级优先权保护
      - - 估值立场
        - 偏高
        - 隐含收入倍数约为运行率的 ~7.1x，高于公开垂直 SaaS 交易区间中位数 4.5x-5.5x
        - 等待进入折价、一级市场下轮重置或经审计的利润率确认后再新投
    notes: 截至 2026-10 评估，依据是披露的 $80M KKR 轮次、据报 $140M 收入运行率，以及公开垂直 SaaS 市场基准。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: 多头论点 / 反论点表
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 哪些情况会改变判断
    rows:
      - - 多头论点
        - 占据主导的市场规模、嵌入式支付和 130K+ 商户共同带来强大的网络效应与运营杠杆
        - 每月促成 35M+ 次预约、年度 GMV 超过 $15B，并自称实现运营盈利
        - 商户获取放缓、净支付量停滞，或商户绕开支付服务
      - - 多头论点
        - 企业多地点采用推动区域和全国自我护理连锁的高价值 GMV 规模扩大
        - Ted's Grooming Room、Gould Barbers 和 MASAJ Studios 等品牌均采用
        - 多地点账户流失上升，或企业客户抵制捆绑式支付处理
      - - 反论点
        - 估值倍数容易受到宏观 SaaS 倍数压缩和软件定价范式变化的冲击
        - The Next Web 指出，这笔交易发生在 SaaS 估值受到审视之际，Salesforce 年初至今下跌约 ~30%
        - 软件整体倍数重估，或有机收入增速加快至超过 80% YoY
      - - 反论点
        - Boulevard、Zenoti 等专业竞争对手正激烈争夺高利润美容和医疗美容垂直市场
        - Fitt Insider 报道称，Boulevard 融资 $80M，同时为约 ~15% 的美国医疗美容机构提供支持；Vagaro 新增电子处方功能
        - Fresha 建立清晰的临床 / 美容工作流护城河，或收购专业医疗美容软件供应商
    notes: 将 KKR 合作带来的主要增长证据，与公开 SaaS 倍数收缩和垂直医疗美容竞争压力放在一起分析。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 收入与 GMV 假设
      - 估值区间（$M）
      - 隐含倍数
      - 概率与下行触发因素
    rows:
      - - 乐观情景
        - 收入扩大至 $225M+（60%+ YoY），GMV 超过 $22B，支付抽成率稳定，国际企业业务激增
        - $1,600M - $1,800M
        - 7.0x - 8.0x NTM 收入
        - 25% 概率；由美国市场份额领先和多地点企业转化加速触发
      - - 基准情景
        - 收入增长 35-45% 至 $190M，GMV 达到 $18B，支付抽成率小幅压缩，盈利保持稳定
        - $950M - $1,050M
        - 5.0x - 5.5x NTM 收入
        - 55% 概率；由核心英国 / ANZ 市场继续占据主导和国际扩张保持稳定触发
      - - 悲观情景
        - 收入增速放缓至 <20%（$165M），支付业务流失上升，医疗美容竞争对手夺走高客单价预约
        - $500M - $600M
        - 3.0x - 3.6x NTM 收入
        - 20% 概率；由商户反对涨费、处理商中断或宏观消费支出下降触发
    notes: 情景倍数以垂直 SaaS 同业为基准；假设 2026-2027 年企业业务占比和支付抽成率保持稳定。
    claimRefs:
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
