chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营模式与治理
        blocks:
          - type: paragraph
            body: >-
              Fresha 是一家总部位于伦敦的科技公司，为美容与健康行业搭建了垂直整合的商业与工作流平台。公司由 William Zeqiri 和 Nick Miller 于 2015
              年创立，最初希望用直观、云原生的平台替代过时且割裂的沙龙管理软件。过去十年，Fresha
              从英国起步，扩展为跨国组织，在伦敦、纽约、巴黎、阿姆斯特丹、华沙、悉尼、新加坡和迪拜设有企业枢纽。核心产品把沙龙排期、客户记录管理、库存和自动营销，与内置的销售点支付及面向消费者的发现市场结合起来。William
              Zeqiri 担任首席执行官，负责总体战略、国际增长和资本配置；联合创始人 Nicholas Miller 以首席产品官身份负责产品架构。首席商务官 James Hayward-Browne
              负责商业战略和企业客户关系。尽管创始人仍保有重要的管理监督权，近期机构投资后董事会席位和少数股东否决权等治理细节仍属保密。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO006
              - CO007
      - number: '1.2'
        title: 融资历史、资本结构与独角兽估值
        blocks:
          - type: paragraph
            body: >-
              Fresha 通过一系列备受关注的成长股权融资支持快速国际扩张。早期融资阶段，公司获得 General Atlantic 和战略投资人 Huda Kattan 的资本，2021 年末估值达到 $640M。2026
              年 5 月，Fresha 完成由 KKR Next Generation Technology Growth fund 领投的 $80M 首轮成长融资，进一步巩固市场领先地位。本轮融资将 Fresha
              估值推至超过 $1B，正式进入欧洲独角兽行列，累计融资升至 $285M。KKR 投资前的广泛尽调覆盖了对 1,000 多家服务企业的调研，验证了 Fresha
              较高的软件满意度和市场流动性。不过，这一独角兽估值面对的是 2026 年公开 SaaS 市场的不利背景：云软件倍数已显著压缩，上市软件同业也遭遇大幅估值下调。此外，Fresha 尚未披露拟议 IPO
              的时间表，流动性预期仍取决于私募市场退出。
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
              - CO014
      - number: '1.3'
        title: 运营规模、收入增长与企业动能
        blocks:
          - type: paragraph
            body: >-
              Fresha 的运营指标显示，公司已在美发、美容、美甲、美学和健康水疗等碎片化服务领域形成巨大品类规模。平台服务全球超过 13 万家商户和约 50 万名美容专业人士，每月处理超过 3,500 万次预约，对应年度
              GMV 超过 $15B。财务方面，公司披露收入运行率超过 $140M，同比增长超过 60%，并维持运营盈利。增长动能越来越来自多门店企业客户和连锁品牌，例如 Ted Grooming Room、Gould
              Barbers 和 Masaj Studios；这些客户依靠 Fresha 的集中式多门店报表、自动打款路由和统一销售点处理，整合此前彼此割裂的软件栈。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
      - number: '1.4'
        title: 战略里程碑与投资尽调展望
        blocks:
          - type: paragraph
            body: >-
              自 2015 年成立以来，Fresha 已从预约排期工具逐步变成完整的商业操作系统和市场引擎。主要里程碑包括 2018 年首次国际化、2021 年 General Atlantic 成长融资、2023 年以第
              59 名进入 a16z Top 100 Global Marketplaces 榜单，以及 2026 年企业业务扩张。2026 年 4 月推出可搜索的 Professional Profiles
              后，消费者不仅能发现门店，也能发现并预约个人造型师，产品创新进一步加速。Fresha 的运营轨迹和 $1B
              估值说明执行力较强，但私募尽调仍需核查未经审计的毛利率、支付处理费率的可持续性和治理动态，以判断当前增长能否抵御更广泛的软件倍数压缩。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
              - CO012
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
