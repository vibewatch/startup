              - CO014
      - number: '1.5'
        title: 展品
        blocks:
          - type: callout
            title: 内置支付构筑全栈运营层护城河
            body: >-
              不同于只依靠软件订阅费的传统预约工具，Fresha 将商户排期、消费者市场发现和内置销售点支付整合到统一运营层。13 万家商户每年处理超过 $15B GMV，既带来高额支付交易变现，也让公司不再只承受按席位计费的
              SaaS 流失。
            calloutType: strength
            claimRefs:
              - CO010
              - CO011
              - CO013
          - type: callout
            title: 私有披露不透明与 SaaS 估值下调背景
            body: >-
              尽管 Fresha 报告收入运行率超过 $140M 并已盈利，公开披露仍缺少经审计的 GAAP 财务报表、SaaS 与支付处理之间的毛利拆分，以及 KKR $80M
              投资所附的清算优先权。欧洲科技分析还强调，若增长在最终退出前放缓，2026 年 SaaS 倍数压缩将给估值带来阻力。
            calloutType: risk
            claimRefs:
              - CO004
              - CO008
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、服务范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              美容与健康运营软件市场覆盖预约排期、销售点零售处理、客户关系管理和消费者市场发现。过去，沙龙和水疗中心依赖纸质预约簿、电话咨询以及彼此未整合的刷卡终端等线下工具。电话漏接、预约未确认和客户爽约造成的运营割裂，给沙龙老板带来显著收入流失。现代垂直平台把前台预约与后台商户工具接在一起，形成统一的沙龙工作流数字中枢。Fresha
              将可服务边界定义为全球 120
              多个国家的美发店、理发店、美甲工作室、美学诊所和健康水疗中心。边界内的可服务支出包括运营软件订阅、支付处理交易费率和获客佣金，但明确排除实体设备、批发耗材分销和复杂医疗健康记录管理。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与平台变现
        blocks:
          - type: paragraph
            body: >-
              评估垂直预约市场的规模时，必须区分宏观消费者服务支出与实际可由软件或支付费率变现的部分。全球沙龙和个人护理预约的消费者总支出每年超过
              $500B；但软件和预约自动化只是其中聚焦的一小部分，专用沙龙管理系统的规模估计约为 $4.5B。Fresha 主要按交易额的一定比例获取价值，而不是靠固定的软件席位授权。合作商户扩大到超过 14
              万家后，Fresha 每年处理超过 $10B GMV、每月促成超过 3,500 万次预约，折合每年超过 10 亿次预约。这一规模支撑了超过 $140M、同比增长超过 60% 的收入运行率，也支撑公司于 2026
              年 5 月在 KKR 领投下以超过 $1B 估值完成 $80M C 轮融资。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.3'
        title: 买家画像、用户分层与企业采购
        blocks:
          - type: paragraph
            body: >-
              沙龙和健康市场的客户结构分为个人从业者、精品多工位沙龙和多门店企业品牌。个人造型师和独立租椅者优先考虑零前期成本、移动日历便利性及自动短信提醒，以减少客户爽约。相比之下，拥有 2 至 5
              名员工的精品沙龙需要员工排班管理、佣金拆分计算和一体化结账销售点功能。近几年，Fresha 已拓展至 Menspire、Ted's Grooming Room 和 Masaj
              等多门店企业品牌，这些品牌管理数十甚至数百家门店。企业买家需要统一跨门店客户档案、集中零售库存和汇总财务报表的运营基础设施，以替代割裂的旧式点状解决方案。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动因素、技术催化剂与尽调约束
        blocks:
          - type: paragraph
            body: >-
              个人护理排期的采用速度越来越受面向消费者的移动发现渠道和自动化数字助手推动。              消费者需求推动 Fresha 的市场应用月下载量超过 100
              万，在本地都市市场强化双边流动性。公司还披露，1/4 的预约由 Google Gemini 和生成式 AI 代理驱动，据报道为参与商户带来 9 倍市场投资回报。尽管收入增长强劲，市场约束仍然明显：全球竞争者超过
              1,000 家，包括 Booksy、Vagaro 和 Planity 等资本充足的平台。由于单工位业者的切换阻力仍低，商户留存和费用承受度是长期扩张的关键尽调焦点。
            claimRefs:
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: 从纯 SaaS 向交易基础设施转型变现
            body: Fresha 通过嵌入支付和市场发现，区别于传统订阅软件；公司按合作商户的预约量获取与交易规模相称的经济收益，而不是受限于软件席位授权。
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
          - type: callout
            title: 低切换成本 SMB 客群与企业扩张的对照
            body: Ted's Grooming Room 和 Menspire 等多门店品牌证明了 Fresha 的企业牵引力，但平台绝大多数门店仍是小型沙龙和个人业者，切换成本低，对支付处理费率也更敏感。
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图：直接同业、老牌平台与垂直进入者
        blocks:
          - type: paragraph
            body: >-
              全球沙龙与健康运营软件市场涵盖从横向销售点系统、专业垂直预约套件到企业管理平台的多种方案。Fresha 直接与 Booksy、Vagaro 等预约平台竞争，也面对 Mindbody 等老牌平台及 Zenoti
              等企业系统。过去，美容与健康预约主要由割裂的本地软件、基础日历工具或纸质预约簿主导，带来大量行政摩擦和数据孤岛。Mindbody
              等老牌平台早早建立企业优势，但高月费档位和运营复杂度阻碍了独立造型师及成长中的多工位沙龙采用。Fresha 最初靠去掉前期软件门槛、借助消费者市场发现，加快沙龙入驻。

              在北美，Booksy 和 Vagaro 均有重要覆盖：Booksy 依靠移动优先的理发店和沙龙预约，Vagaro 则以订阅软件套餐拓展沙龙、水疗和医疗美容服务。与此同时，Boulevard
              等垂直进入者在医疗水疗等高毛利细分市场获得牵引力，据报道在完成 $80M 融资后已占美国 medspa 市场 15%。随着垂直边界模糊，ClassPass 等相邻健康与聚合平台也扩展到美容预约；Zenoti
              则从高端水疗扩展到健身和多门店加盟。尽管区域和专业垂直市场竞争激烈，Fresha 依靠覆盖 120 个国家的 13 万家企业和 $15B 年交易额，在消费者市场发现和商户交易流动性上形成显著网络效应。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: 能力矩阵与多门店企业牵引力
        blocks:
          - type: paragraph
            body: >-
              对比各家核心功能，可以看到独立 SaaS 排期工具与统一商业平台之间的结构性差异。传统预约管理工具主要是后台行政记录系统，运营者还得自行接入外部支付终端、第三方营销工具和独立库存表格。Fresha
              则把金融科技深度嵌入日常预约流程，包括原生销售点处理、Tap to Pay 和自动拆分打款。这种架构整合消除了第三方支付对账负担，并通过 Fresha Capital 提供按收入发放预付款等内置金融服务。

              KKR 对 5 个地区 1,000 多家美容与健康企业开展的广泛调研，也反映出这一能力优势：Fresha 在软件质量、易用性、客户支持、设置简便性和市场实力上均排名第一，平均得分 8.1/10，高于竞争者平均的
              6.7 分。这种产品满意度加快了 Fresha 在多门店企业客户中替代旧软件的速度。Ted's Grooming Room、Gould Barbers 和 Masaj 等区域及全国连锁已从割裂的点状方案迁移到
              Fresha 的集中式基础设施。在这一多门店细分市场，GMV 年增 32%，平台收入同比增 67%，说明 Fresha 的功能集越来越能满足复杂的多单元运营需求。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP008
      - number: '3.3'
        title: 定价架构、切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              变现模式是竞争和商户切换动态的主要轴线。Mindbody、Vagaro 等传统平台主要依靠可预测的经常性 SaaS 订阅费，通常按门店每月收费 $25 至超过
              $399，取决于功能档位和员工数量。相比之下，Fresha 率先采用低门槛免费增值模式，主要靠支付处理费和 Fresha 市场带来的首次客户预约 20% 佣金变现。2025
              年，公司引入灵活的月度订阅计划，并可选收取支付处理和自动营销工具增值费，形成 SaaS 与金融科技混合变现模式。

              这种混合模式降低了新沙龙的初始采用摩擦，却也带来更复杂的切换动态和商户认知风险。一旦客户联系历史、自动预约链接、支付令牌和员工排班习惯嵌入平台，沙龙切换成本就会很高。因此，同时运行两个竞争性排期日历对大多数沙龙并不可行，因为会有重复预约和客户记录割裂风险。不过，随着
              Fresha 推出订阅定价并扩大交易费率，商户对总软件成本的敏感度可能让公司暴露于统一费率替代方案或老牌平台的激进折扣。Fresha 必须持续用消费者市场获客和 AI 工作流效率证明清晰
              ROI，才能维持竞争差异化。
