  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Core Merchant Workflow
        blocks:
          - type: paragraph
            body: >-
              Fresha defines its core product as an all-in-one vertical business management operating platform
              purpose-built for salons, spas, barbershops, and aesthetics practices. Rather than offering a modular menu
              of decoupled applications, Fresha unifies appointment scheduling, client consultation records, POS
              terminal checkout, inventory management, and automated client notifications within a single cloud-based
              application. At the center of the daily merchant workflow sits the multi-staff calendar, which provides
              drag-and-drop booking management, real-time resource allocation, and automated synchronization across
              desktop browsers and native mobile applications. Merchants configure service menus, pricing tiers,
              commission rules for staff, and product retail catalogs directly within the central portal, creating an
              end-to-end operational operating system for service providers.


              The platform facilitates more than 35 million appointments per month globally, supporting over 130,000
              active partner venues across beauty and wellness verticals. A foundational workflow differentiation is
              Fresha's automated no-show protection mechanism. By embedding payment card capture and mandatory upfront
              deposits into the online booking flow, merchants can enforce customized cancellation policies, with Fresha
              reporting an 89% reduction in client no-shows and last-minute cancellations compared to traditional phone
              and paper booking methods.
            claimRefs:
              - CE001
              - CE004
              - CE007
              - CE015
