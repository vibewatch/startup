      - number: '4.2'
        title: Pricing Structure and Merchant Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Fresha's commercial pricing transition culminated in July 2026 with the formal cessation of its unmetered
              free tier, introducing mandatory subscription plans across all participating merchants. In the UK market,
              the platform prices single-operator businesses at approximately £14.95 per month under its Independent
              tier, while multi-staff businesses incur roughly £9.95 per bookable team member per month under its Team
              tier. Crucially, feature access remains un-gated across tiers, meaning that merchant hiring events
              directly trigger price escalation. Layered atop software subscriptions, Fresha charges card payment
              processing starting from 1.19% plus 20p per transaction, alongside a one-off 20% commission on
              appointments booked by first-time clients acquired through the consumer marketplace. For an illustrative
              three-chair salon, cumulative platform fees regularly exceed £300 per month, generating fee-stacking
              friction and raising long-term disintermediation risks for price-sensitive SMB operators.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI011
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
