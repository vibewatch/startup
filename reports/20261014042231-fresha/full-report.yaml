      - number: '6.3'
        title: Enterprise Adoption and Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              Although Fresha's historical foundation rested on independent beauty salons, enterprise adoption has
              accelerated as regional and national multi-location brands migrate away from fragmented software stacks.
              Verified production customers operating multiple sites include premier grooming and self-care operators
              such as Ted's Grooming Room, Gould Barbers, Masaj Studios, Menspire, Adams Barbers, and The Art of Nails.
              Commercial diligence conducted by private equity sponsor KKR across more than 1,000 beauty and wellness
              operators awarded Fresha a leading satisfaction score of 8.1 out of 10, highlighting ease of setup and
              customer support. Multi-location brands operating two or more locations have generated a 25.6% annual
              increase in gross merchandise volume, driving a 61% year-over-year surge in platform revenue from larger
              accounts. These multi-site deployments demonstrate that Fresha's infrastructure can scale beyond
              single-chair studios into centralized multi-location reporting and complex automated payouts.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
