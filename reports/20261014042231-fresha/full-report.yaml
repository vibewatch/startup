  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Service Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The market for beauty and wellness operating software spans appointment scheduling, point-of-sale retail
              processing, client relationship management, and consumer marketplace discovery. Historically, salon and
              spa operations relied on fragmented offline tools, including paper appointment books, direct phone
              inquiries, and unintegrated card payment terminals. This operational fragmentation generated substantial
              revenue leakage for salon owners through missed calls, unconfirmed bookings, and unattended customer
              appointments. Modern vertical platforms integrate front-of-house booking with back-of-house merchant
              tooling, creating a unified digital hub for salon workflows. Fresha defines its addressable boundary
              across hair styling, barbershops, nail studios, aesthetics clinics, and wellness spas across more than 120
              countries globally. Within this boundary, addressable spend comprises operational software subscriptions,
              payment processing transaction take rates, and customer acquisition commissions, while explicitly
              excluding physical capital fixtures, wholesale consumables distribution, and complex medical health record
              management.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Platform Monetization'
        blocks:
          - type: paragraph
            body: >-
              Evaluating market scale for vertical booking marketplaces requires distinguishing between macro consumer
              service expenditure and actual software or payment monetizable take rates. Aggregate consumer spend across
              global salon and personal care appointments exceeds $500 billion annually. However, software and booking
              automation represent a focused subset of this gross figure, estimated at approximately $4.5 billion for
              dedicated salon management systems. Fresha captures value primarily as a percentage of transaction volume
              rather than through rigid software seat licensing. By scaling its partner network to over 140,000
              businesses, Fresha processes more than $10 billion in annual gross merchandise volume and facilitates over
              35 million appointments monthly, translating to more than 1 billion appointments annually. This scale
              supported an annualized revenue run-rate surpassing $140 million growing at over 60% year-over-year, which
              backed the company's $80 million Series C raise led by KKR at a valuation exceeding $1 billion in May
              2026.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.3'
        title: Buyer Personas, User Segmentation, and Enterprise Procurement
        blocks:
          - type: paragraph
            body: >-
              The salon and wellness market exhibits a bifurcated customer structure spanning solo practitioners,
              boutique multi-chair salons, and enterprise multi-location brands. Solo stylists and independent booth
              renters prioritize zero-overhead adoption, mobile calendar convenience, and automated SMS reminder
              notifications to protect against client no-shows. In contrast, boutique salons with 2 to 5 staff members
              require staff roster management, split commission calculations, and integrated checkout point-of-sale
              functionality. Over recent years, Fresha has expanded into multi-location enterprise brands such as
              Menspire, Ted's Grooming Room, and Masaj, which manage tens or hundreds of locations. Enterprise buyers
              seek consolidated operational infrastructure that unifies cross-location client profiles, centralizes
              retail product inventories, and provides aggregated financial reporting, replacing fragmented legacy point
              solutions.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Technological Catalysts, and Diligence Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption velocity in personal care scheduling is increasingly propelled by consumer-facing mobile
              discovery channels and automated digital assistance. Consumer demand has driven Fresha's marketplace
              application past 1 million monthly downloads, reinforcing two-sided liquidity across local metropolitan
              markets. Furthermore, company disclosures report that 1 in 4 appointments are driven by Google Gemini and
              generative AI agents, delivering a reported 9x marketplace return on investment for participating
              merchants. Despite strong top-line momentum, material market constraints persist. The broader competitive
              landscape remains intensely crowded with more than 1,000 active competitors globally, including
              well-capitalized platforms such as Booksy, Vagaro, and Planity. Because switching friction for
              single-chair operators remains modest, merchant retention and fee tolerance represent critical diligence
              focal points for sustained long-term expansion.
            claimRefs:
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Monetization Transition from Pure SaaS to Transactional Infrastructure
            body: >-
              Fresha's positioning departs from traditional subscription software by embedding payments and marketplace
              discovery, allowing it to capture economics proportional to partner booking volume rather than capped
              software seat licenses.
            calloutType: insight
            claimRefs:
              - CM002
              - CM007
          - type: callout
            title: Concentration in Low-Switching-Cost SMB Segments vs. Enterprise Expansion
            body: >-
              While multi-location brands like Ted's Grooming Room and Menspire demonstrate enterprise traction, the
              vast majority of platform venues remain small salons and solo operators where switching costs are low and
              sensitivity to payment processing take rates is high.
            calloutType: risk
            claimRefs:
              - CM011
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Vertical Entrants'
        blocks:
          - type: paragraph
            body: >-
              The global salon and wellness operating software market comprises a diverse spectrum of solutions ranging
              from horizontal point-of-sale systems to specialized vertical booking suites and enterprise management
              platforms. Fresha competes most directly with appointment platforms like Booksy and Vagaro, alongside
              legacy incumbents such as Mindbody and enterprise-focused systems like Zenoti. Historically, appointment
              scheduling in beauty and wellness was dominated by fragmented on-premise software, basic calendar tools,
              or paper appointment books, creating substantial administrative friction and data silos. While legacy
              platforms like Mindbody established early enterprise dominance, their high monthly subscription tiers and
              operational complexity created an adoption barrier for independent stylists and growing multi-chair
              salons. Fresha's competitive positioning initially emerged from stripping away upfront software barriers
              and leveraging consumer marketplace discovery to accelerate salon onboarding.


              In North America, Booksy and Vagaro maintain significant footprints, with Booksy capitalizing on
              mobile-first barber and salon booking, and Vagaro expanding across salon, spa, and medical aesthetics
              services through subscription-based software packages. Simultaneously, specialized vertical entrants such
              as Boulevard have gained traction in high-margin niches like medical spas, reportedly capturing 15% of the
              US medspa segment following an $80 million funding round. As vertical boundaries blur, adjacent wellness
              and aggregator platforms such as ClassPass have also broadened into beauty scheduling, while incumbent
              platforms like Zenoti have expanded from luxury spas into fitness and multi-location franchises. Despite
              competitive pressure across regional and specialized verticals, Fresha's global scale—spanning 130,000
              businesses across 120 countries and $15 billion in annual transaction volume—establishes substantial
              network effects in consumer marketplace discovery and merchant transaction liquidity.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
      - number: '3.2'
        title: Capability Matrix and Multi-Location Enterprise Traction
        blocks:
          - type: paragraph
            body: >-
              Comparing core functional capabilities across the competitive set highlights a structural divergence
              between standalone SaaS scheduling tools and unified commerce platforms. Traditional appointment
              management tools operate primarily as administrative back-office record-keepers, requiring operators to
              independently integrate external payment terminals, third-party marketing tools, and separate inventory
              management spreadsheets. Fresha differentiates its architecture by deeply embedding financial
              technology—including native point-of-sale processing, Tap to Pay, and automated payout splitting—directly
              into daily booking workflows. This architectural integration eliminates third-party payment reconciliation
              overhead and enables embedded financial offerings such as revenue-based advances through Fresha Capital.


              Independent institutional diligence reflects this capability advantage. An extensive survey conducted by
              KKR across more than 1,000 beauty and wellness businesses in five regions ranked Fresha first in overall
              software quality, ease of use, customer support, setup simplicity, and marketplace strength, earning an
              average score of 8.1 out of 10 against a competitor average of 6.7. This product satisfaction is
              accelerating Fresha's displacement of legacy software in multi-location enterprise accounts. Regional and
              national chains such as Ted's Grooming Room, Gould Barbers, and Masaj have migrated from disjointed point
              solutions to Fresha's centralized infrastructure. In this multi-location segment, gross merchandise value
              has grown by 32% annually and platform revenue has expanded by 67% year-on-year, proving that Fresha's
              feature set increasingly satisfies complex multi-unit operational requirements.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP008
      - number: '3.3'
        title: Pricing Architectures, Switching Costs, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Monetization models represent a primary axis of competition and merchant switching dynamics. Traditional
              incumbents such as Mindbody and Vagaro rely primarily on predictable recurring SaaS subscription fees,
              typically ranging from $25 to over $399 per month per location depending on feature tier and staff count.
              In contrast, Fresha pioneered a low-barrier freemium model that monetized primarily through payment
              processing fees and a 20% commission on first-time client bookings acquired through the Fresha
              marketplace. In 2025, Fresha evolved its commercial structure by introducing flexible monthly subscription
              plans alongside optional add-on charges for payment processing and automated marketing tools, creating a
              hybrid SaaS-fintech monetization model.


              While this hybrid approach lowers initial adoption friction for new salons, it introduces nuanced
              switching dynamics and merchant perception risks. Salon switching costs are structurally high once client
              contact histories, automated booking links, payment processing tokens, and staff scheduling habits are
              embedded within a platform. Consequently, multi-homing—running two competing scheduling calendars
              simultaneously—is operationally unviable for most salon operators due to the risk of double-bookings and
              fragmented client records. However, as Fresha implements subscription pricing and scales transaction fees,
              merchant sensitivity to total effective software costs could create vulnerability to flat-rate
              subscription alternatives or aggressive incumbent discount campaigns. Preserving competitive
              differentiation will require Fresha to continually demonstrate clear ROI through consumer marketplace
              demand generation and AI-driven workflow efficiency.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Displacing Legacy Point Solutions via Embedded Fintech
            body: >-
              Fresha's competitive advantage over legacy scheduling providers stems from treating payments and capital
              not as third-party add-ons, but as core infrastructure. By embedding checkout directly into the booking
              calendar, Fresha monetizes gross transaction volume while eliminating the operational data silos that
              plague salon operators using disconnected merchant terminals.
            calloutType: insight
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: Multi-Homing Constraints and Merchant Sensitivity to Monetization Shift
            body: >-
              Although switching costs protect Fresha once a salon integrates its client list and team schedule, the
              platform's introduction of subscription plans and ongoing transaction take-rate could trigger merchant
              resistance if perceived software ROI weakens. In markets where consumer booking habits are less
              marketplace-dependent, flat-fee competitors like Vagaro may exploit merchant fee sensitivity.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Multi-Stream Monetization
        blocks:
          - type: paragraph
            body: >-
              Fresha has engineered a hybrid monetization architecture that departs fundamentally from conventional
              vertical SaaS models. For nearly a decade following its 2015 founding, the company championed a
              free-forever software narrative, driving rapid merchant onboarding across beauty, wellness, and selfcare
              verticals before activating comprehensive monetization. As of 2026, the company operates four
              interconnected revenue streams: merchant software subscriptions, integrated card payment processing,
              one-off consumer marketplace commissions, and metered messaging add-ons. By embedding financial services
              directly into merchant booking operations, Fresha monetizes both operational software usage and underlying
              commercial transaction flow. This structural shift allows Fresha to generate revenue on multiple
              operational events per merchant, compounding software fees with variable payment processing and customer
              acquisition commissions.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI007
              - CI012
          - type: table
