  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Multi-Sided Marketplace Dynamics
        blocks:
          - type: paragraph
            body: >-
              Fresha operates a dual-sided marketplace model connecting beauty and wellness consumers with service
              professionals across independent studios and multi-location salon brands. On the supply side, the platform
              serves over 130,000 active partner venues and approximately 500,000 beauty and wellness professionals
              spanning hair salons, barbershops, day spas, aesthetics clinics, and nail bars across more than 120
              countries. The overwhelming majority of the merchant base consists of small-to-medium business (SMB)
              owner-operators and independent stylists who initially adopted the platform for zero-subscription
              appointment scheduling and client management. While independent operators provide widespread geographic
              coverage across the UK, Europe, North America, and Australasia, Fresha is increasingly capturing
              multi-site enterprise chains that require consolidated operational management. On the demand side,
              consumer bookers generate high-intent appointment requests through the consumer web marketplace and mobile
              applications, creating a mutual dependency where merchant density drives consumer discovery and consumer
              appointment volume drives merchant payment processing throughput.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU012
