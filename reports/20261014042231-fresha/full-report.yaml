      - number: '7.3'
        title: Operational Reliability, Security, and Critical Dependencies
        blocks:
          - type: paragraph
            body: >-
              Operational durability is foundational to Fresha's value proposition, as the platform facilitates more
              than 35 million appointments monthly and over $15 billion in annual Gross Merchandise Volume across
              130,000 businesses. Any unscheduled platform outage directly halts salon front-desk operations, impairs
              appointment bookings, and interrupts card settlement, creating immediate merchant dissatisfaction and
              chargeback exposure. This operational sensitivity is further amplified by Fresha's rapid enterprise
              expansion into multi-location regional and national brands such as Menspire, Ted's Grooming Room, and
              Gould Barbers, where service level agreements carry elevated commercial penalties. Furthermore, Fresha
              relies on key external platform counterparties: third-party acquiring banks and payment processors for
              transaction settlement, mobile app store operators (Apple and Google) where Fresha ranks among the top 10
              lifestyle apps with over 1 million monthly downloads, and external generative AI discovery protocols such
              as Google Gemini that reportedly originate one in four consumer bookings. Mitigating these dependencies
              requires robust multi-region infrastructure, diversified acquiring rails, and direct consumer brand
              retention.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR013
      - number: '7.4'
        title: Financial Model Sustainability, Mitigations, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Fresha's financial model blends software subscription utility with take-rate monetization on processed
              transaction volume, insulating it somewhat from broader SaaS seat-pricing contraction while creating
              exposure to payment interchange margins and partner reserve policies. While Fresha reports profitability
              on $140M+ in run-rate revenue, lack of public disclosure regarding net take-rate economics, processor fee
              splits, and chargeback loss reserves creates analytical uncertainty. Diligence must establish concrete
              monitoring indicators and thesis-break triggers for ongoing investment governance. Specifically, a
              thesis-break scenario would be triggered by: first, an unhedged termination or margin hike by primary
              payment processing partners that erodes gross margins below 50%; second, a sustained drop in monthly
              appointment velocity below 30 million appointments indicating merchant defection to specialized
              competitors; third, regulatory enforcement actions or fines concerning cross-border customer booking data
              or unauthorized payment intermediation; or fourth, widespread merchant revolt driven by mandatory platform
              fee changes or disintermediation disputes. Tracking these indicators provides an objective framework for
              ongoing risk mitigation.
            claimRefs:
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fintech Disintermediation and Regulatory Licensing Vulnerability
            body: >-
              Because Fresha monetizes primarily through transaction processing across $15B+ in annual GMV rather than
              purely software subscription seats, any regulatory tightening on payment facilitators or processor fee
              increases could compress gross margins without warning.
            calloutType: risk
            claimRefs:
              - CR002
              - CR009
          - type: callout
            title: Investment Thesis-Break Triggers for Monitoring
            body: >-
              Growth investors should establish strict kill criteria: any sustained drop in monthly appointment volume
              below 30 million, a material disruption in app store distribution channels, or regulatory enforcement
              actions regarding cross-border payment settlement should trigger an immediate re-underwriting of the
              investment.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR007
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Fresha presents an impressive combination of operational scale and transactional volume, managing over 35
              million appointments monthly across 130,000 businesses globally. The company commands an annual gross
              merchandise volume exceeding $15 billion and reports annual run-rate revenue surpassing $140 million
              alongside operational profitability. This market footprint reflects strong network effects across beauty,
              spa, and wellness merchants who rely on the platform as their central operating layer. However, from an
              investment underwriting standpoint, Fresha is assigned a recommendation of track, with medium confidence,
              high risk rating, and a valuation stance of stretched. The primary growth investment from KKR at an equity
              valuation exceeding $1.0 billion prices the business at roughly 7.1x run-rate revenue. In an environment
              where public vertical software peers trade between 4.5x and 5.5x revenue, this valuation provides limited
              margin of safety. While Fresha's marketplace and payments monetization is compelling, the absence of
              publicly audited segment financials and increasing competition in high-value medspa verticals warrant
              disciplined observation before initiating new equity exposure.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              In May 2026, Fresha secured an $80 million primary growth investment from funds managed by KKR Next
              Generation Technology Growth fund, elevating the London-headquartered business to unicorn status at a
              post-money valuation of more than $1.0 billion. This transaction brought cumulative lifetime equity
              financing to approximately $285 million since co-founders William Zeqiri and Nick Miller established the
              company in 2015. Prior to this round, Fresha's last public valuation benchmark was $640 million, recorded
              during a Series C extension in late 2021. The KKR growth equity infusion reflects institutional validation
              following extensive proprietary due diligence spanning over 1,000 beauty and wellness businesses.
              Nevertheless, entering at a $1.0 billion valuation requires rigorous examination of cap-table preference
              overhang and underlying unit economics. While company-reported revenue run-rate stands at more than $140
              million with over 60% annualized growth, public disclosures do not disaggregate software subscription
              revenue from payments processing interchange. Consequently, investors must treat headline top-line figures
              with caution, distinguishing between gross payments volume and net retained transaction margin.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV010
      - number: '8.3'
        title: Comparable Benchmarks and Category Headwinds
        blocks:
          - type: paragraph
            body: >-
              Benchmarking Fresha against comparable vertical software and commerce platforms highlights both structural
              advantages and valuation friction. Precedents in vertical operations—such as Toast in restaurants,
              Mindbody in fitness and wellness, and Shopify in retail commerce—demonstrate that combining core
              scheduling workflows with payment monetization unlocks substantial customer lifetime value. Fresha's
              ranking at number 59 on the Andreessen Horowitz Top 100 Global Marketplaces index further substantiates
              its consumer traction. However, the macro software landscape in 2026 presents notable headwinds. Broader
              software multiples have experienced meaningful contraction, exemplified by Salesforce declining
              approximately 30% year-to-date as markets reassess traditional seat-based and software pricing models.
              Furthermore, specialized competitors are aggressively targeting lucrative self-care sub-sectors. Boulevard
              secured $80 million to expand its dominant footprint across approximately 15% of United States medical
              spas, while Vagaro introduced integrated aesthetic electronic prescribing and Zenoti expanded fitness
              workflows. These focused competitors threaten Fresha's ability to capture high-average-order-value
              aesthetic accounts, potentially capping long-term payments take-rate expansion.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Evaluating Fresha under three discrete operating scenarios illuminates the return distribution and
              downside vulnerabilities associated with the current $1.0 billion valuation. In the Bull Case (25%
              probability), Fresha sustains 60%+ revenue growth into 2027, scaling revenue to $225 million as
              multi-location enterprise adoption accelerates across North America and continental Europe. Under this
              scenario, net payments take-rates remain resilient and expanded AI scheduling tools drive higher booking
              conversion, justifying a valuation expansion to $1.6 billion to $1.8 billion (7.0x to 8.0x NTM revenue).
              In the Base Case (55% probability), revenue growth moderates to 35-45%, achieving $190 million run-rate
              while GMV expands steadily to $18 billion. With public vertical SaaS multiples stabilizing around 5.0x to
              5.5x revenue, Fresha's valuation holds near $950 million to $1.05 billion, delivering roughly flat returns
              for new entrants. In the Bear Case (20% probability), top-line growth decelerates below 20% to $165
              million as merchant churn increases in response to transaction fee fatigue, while medspa competitors erode
              premium appointment volume. Applying a compressed 3.0x to 3.6x revenue multiple lowers implied equity
              value to $500 million to $600 million, exposing unhedged common equity to severe multiple drawdown.
            claimRefs:
              - CV003
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV008
              - CV010
              - CV014
              - CV015
      - number: '8.5'
        title: Exit Readiness and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Fresha has not announced an active IPO timeline or public filing readiness roadmap, suggesting that
              management and lead investors are prioritizing private international scale over public listing liquidity
              in the near term. Given market volatility in tech listings, a secondary recapitalization or majority
              sponsor buyout represents the most viable intermediate liquidity mechanism. Before upgrading conviction
              from track to buy, prospective investors should execute three critical diligence inquiries: first, obtain
              audited financial statements detailing net payments take-rates versus subscription software margins;
              second, examine merchant cohort retention tables across mature and recently onboarded multi-location
              accounts following recent pricing revisions; and third, inspect full cap-table waterfall mechanics,
              including KKR's liquidation preference seniority and anti-dilution protections. A formal thesis-break
              trigger would occur if annualized top-line revenue growth drops below 30% or if merchant churn among
              multi-location accounts exceeds 10% annually, which would dismantle the underlying operating leverage
              narrative.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV014
              - CV015
