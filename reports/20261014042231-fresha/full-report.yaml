      - number: '6.4'
        title: Customer Journey, Expansion Loops, and Retention Durability
        blocks:
          - type: paragraph
            body: >-
              The customer lifecycle on Fresha creates an interlocking expansion loop spanning zero-cost onboarding,
              consumer discovery, embedded payments capture, and automated retention flows. Partner onboarding friction
              is minimized through subscription-free operating software, replacing legacy paper diaries with digital
              scheduling. Once venues join the marketplace, consumer habituation drives repeat bookings, with company
              data indicating that client retention exceeds 83% after consumers complete their third appointment on the
              platform. However, significant diligence risks persist regarding long-term merchant durability. Fresha
              does not publicly disclose cohort churn rates, Net Revenue Retention (NRR), or contract renewal benchmarks
              for enterprise accounts. Furthermore, intense competition from vertical SaaS rivals—such as Boulevard in
              luxury medical spas, Vagaro in aesthetic e-prescribing, and Zenoti in enterprise fitness—threatens
              Fresha's expansion into higher-ticket wellness verticals where specialized regulatory and clinical
              workflows dominate.
            claimRefs:
              - CU001
