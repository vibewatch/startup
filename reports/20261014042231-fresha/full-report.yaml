  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation
        - track
        - Profitable operations and $140M+ revenue run-rate balanced by limited private financial auditability
        - Maintain active monitoring across enterprise adoption and margin metrics before committing capital
      - - Confidence
        - medium
        - Verified primary funding records from KKR and company press releases without public audited filings
        - Require audited revenue breakdown and customer retention cohorts for higher conviction
      - - Risk Rating
        - high
        - >-
          Vertical SaaS multiple compression, intense medspa competition, and unverified merchant churn post-pricing
          change
        - Cap valuation entry multiple and apply senior preference protections in any secondary transaction
      - - Valuation Stance
        - stretched
        - Implied revenue multiple of ~7.1x run-rate exceeds median public vertical SaaS trading range of 4.5x-5.5x
        - Wait for entry discount, primary down-round reset, or audited margin confirmation before new buy
    notes: >-
      Evaluated as of 2026-10 based on disclosed $80M KKR round, reported $140M run-rate revenue, and public vertical
      SaaS market benchmarks.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change View
    rows:
      - - Bull Thesis
        - >-
          Dominant marketplace scale with embedded payments and 130K+ merchants creates powerful network effects and
          operating leverage
        - Facilitates 35M+ monthly appointments, >$15B annual GMV, and claims operational profitability
        - Slowing merchant acquisition, net payments volume stagnation, or merchant payment disintermediation
      - - Bull Thesis
        - >-
          Enterprise multi-location adoption expands high-value GMV throughput across regional and national self-care
          chains
        - Enterprise adoption across brands including Ted's Grooming Room, Gould Barbers, and MASAJ Studios
        - Rising churn among multi-location accounts or enterprise resistance to bundled payment processing
      - - Anti-Thesis
        - >-
          Valuation multiple is vulnerable to macroeconomic SaaS multiple compression and shifting software pricing
          paradigms
        - The Next Web notes deal lands amid SaaS valuation scrutiny with Salesforce down ~30% year-to-date
        - Broad software multiple re-rating or acceleration of organic revenue growth above 80% YoY
      - - Anti-Thesis
        - >-
          Specialized competitors like Boulevard and Zenoti aggressively contest high-margin aesthetics and medspa
          verticals
        - Fitt Insider reports Boulevard raised $80M while powering ~15% of US medspas; Vagaro added e-prescribing
        - Fresha establishing clear clinical/aesthetic workflow moat or acquiring a specialized medspa software provider
    notes: >-
      Synthesizes primary growth evidence from KKR partnership against public SaaS multiple contraction and vertical
      medspa competitive pressures.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Revenue & GMV Assumptions
      - Valuation Range ($M)
      - Implied Multiple
      - Probability & Downside Triggers
    rows:
      - - Bull Case
        - >-
          Revenue expands to $225M+ (60%+ YoY), GMV exceeds $22B, payments take-rate stable, international enterprise
          surge
        - $1,600M - $1,800M
        - 7.0x - 8.0x NTM Revenue
        - 25% probability; triggered by US market share leadership and accelerating multi-location enterprise conversion
      - - Base Case
        - Revenue grows 35-45% to $190M, GMV reaches $18B, modest payment take-rate compression, steady profitability
        - $950M - $1,050M
        - 5.0x - 5.5x NTM Revenue
        - 55% probability; triggered by continued core UK/ANZ dominance and steady international expansion
      - - Bear Case
        - Revenue growth decelerates to <20% ($165M), payments churn rises, medspa rivals capture high-AOV bookings
        - $500M - $600M
        - 3.0x - 3.6x NTM Revenue
        - >-
          20% probability; triggered by merchant pushback against fee increases, processor outages, or macro consumer
          spending drop
    notes: >-
      Scenario multiples benchmarked against vertical SaaS peers; assumes enterprise mix and payments take-rate remain
      stable across 2026-2027.
    claimRefs:
      - CV003
      - CV006
      - CV011
      - CV012
      - CV013
