      - number: '7.2'
        title: Regulatory, Legal, and Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              As Fresha expands its embedded payment capabilities globally, regulatory oversight represents a critical
              and evolving compliance surface. Operating as a payment facilitator and embedded financial services
              provider requires rigorous adherence to Anti-Money Laundering (AML), Know-Your-Customer (KYC), and payment
              card industry standards across the UK Financial Conduct Authority (FCA), European Union directives, and
              North American state-level regulations. To manage this exposure, Fresha maintains dedicated executive
              governance led by Chief Payments Officer Paweł Iwanów alongside co-founders William Zeqiri and Nick
              Miller. Additionally, managing sensitive appointment and consumer preference records across tens of
              millions of consumers in more than 120 jurisdictions creates ongoing GDPR and international cross-border
              data transfer liabilities. Furthermore, as partner salons and clinics increasingly offer medical
              aesthetics and medspa services, Fresha faces indirect regulatory risks regarding practitioner
              credentialing and treatment licensing compliance, requiring clear contractual disclaimers and ongoing
              verification diligence.
            claimRefs:
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
