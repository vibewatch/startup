      - number: '5.3'
        title: Platform Architecture, Embedded Commerce, and AI Automation
        blocks:
          - type: paragraph
            body: >-
              Fresha's underlying technology architecture operates as a vertically integrated stack spanning six
              functional layers: consumer client touchpoints, a high-throughput scheduling core, embedded payment
              processing, multi-venue management, AI orchestration, and secure cloud infrastructure. The transaction
              layer is anchored by embedded financial services, eliminating external third-party payment gateways.
              Fresha provides integrated card-present smart terminals for in-salon checkout alongside secure
              card-on-file tokenization for remote mobile payments, capturing interchange and processing fees directly
              within the merchant software layer.


              At the intelligence layer, Fresha has integrated automated workflows and machine learning models,
              including integrations with Google Gemini and autonomous AI booking agents. Fresha reports that
              approximately one in four consumer appointments is now driven or assisted by AI agents and smart
              recommendation algorithms, which optimize appointment scheduling density and match open stylist slots with
              prospective consumer demand. However, unlike horizontal enterprise platforms, Fresha maintains a closed
              proprietary architecture without public developer APIs, webhooks portals, or an open third-party app
              ecosystem, prioritizing end-to-end platform control and workflow consistency over third-party
              composability.
            claimRefs:
              - CE002
              - CE007
              - CE009
              - CE011
