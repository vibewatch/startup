            title: Full-Stack Operating Layer with Embedded Payments Moat
            body: >-
              Unlike traditional appointment scheduling tools that rely solely on software subscription fees, Fresha
              integrates merchant scheduling, consumer marketplace discovery, and embedded point-of-sale payments into a
              unified operating layer. Processing over $15 billion in annual GMV across 130,000 businesses generates
              high payment transaction monetization while insulating the company from pure seat-based SaaS churn.
