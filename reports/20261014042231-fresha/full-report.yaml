      - number: '5.2'
        title: Workflow Transformation and Multi-Location Enterprise Infrastructure
        blocks:
          - type: paragraph
            body: >-
              As beauty and wellness operators scale from single-chair independent studios to multi-location regional
              and national franchise networks, operational complexity compounds across staff scheduling, inventory
              replenishment, and financial reporting. Historically, multi-unit operators relied on fragmented tech
              stacks—combining legacy desktop booking software, separate merchant payment acquiring terminals, and
              ad-hoc spreadsheet inventory trackers. Fresha addresses this operational fragmentation by delivering
              enterprise-tier infrastructure that consolidates multi-venue operations into a centralized administrative
              control plane.


              Enterprise brands such as Menspire, Ted's Grooming Room, and Gould Barbers have adopted Fresha to
              coordinate operations across dozens of distributed storefronts. The multi-location architecture enables
              central office managers to distribute standardized service menus, synchronize retail inventory across
              hubs, enforce granular role-based permissions, and aggregate transaction analytics in real time. Across
              Fresha's global merchant base, appointment volume value exceeds $1.4 billion monthly, representing over
              $15 billion in annual gross merchandise volume. This operational scale demonstrates that the platform's
              distributed scheduling and ledger engines can handle high-concurrency multi-tenant workloads while
              maintaining low latency across diverse international geographies.
            claimRefs:
              - CE003
              - CE005
              - CE014
              - CE015
