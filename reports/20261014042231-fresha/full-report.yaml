      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              From a balance-sheet perspective, Fresha achieved a notable financing milestone in May 2026 by securing an
              $80 million primary growth equity investment from KKR's Next Generation Technology Growth fund at a
              post-money valuation exceeding $1 billion. This transaction lifted cumulative equity capital raised to
              date to $285 million, providing substantial liquidity to support ongoing international expansion in North
              America, Europe, and Asia, as well as capital expenditure for AI booking infrastructure. KKR's commitment
              followed a comprehensive multi-jurisdiction diligence process spanning more than a year. Fresha claims
              self-sustaining operating profitability, indicating low near-term insolvency risk. Nevertheless, from an
              investment diligence perspective, underwriting cannot be finalized without full management disclosure of
              post-paywall cohort retention, gross payment take-rate margins, and processor escrow requirements.
            claimRefs:
