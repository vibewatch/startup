      - number: '6.2'
        title: Adoption Trajectory and Transaction Volume Scale
        blocks:
          - type: paragraph
            body: >-
              The platform's adoption trajectory reflects substantial multi-year expansion across merchant venues and
              consumer transaction volume. Disclosed metrics indicate growth from 50,000 merchant venues and 150,000
              stylists in 2021 to 90,000 venues recognized on the a16z Marketplace 100 ranking in 2023, reaching over
              130,000 business partners by May 2026. Transaction throughput has scaled concurrently, with Fresha
              processing over 35 million appointments monthly, representing an annualized run rate of roughly 420
              million appointments and more than $15 billion in annual gross merchandise volume. Mobile app consumer
              adoption has surged alongside venue growth, with monthly app downloads surpassing 1 million following a
              reported 300% increase since mid-2024. This booking scale anchors Fresha's monetization model, which
              monetizes transaction volume through embedded card payments, automated no-show protections, and
              marketplace commission fees rather than per-seat software licenses.
            claimRefs:
              - CU001
              - CU003
