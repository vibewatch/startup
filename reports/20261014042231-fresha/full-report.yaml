      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Frictionless Onboarding Drives Top-of-Funnel Dominance
            body: >-
              Fresha's historical decision to offer core salon management software without monthly subscription fees
              eliminated the primary psychological and financial hurdle for non-technical salon operators. This
              zero-cost entry point enabled word-of-mouth expansion across 130,000 venues globally, positioning Fresha
              as the distribution and financial layer of the self-care economy without heavy customer acquisition
              spending.
            calloutType: strength
            claimRefs:
              - CU001
              - CU006
          - type: callout
            title: Opaque Retention Dynamics and Medspa Competition
            body: >-
              While Fresha highlights an 83% consumer retention rate after the third appointment, the company provides
              no public cohort churn metrics or Net Revenue Retention figures for its core merchant base. Concurrently,
              specialized platforms like Boulevard and Zenoti are aggressively defending high-ticket medspa and fitness
              segments, leaving Fresha vulnerable to merchant churn if transaction fees escalate.
            calloutType: risk
            claimRefs:
              - CU009
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Taxonomy & Heatmap
        blocks:
          - type: paragraph
            body: >-
              Fresha operates a high-velocity hybrid model combining appointment scheduling software, consumer
              marketplace discovery, and embedded financial payment processing across more than 120 countries. Following
              its May 2026 investment round from KKR valuing the enterprise at over $1 billion with $285 million in
              cumulative funding, Fresha faces heightened scrutiny regarding execution durability and operational
              resilience. While the business reports operating profitability and an annualized revenue run-rate
              exceeding $140 million with 60% year-over-year expansion, its risk surface differs sharply from
              conventional pure-play SaaS platforms. Instead of seat-based churn alone, Fresha's primary exposure
              concentrates around transactional volume velocity, payment processing continuity, and competitive
              encroachment from specialized vertical platforms such as Boulevard, Zenoti, and Vagaro. To evaluate these
              multifaceted exposures, this risk assessment prioritizes failure modes by likelihood, potential economic
              severity, mitigation maturity, and net residual exposure.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR013
              - CR014
          - type: figure
