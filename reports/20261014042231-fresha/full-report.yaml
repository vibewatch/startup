              - CI004
              - CI005
              - CI011
              - CI013
      - number: '4.3'
        title: Scale Benchmarks and Reported Financial Traction
        blocks:
          - type: paragraph
            body: >-
              Commercial scale indicators reported in conjunction with Fresha's growth financing round demonstrate
              substantial platform throughput and accelerating commercial adoption. In May 2026, Fresha disclosed an
              annual revenue run-rate exceeding $140 million, expanding at a year-over-year rate of more than 60%.
              Platform activity spans more than 130,000 beauty and wellness businesses globally, facilitating upwards of
              35 million appointments monthly and exceeding $15 billion in annual gross merchandise value. Furthermore,
              native booking integrations with Google Gemini and search agents contribute over 1.2 million appointments
              monthly, accelerating booking conversion. However, because Fresha operates as a private entity, critical
              underwriting unit economics—specifically gross margin percentage, net payment processing take rates, and
              cohort net revenue retention (NRR)—remain unverified in public disclosures, posing underwriting ambiguity.
            claimRefs:
