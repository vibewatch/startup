              - CO010
      - number: '1.4'
        title: Strategic Milestones and Investment Diligence Outlook
        blocks:
          - type: paragraph
            body: >-
              Since its 2015 inception, Fresha has systematically progressed from an appointment scheduling utility into
              a comprehensive commercial operating system and marketplace engine. Key historical milestones include its
              initial international rollout in 2018, its 2021 General Atlantic growth financing round, its 2023
              placement on the a16z Top 100 Global Marketplaces roster at rank 59, and its 2026 enterprise expansion.
              Recent product innovation has accelerated with the April 2026 rollout of searchable Professional Profiles,
              enabling consumers to discover and book individual stylists rather than just venues. While Fresha
              operational trajectory and $1B valuation highlight strong execution, private diligence must scrutinize
              unaudited gross margins, payment processing take-rate sustainability, and governance dynamics to determine
              whether current growth adequately insulates the business from broader software multiple compression.
            claimRefs:
