      - number: '5.4'
        title: Competitive Differentiation, Platform Dependencies, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Fresha's primary competitive advantage lies in its two-sided network model, combining merchant operating
              software with a high-intent consumer booking marketplace ranked 59th on the a16z Top 100 Global
              Marketplaces index. In comprehensive institutional due diligence conducted by KKR across more than 1,000
              beauty and wellness businesses, Fresha achieved an average score of 8.1 out of 10 across software quality,
              usability, support, set-up, and marketplace power, significantly outpacing the competitor average of 6.7.
              This dual-sided flywheel allows Fresha to monetize both SaaS workflows and marketplace demand generation.


              Nonetheless, substantial product and technical risks require close underwriting. In North America and
              high-end aesthetics, specialized vertical competitors such as Boulevard, Vagaro, and Zenoti are
              aggressively investing in advanced medical-spa workflows, electronic prescribing, and specialized charting
              tools where Fresha currently lacks dedicated clinical feature depth. Furthermore, Fresha does not publish
              external third-party security attestations such as SOC 2 Type II audit reports or public ISO
              certifications on its domain, and its closed developer surface introduces vendor lock-in that may deter
              enterprise operators requiring bespoke enterprise resource planning integrations.
            claimRefs:
              - CE006
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertical Integration vs Point Solutions
            body: >-
              Fresha's competitive defensibility stems from consolidating appointment scheduling, card-present payment
              processing, and consumer discovery into a single closed-loop data architecture, eliminating integration
              fragility for salon operators.
            calloutType: insight
            claimRefs:
