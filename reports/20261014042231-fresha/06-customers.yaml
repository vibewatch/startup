chapter:
  number: 6
  title: Customers
  summary: Fresha serves over 130,000 beauty and wellness venues and 500,000 professionals globally, processing more than 35 million monthly bookings and $15 billion in annual GMV. Adoption is expanding from independent salons into multi-location enterprise chains, though retention cohorts and enterprise concentration remain undisclosed private data.
sections:
  - id: customer-segmentation-and-marketplace-dynamics
    title: Customer Segmentation and Multi-Sided Marketplace Dynamics
    body: Fresha operates a dual-sided marketplace model connecting beauty and wellness consumers with service professionals across independent studios and multi-location salon brands. On the supply side, the platform serves over 130,000 active partner venues and approximately 500,000 beauty and wellness professionals spanning hair salons, barbershops, day spas, aesthetics clinics, and nail bars across more than 120 countries. The overwhelming majority of the merchant base consists of small-to-medium business (SMB) owner-operators and independent stylists who initially adopted the platform for zero-subscription appointment scheduling and client management. While independent operators provide widespread geographic coverage across the UK, Europe, North America, and Australasia, Fresha is increasingly capturing multi-site enterprise chains that require consolidated operational management. On the demand side, consumer bookers generate high-intent appointment requests through the consumer web marketplace and mobile applications, creating a mutual dependency where merchant density drives consumer discovery and consumer appointment volume drives merchant payment processing throughput.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU007
      - CU012
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-transaction-scale
    title: Adoption Trajectory and Transaction Volume Scale
    body: The platform's adoption trajectory reflects substantial multi-year expansion across merchant venues and consumer transaction volume. Disclosed metrics indicate growth from 50,000 merchant venues and 150,000 stylists in 2021 to 90,000 venues recognized on the a16z Marketplace 100 ranking in 2023, reaching over 130,000 business partners by May 2026. Transaction throughput has scaled concurrently, with Fresha processing over 35 million appointments monthly, representing an annualized run rate of roughly 420 million appointments and more than $15 billion in annual gross merchandise volume. Mobile app consumer adoption has surged alongside venue growth, with monthly app downloads surpassing 1 million following a reported 300% increase since mid-2024. This booking scale anchors Fresha's monetization model, which monetizes transaction volume through embedded card payments, automated no-show protections, and marketplace commission fees rather than per-seat software licenses.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU010
      - CU011
    tableRefs:
      - TU002
  - id: enterprise-adoption-and-named-customer-proof
    title: Enterprise Adoption and Named Customer Proof
    body: Although Fresha's historical foundation rested on independent beauty salons, enterprise adoption has accelerated as regional and national multi-location brands migrate away from fragmented software stacks. Verified production customers operating multiple sites include premier grooming and self-care operators such as Ted's Grooming Room, Gould Barbers, Masaj Studios, Menspire, Adams Barbers, and The Art of Nails. Commercial diligence conducted by private equity sponsor KKR across more than 1,000 beauty and wellness operators awarded Fresha a leading satisfaction score of 8.1 out of 10, highlighting ease of setup and customer support. Multi-location brands operating two or more locations have generated a 25.6% annual increase in gross merchandise volume, driving a 61% year-over-year surge in platform revenue from larger accounts. These multi-site deployments demonstrate that Fresha's infrastructure can scale beyond single-chair studios into centralized multi-location reporting and complex automated payouts.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU003
  - id: customer-journey-and-retention-durability
    title: Customer Journey, Expansion Loops, and Retention Durability
    body: The customer lifecycle on Fresha creates an interlocking expansion loop spanning zero-cost onboarding, consumer discovery, embedded payments capture, and automated retention flows. Partner onboarding friction is minimized through subscription-free operating software, replacing legacy paper diaries with digital scheduling. Once venues join the marketplace, consumer habituation drives repeat bookings, with company data indicating that client retention exceeds 83% after consumers complete their third appointment on the platform. However, significant diligence risks persist regarding long-term merchant durability. Fresha does not publicly disclose cohort churn rates, Net Revenue Retention (NRR), or contract renewal benchmarks for enterprise accounts. Furthermore, intense competition from vertical SaaS rivals—such as Boulevard in luxury medical spas, Vagaro in aesthetic e-prescribing, and Zenoti in enterprise fitness—threatens Fresha's expansion into higher-ticket wellness verticals where specialized regulatory and clinical workflows dominate.
    claimRefs:
      - CU001
      - CU009
      - CU013
      - CU014
    figureRefs:
      - FU001
