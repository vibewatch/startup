figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    summary: Six-stage journey mapping salon onboarding, consumer marketplace discovery, embedded payment adoption, and retention-driven expansion.
    data:
      items:
        - label: Discovery & Zero-Cost Onboarding
          detail: Salons onboard via subscription-free operating software, eliminating adoption friction and replacing paper diaries.
          touchpoints:
            - Web registration
            - Core calendar setup
            - Service catalog configuration
        - label: Consumer Marketplace Listing
          detail: Partner venues are listed on Fresha marketplace, driving localized search discovery and consumer booking.
          touchpoints:
            - Fresha mobile app
            - Google/Instagram booking integrations
            - Verified salon reviews
        - label: Embedded Payments Activation
          detail: Merchants activate Fresha payment processing to accept card payments and protect against no-shows.
          touchpoints:
            - In-app card capture
            - In-salon Fresha card terminal
            - Automated deposit processing
        - label: Consumer Habituation & Loyalty
          detail: Consumers establish repeat booking routine, with retention climbing to over 83% after the third visit.
          touchpoints:
            - One-click rebooking
            - Automated reminders
            - Merchant loyalty programs
        - label: Multi-Location Enterprise Scaling
          detail: Maturing brands expand across locations using centralized reporting, staff scheduling, and automated payouts.
          touchpoints:
            - Multi-site management dashboard
            - Enterprise API connectors
            - Consolidated franchise reporting
        - label: Financial Services Expansion
          detail: Fresha leverages accumulated transaction data to offer embedded financial services like Fresha Capital.
          touchpoints:
            - Transaction-underwritten loans
            - Working capital advances
            - Inventory financing
    approximationNotes: Lifecycle stages conceptualized from merchant case studies, KKR diligence descriptions, and company product documentation.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU007
      - CU009
callouts:
  - calloutType: strength
    title: Frictionless Onboarding Drives Top-of-Funnel Dominance
    body: Fresha's historical decision to offer core salon management software without monthly subscription fees eliminated the primary psychological and financial hurdle for non-technical salon operators. This zero-cost entry point enabled word-of-mouth expansion across 130,000 venues globally, positioning Fresha as the distribution and financial layer of the self-care economy without heavy customer acquisition spending.
    claimRefs:
      - CU001
      - CU006
  - calloutType: risk
    title: Opaque Retention Dynamics and Medspa Competition
    body: While Fresha highlights an 83% consumer retention rate after the third appointment, the company provides no public cohort churn metrics or Net Revenue Retention figures for its core merchant base. Concurrently, specialized platforms like Boulevard and Zenoti are aggressively defending high-ticket medspa and fitness segments, leaving Fresha vulnerable to merchant churn if transaction fees escalate.
    claimRefs:
      - CU009
      - CU013
      - CU014
