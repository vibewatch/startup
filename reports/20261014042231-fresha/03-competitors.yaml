callouts:
  - calloutType: insight
    title: Displacing Legacy Point Solutions via Embedded Fintech
    body: Fresha's competitive advantage over legacy scheduling providers stems from treating payments and capital not as third-party add-ons, but as core infrastructure. By embedding checkout directly into the booking calendar, Fresha monetizes gross transaction volume while eliminating the operational data silos that plague salon operators using disconnected merchant terminals.
    claimRefs:
      - CP006
      - CP007
  - calloutType: risk
    title: Multi-Homing Constraints and Merchant Sensitivity to Monetization Shift
    body: Although switching costs protect Fresha once a salon integrates its client list and team schedule, the platform's introduction of subscription plans and ongoing transaction take-rate could trigger merchant resistance if perceived software ROI weakens. In markets where consumer booking habits are less marketplace-dependent, flat-fee competitors like Vagaro may exploit merchant fee sensitivity.
    claimRefs:
      - CP013
      - CP014
