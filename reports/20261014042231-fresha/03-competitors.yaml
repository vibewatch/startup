        - 20% commission on first-time marketplace bookings
        - Low initial barrier to entry, but effective take-rate scales with volume
      - - Booksy
        - SaaS Subscription
        - Tiered monthly subscription ($29.99+/mo per staff)
        - Standard card processing fee
        - Optional marketplace boost commissions
        - Predictable software cost for merchants, but lower vendor fintech take-rate
      - - Vagaro
        - SaaS Subscription + Add-ons
        - Base subscription ($25-$85+/mo depending on users)
        - Competitive card processing rates
        - Nominal platform fee for new client leads
        - Feature add-ons (forms, marketing, website) escalate monthly cost
      - - Mindbody
        - Enterprise SaaS Subscription
        - Tiered plans ($129 to $399+/mo per location)
        - Custom merchant processing markup
        - Promoted marketplace placement fees
        - Substantial fixed operational cost, creating high hurdle for smaller SMBs
      - - Status Quo (Point Solutions)
        - Disjointed Tools
        - $0 to low software cost
        - Standard payment gateway fees (Square/Stripe)
        - None (requires merchant-driven marketing spend)
        - Zero upfront software fee offset by heavy hidden administrative labor
