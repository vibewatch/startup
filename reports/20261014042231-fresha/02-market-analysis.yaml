callouts:
  - calloutType: insight
    title: Monetization Transition from Pure SaaS to Transactional Infrastructure
    body: Fresha's positioning departs from traditional subscription software by embedding payments and marketplace discovery, allowing it to capture economics proportional to partner booking volume rather than capped software seat licenses.
    claimRefs:
      - CM002
      - CM007
  - calloutType: risk
    title: Concentration in Low-Switching-Cost SMB Segments vs. Enterprise Expansion
    body: While multi-location brands like Ted's Grooming Room and Menspire demonstrate enterprise traction, the vast majority of platform venues remain small salons and solo operators where switching costs are low and sensitivity to payment processing take rates is high.
    claimRefs:
      - CM011
      - CM014
