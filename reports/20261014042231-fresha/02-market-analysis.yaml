  - id: TM003
    title: Buyer Segmentation, Operational Workflows, and Procurement Dynamics
    columns:
      - Segment
      - Target Buyer
      - Primary User
      - Payer Model
      - Core Operational Workflow
      - Budget Owner
      - Adoption Trigger
    rows:
      - - Solo Practitioner / Booth Renter
        - Solo stylist, barber, or aesthetician
        - Single operator
        - Zero upfront subscription; payment processing fee per completed transaction
        - Personal calendar management, mobile automated SMS reminders, client direct card checkout
        - Solo practitioner
        - Need to eliminate client no-shows and replace manual paper or WhatsApp appointment coordination
      - - Independent Boutique Salon (2–5 chairs)
        - Salon founder or lead stylist
        - Stylists, reception staff, salon manager
        - Embedded payment processing take-rate plus optional add-on marketplace acquisition fees
        - Multi-staff shift scheduling, booth commission splits, basic retail product inventory, client history
        - Salon owner
        - Administrative overload, revenue leakage from uncharged cancellations, desire for client online self-booking
      - - Multi-Location Urban Enterprise
        - Operations director or managing partner
        - Store managers, district supervisors, front-desk coordinators, therapists
        - Consolidated enterprise payments agreement with standardized multi-venue platform tooling
        - Cross-location client profiles, unified staff roster, centralized pricing control, consolidated financial reporting
        - Chief Operating Officer / Finance Director
        - Fragmented legacy software stacks between stores causing reconciliation bottlenecks and client friction
      - - Specialized Wellness & Aesthetics Studio
        - Clinic director or medical spa owner
        - Specialized therapists, aesthetic technicians, front-desk staff
        - Blended transaction fees with mandatory booking deposit capture
        - Advanced consultation intake records, service deposit enforcement, client loyalty re-engagement
        - Managing partner
        - Need for high-margin service deposit protection and modern digital brand presentation to affluent clientele
    notes: Buyer profiles illustrate the shift from commission-free solo scheduling toward integrated enterprise multi-location operational infrastructure.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
figures:
  - id: FM001
    title: "Market Sizing Lens: Multi-Tiered Addressable Service and Transaction Value Pyramid"
    type: pyramid
    summary: Multi-tiered addressable market sizing framework illustrating the transition from global beauty industry service gross value to platform transactional capture.
    data:
      items:
        - label: Global Beauty & Wellness Service Spend (TAM)
          value: 500
          unit: USD B
          detail: Total consumer expenditure across salons, spas, aesthetic clinics, and personal grooming appointments globally
        - label: Digital Booking Addressable Service GMV
          value: 120
          unit: USD B
          detail: Portion of personal care services digitally bookable in core accessible geographies and urban centers
        - label: Global Salon Management Software & Booking TAM
          value: 4.5
          unit: USD B
          detail: Direct merchant spend on appointment scheduling, CRM, POS, and operational SaaS
        - label: Addressable Payments & Transaction Revenue (SAM)
          value: 2.8
          unit: USD B
          detail: Potential net payments revenue and marketplace commission capture across target salon geographies
        - label: Fresha Platform GMV Footprint (Observed Base)
          value: 10
          unit: USD B
          detail: Annualized gross merchandise volume processed across Fresha partner network spanning 140k+ businesses
        - label: Serviceable Obtainable Net Revenue (SOM)
          value: 1.2
          unit: USD B
          detail: Realistic near-term platform net revenue obtainable via payment take rates, marketplace fees, and enterprise tooling
    approximationNotes: Macro TAM figures reflect third-party industry benchmarks; SAM and SOM reflect transaction take-rate economics applied to addressable GMV.
