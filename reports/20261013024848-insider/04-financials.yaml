figures:
  - id: "FI001"
    title: "Omnichannel Customer Monetization and Gross Profit Conversion Flow"
    type: "flow"
    summary: "Visual mapping illustrating the sequence through which customer omnichannel activity converts into recurring subscription revenue, variable messaging fees, cost of delivery, and net gross margin."
    data:
      nodes:
        - label: "1. Customer Digital Activity"
          description: "End-consumer interactions across Web, Mobile App, Email, SMS, and WhatsApp generate real-time events ingested into native CDP."
        - label: "2. Contracted Commercial Model"
          description: "Enterprise subscription based on core platform license, contracted MAU tiers, and activated communication channels."
        - label: "3. Top-Line Revenue Stream"
          description: "Annual recurring software fees ($48k-$100k+ ACV) combined with variable messaging commitments and professional migration services."
        - label: "4. Cost of Goods Sold (COGS)"
          description: "Cloud infrastructure compute/storage for event ingestion, AI model inference, and external carrier SMS/WhatsApp termination fees."
        - label: "5. Realized Gross Profit"
          description: "Net gross contribution margin generated after deducting cloud hosting infrastructure and third-party telecom carrier delivery expenses."
        - label: "6. Operating Free Cash Flow"
          description: "Terminal operating cash generation after funding global sales engineering, R&D talent, and geographic expansion initiatives."
    approximationNotes: "Flow structure is an operational conceptual framework based on disclosed platform architecture; quantitative percentages at each conversion step are withheld private data."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI007"
callouts:
  - calloutType: "insight"
    title: "Enterprise Revenue Predictability Dampened by Carrier Messaging Exposure"
    body: "While Insider's core CDP and journey personalization software commands high-margin, predictable annual subscription fees averaging $48,000 to $100,000+, its heavy integration of telecommunications channels (SMS, WhatsApp, and RCS) introduces variable cost complexity. Outbound messaging channels incur direct carrier termination expenses that compress blended gross margins relative to pure-play SaaS platforms, making product mix disclosure essential for financial underwriting."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI007"
  - calloutType: "risk"
    title: "Venture Capital Abundance Masks Private Unit Economics Oparity"
    body: "Insider's successful capital raising—securing $500 million in Series E funding in late 2024 and expanding to a 1,500+ employee headcount—provides strong balance sheet durability. However, venture capital availability is not equivalent to positive operating cash flow. In the absence of audited ARR, gross margins, net burn rate, and customer churn, prospective investors cannot verify whether expansion in Latin America and the acquisition of Bluecore are self-funding or reliant on venture cash reserves."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI011"
      - "CI014"
