    title: Enterprise Lock-In and Migration Friction
    body: While Insider One demonstrates rapid time-to-value for brands replacing legacy marketing clouds, multi-year enterprise commitments and MTU-based pricing tiers create substantial switching barriers and operational lock-in once complex omnichannel journeys and identity graphs are embedded.
    claimRefs:
      - CU013
      - CU014
