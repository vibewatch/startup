      - - Global Enterprise Retail & Ecommerce
        - Chief Marketing Officer / VP Ecommerce
        - Omnichannel personalization, cart abandonment recovery, and retail identity resolution
        - 100K to 10M+ monthly tracked users (MTUs) across web, mobile, and store touchpoints
        - Primary revenue driver; anchored by global brands including Adidas, Carrefour, and Sephora
        - Disclosed contract sizes and gross retention percentages per retail cohort are private
      - - Consumer Electronics & Automotive
        - Head of Customer Experience / Digital Director
        - High-intent product discovery, cross-channel lead qualification, and lifecycle onboarding
        - Global multinational footprints across dozens of country-specific localization instances
        - High strategic reference value; key enterprise accounts include Samsung and Toyota
        - Degree of multi-country account centralization versus regional fragmentation is unverified
      - - Travel, Airlines & Hospitality
        - VP Loyalty / Head of Direct Booking
        - Dynamic pricing alerts, flight/booking updates, and real-time app re-engagement
        - Millions of mobile app users and multi-channel transactional messaging volume
        - Drives significant high-margin SMS and mobile push consumption volumes
        - Exposure to travel macro-cyclicality and partner API dependency remain unquantified
      - - Banking & Financial Services
        - Head of Digital Marketing / Compliance
        - Secure conversational updates, onboarding journeys, and deposit/loan product cross-sell
        - Regulated multi-channel engagement spanning email, web push, and WhatsApp
        - High-value enterprise stability; includes global banking institutions such as ING Group and Allianz
        - Strict enterprise data residency and infosec audit requirements create extended sales cycles
    notes: Categorization based on disclosed customer case studies, G2 reviews, and public enterprise references as of October 2026; private revenue mix per segment is undisclosed.
    claimRefs:
      - CU001
