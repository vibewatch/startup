  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow
      - Company Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - Price Drop Retargeting
        - Batch SQL segmentation and daily scheduled push
        - Real-time catalog price drop listener triggering immediate web push
        - Boosted on-site sessions and incremental checkout transactions
        - Granular revenue attribution and multi-touch tracking require third-party tools
      - - Cross-Channel Cart Abandonment
        - Siloed email reminders after fixed 2-hour delay
        - Dynamic orchestration across web push, SMS, and WhatsApp based on affinity
        - Faster recovery velocity and broader audience reach across non-email channels
        - WhatsApp message volume subject to strict carrier and Meta rate limits
      - - Predictive Shopper Re-engagement
        - Manual rule-based RFM cohort definitions
        - Bluecore predictive affinity models calculating next-best purchase probability
        - Higher conversion rates for high-intent retail catalog shoppers
        - Model training heavily dependent on high-volume catalog clickstream data
      - - Dynamic Web Personalization
        - Static landing pages or heavy custom JavaScript variants
        - On-site personalization engine injecting customized banners and product carousels
        - Low-code campaign launch speed with rapid time-to-market
        - Complex single-page applications require custom SDK event wiring
    notes: Benefits and limitations synthesized from customer deployment reports and practitioner reviews; individual uplift varies by catalog size and data quality.
    claimRefs:
      - CE002
      - CE003
      - CE009
      - CE010
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / Component
      - Role
      - Dependency
      - Technical Risk
    rows:
      - - Ingestion & Edge SDK Layer
        - Captures client-side events across web, iOS, Android, and server-to-server APIs
        - Browser cookies, mobile OS permissions, and edge CDN availability
        - Third-party cookie deprecation and browser tracking restrictions
      - - Profile & Identity Stitching
        - Consolidates anonymous sessions with authenticated user IDs into unified profiles
        - Bluecore graph integration and high-throughput key-value datastores
        - Identity collision and merge latency under high concurrency
      - - Decisioning & Agentic AI
        - Determines optimal channel, send time, and content variants via predictive models
        - Cloud GPU/CPU inference clusters and historical engagement training data
        - Model drift and generic LLM copy output lacking brand-specific tone
      - - Multi-Channel Delivery Gateway
        - Dispatches messages across web push, email, SMS, WhatsApp, and ad networks
        - Upstream telco aggregators, WhatsApp Business API, and Apple/Google push services
        - Downstream channel rate limits, spam filtering, and provider outages
    notes: Architecture components reconstructed from public patent, product, and partner deployment disclosures; proprietary internal microservice designs are not publicly disclosed.
    claimRefs:
      - CE001
      - CE007
      - CE012
      - CE013
