    title: Product architecture map
    type: stack
    summary: Six-layer functional software architecture of Insider One from client touchpoints down to delivery gateways.
    data:
      layers:
        - label: Client Interaction & Touchpoint Layer
          detail: Web push, mobile apps (iOS/Android), email, SMS, WhatsApp, and on-site overlay containers
        - label: Data Ingestion & SDK Edge
          detail: JavaScript web SDKs, mobile SDKs, server-side REST APIs, and reverse ETL connectors
        - label: Identity Resolution & Profile Store
          detail: Unified customer data platform integrating Bluecore 10B+ daily shopper event identity graph
        - label: Intelligence & Agentic AI Core
          detail: Agent One decisioning engine, predictive affinity scoring, and dynamic message generation
        - label: Journey Orchestration Canvas
          detail: Insider Architect visual workflow automation, event-driven triggers, and cross-channel branching
        - label: Delivery Infrastructure & External Connectors
          detail: Push notification gateways (APNs/FCM), Meta WhatsApp API, cloud email MTAs, and ad network sync
    approximationNotes: Functional layer decomposition based on technical documentation and acquisition disclosures; underlying infrastructure runs across public cloud hosting providers.
