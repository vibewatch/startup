  summary: >-
    Insider is a late-stage private enterprise software company that combines a native customer data platform,
    omnichannel journey orchestration, and agentic AI to help global consumer brands automate lifecycle marketing across
    web, mobile, email, SMS, and WhatsApp. The business was founded in Istanbul in 2012, expanded through acquisitions
    including MindBehind and Bluecore, and now reports adoption across more than 2,000 enterprise brands worldwide. Its
    commercial model centers on enterprise SaaS subscriptions, implementation services, and channel-based add-ons, but
    public disclosure remains limited on audited revenue, margins, retention, and post-acquisition economics.
