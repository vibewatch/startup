  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Allocation
        blocks:
          - type: paragraph
            body: >-
              Insider One occupies a strategic convergence point within enterprise marketing technology, bridging
              customer data platforms (CDP), real-time personalization engines, and cross-channel campaign
              orchestration. Rather than competing as an isolated data warehouse or point messaging utility, the
              platform vertically integrates first-party consumer data with direct execution across twelve natively
              supported customer touchpoints, including web, mobile applications, email, SMS, WhatsApp, and intelligent
              on-site search. This structural boundary intentionally excludes back-office enterprise resource planning,
              horizontal cloud data storage, and transactional IT infrastructure, focusing software budgets squarely on
              front-office growth, retention, and conversion optimization. Status-quo legacy marketing clouds frequently
              require fragmented add-on tools, custom integration engineering, and high ongoing maintenance costs to
              deliver comparable multi-channel reach. Consequently, enterprise B2C organizations reallocate software
              spend toward unified solutions that consolidate customer profiles and operational messaging within a
              single governance layer, while purely B2B vendors and low-digital-volume organizations remain outside
              Insider's core target scope.
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM014
      - number: '2.2'
        title: Addressable Market Sizing, TAM Lenses, and ACV Dynamics
        blocks:
          - type: paragraph
            body: >-
              The enterprise marketing automation and customer experience software sector continues to benefit from
              durable secular tailwinds driven by first-party data mandates, channel proliferation, and increasing
              consumer expectations for real-time personalization. Growth investor General Atlantic estimated Insider's
              total addressable market (TAM) at over $15 billion in late 2024, citing the global enterprise migration
              away from monolithic marketing clouds toward agile, AI-native platforms. Within this aggregate market, the
              serviceable addressable market (SAM) concentrates on mid-market and enterprise B2C organizations operating
              across retail, travel, telecommunications, and financial services, representing approximately $6.5 billion
              in addressable spend. Commercial pricing models reflect this enterprise positioning, with annual contract
              values typically averaging around $48,000 and scaling to $100,000 or more for comprehensive multi-channel
              enterprise deployments, anchored by entry-tier SaaS subscriptions starting from £1,000 per month. The
              serviceable obtainable market (SOM) is practically constrained by regional sales execution, legacy cloud
              switching inertia, and the pace of direct displacement across North America and Europe.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: figure
