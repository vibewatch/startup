chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Product Foundation
        blocks:
          - type: paragraph
            body: >-
              Founded in 2012 in Istanbul by Hande Cilingir, Serhat Soyuerel, Muharrem Derinkok, Mehmet Sinan Toktay,
              and Okan Yedibela, Insider One has developed from an emerging-market digital marketing tool into a global
              enterprise SaaS platform for customer engagement and cross-channel marketing automation. The company
              operates on a unified architecture centered on an Actionable Customer Data Platform (CDP) tightly
              integrated with Sirius AI and Agent One autonomous decisioning, coordinating real-time marketing across
              twelve or more native touchpoints including WhatsApp, SMS, web, mobile app push, and email. Following its
              late-2025 brand transition to Insider One, the company positions itself against legacy marketing clouds by
              executing automated customer journeys directly from unified first-party data profiles. While top-line
              private valuation benchmarks approach $2.0 billion following its Series E round, the company maintains
              private disclosure regarding recognized annual recurring revenue (ARR), gross margins, and retention
              cohorts, leaving financial scale unconfirmed by independent audited filings.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO013
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: Executive Leadership Roster and Board Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Insider One is led by Chief Executive Officer Hande Cilingir, establishing the company as one of the
              prominent woman-led B2B SaaS unicorns operating in the international technology ecosystem. Cilingir heads
              an executive leadership bench comprising the original co-founding group: Serhat Soyuerel directs global
              commercial growth and revenue operations as Chief Revenue Officer; Muharrem Derinkok guides product
              strategy, Sirius AI development, and autonomous journey design as Chief Product Officer; Mehmet Sinan
              Toktay serves as Chief Technology Officer directing core infrastructure and real-time ingestion pipelines;
              and Okan Yedibela oversees engineering delivery across international software hubs. Following the
              completion of the $500 million Series E investment in late 2024, institutional governance was reinforced
              by the appointment of General Atlantic executives Sascha Guenther, Alex Crisses, and Christopher Apfel to
              the Insider Board of Directors, providing experienced late-stage oversight for ongoing operational
              expansion.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.3'
        title: Financing Trajectory, Institutional Capitalization, and Stakeholder Profile
        blocks:
          - type: paragraph
            body: >-
              Since securing its initial $2.2 million Series A round from 212 in September 2016, Insider One has raised
              roughly $774 million in cumulative institutional equity across multiple financing tiers. Institutional
              expansion was supported by a $11 million Series B led by Sequoia Capital (now Peak XV Partners) in 2018,
              followed by a $32 million Series C led by Riverwood Capital in 2020. In March 2022, the company attained
              unicorn status via a $121 million Series D co-led by the Qatar Investment Authority (QIA) and Riverwood
              Capital, subsequently bolstered by a $105 million venture round in May 2023 backed by QIA and Esas Private
              Equity. The capitalization stack culminated in November 2024 with a $500 million Series E round led by
              General Atlantic, pricing the business at an implied valuation approaching $2.0 billion. While General
              Atlantic's lead position provides substantial expansion capital, specific share-class liquidation
              preferences and cap-table waterfall mechanics remain confidential private data.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: Global Enterprise Scale, Inorganic Expansion, and Corporate Trajectory
        blocks:
          - type: paragraph
            body: >-
              Insider One operates across more than 28 countries spanning North America, EMEA, APAC, and Latin America,
              supported by a workforce exceeding 1,000 employees globally. The company cites commercial relationships
              with over 2,000 enterprise brands, including multinational accounts such as Samsung, Unilever, L'Oreal,
              GAP, and Singapore Airlines. Over its operating lifespan, corporate growth has combined organic platform
              enhancements with targeted M&A initiatives. In January 2023, Insider purchased Istanbul- and Dubai-based
              MindBehind to natively incorporate conversational messaging tools. More recently, on May 13, 2026, Insider
              One completed the strategic acquisition of New York-based retail marketing technology provider Bluecore,
              integrating Bluecore's shopper identification graph to accelerate North American retail footprint and
              reinforce its autonomous agentic customer engagement architecture ahead of prospective public listing
              considerations.
