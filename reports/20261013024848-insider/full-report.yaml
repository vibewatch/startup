  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Stance / Rating
      - Key Evidence & Rationale
      - Decision Implication
    rows:
      - - Recommendation
        - track
        - >-
          1,500+ global enterprise customers and $500M Series E support strong operational traction, but lack of audited
          public ARR bridge limits immediate buy conviction.
        - Maintain active monitoring across quarterly operating milestones without capital commitment.
      - - Confidence
        - medium
        - >-
          Verified top-tier backers (General Atlantic, QIA, Sequoia) and customer roster, countered by unverified gross
          margin, NRR, and recognized revenue.
        - Require private financial audit disclosure before underwriting direct equity entry.
      - - Risk Rating
        - medium
        - >-
          Substantial capital buffer from $500M round offset by Bluecore integration execution and intense competition
          from enterprise marketing clouds.
        - Monitor post-acquisition retention and US enterprise cross-sell velocity.
      - - Valuation Stance
        - stretched
        - >-
          Last reported valuations ($1.22B to $2B) against $771M cumulative funding suggest high capital intensity and
          compressed private multiples.
        - Enforce disciplined entry cap at <=6x ARR equivalent or wait for public IPO filing.
    notes: >-
      Synthesis of diligence findings as of October 2026; valuation stance reflects limited visibility into post-Series
      E secondary transactions and private share liquidation rights.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Case
      - Core Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Investment Thesis
        - >-
          Category-leading compound platform combining native CDP, omnichannel journey orchestration across 12+
          channels, and agentic AI displaces point solutions.
        - 1,500+ enterprise clients including Nike, Samsung, and L'Oreal; $500M Series E led by General Atlantic.
        - Deceleration in enterprise net additions or loss of Fortune 500 marquee logos to legacy clouds.
      - - Anti-Thesis
        - >-
          Capital-intensive growth with $771M cumulative funding and opaque unit economics; unverified NRR, gross
          margin, and potential preference overhang from Series E.
        - TexAu reports $1.22B valuation mark despite $771M total capital raised; no public ARR or cash burn disclosure.
        - Audited financial bridge demonstrating >75% gross margin, >115% NRR, and positive operating cash flow.
      - - Integration Thesis
        - >-
          Acquisition of Bluecore in May 2026 expands US retail footprint and identity resolution graph processing 10B+
          daily shopper events.
        - Official Bluecore announcement and industry reporting on North American retail marketing drive ahead of IPO.
        - Spike in customer churn or technological integration friction across retail accounts.
    notes: >-
      Thesis drivers assessed against reported customer scale and venture backing; anti-thesis underscores persistent
      disclosure gaps in private financial metrics.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Implied Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Bluecore integration succeeds; US enterprise revenue grows >40% YoY; agentic AI drives NRR to >120% with gross
          margins expanding above 75%.
        - Target exit at $4.0B–$5.0B in 2027 IPO (8x–10x forward ARR of $500M); >2.0x return on Series E entry mark.
        - Aggressive competitive response from Salesforce/Adobe and US macro enterprise budget freeze.
        - 25% (requires flawless US execution and sustained macro tailwinds)
      - - Base Case
        - >-
          Stable 25%–30% revenue growth in international markets; steady US penetration; modest Bluecore cross-sell with
          breakeven cash flow.
        - Exit at $2.2B–$2.8B (5x–6x forward ARR of $400M–$450M); 1.1x–1.4x return on late-stage valuation base.
        - Multiple compression in public SaaS comps and margin drag from retail service operations.
        - 55% (most consistent with historical customer addition velocity and market expansion)
      - - Bear Case
        - >-
          Bluecore retail customer churn accelerates; enterprise migration friction; high cash burn forces down-round or
          structured recapitalization.
        - >-
          Valuation haircut to $1.2B–$1.5B (3x ARR); negative returns to late-stage common equity after preference
          stack.
        - Liquidation preference overhang from $500M Series E wiping out common and early preferred.
        - 20% (triggered if customer retention deteriorates or integration stalls)
    notes: >-
      Scenario valuations assume normalized B2B SaaS public multiples (3x–8x NTM ARR) applied to estimated operating
      scale; probability signals reflect author diligence assessment.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
