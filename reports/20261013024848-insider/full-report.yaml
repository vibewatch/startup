      - number: '5.2'
        title: Enterprise Architecture and Agentic AI Operating Model
        blocks:
          - type: paragraph
            body: >-
              The technical architecture of Insider One is organized across a multi-tier software stack designed for
              high-concurrency event ingestion, real-time profile reconciliation, and automated multi-channel dispatch.
              Client touchpoints interact with lightweight JavaScript web SDKs, native mobile libraries for iOS and
              Android, and server-to-server REST ingestion endpoints. Ingested clickstream and transactional payloads
              flow into an enterprise customer data platform layer that unifies anonymous visitor cookies, authenticated
              customer identifiers, and offline transaction records into singular customer graph entities. Above the
              data ingestion core sits Insider Architect, a visual workflow execution engine that manages decision
              trees, delay intervals, A/B/n multivariate testing, and event listeners. In 2025, Insider expanded this
              decisioning layer by introducing Agent One, transitioning the system toward an autonomous agentic
              architecture designed to autonomously plan, execute, and optimize cross-channel campaigns without manual
              rule drafting. Rather than relying solely on static scheduled campaigns, the agentic engine continuously
              evaluates engagement probabilities and channel preferences to dispatch personalized content variants.
              Delivery execution is handled by a carrier gateway coordinating direct push connections (APNs, FCM), telco
              SMS aggregators, and the Meta WhatsApp Business API. Maintaining high delivery throughput across disparate
              third-party communication APIs constitutes a core operational dependency, requiring automated retry
              queues, rate-limit throttling, and active spam-reputation monitoring.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE007
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
