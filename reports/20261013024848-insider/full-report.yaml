      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Drivers
        blocks:
          - type: paragraph
            body: >-
              Enterprise procurement of Insider One is primarily championed by Chief Marketing Officers, Chief Digital
              Officers, and Heads of Customer Experience who own strategic revenue growth and customer retention
              objectives. Discretionary budget ownership typically sits within digital marketing and CRM departments,
              where commercial leaders seek to lower rising customer acquisition costs (CAC) and maximize repeat
              purchase frequency through personalized customer journeys. The commercial value proposition is reinforced
              by demonstrated return on investment, with customer case studies documenting conversion rate uplifts
              between 35% and 350% alongside material average order value expansion following platform deployment.
              Insider's strategic expansion in North America received a substantial acceleration through the May 2026
              acquisition of retail technology leader Bluecore, which contributed a proprietary retail shopper
              identification graph processing billions of daily events. This transaction brought over 400 premier
              enterprise retail customer relationships, including Sephora, J.Crew, and The North Face, directly into
              Insider One's addressable commercial network.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
