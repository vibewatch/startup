            ingested into native CDP.
        - label: 2. Contracted Commercial Model
          description: >-
            Enterprise subscription based on core platform license, contracted MAU tiers, and activated communication
            channels.
        - label: 3. Top-Line Revenue Stream
          description: >-
            Annual recurring software fees ($48k-$100k+ ACV) combined with variable messaging commitments and
            professional migration services.
        - label: 4. Cost of Goods Sold (COGS)
          description: >-
            Cloud infrastructure compute/storage for event ingestion, AI model inference, and external carrier
            SMS/WhatsApp termination fees.
        - label: 5. Realized Gross Profit
          description: >-
            Net gross contribution margin generated after deducting cloud hosting infrastructure and third-party telecom
            carrier delivery expenses.
        - label: 6. Operating Free Cash Flow
          description: >-
            Terminal operating cash generation after funding global sales engineering, R&D talent, and geographic
            expansion initiatives.
