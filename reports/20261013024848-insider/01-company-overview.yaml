callouts:
  - calloutType: "strength"
    title: "Capitalization Scale and High-Tier Institutional Sponsorship"
    body: "Insider One's $500M Series E financing led by General Atlantic provides substantial balance-sheet insulation and dry powder for strategic inorganic expansion, as demonstrated by the May 2026 acquisition of Bluecore. Institutional governance rights held by General Atlantic partners introduce mature late-stage discipline."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO012"
  - calloutType: "risk"
    title: "Private Disclosure Opacity and Enterprise Migration Friction"
    body: "Despite top-line valuation metrics reaching ~$2.0B, Insider One discloses neither audited annual recurring revenue nor net revenue retention figures. Furthermore, independent assessments cite high entry price minimums (~$4,800/month) and substantial implementation ramp periods for advanced predictive journeys, requiring diligent contractual validation."
    claimRefs:
      - "CO013"
      - "CO014"
