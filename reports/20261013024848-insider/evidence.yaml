evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming annual recurring revenue (ARR), recognized revenue bridge, net retention
      rate (NRR), and GAAP gross margin for fiscal years 2024 through 2026.
    whyItMatters: >-
      As a late-stage private software unicorn valued at ~$2.0B, lack of audited revenue disclosure prevents definitive
      margin benchmarking and underwriting of organic growth efficiency.
    diligencePath: >-
      Request audited financial statements, historical revenue recognition schedules, and customer retention cohort data
      under a formal non-disclosure agreement during prospective investment diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: cap-table-governance
    missingEvidence: >-
      Comprehensive capitalization table detailing Series E per-share price, liquidation preference structure, seniority
      ordering, and anti-dilution covenants.
    whyItMatters: >-
      General Atlantic's $500M Series E investment represents more than 60% of cumulative capital raised; economic
      distribution rights under downside scenarios depend directly on liquidation preference multiples.
    diligencePath: >-
      Review amended and restated articles of incorporation and shareholder agreements in the virtual data room to
      confirm investor preference stacks.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: som-sizing
    missingEvidence: Audited segment-level revenue and market share figures for North American retail customer engagement.
    whyItMatters: >-
      Determining precise serviceable obtainable market (SOM) requires non-public geographic and segment revenue
      breakdowns rather than high-level investor TAM assertions.
    diligencePath: >-
      Request management's geographic ARR breakout, Bluecore standalone contribution figures, and customer net retention
      rates during diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP/IFRS income statement, recognized revenue breakdown, balance sheet, and statement of cash flows for
      fiscal years 2024 through 2026.
    whyItMatters: >-
      Without audited financial disclosures, underwriting cannot verify recognized revenue, operating margin
      trajectories, cash burn rates, or organic growth velocity.
    diligencePath: >-
      Request confidential virtual data room access to audited financial statements and board-approved management
      reporting packages.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), logo churn cohorts, and customer ARR
      concentration schedules.
    whyItMatters: >-
      Customer retention metrics indicate platform stickiness, expansion durability, and vulnerability to enterprise
      account contraction.
    diligencePath: >-
      Obtain historical revenue retention cohort tables and customer ARR concentration reports segmented by tier and
      geography.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: carrier-and-inference-cogs
    missingEvidence: >-
      Cost of goods sold (COGS) ledger separating third-party cloud hosting infrastructure, AI model inference, and
      telecommunication carrier termination expenses.
    whyItMatters: >-
      Determines true software gross margin versus variable telephony pass-through economics, establishing long-term
      free cash flow margin potential.
    diligencePath: Request vendor-level COGS breakdown detailing cloud computing expenditures and carrier messaging partner invoices.
    relatedQuestionRefs:
      - QI003
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: data-residency-and-security
    missingEvidence: >-
      SOC 2 Type II compliance reports, ISO 27001 audit scope, and cross-border data residency guarantees covering
      unified EU-US tenant data storage.
    whyItMatters: >-
      Enterprise retail and banking clients require verified tenant data isolation, especially when merging Bluecore US
      shopper profiles with global CDP clusters.
    diligencePath: >-
      Request latest SOC 2 Type II compliance audit and data processing addendum (DPA) under NDA during technical
      diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: identity-resolution-benchmarks
    missingEvidence: >-
      Deterministic vs probabilistic identity resolution match rates and real-time event pipeline latency benchmarks
      under peak holiday traffic.
    whyItMatters: >-
      Claims of processing over 10 billion events daily need validation regarding query latency and false positive match
      rates across cross-domain retailers.
    diligencePath: >-
      Review technical architecture documentation and synthetic latency benchmarks under simulated holiday traffic
      spikes during code/infrastructure review.
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: Retention and Churn Disclosures
    missingEvidence: Audited net revenue retention (NRR), gross revenue retention (GRR), and annual customer cohort churn metrics.
    whyItMatters: >-
      Without audited retention benchmarks, investors cannot definitively verify underlying revenue durability,
      expansion health, or customer lifetime value.
    diligencePath: >-
      Request confidential historical cohort retention tables, logo churn logs, and ARR renewal bridge schedules during
      formal sponsor diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: Named Customer Deployments Enumeration
    missingEvidence: >-
      Comprehensive census of enterprise customer accounts, individual contract values, and ARR distribution across
      verticals.
    whyItMatters: >-
      Public case studies highlight top-performing customer references but omit customer revenue concentration or
      smaller account performance.
    diligencePath: >-
      Review anonymized customer-level ARR master ledger and top-20 customer revenue concentration disclosures under
      NDA.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-investigations
    missingEvidence: >-
      Comprehensive audit records of active regulatory investigations, cross-border data transfer filings, and formal
      litigation proceedings across Turkish, EU, and US operational entities.
    whyItMatters: >-
      Cross-border data protection enforcement (GDPR and KVKK) can impose severe revenue-scaled fines and impede unified
      customer data processing across European and Middle Eastern customer bases.
    diligencePath: >-
      Request legal disclosure schedule, pending litigation certificates from Turkish and Delaware corporate entities,
      and verified Data Processing Agreements (DPAs) during confirmatory diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-churn-concentration
    missingEvidence: >-
      Audited revenue contribution, logo churn, and contract renewal rates for top 10 enterprise accounts including
      Samsung and enterprise retail clients.
    whyItMatters: >-
      Public crawls reveal heavy domain weighting toward anchor accounts such as Samsung, creating substantial
      vulnerability to single-customer in-sourcing or contract renegotiation.
    diligencePath: >-
      Inspect customer cohorts, net retention rates by ARR band, and contract termination provisions during private
      underwriting.
    relatedQuestionRefs:
      - QR002
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited financial statements verifying recognized revenue, GAAP gross margin, net revenue retention (NRR), and
      cash burn trajectory.
    whyItMatters: >-
      Without audited figures, underwriting an equity valuation above $2B relies entirely on company-claimed customer
      metrics and press disclosures.
    diligencePath: >-
      Request confidential disclosure of audited 2024-2025 financial statements and quarterly 2026 management accounts
      from Insider's CFO.
    relatedQuestionRefs:
      - QV009
