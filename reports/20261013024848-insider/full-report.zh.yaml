  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与理想客户画像（ICP）
        blocks:
          - type: paragraph
            body: >-
              Insider One 面向消费者互动量大的中型市场至大型全球企业，通常要求在 B2C 和 B2B2C 模式下拥有 100,000 或更多月度跟踪用户（MTU）。其理想客户画像覆盖五个主要行业：零售和电商（如
              Adidas、Carrefour、GAP、Sephora）、消费电子和汽车（包括 Samsung、Toyota）、旅行和酒店（如 Singapore Airlines）、金融服务（包括 Allianz、ING
              Group）以及消费包装商品（如 L’Oréal、Unilever）。主要买方和内部倡导者是 CMO、客户体验负责人以及 CRM
              或生命周期营销总监，他们希望把独立电子邮件、SMS、推送通知和网页个性化等零散点解决方案整合成统一的 AI 编排架构。Insider One
              可消除断裂数据层与活动交付工具之间昂贵的定制集成，实现统一身份解析和实时受众激活，而不要求 IT 或工程团队重度介入。但对于 MTU 少于 50,000
              的早期创业公司，或无法合理承担定制合同最低额和运营开销的低量 B2B 销售模式，该平台并不合适。
