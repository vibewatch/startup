chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立根基与产品基础
        blocks:
          - type: paragraph
            body: >-
              Insider One 由 Hande Cilingir、Serhat Soyuerel、Muharrem Derinkok、Mehmet Sinan Toktay 和 Okan Yedibela 于 2012
              年在伊斯坦布尔创立，已从新兴市场数字营销工具发展为面向客户互动和跨渠道营销自动化的全球企业 SaaS 平台。公司以统一架构为核心，将可执行客户数据平台（CDP）与 Sirius AI、Agent One
              自主决策紧密整合，在 WhatsApp、SMS、网页、移动应用推送和电子邮件等 12 个以上原生触点上协调实时营销。品牌于 2025 年末切换为 Insider One
              后，公司依托统一的一方数据画像直接执行自动化客户旅程，以此对标传统营销云。Series E 后，私募估值基准接近 $2.0 billion，但公司对已确认
              ARR、毛利率和留存队列仍采取不公开披露的做法，财务规模尚未获独立审计文件确认。
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO013
              - CO014
