      - number: '1.2'
        title: 高管阵容与董事会治理结构
        blocks:
          - type: paragraph
            body: >-
              Insider One 由 CEO Hande Cilingir 领导，是国际科技生态中颇具代表性的女性领导 B2B SaaS 独角兽之一。Cilingir 带领原联合创始团队：Serhat Soyuerel 任
              CRO，负责全球商业增长和收入运营；Muharrem Derinkok 任 CPO，负责产品战略、Sirius AI 开发和自主旅程设计；Mehmet Sinan Toktay 任
              CTO，负责核心基础设施和实时数据摄取管线；Okan Yedibela 负责国际软件中心的工程交付。$500 million Series E 投资于 2024 年末完成后，General Atlantic 高管
              Sascha Guenther、Alex Crisses 和 Christopher Apfel 加入 Insider 董事会，机构治理得到强化，为持续运营扩张带来成熟的后期监督。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
