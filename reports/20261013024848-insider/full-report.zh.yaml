  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 展示企业客户从初始网页个性化到自主代理式扩展的采用进程，覆盖多个 渠道。
    data:
      nodes:
        - label: 发现与限定范围试用
          touchpoints:
            - Website interactive demo
            - Executive pitch on tool consolidation
            - Scoped proof-of-concept on web personalization
        - label: 数据集成与 CDP 入驻
          touchpoints:
            - Two to three month onboarding period
            - 100+ native connectors (Salesforce, Segment, BigQuery)
            - Unified first-party customer profile creation
        - label: 初始全渠道激活
          touchpoints:
            - Architect visual canvas setup
            - Real-time web and mobile app personalization
            - Automated email and SMS campaign triggers
        - label: 代理式旅程自动化
          touchpoints:
            - Predictive scoring via Sirius AI
            - Agent One autonomous campaign execution
            - AI Co-Pilot generative copy and segment suggestions
        - label: 对话与商务扩展
          touchpoints:
            - Two-way WhatsApp conversational commerce
            - Bluecore Transparent ID Network retail identity resolution
            - Site search and personalized product recommendation blocks
        - label: 企业规模化与多年续约
          touchpoints:
            - MTU tier expansion (500K to 5M+ monthly users)
            - Cross-brand and multi-country geographic rollout
            - Multi-year enterprise contract renewal with dedicated CSM
    approximationNotes: 基于 G2 用户评价和 GTM 技术栈分析，对客户生命周期采用阶段的示意性呈现。
    claimRefs:
      - CU012
      - CU013
