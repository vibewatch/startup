              - CP008
              - CP011
      - number: '3.2'
        title: 竞争对手能力、架构与定价模式
        blocks:
          - type: paragraph
            body: >-
              比较竞争对手画像可以看出，该品类在架构理念和商业打法上分化明显。企业同业通常按月活用户、承诺消息量或数据消费单位设置合同平台层级并定价。Iterable 等点解决方案专注可扩展的电子邮件和 SMS
              交付，MoEngage 等移动优先工具聚焦移动推送和应用内消息；Insider One 则把增长管理能力打包起来，覆盖漏斗顶部网页个性化、搜索推荐和全生命周期自动化。行业定价评估显示，Insider
              的中型市场至企业级合作通常从约 $48,000 年度承诺起步，复杂企业部署可达到每年 $100,000 或更高。Salesforce 和 Adobe
              加入实施及咨询成本后通常大幅超过这些水平，而开发者导向的生命周期平台在联系人和事件量激增时可能产生难以预测的消费账单。Bluecore 的 Transparent ID Network 让 Insider
              得以处理每天超过 10 billion 个购物者事件的零售身份解析，缩小其与北美成熟零售专业厂商的历史差距。
