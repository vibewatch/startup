      - - 反论点
        - 资本密集型增长，累计融资 $771M 且单位经济学不透明；未经核实的 NRR、毛利率，以及 E 轮 可能带来的优先权负担。
        - TexAu 报告估值为 $1.22B，尽管累计募资 $771M；没有公开 ARR 或现金消耗披露。
        - 经审计的财务桥接表证明毛利率 >75%、NRR >115%，且经营现金流为正。
      - - 集成正论点
        - 2026 年 5 月收购 Bluecore，扩大美国零售覆盖，并使身份解析图每天处理 10B+ 个购物者事件。
        - Bluecore 官方公告及行业报道显示，北美零售营销业务在 IPO 前获得推动。
        - 客户流失激增，或零售客户账户出现技术集成摩擦。
    notes: 正论点驱动因素根据披露的客户规模和风险投资支持评估；反论点强调私有公司财务指标仍存在持续的 披露缺口。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 隐含估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - Bluecore 集成成功；美国企业收入同比增长 >40%；代理式 AI 推动 NRR 达到 >120%，毛利率 扩大至 75% 以上。
        - 目标是在 2027 年 IPO 时以 $4.0B–$5.0B 退出（$500M 远期 ARR 的 8x–10x）；相对 E 轮入场估值回报 >2.0x。
        - Salesforce/Adobe 激烈反击，以及美国宏观环境下企业预算冻结。
        - 25%（需要美国执行毫无瑕疵且宏观顺风持续）
      - - 基准情景
        - 国际市场收入稳定增长 25%–30%；美国市场稳步渗透；Bluecore 交叉销售温和推进， 现金流达到盈亏平衡。
        - 以 $2.2B–$2.8B 退出（$400M–$450M 远期 ARR 的 5x–6x）；相对后期估值基准回报 1.1x–1.4x。
        - 公开 SaaS 可比公司倍数压缩，以及零售服务运营拖累利润率。
        - 55%（与历史客户增加速度和市场扩张最为一致）
      - - 悲观情景
        - Bluecore 零售客户流失加速；企业迁移摩擦加剧；高现金消耗迫使公司进行下轮降价融资或 结构化资本重组。
        - 估值下调至 $1.2B–$1.5B（3x ARR）；优先股堆叠将使后期普通股股权回报为负，
        - $500M E 轮的清算优先权负担吞噬普通股和早期优先股价值。
        - 20%（若客户留存恶化或集成停滞则触发）
    notes: 情景估值假设将正常化的 B2B SaaS 公开市场倍数（NTM ARR 的 3x–8x）应用于估算的运营 规模；概率信号反映作者的尽调判断。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Insider One 从 2012 年到 2026 年公司历史中的组织、融资、产品和收购关键里程碑。
    approximationNotes: 里程碑日期以官方公开新闻公告或产品发布所在月份为准。
    data:
      items:
        - label: 公司成立
          date: '2012'
          detail: Hande Cilingir 与四位联合创始人在伊斯坦布尔创立公司，最初是一款数字营销优化工具。
          tone: neutral
        - label: A 轮融资
          date: 2016-09
          detail: 获得 212 领投的 $2.2M A 轮融资，拓展新兴数字市场。
          tone: positive
        - label: B 轮融资与亚洲扩张
          date: 2018-04
          detail: 获得 Sequoia Capital 领投的 $11M B 轮融资；加速在东南亚和日本的增长。
          tone: positive
        - label: C 轮融资与美国市场进入
          date: 2020-07
          detail: 获得 Riverwood Capital 领投的 $32M C 轮融资，开始拓展北美市场。
          tone: positive
        - label: 独角兽地位与 D 轮融资
          date: 2022-03
          detail: 以 $1.22B 估值获得 QIA 和 Riverwood Capital 领投的 $121M D 轮融资，成为独角兽。
          tone: positive
        - label: 收购 MindBehind
          date: 2023-01
          detail: 收购对话式商务平台 MindBehind，整合 WhatsApp 和即时消息渠道。
          tone: positive
        - label: E 轮融资（$500M）
          date: 2024-11
          detail: 完成 General Atlantic 领投的 $500M E 轮融资，估值约 $2.0B；General Atlantic 董事加入 董事会。
          tone: positive
        - label: 更名为 Insider One 并推出 Sirius AI
          date: 2025-12
          detail: 更名为 Insider One，推出 Sirius AI 和 Agent One 自主代理式客户互动产品。
          tone: positive
        - label: 收购 Bluecore
          date: 2026-05
          detail: 收购零售营销技术领导者 Bluecore，扩展北美零售数据基础设施。
          tone: positive
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO011
      - CO012
