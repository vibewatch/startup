  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义与核心工作流执行
        blocks:
          - type: paragraph
            body: >-
              Insider One 是 AI 原生全渠道体验和客户互动平台，旨在把割裂的企业营销工作流统一成持续的实时执行闭环。在运营端，平台解决受众分群、预测倾向评分和多渠道消息发送之间的典型脱节。企业 CDP
              与旅程编排、交付引擎直接整合后，营销团队可配置由事件驱动的复杂触发器，瞬时响应消费者意向信号。标准生产流程会捕捉站内细粒度行为事件，如浏览目录、搜索查询和商品降价，再与历史身份画像匹配，在网页推送、移动应用推送、电子邮件、SMS
              或 WhatsApp
              上执行个性化动作。客户部署记录显示，自动降价提醒和弃购旅程能以很低的运营延迟稳定带来增量数字会话和转化交易。但从业者评价也显示，标准网页旅程可通过低代码可视化模板快速部署，企业报告界面却缺少细粒度的多触点归因指标，往往需要把原始活动事件日志导出到第三方商业智能工具，才能验证收入。
