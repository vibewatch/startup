  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 将企业规模、资本结构风险、估值纪律与跟踪建议串联起来的决策流程。
    data:
      nodes:
        - id: scale-proof
          label: 规模与客户验证
          detail: 覆盖 28 个国家的 1,500+ 家企业客户，其中包括财富 500 强客户（Nike、Samsung、L'Oreal）
        - id: capital-structure
          label: 资本流入与结构
          detail: General Atlantic 领投的 $500M E 轮融资，使累计融资额达到 $771M
        - id: strategic-ma
          label: 并购扩张
          detail: 2026 年 5 月收购 Bluecore，新增每日 10B+ 条购物者事件身份图谱
        - id: diligence-gap
          label: 私有信息披露缺口
          detail: 经审计 ARR、毛利率、NRR 以及 E 轮优先股堆叠条款均未获验证
        - id: valuation-assessment
          label: 估值评估
          detail: 私募估值标记为 $1.22B 至 $2B；相较于未披露的现金消耗，这些倍数偏高
        - id: final-recommendation
          label: 推荐立场
          detail: 跟踪建议：关注其在美国零售领域的整合，并坚持要求经审计的财务披露
      edges:
        - from: scale-proof
          to: capital-structure
        - from: capital-structure
          to: strategic-ma
        - from: strategic-ma
          to: diligence-gap
        - from: diligence-gap
          to: valuation-assessment
        - from: valuation-assessment
          to: final-recommendation
    approximationNotes: 基于现有尽调数据，对投资建议框架作出的顺序化逻辑呈现。
