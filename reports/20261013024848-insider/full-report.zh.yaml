              尽管顶线估值指标达到约 $2.0B，Insider One 既未披露经审计的 ARR，也未披露净收入留存数据。独立评估还指出，其起步价格门槛较高（约
              $4,800/month），高级预测旅程的实施爬坡期较长，因此需要仔细核验合同。
