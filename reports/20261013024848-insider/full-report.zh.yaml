      - number: '2.3'
        title: 买方细分、预算归属与采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              Insider One 的企业采购主要由 CMO、CDO 和客户体验负责人推动，他们负责战略收入增长和客户留存目标。可支配预算通常归数字营销和 CRM
              部门，商业负责人希望通过个性化客户旅程降低不断上升的客户获取成本（CAC），并提高复购频率。客户案例记录显示，平台部署后转化率提升 35% 至
              350%，平均订单价值也显著增加，进一步强化了其商业价值主张。2026 年 5 月收购零售技术龙头 Bluecore，大幅加速了 Insider 在北美的战略扩张；Bluecore
              带来可处理数十亿日事件的专有零售购物者识别图谱。该交易将包括 Sephora、J.Crew 和 The North Face 在内的 400 多个头部企业零售客户关系直接纳入 Insider One
              的可触达商业网络。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用约束、切换壁垒与证据缺口
        blocks:
          - type: paragraph
            body: >-
              尽管商业 ROI 指标颇具吸引力，企业采用复杂软件平台仍会遇到常见摩擦。独立平台的用户评价显示，客户实施平均约需三个月，需要集中式上线支持和技术协同，才能接入既有目录、分析和 CRM
              数据流。组织变革管理也会拖慢采用速度：企业营销人员必须完成产品探索和工作流再培训，从手工活动管理转向自动化旅程编排与代理式 AI 系统。财务透明度方面仍存在关键尽调缺口：Insider One
              维持私有报告标准，没有公开确认收入桥接、NRR 拆分或地域盈利能力。没有经审计的财务披露来确认独立自然增长与 Bluecore 收购收入贡献的区别，独立尽调无法核实其 SOM 的准确捕获规模。
            claimRefs:
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: CDP 与多渠道旅程执行的整合
            body: 企业买方越来越拒绝独立 CDP 和单渠道消息点解决方案，转而选择把客户数据与 12 个原生渠道执行统一起来的纵向整合套件。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
          - type: callout
            title: 企业切换成本与数据整合难题
            body: 虽然报告显示平均实施时间为三个月，但从根深蒂固的传统营销云迁移客户工作流、并培训运营团队的摩擦，仍会卡住企业采用。
            calloutType: risk
            claimRefs:
              - CM011
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              企业客户互动和营销自动化市场涵盖传统营销云巨头、快速增长的全渠道生命周期平台、专注商业的个性化引擎以及内部技术替代方案。Salesforce Marketing Cloud 和 Adobe Experience
              Platform 等传统营销云拥有广泛的企业触达和根深蒂固的采购总协议，但常见问题是架构收购零散、专业服务开销高、整合周期长。Braze 和 Klaviyo
              等独立生命周期及跨渠道活动套件强调面向开发者的现代体验、事件流以及原生移动或电子邮件 / SMS 执行，但过去往往依赖第三方 CDP 或专业合作伙伴来实现深入的零售身份图谱解析。Bloomreach
              等商业发现和搜索平台更关注数字体验与商品运营，而非全漏斗客户旅程编排。Insider One 通过统一架构实现差异化：原生 Customer Data Platform 直接连接自主多代理决策和原生消息编排，覆盖
              12 个以上渠道，包括双向 WhatsApp 对话式消息。其 $500 million Series E（2024 年末）以及 2026 年 5 月收购纽约
              Bluecore，进一步把业务拓展至北美企业零售身份基础设施。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
