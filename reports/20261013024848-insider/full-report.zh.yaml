  - id: FI001
    title: 全渠道客户变现与毛利转化流程
    type: flow
    summary: 可视化展示客户全渠道活动如何依次转化为经常性 订阅收入、可变消息费用、交付成本和净毛利率。
    data:
      nodes:
        - label: 1. 客户数字活动
          description: 终端消费者在 Web、移动应用、电子邮件、SMS 和 WhatsApp 上的互动产生实时事件， 并被摄入原生 CDP。
        - label: 2. 合同商业模式
          description: 企业订阅基于核心平台许可、约定的 MAU 层级和已激活的通信 渠道。
        - label: 3. 营收流
          description: 年度经常性软件费用（$48k-$100k+ ACV）加上可变消息承诺和 专业迁移服务。
        - label: 4. 销售成本（COGS）
          description: 用于事件摄入、AI 模型推理及外部运营商 SMS/WhatsApp 终止费用的云基础设施计算 / 存储资源。
        - label: 5. 已实现毛利
          description: 扣除云托管基础设施和第三方电信运营商 投递费用后产生的净毛贡献。
        - label: 6. 经营自由现金流
          description: 为全球销售工程、研发人才和地域 扩张计划提供资金后的最终经营现金生成。
    approximationNotes: 流程结构是基于已披露平台架构的运营概念框架；各转化步骤的量化 百分比属于未披露的私有数据。
    claimRefs:
      - CI001
      - CI003
      - CI007
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Insider One 从客户端触点到底层投递网关的六层功能软件架构。
    data:
      layers:
        - label: 客户端互动与触点层
          detail: 网页推送、移动应用（iOS/Android）、电子邮件、SMS、WhatsApp 和站内浮层容器
        - label: 数据摄入与 SDK 边缘层
          detail: JavaScript 网页 SDK、移动 SDK、服务端 REST API 和反向 ETL 连接器
        - label: 身份解析与画像存储层
          detail: 统一客户数据平台，接入 Bluecore 每日 10B+ 个购物者事件的身份图谱
        - label: 智能与代理式 AI 核心层
          detail: Agent One 决策引擎、预测性偏好评分和动态消息生成
        - label: 旅程编排画布
          detail: Insider Architect 可视化工作流自动化、事件驱动触发器和跨渠道分支
        - label: 投递基础设施与外部连接器
          detail: 推送通知网关（APNs/FCM）、Meta WhatsApp API、云电子邮件 MTA 和广告网络同步
    approximationNotes: 基于技术文档和收购披露的功能层拆解；底层 基础设施运行于公有云托管商之上。
