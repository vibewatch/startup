            body: >-
              Insider One 的技术架构采用多层软件栈，面向高并发事件摄取、实时画像对账和自动多渠道发送。客户触点通过轻量 JavaScript 网页 SDK、iOS 和 Android 原生移动库以及服务器到服务器
              REST 摄取端点交互。点击流和交易载荷进入企业 CDP 层，把匿名访客 Cookie、已认证客户标识和线下交易记录统一为单一客户图谱实体。数据摄取核心之上是 Insider
              Architect，这一可视化工作流执行引擎管理决策树、延迟区间、A/B/n 多变量测试和事件监听器。2025 年，Insider 引入 Agent One
              扩展决策层，推动系统转向自主代理式架构，使其无需人工编写规则即可规划、执行和优化跨渠道活动。代理引擎不再只依赖静态定时活动，而是持续评估互动概率和渠道偏好，发送个性化内容变体。交付由运营商网关负责，协调直接推送连接（APNs、FCM）、电信
              SMS 聚合商和 Meta WhatsApp Business API。要在不同第三方通信 API 上维持高吞吐交付，是一项核心运营依赖，需要自动重试队列、速率限制和主动垃圾信息声誉监控。
