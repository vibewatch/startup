      - number: '1.3'
        title: 融资轨迹、机构资本结构与利益相关方画像
        blocks:
          - type: paragraph
            body: >-
              Insider 于 2016 年 9 月从 212 获得首轮 $2.2 million Series A 后，跨多个融资层级累计筹得约 $774 million 机构股权融资。2018 年，Sequoia
              Capital（现 Peak XV Partners）领投 $11 million Series B；2020 年，Riverwood Capital 领投 $32 million Series C。2022 年
              3 月，公司凭 Qatar Investment Authority（QIA）和 Riverwood Capital 共同领投的 $121 million Series D 成为独角兽；2023 年 5 月又获得
              QIA 和 Esas Private Equity 支持的 $105 million 风险轮。2024 年 11 月，General Atlantic 领投 $500 million Series
              E，融资结构达到顶点，隐含估值接近 $2.0 billion。General Atlantic 的领投地位带来充足扩张资本，但具体股份类别清算优先权和资本表瀑布机制仍属保密私有数据。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
