companyProfile:
  summary: >-
    Insider 是一家后期私营企业软件公司，将原生客户数据平台、全渠道旅程编排和代理式 AI 结合起来，帮助全球消费品牌在网页、移动端、电子邮件、SMS 和 WhatsApp 上自动化生命周期营销。公司 2012
    年在伊斯坦布尔创立，并通过收购 MindBehind 和 Bluecore 扩张，如今称全球已有超过 2,000 个企业品牌采用其产品。商业模式以企业 SaaS
    订阅、实施服务和按渠道计费的附加模块为核心，但经审计收入、利润率、留存和收购后的经济性仍缺少公开披露。
