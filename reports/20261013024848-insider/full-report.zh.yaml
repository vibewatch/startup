        title: 全球企业规模、外延扩张与公司发展轨迹
        blocks:
          - type: paragraph
            body: >-
              Insider One 覆盖北美、EMEA、APAC 和拉丁美洲等 28 个以上国家，全球员工超过 1,000 人。公司称其与 2,000 多个企业品牌建立商业关系，包括
              Samsung、Unilever、L’Oreal、GAP 和 Singapore Airlines 等跨国客户。公司发展同时依靠平台自然增强和有针对性的并购。2023 年 1 月，Insider
              收购总部位于伊斯坦布尔和迪拜的 MindBehind，将对话式消息工具原生纳入平台。2026 年 5 月 13 日，Insider One 完成对纽约零售营销技术供应商 Bluecore
              的战略收购，整合其购物者识别图谱，以加快北美零售覆盖，并在考虑未来上市前强化自主代理式客户互动架构。
