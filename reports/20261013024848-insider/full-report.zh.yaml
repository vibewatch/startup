      - number: '3.3'
        title: 护城河韧性、切换成本与被替代风险
        blocks:
          - type: paragraph
            body: >-
              企业客户互动软件的切换壁垒来自数据迁移摩擦、集成锁定和工作流中断。离开传统营销云通常极其繁琐，因此 Insider 建立了自动迁移工具和预构建集成蓝图，已将 150
              多个企业品牌从传统技术栈转出，价值实现速度最高提升 5X。但被替代风险仍然显著。生成式和代理式 AI 普及后，老牌厂商和新兴营销技术进入者正快速部署自主工作流代理，前端活动生成可能因此商品化。Insider
              的持久防御力取决于其闭环反馈架构能否相较可组合数据栈和通用代理工具包，带来可验证的收入提升和更强留存；该架构让行为信号、身份图谱及多渠道活动结果持续训练 Agent One 智能层。
            claimRefs:
              - CP002
              - CP005
              - CP011
