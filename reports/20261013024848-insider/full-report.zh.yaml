  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出分配
        blocks:
          - type: paragraph
            body: >-
              Insider One 位于企业营销技术的战略交汇点，连接 CDP、实时个性化引擎和跨渠道活动编排。它不是孤立的数据仓库或单点消息工具，而是把一方消费者数据与 12
              个原生支持触点上的直接执行纵向整合起来，包括网页、移动应用、电子邮件、SMS、WhatsApp 和智能站内搜索。这个边界有意排除后台 ERP、横向云存储和交易型 IT
              基础设施，把软件预算集中到前台增长、留存和转化优化。传统营销云往往需要零散的附加工具、定制集成工程和高昂的持续维护成本，才能提供相近的多渠道触达。因此，企业 B2C
              组织会把软件支出转向统一方案，在单一治理层内整合客户画像和运营消息；纯 B2B 厂商及数字业务量较低的组织则不在 Insider 的核心目标范围内。
            claimRefs:
              - CM001
              - CM002
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM014
      - number: '2.2'
        title: 可触达市场规模、TAM 视角与 ACV 动态
        blocks:
          - type: paragraph
            body: >-
              企业营销自动化和客户体验软件行业持续受益于长期顺风，包括一方数据要求、渠道扩张以及消费者对实时个性化日益提高的期待。成长型投资者 General Atlantic 在 2024 年末估计 Insider 的
              TAM 超过 $15 billion，理由是全球企业正从一体化营销云迁向灵活的 AI 原生平台。在这一总市场中，SAM 集中于零售、旅行、电信和金融服务领域的中型及大型 B2C 组织，对应约 $6.5
              billion 的可触达支出。商业定价也印证其企业级定位：年度合同价值通常约为 $48,000，全面的多渠道企业部署可扩展至 $100,000 或更高，入门级 SaaS 订阅则从每月 £1,000 起。SOM
              实际上受区域销售执行、传统云切换惯性以及北美和欧洲直接替代速度限制。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
