  - calloutType: insight
    title: Deployments vs. Unique Customer Base Disparity
    body: Independent web crawl audits indicate 3,899 live domains with Insider One tags after stripping tens of thousands of mirrored Samsung pages. Multi-domain multinational rollouts explain the variance against 2,000+ reported paying accounts.
    claimRefs:
      - CR002
