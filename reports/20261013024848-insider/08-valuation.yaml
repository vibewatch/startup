    title: "Disciplined Stance on Secondary and Pre-IPO Entry"
    body: "While Insider's compound platform and Fortune 500 footprint demonstrate notable market resonance, the $500M Series E round introduces significant potential preference overhang for common equity. Investors should avoid chasing private shares above a $2.5B effective valuation without audited financial documentation on gross margin and net retention."
    claimRefs:
