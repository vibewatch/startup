      - "CV006"
      - "CV007"
      - "CV008"
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Core Operating Assumptions"
      - "Implied Valuation / Return Logic"
      - "Key Downside Risks"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Bluecore integration succeeds; US enterprise revenue grows >40% YoY; agentic AI drives NRR to >120% with gross margins expanding above 75%."
        - "Target exit at $4.0B–$5.0B in 2027 IPO (8x–10x forward ARR of $500M); >2.0x return on Series E entry mark."
        - "Aggressive competitive response from Salesforce/Adobe and US macro enterprise budget freeze."
        - "25% (requires flawless US execution and sustained macro tailwinds)"
      - - "Base Case"
        - "Stable 25%–30% revenue growth in international markets; steady US penetration; modest Bluecore cross-sell with breakeven cash flow."
        - "Exit at $2.2B–$2.8B (5x–6x forward ARR of $400M–$450M); 1.1x–1.4x return on late-stage valuation base."
        - "Multiple compression in public SaaS comps and margin drag from retail service operations."
        - "55% (most consistent with historical customer addition velocity and market expansion)"
      - - "Bear Case"
        - "Bluecore retail customer churn accelerates; enterprise migration friction; high cash burn forces down-round or structured recapitalization."
        - "Valuation haircut to $1.2B–$1.5B (3x ARR); negative returns to late-stage common equity after preference stack."
        - "Liquidation preference overhang from $500M Series E wiping out common and early preferred."
        - "20% (triggered if customer retention deteriorates or integration stalls)"
    notes: "Scenario valuations assume normalized B2B SaaS public multiples (3x–8x NTM ARR) applied to estimated operating scale; probability signals reflect author diligence assessment."
    claimRefs:
