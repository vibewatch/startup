  - id: FM001
    title: Evidence-constrained market-sizing ladder
    type: pyramid
    summary: >-
      Public evidence narrows from a named enterprise cohort to limited adoption and outcome proxies, without
      establishing a dollar TAM, SAM, or SOM.
    data:
      items:
        - label: Named target cohort
          value: Global 2000
          unit: enterprises
          detail: Company positioning; not a count of qualified or reachable buyers.
          claimRefs:
            - CM001
        - label: Private-beta adoption
          value: 35+
          unit: revenue teams
          detail: Partner-reported in 2024; customer and contract denominator unavailable.
          claimRefs:
            - CM011
        - label: Gartner review sample
          value: 10
          unit: ratings
          detail: Small 2026 review sample; not a penetration estimate.
          claimRefs:
            - CM015
        - label: Time reclaimed
          value: 8
          valueNote: More than eight
          unit: hours per account executive per week
          detail: Sequoia-reported customer outcome without disclosed measurement design.
          claimRefs:
            - CM012
        - label: Customer activity uplift
          value: 35
          valueNote: More than 35%
          unit: percent
          detail: Sequoia-reported outcome; baseline and cohort denominator unavailable.
          claimRefs:
            - CM013
        - label: Claimed ROI horizon
          value: 90
          unit: days
          detail: Company claim for large organizations without a disclosed calculation.
          claimRefs:
            - CM010
    approximationNotes: >-
      This is an evidence ladder, not a value-proportional TAM/SAM/SOM pyramid. Items retain unlike source units, are
      not additive, and are ordered from broad target cohort to narrower adoption or outcome evidence.
    claimRefs:
      - CM001
      - CM010
      - CM011
      - CM012
      - CM013
      - CM014
      - CM015
  - id: FP001
    title: Competitive positioning by workflow breadth and enterprise data fit
    type: quadrant
    summary: >-
      Rox is positioned toward broad lifecycle orchestration and warehouse context, while established alternatives
      derive advantage from specialization or native distribution.
    data:
      xAxis:
        label: Workflow breadth
        min: 1
        max: 5
      yAxis:
        label: Enterprise data and governance fit
        min: 1
        max: 5
      points:
        - label: Rox
          x: 5
          'y': 5
          detail: Broad lifecycle claim with warehouse-native account context; public proof remains early.
        - label: Gong / Clari
          x: 3
          'y': 4
          detail: Deep revenue intelligence and forecasting specialization.
        - label: Salesloft / Outreach
          x: 4
          'y': 3
          detail: Strong engagement execution with established user footprints.
        - label: Salesforce Agentforce
          x: 4
          'y': 5
          detail: First-party CRM distribution; cross-system breadth is not established here.
        - label: AI-native CRM entrants
          x: 4
          'y': 2
          detail: Broad replacement ambition with heavier migration requirements.
        - label: Internal build
          x: 2
          'y': 4
          detail: Potentially tailored governance, offset by integration and maintenance burden.
    approximationNotes: >-
      Scores are analyst-authored ordinal placements from 1 to 5 based on retained public descriptions, not measured
      benchmarks or market rankings. Uneven competitor evidence limits precision, so the map should guide diligence
      rather than vendor selection.
    claimRefs:
      - CP001
      - CP004
      - CP005
      - CP011
      - CP012
      - CP016
  - id: FI001
    title: Customer activity to financial outcome bridge
    type: flow
    summary: >-
      Rox can connect account activity to metered software usage, but public evidence stops before realized revenue,
      delivery cost, and gross profit.
    data:
      nodes:
        - id: customer-signals
          label: Customer and account signals
          detail: CRM warehouse product billing and external context feed the account model.
        - id: context-graph
          label: Revenue-specific context graph
          detail: Rox says the graph maintains account understanding across the lifecycle.
        - id: account-agent
          label: One revenue agent per account
          detail: The agent interprets context and supports configured revenue motions.
        - id: workflow-execution
          label: Workflow execution
          detail: Research outreach CRM updates deal work and expansion can consume actions.
        - id: agent-actions
          label: Metered Agent Actions
          detail: Public sources describe usage and outcome pricing but disagree on allowances.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Realized price discounts overages and services mix are not publicly disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Compute data support and enablement costs are unavailable.
    approximationNotes: >-
      Conceptual sequence from public product and pricing descriptions; it is not a proportional funnel, revenue
      forecast, conversion model, or cumulative waterfall.
    claimRefs:
      - CI004
      - CI009
      - CI012
  - id: FE001
    title: Control-bound data-to-action stack
    type: stack
    summary: >-
      Six documented layers show how connected data becomes a reviewable or executable revenue workflow, with
      permissions and freshness constraining every downstream step.
    data:
      layers:
        - label: Connected enterprise and public sources
          detail: CRM, email, meetings, documents, warehouse data, and public information.
          items:
            - Source availability
            - Source permissions
            - Source freshness
        - label: System of Context
          detail: Accounts, people, opportunities, and interactions are connected.
          items:
            - Entity resolution
            - Relationships
            - Source mappings
        - label: Context retrieval
          detail: Relevant information is selected for an account, task, participants, and time period.
          items:
            - Relevance scoring
            - Task scope
            - Temporal context
        - label: Revenue agent and tools
          detail: The agent produces answers or invokes supported tools.
          items:
            - Account summary
            - Email draft
            - Record action
        - label: Applications and workflows
          detail: Users inspect and use outputs in Rox and connected systems.
          items:
            - Web application
            - Rox for Mac
            - CRM and communication integrations
        - label: Governance and access
          detail: Resource, record, and field permissions bound visibility and actions.
          items:
            - Permission Sets
            - Access Provenance
            - Administrative configuration
    approximationNotes: >-
      The layer order is an analytical rendering of documented components, not a latency, throughput, or
      deployment-topology measurement.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: Evidence-backed customer journey and expansion loop
    type: journey-map
    summary: >-
      Rox moves from enterprise qualification and account context into pipeline, deal, renewal, and expansion workflows,
      but public durability evidence stops before renewal and cohort economics.
    data:
      nodes:
        - label: Enterprise qualification
          detail: Target organizations have complex B2B revenue teams and mature warehouse data.
          touchpoints:
            - Global 2000 positioning
            - Revenue and data leadership
            - Warehouse readiness
        - label: Account context
          detail: A dedicated account agent assembles permitted CRM, warehouse, product, billing, and external signals.
          touchpoints:
            - Data connections
            - Identity resolution
            - Permission controls
        - label: Pipeline generation
          detail: >-
            Research, account prioritization, personalized outreach, and inbound routing create or qualify
            opportunities.
          touchpoints:
            - Research
            - Buying signals
            - Personalized outreach
        - label: Deal execution
          detail: The system supports meeting preparation, deal monitoring, CRM updates, and next actions.
          touchpoints:
            - Meeting briefs
            - Risk monitoring
            - Opportunity management
        - label: Renewal and expansion
          detail: Product-usage and account signals can support renewal-risk detection and expansion plays.
          touchpoints:
            - Adoption signals
            - Renewal risk
            - Upsell support
        - label: Outcome verification
          detail: >-
            Public evidence offers selected productivity and adoption anecdotes but no retention or concentration
            cohort.
          touchpoints:
            - Peer ratings
            - Named-customer outcomes
            - Private-data diligence
    approximationNotes: >-
      The ordered journey is a synthesis of described workflows, not a measured conversion funnel; no stage conversion
      rates are inferred.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU012
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Public mitigations reduce some architectural risk, but evidence maturity leaves data authority, autonomous action,
      and dependency risks elevated.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Permission or context leakage
          values:
            - Low-medium
            - Critical
            - Described, not independently tested
            - High
        - label: Stale or misassigned signals
          values:
            - Medium
            - High
            - Testing framework published
            - Medium-high
        - label: Incorrect autonomous action
          values:
            - Medium
            - High
            - Approval paths not public
            - High
        - label: Warehouse / CRM dependency
          values:
            - Medium
            - High
            - Named integrations and partnership
            - Medium-high
        - label: Unproven enterprise ROI
          values:
            - Medium
            - High
            - Company claim plus small review sample
            - Medium-high
        - label: Usage-cost variability
          values:
            - Medium-high
            - Medium-high
            - Meter disclosed; current economics unclear
            - Medium-high
    approximationNotes: >-
      Qualitative analyst assessment based only on assigned public evidence; labels are not incident frequencies or
      quantified loss estimates.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The reported financing mark is filtered through the revenue denominator, product proof, market risk, and missing
      diligence before reaching a call.
    data:
      nodes:
        - id: reported-mark
          label: Reported mark
          detail: Approximately $1.2B in March 2026
        - id: revenue-anchor
          label: Revenue anchor
          detail: About $8M projected 2025 ARR, not verified current ARR
        - id: implied-multiple
          label: Price pressure
          detail: Approximately 150x the projected ARR denominator
        - id: product-proof
          label: Product proof
          detail: Databricks availability and favorable but limited user ratings
        - id: unresolved-economics
          label: Unresolved economics
          detail: Growth, retention, margin, burn, round proceeds, and preferences
        - id: recommendation
          label: Recommendation
          detail: Research more; high risk; valuation stretched
    approximationNotes: >-
      The flow is qualitative; it does not estimate an enterprise value or probability-weighted return from unavailable
      operating inputs.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
