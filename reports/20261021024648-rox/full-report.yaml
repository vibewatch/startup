        - Value resets materially below $1.2B and a down round can amplify dilution.
        - Customer concentration, renewal weakness, and crowded alternatives.
        - Missed ARR plan, weak cohorts, or senior financing preferences.
    notes: >-
      Scenario values are directional because the assigned evidence does not disclose verified current economics, round
      proceeds, or security terms.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
