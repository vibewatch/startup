company:
  name: Rox
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Rox is a 2024-founded, San Francisco-based private company selling warehouse-native
    revenue orchestration to large enterprises. Public evidence establishes a rapid
    product and financing trajectory, but round labeling, cumulative funding, recurring
    revenue, customer count, current headcount, board composition, and control terms
    remain conflicting or undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Rox operates through Rox Data Corp and is consistently described as a 2024-founded,
      San Francisco-headquartered private software company. Its product is a
      warehouse-native revenue orchestration layer: the platform assembles account
      context from authorized warehouse, CRM, communication, usage, billing, and
      third-party data, then assigns an agent to each account across pipeline generation,
      deal work, renewal, and expansion. That architecture makes Rox an engagement and
      automation layer rather than a clean replacement for the CRM, which the company's
      own technical explanation still calls the account and opportunity system of
      record. Gartner reports usage- and outcome-based pricing rather than conventional
      per-seat licensing, while Rox's release notes say its Teams product has unlimited
      seats and meters Agent Actions.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founder coverage, and governance
    body: >-
      Ishan Mukherjee is the founder-CEO and the clearest public key person. His disclosed
      background spans engineering, product, company formation, and go-to-market
      leadership, which aligns with Rox's attempt to join a technically demanding data
      architecture to an enterprise sales motion. Public profiles also identify Shriram
      Sridharan as co-founder and CTO, Avanika Narayan as a co-founder leading applied AI,
      and Diogo Ribeiro as a co-founder working directly with customers. This is broad
      functional coverage for an early company, but it is not a governance record:
      accessible sources do not provide a complete current executive roster, board
      membership, voting rights, succession plan, or a reconciled list of every founder.
      Underwriting should therefore treat founder dependence and formal oversight as
      open diligence items.
    claimRefs: [CO006, CO007]
    tableRefs: [TO002]
  - id: capital-scale-and-stakeholders
    title: Capital, scale, and stakeholder map
    body: >-
      The financing record is directionally clear but numerically untidy. Contemporary
      reporting identifies a Sequoia-led seed and a General Catalyst-led Series A, with
      GV also named among institutional investors. Tracxn describes a March 2026
      financing at a $1.2 billion post-money valuation as Series A, while another current
      company profile labels the March financing Series B. Cumulative funding is also
      unresolved: the accessible profiles variously show $50 million, $64 million-plus,
      and $78 million. Public operating scale is no cleaner. The only ARR values are
      third-party estimates for 2025, and headcount snapshots move from 71 in April to
      170 in August without a company-confirmed denominator or reconciliation. Those
      figures should not be converted into current revenue, cash available, or burn.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: execution-and-milestones
    title: Execution cadence and milestone interpretation
    body: >-
      Rox's observable execution signal is product breadth and shipping frequency rather
      than audited commercial performance. The company announced a Databricks
      partnership and general availability of its Built On Databricks solution in March
      2026, then documented governance, self-serve Teams, account-plan automation, and a
      Value App in dated release notes through October. The cadence supports the view
      that Rox is expanding from research and workflow assistance toward a broader
      revenue operating surface. It does not establish repeatable ROI or deployment
      simplicity: Rox's own notes qualify several metrics as estimates dependent on
      connected data, and a competitor comparison characterizes the enterprise product
      as setup-heavy. The principal milestone risk is therefore conversion of rapid
      feature delivery into durable, independently measured customer economics.
    claimRefs: [CO014, CO015, CO016]
    figureRefs: [FO001]
