callouts:
  - calloutType: risk
    title: Scale metrics are not underwriting-grade
    body: >-
      The $1.2 billion valuation is repeatedly reported, but round naming, cumulative
      funding, ARR, customers, and headcount are not reconciled by audited or
      company-confirmed current evidence. Treat these as diligence inputs, not a basis
      for deriving revenue multiples, runway, or cash availability.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
  - calloutType: insight
    title: Product velocity is visible; deployment effort is not
    body: >-
      Dated releases establish a fast expansion of the product surface, while a
      competitor describes Rox as setup-heavy. Validate implementation hours,
      data-mapping burden, approval controls, and time to independently measured value.
    claimRefs: [CO015, CO016]
