  topStrengths:
    - Warehouse-native account context and one-agent-per-account design address a concrete enterprise revenue workflow.
    - >-
      A generally available Databricks solution and frequent 2026 releases demonstrate product and partnership
      execution.
    - Early user evidence is favorable, although the public independent review sample remains small.
  topRisks:
    - >-
      The reported $1.2 billion valuation is approximately 150 times a projected 2025 ARR estimate rather than verified
      current revenue.
    - >-
      Autonomous customer-facing actions and broad enterprise-data access require independently tested permissions,
      approvals, auditability, and rollback controls.
    - >-
      Current ARR, retention, gross margin, burn, customer concentration, deployment burden, and contract economics are
      not publicly verified.
    - >-
      Round labeling, cumulative funding, headcount, financing proceeds, cap-table rights, and liquidation preferences
      remain conflicting or undisclosed.
  unresolvedGaps:
    - Verify current ARR, growth, NRR, GRR, gross margin, burn, runway, and cash after the latest financing.
    - >-
      Obtain enterprise ACV, services mix, implementation effort, contract duration, usage overages, and channel
      contribution.
    - >-
      Review the fully diluted cap table, financing proceeds, liquidation preferences, voting rights, dilution
      protections, and board composition.
    - >-
      Test customer concentration, renewal cohorts, permission boundaries, action approvals, audit logs, incident
      history, DPA terms, and subprocessors.
