  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: >-
        Latest-round proceeds, pre-money and post-money values, security type,
        liquidation preferences, option pool, and fully diluted ownership.
      whyItMatters: >-
        A headline valuation does not reveal dilution, preference overhang, or
        the economic price paid for the security.
      diligencePath: >-
        Review signed financing documents, the pro forma cap table, and the
        security-level waterfall with company counsel and the lead investor.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        Current ARR, recognized revenue, growth, gross and net retention, gross
        margin, burn, runway, services mix, and customer acquisition economics.
      whyItMatters: >-
        These inputs determine whether the reported revenue multiple can compress
        through growth without requiring repeated dilutive financing.
      diligencePath: >-
        Reconcile monthly management accounts, billing exports, cohort schedules,
        cash statements, and board reporting for the latest eighteen months.
      relatedQuestionRefs: [QV002, QV003, QV006]
    - type: missing-source
      severity: material
      topic: comparable-transactions
      missingEvidence: >-
        Directly comparable private rounds or acquisitions with matched growth,
        retention, margin, and revenue definitions.
      whyItMatters: >-
        Generic SaaS multiples are only a broad reference and do not establish a
        defensible Rox-specific valuation range.
      diligencePath: >-
        Commission a transaction-comps set normalized for stage, ARR definition,
        growth, retention, gross margin, and security terms.
      relatedQuestionRefs: [QV003]
    - type: private-evidence-only
      severity: material
      topic: customer-proof
      missingEvidence: >-
        Customer concentration, contract duration, renewal cohorts, expansion,
        implementation effort, realized ROI, and referenceable enterprise users.
      whyItMatters: >-
        Ten public ratings cannot establish revenue durability, deployment
        repeatability, or the breadth of commercial adoption.
      diligencePath: >-
        Review customer-level cohorts and conduct reference calls across new,
        renewing, expanded, and churned accounts.
      relatedQuestionRefs: [QV004, QV005, QV007]
