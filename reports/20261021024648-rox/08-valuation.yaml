          detail: "Databricks availability and favorable but limited user ratings"
        - id: unresolved-economics
          label: Unresolved economics
          detail: "Growth, retention, margin, burn, round proceeds, and preferences"
        - id: recommendation
          label: Recommendation
          detail: "Research more; high risk; valuation stretched"
    approximationNotes: >-
