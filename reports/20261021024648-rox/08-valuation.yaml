company:
  name: Rox
chapter:
  number: 8
  title: Valuation
  summary: >-
    Rox has current product and financing signal, but the reported $1.2 billion
    valuation is approximately 150 times a projected 2025 ARR figure rather than
    verified current revenue. The appropriate public-evidence posture is
    research-more with a stretched valuation stance until operating metrics,
    round economics, and preference terms can be diligenced.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is research-more, with medium confidence, high risk,
      and a stretched valuation stance. Independent reports place Rox at an
      approximately $1.2 billion valuation and describe roughly $8 million of
      projected 2025 ARR, implying about 150 times that projected denominator.
      This is not a conventional current-revenue underwriting anchor: the ARR
      figure was a projection attributed to deal sources, and the latest round's
      proceeds were not disclosed in the reviewed reports. Product momentum may
      justify a premium, but public evidence does not establish the growth,
      retention, margin, or cash profile needed to price that premium. Entry
      should therefore wait for data-room verification or materially better
      terms rather than treating the reported private mark as intrinsic value.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV014, CV016]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Rox is attacking a measurable enterprise workflow with
      a differentiated warehouse-native architecture, usage-linked pricing, and
      a generally available Databricks deployment. Gartner Peer Insights also
      shows favorable early sentiment. The anti-thesis is that proof remains
      narrow relative to the price: the review base is only ten ratings, larger
      alternatives have hundreds or more than one thousand ratings, and the
      market includes established revenue-intelligence vendors and well-funded
      AI-native entrants. Company-authored deployment and ROI assertions are
      useful product hypotheses, not independent validation of realized customer
      economics. The investment case changes only if verified cohort data shows
      durable expansion, attractive gross margin, and scalable deployment costs.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV015]
    tableRefs: [TV002]
  - id: scenario-underwriting
    title: Bull, base, and bear underwriting
    body: >-
      Scenario analysis must remain directional because current ARR, growth,
      retention, gross margin, burn, and preference terms are not publicly
      verified. In a bull case, ARR would need to be materially above the cited
      $8 million projection, supported by strong net retention and repeatable
      enterprise deployment, before a value above the reported $1.2 billion mark
      becomes defensible. The base case recognizes credible product signal but
      does not underwrite the current mark without operating proof. The bear case
      combines slower commercialization, intense competition, and multiple
      compression, creating down-round and dilution risk. No precise target
      return, hold period, or exit value is supportable from the assigned public
      evidence; those outputs require verified inputs rather than false precision.
    claimRefs: [CV002, CV003, CV004, CV009, CV010, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is early. The reported private valuation and investor
      participation demonstrate financing access, but they do not establish IPO
      readiness, strategic-buyer appetite, or cash available after the round.
      Diligence should request the latest cap table, security-level terms,
      liquidation preferences, fully diluted ownership, cash balance, burn,
      current ARR, growth, gross and net retention, gross margin, customer
      concentration, and services burden. Product diligence should test access
      controls, action approvals, implementation effort, and measured outcomes
      across representative customers. Thesis-break triggers are a material
      shortfall against the reported ARR projection, weak renewal or expansion
      cohorts, prolonged enterprise deployment, governance failures, or a
      financing that resets price while adding senior preferences.
    claimRefs: [CV005, CV008, CV009, CV011, CV014, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Assessment, Decision implication]
    rows:
      - [Recommendation, Research more, "Do not underwrite an entry until operating and financing terms are verified."]
      - [Confidence, Medium, "Multiple independent reports corroborate the mark, but core economics remain private."]
      - [Risk rating, High, "The valuation depends on rapid commercialization in a crowded category."]
      - [Valuation stance, Stretched, "The reported mark is approximately 150x projected 2025 ARR."]
      - [Entry discipline, Data-room gated, "Require current cohorts, margins, burn, cap table, and preference terms before pricing."]
    notes: >-
      Assessments use the reported $1.2 billion valuation and projected 2025 ARR;
      they are not a fairness opinion or a claim about current realized revenue.
    claimRefs: [CV001, CV002, CV003, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [View, Evidence, What would change the view]
    rows:
      - [Thesis, "Warehouse-native account context and a Databricks deployment create a differentiated enterprise workflow.", "Independent implementation evidence showing repeatable deployment and measurable customer ROI."]
      - [Thesis, "Usage- and outcome-based pricing can align spend with realized activity.", "Verified gross margin and expansion data showing the model scales economically."]
      - [Anti-thesis, "The reported valuation is approximately 150x projected 2025 ARR.", "Verified current ARR materially above the projection with durable growth and retention."]
      - [Anti-thesis, "Only ten Gartner Peer Insights ratings provide a narrow customer-proof sample.", "Broader referenceability, renewal cohorts, and concentration data across large enterprises."]
    notes: >-
      Company product and ROI statements are treated as claims to verify;
      Gartner ratings are a small observed sample rather than a population estimate.
    claimRefs: [CV003, CV007, CV008, CV009, CV010, CV011, CV012, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Verified current ARR is materially above $8M; retention and gross margin are strong; enterprise deployment is repeatable.", "A value above $1.2B may become defensible, but no precise range or target return is supportable before verification.", "Execution, model costs, governance, and competition.", "Multiple quarters of audited growth plus broad reference customers."]
      - [Base, "Product signal persists, but current economics and financing terms remain private.", "The $1.2B mark is not underwritable from public evidence; defer entry or seek materially better terms.", "Dilution, preference overhang, and slower commercialization.", "Current ARR, NRR, gross margin, burn, and cap-table disclosure."]
      - [Bear, "Growth misses the cited projection, deployments remain services-heavy, or category multiples compress.", "Value resets materially below $1.2B and a down round can amplify dilution.", "Customer concentration, renewal weakness, and crowded alternatives.", "Missed ARR plan, weak cohorts, or senior financing preferences."]
    notes: >-
      Scenario values are directional because the assigned evidence does not
      disclose verified current economics, round proceeds, or security terms.
    claimRefs: [CV002, CV003, CV004, CV009, CV010, CV013, CV014, CV015, CV016]
