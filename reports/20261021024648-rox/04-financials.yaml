schemaVersion: "report-v2"
artifact: financials
slug: rox
runDate: 2026-10-21
company:
  name: Rox
chapter:
  number: 4
  title: Financials
  summary: >-
    Rox appears to monetize through usage- and outcome-based software plans rather than
    conventional per-seat licensing, but public plan allowances conflict and enterprise
    pricing is undisclosed. The only scale marker in the assigned evidence is a reported
    projection of $8 million in 2025 ARR; realized revenue, margins, burn, cash, runway,
    retention, and sales efficiency remain unavailable for underwriting.
sections:
  - id: revenue-architecture
    title: Revenue architecture and monetization
    body: >-
      Public evidence points to a freemium SaaS model with usage and outcome metering,
      paid subscriptions, and custom enterprise contracts rather than a single per-seat
      tariff. The underlying commercial unit is an "Agent Action," while Rox positions
      one revenue agent per customer account and connects warehouse context to prospecting,
      deal management, and expansion workflows. That design can support several revenue
      streams, but it also ties monetization to workflow intensity and customer data
      readiness. Rox says enterprise deployment and training are included and claims a
      90-day return on investment; both are company assertions, and neither discloses the
      implementation labor, support burden, hosting cost, or gross-profit contribution
      required to deliver the outcome.
    claimRefs: [CI004, CI005, CI010, CI011, CI012]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-sales-efficiency
    title: Pricing transparency and sales-efficiency constraints
    body: >-
      Independent directories agree on a free entry point, a $50 monthly Core tier, and
      custom enterprise pricing, but they do not agree on included action allowances.
      The GTM Directory reports 1,000 free actions, while Prospeo reports 2,500 Starter
      actions and 5,000 Core actions. Prospeo also characterizes action metering as too
      opaque to budget confidently. These sources are not equivalent benchmarks:
      Prospeo sells a complementary data product and is classified as a competitor, while
      the directories rely partly on vendor material. The conflict prevents a reliable
      realized-price or gross-margin estimate. Public sources also omit ACV, discounts,
      contract duration, CAC, sales cycle, payback, channel share, and services attach,
      so the apparent low-cost entry tier should not be extrapolated to enterprise economics.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI002]
  - id: traction-and-revenue-quality
    title: Traction signal and revenue quality
    body: >-
      TechCrunch reported that Rox was projected, at the time of its financing, to close
      2025 with $8 million in ARR. This is the only public scale point in the assigned
      financial evidence, and it is a projection attributed to people familiar with the
      deal rather than a realized, audited, or management-filed result. Gartner Peer
      Insights shows a 4.7 rating from ten ratings, which provides a narrow adoption
      signal but no contract values, renewal cohorts, or representative customer sample.
      Prospeo separately reports zero G2 reviews; that statement concerns a different
      review venue and therefore does not negate Gartner's count. Revenue quality cannot
      be assessed without realized ARR, GAAP revenue, NRR, GRR, customer concentration,
      usage expansion, bad debt, and the split between recurring software and deployment
      services.
    claimRefs: [CI002, CI013, CI014, CI016]
  - id: capital-adequacy
    title: Capital adequacy and financial verdict
    body: >-
      TechCrunch reports a $1.2 billion financing valuation and Rox's prior announcement
      of $50 million in cumulative funding. Those figures establish investor support and
      valuation context, not current liquidity: funding raised is not cash available,
      and no assigned source discloses cash on hand, monthly net burn, debt, working
      capital, committed cloud spend, or runway. The economic verdict is therefore
      conditional. Usage-based monetization could align price with customer activity,
      but opaque units make budget predictability and realized gross margin hard to test;
      included enterprise enablement may aid adoption while increasing service-delivery
      cost. Underwriting should remain blocked on a monthly ARR bridge, cohort retention,
      gross-margin waterfall, CAC/payback by motion, services utilization, cash and debt
      schedules, and a downside runway plan tied to the next financing trigger.
    claimRefs: [CI001, CI003, CI009, CI010, CI011, CI015, CI016]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams and delivery obligations
    columns:
      - Stream
      - Mechanism
      - Commercial unit
      - Public status
      - Revenue-quality implication
      - Diligence ask
    rows:
      - [Free entry tier, Product-led acquisition, Agent Actions and limited capabilities, Publicly listed by third parties, No disclosed conversion or expansion data, Provide free-to-paid conversion and activation cohorts]
      - [Core subscription, Recurring monthly software plan, "$50 per month plus action allowance", Third-party listings agree on price but conflict on allowance, Recurrence is plausible but realized ARPU is unknown, Provide invoices and realized ARPU by cohort]
      - [Enterprise contracts, Custom paid plan, Features usage and outcomes, Pricing available on request, Contract value and renewal quality are undisclosed, Provide ACV term discount renewal and services schedules]
      - [Enterprise enablement, Deployment and training included by Rox, Service effort per implementation, Company says it is provided on us, Adoption support may create unmeasured delivery cost, Provide implementation hours utilization and services gross margin]
    notes: >-
      Public-source model as of 2026-10-21; plan descriptions are not evidence of
      realized pricing, recognized revenue, conversion, or margin, and null economics
      require the diligence asks shown.
    claimRefs: [CI004, CI005, CI010, CI011, CI012]
  - id: TI002
    title: Public pricing and metering evidence
    columns:
      - Item
      - Reported price
      - Reported allowance or unit
      - Evidence quality
      - Underwriting implication
    rows:
      - [Starter or free tier, "$0 per month", "1,000 actions per month per The GTM Directory", Independent directory drawing partly on public vendor material, Conflicts with Prospeo and cannot anchor conversion economics]
      - [Starter or free tier, "$0 per month", "2,500 actions per month per Prospeo", Competitor-authored review with estimated commentary, Treat allowance as disputed until contract evidence is obtained]
      - [Core tier, "$50 per month", "5,000 actions per month per Prospeo", Competitor-authored review; GTM Directory confirms price but not this allowance, Metered workflow cost and overage exposure remain uncertain]
      - [Enterprise tier, Contact sales, Custom features and usage, Multiple directories report custom pricing, ACV discounts contract duration and realized price are unavailable]
    notes: >-
      Prices and allowances are public list-level observations, not realized customer
      pricing; the action allowance conflict is preserved rather than reconciled.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [2025 ARR, "$8 million projected", Medium, Only public revenue-scale marker and not a realized result, Reconcile monthly ending ARR to contracts and billings]
      - [Gross margin, Not publicly disclosed, Unavailable, Tests software scalability versus agent compute and services cost, Provide GAAP and contribution margin by plan]
      - [Net revenue retention, Not publicly disclosed, Unavailable, Tests expansion durability under usage pricing, Provide monthly cohorts with gross and net retention]
      - [CAC and payback, Not publicly disclosed, Unavailable, Tests whether enterprise GTM can scale efficiently, Provide fully loaded CAC and payback by inbound outbound and partner motion]
      - [Cash burn and runway, Not publicly disclosed, Unavailable, Determines financing dependency and downside survival, Provide monthly cash debt commitments burn and board runway cases]
      - [Cumulative funding, "$50 million announced in November 2024", Medium, Historical capital raised does not establish current cash, Reconcile financing proceeds to current cash and cumulative operating use]
    notes: >-
      Values are public facts or explicit gaps as of 2026-10-21; funding is not treated
      as cash, projected ARR is not treated as realized revenue, and unavailable metrics
      are not estimated.
    claimRefs: [CI002, CI003, CI010, CI013, CI015, CI016]
figures:
  - id: FI001
    title: Customer activity to financial outcome bridge
    type: flow
    summary: >-
      Rox can connect account activity to metered software usage, but public evidence
      stops before realized revenue, delivery cost, and gross profit.
    data:
      nodes:
        - id: customer-signals
          label: Customer and account signals
          detail: CRM warehouse product billing and external context feed the account model.
        - id: context-graph
          label: Revenue-specific context graph
          detail: Rox says the graph maintains account understanding across the lifecycle.
        - id: account-agent
          label: One revenue agent per account
          detail: The agent interprets context and supports configured revenue motions.
        - id: workflow-execution
          label: Workflow execution
          detail: Research outreach CRM updates deal work and expansion can consume actions.
        - id: agent-actions
          label: Metered Agent Actions
          detail: Public sources describe usage and outcome pricing but disagree on allowances.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Realized price discounts overages and services mix are not publicly disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Compute data support and enablement costs are unavailable.
    approximationNotes: >-
      Conceptual sequence from public product and pricing descriptions; it is not a
      proportional funnel, revenue forecast, conversion model, or cumulative waterfall.
    claimRefs: [CI004, CI009, CI012]
callouts:
  - calloutType: risk
    title: The public evidence does not support a runway conclusion
    body: >-
      Cumulative funding and a private-round valuation cannot substitute for current
      cash, burn, debt, or committed spend. Obtain a cash roll-forward and board-approved
      operating plan before drawing a capital-adequacy conclusion.
    claimRefs: [CI001, CI003, CI015]
