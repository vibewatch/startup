      diligencePath: Request CRM opportunity cohorts, signed-order samples, commission data, and fully loaded CAC and payback schedules by channel.
      relatedQuestionRefs: [QI004]
      relatedTableRefs: [TI002, TI003]
    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: Revenue recognition policy and direct compute, data, implementation, support, and third-party model costs by plan.
      whyItMatters: Usage growth can increase both revenue and delivery cost, so gross-profit scalability cannot be inferred from ARR alone.
      diligencePath: Obtain audited or management P&L detail and a contribution-margin bridge by product tier and customer cohort.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI001, TI003]
    - type: private-evidence-only
