figures:
  - id: FM001
    title: Evidence-constrained market-sizing ladder
    type: pyramid
    summary: >-
      Public evidence narrows from a named enterprise cohort to limited adoption and
      outcome proxies, without establishing a dollar TAM, SAM, or SOM.
    data:
      items:
        - label: Named target cohort
          value: Global 2000
          unit: enterprises
          detail: Company positioning; not a count of qualified or reachable buyers.
          claimRefs: [CM001]
        - label: Private-beta adoption
          value: "35+"
          unit: revenue teams
          detail: Partner-reported in 2024; customer and contract denominator unavailable.
          claimRefs: [CM011]
        - label: Gartner review sample
          value: 10
          unit: ratings
          detail: Small 2026 review sample; not a penetration estimate.
          claimRefs: [CM015]
        - label: Time reclaimed
          value: 8
          valueNote: More than eight
          unit: hours per account executive per week
          detail: Sequoia-reported customer outcome without disclosed measurement design.
          claimRefs: [CM012]
        - label: Customer activity uplift
          value: 35
          valueNote: More than 35%
          unit: percent
          detail: Sequoia-reported outcome; baseline and cohort denominator unavailable.
          claimRefs: [CM013]
        - label: Claimed ROI horizon
          value: 90
          unit: days
          detail: Company claim for large organizations without a disclosed calculation.
          claimRefs: [CM010]
    approximationNotes: >-
      This is an evidence ladder, not a value-proportional TAM/SAM/SOM pyramid. Items
      retain unlike source units, are not additive, and are ordered from broad target
      cohort to narrower adoption or outcome evidence.
    claimRefs: [CM001, CM010, CM011, CM012, CM013, CM014, CM015]
callouts:
  - calloutType: risk
    title: Market size remains an underwriting gap
    body: >-
      Do not capitalize the Global 2000 label or early outcome claims as TAM. Require
      paid-account counts, ACV distribution, implementation revenue, renewal cohorts,
      and independently attributable pipeline outcomes before using a revenue multiple.
    claimRefs: [CM001, CM010, CM011, CM012, CM013, CM014, CM015]
