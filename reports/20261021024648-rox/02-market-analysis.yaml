        - CRO, VP Sales, or RevOps
        - Core market boundary
      - - CRM-native agents
        - Native workflow automation and seller assistance
        - Unrelated CRM administration
        - Sales operations and CRM leadership
        - Adjacent substitute with lower integration friction
      - - Contact and intent data
        - Data feeds used by Rox workflows
        - Data-provider spend not attributable to orchestration
        - Demand generation or sales operations
        - Complement and input rather than Rox's core market
      - - Internal agent build
        - Engineering and RevOps labor for custom workflows
        - General AI experimentation outside revenue workflows
        - CIO, data leadership, and revenue operations
        - Build alternative and status-quo extension
      - - Manual seller workflow
