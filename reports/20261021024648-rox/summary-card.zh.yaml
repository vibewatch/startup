  topStrengths:
    - 原生于数据仓库的账户上下文，以及每个账户配置一个智能体的设计，切中了企业收入流程中的具体环节。
    - 已正式商用的 Databricks 解决方案，以及 2026 年频繁发布的版本，显示出产品和合作伙伴执行力。
    - 早期用户证据偏正面，但公开的独立评测样本仍然很小。
  topRisks:
    - 据报道的 $1.2 billion 估值约为预计 2025 年 ARR 的 150 times，而非经核实的当前收入倍数。
    - 面向客户的自主操作和广泛的企业数据访问，需要经过独立测试的权限、审批、可审计性和回滚控制。
    - 当前 ARR、留存、毛利率、烧钱速度、客户集中度、部署负担和合同经济性均未获公开核实。
    - 轮次标注、累计融资、员工数、融资所得、股权结构表权利和清算优先权仍存在冲突或尚未披露。
  unresolvedGaps:
    - 核实当前 ARR、增长、NRR、GRR、毛利率、烧钱速度、现金跑道，以及最新融资后的现金余额。
    - 获取企业 ACV、服务收入构成、实施投入、合同期限、用量超额费用和渠道贡献。
    - 审阅完全摊薄后的股权结构表、融资所得、清算优先权、投票权、反稀释保护和董事会构成。
    - 测试客户集中度、续约队列、权限边界、操作审批、审计日志、事故历史、DPA 条款和子处理方。
