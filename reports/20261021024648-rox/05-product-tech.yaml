    columns:
      - User job
      - Current friction
      - Rox workflow
      - Public benefit signal
      - Limitation
    rows:
      - ["Research a target account", "Data is spread across CRM, email, meetings, and public sources", "Retrieve connected account context and produce an account summary", "A displayed peer review reports significant research and targeting time savings", "One visible review does not establish population-level productivity"]
      - ["Prepare and follow up on meetings", "Reps reconstruct context and next steps manually", "Use meeting context, produce briefs or editable drafts, and continue the workflow", "Structured outputs are documented", "No public factuality or transcription-error rate"]
      - ["Keep opportunity records current", "Activity and commercial context become fragmented", "Use supported tools to work with opportunity records", "CRM write-back is part of the described flow", "Available actions depend on integrations and permissions"]
      - ["Run pipeline and expansion motions", "Signals do not automatically become owned actions", "Relate signals to accounts and configured workflows", "Lifecycle coverage extends through renewal and expansion", "No independent conversion or revenue-lift benchmark in the assigned pool"]
      - ["Deploy on enterprise data", "Customer context already resides in warehouse and GTM systems", "Use sharing or replication and integrate collaboration and CRM surfaces", "Databricks solution is described as generally available", "Implementation effort and data readiness remain customer-specific"]
    notes: >-
      Benefits are qualitative unless explicitly attributed to the single displayed peer
      review; company ROI statements are not treated as independently measured outcomes.
    claimRefs: [CE004, CE005, CE008, CE011, CE012]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Documented role
      - Key dependency
      - Underwriting risk
    rows:
      - [Connected sources, "Supply CRM, email, meeting, document, warehouse, and public data", "Connector availability and source permissions", "Incomplete or stale source data can distort account context"]
      - [System of Context, "Organize entities and activity around accounts, people, opportunities, and interactions", "Entity resolution, relationships, and source mappings", "Mis-resolution can attach signals to the wrong person or account"]
      - [Retrieval, "Select context using account, participant, time, task, and relevance", "Index freshness and retrieval quality", "No public precision, recall, or latency benchmark"]
      - [Revenue agent and tools, "Generate answers and invoke supported actions", "Model behavior, tool permissions, and workflow configuration", "Autonomous errors can propagate into customer-facing work"]
      - [Applications and integrations, "Expose research, sequences, opportunities, conversations, and meeting workflows", "Web, Mac, CRM, and communication surfaces", "Feature and write-back behavior varies by connected system"]
      - [Governance and access, "Combine resource, record, and field permissions with administrative policy", "Correct Pods, hierarchy, Permission Set, and provenance configuration", "Configuration mistakes can expose or modify inappropriate data"]
    notes: >-
      Architecture roles are based on Rox documentation; risk statements are diligence
      implications, not evidence that a failure or security incident has occurred.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE015]
figures:
  - id: FE001
    title: Control-bound data-to-action stack
    type: stack
    summary: >-
      Six documented layers show how connected data becomes a reviewable or executable
      revenue workflow, with permissions and freshness constraining every downstream step.
    data:
      layers:
        - label: Connected enterprise and public sources
          detail: CRM, email, meetings, documents, warehouse data, and public information.
          items:
            - Source availability
            - Source permissions
            - Source freshness
        - label: System of Context
          detail: Accounts, people, opportunities, and interactions are connected.
          items:
            - Entity resolution
            - Relationships
            - Source mappings
        - label: Context retrieval
          detail: Relevant information is selected for an account, task, participants, and time period.
          items:
            - Relevance scoring
            - Task scope
            - Temporal context
        - label: Revenue agent and tools
          detail: The agent produces answers or invokes supported tools.
          items:
            - Account summary
            - Email draft
            - Record action
        - label: Applications and workflows
          detail: Users inspect and use outputs in Rox and connected systems.
          items:
            - Web application
            - Rox for Mac
            - CRM and communication integrations
        - label: Governance and access
          detail: Resource, record, and field permissions bound visibility and actions.
          items:
            - Permission Sets
            - Access Provenance
            - Administrative configuration
    approximationNotes: >-
      The layer order is an analytical rendering of documented components, not a latency,
      throughput, or deployment-topology measurement.
    claimRefs: [CE002, CE004, CE005, CE006, CE007, CE009]
callouts:
  - calloutType: strength
    title: Coherent account-centered architecture
    body: >-
      The strongest product thesis is continuity: one account context can support
      prospecting, deal work, renewal, and expansion rather than restarting from a
      disconnected point tool at each stage.
    claimRefs: [CE002, CE009]
  - calloutType: risk
    title: Public proof trails product breadth
    body: >-
      The assigned evidence describes many modules and controls but does not disclose
      technical SLAs, incident history, model evaluations, connector reliability, or
      independently audited control artifacts.
    claimRefs: [CE010, CE012, CE015]
