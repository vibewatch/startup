  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Public uptime SLA, status history, incident log, connector reliability, and recovery metrics.
      whyItMatters: Autonomous revenue workflows can create operational or customer-facing errors when data or integrations fail.
      diligencePath: Request 12 months of status and incident records, contractual SLAs, recovery objectives, and connector-level error reports.
      relatedQuestionRefs: [QE004, QE008]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Independent SOC reports, penetration-test summary, DPA, subprocessor list, data-retention policy, and security incident history.
      whyItMatters: Marketing and directory statements do not establish that controls operate effectively for the proposed deployment.
      diligencePath: Review the current trust-center package under NDA and map controls to the buyer's data flows and permission model.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: model-quality
      missingEvidence: Evaluations for retrieval accuracy, entity resolution, hallucination, prompt injection, and unsafe tool actions.
      whyItMatters: Errors in account identity or recommended actions can propagate into CRM records and external communication.
      diligencePath: Run a representative red-team and golden-set evaluation using approved test accounts, conflicting signals, and restricted fields.
      relatedQuestionRefs: [QE003, QE008]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public repository activity, package releases, API changelog, developer-community usage, or a comparable practitioner signal.
      whyItMatters: The assigned evidence describes a closed-source product and does not provide an external signal of engineering cadence or ecosystem adoption.
      diligencePath: Request API and connector changelogs, release cadence, deprecation policy, and practitioner references from integration owners.
      relatedQuestionRefs: [QE002, QE004]
