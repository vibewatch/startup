company:
  name: "Rox"
chapter:
  number: 7
  title: "Risks"
  summary: "Rox's central underwriting risk is not a documented adverse event but the combination of autonomous customer-facing action, broad enterprise-data access, and controls that public materials describe without independently demonstrating. The risk posture remains high until a production pilot proves permission boundaries, action approvals, signal quality, integration resilience, measurable ROI, and bounded usage economics."
sections:
  - id: "governance-regulatory-and-legal"
    title: "Governance, regulatory, and legal exposure"
    body: >-
      Rox's warehouse-native design can widen the context available to an account agent, but Rox itself cautions that connected sources, entity matching, signal freshness, and authorization remain deployment decisions. The company also distinguishes an agent's ability to retrieve information from its authority to act, while its public product description says approval paths should be confirmed for the intended deployment. That makes privacy, access control, record provenance, communications compliance, and auditability the first diligence tier rather than solved properties of the architecture. The assigned evidence set contains no regulator, court, incident-response, or IP-office record establishing Rox's current enforcement, litigation, breach, or dispute history. This is an evidence gap, not evidence that no incident or dispute exists.
    claimRefs: [CR001, CR002, CR003, CR004, CR014, CR016]
    tableRefs: [TR001]
  - id: "operational-quality-and-security"
    title: "Operational, quality, and security execution"
    body: >-
      The most consequential operating failure would be a plausible but wrong action: stale usage treated as current, a signal attached to the wrong subsidiary, restricted context disclosed to an unauthorized user, or outreach launched without the right review. Rox's own evaluation framework names these failure modes, and an independent RevOps source warns that unmonitored autonomous agents can scale mistakes. Public customer evidence is encouraging but thin: Gartner Peer Insights displayed a 4.7 rating from ten ratings and one visible reviewer described significant time savings. That sample does not establish enterprise-wide accuracy, reliability, incident rates, or durable ROI. Rox also claims ROI within 90 days, but the assigned source provides no cohort, denominator, baseline, or measurement method.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR012, CR013]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: "platform-and-partner-dependencies"
    title: "Platform, partner, and system dependencies"
    body: >-
      Rox's value proposition depends on reliable access to customer warehouses, CRMs, communication systems, and external signals. The Databricks launch adds a credible distribution and deployment path, but it also makes partner compatibility, shared support ownership, and data-platform change management part of the operating risk. Current public positioning is not fully consistent: Rox says the CRM remains the commercial system of record, while a competitor frames the product as a stack-replacement bet and Rox's own comparison article says Salesforce or HubSpot is a required foundation. This ambiguity can lengthen procurement and implementation because buyers must determine whether Rox augments, consolidates, or displaces their existing stack. Closed-source delivery further raises the importance of contractual audit, export, continuity, and exit rights.
    claimRefs: [CR007, CR008, CR011, CR014, CR015]
    tableRefs: [TR003]
  - id: "financial-model-and-decision-triggers"
    title: "Financial model risk and thesis-break triggers"
    body: >-
      Usage-based Agent Actions align price with activity, but they can make gross customer cost sensitive to workflow design, model intensity, and adoption. Two 2026 pages report different self-serve prices and action allowances; that may reflect a product change rather than an error, but it means current contract economics cannot be underwritten from public pages alone. The investment case should therefore rely on a bounded production pilot with pre-agreed baselines for action accuracy, human-review load, CRM writeback error, qualified pipeline contribution, and total cost per accepted outcome. A thesis break is failure to preserve least-privilege access, repeated unauthorized or materially incorrect external actions, inability to export account context and audit logs, or a pilot that cannot demonstrate measurable benefit after including implementation and oversight cost.
    claimRefs: [CR009, CR010, CR012, CR016]
callouts:
  - calloutType: "risk"
    title: "Primary thesis-break test"
    body: "Do not scale beyond a bounded pilot if Rox cannot demonstrate least-privilege retrieval, explicit action authority, reversible CRM writeback, complete audit logs, and accountable human handoffs on the buyer's real permission model."
    claimRefs: [CR001, CR002, CR003, CR004]
  - calloutType: "recommendation"
    title: "Investment implication"
    body: "Treat security, reliability, legal history, and unit economics as private-evidence gates; public product claims and a ten-rating review sample are not sufficient to retire these risks."
    claimRefs: [CR005, CR010, CR012, CR016]
