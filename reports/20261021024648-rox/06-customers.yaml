      - Value
      - Date / period
      - Source quality
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - ["Gartner Peer Insights rating", "4.7/5 from 10 ratings", "Observed on 2026-10-21; one visible review dated 2026-07-27", "Independent review platform", "Medium", "Positive current user signal", "Small sample; reviewer mix and retention behavior unavailable"]
      - ["Ramp deployment", "66 sellers in Rox", "Reported 2024-11-26", "Independent article quoting a named Ramp executive", "Medium", "Evidence of deployment beyond a single-user test", "Total eligible seats, usage frequency, and contract scope unavailable"]
      - ["Public beta onboarding", "More than 1,000 companies", "Reported 2024-11-26", "Independent article based on company access", "Medium", "Broad top-of-funnel trial interest at launch", "Not a paid, active, or retained customer count"]
      - ["Ramp preparation time", "90% reduction", "Attributed in a 2026 competitor comparison", "Competitor-issued comparison", "Low", "Potentially material seller-productivity benefit", "Original study, baseline, sample, and period not reproduced"]
      - ["Couchbase adoption", "90%+ across 250+ global reps", "Attributed in a 2026 competitor comparison", "Competitor-issued comparison", "Low", "Suggests potential organization-wide rollout", "Production status, active-use definition, period, and original source unavailable"]
      - ["Bynder closed ARR", "2.5x monthly closed ARR among strategic account managers", "Attributed in a 2026 competitor comparison", "Competitor-issued comparison", "Low", "Points to possible revenue impact in a defined seller group", "Not company-wide ARR; baseline, sample, causality, and original source unavailable"]
    notes: "Values preserve each source's metric and denominator; beta companies are not treated as customers, and competitor-attributed outcomes are not independently verified."
    claimRefs: [CU007, CU008, CU010, CU011, CU013, CU014, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Public outcome
      - Limitation
    rows:
      - ["Ramp", "Fintech / high-velocity B2B sales", "Account research, seller preparation, customer-account management", "Historical reporting describes a pilot that expanded to 66 sellers", "Named executives described substantial time savings and positive seller feedback; a competitor page attributes a 90% prep-time reduction", "Evidence is largely from 2024 or competitor-attributed; current scope, renewal, and causal measurement are unknown"]
      - ["MongoDB", "Enterprise software / database", "Named as an early Rox customer", "Roster evidence only; production status not disclosed", null, "No public deployment size, outcome, contract term, or renewal evidence in the retained set"]
      - ["New Relic", "Enterprise software / observability", "Named repeatedly as a Rox customer", "Roster evidence only; production status not disclosed", null, "Founder relationship may aid access; no public deployment scope or measured outcome"]
      - ["OpenAI", "AI platform", "Named as an early Rox customer", "Roster evidence only; production status not disclosed", null, "No public buyer, user count, workflow, outcome, contract term, or renewal evidence"]
    notes: "Partial enumeration of named accounts found in the assigned evidence pool; a logo or roster reference is not treated as proof of current production use, retention, or revenue."
    enumerationScope:
      coverage: sample
      basis: "Named accounts repeated across the assigned successful source pool through 2026-10-21."
    claimRefs: [CU009, CU010, CU013]
figures:
  - id: FU001
    title: Evidence-backed customer journey and expansion loop
    type: journey-map
    summary: >-
      Rox moves from enterprise qualification and account context into pipeline, deal,
      renewal, and expansion workflows, but public durability evidence stops before renewal
      and cohort economics.
    data:
      nodes:
        - label: Enterprise qualification
          detail: "Target organizations have complex B2B revenue teams and mature warehouse data."
          touchpoints: ["Global 2000 positioning", "Revenue and data leadership", "Warehouse readiness"]
        - label: Account context
          detail: "A dedicated account agent assembles permitted CRM, warehouse, product, billing, and external signals."
          touchpoints: ["Data connections", "Identity resolution", "Permission controls"]
        - label: Pipeline generation
          detail: "Research, account prioritization, personalized outreach, and inbound routing create or qualify opportunities."
          touchpoints: ["Research", "Buying signals", "Personalized outreach"]
        - label: Deal execution
          detail: "The system supports meeting preparation, deal monitoring, CRM updates, and next actions."
          touchpoints: ["Meeting briefs", "Risk monitoring", "Opportunity management"]
        - label: Renewal and expansion
          detail: "Product-usage and account signals can support renewal-risk detection and expansion plays."
          touchpoints: ["Adoption signals", "Renewal risk", "Upsell support"]
        - label: Outcome verification
          detail: "Public evidence offers selected productivity and adoption anecdotes but no retention or concentration cohort."
          touchpoints: ["Peer ratings", "Named-customer outcomes", "Private-data diligence"]
    approximationNotes: "The ordered journey is a synthesis of described workflows, not a measured conversion funnel; no stage conversion rates are inferred."
    claimRefs: [CU003, CU005, CU006, CU012]
callouts:
  - calloutType: risk
    title: Adoption evidence does not yet prove revenue durability
    body: >-
      Current peer-review and named-deployment signals support product use, but public
      sources do not disclose retention, renewal, contract length, concentration, or
      cohort economics. Competitor-attributed customer outcomes should be verified against
      original customer records before underwriting.
    claimRefs: [CU007, CU010, CU012, CU013, CU014, CU015]
