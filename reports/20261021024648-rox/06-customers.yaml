      - ["Warehouse-first enterprises", "Revenue-data and data-platform leaders", "Sellers, sales operations, and data teams", "Uses Snowflake, Databricks, or BigQuery context; one agent per account", "Fits organizations with rich account data and governance needs", "No deployment effort, services mix, or warehouse-specific retention data"]
      - ["Tech-forward B2B companies", "Sales and growth executives", "High-volume or strategic sellers", "Repeated customer references include Ramp, MongoDB, New Relic, and OpenAI", "Reference value and demanding early-user feedback", "Most named accounts lack public production scope and outcomes"]
