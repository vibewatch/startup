evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, voting rights, executive remit, succession plan, founder vesting, and a reconciled founder
      list.
    whyItMatters: Formal control and key-person concentration cannot be underwritten from public biographies.
    diligencePath: >-
      Request the charter, bylaws, board minutes, organization chart, founder employment agreements, and key-person
      continuity plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Financing documents reconciling round labels, proceeds, debt, secondaries, investor rights, dilution, and current
      fully diluted ownership.
    whyItMatters: >-
      Public funding totals and stage labels conflict, and capital raised cannot establish cash available or preference
      overhang.
    diligencePath: >-
      Obtain the fully diluted cap table, stock purchase agreements, debt schedule, secondary records, and latest
      board-approved capitalization.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: >-
      Audited or management-certified current ARR, recognized revenue, paying customers, active deployments, headcount,
      margins, burn, and runway.
    whyItMatters: Public estimates cannot support growth, efficiency, valuation-multiple, or liquidity conclusions.
    diligencePath: >-
      Request monthly financials, ARR bridge, customer and contract export, payroll roster, cash statement, and board
      plan through the latest month.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      Credible category revenue, CAGR, geography, buyer counts, ACV distribution, implementation mix, and
      attainable-share evidence for Rox's precise market.
    whyItMatters: >-
      Without these inputs, neither top-down TAM/SAM/SOM nor bottom-up serviceable revenue can be underwritten without
      false precision.
    diligencePath: >-
      Obtain management's account-level market model and triangulate it against independent analyst category
      definitions, public peer disclosures, and a customer-by-customer reachable-account sample.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Enterprise ACV, usage and outcome fee mechanics, implementation charges, contract duration, discounting, expansion
      pricing, and the paying cost center.
    whyItMatters: The pricing label alone cannot establish willingness to pay, sales efficiency, or a bottom-up serviceable market.
    diligencePath: >-
      Review anonymized order forms, cohort-level ACV, discount and expansion data, and interview finance, RevOps, and
      procurement stakeholders at reference customers.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: outcome-validation
    missingEvidence: >-
      Independent definitions, baselines, samples, measurement periods, and denominators for the 90-day ROI, time-saved,
      activity, and pipeline claims.
    whyItMatters: Company and investor claims can indicate demand but do not establish causal, repeatable economics or retention.
    diligencePath: >-
      Recalculate outcomes from customer CRM and finance exports, compare against a pre-deployment baseline, and
      reconcile attributed pipeline with closed revenue.
    relatedQuestionRefs:
      - QM008
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Current enterprise quotes, action-consumption rules, overage terms, discounting, implementation charges, contract
      duration, and realized total cost.
    whyItMatters: >-
      Public self-serve prices cannot establish enterprise cost or comparability with seat-based and annual-contract
      alternatives.
    diligencePath: >-
      Obtain a current enterprise order form and price a controlled production workflow against Gong or Clari, Salesloft
      or Outreach, and Agentforce.
    relatedQuestionRefs:
      - QP004
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Independent win-loss data, displacement records, renewal rates, multi-homing prevalence, implementation duration,
      and measured workflow accuracy by competitor.
    whyItMatters: >-
      Feature descriptions and review counts do not establish switching cost, durable differentiation, or superior
      production outcomes.
    diligencePath: >-
      Request anonymized win-loss cohorts and interview reference customers that tested Rox against an incumbent and an
      internal-build option.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: conflicting-data
    severity: minor
    topic: pricing
    missingEvidence: A current first-party pricing schedule resolving whether Starter includes 2,000 or 2,500 monthly actions.
    whyItMatters: >-
      The conflict is small for underwriting but demonstrates that third-party pricing snapshots can become stale or
      disagree.
    diligencePath: Verify the live Rox pricing page or a dated quote before modeling pilot capacity.
    relatedQuestionRefs:
      - QP004
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Enterprise ACV, discounting, contract duration, sales cycle, CAC, payback, and channel contribution by motion.
    whyItMatters: These inputs determine whether enterprise acquisition can scale without consuming disproportionate capital.
    diligencePath: >-
      Request CRM opportunity cohorts, signed-order samples, commission data, and fully loaded CAC and payback schedules
      by channel.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Revenue recognition policy and direct compute, data, implementation, support, and third-party model costs by plan.
    whyItMatters: >-
      Usage growth can increase both revenue and delivery cost, so gross-profit scalability cannot be inferred from ARR
      alone.
    diligencePath: Obtain audited or management P&L detail and a contribution-margin bridge by product tier and customer cohort.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Realized ARR, GAAP revenue, billings, NRR, GRR, churn, expansion, customer concentration, and services mix.
    whyItMatters: A financing-time projection cannot establish current recurring revenue quality or durability.
    diligencePath: Reconcile monthly contracts, invoices, deferred revenue, and cohort retention to the general ledger.
    relatedQuestionRefs:
      - QI006
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, net burn, debt and credit obligations, committed spend, board plan, runway, and next-round trigger.
    whyItMatters: Historical funding raised cannot determine present liquidity or financing dependency.
    diligencePath: Review bank statements, debt documents, monthly cash roll-forward, board budget, and downside runway cases.
    relatedQuestionRefs:
      - QI007
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Public uptime SLA, status history, incident log, connector reliability, and recovery metrics.
    whyItMatters: Autonomous revenue workflows can create operational or customer-facing errors when data or integrations fail.
    diligencePath: >-
      Request 12 months of status and incident records, contractual SLAs, recovery objectives, and connector-level error
      reports.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Independent SOC reports, penetration-test summary, DPA, subprocessor list, data-retention policy, and security
      incident history.
    whyItMatters: Marketing and directory statements do not establish that controls operate effectively for the proposed deployment.
    diligencePath: Review the current trust-center package under NDA and map controls to the buyer's data flows and permission model.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: model-quality
    missingEvidence: Evaluations for retrieval accuracy, entity resolution, hallucination, prompt injection, and unsafe tool actions.
    whyItMatters: Errors in account identity or recommended actions can propagate into CRM records and external communication.
    diligencePath: >-
      Run a representative red-team and golden-set evaluation using approved test accounts, conflicting signals, and
      restricted fields.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, package releases, API changelog, developer-community usage, or a comparable
      practitioner signal.
    whyItMatters: >-
      The assigned evidence describes a closed-source product and does not provide an external signal of engineering
      cadence or ecosystem adoption.
    diligencePath: >-
      Request API and connector changelogs, release cadence, deprecation policy, and practitioner references from
      integration owners.
    relatedQuestionRefs:
      - QE002
      - QE004
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Current NRR, GRR, logo churn, renewal rates, renewal cohorts, and contract-duration distributions.
    whyItMatters: Workflow adoption and positive reviews do not establish recurring-revenue durability or switching costs.
    diligencePath: >-
      Request anonymized monthly customer cohorts, renewal schedules, gross and net retention calculations, and the ten
      largest churn or contraction cases.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Paid customer count, top-1 and top-10 revenue shares, segment ACV, services mix, channel contribution, and
      expansion revenue by cohort.
    whyItMatters: A small named roster and a few outcome anecdotes cannot rule out customer or partner concentration.
    diligencePath: >-
      Reconcile the customer master to invoicing, rank customers by trailing-twelve-month revenue, and separate
      subscription, usage, and services revenue.
    relatedQuestionRefs:
      - QU005
      - QU006
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Current production status, deployment dates, licensed and active users, measured outcomes, and renewal status for
      named customers beyond Ramp.
    whyItMatters: >-
      Public roster references may represent pilots, historical use, partnerships, or limited deployments rather than
      durable production customers.
    diligencePath: >-
      Obtain customer contracts and usage logs, then conduct reference calls with at least three named accounts,
      including one renewed and one expanded account.
    relatedQuestionRefs:
      - QU003
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-incident-history
    missingEvidence: >-
      Primary regulator, court, incident-response, insurance, and IP records establishing Rox's legal and security
      history.
    whyItMatters: >-
      Undisclosed proceedings, breaches, claims, or ownership disputes could change the residual risk and investment
      decision.
    diligencePath: >-
      Obtain a management and counsel schedule, search relevant court and regulator systems, review the incident
