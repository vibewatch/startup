    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: data-governance
    missingEvidence: >-
      Deployment-specific DPA, subprocessor list, retention map, permission model, audit logs, approval matrix,
