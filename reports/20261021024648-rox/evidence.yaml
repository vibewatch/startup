    diligencePath: >-
      Run a control-room demonstration against representative regional and business-unit permissions, including
      denied-access, rollback, and audit-log tests.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR007
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: product-reliability
    missingEvidence: >-
      Production error rates, uptime and incident history, customer cohorts, renewal evidence, and ROI calculations with
