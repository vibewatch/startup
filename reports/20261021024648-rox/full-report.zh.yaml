      - number: '5.3'
        title: 部署、治理与可靠性
        blocks:
          - type: paragraph
            body: >-
              部署取决于企业数据是否准备就绪。Rox 同时记录了原生数据仓库共享，以及复制到 Rox 管理环境的方案；独立 RevOps 资料则认为实施复杂度高，达到首次价值需以周计。公司 2026 年 3 月公告称，基于
              Databricks 构建的 方案已正式可用并运行在客户湖仓上。治理通过资源、记录和字段权限实现，并可通过 Pods、层级、Permission Sets 和 Access Provenance
              进一步配置。这些控制方向合理，但指定证据中的第三方认证说法没有审计报告、 trust center 材料、DPA、子处理商清单或事故记录佐证。
