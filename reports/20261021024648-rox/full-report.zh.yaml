        title: 定价透明度与销售效率约束
        blocks:
          - type: paragraph
            body: >-
              独立目录都确认有免费入口、每月 $50 的 Core 层和定制企业定价，但对包含的 action 配额说法不一。GTM Directory 报道免费层含 1,000 次 action，Prospeo 则称
              Starter 层含 2,500 次、Core 层含 5,000 次。Prospeo 还认为 action 计量过于不透明，难以据此做可靠预算。这些来源并非同等基准：Prospeo 销售互补型数据产品，
              并被归为竞争对手，而这些目录部分依赖厂商材料。              相互冲突的口径无法支持可靠的实际价格或毛利率估算。公开来源也没有披露
              ACV、折扣、合同期限、CAC、销售周期、回本期、渠道占比和服务附加率，因此不能把看似低价的入门层 外推为企业经济性。
