      - 估值与回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 经核实的当前 ARR 显著高于 $8M；留存与毛利率强劲；企业部署可重复。
        - 估值高于 $1.2B 可能变得有依据，但核实前无法支持精确区间或目标回报。
        - 执行、模型成本、治理与竞争。
        - 多个季度经审计的增长，加上广泛的客户背书。
      - - 基准
        - 产品信号仍在，但当前经济数据与融资条款仍属私人信息。
        - 公开证据不足以支撑 $1.2B 估值；推迟入场或争取明显更优条款。
        - 稀释、优先权负担与商业化放缓。
        - 当前 ARR、NRR、毛利率、现金消耗与股权结构披露。
      - - 悲观
        - 增长不及引用的预测、部署仍高度依赖服务，或赛道倍数压缩。
        - 估值大幅跌至 $1.2B 以下，下轮融资可能放大稀释。
        - 客户集中度、续约疲弱与拥挤的替代方案。
        - ARR 计划未达成、客户队列疲弱或高级融资优先权。
    notes: 情景估值仅指方向，因为指定证据没有披露经核实的当前经济数据、融资所得或证券条款。
