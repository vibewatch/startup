        - label: AI 原生 CRM 新进入者
          x: 4
          'y': 2
          detail: 追求广泛替代，但迁移要求更重。
        - label: 内部自建
          x: 2
          'y': 4
          detail: 治理可能更贴合自身需求，但要承担集成与维护负担。
    approximationNotes: 分数是分析师根据保留的公开描述给出的 1 至 5 序数定位，不是实测基准或市场排名。竞争对手证据不均衡，限制了精确度，因此该图应指导尽调，而非用于选择供应商。
    claimRefs:
      - CP001
      - CP004
      - CP005
      - CP011
      - CP012
      - CP016
  - id: FI001
    title: 从客户活动到财务结果的桥接
    type: flow
    summary: Rox 可以把账户活动连接到按量计费的软件使用，但公开证据尚未覆盖已实现收入、交付成本与毛利。
    data:
      nodes:
        - id: customer-signals
          label: 客户与账户信号
          detail: CRM、数仓、产品、计费与外部上下文为账户模型提供输入。
        - id: context-graph
          label: 收入专属上下文图谱
          detail: Rox 称该图谱在全生命周期内维持对账户的理解。
        - id: account-agent
          label: 每个账户一个收入代理
          detail: 代理解读上下文，并支持配置好的收入动作。
        - id: workflow-execution
          label: 工作流执行
          detail: 研究、触达、CRM 更新、交易推进与扩张都可能消耗操作额度。
        - id: agent-actions
          label: 按量计费的 Agent Actions
          detail: 公开来源描述了按使用量和结果定价，但对额度说法不一。
        - id: recognized-revenue
          label: 已确认收入
          detail: 实际价格、折扣、超额费用与服务收入构成未公开披露。
        - id: gross-profit
          label: 毛利
          detail: 计算、数据、支持与赋能成本不可得。
    approximationNotes: 根据公开产品与定价描述整理的概念序列；不是比例漏斗、收入预测、转化模型或累计瀑布图。
    claimRefs:
      - CI004
      - CI009
      - CI012
  - id: FE001
    title: 受控制边界约束的数据到行动技术栈
    type: stack
    summary: 六个有文档记录的层级展示了连接后的数据如何变成可复核或可执行的收入工作流；权限与新鲜度约束着每个下游步骤。
    data:
      layers:
        - label: 已连接的企业与公开来源
          detail: CRM、电子邮件、会议、文档、数仓数据与公开信息。
          items:
            - 来源可用性
            - 来源权限
            - 来源新鲜度
        - label: 上下文系统
          detail: 账户、人员、机会与互动已连接。
          items:
            - 实体解析
            - 关系
            - 来源映射
        - label: 上下文检索
          detail: 为账户、任务、参与者与时间段选取相关信息。
          items:
            - 相关性评分
            - 任务范围
            - 时间上下文
        - label: 收入代理与工具
          detail: 代理生成答案或调用受支持的工具。
          items:
            - 账户摘要
            - 电子邮件草稿
            - 记录操作
        - label: 应用与工作流
          detail: 用户在 Rox 与已连接系统中检查并使用产出。
          items:
            - Web 应用
            - Rox Mac 版
            - CRM 与通信集成
        - label: 治理与访问
          detail: 资源、记录与字段权限限制可见性和操作。
          items:
            - 权限集
            - 访问来源
            - 管理配置
    approximationNotes: 层级顺序是对有文档记录组件的分析性呈现，不是延迟、吞吐量或部署拓扑的测量。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
  - id: FU001
    title: 有证据支撑的客户旅程与扩张闭环
    type: journey-map
    summary: Rox 从企业资质判断与账户上下文进入管线、交易、续约与扩张工作流，但公开的持久性证据尚未覆盖续约和队列经济性。
    data:
      nodes:
        - label: 企业资质判断
          detail: 目标组织拥有复杂的 B2B 收入团队和成熟的数仓数据。
          touchpoints:
            - Global 2000 positioning
            - Revenue and data leadership
            - Warehouse readiness
        - label: 账户上下文
          detail: 专用账户代理汇总获授权的 CRM、数仓、产品、计费与外部信号。
          touchpoints:
            - Data connections
            - Identity resolution
            - Permission controls
        - label: 管线生成
          detail: 研究、账户排序、个性化触达与入站路由创造或筛选机会。
          touchpoints:
            - Research
            - Buying signals
            - Personalized outreach
        - label: 交易执行
          detail: 系统支持会议准备、交易监控、CRM 更新与下一步行动。
          touchpoints:
            - Meeting briefs
            - Risk monitoring
            - Opportunity management
        - label: 续约与扩张
          detail: 产品使用与账户信号可以支持续约风险识别和扩张动作。
          touchpoints:
            - Adoption signals
            - Renewal risk
            - Upsell support
        - label: 结果验证
          detail: 公开证据提供了部分生产力与采用案例，但没有留存或集中度队列。
          touchpoints:
            - Peer ratings
            - Named-customer outcomes
            - Private-data diligence
    approximationNotes: 该有序旅程综合了已描述的工作流，不是实测转化漏斗；没有推断任何阶段转化率。
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU012
  - id: FR001
    title: 残余风险热力图
    type: matrix
    summary: 公开的缓释措施降低了部分架构风险，但证据成熟度仍使数据权威性、自主操作与依赖风险处于高位。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: 权限或上下文泄漏
          values:
            - 低中
            - 严重
            - 已描述，未经独立测试
            - 高
        - label: 过时或错配的信号
          values:
            - 中
            - 高
            - 已发布测试框架
            - 中高
        - label: 错误的自主操作
          values:
            - 中
            - 高
            - 审批路径未公开
            - 高
        - label: 数仓 / CRM 依赖
          values:
            - 中
            - 高
            - 已知集成与合作关系
            - 中高
        - label: 未经证明的企业 ROI
          values:
            - 中
            - 高
            - 公司口径加小规模评价样本
            - 中高
        - label: 使用成本波动
          values:
            - 中高
            - 中高
            - 已披露计量方式；当前经济性不清楚
            - 中高
    approximationNotes: 仅依据指定公开证据作出的定性分析师评估；这些标签不是事故频率或量化损失估计。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 报道的融资估值先经过收入分母、产品证明、市场风险与缺失尽调信息的筛选，再形成结论。
    data:
      nodes:
        - id: reported-mark
          label: 报道估值
          detail: 2026 年 3 月约为 $1.2B
        - id: revenue-anchor
          label: 收入锚点
          detail: 预测 2025 ARR 约 $8M，当前 ARR 未核实
        - id: implied-multiple
          label: 估值压力
          detail: 约为预测 ARR 分母的 150 倍
        - id: product-proof
          label: 产品证明
          detail: Databricks 可用性，以及正面但有限的用户评价
        - id: unresolved-economics
          label: 未解决的经济问题
          detail: 增长、留存、利润率、现金消耗、融资所得与优先权
        - id: recommendation
          label: 建议
          detail: 继续研究；高风险；估值偏高
    approximationNotes: 该流程是定性的；不会根据不可得的运营输入估算企业价值或概率加权回报。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
