              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格是关键门槛
            body: Rox 可能是一家可信公司，但当前价格尚未核实。要给出买入建议，需要指定公开来源中尚不存在的当前运营 证据和证券条款。
            calloutType: recommendation
