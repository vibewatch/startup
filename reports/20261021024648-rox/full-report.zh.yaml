  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资的市场边界，是企业收入数据与收入团队行动之间的编排层。Rox 宣称覆盖从销售管线生成到交易管理、 续约和扩张的全流程，Gartner 则将其归入 Revenue Action
              Orchestration。这个定义包含用于连接获准账户 信号、安排优先级、生成或审核触达以及管理活跃商机的软件和实施支出。但它不包括底层 CRM 记录系统、
              专有联系人数据订阅、通用数据仓库或广义营销自动化，除非客户专门购买这些产品来完成同样的信号到行动 工作流。现状是人工研究和工具切换；相邻替代方案包括 CRM 原生 agent、基于 Salesforce 或
              HubSpot 的 内部开发、销售互动工具，以及配合人工 SDR 执行的数据供应商。Rox 自己也表示依赖集成联系人供应商， 因此联系人数据支出不应再次计入 Rox 的核心可服务层。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              主要经济买方可能是负责销售管线效率的 CRO、销售副总裁或 RevOps 负责人，日常用户则是客户经理和销售开发 代表。预算归属没有公开记录，因此把采购归入收入技术或 RevOps
              预算仍是推断，而非已核实的采购事实。 企业数据、安全和 IT 管理员是重要把关人，因为部署需要连接数据源、解析身份、配置记录与字段权限，以及
              明确行动权限。因此，采用路径应从一个边界清晰的动作、获批测试数据和可审计交接开始，而不是直接在全公司 推行自治。账户上下文分散、销售人员研究、CRM 维护或信号审核占用稀缺销售时间时，购买触发最强。扩张则取决
              于先证明基线结果、确认数据源新鲜度和访问控制，再延伸到相邻的销售管线、交易、续约或扩张流程。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有证据没有提供 Rox 所处精确品类可信的公开市场规模、CAGR、地域支出基数或独立测量的渗透率。因此， 自上而下采用企业 AI 或 CRM
              估值会高估相关支出；自下而上的模型又需要目前无法获得的账户数、年度合同 价值、实施结构、续约行为和可取得份额。最窄的可支持视角，是 Rox 公司声称其 Global 2000 目标客户群、合作 伙伴报告的
              2024 年私测客户基础（超过 35 个收入团队），以及有限的使用或结果代理指标。Sequoia 报告称， 多家企业客户的每位客户经理每周可节省超过 8 小时，客户活动提升超过
              35%，销售接受管线的回报达到两倍。 Rox 公司声称可在 90 天内实现 ROI。这些指标显示工作流可能有价值，但其发布者、样本、定义、期间和分母都 不能证明 TAM、SAM、SOM、持久留存或付费意愿。
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              增长建立在两个结构性主张上：企业正在把客户上下文集中到数据仓库，收入团队希望 agent 把这些上下文 转化为行动，同时不替换 CRM。该产品也可以补充现有联系人数据供应商，而不必取代它们。采用仍受集成工作、
              权限设计、过时或错误匹配的记录、变更管理，以及证明增量管线而非活动量的要求所约束。竞争 RevOps 供应商 Hyperscayle 认为 Rox 偏销售导向，且部分部署模式仍在 Rox
              云中处理数据；这属于有用的反方定位， 不是独立技术基准，应在架构和安全评审中验证。定价只被描述为按使用量和结果计价，企业条款需询价，因此 ACV
              和预算弹性未知。只有在尽调核实付费采用、净留存、部署成本、结果归因和可重复的安全审批路径后， 估值才应奖励品类时机。
            claimRefs:
              - CM002
              - CM004
              - CM007
              - CM008
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场规模仍是投资评估缺口
            body: 不要把 Global 2000 标签或早期结果声明直接资本化为 TAM。使用收入倍数前，必须取得付费账户数、ACV 分布、 实施收入、续约 cohort，以及可独立归因的管线结果。
            calloutType: risk
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范围不止 AI 销售 agent
        blocks:
          - type: paragraph
            body: >-
              Rox 属于 Gartner 的 Revenue Action Orchestration 品类，但买方可以通过多条不同路径解决同一问题。Gartner 将 Gong、Outreach、Salesloft 和
              Apollo 列为主要替代方案；Rox 自己的品类指南还加入 Clari、Salesforce Einstein、HubSpot、Aviso 和 HockeyStack。独立研究又把范围扩大到
              Aurasell、Monaco 等 AI 原生 CRM 新 进入者，Artisan、11x 等外呼专家，以及 Salesforce Agentforce 这一一方平台威胁。因此实际比较不是一张
              产品清单，而是在分析深度、互动执行、CRM 原生分发、AI 原生替代品，或基于现有数据与 CRM 栈搭建内部 工作流之间做选择。Rox 的竞争主张是覆盖完整生命周期，而不是独占任何单一能力。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP011
              - CP013
      - number: '3.2'
        title: 数据仓库上下文形成差异，但分发仍是更难的护城河
        blocks:
          - type: paragraph
            body: >-
              Rox 的架构保留 CRM 作为商业记录系统，同时用更广泛的数据仓库上下文图，把产品、支持、计费和外部信号 连接到账户行动。Databricks
              发布让这一定位延伸到受治理的湖仓环境，并宣布正式可用。当账户决策需要跨 系统上下文、买方又不会替换 Salesforce 时，这会形成可信优势。但它无法消除分发风险：Salesforce 可以 把一方 agent
              放进现有系统，而 Gong、Salesloft 和 Outreach 已拥有大得多的公开评价基础。Rox 必须证明
              跨系统编排产生的增量价值足以克服现有平台在采购、实施和信任上的优势，而不是最终被这些平台吸收为一项功能。
            claimRefs:
              - CP005
              - CP006
              - CP011
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP010
              - CP011
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP011
              - CP012
              - CP016
      - number: '3.3'
        title: 低摩擦切入掩盖了未解的企业经济性
        blocks:
          - type: paragraph
            body: >-
              公开证据一致显示，Rox 采用按使用量而非传统按席位的套餐，提供免费入门层，企业部署需私下报价。但免费层 配额存在冲突：AI Agents Wiki 列出每月 2,000 次 action，Prospeo 列出
              2,500 次。两者都列出 $50 的 Core 层和每月 5,000 次 action，但都没有证明实际企业合同价值、生产工作流的 action 消耗、折扣或超额费用条款。 这种定价可以在大规模 rollout
              前鼓励试点和多平台共用，但不透明的 action 消耗会让总成本更难与按席位的 现有方案比较。买方应基于真实账户数据对一个生产动作做基准测试，并要求合同明确用量模型，再把公开价格 当作企业成本锚点。
            claimRefs:
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.4'
        title: 持久性取决于可测量的行动质量，而非单纯功能广度
        blocks:
          - type: paragraph
            body: >-
              产品接受度最强的公开信号，是 Gartner 十条评价给出的 4.7 分；但相比多家现有厂商展示的数百乃至数千条 评价，这个样本仍很小。第三方分析还称 Rox
              更适合大型账户制流程，并指出它没有原生联系人数据库，数据 来源和核验要交给相邻工具。Rox 自己也警告，不完整的收入数据可能生成看似确定却不准确的输出。因此，数据
              质量、权限设计和可观察的工作流结果，是检验转换成本的关键。要形成持久护城河，需要证明上下文图能在 重复账户周期中改善决策，并且配置好的工作流会积累专有运营知识。公开来源尚未量化留存、多平台共用、
              实施投入，或相对于 Agentforce 和现有收入智能厂商的赢单率。
            claimRefs:
              - CP010
              - CP012
              - CP014
              - CP015
