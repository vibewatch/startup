  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一种免费增值 SaaS 模式：按使用量和结果计量，配合付费订阅及定制企业合同，而不是单一的按席位 费率。底层商业计量单位是“Agent Action”。Rox 为每个客户账户配置一个收入
              agent，把数据仓库上下文接入 获客、交易管理和扩张流程。这套设计可以支撑多条收入流，但也让变现取决于工作流强度和客户数据准备度。 Rox 称企业部署和培训已包含在内，并声称 90
              天内可实现投资回报；两者都是公司口径，且都没有披露交付该结果 所需的实施人力、支持负担、托管成本或毛利贡献。
            claimRefs:
              - CI004
              - CI005
              - CI010
              - CI011
              - CI012
