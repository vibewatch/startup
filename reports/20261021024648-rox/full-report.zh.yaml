              - CR015
      - number: '7.4'
        title: 财务模型风险与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              按使用量计量的 Agent Actions 让价格与活动量对齐，但也会使客户总成本对工作流设计、模型强度和采用程度敏感。 两个 2026 年页面给出了不同的自助价格和 action
              配额；这可能是产品变更而非错误，但意味着不能只凭公开 页面评估当前合同经济性。因此，投资论点应建立在边界清晰的生产试点上，并预先约定行动准确率、人工审核负担、 CRM
              回写错误、合格管线贡献和每个可接受结果的总成本基线。若无法保持最小权限访问、反复发生未授权或重大 错误的外部行动、无法导出账户上下文和审计日志，或试点计入实施与监督成本后仍无法证明可测量收益，论点就会 失效。
            claimRefs:
              - CR009
              - CR010
              - CR012
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 主要论点失效测试
            body: 如果 Rox 无法在买方真实权限模型下证明最小权限检索、明确行动权限、可逆 CRM 回写、完整审计日志和有责任 人工交接，不要把规模扩大到边界清晰的试点之外。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: 投资含义
            body: 把安全、可靠性、法律历史和单位经济性视为私有证据门槛；公开产品方面的说法和十条评价样本不足以消除这些风险。
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR010
              - CR012
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，信心中等、风险高，估值偏紧。独立报道将 Rox 的估值放在约 $1.2 billion，并称预计 2025 年 ARR 约 $8 million，相当于该预测分母的约 150
              times。这不是传统的当前收入投资评估锚点：ARR 是归因于 交易知情人士的预测，最近一轮融资所得也未在审阅报道中披露。产品势头可能支持溢价，但公开证据没有证明
              支撑该溢价所需的增长、留存、利润率或现金状况。因此，应等待数据室核实或明显更好的条款，而不是把报道 中的私人市场价格当作内在价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV014
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Rox 正以差异化的数据仓库原生架构、与使用量挂钩的定价和正式可用的 Databricks 部署，切入 一个可测量的企业工作流。Gartner Peer Insights
              也显示早期口碑良好。反论点是，相对于价格，证据仍很窄： 评价样本只有十条，大型替代方案拥有数百乃至超过一千条评价，市场还有成熟的收入智能供应商和资金充足的 AI 原生进入者。公司自述的部署和 ROI
              是有用的产品假设，不是实际客户经济性的独立验证。              只有经核实的 cohort 数据显示持久扩张、有吸引力的毛利率和可规模化部署成本，投资论点才会改变。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.3'
        title: 乐观、基准与悲观情景评估
        blocks:
          - type: paragraph
            body: >-
              由于当前 ARR、增长、留存、毛利率、烧钱和优先权条款都未公开核实，情景分析只能保持方向性。在乐观情景下， ARR 需要明显高于所引 $8 million 预测，并由强劲净留存和可重复的企业部署支撑，超过报道的
              $1.2 billion 估值才有依据。基准情景认可可信的产品信号，但没有运营证据就不评估当前价格。悲观情景则是商业化放缓、
              竞争激烈和倍数压缩叠加，带来低价轮和稀释风险。指定公开证据无法支持精确目标回报、持有期或退出价值； 这些结果需要经核实的输入，而不是虚假的精确度。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              退出准备尚处早期。报道中的私人估值和投资者参与证明融资渠道，但不能证明 IPO 准备度、战略买方兴趣或融资后可用现金。尽调应索取最新股权结构表、证券层级条款、清算优先权、完全稀释后持股、现金余额、烧钱、当前
              ARR、增长、毛留存和净留存、毛利率、客户集中度及服务负担。产品尽调应在有代表性的客户中测试访问控制、行动审批、实施投入和测量结果。论点失效触发器包括明显低于报道 ARR 预测、续约或扩张 cohort
              薄弱、企业部署拖延、治理失败，或融资降价且新增高级优先权。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV011
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
