        title: 展示项
        blocks:
          - type: callout
            title: 要求按工作流做对比测试
            body: 在一个受治理的账户动作上，将 Rox 与已经嵌入买方技术栈的现有方案比较；在接受平台级整合论点前，测量 数据准备、行动准确率、人工审核、周期时间和总计量用量。
            calloutType: recommendation
