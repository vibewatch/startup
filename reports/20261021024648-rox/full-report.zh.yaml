  - id: TV002
    title: 正方论点与反方论点
    columns:
      - 观点
      - 证据
      - 什么会改变这一观点
    rows:
      - - 正方论点
        - 原生于数仓的账户上下文与 Databricks 部署，打造了差异化的企业工作流。
        - 独立实施证据显示部署可重复，且客户 ROI 可量化。
      - - 正方论点
        - 按使用量和结果定价，可以让支出与实际活动匹配。
        - 经核实的毛利率与扩张数据表明该模式具备经济规模效应。
      - - 反方论点
        - 报道估值约为预测 2025 ARR 的 150 倍。
        - 经核实的当前 ARR 显著高于预测，且增长与留存持久。
      - - 反方论点
        - Gartner Peer Insights 只有 10 条评价，客户验证样本很窄。
        - 大型企业中更广泛的客户背书、续约队列与集中度数据。
