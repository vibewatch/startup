      - number: '4.3'
        title: 牵引信号与收入质量
        blocks:
          - type: paragraph
            body: >-
              TechCrunch 报道，Rox 在融资时预计 2025 年末 ARR 达到 $8 million。这是指定财务证据中唯一的公开规模数据点，
              而且它是据熟悉该交易的人士所作的预测，并非实际实现、经审计或由管理层提交的结果。Gartner Peer Insights 显示 10 条评价、4.7 分，能提供有限的采用信号，但没有合同金额、续约 cohort
              或有代表性的客户样本。Prospeo 另称 G2 上有 0 条评价；这针对的是另一个评价平台，因此不否定 Gartner 的数量。没有实际 ARR、GAAP 收入、
              NRR、GRR、客户集中度、使用量扩张、坏账，以及经常性软件收入与部署服务收入的拆分，就无法评估收入质量。
            claimRefs:
              - CI002
