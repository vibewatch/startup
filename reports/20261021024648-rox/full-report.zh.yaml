              - CI014
              - CI016
      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              TechCrunch 报道融资估值为 $1.2 billion，Rox 此前则宣布累计融资 $50 million。这些数字只能说明投资人支持和
              估值背景，不能说明当前流动性：已融资额不等于可用现金，指定来源也没有披露手头现金、月度净烧钱、债务、 营运资金、已承诺云支出或现金跑道。因此，经济性结论仍取决于条件。按使用量变现或许能让价格与客户活动
              对齐，但计量单位不透明，预算可预测性和实际毛利率难以检验；包含企业赋能可能促进采用，同时提高交付服务成本。投资判断仍应卡在月度 ARR 桥接、cohort 留存、毛利率瀑布、按销售动作拆分的
              CAC/回本期、服务利用率、现金与 债务计划，以及与下一融资触发点挂钩的下行情景跑道计划上。
