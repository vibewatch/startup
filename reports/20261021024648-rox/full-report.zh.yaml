      - number: '1.4'
        title: 执行节奏与里程碑解读
        blocks:
          - type: paragraph
            body: >-
              Rox 可观察到的执行信号是产品覆盖面和发布频率，而不是经过审计的商业表现。公司在 2026 年 3 月宣布与 Databricks 合作，并让 Built On Databricks 方案正式可用；截至 10
              月，带日期的发布说明又记录了治理、 自助式 Teams、账户计划自动化和 Value App。这个节奏支持 Rox 正从研究和工作流辅助扩展到更完整的收入 运营界面。但它没有证明 ROI 可重复或部署简单：Rox
              自己的说明称若干指标只是依赖已连接数据的估算， 竞争对手比较则把企业产品描述为部署准备工作繁重。因此，主要里程碑风险在于，能否把快速交付功能转化为 持久、独立测量的客户经济性。
            claimRefs:
              - CO014
              - CO015
              - CO016
