chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Rox 通过 Rox Data Corp 运营，公开资料一致将其描述为一家 2024 年成立、总部位于旧金山的私营软件公司。
              其产品是以数据仓库为核心的收入编排层：平台从经授权的数据仓库、CRM、通信、使用、计费和第三方数据中 汇总账户上下文，再为每个账户配置 agent，覆盖销售管线生成、交易、续约和扩张。这个架构让 Rox 更像
              参与和自动化层，而不是 CRM 的直接替代品；公司自己的技术说明仍把 CRM 称为账户和商机的记录系统。 Gartner 报道其按使用量和结果定价，而非传统按席位许可；Rox 的发布说明则称 Teams
              产品席位不限，并按 Agent Actions 计量。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.2'
        title: 领导层、创始人覆盖与治理
        blocks:
          - type: paragraph
            body: >-
              Ishan Mukherjee 是创始人兼 CEO，也是公开资料中最明确的关键人物。他披露的经历横跨工程、产品、公司创建 和市场拓展，符合 Rox 将高技术门槛的数据架构接入企业销售流程的方向。公开资料还显示
              Shriram Sridharan 是联合创始人兼 CTO，Avanika Narayan 是负责应用 AI 的联合创始人，Diogo Ribeiro 是直接与客户合作的
              联合创始人。对早期公司而言，职能覆盖较广，但这不等于治理记录：可访问来源没有提供完整的现任高管名单、 董事会成员、投票权、继任计划或经核对的完整创始人名单。因此，投资评估应把创始人依赖和正式监督视为
              尚待尽调的问题。
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: 资本、规模与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              融资记录的大方向清楚，但数字并不整齐。同期报道显示，种子轮由 Sequoia 领投，A 轮由 General Catalyst 领投，GV 也被列为机构投资者。Tracxn 将 2026 年 3 月、投后估值
              $1.2 billion 的融资描述为 A 轮，但另一 份当前公司简介把 3 月融资标为 B 轮。累计融资额同样未解决：可访问资料分别显示 $50 million、$64 million 以上和 $78
              million。公开运营规模也不清晰。唯一的 ARR 数字是第三方对 2025 年的估算，员工数快照则从 4 月的 71 人变为 8 月的 170
              人，既没有公司确认的分母，也没有调和说明。这些数字不能直接换算成当前 收入、可用现金或烧钱速度。
            claimRefs:
              - CO008
