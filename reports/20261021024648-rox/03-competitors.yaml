schemaVersion: "report-v2"
artifact: competitors
slug: rox
runDate: 2026-10-21
company:
  name: Rox
chapter:
  number: 3
  title: Competitors
  summary: >-
    Rox competes across revenue intelligence, sales engagement, first-party CRM agents,
    AI-native CRM entrants, and internal-build alternatives. Its warehouse-native,
    account-level orchestration is differentiated, but incumbents have deeper review
    footprints and distribution, while public enterprise pricing and comparative
    performance evidence remain thin.
sections:
  - id: competitive-landscape
    title: The competitive set is broader than AI sales agents
    body: >-
      Rox sits in Gartner's Revenue Action Orchestration category, but a buyer can solve
      the same job through several distinct routes. Gartner names Gong, Outreach,
      Salesloft, and Apollo as top alternatives, while Rox's own category guide adds
      Clari, Salesforce Einstein, HubSpot, Aviso, and HockeyStack. Independent research
      broadens the set further to AI-native CRM entrants such as Aurasell and Monaco,
      outbound specialists such as Artisan and 11x, and Salesforce Agentforce as a
      first-party platform threat. The practical comparison is therefore not one product
      list: it is a choice among analytics depth, engagement execution, CRM-native
      distribution, an AI-native replacement, or an internal workflow assembled on the
      existing data and CRM stack. Rox's competitive claim is widest lifecycle coverage,
      not exclusive ownership of any one capability.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: differentiation-and-distribution
    title: Warehouse context differentiates Rox, but distribution remains the harder moat
    body: >-
      Rox's architecture keeps the CRM as the commercial system of record while using a
      broader warehouse-derived context graph to connect product, support, billing, and
      external signals to account actions. The Databricks launch extends that position
      into a governed lakehouse environment and was announced as generally available.
      This creates a credible advantage where account decisions require cross-system
      context and where buyers will not replace Salesforce. It does not remove the
      distribution risk: Salesforce can place first-party agents inside the incumbent
      system, and Gong, Salesloft, and Outreach already have much larger visible review
      footprints. Rox must prove that cross-system orchestration creates enough
      incremental value to overcome incumbent procurement, implementation, and trust
      advantages rather than becoming a feature those platforms absorb.
    claimRefs: [CP005, CP006, CP011, CP016]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: pricing-and-packaging
    title: Low-friction entry masks unresolved enterprise economics
    body: >-
      Public evidence agrees that Rox uses usage-oriented rather than conventional
      per-seat packaging, offers a free entry tier, and quotes enterprise deployments
      privately. It does not agree on the free-tier allowance: AI Agents Wiki lists
      2,000 monthly actions, while Prospeo lists 2,500. Both sources list a $50 Core tier
      with 5,000 monthly actions, but neither establishes realized enterprise contract
      value, action consumption per production workflow, discounts, or overage terms.
      The pricing model can encourage a pilot and multi-homing before a broad rollout,
      yet opaque action consumption may make total cost harder to compare with seat-based
      incumbents. A buyer should benchmark one production motion on actual account data
      and require a contractual usage model before treating the public price as an
      enterprise cost anchor.
    claimRefs: [CP007, CP008, CP009]
    tableRefs: [TP003]
  - id: durability-and-displacement
    title: Durability depends on measurable action quality, not feature breadth alone
    body: >-
      The strongest public signal of product acceptance is Gartner's 4.7 rating from ten
      ratings, but that base is small beside the hundreds or thousands displayed for
      several incumbents. Third-party analysis also describes Rox as best suited to large,
      account-based motions and flags the absence of a native contact database, which
      leaves data sourcing and verification to adjacent tools. Rox itself warns that
      incomplete revenue data can generate confident but inaccurate outputs. Those facts
      make data quality, permission design, and observable workflow outcomes the key
      switching-cost tests. A durable moat would require evidence that the context graph
      improves decisions across repeated account cycles and that configured workflows
      accumulate proprietary operating knowledge. Public sources do not yet quantify
      retention, multi-homing, implementation effort, or win rates against Agentforce and
      the revenue-intelligence incumbents.
    claimRefs: [CP010, CP012, CP014, CP015]
tables:
  - id: TP001
    title: Competitor profile and substitution map
    columns:
      - Competitor or class
      - Category
      - Public scale signal
      - Target customer or motion
      - Differentiation
      - Limitation versus Rox
    rows:
      - [Rox, Revenue action orchestration, "$50M previously raised; later round reportedly valued Rox at $1.2B", "Large enterprise and strategic-account selling", "Warehouse-derived account context plus action across the lifecycle", "Young review base and undisclosed enterprise contract economics"]
      - ["Gong / Clari", Revenue intelligence and forecasting, "Gartner shows 278 ratings for Gong; Clari scale not established in assigned evidence", "Forecasting, deal inspection, and revenue leadership", "Deeper analytics and forecasting specialization", "Less evidence in the assigned pool of end-to-end account action"]
      - ["Salesloft / Outreach", Sales engagement plus intelligence, "Gartner shows 1,214 Salesloft and 196 Outreach ratings", "Enterprise sequencing, rep activity, and engagement", "Installed engagement workflows and visible user proof", "Cross-system warehouse context is not established by the assigned evidence"]
      - ["Salesforce Agentforce", First-party CRM agents, "Scale not quantified in assigned evidence", "Salesforce-standardized enterprises", "Native CRM distribution and data access", "Cross-system breadth may depend on additional integration"]
      - ["Aurasell / Monaco", AI-native CRM entrants, "Scale and funding not established in assigned evidence", "Buyers willing to consolidate or replace legacy CRM", "AI-native system design and potential tool consolidation", "CRM migration is a heavier change than Rox's overlay approach"]
      - ["Internal build / status quo", Custom data and workflow stack, "No comparable vendor scale", "Teams with strong data engineering and RevOps capacity", "Maximum control over data, permissions, and workflow logic", "Ongoing integration, governance, evaluation, and maintenance burden"]
    notes: >-
      Comparative scope is assembled from the assigned sources as of 2026-10-21; unknown
      scale, funding, and capability fields are stated rather than inferred, and vendor
      descriptions are not treated as independent benchmarks.
    claimRefs: [CP001, CP002, CP004, CP005, CP011, CP013]
  - id: TP002
    title: Capability and buyer-control matrix
    columns:
      - Buying criterion
      - Rox
      - Gong / Clari
      - Salesloft / Outreach
      - Agentforce
      - Internal build
    rows:
      - ["Primary center of gravity", "Account-level orchestration", "Revenue intelligence and forecasting", "Sales engagement execution", "CRM-native agents", "Company-specific workflows"]
      - ["Warehouse-derived context", "Explicitly central", "Unknown in assigned evidence", "Unknown in assigned evidence", "Not established in assigned evidence", "Possible, with engineering work"]
      - ["CRM relationship", "Overlay; CRM remains system of record", "Integrated analytics layer", "Integrated engagement layer", "Native to Salesforce", "Custom integration required"]
      - ["Lifecycle breadth", "Pipeline through renewal and expansion", "Deal and forecast depth", "Outbound and engagement depth", "Depends on configured Salesforce agents", "Depends on build scope"]
      - ["Governance posture", "Rox claims warehouse and permission-aware controls", "Unknown in assigned evidence", "Unknown in assigned evidence", "Native-stack controls are plausible but unverified here", "Fully buyer-designed and buyer-operated"]
      - ["Independent public proof", "Ten Gartner ratings", "Larger visible incumbent review bases", "Larger visible incumbent review bases", "No comparable rating evidence retained", "Requires internal pilot evidence"]
    notes: >-
      Cells distinguish explicit source support from unknowns. Competitor capability
      descriptions rely partly on Rox-issued comparisons and independent synthesis, so
      procurement should verify them in product demonstrations and controlled pilots.
    claimRefs: [CP001, CP003, CP005, CP006, CP010, CP011, CP016]
  - id: TP003
    title: Public pricing and packaging comparison
    columns:
      - Product
      - Public price evidence
      - Unit or contract model
      - Material unknown
      - Diligence implication
    rows:
      - [Rox, "$0 Starter; $50 monthly Core; custom Enterprise", "Usage / agent actions", "Sources conflict on 2,000 versus 2,500 Starter actions; enterprise economics undisclosed", "Model a real workflow and contract for usage ceilings"]
      - [Apollo, "Free / $49 monthly in Prospeo comparison", "Self-serve prospecting", "Included usage and enterprise terms not retained", "Useful lower-cost benchmark for prospecting-only needs"]
      - [Gong, "Approximately $100 per user monthly in Prospeo comparison", "Estimated seat-based price", "Estimate is not a vendor quote", "Compare analytics depth separately from action breadth"]
      - [ZoomInfo, "Approximately $15,000 annually in Prospeo comparison", "Estimated annual contract", "Configuration and data package not specified", "Separate contact-data value from orchestration value"]
      - [6sense, "Approximately $60,000 annually in Prospeo comparison", "Estimated annual contract", "Configuration and scope not specified", "Compare intent-data and ABM needs separately"]
    notes: >-
      Rox terms combine AI Agents Wiki, Gartner, and Prospeo. Non-Rox prices are
      third-party comparison figures, some explicitly approximate, and are not realized
      contract prices; validate scope, discounts, and current terms directly with vendors.
    claimRefs: [CP007, CP008, CP009, CP014]
figures:
  - id: FP001
    title: Competitive positioning by workflow breadth and enterprise data fit
    type: quadrant
    summary: >-
      Rox is positioned toward broad lifecycle orchestration and warehouse context, while
      established alternatives derive advantage from specialization or native distribution.
    data:
      xAxis:
        label: Workflow breadth
        min: 1
        max: 5
      yAxis:
        label: Enterprise data and governance fit
        min: 1
        max: 5
      points:
        - label: Rox
          x: 5
          y: 5
          detail: "Broad lifecycle claim with warehouse-native account context; public proof remains early."
        - label: Gong / Clari
          x: 3
          y: 4
          detail: "Deep revenue intelligence and forecasting specialization."
        - label: Salesloft / Outreach
          x: 4
          y: 3
          detail: "Strong engagement execution with established user footprints."
        - label: Salesforce Agentforce
          x: 4
          y: 5
          detail: "First-party CRM distribution; cross-system breadth is not established here."
        - label: AI-native CRM entrants
          x: 4
          y: 2
          detail: "Broad replacement ambition with heavier migration requirements."
        - label: Internal build
          x: 2
          y: 4
          detail: "Potentially tailored governance, offset by integration and maintenance burden."
    approximationNotes: >-
      Scores are analyst-authored ordinal placements from 1 to 5 based on retained public
      descriptions, not measured benchmarks or market rankings. Uneven competitor evidence
      limits precision, so the map should guide diligence rather than vendor selection.
    claimRefs: [CP001, CP004, CP005, CP011, CP012, CP016]
callouts:
  - calloutType: recommendation
    title: Require a workflow-level bake-off
    body: >-
      Compare Rox with the incumbent already embedded in the buyer's stack on one governed
      account motion, measuring data preparation, action accuracy, human review, cycle time,
      and total metered usage before accepting a platform-wide consolidation case.
    claimRefs: [CP005, CP009, CP015, CP016]
