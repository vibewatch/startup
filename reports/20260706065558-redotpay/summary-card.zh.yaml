  topStrengths:
    - RedotPay 围绕卡、钱包、付款和加密资产抵押信贷搭起一套实用产品栈，而不是押注单一投机性加密功能。
    - 公司在 2025 年完成三轮重要融资，引入 Lightspeed、Coinbase Ventures、Goodwater、Pantera 和 Circle Ventures 等主流与加密原生投资人。
    - 公开报道的规模已经不小：到 2025 年末，公司称注册用户超过 6M、年化支付额超过 $10B、年化收入超过 $150M。
    - 随着监管收紧，公司也在合规、本地落地和基础设施合作上投入，这一点已经体现出来。
  topRisks:
    - 审计财务报表、利润率披露和完整投后股权表仍缺失，承销信心明显低于估值标题给人的感觉。
    - 传闻中的 $4B+ IPO 目标对应的收入倍数，明显高于近期公开市场和私募稳定币支付可比公司能支撑的水平。
    - 公开评论渠道仍反复出现账户冻结、客服响应、验证摩擦和刷卡失败投诉。
    - 关键依赖披露仍不完整，尤其是底层发卡银行或 BaaS 伙伴，以及逐司法辖区的准确牌照矩阵。
    - 治理透明度偏薄：公开高管阵容狭窄，独立报道也质疑公司在高速扩张期存在高管流动。
  unresolvedGaps:
    - FY2025 或 2026 年审计财务报表，包括收入确认、毛利率、现金余额和现金流。
    - 与每个 RedotPay 法律实体绑定的完整牌照矩阵，包括香港、欧盟、英国、美国和拉美权限的确切范围。
    - 支撑公司注册用户和 TPV 口径的活跃用户、留存、队列和商户集中度数据。
    - 底层发卡银行或 BaaS 伙伴的身份与经济条款，以及这段关系是否有冗余。
    - 如果 IPO 路径仍在推进，需要招股书级别的董事会、股权表、清算优先权和承销商文件。
