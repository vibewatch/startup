  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: cap-table-disclosure
    missingEvidence: RedotPay's post-money cap table, liquidation preference terms, or board composition tied to its 2025 financing rounds.
    whyItMatters: Without the preference stack and dilution terms, the common-equity value implied by any headline valuation figure cannot be assessed.
    diligencePath: Request the cap table and preference terms directly from RedotPay or its underwriters as part of pre-IPO or secondary due diligence.
    relatedQuestionRefs:
    - QV006
  - type: missing-source
    severity: material
    topic: payment-volume-verification
    missingEvidence: Independent, card-network or processor-level verification of RedotPay's annualized payment-volume figures.
    whyItMatters: Payment volume is the central metric cited to support the $4 billion IPO valuation ask; unverified self-reported figures create meaningful mark-to-market uncertainty.
    diligencePath: Obtain Visa/network-level settlement or processor data reconciling to RedotPay's claimed annualized volume.
    relatedQuestionRefs:
    - QV024
  - type: missing-source
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited financial statements, gross margin, cost of revenue, or cash position for RedotPay.
    whyItMatters: No valuation method (DCF, precedent transaction, or comparable multiple) can be reliably underwritten without audited revenue, margin, and cash data.
    diligencePath: Require audited financials as a condition of any pre-IPO investment or secondary purchase, or await the company's S-1 filing if the IPO proceeds.
    relatedQuestionRefs:
    - QV026
  - type: missing-source
    severity: material
