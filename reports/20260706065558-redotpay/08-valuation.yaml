- id: exit-readiness-and-diligence-asks
  title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
  body: 'RedotPay''s most advanced disclosed capital-markets event is its prospective US IPO process with JPMorgan Chase, Goldman Sachs, and Jefferies engaged, rather than any announced direct listing, SPAC, or organized secondary sale; public reporting frames the potential listing as one of the largest by an Asian crypto-linked fintech. Credible thesis-break triggers include an IPO price materially below the $4 billion ask, withdrawal of any named underwriter, a confirmed SFC/HKMA/MiCA enforcement action, a failure to name a permanent CFO before the roadshow, or a sharp deceleration in reported payment-volume growth. Before any capital is committed at the reported ask, the priority diligence asks are: the cap table and preference stack, audited financials, independent payment-volume verification, RedotPay Connect''s standalone revenue contribution, the identity of RedotPay''s card-issuing or BaaS partner, and confirmation of a permanent CFO appointment.'
