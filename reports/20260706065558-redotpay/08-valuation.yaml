- id: TV005
  title: Thesis-break and kill triggers
  layout: wide
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO priced materially below the $4B ask
    - Confirmed pricing under ~$2B in an S-1/424B4 or press reporting
    - Signals the market rejects self-reported metrics at face value
    - Re-underwrite at the realized multiple, not the headline ask
  - - Underwriter withdrawal
    - Public confirmation that JPMorgan Chase, Goldman Sachs, or Jefferies exits the syndicate
    - Removes an institutional validation signal for the deal
    - Treat as a red flag pausing any pre-IPO commitment
  - - Confirmed regulatory enforcement action
    - Formal SFC/HKMA/MiCA enforcement, licence denial, or public warning
    - Invalidates any compliance-first valuation premium
    - Kill criterion -- exit or avoid new commitment
  - - Permanent CFO hire fails to materialize
    - No confirmed CFO announced before the IPO roadshow
    - Signals unresolved governance/financial-controls risk
    - Delay commitment until a permanent CFO is in place
  - - Payment-volume growth decelerates sharply
    - Confirmed growth below ~20% year-on-year in company disclosure or an S-1
    - Removes the primary metric underpinning the valuation ask
    - Reassess valuation toward the lower end of the comparable range
  - - Audited margin disclosure falls short of implied economics
    - S-1 or 10-K shows gross margin materially below the ~1.5% blended take-rate implied today
    - Undercuts the profitability narrative supporting the multiple
    - Re-run the scenario model using the actual disclosed margin
  notes: Triggers and thresholds are this author's judgment calibrated to the specific evidence gaps identified in this and prior chapters; none is a company-disclosed covenant.
  claimRefs:
  - CV044
  - CV045
  - CV034
  - CV031
- id: TV006
  title: Final diligence asks
  layout: wide
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table & preference stack
    - Post-money cap table, liquidation preferences, board seats
    - Determines common-equity value at any headline valuation
    - Request from RedotPay or its underwriters ahead of any pre-IPO commitment
  - - Audited financials
    - Gross margin, cash position, cost of revenue
    - No valuation method is reliable without audited inputs
    - Await the S-1 filing, or require audited financials as an investment condition
  - - Independent volume verification
    - Processor/network-level settlement data
    - The central metric behind the $4B ask is otherwise self-reported
    - Obtain via card-network reporting or audited revenue-recognition notes
  - - RedotPay Connect (B2B) contribution
    - Merchant count, GMV, and revenue split versus the legacy consumer card
    - Stated new growth driver with zero independent disclosure to date
    - Request segment-level reporting in any pre-IPO data room
  - - Named banking / card-issuing partner
    - Identity and concentration risk of the underlying BaaS/issuing bank
    - Precedent (Quicko/Monavate) shows single-partner failure risk can halt card operations overnight
    - Request partner disclosure directly from RedotPay
  - - Permanent CFO appointment
    - Confirmed named CFO
    - Signals stabilized financial governance ahead of an IPO
    - Monitor company disclosures and press through the IPO process
  notes: Rows synthesize the evidenceGaps recorded in this chapter's localEvidence with two additional exit-readiness asks; owner/diligence path is this author's recommended next step, not a company commitment.
