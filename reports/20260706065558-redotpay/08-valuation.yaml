  - - Bull
    - RedotPay Connect scales quickly, triple-digit volume growth continues, no adverse regulatory action surfaces
    - IPO prices at or above the reported $4B ask, ~25x+ revenue
    - Requires disclosure that materially exceeds anything in current public evidence
    - Would require the market to re-rate stablecoin-card names well above current comps
