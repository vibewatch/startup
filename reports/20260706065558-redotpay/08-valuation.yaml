- id: comparable-valuation-framework
  title: Comparable Valuation Framework
  body: Because RedotPay is privately held with no audited financials, this chapter builds a comparable set spanning RedotPay's own rounds, its closest stablecoin-card private-market peers (Kast, Rain), adjacent 2026 M&A (Payward/Reap, Mastercard/BVNK), and public stablecoin/crypto-payments comps (Circle, Coinbase, Chime). Public comps price in a narrow 6x-9x trailing-revenue band; Windsor Drake's Q2 2026 sector research places stablecoin-rails infrastructure specifically at 9x-14x EV/Revenue, versus 5x-9x for exchange/trading models. Applying that sector band to RedotPay's own $150-158 million reported revenue implies a valuation of roughly $1.4-2.2 billion -- well below the reported $4 billion IPO target and closer to RedotPay's own December 2025 private mark. The $4 billion ask instead implies a roughly 25x-27x revenue multiple, a premium that recent M&A prices ($600 million for Reap, up to $1.8 billion for BVNK) do not obviously support as a valuation floor.
