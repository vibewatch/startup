    - Regulatory action, further executive churn, volume growth stalling
    - Plausible given current disclosure gaps and precedent of fast private markups reversing in downturns
  - - Base
    - 2025 growth trajectory continues at a more moderate pace, IPO process completes without major surprises
    - IPO prices around $2.0-3.0B, ~13x-19x revenue, near Windsor Drake's 9x-14x stablecoin-rails benchmark
