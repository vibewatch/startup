      topic: segmentation
      sourceRefs: [SU001, SU002]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QU001]
    - id: CU002
      statement: RedotPay's AWS case study describes the company's platform as focused on "underserved markets across Africa, South America, and the Middle East," indicating a deliberate emerging-market retail and remittance customer focus.
      type: third-party-reported
      topic: segmentation
      sourceRefs: [SU008]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QU001]
    - id: CU003
      statement: RedotPay's Fireblocks customer interview states that the majority of its users are "everyday consumers" rather than crypto-native traders, alongside a meaningful base of users lacking access to traditional banking infrastructure.
      type: third-party-reported
      topic: segmentation
      sourceRefs: [SU010]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QU001, QU016]
    - id: CU004
      statement: An independent Nigeria-focused guide frames retail RedotPay usage around holding USDT for inflation protection and then spending it via a virtual or physical Visa card, a savings-plus-spending motivation distinct from pure remittance.
      type: third-party-reported
      topic: segmentation
      sourceRefs: [SU011]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QU001]
    - id: CU005
      statement: RedotPay Connect, launched in June 2026, targets a new B2B merchant segment (e-commerce, SaaS, logistics, wholesale) structurally distinct from RedotPay's existing consumer card and remittance customers.
      type: company-claimed
      topic: segmentation
      sourceRefs: [SU002, SU004]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QU001, QU013]
    - id: CU006
      statement: RedotPay relies on partners including Sumsub (KYC), Fireblocks (custody), AWS (infrastructure), and OpenPayd (treasury/cross-border rails) to serve its retail and remittance customer segments.
