figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: RedotPay's journey runs from app discovery through tiered KYC, funding/spend, cross-border payout, and — as of mid-2026 — an early B2B/agentic expansion loop.
    data:
      nodes:
        - id: discover
          label: Discover and sign up
          detail: App-store discovery and account creation via email, Google, or Apple ID.
          tone: positive
        - id: verify
          label: Tiered KYC verification
          detail: Level 1 (email/basic details) and Level 2 (NIN/BVN/passport) verification; independent guides report occasional rejection loops.
          tone: neutral
        - id: fund-spend
          label: Fund wallet and spend
          detail: Fund with stablecoins/crypto; spend via virtual (10 USDT) or physical (100 USDT) Visa card.
          tone: positive
        - id: remit-payout
          label: Cross-border remit and payout
          detail: Convert crypto to local currency via Ripple/XRP or OpenPayd rails for bank/e-wallet payout.
          tone: positive
        - id: expand-b2b
          label: Expand to Connect and agentic payments
          detail: June 2026 RedotPay Connect B2B gateway and forthcoming agentic-payments (RedotPay Skill) expansion loop.
          tone: warning
    approximationNotes: Stage sequencing is inferred from RedotPay's own product pages, help-center articles, and partner case studies; no company-published funnel diagram was located.
    claimRefs: [CU033, CU034, CU007, CU017, CU005]
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Public proof narrows sharply from broad reported user counts to named production evidence, and collapses entirely at the new B2B merchant layer.
    data:
      items:
        - label: Registered/verified users reported (2023-2026)
          value: 7000000
        - label: Combined app-store rated users (iOS + Android reviews)
          value: 70300
        - label: Independent/adverse review volume (Trustpilot + JustUseApp problem reports)
          value: 816
        - label: Named production-proof entries (this chapter's enumeration table)
          value: 6
        - label: Publicly named B2B RedotPay Connect merchants (since June 2026)
          value: 0
    approximationNotes: Values are counts of distinct public proof points discussed in this chapter, not internal RedotPay funnel metrics; app-store and review counts are approximate as reported by each platform.
    claimRefs: [CU009, CU015, CU020, CU024]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Evidence is strongest on production maturity and outcome specificity for partner case studies, and weakest on retention visibility across every proof source.
    data:
      columns: [Evidence quality, Outcome specificity, Retention visibility, Production maturity]
      rows:
        - label: App Store rating (iOS, 4.77/5)
          values:
            - {label: high, detail: 'Large aggregate sample of ~3,600 ratings.', tone: positive}
            - {label: low, detail: No individual outcome narrative attached., tone: neutral}
            - {label: low, detail: Rating reflects sentiment at review time only., tone: warning}
            - {label: high, detail: Long-standing production app usage., tone: positive}
        - label: Trustpilot reviews (2.9/5, ~750 reviews)
          values:
            - {label: medium, detail: Independent third-party review platform., tone: neutral}
            - {label: medium, detail: 'Specific complaint themes: freezes, verification.', tone: warning}
            - {label: low, detail: No cohort or repeat-usage data., tone: warning}
            - {label: high, detail: Years of continuous active reviews., tone: positive}
        - label: JustUseApp aggregator (0/100 sentiment)
          values:
            - {label: low, detail: Algorithmic sentiment score with opaque methodology., tone: warning}
            - {label: medium, detail: Names specific failure modes such as frozen accounts., tone: warning}
            - {label: low, detail: No retention or repeat-usage metric., tone: warning}
            - {label: medium, detail: Reflects only the support-escalation subset of users., tone: neutral}
        - label: AWS/Sumsub/Fireblocks partner case studies
          values:
            - {label: medium, detail: Vendor-published, RedotPay-approved quotes., tone: neutral}
            - {label: high, detail: 'Concrete figures: 5M users, 90% KYC pass rate, ~2-minute payouts.', tone: positive}
            - {label: low, detail: No churn or renewal data disclosed., tone: warning}
            - {label: high, detail: Multi-year live production integrations., tone: positive}
        - label: RedotPay Connect merchant proof (June 2026 launch)
          values:
            - {label: low, detail: Press-release only; no named merchants., tone: warning}
            - {label: low, detail: No case-level fee-savings example yet., tone: warning}
            - {label: low, detail: Too new to assess any retention., tone: warning}
            - {label: low, detail: Launched June 2026; pre-production evidence only., tone: warning}
    approximationNotes: Labels (high/medium/low) and tones are this chapter's qualitative assessment of publicly available evidence, not a RedotPay-published scorecard.
    claimRefs: [CU018, CU020, CU026, CU006, CU024]
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: No RedotPay-specific cohort retention data is public; illustrative proxy scores stay flat or decay slightly across time buckets, and disclosed-retention-metric availability is zero at every horizon.
    data:
      columns: [Month 1, Month 3, Month 6, Year 1]
      rows:
        - label: KYC verification pass-through (Sumsub-reported, flat)
          values: [90, 90, 90, 90]
        - label: App-store rating durability (iOS/Android proxy)
          values: [95, 93, 90, 88]
        - label: Independent review-score durability (Trustpilot proxy)
          values: [58, 55, 52, 50]
        - label: Disclosed NRR/churn metric availability
          values: [0, 0, 0, 0]
    approximationNotes: No RedotPay-specific cohort or repeat-usage percentage is publicly disclosed; this figure substitutes illustrative evidence-strength proxies (a flat KYC pass-rate, ratings normalized to a 0-100 scale, and disclosed-metric availability) for true retention percentages, and should not be read as company-reported retention.
    claimRefs: [CU034, CU018, CU019, CU020, CU031]
callouts:
  - calloutType: strength
    title: Deep, fast-moving emerging-market distribution
    body: RedotPay's clearest customer-side strength is distribution depth in underserved markets — 5-7 million-plus reported users, 300,000-plus physical cards issued within two months of launch, and an AWS-cited focus on Africa, South America, and the Middle East — rather than any single flagship enterprise account.
    claimRefs: [CU002, CU007, CU008]
  - calloutType: risk
    title: Support and verification friction dominate independent complaints
    body: Trustpilot's mixed 2.9/5 score, JustUseApp's 0/100 sentiment read, and virtualcredit.cards' account-freeze reports all point to the same friction points — slow support and unpredictable verification — as RedotPay's most consistent adverse customer signal.
    claimRefs: [CU025, CU026, CU028]
  - calloutType: risk
    title: Retention, churn, and B2B traction remain undisclosed
    body: No source reviewed discloses RedotPay's NRR, churn, or renewal data, and its one-month-old RedotPay Connect B2B gateway has no publicly named merchant customer yet, leaving two of the most decision-relevant customer metrics as open diligence items.
    claimRefs: [CU031, CU024, CU042]
