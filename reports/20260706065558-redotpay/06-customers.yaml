  evidenceGaps:
    - type: missing-source
      severity: material
      topic: RedotPay Connect adoption verification
      missingEvidence: Independent, non-company data on actual RedotPay Connect merchant count, transaction volume, or active-user reach versus the cited 700-million addressable wallet base.
      whyItMatters: Without independent corroboration, the 700-million figure is a market-size claim rather than evidence of RedotPay Connect's own traction, which materially affects the credibility of the B2B expansion thesis.
      diligencePath: Request RedotPay Connect merchant count, transaction volume, and take-rate data directly, or wait for independent trade-press coverage of early adopters.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: []
    - type: missing-source
      severity: blocking
      topic: retention churn and renewal metrics
      missingEvidence: RedotPay-specific net revenue retention, gross/logo churn, and renewal-rate data by segment and vintage.
      whyItMatters: These are the core metrics needed to judge durability of the installed base and the sustainability of RedotPay's reported user-growth trajectory.
      diligencePath: Request cohort retention dashboards, churn definitions, and renewal data directly from RedotPay during diligence.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU004]
    - type: enumeration-incomplete
      severity: material
      topic: named B2B merchant case study coverage for the named-customer-proof table
      missingEvidence: A named, independently confirmed B2B merchant customer of RedotPay Connect.
      whyItMatters: Without at least one named merchant reference, RedotPay Connect's product-market fit for the B2B segment cannot be assessed beyond press-release claims.
      diligencePath: Track RedotPay Connect merchant announcements and conference case studies (e.g., Money20/20) for named references as the product matures.
      relatedQuestionRefs: [QU015]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: active versus registered user split
      missingEvidence: A breakdown of RedotPay's reported 7 million-plus users into active-versus-registered, or monthly-active-user, categories.
      whyItMatters: Registered-user counts can materially overstate real engagement; without an active split, adoption-trajectory figures cannot be compared cleanly across time periods or against peers.
      diligencePath: Request monthly-active-user, geography, and cohort-vintage breakdowns directly from RedotPay.
      relatedQuestionRefs: [QU026]
      relatedTableRefs: [TU002]
    - type: conflicting-data
      severity: minor
      topic: customer concentration risk in emerging markets
      missingEvidence: A RedotPay-published geographic revenue or active-user mix confirming the degree of concentration in Nigeria, Argentina, Bangladesh, and Egypt.
      whyItMatters: Concentration in inflation-prone or capital-controlled markets creates FX-policy and regulatory exposure that could disproportionately affect revenue if any single market tightens capital controls.
      diligencePath: Request geographic revenue and active-user mix, plus scenario analysis for capital-control tightening in top markets.
