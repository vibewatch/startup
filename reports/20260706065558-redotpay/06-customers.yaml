    - id: CU001
      statement: RedotPay's own product and news pages describe five overlapping customer segments — everyday card spenders, remittance senders/receivers, freelancers/creators paid in crypto, unbanked/underbanked emerging-market users, and (since June 2026) B2B merchants via RedotPay Connect.
