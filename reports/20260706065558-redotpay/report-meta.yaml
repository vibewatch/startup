companyProfile:
  summary: >-
    RedotPay is a Hong Kong-linked stablecoin payments company founded in April 2023 that bundles a
    multi-currency wallet, Visa-linked spending cards, global payout rails, and crypto-backed credit
    into a consumer-finance stack aimed at turning stablecoins into everyday spending and remittance
    tools. The company has scaled quickly through 2025-2026 funding rounds and says it now serves
    millions of users across 100+ markets, but its public disclosure still relies heavily on company
    statements rather than audited financials or prospectus-grade operating detail.
  founders:
    - name: Michael Gao
      role: Co-Founder and CEO
      background: Former DBS banker and the primary public face of RedotPay’s financing, compliance, and expansion narrative.
      claimRefs:
        - CO011
        - CO012
    - name: Jonathan Chan
      role: Co-Founder and Head of Partnerships
      background: Publicly surfaced as the founder-level owner of infrastructure and commercial partnerships such as OpenPayd.
      claimRefs:
        - CO013
  foundingLocation: Hong Kong
  headquarters: Hong Kong
  productSummary: >-
    Stablecoin-based cards, a multi-currency crypto wallet, global payout rails that settle into local
    bank accounts or e-wallets, crypto-backed credit, and a newer B2B gateway called RedotPay Connect.
  customerFocus: >-
    Crypto-native consumers, remittance senders and receivers, underbanked users in emerging markets,
    freelancers paid in stablecoins, and merchants seeking stablecoin acceptance with local-currency
    settlement.
  businessModel: >-
    Consumer monetization appears to come primarily from crypto-to-fiat conversion fees, FX markup,
    card issuance and ancillary card fees, with a newer merchant-settlement revenue line emerging via
    RedotPay Connect.
  stage: Growth / late-stage private / IPO candidate
  fundingStatus: >-
    RedotPay announced a $40 million Series A in March 2025, a $47 million strategic round in September
    2025 that established a $1 billion unicorn valuation, and a $107 million Series B in December 2025
    that brought 2025 capital raised to $194 million. Independent reporting later said the company was
    exploring a U.S. IPO at a valuation above $4 billion, but no filing was public as of the run date.
