evidenceGaps:
  - type: missing-source
    severity: material
    topic: active-user-and-headcount-disclosure
    missingEvidence: A current public disclosure of MAU/DAU, active-user definition, and employee headcount.
    whyItMatters: Registered-user and download counts do not reveal engagement quality, operating leverage, or support burden.
    diligencePath: >-
      Request board materials or investor updates that reconcile registered users, active users, merchants, and
      headcount as of 2026.
    relatedQuestionRefs:
      - QO023
      - QO026
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: hong-kong-licence-granularity
    missingEvidence: >-
      Exact Hong Kong licence numbers, issuing entities, and scope boundaries for money-lender, TCSP, custody, and any
      payment-service permissions.
    whyItMatters: >-
      The current disclosure proves intent and some licensing posture but not which entity holds which permission or
      whether those permissions fully cover all marketed services.
    diligencePath: Ask management for a jurisdiction-by-jurisdiction licensing matrix tied to each group entity and product line.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-control-rights
    missingEvidence: A full board roster, committee structure, post-Series B cap table, and reserved-matter framework.
    whyItMatters: >-
      Without governance detail, investors cannot fully assess control concentration, succession depth, or
      strategic-investor influence over licensing and expansion decisions.
    diligencePath: >-
      Request the latest board deck, shareholder agreement summary, and post-money ownership table during management
      diligence.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: current-scale-corroboration
    missingEvidence: Independent 2026 corroboration for the latest 8M+ users and $12B payment-volume marketing claims.
    whyItMatters: >-
      Later marketing pages show scale acceleration beyond the 2025 fundraising data, but those claims are not
      independently validated in reviewed third-party reporting.
    diligencePath: >-
      Ask for monthly management reporting or banking/processor partner attestations that reconcile the latest user,
      TPV, and revenue claims.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
      - TO004
  - type: conflicting-data
    severity: material
    topic: systemic-risk-contagion
    missingEvidence: >-
      A quantified estimate of how a stablecoin issuer stress event would specifically transmit to consumer-facing card
      and payout providers (as opposed to the broad Treasury-market spillover the IMF and BIS quantify).
    whyItMatters: >-
      RedotPay's entire product depends on stablecoin rails remaining liquid and redeemable; a redemption-run scenario
      at a dominant issuer could disrupt user withdrawals or card funding even if RedotPay itself holds no direct issuer
      exposure.
    diligencePath: >-
      Request RedotPay's issuer/reserve diversification policy and any documented contingency plan for a stablecoin
      de-peg or redemption-run scenario, and cross-check against the specific stablecoins its card and wallet products
      actually settle in.
    relatedQuestionRefs:
      - QM025
  - type: enumeration-incomplete
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: >-
      A bottom-up serviceable-obtainable-market (SOM) figure specific to a licensed stablecoin-card operator's actual
      jurisdictions and target user segments, rather than the top-down adjacent-market lenses cited in this chapter.
    whyItMatters: >-
      Without a bottom-up SOM, investors cannot distinguish a genuinely large addressable opportunity from an optimistic
      narrative built on adjacent-market headline numbers that do not map cleanly onto the product.
    diligencePath: >-
      Request management's internal TAM/SAM/SOM methodology, including assumptions on licensed-corridor population, card
      attach rate, and average balance, and compare it against the external lenses in this chapter.
    relatedQuestionRefs:
      - QM029
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: regulatory-constraints
    missingEvidence: >-
      A primary ESMA/EBA data point confirming the approximately 45% MiCA stablecoin-issuer-application rejection rate,
      which currently rests on a single secondary industry blog.
    whyItMatters: >-
      An inflated or inaccurate rejection-rate statistic would overstate EU regulatory friction and distort the
      growth-driver/constraint balance in this chapter.
    diligencePath: >-
      Pull ESMA's or EBA's own published register of authorized versus rejected e-money-token applications to verify or
      replace the cited rejection rate.
    relatedQuestionRefs:
      - QM021
  - type: stale
    severity: minor
    topic: market-sizing
    missingEvidence: >-
      An updated Citi GPS (or equivalent) 2030 stablecoin forecast dated closer to the report run date, given that
      Citi's own base/bull case moved materially within a single six-month window in 2025.
    whyItMatters: >-
      Forecast volatility this high means the cited $1.9T-$4.0T 2030 range could already be stale by the time later
      diligence occurs, and investors should treat it as directional rather than fixed.
    diligencePath: >-
      Re-pull the most recent Citi GPS (or Standard Chartered/other tier-one bank) stablecoin forecast at each refresh
      cycle rather than relying on the September 2025 figures cited here.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Gnosis Pay independent volume verification
    missingEvidence: Independent (non-company) verification of Gnosis Pay’s $100M+ lifetime volume and 1.6M+ transaction figures.
    whyItMatters: >-
