      - number: '1.3'
        title: Funding Trajectory, Valuation Evidence, and Scale Claims
        blocks:
          - type: paragraph
            body: >-
              RedotPay’s capital formation story moved unusually quickly in 2025. The company publicly announced a $40
              million Series A in March 2025 led by Lightspeed, then a $47 million strategic round in September 2025
              that brought in Coinbase Ventures and pushed the company onto Crunchbase’s unicorn board at a $1 billion
              valuation. By December 2025, PR Newswire distributed RedotPay’s announcement of a $107 million Series B,
              which the company said brought total capital raised in 2025 to $194 million. The strongest valuation
              evidence in the chapter is therefore still the September 2025 unicorn round rather than later marketing
              language, because that is the last clearly closed pricing event surfaced in reviewed sources.


              The more ambiguous issue is how to interpret RedotPay’s scale narrative. Series A said the platform had
              more than 3 million registered users; the strategic round said more than 5 million users and $10 billion
              in annualized TPV; Series B raised that to more than 6 million registered users, more than $10 billion in
              annualized payment volume, and more than $150 million in annualized revenue; current 2026 marketing pages
              now say 8 million-plus users and $12 billion payment volume. This progression is directionally strong, but
              it is still largely company-reported. Public sources do not separate registered from active users, do not
              define how annualized volume is calculated, and do not provide audited financial statements for the
              revenue figure. Investors can therefore treat the growth curve as plausible and strategically important
              while still classifying the latest scale claims as management assertions that need harder third-party or
              audited confirmation.
