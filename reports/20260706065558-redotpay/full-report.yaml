  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Revenue Mix
        blocks:
          - type: paragraph
            body: >-
              RedotPay monetizes stablecoin spending primarily through a 1% crypto-to-fiat conversion fee, layered with
              a 1.2% foreign-exchange markup on non-USD transactions, one-time card issuance fees of $10 (virtual) or
              $100 (physical), and ancillary charges for small transactions, declines, and ATM withdrawals. Independent
              press coverage puts RedotPay's annualized payment volume above $10 billion and annualized revenue above
              $150-158 million as of late 2025 into 2026, implying a blended take rate near 1.5% once every fee line is
              combined into a single reported top line. In June 2026 RedotPay launched RedotPay Connect, a B2B
              stablecoin settlement gateway that lets merchants accept stablecoins and settle instantly in local
              currency; the company markets Connect as cutting merchant discount rates by up to 70% versus legacy card
              and bank rails. No source reviewed breaks out how much of the reported revenue comes from consumer fees
              versus the newly launched Connect line, nor whether revenue is recognized gross or net of network and
              issuer costs -- a recognition question that matters more as the merchant-facing business scales.
