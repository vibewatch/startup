            claimRefs:
              - CV038
              - CV036
              - CV003
              - CV004
      - number: '8.6'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              RedotPay's most advanced disclosed capital-markets event is its prospective US IPO process with JPMorgan
              Chase, Goldman Sachs, and Jefferies engaged, rather than any announced direct listing, SPAC, or organized
              secondary sale; public reporting frames the potential listing as one of the largest by an Asian
              crypto-linked fintech. Credible thesis-break triggers include an IPO price materially below the $4 billion
              ask, withdrawal of any named underwriter, a confirmed SFC/HKMA/MiCA enforcement action, a failure to name
              a permanent CFO before the roadshow, or a sharp deceleration in reported payment-volume growth. Before any
              capital is committed at the reported ask, the priority diligence asks are: the cap table and preference
              stack, audited financials, independent payment-volume verification, RedotPay Connect's standalone revenue
              contribution, the identity of RedotPay's card-issuing or BaaS partner, and confirmation of a permanent CFO
              appointment.
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
              - CV008
              - CV034
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV044
              - CV045
              - CV034
              - CV031
          - type: table
            tableRef: TV006
            claimRefs:
              - CV008
              - CV034
              - CV039
              - CV040
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: A $4B ask implies a 25x-27x revenue multiple with no audited support
            body: >-
              RedotPay's reported IPO target of more than $4 billion, set against its own $150-158 million annualized
              revenue, implies roughly 25x-27x trailing revenue -- well above the 6x-9x multiples at Coinbase, Chime,
              and Circle's own IPO pricing, and above the 9x-14x stablecoin-rails benchmark Windsor Drake tracks. No
              audited financials are available to test whether margin or growth durability justifies the premium.
            calloutType: risk
            claimRefs:
              - CV037
              - CV038
          - type: callout
            title: A genuinely receptive 2026 capital market for stablecoin-card names
            body: >-
              Kast's $600 million Series A and Rain's $1.95 billion Series C, both closed within the same twelve-month
              window as RedotPay's own rounds, show institutional capital is actively pricing stablecoin-card and
              payments-infrastructure businesses at multi-hundred-million to multi-billion-dollar valuations, which
              supports RedotPay's ability to raise -- though not the specific level of its own ask.
            calloutType: strength
            claimRefs:
              - CV010
              - CV012
              - CV046
          - type: callout
            title: Research-more until an S-1 or audited financials narrow the valuation range
            body: >-
              Given the gap between RedotPay's $4 billion IPO target and the $1.4-2.2 billion implied by
              sector-comparable multiples, and given the absence of audited financials, a named banking partner, or
              disclosed cap-table terms, the appropriate call today is research-more: track the IPO filing and revisit
              valuation once audited disclosure narrows the current wide range.
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV034
              - CV044
