      - number: '2.2'
        title: Market Sizing Across Multiple Lenses -- Stablecoins, Cross-Border Payments, and Crypto Cards
        blocks:
          - type: paragraph
            body: >-
              No single reviewed source gives a clean TAM/SAM/SOM figure specific to stablecoin-based consumer cards and
              payouts, so this chapter triangulates across five adjacent lenses rather than anchoring on one broad
              number. At the observed end, the total stablecoin market capitalization stood at roughly $311 billion in
              early July 2026 across 382 tracked tokens, per DeFiLlama's on-chain aggregation, with Tether (USDT) and
              USD Coin (USDC) together holding about 83% of that supply and Ethereum and Tron together hosting nearly
              80% of it by chain. On the forward-looking side, Citi's GPS research revised its 2030 stablecoin issuance
              forecast twice within six months of 2025, moving its base case from $1.6 trillion to $1.9 trillion and its
              bull case from $3.7 trillion to $4.0 trillion -- a useful reminder that even a top-tier bank's own
              scenario range moved by roughly 20% in a single reporting cycle.


              Payment-volume estimates are even more sensitive to methodology: Andreessen Horowitz's State of Crypto
              2025 report found stablecoins processed $46 trillion in total on-chain transaction volume over the
              trailing year, but after stripping out bot-driven and arbitrage activity the adjusted figure fell to
              roughly $9 trillion -- still above PayPal's throughput but five times smaller than the unadjusted
              headline, which is the kind of gap that makes single-lens sizing unreliable. Two broader lenses bound the
              opportunity from above: McKinsey's 2025 Global Payments Report puts the entire global payments industry at
              $2.5 trillion in 2024 revenue growing toward roughly $3 trillion by 2029, and FXC Intelligence separately
              projects the B2B cross-border payments segment's addressable revenue pool reaching about $67 trillion in
              flow-adjacent TAM terms by 2033. At the narrow end, The Business Research Company's
              crypto-credit-card-specific estimate of $1.81 billion (2025) growing to $4.19 billion (2030) at an 18.2%
              CAGR almost certainly understates RedotPay's true product category because it excludes prepaid and
              debit-style cards.
