      - number: '1.4'
        title: Compliance Footprint and Hong Kong Regulatory Context
        blocks:
          - type: paragraph
            body: >-
              Compliance is central to RedotPay’s self-description, and the company’s own pages try to make that
              explicit. The about page says RedotPay holds or relies on registrations across Argentina, Canada, the
              United States, and Hong Kong, while also highlighting ISO/IEC 27001, PCI DSS, MPC custody, MFA, and
              real-time screening. The privacy policy goes further by showing the operational implication of that
              posture: RedotPay says it may collect extensive identity, device, blockchain-address, and biometric data
              to support onboarding and compliance. This is consistent with a product that wants to touch both crypto
              assets and real-world payments, but it also means RedotPay’s operating model is inseparable from KYC, AML,
              custody, and data-protection execution.


              That compliance burden is especially relevant in Hong Kong because the jurisdiction tightened its
              stablecoin framework in 2025. HKMA’s July 2025 announcement formally implemented the stablecoin issuer
              regime, and Davis Polk’s analysis emphasizes that the regime comes with real capitalization and licensing
              requirements, including a minimum paid-up share capital threshold for licensees that are not authorized
              institutions. RedotPay is not publicly positioning itself as a Hong Kong stablecoin issuer, but it is a
              Hong Kong-based stablecoin-payments company that says it is expanding licensing and compliance
              infrastructure. The practical diligence implication is that RedotPay’s ability to keep scaling
              internationally will depend not only on user growth but on whether its multi-jurisdiction licensing stack
              remains robust enough to support cards, custody-adjacent services, lending, payouts, and local-currency
              settlement as rulebooks harden.
            claimRefs:
              - CO020
              - CO021
              - CO022
              - CO023
              - CO038
              - CO039
              - CO044
      - number: '1.5'
        title: Milestones, Expansion Signals, and Adverse Operating Evidence
        blocks:
          - type: paragraph
            body: >-
              RedotPay’s milestone pattern suggests a company moving from consumer launch into infrastructure depth. The
              September 2025 unicorn announcement retroactively highlighted the June 2025 launch of Global Payout, while
              2026 brought two more strategically important signals: a May announcement that RedotPay would establish a
              local entity and permanent team in Gelephu Mindfulness City, and a June announcement that it selected
              OpenPayd to improve treasury operations, multi-currency payments, and cross-border remittances. These
              steps matter because they show management pushing beyond simple card issuance toward corridor expansion,
              local presence, and deeper payments infrastructure. They also reinforce that RedotPay is trying to build a
              broader cross-border money movement platform rather than a single crypto card SKU.


              At the same time, the public evidence is not uniformly positive. Review surfaces show a meaningful layer
              of customer friction around deposits, support response times, and card declines. Trustpilot’s archived
              page displayed a high share of one-star reviews, and a July 2026 Google Play review complained that
              declined Visa transactions still triggered a $0.50 fee. JustUseApp’s automated 0/100 score is too
              low-quality to anchor a thesis by itself, but it is still an adverse external signal that the company’s
              public reputation is not spotless. The combination of fast growth, regulatory expansion, and visible
              customer-service friction is typical of high-velocity fintechs, but it means RedotPay’s operational
              maturity still needs to catch up with the ambition implied by its valuation and international footprint.
