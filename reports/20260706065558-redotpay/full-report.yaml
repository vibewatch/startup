      - number: '5.3'
        title: Customer & Merchant Workflows
        blocks:
          - type: paragraph
            body: >-
              A new RedotPay user registers with email or phone, confirms an OTP, may optionally enable two-factor
              authentication through an authenticator app, and must then complete mandatory Sumsub-based identity
              verification — full legal name, date of birth, and a government ID — before the account unlocks full
              functionality. Once verified, spending at a merchant simply taps the Visa-network card, which converts
              wallet balance at the point of sale. Cross-border transfers use a multi-market payout rail that RedotPay's
              cloud vendor case study describes completing a Brazil bank payout in about two minutes, versus one to two
              days on traditional rails, though that figure is company-reported rather than independently audited.
              Merchants accepting stablecoins through RedotPay Connect walk customers through wallet selection, order
              review, and instant on-chain confirmation, then manage settlement, refunds, and chargebacks from a
              merchant dashboard fed by the same webhook and OpenAPI layer. The newest workflow — an AI agent completing
              a purchase via the CLI's MPP integration — requires the agent to disclose the exact service, cost, and
              spend cap before any payment executes, and RedotPay's own published anti-fraud guidance separately warns
              users about clipboard-hijacking malware that swaps wallet addresses before a manual send.
