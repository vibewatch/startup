  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation Snapshot
        blocks:
          - type: paragraph
            body: >-
              RedotPay's evidence base supports a research-more call rather than a buy or an avoid. The company's
              self-reported scale -- more than 6 million users, over $10 billion in annualized payment volume, and more
              than $150 million in annualized revenue as of November 2025 -- is real enough to have attracted Goodwater
              Capital, Pantera Capital, Circle Ventures, and a syndicate of earlier crypto-native and generalist
              investors across three 2025 rounds. But the same evidence base has no audited financials, no disclosed cap
              table or liquidation-preference terms, and no named card-issuing or BaaS partner, at the same time
              Bloomberg-sourced reporting has RedotPay targeting a US IPO valuation of more than $4 billion -- roughly a
              4x step-up from its December 2025 private mark within about two months. Confidence is low-medium and risk
              rating is high, driven by regulatory-licensing gaps and leadership turnover documented in the risks
              chapter. The valuation stance is stretched: a $4 billion target implies a materially richer revenue
              multiple than public comparables or sector benchmarks currently support.
            claimRefs:
              - CV033
              - CV004
              - CV034
              - CV037
          - type: table
            tableRef: TV001
            claimRefs:
              - CV033
              - CV037
              - CV044
              - CV034
