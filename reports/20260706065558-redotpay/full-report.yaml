      - number: '7.2'
        title: Operational, Security & Consumer-Protection Risk
        blocks:
          - type: paragraph
            body: >-
              RedotPay's operational risk surface centers on custody concentration, a narrowly scoped security
              certification, and a persistent pattern of account-freeze complaints. The company has relied on Fireblocks
              for centralized wallet custody since 2024 without disclosing a secondary custodian, and its 2026 ISO/IEC
              27001 certification (via SGS) is explicitly scoped to a 'backbone infrastructure operation' rather than
              the whole organization. An independent security scanner separately flagged, at 95% confidence, that
              RedotPay's agent-facing CLI skill defines overly broad trigger phrases that could cause unintended
              activation of paid service-discovery or payment workflows. On the consumer side, aggregated Trustpilot
              data shows roughly 35% of about 715 reviews are 1-2 star, with account freezes cited as the single most
              common serious complaint; one reviewer described support confirming a cancellation request during a
              security hold before a roughly 12,000 USDT transaction reportedly completed anyway. An independent
              scam-review site found no verifiable evidence RedotPay is regulated by tier-one authorities such as the
              FCA, ASIC, or CySEC, and a separate affiliate review's 'non-custodial' characterization of the product
              directly conflicts with Fireblocks' own account of providing centralized custody — an unresolved factual
              conflict that matters because it changes who bears freeze and counterparty risk. RedotPay's own Credit
              product documentation confirms that a 0.9 risk index triggers automatic collateral liquidation, two-factor
              authentication remains optional rather than mandatory, and its published chargeback process discloses no
              service-level timelines or success-rate statistics.
