      - number: '7.3'
        title: Partner & Infrastructure Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              RedotPay's operating model rests on a short list of named, single-vendor dependencies plus at least one
              materially unnamed one. Confirmed vendor case studies show reliance on AWS for cloud hosting and
              twice-weekly production deploys, Fireblocks for wallet custody, and Sumsub for automated KYC, none of
              which disclose multi-vendor redundancy. RedotPay's supported USDC balances depend on Circle's reserve
              structure, the majority of which sits in a single SEC-registered money-market fund managed by BlackRock
              per Circle's own transparency disclosures; Circle's S-1 risk factors separately warn that extreme
              redemption requests or reserve-related market shocks could cause redemption delays that would propagate
              directly into RedotPay's stablecoin-denominated balances. Visa's stablecoin settlement volume reaching a
              $7 billion annualized run rate by April 2026 and Mastercard's June 2026 USDC/PYUSD/RLUSD settlement
              support both suggest the major card networks are choosing to keep stablecoin settlement in-network rather
              than terminate compliant programs like RedotPay's. The most consequential unresolved dependency is
              RedotPay's underlying card-issuing bank or Banking-as-a-Service partner, whose identity RedotPay has not
              publicly disclosed. Poland's KNF revocation of BaaS issuer Quicko's payment-services license in early 2026
              — which cut card and banking functionality overnight for its partner fintechs — and a parallel regulatory
              action against Lithuania's Monavate both show how quickly that kind of dependency can become an
              operational shutdown rather than a manageable vendor risk.
