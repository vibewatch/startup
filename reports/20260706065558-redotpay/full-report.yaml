            title: Two undisclosed single points of failure could each halt core functionality overnight
            body: >-
              RedotPay has not named its underlying card-issuing bank or BaaS partner, and relies on a single custodian
              (Fireblocks) for wallet custody without disclosed redundancy. The Quicko/Monavate precedent shows a
              BaaS-partner license revocation can cut card and banking functionality overnight with no transition
