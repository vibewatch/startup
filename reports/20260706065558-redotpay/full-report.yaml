      - number: '1.2'
        title: Leadership, Legal Entities, and Governance Transparency
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence for RedotPay is still concentrated in a small number of names. Michael Gao is
              clearly the company’s external face: official funding releases and independent coverage identify him as
              co-founder and CEO, while Forbes adds the notable detail that he previously worked at DBS. A later
              RedotPay partnership announcement identifies Jonathan Chan as Head of Partnerships and a co-founder, which
              helps confirm that the company is not a one-person public narrative. Beyond those two executives, however,
              disclosure becomes materially thinner. The reviewed public pages do not provide a full board list, an
              independent-director map, or a broader executive bench on par with what investors usually expect from a
              company already valued at unicorn level. That absence does not prove governance weakness, but it does mean
              governance quality cannot yet be underwritten from public evidence alone.


              The legal-entity picture is somewhat more concrete than the board picture because RedotPay’s general terms
              enumerate operating entities. Those terms identify multiple Hong Kong companies—Red F. Technology Limited,
              Red Dot Technology Limited, and Red Dot Trust Limited—and also reference an Argentine branch, RedotX
              (Tango) Limited, tied to VASP registration number 144. App-store listings reinforce that Red Dot
              Technology Limited is the app seller or developer. Together, these disclosures support the conclusion that
              RedotPay runs through a multi-entity structure with Hong Kong as a central operating jurisdiction, but
              they still fall short of a full governance map. For diligence, the key issue is not whether entities
              exist; it is which entity owns what licence, who controls reserved matters, and how board authority is
              distributed across the group.
