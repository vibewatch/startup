companyProfile:
  summary: >-
    RedotPay is a Hong Kong-linked stablecoin payments company founded in April 2023 that bundles a multi-currency
    wallet, Visa-linked spending cards, global payout rails, and crypto-backed credit into a consumer-finance stack
    aimed at turning stablecoins into everyday spending and remittance tools. The company has scaled quickly through
    2025-2026 funding rounds and says it now serves millions of users across 100+ markets, but its public disclosure
    still relies heavily on company statements rather than audited financials or prospectus-grade operating detail.
  founders:
    - name: Michael Gao
      role: Co-Founder and CEO
      background: Former DBS banker and the primary public face of RedotPay’s financing, compliance, and expansion narrative.
      claimRefs:
        - CO011
        - CO012
    - name: Jonathan Chan
      role: Co-Founder and Head of Partnerships
      background: Publicly surfaced as the founder-level owner of infrastructure and commercial partnerships such as OpenPayd.
      claimRefs:
