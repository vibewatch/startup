  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Who Uses RedotPay: Segmentation and Buyer Profile'
        blocks:
          - type: paragraph
            body: >-
              RedotPay's own materials and its infrastructure partners describe a customer base built around five
              overlapping segments rather than one clean buyer type. The core segment is everyday retail crypto spenders
              who fund a RedotPay wallet with stablecoins or major coins and spend it through a virtual or physical Visa
              card; both the user and the payer are the same individual here. A second segment is cross-border
              remittance senders and receivers, who convert crypto into local currency and route it to a bank account or
              e-wallet, a use case RedotPay has pushed hardest in Nigeria, Argentina, and Brazil. A third segment —
              freelancers, creators, and remote workers paid in stablecoins — is explicitly named on RedotPay's own
              international-transfer page, which profiles a designer paid in USDC and a creator earning BTC bridging
              global income to local bills. A fourth, strategically important segment is unbanked or underbanked users
              in emerging markets, which RedotPay's AWS case study frames as a deliberate focus on "underserved markets
              across Africa, South America, and the Middle East." The newest and least evidenced segment is
              business-to-business merchants: RedotPay Connect, launched in June 2026, targets e-commerce, SaaS,
              logistics, and wholesale merchants who want to accept stablecoin payments with instant local-currency
              settlement, a segment where the payer (a consumer holding stablecoins) and the buyer relationship (a
              merchant integrating the gateway) are structurally different from the consumer-card business. RedotPay
              leans on partners — Sumsub for KYC, Fireblocks for custody, AWS for infrastructure, and OpenPayd for
              treasury and cross-border rails — to serve all of these segments, and its Fireblocks interview states
              plainly that "the majority" of its users are everyday consumers rather than crypto-native traders.
