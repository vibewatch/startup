      - number: '4.2'
        title: Go-to-Market Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              RedotPay does not disclose a customer acquisition cost, marketing budget, or payback period, so its
              go-to-market efficiency can only be benchmarked indirectly. Public 2026 benchmarks for comparable
              crypto-card and consumer fintech products put fully loaded CAC in the $85-$200 range per verified
              customer, with structured referral programs cutting CAC by roughly half versus paid channels; RedotPay's
              own growth narrative -- expansion through agent networks, Telegram and community referrals, and payment
              partnerships such as its Ripple/XRP integration for Nigerian remittances -- is directionally consistent
              with a referral-led, lower-cost motion rather than a paid-media-heavy one. The company's user base grew
              from roughly 5 million verified users in an AWS case study published after its late-2023 market entry to
              more than 7 million by mid-2026 press coverage, a multi-year compounding trajectory. Because usage skews
              toward emerging-market remittance, bill-pay, and everyday spend rather than developed-market discretionary
              spend, channel economics likely differ meaningfully from Western neobank comparables, but no
              RedotPay-specific efficiency metric exists to confirm this.
