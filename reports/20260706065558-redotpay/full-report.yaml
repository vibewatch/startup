            body: >-
              RedotPay's public traction metrics are large and consistent across independent sources: more than 6
              million registered users across 100+ countries as of November 2025, rising past 7 million by mid-2026, and
              roughly $391 million in March 2026 crypto-card transaction volume alone -- about 80% of the entire ~$600
