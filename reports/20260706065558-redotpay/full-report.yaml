      - number: '8.5'
        title: Bull / Base / Bear Scenarios and Valuation Range
        blocks:
          - type: paragraph
            body: >-
              A bear scenario sees payment-volume growth decelerate or a regulatory setback land, pricing any IPO near
              $1.0-1.5 billion -- close to RedotPay's own last private mark and in line with the 6x-9x multiples
              observed at Coinbase and Chime. A base scenario assumes RedotPay's 2025 growth trajectory continues at a
              more moderate pace through a clean IPO process, pricing around $2.0-3.0 billion, near Windsor Drake's
              9x-14x stablecoin-rails benchmark. A bull scenario requires RedotPay Connect to scale quickly and volume
              growth to stay in triple digits with no adverse regulatory action, supporting the reported $3.5-4.5
              billion IPO ask. None of these scenarios can currently be weighted with real probabilities because the
              underlying revenue, margin, and volume figures are self-reported; the base case is favored here only
              because it is most consistent with the sector multiples and bank engagement actually observed, not because
              it is independently verified.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV045
              - CV024
