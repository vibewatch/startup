  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Buyer/Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              RedotPay's addressable market sits at the intersection of three categories that most published research
              sizes separately: stablecoin-based payments and remittances, crypto-linked prepaid/debit card spend, and
              the broader cross-border consumer and SME payments market that stablecoins are starting to disrupt.
              Drawing that boundary matters before any sizing exercise, because a headline like "$208 trillion in
              cross-border flows" (FXC Intelligence's 2025 estimate of total global cross-border value moved, alongside
              a $625 billion associated revenue pool) includes enormous volumes of trade finance and interbank
              settlement that RedotPay will never touch, while a narrower "crypto credit card market" estimate of $1.81
              billion in 2025 likely excludes the prepaid/debit-style stablecoin card that is RedotPay's actual flagship
              product. Explicitly excluded from RedotPay's market are speculative crypto trading and DeFi yield farming,
              which serve a different buyer intent (portfolio return, not everyday spend), and largely excluded is
              traditional bank-wire or money-transfer-operator remittance, which functions as a status-quo substitute
              RedotPay is trying to displace rather than a segment it participates in directly.


              The buyer/user/payer map is unusually fragmented for a single product line. Unbanked or underbanked
              consumers are their own buyer, user, and payer, converting income into a stablecoin balance because no
              reliable local-currency account exists; migrant remittance senders pay on behalf of a separate recipient;
              Argentine and broader Latin American savers use stablecoins as a de facto digital dollar against
              persistent local-currency inflation, with stablecoins now representing roughly 61.8% of local Argentine
              crypto transaction volume; gig workers and freelancers receive cross-border payouts directly in
              stablecoins; and small businesses use stablecoin rails to pay overseas suppliers without
              correspondent-banking delay. The World Bank's 2025 Global Findex Database anchors the outer bound of this
              buyer base at 1.3 billion still-unbanked adults worldwide, with more than half concentrated in just eight
              countries, even as global account ownership climbed to 79% and digital-payment adoption has visibly
              accelerated.
