      - number: '5.2'
        title: Technology & Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              RedotPay's platform runs entirely on AWS, live since April 2023, with business data in Amazon Aurora,
              requests routed through an Application Load Balancer to services on Amazon EC2 and Kubernetes clusters,
              and a CI/CD pipeline built on CodeCommit, CodeBuild, and CodePipeline that supports twice-weekly
              production releases. Wallet private-key custody runs on Fireblocks' multi-party computation
              infrastructure, in place since 2024, so no single party holds a complete key. Merchant integration flows
              through RedotPay Connect's Open API 2.0, which mandates SHA256withRSA request signatures in production,
              exposes Paylink and Open-API payment paths, and notifies merchants of payment and refund outcomes through
              webhooks that are explicitly asynchronous and not guaranteed exactly-once. Card acceptance depends on the
              Visa network with StraitsX as BIN sponsor per independent reporting, though RedotPay's own card page does
              not name a specific network partner. The newest architectural layer is agentic settlement: RedotPay's
              open-source redotpay-cli automates Tempo's Machine Payments Protocol 402-retry flow, and the company's
              GitHub org also ships an MCP payment skill for AI coding agents, both of which an independent security
              reviewer has audited for prompt-injection and data-exfiltration risk patterns.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
