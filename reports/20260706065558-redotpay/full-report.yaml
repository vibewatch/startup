      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Working Capital
        blocks:
          - type: paragraph
            body: >-
              RedotPay's cost structure follows the standard prepaid card-program pattern: the Visa network and an
              issuing bank or BIN sponsor both take a share of interchange alongside the program manager, a structure
              Coinbase's own 10-K confirms applies to its similarly bank-issued, network-branded card. Visa's fiscal
              2025 10-K shows card-network revenue itself splits between service and data-processing lines tied to
              authorization, clearing, and settlement -- the same functions a program like RedotPay's would pay for. On
              the working-capital side, RedotPay's stablecoin balances are not on its own balance sheet: Circle's USDC
              reserves sit in a BlackRock-managed reserve fund and bank custody accounts, and Circle's own Q4 2025
              results show roughly 63% of gross reserve income being paid out to distribution partners such as custodial
              wallets and payment platforms, hinting at an unconfirmed float-income opportunity for RedotPay. RedotPay's
              AWS case study describes infrastructure and IT costs being kept in check while scaling to 5 million users,
              consistent with an opex-driven, capex-light cloud cost base. No gross margin, cost-of-revenue, or
              per-transaction cost figure is disclosed for RedotPay itself, and its chargeback policy shifts some
              dispute-resolution cost onto customers via a filing fee and eligibility exclusions.
