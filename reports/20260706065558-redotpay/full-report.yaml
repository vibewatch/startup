      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for RedotPay rests on genuine multi-year scale (6M+ users, $10B+ annualized volume, $150M+
              revenue), a receptive 2026 capital market for stablecoin-card and payments infrastructure names (Kast's
              $600M Series A, Rain's $1.95B Series C), and a credible IPO process with JPMorgan Chase, Goldman Sachs,
              and Jefferies engaged as underwriters. The anti-thesis is that none of RedotPay's own scale figures are
              audited, its cap table and liquidation-preference terms remain undisclosed, its underlying card-issuing or
              BaaS partner is unnamed despite a live sector precedent of overnight partner-driven shutdowns, and it has
              lost at least five senior executives within a year without naming a permanent CFO. Each side of the ledger
              is falsifiable: independent processor-level volume verification, a published S-1, or a confirmed permanent
              CFO hire would each meaningfully shift the balance of evidence in a specific, observable direction.
            claimRefs:
              - CV033
              - CV037
              - CV034
              - CV031
              - CV041
          - type: table
            tableRef: TV002
            claimRefs:
              - CV033
              - CV037
              - CV034
              - CV031
              - CV041
      - number: '8.3'
        title: Financing History, Valuation Context, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              RedotPay's 2025 financing arc ran from a $40 million Series A, to a $47 million strategic round that
              conferred unicorn status in September 2025, to a $107 million Series B in December 2025 that brought 2025
              capital raised to $194 million and pushed the company's disclosed valuation above $1 billion for the first
              time. CoinAlertNews further reported RedotPay was separately seeking up to $150 million in additional
              capital in March 2026, even as a company spokesperson said RedotPay had 'no urgent need for capital due to
              strong cash flow' -- a company-sourced claim that is not independently verifiable. Both the company's own
              release and independent trade press describe the Series B as oversubscribed, a soft demand signal rather
              than a disclosed price-discovery mechanism. Critically, no source reviewed in this chapter discloses
              RedotPay's post-money share count, option pool, or investor liquidation-preference terms, so dilution and
              preference overhang cannot be assessed from public sources alone -- an entry-discipline gap that should be
              closed before any capital commitment at the reported $4 billion IPO ask.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV009
              - CV040
              - CV041
      - number: '8.4'
        title: Comparable Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              Because RedotPay is privately held with no audited financials, this chapter builds a comparable set
              spanning RedotPay's own rounds, its closest stablecoin-card private-market peers (Kast, Rain), adjacent
              2026 M&A (Payward/Reap, Mastercard/BVNK), and public stablecoin/crypto-payments comps (Circle, Coinbase,
              Chime). Public comps price in a narrow 6x-9x trailing-revenue band; Windsor Drake's Q2 2026 sector
              research places stablecoin-rails infrastructure specifically at 9x-14x EV/Revenue, versus 5x-9x for
              exchange/trading models. Applying that sector band to RedotPay's own $150-158 million reported revenue
              implies a valuation of roughly $1.4-2.2 billion -- well below the reported $4 billion IPO target and
              closer to RedotPay's own December 2025 private mark. The $4 billion ask instead implies a roughly 25x-27x
              revenue multiple, a premium that recent M&A prices ($600 million for Reap, up to $1.8 billion for BVNK) do
              not obviously support as a valuation floor.
            claimRefs:
              - CV010
              - CV012
              - CV014
              - CV016
              - CV017
              - CV019
              - CV021
              - CV024
              - CV037
              - CV038
              - CV047
