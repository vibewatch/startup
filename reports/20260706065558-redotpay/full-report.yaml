      - number: '4.6'
        title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
        blocks:
          - type: paragraph
            body: >-
              Taken together, RedotPay's reported roughly 1.5% blended take rate on more than $10 billion of annualized
              volume, combined with company claims of profitability and positive cash flow, points to a revenue model
              with meaningfully better implied unit economics than a pure card-interchange business -- but none of this
              can be independently verified without audited financials. Structurally, RedotPay looks capital-light
              relative to a licensed stablecoin issuer or a bank: it rides Circle's and Tether's reserve rails rather
              than issuing its own backed stablecoin, and runs on AWS cloud infrastructure rather than owned data-center
              or manufacturing assets. The clearest diligence blocker is disclosure asymmetry: public comparables such
              as Visa and Coinbase publish granular, audited 10-K financials, while RedotPay's entire financial
              narrative rests on press coverage of company statements. A completed US IPO would be the first event to
              close that gap by forcing audited revenue, margin, and balance-sheet disclosure. Until then, the financial
              verdict is constrained: the top-line growth story is well corroborated across independent sources, but
              margin sustainability, capital adequacy, and customer-concentration risk in inflation-prone emerging
              markets remain unverifiable from public information alone.
            claimRefs:
              - CI041
