      - number: '7.5'
        title: Financial & Capital-Markets Risk
        blocks:
          - type: paragraph
            body: >-
              RedotPay's financial-risk profile is dominated by IPO-execution uncertainty layered on top of
              stablecoin-specific systemic exposure. The company is reportedly targeting a U.S. listing that could raise
              over $1 billion at a valuation exceeding $4 billion, but as of the most recent reporting reviewed here,
              deal terms and timing remained under review with no confirmed registration statement filed. A company
              spokesperson characterized the underlying up-to-$150 million raise as strategic rather than
              distress-driven, citing strong cash flow — a company-sourced claim that is not independently verifiable
              given the absence of audited financials. On the model-risk side, RedotPay's Credit product transfers most
              credit-loss risk to the borrower through collateral liquidation at a 0.9 risk index, but the company does
              not disclose platform-side loss rates during rapid market drawdowns. That model-level risk compounds with
              stablecoin-specific systemic risk: USDT depegged as low as $0.915 in February 2026 (its largest depeg
              since 2022), and USDT, USDC, and DAI all depegged by 2-8% multiple times in January-February 2026,
              triggering more than $3.2 billion in cascading DeFi liquidations. A depeg of that magnitude would
              mechanically reduce the redeemable fiat value of RedotPay balances and could trigger simultaneous customer
              withdrawal demand exceeding normal liquidity buffers, while the Regulation E coverage gap described above
              would leave affected U.S. cardholders with weaker dispute recourse than holders of conventional prepaid
              accounts.
            claimRefs:
              - CR041
              - CR042
              - CR043
              - CR044
              - CR045
              - CR046
      - number: '7.6'
        title: Risk Synthesis, Mitigations & Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Ranked by severity, RedotPay's top risks cluster around three unresolved disclosure gaps rather than
              confirmed regulatory breaches: an EU/UK licensing gap relative to MiCA's enforcement deadline, an unnamed
              card-issuing or BaaS partner whose loss would be a Quicko/Monavate-style shutdown, and executive turnover
              culminating in the absence of a permanent CFO during an active IPO process. Each of these transmits into
              the business through a distinct but connected path: regulatory gaps threaten forced service cessation and
              a compliance-overhang valuation discount; partner concentration threatens a sudden, total service outage;
              and governance instability complicates both IPO diligence and the market's confidence in execution. A
              fourth, more systemic risk — a sharp stablecoin depeg — would compound the others by simultaneously
              reducing redeemable balance value, straining liquidity, and unsettling investor confidence ahead of any
              listing. None of these risks has crossed from 'unresolved disclosure gap' into 'confirmed adverse event'
              as of this run, which is itself the central diligence takeaway: the monitorable triggers below — an HKMA
              licensee listing, an EU CASP registration or enforcement notice, disclosure of the card-issuing partner, a
              further named C-suite departure, or a sustained stablecoin depeg — are what would convert a manageable
              watch-list item into a thesis-break event, and each is independently observable without insider access.
            claimRefs:
              - CR047
              - CR048
