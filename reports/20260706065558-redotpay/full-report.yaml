      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Stablecoin issuer concentration is a single point of failure upstream of RedotPay's entire product
            body: >-
              The IMF and BIS both warn that a redemption run on a dominant issuer like Tether -- which alone held over
              $140 billion in short-term US Treasuries as of December 2025 -- could force fire sales that spill into
              short-term funding markets, and BIS finds a $3.5 billion stablecoin inflow already moves Treasury bill
              yields by 2-4 basis points. Any stablecoin-dependent card or payout product, RedotPay included, inherits
              this upstream systemic risk regardless of its own operational soundness.
            calloutType: risk
            claimRefs:
              - CM034
              - CM035
              - CM037
          - type: callout
            title: Regulatory clarity is arriving unevenly across RedotPay's key markets
            body: >-
              The US GENIUS Act and EU MiCA both now impose binding reserve and licensing standards, and Hong Kong --
              RedotPay's home jurisdiction -- has its own regime, but the World Economic Forum notes no global
              coordination yet exists. For a multi-jurisdiction operator, this fragmentation is itself a compliance cost
              and diligence item, not just a tailwind.
            calloutType: insight
            claimRefs:
              - CM025
              - CM028
              - CM044
          - type: callout
            title: Structural cost and access gaps sustain durable demand for stablecoin rails
            body: >-
              1.3 billion adults remain unbanked, the global average remittance cost is still 6.36% versus a 3% UN
              target, and Argentina's stablecoin share of local crypto volume has reached roughly 61.8% amid persistent
              inflation. These are structural, multi-year gaps rather than one-off promotional dynamics, and they
              support durable rather than purely speculative demand for RedotPay's category.
            calloutType: strength
            claimRefs:
              - CM015
              - CM022
              - CM018
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, Adjacents, Substitutes, and Likely Entrants'
        blocks:
          - type: paragraph
            body: >-
              RedotPay competes in a crowded and fast-shifting field that spans at least seven categories of
              alternative. Direct peers are exchange-linked or self-custodial crypto/stablecoin cards: Crypto.com and
              Bybit run large CRO- or Mastercard-branded card programs with staking- and VIP-tier-based rewards;
              Coinbase's Visa debit card raised its US daily spending cap to $5,000 in October 2025; OKX expanded its
              near-zero-fee virtual card across all 30 EEA countries and into Brazil; and Gnosis Pay and Kast represent
              the newer, better-funded wave of stablecoin-native challengers, the former self-custodial and
              MiCA-compliant, the latter a Solana-based, $600 million-valued Series A company. Binance's forced December
              2023 exit from the EEA card market is a live reminder that even the largest exchange brand can lose an
              entire regional card program to regulatory pressure. Incumbent card networks -- Visa and Mastercard -- are
              no longer passive rails: both now offer native stablecoin settlement directly to bank and fintech
              partners, effectively internalizing the technology a standalone issuer like RedotPay built its product
              around. Adjacent players include Revolut, whose 68-70 million users and crypto/FX/banking superapp dwarf
              any dedicated crypto-card issuer's scale, and PayPal, whose PYUSD stablecoin is now live in 70 markets
              with a 4% in-app reward. Wise and Western Union sit at the substitute and status-quo end of the spectrum
              -- Wise as a transparent, crypto-free low-fee alternative, and Western Union as the still-large (over $130
              billion market) cash-pickup incumbent that stablecoin cards are trying to displace. Finally, Rain's
              Banking-as-a-Service card-issuing stack is the clearest internal-build/likely-entrant path: any bank or
              fintech can plug into it and stand up a RedotPay-like consumer card without building settlement
              infrastructure from scratch.
