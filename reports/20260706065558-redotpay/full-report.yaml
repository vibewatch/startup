              published after the company's stated November 2023 market entry — puts verified users at 5 million, while
              RedotPay's own June 2026 RedotPay Connect launch materials describe the company as already serving more
              than 7 million users globally, a roughly 2-million-user increase attributable to an unspecified prior
              window. Early velocity looks fast by an independent account: a Nigeria-focused user guide reports that
              RedotPay issued more than 300,000 physical cards within two months of its November 2023 launch. On the
              payments side, 2026 press coverage put cumulative processed volume above $10 billion, and an April 2026
              report separately described a $2.95 billion crypto-card transaction-volume surge, though the time windows
              behind these figures are not consistently defined. RedotPay Connect's headline claim of access to "a
              global network of over 700 million crypto users" is a market-addressable figure tied to wallet providers
              such as MetaMask and Coinbase Wallet, not a count of RedotPay's own registered or active users, and no
              independent source corroborates actual RedotPay Connect merchant or transaction counts as of July 2026, a
              month after launch. App-store aggregates (details in the next section) and an independent report crediting
