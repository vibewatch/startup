company:
  name: RedotPay
chapter:
  number: 1
  title: Company Overview
  summary: RedotPay is a Hong Kong-linked stablecoin payments company founded in April 2023 that has rapidly built a consumer-facing stack around cards, wallets, payouts, and crypto-backed credit. The strongest closed valuation evidence is the September 2025 $47 million strategic round that put the company at $1 billion, while later 2025-2026 scale claims—6 million-plus users, $150 million-plus annualized revenue, and 8 million-plus users on current pages—remain largely company-reported. Public evidence supports strong product ambition and fast capital formation, but board disclosure, exact licensing granularity, active-user definitions, and audited financial metrics remain material diligence gaps.
sections:
- id: identity-and-product-scope
  title: Identity, Product Scope, and Core User Proposition
  body: |-
    RedotPay’s official positioning is unusually consistent across its homepage, about page, app stores, and help-center materials: it is trying to make stablecoins spendable in everyday life rather than offering a purely speculative crypto wallet. The company describes itself as a global stablecoin-based payment fintech that bridges digital assets with traditional finance, and its public product stack revolves around stablecoin cards, a multi-currency wallet, and cross-border payouts. The practical user story is equally clear. Official pages emphasize that users can spend through virtual or physical cards, move funds into local bank accounts or e-wallets, manage crypto and local currencies in one app, and access Apple Pay or crypto-backed credit without leaving the RedotPay ecosystem. In other words, the company is not just pitching custody or exchange access; it is pitching a consumer-finance layer on top of stablecoin infrastructure.

    The same sources also show how RedotPay wants to be perceived commercially. Product pages focus on subscriptions, travel, cash withdrawal, and peer or family remittance use cases, while the wallet page explicitly says RedotPay is a fintech provider rather than a bank and that certain wallet services are delivered through licensed financial institutions. That boundary matters because it frames RedotPay as an orchestrator of rails rather than a full-stack bank replacement. The company’s own language also repeatedly ties the product to financial inclusion for unbanked and underserved users, suggesting that management sees global access and dollar-like stability as the central adoption wedge rather than crypto trading alone.
