  evidenceGaps:
  - type: missing-source
    severity: material
    topic: active-user-and-headcount-disclosure
    missingEvidence: A current public disclosure of MAU/DAU, active-user definition, and employee headcount.
    whyItMatters: Registered-user and download counts do not reveal engagement quality, operating leverage, or support burden.
    diligencePath: Request board materials or investor updates that reconcile registered users, active users, merchants, and headcount as of 2026.
    relatedQuestionRefs:
    - QO023
    - QO026
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: hong-kong-licence-granularity
    missingEvidence: Exact Hong Kong licence numbers, issuing entities, and scope boundaries for money-lender, TCSP, custody, and any payment-service permissions.
    whyItMatters: The current disclosure proves intent and some licensing posture but not which entity holds which permission or whether those permissions fully cover all marketed services.
    diligencePath: Ask management for a jurisdiction-by-jurisdiction licensing matrix tied to each group entity and product line.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-control-rights
    missingEvidence: A full board roster, committee structure, post-Series B cap table, and reserved-matter framework.
    whyItMatters: Without governance detail, investors cannot fully assess control concentration, succession depth, or strategic-investor influence over licensing and expansion decisions.
    diligencePath: Request the latest board deck, shareholder agreement summary, and post-money ownership table during management diligence.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: stale
    severity: material
    topic: current-scale-corroboration
    missingEvidence: Independent 2026 corroboration for the latest 8M+ users and $12B payment-volume marketing claims.
    whyItMatters: Later marketing pages show scale acceleration beyond the 2025 fundraising data, but those claims are not independently validated in reviewed third-party reporting.
    diligencePath: Ask for monthly management reporting or banking/processor partner attestations that reconcile the latest user, TPV, and revenue claims.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
    - TO004
