      - number: '7.5'
        title: 财务与资本市场风险
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的财务风险画像，由 IPO 执行不确定性和稳定币特有的系统性暴露叠加而成。 公司据报道瞄准美国上市，可能募资超过 $1B、估值超过 $4B；但截至本报告审阅的最新报道，
              交易条款和时间仍在审议，尚无已确认提交的注册声明。公司发言人称，底层最高 $150M 融资是战略性而非纾困式， 理由是现金流强劲；但在缺少已审计财务的情况下，这一公司口径无法独立核验。模型风险方面，
              RedotPay 的 Credit 产品通过在风险指数 0.9 时清算抵押品，把大部分信用损失风险转给借款人； 但公司没有披露市场快速下跌期间的平台侧损失率。这一模型层面的风险又与稳定币特有的系统性风险叠加：
              2026 年 2 月，USDT 脱锚最低至 $0.915（为 2022 年以来最大脱锚）；2026 年 1-2 月， USDT、USDC 和 DAI 多次脱锚 2-8%，触发超过 $3.2B 的 DeFi
              连锁清算。如此幅度的脱锚会机械性压低 RedotPay 余额可赎回的法币价值，并可能触发客户同时提现，超过正常流动性缓冲；同时，上文所述 Regulation E
              覆盖缺口会让受影响的美国持卡人比传统预付账户持有人拥有更弱的争议救济。
