        title: 图表
        blocks:
          - type: callout
            title: 卡网络商品化，是 RedotPay 护城河最大的结构性威胁
            body: >-
              Visa 和 Mastercard 如今向任何银行或 fintech 合作伙伴提供原生稳定币结算，Rain 等 BaaS 平台又给同一批伙伴提供交钥匙发卡栈——这正在侵蚀 RedotPay
              这类独立稳定币卡发行商可主张的技术差异化。
            calloutType: risk
            claimRefs:
              - CP022
              - CP036
              - CP039
              - CP040
          - type: callout
            title: 竞争对手直接公开批评 RedotPay 自身费用和缺少返现
            body: 一张竞品卡的比较内容称，RedotPay 收取 1%-2.2% 转换 / FX 费用、不可退还的 $100 实体卡发卡费，且不提供持续返现——这是来自竞争对手的负面说法，本章标记为需独立验证，而不是已定事实。
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP027
          - type: callout
            title: RedotPay 的低转换成本是一把双刃剑
            body: >-
              不同于 Crypto.com 的 CRO 质押锁定或 Wirex 以代币和订阅门槛限制的最高等级，RedotPay
              看起来没有把客户锁进长期承诺；这让它能低成本获取切换用户，但同样缺少忠诚度机制，也可能让这些客户更容易离开。
            calloutType: strength
            claimRefs:
              - CP034
              - CP035
          - type: callout
            title: 监管和信任失效在该类别中反复出现，并非偶发
            body: >-
              Nexo 的 $22.5 million SEC 罚款、Binance 被迫退出 EEA 卡市场、Wirex 的 1.2/5 Trustpilot
              评级合在一起，说明监管执法和客户信任崩塌是托管型加密卡及借贷行业的结构性特征，不是孤立事件。
            calloutType: insight
            claimRefs:
              - CP029
              - CP009
              - CP031
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与收入结构
        blocks:
          - type: paragraph
            body: >-
              RedotPay 主要靠稳定币消费变现：加密资产兑法币收 1% 转换费，非 USD 交易再叠加 1.2% 外汇加价；一次性发卡费为 $10（虚拟卡）或 $100（实体卡），小额交易、拒付和 ATM
              取现还有附属收费。独立媒体报道显示，从 2025 年底到 2026 年，RedotPay 年化支付量超过 $10 billion，年化收入超过 $150-158
              million；把所有费项合并到一个披露收入顶线后，隐含综合抽成率接近 1.5%。2026 年 6 月，RedotPay 推出 RedotPay Connect，这是一个 B2B
              稳定币结算网关，让商户接受稳定币并即时以本币结算；公司宣传称，相比传统卡和银行通道，Connect 可将商户折扣率最高降低 70%。已审阅来源没有拆分披露收入中多少来自消费者费用、多少来自新推出的 Connect
              线，也没有说明收入是按总额确认，还是扣除网络和发行方成本后按净额确认——随着商户侧业务放大，这个收入确认问题会更重要。
