      - number: '6.2'
        title: 采用轨迹与报告规模
        blocks:
          - type: paragraph
            body: >-
              RedotPay 报告的用户规模增长很快，但不同来源口径并不一致。AWS 案例研究发布于公司所称 2023 年 11 月入市之后， 其中把已验证用户数写为 500 万；RedotPay 自己在 2026 年 6
              月的 RedotPay Connect 发布材料中， 则称公司已服务全球 700 多万用户，约增加 200 万，但增量对应的此前窗口没有说明。
              早期速度按独立说法看起来很快：一份尼日利亚用户指南称，RedotPay 在 2023 年 11 月上线后两个月内发行了 30 多万张实体卡。支付侧，2026 年新闻报道把累计处理额写为超过 $10B，另一篇
              2026 年 4 月报道还提到 $2.95B 加密卡交易量激增，但这些数字背后的时间窗口并未统一界定。RedotPay Connect 宣称可触达 “全球 7 亿多加密用户”，这是与
              MetaMask、Coinbase Wallet 等钱包提供商相关的可服务市场数字， 不是 RedotPay 自己的注册或活跃用户数；截至 2026 年 7 月、产品发布一个月后， 也没有独立来源佐证
              RedotPay Connect 的实际商户数或交易数。应用商店汇总数据（下一节详述）， 以及一份称 RedotPay 在 2026 年“主导”新兴市场加密卡使用的独立报告，再加上 RedotPay
              面向非洲扩大汇款出款的 Ripple/XRP 合作，共同构成最近的采用图景。
