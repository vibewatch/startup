            body: >-
              RedotPay 的运营风险主要集中在托管集中度、范围较窄的安全认证，以及反复出现的账户冻结投诉。 公司自 2024 年起依赖 Fireblocks 做集中式钱包托管，未披露第二托管方；2026 年通过 SGS
              取得的 ISO/IEC 27001 认证，范围也明确限定为“骨干基础设施运营”，而不是整个组织。 独立安全扫描器另以 95% 置信度标出，RedotPay 面向智能体的 CLI 技能定义了过宽的触发短语，
              可能意外激活付费服务发现或支付工作流。消费者侧，Trustpilot 汇总数据显示，在约 715 条评论中， 约 35% 为 1-2
              星，账户冻结是最常见的严重投诉；一名评论者称，在安全冻结期间，客服确认了取消请求， 但一笔约 12,000 USDT 的交易据称仍然完成。一个独立反诈骗评测网站没有发现可核验证据表明 RedotPay 受
              FCA、ASIC 或 CySEC 等一线机构监管；另一个联盟评测把产品称为“非托管”，这与 Fireblocks
              自己关于提供集中托管的说法直接冲突——这个事实冲突仍未解决，而且很重要，因为它会改变谁承担冻结和交易对手风险。 RedotPay 自己的 Credit 产品文档确认，风险指数达到 0.9
              会触发自动抵押品清算；双因素认证仍是可选项而非强制项； 已发布的拒付流程也没有披露服务级别时限或成功率统计。
