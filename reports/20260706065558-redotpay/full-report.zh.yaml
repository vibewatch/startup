chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品范围与核心用户主张
        blocks:
          - type: paragraph
            body: >-
              RedotPay 在官网首页、关于页、应用商店和帮助中心里的定位高度一致：它要让稳定币进入日常消费，而不是只做一个投机型加密钱包。公司称自己是连接数字资产与传统金融的全球稳定币支付
              fintech；公开产品栈围绕稳定币卡、多币种钱包和跨境出款展开。用户故事也很清楚：官方页面强调，用户可以用虚拟卡或实体卡消费，把资金转入本地银行账户或电子钱包，在一个 app 里管理加密资产和本币，还能接入
              Apple Pay 或使用加密资产抵押信贷，不必离开 RedotPay 生态。换句话说，公司卖的不是单纯托管或交易入口，而是叠在稳定币基础设施之上的消费金融层。


              同一批来源也能看出 RedotPay 希望市场如何理解它的商业定位。产品页主打订阅、旅行、取现、朋友或家庭汇款等场景；钱包页则明确写明，RedotPay 是 fintech
              提供商，不是银行，部分钱包服务由持牌金融机构交付。这个边界很关键：RedotPay
              更像支付通道的编排者，而不是全栈银行替代品。公司话术还反复把产品与无银行账户和服务不足用户的金融包容挂钩，说明管理层认为全球可得性和类美元稳定性才是核心采用楔子，而不是单靠加密交易。
