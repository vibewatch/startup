      - number: '3.2'
        title: 能力、定价、GTM / 分发与信任 / 监管姿态对比
        blocks:
          - type: paragraph
            body: >-
              单看定价，已审阅证据对 RedotPay 并不一致：一个竞争对手比较网站称，RedotPay 对 USD 消费收取 1% 转换费，对非 USD 消费合计收取 2.2% 费用，另有 $10 虚拟卡发卡费、不可退还的
              $100 实体卡发卡费，且没有持续返现计划——本章在 RedotPay 自有费率表确认前，把这些数字视为未确认。相比之下，OKX 不收交易费或 FX 费（仅有 0.1%-0.4% 转换价差），Bybit 收
              0.5% FX 加 0.9% 转换费并提供 2%-10% 分层返现，Crypto.com 的费用只有在 CRO 质押承诺从 $400 提高到 $400-$400,000 时，才从 3% 降向
              0%。能力上，自托管仍稀缺：Gnosis Pay（Safe smart accounts）和 MetaMask Card 是已审阅产品中仅有的两款，让用户在 POS
              前一直把资产留在自己钱包里；按已审阅来源，RedotPay、Crypto.com、Bybit、OKX 和 Kast 都看起来是托管模式。GTM /
              分发上，嵌入交易所的发行商（Crypto.com、Bybit、OKX）以接近零增量获客成本继承数百万现有交易所用户；Visa 和 Mastercard 自有银行伙伴项目（Cross River、Lead
              Bank、ARQ、Nuvei）则让任何较小银行都能获得 RedotPay 所依赖的同类稳定币结算能力。信任 / 监管姿态上，Gnosis Pay 和 OKX 明确引用 MiCA 对齐，Bybit 刻意排除
              EEA，而 Nexo 的 $22.5 million SEC 罚款加上 Binance 被迫退出 EEA 卡市场，都说明卡或借贷项目的监管地基可能多快被检验。
