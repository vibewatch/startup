      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              RedotPay 于 2025 年 12 月完成 $107 million Series B，使 2025 年总融资额达到 $194 million，并把估值推到 $1 billion
              以上；支持公司的风险投资财团覆盖 Sequoia/HSG、Goodwater、Pantera、Blockchain Capital、Circle Ventures、Coinbase
              Ventures、Galaxy、Accel、Lightspeed 和 Vertex，降低了对单一融资来源的依赖。截至 2026 年初，据报道 RedotPay 正在洽谈进一步最高 $150 million
              融资，为潜在美国 IPO 做准备；该 IPO 可能在超过 $4 billion 估值下募资超过 $1 billion，合作方包括 JPMorgan、Goldman Sachs 和
              Jefferies。公司发言人称该轮融资是机会驱动而非需求驱动，并引用“强劲现金流”。已审阅来源没有披露 RedotPay
              实际现金余额、月度烧钱、跑道，也没有披露任何债务或信贷额度条款——资本充足性目前依赖这条未经审计的现金流说法，而不是可验证数字。RedotPay
              主要金融交易对手敞口来自稳定币发行人（Circle/USDC、Tether/USDT），而非自身资产负债表杠杆，因为已审阅记录中没有任何 RedotPay
              债务融资披露。另有未确认报道称，融资推进同时伴随团队整合和合规职能人员流动，RedotPay 尚未正式回应。
