      - number: '7.3'
        title: 合作伙伴与基础设施依赖风险
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的运营模式压在一小组具名、单一供应商依赖上，外加至少一个实质上未具名的依赖。 已确认的供应商案例研究显示，公司依赖 AWS 做云托管和每周两次生产部署，依赖 Fireblocks 做钱包托管，
              依赖 Sumsub 做自动化 KYC；这些来源都没有披露多供应商冗余。RedotPay 支持的 USDC 余额依赖 Circle 的储备结构；按 Circle 自己的透明度披露，其中大部分放在 BlackRock
              管理的一只 SEC 注册货币市场基金中。 Circle 的 S-1 风险因素还警告，极端赎回请求或储备相关市场冲击可能造成赎回延迟， 进而直接传导到 RedotPay 的稳定币计价余额。到 2026 年 4
              月，Visa 稳定币结算额已达到 $7B 年化运行率；Mastercard 也在 2026 年 6 月支持 USDC/PYUSD/RLUSD 结算。这两点都表明，
              主要卡组织更倾向于把稳定币结算留在网络内，而不是终止 RedotPay 这类合规项目。 最重要的未解决依赖，是 RedotPay 底层发卡银行或银行即服务（BaaS）合作伙伴；RedotPay
              尚未公开披露其身份。波兰的 KNF 在 2026 年初撤销 BaaS 发行方 Quicko 的支付服务牌照， 使其合作金融科技公司的卡和银行功能一夜之间中断；立陶宛的 Monavate 也遭遇平行监管行动。
              两个案例都说明，这类依赖能很快从可管理的供应商风险变成运营停摆。
