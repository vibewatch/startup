        - 尚无独立商户交易量或正常运行时间数据发布
      - - 点对点交易加密资产
        - 使用非正式 OTC 渠道或境外交易所
        - RedotPay P2P 交易市场，支持 200+ 种支付方式
        - 在支持地区内提供更广的支付方式选择
        - 仅在部分地区可用；RedotPay 自身声明不承担交易对手风险责任
      - - 让 AI 代理自主完成购买
