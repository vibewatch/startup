  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议快照
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的证据基础支持“继续研究”，而不是买入或回避。公司自报规模——截至 2025 年 11 月， 用户超过 600 万、年化支付额超过 $10B、年化收入超过 $150M——足够真实，已经在
              2025 年三轮融资中吸引了 Goodwater Capital、Pantera Capital、Circle Ventures，以及更早期加密原生和综合型投资者组成的银团。
              但同一套证据基础没有已审计财务、没有披露股权结构表或清算优先权条款，也没有点名发卡或 BaaS 合作伙伴； 与此同时，Bloomberg 来源报道显示 RedotPay 正瞄准超过 $4B 的美国 IPO
              估值——大约两个月内较 2025 年 12 月私募估值跃升约 4x。置信度为低-中，风险评级为高，主要由风险章节记录的监管牌照缺口和领导层流失驱动。 估值立场偏高：$4B
              目标意味着收入倍数明显高于当前公共可比公司或行业基准所能支持的水平。
