            body: >-
              RedotPay 的公开牵引力指标很大，且在独立来源之间较一致：截至 2025 年 11 月，公司在 100+ 个国家拥有超过 6 million 注册用户，到 2026 年中升至超过 7 million；仅
              2026 年 3 月，加密卡交易量约为 $391 million，约占当月全球月度加密卡市场总额（约 ~$600 million）的 80%，也超过 2025 年 3 月水平的 3 倍。2025 全年交易量被估为
              $2.95 billion，占全球加密卡交易量约 80.6%。若按交易笔数而非金额衡量，RedotPay 并非最大处理方：竞争对手 EtherFi 在 2026 年 3 月记录了更多交易，尽管金额低得多；这意味着
              RedotPay 平均单笔金额明显更大，与偏汇款和缴费用例一致。公开记录没有显示活跃用户与注册用户拆分、留存或流失数据，也没有按 cohort 或地区披露
