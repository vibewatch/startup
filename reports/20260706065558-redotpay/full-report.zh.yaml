      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的信息安全管理体系获得审计机构 SGS 颁发的 ISO/IEC 27001 认证，并于 2026 年 3 月 30 日公布， 这给公司提供了一项可独立核验的安全资质。相比之下，其 PCI DSS
              合规性来自公司自我声明； 本章审阅的来源中没有发现独立发布的合规证明，因此该声明的证据权重明显低于 ISO 认证。 双因素认证默认为可选而非强制，基线弱于 KYC；KYC 则通过 Sumsub
              对每位用户强制执行。 监管侧，RedotPay 在 2026 年持续扩大牌照版图：6 月新增墨西哥 VASP 注册， 与既有阿根廷 VASP 牌照、美国 FinCEN MSB 注册和加拿大 FINTRAC MSB
              注册并列； 公司也记录了处理国际执法请求的《司法互助条约》流程。最具新意的合规界面是智能体支付 CLI 本身： 独立安全评审方 ClawHub 已发布漏洞模式目录，覆盖提示注入、触发器滥用和数据外泄。 任何接入
              RedotPay 智能体工具的集成方，都应把这些问题视为仍在发生的风险，而不是已解决事项。 独立应用监测网站还记录了 2026 年反复出现的用户投诉，集中在付款失败、登录错误和连接问题上；
              这是日常平台可靠性上最清楚的反向信号。
