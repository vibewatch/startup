        title: 融资历史、估值背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的 2025 年融资弧线，从 $40M Series A，到 2025 年 9 月赋予独角兽身份的 $47M 战略轮， 再到 2025 年 12 月 $107M Series B；全年融资达到
              $194M，并首次把公司披露估值推到 $1B 以上。 CoinAlertNews 还报道，RedotPay 在 2026 年 3 月另行寻求最高 $150M 新资金； 与此同时，公司发言人称 RedotPay
              “现金流强劲，没有迫切融资需求”——这是公司来源说法，无法独立核验。 公司自有公告和独立行业媒体都称 Series B 获得超额认购；这只能算温和的需求信号，
              不是已披露的价格发现机制。关键问题是，本章审阅的来源都没有披露 RedotPay 的投后股数、期权池或投资者清算优先权条款； 仅靠公开来源无法评估稀释和优先权悬置。这一入场纪律缺口，应在按据称 $4B IPO
              要价投入资本前补齐。
