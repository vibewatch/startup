companyProfile:
  summary: >-
    RedotPay 是一家与香港关联的稳定币支付公司，成立于 2023 年 4 月。它把多币种钱包、Visa 关联消费卡、全球出款通道和加密资产抵押信贷打包成一套消费金融栈，目标是把稳定币变成日常消费和汇款工具。公司在
    2025-2026 年多轮融资后迅速放大规模，并称已服务 100+ 个市场的数百万用户；但公开披露仍大量依赖公司说法，缺少经审计财务和招股书级运营细节。
