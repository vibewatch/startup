              悲观情景下，支付量增长放缓或遭遇监管挫折，IPO 定价接近 $1.0-1.5B——接近 RedotPay 自己上一轮私募估值，也符合 Coinbase 和 Chime 观察到的 6x-9x 倍数。基准情景假设
              RedotPay 的 2025 年增长轨迹在干净 IPO 进程中以更温和速度延续，定价约 $2.0-3.0B， 接近 Windsor Drake 的 9x-14x 稳定币轨道基准。乐观情景要求 RedotPay
