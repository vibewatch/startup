  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流看产品组合
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的产品线围绕一个多币种稳定币钱包展开，并配套一张接入 Visa 网络的虚拟 / 实体消费卡， 可在全球 1.3 亿多家商户使用；零售用户能持有加密资产，并像现金一样直接消费，不必单独提现。
              围绕这个核心，RedotPay 增加了 P2P Marketplace，可在 50 多种货币和 200 多种支付方式之间撮合点对点加密交易； RedotPay Earn
              则让闲置持仓获得收益。两者都只在部分地区开放，并明确披露存在交易对手和本金风险。 2026 年 6 月，公司首次进入企业支付，推出 RedotPay Connect。该商户网关宣称处理费低于 2%，
              成本较传统卡组织网关最多低 70%。联盟计划用最高 40% 的佣金变现推荐流量。最新、也最未经验证的界面面向开发者： 开源 CLI 和 Machine Payments Protocol（MPP）集成允许 AI
              智能体在所有者批准的支出上限内发起稳定币支付， 把 RedotPay 放在智能体商业的前沿，但还不是主流消费者功能。
