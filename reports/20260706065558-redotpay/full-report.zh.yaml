  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: RedotPay 用户画像：细分与买方特征
        blocks:
          - type: paragraph
            body: >-
              RedotPay 自有材料和基础设施合作伙伴描述的客户群，不是一个干净的买方类型，而是五个互相重叠的细分人群。 核心人群是日常零售加密资产消费者：他们用稳定币或主流币给 RedotPay
              钱包充值，再通过虚拟或实体 Visa 卡消费；这里的用户和付款人是同一个人。第二类是跨境汇款的发送方和接收方， 他们把加密资产换成本币，再打到银行账户或电子钱包；RedotPay 在尼日利亚、阿根廷和巴西
              最积极推广这个用例。第三类——以稳定币收款的自由职业者、创作者和远程工作者——在 RedotPay 自己的国际转账页面上被明确点名；该页面举了设计师收 USDC、创作者赚 BTC 并把全球收入接到本地账单的例子。
              第四类、也是战略上重要的一类，是新兴市场中没有银行账户或银行服务不足的用户；RedotPay 的 AWS 案例研究把这表述为对“非洲、南美和中东服务不足市场”的有意聚焦。最新、也证据最少的一类是 B2B 商户：
              2026 年 6 月推出的 RedotPay Connect 瞄准电商、SaaS、物流和批发商户，帮助他们接受稳定币支付并即时以本币结算。
              在这个细分里，付款人是持有稳定币的消费者，买方关系则是接入网关的商户；结构上不同于消费者卡业务。 RedotPay 依靠合作伙伴服务这些细分人群——Sumsub 做 KYC，Fireblocks 做托管，AWS
              做基础设施， OpenPayd 做资金管理和跨境通道；Fireblocks 访谈也直白表示，其用户“大多数”是日常消费者， 而不是加密原生交易者。
