  - id: FM003
    title: 各细分市场的买方 / 用户 / 付款方一致性与采用触发点
    type: matrix
    layout: wide
    summary: 无银行账户消费者和拉美美元化储蓄者的采用触发点最清晰，短期多平台并用风险最低；加密原生消费人群面对的替代产品竞争压力最大。
    data:
      columns:
        - 采用触发点
        - 预算所有者
        - 多平台并用 / 转换风险
      rows:
        - label: 无银行账户 / 银行服务不足消费者
          values:
            - label: 缺乏可靠银行账户访问
              tone: positive
              detail: 本地几乎没有正式替代方案可用于持有稳定价值储备。
            - label: 个人 / 家庭
              tone: neutral
              detail: 预算完全掌握在个人或家庭单元手中。
            - label: 低
              tone: positive
              detail: 本地可用的数字美元替代产品很少。
        - label: 移民汇款发送方
          values:
            - label: 银行电汇或 MTO 成本高 / 延迟久
              tone: positive
              detail: 传统渠道全球平均成本为 6.36%，部分走廊更高。
            - label: 家庭汇款预算
              tone: neutral
              detail: 发送方从个人或家庭收入中分配。
            - label: 中
              tone: neutral
              detail: 与汇款运营商和其他加密 App 竞争。
        - label: 拉美美元化储蓄者
          values:
            - label: 本币通胀与资本管制
              tone: positive
              detail: 阿根廷加密交易量中，稳定币占比约 61.8%。
            - label: 个人储蓄
              tone: neutral
              detail: 自主决定个人储蓄配置。
            - label: 中
              tone: neutral
              detail: Lemon、Ripio、Bitso 和 Binance 都在争夺同一钱包份额。
        - label: 零工 / 自由职业者
          values:
            - label: 跨境出金通道慢且贵
              tone: positive
              detail: 平台出金常常仍走传统跨境通道。
            - label: 个人收入
              tone: neutral
              detail: 出金就是劳动者自己的收入。
            - label: 中
              tone: neutral
              detail: 一些平台提供原生出金选项，形成直接竞争。
        - label: SME / 小企业跨境付款方
          values:
            - label: 代理行摩擦与 FX 价差
              tone: positive
              detail: 传统电汇有延迟，FX 加价也不透明。
            - label: 企业资金
              tone: neutral
              detail: 预算在企业手中，而不是个人。
