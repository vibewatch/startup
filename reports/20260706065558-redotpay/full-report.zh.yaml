      - number: '1.2'
        title: 领导层、法律实体与治理透明度
        blocks:
          - type: paragraph
            body: >-
              RedotPay 公开可见的领导层证据仍集中在少数名字上。Michael Gao 显然是公司对外门面：官方融资稿和独立报道都称其为联合创始人兼 CEO，Forbes 还补充了他曾任职 DBS 的细节。随后一则
              RedotPay 合作公告把 Jonathan Chan
              标为合作伙伴负责人兼联合创始人，至少说明公司不是单人公共叙事。两位高管之外，披露明显变薄。已审阅公开页面没有完整董事会名单、独立董事图谱，也没有达到独角兽估值公司通常应有的更宽高管梯队。缺席不等于治理薄弱，但意味着仅靠公开证据还无法给治理质量背书。


              法律实体图景比董事会图景更具体一些，因为 RedotPay 的通用条款列出了运营实体。条款识别出多家香港公司——Red F. Technology Limited、Red Dot Technology
              Limited 和 Red Dot Trust Limited——并提到与 VASP 注册号 144 绑定的阿根廷分支 RedotX (Tango) Limited。应用商店列表进一步显示 Red Dot
              Technology Limited 是 app 的销售方或开发者。合在一起，这些披露支持一个判断：RedotPay
              通过多实体结构运作，香港是核心运营司法辖区；但距离完整治理图谱仍有差距。尽调的关键不是实体是否存在，而是哪一实体持有什么牌照、谁控制保留事项、董事会权力如何在集团内分配。
