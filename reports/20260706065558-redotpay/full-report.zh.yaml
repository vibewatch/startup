      - number: '2.3'
        title: 增长驱动：美元化需求、监管清晰度与通道建设
        blocks:
          - type: paragraph
            body: >-
              三股力量正在把采用率往前拉。第一，新兴市场的结构性美元化需求更像长期变量，不是周期波动：Chainalysis 的 2025 Global Crypto Adoption Index 显示，前 10 个国家中有
              7 个是中低收入或中高收入经济体，使用动因来自汇款、抗通胀和获取美元，而不是投机交易；India、Vietnam、Pakistan 和 Philippines 的汇款及投资活动，也推动 Asia-Pacific
              加密交易量同比增长 69%。TRM Labs 另行发现，稳定币如今约占全部链上加密交易量的 30%，仅截至 2025 年 8 月就超过 $4 trillion，较 2024 年同期增长
              83%。第二，传统汇款成本长期偏高，形成稳定的价格伞：World Bank 的 Q3 2025 Remittance Prices Worldwide survey 显示，全球平均汇款成本为 6.36%（UN
              目标是 2030 年前低于 3%），Sub-Saharan Africa 是最贵走廊，成本 8.46%，而纯数字汇款运营商平均已低得多，为 3.54%——这正是稳定币产品可以切入的缝隙。


              第三，监管清晰度正在到来，只是并不均衡。美国于 2025 年 7 月 18 日颁布 GENIUS Act，首次建立支付稳定币的联邦牌照和储备框架，要求以现金或短期 Treasuries 做 100%
              储备支持，并按月公开披露，实施窗口约 18 个月。EU 的 MiCA 制度自 2024 年 6 月起，要求稳定币发行人持有 Electronic Money Institution
              或信用机构牌照，并提供全额储备支持；香港——RedotPay 的本土司法辖区——也在 2025 年推出自己的稳定币牌照制度，Argentina 则对虚拟资产活动提供更具支持性的 VASP/AML 监管。World
              Economic Forum 将其描述为有意义的进展，但全球协调尚未落地；所以即便单个制度逐步成熟，合规复杂度仍然偏高。
