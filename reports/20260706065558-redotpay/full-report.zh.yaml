      - number: '1.5'
        title: 里程碑、扩张信号与负面运营证据
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的里程碑模式显示，公司正从消费端发布走向更深的基础设施建设。2025 年 9 月独角兽公告回溯强调了 2025 年 6 月 Global Payout 上线；2026
              年又出现两个战略上重要的信号：5 月公告称 RedotPay 将在 Gelephu Mindfulness City 设立本地实体和常驻团队，6 月公告称公司选择 OpenPayd
              来改善资金运营、多币种支付和跨境汇款。这些动作重要，因为它们显示管理层正在从简单发卡推进到走廊扩张、本地存在和更深的支付基础设施。它们也强化了一个判断：RedotPay
              要做更广的跨境资金流动平台，而不是单一加密卡 SKU。


              与此同时，公开证据并非全是正面。评论页面显示，客户在入金、客服响应时间和刷卡拒付上有一层实质摩擦。Trustpilot 的归档页面显示一星评论占比较高；2026 年 7 月一条 Google Play
              评论抱怨，被拒的 Visa 交易仍触发 $0.50 费用。JustUseApp 自动给出的 0/100
              分质量太低，不能单独支撑投资判断，但仍是一个负面外部信号，说明公司的公开声誉并不无瑕。高速增长、监管扩张和可见客服摩擦的组合，在高速度 fintech 中并不少见；但这意味着 RedotPay
              的运营成熟度仍需追上其估值和国际版图所暗示的野心。
