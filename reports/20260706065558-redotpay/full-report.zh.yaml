      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: $4B 要价意味着 25x-27x 收入倍数，却没有审计支撑
            body: >-
              RedotPay 据报道超过 $4B 的 IPO 目标，对照其自报 $150-158M 年化收入， 隐含约 25x-27x 尾随收入倍数——远高于 Coinbase、Chime 和 Circle 自身 IPO
              定价的 6x-9x 倍数， 也高于 Windsor Drake 跟踪的 9x-14x 稳定币轨道基准。目前没有已审计财务可用于检验利润率或增长韧性是否支撑这份溢价。
            calloutType: risk
            claimRefs:
              - CV037
              - CV038
          - type: callout
            title: 2026 年稳定币卡公司确实面对友好的资本市场
            body: >-
              Kast 的 $600M Series A 和 Rain 的 $1.95B Series C 都在 RedotPay 自己融资轮所在的同一十二个月窗口完成，
              显示机构资本正在按数亿美元到数十亿美元估值积极定价稳定币卡和支付基础设施业务；这支持 RedotPay 的融资能力，但不支持其自身要价的具体水平。
            calloutType: strength
            claimRefs:
              - CV010
              - CV012
              - CV046
          - type: callout
            title: 在 S-1 或已审计财务缩窄估值区间前，继续研究
            body: >-
              RedotPay $4B IPO 目标与行业可比倍数隐含的 $1.4-2.2B 之间存在缺口；同时缺少已审计财务、 具名银行合作伙伴和已披露股权结构表条款。因此，今天合适的判断是继续研究：跟踪 IPO 文件，
              等已审计披露缩窄当前宽估值区间后，再重新评估估值。
            calloutType: recommendation
            claimRefs:
              - CV038
