  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与买方 / 付款方拆分
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的可服务市场位于多数已发布研究分开测算的三类交叉处：基于稳定币的支付和汇款、加密资产关联预付 / 借记卡消费，以及稳定币正在冲击的更广跨境消费者和 SME
              支付市场。任何规模测算前都要先划边界，因为“$208 trillion 跨境流量”这样的标题（FXC Intelligence 对 2025 年全球跨境流动总值的估计，并对应 $625 billion
              收入池）包含巨额贸易融资和银行间结算，RedotPay 根本不会触碰；而较窄的 “crypto credit card market” 2025 年 $1.81 billion 估计，很可能又排除了
              RedotPay 实际旗舰产品——预付 / 借记式稳定币卡。RedotPay 市场明确排除投机性加密交易和 DeFi
              收益农场，因为买方意图不同（追求组合回报，而不是日常消费）；传统银行电汇或汇款运营商汇款也大体排除在外，因为它们是 RedotPay 想替代的现状方案，不是公司直接参与的细分市场。


              对单一产品线来说，买方 / 用户 /
              付款方图谱异常分散。无银行账户或银行服务不足的消费者自己就是买方、用户和付款方，因为没有可靠本币账户，只能把收入转成稳定币余额；移民汇款发送方为另一端收款人付款；阿根廷和更广拉美储户把稳定币当成事实上的数字美元，对冲持续本币通胀，稳定币如今约占阿根廷本地加密交易量的
              61.8%；零工和自由职业者直接用稳定币收跨境款；小企业则用稳定币通道向海外供应商付款，绕开代理行延迟。The World Bank 的 2025 Global Findex Database
              把这类买方基数的外沿锚定在全球仍有 1.3 billion 成年人没有银行账户，其中超过一半集中在仅 8 个国家；与此同时，全球账户持有率已升至 79%，数字支付采用也明显加速。
