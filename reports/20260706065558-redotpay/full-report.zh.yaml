        - 更快、基本自动化的开户流程
        - 所有用户都必须完成；用户反馈验证摩擦和拒绝问题
    notes: 跨境出款速度和 Connect 费用主张的收益数据来自公司及云供应商来源，尚未被独立重新测量。
