      - - 基准
        - 2025 年增长轨迹以更温和节奏延续，IPO 进程无重大意外地完成
        - IPO 定价约 $2.0-3.0B，约 13x-19x 收入，接近 Windsor Drake 的 9x-14x 稳定币轨道基准
        - IPO 准备期执行风险；披露缺口持续到定价阶段
        - 与已报道的一线投行参与和当前行业倍数最一致
      - - 乐观
        - RedotPay Connect 快速放量，交易量三位数增长延续，未出现不利监管行动
        - IPO 定价达到或高于报道的 $4B 要价，约 25x+ 收入
        - 需要披露内容显著强于当前所有公开证据
        - 需要市场将稳定币卡公司估值重评至显著高于当前可比公司的水平
    notes: 估值区间是作者基于已报道的 $150-158M 收入基数和本章可比估值表中的可比倍数推导的情景逻辑；并非公司或投行指引。
