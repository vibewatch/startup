      - number: '5.5'
        title: 路线图与产品成熟度
        blocks:
          - type: paragraph
            body: >-
              RedotPay 在 2026 年沿多条线密集发货：4 月支持 Bitcoin Cash 和 Litecoin 资产， 5 月基于 Tempo 的 Machine Payments Protocol
              推出智能体稳定币支付，6 月初上线 RedotPay Connect B2B 产品并集成 XRP 实用功能，6 月 11 日取得墨西哥 VASP 注册，6 月 16 日推出 RedotPay Pro
              返现会员——资产覆盖、智能体商业、企业支付、合规和消费者忠诚度同时推进。仍有两项明确停留在前瞻阶段， 还未发货：RedotPay 的云厂商案例研究称，公司正在评估 AWS Application Auto
              Scaling， 并探索用生成式 AI 智能体自动化常规客服；两者都没有独立确认的上线日期。不同模块的成熟度差异很大： 钱包和 Visa
              卡是最可用、使用最广的界面，但底层卡组织关系只由独立报道确认；RedotPay Connect 是新推出的产品线，尚无独立采用数据；P2P Marketplace 和 Earn 仍按地区开放，RedotPay
              也声明不承担交易对手责任；CLI/MPP 智能体支付界面对开发者来说文档完整，但仍处早期， 独立审计已经标出需要主动缓释的安全风险模式，距离企业级可用还有一段路。
