      - number: '6.5'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              RedotPay 最清晰的前向扩张路径是 RedotPay Connect。它宣称能把商户折扣率较传统卡和银行通道最多降低 70%；同时还有早期“智能体支付”路线图（RedotPay Skill），允许 AI
              智能体代表用户交易。 截至 2026 年中，两者都还没有在使用层面得到验证。第二条扩张线是 Ripple/XRP 合作， 把汇款出款扩展到非洲，这也把执行风险集中在单一链上合作伙伴和单一区域通道上。 尽管
              2026 年的合规里程碑——阿根廷 VASP 注册、ISO/IEC 27001 认证，以及加拿大 / 美国 注册——意在为进入更受监管的市场建立机构信任，但按上一季度关于使用地域的报道， RedotPay
              实际活跃客户群仍集中在尼日利亚、阿根廷、孟加拉国、埃及等高通胀、资本管制的新兴市场。 这种集中度意味着，合规建设跑在了地理收入多元化前面。2026 年 3 月一份独立报告描述了 RedotPay
              团队整合和员工流失，这是值得跟踪的组织稳定性信号；它可能拖慢 B2B 推出执行和消费者争议解决速度， 进一步放大独立评价中已经记录的客服响应投诉。
