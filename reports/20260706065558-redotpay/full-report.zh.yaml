  - id: TV005
    title: 投资论点失效与终止触发项
    layout: wide
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - IPO 定价显著低于 $4B 要价
        - S-1/424B4 或媒体报道确认定价低于约 $2B
        - 表明市场不愿照单全收自报指标
        - 按落地倍数重新测算，不按公开要价
      - - 承销商退出
        - 公开确认 JPMorgan Chase、Goldman Sachs 或 Jefferies 退出承销团
        - 移除交易的机构背书信号
        - 视为红旗，暂停任何 IPO 前投资承诺
      - - 确认的监管执法行动
        - 正式的 SFC/HKMA/MiCA 执法、牌照拒批或公开警告
        - 使任何合规优先估值溢价失效
        - 终止标准 — 退出或避免新增承诺
      - - 常任 CFO 聘任未落地
        - IPO 路演前未宣布确认的 CFO
        - 表明治理 / 财务控制风险仍未解决
        - 推迟投资承诺，直到常任 CFO 到位
      - - 支付量增长急剧放缓
        - 公司披露或 S-1 确认同比增长低于约 20%
        - 抽掉支撑估值要价的核心指标
        - 将估值重新评估到可比区间低端
      - - 经审计利润率披露低于隐含经济性
        - S-1 或 10-K 显示，毛利率明显低于当前约 1.5% 的混合抽成率所暗示水平
        - 削弱支撑估值倍数的盈利叙事
        - 用实际披露利润率重跑情景模型
    notes: 触发条件和阈值是作者基于本章及前文识别的具体证据缺口作出的判断校准；均非公司披露的契约条款。
    claimRefs:
      - CV044
      - CV045
      - CV034
      - CV031
  - id: TV006
    title: 最终尽调要求
    layout: wide
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构与优先权栈
        - 投后股权结构表、清算优先权、董事会席位
        - 决定任何名义估值下普通股的价值
        - 作出任何 IPO 前投资承诺前，向 RedotPay 或其承销商索取
      - - 经审计财务
        - 毛利率、现金头寸、收入成本
        - 没有经审计输入，任何估值方法都不可靠
        - 等待 S-1 申报，或把经审计财务作为投资条件
      - - 独立交易量核验
        - 处理商 / 网络层面的结算数据
        - 否则，支撑 $4B 要价的核心指标仍是公司自报
        - 通过卡组织报告或经审计收入确认附注获取
      - - RedotPay Connect（B2B）贡献
        - 商户数量、GMV，以及相对传统消费者卡的收入拆分
        - 公司称这是新的增长引擎，但至今没有任何独立披露
        - 在任何 IPO 前资料室中索取分部层级报告
      - - 具名银行 / 发卡合作伙伴
        - 底层 BaaS / 发卡银行的身份与集中度风险
        - Quicko / Monavate 先例显示，单一合作方失效可在一夜之间叫停卡业务
        - 直接向 RedotPay 索取合作方披露
      - - 永久 CFO 任命
        - 已确认的具名 CFO
        - IPO 前财务治理趋稳的信号
        - 在 IPO 过程中跟踪公司披露和媒体报道
    notes: 各行综合了本章本地证据记录的证据缺口，并加入两项退出准备度尽调要求；负责人 / 尽调路径是作者建议的下一步，不是公司承诺。
    claimRefs:
      - CV008
      - CV034
      - CV039
      - CV040
