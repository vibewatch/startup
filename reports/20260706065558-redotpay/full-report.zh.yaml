            body: >-
              RedotPay 是私营公司且没有已审计财务，因此本章搭建的可比集合覆盖 RedotPay 自己的融资轮、 最接近的稳定币卡私募市场同行（Kast、Rain）、相邻的 2026 年
              M&A（Payward/Reap、Mastercard/BVNK）， 以及上市稳定币 / 加密支付可比公司（Circle、Coinbase、Chime）。上市可比公司的定价集中在较窄的 6x-9x
              尾随收入区间；Windsor Drake 的 2026 年 Q2 行业研究把稳定币轨道基础设施具体放在 9x-14x EV/Revenue，而交易所 / 交易模型为 5x-9x。把这个行业区间套到
              RedotPay 自己报告的 $150-158M 收入上，隐含估值约 $1.4-2.2B——明显低于据报道 $4B 的 IPO 目标， 也更接近 RedotPay 自己 2025 年 12 月的私募估值。$4B
              要价反而隐含约 25x-27x 收入倍数； 近期 M&A 价格（Reap $600M、BVNK 最高 $1.8B）并不能明显支撑它成为估值底部。
