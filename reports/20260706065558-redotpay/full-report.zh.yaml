      - number: '3.4'
        title: 壁垒耐久性、商品化风险与负面竞品证据
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的核心技术主张——在 POS 把稳定币余额转换为法币——正同时从两个方向被商品化。自上而下看，Visa 和 Mastercard 都已为发卡伙伴搭建原生稳定币结算（仅 Mastercard 的
              Crypto Partner Program 就列出超过 85 家公司，并在 2026 年收购稳定币基础设施创业公司 BVNK），所以银行或 fintech
              不再需要专门稳定币卡供应商，也能提供同样的基本功能。侧向看，OKX 等交易所关联发行商如今提供 0.1%-0.4% 转换价差，且不收交易费或 FX
              费，压缩了独立发行商可守住的价格伞。替代风险还来自规模：Revolut 约 70 million 用户和 PayPal 70 个市场的 PYUSD
              推出，都能以独立发行商获客成本的一小部分，把类似稳定币卡功能叠加到已经巨大的现有用户基数上。这个类别中最清晰的负面证据不是纯商业问题，而是监管和声誉：SEC 和州监管机构 2023 年 1 月就 Nexo
              Capital 未注册加密借贷产品达成和解（$22.5 million SEC 罚款），加上 Binance 2023 年 12 月被迫退出 EEA
              卡市场，都显示规模无法保护加密金融产品免于罚款或被某个市场挡在门外；Wirex 的 1.2/5（“差”）Trustpilot
              评级和反复出现的账户冻结投诉，则说明托管卡发行商普遍内含客户信任风险，按已审阅证据，RedotPay 自身托管模式也在其中。竞争对手撰写的比较网站（Bleap）直接指称 RedotPay
              自身费用、发卡成本和缺少持续返现计划是竞争弱点——本章把这些说法视为负面但未经验证的第三方指控，等待 RedotPay 自有披露确认。
