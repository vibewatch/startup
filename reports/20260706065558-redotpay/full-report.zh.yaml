      - number: '6.3'
        title: 具名客户证明与证据质量
        blocks:
          - type: paragraph
            body: >-
              RedotPay 几乎没有传统意义上由独立来源具名的企业或个人客户案例；最强的“具名”证明， 其实是应用商店和评价平台的汇总数据，再加少量公司发布或单作者叙述。Apple App Store 显示评分为
              4.77/5，约 3,600 个评分；Google Play 显示评分为 4.5/5，约 66,700 条评论—— 两者样本都很大，是日常满意度的生产环境信号。Trustpilot 的故事更混杂：约
              700-800 条评论给出约 2.9/5 的汇总分，反复出现的投诉主题是客服响应和身份核验。尼日利亚 独立指南记录了一个具体、可点名的使用模式——自由职业者持有 USDT 对冲通胀，并通过 RedotPay 的
              Ripple 集成提取 naira；RedotPay 自己的国际转账页面则发布了未经验证的证言式例子， 如收 USDC 的设计师和赚 BTC 的创作者。反向证据方面，2026 年一段题为“RedotPay
              Dark Reality” 的 YouTube 视频记录了一名用户在卡被冻结后账户变成负余额；这是一个具体、可追踪的不利事件， 而不是汇总评分。截至 2026 年 7 月，没有独立来源点名这家上线一个月的
              RedotPay Connect B2B 网关的具体企业客户，RedotPay 的商户侧证明仍完全停留在新闻稿阶段。
