      - number: '4.6'
        title: 财务结论：收入质量、利润率路径与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              合在一起看，RedotPay 披露的超过 $10 billion 年化交易量和约 1.5%
              综合抽成率，再叠加公司关于盈利和正现金流的说法，指向一个隐含单位经济性明显好于纯卡交换费业务的收入模型——但没有经审计财务前，这些都无法独立验证。结构上，相比持牌稳定币发行人或银行，RedotPay
              看起来更轻资产：它搭的是 Circle 和 Tether 的储备通道，而不是发行自有背书稳定币；它跑在 AWS 云基础设施上，而不是自有数据中心或制造资产。最清晰的尽调阻塞项是披露不对称：Visa 和
              Coinbase 等公开可比公司发布细颗粒度、经审计的 10-K 财务，而 RedotPay 的整套财务叙事建立在媒体转述的公司说法之上。完成美国 IPO
              将是弥合这个缺口的第一个事件，因为它会迫使公司披露经审计收入、利润率和资产负债表。在此之前，财务结论受限：收入规模增长故事已被多个独立来源较好佐证，但利润率可持续性、资本充足性以及通胀型新兴市场客户集中风险，仍无法仅凭公开信息验证。
