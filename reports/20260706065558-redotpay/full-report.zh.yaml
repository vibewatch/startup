  - id: FM001
    title: 市场规模视角：从全球支付流到 RedotPay 可服务切片
    type: pyramid
    layout: standard
    summary: 每一层都会收窄范围、压缩规模，但底层只是人口 / 行为边界，不是经核验的美元金额——这正是 RedotPay 特有的开放规模缺口。
    data:
      nodes:
        - label: 全球跨境支付流转价值：约 $208T（2025 年）
          detail: FXC Intelligence 统计的全用途跨境资金流，包括贸易融资和银行间结算，而这些场景 RedotPay 并不触及。
          tone: neutral
        - label: 全球支付行业收入：2024 年 $2.5T，2029 年约 $3T
          detail: McKinsey Global Payments Report；这是所有支付通道上最宽的可货币化层，并非稳定币专属。
          tone: neutral
        - label: 稳定币专属天花板：约 $9T 调整后年支付量 / $311B 流通供应量（2025-2026 年）
          detail: a16z 调整后支付量和 DeFiLlama 流通供应量，为上方各层中的稳定币专属切片设定边界。
          tone: positive
        - label: RedotPay 相关可服务人群：1.3B 无银行账户成年人，加上由美元化驱动的用户（例如阿根廷加密交易量中约 61.8% 为稳定币）
          detail: World Bank Findex 和阿根廷专项证据界定可触达买方基础；目前没有针对 RedotPay 的单一经核验美元 SOM 数字。
          tone: neutral
    approximationNotes: 这是视角堆栈，不是严格的 TAM-SAM-SOM 级联，因为每层来自不同来源，口径和单位也不同；底层是人口 / 行为边界，反映的是开放规模缺口，而非已调和的数字。
