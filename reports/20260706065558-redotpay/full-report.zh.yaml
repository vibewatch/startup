      - number: '5.2'
        title: 技术与运营架构
        blocks:
          - type: paragraph
            body: >-
              RedotPay 平台完全跑在 AWS 上，自 2023 年 4 月上线；业务数据放在 Amazon Aurora， 请求经 Application Load Balancer 路由至 Amazon EC2 和
              Kubernetes 集群上的服务， CI/CD 管线由 CodeCommit、CodeBuild、CodePipeline 拼成，支撑每周两次生产发布。钱包私钥托管自 2024 年起使用 Fireblocks
              的多方计算基础设施，因此没有单一主体持有完整密钥。商户集成走 RedotPay Connect 的 Open API 2.0； 生产环境强制使用 SHA256withRSA 请求签名，开放 Paylink 和
              Open-API 两条支付路径，并通过 webhook 通知商户支付与退款结果，但 webhook 明确是异步的，不保证 exactly-once。卡受理依赖 Visa 网络， 独立报道称 StraitsX 是
              BIN 赞助方，不过 RedotPay 自己的卡页面没有点名具体网络伙伴。 最新架构层是智能体结算：RedotPay 的开源 redotpay-cli 自动化 Tempo 的 Machine Payments
              Protocol 402-retry 流程，公司 GitHub 组织也发布了面向 AI 编程智能体的 MCP 支付技能；两者都已由独立安全评审人员审计， 关注提示注入和数据外泄风险模式。
