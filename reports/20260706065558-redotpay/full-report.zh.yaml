          detail: 储备集中在一只货币市场基金
          tone: warning
        - id: visa
          label: Visa（卡网络）
          detail: 发卡与交易通道
          tone: neutral
        - id: issuer
          label: 未披露名称的发卡银行 / BaaS 伙伴
          detail: 身份未公开披露
          tone: warning
        - id: regulators_hk
          label: HKMA / SFC（香港）
          detail: 稳定币与 VASP 牌照主管机构
          tone: warning
        - id: regulators_us
          label: FinCEN / 州 MTL 制度（美国）
          detail: MSB 注册，加上拟议 AML / 制裁规则
          tone: warning
        - id: regulators_eu
          label: ESMA（MiCA）/ FCA（英国）
          detail: 未确认取得 CASP 或 FCA 注册
          tone: warning
      edges:
        - from: aws
          to: redotpay
          label: 云托管与 CI/CD
        - from: fireblocks
          to: redotpay
          label: 钱包托管
        - from: sumsub
          to: redotpay
          label: KYC / 身份验证
        - from: circle
          to: redotpay
          label: USDC 结算 / 储备依赖
        - from: visa
          to: redotpay
          label: 发卡与网络通道
        - from: issuer
          to: redotpay
          label: 底层发卡，身份未披露
        - from: regulators_hk
          to: redotpay
          label: 稳定币 / VASP 牌照主管
        - from: regulators_us
          to: redotpay
          label: FinCEN MSB / 州 MTL 监管
        - from: regulators_eu
          to: redotpay
          label: MiCA CASP / FCA 授权缺口
    approximationNotes: 节点色调反映已披露供应商关系（正面）与未解决的监管或伙伴身份缺口（警示）；边只表示依赖方向，不按交易量加权。
    claimRefs:
      - CR001
      - CR003
      - CR007
      - CR023
      - CR024
      - CR025
      - CR028
      - CR030
  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 从自报规模证据和可比样本校验出发，串起披露缺口与风险，最后落到投资建议。
    data:
      nodes:
        - id: scale
          label: 自报规模
          detail: 6M+ 用户、$10B+ 年化交易量、$150M+ 收入
          tone: positive
        - id: comps
          label: 可比倍数校验
          detail: 上市 / 行业可比公司按收入 6x-14x 交易，IPO 要价隐含 25x-27x
          tone: warning
        - id: gaps
          label: 披露缺口
          detail: 无审计、无股权结构表、未披露具名发卡 / BaaS 伙伴
          tone: warning
        - id: risk
          label: 风险评级：高
          detail: 监管牌照缺口叠加管理层流失，放大估值风险
          tone: warning
        - id: stance
          label: 估值判断：偏贵
          detail: IPO 要价明显高于可比倍数
          tone: warning
        - id: rec
          label: 建议：继续研究
          detail: 等审计财务或 S-1 定价公开后再回看
          tone: neutral
      edges:
        - from: scale
          to: comps
        - from: comps
          to: stance
        - from: gaps
          to: risk
        - from: risk
          to: stance
        - from: stance
          to: rec
    approximationNotes: 节点标签概括本章自身综合判断；这条链是作者的推理，不是公司披露的决策流程。
    claimRefs:
      - CV033
      - CV037
      - CV034
      - CV044
  - id: FV002
    title: 假设收入倍数下的估值敏感性
    type: bar
    layout: standard
    summary: 在从上市可比倍数到报道中的 IPO 要价的收入倍数区间内，RedotPay 隐含估值（$B）如何变化。
    data:
      items:
        - label: 6x 收入（类似 Coinbase / Chime）
          value: 0.9
          unit: $B
          detail: $150M 收入下限的 6x
        - label: 9x 收入（行业下限，Windsor Drake）
          value: 1.4
          unit: $B
          detail: 稳定币支付通道基准 9x-14x 的下沿
        - label: 14x 收入（行业高位，Windsor Drake）
          value: 2.2
          unit: $B
          detail: 稳定币支付通道基准 9x-14x 的上沿
        - label: 19x 收入（基准情景）
          value: 3
          unit: $B
          detail: 本章基准情景区间中点
        - label: 26x 收入（$4B IPO 要价隐含）
          value: 4
          unit: $B
          detail: $158M 收入上限的 26x，由报道中的 $4B 目标隐含
    approximationNotes: 数值经四舍五入，由作者根据 $150-158M 收入区间和可比估值表引用的倍数推导；不是公司或投行预测。
    claimRefs:
      - CV037
      - CV038
      - CV024
  - id: FV003
    title: 不同情景下的估值 / 回报区间
    type: range
    layout: standard
    summary: 以最新确认的私人估值为参照，RedotPay 潜在 IPO 的低 / 基准 / 高估值结果。
    data:
      items:
        - label: 最近确认的私人估值（Dec 2025）
          low: 1
          high: 1.2
          mid: 1.05
          unit: $B
          displayValue: ~$1.0B-$1.2B
          detail: RedotPay Series B 轮私人市场估值
          tone: neutral
        - label: 悲观情景 IPO 估值
          low: 1
          high: 1.5
          mid: 1.25
          unit: $B
          displayValue: $1.0B-$1.5B
          detail: 增长放缓或监管受挫情景
          tone: negative
        - label: 基准情景 IPO 估值
          low: 2
          high: 3
          mid: 2.5
          unit: $B
          displayValue: $2.0B-$3.0B
          detail: 保持温和增长，IPO 流程顺利
          tone: neutral
        - label: 乐观情景 / 报道中的 IPO 要价
          low: 3.5
          high: 4.5
          mid: 4
          unit: $B
          displayValue: $3.5B-$4.5B
          detail: RedotPay Connect 快速放量，未出现不利监管行动
          tone: positive
    approximationNotes: 区间是作者基于可比估值表和行业倍数证据搭建的情景，不是投行披露的估值区间。
    claimRefs:
      - CV038
      - CV036
      - CV003
      - CV004
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: wide
    summary: 面向 IC 的评分，覆盖市场机会、验证、护城河、单位经济、风险、估值和证据质量。
    data:
      items:
        - label: 市场机会
          value: 7/10
          detail: 市场分析章节显示，稳定币 / 汇款 TAM 达数万亿美元级
          tone: positive
        - label: 验证 / 牵引力
          value: 6/10
          detail: 披露 $10B+ 交易量和 $150M+ 收入，但均为自报且未经审计
          tone: neutral
        - label: 护城河 / 差异化
          value: 4/10
          detail: 受到 Visa / Mastercard 原生稳定币结算和近零费率竞争者挤压
          tone: warning
        - label: 单位经济可信度
          value: 3/10
          detail: 未披露毛利率、收入成本或现金头寸
          tone: warning
        - label: 风险评级
          value: High
          detail: 监管牌照缺口、管理层流失、无永久 CFO
          tone: warning
        - label: 估值判断
          value: Stretched
          detail: $4B IPO 要价隐含约 25x-27x 收入，高于 6x-14x 可比倍数
          tone: warning
        - label: 证据质量
          value: 5/10
          detail: 32 个来源，覆盖 25+ 个可注册域名，但没有审计财务
          tone: neutral
    approximationNotes: 评分是作者把本章证据综合后给出的 0-10（或分类）定性判断，不是第三方评级。
    claimRefs:
      - CV033
      - CV034
      - CV037
