  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - GENIUS Act 联邦稳定币牌照（美国）
        - 驱动
        - 自 2025 年 7 月颁布起约 18 个月内生效
        - 明确谁可以在美国合法发行 / 分发支付稳定币，可能降低银行 / 金融科技合作门槛
        - 确认 RedotPay 或其稳定币合作伙伴是否计划申请获准发行人或分发身份
      - - MiCA 牌照与储备规则（欧盟）
        - 约束
        - 自 2024 年 6 月起执行（稳定币规则）
        - 推高合规成本，并可能把不合规代币（如 USDT）排除在 RedotPay 可能依赖的欧盟通道之外
        - 核验 RedotPay 在面向欧盟流中支持哪些稳定币及其 MiCA 状态
      - - 美国 / 欧盟 / 香港 / 阿根廷监管碎片化
        - 约束
        - 持续到 2026 年及以后
        - 给 RedotPay 这样的多司法辖区运营商带来套利风险和合规复杂度
        - 将 RedotPay 的牌照版图逐一对照各制度要求
      - - 新兴市场美元化需求（阿根廷及更广泛拉美）
        - 驱动
        - 当前且在加速
        - 扩大想要稳定币数字美元的消费者池
        - 量化 RedotPay 实际用户在高美元化通道中的集中度
      - - 传统汇款成本持续高企（全球平均 6.36%）
        - 驱动
        - 当前
        - 为更便宜的稳定币转账和卡产品撑出持久价格伞
        - 将 RedotPay 的终端用户实际成本 / FX 点差与 6.36% 均值和 3.54% 纯数字基准对标
      - - 稳定币发行方集中与系统性风险担忧（IMF / BIS）
        - 约束 / 负面
        - 持续存在，2025–2026 年被反复提示
        - 主导发行方（如 Tether）一旦出现压力事件，可能扰乱所有依赖稳定币产品的流动性或赎回
        - 评估 RedotPay 的发行方 / 储备多元化，以及应对赎回挤兑情景的预案
      - - 银行发行存款代币兴起
        - 约束（长期）
        - 正在萌芽；Citi 认为 2030 年前可能出现
        - 如果银行提供可比通道，公共稳定币消费产品的可服务市场可能被压缩
        - 跟踪 RedotPay 核心通道中的银行 / 存款代币试点
      - - 市场规模测算方法分化（加密卡、稳定币交易量）
        - 约束（衡量）
        - 持续存在
        - 单一 TAM/SAM/SOM 数字很难支撑投资判断；投资者必须跨口径三角校验
        - 要求 RedotPay 管理层提供内部 TAM 方法，并与外部口径对比
