      - number: '3.3'
        title: 转换成本、锁定、多卡并用与分发 / 合作伙伴准入
        blocks:
          - type: paragraph
            body: >-
              终端消费者的转换成本在几乎整个类别里都呈结构性偏低：包括 RedotPay 在内，已审阅提供商都不像是把客户锁进长期合同；CoinCodeCap
              这类专门排名网站本身就服务于加密原生用户，让他们一次比较并同时使用两三张卡。竞争对手建立锁定时，靠的是忠诚度机制而非合同：Crypto.com 要求 CRO 持有人锁仓约 180
              天才能保住最高等级奖励；Wirex 最高返现等级要求持有约 7.5 million WXT 代币（约 $55,000）并支付月费——两者承诺都远高于本次审阅中为 RedotPay 识别出的任何机制。由于已审阅的
              RedotPay 费率结构没有持续返现计划，它在减少多卡并用上可能结构性弱于质押或订阅门槛竞争对手；不过较低转换成本也意味着它能更便宜地拿下切换用户。更深的结构性问题是分发和合作伙伴准入：卡网络赞助（Visa 或
              Mastercard 主会员资格，或银行 / BIN sponsor 关系）才是该类别真正的供给约束，而这个约束正在放松。Rain 平台和 Visa 扩展后的 Bridge 合作，都让银行或 fintech
              不投入 RedotPay 自有基础设施也能成为稳定币卡发行商；Binance 2023 年 12 月被迫退出 EEA 卡市场，则是一个具体先例，说明网络或监管压力能多快切断发行商的市场准入。RedotPay
              自身具体网络和 BIN sponsor 关系，在本章审阅的任何来源中都未详细说明；本章将其标为尽调缺口，而不是预设弱点。
