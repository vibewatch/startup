            body: >-
              RedotPay 的正面逻辑建立在真实的多年规模上（用户 6M+、年化交易量 $10B+、收入 $150M+）， 也受益于 2026 年稳定币卡和支付基础设施公司受到资本市场欢迎（Kast 的 $600M
              Series A、 Rain 的 $1.95B Series C），以及 JPMorgan Chase、Goldman Sachs、Jefferies 已受聘承销的可信 IPO 进程。反向逻辑是：RedotPay
              自有规模数字均未经审计；股权结构表和清算优先权条款仍未披露； 尽管行业已有合作伙伴一夜停摆的现实先例，底层发卡或 BaaS 合作伙伴仍未具名；公司一年内流失至少五名高管， 也没有任命常任
              CFO。账本两边都可证伪：独立的处理机构级交易量验证、公开 S-1，或确认聘任常任 CFO， 都会把证据权重朝一个具体、可观察的方向显著推动。
