      - number: '2.4'
        title: 采用约束、系统性风险与负面监管信号
        blocks:
          - type: paragraph
            body: >-
              推动采用的监管建设，也凸显了真实约束。MiCA 执法已经足够严格，USDT 等不合规代币面临 EU 主要交易所下架；截至 2025 年中，报道称约 45% 的稳定币发行人申请在 MiCA
              下被拒——不过这个具体拒绝率来自单一二级来源，缺少 ESMA/EBA 一手引用，本章把它视为尽调缺口，而不是已定事实。更实质的风险在于，IMF 2025 年 12 月部门论文和 BIS 工作论文（No.
              1270，2025 年 5 月）均警告，稳定币发行人集中持有短期 US Treasuries——截至 2025 年 12 月，仅 Tether 就持有超过 $140
              billion——可能在赎回挤兑中被迫抛售，进而冲击市场稳定；BIS 还估计，$3.5 billion 稳定币流入已足以让三个月 Treasury bill 收益率移动 2-4 个基点。BIS 的 2025
              Annual Economic Report 进一步认定，稳定币无法通过稳健货币工具所需的“单一性”、弹性和结算最终性测试，无监管流通还会抬高金融犯罪风险。


              这些是 RedotPay 所依赖的整个稳定币支付类别的负面信号，不是专门针对 RedotPay
              的证据。公开来源也没有量化，主导发行人一旦出现压力事件，会如何具体传导到面向消费者的卡和出款提供商，而不是只传导至更广的 Treasury
              市场；本章标出这个缺口，不自行估算。另一个更结构性的约束来自竞争：Citi 自有研究认为，到 2030
              年，随着银行提供监管整合更紧的可比数字美元通道，银行发行的存款代币在交易量上可能最终超过公共稳定币。长期看，这会压缩 RedotPay
              这类基于公共稳定币的消费者产品的可服务市场。美国、EU、香港和其他制度之间的监管碎片化让问题更复杂：IMF 明确警告，规则不一致会诱发监管套利，并提高单一大型发行人压力事件跨境传染的风险。
