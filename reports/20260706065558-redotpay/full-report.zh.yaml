      - number: '4.2'
        title: 获客路径与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              RedotPay 不披露获客成本、营销预算或回本周期，因此只能间接对标获客效率。2026 年公开可比基准显示，加密卡和消费者 fintech 产品的全口径 CAC 为每个已验证客户
              $85-$200；结构化推荐计划可把 CAC 较付费渠道降低约一半。RedotPay 自身增长叙事——通过代理网络、Telegram 和社区推荐扩张，以及 Ripple/XRP 接入 Nigerian
              汇款等支付合作——方向上更像推荐驱动、低成本动线，而不是重付费媒体打法。AWS 案例研究显示，公司在 2023 年底进入市场后用户基数约 5 million 已验证用户；到 2026 年中媒体报道已超过 7
              million，呈现多年复合增长轨迹。由于使用场景偏向新兴市场汇款、缴费和日常消费，而非发达市场可选消费，渠道经济性很可能与西方 neobank 可比公司明显不同；但目前没有 RedotPay
              专属效率指标来确认这一点。
