      - number: '2.2'
        title: 多视角测算市场规模——稳定币、跨境支付与加密卡
        blocks:
          - type: paragraph
            body: >-
              已审阅来源中，没有任何一个给出专门针对稳定币消费卡和出款的干净 TAM/SAM/SOM 数字。因此，本章不锚定一个宽口径大数，而是用 5 个相邻视角交叉测算。观察端看，按 DeFiLlama
              的链上聚合数据，2026 年 7 月初，382 个被跟踪代币的稳定币总市值约为 $311 billion；Tether (USDT) 和 USD Coin (USDC) 合计持有约 83%
              供应量，Ethereum 和 Tron 两条链合计承载近 80%。前瞻端看，Citi 的 GPS research 在 2025 年 6 个月内两次修订 2030 年稳定币发行预测，把基准情境从 $1.6
              trillion 调到 $1.9 trillion、乐观情境从 $3.7 trillion 调到 $4.0 trillion——这提醒我们，即便是一线银行，自己的情境区间也能在一个报告周期内移动约 20%。


              支付量估计对方法论更敏感：Andreessen Horowitz 的 State of Crypto 2025 report 发现，过去一年稳定币处理了 $46 trillion
              链上总交易量；但剔除机器人驱动和套利活动后，调整后数字降至约 $9 trillion——仍高于 PayPal
              吞吐量，却只有未调整标题数的五分之一。这样的差距正是单一视角测算不可靠的原因。两个更宽视角给机会设上沿：McKinsey 的 2025 Global Payments Report 显示，全球支付行业 2024
              年收入为 $2.5 trillion，并将在 2029 年走向约 $3 trillion；FXC Intelligence 另行预计，到 2033 年，B2B 跨境支付细分市场在贴近流量口径的 TAM
              上，可服务收入池将达到约 $67 trillion。窄口径端，The Business Research Company 针对加密信用卡的估计为 2025 年 $1.81 billion、2030 年 $4.19
              billion、CAGR 18.2%，几乎肯定低估 RedotPay 的真实产品类别，因为它排除了预付卡和借记式卡。
