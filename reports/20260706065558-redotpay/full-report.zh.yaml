  - id: FM004
    title: 跨境稳定币价值链：从发送方到收款方
    type: flow
    layout: standard
    summary: 价值从发送方的法币或加密资产头寸出发，经过入金通道和主导结算通道，进入消费者钱包 / 卡 App，再经本地出金通道流出——这就是 RedotPay 产品所在的一般路径。
    data:
      nodes:
