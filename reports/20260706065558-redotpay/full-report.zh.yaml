  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、既有巨头、相邻玩家、替代品与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              RedotPay 所处赛道拥挤且快速变化，替代方案至少横跨 7 类。直接同业是交易所关联或自托管的加密 / 稳定币卡：Crypto.com 和 Bybit 运营大型 CRO 或 Mastercard
              品牌卡项目，奖励机制绑定质押和 VIP 等级；Coinbase 的 Visa 借记卡在 2025 年 10 月把美国每日消费上限提高到 $5,000；OKX 将近零费用虚拟卡扩展到全部 30 个 EEA 国家和
              Brazil；Gnosis Pay 和 Kast 则代表更新、资金更足的稳定币原生挑战者，前者自托管且符合 MiCA，后者是基于 Solana、估值 $600 million 的 Series A
              公司。Binance 2023 年 12 月被迫退出 EEA 卡市场，是一个仍然鲜活的提醒：即便最大交易所品牌，也可能因监管压力失去整个区域卡项目。既有卡网络——Visa 和
              Mastercard——不再只是被动通道：二者都已直接向银行和 fintech 合作伙伴提供原生稳定币结算，等于把 RedotPay 这类独立发行商围绕其搭建产品的技术内化了。相邻玩家包括 Revolut，其
              68-70 million 用户和加密 / FX / 银行业务 superapp 规模远超任何专门加密卡发行商；还有 PayPal，其 PYUSD 稳定币已在 70 个市场上线，并提供 4% app
              内奖励。Wise 和 Western Union 位于替代品和现状方案一端——Wise 是透明、无加密的低费率替代品，Western Union 则是仍很庞大的现金取款既有玩家（市场超过 $130
              billion），也是稳定币卡试图替代的对象。最后，Rain 的 Banking-as-a-Service 发卡栈是最清晰的内部自建 / 潜在进入者路径：任何银行或 fintech
              接入后，都能不从零建设结算基础设施，直接立起一个类似 RedotPay 的消费卡。
