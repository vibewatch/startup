      - number: '7.4'
        title: 人员、执行与治理风险
        blocks:
          - type: paragraph
            body: >-
              RedotPay 在推进最激进资本市场动作的同一窗口，领导层厚度变薄了。2026 年 3 月，多家媒体转述 Bloomberg 报道称，RedotPay
              在约十二个月内流失至少五名高级员工，包括首席财务官；合规负责人职位两次更替， 截至该报道时仍没有常任 CFO，一名联合创始人临时负责财务、投资者关系和企业发展。
              离职原因被归因于中国科技公司常见的高压“996”工作文化；RedotPay 没有确认任何裁员或重组， 也没有披露具体离职人数，而是把这些变化描述为自然扩张。公司还因与中国大陆的联系受到投资者审视，
              尽管其产品明确排除中国大陆用户；报道把这种敏感性直接与员工流失和 IPO 计划时间点联系起来。 执行侧，RedotPay 已聘请 JPMorgan Chase、Goldman Sachs 和 Jefferies
              参与潜在美国上市， IPO 执行依赖集中在少数外部顾问身上，而交易条款仍在审议。公开报道继续列出联合创始人 Michael Gao 为
              CEO，并称所有联合创始人仍积极参与，但这一安抚并未配套披露流失数据、具名常任 CFO 或公开继任计划。
