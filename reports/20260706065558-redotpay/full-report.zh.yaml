          label: 发送方：移民工人、SME 或汇款付款方
          detail: 资金来自本地法币或既有加密资产持仓。
          tone: neutral
        - id: onramp
          label: 入金通道：银行转账、现金代理或加密交易所
          detail: 将法币转换为稳定币，或把既有加密资产转入钱包。
          tone: neutral
        - id: rail
          label: 稳定币结算通道（Ethereum / Tron）
          detail: Ethereum 与 Tron 合计结算约 64% 的稳定币交易量。
          tone: neutral
        - id: walletcard
          label: 消费者钱包 / 卡 App（例如 RedotPay 风格产品）
          detail: 持有稳定币余额，并支持卡消费、P2P 转账或本地出金。
          tone: positive
        - id: offramp
          label: 出金通道：本地银行、电子钱包或商户受理
          detail: 收款人将稳定币转换为可消费的本币，或直接刷卡消费。
          tone: neutral
      edges:
        - from: sender
          to: onramp
        - from: onramp
          to: rail
        - from: rail
          to: walletcard
        - from: walletcard
          to: offramp
    approximationNotes: 这是一张一般价值链图，综合了有关稳定币结算通道和汇款行为的已引用证据，并非 RedotPay 特定交易轨迹。
