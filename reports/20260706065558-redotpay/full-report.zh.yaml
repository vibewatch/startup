      - number: '7.6'
        title: 风险综合、缓释措施与否决标准
        blocks:
          - type: paragraph
            body: >-
              按严重程度排序，RedotPay 的头部风险围绕三项未解决披露缺口聚集，而不是已确认的监管违规： 相对 MiCA 执法截止日的欧盟 / 英国牌照缺口；一个未具名的发卡或 BaaS 合作伙伴，一旦流失会造成
              Quicko/Monavate 式停摆；以及在活跃 IPO 进程中，管理层流失最终体现为没有常任 CFO。三项风险通过不同但相连的路径传导进业务：
              监管缺口威胁服务被迫停止，并带来合规悬而未决导致的估值折价；合作伙伴集中度威胁突发、全面服务中断； 治理不稳则同时增加 IPO 尽调难度，削弱市场对执行的信心。第四项更系统性的风险——稳定币剧烈脱锚——
              会同时降低余额可赎回价值、拉紧流动性，并在任何上市前动摇投资者信心，从而放大其他风险。 截至本次报告，这些风险都还没有从“未解决披露缺口”跨入“已确认不利事件”；这本身就是核心尽调结论：
              下方可监测触发点——HKMA 持牌名单、EU CASP 注册或执法通知、发卡合作伙伴披露、又一名具名高管 离职，或持续稳定币脱锚——会把可管理观察项变成击穿投资逻辑的事件，而且每一项都无需内部访问即可独立观察。
