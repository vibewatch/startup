      - number: '5.3'
        title: 客户与商户工作流
        blocks:
          - type: paragraph
            body: >-
              新 RedotPay 用户用邮箱或手机号注册，确认 OTP，可选择通过身份验证器应用启用双因素认证； 随后必须完成基于 Sumsub 的身份核验——全名、出生日期和政府身份证件——账户才会解锁完整功能。
              完成核验后，用户在商户处消费只需使用接入 Visa 网络的卡，系统会在销售点把钱包余额转换为支付资金。 跨境转账使用多市场出款通道；RedotPay 的云厂商案例研究称，巴西银行出款约两分钟完成，
              相比传统通道的一到两天更快，但该数字来自公司口径，并非独立审计。商户通过 RedotPay Connect 接受稳定币时，会引导客户选择钱包、复核订单并完成即时链上确认；随后在商户后台管理结算、退款和拒付，
              后台由同一套 webhook 和 OpenAPI 层供数。最新工作流是 AI 智能体通过 CLI 的 MPP 集成完成购买； 在任何付款执行前，智能体必须披露具体服务、成本和支出上限。RedotPay
              自己发布的反欺诈指南还单独提醒用户， 剪贴板劫持恶意软件会在手动转账前替换钱包地址。
