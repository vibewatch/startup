      - number: '1.4'
        title: 合规版图与香港监管语境
        blocks:
          - type: paragraph
            body: >-
              合规是 RedotPay 自我叙事的中心，公司页面也刻意把这一点说清楚。关于页称 RedotPay 在阿根廷、加拿大、美国和香港持有或依赖注册，同时强调 ISO/IEC 27001、PCI DSS、MPC
              托管、MFA 和实时筛查。隐私政策进一步展示这种姿态的运营含义：RedotPay
              称可能收集大量身份、设备、区块链地址和生物识别数据，用于开户和合规。对于一个既要触碰加密资产又要接入现实支付的产品，这套做法是匹配的；但它也意味着 RedotPay 的运营模型离不开
              KYC、AML、托管和数据保护执行。


              这份合规负担在香港尤其关键，因为该司法辖区在 2025 年收紧了稳定币框架。HKMA 的 2025 年 7 月公告正式落地稳定币发行人制度；Davis Polk
              的分析强调，该制度带有真实的资本金和牌照要求，包括对非认可机构牌照持有人设置最低实缴股本门槛。RedotPay
              并未公开把自己定位为香港稳定币发行人，但它是一家总部关联香港的稳定币支付公司，并称正在扩展牌照和合规基础设施。尽调上的实际含义是：随着规则手册变硬，RedotPay
              能否继续国际化扩张，不只取决于用户增长，还取决于多司法辖区牌照栈是否足够结实，能支撑卡、类托管服务、借贷、出款和本币结算。
