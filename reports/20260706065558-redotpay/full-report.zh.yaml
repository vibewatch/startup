      - number: '1.3'
        title: 融资路径、估值证据与规模说法
        blocks:
          - type: paragraph
            body: >-
              RedotPay 在 2025 年的资本形成速度异常快。公司于 2025 年 3 月公开宣布由 Lightspeed 领投的 $40 million Series A；2025 年 9 月又完成 $47
              million 战略轮，引入 Coinbase Ventures，并以 $1 billion 估值登上 Crunchbase 独角兽榜。到 2025 年 12 月，PR Newswire 发布 RedotPay
              的 $107 million Series B 公告；公司称这使 2025 年总融资额达到 $194 million。因此，本章最强的估值证据仍是 2025 年 9
              月的独角兽轮，而不是后续营销表述，因为这是已审阅来源中最后一个明确完成的定价事件。


              更模糊的问题在于如何解读 RedotPay 的规模叙事。Series A 称平台注册用户超过 3 million；战略轮称用户超过 5 million、年化 TPV 达 $10 billion；Series B
              把数字提升到超过 6 million 注册用户、超过 $10 billion 年化支付量、超过 $150 million 年化收入；当前 2026 年营销页面又称用户超过 8 million、支付量 $12
              billion。这个变化方向很强，但大体仍是公司披露。公开来源没有拆分注册用户和活跃用户，没有定义年化交易量怎么算，也没有提供收入数字的经审计财务报表。因此，投资者可以把增长曲线视为可能成立且具战略意义，同时仍应把最新规模说法归类为管理层陈述，需要更硬的第三方或审计确认。
