      - number: '4.3'
        title: 成本结构、毛利驱动与营运资本
        blocks:
          - type: paragraph
            body: >-
              RedotPay 的成本结构遵循标准预付卡项目模式：Visa 网络、发卡银行或 BIN sponsor 与项目管理方一起分走交换费；Coinbase 自有 10-K
              证实，类似的银行发行、网络品牌卡也采用这一结构。Visa 2025 财年 10-K 显示，卡网络收入本身拆分为服务和数据处理两条线，绑定授权、清算和结算——RedotPay
              这类项目也会为同样功能付费。营运资本侧，RedotPay 的稳定币余额不在自身资产负债表上：Circle 的 USDC 储备放在 BlackRock 管理的储备基金和银行托管账户中；Circle 自身 Q4
              2025 业绩显示，约 63% 总储备收入支付给托管钱包、支付平台等分发伙伴，暗示 RedotPay 可能有一块尚未确认的沉淀资金收入机会。RedotPay 的 AWS 案例研究称，公司在扩至 5 million
              用户时仍控制住基础设施和 IT 成本，符合 opex 驱动、capex 轻的云成本基础。RedotPay
              自身没有披露毛利率、收入成本或单笔交易成本数字，其退单政策还通过申请费和资格排除，把部分争议处理成本转给客户。
