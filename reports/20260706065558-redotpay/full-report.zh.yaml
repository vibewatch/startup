  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              RedotPay 横跨一组拼接式监管制度，从已确认注册到重大空白都有。香港稳定币发行人牌照制度于 2025 年 8 月 1 日生效；截至香港证券及期货事务监察委员会 2026 年 5 月 27 日通函，
              香港金融管理局只向两家实体授予了稳定币发行人牌照，公开报道都没有把 RedotPay 列为其中之一。在美国，RedotPay 持有 FinCEN 货币服务业务注册，
              但公司明确把它限定为跨境基础设施，而不是直接服务美国公民；因此，若面向美国消费者推出服务， 州层面的汇款机构牌照图景仍未解决。RedotPay 在美国之外的美洲更积极， 已确认加拿大 FINTRAC MSB
              注册、阿根廷 VASP 牌照，并在 2026 年 6 月取得墨西哥 CNBV VASP 注册。最明显的缺口在欧洲：没有公开来源显示 RedotPay 持有完整的欧盟 MiCA 加密资产服务提供商授权或英国 FCA
              加密资产注册；与此同时，欧盟的 MiCA 过渡期已于 2026 年 7 月 1 日到期， 截止时欧盟内此前注册的虚拟资产公司约 80% 仍未获牌。可比发行方 Bitpanda 在 2025 年 4 月获得
              MiCA CASP 授权，展示了 RedotPay 尚未被证明持有的完整牌照。再叠加一层，FinCEN 和 OFAC 在 2026 年 4 月
              联合提出规则，拟正式把支付稳定币发行人指定为《银行保密法》下的金融机构；美国 Regulation E 的错误解决保护也很可能只覆盖预付余额中的法币计价部分，使 RedotPay
              加密计价余额在争议权利上处于法律灰区。
