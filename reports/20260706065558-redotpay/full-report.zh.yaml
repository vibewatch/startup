      - number: '6.4'
        title: 留存、韧性与满意度
        blocks:
          - type: paragraph
            body: >-
              本章审阅的任何来源中，RedotPay 都没有公开披露任何客户细分的净留存率（NRR）、总流失率或客户数流失率、 续约率、合同期限数据。可用的只有一组满意度和摩擦的替代信号。Trustpilot 汇总 2.9/5
              的分数显著低于 RedotPay 的应用商店评分；独立聚合器 JustUseApp 给出“0/100”的合法性与情绪评分， 主要来自近期关于核验被拒和账户停用的负面反馈。JustUseApp 配套的问题追踪器在
              2026 年 5 月中旬左右记录了 约 16 条用户提交的问题报告，其中付款失败（约 43.8%）和登录问题（约 25%）占比最高。 virtualcredit.cards 记录了 2026
              年反复出现的投诉：RedotPay 自动反欺诈系统在没有预警的情况下冻结账户， 人工复核有时需要数天；两份独立反诈骗评测指南都认为 RedotPay “并非彻头彻尾的骗局”，
              但鉴于监管监督缺口，建议不要持有大额余额。流程侧，RedotPay 自己的帮助中心内容显示了两级 KYC 体系（NIN/BVN/passport 用于完整核验）；独立指南称，这套流程有时会触发拒绝循环。
              公司拒付流程会收取申请费，并排除部分交易类别；而据 Sumsub 自己的客户故事， 其自动化 KYC 合作的核验通过率为 90%。
