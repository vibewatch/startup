      - - 多栖使用
        - 加密原生用户常见多栖；汇总评测显示，他们往往同时持有两到三张竞争卡
        - CoinCodeCap、Bleap 等比较网站专门帮助用户对比并更换提供方
        - 返现、质押等忠诚度功能是竞争对手压低多栖的主要抓手；RedotPay 缺少持续返现计划，在这里是结构性劣势
      - - 分发 / 伙伴准入
        - 已审阅公开来源未详述 RedotPay 的具体卡组织和 BIN 赞助方关系
        - Rain（Visa Principal Member）和 Visa Bridge 合作显示，发卡通道正越来越现成，任何 fintech 都可取得
        - 卡组织准入正走向商品化，竞争优势从发卡基础设施转向分发（app 触达、品牌）
      - - 供应 / 伙伴准入风险
        - 本次评审的证据缺口
        - Binance 2023 年 12 月停运 EEA 卡，说明网络 / 监管压力可迫使发行方完全退出某一市场
        - 尽调应确认 RedotPay 网络和 BIN 赞助方关系耐久度，因为行业已有这一先例
    notes: 本表中的 RedotPay 相关判断反映已审阅来源缺少公开披露，并不等于确认底层安排不存在。
