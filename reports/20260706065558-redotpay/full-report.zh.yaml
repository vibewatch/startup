  - id: TM005
    title: 各司法辖区监管足迹
    columns:
      - 司法辖区
      - 稳定币 / 支付制度
      - 截至运行日状态
      - 关键要求
      - 对 RedotPay 市场的意义
    rows:
      - - 美国
        - GENIUS Act（联邦支付稳定币法）
        - 2025 年 7 月 18 日颁布；实施窗口约至 2027 年
        - 1:1 储备支持、持牌发行人身份、月度披露
        - 决定 RedotPay 面向美国流可合法使用哪些稳定币
      - - 欧盟
        - MiCA（Markets in Crypto-Assets Regulation，加密资产市场法规）
        - 稳定币规则自 2024 年 6 月起生效；截至 2025 年中，据称约 45% 的发行人申请被拒
        - EMI / 信贷机构牌照；全额储备支持；60%+ 储备存放于欧盟银行
        - 不合规代币（如 USDT）面临从 RedotPay 可能接触的欧盟通道下架
      - - 香港
        - 稳定币发牌制度（HKMA）
        - 2025 年推出；适用牌照和资本门槛
        - 香港持牌发行人的最低实缴资本、储备与赎回规则
        - RedotPay 总部在香港，因此本土司法辖区稳定币规则会直接影响公司，尽管 RedotPay 本身是支付公司而非持牌发行人
      - - 阿根廷
        - 虚拟资产服务提供商（VASP）/ AML 监管
        - 截至 2025–2026 年，监管更偏支持而非限制
        - VASP 需 AML/CFT 注册；无一刀切稳定币禁令
        - 鉴于稳定币约占本地加密交易量 61.8%，阿根廷是 RedotPay 最重要的美元化通道之一
      - - 全球（IMF / BIS）
        - 没有具约束力的全球稳定币标准；仅有咨询性指引
        - 截至 2025 年 12 月，协调仍在推进
        - 「同一活动、同一风险、同一监管」原则已提出，但尚未具约束力
        - 上述制度之间的碎片化，本身就是 RedotPay 这类多司法辖区运营商的系统性与合规风险
    notes: 综合本章其他部分讨论的 GENIUS Act、MiCA、香港和阿根廷制度，以及 IMF / BIS 咨询性评论；「意义」列是基于 RedotPay 已知足迹做出的分析推断，并非公司直接披露。
