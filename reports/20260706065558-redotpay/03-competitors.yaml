callouts:
  - calloutType: risk
    title: Card-network commoditization is the single biggest structural threat to RedotPay’s moat
    body: >-
      Visa and Mastercard now offer native stablecoin settlement to any bank or fintech partner, and BaaS platforms like
      Rain give the same partners a turnkey issuing stack -- eroding the technical differentiation a standalone
      stablecoin-card issuer like RedotPay can claim.
    claimRefs:
      - CP022
      - CP036
      - CP039
      - CP040
  - calloutType: risk
    title: A competitor directly and publicly criticizes RedotPay’s own fees and lack of cashback
    body: >-
      A rival card’s comparison content alleges RedotPay charges 1%-2.2% conversion/FX fees, a non-refundable $100
      physical-card issuance fee, and offers no ongoing cashback -- an adverse, competitor-sourced claim this chapter
      flags for independent verification rather than treating as settled fact.
    claimRefs:
      - CP025
      - CP026
      - CP027
  - calloutType: strength
    title: RedotPay’s low switching cost cuts both ways
    body: >-
      Unlike Crypto.com’s CRO staking lock-ups or Wirex’s token-and-subscription-gated top tier, RedotPay does not
      appear to lock customers into a long-term commitment, letting it acquire switchers cheaply even though the same
      lack of loyalty mechanics may make it easier for those same customers to leave.
    claimRefs:
      - CP034
      - CP035
  - calloutType: insight
    title: Regulatory and trust failures are recurring, not one-off, across this category
    body: >-
      Nexo’s $22.5 million SEC penalty, Binance’s forced EEA card exit, and Wirex’s 1.2/5 Trustpilot rating together
      show that regulatory enforcement and customer-trust breakdowns are a structural feature of the custodial
      crypto-card and lending sector, not isolated incidents.
    claimRefs:
      - CP029
      - CP009
      - CP031
