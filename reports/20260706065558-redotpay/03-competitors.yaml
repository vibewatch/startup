    title: Competitor Profile Table -- Direct, Incumbent, Adjacent, Substitute, Status-Quo, and Internal-Build Alternatives
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Differentiation
      - Limitation
    rows:
      - - Crypto.com Card
        - Direct (crypto/stablecoin card)
        - Backed by Crypto.com exchange; CRO-token tiered staking from $0-$400,000
        - Retail crypto spenders wanting subscription/staking rewards
        - Up to 5% CRO cashback; Amazon/Netflix/Spotify perks at top tiers
        - Meaningful rewards require locking $400-$400,000 in CRO for ~180 days; 3% FX fee on entry tier
      - - Coinbase Card
        - Direct
        - Backed by Nasdaq-listed Coinbase (COIN); daily limit raised to $5,000 (Oct 2025)
        - US retail Coinbase account holders
        - Up to 4% rotating crypto rewards, no annual/foreign fee
        - Rewards and Apple/Google Pay integration limited to US users
      - - Bybit Card
        - Direct
        - Global exchange-backed; 2M+ reported cardholders since 2024 launch
        - Global Bybit exchange users (excl. EEA)
        - Up to 10% promotional cashback; named Mastercard "Best Performing Crypto Card" at EDGE 2025
        - Not available in EEA; top cashback tiers require high spend/VIP status
      - - OKX Card
        - Direct
        - Global exchange expanding into 30 EEA countries and Brazil (2025-2026)
        - EEA and Brazil OKX Pay users
        - 0% transaction/FX fee; only 0.1%-0.4% conversion spread
        - Virtual-card only as of 2026; no physical card yet
      - - Binance Card (EEA program)
        - Direct (discontinued)
        - Backed by world’s largest exchange by volume
        - Former EEA retail users (2020-2023)
        - Broad 60M+ merchant acceptance while active
        - Discontinued Dec 20, 2023 amid regulatory pressure; illustrates card-program discontinuation risk
      - - Gnosis Pay
        - Direct
        - Gnosis-ecosystem backed; $100M+ lifetime volume, 1.6M+ transactions, 50K+ accounts
        - EU/UK/Brazil self-custody users
        - Only card at scale offering full self-custody via Gnosis Safe smart accounts; MiCA-compliant
        - Geographic footprint limited to EU/UK/Brazil; no disclosed standalone valuation
      - - Kast
        - Direct
        - $80M Series A (Mar 2026) at $600M valuation; 1M+ users, ~$5B annualized volume
        - Global freelancers, remote workers, cross-border businesses
        - Solana-based rails; new KAST Business B2B offering; rapid revenue growth
        - New entrant; licensing/compliance build-out still in progress across new regions
      - - Rain
        - Infrastructure enabler / likely entrant via BaaS
        - $24.5M Series A (Mar 2025); Visa Principal Member; 15x revenue growth
        - Banks and fintechs wanting to launch white-label stablecoin cards
        - Vertically integrated issuing stack lets any bank/fintech replicate a RedotPay-like card quickly
        - Not consumer-facing itself; competes with RedotPay for the same bank/BaaS sponsor relationships
      - - MetaMask Card
        - Direct / adjacent
        - Consensys-backed; tied to MetaMask’s large self-custody wallet base
        - Ethereum-ecosystem self-custody users
        - 1%-3% mUSD cashback; zero foreign fees on Metal tier; spends directly from self-custody wallet
        - Rollout still limited to a subset of countries/networks
      - - Revolut
        - Adjacent (multi-currency neobank with crypto)
        - 68-70M users; $75B valuation (Sep 2025); $6.0B 2025 revenue, $2.3B pre-tax profit
        - Mainstream global consumers wanting one app for banking, FX, and crypto
        - Full banking license (UK, Mar 2026) plus crypto/FX/card in one superapp at massive scale
        - Crypto/stablecoin card spend is one of several revenue lines, not the core focus
      - - Wise
        - Substitute (cross-border transfer, no crypto)
        - Publicly listed; processes large multi-currency transfer volumes
        - Individuals and SMEs sending cross-border payments
        - Transparent 0.5%-2% fees at the real mid-market rate, no hidden FX markup
        - No stablecoin or crypto-card rail; requires a linked bank account, not a card-based spend product
      - - Western Union
        - Status quo / substitute
        - 200+-country cash-pickup and online transfer network
        - Unbanked/cash-reliant senders and recipients
        - Unmatched physical cash-pickup ubiquity
        - Effective fees and FX margins run above digital/stablecoin rails; no stablecoin settlement
      - - Visa / Mastercard native stablecoin settlement
        - Incumbent network / internal-build enabler
        - >-
          Visa ~$7B annualized settlement run rate (Apr 2026); Mastercard live with USDC/PYUSD/USDG/RLUSD/SoFiUSD (Jun
          2026)
        - Card-issuing banks and fintechs, not consumers directly
        - Lets any bank/fintech settle card transactions in stablecoins without building proprietary rails
        - Consumer-facing UX still delegated to issuers/BaaS partners, not a direct-to-consumer threat today
      - - PayPal PYUSD
        - Adjacent (stablecoin-linked consumer rewards)
        - PYUSD live in 70 markets (Mar 2026); ~4% annual reward rate in-app
        - PayPal/Venmo’s existing consumer base
        - Distributes a dollar-backed stablecoin directly inside an already-massive consumer payments app
        - Card-based point-of-sale spend of PYUSD is still nascent versus RedotPay’s card-first design
    notes: >-
      Scale/funding figures are drawn from each competitor’s own disclosures, independent press coverage, or third-party
