  - id: capability-pricing-gtm-comparison
    title: Capability, Pricing, GTM/Distribution, and Trust/Regulatory-Posture Comparison
    body: >-
      On raw pricing, the reviewed evidence is mixed for RedotPay: a competitor comparison site alleges RedotPay charges
      a 1% conversion fee on USD purchases and a combined 2.2% fee on non-USD purchases, plus a $10 virtual and
      non-refundable $100 physical card issuance fee and no ongoing cashback program -- figures this chapter treats as
      unconfirmed until corroborated by RedotPay's own fee schedule. By contrast, OKX charges no transaction or FX fee
      (only a 0.1%-0.4% conversion spread), Bybit charges 0.5% FX plus 0.9% conversion with 2%-10% tiered cashback, and
      Crypto.com's fees fall from 3% toward 0% only as CRO-staking commitments rise to $400-$400,000. On capability,
      self-custody remains rare: Gnosis Pay (Safe smart accounts) and MetaMask Card are the only reviewed products that
      let users hold assets in their own wallet until the point of sale, while RedotPay, Crypto.com, Bybit, OKX, and
      Kast all appear custodial per reviewed sources. On GTM/distribution, exchange-embedded issuers (Crypto.com, Bybit,
      OKX) inherit millions of existing exchange users at near-zero incremental acquisition cost, while Visa's and
      Mastercard's own bank-partner programs (Cross River, Lead Bank, ARQ, Nuvei) give any smaller bank the same
      stablecoin-settlement capability RedotPay relies on. On trust/regulatory posture, Gnosis Pay and OKX explicitly
      cite MiCA alignment, Bybit deliberately excludes the EEA, and Nexo's $22.5 million SEC penalty plus Binance's
      forced EEA card exit both illustrate how quickly a card or lending program's regulatory footing can be tested.
