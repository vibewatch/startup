  - id: TP004
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - Stablecoin-to-fiat card conversion technology
        - >-
          Visa and Mastercard now offer native stablecoin settlement directly to any bank/fintech issuer (Cross River,
          Lead Bank, ARQ, Nuvei), commoditizing the core conversion capability a card issuer builds its product around
        - High
        - >-
          Confirm RedotPay’s issuer/BaaS agreements and whether it has genuine technical differentiation beyond what
          Visa/Mastercard now offer natively
      - - Custodial-model trust and asset safety
        - >-
          Wirex (1.2/5 "Bad" Trustpilot rating, account-freeze complaints) and other custodial card issuers show
          recurring customer-trust failures; RedotPay is also custodial per reviewed sources
        - Medium
        - Request RedotPay’s fund-segregation, insurance, and complaint-resolution data versus peers
      - - Regulatory license durability
        - >-
          Binance’s forced December 2023 EEA card exit and Nexo’s $45M SEC/state settlement show card and lending
          programs can be shut down or fined regardless of user scale
        - High
        - Confirm RedotPay’s specific licenses/registrations in each active market and any pending regulatory inquiries
      - - Fee/rewards differentiation
        - >-
          A competitor comparison alleges RedotPay charges higher issuance ($10-$100) and FX fees (up to 2.2%) than
          several rivals (OKX 0.1%-0.4% spread) with no ongoing cashback
        - Medium
        - Obtain RedotPay’s official current fee schedule to confirm or refute the competitor-sourced figures
      - - Distribution / user-acquisition moat
        - >-
          Revolut (68-70M users) and PayPal (PYUSD in 70 markets) can add stablecoin card functionality to an
          already-massive existing user base at near-zero incremental acquisition cost
        - High
        - Assess RedotPay’s user growth and CAC trend versus large-platform entrants
      - - Infrastructure lock-in for RedotPay itself
        - >-
          Rain and Visa’s Bridge partnership let any bank/fintech stand up a competing card program on the same network
          rails RedotPay depends on, lowering the barrier for new entrants
        - Medium
        - Identify RedotPay’s actual card-issuing/BIN sponsor and contract terms to assess switching risk
    notes: >-
      Severity ratings are this review’s qualitative judgment based on the cited evidence, not a probability-weighted or
      company-disclosed risk score.
