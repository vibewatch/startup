  - id: TP005
    title: Switching Cost, Multi-Homing, and Distribution / Partner-Access Factors
    columns:
      - Factor
      - RedotPay Position
      - Competitor Contrast
      - Implication
    rows:
      - - Switching cost for consumer
        - Low -- no long-term contract identified in reviewed sources; a card can be closed or replaced quickly
        - >-
          Similar for most custodial cards (Crypto.com, Bybit, OKX); Crypto.com and Wirex add staking lock-ups of 180+
          days that raise exit cost for their own users
        - RedotPay users face low switching cost, exposing it to churn but also letting it win switchers cheaply
      - - Multi-homing
        - >-
          Common among crypto-native users, who often hold two to three competing cards simultaneously per aggregated
          review coverage
        - Comparison sites (CoinCodeCap, Bleap) exist specifically to help users compare and switch providers
        - >-
          Loyalty features (cashback, staking) are the primary lever competitors use to reduce multi-homing; RedotPay’s
          lack of an ongoing cashback program is a structural disadvantage here
      - - Distribution / partner access
        - RedotPay’s specific card-network and BIN-sponsor relationship is not detailed in reviewed public sources
        - >-
          Rain (Visa Principal Member) and Visa’s Bridge partnership show issuing rails are increasingly available
          off-the-shelf to any fintech
        - >-
          Card-network access is becoming commoditized, shifting competitive advantage toward distribution (app reach,
          brand) rather than issuing infrastructure
      - - Supply/partner access risk
        - An evidence gap in this review
        - >-
          Binance’s December 2023 EEA card discontinuation shows network/regulatory pressure can force an issuer to exit
          a market entirely
        - Diligence should confirm RedotPay’s network and BIN-sponsor durability given this sector-wide precedent
    notes: >-
      RedotPay-specific positions in this table reflect the absence of public disclosure in reviewed sources, not a
      confirmed absence of the underlying arrangement.
