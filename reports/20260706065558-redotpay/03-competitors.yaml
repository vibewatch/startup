  title: Competitors
  summary: >-
    RedotPay competes against at least seven distinct categories of alternative -- exchange-linked crypto cards
    (Crypto.com, Bybit, OKX, Coinbase), self-custodial stablecoin-native challengers (Gnosis Pay, Kast, MetaMask Card),
    card-network incumbents now offering native stablecoin settlement (Visa, Mastercard), adjacent superapps (Revolut,
    PayPal PYUSD), traditional cross-border substitutes (Wise, Western Union), and Banking-as-a-Service infrastructure
    (Rain) that lets any bank replicate RedotPay's product. A competitor-authored comparison site directly and adversely
    alleges RedotPay charges higher fees (1%-2.2%) and issuance costs ($10-$100) than several rivals with no ongoing
    cashback, while Nexo's $22.5 million SEC settlement, Binance's forced 2023 EEA card exit, and Wirex's 1.2/5
    Trustpilot rating show that regulatory and trust failures are a recurring, sector-wide feature rather than isolated
    events.
sections:
  - id: competitive-landscape-overview
    title: "Competitive Landscape: Direct Peers, Incumbents, Adjacents, Substitutes, and Likely Entrants"
    body: >-
      RedotPay competes in a crowded and fast-shifting field that spans at least seven categories of alternative. Direct
      peers are exchange-linked or self-custodial crypto/stablecoin cards: Crypto.com and Bybit run large CRO- or
      Mastercard-branded card programs with staking- and VIP-tier-based rewards; Coinbase's Visa debit card raised its
      US daily spending cap to $5,000 in October 2025; OKX expanded its near-zero-fee virtual card across all 30 EEA
      countries and into Brazil; and Gnosis Pay and Kast represent the newer, better-funded wave of stablecoin-native
      challengers, the former self-custodial and MiCA-compliant, the latter a Solana-based, $600 million-valued Series A
      company. Binance's forced December 2023 exit from the EEA card market is a live reminder that even the largest
      exchange brand can lose an entire regional card program to regulatory pressure. Incumbent card networks -- Visa
      and Mastercard -- are no longer passive rails: both now offer native stablecoin settlement directly to bank and
      fintech partners, effectively internalizing the technology a standalone issuer like RedotPay built its product
      around. Adjacent players include Revolut, whose 68-70 million users and crypto/FX/banking superapp dwarf any
      dedicated crypto-card issuer's scale, and PayPal, whose PYUSD stablecoin is now live in 70 markets with a 4%
      in-app reward. Wise and Western Union sit at the substitute and status-quo end of the spectrum -- Wise as a
      transparent, crypto-free low-fee alternative, and Western Union as the still-large (over $130 billion market)
      cash-pickup incumbent that stablecoin cards are trying to displace. Finally, Rain's Banking-as-a-Service
      card-issuing stack is the clearest internal-build/likely-entrant path: any bank or fintech can plug into it and
      stand up a RedotPay-like consumer card without building settlement infrastructure from scratch.
