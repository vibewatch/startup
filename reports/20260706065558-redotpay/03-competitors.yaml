  - id: switching-costs-distribution-power-and-partner-access
    title: Switching Cost, Lock-in, Multi-Homing, and Distribution/Partner Access
    body: >-
      Switching cost for the end consumer looks structurally low across almost the entire category: none of the reviewed
      providers, including RedotPay, appear to lock customers into a long-term contract, and dedicated ranking sites
      such as CoinCodeCap exist specifically to help crypto-native users compare and multi-home across two or three
      cards at once. Where competitors do build lock-in, it is through loyalty mechanics rather than contracts:
      Crypto.com requires CRO holders to lock tokens for roughly 180 days to keep top-tier rewards, and Wirex's highest
      cashback tier requires holding about 7.5 million WXT tokens (roughly $55,000) plus a monthly subscription fee --
      both far larger commitments than any mechanism identified for RedotPay in this review. Because RedotPay's reviewed
      fee structure includes no ongoing cashback program, it may be structurally weaker at reducing multi-homing than
      staking- or subscription-gated rivals, even though its lower switching cost also means it can win switching
      customers cheaply. The deeper structural question is distribution and partner access: card-network sponsorship (a
      Visa or Mastercard principal membership, or a bank/BIN sponsor relationship) is the actual supply constraint in
      this category, and that constraint is loosening. Rain's platform and Visa's expanded Bridge partnership both let a
      bank or fintech become a stablecoin-card issuer without RedotPay's own infrastructure investment, and Binance's
      December 2023 forced exit from the EEA card market is a concrete precedent for how quickly network or regulatory
      pressure can sever an issuer's market access entirely. RedotPay's own specific network and BIN-sponsor
      relationship is not detailed in any source reviewed for this chapter, which this chapter flags as a diligence gap
      rather than an assumed weakness.
    claimRefs:
