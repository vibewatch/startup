  - TE004
- id: roadmap-maturity
  title: Roadmap & Product Maturity
  body: 'RedotPay shipped on a dense multi-track 2026 roadmap: Bitcoin Cash and Litecoin asset support in April, agentic stablecoin payments on Tempo''s Machine Payments Protocol in May, RedotPay Connect''s B2B launch and an XRP utility integration in early June, a Mexico VASP registration on June 11, and the RedotPay Pro cashback membership on June 16 — spanning asset coverage, agentic commerce, enterprise payments, compliance, and consumer loyalty simultaneously. Two initiatives remain explicitly forward-looking rather than shipped: RedotPay''s cloud vendor case study says the company is evaluating AWS Application Auto Scaling and exploring generative-AI agents for routine support automation, neither of which has an independent shipped-date confirmation. Relative maturity varies sharply by module: the wallet and Visa card are the most available and broadly used surfaces, though the underlying card-network relationship is confirmed only by independent reporting; RedotPay Connect is a newly
    launched product line without independent adoption data yet; the P2P Marketplace and Earn remain region-gated with RedotPay disclaiming counterparty liability; and the CLI/MPP agentic-payment surface, while technically well-documented for developers, is an early-stage capability that an independent audit has already flagged for security risk patterns that need active mitigation before it can be considered enterprise-ready.'
