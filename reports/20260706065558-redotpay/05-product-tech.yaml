  title: Product & Technology
  summary: RedotPay pairs a mainstream multi-currency wallet and Visa-network spending card with an AWS-hosted, Fireblocks-custodied architecture, and in 2026 pushed into merchant payments (RedotPay Connect), new assets, and early agentic-payment tooling (CLI/MPP) — while PCI DSS status remains self-declared, two-factor authentication is optional, and an independent audit has already flagged prompt-injection and exfiltration risk in the agent-facing CLI.
sections:
- id: product-portfolio
  title: Product Portfolio in Customer Workflow Terms
  body: 'RedotPay''s product line is built around a multi-currency stablecoin wallet paired with a Visa-network virtual and physical spending card accepted at more than 130 million merchants worldwide, letting retail users hold crypto and spend it like cash without a separate cash-out step. Around that core, RedotPay has added a P2P Marketplace for peer-to-peer crypto trading across 50-plus currencies and 200-plus payment methods, and RedotPay Earn for yield on idle holdings, both restricted to selected regions and explicitly disclosed as carrying counterparty and capital risk. In June 2026 the company entered enterprise payments for the first time with RedotPay Connect, a merchant gateway advertising sub-2% processing fees and up to 70% lower costs than incumbent card-network gateways. An affiliate program monetizes referrals at up to 40% commission. The newest and least proven surface is developer-facing: an open-source CLI and Machine Payments Protocol (MPP) integration that let AI agents
    initiate stablecoin payments under an owner-approved spend cap, positioning RedotPay at the frontier of agentic commerce rather than as a mainstream consumer feature yet.'
