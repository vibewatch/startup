    - Multi-day bank wire or money-transfer operator with FX spread
    - Multi-market payout rail
    - ~2-minute crypto-to-local-bank payout to Brazil reported vs 1-2 day bank rails
    - Figure is company-reported via its cloud vendor's case study, not independently audited
  - - Accept stablecoin payments as a merchant
    - Integrate several crypto payment processors manually
    - RedotPay Connect single-API gateway with instant local-currency settlement
    - Claimed sub-2% fees, up to 70% lower than incumbent gateways
    - No independent merchant-volume or uptime data published yet
  - - Trade crypto peer-to-peer
    - Use informal OTC channels or foreign exchanges
    - RedotPay P2P Marketplace with 200+ payment methods
    - Wider payment-method choice inside supported regions
    - Available in selected regions only; RedotPay itself disclaims counterparty-risk liability
  - - Let an AI agent complete a purchase autonomously
    - Manual checkout per transaction
    - redotpay-cli + Machine Payments Protocol handles 402-response retries under an explicit spend cap
    - Enables agent-initiated stablecoin payments with owner-approved limits
