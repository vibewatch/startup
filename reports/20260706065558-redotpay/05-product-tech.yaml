  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow (status quo)
  - RedotPay solution
  - Measurable benefit
  - Limitation
  rows:
  - - Spend stablecoins at a physical merchant
    - Convert crypto to fiat via an exchange, withdraw to a bank, then pay with a separate card
    - Visa-network card auto-converts wallet balance at point of sale
    - Accepted at 130M+ merchants without a manual pre-conversion step
    - Card network / BIN-sponsor identity confirmed only by independent reporting, not RedotPay's own card page
