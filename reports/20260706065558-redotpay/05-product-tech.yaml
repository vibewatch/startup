  evidenceGaps:
  - type: access-blocked
    severity: minor
    topic: reliability
    missingEvidence: An official, independently monitored uptime/incident-history page for RedotPay's app and API.
    whyItMatters: Without a status history, diligence cannot independently corroborate the platform's reliability track record beyond scattered user complaints.
    diligencePath: Request historical uptime/incident logs directly from RedotPay or monitor a third-party aggregator (e.g., Downdetector) over a defined window.
    relatedQuestionRefs:
    - QE026
  - type: missing-source
    severity: material
    topic: trust-compliance
    missingEvidence: An independently published PCI DSS Attestation of Compliance (AOC) rather than a company self-declaration.
    whyItMatters: PCI DSS status materially affects confidence in payment-card data handling; a self-declaration alone is weaker evidence than an auditor-issued AOC.
    diligencePath: Request the current AOC and assessor name directly from RedotPay's compliance team.
    relatedQuestionRefs:
    - QE027
  - type: stale
    severity: minor
    topic: roadmap
    missingEvidence: Confirmation of whether RedotPay has since shipped or shelved the AWS Application Auto Scaling and generative-AI support-agent initiatives mentioned as exploratory in its cloud vendor's case study.
    whyItMatters: These items were framed as forward-looking as of the case study's publication; their current shipped/unshipped status affects how much roadmap credit to assign.
    diligencePath: Follow up with RedotPay engineering or monitor future AWS/company announcements for a shipped confirmation.
    relatedQuestionRefs:
    - QE031
  - type: conflicting-data
    severity: minor
    topic: architecture
    missingEvidence: A first-party RedotPay statement naming Visa and StraitsX as its card network and BIN sponsor.
    whyItMatters: The network/BIN-sponsor relationship currently rests on one independent news report and one review site rather than RedotPay's own disclosure, leaving room for regional variation.
    diligencePath: Confirm directly with RedotPay's partnerships team or its card terms and conditions by region.
    relatedTableRefs:
    - TE001
    - TE003
  - type: enumeration-incomplete
    severity: minor
    topic: product-portfolio
    missingEvidence: A complete, company-published list of all supported blockchains and spendable assets by region.
    whyItMatters: Asset/chain support varies by market and evolves quickly (e.g., 2026 BCH/LTC and XRP additions); the current table relies on a single independent review for the full chain list.
    diligencePath: Cross-check RedotPay's in-app supported-asset list per region against the independent review used here.
    relatedTableRefs:
    - TE001
