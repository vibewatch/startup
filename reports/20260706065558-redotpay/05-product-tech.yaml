- id: trust-security-compliance
  title: Trust, Security & Compliance
  body: 'RedotPay''s information security management system earned ISO/IEC 27001 certification from auditor SGS, announced March 30, 2026, giving the company an independently verifiable security credential. By contrast, its PCI DSS compliance rests on a company self-declaration; no independently published Attestation of Compliance was found among the sources reviewed for this chapter, so that claim carries materially lower evidentiary weight than the ISO certification. Two-factor authentication is optional rather than mandatory by default, a weaker baseline than KYC, which is mandatory for every user via Sumsub. On the regulatory side, RedotPay has been actively expanding its licensing footprint through 2026, adding a Mexico VASP registration in June to sit alongside an existing Argentina VASP license, a US FinCEN MSB registration, and a Canada FINTRAC MSB registration, and it documents a Mutual Legal Assistance Treaty process for handling international law-enforcement requests. The most
    novel compliance surface is the agentic-payment CLI itself: an independent security reviewer (ClawHub) has published a vulnerability-pattern catalog — covering prompt injection, trigger abuse, and data exfiltration — that any integrator of RedotPay''s agent-facing tooling should treat as a live risk rather than a solved problem. Independent app-monitoring sites also document recurring 2026 user complaints about failed payments, login errors, and connectivity issues, which is the clearest adverse signal on day-to-day platform reliability.'
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE035
