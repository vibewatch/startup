  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: revenue-mix-disclosure
    missingEvidence: A product-line revenue split between the legacy consumer card and the new RedotPay Connect B2B gateway, or an audited income statement showing revenue recognition basis.
    whyItMatters: Without a segment split, it is impossible to tell how reliant RedotPay's ~$150-158M annualized revenue is on the mature consumer card versus the unproven B2B channel launched in June 2026.
    diligencePath: Request management accounts or an investor-deck revenue-by-segment schedule directly from RedotPay, or await segment disclosure in any IPO S-1 filing.
    relatedQuestionRefs:
    - QI003
  - type: missing-source
    severity: material
    topic: cac-disclosure
    missingEvidence: RedotPay's own customer acquisition cost, blended marketing spend, and payback period by channel.
    whyItMatters: Without RedotPay-specific CAC data, the analysis must rely on generic 2026 crypto/fintech CAC benchmarks ($85-$200) that may not reflect RedotPay's actual referral-heavy, emerging-market growth motion.
    diligencePath: Request marketing spend and cohort payback data by channel and geography during management diligence sessions.
    relatedQuestionRefs:
    - QI008
  - type: missing-source
    severity: blocking
    topic: unit-cost-disclosure
    missingEvidence: Gross margin, cost of revenue, and per-transaction cost-to-serve figures.
    whyItMatters: Without a cost-of-revenue breakdown, the implied ~1.5% blended take rate cannot be translated into an actual contribution margin after network, BIN-sponsor, and compliance costs.
    diligencePath: Request a unit-economics model or cost-of-revenue schedule covering network fees, issuer/BIN-sponsor share, and compliance overhead.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI003
  - type: enumeration-incomplete
    severity: material
    topic: user-cohort-metrics
    missingEvidence: Active-versus-registered user split, retention or churn, and ARPU by cohort or geography.
    whyItMatters: Registered-user counts of 6-7 million may overstate the actively spending base; without retention and ARPU data, the durability of the reported take rate cannot be assessed.
    diligencePath: Request cohort retention and ARPU data by signup vintage and geography, or third-party app-analytics panel data as a proxy.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: blocking
    topic: capital-adequacy-disclosure
    missingEvidence: Cash on hand, monthly burn, runway, and the terms of any credit facility.
    whyItMatters: Without these figures, capital adequacy rests entirely on an unaudited spokesperson claim of positive cash flow, leaving financing-dependency risk unquantified ahead of a prospective IPO.
    diligencePath: Request the latest management accounts, bank statements, or audited financials under NDA prior to any investment decision.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Any audited financial statements (income statement, balance sheet, cash-flow statement) for RedotPay or its operating entity, Red Dot Technology Limited.
    whyItMatters: Every revenue, volume, and profitability figure currently in the public record rests on spokesperson statements and press coverage rather than audited financials, which is the single largest blocker to underwriting RedotPay's financial verdict.
    diligencePath: Request audited financials or management accounts under NDA, or monitor for audited figures in any future IPO S-1 registration statement.
    relatedQuestionRefs:
    - QI028
