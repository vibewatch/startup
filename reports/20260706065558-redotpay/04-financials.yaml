- id: public-traction-metric-gaps
  title: Public Traction Versus Private-Metric Gaps
  body: 'RedotPay''s public traction metrics are large and consistent across independent sources: more than 6 million registered users across 100+ countries as of November 2025, rising past 7 million by mid-2026, and roughly $391 million in March 2026 crypto-card transaction volume alone -- about 80% of the entire ~$600 million global monthly crypto-card market that month and more than triple March 2025''s level. Full-year 2025 volume is put at $2.95 billion, an estimated 80.6% share of global crypto-card volume. Measured by transaction count rather than dollar volume, RedotPay is not the largest processor: competitor EtherFi logged more transactions in March 2026 despite far lower dollar volume, implying RedotPay''s average ticket size is materially larger, consistent with a remittance- and bill-pay-oriented use case. What the public record does not show is any active-versus-registered user split, retention or churn data, or ARPU by cohort or geography -- meaning the headline user and volume figures could overstate the durably engaged base, and this gap sits squarely between RedotPay''s impressive top-line scale and the private metrics an underwriter would need to size true customer lifetime value.'
