- id: capital-adequacy-financing
  title: Capital Adequacy and Financing Dependency
  body: RedotPay closed a $107 million Series B in December 2025, taking 2025's total capital raised to $194 million and pushing its valuation above $1 billion; a broad venture syndicate spanning Sequoia/HSG, Goodwater, Pantera, Blockchain Capital, Circle Ventures, Coinbase Ventures, Galaxy, Accel, Lightspeed, and Vertex backs the company, reducing dependence on any single financing source. As of early 2026, RedotPay was reportedly in talks to raise up to a further $150 million ahead of a prospective US IPO that could raise more than $1 billion at a valuation above $4 billion, working with JPMorgan, Goldman Sachs, and Jefferies; a company spokesperson described the round as opportunistic rather than need-driven, citing "strong cash flow." No source reviewed discloses RedotPay's actual cash on hand, monthly burn, runway, or any debt or credit-facility terms -- capital adequacy currently rests on that unaudited cash-flow claim rather than verifiable figures. RedotPay's principal financial counterparty exposure runs through its stablecoin issuers (Circle/USDC, Tether/USDT) rather than its own balance-sheet leverage, since no RedotPay debt facility is disclosed anywhere in the record reviewed. Separately, unconfirmed reports describe team consolidation and compliance-function turnover alongside the fundraising push, which RedotPay has not officially addressed.
