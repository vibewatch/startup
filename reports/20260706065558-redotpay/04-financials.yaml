- calloutType: strength
  title: Well-Corroborated Top-Line Scale
  body: RedotPay's more than $10B annualized volume, $150-158M annualized revenue, and 6-7M user base are corroborated across multiple independent outlets and Bloomberg-sourced IPO coverage, giving the top-line growth story unusually strong cross-source support for a private crypto fintech.
  claimRefs:
  - CI005
  - CI024
  - CI025
  - CI030
  - CI032
- calloutType: risk
  title: No Audited Financials or Cash-Runway Visibility
  body: Cash on hand, burn rate, runway, gross margin, and debt terms are undisclosed in every source reviewed; capital adequacy currently rests entirely on an unaudited spokesperson claim of positive cash flow.
  claimRefs:
  - CI022
  - CI034
  - CI043
- calloutType: risk
  title: User Complaints About Frozen Funds and Slow Dispute Resolution
  body: Independent review sites report recurring complaints about sudden account freezes, delayed withdrawals, and multi-day fraud-dispute resolution, alongside a lack of tier-1 regulatory licensing -- a consumer-protection and reputational risk that could affect retention and regulatory scrutiny.
  claimRefs:
  - CI038
  - CI039
  - CI040
- calloutType: recommendation
  title: Prioritize Audited Financials and Segment Revenue Before Underwriting
  body: The single highest-value diligence step is obtaining audited financials or management accounts that split revenue by product line (consumer card vs. RedotPay Connect) and disclose cost of revenue, cash position, and any debt -- closing the gap that currently separates RedotPay's public narrative from an underwritable financial picture.
  claimRefs:
  - CI010
  - CI022
  - CI028
  - CI034
