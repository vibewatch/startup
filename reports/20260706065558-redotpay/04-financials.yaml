- id: FI004
  title: Capital Intensity & Cash-Flow Exposure Map
  type: matrix
  layout: wide
  summary: Where RedotPay's principal cost and balance-sheet exposures sit across custody, card issuance, infrastructure, compliance, and the new B2B gateway.
  data:
    columns:
    - Cash Intensity
    - Balance-Sheet Ownership
    - Primary Risk Driver
    rows:
    - label: Stablecoin reserve custody (USDC/USDT)
      values:
      - label: Low for RedotPay
        tone: positive
        detail: Reserves are held by Circle/Tether, not on RedotPay's own balance sheet.
      - label: Third-party (Circle, Tether, BlackRock-managed fund, bank custodians)
        tone: neutral
        detail: RedotPay does not appear to hold its own reserve-backed stablecoin.
      - label: Issuer/custodian counterparty and de-peg risk
        tone: negative
        detail: Concentration in a small number of stablecoin issuers and custodians.
    - label: Card issuance & network settlement
      values:
      - label: Medium
        tone: neutral
        detail: Network and issuing-bank/BIN-sponsor fees are shared per transaction.
      - label: Shared with Visa and an issuing bank / BIN sponsor
        tone: neutral
        detail: Structurally similar to Coinbase's disclosed bank-issued card program.
      - label: Interchange or network-fee compression
        tone: neutral
        detail: Regulatory interchange caps exist in some jurisdictions, per Coinbase's 10-K risk disclosure.
    - label: Cloud infrastructure (AWS)
      values:
      - label: Low (usage-based opex)
        tone: positive
        detail: Company case study describes infrastructure and IT costs kept in check while scaling.
      - label: RedotPay-operated on AWS
        tone: neutral
        detail: No owned data-center or hardware capex disclosed.
      - label: Scaling cost-efficiency claims unverified beyond a single partner case study
        tone: neutral
        detail: AWS case study is partner-published, not an independent cost audit.
    - label: Compliance & multi-jurisdiction licensing
      values:
      - label: Medium-to-high (headcount and licensing capital)
        tone: negative
        detail: Expanding into new licensed markets requires compliance headcount and, in some jurisdictions, minimum capital.
      - label: RedotPay-operated
        tone: neutral
        detail: Licensing capital requirements are borne directly by RedotPay's regulated entities.
      - label: Regulatory capital regimes such as Hong Kong's HKMA stablecoin rules illustrate the type of capital floor regulators can impose on adjacent licensed activities.
        tone: negative
        detail: RedotPay itself is a card/wallet program, not a licensed stablecoin issuer, but expansion into issuer-like activities would raise its own capital bar.
    - label: RedotPay Connect merchant settlement (B2B)
      values:
      - label: Low-to-medium (newly launched, June 2026)
        tone: neutral
        detail: Gateway model, not a balance-sheet-heavy lending or float product as currently described.
      - label: RedotPay-operated gateway
        tone: neutral
        detail: Settlement risk during the fiat conversion window is not disclosed.
      - label: Adoption and volume risk; pricing at scale is undisclosed
        tone: neutral
        detail: Only a launch-marketing claim exists; no merchant-adoption data has been reported yet.
  approximationNotes: Tone labels reflect a qualitative risk read (positive = lower capital intensity/risk, negative = higher), not a quantitative scoring model.
