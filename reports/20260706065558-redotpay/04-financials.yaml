- id: TI005
  title: Public Financial Gaps
  columns:
  - Missing Private Metric
  - Impact
  - Diligence Path
  rows:
  - - Cash on hand / monthly burn / runway
    - Cannot assess solvency risk or true dependency on the pending funding round
    - Request the latest management accounts or bank statements under NDA
  - - Gross margin / cost of revenue
    - Cannot verify whether the ~1.5% take rate translates into a sustainable margin after network, BIN-sponsor, and compliance costs
    - Request a cost-of-revenue schedule or unit-economics model
  - - Active-vs-registered user split, retention, ARPU by cohort
    - Registered-user counts of 6-7 million may overstate the true engaged base; repeat-usage economics are unclear
    - Request cohort retention and ARPU data by signup vintage and geography
  - - Product-line revenue mix (consumer card vs. RedotPay Connect B2B)
    - Cannot assess how reliant revenue is on the legacy consumer card versus the newly launched (June 2026) B2B gateway
    - Request segment reporting or an investor-deck revenue split
  - - CAC, payback period, and marketing spend
    - Cannot assess unit-economics sustainability or the true organic-versus-paid growth mix
    - Request marketing spend and cohort payback data by channel
  - - Debt / credit facilities / project-finance obligations
    - Unknown whether any working-capital or reserve-related credit lines create leverage risk
    - Request a debt schedule or credit-facility disclosure
  - - Audited financial statements
    - All revenue, volume, and profitability figures currently rest on spokesperson statements and press coverage, not audited financials
    - Request audited financials or await disclosure in any IPO S-1 filing
