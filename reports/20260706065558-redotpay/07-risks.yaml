- id: people-execution-risk
  title: People, Execution & Governance Risk
  body: RedotPay's leadership bench has thinned during the same window it is pursuing its most ambitious capital-markets moves. Bloomberg reporting, relayed by multiple outlets in March 2026, found RedotPay lost at least five senior staff members over roughly twelve months, including its chief financial officer, with the compliance-chief role turning over twice and no permanent CFO in place as of that reporting — a co-founder has covered finance, investor relations, and corporate development on an interim basis. The departures were attributed to a demanding '996' work culture common among Chinese technology firms, and RedotPay has not confirmed any layoffs or restructuring, nor disclosed specific departure counts, instead framing the changes as natural scaling. The company also faces investor scrutiny over its ties to mainland China even though its product explicitly excludes mainland Chinese users — a sensitivity reporting links directly to both the turnover and the timing of its IPO plans. On the execution side, RedotPay has engaged JPMorgan Chase, Goldman Sachs, and Jefferies to work on a potential U.S. listing, concentrating IPO-execution dependency on a small group of external advisors while deal terms remain under review. Public reporting continues to list co-founder Michael Gao as CEO with all co-founders described as actively engaged, but that reassurance has not been paired with disclosed attrition data, a named permanent CFO, or a public succession plan.
  claimRefs:
