callouts:
- calloutType: risk
  title: Two undisclosed single points of failure could each halt core functionality overnight
  body: RedotPay has not named its underlying card-issuing bank or BaaS partner, and relies on a single custodian (Fireblocks) for wallet custody without disclosed redundancy. The Quicko/Monavate precedent shows a BaaS-partner license revocation can cut card and banking functionality overnight with no transition window.
  claimRefs:
  - CR030
  - CR012
  - CR029
- calloutType: risk
  title: Executive bench depth has not kept pace with a $4 billion IPO ambition
  body: RedotPay lost at least five senior staff in roughly a year, including its CFO, and had not replaced the CFO role permanently as of the most recent reporting — a governance gap that sits awkwardly beside a pending U.S. listing process advised by top-tier banks.
  claimRefs:
  - CR034
  - CR035
  - CR038
- calloutType: assumption
  title: Regulatory silence is being read as compliance, not confirmed as licensure
  body: RedotPay's compliance-first messaging spans confirmed US/Canada/Argentina/Mexico registrations, but the absence of any public MiCA CASP or FCA registration should not be assumed to mean an application is pending; it should be independently confirmed before crediting RedotPay with EU/UK market access.
  claimRefs:
  - CR001
  - CR007
  - CR008
- calloutType: recommendation
  title: Diligence should force disclosure of the card-issuing partner and jurisdictional user mix
  body: Before underwriting the IPO case, diligence should obtain the identity and license status of RedotPay's card-issuing/BaaS partner and a jurisdiction-by-jurisdiction breakdown of active users, since both materially change the sizing of regulatory and partner-concentration risk.
  claimRefs:
  - CR030
  - CR009
  - CR041
