chapter:
  number: 7
  title: Risks
  summary: 'RedotPay''s risk profile is dominated by disclosure gaps rather than confirmed breaches: no public evidence shows an EU MiCA CASP or UK FCA registration even as MiCA''s 1 July 2026 deadline arrived, RedotPay has not named its card-issuing or BaaS partner despite a live precedent (Quicko/Monavate) of overnight partner-driven shutdowns, and Bloomberg-reported executive turnover has left the company without a permanent CFO during an active $150 million raise and up-to-$4 billion IPO push.'
sections:
- id: regulatory-legal-risk
  title: Regulatory & Legal Risk
  body: 'RedotPay operates across a patchwork of regulatory regimes that ranges from confirmed registrations to material silence. Hong Kong''s stablecoin-issuer licensing regime took effect on 1 August 2025, and as of the Securities and Futures Commission''s 27 May 2026 circular, the Hong Kong Monetary Authority had granted stablecoin-issuer licences to only two entities, neither of which public reporting identifies as RedotPay. In the United States, RedotPay holds a FinCEN Money Services Business registration that it explicitly frames as limited to cross-border infrastructure rather than direct service to U.S. citizens, leaving the state-by-state money-transmitter licensing picture for any U.S. consumer rollout unresolved. RedotPay has been more active in the Americas outside the U.S., confirming a Canadian FINTRAC MSB registration, an Argentine VASP license, and, as of June 2026, a Mexican CNBV VASP registration. The starkest gap sits in Europe: no public source shows RedotPay holding a full EU MiCA Crypto-Asset Service Provider authorization or a UK FCA cryptoasset registration, even as the EU''s MiCA transitional period expired on 1 July 2026 and roughly 80% of previously registered virtual-asset firms across the bloc remained unlicensed at that deadline. Comparable issuer Bitpanda''s April 2025 MiCA CASP grant illustrates the fuller licence RedotPay has not been shown to hold. Layered on top, FinCEN and OFAC jointly proposed a rule in April 2026 that would formally designate payment stablecoin issuers as financial institutions under the Bank Secrecy Act, and U.S. Regulation E''s error-resolution protections likely cover only the fiat-denominated slice of a prepaid balance, leaving crypto-denominated RedotPay balances in a legal gray zone for dispute rights.'
