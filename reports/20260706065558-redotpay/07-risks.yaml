  evidenceGaps:
  - type: missing-source
    severity: material
    topic: jurisdiction-user-share
    missingEvidence: RedotPay does not publish a jurisdiction-by-jurisdiction breakdown of its 6-7 million-plus users, so the share operating in jurisdictions where RedotPay holds no confirmed license cannot be computed; this leaves the regulatory-legal risk register's (TR001) partial-coverage jurisdiction list unweighted by user exposure.
    whyItMatters: Without this breakdown, the true regulatory exposure of RedotPay's user base to enforcement action in unlicensed markets cannot be sized.
    diligencePath: Request jurisdiction-level active-user and volume breakdowns in diligence, and cross-check against RedotPay's confirmed license list (Hong Kong, US FinCEN, Canada FINTRAC, Argentina, Mexico).
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR001
  - type: stale
    severity: minor
    topic: security-incident-disclosure
    missingEvidence: No independent breach-tracking source lists a confirmed RedotPay data breach or security incident for 2025-2026, but absence of evidence in trackers is not equivalent to a confirmed clean record.
    whyItMatters: If an incident occurred but was not publicly disclosed or picked up by trackers, it would materially change the operational risk assessment.
    diligencePath: Request RedotPay's incident-response log and any regulator or card-network breach notifications directly in diligence.
    relatedQuestionRefs:
    - QR019
  - type: missing-source
    severity: material
    topic: chargeback-sla
    missingEvidence: RedotPay's chargeback process page does not disclose dispute-resolution service-level timelines or win/loss rates.
    whyItMatters: Dispute SLA and success-rate data materially affect the credibility of RedotPay's consumer-protection posture.
    diligencePath: Request internal chargeback SLA and outcome statistics, and compare against Visa/Mastercard network dispute-resolution benchmarks.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: blocking
    topic: card-issuer-partner-disclosure
    missingEvidence: RedotPay has not publicly named its underlying card-issuing bank or BaaS partner.
    whyItMatters: Given the Quicko/Monavate precedent, an unnamed issuing partner represents an unquantifiable single-point-of-failure risk to core card functionality.
    diligencePath: Request the identity, license status, and contractual redundancy terms of RedotPay's card-issuing and BaaS partners directly from the company.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: contingency-capital-disclosure
    missingEvidence: RedotPay does not publish any contingency or regulatory capital-buffer disclosures for dispute, chargeback, or stablecoin-depeg loss scenarios.
    whyItMatters: Absent this disclosure, investors cannot assess RedotPay's resilience to a simultaneous surge in customer withdrawal demand or dispute volume.
    diligencePath: Request balance-sheet and liquidity-buffer disclosures, or confirm regulatory capital requirements once RedotPay's stablecoin-issuer or MTL license applications (if any) are finalized.
    relatedQuestionRefs:
    - QR033
  - type: conflicting-data
    severity: minor
    topic: custody-model-conflict
    missingEvidence: An affiliate review site's non-custodial characterization of RedotPay directly conflicts with Fireblocks' custodial wallet-management description, and neither source resolves the discrepancy.
    whyItMatters: Custodial versus non-custodial status changes who bears counterparty and freeze risk, a first-order fact for assessing account-freeze complaints.
    diligencePath: Request RedotPay's architecture documentation or a technical walkthrough clarifying which balances are custodial versus self-custodied.
    relatedQuestionRefs:
    - QR018
