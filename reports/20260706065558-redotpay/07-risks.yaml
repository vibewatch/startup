- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - HK stablecoin licensing gap
    - HKMA licensee list
    - RedotPay named as licensee, denied applicant, or subject to an enforcement notice
    - Re-rate regulatory risk down if licensed; treat denial or enforcement as a thesis-break event
  - - EU MiCA exposure
    - ESMA / national regulator CASP register
    - RedotPay entity appears on the register, or an EU cease-and-desist is issued
    - Confirm EU revenue exposure and re-rate regulatory risk accordingly
  - - Card-issuing bank concentration
    - Public disclosure of the BaaS/issuing partner
    - Partner is named, or a Quicko/Monavate-style license revocation hits a RedotPay partner
    - Treat an issuer-side revocation as a near-term thesis-break event
  - - Stablecoin reserve / depeg risk
    - USDC/USDT peg and Circle reserve reporting
    - A sustained depeg beyond roughly 3% for more than 24 hours, or a reserve-audit qualification
    - Stress-test RedotPay's liquidity and withdrawal-processing capacity
  - - Executive turnover
    - CFO and compliance-chief appointments
    - A permanent CFO is hired, or a further named C-suite departure occurs (especially CEO or co-founder)
    - Downgrade governance confidence sharply on any founder-level departure
  - - Account-freeze complaint rate
    - Independent review-platform ratings and complaint themes
    - Sustained 1-2 star share above roughly 35%, or a regulator-logged complaint spike
    - Escalate as a reputational and regulatory risk requiring management response
  - - Agentic CLI security
    - Independent security-scanner findings
    - A confirmed exploit or fund-loss incident tied to the CLI/agent tooling
    - Trigger immediate operational-risk escalation and a product-suspension review
  - - IPO execution
    - JPMorgan/Goldman/Jefferies mandate status and any S-1 filing
    - A formal registration statement is filed, a mandate is withdrawn, or the process is postponed indefinitely
    - Re-rate valuation and liquidity-timeline assumptions
  - - Consumer dispute-rights gap
    - CFPB guidance or enforcement on crypto prepaid products
    - CFPB clarifies Regulation E scope or takes enforcement action against a crypto card issuer
    - Reassess RedotPay's US consumer-protection exposure
  notes: Triggers and thresholds are analyst-defined monitoring heuristics for diligence purposes, not RedotPay-disclosed covenants or regulator-set thresholds.
