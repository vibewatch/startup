  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: systemic-risk-contagion
    missingEvidence: A quantified estimate of how a stablecoin issuer stress event would specifically transmit to consumer-facing card and payout providers (as opposed to the broad Treasury-market spillover the IMF and BIS quantify).
    whyItMatters: RedotPay's entire product depends on stablecoin rails remaining liquid and redeemable; a redemption-run scenario at a dominant issuer could disrupt user withdrawals or card funding even if RedotPay itself holds no direct issuer exposure.
    diligencePath: Request RedotPay's issuer/reserve diversification policy and any documented contingency plan for a stablecoin de-peg or redemption-run scenario, and cross-check against the specific stablecoins its card and wallet products actually settle in.
    relatedQuestionRefs:
    - QM025
  - type: enumeration-incomplete
    severity: material
    topic: serviceable-market-sizing
    missingEvidence: A bottom-up serviceable-obtainable-market (SOM) figure specific to a licensed stablecoin-card operator's actual jurisdictions and target user segments, rather than the top-down adjacent-market lenses cited in this chapter.
    whyItMatters: Without a bottom-up SOM, investors cannot distinguish a genuinely large addressable opportunity from an optimistic narrative built on adjacent-market headline numbers that do not map cleanly onto the product.
    diligencePath: Request management's internal TAM/SAM/SOM methodology, including assumptions on licensed-corridor population, card attach rate, and average balance, and compare it against the external lenses in this chapter.
    relatedQuestionRefs:
    - QM029
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: regulatory-constraints
    missingEvidence: A primary ESMA/EBA data point confirming the approximately 45% MiCA stablecoin-issuer-application rejection rate, which currently rests on a single secondary industry blog.
    whyItMatters: An inflated or inaccurate rejection-rate statistic would overstate EU regulatory friction and distort the growth-driver/constraint balance in this chapter.
    diligencePath: Pull ESMA's or EBA's own published register of authorized versus rejected e-money-token applications to verify or replace the cited rejection rate.
    relatedQuestionRefs:
    - QM021
  - type: stale
    severity: minor
    topic: market-sizing
    missingEvidence: An updated Citi GPS (or equivalent) 2030 stablecoin forecast dated closer to the report run date, given that Citi's own base/bull case moved materially within a single six-month window in 2025.
    whyItMatters: Forecast volatility this high means the cited $1.9T-$4.0T 2030 range could already be stale by the time later diligence occurs, and investors should treat it as directional rather than fixed.
    diligencePath: Re-pull the most recent Citi GPS (or Standard Chartered/other tier-one bank) stablecoin forecast at each refresh cycle rather than relying on the September 2025 figures cited here.
    relatedQuestionRefs:
    - QM005
    relatedTableRefs:
    - TM002
