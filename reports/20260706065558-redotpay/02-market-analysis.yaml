  type: flow
  layout: standard
  summary: Value moves from a sender's fiat or crypto position, through an on-ramp and a dominant settlement rail, into a consumer wallet/card app, and back out through a local off-ramp -- the generic path RedotPay's product sits inside.
  data:
    nodes:
    - id: sender
      label: 'Sender: migrant worker, SME, or remittance payer'
      detail: Originates funds in local fiat currency or existing crypto holdings.
      tone: neutral
    - id: onramp
      label: 'On-ramp: bank transfer, cash agent, or crypto exchange'
      detail: Converts fiat into a stablecoin or moves existing crypto into a wallet.
      tone: neutral
    - id: rail
      label: Stablecoin settlement rail (Ethereum / Tron)
      detail: Ethereum and Tron together settle roughly 64% of stablecoin transaction volume.
      tone: neutral
    - id: walletcard
      label: Consumer wallet/card app (e.g., a RedotPay-style product)
      detail: Holds the stablecoin balance and enables card spend, P2P transfer, or local off-ramp.
      tone: positive
    - id: offramp
      label: 'Off-ramp: local bank, e-wallet, or merchant acceptance'
      detail: Recipient converts stablecoin into spendable local currency or spends directly via card.
      tone: neutral
    edges:
    - from: sender
      to: onramp
    - from: onramp
      to: rail
    - from: rail
      to: walletcard
    - from: walletcard
      to: offramp
  approximationNotes: This is a generic value-chain map synthesized from cited evidence on stablecoin settlement rails and remittance behavior, not a RedotPay-specific transaction trace.
  claimRefs:
  - CM041
  - CM042
  - CM006
callouts:
- calloutType: risk
  title: Stablecoin issuer concentration is a single point of failure upstream of RedotPay's entire product
  body: The IMF and BIS both warn that a redemption run on a dominant issuer like Tether -- which alone held over $140 billion in short-term US Treasuries as of December 2025 -- could force fire sales that spill into short-term funding markets, and BIS finds a $3.5 billion stablecoin inflow already moves Treasury bill yields by 2-4 basis points. Any stablecoin-dependent card or payout product, RedotPay included, inherits this upstream systemic risk regardless of its own operational soundness.
  claimRefs:
  - CM034
  - CM035
  - CM037
- calloutType: insight
  title: Regulatory clarity is arriving unevenly across RedotPay's key markets
  body: The US GENIUS Act and EU MiCA both now impose binding reserve and licensing standards, and Hong Kong -- RedotPay's home jurisdiction -- has its own regime, but the World Economic Forum notes no global coordination yet exists. For a multi-jurisdiction operator, this fragmentation is itself a compliance cost and diligence item, not just a tailwind.
  claimRefs:
  - CM025
  - CM028
  - CM044
- calloutType: strength
  title: Structural cost and access gaps sustain durable demand for stablecoin rails
  body: 1.3 billion adults remain unbanked, the global average remittance cost is still 6.36% versus a 3% UN target, and Argentina's stablecoin share of local crypto volume has reached roughly 61.8% amid persistent inflation. These are structural, multi-year gaps rather than one-off promotional dynamics, and they support durable rather than purely speculative demand for RedotPay's category.
  claimRefs:
  - CM015
  - CM022
  - CM018
