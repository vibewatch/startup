chapter:
  number: 2
  title: Market Analysis
  summary: RedotPay competes across three markets that are normally sized separately -- stablecoin-based payments, crypto-linked prepaid cards, and cross-border remittances -- and no single public estimate reconciles them into one TAM/SAM/SOM figure. Multiple lenses (Citi's $1.9T-$4.0T 2030 stablecoin issuance scenarios, a16z's $9T adjusted 2025 payment volume, McKinsey's $2.5T global payments revenue, and a 6.36% average remittance cost that digital rails can undercut) all point to durable structural demand from the 1.3 billion unbanked adults and dollarization-driven savers RedotPay targets. That demand sits alongside an unusually fast-moving and fragmented regulatory build-out (the US GENIUS Act, EU MiCA, Hong Kong's regime) and IMF/BIS warnings that stablecoin issuer concentration -- chiefly Tether's Treasury holdings -- could transmit a redemption shock into the same rails RedotPay depends on.
sections:
- id: market-boundary-and-buyer-landscape
  title: Market Boundary, Included Spend, and Buyer/Payer Segmentation
  body: |-
    RedotPay's addressable market sits at the intersection of three categories that most published research sizes separately: stablecoin-based payments and remittances, crypto-linked prepaid/debit card spend, and the broader cross-border consumer and SME payments market that stablecoins are starting to disrupt. Drawing that boundary matters before any sizing exercise, because a headline like "$208 trillion in cross-border flows" (FXC Intelligence's 2025 estimate of total global cross-border value moved, alongside a $625 billion associated revenue pool) includes enormous volumes of trade finance and interbank settlement that RedotPay will never touch, while a narrower "crypto credit card market" estimate of $1.81 billion in 2025 likely excludes the prepaid/debit-style stablecoin card that is RedotPay's actual flagship product. Explicitly excluded from RedotPay's market are speculative crypto trading and DeFi yield farming, which serve a different buyer intent (portfolio return, not everyday spend), and largely excluded is traditional bank-wire or money-transfer-operator remittance, which functions as a status-quo substitute RedotPay is trying to displace rather than a segment it participates in directly.

    The buyer/user/payer map is unusually fragmented for a single product line. Unbanked or underbanked consumers are their own buyer, user, and payer, converting income into a stablecoin balance because no reliable local-currency account exists; migrant remittance senders pay on behalf of a separate recipient; Argentine and broader Latin American savers use stablecoins as a de facto digital dollar against persistent local-currency inflation, with stablecoins now representing roughly 61.8% of local Argentine crypto transaction volume; gig workers and freelancers receive cross-border payouts directly in stablecoins; and small businesses use stablecoin rails to pay overseas suppliers without correspondent-banking delay. The World Bank's 2025 Global Findex Database anchors the outer bound of this buyer base at 1.3 billion still-unbanked adults worldwide, with more than half concentrated in just eight countries, even as global account ownership climbed to 79% and digital-payment adoption has visibly accelerated.
