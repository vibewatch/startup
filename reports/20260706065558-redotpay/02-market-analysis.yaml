- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - GENIUS Act federal stablecoin licensing (US)
    - Driver
    - Effective within ~18 months of July 2025 enactment
    - Clarifies who may lawfully issue/distribute payment stablecoins in the US, potentially easing bank/fintech partnerships
    - Confirm whether RedotPay or its stablecoin partners plan to seek permitted-issuer or distribution status
  - - MiCA licensing and reserve rules (EU)
    - Constraint
    - Enforced since June 2024 (stablecoin rules)
    - Raises compliance cost and could exclude non-compliant tokens (e.g., USDT) from EU-facing rails RedotPay may rely on
    - Verify which stablecoins RedotPay supports in EU-facing flows and their MiCA status
  - - Regulatory fragmentation across US / EU / Hong Kong / Argentina
    - Constraint
    - Ongoing through 2026 and beyond
    - Creates arbitrage risk and compliance complexity for a multi-jurisdiction operator like RedotPay
    - Map RedotPay's licensing footprint against each regime's requirements
  - - Emerging-market dollarization demand (Argentina, wider Latin America)
    - Driver
    - Current, accelerating
    - Expands the addressable pool of consumers wanting a stablecoin-based digital dollar
    - Quantify RedotPay's actual user concentration in high-dollarization corridors
  - - Persistent high traditional remittance costs (6.36% global average)
    - Driver
    - Current
    - Creates a durable price umbrella for cheaper stablecoin-based transfer and card products
    - Benchmark RedotPay's effective end-user cost/FX spread against the 6.36% average and the 3.54% digital-only benchmark
  - - Stablecoin issuer concentration and systemic-risk concern (IMF/BIS)
    - Constraint / adverse
    - Ongoing, flagged through 2025-2026
    - A stress event at a dominant issuer (e.g., Tether) could disrupt liquidity or redemption across all stablecoin-dependent products
    - Assess RedotPay's issuer/reserve diversification and contingency plan for a redemption-run scenario
  - - Rise of bank-issued deposit tokens
    - Constraint (long-run)
    - Emerging, potential by 2030 per Citi
    - Could compress the addressable market for public-stablecoin-based consumer products if banks offer comparable rails
    - Track bank/deposit-token pilots in RedotPay's core corridors
  - - Divergent market-sizing methodologies (crypto card, stablecoin volume)
    - Constraint (measurement)
    - Ongoing
    - Makes it hard to underwrite a single TAM/SAM/SOM number; investors must triangulate across lenses
    - Request RedotPay management's own internal TAM methodology and compare it against external lenses
  notes: Direction and timing reflect the reviewed evidence as of the run date; several constraints (e.g., deposit-token competition) are directional judgments rather than settled facts.
