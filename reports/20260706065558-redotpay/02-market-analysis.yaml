    - label: "Global payments industry revenue: $2.5T (2024) -> ~$3T by 2029"
      detail: McKinsey Global Payments Report; the broadest monetizable layer across all payment rails, not stablecoin-specific.
      tone: neutral
    - label: "Stablecoin-specific ceiling: ~$9T adjusted annual payment volume / $311B outstanding supply (2025-2026)"
