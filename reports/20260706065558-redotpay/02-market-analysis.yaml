- id: TM005
  title: Regulatory Footprint by Jurisdiction
  columns:
  - Jurisdiction
  - Stablecoin / Payments Regime
  - Status as of Run Date
  - Key Requirement
  - Relevance to RedotPay's Market
  rows:
  - - United States
    - GENIUS Act (federal payment stablecoin law)
    - Enacted July 18, 2025; implementation window through roughly 2027
    - 1:1 reserve backing, licensed-issuer status, monthly disclosures
    - Determines which stablecoins RedotPay's US-facing flows can lawfully use
  - - European Union
    - MiCA (Markets in Crypto-Assets Regulation)
    - Stablecoin rules in force since June 2024; roughly 45% of issuer applications reportedly rejected as of mid-2025
    - EMI/credit-institution license; full reserve backing; 60%+ of reserves held in EU banks
    - Non-compliant tokens (e.g., USDT) face delisting on EU rails RedotPay may touch
  - - Hong Kong
    - Stablecoins licensing regime (HKMA)
    - Introduced in 2025; licensing and capital thresholds apply
    - Minimum paid-up capital, reserve, and redemption rules for HK-licensed issuers
    - RedotPay is Hong Kong-headquartered, so its home jurisdiction's stablecoin rulebook is directly relevant even though RedotPay itself is a payments company, not a licensed issuer
  - - Argentina
    - VASP/AML oversight of virtual-asset service providers
    - More enabling than restrictive as of 2025-2026
    - AML/CFT registration for VASPs; no blanket stablecoin ban
    - Argentina is one of RedotPay's highest-relevance dollarization corridors given a ~61.8% stablecoin share of local crypto volume
  - - Global (IMF / BIS)
    - No binding global stablecoin standard; advisory guidance only
    - Ongoing coordination effort as of December 2025
    - "\"Same activity, same risk, same regulation\" principle proposed, not yet binding"
    - Fragmentation across the regimes above is itself a systemic and compliance risk for multi-jurisdiction operators like RedotPay
  notes: Synthesizes the GENIUS Act, MiCA, Hong Kong, and Argentina regimes discussed elsewhere in this chapter plus IMF/BIS advisory commentary; the "relevance" column is an analytical inference connecting each regime to RedotPay's known footprint, not a direct company disclosure.
