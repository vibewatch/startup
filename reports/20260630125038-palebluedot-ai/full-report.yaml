      - number: '7.2'
        title: Operational and Security Risks
        blocks:
          - type: paragraph
            body: >-
              Colocation dependency is a structural vulnerability: PBD deploys enterprise GPU clusters inside Digital
              Realty and Equinix facilities across North America, Japan, South Korea, and Singapore. While Equinix
              publishes >99.9999% uptime backed by N+1 UPS redundancy and dual power feeds, the Uptime Institute's 2026
              annual outage analysis found that one in five impactful outages cost more than $1M, and that power
              disruptions remain the primary failure mode even at advanced facilities. High-density AI workloads at
              120kW+ per Blackwell NVL72 rack stress power and cooling infrastructure in ways traditional data center
              design did not anticipate. Digital Realty has responded by pivoting toward hybrid power strategies
              including natural gas generation in grid-constrained markets such as Dublin. PBD carries concentration
              risk from relying on two colocation providers for all its managed enterprise cluster business; an extended
              multi-site outage at either provider would directly interrupt customer SLAs.


              Security risks in neoclouds have a structural dimension that hyperscaler security frameworks do not fully
              address. East-west GPU fabric traffic—the high-bandwidth internal synchronization between GPUs during
              training—uses RDMA over Converged Ethernet, which bypasses the traditional TCP/IP stack and standard
              logging mechanisms. At 800Gbps, standard forensic logging cannot record events as fast as they occur,
              leaving the fabric effectively unmonitored during training runs. A single compromised management
              credential can propagate across large portions of the cluster before automated systems react. AI-enabled
              cyberattacks rose 89% year-over-year in early 2026; supply chain attacks via popular AI libraries
              (LiteLLM, LangChain) have emerged as a primary attack vector against AI infrastructure operators. PBD's
              ISO/IEC 27001 and SOC 2/3 certifications are documented via Digital Realty's facility infrastructure; no
              independently verified PBD-specific security assessment has been published.
            claimRefs:
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
