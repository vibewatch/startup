      - number: '1.3'
        title: Capital structure and stakeholder map
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI announced the completion of a $150 million Series B financing on January 28, 2026, valuing
              the company at over $1 billion and marking it as a unicorn. The round was led by B Capital, a San
              Francisco and Singapore-headquartered investment firm that the company's press release described as
              holding more than $9 billion in assets under management at the time of the deal; B Capital's own website
              listed more than $12 billion AUM by June 2026, suggesting the $9 billion figure was a point-in-time
              disclosure.


              The financing followed a year of significant growth in which PaleBlueDot AI reported revenue increasing
              more than 10-fold, driven by enterprise demand for scalable, cost-efficient AI compute. The company
              disclosed that the new capital would be primarily used to strengthen core technology capabilities, invest
              in platform engineering and technical talent, enhance the full-stack multi-tenant cloud architecture,
              accelerate the AI Cloud Agent product, and expand go-to-market capabilities and global operations.


              The Series A financing amount and investors are not publicly disclosed in sources available as of June
              2026. Task brief context references a prior round of approximately $10 million, but this figure has not
              been independently corroborated through publicly accessible sources in the current source set and is
              therefore treated as an evidence gap. SEC EDGAR Form D searches returned no filings matching PaleBlueDot
              AI, which is consistent with the use of exempt private placements that may have been filed under a name
              variant or may not yet be indexed.


              Co-investors in the Series B beyond B Capital are not publicly named. The company's infrastructure partner
              Digital Realty provides primary colocation, and the SiliconAngle analysis identifies Xiaohongshu (also
              known as RedNote), the Chinese social media platform, as a client—information attributed to Reuters. The
              PR communication channel (FGS Global) provides an additional stakeholder surface for diligence outreach.
