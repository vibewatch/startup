      - number: '4.3'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot's unit economics differ meaningfully between its two segments. The GPU marketplace is
              asset-light: PaleBlueDot acts as intermediary and earns a spread without owning hardware. This limits
              capital intensity in the marketplace segment but also limits gross margins—estimated at 10–20% of
              transaction value based on comparable marketplace models. Volume and utilization are the primary margin
              levers; revenue per transaction compresses as GPU rental rates fall.


              The enterprise dedicated-cluster segment carries significant capital intensity. A single 8-GPU H100 server
              costs $200K–$320K in hardware alone, and a 1,000-GPU deployment requires $25M–$40M in hardware before
              power, cooling, networking, and facility costs— which industry analysis (GPUnex / McKinsey-cited data)
              estimates at 2–3× the hardware cost. Industry-wide gross profit margins for GPU cluster operators are
              estimated at 14–16%, subject to meaningful degradation if utilization falls below approximately 60%.


              PaleBlueDot does not disclose gross margin, CAC, LTV, net revenue retention, or average contract value—all
              private. The company's headcount of 50+ with estimated revenue per employee of ~$42K suggests the business
              is not yet at revenue scale relative to engineering and infrastructure overhead. Core diligence questions
              are whether enterprise cluster margin can reach industry-benchmark levels at scale, and how quickly
              marketplace volume must grow to absorb overhead.
