        title: Pricing and Monetization
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot's marketplace publishes real-time GPU pricing competitive with other neocloud providers. As of
              early 2026, marketplace rates for NVIDIA H100 NVLink begin around $1.40–$1.50 per GPU-hour—materially
              below the $7–10/hr peak seen in early 2024— reflecting a broader H100 price decline driven by NVIDIA
              Blackwell ramp, supply normalization, and hyperscaler discounting (AWS cut P5 instance pricing ~44% in
              June 2025). NVIDIA B200 NVLink rates run approximately $1.57–$3.10/hr and GB200 NVL72 rack-level systems
              list at $3.50–$3.70/hr; Blackwell hardware supply remains constrained, with volume orders facing 12–18
              month lead times.


              For the marketplace segment, PaleBlueDot earns a broker spread or take rate estimated at 10–20% of the
              gross transaction value—a margin structure consistent with other GPU marketplace models. For enterprise
              dedicated clusters, pricing is negotiated on a contract basis and bundles GPU hardware amortization,
              colocation power and cooling fees, network costs, and PaleBlueDot's management layer. Realized contract
              pricing is not publicly disclosed.


              GPU price trends create a structural headwind: as H100 spot rates continue falling toward $1.20–1.80/hr,
              gross take-rate revenue per transaction compresses unless volume scales proportionally. Differentiation
              through software (AI Cloud Agent, predictable SLA) is PaleBlueDot's stated strategy to defend margins
              against pure-commodity price competition.
