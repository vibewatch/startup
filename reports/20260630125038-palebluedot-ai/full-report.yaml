      - number: '8.3'
        title: Comparable Valuation Set and Sector Benchmarks
        blocks:
          - type: paragraph
            body: >
              The neocloud comparable set spans public equities, late-stage private rounds, and recently IPO'd
              companies. CoreWeave (CRWV) is the primary public anchor: it reported Q1 2026 revenue of $2.078B (up 217%
              YoY), trades at approximately $52B market cap and $85B enterprise value, and guides to $12–13B in 2026
              revenue. Its TTM EV/Revenue of roughly 13.7× reflects a scale PaleBlueDot has not yet approached, but its
              IPO multiple (~12× on 2024 revenue) is instructive for early entry pricing. Nebius Group (NBIS) offers the
              most aggressive growth comp, posting Q1 2026 revenue of $399M (up 684% YoY), but trades at 65–76×
              price-to-sales on the strength of $27B+ hyperscaler anchor contracts—a form of revenue visibility
              PaleBlueDot lacks.


              Among private peers, TensorWave's June 2026 Series B of $350M at $1.55B post-money on $100M 2026 revenue
              implies a 15.5× EV/Revenue multiple—the most direct structural comparable given similar stage and round
              size. Crusoe's $10B+ valuation at Series E (October 2025) reflects the premium for vertically integrated,
              power-secured infrastructure with NVIDIA strategic backing; Crusoe's scale and energy infrastructure
              position it several investment cycles ahead of PaleBlueDot. Lambda Labs' ~$5.9B Series E valuation on
              ~$760M annualized revenue implies 7.7× EV/Revenue—the most conservative private-company comp in the
              set—but Lambda operates at 6–8× PaleBlueDot's estimated revenue scale, with 50%+ gross margins from a
              software-forward cloud business. The Finro AI dataset of 575 companies records a median AI infrastructure
              EV/Revenue of 21.2× in Q1 2026, providing a useful sector central-tendency anchor.


              Applying sector multiples to PaleBlueDot: at a $20M revenue assumption and 15–25× forward multiple
              (conservative end of the comparable range), fair value is $300M–$500M— below the $1B Series B price.
              Reaching $1B+ fair value requires $40–67M revenue at 15–25×, implying PaleBlueDot must grow ~4–7× from its
              estimated current scale before the Series B price is justified by revenue multiples. This confirms the
              valuation is pricing in a 2027–2028 revenue state, not the 2026 state.
            claimRefs:
