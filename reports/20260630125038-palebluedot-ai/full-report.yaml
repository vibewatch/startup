chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating model
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI, Inc. is a Silicon Valley-based AI compute platform company headquartered in Palo Alto,
              California. It was founded in 2024 and operates under a dual-service model designed to serve both startup
              and enterprise customers needing scalable GPU compute. The company's primary offering, Token Factory, is a
              marketplace through which customers can access on-demand and reserved GPU clusters. The second line is
              managed dedicated clusters aimed at organizations with complex infrastructure requirements involving
              large-scale deployments, reserved capacity, or flexible GPU sourcing across a global network. In April
              2026, PaleBlueDot AI extended the platform into AI model API distribution by launching PBD TokenRouter, a
              unified API layer covering more than 300 frontier models with Smart Token Routing, Multi-Channel Automatic
              Failover, and Real-Time Cost Governance capabilities.


              The mission, as stated publicly in company materials and confirmed across multiple press releases, is "to
              make intelligence universally accessible." The broader vision is expressed as "empower AI everywhere for
              everyone." The company name references the 1990 Voyager space mission image of Earth described by Carl
              Sagan as "a pale blue dot," and the branding explicitly connects this image to a belief in the
              transformative potential of AI for all humanity. This naming choice is not incidental—it appears in both
              investor press materials and the company's About page description and functions as part of its public
              positioning alongside the technical compute mission.


              The legal entity is PaleBlueDot AI, Inc., as disclosed in the company's website footer. The company's
              website is palebluedot.ai, a JavaScript-shell single-page application; official newsroom text is embedded
              in the compiled page bundle rather than in directly accessible HTML. The primary media contact for
              investor and press relations is routed through fgsglobal.com, the financial communications firm FGS
              Global, which is the disclosed point of contact in the Series B press release.
