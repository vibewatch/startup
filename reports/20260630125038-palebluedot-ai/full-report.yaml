      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for PaleBlueDot rests on five pillars. First, the global AI compute market is
              scaling rapidly—industry estimates peg GPU cloud TAM at $100B+ by 2028—providing a large and growing
              demand pool. Second, PaleBlueDot's demonstrated 10× year-over-year revenue growth signals real enterprise
              traction, even if the absolute revenue base is small. Third, its APAC geographic positioning in Japan,
              South Korea, and Singapore provides differentiated access to Asian enterprise clients that US-centric
              neoclouds do not natively serve, including legal-entity structures suitable for international chip access.
              Fourth, B Capital's leadership of the round provides strategic credibility and distribution across APAC
              enterprise networks. Fifth, the emerging software layer (AI Cloud Agent, TokenRouter) has the
              architectural potential to improve take-rates and create switching costs above the hardware arbitrage
              baseline.


              The anti-thesis is equally compelling. GPU rental prices have fallen 70–80% from their 2023–2024 peak,
              compressing the economic spread on which the marketplace model depends. Kerrisdale Capital's September
              2025 short report on CoreWeave—the public market anchor for the neocloud category—argued that even the
              sector leader is a "debt-fueled GPU rental business" with returns below cost of capital and targeted a 90%
              downside. McKinsey warned in 2026 that neoclouds as a class lack economies of scale, defensible IP, and
              diversified revenue, making them structurally fragile. PaleBlueDot lacks publicly disclosed financial
              metrics to refute or confirm these concerns. The company's primary CEO appointment in January
              2026—concurrent with the Series B—suggests management continuity risk and a leadership transition at the
              most critical growth phase.
            claimRefs:
