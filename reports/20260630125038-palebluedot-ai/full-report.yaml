companyProfile:
  summary: >
    PaleBlueDot AI is a Palo Alto-based neocloud startup founded in 2024 that sells AI compute through two layers: a
    marketplace for flexible third-party GPU capacity and a managed enterprise business that designs and operates
    dedicated GPU clusters in colocation facilities. The company has expanded its footprint across North America, Japan,
    South Korea, Singapore, and broader Southeast Asia, and has extended beyond raw compute into TokenRouter and AI
    cloud-agent software to improve monetization and lock-in. Public evidence suggests strong demand and at least one
    notable enterprise deployment, but the company remains financially opaque and exposes investors to export-control,
    capital-intensity, and concentration risk.
