  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context, Implied Multiple, and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI closed a $150M Series B in January 2026 led by B Capital, reaching a post-money valuation
              reported as greater than $1 billion. Public coverage indicates the company had raised only a modest
              pre-Series-B round of roughly $10M, putting total disclosed capital raised at roughly $160M. The company
              had not disclosed cap-table details as of late June 2026, so exact preference stack, liquidation
              preferences, anti-dilution provisions, and participation rights are unknown—factors that materially affect
              downside protection for new investors.


              Using the third-party estimate from CompWorth of approximately $2.1M in 2026 annual revenue, the implied
              EV/Revenue multiple exceeds 475×. Even applying a generous management assumption of $20M in annualized
              revenue (post-10× growth from a ~$2M 2024 base), the Series B implies roughly 50× EV/Revenue. By contrast,
              the neocloud sector benchmark set at the same growth stage trades at 8–30× forward revenue for companies
              with publicly anchored backlogs. PaleBlueDot currently lacks any disclosed contract backlog comparable to
              CoreWeave's $99B+ or Nebius's multi-year hyperscaler deals. The $1B valuation therefore embeds substantial
              option value tied to successful APAC enterprise cluster ramp, software-layer margin improvement, and
              multi-year hypergrowth continuation—each of which carries material execution risk.


              Entry discipline matters most in option-value situations: investors should understand that the Series B
              price is likely to generate positive returns only in the bull scenario. The base case implies
              flat-to-downside outcomes, and the bear case implies 80–95% loss of capital. Dilution from future rounds
              could further compress returns unless the company reaches profitability or a strategic exit before a
              Series C or D is required.
            claimRefs:
