      - number: '7.4'
        title: Financial and Capital Structure Risks
        blocks:
          - type: paragraph
            body: >-
              PBD's financial risk profile is dominated by three compounding forces: GPU price commoditization, capital
              intensity mismatched to available equity, and an unresolved capital structure. H100 GPU spot rental rates
              fell from an $8/hr peak in 2023 to $1.03–$1.43/hr from specialist neocloud providers in 2026—a 70%+ price
              decline—and the median on-demand rate across 40+ providers settled near $3.61/hr by May 2026. For PBD's
              marketplace segment, every dollar of take-rate revenue per transaction is proportional to the rental rate,
              meaning the same $150M Series B now supports significantly less net revenue per GPU-hour deployed than at
              the time of the investment thesis. Neocloud unit economics are structurally challenged: hardware
              depreciation ($200K–$320K per H100 server), power costs (120kW+ per Blackwell rack), InfiniBand
              networking, and specialized GPU engineering talent all exceed original business plan models built under
              2023 scarcity conditions.


              GPU-backed private credit markets add refinancing risk. Outstanding loans to AI-related companies surged
              from near-zero to over $200B; Morgan Stanley projected an additional $800B in data center financing
              through 2027. PBD reportedly explored a $300M asset-backed loan facility with JPMorgan advisory, though
              the company denied this and the deal did not progress. If any GPU-collateralized debt exists
              off-balance-sheet—as is common in the sector via SPV sale-leaseback structures—it would materially alter
              PBD's financial risk: lease obligations written at $7/hr GPU economics generate severe cash flow stress
              when actual rental revenue falls to $3/hr. The absence of disclosed capital structure details (debt
              instruments, SPV arrangements, guarantees) is a material gap that prevents underwriting the company's
              financial stability.
            claimRefs:
