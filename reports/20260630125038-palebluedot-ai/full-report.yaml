      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Option-Value Pricing Without Supporting Metrics
            body: >
              At an estimated 50–475× EV/Revenue, the Series B price is not anchored by current metrics but by a
              multi-year hypergrowth scenario that requires continued 5–8× annual growth and successful software
              monetization. Sector precedent (Kerrisdale's analysis of CoreWeave, McKinsey's neocloud economics report)
              shows that GPU rental business models are structurally fragile and prone to multiple compression as supply
              normalizes. PaleBlueDot's lack of disclosed ARR, gross margin, and NRR means investors cannot verify
              whether the $1B price is supported by any trailing financial anchor.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV026
              - CV029
              - CV030
          - type: callout
            title: Track — Revisit at Next Financing or $25M ARR Disclosure
            body: >
              PaleBlueDot demonstrates genuine market potential and hypergrowth execution. The recommendation to Track
              (not Avoid) reflects the possibility of a viable bull case, not a rejection of the business. The condition
              for upgrade to Buy is: ARR disclosure above $25M with enterprise gross margin evidence above 18%, a clean
              APAC regulatory posture under BISS 2026, and a cap-table review confirming reasonable preference structure
              for new investors. Until those conditions are met, the Series B price represents asymmetric risk with
              limited downside protection.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV036
              - CV039
