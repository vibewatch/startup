      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Neocloud Footprint'
        blocks:
          - type: paragraph
            body: |
              Sizing this market requires a precise boundary choice, and published estimates span a
              four-fold range for the same calendar year. Grand View Research estimated the broad
              cloud AI market at approximately $170 billion in 2026, encompassing cloud-based AI
              software, services, and hardware. Intel Market Research arrived at $53.1 billion using
              a narrower AI GPU infrastructure definition, growing at a 14.2% CAGR to $147.8 billion
              by 2034. Mordor Intelligence sized the neocloud specialist segment at $35.22 billion in
              2026 growing at a 46.37% CAGR through 2031, reflecting only specialist providers
              outside hyperscalers. These figures are not directly reconcilable: the 4x spread
              between the narrowest and broadest definition reflects definitional differences in what
              is included (hardware alone vs. hardware plus managed services plus software), not
              analytical disagreement about observable market activity.

              Using a three-lens sizing framework: the TAM (broad cloud AI, including managed
              services) is approximately $170 billion in 2026 per Grand View Research; the SAM (AI
              GPU-focused cloud compute, hardware-centric) is approximately $53 billion per Intel
              Market Research; and the obtainable neocloud specialist segment where PaleBlueDot AI
              directly competes is approximately $35 billion per Mordor Intelligence. ABI Research
              forecasts GPU-as-a-Service will reach $250 billion by 2030 across all providers. The
              AI data center GPU hardware sub-market alone reached $45 billion in 2026 (Mordor
              Intelligence), with hyperscalers and cloud service providers commanding 76.64% of 2025
              revenue. CAGR projections vary from 14% (hardware-only lens) to 46% (neocloud
              specialist) to 40% (broad cloud AI), depending entirely on scope boundary selection.

              The longer-term AI infrastructure backdrop is significant. ARK Invest, citing Gartner
              and TheNextPlatform, estimates global data center systems investment will reach $653
              billion in 2026, growing more than 30% year-over-year. Accelerated computing, powered
              by GPUs and AI ASICs, now represents 86% of compute server sales. Hyperscalers
              collectively committed approximately $700 billion in AI infrastructure capex for 2026
              alone—the largest single-year capital expenditure surge in technology industry history.
