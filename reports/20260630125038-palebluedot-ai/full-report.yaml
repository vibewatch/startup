      - number: '3.4'
        title: Switching Costs, Lock-In, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              GPU cloud switching costs have three principal components. First, technical migration costs arise from
              differences in GPU software stacks—NVIDIA CUDA code does not run natively on AMD ROCm without porting
              effort or compatibility layers such as TensorWave's SCALE toolchain, and proprietary cluster management
              APIs (CoreWeave's SUNK, AWS SageMaker, Azure ML) create workflow dependencies. Second, financial switching
              costs arise from reserved-instance commitments and take-or-pay contracts: CoreWeave's anchor customers
              hold multi-year agreements; any early termination or non-use incurs economic penalties. Third, data egress
              costs impose ongoing multi-homing friction; hyperscalers charge $0.09–$0.12 per GB for egress while most
              neoclouds include it in base rates or charge less, but the volume of training data and model checkpoints
              can make cross-provider data movement expensive. Multi-homing is technically feasible using orchestration
              layers such as Kubernetes and Ray that abstract provider APIs, and AI-native companies increasingly adopt
              hybrid strategies—keeping baseline workloads on committed neocloud clusters while bursting to spot markets
              or hyperscalers for peak demand. However, maintaining parallel orchestration, storage replication, and
              security postures across providers requires significant engineering overhead that smaller teams and
              early-stage startups rarely invest in. PaleBlueDot's marketplace model lowers the barrier by aggregating
              multiple GPU sources behind a single API, reducing the customer's need to maintain direct provider
              relationships—this is a genuine switching-cost reduction feature that bare-metal neoclouds do not offer.
            claimRefs:
              - CP041
              - CP042
              - CP050
      - number: '3.5'
        title: Moat Durability, Commoditization Risk, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot's competitive moat faces pressure from at least five structural risks. First, GPU commodity
              risk: H100 prices fell 64% from their 2023 launch price of $8–12 per GPU-hour to a trough of $1.70 per
              GPU-hour in mid-2025, then rebounded 40% to $2.35 per GPU-hour by March 2026 as inference demand
              surged—showing that marketplace pricing is volatile and margin is sensitive to supply-demand cycles.
              Second, scale asymmetry: CoreWeave's $99.4B backlog and $31–35B 2026 capex commitment dwarf PaleBlueDot's
              $160M total capital raised, creating a structural barrier to competing for multi-gigawatt anchor
              enterprise clients. Third, hyperscaler price aggression: AWS's 44% H100 price cut in June 2025 showed that
              hyperscalers will compete on price to defend GPU workloads, compressing the neocloud pricing advantage.
              Fourth, NVIDIA supply concentration: Nvidia's $2B equity investment in CoreWeave (January 2026) as part of
              a 5+ GW AI factory partnership deepens CoreWeave's supply priority and raises the cost for peers to secure
              equivalent hardware access. Fifth, Kerrisdale Capital published a short report in September 2025
              characterising CoreWeave—and by extension the neocloud sector—as "an undifferentiated, heavily levered GPU
              rental scheme" with no lasting moat, noting CoreWeave's extreme customer concentration (67% Microsoft in
              2025) as the largest single credit risk. While PaleBlueDot's APAC geographic focus and dual model provide
              partial insulation from CoreWeave's US anchor-customer competition, the core bare-metal GPU rental value
              proposition remains vulnerable to commoditization, pricing wars, and any expansion by hyperscalers or
              CoreWeave into Asia-Pacific markets.
