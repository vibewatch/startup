      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >
              Stephen Watts was appointed Chief Executive Officer of PaleBlueDot AI on January 23, 2026, as announced
              via the company's newsroom. He joined PaleBlueDot AI approximately two years before the
              appointment—placing his start around 2024—as Vice President of Go-to-Market, where he supported the
              company's global expansion efforts. The company's announcement describes him as having a "distinguished
              25-year career" and specifically identifies his prior role as President and COO of SAP Asia Pacific Japan,
              citing his track record of navigating complex global markets, cross-cultural partnerships, and
              high-quality growth.


              His appointment as CEO follows the company's rapid international scale-up and the subsequent Series B
              financing. The announcement frames the transition as organic succession from within the company, with the
              stated rationale being his deep understanding of PaleBlueDot AI's customers, platform, and the global AI
              infrastructure landscape. As CEO, Watts is described as focused on executing a customer-first go-to-market
              strategy while advancing the mission to make intelligence universally accessible.


              The identities of the original founders are not publicly disclosed in any source retrieved during this
              research. No founder names appear in official company materials, press releases, or the indexed
              third-party coverage available as of June 2026. This represents a material gap in the public identity
              record: later chapters needing to assess key-person dependence beyond Stephen Watts cannot currently
              anchor to disclosed founder relationships, board composition, or governance instruments. The diligence
              path is to request the cap table, board composition, and governance documents from the company directly.
