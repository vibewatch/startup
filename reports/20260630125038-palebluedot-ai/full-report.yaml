      - number: '2.5'
        title: Regional Demand Dynamics
        blocks:
          - type: paragraph
            body: |
              North America commands 88% of neocloud GPUaaS revenue in 2026 per ABI Research,
              driven by the concentration of AI labs, technology companies, and hyperscaler
              infrastructure. However, Asia-Pacific is the fastest-growing region globally, forecast
              at a 54.5% CAGR through 2031 by Mordor Intelligence, with sovereign AI policy mandates
              amplifying organic demand growth across all three major sub-markets.

              Japan's AI infrastructure market exceeded $5.5 billion in 2026 with 18% YoY growth,
              a seven-fold expansion since 2022, per IDC. Japan committed $135 billion in combined
              public and private investment through 2030, with METI allocating $65 billion in direct
              support for domestic sovereign AI cloud programs. Government-backed deployments include
              ABCI 3.0 (6.2 exaflops via thousands of NVIDIA H200 GPUs) and SAKURA Internet
              (10,800 GPU scale-out). Microsoft announced a separate $10 billion Japan investment in
              April 2026, reinforcing the market's appeal to both domestic and foreign providers. The
              enterprise AI segment in Japan is transitioning from government-catalyzed capacity
              builds to organic enterprise production deployments.

              South Korea's AI data center market was valued at approximately $1.99 billion in 2026
              and is projected to reach $5.02 billion by 2031, while committed construction-stage
              capex exceeds $30 billion concentrated in five mega-deals. Key investments include the
              SK-AWS Ulsan campus ($5.1 billion, 60,000 initial GPUs), Hyundai's Saemangeum
              hydrogen-powered facility ($6.3 billion, 50,000 Blackwell GPUs), and the NVIDIA
              260,000-GPU national procurement commitment. South Korea controls more than 80% of
              global HBM supply through Samsung and SK Hynix, creating a unique supply-chain
              advantage that attracts hyperscaler investment.

              Southeast Asia hosts over 2,000 operational data centers, with regional investment
              projected to reach $30 billion by 2030 at 20%+ annual demand growth through 2028.
              Singapore serves as the Tier 1 enterprise and latency-sensitive hub with approximately
              1 GW of operational capacity and a 1.4% vacancy rate, commanding premium pricing and
              serving financial services and enterprise workloads. Malaysia absorbs raw compute
              scale-out due to available land and lower power costs, with over 500 operational and
              300 under-construction data centers. PaleBlueDot AI's disclosed customer concentration
              in Japan, South Korea, and Singapore positions it within the globally fastest-growing
              regional segment, aligned with sovereign AI policy tailwinds.
