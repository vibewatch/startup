  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Structure
        blocks:
          - type: paragraph
            body: |
              The AI cloud GPU infrastructure market encompasses the commercial rental and delivery
              of GPU-accelerated compute capacity for AI training and inference workloads, delivered
              via network infrastructure to remote customers. This includes on-demand GPU instances,
              reserved cluster leases, bare-metal GPU node rentals, and dedicated enterprise cluster
              builds operated in co-location facilities. The primary delivery channels are: (1)
              hyperscaler GPU instances (AWS p5/p6, Azure NDv5, GCP A3) bundled within broad cloud
              platforms; and (2) neocloud specialist providers that offer GPU capacity with faster
              provisioning, lower per-GPU pricing, and infrastructure tuned exclusively for AI
              workloads. PaleBlueDot AI participates in the neocloud segment, operating both a GPU
              marketplace for AI startups and a dedicated enterprise cluster design and build service.

              The market excludes general-purpose CPU cloud services, permanent on-premise hardware
              purchases (capital expenditure), consumer-gaming GPUs, AI software and SaaS layers
              such as managed AI APIs, and hyperscaler-bundled managed AI platform services such as
              Azure OpenAI Service or Google Vertex AI. Adjacent segments that create substitution
              pressure include: custom silicon cloud services (Google Cloud TPUs, AWS Trainium);
              edge AI inference hardware; and AI data-center construction and power infrastructure.

              The primary status-quo substitutes for neocloud GPU compute are hyperscaler GPU
              reserved instances and on-premise NVIDIA hardware procurement through direct purchase
              agreements. Each substitute carries a distinct cost and lead-time profile. Hyperscaler
              GPU instances offer broad platform integration but at a 60–85% cost premium versus
              neoclouds for equivalent hardware. On-premise procurement avoids ongoing rental fees
              but requires hardware budgets, co-location agreements, and 36–52-week lead times for
              current-generation GPUs, making it impractical for rapidly scaling AI teams.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
