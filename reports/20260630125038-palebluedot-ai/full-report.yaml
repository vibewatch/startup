  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Business Lines
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI generates revenue through two distinct and complementary business lines. The first is a GPU
              marketplace that aggregates excess or under-utilized GPU capacity from third-party providers—data centers,
              smaller cloud operators, and independent hardware owners—and resells time-sliced access to AI startups,
              principally US-based early-stage companies, earning a take-rate spread on each transaction. The second is
              an enterprise dedicated-cluster service in which PaleBlueDot designs, deploys, and manages large-scale GPU
              clusters inside colocation facilities operated by Digital Realty, Equinix, and similar partners across
              North America, Japan, South Korea, and Singapore.


              Revenue is recognized on a consumption basis: customers pay per GPU-hour for marketplace access or on
              contracted terms (often multi-month) for enterprise clusters. The official January 2026 press release
              confirmed that total revenue increased more than tenfold year-over-year. Third-party analyst estimates
              (CompWorth) place 2026 annual revenue at approximately $2.1M, implying approximately $42K revenue per
              employee for a 50+ headcount organization—consistent with an early-growth phase where enterprise contracts
              are ramping but still concentrated among a small number of anchor clients.


              A third nascent software layer—the AI Cloud Agent (Dot-1.1) and the TokenRouter API— automates GPU
              deployment planning and routes inference traffic to optimal clusters. These components are currently
              bundled into the infrastructure offering rather than separately priced, but they contribute to switching
              costs and could evolve into an independent margin contributor. The company also offers DeepSeek PBD Access
              API integration, a signal of developer-ecosystem investment.
