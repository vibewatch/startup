        - Long term (4+ years)
        - Government-backed demand for in-region GPU capacity and data-residency compliance
        - Assess PaleBlueDot's regulatory compliance and data-residency capability in each APAC market
      - - Inference cost deflation (H100 rates −64–75% in 14 months)
        - Headwind
