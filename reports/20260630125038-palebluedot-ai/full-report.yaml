      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Blocking Diligence Gap: BIS Export Control and Xiaohongshu Relationship'
            body: >-
              The most acute unresolved risk is the intersection of the BIS May 31, 2026 third-country loophole closure
              and the reported $300M Nvidia chip procurement intended for Xiaohongshu access via Tokyo. PBD's incomplete
              denial and JPMorgan's reported withdrawal create a credible concern about live export control exposure.
              Any equity investment without explicit legal confirmation of the Xiaohongshu relationship status, the
              capital structure, and export control compliance posture is underwriting a risk that could result in BIS
              enforcement, license revocation, and forced customer unwinding—a scenario that is thesis-breaking
              regardless of scale.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: callout
            title: Capital Structure Opacity Is a Compounding Risk
            body: >-
              PBD has no public debt instruments, no SEC filings, and a capital structure that remains unknown beyond
              the Series B equity. The reported but unconfirmed $300M GPU-backed debt facility, if real and structured
              as a sale-leaseback under GPU scarcity economics, would generate cash flow stress at current
              ($1.40–$3.61/hr) H100 rental rates. Private credit GPU debt market analysis indicates that GPU lease
              obligations fixed at peak-2023 economics are now structurally mismatched to current market rates, with
              some operators facing covenant breaches and collateral value shortfalls. Without full capital structure
              disclosure, equity underwriting cannot accurately size the effective dilution, debt service, and
              enterprise value at risk.
            calloutType: risk
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR036
              - CR037
          - type: callout
            title: Minimum Diligence Requirements Before Any Investment Decision
            body: >-
              Five items must be resolved before any investment decision: (1) written legal confirmation of PBD's
              relationship with Xiaohongshu/RedNote and export control compliance posture; (2) full capital structure
              disclosure including any debt instruments, SPV arrangements, and GPU-backed lease obligations; (3) founder
              identities, IP assignment agreements, and board composition; (4) revenue concentration by customer with
              top-5 customer revenue share; (5) a demonstrated multi-colocation failover architecture with documented
              SLA commitments. Absence of any one of these items during due diligence is a blocking gap.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR019
              - CR038
              - CR039
              - CR040
          - type: callout
            title: Structural Neocloud Margin Compression Is Not PBD-Specific
            body: >-
              The GPU margin compression risk PBD faces (H100 spot rates down 70% from peak, neocloud
              power/depreciation/talent costs exceeding original underwriting) is sector-wide and not specific to PBD's
              execution quality. However, PBD's exposure is amplified by its early stage, lack of hyperscaler-scale
              anchor contracts, and reliance on spot-market-adjacent pricing. The TokenRouter software layer is PBD's
              most promising path to a higher-margin business, but its IP, competitive moat, and revenue contribution
              are currently unverified.
