  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI faces its most severe and time-sensitive risk in the rapidly evolving U.S. export control
              regime governing advanced AI chips. On January 15, 2026, BIS revised its license review policy for exports
              of certain semiconductors (NVIDIA H200, AMD MI325X) to China and Macau, shifting from a presumption of
              denial to a case-by-case review—but only where strict certifications are met: adequate U.S. supply, a 50%
              China/Macau shipment cap, no prohibited end-users, rigorous KYC, and independent U.S. third-party testing.
              More critically, on May 31, 2026 BIS published guidance closing the "third-country loophole": export
              license requirements now apply to any entity whose ultimate parent company is headquartered in China or
              Macau, regardless of whether that entity operates in Japan, Singapore, or elsewhere. This directly
              implicates PBD's reported engagement with Xiaohongshu (RedNote), a Chinese social media platform. Multiple
              credible sources reported in late 2025 that PBD was exploring a $300M loan to purchase Nvidia chips for
              deployment at a Tokyo data center with Xiaohongshu as the end-user. PBD described this reporting as
              "factually inaccurate" without elaboration, and JPMorgan—reportedly engaged to prepare lender
              materials—backed away from the deal. At least nine bankers at global financial institutions privately
              expressed concern about US regulatory scrutiny of such transactions. Whether the Xiaohongshu relationship
              persists and whether any chips were procured under export-controlled classifications is a blocking
              diligence gap.


              EU AI Act obligations compound this regulatory profile. High-risk AI system obligations under Annex III
              were scheduled to take effect August 2, 2026 (possibly deferred to December 2027 under the AI Omnibus
              political agreement reached in May 2026, pending trilogue ratification). PBD's TokenRouter API distributes
              300+ frontier AI models and may qualify as a GPAI provider or deployer under the Act, triggering
              transparency, conformity assessment, and AI Office reporting obligations. Non-compliance fines can reach
              €35M or 7% of global annual turnover—higher than GDPR. IP and privacy liability across the TokenRouter
              model distribution layer (GDPR, CCPA, training data copyright, output indemnification) adds additional
              legal exposure that is common to AI API marketplace operators but particularly acute for a small-scale
              platform aggregating hundreds of third-party models.
