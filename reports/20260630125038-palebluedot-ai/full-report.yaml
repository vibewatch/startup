  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold or Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth stalls
        - YoY ARR growth falls below 100% for two consecutive quarters
        - Disproves hypergrowth assumption underpinning option-value pricing; erodes exit multiple toward 8–10×
        - Immediate review; down-round risk increases; avoid follow-on at current price
      - - GPU spot price collapse
        - H100 hourly rate falls below $1.00/hr (from ~$1.40–$1.50 in June 2026)
        - >-
          Compresses marketplace take-rate revenue; enterprise cluster gross margins fall below breakeven at <60%
          utilization
        - Re-underwrite unit economics; assess enterprise cluster backlog duration to determine margin floor
      - - Hyperscaler APAC infrastructure launch
        - AWS or Azure announces dedicated APAC AI inference cluster priced below PaleBlueDot's rate card
        - Removes premium pricing power in core differentiation market; customer churn risk for enterprise segment
        - Trigger contract-by-contract review; seek direct customer loyalty evidence and renewal rates
      - - BISS / US export control tightening
        - New US rules restrict NVIDIA GPU shipments to PaleBlueDot's APAC colocation facilities
        - Blocks new cluster capacity in Japan/Korea/Singapore; constrains APAC enterprise growth engine
        - Verify regulatory exposure immediately; assess which customers are affected and what portion of ARR is at risk
      - - CEO/leadership departure
        - Stephen Watts or a second C-suite executive departs within 12 months of hire
        - Increases execution risk during critical growth phase; signals cultural or strategic instability
        - Conduct management reference checks; request board and cap-table investor commitments
    notes: >
      Triggers are based on publicly available evidence and sector benchmarks. Thresholds are author estimates derived
      from comparable neocloud analysis; PaleBlueDot has not disclosed specific internal operating thresholds.
    claimRefs:
      - CV031
      - CV032
      - CV034
      - CV041
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - ARR Composition and Quality
        - Marketplace ARR vs. enterprise cluster ARR split; top-10 customer revenue concentration; contract duration
        - >-
          Determines whether revenue is sticky recurring (enterprise) or transactional (marketplace); concentration risk
          affects NRR and downside case
        - >-
          Request CFO data room access; validated by independent accountant or legal counsel review of customer
          contracts
      - - Gross Margin by Segment
        - >-
          Marketplace gross margin (take-rate vs. cost) and enterprise cluster gross margin (hardware amortization,
          colo, power, network)
        - >-
          Without margin data, it is impossible to assess unit economics, path to profitability, or capital intensity of
          growth
        - CFO data room; cross-reference against GPU hardware cost benchmarks (NVIDIA pricing, colo power rates)
      - - Preference Stack and Anti-Dilution
        - >-
          Series A and Series B preference multiplier, participation rights, anti-dilution provisions, and pay-to-play
          requirements
        - >-
          Preference overhang determines downside protection for new investors and cost basis of founders vs. VCs in a
          distressed scenario
        - Cap table review from legal counsel; request certified capitalization table from company secretary
      - - APAC Regulatory Compliance
        - >-
          License status, data residency certifications, export control compliance program, and NVIDIA chip allocation
          documentation for APAC facilities
        - >-
          BISS 2026 and export tightening create active legal risk for APAC GPU cluster operations that could freeze new
          deployments
        - Legal review of export documentation; verify NVIDIA authorizations for each APAC colocation site
      - - Net Revenue Retention (NRR) and Churn
        - Enterprise cluster NRR over trailing 4 quarters; marketplace customer churn and cohort analysis
        - >-
          NRR below 100% in enterprise segment would signal customer dissatisfaction and undermine the platform
          stickiness thesis
        - Data room; at minimum a signed reference from top-3 enterprise customers confirming renewal intent
    notes: >
      Diligence path assumes a standard Series B-stage process. Some items (preference stack, cap table) require legal
      review under NDA. Regulatory compliance items require specialist export-control counsel. No public source resolves
      these gaps.
    claimRefs:
      - CV010
      - CV027
      - CV033
