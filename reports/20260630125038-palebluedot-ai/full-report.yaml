            body: >-
              NVIDIA represents PBD's single most concentrated technology dependency. The company's entire GPU
              fleet—marketplace inventory and enterprise clusters—runs on NVIDIA hardware. In 2026, Blackwell GPU
              (B200/GB200 NVL72) volume orders face 12–18 month lead times, with most allocation pre-committed by
              hyperscalers who collectively committed $600–630B in AI capex for 2026. TSMC's CoWoS advanced packaging
              capacity—the genuine bottleneck for Blackwell production—is consumed approximately 60% by NVIDIA alone and
              remains structurally oversubscribed through mid-2027. Any disruption to NVIDIA's supply chain, a change in
              NVIDIA's pricing or allocation policies, or an export control ruling that prevents NVIDIA from shipping
              advanced chips to PBD's APAC cluster locations would directly impair PBD's ability to fulfill customer
              commitments or expand capacity. Substitution with AMD MI300X or Google TPUs is theoretically possible for
              inference workloads but requires significant re-engineering of PBD's orchestration and software stack.


              Customer concentration risk is compounded by geopolitical exposure. Xiaohongshu (RedNote) has been
              specifically named by credible reporting as an anchor client in PBD's APAC cluster business. If this
              relationship exists and involves Chinese-parent-company access to US-controlled advanced AI chips—whether
              at a Tokyo data center or elsewhere—the BIS May 2026 guidance creates a live compliance exposure. Revenue
              concentration in a single high-risk customer is a kill criterion if it triggers a BIS enforcement action,
              license revocation, or forced unwinding of the customer relationship. The revenue share attributable to
              Xiaohongshu is not disclosed, compounding the diligence gap.
