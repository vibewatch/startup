      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Sizing Requires Scope Alignment
            body: >
              Published 2026 estimates span $35B (neocloud specialist) to $170B (broad cloud AI), a 4x spread. The
              appropriate reference for PaleBlueDot AI's addressable market is the Mordor Intelligence neocloud
              definition ($35.22B, 46% CAGR)—not the broadest TAM. Citing the $170B figure without boundary disclosure
              would materially overstate the directly addressable opportunity.
