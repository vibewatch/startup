      - number: '3.3'
        title: Capability, Pricing, GTM, and Trust Comparison
        blocks:
          - type: paragraph
            body: >-
              On pricing, the H100 on-demand market has bifurcated sharply. AWS charges $6.88 per GPU-hour on-demand and
              $5.19 per GPU-hour via Capacity Blocks effective July 2026; Azure's ND H100 v5 instances list at $12.29
              per GPU-hour; GCP prices 8-GPU configurations at $80–90 per hour ($10–11.25 per GPU-hour). By contrast,
              neoclouds collectively range from $3.29 (Lambda) to $3.90 (Crusoe) per H100 GPU-hour on-demand—a 40–70%
              discount to hyperscaler on-demand rates for identical hardware. This pricing divergence reflects
              structural differences in overhead, margin, and go-to-market. AWS's June 2025 44% H100 price cut
              compressed the hyperscaler-to-neocloud premium from roughly 5–8× to 2–3×, showing hyperscaler willingness
              to compete on GPU cost. On capability, CoreWeave leads neoclouds on MLOps depth (W&B, OpenPipe),
              enterprise backlog assurance, and GPU generation access. Hyperscalers lead on compliance (FedRAMP, HIPAA,
              ISO 27001), managed ML platforms, and global multi-region presence—attributes that regulated buyers in
              financial services, healthcare, and government require and that no neocloud fully replicates.
              PaleBlueDot's Dot-1.1 AI cloud agent addresses the managed deployment gap to a degree, but does not match
              the breadth of SageMaker or Vertex AI. On GTM, CoreWeave, Lambda, and Crusoe all target US-headquartered
              AI labs and enterprises; none has disclosed a comparable Asia-Pacific enterprise footprint. This
              geographic gap is PaleBlueDot's clearest structural differentiation relative to neocloud peers—but also
              means its enterprise cluster business does not directly compete head-on with CoreWeave's US anchor
              customer base.
