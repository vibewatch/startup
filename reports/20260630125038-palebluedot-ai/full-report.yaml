  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: |
              PaleBlueDot AI operates two distinct but complementary compute-access products under a single brand.
              The first is a GPU Cluster Marketplace enabling developers and early-stage AI companies to browse,
              compare, and reserve GPU compute capacity sourced from third-party providers worldwide. The
              marketplace employs a bidding mechanism that lets users compare prices and vacancy across global
              clouds, filtering by GPU model, region, and deployment size; both reserved and on-demand cluster
              types are supported. A provider-facing "Offer Compute" surface allows GPU capacity owners to list
              their inventory, creating a two-sided marketplace dynamic.

              The second product track is a managed enterprise cluster service: PaleBlueDot designs, deploys,
              and manages large dedicated GPU clusters for enterprise customers—typically housed in colocation
              facilities operated by Digital Realty and Equinix. This track serves the Asia-Pacific enterprise
              segment (Japan, South Korea, Singapore) as its primary growth market and includes private cloud
              deployment options for customers handling sensitive or regulated data.

              Layered above the compute substrate is the AI intelligence stack. The Dot-1.1 AI Cloud Agent
              (trained on DeepSeek-R1) assists with cluster selection, cost-optimization, and capacity planning.
              The PBD TokenRouter is the company's newest and most strategically significant product: a
