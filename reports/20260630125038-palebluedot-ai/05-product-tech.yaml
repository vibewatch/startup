callouts:
  - calloutType: strength
    title: Full-Stack Platform Covering Compute Through Model Access
    body: >
      PaleBlueDot AI's vertical coverage—from spot GPU marketplace through managed enterprise clusters
      to a unified API gateway for 300+ models—creates a rare single-vendor path for AI teams scaling
      from experimental to production. This stack depth enables customer upsell from cost-sensitive
      startup clusters to enterprise-grade managed infrastructure and API governance, compressing the
      typical multi-vendor procurement process into one relationship.
    claimRefs:
      - CE001
      - CE002
      - CE017
      - CE036

  - calloutType: risk
    title: Security Posture Depends on Colocation Partners, Not First-Party Attestations
    body: >
      No independent SOC 2 Type II or ISO 27001 for PaleBlueDot's own platform operations (separate
      from the Digital Realty facilities it colocates in) has been publicly confirmed. Enterprises
      with regulatory requirements—financial services, healthcare, government—will need to negotiate
      direct disclosure of compliance documentation under NDA before committing workloads. This is
      standard neocloud practice but represents a diligence and procurement timeline risk compared
      to hyperscalers with mature public compliance postures.
    claimRefs:
      - CE029
      - CE030
      - CE033
      - CE035

  - calloutType: risk
    title: TokenRouter Brand Ambiguity May Blunt Developer Adoption
    body: >
      A separately operated service at tokenrouter.me (with Russian/English developer support and
      an independent model catalog) shares the "TokenRouter" brand with PBD's tokenrouter.com
      platform. Developer documentation, web search results, and community discussions conflate the
      two. Developers researching the PBD product may follow the wrong integration path, increasing
      support burden and reducing conversion from the Premium Token Credit Program.
    claimRefs:
      - CE016
      - CE044

