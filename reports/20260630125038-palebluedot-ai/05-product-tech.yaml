  - id: tokenrouter-intelligence
    title: TokenRouter and Intelligence Layer
    body: |
      PBD TokenRouter was launched on April 21, 2026 from Palo Alto and is available at tokenrouter.com.
      The platform is positioned as a business-to-business unified AI access layer serving builders,
      startups, and enterprises. It consolidates frontier AI providers into a single integration point,
      eliminating the need for separate account registrations, per-provider integrations, and
      re-engineering when providers release new models or experience downtime.

      The platform's four primary capabilities are: (1) Smart Token Routing—a proprietary skill that
      analyzes each request and routes it to the model best suited for the task, optimizing cost and
      performance automatically; (2) Multi-Channel Automatic Failover—maintains connections across
      multiple upstream providers plus PBD's own inference cloud, enabling 99.95% uptime when any
      upstream route degrades; (3) Real-Time Cost Governance—automated budget enforcement at the member,
      team, and department level with programmatic spend controls replacing manual reconciliation; and
      (4) Smart Caching—intelligent request deduplication and result reuse reducing unnecessary token
      consumption without application-level changes.

      The token economics engine, Token Factory, underpins TokenRouter's pricing model. Integration
      guides for OpenClaw, Codex CLI, Hermes Agent, and other developer tools are published on the
      documentation site (tokenrouter.com/docs), including a step-by-step OpenClaw setup guide
      embedded in the PaleBlueDot platform that directs developers to api.tokenrouter.com/v1 as the
      API endpoint. The Premium Token Credit Program selects 100 organizations per month to receive
      free inference credits, serving as a developer adoption flywheel; the company plans to co-sponsor
      global hackathons and research partnerships under this program.

      Key documentation assets include Privacy Policy, Terms of Use, and a Global Data Processing
      Agreement, signaling intent to address GDPR compliance requirements. Dot-1.1 provided early
      DeepSeek API access (including DeepSeek 671B) before local deployment became mainstream,
      positioning PBD as an early-access channel for high-demand open-source models.
