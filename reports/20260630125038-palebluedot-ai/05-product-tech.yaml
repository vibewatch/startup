chapter:
  number: 5
  title: Product & Technology
  summary: >
    PaleBlueDot AI runs a dual-track compute platform—a GPU Marketplace brokering third-party excess
    capacity to startups, and managed enterprise GPU clusters deployed in ISO/IEC 27001-certified
    colocation facilities (Digital Realty, Equinix). Layered above the compute substrate is an AI
    intelligence stack: the Dot-1.1 AI Cloud Agent (trained on DeepSeek-R1 for cluster planning),
    the PBD TokenRouter (unified API gateway for 300+ frontier models at tokenrouter.com, launched
    April 21, 2026 with 99.95% uptime SLA), and a Model Library for discovery and price comparison.
    Platform security relies on colocation-partner certifications rather than first-party attestations;
    no independent SOC 2 for PBD's own platform operations has been publicly confirmed. The rapid release
    cadence—Dot-1.1 in early 2026, TokenRouter in April 2026—signals ambitious product execution but
    also reflects early-stage compliance posture and limited independently verified developer adoption signals.

sections:
  - id: product-definition
    title: Product Definition and Module Map
    body: |
      PaleBlueDot AI operates two distinct but complementary compute-access products under a single brand.
      The first is a GPU Cluster Marketplace enabling developers and early-stage AI companies to browse,
      compare, and reserve GPU compute capacity sourced from third-party providers worldwide. The
      marketplace employs a bidding mechanism that lets users compare prices and vacancy across global
      clouds, filtering by GPU model, region, and deployment size; both reserved and on-demand cluster
      types are supported. A provider-facing "Offer Compute" surface allows GPU capacity owners to list
      their inventory, creating a two-sided marketplace dynamic.

      The second product track is a managed enterprise cluster service: PaleBlueDot designs, deploys,
      and manages large dedicated GPU clusters for enterprise customers—typically housed in colocation
      facilities operated by Digital Realty and Equinix. This track serves the Asia-Pacific enterprise
      segment (Japan, South Korea, Singapore) as its primary growth market and includes private cloud
      deployment options for customers handling sensitive or regulated data.

      Layered above the compute substrate is the AI intelligence stack. The Dot-1.1 AI Cloud Agent
      (trained on DeepSeek-R1) assists with cluster selection, cost-optimization, and capacity planning.
      The PBD TokenRouter is the company's newest and most strategically significant product: a
      business-to-business unified API gateway that aggregates 300+ frontier AI models including Kimi,
      DeepSeek, GLM, MiniMax, Qwen, OpenAI-family, Claude, and Gemini through a single OpenAI-compatible
      integration point. The Model Library enables model discovery and price comparison. The AGI
      Landscape Map visualizes the broader AI ecosystem. The Token Factory is a proprietary token
      production model powering TokenRouter economics—notably unavailable for enterprise accounts in the
      current platform version.
