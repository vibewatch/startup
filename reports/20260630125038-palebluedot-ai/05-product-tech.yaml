  - id: architecture-operating-model
    title: Architecture and Operating Model
    body: |
      PaleBlueDot AI describes its core infrastructure as a full-stack, multi-tenant cloud architecture.
      Compute is anchored in colocation facilities run by Digital Realty and Equinix, supplemented by
      PBD's own self-hosted inference cloud that serves as a failover route within the TokenRouter
      availability chain. The company reports 80+ global clusters spanning North America, Japan, South
      Korea, Singapore, and Southeast Asia.

      Marketplace cluster listings expose structured hardware parameters to buyers: GPU model, interconnect
      type (InfiniBand or other), cores per node, RAM per node, cluster interface, and price per GPU/hour.
      For enterprise deployments, PaleBlueDot configures and manages hardware to the buyer's specification
      within the colo facility. The Dot-1.1 AI Cloud Agent enhances the procurement experience by providing
      daily-refreshed cluster pricing data across regions and GPU models.

      The API surface exposes an OpenAI-compatible endpoint with API base URL api.tokenrouter.com/v1,
      allowing development teams already using OpenAI SDKs to integrate PBD TokenRouter without
      re-engineering their stacks. Token-level operations (authentication, usage logging, billing) are
      managed through the web console's API Keys, Usage Logs, and Balance pages. The multi-tenant
      architecture enforces spend controls at member, team, and department level. Series B proceeds are
      explicitly allocated to strengthening multi-tenant architecture, platform engineering, and AI Cloud
      Agent expansion.

      A notable architectural ambiguity exists between PBD's official TokenRouter (tokenrouter.com /
      api.tokenrouter.com/v1) and a separately branded tokenrouter.me service with an independent
      model catalog and Russian/English developer support—creating potential brand confusion for
      developers sourcing integration documentation.
