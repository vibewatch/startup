  - id: trust-security-compliance
    title: Trust, Security and Compliance
    body: |
      PaleBlueDot AI's security posture is primarily anchored in its colocation partners' certifications.
      The company's Security & Compliance modal states: "At PaleBlueDot AI, security and trust come
      first. We continually strengthen our platform and operational controls to provide verifiable
      protection for enterprise customers." Its primary facilities are provided by Digital Realty, which
      holds ISO/IEC 27001 certification and publishes SOC 2 and SOC 3 reports covering physical
      infrastructure and facility operations. Verification documents can be shared on request, but only
      under NDA—standard neocloud practice that nonetheless creates friction for enterprise procurement
      before a commercial relationship is established.

      Digital Realty's high-density colocation platform supports up to 150 kW per cabinet, 100% renewable
      energy coverage for U.S. and EU portfolios, and a 99.999% global SLA for uptime—providing a robust
      physical foundation. For sensitive workloads, PaleBlueDot offers private cloud deployment options
      through its cluster marketplace or custom cluster requests, enabling enterprise customers to
      maintain full control over their AI workloads while leveraging the global compute network.

      The TokenRouter documentation site publishes a Global Data Processing Agreement, indicating
      preparation for GDPR-compliant data handling for EU users. No data retention on prompts or
      completions is cited in developer-facing third-party reviews of the gateway. However, no
      independent first-party SOC 2 or ISO 27001 for PaleBlueDot's own platform operations (distinct
      from its colocation facilities) has been publicly confirmed as of the research date—this is a
      material diligence gap for enterprise customers with data residency or operational security
      requirements.
