  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: founders
      missingEvidence: >-
        No founder names appear in official company materials, press releases, or indexed
        third-party coverage as of June 2026. Governance structure, board composition, and
        founder equity are entirely opaque in public sources.
      whyItMatters: >-
        Without disclosed founder identities, diligence on key-person dependence, governance
        instruments, co-founder conflicts, and cap-table concentration cannot be anchored to
        specific individuals. This is a prerequisite for any standard Series B diligence.
      diligencePath: >-
        Request corporate documents, cap table, board composition, founder equity grants,
        vesting schedules, and any significant-investor governance rights directly from the
        company or deal counsel.
      relatedQuestionRefs:
        - QO006
        - QO029
      relatedTableRefs:
        - TO002
        - TO003
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: >-
        Employee headcount is not publicly disclosed. No LinkedIn employee count, SEC filing, or
        news source provides a figure for the number of employees or contractors.
      whyItMatters: >-
        Headcount is a core operating-scale and burn-rate input for Series B diligence. The
        absence makes it impossible to assess capital efficiency, staffing for the announced
        expansion, or attrition risk.
      diligencePath: >-
        Request current headcount by function and location, org chart, and hiring plan tied to
        the Series B use-of-proceeds expansion.
      relatedQuestionRefs:
        - QO024
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: significant
      topic: Series-B-co-investors
      missingEvidence: >-
        Co-investors alongside B Capital in the January 2026 Series B round are not publicly
        named in any retained source. Only B Capital is identified as the lead investor.
      whyItMatters: >-
        Unknown co-investors may hold governance rights, information rights, or pro-rata
        privileges that affect future financing dynamics and founder dilution.
      diligencePath: >-
        Request the full list of Series B participants, term sheet, and any side letters
        granting special rights beyond the lead investor's disclosed position.
      relatedQuestionRefs:
        - QO012
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: significant
      topic: Series-A-round-details
      missingEvidence: >-
        The identity of Series A investors and the precise amount of the Series A round are not
        publicly available in any retained source. The $10M figure in the task brief context has
        not been independently corroborated.
      whyItMatters: >-
        Prior-round economics, preference stack, and existing investor governance rights directly
        affect how the Series B economics are structured and who controls material decisions.
      diligencePath: >-
        Request the Series A term sheet, list of participants, current cap table with
        post-Series-B dilution, and any side letters granting special information or approval
        rights.
      relatedQuestionRefs:
        - QO013
      relatedTableRefs:
        - TO003
    - type: conflicting-data
      severity: significant
      topic: RedNote-loan-controversy
      missingEvidence: >-
        PaleBlueDot AI denied the December 2025 report about a $300M Nvidia chip loan for
        RedNote as "factually inaccurate" without elaborating. The SiliconAngle report
        simultaneously confirmed, via Reuters, that Xiaohongshu is a client. The nature and
        current status of the client relationship and any financing associated with it remain
        unresolved.
      whyItMatters: >-
        If a material China-linked customer relationship exists, it creates export-control,
        chip-supply restriction, and geopolitical concentration diligence questions. The
        incomplete denial without elaboration weakens trust in management transparency.
      diligencePath: >-
        Request full client list, confirmation of the Xiaohongshu relationship and its current
        revenue contribution, and a written legal opinion on compliance with U.S. export controls
        for any China-facing GPU supply.
      relatedQuestionRefs:
        - QO020
        - QO021
        - QO027
      relatedTableRefs:
        - TO003
        - TO004
    - type: private-evidence-only
      severity: moderate
      topic: revenue-financials
      missingEvidence: >-
        No audited revenue figures, ARR, gross margin, burn rate, or other financial metrics are
        publicly available. The greater-than-10x revenue growth figure is an unaudited company
        claim in the Series B press release.
      whyItMatters: >-
        The revenue growth claim is the primary financial signal underpinning the $1B+ valuation.
        Without audit or independent corroboration, investors cannot assess the base from which
        10x growth was achieved, the quality of that revenue, or the current run rate.
      diligencePath: >-
        Request audited or reviewed financial statements for fiscal 2024 and 2025, a current
        ARR/run-rate figure, gross margin by product line, and the CAC/LTV model.
      relatedQuestionRefs:
        - QO014
      relatedTableRefs:
        - TO001
