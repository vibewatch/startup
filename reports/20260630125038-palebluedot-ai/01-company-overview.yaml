  - id: SO-section-4
    title: Milestones, adverse context, and scale signals
    body: >
      PaleBlueDot AI's public chronology begins with its 2024 founding and runs through a series
      of notable events across growth, leadership, financing, product, and controversy. The
      company's Silicon Valley launch occurred in an era of extreme demand for neocloud alternatives
      to the major hyperscalers; SiliconAngle categorizes it alongside CoreWeave, Lightning AI, and
      Lambda Labs as specialized flexible GPU infrastructure providers targeting both AI-native
      startups and enterprises that need compute outside the major cloud providers.


      A materially adverse event surfaced in December 2025 when Data Center Dynamics reported that
      PaleBlueDot AI had reportedly sought a $300 million loan to purchase Nvidia chips intended for
      use by Xiaohongshu (RedNote), the popular Chinese social media platform. PaleBlueDot AI
      responded to the reporting by calling the claims "factually inaccurate" without elaborating.
      The underlying facts were not resolved by the company's denial, and subsequent reporting
      (SiliconAngle, citing Reuters) confirmed that Xiaohongshu was a client, though the specific
      nature of the relationship and any loan arrangement remain unconfirmed. This episode is
      material for diligence because it raises questions about geographic client concentration
      (China-linked platforms), Nvidia chip procurement exposure, and communication transparency
      when adverse reports surface.


      At the platform scale level, PaleBlueDot AI's website claims 130 GPU clusters, 200,000
      GPUs connected, 50 regions, and 20 supply partners as of the run date. Infrastructure is
      certified under ISO/IEC 27001 and supported by SOC 2 and SOC 3 reports via the Digital Realty
      colocation relationship. The GPU product catalog covers the newest Nvidia generations:
      GB300, B300, GB200, B200, H200, and H100. The company launched the PBD TokenRouter product
      in April 2026 at tokenrouter.com, covering more than 300 models and including a Premium Token
      Credit Program that awards free inference credits to 100 builders and enterprises monthly.
