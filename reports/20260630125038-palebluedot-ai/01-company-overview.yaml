  - id: SO-section-2
    title: Leadership and governance
    body: >
      Stephen Watts was appointed Chief Executive Officer of PaleBlueDot AI on January 23, 2026,
      as announced via the company's newsroom. He joined PaleBlueDot AI approximately two years
      before the appointment—placing his start around 2024—as Vice President of Go-to-Market, where
      he supported the company's global expansion efforts. The company's announcement describes him
      as having a "distinguished 25-year career" and specifically identifies his prior role as
      President and COO of SAP Asia Pacific Japan, citing his track record of navigating complex
      global markets, cross-cultural partnerships, and high-quality growth.


      His appointment as CEO follows the company's rapid international scale-up and the subsequent
      Series B financing. The announcement frames the transition as organic succession from within
      the company, with the stated rationale being his deep understanding of PaleBlueDot AI's
      customers, platform, and the global AI infrastructure landscape. As CEO, Watts is described as
      focused on executing a customer-first go-to-market strategy while advancing the mission to
      make intelligence universally accessible.


      The identities of the original founders are not publicly disclosed in any source retrieved
      during this research. No founder names appear in official company materials, press releases,
      or the indexed third-party coverage available as of June 2026. This represents a material gap
      in the public identity record: later chapters needing to assess key-person dependence beyond
      Stephen Watts cannot currently anchor to disclosed founder relationships, board composition,
      or governance instruments. The diligence path is to request the cap table, board composition,
      and governance documents from the company directly.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO002
  - id: SO-section-3
    title: Capital structure and stakeholder map
    body: >
      PaleBlueDot AI announced the completion of a $150 million Series B financing on January 28,
      2026, valuing the company at over $1 billion and marking it as a unicorn. The round was led
      by B Capital, a San Francisco and Singapore-headquartered investment firm that the company's
      press release described as holding more than $9 billion in assets under management at the
      time of the deal; B Capital's own website listed more than $12 billion AUM by June 2026,
      suggesting the $9 billion figure was a point-in-time disclosure.


      The financing followed a year of significant growth in which PaleBlueDot AI reported revenue
      increasing more than 10-fold, driven by enterprise demand for scalable, cost-efficient AI
      compute. The company disclosed that the new capital would be primarily used to strengthen core
      technology capabilities, invest in platform engineering and technical talent, enhance the
      full-stack multi-tenant cloud architecture, accelerate the AI Cloud Agent product, and expand
      go-to-market capabilities and global operations.


      The Series A financing amount and investors are not publicly disclosed in sources available as
      of June 2026. Task brief context references a prior round of approximately $10 million, but
      this figure has not been independently corroborated through publicly accessible sources in the
      current source set and is therefore treated as an evidence gap. SEC EDGAR Form D searches
      returned no filings matching PaleBlueDot AI, which is consistent with the use of exempt
      private placements that may have been filed under a name variant or may not yet be indexed.


      Co-investors in the Series B beyond B Capital are not publicly named. The company's
      infrastructure partner Digital Realty provides primary colocation, and the SiliconAngle
      analysis identifies Xiaohongshu (also known as RedNote), the Chinese social media platform,
      as a client—information attributed to Reuters. The PR communication channel (FGS Global)
      provides an additional stakeholder surface for diligence outreach.
