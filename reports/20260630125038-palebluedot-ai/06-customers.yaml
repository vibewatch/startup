  - id: TU005
    title: Expansion and Concentration Risk
    columns:
      - Risk Factor or Expansion Driver
      - Concentration or Dependency Level
      - Impact Assessment
      - Diligence Path
    rows:
      - - Xiaohongshu single-name customer concentration
        - Only publicly named enterprise customer; $300M GPU financing (disputed) implies anchor-scale commitment
        - High — loss or export-control-triggered disruption of this client would be material if it represents a large share of enterprise revenue
        - Request customer revenue concentration waterfall; confirm whether top 3 accounts exceed 50% of revenue; assess BIS export-compliance posture for this relationship
      - - Geographic concentration in Japan, South Korea, and Singapore
        - All three disclosed enterprise markets in Asia; US-China trade tensions create simultaneous regulatory risk across all three
        - Medium-High — geopolitical escalation or tightened GPU export rules could disrupt the Asia customer base as a bloc
        - Monitor BIS ECCN 3A090.a policy updates; request non-Asia revenue share; assess cross-jurisdictional mitigation plan
      - - Marketplace-to-enterprise cluster graduation (expansion driver)
        - Token Factory startup customers graduating to enterprise dedicated clusters is structurally plausible but unverified
        - Medium — if graduation rate is low, revenue base is fragmented across low-ACV marketplace accounts with limited NRR potential
        - Request conversion rate from Token Factory accounts to dedicated cluster contracts; identify whether any marketplace customer has transitioned to a cluster
      - - TokenRouter credit program as demand generation
        - 100 free-credit recipients per month is the primary disclosed top-of-funnel mechanism for the new TokenRouter product
        - Low-Medium — pipeline signal, not revenue; conversion rate determines LTV model viability for the builder and startup segment
        - Request conversion funnel metrics after Q3 2026 when the first full quarterly cohort of credit recipients has elapsed
      - - Enterprise cluster capital intensity and commitment risk
        - Dedicated cluster builds require upfront GPU procurement tied to customer contract length; cancellation or delay creates stranded capital
        - Medium — if enterprise customers churn or delay, capital deployed in colos may generate idle GPU capacity and margin pressure
        - Confirm whether enterprise cluster contracts carry take-or-pay provisions; assess GPU redeployment or resale capabilities if a customer exits early
    notes: >-
      Impact assessments are qualitative judgments based on inferred customer concentration; PaleBlueDot
      AI has not disclosed financial data to quantify these risks numerically. The Xiaohongshu row
      reflects both concentration risk and export-control legal exposure, which are separate but
      compounding risks even if the financing story was inaccurate. Expansion driver rows describe
      potential upside that is unverified by disclosed conversion data.
