chapter:
  number: 6
  title: Customers
  summary: >-
    PaleBlueDot AI serves a dual-segment customer base—AI startups and developers accessing GPU compute
    via the Token Factory marketplace, and large enterprises receiving dedicated GPU cluster builds—with
    a disclosed footprint in North America, Japan, South Korea, and Singapore. The only publicly named
    enterprise customer is an overseas entity of Xiaohongshu (RedNote), confirmed by Reuters and
    corroborated by SiliconAngle and TechStartups; PaleBlueDot disputed only the reported $300 million
    financing arrangement, not the underlying customer relationship. Revenue grew more than 10-fold in
    2025, but no NRR, GRR, churn, or active customer-count data has been publicly disclosed. ClusterMax
    independently rated PaleBlueDot as "underperforming" for missing a basic security attestation, a
    compliance signal material to enterprise retention diligence.

sections:
  - id: customer-segmentation
    title: Customer Base and Segmentation
    body: >-
      PaleBlueDot AI operates a dual-segment customer model designed to serve both the high-volume,
      dynamic demand of AI startups and the sustained, large-scale requirements of enterprise
      organizations. The first segment—AI startups and developers—accesses compute through the Token
      Factory marketplace, which aggregates GPU capacity from multiple third-party providers and offers
      per-minute billing for on-demand and reserved cluster rentals. The second segment—enterprise
      organizations—receives dedicated, large-scale GPU cluster builds in colocation facilities operated
      by Digital Realty and Equinix, spanning Japan, South Korea, Singapore, and North America. The
      company explicitly targets organizations with "complex infrastructure requirements involving
      large-scale deployments, reserved capacity, or flexible GPU sourcing across a global network."


      The F6S software listing independently describes PaleBlueDot as used by small businesses, mid-size
      businesses, large businesses, and enterprises, confirming multi-tier market reach. B Capital, the
      Series B lead investor headquartered in San Francisco and Singapore, provides investor alignment
      with PaleBlueDot's Asia-Pacific customer concentration. In April 2026, PaleBlueDot extended beyond
      compute infrastructure by launching PBD TokenRouter at tokenrouter.com, targeting a third customer
      profile—builders, founders, and operators running mission-critical AI API workloads—through a
      single-integration model consolidating more than 300 frontier AI models. The Premium Token Credit
      Program selects 100 builders, startups, and enterprises monthly for free inference credits,
      functioning as a structured top-of-funnel acquisition mechanism. CEO Stephen Watts framed the
      model around a customer-first mindset emphasizing predictability, speed, and cost efficiency
      across regions.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU006
      - CU007
      - CU008
