callouts:
  - calloutType: strength
    title: Validated Enterprise Demand — 10x Revenue Growth in 2025
    body: >-
      The Series B press release confirmed revenue growth exceeding 10-fold in 2025, attributed to
      enterprise demand for scalable AI compute. While the absolute revenue base is undisclosed, the
      growth rate and $1B-plus valuation secured from B Capital provide an investor-validated signal
      that the enterprise cluster segment is generating meaningful traction across Japan, South Korea,
      and Singapore.
    claimRefs:
      - CU009
      - CU010

  - calloutType: risk
    title: Single Named Customer Concentration and Export-Control Exposure
    body: >-
      Xiaohongshu and RedNote is the only publicly named enterprise customer, and the Bloomberg-
      reported $300 million GPU acquisition—even if disputed—implies a relationship large enough to
      anchor a capital commitment. BIS export-control regulations under ECCN 3A090.a may apply even
      to GPU deployments in Japan for Chinese end-users, creating legal exposure at PaleBlueDot's most
      visible customer. Geographic concentration in Japan, South Korea, and Singapore amplifies
      geopolitical risk across the entire disclosed enterprise footprint simultaneously.
    claimRefs:
      - CU032
      - CU034
      - CU035

  - calloutType: recommendation
    title: Require NRR, GRR, Customer Count, and Revenue Concentration Disclosure Before Investment
    body: >-
      No retention metrics, customer count, or revenue concentration data have been publicly disclosed.
      Due diligence must obtain NRR and GRR by segment, average contract length and renewal rate, total
      active customer count, and the share of revenue from the top 3 accounts before any
      valuation-dependent decision can be supported. The absence of these metrics is the single largest
      evidence gap in this chapter.
    claimRefs:
      - CU027
      - CU040

