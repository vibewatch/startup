  - id: retention-concentration
    title: Retention, Expansion, and Concentration Risks
    body: >-
      PaleBlueDot AI has not publicly disclosed NRR, GRR, churn rate, or cohort retention data for
      any customer segment as of June 2026. Enterprise dedicated cluster contracts imply multi-month
      commitments given the bespoke nature of GPU cluster design and build cycles, but no average
      contract length or renewal rate has been published. PBD TokenRouter claims 99.95% uptime through
      multi-channel automatic failover, a reliability signal but not a retention metric. ClusterMax
      confirmed the marketplace functional but placed it in the "underperforming tier" for missing a
      basic security attestation; it further recommended onboarding more providers and implementing
      genuine Slurm or Kubernetes cluster orchestration and shared storage, pointing to orchestration
      gaps that limit appeal for compliance-sensitive enterprise buyers.


      Customer concentration is a material diligence concern. Xiaohongshu and RedNote is the only
      publicly named enterprise customer, and the Bloomberg-reported $300 million GPU acquisition—even
      if disputed—suggests the relationship may anchor a capital commitment large enough to create
      significant single-customer revenue dependence. BIS export-control regulations under ECCN 3A090.a
      may apply even to GPU deployments hosted in Japan for Chinese end-users, creating legal exposure
      at PaleBlueDot's most visible customer relationship. Geographic concentration in Japan, South
      Korea, and Singapore amplifies geopolitical risk from US-China technology tensions across the
      entire disclosed enterprise footprint. StartupHub.ai independently notes that PaleBlueDot targets
      markets where North American export restrictions have driven demand, identifying export-restriction
      arbitrage as a structural customer acquisition angle with commensurate regulatory risk. The
      expansion path from marketplace startup usage to enterprise dedicated clusters is structurally
      plausible but unverified by any public conversion or graduation data, and the TokenRouter credit
      program represents a pipeline signal rather than demonstrated retention proof.
    claimRefs:
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
