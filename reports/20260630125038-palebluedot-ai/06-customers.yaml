  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-count
      missingEvidence: >-
        Total active customer count segmented by marketplace users and enterprise cluster accounts
        as of mid-2026; quarterly new customer adds and inactive account attrition.
      whyItMatters: >-
        Without a customer count it is impossible to calculate CAC, LTV, or churn rate, or to assess
        whether the 10x revenue growth is driven by new customer acquisition or expansion within
        existing anchor accounts.
      diligencePath: >-
        Request management accounts or board-level KPI dashboard showing active customer counts,
        new customer adds per quarter, and inactive account attrition; cross-reference with any
        investor data room materials.
      relatedQuestionRefs:
        - QU002

    - type: private-evidence-only
      severity: material
      topic: revenue-concentration
      missingEvidence: >-
        Revenue share of top 3 and top 5 enterprise customers, including whether Xiaohongshu exceeds
        20 percent of total revenue, and whether any single customer exceeds 50 percent.
      whyItMatters: >-
        High top-customer revenue concentration would make the investment thesis dependent on a single
        relationship subject to both export-control legal risk and geopolitical disruption,
        significantly affecting the appropriate valuation and risk rating.
      diligencePath: >-
        Request a customer revenue waterfall or top-10-customer revenue share from the CFO; confirm
        whether any accounts carry take-or-pay provisions that protect revenue in case of partial
        wind-down.
      relatedQuestionRefs:
        - QU017

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Names, use cases, quantified outcomes, and deployment details for enterprise cluster customers
        in Japan, South Korea, and Singapore beyond Xiaohongshu.
      whyItMatters: >-
        Without additional named customer references, the quality, diversification, and retention
        profile of the Asia-Pacific enterprise base cannot be independently evaluated.
      diligencePath: >-
        Request 2 to 3 reference customers willing to discuss their PaleBlueDot deployment on the
        record; in the absence of named references, obtain anonymized case studies with quantified
        throughput, cost savings, or availability outcomes.
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: >-
        NRR, GRR, and cohort churn data for enterprise cluster customers with at least 12 months of
        tenure; average contract length and renewal rate for the enterprise cluster segment.
      whyItMatters: >-
        Enterprise GPU infrastructure is capital-intensive; without retention data it is impossible to
        assess whether existing enterprise revenue is durable or at risk of non-renewal after initial
        cluster design-and-build cycles conclude.
      diligencePath: >-
        Request NRR and GRR by segment from management accounts; benchmark against CoreWeave,
        Lambda Labs, and neocloud peer disclosures; confirm whether enterprise cluster customers have
        renewed at least one contract cycle.

    - type: missing-source
      severity: minor
      topic: tokenrouter-conversion
      missingEvidence: >-
        Conversion rate from TokenRouter credit program participants to paying TokenRouter or
        enterprise cluster customers; total paid TokenRouter accounts as of June 2026.
      whyItMatters: >-
        The credit program is PaleBlueDot's primary disclosed demand-generation mechanism for
        TokenRouter; without conversion data the pipeline quality and downstream revenue contribution
        cannot be assessed.
      diligencePath: >-
        Request conversion funnel data after Q3 2026 when at least one full quarterly cohort of
        credit recipients has elapsed; compare to industry benchmarks for API-layer developer
        freemium conversion rates.

