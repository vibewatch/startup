  - id: adoption-named-proof
    title: Adoption Trajectory and Named Customer Proof
    body: >-
      PaleBlueDot AI's Series B press release disclosed revenue growth exceeding 10-fold in 2025,
      attributed to strong enterprise demand for scalable, cost-efficient AI compute. No absolute
      revenue figure was provided; the metric is company-claimed and has not been independently
      verified. The company characterized this growth as stemming from its ability to deliver capacity
      rapidly and reliably across a growing geographic footprint in North America, Japan, Korea, and
      Southeast Asia. In early 2025, PaleBlueDot launched Dot-1.1, an AI cloud agent enabling
      deployment of models including DeepSeek-R1, reflecting product-led adoption within the startup
      segment.


      The only publicly named enterprise customer is an overseas entity of Xiaohongshu (RedNote), the
      Chinese social media platform. Reuters first reported this customer relationship in January 2026
      as part of its Series B coverage; SiliconAngle, TechStartups, and US News and World Report
      independently corroborated it citing the same Reuters source. The disclosed deployment involves
      AI inference workloads at a Tokyo data center. In December 2025, Bloomberg reported that
      PaleBlueDot was seeking approximately $300 million in financing to acquire Nvidia chips for this
      deployment, with JPMorgan reportedly preparing marketing materials; PaleBlueDot called this
      "factually incorrect" without denying the customer relationship. Neither Nvidia nor Xiaohongshu
      commented publicly. US News confirmed the Xiaohongshu entity is an "overseas entity," meaning
      data residency is outside mainland China. No other individually named enterprise customers appear
      in public sources. ClusterMax's independent review confirms that the Token Factory marketplace is
      functional and accessible for the startup segment, noting successful testing across five
      aggregated clouds with per-minute billing.
    claimRefs:
