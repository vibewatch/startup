  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: export-control
      missingEvidence: >-
        Written confirmation from PBD of Xiaohongshu relationship status, volume, and whether
        any Nvidia chips have been or are being supplied to Xiaohongshu-controlled infrastructure.
      whyItMatters: >-
        The BIS May 31, 2026 guidance makes any GPU supply to a Chinese-parent-company entity
        (regardless of geography) a potential license violation; without clarification, equity
        investment involves unquantifiable regulatory exposure.
      diligencePath: >-
        Request board resolution confirming compliance posture; obtain BIS export counsel
        legal opinion specific to all APAC customer relationships; request complete APAC
        customer list with ultimate beneficial ownership.
      relatedQuestionRefs: [QR002, QR003, QR025]
      relatedTableRefs: [TR001]

    - type: private-evidence-only
      severity: blocking
      topic: capital-structure
      missingEvidence: >-
        Full capital structure disclosure: any GPU-backed debt instruments, SPV arrangements,
        sale-leaseback agreements, or off-balance-sheet guarantees.
      whyItMatters: >-
        A $300M GPU-backed sale-leaseback written at 2023 scarcity economics would be severely
        cash flow stressed at current H100 rates; it would materially change enterprise value
        and equity risk. Equity underwriting is impossible without this information.
