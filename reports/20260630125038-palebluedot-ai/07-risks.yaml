  - id: people-execution
    title: People, Execution, and Governance Risks
    body: >-
      PBD's people risks are concentrated in leadership opacity and structural governance
      unknowns. The identities of the company's original founders are not publicly disclosed;
      no founder names appear in press releases, official company materials, or indexed
      third-party coverage as of June 2026. This is unusual for a company at Series B / >$1B
      valuation. It prevents assessment of key-person technical dependence, IP ownership
      history, and any conflicts of interest between founders and the Xiaohongshu/export-control
      controversy. CEO Stephen Watts was appointed on January 23, 2026—six months before this
      report—following two years as VP of Go-to-Market. His prior executive experience (President
      and COO, SAP Asia Pacific Japan) provides credibility for the APAC expansion thesis but
      does not cover technical operations, GPU procurement, or AI infrastructure execution.
      Whether the CEO role is additive or represents a governance gap following the $300M
      controversy is unclear. No other C-suite roles beyond Watts are publicly confirmed, leaving
      the CTO/CPO/CFO identities unknown. Execution risks are elevated by the company's global
      footprint across four markets (US, Japan, South Korea, Singapore) and a nascent API
      product (TokenRouter) that extends beyond core GPU infrastructure into AI model
      distribution—a domain with distinct IP, regulatory, and competitive dynamics that requires
      different management capabilities.
