  - id: diligence-recommendation
    title: Thesis-Break Triggers, Exit Readiness, and Final Recommendation
    body: >
      The single most important diligence unlock for PaleBlueDot is disclosure of ARR
      composition (marketplace vs. enterprise cluster), gross margin by segment, and
      net revenue retention. Without these, it is impossible to distinguish a high-value
      recurring enterprise business from a thin-margin transactional broker. The July–August
      2026 follow-up calls with B Capital portfolio management and PaleBlueDot CFO should
      focus on these metrics before any commitment at or near the Series B price.


      Thesis-break triggers fall into three categories: financial (ARR stops growing or
      NRR drops below 80%, indicating churn in enterprise anchors); competitive (AWS or
      Azure launches a targeted APAC AI cluster offering below PaleBlueDot's price point);
      and regulatory (US export control tightening under BISS 2026 that restricts GPU
      supply to APAC data centers). The CNBC/Al Jazeera reporting in May–June 2026 on US
      steps to halt NVIDIA chip shipments to Chinese firms outside China represents an active
      regulatory risk that has not yet been priced into sector valuations.


      Exit readiness is limited. PaleBlueDot has a two-year operating history, lacks public
      financial disclosures, and has not yet disclosed an intent to pursue an IPO.
      Lambda Labs—with 3–4× PaleBlueDot's revenue and four years more operating history—
      is only targeting an H2 2026 IPO as an early candidate in the neocloud category.
      PaleBlueDot's most plausible exits by 2028 are: (1) strategic acquisition by a
      data center operator (e.g., Digital Realty, Equinix) seeking to expand AI compute
      services in APAC; (2) acquisition by a hyperscaler expanding into managed APAC
      inference; or (3) Series C/D growth round extending the runway to an eventual IPO
      in 2029–2030. M&A scenario value is bounded by strategic acquirer synergies, not
      public market multiples.


      Final recommendation: Track. PaleBlueDot is operating in a large and growing market
      with genuine hypergrowth signals, experienced investor backing, and differentiated
      APAC geography. However, the $1B Series B price requires exceptional execution to
      generate positive returns, the unit economics of the neocloud sector are under
      structural pressure, and material private financial metrics are undisclosed. Investors
      should track the next milestone event—Series C or ARR disclosure above $25M—before
      committing capital.
    claimRefs:
      - CV034
      - CV043
      - CV044
    tableRefs: [TV005, TV006]
    figureRefs: [FV004]

