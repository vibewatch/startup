  - id: scenario-analysis
    title: "Scenario Analysis: Bull, Base, and Bear Cases"
    body: >
      Three scenarios bracket the investment outcome from the Series B entry price, each
      with explicit 2028 revenue assumptions and valuation methodology. All scenarios
      assume a three-year hold from January 2026, one additional dilutive round (25–40%
      of shares), and an exit event (IPO or M&A) by late 2028.


      Bull scenario: APAC enterprise cluster ramp accelerates, software layer (TokenRouter)
      generates separate recurring revenue, and GPU infrastructure demand sustains >5×
      annual growth through 2028. Revenue reaches $75–100M annualized by year-end 2028.
      At a 20–25× forward multiple (consistent with TensorWave's current multiple on
      $100M revenue), enterprise value would reach $1.5–2.5B. After 30–40% dilution from
      a future round and transaction friction, a Series B investor could recover 1.5–2.5×
      invested capital, implying an IRR of approximately 15–35%.


      Base scenario: Growth moderates to 2–3× annually as GPU price compression reduces
      marketplace revenue and enterprise cluster deployments face longer sales cycles.
      Revenue reaches $20–40M by year-end 2028. At 12–18× forward revenue (below the
      TensorWave comp to reflect lower scale and execution track record), enterprise value
      reaches $240M–720M. With 25–40% dilution, Series B investors face flat-to-loss
      outcomes, implying an IRR of negative 10% to 5%.


      Bear scenario: H100 price commoditization continues to $0.80–1.20/hr (from the
      current $1.40–$1.50), hyperscalers absorb mid-market enterprise cluster demand, and
      PaleBlueDot's APAC expansion encounters regulatory chip-export restrictions that
      limit cluster capacity sales. Revenue growth plateaus or reverses, reaching only
      $5–15M by 2028. Forced recapitalization or fire sale exit implies a valuation of
      $50–150M—an 85–95% loss from Series B.


      GPU price trends are a critical shared variable: every $0.50/hr decline in H100
      pricing compresses marketplace take-rate revenue by an estimated 20–30% without
      proportional volume offset. DCD analysis confirms that neocloud unit economics invert
      below approximately 60% GPU utilization—a threshold difficult to maintain during
      demand troughs.
