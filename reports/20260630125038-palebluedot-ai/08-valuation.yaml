  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: >
        ARR composition (marketplace vs. enterprise cluster), gross margin by segment,
        net revenue retention rate, and burn rate. These are the core unit-economic
        metrics needed to underwrite the $1B valuation at Series B.
      whyItMatters: >
        Without ARR quality evidence, it is impossible to distinguish a sticky recurring
        enterprise business from thin-margin transactional brokerage. Gross margin is
        the primary driver of which exit-multiple band applies.
      diligencePath: >
        Obtain data room access via lead investor (B Capital); request CFO presentation
        covering ARR waterfall, segment gross margin, and rolling 12-month NRR; validate
        against signed enterprise contracts reviewed by independent counsel.
      relatedQuestionRefs: [QV008, QV023]

    - type: private-evidence-only
      severity: blocking
      topic: cap-table-preference
      missingEvidence: >
        Series A and Series B preference multiplier, participation rights, anti-dilution
        provisions, and any pay-to-play requirements; certified capitalization table.
      whyItMatters: >
        Preference overhang directly affects downside protection for new investors and
        determines the effective cost basis and return profile across all scenarios.
      diligencePath: >
        Cap table review via legal counsel under NDA; verify from company secretary
        or registered agent; cross-check against term sheets if accessible.
      relatedQuestionRefs: [QV020]

    - type: private-evidence-only
      severity: material
      topic: revenue-growth-trajectory
      missingEvidence: >
        Post-Series B revenue data (Jan–Jun 2026); ARR milestone from B Capital
        board reporting; quarterly or monthly cohort growth data.
      whyItMatters: >
        Determines whether the 10× growth trajectory continued past the Series B and
        informs whether the $25M ARR revisit threshold is on track for 2026 or 2027.
      diligencePath: >
        Monitor public press releases and job postings as growth proxies; seek B Capital
        portfolio update at LP events; request revenue trajectory confirmation from CFO.
      relatedQuestionRefs: [QV016, QV030]

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >
        Top-10 customer revenue concentration, enterprise contract duration and renewal
        rate, and percentage of ARR from APAC versus North American customers.
