callouts:
  - calloutType: risk
    title: GPU Price Commoditization Erodes Marketplace Revenue
    body: >
      H100 rental rates have fallen approximately 64% from their 2024 peak to ~$1.40–3.50/hr
      in 2026, with spot pricing dipping below $1.25/hr on competitive platforms. As the primary
      revenue driver in the marketplace segment is a percentage take rate on transaction value,
      falling GPU prices directly compress marketplace revenue per GPU-hour unless volume grows
      faster than price declines. CoreWeave's Q1 2026 revenue miss and the neocloud sector's
      broadly normalizing margins validate this risk as systemic, not company-specific.
    claimRefs: [CI019, CI028, CI027, CI029]

  - calloutType: assumption
    title: Valuation Implies Option Value, Not Current Earnings
    body: >
      A >$1B post-money valuation against approximately $2.1M in estimated annual revenue
      implies a revenue multiple of approximately 200–475×. This is not an anomaly in the
      2026 neocloud venture market, but it reflects growth-option pricing: the thesis depends
      on scaling revenue 10–20× over the next 2–3 years, maintaining margins as GPU prices
      normalize, and defending market share against CoreWeave and hyperscaler competition.
      Any underwriting model must stress-test these assumptions explicitly.
    claimRefs: [CI002, CI006, CI036]

