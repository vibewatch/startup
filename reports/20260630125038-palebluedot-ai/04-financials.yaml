  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-mix
      missingEvidence: >
        Segment-level revenue breakdown (marketplace GMV vs. enterprise cluster ARR) and gross
        margin by segment; PaleBlueDot has not disclosed any financial statements or segment data.
      whyItMatters: >
        Without segment-level data, revenue quality cannot be assessed — the two segments have
        fundamentally different economics (asset-light marketplace vs. capital-intensive clusters).
        An investor cannot underwrite growth without knowing which segment is driving the 10× growth.
      diligencePath: >
        Request segment-level management accounts or financial statements in due diligence;
        specifically ARR, GMV, and gross margin for marketplace vs. enterprise cluster segments.
      relatedQuestionRefs: [QI015]
      relatedTableRefs: [TI005]

    - type: private-evidence-only
      severity: blocking
      topic: customer-concentration
      missingEvidence: >
        Customer count, top-account revenue concentration, and Xiaohongshu entity's share of
        total revenue; no customer-level data has been publicly disclosed.
      whyItMatters: >
        At PaleBlueDot's estimated ~$2.1M revenue scale, a single large customer (such as the
        named Xiaohongshu entity) could represent 30–50%+ of revenue. Customer loss or
        regulatory action (e.g., export control enforcement) would be catastrophic.
      diligencePath: >
        Request customer list with revenue % for top accounts; verify Xiaohongshu entity's share
        and contract terms; assess export control compliance status for Chinese clients.
      relatedQuestionRefs: [QI019]
      relatedTableRefs: [TI005]

    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >
        Verified capital structure including any debt instruments, SPV arrangements, or
        GPU-backed financing; the $300M loan report was neither confirmed nor substantively denied.
      whyItMatters: >
        If a GPU-backed debt facility exists, it would add material debt service obligations
        to the cash flow model and change the risk/return profile of equity investors.
      diligencePath: >
        Request full capitalization table, any existing debt instruments or guarantees, and
        details of any SPV structures; clarify the $300M Bloomberg report with management.
      relatedTableRefs: [TI004, TI005]

    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >
        Actual blended gross margin and segment-level gross margins; sector benchmarks (14–16%)
        are proxies from public competitors and may not reflect PaleBlueDot-specific economics.
      whyItMatters: >
        Gross margin determines the unit economics ceiling and the path to profitability.
        A blended margin below 10% at the current scale would imply a very long and expensive
        path to EBITDA breakeven given the operating leverage of this infrastructure model.
      diligencePath: >
        Request P&L with cost of revenues split by segment; confirm GPU utilization rates and
        committed cluster pipeline as inputs to utilization-driven margin model.

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: >
        Actual monthly cash burn rate and current cash on hand; all burn and runway estimates
        in this chapter are author-derived with low confidence.
      whyItMatters: >
        Without confirmed burn, runway estimates range from 25–50 months — a 2× uncertainty
        band that makes capital adequacy assessment unreliable. If burn is higher than estimated
        (e.g., due to large GPU procurement commitments), the runway could be materially shorter.
      diligencePath: >
        Request audited or management-reviewed balance sheet and income statement;
        confirm post-Series B cash deployment schedule and any committed GPU procurement orders.

    - type: missing-source
      severity: minor
      topic: colocation-terms
      missingEvidence: >
        Terms governing PaleBlueDot's colocation agreements with Digital Realty and Equinix,
        including contract duration, power commitment, pricing, and exit provisions.
      whyItMatters: >
        Colocation cost structure directly affects enterprise cluster margins; fixed
        commitments with colocation partners create operating leverage and downside risk
        if cluster utilization drops below committed power levels.
      diligencePath: >
        Request copies of colocation agreements or term sheets; confirm committed power
        levels, minimum commitments, and pricing relative to GPU revenue.
      relatedQuestionRefs: [QI027]
