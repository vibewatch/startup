callouts:
  - calloutType: insight
    title: Market Sizing Requires Scope Alignment
    body: >
      Published 2026 estimates span $35B (neocloud specialist) to $170B (broad cloud AI),
      a 4x spread. The appropriate reference for PaleBlueDot AI's addressable market is the
      Mordor Intelligence neocloud definition ($35.22B, 46% CAGR)—not the broadest TAM.
      Citing the $170B figure without boundary disclosure would materially overstate the
      directly addressable opportunity.
    claimRefs: [CM010, CM041]

  - calloutType: risk
    title: Inference Cost Deflation and Custom Silicon Threaten GPU-Only Neocloud Economics
    body: >
      H100 cloud rental rates fell 64–75% in 14 months even as demand grew. Proven
      large-scale TPU migrations (Midjourney: 65% cost reduction; Anthropic: $1M+
      TPU contract) signal that the GPU monopoly for inference is cracking. GPU cloud
      providers face a structural margin squeeze: growing utilization volumes do not
      automatically offset falling revenue per GPU-hour if pricing erodes faster than
      volume grows.
    claimRefs: [CM013, CM028, CM029, CM042]

  - calloutType: strength
    title: APAC Export-Control and Sovereign AI Tailwinds Are Structural and Policy-Backed
    body: >
      U.S. export controls now cover Chinese-owned subsidiaries outside China (May 2026
      tightening), creating durable demand for U.S.-allied neocloud providers in Japan,
      Korea, and Southeast Asia. This structural demand is reinforced by sovereign AI
      mandates across all three markets—Japan ($135B committed investment), Korea ($30B
      capex pipeline), SEA ($30B by 2030)—and is not dependent on any single deal cycle.
    claimRefs: [CM024, CM025, CM031, CM033, CM035]

