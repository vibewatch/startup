              购买将部署在 Tokyo 的 Nvidia 芯片。PaleBlueDot 公开反驳称报道「事实不准确」，但没有进一步说明。如果这类债务安排存在，或日后披露，将实质改变资本结构分析，并给现金流模型增加偿债风险。
