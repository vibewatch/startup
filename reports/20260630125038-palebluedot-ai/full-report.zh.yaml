              Series B 资金主要指定用于 NVIDIA GPU 硬件采购、托管机房基础设施、平台工程和全球销售扩张。一个中等规模 GPU 集群部署（1,000 块 GPU）仅硬件就需 $25M–$40M，外加约
              2–3× 的基础设施建设支出；如果多个区域部署推进，$150M 融资可能在 24–36 个月内被消耗。对于一家 50+ 人的工程与运营公司，且正在主动采购 GPU，月度现金消耗估计为 $3M–6M；这意味着从
              Series B 交割起粗略资金续航期为 25–50 个月，具体取决于收入爬坡和资本开支节奏。这些仅为估算；公司没有披露已确认的烧钱速度或现金余额。


