      - number: '8.2'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot 的投资论点建立在五根支柱上。第一，全球 AI 算力市场正快速扩张——行业估计 GPU 云 TAM 到 2028 年将超过
              $100B——提供庞大且增长中的需求池。第二，PaleBlueDot 已展示 10×
              同比收入增长，说明存在真实企业牵引，即便绝对收入基数仍小。第三，其在日本、韩国和新加坡的亚太地理定位，为其提供了接触亚洲企业客户的差异化路径，这是以美国为中心的新云厂商不天然具备的能力，也包括适合国际芯片接入的法律实体结构。第四，B
              Capital 领投本轮，带来战略可信度以及亚太企业网络分发资源。第五，新兴软件层（AI Cloud Agent、TokenRouter）在架构上有潜力提升抽佣率，并在硬件套利基线之上创造切换成本。


              反向论点同样有力。GPU 租赁价格较 2023–2024 年峰值下跌 70–80%，压缩了市场模型依赖的经济价差。Kerrisdale Capital 2025 年 9 月针对 CoreWeave
              的做空报告——CoreWeave 是新云类别的公开市场锚点——称即使行业领导者也是“由债务驱动的 GPU 租赁业务”，回报低于资本成本，并给出 90% 下行目标。McKinsey 在 2026
              年警告，新云厂商作为一个类别缺乏规模经济、可防御 IP 和多元化收入，结构上脆弱。PaleBlueDot 缺少公开披露的财务指标，无法反驳或确认这些担忧。公司 2026 年 1 月的 CEO 任命——与 B
              轮同步——提示管理连续性风险，以及最关键增长阶段的领导层转换。
