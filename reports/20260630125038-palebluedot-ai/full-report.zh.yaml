  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与业务线
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI 通过两条不同且互补的业务线创造收入。第一条是 GPU 市场平台，聚合来自第三方供应商的富余或利用不足的 GPU 容量——数据中心、小型云运营商和独立硬件拥有方——并把分时访问转售给
              AI 初创公司，主要是美国早期公司，每笔交易赚取抽佣价差。第二条是企业专用集群服务，PaleBlueDot 在 Digital Realty、Equinix 及类似合作方运营的托管机房中，设计、部署并管理大规模
              GPU 集群，覆盖北美、日本、韩国和新加坡。


              收入按用量确认：客户为市场平台访问支付每 GPU-hour 费用，或按合同条款（通常为多月期）支付企业集群费用。官方 2026 年 1
              月新闻稿确认，总收入同比增长超过十倍。第三方分析师估算（CompWorth）认为 2026 年年收入约 $2.1M；若员工数为 50+，则每名员工收入约
              $42K——这符合早期增长阶段画像：企业合同正在爬坡，但仍集中在少数锚定客户。


              第三层新兴软件——AI Cloud Agent（Dot-1.1）和 TokenRouter API——自动化 GPU
              部署规划，并把推理流量路由到最优集群。这些组件目前打包在基础设施产品中，而非单独定价，但它们会增加迁移成本，也可能演化为独立利润率贡献者。公司还提供 DeepSeek PBD Access API
              集成，显示其在投资开发者生态。
