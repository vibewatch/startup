      - number: '8.5'
        title: 投资逻辑失效触发点、退出准备度和最终建议
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot
              尽调最重要的一项解锁，是披露年经常性收入（ARR）构成（算力市场与企业集群）、分部毛利率和净留存率（NRR）。没有这些指标，投资人无法判断它是高价值的经常性企业业务，还是低毛利的交易撮合商。2026 年 7–8
              月与 B Capital 投后管理团队和 PaleBlueDot CFO 的跟进电话，应在任何接近 B 轮价格的承诺前聚焦这些指标。


              投资逻辑失效触发点分三类：财务上，ARR 停止增长或 NRR 跌破 80%，说明企业锚定客户在流失；竞争上，AWS 或 Azure 推出针对 APAC AI 集群、价格低于 PaleBlueDot
              的产品；监管上，BISS 2026 下美国出口管制收紧，限制 GPU 向 APAC 数据中心供给。CNBC 和 Al Jazeera 2026 年 5–6 月关于美国采取措施阻止 NVIDIA
              芯片运往中国境外中资公司的报道，构成一项活跃监管风险；行业估值尚未计入。


              退出准备度有限。PaleBlueDot 运营历史只有两年，未公开财务披露，也尚未披露 IPO 意向。Lambda Labs 的收入是 PaleBlueDot 的 3–4×，运营历史多四年，也只是把 2026
              年下半年 IPO 作为 neocloud 类别的早期候选。到 2028 年，PaleBlueDot 最可能的退出路径是：（1）被希望在 APAC 扩张 AI 计算服务的数据中心运营商（如 Digital
              Realty、Equinix）战略收购；（2）被进入 APAC 托管推理市场的超大规模云厂商收购；或（3）完成 C/D 轮成长融资，延长现金跑道，最终在 2029–2030 年
              IPO。并购情景价值受战略买方协同上限约束，而非公开市场倍数。


              最终建议：观察。PaleBlueDot 所在市场庞大且增长，已有真实的超高速增长信号、经验丰富的投资人背书和差异化 APAC 地理位置。但 $1B 的 B 轮价格要求极强执行才能产生正回报，neocloud
              行业单位经济承受结构性压力，关键私有财务指标仍未披露。投资人应观察下一里程碑事件——C 轮或 ARR 披露高于 $25M——再投入资本。
            claimRefs:
              - CV034
              - CV043
              - CV044
