      - number: '1.3'
        title: 资本结构与利益相关方地图
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI 于 2026 年 1 月 28 日宣布完成 $150M Series B 融资，公司估值超过 $1B，跻身独角兽。该轮由 B Capital 领投；B Capital 总部位于
              San Francisco 和 Singapore，公司新闻稿称交易当时其管理资产超过 $9B；到 2026 年 6 月，B Capital 自有网站列出的 AUM 超过 $12B，说明 $9B 是某一时点披露。


              这轮融资之前，公司经历了一年显著增长，PaleBlueDot AI 称收入增长超过 10 倍，动力来自企业对可扩展、成本有效的 AI
              算力需求。公司披露，新资金将主要用于强化核心技术能力、投入平台工程和技术人才、增强全栈多租户云架构、加速 AI Cloud Agent 产品，并扩展市场拓展能力和全球运营。


              截至 2026 年 6 月，可用来源未公开披露 Series A 融资金额和投资人。任务简报提到前一轮约 $10M，但当前来源集中尚无法通过公开可访问来源独立佐证，因此将其视为证据缺口。SEC EDGAR
              Form D 搜索未返回匹配 PaleBlueDot AI 的备案；这与豁免私募可能使用名称变体备案、或尚未被索引的情形一致。


              Series B 中除 B Capital 之外的共同投资人未公开点名。公司基础设施合作方 Digital Realty 提供主要托管机房；SiliconAngle 的分析将中国社交媒体平台
              Xiaohongshu（又称 RedNote）列为客户，该信息归因于 Reuters。PR 传播渠道 FGS Global 也为尽调外联提供了额外利益相关方触点。
