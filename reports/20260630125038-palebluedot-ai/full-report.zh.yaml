              租赁费率（$1.40–$3.61/hr）下造成现金流压力。私募信贷 GPU 债务市场分析显示，按 2023 年峰值经济性锁定的 GPU
              租赁义务，如今与当前市场费率结构性错配，一些运营商正面临契约违约和抵押品价值不足。没有完整资本结构披露，股权承销无法准确测算有效稀释、债务服务和存在风险的企业价值。
