    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI, Inc. 是一家总部位于加州 Palo Alto 的 Silicon Valley AI 算力平台公司。公司成立于 2024 年，采用双服务模式，同时服务需要可扩展 GPU
              算力的初创公司和企业客户。其核心产品 Token Factory 是一个市场平台，客户可通过它获取按需和预留 GPU
              集群。第二条业务线是托管专用集群，面向基础设施需求更复杂的机构：大规模部署、预留容量，或在全球网络中灵活获取 GPU。2026 年 4 月，PaleBlueDot AI 发布 PBD
              TokenRouter，把平台延伸到 AI 模型 API 分发；这是一个统一 API 层，覆盖 300 多个前沿模型，具备 Smart Token Routing、Multi-Channel Automatic
              Failover 和 Real-Time Cost Governance 等能力。


              公司材料公开陈述、且多份新闻稿相互印证的使命，是「让智能普惠可及」。更大的愿景表述为「让 AI 无处不在，服务每个人」。公司名称来自 1990 年 Voyager 太空任务拍下的地球影像，Carl Sagan
              称其为「一颗暗淡蓝点」；品牌叙事明确把这张影像与 AI 为全人类带来变革的潜力相连。这个命名并非偶然——它同时出现在投资人新闻材料和公司 About 页面描述中，与技术算力使命一起构成公司公开定位。


              法律实体是 PaleBlueDot AI, Inc.，披露于公司网站页脚。公司网站为 palebluedot.ai，是一个 JavaScript
              外壳的单页应用；官方新闻中心文本嵌在编译后的页面包中，而不是直接可访问的 HTML。投资人与媒体关系的主要联系人通过金融传播公司 FGS Global 的 fgsglobal.com 路由；FGS Global
              是 Series B 新闻稿披露的联系方。
