        - H100 小时费率跌破 $1.00/hr（2026 年 6 月约 $1.40–$1.50）
        - 压缩市场平台抽佣收入；企业集群毛利率在利用率 <60% 时跌破盈亏平衡
        - 重新承销单位经济模型；评估企业集群积压期限以确定毛利率底线
      - - 超大云厂商推出 APAC 基础设施
        - AWS 或 Azure 宣布专用 APAC AI 推理集群，价格低于 PaleBlueDot 报价表
        - 核心差异化市场的溢价能力消失；企业客户流失风险上升
        - 触发逐合同复盘；寻求直接客户忠诚度证据和续约率
      - - BISS / 美国出口管制收紧
        - 美国新规则限制 NVIDIA GPU 发往 PaleBlueDot 的 APAC 托管机房
        - 阻断日本 / 韩国 / 新加坡新增集群容量；约束 APAC 企业增长引擎
        - 立即核验监管敞口；评估哪些客户受影响，以及多少 ARR 暴露在风险中
      - - CEO / 领导层离职
        - Stephen Watts 或另一名高管在上任 12 个月内离职
        - 关键增长阶段执行风险上升；释放文化或战略不稳信号
        - 开展管理层背景访谈；索取董事会和股权结构投资人的承诺
    notes: |
      触发项基于公开证据和行业基准。阈值是作者从可比新云分析推导的估计；PaleBlueDot 未披露具体内部运营阈值。
    claimRefs:
      - CV031
      - CV032
      - CV034
      - CV041
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 构成与质量
        - 市场平台 ARR 与企业集群 ARR 拆分；前 10 大客户收入集中度；合同期限
        - 判断收入是黏性的经常性收入（企业）还是交易型收入（市场平台）；集中度风险影响 NRR 和下行情形
        - 请求 CFO 数据室访问；由独立会计师或法律顾问审查客户合同并验证
      - - 分部门毛利率
        - 市场平台毛利率（抽佣与成本）和企业集群毛利率（硬件摊销、托管机房、电力、网络）
        - 没有毛利率数据，就无法评估单位经济模型、盈利路径或增长资本强度
        - CFO 数据室；与 GPU 硬件成本基准交叉核对（NVIDIA 定价、托管机房电价）
      - - 优先权堆栈与反稀释
        - Series A 和 Series B 优先权倍数、参与权、反稀释条款和跟投保权要求
        - 优先权悬顶决定新投资人的下行保护，也决定困境情形下创始人与 VC 的成本基础
        - 法律顾问审查股权结构；向公司秘书索取经认证的资本结构表
      - - APAC 监管合规
        - APAC 设施的牌照状态、数据驻留认证、出口管制合规计划和 NVIDIA 芯片分配文件
        - BISS 2026 和出口收紧给 APAC GPU 集群运营带来现实法律风险，可能冻结新部署
        - 法律审查出口文件；核验每个 APAC 托管机房站点的 NVIDIA 授权
      - - 净收入留存（NRR）与流失
        - 企业集群过去 4 个季度 NRR；市场平台客户流失和队列分析
        - 企业部门 NRR 低于 100% 会释放客户不满意信号，并削弱平台黏性假设
        - 数据室；至少取得前 3 大企业客户签署的参考证明，确认续约意向
    notes: |
      尽调路径假设标准 Series B 阶段流程。部分事项（优先权堆栈、股权结构表）需在 NDA 下由法律审查。监管合规事项需要出口管制专门律师。公开来源无法解决这些缺口。
    claimRefs:
      - CV010
      - CV027
      - CV033
