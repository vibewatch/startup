      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              AI GPU 云市场包含多个清晰买方分层，边界由工作负载成熟度、规模、合规要求和预算归属决定。在早期一端，AI 开发者初创公司需要灵活的按需 GPU，用于实验、模型微调和早期生产 API。对这些团队来说，前两年
              GPU 算力通常吃掉技术预算的 40–60%；原型阶段月支出为 $2,000–$8,000，进入生产阶段后升至每月 $10,000–$30,000。CTO 或首席 ML
              工程师既是用户也是技术决策者；付款方是由风险资本支持的初创公司运营预算。按需和现货定价更受欢迎，供应商黏性较低。


              中端企业（通常为 Series C 阶段公司，或收入 $50M–$500M 的公司）是过渡型客群，需要更大集群，但仍保留接近初创公司的速度要求。大型企业和受监管机构——银行、医疗公司、国家 AI
              实验室——需要专用、合规的 GPU 集群，带有数据驻留保证、SLA 支持的可用性，以及 IT、安全和法务共同签批的采购流程。预算归属转向 CTO 加 IT
              采购，付款方是通过采购周期管理的资本或运营预算。按收入计，大型企业在 2025 年占新型 GPU 云市场的 70.15%；SME 预计到 2031 年将以 48.83% CAGR 增长。


              PaleBlueDot AI 运营两条不同业务线：GPU 市场平台，从第三方向早期 AI 初创公司（主要在美国）撮合闲置容量；以及在 Digital Realty 和 Equinix
              运营的托管机房中为企业设计专用集群。公司披露企业客户集中在日本、韩国和新加坡，并计划继续向东南亚扩张。一个值得注意的买方子群体，是中国科技公司海外实体，它们通过位于中国境外的数据中心合法获取 NVIDIA GPU
              硬件——PaleBlueDot AI 已披露服务 Xiaohongshu 的海外实体客户，说明美国出口管制创造了结构性需求。标准市场分层框架并未捕捉这种买方类型。
