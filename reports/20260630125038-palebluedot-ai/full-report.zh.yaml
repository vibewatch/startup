      - number: '3.4'
        title: 迁移成本、锁定与多云部署
        blocks:
          - type: paragraph
            body: >-
              GPU 云迁移成本主要由三部分构成。第一是技术迁移成本，来自 GPU 软件栈差异——NVIDIA CUDA 代码不经过移植或 TensorWave 的 SCALE 工具链等兼容层，无法原生运行在 AMD ROCm
              上；而专有集群管理 API（CoreWeave 的 SUNK、AWS SageMaker、Azure ML）会制造工作流依赖。第二是财务迁移成本，来自预留实例承诺和照付不议合同：CoreWeave
              的锚定客户持有多年协议，提前终止或未使用都会产生经济惩罚。第三是数据出站成本，它持续增加多云部署摩擦；超大云厂商按 $0.09–$0.12/GB 收取出站费，多数新型 GPU
              云服务商将其计入基础费率或收费更低，但训练数据和模型检查点体量会让跨服务商数据移动变得昂贵。借助 Kubernetes 和 Ray 等抽象服务商 API 的编排层，多云部署在技术上可行；AI
              原生公司也越来越采用混合策略——把基线工作负载放在已承诺的 新型 GPU
              云集群上，高峰需求再弹性转向现货市场或超大云厂商。不过，跨服务商维持并行编排、存储复制和安全态势，需要很大的工程开销，小团队和早期初创公司很少投入。PaleBlueDot 的市场平台模式把多个 GPU
              来源聚合到单一 API 背后，降低了客户维护直接服务商关系的需要——这是裸金属新型 GPU 云服务商不具备的真实迁移成本降低功能。
            claimRefs:
              - CP041
              - CP042
              - CP050
      - number: '3.5'
        title: 护城河耐久性、商品化风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot 的竞争护城河至少受到五类结构性风险挤压。第一，GPU 商品风险：H100 价格从 2023 年发布时的 $8–12/GPU-hour 下跌 64%，到 2025 年中触及
              $1.70/GPU-hour 低点，随后随着推理需求激增，到 2026 年 3 月反弹 40% 至
              $2.35/GPU-hour——这说明市场平台定价波动大，利润率对供需周期敏感。第二，规模不对称：CoreWeave $99.4B 在手订单和 $31–35B 的 2026 年资本开支承诺，远超
              PaleBlueDot $160M 的累计融资，形成争夺多 GW 锚定企业客户的结构性壁垒。第三，超大云厂商价格进攻：AWS 2025 年 6 月将 H100 降价 44%，说明超大云厂商会用价格守住 GPU
              工作负载，压缩新型 GPU 云定价优势。第四，NVIDIA 供应集中：Nvidia 于 2026 年 1 月作为 5+ GW AI 工厂合作的一部分向 CoreWeave 投资 $2B 股权，深化
              CoreWeave 的供应优先级，也抬高同行拿到同等硬件资源的成本。第五，Kerrisdale Capital 于 2025 年 9 月发布做空报告，将 CoreWeave——并延伸到新型 GPU
              云行业——描述为「无差异、重杠杆的 GPU 租赁方案」，没有持久护城河，并指出 CoreWeave 极端客户集中（2025 年 Microsoft 占 67%）是最大单一信用风险。PaleBlueDot
