      - - 客户集中度 / Xiaohongshu
        - Xiaohongshu 收入占总 ARR 的比例
        - 任何单一客户收入占比 >30%，且无缓释计划
        - 提高尽调优先级；将客户多元化作为融资条件推动
      - - GPU 毛利压缩
        - H100 现货价格指数（Spheron、Vast.ai 公开价格）；PBD 披露的抽佣率或毛利率
