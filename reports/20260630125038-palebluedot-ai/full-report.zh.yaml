      - number: '1.4'
        title: 里程碑、负面背景与规模信号
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI 的公开时间线从 2024 年成立开始，随后经历了增长、领导层、融资、产品和争议等一系列重要事件。公司在 Silicon Valley 起步时，市场正极度渴求超大云厂商之外的新型
              GPU 云替代方案；SiliconAngle 将它与 CoreWeave、Lightning AI、Lambda Labs 并列，视为专业灵活 GPU 基础设施服务商，服务对象包括 AI
              原生初创公司，以及需要主要云厂商之外算力的企业。


              2025 年 12 月出现一项实质负面事件：Data Center Dynamics 报道称，PaleBlueDot AI 据称寻求一笔 $300M 贷款，用于购买供
              Xiaohongshu（RedNote）使用的 Nvidia 芯片。PaleBlueDot AI 回应称报道主张「事实不准确」，但没有进一步说明。公司的否认并未厘清底层事实；后续报道（SiliconAngle 引
              Reuters）确认 Xiaohongshu 是客户，但双方关系的具体性质以及是否存在贷款安排仍未证实。这一事件对尽调很重要，因为它提出了地理客户集中（中国关联平台）、Nvidia
              芯片采购风险，以及负面报道出现时沟通透明度等问题。


              平台规模层面，PaleBlueDot AI 网站截至运行日声称拥有 130 个 GPU 集群、接入 200,000 块 GPU、覆盖 50 个区域、拥有 20 家供应合作伙伴。基础设施已通过 ISO/IEC
              27001 认证，并通过与 Digital Realty 的托管机房关系获得 SOC 2 和 SOC 3 报告支持。GPU 产品目录覆盖最新 Nvidia
              世代：GB300、B300、GB200、B200、H200 和 H100。公司于 2026 年 4 月在 tokenrouter.com 发布 PBD TokenRouter，覆盖 300 多个模型，并包含
              Premium Token Credit Program，每月向 100 名开发者和企业发放免费推理额度。
