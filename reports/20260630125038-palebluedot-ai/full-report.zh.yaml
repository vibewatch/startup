  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险图谱
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot AI 最严重、最有时效性的风险，来自美国先进 AI 芯片出口管制制度的快速变化。2026 年 1 月 15 日，BIS 修订了对部分半导体（NVIDIA H200、AMD
              MI325X）出口至中国和澳门的许可证审查政策，从推定拒绝转为逐案审查——但只有在满足严格认证时才适用：美国供应充足、中国 / 澳门出货占比上限 50%、无被禁止终端用户、严格
              KYC，以及独立美国第三方测试。更关键的是，2026 年 5 月 31 日，BIS
              发布指引，堵住“第三国漏洞”：只要某实体的最终母公司总部位于中国或澳门，无论该实体在日本、新加坡或其他地方运营，都适用出口许可证要求。这直接牵涉 PBD 据称与中国社交媒体平台 Xiaohongshu
              (RedNote) 的合作。多个可信来源在 2025 年底报道称，PBD 正探索一笔 $300M 贷款，用于购买 Nvidia 芯片，并部署在 Tokyo 数据中心，最终用户为 Xiaohongshu。PBD
              称该报道“事实不准确”，但没有详细说明；据称受聘准备贷款人材料的 JPMorgan 退出了该交易。全球金融机构至少九名银行家私下表达了对美国监管审查这类交易的担忧。Xiaohongshu
              关系是否仍存在，以及是否有任何芯片按出口管制分类被采购，都是阻断性尽调缺口。


              EU AI Act 义务进一步加重了监管画像。Annex III 下的高风险 AI 系统义务原定于 2026 年 8 月 2 日生效（根据 2026 年 5 月达成、仍待 trilogue 批准的 AI
              Omnibus 政治协议，可能推迟至 2027 年 12 月）。PBD 的 TokenRouter API 分发 300+ 个前沿 AI 模型，可能在该法案下被认定为 GPAI
              供应商或部署方，触发透明度、合格评定和 AI Office 报告义务。违规罚款最高可达 €35M 或全球年营业额的 7%，高于 GDPR。TokenRouter 模型分发层横跨 IP
              和隐私责任（GDPR、CCPA、训练数据版权、输出赔偿），增加额外法律暴露；这类风险对 AI API 市场运营商很常见，但对于聚合数百个第三方模型的小规模平台尤其尖锐。
