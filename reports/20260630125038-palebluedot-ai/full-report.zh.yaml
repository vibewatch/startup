          label: 积分计划 / 免费试用 — 每月 100
        - id: marketplace
          label: Token Factory 付费使用 — 创业公司与开发者客群
        - id: evaluation
          label: 企业集群评估 — 托管机房 RFQ
        - id: deployment
          label: 企业合同签约 — 多月期专用集群
        - id: renewal
          label: 续约与扩张 — 合同扩容和 API 追加销售
      edges:
        - from: awareness
          to: credit-trial
          label: 发现
        - from: credit-trial
          to: marketplace
          label: 试用转付费
        - from: marketplace
          to: evaluation
          label: 升级
        - from: evaluation
          to: deployment
          label: 签约
        - from: deployment
          to: renewal
          label: 续约
    approximationNotes: 只有积分计划阶段披露了规模（每月 100）。其他阶段均为基于产品设计和媒体报道的定性刻画；PaleBlueDot AI 未公开漏斗转化率数据。
    claimRefs:
      - CU012
      - CU013
      - CU023
      - CU036
  - id: FU003
    title: 客户验证矩阵 — 各客群的证据质量与部署成熟度
    type: matrix
    layout: standard
    summary: 从四个尽调维度评估 PaleBlueDot AI 披露的四类客户；显示经佐证的证据只存在于 Xiaohongshu 关系和未具名亚太企业账户，所有客群都缺少留存可见度。
    data:
      columns:
        - 证据质量
        - 成果具体性
        - 留存可见度
        - 生产成熟度
      rows:
        - label: Xiaohongshu（RedNote 海外实体）
          values:
            - 高 — Reuters 点名；SiliconAngle 和 TechStartups 佐证
            - 未披露
            - 未披露
            - 生产 — 推断为东京数据中心部署
        - label: 未具名亚太企业账户
          values:
            - 高 — Reuters 和 SiliconAngle 确认存在多个账户
            - 未披露
            - 暗示多月期合同
            - 暗示生产使用 — Reuters 称客户基础强
        - label: Token Factory 创业公司与开发者客群
          values:
            - 中 — ClusterMax 第三方评测；F6S 列表确认部署
            - 市场可用；没有收入或用量指标
            - 未披露
            - 生产 — ClusterMax 确认市场已上线
        - label: TokenRouter 积分计划队列
          values:
            - 低 — 仅公司声称；无独立验证
            - 未披露
            - 未披露
            - 试点和早期采用 — 计划于 2026 年 4 月启动
    approximationNotes: >-
      证据质量评级是基于来源独立性和佐证数量的定性判断。留存可见度只反映已披露指标；缺少数据并不意味着流失。行顺序与 TU003 一致：Xiaohongshu 海外实体、未具名亚太企业账户、Token Factory
      创业公司客群、TokenRouter 积分队列。
    claimRefs:
      - CU031
      - CU032
      - CU035
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 二维热力图按照评估后的发生可能性（行）和影响严重度（列）定位 PBD 的主要风险领域，截至 2026 年 6 月；剩余严重度反映缓释成熟度。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 极高可能性
          values:
            - null
            - GPU 利润率压缩
            - 客户集中风险
            - 出口管制 / BIS 违规
        - label: 高可能性
          values:
            - 轻微运营事故
            - EU AI Act / GDPR 不合规
            - 托管机房基础设施中断
            - 资本结构 / 债务敞口
        - label: 中等可能性
          values:
            - IP 侵权索赔
            - 团队 / 创始人不透明
            - 东西向 GPU 安全入侵
            - GPU 供给冲击（Blackwell 交期）
        - label: 低可能性
          values:
            - null
            - CEO 交接风险
            - 债务再融资失败
            - null
        - label: 极低可能性
          values:
            - null
            - null
            - 地缘政治导致停摆（APAC）
            - null
    approximationNotes: 可能性和影响是基于截至 2026-06-30 公开证据的定性分析判断；未使用专有概率模型。
    claimRefs:
      - CR001
      - CR005
      - CR013
      - CR016
      - CR024
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 有向无环图展示 PBD 的主要风险如何沿业务链条传导，影响收入、资本结构和投资论点。
    data:
      nodes:
        - id: export-ctrl
          label: BIS 出口管制违规
        - id: customer-loss
          label: Xiaohongshu / 锚定客户流失
        - id: gpu-supply-shock
          label: GPU 供给冲击（Blackwell）
        - id: margin-compress
          label: GPU 抽成率 / 利润率压缩
        - id: colo-outage
          label: 托管机房基础设施中断
        - id: security-breach
          label: 东西向 GPU 安全入侵
        - id: debt-stress
          label: GPU 抵押债务 / 再融资墙
        - id: rev-decline
          label: 收入下滑
        - id: ops-disruption
          label: 运营中断
        - id: capital-stress
          label: 资本结构承压
        - id: valuation-impact
          label: 投资论点 / 估值影响
        - id: financing-unavail
          label: 融资不可得
      edges:
        - from: export-ctrl
          to: customer-loss
          label: 许可证拒发 / 执法
        - from: export-ctrl
          to: financing-unavail
          label: 贷款方监管风险
        - from: customer-loss
          to: rev-decline
          label: 锚定收入流失
        - from: gpu-supply-shock
          to: ops-disruption
          label: 产能缺口
        - from: gpu-supply-shock
          to: margin-compress
          label: 资本开支激增
        - from: margin-compress
          to: capital-stress
          label: FCF 覆盖下降
        - from: rev-decline
          to: capital-stress
          label: 烧钱加速
        - from: capital-stress
          to: valuation-impact
          label: 下轮降估值风险
        - from: ops-disruption
          to: rev-decline
          label: SLA 违约 / 流失
        - from: security-breach
          to: ops-disruption
          label: 集群失陷
        - from: colo-outage
          to: ops-disruption
          label: 服务不可用
        - from: financing-unavail
          to: capital-stress
          label: 流动性约束
        - from: debt-stress
          to: capital-stress
          label: 再融资失败
    approximationNotes: DAG 边表示基于证据的合理传导路径；并非所有风险都会在所有情景下级联。未分配概率。
    claimRefs:
      - CR005
      - CR013
      - CR016
      - CR019
      - CR022
      - CR027
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 有向图梳理 PaleBlueDot AI 的关键外部依赖——GPU 硬件、封装、托管机房、资本和客户集中——以及它们之间的关系。
    data:
      nodes:
        - id: pbd
          label: PaleBlueDot AI
        - id: nvidia
          label: NVIDIA（GPU 机群，>80%）
        - id: tsmc
          label: TSMC CoWoS（封装瓶颈）
        - id: digirealty
          label: Digital Realty（主托管机房）
        - id: equinix
          label: Equinix（次级托管机房）
        - id: bcapital
          label: B Capital（Series B 领投）
        - id: xiaohongshu
          label: Xiaohongshu / RedNote（锚定客户）
        - id: jpmorgan
          label: JPMorgan（债务融资顾问）
        - id: privatecredit
          label: 私募信贷贷款方（据报 $300M）
        - id: bis
          label: BIS / 美国商务部（监管关口）
      edges:
        - from: pbd
          to: nvidia
          label: GPU 硬件采购
        - from: nvidia
          to: tsmc
          label: CoWoS 封装依赖
        - from: pbd
          to: digirealty
          label: 主托管机房（APAC + NA）
        - from: pbd
          to: equinix
          label: 次级托管机房
        - from: pbd
          to: bcapital
          label: Series B 股权（$150M）
        - from: pbd
          to: xiaohongshu
          label: 据报锚定客户
        - from: pbd
          to: jpmorgan
          label: 据报债务顾问
        - from: jpmorgan
          to: privatecredit
          label: 贷款方营销（据报）
        - from: pbd
          to: privatecredit
          label: 据报 $300M 贷款额度
        - from: bis
          to: nvidia
          label: 出口管制（ECCN 3A090.a）
        - from: bis
          to: pbd
          label: 出口许可证要求
        - from: bis
          to: xiaohongshu
          label: 中国母公司规则
    approximationNotes: 依赖关系由公开披露和报道推断；Xiaohongshu 和 $300M 债务融资关系已有报道，但 PBD 未确认。边权未量化。
    claimRefs:
      - CR005
      - CR013
      - CR032
      - CR033
      - CR035
  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: |
      从市场规模和增长信号，经过风险因素和估值纪律，推导出继续跟踪建议。
    data:
      nodes:
        - id: n1
          label: 大 TAM（$100B+ AI 计算）
        - id: n2
          label: 已验证收入同比增长 10×
        - id: n3
          label: APAC 地理差异化
        - id: n4
          label: 估值：50–475× EV/Revenue（偏高）
        - id: n5
          label: 未披露利润率、ARR、NRR
        - id: n6
          label: GPU 商品化 + 超大规模云厂商压力
        - id: n7
          label: 正向信号 — 仅有期权价值
        - id: n8
          label: 重大执行与证据缺口
        - id: n9
          label: 建议：继续跟踪
    approximationNotes: 节点流是示意性表达；箭头表示逻辑依赖，不代表概率权重。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV031
      - CV036
  - id: FV002
    title: 估值对收入假设的敏感性
    type: bar
    layout: standard
    summary: |
      在不同 PaleBlueDot 收入假设下，以 15–25× 远期 EV/Revenue 推导隐含公允价值区间，并与 $1B+ Series B 入场价对比。
    data:
      items:
        - label: $5M 收入 @ 15×
          value: 75
        - label: $10M 收入 @ 15×
          value: 150
        - label: $20M 收入 @ 20×
          value: 400
        - label: $40M 收入 @ 20×
          value: 800
        - label: $67M 收入 @ 15×
          value: 1005
    approximationNotes: |
      由于公司未披露 ARR，收入假设为估计。$67M @ 15× 这一行代表用可比倍数低端支撑 $1B 估值所需的最低收入。所有数值单位为百万美元。
    claimRefs:
      - CV008
      - CV009
      - CV023
      - CV024
  - id: FV003
    title: 各情景的估值与回报区间
    type: range
    layout: standard
    summary: |
      相对 $1B+ Series B 入场价，展示每个情景（牛 / 基准 / 熊）的低到高退出估值区间，未计稀释。
    data:
      items:
        - label: 熊情景（GPU 崩塌 / 监管阻断）
          low: 50
          high: 150
        - label: 基准情景（温和增长，利润率压缩）
          low: 240
          high: 720
        - label: 牛情景（超高速增长，软件货币化）
          low: 1500
          high: 2500
        - label: Series B 入场价（参考）
          low: 1000
          high: 1200
    approximationNotes: |
      所有数值单位为百万美元（退出时隐含企业价值）。入场价区间按报道的「>$1B」处理，假设为 $1.0–$1.2B。退出价值是作者基于可比 EV/Revenue 倍数的估计；未计入优先清算权结构或期间稀释。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV045
  - id: FV004
    title: 投资 KPI — IC 可用评分卡
    type: kpi
    layout: standard
    summary: |
      基于截至 2026 年 6 月 30 日的公开证据，对七个投资维度（0–10）打分。评分反映「继续跟踪」建议：市场机会高，但被偏高估值和证据缺口抵消。
    data:
      items:
        - label: 市场机会
          value: 7
        - label: 收入增长验证
          value: 6
        - label: 竞争护城河 / 防御性
          value: 3
        - label: 单位经济 / 利润率
          value: 2
        - label: 风险调整后估值
          value: 2
        - label: 证据质量 / 披露
          value: 3
        - label: 执行团队深度
          value: 5
    approximationNotes: |
      评分由作者基于公开证据给出。若披露毛利率、ARR、NRR 等私有指标，将显著影响单位经济和证据质量得分。评分范围为 0（无证据或同类最差）到 10（同类最佳）。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV026
      - CV031
      - CV036
