      - number: '4.3'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot 两个板块的单位经济差异明显。GPU 市场平台是轻资产模式：PaleBlueDot
              作为中介赚取价差，不拥有硬件。这限制了市场平台板块的资本密集度，但也限制了毛利率——参考可比市场平台模式，估计为交易额的 10–20%。交易量和利用率是主要利润率杠杆；GPU
              租赁费率下降时，单笔交易收入会被压缩。


              企业专用集群板块资本密集度高。单台 8-GPU H100 服务器仅硬件就需 $200K–$320K；一个 1,000-GPU 部署在电力、冷却、网络和机房成本之前，硬件就需
              $25M–$40M，而行业分析（GPUnex / McKinsey 引用数据）估计后者为硬件成本的 2–3×。全行业 GPU 集群运营商毛利率估计为 14–16%；若利用率低于约 60%，毛利率会显著恶化。


              PaleBlueDot 未披露毛利率、CAC、LTV、净收入留存或平均合同额，均为私有信息。公司员工数 50+，估算每员工收入约
              $42K，说明相较工程和基础设施开销，业务尚未达到收入规模。核心尽调问题是：企业集群利润率能否在规模化后达到行业基准，以及市场平台交易量需要多快增长才能吸收固定开销。
