              算力。市场采用竞价机制，让用户按 GPU 型号、地区和部署规模筛选全球云资源，比较价格和空置情况；平台同时支持预留和按需两类集群。面向供应商的 “Offer Compute” 入口允许 GPU
              容量所有者上架库存，形成双边市场。


              第二条产品线是托管式企业集群服务：PaleBlueDot 为企业客户设计、部署并管理大型专用 GPU 集群，通常放在 Digital Realty 和 Equinix
              运营的托管机房内。该业务以亚太企业市场（日本、韩国、新加坡）为主要增长区，也为处理敏感或受监管数据的客户提供私有云部署选项。


              算力底座之上叠加的是 AI 智能层。Dot-1.1 AI Cloud Agent（基于 DeepSeek-R1 训练）协助客户做集群选择、成本优化和容量规划。PBD TokenRouter
              是公司最新、战略意义也最强的产品：一个面向 B2B 的统一 API 网关，把 Kimi、DeepSeek、GLM、MiniMax、Qwen、OpenAI 系列、Claude、Gemini 等 300+ 个前沿
              AI 模型聚合到单一兼容 OpenAI 的集成点。Model Library 支持模型发现和价格比较。AGI Landscape Map 可视化更广泛的 AI 生态。Token Factory 是支撑
