      - number: '5.3'
        title: TokenRouter 与智能层
        blocks:
          - type: paragraph
            body: >
              PBD TokenRouter 于 2026 年 4 月 21 日在 Palo Alto 发布，可通过 tokenrouter.com 访问。平台定位为面向构建者、初创公司和企业的 B2B 统一 AI
              接入层。它把前沿 AI 供应商整合到一个集成点，避免用户为不同供应商分别注册账户、逐个集成，也避免供应商发布新模型或宕机时反复重构。


              平台有四项核心能力：(1) Smart Token Routing——一项专有能力，可分析每个请求并路由到最适合任务的模型，自动优化成本和性能；(2) Multi-Channel Automatic
              Failover——同时维持多个上游供应商与 PBD 自有推理云连接，当任一上游路径降级时仍能实现 99.95% 可用性；(3) Real-Time Cost
              Governance——在成员、团队和部门层级自动执行预算，用程序化支出控制替代人工对账；(4) Smart Caching——智能去重请求并复用结果，在不改应用层的前提下降低不必要的 token 消耗。


              token 经济引擎 Token Factory 支撑 TokenRouter 的定价模型。文档站（tokenrouter.com/docs）发布了 OpenClaw、Codex CLI、Hermes Agent
              等开发者工具的集成指南，其中包括嵌入 PaleBlueDot 平台的 OpenClaw 分步设置指南，指引开发者把 api.tokenrouter.com/v1 作为 API 端点。Premium Token
              Credit Program 每月选择 100 个组织提供免费推理额度，充当开发者采用飞轮；公司计划在该项目下共同赞助全球黑客松和研究合作。


              关键文档资产包括 Privacy Policy、Terms of Use 和 Global Data Processing Agreement，显示公司有意满足 GDPR 合规要求。Dot-1.1
              曾在本地部署成为主流之前提供早期 DeepSeek API 接入（包括 DeepSeek 671B），把 PBD 定位成高需求开源模型的早期接入通道。
