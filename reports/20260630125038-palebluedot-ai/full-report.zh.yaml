      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI 的安全姿态主要锚定在托管机房合作伙伴的认证上。公司的 Security & Compliance 弹窗写道：“在 PaleBlueDot
              AI，安全和信任优先。我们持续强化平台和运营控制，为企业客户提供可验证的保护。” 其主要设施由 Digital Realty 提供，后者持有 ISO/IEC 27001 认证，并发布覆盖物理基础设施和设施运营的
              SOC 2、SOC 3 报告。验证文件可按要求共享，但仅限 NDA 之下——这是新云厂商的标准做法，但在商业关系建立前会增加企业采购摩擦。


              Digital Realty 的高密度托管平台支持单柜最高 150 kW，美国和欧盟资产组合实现 100% 可再生能源覆盖，并提供 99.999% 全球可用性 SLA，为 PBD
              提供强韧的物理基础。面对敏感工作负载，PaleBlueDot 通过集群市场或定制集群请求提供私有云部署选项，让企业客户在利用全球算力网络的同时，保留对 AI 工作负载的完全控制。


              TokenRouter 文档站发布了 Global Data Processing Agreement，显示公司在为欧盟用户符合 GDPR 的数据处理做准备。面向开发者的第三方网关评测提到，prompt 或
              completion 不做数据留存。不过，截至研究日期，PaleBlueDot 自有平台运营（不同于托管机房设施）尚未公开确认拥有独立第一方 SOC 2 或 ISO
              27001；对于有数据驻留或运营安全要求的企业客户，这是重大尽调缺口。
