      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              新型 GPU 云需求的首要增长驱动，是 AI 模型训练向生产级 AI 推理的结构性迁移。到 2026 年初，推理已占 AI GPU 基础设施支出的 55%，高于 2023 年的 33%，并预计到 2030 年达到
              AI 总算力的 75–80%。每花 $1B 训练一个模型，机构在该模型生产生命周期内预计还要承担 $15–20B 累计推理成本——15–20x 的乘数，把一次性训练转化为 GPU 云服务商持续经常性收入流。


              第二个主要驱动因素是超大云厂商容量稀缺。Microsoft、Google、Meta 和 Amazon 合计承诺 2026 年约 $700B AI 基础设施资本开支，但即便如此，需求仍超过可用容量。H100
              SXM5 直接采购交付周期为 36–52 周；截至 2026 年 4 月，B200 GPU 积压订单约 360 万块；TSMC 的 HBM 存储封装产能至少到 2027 年中都已被完全分配。在 AI
              热潮之前就锁定电力协议和托管机房空间的新型 GPU 云服务商，可在 6–18 个月内部署 GPU 容量，而超大云厂商数据中心建设周期为 3–5 年，由此获得系统性速度优势。Microsoft 对新型 GPU
              云合作伙伴作出 $60B 承诺，说明超大云厂商自身也把新型 GPU 云用作溢出容量，验证了新型 GPU 云市场的结构性角色。


              出口管制为非中国 GPU 云服务商创造结构性需求。2026 年 5 月，美国商务部执法要求即便向中国企业在中国境外的子公司销售先进 AI 芯片也必须取得许可，堵上此前漏洞，并加速亚洲 AI
              工作负载转向美国盟友服务商。


              关键约束包括：定制芯片竞争（Anthropic 于 2025 年 10 月承诺使用 100 万颗 Google TPU；Midjourney 报告迁移到 TPU v6e 后推理成本下降
              65%）；超大云厂商集中风险（Microsoft 占 CoreWeave 2024 年总收入的 62%，提示后端商品化经纪风险）；GPU 定价侵蚀（H100 云费率 14 个月内下跌 64–75%）；以及企业
              AI 项目流失（只有 48% 的 AI 项目进入生产部署，对 GPU 利用率构成持续需求侧风险）。能源可得性也成为新约束，东南亚数据中心扩张受到电网容量和化石燃料依赖限制。
