      - number: '8.3'
        title: 可比估值组与行业基准
        blocks:
          - type: paragraph
            body: >
              新云可比组横跨公开股票、后期私募轮次和近期 IPO 公司。CoreWeave (CRWV) 是主要公开市场锚点：其报告 2026 Q1 收入 $2.078B（同比增长 217%），市值约 $52B、企业价值约
              $85B，并指引 2026 年收入 $12–13B。其 TTM EV/Revenue 约 13.7×，反映的是 PaleBlueDot 尚未接近的规模；但其 IPO 倍数（按 2024 年收入约
              12×）对早期入场定价仍有参考价值。Nebius Group (NBIS) 提供最激进的增长可比，2026 Q1 收入 $399M（同比增长 684%），但因拥有 $27B+ 超大规模云厂商锚定合同，P/S 达
              65–76×——这是 PaleBlueDot 缺少的一种收入可见性。


              私营同业中，TensorWave 2026 年 6 月完成 $350M B 轮，投后估值 $1.55B，基于 2026 年收入 $100M，隐含 15.5× EV/Revenue
              倍数；考虑到阶段和轮次规模相近，这是最直接的结构性可比。Crusoe 2025 年 10 月 Series E 轮估值 $10B+，体现的是垂直整合、锁定电力基础设施且有 NVIDIA
              战略背书的溢价；Crusoe 的规模和能源基础设施位置，比 PaleBlueDot 至少领先数个投资周期。Lambda Labs 约 $5.9B Series E 估值，基于约 $760M 年化收入，隐含
              7.7× EV/Revenue，是该组中最保守的私营公司可比；但 Lambda 的估计收入规模是 PaleBlueDot 的 6–8×，且其软件优先型云业务毛利率超过 50%。Finro AI 对 575
              家公司的数据集显示，2026 Q1 AI 基础设施 EV/Revenue 中位数为 21.2×，可作为有用的行业中枢锚点。


              将行业倍数套用到 PaleBlueDot：若假设收入 $20M、远期倍数为 15–25×（可比区间的保守端），公允价值为 $300M–$500M——低于 $1B B 轮价格。要达到 $1B+ 公允价值，需要在
              15–25× 倍数下实现 $40–67M 收入，意味着 PaleBlueDot 必须较估计当前规模增长约 4–7×，B 轮价格才可由收入倍数支撑。这确认当前估值定价的是 2027–2028 年收入状态，而不是
              2026 年状态。
