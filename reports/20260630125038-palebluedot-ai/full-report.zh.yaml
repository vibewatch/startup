      - number: '7.3'
        title: 合作伙伴、依赖与集中风险
        blocks:
          - type: paragraph
            body: >-
              NVIDIA 是 PBD 最集中的单一技术依赖。公司的整个 GPU 资产池——市场库存和企业集群——都运行在 NVIDIA 硬件上。2026 年，Blackwell GPU（B200/GB200
              NVL72）批量订单交期为 12–18 个月，大部分配额已被超大规模云厂商预先锁定；这些厂商合计承诺 2026 年 AI 资本开支达 $600–630B。TSMC 的 CoWoS 先进封装产能才是
              Blackwell 生产的真正瓶颈，其中约 60% 被 NVIDIA 一家公司消耗，并且到 2027 年中仍会结构性供不应求。NVIDIA 供应链任何中断、NVIDIA 定价或配额政策变化，或阻止 NVIDIA
              向 PBD 亚太集群地点发运先进芯片的出口管制裁定，都会直接削弱 PBD 履行客户承诺或扩容的能力。理论上，推理工作负载可以用 AMD MI300X 或 Google TPU 替代，但需要对 PBD
              的编排和软件栈做大量重构。


              客户集中风险又叠加了地缘政治暴露。可信报道明确将 Xiaohongshu (RedNote) 点名为 PBD 亚太集群业务的锚定客户。若该关系存在，并涉及中国母公司控制的主体接触受美国管制的先进 AI
              芯片——无论是在 Tokyo 数据中心还是其他地点——BIS 2026 年 5 月指引都会制造现实合规暴露。若单一高风险客户的收入集中触发 BIS
              执法、许可证撤销或客户关系被迫解除，就应成为一票否决项。Xiaohongshu 对应收入占比未披露，进一步放大了尽调缺口。
