            body: >
              PaleBlueDot 的市场平台发布实时 GPU 定价，与其他新型 GPU 云服务商具备竞争力。截至 2026 年初，NVIDIA H100 NVLink 市场平台费率约从
              $1.40–$1.50/GPU-hour 起，明显低于 2024 年初 $7–10/hr 的高点；背后是 NVIDIA Blackwell 爬坡、供应正常化和超大云厂商折扣带来的 H100 整体降价（AWS 于
              2025 年 6 月将 P5 实例价格下调约 44%）。NVIDIA B200 NVLink 费率约为 $1.57–$3.10/hr，GB200 NVL72 机架级系统标价
              $3.50–$3.70/hr；Blackwell 硬件供应仍紧张，大批量订单面临 12–18 个月交付周期。


              市场平台板块中，PaleBlueDot 赚取经纪价差或抽佣率，估计为总交易额的 10–20%——这一利润结构与其他 GPU 市场平台模式一致。企业专用集群按合同谈判定价，打包 GPU
              硬件摊销、托管机房电力和冷却费用、网络成本，以及 PaleBlueDot 的管理软件层。实际合同定价未公开披露。


              GPU 价格趋势构成结构性逆风：如果 H100 现货费率继续向 $1.20–1.80/hr 下行，除非交易量按比例扩张，否则每笔交易的总抽佣收入会被压缩。PaleBlueDot
              宣称的利润率防守策略，是靠软件差异化（AI Cloud Agent、可预测 SLA）对抗纯商品价格竞争。
