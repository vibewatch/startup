      - number: '3.3'
        title: 能力、定价、市场拓展与信任对比
        blocks:
          - type: paragraph
            body: >-
              定价上，H100 按需市场已明显分化。AWS 按需收费 $6.88/GPU-hour，2026 年 7 月起 Capacity Blocks 为 $5.19/GPU-hour；Azure 的 ND H100 v5
              实例标价 $12.29/GPU-hour；GCP 的 8-GPU 配置为每小时 $80–90（$10–11.25/GPU-hour）。相比之下，新型 GPU 云的 H100 按需费率整体从 Lambda 的
              $3.29 到 Crusoe 的 $3.90/GPU-hour，不同硬件相较超大云按需费率折价 40–70%。这种定价分化反映了开销、利润率和 市场拓展的结构性差异。AWS 2025 年 6 月将 H100 降价
              44%，把超大云厂商相对新型 GPU 云 的溢价从约 5–8× 压缩到 2–3×，说明超大云厂商愿意在 GPU 成本上竞争。能力上，CoreWeave 在 MLOps
              深度（W&B、OpenPipe）、企业在手订单确定性和 GPU 世代获取上领先新型 GPU 云。超大云厂商在合规（FedRAMP、HIPAA、ISO 27001）、托管 ML
              平台和全球多区域覆盖上领先——金融服务、医疗和政府等受监管买方需要这些属性，而目前没有一家 新型 GPU 云服务商能完整复制。PaleBlueDot 的 Dot-1.1 AI
              云代理在一定程度上补上托管部署缺口，但无法匹配 SageMaker 或 Vertex AI 的广度。市场拓展上，CoreWeave、Lambda 和 Crusoe 都瞄准美国总部的 AI
              实验室和企业；没有一家披露了可比的亚太企业足迹。这个地理空白是 PaleBlueDot 相对新型 GPU 云同行最清晰的结构性差异化——但也意味着其企业集群业务并不直接与 CoreWeave
              的美国锚定客户群正面竞争。
