  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：新型 GPU 云同行、超大云厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              PaleBlueDot 横跨 GPU 云市场中三层相互重叠的竞争带。顶层是超大云厂商——AWS、Microsoft Azure 和 Google Cloud Platform——它们的 H100 按需
              GPU-hour 定价分别为 $6.88、$12.29 和约 $10–11，比新型 GPU 云 费率高三到六倍。超大云厂商用 30 多个区域的全球覆盖、最高到 FedRAMP 和 ISO 27001
              的合规认证，以及受监管企业买方所需的一体化托管 ML 服务（SageMaker、Azure ML、Vertex AI）支撑这一溢价。第二层是新型 GPU 云阵营：CoreWeave、Lambda
              Labs、Lightning AI、Crusoe、TensorWave 和 Nebius 都以低于 $4.50 的 H100 按需费率，瞄准 AI 原生训练和推理工作负载；这一阵营合计面对的 2026 年 GPU
              云收入市场约 $20B。第三层由替代方案构成：本地 GPU 集群在高利用率下提供每块 GPU 三年 TCO $10,000–$12,000，而云按需为
              $35,000–$60,000；现货定价经纪平台（Spheron、Vast.ai、RunPod）则提供低于 $2/GPU-hour 的 H100 现货容量。PaleBlueDot 横跨多层：其 GPU
              市场平台与现货经纪平台和自助式 新型 GPU 云竞争，企业集群业务则与 CoreWeave、Crusoe 和 Lightning AI 争夺长期合同。在已知新型 GPU 云
              同行中，尚无接近的类比对象同时具备经纪市场平台模式、自有企业托管集群，以及已披露的亚太企业足迹。
