      - number: '7.5'
        title: 人员、执行与治理风险
        blocks:
          - type: paragraph
            body: >-
              PBD 的人员风险集中在领导层不透明和结构性治理未知上。公司原始创始人身份未公开披露；截至 2026 年 6 月，新闻稿、官方公司材料或已索引的第三方报道中都没有创始人姓名。对于一家 B 轮 / >$1B
              估值公司，这并不寻常。它阻碍投资人评估关键人物技术依赖、IP 权属历史，以及创始人与 Xiaohongshu / 出口管制争议之间是否存在利益冲突。CEO Stephen Watts 于 2026 年 1 月
              23 日上任，距离本报告仅六个月；此前两年担任 VP of Go-to-Market。他过往的高管经历（SAP Asia Pacific Japan 的 President and
              COO）为亚太扩张论点提供可信度，但不覆盖技术运营、GPU 采购或 AI 基础设施执行。CEO 角色是增量补强，还是 $300M 争议之后的治理缺口表现，目前并不清楚。除 Watts 外，没有其他 C
              级高管角色获得公开确认，CTO/CPO/CFO 身份仍未知。公司横跨四个市场（美国、日本、韩国、新加坡）的全球足迹，以及刚起步的 API 产品（TokenRouter），都抬高了执行风险；TokenRouter
              从核心 GPU 基础设施延伸到 AI 模型分发，这是一个 IP、监管和竞争动态完全不同的领域，需要不同的管理能力。
