companyProfile:
  summary: >
    PaleBlueDot AI 是一家总部位于 Palo Alto 的新型 GPU 云初创公司，成立于 2024 年，通过两层销售 AI 算力：一层是灵活接入第三方 GPU
    容量的市场平台，另一层是托管式企业业务，负责在托管机房设计并运营专用 GPU 集群。公司已把足迹扩到北美、日本、韩国、新加坡和更广泛的东南亚，并从原始算力进一步延伸到 TokenRouter 和 AI
    云代理软件，以提高变现能力和客户锁定。公开证据显示需求强劲，且至少有一个值得注意的企业部署；但公司财务仍不透明，投资人还要承担出口管制、资本密集和客户集中风险。
