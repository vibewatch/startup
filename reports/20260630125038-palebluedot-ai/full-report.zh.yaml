            body: >
              PaleBlueDot AI 将其核心基础设施描述为全栈、多租户云架构。算力锚定在 Digital Realty 和 Equinix 运营的托管机房，并由 PBD 自有的自托管推理云补充，后者在
              TokenRouter 可用性链路中充当故障切换路径。公司称其拥有 80+ 个全球集群，覆盖北美、日本、韩国、新加坡和东南亚。


              市场集群列表向买方展示结构化硬件参数：GPU 型号、互连类型（InfiniBand 或其他）、每节点核心数、每节点 RAM、集群接口以及每 GPU/hour 价格。企业部署中，PaleBlueDot
              会在托管机房内按买方规格配置并管理硬件。Dot-1.1 AI Cloud Agent 通过提供按日刷新的跨地区、跨 GPU 型号集群价格数据，改善采购体验。


              API 层提供兼容 OpenAI 的端点，API base URL 为 api.tokenrouter.com/v1，让已使用 OpenAI SDK 的开发团队无需重构技术栈即可接入 PBD
              TokenRouter。token 级操作（认证、用量日志、计费）通过网页控制台的 API Keys、Usage Logs 和 Balance 页面管理。多租户架构在成员、团队和部门层级执行支出控制。B
              轮资金被明确用于强化多租户架构、平台工程以及 AI Cloud Agent 扩展。


              一个值得注意的架构模糊点，存在于 PBD 官方 TokenRouter（tokenrouter.com / api.tokenrouter.com/v1）与另一个独立品牌 tokenrouter.me
              服务之间；后者拥有独立模型目录和俄语 / 英语开发者支持，可能让寻找集成文档的开发者产生品牌混淆。
