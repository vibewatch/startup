      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              托管机房依赖是结构性脆弱点：PBD 将企业 GPU 集群部署在 Digital Realty 和 Equinix 位于北美、日本、韩国和新加坡的设施中。Equinix 公布 >99.9999% 可用性，并由
              N+1 UPS 冗余和双路供电支撑，但 Uptime Institute 2026 年年度宕机分析发现，五分之一的重大宕机成本超过 $1M，且即便在先进设施中，电力中断仍是主要失效模式。Blackwell
              NVL72 单机架 120kW+ 的高密度 AI 工作负载，会以传统数据中心设计未预期的方式冲击供电和制冷基础设施。Digital Realty 已转向混合电力策略，包括在 Dublin
              等电网受限市场使用天然气发电。PBD 的全部托管式企业集群业务依赖两家托管机房供应商，因此承担集中风险；任一供应商发生长时间、多站点宕机，都会直接中断客户 SLA。


              新云厂商的安全风险有结构性维度，超大规模云厂商的安全框架无法完全覆盖。东西向 GPU fabric 流量——训练期间 GPU 之间的高带宽内部同步——使用 RDMA over Converged
              Ethernet，绕过传统 TCP/IP 栈和标准日志机制。800Gbps 速率下，标准取证日志无法以事件发生的速度记录，训练运行期间 fabric
              实际上处于未监控状态。单个管理凭据被攻破，就可能在自动化系统反应前扩散到集群大部分区域。2026 年初，AI 赋能网络攻击同比上升 89%；通过热门 AI
              库（LiteLLM、LangChain）发起的供应链攻击，已成为攻击 AI 基础设施运营商的主要路径。PBD 的 ISO/IEC 27001 和 SOC 2/3 认证由 Digital Realty
              的设施基础设施提供文件支撑；尚无独立验证的 PBD 专属安全评估发布。
