      - number: '2.5'
        title: 区域需求动态
        blocks:
          - type: paragraph
            body: >
              按 ABI Research 口径，2026 年北美掌握新型 GPU 云 GPUaaS 收入的 88%，动力来自 AI 实验室、科技公司和超大云基础设施的集中。不过，亚太是全球增长最快区域；Mordor
              Intelligence 预测到 2031 年 CAGR 为 54.5%，主权 AI 政策要求正在放大三大主要子市场的内生需求增长。


              按 IDC 数据，2026 年日本 AI 基础设施市场超过 $5.5B，同比增长 18%，自 2022 年以来扩大七倍。日本承诺到 2030 年投入公共和私人资金合计 $135B，其中 METI 为本土主权 AI
              云项目配置 $65B 直接支持。政府支持的部署包括 ABCI 3.0（通过数千块 NVIDIA H200 GPU 实现 6.2 exaflops）和 SAKURA Internet（10,800 块 GPU
              扩展）。Microsoft 另于 2026 年 4 月宣布在日本投资 $10B，进一步强化本土和外国服务商对该市场的兴趣。日本企业 AI 板块正在从政府催化的容量建设，转向企业自发的生产部署。


              2026 年韩国 AI 数据中心市场估值约 $1.99B，预计到 2031 年达到 $5.02B；已承诺的建设阶段资本开支超过 $30B，集中在五笔超级交易。关键投资包括 SK-AWS Ulsan
              campus（$5.1B、初始 60,000 块 GPU）、Hyundai 的 Saemangeum 氢能设施（$6.3B、50,000 块 Blackwell GPU），以及 NVIDIA 260,000 块
              GPU 的国家采购承诺。韩国通过 Samsung 和 SK Hynix 控制全球 HBM 供应的 80% 以上，形成独特供应链优势，吸引超大云厂商投资。


              东南亚拥有 2,000 多个运营中数据中心，区域投资预计到 2030 年达到 $30B，且到 2028 年年需求增速超过 20%。Singapore 是 Tier 1 企业和时延敏感型枢纽，运营容量约 1
              GW、空置率 1.4%，拥有溢价定价，并服务金融服务和企业工作负载。Malaysia 因土地可得和电力成本较低，承接原始算力扩容，拥有 500 多个运营中数据中心和 300 个在建数据中心。PaleBlueDot
              AI 披露客户集中在日本、韩国和新加坡，使其处在全球增长最快的区域板块内，并与主权 AI 政策顺风相吻合。
