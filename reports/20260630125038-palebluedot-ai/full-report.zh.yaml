            body: >-
              CoreWeave 是定义新型 GPU 云的基准公司。它于 2025 年 3 月在 Nasdaq（CRWV）上市，估值 $23B，并指引 2026 全年收入 $12–13B，期末 ARR 目标
              $18–19B。截至 2026 年 3 月 31 日，其签约在手订单 为 $99.4B，反映出与 Microsoft（2025 年收入的 67%）、OpenAI（总承诺
              $22.4B）、Meta（$35B+）、Anthropic（多年期）和 Jane Street（$6B）的锚定交易。CoreWeave 通过收购 Weights and
              Biases（$1B）、OpenPipe、Monolith AI 和 Marimo 向上游软件栈移动；Nvidia 于 2026 年 1 月作出 $2B 战略股权投资，进一步加深 GPU
              供应获取。CoreWeave 模式完全围绕大型企业长期预留合同，不运营公开市场平台。Lambda Labs（估值 $2.5B，目标 2026 年 IPO）是领先的自助式新型 GPU 云服务商，提供
              $3.29/GPU-hour 的 H100 按需实例，以及起价 $8.87/GPU-hour 的 B200 1-Click Clusters，吸引开发者和中端团队。Lightning AI 于 2026 年 1
              月完成与 Voltage Park 的转型性合并，把开发者平台与 36,000+ 块自有 GPU 结合，组成一家 $2.5B 实体，ARR 超过 $500M，覆盖免费初创层到企业专用容量。Crusoe（估值
              $10B+、融资 $3.9B）以能源优先的垂直整合模式差异化——建设 GW 级 AI 园区（Texas Abilene 1.2 GW，2025 年上线），H100 定价 $3.90/GPU-hour，AMD
              MI300X 定价 $3.45/GPU-hour。TensorWave（估值 $1.55B，2026 年 6 月 $350M Series B）是只押注 AMD 的新型 GPU 云挑战者，拥有 8,192 块
              AMD MI325X GPU，并通过 SCALE 工具链提供 CUDA 兼容层。Nebius AI Cloud 聚焦欧洲市场，H100 SXM 按需定价 $3.85/GPU-hour，对承诺预留最高提供 35%
              折扣。
