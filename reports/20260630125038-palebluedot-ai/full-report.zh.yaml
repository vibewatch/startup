      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 缺少支撑指标的期权价值定价
            body: >
              估计 50–475× EV/Revenue 的 B 轮价格，并不锚定当前指标，而是押注一个多年超高速增长情景：持续每年 5–8× 增长，并成功把软件变现。行业先例（Kerrisdale 对 CoreWeave
              的分析、McKinsey 的 neocloud 经济性报告）显示，GPU 租赁商业模式结构脆弱，供应正常化后容易遭遇倍数压缩。PaleBlueDot 未披露 ARR、毛利率和 NRR，投资人无法核验 $1B
              价格是否有任何历史财务锚点支撑。
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV026
              - CV029
              - CV030
          - type: callout
            title: 观察——在下一轮融资或 $25M ARR 披露时重新评估
            body: >
              PaleBlueDot 确实展现了市场潜力和超高速增长执行力。建议观察（而非回避），是承认乐观情景可能成立，并非否定这门生意。升级为买入的条件是：披露 ARR 高于 $25M，且有企业毛利率高于 18%
              的证据；在 BISS 2026 下 APAC 监管姿态清晰；完成股权结构表复核，确认新投资人的优先权结构合理。在这些条件满足前，B 轮价格意味着风险不对称，下行保护有限。
            calloutType: recommendation
            claimRefs:
