      - number: '2.2'
        title: 市场规模测算：TAM、SAM 与新型 GPU 云覆盖范围
        blocks:
          - type: paragraph
            body: >
              这个市场的规模测算首先取决于边界，已发布估算对同一日历年的判断相差四倍。Grand View Research 估算，2026 年广义云 AI 市场约 $170B，涵盖云端 AI 软件、服务和硬件。Intel
              Market Research 采用更窄的 AI GPU 基础设施定义，测算为 $53.1B，并以 14.2% CAGR 增至 2034 年的 $147.8B。Mordor Intelligence 将新型
              GPU 云专业服务商板块估为 2026 年 $35.22B，并以 46.37% CAGR 增长至 2031 年，只反映超大云厂商之外的专业服务商。这些数字无法直接调和：最窄和最宽定义之间 4x
              的差距，来自纳入范围差异（仅硬件，还是硬件 + 托管服务 + 软件），而不是对可观察市场活动的分析分歧。


              按三层测算框架：TAM（广义云 AI，含托管服务）按 Grand View Research 约为 2026 年 $170B；SAM（聚焦 AI GPU 的云算力，以硬件为中心）按 Intel Market
              Research 约为 $53B；PaleBlueDot AI 直接竞争、可获得的新型 GPU 云专业服务商板块，按 Mordor Intelligence 约为 $35B。ABI Research 预测，到
              2030 年，全服务商口径下 GPU-as-a-Service 将达到 $250B。仅 AI 数据中心 GPU 硬件子市场，2026 年就达到 $45B（Mordor
              Intelligence），而超大云厂商和云服务提供商掌握了 2025 年收入的 76.64%。CAGR 预测从 14%（仅硬件视角）到 46%（新型 GPU 云专业服务商）再到 40%（广义云
              AI）不等，完全取决于边界选择。


              更长期的 AI 基础设施背景同样重要。ARK Invest 援引 Gartner 和 TheNextPlatform 估计，全球数据中心系统投资将在 2026 年达到 $653B，同比增长超过 30%。由 GPU
              和 AI ASIC 驱动的加速计算，如今占计算服务器销售额的 86%。仅 2026 年，超大云厂商就合计承诺约 $700B AI 基础设施资本开支——这是科技行业史上最大规模的单年资本开支激增。
