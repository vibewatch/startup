        - 重新评估收入模型耐久性；推动软件层（TokenRouter）利润单独核算
      - - 资本结构 — 债务额度
        - 任何公开披露的 GPU 支持债务、SPV 或表外工具
        - 确认债务额度 >$100M，或债务服务吃掉 >30% 毛利
        - 新投资前必须全面审计资本结构；重新承销股权风险
      - - 托管机房中断 / SLA 违约
        - PBD 披露的正常运行时间统计，或客户 SLA 争议报告
        - 12 个月内发生三次或以上重大企业 SLA 违约
        - 将已验证的多托管机房故障转移能力列为投资条件
      - - 创始人 / 治理不透明
        - 创始人身份、董事会构成、IP 转让的公开披露
        - 未披露创始人身份或董事会治理就完成融资轮
        - 在提供治理文件前拒绝参与；视为阻塞性尽调缺口
