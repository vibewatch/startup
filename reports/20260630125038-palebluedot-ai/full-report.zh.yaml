      - number: '8.4'
        title: 情景分析：牛市、基准与熊市情形
        blocks:
          - type: paragraph
            body: >
              从 B 轮入场价看，投资结果可由三种情景框定；每种情景都明确 2028 年收入假设和估值方法。所有情景都假设自 2026 年 1 月起持有三年、再经历一轮稀释性融资（25–40% 股份），并在 2028
              年末前完成退出（IPO 或并购）。


              乐观情景：APAC 企业集群放量加速，软件层（TokenRouter）贡献独立经常性收入，GPU 基础设施需求到 2028 年仍保持每年 >5× 增长。到 2028 年底，年化收入达到 $75–100M。按
              20–25× 前瞻倍数估值（与 TensorWave 当前基于 $100M 收入的倍数一致），企业价值将达到 $1.5–2.5B。扣除未来一轮 30–40% 稀释和交易摩擦后，B 轮 投资人可能收回
              1.5–2.5× 投入资本，对应 IRR 约 15–35%。


              基准情景：GPU 价格压缩削弱算力市场收入，企业集群部署销售周期拉长，增长降至每年 2–3×。到 2028 年底，收入达到 $20–40M。按 12–18× 前瞻收入估值（低于 TensorWave
              可比倍数，以反映规模更小、执行记录更短），企业价值达到 $240M–720M。计入 25–40% 稀释后，B 轮投资人的结果在持平到亏损之间，对应 IRR 为 -10% 至 5%。


              悲观情景：H100 价格继续商品化，从当前 $1.40–$1.50/hr 降至 $0.80–1.20/hr；超大规模云厂商吸收中端企业集群需求；PaleBlueDot 的 APAC
              扩张遇到监管芯片出口限制，集群容量销售受限。收入增长停滞或反转，到 2028 年仅达到 $5–15M。被迫资本重组或低价出售退出， 估值约 $50–150M，较 B 轮损失 85–95%。


              GPU 价格趋势是关键共变量：H100 价格每下降 $0.50/hr，若没有相应的量增抵消，算力市场抽成收入估计压缩 20–30%。DCD 分析证实，neocloud 的单位经济在 GPU 利用率低于约 60%
              后会反转；需求低谷期很难守住这一门槛。
            claimRefs:
