      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >
              Stephen Watts 于 2026 年 1 月 23 日被任命为 PaleBlueDot AI 首席执行官，公司新闻中心 对外发布了这一消息。他在任命前约两年加入 PaleBlueDot AI——起点约为
              2024 年——担任市场拓展 副总裁，支持公司的全球扩张。公司公告称他拥有「卓越的 25 年职业生涯」，并特别列出他曾任 SAP Asia Pacific Japan 总裁兼
              COO，强调其在复杂全球市场、跨文化合作和高质量增长上的经验。


              此次 CEO 任命发生在公司快速国际扩张和随后完成 Series B 融资之后。公告把交接描述为公司内部的自然接班，理由是他深入理解 PaleBlueDot AI 的客户、平台和全球 AI 基础设施格局。作为
              CEO，Watts 的重点是执行以客户为先的市场拓展 策略，同时推进「让智能普惠可及」的使命。


              本次研究检索到的任何来源都未公开披露原始创始人身份。官方公司材料、新闻稿，以及截至 2026 年 6 月可索引的第三方报道中，都没有创始人姓名。这是公开身份记录中的实质缺口：后续章节若要评估 Stephen
              Watts 之外的关键人物依赖，目前无法锚定已披露的创始人关系、董事会构成或治理文件。尽调路径是直接向公司索取股权结构表、董事会构成和治理文件。
