      - number: '7.4'
        title: 财务与资本结构风险
        blocks:
          - type: paragraph
            body: >-
              PBD 的财务风险主要由三股力量叠加：GPU 价格商品化、资本强度与可用股权资金不匹配，以及资本结构尚未厘清。H100 GPU 现货租赁费从 2023 年 $8/hr 峰值，跌至 2026 年专业新云供应商的
              $1.03–$1.43/hr，降幅超过 70%；截至 2026 年 5 月，40+ 家供应商的按需费率中位数约为 $3.61/hr。对 PBD
              市场业务而言，每笔交易的每一美元抽佣收入都与租赁费率成比例，这意味着同样的 $150M B 轮资金，相比投资论点形成时，现在每部署一个 GPU-hour
              支撑的净收入明显更少。新云单位经济性结构性承压：硬件折旧（每台 H100 服务器 $200K–$320K）、电力成本（每个 Blackwell 机架 120kW+）、InfiniBand 网络以及专业 GPU
              工程人才，都高于 2023 年稀缺条件下制定的原始商业计划模型。


              GPU 抵押私募信贷市场增加了再融资风险。AI 相关公司未偿贷款从接近零飙升至超过 $200B；Morgan Stanley 预计到 2027 年还会新增 $800B 数据中心融资。据报道，PBD 曾探索一笔
              $300M 资产支持贷款额度，并由 JPMorgan 提供顾问服务；公司否认了这一点，交易也未推进。如果存在任何以 GPU 为抵押、表外存在的债务——行业常见做法是通过 SPV 售后回租结构实现——PBD
              的财务风险会被实质改写：按 $7/hr GPU 经济性写入的租赁义务，在实际租赁收入降至 $3/hr 时会造成严重现金流压力。公司未披露资本结构细节（债务工具、SPV
              安排、担保），这是重大缺口，使投资人无法承销其财务稳定性。
