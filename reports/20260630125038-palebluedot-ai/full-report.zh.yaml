  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与结构
        blocks:
          - type: paragraph
            body: >
              AI 云 GPU 基础设施市场，指通过网络基础设施向远程客户商业化出租和交付 GPU 加速算力，用于 AI 训练和推理工作负载。它包括按需 GPU 实例、预留集群租赁、裸金属 GPU
              节点租用，以及在托管机房运营的企业专用集群建设。主要交付渠道有两类：（1）打包在大型云平台内的超大云厂商 GPU 实例（AWS p5/p6、Azure NDv5、GCP A3）；（2）新型 GPU
              云专业服务商，提供 GPU 容量，配置更快、单 GPU 价格更低，基础设施也专为 AI 工作负载调优。PaleBlueDot AI 属于新型 GPU 云赛道，同时运营面向 AI 初创公司的 GPU
              市场平台，以及面向企业的专用集群设计与建设服务。


              该市场不包括通用 CPU 云服务、永久性本地硬件采购（资本开支）、消费级游戏 GPU、AI 软件和 SaaS 层（如托管式 AI API），以及 Azure OpenAI Service 或 Google
              Vertex AI 等打包在超大云厂商内的托管 AI 平台服务。构成替代压力的相邻板块包括：定制芯片云服务（Google Cloud TPU、AWS Trainium）、边缘 AI 推理硬件，以及 AI
              数据中心建设和电力基础设施。


              新型 GPU 云算力的主要现状替代方案，是超大云厂商 GPU 预留实例，以及通过直接采购协议购买本地 NVIDIA 硬件。每种替代方案的成本和交付周期不同。超大云厂商 GPU 实例平台集成广，但相对同等硬件的新型
              GPU 云高出 60–85%。本地采购避免持续租赁费用，却需要硬件预算、托管机房协议，以及当前世代 GPU 36–52 周的交付周期，对快速扩张的 AI 团队并不现实。
