        - 尽调中要求提供板块级财务报表或管理账
      - - 按板块划分的毛利率
        - 市场和集群毛利结构不同；混合数字会误导
        - 高 — 是判断盈利路径及价格压缩下毛利韧性的关键
        - 要求提供包含板块级毛利和贡献利润的 P&L
      - - 截至 2026 年 6 月的现金余额 / 在手现金
        - 没有实际资产负债表，现金消耗和跑道纯属推测
        - 高 — 无法确认资本充足性或下一轮融资触发时点
        - 要求提供经审计或管理层审阅的资产负债表；确认 Series B 后现金部署
      - - 客户数量和前 10 大客户收入集中度
        - Xiaohongshu 实体被点名；其收入占比未知；集中度风险重要
        - 高 — 在绝对收入规模偏低时，单一客户流失可能造成灾难性影响
        - 要求提供客户清单、头部客户收入占比和客户数量分群数据
      - - 净收入留存（NRR）
        - 企业 SaaS / 基础设施 NRR 揭示集群业务的扩容与流失动态
        - 中高 — NRR 偏低意味着高流失和替换式销售，而非复合增长
        - 要求提供服务满 ≥12 个月的企业级集群客户分群级 NRR
      - - 资本结构细节（债务、SPV、担保）
        - 报道中的 $300M 贷款额度；公司否认并不完整；实际结构未知
