      - number: '5.5'
        title: 差异化、路线图与开发阶段
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI 的主要差异化来自三点：(1) 双边市场连接闲置 GPU 供给与开发者 / 企业需求，为碎片化采购市场创造流动性；(2) 从原始算力到 API
              级模型推理都由同一供应商覆盖，降低切换摩擦，并支持从市场到托管集群再到 TokenRouter 的向上销售；(3) 基础设施地理分布广、亚太集中，让地缘约束市场的企业能通过境外数据中心合法接入先进 GPU 硬件。


              2024 年至 2026 年中，公司的产品发布节奏很快。公司由 Jonathan Zhu、Shaodong Huang 和 Sheldon Ng 于 2023/2024 年共同创立。关键里程碑包括：Dot-1.1
              AI Cloud Agent 发布（2026 年初），集成 DeepSeek-R1 和实时 GPU 定价；Stephen Watts 出任 CEO（2026 年 1 月 23 日）；以 $1B+ 估值完成
              $150M B 轮（2026 年 1 月 28 日）；PBD TokenRouter 平台上线（2026 年 4 月 21 日）。B 轮资金明确用于多租户架构改进、AI Cloud Agent
              加速和市场拓展，把平台工程和企业销售放在 2026 路线图中心。


              关键产品风险包括：(1) 路由逻辑差异化属于专有能力，尚无独立基准测试——99.95% 可用性是公司说法，没有第三方证明；(2) 基础设施容量依赖 Nvidia GPU
              供应链，后者仍然波动，并受出口管制影响；(3) CoreWeave 和超大规模云厂商以更成熟的合规姿态、更大的资产负债表争夺同一企业市场；(4) 开发者社区足迹仍早期——PBD 工具尚无可被独立验证的显著公开
              GitHub 影响力、Stack Overflow 标签流量或 npm/PyPI 信号；(5) tokenrouter.me / tokenrouter.com
              命名模糊，会增加开发者上手摩擦，并可能把流量导向错误路径。
