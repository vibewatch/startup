  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、隐含倍数与入场纪律
        blocks:
          - type: paragraph
            body: >
              PaleBlueDot AI 于 2026 年 1 月完成 $150M B 轮融资，由 B Capital 领投，投后估值据报道超过 $1 billion。公开报道显示，公司在 B 轮前只完成过一轮规模较小、约
              $10M 的融资，使已披露总融资约为 $160M。截至 2026 年 6 月下旬，公司尚未披露股权结构表细节，因此确切优先权结构、清算优先权、反稀释条款和参与权仍未知——这些因素会实质影响新投资人的下行保护。


              使用 CompWorth 第三方估计的 2026 年年收入约 $2.1M，隐含 EV/Revenue 倍数超过 475×。即便采用慷慨的管理层假设，即年化收入 $20M（在 2024 年约 $2M 基数上增长
              10× 之后），B 轮也意味着约 50× EV/Revenue。相比之下，同一增长阶段的新云行业基准，对拥有公开锚定订单积压的公司给出 8–30× 远期收入。PaleBlueDot 目前没有披露可与
              CoreWeave 的 $99B+ 或 Nebius 多年超大规模云厂商交易相比的合同订单积压。因此，$1B
              估值包含了大量期权价值，绑定于亚太企业集群成功放量、软件层毛利改善以及多年超高速增长延续；每一项都带有重大执行风险。


              在期权价值场景中，入场纪律最重要：投资人应理解，B 轮价格很可能只有在牛市情形下才产生正回报。基准情形暗示回报持平到下行，熊市情形暗示资本损失 80–95%。若公司无法在需要 C 轮或 D
              轮之前实现盈利或战略退出，未来轮次稀释还会进一步压缩回报。
