companyProfile:
  summary: >
    PaleBlueDot AI is a Palo Alto-based neocloud startup founded in 2024 that sells AI compute through two layers:
    a marketplace for flexible third-party GPU capacity and a managed enterprise business that designs and operates
    dedicated GPU clusters in colocation facilities. The company has expanded its footprint across North America,
    Japan, South Korea, Singapore, and broader Southeast Asia, and has extended beyond raw compute into TokenRouter
    and AI cloud-agent software to improve monetization and lock-in. Public evidence suggests strong demand and at
    least one notable enterprise deployment, but the company remains financially opaque and exposes investors to
    export-control, capital-intensity, and concentration risk.
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, California, USA
  productSummary: GPU marketplace, dedicated enterprise clusters, TokenRouter model-routing API, and AI cloud-agent tooling for AI deployment and inference workloads.
  customerFocus: AI developers and startups needing flexible GPU capacity, plus enterprises needing dedicated high-performance AI infrastructure.
  businessModel: Marketplace commissions and infrastructure revenue from third-party GPU sourcing, plus managed dedicated-cluster deployments and related software/services.
  stage: Series B
  fundingStatus: $150M Series B in January 2026 at a reported valuation above $1B; roughly $160M total disclosed funding.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO016, CO018, CO020, CU017, CU040]

