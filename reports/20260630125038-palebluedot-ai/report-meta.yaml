  topStrengths:
    - Dual business model combines flexible marketplace supply with higher-value enterprise dedicated clusters.
    - Demonstrated regional traction across North America and Asia, with a publicly reported Xiaohongshu-related enterprise deployment.
    - Product expansion into TokenRouter and AI cloud-agent software could improve monetization beyond raw GPU resale.
  topRisks:
    - The >$1B Series B valuation appears rich relative to the absence of disclosed ARR, gross margin, burn, or NRR.
    - Export-control exposure around China-linked workloads and Japan-based deployments could impair a visible enterprise account.
    - GPU supply concentration, debt-funded hardware expansion, and colocation dependence create structural capital-intensity risk.
    - Public customer breadth is thin, with only one named enterprise relationship and no disclosed retention metrics.
  unresolvedGaps:
    - Current ARR, revenue mix, gross margin, burn rate, and runway remain undisclosed.
    - Active customer count, NRR/GRR, churn, and concentration outside Xiaohongshu are not publicly auditable.
    - Cap-table terms, liquidation preferences, and any structured financing obligations remain private.
    - Founder identities and exact ownership/governance structure are not consistently corroborated across public sources.
