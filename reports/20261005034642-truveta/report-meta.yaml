companyProfile:
  summary: >-
    Truveta is a Bellevue-based healthcare intelligence company that pools and normalizes de-identified clinical
    records, claims, imaging, mortality, and genomics data from 30 provider owners to support life-sciences, healthcare,
    academic, and government research use cases.
  productSummary: >-
    A provider-governed real-world evidence platform and AI analytics layer that turns longitudinal EHR, claims,
    imaging, mortality, and genomics data into research-ready cohorts and clinical insights.
