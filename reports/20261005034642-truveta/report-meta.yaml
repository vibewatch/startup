    - Executive transition and multi-stakeholder governance can slow decisions and create coordination friction.
    - >-
      Privacy, consent, and regulatory scrutiny are material given the scale and linkage of longitudinal health and
      genomic data.
    - Azure and specialized data-pipeline dependencies create operational concentration and execution risk.
