  topStrengths:
    - >-
      Unique provider-governed consortium gives Truveta durable access to longitudinal clinical data from 30 health
      systems.
    - The Truveta Genome Project adds large genomics upside through a funded path to 10 million exomes.
    - >-
      Strong strategic backing from Microsoft, Regeneron, Illumina, and anchor health systems supports continued
      scaling.
  topRisks:
    - >-
      Commercial economics remain opaque because ARR, gross margin, revenue run-rate, and customer concentration are
