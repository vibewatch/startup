            body: >
              Truveta 的采用已从最初的联盟基础，扩展到超过 100 家生命科学、学术、医疗和政府机构的企业客户群 [CU006]。高知名度企业合作和大规模数据共研承诺，为商业动能提供了验证。Regeneron
              Pharmaceuticals 是 Truveta 最重要的具名商业伙伴和投资者；其与 Regeneron Genetics Center 承诺投入 $119.5 million，共同开发 Truveta
              Genome Project [CU003, CU004]。Illumina 同样承诺投入 $20 million 的测序技术和资本；Microsoft 则是 Truveta 的战略投资者和独家云服务提供商，在
              Microsoft Azure 基础设施上托管 Truveta Language Model [CU003, CU010]。


              除企业基因组计划外，商业生物制药中的具名客户验证还体现为企业数据授权和分析工具部署。企业生命科学团队使用 Truveta Studio 的特征表和资格筛选器，把队列准备周期从数周缩短到数分钟，在 GLP-1
              受体激动剂和肿瘤免疫疗法等复杂治疗领域建模真实世界治疗依从性和比较有效性 [CU002, CU007, CU011]。不过，Truveta 是私营公司，商业客户披露仍主要是汇总口径。Truveta
              没有公开列出单个生物制药授权客户，也没有把战略锚定投资者与标准 SaaS 或经常性数据订阅客户区分开来 [CU012]。
