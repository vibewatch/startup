  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >
              Truveta 是一个医疗临床数据、真实世界证据（RWE）和临床情报平台，建立在由 30 家美国领先医疗系统组成的受治理联盟之上。在企业客户工作流中，Truveta
              连接交易型医疗交付与二次科学研究之间的结构性断层。对生命科学研究人员、卫生经济学家和临床开发团队而言，平台把耗时数月的回顾性数据请求，替换为持续访问纵向患者旅程。工作流覆盖假设生成、借助语义概念映射和
              ATHENA 词汇进行队列定义、队列快照，以及在 PySpark 或 R 中执行云端统计分析。


              端到端用户工作流以 Truveta Studio 和近期发布的 Truveta Intelligence 应用为中心。在 Truveta Studio
              中，临床研究人员可以用结构化标准和从医生笔记中提取的非结构化临床测量值，定义精确患者队列，例如左心室射血分数（LVEF）百分比或 NYHA
              心力衰竭分级。用户在基于浏览器的云端笔记本中运行分析查询，无需导出患者级文件，既守住数据安全，也加快迭代。Truveta Intelligence 于 2026 年 4
              月推出后，科学和商业团队可以用自然语言提问，检查治疗模式、安全信号和医疗差异，并在数分钟内获得透明、可审计的队列摘要，而不是等待数月的回顾性报告。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
