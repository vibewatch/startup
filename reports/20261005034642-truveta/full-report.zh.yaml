figures:
  - id: FO001
    title: Truveta 公司与运营里程碑时间线
    type: timeline
    summary: 按时间顺序呈现 Truveta 从创立、医疗系统联盟组建，到规模化、基因组扩张及高管接班的进程。
    data:
      items:
        - label: 在 Providence 构想
          date: '2018-09-01'
          detail: Providence CEO Dr. Rod Hochman 构想联盟式医疗数据共享模式。
          tone: positive
        - label: 高管集结
          date: '2020-03-15'
          detail: Terry Myerson、Jay Nanduri 与 Dr. Ryan Ahern 在 COVID-19 期间联手打造临床数据平台。
          tone: positive
        - label: 正式注册成立
          date: '2020-09-20'
          detail: Truveta 由 Providence、Advocate Health、Tenet Healthcare 与 Trinity Health 创立。
          tone: positive
        - label: A 轮融资
          date: '2021-07-15'
          detail: 完成近 $100M（$95M）A 轮融资，成员覆盖的美国患者医疗服务比例增长至超过 15%。
          tone: positive
        - label: 与 Pfizer 的战略合作
          date: '2022-06-21'
          detail: 与 Pfizer 签订多年商业合作，为 50M+ 名患者开展实时安全监测。
          tone: positive
        - label: C 轮与 Genome Project
          date: '2025-01-13'
          detail: 以 $1B+ 估值取得 $320M 优先股融资，其中 Regeneron 投入 $119.5M、Illumina 投入 $20M，用于测序 1,000 万个外显子组。
          tone: positive
        - label: Truveta Intelligence 上线
          date: '2026-04-28'
          detail: 发布 AI 查询平台，支持在数分钟内用自然语言发现真实世界证据。
          tone: positive
        - label: CEO 接班过渡
          date: '2026-09-15'
          detail: 创始 CEO Terry Myerson 宣布退休；Jay Nanduri 与 Dr. Ryan Ahern 被任命为临时联席 CEO。
          tone: warning
    approximationNotes: 日期依据正式新闻稿与已发布的里程碑记录；早期构想日期精确到估计月份。
