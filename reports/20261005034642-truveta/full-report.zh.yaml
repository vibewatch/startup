  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 医疗真实世界数据与证据竞争格局
        blocks:
          - type: paragraph
            body: >-
              真实世界证据（RWE）和医疗数据平台的竞争格局横跨多个不同类型；它们以不同的数据获取模式解决临床与商业情报工作流。Truveta 的主要直接同业和既有竞争者包括传统理赔清算所聚合商、专病 EHR
              网络、临床研究平台以及医疗系统内部的信息化建设。历史上，制药和生物技术申办方高度依赖已结案和开放理赔数据集。这些数据能广泛、纵向地呈现已报销事件，却缺少临床深度、实验室数值、非结构化医生推理和及时刷新频率
              [CP004, CP005]。随着 FDA 监管指导越来越强调可审计性和多模态数据质量，生命科学申办方转向监管级临床数据集，将电子健康记录与已结案理赔和诊断元数据连接 [CP001, CP004]。Truveta
              直接对标这一传统理赔范式，从横跨 40 多个州的 30 家医疗系统所有者联盟中汇集每日更新的 EHR 数据流 [CP001,
              CP006]。不过，在肿瘤和罕见病等专科领域，既有品类龙头仍拥有牢固关系和深度整理的注册库，Truveta 必须证明自己在不同治疗领域的临床深度和代表性 [CP005, CP007]。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 竞争者画像、运营规模与能力比较
        blocks:
          - type: paragraph
            body: >-
              Health Tech & AI Pharma Partners 类别的采购评估，会比较供应商的多模态关联、治疗领域深度、试验加速、RWE
              准备度和部署模式。直接替代者在资本规模、底层数据供应链以及临床笔记处理技术上差异显著。IQVIA 和 Optum
              等传统聚合商拥有数十亿美元企业收入和全面的付款方关系支撑的巨大商业规模，但其历史核心产品仍偏向理赔和行政清算所数据流 [CP004, CP005]。相反，Flatiron Health
              等专注肿瘤的平台通过手工整理和临床抽取非结构化 EHR，建立了深厚壁垒，在特定癌症适应症上形成金标准数据集，却难以在所有疾病类别间快速横向扩张。Truveta 通过自动化自然语言处理和 Truveta
              Language Model，实现横向扩展，在不依赖大规模人工病历抽取团队的情况下，处理覆盖 140 million 个患者旅程的临床笔记和影像元数据 [CP002, CP003,
              CP006]。不过，独立采购基准显示，相较传统垂直专科公司，Truveta 的治疗领域深度仍在成熟中；初期研究设计往往还需要通过 Truveta Evidence Services 获得额外专业支持
              [CP005, CP007, CP008]。
            claimRefs:
              - CP002
