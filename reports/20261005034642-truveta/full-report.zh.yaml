      - number: '1.3'
        title: 资本化历史、基因组扩张与估值现实
        blocks:
          - type: paragraph
            body: >-
              自成立以来，Truveta 已累计募集超过 $515M 股权资本，用于支撑高吞吐计算基础设施和联盟运营 [CO010]。资本化里程碑包括 2021 年 7 月完成的 $95M A
              轮融资，当时医疗系统成员数量正在增加；此后 Microsoft 持续进行战略投资 [CO010, CO011]。2025 年 1 月，Truveta 完成一轮里程碑式 $320M 优先股融资，投后估值超过
              $1B（据报道投后股权价值为 $1.42B）；17 家医疗系统参与，Regeneron 出资 $119.5M，Illumina 出资 $20M [CO011, CO012]。这笔资金直接支持 Truveta
              Genome Project：该项目与 Regeneron Genetics Center 合作，对获得同意的患者生物样本进行 10 million 个外显子组测序，打造前所未有的表型—基因型一体化数据库
              [CO012]。尽管战略规模可观，Truveta 仍是私营且经营不透明的公司：年度经常性收入（ARR）、毛利率、现金消耗率、现金跑道和精确全职员工数等指标仍未披露 [CO013, CO014, CO015]。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
