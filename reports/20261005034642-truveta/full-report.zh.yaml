      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 高管继任与商业治理逆风
            body: >-
              创始 CEO Terry Myerson 于 2026 年 9 月退休，使 Truveta 面临关键交接风险：公司正处于必须把高资本投入的基因组基础设施转化为高毛利经常性软件收入的阶段。管理一个由 30
              家医疗服务提供方组成的联盟，同时平衡 Regeneron 和 Pfizer 等公开商业合作伙伴，需要在非营利医疗系统伦理与私营企业盈利之间保持微妙平衡 [CO003, CO005]。
            calloutType: risk
            claimRefs:
              - CO003
              - CO005
          - type: callout
            title: 无可匹敌的提供方治理型临床与基因组数据引力
            body: >-
              30 家成员医疗系统持续贡献覆盖超过 130M 患者的纵向 EHR，另有一项由 $320M 资金支持、通过 Regeneron 对 10 million 个外显子组进行测序的计划。由此，Truveta
              拥有难以匹敌的真实世界数据壁垒，且其结构上不受传统第三方聚合商抓取限制的影响 [CO007, CO008, CO012]。
            calloutType: strength
            claimRefs:
              - CO007
              - CO008
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              就尽调而言，已有证据支持的市场比整体医疗数据市场更窄。它包括企业获取去标识化真实世界数据、分析工作流和证据服务，用于临床试验、HEOR、安全性、未满足需求研究、研发和医疗质量分析。Truveta
              自有材料将生命科学、公共卫生和医疗组织列为用户；一份历史独立报道则称，聚合数据将销售给医疗系统、研究人员及其他客户。该边界涵盖数据访问、分析和研究支持；除非商业证据显示 Truveta
              从中取得收入，否则不包括交易型 EHR 软件、直接医疗服务、实验室检测和 CRO 试验点执行。现状替代方案包括内部回顾性分析、面向理赔的数据集、注册库和定制服务，而不只是另一套 AI 界面。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >
              指定来源没有提供当前美元市场估算、CAGR、Truveta 定价表，也没有可辩护的账户数与支出分母来计算 TAM、SAM 或 SOM。现有数字描述的是供给覆盖和已展示的分析规模。Truveta 报告 EHR
              数据覆盖 120 million 名患者、已结案理赔覆盖 200 million 名患者；这是两个不同人群，不能相加。管理层页面另行报告超过 140 million
              个患者旅程，但没有把这一分母与两个产品页面的口径对齐。其他规模指标——超过 7 billion 条笔记、超过 100 million 张影像、30 家成员医疗系统、100 多家合作机构以及一个 20,000
              多名患者的示例研究——体现的是广度，而不是可服务支出。因此，规模图只是按概念排列证据层级，并不代表按比例、可相加或嵌套的市场细分。
