      - number: '8.3'
        title: 估值情景、可比基准纪律与尽调路径
        blocks:
          - type: paragraph
            body: >-
              评估 Truveta，需要同时参考上市生命科学数据分析公司和知名私营真实世界数据平台。上市可比公司的倍数明显分化：Indegene 等已实现 规模化盈利的商业化平台约以 3.2x EV/Revenue 和 22x
              EV/EBITDA 交易（市值 $1.5 billion、收入 $365 million）；而 Veradigm 等传统 EHR 数据和分析供应商估值受压，约为 0.9x EV/Revenue（收入 $588
              million、估值 $545 million），反映出治理和数据 提取难题。HealthVerity（估值 $721 million）和 Unite Us（估值 $1.6
              billion）等私营同业则显示企业对多源数据整合网络有强劲需求。 鉴于 Truveta 的收入基线尚未验证，我们的估值框架建模三种情景。乐观情景假设生物医药客户迅速订阅 Truveta Intelligence
              和 Truveta Genome Project 外显子数据，ARR 达到 $120 million，按 18x 倍数计算，企业估值为 $2.16 billion。基准情景假设 企业业务温和扩张，ARR 达到
              $60 million，按 11x 倍数对应 $660 million 估值；相较 Series C 的 $1.0 billion 至 $1.42 billion
              定价，融资轮次下调时，倍数会温和压缩。悲观情景反映生命科学销售周期延长、数据主权阻力，以及 $30 million ARR 持平并按 5x 受困倍数估值（估值 $150
              million），触发优先权悬垂带来的深度稀释。因此，我们建议“跟踪”，估值判断为“合理”；在投入增长资本前，必须明确核实客户集中度和单位经济性。
            claimRefs:
