  - id: FE001
    title: Truveta 端到端临床数据与分析架构
    type: stack
    summary: 多层架构栈展示数据从医疗系统摄取，经协调统一、AI 提取，最终交付云端分析的流程。
    data:
      layers:
        - label: 数据摄取与联邦层
          detail: 从 30 个成员医疗系统每日摄取多模态数据流（结构化 EHR、5B+ 条笔记、85M+ 张影像、理赔、SDOH）。
          modules:
            - 异构 EHR 摄取连接器（Epic、Cerner）
            - DICOM 影像与临床笔记摄取管道
            - 支付方已结案理赔与 SDOH 摄取数据流
        - label: 语义协调统一层
          detail: 在所有医疗场景中，将句法与语义变体标准化为统一的医学术语。
          modules:
            - 自动句法与语义词汇映射
            - 概念标准化（SNOMED、RxNorm、LOINC、CPT）
            - 数据质量审计与完整性验证
        - label: 临床 AI 与数据增强层
          detail: 用专有语言模型丰富患者记录，并在不同机构之间解析身份。
          modules:
            - Truveta Language Model（TLM）非结构化笔记提取
            - 人员匹配与确定性 / 概率性标记化
            - 多模态记录关联（EHR、理赔、影像、基因组学）
        - label: 云存储与分布式计算层
          detail: 在 Microsoft Azure 上提供安全、PB 级的大数据处理基础设施，并严格隔离数据。
          modules:
            - Apache Spark 大数据集群（PySpark、SparkR、SQL）
            - Microsoft Azure 云隔离区与存储基础设施
            - 严格隔离控制，禁止导出微观数据
        - label: 应用与分析工作区层
          detail: 为定量研究人员提供交互式队列构建、研究管理和可扩展的云端分析能力。
          modules:
            - Truveta Studio 网页界面与概念搜索
            - 自然语言队列定义与快照生成
            - 集成式云端分析笔记本环境
        - label: 临床智能与决策层
          detail: 将纵向真实世界证据转化为面向生物制药和医疗服务提供方领导者的实时自然语言查询答案。
          modules:
            - Truveta Intelligence 自然语言查询界面
            - 透明的代码集检查与方法学审计
            - 监管级证据仪表板与导出工具
    approximationNotes: 架构层反映 Truveta 技术出版物和工程披露中记录的功能层级；实际的微服务拓扑属于专有信息。
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: Truveta 客户旅程与企业扩张生命周期
    type: journey-map
    summary: 展示生命科学和医疗服务提供方组织中客户获取、数据验证与产品扩张的多阶段旅程。
