      - number: '8.2'
        title: 资本结构、融资轮次与优先权悬垂
        blocks:
          - type: paragraph
            body: >-
              Truveta 自成立以来通过四轮已披露融资累计筹资 $515 million。2021 年 7 月，公司完成首轮 $95 million Series A，资金大致由 创始医疗系统成员平均出资；随后完成
              Microsoft 牵头的 Series A 后续部分，并于 2021 年 11 月完成 $100 million Series B。 最近一次是 2025 年 1 月 13 日宣布的关键 $320
              million Series C 增长股权轮。公司正式跨过独角兽门槛：一级公告披露的投后估值为 $1.0 billion，二级市场《公司注册证书》文件给出的基准估值最高达 $1.42 billion（1,035
              10.35M 股 Series C 优先股每股 $11.54）。更重要的是，Series C 在医疗服务商成员之外引入了主要战略企业伙伴，包括出资 $119.5 million 的 Regeneron
              Pharmaceuticals 和出资 $20 million 的基因组学龙头 Illumina；Microsoft Azure 则提供底层 AI 云基础设施。不过，如此厚重的资本结构带来了
              显著的清算优先权悬垂。优先股层级高于普通股和期权，意味着若流动性事件规模低于 $515 million，普通股股东和员工股权都会 严重受损。此外，临时管理层交接也让关键商业规模化窗口期的组织稳定性更加不确定。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
