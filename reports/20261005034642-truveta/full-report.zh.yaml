      - number: '5.2'
        title: 产品线、模块与交付资产
        blocks:
          - type: paragraph
            body: >
              Truveta 将核心数据资产和分析软件封装成不同商业模块，服务于生物制药研发、临床试验运营、医学事务和医疗系统基准比较。基础数据资产 Truveta Data 包含监管级纵向记录：120 million 至
              140 million 名去标识化 EHR 患者，与 200 million 名已结案理赔患者关联；另有覆盖 CT、MRI、X-ray 和超声模态的 85 million 项医学影像研究，以及超过 5
              billion 条医生笔记。专门数据子集包括超过 1 million 对匹配的母子样本，以及 Truveta Genome Project；该项目与 Regeneron Genetics Center
              合作，保存生物样本，并将外显子测序与纵向表型记录关联。


              软件和访问层由 Truveta Studio、Truveta Intelligence 及程序化 API 端点组成。Truveta Studio 是定量研究人员的主要分析工作环境，提供托管 Spark
              集群、概念识别工具，以及图表和表格导出功能。Truveta Intelligence
              是企业决策层，让非技术管理者和临床主管查询实时医疗模式，并检查底层方法论和代码集。这些模块还配有生命科学解决方案：临床试验可行性建模可减少零入组试验点；上市后安全性研究（PASS/PMR）则用于履行 FDA
              承诺。
