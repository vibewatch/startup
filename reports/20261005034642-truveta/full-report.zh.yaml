      - number: '5.4'
        title: 部署、互操作性、信任与技术缺口
        blocks:
          - type: paragraph
            body: >
              Truveta 平台能否部署并获监管接受，取决于严格的数据溯源、安全控制和合规治理。Truveta 由医疗服务提供方系统创立并治理，形成了确保临床监督、患者隐私保护和合乎伦理的二次数据使用的机构治理框架。为维持
              HIPAA 去标识化标准，Truveta 在平台层设置严格护栏：用户通过基于浏览器的笔记本访问数据，可以导出汇总表格和图形可视化，但不能下载患者级原始数据文件或将其传出安全云环境。


              技术差异化集中在多模态关联、每日更新频率和同行评审的科学透明度上；Truveta 已在 JAMIA Open 发表其核心 EHR 标准化与关联基础。不过，技术和运营风险仍在。平台高度依赖 30
              家独立成员医疗系统持续、及时地每日摄取数据；本地 EHR 接口变更、网络中断或治理争议都可能打断数据流连续性。此外，架构严重依赖 Microsoft Azure 基础设施和专用分布式 Spark
              管道。最后，独立定量基准尚未公开：它们应将 Truveta 的 TLM 实体抽取精确率和召回率与 medspaCy 或 clinical transformers 等开源临床 NLP
              管道直接比较，这仍是生物制药数据评估团队的尽调缺口。
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: 展示项
        blocks:
