      - number: '7.2'
        title: 监管、隐私与遗传样本治理
        blocks:
          - type: paragraph
            body: >-
              Truveta 汇集代表超过 120 million 名患者、占美国每日临床医疗服务超过 18% 的电子健康记录，因此监管和合规暴露构成生存级风险。Truveta 的运营模式依赖 HIPAA
              专家认定和去标识化标准，确保临床就诊、关联的已结案理赔以及入院—出院—转院记录中的患者匿名性。然而，联邦机构、FTC 和州级健康隐私监管者日益关注大型多模态数据集中的重新识别风险，持续施加合规压力。Truveta
              Genome Project 进一步放大了这一风险：项目于 2025 年 1 月在 $320 million 优先股融资支持下启动，由 17 家医疗系统伙伴以及 Illumina、Regeneron
              等商业发起方参与。该计划需要在美国临床点取得患者同意，把常规临床检验留下的生物样本与去标识化 EHR 关联起来，为最多 10 million 名志愿者进行外显子组测序。任何撤回同意、保管链不一致，或依据修订后的
              Common Rule 或 HIPAA 隐私指南重新解释生物样本研究的情况，都会立即造成法律和运营责任。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
