    title: 商业模式包装与包装取舍对比
    columns:
      - 商业维度
      - Truveta 模式
      - 同类竞争做法
      - 运营取舍与尽调问题
    rows:
      - - 定价指标与结构
        - 按客户类型分层的企业年度订阅（制药、医疗系统、公共卫生）
        - 按适应症授权、按研究收取提取费、按席位订阅分析服务，或提供数据切片
        - Truveta 未公开定价驱动因素或席位成本，导致预算不透明
      - - 服务依赖度
        - 混合模式；软件访问（Truveta Studio / Intelligence）加 Truveta Evidence Services 咨询
        - 定制研究设计和监管申报支持普遍高度依赖专业服务
