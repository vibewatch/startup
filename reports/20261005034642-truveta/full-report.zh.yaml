            body: >-
              Truveta 的基础技术优势在于联盟支持的治理和深度多模态整合。不同于只处理延迟计费代码、缺少临床背景的理赔聚合商，Truveta 每日把结构化 EHR 字段与超过 5 billion 条临床笔记、85
              million 项影像研究及已结案理赔协调起来。由临床医生参与训练的语言模型，能从笔记中释放关键临床指标，为复杂流行病学和真实世界证据研究提供可辩护的数据壁垒。
