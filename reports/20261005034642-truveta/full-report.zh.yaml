  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管交接与医疗服务提供方联盟治理
        blocks:
          - type: paragraph
            body: >-
              Truveta 的核心壁垒——由 30 家美国大型医疗系统成员共同持有并治理——同时也是其主要组织脆弱点。公司于 2020 年 9 月成立，由联合创始人、前 Microsoft 高管 Terry Myerson
              领导，并与临时联合 CEO Jay Nanduri 和 Ryan Ahern 医生共同推进。2026 年 9 月，Myerson 宣布退休，启动永久 CEO 的遴选；Nanduri 和 Ahern
              医生则承担临时联合 CEO 职责。从拥有 Microsoft 高管履历的高知名度创始 CEO 转向临时领导，会给 Truveta 庞大的董事会带来运营和战略摩擦。董事会成员是代表
              Providence、Advocate Health、Tenet Healthcare、Trinity Health、Henry Ford Health System 和 AdventHealth
              的医疗系统高管，另有 Pfizer 等商业利益相关方。成员医疗系统在平等治理安排下出资参与 A
              轮和优先股融资，形成结构性协调挑战。如果成员医疗系统在战略重点、临床信息化路线图或二次数据变现政策上出现分歧，Truveta 的治理机制可能陷入僵局，或导致成员参与度下降。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
