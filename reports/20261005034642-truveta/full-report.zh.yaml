            title: CEO 继任与联盟治理稳定性
            body: >-
              创始 CEO Terry Myerson 于 2026 年 9 月退休，使 Truveta 处在关键转折点。要在商业软件收入扩张的同时维持 30 个彼此竞争的
              医疗系统所有者之间的协同，需要一位能处理复杂非营利医疗政治、生命科学企业采购和高性能云工程的管理者。
