            title: 双边联盟关系形成独特的客户—所有者飞轮
            body: >-
              Truveta
              的客户模式从根本上不同于传统数据经纪商：它把数据贡献方设为股权所有者和治理伙伴。这种结构让医院围绕数据质量和持续交付临床笔记形成一致激励，打造出商业生物制药买方无法通过公共理赔聚合商复制的自强化数据壁垒。
            calloutType: insight
            claimRefs:
