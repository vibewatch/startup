            title: 投资结论：跟踪，等待商业执行得到验证
            body: >-
              Truveta 的医疗服务商联盟结构筑起难以攻破的数据壁垒，但 ARR、毛利率和客户留存指标不透明，使投资者无法在当前 $1.0B 至 $1.42B
              估值下建立高置信度安全边际。投资者应继续跟踪这一资产，直到经审计的商业收入证据和稳定的高管治理架构得到确立。
            calloutType: recommendation
