      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              最强的买方证据是类别描述，而非预算数据。Truveta 点名生命科学、公共卫生和医疗组织，其生命科学页面则把用例对应到试验团队、HEOR、安全性、市场准入和研发流程。一份可信度较低的访谈指南还列出
              HEOR、医学事务、研发、商业分析、技术数据科学、法务、采购和隐私团队，称其参与企业销售。该来源描述的周期为 6 至 12
              个月、涉及多个利益相关方，因此只能作为方向性信息，不能视为公司已核实披露。采用触发因素是更快获得可检查的证据：公司 2026
              年发布材料称，回顾性分析通常需要数月，而洞见往往数分钟即可交付。确切预算负责人、付款来源、合同金额和付费客户数均未披露；100 多家合作机构不等于 100 多个付费账户。
            claimRefs:
