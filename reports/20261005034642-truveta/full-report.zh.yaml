  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 核心投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Truveta 是医疗智能和生命科学数据基础设施生态中极具吸引力的战略资产。核心论点建立在其无可比拟的专有数据联盟上： Providence、Advocate Health、Tenet Healthcare 和
              Trinity Health 等大型医疗服务商于 2020 年共同创立该联盟，如今已扩展到 30 个成员医疗系统，覆盖美国全部患者医疗服务的 15% 以上。Truveta 汇总 1.2 亿至 1.4
              亿条患者就诊历程中的去标识化、 每日更新的电子病历，并将其与封闭式理赔数据、生物样本和健康社会决定因素关联，为生物医药研究人员和监管机构提供合成模型或 单一医疗服务商系统无法复制的监管级临床深度。Truveta
              与 Regeneron、Illumina 启动 Truveta Genome Project 后，又把 1,000
              万名志愿者的外显子测序接入表型记录，带来巨大的上行期权。反过来，反论点集中在极端的运营和财务不透明上。
              公司没有公开披露年度经常性收入（ARR）、收入运行率、毛利率、现金消耗或净收入留存率。其独特的治理结构也带来严重摩擦： 17
              家以上的医疗系统成员同时充当股权所有者、独家数据贡献者、董事会成员和潜在平台用户，可能引发成员间利益冲突和高昂的 切换摩擦，进而阻碍激进的商业变现或不受约束的首次公开募股。
