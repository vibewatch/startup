          - type: callout
            title: 客户持久性指标与定价不透明遮蔽企业留存
            body: >-
              Truveta 声称拥有超过 100 家客户机构，并与 Regeneron
              等头部制药公司建立锚定关系，但管理层没有披露客户流失率、净收入留存率（NRR）或合同续约基准。在生物制药预算承压、联邦药品定价压力升高的环境下，缺乏可验证的留存指标构成关键私营公司尽调缺口。
