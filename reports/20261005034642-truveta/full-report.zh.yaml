      - number: '3.3'
        title: 转换成本、分销壁垒与壁垒持久性
        blocks:
          - type: paragraph
            body: >-
              评估 Truveta 的长期竞争持久性，需要同时看医疗系统网络的治理与经济结构，以及客户更换障碍。Truveta 的基础壁垒来自与 30 家美国大型医疗系统建立的排他或优先数据合作；这些医疗系统的高管担任
              Truveta 董事会成员，并参与股权上行空间 [CP006, CP009]。这种由医疗服务提供方主导的协同，使成员医疗系统不愿把完整、持续更新的临床记录同时提供给第三方数据经纪商
              [CP006]。此外，Truveta 于 2026 年推出 Truveta Intelligence——一个能在数分钟内返回自然语言队列查询和透明方法论的 AI 界面——试图压缩研究周期，将软件嵌入生物制药工作流
              [CP003, CP011]。但这些结构性优势并未消除实质转换成本和商业壁垒。生命科学采购团队面临显著的总拥有成本不透明：企业订阅层级、数据权利边界和定制咨询附加服务均在私下协商，没有公开标价 [CP007,
              CP008, CP010]。跨机构数据治理约束，以及缺少数十年历史基准数据，在对抗长期占据企业分析市场的竞争者时，也会持续造成摩擦 [CP004, CP005, CP007]。
