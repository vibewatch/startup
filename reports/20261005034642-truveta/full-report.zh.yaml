  - id: TP002
    title: 按购买标准划分的功能与能力矩阵
    columns:
      - 购买标准
      - Truveta 评估
      - 传统理赔汇总商
      - 专业 EHR 网络
      - 证据基础与来源对应
    rows:
      - - 多模态数据关联
        - 高（4.7/5 分）；为 130M+ 名患者关联 EHR 笔记、影像元数据、实验室结果和理赔数据
        - 中；理赔和处方关联较强，但临床文本和影像稀疏
        - 专科领域表现高；连接深度肿瘤临床记录和基因组检测
        - RFP.wiki 采购评估显示，Truveta 覆盖 130M+ 名患者，多模态得分为 4.7/5
      - - 数据新鲜度与刷新频率
        - 高；来自 30 个成员医疗系统的临床 EHR 数据流每日更新
        - 低至中；理赔通常按月或按季度滞后（常延迟 60-90 天）
        - 中；批量更新取决于临床病历抽取和数据管道计划
        - 公司发布信息和独立 RFP 基准测试证实其每日刷新架构
      - - 治疗领域广度
        - 广；覆盖 30 个医疗系统的所有诊疗场景和医学专科
        - 人群覆盖全面，但临床诊断颗粒度有限
        - 窄；高度集中于肿瘤、免疫学或少数罕见病
        - RFP.wiki 指出 Truveta 覆盖所有诊疗场景，但相比专科服务商，其治疗领域深度仍在发展
      - - 非结构化笔记结构化
        - 自动化 AI；专有 Truveta Language Model 处理 7B+ 条临床医生笔记
        - 极少；难以从 EHR 源系统获取叙述性临床文本
        - 手工 / 半自动化；高度依赖专业护士或肿瘤科医生进行抽象标注
        - Truveta 技术文档称覆盖 7B+ 条笔记，并采用 AI 临床概念映射
      - - 分析师自助使用体验
        - 中等（评分 3.8/5）；可在 Truveta Intelligence 和 Truveta Studio 中用自然语言查询
        - 标准 BI 多维数据集中的使用体验较高；复杂的自定义队列定义需要服务支持
        - 中等；自定义队列生成往往由专门的临床数据专家协助
        - 采购评估指出，高级流行病学研究仍需 Evidence Services
    notes: 评分标准综合了 RFP.wiki 采购评估（1-5 分制）与官方产品文档。 同类基准来自该品类的 RFP 标准。
