      - number: '5.3'
        title: 架构、数据管道与工程运营模式
        blocks:
          - type: paragraph
            body: >
              Truveta 的底层技术架构用于摄取、协调并持续标准化来自不同医院 EHR 系统的 PB 级临床数据，且不带商业偏见。摄取层每天接收 30 家成员医疗系统的 EHR 数据流，约覆盖美国患者医疗服务的
              17%。这些数据来自不同 EHR 系统（如 Epic、Oracle Health/Cerner 等），包含结构化表格、非结构化医生文本和 DICOM
              影像库。数据处理引擎运行自动化语法与语义标准化管道，将临床事件统一到 SNOMED-CT、ICD-10、RxNorm、NDC、LOINC、UCUM 和 CPT/HCPCS 等通用术语。


              处理层的关键差异化能力是 Truveta Language Model（TLM）。该 AI 模型以超过 80 million
              个患者旅程训练，并让临床医生参与其中，在诊断、药物、实验室数值及隐藏于非结构化笔记的临床概念上实现超过 92% 的标准化准确率。去标识化和患者身份解析由专门的 Person Matching
              服务处理，将不同医疗系统的就诊记录连接起来，并整合外部已结案理赔、死亡率数据库和健康社会决定因素（SDOH）。平台软件栈使用 Microsoft Azure 云服务、Apache Spark
              大数据集群、C#/.NET Core 微服务、NestJS 以及 React/TypeScript 前端应用，支持 Bellevue（华盛顿州）和印度 Hyderabad 等全球开发中心的安全分布式计算。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
