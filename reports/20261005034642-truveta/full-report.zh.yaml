      - number: '6.3'
        title: 留存动力、客户扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >
              Truveta 的客户持久性和商业扩张，建立在结构性网络效应和持续产品创新之上。每家成员医疗系统持续贡献每日刷新的临床笔记、影像、实验室数值和行政计费数据，Truveta 的数据引力随之增强 [CU005,
              CU011]。2026 年 4 月，Truveta 发布 Truveta Intelligence，这一 AI 驱动的对话式查询体验能在数分钟内从真实世界数据中交付实时洞见，消除回顾性分析障碍，并推动采用从专门的
              HEOR 团队扩展至医学事务、临床试验可行性和高管决策 [CU007, CU008]。


              尽管扩张界面不少，Truveta 仍面临关键的持久性、宏观经济和集中度风险。受美国医疗政策变化、FDA 预算可能削减以及最惠国药品定价压力影响，商业生物制药研发预算在 2026 年面临更高宏观不确定性
              [CU013, CU014]。此外，Truveta 对关键客户持久性指标完全不透明：净收入留存率（NRR）、总收入留存率（GRR）、年度客户流失率和平均年度合同价值（ACV）均未公开披露
              [CU015]。战略收入也明显集中在 Regeneron 等锚定共研伙伴；其数百万美元承诺占非股权合作资本的较大份额，使公司在结构上依赖头部制药客户续约 [CU003, CU016]。
