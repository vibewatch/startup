chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与治理架构
        blocks:
          - type: paragraph
            body: >-
              Truveta, Inc. 总部位于华盛顿州 Bellevue，是一家医疗数据与情报公司，于 2020 年 9 月通过联合大型医疗系统的联盟模式成立 [CO001]。2018 年，Providence CEO
              Rod Hochman 医生提出这一构想；2020 年 3 月新冠疫情期间，前 Microsoft 高管 Terry Myerson、CTO Jay Nanduri 和 CMO Ryan Ahern
              医生将其落地。Providence、Advocate Health、Tenet Healthcare 和 Trinity Health 正式共同创立了 Truveta [CO001]。Truveta
              的治理体现成员所有者结构：董事会由 Henry Ford Health System 主持，并包括 Advocate Health、Tenet Health、AdventHealth、Northwell
              Health、CommonSpirit Health、Trinity Health、Providence Health 以及商业合作方 Pfizer 的高管 [CO005]。截至 2026 年末，创始 CEO
              Terry Myerson 已于 2026 年 9 月宣布退休，Truveta 正经历重大领导层交接；联合创始人 Jay Nanduri 和 Ryan Ahern
              医生在继续负责工程与生命科学合作的同时，出任临时联合 CEO [CO003, CO004]。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO005
              - CO009
              - CO011
              - CO012
      - number: '1.2'
        title: 临床规模、数据架构与产品能力
        blocks:
          - type: paragraph
            body: >-
              Truveta 汇集并标准化 30 家成员医疗系统的去标识化临床记录，覆盖数万家临床服务点 [CO002, CO008]。平台每天刷新电子健康记录（EHR），覆盖超过 130 million
              个患者旅程，并将其与已结案医疗理赔、诊断影像、社会经济因素（SDOH）和每日死亡率数据流连接 [CO007, CO008]。为消除不同医疗服务网络之间的数据碎片，Truveta 基于 Microsoft
              Azure 构建自有 AI 基础设施，包括多模态 Truveta Language Model 和 Truveta Intelligence。后者于 2026 年 4 月发布，是一套 AI
              分析界面，让生物制药、HEOR 和临床研究人员能用自然语言查询纵向患者队列，将原本需要数月的工作压缩到数分钟 [CO006, CO007]。商业采用已覆盖 100
              多家生命科学、医疗、学术和政府企业合作伙伴，其中包括 Pfizer 于 2022 年 6 月启动的多年期药物警戒合作等企业安全监测协议 [CO004, CO009]。
            claimRefs:
              - CO002
              - CO004
              - CO006
              - CO007
              - CO008
              - CO009
