      - number: '7.4'
        title: 缓释措施、监测指标与尽调路径
        blocks:
          - type: paragraph
            body: >-
              为降低治理、合规和技术层面的核心风险，Truveta 已在运营体系中部署结构化防护措施。治理风险主要由经验丰富的管理团队承担， 其中包括拥有超过 15 年医疗监管合规经验的总法律顾问 Simonne
              Lawrence，她曾任职于 Rite Aid 和 Elixir；以及首席产品官 Dr. Michael Simonov，他曾在 Yale New Haven Health 担任研究医疗信息官。Truveta
              Genome Project 的合规风险由 Regeneron Genetics Center 的严格协议合作和成熟的 HIPAA 去标识化框架共同管理。面向生命科学客户，Truveta 通过 Truveta
              Intelligence 推出自然语言查询，降低采购摩擦和获取证据的时间门槛。不过，潜在投资者仍需盯住明确的论点破坏触发器： Providence 或 Advocate Health
              等锚定医疗系统退出或暂停数据共享；监管机构正式调查遗传样本关联；或持续依赖服务交付， 使毛利率被压在可规模化软件的基准线以下。
            claimRefs:
              - CR013
              - CR014
              - CR016
