      - number: '2.4'
        title: 驱动因素、约束与估值关联
        blocks:
          - type: paragraph
            body: >
              需求来自重视时效和临床背景的工作流，包括试验可行性、上市后安全性、治疗模式监测和比较结局。Truveta 对 20,000 多名患者开展的 Rituxan 分析展示了一个覆盖 2018–2024
              年的具体用例，但公司将其结果标为初步且未经同行评审。法律、采购、隐私和专家分析要求则会抵消部分采用动力。一份竞争对比（并非独立基准）还指出定价不透明、需要专家分析师，因此这些内容只能作为假设，不能视为已核实的客户结果。就估值而言，证据支持平台期权价值和潜在广泛用户基础，但无法把数据触达转化为市场收入。在采用市场份额或收入倍数框架前，还需要当前
              ACV 分布、续约行为、服务投入强度、买方预算以及对齐后的 TAM/SAM/SOM。
            claimRefs:
