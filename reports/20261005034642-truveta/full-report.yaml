      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              The strongest buyer evidence is categorical rather than budgetary. Truveta names life-sciences,
              public-health, and healthcare organizations, and its life-science page maps use cases to trial teams,
              HEOR, safety, market-access, and R&D workflows. A lower-reputation interview guide further identifies
              HEOR, Medical Affairs, R&D, commercial analytics, technical data scientists, legal, procurement, and
              privacy teams as participants in enterprise sales. That source describes six-to-twelve-month,
              multi-stakeholder cycles, so the timing should be treated as directional rather than verified company
              disclosure. The adoption trigger is faster access to inspectable evidence: a company-issued 2026 release
              contrasts months of retrospective analysis with insights often delivered in minutes. Exact budget owners,
              payment sources, contract values, and the number of paying customers remain undisclosed; more than 100
              partner organizations is not equivalent to more than 100 paying accounts.
