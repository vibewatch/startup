  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >
              For diligence purposes, the evidenced market is narrower than healthcare data overall. It comprises
              enterprise access to de-identified real-world data, analytical workflows, and evidence services used for
              clinical trials, HEOR, safety, unmet-needs research, R&D, and care-quality analysis. Truveta's own
              materials identify life-sciences, public-health, and healthcare organizations as users, while a historical
              independent account says aggregated data would be sold to health systems, researchers, and others. This
              boundary includes data access, analytics, and study support; it excludes transactional EHR software,
              direct care delivery, laboratory testing, and CRO site execution unless commercial evidence shows Truveta
              earns revenue from them. Status-quo substitutes include internal retrospective analysis, claims-oriented
              datasets, registries, and bespoke services rather than only another AI interface.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >
              No assigned source provides a current dollar market estimate, CAGR, Truveta pricing schedule, or a
              defensible account-and-spend denominator for TAM, SAM, or SOM. The available numbers instead describe
              supply coverage and demonstrated analytical scale. Truveta reports 120 million patients represented in EHR
              data and 200 million in closed claims; these are distinct populations and must not be added. A leadership
              page separately reports more than 140 million patient journeys, without reconciling that denominator to
              the two product-page measures. Other scale indicators—7 billion-plus notes, 100 million-plus images, 30
              member health systems, more than 100 partner organizations, and a 20,000-plus-patient example study—show
              breadth, not addressable spend. The sizing figure therefore orders evidence layers conceptually and does
              not represent proportional, additive, or nested market segments.
