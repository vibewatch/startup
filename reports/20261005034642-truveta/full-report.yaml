      - number: '5.2'
        title: Product Line Map, Modules, and Delivery Assets
        blocks:
          - type: paragraph
            body: >
              Truveta packages its core data assets and analytical software into distinct commercial modules tailored to
              biopharma R&D, clinical trial operations, medical affairs, and health system benchmarking. The
              foundational data asset is Truveta Data, encompassing regulatory-grade longitudinal records from 120
              million to 140 million de-identified EHR patients linked with 200 million closed claims patients, 85
              million medical imaging studies across CT, MRI, X-ray, and ultrasound modalities, and over 5 billion
              clinician notes. Specialized data subsets include over 1 million matched mother-child pairs and the
              Truveta Genome Project, developed in partnership with the Regeneron Genetics Center to bank biospecimens
              and link exome sequencing with longitudinal phenotypic records.


              The software and access layers consist of Truveta Studio, Truveta Intelligence, and programmatic API
              endpoints. Truveta Studio serves as the primary analytical work environment for quantitative researchers,
              providing managed Spark clusters, concept identification tools, and export facilities for figures and
              tables. Truveta Intelligence serves as an enterprise decision layer, allowing non-technical leaders and
              clinical directors to query live care patterns and inspect underlying methodology and code sets. These
              modules are complemented by dedicated life sciences solutions for clinical trial feasibility
              modeling—reducing zero-enrollment sites—and post-market safety studies (PASS/PMR) designed to fulfill FDA
              commitments.
            claimRefs:
