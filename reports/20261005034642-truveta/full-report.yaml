      - number: '8.3'
        title: Valuation Scenarios, Comparable Benchmark Discipline, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Evaluating Truveta requires benchmarking against both publicly traded life sciences data analytics peers
              and high-profile private real-world data platforms. Public comparables display sharply bifurcated
              multiples: scaled profitable commercialization platforms such as Indegene trade at approximately 3.2x
              EV/Revenue and 22x EV/EBITDA ($1.5 billion market capitalization on $365 million revenue), while legacy
              EHR data and analytics vendors like Veradigm trade at depressed valuations of 0.9x EV/Revenue ($545
              million valuation on $588 million revenue) reflecting governance and data extraction challenges. Private
              peers such as HealthVerity ($721 million valuation) and Unite Us ($1.6 billion valuation) highlight strong
              enterprise demand for multi-source data integration networks. Given Truveta's unverified revenue baseline,
              our valuation framework models three distinct scenarios. The Bull Case assumes rapid biopharma
              subscription adoption for Truveta Intelligence and Truveta Genome Project exome data, unlocking $120
              million in ARR at an 18x multiple, yielding a $2.16 billion enterprise valuation. The Base Case models
              moderate enterprise expansion to $60 million in ARR at an 11x multiple, justifying a $660 million
              valuation that implies moderate down-round multiple compression against the $1.0 billion to $1.42 billion
              Series C mark. The Bear Case reflects prolonged life sciences sales cycles, data sovereignty resistance,
              and flat $30 million ARR valued at a distressed 5x multiple ($150 million valuation), triggering deep
              preference overhang dilution. Consequently, our recommendation is 'track' with a 'fair' valuation stance,
              requiring explicit verification of customer concentration and unit economics prior to committing growth
              capital.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
