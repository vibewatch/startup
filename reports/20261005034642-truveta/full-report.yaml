      - number: '7.4'
        title: Mitigations, Monitoring Indicators, and Diligence Paths
        blocks:
          - type: paragraph
            body: >-
              To mitigate core governance, compliance, and technological exposures, Truveta has instituted structured
              safeguards across its operational model. Governance risk is mitigated by an experienced executive bench
              including General Counsel Simonne Lawrence, who brings over 15 years of healthcare regulatory compliance
              experience from Rite Aid and Elixir, and Chief Product Officer Dr. Michael Simonov, formerly Medical
              Information Officer for Research at Yale New Haven Health. Compliance risks surrounding the Truveta Genome
              Project are managed through strict protocol partnerships with the Regeneron Genetics Center and
              established HIPAA de-identification frameworks. For life science customers, procurement friction is
              addressed through the release of natural language querying via Truveta Intelligence, reducing
              time-to-evidence barriers. Nevertheless, prospective investors must monitor clear thesis-break triggers:
              any defection or data-sharing pause by anchor health systems such as Providence or Advocate Health, formal
              regulatory inquiries into genetic specimen linkage, or persistent services reliance that caps gross
              margins below scalable software benchmarks.
            claimRefs:
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: CEO Succession and Consortium Governance Stability
            body: >-
              The retirement of founding CEO Terry Myerson in September 2026 places Truveta at a critical juncture.
              Sustaining alignment among 30 competing health system owners while scaling commercial software revenue
              requires an executive capable of navigating complex nonprofit healthcare politics, life science enterprise
              procurement, and high-performance cloud engineering.
            calloutType: risk
