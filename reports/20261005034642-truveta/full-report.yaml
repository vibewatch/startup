        title: Exhibits
        blocks:
          - type: callout
            title: Executive Succession and Commercial Governance Headwinds
            body: >-
              The retirement of founding CEO Terry Myerson in September 2026 introduces critical transition risk at a
              juncture when Truveta must convert capital-intensive genomic infrastructure into high-margin recurring
              software revenues. Managing a 30-member provider consortium alongside public commercial partners like
              Regeneron and Pfizer demands delicate balance between nonprofit health system ethics and private corporate
              profitability [CO003, CO005].
            calloutType: risk
            claimRefs:
              - CO003
              - CO005
          - type: callout
            title: Unmatched Provider-Governed Clinical and Genomic Data Gravity
            body: >-
              With 30 member health systems contributing continuous longitudinal EHR for over 130M patients, combined
              with a funded $320M initiative to sequence 10 million exomes via Regeneron, Truveta holds an unparalleled
              real-world data moat that is structurally insulated from traditional third-party aggregator scraping
              restrictions [CO007, CO008, CO012].
            calloutType: strength
            claimRefs:
              - CO007
              - CO008
