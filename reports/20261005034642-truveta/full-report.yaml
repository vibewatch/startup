        title: Exhibits
        blocks:
          - type: callout
            title: Provider Governance and Multimodal EHR-to-Notes Linkage
            body: >-
              Truveta's foundational technical strength is its consortium-backed governance and deep multimodal
              integration. Unlike claims aggregators that operate on delayed billing codes without clinical context,
              Truveta harmonizes structured EHR fields with over 5 billion clinical notes, 85 million imaging studies,
              and closed claims on a daily basis. The use of clinician-trained language models to unlock critical
              clinical metrics from notes provides a defensible data moat for complex epidemiological and real-world
              evidence studies.
            calloutType: strength
            claimRefs:
