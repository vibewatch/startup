            title: Customer Durability Metrics and Pricing Opacity Obscure Enterprise Retention
            body: >-
              While Truveta claims over 100 customer organizations and anchors relationships with top-tier pharma like
              Regeneron, management discloses no customer churn, net revenue retention (NRR), or contract renewal
              benchmarks. In an environment of biopharma budget scrutiny and federal drug pricing pressures, absence of
              verifiable retention metrics represents a critical private diligence gap.
            calloutType: risk
