              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Verdict: Track Pending Verified Commercial Execution'
            body: >-
              Truveta's provider consortium structure provides an unassailable data barrier to entry, but the lack of
              transparent ARR, gross margins, and customer retention metrics prevents establishing a high-confidence
              margin of safety at the current $1.0B to $1.42B valuation. Investors should track the asset until audited
              commercial revenue proof and permanent executive governance are established.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV011
              - CV014
          - type: callout
            title: 'Capital Structure Risk: $515 Million Senior Preference Overhang'
            body: >-
              With $515 million in total preferred equity raised—including $320 million in Series C preferred
              equity—common shareholders and employee stock options face substantial downside liquidation preference
              seniority, requiring an exit well in excess of current valuations to achieve venture-scale returns.
            calloutType: risk
