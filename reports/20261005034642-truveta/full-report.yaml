      - number: '8.2'
        title: Capitalization Structure, Financing Rounds, and Preference Overhang
        blocks:
          - type: paragraph
            body: >-
              Truveta has raised a cumulative total of $515 million in capital across four disclosed financing rounds
              since inception. In July 2021, the company closed an initial $95 million Series A funded roughly equally
              by its founding health system members, followed by a Microsoft-led Series A tranche and a $100 million
              Series B in November 2021. Most recently, on January 13, 2025, Truveta announced a pivotal $320 million
              Series C growth equity round, formally crossing unicorn thresholds at a post-money valuation reported at
              $1.0 billion in primary announcements and benchmarked at up to $1.42 billion in secondary market
              Certificate of Incorporation filings ($11.54 per share across 10.35 million Series C preferred shares).
              Crucially, the Series C introduced major strategic corporate partners alongside provider members,
              including Regeneron Pharmaceuticals committing $119.5 million and genomics leader Illumina contributing
              $20 million, with Microsoft Azure providing foundational AI cloud infrastructure. However, this heavy
              capitalization introduces a substantial liquidation preference overhang. The preferred equity stack holds
              seniority over common shares and options, meaning that in any liquidity event below $515 million, common
              shareholders and employee equity would experience severe impairment. In addition, the existence of interim
              leadership transitions adds organizational uncertainty during a critical commercial scale-up window.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
