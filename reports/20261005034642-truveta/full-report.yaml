  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Transition and Provider-Consortium Governance
        blocks:
          - type: paragraph
            body: >-
              Truveta's foundational moat—its ownership and governance by a collective of 30 major U.S. health system
              members—is simultaneously its primary organizational vulnerability. The company was founded in September
              2020 under the leadership of co-founder and former Microsoft executive Terry Myerson alongside interim
              co-CEOs Jay Nanduri and Dr. Ryan Ahern. In September 2026, Myerson announced his retirement as CEO,
              initiating an executive search for a permanent chief executive while Nanduri and Dr. Ahern assumed interim
              co-CEO responsibilities. Transitioning from a high-profile founding CEO with Microsoft executive standing
              to interim leadership introduces operational and strategic friction across Truveta's sprawling board of
              directors, which consists of health system C-suite executives representing Providence, Advocate Health,
              Tenet Healthcare, Trinity Health, Henry Ford Health System, and AdventHealth, alongside commercial
              stakeholders such as Pfizer. Member health systems contributed Series A capital and preferred equity under
              equal governance arrangements, creating structural coordination challenges. Should member health systems
              diverge in their strategic priorities, clinical informatics roadmaps, or secondary data-monetization
              policies, Truveta's governance mechanism could face deadlock or diminished member engagement.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
