      - number: '5.3'
        title: Architecture, Data Pipelines, and Engineering Operating Model
        blocks:
          - type: paragraph
            body: >
              Truveta's underlying technology architecture is engineered to ingest, harmonize, and continuously
              normalize petabyte-scale clinical data from disparate hospital electronic health record systems without
              commercial bias. The ingestion tier receives daily EHR feeds from 30 member health systems representing
              roughly 17% of US patient care. These feeds arrive across heterogeneous EHR systems (such as Epic, Oracle
              Health/Cerner, and others) containing structured tables, unstructured physician text, and DICOM imaging
              repositories. The data processing engine applies automated syntactic and semantic normalization pipelines
              to standardize clinical events into common terminologies including SNOMED-CT, ICD-10, RxNorm, NDC, LOINC,
              UCUM, and CPT/HCPCS codes.


              A critical differentiator within the processing layer is the Truveta Language Model (TLM), an AI model
              trained on over 80 million patient journeys with clinicians in the loop to achieve greater than 92%
              normalization accuracy across diagnoses, medications, lab values, and clinical concepts buried in
              unstructured notes. De-identification and patient identity resolution are handled by specialized Person
              Matching services, which link disparate encounters across health systems and integrate external closed
              claims, mortality databases, and social determinants of health (SDOH). The platform's software stack
              utilizes Microsoft Azure cloud services, Apache Spark big data clusters, C#/.NET Core microservices,
              NestJS, and React/TypeScript front-end applications, supporting secure distributed computing across global
              development centers including Bellevue, Washington, and Hyderabad, India.
            claimRefs:
              - CE008
              - CE009
              - CE010
