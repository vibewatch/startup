      - number: '7.2'
        title: Regulatory, Privacy, and Genetic Specimen Governance
        blocks:
          - type: paragraph
            body: >-
              Because Truveta aggregates electronic health records representing more than 120 million patients and over
              18% of daily clinical care in the United States, regulatory and compliance exposure represents an
              existential risk factor. Truveta's operating model relies upon HIPAA expert determination and
              de-identification standards to ensure patient anonymity across clinical encounters, linked closed claims,
              and admission-discharge-transfer records. However, increasing regulatory scrutiny from federal
              authorities, the FTC, and state health privacy regulators regarding re-identification risk in large
              multimodal datasets poses constant compliance pressure. This risk is amplified by the Truveta Genome
              Project, launched with 17 health system partners and commercial sponsors Illumina and Regeneron under a
              $320 million preferred equity financing round in January 2025. The initiative requires obtaining patient
              consent across U.S. clinical sites to link leftover biospecimens from routine clinical lab tests to
              de-identified EHR records for exome sequencing of up to 10 million volunteers. Any consent revocation,
              chain-of-custody discrepancy, or regulatory reinterpretation of biospecimen research under revised Common
              Rule or HIPAA privacy guidelines creates immediate legal and operational liability.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
