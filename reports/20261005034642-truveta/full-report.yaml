          - type: callout
            title: Cloud Infrastructure Lock-in and Pipeline Fragility
            body: >-
              Truveta's architecture is tightly coupled with Microsoft Azure infrastructure, Apache Spark big data
              environments, and daily data pipelines from 30 independent member health systems. Maintaining reliable,
              daily data normalization across diverse hospital IT environments creates substantial operational overhead.
              Furthermore, because researchers cannot export raw microdata from Truveta Studio, enterprise adoption
              relies on users adopting Truveta's managed cloud notebook environment for advanced modeling.
            calloutType: risk
