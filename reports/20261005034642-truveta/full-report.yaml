  - id: TE003
    title: Technology Stack, Operating Architecture, and Infrastructure Dependencies
    columns:
      - Architecture Layer
      - Component / Technology
      - Operational Role & Function
      - Core Upstream Dependency
      - Technical Risk / Diligence Concern
    rows:
      - - Ingestion & Federation Layer
        - Health System Connectors & Daily ETL Pipelines
        - Receives and ingests daily EHR, lab, notes, and DICOM images across 30 health systems.
        - Health system IT availability and secure egress pipelines.
        - Health system EHR interface schema updates or local data extraction pipeline failures.
      - - Semantic Harmonization Layer
        - Terminology Normalization Engine
        - Standardizes heterogeneous codes into SNOMED-CT, ICD, RxNorm, NDC, LOINC, and UCUM vocabularies.
        - Medical vocabulary ontologies and clinical curation rulesets.
        - Incomplete clinical mapping for bespoke institutional local codes and custom flowsheet items.
      - - Clinical AI & NLP Layer
        - Truveta Language Model (TLM)
        - Extracts structured clinical concepts (LVEF, stages, dosages) from 5B+ unstructured notes.
        - Large-scale GPU infrastructure and clinical-expert training labels.
        - Model drift, domain-specific hallucination risk, and accuracy degradation on rare medical conditions.
      - - Identity & Linkage Layer
        - Person Matching & Tokenization Service
        - De-identifies records and resolves patient identity across multiple health systems and external claims.
        - High-performance deterministic and probabilistic tokenization algorithms.
