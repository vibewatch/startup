  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Core Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Truveta presents a highly compelling strategic asset in the healthcare intelligence and life sciences data
              infrastructure ecosystem. The core thesis rests on its unparalleled proprietary data collective: founded
              in 2020 by major healthcare providers including Providence, Advocate Health, Tenet Healthcare, and Trinity
              Health, the consortium has expanded to 30 member health systems representing over 15% of all U.S. patient
              care. By aggregating de-identified daily-updated electronic health records across 120 million to 140
              million patient journeys—linked with closed claims, biospecimens, and social determinants of
              health—Truveta offers biopharma researchers and regulators regulatory-grade clinical depth that cannot be
              replicated by synthetic models or single-provider systems. The launch of the Truveta Genome Project with
              Regeneron and Illumina further introduces massive upside optionality by integrating exome sequencing for
              10 million volunteers into phenotypic records. Conversely, the anti-thesis centers on extreme operational
              and financial opacity. The company does not publicly disclose Annual Recurring Revenue (ARR), revenue
              run-rate, gross margins, cash burn, or net revenue retention. Furthermore, its unique governance
              structure—where 17+ health system members act simultaneously as equity owners, exclusive data
              contributors, board members, and prospective platform users—creates severe governance frictions, potential
              inter-member conflicts of interest, and high switching frictions that could impede aggressive commercial
              monetization or an unencumbered initial public offering.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
