            title: Dual-Sided Consortium Dynamics Create Unique Customer-Owner Flywheel
            body: >-
              Truveta's customer model differs fundamentally from traditional data brokers by establishing its data
              contributors as equity owners and governance partners. This structure aligns hospital incentives around
              data quality and continuous clinical note delivery, creating a self-reinforcing data moat that commercial
              biopharma buyers cannot replicate through public claims aggregators.
            calloutType: insight
