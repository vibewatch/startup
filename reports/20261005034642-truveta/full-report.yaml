      - number: '2.4'
        title: Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >
              Demand is supported by workflows where timeliness and clinical context matter: trial feasibility,
              post-market safety, treatment-pattern monitoring, and comparative outcomes. Truveta's 20,000-plus-patient
              Rituxan analysis illustrates a concrete use case across 2018–2024, but the company labels those findings
              preliminary and not peer reviewed. Adoption is counterweighted by legal, procurement, privacy, and
              specialist-analysis requirements. A competitor comparison—not an independent benchmark—also flags pricing
              opacity and the need for expert analysts, so those points are useful hypotheses rather than verified
              customer outcomes. For valuation, the evidence supports platform optionality and a potentially broad user
              base, but it cannot translate data reach into market revenue. Current ACV distribution, renewal behavior,
              services intensity, buyer budgets, and a reconciled TAM/SAM/SOM are required before applying a
              market-share or revenue-multiple framework.
