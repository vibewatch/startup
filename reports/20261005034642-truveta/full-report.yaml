  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Value Realization Surfaces
        blocks:
          - type: paragraph
            body: >
              Truveta's commercial and user ecosystem operates across two distinct but tightly coupled enterprise
              segments: commercial biopharmaceutical and life sciences customers, and provider member health systems
              that serve dual roles as data contributors, strategic equity owners, and clinical intelligence users. In
              the biopharmaceutical segment, enterprise buyers span global pharmaceutical developers, biotechnology
              firms, and medical device innovators. Commercial users deploy Truveta Data and Truveta Studio across
              targeted research workflows including health economics and outcomes research (HEOR), protocol feasibility
              modeling, and post-market safety surveillance [CU001, CU002]. Strategic biopharma partners, including
              Regeneron Pharmaceuticals and Illumina, have committed multi-million-dollar equity and research
              investments into multiomics and genomic data infrastructure through initiatives like the Truveta Genome
              Project [CU003, CU004].


              The provider segment consists of Truveta's collective of 30 US health systems, representing over 140
              million longitudinal patient journeys and 120 million electronic health record (EHR) lives linked to
              claims data [CU005, CU006]. While member health systems govern the company through board representation
              and data access agreements, their clinical and operational leaders also represent active customer users of
              Truveta's analytical surfaces. Health system operators leverage Truveta Studio and newly launched
              capabilities such as Truveta Intelligence to evaluate variation in care, monitor surgical infection rates,
              benchmark clinical outcomes, and enhance quality improvement across hospital networks [CU007, CU008].
              Additionally, academic research centers and public health organizations access regulatory-grade EHR and
              claims data to conduct epidemiologic research and address unmet medical needs [CU001, CU009].
            claimRefs:
              - CU001
              - CU002
