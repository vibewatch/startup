callouts:
  - calloutType: "risk"
    title: "Private Financial Metrics Create Severe Underwriting Blindspots"
    body: "Because Truveta is a privately held corporation funded by health-system consortium partners and venture investors, its actual annual recurring revenue, gross margins, and cash burn rate remain undisclosed. Secondary investment platforms indicate that no recent audited valuation or revenue numbers have been published, creating an underwriting hurdle where external capital providers must demand audited financial statements to confirm whether commercial revenue covers substantial cloud infrastructure and personnel commitments."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI012"
  - calloutType: "insight"
    title: "Consortium Governance Mitigates Raw Data Acquisition Costs"
    body: "Unlike aggregators that must purchase third-party claims or EHR extracts at market rates, Truveta was co-founded and funded by 30 member health systems. This governance architecture structurally mitigates raw data acquisition licensing costs, but converts that liability into substantial software engineering, de-identification compliance, and cloud hosting overhead to keep records continuously updated and normalized."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI007"
