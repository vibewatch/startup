        - Need to evaluate outcomes and access across real-world populations
      - - Clinical development
        - Pharmaceutical, biotechnology, or medical-device organization
        - Trial designers, feasibility teams, and clinical researchers
        - Exact owner is not disclosed; R&D or clinical-development budget is a diligence hypothesis
        - Feasibility modeling, cohort definition, site visibility, long-term follow-up
        - Trial delay, enrollment risk, or protocol uncertainty
      - - Safety and medical affairs
        - Life-sciences organization
