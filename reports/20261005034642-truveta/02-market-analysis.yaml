callouts:
  - calloutType: risk
    title: Coverage Is Not Addressable Revenue
    body: >
      Patient, note, image, organization, and health-system counts establish possible
      analytical breadth but do not supply customer budgets, prices, conversion, market
      share, or revenue. A dollar sizing model requires commercial evidence that is not
      present in the assigned pool.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
      - CM016
  - calloutType: insight
    title: Faster Evidence Faces a Slower Buying Process
    body: >
      The company positions its product around answers in minutes rather than months,
      while the retained sales guide describes legal, procurement, privacy, and
      specialist review over a six-to-twelve-month cycle. Product speed therefore does
      not imply rapid enterprise adoption.
    claimRefs:
      - CM011
      - CM012
