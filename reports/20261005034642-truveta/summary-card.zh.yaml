  topStrengths:
    - 独特的医疗机构治理联盟，让 Truveta 能持续获取来自 30 个医疗系统的纵向临床数据。
    - Truveta Genome Project 已获得资金支持，通往 1,000 万个外显子的路径为基因组学打开了较大上行空间。
    - Microsoft、Regeneron、Illumina 及核心医疗系统的强力战略支持，为继续扩张提供了支撑。
  topRisks:
    - 由于 ARR、毛利率、收入运行率和客户集中度均未披露，商业经济模型仍不透明。
    - 高管交接和多方治理可能拖慢决策，并造成协调摩擦。
    - 纵向健康数据与基因组数据的规模和关联方式，使隐私、同意和监管审查成为重大风险。
    - 对 Azure 和专用数据管道的依赖造成运营集中度和执行风险。
  unresolvedGaps:
    - 确切的 ARR、毛利率、烧钱速度和现金跑道尚无公开信息。
    - Microsoft 的战略投资金额及完整优先股堆叠尚未在公开信息中核对清楚。
    - 当前付费客户数、客户集中度和合同期限仍未披露。
    - 2026 年的准确员工数及按职能划分的成本结构尚无公开信息。
