callouts:
  - calloutType: insight
    title: Dual-Sided Consortium Dynamics Create Unique Customer-Owner Flywheel
    body: Truveta's customer model differs fundamentally from traditional data brokers by establishing its data contributors as equity owners and governance partners. This structure aligns hospital incentives around data quality and continuous clinical note delivery, creating a self-reinforcing data moat that commercial biopharma buyers cannot replicate through public claims aggregators.
    claimRefs:
      - CU005
      - CU006
      - CU007
  - calloutType: risk
    title: Customer Durability Metrics and Pricing Opacity Obscure Enterprise Retention
    body: While Truveta claims over 100 customer organizations and anchors relationships with top-tier pharma like Regeneron, management discloses no customer churn, net revenue retention (NRR), or contract renewal benchmarks. In an environment of biopharma budget scrutiny and federal drug pricing pressures, absence of verifiable retention metrics represents a critical private diligence gap.
    claimRefs:
      - CU006
      - CU013
      - CU015
