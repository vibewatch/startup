evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating financials and contract metrics
    missingEvidence: >-
      Audited financial statements detailing ARR, SaaS gross margin, cash burn rate, compute expenses, and contract
      duration.
    whyItMatters: >-
      Essential to determine whether Truveta's $1B+ valuation is supported by sustainable software economics versus
      capital-intensive data ingestion and compute subsidies.
    diligencePath: >-
      Request confidential disclosure of GAAP financial statements, trailing twelve-month revenue, and Microsoft Azure
      cloud hosting credit commitments.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: executive succession timeline
    missingEvidence: >-
      Official announcement of permanent Chief Executive Officer appointment following Terry Myerson's September 2026
      retirement.
    whyItMatters: >-
      Long-term strategy and commercial execution depend on permanent executive leadership alignment across the 30
      member health systems.
    diligencePath: Monitor Truveta board communications, press releases, and executive filings regarding CEO selection.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder and investor cap table completeness
    missingEvidence: >-
      Complete cap table and preference stack reconciling all 30 member health systems, Microsoft equity, and Series C
      liquidation preferences.
    whyItMatters: Determines economic waterfall, voting control, and health system governance rights.
    diligencePath: Review certificate of incorporation and preferred share terms under confidential diligence.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: dollar-market-sizing
    missingEvidence: >
      A current independent market estimate with a defined category, geography, period, spend denominator, value, and
      CAGR, plus a Truveta-specific SAM/SOM bridge.
    whyItMatters: >
      Data coverage cannot be converted into addressable revenue or obtainable market share without buyer counts,
      budgets, prices, and conversion assumptions.
    diligencePath: >
      Obtain a category-specific independent market study and reconcile it to Truveta's current price book, account
      universe, sales capacity, and win rates.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-denominators
    missingEvidence: >
      Current ACV distribution, pricing basis, services mix, renewal rates, paying customer count, contract duration,
      and department-level budget ownership.
    whyItMatters: >
      These measures determine whether the broad set of users and partners produces repeatable, scalable software-like
      revenue.
    diligencePath: >
      Review anonymized contracts, invoices, renewal cohorts, pipeline-stage data, price lists, and budget-owner
      interviews by customer segment.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: coverage-denominators
    missingEvidence: >
      A dated metric dictionary reconciling 120M EHR patients, 200M closed-claims patients, and more than 140M patient
      journeys, including overlap and refresh cadence.
    whyItMatters: >
      The figures use different metric names and may overlap, so combining them would overstate platform reach and
      corrupt any bottom-up sizing model.
    diligencePath: >
      Request the current coverage methodology, deduplication rules, cohort inclusion criteria, and metric change log
      from Truveta.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-benchmarks
    missingEvidence: >-
      Standardized list pricing schedules, tier definitions, and annual contract value ranges for Truveta Data and
      Truveta Intelligence subscriptions.
    whyItMatters: >-
      Without public rate cards or disclosed average selling prices, sponsors and investors cannot benchmark Truveta's
      software margin profile or price competitiveness against IQVIA, Flatiron, or Tempus.
    diligencePath: Review redacted life science vendor RFP price proposals and customer contracts during procurement diligence.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: historical-patient-coverage
    missingEvidence: >-
      Exact reconciliation between reported 120M, 130M, and 140M active longitudinal EHR patient journey figures across
      various 2026 official publications.
    whyItMatters: >-
      Different official web pages cite varying active EHR patient denominators (120M on life sciences solutions, 130M
      in intelligence announcements, 140M in leadership biographies), impacting cohort size calculations.
    diligencePath: Request exact active, unique, and de-duplicated patient cohort counts from Truveta clinical informatics audits.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-metrics-opacity
    missingEvidence: >-
      Audited financial statements detailing Truveta's GAAP annual revenue, annual recurring revenue (ARR), gross margin
      percentage, and net cash burn.
    whyItMatters: >-
      Without audited financial statements, investors cannot evaluate whether Truveta's revenue run rate is sufficient
      to cover high cloud compute, genomics processing, and staffing expenses.
    diligencePath: >-
      Request confidential disclosure of audited fiscal year income statements, cash flow statements, and management
      accounts during private diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: clinical-nlp-benchmarking
    missingEvidence: >-
      Independent third-party empirical benchmarks comparing Truveta Language Model (TLM) entity extraction and concept
      mapping accuracy against open-source models like medspaCy or BioBERT.
    whyItMatters: >-
      Obscures whether Truveta's proprietary NLP maintains superior precision and recall across rare disease indications
      compared to standard foundation model baselines.
    diligencePath: >-
      Request blinded validation study results, F1 score distributions across note types, and human-in-the-loop audit
      logs during technical diligence.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Exact enterprise customer count, net revenue retention (NRR), gross retention (GRR), and churn rates across
      biopharma data licensing cohorts.
    whyItMatters: >-
      Obscures underlying customer durability, lifetime value (LTV), and expansion velocity across the 100+ cited
      partner organizations.
    diligencePath: >-
      Request audited cohort retention schedules, annualized contract values (ACVs), and expansion waterfall reports
      during private diligence.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Full enumeration of commercial biopharmaceutical licensees and paying life science accounts outside disclosed
