    whyItMatters: >-
      Without verified ARR and burn rates, valuation multiples cannot be anchored to audited operating performance,
      preventing a definitive 'buy' recommendation.
    diligencePath: >-
      Request confidential CIM or audited GAAP financial statements from management under NDA prior to any investment
