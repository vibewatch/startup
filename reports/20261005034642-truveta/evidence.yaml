    whyItMatters: >-
      Prevents verifying commercial biopharma market penetration beyond anchor equity and co-development partners like
      Regeneron.
    diligencePath: >-
      Review redacted biopharma customer rosters and master services agreement (MSA) schedules during management
      diligence.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: revenue-runway
    missingEvidence: >-
      Audited financial statements detailing Truveta's current GAAP revenue, software ARR, gross margins, cash burn
