callouts:
  - calloutType: "strength"
    title: "Consortium Governance Creates Structural Data Supply Moat"
    body: "Truveta's ownership by 30 leading health systems provides an enduring structural advantage over independent third-party aggregators. Because member health systems are equity owners and board participants, Truveta secures direct, continuously updated EHR data pipelines that third-party data brokers cannot easily replicate through transactional vendor contracts."
    claimRefs:
      - "CP001"
      - "CP006"
      - "CP009"
  - calloutType: "risk"
    title: "Services Dependency and Pricing Opacity Limit Self-Service Adoption"
    body: "Despite marketing Truveta Studio and Truveta Intelligence as natural-language self-service tools, procurement analyses indicate that regulatory-grade submissions and complex cohort definitions continue to require Truveta Evidence Services engagements. Undisclosed enterprise pricing models and expansion costs increase total cost of ownership uncertainty for life science sponsors."
