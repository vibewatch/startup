chapter:
  number: 5
  title: "Product & Technology"
  summary: "Truveta delivers a cloud-based real-world clinical data and analytics ecosystem linking electronic health records, claims, imaging, and multiomics across more than 120 million patients. Powered by continuous daily harmonization, proprietary clinical language models, and its browser-based Truveta Studio and Truveta Intelligence environments, the platform transforms fragmented provider documentation into regulatory-grade evidence while managing significant dependencies on Azure infrastructure and specialized consortium integration pipelines."
sections:
  - id: product-definition-and-clinical-workflow
    title: Product Definition in Customer Workflow Terms
    body: >
      Truveta operates as a healthcare clinical data, real-world evidence (RWE), and clinical intelligence platform built upon a governed consortium of 30 leading US health systems. In enterprise customer workflow terms, Truveta bridges the structural divide between transactional healthcare delivery and secondary scientific research. For life sciences researchers, health economists, and clinical development teams, the platform replaces protracted, months-long retrospective data requests with continuous access to longitudinal patient journeys. The workflow spans hypothesis generation, cohort definition via semantic concept mapping and ATHENA vocabularies, cohort snapshotting, and cloud-based statistical execution in PySpark or R.


      The end-to-end user workflow centers on Truveta Studio and the recently launched Truveta Intelligence application. In Truveta Studio, clinical researchers define precise patient cohorts using structured criteria alongside unstructured clinical measurements extracted from clinician notes, such as left ventricular ejection fraction (LVEF) percentages or NYHA heart failure classifications. Users run analytical queries within browser-based cloud notebooks without exporting patient-level files, enforcing data security while facilitating fast iteration. With Truveta Intelligence, introduced in April 2026, scientific and commercial teams pose natural-language questions to examine treatment patterns, safety signals, and care variations, receiving transparent, auditable cohort summaries within minutes rather than waiting months for retrospective reporting.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE002
    figureRefs: []
  - id: product-line-and-asset-matrix
    title: Product Line Map, Modules, and Delivery Assets
    body: >
      Truveta packages its core data assets and analytical software into distinct commercial modules tailored to biopharma R&D, clinical trial operations, medical affairs, and health system benchmarking. The foundational data asset is Truveta Data, encompassing regulatory-grade longitudinal records from 120 million to 140 million de-identified EHR patients linked with 200 million closed claims patients, 85 million medical imaging studies across CT, MRI, X-ray, and ultrasound modalities, and over 5 billion clinician notes. Specialized data subsets include over 1 million matched mother-child pairs and the Truveta Genome Project, developed in partnership with the Regeneron Genetics Center to bank biospecimens and link exome sequencing with longitudinal phenotypic records.


      The software and access layers consist of Truveta Studio, Truveta Intelligence, and programmatic API endpoints. Truveta Studio serves as the primary analytical work environment for quantitative researchers, providing managed Spark clusters, concept identification tools, and export facilities for figures and tables. Truveta Intelligence serves as an enterprise decision layer, allowing non-technical leaders and clinical directors to query live care patterns and inspect underlying methodology and code sets. These modules are complemented by dedicated life sciences solutions for clinical trial feasibility modeling—reducing zero-enrollment sites—and post-market safety studies (PASS/PMR) designed to fulfill FDA commitments.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
    tableRefs:
      - TE001
    figureRefs: []
  - id: architecture-and-operating-model
    title: Architecture, Data Pipelines, and Engineering Operating Model
    body: >
      Truveta's underlying technology architecture is engineered to ingest, harmonize, and continuously normalize petabyte-scale clinical data from disparate hospital electronic health record systems without commercial bias. The ingestion tier receives daily EHR feeds from 30 member health systems representing roughly 17% of US patient care. These feeds arrive across heterogeneous EHR systems (such as Epic, Oracle Health/Cerner, and others) containing structured tables, unstructured physician text, and DICOM imaging repositories. The data processing engine applies automated syntactic and semantic normalization pipelines to standardize clinical events into common terminologies including SNOMED-CT, ICD-10, RxNorm, NDC, LOINC, UCUM, and CPT/HCPCS codes.


      A critical differentiator within the processing layer is the Truveta Language Model (TLM), an AI model trained on over 80 million patient journeys with clinicians in the loop to achieve greater than 92% normalization accuracy across diagnoses, medications, lab values, and clinical concepts buried in unstructured notes. De-identification and patient identity resolution are handled by specialized Person Matching services, which link disparate encounters across health systems and integrate external closed claims, mortality databases, and social determinants of health (SDOH). The platform's software stack utilizes Microsoft Azure cloud services, Apache Spark big data clusters, C#/.NET Core microservices, NestJS, and React/TypeScript front-end applications, supporting secure distributed computing across global development centers including Bellevue, Washington, and Hyderabad, India.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
