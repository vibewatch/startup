    title: Truveta Product Modules, Data Assets, and Technical Maturity Matrix
    columns:
      - Module / Asset
      - Target User / Buyer
      - Maturity Status
      - Core Capability & Technical Differentiation
      - Diligence Gap / Technical Limitation
    rows:
      - - Truveta Data Core EHR
        - Life sciences HEOR, clinical epidemiologists, health system researchers
        - Production
        - Daily updated EHR records for 120M+ patients across 30 health systems; standardized to SNOMED, RxNorm, LOINC.
        - Geographic coverage reflects member health system distribution; variation across non-consortium care settings.
      - - Truveta Studio
        - Data scientists, quantitative researchers, biostatisticians
        - Production
        - Browser-based cloud analytics workspace supporting PySpark, SparkR, and SQL; integrated Athena/concept search tools.
        - Raw patient-level data export prohibited; compute constrained to managed cloud notebook sessions.
      - - Truveta Intelligence
        - Medical affairs leads, clinical trial directors, health system executives
        - Emerging (Launched 2026)
        - Natural-language query interface delivering cohort analytics and care variation insights in minutes.
        - Query scope limited to predefined clinical data aggregates; complex custom phenotypes still require Studio.
      - - Unstructured Notes NLP (TLM)
        - Life sciences researchers requiring rich clinical phenotyping
        - Production
        - Clinical language model trained on 80M+ journeys extracting concepts (e.g., LVEF, cancer stage, NYHA class) at >92% accuracy.
        - Independent third-party NLP benchmark evaluations against open clinical foundation models remain unpublished.
      - - Multimodal Imaging Studies
        - Imaging AI researchers, radiology and oncology investigators
        - Production
        - 85M+ DICOM imaging studies (CT, MRI, X-ray, ultrasound, PET) searchable by modality and protocol integrated with EHR.
        - High bandwidth requirements and specialized tooling needed for bulk deep learning model training.
      - - Truveta Genome Project
        - Genomics R&D, precision medicine teams, target discovery scientists
        - Scaling
        - Biospecimen collection linked with Regeneron Genetics Center sequencing and longitudinal clinical EHR phenotypes.
        - Sequencing throughput and multiomics coverage currently scaling across consortium patient cohorts.
      - - Closed Claims Linkage
        - Health economists, market access teams, pharmacovigilance leads
        - Production
        - Tokenized integration linking 120M EHR patients with 200M closed claims lives, SDOH, and mortality registries.
        - Tokenization linkage match rates and claims adjudication lag vary across external payer sources.
    notes: "Product portfolio synthesized from official life sciences solutions, academic presentations, and published technical foundations."
