callouts:
  - calloutType: strength
    title: Provider Governance and Multimodal EHR-to-Notes Linkage
    body: Truveta's foundational technical strength is its consortium-backed governance and deep multimodal integration. Unlike claims aggregators that operate on delayed billing codes without clinical context, Truveta harmonizes structured EHR fields with over 5 billion clinical notes, 85 million imaging studies, and closed claims on a daily basis. The use of clinician-trained language models to unlock critical clinical metrics from notes provides a defensible data moat for complex epidemiological and real-world evidence studies.
    claimRefs:
      - CE001
      - CE008
      - CE010
      - CE013
  - calloutType: risk
    title: Cloud Infrastructure Lock-in and Pipeline Fragility
    body: Truveta's architecture is tightly coupled with Microsoft Azure infrastructure, Apache Spark big data environments, and daily data pipelines from 30 independent member health systems. Maintaining reliable, daily data normalization across diverse hospital IT environments creates substantial operational overhead. Furthermore, because researchers cannot export raw microdata from Truveta Studio, enterprise adoption relies on users adopting Truveta's managed cloud notebook environment for advanced modeling.
    claimRefs:
      - CE003
      - CE008
      - CE011
      - CE014
