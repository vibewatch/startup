  - id: TE002
    title: Clinical Research and Enterprise Workflow Use-Case Analysis
    columns:
      - User Persona & Job
      - Current / Status-Quo Workflow
      - Truveta Platform Solution
      - Measurable Operational Benefit
      - Technical Limitation / Dependency
    rows:
      - - Biopharma Clinical Trial Designer (Feasibility)
        - Retrospective feasibility surveys sent to trial sites; static claims analysis lacking clinical notes.
        - Dynamic cohort simulation across 120M+ patients; tests inclusion/exclusion criteria against real-time lab/EHR data.
        - Prevents failed protocol designs and minimizes zero-enrollment clinical trial sites.
        - Dependent on completeness of structured and unstructured EHR fields across participating health systems.
      - - Health Economics & Outcomes Researcher (HEOR)
        - Licensing static 6-to-12-month-old claims datasets lacking unstructured clinical severity metrics.
        - Longitudinal analysis of linked EHR and closed claims data in Truveta Studio using PySpark and SQL.
        - Enables robust comparative effectiveness and cost-effectiveness dossiers for regulatory and payer submission.
        - Statistical queries must run inside cloud notebooks; cannot export microdata for local proprietary tooling.
      - - Pharmacovigilance / Safety Epidemiologist
        - Spontaneous reporting systems (FAERS) and delayed retrospective registry analysis.
        - Continuously refreshed daily EHR records and automated adverse event signal identification.
        - Accelerates post-market safety study (PASS/PMR) timelines and enables proactive risk evaluation.
        - Requires clinical expert adjudication for ambiguous NLP concept extractions from clinician notes.
      - - Medical Affairs / Clinical Strategist
        - Commissioning custom consulting engagements taking 3 to 6 months to answer basic treatment pattern questions.
        - Self-service natural language queries in Truveta Intelligence with full inspection of code sets and data cohorts.
        - Delivers real-world evidence answers and treatment switching trends in minutes rather than months.
        - Restricted to parameterized query types and established analytical cohorts; does not replace de novo study design.
    notes: "Workflow patterns based on Truveta life sciences documentation, NCI journal club demonstrations, and ISPOR research presentations."
    claimRefs:
