callouts:
  - calloutType: "insight"
    title: "Spend Orchestration Decouples Employee Intake from System of Record Rigidity"
    body: "Zip's core strategic market value proposition is not replacing entrenched ERP systems like SAP or Workday, but rather sitting as an intelligent orchestration layer above them. By providing an intuitive, consumer-grade intake experience for employees while enforcing strict multi-departmental compliance rules across legal, IT, and finance, Zip captures enterprise procurement demand at the point of origin."
    claimRefs:
      - "CM001"
      - "CM006"
      - "CM014"
  - calloutType: "risk"
    title: "Opaque Software ARR and Incumbent Feature Convergence Create Diligence Blindspots"
    body: "While Zip publicly promotes processing between $500 billion and $1 trillion in cumulative spend, it maintains strict confidentiality regarding its recurring software ARR, gross margins, and customer retention. With major procurement suite incumbents aggressively launching native intake and workflow modules, Zip faces intense pressure to defend its standalone orchestration pricing and prove durable software margins."
    claimRefs:
      - "CM004"
      - "CM007"
      - "CM008"
