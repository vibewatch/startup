      - "Key Risks & Downside Triggers"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "ARR scales from ~$100M to $180M+ at 60%+ CAGR; AI Superagents drive 130%+ net revenue retention; margins expand toward 75%."
        - "20x–25x forward ARR; implied valuation of $3.6B–$4.5B (64%–105% upside)."
        - "Execution missteps in EMEA; enterprise procurement budgets freeze; AI agent liability or security incidents."
        - "Low to Moderate (20%–25%)"
      - - "Base Case"
        - "ARR grows at sustainable 35%–45% CAGR to $115M–$140M; gross margins stabilize near 65%–70%; modest churn in mid-market."
        - "14x–16x forward ARR; implied valuation of $1.8B–$2.2B (-18% to 0% return)."
        - "Long sales cycles in Fortune 500 accounts; competitive pricing pressure from Coupa and ServiceNow."
        - "Moderate to High (50%–55%)"
      - - "Bear Case"
        - "ARR growth slows to <20% at ~$75M; ERP suites bundle native intake tools; customer churn accelerates as contract renewals come due."
        - "8x–10x ARR multiple; implied valuation of $750M–$1.0B (55%–66% downside)."
        - "Severe down-round dilution; liquidation preference overhang impairs junior equity holders; talent departures."
        - "Moderate (25%–30%)"
    notes: "Scenario valuations model illustrative ARR bands given private company non-disclosure; multiples referenced against enterprise SaaS and procurement automation peer benchmarks."
