        - label: 4. 合同价值扩张
          detail: 年度合同价值随管理支出规模、用户人数和集成层级增长（约 $82K ACV）
        - label: 5. 高软件毛利率
          detail: 纯云架构使订阅费毛利率估计达到 80% 至 90%
        - label: 6. 客户扩张与留存
          detail: 模块附加销售和席位扩张带动客户终身价值及潜在 NRR 上行空间
        - label: 7. 研发与企业 GTM 再投资
          detail: 毛利润为持续开发 AI agent、开设国际办公室和企业直销提供资金
    approximationNotes: 毛利率画像和合同扩张因素反映私营市场软件基准估计。
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI015
  - id: FE001
    title: 企业采购编排技术栈
    type: stack
    summary: Zip 企业采购平台的架构层，展示从用户交互到底层系统记录的数据流。
    data:
      layers:
        - label: 交互与 agent 层
          detail: 员工请求接收界面、Slack/Teams 对话机器人、Superagents 和 Zip MCP 服务器
        - label: 编排与治理层
          detail: 条件式审批路由、政策合规引擎、自动审计轨迹和安全检查
        - label: 集成与连接器层
          detail: 原生 App Studio、100 多个预构建集成模板、经认证的 REST API 和平面文件管道
        - label: 企业系统记录层
          detail: 底层 ERP（SAP、NetSuite、Workday）、CLM（DocuSign、Ironclad）和财务账簿
        - label: 采购智能层
          detail: 标准化支出库、合同条款库和持续合规遥测
        - label: 基础设施与身份基础层
          detail: 多租户云托管、SOC 合规控制和企业 IdP 集成
    approximationNotes: 概念性功能栈综合 Zip 能力概览、集成矩阵和技术文档整理而成。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从请求发起到多部门采购扩张的六阶段企业采用旅程。
    data:
      items:
        - label: 1. 发起请求接收
          detail: 业务员工通过自助请求接收门户或聊天提交采购申请。
          tone: neutral
        - label: 2. 政策路由
          detail: 平台自动评估企业采购规则、合规要求和预算上限。
          tone: positive
        - label: 3. Superagent 审阅
          detail: 自主采购 agent 分析供应商风险、解析合同条款并起草审批意见。
          tone: positive
        - label: 4. 系统集成
          detail: Optis 或 SI 合作伙伴将获批采购订单接入 SAP 或 Coupa 等 ERP 系统。
          tone: neutral
        - label: 5. 支出执行
          detail: 采购团队敲定采购订单、记录行项目并建立发票匹配。
          tone: positive
        - label: 6. 账户扩张
          detail: 成功的部门请求接收会推动更广泛的多部门和全球部署。
          tone: warning
    approximationNotes: 工作流反映实施合作伙伴记录的标准请求接收到付款架构；具体审批时延因企业政策而异。
    claimRefs:
      - CU006
      - CU009
  - id: FR001
    title: 企业风险严重性与可能性矩阵
    type: matrix
    summary: 按可能性、严重性和缓解成熟度评估主要业务、技术、法律及财务风险因素。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键监管暴露
          values:
            - label: 州级放贷许可问询
            - label: 跨境支付合规审查
            - label: 消费者真实贷款方原则挑战
        - label: 核心企业集成依赖
          values:
            - label: 合同管理 API 变更
            - label: 企业身份与 SSO 中断
            - label: ERP 集成 API 弃用与速率限制
        - label: 运营与产品能力缺口
          values:
            - label: 企业工作流表单配置延迟
            - label: 应计与结账支持局限
            - label: 应付账款三方匹配缺口
        - label: Agentic AI 执行与质量
          values:
            - label: 动态模型推理中断
            - label: 快速节奏下 1,200 项功能回归
            - label: 自主 agent 审批漂移
        - label: 财务不透明度与市场倍数风险
          values:
            - label: 企业采购 SaaS 宏观环境走弱
            - label: 估值倍数压缩风险
            - label: 未核实 ARR 与利润率披露审视
        - label: 生态通信依赖
          values:
            - label: 邮件接收解析回归
            - label: 协作 webhook 延迟
            - label: Slack / Teams 通知中断
    approximationNotes: 可能性和严重性分类是依据已发布的分析师笔记、Fitch 评级和竞争对手拆解得出的定性评估。
    claimRefs:
      - CR001
      - CR004
      - CR007
      - CR011
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将企业规模证据和未核实的单位经济连接到“跟踪”立场的决策框架。
    data:
      nodes:
        - id: N1
          label: 企业规模证据
          detail: 已在 7M+ 家供应商中处理累计超过 $500B 的支出，并获得 Tier-1 客户采用。
        - id: N2
          label: Agentic AI 产品护城河
          detail: 由 50 多个受治理 Superagents 组成的套件，打通审批链并推动从请求接收到付款的自动化。
        - id: N3
          label: 财务不透明度障碍
          detail: ARR、净留存率、毛利率和现金消耗率均无公开披露。
        - id: N4
          label: 估值基准
          detail: D 轮交易价格对应 $2.2B 投后估值，隐含 22x–35x 的高 ARR 倍数。
        - id: N5
          label: 在位者压缩风险
          detail: SAP、Coupa 和 ServiceNow 正推出原生请求接收编排模块。
        - id: N6
          label: 建议：跟踪
          detail: 在 ARR 规模、群组留存和资本表条款得到核实前，保持纪律性的观望姿态。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV010
      - CV013
