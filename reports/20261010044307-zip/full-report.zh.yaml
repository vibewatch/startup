        title: 资本化历程、估值与利益相关者结构
        blocks:
          - type: paragraph
            body: >-
              Zip 的机构资本化反映出自 2021 年成立以来连续风险投资轮次带来的快速股权积累。继 Y Combinator 领投的 $7 million 种子轮之后 [CO002]，Zip 于 2022 年 5 月完成
              $43.3 million 的 Series B，用于加快企业 ERP 和合同系统的软件集成 [CO003]。2023 年 5 月，成长型股权公司 BOND Capital 领投 $100 million 的
              Series C 融资 [CO004]；2024 年 10 月，公司又完成 $190 million 的 Series D，确立 $2.2 billion 的参考投后估值，使累计已披露资本超过 $330
              million [CO005]。机构股东包括 Y Combinator、Y Combinator Continuity、BOND Capital、Tiger Global Management 和
              CRV。虽然这套资本化结构证明公司持续获得顶级风投支持，但详细的 cap table 权利、清算优先级和二级交易折扣仍未向公众披露。
