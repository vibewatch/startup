  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 采购编排与需求流程
        blocks:
          - type: paragraph
            body: >-
              Zip 是一个需求到采购的编排平台，位于传统企业记录系统之上。在传统企业采购环境中，想要采购软件、硬件或专业服务的员工，需要在 ERP、合同生命周期管理（CLM）和 IT 工单工具之间走碎片化的需求路径。Zip
              提供消费级需求门户和对话式界面，让申请人发起支出动作。平台根据采购类别、金额阈值和供应商风险画像，自动决定法务、财务、IT、安全和采购利益相关方之间的审批路由。Zip 声称在承诺发生前拦截采购请求，已处理超过
              $500 billion 企业支出，并为客户节省超过 $10 billion。但客户可见性和流程透明度虽被认为显著优于传统工具，Zip 仍依赖底层 ERP
              和会计系统完成最终交易记录与结算，因此编排能否成功高度取决于其中间件的可靠性和双向同步。
            claimRefs:
