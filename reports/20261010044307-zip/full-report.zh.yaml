  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围定义与类别排除
        blocks:
          - type: paragraph
            body: >-
              企业支出编排市场已经成为独立的软件层，专门解决传统企业采购系统长期存在的易用性和治理摩擦。过去，大型公司要求员工在申请软件、服务或设备时使用复杂僵硬的企业资源计划（ERP）或
              Source-to-Pay（S2P）套件，如 SAP、Coupa 或 Oracle。实际结果是运营瓶颈、员工普遍不合规以及失控的影子采购。Zip
              率先把需求收集与后台记录系统解耦，打造从需求到付款的支出编排，通过直观、消费级的流程界面，在发出采购订单前将请求送过法务、信息安全、财务和采购的强制检查点。

              定义这一市场，首先要划清类别边界。可寻址的支出编排市场涵盖 B2B
              软件订阅、企业需求路由、合同审批协同、自动发票编码和供应商信息管理，服务对象是中端市场和企业组织。市场严格排除商业和金融非结构化数据中出现的若干同名市场，具体包括消费金融服务、消费分期债务，以及 ASX 上市的
              Zip Co Limited（ASX: ZIP）等零售先买后付（BNPL）平台。此外，实体包装市场——例如 $12.5 billion
              的全球拉链袋行业——以及分析邮政编码人口统计的地理空间分析平台，属于完全无关的运营领域，不纳入支出管理软件市场规模。
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM010
              - CM011
              - CM012
      - number: '2.2'
        title: 市场规模框架、TAM/SAM/SOM 分析与增长基准
        blocks:
          - type: paragraph
            body: >-
              估算企业支出编排市场，需要从宏观企业交易流一路拆到软件厂商的收入捕获。从宏观经济的最大口径看，全球企业对企业（B2B）支出每年超过 $100
              trillion。在这个庞大范围内，企业每年估计在间接采购、商务差旅、外部专业服务、软件订阅和硬件基础设施上支出 $10 trillion 至 $15
              trillion。这种分散采购形成了采购和财务团队必须监控、治理并优化的交易底盘。

              用于捕获和管理这类支出的软件层正在快速扩张。全球企业采购、寻源和支出管理软件的总可寻址市场（TAM）约为 $15 billion 至 $20 billion，复合年增长率为 9% 至 12%。在更广泛的 TAM
              中，现代支出编排、需求自动化和 AI 采购套件在北美及 EMEA 的可服务可寻址市场（SAM）约为 $4.0 billion 至 $7.0 billion。对 Zip
              可服务可获得市场（SOM）的估算显示，寻求现代编排层的中大型企业对应 $1.2 billion 至 $2.5 billion 的可寻址 ARR 池。Zip 公开强调其在 AMD、Anthropic 和
              Discover 等企业累计处理超过 $500 billion 至 $1 trillion 的支出，并以 $2.2 billion 估值完成 $190 million Series
              D；但公司仍为私下财务披露，经过审计的订阅 ARR 和净收入留存仍是关键尽调事项。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
              - CM013
      - number: '2.3'
        title: 买方分层、跨职能审批链与预算动态
        blocks:
          - type: paragraph
            body: >-
              采购编排软件具有独特的多利益相关方组织动态：软件采用覆盖整个企业，但采购和预算所有权仍集中在公司管理层。中型企业的主要经济买方通常是首席采购官（CPO）、全球采购副总裁或财务副总裁。他们要对支出可见性、供应商合同谈判、采购周期和运营人效负责。但软件终端用户覆盖每一位发起采购请求的员工，从为开发工具办理入职的工程师，到聘请创意机构的营销经理。

              企业采购触及多个治理领域，因此审批流程需要在不同职能孤岛间紧密编排。员工提交申请后，Zip 平台会并行协调公司法务（合同条款和责任上限）、信息安全（SOC 2、GDPR
              和供应商漏洞合规）、IT（企业架构适配和许可证冗余）以及财务（预算核验和付款条款）的审查。2026 年 6 月，Forrester Consulting 的 Total Economic Impact
              研究显示，大型企业通过编排这些复杂流程可实现 386% ROI、受管理支出的 3.3% 节省，并在六个月内收回成本。Zip 于 2026 年推出自主 AI
              Superagents，目标是在既有审批规则内自动完成常规发票路由和尾部支出合同修订。
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM014
      - number: '2.4'
        title: 采用驱动因素、在位厂商防御机制与战略约束
        blocks:
          - type: paragraph
            body: >-
              企业对支出编排的需求主要由三项宏观因素推动。第一，SaaS 快速普及和部门采购分散化，带来了严重的影子 IT 风险、重复软件许可证和合规漏洞。第二，企业管理者承受着压缩采购审批周期的强大压力，而传统 ERP
              门户的路由过去往往耗时数周或数月。第三，宏观经济对运营费用的审视加剧，使支出治理从后台行政事务上升为高管战略优先事项，推动企业收回失控支出并执行首选供应商定价。

              尽管顺风明显，独立支出编排厂商仍面临严峻的采用约束和在位厂商竞争。SAP、Coupa、Workday 和 Ivalua
              等成熟企业软件厂商占据现有采购软件预算的主导份额。这些传统套件供应商正积极开发原生需求收集和工作流编排模块，以守住现有账户，阻止专业挑战者绕过其核心交易系统。此外，在复杂企业中部署编排，需要与传统
              ERP、HRIS 数据库、合同存储库和单点登录供应商进行深度技术集成。行业分析指出，Zip 已成为支出编排领域公认的领导者，但必须不断应对传统套件的功能趋同，同时其私有财务指标又掩盖了真实的软件留存韧性。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 支出编排将员工需求收集与记录系统的僵化解耦
            body: >-
              Zip 的核心战略市场价值不在于替换 SAP 或 Workday 等根深蒂固的 ERP，而在于成为其上方的智能编排层。Zip 为员工提供直观、消费级的需求入口，同时在法务、IT
              和财务之间执行严格的跨部门合规规则，从需求源头捕获企业采购需求。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM014
          - type: callout
            title: 软件 ARR 不透明与在位厂商功能趋同造成尽调盲区
            body: >-
              Zip 公开宣传累计处理 $500 billion 至 $1 trillion 的支出，但对经常性软件 ARR、毛利率和客户留存严格保密。主要采购套件在位厂商积极推出原生需求收集和流程模块，Zip
              面临守住独立编排定价并证明软件利润持久性的巨大压力。
            calloutType: risk
            claimRefs:
              - CM004
              - CM007
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 企业采购与需求收集版图
        blocks:
          - type: paragraph
            body: >-
              企业采购软件市场存在结构性张力：一边是根深蒂固的传统记录系统，另一边是现代工作流编排层。长期以来，Coupa、SAP Ariba 和 Ivalua 等完整
              Source-to-Pay（S2P）套件主导企业支出管理。它们提供深度会计、ERP 集成和合规台账，但僵化的用户界面经常导致采购请求碎片化地散落在邮件和表格中。Zip
              以需求到采购编排平台切入高速增长市场，为数百家企业中申请商品和服务的员工提供直观、消费级的入口，包括 Anthropic、AMD、OpenAI 和 Dollar Tree。然而，行业分析师在 Gartner
              Source-to-Pay Suites 魔力象限中把 Zip 定位为创新型挑战者和 Visionary，而非整体套件 Leader，反映出其专注需求编排，而不是完整的原生会计和 ERP 基础设施。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
      - number: '3.2'
        title: 进军 CLM 与在位厂商的回应
        blocks:
          - type: paragraph
            body: >-
              为守住切入口并扩大客户终身价值，Zip 推出 AI Contract Orchestration，从采购需求收集扩展到合同生命周期管理。传统上，企业合同审查需要经由 Ironclad 等独立 CLM 点解决方案和
              DocuSign 等电子签名工具，造成流程摩擦、模板生成割裂以及签署后的义务无人跟踪。Zip 的 AI Contract Orchestration
              自动完成供应商合同分流，依据预先批准的公司法务手册修订协议，并把合同合规直接嵌入采购订单和发票流程。Bandwidth 等客户的基准数据显示，NDA 周转时间最多减少 60%，整体合同周期缩短
