    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              Zip 是一家总部位于美国加州旧金山的企业软件公司，提供 AI 驱动的采购需求收集和支出编排平台 [CO009]。公司由前 Airbnb 产品经理 Rujul Zaparde 和 Lu Cheng 于 2020
              年创立；两人直接观察到企业采购摩擦：员工的软件和硬件需求经常卡在彼此割裂的邮件线程和手工表格里 [CO001]。完成 Y Combinator Winter 2021 加速器批次并完成首轮 $7 million
              种子融资后 [CO002]，Zip 打造了需求收集与审批编排层，把自动化治理流程嵌入财务、法务、IT 和安全团队。该平台主要面向企业和中端市场组织，力求用八周快速部署克服 Coupa、SAP Ariba
              等传统套件长达数月的实施周期和行政负担 [CO011]。尽调团队必须将 Zip（ZipHQ）与名称相同或相近的资本市场实体严格区分，包括在澳交所上市的澳大利亚金融服务商 Zip Co Limited
              [CO013]，以及在纽交所上市的招聘市场 ZipRecruiter, Inc. [CO014]。
