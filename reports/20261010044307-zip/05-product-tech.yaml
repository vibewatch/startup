callouts:
  - calloutType: "insight"
    title: "The Orchestration Wedge vs. Incumbent Suite Moats"
    body: "Zip's technical defensibility rests on being the single front-door intake experience that employees actually enjoy using, circumventing the notoriously poor UX of legacy ERPs. By deploying autonomous Superagents and MCP tool-calling on top of this intake wedge, Zip captures rich pre-purchase intent data that legacy systems rarely observe. However, because Zip relies on underlying ERPs for financial settlement, legacy suite vendors (SAP, Workday, Coupa) are actively engineering competing intake modules, turning the long-term competition into a race between Zip's AI orchestration agility and incumbents' data gravity."
    claimRefs:
      - "CE001"
      - "CE005"
      - "CE009"
