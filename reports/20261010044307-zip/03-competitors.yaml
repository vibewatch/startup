callouts:
  - calloutType: "insight"
    title: "Contract Orchestration as a Wedge Against CLM and S2P Incumbents"
    body: "By embedding AI contract redlining and obligation tracking directly into intake workflows, Zip bridges the traditional chasm between legal contract management and financial procurement execution. This positioning allows Zip to displace legacy CLM point solutions while remaining an agile overlay atop legacy ERP systems."
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP007"
  - calloutType: "risk"
    title: "Incumbent Feature Convergence and Pricing Opacity"
    body: "Zip's premium valuation depends on maintaining an innovation lead in AI-driven procurement orchestration. However, as enterprise incumbents like SAP and Coupa introduce generative AI intake tools, Zip must prove that its front-door orchestration delivers durable efficiency gains that justify an additional software layer."
    claimRefs:
      - "CP004"
      - "CP008"
      - "CP013"
