  - id: FI001
    title: Revenue model and gross margin bridge
    type: flow
    summary: >-
      Structural conversion flow from enterprise employee purchasing activity into software subscription revenue and
      gross profit.
    data:
      nodes:
        - label: 1. Employee Purchasing Activity
          detail: Decentralized business users initiate software and service purchase requests via intake portal
        - label: 2. Intake & Approval Orchestration
          detail: No-code workflow routes requests through finance, legal, IT, and security compliance checks
        - label: 3. Modular Platform Subscriptions
          detail: Core platform and add-on module subscriptions (CLM, Vendor Management) monetize recurring workflow
        - label: 4. Contract Value Scaling
          detail: Annual contract values scale with managed spend volume, user headcount, and integration tiers (~$82K ACV)
        - label: 5. High Software Gross Margins
          detail: Pure-play cloud architecture yields an estimated 80% to 90% gross margin on subscription fees
        - label: 6. Customer Expansion & Retention
