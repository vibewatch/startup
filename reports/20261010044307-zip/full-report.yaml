            title: Incumbent Feature Convergence and Pricing Opacity
            body: >-
              Zip's premium valuation depends on maintaining an innovation lead in AI-driven procurement orchestration.
              However, as enterprise incumbents like SAP and Coupa introduce generative AI intake tools, Zip must prove
              that its front-door orchestration delivers durable efficiency gains that justify an additional software
              layer.
            calloutType: risk
            claimRefs:
