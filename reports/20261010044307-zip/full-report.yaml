        title: Unit Economics, Cost Structure, and Margin Profile
        blocks:
          - type: paragraph
            body: >-
              Zip exhibits a software unit economics profile characteristic of high-margin cloud architectures, with
              gross margins estimated between 80% and 90%. Cost of goods sold is predominantly composed of cloud
              hosting, database infrastructure, and API connectivity to underlying enterprise resource planning systems,
              avoiding the heavy human-in-the-loop services overhead typical of traditional business process
              outsourcers. Customer onboarding is streamlined via a no-code configuration engine, enabling standard
              enterprise implementations to reach production in eight weeks or less compared to six-to-twelve month
              cycles for legacy suites. Operating expenses remain heavily weighted toward research and development,
              particularly investments in autonomous AI agent engineering, accompanied by direct enterprise sales
              expansion across North American and European commercial hubs.
            claimRefs:
              - CI005
