        title: Founders, Executive Leadership, and Governance Architecture
        blocks:
          - type: paragraph
            body: >-
              Zip operates under the ongoing leadership of co-founders Rujul Zaparde, who serves as Chief Executive
              Officer, and Lu Cheng [CO001]. Both founders developed their functional expertise while managing internal
              product operations at Airbnb, translating operational frustrations with corporate procurement into Zip's
              intake-first software architecture. The executive leadership team directs an organization reported within
              the 251 to 500 employee band based out of its San Francisco headquarters [CO009]. Operating as a privately
              held venture-backed technology company, Zip maintains a centralized management hierarchy with pronounced
              key-person dependence concentrated in its two founding product architects. Unlike public corporations such
              as ASX-listed Zip Co Limited that publish standardized annual corporate governance statements, independent
              director rosters, and audit committee disclosures [CO013], Zip's internal board composition, voting share
              classes, and committee structures remain confidential, requiring direct disclosure during diligence.
