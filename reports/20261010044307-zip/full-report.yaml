      - number: '1.3'
        title: Capitalization History, Valuation, and Stakeholder Structure
        blocks:
          - type: paragraph
            body: >-
              Zip's institutional capitalization reflects rapid equity accumulation across successive venture funding
              cycles since its 2021 founding. Following its $7 million seed round led by Y Combinator [CO002], Zip
              secured a $43.3 million Series B in May 2022 to accelerate software integrations across enterprise ERP and
              contract systems [CO003]. In May 2023, growth equity firm BOND Capital led a $100 million Series C
              financing [CO004], which was succeeded in October 2024 by a $190 million Series D funding round that
              established a reference post-money valuation of $2.2 billion and lifted cumulative disclosed capital above
              $330 million [CO005]. Institutional equity backers include Y Combinator, Y Combinator Continuity, BOND
              Capital, Tiger Global Management, and CRV. While this capitalization profile confirms sustained top-tier
              venture sponsorship, detailed cap-table rights, liquidation seniority structures, and secondary
              transaction discounts remain undisclosed to the public.
