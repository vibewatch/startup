      - CI006
      - CI015
  - id: FE001
    title: Enterprise procurement orchestration stack
    type: stack
    summary: >-
      Architectural layers of the Zip enterprise procurement platform, illustrating the flow from user interaction down
      to underlying systems of record.
    data:
      layers:
        - label: Interaction & Agent Layer
          detail: Employee intake interface, conversational Slack/Teams bots, Superagents, and Zip MCP server
        - label: Orchestration & Governance Layer
          detail: Conditional approval routing, policy compliance engine, automated audit trail, and security checks
        - label: Integration & Connector Fabric
          detail: Native App Studio, 100+ pre-built integration templates, authenticated REST APIs, and flat-file pipelines
        - label: Enterprise Systems of Record
          detail: Underlying ERPs (SAP, NetSuite, Workday), CLMs (DocuSign, Ironclad), and finance ledgers
        - label: Procurement Intelligence Layer
          detail: Normalized spend repository, contract clause library, and continuous compliance telemetry
        - label: Infrastructure & Identity Foundation
          detail: Multi-tenant cloud hosting, SOC compliance controls, and enterprise IdP integrations
    approximationNotes: >-
      Conceptual functional stack synthesized from Zip capability overviews, integration matrices, and technical
      documentation.
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Six-stage enterprise adoption journey from intake initiation to multi-department procurement expansion.
    data:
      items:
        - label: 1. Intake Initiation
          detail: Business employee submits purchase request via self-service intake portal or chat.
          tone: neutral
        - label: 2. Policy Routing
          detail: Platform automatically evaluates enterprise purchasing rules, compliance, and budget limits.
          tone: positive
        - label: 3. Superagent Review
          detail: Autonomous procurement agents analyze vendor risk, parse contract terms, and draft approvals.
          tone: positive
        - label: 4. System Integration
          detail: Optis or SI partner bridges approved purchase orders into ERP systems like SAP or Coupa.
          tone: neutral
        - label: 5. Spend Execution
          detail: Procurement finalizes purchase order, records line items, and establishes invoice match.
          tone: positive
        - label: 6. Account Expansion
          detail: Successful departmental intake prompts broader multi-department and global rollouts.
          tone: warning
    approximationNotes: >-
      Workflow reflects standard intake-to-pay architecture documented by implementation partners; exact approval
      latency varies by enterprise policy.
    claimRefs:
      - CU006
      - CU009
