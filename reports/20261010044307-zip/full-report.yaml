      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Contract Orchestration as a Wedge Against CLM and S2P Incumbents
            body: >-
              By embedding AI contract redlining and obligation tracking directly into intake workflows, Zip bridges the
              traditional chasm between legal contract management and financial procurement execution. This positioning
              allows Zip to displace legacy CLM point solutions while remaining an agile overlay atop legacy ERP
              systems.
            calloutType: insight
            claimRefs:
              - CP005
              - CP006
              - CP007
