  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Business Model
        blocks:
          - type: paragraph
            body: >-
              Zip is an enterprise software company headquartered in San Francisco, California, that provides an
              AI-driven procurement intake and spend orchestration platform [CO009]. Founded in 2020 by former Airbnb
              product managers Rujul Zaparde and Lu Cheng, Zip emerged from direct observations of corporate purchasing
              friction, where employee software and hardware requests frequently stalled across siloed email threads and
              manual spreadsheets [CO001]. After completing the Y Combinator Winter 2021 accelerator batch and raising
              an initial $7 million seed round [CO002], Zip engineered an intake and approval orchestration layer that
              embeds automated governance workflows across finance, legal, IT, and security teams. The platform
              primarily targets enterprise and mid-market organizations seeking rapid eight-week deployment timelines to
              overcome the lengthy multi-month implementations and administrative overhead associated with legacy suites
              such as Coupa and SAP Ariba [CO011]. Diligence teams must carefully distinguish Zip (ZipHQ) from distinct
              capital market entities with identical or similar nomenclature, including ASX-listed Australian financial
              provider Zip Co Limited [CO013] and NYSE-listed recruitment marketplace ZipRecruiter, Inc. [CO014].
