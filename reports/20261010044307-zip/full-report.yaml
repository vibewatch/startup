      - number: '4.3'
        title: Public Traction vs. Private-Metric Opacity
        blocks:
          - type: paragraph
            body: >-
              Zip highlights substantial platform throughput as a proxy for commercial adoption, reporting more than
              $500 billion in cumulative spend processed across seven million suppliers and claiming over $10 billion in
              customer savings. These volume figures are corroborated by third-party economic assessments, including a
              commissioned Forrester Total Economic Impact study documenting a 386% return on investment and payback in
              under six months for large enterprise cohorts. Nevertheless, significant diligence opacity persists: Zip
              maintains strict private-company confidentiality regarding GAAP annual recurring revenue, revenue growth
              rates, gross burn rate, and net revenue retention cohorts. Underwriters must recognize that self-reported
              spend throughput and marketing savings metrics cannot substitute for audited financial statements when
              evaluating revenue durability.
