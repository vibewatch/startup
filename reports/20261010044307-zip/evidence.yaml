evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements, GAAP revenue, annual recurring revenue (ARR), gross margin, and cash burn rate for
      FY2025 and FY2026.
    whyItMatters: >-
      Without audited revenue or ARR, the $2.2B valuation multiple cannot be benchmarked against enterprise SaaS peer
      multiples.
    diligencePath: >-
      Request confidential management disclosure under NDA, including audited income statements and subscription ARR
      cohort schedules.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: cap-table-governance
    missingEvidence: >-
      Complete cap-table breakdown, liquidation preferences, voting control agreements, and secondary sale transaction
      histories.
    whyItMatters: >-
      Preferred share classes and liquidation seniorities could impair common share equity value in a down-round or
      structured exit.
    diligencePath: >-
      Request full cap-table capitalization model and Series D investor rights agreements from lead investors or company
      counsel.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: customer-contract-mix
    missingEvidence: >-
      Disaggregated customer count by tier, annual contract value (ACV) distribution, and net revenue retention (NRR)
      cohorts.
    whyItMatters: >-
      Aggregate customer counts (450+) do not reveal whether enterprise growth is concentrated among mega-cap logos or
      mid-market pilots.
    diligencePath: Request customer cohort retention and net dollar retention metrics during commercial due diligence.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: arr-and-financial-transparency
    missingEvidence: >-
      Audited breakout of Zip's annual recurring revenue (ARR), subscription software revenue, gross margins, and net
      revenue retention, isolated from platform spend volume.
    whyItMatters: >-
      Zip reports over $500B to $1T in cumulative spend processed and $10B in savings, but does not disclose
      subscription ARR or financial growth rates, leaving SAM/SOM penetration unverified.
    diligencePath: >-
      Request confidential SaaS KPI disclosure including subscription ARR by product tier, logo churn, customer
      acquisition costs, and cohort net expansion.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: homonym-market-metrics
    missingEvidence: >-
      Automated disambiguation filters separating enterprise procurement software metrics from public consumer BNPL
      reports (Zip Co Limited) and recruitment filings.
    whyItMatters: >-
      Public web searches for 'Zip' frequently conflate the private enterprise AI procurement company with ASX-listed
      Zip Co Limited and NYSE-listed ZipRecruiter.
    diligencePath: >-
      Maintain rigorous domain-level boundary checks restricting diligence ingestion to enterprise procurement and
      intake-to-pay automation surfaces.
    relatedQuestionRefs:
      - QM001
  - type: missing-source
    severity: material
    topic: arr-and-burn-rate
    missingEvidence: >-
      Audited financial statements or detailed management disclosures on current ARR, gross burn rate, net cash burn,
      and runway.
    whyItMatters: >-
      Without audited revenue and burn figures, underwriters cannot determine whether Zip's $2.2B reference valuation is
      supported by durable recurring revenue or inflated by non-recurring services and capital subsidies.
    diligencePath: >-
      Request audited FY2024-FY2025 income statements and board-level cash flow forecasts under NDA during phase-two
      diligence.
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-nrr
    missingEvidence: >-
      Net Revenue Retention (NRR) and Gross Revenue Retention (GRR) cohort expansion curves broken down by customer
      segment and spend tier.
    whyItMatters: >-
      Procurement orchestration software faces potential displacement from incumbent ERP modules; proving expansion
      economics requires verifying that existing customers consistently increase annual contract values over multi-year
      cycles.
    diligencePath: Request enterprise cohort expansion reports and logo renewal histories for contracts signed in 2022-2024.
  - type: private-evidence-only
    severity: material
    topic: developer-api-specifications
    missingEvidence: >-
      Publicly accessible OpenAPI schema, endpoint latency benchmarks, rate-limiting quotas, and developer sandbox
      environments.
    whyItMatters: >-
      Gated API documentation prevents unassisted technical audit of Zip's API contract robustness and integration
      maintenance overhead.
    diligencePath: >-
      Request authenticated sandbox access or an export of Zip's full REST API specification during confidential
      technical diligence.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: autonomous-agent-accuracy
    missingEvidence: >-
      Independent benchmarks or empirical validation data evaluating error rates and hallucination frequencies of
      Superagent contract redlining.
    whyItMatters: Automated legal redlines and invoice coding carry direct compliance and financial liabilities if guardrails fail.
    diligencePath: >-
      Review vendor customer reference calls focusing on legal team override rates and supervised testing logs for
      contract automation.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: material
    topic: customer-retention-and-nrr
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross revenue retention (GRR), and logo churn rates for
      enterprise customer segments.
    whyItMatters: >-
      Without verified retention metrics, diligence cannot ascertain whether Zip's capital-fueled customer acquisition
      translates into durable, recurring software revenue.
    diligencePath: >-
      Request audited cohort retention schedules and contract renewal matrices directly from Zip management under NDA
      during diligence.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: customer-count-and-concentration
    missingEvidence: >-
      Exact active enterprise customer count, average annual contract value (ACV) distribution, and revenue
      concentration among top 10 accounts.
    whyItMatters: >-
      Aggregate cumulative spend figures obscure the underlying customer distribution, enterprise contract size, and
      potential dependency on large flagship customers.
    diligencePath: >-
      Review anonymized customer contract rosters, tier breakdown by ACV band, and top-customer billing percentages in
      the confidential data room.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      Comprehensive census of enterprise production deployments, contract durations, and department-level seat
      penetration.
    whyItMatters: >-
      Public references highlight successful marquee deployments but exclude discontinued pilots, stalled rollouts, or
      limited-scope departmental licenses.
    diligencePath: >-
      Conduct reference calls with procurement leaders at both long-standing and recent customer accounts to evaluate
      deployment breadth and satisfaction.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk
    missingEvidence: >-
      Comprehensive audit of state-by-state true lender lending licensing opinions and complete regulatory enforcement
      filings regarding partner bank programs.
    whyItMatters: >-
      True lender legal challenges could impair loan enforceability, disrupt partner origination, or impose unexpected
      consumer compliance penalties.
    diligencePath: Request legal opinion letters regarding WebBank program compliance and review state regulatory inspection records.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: series-d-cap-table-and-secondary-pricing
    missingEvidence: >-
      Audited Series D term sheet detailing liquidation preference multiples, seniority structures, participation
      rights, and verified private secondary clearing transactions.
    whyItMatters: >-
      Without cap-table seniority and secondary clearing data, common and junior preferred share values cannot be
      reliably modeled, increasing down-round dilution vulnerability.
    diligencePath: >-
      Request full capitalization table waterfall, stock purchase agreement for Series D, and secondary trading registry
      history directly from company management or lead investor Bond.
    relatedQuestionRefs:
      - QV009
