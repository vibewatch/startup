callouts:
  - calloutType: "risk"
    title: "Structural Platform Dependency on Competing ERP Ecosystems"
    body: "Zip's primary strategic vulnerability is that its orchestration layer sits directly on top of legacy ERP and Source-to-Pay suites (SAP, Oracle, Workday). Should these enterprise incumbents restrict API accessibility or launch native modern intake interfaces, Zip's core front-door differentiation faces severe margin and retention compression."
    claimRefs:
      - "CR011"
      - "CR013"
  - calloutType: "risk"
    title: "Financial Opacity and Valuation Sustainability"
    body: "Carrying a $2.2 billion valuation without audited public revenue or ARR disclosures exposes Zip to substantial multiple re-rating risks. Without verified net revenue retention and cohort margin metrics, the durability of its capital-fueled expansion remains unconfirmed."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR014"
