  topStrengths:
    - SAIC majority ownership and industrial support materially reduce existential risk versus stand-alone EV startups.
    - IM has moved beyond concept status, with cumulative deliveries above 100,000 and visible 2025-2026 sales activity.
    - >-
      The product story is more differentiated than a generic premium EV badge because it emphasizes digital chassis and
      intelligent-driving architecture.
    - >-
      A large December 2024 financing round suggests continued access to strategic capital even during a harsh China EV
      shakeout.
    - >-
      The brand still has upside optionality if flagship launches, quality execution, and disclosure all improve
      together.
  topRisks:
    - >-
      Exact post-money valuation, preference stack, and dilution terms are not publicly disclosed, making entry-price
      discipline impossible from public evidence alone.
    - >-
      Standalone revenue, margins, cash burn, and debt are not auditable in public materials, so unit economics remain
      unproven.
    - >-
      China premium EV competition is intense and can force discounting, while Tesla, BYD, Li Auto, NIO, and XPeng all
      pressure perception and pricing.
    - >-
      Smart-driving, OTA, and steer-by-wire features increase regulatory, quality, recall, and homologation risk
      relative to a simpler vehicle stack.
    - >-
      IM still appears sponsor-dependent, so any slowdown in parent support or launch execution could compress valuation
      quickly.
  unresolvedGaps:
    - Exact latest-round post-money valuation remains undisclosed in the reviewed public source set.
    - >-
      Subsidiary-level financial statements with revenue, gross margin, burn, cash, and debt detail are not publicly
      available.
    - Cap table, liquidation preferences, and any investor protections from the Series B are not visible.
    - Independent evidence on long-term retention, repeat purchase, and customer satisfaction depth is limited.
    - Product-quality, recall, and field-performance transparency remain thinner than public listed-peer standards.
