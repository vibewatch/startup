  evidenceGaps:
  - id: GP001
    type: private-evidence-only
    severity: material
    topic: competitive-win-rate
    missingEvidence: IM Motors’ actual win/loss data against NIO, Li Auto, XPeng, Tesla, BMW, and Mercedes by model and city tier.
    whyItMatters: Public market positioning does not reveal whether IM is truly winning premium-budget decisions or just growing with the category.
    diligencePath: Request dealer, CRM, or order-intent data showing shortlists, conversion, and conquest rates by competitor.
    relatedQuestionRefs:
    - QP009
    - QP025
    relatedTableRefs:
    - TP001
    - TP005
  - id: GP002
    type: missing-source
    severity: material
    topic: pricing-trim-comparison
    missingEvidence: A same-month trim-level price capture across IM and its principal rivals in China.
    whyItMatters: Price competition is fluid enough that any stale snapshot can misstate IM’s real packaging edge or discount pressure.
    diligencePath: Build a dated competitor-price monitor using official configurators and dealer promotions for the exact trims being compared.
    relatedQuestionRefs:
    - QP010
    relatedTableRefs:
    - TP003
  - id: GP003
    type: private-evidence-only
    severity: minor
    topic: service-nps
    missingEvidence: Comparable after-sales satisfaction, NPS, and service-footprint data for IM versus NIO, Tesla, BMW, and Mercedes.
    whyItMatters: Service trust is a major incumbent advantage that product reviews alone cannot quantify.
    diligencePath: Obtain internal customer-service benchmarks or third-party ownership-survey data for premium EV buyers in China.
    relatedQuestionRefs:
    - QP014
    - QP018
    relatedTableRefs:
    - TP004
