  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险画像
        blocks:
          - type: paragraph
            body: >-
              对 IM 来说，监管风险不是抽象变量，而是嵌在产品里。中国 2025 年收紧智能网联汽车准入、召回和 OTA 管理，意味着软件行为和缺陷修复更明确地成为合规事项。这很重要，因为 IM
              的产品论点高度依赖软件定义底盘和智能驾驶演进。草案规则报道和法律评论也指向同一方向：一旦涉及安全，监管正在压缩非正式 OTA 试验空间。下一层风险是前沿自动驾驶合规。中国 L3/L4
              安全标准方向意味着，围绕高阶自动驾驶的激进营销，一旦法律时间线或技术成熟度滑坡，就可能变成负债。出口方面，欧洲增加了另一层法律监管。即使 IM
              做出合适产品，反补贴和关税措施仍可能削弱经济性或放慢准入。公开记录没有浮现 IM 自身重大诉讼或 IP 战，但看不到纠纷，并不等于法律尽调文件干净。
