companyProfile:
  summary: >-
    Zhiji Automobile Technology 以 IM Motors 名义运营，是一家位于上海的高端 EV 合资公司，2020 年 12 月由 SAIC Motor、Alibaba Group 和 Zhangjiang
    Hi-Tech 发起。公司把 SAIC Motor 的制造与工程厚度、Alibaba 的软件和云能力拼在一起，切入 RMB 200,000 以上的高端智能 EV 市场。公开证据显示，公司已有真实交付牵引、四款 BEV 产品线和
    2024 年底一轮大额融资，但外部投资者仍拿不到可靠的子公司收入、利润率、股权结构和估值披露。
