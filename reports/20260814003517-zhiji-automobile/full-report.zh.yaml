      - number: '6.4'
        title: 留存可见度、扩展路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户论证在这里变得不完整。IM 不披露 SaaS
              式留存指标、复购分群，也没有给出相对交付车辆的活跃车主参与度干净衡量。最好的公开耐久性代理，是持续车主社区活动加长期使用评测；它有价值，但不完美。扩展逻辑比留存逻辑更可见。IM
              可能沿自家产品梯队扩展客户——从轿车到 SUV，再到增程或旗舰车型；官方支持界面也暗示，直接零售关系可以随时间加深。但风险存在。Global China EV 报道了金融支持和补贴等购车激励，Bamboo
              Works 也指出公司在募集新资本前落后于 2024
              年销售目标。换句话说，部分可见增长可能是激励辅助，而不是纯粹由忠诚度驱动。正确投资判断是，经典头部客户集中度较低，但国内市场集中、渠道执行和复购需求不确定性仍很重要。
