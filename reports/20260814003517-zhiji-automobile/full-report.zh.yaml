      - number: '3.2'
        title: 能力、定价逻辑与信任杠杆
        blocks:
          - type: paragraph
            body: >-
              中国高端 EV 赛道的战场，已从简单电机性能转向软件、智能驾驶、能源信心和信任。已上市中国同行中，XPeng 打出的智能 EV 技术栈叙事最明确；NIO
              的换电和服务架构则形成差异化拥车主张，可能抬高转换成本。Li Auto 从另一个方向切入，靠家庭实用性和 EREV 灵活性打市场。Tesla
              仍是品类在软件节奏和充电信心上的参照物，尽管它的市场份额已不再定义整个市场。BMW 和 Mercedes
              重要，是因为它们把传统信任、经销和服务基础设施、豪华品牌传承，继续转化为高端预算池。因此，价格比较必须谨慎处理。在中国，车型配置和激励变化太快，一张静态价格表很难可靠；配置逻辑和拥车价值主张，比单一标价更有决策价值。
