      - - 交付质量侵蚀
        - 交付放缓，同时激励上升
        - 释放需求质量弱的信号
        - 把客户证明视为不那么持久
      - - 披露仍受阻
        - 尽调请求后仍没有财务 / 估值透明度
        - 无法做投资判断
        - 维持持有 / 不推进立场
    notes: 这些触发因素旨在改变决策，而不只是描述行业背景风险。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV033
