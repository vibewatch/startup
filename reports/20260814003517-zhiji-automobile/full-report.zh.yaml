      - number: '2.4'
        title: 市场环境对 IM Motors 的含义
        blocks:
          - type: paragraph
            body: >-
              核心市场结论是，IM Motors 身处一个规模毋庸置疑、但竞争极其拥挤的品类。中国 NEV 市场已跨过主流化门槛，但高端切片同时被 Tesla、NIO、Li Auto、XPeng、BYD
              高端序列和德系传统巨头争夺；后者拥有更深品牌记忆和更高存量服务能力。市值在百亿美元出头区间的公开市场同行表明，即使相对有规模的高端 EV 玩家，也不会在无法证明利润率韧性和战略清晰度时自动获得奖励。对 IM
              而言，机会真实存在，因为高端本土需求已明显转向智能
              EV；风险同样真实，因为这种转向并未降低竞争强度。公司因此需要市场同时做到两件事：整体继续增长，并且继续用技术奖励新进入者，而不是用价格战碾压它们。对一个背靠出资方、处于后期规模化阶段的挑战者来说，这是可行但要求很高的背景。
            claimRefs:
