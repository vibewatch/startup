  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与公开估值背景
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个窄建议：持有或继续研究，不是放弃，也不是激进投入。IM 显然比停留在纸面上的 EV 创业公司更有实质。交付数据和融资证据显示真实产业活动，SAIC
              背书降低生存风险。但公开估值背景仍弱，因为最新一轮的确切投后估值、股权结构条款和优先权结构没有披露。缺失的价格语境比平时更重要。在私募市场里，只有公司质量、没有价格，并不能构成可投资论点。因此，正确估值立场必须明确对价格敏感。如果
              IM 能以相对公开中国 EV 同行的保守折价获得，可能值得关注。如果它在经济性不透明时仍按高端 EV 乐观情绪上沿定价，就很难支持。公司最大估值问题不是缺少故事，而是缺少已披露的投资判断输入。
            claimRefs:
              - CV001
              - CV002
