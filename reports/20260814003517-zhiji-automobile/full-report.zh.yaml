      - number: '8.3'
        title: 可比公司与情景框架
        blocks:
          - type: paragraph
            body: >-
              可比公司集合说明，IM 估值必须谨慎处理。公开 EV 估值跨度极宽。Tesla 处在完全不同的规模和倍数制度。BYD 和 BMW 说明，大型、盈利汽车平台可以支撑数百亿美元股权价值。对一家仍在证明长期经济性的中国
              EV 公司而言，XPeng 和 NIO 是更相关的规模同行；Li Auto 则展示了更强收入规模可能是什么样。收入对比进一步说明，IM
              仍更接近披露不足的成长故事，而不是已上市在位车企的运营成熟度。这些同行不给出单一干净答案，但能锚定合理情景区间。保守低案把 IM 视为有出资方背书但不透明的 EV
              项目，只给相对已募集资本的小幅溢价。基准情景假设持续放量和出资方支持，但仍因披露弱打折。高案需要旗舰发布成功、监管执行到位，并有更强证据显示 IM
              能接近高阶已上市同行的质量感知。重点不是精确数字，而是区间仍然很宽，因为证据质量混合，且市场已经会根据透明度和质量对公开 EV 给出非常不同的定价。
