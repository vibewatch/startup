            body: >-
              公开记录指向面向消费者的零售市场进入动作，靠试驾、直接产品发布和购车促销推进，而不是大型已披露车队合同。这提供了一些有用线索：管理层愿意用金融支持和购车补贴刺激需求，意味着获客成本和实际成交价，可能至少和标价一样重要。但公开记录到此为止。已审阅来源没有给出
              CAC、销售回收期、转化率、复购经济或明确的客户生命周期价值。因此，单车经济大多只能推断。产品组合显然带着昂贵硬件和 R&D 内容——电池、高端内饰、ADAS
              硬件、数字底盘、线控转向和智能座舱投入；员工数据也暗示运营成本基座已在低千人级。公司仍未披露足够信息，无法判断这套成本栈在改善，还是被规模抵消。正确读法是：IM 有运营牵引，但还没有公开的单车经济故事。
