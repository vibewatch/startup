      - number: '7.2'
        title: 运营、质量与安全风险画像
        blocks:
          - type: paragraph
            body: >-
              运营上，IM 的风险来自同一个让公司有意思的东西：复杂性。线控转向、集中式数字底盘架构理论上能提升性能和自动驾驶准备度，但也扩大了硬件、软件和监管验证出错的路径数量。电池和 800V
              架构带来类似张力——这些系统支撑强产品差异化，但更高电压集成和高端性能承诺也抬高错误成本。今天的公开安全信息，冗余话术强于经审计运营证明。已审阅来源没有提供扎实可靠性仪表盘、OTA
              缺陷率历史、网络安全矩阵或售后质量读数。这不能证明已经有问题，但意味着外部投资者被要求信任一套复杂控制栈，却拿不到理想中应有的运营透明度。按风险口径，IM
              最大运营弱点不是今天显然有产品质量失败，而是公开证据不足，无法判断其质量体系是否已强到足以承接承诺中的复杂性。
            claimRefs:
