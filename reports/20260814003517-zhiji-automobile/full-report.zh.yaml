      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              中国高端 EV 市场仍有强劲增长驱动，但已不再是单边乐观。国内品牌已拿下乘用车市场 68.8%，外资品牌自 2020 年以来丢掉三分之一份额，显示本土产品周期和软件驱动差异化正快速改变买家行为。2025
              年上半年数据也显示 BEV 仍占更大盘子，这支撑 IM 既有产品线。与此同时，IM 决定加入 EREV，等于默认续航灵活性仍重要。需求端因此分裂：一边是对智能 EV
              的热情，另一边是对充电、保值率和售后一致性的持续焦虑。政策也不如补贴强刺激时代宽松：税收优惠在退坡，购车支持收缩时，高端价格带承受更大压力。国际扩张可以缓冲，但欧洲已不是不受约束的泄压阀，贸易合规、关税和价格承诺规则都会调节准入。
