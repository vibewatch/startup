      - number: '7.3'
        title: 依赖、客户与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              下一层风险是依赖。IM 仍处在 SAIC 的产业和财务轨道内，这既是优势，也是弱点。相较更弱 EV 创业公司，它降低生存风险；但也让外界更难判断这门生意作为独立经济引擎的质量。产品执行也与伙伴相连：Momenta
              对智能驾驶栈重要，NVIDIA 对未来计算能力重要，中国高端 EV 市场仍是 IM
              必须证明耐久需求的主战场。最后一点重要，因为可见增长可能比交付总量暗示的更脆弱。激励和金融支持可见。独立报道还记录了公司在新资本到位前明显错失 2024 年目标。在拥挤的高端 EV
              市场，这些不是脚注，而是客户牵引、利润率耐久度和出资方依赖相互绑定的证据。出口长期可能有帮助，但欧洲贸易姿态意味着国际多元化不是免费的风险降低器。
            claimRefs:
              - CR017
