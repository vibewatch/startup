      - number: '1.2'
        title: 领导层可见度与治理现实
        blocks:
          - type: paragraph
            body: >-
              公众能看到的 IM Motors 经营层信息，明显少于股东和产品发布信息。二级资料把刘涛列为联席 CEO，把蒋峻列为最直接参与 IM 运营搭建的 SAIC 高管；SAIC
              自有材料也继续强化母公司对合资公司的战略监督。清楚的是控制逻辑：SAIC 持有多数股权，公开把 IM 称为集团唯一高端 EV 品牌，并承担产品化和规模化的产业责任。不清楚的是，IM
              是否有单独披露的独立董事会，哪些机制能防止母公司战略转向，以及运营团队在定价、渠道和国际化推进上到底有多少自主权。对投资者而言，合资公司有强出资方，但也继承了大型国资汽车集团的决策节奏、内部资本分配和政治优先级。
