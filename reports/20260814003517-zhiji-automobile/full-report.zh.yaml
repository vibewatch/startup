          detail: 产品与软件集成
        - id: buyers
          label: 零售买家
          detail: 终端用户采用
      edges:
        - from: saic
          to: imcore
          label: 产业与底盘依赖
        - from: momenta
          to: imcore
          label: ADAS 模型依赖
        - from: nvidia
          to: imcore
          label: 计算依赖
        - from: imcore
          to: buyers
          label: 产品体验
    claimRefs:
      - CE017
      - CE018
      - CE030
  - id: FE004
    title: 产品成熟度 / 能力图谱
    type: matrix
    layout: wide
    summary: 当前成熟度在已交付硬件上最高，在前沿自动驾驶和旗舰路线图承诺上较低。
    data:
      columns:
        - 交付成熟度
        - 差异化强度
        - 公开证据质量
      rows:
        - label: 当前 EV 阵容
          values:
            - 高
            - 中
            - 高
        - label: 数字底盘
          values:
            - 中
            - 高
            - 中
        - label: IM AD 3.0 / IM AD Max 智驾
          values:
            - 中
            - 中
            - 中
        - label: LS8 / LS9 路线图
          values:
            - 低
            - 中
            - 低
        - label: 安全 / 可靠性透明度
          values:
            - 低
            - 低
            - 低
    claimRefs:
      - CE001
      - CE035
      - CE036
      - CE033
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: IM 客户旅程从高端 EV 发现，到试驾、交付、持有，再到在车型阶梯内潜在升级。
    data:
      items:
        - label: 发现
          detail: 买家通过评测、论坛、评分页和官方媒体比较高端 EV 轿车与 SUV。
        - label: 试驾 / 咨询
          detail: 官方咨询热线和试驾预约把认知转成直接零售接触。
        - label: 购买
          detail: 客户按预算、使用场景和技术偏好，在当前阵容中选择轿车或 SUV。
        - label: 持有
          detail: 车主使用数字功能、售后触点，以及 Autohome 评测和论坛等社区渠道。
        - label: 升级 / 扩展
          detail: 体验顺利的车主可从轿车向 SUV 上探，或最终进入 LS8/LS9 旗舰项目。
    claimRefs:
      - CU001
      - CU018
      - CU024
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 公开证据能支撑兴趣、预订关注、交付和车主社区，但无法证明真实复购指标。
    data:
      nodes:
        - id: awareness
          label: 认知
          detail: 评测、论坛、官方渠道、首发体验内容
        - id: interest
          label: 预订 / 咨询
          detail: LS6 预订脉冲和咨询触点
        - id: deliveries
          label: 交付
          detail: 2025 年 YTD 81,017；截至 2026 年 7 月 YTD 45,552
        - id: owners
          label: 车主社区
          detail: 论坛、评分、长期使用评测
        - id: repeat
          label: 复购需求
          detail: 公开缺失 / 未披露
      edges:
        - from: awareness
          to: interest
          label: 转化为咨询
        - from: interest
          to: deliveries
          label: 订单到车辆交付
        - from: deliveries
          to: owners
          label: 持有与公开证据
        - from: owners
          to: repeat
          label: 未知复购闭环
    claimRefs:
      - CU008
      - CU004
      - CU005
      - CU010
      - CU020
    approximationNotes: 该流程展示客户生命周期中有证据支持的阶段，而不是字面转化率。
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 来源能反映真实用车里程和正负结果混合时，证据质量最高。
    data:
      columns:
        - 持有深度
        - 结果具体度
        - 独立性
      rows:
        - label: Autohome LS6 车主帖
          values:
            - 高
            - 中
            - 中
        - label: TGFC LS7 车主评测
          values:
            - 高
            - 高
            - 中
        - label: Autohome LS6 评分
          values:
            - 中
            - 中
            - 中
        - label: MotorWatt / L6 首看
          values:
            - 低
            - 低
            - 中
        - label: 官方渠道
          values:
            - 低
            - 低
            - 低
    claimRefs:
      - CU011
      - CU012
      - CU009
      - CU016
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 产品复杂度、监管与依赖重叠处，残余严重性最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: OTA / 召回监管
          values:
            - 高
            - 高
            - 中
        - label: 线控转向执行
          values:
            - 中
            - 高
            - 中
        - label: ADAS 伙伴依赖
          values:
            - 中
            - 高
            - 中
        - label: 中国价格战
          values:
            - 高
            - 高
            - 低-中
        - label: 出口贸易壁垒
          values:
            - 中
            - 中-高
            - 低
    claimRefs:
      - CR001
      - CR011
      - CR018
      - CR008
      - CR006
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管和执行风险会直接传导到发布、客户需求、利润率和融资需求。
    data:
      nodes:
        - id: reg
          label: 监管
          detail: OTA、召回、L3/L4 标准
        - id: ops
          label: 执行
          detail: 底盘、自动驾驶、发布质量
        - id: demand
          label: 需求
          detail: 交付量与客户信心
        - id: margin
          label: 利润率
          detail: 激励和价格战压力
        - id: capital
          label: 资本需求
          detail: 母公司支持与未来融资
      edges:
        - from: reg
          to: ops
          label: 审批与重新设计压力
        - from: ops
          to: demand
          label: 质量与功能可信度
        - from: demand
          to: margin
          label: 激励依赖
        - from: margin
          to: capital
          label: 现金消耗强度
        - from: reg
          to: capital
          label: 出口 / 发布经济性
    claimRefs:
      - CR002
      - CR026
      - CR021
      - CR023
  - id: FR003
    title: 依赖图谱
    type: dag
    layout: wide
    summary: IM 的风险画像很大程度由母公司、伙伴和市场依赖塑造。
    data:
      nodes:
        - id: saic
          label: SAIC
          detail: 产业底座与财务支持
        - id: momenta
          label: Momenta
          detail: 智驾能力
        - id: nvidia
          label: NVIDIA
          detail: 计算路线图
        - id: china
          label: 中国高端 EV 市场
          detail: 主要需求场域
        - id: im
          label: IM Motors
          detail: 执行层
      edges:
        - from: saic
          to: im
          label: 制造 + 资本
        - from: momenta
          to: im
          label: ADAS 依赖
        - from: nvidia
          to: im
          label: 计算依赖
        - from: china
          to: im
          label: 客户集中度
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 判断路径从真实牵引力和产品差异化出发，经过不透明度和风险，落到持有 / 继续研究建议。
    data:
      nodes:
        - id: traction
          label: 真实牵引力
          detail: 交付和融资都真实存在
        - id: moat
          label: 潜在护城河
          detail: 数字底盘与股东方底座
        - id: opacity
          label: 不透明
          detail: 没有定价轮披露，也没有独立经济性
        - id: risk
          label: 高风险
          detail: 监管、质量和资本强度
        - id: call
          label: 持有 / 继续研究
          detail: 只有做直接尽调才继续推进
      edges:
        - from: traction
          to: moat
          label: 支撑兴趣
        - from: moat
          to: opacity
          label: 单独不足
        - from: opacity
          to: risk
          label: 削弱确信度
        - from: risk
          to: call
          label: 决定立场
    claimRefs:
      - CV004
      - CV006
      - CV035
      - CV007
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: IM 的估值敏感性，更多取决于证据质量和可比公司估值区间，而不是某一个公开指标。
    data:
      items:
        - label: NIO P/S 参照（约 0.8x）
          value: 1
        - label: Tesla P/S 参照（约 13.7x）
          value: 14
        - label: 当前公开披露质量
          value: 2
        - label: 股东支持质量
          value: 6
        - label: 产品差异化潜力
          value: 7
    claimRefs:
      - CV021
      - CV022
      - CV035
      - CV006
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 由于 IM 没有披露轮次定价和独立经济性，基于公开证据能给出的区间必然很宽。
    data:
      items:
        - label: 低位情景
          low: 3
          mid: 3
          high: 3.5
          unit: USD bn
          detail: 较中国上市电动车同业给出保守折价
        - label: 基准情景
          low: 4.5
          mid: 5
          high: 5.5
          unit: USD bn
          detail: 股东支持增长，但透明度仍低
        - label: 高位情景
          low: 7
          mid: 8
          high: 9
          unit: USD bn
          detail: 旗舰车型执行成功，证据质量改善
    claimRefs:
      - CV029
      - CV030
      - CV031
    approximationNotes: 这个区间只是明确估算的情景工具，依据公开可比公司、融资背景和规模证明推导；它不是已披露融资文件里的估值定价。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 截至 2026-08-14 的公开证据下，这是一张衡量机构投资准备度的评分卡。
    data:
      items:
        - label: 市场验证
          value: 81,017 2025 YTD sales; 100,000+ cumulative deliveries
          score: 7
        - label: 产品差异化
          value: Digital chassis and autonomy narrative
          score: 7
        - label: 财务透明度
          value: Stand-alone economics undisclosed
          score: 2
        - label: 监管韧性
          value: Meaningful OTA / autonomy / EU trade risk
          score: 4
        - label: 估值支撑
          value: Price undisclosed; wide scenario range
          score: 3
        - label: 尽调准备度
          value: Multiple critical asks still open
          score: 3
    claimRefs:
      - CV004
      - CV006
      - CV035
      - CV009
      - CV010
