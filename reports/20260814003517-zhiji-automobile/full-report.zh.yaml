            body: >-
              因此，IM Motors 的财务结论是混合的。由于公司不披露子公司收入、实际 ASP、毛利率或现金转化数据，收入质量不能有信心地称为强或弱。利润率路径更不可见。可见的是资本密集度：高端 EV 硬件、持续平台
              R&D，以及足以支持又一轮重大产品周期的大额融资。相较更小创业公司，SAIC 背书显著降低生存风险，但也遮住了 IM 经济韧性中有多少来自自身、多少来自母公司支持。NIO、Li
              Auto、XPeng、Tesla、BMW 和 Mercedes 等已上市同行展示了正常披露基线应是什么样。对照这个基准，IM
              仍披露不足。决定性阻塞点很直接：没有独立财务报表，没有股权结构条款，没有现金和现金消耗披露，也没有干净证据说明近期交付增长是在产生健康毛利，还是只是在消耗更多资本。
