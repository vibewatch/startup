            body: >-
              公开 IM 材料中最清晰的技术主线是数字底盘。IM
              及其生态并未把底盘、制动、转向和软件呈现为相对分离的子系统，而是描述成一套协调的运动控制架构：转向、制动、悬架和车辆动态一起工作。独立技术报道多次把它描述为带中央“大脑”逻辑、执行器响应异常快的六自由度控制系统。这解释了为什么
              IM 最可信的差异化不只是电池大小或马力，而是试图让整车像一个一体化机器人平台一样行动。智能驾驶也嵌在同一个故事里。IM AD 3.0 的公开报道指向与 Momenta
              合作的一阶段端到端大模型架构，第三方评测则描述底层有大量半导体内容和基于 NVIDIA 的计算。证据仍更像媒体报道，而不是白皮书级材料，但一致性足以说明，IM
              追求的是底盘加计算的一体化策略，不只是一个外观高端品牌。
