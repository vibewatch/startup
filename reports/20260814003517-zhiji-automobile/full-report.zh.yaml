              这两个即将推出的大型 SUV 项目。从工作流看，产品线覆盖高端日常通勤、偏性能的个人出行、家庭 SUV 使用，以及 LS8/LS9 路线图上的长途六座出行和更偏休息舱式的定位。这种宽度重要，因为它显示 IM
              试图打造平台家族，而不是靠一个明星 SKU
              取胜。同时，官方全球页面措辞谨慎：它明确提醒，不同市场的功能、工程开发数值，甚至最终交付配置都可能不同。这个提示让尽调立场很清楚：产品版图真实且在扩张，但投资者应把跨市场标称规格视为指示性信息，而不是全球一致交付事实。
