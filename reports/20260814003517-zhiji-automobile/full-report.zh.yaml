      - number: '3.3'
        title: 转换成本、渠道力量与供应获取
        blocks:
          - type: paragraph
            body: >-
              高端 EV
              的转换成本真实存在，但并非高到不可逾越。不同于企业软件，买家下一轮购车时可以换一个汽车品牌，不会背上多年实施债。确实存在的锁定机制来自充电网络、换电生态、软件熟悉度、残值预期和售后服务信心。按这个口径，NIO 和
              Tesla 的拥车体验壁垒尤其强，BMW 和 Mercedes 仍主导纯服务信任。渠道和供应力量更不对称。BYD、Tesla、BMW 和 Mercedes 入场时都比 IM Motors
              拥有更强规模、采购杠杆和资本获取能力，尽管 IM 受益于 SAIC 的产业背书。这一点重要，因为在拥挤市场里，规模优势不仅能扩大利润率，也能吸收短期价格压力，并维持比窄切口挑战者更舒服的车型刷新周期。
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP030
              - CP029
      - number: '3.4'
        title: 护城河耐久度与竞争风险
        blocks:
          - type: paragraph
            body: >-
              因此，IM Motors 当前护城河是有条件的，还谈不上深。SAIC 背书很有意义，但背书本身不等于耐久高端品牌。产品功能、数字座舱质量和 ADAS
              叙事正变得越来越容易复制，尤其是资本更充足的对手可以快速上新，并接受更薄的短期利润率。公司真正的战略风险，是落入弱势中间地带：太高端，难以下场打大众市场；规模又太小，追不上 BYD 或
              Tesla；信任还不足，无法在完整高端预算池中撬动 BMW 或 Mercedes。已上市中国同行给出第二个警示。即使 NIO、Li Auto 和 XPeng 已明显放量，它们的市值水平仍暗示投资者继续质疑高端
              EV 经济性的耐久度。对 IM 来说，竞争负担不只是造出好车，而是建立一个买家、贷款方和投资者都相信能长期存在的高端品牌资产。
