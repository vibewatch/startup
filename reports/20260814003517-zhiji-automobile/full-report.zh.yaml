        title: 资本形成、资金用途与披露缺口
        blocks:
          - type: paragraph
            body: >-
              2024 年 12 月的融资，是 IM Motors 公司史上最重要的验证点之一，因为它发生在中国 EV 行业压力显性化的时期。英文报道对金额口径不一：有的写“超过 RMB 8B”，有的写 RMB
              9.4B；但方向性结论一致：在更弱的新能源车项目艰难求生时，公司拿到了一笔少见的大额新资金。各来源对资金用途也基本一致：数字底盘、线控转向、智能驾驶、新车型开发、更广渠道和海外扩张。不过，这轮融资没有解决 IM
              的披露问题。已审阅公开材料没有给出可靠的投后估值、独立收入、独立利润率或经审计盈利能力。外部投资者能看到资本获取能力和产品野心，但还不能高置信度核验单车经济。
