      - number: '2.2'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              IM Motors 的买家地图仍由富裕家庭主导，而不是企业车队。实际购买中，买家、用户和付款方通常在同一家庭内：要么是偏科技的车主自用轿车，要么是家庭决策者购买高端
              SUV，同时看重舒适、空间和驾驶辅助。关键分层不是 B2B 对 B2C，而是进口高端对本土高端、BEV 确定性对 EREV 灵活性。IM 的 L6 和 L7 更偏向重视软件的轿车买家，LS6 和 LS7
              则覆盖家庭与生活方式 SUV 场景。预算拥有者仍是零售高端客户，但购买决策越来越像消费电子：软件功能、补能体验、座舱质感和感知智能，比单纯品牌传承更能决定候选名单。因此，IM
              的市场最好理解为智能高端消费市场，尽管它仍与 Mercedes、BMW 和 Tesla 主导的更大豪华车预算池重叠。
