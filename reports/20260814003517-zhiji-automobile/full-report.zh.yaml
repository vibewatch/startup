  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              IM Motors 所处市场绝对规模很大，但若精确界定到高端智能 EV 层，边界并不好画。最宽口径是中国乘用车需求，2025 年上半年销量达到 10.891M 辆。下一层是乘用车 NEV，销量 5.458M
              辆，已占市场 50.1%，不再是小众品类。对 IM 更相关的口径还要更窄：约 RMB 200,000 以上的高端 EV 和如今的 EREV；本土品牌正用软件、ADAS 和性价比，从德系传统巨头与 Tesla
              手里撬份额。公开来源没有发布这个精确细分市场的干净 TAM，所以本章改用受约束的代理指标：乘用车 NEV 总量、BEV 总量、高端品牌收入排名和 IM Motors
              自身交付规模。这种方法不如一个市场研究数字漂亮，但更诚实，因为它保留了大品类增长与 IM 更窄实际可服务市场之间的模糊地带。
