  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价证据
        blocks:
          - type: paragraph
            body: >-
              对 IM Motors 做公开财务尽调，起点是一个不寻常的不平衡：证据足以看出公司如何给车辆定价，却几乎看不到这些车辆最终转化成多少实际收入或毛利。可观察的核心收入流很直接，就是 L6、L7、LS6 和 LS7
              的整车销售；但已审阅来源没有把融资、ADAS、软件、售后或其他变现拆成独立条线。定价线索更好。L6 发布与参数页显示，多配置价格横跨高端主流 EV 价格带；近期 LS6 材料也显示，公司仍能把一款功能丰富的高端
              SUV 放在 RMB 300,000 以下营销。这说明 IM 不是靠超豪华稀缺性变现，而是在高端走廊内靠销量变现。它也说明实际 ASP 会高度受配置组合、上市促销和即将推出的 EREV
              版本成败影响。对投资者而言，定价模型可见，但收入质量仍不可见。
