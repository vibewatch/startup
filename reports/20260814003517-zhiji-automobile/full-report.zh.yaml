    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与高端定位
        blocks:
          - type: paragraph
            body: >-
              Zhiji Automobile Technology 以 IM Motors 对外营销，2020 年 12 月在上海成立，是 SAIC Motor、Alibaba Group 和 Zhangjiang
              Hi-Tech 三方合资公司。公司自己的海外材料并未把这套结构说成普通供应商关系，而是一个有意搭建的生态系统：SAIC 贡献工业设计、工程厚度和整车制造；Alibaba
              提供数据、AI、云和数字服务能力；Zhangjiang 接入上海的科研与创新基础。这个组合重要，因为 IM 不是低价 EV 品牌。SAIC 已明确把 IM 定位为集团面向 RMB 200,000
              以上市场的高端智能 EV 尖兵，当前 L6、L7、LS6 和 LS7 产品线也支撑这一路径。因此，品牌主张不是部分中国 EV
              挑战者尝试的轻资产互联网式打法，而是把高端价格野心、软件驱动差异化和国资体系制造支撑放在一起。更准确的读法是：IM 是嵌在 SAIC 内部的高端战略项目，不是一个拥有完全自主权的独立创业公司。
