      - number: '4.3'
        title: 公开牵引与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开牵引主要通过交付量和融资事件可见。CEIC 序列显示，截至 2025 年 12 月年内销量为 81,017 辆，截至 2026 年 7 月为 45,552 辆；Gasgoo 另行报道该品牌在 2025
              年底累计交付突破 100,000 辆。这足以证明 IM Motors 运营规模已远高于试点。但这些数字本身不能证明经济性良好。独立报道还称，公司 2024 年前 11
              个月严重落后于自身指引，并使用了有意义的购车激励来维持动能。资本端最强事实是 2024 年底融资。多篇报道都指向约 RMB 9.4B 的融资，尽管有些报道四舍五入写作超过 RMB 8B。按任何私营 EV
              标准，这都是大额现金注入；公司披露的资金用途——未来车型、数字底盘、智能驾驶、渠道和海外增长——也凸显前方仍有大量投资。可见交付与可见资本需求放在一起，说明这是一门有需求证明、但尚未证明增长可以自我供血的生意。
