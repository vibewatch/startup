      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              多头论点不难理解。IM 有真实产业母体、真实交付，以及一个比普通高端 EV 贴牌更有差异化的产品故事。如果数字底盘和智能驾驶叙事能转化为耐久客户需求和更高阶旗舰成功，它可能很重要。反向论点同样清晰。IM
              看起来仍是一个资本密集、依赖出资方的 EV
              项目，真实经济性披露不足。客户证明真实，但留存和利润率证明没有跟上。产品差异化可见，但公开安全和质量透明度仍薄。这个组合意味着，投资者不应把工程兴奋感直接转化为估值确信。一个连贯论点确实存在；只是它还没有被足够的定价和财务证据支撑，无法给出强建议。
            claimRefs:
              - CV004
