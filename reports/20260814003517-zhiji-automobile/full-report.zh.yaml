  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局形态与 IM 的位置
        blocks:
          - type: paragraph
            body: >-
              IM Motors 面对的是分层竞争格局，不是一组整齐的同行。中心位置是 NIO、XPeng 等中国智能 EV 直接对手，旁边是 Li Auto 领衔、EREV
              权重更高的玩家，以及仍在塑造软件和充电预期的全球标杆 Tesla China。外围还有 BYD 的高端化推进，以及 BMW、Mercedes 等德系传统巨头；即使本土品牌拿到更多 EV
              份额，它们仍掌握信任、服务厚度和可观高端收入。IM 自身切口更窄：SAIC 把它定位为 RMB 200,000 以上的高端智能 EV 品牌，当前产品线也只有四款核心 BEV 车型。这意味着公司还没有进入 BYD
              或 Tesla 那种规模游戏，也没有 BMW 和 Mercedes 的存量服务与品牌记忆。它主要靠产品质量、软件野心和出资方背书的可信度竞争。
