      - number: '7.4'
        title: 执行风险、缓释因素与终止条件
        blocks:
          - type: paragraph
            body: >-
              执行是把其他风险拉在一起的类别。IM 要求市场相信一条分阶段的 2025–2026
              路线图，范围包括新车发布、更智能的底盘控制、更强自动驾驶能力和更宽高端产品组合。这可以跑通，但前提是公司有足够组织厚度、监管准备和伙伴协同，能按时、按质量交付。Revelio 和招聘信号暗示 IM
              有真实团队，也在主动补能力，但公开证据还不足以把执行风险评为低。最可信的缓释因素，是可见冗余设计、出资方背书和越来越产品化的车主支持界面。最可信的论点破裂触发项同样清楚：监管介入导致 OTA
              或自动驾驶部署延期，线控转向和旗舰发布路线图反复滑坡，或交付放慢并需要更重激励和更深出资方支持。换句话说，IM 不是一个二元风险故事，但它可监控，而且必须主动监控。
