      - number: '8.4'
        title: 退出准备度、否决触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              按现有证据，IM
              还没有准备好接受公开市场式审视。这不等于公司弱；它意味着高置信度资本的披露门槛，远高于当前可得信息。投资者需要子公司财务、确切轮次条款，以及更透明的产品质量记录，才能把这次机会当成有定价的机构成长投资处理。最清晰的正向触发项，是更好的价格或更好的披露。最清晰的负向触发项，是路线图滑坡、OTA
              或自动驾驶上的监管摩擦，以及交付放慢并需要更多激励或更深出资方支持。因此，当前正确判断是继续研究。公司太有实质，不能直接排除；但在今天没有直接尽调权限时，它也太不透明，无法有信心做投资判断。
