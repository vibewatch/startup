      - number: '1.4'
        title: 规模里程碑与执行质量
        blocks:
          - type: paragraph
            body: >-
              运营上，IM Motors 已从概念阶段的高端 EV 故事，走到有可见生产、发布和交付里程碑的品牌，但执行质量仍不均衡。第一个台阶式变化来自初代车型在 SAIC 临港工厂量产；之后的里程碑包括 LS7、LS6 和
              L6 发布，以及公司在 2025 年宣称将在既有 BEV 矩阵旁加入 EREV 产品。交付数据表明确有规模进展：累计交付超过 100,000 辆，CEIC 序列显示截至 2025 年 12 月年内销量为
              81,017 辆，截至 2026 年 7 月录得 45,552 辆。但同一组记录也说明投资者为什么仍要谨慎。外部报道显示，IM 严重错失自身 2024 年指引；Bamboo Works 也明确把 2024
              年融资描述为抵御中国 EV 行业洗牌的保护垫。换句话说，IM 已拿到真实运营牵引，但还没有摆脱品类本身严苛的需求、折扣和盈利证明压力。
