              路线图则指向即将出现的六座 /
              旗舰买家群。明显缺席的是车队、出租车或企业大批量客户的强证据。地域也很直接。最深证明仍在中国大陆，本地车主论坛、评分页面和交付统计都可见。中国以外只有轻量级车迷或评测者关注。这一点重要，因为它让客户故事保持扎实：IM
              在本土市场有真实消费者采用，但还不是一个证据充分的国际消费品牌。从尽调角度看，这张客户地图有帮助，因为经典单一大客户集中度，重要性低于国内高端市场集中度和渠道执行。
