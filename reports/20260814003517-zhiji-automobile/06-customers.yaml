- id: retention-expansion-and-risks
  title: Retention visibility, expansion paths, and concentration risks
  body: This is where the customer case becomes less complete. IM does not publish SaaS-style retention metrics, repeat-purchase cohorts, or a clean measure of active owner engagement relative to delivered vehicles. The best public durability proxy is ongoing owner-community activity plus long-use reviews, which is valuable but imperfect. Expansion logic is more visible than retention logic. IM can potentially expand customers across its own ladder—from sedans to SUVs to range-extended or flagship models—and the official support surface suggests a direct retail relationship that can be deepened over time. But there are risks. Global China EV reported purchase incentives such as financing support and subsidies, and Bamboo Works noted the company lagged its 2024 sales target before raising new capital. In other words, some of the visible growth may be incentive-assisted rather than purely loyalty-driven. The right underwriting stance is that classic top-customer concentration is low, but domestic-market
    concentration, channel execution, and repeat-demand uncertainty are still material.
