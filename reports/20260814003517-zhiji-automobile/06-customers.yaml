  evidenceGaps:
  - id: GU001
    type: private-evidence-only
    severity: material
    topic: owner-retention-and-repeat-purchase
    missingEvidence: Repeat-purchase rates, owner-retention curves, referral rates, and cohort behavior by model.
    whyItMatters: Without owner-retention and repurchase data, public customer proof cannot distinguish durable loyalty from one-time delivery volume.
    diligencePath: Request repeat-buyer rates, service retention, referral volume, and city-tier owner cohorts by model.
