chapter:
  number: 6
  title: Customers
  summary: 'IM Motors has clearly moved beyond concept-stage customer discovery: public delivery data, owner communities, and long-use reviews show a real retail installed base, especially around the LS6 and LS7. But the customer proof remains strongest on ownership anecdotes and adoption totals, not on repeat purchase, retention, or the long-term durability of incentive-supported growth.'
sections:
- id: customer-base
  title: Customer base and observable segments
  body: 'The public record suggests IM is fundamentally a retail premium-EV business. The clearest customer segments map onto the product ladder itself: sedan buyers through the L6 and L7, family and lifestyle SUV buyers through the LS6 and LS7, and an upcoming six-seat / flagship buyer set through the LS8 and LS9 roadmap. What is notably absent is strong evidence of fleet, taxi, or enterprise-volume customers. Geography is also straightforward. The deepest proof remains mainland China, where local owner forums, ratings pages, and delivery statistics are visible. Outside China there is only light enthusiast or reviewer attention. That matters because it keeps the customer story grounded: IM has real consumer adoption in its home market, but it is not yet a widely evidenced international consumer brand. From a diligence standpoint, this customer map is helpful because it makes classic single-account concentration less important than domestic-premium-market concentration and channel execution.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU023
  - CU028
  - CU029
  tableRefs:
  - TU001
  - TU002
  figureRefs:
