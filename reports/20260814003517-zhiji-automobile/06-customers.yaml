- id: adoption-trajectory
  title: Adoption trajectory and model-level traction
  body: Adoption is no longer hypothetical. CEIC’s series shows 81,017 year-to-date sales by December 2025 and 45,552 by July 2026, while Gasgoo reported that IM crossed 100,000 cumulative deliveries in late 2025. That is enough to establish a meaningful installed base. The more nuanced question is which model is carrying the visible customer relationship. Here the answer appears to be the LS6. Among public sources, it has the densest forum activity, user ratings, preorder coverage, and owner-review evidence. The LS7 also shows meaningful traction, but with a smaller proof surface. The L6 and L7 have product visibility and review interest, yet thinner ownership documentation. This split matters because it implies the customer story may be narrower than headline brand delivery totals suggest. A credible read today is that IM has moved beyond pilot scale, but its proof density is uneven across the lineup and strongest where the brand competes most directly in the premium-SUV value band.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU015
  - CU033
  tableRefs:
  - TU003
  figureRefs:
  - FU002
- id: named-proof-and-satisfaction
  title: Named customer proof, outcomes, and satisfaction signals
  body: 'The strongest customer proof is owner or reviewer testimony rather than company case studies. For the LS6, Autohome provides both a ratings surface and an owner-forum footprint, including longer-use writeups that are more valuable than a static spec sheet. For the LS7, a 6,000-kilometer owner review praised handling, quietness, infotainment stability, and acceptable real-world range, while also flagging weaknesses such as missing physical buttons, cabin heat from large glass surfaces, and some range variability. This mix is useful: it feels like real ownership evidence rather than pure promotion. Aggregate satisfaction is visible but narrow. Autohome’s LS6 snapshot showed a 4.60 rating from 122 participants, which is directionally positive, though not a substitute for rigorous cohort or warranty analysis. More broadly, customer outcomes skew toward ride quality, handling, comfort, and tech appeal—not low-cost utilitarian transport. That is consistent with IM’s premium positioning,
    but it also means the brand must keep winning on experience rather than price alone.'
