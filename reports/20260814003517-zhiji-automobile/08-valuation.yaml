- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - NIO
    - Market cap / P-S
    - ~$11B market cap; sub-1x P/S
    - Useful for China premium EV sentiment floor
    - Own profitability and structure differ from IM
  - - XPeng
    - Market cap / revenue
    - ~$11.26B market cap; ~$10.48B revenue
    - Close public China EV growth comp
    - More public-market transparency than IM
  - - Li Auto
    - Revenue / market cap
    - ~$15.5B revenue; public market cap reference
    - Shows what better scale and disclosure look like
    - Different product mix and hybrid exposure
  - - Tesla
    - Market cap / P-S
    - '>$1.3T market cap; mid-teens P/S'
    - Upper-bound aspirational comp for software/value premium
    - Not a realistic near-term direct multiple anchor
  - - BYD
    - Market cap
    - '>$120B market cap'
    - Shows incumbent Chinese EV platform ceiling
    - Scale and profitability far exceed IM today
  - - BMW
    - Market cap
    - ~$40.4B market cap
    - Relevant premium auto reference for brand and segment ambition
    - Legacy incumbent economics differ sharply
  notes: Comparables are reference anchors, not direct valuation formulas; IM lacks the public financials needed for tighter relative-value work.
