- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - LS8/LS9 succeed, digital chassis proves sticky, disclosure improves
    - Could support a valuation toward the high end of the estimated range
    - Regulatory or quality slip still possible
    - Requires several favorable milestones
  - - Base
    - Deliveries grow with SAIC support, but economics stay only partly visible
    - Supports a mid-range valuation and selective engagement
    - Opacity and incentive dependence remain
    - Most consistent with public evidence today
  - - Bear
    - Price war, autonomy friction, and capital intensity dominate
    - Valuation compresses toward a conservative sponsor-backed asset view
    - Flat/down round risk and launch slippage
    - Material if growth quality weakens
  notes: Scenario logic is illustrative and explicitly conditioned on disclosure quality as well as operating performance.
