- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Valuation / price mismatch
    - Entry valuation materially above evidence-supported range
    - Turns a plausible story into poor risk/reward
    - Do not commit until price or disclosure improves
  - - Launch slippage
    - LS8/LS9 or autonomy roadmap meaningfully delayed
    - Weakens moat and execution thesis
    - Reduce conviction sharply
  - - Regulatory friction
    - OTA / recall / export actions delay commercialization
    - Raises cost and slows market access
    - Rebase scenario and valuation lower
  - - Delivery quality erosion
    - Deliveries slow while incentives rise
    - Signals weak demand quality
    - Treat customer proof as less durable
  - - Disclosure remains blocked
    - No financial / valuation transparency after diligence request
    - Prevents underwriting
    - Maintain hold / no-go stance
  notes: These triggers are designed to change the decision, not merely to describe ambient sector risk.
  claimRefs:
  - CV038
  - CV039
  - CV040
  - CV033
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Subsidiary financials
    - Revenue, margin, burn, debt, cash
    - Core underwriting blocker
    - Company finance team / SAIC sponsor
  - - Latest round terms
    - Post-money, cap table, preferences
    - Needed to judge entry price and downside
    - Board / investor relations / counsel
  - - Quality and recall record
    - Warranty, incidents, OTA rollback, complaint severity
    - Needed to trust the product thesis
    - Operations / quality lead
  - - Customer durability
    - Repeat purchase, retention, referral, service usage
    - Needed to convert deliveries into value quality
    - Sales / customer operations
  - - Regulatory workplan
    - Autonomy, OTA, export compliance sequencing
    - Needed to judge roadmap credibility
    - Legal / regulatory affairs
  notes: Without these asks answered, the valuation case remains indicative rather than investable.
