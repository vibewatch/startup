- id: exit-readiness-and-final-asks
  title: Exit readiness, kill triggers, and final diligence asks
  body: On present evidence, IM is not ready for public-market-style scrutiny. That does not mean the company is weak; it means the disclosure bar for high-conviction capital is much higher than what is currently available. An investor would need subsidiary financials, exact round terms, and a more transparent product-quality record before treating the opportunity like a priced institutional growth investment. The cleanest positive trigger is better price or better disclosure. The cleanest negative triggers are roadmap slippage, regulatory friction on OTA or autonomy, and slowing deliveries that need more incentives or deeper sponsor support. This is why the right current call is research more. The company is too substantial to dismiss, but too opaque to underwrite confidently without direct diligence access today externally.
