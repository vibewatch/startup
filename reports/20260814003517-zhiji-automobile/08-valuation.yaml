  name: Zhiji Automobile Technology
chapter:
  number: 8
  title: Valuation
  summary: 'IM Motors has enough scale, sponsor backing, and product differentiation to stay on an investor watchlist, but not enough public price and economics disclosure to justify a conviction-backed entry. The right call is hold / research more: attractive enough to diligence further, too opaque to underwrite aggressively, and highly sensitive to entry valuation, flagship execution, and regulatory outcomes.'
sections:
- id: recommendation-and-valuation-context
  title: Recommendation and public valuation context
  body: 'The public evidence supports a narrow recommendation: hold or research more, not pass and not aggressive commit. IM clearly has more substance than a paper EV startup. Delivery data and funding evidence show real industrial activity, and SAIC sponsorship lowers existential risk. But the public valuation context is still weak because the exact post-money valuation, cap-table terms, and preference structure of the latest round are not disclosed. That missing price context matters more than usual. In private markets, company quality without price is not an investable thesis. The right valuation stance is therefore explicitly price-sensitive. If IM were available at a conservative discount to public Chinese EV peers, it could be interesting. If it were priced near the upper end of premium-EV optimism despite opaque economics, it would be hard to support. The company’s biggest valuation problem is not lack of story; it is lack of disclosed underwriting inputs.'
