- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Real industrial base plus visible deliveries support the idea that IM is a serious premium EV platform.
    - Need sustained delivery scaling plus clearer economics to strengthen this argument.
  - - Digital chassis and smart-driving narrative create differentiated product potential.
    - Need field-quality evidence and on-time flagship execution.
  - - Sponsor support reduces existential startup risk.
    - Need proof that the business is not only sponsor-supported but economically durable.
  - - 'Anti-thesis: economics and valuation are too opaque for conviction.'
    - Would improve materially with audited subsidiary financials and round terms.
  notes: The thesis and anti-thesis are both credible; the investment call depends on how much direct diligence can reduce the anti-thesis.
