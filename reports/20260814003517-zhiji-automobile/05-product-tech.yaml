chapter:
  number: 5
  title: Product & Technology
  summary: IM Motors has evolved from a premium EV badge into a broader product platform with multiple sedans, SUVs, and an increasingly explicit digital-chassis and intelligent-driving stack. Public evidence supports a real technology ambition around steer-by-wire, motion control, and centralized compute, but much of the thesis still depends on roadmap execution and partner-linked disclosures rather than transparent engineering documentation.
sections:
- id: product-surface
  title: Product surface and customer workflows
  body: 'IM Motors now has a product surface that looks more like an emerging premium platform than a single-model startup. The currently visible customer-facing range spans the L6 and L7 sedans plus the LS6 and LS7 SUVs, while official site pages also expose LS8 and LS9 as upcoming large-SUV programs. In workflow terms, the lineup covers premium daily commuting, performance-oriented personal transport, family SUV use, and—on the LS8/LS9 roadmap—long-distance six-seat travel with more lounge-like positioning. That breadth matters because it shows IM is trying to build a platform family rather than win with one hero SKU. At the same time, the official global pages are careful: they explicitly warn that functions, engineering-development values, and even final delivered configurations can differ by market. That caveat makes the right diligence stance clear. The product surface is real and broadening, but investors should treat cross-market headline specs as indicative, not universally shipped
    truth.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE031
  - CE027
  tableRefs:
  - TE001
  - TE002
