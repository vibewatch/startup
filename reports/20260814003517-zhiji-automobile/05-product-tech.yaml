  - FE004
- id: trust-quality-and-gaps
  title: Trust, quality, compliance, and unresolved product gaps
  body: 'IM does have public trust signals, but they are mostly design-intent signals rather than operating-quality proof. The strongest visible items are redundancy claims around brake-by-wire and ECU architecture, repeated battery-safety messaging, active-safety positioning, and explicit language that the chassis is being built toward higher-end intelligent-driving requirements. The recruiting surface also shows there is a real engineering organization behind the product and not just a badge-engineering exercise. But the gaps remain meaningful. The reviewed source set does not provide a model-by-model cybersecurity or privacy certification matrix, does not publish a durable reliability or OTA defect-rate dashboard, and does not offer a true technical whitepaper for the full-domain compute stack. The result is a product thesis with clear engineering ambition and visible shipping progress, but still too much dependence on partner-linked disclosures and marketing narratives. In diligence
    terms, the missing trust evidence is specific: reliability, security, OTA quality, and mature field-performance data.'
