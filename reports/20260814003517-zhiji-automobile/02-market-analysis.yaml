- id: growth-drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'China’s premium EV market still has powerful growth drivers, but they are no longer one-way bullish. Domestic brands now hold 68.8% of the passenger-car market and foreign brands have surrendered a third of their share since 2020, showing how quickly local product cycles and software-led differentiation are changing buyer behaviour. H1 2025 data also show BEVs still hold the larger pool, which supports IM’s installed lineup. At the same time, IM’s decision to add EREVs is a tacit admission that range flexibility still matters. The demand side is therefore split between enthusiasm for intelligent EVs and lingering anxiety over charging, resale value, and after-sales consistency. Policy is also less forgiving than during the subsidy-supercharged era: tax benefits are tapering, and premium price points face greater pressure when purchase support shrinks. International expansion can help, but Europe is no longer an unconstrained release valve because trade compliance, tariffs, and price-undertaking
    rules now mediate access.'
  claimRefs:
  - CM012
  - CM013
  - CM014
