  evidenceGaps:
  - id: GM001
    type: missing-source
    severity: material
    topic: premium-tam
    missingEvidence: A defensible third-party estimate for China’s premium intelligent-EV market specifically above IM Motors’ pricing threshold.
    whyItMatters: Without a clean premium-SAM estimate it is difficult to benchmark IM Motors’ share capture versus total category opportunity.
    diligencePath: Request internal segmentation data or a paid market-study cut defining premium intelligent EVs by price band, body style, and powertrain.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
  - id: GM002
    type: private-evidence-only
    severity: material
    topic: conversion-funnel
    missingEvidence: Actual IM Motors lead-to-order conversion, trim mix, financing penetration, and owner-replacement-cycle data.
    whyItMatters: Public market data show category growth but not IM’s quality of demand or buyer stickiness.
    diligencePath: Request CRM funnel metrics, financed-order mix, and existing-owner upgrade data from management.
    relatedQuestionRefs:
    - QM011
    - QM008
    relatedTableRefs:
    - TM003
  - id: GM003
    type: conflicting-data
    severity: minor
    topic: premium-segment-definition
    missingEvidence: A consistent industry definition for “premium” across imported brands, domestic premium NEVs, and high-spec EREVs.
    whyItMatters: Segment comparisons can overstate or understate IM’s true addressable market depending on whether premium is defined by price, badge, or feature set.
    diligencePath: Define one internal segmentation rule for all diligence work and reconcile external datasets to it.
    relatedQuestionRefs:
    - QM001
    - QM023
    relatedTableRefs:
    - TM001
