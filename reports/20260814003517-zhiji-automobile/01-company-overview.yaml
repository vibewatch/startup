company:
  name: Zhiji Automobile Technology
chapter:
  number: 1
  title: Company Overview
  summary: Zhiji Automobile Technology, operating as IM Motors, is a Shanghai-based premium EV joint venture founded in 2020 by SAIC Motor, Alibaba Group, and Zhangjiang Hi-Tech. The company has built a four-model BEV lineup and secured a large late-2024 financing round reported at RMB 9.4 billion, but still discloses little about standalone revenue, headcount, or post-money valuation. SAIC’s control and industrial backing reduce existential risk relative to smaller EV startups, yet missed sales guidance and continued reliance on fresh capital show the business remains in proof-building mode rather than mature self-sustaining scale.
sections:
- id: identity-and-positioning
  title: Identity, mandate, and premium positioning
  body: 'Zhiji Automobile Technology, which markets itself as IM Motors, was established in Shanghai in December 2020 as a three-party joint venture between SAIC Motor, Alibaba Group, and Zhangjiang Hi-Tech. The company’s own overseas material describes that structure less as a conventional supplier relationship and more as a deliberately assembled ecosystem: SAIC contributes industrial design, engineering depth, and vehicle manufacturing; Alibaba supplies data, AI, cloud, and digital-service capability; and Zhangjiang provides access to Shanghai’s research and innovation base. That mix matters because IM is not positioned as a budget EV label. SAIC has explicitly described IM as the group’s premium intelligent-EV spearhead for the RMB 200,000-plus market, and the current lineup—L6, L7, LS6, and LS7—supports that aspiration. The brand proposition therefore combines premium price ambition, software-led differentiation, and state-backed manufacturing support rather than the asset-light internet-style
    model attempted by some other Chinese EV challengers. It is best read as a premium strategic program embedded inside SAIC rather than an independent startup with unconstrained autonomy.'
