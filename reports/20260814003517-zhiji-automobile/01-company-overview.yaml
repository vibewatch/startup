  evidenceGaps:
  - id: GO001
    type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A post-money valuation, liquidation preferences, and instrument structure for the December 2024 financing.
    whyItMatters: Without valuation and preference terms it is impossible to judge whether IM Motors raised from strength or from sponsor-supported necessity.
    diligencePath: Request the term sheet or cap table bridge covering the Series B and any shareholder top-up commitments.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO003
  - id: GO002
    type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: Standalone revenue, gross margin, operating loss, and cash balance for IM Motors.
    whyItMatters: The investment case cannot be underwritten on unit economics using public sources alone.
    diligencePath: Request audited subsidiary financials or at minimum a management KPI pack covering deliveries, ASP, gross margin, burn, and cash runway.
    relatedQuestionRefs:
    - QO013
    - QO026
    relatedTableRefs:
    - TO001
  - id: GO003
    type: missing-source
    severity: minor
    topic: board-disclosure
    missingEvidence: An official IM Motors leadership or board page showing independent governance and reporting lines.
    whyItMatters: Parent-company control is clear, but governance quality and minority-shareholder protections are not.
    diligencePath: Request an organisation chart, board roster, and reserved-matters schedule for IM Motors.
    relatedQuestionRefs:
    - QO007
    - QO027
    relatedTableRefs:
    - TO002
  - id: GO004
    type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: A dated, auditable employee count broken out by R&D, manufacturing, sales, and service functions.
    whyItMatters: Scale efficiency and the cost base cannot be judged from delivery data alone.
    diligencePath: Ask management for headcount history and current staffing by function alongside payroll growth.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO001
