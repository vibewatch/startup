- id: scale-milestones-and-execution
  title: Scale milestones and execution quality
  body: 'Operationally, IM Motors has moved from concept-stage premium EV story to a brand with visible production, launch, and delivery milestones, but execution quality remains mixed. The first step-change came with mass production of the initial model at SAIC’s Lingang plant; later milestones included the LS7, LS6, and L6 launches, and the company’s 2025 declaration that it would add EREV products alongside its existing BEV matrix. Delivery data show genuine scale progress: cumulative deliveries exceeded 100,000 and CEIC’s series indicates 81,017 year-to-date sales by December 2025, with 45,552 units logged by July 2026. Yet the same record also shows why investors should stay cautious. External reporting indicates IM missed its own 2024 guidance badly, and Bamboo Works explicitly framed the 2024 capital raise as protection against the broader China EV shakeout. In other words, IM has achieved real operating traction, but it has not yet escaped the category’s harsh demand, discounting,
    and proof-of-profitability pressures.'
