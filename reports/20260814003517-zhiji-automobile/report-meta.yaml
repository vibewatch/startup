companyProfile:
  summary: "Zhiji Automobile Technology, operating as IM Motors, is a Shanghai-based premium EV joint venture launched in December 2020 by SAIC Motor, Alibaba Group, and Zhangjiang Hi-Tech. The company combines SAIC manufacturing and engineering depth with Alibaba software and cloud capabilities to pursue the RMB 200,000-plus premium intelligent-EV segment. Public evidence shows real delivery traction, a four-model BEV lineup, and a major late-2024 financing round, but still leaves outside investors without dependable subsidiary-level revenue, margin, cap-table, or valuation disclosure."
  founders:
    - name: "SAIC Motor"
      role: "Co-founder and majority shareholder"
      background: "China's largest domestic automaker by volume and the industrial sponsor that provides manufacturing, engineering, and scale-up capability to IM Motors."
      claimRefs: [CO003, CO007, CO033]
    - name: "Alibaba Group"
      role: "Co-founder and technology shareholder"
      background: "Provides AI, cloud, data, and smart-connectivity capabilities that support IM's software-led product positioning."
      claimRefs: [CO003, CO008]
    - name: "Zhangjiang Hi-Tech"
      role: "Co-founder and ecosystem shareholder"
      background: "Contributes R&D ecosystem access and Shanghai innovation-zone resources to the venture structure."
      claimRefs: [CO003, CO009]
  foundingLocation: "Shanghai, China"
  headquarters: "Shanghai, China"
  productSummary: "IM Motors sells premium battery-electric sedans and SUVs, with current disclosed core models including the L6, L7, LS6, and LS7, and markets differentiation around digital chassis, steer-by-wire, and intelligent-driving features."
  customerFocus: "Chinese retail buyers shopping the mid-to-upper premium EV segment, especially customers comparing domestic smart EV brands against legacy German premium marques and listed China EV challengers."
  businessModel: "Capital-intensive vehicle manufacturing and sales, supported by parent-company industrial infrastructure and positioned around premium pricing, software features, and future smart-driving monetization potential."
  stage: "Growth-stage private EV manufacturer after a large December 2024 Series B round"
  fundingStatus: "Public reporting shows a December 2024 Series B financing of roughly RMB 9.4 billion, but the exact post-money valuation and security terms remain undisclosed."
