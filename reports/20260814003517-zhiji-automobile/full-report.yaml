      - number: '5.2'
        title: Architecture, control stack, and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The clearest technical through-line in public IM materials is the digital chassis. Rather than presenting
              chassis, braking, steering, and software as mostly separate subsystems, IM and its ecosystem describe a
              coordinated motion-control architecture in which steering, braking, suspension, and vehicle dynamics work
              together. Independent technical coverage repeatedly frames this as a six-degree-of-freedom control system
              with a central “brain” logic and unusually fast actuator response. That helps explain why IM’s most
              credible differentiation is not just battery size or horsepower, but the attempt to make the vehicle
              behave like one integrated robotic platform. Smart driving fits into that same story. Public coverage of
              IM AD 3.0 points to a one-stage end-to-end large-model architecture with Momenta, while third-party
              reviews describe heavy semiconductor content and NVIDIA-based compute underneath. The evidence is still
              more journalistic than whitepaper-grade, but it is consistent enough to show that IM is pursuing an
              integrated chassis-plus-compute strategy rather than a purely cosmetic premium brand.
