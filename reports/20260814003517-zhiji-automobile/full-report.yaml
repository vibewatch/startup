      - number: '7.4'
        title: Execution risk, mitigations, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Execution is the risk category that pulls the others together. IM is asking the market to believe in a
              staged 2025–2026 roadmap spanning new vehicle launches, smarter chassis control, stronger autonomy
              capability, and a broader premium portfolio. That can work, but only if the company has enough
              organizational depth, regulatory readiness, and partner coordination to ship on time and at quality.
              Revelio and recruiting signals imply that IM has a real team and is actively building capability, but not
              enough public evidence exists to call execution risk low. The most credible mitigations are visible
              redundancy design, sponsor backing, and an increasingly productized owner-support surface. The most
              credible thesis-break triggers are equally clear: regulatory intervention that delays OTA or autonomy
              deployment, repeated roadmap slippage on steer-by-wire and flagship launches, or slowing deliveries that
              require heavier incentives and deeper sponsor support. In other words, IM is not a binary risk story—but
              it is a monitorable one, and active monitoring is essential.
