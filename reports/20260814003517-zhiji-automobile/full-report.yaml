      - number: '5.3'
        title: Maturity, roadmap, and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests that parts of IM’s stack are already shipping, but the product story remains
              heavily staged. Coverage of the L6 refresh and Auto Shanghai presentations sketches a four-step
              steer-by-wire roadmap: first-generation integrated control in 2024, second-generation braking and
              rear-steering expansion in 2025, a pure front-and-rear steer-by-wire flagship later in 2025, and a fuller
              predictive-motion-control stack in 2026. That is ambitious, and it matters because it means investors are
              underwriting execution across several release waves, not just a current product snapshot. The same staged
              logic applies to compute and intelligent-driving dependencies. Momenta appears central to IM AD 3.0 and IM
              AD Max; NVIDIA’s Thor roadmap appears important for next-generation smart-driving capability; and SAIC
              remains the industrial parent under the chassis program. The roadmap can support a strong differentiation
              case if executed, but it also means supplier, software, and regulatory timing all remain first-order
              product variables.
