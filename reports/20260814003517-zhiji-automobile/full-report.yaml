      - number: '3.2'
        title: Capabilities, pricing logic, and trust levers
        blocks:
          - type: paragraph
            body: >-
              Across China’s premium EV segment, the battleground has shifted away from simple motor performance and
              into software, intelligent driving, energy confidence, and trust. XPeng pushes the strongest explicit
              smart-EV stack narrative among the listed Chinese peers, while NIO’s battery-swap and service architecture
              create a differentiated ownership proposition that can raise switching costs. Li Auto approaches the
              market from a different direction, using family practicality and EREV flexibility. Tesla remains the
              category’s reference point for software cadence and charging confidence, even though its market share no
              longer defines the whole market. BMW and Mercedes matter for a different reason: they convert legacy
              trust, dealer and service infrastructure, and luxury heritage into a continuing premium budget pool.
              Pricing comparison therefore has to be handled cautiously. In China, trims and incentives move too quickly
              for one static price table to stay reliable; packaging logic and ownership proposition are more
              decision-useful than a single headline sticker price.
