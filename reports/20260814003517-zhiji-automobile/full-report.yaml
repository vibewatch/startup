      - number: '2.2'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map for IM Motors is still dominated by affluent households rather than enterprise fleets. In
              practice, buyer, user, and payer usually sit within the same household: a technology-forward
              owner-operator choosing a sedan, or a family decision-maker buying a premium SUV where comfort, space, and
              driver-assistance matter together. The key segmentation split is not B2B versus B2C; it is
              imported-premium versus domestic-premium, and BEV certainty versus EREV flexibility. IM’s L6 and L7 skew
              toward software-conscious sedan buyers, while the LS6 and LS7 address family and lifestyle SUV use cases.
              The budget owner is still a retail premium customer, but the purchase decision increasingly resembles
              consumer electronics logic: software features, charging experience, cockpit quality, and perceived
              intelligence now decide the shortlist more than brand heritage alone. That trend is why IM’s market is
              best thought of as a smart-premium consumer market, even though it still overlaps with the broader
              luxury-car budget pool dominated by Mercedes, BMW, and Tesla.
