  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape shape and where IM sits
        blocks:
          - type: paragraph
            body: >-
              IM Motors competes in a layered landscape rather than against one neat peer set. At the center are direct
              Chinese smart-EV rivals such as NIO and XPeng, adjacent EREV-heavy players led by Li Auto, and Tesla China
              as the global benchmark that still shapes software and charging expectations. Around them sit BYD’s
              premium push and German incumbents such as BMW and Mercedes, which continue to command trust, service
              depth, and substantial premium revenue even as domestic brands gain EV share. IM’s own niche is narrower:
              SAIC frames it as a premium intelligent-EV brand above RMB 200,000, and the current lineup remains only
              four core BEV models. That means the company is not yet playing the same scale game as BYD or Tesla, nor
              does it have the same installed service and brand memory as BMW and Mercedes. It therefore competes
              primarily on product quality, software ambition, and sponsor-backed credibility.
