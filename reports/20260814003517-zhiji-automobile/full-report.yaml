      - number: '6.2'
        title: Adoption trajectory and model-level traction
        blocks:
          - type: paragraph
            body: >-
              Adoption is no longer hypothetical. CEIC’s series shows 81,017 year-to-date sales by December 2025 and
              45,552 by July 2026, while Gasgoo reported that IM crossed 100,000 cumulative deliveries in late 2025.
              That is enough to establish a meaningful installed base. The more nuanced question is which model is
              carrying the visible customer relationship. Here the answer appears to be the LS6. Among public sources,
              it has the densest forum activity, user ratings, preorder coverage, and owner-review evidence. The LS7
              also shows meaningful traction, but with a smaller proof surface. The L6 and L7 have product visibility
              and review interest, yet thinner ownership documentation. This split matters because it implies the
              customer story may be narrower than headline brand delivery totals suggest. A credible read today is that
              IM has moved beyond pilot scale, but its proof density is uneven across the lineup and strongest where the
              brand competes most directly in the premium-SUV value band.
