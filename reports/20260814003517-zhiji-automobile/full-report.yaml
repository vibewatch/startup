      - number: '8.3'
        title: Comparable set and scenario framing
        blocks:
          - type: paragraph
            body: >-
              The comparable set shows why IM valuation must be handled carefully. Public EV valuations span a very wide
              band. Tesla trades on a very different scale and multiple regime. BYD and BMW show how large, profitable
              auto platforms can command tens of billions of dollars of equity value. XPeng and NIO are the more
              relevant scale peers for a Chinese EV company still proving long-term economics, while Li Auto shows what
              stronger revenue scale can look like. Revenue comparisons reinforce that IM is still much closer to an
              under-disclosed growth story than to the operating maturity of a listed incumbent. Those peers do not give
              a single clean answer, but they do anchor a reasonable scenario range. A conservative low case treats IM
              as a sponsor-backed but opaque EV program worth only a modest premium to capital raised. A base case
              assumes continued scaling and sponsor support but still discounts weak disclosure. A high case requires
              successful flagship launches, regulatory execution, and stronger evidence that IM can approach upper-tier
              listed-peer quality perceptions. The important point is not the exact number; it is that the range remains
              wide because the evidence quality remains mixed and because the market already prices public EVs very
              differently depending on transparency and quality.
