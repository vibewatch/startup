chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mandate, and premium positioning
        blocks:
          - type: paragraph
            body: >-
              Zhiji Automobile Technology, which markets itself as IM Motors, was established in Shanghai in December
              2020 as a three-party joint venture between SAIC Motor, Alibaba Group, and Zhangjiang Hi-Tech. The
              company’s own overseas material describes that structure less as a conventional supplier relationship and
              more as a deliberately assembled ecosystem: SAIC contributes industrial design, engineering depth, and
              vehicle manufacturing; Alibaba supplies data, AI, cloud, and digital-service capability; and Zhangjiang
              provides access to Shanghai’s research and innovation base. That mix matters because IM is not positioned
              as a budget EV label. SAIC has explicitly described IM as the group’s premium intelligent-EV spearhead for
              the RMB 200,000-plus market, and the current lineup—L6, L7, LS6, and LS7—supports that aspiration. The
              brand proposition therefore combines premium price ambition, software-led differentiation, and
              state-backed manufacturing support rather than the asset-light internet-style model attempted by some
              other Chinese EV challengers. It is best read as a premium strategic program embedded inside SAIC rather
              than an independent startup with unconstrained autonomy.
