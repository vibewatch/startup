      - number: '1.3'
        title: Capital formation, uses of funds, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              IM Motors’ December 2024 financing is one of the most important proof points in the company’s history
              because it arrived during a period of visible stress across China’s EV sector. English-language coverage
              differs on the exact headline—some outlets reported “over RMB 8 billion,” while others reported RMB 9.4
              billion—but the directional conclusion is consistent: the company secured unusually large fresh capital at
              a time when weaker new-energy-vehicle ventures were struggling to survive. Sources also align on the
              intended use of that capital: digital chassis, steer-by-wire, intelligent driving, new-model development,
              broader channels, and overseas expansion. The financing does not, however, solve IM’s disclosure problem.
              The reviewed public materials do not provide a dependable post-money valuation, standalone revenue,
              standalone margins, or audited profitability. That leaves outside investors able to observe capital access
              and product ambition, but not yet able to underwrite unit economics with high confidence.
