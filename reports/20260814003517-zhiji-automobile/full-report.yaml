      - number: '7.3'
        title: Dependency, customer, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              The next risk layer is dependency. IM still sits inside SAIC’s industrial and financial orbit, and that is
              both a strength and a weakness. It reduces existential risk relative to weaker EV startups, but it also
              makes the business harder to judge as a stand-alone economic engine. Product execution is also
              partner-linked: Momenta matters for the smart-driving stack, NVIDIA matters for future compute capability,
              and China’s premium EV market remains the main arena in which IM must prove durable demand. That last
              point matters because visible growth may be more fragile than delivery totals imply. Incentives and
              financing support are visible. Independent reporting also documented a meaningful 2024 target miss before
              fresh capital arrived. In a crowded premium EV market, those are not footnotes—they are evidence that
              customer traction, margin durability, and sponsor dependence are linked risks. Exports could help over
              time, but Europe’s trade posture means international diversification is not a free risk reducer.
            claimRefs:
