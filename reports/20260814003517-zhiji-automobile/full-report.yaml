  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk profile
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is not abstract for IM—it is embedded in the product. China’s 2025 tightening of
              admission, recall, and OTA management for intelligent connected vehicles means software behavior and
              defect remediation are now more obviously compliance matters. That matters because IM’s product thesis
              leans heavily on software-defined chassis and intelligent-driving evolution. Draft-rule coverage and legal
              commentary also point in the same direction: regulators are narrowing the room for informal OTA
              experimentation when safety is involved. The next layer of risk is forward autonomy compliance. China’s
              L3/L4 safety-standard direction means that aggressive marketing around advanced autonomy can become a
              liability if legal timelines or technical maturity slip. On exports, Europe adds another legal-regulatory
              layer. Even if IM builds the right products, anti-subsidy and tariff measures can still weaken economics
              or slow entry. The public record does not surface a major litigation or IP battle at IM itself, but the
              absence of visible disputes is not the same as a clean legal diligence file.
            claimRefs:
              - CR001
