      - number: '1.2'
        title: Leadership visibility and governance reality
        blocks:
          - type: paragraph
            body: >-
              Public visibility into IM Motors’ operating leadership is materially thinner than visibility into its
              shareholders and product launches. Secondary reference sources identify Liu Tao as co-CEO and Jiang Jun as
              the senior SAIC executive most directly associated with IM’s operating build-out, while SAIC’s own
              materials reinforce the parent company’s continuing strategic oversight of the venture. What is clear is
              the control logic: SAIC owns the majority stake, publicly frames IM as its only premium EV brand, and
              carries the industrial burden of productisation and scale-up. What is less clear is whether IM has a
              separately disclosed independent board, what checks exist against parent-company strategic redirection,
              and how much autonomy the operating team has on pricing, channels, and international rollout. For
              investors, that means the venture enjoys a strong sponsor but also inherits the decision cadence, internal
              capital allocation, and political priorities of a large state-backed automotive group.
            claimRefs:
