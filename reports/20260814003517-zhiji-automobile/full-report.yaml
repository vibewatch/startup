      - number: '7.2'
        title: Operational, quality, and security risk profile
        blocks:
          - type: paragraph
            body: >-
              Operationally, IM’s risk comes from the same thing that makes the company interesting: complexity. A
              steer-by-wire, centralized digital-chassis architecture should in theory improve performance and autonomy
              readiness, but it also expands the number of ways hardware, software, and regulatory validation can go
              wrong. Battery and 800V architecture introduce similar tension—these systems support strong product
              differentiation, yet higher-voltage integration and premium-performance promises raise the cost of
              mistakes. Public safety messaging today is stronger on redundancy language than on audited operating
              proof. The reviewed sources do not provide a robust reliability dashboard, OTA defect-rate history,
              cybersecurity matrix, or after-sales-quality readout. That does not prove a problem exists, but it does
              mean outside investors are being asked to trust a sophisticated control stack without the level of
              operating transparency they would ideally want. In risk terms, IM’s biggest operational weakness is not
              obviously product quality failure today; it is incomplete public proof about whether the quality systems
              are already strong enough for the complexity being promised.
