      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict on IM Motors is therefore mixed. Revenue quality cannot be called strong or weak
              with confidence because the company does not publish subsidiary revenue, realised ASP, gross margin, or
              cash-conversion data. Margin path is even less visible. What is visible is capital intensity: premium EV
              hardware, continuing platform R&D, and a financing round large enough to fund another major product cycle.
              SAIC sponsorship materially reduces existential risk relative to smaller startups, but it also obscures
              how much of IM’s economic resilience is intrinsic versus parent-supported. Listed peers such as NIO, Li
              Auto, XPeng, Tesla, BMW, and Mercedes show what a proper disclosure baseline would look like. Against that
              benchmark, IM remains under-disclosed. The decisive blockers are straightforward: no standalone financial
              statements, no cap-table terms, no cash and burn disclosure, and no clean read on whether recent delivery
              growth is generating healthy gross profit or simply consuming more capital.
