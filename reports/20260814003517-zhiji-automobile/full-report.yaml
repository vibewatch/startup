      - number: '4.3'
        title: Public traction and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public traction is visible mainly through delivery volumes and financing events. CEIC’s series shows
              81,017 year-to-date sales by December 2025 and 45,552 by July 2026, while Gasgoo separately reported the
              brand crossing 100,000 cumulative deliveries in late 2025. That is enough to establish that IM Motors is
              operating well above pilot scale. But those numbers do not by themselves prove good economics. Independent
              coverage also says the company badly lagged its own 2024 guidance after eleven months and used meaningful
              purchase incentives to maintain momentum. On the capital side, the strongest fact is the late-2024
              financing round. Multiple reports converge on a raise around RMB 9.4 billion, though some rounded it as
              more than RMB 8 billion. That is a large cash injection by any private-EV standard, and the stated uses of
              funds—future vehicles, digital chassis, smart driving, channels, and overseas growth—underscore how much
              investment still lies ahead. The combination of visible deliveries and visible capital need suggests a
              business with proof of demand, but not proof that growth is self-funding.
