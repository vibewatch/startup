      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis is understandable. IM has real industrial parentage, real deliveries, and a product story
              that is more differentiated than a generic premium EV badge. The digital-chassis and smart-driving
              narrative could matter if it translates into durable customer demand and higher-tier flagship success. The
              anti-thesis is equally clear. IM still looks like a capital-intensive, sponsor-dependent EV program whose
              real economics are under-disclosed. Customer proof is real, but retention and margin proof are not.
              Product differentiation is visible, but public safety and quality transparency are still thin. That
              combination means investors should resist converting engineering excitement directly into valuation
              conviction. A coherent thesis exists; it is just not yet matched by enough pricing and financial evidence
              to justify a strong recommendation.
