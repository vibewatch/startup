  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing evidence
        blocks:
          - type: paragraph
            body: >-
              Public financial diligence on IM Motors starts with an unusual imbalance: there is enough evidence to see
              how the company prices vehicles, but almost none to see what those vehicles translate into as realised
              revenue or gross profit. The observable core revenue stream is straightforward—vehicle sales across the
              L6, L7, LS6, and LS7—but no reviewed source breaks out financing, ADAS, software, after-sales, or other
              monetisation as independent lines. Pricing clues are better. The L6 launch and parameter pages show a
              multi-trim range spanning premium mainstream EV price points, while recent LS6 materials show the company
              can still market a feature-rich premium SUV below RMB 300,000. That suggests IM is monetising through
              volume within a premium corridor, not through ultra-luxury scarcity. It also suggests realised ASP will be
              highly sensitive to trim mix, launch promotions, and the success of upcoming EREV variants. For investors,
              that means the pricing model is visible, but revenue quality still is not.
