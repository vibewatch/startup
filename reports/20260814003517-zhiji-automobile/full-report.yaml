  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and observable segments
        blocks:
          - type: paragraph
            body: >-
              The public record suggests IM is fundamentally a retail premium-EV business. The clearest customer
              segments map onto the product ladder itself: sedan buyers through the L6 and L7, family and lifestyle SUV
              buyers through the LS6 and LS7, and an upcoming six-seat / flagship buyer set through the LS8 and LS9
              roadmap. What is notably absent is strong evidence of fleet, taxi, or enterprise-volume customers.
              Geography is also straightforward. The deepest proof remains mainland China, where local owner forums,
              ratings pages, and delivery statistics are visible. Outside China there is only light enthusiast or
              reviewer attention. That matters because it keeps the customer story grounded: IM has real consumer
              adoption in its home market, but it is not yet a widely evidenced international consumer brand. From a
              diligence standpoint, this customer map is helpful because it makes classic single-account concentration
              less important than domestic-premium-market concentration and channel execution.
