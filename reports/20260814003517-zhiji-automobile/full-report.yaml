      - number: '6.3'
        title: Named customer proof, outcomes, and satisfaction signals
        blocks:
          - type: paragraph
            body: >-
              The strongest customer proof is owner or reviewer testimony rather than company case studies. For the LS6,
              Autohome provides both a ratings surface and an owner-forum footprint, including longer-use writeups that
              are more valuable than a static spec sheet. For the LS7, a 6,000-kilometer owner review praised handling,
              quietness, infotainment stability, and acceptable real-world range, while also flagging weaknesses such as
              missing physical buttons, cabin heat from large glass surfaces, and some range variability. This mix is
              useful: it feels like real ownership evidence rather than pure promotion. Aggregate satisfaction is
              visible but narrow. Autohome’s LS6 snapshot showed a 4.60 rating from 122 participants, which is
              directionally positive, though not a substitute for rigorous cohort or warranty analysis. More broadly,
              customer outcomes skew toward ride quality, handling, comfort, and tech appeal—not low-cost utilitarian
              transport. That is consistent with IM’s premium positioning, but it also means the brand must keep winning
