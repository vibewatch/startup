  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              IM Motors sits inside a market that is large in absolute terms but difficult to define precisely at the
              premium intelligent-EV layer. The broadest lens is China passenger-vehicle demand, where H1 2025 sales
              reached 10.891 million units. The next lens is passenger NEVs at 5.458 million units, already 50.1% of the
              market and therefore no longer a niche. The more relevant lens for IM is narrower still: premium EVs and
              now EREVs competing above roughly RMB 200,000, where domestic brands are using software, ADAS, and
              value-for-money to pry share away from German incumbents and Tesla. Public sources do not publish a clean
              TAM for that exact niche, so the chapter uses constrained proxies instead: total passenger NEV volume, BEV
              volume, premium-brand revenue rankings, and IM Motors’ own delivery scale. That approach is less elegant
              than a single market-research number, but it is more honest because it preserves the ambiguity between
              broad category growth and IM’s much narrower practical addressable market.
