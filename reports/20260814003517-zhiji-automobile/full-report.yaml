      - number: '3.3'
        title: Switching costs, distribution power, and supply access
        blocks:
          - type: paragraph
            body: >-
              Switching costs in premium EVs are real but not prohibitive. Unlike enterprise software, buyers can
              replace one vehicle brand with another at the next purchase cycle without years of implementation debt.
              The lock-in mechanisms that do exist come from charging networks, battery-swap ecosystems, software
              familiarity, residual-value expectations, and after-sales service confidence. On that basis, NIO and Tesla
              have especially strong ownership-experience moats, while BMW and Mercedes still dominate pure service
              trust. Distribution and supply power are even more lopsided. BYD, Tesla, BMW, and Mercedes all enter
              competition with stronger scale, procurement leverage, and capital access than IM Motors, though IM does
              benefit from SAIC’s industrial backing. This matters because in a crowded market, scale advantages can be
              used not only to widen margins, but also to absorb temporary pricing pressure and sustain broader model
              refresh cycles than a narrower challenger can comfortably match.
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP030
              - CP029
      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              IM Motors’ current moat is therefore conditional rather than deeply entrenched. SAIC sponsorship is
              meaningful, but sponsorship alone is not the same as a durable premium brand. Product features, digital
              cockpit quality, and ADAS narratives are increasingly copyable, especially when better-capitalised rivals
              can launch refreshes quickly and accept thinner near-term margins. The company’s real strategic risk is a
              weak-middle outcome: too premium to fight in the mass market, too small to match the scale of BYD or
              Tesla, and not yet trusted enough to dislodge BMW or Mercedes across the full premium pool. Publicly
              listed Chinese peers show a second warning sign. Even after scaling materially, NIO, Li Auto, and XPeng
              all trade at market-cap levels that imply investors still question the durability of premium EV economics.
              For IM, that means the competitive burden is not simply building good cars; it is building a premium
              franchise that buyers, lenders, and investors all trust to persist.
