- id: public-traction-and-capital
  title: Public traction and capital adequacy
  body: Public traction is visible mainly through delivery volumes and financing events. CEIC’s series shows 81,017 year-to-date sales by December 2025 and 45,552 by July 2026, while Gasgoo separately reported the brand crossing 100,000 cumulative deliveries in late 2025. That is enough to establish that IM Motors is operating well above pilot scale. But those numbers do not by themselves prove good economics. Independent coverage also says the company badly lagged its own 2024 guidance after eleven months and used meaningful purchase incentives to maintain momentum. On the capital side, the strongest fact is the late-2024 financing round. Multiple reports converge on a raise around RMB 9.4 billion, though some rounded it as more than RMB 8 billion. That is a large cash injection by any private-EV standard, and the stated uses of funds—future vehicles, digital chassis, smart driving, channels, and overseas growth—underscore how much investment still lies ahead. The combination of visible
    deliveries and visible capital need suggests a business with proof of demand, but not proof that growth is self-funding.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI022
  - CI023
  - CI024
  - CI030
  - CI028
  tableRefs:
  - TI004
  figureRefs:
  - FI003
- id: financial-verdict-and-gaps
  title: Financial verdict and diligence blockers
  body: 'The financial verdict on IM Motors is therefore mixed. Revenue quality cannot be called strong or weak with confidence because the company does not publish subsidiary revenue, realised ASP, gross margin, or cash-conversion data. Margin path is even less visible. What is visible is capital intensity: premium EV hardware, continuing platform R&D, and a financing round large enough to fund another major product cycle. SAIC sponsorship materially reduces existential risk relative to smaller startups, but it also obscures how much of IM’s economic resilience is intrinsic versus parent-supported. Listed peers such as NIO, Li Auto, XPeng, Tesla, BMW, and Mercedes show what a proper disclosure baseline would look like. Against that benchmark, IM remains under-disclosed. The decisive blockers are straightforward: no standalone financial statements, no cap-table terms, no cash and burn disclosure, and no clean read on whether recent delivery growth is generating healthy gross profit or simply
    consuming more capital.'
