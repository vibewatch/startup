  evidenceGaps:
  - id: GI001
    type: private-evidence-only
    severity: blocking
    topic: standalone-financial-statements
    missingEvidence: Audited IM Motors income statement, balance sheet, and cash-flow statement.
    whyItMatters: Without subsidiary financial statements, revenue quality, margin path, and runway cannot be underwritten.
    diligencePath: Request the last twelve months and two-year history of audited or management-certified financial statements for IM Motors.
    relatedQuestionRefs:
    - QI014
    - QI009
    - QI017
    - QI018
    relatedTableRefs:
