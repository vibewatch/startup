- id: go-to-market-and-unit-economics
  title: Go-to-market motion and unit-economics visibility
  body: 'The public record points to a consumer-retail go-to-market motion supported by test drives, direct product launches, and purchase promotions rather than large disclosed fleet contracts. That creates some useful clues: management is willing to use financing support and purchase subsidies to stimulate demand, which implies that acquisition cost and realised pricing likely matter at least as much as headline list price. Yet the public record stops there. No reviewed source gives CAC, sales payback, conversion, renewal economics, or explicit customer-lifetime value. Unit economics are therefore largely inferential. The product set clearly carries expensive hardware and R&D content—batteries, premium interiors, ADAS hardware, digital chassis, steer-by-wire, and smart-cabin investment—and workforce data suggest the operating cost base is already in the low-thousands of employees. The company still does not publish enough to say whether that cost stack is improving or being offset by scale.
    The right reading is that IM has operational traction, but not yet a public unit-economics story.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  tableRefs:
