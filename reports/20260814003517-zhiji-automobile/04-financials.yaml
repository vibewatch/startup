    - TI005
  - id: GI002
    type: private-evidence-only
    severity: material
    topic: cap-table-and-terms
    missingEvidence: Exact Series B amount, valuation, liquidation preferences, and any parent-guarantee structure.
    whyItMatters: Financing size alone does not reveal whether IM raised from strength or under support-protective terms.
    diligencePath: Request the cap table, latest term sheet, and any shareholder support agreements tied to the 2024 financing.
    relatedQuestionRefs:
    - QI016
    - QI020
    relatedTableRefs:
    - TI004
  - id: GI003
    type: missing-source
    severity: material
    topic: realized-asp
    missingEvidence: Monthly realised ASP and model/trim mix by channel and incentive status.
    whyItMatters: Launch prices do not reveal whether IM’s premium positioning survives into net realised revenue.
