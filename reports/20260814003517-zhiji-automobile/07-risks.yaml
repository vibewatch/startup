- id: operational-and-quality
  title: Operational, quality, and security risk profile
  body: 'Operationally, IM’s risk comes from the same thing that makes the company interesting: complexity. A steer-by-wire, centralized digital-chassis architecture should in theory improve performance and autonomy readiness, but it also expands the number of ways hardware, software, and regulatory validation can go wrong. Battery and 800V architecture introduce similar tension—these systems support strong product differentiation, yet higher-voltage integration and premium-performance promises raise the cost of mistakes. Public safety messaging today is stronger on redundancy language than on audited operating proof. The reviewed sources do not provide a robust reliability dashboard, OTA defect-rate history, cybersecurity matrix, or after-sales-quality readout. That does not prove a problem exists, but it does mean outside investors are being asked to trust a sophisticated control stack without the level of operating transparency they would ideally want. In risk terms, IM’s biggest operational
    weakness is not obviously product quality failure today; it is incomplete public proof about whether the quality systems are already strong enough for the complexity being promised.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR036
  - CR037
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: dependency-and-model-risk
  title: Dependency, customer, and financial-model risk
  body: 'The next risk layer is dependency. IM still sits inside SAIC’s industrial and financial orbit, and that is both a strength and a weakness. It reduces existential risk relative to weaker EV startups, but it also makes the business harder to judge as a stand-alone economic engine. Product execution is also partner-linked: Momenta matters for the smart-driving stack, NVIDIA matters for future compute capability, and China’s premium EV market remains the main arena in which IM must prove durable demand. That last point matters because visible growth may be more fragile than delivery totals imply. Incentives and financing support are visible. Independent reporting also documented a meaningful 2024 target miss before fresh capital arrived. In a crowded premium EV market, those are not footnotes—they are evidence that customer traction, margin durability, and sponsor dependence are linked risks. Exports could help over time, but Europe’s trade posture means international diversification
    is not a free risk reducer.'
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR035
  - CR038
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: execution-mitigations-and-kill-criteria
  title: Execution risk, mitigations, and kill criteria
  body: 'Execution is the risk category that pulls the others together. IM is asking the market to believe in a staged 2025–2026 roadmap spanning new vehicle launches, smarter chassis control, stronger autonomy capability, and a broader premium portfolio. That can work, but only if the company has enough organizational depth, regulatory readiness, and partner coordination to ship on time and at quality. Revelio and recruiting signals imply that IM has a real team and is actively building capability, but not enough public evidence exists to call execution risk low. The most credible mitigations are visible redundancy design, sponsor backing, and an increasingly productized owner-support surface. The most credible thesis-break triggers are equally clear: regulatory intervention that delays OTA or autonomy deployment, repeated roadmap slippage on steer-by-wire and flagship launches, or slowing deliveries that require heavier incentives and deeper sponsor support. In other words, IM is not a
    binary risk story—but it is a monitorable one, and active monitoring is essential.'
