  topStrengths:
    - SAIC 控股和产业支持，显著降低了相较独立 EV 初创公司的生存风险。
    - IM 已经越过概念车阶段，累计交付超过 100,000 辆，2025-2026 年销售活动也有可见证据。
    - 产品叙事不只是泛高端 EV 标签，核心在数字底盘和智能驾驶架构。
    - 2024 年 12 月的大额融资轮显示，即便中国 EV 行业剧烈出清，公司仍能拿到战略资本。
    - 如果旗舰车型发布、质量执行和信息披露同步改善，品牌仍有上行空间。
  topRisks:
    - 准确投后估值、优先股堆叠和稀释条款未公开，仅靠公开证据无法约束入场价格。
    - 独立收入、利润率、现金消耗和债务无法在公开材料中审计，单车经济性仍未被证明。
    - 中国高端 EV 竞争激烈，可能迫使降价；Tesla、BYD、Li Auto、NIO 和 XPeng 都在挤压认知和定价。
    - 智能驾驶、OTA 和线控转向功能让监管、质量、召回和准入风险高于更简单的整车架构。
    - IM 仍显著依赖发起方，母公司支持或新车发布执行一旦放慢，估值可能快速压缩。
  unresolvedGaps:
    - 最近一轮准确投后估值在已审阅公开来源中仍未披露。
    - 包含收入、毛利率、烧钱速度、现金和债务明细的子公司层面财务报表未公开。
    - 股权结构表、清算优先权和 Series B 投资者保护条款不可见。
    - 长期留存、复购和客户满意度深度的独立证据有限。
    - 产品质量、召回和实地表现透明度仍弱于上市可比公司标准。
