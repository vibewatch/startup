  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-durability
      missingEvidence: NRR, GRR, logo and revenue churn, renewal rates, contract duration, and cohort expansion by customer segment.
      whyItMatters: >-
        Aggregate credentials and partner reach cannot establish recurring revenue durability or
        whether customers expand after initial deployment.
      diligencePath: >-
        Request a monthly customer-cohort export for the last 36 months, reconcile beginning and
        ending recurring revenue, and inspect renewal and termination terms for the largest cohorts.
      relatedQuestionRefs: [QU004]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top 1, top 5, and top 10 customer revenue and payment-volume shares, plus partner- and corridor-level concentration.
      whyItMatters: >-
        A broad market footprint can still conceal dependence on a small number of enterprise
        customers, card networks, banks, corridors, or distribution partners.
      diligencePath: >-
        Obtain anonymized customer revenue and volume distributions by quarter, identify linked
        counterparties, and stress-test loss of each top customer and infrastructure partner.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named end-customer case studies with production status, deployment date, baseline, quantified outcome, and customer-authored confirmation.
      whyItMatters: >-
        Partner announcements and generic vertical claims do not prove that named customers remain
        in production or realize measurable value.
      diligencePath: >-
        Request three reference calls spanning financial institutions, platforms, and travel, then
        verify production volumes, implementation duration, outcomes, renewal status, and expansion.
      relatedTableRefs: [TU003]
