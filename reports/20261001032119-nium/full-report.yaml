        - Continuity, trapped implementation effort, and customer-migration risk
      - - Card-scheme access
        - Visa / Mastercard / Discover / UATP
        - Principal-scheme access for card issuance
        - Four schemes named; credential, volume, and gross-profit mix unavailable
        - Rule change, assessment, suspension, or economics deterioration
        - High
        - Multi-scheme participation
        - Scheme-specific exposure and substitute routing remain unquantified
      - - House-bank and FX infrastructure
        - J.P. Morgan Payments
        - House-bank relationship and automated cross-currency solution
        - Relationship disclosed by the partner; share of flows unavailable
        - Pricing change, counterparty disruption, or loss of local-bank reach
        - High
        - Partner describes automated FX risk mitigation
        - No evidence of alternative house banks, tested migration, or exposure limits
    notes: >-
      Severity-ordered dependency sample. Partner and company disclosures verify relationships, not concentration
      percentages, contractual substitutability, or independent resilience.
