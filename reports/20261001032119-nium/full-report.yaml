        title: Capital History, Stakeholders, and Adverse Signal
        blocks:
          - type: paragraph
            body: >-
              Clay's April 2026 dossier reports at least $312 million of disclosed funding across 11 rounds. It lists a
              $200 million Series D in July 2021 at a $1 billion-plus post-money valuation and a $50 million Series E on
