              - CO014
      - number: '1.3'
        title: Leadership, Functional Coverage, and Governance Gaps
        blocks:
          - type: paragraph
            body: >-
              Founder and CEO Prajit Nanu remains the central strategic operator. Nium's About page attributes product
              strategy and regulatory positioning directly to him, while Unify reports that he has led the company since
              its founding era. That combination creates founder dependence even though the operating bench covers
              finance, operations, business development, technology, risk, compliance, and marketing. In February 2026,
              company-issued material announced Sekhar Cidambi as CTO, Amaresh Mohan as Chief Risk and Compliance
              Officer, and Danielle Gotkis as CMO. Their prior experience improves functional coverage, but appointment
              announcements do not demonstrate succession readiness. No assigned source provides a complete board
              roster, committee structure, founder voting rights, or a documented CEO succession plan.
            claimRefs:
              - CO001
              - CO010
              - CO011
