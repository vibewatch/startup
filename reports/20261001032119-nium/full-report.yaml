  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          The June 2024 $50M Series E and $1.4B post-money mark are corroborated by company-issued and independent
          market-data sources.
        - Executed financing documents that materially differ from the announced amount or valuation.
      - - Thesis
        - Nium reported >50% 2023 revenue growth and launched US card issuance in 2026.
        - >-
          Audited current growth, retention, or unit economics that show deterioration or expansion without acceptable
          returns.
      - - Thesis
        - >-
          Nium claims more than 41M card credentials issued across APAC, the Middle East, and Europe in the twelve
          months before the US launch.
        - Program-level active-card, volume, revenue, and loss data showing weak utilization or economics.
      - - Anti-thesis
        - >-
          Funding databases disagree materially: Tracxn records $312M over 11 rounds, while FundedIQ records $205M over
          3 rounds.
        - A company-certified cap table and complete financing ledger reconcile the difference.
      - - Anti-thesis
        - >-
          The only assigned source claiming a 2026 S-1 filing is a low-reputation aggregator with internally
          inconsistent financing data.
        - >-
          A regulator-hosted filing, confidential submission evidence, or named underwriter mandate confirms the
          process.
      - - Anti-thesis
        - Client service can depend on financial partners that may suspend or terminate their support.
        - >-
          Partner concentration, portability, and tested continuity data demonstrate limited revenue and service
          exposure.
    notes: >-
      Company-issued operating claims are not treated as independently verified; funding-database coverage differs and
      must be reconciled through primary documents.
