              or credit capacity. The investor list spans sovereign, strategic, and growth-capital participants, but
              economic stakes and control rights are private. Operationally, Nium continued expanding with US domestic
              card issuance in August 2026. The adverse pool is thin: an archived Trustpilot extract showed only three
              reviews and included two unprompted complaints about transfer reliability and contactability. That
