  - id: FR001
    title: Evidence-Calibrated Risk Heatmap
    type: matrix
    summary: >-
      The matrix distinguishes observed conditions, conditional contractual triggers, and risks whose public frequency
      remains unknown.
    data:
      columns:
        - Moderate Impact
        - High Impact
        - Thesis-Critical Impact
      rows:
        - label: Observed / Ongoing Controls
          values:
            - label: Compliance-control buildout
              value: Moderate
              note: >-
                A current hiring disclosure describes NPRAs and remediation responsibilities, but not control
                effectiveness.
            - label: UK safeguarding structure
              value: High
              note: Segregation is documented, while FSCS exclusion and potential insolvency shortfall remain.
            - label: No observed thesis-critical event established
              value: No data
              note: >-
                The assigned evidence does not establish sponsor withdrawal, insolvency, or a material platform
                incident.
        - label: Observed / Legal and Execution
          values:
            - label: IPO timetable extension
              value: Moderate
              note: The planned listing moved from the second quarter of 2025 to the end of 2026.
            - label: India enforcement overhang
              value: High
              note: A 2024 freeze is reported, but current status and financial attribution remain unresolved.
            - label: No quantified thesis-critical loss
              value: No data
              note: The assigned evidence does not quantify a current loss, reserve, or license impairment.
        - label: Conditional / Client Allocation
          values:
            - label: Client-side loss allocation
              value: Moderate
              note: Specified unauthorized-transaction losses can remain with the client.
            - label: Service warranty limitations
              value: High
              note: The contract does not generally warrant uninterrupted, error-free, or loss-free service.
            - label: No client-triggered thesis break defined
              value: No data
              note: Customer-level loss, churn, and concentration denominators are unavailable.
        - label: Conditional / Counterparty
          values:
            - label: Card-scheme economics change
              value: Moderate
              note: Four schemes are named, but scheme-level economics and exposure are not disclosed.
            - label: House-bank or FX disruption
              value: High
              note: J.P. Morgan is identified as house bank, while alternatives and migration readiness are not evidenced.
            - label: Sponsor or financial-partner withdrawal
              value: Critical
              note: The terms permit immediate termination when the relevant partner ends or suspends service.
        - label: Unknown / Security and Reliability
          values:
            - label: Credential compromise
              value: Moderate
              note: The contract allocates specified losses, but no event-frequency denominator is available.
            - label: Cyber or availability incident
              value: High
              note: No defensible incident-frequency denominator is available from the assigned evidence.
            - label: Material uncontained incident
              value: Critical
              note: No occurrence is established; independent control and incident evidence is required.
        - label: Unknown / Financial Durability
          values:
            - label: Full-year profitability miss
              value: Moderate
              note: Only a company-claimed profitable month is evidenced; audited full-year data is missing.
            - label: Runway compression
              value: High
              note: Cash, burn, debt, regulatory capital, and commitments are unavailable.
            - label: Safeguarding shortfall or legal escalation
              value: Critical
              note: The terms preserve insolvency shortfall exposure, while current India-case status is unavailable.
    approximationNotes: >-
      Qualitative placement uses documented condition versus conditional trigger versus unknown frequency; impact
      categories are analyst judgments, not measured loss probabilities.
