chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Footprint
        blocks:
          - type: paragraph
            body: >-
              Nium says it was founded in 2014 by Prajit Nanu and Michael Bermingham, initially as consumer-remittance
              product Instarem, and rebranded in 2019. It is now co-headquartered in Singapore and San Francisco and
              sells a unified infrastructure layer for cross-border payouts, multi-currency accounts, foreign exchange,
              account verification, and physical, virtual, and stablecoin-linked cards. The platform is aimed at banks,
              fintechs, payroll providers, travel companies, marketplaces, and other enterprises that want payment
              capabilities without rebuilding local rails. The company currently claims payout reach across 190+
              countries and a footprint of 40+ licenses, authorizations, and registrations. Those breadth metrics are
              company-issued; the Singapore legal agreement does, however, identify the licensed Singapore entity and
              its MAS Major Payment Institution license.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO007
      - number: '1.2'
        title: Scale and Cover-Metric Reliability
        blocks:
          - type: paragraph
            body: >-
              Nium's current homepage claims more than 1,000 customers and $84 billion in payments processed over the
              preceding 12 months. These are operating throughput and customer-count claims, not revenue, ARR, cash
              generation, or independently audited financial results. Workforce disclosure is internally inconsistent
              even within the current About page: one panel shows 700+ employees, while its FAQ says 750+ people
              globally. The snapshot therefore preserves both thresholds rather than selecting a false point estimate.
              Publicly supported revenue, ARR, gross margin, profitability, cash balance, debt, and credit-facility
              figures are absent from the assigned pool. Their absence is a diligence gap and is not evidence that Nium
              has no leverage or ample runway.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
