    title: Recommendation summary
    columns:
      - Decision field
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Do not underwrite an entry until current economics and security terms are verified.
      - - Confidence
        - Low
        - Public evidence corroborates the 2024 round but not current fair value.
      - - Risk rating
        - High
