  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited growth and margins validate expansion; the US launch monetizes; filing evidence and liquidity path are
          independently confirmed.
        - >-
          A premium to the June 2024 $1.4B mark may be supportable only after diligence; no numeric range is supportable
          now.
        - Execution, competition, regulatory complexity, and multiple compression.
        - Positive company-reported issuance scale, but no audited current economics.
      - - Base
        - >-
          The 2024 financing remains the last reliable mark; expansion continues, but economics and timing remain
          undisclosed.
        - >-
          Retain $1.4B as a reference rather than fair value; require price protection and verified dilution before
          return underwriting.
        - Stale mark, unknown preferences, and delayed exit.
        - Corroborated round data offset by missing current financials.
      - - Bear
        - >-
          Growth or unit economics disappoint, the claimed IPO path is not verified, or partner dependencies interrupt
          service.
        - A discount or down-round may be required, but its magnitude cannot be estimated from the assigned evidence.
        - Liquidity delay, financing overhang, partner concentration, and security uncertainty.
        - Conflicting aggregator records and unverified exit claims increase downside uncertainty.
    notes: >-
      Scenarios are conditional, not forecasts; no probability percentages, current revenue multiple, or return range is
      asserted because the required denominators are unavailable.
