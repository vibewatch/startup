callouts:
  - calloutType: "risk"
    title: "Pre-IPO Margin Compression and Unverified Profitability"
    body: "While Nium grew reported net revenue from $82 million in 2022 to approximately $121 million in 2023, its 2024 Series E valuation reset to $1.4 billion and delayed 2026 IPO timeline reflect persistent operating losses and tightening capital market discipline. Absence of audited gross margin disclosures and undisclosed India corridor revenue exposure remain critical diligence blockers."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI009"
      - "CI010"

  - calloutType: "insight"
    title: "Card Issuance and House-Bank Integration as Capital Efficiency Levers"
    body: "Nium's deployment of a just-in-time funding model for domestic and international card issuance across APAC, Europe, and the US enables enterprise clients to optimize working capital while generating recurring program management and interchange fees. Partnering with J.P. Morgan as house bank mitigates foreign exchange volatility across 100 currencies, improving operational scalability."
    claimRefs:
      - "CI002"
      - "CI007"
      - "CI008"
      - "CI012"

