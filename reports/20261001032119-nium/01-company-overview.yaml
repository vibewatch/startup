slug: "nium"
runDate: "2026-10-01"
company:
  name: "Nium"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Nium is a 2014-founded, Singapore- and San Francisco-co-headquartered payments infrastructure company whose current website claims $84 billion of payments processed over the last 12 months, 1,000+ customers, and a network spanning 190+ countries. Its last reported financing benchmark is a $50 million Series E at a $1.4 billion post-money valuation in June 2024; current revenue, ARR, cash, debt, ownership, and board composition remain undisclosed in the assigned evidence."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Business Model, and Footprint"
    body: >-
      Nium says it was founded in 2014 by Prajit Nanu and Michael Bermingham,
      initially as consumer-remittance product Instarem, and rebranded in 2019.
      It is now co-headquartered in Singapore and San Francisco and sells a
      unified infrastructure layer for cross-border payouts, multi-currency
      accounts, foreign exchange, account verification, and physical, virtual,
      and stablecoin-linked cards. The platform is aimed at banks, fintechs,
      payroll providers, travel companies, marketplaces, and other enterprises
      that want payment capabilities without rebuilding local rails. The
      company currently claims payout reach across 190+ countries and a
      footprint of 40+ licenses, authorizations, and registrations. Those
      breadth metrics are company-issued; the Singapore legal agreement does,
      however, identify the licensed Singapore entity and its MAS Major Payment
      Institution license.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO006"
      - "CO007"
  - id: "scale-and-cover-metrics"
    title: "Scale and Cover-Metric Reliability"
    body: >-
      Nium's current homepage claims more than 1,000 customers and $84 billion
      in payments processed over the preceding 12 months. These are operating
      throughput and customer-count claims, not revenue, ARR, cash generation,
      or independently audited financial results. Workforce disclosure is
      internally inconsistent even within the current About page: one panel
      shows 700+ employees, while its FAQ says 750+ people globally. The
      snapshot therefore preserves both thresholds rather than selecting a
      false point estimate. Publicly supported revenue, ARR, gross margin,
      profitability, cash balance, debt, and credit-facility figures are absent
      from the assigned pool. Their absence is a diligence gap and is not
      evidence that Nium has no leverage or ample runway.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Functional Coverage, and Governance Gaps"
    body: >-
      Founder and CEO Prajit Nanu remains the central strategic operator.
      Nium's About page attributes product strategy and regulatory positioning
      directly to him, while Unify reports that he has led the company since
      its founding era. That combination creates founder dependence even
      though the operating bench covers finance, operations, business
      development, technology, risk, compliance, and marketing. In February
      2026, company-issued material announced Sekhar Cidambi as CTO, Amaresh
      Mohan as Chief Risk and Compliance Officer, and Danielle Gotkis as CMO.
      Their prior experience improves functional coverage, but appointment
      announcements do not demonstrate succession readiness. No assigned
      source provides a complete board roster, committee structure, founder
      voting rights, or a documented CEO succession plan.
    claimRefs:
      - "CO001"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO002"
  - id: "capital-milestones-and-adverse-signal"
    title: "Capital History, Stakeholders, and Adverse Signal"
    body: >-
      Clay's April 2026 dossier reports at least $312 million of disclosed
      funding across 11 rounds. It lists a $200 million Series D in July 2021
      at a $1 billion-plus post-money valuation and a $50 million Series E on
      June 4, 2024 at a $1.4 billion post-money valuation, led by the Brunei
      Investment Agency. Funding raised is not cash available: no assigned
      evidence establishes current liquidity, secondary transactions, debt, or
      credit capacity. The investor list spans sovereign, strategic, and
      growth-capital participants, but economic stakes and control rights are
      private. Operationally, Nium continued expanding with US domestic card
      issuance in August 2026. The adverse pool is thin: an archived Trustpilot
      extract showed only three reviews and included two unprompted complaints
      about transfer reliability and contactability. That self-selected sample
      is a diligence lead, not an incident-rate benchmark.
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
callouts:
  - calloutType: "strength"
    title: "Broad licensed distribution surface"
    body: "Nium claims 190+ destination countries and 40+ licenses, authorizations, and registrations; its current Singapore agreement identifies the MAS-licensed operating entity and license number."
    claimRefs:
      - "CO006"
      - "CO007"
  - calloutType: "risk"
    title: "Cover metrics stop short of financial durability"
    body: "Payment volume and funding are disclosed, but neither is revenue or cash available. Audited revenue, ARR, margins, cash, debt, and runway remain open diligence items."
    claimRefs:
      - "CO005"
      - "CO012"
