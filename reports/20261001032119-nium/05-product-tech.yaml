figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Nium modular architecture stack spanning client access, core services, data pipelines, and underlying clearing rails.
    data:
      layers:
        - label: Client Ingress & API Gateway
          detail: AWS API Gateway handling SSL termination, threat protection against DDoS and injection, and unified JSON REST API routing.
          modules:
            - AWS API Gateway
            - WAF & Threat Filtering
            - Developer Portal & Sandbox
          outputs:
            - Authenticated JSON API Requests
        - label: Client Applications & Management
          detail: Web portals and merchant interfaces built on React and Next.js supporting multi-tenant treasury operations.
          modules:
            - Next.js Web Portal
            - Corporate Onboarding
            - Card Management UI
          outputs:
            - User Session State
        - label: Business Logic & Microservices
          detail: Distributed services implemented in Java Spring Boot and Node.js managing payouts, cards, and multi-currency accounts.
          modules:
            - Payout Orchestration Service
            - Card Issuing Engine (JIT Funding)
            - Multi-Currency Ledger
          outputs:
            - Transaction Commands
        - label: Data Pipeline & Stream Processing
          detail: Event-driven data processing pipeline migrating to AWS cloud using Apache Kafka, Apache Airflow, dbt, and Amazon Redshift.
          modules:
            - Apache Kafka Event Bus
            - Apache Airflow Orchestration
            - Amazon Redshift & dbt
          outputs:
            - Reconciliation Events & Analytical Datasets
        - label: FX & Liquidity Management
          detail: Automated real-time foreign exchange execution across 2,000+ currency pairs integrated with institutional liquidity providers.
          modules:
            - Automated FX Engine
            - Treasury Liquidity Buffer
            - Currency Pair Pricing Service
          outputs:
            - Executed Spot & Forward Conversions
        - label: Global Banking & Card Scheme Rails
          detail: Direct clearing access and principal membership connections across global payment rails, card networks, and partner banks.
          modules:
            - J.P. Morgan Payments Rails
            - Card Schemes (Visa, Mastercard, Discover, UATP)
            - Local Real-Time Clearing Systems
          outputs:
            - Final Settlement Confirmation
