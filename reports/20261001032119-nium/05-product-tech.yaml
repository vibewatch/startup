chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Nium operates a modular B2B payments infrastructure platform spanning real-time cross-border payouts,
    multi-currency accounts, and physical and virtual card issuance across 190+ countries and 100 currencies.
    Its architecture combines AWS-hosted microservices with AWS API Gateway threat protection, continuous monthly
    release cycles, and core banking integration through J.P. Morgan Payments to automate FX and liquidity management.
sections:
  - id: section-product-definition
    title: Core Product Suite and Customer Workflows
    body: >-
      Nium provides modular B2B payments infrastructure designed to enable banks, fintech enterprises, and global
      platforms to collect, convert, and disburse funds seamlessly across international boundaries. The platform is
      structured around three primary capabilities: real-time cross-border payouts, multi-currency account management,
      and multi-region card issuance. Through a unified REST API suite, enterprise clients can initiate domestic
      transfers across more than 190 countries and 100 currencies, with 100 corridors clearing in real time. Local
      collection accounts span 35 to 40 markets, allowing global merchants to receive inbound funds without maintaining
      dedicated overseas bank accounts. On August 19, 2026, Nium expanded its card issuance infrastructure to North
      America, adding domestic US commercial card issuing to its established operations across APAC, Europe, and the
      Middle East.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    tableRefs:
      - TE001
  - id: section-use-cases
    title: Enterprise Use Cases and Operational Workflows
    body: >-
      Nium's modular payment architecture targets complex enterprise workflows that require automated payment
      orchestration across disparate banking rails. In the travel and hospitality sector, travel agencies and aggregators
      rely on Nium's virtual card engine to settle supplier payments with hotels, airlines, and ground operators, issuing
      tens of millions of card credentials annually across European and Asia-Pacific markets. Traditional travel booking
      workflows suffer from fragmented payment methods and heavy reconciliation overhead; Nium replaces disparate wire
      transfers and localized credit lines with automated single-use virtual cards that match transaction limits to booking
      amounts. For global marketplaces and gig-economy platforms, Nium dispatches real-time contractor disbursements
      directly to local bank accounts, digital wallets, and cards, eliminating intermediary correspondent banking fees and
      multi-day settlement delays.
    claimRefs:
      - CE003
      - CE006
      - CE007
      - CE012
    tableRefs:
      - TE002
  - id: section-architecture
    title: Technology Stack and Operating Infrastructure
    body: >-
      Nium operates a cloud-native infrastructure deployed on Amazon Web Services (AWS), utilizing AWS EC2 compute
      instances and AWS API Gateway as its primary client ingress layer. The API gateway provides automated edge defenses
      against injection attacks, cross-site scripting, SSL buffer vulnerabilities, phishing attempts, and distributed
      denial-of-service (DDoS) events. At the application layer, Nium builds its developer web portal and management
      interfaces using React and Next.js, while backend payment orchestration and ledger microservices are implemented
      in Java Spring Boot and Node.js. Nium is actively modernizing its data architecture by migrating legacy on-premises
      systems to an AWS cloud-based data platform powered by Apache Airflow, Amazon Redshift, dbt, and Apache Kafka. Core
      foreign exchange settlement and multi-currency liquidity automation are executed via direct architectural integration
      with J.P. Morgan Payments.
    claimRefs:
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
      - CE015
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: section-security-compliance
    title: Deployment Cadence, Security Controls, and Regulatory Moats
    body: >-
      Nium balances rapid software innovation with enterprise-grade stability by enforcing an average release cycle of
      one month for its core platform services. All incremental API modifications maintain strict backward compatibility,
      allowing financial institutions and enterprise platforms to consume updates without operational disruption. Any
      breaking structural changes are segregated into discrete major API versions that clients adopt at their own pace.
      Supporting this technical delivery is an extensive global regulatory framework: Nium maintains payment service
      licenses and authorizations across more than 40 countries, including principal membership in major card schemes such
      as Visa, Mastercard, Discover, and UATP. This dual foundation of modular software release discipline and
      multi-jurisdictional licensing forms Nium's primary competitive barrier against regional fintech payment processors.
    claimRefs:
      - CE004
      - CE013
      - CE014
      - CE016
