callouts:
  - calloutType: strength
    title: Just-In-Time Card Funding Architecture
    body: >-
      Nium's programmatic card issuance architecture supports just-in-time funding, where capital is drawn at the moment of
      authorization rather than locked in pre-funded accounts. This capability allows travel aggregators and spend management
      platforms to optimize working capital across 34+ issuing markets without balance fragmentation.
    claimRefs:
      - CE004
      - CE005
  - calloutType: risk
    title: Core Banking Counterparty Dependency
    body: >-
      Nium's global real-time FX and cross-currency settlement relies on deep architectural integration with J.P. Morgan
      Payments as its primary house bank. While this mitigates short-term FX volatility and opens local clearing across APAC
      and LATAM, it concentrates operational dependency on a single banking counterparty's rails and risk appetite.
    claimRefs:
      - CE011
      - CE012
