evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Current audited revenue, ARR, margins, cash balance, debt, credit-facility capacity, cash burn, and runway.
    whyItMatters: >-
      Transaction volume and funding raised do not establish revenue quality, cash availability, leverage, or financing
      durability.
    diligencePath: >-
      Request audited statements, current management accounts, bank statements, debt schedules, covenant packages, and
      the fully executed credit agreements under NDA.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A dated workforce report reconciling the 700+ and 750+ thresholds displayed on Nium's current About page.
    whyItMatters: A reliable denominator is needed to assess organizational scale, productivity, and operating-cost exposure.
    diligencePath: Obtain the current HRIS headcount by legal entity, geography, employment status, and reporting date.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete parent and subsidiary board rosters, committee mandates, reporting lines, executive tenure, and a
      documented CEO succession plan.
    whyItMatters: >-
      Public executive biographies do not establish independent oversight, decision rights, or resilience to founder
      departure.
    diligencePath: >-
      Request the organization chart, board and committee charters, recent minutes, director registers, and succession
      materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership-and-control
    missingEvidence: >-
      Fully diluted cap table, founder holdings, investor ownership, preference stack, board-designation rights,
      secondaries, and voting agreements.
    whyItMatters: Named investors and financing amounts do not reveal control, liquidation economics, alignment, or overhang.
    diligencePath: >-
      Review the cap table, shareholders agreement, financing documents, board consents, option ledger, and
      secondary-transfer records.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-som
    missingEvidence: >-
      Audited transaction volume breakdown isolating Nium's exact corporate payment volume market share within
      specialized B2B cross-border corridors.
    whyItMatters: >-
      Broad $56T global payments TAM and $15.14T virtual card projections obscure whether Nium is expanding or losing
      market share within its addressable enterprise niche.
    diligencePath: >-
      Request audited corridor-level payment volumes and revenue by client segment during pre-IPO financial disclosure
      review.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: minor
    topic: spend-management-take-rates
    missingEvidence: >-
      Detailed take-rate and interchange fee split data across North American domestic issuing versus cross-border card
      programs.
    whyItMatters: >-
      Unit economics and revenue yield per transaction differ substantially between domestic US card issuance and
      complex cross-border payout corridors.
    diligencePath: Review Nium's client fee schedules and commercial contracts under non-disclosure diligence.
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Audited institutional fee schedules, realized gross revenue margins per payment corridor, and enterprise volume
      discount matrices for Nium and its primary peers.
    whyItMatters: >-
      B2B payments infrastructure vendors maintain opaque, privately negotiated pricing for tier-1 enterprises; without
      realized take rates, precise margin compression risks cannot be definitively quantified.
    diligencePath: Request customer billing reconciliations and RFP bid-sheet histories during confidential management diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross contribution margin and net revenue retention (NRR) broken down by enterprise client cohort for
      FY2023, FY2024, and FY2025 YTD.
    whyItMatters: >-
      Gross margin and NRR are required to underwrite unit economics, terminal profitability, and customer retention
      dynamics ahead of the target 2026 US IPO.
    diligencePath: >-
      Request audited financial statements, contribution margin reports, and cohort retention schedules under NDA during
      IPO diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: geographic-revenue
    missingEvidence: >-
      Granular geographic revenue breakdown, specifically India corridor contribution versus APAC, Europe, and Americas
      revenue.
    whyItMatters: >-
      Given historical regulatory scrutiny in India and Wirecard Forex India integration, geographic concentration
      determines regulatory and compliance downside risk.
    diligencePath: >-
      Obtain entity-level statutory filings for NIUM INDIA PRIVATE LIMITED and NIUM PTE. LTD. to verify corridor
      concentration.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Public third-party SOC 2 Type II compliance audit reports, ISO 27001 certification certificates, or external
      penetration testing executive summaries verifying Nium's API gateway and microservice infrastructure.
    whyItMatters: >-
      While Nium documents AWS API Gateway threat protections and monthly patch cycles, independent verification of
      application-layer vulnerability management is undisclosed to public investors.
    diligencePath: >-
      Request confidential SOC 2 Type II compliance reports and latest annual penetration test summaries under NDA
      during technical due diligence.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-durability
    missingEvidence: NRR, GRR, logo and revenue churn, renewal rates, contract duration, and cohort expansion by customer segment.
    whyItMatters: >-
      Aggregate credentials and partner reach cannot establish recurring revenue durability or whether customers expand
      after initial deployment.
    diligencePath: >-
      Request a monthly customer-cohort export for the last 36 months, reconcile beginning and ending recurring revenue,
      and inspect renewal and termination terms for the largest cohorts.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top 1, top 5, and top 10 customer revenue and payment-volume shares, plus partner- and corridor-level
      concentration.
    whyItMatters: >-
      A broad market footprint can still conceal dependence on a small number of enterprise customers, card networks,
      banks, corridors, or distribution partners.
    diligencePath: >-
      Obtain anonymized customer revenue and volume distributions by quarter, identify linked counterparties, and
      stress-test loss of each top customer and infrastructure partner.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named end-customer case studies with production status, deployment date, baseline, quantified outcome, and
      customer-authored confirmation.
    whyItMatters: >-
      Partner announcements and generic vertical claims do not prove that named customers remain in production or
      realize measurable value.
    diligencePath: >-
      Request three reference calls spanning financial institutions, platforms, and travel, then verify production
      volumes, implementation duration, outcomes, renewal status, and expansion.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: US sponsor-bank continuity
    missingEvidence: >-
      Executed CRB and CFSB agreements, bank-level transaction concentration, notice and cure rights, regulatory
      correspondence, and tested failover evidence.
    whyItMatters: >-
      The public terms make sponsor withdrawal an immediate service-termination trigger, but do not establish
      operational redundancy.
    diligencePath: >-
      Review unredacted sponsor agreements, obtain bank confirmations, inspect volume and revenue by bank, and observe a
      tabletop or production failover test.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: India enforcement
    missingEvidence: >-
      Current court and enforcement docket, operative freeze orders, ownership tracing for the funds, legal-reserve
      assessment, and final disposition.
    whyItMatters: >-
      The assigned public source reports a historical enforcement action but cannot establish current exposure,
      attribution, or financial impact.
    diligencePath: >-
      Obtain current Directorate of Enforcement records, Indian counsel's case-status letter, bank-account ownership
      schedules, and management's remediation chronology.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: security and reliability controls
    missingEvidence: >-
      Completed external threat-intelligence results, SOC 2 Type II report, penetration tests, material-incident
      register, uptime by corridor, recovery objectives, and fraud-loss denominators.
    whyItMatters: >-
      Contract language defines risk allocation but cannot establish incident frequency, control effectiveness, or
      expected loss.
    diligencePath: >-
      Commission independent security review and inspect control reports, incident tickets, credential-remediation logs,
      uptime exports, fraud cohorts, and insurer claims.
    relatedQuestionRefs:
      - QR004
      - QR005
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial durability
    missingEvidence: >-
      Audited FY2025 and FY2026 financials, monthly EBITDA reconciliation, free-cash-flow bridge, unrestricted cash,
      regulatory capital, debt, commitments, and runway.
    whyItMatters: >-
      A company-claimed profitable month does not establish full-year profitability, cash generation, burn, or cash
      available through the delayed IPO window.
    diligencePath: >-
      Reconcile audited statements to management accounts and bank balances; review regulatory-capital schedules, debt
      covenants, monthly cash flow, and downside runway.
    relatedQuestionRefs:
      - QR007
      - QR008
  - type: private-evidence-only
    severity: material
    topic: partner concentration
    missingEvidence: >-
      Volume, revenue, gross profit, settlement exposure, termination rights, and tested alternatives by sponsor bank,
      card scheme, house bank, FX provider, and corridor.
    whyItMatters: >-
      Named relationships establish dependency breadth but do not quantify concentration, economics, or
      substitutability.
    diligencePath: >-
      Build a counterparty concentration schedule, inspect agreements and pricing, review outage and migration history,
      and test alternative routing.
    relatedQuestionRefs:
      - QR006
      - QR008
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory / legal risk register
    missingEvidence: >-
      An exhaustive jurisdiction-by-jurisdiction register of licenses, open examinations, litigation, complaints,
      sanctions findings, and remediation obligations.
    whyItMatters: >-
      The public sample cannot prove that all material legal and regulatory exposures across Nium's footprint were
      captured.
    diligencePath: >-
      Reconcile the legal-entity and license inventory to regulator portals, litigation searches, compliance monitoring,
      and management's complete matters list.
    relatedQuestionRefs:
      - QR001
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: valuation-inputs
    missingEvidence: >-
      Audited 2024-2026 revenue, gross margin, operating cash flow, cash balance, loss rates, customer retention, and
      cohort economics.
    whyItMatters: >-
      Without consistent current denominators, neither the 8.5x reported multiple nor an entry-price return model can be
      validated.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, cohort retention schedules, loss-rate reports, and a
      quality-of-earnings review.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV008
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-terms
    missingEvidence: >-
      Current fully diluted cap table, liquidation preferences, anti-dilution rights, debt, secondary marks, and
      option-pool obligations.
    whyItMatters: >-
      Post-money headline valuation does not establish investor ownership, preference overhang, dilution, or proceeds
