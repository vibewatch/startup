  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "US sponsor-bank continuity"
      missingEvidence: "Executed CRB and CFSB agreements, bank-level transaction concentration, notice and cure rights, regulatory correspondence, and tested failover evidence."
      whyItMatters: "The public terms make sponsor withdrawal an immediate service-termination trigger, but do not establish operational redundancy."
      diligencePath: "Review unredacted sponsor agreements, obtain bank confirmations, inspect volume and revenue by bank, and observe a tabletop or production failover test."
      relatedQuestionRefs:
        - "QR001"
        - "QR002"
        - "QR008"
      relatedTableRefs:
        - "TR001"
        - "TR003"
    - type: "missing-source"
      severity: "material"
      topic: "India enforcement"
      missingEvidence: "Current court and enforcement docket, operative freeze orders, ownership tracing for the funds, legal-reserve assessment, and final disposition."
      whyItMatters: "The assigned public source reports a historical enforcement action but cannot establish current exposure, attribution, or financial impact."
      diligencePath: "Obtain current Directorate of Enforcement records, Indian counsel's case-status letter, bank-account ownership schedules, and management's remediation chronology."
      relatedQuestionRefs:
        - "QR003"
        - "QR008"
      relatedTableRefs:
        - "TR001"
    - type: "missing-source"
      severity: "material"
      topic: "security and reliability controls"
      missingEvidence: "Completed external threat-intelligence results, SOC 2 Type II report, penetration tests, material-incident register, uptime by corridor, recovery objectives, and fraud-loss denominators."
      whyItMatters: "Contract language defines risk allocation but cannot establish incident frequency, control effectiveness, or expected loss."
      diligencePath: "Commission independent security review and inspect control reports, incident tickets, credential-remediation logs, uptime exports, fraud cohorts, and insurer claims."
      relatedQuestionRefs:
        - "QR004"
        - "QR005"
        - "QR008"
      relatedTableRefs:
        - "TR002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial durability"
      missingEvidence: "Audited FY2025 and FY2026 financials, monthly EBITDA reconciliation, free-cash-flow bridge, unrestricted cash, regulatory capital, debt, commitments, and runway."
      whyItMatters: "A company-claimed profitable month does not establish full-year profitability, cash generation, burn, or cash available through the delayed IPO window."
      diligencePath: "Reconcile audited statements to management accounts and bank balances; review regulatory-capital schedules, debt covenants, monthly cash flow, and downside runway."
      relatedQuestionRefs:
        - "QR007"
        - "QR008"
