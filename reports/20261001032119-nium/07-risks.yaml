chapter:
  number: 7
  title: "Risks"
  summary: "The highest-evidence risk is structural dependency: Nium's US services are bank-sponsored, the payment service bank holds settlement funds, and sponsor or financial-partner withdrawal can trigger immediate service termination. Public evidence also leaves material gaps around the current India enforcement matter, independently verified full-year profitability, cash runway, service reliability, fraud losses, and cyber-control effectiveness."
sections:
  - id: "regulatory-legal-and-safeguarding"
    title: "Regulatory, Legal, and Safeguarding Exposure"
    body: >-
      Nium's US legal structure makes partner-bank continuity a thesis-critical dependency rather than a remote contractual detail. Its customer and direct-service terms state that Nium US is a service provider, not the licensed money transmitter for the covered US services; Cross River Bank or Community Federal Savings Bank provides those services, and the applicable bank has sole custody of settlement-account funds. The same terms allow immediate termination after a payment service bank ends a client's access. Two-bank availability offers some potential redundancy, but the public terms do not prove operational failover, reciprocal notice periods, or diversification of transaction volume. In the UK, segregation under CASS 15 is a meaningful control, yet the terms also state that FSCS protection does not apply and that insolvency costs and a proportionate shortfall can affect recovery. Separately, Wikipedia reports a 2024 Indian enforcement action involving funds attributed to third-party shell entities held in Nium India accounts; the assigned evidence does not establish the matter's current status or attribute those funds to Nium itself.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR008"
      - "CR012"
    tableRefs:
      - "TR001"
  - id: "operational-security-and-contract-allocation"
    title: "Operational, Security, and Contractual Risk Allocation"
    body: >-
      Nium's direct-services contract documents controls but also allocates meaningful operating risk to clients. It excludes liability for unauthorized transactions caused by compromised client accounts except where a qualifying Nium-platform breach caused the compromise, and it provides the services "AS IS" without a general warranty that the platform will be uninterrupted, error-free, secure, or free from data loss. The contract further permits immediate termination when a financial partner suspends or ends the services it supplies to Nium. These clauses do not prove that an outage, breach, or fraud loss occurred; they show who bears specified downside if one occurs. The company-issued compliance job posting indicates that Nium is building and scaling product-compliance processes, including New Product Risk Assessments, but a hiring document does not establish control effectiveness. Likewise, the prefetched Lunar Cyber page returned a scan-in-progress interface rather than completed findings, so no incident count should be inferred from the search snippet. The decisive diligence items are audited control reports, uptime and recovery statistics, fraud-loss rates, credential-security coverage, and incident history.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR009"
      - "CR016"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "partner-and-network-dependencies"
    title: "Partner and Network Dependencies"
    body: >-
      Nium's scale increases the consequence of partner disruption. Company-issued launch materials say the platform issued more than 41 million card credentials in the preceding 12 months and identify Visa, Mastercard, Discover, and UATP as principal schemes. That supports breadth, not low concentration: the assigned evidence does not disclose card volume, gross profit, or settlement exposure by scheme, sponsor bank, corridor, or customer. A J.P. Morgan case study also identifies J.P. Morgan as Nium's house bank and describes an automated cross-currency solution used to manage foreign-exchange exposure. The relationship is a partner-issued success story, so it verifies the disclosed operating relationship but is not an independent benchmark of resilience or economics. Investment diligence should therefore treat sponsor-bank, card-scheme, correspondent-bank, and FX-provider continuity as separate dependencies, request concentration schedules for each, and test whether contractual alternatives are live integrations rather than unexercised contingency plans.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR003"
  - id: "financial-execution-and-kill-criteria"
    title: "Financial Execution Risk and Thesis-Break Triggers"
    body: >-
      The assigned evidence supports only a narrow profitability claim: a company-issued 2026 job posting says March 2026 produced record revenue, record volume, and EBITDA profitability. That is a one-month company claim, not full-year audited profitability, free cash flow, cash burn, or cash available. A Built In page discusses profitability and IPO pressure but explicitly says its content is generated from popular LLM responses, was not reviewed by Nium, and may not reflect verified information; it should not be used as independent proof. Wikipedia reports that Nium moved its planned US listing from the second quarter of 2025 to the end of 2026, increasing the importance of verified runway and repeatable margins. Monitorable thesis-break triggers are sponsor-bank or key-financial-partner withdrawal, escalation or unresolved continuation of the India matter, a second IPO delay without audited profitability, failure to produce current SOC 2 and penetration-test evidence, or material scheme/bank concentration without tested failover. Until audited FY2025/FY2026 financials and liquidity schedules are available, funding raised must not be treated as cash available and burn or runway should remain an explicit gap.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
