    body: "The US terms place service provision and settlement-fund custody with a payment service bank and permit immediate termination after bank withdrawal; the broader agreement provides a similar termination right when a financial partner suspends or ends its service. The investment case should require evidence of tested failover, not infer redundancy merely because two sponsor banks are named."
