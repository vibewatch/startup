    title: "Do Not Convert Missing Evidence Into Reassurance"
    body: "A one-month company profitability claim is not audited full-year profitability, an incomplete cyber scan is not evidence of no incident, and funding raised is not cash available. Maintain a high diligence burden until audited financials, liquidity schedules, current legal status, independent security reports, and counterparty concentration data are produced."
