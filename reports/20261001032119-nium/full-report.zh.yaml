      - number: '7.3'
        title: 合作伙伴与网络通道依赖
        blocks:
          - type: paragraph
            body: >-
              Nium 业务体量的扩增放大了合作伙伴服务中断带来的潜在冲击。公司发布的业务上线材料称，过去 12 个月平台发行了超 4,100 万张卡凭据，并将 Visa、Mastercard、Discover 与 UATP
              列为核心清算网络。这仅印证了业务触角的广度，并不代表集中度风险低下：所获证据未披露各卡组织、赞助银行、货币走廊或特定客户的发卡量、毛利或结算敞口。J.P. Morgan 的案例研究明确指出其担任 Nium
              的主结算行，并介绍了用于管理外汇风险敞口的自动化跨币种清算方案。鉴于该资料系合作伙伴发布的成功宣传案例，虽能证实双方公开的业务合作关系，但无法作为衡量抗风险能力或财务经济性的独立基准。因此，投资尽调应将赞助银行、卡组织、代理行及外汇供应商的业务连续性列为独立依赖项，索取各维度的集中度明细表，并核实备选合同方案是否已完成实机对接，而非停留于未曾演练的应急预案层面。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
