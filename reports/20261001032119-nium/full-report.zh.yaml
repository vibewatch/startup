chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 机构沿革、业务模式与展业版图
        blocks:
          - type: paragraph
            body: >-
              根据 Nium 官方口径，公司由 Prajit Nanu 与 Michael Bermingham 于 2014 年创立，最初主打 C 端汇款产品 Instarem，后于 2019
              年更名。公司现设新加坡与旧金山双总部，对外销售统一基础设施层，涵盖跨境支付结算、多币种账户、外汇兑换、账户验证以及实体卡、虚拟卡和稳定币关联卡发行。平台目标客群包括银行、金融科技公司、薪资服务商、差旅企业、撮合平台及其它希望免于自建本地清算通道即可获取支付能力的企业。公司目前声称其支付结算已覆盖
              190+ 个国家，持有 40+ 项牌照、授权与注册资质。上述广度指标均属公司自述；但其新加坡法定协议确实明确载明了持牌新加坡主体及其持有的 MAS 大型支付机构（Major Payment
              Institution）牌照。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO007
      - number: '1.2'
        title: 业务规模与封面指标可靠性
        blocks:
          - type: paragraph
            body: >-
              Nium 当前官网宣称拥有超过 1,000 家客户，过去 12 个月处理支付规模达 $84
              billion。此类数据仅属运营吞吐量与客户数量宣称，并不等同于收入、ARR、现金造血能力或经独立审计的财务业绩。公司在当前「关于我们」页面内的员工规模披露甚至存在自相矛盾：一处板块显示员工 700+ 人，而其
              FAQ 却称全球员工 750+
              人。因此，本报告保留两个门槛，不把它们硬凑成一个虚假的点估计。所获资料完全缺乏具公开凭据支持的收入、ARR、毛利率、盈利水平、现金余额、债务及授信额度数据。这类数据缺失属于尽调盲区，绝不能反推 Nium
              不存在财务杠杆或享有充裕现金跑道。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
