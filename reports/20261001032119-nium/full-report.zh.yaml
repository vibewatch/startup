            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR010
              - CR011
      - number: '7.4'
        title: 财务执行风险与逻辑破损触发因素
        blocks:
          - type: paragraph
            body: >-
              指派证据仅支持十分有限的单项盈利声明：公司 2026 年发布的一则招聘启事提及，2026 年 3 月单月创下历史新高的收入与交易量，并实现了 EBITDA
              盈利。这仅属于公司单月的单方表述，不等同于经审计的全年盈利水平、自由现金流、现金消耗率或账面可用现金。Built In 页面虽探讨了盈利能力与 IPO 压力，但明确声明其内容由主流大语言模型（LLM）生成，未获
              Nium 审核，可能无法反映核实后的客观信息；绝不可将其作为独立证明依据。Wikipedia 报道，Nium 将原定赴美上市时间从 2025 年第二季度推迟至 2026
              年底，更凸显了核实其现金跑道与可持续利润率的重要性。值得追踪的投资逻辑破损触发条件包括：赞助银行或关键金融合作伙伴退出、印度案件升级或迟迟无法解决、在未见审计盈利的情况下发生第二次 IPO 延期、无法提供当期
              SOC 2 与渗透测试凭证，或存在重大卡组织/银行集中度且未完成灾备切换测试。在获取经审计的 FY2025/FY2026
              财务数据与流动性明细前，所融资金绝不可视同账面可用现金，现金消耗与跑道长度必须明确列为尽调缺口。
            claimRefs:
              - CR004
              - CR005
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 美国业务连续性取决于金融合作伙伴
            body: >-
              美国业务条款将服务提供与清算资金存管职责划归合作支付银行，并允许在银行解约时立即终止服务；通用协议同样赋予平台在金融伙伴暂停或终止服务时的类似解约权。投资评估须要求提供经实操检验的故障倒换凭证，不可仅因列出两家赞助银行便推定具备业务冗余。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 切勿将证据缺失误作安全背书
            body: >-
              单月盈利宣称不等同于经审计的全年盈利，未完成的网络安全扫描不代表不存在安全事件，融资金额亦非账面可用现金。在获得审计财务报表、流动性明细表、最新诉讼进展、独立安全评估报告以及交易对手集中度数据前，必须保持严苛审慎的尽调标准。
            calloutType: recommendation
            claimRefs:
              - CR012
              - CR014
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最具说服力的定价依据为 2024 年 6 月的 E 轮融资：Nium 官方新闻稿及其收录通告称，公司以 $1.4 billion 的投后估值完成了 $50 million 融资，Tracxn
              亦独立记录了该轮次与估值。Tracxn 进一步标注该轮估值倍数为 8.5 倍市销率，但保留的证据未披露其底层收入定义、测算周期或经审计的分母基数。这导致无法将该估值基准可靠地更新至 2026 年 10
              月的公允水平。因此，现阶段合理的投资决策是「继续研究」而非「买入」：将 $1.4 billion 视为过往融资参考，而非当前的公允价值；在敲定入场价格前，必须获得经核实的经济模型与安全合规条款。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
