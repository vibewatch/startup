              Clay 于 2026 年 4 月出具的档案显示，公司历经 11 轮融资，公开披露融资总额至少达 $312 million。其中包括 2021 年 7 月完成的 $200 million D 轮融资（投后估值超
              $1 billion），以及 2024 年 6 月 4 日完成、由 Brunei Investment Agency 领投的 $50 million E 轮融资（投后估值 $1.4
              billion）。融资金额并非账面可用现金：获指派证据均未证实当前流动性、老股转让、债务或授信额度。投资机构名单虽涵盖主权财富基金、战略投资方与成长型资本，但持股比例与控制权分配均未公开。运营层面，Nium 于
              2026 年 8 月进一步扩张，推出美国本土发卡业务。负面信息样本极少：一份归档的 Trustpilot 摘要仅含 3 条评价，其中涉及 2
