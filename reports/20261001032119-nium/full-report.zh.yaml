            - label: 服务质保限制
              value: High
              note: 合同通常不保证服务不中断、无差错或无损失。
            - label: 未定义客户触发的投资逻辑破坏
              value: No data
              note: 客户层面的损失、流失率和集中度分母数据无法获取。
        - label: 条件触发 / 交易对手方
          values:
            - label: 卡组织商业条款变动
              value: Moderate
              note: 列出了四个卡组织，但未披露具体卡组织的商业条款与风险敞口。
            - label: 主办银行或外汇业务中断
              value: High
              note: J.P. Morgan 被指定为主办银行，但尚无替代方案和迁移就绪度的证据。
            - label: 赞助方或金融合作伙伴退出
              value: Critical
              note: 条款允许在相关合作伙伴终止或暂停服务时立即解除合同。
        - label: 未知 / 安全与可靠性
          values:
            - label: 凭证泄露
              value: Moderate
              note: 合同分摊了特定损失，但无法获取事件发生频率的分母。
            - label: 网络安全或可用性事件
              value: High
              note: 指定证据中无法获取有充分依据的事件发生频率分母。
            - label: 未受控重大事件
              value: Critical
              note: 未证实发生过此类事件；需要独立的控制措施与事件证据。
        - label: 未知 / 财务韧性
          values:
            - label: 全年未实现盈利
              value: Moderate
              note: 仅有公司声称单月盈利的证据；缺失经审计的全年数据。
            - label: 现金跑道压缩
              value: High
              note: 现金、现金消耗率、债务、监管资本以及承付款项数据均无法获取。
            - label: 资金保障缺口或法律诉讼升级
              value: Critical
              note: 条款保留了破产资金缺口敞口，而当前印度案件的状态无法获取。
    approximationNotes: 定性划分依据的是已记录情况、条件触发与未知频率的对比；影响类别属于分析师判断，并非测算出的损失概率。
