        - 严重
        - 列出两家银行，但无经过测试的故障转移证据
        - 业务连续性、沉没实施成本及客户迁移风险
      - - 卡组织接入
        - Visa / Mastercard / Discover / UATP
        - 发卡主会员接入
        - 列出四大卡组织；凭据数、交易量及毛利结构不可考
        - 规则变更、罚金征收、暂停准入或商业条款恶化
        - 高
        - 接入多家卡组织
        - 单一卡组织敞口与替代路由仍未量化
      - - 主办行及外汇基础设施
        - J.P. Morgan Payments
        - 主办行合作关系及自动化跨币种解决方案
        - 合作关系由合作伙伴披露；资金流占比未披露
        - 定价变更、交易对手业务中断或失去本地银行网络覆盖
        - 高
        - 合作伙伴描述了自动化外汇风险缓解机制
        - 未见备选主办行、迁移测试或敞口限额的证据
    notes: 按严重程度排序的依赖项样本。合作伙伴与公司披露仅证实了合作关系，未证实集中度比例、合同可替代性或独立韧性。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR010
      - CR011
  - id: TV001
    title: 投资建议摘要
    columns:
      - 决策维度
      - 评估结论
      - 决策含义
    rows:
      - - 投资建议
        - 深入研究
        - 在核实当前单位经济效益与安全条款前，不建议入场投资。
      - - 置信度
        - 低
        - 公开证据印证了2024年融资轮次，但无法证实当前公允价值。
      - - 风险评级
        - 高
        - 数据冲突及非公开条款缺失导致重大下行情景未经量化。
      - - 估值立场
        - 价格缺乏支撑
        - 仅将14亿美元作为过往投后估值参考，而非当前估值。
      - - 回报 / 持有 / 退出
        - 缺乏支撑
        - 缺乏入场价格、稀释比例、经审计现金流及经核实的IPO证据，无法测算目标回报或退出窗口。
    notes: 截至2026-10-01的分析师判断；14亿美元为报道的2024年6月投后估值，未对当前估值区间作出估计。
    claimRefs:
