  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出范围
        blocks:
          - type: paragraph
            body: >-
              B2B
              跨境支付的市场边界涵盖机构资金流转、商业发卡、企业多币种财资账户以及新兴的数字资产流动性结算。现代企业买家需要统一的全球清算通道，以打通新兴市场与发达市场中分散割裂的本地清算网络。核心支出场景包括大额供应商付款、差旅外包商自动付款以及要求确定性执行的平台卖家汇款。相反，该市场边界明确排除了纯本地
              POS 零售网络、专有闭环储值卡以及 C 端个人对个人汇款。现代基础设施服务商提供统一的 API 基础设施，覆盖 190+
              个国家的多币种账户、实时支付结算、外汇兑换与账户验证，以直接支付网络连接取代繁琐的代理行链条。
            claimRefs:
              - CM007
              - CM009
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM013
      - number: '2.2'
        title: 目标市场规模测算与分析视角
        blocks:
          - type: paragraph
            body: >-
              测算跨境支付市场机遇需要多重视角，以区分宏观宏量资金流动与可触达的基础设施业务收入。Research and Markets 宏观经济预测指出，在国际贸易扩张与数字化渠道普及推动下，全球跨境支付市场规模预计到
              2030 年将超过 US$56 trillion。在商业支付工具中，虚拟卡市场属于高增长细分赛道，预计到 2031 年将达到 $15.14 trillion，其中北美市场约占该增长份额的
              45%。企业级软件领域，随着应付账款数字化普及，支出管理平台的年复合增长率超过 11%。Nium 等专业基础设施提供商（2021 年晋升金融科技独角兽，当时估值约 US$2
              billion）重点切入该体量中资金周转频率极高的 B2B 走廊。然而受制于各地区牌照边界及漫长的企业销售周期，单一金融科技平台能够获取的服务有效市场（SAM）仍仅占交易总额的一小部分。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM014
      - number: '2.3'
        title: 买家客群细分与预算归属
        blocks:
          - type: paragraph
            body: >-
              现代支付基础设施的落地采购由各具预算归属与工作流集成要求的企业客群主导。全球差旅平台、在线旅行社（OTA）与航空公司面临极度割裂的支付链条，既需要虚拟卡结算酒店预订款，又需要自动化银行转账支付跨国地接服务商。现代支出管理平台集成内嵌发卡与实时交易对账
              API，淘汰传统纸质报销单，从而降低企业财务团队的运营成本。欧洲企业每年因运营支出管控不善造成的损失估计达 £301 billion，使得自动化费用管控与虚拟卡限额成为 CFO 的核心关切。在亚太和欧洲累计发行超
              4,100 万张卡凭证后，基础设施平台于 2026 年 8 月将本土发卡业务拓展至美国，使北美企业买家及平台得以在本地发卡的同时，仅凭单套技术集成统管全球付款。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM007
              - CM009
              - CM014
      - number: '2.4'
        title: 采纳驱动因素与结构性制约
        blocks:
          - type: paragraph
            body: >-
              跨境支付基础设施的增长动力来自企业对实时结算、多币种现金流管理以及稳定币程序化集成的刚性需求。移动支付应用与 API 原生通道在提高交易频次的同时，降低了境外收款方的摩擦成本。稳定币卡发行与 USDC
              结算网络的推出，为企业司库提供了绕过周末银行清算延迟的备选流动性通道。然而，采纳进程受到多项结构性制约，包括严苛的合规审查、跨司法管辖区牌照门槛以及平台安全风险。外部域名暴露监控显示，针对金融科技环境的凭证窃取与信息窃取恶意软件活动持续活跃。此外，Nium
              的《直接服务协议》（Direct Services Agreement）等合同条款明确免除服务商对因客户账户被盗用或凭证泄露导致的未授权交易的赔偿责任，这给采用该服务的企业施加了重大的身份安全治理义务。
            claimRefs:
              - CM005
              - CM008
              - CM011
              - CM012
      - number: '2.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 跨境支付市场边界迁移
            body: B2B 跨境支付的目标市场正从传统批量电汇服务转向集支付结算、虚拟卡发行与稳定币流动性通道于一体的统一 API 基础设施。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM013
          - type: callout
            title: 企业安全与账户责任约束
            body: 随着企业财资工作流向自动化云平台迁移，凭证窃取风险与严苛的合同责任免除条款要求采纳企业建立更高级别的安全治理规范。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与对标企业分类
        blocks:
          - type: paragraph
            body: >-
              Nium 业务横跨跨境资金流转与企业发卡，定位介于 C 端汇款巨头、企业级支付服务商与传统银行间清算网络之间的混合赛道。在金融科技同业中，Airwallex 与 Wise
              是最具实力的对标企业，其整体运营规模、年交易量和估值均明显领先 Nium。Wise 凭借直连清算网络在透明的个人及中端跨境汇款领域占据主导地位，Airwallex 主打软件驱动的全球企业账户，而 Nium
              则专攻面向金融机构、差旅企业和全球薪酬平台的复杂嵌入式资金流转。以 SWIFT 为代表的传统代理行网络仍是高额机构结算的主要现状替代品，而 Bitso 等区域专业服务商则把控着新兴走廊的本地法币出入金通道。
            claimRefs:
              - CP001
              - CP002
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
