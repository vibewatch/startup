              - CP011
      - number: '3.2'
        title: 能力、定价与渠道取舍
        blocks:
          - type: paragraph
            body: >-
              竞争格局中的产品能力差异折射出各家底层架构的重心分化。Nium 的差异化优势在于模块化基础设施模式，将覆盖 100 条走廊的实时跨境支付结算与境内外虚拟卡发行结合。相比之下，Bitso
              等区域竞品专攻拉美本地法币与加密货币撮合挂单簿，采用阶梯式挂单/吃单费率（墨西哥比索吃单费率介于 0.78% 至 0.13% 之间），但在企业商业走廊上仍依赖逐单私下商业谈判报价。面向机构交易，Nium
              推出专为证券经纪场景定制的支付解决方案，直击传统代理行体系，声称相较 SWIFT 电汇可为金融机构降低高达 90% 的结算成本，在免除传统电汇阻滞的情况下加速海外证券账户入金。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP007
