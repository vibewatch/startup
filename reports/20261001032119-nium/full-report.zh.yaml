      - number: '1.3'
        title: 领导团队、职能覆盖与治理缺陷
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Prajit Nanu 仍是核心战略操盘手。Nium「关于我们」页面将产品战略与合规监管定位直接归功于他，Unify
              亦报道其自创立之初便统领公司。尽管业务高管梯队覆盖了财务、运营、商务拓展、技术、风控合规与市场营销，上述情况仍带来显著的创始人依赖。2026 年 2 月，公司官方材料宣布任命 Sekhar Cidambi 为
              CTO、Amaresh Mohan 为首席风险合规官、Danielle Gotkis 为
              CMO。过往履历虽提升了职能完整度，但人事任命通告并不代表接班梯队业已就绪。所有获指派资料均未披露完整董事会名单、委员会架构、创始人投票权设置，亦无成文的 CEO 接班规划。
