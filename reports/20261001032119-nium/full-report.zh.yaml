              公开资料所体现的覆盖广度远胜于业务持久度。现有资料均未披露净收入留存率（NRR）、总收入留存率（GRR）、客户流失率、续约率、合同年限、分层客群留存、头部客户收入占比或渠道集中度。商业落地同样伴随着实施与合规摩擦：Nium
              的直接服务条款规定，硬件设备、基础设施、软件以及经批准的第三方对接工作均由客户自担，并规定在接口对接引发严重平台故障时有权暂停服务。当前发布的一则合规岗位招聘信息进一步显示，平台与撮合平台类交易往往需要销售、产品、法务、反金融犯罪以及各主权国家合规团队跨部门协同。这些严格把控虽有助于支撑合规扩张，但可能大幅拉长客户入驻周期，并加深对银行、卡组织、稳定币网络及其它基础设施伙伴的依赖。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 发卡活跃度是明确的采纳信号
            body: 截至 2026 年 8 月 19 日的前 12 个月内，Nium 已发行超过 41 million 张卡凭据，提供了切实的业务活跃度指标；但独立用户数、活跃卡量、客户总量及对应收入仍未披露。
            calloutType: strength
            claimRefs:
              - CU004
          - type: callout
            title: 合作伙伴不等于客户背书
            body: Circle、Visa 与 Cypher 拓展了业务触达与能力边界，但所获证据中均未见任何具备量化生产效果或明确续约历史的明确署名终端客户。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、法律风险与资金隔离隐患
        blocks:
          - type: paragraph
            body: >-
              Nium 在美国的法律实体架构，决定了合作银行的业务连续性是一项关乎投资逻辑生死的关键依赖，而非无关痛痒的合同细则。其客户协议与直接服务条款载明，Nium US
              仅为技术服务商，并非对应美国本土业务的持牌资金移转机构（money transmitter）；实际业务由 Cross River Bank 或 Community Federal Savings Bank
              提供，且清算账户中的资金由对应合作银行独家存管。该条款同时赋予平台在支付服务银行终止客户访问权限时立即解约的权利。虽然接入两家银行带来了一定的潜在冗余，但公开协议并未证实存在经过实战检验的业务灾备切换机制、对等通知期或交易量的分散安排。在英国，依据
              CASS 15 实施的客户资金隔离虽属关键风控手段，但条款亦明确声明不适用金融服务补偿计划（FSCS）保护，破产清算成本及按比例分摊的资金缺口均可能影响资金追索。此外，Wikipedia 记载了 2024
              年印度监管执法行动，涉及 Nium 印度账户中存放的第三方空壳实体资金；指派证据未说明该案当前进展，亦未将涉案资金归责于 Nium 本身。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR009
              - CR012
      - number: '7.2'
        title: 运营、网络安全与合同风险分配
        blocks:
          - type: paragraph
            body: >-
              Nium 的直接服务合同虽载明了风控措施，但亦将重大运营风险转移给客户。合同明确免除因客户账户泄露导致的未授权交易责任（除非由 Nium 平台本身的安全漏洞直接导致），且服务以「现状」（AS
              IS）形式提供，并不提供系统无中断、无错误、绝对安全或绝无数据丢失的普适性保证。合同还允许在金融合作伙伴暂停或终止向 Nium
              提供服务时即刻解约。此类条款不能证明已经发生宕机、安全泄露或欺诈损失，但明确划分了一旦事故发生由谁承担既定下行风险。公司发布的合规岗位招聘信息显示，Nium 持续构建并推行新产品风险评估（New Product
              Risk Assessments）等产品合规流程，但招聘材料无法证明内控的实际有效性。同样，预提取的 Lunar Cyber
              网页仅返回了扫描未完成的界面而非最终排查结论，不可从搜索摘要中轻率推断事故总数。最具决定性的尽调要件应为经审计的内控报告、系统在线率与灾备恢复数据、欺诈损失率、凭证安全防护覆盖面以及历史事故记录。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
              - CR016
