      - CV002
      - CV006
      - CV007
      - CV009
  - id: TV002
    title: 投资论点与反方论点
    columns:
      - 立场
      - 论点
      - 观点改变的触发条件
    rows:
      - - 投资论点
        - 2024 年 6 月的 $50M Series E 轮融资及 $1.4B 投后估值，得到公司发布信息与独立市场数据源的相互印证。
        - 已签署的融资文件与公布的金额或估值存在实质性差异。
      - - 投资论点
        - Nium披露其2023年营收增长>50%，并于2026年在美国推出发卡业务。
        - 经审计的当期增长、留存或单位经济效益显示恶化，或扩张未能带来合理回报。
      - - 投资论点
        - Nium 声称，在美国业务推出前的 12 个月内，公司在亚太、中东和欧洲累计发行超过 41M 张卡凭据。
        - 项目层面的活跃卡数、交易量、收入及损失数据暴露出使用率低迷或经济效益疲弱。
      - - 反方论点
        - 融资数据库之间存在实质性分歧：Tracxn记录为11轮共3.12亿美元，而FundedIQ记录为3轮共2.05亿美元。
        - 经公司认证的股权结构表及完整的融资明细账调和了上述差异。
      - - 反方论点
        - 声称存在2026年S-1递表的唯一指定来源为一家声誉较低、且融资数据自相矛盾的信息聚合网站。
        - 监管机构公示的文件、秘密递交证据或具名承销商受聘确认了该进程。
      - - 反方论点
        - 客户服务依赖金融合作伙伴，而后者可能会暂停或终止支持。
        - 合作伙伴集中度、可迁移性及经过测试的业务连续性数据证明收入和服务风险敞口有限。
    notes: 公司自述的运营数据未被视作已获独立验证；融资数据库覆盖口径存在差异，须通过原始文件予以核实对齐。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV007
      - CV009
      - CV012
      - CV013
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的增速与利润率证实业务扩张；美国业务成功商业化变现；递表证据及流动性退出路径获独立证实。
        - 仅在尽调后才可能支持较2024年6月14亿美元估值的溢价；当前无法支持任何具体数值区间。
        - 执行风险、竞争加剧、监管复杂性及估值倍数压缩。
        - 公司披露的发卡规模向好，但缺乏经审计的当期经济效益。
      - - 基准
        - 2024年融资仍是最后可靠的估值参考点；业务继续扩张，但经济效益与时间表仍未披露。
        - 保持14亿美元作为参考基准而非公允价值；在把回报纳入投资判断前要求价格保护并核实股权稀释情况。
        - 估值基准陈旧、优先权条款未知及退出推迟。
        - 获印证的融资轮次数据被当期财务数据缺失所抵消。
      - - 悲观
        - 增速或单位经济效益不及预期，所声称的IPO路径未获证实，或合作伙伴依赖导致服务中断。
        - 可能需要折价或下调轮次估值，但其幅度无法依据指定证据作出估计。
        - 流动性延期、融资积压、合作伙伴集中度及安全性不确定性。
        - 聚合网站记录冲突及未经证实的退出主张加剧了下行情景的不确定性。
    notes: 各情景均为条件假设，而非预测；由于缺少必要的分母，未断言任何概率百分比、当期市销率倍数或回报区间。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV009
      - CV011
      - CV012
      - CV013
      - CV015
