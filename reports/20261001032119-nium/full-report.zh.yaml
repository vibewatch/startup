  - id: FE001
    title: 产品架构图
    type: stack
    summary: 涵盖客户端接入、核心服务、数据流水线及底层清算轨道的Nium模块化架构体系。
    data:
      layers:
        - label: 客户端入口与API网关
          detail: AWS API Gateway负责处理SSL终结、防御DDoS与注入攻击的安全防护，以及统一的JSON REST API路由。
          modules:
            - AWS API Gateway
            - WAF与威胁过滤
            - 开发者门户与沙箱环境
          outputs:
            - 已认证的JSON API请求
        - label: 客户端应用与管理界面
          detail: 基于React与Next.js构建的Web门户与商户界面，支持多租户资金管理操作。
          modules:
            - Next.js Web门户
            - 企业入驻审核
            - 卡管理界面
          outputs:
            - 用户会话状态
        - label: 业务逻辑与微服务
          detail: 基于Java Spring Boot与Node.js实现的分布式服务，负责管理代付、卡业务及多币种账户。
          modules:
            - 代付编排服务
            - 发卡引擎（JIT即时注资）
            - 多币种账本
          outputs:
            - 交易指令
        - label: 数据流水线与流处理
          detail: 正向AWS云端迁移的事件驱动型数据处理流水线，采用Apache Kafka、Apache Airflow、dbt与Amazon Redshift。
          modules:
            - Apache Kafka事件总线
            - Apache Airflow任务编排
            - Amazon Redshift与dbt
          outputs:
            - 对账事件与分析数据集
        - label: 外汇与流动性管理
          detail: 覆盖2000多种货币对的自动化实时外汇执行，与机构级流动性提供商直连。
          modules:
            - 自动化外汇引擎
            - 资金流动性缓冲池
            - 货币对定价服务
          outputs:
            - 已执行的即期与远期外汇兑换
        - label: 全球银行与卡组织清算轨道
          detail: 直连全球支付通道、卡网络与合作银行的清算准入与主会员连接。
          modules:
            - J.P. Morgan Payments清算通道
            - 卡组织（Visa、Mastercard、Discover、UATP）
            - 本地实时清算系统
          outputs:
            - 最终结算确认凭据
    approximationNotes: null
