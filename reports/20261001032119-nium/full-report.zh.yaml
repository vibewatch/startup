              - CV013
      - number: '8.2'
        title: 投资逻辑、反向论点与证据质量
        blocks:
          - type: paragraph
            body: >-
              正面投资逻辑在于，Nium 将大额后期融资与持续的产品扩张深度结合。公司披露其 2023 年营收同比 2022 年增长超过 50%，并于 2026 年 8 月推出美国发卡业务，声称过去 12
              个月内在亚太、中东和欧洲累计发行超过 41 million 张卡凭据。反向论点在于，这些经营指标均由公司单方披露，无法替代经审计的当期收入、留存率、利润率或现金流。公开数据质量同样堪忧：Tracxn 记录其 11
              轮融资累计 $312 million，而 FundedIQ 记录其 3 轮融资仅 $205 million。另一家聚合平台宣称公司估值达 $2.5 billion 并已提交 S-1
              文件，但其页面存在多处日期与融资金额前后矛盾，在获得一手原始凭证确认前，上述两种说法均不宜作为重置估值锚点的依据。
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV009
              - CV012
              - CV013
      - number: '8.3'
        title: 乐观、基准与悲观情景推演
        blocks:
          - type: paragraph
            body: >-
              情景估值审慎采取条件推演架构，原因在于现有证据无法支撑精确的概率权重或回报率区间。乐观情景必须以独立凭据为前提，证实 2026
              年上线业务已转化为可持续的营收增长，并拥有经审计的单体经济模型及核实的上市申报路径；唯有在这些条件满足时，给予 2024 年估值溢价才具备分析上的合理性。基准情景将 $1.4 billion
              轮次作为估值锚点，暂不给出当前公允价值定论。悲观情景则是因财务表现转弱、融资条款未决或技术依赖风险暴发，导致降估值融资（down-round）或上市退出流动性延迟。Nium
              的直接服务协议允许在金融合作伙伴退出或指示终止服务时即刻停摆，使得交易对手集中度在基于公开数据的分析中，成为核心的估值尽调前置项，而非单一的量化折价系数。
            claimRefs:
              - CV002
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 退出就绪度与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              公司退出就绪度尚未得到证实。TechStackIPO 虽给出 62/100 的 C 级就绪度评分并报道其于 2026 年 5 月提交 S-1
              文件，但指派材料中并未出现任何监管申报记录、承销商授权书、交易所选定方案、经审计的申报财务报表或独立核实的上市时间表。该页面还将 Wise、Airwallex 与 Stripe
              列为竞品，更凸显出估值分析必须基于可比公司的增速、利润率与统一收入定义，而非仅参考耸动的一级市场估值标牌。投资前必须获取最新股权结构表、清算优先权条款、债务与现金明细表、2024 至 2026
              年审计财务报表、客户分层留存数据、合作伙伴集中度、损失率以及任何非公开上市申报凭据。抓取的域名监控页面未显示完整扫描结果，因而无法支撑具体的漏洞泄露计数，亦无法证实不存在安全事故。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 定价纪律
            body: 切勿将 2024 年 6 月的投后估值直接作为当前的买入目标价。在把估值溢价或目标回报率纳入投资判断前，须索取经审计的当期财务数据、股权结构条款以及一手退出就绪凭证。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV009
          - type: callout
            title: 投资逻辑破损触发条件
            body: 若一手原始文件未能证实历史融资记录、审计的增长与单体经济数据无法支撑上一轮估值，或合作伙伴集中度带来无法缓释的业务连续性风险，应立即中止投资决策流程。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV013
