  shortDescription: >-
    Nium is a Singapore- and San Francisco-co-headquartered B2B payments infrastructure company that provides
    cross-border payouts, multi-currency accounts, foreign exchange, account verification, and card-issuance
    capabilities through a unified API. Its current website claims $84 billion of payments processed over the last 12
