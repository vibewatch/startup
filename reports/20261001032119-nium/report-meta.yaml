companyProfile:
  summary: >-
    Nium is a late-stage private payments infrastructure company founded in 2014 as Instarem and rebranded in 2019. The
    business is co-headquartered in Singapore and San Francisco and sells a unified platform for cross-border payouts,
    multi-currency accounts, FX, account verification, and card issuance to banks, fintechs, payroll providers, travel
    companies, marketplaces, and enterprise platforms. Public evidence still does not disclose current revenue, ARR,
    cash, debt, or ownership.
