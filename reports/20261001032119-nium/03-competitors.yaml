callouts:
  - calloutType: "risk"
    title: "Scale Disadvantage Against Scaled Global Fintechs"
    body: "While Nium holds a defensible 40-jurisdiction regulatory license moat, rivals Wise and Airwallex maintain substantially larger operational scale, higher transaction volumes, and greater capital resources. This scale disparity enables competitors to absorb compliance overhead more efficiently and exert downward pricing pressure in major currency corridors."
    claimRefs:
      - "CP001"
      - "CP008"
  - calloutType: "insight"
    title: "Card Issuance as an Antidote to Payout Commoditization"
    body: "Cross-border payout margins face ongoing compression from aggressive pricing by fintech aggregators and domestic instant payment links. Nium's expansion into domestic US card issuance, combined with existing APAC and European issuing programs, creates a sticky second product pillar that captures interchange and shields enterprise customer relationships from pure FX fee attrition."
    claimRefs:
      - "CP005"
      - "CP006"
