      missingEvidence: "Current fully diluted cap table, liquidation preferences, anti-dilution rights, debt, secondary marks, and option-pool obligations."
      whyItMatters: "Post-money headline valuation does not establish investor ownership, preference overhang, dilution, or proceeds available to common holders."
      diligencePath: "Review executed financing documents, cap-table certification, debt agreements, option ledger, and waterfall scenarios."
      relatedQuestionRefs: [QV003, QV008]
