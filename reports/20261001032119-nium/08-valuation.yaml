schemaVersion: "report-v2"
artifact: valuation
slug: nium
runDate: 2026-10-01
company:
  name: Nium
chapter:
  number: 8
  title: Valuation
  summary: >-
    Nium's June 2024 Series E establishes a corroborated $1.4 billion post-money
    reference point, but the retained public evidence does not establish current
    revenue, cash, preference terms, or a verified IPO filing. The resulting
    recommendation is research-more with low confidence, high risk, and no
    supportable premium to the last round without private diligence.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The strongest pricing evidence is the June 2024 Series E: Nium and a
      syndicated copy of its release say the company raised $50 million at a
      $1.4 billion post-money valuation, while Tracxn independently records the
      same round and valuation. Tracxn also labels the round at an 8.5x revenue
      multiple, but the retained evidence does not provide the underlying
      revenue definition, period, or audited denominator. That prevents a
      reliable update of the mark to October 2026. The appropriate decision is
      therefore research-more rather than buy: treat $1.4 billion as a dated
      financing reference, not current fair value, and require verified
      economics and security terms before setting an entry price.
    claimRefs: [CV001, CV002, CV005, CV006]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and evidence quality
    body: >-
      The thesis is that Nium paired a substantial late-stage financing with
      continued product expansion. The company reported revenue growth above
      50% in 2023 versus 2022 and launched United States card issuance in August
      2026, claiming more than 41 million credentials issued across APAC, the
      Middle East, and Europe during the preceding twelve months. The
      anti-thesis is that these operating indicators are company-issued and do
      not substitute for audited current revenue, retention, margins, or cash
      flow. Data quality is also weak: Tracxn reports $312 million over eleven
      rounds, while FundedIQ records $205 million across three rounds. A second
      aggregator claims a $2.5 billion valuation and an S-1 filing, but its page
      contains inconsistent dates and financing figures, so neither assertion
      should reset the valuation anchor without primary confirmation.
    claimRefs: [CV003, CV005, CV007, CV008, CV009, CV011, CV012]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Bull, base, and bear framework
    body: >-
      Scenario valuation is deliberately conditional because the available
      evidence cannot support precise probability weights or return ranges. A
      bull case requires independent confirmation that the 2026 launch converts
      into durable revenue growth, plus audited unit economics and a verified
      filing path; only then would a premium to the 2024 mark be analytically
      defensible. The base case leaves the $1.4 billion round as the reference
      while withholding a current fair-value conclusion. The bear case is a
      down-round or delayed-liquidity outcome driven by weaker economics,
      unresolved financing terms, or platform dependencies. Nium's direct
      services agreement permits immediate service termination when a financial
      partner withdraws or directs Nium to stop service, making dependency
      concentration a valuation diligence item rather than a quantified
      discount in this public-data analysis.
    claimRefs: [CV002, CV006, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness is unverified. TechStackIPO assigns a 62 out of 100,
      Grade C readiness score and reports a May 2026 S-1 filing, but no regulator
      filing, underwriter mandate, exchange selection, audited filing financials,
      or independently confirmed timetable appears in the assigned evidence.
      Its page also identifies Wise, Airwallex, and Stripe as competitors, which
      underscores the need for a comparable-company analysis based on matched
      growth, margin, and revenue definitions rather than headline private
      marks. Before investment, obtain the current cap table, liquidation
      preferences, debt and cash schedule, audited 2024-2026 financials,
      customer-cohort retention, partner concentration, loss rates, and any
      confidential filing evidence. The fetched domain-monitoring page did not
      expose a completed scan, so it cannot support a breach count or prove the
      absence of security incidents.
    claimRefs: [CV008, CV009, CV010, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, Research more, "Do not underwrite an entry until current economics and security terms are verified."]
      - [Confidence, Low, "Public evidence corroborates the 2024 round but not current fair value."]
      - [Risk rating, High, "Conflicting data and missing private terms leave material downside unquantified."]
      - [Valuation stance, "Price not supportable", "Use $1.4B only as a dated post-money reference, not a current valuation."]
      - [Return / hold / exit, "Not supportable", "No target return or exit window can be calculated without entry price, dilution, audited cash flows, and verified IPO evidence."]
    notes: "Analyst judgment as of 2026-10-01; $1.4B is the reported June 2024 post-money valuation, and no current valuation range is estimated."
    claimRefs: [CV001, CV002, CV006, CV007, CV009]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "The June 2024 $50M Series E and $1.4B post-money mark are corroborated by company-issued and independent market-data sources.", "Executed financing documents that materially differ from the announced amount or valuation."]
      - [Thesis, "Nium reported >50% 2023 revenue growth and launched US card issuance in 2026.", "Audited current growth, retention, or unit economics that show deterioration or expansion without acceptable returns."]
      - [Thesis, "Nium claims more than 41M card credentials issued across APAC, the Middle East, and Europe in the twelve months before the US launch.", "Program-level active-card, volume, revenue, and loss data showing weak utilization or economics."]
      - [Anti-thesis, "Funding databases disagree materially: Tracxn records $312M over 11 rounds, while FundedIQ records $205M over 3 rounds.", "A company-certified cap table and complete financing ledger reconcile the difference."]
      - [Anti-thesis, "The only assigned source claiming a 2026 S-1 filing is a low-reputation aggregator with internally inconsistent financing data.", "A regulator-hosted filing, confidential submission evidence, or named underwriter mandate confirms the process."]
      - [Anti-thesis, "Client service can depend on financial partners that may suspend or terminate their support.", "Partner concentration, portability, and tested continuity data demonstrate limited revenue and service exposure."]
    notes: "Company-issued operating claims are not treated as independently verified; funding-database coverage differs and must be reconciled through primary documents."
    claimRefs: [CV001, CV002, CV003, CV005, CV007, CV009, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Audited growth and margins validate expansion; the US launch monetizes; filing evidence and liquidity path are independently confirmed.", "A premium to the June 2024 $1.4B mark may be supportable only after diligence; no numeric range is supportable now.", "Execution, competition, regulatory complexity, and multiple compression.", "Positive company-reported issuance scale, but no audited current economics."]
      - [Base, "The 2024 financing remains the last reliable mark; expansion continues, but economics and timing remain undisclosed.", "Retain $1.4B as a reference rather than fair value; require price protection and verified dilution before return underwriting.", "Stale mark, unknown preferences, and delayed exit.", "Corroborated round data offset by missing current financials."]
      - [Bear, "Growth or unit economics disappoint, the claimed IPO path is not verified, or partner dependencies interrupt service.", "A discount or down-round may be required, but its magnitude cannot be estimated from the assigned evidence.", "Liquidity delay, financing overhang, partner concentration, and security uncertainty.", "Conflicting aggregator records and unverified exit claims increase downside uncertainty."]
    notes: "Scenarios are conditional, not forecasts; no probability percentages, current revenue multiple, or return range is asserted because the required denominators are unavailable."
    claimRefs: [CV002, CV006, CV007, CV009, CV011, CV012, CV013, CV015]
