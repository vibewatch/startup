callouts:
  - calloutType: recommendation
    title: Price discipline
    body: >-
      Do not convert the June 2024 post-money valuation into a current price
      target. Require audited current economics, cap-table terms, and primary
      exit evidence before underwriting a premium or target return.
    claimRefs: [CV002, CV006, CV007, CV009]
  - calloutType: risk
    title: Thesis-break trigger
    body: >-
      Pause the investment process if primary documents fail to confirm the
      financing history, if audited growth and unit economics do not support the
      last-round mark, or if partner concentration creates unmitigated service
      continuity exposure.
    claimRefs: [CV005, CV007, CV013]
