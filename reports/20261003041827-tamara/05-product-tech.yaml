  title: "Product & Technology"
  summary: "Tamara operates a regional GCC buy-now-pay-later and payments infrastructure supporting Pay in Full, split installment plans (Split in 2, 3, and 4), and extended terms up to 24 months across online and physical retail. The underlying architecture relies on cloud-native containerized microservices managed via Kubernetes, Terraform, and automated CI/CD pipelines, integrated with regional merchants through dedicated plugins, direct REST APIs, and Sharia-compliant financing workflows."
sections:
  - id: "core-products-and-checkout-architecture"
    title: "Core Product Suite and Omnichannel Checkout Architecture"
    body: "Tamara delivers consumer-facing flexible payment options and merchant-enabling checkout infrastructure across Saudi Arabia, the United Arab Emirates, and Bahrain. For end consumers, the product catalog is anchored by its core split-payment mechanisms: Pay in Full, Split in 2, Split in 3, and Split in 4 installments, alongside an extended installment facility allowing payments over up to 24 months. The platform explicitly eliminates late fees and hidden interest, adhering to Islamic financing guidelines certified by the Shariyah Review Bureau. At the point of sale, whether online or physical retail, transactions are initiated through automated gateway redirects and mobile applications. Consumers authenticate via registered mobile numbers and national ID verification, while merchants receive upfront settlement of the full purchase price minus agreed merchant discount rates. Behind the checkout flow, Tamara handles real-time consumer risk evaluation, credit scoring, fraud detection, and multi-channel lifecycle messaging via automated CRM systems utilizing Liquid logic, webhooks, and push/SMS notifications. This dual-sided mechanism shields partner merchants from buyer credit and fraud risks while driving measurable uplifts in checkout conversion rates and average order values across diverse retail categories including electronics, beauty, and education."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE013"
    tableRefs:
      - "TE001"
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "technology-stack-and-cloud-infrastructure"
    title: "Cloud Infrastructure, DevOps Foundations, and Platform Engineering"
    body: "Tamara's engineering and technical architecture is built on a modern, decoupled microservices model designed for horizontal scale and rapid product iteration across GCC markets. The core infrastructure is hosted on major cloud computing providers such as Amazon Web Services (AWS) or Google Cloud Platform (GCP), with runtime orchestration executed via Kubernetes clusters provisioned on demand. All infrastructure components—including virtual network topologies, IAM access controls, ingress load balancers, and relational/document databases—are managed as code using tools such as Terraform and Pulumi. Deployment workflows follow rigorous Continuous Integration and Continuous Delivery (CI/CD) pipelines implemented through GitHub and GitLab, incorporating automated security scanning, container image vulnerability checks, and progressive rollout strategies such as canary and blue-green deployments. Development standards enforce Domain-Driven Design (DDD), Hexagonal architecture, and strict separation between frontend and backend services via an API-first approach. Centralized observability layers aggregate distributed traces, structured logs, and Prometheus-compatible metrics to enable self-serve incident diagnostics and root-cause analysis. High availability and business continuity are governed by tested disaster recovery runbooks and defined RTO/RPO targets, maintaining platform uptime during peak regional shopping events."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE014"
    tableRefs:
      - "TE003"
  - id: "integration-security-and-compliance"
    title: "Merchant Integration Ecosystem, Security Controls, and Regulatory Compliance"
    body: "To support rapid merchant onboarding across enterprise and SME segments, Tamara combines pre-built e-commerce marketplace connectors with direct RESTful APIs. Third-party platform plugins, such as the CS-Cart payment gateway add-on, facilitate one-step merchant integration, handling dual-mode test and live environments, currency conversion across Saudi Riyals (SAR) and UAE Dirhams (AED), and automated order-status callbacks. When customers initiate checkout, they are temporarily redirected to Tamara's secure hosted payment gateway, which validates identity and credit eligibility before returning the customer to the merchant storefront with explicit authorization tokens. Security controls are embedded directly into network topology and cloud foundations rather than relying on manual reviews: data residency and regulatory boundaries are enforced via policy-as-code, and credentials are protected through automated secret rotation and short-lived tokens. Furthermore, Tamara Finance Company operates as a licensed joint-stock financial institution under the direct supervision and control of the Saudi Central Bank (SAMA) under License No. 95/A Sh/202502 with authorized capital of 515,000,000 Saudi Riyals. Transactions are monitored around the clock with enterprise-grade data encryption, and consumer repayment behavior is reported to regional credit bureaus to mitigate structural credit risk."
    claimRefs:
      - "CE004"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE015"
