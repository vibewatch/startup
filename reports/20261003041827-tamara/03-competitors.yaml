callouts:
  - calloutType: "risk"
    title: "Merchant Multi-Homing Erodes Standalone Pricing Power"
    body: "Because Saudi e-commerce merchants routinely integrate both Tamara and Tabby to prevent a 15%–30% drop in BNPL conversion, neither platform enjoys proprietary distributor lock-in. Switching costs between providers remain negligible, preventing unilateral MDR expansion and forcing both leaders into direct margin competition."
    claimRefs:
      - "CP003"
      - "CP010"
  - calloutType: "insight"
    title: "Defensibility Demands Rapid Vertical and Geographical Diversification"
    body: "Tamara's high revenue concentration in core BNPL and heavy reliance on the Saudi and Emirati markets make ongoing diversification into higher-ticket sectors (healthcare, education, travel) and adjacent banking services critical to defending its unicorn valuation against well-capitalized regional and global rivals."
    claimRefs:
      - "CP001"
      - "CP002"
