callouts:
  - calloutType: "recommendation"
    title: "Investment Discipline: Avoid Chasing Unverified Private Valuations"
    body: "Tamara's headline achievement as Saudi Arabia's first fintech unicorn and its access to multi-billion-dollar Shariah-compliant debt facilities demonstrate exceptional regional backing. However, because credit loss performance and net margins cannot be verified from public sources, secondary market transactions at or above the $1.0B Series C valuation carry uncompensated downside risk. Investors should maintain a strict track posture until audited financials validate positive unit profitability."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV008"
      - "CV014"
  - calloutType: "risk"
    title: "Structural Margin Vulnerability in Zero-Late-Fee Installment Model"
    body: "Conventional global BNPL providers rely significantly on consumer late charges to offset default write-offs and funding costs. Tamara's Sharia-compliant product architecture explicitly eliminates all late fees. In an environment of elevated wholesale borrowing costs across its $2.4B credit line, any unexpected increase in consumer defaults directly impairs net margins without compensatory fee revenue, exposing equity holders to substantial downside."
    claimRefs:
      - "CV004"
      - "CV006"
      - "CV007"
      - "CV010"
