      - number: '5.2'
        title: 云基础设施、DevOps 底座与平台工程
        blocks:
          - type: paragraph
            body: >-
              Tamara 的工程与技术架构构建在现代化的解耦微服务模型之上，专为 GCC 市场的水平扩展与快速产品迭代而设计。核心基础设施托管于 Amazon Web Services（AWS）或 Google Cloud
              Platform（GCP）等主流公有云，运行时编排由按需调度的 Kubernetes 集群执行。所有基础设施组件——包括虚拟网络拓扑、IAM 访问控制、入口负载均衡器以及关系型/文档型数据库——均通过
              Terraform 和 Pulumi 等工具实现基础架构即代码（IaC）管理。部署流程遵循基于 GitHub 和 GitLab
              的严密持续集成与持续交付（CI/CD）流水线，集成了自动化安全扫描、容器镜像漏洞核查，以及金丝雀（canary）和蓝绿（blue-green）部署等渐进式发布策略。研发规范严格贯彻领域驱动设计（DDD）、六边形架构，并坚持
              API-first 的前后端解耦原则。集中化可观测性层汇聚分布式链路追踪、结构化日志以及兼容 Prometheus 的指标，赋能故障自愈排查与根因分析。平台的高可用与业务连续性依托经过实战演练的容灾预案及明确的
              RTO/RPO 目标，确保在区域大促高峰期系统依然平稳运行。
            claimRefs:
