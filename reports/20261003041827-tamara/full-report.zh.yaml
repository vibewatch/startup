  - id: TE002
    title: 业务流程与系统集成场景分析
    columns:
      - 相关方 / 业务阶段
      - 传统流程
      - Tamara 集成解决方案
      - 可量化的业务成效
      - 当前局限与操作阻力
    rows:
      - - 消费者线上结账
        - 使用信用卡 / 借记卡全额预付，或选择拒收率高的货到付款（COD）
        - 在网关选择 Tamara；通过手机验证码分 2 至 4 期付款
        - 消除货到付款拒收率；提升支付承受力且无逾期罚款
        - 持续逾期未付将导致账户冻结并影响个人征信评级
      - - 消费者全渠道线下门店
        - 在零售柜台实体 POS 机刷卡或现金支付
        - 在收银台扫描店内二维码或出示 Tamara App 条形码
        - 打通美妆、服饰、数码等零售场景的全渠道无缝分期支付
        - 结账时需要智能手机联网并能即时加载数据
      - - 商户订单结算
        - 结算周期漫长，且完全暴露在退货及客户违约风险下
        - 扣除商户费率后即时全额结算；由 Tamara 承担信用违约风险
        - 提升转化率与平均客单价（AOV），保障商户现金流回笼
        - 商户费率（MDR）会侵蚀零售商毛利率
      - - 电商系统集成
        - 定制网关代码开发耗时长达数周
        - 提供预制即用插件（如 CS-Cart）及区分测试与生产环境的标准 REST API
        - 数小时内完成集成，支持双币种（SAR/AED）与自动化 Webhook 回调
        - 第三方连接器版本脱节，高度依赖合作平台更新
    notes: 分析结论来自官方商户指南与第三方连接器文档。系统集成落地速度取决于商户底层架构。
