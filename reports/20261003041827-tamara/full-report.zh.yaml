      - number: '4.3'
        title: 资本充足率、现金流动态与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              Tamara 报表账面利润与实际现金流生成之间存在巨大背离。尽管在 H1 2026 实现了 SAR 207.4 million 的净利润，Tamara 的经营性现金流却净流出约 SAR 1.97
              billion，主要是消费者应收账款扩张抽走了 SAR 2.60 billion 的经营流动资金。为支撑这一贷款发放规模，公司依赖新提取的 SAR 2.15 billion 债务融资，使贷款与融资负债总额从
              2025 年末的 SAR 3.76 billion 激增至 2026 年 6 月的 SAR 5.81 billion。总资产升至 SAR 7.35 billion，而股东权益仅为 SAR 777.4
              million，折算资产对权益的高财务杠杆率达 9.5x，权益资产比仅 10.6%。虽然 Tamara 拥有主权基金与区域顶级机构的支持——曾于 2023 年 12 月以 $1.0 billion 估值完成
              $340 million 的 Series C 轮股权融资，并获得 Goldman Sachs 与 Shorooq Partners 牵头的逾 $400 million
              债务授信——但其资本充足水平深度捆绑于信贷资产打包周转的债务流动性及 SAMA 监管合规。评估 Tamara
              的核心投资前提，在于获取经审计的借款队列逾期曲线、违约损失率（LGD）以及债务授信契约条款，而这些核心数据目前仍属绝密。
