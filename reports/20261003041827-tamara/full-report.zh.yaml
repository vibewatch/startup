      - number: '3.2'
        title: 功能能力、商业定价与集成权衡
        blocks:
          - type: paragraph
            body: >-
              Tamara 与同业的横向运营对比显示，双方在产品架构、集成广度与商业模式上差异显著 [CP003, CP004, CP006]。Tamara
              的消费者端产品主打透明、免息且无额外费用的分期计划——主要是全额付以及分 2、3、4 期付款，对特定大额消费则开放最长 24 个月的扩展期限——并经 Shariyah Review Bureau
              认证完全符合伊斯兰教法 [CP006, CP007]。相比之下，Tabby 更强调 GCC 全域规模，拥有超过 10 million 活跃用户和极致顺畅的移动端结账体验，在 Shopify 生态内的优化尤为深入
              [CP003]。商户商业条款方面，两家区域领头羊均未公布固定不变的标准费率表，通常根据交易规模、毛利率及商户品类协商确定商户折扣率（MDR），一般在 2.5% 至 4.0% 之间 [CP003,
              CP010]。泛欧对标公司 Alma 则采用另一种透明定价模式，公布的不含增值税（ex-VAT）标准佣金为 2 期付 3.60%、15 天延期结算 4.20%，并辅以消费者分摊机制，将商户表观成本压降至
              2.89%–3.49% [CP004]。运营评估表明，集成复杂度远不止前端购物车组件：企业级商户必须在混合支付体系中处理结算时间表同步、Webhook 自动化对账、部分退货以及退款拒付等一系列复杂流程
              [CP003, CP011]。
            claimRefs:
