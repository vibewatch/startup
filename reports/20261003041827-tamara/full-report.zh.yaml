            body: Tamara 的收入高度集中于核心 BNPL 业务，且严重依赖沙特与阿联酋市场。面对资本雄厚的区域与全球对手，要守住独角兽估值，关键在于持续打入客单价更高的大额消费行业（医疗、教育、旅游）以及周边银行金融服务。
            calloutType: insight
