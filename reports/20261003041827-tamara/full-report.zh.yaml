      - number: '1.3'
        title: 业务版图、伊斯兰教法架构与信用风险特征
        blocks:
          - type: paragraph
            body: >-
              Tamara 在沙特、阿联酋和巴林的线上及实体零售渠道提供免息且符合伊斯兰教法的分期付款选项 [CO006, CO013]。面向消费者的核心产品包括全额付以及分 2、3、4
              期付款，并针对客单价更高的零售品类推出了最长 24 个月的长期分期选项 [CO006, CO013]。商户端变现依赖即时垫资结算：Tamara
              承担底层欺诈与信用违约风险，收取商户折扣费率（MDR），同时向消费者承诺零滞纳金且无高利罚息 [CO006, CO013, CO014]。经 Shariyah Review Bureau
              认证，伊斯兰教法严禁收取滞纳金，因此逾期消费者面临的是平台账户冻结和央行征信系统上报，而非惩罚性罚息累加 [CO006, CO014]。运营员工规模增至约 1,349 至 1,459 人，分布在 25
              个国家，其中沙特占 36.8%、阿联酋占 24.0%、埃及占 20.5%、越南占 6.7%、德国占 6.6% [CO007,
              CO015]。但关键财务指标——包括经审计的年度收入、商品交易总额（GMV）、净交易利润率以及实际信贷减值损失率——仍属未经验证的非公开数据，构成了需要审计财报验证的尽调缺口 [CO012, CO016]。
