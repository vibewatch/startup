              Tamara 获得 Sanabil Investments（PIF）与 SNB Capital 的股权注资，同时持有 SAMA 颁发的正式股份制公司牌照（牌照号 95/A Sh/202502）并拥有 515M
              SAR 实缴资本，在沙特阿拉伯构筑起无可比拟的监管护城河与本土主权协同优势 [CO001, CO010]。
