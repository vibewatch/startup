      - number: '1.2'
        title: 融资历史、机构支持方与信贷授信
        blocks:
          - type: paragraph
            body: >-
              Tamara 于 2021 年 1 月完成 $6M 种子轮融资，拉开机构资本化序幕；同年 4 月迅速完成由 Checkout.com 领投的里程碑式 $110M Series A 轮融资，创下当时 MENA
              金融科技领域规模最大的 Series A 纪录 [CO005, CO008]。2023 年 12 月，Tamara 完成 $340M 的 Series C
              轮融资，晋升独角兽企业；该轮由沙特公共投资基金（PIF）全资子公司 Sanabil Investments 与 SNB Capital（Alahlicapital）联合领投，投后估值达 $1.0B [CO009,
              CO010]。历次股权融资累计金额约 $556M [CO009, CO011]。为向消费者应收账款及商户垫资结算提供资金，Tamara 获得了大额常规债务授信，包括 2023 年 11 月的 $250M
              授信，以及 2025 年 9 月 15 日由 Goldman Sachs、Citi 与 Apollo Funds 等全球银行机构安排的扩容至 $2.4B 的常规债务授信 [CO009,
              CO012]。尽管获得大批顶级机构背书，公开披露仍未体现具体的股权结构表持股比例、股份类别清算优先权或 EquityZen 等平台上的老股交易量，外部观察者无法看清准确的股权稀释情况 [CO004,
              CO011]。
