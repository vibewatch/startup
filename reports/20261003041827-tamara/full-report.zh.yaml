    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、监管地位与治理架构
        blocks:
          - type: paragraph
            body: >-
              Tamara Finance Company 是沙特央行（SAMA）发牌并监管的股份有限公司制金融科技机构，牌照编号为 95/A Sh/202502
              [CO001]。公司总部位于利雅得萨勒曼国王区阿卜杜拉国王支路，实缴股本 515,000,000 沙特里亚尔，商业登记号为 1010627663，统一机构编号为 7016874419 [CO001]。Tamara
              于 2020 年由连续创业者 Abdulmajeed Alsukhan 携手联合创始人 Turki Bin Zarah 与 Abdulmohsen Al Babtain 正式创立 [CO002,
              CO003]。创始高管团队在中东北非（MENA）电商与金融运营领域展现出极高的创始人与市场匹配度，但关键人物依赖严重集中于 CEO Abdulmajeed Alsukhan 与首席商务官 Turki Bin
              Zarah [CO002, CO004]。从运营历程来看，Tamara 是首家入选 SAMA 监管沙盒计划的 BNPL 金融科技公司，之后获得正式全牌照，深度契合沙特「2030 愿景」下的金融部门发展计划
              [CO005, CO006]。尽管 Tamara 在利雅得、迪拜、开罗、德国和越南设立了跨国实体及专项研发运营中心，但合规与资本管理仍统一受利雅得 SAMA 的集中监管 [CO001, CO004,
              CO007]。
