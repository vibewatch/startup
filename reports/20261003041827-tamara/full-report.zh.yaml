      - number: '3.3'
        title: 护城河韧性：切换成本、风控纪律与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Tamara 的竞争防御壁垒主要依托本土品牌好感度、伊斯兰教法合规资质以及广泛的商户接入，但在护城河的长期韧性上面临结构性制约 [CP001, CP002, CP005]。商户在不同 BNPL
              服务商之间的切换成本天然偏低，现代电商网关与无头（headless）结账 API 支持双路由或多路由接入，日常开发运维开销极小 [CP003, CP004]。因此，Tamara 和 Tabby
              均不具备垄断定价权；任何一家单方面激进调高 MDR，都会立即促使商户将交易量分流至竞争对手 [CP003, CP010]。战略评估进一步显示，在激烈的竞争压力与不断攀升的获客成本挤压下，Tamara
              实现持续盈利的路径依然充满不确定性 [CP001]。尽管 Tamara 作为受 SAMA 监管的持牌股份制金融公司（牌照号 95/A Sh/202502）运营，拥有 SAR 515,000,000
              的实缴资本，但宏观经济逆风——包括高企的资金成本和区域信贷周期波动——放大了违约风险和风控脆弱性 [CP002, CP005, CP012]。为守住防线，Tamara
              的战略重心聚焦于向相邻金融服务拓展多元化收入、强化人工智能风控以保护单元经济模型，以及将业务版图向沙特和阿联酋核心市场之外延伸 [CP001, CP002]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP012
      - number: '3.4'
        title: 图表展示
        blocks:
          - type: callout
            title: 商户多栖接入削弱单边定价权
            body: >-
              为了避免 BNPL 转化率出现 15%–30% 的断崖式下跌，沙特电商通常会同时接入 Tamara 和 Tabby，两家平台均无法对渠道形成排他性锁定。服务商之间的切换成本微乎其微，单方面拉高 MDR
