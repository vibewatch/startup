  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 战略视角
      - 投资逻辑
      - 反向逻辑
      - 预期转变触发要素
    rows:
      - - 市场领导力
        - 沙特首家本土 BNPL 独角兽，拥有 20M 注册用户并持有 SAMA 股份有限公司牌照
        - 遭遇 Tabby 及新兴区域支付平台争夺商户结账份额的激烈竞争
        - 第三方独立市场份额数据证实其在沙特和阿联酋持续占据多数结账份额
      - - 资金获取能力
        - 获 Goldman Sachs、Citi 及 Apollo 联合提供的高达 $2.4B 符合伊斯兰教法的授信额度
        - 高利率环境下，资产打包融资（warehouse facilities）的高额偿债成本压缩净息差
        - 披露实际债务资本成本及资产打包额度使用契约条款
      - - 商业化变现模式
        - 拥有 30,000+ 家合作伙伴的商户佣金网络持续扩大，并延伸至 24 个月分期
        - 严格遵循伊斯兰教法禁止向消费者收取滞纳金，直接砍断传统 BNPL 的核心营收支柱
        - 经审计利润表证明在剔除商户补贴后仍实现正向净交易利润率
      - - 信用与坏账风险
        - 依托 SAMA 监管沙盒历练与本土数据沉淀，打造自研风控与反欺诈引擎
        - 信用损失拨备计提方法与逾期曲线仍未公开且未经证实
        - 在尽调保密协议下提供同群组违约率与历史坏账核销数据
    notes: 投资逻辑与反向逻辑驱动因素评估了 Tamara 符合伊斯兰教法的 BNPL 业务模式在运营与财务上的可行性。
