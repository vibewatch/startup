  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品矩阵与全渠道结账架构
        blocks:
          - type: paragraph
            body: >-
              Tamara 在沙特阿拉伯、阿联酋和巴林提供面向消费者的灵活支付选项以及赋能商户的结账基础设施。对终端消费者而言，产品组合以核心分期机制为支柱：全额付、分 2 期、分 3 期与分 4 期付款，辅以最长可达 24
              个月的扩展分期功能。平台明确剔除了滞纳金与隐性利息，严格遵循 Shariyah Review Bureau 认证的伊斯兰金融准则。在销售终端，无论是线上还是实体零售，交易均通过自动化网关跳转与移动 App
              发起。消费者通过预留手机号和国民身份证认证完成鉴权，商户则按约定扣除折扣费率后即时收到全额结账款项。在结账底层，Tamara 实时处理消费者风险评估、信用评分与反欺诈检测，并通过基于 Liquid
              逻辑、Webhook 及 Push/短信通知的自动化 CRM 系统开展多渠道全生命周期触达。这套双边机制既隔离了合作商户承担的买家信用与欺诈风险，又切实拉动了电子、美妆和教育等各类零售品类的结账转化率与客单价。
