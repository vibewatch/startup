      - CR005
      - CR008
      - CR013
      - CR014
  - id: TV001
    title: 投资建议汇总表
    columns:
      - 维度
      - 评估结论
      - 底层证据
      - 决策含义
    rows:
      - - 投资建议
        - 观察
        - 沙特本土 BNPL 龙头地位，被收入及利润率公开数据缺失所抵消
        - 暂不追加增量股权投资；持续监测业务执行与二级市场定价
      - - 置信度
        - 中
        - 融资与债务规模具备充分验证；单体经济模型盈利可见度偏低
        - 出具高确信度买入评级前，须获取经审计财报与股权结构表中的优先股堆叠
      - - 风险评级
        - 高
        - 符合伊斯兰教法的零滞纳金规则导致信用损失敞口放大，叠加巨额批发性负债
        - 针对违约激增与利率波动，严密压力测试资产负债表
      - - 估值立场
        - 偏高
        - $1.0B 投后 Series C 估值缺乏可核验的公开 ARR 或 EBITDA 支撑
        - 在老股转让中争取估值折价，或设置结构化下行保护条款
    notes: 投资建议与风险评估基于 Series C 股权估值标杆、信贷授信披露以及 SAMA 监管架构综合研判。
