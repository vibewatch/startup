  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与变现机制
        blocks:
          - type: paragraph
            body: >-
              Tamara 依托商户折扣率（MDR）与不断扩张的合规消费者伊斯兰金融，构建起双轮驱动的变现模型。2026 年前六个月，Tamara Finance 录得总收入 SAR 1.376 billion，较 H1
              2025 的 SAR 495.9 million 增长 177%。商户网络收入贡献了 SAR 848 million（占总收入的 61.6%），而 H1 2025 仅为 SAR 405.7
              million；同时伊斯兰金融收入出现爆发式增长，从去年同期的区区 SAR 2.3 million 飙升至 SAR 410.2 million。商户端，Tamara 收取的佣金费率通常在客单价的 2% 至 6%
              之间，在提供即时垫资结算并承担信用风险的同时，为商户带来最高 15% 的转化率提升和最高 40% 的客单价拉升。消费者端，核心短期分期产品（「分 2、3、4
              期付款」）不收取滞纳金或利息，而期限更长的融资产品（「最长分 24 期付款」）则通过伊斯兰金融结构获取合同约定的信贷收益。此外，Tamara 还推出了面向消费者的 Tamara Smart
              订阅会员，在首月免费试用后按每月 SAR 19 收费，提供返现与奖励特权。
