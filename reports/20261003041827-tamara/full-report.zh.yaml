      - number: '4.2'
        title: 成本结构、经营杠杆与信贷拨备
        blocks:
          - type: paragraph
            body: >-
              由于收入增速大幅跑赢固定运营费用增长，Tamara 在 H1 2026 展现出显著的经营杠杆效应。H1 2026 总运营支出为 SAR 287.2 million，较 H1 2025 的 SAR 172.3
              million 有所上升，但占收入比例从 34.7% 大幅降至 20.9%。该杠杆效应推动上半年净利润达 SAR 207.4 million（H1 2025 为 SAR 64.3 million），其中 Q2
              2026 在 SAR 706.6 million 的季度收入下录得 SAR 84 million 净利。然而，Tamara
              的单元经济严重受制于节节攀升的资金成本与信贷减值拨备。在批发资产证券化与银行借款扩张的推动下，H1 2026 符合伊斯兰教法的资金成本从上年同期的 SAR 92.4 million 升至 SAR 190.8
              million。更为严峻的是，预期信用损失（ECL）拨备自 H1 2025 的 SAR 17.9 million 暴增二十倍至 H1 2026 的 SAR 357.5 million，导致收回前的累计减值拨备达到
              SAR 459.4 million，对应总额为 SAR 6.50 billion 的消费者应收账款毛额。鉴于 Tamara
              完全兜底交易信用与欺诈风险且不收滞纳金，随着新发放的长期贷款队列逐步走向成熟，逾期率一旦抬头，毛利率与净利率将极其脆弱。
