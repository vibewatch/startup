        - 合同明确了各方责任，并允许因合规调查暂缓结算
        - 通道构成、处理机构集中度、拒付率与结算异常数据均未披露
      - - 外部融资能力
        - 股权投资人与债权融资机构
        - 支持公司业务扩张与融资模式运作的资金
        - Unknown
        - 融资重定价、契约约束承压或增量授信受阻拖累业务扩张
        - 严重
        - 一份综合公司通稿报道称，累计获得股权融资 US$500M、债权融资逾 US$400M
        - 已融资金并非当前在手现金；未偿债务、到期期限、限制性契约与可用额度均属未知
    notes: 交易对手集中度与合同条款未见公开；历史累计融资规模不能衡量当前在手现金、未偿债务或可用授信额度。
