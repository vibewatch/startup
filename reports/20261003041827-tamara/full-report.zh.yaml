  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 核心假设
      - 估值与回报逻辑
      - 核心风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 沙特零售电商迅猛扩张；24 个月分期拉升客单价；成功在沙特交易所（Tadawul）IPO
        - 退出估值 $2.0B - $2.5B；较 Series C 估值标杆实现 2.0x - 2.5x 倍数扩张
        - GCC 各国央行对消费者杠杆设定监管上限，或出台商户扣率（MDR）上限
        - 区域零售线上化加速转型，且通过 PIF 旗下子公司持续获得主权资本支持
      - - 基准情景
        - 用户规模稳步增长 15-20%；商户合作关系保持稳固；适度支取批发性债务额度
        - 估值 $1.0B - $1.2B；回报持平至微赚，基本锚定 Series C 持仓成本
        - 面对来自 Tabby 的激烈价格战，商户抽成比率（take rate）承压受蚀
        - 业务透明度未见改善，阻碍其在公开市场以高倍数溢价向机构投资者募资上市
      - - 悲观情景
        - 消费者违约率上升；批发性资产打包债务再融资遇阻；商户流失
        - 估值 $400M - $600M；较 Series C 股权估值面临 40-60% 的下行流血轮折价
        - 缺乏滞纳金缓冲垫导致无法收回的应收账款激增；信用评级遭下调
        - 宏观经济放缓背景下，Goldman Sachs 或 Apollo 收紧信贷额度
    notes: 情景预测以 2023 年 12 月确立的 $1.0B Series C 轮估值为基准，评估潜在退出估值。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV008
      - CV010
      - CV012
