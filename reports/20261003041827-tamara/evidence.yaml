evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited financial statements confirming annual gross merchandise volume (GMV), net revenue, and gross transaction
      margins.
    whyItMatters: >-
      Without audited top-line figures and margins, third-party revenue estimates cannot be verified and unit economics
      remain speculative.
    diligencePath: >-
      Obtain audited financial disclosures or formal pre-IPO prospectus filings submitted to regional securities
      regulators.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: credit-risk-underwriting
    missingEvidence: >-
      Default loss provisioning methodology and non-performing loan (NPL) percentages on extended-tenor installment
      receivables.
    whyItMatters: >-
      Given the prohibition of late fees under Sharia compliance, credit losses directly impair receivables
      collateralizing the $2.4B warehouse facility.
    diligencePath: >-
      Request confidential credit committee default curves, cohort vintage loss curves, and SAMA regulatory capital
      filings.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: >-
      Full board of directors composition and specific equity shareholding breakdown among institutional and founding
      partners.
    whyItMatters: >-
      Prevents independent determination of voting control, liquidation preference hurdles, and minority investor veto
      rights.
    diligencePath: >-
      Inspect commercial register share register filings with the Saudi Ministry of Commerce or confidential cap table
      records.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: competitive-market-share
    missingEvidence: >-
      Audited transaction volume and Gross Merchandise Value (GMV) disclosures disaggregating market share between
      Tamara and Tabby in Saudi Arabia.
    whyItMatters: >-
      Public databooks aggregate total market volume without isolating individual provider GMV, preventing independent
      verification of Tamara's claimed domestic market share.
    diligencePath: >-
      Obtain audited bilateral merchant processing statements and confidential SAMA market share filings during formal
      underwriting.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: credit-default-performance
    missingEvidence: >-
      Vintage-level default rates, non-performing loan (NPL) ratios, and collection loss provisioning metrics for
      24-month extended installments.
    whyItMatters: >-
      Because Tamara absorbs credit risk without assessing consumer late fees, loss rates directly determine gross
      margin stability and capital adequacy.
    diligencePath: Review internal risk committee cohort analysis and SIMAH credit reporting returns under NDA.
  - type: private-evidence-only
    severity: material
    topic: merchant-discount-rate-transparency
    missingEvidence: >-
      Audited merchant-by-merchant MDR rate schedules, tiering formulas, and contractual exclusivity rebate terms for
      Tamara versus Tabby across top-tier enterprise retailers in Saudi Arabia.
    whyItMatters: >-
      Without contractual MDR disclosures, true take rates, net margin yields, and the vulnerability of gross margins to
      merchant price renegotiation cannot be fully quantified.
    diligencePath: >-
      Request anonymized merchant fee schedules across key enterprise accounts (e.g. fashion, consumer electronics)
      during private confirmatory diligence.
    relatedQuestionRefs:
      - QP001
  - type: private-evidence-only
    severity: material
    topic: head-to-head-market-share-and-gmv
    missingEvidence: >-
      Independently audited comparative GMV volume, merchant checkout share, and active consumer transaction counts
      between Tamara and Tabby in Saudi Arabia.
    whyItMatters: >-
      Public sources document dual-integration and common checkout presence, but precise transaction volume splits
      between the two dominant players remain undisclosed.
    diligencePath: >-
      Review payment gateway aggregate volume processing data (e.g., via regional acquirers or PSP benchmarks) and
      merchant-level share-of-wallet reports.
    relatedQuestionRefs:
      - QP002
      - QP005
  - type: private-evidence-only
    severity: material
    topic: credit-loss-cohort-performance
    missingEvidence: >-
      Audited loan vintage performance curves showing delinquency progression, 30/60/90-day past-due rates, recovery
      percentages, and gross loss-given-default rates across 4-installment and 24-month tenors.
    whyItMatters: >-
      Given the surge in ECL provisions to SAR 357.5M and zero late fee penalties under Sharia rules, portfolio loss
      rates represent the single largest variable determining true underwriting return.
    diligencePath: >-
      Request confidential IFRS 9 credit impairment models, monthly static pool vintage curves, and SAMA regulatory
      compliance audits.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-facility-covenants-and-costs
    missingEvidence: >-
      Detailed debt terms, margin spreads above SAIBOR, borrowing base advance rates, and covenant restrictions on
      warehouse financing and securitization vehicles.
    whyItMatters: >-
      Tamara carries SAR 5.81B in debt against SAR 777.4M in equity (9.5x assets-to-equity leverage); any covenant
      breach or credit line freeze would instantly stop loan origination.
    diligencePath: >-
      Obtain credit agreement documentation and compliance certificates for the Goldman Sachs warehouse facility and
      local bank loan syndicates.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: underwriting-algorithms
    missingEvidence: >-
      Technical documentation, feature weights, and loss-provisioning performance of Tamara's real-time algorithmic
      credit scoring and underwriting engine.
    whyItMatters: >-
      Without visibility into automated decisioning cutoffs and historical NPL loss rates, investors cannot
      independently underwrite Tamara's credit exposure as transaction volumes expand.
    diligencePath: >-
      Request confidential risk-management audit reports, algorithmic model validation documentation, and vintage loss
      curves during technical diligence.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, merchant churn, active-user cohorts, repeat purchase frequency, and contract-renewal history.
    whyItMatters: >-
      Network registrations and merchant logos do not establish repeat use, relationship durability, or recurring
      transaction economics.
    diligencePath: >-
      Request monthly consumer and merchant cohorts by geography, repeat transaction frequency, churn definitions, NRR,
      GRR, and renewal history from management.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-10 merchant and channel concentration by GMV, net revenue, transaction count, contract duration, and
      exclusivity.
    whyItMatters: >-
      Dependence on large retailers or a payment processor could create material volume and pricing risk despite a broad
      logo set.
    diligencePath: >-
      Request customer-level GMV and net-revenue concentration, signed contract terms, renewal dates, exclusivity, and
      channel-attributed volumes.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-merchants
    missingEvidence: Current production status, deployment scope, and measured outcomes for each named merchant.
    whyItMatters: A named relationship or logo does not prove an active production deployment or current commercial value.
    diligencePath: >-
      Obtain current merchant references, live checkout confirmation, deployment dates, and account-level outcome data
      for a representative sample.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-and-legal-record
    missingEvidence: >-
      Regulator-issued licenses for each operating entity, examination findings, enforcement records, litigation
      dockets, and complaint outcomes.
    whyItMatters: >-
      Company pages establish claimed licensing but cannot establish the absence of proceedings, restrictions, or
      unresolved consumer-redress issues.
    diligencePath: >-
      Confirm every license and product permission with SAMA, CBUAE, and CBB records; obtain regulator correspondence,
      litigation schedules, and complaint registers.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: credit-loss-and-liquidity
    missingEvidence: >-
      Audited defaults, delinquency vintages, recoveries, provision coverage, receivables, liquidity, debt outstanding,
      facility maturities, covenants, and undrawn capacity.
    whyItMatters: >-
      Approval growth and cumulative financing do not reveal loss-adjusted economics, cash availability, or the capacity
      to fund receivables through stress.
    diligencePath: >-
      Obtain audited financials, monthly portfolio tapes, vintage curves, expected-credit-loss models, treasury
      schedules, lender agreements, and covenant certificates.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: security-and-resilience
    missingEvidence: >-
      Independent security assurance, uptime history, service-level attainment, material incident records, recovery
      tests, and breach-notification evidence.
    whyItMatters: >-
      Contractual duties and availability disclaimers define responsibilities but do not demonstrate effective controls
      or prove that no incident occurred.
    diligencePath: >-
      Review current security certifications, penetration tests, status history, incident post-mortems, recovery
      exercises, and merchant SLA reports.
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: counterparty-concentration
    missingEvidence: >-
      Exposure shares and fallback arrangements for open-banking providers, processors, card rails, banks, merchants,
      and financing providers.
    whyItMatters: >-
      Named dependencies are visible, but public evidence cannot quantify whether one failure would interrupt
      underwriting, settlement, distribution, or funding.
    diligencePath: >-
      Request counterparty exposure schedules, SLAs, termination rights, concentration limits, failover tests, and
      approved replacement providers.
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements detailing Tamara's net revenue, gross transaction margin, and merchant discount fee
      take rates.
    whyItMatters: >-
      Without audited top-line and margin data, multiple-based valuation benchmarks cannot be rigorously verified
      against public fintech peers.
    diligencePath: Request audited annual financial statements and management accounts under bilateral due diligence NDA.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: credit-loss-provisioning
    missingEvidence: >-
      Historical vintage delinquency curves, default rates, and credit loss provisions across split-in-2, 3, 4, and
      24-month payment tiers.
    whyItMatters: >-
      Zero-late-fee Sharia compliance leaves credit loss provisions as the primary unmitigated risk factor driving
      balance sheet stability.
    diligencePath: Obtain vintage-level static pool loss analyses and SAMA regulatory compliance reporting filings.
    relatedQuestionRefs:
      - QV006
      - QV007
  - type: private-evidence-only
    severity: minor
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Detailed capitalization table reflecting share classes, option pools, and seniority of liquidation preferences
      across Series A, B, and C rounds.
    whyItMatters: >-
      Senior liquidation preferences from sovereign investors could impair common or junior equity returns in a
      conservative exit scenario.
    diligencePath: Review the full corporate register and investor rights agreements in the virtual data room.
    relatedQuestionRefs:
      - QV001
