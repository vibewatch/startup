chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence shows a two-sided customer base: consumers using Tamara online and in stores, and merchants receiving upfront settlement while Tamara assumes fraud and credit risk. A 2023 Forbes report cited more than 10 million users and 30,000 merchants, but the assigned evidence does not disclose current active-user, retention, cohort, or customer-concentration metrics."
sections:
  - id: "customer-segments"
    title: "Two-sided customer base and use cases"
    body: >-
      Tamara serves consumers and merchants rather than a single homogeneous customer
      group. Its documentation says it operates in Saudi Arabia, the United Arab Emirates,
      and Bahrain, while its consumer site describes both online and in-store use. Consumers
      receive flexible payment timing with no late fees, although repeated delays may suspend
      an account and affect the consumer's credit score. Merchants receive the purchase price
      upfront while Tamara says it carries fraud and credit risk, making conversion, settlement,
      and risk transfer the core merchant value proposition. The public material does not split
      users, transactions, or revenue by country, merchant size, vertical, or channel, so the
      segmentation below is functional rather than a quantified revenue mix.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-scale"
    title: "Adoption signals are broad but dated"
    body: >-
      The strongest scale datapoint in the assigned pool is a December 2023 Forbes report
      citing more than 10 million users and 30,000 merchants, including major regional and
      global retailers. An undated AIM2Flourish case page describes an earlier footprint of
      more than 1,000 merchants, but the missing publication date prevents a defensible
      growth-rate calculation. Tamara's July 2025 Amazon Payment Services announcement is a
      newer distribution signal across Saudi Arabia and the UAE, not a measured adoption
      result: it does not disclose activated merchants, transaction volume, or incremental
      users. These records establish network breadth and channel expansion, but registered
      users should not be treated as active users and announced access should not be treated
      as production usage.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-proof"
    title: "Named proof favors logos and company-attributed outcomes"
    body: >-
      Forbes named SHEIN, IKEA, Jarir, Noon, eXtra, and Farfetch among Tamara's merchant
      partners in 2023, which is useful evidence of recognizable merchant relationships but
      does not establish each merchant's current contract status, exclusivity, volume, or
      retention. Tamara's Amazon Payment Services release provides a more recent named channel
      relationship and says the integration expands availability across Saudi Arabia and the
      UAE. AIM2Flourish reports company-attributed increases of 41% in average order value and
      30% in cart conversion; the page supplies neither a sample size nor a measurement period,
      so those figures are directional claims rather than independently benchmarked merchant
      outcomes. No assigned source provides customer-level revenue or deployment-stage evidence
      for the named retail brands.
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU010"
      - "CU016"
    tableRefs:
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability and concentration remain underwriting gaps"
    body: >-
      The assigned evidence does not disclose NRR, GRR, merchant churn, consumer repeat rate,
      active-user cohorts, contract duration, or top-customer concentration. Tamara's support
      surface shows an around-the-clock chat channel, scheduled live-care coverage, and issue
      categories spanning claims, refunds, order problems, accounts, and payments, but support
      availability is not a satisfaction or retention metric. A JumpCloud supplier case study
      reports that Tamara supported more than 700 employees and 350 consultants and reduced
      internal onboarding effort, which indicates operational scaling capacity rather than
      customer adoption. The investment implication is therefore asymmetric: public logos and
      network counts support reach, but durability and dependency on large merchants or payment
      channels cannot be underwritten without private cohort, contract, and GMV data.
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
