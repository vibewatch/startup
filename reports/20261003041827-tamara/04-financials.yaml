callouts:
  - calloutType: "insight"
    title: "Structural Revenue Transformation: From Pure BNPL to Consumer Credit"
    body: "Tamara's revenue engine underwent a fundamental transformation in H1 2026. Islamic financing income rose from a negligible SAR 2.3 million in H1 2025 to SAR 410.2 million, representing nearly 30% of total revenue. While this diversification expands the addressable revenue pool beyond merchant retail commissions, it converts Tamara into a regulated consumer lending institution where portfolio credit quality and wholesale debt availability supersede GMV velocity."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI011"
  - calloutType: "risk"
    title: "Operating Cash Outflow vs Accounting Profitability"
    body: "Despite reporting SAR 207.4 million in net income for H1 2026, Tamara consumed SAR 1.97 billion in operating cash flow to support consumer receivables expansion. With total financing debt reaching SAR 5.81 billion on an equity base of SAR 777.4 million, Tamara remains highly levered and reliant on continuous securitization liquidity to avoid working capital compression."
    claimRefs:
      - "CI007"
      - "CI012"
      - "CI013"
      - "CI014"
