chapter:
  number: 4
  title: "Financials"
  summary: "Tamara expanded H1 2026 revenue to SAR 1.38 billion and achieved SAR 207.4 million in net income, driven by a structural shift toward Islamic financing alongside merchant fees. However, negative operating cash flow of SAR 1.97 billion and a surge in expected credit loss provisions to SAR 357.5 million reveal substantial underwriting exposure and reliance on wholesale debt facilities."
sections:
  - id: "revenue-streams-and-monetization-model"
    title: "Revenue Streams and Monetization Dynamics"
    body: "Tamara operates a dual-engine monetization model combining merchant discount rates (MDR) and expanding Sharia-compliant consumer Islamic financing. For the first six months of 2026, Tamara Finance recorded total revenue of SAR 1.376 billion, up 177% compared to SAR 495.9 million in H1 2025. Merchant network revenue contributed SAR 848 million (61.6% of total revenue) compared with SAR 405.7 million in H1 2025, while Islamic financing income expanded dramatically to SAR 410.2 million compared with just SAR 2.3 million in the prior-year period. On the merchant side, Tamara charges a commission rate typically ranging between 2% and 6% of basket value, offering upfront settlement while absorbing credit risk and driving merchant conversion gains up to 15% and average order value improvements up to 40%. On the consumer side, core short-term split products ('Pay in 2, 3, and 4') are provided without late fees or consumer interest, whereas longer-tenor financing ('Pay over up to 24 months') generates contractual financing yields under Islamic financing structures. In addition, Tamara launched Tamara Smart, a consumer subscription offering cashback and rewards at SAR 19 monthly following a one-month free trial."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "cost-structure-operating-leverage-and-unit-economics"
    title: "Cost Structure, Operating Leverage, and Credit Provisions"
    body: "Tamara demonstrated measurable operating leverage in H1 2026 as revenue growth outpaced overhead expense increases. Total operating expenses reached SAR 287.2 million in H1 2026 compared to SAR 172.3 million in H1 2025, declining as a percentage of revenue from 34.7% to 20.9%. This leverage drove first-half net income to SAR 207.4 million versus SAR 64.3 million in H1 2025, with Q2 2026 delivering SAR 84 million on quarterly revenue of SAR 706.6 million. However, Tamara's unit economics are heavily influenced by the escalating cost of funding and credit impairment provisions. Sharia-compliant funding costs rose to SAR 190.8 million in H1 2026 from SAR 92.4 million a year earlier, driven by expansion of wholesale securitization and bank borrowing. More critically, provisions for expected credit losses (ECL) jumped twenty-fold to SAR 357.5 million in H1 2026 compared with SAR 17.9 million in H1 2025, pushing the cumulative impairment allowance before recoveries to SAR 459.4 million against gross consumer receivables of SAR 6.50 billion. Because Tamara absorbs complete credit and fraud risk on transactions and assesses no late fees, gross margins and net margins remain vulnerable to delinquency spikes as newer, longer-dated loan cohorts mature."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-financing-dependency-and-cash-flow"
    title: "Capital Adequacy, Cash Flow Dynamics, and Diligence Blockers"
    body: "A stark divergence exists between Tamara's reported accounting profitability and its cash generation. Despite generating SAR 207.4 million in net income during H1 2026, Tamara incurred operating cash outflows of approximately SAR 1.97 billion, driven primarily by consumer receivables growth that consumed SAR 2.60 billion in operating liquidity. To fund this loan origination, the company relied on SAR 2.15 billion in new debt drawings, expanding total loans and financing liabilities to SAR 5.81 billion by June 2026 from SAR 3.76 billion at year-end 2025. Total assets rose to SAR 7.35 billion against shareholders' equity of SAR 777.4 million, implying a high financial leverage ratio of 9.5x assets-to-equity and an equity-to-asset capitalization of 10.6%. While Tamara retains backing from major sovereign and regional institutions—having raised $340 million in Series C equity at a $1.0 billion valuation in December 2023 alongside over $400 million in debt facilities led by Goldman Sachs and Shorooq Partners—its capital adequacy is deeply tied to warehouse debt liquidity and SAMA regulatory compliance. Underwriting Tamara requires obtaining audited cohort delinquency curves, default loss-given-default metrics, and debt facility covenant terms, which remain strictly private."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
