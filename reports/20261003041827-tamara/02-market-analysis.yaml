  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitive-market-share
      missingEvidence: Audited transaction volume and Gross Merchandise Value (GMV) disclosures disaggregating market share between Tamara and Tabby in Saudi Arabia.
      whyItMatters: Public databooks aggregate total market volume without isolating individual provider GMV, preventing independent verification of Tamara's claimed domestic market share.
      diligencePath: Obtain audited bilateral merchant processing statements and confidential SAMA market share filings during formal underwriting.
      relatedQuestionRefs:
        - QM009
    - type: private-evidence-only
      severity: material
      topic: credit-default-performance
      missingEvidence: Vintage-level default rates, non-performing loan (NPL) ratios, and collection loss provisioning metrics for 24-month extended installments.
      whyItMatters: Because Tamara absorbs credit risk without assessing consumer late fees, loss rates directly determine gross margin stability and capital adequacy.
      diligencePath: Review internal risk committee cohort analysis and SIMAH credit reporting returns under NDA.
