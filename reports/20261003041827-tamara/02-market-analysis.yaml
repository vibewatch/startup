callouts:
  - calloutType: insight
    title: Asymmetric Revenue Model Shifts Credit Exposure
    body: Because Tamara derives its top-line economics strictly from merchant discount rates while guaranteeing zero late fees to consumers, the platform cannot offset delinquency through punitive charges. This structural constraint aligns merchant conversion with responsible underwriting, but concentrates credit loss risk directly on the firm's balance sheet under SAMA oversight.
    claimRefs:
      - CM005
      - CM011
      - CM012
      - CM013
