company:
  name: "Tamara"
chapter:
  number: 7
  title: "Risks"
  summary: "Tamara's current Saudi license and contractual risk controls reduce immediate regulatory and merchant-settlement uncertainty, but they do not resolve the central underwriting question: public evidence does not disclose current defaults, loss provisions, liquidity, or facility covenants. Residual exposure is therefore highest in credit performance, consumer servicing, cross-border compliance, platform resilience, and funding dependence."
sections:
  - id: "regulatory-legal-and-consumer-outcomes"
    title: "Regulatory, Legal, and Consumer-Outcome Exposure"
    body: >-
      Tamara identifies itself as a Saudi joint-stock finance company supervised by the Saudi
      Central Bank under license 95/A Sh/202502, and two current company pages state registered
      capital of SAR 515 million. Registered capital is not cash available, however, and the
      assigned evidence does not include a regulator-issued license record, examination report,
      enforcement history, litigation docket, or complaint register. Tamara also says it operates
      in Saudi Arabia, the United Arab Emirates, and Bahrain, while its merchant agreement makes
      market activations subject to local mandatory law. That creates a multi-jurisdiction
      consumer-credit, payments, AML, sanctions, privacy, tax, and e-commerce compliance surface.
      A procurement review adds a weaker but adverse signal: billing, refund, and support complaints
      appear in public-review clusters. The signal merits diligence, not an inferred violation or
      incident finding.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR007"
      - "CR011"
      - "CR012"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "credit-financial-and-underwriting-risk"
    title: "Credit, Financial, and Underwriting Risk"
    body: >-
      The core economic exposure remains credit performance. Tamara's merchant terms state that it
      assumes credit risk, fraud risk, and chargebacks for approved transactions, subject to
      merchant-liability exceptions. Lean's partner case study describes why the underwriting
      challenge is material: conventional data gave only partial visibility into non-salaried
      applicants, while bank-verified data reportedly increased credit-limit approvals by 32% and
      surfaced income for around 60% of those customers. Those figures demonstrate a mitigation
      mechanism, not independently verified loss performance. The pool contains no audited default
      rate, delinquency vintage, provision coverage, receivables balance, funding cost, cash
      position, or covenant headroom. A syndicated company funding release reported cumulative
      equity and debt financing, but capital raised must not be treated as current liquidity or
      debt outstanding.
    claimRefs:
      - "CR004"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR013"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "operations-security-and-dependencies"
    title: "Operations, Security, and Counterparty Dependencies"
    body: >-
      Contractual controls protect Tamara but can transfer friction to merchants. The agreement
      permits investigation-related settlement holds, including up to 75% of weekly net amounts
      with monthly settlement in specified verification circumstances, and disclaims uninterrupted
      system availability. It also treats Tamara and each merchant as independent data controllers
      with notification duties for unauthorized access. These clauses show control intent and
      allocation of liability; they do not prove uptime, incident-response effectiveness, security
      certification, or merchant satisfaction. Dependencies include card issuers and schemes,
      merchant data quality, repayment behavior, the Lean open-banking integration described in the
      case study, and external capital providers. Concentration is not public for any of these
      categories, so failure scenarios should be monitored without assigning unsupported exposure
      percentages.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR011"
      - "CR012"
      - "CR014"
    tableRefs:
      - "TR003"
  - id: "residual-risk-and-thesis-breakers"
    title: "Residual Risk, Monitoring, and Thesis-Break Triggers"
    body: >-
      The risk ranking is evidence-constrained rather than a prediction of failure. Credit-loss
      opacity receives the highest residual rating because the company bears approved-transaction
      credit exposure while the public pool provides no portfolio loss data. Regulatory and
      consumer-outcome risk remains high because a Saudi license is visible but cross-border
      approvals, complaints, examinations, and enforcement are not. Operational resilience is also
      unresolved: contractual availability disclaimers and a procurement review's servicing
      concerns are not incident statistics. Investment kill criteria should therefore be
      measurable: inability to verify current licensing, loss performance outside an agreed
      tolerance, persistent unresolved complaint or refund backlogs, material covenant pressure, or
      failure to produce independent security and resilience evidence. Until those tests are run,
      mitigations should be classified as documented, partial, or unverified rather than mature.
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR006"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR016"
    figureRefs:
      - "FR001"
