  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Assumptions
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Saudi retail e-commerce expands rapidly; 24-month installments drive AOV; successful Tadawul IPO
        - $2.0B - $2.5B exit valuation; 2.0x - 2.5x multiple expansion over Series C mark
        - Regulatory caps on consumer leverage or merchant discount fee ceilings by GCC central banks
        - Accelerated regional retail shift and sustained sovereign support via PIF subsidiaries
      - - Base Case
        - Steady 15-20% user growth; stable merchant partnerships; moderate wholesale debt drawdowns
        - $1.0B - $1.2B valuation; flat to modest return matching Series C cost basis
        - Erosion of merchant take rates due to intense pricing competition from Tabby
        - Continued opacity preventing institutional public market listing at premium multiples
      - - Bear Case
        - Rising consumer default rates; wholesale warehouse debt refinancing friction; merchant churn
        - $400M - $600M valuation; 40-60% down-round haircut on Series C equity valuation
        - Spike in uncollectible receivables without late-fee buffer; credit rating downgrades
        - Credit facility tightening by Goldman Sachs or Apollo amid macroeconomic slowdown
    notes: >-
      Scenario projections evaluate prospective exit valuations against the $1.0B Series C benchmark established in
      December 2023.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
