  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Suite and Omnichannel Checkout Architecture
        blocks:
          - type: paragraph
            body: >-
              Tamara delivers consumer-facing flexible payment options and merchant-enabling checkout infrastructure
              across Saudi Arabia, the United Arab Emirates, and Bahrain. For end consumers, the product catalog is
              anchored by its core split-payment mechanisms: Pay in Full, Split in 2, Split in 3, and Split in 4
              installments, alongside an extended installment facility allowing payments over up to 24 months. The
              platform explicitly eliminates late fees and hidden interest, adhering to Islamic financing guidelines
              certified by the Shariyah Review Bureau. At the point of sale, whether online or physical retail,
              transactions are initiated through automated gateway redirects and mobile applications. Consumers
              authenticate via registered mobile numbers and national ID verification, while merchants receive upfront
              settlement of the full purchase price minus agreed merchant discount rates. Behind the checkout flow,
              Tamara handles real-time consumer risk evaluation, credit scoring, fraud detection, and multi-channel
              lifecycle messaging via automated CRM systems utilizing Liquid logic, webhooks, and push/SMS
              notifications. This dual-sided mechanism shields partner merchants from buyer credit and fraud risks while
              driving measurable uplifts in checkout conversion rates and average order values across diverse retail
              categories including electronics, beauty, and education.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
