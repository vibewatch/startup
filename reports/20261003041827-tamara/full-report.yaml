  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Strategic Angle
      - Investment Thesis
      - Investment Anti-Thesis
      - What Would Change the View
    rows:
      - - Market Leadership
        - Pioneer Saudi BNPL unicorn with 20M users and SAMA joint-stock licensing
        - Intense rivalry from Tabby and emerging regional payment platforms for merchant checkout share
        - Independent market share data showing sustainable majority checkout share across KSA and UAE
      - - Capital Access
        - Secured up to $2.4B Shariah-compliant facility from Goldman Sachs, Citi, and Apollo
        - High debt service costs on warehouse facilities compress net interest margin in high-rate environments
        - Disclosure of effective cost of debt capital and warehouse utilization covenants
      - - Monetization Model
        - Expanding merchant commission network with 30,000+ partners and extended 24-month tenors
        - Strict Shariah compliance prohibits consumer late charges, eliminating major conventional BNPL revenue line
        - Audited income statements proving positive net transaction margin excluding merchant subsidies
      - - Credit & Loss Risk
        - Proprietary credit and fraud engine backed by SAMA sandbox heritage and local data
        - Credit loss provisioning methodology and delinquency curves remain private and unverified
        - Cohort-level default rates and historical loss write-off data shared under diligence NDA
    notes: >-
