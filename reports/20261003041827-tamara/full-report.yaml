      - number: '7.2'
        title: Credit, Financial, and Underwriting Risk
        blocks:
          - type: paragraph
            body: >-
              The core economic exposure remains credit performance. Tamara's merchant terms state that it assumes
              credit risk, fraud risk, and chargebacks for approved transactions, subject to merchant-liability
              exceptions. Lean's partner case study describes why the underwriting challenge is material: conventional
              data gave only partial visibility into non-salaried applicants, while bank-verified data reportedly
              increased credit-limit approvals by 32% and surfaced income for around 60% of those customers. Those
              figures demonstrate a mitigation mechanism, not independently verified loss performance. The pool contains
              no audited default rate, delinquency vintage, provision coverage, receivables balance, funding cost, cash
              position, or covenant headroom. A syndicated company funding release reported cumulative equity and debt
              financing, but capital raised must not be treated as current liquidity or debt outstanding.
            claimRefs:
              - CR004
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operations, Security, and Counterparty Dependencies
        blocks:
          - type: paragraph
            body: >-
              Contractual controls protect Tamara but can transfer friction to merchants. The agreement permits
              investigation-related settlement holds, including up to 75% of weekly net amounts with monthly settlement
              in specified verification circumstances, and disclaims uninterrupted system availability. It also treats
              Tamara and each merchant as independent data controllers with notification duties for unauthorized access.
              These clauses show control intent and allocation of liability; they do not prove uptime, incident-response
              effectiveness, security certification, or merchant satisfaction. Dependencies include card issuers and
              schemes, merchant data quality, repayment behavior, the Lean open-banking integration described in the
              case study, and external capital providers. Concentration is not public for any of these categories, so
              failure scenarios should be monitored without assigning unsupported exposure percentages.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR013
              - CR014
      - number: '7.4'
        title: Residual Risk, Monitoring, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The risk ranking is evidence-constrained rather than a prediction of failure. Credit-loss opacity receives
              the highest residual rating because the company bears approved-transaction credit exposure while the
              public pool provides no portfolio loss data. Regulatory and consumer-outcome risk remains high because a
              Saudi license is visible but cross-border approvals, complaints, examinations, and enforcement are not.
              Operational resilience is also unresolved: contractual availability disclaimers and a procurement review's
              servicing concerns are not incident statistics. Investment kill criteria should therefore be measurable:
              inability to verify current licensing, loss performance outside an agreed tolerance, persistent unresolved
              complaint or refund backlogs, material covenant pressure, or failure to produce independent security and
              resilience evidence. Until those tests are run, mitigations should be classified as documented, partial,
              or unverified rather than mature.
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
