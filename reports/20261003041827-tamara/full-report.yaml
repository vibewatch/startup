              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Primary kill criterion: unverifiable credit performance'
            body: >-
              Do not infer portfolio quality from approval uplift, cumulative funding, or contractual controls. If
              management cannot provide audited loss vintages, provision coverage, facility headroom, and
              regulator-ready model governance, the central credit thesis remains ununderwritable.
            calloutType: risk
            claimRefs:
