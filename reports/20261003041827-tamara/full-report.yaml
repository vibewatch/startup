    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Regulatory Standing, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Tamara Finance Company operates as a joint-stock Saudi financial technology firm licensed and supervised
              by the Saudi Central Bank (SAMA) under license number 95/A Sh/202502 [CO001]. Headquartered in Riyadh on
              King Abdullah Branch Road, King Salman District, the company maintains a paid-up share capital of
              515,000,000 Saudi Riyals with Commercial Registration number 1010627663 and Unified Number 7016874419
              [CO001]. Tamara was officially founded in 2020 by serial entrepreneur Abdulmajeed Alsukhan alongside
              co-founders Turki Bin Zarah and Abdulmohsen Al Babtain [CO002, CO003]. The founding executive team
              exhibits high founder-market fit across MENA commerce and financial operations, though key-person
              dependency centers heavily on Chief Executive Officer Abdulmajeed Alsukhan and Chief Commercial Officer
              Turki Bin Zarah [CO002, CO004]. Operationally, Tamara was the inaugural BNPL fintech admitted to SAMA's
              regulatory sandbox program before securing full formal licensing, cementing its strategic alignment with
              the Kingdom's Financial Sector Development Program under Vision 2030 [CO005, CO006]. While Tamara operates
              cross-border entities and specialized development and operations hubs across Riyadh, Dubai, Cairo,
              Germany, and Vietnam, regulatory compliance and capital management remain centralized under SAMA
              supervision in Riyadh [CO001, CO004, CO007].
            claimRefs:
