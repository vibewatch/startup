      - number: '1.3'
        title: Operational Footprint, Sharia Architecture, and Credit Risk Dynamics
        blocks:
          - type: paragraph
            body: >-
              Tamara provides non-interest, Sharia-compliant split payment options across online and physical retail
              channels in Saudi Arabia, the UAE, and Bahrain [CO006, CO013]. Core consumer offerings include Pay in Full
              alongside Split in 2, 3, and 4 installments, accompanied by emerging longer-tenor options extending up to
              24 months for higher-ticket retail categories [CO006, CO013]. Merchant monetization relies on upfront
              transaction settlement where Tamara absorbs underlying fraud and credit default risks, charging merchant
              discount rates (MDR) while charging consumers zero late fees or usurious penalties [CO006, CO013, CO014].
              Because late fees are prohibited under Sharia compliance verified by the Shariyah Review Bureau,
              delinquent consumer accounts face platform suspension and credit bureau reporting rather than cumulative
              punitive fee accumulation [CO006, CO014]. Operating headcount grew to approximately 1,349 to 1,459
              employees distributed across 25 countries, led by Saudi Arabia (36.8%), the UAE (24.0%), Egypt (20.5%),
              Vietnam (6.7%), and Germany (6.6%) [CO007, CO015]. However, critical financial metrics including audited
              annual revenue, gross merchandise volume (GMV), net transaction margins, and actual credit impairment loss
              rates remain unverified private data, creating diligence gaps that require audited financial verification
              [CO012, CO016].
