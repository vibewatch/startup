  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              The addressable market for Buy Now, Pay Later (BNPL) solutions in the Gulf Cooperation Council (GCC) is
              defined by consumer-driven point-of-sale and e-commerce transactions, separating flexible consumer credit
              from conventional institutional banking. Within this boundary, included spend encompasses online digital
              checkout across retail categories such as fashion, electronics, and beauty, physical in-store
              point-of-sale installment volumes, and newly emerging high-ticket merchant financing for healthcare and
              automotive services. Excluded from this perimeter are corporate wholesale trade credit, interbank
              settlements, and traditional long-term consumer loans such as mortgages and vehicle leases. Tamara
              operates within this defined consumer retail sphere across Saudi Arabia, the United Arab Emirates, and
              Bahrain, structuring transactions as interest-free split payments over 2, 3, or 4 installments, alongside
              extended financing up to 24 months. By monetizing through merchant discount commissions rather than
              customer interest, the platform positions itself as an alternative to revolving credit card debt and cash
              on delivery.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM011
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM006
              - CM007
              - CM011
              - CM014
      - number: '2.2'
        title: TAM/SAM/SOM Sizing Lenses and Regional Growth Projections
        blocks:
          - type: paragraph
            body: >-
              Sizing the Gulf BNPL opportunity requires evaluating macro commerce foundations against sector-specific
              payment projections. Top-level regional retail and commerce expenditure forms the broadest Total
              Addressable Market (TAM), representing hundreds of billions in annual GCC consumer spend. Within this
              base, digital commerce and card payment gross merchandise value represent the primary Serviceable
              Addressable Market (SAM). According to ResearchAndMarkets databook benchmarks, Saudi Arabia's BNPL payment
              market is projected to reach US$1.48 billion in 2025, growing at a 13.5% annual rate, before compounding
              at a 9.7% CAGR to reach approximately US$2.36 billion by 2030. In the neighboring United Arab Emirates,
              where digital penetration and expat credit adoption are higher, the BNPL market is forecast to reach
              US$2.84 billion in 2025 and expand at an 11.2% CAGR to US$4.82 billion by 2030. Combined, these two anchor
              markets represent a US$7.18 billion BNPL transaction landscape by 2030, establishing substantial room for
              Tamara's domestic footprint.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
