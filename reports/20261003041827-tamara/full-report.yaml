      - number: '5.2'
        title: Cloud Infrastructure, DevOps Foundations, and Platform Engineering
        blocks:
          - type: paragraph
            body: >-
              Tamara's engineering and technical architecture is built on a modern, decoupled microservices model
              designed for horizontal scale and rapid product iteration across GCC markets. The core infrastructure is
              hosted on major cloud computing providers such as Amazon Web Services (AWS) or Google Cloud Platform
              (GCP), with runtime orchestration executed via Kubernetes clusters provisioned on demand. All
              infrastructure components—including virtual network topologies, IAM access controls, ingress load
              balancers, and relational/document databases—are managed as code using tools such as Terraform and Pulumi.
              Deployment workflows follow rigorous Continuous Integration and Continuous Delivery (CI/CD) pipelines
              implemented through GitHub and GitLab, incorporating automated security scanning, container image
              vulnerability checks, and progressive rollout strategies such as canary and blue-green deployments.
              Development standards enforce Domain-Driven Design (DDD), Hexagonal architecture, and strict separation
              between frontend and backend services via an API-first approach. Centralized observability layers
              aggregate distributed traces, structured logs, and Prometheus-compatible metrics to enable self-serve
              incident diagnostics and root-cause analysis. High availability and business continuity are governed by
              tested disaster recovery runbooks and defined RTO/RPO targets, maintaining platform uptime during peak
              regional shopping events.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE015
      - number: '5.3'
        title: Merchant Integration Ecosystem, Security Controls, and Regulatory Compliance
        blocks:
          - type: paragraph
            body: >-
              To support rapid merchant onboarding across enterprise and SME segments, Tamara combines pre-built
              e-commerce marketplace connectors with direct RESTful APIs. Third-party platform plugins, such as the
              CS-Cart payment gateway add-on, facilitate one-step merchant integration, handling dual-mode test and live
              environments, currency conversion across Saudi Riyals (SAR) and UAE Dirhams (AED), and automated
              order-status callbacks. When customers initiate checkout, they are temporarily redirected to Tamara's
              secure hosted payment gateway, which validates identity and credit eligibility before returning the
              customer to the merchant storefront with explicit authorization tokens. Security controls are embedded
              directly into network topology and cloud foundations rather than relying on manual reviews: data residency
              and regulatory boundaries are enforced via policy-as-code, and credentials are protected through automated
              secret rotation and short-lived tokens. Furthermore, Tamara Finance Company operates as a licensed
              joint-stock financial institution under the direct supervision and control of the Saudi Central Bank
              (SAMA) under License No. 95/A Sh/202502 with authorized capital of 515,000,000 Saudi Riyals. Transactions
              are monitored around the clock with enterprise-grade data encryption, and consumer repayment behavior is
              reported to regional credit bureaus to mitigate structural credit risk.
            claimRefs:
              - CE004
              - CE010
              - CE011
              - CE012
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Cloud-Native Infrastructure Underpins Rapid GCC Expansion
            body: >-
              Tamara's adoption of Kubernetes, Terraform infrastructure-as-code, and decoupled API microservices enables
              rapid provisioning and scaling across Saudi Arabia, UAE, and Bahrain while maintaining strict
              policy-driven data residency controls.
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE010
          - type: callout
            title: Proprietary Underwriting and Loss-Rate Algorithms Remain Private
            body: >-
              While Tamara absorbs buyer credit and fraud risk on behalf of merchants, the technical mechanisms and
              machine learning models governing its real-time credit decisioning remain undisclosed, representing a
              material due diligence gap for underwriters.
            calloutType: risk
            claimRefs:
              - CE004
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Two-sided customer base and use cases
        blocks:
          - type: paragraph
            body: >-
              Tamara serves consumers and merchants rather than a single homogeneous customer group. Its documentation
              says it operates in Saudi Arabia, the United Arab Emirates, and Bahrain, while its consumer site describes
              both online and in-store use. Consumers receive flexible payment timing with no late fees, although
              repeated delays may suspend an account and affect the consumer's credit score. Merchants receive the
              purchase price upfront while Tamara says it carries fraud and credit risk, making conversion, settlement,
              and risk transfer the core merchant value proposition. The public material does not split users,
              transactions, or revenue by country, merchant size, vertical, or channel, so the segmentation below is
              functional rather than a quantified revenue mix.
            claimRefs:
              - CU001
              - CU002
