      - number: '6.3'
        title: Named proof favors logos and company-attributed outcomes
        blocks:
          - type: paragraph
            body: >-
              Forbes named SHEIN, IKEA, Jarir, Noon, eXtra, and Farfetch among Tamara's merchant partners in 2023, which
              is useful evidence of recognizable merchant relationships but does not establish each merchant's current
              contract status, exclusivity, volume, or retention. Tamara's Amazon Payment Services release provides a
              more recent named channel relationship and says the integration expands availability across Saudi Arabia
              and the UAE. AIM2Flourish reports company-attributed increases of 41% in average order value and 30% in
              cart conversion; the page supplies neither a sample size nor a measurement period, so those figures are
              directional claims rather than independently benchmarked merchant outcomes. No assigned source provides
              customer-level revenue or deployment-stage evidence for the named retail brands.
            claimRefs:
              - CU005
