        title: Exhibits
        blocks:
          - type: callout
            title: Public proof supports reach, not durability
            body: >-
              A 2023 independent report identifies a large user and merchant footprint and names recognizable merchant
              relationships, while the 2025 Amazon Payment Services announcement adds a newer distribution channel.
              These signals support commercial reach but do not supply active-use or retention denominators.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Retention and concentration are not publicly underwritable
            body: >-
              No assigned source discloses NRR, GRR, merchant churn, repeat consumer activity, contract duration, or
              top-customer GMV concentration. These omissions prevent a public-evidence assessment of relationship
              durability and anchor-merchant dependency.
            calloutType: risk
            claimRefs:
