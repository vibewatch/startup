  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Consumer-Outcome Exposure
        blocks:
          - type: paragraph
            body: >-
              Tamara identifies itself as a Saudi joint-stock finance company supervised by the Saudi Central Bank under
              license 95/A Sh/202502, and two current company pages state registered capital of SAR 515 million.
              Registered capital is not cash available, however, and the assigned evidence does not include a
              regulator-issued license record, examination report, enforcement history, litigation docket, or complaint
              register. Tamara also says it operates in Saudi Arabia, the United Arab Emirates, and Bahrain, while its
              merchant agreement makes market activations subject to local mandatory law. That creates a
              multi-jurisdiction consumer-credit, payments, AML, sanctions, privacy, tax, and e-commerce compliance
              surface. A procurement review adds a weaker but adverse signal: billing, refund, and support complaints
              appear in public-review clusters. The signal merits diligence, not an inferred violation or incident
              finding.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR011
              - CR012
