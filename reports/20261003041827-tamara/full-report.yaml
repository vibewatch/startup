      - number: '4.3'
        title: Capital Adequacy, Cash Flow Dynamics, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              A stark divergence exists between Tamara's reported accounting profitability and its cash generation.
              Despite generating SAR 207.4 million in net income during H1 2026, Tamara incurred operating cash outflows
              of approximately SAR 1.97 billion, driven primarily by consumer receivables growth that consumed SAR 2.60
              billion in operating liquidity. To fund this loan origination, the company relied on SAR 2.15 billion in
              new debt drawings, expanding total loans and financing liabilities to SAR 5.81 billion by June 2026 from
              SAR 3.76 billion at year-end 2025. Total assets rose to SAR 7.35 billion against shareholders' equity of
              SAR 777.4 million, implying a high financial leverage ratio of 9.5x assets-to-equity and an
              equity-to-asset capitalization of 10.6%. While Tamara retains backing from major sovereign and regional
              institutions—having raised $340 million in Series C equity at a $1.0 billion valuation in December 2023
              alongside over $400 million in debt facilities led by Goldman Sachs and Shorooq Partners—its capital
              adequacy is deeply tied to warehouse debt liquidity and SAMA regulatory compliance. Underwriting Tamara
              requires obtaining audited cohort delinquency curves, default loss-given-default metrics, and debt
              facility covenant terms, which remain strictly private.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Structural Revenue Transformation: From Pure BNPL to Consumer Credit'
            body: >-
              Tamara's revenue engine underwent a fundamental transformation in H1 2026. Islamic financing income rose
              from a negligible SAR 2.3 million in H1 2025 to SAR 410.2 million, representing nearly 30% of total
              revenue. While this diversification expands the addressable revenue pool beyond merchant retail
              commissions, it converts Tamara into a regulated consumer lending institution where portfolio credit
              quality and wholesale debt availability supersede GMV velocity.
            calloutType: insight
            claimRefs:
