      - number: '4.2'
        title: Cost Structure, Operating Leverage, and Credit Provisions
        blocks:
          - type: paragraph
            body: >-
              Tamara demonstrated measurable operating leverage in H1 2026 as revenue growth outpaced overhead expense
              increases. Total operating expenses reached SAR 287.2 million in H1 2026 compared to SAR 172.3 million in
              H1 2025, declining as a percentage of revenue from 34.7% to 20.9%. This leverage drove first-half net
              income to SAR 207.4 million versus SAR 64.3 million in H1 2025, with Q2 2026 delivering SAR 84 million on
              quarterly revenue of SAR 706.6 million. However, Tamara's unit economics are heavily influenced by the
              escalating cost of funding and credit impairment provisions. Sharia-compliant funding costs rose to SAR
              190.8 million in H1 2026 from SAR 92.4 million a year earlier, driven by expansion of wholesale
              securitization and bank borrowing. More critically, provisions for expected credit losses (ECL) jumped
              twenty-fold to SAR 357.5 million in H1 2026 compared with SAR 17.9 million in H1 2025, pushing the
              cumulative impairment allowance before recoveries to SAR 459.4 million against gross consumer receivables
              of SAR 6.50 billion. Because Tamara absorbs complete credit and fraud risk on transactions and assesses no
              late fees, gross margins and net margins remain vulnerable to delinquency spikes as newer, longer-dated
              loan cohorts mature.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI007
