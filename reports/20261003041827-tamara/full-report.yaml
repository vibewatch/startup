      - number: '6.2'
        title: Adoption signals are broad but dated
        blocks:
          - type: paragraph
            body: >-
              The strongest scale datapoint in the assigned pool is a December 2023 Forbes report citing more than 10
              million users and 30,000 merchants, including major regional and global retailers. An undated AIM2Flourish
              case page describes an earlier footprint of more than 1,000 merchants, but the missing publication date
              prevents a defensible growth-rate calculation. Tamara's July 2025 Amazon Payment Services announcement is
              a newer distribution signal across Saudi Arabia and the UAE, not a measured adoption result: it does not
              disclose activated merchants, transaction volume, or incremental users. These records establish network
              breadth and channel expansion, but registered users should not be treated as active users and announced
              access should not be treated as production usage.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU008
              - CU009
