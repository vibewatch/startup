      - number: '6.4'
        title: Durability and concentration remain underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose NRR, GRR, merchant churn, consumer repeat rate, active-user
              cohorts, contract duration, or top-customer concentration. Tamara's support surface shows an
              around-the-clock chat channel, scheduled live-care coverage, and issue categories spanning claims,
              refunds, order problems, accounts, and payments, but support availability is not a satisfaction or
              retention metric. A JumpCloud supplier case study reports that Tamara supported more than 700 employees
              and 350 consultants and reduced internal onboarding effort, which indicates operational scaling capacity
              rather than customer adoption. The investment implication is therefore asymmetric: public logos and
              network counts support reach, but durability and dependency on large merchants or payment channels cannot
              be underwritten without private cohort, contract, and GMV data.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
