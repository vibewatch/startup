      - number: '1.2'
        title: Financing History, Institutional Backers, and Credit Facilities
        blocks:
          - type: paragraph
            body: >-
              Tamara established its institutional capitalization trajectory in January 2021 with a $6M seed round,
              followed rapidly in April 2021 by a landmark $110M Series A led by Checkout.com, which marked the largest
              Series A round in MENA fintech history at that time [CO005, CO008]. In December 2023, Tamara achieved
              unicorn status upon closing a $340M Series C round co-led by Sanabil Investments (a wholly owned
              subsidiary of Saudi Arabia's Public Investment Fund) and SNB Capital (Alahlicapital), valuing the business
              at a $1.0B post-money valuation [CO009, CO010]. Cumulative funding across equity rounds reached
              approximately $556M [CO009, CO011]. To finance consumer receivables and merchant advance settlements,
              Tamara secured substantial conventional debt lines, including a $250M facility in November 2023 and an
              expanded $2.4B conventional debt facility on September 15, 2025, arranged with global banking institutions
              including Goldman Sachs, Citi, and Apollo Funds [CO009, CO012]. Despite substantial institutional
              validation, public disclosure does not reveal granular cap table ownership percentages, share class
              liquidation preferences, or secondary share trading volumes on platforms like EquityZen, leaving precise
              equity dilution opaque to third-party observers [CO004, CO011].
            claimRefs:
              - CO004
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
