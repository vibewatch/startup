chapter:
  number: 1
  title: "Company Overview"
  summary: "Tamara is a Riyadh-headquartered Saudi fintech unicorn and SAMA-licensed buy-now-pay-later (BNPL) platform founded in 2020 by Abdulmajeed Alsukhan, Turki Bin Zarah, and Abdulmohsen Al Babtain. The company has raised over $556M in total equity and debt, anchored by a $1B post-money Series C in December 2023 and major conventional debt facilities including a $2.4B facility in September 2025, while maintaining strict Sharia compliance and operating across Saudi Arabia, the UAE, and Bahrain."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Regulatory Standing, and Governance Structure"
    body: "Tamara Finance Company operates as a joint-stock Saudi financial technology firm licensed and supervised by the Saudi Central Bank (SAMA) under license number 95/A Sh/202502 [CO001]. Headquartered in Riyadh on King Abdullah Branch Road, King Salman District, the company maintains a paid-up share capital of 515,000,000 Saudi Riyals with Commercial Registration number 1010627663 and Unified Number 7016874419 [CO001]. Tamara was officially founded in 2020 by serial entrepreneur Abdulmajeed Alsukhan alongside co-founders Turki Bin Zarah and Abdulmohsen Al Babtain [CO002, CO003]. The founding executive team exhibits high founder-market fit across MENA commerce and financial operations, though key-person dependency centers heavily on Chief Executive Officer Abdulmajeed Alsukhan and Chief Commercial Officer Turki Bin Zarah [CO002, CO004]. Operationally, Tamara was the inaugural BNPL fintech admitted to SAMA's regulatory sandbox program before securing full formal licensing, cementing its strategic alignment with the Kingdom's Financial Sector Development Program under Vision 2030 [CO005, CO006]. While Tamara operates cross-border entities and specialized development and operations hubs across Riyadh, Dubai, Cairo, Germany, and Vietnam, regulatory compliance and capital management remain centralized under SAMA supervision in Riyadh [CO001, CO004, CO007]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-backing"
    title: "Financing History, Institutional Backers, and Credit Facilities"
    body: "Tamara established its institutional capitalization trajectory in January 2021 with a $6M seed round, followed rapidly in April 2021 by a landmark $110M Series A led by Checkout.com, which marked the largest Series A round in MENA fintech history at that time [CO005, CO008]. In December 2023, Tamara achieved unicorn status upon closing a $340M Series C round co-led by Sanabil Investments (a wholly owned subsidiary of Saudi Arabia's Public Investment Fund) and SNB Capital (Alahlicapital), valuing the business at a $1.0B post-money valuation [CO009, CO010]. Cumulative funding across equity rounds reached approximately $556M [CO009, CO011]. To finance consumer receivables and merchant advance settlements, Tamara secured substantial conventional debt lines, including a $250M facility in November 2023 and an expanded $2.4B conventional debt facility on September 15, 2025, arranged with global banking institutions including Goldman Sachs, Citi, and Apollo Funds [CO009, CO012]. Despite substantial institutional validation, public disclosure does not reveal granular cap table ownership percentages, share class liquidation preferences, or secondary share trading volumes on platforms like EquityZen, leaving precise equity dilution opaque to third-party observers [CO004, CO011]."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "operational-scale"
    title: "Operational Footprint, Sharia Architecture, and Credit Risk Dynamics"
    body: "Tamara provides non-interest, Sharia-compliant split payment options across online and physical retail channels in Saudi Arabia, the UAE, and Bahrain [CO006, CO013]. Core consumer offerings include Pay in Full alongside Split in 2, 3, and 4 installments, accompanied by emerging longer-tenor options extending up to 24 months for higher-ticket retail categories [CO006, CO013]. Merchant monetization relies on upfront transaction settlement where Tamara absorbs underlying fraud and credit default risks, charging merchant discount rates (MDR) while charging consumers zero late fees or usurious penalties [CO006, CO013, CO014]. Because late fees are prohibited under Sharia compliance verified by the Shariyah Review Bureau, delinquent consumer accounts face platform suspension and credit bureau reporting rather than cumulative punitive fee accumulation [CO006, CO014]. Operating headcount grew to approximately 1,349 to 1,459 employees distributed across 25 countries, led by Saudi Arabia (36.8%), the UAE (24.0%), Egypt (20.5%), Vietnam (6.7%), and Germany (6.6%) [CO007, CO015]. However, critical financial metrics including audited annual revenue, gross merchandise volume (GMV), net transaction margins, and actual credit impairment loss rates remain unverified private data, creating diligence gaps that require audited financial verification [CO012, CO016]."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
