callouts:
  - calloutType: "strength"
    title: "Sovereign Alignment and Structural Regulatory Moat"
    body: "Tamara's equity backing by Sanabil Investments (PIF) and SNB Capital, paired with formal joint-stock licensing under SAMA (License No. 95/A Sh/202502) and 515M SAR in paid-up capital, provides an unmatched regulatory moat and local sovereign alignment in the Kingdom of Saudi Arabia [CO001, CO010]."
    claimRefs:
      - "CO001"
      - "CO010"
  - calloutType: "risk"
    title: "Credit Loss Opacity Under Zero-Late-Fee Sharia Mandate"
    body: "Because Tamara strictly adheres to Sharia principles eliminating punitive late fees, customer default mitigation relies solely on account suspension and credit score reporting. With $2.4B in conventional debt commitments backing receivables, the complete lack of public default loss rate disclosures constitutes a material credit risk [CO012, CO014, CO016]."
    claimRefs:
      - "CO012"
      - "CO014"
      - "CO016"
