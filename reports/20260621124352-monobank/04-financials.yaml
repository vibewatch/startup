chapter:
  number: 4
  title: Financials
  summary: >-
    monobank's financial profile spans two legally separate entities: JSC Universal Bank (NBU-regulated)
    reported UAH 215.6 billion in assets and UAH 2.59 billion in profit on the NBU supervisory profile, while
    Fintech Band LLC (tech operator within Fintech-IT Group) reported UAH 3.71 billion in revenue and
    UAH 1.15 billion in net profit for FY2024 — though revenue fell 33% and net profit fell 63% versus FY2023.
    No public consolidated monobank segment P&L exists; NIM, CAC, LTV, and delinquency data are all
    undisclosed, creating material diligence gaps that preclude full underwriting from public sources.

sections:
  - id: entity-separation
    title: Entity Separation and the Dual-Financial-Reporting Structure
    body: >-
      Any financial analysis of monobank must begin with entity separation. Two distinct legal entities
      generate revenue and carry risks that are not consolidated in any public filing. JSC Universal Bank
      (NBU license No. 92) is the banking entity that holds deposits, issues loans, and generates net
      interest income, interchange fees, and commission-based revenues. Its financial results are reported
      to the National Bank of Ukraine and appear on the NBU supervisory profile page in English-language
      summary form. Fintech-IT Group — the IT holding company formerly known as Fintech Band LLC — is the
      technology operator that develops and maintains the monobank app, ACDC payment processing platform,
      and adjacent fintech products. Fintech Band earns revenue primarily from software development and
      technology services provided to Universal Bank, supplemented by ACDC payment processing revenues and
      revenues from SME-facing products such as Expirenza, market by mono, Base by mono, and Loyalty.ai.

      The two entities are economically interdependent but legally separate, with distinct boards, ownership
      structures, and regulatory frameworks. Universal Bank is owned by Serhiy Tihipko through TAC Group;
      Fintech-IT Group is beneficially owned by Oleg Gorokhovskyi and Mykhailo Rohalskyi. The monobank
      brand does not correspond to any single legal entity whose consolidated financials are publicly disclosed.
      Any investor underwriting monobank as a unified business must obtain unpublished management accounts
      spanning both entities and documenting the intercompany fee arrangement between Universal Bank and
      Fintech Band. This chapter maintains that distinction throughout: financial metrics attributed to
      Universal Bank (NBU-reported) are bank-entity metrics only; metrics attributed to Fintech Band or
      Fintech-IT Group are tech-operator metrics only.
