  - id: revenue-model-unit-economics
    title: Revenue Model, Monetization Drivers, and Unit Economics
    body: >-
      monobank's revenue model operates across two distinct but interdependent layers. At the banking
      layer, Universal Bank earns revenue through: (1) interchange fees on Visa and Mastercard payment
      card transactions — the primary volume-driven revenue stream given monobank's status as Ukraine's
      second-largest retail bank by payment card count; (2) net interest income (NII) from consumer
      lending including installment plans, "until tomorrow" micro-loans, and credit card products; (3) fee
      income from currency exchange, international transfers, account management, and government bond
      investing; (4) treasury income from government bond portfolios at the NBU policy rate of 15% as of
      June 2026, which has been a significant profitability driver across the Ukrainian banking sector since
      2022; and (5) growing SME and FOP (individual entrepreneur) banking fees as Universal Bank targets
      18,000 legal entities and 450,000 FOPs by year-end 2026.

      At the technology layer, Fintech Band earns revenue primarily from technology service fees from
      Universal Bank for developing and operating the monobank platform, supplemented by ACDC payment
      processing fees and adjacent tech product revenues (Expirenza, market by mono, Base by mono,
      Loyalty.ai). The intercompany fee formula between Universal Bank and Fintech Band is not publicly
      disclosed; the structure implies Fintech Band's revenue is tightly correlated with Universal Bank's
      card and lending volume growth, creating single-client revenue concentration risk.

      Unit economics at both the banking and tech-operator levels are undisclosed. No public data exists
      for net interest margin (NIM), customer acquisition cost (CAC), lifetime value (LTV), payback period,
      or cohort profitability. A rough tech-operator revenue proxy can be inferred: Fintech Band's ~$89.6
      million FY2024 revenue divided by approximately 8 million estimated active users yields approximately
      $10–12 per user per year at the tech-operator layer — but this figure excludes Universal Bank's own
      NII-driven revenues and may overstate per-user economics if a portion of Fintech Band's revenue is
      unrelated to monobank retail. Ukraine's non-cash transaction share reached 94.6% by volume in 2024,
      and monobank's 4.9-rated app sustains the highest NPS in the Ukrainian banking sector, supporting
      volume-driven interchange and fee revenue growth even in a flat-to-modest macro environment.
