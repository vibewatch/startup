  evidenceGaps:
    - type: missing-source
      severity: material
      topic: Consolidated monobank segment P&L
      missingEvidence: >-
        A consolidated income statement covering both the banking (Universal Bank) and technology
        (Fintech-IT Group) layers attributable to the monobank product, with a disclosed revenue and
        cost allocation methodology.
      whyItMatters: >-
        Without a consolidated P&L, blended unit economics, true CAC and LTV, and the profitability of
        the monobank brand as a unified product cannot be assessed from public sources.
      diligencePath: >-
        Request management accounts from both entities; ask for a management-prepared monobank product
        P&L with intercompany cost allocation assumptions and a reconciliation to each entity's statutory
        accounts.
      relatedQuestionRefs:
        - QI010
        - QI025
      relatedTableRefs:
        - TI005

    - type: missing-source
      severity: material
      topic: Universal Bank NIM and loan book composition
      missingEvidence: >-
        Universal Bank's net interest margin, loan-to-deposit ratio, consumer versus SME versus corporate
        loan split, provision coverage ratio, and NPL ratio by segment.
      whyItMatters: >-
        NIM and NPL are the two most important credit quality and profitability metrics for a bank; without
        them, the UAH 2.59 billion profit figure cannot be stress-tested against credit cycle deterioration.
      diligencePath: >-
        Request Universal Bank's full IFRS quarterly accounts (available in Ukrainian on the bank's
        website per statutory obligation); commission a translation of key income statement and balance
        sheet items. Request NPL schedule from management.
      relatedQuestionRefs:
        - QI011
        - QI025
      relatedTableRefs:
        - TI003

    - type: stale
      severity: material
      topic: Fintech Band FY2025 full-year results
      missingEvidence: >-
        Fintech Band LLC FY2025 statutory accounts and, if available, Fintech-IT Group consolidated
        management accounts, to determine whether the FY2024 revenue decline was one-time or structural.
