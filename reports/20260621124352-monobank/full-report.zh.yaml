      - number: '3.3'
        title: 移动 UX 与产品能力对比
        blocks:
          - type: paragraph
            body: >-
              移动用户体验是 monobank 最清晰领先的轴线。截至 2026 年 6 月，它在 Apple App Store（910,000+ 条评分）和 Google Play（113 万条评价）均为 4.9 星，高于
              Privat24 在 Google Play 的 4.8，反映在一个规模更小但更集中于数字优先乌克兰人的客户基础中，每用户参与更热烈。Privat24 App 服务更大人群（1900 万+ 客户），评分略低，说明
              PrivatBank 的绝对规模和产品复杂度稀释了每用户 UX 一致性。

              产品广度是 PrivatBank 和 Oschadbank 借结构性优势竞争的地方。PrivatBank 提供 LiqPay、PrivatMoney 国内与国际转账、「Envelopes」目标储蓄（年化
              5%）、消费和抵押贷款、青少年账户（6 岁起）以及 SWIFT。Oschadbank 擅长实体现金获取、受储蓄保护的存款和政府支持抵押贷款（eOselia 40% 项目份额）。monobank 则用 UX
              细节做差异化：一键 FOP 注册、Shake2Pay、10 秒取消付款、Banka 募资平台（处理 UAH 100B）、群组费用拆分、eSIM，以及通过 Diia 的 QES 数字签名。这些功能加快开户速度（最快
              99 秒发卡），并在不需要网点的情况下培养忠诚度。

              信贷方面，monobank 的分期市场（与 KTC、Citrus、MOYO、Foxtrot 的先买后付合作）、「Until Tomorrow」小额贷款，以及最高 UAH 200,000 的信用额度，直接对标
              PrivatBank 的「Payment by Parts」和最高 UAH 500,000 的现金贷款。PrivatBank 更高的信贷上限（UAH 500k 对 monobank 的 UAH
              200k）对较大个人信贷需求更有优势。

              monobank 于 2026 年 6 月取消所有 SWIFT 汇出和汇入佣金——这是一次直接削弱 PrivatBank 跨境服务优势的产品追平。Apple App Store 版本说明明确把「ПРИБРАЛИ
              SWIFT-КОМІСІЇ」（已取消 SWIFT 费用）列为近期更新。2026 年 6 月，从乌克兰 App Store URL 无法访问 Raiffeisen 和 OTP App 数据（HTTP
              404），限制了直接评分比较；NBU 档案确认两者仍具偿付能力且具有系统重要性，但不提供 UX 指标。
