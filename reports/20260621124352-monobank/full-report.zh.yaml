  - id: FM001
    title: 市场规模测算框架（金字塔）
    type: pyramid
    layout: standard
    summary: 乌克兰零售数字银行的三层市场规模框架：TAM 由战争调整后的成年人口约束，SAM 由智能手机和数字意愿渗透率约束，SOM 由 monobank 当前注册用户基数约束。
    data:
      nodes:
        - id: tam
          label: TAM — 成年银行服务总人口（22–28M）
          detail: 乌克兰任何零售银行可触达的成年人口，经战时移民调整（估计 6–8M 人流离海外）。区间：22–28 百万人。由战前成年人口（约 33M）减去移民估计得出。
        - id: sam
          label: SAM — 智能手机驱动的数字银行用户（13–18M）
          detail: >-
            拥有智能手机且愿意只用移动端办理银行业务的成年人。受智能手机渗透率（战前约 75–80%）、非现金银行卡采用率（94.6%）和数字身份接入（Diia/BankID）约束。2024 年 BankID 身份认证
            87.7M 次。
        - id: som
          label: SOM — monobank 可获取客户（当前 10.3M / 目标 11M+）
          detail: >-
            在竞争强度（PrivatBank、Oschadbank、Raiffeisen）和品牌渗透率下，monobank 可现实拿下的客户量。当前：10.3M 注册用户（2026 年 6 月）；2026
            年目标：Universal Bank 口径下 10.7M 零售用户 + 450K FOP。
    approximationNotes: >-
      TAM 由乌克兰 2021 年基于人口普查的成年人口（约 33M）减去移民 / 流离失所估计（约 5–11M，取决于来源）估算，而非已发布的银行业专属 TAM。SAM 用智能手机渗透率（约
      75–80%）和非现金采用率（94.6%）作为数字银行意愿的代理。SOM 是唯一有一手来源数据支撑的锚点（Google Play 和 Apple App Store 自报，2026 年 6 月）。没有独立分析机构发布乌克兰
      neobank TAM。
