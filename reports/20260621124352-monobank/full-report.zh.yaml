  - id: FU001
    title: 客户旅程地图 — monobank 细分路径：从发现到参与
    type: journey-map
    layout: wide
    summary: monobank 客户旅程从移动 App 发现和低摩擦 KYC 起步，再分流到零售深度（信贷、存款、OVDP）、FOP / 企业银行和 Banka 社群参与路径，每条路径都有不同的留存循环。
    data:
      nodes:
