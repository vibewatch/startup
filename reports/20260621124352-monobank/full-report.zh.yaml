      - number: '6.5'
        title: App Store 评分、UX 评论与服务体验
        blocks:
          - type: paragraph
            body: >-
              monobank 在 App Store 获得 910,000 条评分、4.9 星，是乌克兰按评论量计算评分最高的银行应用。截至 2026 年 6 月，Google Play 列表也显示 1.13 million
              条评论、4.9 星，说明跨平台情绪一致，且用户群会主动参与评论机制。2026 年 6 月 15 日发布的 version 8.16（研究日前六天）取消所有用户类型收发国际付款的 SWIFT
              费用，显示产品仍在积极迭代。开发者（Universal Bank | Monobank）在 Google Play 积极回复用户评论，是可见的社区参与信号。

              顶部评论中的负面客户信号具体且对尽调有意义。评论者 John Smith（Google Play，2026 年 6 月 5 日）明确把 monobank 从 5 星降到 3 星，原因是：（1）缺少使用
              authenticator apps 的正规双因素认证（只有 SMS / app 内 2FA）；（2）缺少展示近期登录的会话可见性功能。该评论被其他用户标记为有帮助，反映出一个安全 UX
              缺口；安全意识较强的用户，尤其是处理企业交易的 IT 专业人士和 FOP 用户，会把它视为有意义的缺陷。评论者 Sergey Surazhskyi（2026 年 1 月）也给出 3 星，批评强制迁移到
              monobank 2.0 UI 设计且无法保留旧界面，同时指出与竞争对手相比 monobank 的转账限额和费用仍「可接受」——并尖锐提及 CEO Gorokhovskyi 公开反对 Revolut 的立场。

              客户支持通过 messenger 和电话 24/7 提供，公司称其为「客户关怀团队」。NBU 银行业审查指出，乌克兰银行业在战时期间保持了数字服务连续性，印证了 monobank
              对服务可用性的说法。公开资料没有披露投诉解决时间、首次联系解决率或升级量指标。
