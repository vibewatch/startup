      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              monobank 服务乌克兰零售数字银行市场中的五类主要买方 / 用户群。这些群体在工作流、预算归属、采用触发因素，以及对 Universal Bank 和 Fintech-IT Group
              的收入贡献上彼此不同。

              大众零售（受薪员工和城市消费者）：这是 monobank 最大、也是根基最深的客群——此前使用网点银行、后来因免手续费支付卡、返现项目和 P2P
              转账转向移动银行的个人。主要采用触发因素是朋友或同事推荐叠加雇主工资入账。monobank 长期保持乌克兰银行业最高净推荐值，确认该客群留存强。

              自由职业者和个体经营者（FOP）：乌克兰有庞大的自雇群体，他们出于税务目的注册为自然人企业家（Фізична особа-підприємець / FOP）。FOP 可在 monobank App
              中同时管理个人和业务账户，免佣金向养老金基金缴纳 FOP 社会缴款，并使用业务网页柜台报税。Universal Bank 2026 年 450,000 名 FOP 的目标，代表该客群近期对注册用户贡献的上限。

              使用 ACDC 收单的 SME：Fintech-IT Group 子公司 ACDC Processing 让数万家乌克兰 SME 能通过 Visa 和 Mastercard 通道以及 PCI DSS
              认证基础设施接受数字支付。Shake2Pay 让 HoReCa 商户通过 monobank 接受二维码支付。这些 SME 购买的是技术基础设施，而非直接购买 monobank App，但其交易在
              Fintech-IT Group 生态内产生交换费和收单收入。

              捐赠者与慈善 / 军事支持用户（Banka）：截至 monobank 主页 2026 年 6 月披露，Banka 募资平台拥有超过 160 万月活跃捐赠者，累计处理捐赠超过 UAH
              100B。该客群没有银行收入功能（捐赠不是存款），但拉动 App 参与度、NPS 和慈善品牌资产；在战时乌克兰，这种品牌资产异常强。

              侨民和流离失所的乌克兰人：估计 600–800 万乌克兰人因战争流亡海外，创造了跨境支付和汇款功能需求。monobank 2026 年 6 月宣布免费 SWIFT
              转账（汇入和汇出），直接解决这一客群的成本摩擦。侨民用户通常保留乌克兰账户，并使用 monobank 汇款、支持家庭和接收 VAT 退税。
