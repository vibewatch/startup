      - number: '6.2'
        title: 大众零售消费者、信贷用户与家庭账户
        blocks:
          - type: paragraph
            body: >-
              大众零售消费者是 monobank 最大、最面向公众的客户细分。开户为低摩擦进入而设计：下载 app 后，新用户在 Diia（乌克兰政府数字 ID app）、ID card、生物识别护照或外国护照中选择一种完成
              KYC。虚拟 Mastercard 卡即时发放；如需实体卡，由 Nova Poshta 配送。通过 Diia 注册的历史最快纪录为 99 秒。全数字 KYC 和零费用发卡，移除了传统网点银行最主要的进入门槛。

              消费信贷有三种形式：参与商户（包括 KTC、Citrus、MOYO 和 Foxtrot）提供的「Pokupka Chastynahy」分期付款，消费者零利息（商户出资）；可在任何商户使用的全球分期计划，包括
              AliExpress 和 Amazon；以及数分钟内放款、用于即时需求的「Do Zavtra」（Until Tomorrow）小额贷款。披露的最高授信额度为 UAH
              200,000。消费信贷用户显然是价值更高的客户群，具备重复还款行为；但注册用户中的信贷渗透率没有公开披露。

              UAH 和外币政府债券 (OVDPs) 可在 app 内购买，零售投资者免所得税，并明确传达支持军队的信息。这个产品细分服务财务参与度更高的用户，他们把 monobank 当作完整的储蓄和投资平台。USD 和
              EUR 货币账户服务 diaspora 和国际流动用户；version 8.16 取消汇入和汇出国际付款的 SWIFT 费用，进一步强化这一点。

              儿童卡和共享家庭账户功能覆盖家庭与青少年细分，提供支出类别的家长控制，以及对子女账户的共享可见性。用于国家支持项目的 Diia.Card
              将覆盖范围延伸到政府项目领取者。这些功能共同把可触达消费者基础从核心城市科技敏感人群向外拓宽；但这些子类别没有任何公开的细分账户数数据。
