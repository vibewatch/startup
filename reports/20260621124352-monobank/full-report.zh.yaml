              增强 3D Secure 把所有交易确认都导向 monobank app 推送通知通道，而不是 SMS OTP。它消除了 SIM-swap
              攻击，但也制造单设备脆弱性：注册手机丢失或无法访问，会让无网点银行进入没有物理兜底的访问死锁。
