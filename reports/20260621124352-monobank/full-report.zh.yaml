      - number: '7.5'
        title: 网络、App 安全与运营连续性风险
        blocks:
          - type: paragraph
            body: >-
              monobank 完全通过移动和网页应用运营，没有网点作为安全垫。monobank.ua/security 页面披露的安全架构包括 PCI-DSS 合规、增强型 3D Secure 认证（通过 App
              而非短信）、原生移动操作系统安全机制（iOS 和 Android 底层）、生物识别认证（Fingerprint、Touch ID、Face ID）、TLS 1.2 加密、App
              内协议电子数字签名、反欺诈监控和反黑客异常检测。ACDC Processing 还持有 Visa、Mastercard 认证，以及支付处理基础设施的 PCI-DSS 认证。

              但公司没有发布独立第三方安全审计、渗透测试披露、漏洞赏金计划记录或 SOC 2 等效报告。对一家拥有 1000 多万客户账户、并通过其收单网络处理乌克兰多数非现金支付交易的银行而言，外部审计透明度缺失是重大缺口。

              应用商店用户评论暴露出一项持续安全抱怨：缺少基于时间的一次性密码（TOTP）/ 身份验证器 App 2FA
              选项。用户指出，重视安全的客户——尤其是持有大额余额或商业账户的客户——没有硬件无关的第二因素，会感到暴露在风险中。App Store 和 Google Play 评论数据均确认了这一设计选择，并带来残余钓鱼 /
              SIM 卡换绑风险。monobank 依赖 App 内推送确认，比短信 2FA 更安全，但对高价值账户而言并不等同于 TOTP。

              截至 2026 年 6 月，monobank 没有记录到重大公开披露的数据泄露或系统性宕机。访问 Downdetector.com 查询 monobank 特定宕机历史时返回
              404，意味着投资者无法获得结构化历史宕机公开数据。2022-2023
              年冬季，乌克兰已记录能源基础设施攻击带来的战时运营风险（停电）；银行业通过危机管理维持现金获取，但当互联网和移动网络基础设施中断时，纯数字银行面临独特的连续性挑战。
