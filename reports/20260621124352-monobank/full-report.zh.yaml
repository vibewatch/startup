      - number: '5.4'
        title: 安全、隐私与合规控制
        blocks:
          - type: paragraph
            body: >-
              monobank 公开安全页面列出八项技术控制。PCI-DSS：系统被描述为在卡数据流转所有阶段兼容 PCI-DSS。增强 3D Secure：交易确认走安全的 app 内通道，而不是 SMS，消除
              SIM-swap 和 SMS 拦截向量。Native Mobile Application：iOS 和 Android 版本采用原生底层 OS 安全机制，而非跨平台 web wrapper。Biometric
              authentication：Fingerprint、Touch ID 和 Face ID 用于用户数据加密和安全登录。TLS 1.2：所有面向互联网的通信使用强化 TLS 1.2。Qualified
              Electronic Signature (QES)：用于直接在智能手机上签署补充协议。Anti-fraud monitoring：拦截可疑交易和异常账户行为。Anti-hacker
              monitoring：侦测并拦截针对基础设施节点的端口扫描和网络攻击活动。

              App Store 数据安全披露显示，monobank 收集与用户身份关联的数据——Location、Contact Info、Contacts 和 Identifiers——并另行收集不与身份关联的 Usage
              Data 和 Diagnostics。iOS app provider 列为「UNIVERSAL BANK, PRAT」，确认受银行监管的实体持有 App Store 开发者账户，尽管版权由
              Kilobyte1024 持有。

              JSC Universal Bank 持有有效 NBU 银行牌照 No. 92（1994 年 1 月 20 日签发）。ACDC Processing 2021 至 2025 年被 NBU
              认定为重要支付基础设施运营商。Universal Bank 发布符合受监管银行透明度义务的财务报表。本轮研究没有在任何公开文件中找到独立 QSA 报告、渗透测试结果或第三方认证机构名录；PCI-DSS
              合规是官方安全页面的自我声明。
