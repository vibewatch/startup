      - number: '7.7'
        title: Kill Criteria、监控触发器与投资论点评估
        blocks:
          - type: paragraph
            body: >-
              持有 monobank 敞口的投资者必须设定清晰的论点失效阈值，一旦触发就重新评估或退出。投资论点建立在五个核心假设上：（1）Universal Bank 的偿付能力和牌照保持完整；（2）俄罗斯入侵不会升级到摧毁
              Kyiv 或 Dnipro 市区；（3）重建加速后，乌克兰消费信贷需求恢复；（4）Gorokhovskyi 和 Rohalskyi 不会因 PrivatBank 相关程序面临刑事风险；（5）Fintech-IT
              Group / Universal Bank 合作续约，或按有利于投资者的条款重组。

              每个假设都可以通过可观察的市场或监管信号监控。NBU 对 Universal Bank 的监管动作——包括资本充足率警告、牌照条件或正式执法——会直接对应论点（1）。前线军事地图和 UN/ICRC
              流离失所数据跟踪论点（2）。NBU 月度银行业综述跟踪零售信贷增长和不良贷款趋势，对应论点（3）。乌克兰法院记录和执法公告跟踪论点（4）。任何关于 Universal Bank 所有权变更、合作重谈，或
              Fintech-IT Group 自行申请银行牌照的公开公告，都对应论点（5）。

              monobank 的人员风险集中在两位创始人身上。Gorokhovskyi 是公众面孔和产品负责人；Rohalskyi
              负责技术和运营。公司没有公开披露继任计划、非创始人领导层厚度对应的组织韧性结构，或关键人保险。任何一位创始人离任或失去履职能力，都会给这个与创始人品牌高度绑定的产品带来急性运营和声誉风险。
