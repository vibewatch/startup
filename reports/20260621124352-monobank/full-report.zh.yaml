      - number: '4.6'
        title: 财务披露缺口与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              monobank 的双实体结构，加上两个实体都不是上市公司，也不是被要求以英文发布完整 IFRS 账目的受 EU 监管的机构，造成了全面的信息不对称，限制投资者仅凭公开资料完成承销判断。

              第一，公开市场没有 monobank 或 Fintech-IT Group 的合并 P&L。Universal Bank 向 NBU 报告的财务数据覆盖整个银行实体，而非 monobank 产品线。Fintech
              Band 的法定账目可在乌克兰商业登记库（YouControl、OpenDataUA）以原始乌克兰语申报文件形式获取，但没有经英文 IFRS 格式审计。本章引用的 FY2024
              收入和利润数字，来自乌克兰媒体对登记数据的报道，不是管理层确认的经审计账目。

              第二，英文监管档案完全缺失关键银行层面单位经济性指标：净息差、贷存比、Universal Bank 特定 NPL 比率、成本收入比和拨备覆盖率。NBU
              英文监管档案只发布资产、负债、权益和损益。所有细分页面均只有乌克兰语。

              第三，Fintech Band FY2024 收入和利润下滑（收入 –33%，净利润 –63%）是一个重大反向信号，却没有管理层公开解释。UMAEF 投资者沟通提到「基本面强劲、增长曲线高」，但没有回应同比下降。

              第四，截至 2026 年 6 月研究运行日，Universal Bank 和 Fintech Band 都未公开发布 FY2025 全年业绩，最新公开财务数据仍停留在 FY2024。2025 年 10 月
              UMAEF 投资逻辑与公开财务记录之间存在缺口，带来一个风险：管理层增长叙事可能依赖外部投资者无法获得的未披露 FY2025 数据。
