            body: >-
              Raiffeisen Bank International 已公开提示，因重组其俄罗斯和 CIS 敞口，正在考虑战略性退出乌克兰。若 RBI 退出，Raiffeisen Bank Ukraine 约 UAH
              265B 资产和大量城市专业客户基础将需要重组或出售。这对银行业信心是不利情景，但若服务连续性恶化，也可能为 monobank 创造重大获客机会。投资人应在 2026 年持续跟踪 RBI
