      - number: '1.4'
        title: 战时韧性、负面信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              自 2022 年 2 月俄罗斯全面入侵乌克兰以来，monobank 仍保持增长，这是它最醒目的运营事实之一。公司向 Fintech-IT Group 重组本因入侵而刻意推迟（结构优化让位于运营稳定），并于
              2024 年恢复，最终在 2025 年 4 月获得 AMCU 批准、2025 年 10 月宣布交易。Banka 捐赠平台既是产品差异点，也是战时韧性信号：160 万月活跃捐赠者、累计 UAH 100B
              捐赠，反映出该银行在战时与公民社会深度嵌合。

              关键负面信号包括：（1）PrivatBank 创始人关联——多名早期股东因与国有化相关的刑事调查离开，市场分析师猜测 UMAEF 交易可能部分服务于通过国际机构持股进行资产保护；（2）2024
              年收入和利润下滑（分别下降 1.5× 和 2.7×），说明业务还未进入直线增长轨道；（3）Stereo（波兰）和 Koto（英国）两个国际 neobank
              扩张项目均已搁置，增长叙事被限制在乌克兰国内市场；（4）通过 Hallstatt 和塞浦路斯控股载体的完整 UBO 链条，只能从公开记录中部分核验。

              NBU 将 Universal Bank 列为有偿付能力且具有系统重要性，资产 UAH 215.6B、权益 UAH 28.4B，2024 年利润 UAH 2.59B。截至 2026 年 4
              月，IVI-Rating 维持 Universal Bank 信用评级 uaAAA（投资级），展望稳定。2025 年一项关于乌克兰数字银行的学术研究确认，monobank App 在 2024 年下载量超过
              1000 万次，与公司自报客户数一致。这些监管和第三方数据点，为后续章节把 Universal Bank 财务画像作为事实基础提供了外部佐证。
