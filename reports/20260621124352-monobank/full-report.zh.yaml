  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础规模与细分概览
        blocks:
          - type: paragraph
            body: >-
              按注册客户数计算，monobank 是乌克兰最大的商业数字银行。截至 2026 年 6 月，它拥有超过 10.3 million 客户；Apple App Store、Google Play
              和公司英文主页披露的数字一致。UMAEF 官方新闻稿确认，2025 年 9 月客户数为 9.9 million，意味着从 2025 年 9 月到 2026 年 6 月的九个月里净增约
              400,000。Universal Bank CEO Iryna Starominska 公开设定的 2026 年底目标为 10.7 million 零售客户、18,000 家法人实体和 450,000
              个体经营者（FOP 账户），为评估获客动能提供前瞻锚点。公司入选 CNBC 全球前 35 家 neobank，以及自称拥有乌克兰银行业最高 NPS，用独立声誉信号补强了头部客户数。

              关键在于，monobank 没有公开区分注册客户和活跃交易用户。交易量提供了部分代理指标：2025 年前九个月处理 UAH 8.5 trillion 交易（Komersant Ukraine
              引用公司内部数据），意味着人均交易频率较高，符合许多客户把 monobank
              当作主银行而非副卡使用的情况。不过，注册账户中不活跃或休眠账户占比未知；公司也没有在本研究审阅的任何公开文件或新闻稿中披露月活、日活或卡使用率指标。

              客户分布在地理上集中于乌克兰。Stereo（波兰）和 Koto（英国）两个国际扩张项目目前均暂停，Scroll Media 对 CEO Gorokhovskyi
              的采访确认，当前战略焦点仍是乌克兰国内市场。乌克兰境内的区域拆分（例如按 oblast）没有公开披露。
