            title: 非现金迁移不可逆且具有结构性
            body: >-
              乌克兰 2024 年支付卡交易非现金占比达到 94.6%，不是战时异常，而是十年转型的结果；COVID-19 加速了它，战时需要又把它固定下来。对 monobank
