      - number: '8.5'
        title: 建议、信心与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              相对公开来源可支持的证据基础，Fintech-IT Group 的 $1 billion 估值偏紧。11× EV/FY2024 Revenue 倍数对一家高增长 fintech
              软件公司并非天然过高，但它套用在一家最近披露年度收入双位数收缩、位于活跃战区、合并财务不透明，并依赖单一受监管银行合作伙伴贡献超过 90% 收入的公司上。约 $101 的单客户价值是本次调研所有可比
              neobank 中最低的，战时折价和实体结构约束可以解释这一点，但它也掩盖了战后、IPO 后情景中的潜在不对称上行。

              建议为“跟踪”：保持监控，暂不立即部署资本。“跟踪”立场反映出对公司竞争位置和长期潜力的中等信心，同时承认仅靠公开来源很难完成财务承销。如果出现以下情况，信心可转向
              “买入”：（a）可获得经审计的合并管理账目，证明收入恢复且 FY2025 盈利强劲；（b）可信的美国 IPO 时间表公布；（c）PrivatBank 法律阴影正式解除；（d）战后重建论点实质推进。

              本章列出的具体尽调要求包括：覆盖 Fintech Band 和 Universal Bank 的 FY2024、FY2025 完整合并管理账目；公司间收费协议的详细拆分；经审计的 FY2025 Fintech
              Band IFRS 报告；UMAEF 后的股权结构表（包括 UMAEF 财团完整构成和总持股）；以及 UMAEF
              投资协议中的锁定条款、优先权结构和反稀释条款。这些是从“跟踪”论点转向“买入”论点所需的最低信息集。
