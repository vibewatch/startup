  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 消费者产品套件与 UX 架构
        blocks:
          - type: paragraph
            body: >-
              monobank 的消费者产品套件以移动优先设计为核心，可在两分钟内完成开卡。通过乌克兰政府数字身份应用 Diia，最快纪录为 99 秒。下载后，用户可选择 Diia、ID card、生物识别护照或外国护照完成
              KYC；虚拟 Mastercard 卡即时发放，实体卡可选择由 Nova Poshta 配送。App Store 有 910,000 条评分，平均 4.9 星，按评分量计算是乌克兰评分最高的银行
              app；Google Play 上 package com.ftband.mono 也显示产品仍在线且持续维护。

              app 集成多类金融工具：支付卡（包括 Black、White 和 Iron 版本）、USD 和 EUR 货币账户，以及三类消费信贷产品——参与商户提供的「Pokupka
              Chastynahy」分期付款，消费者零利息（由商户付费）；可在 AliExpress 和 Amazon 等商户使用的通用全球分期计划；以及数分钟内放款的「Do Zavtra」（until
              tomorrow）小额贷款。政府债券 (OVDPs) 可用 UAH 和外币购买，对零售投资者免所得税，并明确以支持军队为营销点。UAH 与外币存款，以及用于个人和慈善筹款的「Banka」储蓄罐，构成储蓄层。

              UX 差异化包括个性化猫头像 monocat，以及收款时独特的呼噜提示音。Shake2Pay 让两部近距离手机通过摇一摇转账，无需交换卡号。Group Expenses
              自动在联系人间拆分账单并发送付款提醒。eSIM 购买和管理（Kyivstar、Vodafone、lifecell、Airalo）可在 app 内完成。MTPL、Green Card
              和车险可在数分钟内购买，并对汽车和加油站消费返现。二手商品市场 market by mono 集成在 app 内，将功能边界从纯银行拓展出去。

              研究日前六天发布的 app version 8.16，取消了国际付款汇入和汇出的 SWIFT 费用，消费者和企业用户均适用。App Store 版权由 Kilobyte1024（ТОВ
              "Кілобайт1024"）持有；它是 Fintech-IT Group 内负责 2023 年 monobank 2.0 app 改版的实体。
