      - number: '4.5'
        title: 资本结构、充足性与战时银行业背景
        blocks:
          - type: paragraph
            body: >-
              Universal Bank UAH 28.4 billion（约 $634 million）的权益基础，在乌克兰战时银行业格局中提供了相当厚的资本缓冲。NBU
              将其归类为具偿付能力且具有系统重要性，意味着它满足并受到更高资本充足率、流动性和恢复计划要求约束。IVI-Rating 给出的 uaAAA 国内信用评级（稳定，2026 年 4
              月）印证了短期财务稳健性；但这是乌克兰国内评级尺度，不能直接与 S&P、Fitch 或 Moody's 的国际评级相比。

              行业层面，VoxUkraine 分析确认，乌克兰银行业在全面战争爆发前资本充足率约为风险加权资产的 21%，远高于 NBU 最低要求；到 2023 年 3 月，CAR
              已恢复至这一水平。不过，行业不良贷款率战前处于下降通道，2022 年 2 月后开始上升，反映出 NPL 确认递延和战事相关信用损失，尤其集中在前线和被占地区的按揭与 SME
              敞口。银行对私营部门贷款按实际值较战前下降约 30%，银行更偏好在 NBU 政策利率较高时持有低风险政府债券。Universal Bank 的具体 NPL 比率没有在英文监管档案页披露。VoxUkraine
              还提示银行业可能面临 windfall tax，指出政府债券 carry 带来的高利润可能触发财政政策动作。

              截至 2026 年 6 月 18 日，NBU 将关键政策利率维持在 15%，自 2026 年 1 月以来未变。IMF 2025 年 11 月就 $8.1 billion、48 个月 EFF
              达成工作人员层面协议；乌克兰国际储备约 $54.8 billion（截至 2026 年 3 月，覆盖约 5.7 个月进口），共同锚定宏观金融稳定。World Bank 估计未来十年乌克兰重建成本约 $588
              billion；对任何暴露于受战事影响抵押品和借款人的乌克兰银行而言，信用风险不确定性仍会持续。

              Fintech-IT Group 的资本状况透明度更低。UMAEF 投资（Forbes Ukraine 估计约 $18.55 million，按 $1 billion 估值对应约 1.9%
              股权）是一轮成长股权融资，资金用于 SME 产品开发和扩张。Fintech-IT Group 或 Fintech Band 没有公开披露现金余额、现金消耗率或资金跑道指标。Fintech-IT Group 和
              Universal Bank 都曾表示希望在美国交易所 IPO，但没有确认时间表或申报安排。
