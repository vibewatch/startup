        - id: war-risk
          label: 战争风险：冲突活跃、地缘政治存在生存级不确定性、单一市场
          detail: 乌克兰自 2022 年 2 月起遭遇全面入侵；截至 2026 年 6 月前线仍活跃
          tone: negative
        - id: opacity
          label: 不透明：没有合并 IFRS 账目；关联公司费用未披露；股权结构私有
          detail: 阻断尽调的缺口；无法做财务承销；IPO 时间线不清晰
          tone: negative
        - id: recommendation
          label: 建议：TRACK——监控但不部署资本
          detail: 重估为买入需要：经审计的 FY2025 复苏 + IPO 申报 + PrivatBank 法律问题解决
          tone: neutral
      edges:
        - from: market-position
          to: recommendation
          label: 支撑
        - from: product-proof
          to: recommendation
          label: 支撑
        - from: financials
          to: recommendation
          label: 约束
        - from: valuation-anchor
          to: recommendation
          label: 约束
        - from: war-risk
          to: recommendation
          label: 约束
        - from: opacity
          to: recommendation
          label: 阻断尽调
    claimRefs:
