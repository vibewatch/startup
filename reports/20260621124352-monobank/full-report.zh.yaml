              前 Fintech Band 股东 Yatsenko 和 Shmalchenko 在 PrivatBank
              国有化案件中收到刑事嫌疑通知后出让股权。尽管现任两位创始人（Gorokhovskyi、Rohalskyi）均未被公开牵连，缺少已发布法律意见仍形成二元风险：如果任一创始人收到刑事嫌疑通知，投资论点就会崩塌。机构投资者应把独立法律意见——覆盖
