            title: 高阶用户指出安全 UX 缺口
            body: >-
              2026 年 6 月和 2026 年 1 月两条不同 Google Play 评论把 monobank 评为 3 星（从 5 星下调），理由包括缺少 认证器 app 2FA、缺少会话可见性控制，以及强制迁移
              v2.0 UI。这些来自安全意识强、IT 专业用户队列 的信号有意义——这正是 monobank 在 FOP / 企业增长阶段需要留住的早期采用者。如果不处理，这些投诉可能削弱 monobank
              对安全敏感型小企业用户的转化。
            calloutType: risk
            claimRefs:
              - CU030
              - CU031
              - CU032
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 战争、地缘政治与宏观经济风险
        blocks:
          - type: paragraph
            body: >-
              自 2022 年 2 月以来，乌克兰一直处在俄罗斯全面军事入侵之下，前线战事延续到 2026 年 6 月。世界银行估算，未来十年重建总需求约 $588 billion，约为乌克兰 2025 年名义 GDP
              估计值的三倍。即便破坏如此严重，乌克兰银行业仍展现出罕见韧性：没有发生银行挤兑，存款自 2023 年 2 月起按名义值增长，资本充足率（CAR）到 2023 年 3 月已恢复至战前水平。NBU
              主动管控危机——紧急流动性支持、把利率上调至 25% 后再降至 15%、逐步放松资本管制——避免了系统性崩盘。

              对 monobank 而言，战争带来四类运营风险。第一，俄罗斯导弹和无人机袭击乌克兰电力与通信基础设施，会让这个无网点、完全依赖 App 的产品间歇性中断。第二，人员动员抽走工程人才；monobank
              已承认，未来几年人才短缺风险可能加剧。第三，如果前线形势恶化，Kyiv 或 Dnipro——monobank 两个办公室所在地——受到威胁，运营连续性将面临生死考验。第四，汇率和资本管制压缩投资退出窗口：尽管自
              2023 年以来管制已有部分放松，完全可兑换和跨境资本流动仍受限制。

              IMF 2025 年 11 月就新的 $8.1 billion、48 个月 Extended Fund Facility 达成员工级协议，降低了主权融资风险，但没有消除风险；NBU 2026 年 6
              月决定把关键政策利率维持在 15%，传递的是谨慎稳定信号。乌克兰 2025 年 GDP 增长预计为 2%（低于 2024 年的 2.9%），反映出持久入侵压力。宏观减速会直接压缩消费信贷需求，并推高信用损失率，给
              monobank 收入带来二阶风险。
