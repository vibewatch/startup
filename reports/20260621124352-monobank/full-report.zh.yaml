      - number: '6.6'
        title: 留存证据、反向信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              monobank 公开可得的留存证据完全基于代理指标。唯一可交叉验证的持续参与指标包括：Banka 1.6 million 月捐赠者（意味着一部分忠诚用户存在重复行为）；910,000 条 App Store
              评分和 1.13 million 条 Google Play 评论（意味着用户参与度足够强，愿意主动评价 app）；以及 2025 年前九个月 UAH 8.5 trillion
              交易量（意味着单账户交易强度高）。这些都不是直接留存指标。

              关键反向证据缺口，是本研究审阅的任何公开来源都没有披露 NRR、GRR、流失率、月活率或队列留存曲线。monobank 根据 UMAEF 新闻稿和 Interfax Ukraine 文章声称拥有乌克兰银行业最高
              NPS，但 NPS 测量的方法、样本量和审计机构没有公开记录，无法独立验证。Universal Bank 的 NBU 监管档案显示财务稳健（UAH 215.6 billion 资产、UAH 28.4
              billion 权益、2024 年 UAH 2.59 billion 利润），但没有把 monobank 特定的存款留存、卡注销率或活跃卡数量从更广泛的 Universal Bank 组合中拆出。

              另一个反向信号是战时人口结构迁移：自 2022 年 2 月以来，数百万乌克兰人在境内流离失所或移居海外，monobank
              注册用户基础中可能有一部分已经休眠，或把主银行关系转向所在国本地机构。乌克兰数字银行学术研究确认，monobank 2024 年下载量超过 10
              million，与注册用户数一致；但下载量不能证明活跃使用。VoxUkraine 对乌克兰银行业战时韧性的分析指出，截至 2024 年中，存款增长是「名义上」的，部分由军人工资流入驱动；这可能解释
              monobank 的部分获客和交易量，而非有机零售采用。Banka 捐赠活动集中在国防和人道领域，也带来战时依赖风险：如果停火条件降低军事筹款紧迫性，1.6 million 月捐赠者和相关留存回路可能走弱。
