            body: >-
              Fintech Band FY2024 法定账目显示，收入较 FY2023 下降 33%，净利润下降 63%。UMAEF 2025 年 10
              月投资新闻稿称该集团「基本面强劲、增长曲线高」，却没有回应这些同比下滑。可能原因——关联方合同重组、战时需求走弱、MOSST 收购成本或收入重分类——均未公开解释。对 Fintech-IT Group 或
