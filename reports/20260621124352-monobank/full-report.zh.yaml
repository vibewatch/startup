  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              monobank 的相关市场是乌克兰零售数字银行——具体是通过移动优先应用，向乌克兰居民和侨民交付消费者支付账户、个人信贷、存款、P2P 转账和相邻数字金融服务。该市场明确排除传统网点银行（monobank
              的设计原则就是替代它）、公司机构贷款和跨境 neobank（Revolut、Wise），因为 NBU 牌照要求和 UAH 转账限制，使国际 neobank 无法为乌克兰居民复制 monobank 的完整产品组合。

              乌克兰银行业进入相关时期时结构稳健，但信贷受压。2022 年资产 / GDP 约为 40%——与罗马尼亚相当，但远低于波兰或匈牙利——反映历史欠发展和 2014 年后整合。NBU 在 2015 至 2022
              年间通过资本充足率执法，将运营银行数量削减约一半，使系统 CAR 从 2015 年底的 12.3% 提高至 2021 年 11 月的 21%。由 PrivatBank 和 Oschadbank
              领头的国有银行约占行业净资产的 50%，该份额自 2017 年以来保持稳定，是商业 neobank 在机构和工资银行业务中面临的最大单一竞争约束。

              相邻市场包括：SME 数字银行（FOP 账户和 ACDC 收单）、通过 Banka 平台进行慈善募资、汇款和跨境支付通道（截至 2026 年 6 月 SWIFT 已免费），以及车险、eSIM、政府债券等嵌入式
              fintech 产品。这些相邻业务纳入 monobank 相关市场，因为它们在同一个 App 内提供，并贡献收入多元化和用户黏性。
