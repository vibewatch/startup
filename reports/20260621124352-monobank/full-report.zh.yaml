      - number: '6.3'
        title: FOP / 个体经营者与 SME 渠道
        blocks:
          - type: paragraph
            body: >-
              FOP / 个体经营者细分以「FOP mono」品牌营销，是 monobank 最具商业差异化的增长目标。产品围绕速度和零直接成本设计：既有 monobank 消费者持卡人开户只需九次点击，最快纪录为 13
              秒。开户费、维护费、IBAN 转账和绑定借记卡费用均为 UAH 0。每月最高 UAH 50,000 可通过转入持有人个人 monobank 账户免费提现。

              FOP 用户的产品包包括 USD 和 EUR 货币账户、用于业务线隔离的第二个 hryvnia
              活期账户、用于育儿假和病假工资发放的社会支付账户、按电话号码授权会计且最多支持十个关联联系人，以及用于桌面会计流程的私有 web cabinet。FOP 收单选项（「plata by mono」）提供 POS
              终端、SoftPOS（手机即终端）、面向网站和支付链接的互联网收单，以及 QR 码立牌方案。乌克兰发卡商户佣金 1.3%、24 小时结算，对微型企业主和小型线上商户有吸引力。

              UMAEF 新闻稿和 Scroll Media CEO 采访均提到，monobank 技术让乌克兰「数以万计的中小企业 (SMEs)」能无缝接受数字付款。Universal Bank CEO Iryna
              Starominska 提出的 2026 年 450,000 个体经营者目标，是唯一公开量化里程碑；当前 FOP 账户中间数量没有披露。关于乌克兰数字银行的学术研究印证了 SME 数字化趋势：2024
              年，企业家在 Affordable Loans 5-7-9% programme 下获得超过 16,000 笔贷款，总额超过 UAH 62 billion，显示 monobank 正进入的数字 SME
              融资市场规模。monobank 的 FOP 账户在乌克兰整体 FOP 银行市场中的份额没有公开资料。
