      - number: '3.5'
        title: 护城河耐久性、锁定与竞争风险
        blocks:
          - type: paragraph
            body: >-
              monobank 的竞争护城河建立在三项相互强化的优势上：（1）移动原生 UX 和数字优先一代的品牌忠诚度，体现在 4.9 星 App 评分和 1030
              万注册客户；（2）零网点成本结构，使其可比网点密集型同行提供更高返现、免费转账和更好存款利率；（3）Banka 募资平台，已处理超过 UAH 100B 捐赠，并把 160 万月捐赠者连接到 1,300+
              家慈善机构——创造出 PrivatBank 国家 Charity 服务无法完全复制的社会使命身份。

              护城河面临四项重大威胁。第一，PrivatBank 的客户规模和国家背书，为风险厌恶型乌克兰人带来隐性存款安全优势：国有银行存款带有超出正式 Deposit Guarantee Fund（DGF，覆盖所有银行最高
              UAH 600,000）的主权担保含义。第二，Oschadbank 的 1,150 家实体网点网络服务于前线和农村地区无法稳定使用数字银行的人群——这是 monobank
              没有网点就无法服务的客群。第三，Raiffeisen Bank International 已公开提示其乌克兰业务存在战略不确定性；若退出，客户基础受扰动可能让 monobank
              通过钱包份额提升受益，但也可能引发私人银行业更广泛的信心担忧。第四，战时断电和互联网中断会周期性打断纯数字银行访问。

              转换成本中等：monobank 接入 Diia 的 KYC、绑定 FOP 账户、Banka 罐子历史和定期付款自动化，形成有意义的留存摩擦；但 PrivatBank
              在工资入账中的主导地位（许多乌克兰雇主把工资打入 Privat24 账户）让 PrivatBank 在收入流入端拥有对称锁定。多栖普遍存在——许多乌克兰人同时持有 PrivatBank 和 monobank
              卡，因此钱包份额而非客户数量才是相关竞争指标。

              战争期间，乌克兰银行业展现出异常韧性：没有发生银行挤兑，且自 2023 年 2 月以来存款名义增长保持正值。这种稳定性是行业层面对新进入者冲击的护城河，但不能把 monobank 与既有银行区分开。
