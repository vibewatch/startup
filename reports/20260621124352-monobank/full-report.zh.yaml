            title: PCI-DSS 自我声明缺少独立审计确认
            body: >-
              monobank 在安全页面公开声明兼容 PCI-DSS，但本次研究没有在任何公开文件中找到 Qualified Security Assessor 报告、认证机构名录或渗透测试摘要。投资者应在尽调中要求提供
