      - number: '3.4'
        title: SME 与 FOP 商业银行
        blocks:
          - type: paragraph
            body: >-
              小企业（FOP/SME）银行是一个新兴竞争维度，monobank 正在追赶依赖网点的既有银行。monobank 推出了一键 FOP 注册、私人网页会计柜台、用于商户收单的 ACDC processing（持有
              Visa、Mastercard 和 PCI DSS 认证），以及社保支付支持（养老金基金、工资提现），使其成为传统商业账户的可信替代。

              PrivatBank 作为乌克兰主导公司和商户银行，通过 250,000+ 台 POS 终端网络处理多数 POS 支付，并向 SME 提供 SWIFT、工资和贸易融资。其 Privat24 for
              Business 产品接入乌克兰工资基础设施和工资卡体系。Oschadbank 2024 年发放 UAH 14.5B 新商业贷款，其中 30% 通过合作项目发放，利率从年化 0.01% 起，并积极参与国家补贴
              Affordable Loans 5-7-9% 项目——该项目 2024 年向企业家投放超过 UAH 62B。Oschadbank 还在大型企业能源项目融资中持有 30% 市场份额。

              Raiffeisen Bank Ukraine 和 OTP Bank Ukraine 是中层 SME 贷款机构，拥有较强贸易融资和 SWIFT 能力，对乌克兰出口商或有欧洲交易对手的企业有用。

              monobank 在 SME 上的竞争缺口具有结构性：国家补贴贷款项目（5-7-9%、eOselia）和 Affordable Loans 担保计划主要由 PrivatBank 和 Oschadbank
              在财政部安排下管理。公开披露中，monobank 并未显著参与这些补贴性国家贷款项目，限制了它为寻求信贷的 SME 客户在利率上竞争的能力。NBU 未公开按银行拆分的精确 SME 贷款市场份额；这是评估
              monobank FOP 渗透深度的重大证据缺口。
