      - number: '8.3'
        title: 可比公司分析——全球与新兴市场 Neobank
        blocks:
          - type: paragraph
            body: >-
              将 Fintech-IT Group 与全球 neobank 同行和上市数字银行公司对标，可为 $1 billion 锚点提供关键背景。比较会受到实体差异干扰——Fintech-IT Group
              收入基础纯粹来自技术费，而 Nu Holdings、Revolut、Monzo 等同行合并了银行和技术收入——但仍能照出估值常态。

              Nu Holdings（NYSE: NU）是最直接可比的上市公司（巴西数字银行，在巴西、墨西哥和哥伦比亚拥有 1 亿+客户）。按 Yahoo Finance，2026 年 6 月 Nu 市值约 $61.8
              billion。峰值时，Nu 约达 $81.1 billion（2026 年 2 月）。FY2024 收入 $11.5 billion（同比增长 43.4%），Nu 按滞后收入交易约 5.4×。按 Yahoo
              Finance，其 PE 比率约为 19.6×（TTM）。Nu 客户基础大得多、更多元，且处在稳定监管环境中，因此与 Fintech-IT Group 的直接对比并不完美。

              Revolut 是欧洲估值最高的 neobank，2024 年 7 月二级股份出售时估值约 $45 billion，按当时约 4500 万用户计算，约为每客户 $1,000。Revolut 于 2026 年 4
              月向 UK Companies House 提交完整 2025 年账目，确认仍持续运营。其单客户价值相对 Fintech-IT Group 的显著溢价，来自 Revolut 的多国规模、UK
              银行牌照和多元收入流（加密、股票交易、高级订阅）。UK 消费 neobank Monzo 已向 UK Companies House 提交年度账目，并在 2024–2025 年二级市场交易中估值约 £4–5
              billion（~$5–6 billion），按约 900 万 UK 账户计算，约为每客户 $556–667。

              德国 neobank N26 披露 FY2024 收入约 €440 million（约增长 40%），并在 2024 年第三季度首次实现季度经营利润（€2.8 million）；德国监管机构 BaFin
              取消获客上限后，N26 每月新增 200,000+ 客户。N26 上一次公开估值约为 2021 年的 $9 billion，因此当前 P/Revenue 比较并不可靠。澳大利亚 B2B 支付公司
              Airwallex 据报正洽谈以 $6 billion 估值融资 $200 million，拥有 100,000 个企业客户，说明 B2B fintech 基础设施可以获得显著估值溢价。

              可比样本一致显示，Fintech-IT 每客户隐含 $101
              相比西方同行大幅折价。部分折价有合理性：乌克兰是受战争影响的单一市场，退出流动性薄；技术运营实体只赚软件费，而不是完整银行利差；披露不透明阻碍严谨承销。它也反映了投资者在停火和 IPO
              情景下持有到后续阶段的潜在上行。
