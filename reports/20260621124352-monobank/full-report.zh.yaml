      - number: '4.3'
        title: Fintech-IT Group 与 Fintech Band 的收入和盈利能力
        blocks:
          - type: paragraph
            body: >-
              Fintech Band LLC（Fintech-IT Group 内的核心实体）披露 FY2024 收入 UAH 3.71 billion，按采用的 UAH/USD 汇率折算约 $89.6–92.4
              million。同年净利润 UAH 1.15 billion（约 $28.6 million），对应净利率约 31%。对一家技术服务公司来说，这是极高的利润率；它与 monobank
              架构所支撑的轻资本、零网点、软件即基础设施模式相匹配。Fintech-IT Group 2024 年合并收入约 90% 来自 Fintech Band，剩余约 10% 来自 ACDC
              Processing、Shake to Pay/Expirenza、Kilobyte，以及 2024 年从瑞士银行 CBH 收购的 MOSST。

              不过，FY2024 业绩较 FY2023 明显恶化：收入约下降 1.5 倍（33%），净利润约下降 2.7 倍（63%）。这是一个关键反向信号，管理层尚未公开回应。UMAEF 2025 年 10 月新闻稿称
              Fintech-IT Group「基本面强劲、增长曲线高」，但没有提及 2024 年下滑。Scroll.media 在 2025 年 11 月对 CEO 的采访讨论了 UMAEF 投资和公司重组，却没有给出
              FY2024 业绩背景。可能解释包括战时需求走弱、从 Fintech Band 过渡到 Fintech-IT Group 时的关联方合同重组、一次性 MOSST 收购成本，或部分收入项目重分类。没有 FY2023
              可比账目和经审计的 FY2024 IFRS 报表，仅凭公开资料无法归因。

              Fintech-IT Group 约有 630 名专业人员，其中约 400 名 IT 专业人员；按此计算，单员工收入约 $142,000/年。这个水平大体符合乌克兰 IT
              行业常态：开发者薪酬明显低于西欧和美国，但与波兰、罗马尼亚等区域同行相近。
