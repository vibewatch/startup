  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 实体分离与双重财务报告结构
        blocks:
          - type: paragraph
            body: >-
              任何 monobank 财务分析都必须从实体分离开始。两个不同法律实体产生收入并承载风险，但没有任何公开申报把它们合并。JSC Universal Bank（NBU 第 92
              号牌照）是银行实体，持有存款、发放贷款，并产生净利息收入、交换费和手续费类收入。其财务结果向 National Bank of Ukraine 报告，并以英文摘要形式出现在 NBU
              监管档案页面。Fintech-IT Group——原名 Fintech Band LLC 的 IT 控股公司——是技术运营方，开发并维护 monobank App、ACDC 支付处理平台和相邻 fintech
              产品。Fintech Band 的收入主要来自向 Universal Bank 提供软件开发和技术服务，另有 ACDC 支付处理收入，以及 Expirenza、market by mono、Base by
              mono、Loyalty.ai 等面向 SME 产品的收入。

              两个实体在经济上相互依赖，但法律上分离，董事会、所有权结构和监管框架各不相同。Universal Bank 由 Serhiy Tihipko 通过 TAC Group 持有；Fintech-IT Group 由
              Oleg Gorokhovskyi 和 Mykhailo Rohalskyi 作为受益所有人持有。monobank 品牌并不对应任何单一、公开披露合并财务的法律实体。任何把 monobank
              作为统一业务承销的投资人，都必须取得覆盖两个实体的未公开管理账，并记录 Universal Bank 与 Fintech Band 之间的公司间收费安排。本章始终保持这一区分：归因于 Universal Bank
              的财务指标（NBU 报告）只代表银行实体；归因于 Fintech Band 或 Fintech-IT Group 的指标只代表技术运营方。
