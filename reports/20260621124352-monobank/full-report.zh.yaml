      - number: '7.2'
        title: 银行层面的偿付能力、信贷质量与融资风险
        blocks:
          - type: paragraph
            body: >-
              monobank 的银行业务全部托管在 Universal Bank（JSC）内。Universal Bank 是一家私营、系统重要性机构，受 NBU 监管。截至 2026 年第一季度，Universal
              Bank 披露资产 UAH 215.6 billion、负债 UAH 187.1 billion、权益 UAH 28.4 billion、利润 UAH 2.59 billion。该行参加存款保障基金，并被 NBU
              归为有偿付能力。这些头部指标看起来稳健，但投资者必须区分银行层面风险和科技公司风险：Universal Bank 贷款账簿质量——包括 monobank 的无抵押消费信贷组合——没有单独披露。

              全面战争开始后，乌克兰银行业不良贷款率持续上升。VoxUkraine 基于 NBU 数据的分析指出，相比战前，行业贷款组合按实际值约下降 30%；只有在 NBU
              恢复全面资产质量审查（AQR）和韧性评估后，隐藏的不良贷款风险才会暴露。未来盈利预期还受“尚未暴露的不良贷款”拖累。monobank
              的产品包括无抵押分期信贷、短期“到明天”小额贷款和消费贷款，消费信贷环境恶化会直接转化为更高拨备、更低利润率，以及 Universal Bank 向集团分配利润减少。

              Fintech Band 2024 年收入下降（下滑 1.5 倍至 UAH 3.71B）和利润下降（下滑 2.7 倍至 UAH
              1.15B），公开披露没有解释，可能部分来自更高信用损失、贷款发放放缓或拨备增加。若乌克兰宏观环境进一步长期恶化——消费者支出下降、受影响地区失业率上升、货币走弱——Universal Bank
              披露利润会被压缩，还可能触发 NBU 要求增资，资源从产品投入转向资本补足。没有 Universal Bank 详细贷款质量分层或 monobank 归因信贷数据，投资者无法独立建模这一风险。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: 监管与牌照风险
        blocks:
          - type: paragraph
            body: >-
              monobank 的全部银行活动——吸收存款、发放信贷、银行卡运营——都依赖 Universal Bank 自 1994 年 1 月 20 日起独家持有的 NBU 第 92
              号牌照。如果该牌照因资本充足率不达标、AML 违规、制裁暴露或管理层不当行为被撤销或暂停，monobank 会在一夜之间无法作为银行运营。这是没有替代方案的硬依赖：Fintech-IT Group
              自身不持有银行牌照。

              ACDC Processing 在 2021 年至 2025 年获得 NBU “重要支付基础设施运营商”认定，支撑 Visa/Mastercard 以及 PCI-DSS 认证的交易处理。2025
              年之后该监管状态是否延续，公开来源没有确认，支付基础设施风险图谱因此留下未解决缺口。

              监管端，乌克兰持续落实 EU Association Agreement，要求银行监管逐步对齐欧盟指令，包括资本要求（CRD/CRR 等效）、数据隐私（GDPR 对齐）、AML/CFT
              标准和消费者保护规则。每一项都会带来合规成本和运营重组要求。NBU Financial Stability Report 2025
              强调乌克兰银行面临宏观、信贷和运营风险，并指出“聚焦风险控制并确保连续运营仍是优先事项”。NBU 的监管范围还覆盖消费者保护执法：monobank 用户可以直接向 NBU
              消费者保护办公室投诉，服务故障因此形成监管反馈通道。
