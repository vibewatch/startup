          - type: callout
            title: 国有银行存款规模是 monobank 吸收存款的结构性天花板
            body: >-
              Oschadbank 的 UAH 210B 个人存款基础反映出 monobank
              没有主权后盾就无法复制的信任动态。对风险厌恶型乌克兰人——尤其是年长群体和受冲突影响地区人群——国有银行托管仍是默认偏好。PrivatBank 的 1900
              万活跃客户也代表工资入账主导地位，在收入流入点制造存款获取先发优势。monobank 的存款天花板受行为约束，而不只是运营受限。
