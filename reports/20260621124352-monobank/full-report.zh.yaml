          label: 发现与下载
          detail: 用户通过口碑、应用商店搜索或社交媒体发现 App。4.9 星评分和 1M+ 评论降低试用门槛。免手续费发卡是钩子。
          tone: positive
        - id: kyc
          label: KYC 与发卡
          detail: 用户在 App 内通过 Diia、身份证、护照或外国护照完成 KYC。纪录：通过 Diia 用 99 秒完成。虚拟 Mastercard 立即签发；实体卡由 Nova Poshta 配送。
          tone: positive
        - id: first-use
          label: 首次交易与激活
          detail: 点对点转账、账单支付或首次刷卡购买。Purr 通知和 monocat 头像让 UX 更个人化。返现类别和消费分析强化使用。
          tone: positive
        - id: depth
          label: 产品深度（零售）
          detail: 零售深度路径：消费信贷（分期、“Do Zavtra”）、OVDP 政府债券、存款、币种账户、保险、eSIM。信用额度最高 UAH 200,000。
          tone: positive
        - id: fop
          label: FOP / 企业银行
          detail: 现有 monobank 用户用 9 次点击 / 13 秒开通 FOP 账户。零手续费 IBAN 转账、FOP 收单（1.3%）、会计授权、在线企业后台。
          tone: positive
        - id: banka
          label: Banka 捐赠与社群
          detail: 用户创建储蓄罐或捐赠罐。已连接 1,300+ 个基金会；每月 1.6M 捐赠者。军事和人道主义筹款形成高频复访行为。
          tone: positive
        - id: family
          label: 家庭 / 儿童 / 共享
          detail: 父母绑定儿童卡，可控制消费并查看共享账户。家庭银行服务提高整个家庭单元的切换成本。Diia.Card 面向政府项目受益人。
