      - number: '7.4'
        title: 法律与声誉风险——PrivatBank 关联和所有权结构
        blocks:
          - type: paragraph
            body: >-
              monobank 最持续的声誉阴影，来自联合创始人 Oleg Gorokhovskyi 和 Mykhailo Rohalskyi 的职业起点：二人曾是 PrivatBank 高级管理人员。PrivatBank
              在发现 UAH 155 billion+ 资本缺口后，于 2016 年 12 月被乌克兰国家接管。PrivatBank 国有化是东欧历史上规模最大的银行倒闭事件之一；国家最终向其注资 UAH 155.8
              billion。

              Gorokhovskyi 和 Rohalskyi 本人的直接法律风险有限：两位创始人都没有在任何 PrivatBank 相关程序中被公开列为刑事嫌疑人。不过，另有三名 Fintech Band 共同所有人曾在
              PrivatBank 国有化案件中收到刑事嫌疑通知。Komersant Ukraine 和 NV 报道称，前联合创始人 Volodymyr Yatsenko、Liudmyla Shmalchenko
              在收到刑事嫌疑通知前后出让了 Fintech Band 股权。另一名早期股东 Dmytro Dubilet 于 2019 年退出并进入政府任职。这意味着 monobank
              曾由乌克兰最大银行欺诈案中处于活跃刑事调查之下的个人直接共同持有。

              2025 年 4 月后的所有权重组增加了治理不透明度：Crestline Limited（Cyprus，63.98%）和 Nisets Limited（Cyprus，14%）持有 Fintech Band LLC
              多数股权。Gorokhovskyi 确认 Crestline 和 Nisets 是乌克兰税务居民并在乌克兰纳税，但塞浦路斯注册带来两层实益所有权结构，增加投资者尽调难度。AMCU 于 2025 年 4 月批准
              Crestline 收购，但没有独立法律意见公开说明塞浦路斯结构在乌克兰法律下的影响。

              从尽调角度看，任何机构投资者都必须取得：（a）法律意见，确认 Gorokhovskyi 和 Rohalskyi 在 PrivatBank 程序中没有活跃刑事风险；（b）塞浦路斯实益所有权链条的清晰文件；（c）确认
              UMAEF 投资经过 OFAC 和乌克兰制裁筛查。上述文件均未公开。
