      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 不利假设——资产保护，而非纯财务背书
            body: >-
              乌克兰市场分析师提出一个未经确认的假设（Forbes Ukraine 经 KyivPost 报道）：UMAEF 投资的主要动机，是提供一个与美国政府相关的所有权保护盾，对冲 Fintech-IT Group
              创始人面临的 PrivatBank 相关诉讼风险。如果该假设成立，这笔 $18.5 million 投资就不能被解读为对 $1 billion
              估值的独立财务背书，融资轮信号价值会被实质削弱。尽调必须通过审查投资文件和任何随附 side letter 来测试这一论点失效风险。
            calloutType: risk
            claimRefs:
              - CV033
              - CV034
          - type: callout
            title: 双实体估值假设
            body: >-
              本章把 Fintech-IT Group 的 $1 billion 技术开发商估值作为主要锚点评估。它不把 Universal Bank 的权益（~$634
              million）加入或归因到投资价值中；Universal Bank 是独立持有的实体，其权益由 Serhiy Tihipko 通过 TAC Group 控制，而不是由 Fintech-IT Group 创始人或
              UMAEF 控制。任何把两家实体合并的分部加总分析，都需要目前公开领域没有的完整独立合并文件。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: 2026 年 IPO 选择权信号
            body: >-
              Fintech-IT Group（通过 UMAEF 公开声明）和 Universal Bank 均已释放上市意图——Fintech-IT 登陆美国交易所，Universal Bank 暂定 2026
              年登陆国际交易所。如果两项上市都推进，将形成乌克兰 fintech 与银行资本市场前所未有的双重事件，很可能把大量国际投资者注意力吸引到 monobank 生态。
            calloutType: insight
            claimRefs:
              - CV007
