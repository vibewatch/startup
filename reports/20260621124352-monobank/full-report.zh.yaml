  - id: FV002
    title: 估值敏感性——不同收入情景下的 EV/Revenue
    type: bar
    layout: standard
    summary: 展示 Fintech-IT Group 的隐含 EV/Revenue 倍数如何随收入情景变化；$1B 锚点在 FY2024 水平意味着 11×，若复苏则压缩至 6.7×，若收入继续下滑则扩张至 16.7×。
    data:
      items:
        - label: FY2023 隐含（估算收入约 $135M）
          value: 7.4
          unit: × EV/Rev (estimated)
        - label: FY2024 实际（收入约 $90M）
          value: 11.1
          unit: × EV/Rev
        - label: 复苏情景（$110M）
          value: 9.1
          unit: × EV/Rev (estimated)
        - label: 牛市情景（$150M）
          value: 6.7
          unit: × EV/Rev (estimated)
        - label: 熊市延续（$60M）
          value: 16.7
          unit: × EV/Rev (estimated)
        - label: Nu Holdings（上市可比）
          value: 5.4
          unit: × EV/Rev (FY2024 revenue)
        - label: Monzo（私有，估算）
          value: 6
          unit: × EV/Rev (midpoint est.)
    approximationNotes: >-
      FY2023 Fintech Band 收入估算约为 $135M，依据是 FY2024（$90M）较 FY2023 下滑约 33%。收入情景为作者用于示意的估算。Nu Holdings 倍数用 Yahoo Finance 市值和
      Macrotrends 收入数据计算。Monzo 倍数根据二级市场估值报告和 CH 备案线索估算；未确认。
    claimRefs:
      - CV010
      - CV011
      - CV017
      - CV018
      - CV021
  - id: FV003
    title: 估值与回报区间——以 $1B 入场的牛市 / 基准 / 熊市
    type: range
    layout: standard
    summary: Fintech-IT Group 相对于 $1B UMAEF 轮入场估值的低、中、高隐含退出估值，以十亿美元计。
    data:
      items:
        - label: 熊市情景退出（困境 / IPO 延迟）
          low: 0.4
          value: 0.5
          high: 0.6
        - label: 基准情景退出（按复苏收入 10–12× IPO）
          low: 0.9
          value: 1.1
          high: 1.4
        - label: 牛市情景退出（战争结束，美国 IPO 按 15× 收入）
          low: 1.5
          value: 2
          high: 2.5
        - label: UMAEF 入场估值（2025 年 10 月）
          low: 1
          value: 1
          high: 1
    approximationNotes: >-
      所有数值均为十亿美元。估值估算基于情景，把 EV/Revenue 倍数套用于预测的 Fintech Band 收入；不是基于 DCF 或官方财务模型。熊市区间反映 $60–90M 收入上的 5–7× 困境退出。基准区间反映
      $90–120M 上的 10–12×。牛市区间反映战后 $100–165M 收入上的 15×。Pre-money 入场估值假设 $1.0B 为 UMAEF 轮锚点；实际 post-money 未确认（持股比例和募资总额未披露）。
    claimRefs:
      - CV001
      - CV010
      - CV038
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI——Fintech-IT Group 估值的 IC 就绪评分
    type: kpi
    layout: standard
    summary: 截至 2026 年 6 月，围绕市场、验证、护城河、经济性、风险、估值和证据质量，对 Fintech-IT Group / monobank 做投资委员会评分。
    data:
      items:
        - label: 市场机会
          value: 6
          unit: /10
          detail: 乌克兰移动银行占主导，但市场受战争影响且限于单一国家；TAM 约 22–28M 成年人
          tone: neutral
        - label: 产品验证
          value: 8
          unit: /10
          detail: 乌克兰银行业
          tone: positive
        - label: 竞争护城河
          value: 7
          unit: /10
          detail: 网络效应、最高应用评分，
          tone: positive
        - label: 经济性 / 盈利能力
          value: 4
          unit: /10
          detail: FY2024 净利率 31% 单看不错，但收入 −33%、利润同比 −63%；未经审计
          tone: warning
        - label: 风险画像
          value: 3
          unit: /10
          detail: 战争活跃、单一客户集中、PrivatBank 诉讼、不透明、退出流动性差
          tone: negative
        - label: 估值与证据
          value: 4
          unit: /10
          detail: 11× EV/下滑收入；约 $101/客户，同业为 $556–$1,000；单笔小额持股锚点
          tone: warning
        - label: 证据质量
          value: 3
          unit: /10
          detail: 没有经审计的合并 IFRS；没有股权结构；没有关联公司费用披露；没有锁定条款
          tone: negative
        - label: 退出清晰度
          value: 4
          unit: /10
          detail: UMAEF 暗示美国 IPO；Universal Bank 暗示 2026 年上市；未提交 S-1；时间线属推测
          tone: warning
