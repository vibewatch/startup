      - number: '3.2'
        title: 竞争对手画像——规模、资产与客户覆盖
        blocks:
          - type: paragraph
            body: >-
              PrivatBank 是 monobank 的核心竞争参照。作为乌克兰资产规模最大的银行（NBU 口径，2026 年 6 月 UAH 916,892M），PrivatBank 服务超过 1900
              万活跃客户，几乎是 monobank 1030 万注册用户的两倍。它为国有（2016 年 12 月国有化后由财政部 100% 持有）、具有系统重要性，并被 NBU 列为有偿付能力。截至 2026 年 6 月，其
              Privat24 移动 App 在 Google Play 上有 167 万条评价、评分 4.8 星、下载量 1000 万+。PrivatBank 的实体基础设施——1,200+ 家网点、7,000+ 台
              ATM、250,000+ 台 POS 终端——构成 monobank 无法复制的分发护城河。PrivatBank 2024 年年度净利润达到 UAH 40.1B，为持续投入生成了大量留存资本。

              Oschadbank 是第二大国有银行，也是存款市场领导者。它拥有 UAH 510,545M 资产和 1,150+ 家网点（乌克兰所有银行中最大网络），截至 2024 年底持有最大的个人存款基础 UAH
              210B。2024 年，它以 40% 市场份额领跑 eOselia 国家抵押贷款项目，并以 38% 份额领跑汽车贷款市场，税前利润创纪录达到 UAH 18.6B。Oschadbank
              在前线地区（Donetsk、Sumy、Kherson、Kharkiv、Chernihiv）运营 5 个移动装甲银行单元，是唯一拥有此类网络的银行——展现出 monobank 在结构上无法匹配的战时韧性。

              Raiffeisen Bank Ukraine（资产 UAH 265,488M、权益 UAH 41,649M、利润 UAH 2,038M）和 OTP Bank Ukraine（资产 UAH 136,070M、权益
              UAH 27,446M、利润 UAH 1,327M）是主要外资银行竞争者。两者均为 NBU 系统重要性银行，由欧洲银行集团持有（Raiffeisen Bank International，奥地利；OTP
              Group，匈牙利）。外资银行所有人的战略不确定性——尤其是 RBI 公开表示考虑退出乌克兰——对其子公司构成潜在风险，也可能成为 monobank 获取客户的机会。

              Universal Bank 的 UAH 215,582M 资产和 UAH 2,590M 利润使其处于中上层级——大于 OTP 和 Sense Bank，但约为 PrivatBank 的四分之一。
