            body: >-
              Banka（储蓄罐）已从个人储蓄功能演变为乌克兰最大的慈善筹款渠道，连接超过 1,300 个基金会，处理超过 UAH 100 billion 捐款，并拥有 1.6 million 月捐赠者。这让 monobank
              成为民间社会的基础金融设施，形成深度嵌入的网络效应，竞争对手几乎不可能在相近时间尺度上复制。
