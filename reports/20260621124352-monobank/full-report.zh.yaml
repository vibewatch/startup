  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              乌克兰零售银行市场由战时结构塑造：国有银行——PrivatBank、Oschadbank 和已国有化的 Sense Bank——持有约 50%
              行业净资产，提供一种私人银行和外资银行无法复制的隐性主权安全信号。在这一环境中，monobank（通过 JSC Universal Bank 运营）在三条战线上竞争：（1）与占主导地位的国有银行
              PrivatBank 争夺大众零售移动银行和支付；（2）与 Oschadbank 争夺存款、抵押贷款和 SME 放贷，尤其是在 Oschadbank 实体存在是唯一银行选项的地区；（3）与外资银行子公司
              Raiffeisen Bank Ukraine 和 OTP Bank Ukraine 争夺城市、数字熟练且国际流动性强的客群。

              第四个竞争层级是 Sense Bank（原 Alfa-Bank Ukraine，在俄罗斯 2022 年全面入侵切断其俄罗斯母公司所有权后由国家控制）。它仍保留实体网点和传统客户关系，但最近 NBU 报告期利润仅
              UAH 372.6M，而 PrivatBank 为 UAH 16B，显示出结构性竞争弱点。

              竞争分析边界限定在乌克兰零售和 SME 银行业。全球 neobank（Revolut、Wise、N26）被明确排除：NBU 牌照要求和 UAH 转账限制，使它们无法向乌克兰居民提供 monobank
              的完整产品组合，因此最多只是跨境支付的部分替代，而非国内银行替代方案。现状替代品——现金和沉睡的 Oschadbank 存折账户——在 2024 年非现金支付占比 94.6% 的背景下处于长期衰退。NBU
              BankID 系统 2024 年身份识别量从 4290 万增至 8770 万，确认数字开户基础设施已广泛可得。
