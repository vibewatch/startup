      - number: '6.4'
        title: Banka 筹款平台与捐赠社区
        blocks:
          - type: paragraph
            body: >-
              Banka（字面意思为「jar」）功能，是 monobank 产品组合中最有辨识度的客户细分之一，也是公开沟通中最常被引用的数据点之一：超过 1,300 个慈善基金会连接到 Banka 平台；超过 1.6
              million 人每月通过 Banka 捐款；截至 2026 年，Banka 累计捐款总额达到 UAH 100 billion。这三项指标在 monobank 乌克兰语和英文主页中逐字出现，是 monobank
              唯一以子细分粒度发布的量化用户参与数据。

              Banka 在 monobank app 内作为储蓄和筹款「罐」运行。个人用户可为个人储蓄目标创建罐，也可公开分享罐链接用于慈善活动。基金会以认证收款方身份接入平台，让既有 monobank
              用户点击即可设置每月定期捐赠。慈善基金会连接能力（1,300+ 个基金会，涵盖军事、人道和公民组织）与每月捐赠规模（1.6 million 活跃月捐赠者）共同形成民间社会参与回路，显著抬高深度参与捐赠者离开
              monobank 的转换成本。这可能是公开数据中最强的留存信号：设置了定期向基金会捐赠的 Banka 捐赠者，在离开前必须主动取消捐赠。

              累计捐赠额（UAH 100 billion）为平台提供交易强度锚点。按 1.6 million 月捐赠者和历史汇率估算，人均累计捐赠已进入五位数 hryvnia 区间，远高于随手使用模式。Banka
              平台还直接承载战时社区信号：军事筹款罐被明确营销，app 官方 App Store 列表出现「为乌克兰武装部队筹款」信息。本研究没有找到对基金会层面资金拨付或捐赠者对基金会用款满意度的独立审计。
