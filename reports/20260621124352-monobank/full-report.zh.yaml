    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律结构与运营模式
        blocks:
          - type: paragraph
            body: >-
              monobank 自称乌克兰首家无网点银行——一款面向移动优先客户的零售银行产品，让用户不必去线下网点也能获得金融服务。它于 2017
              年上线，并刻意采用双实体结构运营：所有银行活动（存款、贷款、银行卡、监管合规）由持有 NBU 1994 年 1 月 20 日颁发第 92 号牌照的商业银行 JSC Universal Bank
              承担。技术——App、后端、支付处理和相邻 fintech 产品——由 Oleg Gorokhovskyi 与 Mykhailo Rohalskyi 共同创立的 IT 控股公司 Fintech-IT
              Group（原 Fintech Band LLC）开发。

              这一结构是尽调重点，因为两个实体的所有权、董事会和风险画像彼此独立。Universal Bank 由 Serhiy Tihipko 通过 TAC Group 持有，并被 NBU
              列为有偿付能力且具有系统重要性。Fintech-IT Group 通过塞浦路斯控股载体由 Gorokhovskyi 和 Rohalskyi 作为受益所有人持有。monobank 商标由 Universal
              Bank 和 Kilobyte1024（一家 Gorokhovskyi/Rohalskyi 实体）共同持有，更广义的 mono 品牌则通过塞浦路斯注册的 Hallstatt 持有。后续任何章节引用
              monobank 的财务、治理或客户指标，都必须区分银行实体（Universal Bank）和技术开发商（Fintech-IT Group）。

              截至 2026 年，monobank 产品组合包括支付卡、消费信贷（分期计划、「until tomorrow」小额贷款）、货币账户、政府债券、存款、P2P 转账、eSIM、群组支出，以及 Banka
              募资平台——该平台已连接 1,300 多家慈善基金会，累计处理捐赠超过 UAH 100B。开放 API（版本 250818）允许第三方开发者访问账户流水和汇率数据，显示出有实质意义的技术开放度。
