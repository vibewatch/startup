      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，开放来源中没有独立发布的乌克兰零售数字银行或 neobank 细分市场 TAM/SAM/SOM
              估算。所有规模判断都必须从结构性指标推导：人口范围、支付量和竞争渗透率。本节提供三个受约束的视角，而不是一个自上而下估算，并明确保留战时人口流离、通胀和私人银行不透明带来的不确定性。

              TAM（Total Addressable Market）——成人银行人口视角：乌克兰战前常住人口约 4400 万（基于 2021 年人口普查估计）。俄罗斯全面入侵导致估计 600–800
              万乌克兰人流亡海外（UNHCR），国内流离失所者也达数百万人。世界银行 2026 年 2 月 Rapid Damage and Needs Assessment（RDNA5）估算，未来十年重建成本约
              $588B——约为乌克兰估计 2025 年名义 GDP 的三倍——隐含 GDP 约 $196B。基于这一人口和宏观锚点，成人银行人口总量（任何零售银行的总体市场）估计为 2200–2800
              万，仍留在或连接乌克兰经济；下限因移民存在重大不确定性，上限则因流离劳动者仍持有 UAH 账户而不确定。

              SAM（Serviceable Addressable Market）——智能手机和数字意愿视角：全面入侵前，乌克兰成人智能手机渗透率约为 75–80%。非现金迁移——2024 年按笔数计 94.6%
              的支付卡交易为非现金、总卡交易 86.5 亿笔——说明经济活跃人口中银行卡采用接近普及。综合这些信号，纯移动银行的 SAM 估计为 1300–1800
              万成年人：他们拥有智能手机、活跃支付卡，并愿意不去网点办银行。NBU BankID 系统 2024 年记录 8770 万次身份识别（较 2023 年 4290
              万次增长一倍以上），确认数字身份验证作为远程银行前置条件正在爆发式增长。

              SOM（Serviceable Obtainable Market）——monobank 竞争位置：截至 2026 年 6 月，monobank 拥有 1030 万注册客户，约占估算 SAM 的
              37–47%。考虑到现有渗透率已高，Universal Bank 2026 年 1070 万零售客户和 450,000 名 FOP 的目标，构成保守的近期上限。交易强度——2025 年前 9 个月 UAH
              8.5T——显示注册基础中的激活度强，但活跃客户与注册客户比例未公开披露。

              Statista 的乌克兰银行市场方法覆盖零售和 SME 银行业的净利息收入，但不发布 neobank 专属子细分估算。没有分析师单独发布乌克兰 neobank 细分市场
              CAGR，反映战时规模测算的不确定性极高。2026 年 2 月消费通胀同比 7.6%、NBU 关键政策利率 15.0%，也进一步复杂化基于收入的 TAM 预测。
