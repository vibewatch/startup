      - number: '4.2'
        title: Universal Bank 财务画像——NBU 报告指标
        blocks:
          - type: paragraph
            body: >-
              Universal Bank 的 NBU 监管档案，是银行层面财务数据最权威的一手来源。按 NBU 最新披露，Universal Bank 总资产为 UAH 215,581.6 million（按 2026 年
              6 月 UAH/USD 约 44.9 的参考汇率，约 $4.8 billion），总负债 UAH 187,132.8 million，权益 UAH 28,448.8 million，利润 UAH 2,590.2
              million。这些数字只覆盖银行实体，不包括 Fintech Band 或任何 Fintech-IT Group 子公司。

              权益 / 资产比约 13.2%（UAH 28,448.8M ÷ UAH 215,581.6M），说明资本水平中等，并高于 NBU 最低资本要求；但英文监管档案没有给出精确的风险加权资本充足率。年化资产回报率约
              1.2%，与乌克兰银行业在高利率环境下的平均水平一致；2022 年以来，银行通过持有政府债券赚取可观 carry。Universal Bank 拥有 IVI-Rating 给出的投资级国内信用评级
              uaAAA，展望稳定（2026 年 4 月确认），并被 NBU 归类为具偿付能力且具有系统重要性的银行。它参与存款保障基金，为零售存款人提供法定存款保险；在战时环境下，这是维持存款人信心的重要因素。

              这些是银行层面的指标，不是品牌层面的指标。UAH 215.6 billion 的资产基础反映 Universal Bank 的整体资产负债表，其中既包括 monobank 零售产品，也包括 monobank
              上线前已有的传统企业与 SME 业务。公开英文资料没有拆分 monobank 零售收入与 Universal Bank 其他业务线。Universal Bank
              在官网以乌克兰语提交季度法定报表，但国际投资者无法获取经独立审计的英文 IFRS 格式版本。
