      - number: '7.6'
        title: 集中度、合作伙伴依赖与估值风险
        blocks:
          - type: paragraph
            body: >-
              monobank 最具结构性的风险，是对 Universal Bank 的单线依赖。每一项受监管银行活动——持有存款、发放信贷、运营支付卡、执行 KYC——都需要 Universal Bank 持有的 NBU
              银行牌照。Universal Bank 由 Serhiy Tihipko 所有，是独立第三方；没有公开披露的长期合同承诺要求其维持合作。Fintech-IT Group / Universal Bank
              技术和服务协议的条款——包括期限、排他性、收入分成安排和终止权——均未公开。如果 Universal Bank 退出或限制合作，或 Tihipko 试图把 Universal Bank
              出售给不支持该安排的买方，Fintech-IT Group 将没有可立即替代的银行基础设施。

              地理和基础设施集中度进一步放大风险。Fintech-IT Group 的两个办公室位于 Kyiv 和
              Dnipro，这两座城市都遭遇过俄罗斯导弹袭击。尽管技术团队也在乌克兰各地远程办公，集中在这两座城市仍让高层连续性出现单点脆弱性。

              国际扩张已经暂停。Stereo by mono（Poland）和 Koto（UK）项目明确处于“搁置”状态，monobank 也没有 EU 或 UK
              银行牌照。这意味着整体估值锚定在一个承受战时逆风的单一国家市场，短期没有国际多元化路径。

              估值风险直接取决于退出可行性。UMAEF 主导的 $1 billion+ 估值在 2025 年 10 月形成，这一抬升需要战略出售、二级交易或最终 IPO，且倍数要高于乌克兰私募股权常规水平。此前没有乌克兰
              fintech 在主要交易所完成 IPO。UMAEF 和私人投资者的卖权 / 买权以及流动性时间表没有披露。Fintech Band 2024
              年收入和利润下滑，也进一步提出一个问题：在独立战略买方的尽调过程中，$1 billion 估值能否守住。
