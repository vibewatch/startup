companyProfile:
  summary: >-
    monobank 是乌克兰规模最大、也是首家移动优先的 neobank，由 Oleg Gorokhovskyi 和 Mykhailo Rohalskyi 于 2017 年推出；两人此前都是 PrivatBank
    高管。产品本质上是一款零售银行 App，依托 JSC Universal Bank 的牌照运营（Serhiy Tihipko 通过 TAC Group 为受益所有人），技术则由 Fintech-IT Group（原 Fintech
    Band）开发并持有，后者由创始人单独持有。截至 2026 年 6 月，monobank 注册客户超过 1030 万，是乌克兰最大的 neobank。2025 年 10 月，UMAEF（Ukraine-Moldova
    American Enterprise Fund）成为 Fintech-IT Group 首个外部机构投资者，将技术开发实体推高到 $1B+ 估值。Universal Bank 在最新 NBU 监管档案中披露总资产 UAH
    215.6B、利润 UAH 2.59B；Fintech Band 披露 2024 财年收入 UAH 3.71B，净利率 31%。两者均同比大幅下滑，反映战时压力。
