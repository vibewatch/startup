      - number: '7.8'
        title: 附录
        blocks:
          - type: callout
            title: 单一银行依赖是首要结构性风险
            body: >-
              monobank 每一项受监管银行功能都完全依赖 Universal Bank 的 NBU 牌照。公司没有公开披露备用银行合作伙伴、自有牌照申请或收购银行牌照的路径。由此形成一种情景：NBU 针对
              Universal Bank 采取行动，或 Tihipko 纯粹出于商业原因决定退出合作，都可能让 monobank
              运营在没有过渡期的情况下停摆。机构投资者在投入超过种子阶段的资本前，应要求取得详细合同保护、与该依赖绑定的卖权，以及已披露的应急计划。
