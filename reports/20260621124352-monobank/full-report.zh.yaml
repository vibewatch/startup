      - number: '1.3'
        title: 客户规模、融资历史与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              在战时背景下，monobank 的增长轨迹非常突出。截至 2026 年 6 月，Google Play 和 Apple App Store 列表均显示注册客户超过 1030 万，使 monobank
              成为乌克兰最大的商业数字银行，并按支付卡数量计成为该国第二大零售银行。UMAEF 2025 年 10 月新闻稿确认，截至 2025 年 9 月客户数为 990 万。2025 年前 9 个月处理 UAH 8.5T
              交易，凸显的是交易强度，而不只是注册规模。monobank 已连续两年（2024 和 2025 年）被 CNBC 评为全球前 35 家 neobank 和前 250 家 fintech
              公司，并长期保持乌克兰银行业最高的净推荐值。

              2025 年 10 月 6 日的 UMAEF 投资是关键公司事件：UMAEF——一家由美国政府授权、1994 年由国会设立并获得 $150M 初始联邦资金的基金——成为 Fintech-IT Group
              首个外部机构投资者，并牵头一个未披露的美国私人投资者财团。这笔投资把 Fintech-IT Group 推过 $1B 估值门槛，使其成为乌克兰首家 fintech 独角兽。UMAEF 通过
              Hallstatt（塞浦路斯）取得的股权估计约为 Fintech Band 的 1.9%，对应约 $18.5M——资金规模不大，但战略和声誉信号远超财务金额。

              Fintech Band 2024 年财务数据显示，收入 UAH 3.71B（约 $92.4M），同比下降 1.5×；净利润 UAH 1.15B（约 $28.6M），同比下降 2.7×。超过 90% 的收入来自为
              Universal Bank 提供的软件服务。Fintech-IT Group 约有 630 名员工，其中约 400 名为 IT 专业人员，在 Kyiv 和 Dnipro 设有办公室，并在乌克兰各地有远程员工。
