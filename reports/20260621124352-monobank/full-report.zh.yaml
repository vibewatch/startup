      - number: '5.2'
        title: FOP / 企业银行与商户收单
        blocks:
          - type: paragraph
            body: >-
              monobank 的 FOP（个体经营者）产品以「FOP mono」品牌面向自由职业者、IT 专业人士、线上商户、服务提供者和创作者。既有 monobank 持卡人开户只需 9 次点击，官方最快纪录为 13
              秒。FOP 账户开户、维护、IBAN 转账和绑定借记卡费用均为 UAH 0；每月最高 UAH 50,000 可通过转入个人账户免费提现。其他 FOP 服务包括 USD 和 EUR 货币账户、用于业务线隔离的第二个
              hryvnia 活期账户、用于育儿假和病假工资的社会支付账户，以及按电话号码授权会计、最多支持 10 个关联联系人。线上企业柜台服务桌面会计流程。

              商户收单（「plata by mono」）提供四种模式：面向网站和 app 内支付链接的互联网收单、带 fiscal receipt 开具的品牌 POS 终端、SoftPOS（用商户自有手机作为终端）和 QR
              码立牌方案。披露佣金为乌克兰发卡 1.3%、外国卡 2.0%；POS 终端租金每月 UAH 500，互联网收单和 SoftPOS 无硬件成本。资金在 24 小时内结算到商户账户。公司称超过 98%
              的收单付款可首次尝试成功，并提供 24/7 处理和反欺诈保护。企业柜台功能包括分析、发起付款、终端管理、退款和对账单下载。其他收单能力包括软件 fiscal register
              (pRRO)、资金预留（escrow）、用于循环付款的卡 tokenization，以及自助服务模块。收单 API 文档覆盖 3D Secure 流程、完整错误码分类（银行封锁卡、3DS
              失败、余额不足、技术错误）、tokenization 和退款处理。

              支撑消费者和商户支付流程的底层支付基础设施，是 Fintech-IT Group 子公司 ACDC Processing LLC。该公司 2020 年上线，2021 至 2025 年被 NBU
              认定为重要支付基础设施运营商。ACDC 持有 Visa、Mastercard 和 PCI DSS 认证，创始人称其为乌克兰领先的独立支付服务技术运营商。
