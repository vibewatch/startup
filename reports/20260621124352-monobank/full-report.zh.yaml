      - number: '1.2'
        title: 创始人、领导层、治理与所有权结构
        blocks:
          - type: paragraph
            body: >-
              Oleg Gorokhovskyi 和 Mykhailo Rohalskyi 在 2017 年创立 Fintech Band；此前两人都曾在 PrivatBank 担任高管。PrivatBank 在 2016 年
              12 月国有化前是乌克兰最大的私人银行。PrivatBank 关联是本章最重要的治理尽调信号。其他前 PrivatBank 高管也曾是 Fintech Band 早期股东：Dmytro Dubilet（2019
              年离开并进入政府任职）、Volodymyr Yatsenko 和 Liudmyla Shmalchenko。Yatsenko 与 Shmalchenko 在收到与 PrivatBank
              国有化案相关的刑事嫌疑通知后出售了股份。乌克兰媒体承认这段历史，但公开层面尚未解决；它给投资人留下必须独立评估的法律和声誉尾部风险。

              2025 年 4 月之后，Fintech Band LLC 的所有权结构为：Crestline Limited（塞浦路斯）63.98%、Nisets Limited（塞浦路斯）14%、Yevheniya
              Kryvenko 14%、Daria Bukreyeva 8%，Rohalskyi 和 Horokhovskyi 各自直接持有 0.008%。尽管直接持股被稀释，Gorokhovskyi 和 Rohalskyi
              仍通过塞浦路斯控股层各自持有约 37.2% 的最终受益权益（31.96% 直接加 5.24% 间接）。乌克兰反垄断委员会 2025 年 4 月批准 Crestline 取得 Fintech Band
              控制权的决定确认了这一点。两位创始人均确认，Crestline 和 Nisets 虽在塞浦路斯注册，但为乌克兰税务居民。

              Universal Bank 方面，CEO Iryna Starominska 负责日常银行运营，并设定 2026 年目标：1070 万零售客户、18,000 家法人实体和 450,000
              名个体经营者。Marcin Petrykovsky 任 Universal Bank 监事会成员，提供国际治理监督。Fintech-IT Group 未披露完整董事会名单，加之 PrivatBank
              诉讼历史悬而未决，构成重大治理缺口；本章只能记录，无法凭公开来源补齐。
