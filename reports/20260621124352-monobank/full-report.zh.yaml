      - number: '4.4'
        title: 收入模型、变现驱动因素与单位经济性
        blocks:
          - type: paragraph
            body: >-
              monobank 的收入模型分为两个彼此独立又相互依赖的层次。银行层面，Universal Bank 通过以下方式创收：（1）Visa 和 Mastercard 支付卡交易的交换费——考虑到 monobank
              按支付卡数量是乌克兰第二大零售银行，这是最主要的交易量驱动型收入来源；（2）消费信贷带来的净利息收入 (NII)，包括分期付款、「until
              tomorrow」小额贷款和信用卡产品；（3）外汇兑换、国际转账、账户管理和政府债券投资带来的手续费收入；（4）政府债券组合带来的资金业务收入，按 2026 年 6 月 NBU 15% 的政策利率计算，2022
              年以来这是乌克兰银行业的重要盈利驱动；（5）随着 Universal Bank 目标在 2026 年底服务 18,000 家法人实体和 450,000 个 FOP（个体经营者），SME 和 FOP
              银行业务手续费正在增长。

              技术层面，Fintech Band 的收入主要来自 Universal Bank 为开发和运营 monobank 平台支付的技术服务费，辅以 ACDC
              支付处理费和相邻技术产品收入（Expirenza、market by mono、Base by mono、Loyalty.ai）。Universal Bank 与 Fintech Band
              之间的关联方收费公式没有公开披露；该结构意味着 Fintech Band 收入与 Universal Bank 的发卡和放贷规模增长高度相关，形成单一客户收入集中风险。

              银行层面和技术运营商层面的单位经济性均未披露。公开资料没有净息差 (NIM)、获客成本 (CAC)、生命周期价值 (LTV)、回本期或 cohort
              盈利能力数据。可以粗略推算一个技术运营商收入代理指标：Fintech Band FY2024 收入约 $89.6 million，除以估计约 8 million 活跃用户，得到技术运营商层面每用户每年约
              $10–12；但该数字不包括 Universal Bank 自身由 NII 驱动的收入，且如果 Fintech Band 部分收入与 monobank 零售无关，可能高估人均经济性。2024
              年，乌克兰非现金交易按笔数占比达到 94.6%；monobank 4.9 分的 app 维持乌克兰银行业最高 NPS，即便宏观环境持平到温和增长，也支撑以交易量驱动的交换费和手续费收入增长。
