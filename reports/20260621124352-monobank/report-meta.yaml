companyProfile:
  summary: >-
    monobank is Ukraine's largest and first mobile-first neobank, launched in 2017 by Oleg Gorokhovskyi
    and Mykhailo Rohalskyi — both former senior managers of PrivatBank. The product is a retail banking
    app operated under the license of JSC Universal Bank (beneficially owned by Serhiy Tihipko through
    TAC Group), while the technology is developed and owned by Fintech-IT Group (formerly Fintech Band),
    which is separately owned by the founders. As of June 2026 monobank had more than 10.3 million
    registered clients, making it Ukraine's largest neobank. In October 2025, UMAEF (Ukraine-Moldova
    American Enterprise Fund) became Fintech-IT Group's first external institutional investor, propelling
    the tech-developer entity to a $1B+ valuation. Universal Bank reported UAH 215.6B in total assets and
    UAH 2.59B in profit as of the latest NBU supervisory profile; Fintech Band reported FY2024 revenue of
    UAH 3.71B with a 31% net margin, both sharply down year-on-year reflecting wartime pressures.
  foundedDate: "2017-11-01"
  founders:
    - name: Oleg Gorokhovskyi
      role: Co-founder & CEO, Fintech-IT Group
      background: Former senior manager at PrivatBank, Ukraine's largest bank; previously spearheaded PrivatBank's digital banking products.
      claimRefs: [CO004]
    - name: Mykhailo Rohalskyi
      role: Co-founder, Fintech-IT Group
      background: Former senior manager at PrivatBank; co-author of the monobank concept alongside Gorokhovskyi.
      claimRefs: [CO004]
  foundingLocation: Kyiv, Ukraine
  headquarters: Kyiv, Ukraine
  productSummary: >-
    Fully branchless mobile banking app offering payment cards, consumer credit (up to UAH 200,000),
    foreign-currency accounts, deposits, government bonds, FOP (sole-trader) accounts, acquiring at 1.3%
    via plata by mono, the Banka charitable fundraising feature, and an open public API. Products run on
    monobank's own ACDC Processing infrastructure with Visa/Mastercard and PCI-DSS certification.
  customerFocus: >-
    Ukrainian retail consumers seeking a fully mobile banking alternative; secondary focus on individual
    entrepreneurs (FOPs) and charitable/social causes via the Banka feature.
  businessModel: >-
    Two-sided: (1) technology-developer model — Fintech-IT Group earns software-development and service
    fees from Universal Bank under a long-term contract (>90% of revenue); (2) banking model — Universal
    Bank generates net interest income, card interchange, and fee income from the monobank customer base.
    Acquiring fees (1.3%) and premium card revenue supplement the retail banking stream.
  stage: late-stage private
  fundingStatus: >-
    First external institutional capital: UMAEF growth-equity round announced October 2025, estimated at
    approximately $18.5M for a ~1.85% stake, implying $1B+ tech-entity valuation. No prior disclosed
    external funding in Fintech-IT Group; Universal Bank separately explored IPO on international markets.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO007, CO008, CO012, CI001, CI011]
summary:
  headline: >-
    monobank is Ukraine's dominant mobile-first neobank with irreplaceable brand and 10.3M clients,
    but a $1B tech-entity valuation implies a stretched 11× FY2024 revenue multiple against a wartime
    backdrop of declining developer revenues and opaque consolidated financials — warranting deep
    further diligence before any commitment.
