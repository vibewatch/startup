  topStrengths:
    - "Ukraine's #1 neobank by client count (10.3M+) with 4.9-star app ratings and the highest NPS in Ukrainian banking."
    - "Branchless mobile-first architecture with proprietary ACDC Processing, Visa/Mastercard certifications, and sub-100-second onboarding via Diia."
    - "Banka charitable feature with 1,300+ foundations and UAH 100B in total donations creates unique social-good brand moat."
    - "UMAEF institutional validation and stated IPO optionality open a path to international capital markets."
  topRisks:
    - "Full-scale war, Russian missile and drone strikes, and macroeconomic disruption in Ukraine represent an existential operating-environment risk."
    - "Fintech Band's FY2024 revenue fell 33% and net profit fell 63% year-on-year; concentration risk from a single Universal Bank contract exceeding 90% of developer revenues."
    - "Legal and reputational tail risk from founders' PrivatBank history and unresolved NBU-era litigation overhang."
    - "Structural opacity: no publicly audited consolidated P&L for the tech-developer entity; no disclosed NRR, churn, or CAC metrics."
    - "Single-bank-license dependency — the monobank product lives or dies with Universal Bank's NBU license and solvency."
  unresolvedGaps:
    - "Consolidated audited financials for Fintech-IT Group (including all subsidiaries) with segment-level breakdown are not publicly available."
    - "FY2025 revenue and profit trajectory for Fintech Band — whether the decline stabilised or continued after the 2024 trough — is unknown."
    - "The precise total capital raised in the UMAEF round, investor rights, preferred mechanics, and liquidation preferences are not disclosed."
    - "Bank-level credit quality metrics (NPL ratio by product, loan-loss reserves, forward provisions under wartime) for Universal Bank retail portfolio remain opaque."
    - "Customer-level retention, churn, ARPU, and CAC data for monobank are not publicly disclosed."
