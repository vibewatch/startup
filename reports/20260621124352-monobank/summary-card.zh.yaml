summary:
  headline: >-
    monobank 是乌克兰客户数领先、品牌不可替代的移动优先 neobank，拥有 10.3M 客户；但 $1B 科技实体估值意味着约 11× FY2024
    收入倍数，在战争背景下，开发商收入下滑、合并财务不透明，这个价格偏紧，承诺前必须做深度尽调。
