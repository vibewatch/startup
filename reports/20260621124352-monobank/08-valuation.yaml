company:
  name: monobank (Fintech-IT Group / Universal Bank)
chapter:
  number: 8
  title: Valuation
  summary: >-
    Fintech-IT Group's October 2025 UMAEF-led round at a $1.0 billion valuation anchors the
    analysis, but the valuation applies to the tech-developer entity (Fintech Band / Fintech-IT
    Group), not to the regulated bank (Universal Bank). At ~11× FY2024 tech-operator revenue and
    ~$101 per registered customer, monobank is priced far below global neobank peers on a
    per-customer basis but reflects a justified wartime discount and structural opacity. The
    revenue decline (−33% YoY in 2024) and profit compression (−63%) create near-term pressure
    on the multiple. A track recommendation at current terms reflects moderate confidence; the
    valuation stance is stretched relative to transparent peers of comparable size and the
    absence of audited consolidated financials.

sections:
  - id: valuation-anchor-entity-distinction
    title: Valuation Anchor and the Dual-Entity Problem
    body: >-
      The UMAEF-led investment, announced on October 6, 2025, propelled Fintech-IT Group — the
      technology holding company behind monobank — to a $1.0 billion valuation, making it
      Ukraine's first fintech unicorn. UMAEF, a U.S. Congress-established fund, became the
      company's first financial investor and only non-founding shareholder, leading a consortium
      of American private investors. The official press release confirmed the $1.0 billion figure
      explicitly: "Propelling the Company to a $1.0bn valuation in this growth equity round."
      The investment amount was not disclosed; Forbes Ukraine subsequently estimated it at
      approximately $18.5 million, implying UMAEF's stake at roughly 1.9% of Fintech Band (the
      core operating entity) via a ~2.9% interest in Hallstatt, the Cyprus-based holding vehicle
      through which the deal was structured.

      The critical distinction for valuation analysis is that Fintech-IT Group is a technology
      developer, not a bank. Universal Bank JSC — the regulated banking entity that operates
      monobank under NBU license No. 92 — is a separate legal entity owned by Serhiy Tihipko
      through TAC Group. Universal Bank reported total assets of UAH 215,581.6 million (≈$4.8
      billion), equity of UAH 28,448.8 million (≈$634 million), and net profit of UAH 2,590.2
      million (≈$58 million) per the NBU supervisory profile as of the most recent publication.
      These bank-level financials are not consolidated with Fintech-IT Group in any public filing.
      Any investor underwriting the $1 billion Fintech-IT valuation is acquiring exposure to the
      technology fee stream — not to the balance sheet, deposit base, or lending book of Universal
      Bank. The Hallstatt investment structure and the bank's separate corporate ownership mean
      that an investor in Fintech-IT Group cannot directly access Universal Bank's equity or
      compel actions at the bank level.

      UMAEF explicitly cited plans to help prepare the company for an IPO on a U.S. stock exchange.
      Universal Bank has also signalled a 2026 IPO plan on international capital markets.
      These parallel, legally separate IPO pathways further underscore the dual-entity complexity
      that any prospective investor must fully resolve.
