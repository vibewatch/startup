  - id: recommendation-diligence
    title: Recommendation, Confidence, and Final Diligence Asks
    body: >-
      The valuation stance on Fintech-IT Group's $1 billion mark is stretched relative to the
      evidence base available from public sources. The 11× EV/FY2024 Revenue multiple is not
      inherently excessive for a high-growth fintech software company, but it is applied to a
      business that experienced double-digit revenue contraction in the most recent reported year,
      operates in an active war zone, has opaque consolidated financials, and depends on a
      single regulated-banking partner for over 90% of revenues. The per-customer value of ~$101
      is the lowest among all comparable neobanks surveyed, justified by wartime discount and
      entity-structure constraints but also masking the potential asymmetric upside in a
      post-war, post-IPO scenario.

      The recommendation is track: maintain monitoring without immediate capital deployment.
      A track stance reflects medium confidence in the company's competitive position and
      long-term potential, balanced against the difficulty of financial underwriting from public
      sources alone. Confidence would shift to buy if: (a) audited consolidated management
      accounts demonstrating revenue recovery and strong FY2025 profitability become available;
      (b) a credible U.S. IPO timeline is announced; (c) the PrivatBank legal overhang is
      formally resolved; and (d) the post-war reconstruction thesis materially advances.

      The specific diligence asks documented in this chapter are: full consolidated management
      accounts for FY2024 and FY2025 spanning both Fintech Band and Universal Bank; a detailed
      breakdown of the intercompany fee agreement; an audited FY2025 Fintech Band IFRS report;
      the cap table post-UMAEF (including the UMAEF consortium's full composition and total
      stake); and the lock-up provisions, preference stack, and anti-dilution terms in the UMAEF
      investment agreement. These items represent the minimum information set required to move
      from a track to a buy thesis.
