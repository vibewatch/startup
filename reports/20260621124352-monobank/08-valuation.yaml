  - id: investment-thesis-scenarios
    title: Investment Thesis, Anti-Thesis, and Bull/Base/Bear Scenarios
    body: >-
      The investment thesis for Fintech-IT Group rests on three pillars: (1) monobank's dominant
      market position — Ukraine's leading neobank by NPS and digital engagement, ranked top 35
      globally by CNBC for two consecutive years — creates a durable competitive moat; (2) the
      technology-company framing at Fintech-IT Group implies a software valuation multiple rather
      than a regulated-bank multiple, and software companies command premium exit valuations on
      US exchanges; and (3) UMAEF's role as a U.S. government-linked first institutional investor
      provides a bridging function toward potential US IPO, reconstruction-era capital flows, and
      credibility with subsequent investors.

      The anti-thesis is equally substantive. Fintech Band's FY2024 revenue declined 33% and
      profit fell 63% year-on-year, creating immediate pressure on any multiple-based argument.
      Approximately 90% of Fintech Band's revenue is derived from a single client — Universal
      Bank — creating severe revenue concentration risk. The $1 billion valuation is entirely
      anchored on a single small-stake transaction (estimated ~$18.5 million for ~1.9%), which
      could reflect strategic and political motivations (asset protection, Western signalling, IPO
      staging) rather than pure financial underwriting. The PrivatBank litigation overhang (former
      shareholders of PrivatBank receiving criminal suspicion notices) remains an unresolved legal
      risk. There is no audited consolidated P&L available to international investors, no lock-up
      disclosure, and no clear redemption timeline.

      An adverse hypothesis raised by Ukrainian market observers is that the UMAEF investment
      was primarily motivated by asset-protection considerations tied to the PrivatBank
      litigation environment — i.e., Western institutional co-ownership makes asset seizure or
      legal action against Fintech-IT Group's principals more politically complex. Forbes Ukraine
      described this hypothesis explicitly while noting it remains unconfirmed. If true, the
      $18.5 million investment would have served primarily as insurance, not as a pure financial
      endorsement of the $1 billion mark.
