- id: capital-and-stakeholders
  title: Capital and stakeholders
  body: 'Mesh’s financing record is the chapter’s clearest evidence of market validation. Public materials show a step-up
    path from a $22 million Series A in 2023, to an $82 million Series B in March 2025, to additional strategic financing
    in August 2025, and finally to a $75 million Series C at a $1 billion valuation in January 2026. By the company’s own
    accounting and multiple independent echoes, total funding has moved from more than $32 million after Series A to more
    than $200 million after Series C. The investor base also evolved from classic venture support to a more strategically
    useful syndicate. Money Forward and Galaxy help explain the earlier embedded-finance framing, while Paradigm, Dragonfly,
    Coinbase Ventures, SBI Investment, and PayPal Ventures align more directly with the current crypto payments and stablecoin
    thesis. PayPal is especially important because the relationship appears in both financing and commercial surfaces through
    PYUSD settlement and Pay with Crypto. The strongest caveat is that capital formation is much more transparent than operating
    economics: investor quotes and partner counts are public, but revenue quality, customer concentration, and monetization
    against headline network reach remain undisclosed.'
  claimRefs:
