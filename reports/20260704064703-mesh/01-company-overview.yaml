- calloutType: risk
  title: Compliance and disclosure are the main underwriting friction points
  body: Sanctions-sensitive rails, broad contractual rights over customer data, and missing public evidence on current board
    composition and operating metrics mean diligence should focus more on controls and economics than on the growth story
    alone.
