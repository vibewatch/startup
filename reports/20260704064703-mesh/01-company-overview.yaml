  title: Public story has evolved faster than public economics
  body: Mesh has successfully moved its narrative from connectivity middleware to universal crypto-payments infrastructure,
    and the financing record validates that repositioning. The public record is much stronger on network reach, interoperability,
    and ecosystem momentum than on monetization quality.
  claimRefs:
