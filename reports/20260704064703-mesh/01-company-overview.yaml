- id: FO002
  title: Company snapshot logic
  type: flow
  layout: standard
  summary: Mesh’s public product logic links enterprise apps, tokenized payment intent, orchestration, and settlement controls.
  data:
    nodes:
    - id: n1
      label: Business customer app
      detail: Enterprise customer or developer-owned application initiates the flow.
    - id: n2
      label: Mesh API + link token
      detail: Customer server configures session, transfer type, assets, amounts, and destinations.
    - id: n3
      label: Mesh SDK / Link UX
      detail: Client-side experience handles wallet or exchange connection, previews, and callbacks.
    - id: n4
      label: Connected wallets & exchanges
      detail: Users bring assets from one of 300+ connected wallets or exchanges.
    - id: n5
      label: SmartFunding orchestration
      detail: Mesh routes and converts from the user’s asset into the merchant’s desired settlement asset.
    - id: n6
      label: Settlement + webhooks
      detail: Merchants receive stablecoin or fiat preference while signed webhooks confirm final transfer outcomes.
    - id: n7
      label: Ecosystem layer
      detail: MAP and partner rails broaden optionality across wallets, issuers, exchanges, and enterprise channels.
    edges:
    - from: n1
      to: n2
      label: configures
    - from: n2
      to: n3
      label: launches
    - from: n3
      to: n4
      label: connects
    - from: n4
      to: n5
      label: funds
    - from: n5
      to: n6
      label: settles
    - from: n6
      to: n1
      label: confirms
    - from: n7
      to: n5
      label: extends routes
  approximationNotes: The flow abstracts multiple docs and marketing pages into a single public operating model; it is directional
    rather than a screenshot of one exact API implementation.
