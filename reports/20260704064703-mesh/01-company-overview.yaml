  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-board-disclosure
    missingEvidence: A current board roster, observer rights, committees, and any governance documents beyond the 2023 board-addition
      announcement.
    whyItMatters: Board composition and governance rights determine investor influence, oversight quality, and how much decision-making
      remains founder-concentrated.
    diligencePath: Request the latest board deck, cap table, investor rights summary, and biographies for all current directors
      and observers.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: customer-and-volume-disclosure
    missingEvidence: Audited or board-level figures for current customer count, concentration, monthly volume composition,
      revenue, and gross margin.
    whyItMatters: The public narrative has moved from partner counts to 900M-user reach and almost $10B monthly volume, but
      underwriting still requires monetization quality and customer concentration evidence.
    diligencePath: Request cohort revenue, top-customer concentration, audited transaction-volume methodology, and a bridge
      from gross volume to net revenue.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-coverage
    missingEvidence: Ownership percentages, board observer rights, debt facilities, secondaries, and whether major strategic
      investors have commercial exclusivity or preferred economics.
    whyItMatters: The public stakeholder map is directionally useful but not sufficient to infer control, alignment, or downside
      protections at the cap-table level.
    diligencePath: Obtain the latest cap table, financing docs, side letters, and any commercial agreements with strategic
      investors such as PayPal or exchange partners.
    relatedTableRefs:
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: Exact public dates for several historical launch and partner milestones plus any licensing or compliance
      milestones tied to expansion geography.
    whyItMatters: Chronology matters because it shows whether commercial traction, product launches, and governance hardening
      are keeping pace with fundraising and geographic expansion.
    diligencePath: Ask management for a dated milestone tracker covering launches, regulated partnerships, compliance reviews,
      and major customer go-lives.
    relatedTableRefs:
    - TO004
