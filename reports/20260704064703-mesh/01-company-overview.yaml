company:
  name: Mesh
chapter:
  number: 1
  title: Company Overview
  summary: Mesh is a private Series C-stage crypto payments infrastructure company that pivoted from earlier open-finance
    connectivity roots into a wallet-to-merchant interoperability network. Public evidence strongly supports the identity,
    founder continuity, funding chronology, and January 2026 unicorn valuation, but revenue quality, audited volume methodology,
    customer concentration, and current board composition remain undisclosed.
sections:
- id: identity-and-operating-model
  title: Identity and operating model
  body: 'Mesh now presents itself as a Series C-stage crypto payments infrastructure company rather than a consumer finance
    application. The official site repeatedly describes the company as the first global crypto payments network and frames
    its offer as one integration that lets a customer accept crypto from hundreds of wallets and exchanges while settling
    in stablecoins or local currency. That framing is consistent across the homepage, about page, Series C materials, and
    product pages. The company’s public legal and technical surfaces also make the operating model more concrete than the
    marketing slogan alone: Mesh Connect Inc. is the named entity in the terms and privacy policy; the docs show a three-party
    model spanning a customer server, client application, and Mesh; link tokens configure sessions; and signed webhooks, not
    just client callbacks, are the final control point for transfers. Together those materials support a clear canonical view
    for later chapters: Mesh sells infrastructure to business customers and developers, not a mass-market wallet, and its
    most defensible public product wedge is routing and settlement abstraction across fragmented crypto rails.'
