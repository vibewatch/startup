- id: leadership-and-governance
  title: Leadership and governance
  body: 'The public leadership record is strong on executive naming and weak on full governance disclosure. Mesh’s about page
    names a broad operating bench under co-founders Bam Azizi and Adam Israel, including executives across technology, product,
    revenue, legal, security, and people operations. That breadth matters because it reduces the chance that the business
    is literally a one-person show. At the same time, the outward story is still highly founder-shaped. Independent coverage
    ties Azizi’s background to a prior NoPassword exit and describes Israel as coming from HSBC, while CNBC and Motivate both
    frame Mesh through Azizi’s personal thesis about abstracting wallet and chain fragmentation. The best public board evidence
    is still historical: the Series A announcement that Sandy Kimura and Anil Arora joined the board. No current board roster,
    observer rights, or committee structure is surfaced in the reviewed materials. Legal documents add another governance
    dimension: Mesh reserves broad usage-quota and fee-setting rights, requires individual arbitration, and claims rights
    to use anonymized customer data for product improvement and training, while the privacy policy expands the third-party
    data-processing footprint through analytics, Clay, and AI chatbot providers.'
