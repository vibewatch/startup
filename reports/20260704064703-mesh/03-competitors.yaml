- id: pricing-packaging-and-substitute-pressure
  title: Pricing, Packaging, and Substitute Pressure
  body: |-
    Pricing transparency is one of the cleanest separators in the field. BitPay still publishes visible merchant acceptance tiers, while Coinbase discloses a migration-era 1% transaction fee and Eco’s 2026 comparison publishes benchmark checkout fees for Coinbase, Stripe, and BitPay. By contrast, Mesh, MoonPay, Checkout.com, Ramp Network, and BVNK mostly push buyers toward contact-sales or onboarding discussions, which implies a sales-led, negotiated market where take rates, FX spreads, implementation charges, and volume discounts are private. That opacity weakens outside-in competitive diligence because public buyers cannot easily test whether a specialist’s routing and settlement story beats an incumbent bundle on net economics.

    Substitute pressure is therefore real even when one vendor’s feature set looks broader on paper. Spark’s landscape shows how much of the category can be decomposed into components: payment acceptance, KYC, banking rails, liquidity, blockchain delivery, and payout flows. A large PSP or marketplace can combine incumbent checkout, a stablecoin settlement partner, and ramp APIs instead of standardizing on Mesh. Smaller merchants can often choose between no-code or merchant-ready options such as Coinbase or BitPay. The practical implication is that Mesh must win by reducing operational complexity, time-to-launch, and failure rates enough to justify adding another vendor into the stack, not simply by claiming support for stablecoins.
