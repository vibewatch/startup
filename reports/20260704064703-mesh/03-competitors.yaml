- id: moat-durability-and-key-risks
  title: Moat Durability and Key Risks
  body: |-
    Mesh does have a credible wedge. The strongest public evidence is around orchestration: embedded flows, wallet-and-exchange connectivity, automatic conversion, route selection, local-currency settlement, and customer-proof around reduced deposit failure. For PSPs and platforms that care more about conversion and payout completion than about owning custody or building routing in-house, that story is meaningful. The Alliance Program and Circle expansion also show an effort to make Mesh the neutral interoperability layer rather than just another endpoint in a fragmented stack.

    But the moat is conditional, not absolute. Public data still does not show win rates, merchant volume, attach rates across the claimed 100+ companies, or what portion of the value proposition is unique rather than reproducible via incumbents and multi-vendor buildouts. MoonPay and BVNK already market broad modular coverage, Coinbase and Stripe are expanding stablecoin-first business tooling, and Visa and Mastercard are pushing stablecoin settlement toward network-level infrastructure. If those larger platforms keep absorbing receive-convert-payout capabilities, Mesh risks being squeezed into a narrower orchestration niche. That niche can still be valuable, especially for fragmented crypto-source flows, but durability will depend on proof that Mesh meaningfully improves conversion, speed, and operational simplicity beyond what merchant stacks and network incumbents can bundle.
