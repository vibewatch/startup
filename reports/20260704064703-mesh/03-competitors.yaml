  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: mesh-pricing-transparency
    missingEvidence: Net take rate, FX spread, implementation fee, and volume discount data for Mesh enterprise contracts.
    whyItMatters: Outside-in pricing work is weak when most peers are sales-led and the company does not disclose realized economics.
    diligencePath: Request three recent proposals or signed contracts plus gross margin by product line for payments, deposits, and payouts.
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: mesh-win-loss-data
    missingEvidence: Win rates and loss reasons against MoonPay, BVNK, Coinbase, Stripe, and incumbent PSP bundles.
    whyItMatters: The moat depends on whether Mesh wins when buyers already have viable stablecoin features from larger vendors.
    diligencePath: Ask management for the last 20 competitive deals with incumbent and crypto-native alternatives, including pricing and implementation differences.
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: mesh-network-density
    missingEvidence: Independent data on transacting merchants, GMV, repeat usage, and active-wallet conversion across the claimed customer base.
    whyItMatters: Public case studies suggest value, but they do not prove that network density and retention are compounding at category scale.
    diligencePath: Request monthly cohort metrics for active merchants, active payers, failed-payment rate, and repeat funded-user rate by product module.
    relatedTableRefs:
    - TP001
    - TP004
