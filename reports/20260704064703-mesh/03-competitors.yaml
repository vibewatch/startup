tables:
- id: TP001
  title: Competitor Profile Table
  enumeration: true
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant direct peers, incumbent stacks, and substitutes evidenced in the retained 2026 source set.
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Mesh
    - Crypto payment orchestration network
    - 100+ companies; 300+ wallets/exchanges; 900M+ claimed reachable users
    - PSPs, platforms, merchants needing embedded crypto acceptance and settlement
    - SmartFunding orchestration across fragmented user assets with stablecoin or local-currency settlement
    - No public pricing; public traction data is still mostly company-authored case-study evidence
  - - MoonPay
    - Unified payments platform
    - 10B+ volume; 35M+ verified accounts; 500+ partners; 180+ countries
    - Wallets, marketplaces, consumer apps, merchants
    - Combines ramps, commerce, stablecoins, and trade in one large consumer-facing platform
    - Public pricing for enterprise commerce is not transparent and product breadth can exceed what simple merchants need
  - - Coinbase Business
    - Stablecoin-first business account
    - Coinbase operating account with custody, offramps, payouts, invoicing, and yield
    - Startups, SMBs, merchants wanting custodial business tooling
    - Turns former Commerce traffic into a fuller custodial payments-and-treasury stack
    - Region availability remains narrower than a global open network and the model is more custodial than Mesh’s routing narrative
  - - BVNK
    - Managed and self-managed stablecoin infrastructure
    - $25bn+ annual payments processed; 150+ countries; up to $1.8bn Mastercard deal value
    - PSPs, neobanks, platforms, treasury and payout teams
    - Offers both managed flows and in-house control over liquidity, custody, licensing, and routing
    - Sales-led enterprise motion and heavier infrastructure posture than a checkout-first merchant tool
  - - BitPay
    - Merchant crypto payments processor
    - Public volume-tier pricing; omnichannel merchant tools
    - High-volume merchants, ecommerce, B2B payments, payroll
    - Visible pricing, fiat settlement, plugins, in-store and invoicing workflows
    - Less differentiated on orchestration of fragmented external holdings than Mesh or BVNK
  - - Stripe / Checkout incumbent stack
    - Incumbent merchant-acquiring and platform stack
    - Large existing merchant distribution plus Bridge, Treasury, and Coinbase-powered stablecoin acceptance
    - Enterprise merchants and platforms already standardized on incumbent PSPs
    - Can add stablecoins without forcing a new primary payments vendor
    - Stablecoins are only one feature inside broader stacks, so specialized crypto UX may be less customizable
  - - Visa / Mastercard network layer
    - Network-level settlement incumbent
    - Visa stablecoin pilot at $7B run rate; Mastercard adding stablecoin settlement and acquiring BVNK
    - Issuers, acquirers, banks, PSPs, and regulated institutions
    - They can normalize stablecoin settlement inside trusted global networks and preserve existing protections
    - They do not directly solve wallet-connectivity or embedded exchange orchestration for every merchant use case
  - - Internal build / multi-vendor stack
    - Substitute
    - Uses incumbent checkout plus selected APIs, docs, and ramp partners
    - Large PSPs, marketplaces, or fintechs with deep engineering teams
    - Maximum control over custody, compliance, and vendor selection
    - High engineering, compliance, reconciliation, and routing burden
  notes: Scale signals are drawn from retained official pages or reputable independent market coverage as of the 2026 run date; undisclosed commercial metrics are left qualitative rather than inferred.
