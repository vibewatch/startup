- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Current public evidence
  - Diligence ask
  rows:
  - - Mesh reduces asset-mismatch friction better than a generic stablecoin checkout button
    - Incumbent stacks can make stablecoins another payment method and narrow the UX gap
    - High
    - Checkout, Stripe, Visa, and Mastercard are all productizing stablecoin rails inside broader networks
    - Request win rates where merchants compared Mesh against incumbent bundles
  - - SmartFunding routing creates measurable conversion upside
    - Customer proof may stay anecdotal if only a handful of case studies are public
    - Medium
    - Kalshi case study shows strong deposit uplift but no broad cohort benchmark across customers
    - Ask for before-and-after conversion and failure-rate data across multiple verticals
  - - Single integration across fragmented sources lowers PSP complexity
    - BVNK self-managed, MoonPay modules, and internal build can mimic large parts of the flow
    - High
    - Public docs show multiple vendors now expose receive, payout, ramp, and settlement components
    - Ask for implementation timelines and engineering hours saved versus alternative stacks
  - - Neutral interoperability layer could compound network effects
    - Visa, Mastercard, and large PSPs can define their own interoperability standards or buy them
    - High
    - Mastercard is acquiring BVNK while Visa is expanding multi-chain settlement through its own network
    - Ask whether MAP creates exclusive routing or simply reduces table-stakes integration work
  - - Sales-led packaging preserves pricing power
    - Opaque pricing can become a disadvantage when BitPay and benchmark pages anchor buyer expectations
    - Medium
    - BitPay publishes tiers while many orchestration vendors do not publish enterprise list prices
    - Ask for realized gross margin, FX spread economics, and pricing discipline in competitive deals
  notes: Severity measures risk to Mesh’s ability to remain a differentiated orchestration layer, not to stablecoin adoption overall.
