  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场结构与 Mesh 定位
        blocks:
          - type: paragraph
            body: >-
              Mesh 并不处在一个干净的单一供应商品类里。公开产品覆盖存款、结账、付款和稳定币结算，并由一个编排叙事串起来：用户已经把资产放在许多钱包和交易所；商户和 PSP
              想在一条偏好的轨道上收到一种偏好的资产或本地货币。Mesh 自己的页面反复把问题描述为资产碎片化、应用切换、路由选择和转账失败，而不是简单的“接受 USDC”功能。这个表述重要，因为它把 Mesh
              放得更接近编排层，而不是简单商户网关。Kalshi 案例研究也强化了这一点：公开证明不是泛化 GMV，而是更好路由和兑换减少了存款失败，并扩大了可用资产与网络。


              这个定位带来一个宽泛但不稳定的竞争集合。直接同业包括 MoonPay、BVNK、BitPay、Coinbase
              Business，以及现在能覆盖更多收款-兑换-付款链条的入金基础设施供应商。Stripe、Checkout.com 等既有厂商从上方压缩品类，把稳定币变成更广商户栈里的另一种支付方式。Visa 和
              Mastercard 则从网络层压缩品类，把稳定币结算变成现有全球支付基础设施中的一个选项。结果是，Mesh 最强的竞争主张不是原生支持稳定币，而是降低碎片化资产、错配轨道和跨境结算摩擦带来的运营与用户体验混乱。
