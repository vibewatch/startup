  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 披露交易量维持在接近 $120B 年化水平，已实现净抽成率大约达到 20 bps，Mesh 拿到 10x-12x 的软件型或网络邻近型倍数。
        - 该情景隐含约 $2.4B-$2.9B 价值，事后看当前 $1B 入场价有吸引力。
        - 既有巨头打包、抽成率受压或利润率偏弱，都会很快打穿溢价。
        - 需要披露收入大致超过 $200M，且利润率健康、集中度低。
      - - 基准
        - 披露交易量真实，但有效变现更接近 10 bps；公开市场最终只会给 7x-9x，因为披露仍像私营公司一样单薄。
        - 由此得到约 $0.84B-$1.08B；只有执行保持干净，今天的标记才大致算合理。
        - 市场给私营公司不透明性或监管风险打的折扣，可能仍高于该区间假设。
        - 只有低数亿美元收入已经坐实，当前价格才说得通。
      - - 悲观
        - 总交易量相对可变现流量被高估，抽成率更接近 5 bps，市场按有争议的支付应用给 Mesh 定价，收入倍数只有 4x-6x。
        - 由此得到约 $0.24B-$0.36B，意味着当前标记面临明显下行或下轮降估值风险。
        - 若条款偏重优先股，或客户集中度高，普通股下行会比头条降值更糟。
        - 只要披露显示抽成率低、利润率低，或高度依赖少数合作伙伴，投资判断就会落到这里。
    notes: 情景测算使用披露月交易量和抽成率敏感性，因为 Mesh 不公开收入、ARR 或利润率。
