      - number: '7.2'
        title: 运营、安全与欺诈控制风险是下一层关键风险
        blocks:
          - type: paragraph
            body: >-
              Mesh 的公开控制叙事可信，但任何环节在真实负载下失效，下行后果都很重。公司称已通过 SOC 2 Type II 认证，采用零信任，强制
              MFA，并让产品接受第三方渗透测试。它的文档也说明运营执行有多难：每条流程都从短期、一次性会话 token 开始，还叠加受限域名、客户自管 API key，以及面向用户的 SDK 或 PayLink
              编排。Mesh Verify
              的设计目标，正是拦住那些在加密支付里会变成生死问题的风险——资产来源不明、资金冻结、人工整改，以及没有拒付保护的欺诈损失。但同一批文档和营销页面也隐含承认了风险：资产一旦落地，平台就吸收合规敞口和运营痛点。因此欺诈背景很关键。Chainalysis
              和 CoinDesk 描述，AI 驱动的冒充与诈骗活动上升速度快于传统网络攻击叙事，交易前验证、策略调校和例外处理因此成为核心控制，而不是可选项。
