      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录在高管名单上很充分，在完整治理披露上偏弱。Mesh 关于页列出 Bam Azizi 和 Adam Israel
              两位联合创始人之下的一套较宽运营班底，覆盖技术、产品、营收、法务、安全和人力运营。这个宽度重要，因为它降低了公司实际上是一人驱动的概率。与此同时，外部叙事仍高度围绕创始人展开。独立报道把 Azizi 的经历与此前
              NoPassword 退出联系起来，并称 Israel 来自 HSBC；CNBC 和 Motivate 都通过 Azizi 对抽象钱包与链碎片化的个人判断来讲述
              Mesh。最强的公开董事会证据仍是历史资料：Series A 公告称 Sandy Kimura 和 Anil Arora
              加入董事会。审阅材料没有披露当前董事会名单、观察员权利或委员会结构。法律文件又补了一层治理维度：Mesh
              保留广泛的使用额度和费用设定权，要求个人仲裁，并主张可将匿名化客户数据用于产品改进和训练；隐私政策还通过分析工具、Clay 和 AI 聊天机器人服务商扩大第三方数据处理范围。
