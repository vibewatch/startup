        title: 牵引力与公开单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              公开牵引力远比公开收入容易看到。Mesh 官方界面反复强调 300+ 个受支持钱包和交易所、横跨 24+ 个网络的 120+ 种 token，以及超过 100
              家公司使用该网络。独立报道补充了更强的使用代理指标：PYMNTS 报道 Dragonfly 的观点称，Mesh 已经接近 $10 billion 月交易量。客户证据也重要。Kalshi 案例研究称，月存款笔数增长
              177%，约四分之一存款已通过 SmartFunding 路由，覆盖从 3 条路径扩至 14 个网络上的 27 种资产，从首次 API 调用到生产只用了 48 小时。World App
              又给出另一个可见规模信号：Mesh 接入的平台覆盖 160 个国家和近 18 million 名已验证用户。


              即便如此，单位经济桥梁仍只是一组代理。这些数字支持产品相关性、集成深度和渠道覆盖，但不能直接转成留存收入。公开资料没有 CAC、回本周期、净留存率（NRR）、客户集中度，也没有产品级 GMV
              抽成率。本章因此把集成、案例研究提升和月交易量视为商业验证，而不是经审计收入质量的替代品。
