      - number: '8.2'
        title: 可比公司参照与稀缺性溢价压缩
        blocks:
          - type: paragraph
            body: >-
              最干净的外部核验是上市可比公司的区间。2026 年 7 月最新市场数据和 2025 年 SEC 文件锚点显示，Coinbase 约为 7 倍销售额，PayPal 和 Block 约为 1 到 2 倍，Visa 和
              Mastercard 在十几倍中段，Robinhood 高于 20 倍。这个区间有用，因为它说明 Mesh 正被放进一条很宽的潜在类比走廊。如果 Mesh
              最终像高毛利结算网络，当前价格可能保守；如果它更像竞争激烈的商户赋能或加密支付应用，同一估值就可能已经充分。当前竞争格局不支持支付纯稀缺性溢价。Coinbase Business
              已经在营销带合规工具的即时全球稳定币支付，Stripe 把稳定币受理结算成本地货币，Visa 称稳定币试点正以 $7 billion 年化节奏运行，Mastercard 正把受监管稳定币结算加入核心网络，BVNK
              和 BitPay 则显示专业玩家规模和可见的价格压力。这些在位者验证了品类，但也压缩了 Mesh 在自身经济性可见前应获得的溢价。
