      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方图谱比直接商户更宽，但比完整数字资产栈更窄。NCA
              报告里的商户证据显示，结账场景存在真实拉力，尤其在旅游、酒店、游戏和其他国际化敞口较高的细分领域；但报告也明确指出，简单易用才是准入条件。十分之九的商户表示，如果加密支付像刷卡一样简单，他们会尝试。由此，最佳买方目标更偏向能用一次集成聚合大量终端商户或钱包持有者的运营方。Mesh
              自身定位和 PYMNTS 描述指向金融科技公司、类 PSP
              平台、钱包、交易所和企业商户，这些是最相关的经济买方；开发者、运营团队和支付产品团队则是实际用户。在付款和跨境流中，司库与财务负责人会成为关键买方，因为价值主张从“接受加密”转向“降低结算摩擦、被困资本和 FX
              时间风险”。采用路径因此从好奇心和客户需求开始，经过渠道压缩、嵌入式集成、合规结算，最后走向规模化生产部署。
