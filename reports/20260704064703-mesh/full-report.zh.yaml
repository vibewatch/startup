      - number: '3.3'
        title: 既有分发与网络力量
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争压力来自已经掌握商户分发的既有厂商。Checkout.com 借 Coinbase 推出稳定币受理，战略上值得注意，因为它把稳定币视为现有企业收单关系的延伸，而不是一个独立供应商品类。Stripe
              也从两侧朝同一方向移动：Treasury 把稳定币余额和付款变成 Stripe 更广金融栈内的资金流动能力；稳定币支付则把本地货币结算和钱包结账加进已经深扎商户的平台。CNBC 关于 $1.1 billion
              Bridge 收购的报道让意图更清楚：Stripe 不只是试水加密结账，而是在买入更深的稳定币和跨境基础设施。


              Visa 和 Mastercard 把天花板进一步抬高，因为它们可以把稳定币结算正常化，放进已经触达银行、发卡方、收单方、PSP 和全球商户的网络。Visa 的试点现在横跨九条区块链，运行率 $7
              billion。Mastercard 同时在扩大受监管稳定币结算，并收购 BVNK，以补上可互操作的法币-稳定币编排。这意味着 Mesh 不只是在与其他加密原生供应商竞争，还在面对一种可能：大型商户和 PSP
              可以从他们已经信任、已经集成、也已经购买相邻服务的供应商那里，拿到“足够好”的稳定币功能。分发杠杆，而非产品新奇度，是这个类别里最深的既有厂商优势。
