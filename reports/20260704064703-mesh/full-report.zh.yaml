      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              稳定币支付的公开规模测算，对“到底在测什么”极其敏感。Federal Reserve 2026 年 4 月笔记把市值定在 $317 billion，CoinLaw 则引用一个到 2026 年超过 $2
              trillion 的激进情景。两者都是存量指标，不是收入或支付流指标。交易流估计更分散。CoinLaw 引用 2025 年 $33 trillion 原始链上稳定币交易量和超过 $10 trillion
              的过滤后口径；Crypto Valley Journal 总结的 McKinsey 和 Artemis 分析则称，实际支付只有约 $390 billion。Artemis 进一步说明差异为何持续存在：即便在
              Ethereum 上，支付标签、智能合约过滤和企业内部转账也会大幅改变答案。对 Mesh
              来说，最有用的公开视角因此是软件收入池和企业相关支付流切片，而不是最宽泛的交易量或市值数字。保留证据支持一个庞大且增长中的类别，但不支持懒散地宣称每一美元稳定币都是 Mesh 可服务 TAM。
