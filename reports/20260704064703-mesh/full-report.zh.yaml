  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚点与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Mesh 2026 年 1 月的独角兽轮融资足够真实，可以作为估值锚点。公司公告、PR Newswire、The Block 和 CoinDesk 都指向同一组事实：由 Dragonfly 领投，新增资本 $75
              million，估值 $1 billion，累计融资超过 $200 million。这一点重要，因为它证明成熟投资人愿意出这个价，而不只是管理层想讲一个好故事。公开档案也包含真实运营验证。Mesh 声称覆盖
              300 多个钱包和交易所、100 多家公司、超过 900 million 可触达用户；PayPal 集成、Kalshi 案例研究、World App 入金集成和 USDC
              结算扩张也说明产品不是纸面概念。核心承销问题在于，同一份公开档案仍隐藏了最关键的分母：当前 ARR 或确认收入、毛利率、烧钱速度、现金、集中度，以及 Series C
              的具体条款。这种组合让当前估值标记作为事件可信，但作为入场点信息不足。
