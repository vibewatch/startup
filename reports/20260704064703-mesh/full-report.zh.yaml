      - number: '7.4'
        title: 团队、执行与财务模型风险仍披露不足
        blocks:
          - type: paragraph
            body: >-
              公开证据显示 Mesh 有不低的执行能力，但没有补上承销缺口。Mesh 现在称团队超过 100 人，分布在四个地区；公司也显然有足够野心，同时推进支付、存款、付款、验证、AI
              智能体商务和全球合作伙伴扩张。Series C 材料和 PYMNTS 报道说明公司有资金支撑扩建，接近 $10 billion
              的月交易量代理指标也意味着平台承载的是真实吞吐，而不只是演示流量。但投资人核心问题不是 Mesh
              是否忙碌，而是经济性是否有吸引力、是否可治理。公开来源仍未披露费率、毛利率、合作伙伴费用留存、客户集中度或董事会层面的风险归属。也就是说，外界是在用规模和野心信号评估执行负担，而不是用经审计的控制、财务和治理披露评估。在监管收紧环境下，这种不对称是实质风险因素，不只是私营公司常见的不便。
