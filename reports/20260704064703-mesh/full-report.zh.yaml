        blocks:
          - type: paragraph
            body: >-
              Mesh 很大一部分公开客户证据，其实是渠道或轨道证据。PayPal、Shift4、Circle、Stellar、Tempo、Paxos 和 GDN
              都重要，因为它们表明严肃的支付或资产基础设施玩家愿意在某个流程环节依赖 Mesh。但这些证据证明的东西并不相同。PayPal 和 Shift4
              是最清晰的渠道证明，因为公开来源描述了触达商户和终端用户的实时受理流程；Shift4 甚至点名早期客户 TAO Group 和 BLADE。Circle、Stellar、Tempo、Paxos 和 GDN
              则更混合。它们扩展了企业结算选项、稳定币分发或已验证来源存款能力，但多数公告没有披露直接商户数、交易结果或客户留存。Alliance Program 强化了这一战略：Mesh
              想在碎片化的网络之网中占据互操作性。战略上有吸引力，因为一个渠道关系可以放大下游触达；但这也意味着投资人应把生态接入与已经验证的客户变现拆开看。
