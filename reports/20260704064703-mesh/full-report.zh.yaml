  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              定义 Mesh
              市场，最干净的方式不是把它算进“所有稳定币”或“所有加密”，而是圈定一组更窄的工作流：企业想从钱包或交易所收取价值，并把它结算成稳定币或法币，同时不把波动、合规或集成复杂度压到自己资产负债表上。Mesh
              自身材料始终描述一个位于商户结账、钱包连接、付款编排和结算选择之间的网络。纳入范围因此是支付受理软件、钱包和交易所连接、付款路由、出金与 FX
              工具，以及可靠运行这些流程所需的运营管道。不纳入稳定币发行、储备管理、投机交易和通用 DeFi
              交易量。这个边界重要，因为公开市场标题仍会把真实支付、内部转账和交易混在一起。保留下来的证据指向一个市场：瓶颈是编排和可信连接，而不是再造一个钱包或再发一种稳定币。
