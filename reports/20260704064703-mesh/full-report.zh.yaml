  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管重新分类或牌照失败
        - 具名监管机构、银行伙伴或大客户要求补救性牌照或资金流重设计
        - 任何有约束力的整改通知，或核心产品通道上已签署的伙伴冻结
        - 暂停受影响通道的增长假设，并按受监管基础设施而非轻量编排层重新测算模型
      - - 制裁、CIP 或 Travel Rule 控制失败
        - 重大资金受阻事件、制裁漏筛，或生产环境中反复绕过验证
        - 一起涉及客户损害或监管升级的重大事件，或迫使大规模人工复核的模式
        - 升级为红旗状态；新增走廊或伙伴前要求第三方合规审查
      - - 伙伴或稳定币传导冲击
        - 核心轨道宕机、脱锚或伙伴合规问题同时冲击多条路线
        - 核心结算轨道与高交易量分发伙伴同时受扰，或任何实质性打断结算信心的脱锚
        - 下调交易量增长假设，上调应急成本假设，并检验信任能否在一个季度内修复
      - - 欺诈损失或整改成本失控
        - 冒充、AI 诈骗或来源验证失败压垮预存款控制
        - 关键通道的欺诈损失或人工整改成本持续跑赢预期净经济性
        - 在控制指标和定价重设前，将该通道视为结构性不具吸引力
      - - 高估值下的模型不透明
        - 交易量增长，但抽成率、利润率或集中度在新一轮融资或战略合作周期前仍未披露
        - 再次大额融资、大客户推进或估值上台阶，却没有从交易量到净经济性的可信桥接
        - 从上行测算转为证据测算，出资前要求完整数据室经济性
    notes: 这些阈值是投资者监控规则，不是管理建议。它们把第 7 章从叙事性风险转成明确的推进 / 否决检查点。
