  - id: TP001
    title: 竞争对手画像表
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant direct peers, incumbent stacks, and substitutes evidenced in the retained 2026 source
        set.
    columns:
      - 竞争对手 / 类别
      - 类别
      - 规模 / 融资信号
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Mesh
        - 加密支付编排网络
        - 100+ 家公司；300+ 个钱包 / 交易所；声称可触达 900M+ 用户
        - 需要嵌入式加密收款和结算的 PSP、平台、商户
        - SmartFunding 编排分散的用户资产，并用稳定币或本币结算
        - 无公开定价；公开牵引力数据仍主要来自公司自写案例证据
      - - MoonPay
        - 统一支付平台
        - 10B+ 交易量；35M+ 已验证账户；500+ 合作伙伴；180+ 个国家
        - 钱包、市场平台、消费者应用、商户
        - 把出入金、商业、稳定币和交易合进一个大型消费者平台
        - 企业商业公开定价不透明，产品宽度也可能超过简单商户需求
      - - Coinbase Business
        - 稳定币优先的企业账户
        - Coinbase 运营账户，包含托管、出金、付款、开票和收益
        - 需要托管型企业工具的初创公司、SMB 和商户
        - 把原 Commerce 流量转成更完整的托管型支付和资金管理栈
        - 地区可用性仍窄于全球开放网络，模式也比 Mesh 的路由叙事更偏托管
      - - BVNK
        - 托管式和自管理稳定币基础设施
        - $25bn+ 年处理支付额；150+ 个国家；Mastercard 交易价值最高 $1.8bn
        - PSP、新银行、平台、资金管理和付款团队
        - 同时提供托管式资金流，以及对流动性、托管、牌照和路由的内部控制
        - 销售驱动的企业打法，基础设施姿态也比结账优先的商户工具更重
      - - BitPay
        - 商户加密支付处理商
        - 公开按交易量分层定价；全渠道商户工具
        - 高交易量商户、电商、B2B 支付、薪资
        - 定价可见、法币结算、插件、店内和开票工作流
        - 在分散外部持仓编排上，差异化弱于 Mesh 或 BVNK
      - - Stripe / Checkout 既有栈
        - 既有商户收单和平台栈
        - 庞大既有商户分发，加上 Bridge、Treasury 和由 Coinbase 支持的稳定币收款
        - 已标准化采用既有 PSP 的企业商户和平台
        - 可加入稳定币，而不迫使客户更换主支付供应商
        - 稳定币只是更宽栈中的一个功能，专业加密 UX 可能不够可定制
      - - Visa / Mastercard 网络层
        - 网络级结算既有玩家
        - Visa 稳定币试点运行率为 $7B；Mastercard 正加入稳定币结算并收购 BVNK
        - 发行方、收单方、银行、PSP 和受监管机构
        - 它们能把稳定币结算嵌入可信全球网络，并保留既有保护
        - 它们不能直接解决每个商户用例里的钱包连接或嵌入式交易所编排
      - - 自建 / 多供应商栈
        - 替代方案
        - 使用既有结账能力，加上选定 API、文档和出入金合作伙伴
        - 工程团队深厚的大型 PSP、市场平台或金融科技公司
        - 最大化控制托管、合规和供应商选择
        - 工程、合规、对账和路由负担高
    notes: 规模信号来自截至 2026 年运行日期仍保留的官方页面或可信独立市场报道； 未披露的商业指标保持定性，不做推断。
