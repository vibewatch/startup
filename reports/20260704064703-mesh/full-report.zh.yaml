            body: >-
              当 Mesh 能展示带结果的上线部署，而不是只给合作伙伴 logo 时，具名证明最强。Kalshi 是最突出的参考客户：Mesh 称这家交易所把每条加密存款路径迁到网络上，在全面部署后三个月内，月存款笔数增长
              177%，从三条存款路径扩至 14 个网络上的 27 种资产，并在 48 小时内进入生产。这对一家私有基础设施公司来说，是少见的具体生产证明。World App 是次强参考，因为 Mesh
              宣布把实时存款集成接入一个已经具备全球钱包使用量的应用，尽管没有披露转化或重复使用结果。MetaMask 提供具名证言，比 logo
              墙更强，但仍弱于完整案例研究。规模方面，轨迹方向上积极，但营销权重仍偏高：公司从 2025 年与 MetaMask、Shift4 和 Revolut 相关的覆盖声明，推进到 2026 年关于 100+
              家可信公司、300+ 个平台、横跨 24+ 个网络的 120+ 种 token，以及可触达 900 million 用户的声明，却没有披露多少账户是活跃、付费或留存的。
