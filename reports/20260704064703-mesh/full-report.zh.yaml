      - number: '4.3'
        title: 成本结构、合规负担与资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开成本故事只露出几个片段，但这些片段很关键。Mesh 自身文档展示了由交易、合作伙伴和网络组成的费用栈。产品页强调地址验证、钱包验证、webhook 驱动的结算确认，以及 PSP
              子客户控制，这些都意味着不低的合规、支持和可靠性开销。产品还横跨支付、存款、付款、稳定币结算和多商户 PSP
              工作流；如果交易量放大，应该能带来可观经营杠杆——但前提是合作伙伴费、网络费和支持强度不会吃掉大部分毛价差。正因如此，稳定币基础设施风险会直接进入 Mesh 的财务模型：Federal Reserve、IMF 和
              Chainalysis 材料都描述了稳定币采用扩大后，监管、制裁和系统性敏感度如何上升。


              融资可得性看起来远强于财务披露。TechCrunch 记录了 2023 年 $22 million Series A 和 $32 million 累计融资；官方来源随后把累计融资推到超过 $120
              million，再到 $130 million；Series C 公告称累计融资在 $1 billion 估值下超过 $200 million。Axios 后来报道称，Mesh 可能进行新一轮融资，估值最高达
              $2 billion，但那是预告性报道，不是已签约交割。仍不可得的是这些融资与当前资本充足性之间的资产负债表桥梁：审阅来源没有披露现金、烧钱速度、现金跑道或债务。
