  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与定价不透明
        blocks:
          - type: paragraph
            body: >-
              Mesh 的公开材料支持一个清晰的收入机制假设，尽管没有披露实际定价。公司现在把支付、存款、付款、验证和 PSP
              赋能打包成一个连接栈。每条线的商业逻辑都像交易驱动：用户连接现有交易所或钱包，SmartFunding
              路由或合并余额，资产在交易点兑换，商户或平台用稳定币或本地货币结算。文档也强化了这一解读：它暴露支付、存款、入金、提现和验证流程，展示程序化集成与 token
              目录，并在示例报价响应中逐项列出交易费、合作伙伴费和网络费。


              仍不透明的是投资人真正需要用于判断的层。Mesh Pay 发布文章确认，商户可以设定精确法币金额，甚至加收按百分比计算的客户端费用，但没有说明 Mesh
              自身收费多少、是否存在月度平台最低消费，或收入如何在交易加价、合作伙伴转嫁成本和企业/API 承诺之间拆分。因此，公开记录支持一个具备企业集成特征的交易编排业务，但还不能支撑干净的抽成率模型。
