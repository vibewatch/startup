  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户任务
        blocks:
          - type: paragraph
            body: >-
              Mesh 的公开界面现在更像网络化支付栈，而不是单个 SDK 小组件。面向客户的模块很好命名——Payments、Deposits、Payouts 和 Stablecoin
              Settlement——但真正的产品承诺，是把资产、链和场所错配藏进编排层。支付和存款都推销同一个结果：用户用已经持有的任何余额出资或付款，商户或平台则收到已配置的稳定资产或法币轨道。这个表述重要，因为它让
              SmartFunding 成为核心产品，而不是营销附加项。公开案例研究也强化了这一点。Kalshi 用 Mesh
              把碎片化的加密存款路径变成单一入金界面，并报告部署后，完成存款、路由宽度和跨链桥使用都出现可量化提升。World App 和 Circle
              公告显示，同一套栈被复用于消费者钱包入金和稳定币结算，而不只是狭窄的结账用例。
