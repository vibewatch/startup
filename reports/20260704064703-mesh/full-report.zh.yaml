      - number: '8.3'
        title: 情景测算与敏感性
        blocks:
          - type: paragraph
            body: >-
              由于 Mesh 不披露收入，给公司估值最诚实的方法，是反推 $1 billion 合理需要哪些条件成立。公开线索是 Bloomberg 来源报道称其月交易量接近 $10
              billion。若该数字方向正确且稳定，就意味着约 $120 billion 年化总支付量。关键缺失变量是扣除路由、兑换、流动性、合作伙伴和合规成本后，Mesh 能留下多少。按 5 个基点，这一交易量只能支撑约
              $60 million 年收入，会让当前估值显得激进。按 10 个基点，则意味着约 $120 million；如果业务质量强，$1 billion 大致合理。按 15 到 20 个基点，收入升至约 $180
              million 到 $240 million，当前估值开始更舒服。重点不是哪一个费率情景正确，而是估值支撑取决于公开材料没有揭示的隐藏变量。
