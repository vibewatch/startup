      - number: '6.4'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              投资判断问题不是缺需求信号，而是缺耐久性信号。Mesh 有可信扩张逻辑：Kalshi 从狭窄原生轨道设置扩展到全存款覆盖；MetaMask 的证言暗示产品从聚合深化到存款和入金；PayPal 与 Shift4
              等渠道伙伴可以一次性把 Mesh 暴露给许多下游商户或用户。然而，审阅到的公开来源没有披露 NRR、GRR、流失、续约率、合同期限或头部客户集中度。The Block
              明确指出管理层拒绝分享业务指标和治理细节，这限制了外部判断客户证明是否能转成粘性收入。反向来源进一步加剧风险。NCA
              的商户调查称，十分之九的商户如果设置像刷卡一样简单，就会尝试加密支付，说明摩擦仍阻碍更广推广。Spark 更进一步，认为 Stripe 和 PayPal 等既有厂商现在让稳定币受理在现有栈里变得更容易，因此
              Mesh 必须持续证明，其转化和编排层优于捆绑替代方案。公开证据因此更支持采用动能，而不是留存可见度。
