  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Mesh 的公开客户故事是
              B2B，即便终端用户交互看起来像消费级体验。公司营销一次集成，让商户、PSP、钱包、交易所或平台可以从数百个外部钱包和交易所接受加密资产，同时用稳定币或本地货币结算。这个表述让经济买方变成平台、商户或 PSP
              负责人，而不是发起转账的零售用户。用户集合更宽：产品和工程团队嵌入 SDK 和 webhook；司库与合规团队需要结算和验证控制；面向客户的团队关心减少存款失败和结账流失。公开材料还显示出清晰垂直偏向。Mesh
              反复强调 PSP、钱包与交易所、旅游、奢侈品、游戏和全球商户流——这些细分里，跨境用户、碎片化持仓，以及 chargeback 或 FX 痛点已经有意义。简言之，Mesh
              看起来是在向企业销售转化和结算基础设施，同时把零售用户既有钱包或交易所作为交互界面。
