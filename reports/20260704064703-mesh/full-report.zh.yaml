  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律边界是最高等级风险
        blocks:
          - type: paragraph
            body: >-
              Mesh 正试图成为稳定币支付的连接组织，而此时美国监管机构正把模糊地带改写成明确的发行方、AML、制裁和客户识别义务。2 月 OCC 提案、4 月美国财政部非法金融提案、6 月 FinCEN CIP
              提案合在一起，指向很清楚：获准发行方需要储备、赎回、资本、AML/CFT、制裁和客户识别计划，形态更接近受监管金融基础设施，而不是轻量 API 层。即便 Mesh
              不打算自己做发行方，这一点也重要。它的产品界面贴近发行方、托管方、交易所、PSP
              和钱包工作流；只要法律论证与合作伙伴或监管机构对资金流的归类不一致，就可能触发整改、牌照或交易对手限制。公司自己的法律文件又把风险面拉宽：文件保留了宽泛的调费、暂停、仲裁和责任限制，同时隐私政策披露了聊天机器人、分析和跨境传输活动，必须与不断演进的支付、隐私和制裁规则保持同步。
