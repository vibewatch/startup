  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 商户结账编排
        - 加密支付受理 API、钱包和交易所连接、转换，以及商户结算
        - 不含钱包或稳定币环节的通用银行卡收单或纯法币结账软件
        - 商户支付、产品和财务团队
        - Mesh Pay 的核心切入点，因为它解决接入和结算复杂度
      - - 跨境 B2B 和付款结算
        - 供应商付款、创作者或零工付款、工资和汇款相关稳定币结算工作流
        - 完全不接触钱包来源资金的纯电汇处理或资金管理系统
        - 平台和企业的资金、运营与财务负责人
        - 重要，因为观察到的支付量最大集中在 B2B 和类付款场景
      - - 钱包、交易所与平台连接
        - 嵌入式钱包绑定、代币化入金、回调、webhook 和转账编排
        - 不含商户或付款工作流的独立托管、纯消费者钱包应用或经纪接口
        - 金融科技、交易所、钱包和 PSP 产品负责人
        - 这是能为 Mesh 压缩分销成本的渠道层
      - - 结算、外汇与合规覆盖层
        - 与支付流绑定的稳定币兑法币转换、通道路由、制裁筛查和运营控制
        - 不承担支付编排角色的通用 AML 软件
        - 支付运营、合规和资金团队
        - 把原始加密资产需求转成生产级支付通道时必需
      - - 稳定币发行与储备管理
        - N/A
        - 发行方经济性、储备资产管理、鉴证和代币设计
        - 稳定币发行方和监管机构
        - 相邻，但不是 Mesh 的变现表面
      - - 投机交易、DeFi 和内部转账
        - N/A
        - 交易所换手、智能合约路由、收益耕作和钱包内部腾挪
        - 交易者、协议和做市商
        - 如果把这些大额链上量当作支付需求，会扭曲自上而下的 TAM
    notes: 边界刻意窄于全部稳定币活动。纳入支出必须需要在加密资产来源价值与商户、平台或付款结算之间做编排。
