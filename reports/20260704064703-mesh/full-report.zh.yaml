      - number: '3.4'
        title: 定价、打包与替代压力
        blocks:
          - type: paragraph
            body: >-
              定价透明度是领域内最清晰的分界线之一。BitPay 仍公开商户受理费率层级；Coinbase 披露迁移期 1% 交易费；Eco 的 2026 年比较发布了 Coinbase、Stripe 和 BitPay
              的结账费用基准。相比之下，Mesh、MoonPay、Checkout.com、Ramp Network 和 BVNK 多数把买方引向销售联系或入驻讨论，这意味着市场以销售驱动、协商定价为主，抽成率、FX
              价差、实施费和量折都不公开。这种不透明削弱了外部竞争尽调，因为公开买方很难验证，专业供应商的路由和结算故事在净经济性上是否优于既有厂商捆绑方案。


              因此，即便某个供应商纸面功能更宽，替代压力仍然真实。Spark 的市场图谱显示，这个类别很大一部分可以拆成组件：支付受理、KYC、银行轨道、流动性、区块链交付和付款流程。大型 PSP
              或市场平台可以组合既有厂商结账、稳定币结算伙伴和入金 API，而不是标准化采用 Mesh。较小商户往往也能在 Coinbase 或 BitPay 这类无代码或商户就绪选项之间选择。实际含义是，Mesh
              必须把运营复杂度、上线时间和失败率降到足以证明应在支付栈里再加一个供应商，而不是只宣称支持稳定币。
