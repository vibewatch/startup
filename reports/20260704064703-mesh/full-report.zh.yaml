      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动不是泛泛的加密热情，而是监管、成本结构和企业工作流设计的具体变化。2025 至 2026
              年，美国和欧盟的规则制定周期让支付型稳定币基础设施对机构更可读；跨境痛点在汇款、司库和代理行体系中仍很明显。Thunes 和 Federal Reserve 都解释了代币化美元 24 by 7
              流动为何能减少预先注资和链路长度。约束同样真实。Federal Reserve 和 BIS 强调中介透明度不足、储备与银行外溢，以及稳定币并不总能按平价交易。Chainalysis
              表明合规负担并非理论问题：规避制裁的资金流已经很大。对 Mesh
              来说，估值应绑定在合规编排和渠道分发的执行上，而不是只绑定“稳定币在增长”这一事实。最大的公开尽调缺口仍是定价、纯支付交易量，以及能用同一单位把活动转化为收入机会的市场模型。
