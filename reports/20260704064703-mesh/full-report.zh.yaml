      - 机制
      - 计费单位
      - 当前公开状态
      - 收入质量判断
      - 尽调问题
    rows:
      - - 商户支付编排
        - 客户从交易所或钱包付款，Mesh 负责路由并转换为商户偏好的结算资产。
        - 按结账 / 路由支付计费
        - 已在公开支付页面上线，并关联 PayPal / Shift4 用例。
        - 大概率是核心收入通道，但留存抽佣率未披露。
        - 要求按商户和 PSP 渠道提供 GMV、交易笔数、毛抽佣率和净抽佣率。
      - - 入金编排
        - 用户用已持有在其他地方的资产为应用或交易所账户入金；Mesh 处理路由和转换。
        - 按入金 / 入金账户计费
        - 已公开上线，并有 Kalshi 和 World App 引用支撑。
        - 采用信号强，但与合作通道的费用分成未知。
        - 要求按客户队列提供入金 GMV、完成入金笔数、入金失败率和贡献利润率。
      - - 付款编排
        - 平台向客户、供应商或员工付款，并转换为收款人偏好的代币或货币。
        - 按付款计费
        - 已在付款页面上线，并有降本主张。
        - 可能形成粘性 B2B 收入，但实际定价未公开。
        - 要求提供付款量、平均费用、验证成本，以及损失 / 错误调整历史。
      - - 验证与合规工具
        - 钱包所有权验证、地址校验、KYC 式信号、webhook 元数据和 Travel Rule 支持。
        - 按次验证 / 平台功能打包计费
        - 文档将其列为支付、入金和付款流程的一部分。
        - 可能支撑更高抽佣率或企业最低消费，但打包方式不透明。
        - 要求按功能提供搭售率、独立定价和合规毛利率。
      - - PSP 与子客户赋能
        - Mesh 让一个平台用独立品牌和合规设置服务多个下游商户。
        - 企业平台合同 / API 用量
        - 公开文档展示了 PSP 场景下的子客户基础设施。
        - 说明收入可能不止来自单个商户集成，但经济性未公开。
        - 要求提供最低承诺、按子客户交易量分层的定价，以及 PSP 渠道流失率。
      - - 法币入金和资金补足
        - Mesh 文档在加密余额路由之外，也展示了法币入金和购买力补足选项。
        - 按充值 / 转换事件计费
