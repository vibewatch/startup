companyProfile:
  summary: >-
    Mesh 是一家总部位于旧金山的加密支付基础设施公司，成立于 2020 年，由联合创始人 Bam Azizi 和 Adam Israel 领导。公司早期做开放金融连接，后来转向支付网络；现在把 SmartFunding、Mesh
    Pay、Mesh Connect 和转账 API 定位成钱包、交易所、PSP、商户和应用之间的通用互操作层。公开审阅资料支持几项事实：2026 年 1 月，Mesh 完成由 Dragonfly 领投的 $75M Series C
    轮，估值 $1B；累计已披露融资超过 $200M；生产关系覆盖 PayPal、Shift4、Kalshi、World App、Circle 相关结算，以及 300+
    个已连接钱包和交易所。公开记录仍没有给出规模背后的经济性桥梁：收入、实际抽成率、毛利率、烧钱速度、集中度和融资条款细节都未披露。
  founders:
    - name: Bam Azizi
      role: 联合创始人兼 CEO
      background: 博士背景技术人，此前共同创办 NoPassword，该公司于 2019 年被 LogMeIn 收购。
      claimRefs:
        - CO014
        - CO015
    - name: Adam Israel
      role: 联合创始人兼首席商务官
      background: HSBC 前董事总经理，具备企业支付和银行经验。
      claimRefs:
        - CO014
        - CO015
  foundingLocation: San Francisco, California, United States
  headquarters: San Francisco, California, United States
  productSummary: >-
    Mesh 销售一套加密支付和连接栈，让用户从现有钱包和交易所付款，同时商户或平台用稳定币或本地货币结算。SmartFunding 负责编排分散余额；Mesh Pay、账户连接流程和转账 API 则把钱包、交易所、应用和 PSP
    接入同一个结算网络。
