        - 如果 Visa、Mastercard、Stripe、Coinbase 或 BVNK 在更大捆绑包内把编排做到够用，稀缺性就会消退。
      - - 公开披露在收入、利润率、烧钱和优先权上过薄，难以在当前价格给出买入结论。
        - 反向逻辑
        - 经审计或董事会级别的经济性，加上干净条款，会显著改善可测算性。
      - - 第三方市场数据页面仍滞后于 Mesh 官方融资状态，增加尽调摩擦。
