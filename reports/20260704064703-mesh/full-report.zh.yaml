  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 公开文档指向一套分层架构：从宿主配置开始，落到转账路由、结算和异步确认。
    data:
      layers:
        - id: l1
          label: 宿主应用 / 商户 UX
          description: 支付、入金、出金或资金动作的入口
          detail: 商户决定何时请求会话，以及如何响应回调。
        - id: l2
          label: 服务端 Link Token 服务
          description: 创建短期、一次性会话状态
          detail: 转账类型、目的地、用户 ID、交易 ID 和金额约束都在这里。
        - id: l3
          label: 客户端 SDK + Link UX
          description: Web、iOS、Android、React Native 和 Flutter 的托管体验
          detail: Mesh 负责认证流程、转账预览、成功与错误状态，以及发出回调。
        - id: l4
          label: 连接性 + MMT 层
          description: 集成目录加 Mesh Managed Tokens
          detail: Mesh 处理交易场所认证、令牌刷新，并避免回访用户重新认证。
        - id: l5
          label: 报价 + SmartFunding 编排
          description: 预检定价、资金选项选择和路线优化
          detail: 路由逻辑会权衡成本、速度、可靠性、网络兼容性和费用。
        - id: l6
          label: 结算 + Webhook 确认
          description: 托管转账执行和异步状态交付
          detail: 宿主系统应把 Webhook，而不是 SDK 回调，当作最终结算记录。
