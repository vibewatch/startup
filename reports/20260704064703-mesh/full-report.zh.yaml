        - from: Partner / Stablecoin Shock
          to: Platform Volume
          label: 打断结算和路由路径
        - from: Partner / Stablecoin Shock
          to: Customer Trust
          label: 让支付轨道显得脆弱、缺乏韧性
        - from: Customer Trust
          to: Platform Volume
          label: 信任下降会压低重复使用和企业部署
        - from: Platform Volume
          to: Net Economics
          label: 没有留存或利润率支撑的交易量，会伤害经营杠杆
        - from: Net Economics
          to: Valuation / Financing
          label: 利润率不透明或被压缩，会削弱溢价倍数
    claimRefs:
      - CR017
      - CR024
      - CR048
      - CR054
      - CR055
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 关键外部依赖横跨结算、集成、合规和客户路由。
    data:
      nodes:
        - label: Mesh Network
          detail: 覆盖支付、入金、出金和验证的核心编排层
        - label: 300+ 钱包 / 交易所集成
          detail: 连接能力和轻量 KYC 数据源
        - label: Circle / USDC
          detail: 美元结算合作伙伴和稳定币轨道
        - label: Stellar
          detail: 部分资金流的核心结算链
        - label: Stable / USDT
          detail: 通过 MAP 提供 USDT 原生结算选项
        - label: 企业商户 / PSPs
          detail: 寻求稳定币或本币结算的客户层
        - label: 合规层
          detail: Travel Rule、制裁、CIP 和来源控制
        - label: 监管机构 / 银行合作伙伴
          detail: 规则制定者、监管者和受监管交易对手
      edges:
        - from: Mesh Network
          to: 300+ Wallet / Exchange Integrations
          label: 依赖上游连接和身份信号
        - from: Mesh Network
          to: Circle / USDC
          label: 通过发行方生态路由美元结算
        - from: Mesh Network
          to: Stellar
          label: 把该链作为核心结算层
        - from: Mesh Network
          to: Stable / USDT
          label: 通过 MAP 增加 USDT 原生路线
        - from: Mesh Network
          to: Enterprise Merchants / PSPs
          label: 交付面向客户的支付和出金能力
        - from: Compliance Layer
          to: Mesh Network
          label: 界定哪些交易可以清算、哪些必须拦截
        - from: Regulators / Bank Partners
          to: Compliance Layer
          label: 设定正式规则和实务控制预期
        - from: Enterprise Merchants / PSPs
          to: Regulators / Bank Partners
          label: 把尽调和受监管交易对手压力传回上游
    claimRefs:
      - CR035
      - CR039
      - CR040
      - CR041
      - CR042
      - CR052
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 判断链条从真实融资事件出发，经过产品验证、披露缺口、竞争和监管风险，最后落在继续研究上。
    data:
      nodes:
        - id: price
          label: 真实 $1B 锚点
          detail: Series C 已获官方和独立报道确认。
        - id: proof
          label: 真实产品验证
          detail: PayPal、Kalshi、World App 和 Circle 关联结算显示产品已经进入实际场景。
        - id: gap
          label: 经济数据缺失
          detail: 收入、利润率、烧钱速度、集中度和融资条款仍未公开。
        - id: compression
          label: 稀缺性挤压
          detail: Stripe、Coinbase、Visa、Mastercard、BVNK 和 BitPay 都在压窄溢价空间。
        - id: outcome
          label: 继续研究
          detail: 保持跟踪，但没有私下尽调前，不应按当前估值买单。
      edges:
        - from: price
          to: proof
          label: 支撑认真研究
        - from: proof
          to: gap
          label: 仍被抵消
        - from: gap
          to: compression
          label: 又被放大
        - from: compression
          to: outcome
          label: 导向
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV012
      - CV045
      - CV046
      - CV047
      - CV050
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 若据报道接近 $10B 的月交易量属实，抽佣率就是分水岭：估值论证是单薄还是站得住，取决于它。
    data:
      items:
        - label: 5 bps 抽佣率
          value: 60
        - label: 10 bps 抽佣率
          value: 120
        - label: 15 bps 抽佣率
          value: 180
        - label: 20 bps 抽佣率
          value: 240
        - label: 30 bps 抽佣率
          value: 360
      yAxis:
        label: 基于 $120B 年化交易量的隐含年收入（USD M）
    approximationNotes: 数值只是方向性敏感性测算，基于第三方报道的近 $10B 月交易量；并非 Mesh 披露的收入。
    claimRefs:
      - CV005
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前估值只有在 Mesh 同时跨过抽佣率门槛和溢价倍数门槛时才显得有吸引力；公开证据尚未验证这两点。
    data:
      items:
        - label: 乐观支撑区间
          low: 2400
          mid: 2640
          high: 2880
          detail: 20 bps 抽佣率，基于 ~$240M 收入给 10x-12x 倍数
        - label: 基准支撑区间
          low: 840
          mid: 960
          high: 1080
          detail: 10 bps 抽佣率，基于 ~$120M 收入给 7x-9x 倍数
        - label: 悲观支撑区间
          low: 240
          mid: 300
          high: 360
          detail: 5 bps 抽佣率，基于 ~$60M 收入给 4x-6x 倍数
    approximationNotes: 区间是情景工具，来自已报道交易量、抽佣率和倍数假设，并非公允价值点估计。
    claimRefs:
      - CV039
      - CV040
      - CV042
      - CV043
      - CV044
      - CV053
      - CV054
      - CV055
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 需求和产品验证明显强于经济披露、监管风险和当前估值支撑。
    data:
      items:
        - label: 市场需求
          value: 7
          detail: 稳定币采用和企业兴趣真实存在。
        - label: 产品验证
          value: 8
          detail: PayPal、Kalshi、World App 和 Circle 关联结算显示已有实际使用。
        - label: 渠道 / 合作伙伴
          value: 8
          detail: 300+ 钱包和交易所，加上 100+ 公司，让 Mesh 触达面真实。
        - label: 经济披露
          value: 3
          detail: 收入、利润率、烧钱速度和条款仍未公开。
        - label: 监管 / AML 风险
          value: 4
          detail: 稳定币和制裁复杂度仍是实质风险。
        - label: 估值支撑
          value: 5
          detail: 有可能成立，但公开 $1B 估值下，证据还不够扎实。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV013
      - CV035
      - CV037
      - CV046
      - CV052
      - CV053
