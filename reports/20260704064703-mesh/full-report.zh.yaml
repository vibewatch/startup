            body: >-
              Mesh 的融资记录是本章最清晰的市场验证证据。公开材料显示，公司从 2023 年 $22 million Series A，到 2025 年 3 月 $82 million Series B，再到 2025 年
              8 月追加战略融资，最后在 2026 年 1 月以 $1 billion 估值完成 $75 million Series C。按公司口径和多个独立回声，累计融资从 Series A 后超过 $32
              million，升至 Series C 后超过 $200 million。投资人基础也从典型风险投资支持，演化成战略价值更高的辛迪加。Money Forward 和 Galaxy
              能解释早期嵌入式金融叙事；Paradigm、Dragonfly、Coinbase Ventures、SBI Investment 和 PayPal Ventures
              则更直接贴合当前加密支付与稳定币逻辑。PayPal 尤其关键，因为这层关系同时出现在融资和商业界面上，包括 PYUSD 结算和 Pay with
              Crypto。最重要的保留意见是：资本形成远比运营经济性透明。投资人引语和合作伙伴数量公开，但收入质量、客户集中度，以及如何把头部网络覆盖转化为变现，仍未披露。
