  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入分母不及预期
        - 当前 ARR 或确认收入远低于用 7x-9x 倍数支撑 $1B 所需水平。
        - 即便还没计入私营公司不透明性折价，当前价格也不再显得合理。
        - 下调判断，并坚持要求明显更好的入场条款。
      - - 净抽成率过薄
        - 已实现综合抽成率在可变现交易量上更接近 5 bps，而不是 10-20 bps。
        - 披露流量不再能转化为软件型收入支撑。
        - 把 $1B 标记视为偏高到昂贵，而不是仍可争论。
      - - 客户或合作伙伴集中度高
        - 一两个平台主导交易量、收入或增长。
        - 执行风险变成二元结果，公开牵引力证据也没有看起来那么分散。
        - 下调倍数，并要求集中度契约或数据。
      - - 条款偏重优先股
        - Series C 包含强清算优先权、棘轮条款、参与权或不利普通股的结构。
        - 头条估值高估普通股质量和回报潜力。
        - 从股权结构表而不是新闻稿重新承销。
      - - 监管或 AML 事件
        - 制裁筛查失败、欺诈事件或稳定币政策冲击打断产品扩张。
        - 合规成本上升，支付合作伙伴和银行同时更谨慎。
        - 暂停新承销，直到事件被控制并量化。
    notes: 这些触发项设计成可监控，并直接对应当前建议恶化所需出现的问题。
    claimRefs:
      - CV013
      - CV035
      - CV036
      - CV037
      - CV043
      - CV049
      - CV052
      - CV055
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 当前 ARR 或确认收入
        - 当前经常性收入基数、收入确认政策，以及从增长或交易量到收入的桥接。
        - 没有分母，公开估值工作只是敏感性分析，不是承销。
        - CFO 尽调资料室、董事会材料或经审计管理账。
      - - 净抽成率
        - 按支付、入金、出款和编排流拆分的综合抽成率。
        - 只有扣除合作伙伴、FX、互换和合规成本后 Mesh 还能留下足够经济性，交易量才重要。
        - 审阅头部流量的财务和产品分析。
      - - 毛利率和贡献利润率
        - 当前毛利率、支付处理成本、欺诈损失负担和服务组合。
        - 只有经济性没有被基础设施和合规成本吃掉，类网络倍数才成立。
        - 经审计 P&L，以及分部或单位经济明细。
      - - 现金、烧钱速度和现金跑道
        - 现金余额、基准烧钱速度、下行情景烧钱速度和融资需求。
        - 即使产品需求真实，平轮或下行市场也可能迫使下一轮更艰难。
        - 资金预测和董事会运营计划。
      - - 客户集中度和留存
        - 头部客户收入或交易量组合、NRR 或 GRR，以及合作伙伴依赖。
        - 公开 logo 不能说明业务是否多元，还是一段关系变化就会重置。
        - 队列包、客户集中度明细和续约分析。
      - - Series C 经济条款和治理
        - 清算优先权、优先级、棘轮条款、老股比例和投资人权利。
        - 头条估值质量可能与普通股经济性大幅背离。
        - 与法律顾问审阅股权结构表和最新融资文件。
    notes: 这些尽调事项刻意保留缺失的公司财务和条款问题，而不是假装公开记录能回答。
    claimRefs:
      - CV013
      - CV049
      - CV056
