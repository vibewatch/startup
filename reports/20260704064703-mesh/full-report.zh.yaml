  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参照意义
      - 局限
    rows:
      - - Coinbase
        - 2025 收入 $7.18B；Jul 2 2026 市值 $43.60B
        - 6.94x 销售额
        - 最接近的上市加密基础设施可比公司，具备交易驱动变现和稳定币分发。
        - 交易所和经纪业务经济性比 Mesh 的嵌入式支付模式更波动，也更暴露于零售端。
      - - PayPal
        - 2025 收入 $33.17B；Jul 2 2026 市值 $40.11B
        - 1.19x 销售额
        - 直接商户钱包和 PSP 基准；也是 Mesh Pay with Crypto 当前合作伙伴。
        - 成熟既有巨头，增长更慢，消费者基础远比 Mesh 多元。
      - - Visa
        - FY2025 收入 $40.0B；Jul 2 2026 市值 $682.22B
        - 15.86x 销售额
        - 支付网络级结算经济性和稳定币结算扩张的最佳公开参照。
        - 规模、利润率和监管位置远强于私营成长期初创公司。
      - - Mastercard
        - 2025 收入 $32.79B；Jul 2 2026 市值 $476.60B
        - 14.04x 销售额
        - 另一家高溢价支付网络可比公司，正在把受监管稳定币结算纳入核心网络。
        - 规模和护城河差距同样巨大；倍数不能现实地直接移植。
      - - Block
        - 2025 收入 $24.19B；Jul 2 2026 市值 $47.35B
        - 1.93x 销售额
        - 对带加密邻近属性、业务利润率混杂的支付平台，是有用的下行情景基准。
        - 硬件、消费者信贷和 Cash App 组合让它与 Mesh 结构不同。
      - - Robinhood
        - 2025 收入 $4.47B；Jul 2 2026 市值 $101.51B
        - 22.01x 销售额
        - 显示公开市场愿意为增长快、贴近数字资产且叙事动能强的金融科技公司支付什么价格。
        - 经纪业务变现、市场敏感度和零售行为都与商户支付明显不同。
