    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Mesh 现在呈现的是一家 Series C
              阶段的加密支付基础设施公司，而不是面向消费者的金融应用。官网反复称自己是首个全球加密支付网络，并把产品讲成一次集成：客户可以从数百个钱包和交易所收取加密资产，同时用稳定币或本地货币结算。主页、关于页、Series
              C 材料和产品页都沿用这一表述。公司的公开法律与技术界面也让运营模式比营销口号更具体：条款和隐私政策里的具名实体是 Mesh Connect Inc.；文档展示了客户服务器、客户端应用和 Mesh
              三方模型；link token 配置会话；签名 webhook 而非客户端回调，才是转账的最终控制点。合在一起，这些材料为后续章节提供了清晰基准：Mesh
              向企业客户和开发者卖基础设施，不做大众市场钱包；公开资料里最站得住的产品切入口，是在碎片化加密轨道之间抽象路由和结算。
