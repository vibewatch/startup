            title: Mesh 真正的切入口是编排，不是泛稳定币
            body: 多数公开稳定币标题描述的是存量或转账活动，Mesh 并不能直接变现。可投资的切入口，是把钱包需求转化为商户、付款和司库结算的软件与工作流层。
            calloutType: insight
