      - number: '5.3'
        title: 信任、可靠性与合规控制
        blocks:
          - type: paragraph
            body: >-
              Mesh 的信任故事，在文档给出规定性控制的地方最强；在公开记录依赖摘要或访谈的地方偏弱。硬控制真实且具体：原始请求体上的 webhook HMAC 验证、基于 EventId 的幂等性、静态 IP 白名单、用于
              SDK 渲染的域名白名单、iframe 加载所需 CSP，以及通过 2FA 加企业验证实现的生产门禁。交易发生时的信任故事也很明确：钱包验证、KYC 相关交易所身份获取和结构化元数据，被定位成 Travel
              Rule 和 MiCA 工作流的输入。记录变软的地方在于经审计证据。独立报道称 Mesh 使用零信任架构和 SOC 2 Type II
              控制，但审阅到的公开页面没有给出实际证书、报告或控制矩阵。可靠性还继承了生态依赖。Mesh 状态页和 Base 状态页显示，即便 Mesh
              自身服务没有大面积宕机，上游链事件也可能影响路由可用性。因此，集成方需要同时判断产品内部控制，以及其上方承载的外部场所、网络、浏览器和 webhook 基础设施。
