      - number: '5.2'
        title: 架构与集成模型
        blocks:
          - type: paragraph
            body: >-
              最好的公开架构描述来自文档，而不是主页。Mesh 把流程拆成三部分：宿主服务器上的控制平面、客户端 Link 体验，以及通过 webhook 形成的异步确认环。每个会话都从服务器侧 Link Token
              请求开始，定义转账类型、支持目的地和金额约束；随后客户端在五种 SDK 界面之一打开 Link。用户在托管体验中认证钱包或交易所，选择或批准路由，并触发转账。转账预检 API
              暴露了产品的活动部件：一个端点列出可用集成，另一个按网络和集成返回支持的 token，第三个在执行前报价合格金额、费用和资金选项。PSP 式部署通过子客户和 Account Management API
              增加第二个控制平面，让 Mesh 可按下游商户隔离品牌和合规记录。实践中，Mesh 提供一个 API 家族；但文档讲得很清楚，产品仍是一套由会话配置、目录 API、路由、回调和 webhook
              状态管理协调起来的系统。
