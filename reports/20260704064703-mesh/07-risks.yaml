  - - GENIUS issuer perimeter and reserve/redemption framework
    - U.S. federal / state
    - Rulemaking underway; final timing pending
    - High
    - Critical
    - Operate only through clearly permitted partner structures; maintain outside-counsel mapping of roles versus issuer, custodian, and intermediary definitions
    - High — public materials do not show Mesh’s full jurisdiction-by-jurisdiction licensing or role-classification memo
    - Review entity chart, regulated-partner contracts, and legal analysis covering issuer, custodian, and PSP treatment by lane
  - - AML/CFT and OFAC sanctions program obligations for permitted issuers and close infrastructure partners
    - U.S. federal
    - Proposed in April and June 2026
    - High
    - Critical
    - Pre-transaction verification, sanctions-aware partner diligence, and documented escalation paths for blocked or suspicious flows
    - High — if a key partner or flow is reclassified, remediation cost could be immediate
    - Request sanctions program design docs, screening architecture, and any partner-side compliance attestations
  - - Customer identification requirements focused on primary-market relationships
    - U.S. federal
    - Proposed June 2026
    - Medium
    - High
    - Limit direct account relationships, collect required physical-address and ID fields where issuer-like interactions exist, and define secondary-market boundary clearly
    - Medium — rule text helps, but boundary-testing by regulators remains possible
    - Test sample customer journeys against proposed account/customer definitions and document where Mesh versus partner performs CIP
  - - Travel Rule / MiCA / self-hosted-wallet ownership requirements
    - EU and cross-border
    - Active and expanding
    - High
    - High
    - Use signed-message verification, KYC-lite exchange matching, and pre-deposit controls before funds land
    - Medium — effectiveness depends on adoption, policy tuning, and partner coverage
    - Review verification pass rates, manual-review thresholds, and jurisdiction-specific policy templates
  - - Contract, privacy, arbitration, and cross-border data transfer surface
    - Customer contracts / privacy law
    - Current public terms and policies
    - Medium
    - Medium
    - Keep terms, chatbot disclosures, analytics vendor use, and customer-consent flows synchronized across products
    - Medium — broad fee-change, suspension, and arbitration language can amplify commercial friction in disputes
    - Review policy-change governance, vendor inventory, DPA templates, and regional transfer mechanisms
  notes: Severity and likelihood are analyst assessments based on official rulemaking, company legal documents, and legal commentary. The table is partial because final stablecoin rules are not yet settled and Mesh’s private licensing memo is not public.
