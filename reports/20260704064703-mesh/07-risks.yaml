- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory reclassification or licensing failure
    - Named regulator, bank partner, or major customer requires remedial licensing or flow redesign
    - Any binding remediation notice or a signed partner freeze on a core product lane
    - Pause growth assumptions for the affected lane and re-underwrite the model as regulated infrastructure rather than a lighter orchestration layer
  - - Sanctions, CIP, or Travel Rule control failure
    - Material blocked-funds event, sanctions miss, or repeated verification bypass in production
    - One material incident involving customer harm or regulator escalation, or a pattern that forces manual review at scale
    - Escalate to red-flag status; require third-party compliance review before adding new corridors or partners
  - - Partner or stablecoin transmission shock
    - Core rail outage, depeg, or partner compliance issue hits multiple routes at once
    - Simultaneous disruption in a core settlement rail and a high-volume distribution partner, or any depeg that materially interrupts settlement confidence
    - Cut volume-growth assumptions, increase contingency-cost assumptions, and test whether trust recovers within one quarter
  - - Fraud-loss or remediation blowout
    - Impersonation, AI-scam, or provenance failures overwhelm pre-deposit controls
    - Fraud losses or manual-remediation cost persistently outrun expected net economics for a key lane
    - Treat the lane as structurally unattractive until control metrics and pricing are re-set
  - - Model-opacity under high valuation
    - Volume grows while take rate, margin, or concentration remain undisclosed into a new financing or strategic partnership cycle
    - Another major capital raise, large customer push, or step-up valuation without a credible bridge from volume to net economics
    - Move from upside-underwrite to evidence-underwrite and demand full data-room economics before committing capital
  notes: These thresholds are investor monitoring rules, not management guidance. They are designed to turn chapter 7 from narrative risk into explicit go/no-go checkpoints.
