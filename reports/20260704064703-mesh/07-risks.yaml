callouts:
- calloutType: risk
  title: Regulation is moving from abstract backdrop to concrete workflow burden
  body: The regulatory risk is not a distant policy headline. The 2026 proposals translate directly into who must identify customers, who must run sanctions controls, how reserves and redemption work, and where stablecoin infrastructure can sit without triggering a heavier license posture.
  claimRefs:
  - CR001
  - CR005
  - CR007
  - CR008
  - CR015
- calloutType: risk
  title: Partner breadth is now a control-system problem
  body: Mesh’s strongest growth signal — more rails, more stablecoins, more wallet and exchange connectivity — is also a source of failure propagation. The Federal Reserve’s stablecoin work suggests that once intermediation chains get opaque, stress can spread faster than governance catches up.
  claimRefs:
  - CR016
  - CR017
  - CR039
  - CR040
  - CR041
  - CR047
- calloutType: recommendation
  title: Kill the thesis on a control failure, not on a marketing miss
  body: If Mesh discloses slower growth, the story can recover. If it suffers a sanctions, licensing, or verification-control failure on a high-value lane, the cost is likely to hit trust, partner appetite, and valuation simultaneously.
  claimRefs:
  - CR048
  - CR054
  - CR055
