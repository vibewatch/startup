  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: licensing-posture
    missingEvidence: A jurisdiction-by-jurisdiction map of Mesh entity structure, money transmission or payments permissions, and legal analysis of whether any current role could be treated as issuer, custodian, or regulated intermediary under final stablecoin rules.
    whyItMatters: The most severe downside is regulatory reclassification or remediation after go-live; public materials describe controls but not the actual license perimeter or regulator correspondence supporting the business model.
    diligencePath: Request the legal-entity chart, outside-counsel regulatory memo, state and federal license inventory, and any regulator or bank-partner diligence packets covering stablecoin, sanctions, and payments activities.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-reliability
    missingEvidence: Historical uptime, incident counts, exception-queue metrics, false-positive and false-negative verification rates, plus red-team or penetration-test summaries beyond the SOC 2 claim.
    whyItMatters: Operational and security controls are central to the investment case, but public artifacts do not show whether the controls scale under real traffic, fraud pressure, or partner outages.
    diligencePath: Request the last 12 months of incident reports, uptime dashboards, fraud-loss waterfalls, exception-queue SLAs, third-party test summaries, and any material postmortems.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Net take rate, fee-retention split versus partners and networks, gross margin by product, customer concentration, and any board-approved bridge from reported monthly volume to revenue and cash burn.
    whyItMatters: The company may be building a strategically valuable network, but without unit economics investors cannot tell whether volume growth translates into durable margin or simply masks partner pass-through revenue.
    diligencePath: Request monthly financials, cohort-level GMV and net revenue, gross margin by product lane, partner-fee schedules, and board materials discussing concentration and cash runway.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: minor
    topic: governance-depth
    missingEvidence: Current board roster, risk or audit committee ownership of payments and sanctions issues, and a documented founder or key-executive succession plan.
    whyItMatters: Founder-led velocity is an asset until regulatory and partner complexity require deeper governance. Without visibility, investors cannot judge whether oversight scales with the payments and compliance surface.
    diligencePath: Request the current board deck index, committee charters, key-man insurance terms, succession planning materials, and reporting lines for compliance, security, and finance.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
