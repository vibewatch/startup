- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Mesh solution
  - Measurable benefit
  - Limitation
  rows:
  - - Merchant crypto checkout
    - User must already hold the exact token on the exact chain the merchant accepts
    - Mesh Pay plus SmartFunding converts and settles into the merchant-configured asset
    - Eliminates address copy/paste and asset-rail mismatch from the user flow
    - Public record does not disclose merchant authorization-to-settlement success rate
  - - Exchange or wallet funded deposit
    - User arrives with balances scattered across venues and chains
    - Deposits flow authenticates the source account and routes available balances into the platform
    - Kalshi reports 177% deposit-count growth after deployment
    - Proof is strongest for one named customer, not a broad cohort
  - - Regulated platform funding
    - Compliance team needs verified source context before crediting funds
    - Wallet verification, KYC-linked identity retrieval, and structured metadata are offered at transfer time
    - Lets regulated apps attach compliance context before assets land
    - No public control-mapping document or audit artifact was retrieved
  - - Multi-merchant PSP deployment
    - Platform operator needs merchant-specific branding and compliance records
    - Sub-clients let one top-level integration isolate branding and compliance by downstream merchant
    - Avoids separate full-stack integrations per merchant
    - Requires extra Account Management API keying, IP allowlisting, and subClientId management
  - - Payout or settlement disbursement
    - Operator must validate addresses, route funds, and know when settlement clears
    - Payout and webhook surfaces add address validation plus asynchronous status confirmation
    - Supports 24/7 payouts and proactive settlement updates
    - Public pages do not provide payout-corridor matrices or refund-rate data
  notes: Benefits rely on company-quoted case studies and product descriptions; only the Kalshi row includes a named public metrics set.
