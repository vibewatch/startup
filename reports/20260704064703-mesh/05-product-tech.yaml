- id: architecture-and-integration-model
  title: Architecture and integration model
  body: 'The best public architecture description comes from the docs rather than the homepage. Mesh splits the flow into a control plane on the host server, a client-side Link experience, and an asynchronous confirmation loop through webhooks. Every session starts with a server-side Link Token request that defines transfer type, supported destinations, and amount constraints, after which the client opens Link on one of five SDK surfaces. Inside that hosted experience, users authenticate wallets or exchanges, select or approve the route, and trigger transfers. The transfer-preflight APIs expose the product’s moving parts: one endpoint lists available integrations, another returns supported tokens per network and integration, and another quotes eligible amounts, fees, and funding options before execution. PSP-style deployments add a second control plane through sub-clients and the Account Management API, which lets Mesh isolate branding and compliance records by downstream merchant. In practice,
    Mesh offers one API family, but the docs make clear that the product is still a coordinated system of session configuration, catalog APIs, routing, callbacks, and webhook state management.'
