- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Status
  - Scope
  - Public evidence
  - Gap
  rows:
  - - Webhook HMAC verification
    - Explicitly documented
    - Server-side event authenticity
    - HMAC-SHA256 on raw body, X-Mesh-Signature-256, EventId dedupe, sub-200ms response target
    - Need signed test fixtures and public webhook schema versioning
  - - 2FA + business verification
    - Explicitly documented
    - Production account hardening
    - Production key issuance requires 2FA and business verification
    - Need public description of what business verification entails by jurisdiction
  - - Allowed domains + CSP
    - Explicitly documented
    - Client-side iframe and browser security boundary
    - SDK loads only from allowlisted domains; CSP must permit *.meshconnect.com and Tron endpoints when needed
    - Need automated validation tooling or preflight linting for merchants
  - - IP allowlisting for admin APIs
    - Explicitly documented
    - Account Management API and production endpoints
    - Sub-client admin plane and production endpoints require pre-approved IPs
    - Need public change-management guidance for rotating IP ranges
  - - Travel Rule / MiCA / AML support
    - Marketing-supported but not control-mapped
    - Transfer-time compliance context
    - Wallet verification, KYC-linked identity retrieval, and structured metadata are described publicly
    - Need an actual control matrix or regulator-facing implementation guide
  - - Zero-trust / SOC 2 messaging
    - Third-party-reported, not independently retrieved
    - Platform security posture
    - Independent commentary cites zero-trust and SOC 2 Type II
    - Need public certificate, audit period, and trust-center artifact
  notes: This table separates hard implementation controls from higher-level security marketing so diligence can focus on what is truly public versus what still needs direct verification.
