  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: A public trust-center artifact such as a SOC 2 certificate, audit period, control scope, or downloadable security whitepaper.
    whyItMatters: Independent commentary references zero-trust and SOC 2, but investment underwriting needs direct evidence rather than second-hand summaries.
    diligencePath: Request the current SOC 2 report, bridge-provider security architecture overview, and any regulator- or customer-facing control matrix from Mesh.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: sla-and-success-metrics
    missingEvidence: Customer-facing SLA language, historical uptime percentages, transfer success rates by rail, and mean time to recovery across incidents.
    whyItMatters: The product depends on exchanges, chains, and browsers; without reliability metrics, diligence cannot distinguish resilient orchestration from optimistic marketing.
    diligencePath: Ask for 12 months of incident history, uptime and webhook delivery metrics, and route-level success-rate dashboards segmented by chain, exchange, and SDK surface.
    relatedQuestionRefs:
    - QE024
    - QE026
  - type: private-evidence-only
    severity: material
    topic: commercial-and-coverage-specifics
    missingEvidence: Versioned route coverage by geography, exchange, token, and settlement corridor plus public pricing or fee-retention logic.
    whyItMatters: The chapter can describe how the stack works, but not where margins, exclusions, or compliance carve-outs sit across actual live corridors.
    diligencePath: Request live coverage matrices, partner contract summaries, and a pricing decomposition for quotes, settlement, and pass-through network fees.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: catalog-versioning
    missingEvidence: A public, versioned export of supported integrations, tokens, and corridors with historical change logs.
    whyItMatters: Public count claims such as 300+ sources and 120+ tokens are useful directionally, but diligence needs reproducible snapshots for customer and corridor underwriting.
    diligencePath: Ask Mesh for dated API exports or customer-facing coverage snapshots covering supported exchanges, wallets, tokens, chains, and payout corridors.
    relatedQuestionRefs:
    - QE004
    - QE026
    relatedTableRefs:
    - TE001
    - TE003
