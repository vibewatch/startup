figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Public docs imply a layered architecture that starts with host configuration and ends with transfer routing, settlement, and asynchronous confirmation.
  data:
    layers:
    - id: l1
      label: Host app / merchant UX
      description: Entry point for pay, deposit, payout, or funding action
      detail: Merchant decides when to request a session and how to react to callbacks.
    - id: l2
      label: Server-side Link Token service
      description: Creates short-lived single-use session state
      detail: Transfer type, destinations, user ID, transaction ID, and amount constraints live here.
    - id: l3
      label: Client SDK + Link UX
      description: Web, iOS, Android, React Native, and Flutter hosted experience
      detail: Mesh owns auth flows, transfer preview, success and error states, and callback emission.
    - id: l4
      label: Connectivity + MMT layer
      description: Integration catalog plus Mesh Managed Tokens
      detail: Mesh handles venue auth, token refresh, and re-auth avoidance for return users.
    - id: l5
      label: Quote + SmartFunding orchestration
      description: Preflight pricing, funding-option selection, and route optimization
      detail: Routing logic weights cost, speed, reliability, network compatibility, and fees.
    - id: l6
      label: Settlement + webhook confirmation
      description: Managed transfer execution and async state delivery
      detail: Host systems should treat webhooks, not SDK callbacks, as the final settlement record.
  approximationNotes: Layer names are analyst shorthand assembled from public docs; Mesh does not publish an internal service map or queue topology.
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE027
  - CE033
- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: standard
  summary: Shows the public end-to-end sequence from host-app click through final webhook confirmation.
  data:
    nodes:
    - id: n1
      label: User initiates pay / deposit / payout
      description: Host application collects the user action and any business context.
    - id: n2
      label: Server requests Link Token
      description: Host backend calls Mesh with transfer options, destinations, and user identifiers.
    - id: n3
      label: Client opens Link and authenticates source account
      description: User logs into wallet or exchange inside Mesh-hosted UX.
    - id: n4
      label: Mesh preflights route
      description: Catalog, quote, and eligibility checks determine supported asset-network paths.
    - id: n5
      label: SmartFunding executes transfer
      description: Mesh combines funding sources, converts if needed, and initiates settlement.
    - id: n6
      label: Webhook finalizes state
      description: Pending transitions to succeeded or failed and host ledgering occurs asynchronously.
    edges:
    - from: n1
      to: n2
    - from: n2
      to: n3
    - from: n3
      to: n4
    - from: n4
      to: n5
    - from: n5
      to: n6
  approximationNotes: This flow is a faithful abstraction of multiple docs pages, but any merchant-specific pre-checks, fraud controls, or ledger steps are not publicly detailed.
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE027
  - CE029
  - CE033
  - CE036
