- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Public dependency
  - Primary risk
  - Evidence
  rows:
  - - Server-side Link Token service
    - Creates session and encodes transfer type, destinations, limits, and branding
    - Mesh integration API plus client secret handling
    - Expired or mis-scoped tokens break flows before the SDK opens
    - Docs how-it-fits and Link Token reference
  - - Client SDK / Link surface
    - Hosts the user-facing auth, transfer preview, and callback lifecycle across five platforms
    - Web, iOS, Android, React Native, and Flutter SDKs
    - Popup handling, CSP, or mobile WebView quirks can strand OAuth or iframe flows
    - Concepts, common-errors, npm packages, GitHub releases
  - - Integration catalog + supported-token APIs
    - Expose which venues, networks, and tokens are available for a given route
    - Mesh-maintained provider and token metadata
    - Coverage gaps or stale mappings can create empty catalogs or unsupported routes
    - Integrations and supported-token endpoints
  - - Quote / SmartFunding engine
    - Preflights price, fees, and funding options before execution
    - Exchange liquidity, network conditions, fee inputs, and internal routing logic
    - Opaque routing logic limits external verification of best-path decisions
    - Quote-transfer endpoint plus product pages
  - - Managed transfer execution + webhooks
    - Moves funds, returns pending/succeeded/failed state, and supplies trace data
    - Exchanges, chains, webhook endpoint, and HMAC verification
    - Pending can last hours and retries are at-least-once, so host systems need durable idempotency
    - Webhooks docs and common-errors
  - - Sub-client and admin plane
    - Registers downstream merchants and binds merchant identity to live sessions
    - Dashboard invite model, Account Management API key, and IP allowlisting
    - Operational overhead grows for PSPs that must manage many downstream clients
    - Sub-clients guide and prepare-to-build
  notes: The public docs expose interfaces and responsibilities but not internal service boundaries, queue topology, or routing-engine implementation details.
