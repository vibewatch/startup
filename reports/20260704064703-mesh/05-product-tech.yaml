chapter:
  number: 5
  title: Product & Technology
  summary: 'Mesh’s public product is now broad enough to look like a networked crypto-payments stack rather than a single widget: SmartFunding sits at the center, Link and the Transfer APIs form the integration surface, and stablecoin settlement plus customer proof show real production intent. The strongest evidence is in the docs and case studies, while the main residual risks are external dependency load, thin public reliability disclosure, and the absence of downloadable trust artifacts.'
sections:
- id: product-surface-and-user-jobs
  title: Product surface and customer jobs
  body: 'Mesh’s public surface now reads like a networked payments stack rather than a single SDK widget. The customer-facing modules are easy to name—Payments, Deposits, Payouts, and Stablecoin Settlement—but the real product promise is the ability to hide asset, chain, and venue mismatch inside the orchestration layer. Payments and deposits both pitch the same outcome: users fund or pay from whatever balances they already hold, while the merchant or platform receives the configured stable asset or fiat rail. That framing matters because it makes SmartFunding the core product, not a marketing add-on. The public case study evidence reinforces that view. Kalshi used Mesh to turn fragmented crypto deposit paths into a single funding surface and reported measurable lift in completed deposits, routing breadth, and bridge usage after deployment. The World App and Circle announcements show the same stack being reused for consumer wallet funding and stablecoin settlement rather than only a narrow
    checkout use case.'
