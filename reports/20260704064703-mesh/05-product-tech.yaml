- id: trust-reliability-and-compliance-controls
  title: Trust, reliability, and compliance controls
  body: 'Mesh’s trust story is strongest where the docs are prescriptive and weaker where the public record relies on summaries or interviews. The hard controls are real and concrete: webhook HMAC verification on the raw body, EventId-based idempotency, static IP allowlisting, domain allowlists for SDK rendering, CSP requirements for iframe loading, and production gating through 2FA plus business verification. The trust-at-transaction-time story is also explicit: wallet verification, KYC-linked exchange identity retrieval, and structured metadata are positioned as inputs for Travel Rule and MiCA workflows. Where the record softens is on audited evidence. Independent coverage says Mesh uses zero-trust architecture and SOC 2 Type II controls, but the reviewed public pages did not expose the actual certificate, report, or control matrix. Reliability also inherits ecosystem dependencies. The Mesh status page and Base status page show that route availability can be impaired by upstream chain
    incidents even if Mesh’s own service is not broadly down. Integrators therefore need to underwrite both the product’s internal controls and the external venues, networks, browsers, and webhook infrastructure it sits on top of.'
  claimRefs:
  - CE010
  - CE011
  - CE032
  - CE033
  - CE034
