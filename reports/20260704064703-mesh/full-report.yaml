      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Mesh’s financial setup is attractive in theory and incomplete in practice. The theory is compelling: the
              company sits on top of a fragmented wallet, exchange, and stablecoin ecosystem; it appears to monetize
              payment, deposit, payout, and verification orchestration; and it has enough product depth and partnership
              momentum to suggest real enterprise demand. The public traction proxies—monthly volume commentary, the
              Kalshi conversion story, the PayPal and World App references, and the growing ecosystem surface—are
              stronger than what most private crypto-infrastructure companies expose.


              The blocker is not market relevance; it is underwriting visibility. There is still no public revenue
              statement, no recurring-vs-usage mix, no gross-margin bridge, no customer concentration view, no burn or
              runway disclosure, and no direct evidence on how much of the fee stack Mesh actually keeps after partners
              and networks take their share. Even filing-based public-company benchmarks were only partly accessible
              from the reviewed filing index pages. The investment conclusion for this chapter is therefore cautious:
              revenue quality is plausible, margin upside is possible, and funding access looks strong, but capital
              adequacy and monetization quality remain unproven until management opens the data room.
