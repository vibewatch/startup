      - CR039
      - CR040
      - CR041
      - CR042
      - CR052
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The call runs from a real financing event through product proof, disclosure gaps, competition, and regulatory risk
      to a research-more stance.
    data:
      nodes:
        - id: price
          label: Real $1B anchor
          detail: Series C is confirmed by official and independent reporting.
        - id: proof
          label: Real product proof
          detail: PayPal, Kalshi, World App, and Circle-linked settlement show live relevance.
        - id: gap
          label: Missing economics
          detail: Revenue, margin, burn, concentration, and round terms remain private.
        - id: compression
          label: Scarcity compression
          detail: Stripe, Coinbase, Visa, Mastercard, BVNK, and BitPay all narrow the premium band.
        - id: outcome
          label: Research-more
          detail: Stay engaged, but do not pay the current mark without private diligence.
      edges:
        - from: price
          to: proof
          label: supports serious work
        - from: proof
          to: gap
          label: still offset by
        - from: gap
          to: compression
          label: amplified by
        - from: compression
          to: outcome
          label: leads to
    claimRefs:
      - CV001
      - CV008
      - CV010
      - CV011
      - CV012
      - CV045
      - CV046
      - CV047
      - CV050
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      If the reported nearly $10B monthly volume is real, take rate is the key variable separating a thin from a
      supportable valuation case.
    data:
      items:
        - label: 5 bps take rate
          value: 60
        - label: 10 bps take rate
          value: 120
        - label: 15 bps take rate
          value: 180
        - label: 20 bps take rate
          value: 240
        - label: 30 bps take rate
          value: 360
      yAxis:
        label: Implied annual revenue on $120B annualized volume (USD M)
    approximationNotes: >-
      Values are directional sensitivities derived from the third-party-reported nearly $10B monthly volume figure; they
      are not disclosed Mesh revenues.
    claimRefs:
      - CV005
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The current mark only looks attractive if Mesh clears both a take-rate threshold and a premium-multiple threshold
      that public evidence does not yet verify.
    data:
      items:
        - label: Bull support range
          low: 2400
          mid: 2640
          high: 2880
          detail: 20 bps take rate and 10x-12x multiple on ~$240M revenue
        - label: Base support range
          low: 840
          mid: 960
          high: 1080
          detail: 10 bps take rate and 7x-9x multiple on ~$120M revenue
        - label: Bear support range
          low: 240
          mid: 300
          high: 360
          detail: 5 bps take rate and 4x-6x multiple on ~$60M revenue
    approximationNotes: >-
      Ranges are scenario tools derived from reported volume plus take-rate and multiple assumptions, not a point
      estimate of fair value.
    claimRefs:
      - CV039
      - CV040
      - CV042
      - CV043
      - CV044
      - CV053
      - CV054
      - CV055
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Demand and product proof score materially better than economic disclosure, regulatory risk, and current valuation
      support.
    data:
      items:
