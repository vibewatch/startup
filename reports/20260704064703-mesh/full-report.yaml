      - number: '8.3'
        title: Scenario math and sensitivity
        blocks:
          - type: paragraph
            body: >-
              Because Mesh does not disclose revenue, the most honest way to value the company is to reverse-engineer
              what would have to be true for $1 billion to make sense. The public clue is the Bloomberg-sourced report
              of nearly $10 billion in monthly volume. If that figure is directionally right and stable, it implies
              about $120 billion of annualized gross payment volume. The critical missing variable is what Mesh keeps
              after all routing, conversion, liquidity, partner, and compliance costs. At 5 basis points, that volume
              only supports about $60 million of annual revenue, which would make the current mark look aggressive. At
              10 basis points it implies about $120 million, which makes $1 billion roughly fair if the business quality
              is strong. At 15 to 20 basis points, revenue rises to about $180 million to $240 million, where the
              current mark begins to look more comfortable. The point is not that any one take-rate case is correct; the
              point is that valuation support turns on a hidden variable that public materials do not reveal.
            claimRefs:
