      - number: '2.3'
        title: Buyers, users, payers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broader than direct merchants but narrower than the full digital-assets stack. Merchant
              evidence from the NCA report shows real pull at checkout, especially in travel, hospitality, gaming, and
              other internationally exposed segments, yet it also makes clear that simplicity is the gating factor. Nine
              in ten merchants say they would try crypto if it were as easy as cards. That pushes the best buyer targets
              toward operators that can aggregate many end merchants or many wallet holders through a single
              integration. Mesh’s own positioning and the PYMNTS description point to fintechs, PSP-like platforms,
              wallets, exchanges, and enterprise merchants as the most relevant economic buyers, while developers,
              operations teams, and payment product teams are the practical users. Treasury and finance leaders become
              critical buyers in payout and cross-border flows because the value proposition shifts from “accept crypto”
              to “cut settlement friction, trapped capital, and FX timing risk.” The adoption path therefore runs from
              curiosity and customer demand to channel compression, embedded integration, compliant settlement, and then
              scaled production rollout.
