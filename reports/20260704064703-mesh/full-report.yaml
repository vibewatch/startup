companyProfile:
  summary: >-
    Mesh is a San Francisco-based crypto payments infrastructure company founded in 2020 and led by co-founders Bam
    Azizi and Adam Israel. After evolving from earlier open-finance connectivity roots into a payments network, Mesh now
    positions SmartFunding, Mesh Pay, Mesh Connect, and its transfer APIs as a universal interoperability layer between
    wallets, exchanges, PSPs, merchants, and apps. Publicly reviewed sources support a January 2026 $75M Series C led by
    Dragonfly at a $1B valuation, more than $200M in total disclosed funding, production relationships spanning PayPal,
    Shift4, Kalshi, World App, Circle-linked settlement, and 300+ connected wallets and exchanges. What the public
    record still does not provide is the economic bridge behind that scale: revenue, realized take rate, gross margin,
    burn, concentration, and round-term detail remain undisclosed.
