  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Mesh’s public materials support a clear revenue-mechanism hypothesis even though they stop short of
              disclosing realized pricing. The company now merchandises payments, deposits, payouts, verification, and
              PSP enablement as one connected stack. In each lane, the commercial logic looks transaction-led: a user
              connects an existing exchange or wallet, SmartFunding routes or combines balances, the asset converts at
              the point of transaction, and the merchant or platform settles in stablecoin or local currency. The
              documentation reinforces that interpretation by exposing payment, deposit, onramp, withdrawal, and verify
              flows; by showing programmatic integration and token catalogs; and by itemizing trading, partner, and
              network fees in a sample quote response.


              What remains opaque is the layer investors actually need for underwriting. The Mesh Pay launch post
              confirms merchants can set exact fiat amounts and even add a percentage-based client fee, but it does not
              say what Mesh itself charges, whether there is a monthly platform minimum, or how revenue is split between
              transaction markup, partner pass-through, and enterprise/API commitments. The public record therefore
              supports a transaction-orchestration business with enterprise integration characteristics, but not a clean
              take-rate model.
