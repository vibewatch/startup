  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Public materials show a repeatable path from mismatched user holdings to embedded connection, routing, settlement,
      and expansion into more assets or channels.
    data:
      items:
        - label: User holds the wrong asset
          detail: >-
            Assets sit across wallets, exchanges, chains, and payment methods in forms the business cannot accept
            directly.
          tone: warning
        - label: Customer app embeds Mesh
          detail: The merchant, PSP, wallet, or platform launches a Mesh flow inside its own product.
          tone: neutral
        - label: SmartFunding routes and converts
          detail: Mesh combines up to five sources and finds the fastest, cheapest, most reliable path.
          tone: positive
        - label: Business receives configured settlement
          detail: The customer gets stablecoin or local-currency settlement instead of the user's volatile source asset.
          tone: positive
        - label: Ops and compliance verify the flow
          detail: Webhooks, wallet verification, and settlement metadata support fraud, treasury, and compliance teams.
          tone: neutral
        - label: Expansion loop
          detail: >-
            A successful flow can expand into more deposit paths, merchant channels, or adjacent payout and settlement
            workflows.
          tone: positive
    approximationNotes: >-
      This journey map is synthesized from product and docs pages and should be read as an evidence-backed workflow, not
      as a literal screen map.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU034
      - CU047
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      The public record is rich on interest and live launches, thinner on repeated usage, and thinnest on disclosed
      retention or concentration.
    data:
      items:
        - label: Interest and demand
          value: 100
          description: >-
            Category surveys and partner launches show merchants and platforms are willing to explore crypto payments if
            setup is simple.
        - label: Integration-ready buyer
          value: 72
          description: >-
            PSPs, wallets, and global platforms are the clearest fit because one integration can unlock many downstream
            users or merchants.
        - label: Named production launch
          value: 48
          description: Kalshi, World App, PayPal, and Shift4 demonstrate that live deployments exist beyond marketing copy.
        - label: Repeated usage signal
          value: 24
          description: >-
            Kalshi's growing SmartFunding share is the strongest public repeat-usage proxy; most other references stop
            at launch.
        - label: Disclosed durability
          value: 10
          description: >-
            Public sources do not disclose NRR, churn, contract length, or concentration, so the funnel narrows sharply
            at the retention layer.
    approximationNotes: Values are ordinal weights describing how much evidence exists at each stage, not measured conversion rates.
