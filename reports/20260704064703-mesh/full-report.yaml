  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Mesh’s market is not “all stablecoins” and not “all crypto,” but the narrower
              set of workflows where a business wants to accept value from wallets or exchanges and settle it as
              stablecoins or fiat without taking volatility, compliance, or integration complexity onto its own balance
              sheet. Mesh’s own materials consistently describe a network that sits between merchant checkout, wallet
              connectivity, payout orchestration, and settlement choices. That makes the included spend payment
              acceptance software, wallet and exchange connectivity, payout routing, off-ramp and FX tooling, and the
              operational plumbing needed to run those flows reliably. It excludes stablecoin issuance, reserve
              management, speculative trading, and generic DeFi transaction volume. This boundary matters because public
              market headlines still blur real payments with internal transfers and trading. The retained evidence
              points to a market in which the bottleneck is orchestration and trusted connectivity, not a need for
              another wallet or another stablecoin itself.
