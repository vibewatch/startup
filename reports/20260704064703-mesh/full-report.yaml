  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal perimeter is the highest-severity risk
        blocks:
          - type: paragraph
            body: >-
              Mesh is trying to become connective tissue for stablecoin-powered payments just as U.S. regulators are
              replacing ambiguity with explicit issuer, AML, sanctions, and customer-identification obligations. The
              February OCC proposal, April Treasury illicit-finance proposal, and June FinCEN CIP proposal collectively
              show the direction of travel: permitted issuers need reserve, redemption, capital, AML/CFT, sanctions, and
              customer-identification programs that look much closer to regulated financial infrastructure than to a
              lightweight API layer. That matters even if Mesh itself does not intend to be an issuer. Its product
              surfaces sit close to issuer, custodian, exchange, PSP, and wallet workflows, so any mismatch between
              legal theory and how partners or regulators classify the flow could force remediation, licensing, or
              counterparty restrictions. The company’s own legal documents widen the surface further by preserving broad
              fee-change, suspension, arbitration, and liability limits while the privacy policy discloses chatbot,
              analytics, and cross-border-transfer activity that must stay synchronized with evolving payment, privacy,
              and sanctions rules.
            claimRefs:
