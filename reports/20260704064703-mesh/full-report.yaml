  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Current ARR or recognized revenue
        - Current recurring-revenue base, recognition policy, and bridge from growth or volume to revenue.
        - Without the denominator, public valuation work is sensitivity analysis rather than underwriting.
        - CFO diligence room, board package, or audited management accounts.
      - - Net take rate
        - Blended take rate by payments, deposits, payouts, and orchestration flows.
        - Volume only matters if Mesh keeps enough economics after partners, FX, swaps, and compliance costs.
        - Finance and product analytics review across top flows.
      - - Gross margin and contribution margin
        - Current gross margin, payment processing costs, fraud-loss burden, and services mix.
        - A network-like multiple only works if economics are not being absorbed by infrastructure and compliance costs.
        - Audited P&L plus segment or unit-economics schedule.
      - - Cash, burn, and runway
        - Cash balance, base burn, downside burn, and financing need.
        - A flat or down market could force a tougher next round even if product demand is real.
        - Treasury forecast and board operating plan.
      - - Customer concentration and retention
        - Revenue or volume mix by top customers, NRR or GRR, and partner dependence.
        - Public logos do not show whether the business is diversified or one relationship away from a reset.
        - Cohort pack, customer concentration schedule, and renewal analysis.
      - - Series C economics and governance
        - Liquidation preferences, seniority, ratchets, secondary mix, and investor rights.
