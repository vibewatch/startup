  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current price anchor and disclosure gap
        blocks:
          - type: paragraph
            body: >-
              Mesh’s January 2026 unicorn round is real enough to use as a valuation anchor. The company’s own
              announcement, PR Newswire, The Block, and CoinDesk all point to the same fact pattern: $75 million of new
              capital at a $1 billion valuation, led by Dragonfly and bringing total funding above $200 million. That
              matters because it proves sophisticated investors were willing to pay the price, not just that management
              wanted to tell a good story. The public file also contains genuine operating proof. Mesh claims 300-plus
              wallets and exchanges, 100-plus companies, and more than 900 million reachable users, while PayPal
              integration, the Kalshi case study, World App funding integration, and USDC settlement expansion suggest
              the product is not a paper concept. The core underwriting problem is that the same public file still
              withholds the denominator that matters most: current ARR or recognized revenue, gross margin, burn, cash,
              concentration, and the exact Series C terms. That combination makes the current mark credible as an event
              but under-specified as an entry point.
            claimRefs:
