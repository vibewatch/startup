      - number: '2.2'
        title: Sizing lenses and contradictory estimates
        blocks:
          - type: paragraph
            body: >-
              Public sizing for stablecoin payments is highly sensitive to what exactly is being measured. The Federal
              Reserve’s April 2026 note put market capitalization at $317 billion, while CoinLaw cites an aggressive
              scenario above $2 trillion by 2026. Those are both stock measures, not revenue or payments-flow measures.
              Transaction-flow estimates are even more dispersed. CoinLaw cites $33 trillion of 2025 raw on-chain
              stablecoin volume and more than $10 trillion on a filtered basis, while the McKinsey and Artemis analysis
              summarized by Crypto Valley Journal says actual payments were only about $390 billion. Artemis reinforces
              why those gaps persist by showing that even on Ethereum, payment labeling, smart-contract filtering, and
              internal business transfers drastically change the answer. For Mesh, the most useful public lenses are
              therefore the software revenue pool and the enterprise-relevant payment-flow slice, not the broadest
              volume or market-cap numbers. The retained evidence supports a large and growing category, but it does not
              support a lazy claim that every stablecoin dollar is serviceable Mesh TAM.
