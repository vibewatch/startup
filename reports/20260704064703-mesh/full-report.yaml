      - number: '7.5'
        title: Mitigations exist, but the thesis should be monitored through explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              This is not a chapter arguing that Mesh is unmanaged. The company has built a coherent public narrative
              around verification before value movement, short-lived credentials, zero-trust security, role-based
              access, and a product stack aimed at reducing AML, provenance, and settlement friction. That is a better
              starting point than many crypto-infrastructure peers offer. The problem is residual exposure. FATF and
              U.S. agencies are telling the market that stablecoin controls will increasingly be judged through
              sanctions, AML, and customer-identification performance, while Federal Reserve research shows that
              intermediation and run risk do not disappear simply because the front-end experience is elegant. Investors
              should therefore treat the risk chapter as a monitoring framework. The thesis is intact while Mesh can
              prove that partner expansion, compliance complexity, and volume growth remain aligned. It breaks quickly
              if a licensing or remediation event lands, if verification or sanctions controls fail in production, or if
              partner outages and depeg events hit trust and economics at the same time.
