      - number: '7.3'
        title: Partner and network dependency has become a transmission risk, not just a growth lever
        blocks:
          - type: paragraph
            body: >-
              The bullish version of Mesh is that one integration abstracts hundreds of wallets, exchanges, stablecoins,
              and chains. The bearish version is that this same abstraction concentrates business risk into
              counterparties Mesh does not fully control. In 2026 alone the company elevated Stellar as a core
              settlement layer, expanded USDC settlement with Circle, added a USDT-native Stable settlement option
              through MAP, and publicly highlighted Kalshi, GDN, and other partner milestones. The Federal Reserve’s
              recent stablecoin work is directly relevant here: complex intermediation chains and vertical integration
              make it harder for market participants to see where stress originates, while stablecoin payment growth
              increases the chance that outages, depegs, or compliance actions travel across layers instead of stopping
              at one counterparty. Mesh’s opportunity therefore comes bundled with dependency concentration. The
              company’s partner announcements show breadth and momentum, but they do not disclose redundancy rights,
              failover mechanics, or which settlement lanes matter most to volume and margin.
