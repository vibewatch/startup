  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Revenue denominator disappoints
        - Current ARR or recognized revenue is well below what a 7x-9x multiple would need to support $1B.
        - The current price stops looking fair even before applying any private-company opacity discount.
        - Downgrade the case and insist on materially better entry terms.
      - - Net take rate is thin
        - Realized blended take rate lands closer to 5 bps than 10-20 bps on monetizable volume.
        - Reported flow stops translating into software-like revenue support.
        - Treat the $1B mark as stretched-to-expensive rather than debatable.
      - - Customer or partner concentration is high
        - One or two platforms dominate volume, revenue, or growth.
        - Execution risk becomes binary and public traction proof becomes less diversified than it appears.
        - Apply a multiple haircut and demand concentration covenants or data.
      - - Terms are preference-heavy
        - Series C includes strong liquidation preferences, ratchets, participation, or common-unfriendly structure.
        - Headline valuation overstates common-equity quality and return potential.
        - Re-underwrite from the cap table instead of the press release.
      - - Regulatory or AML event
        - Sanctions-screening failure, fraud episode, or stablecoin-policy shock interrupts product expansion.
        - Compliance costs rise while payment partners and banks become more cautious.
        - Pause new underwriting until the event is contained and quantified.
    notes: >-
      These triggers are designed to be monitorable and tie directly to what would have to go wrong for the current
