  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Structure and Mesh Positioning
        blocks:
          - type: paragraph
            body: >-
              Mesh is not competing in a clean, single-vendor category. Its public product set spans deposits, checkout,
              payouts, and stablecoin settlement, all tied together by an orchestration narrative: users already hold
              assets across many wallets and exchanges, while merchants and PSPs want to receive one preferred asset or
              local currency on one preferred rail. Mesh’s own pages repeatedly frame the problem as asset
              fragmentation, app-switching, route selection, and failed transfers rather than simple “accept USDC”
              functionality. That framing matters because it places Mesh closer to an orchestration layer than to a
              simple merchant gateway. The Kalshi case study reinforces the point: the public proof is not generalized
              GMV, but a claim that better routing and conversion removed deposit failures and widened usable assets and
              networks.


              That positioning creates a wide but unstable competitive set. Direct peers include MoonPay, BVNK, BitPay,
              Coinbase Business, and ramp infrastructure vendors that can now cover more of the receive-convert-payout
              chain. Incumbents such as Stripe and Checkout.com compress the category from above by turning stablecoins
              into another payment method inside a broader merchant stack. Visa and Mastercard compress it from the
              network layer by making stablecoin settlement an option inside existing global payment infrastructure. The
              consequence is that Mesh’s strongest competitive claim is not raw stablecoin support; it is reducing the
              operational and UX mess created by fragmented holdings, mismatched rails, and cross-border settlement
              friction.
