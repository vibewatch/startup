      - number: '6.4'
        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              The underwriting problem is not lack of demand signals; it is lack of durability signals. Mesh has
              credible expansion logic: Kalshi expanded from a narrow native-rail setup into all-deposit coverage,
              MetaMask's testimonial implies product deepening from aggregation into deposits and ramp, and channel
              partners like PayPal and Shift4 can expose Mesh to many downstream merchants or users at once. However, no
              reviewed public source discloses NRR, GRR, churn, renewal rates, contract length, or top-customer
              concentration. The Block explicitly notes management declined to share business metrics and related
              governance details, which limits outside-in judgment on whether customer proof converts into sticky
              revenue. Adverse sources sharpen the risk. NCA's merchant survey says nine in ten merchants would try
              crypto if setup were as simple as cards, implying friction still blocks broader rollout. Spark goes
              further, arguing that incumbents like Stripe and PayPal now make stablecoin acceptance easier inside
              existing stacks, so Mesh must keep proving that its conversion and orchestration layer is better than
              bundled alternatives. Public evidence therefore supports adoption momentum more than retention visibility.
