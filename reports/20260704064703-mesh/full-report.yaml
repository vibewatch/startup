  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - >-
          Reported volume sustains near $120B annualized, realized net take rate reaches roughly 20 bps, and Mesh earns
          a 10x-12x software-like or network-adjacent multiple.
        - That setup would imply roughly $2.4B-$2.9B of value, making the current $1B entry attractive in hindsight.
        - Bundling by incumbents, take-rate pressure, or weak margins would break the premium quickly.
        - Needs disclosed revenue above roughly $200M with healthy margin and low concentration.
      - - Base
        - >-
          Reported volume is real but effective monetization lands closer to 10 bps and public investors would
          eventually pay only 7x-9x because disclosure stays private-company thin.
        - That yields roughly $0.84B-$1.08B, which makes today’s mark roughly fair only if execution stays clean.
        - The market may still haircut private opacity or regulatory risk more than this range assumes.
        - The current price works only if low-hundreds-of-millions revenue is already real.
      - - Bear
        - >-
          Gross volume is overstated versus monetizable flow, take rate is closer to 5 bps, and the market values Mesh
          more like a contested payment app at 4x-6x revenue.
        - That yields roughly $0.24B-$0.36B, implying major downside or down-round risk from the current mark.
        - >-
          Preference-heavy terms or customer concentration could make common-equity downside worse than the headline
          markdown.
        - Any disclosure showing low take rate, low margin, or heavy dependence on a few partners moves the case here.
    notes: >-
      Scenario math uses reported monthly volume and take-rate sensitivity because Mesh does not publicly disclose
      revenue, ARR, or margins.
