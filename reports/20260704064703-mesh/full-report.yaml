  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How regulatory, fraud, and run-risk events can propagate through trust, volume, margin, and valuation.
    data:
      nodes:
        - label: Regulatory Reclassification
          detail: Issuer, custody, or partner role forced into heavier supervision
        - label: Sanctions / CIP Failure
          detail: Blocked funds, screening miss, or account-opening deficiency
        - label: Fraud / AI Scam Loss
          detail: Impersonation or provenance failure on chargeback-free rails
        - label: Partner / Stablecoin Shock
          detail: Rail outage, depeg, or compliance freeze at a core counterparty
        - label: Customer Trust
          detail: Merchant and platform confidence in routing and settlement
        - label: Platform Volume
          detail: GMV, payment count, and funded-flow throughput
        - label: Net Economics
          detail: Take rate, remediation cost, and gross-margin quality
        - label: Valuation / Financing
          detail: Ability to sustain premium growth and financing narrative
      edges:
        - from: Regulatory Reclassification
          to: Net Economics
          label: Adds licensing, legal, and compliance cost
        - from: Regulatory Reclassification
          to: Customer Trust
          label: Creates onboarding friction and partner hesitation
        - from: Sanctions / CIP Failure
          to: Customer Trust
          label: Damages safety and compliance credibility
        - from: Sanctions / CIP Failure
          to: Net Economics
          label: Drives remediation, fines, and review cost
        - from: Fraud / AI Scam Loss
          to: Customer Trust
          label: Reduces willingness to route high-value flows
        - from: Fraud / AI Scam Loss
          to: Net Economics
          label: Raises manual review and loss expense
        - from: Partner / Stablecoin Shock
          to: Platform Volume
          label: Interrupts settlement and routing paths
        - from: Partner / Stablecoin Shock
          to: Customer Trust
          label: Makes rails look brittle or non-resilient
        - from: Customer Trust
          to: Platform Volume
          label: Lower trust reduces repeat usage and enterprise rollout
        - from: Platform Volume
          to: Net Economics
          label: Volume without retention or margin hurts operating leverage
        - from: Net Economics
          to: Valuation / Financing
          label: Margin opacity or compression weakens premium multiple
    claimRefs:
      - CR017
      - CR024
      - CR048
      - CR054
      - CR055
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: Critical external dependencies across settlement, integration, compliance, and customer routing.
    data:
      nodes:
        - label: Mesh Network
          detail: Core orchestration layer across payments, deposits, payouts, and verification
        - label: 300+ Wallet / Exchange Integrations
          detail: Connectivity and KYC-lite data sources
        - label: Circle / USDC
          detail: Dollar settlement partner and stablecoin rail
        - label: Stellar
          detail: Core settlement chain for selected flows
        - label: Stable / USDT
          detail: USDT-native settlement option via MAP
        - label: Enterprise Merchants / PSPs
          detail: Customer layer seeking stablecoin or local-currency settlement
        - label: Compliance Layer
          detail: Travel Rule, sanctions, CIP, and provenance controls
        - label: Regulators / Bank Partners
          detail: Rulemakers, supervisors, and regulated counterparties
      edges:
        - from: Mesh Network
          to: 300+ Wallet / Exchange Integrations
          label: Relies on upstream connectivity and identity signals
        - from: Mesh Network
          to: Circle / USDC
          label: Routes dollar settlement through issuer ecosystem
        - from: Mesh Network
          to: Stellar
          label: Uses chain as core settlement layer
        - from: Mesh Network
          to: Stable / USDT
          label: Adds USDT-native route through MAP
        - from: Mesh Network
          to: Enterprise Merchants / PSPs
          label: Delivers customer-facing payment and payout capability
        - from: Compliance Layer
          to: Mesh Network
          label: Defines what transactions can clear or must stop
        - from: Regulators / Bank Partners
          to: Compliance Layer
          label: Set formal and practical control expectations
        - from: Enterprise Merchants / PSPs
          to: Regulators / Bank Partners
          label: Bring due-diligence and regulated-counterparty pressure back upstream
    claimRefs:
