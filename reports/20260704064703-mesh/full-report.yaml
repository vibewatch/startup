          value: 7
          detail: Stablecoin adoption and enterprise interest are real.
        - label: Product proof
          value: 8
          detail: PayPal, Kalshi, World App, and Circle-linked settlement show live usage.
        - label: Distribution / partners
          value: 8
          detail: 300+ wallets and exchanges plus 100+ companies give Mesh real reach.
        - label: Economic disclosure
          value: 3
