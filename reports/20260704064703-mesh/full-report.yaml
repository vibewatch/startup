      - number: '4.3'
        title: Cost structure, compliance burden, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The public cost story is visible only in pieces, but the pieces matter. Mesh’s own docs show a fee stack
              with trading, partner, and network components. Product pages stress address validation, wallet
              verification, webhook-driven settlement confirmation, and PSP sub-client controls, all of which imply
              non-trivial compliance, support, and reliability overhead. The product also spans payments, deposits,
              payouts, stablecoin settlement, and multi-merchant PSP workflows, which should create substantial
              operating leverage if transaction volume scales—but only if partner fees, network fees, and support
              intensity do not consume most of the gross spread. That is why stablecoin infrastructure risk matters
              directly to Mesh’s financial model: Federal Reserve, IMF, and Chainalysis materials all describe growing
              regulatory, sanctions, and systemic sensitivity as stablecoin adoption broadens.


              Financing access looks much stronger than financial disclosure. TechCrunch recorded a $22 million Series A
              and $32 million total in 2023, official sources took the total above $120 million and then $130 million,
              and the Series C announcement said total capital raised surpassed $200 million at a $1 billion valuation.
              Axios then reported a possible new round valuing Mesh at up to $2 billion, but that was preview reporting
              rather than a signed close. What remains unavailable is the balance-sheet bridge from those raises to
              today’s capital adequacy: no reviewed source discloses cash, burn, runway, or debt.
