  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Qualitative heatmap of Mesh’s major risk categories across likelihood, impact, mitigation maturity, residual
      severity, and thesis-break potential.
    data:
