tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - Merchant payment orchestration
    - Customer pays from an exchange or wallet while Mesh routes and converts into the merchant’s preferred settlement asset.
    - Per checkout / routed payment
    - Live on public payments pages and linked to PayPal / Shift4 use cases.
    - Likely the core revenue rail, but retained take rate is undisclosed.
    - Request GMV, transaction count, gross take rate, and net take rate by merchant and PSP channel.
  - - Deposit orchestration
    - Users fund an app or exchange account with assets they already hold elsewhere; Mesh handles routing and conversion.
    - Per deposit / funded account
    - Publicly live and supported by Kalshi and World App references.
    - Strong adoption signal, but fee share versus partner rails is unknown.
    - Request deposit GMV, completed deposits, failed-deposit rate, and contribution margin by customer cohort.
  - - Payout orchestration
    - Platform sends value to customers, vendors, or employees with conversion into the recipient’s preferred token or currency.
    - Per payout
    - Live on the payouts page with cost-reduction claims.
    - Potentially sticky B2B revenue, but no realized pricing is public.
    - Request payout volume, average fee, validation cost, and loss/error-adjustment history.
  - - Verification and compliance tooling
    - Wallet ownership verification, address validation, KYC-style signals, webhook metadata, and Travel Rule support.
    - Per verification / bundled platform feature
    - Documented as part of payment, deposit, and payout workflows.
    - May support higher take rates or enterprise minimums, but packaging is opaque.
    - Request attach rate, standalone pricing, and compliance gross margin by feature.
  - - PSP and sub-client enablement
    - Mesh lets one platform serve multiple downstream merchants with separate branding and compliance settings.
    - Enterprise platform contract / API usage
    - Public docs show sub-client infrastructure for PSP contexts.
    - Suggests platform revenue beyond a single merchant integration, but economics are not public.
    - Request minimum commitments, pricing by sub-client volume tier, and churn for PSP channels.
  - - Onramp and funding top-ups
    - Mesh docs also expose onramp and buying-power funding options alongside crypto balance routing.
    - Per top-up / conversion event
    - Visible in transfer types and sample quote payloads.
    - Could widen monetization per user session, but current revenue contribution is unknown.
    - Request top-up attach rate, funding-source mix, and blended gross profit per session.
  notes: Rows summarize the monetization lanes visible in reviewed public materials. Nulls are avoided by using narrative status because Mesh does not disclose product-level revenue mix.
  enumerationScope:
    coverage: partial
    basis: Captures the main public monetization lanes visible in official product pages and docs, not every internal SKU or partner-specific contract form.
