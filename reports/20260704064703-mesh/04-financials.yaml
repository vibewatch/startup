  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: A contract-level price list showing Mesh take rate, minimum fees, partner rev-share, and any monthly platform commitments.
    whyItMatters: Without realized pricing, the committee cannot convert public volume and integration breadth into revenue or gross-profit expectations.
    diligencePath: Request three signed merchant or PSP contracts plus a product-by-product pricing schedule, with realized discounts and average effective take rate by channel.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt, and any liquidity or reserve facilities supporting settlement.
    whyItMatters: Capital adequacy is central to underwriting because transaction infrastructure businesses can look strong on volume while still needing external capital.
    diligencePath: Request a monthly cash bridge since the Series B, current unrestricted cash, debt schedule, covenant summary, and a 12-month base/upside/downside runway model.
    relatedQuestionRefs:
    - QI022
    - QI027
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: blocking
    topic: margin-bridge
    missingEvidence: A gross-margin bridge that separates partner fees, network fees, trading/spread costs, compliance costs, and support/engineering cost of revenue.
    whyItMatters: The public record shows fee components and routing complexity, but not what Mesh retains after pass-through and risk controls.
    diligencePath: Request monthly gross profit by product line together with transaction count, GMV, take rate, and direct cost buckets for payments, deposits, payouts, and verification.
    relatedQuestionRefs:
    - QI026
    - QI027
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: Customer concentration, cohort retention, renewal rates, and revenue contribution from top merchants, PSPs, and wallet/exchange partners.
    whyItMatters: Case studies and partner names are encouraging, but the committee still cannot test revenue durability or concentration risk.
    diligencePath: Request top-20 customer revenue concentration, logo/cohort retention, GMV concentration by partner, and any minimum-volume commitments embedded in contracts.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
  - type: access-blocked
    severity: material
    topic: filing-benchmark
    missingEvidence: Direct current-year cost-line excerpts from public-company filings that can anchor payment-processing and stablecoin infrastructure margin comparisons.
    whyItMatters: Benchmarking to public comps is still useful, but the reviewed filing index pages alone do not provide extractable line-item detail in the current fetches.
    diligencePath: Pull the latest 10-K/10-Q HTML or PDFs for PayPal, Coinbase, Visa, Mastercard, or Block and extract transaction expense, gross margin, and stablecoin-related commentary directly.
    relatedQuestionRefs:
    - QI020
  - type: enumeration-incomplete
    severity: material
    topic: revenue-streams
    missingEvidence: A product-by-product revenue mix that quantifies what share of revenue comes from payments, deposits, payouts, verification, and enterprise/API programs.
    whyItMatters: The public evidence identifies the likely monetization lanes, but not the mix that determines revenue quality and margin profile.
    diligencePath: Request a trailing-12-month revenue mix by product and a same-customer cross-sell matrix showing how often deposits, payments, and payouts coexist.
    relatedQuestionRefs:
    - QI001
    - QI021
    relatedTableRefs:
    - TI001
