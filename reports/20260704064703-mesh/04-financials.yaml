- id: traction-and-public-unit-economics-proxies
  title: Traction and public unit-economics proxies
  body: |-
    Public traction is much easier to see than public revenue. Mesh’s official surfaces repeatedly point to 300+ supported wallets and exchanges, 120+ tokens across 24+ networks, and more than 100 companies using the network. Independent coverage adds a stronger usage proxy: PYMNTS reported Dragonfly’s view that Mesh is already seeing almost $10 billion in monthly volume. Customer evidence also matters. Kalshi’s case study claims 177% growth in monthly deposit count, roughly one quarter of deposits already routing through SmartFunding, a footprint expansion from 3 paths to 27 assets across 14 networks, and a 48-hour path from first API call to production. World App adds another visible scale signal by tying Mesh to a platform spanning 160 countries and nearly 18 million verified users.

    Even so, the unit-economics bridge is still only a proxy set. These numbers support product relevance, integration depth, and channel reach, but they do not translate directly into retained revenue. There is no public CAC, payback, NRR, customer concentration, or product-level GMV take rate. The chapter therefore treats integrations, case-study lifts, and monthly volume as commercial validation, not as substitutes for audited revenue quality.
