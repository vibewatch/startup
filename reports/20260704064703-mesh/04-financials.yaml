figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: standard
  summary: The public record supports a transaction-orchestration model in which Mesh turns fragmented wallets and exchanges into settled merchant or platform flows, but the retained take rate remains private.
  data:
    nodes:
    - id: r1
      label: User asset base
      detail: Balances sit across wallets, exchanges, chains, and tokens rather than in the exact asset a merchant wants.
    - id: r2
      label: Embedded Link session
      detail: Mesh launches an authenticated session with a short-lived link token inside the customer or merchant app.
    - id: r3
      label: SmartFunding route
      detail: Routing selects or combines up to five funding sources based on speed, fees, and reliability.
    - id: r4
      label: Conversion + compliance
      detail: Assets convert at the point of transaction while Mesh layers verification, address validation, and metadata.
    - id: r5
      label: Settlement output
      detail: Merchant or platform receives the configured stablecoin or local currency instead of the user’s original asset.
    - id: r6
      label: Revenue capture point
      detail: Mesh likely monetizes through orchestration, partner/API relationships, and transaction economics, but the retained take rate is undisclosed.
    edges:
    - from: r1
      to: r2
    - from: r2
      to: r3
    - from: r3
      to: r4
    - from: r4
      to: r5
    - from: r5
      to: r6
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI008
  - CI010
  - CI044
