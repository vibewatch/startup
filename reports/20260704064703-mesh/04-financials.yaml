- id: TI003
  title: Unit economics table
  columns:
  - Metric / proxy
  - Value / observation
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Supported funding / payment endpoints
    - 300+ wallets and exchanges
    - High
    - Breadth increases surface area for transaction revenue and reduces one-partner dependence.
    - Request active integrations, live-by-integration GMV, and top-10 integration concentration.
  - - Supported assets and rails
    - 120+ tokens across 24+ networks
    - High
    - Broader routing raises utility but also expands compliance and support overhead.
    - Request transaction mix by chain, token, and stablecoin vs. volatile asset.
  - - Independent monthly volume proxy
    - Almost $10B monthly volume per Dragonfly / Bloomberg via PYMNTS
    - Medium
    - If accurate, scale is already large enough for meaningful revenue even at low take rates.
    - Request monthly volume bridge, revenue conversion, and gross-profit conversion for the last 12 months.
  - - Legacy paying-client count
    - 70 paying clients reported in September 2023
    - Medium
    - Shows paid demand existed before the current payments push.
    - Request current paying-customer count, cohort retention, and revenue by vintage.
  - - Kalshi deposit lift
    - 177% monthly deposit-count growth after deployment
    - Medium
    - Suggests conversion economics can be real for the right customer.
    - Request pre/post economics on top 10 customer launches, including support cost and retained take rate.
  - - Team scale proxy
    - 100+ team members and an India product hub
    - Medium
    - Helpful for opex intuition, but still not a substitute for an actual burn rate.
    - Request monthly payroll, infrastructure spend, and sales & marketing cash use.
  notes: These are public proxies rather than audited economics. Null-like fields are expressed as diligence asks because the company does not publish CAC, gross margin, or payback.
