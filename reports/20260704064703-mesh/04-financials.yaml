- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Latest confirmed total capital raised
    - Over $200M after the January 2026 Series C
    - High
    - Shows the business has attracted meaningful external capital.
    - Request post-close cap table and bridge from gross proceeds to current unrestricted cash.
  - - Latest confirmed valuation anchor
    - $1B post-money in the January 2026 Series C
    - High
    - Sets the latest closed valuation reference before any rumored follow-on.
    - Request the full term sheet and liquidation preference stack.
  - - Pre-Series C funding base
    - More than $130M after the PayPal-led follow-on; previously over $120M after Series B
    - Medium
    - Helps frame how much fresh capital was added before the unicorn round.
    - Request round-by-round gross and net proceeds and any debt or SAFEs outside headline equity raises.
  - - Disclosed uses of proceeds
    - Product development, API scaling, go-to-market, and expansion into LatAm, Asia, and Europe
    - Medium
    - Shows capital is being spent on growth rather than disclosed balance-sheet repair.
    - Request operating plan by department, hiring plan, and region-level payback assumptions.
  - - Public opex proxy
    - 100+ employees plus an India engineering office
    - Medium
    - Signals a material operating cost base even if burn is undisclosed.
    - Request current monthly payroll, hosting, compliance, and customer-success cash costs.
  - - Cash, burn, runway, debt, reserve facilities
    - Not disclosed in reviewed public evidence
    - Medium
    - This is the core capital-adequacy blocker.
    - Request current cash, monthly net burn, 12-month runway, debt schedule, and any settlement/liquidity facilities.
  notes: Funding chronology is visible enough for context, but current liquidity is not. The final row is intentionally explicit because the missing balance-sheet bridge is the chapter’s main underwriting blocker.
