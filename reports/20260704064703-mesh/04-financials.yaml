- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Current public state
  - Exact diligence path
  - Severity
  rows:
  - - Revenue / ARR / product mix
    - Needed to test whether transaction breadth is turning into monetization quality.
    - No reviewed public source discloses revenue, ARR, or revenue mix.
    - Request audited monthly revenue by payments, deposits, payouts, verification, and enterprise/API contracts.
    - Blocking
  - - Realized take rate and contract structure
    - Without it, public volume proxies cannot be translated into revenue.
    - Product capability is visible; realized pricing is not.
    - Request effective pricing by customer cohort, minimums, rev-share terms, and discount ladders.
    - Material
  - - Gross margin and cost of revenue
    - Essential for underwriting operating leverage versus pass-through economics.
    - Fee components are visible in docs, but retained gross profit is not.
    - Request gross profit by product line with partner, network, trading, compliance, and support cost buckets.
    - Blocking
  - - Cash, burn, runway, and debt
    - Capital adequacy cannot be judged from fundraising headlines alone.
    - No reviewed source discloses cash, runway, debt, or liquidity facilities.
    - Request current liquidity, monthly burn, runway, debt schedule, and contingency funding plan.
    - Blocking
  - - Customer concentration and retention
    - A payments infrastructure business can look broad while still being concentrated in a few logos.
    - Case studies exist, but concentration and NRR data do not.
    - Request top-customer revenue concentration, cohort retention, and GMV concentration by partner.
    - Material
  - - Compliance, sanctions, and reserve exposure
    - Stablecoin economics depend on the cost of monitoring, sanctions controls, and settlement counterparties.
    - Risk sources are public; Mesh-specific exposure metrics are not.
    - Request compliance staffing, alerts/case volumes, reserve/counterparty map, and sanctions-screening loss history.
    - Material
  notes: This table is exhaustive only for the highest-priority public blockers identified in the reviewed set; additional diligence questions may emerge once contract and ledger data are available.
