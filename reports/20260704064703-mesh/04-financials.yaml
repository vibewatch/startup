company:
  name: Mesh
chapter:
  number: 4
  title: Financials
  summary: 'Mesh’s public financial picture is strong on product logic and funding access but weak on underwriteable disclosure. Official sources support a transaction-orchestration revenue model across payments, deposits, payouts, and enterprise integrations, plus traction proxies such as 300+ supported platforms, 100+ trusted companies, 900M+ network reach, a Kalshi case study, and an external report of almost $10B in monthly volume. What they do not support is the key investment bridge: realized take rate, gross margin, revenue mix, cash, burn, runway, debt, or customer concentration remain undisclosed, so capital adequacy and margin quality stay open diligence items despite the $1B confirmed valuation and rumored higher round.'
sections:
- id: revenue-model-and-pricing-opacity
  title: Revenue model and pricing opacity
  body: |-
    Mesh’s public materials support a clear revenue-mechanism hypothesis even though they stop short of disclosing realized pricing. The company now merchandises payments, deposits, payouts, verification, and PSP enablement as one connected stack. In each lane, the commercial logic looks transaction-led: a user connects an existing exchange or wallet, SmartFunding routes or combines balances, the asset converts at the point of transaction, and the merchant or platform settles in stablecoin or local currency. The documentation reinforces that interpretation by exposing payment, deposit, onramp, withdrawal, and verify flows; by showing programmatic integration and token catalogs; and by itemizing trading, partner, and network fees in a sample quote response.

    What remains opaque is the layer investors actually need for underwriting. The Mesh Pay launch post confirms merchants can set exact fiat amounts and even add a percentage-based client fee, but it does not say what Mesh itself charges, whether there is a monthly platform minimum, or how revenue is split between transaction markup, partner pass-through, and enterprise/API commitments. The public record therefore supports a transaction-orchestration business with enterprise integration characteristics, but not a clean take-rate model.
