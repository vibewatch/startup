- id: TI002
  title: Pricing / monetization table
  columns:
  - Public pricing signal
  - Published amount or structure
  - List vs. realized pricing
  - Why it matters
  - Open issue
  - Source basis
  rows:
  - - Merchant client fee support
    - Merchant can add a percentage-based fee to a transaction.
    - Capability disclosure, not proof of Mesh take rate.
    - Shows the checkout can carry explicit fee logic.
    - Unknown whether the fee belongs to the merchant, Mesh, or both in practice.
    - Mesh Pay launch post
  - - Sample trading fee
    - $0.80 on the example $100 ETH quote.
    - Sandbox-style quote, not a public production tariff.
    - Shows at least one direct variable cost component.
    - Unknown whether Mesh keeps, passes through, or shares this fee.
    - Quote transfer API example
  - - Sample partner fee
    - $1.00 on the same quote.
    - Quote-level field, not a contract schedule.
    - Supports the hypothesis that partner economics affect gross margin.
    - Unknown which partner earns it and how often it applies.
    - Quote transfer API example
  - - Sample network fee
    - $1.12 on the same quote.
    - Quote-level field, not a guarantee.
    - Confirms blockchain/network costs are explicit in the flow.
    - Unknown how network volatility changes realized margin.
    - Quote transfer API example
  - - Sample total fee range
    - $2.12-$2.92 with $97.08-$97.88 net on a $100 ETH example.
    - Illustrative payload, not public merchant pricing.
    - Shows that gross-to-net variability exists inside the product.
    - Still no disclosed average fee take or margin.
    - Quote transfer API example
  - - Enterprise/API access pricing
    - No canonical published price card or minimum spend found on reviewed official pages.
    - No public list pricing located.
    - This is the biggest obstacle to translating usage proxies into revenue.
    - Need signed contracts and effective pricing by customer type.
    - Payments, stablecoin settlement, PSP, deposits, and payouts pages
  notes: Mesh exposes fee mechanics in example payloads but not a realized merchant or PSP pricing schedule. The table separates visible components from missing commercial terms.
