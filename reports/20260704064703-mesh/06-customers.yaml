    {
      "id": "named-deployments-and-adoption-trajectory",
      "title": "Named deployments and adoption trajectory",
      "body": "The named proof set is strongest when Mesh can show a live deployment with outcomes rather than just a partner logo. Kalshi is the standout reference account: Mesh says the exchange moved every crypto deposit path onto the network, increased monthly deposit count 177% in the first three months after full deployment, expanded from three deposit paths to 27 assets across 14 networks, and reached production in 48 hours. That is unusually specific production proof for a private infrastructure company. World App is the next-strongest reference because Mesh announced a live deposit integration into an app that already has global wallet usage, though it did not disclose conversion or repeat-usage outcomes. MetaMask adds a named testimonial that is better than a logo wall but still weaker than a full case study. On scale, the trajectory is directionally positive but still marketing-weighted: the company moved from a 2025 reach claim tied to MetaMask, Shift4, and Revolut to 2026 claims around 100+ trusted companies, 300+ platforms, 120+ tokens across 24+ networks, and 900 million reachable users, without disclosing how many accounts are active, paying, or retained.",
