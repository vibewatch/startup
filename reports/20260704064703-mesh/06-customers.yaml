    "number": 6,
    "title": "Customers",
    "summary": "Mesh's public customer evidence is strongest where named production deployments or channel launches are explicit: Kalshi shows quantified post-launch gains, World App shows live consumer-app funding, and PayPal plus Shift4 show real distribution leverage. The public story is much weaker on durability because partner density and reach claims outpace disclosed retention, concentration, and recurring revenue evidence."
  },
  "sections": [
    {
      "id": "buyer-user-and-payer-segmentation",
      "title": "Buyer, user, and payer segmentation",
      "body": "Mesh's public customer story is business-to-business even when the end-user interaction looks consumer-grade. The company markets one integration that lets a merchant, PSP, wallet, exchange, or platform accept crypto from hundreds of external wallets and exchanges while settling in stablecoins or local currency. That framing makes the economic buyer a platform, merchant, or PSP leader, not the retail user initiating the transfer. The user set is broader: product and engineering teams embed the SDK and webhooks, treasury and compliance teams need settlement and verification controls, and customer-facing teams care about fewer failed deposits and less checkout abandonment. Public materials also show a clear vertical bias. Mesh repeatedly highlights PSPs, wallets and exchanges, travel, luxury, gaming, and global merchant flows—segments where cross-border users, fragmented holdings, and chargeback or FX pain are already meaningful. In short, Mesh appears to be selling conversion and settlement infrastructure to businesses while using the retail user's existing wallet or exchange as the interaction surface.",
