- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Coinbase
    - 2025 revenue $7.18B; Jul 2 2026 market cap $43.60B
    - 6.94x sales
    - Closest listed crypto-infrastructure comp with transaction-driven monetization and stablecoin distribution.
    - Exchange and brokerage economics are more volatile and retail-exposed than Mesh’s embedded payments model.
  - - PayPal
    - 2025 revenue $33.17B; Jul 2 2026 market cap $40.11B
    - 1.19x sales
    - Direct merchant wallet and PSP benchmark; also a current Mesh partner on Pay with Crypto.
    - Mature incumbent with slower growth and a far more diversified consumer base than Mesh.
  - - Visa
    - FY2025 revenue $40.0B; Jul 2 2026 market cap $682.22B
    - 15.86x sales
    - Best public analog for network-scale settlement economics and stablecoin settlement expansion.
    - Scale, margins, and regulatory position are far superior to a private growth-stage startup.
  - - Mastercard
    - 2025 revenue $32.79B; Jul 2 2026 market cap $476.60B
    - 14.04x sales
    - Another premium rail comp now bringing regulated stablecoin settlement into its core network.
    - Same scale and moat gap as Visa; not a realistic direct multiple transplant.
  - - Block
    - 2025 revenue $24.19B; Jul 2 2026 market cap $47.35B
    - 1.93x sales
    - Useful downside benchmark for a payments platform with crypto adjacency and mixed-margin businesses.
    - Hardware, consumer-lending, and Cash App mix make it structurally different from Mesh.
  - - Robinhood
    - 2025 revenue $4.47B; Jul 2 2026 market cap $101.51B
    - 22.01x sales
    - Shows what public markets will pay for fast-growing digital-asset-adjacent fintech with strong narrative momentum.
    - Brokerage monetization, market sensitivity, and retail behavior differ meaningfully from merchant payments.
  enumerationScope:
    coverage: partial
    basis: Sample limited to six public payment, fintech, and crypto rails with accessible July 2026 market-data pages plus SEC filing anchors; closer private stablecoin peers remain too opaque for like-for-like valuation work.
  notes: Rows combine July 2026 market-data pages with the latest available 2025 SEC companyfacts revenue anchors; the table is a benchmark set, not a claim that Mesh deserves any one public multiple.
