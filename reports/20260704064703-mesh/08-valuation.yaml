  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-revenue
    missingEvidence: Current ARR or recognized revenue run rate and its reconciliation to payment volume.
    whyItMatters: The current valuation cannot be judged cleanly without the denominator that converts product traction into actual revenue support.
    diligencePath: Request current management accounts, board materials, or audited financial statements.
    relatedQuestionRefs:
    - QV033
  - type: private-evidence-only
    severity: material
    topic: series-c-terms
    missingEvidence: Series C liquidation preferences, seniority, ratchets, participation rights, and any secondary-sale mix.
    whyItMatters: Headline valuation can materially overstate common-equity quality when preferred terms are investor-protective.
    diligencePath: Review executed financing documents and the updated cap table with counsel.
    relatedQuestionRefs:
    - QV034
  - type: private-evidence-only
    severity: material
    topic: margin-burn-runway
    missingEvidence: Current gross margin, contribution margin, cash balance, burn, and runway under base and downside cases.
    whyItMatters: A premium infrastructure multiple depends on both revenue quality and the company’s ability to avoid a forced financing.
    diligencePath: Obtain audited P&L, treasury forecast, and board operating plan.
    relatedQuestionRefs:
    - QV035
  - type: private-evidence-only
    severity: material
    topic: concentration-and-retention
    missingEvidence: Revenue and volume concentration by top customers or partners plus retention by cohort or channel.
    whyItMatters: Named partners are helpful, but valuation support weakens sharply if a few logos dominate the economics.
    diligencePath: Request customer concentration schedules and retention or renewal cohorts.
    relatedQuestionRefs:
    - QV036
  - type: enumeration-incomplete
    severity: minor
    topic: private-comparable-coverage
    missingEvidence: Usable private comp terms for closer stablecoin-orchestration peers, secondary marks, or M&A references.
    whyItMatters: The public comp set is good enough for boundary conditions, but not for a perfect like-for-like private-market map.
    diligencePath: Collect private comp sheets, secondary pricing, or banker-marked comparable transactions.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV004
  - type: conflicting-data
    severity: minor
    topic: analyst-data-lag
    missingEvidence: A reconciled third-party funding timeline that matches current official disclosures.
    whyItMatters: Lagging private-market databases increase diligence friction and can distort outside-in benchmark work.
    diligencePath: Use company-confirmed round history or investor-side materials instead of relying on stale preview pages.
    relatedQuestionRefs:
    - QV006
