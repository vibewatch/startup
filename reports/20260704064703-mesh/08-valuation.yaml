  - - Confidence
    - medium
    - The financing event and product proof are real, but the economics below the valuation remain largely private.
  - - Risk rating
    - high
    - Competition, regulation, AML burden, and disclosure gaps can all compress the multiple quickly.
  - - Valuation stance
    - stretched
    - The current $1B mark is plausible only if revenue conversion and margins are stronger than the public file shows.
  - - Hold / exit posture
    - Long-duration optionality only
    - No public evidence supports a short-duration markup thesis or a target return from the current price.
  - - Upgrade trigger
    - Private economics close the gap
    - Disclosed ARR or revenue run rate, take rate, margin, concentration, and clean terms could move the call toward Track or Buy.
  notes: This recommendation is intentionally price-sensitive and preserves the fact that Mesh’s current financials are not public.
