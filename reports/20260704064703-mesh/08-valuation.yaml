- id: comparable-context-and-scarcity-compression
  title: Comparable context and scarcity compression
  body: The cleanest outside-in check is the public-comp spread. Current July 2026 market data and 2025 SEC filing anchors put Coinbase near seven times sales, PayPal and Block near one to two times, Visa and Mastercard in the mid-teens, and Robinhood above twenty times. That spread is useful because it shows Mesh is being priced into a very wide corridor of possible analogs. If Mesh eventually looks like a high-margin settlement network, the current price could be conservative. If it looks more like a contested merchant-enablement or crypto-payments app, the same mark could be full. Current competition argues against paying a pure scarcity premium. Coinbase Business already markets instant global stablecoin payments with compliance tooling, Stripe settles stablecoin acceptance into local currency, Visa says its stablecoin pilot is running at a $7 billion annualized pace, Mastercard is adding regulated stablecoin settlement into its core network, and BVNK and BitPay show both specialist
    scale and visible pricing pressure. Those incumbents validate the category, but they also compress how much premium Mesh should command before its own economics are visible.
