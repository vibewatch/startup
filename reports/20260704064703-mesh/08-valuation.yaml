- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - direction
  - what would change the view
  rows:
  - - The $1B mark is a real market event backed by credible investors and multiple public confirmations.
    - thesis
    - A later correction, insider-heavy secondary, or materially weaker private terms would weaken that anchor.
  - - Mesh shows product proof through PayPal, Kalshi, World App, and Circle-linked settlement expansion.
    - thesis
    - If those relationships do not convert into durable revenue or concentrate risk in a few logos, the proof is weaker than it looks.
  - - A neutral orchestration layer can benefit if stablecoin adoption rises across many wallets, exchanges, and chains.
    - thesis
    - If Visa, Mastercard, Stripe, Coinbase, or BVNK make orchestration good-enough inside broader bundles, scarcity fades.
  - - Public disclosure is too thin on revenue, margin, burn, and preferences for a buy call at the current price.
    - anti-thesis
    - Audited or board-grade economics with clean terms would materially improve underwriteability.
  - - Third-party market-data pages still lag Mesh’s official financing state, which raises diligence friction.
    - anti-thesis
    - A clean private data room or later filing-grade disclosure would reduce that friction materially.
  notes: The anti-thesis is about entry discipline and evidence quality rather than an assertion that Mesh lacks real demand.
