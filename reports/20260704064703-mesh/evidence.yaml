evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-board-disclosure
    missingEvidence: >-
      A current board roster, observer rights, committees, and any governance documents beyond the 2023 board-addition
      announcement.
    whyItMatters: >-
      Board composition and governance rights determine investor influence, oversight quality, and how much
      decision-making remains founder-concentrated.
    diligencePath: >-
      Request the latest board deck, cap table, investor rights summary, and biographies for all current directors and
      observers.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: customer-and-volume-disclosure
    missingEvidence: >-
      Audited or board-level figures for current customer count, concentration, monthly volume composition, revenue, and
      gross margin.
    whyItMatters: >-
      The public narrative has moved from partner counts to 900M-user reach and almost $10B monthly volume, but
      underwriting still requires monetization quality and customer concentration evidence.
    diligencePath: >-
      Request cohort revenue, top-customer concentration, audited transaction-volume methodology, and a bridge from
      gross volume to net revenue.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-coverage
    missingEvidence: >-
      Ownership percentages, board observer rights, debt facilities, secondaries, and whether major strategic investors
      have commercial exclusivity or preferred economics.
    whyItMatters: >-
      The public stakeholder map is directionally useful but not sufficient to infer control, alignment, or downside
      protections at the cap-table level.
    diligencePath: >-
      Obtain the latest cap table, financing docs, side letters, and any commercial agreements with strategic investors
      such as PayPal or exchange partners.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage
    missingEvidence: >-
      Exact public dates for several historical launch and partner milestones plus any licensing or compliance
      milestones tied to expansion geography.
    whyItMatters: >-
      Chronology matters because it shows whether commercial traction, product launches, and governance hardening are
      keeping pace with fundraising and geographic expansion.
    diligencePath: >-
      Ask management for a dated milestone tracker covering launches, regulated partnerships, compliance reviews, and
      major customer go-lives.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: mesh-payments-volume
    missingEvidence: >-
      A payments-only split of Mesh’s nearly $10 billion monthly platform volume by product, customer type, and
      settlement rail.
    whyItMatters: >-
      Without a payments-only split, public volume cannot be translated into serviceable market share or compared
      cleanly with real stablecoin payment-flow estimates.
    diligencePath: >-
      Request board or management reporting that breaks gross volume into deposits, payments, payouts, and other flows
      by quarter and by top customer segment.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: mesh-pricing
    missingEvidence: >-
      Public pricing or take-rate disclosure for Mesh Pay, including whether pricing is basis points, a SaaS fee, or
      customer-added pass-through fees.
    whyItMatters: >-
      Mesh’s revenue opportunity depends on monetization mechanics rather than on payment volume alone, and no retained
      source discloses that conversion.
    diligencePath: >-
      Ask management for current pricing schedules, gross margin by product, and the share of payments revenue that is
      recurring software versus variable processing fees.
    relatedQuestionRefs:
      - QM025
      - QM027
    relatedTableRefs:
      - TM002
      - TM004
  - type: conflicting-data
    severity: material
    topic: market-sizing-dispersion
    missingEvidence: >-
      A consistent same-unit dataset that separates stablecoin market cap, raw transfer volume, adjusted settlement
      volume, and payment-software revenue into one apples-to-apples market framework.
    whyItMatters: >-
      Public narratives use incompatible units, which can inflate TAM claims and distort valuation expectations if
      management or investors do not normalize the lens they are using.
    diligencePath: >-
      Rebuild the company market model from bottom-up cohorts using customer segments, take rates, wallet count, active
      merchants, payout corridors, and disclosed treasury volumes.
    relatedQuestionRefs:
      - QM025
      - QM027
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: geography-and-segment-mix
    missingEvidence: >-
      A disclosed split of Mesh customers and usage by geography, vertical, and buyer class such as merchants, fintechs,
      PSPs, wallets, and exchanges.
    whyItMatters: >-
      Segment mix determines which regulatory regimes matter most and whether Mesh’s growth depends more on U.S.
      merchants, cross-border payouts, or platform channels.
    diligencePath: >-
      Request top-customer concentration, regional GMV, and pipeline mix by segment, then reconcile those with the
      partner and product narratives on the website.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: mesh-pricing-transparency
    missingEvidence: Net take rate, FX spread, implementation fee, and volume discount data for Mesh enterprise contracts.
    whyItMatters: >-
      Outside-in pricing work is weak when most peers are sales-led and the company does not disclose realized
      economics.
    diligencePath: >-
      Request three recent proposals or signed contracts plus gross margin by product line for payments, deposits, and
      payouts.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: mesh-win-loss-data
    missingEvidence: Win rates and loss reasons against MoonPay, BVNK, Coinbase, Stripe, and incumbent PSP bundles.
    whyItMatters: The moat depends on whether Mesh wins when buyers already have viable stablecoin features from larger vendors.
    diligencePath: >-
      Ask management for the last 20 competitive deals with incumbent and crypto-native alternatives, including pricing
      and implementation differences.
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: mesh-network-density
    missingEvidence: >-
      Independent data on transacting merchants, GMV, repeat usage, and active-wallet conversion across the claimed
      customer base.
    whyItMatters: >-
      Public case studies suggest value, but they do not prove that network density and retention are compounding at
      category scale.
    diligencePath: >-
      Request monthly cohort metrics for active merchants, active payers, failed-payment rate, and repeat funded-user
      rate by product module.
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      A contract-level price list showing Mesh take rate, minimum fees, partner rev-share, and any monthly platform
      commitments.
    whyItMatters: >-
      Without realized pricing, the committee cannot convert public volume and integration breadth into revenue or
      gross-profit expectations.
    diligencePath: >-
      Request three signed merchant or PSP contracts plus a product-by-product pricing schedule, with realized discounts
      and average effective take rate by channel.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway, debt, and any liquidity or reserve facilities supporting settlement.
    whyItMatters: >-
      Capital adequacy is central to underwriting because transaction infrastructure businesses can look strong on
      volume while still needing external capital.
    diligencePath: >-
      Request a monthly cash bridge since the Series B, current unrestricted cash, debt schedule, covenant summary, and
      a 12-month base/upside/downside runway model.
    relatedQuestionRefs:
      - QI022
      - QI027
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: margin-bridge
    missingEvidence: >-
      A gross-margin bridge that separates partner fees, network fees, trading/spread costs, compliance costs, and
      support/engineering cost of revenue.
    whyItMatters: >-
      The public record shows fee components and routing complexity, but not what Mesh retains after pass-through and
      risk controls.
    diligencePath: >-
      Request monthly gross profit by product line together with transaction count, GMV, take rate, and direct cost
      buckets for payments, deposits, payouts, and verification.
    relatedQuestionRefs:
      - QI026
      - QI027
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: >-
      Customer concentration, cohort retention, renewal rates, and revenue contribution from top merchants, PSPs, and
      wallet/exchange partners.
    whyItMatters: >-
      Case studies and partner names are encouraging, but the committee still cannot test revenue durability or
      concentration risk.
    diligencePath: >-
      Request top-20 customer revenue concentration, logo/cohort retention, GMV concentration by partner, and any
      minimum-volume commitments embedded in contracts.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: material
    topic: filing-benchmark
    missingEvidence: >-
      Direct current-year cost-line excerpts from public-company filings that can anchor payment-processing and
      stablecoin infrastructure margin comparisons.
    whyItMatters: >-
      Benchmarking to public comps is still useful, but the reviewed filing index pages alone do not provide extractable
      line-item detail in the current fetches.
    diligencePath: >-
      Pull the latest 10-K/10-Q HTML or PDFs for PayPal, Coinbase, Visa, Mastercard, or Block and extract transaction
