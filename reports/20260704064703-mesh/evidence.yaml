    relatedQuestionRefs:
      - QE024
      - QE026
  - type: private-evidence-only
    severity: material
    topic: commercial-and-coverage-specifics
    missingEvidence: >-
      Versioned route coverage by geography, exchange, token, and settlement corridor plus public pricing or
