      - QI020
  - type: enumeration-incomplete
    severity: material
    topic: revenue-streams
    missingEvidence: >-
      A product-by-product revenue mix that quantifies what share of revenue comes from payments, deposits, payouts,
      verification, and enterprise/API programs.
    whyItMatters: >-
      The public evidence identifies the likely monetization lanes, but not the mix that determines revenue quality and
      margin profile.
    diligencePath: >-
      Request a trailing-12-month revenue mix by product and a same-customer cross-sell matrix showing how often
      deposits, payments, and payouts coexist.
    relatedQuestionRefs:
      - QI001
      - QI021
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      A public trust-center artifact such as a SOC 2 certificate, audit period, control scope, or downloadable security
      whitepaper.
    whyItMatters: >-
      Independent commentary references zero-trust and SOC 2, but investment underwriting needs direct evidence rather
      than second-hand summaries.
    diligencePath: >-
      Request the current SOC 2 report, bridge-provider security architecture overview, and any regulator- or
      customer-facing control matrix from Mesh.
    relatedQuestionRefs:
      - QE023
  - type: missing-source
    severity: material
    topic: sla-and-success-metrics
    missingEvidence: >-
      Customer-facing SLA language, historical uptime percentages, transfer success rates by rail, and mean time to
