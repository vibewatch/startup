  topStrengths:
    - Mesh 的编排切口很清楚：SmartFunding 以及钱包 / 交易所连接解决的是真实结账和入金摩擦，不只是再加一个代币收款按钮。
    - 公开客户证明是真实的，尤其是 Kalshi、PayPal、Shift4 和 World App 等具名部署给出了可衡量结果或线上生产范围。
    - 投资人组合强且有战略相关性，覆盖 Dragonfly、Paradigm、PayPal Ventures、Coinbase Ventures、SBI 以及其他加密支付生态支持者。
    - 稳定币采用、卡组织结算支持，以及企业对跨境加密支付的兴趣，为 Mesh 基础设施层形成可信需求顺风。
  topRisks:
    - 收入、实际 take rate、毛利率、消耗、runway 和集中度仍未披露，仅靠公开证据无法把 $1B 标记与公司经济性对上。
    - Stripe、Coinbase、Visa、Mastercard、BitPay、MoonPay、Ramp Network 和 BVNK 等既有巨头与资金充足的专门玩家，可把稳定币能力捆进更大的商户或平台关系。
    - 美国及全球的稳定币和加密支付监管正在快速收紧，KYC、AML、制裁筛查、牌照和 Travel Rule 执行负担都会上升。
    - 伙伴覆盖越广，依赖敞口也越大：PayPal、Circle、Stellar、主要钱包、交易所或分发平台的变化，可能直接传导到转化、结算和增长。
    - 共享稳定币 rails 仍暴露在欺诈、制裁、储备或脱锚冲击下；即使 Mesh 自身没有直接执法事件，信任也可能受损。
  unresolvedGaps:
    - 按产品线拆分的精确 2026 年收入、ARR、实际 take rate 和毛利率画像。
    - 账上现金、月度消耗、runway，以及股权轮之外是否还有债务、授信或优先权悬挂。
    - PayPal、Shift4、Kalshi、World App 以及其他具名伙伴或 app 上的头部客户和渠道集中度。
    - 据称接近 $10B 月交易量背后的经审计方法，以及支付、入金、出金和其他流量类型的拆分。
    - 完整董事会构成、独立治理深度，以及按司法辖区拆分的合规或牌照矩阵。
