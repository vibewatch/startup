companyProfile:
  summary: >-
    Mesh is a San Francisco-based crypto payments infrastructure company founded in 2020 and led by co-founders Bam Azizi and Adam Israel. After evolving from earlier open-finance connectivity roots into a payments network, Mesh now positions SmartFunding, Mesh Pay, Mesh Connect, and its transfer APIs as a universal interoperability layer between wallets, exchanges, PSPs, merchants, and apps. Publicly reviewed sources support a January 2026 $75M Series C led by Dragonfly at a $1B valuation, more than $200M in total disclosed funding, production relationships spanning PayPal, Shift4, Kalshi, World App, Circle-linked settlement, and 300+ connected wallets and exchanges. What the public record still does not provide is the economic bridge behind that scale: revenue, realized take rate, gross margin, burn, concentration, and round-term detail remain undisclosed.
  founders:
    - name: Bam Azizi
      role: Co-Founder & CEO
      background: PhD-trained technologist and former NoPassword co-founder whose prior company was acquired by LogMeIn in 2019.
      claimRefs: [CO014, CO015]
    - name: Adam Israel
      role: Co-Founder & Chief Commercial Officer
      background: Former HSBC managing director with enterprise payments and banking experience.
      claimRefs: [CO014, CO015]
  foundingLocation: San Francisco, California, United States
  headquarters: San Francisco, California, United States
  productSummary: Mesh sells a crypto payments and connectivity stack that lets users pay from existing wallets and exchanges while merchants or platforms settle in stablecoins or local currency. SmartFunding orchestrates fragmented balances, while Mesh Pay, account-linking flows, and transfer APIs connect wallets, exchanges, apps, and PSPs into a shared settlement network.
  customerFocus: PSPs, wallets, exchanges, fintech apps, consumer platforms, and merchants that need wallet connectivity, deposits, payouts, or stablecoin settlement without asking users to bridge or swap manually.
  businessModel: Likely a mix of enterprise SaaS and transaction-based monetization across payment orchestration, account connectivity, deposits, payouts, and settlement flows, with custom pricing and no public rate card.
  stage: late-stage private (Series C, January 2026)
  fundingStatus: Mesh announced a $75M Series C led by Dragonfly on 2026-01-27 at a $1B valuation and said total disclosed funding exceeded $200M after earlier Series A, Series B, and strategic extension rounds.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO014, CO015, CO026, CO028, CO032]
summary:
  headline: Mesh has credible product and partner proof in a large, fast-forming stablecoin-payments market, but the public record still lacks the revenue and margin evidence needed to underwrite its $1B valuation with conviction.
