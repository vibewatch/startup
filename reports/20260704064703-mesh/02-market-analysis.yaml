callouts:
- calloutType: insight
  title: The real Mesh wedge is orchestration, not stablecoins writ large
  body: Most public stablecoin headlines describe stock or transfer activity that Mesh does not monetize directly. The investable wedge is the software and workflow layer that turns wallet-based demand into merchant, payout, and treasury settlement.
  claimRefs:
  - CM004
  - CM020
  - CM053
- calloutType: risk
  title: Compliance quality is part of market access, not a back-office detail
  body: The same developments that make stablecoins more useful for cross-border settlement also make them more visible to regulators and more attractive to sanctioned actors. Mesh must win on compliant infrastructure, not just on integration speed.
  claimRefs:
  - CM034
  - CM045
  - CM046
