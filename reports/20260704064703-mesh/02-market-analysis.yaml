- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - GENIUS Act and MiCA implementation clarity
    - Positive
    - 2025-2026
    - Makes payment-stablecoin infrastructure more investable for enterprises and regulated counterparties
    - Confirm which jurisdictions matter most for Mesh revenue and what licensing dependencies remain
  - - Cross-border cost and chain-length pain
    - Positive
    - Current
    - Provides a real problem for stablecoin rails when bank chains are slow, expensive, and opaque
    - Measure corridor-level cost savings after on-ramp and off-ramp fees
  - - Merchant and platform demand
    - Positive
    - Current
    - Customer demand and a quarter-of-sales contribution among accepting merchants support real buyer pull
    - Verify whether Mesh demand is strongest in travel, gaming, fintech, or payouts
  - - Treasury and payout ROI
    - Positive
    - Current to near term
    - 24/7 settlement and lower pre-funding can create a CFO-level ROI case for platforms and enterprises
    - Request customer case studies with working-capital and settlement-timing improvements
  - - AML, CIP, and sanctions burden
    - Negative
    - Current to near term
    - Compliance obligations raise onboarding cost and can slow expansion into sensitive corridors
    - Review Mesh screening stack, rule coverage, and regulator-facing controls
  - - On-ramp, off-ramp, and FX frictions
    - Negative
    - Current
    - Stablecoins do not remove all costs because someone still has to convert into local currency and hold inventory
    - Assess corridor economics net of FX spread, inventory cost, and local payout fees
  - - Banking-system and reserve-mix spillovers
    - Negative
    - Medium term
    - Issuer reserve choices can change deposit composition and raise supervisory scrutiny on payment-stablecoin growth
    - Map which issuers and banking partners matter most to Mesh transaction reliability
  - - Peg, sovereignty, and illicit-use concerns
    - Negative
    - Current to medium term
    - Dollar dominance, frequent depegs, and large sanctions-evasion flows can slow adoption in some geographies and use cases
    - Segment the addressable market by corridors where these risks are acceptable versus prohibitive
  notes: Drivers and constraints operate simultaneously. The market is attractive when stablecoin rails solve concrete treasury or settlement pain, but the compliance and banking side-effects remain first-order diligence items.
