  - - CoinLaw / PYMNTS / Mesh volume narrative
    - '2026'
    - unsupported for SOM
    - null
    - Public evidence hints at large platform activity but not a payments-only SOM or take-rate
    - medium
    - Cannot be converted into market share without management data
  notes: This table preserves contradictory public lenses rather than forcing false precision. Market cap, raw throughput, filtered throughput, actual payment flow, and software revenue are different quantities and should not be merged into one headline TAM.
