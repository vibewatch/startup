tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Merchant checkout orchestration
    - Crypto acceptance APIs, wallet and exchange connectivity, conversion, and merchant settlement
    - Generic card acquiring or fiat-only checkout software with no wallet or stablecoin leg
    - Merchant payments, product, and finance teams
    - Core Mesh Pay wedge because it solves setup and settlement complexity
  - - Cross-border B2B and payout settlement
    - Supplier payments, creator or gig payouts, payroll and remittance-linked stablecoin settlement workflows
    - Pure wire processing or treasury systems that never touch wallet-originated funds
    - Treasury, operations, and finance leaders at platforms and enterprises
    - Important because observed payment volume is largest in B2B and payout-like categories
  - - Wallet, exchange, and platform connectivity
    - Embedded wallet linking, tokenized funding, callbacks, webhooks, and transfer orchestration
    - Standalone custody, pure consumer wallet apps, or broker interfaces with no merchant or payout workflow
    - Fintech, exchange, wallet, and PSP product owners
    - This is the channel layer that can compress distribution for Mesh
  - - Settlement, FX, and compliance overlay
    - Stablecoin-to-fiat conversion, corridor routing, sanctions screening, and operational controls tied to payment flows
    - General AML software sold with no payment-orchestration role
    - Payments operations, compliance, and treasury teams
    - Needed to convert raw crypto demand into production-grade payment rails
  - - Stablecoin issuance and reserve management
    - N/A
    - Issuer economics, reserve asset management, attestations, and token design
    - Stablecoin issuers and regulators
    - Adjacent but not Mesh’s monetization surface
  - - Speculative trading, DeFi, and internal transfers
    - N/A
    - Exchange churn, smart-contract routing, yield farming, and internal wallet reshuffling
    - Traders, protocols, and market makers
    - Large on-chain volumes here distort top-down TAM if they are treated as payment demand
  notes: Boundary is intentionally narrower than all stablecoin activity. Included spend must require orchestration between crypto-originated value and merchant, platform, or payout settlement.
