  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: mesh-payments-volume
    missingEvidence: A payments-only split of Mesh’s nearly $10 billion monthly platform volume by product, customer type, and settlement rail.
    whyItMatters: Without a payments-only split, public volume cannot be translated into serviceable market share or compared cleanly with real stablecoin payment-flow estimates.
    diligencePath: Request board or management reporting that breaks gross volume into deposits, payments, payouts, and other flows by quarter and by top customer segment.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: mesh-pricing
    missingEvidence: Public pricing or take-rate disclosure for Mesh Pay, including whether pricing is basis points, a SaaS fee, or customer-added pass-through fees.
    whyItMatters: Mesh’s revenue opportunity depends on monetization mechanics rather than on payment volume alone, and no retained source discloses that conversion.
    diligencePath: Ask management for current pricing schedules, gross margin by product, and the share of payments revenue that is recurring software versus variable processing fees.
    relatedQuestionRefs:
    - QM025
    - QM027
    relatedTableRefs:
    - TM002
    - TM004
  - type: conflicting-data
    severity: material
    topic: market-sizing-dispersion
    missingEvidence: A consistent same-unit dataset that separates stablecoin market cap, raw transfer volume, adjusted settlement volume, and payment-software revenue into one apples-to-apples market framework.
    whyItMatters: Public narratives use incompatible units, which can inflate TAM claims and distort valuation expectations if management or investors do not normalize the lens they are using.
    diligencePath: Rebuild the company market model from bottom-up cohorts using customer segments, take rates, wallet count, active merchants, payout corridors, and disclosed treasury volumes.
    relatedQuestionRefs:
    - QM025
    - QM027
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: geography-and-segment-mix
    missingEvidence: A disclosed split of Mesh customers and usage by geography, vertical, and buyer class such as merchants, fintechs, PSPs, wallets, and exchanges.
    whyItMatters: Segment mix determines which regulatory regimes matter most and whether Mesh’s growth depends more on U.S. merchants, cross-border payouts, or platform channels.
    diligencePath: Request top-customer concentration, regional GMV, and pipeline mix by segment, then reconcile those with the partner and product narratives on the website.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM003
