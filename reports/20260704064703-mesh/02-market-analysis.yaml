company:
  name: Mesh
chapter:
  number: 2
  title: Market Analysis
  summary: 'Mesh sits in the narrow but fast-forming infrastructure layer between wallet-based crypto demand and merchant or platform settlement, not in the full stablecoin universe. The retained evidence shows why market narratives diverge so sharply: 2025 raw stablecoin volume reached tens of trillions, but observed real payments were closer to hundreds of billions and the revenue pool for crypto payment software was only about $1.5 billion in 2026. That mismatch makes buyer segmentation, integration friction, and compliance execution more important for Mesh valuation than any single headline TAM figure.'
sections:
- id: market-boundary-and-status-quo
  title: Market boundary and status-quo substitutes
  body: The cleanest way to define Mesh’s market is not “all stablecoins” and not “all crypto,” but the narrower set of workflows where a business wants to accept value from wallets or exchanges and settle it as stablecoins or fiat without taking volatility, compliance, or integration complexity onto its own balance sheet. Mesh’s own materials consistently describe a network that sits between merchant checkout, wallet connectivity, payout orchestration, and settlement choices. That makes the included spend payment acceptance software, wallet and exchange connectivity, payout routing, off-ramp and FX tooling, and the operational plumbing needed to run those flows reliably. It excludes stablecoin issuance, reserve management, speculative trading, and generic DeFi transaction volume. This boundary matters because public market headlines still blur real payments with internal transfers and trading. The retained evidence points to a market in which the bottleneck is orchestration and trusted
    connectivity, not a need for another wallet or another stablecoin itself.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM009
  - CM010
  - CM053
  tableRefs:
  - TM001
- id: sizing-lenses-and-contradictory-estimates
  title: Sizing lenses and contradictory estimates
  body: Public sizing for stablecoin payments is highly sensitive to what exactly is being measured. The Federal Reserve’s April 2026 note put market capitalization at $317 billion, while CoinLaw cites an aggressive scenario above $2 trillion by 2026. Those are both stock measures, not revenue or payments-flow measures. Transaction-flow estimates are even more dispersed. CoinLaw cites $33 trillion of 2025 raw on-chain stablecoin volume and more than $10 trillion on a filtered basis, while the McKinsey and Artemis analysis summarized by Crypto Valley Journal says actual payments were only about $390 billion. Artemis reinforces why those gaps persist by showing that even on Ethereum, payment labeling, smart-contract filtering, and internal business transfers drastically change the answer. For Mesh, the most useful public lenses are therefore the software revenue pool and the enterprise-relevant payment-flow slice, not the broadest volume or market-cap numbers. The retained evidence supports
    a large and growing category, but it does not support a lazy claim that every stablecoin dollar is serviceable Mesh TAM.
