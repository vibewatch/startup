  - - CoinLaw / Chainalysis
    - '2025'
    - USD trillions annual flow
    - 33
    - Raw stablecoin transaction volume
    - low
    - Includes bots, internal transfers, and non-payment activity
  - - CoinLaw / Visa adjusted method
    - '2025'
    - USD trillions annual flow
    - 10
    - Filtered stablecoin transaction volume excluding more noise
    - low
    - Still broader than real payment flow and based on third-party summary
  - - McKinsey / Artemis summary via Crypto Valley Journal
    - '2025'
    - USD billions annual flow
    - 390
    - Estimated actual stablecoin payment flow
    - medium
    - Summary source rather than original McKinsey text
  - - Derived enterprise-relevant payment flow
    - '2025'
    - USD billions annual flow
    - 320.5
    - B2B plus payroll/remittance plus card payment categories observed in the McKinsey and Artemis summary
