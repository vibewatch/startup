    - Product and operations budget
    - Ability to add crypto rails without building direct integrations
  - - Wallets and exchanges
    - Product, BD, or ecosystem partnerships leader
    - Growth teams and developer teams
    - Platform operator
    - Offer spending, funding, or merchant acceptance from held assets
    - Growth and platform budget
    - Need to extend utility beyond trading or custody
  - - Marketplaces and gig or creator platforms
    - Treasury leader, COO, or payouts owner
    - Finance ops and payout operations
    - Platform operator
    - Stablecoin-funded payouts to globally distributed users
