schemaVersion: report-v2
artifact: valuation
slug: deepl
runDate: '2026-05-20'
company:
  name: DeepL
chapter:
  number: 8
  title: Valuation
  summary: >-
    DeepL has enough real product and customer proof to deserve a premium to services-heavy language peers,
    but the public record still does not support paying the 2024 $2 billion mark with conviction. The best
    evidence-sensitive stance is research-more: the current price can only be justified in a bull case where
    audited revenue is already well above current third-party estimates, margins look software-like, and the
    2024 round terms are clean. Without that proof, public comparables and filing-grade disclosure standards
    point to a stretched entry and weak current asymmetry.
sections:
  - id: recommendation-and-anchor
    title: Recommendation stays research-more because the current mark requires bull-case proof
    body: >-
      The latest clean public price anchor is still DeepL's May 2024 financing: $300 million raised at a
      $2 billion valuation. That mark is not absurd on company quality alone. DeepL now publicly claims more
      than 200,000 business customers, 1 million paid licenses, more than 1,000 employees, and a platform
      that extends from translation into writing, voice, and API distribution. Those are real premium-quality
      signals. The problem is that price discovery is private while the revenue, margin, retention, and term-
      sheet facts required to underwrite the mark remain private too. The best current third-party revenue
      estimate is GetLatka's $185.2 million for 2024, which puts the last mark at about 10.8x revenue. Even
      allowing for growth since then, that is still a rich multiple versus disclosed public peers. Recommendation:
      research-more. Confidence: medium. Risk rating: high. Valuation stance: stretched. Decision implication:
      do not underwrite a fresh entry near $2 billion unless diligence proves the bull case or price moves down
      toward the mid-$1 billions.
    claimRefs: [CV001, CV005, CV006, CV008, CV011, CV015, CV019, CV039, CV042, CV047, CV048, CV049]
    tableRefs: [TV001]
    figureRefs: [FV001]

  - id: thesis-and-anti-thesis
    title: The thesis is software-like Language AI scale; the anti-thesis is disclosure, terms, and public-comp gravity
    body: >-
      The thesis rests on six linked ideas. Market demand is real: DeepL's 2026 survey says 35% of businesses
      still run manual translation workflows and 71% say AI-led workflow transformation is a 2026 priority.
      Product breadth is also real: DeepL is no longer only a text-translation tool, but a platform spanning
      translation, writing improvement, voice, and API-based partner distribution. Customer proof is stronger
      than most private AI stories: official materials cite more than 200,000 business customers, 1 million paid
      licenses, 50% of the Fortune 500, and case studies with meaningful production usage. The anti-thesis is
      just as important. Public financial proof still stops at third-party estimates, the company was still described
      as not profitable in 2024 reporting, exact 2024 round preferences and secondary economics are undisclosed,
      and a live regulatory precedent already exists in the 2024 PIPC investigation. Public markets also offer a hard
      discipline check: Duolingo, RWS, and Appen all trade on far lower disclosed revenue multiples than the mark
      implied by DeepL's latest valuation anchor. That does not make DeepL low quality; it means the premium still
      depends on facts that investors cannot yet inspect.
    claimRefs: [CV005, CV011, CV015, CV016, CV017, CV019, CV020, CV021, CV022, CV023, CV035, CV036, CV037, CV038]
    tableRefs: [TV002]
    figureRefs: [FV004]

  - id: public-comps-and-scenarios
    title: Public comparables and scenario work put price discipline around the private premium
    body: >-
      The selected comparable set is intentionally mixed because no public company is a perfect DeepL analogue.
      Duolingo is the best premium language-software reference and still trades at only about 3.8x EV to sales.
      RWS is the closest scaled language and localization incumbent but is far more services-heavy and now trades
      around 0.5x market cap to revenue after a difficult FY2025. Appen is not a translation-software peer, yet it is
      a valuable cautionary AI-data-services comp because it shows how quickly public valuation can compress when
      concentration, mix, and market structure work against investors. Against those disclosed anchors, DeepL's
      2024 $2 billion valuation on a $185.2 million 2024 revenue estimate looks meaningfully richer than public
      precedent. A premium is deserved if DeepL really behaves like a high-growth, software-led, multilingual AI
      platform with strong margins and low concentration. Public evidence does not prove that today. That is why the
      current mark belongs near the bull end of a supportable range, not at the center of the base case.
    claimRefs: [CV006, CV008, CV026, CV027, CV028, CV029, CV030, CV031, CV032, CV033, CV034, CV035, CV036, CV040, CV043, CV044, CV045, CV046]
    tableRefs: [TV003, TV004]
    figureRefs: [FV002, FV003]

  - id: diligence-gates-and-exit-path
    title: Exit readiness exists at the product scale level, but not yet at the disclosure level
    body: >-
      DeepL looks more like an eventual IPO or large secondary candidate than an immediate strategic-sale story.
      The company has enough scale, category visibility, and customer proof to support a 3- to 5-year exit window,
      but it does not yet look public-company ready from a disclosure standpoint. Filing-grade peers let investors read
      revenue, profitability, concentration, and balance-sheet detail directly; DeepL does not. The final diligence work is
      therefore basic but decisive: prove the current revenue and growth level, show gross margin and retention, explain
      customer concentration and compute intensity, and disclose the actual economic seniority of the 2024 round and
      any secondary or tender mechanics. Until those items are closed, the right IC framing is simple: monitor the thesis,
      do not pay today's price as though the missing facts have already been proven, and downgrade hard if the eventual
      disclosure shifts DeepL from software premium toward hybrid-service or AI-utility economics.
    claimRefs: [CV011, CV012, CV024, CV025, CV041, CV042, CV047, CV049, CV050, CV051]
    tableRefs: [TV005, TV006]
    figureRefs: []

tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - recommendation
      - confidence
      - risk rating
      - valuation stance
      - decision implication
    rows:
      - - research-more
        - medium
        - high
        - stretched
        - Do not underwrite a new entry near the last $2B mark without audited revenue, margin, retention, and clean terms; interest improves only with bull-case proof or a materially lower price.
    notes: >-
      The call is price-sensitive and evidence-sensitive: current public proof supports quality, but not enough upside
      versus downside at the last disclosed valuation.
    claimRefs: [CV001, CV008, CV011, CV042, CV047, CV048, CV049]

  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - side
      - argument
      - what would change the view
    rows:
      - - Thesis
        - 'Market demand is still under-automated: 35% of businesses remain manual and 71% say AI workflow transformation is a 2026 priority.'
        - Broad enterprise workflow adoption and clearer paid conversion data would strengthen the premium case.
      - - Thesis
        - 'DeepL has real software-scale proof: 200k+ business customers, 1M paid licenses, 50% of the Fortune 500, and enterprise controls.'
        - Public disclosure of enterprise ACV bands, retention, and cohort expansion would make this customer base more investable.
      - - Thesis
        - Product breadth now spans translation, write, voice, and API-led partner distribution, which supports a platform premium over narrow translation tools.
        - Durable write/voice/API attach and partner-sourced ARR would justify paying above services-led language peers.
      - - Anti-thesis
        - The core revenue anchor is still a third-party estimate, while audited revenue, gross margin, NRR, and concentration remain private.
        - Audited FY2025/FY2026 revenue, software-like gross margin, and retention disclosure would materially reduce uncertainty.
      - - Anti-thesis
        - 'Public comp gravity is harsh: Duolingo, RWS, and Appen all trade well below DeepL''s implied 2024 multiple.'
        - Either the entry price must fall or DeepL must prove much stronger economics than those disclosed peers.
      - - Anti-thesis
        - Round terms, secondary mechanics, and a live privacy-regulatory precedent mean common-equity economics could be worse than the headline valuation suggests.
        - A clean cap-table waterfall, no structured protections, and no renewed trust shock would improve the underwriting case.
    notes: >-
      The thesis is about real market, product, and customer quality; the anti-thesis is about what investors still cannot verify at the current price.
    claimRefs: [CV011, CV015, CV016, CV019, CV020, CV021, CV022, CV023, CV035, CV037, CV038]

  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - Current revenue is already >$230M, growth remains >30%, gross margin is software-like, write/voice/API expansion lifts mix, and the 2024 round terms are clean.
        - Valuation roughly $1.9B-$2.4B; near-flat to modest upside from the last mark, which means even the bull case does not leave much margin for error at today's price.
        - Multiple compression, weak retention, or structured terms erase most of the upside.
        - '~20%'
      - - Base
        - Revenue is roughly $190M-$230M, growth moderates into the 20s, enterprise adoption continues, and no major trust or regulatory shock lands.
        - Valuation roughly $1.3B-$1.8B; below the last mark, implying weak current entry asymmetry and better opportunity only at a lower price.
        - Missing margin proof, lower attach, or more services-like economics compress the premium quickly.
        - '~55%'
      - - Bear
        - Revenue is <$170M or slowing sharply, gross margin and retention disappoint, concentration proves high, or compliance / trust issues worsen.
        - Valuation roughly $0.7B-$1.1B; clear down-round or discounted-secondary territory.
        - Competition, compute-heavy mix, cap-table surprises, and renewed privacy concerns accelerate the re-rate.
        - '~25%'
    notes: >-
      These are public-evidence scenarios, not management forecasts. They intentionally pay for uncertainty instead of treating missing private data as already solved.
    claimRefs: [CV006, CV008, CV011, CV035, CV043, CV044, CV045, CV046, CV047, CV049, CV050]

  - id: TV004
    title: Comparable valuation table
    columns:
      - comparable
      - metric
      - multiple / valuation / status
      - relevance
      - limitation
    rows:
      - - Duolingo
        - EV / sales; public language software
        - ~3.78x EV / sales and ~4.84x PS in May 2026
        - Best public premium-language-software benchmark with strong product and consumer awareness.
        - Consumer / education mix, profitability, and disclosure quality are materially better than DeepL's.
      - - RWS Holdings
        - Market cap / revenue; public language and localization incumbent
        - ~0.5x market cap / FY2025 revenue
        - Closest public scaled language-services and localization reference.
        - More services-heavy, lower-growth, and currently in transition with weaker profitability.
      - - Appen
        - Market cap / revenue; AI data services cautionary comp
        - ~1.0x market cap / FY2025 revenue
        - Useful warning case for concentration, mix, and AI-adjacent multiple compression.
        - Not a translation-software peer and still carries different delivery economics.
      - - DeepL 2023 primary round
        - valuation / annual run rate
        - ~20x on a ~$50M annual run rate at the €1B / $1B+ mark
        - Shows prior investor willingness to pay a very high premium for growth and category promise.
        - Based on investor-source reporting rather than audited company filings.
      - - DeepL 2024/current public mark
        - valuation / revenue estimate
        - $2.0B on GetLatka's $185.2M 2024 revenue estimate = ~10.8x
        - Frames the price investors are being asked to underwrite today.
        - Depends on a third-party estimate and undisclosed round terms rather than filing-grade financials.
    notes: >-
      This is a deliberately selective set: the best premium language-software reference, the closest public language-services benchmark,
      a cautionary AI-data-services case, and DeepL's own recent private marks.
    enumerationScope:
      coverage: partial
      basis: >-
        Selected 2026 public and milestone references most relevant to DeepL's language-AI / localization / AI-services valuation problem;
        this is not the full universe of SaaS, LLM, or translation companies.
    claimRefs: [CV008, CV010, CV026, CV027, CV028, CV029, CV030, CV031, CV032, CV033, CV034, CV035, CV040]

  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - trigger
      - threshold
      - transmission to thesis
      - action implication
    rows:
      - - Revenue proof fails
        - Audited current revenue / ARR lands materially below the public working range, especially below ~$170M
        - The private premium collapses because the current mark can no longer be defended as a software-growth price.
        - Do not underwrite the current mark; reset toward bear-case economics.
      - - Software economics fail
        - Gross margin proves <65% or retention proves weak (for example NRR <105%)
        - DeepL starts to look more like a compute-heavy or hybrid-service business than a premium AI software platform.
        - Re-rate toward lower public comps and pause any premium entry case.
      - - Terms or waterfall surprise
        - Participating prefs, ratchets, aggressive seniority, or heavy secondary/tender overhang sit ahead of common
        - Headline valuation no longer reflects common-equity economics.
        - Pause process until the full cap-table and waterfall are rebuilt.
      - - Trust / concentration shock
        - Material new privacy, regulatory, reliability, or customer-concentration issue emerges
        - The premium multiple loses support because growth durability and customer quality are no longer trusted.
        - Downgrade immediately and move the recommendation toward avoid until resolved.
    notes: >-
      These are measurable underwriting failures, not generic watch items. Each trigger directly attacks the premium multiple required by the current mark.
    claimRefs: [CV011, CV012, CV023, CV038, CV045, CV049, CV050]

  - id: TV006
    title: Final diligence asks table
    columns:
      - topic
      - missing evidence
      - why it matters
      - owner or diligence path
    rows:
      - - Revenue bridge
        - Audited FY2024-FY2026 revenue / ARR bridge from the 2023 $50M run-rate story to current actual scale
        - The current mark is extremely sensitive to whether real revenue is closer to $170M, $200M, or >$230M.
        - Request CFO pack, auditor-reviewed KPI definitions, and monthly ARR / revenue bridge by product and geography.
      - - Margin and compute economics
        - Gross margin, contribution margin, inference / cloud / voice cost burden, and product-mix detail
        - DeepL only deserves a premium software multiple if economics are materially better than hybrid-service or AI-utility peers.
        - Obtain product-family gross-margin waterfall and cloud / GPU commitment schedule.
      - - Retention and concentration
        - NRR, GRR, logo retention, ACV bands, API concentration, and top-customer share of revenue
        - Quality customer headlines are not enough if a few large accounts or low-retention cohorts drive the economics.
        - Request cohort analysis, top-20 customer list, and renewal schedule by segment.
      - - 2024 round economics
        - Liquidation preferences, participation rights, ratchets, employee tender mechanics, and primary versus secondary split
        - Headline price can mislead if common-equity economics are structurally worse than the press release implies.
        - Review financing documents, cap table, and waterfall analysis with counsel.
      - - Exit readiness package
        - Audited statements, governance maturity, legal / privacy readiness, and S-1-grade disclosure controls
        - DeepL may be operationally scaled enough for an IPO path, but not yet disclosure-ready enough to price like one.
        - Request board materials, audited financial history, regulatory memo, and IPO-readiness gap assessment.
    notes: >-
      These are the minimum diligence asks needed to move from an interesting private AI asset to an investable price call.
    claimRefs: [CV011, CV012, CV023, CV041, CV047, CV049, CV050, CV051]

figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      DeepL's recommendation stays cautious because strong scale and product proof still meet a valuation that depends on missing private facts.
    data:
      nodes:
        - label: 'Demand proof: multilingual workflow pain is still real in 2026'
        - label: 'Product / customer proof: 200k+ businesses, 1M paid licenses, write + voice + API'
        - label: 'Price anchor: May 2024 financing at $2B'
        - label: 'Public-comp gravity: Duolingo, RWS, and Appen all trade lower on disclosed revenue'
        - label: 'Disclosure gap: audited revenue, margins, retention, and round terms remain private'
        - label: 'Recommendation: research-more; require cleaner proof or a lower entry price'
    approximationNotes: null
    claimRefs: [CV001, CV006, CV015, CV019, CV035, CV042, CV047]

  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The biggest valuation levers are audited revenue proof, software-like economics, clean common-equity terms, and downside compression toward public comparables.
    data:
      items:
        - label: Audited revenue >$230M and >30% growth
          value: 0.3
        - label: Gross margin >75% and NRR >115%
          value: 0.2
        - label: Clean cap table with limited overhang
          value: 0.1
        - label: Re-rating toward disclosed public comps
          value: -0.5
        - label: Compliance / concentration / trust shock
          value: -0.6
    approximationNotes: >-
      Values are directional change-in-valuation scores in USD billions relative to the $2B anchor, derived from the scenario framework rather than management guidance.
    claimRefs: [CV011, CV035, CV038, CV043, CV044, CV045, CV049, CV050]

  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Public evidence supports a wide range with the current mark sitting near the low end of the bull case rather than inside the base case.
    data:
      items:
        - label: Bear
          low: 0.7
          mid: 0.9
          high: 1.1
        - label: Base
          low: 1.3
          mid: 1.55
          high: 1.8
        - label: Bull
          low: 1.9
          mid: 2.15
          high: 2.4
    approximationNotes: >-
      Values are broad equity-valuation ranges in USD billions synthesized from the 2024 private mark, public comparables, and a cautious private AI premium assumption.
    claimRefs: [CV035, CV042, CV043, CV044, CV045, CV046, CV047]

  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      DeepL scores well on market need and product/customer proof, but weakly on disclosure quality and current valuation support.
    data:
      items:
        - label: Market demand
          value: 7
        - label: Product breadth
          value: 8
        - label: Customer proof
          value: 7
        - label: Disclosure quality
          value: 3
        - label: Risk control
          value: 4
        - label: Current valuation support
          value: 3
    approximationNotes: >-
      Scores are ordinal 0-10 diligence judgments synthesized from retained evidence, not management-provided KPIs.
    claimRefs: [CV015, CV016, CV019, CV022, CV023, CV035, CV038, CV042, CV049]

