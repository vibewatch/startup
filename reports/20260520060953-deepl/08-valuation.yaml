  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: current-revenue-and-margins
      missingEvidence: 'Audited FY2025-FY2026 revenue / ARR, gross margin, and retention metrics for DeepL.'
      whyItMatters: 'The current valuation is only supportable if DeepL is already materially above the best public revenue estimate and behaves like a premium software company on margin and retention.'
      diligencePath: 'Request audited historical financial statements, KPI definitions, monthly revenue / ARR bridge, gross-margin waterfall, and NRR / GRR by segment.'
      relatedQuestionRefs: [QV004]
      relatedTableRefs: [TV003, TV006]

    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: 'Exact 2024 round waterfall, liquidation preferences, participation rights, ratchets, and primary-versus-secondary mix.'
      whyItMatters: 'Headline valuation can materially overstate the economics available to new or common-equity holders if seniority or tender mechanics are unfavorable.'
      diligencePath: 'Review financing documents, cap table, employee tender materials, and a fully diluted waterfall model with counsel.'
      relatedQuestionRefs: [QV010]
      relatedTableRefs: [TV005, TV006]

    - type: private-evidence-only
      severity: material
      topic: concentration-and-quality
      missingEvidence: 'Customer concentration, ACV distribution, renewal schedule, API concentration, and product attach by cohort.'
      whyItMatters: 'Strong customer-count headlines can still hide concentration, weak retention, or lower-quality revenue that would not justify a premium software multiple.'
      diligencePath: 'Request top-customer exposure, cohort retention, ACV buckets, API customer concentration, and write / voice / API attach by segment.'
