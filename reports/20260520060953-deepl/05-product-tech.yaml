    - Available for sales-assisted yearly customers
    - Regional pinning for EU / US / JP
    - Need pricing, contract language, and confirmation of where logs/monitoring sit outside primary region
  - - Voice subprocessors
    - Documented for some languages / features
    - Speech-to-text and translated speech in specific cases
    - Need exact language map, retention terms, and customer notification mechanics when partner routing applies
  - - Support and SLAs
    - Advertised but not numerically public in fetched pages
    - Business-critical support for enterprise customers
    - Request public or NDA SLA sheet, incident metrics, and status-history export before underwriting mission-critical use
