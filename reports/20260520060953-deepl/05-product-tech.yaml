- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - DeepL workflow
  - Measurable benefit
  - Known limitation
  rows:
  - - Localize product/content operations
    - Manual vendor handoff or disconnected CAT/MT tools
    - Translator + Translation Flow + Customization Hub orchestrate translation, review, and brand controls
    - Company cites up to 90% faster translation turnaround and workflow transparency improvements
    - Public evidence does not show reviewer headcount savings or error-rate deltas by module
  - - ERP / software localization at scale
    - Custom scripts plus manual post-editing across releases
    - API Translate embeds multilingual output inside product/localization pipelines
    - Haufe X360 case cites 24 million translated characters
    - Case studies do not disclose steady-state cost per release or human-review burden
  - - Improve employee writing before external communication
    - Manual editing in Office or fragmented writing assistants
    - Write Pro / Write API add corrections, rewrites, style, and tone controls inside business tools
    - Reduces manual editing time and standardizes tone across teams
    - Current public language breadth for Write is narrower than translation breadth
  - - Run multilingual virtual meetings
    - Live interpreters, bilingual follow-up, or fragmented caption tools
    - Voice for Meetings provides translated captions/transcription inside Teams and Zoom
    - Customer story cites a 50% reduction in meeting times
    - App-specific language support appears narrower than total Voice platform language count
  - - Handle in-person multilingual conversations
    - Human interpreters or staff limited by language coverage
    - Voice for Conversations offers on-device speech translation on mobile/web
    - Faster frontline communication without adding separate interpreters
    - Voice-to-voice breadth and enterprise rollout maturity remain only partially public
  - - Automate CRM/support/Power Platform flows
    - Copy-paste translation outside core system
    - Power Platform connector and Salesforce listing package translation into workflows and CRM
    - Lets teams translate text/documents and manage glossaries without leaving automation/CRM context
    - Government-region exclusions and rate limits are public constraints on some connector paths
