- id: architecture-and-operating-model
  title: Architecture and operating model
  body: 'Public technical documentation supports a layered operating model. For text and writing, DeepL runs conventional request/response APIs with Free and Pro endpoint separation, language-discovery endpoints, model-type controls, context injection, glossary and style-rule hooks, and document-translation flows. For voice, the operating model is explicitly different: a client first requests a session, then streams audio over WebSocket and receives transcripts and translations incrementally, with reconnect logic, chunk-size guidance, JSON or MessagePack encoding, and per-session limits such as five target languages and one-hour maximum connections. Around those data planes sits a workflow-control layer of Translation Flow, glossaries, style rules, and translation memories. The most important 2026 architecture change is not at the API edge but in the compute/data plane: DeepL Trust Center materials say business and enterprise traffic now moves to a hybrid model that combines AWS with DeepL''s
    proprietary infrastructure, while research, model training, and free-tier workloads continue on proprietary Iceland/Sweden data centers. That is paired with a contractual Data Residency add-on for sales-assisted customers that need regional pinning. In other words, DeepL''s product architecture is no longer best described as a single black-box MT engine; it is a multi-surface platform with distinct text, voice, workflow-control, and admin/security planes running on a newly hybrid infrastructure model.'
