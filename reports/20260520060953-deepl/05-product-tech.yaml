  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public uptime and sla metrics
    missingEvidence: A public or NDA-backed SLA sheet with uptime commitments, service credits, and historical availability or incident summaries by product surface.
    whyItMatters: Voice and workflow products are operationally useful only if buyers can underwrite reliability; marketing references to SLAs are weaker than actual SLA language or incident exports.
    diligencePath: Request the enterprise SLA, status-history export, and any reliability dashboard screenshots for Translator, Write, and Voice.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: voice subprocessor language mapping
    missingEvidence: An exact language-by-language map showing when Speechmatics or ElevenLabs is invoked, plus retention and residency terms for those routes.
    whyItMatters: Voice privacy review depends on whether a given customer language pair stays fully inside DeepL or is routed through additional processors.
    diligencePath: Obtain the Help Center matrix referenced by the voice service specification and confirm subprocessor coverage in the DPA and product SKU docs.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module attach and paid adoption mix
    missingEvidence: Module-level paid customer counts, seat counts, API usage mix, and attach rates for Write and Voice versus the mature translation core.
    whyItMatters: The moat and roadmap look stronger if new modules are monetizing meaningfully, but public sources only show product existence and selected case studies.
    diligencePath: Request cohort data by module, share of enterprise contracts with Write/Voice attached, and API usage splits by translate, write, and voice.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: minor
    topic: voice conversations and voice-to-voice ga scope
    missingEvidence: A public roadmap or SKU sheet clarifying GA timing, supported devices, priced plans, and production limits for Voice for Conversations and translated speech output.
    whyItMatters: The newest voice surfaces are strategically attractive but still look less mature than Translator or the text APIs.
    diligencePath: Request Voice SKU documentation, GA dates, and production customer references broken out by Meetings, Conversations, and Voice API translated speech.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
