- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap / diligence ask
  rows:
  - - No training without consent
    - Explicitly stated on enterprise/security surfaces
    - Customer text across business platform
    - Confirm whether the promise applies uniformly to all new 2026 AWS-backed services and stored artifacts such as style guides/history
  - - SSO / MFA / RBAC / domain controls
    - Publicly disclosed
    - Enterprise access management and secure administration
    - Request admin audit screenshots and policy defaults for large-seat deployments
  - - BYOK and client-side encryption outside AWS
    - Publicly disclosed
    - Enterprise encryption and 2026 AWS hybrid model
    - Clarify exact key-management architecture, KMS options, and feature availability by SKU
  - - Audit logs and usage insights
    - Publicly disclosed
    - Enterprise governance and activity reporting
    - Need exported sample logs and retention policy by product surface, especially Voice
  - - ISO 27001 / SOC 2 Type II / GDPR / HIPAA / BSI C5
    - Company-claimed current
    - Business platform compliance posture
    - Request certificates, report scopes, and whether Voice and new AWS processing sit inside the same control boundary
