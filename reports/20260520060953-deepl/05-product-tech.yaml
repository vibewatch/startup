- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - DeepL Translator
    - Knowledge workers, localization teams, regulated business users
    - GA; mature core product
    - AI-first translation workspace rather than a raw MT endpoint alone
    - Need customer-level attach data by vertical and whether high-volume enterprise use sits in core UI or API
  - - Translation Flow
    - Localization managers and cross-functional content teams
    - GA on public product page
    - Adds job routing, review/progress management, and system connections above the model layer
    - Public evidence does not quantify adoption, throughput, or reviewer productivity gains
  - - Customization Hub
    - Language owners, brand/compliance admins
    - GA and expanding via 2026 APIs
    - Combines glossaries, style guides, style profiles, and translation memory as centralized control layer
    - Need proof of how often customers use style rules and translation memory in production rather than only glossaries
  - - DeepL Write Pro / Write API
    - Business writers, support/sales teams, embedded app developers
    - GA; scope expanding in 2026
    - Writing improvement adjacent to translation, with tone/style controls and workflow embedding
    - Need clearer public split between browser/app use, enterprise seats, and API usage
  - - DeepL Voice for Meetings
    - Distributed teams using Teams/Zoom
    - GA product surface; packaged Teams app
    - Real-time multilingual captions/transcription for meetings with enterprise security messaging
    - Public materials do not disclose uptime, latency, or seat-level pricing
  - - DeepL Voice for Conversations
    - Frontline workers and in-person customer interactions
    - Early commercial surface; narrower maturity than Translator
    - On-device speech translation for face-to-face workflows
    - Public GA scope, device coverage detail, and enterprise rollout metrics are limited
  - - DeepL API (Translate / Write)
    - Developers, product teams, automation builders
    - GA and mature; broad docs/SDK surface
    - Combines translation and writing improvement with workflow integrations and official SDKs
    - Need module-level revenue mix and usage concentration by API function
  - - DeepL Voice API
    - Contact centers, BPOs, voice-product builders
    - GA for paid API customers as of April 2026
    - Real-time speech translation over WebSocket with multilingual output and session controls
    - Voice uses external subprocessors for some languages/features and translated speech remains closed beta
