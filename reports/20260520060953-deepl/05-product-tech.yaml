- id: modules-and-integrations
  title: Module map, deployment surfaces, and workflow integrations
  body: 'DeepL''s module map matters because it shows where the company is moving up-stack from raw translation into embedded workflow software. Translator, Write Pro, and Voice are the human-facing experiences; the API, SDKs, and partner connectors are the delivery rails into customer systems. Microsoft surfaces are especially mature in public evidence: Word integration preserves formatting and adds writing improvement; Teams support is productized through DeepL Voice for Meetings; and the Power Platform connector exposes translation, document translation, glossary management, usage checks, and supported-language discovery. Salesforce AppExchange also shows a packaged CRM deployment path, even if the listing is partner-built rather than first-party. This is strategically relevant because buyers often do not want a standalone translation tab—they want language functions inside Office, meetings, support, CRM, and automation flows. The practical implication is that DeepL''s integration story
    is strong in office/productivity and API-led automation, but public evidence for deeper packaged systems-of-record coverage remains thinner than the Office and Power Platform surfaces. That makes the API and official SDKs disproportionately important to enterprise adoption outside Microsoft''s ecosystem.'
