chapter:
  number: 5
  title: Product & Technology
  summary: DeepL has evolved from a pure translator into a workflow-oriented Language AI platform built around four surfaces—Translator, Write, Voice, and API—plus a control layer of glossaries, style rules, translation memories, and enterprise admin/security features. The public record supports meaningful product velocity in 2025-2026, including Voice API GA, translation-memory APIs, expanded style-rule controls, and a 2026 infrastructure shift to hybrid AWS plus proprietary clusters. The biggest product-tech diligence issues are not whether there is a real product—they clearly exist—but how the January 2026 AWS/global-processing change affects buyer expectations, which voice languages route through subprocessors, and how much paid adoption sits in newer modules such as Voice and Write.
sections:
- id: product-definition
  title: Product definition in workflow terms
  body: 'DeepL now describes its offer less as a single translator and more as a Language AI platform for business communication. In workflow terms, the core customer job is to move multilingual work through an operating loop: ingest text, files, or speech; apply language conversion or writing improvement; enforce terminology, style, and permissions; publish the output back into business systems; and keep the process secure enough for enterprise procurement. The public product suite supporting that loop is now clearly segmented into Translator, Write Pro, Voice, and API. Translator is no longer framed only as a text box; it includes Translation Flow for managing translation jobs and Customization Hub for applying glossaries, style guides, style profiles, and translation memory. Write Pro handles the adjacent job of improving business writing before or after translation, while Voice extends the same platform into meetings, face-to-face conversations, and contact-center or BPO workflows. Customer
    proof on the public hub shows those workflows are not hypothetical: DeepL cites a 24 million-character ERP localization deployment, a 100-plus-user internal language infrastructure rollout, and a 50% reduction in meeting times from Voice-assisted collaboration.'
