- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - User experiences (web, Word, Teams, mobile)
    - Human-facing access points for translation, writing, and voice workflows
    - Microsoft ecosystem, browser/mobile distribution
    - Partner/app-platform changes can affect distribution and feature parity
  - - Workflow-control layer (Translation Flow, glossaries, style rules, translation memory)
    - Enforces brand, terminology, and project controls above raw model output
    - DeepL application layer and account-state storage
    - Adoption may lag core MT usage; public performance and adoption metrics are thin
  - - Text / Write APIs
    - Request-response language services for embedded translation and writing improvement
    - api.deepl.com / api-free.deepl.com, official SDKs, customer auth keys
    - Quota, size-limit, and auth changes can break customer integrations if not handled
  - - Voice streaming plane
    - Real-time speech transcription and translation over WebSocket
    - Session service, WebSocket clients, chunking, reconnect logic
    - More operational complexity than text APIs; timeout, bandwidth, and session limits are explicit
  - - Security and admin plane
    - SSO, MFA, BYOK, network restrictions, audit logs, usage insights
    - Identity providers and enterprise admin configuration
    - Misconfiguration risk shifts partly to the customer deployment team
  - - Model / quality layer
    - In-house LLMs and language models tuned for translation and voice quality
    - DeepL research organization and language-expert feedback loops
    - Quality claims are strong, but independent benchmark coverage for every new module is limited
  - - Hybrid infrastructure layer
    - Runs business/enterprise processing on AWS while retaining proprietary data centers for research/model training/free tier
    - AWS plus DeepL proprietary data centers in Iceland/Sweden
    - January 2026 global-processing default changes privacy/governance assumptions for some buyers
  - - External voice service partners
    - Provide some speech-to-text or translated-speech functions for specific voice cases
    - Speechmatics and ElevenLabs subprocessors
    - Language-specific third-party routing complicates privacy review and vendor management
