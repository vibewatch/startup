- id: funding-capital-and-coverage
  title: Funding history, investor base, and financial disclosure quality
  body: 'Public capital-formation evidence is strongest around the last two rounds. DeepL announced a $300 million financing in May 2024 at a $2 billion valuation, led by Index Ventures with participation from new and returning investors including ICONIQ Growth, Teachers’ Venture Growth, IVP, Atomico, and WiL. Third-party databases also record a January 2023 round of just over $100 million led by IVP that pushed the company to unicorn status. Company pages in 2026 name Benchmark, IVP, and Index Ventures as signature backers, while Tracxn reports cumulative funding of roughly $415 million across five rounds. The core conclusion is that DeepL has attracted elite global venture support while staying private and largely unaudited. That strength comes with a disclosure trade-off: public sources do not show a full cap table, secondary activity, liquidation preferences, debt facilities, or shareholder control terms. Third-party revenue services suggest a sharp rise from roughly $50 million annual
    run rate in late 2022 to approximately $185 million of revenue in 2024, but these figures are not company-filed or audited. At overview level, the correct treatment is to note strong financing support and improving scale while reserving deeper underwriting judgment for the financials chapter.'
