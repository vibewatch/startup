callouts:
- calloutType: strength
  title: Enterprise traction is now large enough to be independently credible
  body: DeepL no longer looks like a niche European translator. Official 2026 pages show 200,000+ business customers and 1 million paid licenses, while multiple external sources corroborate material customer breadth and a growing enterprise GTM push.
  claimRefs:
  - CO008
  - CO009
  - CO023
  - CO031
- calloutType: insight
  title: Keep 2008/2009 Linguee roots separate from the 2017 DeepL launch
  body: Public chronologies diverge because some sources refer to predecessor legal entities and Linguee-era work, while official DeepL pages anchor the current company narrative in 2017. Treat the discrepancy as a naming and legal-history issue, not as evidence of fabrication.
  claimRefs:
  - CO001
  - CO003
  - CO004
- calloutType: risk
  title: Governance and disclosure opacity remain material
  body: The public record is strong on customers, products, and fundraising but weak on full board composition, detailed cap-table mechanics, exact headcount, and audited revenue. Those gaps matter because they affect both control assessment and valuation confidence.
  claimRefs:
  - CO015
  - CO024
  - CO025
  - CO046
- calloutType: risk
  title: Privacy and legal-use positioning is a double-edged sword
  body: DeepL’s European privacy narrative is a commercial advantage, but it also raises the diligence bar. Public adverse sources show that regulators and privacy-focused reviewers will scrutinize whether the free tier, legal-document workflows, and cross-border compliance posture truly match the marketing story.
  claimRefs:
  - CO040
  - CO041
  - CO042
  - CO044
- calloutType: recommendation
  title: Use overview data as directional truth, not final underwriting evidence
  body: This chapter establishes core identity, investor pedigree, customer scale, and milestone chronology. Before making an investment decision, the next diligence layer should obtain audited financials, a current board/cap-table view, and a management explanation for employee-count and revenue-reporting discrepancies.
  claimRefs:
  - CO024
  - CO025
  - CO045
  - CO046
