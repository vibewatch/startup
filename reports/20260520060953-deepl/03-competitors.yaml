- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target customer
  - Product scope / strategy
  - Pricing signal / limitation
  rows:
  - - DeepL
    - Direct peer / company
    - 1M paid licenses and 200,000+ business customers already disclosed elsewhere in this run; self-serve business ladder is public
    - Professionals, teams, enterprise localization, legal, support, operations
    - Secure translator, document translation, Write, Voice, API, integrations, enterprise security
    - Individual €7.49/mo, Team €24.99/user/mo, Business €49.99, Enterprise custom
  - - Google Cloud Translation
    - Hyperscaler incumbent
    - Google Cloud distribution; 189 languages; pre-trained, custom, and Adaptive Translation models
    - Developers, product teams, cloud-native enterprises
    - MT API plus custom models, document translation, Translation Hub, broader Google Cloud stack
    - 500k chars free, then $20 per million NMT characters; docs/page and custom-model pricing public
  - - Azure AI Translator
    - Hyperscaler incumbent
    - Microsoft/Azure enterprise channel; 135+ languages and Foundry integration
    - Microsoft-native enterprises, developers, regulated buyers
    - Text and document translation, custom translation, agentic workflow integration, strong privacy messaging
    - 2M chars/month free; commitment tiers and custom translation shown, but current S1 list price not rendered in captured page
  - - Amazon Translate
    - Hyperscaler incumbent
    - AWS distribution; 75 languages; batch, real-time, and active custom translation
    - AWS-native developers, support workflows, automation-heavy teams
    - Neural MT, batch and real-time document translation, Active Custom Translation, terminology
    - Pay-as-you-go with 12-month free tier; reviewed page does not expose detailed per-character tiers inline
  - - Smartling
    - Enterprise TMS incumbent
    - Established enterprise workflow vendor with public plans focused on workflow depth rather than list pricing
    - Central localization teams, enterprise marketing/content ops
    - Dynamic workflows, third-party vendor management, SSO, LQA agent, reporting
    - Public plans grid but no transparent self-serve list price in reviewed materials
  - - Phrase
    - Workflow platform / TMS
    - Enterprise platform with 50+ integrations and vendor-neutral routing story
    - Cross-functional enterprise localization, product, marketing, support
    - TMS + Strings + AI + Orchestrator + Analytics + multimedia localization
    - Capacity-based pricing, unlimited TMS seats, add-ons for processed words/MTUs/AIUs; professional translation from $0.06/word
  - - Lokalise
    - Developer-first localization platform
    - 1M users across 3,000+ companies; strong product/developer positioning
    - Product teams, engineers, marketers needing continuous localization
    - AI localization platform with 60+ integrations, 95 APIs, 33 webhooks, AI orchestration
    - 14-day trial and free tier path; enterprise pricing still effectively demo/plan-based
  - - Crowdin
    - Developer-first localization platform
    - 700+ integrations and “thousands of teams”; workflow and CI/CD emphasis
    - Developers, product teams, smaller and mid-market localization teams
    - AI-powered localization, TM, glossaries, MT connectors, CI/CD sync, enterprise security
    - Hosted-word and add-on model; some items public (e.g. CDN free to 1M requests/10GB), full enterprise spend depends on configuration
  - - Lilt
    - Service-led / human-loop platform
    - Targets global enterprises, government, defense, and regulated sectors
    - High-consequence deployments needing workflow control plus human verification
    - Contextual AI platform, model library, model builder, connectors, managed deployment, human experts
    - Business / Enterprise / Government packaging with custom invoicing rather than public list prices
  - - Unbabel
    - Service-led / LangOps platform
    - LangOps positioning, quality estimation, ISO 27001 and anonymization controls
    - Customer service, multilingual content ops, enterprises optimizing cost/quality/speed
    - Dynamic human-plus-AI workflows, quality estimation, integrations, security-heavy processing
    - Pricing not publicly recoverable from reviewed official pages; sales-led packaging
  - - Human LSP / status quo
    - Substitute / incumbent process
    - Existing vendor relationships and domain experts remain entrenched
    - Legal, regulated, brand-sensitive, audit-heavy buyers
    - Human translation or MTPE inside governed workflows
    - Typically project- or word-based and slower, but strongest for accountability and sensitive review
  - - Internal build / open-source stack
    - Substitute / likely entrant path
    - Cloud APIs plus open-source NLLB and LLM APIs make build-your-own credible for advanced teams
    - Large product teams, sovereign or custom workflow buyers
    - Custom orchestration across APIs, open-source models, prompts, QA, and proprietary data
    - Capex/opex sits in engineering and governance, not a simple software subscription
  notes: Scale signals are limited to what reviewed public pages expose. When funding or realized ACV is undisclosed, the table preserves unknowns and uses distribution or adoption signals instead.
