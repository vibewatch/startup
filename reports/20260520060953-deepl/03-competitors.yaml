    - Developer-friendly but not directly comparable to pure API pricing
  - - Lilt
    - Custom invoicing across Business / Enterprise / Government
    - Sales-led enterprise contract
    - Human expert verification, API access, managed deployment, regulated options
    - Actual seat, volume, and services pricing
    - Competes where quality/compliance can justify a non-transparent commercial model
  - - Unbabel
    - Official pricing page not publicly recoverable in reviewed materials
    - Sales-led enterprise contract
    - LangOps workflows, quality estimation, integrations, security and anonymization
    - Minimum contract values and AI-vs-human blend pricing
    - Likely evaluated as an operations platform, not a self-serve translation tool
