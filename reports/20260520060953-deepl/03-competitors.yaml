- id: workflow-owners-human-loop-and-switching-costs
  title: Workflow owners, human-loop vendors, and where switching costs actually live
  body: 'The biggest structural challenge to DeepL is that modern buyers increasingly optimize for workflow control rather than a single translation engine. Phrase openly positions the category around AI governance, data ownership, integration breadth, and the ability to govern product, marketing, support, and multimedia localization from one platform. It also says customers can route Amazon, DeepL, Google, and Microsoft engines through the same stack. Crowdin makes a similar point from a developer-first angle: 700-plus integrations, translation memory, glossaries, CI/CD sync, and machine-translation connectors to DeepL, Google, Azure, Amazon, OpenAI, and Anthropic all weaken engine lock-in. Smartling’s public plans page likewise foregrounds dynamic workflows, vendor/LSP management, SSO, LQA monitoring, and reporting rather than a raw MT claim.


    That shifts switching costs upward into translation memory, glossaries, workflow templates, user permissions, procurement habits, and analytics rather than the engine layer itself. Lokalise emphasizes 1 million users across 3,000-plus companies, extensive APIs/webhooks/SDKs, and an AI orchestration layer that routes among multiple models. Lilt and Unbabel move one step further by selling managed deployment, human expert verification, air-gapped or regulated options, and quality estimation. Those vendors are not always the cheapest or most transparent on pricing, but they can win when the buyer’s real problem is risk management, model governance, or multilingual operations—not whether one engine scores a little better on raw text quality.'
