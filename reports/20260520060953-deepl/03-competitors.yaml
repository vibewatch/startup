- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Why threat is real
  - Severity
  - Mitigation / diligence ask
  rows:
  - - DeepL quality lead for business translation
    - Cloud APIs improve quickly and set public price floors
    - Google markets Adaptive Translation and 189 languages; Azure and AWS add customization and enterprise distribution
    - High
    - Request current blind benchmarks by content class and renewal data where DeepL displaced cloud APIs
  - - Privacy-forward enterprise messaging
    - Other incumbents now publish strong privacy/no-train/no-persist commitments too
    - Google says it does not use translation content for training; Azure says text is not persisted and documents are hard-deleted
    - Medium-High
    - Pressure-test regulated buyer win rates and whether BYOK meaningfully changes procurement outcomes
  - - Simple self-serve packaging
    - Workflow platforms can reduce DeepL to one engine in a routed stack
    - Phrase, Crowdin, and Smartling all foreground orchestration, vendor management, and engine choice
    - High
    - Ask how much ARR sits in standalone seats/API versus embedded platform partnerships and routed workflows
  - - Translation quality as differentiation
    - Human review still caps automation in regulated or legal content
    - Azure warns legal documents are unsupported; RWS recommends human or post-edited paths for high-risk workflows
    - High
    - Validate which verticals publish without human review and where DeepL still requires partner or customer review layers
  - - Engine lock-in through glossaries and habits
    - Multi-homing is already normal in modern localization systems
    - Phrase and Crowdin openly connect DeepL, Google, Microsoft, Amazon, OpenAI, and Anthropic
    - High
    - Measure logo churn and engine share inside multi-engine accounts, not just gross customer count
  - - Scarcity of translation capability
    - Open-source and LLM entrants expand the feasible substitute set
    - Meta NLLB shows broad open-source coverage, while Nordic APIs says OpenAI and Anthropic are translation-capable entrants to watch
    - Medium-High
    - Track customer experiments with internal build, OSS, and general-purpose LLMs before they become formal churn events
  notes: This register focuses on durability of advantage rather than absolute product quality. The key question is whether DeepL can move from best engine perception to control of the surrounding workflow and trust layer.
