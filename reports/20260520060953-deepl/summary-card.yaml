  topStrengths:
    - >-
      Public evidence supports real enterprise traction: 200,000+ businesses and governments, 1 million paid licenses,
      and named production deployments across legal, industrial, hospitality, and API-led channels.
    - >-
      DeepL has evolved beyond a point translator into a broader Language AI platform with Write, Voice, APIs, workflow
      controls, and enterprise security/compliance features.
    - >-
      Elite late-stage investor backing and the May 2024 $300M round reduce near-term capital pressure and support
      continued product and go-to-market build-out.
  topRisks:
    - >-
      The current $2 billion mark still relies on unaudited revenue estimates and undisclosed 2024 round terms, so
      common-equity underwriting at the last price remains weak.
    - >-
      Core financial metrics remain private: audited revenue, gross margin, NRR/GRR, burn, runway, customer
      concentration, and product-mix economics are not publicly disclosed.
    - >-
      Trust and compliance risk is live because DeepL now defaults many business workloads to global AWS-region
      processing while the public record already includes a 2024 PIPC privacy ruling and ongoing AI Act obligations.
    - >-
      Execution risk is rising as DeepL scales voice, partner integrations, and hybrid infrastructure at the same time
      that public outage and feature-maturity signals remain mixed.
  unresolvedGaps:
    - Audited FY2024-FY2026 revenue / ARR bridge, gross margin, and cash-burn / runway disclosure.
    - NRR, GRR, ACV bands, renewal behavior, and top-customer / API concentration.
    - >-
      Full 2024 financing terms, including liquidation preferences, participation rights, and any
      primary-versus-secondary split.
    - Current board roster, investor governance rights, and a reliable current headcount reconciliation.
