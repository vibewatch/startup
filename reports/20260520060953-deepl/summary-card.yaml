summary:
  headline: >
    DeepL is a real, scaled Language AI platform with premium enterprise positioning, but the last $2 billion private
    mark still looks stretched until audited revenue, margin, retention, and term- sheet evidence closes the remaining
    underwriting gaps.
  overallScore: 6.7
