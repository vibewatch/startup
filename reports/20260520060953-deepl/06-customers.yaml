  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention disclosure gap
    missingEvidence: NRR, GRR, logo-retention, and renewal-cohort data by direct enterprise and API/partner channel.
    whyItMatters: Continuity anecdotes are positive but do not show whether the installed base is economically durable.
    diligencePath: Request cohort tables for the last three years, including direct contracts, API accounts, churn reasons, and renewal timing.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration disclosure gap
    missingEvidence: Top-customer revenue share, top API-volume customer share, and contract-expiry schedule for the largest accounts.
    whyItMatters: A 200,000-customer headline could still mask meaningful economic concentration in a small number of large enterprise or API accounts.
    diligencePath: Request top-10 and top-20 customer concentration by ARR, API volume, and gross margin, plus known at-risk renewals.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: customer-base mix
    missingEvidence: A segment split of the 200,000+ customer base by enterprise size, SMB, government, direct seat, and API/partner channel.
    whyItMatters: Without that split, the headline customer count cannot be translated into enterprise density, ACV quality, or channel mix.
    diligencePath: Request a current customer-base cube by plan tier, geography, vertical, and channel, with ARR and active-usage overlays.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU001
    - TU002
  - type: missing-source
    severity: material
    topic: marquee logo verification
    missingEvidence: Public deployment detail or reference calls for marquee logo accounts such as Zendesk, Coursera, Klarna, and Nikkei.
    whyItMatters: Those names support brand credibility but currently function as logo references rather than verified production proof.
    diligencePath: Request customer references, redacted implementation snapshots, or dated deployment statements for the most commercially important logo accounts.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU003
    - TU005
  - type: access-blocked
    severity: minor
    topic: independent review coverage
    missingEvidence: Accessible review exports or screenshots from G2, Capterra, and Trustpilot to triangulate public satisfaction and complaint themes.
    whyItMatters: Current independent review coverage is directionally useful but thinner than ideal because multiple platforms were blocked or rate-limited during collection.
    diligencePath: Re-run review collection with authenticated access or request vendor-provided exports with raw dates, ratings, and negative themes.
    relatedQuestionRefs:
    - QU019
    - QU020
    relatedTableRefs:
    - TU004
