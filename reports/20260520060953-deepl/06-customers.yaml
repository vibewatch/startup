- id: named-proof
  title: Named deployments and adoption trajectory
  body: 'DeepL does have real named production proof. Deutsche Bahn has used DeepL for internal communication since January 2022, maintains nearly 30,000 glossary entries in up to 16 languages, and makes the browser-extension workflow available to employees across the group. Nagashima Ohno & Tsunematsu rolled DeepL Enterprise across a law firm of more than 1,000 employees, including roughly 600 lawyers, and says work that once took a full day now takes minutes. Haufe X360 built an automated localization workflow around the DeepL API and glossaries for more than 60,000 UI strings and 24 million characters of documentation. Kanadevia ran a 100-user proof of concept in 2024, moved to a full contract about two months later, and now uses Pro, Write, and Voice across contracts, R&D, IT, and meetings. Aramark and Avendra International report that meeting times fell from 90 minutes or more to 60 minutes or less after adopting DeepL Voice in Teams. Weglot is especially important because it shows
    an embedded/API channel: it has used the DeepL API since 2018, handles billions of characters per month, and now makes around 16 million API calls to DeepL each month. Together, these cases support a real adoption trajectory from direct seat sales into voice and API-led expansion.'
