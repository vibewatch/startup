- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: sample
    basis: Sample of the strongest publicly named DeepL deployments and partner-embedded uses found in current official stories plus independent customer-listing sources; not an exhaustive roster of the 200,000+ stated customer base.
  columns:
  - Customer
  - Segment
  - Deployment / Use Case
  - Production vs. Pilot
  - Documented Outcome
  - Limitation / Caveat
  rows:
  - - Deutsche Bahn
    - Rail and infrastructure enterprise
    - Glossary-controlled internal text and document translation plus browser-extension access across departments
    - Production (since January 2022)
    - Nearly 30,000 glossary entries in up to 16 languages; available to employees as a browser extension; ongoing investment across DB Group
    - Strong named proof but no public ROI, seat count, or renewal data
  - - Nagashima Ohno & Tsunematsu
    - Large legal-services firm
    - Enterprise translation and writing workflows for contracts, emails, analysis, and internal communication
    - Production (firm-wide rollout)
    - More than 1,000 employees including ~600 lawyers; some work cut from a full day to minutes; urgent IT translations cut from 10 hours to half the time
    - Official vendor story; no contract value or independent audit
  - - Haufe X360
    - ERP / software localization business
    - DeepL API plus glossaries in an automated localization workflow for UI strings and DITA documentation
    - Production
    - 60,000+ UI strings and 24 million characters (~4 million words) localized; manual linguistic review largely unnecessary; new language packs launched with minimal effort
    - No public spend, contract term, or exact DeepL usage cost
  - - Kanadevia
    - Industrial and environmental infrastructure company
    - DeepL Pro, Write, Voice for Meetings, and Voice for Conversations across contracts, R&D, IT, and global collaboration
    - Pilot in 2024, then production
    - 100-user PoC in 2024 converted to a full contract about two months later; company now uses multiple DeepL modules in live workflows
    - No public enterprise seat total, spend, or renewal date
  - - Aramark and Avendra International
    - Global hospitality and procurement operations
    - DeepL Voice inside Microsoft Teams for multilingual meetings
    - Production
    - Meetings that once ran 90+ minutes now finish in 60 minutes or less, reclaiming roughly 50% of collaboration time
    - Single official case study; no public detail on user count or contract scope
  - - Weglot
    - Localization SaaS / API partner and customer
    - DeepL API embedded inside multilingual website-localization product
    - Production (since 2018)
    - 16 million API calls per month; billions of translated characters monthly; 55,000+ downstream customers; cited downstream wins include 120% traffic and 44% conversion lifts
    - Indirect channel proof rather than a direct end-enterprise logo for DeepL; no public revenue share or churn data
  - - Panasonic Connect
    - B2B electronics and industrial-solutions company
    - DeepL Pro and DeepL Write for global R&D communication and writing improvement
    - Production
    - Named user says Write generated 5-6x more editing suggestions than a paid service and improved cross-border communication speed
    - Outcome proof is strong on workflow value but light on seat count and financial ROI
  notes: This table intentionally separates real named production or pilot-to-production proof from broader logo-level customer references. Rows are included only when the public record contains deployment detail, user quotes, or measurable workflow outcomes.
