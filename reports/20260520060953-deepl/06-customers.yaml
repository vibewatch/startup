- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion Driver
  - Concentration Risk
  - Impact
  - Diligence Path
  rows:
  - - Department-to-enterprise rollout (NO&T, Kanadevia)
    - Unknown conversion rate from individual/team use to company standard
    - Positive if repeatable because seat pools can widen quickly
    - Request funnel data from self-serve or pilot use into enterprise contracts, including conversion and ACV by cohort
  - - Cross-sell from core translation into Write and Voice
    - Attach rates and active-user overlap are undisclosed
    - Positive for ARPU and stickiness; negative if newer modules are mostly demos or pilots
    - Request module penetration, active use by surface, and upsell rates within existing accounts
  - - API / embedded channel scale via Weglot, Haufe, and gaming workflows
    - A few API-heavy accounts or partners could concentrate revenue and usage
    - Usage-based growth could be powerful but economically concentrated
    - Request top API customers and partners by revenue, character volume, margin, and renewal date
  - - Marquee-logo concentration
    - Top-customer revenue share and contract expiry profile are undisclosed
    - Loss of one or two large enterprise accounts could matter materially even with a 200k+ headline base
    - Request top-10 customers as % of ARR, plus expiration schedule and dependency on a handful of Fortune 500 accounts
  - - Logo-to-production evidence gap
    - Named logos such as Zendesk, Coursera, Klarna, and Nikkei appear in profiles but lack public deployment detail
    - Brand halo may overstate the amount of independently verified production proof
    - Request reference calls, redacted SOWs, or deployment snapshots for the most commercially important logo accounts
  notes: Expansion drivers are observable from public case studies; concentration risk is largely unobservable from public data and therefore framed as a diligence path rather than a quantified conclusion.
