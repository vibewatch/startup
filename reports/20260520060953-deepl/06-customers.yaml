- id: risks-gaps
  title: Evidence quality limits and customer risks
  body: The biggest customer-side risk is asymmetry between broad adoption claims and high-quality proof. DeepL can credibly point to a very large customer network and several real, named production deployments, but only a handful of those deployments disclose hard outcomes, and almost none disclose contract value or renewal behavior. That matters because independent profiles and funding-related articles repeat logo-level names such as Zendesk, Coursera, Klarna, and Nikkei; however, the public material reviewed here does not prove the depth, recency, or production status of those marquee relationships. A second risk is that independent satisfaction evidence is mixed. Gartner includes both a favorable 4.0/5 review and a critical 3.0/5 review mentioning occasional freezing and a narrowing competitive edge. TrustRadius reviewers praise document fidelity and time savings versus interpreters but complain about license flexibility and the need to check technical terminology. SourceForge adds a
    lower-confidence complaint about price and setup friction. None of that negates the strong named case studies, but it does mean public customer delight is not uniformly strong and should be tested directly in reference calls.
  claimRefs:
  - CU036
  - CU039
