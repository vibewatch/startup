  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing surfaces, and recognition mechanics
        blocks:
          - type: paragraph
            body: >
              DeepL monetizes a single Language AI platform through several packaging layers rather than a single SKU.
              Public company pages and terms show recurring seat-based subscriptions for DeepL Pro and enterprise
              deployments, add-on expansion through products such as Write Pro, and a developer/API stack that mixes
              fixed recurring charges with usage-based billing for translated characters and audio minutes. The public
              evidence is strongest on billing mechanics, not realized price points: DeepL's support pages clearly state
              that standard seat subscriptions can be billed monthly or annually, that annual plans are paid up front
              after trial while monthly plans are charged at the beginning of each period, and that API plans have
              distinct metered billing rules. API Growth is the clearest current public pricing construct, with monthly
              or yearly commitments that include usage quotas and invoice overages by actual successful consumption;
              enterprise API projects move to custom commitments through the sales team. Revenue-recognition and
              cash-timing nuance matters here. Annual seat plans likely create deferred revenue and favorable
              working-capital dynamics, while API usage is recognized as service is delivered and may be billed partly
              in arrears or periodically in advance. DeepL's terms also imply that implementation, consulting, or
              training are not default published SKUs because such services require a separate written agreement, so the
              public base case is a software-heavy revenue mix rather than a services-led one. What remains unknown is
              the actual split among seat subscriptions, API consumption, voice, add-ons, enterprise bundles, and any
              services revenue embedded in negotiated contracts.
