      - number: '2.2'
        title: 'Sizing lenses: from machine translation software to full language services'
        blocks:
          - type: paragraph
            body: >-
              The public sizing evidence is directionally bullish but numerically inconsistent because each publisher
              uses a different denominator. The narrowest lens is the machine-translation market, where Coherent
              projects roughly $710 million in 2026. A broader software-and-services lens, AI in language translation,
              lands at about $3.68 billion in 2026 according to The Business Research Company. Translation-services
              publishers then jump to far larger numbers: Research and Markets points to roughly $28.86 billion, Mordor
              to $64.99 billion, and Coherent to $86.08 billion for broader language or translation services in 2026.
              DeepL’s own 2024 fundraising materials cite a $67.9 billion language-industry lens growing to $95.3
              billion by 2028, which aligns directionally with the broader-service estimates. None of these estimates is
              inherently wrong; they just bundle different layers of software, services, and use cases. For valuation
              work, the safe move is to preserve the full range and show why DeepL’s practical monetization path likely
              starts with the AI-translation layer, expands into enterprise workflow spend, and only partially overlaps
              with the full language-services economy. Public data is not good enough to claim a precise SAM or SOM
              without making modeling assumptions.
