  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              DeepL now describes its offer less as a single translator and more as a Language AI platform for business
              communication. In workflow terms, the core customer job is to move multilingual work through an operating
              loop: ingest text, files, or speech; apply language conversion or writing improvement; enforce
              terminology, style, and permissions; publish the output back into business systems; and keep the process
              secure enough for enterprise procurement. The public product suite supporting that loop is now clearly
              segmented into Translator, Write Pro, Voice, and API. Translator is no longer framed only as a text box;
              it includes Translation Flow for managing translation jobs and Customization Hub for applying glossaries,
              style guides, style profiles, and translation memory. Write Pro handles the adjacent job of improving
              business writing before or after translation, while Voice extends the same platform into meetings,
              face-to-face conversations, and contact-center or BPO workflows. Customer proof on the public hub shows
              those workflows are not hypothetical: DeepL cites a 24 million-character ERP localization deployment, a
              100-plus-user internal language infrastructure rollout, and a 50% reduction in meeting times from
              Voice-assisted collaboration.
