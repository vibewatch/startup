  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      DeepL's recommendation stays cautious because strong scale and product proof still meet a valuation that depends
      on missing private facts.
    data:
      nodes:
        - label: 'Demand proof: multilingual workflow pain is still real in 2026'
        - label: 'Product / customer proof: 200k+ businesses, 1M paid licenses, write + voice + API'
        - label: 'Price anchor: May 2024 financing at $2B'
        - label: 'Public-comp gravity: Duolingo, RWS, and Appen all trade lower on disclosed revenue'
        - label: 'Disclosure gap: audited revenue, margins, retention, and round terms remain private'
        - label: 'Recommendation: research-more; require cleaner proof or a lower entry price'
    approximationNotes: null
    claimRefs:
