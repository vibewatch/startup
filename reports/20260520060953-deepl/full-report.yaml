      product, docs, and trust materials.
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: Representative enterprise workflow from source content to controlled multilingual output.
    data:
      nodes:
        - id: source-work
          label: Source work arrives
          detail: Text, document, or speech enters from Office, meetings, CRM, support, or product systems.
          type: input
        - id: entry-surface
          label: Choose entry surface
          detail: User selects Translator, Write, Voice, or API/connector depending on workflow.
          type: process
        - id: control-layer
          label: Apply workflow controls
          detail: Translation Flow, glossaries, style rules, or translation memory enforce terminology and review logic.
          type: process
        - id: model-execution
          label: Run language model
          detail: DeepL text/write models or voice streaming services generate output.
          type: process
        - id: security-admin
          label: Enforce trust controls
          detail: Identity, BYOK, network restrictions, audit logs, and account policies govern access.
          type: process
        - id: publish-back
          label: Publish back to system
          detail: Output returns to documents, meetings, apps, CRM, or automation flows.
          type: output
        - id: measure-usage
          label: Monitor and iterate
          detail: Teams review usage, limits, logs, and customer outcomes to refine the workflow.
          type: output
    claimRefs:
