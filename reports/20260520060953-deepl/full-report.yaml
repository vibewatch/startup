      - number: '5.5'
        title: Roadmap, maturity, and differentiation verdict
        blocks:
          - type: paragraph
            body: >-
              The changelog makes it unusually easy to see product velocity. In late 2025 DeepL shipped the initial
              Voice API release and new usage/reporting improvements; in 2026 it added per-key voice limits, expanded
              Write-language and Style Rules support, launched translation memories in GA, and moved Voice API to
              general availability for paid API customers. The same public roadmap still leaves some edges immature:
              translated speech in the Voice API is closed beta, the consumer-facing positioning of Voice for
              Conversations is earlier than core text translation, and the changelog's 'in active development' list
              still includes translation-memory CRUD, API key-level endpoint restrictions, and richer usage reporting.
