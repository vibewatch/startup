            body: >-
              DeepL does have real named production proof. Deutsche Bahn has used DeepL for internal communication since
              January 2022, maintains nearly 30,000 glossary entries in up to 16 languages, and makes the
              browser-extension workflow available to employees across the group. Nagashima Ohno & Tsunematsu rolled
              DeepL Enterprise across a law firm of more than 1,000 employees, including roughly 600 lawyers, and says
              work that once took a full day now takes minutes. Haufe X360 built an automated localization workflow
