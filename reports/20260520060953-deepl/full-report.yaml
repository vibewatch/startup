  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      The biggest valuation levers are audited revenue proof, software-like economics, clean common-equity terms, and
      downside compression toward public comparables.
    data:
      items:
        - label: Audited revenue >$230M and >30% growth
          value: 0.3
        - label: Gross margin >75% and NRR >115%
          value: 0.2
        - label: Clean cap table with limited overhang
          value: 0.1
        - label: Re-rating toward disclosed public comps
          value: -0.5
        - label: Compliance / concentration / trust shock
          value: -0.6
    approximationNotes: >-
      Values are directional change-in-valuation scores in USD billions relative to the $2B anchor, derived from the
      scenario framework rather than management guidance.
