      - number: '4.4'
        title: Capital adequacy, financing dependency, and verdict
        blocks:
          - type: paragraph
            body: >
              DeepL's forward capital position looks solid on the evidence that is public, but still cannot be fully
              underwritten. The strongest hard fact is the May 2024 financing: $300 million at a $2 billion valuation,
              accompanied by explicit statements that the money would fund research, product innovation, global market
              expansion, and hiring across AI research, engineering, product, and GTM. That round meaningfully reduced
              immediate financing dependency, especially for a company whose public business model is already recurring
              and software-led. But the open market still lacks the numbers that would determine whether the company is
              merely well funded or actually near self-sustaining: no public source reviewed here disclosed cash on hand
              after the round, monthly or annual burn, committed cloud spend, debt facilities, lease burden, or runway.
              Registry and LEI sources add legal context but not liquidity—they confirm DeepL SE's Cologne registration
              and modest share-capital increases, not operating cash. GetLatka's unaudited revenue estimate of $185.2
              million for 2024, if directionally right, would imply a reasonable late-stage software multiple at the
              2024 valuation and would argue that DeepL is no longer purely venture-dependent for growth. Still, because
              product mix, margin, retention, and concentration are all opaque, the correct final verdict is cautious:
              revenue quality likely screens well, capital intensity looks moderate rather than extreme, and near-term
              capital adequacy appears good after the 2024 round—but a serious investor still needs audited revenue by
              SKU, gross margin with compute detail, retention metrics, cloud commitments, and a cash/runway bridge
              before calling the story finance-ready.
