        title: Scale, milestones, and market positioning
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction signals are enterprise breadth and product expansion. Official 2026 pages
              say DeepL now serves more than 200,000 business customers, has 1 million paid licenses, and operates
              across 228 global markets, while 2024 funding materials already showed 100,000+ organizations and rapid
              growth in the United States. Interviews and external profiles add useful color: Jarek says the business
              serves 50%+ of the Fortune 500; Forbes lists 1,000 employees as of September 2025; and Tracxn estimates
              headcount closer to 1,570 by January 2026. That spread is directionally positive but numerically
              inconsistent, so diligence should treat official headcount as a conservative floor and third-party
              estimates as unverified upside. Milestone coverage also shows DeepL broadening from pure text translation
              toward a wider enterprise language stack. Important recent events include the first U.S. office in January
              2024, the launch of DeepL Write Pro in April 2024, the May 2024 fundraising round, the November 2024
              launch of DeepL Voice, and the 2025–2026 expansion of agentic and customization features. Together these
              signals support a company that is still category-defined by translation, but increasingly commercialized
              as a broader enterprise communication platform.
