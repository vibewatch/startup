  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      DeepL adoption typically starts with a multilingual workflow pain point, moves through security and workflow
      validation, and then expands from a team use case into standardized document, API, or voice workflows.
    approximationNotes: >-
      Journey stages are synthesized from named customer stories rather than from one published DeepL funnel. They
      reflect recurring patterns seen across NO&T, Kanadevia, Deutsche Bahn, Weglot, Panasonic Connect, and Aramark.
    data:
      nodes:
        - id: pain
          label: Multilingual pain emerges
          detail: >-
            A legal, engineering, localization, or operations team hits a language bottleneck in documents, meetings, or
            cross-border collaboration.
        - id: informal
          label: Informal or team-level use
          detail: >-
            Employees often test DeepL individually or at small-team level before formal approval; NO&T and Kanadevia
            both describe this pattern.
        - id: security
          label: Security and procurement review
          detail: >-
            IT, legal, or compliance validates data protection, admin controls, and whether the product can be
            officially approved for business use.
        - id: deployment
          label: Workflow deployment
          detail: >-
            DeepL is deployed as browser extension, enterprise seat plan, DeepL Voice in Teams, or API integration
            inside a product or CMS workflow.
        - id: expansion
          label: Expansion to more modules or departments
          detail: >-
            Accounts add Write, Voice, glossaries, file translation, or API-based automation after the initial
            translation use case proves valuable.
        - id: durability
          label: Durability and reference loop
          detail: >-
            Daily use, glossary maintenance, high-volume API traffic, and internal standardization create renewal and
            reference potential, even though public cohort metrics are not disclosed.
    claimRefs:
