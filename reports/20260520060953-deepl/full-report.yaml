        title: Exit readiness exists at the product scale level, but not yet at the disclosure level
        blocks:
          - type: paragraph
            body: >-
              DeepL looks more like an eventual IPO or large secondary candidate than an immediate strategic-sale story.
              The company has enough scale, category visibility, and customer proof to support a 3- to 5-year exit
              window, but it does not yet look public-company ready from a disclosure standpoint. Filing-grade peers let
              investors read revenue, profitability, concentration, and balance-sheet detail directly; DeepL does not.
              The final diligence work is therefore basic but decisive: prove the current revenue and growth level, show
              gross margin and retention, explain customer concentration and compute intensity, and disclose the actual
              economic seniority of the 2024 round and any secondary or tender mechanics. Until those items are closed,
              the right IC framing is simple: monitor the thesis, do not pay today's price as though the missing facts
              have already been proven, and downgrade hard if the eventual disclosure shifts DeepL from software premium
              toward hybrid-service or AI-utility economics.
