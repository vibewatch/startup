  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and what DeepL is actually selling
        blocks:
          - type: paragraph
            body: >-
              The most important market-analysis task for DeepL is boundary setting. If DeepL is benchmarked against the
              entire language-services economy, the addressable market looks enormous—tens of billions of dollars
              spanning interpretation, human translation, localization, transcreation, subtitling, language testing, and
              compliance-heavy language access. If it is benchmarked against AI language translation software, the
              number collapses to a few billion dollars. If it is benchmarked against narrow machine-translation
              software, the number gets smaller still. Public sources support all three frames because they are
              measuring different things. DeepL’s own positioning and platform comparisons suggest it sits between these
              layers: it is more than a narrow MT API because it sells document translation, writing, voice, and
              enterprise trust features, but it is not the same thing as a full-service language provider that supplies
              interpreters, certified translators, or deeply service-led localization programs. Status-quo substitutes
              therefore matter as much as direct competitors. Buyers can still rely on bilingual staff, outsourced
              language service providers, bundled translation from broad software suites, or raw LLM interfaces. That is
              why the right market frame is neither “all language services” nor “pure MT only,” but a layered model with
              adjacencies explicitly preserved.
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM013
              - CM014
              - CM043
