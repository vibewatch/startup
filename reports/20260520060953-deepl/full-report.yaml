chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and business model
        blocks:
          - type: paragraph
            body: >-
              DeepL positions itself as a specialized Language AI company rather than a general-purpose AI vendor. The
              current official story says the company was founded in Cologne in 2017 by CEO Jarek Kutylowski and has
              grown from a single translation product into a unified platform that now combines text translation,
              document translation, writing assistance, voice translation, and developer APIs. The product stack matters
              because it shows how DeepL monetizes the same core language models across consumer, professional, and
              enterprise workflows. Official pages emphasize translation, Write, Voice, and API as the commercial
              pillars; reviews and interviews reinforce that the business is now oriented around enterprise-grade
              language workflows rather than only consumer translation convenience. The freemium layer still drives
              broad individual adoption, but the paid engine is enterprise and professional usage: business customers,
              paid licenses, API usage, and secure paid plans with stronger privacy guarantees. Public sources also show
              a chronology nuance that later diligence should preserve: the DeepL brand and product launched in 2017,
              but public databases and reference material connect the company to earlier Linguee legal roots and
              infrastructure. Treat 2017 as the clean commercial origin of DeepL, while explicitly noting predecessor
              history rather than collapsing both narratives into one unsupported founding date.
