  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation stays research-more because the current mark requires bull-case proof
        blocks:
          - type: paragraph
            body: >-
              The latest clean public price anchor is still DeepL's May 2024 financing: $300 million raised at a $2
              billion valuation. That mark is not absurd on company quality alone. DeepL now publicly claims more than
              200,000 business customers, 1 million paid licenses, more than 1,000 employees, and a platform that
              extends from translation into writing, voice, and API distribution. Those are real premium-quality
              signals. The problem is that price discovery is private while the revenue, margin, retention, and term-
              sheet facts required to underwrite the mark remain private too. The best current third-party revenue
              estimate is GetLatka's $185.2 million for 2024, which puts the last mark at about 10.8x revenue. Even
              allowing for growth since then, that is still a rich multiple versus disclosed public peers.
              Recommendation: research-more. Confidence: medium. Risk rating: high. Valuation stance: stretched.
              Decision implication: do not underwrite a fresh entry near $2 billion unless diligence proves the bull
              case or price moves down toward the mid-$1 billions.
