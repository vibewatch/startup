        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Founder dependence is high. DeepL remains closely identified with Jaroslaw “Jarek” Kutylowski, who is
              consistently described across official pages, press coverage, and interviews as founder and CEO.
              Company-controlled pages present a visibly expanded executive bench by early 2026, including dedicated
              leaders for people, revenue, technology, legal, marketing, operations, product, and finance. The January
              2026 appointments of Gavin Mee as COO and Detlef Krause as CRO are particularly important because they
              indicate the company is professionalizing its operating layer and go-to-market organization as enterprise
              adoption scales. Slator’s coverage also points to a 2025 sequence of CPO and CFO hires, which further
              suggests preparation for a more formal corporate structure. What remains missing is full governance
              transparency. Public materials enumerate executives but do not disclose the full board roster, board
              observers, control rights, or investor governance terms. That is normal for a late-stage private company,
              but it still matters for diligence because it limits visibility into succession planning, founder control,
              and the degree to which new investors or growth-stage backers influence strategy.
