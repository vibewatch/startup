        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >
              The public evidence points to a hybrid go-to-market motion: DeepL still benefits from a broad product-led
              funnel, but the monetization stack now clearly includes enterprise sales, onboarding, customer success,
              and partner-led distribution. Official enterprise pages advertise dedicated account coverage, technical
              support, SLAs, SSO, admin controls, and usage analytics, while the 2026 leadership announcement explicitly
              says the new COO and CRO were hired to scale enterprise adoption and evolve the GTM system. The partner
              channel is no longer a footnote. DeepL's own marketplace blog says the partner program onboarded 50
              partners in its first nine months, and the public partner directory shows dozens of listings across CRM,
              localization, public sector, IT, ecommerce, and content platforms. That matters financially because
              marketplace deployment typically rides on the customer's DeepL API key or negotiated package, which
              suggests distribution leverage without creating a separate low-quality resale business detached from the
              core platform. Public customer evidence also shows real production usage: one API case cites 24 million
              characters, another company rolled DeepL across 100+ users, and a voice deployment claims a 50% reduction
              in meeting time. Those are useful efficiency and expansion signals, but they are not substitutes for CAC
