              SDKs, and partner connectors are the delivery rails into customer systems. Microsoft surfaces are
              especially mature in public evidence: Word integration preserves formatting and adds writing improvement;
              Teams support is productized through DeepL Voice for Meetings; and the Power Platform connector exposes
