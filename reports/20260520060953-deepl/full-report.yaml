  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, substitute classes, and where DeepL really competes
        blocks:
          - type: paragraph
            body: >-
              DeepL is not only competing with other translation engines. The direct peer set is the hyperscaler API
              tier—Google Cloud Translation, Azure AI Translator, and Amazon Translate—because all three sell
              programmatic translation, customization, document handling, and enterprise procurement through established
              developer channels. But the more strategically dangerous rivals may be workflow owners such as Smartling,
              Phrase, Lokalise, and Crowdin, because they can sit above multiple engines and decide when DeepL is merely
              one vendor in a routed stack rather than the system of record. Service-led platforms like Lilt and Unbabel
              compete on another dimension again: they sell managed quality, human verification, and regulated
              deployment rather than cheapest raw API output.


              The substitute set is also real. RWS argues that enterprise AI translation in 2026 works as an
              orchestrated hybrid system with human review, routing rules, and governance, not as one tool dropped into
              every workflow. Nordic APIs similarly describes a broader “translation stack” made of engines,
              localization platforms, and adjacent infrastructure. That framing matters because it means DeepL must
              outperform not just other MT vendors, but also existing LSP relationships, internal build paths using
              cloud APIs or open-source models, and likely entrants from general-purpose LLM providers that are becoming
              translation-capable even if they still lag dedicated APIs on price, speed, and consistency.
