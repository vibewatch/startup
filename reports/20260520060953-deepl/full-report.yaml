      - number: '4.3'
        title: Cost structure, margin drivers, and working-capital signals
        blocks:
          - type: paragraph
            body: >
              DeepL's cost structure looks software-like, but not asset-light in the simplistic SaaS sense. Official
              pages describe proprietary supercomputing infrastructure, deployment of NVIDIA DGX SuperPOD GB200 systems,
              renewable-energy-powered supercomputer clusters, and processing on both DeepL-operated systems and
              third-party cloud infrastructure depending on customer location, capacity, and availability. That
              combination implies a business with limited traditional inventory or manufacturing capex, but meaningful
              compute capex and/or cloud opex exposure. Public billing rules reinforce the same point: document
              translation for binary file formats carries a 50,000 character minimum to cover processing cost, voice
              products are billed per source audio minute, and Enterprise API supports custom speech and character
              commitments for larger deployments. Those mechanics suggest that gross margin should be better than
              human-services localization businesses if text/API workloads dominate, but potentially lower than classic
              seat-only SaaS if voice and heavy document workloads scale faster than pricing. Working capital is
              directionally favorable on the seat side because annual subscriptions are prepaid and standard invoices
              are created at the start of the period; the API side is less favorable because usage is metered and some
              billing settles at period end. Payment-method rules imply a mostly card-led self-serve cash cycle, with
              bank transfer used primarily for annual business subscriptions or sales-managed large projects. Publicly,
              the blocker is not understanding the drivers; it is quantifying their actual weights.
            claimRefs:
