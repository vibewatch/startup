  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base, ICP, and segmentation
        blocks:
          - type: paragraph
            body: >-
              DeepL's public customer record shows breadth first and depth second. At the top of the funnel, current
              official surfaces say more than 200,000 businesses and governments use DeepL across 228 markets, and
              roughly half of the Fortune 500 trust the platform. But the more decision-useful evidence comes from named
              deployments. Those deployments suggest a recurring buyer pattern: central IT, localization, legal
              operations, R&D, or communications leaders buy or approve the product; employees, lawyers, engineers,
              frontline staff, or downstream website visitors use it; and the employer or platform vendor pays. The use
              cases are not all the same. Some customers need secure document translation and writing support, some need
              API-based localization inside products, and others need real-time voice collaboration in meetings. Public
              proof spans legal services, rail and infrastructure, industrial manufacturing, hospitality, gaming, life
              sciences, electronics, and localization software. Geography also looks broad, with strong named proof in
              Japan, Germany, the wider DACH region, France, and multinational deployments. What remains missing is a
              public split of the 200,000-customer headline by enterprise size, vertical, contract tier, or direct
              versus channel mix, so customer-count breadth should not be mistaken for enterprise revenue quality.
