      - number: '6.3'
        title: Durability, repeat usage, and expansion potential
        blocks:
          - type: paragraph
            body: >-
              The durability picture is directionally positive but financially incomplete. Public case studies show
              continuity signals: Deutsche Bahn remains active more than four years after launch, Weglot has stayed on
              DeepL since 2018, Kanadevia converted a 2024 pilot into a full contract quickly, and Haufe says its
              workflow expanded from one ERP localization project to broader Haufe Group use cases. Expansion also
              appears to happen across adjacent product surfaces. Kanadevia moved from translation into Write and Voice;
              Panasonic Connect uses both translation and writing improvement; Aramark uses Voice inside Microsoft
              Teams; and Weglot consumes DeepL through the API inside its own customer-facing platform. That is the good
              news. The bad news is that none of these public signals disclose net revenue retention, gross revenue
              retention, logo retention, renewal rates, cohort curves, or customer concentration. Independent review
              platforms add a little texture—some positive, some critical—but they are not a substitute for cohort
              economics. The correct diligence stance is therefore to treat public continuity and module expansion as
              encouraging, while keeping formal judgment on customer durability and concentration on hold until
