callouts:
- calloutType: insight
  title: DeepL’s TAM story is only meaningful if the boundary is explicit
  body: A $710 million MT market and an $86 billion language-services market can both be “true” at the same time. The difference is whether the model counts software only, AI software plus services, or the entire human-plus-software language economy.
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
- calloutType: strength
  title: Enterprise AI translation has crossed the adoption threshold
  body: Crowdin’s survey shows AI translation is already operational baseline for most teams, with TMS-centric deployment, governance frameworks, and cross-functional sign-off becoming the norm rather than the exception.
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM018
  - CM021
- calloutType: risk
  title: Governance and privacy determine monetization quality
  body: The fastest-growing use cases are also the ones most likely to trigger security, privacy, and legal objections. DeepL’s market opportunity scales only if buyers believe sensitive workflows can be routed, audited, and reviewed safely.
  claimRefs:
  - CM019
  - CM020
  - CM034
  - CM035
  - CM036
  - CM037
- calloutType: recommendation
  title: Model DeepL against constrained enterprise language-AI spend first
  body: For valuation work, start with the AI language translation and workflow-software layers, then test upside cases into broader language-services budgets only where human review, governance, and workflow ownership make the expansion realistic.
