evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board governance
    missingEvidence: A current board roster, observer list, and voting/control-right summary.
    whyItMatters: Governance visibility is necessary to assess founder control, investor influence, and succession risk.
    diligencePath: Request the latest board materials or cap-table/governance summary from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap table terms
    missingEvidence: Preference stack, secondaries, debt or credit facilities, and any special investor protections.
    whyItMatters: Valuation cannot be fully underwritten without understanding liquidation preferences and structured terms.
    diligencePath: Obtain the latest financing documents and cap table from counsel or management.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: audited revenue and ARR
    missingEvidence: Audited or company-filed revenue, ARR, profitability, and margin figures for 2024-2026.
    whyItMatters: Current overview-level revenue figures rely on third-party databases rather than audited company disclosure.
    diligencePath: Request audited financial statements or management-prepared KPI packs covering 2024-2026.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: employee count
    missingEvidence: A current management-confirmed full-time employee count and definition.
    whyItMatters: Official and third-party employee figures diverge materially, which affects scale and burn-rate interpretation.
    diligencePath: Ask management to reconcile official headcount, contractor mix, and geo split by function.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: recognition and maturity signals
    missingEvidence: >-
      A sourced list of current awards, compliance certifications, and buyer references beyond what is lightly
      summarized on public profiles.
    whyItMatters: >-
      Recognition signals are helpful for enterprise maturity, but public profiles do not substitute for customer
      diligence.
    diligencePath: Request current certification reports and reference customers in regulated verticals.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: deepL product-level SAM
    missingEvidence: Segmented market sizing for DeepL Translation, DeepL Write, DeepL Voice, and API spend as separate pools.
    whyItMatters: >-
      A single enterprise-language TAM obscures whether DeepL’s current product set can monetize the full opportunity or
      only a narrow subset.
    diligencePath: >-
      Build bottom-up product-level SAMs from customer counts, seat pricing, API usage, and voice adoption data from
      management.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer budget ownership
    missingEvidence: Public evidence showing which budget line most often pays for enterprise language AI by vertical.
    whyItMatters: >-
      Knowing whether DeepL lands in localization, IT, CX, legal, or procurement budgets changes sales-cycle length and
      expansion potential.
    diligencePath: >-
      Interview customers across support, legal, product, and localization teams and review procurement data if
      available.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market size denominators
    missingEvidence: >-
      Publisher methodologies that reconcile software-only, AI-plus-services, and full-service language-market
      definitions.
    whyItMatters: Top-down TAM narratives can look contradictory or inflated if denominators are mixed without explanation.
    diligencePath: >-
      Collect methodology appendices from each publisher and normalize included and excluded spend before valuation
      work.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: deepL monetized penetration
    missingEvidence: >-
      By-product revenue mix, enterprise seat counts, API volume, and voice revenue needed to estimate actual
      serviceable share.
    whyItMatters: Public revenue alone is insufficient to test how much of the market DeepL truly captures today.
    diligencePath: Request management KPI packs with revenue mix by product, region, and customer segment.
    relatedQuestionRefs:
      - QM025
  - type: stale
    severity: minor
    topic: enterprise adoption by vertical
    missingEvidence: Public vertical-level adoption rates for 2026-2027 rather than generalized cross-industry surveys.
    whyItMatters: Current buyer surveys are useful but still too generalized to prove where DeepL will land fastest next.
    diligencePath: >-
      Use customer interviews and vertical-specific analyst work to separate adoption in BFSI, legal, healthcare, SaaS,
      and public sector.
    relatedQuestionRefs:
      - QM008
      - QM025
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: azure-standard-price-opacity
    missingEvidence: >-
      A captured, current Azure S1 standard translation list price that renders the exact post-free-tier amount without
      requiring an interactive calculator session.
    whyItMatters: >-
      Without the exact marginal Azure price, the chapter can compare transparency and free-tier posture but cannot
      fully normalize DeepL against Azure on headline API cost.
    diligencePath: >-
      Obtain an authenticated Azure calculator export or sales quote for the relevant geography and SKU, then refresh
      TP003.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: private-platform-enterprise-pricing
    missingEvidence: >-
      Recent realized minimums, discount bands, and ACV structure for Smartling, Phrase, Lokalise, Lilt, and Unbabel
      enterprise contracts.
    whyItMatters: >-
      Pricing opacity makes it hard to know whether DeepL is really cheaper, more expensive, or simply priced against a
      different budget owner once workflow and services are bundled.
    diligencePath: >-
      Request current proposals, Vendr data, or customer procurement screenshots for at least three comparable
      enterprise deal sizes.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      DeepL replacement-win data, expansion/retention by channel, and evidence showing how much of customer spend sits
      in direct DeepL contracts versus routed platform usage.
    whyItMatters: >-
      The chapter can infer where switching costs live from public workflow claims, but moat durability ultimately
      depends on observed churn, NRR, and replacement patterns.
    diligencePath: >-
      Interview multilingual operations leaders, request internal churn analyses, and collect account-level examples
      where DeepL displaced or lost to clouds, TMS platforms, or service-led vendors.
    relatedQuestionRefs:
      - QP018
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: revenue-mix-split
    missingEvidence: Actual revenue split across seats, API usage, voice, add-ons, and any separately billed services.
    whyItMatters: >-
      Without product-level mix, investors cannot assess recurring quality, usage volatility, or whether the current
      monetization base is predominantly high-margin text/API or lower-margin compute-heavy workloads.
    diligencePath: >-
      Request monthly recurring revenue and recognized revenue by SKU, geography, and contract term for the last 24
      months, plus a management memo explaining revenue-recognition treatment for enterprise bundles and custom API
      commitments.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI001
      - TI002
      - TI005
  - type: missing-source
    severity: critical
    topic: gross-margin-and-compute-spend
    missingEvidence: Actual gross margin by product line, plus cloud, GPU, inference, and human-review cost detail.
    whyItMatters: >-
      DeepL’s margin path is the single hardest open-source underwriting blocker. Infrastructure, voice, and
      document-processing rules hint at real cost load, but there is no public number connecting those drivers to gross
      profit.
    diligencePath: >-
      Request product-level P&L, gross margin waterfalls, cloud-provider commitments, model-training capex/opex split,
      and cost-of-revenue detail for text, document, and voice workloads.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: critical
    topic: cash-burn-and-runway
    missingEvidence: Current cash balance, monthly burn, committed obligations, and management runway view after the 2024 financing.
    whyItMatters: >-
      The $300M round is meaningful, but it is not enough to conclude capital independence without seeing current
      liquidity, burn, cloud commitments, leases, and any planned hiring ramp.
    diligencePath: >-
      Request a monthly cash bridge from the closing of the 2024 round to the present, including debt, leases, committed
      cloud spend, board-approved budget, and scenario runway analysis.
    relatedQuestionRefs:
      - QI022
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: sales-efficiency-and-retention
    missingEvidence: CAC payback, sales productivity, NRR, GRR, and channel-sourced ARR are not publicly disclosed.
    whyItMatters: >-
      A maturing enterprise GTM engine can be value-creative or cost-destructive. Without retention and payback data,
      the public evidence cannot distinguish between healthy scaled growth and expensive top-line expansion.
    diligencePath: >-
      Request cohort NRR/GRR, CAC payback by segment, quota-carrying headcount, ramp productivity, channel-sourced
      pipeline, and win-rate trends for direct versus partner-assisted sales.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: customer-concentration-and-renewal-quality
    missingEvidence: >-
      Top-customer concentration, renewal schedule, contract duration, and API-usage concentration are absent from
      public sources.
    whyItMatters: >-
      Broad customer-count headlines can hide a small number of very large enterprise or API accounts. Revenue quality
      cannot be fully judged without understanding concentration and renewal dependence.
    diligencePath: >-
      Request top-20 customers, percent of revenue from the top 1%, 5%, and 10% of accounts, renewal schedules, and
