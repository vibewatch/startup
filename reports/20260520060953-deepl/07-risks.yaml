company:
  name: DeepL
chapter:
  number: 7
  title: Risks
  summary: 'DeepL''s 2026 risk stack is led by a privacy-and-regulatory issue, not a translation-quality issue: new contracts now default to global AWS-region processing for business content, while public legal and regulatory records already show scrutiny of training-data and reviewer disclosures. The next layer is dependency risk—Microsoft, AWS, Speechmatics, and ElevenLabs now sit inside customer-critical workflows or voice paths in ways that are only partially transparent. Reliability, valuation opacity, and execution load matter too: April 2026 outage evidence is real, the last disclosed $2 billion valuation still sat alongside non-profitability and limited public financial detail, and the company is scaling voice, integrations, and hybrid infrastructure at the same time.'
sections:
- id: regulatory-legal-risks
  title: Regulatory and legal risks
  body: DeepL's highest-severity risk is no longer simply whether its paid products are private enough for enterprise use; it is whether the company can keep its legal and regulatory story coherent while the product and infrastructure stack changes underneath it. The January 2026 Trust Center update moved new contracts and renewals to a hybrid AWS model, made global multi-region processing the default for business content, and pushed region pinning into a sales-assisted add-on. That is manageable for many customers, but it raises the stakes for GDPR transfer analysis, procurement scrutiny, and customer disclosure discipline. The legal record also shows that DeepL's risk is not hypothetical. Korea's PIPC investigated the company in 2024 over personal-information handling and found that users had not been clearly notified that entered data might be used for AI training or processed by human reviewers. DeepL appears to have remediated that issue, but the precedent matters because DeepL simultaneously
    markets healthcare-ready, C5-aligned, and enterprise-secure workflows. On top of privacy law, the EU AI Act now imposes GPAI documentation, copyright-policy, and training-summary obligations. The result is a risk profile where compliance burden, disclosure quality, and customer-by-customer contract configuration directly affect sales velocity and trust.
