- id: operational-quality-security-risks
  title: Operational, quality, and reliability risks
  body: 'Operationally, DeepL looks more mature than a consumer translation app, but less transparent than a mission-critical enterprise platform should be. The Help Center confirms that DeepL tracks operational, degraded-performance, partial-outage, and major-outage states across multiple services and keeps a visible incident history. Independent trackers then show why that matters: public monitoring captured a major outage on 27 April 2026, a partial outage on 29 April 2026, Japan deployment issues on 22 April 2026, and a multi-day usage-analytics issue in early April. None of those incidents alone breaks the thesis, but together they show that reliability risk is live during the same period DeepL is scaling Voice and migrating business workloads onto AWS. Review evidence also cuts against a pure quality-upside narrative. Some users still report slow performance, glossary issues, and product-purchase friction. Meanwhile, the contract itself warns that alpha or beta Test Functions may contain
    bugs, inaccuracies, and can be changed without notice or liability. That language matters because Voice and speech-to-translated-text are precisely the products where DeepL is still adding new vendors, new paths, and new deployment modes.'
  claimRefs:
  - CR015
  - CR026
  - CR027
  - CR028
