- id: partner-dependency-risks
  title: Partner and dependency risks
  body: 'DeepL now has a more layered dependency stack than its earlier “single translation engine” narrative implied. The company itself says business and enterprise content can be processed across AWS regions by default, while Voice for Meetings relies on Microsoft and AWS cloud services to host the meeting bot and forward audio. That architecture reduces some storage risk by keeping translation off Microsoft and AWS servers for the bot workflow, but it still creates platform dependence on external cloud and meeting ecosystems. Voice increases dependency concentration further. DeepL''s public service-spec updates add Speechmatics and ElevenLabs as subprocessors to the DPA for speech-to-translated-text v3, say specific languages are routed through them, and admit that the exact language list sits in Help Center material not surfaced in the main public record reviewed here. External partner disclosures widen the risk: ElevenLabs says all personal data is transferred to the US for storage,
    while Speechmatics maintains its own processor/subprocessor stack. Distribution and workflow dependence also matter. Microsoft labels the Power Platform connector as Preview with throttling limits, AppSource positions Voice squarely inside Teams, and DeepL itself markets Zoom and Teams integration as core channels. That means partner policy changes, throttling, outages, or subprocessor additions can hit customer experience and procurement simultaneously.'
