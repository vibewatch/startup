  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory legal risk register coverage
    missingEvidence: An exhaustive legal matrix covering all active privacy, AI, healthcare, sanctions, and sector-specific requirements by geography and SKU, plus current BAAs, DPA annexes, and certificate scopes.
    whyItMatters: The public record is strong enough to rank the top regulatory and legal risks but not to prove that every jurisdictional exposure or contractual addendum is covered.
    diligencePath: Request the current legal/compliance matrix, DPA annexes, BAA template, and latest certificate scope letters from DeepL counsel.
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: pricing and margin detail
    missingEvidence: Official current plan-by-plan pricing, discount policy, gross-margin bridge by product, and compute-cost mix for translation, write, and voice.
    whyItMatters: Without primary pricing and margin evidence, buyer-friction and margin-compression risk can only be inferred from secondary review sources and older financing coverage.
    diligencePath: Obtain current price book, enterprise discount waterfall, gross-margin history, and voice unit-economics model from finance leadership.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: uptime and support metrics
    missingEvidence: Official SLA sheet, status-history export, root-cause analyses for April 2026 incidents, and support staffing or coverage metrics for newer products.
    whyItMatters: Enterprise underwriting requires more than a public severity taxonomy and third-party outage trackers; repeated incidents without formal RCA visibility could affect regulated buyers and expansion.
    diligencePath: Request the current SLA, incident log, RCA summaries, and support-operations dashboard for Translator, Write, and Voice.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: voice subprocessor language mapping
    missingEvidence: A language-by-language routing table showing when Speechmatics or ElevenLabs is invoked, which regions are used, and what retention/deletion mechanics apply for each path.
    whyItMatters: Voice privacy and regulated-customer diligence depend on knowing whether a given language pair stays within DeepL or is routed through additional processors and jurisdictions.
    diligencePath: Obtain the current Help Center matrix referenced in the service-spec update and reconcile it against the DPA, product SKUs, and customer notices.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
