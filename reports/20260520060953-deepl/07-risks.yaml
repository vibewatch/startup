- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / transfer backlash from AWS default global processing
    - New regulator action, enterprise security FAQs, or customer contract redlines
    - Any new regulator order/investigation tied to cross-region processing, human review, or data-transfer disclosures
    - Pause regulated-customer underwriting until counsel confirms the issue is ring-fenced by product, region, and contract tier
  - - Voice subprocessor opacity
    - Public DPA updates, Help Center language matrix, or new subprocessor notices
    - Exact Speechmatics/ElevenLabs language map still unavailable or additional subprocessors added without clear customer documentation
    - Treat Voice as a narrower attach opportunity and discount cross-sell assumptions into regulated accounts
  - - Reliability / deployment fragility
    - Status page, StatusGator, IsDown, customer references
    - More than two major or partial outages in a rolling quarter or repeated geography-specific deployment incidents without formal RCA visibility
    - Cut confidence in mission-critical adoption and require operational review before underwriting expansion
  - - Valuation / model opacity
    - Next financing, secondary-market data, board materials
    - New equity financing at or below the prior round without a disclosed improvement in profitability or retention metrics
    - Reset valuation assumptions and require auditable unit-economics evidence before committing capital
  - - Quality / buyer-friction erosion
    - Review trends, sales win-loss notes, support tickets
    - Recurring glossary, latency, or paid-feature complaints show up in enterprise references or renewal conversations
    - Lower expected expansion and require product-quality roadmap with owner and timeline
  - - Execution overload
    - Executive departures, missed compliance milestones, roadmap slip
    - Loss of multiple key executives or visible slippage in AI Act/residency/customer-support readiness during Voice and AWS rollout
    - Escalate governance diligence and assume slower GTM conversion until the operating model stabilizes
  notes: Triggers are designed to be monitorable from public, contractual, or diligence-requested evidence within a normal investment monitoring cadence.
