- id: people-and-execution-risks
  title: People and execution risks
  body: 'People risk at DeepL is real but subtler than a pure founder-bottleneck story. The company does disclose a broader bench than many private AI companies, including a CTO, CPO, CFO, CRO, CLO, COO, and CMO alongside founder-CEO Jarek Kutylowski. That mitigates simplistic key-person concerns. The bigger issue is execution load. DeepL is trying to run a founder-led Language AI company at materially larger scale—1,000+ employees, 1 million paid licenses, and 200,000+ business customers—while simultaneously expanding beyond translation into writing assistance, real-time voice, Zoom and Teams workflows, customer-specific data residency, and a new AWS-hybrid operating model. Each move is rational on its own, but together they create coordination risk across product, compliance, enterprise sales, customer success, and support. The public record also stops short of showing the operating system behind that scale: no module-level support ratios, no public RCA discipline, no attach-rate disclosure
    for Voice or Write, and no public subprocessor language matrix. That means execution risk should be viewed not as “can DeepL hire executives?” but as “can DeepL synchronize legal, infrastructure, GTM, and product operations fast enough to keep trust high while the platform surface area expands?”'
