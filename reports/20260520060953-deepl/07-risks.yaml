tables:
- id: TR001
  title: Regulatory / legal risk register
  enumeration: true
  enumerationScope:
    coverage: sample
    basis: Publicly visible privacy, AI, healthcare, and sanctions sources were reviewed to capture the highest-severity legal exposures as of 2026; private customer agreements and regulator correspondence are not observable.
  columns:
  - Rule / case
  - Jurisdiction
  - Status (2026)
  - Likelihood (1-5)
  - Severity (1-5)
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - AWS global-processing default + GDPR/transfer posture
    - EU / global
    - Active in new contracts and renewals from 2026-01-01
    - '4'
    - '5'
    - Article 28 DPA with AWS, SCCs, client-side encryption, Data Residency add-on
    - High — default global processing plus sales-assisted-only residency can still slow regulated deals and create disclosure risk
    - Obtain current DPA annexes, SCC package, and list of AWS services/regions actually used by SKU
  - - PIPC / PIPA transparency precedent
    - Republic of Korea
    - 2024 ruling in force; DeepL says remediation taken
    - '2'
    - '4'
    - Updated user guidance, human-review disclosure, warning not to enter personal information
    - Medium — precedent shows regulators have already scrutinized training and reviewer disclosures
    - Get original PIPC file and management explanation of what changed in prompts, notices, and reviewer controls
  - - EU AI Act GPAI obligations
    - European Union
    - In force for GPAI obligations from August 2025
    - '3'
    - '4'
    - Technical documentation, downstream documentation, copyright policy, training-data summary, code-of-practice alignment
    - Medium-high — obligations are operationally broad and interact with product and copyright disclosures
    - Request Article 53 compliance workpapers, training-summary template, and copyright reservation process
  - - HIPAA / BAA obligations for healthcare workflows
    - United States
    - Ongoing if DeepL handles PHI for covered entities or business associates
    - '3'
    - '4'
    - BAA execution, no-training Pro commitments, enterprise security controls
    - Medium — public materials market HIPAA-readiness but do not show BAA language or scope boundaries for every workflow
    - Review standard BAA, confirm which products are in scope, and map shared-responsibility assumptions for healthcare customers
  notes: Rows ordered by residual severity. This is a severity-ranked sample of the most material public legal and regulatory risks rather than an exhaustive jurisdiction-by-jurisdiction compliance matrix.
