      - number: '6.4'
        title: 证据质量限制和客户风险
        blocks:
          - type: paragraph
            body: >-
              客户侧最大风险，是广泛采用主张与高质量证据之间不对称。DeepL
              可以可信地指向一个很大的客户网络和几个真实、具名的生产部署，但只有少数部署披露硬结果，几乎没有部署披露合同价值或续约行为。这很重要，因为独立档案和融资相关文章反复提到
              Zendesk、Coursera、Klarna、Nikkei 等 logo 层面的名字；但本次审阅的公开材料不能证明这些标杆关系的深度、近况或生产状态。第二个风险是独立满意度证据参差不齐。Gartner
              同时收录了一条正面的 4.0/5 评论和一条批评性的 3.0/5 评论，后者提到偶发冻结和竞争优势收窄。TrustRadius
              评论者称赞文档保真和相对口译员节省时间，但抱怨许可证灵活性，也需要检查技术术语。SourceForge
              又给出一条置信度较低的投诉，指向价格和设置摩擦。这些都不能推翻强具名案例研究，但说明公开客户满意度并不均衡，应在客户访谈中直接验证。
