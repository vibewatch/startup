      - number: '8.2'
        title: 投资逻辑是软件化 Language AI 的规模化；反向逻辑是披露、条款和公开可比公司的重力
        blocks:
          - type: paragraph
            body: >-
              投资逻辑建立在六个相互连接的判断上。市场需求真实：DeepL 的 2026 年调查称，35% 的企业仍在跑人工翻译工作流，71% 称 AI 驱动的工作流改造是 2026 年优先事项。产品宽度也真实：DeepL
              不再只是文本翻译工具，而是横跨翻译、写作改进、语音和 API 合作伙伴分发的平台。客户证据强于多数私营 AI 故事：官方材料引用 200,000 多家企业客户、1 million 付费许可证、50%
              Fortune 500，以及具有实质生产使用的案例研究。反向逻辑同样重要。公开财务证据仍止步于第三方估计，2024 年报道仍称公司未盈利，2024 年融资轮的具体优先权和老股经济性未披露，而且 2024 年
              PIPC 调查已经给出一个现实监管先例。公开市场也提供了硬约束：Duolingo、RWS 和 Appen 的披露收入倍数都远低于 DeepL 最新估值锚隐含的水平。这并不说明 DeepL
              质量低；它说明溢价仍依赖投资人尚不能核验的事实。
