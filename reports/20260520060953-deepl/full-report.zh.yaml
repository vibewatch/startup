      - number: '3.2'
        title: 直接引擎同业：能力广度、价格底线与信任姿态
        blocks:
          - type: paragraph
            body: >-
              面对直接引擎同业，DeepL 的强项是偏质量的包装和更适合企业的信任主张，而不是最广覆盖或最低公开 API 成本。DeepL 自身方案表清楚展示从 Individual 到
              Team、Business、Enterprise 的阶梯，在企业层加入不用于数据训练的条款和 BYOK，并给出足够的自助定价，方便专业人士和小团队采用。相比之下，Google 强调 189 种语言、基于自适应
              LLM 的翻译、自定义模型，以及首 500,000 个字符免费后每百万字符 $20 的明确公开价格底线。Azure 强调 135+ 种语言、强隐私 / 不持久化主张和免费层；Amazon 强调按需付费、75
              种语言和 Active Custom Translation，且不要求客户构建完整自定义模型。


              信任姿态也不是单边优势，而是混合状态。Google 表示 Cloud Translation 内容不用于训练，只在内存中短暂保留，但也说明全球端点无法保证区域内处理。Azure
              表示文本不会持久化、文档输入处理后会硬删除，但其透明度说明明确警告，高风险和法律场景需要人工复核。Amazon 在已审阅页面中对数据处理细节不如前两者明确，但它确实在更广 AWS
              采购体系内提供批处理、文档和自定义术语支持。结果是，DeepL 可以可信地声称有更简单的企业级包装，但不能声称在隐私、定制化或企业就绪度上拥有干净垄断。
