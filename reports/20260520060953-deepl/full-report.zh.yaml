  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域，以及 DeepL 实际在卖什么
        blocks:
          - type: paragraph
            body: >-
              DeepL 市场分析最重要的工作是划边界。若把 DeepL 对标整个语言服务经济，可服务市场显得巨大——数百亿美元，覆盖口译、人工翻译、本地化、创译、字幕、语言测试和合规要求很重的语言可及性服务。若对标 AI
              语言翻译软件，规模会收缩到数十亿美元。若对标狭义机器翻译软件，数字还会更小。公开来源支持三种框架，因为它们测量的是不同东西。DeepL 自身定位和平台对比显示，它处在这些层次之间：它不只是狭义 MT
              API，因为它销售文档翻译、写作、语音和企业信任功能；但它也不是提供口译员、认证译者或深度服务型本地化项目的全服务语言供应商。因此，现状替代品和直接竞争对手一样重要。买方仍可依靠双语员工、外包语言服务提供商、广义软件套件中的捆绑翻译，或原始
              LLM 界面。这就是为什么正确的市场框架既不是「所有语言服务」，也不是「只有纯 MT」，而是一个明确保留相邻领域的分层模型。
