      - number: '1.5'
        title: 反向信号、监管审查与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              概览层面的下行情景不是 DeepL 缺乏真实产品市场契合，而是公开披露仍留下关键尽调问题。已审阅来源中最清晰的外部反向信号来自韩国监管审查：PIPC 在 2024 年 6 月就 DeepL
              是否符合个人信息保护要求的调查作出裁定。与此同时，关注隐私的评测者认为 DeepL Pro 比 Google Translate
              提供更强保护，但免费层或未经批准的使用仍会带来实质保密风险，尤其是敏感内容。法律翻译评测者更明确：DeepL
              适合做方向判断、分流和首轮理解，但没有人工复核时，不应把它当作最终签署合同、监管文件或具约束力的法律译文。这些批评并不推翻业务逻辑；事实上，它们凸显 DeepL
              的安全和企业主张为何在战略上重要。但它们也形成仅靠公开证据无法解决的尽调工作流：调和官方和第三方员工数，验证当前收入 / ARR
              和盈利能力，拿到完整董事会和股权结构视图，并测试隐私保障在受监管买方环境中到底能否守住。
