      - number: '5.3'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              公开技术文档支撑一个分层运营模型。文本和写作方面，DeepL 运行传统请求 / 响应 API，区分 Free 和 Pro
              端点，提供语言发现端点、模型类型控制、上下文注入、词汇表和风格规则挂钩，以及文档翻译流程。语音方面，运营模型明确不同：客户端先请求会话，再通过 WebSocket
              流式传输音频，并增量接收转录和翻译；文档还给出重连逻辑、分块大小指引、JSON 或 MessagePack 编码，以及每会话五种目标语言和一小时最长连接等限制。围绕这些数据平面的是 Translation
              Flow、词汇表、风格规则和翻译记忆组成的工作流控制层。2026 年最重要的架构变化不在 API 边缘，而在算力 / 数据平面：DeepL Trust Center 材料称，商业和企业流量现在转向结合 AWS 与
              DeepL 自研基础设施的混合模型，而研究、模型训练和免费层工作负载继续运行在冰岛 / 瑞典自研数据中心。这还配套给需要区域固定的销售辅助客户提供合同化 Data Residency 附加项。换句话说，DeepL
              产品架构已不宜再描述为单一黑盒 MT 引擎；它是一个多触点平台，包含不同的文本、语音、工作流控制、管理 / 安全平面，并运行在新近混合的基础设施模型上。
