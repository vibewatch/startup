  - id: TV005
    title: 投资逻辑失效与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入证据失效
        - 经审计当前收入 / 年经常性收入（ARR）明显低于公开工作区间，尤其低于 ~$170M
        - 私募溢价会坍塌，因为当前估值标记再也无法被解释为软件增长价格。
        - 不要承销当前估值标记；按悲观情景经济模型重置。
      - - 软件经济模型失效
        - 毛利率证实 <65%，或留存偏弱（例如 NRR <105%）
        - DeepL 会更像计算密集型或混合服务业务，而不是高溢价 AI 软件平台。
        - 按更低的上市可比公司重新定价，并暂停任何溢价进入方案。
      - - 条款或分配瀑布意外
        - 参与型优先权、棘轮条款、激进优先级，或沉重老股 / 要约出售压力排在普通股之前
        - 表面估值不再反映普通股经济性。
        - 暂停流程，直到完整股权结构表和分配瀑布重建完成。
      - - 信任 / 集中度冲击
        - 出现重大的新隐私、监管、可靠性或客户集中度问题
        - 溢价倍数会失去支撑，因为增长耐久性和客户质量不再可信。
        - 立即下调评级，在问题解决前把建议推向回避。
    notes: 这些是可衡量的承销失败项，不是泛泛的观察事项。每个触发因素都直接打击当前估值标记所需的溢价倍数。
    claimRefs:
      - CV011
      - CV012
      - CV023
      - CV038
      - CV045
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 经审计 FY2024-FY2026 收入 / ARR 桥，连接 2023 年 $50M 运行率叙事和当前实际规模
        - 当前估值标记对真实收入更接近 $170M、$200M 还是 >$230M 极度敏感。
        - 索取 CFO 材料包、经审计师审阅的 KPI 定义，以及按产品和地区拆分的月度 ARR / 收入桥。
      - - 毛利率与计算经济模型
        - 毛利率、贡献利润率、推理 / 云 / 语音成本负担，以及产品组合明细
        - 只有经济模型明显好于混合服务或 AI 公用事业同行，DeepL 才配得上高溢价软件倍数。
        - 获取按产品系列拆分的毛利率瀑布，以及云 / GPU 承诺时间表。
      - - 留存与集中度
        - NRR、GRR、客户 logo 留存、ACV 区间、API 集中度和头部客户收入占比
        - 如果经济模型由少数大客户或低留存队列驱动，优质客户标题还不够。
        - 索取队列分析、前 20 大客户清单，以及按细分市场拆分的续约时间表。
      - - 2024 年融资轮经济条款
        - 清算优先权、参与权、棘轮条款、员工要约出售机制，以及新股与老股拆分
        - 如果普通股经济性在结构上弱于新闻稿暗示，表面价格会误导判断。
        - 让律师审查融资文件、股权结构表和分配瀑布分析。
      - - 退出准备材料包
        - 经审计报表、治理成熟度、法律 / 隐私准备度和 S-1 级披露控制
        - DeepL 的运营规模可能已经足以走 IPO 路径，但披露准备度未必足以按 IPO 口径定价。
        - 索取董事会材料、经审计财务历史、监管备忘录和 IPO 准备差距评估。
    notes: 这些是最低限度的尽调要求，用来把一个有吸引力的私募 AI 资产推进到可投资的价格判断。
    claimRefs:
