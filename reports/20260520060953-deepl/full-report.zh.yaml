    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 什么会改变观点
    rows:
      - - 投资逻辑
        - 市场需求仍未充分自动化：35% 的企业仍靠人工，71% 表示 AI 工作流转型是 2026 年优先事项。
        - 广泛企业工作流采用和更清晰的付费转化数据，会强化溢价逻辑。
      - - 投资逻辑
        - DeepL 具备真实软件规模证据：200k+ 商业客户、1M 付费许可、覆盖 50% 的 Fortune 500，并具备企业级控制。
        - 公开披露企业 ACV 区间、留存和队列扩张，会让这批客户更具可投资性。
      - - 投资逻辑
        - 产品宽度已覆盖翻译、Write、Voice 和 API 驱动的合作伙伴分发，支撑其相对狭义翻译工具的平台溢价。
        - Write / Voice / API 持续绑定，以及合作伙伴来源 ARR，能支持投资者给出高于服务型语言同行的估值。
      - - 反向逻辑
        - 核心收入锚点仍是第三方估计，而经审计收入、毛利率、NRR 和集中度仍未公开。
        - 披露经审计的 FY2025/FY2026 收入、软件式毛利率和留存，将实质降低不确定性。
      - - 反向逻辑
        - 公开可比公司的估值重力很强：Duolingo、RWS 和 Appen 的交易倍数都远低于 DeepL 隐含 2024 年倍数。
        - 要么入场价格下降，要么 DeepL 证明经济性远强于这些已披露同行。
      - - 反向逻辑
        - 轮次条款、二级交易机制和仍然有效的隐私监管先例，意味着普通股经济性可能差于表面估值。
        - 清晰的股权结构瀑布、没有结构化保护、且没有新的信任冲击，将改善承销逻辑。
    notes: 投资逻辑关注真实市场、产品和客户质量；反向逻辑关注投资者在当前价格下仍无法核验的内容。
