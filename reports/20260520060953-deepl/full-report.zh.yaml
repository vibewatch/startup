  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础、ICP 与分层
        blocks:
          - type: paragraph
            body: >-
              DeepL 的公开客户记录先证明广度，其次才证明深度。漏斗顶部，当前官方页面称，DeepL 在 228 个市场被 200,000 多家企业和政府使用，约半数 Fortune 500
              信任这个平台。但更能用于决策的证据来自具名部署。这些部署呈现出一个反复出现的购买模式：中央
              IT、本地化、法律运营、研发或传播负责人购买或批准产品；员工、律师、工程师、一线人员或下游网站访客使用产品；雇主或平台供应商付费。用例并不相同。一些客户需要安全的文档翻译和写作支持，一些需要嵌入产品的 API
              本地化，另一些需要会议里的实时语音协作。公开证据覆盖法律服务、铁路和基础设施、工业制造、酒店、游戏、生命科学、电子和本地化软件。地域也很宽，日本、德国、更广义的 DACH
              地区、法国和跨国部署都有强具名证据。缺口在于，200,000 客户这一头部数字没有按企业规模、垂直行业、合同层级，或直销与渠道组合公开拆分；因此，客户数的广度不能等同于企业收入质量。
