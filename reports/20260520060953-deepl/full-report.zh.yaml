      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              公开证据指向混合 GTM 动作：DeepL 仍受益于广泛的产品主导漏斗，但变现栈如今明确包含企业销售、入职、客户成功和伙伴分销。官方企业页面宣传专属客户覆盖、技术支持、SLA、SSO、管理控制和用量分析；2026
              年领导层公告明确表示，新 COO 和 CRO 的任务是扩展企业采用、演进 GTM 系统。合作伙伴渠道不再只是脚注。DeepL 自己的应用市场博客称，合作伙伴计划在前九个月引入 50 家伙伴，公开伙伴目录则显示
              CRM、本地化、公共部门、IT、电商和内容平台中有数十个列表。这在财务上重要，因为应用市场 部署通常依托客户自己的 DeepL API key
              或谈判方案，意味着分销杠杆并未创造一个脱离核心平台、质量较低的单独转售业务。公开客户证据也显示真实生产使用：一个 API 案例提到 24 million 个字符，另一家公司把 DeepL 推广到 100+
              名用户，某个语音部署声称会议时间减少 50%。这些是有用的效率和扩张信号，但不能替代 CAC 回本周期、销售配额产能、净留存率或流失数据。公开记录支持一个正在成熟、带有渠道杠杆的企业 GTM
              引擎；但还不能支撑硬销售效率模型。
