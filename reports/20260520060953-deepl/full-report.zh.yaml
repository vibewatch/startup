        title: 路线图、成熟度与差异化结论
        blocks:
          - type: paragraph
            body: >-
              更新日志把产品推进速度摊得很清楚。2025 年底，DeepL 发布了初版 Voice API，并补上新的使用量和报告能力；2026 年又加入按 API key 设置的语音限额，扩大 Write 语言和 Style
              Rules 支持，正式推出翻译记忆库，并让 Voice API 面向付费 API 客户全面可用。同一份公开路线图也显示，一些边角仍不成熟：Voice API 的译后语音仍处于封闭 beta，面向消费者的
              Voice for Conversations 定位早于核心文本翻译，更新日志的「正在积极开发」清单里还包括翻译记忆库 CRUD、API key 级端点限制和更细的使用报告。结论是，DeepL
              现在已经有可信的产品平台，真正具备工作流控制和集成宽度，不只是原始机器翻译（MT）质量；但各模块成熟度并不均衡。Translator、API Translate 和企业控制看起来成熟；Write
              的商业化是真实的，也还在扩展；Voice 明显已经发货，但仍带着更多路线图和第三方处理披露上的注意事项。尽调上，产品风险已经不再是 DeepL
              是否有可防守的平台，而是新模块能扩得多快、附加率能做到多少，以及客户如何看待 2026 年的数据处理和语音子处理方披露。
