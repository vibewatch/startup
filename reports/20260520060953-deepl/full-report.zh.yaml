  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: DeepL 的采用通常从多语言工作流痛点开始，先经过安全和工作流验证，再从团队用例扩展到标准化文档、API 或语音工作流。
    approximationNotes: 旅程阶段综合自具名客户故事，而非某个已发布的 DeepL 漏斗；NO&T、Kanadevia、Deutsche Bahn、Weglot、Panasonic Connect 和 Aramark 中反复出现的模式构成了依据。
    data:
      nodes:
        - id: pain
          label: 多语言痛点出现
          detail: 法务、工程、本地化或运营团队在文档、会议或跨境协作中遇到语言瓶颈。
        - id: informal
          label: 非正式或团队级使用
          detail: 员工往往先个人或小团队测试 DeepL，再进入正式审批；NO&T 和 Kanadevia 都描述过这一模式。
        - id: security
          label: 安全与采购审查
          detail: IT、法务或合规验证数据保护、管理控制，以及产品能否获批用于业务。
        - id: deployment
          label: 工作流部署
          detail: DeepL 以浏览器扩展、企业席位计划、Teams 中的 DeepL Voice，或产品 / CMS 工作流内的 API 集成落地。
        - id: expansion
          label: 扩展到更多模块或部门
          detail: 初始翻译用例证明价值后，账户会增加 Write、Voice、术语表、文件翻译或基于 API 的自动化。
        - id: durability
          label: 持续使用与案例循环
          detail: 日常使用、术语表维护、高流量 API 和内部标准化创造续约与标杆案例潜力，尽管公开队列指标未披露。
