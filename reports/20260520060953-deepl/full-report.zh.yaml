      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              DeepL 的乐观情景很直接：质量品牌强、企业信息传递偏隐私、自助商业阶梯比多数本地化平台更简单。但反向证据也有分量。第一，云巨头设定硬参考价格，语言覆盖也广得多，仅靠广度很难让 DeepL 守住 API
              溢价经济性。第二，Azure 自身透明度说明和 RWS 2026
              年实施指南都强化了一点：敏感、受监管和法律内容仍需要人工复核，这会限制任何「仅靠翻译」护城河在高后果工作流中能走多远。第三，工作流供应商可以多宿主引擎并保留买方杠杆，这意味着即便 DeepL 赢单，若客户把
              Phrase、Crowdin、Smartling 或 Lokalise 当作真正控制点，DeepL 的胜利仍可能只是部分胜利。


              来自内部自建和潜在进入者的长期替代压力也可信。Nordic APIs 如今把 OpenAI、Anthropic 等 LLM 提供商视为值得关注的翻译型 API，即便它们在速度、价格和规模一致性上仍弱于专用翻译
              API。Meta 的 NLLB 研究显示，开源语言覆盖可以非常广，包括此前商业系统不支持的语言。合在一起，这些事实意味着 DeepL
              的护城河只有继续上移到工作流、合规、定制化和分销才耐久；如果只押注原始翻译质量会永远稀缺，就不耐久。
