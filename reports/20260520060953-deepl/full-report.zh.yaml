  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、替代品类别，以及 DeepL 真正在哪里竞争
        blocks:
          - type: paragraph
            body: >-
              DeepL 的竞争对手不只是其他翻译引擎。直接同业是超大规模云厂商 API 层——Google Cloud Translation、Azure AI Translator 和 Amazon
              Translate——因为三者都通过成熟开发者渠道销售程序化翻译、定制化、文档处理和企业采购。但战略上更危险的对手可能是 Smartling、Phrase、Lokalise、Crowdin
              这样的工作流所有者，因为它们可以站在多个引擎之上，决定 DeepL 何时只是路由栈中的一个供应商，而不是主记录系统。Lilt 和 Unbabel
              这类服务主导平台则在另一个维度竞争：它们卖托管质量、人工验证和受监管部署，而不是最低价的原始 API 输出。


              替代品集合同样真实。RWS 认为，2026 年企业 AI 翻译不是把一个工具丢进每个工作流，而是带有人审、路由规则和治理的编排式混合系统。Nordic APIs
              也把更广义的「翻译栈」描述为引擎、本地化平台和相邻基础设施的组合。这个框架重要，因为它意味着 DeepL 不仅要胜过其他 MT 供应商，还要胜过既有 LSP 关系、用云 API
              或开源模型内部自建的路径，以及来自通用 LLM 提供商的潜在进入者；这些提供商即使在价格、速度和规模一致性上仍落后专用 API，也已经具备翻译能力。
