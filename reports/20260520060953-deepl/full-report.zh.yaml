      - number: '8.4'
        title: 产品规模层面已有退出条件，但披露层面还没准备好
        blocks:
          - type: paragraph
            body: >-
              DeepL 更像是未来 IPO 或大型老股交易候选，而不是一个即刻战略出售故事。公司规模、品类能见度和客户证据已经足够支撑 3 到 5
              年退出窗口，但从披露角度看，还不像已经准备好成为上市公司。达到申报级别的可比公司，能让投资人直接读到收入、盈利能力、集中度和资产负债表细节；DeepL
              不能。因此，最后的尽调工作很基础，但决定性：证明当前收入和增长水平，展示毛利率和留存，解释客户集中度和算力强度，并披露 2024
              年融资轮的真实经济优先级，以及任何老股或要约机制。在这些事项关闭之前，正确的投委会框架很简单：继续跟踪投资逻辑，不要把缺失事实当作已经证明来支付今天的价格；如果最终披露把 DeepL 从软件溢价推向混合服务或
              AI 公用事业经济性，就要大幅下调判断。
