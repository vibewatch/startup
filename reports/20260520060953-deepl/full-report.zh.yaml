        - 实际席位、用量和服务价格
        - 在质量 / 合规能支撑不透明商务模式的场景竞争
      - - Unbabel
        - 已审阅材料中未能公开找回官方定价页
        - 销售主导的企业合同
        - LangOps 工作流、质量估计、集成、安全和匿名化
        - 最低合同金额，以及 AI 与人工混合定价
        - 更可能被当作运营平台评估，而非自助式翻译工具
