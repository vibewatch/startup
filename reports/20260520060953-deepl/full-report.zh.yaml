      - number: '1.3'
        title: 融资历史、投资人基础与财务披露质量
        blocks:
          - type: paragraph
            body: >-
              公开资本形成证据在最近两轮最强。DeepL 2024 年 5 月宣布以 $2 billion 估值融资 $300 million，由 Index Ventures 领投，ICONIQ
              Growth、Teachers’ Venture Growth、IVP、Atomico、WiL 等新老投资人参与。第三方数据库还记录 2023 年 1 月一轮略高于 $100 million、由 IVP
              领投的融资，将公司推入独角兽行列。2026 年公司页面把 Benchmark、IVP、Index Ventures 列为标志性支持者，Tracxn 则报告五轮累计融资约 $415
              million。核心结论是，DeepL
              在保持私有、基本未经审计的同时，拿到了全球顶级风险资本支持。这一优势也带来披露取舍：公开来源没有完整股权结构表、老股交易、清算优先权、债务工具或股东控制条款。第三方收入服务显示，公司年化收入运行率可能从 2022
              年底约 $50 million 快速升至 2024 年约 $185 million，但这些数字并非公司申报或经审计。概览层面，正确处理方式是承认融资支持强、规模在改善，同时把更深的投资判断留到财务章节。
