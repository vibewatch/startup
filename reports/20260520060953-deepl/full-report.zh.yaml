      - number: '7.5'
        title: 人员和执行风险
        blocks:
          - type: paragraph
            body: >-
              DeepL 的人员风险是真实的，但比单纯的创始人瓶颈叙事更微妙。公司确实披露了比许多私营 AI 公司更宽的高管梯队：除创始人兼 CEO Jarek Kutylowski 外，还有
              CTO、CPO、CFO、CRO、CLO、COO 和 CMO。这缓解了简单化的关键人担忧。更大的问题是执行负荷。DeepL 正在以大得多的规模运营一家创始人主导的 Language AI 公司——1,000+
              员工、1 million 付费许可证和 200,000+ 企业客户——同时从翻译扩到写作辅助、实时语音、Zoom 和 Teams 工作流、客户特定数据驻留，以及新的 AWS
              混合运营模型。每一步单看都合理，但叠在一起，会在产品、合规、企业销售、客户成功和支持之间制造协调风险。公开记录也还没有展示支撑这种规模的运营系统：没有模块级支持比例，没有公开 RCA 纪律，没有 Voice 或
              Write 附加率披露，也没有公开的子处理方语言矩阵。因此，执行风险不应被看成「DeepL 能不能招到高管？」而应被看成「平台表面积扩张时，DeepL 能不能足够快地同步法务、基础设施、GTM
              和产品运营，守住高信任？」
