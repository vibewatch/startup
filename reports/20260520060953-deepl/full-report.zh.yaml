      - number: '1.4'
        title: 规模、里程碑与市场定位
        blocks:
          - type: paragraph
            body: >-
              最强公开牵引力信号是企业覆盖广度和产品扩张。官方 2026 年页面称，DeepL 目前服务 200,000+ 家企业客户，拥有 1 million 张付费许可证，覆盖 228 个全球市场；2024
              年融资材料已显示 100,000+ 个组织和美国市场快速增长。访谈和外部画像补充了有用信息：Jarek 称业务服务 50%+ 的 Fortune 500；Forbes 列出截至 2025 年 9 月 1,000
              名员工；Tracxn 估计到 2026 年 1 月员工数接近 1,570。这个区间方向上利好，但数字不一致，因此尽调应把官方员工数视为保守底线，把第三方估计视为未经验证的上行情景。里程碑报道也显示 DeepL
              正从纯文本翻译拓宽为更完整的企业语言栈。近期重要事件包括 2024 年 1 月开设首个美国办公室、2024 年 4 月推出 DeepL Write Pro、2024 年 5 月融资、2024 年 11 月发布
              DeepL Voice，以及 2025–2026 年扩展智能体和定制化功能。合在一起，这些信号支撑这样一家公司：品类定义仍是翻译，但商业化越来越像更广义的企业沟通平台。
