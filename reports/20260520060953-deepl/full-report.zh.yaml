  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 当前收入已 >$230M，增长仍 >30%，毛利率呈软件型，Write / Voice / API 扩张提升收入结构，且 2024 年轮次条款干净。
        - 估值约 $1.9B-$2.4B；相比上一轮估值标记接近持平到小幅上行，也就是说即使乐观情景，在今天价格下也没有留下多少容错空间。
        - 倍数压缩、留存疲弱或结构化条款会抹去大部分上行空间。
        - ~20%
      - - 基准
        - 收入约 $190M-$230M，增长放缓到 20%+ 区间，企业采用持续推进，且没有重大信任或监管冲击。
        - 估值约 $1.3B-$1.8B；低于上一轮估值标记，意味着当前入场的非对称性较弱，只有价格更低时机会才更好。
        - 缺少毛利率证明、绑定率较低，或经济性更像服务公司，都会迅速压缩溢价。
        - ~55%
      - - 悲观
        - 收入 <$170M 或大幅放缓，毛利率和留存不及预期，集中度被证明偏高，或合规 / 信任问题恶化。
        - 估值约 $0.7B-$1.1B；明确进入降估值融资或折价二级交易区间。
        - 竞争、计算密集型收入结构、股权结构意外和新的隐私担忧会加速重估下行。
        - ~25%
    notes: 这些是基于公开证据的情景，不是管理层预测。它们刻意为不确定性付费，而不是把缺失的私有数据视为已经解决。
    claimRefs:
