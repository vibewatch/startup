chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              DeepL 将自己定位为专门的语言 AI 公司，而不是通用 AI 供应商。当前官方叙事称，公司 2017 年由 CEO Jarek Kutylowski
              在科隆创立，已从单一翻译产品长成统一平台，组合文本翻译、文档翻译、写作辅助、语音翻译和开发者 API。产品栈重要，因为它说明 DeepL
              如何把同一套核心语言模型在消费者、专业用户和企业工作流中反复变现。官方页面把翻译、Write、Voice 和 API
              作为商业支柱；评测和访谈也显示，业务重心已经转向企业级语言工作流，而不只是消费者翻译便利。免费增值层仍带来广泛个人采用，但付费引擎是企业和专业使用：企业客户、付费许可证、API
              使用量，以及隐私保障更强的安全付费方案。公开来源还给出一个后续尽调必须保留的时间线细节：DeepL 品牌和产品在 2017 年推出，但公开数据库和参考材料把公司连接到更早的 Linguee
              法律实体和基础设施。应把 2017 年视为 DeepL 清晰的商业起点，同时明确记录前身历史，不要把两套叙事合并成一个缺乏支撑的创立日期。
