        - 每月 2M 字符免费；已展示承诺 / 自定义翻译层级
        - 用量加承诺层级
        - 文本、文档和自定义翻译；Foundry 集成
        - 抓取页面未显示当前标准 S1 价格
        - 免费层有吸引力，但精确边际成本仍需借助计算器或报价确认
      - - Amazon Translate
        - 12 个月免费层；之后按用量付费
        - 按用量计费的 API 收费
        - 实时、批量、文档和 Active Custom Translation
        - 抓取到的定价页未呈现按字符分层的详细价格
        - 即便功能叙事不是最强，对 AWS 原生开发者仍是有竞争力的默认选项
      - - Smartling
        - 已审阅的套餐页没有自助标价
        - 销售主导的订阅
        - 工作流、供应商管理、质量监控、SSO、报告
        - 最低采购额、翻译成本和模块化加购项
        - 竞争点是控制平面，而不是低价入门引擎
      - - Phrase
        - 按容量的平台定价；专业翻译 $0.06/word 起
        - 平台订阅加用量型加购项
        - 无限 TMS 席位、AI / 编排模块、分析、多媒体加购项
        - 企业规模下的处理词数、MTU、AIU 和工作流成本
        - 经济性比较取决于买方多看重工作流和供应商管理
      - - Lokalise
