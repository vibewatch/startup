  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价表面与确认机制
        blocks:
          - type: paragraph
            body: >
              DeepL 并不是靠单一 SKU 变现，而是用多个包装层变现同一个语言 AI 平台。公开公司页面和条款显示，DeepL Pro 和企业部署有经常性席位订阅，Write Pro 等产品带来附加扩张，开发者 /
              API 栈则混合固定经常性收费和按翻译字符、音频分钟计量的用量计费。公开证据最强的是计费机制，而不是实际价格点：DeepL
              支持页清楚说明，标准席位订阅可按月或按年计费，年度方案试用后预付，月度方案在每个周期开始时收费，API 方案则有不同的计量计费规则。API Growth
              是目前最清晰的公开定价结构，月度或年度承诺包含用量额度，并按实际成功消耗开具超额发票；企业 API
              项目则通过销售团队转向定制承诺。收入确认和现金时点细节在这里很重要。年度席位方案很可能形成递延收入和有利营运资本动态，API 用量则在服务交付时确认，可能部分滞后计费或周期性预付。DeepL
              条款还暗示，实施、咨询或培训不是默认公开 SKU，因为这些服务需要单独书面协议，因此公开基准情景是软件占比较高的收入组合，而非服务主导。未知项仍是席位订阅、API
              消耗、语音、附加项、企业打包，以及谈判合同内嵌服务收入之间的真实拆分。
