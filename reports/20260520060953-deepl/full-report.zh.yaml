      - number: '3.3'
        title: 工作流所有者、人机协同供应商，以及切换成本真正落在哪里
        blocks:
          - type: paragraph
            body: >-
              DeepL 最大结构性挑战是，现代买方越来越优化工作流控制，而不是单一翻译引擎。Phrase 公开把品类定位在 AI
              治理、数据所有权、集成广度，以及从一个平台治理产品、营销、支持和多媒体本地化的能力上。它还表示，客户可以在同一栈中路由 Amazon、DeepL、Google 和 Microsoft 引擎。Crowdin
              从开发者优先角度提出类似观点：700+ 个集成、翻译记忆、词汇表、CI/CD 同步，以及连接 DeepL、Google、Azure、Amazon、OpenAI、Anthropic
              的机器翻译连接器，都会削弱引擎锁定。Smartling 的公开方案页同样突出动态工作流、供应商 / LSP 管理、SSO、LQA 监控和报告，而不是原始 MT 主张。


              切换成本因此上移到翻译记忆、词汇表、工作流模板、用户权限、采购习惯和分析，而不是引擎层本身。Lokalise 强调 3,000+ 家公司中的 1 million 用户、广泛 API / webhook /
              SDK，以及可在多个模型之间路由的 AI 编排层。Lilt 和 Unbabel
              再往前一步，销售托管部署、人工专家验证、气隙或受监管选项，以及质量估计。这些供应商并不总是最便宜，定价也不总是最透明；但当买方真正的问题是风险管理、模型治理或多语言运营，而不是某个引擎原始文本质量略高时，它们可以赢。
