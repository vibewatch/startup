  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: DeepL 的投资建议仍偏谨慎：规模和产品验证很强，但估值仍取决于未披露的私有事实。
    data:
      nodes:
        - label: 需求验证：2026 年，多语言工作流痛点仍然真实存在
        - label: 产品 / 客户验证：200k+ 家企业、1M 付费许可，写作 + 语音 + API
        - label: 价格锚点：2024 年 5 月融资轮估值 $2B
        - label: 上市可比公司牵引：按已披露收入计，Duolingo、RWS 和 Appen 的市场定价都更低
        - label: 披露缺口：经审计收入、利润率、留存和融资条款仍未公开
        - label: 投资建议：继续研究；需要更清晰的证据，或更低入场价格
