        - 需要判断 DeepL 是高毛利 SaaS，还是更重算力的 AI 工具型服务
        - 基础设施和处理成本信号可见，但无公开毛利数据
        - 索取按产品拆分的毛利率，以及云、GPU、模型训练和人工审核成本明细
      - - NRR / GRR / CAC 回本周期 / 销售效率
        - 需要建模增长效率，以及规模化 GTM 建设的回本
