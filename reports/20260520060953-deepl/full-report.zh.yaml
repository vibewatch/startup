      - number: '8.3'
        title: 公开可比公司和情景测算为私募溢价划出价格纪律
        blocks:
          - type: paragraph
            body: >-
              选择的可比公司故意做成混合集合，因为没有任何上市公司是 DeepL 的完美类比。Duolingo 是最好的高溢价语言软件参照，但 EV / 销售额仍只有约 3.8x。RWS
              是最接近的规模化语言及本地化领域在位企业，但服务属性重得多，在艰难的 FY2025 后，市值 / 收入约 0.5x。Appen 不是翻译软件同行，却是有价值的 AI
              数据服务警示型可比公司，因为它说明：当集中度、业务组合和市场结构都对投资人不利时，公开市场估值可以多快压缩。对照这些已披露锚点，DeepL 2024 年在 $185.2M 2024 年收入估计上给出的 $2B
              估值，明显高于公开市场先例。如果 DeepL 确实像一个高增长、软件主导、利润率强且低集中度的多语言 AI
              平台，溢价是应得的。但公开证据今天还没有证明这一点。因此，当前估值应落在可支撑区间的乐观端附近，而不是基准情景中心。
