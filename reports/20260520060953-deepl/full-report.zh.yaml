      - 缓释措施 / 尽调问题
    rows:
      - - DeepL 在商务翻译质量上领先
        - 云 API 迭代很快，并公开压住价格下限
        - Google 主推 Adaptive Translation 和 189 种语言；Azure 与 AWS 加上定制能力和企业分发
        - 高
        - 索取按内容类别划分的最新盲测基准，以及 DeepL 替换云 API 后的续约数据
      - - 隐私优先的企业叙事
        - 其他既有厂商如今也发布强隐私 / 不训练 / 不留存承诺
        - Google 称不会用翻译内容训练；Azure 称不留存文本，并硬删除文档
        - 中高
        - 压测受监管买方的赢单率，以及 BYOK 是否真正改变采购结果
      - - 简单的自助式包装
        - 工作流平台可以把 DeepL 降格为路由栈中的一个引擎
        - Phrase、Crowdin 和 Smartling 都突出编排、供应商管理和引擎选择
        - 高
        - 询问 ARR 中有多少来自独立席位 / API，多少来自嵌入式平台合作和路由工作流
      - - 以翻译质量差异化
        - 在受监管或法律内容里，人工审核仍给自动化设上限
        - Azure 提示不支持法律文档；RWS 建议高风险工作流走人工或后编辑路径
        - 高
        - 验证哪些垂直行业无需人工审核即可发布，以及 DeepL 仍在哪些场景需要合作伙伴或客户审核层
      - - 靠术语表和使用习惯形成引擎锁定
        - 多引擎并用已经是现代本地化系统的常态
        - Phrase 和 Crowdin 公开连接 DeepL、Google、Microsoft、Amazon、OpenAI 和 Anthropic
        - 高
        - 衡量多引擎账户中的 logo 流失和引擎份额，而不只看客户总数
      - - 翻译能力稀缺性
        - 开源和 LLM 新进入者扩大了可行替代集合
        - Meta NLLB 展示了广覆盖的开源能力；Nordic APIs 称 OpenAI 和 Anthropic 是值得关注的可翻译新进入者
        - 中高
        - 跟踪客户在内部自建、OSS 和通用 LLM 上的实验，避免其演变为正式流失事件后才发现
    notes: 本清单关注优势能否持续，而不是绝对产品质量。关键问题是 DeepL 能否从「最佳引擎」认知，推进到控制周边工作流和信任层。
