      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              DeepL 的需求形成来自企业且跨职能。产品、本地化、文档、营销、支持、法律和安全团队都会接触多语言内容，但购买方式并不相同。Crowdin 的企业调查和 RWS
              的实施指南指向一个清晰模式：组织越来越把翻译视为编排流程，而不是一次性工具选择。用户可能是支持客服、营销人员、本地化经理或律师；运营者可能是本地化或产品团队；审批者可能在工程、法务、合规或采购；付款通常来自职能软件、本地化、CX
              或 IT 预算。这就是平台控制重要的原因。在成熟组织里，翻译决策与 TMS 平台、工作流集成、可审计性、术语资产和复核阈值绑定，而不是孤立席位采购。Phrase 的平台分层和 Slator
              的买方调查强化了同一结论：采购不再只看原始翻译质量，而看多语言工作流能否在产品发布、客户支持和受监管内容中安全扩张。买方看重高质量输出加治理时，DeepL
              会赢；买方只需要便宜、够用的翻译，或已拥有更广的捆绑平台时，DeepL 会输。
