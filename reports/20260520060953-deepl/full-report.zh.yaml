        - 套餐加托管 / 处理词数模型
        - 套餐内含 AI 翻译、自定义 AI 配置、编排、开发集成
        - 抓取文本未披露企业标价
        - 适合产品团队，但企业总成本取决于用量和 AI 组合
      - - Crowdin
        - 部分加购项透明，例如 CDN 在 1M requests 和 10GB 内免费
        - 订阅加托管词数和加购项
        - MT、AI 校对、语言服务、700+ 集成
        - 完整企业成本取决于托管词数、组织层级和加购项栈
        - 对开发者友好，但不能直接和纯 API 定价对比
      - - Lilt
