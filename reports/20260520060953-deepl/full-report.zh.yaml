        - Contextual AI 平台、模型库、模型构建器、连接器、托管部署、人工专家
        - Business / Enterprise / Government 打包，定制开票而非公开标价
      - - Unbabel
        - 服务主导 / LangOps 平台
        - LangOps 定位、质量估计、ISO 27001 和匿名化控制
        - 客户服务、多语言内容运营、优化成本 / 质量 / 速度的企业
        - 动态人机协作工作流、质量估计、集成、重安全处理
