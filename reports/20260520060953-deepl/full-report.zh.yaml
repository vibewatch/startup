      - number: '6.2'
        title: 具名部署和采用轨迹
        blocks:
          - type: paragraph
            body: >-
              DeepL 的确有真实的具名生产证据。Deutsche Bahn 自 2022 年 1 月起用 DeepL 做内部沟通，维护近 30,000 条术语表词条，覆盖最多 16
              种语言，并把浏览器扩展工作流开放给集团员工。Nagashima Ohno & Tsunematsu 在一家 1,000 多名员工、其中约 600 名律师的律所内部铺开 DeepL
              Enterprise，并称过去要一整天的工作现在几分钟即可完成。Haufe X360 围绕 DeepL API 和术语表，为 60,000 多条 UI 字符串和 2,400
              万字符文档搭建了自动化本地化工作流。Kanadevia 在 2024 年做了 100 用户概念验证，大约两个月后转为正式合同，现在在合同、研发、IT 和会议场景中使用 Pro、Write 和
              Voice。Aramark 和 Avendra International 称，在 Teams 中采用 DeepL Voice 后，会议时长从 90 分钟或更长降到 60 分钟或更短。Weglot
              尤其重要，因为它证明了嵌入式 / API 渠道：Weglot 自 2018 年起使用 DeepL API，每月处理数十亿字符，现在每月向 DeepL 发起约 1,600 万次 API
              调用。合起来看，这些案例支撑了一条真实采用轨迹：从直接席位销售，扩到语音和 API 驱动的增长。
