  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              DeepL 最高严重度的风险已经不只是付费产品是否足够私密、能否供企业使用；更关键的是，底层产品和基础设施堆栈不断变化时，公司能否让法律和监管叙事保持一致。2026 年 1 月 Trust Center
              更新把新合同和续约迁到 AWS 混合模型，把商业内容默认设为全球多区域处理，并把区域锁定推成需要销售介入的附加项。许多客户可以接受，但 GDPR
              传输分析、采购审查和客户披露纪律的重要性都会上升。法律记录也显示，DeepL 的风险不是假设。韩国 PIPC 在 2024 年因个人信息处理调查了公司，并认定用户没有被清楚告知：输入数据可能用于 AI
              训练，或由人工审核员处理。DeepL 似乎已经整改，但这个先例重要，因为 DeepL 同时营销面向医疗、符合 C5、企业级安全的工作流。在隐私法之外，EU AI Act 现在还对 GPAI
              提出文档、版权政策和训练摘要义务。结果是，合规负担、披露质量，以及逐客户配置合同的能力，会直接影响销售速度和信任。
