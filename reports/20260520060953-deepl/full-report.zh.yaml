  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 估值最受四件事撬动：经审计收入能否坐实、经济性是否像软件、普通股条款是否干净，以及下行时向上市可比公司收敛的压缩压力。
    data:
      items:
        - label: 经审计收入 >$230M，增长 >30%
          value: 0.3
        - label: 毛利率 >75%，NRR >115%
          value: 0.2
        - label: 股权结构表干净，遗留负担有限
          value: 0.1
        - label: 向已披露上市可比公司估值靠拢的重估
          value: -0.5
        - label: 合规 / 集中度 / 信任冲击
          value: -0.6
    approximationNotes: 数值是相对 $2B 锚点的估值变化方向性评分，单位为十亿美元；依据情景框架推导，而不是管理层指引。
