        - 动态工作流、第三方供应商管理、SSO、LQA 智能体、报告
        - 有公开套餐表，但审阅材料没有透明自助标价
      - - Phrase
        - 工作流平台 / TMS
        - 企业平台，具备 50+ 个集成，并主打供应商中立路由
        - 跨职能企业本地化、产品、营销、支持
        - TMS + Strings + AI + Orchestrator + Analytics + 多媒体本地化
