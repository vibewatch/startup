  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              DeepL 现在不再把产品描述成单一翻译器，而是面向商务沟通的语言 AI
              平台。按工作流看，核心客户任务是把多语言工作推过一个运营循环：摄入文本、文件或语音；完成语言转换或写作改进；强制执行术语、风格和权限；把输出发布回业务系统；并让全流程安全到足以通过企业采购。支撑该循环的公开产品套件如今已清晰分为
              Translator、Write Pro、Voice 和 API。Translator 不再只是一只文本框；它包含用于管理翻译任务的 Translation
              Flow，以及用于应用词汇表、风格指南、风格档案和翻译记忆的 Customization Hub。Write Pro 处理翻译前后改进商务写作的相邻任务，Voice 则把同一平台延伸到会议、面对面对话、联络中心或
              BPO 工作流。公开客户中心的证明显示，这些工作流并非假设：DeepL 提到一个 24 million 字符的 ERP 本地化部署、一个覆盖 100+ 名用户的内部语言基础设施上线，以及 Voice
              辅助协作让会议时间减少 50%。
