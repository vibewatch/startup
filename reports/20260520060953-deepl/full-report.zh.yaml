      - number: '6.3'
        title: 留存、重复使用和扩张潜力
        blocks:
          - type: paragraph
            body: >-
              留存图景方向上积极，但财务证据不完整。公开案例研究给出连续性信号：Deutsche Bahn 上线四年多后仍在活跃使用，Weglot 自 2018 年起一直留在 DeepL，Kanadevia 很快把 2024
              年试点转成正式合同，Haufe 称其工作流从一个 ERP 本地化项目扩到更广的 Haufe Group 用例。扩张似乎也发生在相邻产品界面之间。Kanadevia 从翻译延伸到 Write 和
              Voice；Panasonic Connect 同时使用翻译和写作改进；Aramark 在 Microsoft Teams 中使用 Voice；Weglot 在自己的客户侧平台里通过 API 消费
              DeepL。这是好消息。坏消息是，这些公开信号都没有披露净留存率（NRR）、总留存率（GRR）、客户留存、续约率、队列曲线或客户集中度。独立评论平台补了一点质感——有正面，也有批评——但不能替代队列经济性。因此，正确的尽调姿态是：把公开连续性和模块扩张视为鼓励信号，同时在管理层提供队列续约、附加率和头部账户集中度之前，暂缓对客户耐久性和集中度作正式判断。
