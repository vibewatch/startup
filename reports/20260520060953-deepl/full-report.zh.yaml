companyProfile:
  summary: >
    DeepL 是一家位于科隆的语言 AI 公司，官方商业叙事从 2017 年创始人兼 CEO Jaroslaw "Jarek" Kutylowski 开始。该平台如今覆盖翻译、文档工作流、写作辅助、语音产品和开发者
    API，并在核心能力上叠加词汇表、风格规则、翻译记忆、企业管理和安全等工作流控制。公开证据支撑它已具备真实企业规模和客户契合度：官方材料称服务 200,000+ 家企业和政府、1 million 张付费许可证，并覆盖约 50% 的
    Fortune 500；具名部署也显示法律、工业、酒店以及 API 驱动软件渠道已有生产使用。投资判断的约束不在产品真实性，而在私营公司不透明：收入、利润率、留存、集中度、治理和股权结构经济性大多未披露。
