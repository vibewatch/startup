      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人依赖度高。DeepL 仍与 Jaroslaw “Jarek” Kutylowski 紧密绑定；官方页面、媒体报道和访谈都持续把他描述为创始人兼 CEO。到 2026
              年初，公司自有页面展示出明显扩张的高管团队，人员、收入、技术、法律、营销、运营、产品和财务都有专职负责人。2026 年 1 月 Gavin Mee 出任 COO、Detlef Krause 出任 CRO
              尤其重要，因为这说明企业采用扩大时，公司正在把运营层和 GTM 组织专业化。Slator 的报道还指向 2025 年一连串 CPO 和 CFO
              任命，进一步暗示公司在为更正式的企业结构做准备。缺口是治理透明度仍不足。公开材料列出高管，却未披露完整董事名单、董事会观察员、控制权或投资人治理条款。晚期私营公司这样做很常见，但对尽调仍重要，因为这会限制外部判断继任计划、创始人控制，以及新投资人或增长阶段支持者影响战略的程度。
