      - number: '2.2'
        title: 规模测算视角：从机器翻译软件到完整语言服务
        blocks:
          - type: paragraph
            body: >-
              公开规模证据方向利好，但数字不一致，因为每个发布方使用的分母不同。最窄视角是机器翻译市场，Coherent 预计 2026 年约 $710 million。更宽的软件加服务视角，即语言翻译中的 AI，据 The
              Business Research Company，2026 年约为 $3.68 billion。翻译服务发布方随后给出更大的数字：Research and Markets 指向 2026 年约 $28.86
              billion，Mordor 为 $64.99 billion，Coherent 对更广语言或翻译服务的估计为 $86.08 billion。DeepL 自身 2024 年融资材料引用 $67.9 billion
              语言行业视角，并预计 2028 年增至 $95.3 billion，与更广服务估算方向一致。这些估计没有哪个天然错误；它们只是打包了不同层次的软件、服务和用例。估值时，稳妥做法是保留完整区间，并说明 DeepL
              的实际变现路径很可能从 AI 翻译层起步，扩展到企业工作流支出，只与完整语言服务经济部分重叠。公开数据不足以在不引入建模假设的情况下声称精确 SAM 或 SOM。
