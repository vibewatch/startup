      - number: '5.4'
        title: 信任、质量、隐私与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              DeepL 的公开信任姿态是卖点，不是脚注。企业和安全页面中，公司声称覆盖 ISO 27001、SOC 2 Type II、GDPR、HIPAA 和 BSI C5，并把这些徽章与明确运营控制配套，包括
              BYOK、网络限制、通过 OIDC 和 SAML 的 SSO、非 SSO 用户
              MFA、基于角色的权限、审计日志和用量洞察。同样重要的是，产品页面反复称，未经同意不会存储客户文本，也不会将其用于模型训练。但信任故事并非单一维度。同一个 2026 年 Trust Center
              更新一方面扩展基础设施规模，另一方面改变了商业客户的默认数据处理假设：除非购买 Data Residency，否则允许在全球 AWS 区域处理。Voice 还有额外的隐私 / 供应链变数：DeepL
              文档称，部分语言和翻译语音功能使用外部服务伙伴，服务规范更新则在部分情境下点名 Speechmatics 和 ElevenLabs 为子处理方。可靠性证据方向利好——DeepL 宣传业务关键技术支持和
              SLA，文档也具体说明重试、重连和退避——但本次审阅的公开材料仍没有给出风险敏感买方通常会在尽调中索取的可用性历史或硬 SLA 百分比。
