      - number: '7.2'
        title: 运营、质量和可靠性风险
        blocks:
          - type: paragraph
            body: >-
              运营上，DeepL 比消费级翻译应用成熟，但透明度还不及任务关键型企业平台应有的水平。Help Center 确认，DeepL
              会跨多个服务跟踪正常运行、性能下降、部分中断和重大中断状态，并保留可见的事件历史。独立跟踪器随后说明了这为什么重要：公开监测捕捉到 2026 年 4 月 27 日一次重大中断、4 月 29 日一次部分中断、4 月
              22 日日本部署问题，以及 4 月初一个持续多日的使用分析问题。单个事件都不足以打破投资逻辑，但合起来看，它们说明可靠性风险是现实存在的，而同一时期 DeepL 正在扩展 Voice，并把商业工作负载迁到
              AWS。评论证据也削弱了单纯质量上行的叙事。一些用户仍报告性能慢、术语表问题和产品购买摩擦。与此同时，合同本身警告，alpha 或 beta 的 Test Functions 可能含有 bug
              和不准确之处，且可以在不通知、不承担责任的情况下变更。这些措辞很重要，因为 Voice 和 speech-to-translated-text 正是 DeepL 仍在增加新供应商、新路径和新部署模式的产品。
