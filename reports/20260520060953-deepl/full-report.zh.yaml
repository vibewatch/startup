  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Duolingo
        - EV / sales；上市语言软件
        - 2026 年 5 月约 3.78x EV / sales 和约 4.84x PS
        - 最佳上市高端语言软件基准，产品强、消费者认知度高。
        - 消费者 / 教育收入结构、盈利能力和披露质量显著优于 DeepL。
      - - RWS Holdings
        - 市值 / 收入；上市语言与本地化老牌公司
        - ~0.5x 市值 / FY2025 收入
        - 最接近的上市规模化语言服务与本地化参照。
        - 服务属性更重、增长更慢，目前还在转型，盈利能力也更弱。
      - - Appen
        - 市值 / 收入；AI 数据服务警示可比公司
        - ~1.0x 市值 / FY2025 收入
        - 这是集中度、收入组合和 AI 邻近资产倍数压缩的有用警示案例。
        - Appen 不是翻译软件同行，交付经济模型仍然不同。
      - - DeepL 2023 年新股融资轮
        - 估值 / 年化运行率
        - €1B / $1B+ 估值标记下，对应 ~$50M 年化运行率的 ~20x
        - 说明早期投资人愿意为增长和品类前景支付很高溢价。
        - 依据投资人消息源报道，而不是经审计公司文件。
      - - DeepL 2024 年 / 当前公开估值标记
        - 估值 / 收入估计
        - $2.0B 基于 GetLatka 的 $185.2M 2024 年收入估计 = ~10.8x
        - 界定了今天投资人需要承销的价格。
        - 依赖第三方估计和未披露轮次条款，而不是可作为申报依据的财务数据。
    notes: 这组参照是有意筛选的：最佳高溢价语言软件参照、最接近的上市语言服务基准、一个 AI 数据服务警示案例，以及 DeepL 自身最近的私募估值标记。
    enumerationScope:
