        - 席位 / 套餐阶梯
        - 文档翻译、术语表、SSO、翻译记忆库，BYOK 和高级支持位于 Enterprise 档
        - 企业大客户批量折扣和精确 API 经济性
        - 比多数工作流厂商更容易自助采用，但溢价经济性必须顶住云 API
      - - Google Cloud Translation
        - 500k 字符免费；NMT $20/M；文档 $0.08/页；自定义模型另行定价
        - 基于用量的 API 计费
        - 预训练、自定义和自适应翻译；语言覆盖广
        - 大客户折扣和实际企业混合价格
        - 强公开价格锚，压制高端 MT 厂商
