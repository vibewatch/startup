      - number: '2.5'
        title: 对 DeepL 的战略含义与剩余市场缺口
        blocks:
          - type: paragraph
            body: >-
              战略结论是，DeepL 最好的市场框架是受约束的企业语言 AI 平台，而不是整个语言服务行业，也不是狭义纯 MT 层。公司变现规模已经足够重要——第三方收入估计显示，相对于狭义 AI
              翻译层已具备实质渗透——但公开来源仍无法拆出 DeepL 收入中多少来自翻译、写作、语音、API
              使用或企业席位扩张。公开来源也没有显示各垂直行业的准确预算归属、免费使用转付费工作流的转化率，或有多少支出从人工供应商转向其他软件平台。这些不是小遗漏：它们决定故事是广义 TAM 叙事，还是扎实的 SAM/SOM
              投资案例。填补缺口前，最干净的尽调立场是使用多种自上而下市场视角，配合买方流程证据，并避免虚假精确。DeepL 显然处在一个增长品类里，企业拉力很强，但可变现楔子的准确大小仍是部分推断，而非直接观察。
