  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值需要乐观情景证据支撑，建议仍为继续研究
        blocks:
          - type: paragraph
            body: >-
              最新干净的公开价格锚仍是 DeepL 2024 年 5 月融资：以 $2B 估值融资 $300M。单看公司质量，这个估值并不荒唐。DeepL 现在公开声称拥有 200,000 多家企业客户、1 million
              付费许可证、1,000 多名员工，以及一个从翻译延伸到写作、语音和 API
              分发的平台。这些是真实的优质信号。问题在于，价格发现发生在私募市场，而承保这个估值所需的收入、利润率、留存和条款清单事实也仍然是私有信息。当前最好的第三方收入估计是 GetLatka 对 2024 年的
              $185.2M，这让上一轮估值约为收入的
              10.8x。即便考虑此后的增长，相比已披露的公开可比公司，这仍是很高的倍数。建议：继续研究。信心：中。风险评级：高。估值立场：偏高。决策含义：除非尽调证明乐观情景，或价格下探到 $1B 中段，否则不要在接近
              $2B 的价格承保新进投资。
