      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求端有吸引力，因为多条长期驱动相互叠加。Mordor 将增长归因于全球电商、多媒体和流媒体扩张、监管语言可及要求、跨境 SaaS 部署和持续本地化流水线。Worldmetrics
              补充全球化和多语言受众获取；DeepL 有 Forrester 背书的材料则说明买方为何持续花钱：发布周期更快、翻译工作量更低、ROI
              可衡量。但同一批来源也说明采用并非无摩擦。数据隐私和安全是反复出现的限制；领域专精语言学家仍稀缺；够用的免费机器翻译压低可收费价格；幻觉风险在法律、医疗和合规场景中尤其棘手。Crowdin
              的调查量化了这些约束如何在实践中出现：多数团队使用 AI 翻译，但几乎都想要治理、BYO 凭证、词汇表强制执行、人工复核，以及多职能审批。Localize 和 RWS
              都认为，现在的成功取决于编排、路由和内容风险分级，而不是盲目信任单一引擎。这意味着 DeepL 的增长不只取决于模型质量，还取决于它能否比替代方案更快满足企业治理、隐私和工作流要求。
