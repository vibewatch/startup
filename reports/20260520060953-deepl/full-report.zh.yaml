        title: 模块地图、部署入口与工作流集成
        blocks:
          - type: paragraph
            body: >-
              DeepL 的模块地图重要，因为它显示公司正从原始翻译上移到嵌入式工作流软件。Translator、Write Pro 和 Voice 是面向人的体验；API、SDK
              和伙伴连接器则是进入客户系统的交付轨道。公开证据中，Microsoft 部署入口尤其成熟：Word 集成可保留格式并加入写作改进；Teams 支持由 DeepL Voice for Meetings
              产品化；Power Platform 连接器暴露翻译、文档翻译、词汇表管理、用量检查和支持语言发现。Salesforce AppExchange 也显示一条打包 CRM
              部署路径，尽管该列表由伙伴构建，而非第一方。这在战略上重要，因为买方往往不想要独立翻译标签页，而想把语言功能嵌进 Office、会议、支持、CRM 和自动化流程。实际含义是，DeepL 的集成故事在办公 /
              生产力和 API 驱动自动化上很强，但公开证据中，更深的打包式核心系统覆盖仍比 Office 和 Power Platform 表面薄。这让 API 和官方 SDK 在 Microsoft
              生态之外的企业采用中格外重要。
