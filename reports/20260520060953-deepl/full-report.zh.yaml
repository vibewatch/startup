      - number: '7.3'
        title: 合作伙伴和依赖风险
        blocks:
          - type: paragraph
            body: >-
              DeepL 现在的依赖堆栈，比早期「单一翻译引擎」叙事暗示的更分层。公司自己称，商业和企业内容默认可跨 AWS 区域处理，而 Voice for Meetings 依赖 Microsoft 和 AWS
              云服务来托管会议机器人并转发音频。这个架构让会议机器人工作流中的翻译不落在 Microsoft 和 AWS 服务器上，从而降低部分存储风险，但它仍把平台依赖放在外部云和会议生态上。Voice
              进一步提高了依赖集中度。DeepL 的公开服务规格更新把 Speechmatics 和 ElevenLabs 作为 speech-to-translated-text v3 的 DPA
              子处理方加入，称特定语言会经由它们处理，并承认具体语言清单位于 Help Center 材料中，未出现在本次审阅的主要公开记录里。外部合作伙伴披露又扩大了风险：ElevenLabs
              称所有个人数据都会传输到美国存储，而 Speechmatics 维护自己的处理方 / 子处理方堆栈。分发和工作流依赖也同样重要。Microsoft 将 Power Platform 连接器标为 Preview
              并设有节流限制，AppSource 把 Voice 明确放在 Teams 内部，DeepL 自己也把 Zoom 和 Teams
              集成作为核心渠道营销。这意味着合作伙伴政策变化、节流、中断或新增子处理方，可能同时打到客户体验和采购。
