companyProfile:
  summary: >
    DeepL is a Cologne-based Language AI company whose official commercial story starts in 2017 under
    founder-CEO Jaroslaw "Jarek" Kutylowski. The platform now spans translation, document workflows,
    writing assistance, voice products, and developer APIs, with workflow controls such as glossaries,
    style rules, translation memory, and enterprise admin/security features layered on top. Public
    evidence supports real enterprise scale and customer fit: official materials cite 200,000+
    businesses and governments, 1 million paid licenses, and about 50% of the Fortune 500, while named
    deployments show production use across legal, industrial, hospitality, and API-led software
    channels. The underwriting constraint is not product reality but private-company opacity: revenue,
    margins, retention, concentration, governance, and cap-table economics remain largely undisclosed.
  foundedDate: "2017-01-01"
  founders:
    - name: "Jaroslaw \"Jarek\" Kutylowski"
      role: "Founder & CEO"
      background: "Founder-CEO and public strategic face of DeepL as it scales from translation into a broader enterprise Language AI platform."
      claimRefs: [CO001, CO010, CO012]
  foundingLocation: "Cologne, Germany"
  headquarters: "Cologne, Germany"
  productSummary: >
    Enterprise Language AI platform spanning text and document translation, writing assistance,
    real-time voice translation, developer APIs, and workflow-control features including glossaries,
    style rules, translation memory, and enterprise admin/security tooling.
  customerFocus: >
    Enterprises, governments, and workflow-heavy teams in localization, legal, communications,
    operations, and product/developer organizations that need secure multilingual workflows across
    documents, meetings, and embedded software.
  businessModel: >
    Freemium acquisition with monetization through paid seat subscriptions, enterprise plans,
    workflow/security add-ons, and metered API usage across translation, writing, and voice products.
  stage: "Late-stage private"
  fundingStatus: >
    DeepL last disclosed a $300 million financing in May 2024 at a $2 billion valuation; Tracxn
    reports roughly $415 million of cumulative funding across five rounds, with Benchmark, IVP, and
    Index Ventures named on current public company surfaces.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO006, CO009, CO017, CO018, CO023, CO024, CE001, CE017, CU003, CU004, CU038]

