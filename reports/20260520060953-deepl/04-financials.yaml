    claimRefs: [CI002, CI009, CI022, CI026, CI027, CI039, CI041, CI042]

callouts:
  - calloutType: strength
    title: 'Recurring design and billing mechanics support revenue quality'
    body: 'Even without public segment revenue, DeepL’s open pricing and terms show the hallmarks of software-quality revenue: recurring seat subscriptions, metered API expansion, partner distribution riding on core API spend, and annual prepay options that likely improve cash conversion.'
    claimRefs: [CI001, CI002, CI003, CI014, CI016, CI039]

  - calloutType: risk
    title: 'The margin story is visible only as a set of drivers, not as a number'
    body: 'DeepL discloses enough to identify what likely drives gross margin—supercomputing, third-party cloud capacity, document-processing floors, speech-minute billing, and enterprise support—but not enough to underwrite the actual margin path. That is the central financial blocker in the open record.'
    claimRefs: [CI007, CI008, CI022, CI023, CI041]

  - calloutType: recommendation
    title: 'Require a private-company finance package before treating the 2024 round as sufficient proof of durability'
    body: 'The $300M round and broad customer base materially improve the story, but they do not replace the need for audited revenue by SKU, gross margin, NRR, CAC payback, customer concentration, cloud commitments, and a cash/runway bridge. Those are the minimum diligence items before any firm underwriting call.'
    claimRefs: [CI026, CI027, CI038, CI040, CI042]

