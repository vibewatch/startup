  evidenceGaps:
    - type: missing-source
      severity: material
      topic: revenue-mix-split
      missingEvidence: 'Actual revenue split across seats, API usage, voice, add-ons, and any separately billed services.'
      whyItMatters: 'Without product-level mix, investors cannot assess recurring quality, usage volatility, or whether the current monetization base is predominantly high-margin text/API or lower-margin compute-heavy workloads.'
      diligencePath: 'Request monthly recurring revenue and recognized revenue by SKU, geography, and contract term for the last 24 months, plus a management memo explaining revenue-recognition treatment for enterprise bundles and custom API commitments.'
      relatedQuestionRefs: [QI016]
      relatedTableRefs: [TI001, TI002, TI005]

    - type: missing-source
      severity: critical
      topic: gross-margin-and-compute-spend
      missingEvidence: 'Actual gross margin by product line, plus cloud, GPU, inference, and human-review cost detail.'
      whyItMatters: 'DeepL’s margin path is the single hardest open-source underwriting blocker. Infrastructure, voice, and document-processing rules hint at real cost load, but there is no public number connecting those drivers to gross profit.'
      diligencePath: 'Request product-level P&L, gross margin waterfalls, cloud-provider commitments, model-training capex/opex split, and cost-of-revenue detail for text, document, and voice workloads.'
      relatedQuestionRefs: [QI021]
      relatedTableRefs: [TI003, TI005]

    - type: missing-source
      severity: critical
      topic: cash-burn-and-runway
      missingEvidence: 'Current cash balance, monthly burn, committed obligations, and management runway view after the 2024 financing.'
      whyItMatters: 'The $300M round is meaningful, but it is not enough to conclude capital independence without seeing current liquidity, burn, cloud commitments, leases, and any planned hiring ramp.'
      diligencePath: 'Request a monthly cash bridge from the closing of the 2024 round to the present, including debt, leases, committed cloud spend, board-approved budget, and scenario runway analysis.'
      relatedQuestionRefs: [QI022]
      relatedTableRefs: [TI004, TI005]

    - type: missing-source
      severity: material
      topic: sales-efficiency-and-retention
      missingEvidence: 'CAC payback, sales productivity, NRR, GRR, and channel-sourced ARR are not publicly disclosed.'
      whyItMatters: 'A maturing enterprise GTM engine can be value-creative or cost-destructive. Without retention and payback data, the public evidence cannot distinguish between healthy scaled growth and expensive top-line expansion.'
      diligencePath: 'Request cohort NRR/GRR, CAC payback by segment, quota-carrying headcount, ramp productivity, channel-sourced pipeline, and win-rate trends for direct versus partner-assisted sales.'
      relatedQuestionRefs: [QI023]
      relatedTableRefs: [TI003, TI005]

    - type: missing-source
      severity: material
      topic: customer-concentration-and-renewal-quality
      missingEvidence: 'Top-customer concentration, renewal schedule, contract duration, and API-usage concentration are absent from public sources.'
      whyItMatters: 'Broad customer-count headlines can hide a small number of very large enterprise or API accounts. Revenue quality cannot be fully judged without understanding concentration and renewal dependence.'
      diligencePath: 'Request top-20 customers, percent of revenue from the top 1%, 5%, and 10% of accounts, renewal schedules, and volume concentration for the largest API customers.'
      relatedQuestionRefs: [QI025]
      relatedTableRefs: [TI001, TI005]
