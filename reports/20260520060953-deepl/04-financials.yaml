      nodes:
        - id: customer-base
          label: '200k+ business customers'
          detail: 'Official breadth signal; no ACV or concentration disclosure'
          type: input
        - id: paid-license-base
          label: '1M paid licenses'
          detail: 'Shows broad monetized footprint across paid surfaces'
          type: metric
        - id: gtm-coverage
          label: 'Enterprise GTM build-out'
          detail: 'Account teams, onboarding, customer success, CRO/COO scaling motion'
          type: process
        - id: partner-ecosystem
          label: '50 partners / 38 listings'
          detail: 'Channel leverage through marketplace and integration ecosystem'
          type: process
        - id: usage-evidence
          label: '24M-char / 100+ user / 50% time-cut case studies'
          detail: 'Production-scale usage evidence, not audited efficiency metrics'
          type: metric
        - id: missing-ux
          label: 'CAC / NRR / payback undisclosed'
          detail: 'Public signals are strong but full unit-economics underwriting still blocked'
          type: output
    approximationNotes: 'This figure intentionally stops at observable proxies. It does not infer CAC, NRR, or payback values that are not public.'
    claimRefs: [CI014, CI015, CI017, CI018, CI019, CI020, CI021]

