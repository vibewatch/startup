  - id: FI004
    title: Capital intensity / cash-flow map
    type: flow
    layout: wide
    summary: 'The main public cash inflows and outflows shaping DeepL’s current capital profile.'
    data:
      nodes:
        - id: equity-2024
          label: '$300M 2024 equity raise'
          detail: 'Largest confirmed external capital source in the public record'
          type: input
        - id: annual-prepay
          label: 'Annual seat prepayments'
          detail: 'Upfront cash collection and deferred-revenue support on annual plans'
          type: input
        - id: api-billing
          label: 'Metered API cash flow'
          detail: 'Usage billed at period end or periodically in advance depending on consumption'
          type: input
        - id: compute-rd
          label: 'Compute + R&D spend'
