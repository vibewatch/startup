      answer: >-
        Yes. The 933.5% ratio means that essentially all loan growth is funded by wholesale
        debt or equity, not by cheap retail deposits. The deposit franchise cannot meaningfully
        reduce funding costs until the ratio falls below approximately 300–400%, which requires
        a deposit base of USD 200–500M. At the March 2026 launch rate, this is a 2027–2028
        horizon. Funders and investors should model continued wholesale spread risk.
      sourceRefs:
        - SV003
        - SV010

