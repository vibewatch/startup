  - id: TV003
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Probability signal
      - Valuation range
      - Key assumptions
      - Main failure mode
    rows:
      - - Bear
        - 30%
        - USD 1.8B–USD 2.8B
        - Mexico macro downturn; NPL >7–10%; wholesale funding tightens; cost of risk >30%; possible rate-cap legislation; credit card penetration growth stalls; deposit ramp fails.
        - Mexico GDP contraction >1% YoY or a US recession triggering EM capital outflows shuts wholesale debt markets while NPLs spike.
      - - Base
        - 50%
        - USD 3.0B–USD 4.2B
        - Revenue grows to USD 800–950M by end-2026; cost of risk stabilizes at 20–25%; deposits reach USD 150–250M; operating loss narrows; Fitch Positive Outlook maintained; no major credit or regulatory shock; next equity round raised at comparable or modest step-up.
        - Credit cycle turns mildly adverse, limiting revenue growth and increasing provisions without a full crisis; IPO delayed to 2028–2029.
      - - Bull
        - 20%
        - USD 4.5B–USD 6.3B
        - Deposits scale to USD 500M+ by mid-2027; revenue reaches USD 1.1–1.3B by end-2027; cost of risk improves to <20%; Fitch upgrades to BB-; IPO or strategic sale window opens 2027–2028; Colombia and Mexico operations both scaling.
        - Capital markets pivot against EM consumer credit or IPO window closes before Plata reaches profitability.
      - - Probability-weighted central estimate
        - 100%
        - approx. USD 3.3B–USD 4.0B
        - Evidence gap narrows over 12–18 months as deposit ramp and credit quality data accumulate; USD 5B requires overweighting the bull case.
        - Paying USD 5B before deposit ramp and profitability evidence arrives leaves thin buffer for any downside event.
    notes: >-
      Scenario ranges are analyst estimates in USD billions anchored on the Series B priced round,
      sector EV/revenue comps, and Fitch financial data rather than on undisclosed management
      guidance. Probability signals are illustrative signals, not mathematical probabilities.
