  - id: scenario-analysis
    title: "Bull, Base, and Bear Scenarios: Assumptions, Valuation Ranges, and Probability Signals"
    body: |
      Three scenarios frame the investment case, conditioned on the key swing variables: deposit
      franchise ramp, credit loss trajectory, regulatory stability, revenue growth, and external
      equity market access. These scenarios are probability-weighted analyst estimates anchored on
      disclosed valuation marks, financial metrics from the audited 2025 statements and 1Q26 Fitch
      data, and comparable market observations — not forward-looking guidance from management.

      **Bull case (20% probability signal).** The bull scenario requires four simultaneous
      developments: (1) the deposit franchise scales from USD 78 million at 1Q26 to USD 500
      million+ by mid-2027, meaningfully reducing the cost of funds relative to wholesale bonds;
      (2) annualized revenue grows from USD 596 million to USD 1.1–1.3 billion by end-2027 driven
      by customer growth from 3.4 million to 5–6 million and expanded ARPU from personal loans,
      Ahorro products, and eventual payroll/SME products; (3) the cost of risk stabilizes at or
      below 20% as the portfolio matures and the Fitch rating is upgraded to BB- within 18 months,
      unlocking a broader investor base; and (4) capital markets remain open for another equity
      raise in the USD 300–500 million range at a higher valuation. Under the bull case, a 7–9×
      EV/forward-revenue multiple applied to USD 900 million 2026E revenue yields a fair value range
      of USD 4.5–6.3 billion, broadly validating the USD 5 billion management claim and creating
      upside from current entry levels.

      **Base case (50% probability signal).** The base scenario assumes continued strong revenue
      growth (USD 596 million annualized growing to USD 800–950 million by end-2026) but no step-
      change in unit economics: cost of risk remains elevated at 20–25%, operating losses narrow but
      breakeven is not achieved until 2027–2028 at earliest, and deposit growth is slower than the
      bull case (USD 150–250 million by end-2026). The Fitch Positive Outlook is maintained but not
      upgraded in the next 12 months. Under the base case, an appropriate EV/revenue multiple of
      5–6× applied to the USD 850 million midpoint of 2026E revenue yields a fair value of
      USD 4.25–5.1 billion — which means the Series B priced round is fairly valued in hindsight
      at the current trajectory, while the USD 5 billion management claim is at the upper end of
      the defensible base-case range but not obviously mispriced. The base case is the most
      important scenario for entry discipline: it tells the investor that paying USD 3.1 billion
      in the Series B was fair, while a new investor paying USD 5 billion today is buying at the
      top of the base-case range with limited margin of safety.

      **Bear case (30% probability signal).** The bear scenario reflects a combination of credit
      cycle deterioration and funding market tightening. If Mexico's economy slows materially —
      consistent with IMF's downside scenario for Mexico's trade-dependent economy under heightened
      tariff risk — NPL ratios could rise from 4.8% to 8–10% within two to three quarters. At a
      30% cost of risk, loan-loss provisions would absorb the entirety of gross NII, and the
      operating loss would widen rather than narrow. Simultaneously, if credit markets tighten
      (e.g., driven by a US recession or EM capital flight), wholesale bond refinancing at
      acceptable spreads could become impossible, forcing a highly dilutive equity raise at a
      significantly lower valuation or, in extreme scenarios, constraining portfolio growth below
      the break-even velocity needed to cover fixed costs. Klar's pending banking license, if
      approved, would also eliminate Plata's primary regulatory moat sooner than expected.
      Under the bear case, an EV/revenue multiple of 3–4× applied to a lower USD 600–700 million
      2026E revenue (reflecting slower growth due to tighter credit standards) yields a fair
      value of USD 1.8–2.8 billion — a down-round scenario relative to the Series B. The bear
      case also considers CONDUSEF credit-card rate-cap legislative risk, which, if implemented,
      would directly compress the 99.9% nominal annual rate that funds current economics.

      **Probability-weighted central estimate.** Weighting the three scenarios by their probability
      signals yields a probability-weighted fair value of approximately USD 3.3–4.0 billion
      (20% × USD 5.4B midpoint + 50% × USD 4.7B midpoint + 30% × USD 2.3B midpoint ≈ USD 3.8B).
      This is comfortably above the Series B anchor but below the USD 5 billion management claim,
      suggesting that Series B investors have a reasonable expected return at the base trajectory,
      while new investors paying USD 5 billion are relying predominantly on the bull scenario.
