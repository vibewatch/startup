      question: >-
        Is there evidence that Nubank Mexico's IPAB-equivalent deposit protection is different
        from Plata's, and does this affect the competitive valuation of Plata's banking license?
      type: comparison
      status: answered
      targets:
        - contentRequirements/4
      answer: >-
        Nubank Mexico operates as a Sociedad Financiera Popular (SFP), not as an Institución de
        Banca Múltiple. SFP deposit protection is capped at 25,000 UDIs (~USD 9,500), vs. Plata's
        IPAB 400,000 UDIs (~USD 152,000). Nubank's banking license application was authorized by
        CNBV (Bloomberg), but full deposit-taking under the higher IPAB limit may still require
        transition from SFP to bank status. This reinforces Plata's near-term regulatory moat.
      sourceRefs:
        - SV010
        - SV019
        - SV015

