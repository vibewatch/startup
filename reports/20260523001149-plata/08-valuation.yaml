  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Status / date
      - Valuation or multiple anchor
      - Relevance to Plata
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation references for Plata as of
        the 2026-05-23 run date, combining Plata's own priced round anchors, public LatAm digital
        bank comparables, private Mexican fintech rounds, and global consumer credit challenger
        analogues. Not all listed digital banks worldwide are included.
    rows:
      - - Plata Series A
        - Private round, March 2025
        - USD 160M raised at USD 1.5B post-money valuation; led by Kora Management
        - Establishes the first hard valuation anchor 12 months before the run date; 2× step-up to Series B is rapid even for high-growth fintech.
        - Predates full banking license and deposit-taking capability; revenue base was significantly smaller.
      - - Plata Series B
        - Private round, October 2025 — last hard anchor
        - USD 250M raised at USD 3.1B post-money valuation; led by Kora, with Moore Strategic Ventures and TelevisaUnivision
        - The cleanest hard public anchor; the starting point for any entry analysis. Implies ~5.2× LTM EV/revenue at 1Q26 run rate.
        - 7 months old; revenue has grown materially since; but no new priced event has confirmed the USD 5B management claim.
      - - Plata self-described valuation
        - Unverified management communication, May 2026
        - USD 5B described on platacard.mx/en/about and in press materials
        - Defines the current entry ask and investor expectations for any secondary transaction.
        - Not confirmed by a priced round, secondary transaction, or independent mark. Implies 8.4× EV/run-rate revenue — expensive for a pre-profitability bank.
      - - "Nubank (NYSE: NU)"
        - "Public, NYSE-listed; May 2026 market cap"
        - "~USD 15–17B market cap; ~1.5–1.7x LTM EV/revenue on ~USD 10B+ LatAm-wide revenue; profitable since 2023"
        - Best LatAm public digital bank comp; credit card-led model and unbanked population thesis are directly analogous.
        - Operates at 3× Plata's Mexico customers, is profitable, and has full public disclosure — all of which justify a lower multiple than Plata's pre-profitability stage.
      - - Klar
        - Private; USD 800M valuation from 2025 Series D
        - USD 190M raised at USD 800M+ valuation; ~USD 300M annualized revenue; implies ~2.7× EV/revenue; SOFIPO licensed
        - Direct Mexico market competitor; same target segment; closest stage analogue in the private market.
        - SOFIPO license lacks IPAB insurance parity; 2.3M fewer customers than Plata; product breadth is greater (SME) but revenue scale is ~50% of Plata.
      - - Stori
        - Private; described as "unicorn" — exact valuation not publicly disclosed; SOFIPO licensed; raised USD 150M in a recent round
        - Unicorn status implies USD 1B+ valuation; product set focused on no-bureau credit card and savings.
        - Direct Mexico competitor for thin-file consumer credit.
        - Exact valuation not publicly verified; SOFIPO license limits deposit protection to 25,000 UDIs vs. Plata's 400,000 UDIs.
      - - Ualá (Mexico)
        - Licensed bank (CNBV Institución de Banca Múltiple); private; no disclosed 2025 Mexico-specific valuation
        - Full banking license, same regulatory standing as Plata; expansion from Argentina.
        - Regulatory parity and target segment overlap make this a relevant moat comparison.
        - Mexico-specific metrics not disclosed; Argentine parent-company financials and Latin America-wide operations make direct comparison difficult.
    notes: >-
      Multiple anchors are computed against Plata's USD 596M annualized run-rate revenue
      (1Q26 IR homepage data). Public comp multiples reflect approximately May 2026 market
      conditions. Private comp multiples are estimates based on disclosed round sizes and
      publicly reported revenue figures.
