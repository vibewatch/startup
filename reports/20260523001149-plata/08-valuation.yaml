tables:
  - id: TV001
    title: Recommendation Summary Table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Track / monitor — constructive but price-sensitive
        - Do not treat the unverified USD 5B management claim as a buy signal. Series B at USD 3.1B was fairly priced; new entry above USD 4.2B requires visible profitability progress.
      - - Valuation stance
        - Stretched at USD 5B; fair at USD 3.1–4.2B range
        - Margin of safety at USD 5B is thin. Entry closer to the Series B anchor or below is more defensible on a public-comparable basis.
      - - Confidence
        - Medium
        - Growth trajectory is clear; profitability timeline, cap-table structure, and deposit ramp are not.
      - - Risk rating
        - High
        - Pre-profitability status, speculative-grade Fitch B+ rating, 23.9% cost of risk, 933.5% loans-to-deposits ratio, and funding structure concentration.
      - - Key valuation anchor
        - Series B USD 3.1B (Oct 2025) — last hard priced event
        - Best public mark available; USD 5B description is unverified management communication.
      - - Entry discipline
        - Prefer entry at or below USD 4.2B (7× LTM run-rate revenue)
        - Waiting for verifiable deposit ramp or narrowing loss trend is more rational than paying for USD 5B before evidence arrives.
      - - Upgrade trigger
        - Deposits reach USD 300M+, cost of risk falls to <20%, or next priced equity round confirms step-up
        - Would tighten the bull case and make USD 5B–6B defensible on forward multiples.
      - - Primary downside trigger
        - NPL ratio >7%, wholesale debt refinancing disrupted, or Mexico macro downturn materializes
        - Could compress fair value to USD 1.8–2.5B down-round range.
    notes: >-
      Assessment is price-sensitive rather than a generic company-quality judgment. "Fair" refers
      to supportability from priced rounds and public-comparable evidence, not intrinsic certainty.
