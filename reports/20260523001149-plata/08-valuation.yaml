  claims:
    - id: CV001
      statement: >-
        Banco Plata completed a USD 250 million Series B equity raise in October 2025 at a
        post-money valuation of USD 3.1 billion, led by Kora Management with participation from
        Moore Strategic Ventures and TelevisaUnivision. This is the last publicly confirmed hard
        valuation anchor as of the May 2026 run date.
      type: observed
      topic: valuation
      sourceRefs:
        - SV011
        - SV012
        - SV013
        - SV014
        - SV005
      confidence: high
      freshness: current

    - id: CV002
      statement: >-
        As of May 2026, the Banco Plata About page (platacard.mx/en/about) and management
        press materials describe a USD 5 billion valuation. No priced equity round, secondary
        transaction, or independent third-party mark confirming this step-up from USD 3.1 billion
        has been identified in public sources.
      type: conflicting
      topic: valuation
      sourceRefs:
        - SV008
        - SV011
      confidence: medium
      freshness: current
      contradictsClaimRefs:
        - CV001
      adverseSignal: true

    - id: CV003
      statement: >-
        Banco Plata completed a USD 160 million Series A in March 2025 at a USD 1.5 billion
        valuation, led by Kora Management with participation from Moore Strategic Ventures and
        other US and European investors — establishing the first hard valuation anchor approximately
        12 months before the run date.
      type: observed
      topic: valuation
      sourceRefs:
        - SV012
        - SV013
        - SV001
      confidence: high
      freshness: current

    - id: CV004
      statement: >-
        As of 1Q26, Banco Plata reported 3.4 million total active customers, a USD 746 million
        gross portfolio, and an annualized revenue figure of USD 596 million per the IR homepage.
        These are the primary quantitative inputs for any EV/revenue valuation multiple calculation.
      type: observed
      topic: valuation
      sourceRefs:
        - SV005
        - SV001
      confidence: high
      freshness: current

    - id: CV005
      statement: >-
        At the Series B post-money valuation of USD 3.1 billion and the 1Q26 annualized revenue
        run rate of USD 596 million, the implied EV/revenue multiple is approximately 5.2×. At the
        management-described USD 5 billion valuation, the implied EV/revenue multiple is approximately
        8.4× — expensive territory for a pre-profitability consumer credit bank.
      type: inferred
      topic: valuation
      sourceRefs:
        - SV001
        - SV005
        - SV011
      confidence: medium
      freshness: current

    - id: CV006
      statement: >-
        Fitch reports that Plata's total operating income (TOI) increased 1.9× year-over-year
        in local currency to USD 112 million in 1Q26 (annualized: USD 448 million), and full-year
        2025 TOI was USD 276 million. The earnings release reports annualized revenue of USD 596
        million as of 1Q26, reflecting all revenue streams including commissions.
      type: observed
      topic: financials
      sourceRefs:
        - SV003
        - SV005
        - SV001
      confidence: high
      freshness: current

    - id: CV007
      statement: >-
        Fitch estimates Plata's operating loss to average assets at –16.5% at 1Q26, improved from
        –28.1% in 2025 — confirming a trajectory toward breakeven but indicating a significant
        remaining gap to profitability. The bank is not expected to be profitable in 2026.
      type: observed
      topic: financials
      sourceRefs:
        - SV003
        - SV001
      confidence: high
      freshness: current
      adverseSignal: true

    - id: CV008
      statement: >-
        Banco Plata's cap table, beneficial ownership structure, and preference stack (liquidation
        preferences, anti-dilution terms, participating/non-participating features) are not publicly
        disclosed. The corporate structure places the bank as a 99.99% subsidiary of Different
        Technologies LLC, a US-registered holding entity whose ultimate beneficial owners are not
        publicly identified.
      type: observed
      topic: governance
      sourceRefs:
        - SV002
        - SV008
      confidence: high
      freshness: current
      adverseSignal: true

    - id: CV009
      statement: >-
        Fitch reports cumulative equity injected into Banco Plata exceeds USD 500 million as of
        1Q26. The IR homepage states over USD 2 billion in combined debt and equity raised
        cumulatively, reflecting the large wholesale debt layer on top of equity.
      type: observed
      topic: financing
      sourceRefs:
        - SV003
        - SV005
      confidence: high
      freshness: current

    - id: CV010
      statement: >-
        At 1Q26, Banco Plata's loans-to-deposits ratio stands at 933.5%, reflecting USD 78 million
        in deposits against USD 746 million in gross loans. The deposit franchise launched mid-March
        2026; meaningful contribution to funding cost reduction is a 2027+ story at current ramp rates.
      type: observed
      topic: financing
      sourceRefs:
        - SV003
        - SV010
      confidence: high
      freshness: current
      adverseSignal: true

    - id: CV011
      statement: >-
        Wholesale debt (bonds and bank loans) totaled MXN 11,698 million (~USD 585 million) at
        end-2025, representing 48.8% of total funding, up from zero wholesale market debt at
        end-2023. This creates net-debt overhang that must be subtracted from enterprise value
        when computing equity fair value.
      type: observed
      topic: financing
      sourceRefs:
        - SV002
        - SV003
      confidence: high
      freshness: current

    - id: CV012
      statement: >-
        Cash and near-cash equivalents were MXN 4,790 million (~USD 240 million) at end-2025 per
        the audited financial statements. A rough EV-to-equity bridge subtracting USD 585 million
        wholesale debt and adding USD 240 million cash implies equity fair value at the Series B
        was approximately USD 2.75 billion vs. the USD 3.1 billion enterprise value.
      type: inferred
      topic: valuation
      sourceRefs:
        - SV002
        - SV001
      confidence: medium
      freshness: current

    - id: CV013
      statement: >-
        Fitch Ratings published a 'B+' Long-Term Issuer Default Rating (IDR) with a Positive
        Outlook for Banco Plata on May 6, 2026 — the first external credit rating for the entity.
        The Viability Rating (VR) is 'b+'. The Positive Outlook reflects strengthening trends in
        earnings and profitability, capitalization, and funding/liquidity that could support a
        rating upgrade within two years if sustained.
      type: observed
      topic: creditquality
      sourceRefs:
        - SV003
        - SV006
      confidence: high
      freshness: current

    - id: CV014
      statement: >-
        Fitch assigns Banco Plata a 'bb-' business profile assessment — above the implied category —
        reflecting its growing scale and expanding customer base, despite limited operating history.
        The assessment notes business diversification and market positioning that remain modest
        relative to higher-rated banks on the international scale.
      type: observed
      topic: creditquality
      sourceRefs:
        - SV003
        - SV001
      confidence: high
      freshness: current

    - id: CV015
      statement: >-
        Nubank (NYSE: NU), the most comparable public LatAm digital bank, had a market
        capitalization of approximately USD 15–17 billion as of May 2026. On a USD 10+ billion
        LTM revenue base (LatAm-wide), this implies an EV/revenue multiple of approximately
        1.5–1.7×. Nubank Mexico alone had 10 million customers as of April 2025 — nearly 3×
        Plata's total active customer count.
      type: observed
      topic: comparables
      sourceRefs:
        - SV019
        - SV021
      confidence: medium
      freshness: current

    - id: CV016
      statement: >-
        Nubank Mexico reported 10+ million customers as of April 2025 per Bloomberg, growing
        rapidly in its second-largest global market. Nubank announced plans to invest USD 4.2
        billion in Mexico through 2030, indicating its strategic priority for the market Plata
        currently leads by banking license timing.
      type: observed
      topic: competitors
      sourceRefs:
        - SV019
        - SV021
      confidence: high
      freshness: current

    - id: CV017
      statement: >-
        Banco Plata's full CNBV Institución de Banca Múltiple license — received February 17,
        2026, with operations commencing March 19, 2026 — confers IPAB deposit insurance
        coverage up to 400,000 UDIs per depositor, versus the 25,000 UDI limit for SOFIPO
        competitors such as Klar and Stori. This represents a meaningful regulatory moat while
        Klar's banking license application remains pending.
      type: observed
      topic: moat
      sourceRefs:
        - SV010
        - SV015
        - SV016
        - SV017
      confidence: high
      freshness: current

    - id: CV018
      statement: >-
        Klar (SOFIPO-licensed) raised a USD 190 million Series D in 2025 at a valuation above
        USD 800 million, with annualized revenues approaching USD 300 million per its Sala de
        Prensa disclosure. This implies approximately 2.7× EV/revenue for Klar — below Plata's
        Series B implied multiple of 5.2×, reflecting Plata's banking license premium, larger
        revenue scale, and faster growth rate.
      type: observed
      topic: comparables
      sourceRefs:
        - SV020
      confidence: medium
      freshness: current

    - id: CV019
      statement: >-
        Klar's press room discloses a service cost per user of USD 0.75 (~10% of traditional banks)
        and revenue per active user exceeding USD 11, reporting 7 million total users in 2025.
        Klar filed for a full banking license via acquisition of Banorte's digital unit Bineo;
        if approved, Klar would eliminate Plata's primary IPAB regulatory moat.
      type: observed
      topic: competitors
      sourceRefs:
        - SV020
        - SV014
      confidence: medium
      freshness: current

    - id: CV020
      statement: >-
        Stori — a Mexican fintech targeting thin-file consumers with a no-bureau credit card
        and up to 15% savings yields — is described as a unicorn, implying a valuation above
        USD 1 billion. Stori raised approximately USD 150 million in a round to expand in Mexico
        and Colombia. Exact current valuation is not publicly verified.
      type: observed
      topic: comparables
      sourceRefs:
        - SV029
      confidence: medium
      freshness: current

    - id: CV021
      statement: >-
        Applying the range of EV/revenue multiples from the comparable set to Plata's USD 596
        million annualized 1Q26 run-rate revenue produces the following enterprise value anchors:
        3× = USD 1.8B; 5× = USD 3.0B; 7× = USD 4.2B; 9× = USD 5.4B. The Series B at USD 3.1B
        corresponds to approximately 5.2× and is the most defensible independent entry reference.
      type: inferred
      topic: valuation
      sourceRefs:
        - SV001
        - SV005
        - SV011
      confidence: medium
      freshness: current

    - id: CV022
      statement: >-
        Ualá, a licensed CNBV Institución de Banca Múltiple operating in Mexico (expansion from
        Argentina), offers deposit insurance at 400,000 UDIs — the same level as Banco Plata —
        but has disclosed fewer Mexico-specific operating metrics publicly. Its full banking status
        makes it a direct regulatory peer but not a pricing anchor due to limited comparables.
      type: observed
      topic: competitors
      sourceRefs:
        - SV022
      confidence: medium
      freshness: current

    - id: CV023
      statement: >-
        Retail Banker International confirms that Plata's banking license places it ahead of
        Mercado Pago (still in regulatory review for a banking license) and alongside Revolut
        (which received full banking authorization and started operations in Mexico in a beta
        phase) — reflecting Plata's first-mover advantage among digital challengers in Mexico
        from a regulatory standpoint.
      type: observed
      topic: moat
      sourceRefs:
        - SV015
        - SV008
      confidence: high
      freshness: current

    - id: CV024
      statement: >-
        Fitch's capitalization metrics for Plata at 1Q26: Fitch Core Capital/RWA at 12.2%,
        tangible equity/assets at 11.8%, and total capitalization ratio at 18.0%. These are
        described as relative strengths that compare favorably with some domestic peers, though
        pressure is building from aggressive loan growth.
      type: observed
      topic: financials
      sourceRefs:
        - SV003
        - SV001
      confidence: high
      freshness: current

    - id: CV025
      statement: >-
        Fitch describes Plata's funding structure as flexible, noting a long weighted-average
        debt maturity profile and USD 78 million in initial deposits at 1Q26 (launched mid-March
        2026). However, the loans-to-deposits ratio of 933.5% means the bank is overwhelmingly
        wholesale-funded and deposit-taking does not yet materially improve funding costs.
      type: observed
      topic: financing
      sourceRefs:
        - SV003
        - SV001
      confidence: high
      freshness: current

    - id: CV026
      statement: >-
        Fitch reports Plata's cost of risk at 23.9% at 1Q26 and Stage 3 NPL ratio at 4.8% — up
        from 3.4% at end-2024. The 2025 loan loss provision was MXN 2,245 million (+228% YoY),
        consuming approximately 54% of gross NII. These credit metrics are elevated relative to
        Mexico's traditional consumer credit universe but within the range for high-yield revolving
        EM consumer credit card lenders.
      type: observed
      topic: creditquality
      sourceRefs:
        - SV003
        - SV001
      confidence: high
      freshness: current
      adverseSignal: true

    - id: CV027
      statement: >-
        CONDUSEF maintains oversight of all consumer-credit complaints against Banco Plata and
        publishes quarterly reclamation statistics for the multiple-banking sector. An escalating
        complaint index — visible in CONDUSEF's public statistics portal — would be an early
        warning signal of compliance failure or product-design issues that could impair growth
        and trigger regulatory scrutiny from the CNBV.
      type: inferred
      topic: regulatory
      sourceRefs:
        - SV026
      confidence: medium
      freshness: current

    - id: CV028
      statement: >-
        The bull scenario (20% probability signal) requires: deposits scaling from USD 78M (1Q26)
        to USD 500M+ by mid-2027; revenue growing to USD 1.1–1.3B by end-2027; cost of risk
        falling below 20%; and a Fitch upgrade to BB- within 18 months enabling access to a
        broader institutional investor base. Under this scenario, a 7–9× EV/revenue multiple on
        USD 900M revenue yields a fair value range of USD 4.5–6.3 billion.
      type: inferred
      topic: scenario
      sourceRefs:
        - SV003
        - SV005
      confidence: low
      freshness: current

    - id: CV029
      statement: >-
        The base scenario (50% probability signal) assumes revenue reaches USD 800–950 million
        by end-2026, cost of risk remains 20–25%, deposits grow to USD 150–250 million, and
        the Fitch Positive Outlook is maintained but not upgraded. Applying 5–6× EV/revenue
        on USD 850M midpoint revenue yields a fair value of USD 4.25–5.1 billion, placing the
        Series B as fairly priced and the USD 5B management claim at the top of the defensible
        base range.
      type: inferred
      topic: scenario
      sourceRefs:
        - SV003
        - SV001
      confidence: medium
      freshness: current

    - id: CV030
      statement: >-
        The bear scenario (30% probability signal) assumes Mexico's GDP contracts materially,
        NPL ratio rises to 8–10% within two to three quarters, wholesale funding markets tighten,
        and revenue growth slows to USD 600–700 million (2026E). Applying 3–4× EV/revenue yields
        a fair value of USD 1.8–2.8 billion — a down-round scenario relative to the Series B.
      type: inferred
      topic: scenario
      sourceRefs:
        - SV003
        - SV027
      confidence: medium
      freshness: current
      adverseSignal: true

    - id: CV031
      statement: >-
        Probability-weighting the three scenarios (20% bull × USD 5.4B midpoint + 50% base ×
        USD 4.7B midpoint + 30% bear × USD 2.3B midpoint) yields a probability-weighted central
        estimate of approximately USD 3.8 billion — comfortably above the Series B but below the
        USD 5 billion management claim.
      type: inferred
      topic: valuation
      sourceRefs:
        - SV001
        - SV005
      confidence: medium
