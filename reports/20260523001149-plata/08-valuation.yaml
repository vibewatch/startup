  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - NPL ratio spike
        - Stage 3 (NPL) ratio exceeds 7% for two consecutive quarters
        - Provision cost overwhelms NII; operating loss widens; capitalization erodes faster than equity raises can repair; fair value compresses to USD 1.8–2.5B bear case range.
        - Suspend new capital commitments; review existing position for impairment.
      - - Wholesale funding disruption
        - Inability to refinance maturing bonds at a spread <500bps, or withdrawal of interbank credit lines
        - Liquidity cliff forces portfolio growth freeze or emergency equity raise at severe dilution; down-round risk becomes acute.
        - Immediate diligence on debt maturity schedule and covenants; potential force-sale scenario.
      - - CONDUSEF / legislative rate cap
        - Congressional or executive action capping credit card rates at or below 60–70% APR (Chile/Colombia precedent)
        - Directly compresses the 99.9% nominal annual rate; unit economics of the revolving book become negative; must pivot to fees and transaction revenue without time to rebuild.
        - Conduct scenario analysis on revenue impact at various cap thresholds; downgrade to bear case immediately.
      - - Klar banking license approval
        - CNBV approves Klar's banking license via Bineo acquisition
        - Eliminates Plata's primary regulatory moat (IPAB 400,000 UDI advantage); competitive pressure intensifies from the largest SOFIPO by approximate customer count.
        - Reassess banking license premium in comparable set; reduce multiple accordingly.
      - - Failed deposit ramp
        - Deposits remain below USD 150M at end-2026 (more than 9 months after launch)
        - Funding cost advantage thesis does not materialize; wholesale debt dependency continues indefinitely; down-round risk at next equity raise.
        - Reduce probability weight on bull case; shift central estimate closer to base/bear boundary.
      - - Key person departure
        - CEO Neri Tollardo departure or CNBV enforcement action against named senior management
        - Governance opacity amplifies key-person risk; institutional investors may freeze until succession is confirmed.
        - Immediate governance diligence; suspension of buy recommendation pending clarity.
    notes: >-
      Thesis-break triggers are tied to monitorable events from public disclosures, Fitch
      quarterly data, CONDUSEF reporting, CNBV supervisory communications, and regulatory newsflow.
    claimRefs:
      - CV026
      - CV027
      - CV033
      - CV034
      - CV035
      - CV036
      - CV040
      - CV041
      - CV042

  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and preference stack
        - Full cap table with investor names, share classes, liquidation preferences, anti-dilution terms, and pro-rata rights for Series A and B investors
        - Cannot model true equity value, dilution waterfall, or downside scenarios without preference mechanics; residual common equity in a down-round could be zero.
        - Require from management as a condition of any new investment; review Estatutos Sociales for incorporated share class terms.
      - - Realized NIM after credit losses
        - Portfolio-level net interest margin after provision and charge-offs (private)
        - Revenue quality claim at USD 596M run rate cannot be verified; NIM after provisions may be negative at the portfolio level, overstating equity value.
        - Require audited NIM bridge from management or review internal MIS reports under NDA.
      - - Customer-level CAC and LTV
        - Actual customer acquisition cost per cohort and lifetime value by vintage
        - Payback period and CAC/LTV ratio determine whether the revenue model is self-sustaining; undisclosed CAC leaves unit economics unverifiable.
        - Management presentation; cohort vintage analysis under NDA.
      - - Deposit cost curve and ramp trajectory
        - Actual Ahorro Flexible/Fijo rate costs, deposit attrition, customer segmentation, and projected ramp to USD 500M+
        - Core of the bull thesis is deposit-driven funding cost reduction; cannot value this without trajectory data.
        - Require 3-month deposit account data (since March 2026 launch) and management forecast.
      - - Transactor/revolver mix
        - Share of credit card accounts paying in full vs. revolving balances, and trend over time
        - Revolvers generate 99.9% APR interest income; transactors generate only interchange; true yield depends on this mix.
        - Require management disclosure or estimation from internal data under NDA.
      - - Debt maturity schedule and covenants
        - Full debt maturity schedule, covenant terms, and cross-default provisions for all bonds and bank facilities
        - Refinancing cliff or covenant trigger could force emergency equity raise at any time; critical for liquidity risk assessment.
        - Legal review of Prospecto de Colocación for each outstanding Certificado Bursátil; require from management for bank facilities.
      - - Board composition and governance
        - Names of independent directors, board committee structures, audit/risk committee reports
        - Fitch explicitly flagged governance opacity; concentrated key-person risk in CEO Tollardo without independent director oversight is a regulatory and ESG concern.
        - Request from management; review CNBV Disposiciones Generales compliance disclosure.
      - - "Fitch Viability Rating methodology inputs"
        - "Full Fitch VR model inputs covering asset quality, earnings, capitalization, funding, and management sub-scores"
        - B+/Positive trajectory depends on specific metric thresholds; knowing exactly what triggers a BB- upgrade helps size the growth catalyst.
        - Review Fitch detailed rating report supplementary materials; request Fitch analyst call.
    notes: >-
      Diligence asks are ordered by decision-criticality. Items 1 (cap table) and 2 (realized NIM)
      are absolute prerequisites before any new investment decision. Items 3–8 are essential for
      underwriting but can be addressed in a phased data-room process.
    claimRefs:
      - CV008
