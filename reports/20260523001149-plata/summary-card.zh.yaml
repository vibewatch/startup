summary:
  headline: >-
    Banco Plata 不到三年做到 3.4 million 客户和 USD 596 million 年化收入，增长极强，验证了模式；但 23.9% 风险成本、尚未盈利、批发融资集中，以及要求持续兑现的 USD 3.1
    billion 估值，使其在盈利路径和存款资金更清晰前只能观察。
  overallScore: 6.8
  recommendation: track
  confidence: medium
  riskRating: high
