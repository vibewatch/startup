companyProfile:
  summary: >
    Banco Plata S.A., Institución de Banca Múltiple — operating under the consumer brand "Plata" via
    platacard.mx — is Mexico's fastest-growing digital bank by customer count. Legally constituted on
    24 May 2021 as Tecnologías Diffiere S.A.P.I. de C.V. and converted to a full CNBV banking license
    on 17 February 2026, the company publicly launched its Plata Crédito Mastercard credit card in
    April 2023. By 1Q 2026 Plata had grown to 3.4 million active customers, a USD 746 million gross
    loan portfolio, and USD 596 million in annualized revenue — achieved in under three years of
    commercial operations. The October 2025 Series B (USD 250 million, USD 3.1 billion post-money
    valuation led by Kora Management) was the most recent priced equity round; an About-page claim
    of USD 5 billion as of May 2026 is noted but has not been independently verified. The company's
    parent holding entity is Different Technologies LLC (US), with co-founders Neri Tollardo (CEO),
    Danil Anisimov, and Alexander Bro — all former Tinkoff Bank executives. Fitch Ratings assigned
    Banco Plata a B+ Long-Term IDR with Positive Outlook in May 2026, reflecting strong growth
    trajectory offset by pre-profitability, high cost of risk, and governance opacity. The user-provided
    domain plata.com.mx was not confirmed as an active Plata property; verified operating domains are
    platacard.mx and bancoplata.mx.
  foundedDate: "2021-05-24"
