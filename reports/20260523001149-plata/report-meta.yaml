  productSummary: >
    Plata's core product is the Plata Crédito Mastercard revolving credit card (99.9% APR on balances),
    complemented by Plata Cuenta (zero-fee debit account), Ahorro Fijo/Flexible (fixed and flexible
    savings products at 7.00–7.25% gross), personal loans (introduced 2024), a CNBV-registered investment
    product via VestFi, and a nascent SME banking offering. All products are delivered exclusively through
    a proprietary mobile app (iOS and Android) rated 4.8/5 across 636K+ reviews. Same-day card delivery
    via a proprietary ambassador network is a key differentiation. The deposit franchise launched in
    mid-March 2026 and held USD 78 million in deposits at 1Q26.
  customerFocus: >
    Mobile-first Mexican consumers aged 18–45, targeting the under-banked and thin-file segment with
    limited formal credit history. Plata operates exclusively in the B2C consumer vertical; SME banking
    is nascent.
  businessModel: >
    Net interest income from revolving credit card balances (at 99.9% APR) and personal loans, supplemented
    by interchange fees, Plata Plus subscription revenue (1% of credit limit/month), and fee income.
    Funded primarily through wholesale debt (bonds and bank loans, MXN 11,698M at end-2025) and, since
    March 2026, a nascent retail deposit franchise.
  stage: "Series B / Licensed bank (CNBV Institución de Banca Múltiple, Feb 2026)"
  fundingStatus: >
    USD 250 million Series B in October 2025 at USD 3.1 billion post-money valuation, led by Kora
    Management, with participation from TelevisaUnivision, Moore Strategic Ventures, Audeo Ventures, and
    Hedosophia. Prior Series A: USD 160 million at USD 1.5 billion (March 2025). Total capital raised
    (equity + debt) exceeded USD 2 billion as of 1Q26 per company IR; Fitch reports cumulative equity
    injected exceeds USD 500 million at 1Q26.
