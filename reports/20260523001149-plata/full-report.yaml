      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Revenue accounting discrepancy: MX FRS vs. earnings release'
            body: >
              Plata's FY2025 reported interest income differs materially between the independently audited MX FRS
              financial statements (MXN 2,895M) and the 4Q2025 earnings release (MXN 5,999M). The difference is not
              fraud—it reflects pre-bank SAPI accounting where revolving credit charges (GAT components beyond simple
              interest) were classified as commissions under certain NIF rules, then re-presented as interest in the
              earnings release format. Total revenue is more consistent (MXN 6,606M audited vs. MXN 7,118M earnings
              release). Investors should request a reconciliation note.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
          - type: callout
            title: 'Capital injection dependency: equity is the business model'
            body: >
              Plata's MXN 10,244M share capital represents the entire funding base above liabilities. Retained losses of
              MXN 5,117M have consumed half of all injected equity. The bank needs continued shareholder support in 2026
              (Fitch explicitly forecasts this) to maintain capital ratios while growing. Any delay in profitability or
              interruption of investor support would rapidly erode the 12.2% FCC/RWA buffer. This structural dependency
              is the single largest financial risk.
            calloutType: risk
            claimRefs:
              - CI020
              - CI021
              - CI022
              - CI028
          - type: callout
            title: 'Positive trajectory: narrowing losses at scale'
            body: >
              Despite near-tripling total assets in 2025, Plata's net loss narrowed from MXN 2,150M to MXN 1,978M. NII
              after provisions turned positive (MXN 1,875M). Operating loss/assets improved from -70.8% (2024) to -28.1%
              (2025) to -16.5% (1Q26). This is the operating leverage that Fitch's Positive Outlook is predicated on. If
              1Q26 trajectory holds, breakeven on a net operating basis (before OpEx) could be achievable in 2026.
            calloutType: insight
            claimRefs:
              - CI014
              - CI015
