      - number: '6.3'
        title: Named Customer Proof and App Store Evidence
        blocks:
          - type: paragraph
            body: |
              Banco Plata's customer-facing evidence is anchored in app store performance metrics
              rather than named enterprise case studies, which is consistent with its consumer-
              direct business model. As of May 2026, the Banco Plata app carries a 4.8/5 rating on
              Google Play with 349K reviews and 5M+ downloads, and a 4.8 de 5 rating on the Mexican
              Apple App Store with 287K reviews. Both stores show an identical 4.8 score from a
              combined 636K independent user ratings — a strong signal of product satisfaction at
              scale, particularly given that the user base has grown faster than most consumer
              fintechs in Latin America.

              The official about page reinforces adoption claims: "Banco Plata is the fastest-growing
              financial institution in Latin America and the largest private digital bank by number
              of customers" and positions the app as "Top 3 financial apps" in Mexico. These are
              company-claimed marketing statements and have not been independently corroborated by
              an auditor or third-party rankings authority at the time of review. However, the
              4.8/5 cross-platform rating with 636K cumulative reviews provides the strongest
              independent customer satisfaction signal available in the public record.

              The ElCEO article from February 2026 quotes CEO Neri Tollardo describing Plata's
              ambassador delivery model as a key differentiator: customers can receive a physical
              credit card the same day without visiting a branch. The company's FAQ and credit card
              product pages document the cashback mechanism, the 60-day payment window, and the
              contactless payment integration (Apple Pay), all of which represent customer-facing
              value that reviewers in app stores frequently cite. No named enterprise or institutional
              clients exist — Plata is exclusively a consumer product at this stage.
