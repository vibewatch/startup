  - id: FE001
    title: Banco Plata Product Architecture Stack
    type: stack
    layout: wide
    summary: >
      Five-layer technology and product stack from customer interface to external dependencies, illustrating Plata's
      fully proprietary middle layers and third-party integrations at the edges.
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
    data:
      layers:
        - label: Customer Interface Layer
          detail: >
            Single mobile application (iOS version 2.2.0; Android bundle dif.tech.plata) with Mastercard digital card,
            Apple Pay, and Google Pay integration. 4.8/5 rating, 287k reviews on Mexican App Store.
          items:
            - iOS App (App Store ID 6443932656, version 2.2.0, May 2026)
            - 'Android App (bundle: dif.tech.plata)'
            - Apple Pay tokenization
            - Google Pay tokenization
        - label: Product Module Layer
          detail: >
            Five live product modules delivered through the app: credit card (flagship), debit/savings account,
            fixed/flexible savings, investment brokerage (VestFi), and nascent SME banking. Plata Plus subscription
            unlocks premium rates.
          items:
            - Plata Crédito — Mastercard credit card, up to 15% cashback, MSI
            - Plata Cuenta — debit + 7% savings rate (Plata+)
            - Ahorro Flexible — 10%/7% no-lock savings, IPAB
            - Ahorro Fijo — 9–11%/7–8% term deposits, IPAB
            - Investments via VestFi — 12,000+ instruments, CNBV-licensed
            - Personal Loans — cross-sell off credit card history
            - PyME / Cuenta Empresa — nascent SME banking
        - label: Proprietary Core Platform Layer
          detail: >
            All built in-house by Plata's engineering team (3,000+ employees, majority STEM): core banking ledger and
            transaction engine, AI risk scoring and automated underwriting, CRM and customer lifecycle management.
          items:
            - In-house core banking system (proprietary ledger)
            - AI-powered automated risk management and credit scoring
            - Internal CRM and customer management
            - In-house mobile app development team
        - label: Regulatory and Financial Infrastructure Layer
          detail: >
            Banco Plata operates under full CNBV banking license (Institución de Banca Múltiple, authorized February
            2026). IPAB deposit insurance covers savings products. Fitch B+ / Moody's A- national ratings. Bond issuance
            program up to USD 200M.
          items:
            - CNBV banking supervision (Ley de Instituciones de Crédito)
            - Banco de México (Banxico) SPEI settlement oversight
            - IPAB deposit insurance up to 400,000 UDI
            - Bond program up to USD 200M (senior unsecured)
        - label: External Network Dependencies
          detail: >
            Third-party integrations at the edge: Mastercard for card processing, Apple/Google for digital wallets,
            OXXO/Kiosko for cash transactions, and Fasanara Capital for credit facilities.
          items:
            - Mastercard (principal member — card processing, tokenization)
            - OXXO / Kiosko (cash deposits, payments)
            - Fasanara Capital (USD 100M credit facility)
            - Ambassador delivery network (same-day card logistics)
