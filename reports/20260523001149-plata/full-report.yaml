      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Klar's Banking License Application Is the Single Highest-Impact Competitive Event
            body: >-
              Klar filed for a full Institución de Banca Múltiple license from CNBV in 2024. If approved, Klar would
              gain IPAB deposit insurance (400,000 UDI parity with Plata) and the legal powers of a commercial bank.
              This event would eliminate Plata's primary regulatory differentiator versus its most technically capable
              direct competitor. Diligence should establish the expected approval timeline and Plata's competitive
              response if Klar achieves full-bank status within 12–24 months.
            calloutType: risk
            claimRefs:
              - CP010
              - CP040
          - type: callout
            title: Multi-Homing Is the Default Consumer Behavior — Not Loyalty
            body: >-
              Mexico's neobank market exhibits multi-homing: consumers routinely hold credit cards from multiple issuers
              and maintain savings accounts across platforms for yield optimization. Plata's active-card-to-total-card
              ratio and spend-per-active-customer (not publicly available) would be the most diagnostic indicator of
              whether it has achieved primary-card status with its users or remains a second card in multi-homed
              wallets.
            calloutType: insight
            claimRefs:
              - CP019
              - CP032
              - CP036
          - type: callout
            title: Competitor Unit Economics Remain Opaque — Adverse Scenario Not Ruled Out
            body: >-
              No Mexican neobank competitor has publicly disclosed cost-of-risk, net interest margin, or entity-level
              profitability for Mexico operations. Klar's $300M revenue and $0.75 service cost suggest strong unit
              economics, but credit quality and net profitability are unknown. An adverse scenario exists where
              competitors are subsidizing credit card issuance to build share at the expense of profitability, creating
              temporary pricing pressure without being structurally sustainable.
            calloutType: assumption
            claimRefs:
              - CP008
              - CP039
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >
              Plata's revenue model is a high-yield revolving consumer credit franchise that earns on three primary
              mechanisms: net interest income on credit card balances, fee and commission income (interchange,
              cash-advance fees, subscription, MSI restructuring), and ancillary income from investment products (Ahorro
              Fijo, Ahorro Flexible, brokerage) and FX.

              The credit card product (Plata Crédito) carries a listed ordinary interest rate of 99.9% per annum (sin
              IVA) and a Total Annual Cost (CAT) of 163.83% for customers who revolve balances. Customers who pay in
              full within the grace period generate no interest, making transactor mix a key unknown for realized
              revenue yield. Cash-advance fees of 10% + IVA per transaction and a late-payment penalty of MXN 400 per
              event augment interest. The Plata Plus subscription plan adds a recurring charge of 1% of the credit limit
              per month (MXN 39–99 min/max, plus IVA), providing a modest but predictable revenue layer.

              Full-year 2025 4Q earnings release shows interest income of MXN 5,999M and fees of MXN 1,119M, while the
              independently audited MX FRS statements report interest income of MXN 2,895M and commissions earned of MXN
              3,202M—a material accounting classification difference reflecting the pre-bank SAPI treatment of revolving
              credit charges as commissions rather than interest under certain NIF provisions. Both sets of statements
              are prepared by management under different regulatory frameworks; the audited figure is the primary source
              of record. Revenue grew approximately 3.3× in 2025 vs 2024 (audited interest income MXN 2,895M vs MXN
              658M), confirming rapid portfolio scaling.

              4Q2025 quarterly revenue (earnings release definition) reached MXN 2,507M, up 212% YoY and 24% QoQ,
              approaching an annualized run-rate of ~MXN 10B. The IR homepage confirms an annualized revenue figure of
              USD 596M (~MXN 11.9B at current rates) as of 1Q26, which is the most forward-looking publicly available
              figure. Deposit-taking launched mid-March 2026 and will over time create a funding cost and net spread
              model for the savings book as well.
