  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context, Valuation Anchors, and Cap-Table Considerations
        blocks:
          - type: paragraph
            body: |
              Banco Plata has raised capital in two publicly disclosed equity rounds: a USD 160 million
              Series A at a USD 1.5 billion valuation in March 2025, led by Kora Management with
              participation from Moore Strategic Ventures and other US and European investors; and a
              USD 250 million Series B at a USD 3.1 billion valuation in October 2025, again led by Kora,
              with renewed participation from Moore Strategic Ventures and the addition of TelevisaUnivision
              as a strategic anchor investor. The combined equity raised across both rounds is approximately
              USD 410 million. Fitch Ratings, publishing its inaugural B+ rating in May 2026, notes that
              cumulative equity injected exceeds USD 500 million, indicating additional pre-round capital
              contributions from controlling shareholders. The Plata IR homepage cites over USD 2 billion in
              combined debt and equity raised cumulatively, reflecting significant wholesale bond issuance
              (MXN 11,698 million at end-2025) layered on top of equity.

              The most recent priced hard anchor is the Series B at USD 3.1 billion — equivalent to
              approximately MXN 62 billion at current exchange rates. The October 2025 press release and
              Bloomberg Línea reporting both confirm this figure. However, the company's own About page
              describes a USD 5 billion valuation as of the May 2026 run date — a 61% premium to the
              last priced round in under eight months. No new primary equity round, secondary transaction,
              or independent third-party mark confirming this step-up has been identified in public sources.
              The USD 5 billion figure appears to originate from management communications or media
              descriptions and has not been corroborated by a priced financing event or an auditor/rating
              agency valuation.

              Capital structure considerations for entry discipline: the corporate structure places Banco
              Plata S.A. as a 99.99% subsidiary of Different Technologies LLC, a US-registered holding
              entity. Beneficial ownership is not publicly disclosed. The governing documents (Estatutos
              Sociales) are published but contain no public cap-table detail, preference-stack mechanics,
              or anti-dilution provisions. The absence of cap-table transparency — including preference
              waterfall, liquidation preferences, any ratchets or participating features, and the
              exact holding structure between Different Technologies LLC and its investors — is a
              material diligence gap for any new investor. Kora Management's two rounds of lead
              participation imply a significant minority position, but the precise equity split across
              the founding team, Kora, Moore, TelevisaUnivision, and other investors remains undisclosed.

              Debt overhang must be factored into the entry discipline framework. At end-2025, the
              bank held MXN 11,698 million (~USD 585 million) in wholesale debt (bonds and bank loans),
              secured against the loan portfolio and the bank's operating assets. While Fitch notes a
              long weighted-average maturity profile, any equity valuation analysis must account for net
              debt in an EV-to-equity bridge. On a rough net-debt-adjusted basis, equity fair value at
              the USD 3.1 billion enterprise value anchor implies enterprise value minus net debt of
              approximately USD 3.1 billion minus USD 585 million (wholesale debt) plus ~USD 240 million
              (cash), yielding an equity value in the USD 2.75 billion range — meaning equity holders at
              the Series B paid for approximately USD 2.75 billion of equity, not USD 3.1 billion EV.
              At the USD 5 billion EV claim, equity value would be approximately USD 4.65 billion, even
              further from a defensible public-comparable range.

              The deposit franchise, launched mid-March 2026, held only USD 78 million at 1Q26 against
              USD 746 million in gross loans, producing a loans-to-deposits ratio of 933.5%. The banking
              license creates future optionality: as deposits scale, the funding cost structure improves and
              the equity story strengthens. However, deposit growth to meaningful scale typically requires
              two to four years for digital banks in Mexico, making any deposit-driven valuation uplift a
              2027+ proposition at the earliest.
            claimRefs:
