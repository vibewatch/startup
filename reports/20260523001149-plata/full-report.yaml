      - number: '8.4'
        title: Dilution and Preference Overhang, Exit Readiness, and Return Scenarios
        blocks:
          - type: paragraph
            body: |
              **Dilution runway and next-round overhang.** Plata's capital structure requires ongoing
              external funding: with a net loss of MXN 1,978 million (~USD 99 million) in 2025, a
              loans-to-deposits ratio of 933.5%, and every peso of portfolio growth requiring wholesale
              or equity funding, the bank will need a new equity raise within 18–24 months of the
              Series B close (i.e., by mid-to-late 2027) at the current growth trajectory. The Fitch
              report notes capitalization at 12.2% FCC/RWA, with growth pressure building. The FCC/RWA
              ratio would erode below the CNBV regulatory minimum as the portfolio grows, absent new
              equity. Each new equity round creates dilution for existing shareholders; the Series B
              investors' stake is a moving target. Without a disclosed cap table or pre-emptive right
              provisions, it is impossible to model exact dilution per round, but the structural need for
              at least one more equity raise before profitability (likely USD 200–400 million) implies
              material dilution to pre-Series B investors if the new round is priced at or below Series B.

              **Preference stack and liquidation waterfall.** No public information is available on
              whether the Series A or Series B rounds carry non-participating preferred liquidation
              preferences, anti-dilution ratchets (broad-based weighted average or full ratchet), or
              participation caps. Given the structure of typical Kora-led venture rounds at this stage,
              standard terms would include a 1× non-participating liquidation preference with broad-based
              weighted-average anti-dilution protection — terms that are manageable for founders but
              could leave common shareholders with little to no residual value in a down-round scenario
              where total proceeds fall below USD 410 million (combined A+B invested capital). The lack of
              disclosure on preference stack is a material diligence gap that prevents precise return
              modeling.

              **Exit pathways and timeline.** Three plausible exit pathways exist: (1) IPO on NYSE, Nasdaq,
              or BMV (Bolsa Mexicana de Valores), likely not before 2027 or 2028 given the current
              pre-profitability status and regulatory track record requirement for public market listings;
              (2) strategic acquisition by a larger financial institution (BBVA, Santander, Citigroup) or
              fintech platform (MercadoLibre) seeking rapid digital market share in Mexico; or (3)
              continuation as a private company with secondary liquidity events. The Bloomberg Línea
              article references Plata's expansion into Colombia as a Compañía de Financiamiento, which
              suggests management is building a multi-market platform that would eventually support either
              a regional IPO or a cross-border strategic sale. The Iupana article notes that Mexico's
              digital banking market is in a transformational phase, with multiple banks (including Nubank,
              Revolut, and Plata) now holding full banking licenses.

              **Exit valuation sensitivity.** At a 2027 or 2028 IPO, assuming Plata achieves USD 1.0–1.3
              billion in revenue with a narrowing net loss, a public market EV/revenue multiple of 3–5×
              (consistent with a pre-profitability LatAm digital bank at scale) would imply an enterprise
              value of USD 3.0–6.5 billion. The lower end of this range offers limited upside to Series B
              investors paying USD 3.1 billion in 2025. The upper end (5× on USD 1.3 billion) requires
              both strong revenue growth and some evidence of approaching profitability — a 2028–2030
              timeframe that entails substantial holding period risk.

              **Return scenario for Series B investors.** Assuming a USD 3.1 billion entry, a 4× EV/revenue
              exit on USD 1.2 billion revenue (2028E) would imply a USD 4.8 billion EV — a 55% gross return
              over approximately 3 years, or roughly 16% IRR before dilution. Accounting for one additional
              equity round of USD 300 million at a flat or modest step-up valuation would dilute Series B
              investors by approximately 10–15%, reducing the net IRR to approximately 12–14%. This is a
              reasonable but not exceptional return for a high-risk, pre-profitability consumer credit bank
              in an emerging market. A USD 5 billion entry would require a USD 7.5 billion exit (2.5× gross)
              to achieve the same 12–14% IRR — which requires the bull scenario to fully materialize.
