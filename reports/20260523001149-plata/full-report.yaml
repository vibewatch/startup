  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Valuation anchor progression
        - >-
          Series A USD 1.5B (March 2025) → Series B USD 3.1B (Oct 2025) is a 2× step-up in 7 months on genuine revenue
          acceleration.
        - >-
          The USD 5B management claim is an additional 61% step-up in 7 months without a new priced round or independent
          mark.
        - A priced Series C or secondary transaction at or above USD 4.5B would confirm the step-up.
      - - Revenue growth momentum
        - >-
          USD 596M annualized run rate at 1Q26; revenue grew 3.3× in 2025 vs. 2024; 1Q26 total operating income grew
          1.9× YoY per Fitch.
        - >-
          Revenue quality is mixed — classification differences between earnings release and MX FRS audited statements;
          true NIM after provisions not disclosed.
        - Audited 1Q26 MX FRS financials with clear NIM, provision, and NII disclosure would remove ambiguity.
      - - Banking license moat
        - >-
          Full CNBV Institución de Banca Múltiple license received February 2026 — first among Mexican digital
          challengers — enabling IPAB deposit insurance at 400,000 UDIs vs. 25,000 UDIs for SOFIPO competitors.
        - >-
          Klar's acquisition of Bineo (Banorte's digital unit) is pending regulatory approval; if approved, the moat
          disappears.
        - Klar regulatory outcome and timeline should be monitored as a direct moat erosion signal.
      - - Capitalization adequacy
        - >-
          FCC/RWA at 12.2% and tangible equity/assets at 11.8% are relative strengths per Fitch; track record of raising
          equity in 18 months is demonstrated.
        - >-
          Capital will be consumed by portfolio growth and operating losses within 18–24 months, requiring another
          dilutive raise.
        - Announced profitability timeline and deposit ramp trajectory, even indicative, would help model dilution path.
      - - Credit quality trend
        - >-
          NPL ratio of 4.8% and cost of risk of 23.9% are within the expected range for high-yield revolving consumer
          credit in EM markets; Fitch notes "controlled asset quality despite high growth."
        - >-
          Both metrics deteriorated in 2025 vs. 2024 (NPL 3.4% → 4.8%; loss provision +228% YoY); the 99.9% APR model is
          vulnerable to a CONDUSEF rate-cap intervention.
        - Stabilized or declining NPL ratio over two consecutive quarters would strengthen the credit quality argument.
      - - Comparable support
        - >-
          Klar (USD 800M valuation, ~USD 300M revenue) implies ~2.7× EV/revenue for a SOFIPO; Plata deserves a premium
          for its banking license, larger scale, and faster growth.
        - >-
          Nubank — the only fully comparable listed LatAm digital bank — trades at 1.5–1.7× LTM EV/revenue despite
          profitable operations at 3× Plata's Mexico customer count.
        - If Plata demonstrates a credible path to breakeven, a 4–5× premium to Nubank's current multiple is arguable.
    notes: >-
      The anti-thesis is driven primarily by valuation evidence gaps and credit cycle exposure, not by fundamental
      disbelief in Plata's operating model.
