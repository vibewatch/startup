            title: Adverse Signal — Rising Credit Risk on Proprietary AI Underwriting
            body: >
              Fitch's May 2026 rating action documented a cost of risk of 23.9% at 1Q2026 and a stage-3 loan ratio of
              4.8%, both rising year-on-year. While Plata claims AI-powered automated risk management, the underwriting
              model has not been independently validated and its parameters are not disclosed. Rapid asset growth
              combined with worsening impaired-loan generation suggests the proprietary model may be calibrated
              aggressively for acquisition over loss minimization, creating asset-quality risk that could constrain
              future growth.
            calloutType: risk
