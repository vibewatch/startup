      - number: '4.2'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >
              Plata's unit economics are high-yield / high-risk, consistent with a consumer credit card franchise
              targeting thin-file borrowers with limited formal credit history. The stated interest rate (99.9% annual)
              is comparable to Klar and Stori equivalents; realized yield on the revolving book is not publicly
              disclosed. Fitch estimates the operating loss to average assets improved to -16.5% at 1Q26 from -28.1% in
              2025, confirming the trajectory toward breakeven but indicating significant remaining gap.

              Loan loss provision consumed MXN 2,245M in 2025 (+228% YoY), representing 54% of gross NII (before
              provision) and generating a negative net interest margin after credit losses in aggregate. Cost of risk
              stood at 23.9% at 1Q26 per Fitch, above some consumer unsecured peers in Latin America. Stage 3 (NPL)
              ratio was 4.8% at 1Q26, rising from 3.4% in 2024 and 4.4% at end-2025—consistent with rapid portfolio
              growth and a high-risk customer segment but within management's stated control range given the highly
              revolving nature of credit cards, which provides timely visibility into delinquency trends.

              Operating expenses were MXN 5,785M in 2025 (+101% YoY, consistent with audited MXN 5,777M), representing
              212% of net operating income (MXN 2,726M) and ~81% of gross revenues (earnings release definition). The
              remuneration structure reflects a technology and data-science build: the bank operates from a single CDMX
              office. Deferred tax assets of MXN 1,457M (end-2025) reflect accumulated NOL carry-forwards that would be
              realized only if the bank achieves taxable income. The net loss narrowed from MXN 2,150M in 2024 to MXN
              1,978M in 2025 despite assets nearly tripling, indicating improving operating leverage as the portfolio
              matures.

              CAC, LTV, and payback period are not disclosed; the card's same-day personalized delivery model and
              digital-only acquisition channel are designed to minimize CAC, but no metric has been confirmed by
              independent sources. Interchange revenue is embedded in the "commissions" bucket and is not separately
              disclosed.
            claimRefs:
