          - type: callout
            title: VestFi Investment Arm — Regulatory Separation Creates Complexity
            body: >
              Investment services are delivered through VestFi, a legally separate CNBV-licensed investment advisor
              (registration 30165), rather than directly through Banco Plata's banking license. This structure keeps
              investment risk off the bank's balance sheet but creates a multi-entity customer relationship and may
              complicate complaints handling and dispute resolution. Diligence should confirm the contractual and
              operational relationship between Banco Plata and VestFi, and whether VestFi is a subsidiary, affiliate, or
              independent entity.
