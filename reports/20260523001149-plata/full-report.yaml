  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: |
              Banco Plata transitioned from SOFOM to a full Institución de Banca Múltiple in February
              2026, instantly importing the entire regulatory stack of the Ley de Instituciones de
              Crédito (LIC), CNBV Disposiciones de Carácter General, Banxico payment-system rules,
              and CONDUSEF consumer-protection requirements. The bank has operated under the new license
              for only two months as of runDate, leaving material compliance infrastructure — internal
              audit, board composition, independent directors, and risk-management committee reports —
              either nascent or not publicly verified.

              Fitch's inaugural B+ rating (May 2026) explicitly notes governance opacity as a limiting
              factor: board composition, independent directors, and senior management depth beyond CEO
              Neri Tollardo are not publicly disclosed. This concentration of accountability in a single
              named executive represents an elevated governance risk for a regulated deposit-taking bank.
              The CONDUSEF maintains oversight of all consumer-credit complaints against Banco Plata and
              publishes quarterly reclamation statistics for the multiple-banking sector; an escalating
              complaint index would be an early warning of compliance or product-design failure.

              The Ley para Regular las Instituciones de Tecnología Financiera (Ley Fintech, 2018,
              as amended) governs technology-based financial services and imposes additional reporting
              and operational requirements on institutions such as Plata that deliver credit via digital
              channels. While Plata's banking license technically supersedes some SOFOM-specific Fintech
              Law provisions, the overlapping regulatory perimeter creates interpretive risk around
              digital-channel obligations (biometric KYC, embedded digital-wallet disclosures, and
              DPA data-processor registrations) that have not been tested in enforcement.

              Data-privacy risk is a direct outgrowth of Plata's model: the bank processes biometric
              identity, geolocation, behavioral, and financial data for 3.4 million customers.
              The Ley Federal de Protección de Datos Personales en Posesión de los Particulares
              (LFPDPPP) and its Reglamento impose mandatory breach notification, purpose-limitation,
              and data-minimization obligations. The INAI can impose fines of up to MXN 320 M per
              violation. No enforcement action against Plata has been identified, but the risk is
              structural to any large-scale digital bank processing sensitive personal data.

              AML/CFT risk is elevated in Mexican digital banking: the FATF placed Mexico on enhanced
              monitoring as recently as 2021, and CNBV has historically penalized banks — including
              HSBC Mexico — for systemic AML failures. Plata's credit-card model, which targets
              thin-file consumers acquiring their first formal credit instrument, creates a heightened
              beneficial-owner verification burden. No AML enforcement actions against Plata have
              been identified, but the combination of rapid onboarding volume (3.4 M customers in
              under four years) and limited prior regulatory track record warrants ongoing monitoring.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
