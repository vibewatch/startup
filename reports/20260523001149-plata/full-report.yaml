      - number: '1.2'
        title: Founding Team and Leadership
        blocks:
          - type: paragraph
            body: |
              Banco Plata was co-founded by Neri Tollardo, Danil Anisimov, and Alexander Bro, all
              veterans of Russia's Tinkoff Bank who applied their digital-banking expertise to Mexico's
              underserved credit market. Neri Tollardo serves as CEO (Director General), signing the
              audited financial statements and acting as the company's primary spokesperson in regulatory
              filings, investor press releases, and media interviews. He publicly cited the company's
              technological foundations and regulatory compliance discipline as key competitive
              differentiators. Tollardo's background at Tinkoff — one of Russia's pioneering branchless
              digital banks — provided the operational blueprint for Plata's Mexico launch.

              Vadim Shilyagin serves as Director de Finanzas (CFO), and Carlos Romero as Contralor
              Financiero (Financial Controller); both sign the 2025 audited annual financial statements.
              The full board composition and independent directors are not publicly disclosed, which
              Fitch noted as a governance limitation for a recently established institution. This opacity
              around board structure concentrates identifiable key-person risk in Tollardo, the sole
              named executive in most regulatory and investor communications. The leadership team's
              strong track record in building digital credit products at scale is well demonstrated, but
              its effectiveness in managing a full credit cycle, bank compliance obligations, and a
              more diversified product portfolio remains to be tested over a longer period, per Fitch's
              2026 inaugural rating assessment.
            claimRefs:
