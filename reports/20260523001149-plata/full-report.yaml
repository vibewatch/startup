  - id: FV004
    title: Investment KPIs — IC Scoring Matrix
    type: kpi
    notes: >-
      IC-ready scoring across seven investment dimensions. Scores are analyst estimates on a 1–5 scale (1 = very poor, 5
      = excellent) based on disclosed evidence as of May 2026.
    data:
      items:
        - label: Market opportunity
          score: 5
          detail: >-
            Mexico's USD 800B+ consumer credit TAM, 46M unbanked/underbanked adults, low credit card penetration at ~25%
            digital adoption. Structural growth for 5–10 years.
        - label: Proof of product-market fit
          score: 4
          detail: >-
            3.4M active customers, USD 596M annualized revenue, Fitch Positive Outlook. Strong traction but
            NIM/profitability still negative.
        - label: Competitive moat
          score: 3
          detail: >-
            CNBV banking license and IPAB moat are real but may be eroded by Klar approval. Technology moat is asserted
            but not independently verified.
        - label: Unit economics
          score: 2
          detail: >-
            23.9% cost of risk, pre-profitability, operating loss at –16.5% of avg assets at 1Q26. Revenue growing but
            NIM after provisions likely negative.
        - label: Risk profile
          score: 2
          detail: >-
            High: Fitch B+ speculative grade, credit cycle exposure, funding concentration, regulatory compliance
            immaturity, governance opacity.
        - label: Valuation
          score: 2
          detail: >-
            USD 5B management claim at 8.4x LTM revenue is expensive for a pre-profitability bank. Series B at USD 3.1B
            (5.2x) is more defensible. Public comps trade at 1.5–2.7x revenue.
        - label: Evidence quality
          score: 3
          detail: >-
            Audited 2025 financials available; Fitch rating with data; earnings releases public. Cap table, NIM,
            CAC/LTV, and deposit ramp trajectory are undisclosed.
    claimRefs:
