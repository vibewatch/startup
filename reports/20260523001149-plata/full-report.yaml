          new entry above USD 4.2B requires visible profitability progress.
      - - Valuation stance
        - Stretched at USD 5B; fair at USD 3.1–4.2B range
        - >-
          Margin of safety at USD 5B is thin. Entry closer to the Series B anchor or below is more defensible on a
          public-comparable basis.
      - - Confidence
        - Medium
        - Growth trajectory is clear; profitability timeline, cap-table structure, and deposit ramp are not.
      - - Risk rating
        - High
        - >-
          Pre-profitability status, speculative-grade Fitch B+ rating, 23.9% cost of risk, 933.5% loans-to-deposits
          ratio, and funding structure concentration.
      - - Key valuation anchor
        - Series B USD 3.1B (Oct 2025) — last hard priced event
        - Best public mark available; USD 5B description is unverified management communication.
      - - Entry discipline
        - Prefer entry at or below USD 4.2B (7× LTM run-rate revenue)
        - >-
          Waiting for verifiable deposit ramp or narrowing loss trend is more rational than paying for USD 5B before
          evidence arrives.
