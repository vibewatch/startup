      - number: '3.4'
        title: Switching Costs and Lock-In Dynamics
        blocks:
          - type: paragraph
            body: |
              Consumer-facing financial products in Mexico have relatively low formal switching costs:
              credit cards carry no contractual lock-in beyond the credit-limit relationship, and savings
              accounts can be opened concurrently. Multi-homing (holding multiple neobank accounts
              simultaneously) is the dominant consumer behavior rather than exclusive loyalty. However,
              several structural lock-in mechanisms create asymmetric competitive moats.

              **Ecosystem lock-in (Mercado Pago):** Mercado Pago's credit card benefits are maximized
              within the Mercado Libre ecosystem — 24 MSI on marketplace purchases, QR payment
              integration, and automatic credit for seller disputes. A customer who transacts heavily on
              Mercado Libre cannot replicate these benefits with any other credit card issuer, creating
              sticky primary-card status for Mercado Pago within that cohort.

              **Employer-level lock-in (Klar Empresarial):** Klar's SME banking product integrates
              payroll disbursement, corporate card issuance, and revolving business credit lines. A
              company that disburses payroll through Klar passively creates a Klar account for each
              employee, providing a zero-incremental-cost consumer banking acquisition channel that
              bypasses direct consumer marketing cost entirely.

              **Incumbency and relationship lock-in (BBVA México):** BBVA México's mortgage, auto loan,
              and payroll account relationships with 20-25 million Mexicans create the deepest structural
              switching barriers in the market. Customers with mortgages or auto loans at BBVA face real
              financial risk and process cost from switching primary banking relationships. Digital
              challengers including Plata acquire users primarily at the margin of this base.

              **Deposit-insurance asymmetry as lock-in:** Plata's IPAB coverage (400,000 UDIs ≈ MXN 2.7M)
              versus SOFIPO competitors' 25,000-UDI limit creates a meaningful lock-in advantage for
              high-balance depositors. Customers with deposits exceeding MXN 170,000 face a real risk
              premium in placing funds with a SOFIPO versus a full bank, giving Plata and Ualá a
              structural advantage in the higher-balance savings segment.
            claimRefs:
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
      - number: '3.5'
        title: Moat Durability and Adverse Evidence
        blocks:
          - type: paragraph
            body: |
              Plata's competitive moat rests on three foundations: its full banking license (IPAB
              coverage, broader product powers), its AI underwriting capability (serving thin-file
              customers), and its early mover advantage in Mexico's mass-market digital credit segment.
              Each foundation faces a material erosion vector.

              **License moat erosion:** Klar's CNBV banking-license application, if approved, directly
              eliminates the deposit-insurance differential that makes Plata structurally advantaged
              over SOFIPO peers. Ualá, already licensed, confirms that the barrier to obtaining a full
              banking license is real but not insurmountable. The time window for Plata to establish
              scale-based moat before competitors achieve equal regulatory standing may be narrower
              than investors assume.

              **Feature commoditization:** The proliferation of no-annual-fee credit cards across
              Nubank, Klar, Stori, and Plata demonstrates that the card product itself is effectively
              commoditized. Differentiation via cashback has also eroded: Stori offers up to 10%
              category cashback and Klar Platino offers elevated cashback with insurance bundling.
              Plata's primary product moat requires continuous upward adjustment as competitors add
              features at comparable cost.

              **Capital asymmetry:** Nubank's NYSE listing ($15B+ market cap) gives it access to
              equity capital at a materially lower cost than a private company. Klar's $190 million
              Series D at $800 million valuation signals continued investor conviction in a third
              full-spectrum neobank in Mexico alongside Plata. These well-capitalized competitors can
              sustain below-cost pricing (subsidized yields, cashback) longer than Plata's balance
              sheet may support.

              **Adverse signals — regulatory complaints:** CONDUSEF monitoring of consumer complaints
              against digital financial institutions in Mexico represents an operational risk across the
              category. Rising complaint rates for unauthorized charges, dispute resolution delays, and
              data privacy issues are an adverse signal for digital bank operating risk, including Plata.

              **Adverse signals — cost of risk:** Plata's 23.9% cost of risk at 1Q 2026 (from the
              market-analysis chapter and Fitch materials) is materially higher than traditional bank
              credit card portfolios. No public data is available for competitor cost-of-risk figures,
              leaving it unclear whether Plata's underwriting performance is better or worse than Klar,
              Stori, and Nubank on a like-for-like basis.
            claimRefs:
