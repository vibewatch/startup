      - number: '1.3'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: |
              Banco Plata has raised more than $2 billion in combined equity and debt financing as of
              the first quarter of 2026, making it one of the most heavily capitalized fintechs in Latin
              America. The financing history includes two major equity rounds and a significant debt
              facility: a $160 million Series A in March 2025 at a $1.5 billion valuation, led by Kora
              Management with participation from Moore Strategic Ventures and other US and European
              investors; followed by a $250 million Series B in October 2025 at a $3.1 billion valuation,
              led by Kora, with renewed participation from Moore Strategic Ventures, plus TelevisaUnivision,
              Audeo Ventures, Spice Expeditions, Hedosophia, and multiple US and European family offices.
              Fasanara Capital provided a $100 million credit facility in May 2025.

              Different Technologies LLC, the US-based parent holding 99.99% of Banco Plata, is the
              ultimate controlling shareholder and the primary source of equity capital injections.
              Cumulative share capital reached MXN 10,244 million by 31 December 2025, with MXN 5,372
              million injected in FY2025 alone. Kora Management's co-founder Nitin Saigal is publicly
              quoted as the lead institutional voice endorsing Plata's strategy. TelevisaUnivision's
              participation — originally a marketing partner before becoming an investor — reinforces
              Plata's distribution channel to Mexico's mass-market consumer base. The full cap table,
              including precise investor percentages, preferred stock terms, and liquidation preferences,
              remains private and undisclosed.
