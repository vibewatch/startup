      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: First-mover banking authorization among Mexico's digital challengers
            body: >-
              Banco Plata received CNBV authorization to start banking operations in February 2026, completing a
              three-year regulatory process. This places it ahead of Mercado Pago, Nubank, and other fintechs still
              awaiting full operational clearance in Mexico, giving it a first-mover window to expand into deposits,
              payroll, SME lending, and international transfers under a full banking charter.
            calloutType: strength
            claimRefs:
