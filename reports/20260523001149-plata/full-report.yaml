      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Credit Quality Is the Primary Near-Term Thesis Risk
            body: >-
              A 23.9% cost of risk and 4.8% NPL ratio at 1Q26, rising from 3.4% in 2024, signals that portfolio
              seasoning is producing higher-than-modeled losses. Any macroeconomic deterioration — Mexico GDP growth
              already revised to ~1.0% for 2026 by the IMF — could drive NPL above 8%, the level at which provisioning
              absorbs all revenue and the investment thesis breaks. This is the single highest-priority diligence item.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR034
          - type: callout
            title: Wholesale Funding Dependency Is a Structural Vulnerability
            body: >-
              A loans-to-deposits ratio of 933.5% at 1Q26 and MXN 11,698 M in wholesale debt make Plata uniquely exposed
              to institutional credit markets. At a B+ speculative-grade rating, investment-grade investors are
              structurally excluded, concentrating the bondholder base and creating spread volatility risk. The deposit
              franchise at USD 78 M provides minimal offset. This funding risk compounds credit risk in a stress
              scenario.
            calloutType: risk
            claimRefs:
              - CR016
              - CR017
              - CR019
          - type: callout
            title: Five Diligence Asks Before Full Investment Commitment
            body: >-
              (1) CNBV CAMELS-equivalent or inspection score since license grant; (2) CONDUSEF quarterly reclamation
              rate vs sector median; (3) named CRO, CCO, and board independent directors with CNBV approval
              confirmations; (4) fraud-loss vs credit-loss split and net charge-off recovery rate; (5) bond maturity
              schedule and covenant terms on the MXN 11,698 M wholesale book.
            calloutType: recommendation
