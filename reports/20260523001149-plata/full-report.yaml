      - number: '5.3'
        title: Regulatory Compliance, Security, and Trust Controls
        blocks:
          - type: paragraph
            body: >
              Banco Plata operates under the full banking regulatory framework of Mexico. The CNBV granted authorization
              for Plata to operate as an Institución de Banca Múltiple in February 2026, and banking operations
              commenced in March 2026. The entity is also supervised by the Banco de México (Banxico) and is compliant
              with the Ley de Instituciones de Crédito. Before the banking license, the company operated as Tecnologías
              Diffiere S.A.P.I. de C.V. under the Ley Fintech framework.

              Customer deposits are protected by the IPAB (Instituto para la Protección al Ahorro Bancario) up to
              400,000 UDI per person (~MXN 3.5M). This coverage applies to both Ahorro Flexible and Ahorro Fijo
              accounts. The investment service (VestFi) is regulated separately by the CNBV as an independent investment
              advisor (CNBV registration 30165).

              On the ratings side, Fitch Ratings published a B+ Long-Term IDR (Positive Outlook) for Banco Plata in May
              2026, citing expanding business profile, sound capitalization at 12.2% FCC/RWA, and improving
              profitability trajectory. Moody's has assigned an A- national scale rating. Bond issuance capacity was
              established via a program of senior unsecured fixed-rate bonds up to USD 200M listed on the
              ir.bancoplata.mx investor relations portal.

              Security controls marketed to customers include "Escudo de Plata" (Silver Shield), a 24/7 anti-fraud
              technology layer. The app prompts users to freeze and unfreeze cards in real time to prevent unauthorized
              charges. Mastercard certification as a principal member provides the underlying card-payment security
              framework including tokenization for Apple Pay and Google Pay. Two phone support lines are published (+52
              55 9990 8880 and +52 55 2579 0079) plus an in-app chat; these are the primary resolution channels for
              fraud and disputes.

              Adverse observation: Cost of risk (loan provision charge as a share of average portfolio) stood at 23.9%
              in 1Q2026—above comparable consumer-unsecured banking peers in Latin America per Fitch's analysis. Stage-3
              (impaired) loan ratios rose to 4.8% at 1Q2026 from 3.4% in 2024, signaling deteriorating asset quality as
              growth accelerates. No independent security certification (ISO 27001, SOC 2, PCI DSS) is publicly
              disclosed; diligence should verify whether these have been obtained as part of the banking authorization
              process.
