      - number: '7.2'
        title: Credit Quality, Asset Quality, and Fraud Risk
        blocks:
          - type: paragraph
            body: |
              Credit risk is the most quantitatively material risk facing Plata. Fitch's 1Q26 data
              shows a 23.9% cost of risk — defined as loan-loss provisions as a percentage of average
              loans — and a Stage 3 (NPL) ratio of 4.8%, up from 3.4% in 2024. These metrics are
              elevated relative to Mexico's traditional consumer credit universe; however, Fitch notes
              they are within the range observed among high-yield consumer credit card lenders
              in emerging markets, where revolving-portfolio dynamics cause NPLs to peak mid-cycle.

              The structural driver of high credit losses is Plata's target segment: thin-file
              consumers with limited or no formal credit history, accessing revolving credit at a
              stated CAT of 163.83% per annum. This segment provides high yield but also high
              charge-off probability in adverse economic conditions. The 2025 loan-loss provision
              of MXN 2,245 M (+228% YoY) consumed more than half of gross net interest income,
              generating negative NIM after provisions at the portfolio level.

              Fraud risk is inherent in fully digital consumer credit: identity fraud (synthetic
              identities, SIM-swapping, onboarding fraud), transaction fraud on the Plata Card, and
              account-takeover attacks. Plata's published security page describes multi-factor
              authentication, device fingerprinting, and real-time behavioral monitoring as
              mitigations. No public data breach or material fraud incident involving Plata has been
              identified in available sources. However, the absence of disclosed fraud-loss metrics,
              net charge-off rates, or recovery rates is a diligence gap that investors must close
              before full underwriting.

              The combination of high revolving rates (99.9% nominal annual), rapid customer growth,
              and thin-file borrowers creates exposure to regulatory rate-cap intervention. Mexico's
              CONDUSEF and Congress have periodically debated credit card rate caps similar to those
              implemented in Chile and Colombia; any legislative or regulatory rate ceiling would
              directly compress Plata's yield and materially impair the unit economics of the current
              business model.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: Liquidity, Funding, and Refinancing Risk
        blocks:
          - type: paragraph
            body: |
              Plata's funding structure is a significant medium-term risk. At end-2025, wholesale
              debt (bank loans and bonds) totaled MXN 11,698 M with a self-described long
              weighted-average maturity profile that mitigates near-term refinancing pressure.
              However, unsecured market debt represented 48.8% of total funding at end-2025,
              rising from zero at end-2023 — reflecting rapid capital-markets dependence with
              no history of performance through a credit cycle.

              The deposit franchise launched mid-March 2026 and held only USD 78 M at 1Q26 against
              USD 746 M in gross loans, producing a loans-to-deposits ratio of 933.5%. This ratio
              will compress only as the deposit book scales, a process that typically requires two
              to four years to become meaningful for digital banks in Mexico. Until then, the bank
              remains structurally dependent on wholesale markets and periodic equity injections.

              Any deterioration in Mexico's credit environment or in Plata's own credit ratings could
              narrow or close access to institutional funding markets, creating a liquidity cliff. The
              Fitch B+ rating is speculative-grade; investment-grade-constrained institutional
              investors (pension funds, insurance companies) are structurally prohibited from holding
              Plata bonds, limiting the investor base and potentially increasing spread volatility.
              The bank's access to Banxico's emergency liquidity facilities as a licensed bank is a
              partial offset but has never been tested.

              Equity capital adequacy (FCC/RWA 12.2% at 1Q26) provides a near-term buffer, but
              continued portfolio growth at the current pace will require new equity within 18–24
              months. The company's track record of raising equity (two rounds in 18 months) is a
              positive mitigant; however, any disruption to the US venture capital market — Kora
              Management and Moore Strategic Ventures are the lead shareholders — or to Mexico's
              macroeconomic conditions could delay or preclude a timely raise.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
      - number: '7.4'
        title: Competition and Key-Person Execution Risk
        blocks:
          - type: paragraph
            body: |
              The Mexican digital banking market is intensifying sharply in 2026. Nubank Mexico
              surpassed 10 million customers by April 2025 — nearly three times Plata's 3.4 million —
              and Bloomberg reports it as the fastest-growing segment of the Nubank group globally.
              Klar crossed 7 million users by late 2025. Stori raised USD 150 million at end-2025 to
              accelerate growth in Mexico and expand into Colombia. MercadoPago, backed by MercadoLibre's
              USD 7.6 billion in free cash flow and 100+ million regional users, offers embedded
              financial products with massive distribution advantages.

              Plata's competitive moat rests primarily on proprietary AI underwriting, a superior
              mobile UX, and same-day personalized card delivery — advantages that are replicable
              given sufficient capital. Nubank's superior scale generates network effects in credit
              data, cost-of-funds, and distribution that Plata cannot match without sustained growth.
              If Nubank and Klar compress the thin-file addressable market through prior credit-history
              creation, Plata may face deteriorating credit quality on any incremental origination
              as the highest-quality thin-file borrowers are absorbed by competitors.

              Key-person risk is concentrated in CEO Neri Tollardo. Fitch's inaugural report notes
              limited disclosed information about board composition and independent oversight. The
              founding team's Tinkoff pedigree is a strength but also a reputational consideration:
              three of the co-founders left Russia to build Plata, and their ongoing lack of formal
              ties to any Russian institution has not been independently confirmed. Any adverse
              geopolitical or reputational development relating to the founders' backgrounds would
              create a headline risk that could affect funding, regulatory posture, and customer trust.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
          - type: table
            tableRef: TR004
            claimRefs: []
      - number: '7.5'
        title: Operational, Cybersecurity, and Partner/Dependency Risk
        blocks:
          - type: paragraph
            body: |
              Plata's 100% digital, single-office model creates concentrated operational risk: there
              is no branch infrastructure to distribute load, no geographic failover for physical
              operations, and the entire customer experience depends on the proprietary in-house
              core banking platform. Any prolonged outage of the core platform — whether from a
              software defect, DDoS attack, or cloud-provider failure — would immediately halt
              origination, payments, and customer service for 3.4 million accounts with no analog
              backup. The security page confirms standard controls (MFA, device fingerprinting,
              real-time monitoring), but no third-party penetration-test results, SOC 2 certification,
              or ISO 27001 audit have been publicly disclosed.

              Cloud infrastructure concentration is a structural dependency. Plata has not disclosed
              its cloud provider publicly, but its engineering team (GitHub: dif-tech) uses
              infrastructure-as-code tooling consistent with hyperscale cloud (AWS or GCP). A single
              cloud-provider outage in the Mexico region would be existential for operations during
              the disruption. Mexico's financial regulator (CNBV) has begun issuing cloud-outsourcing
              guidelines, but cloud-specific operational resilience testing for new banks has not been
              publicly mandated with enforcement teeth as of May 2026.

              Card-network dependency (Visa or Mastercard — Plata has not disclosed which) is a
              critical single point of failure for the core credit card product. Termination or
              material modification of the card-network agreement would eliminate Plata's primary
              revenue source. Similarly, Plata holds deposit insurance (IPAB) up to MXN 3 M per
              depositor — protecting the nascent USD 78 M deposit book — but IPAB coverage limits
              mean any deposit balances above the ceiling are unsecured in a failure scenario.

              The holding company structure (Different Technologies LLC, Delaware) introduces
              regulatory perimeter risk: CNBV supervises only Banco Plata S.A. as the regulated
              entity, while the US holding company's obligations, related-party transactions, and
              beneficial-owner disclosure remain outside the Mexican regulatory perimeter and have
              not been publicly disclosed.
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
