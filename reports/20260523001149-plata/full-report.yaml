      - number: '5.2'
        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >
              Banco Plata describes itself publicly as a "high-tech financial platform" that "combines intuitive product
              design with advanced AI technology." Based on disclosed technical facts, the architecture rests on four
              documented pillars: (1) a proprietary in-house core banking system, (2) an internally built CRM and
              customer management platform, (3) an in-house mobile application (bundle ID: dif.tech.plata), and (4)
              AI-powered automated risk management and scoring.

              The core banking system was designed by Plata's own engineering team and described in the Series B press
              release (October 2025) as enabling "automated risk management and 24/7 personalized customer service" in a
              fully digital model. The Elceo.com report on the CNBV banking authorization (February 2026) independently
              confirmed that Plata developed its core banking system, CRM, and application in-house, which "allows it to
              streamline processes and offer immediate solutions to users." The technology stack is described as
              cloud-native; the founding team came from Tinkoff Bank (Russia's leading digital bank), where two
              co-founders (Alexander Bro and Danil Anisimov) built analogous high-velocity digital banking
              infrastructure.

              Plata's Android application carries the bundle identifier dif.tech.plata, referencing the predecessor
              legal entity Tecnologías Diffiere S.A.P.I. de C.V., which signals that the codebase has continuity from
              the fintech-license period. The iOS app (App Store ID 6443932656) was updated to version 2.2.0 on May 14,
              2026, indicating an active release cadence. The app is rated 4.8 out of 5 with 287,000 ratings on the
              Mexican App Store, placing it among the top three financial apps in Mexico. The GitHub organization
              github.com/dif-tech has no public repositories, confirming that Plata's source code is fully proprietary
              with no open-source contribution signal.

              Operationally, product delivery relies on three external networks: (1) Mastercard for card processing and
              international acceptance, (2) Apple Pay and Google Pay for digital wallet integration, and (3) OXXO and
              Kiosko as cash deposit and payment collection points (at listed fees of MXN 30.17 and MXN 12.93
              respectively, plus IVA). Plata operates no physical branches; all customer acquisition and onboarding is
              through the app. Physical card delivery is handled by Plata's own ambassador network, enabling same-day
              delivery to a customer-specified address and time.

              The total workforce reached approximately 3,000 by late 2025 (from 100 at launch in April 2023), with a
              self-described large share of STEM talent building in-house banking technology. Internal team structures
              are organized into Product Development, Business Development, and Operations for Growth.
