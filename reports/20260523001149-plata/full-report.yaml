          - type: callout
            title: Sustained pre-profitability and rising asset quality pressure
            body: >-
              Despite accelerating revenue growth, Banco Plata reported a FY2025 net loss of MXN 1,978 million and an
              operating-loss-to-assets ratio of -16.5% in 1Q26 per Fitch. The Stage 3 loans ratio rose to 4.8% in 1Q26
              (up from 3.4% at end-2024), and cost of risk reached 23.9%. Fitch scored earnings and profitability at
              'ccc+', reflecting that the bank has not yet demonstrated the ability to generate sustainable positive
              returns. Rapid loan growth and a concentrated high-yield consumer credit model amplify credit-cycle risk.
            calloutType: risk
