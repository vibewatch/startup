      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              **Key growth drivers:**

              1. *Financial inclusion policy mandate.* The Mexican government and financial
                 regulators have enacted a series of inclusion-focused policies — from the Ley
                 Fintech (2018) to Banxico's open-banking CoDi/DiMo infrastructure — designed to
                 increase formal financial access. Fitch notes that "government economic development
                 initiatives should help [the] banking sector to continue generating consistent
                 business volumes." This creates a regulatory tailwind for digital-first entrants.

              2. *Mobile infrastructure.* Mexico's 97.3% mobile connection penetration and 83.2%
                 internet penetration (DataReportal 2024) provide the distribution infrastructure
                 for a fully digital bank at near-zero physical branch cost. Same-day card delivery
                 (Plata's own claim) and in-app servicing displace branch dependency.

              3. *Incumbent gaps in credit and pricing.* The traditional five-bank oligopoly
                 (BBVA, Citibanamex, Santander, Banorte, HSBC) has historically avoided the mass
                 market due to high cost-to-serve and thin margins on small balance accounts.
                 Digital-first players with lower cost structures and AI-driven underwriting can
                 price credit more competitively while capturing the unserved population.

              4. *Network effects and multi-product migration.* As Plata — and peers — convert
                 credit card customers into full banking customers (savings, investments, PyME), the
                 per-customer revenue grows while churn incentive falls. The CNBV banking license
                 enables deposit-taking (IPAB-insured), which was not possible under Plata's prior
                 SOFOM/SOFIPO status.

              **Key adoption constraints:**

              1. *High cost of risk.* Consumer credit in Mexico's underbanked segment carries
                 elevated impairment risk. Plata's cost of risk was 23.9% at 1Q26 (Fitch), above
                 regional peers, reflecting its high-yield/high-risk model. Stage 3 loans rose to
                 4.8% at 1Q26 from 3.4% at end-2024. At market scale, impairment risk could constrain
                 SAM reachability without effective credit scoring.

              2. *Trust and brand familiarity.* Cash remains the dominant payment instrument in
                 Mexico. Consumer trust in new digital financial institutions — particularly those
                 founded by non-Mexican founders without legacy Mexican banking relationships —
                 requires sustained customer education investment. The IPAB deposit insurance coverage
                 is a partial trust bridge.

              3. *Regulatory compliance cost.* Banco Plata's three-year licensing process illustrates
                 the resource intensity of obtaining a full banking authorization from CNBV. Ongoing
                 compliance (AML/CFT, CNBV reporting, Banxico reserve requirements, audited
                 financial statements, IPAB contributions) imposes structural fixed costs that
                 reduce operating leverage relative to a non-bank fintech.

              4. *Competition and CAC pressure.* Bloomberg Línea documents that "several of the
                 largest fintechs in Mexico will operate as fully licensed banks the following year,"
                 creating a convergent competitive set. Multiple well-funded competitors (Nubank with
                 initial banking authorization, Klar via Bineo acquisition, Revolut already
                 operating) compress customer acquisition cost advantages.

              5. *ADVERSE — Macroeconomic and FX headwinds.* Fitch flags "slower domestic economic
                 growth, trade uncertainty, and external geopolitical risks" including potential
                 spillovers that "could increase inflation, market volatility, and GDP pressures."
                 Mexico's high exposure to US trade policy risk (USMCA review cycle) adds macro
                 volatility that could suppress consumer credit demand and elevate impairment.
