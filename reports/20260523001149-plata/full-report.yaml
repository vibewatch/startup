      - number: '6.5'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: |
              Banco Plata's concentration risk is elevated on three dimensions: product, geography,
              and customer profile. Credit cards represent approximately 93.5% of the loan portfolio
              at 3Q25 (personal loans 6.5%); savings and deposit products launched only in March 2026
              and are negligible in scale (USD 78M deposits vs. USD 746M+ loans). Geographic revenue
              is entirely Mexico; the Colombia savings entry announced in August 2025 is at early
              scale with no disclosed customer or deposit metrics. The customer base skews toward
              consumers with limited prior formal credit history — a segment that tends to show higher
              sensitivity to macro shocks (unemployment, inflation) than prime borrowers.

              Procurement friction is a genuine barrier for some target customers: Plata requires a
              smartphone, a Mexican CURP/ID, and a bank-grade selfie/biometric for onboarding.
              While the digital-first process is faster than incumbent banks, it excludes the
              approximately 18% of Mexicans without smartphone access (per INEGI ENDUTIH 2024).
              The ambassador card delivery model partially mitigates friction by bringing the bank
              to the customer, but it creates logistic concentration in urban areas.

              There is no publicly documented channel-partner or reseller dependence; Plata acquires
              customers direct-to-consumer. Investment products are white-labeled from VestFi, which
              creates a product-layer dependency on a third party regulated by the CNBV. The CONDUSEF
              consumer protection framework provides customers a formal complaint mechanism against
              Banco Plata, with the specific institutional complaint page registered in CONDUSEF's
              banca múltiple registry. Complaint volume data is not publicly disclosed on a per-
              institution basis through the CONDUSEF portal as of the run date.
