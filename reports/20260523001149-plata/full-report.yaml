  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: |
              Banco Plata's addressable market spans Mexico's consumer financial services ecosystem:
              unsecured consumer credit (credit cards, personal loans), deposit and savings products
              (transactional accounts, fixed and flexible term deposits), payment services (domestic
              transfers, bill payments, Apple Pay and digital wallets), and early-stage investment
              products (Mexican and US equity trading). The company explicitly targets the mass-market
              Mexican consumer who is either unbanked, underbanked, or poorly served by incumbent
              commercial banks — a segment that the CNBV, Banxico, and INEGI's Encuesta Nacional de
              Inclusión Financiera (ENIF) have documented as a structural feature of the Mexican
              financial system rather than a transient gap.

              Excluded from Plata's current market definition are: corporate and SME banking (only
              a nascent PyME product exists), mortgage lending (not offered), insurance and assurance
              products (not offered as of 1Q26), and international remittances (not launched). The
              status-quo substitute for Plata's credit card is the traditional bank credit card from
              BBVA Mexico, Citibanamex, Santander, Banorte, and HSBC Mexico, or, more commonly for
              the underbanked segment, informal credit (tianguis credit, family loans, and loan
              sharks). The payment substitute is cash, which remains the dominant payment instrument
              in Mexico by transaction volume. Internet- and app-based financial services (SPEI
              transfers, CoDi/DiMo, third-party payment apps) provide partial adjacency.

              The CNBV operates a tiered licensing system that defines competitive scope:
              Instituciones de Banca Múltiple (full-service banks, now includes Plata, Revolut, and
              Ualá), Sociedades Financieras Populares/SFP (limited deposit-taking, includes Nu
              México Financiera), and Instituciones de Tecnología Financiera (ITF, regulated under
              Ley Fintech 2018, primarily P2P and crowdfunding). Banco Plata now holds the most
              expansive license tier, conferring deposit insurance via IPAB (up to 400,000 UDIs per
              depositor) and the right to access Banxico's SPEI settlement infrastructure directly.
            claimRefs:
