acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      Tables TE003 (Technology / Operating Architecture) and TE004 (Trust / Quality / Compliance)
      include notes fields describing data sources and caveats. TE001 and TE002 contain explicit
      notes about estimation basis. TE005 includes notes on source provenance. All tables have
      notes where non-obvious caveats apply, consistent with the tableNotes requirement.
  - dimension: unverifiedSource
    reason: >
      Source SE039 cites the CNBV Banca Múltiple registry page
      (https://www.cnbv.gob.mx/SECTORES-SUPERVISADOS/BANCA-MULTIPLE/Paginas/Banca-Multiple.aspx),
      which is the authoritative regulator record confirming Banco Plata's Banca Múltiple
      license status. The CNBV portal blocks automated retrieval (fetch failed); the source
      is cited based on the official CNBV authorization disclosed by Banco Plata in multiple
      press releases and investor communications, and is not ommittable as the sole regulatory
      primary-tier source for CE042.
