  - id: differentiation
    title: Differentiation and Competitive Positioning
    body: >
      Plata's differentiation rests on three verifiable pillars: execution speed, proprietary
      technology, and regulatory positioning.

      Execution speed: Plata surpassed 2 million active credit customers in under 30 months
      from its April 2023 launch, a growth pace that the company and Kora (its lead investor)
      describe as the fastest digital bank build-out in Latin American history. The company
      reached approximately 10% share of all new credit-card issuance in Mexico by end-2024—a
      metric corroborated by Techfundingnews.com. The same-day card delivery model via
      ambassadors removes a key friction point compared to incumbent banks that mail cards
      over 7–10 business days.

      Proprietary technology: Unlike most Mexican and Latin American fintech challengers that
      rely on core banking platforms such as Mambu, Temenos, or Thought Machine, Plata built
      its own core banking system, CRM, and mobile app in-house. This insulates it from
      third-party vendor concentration risk and, according to the Kora co-founder quote in the
      PRNewswire Series B press release, represents "the new standard for digital banking in
      emerging markets." It also enabled rapid product iteration—adding savings products,
      investments, and personal loans to the credit-card-only initial offering within 18 months.

      Regulatory positioning: Plata is now one of only 52 Instituciones de Banca Múltiple in
      Mexico and the first digital-native bank among the very recently licensed (Revolut
      separately licensed in late 2025). This gives Plata a structural advantage for deposit
      collection, bond issuance, and full banking service eligibility versus Klar, Stori, and
      Nubank Mexico (which had only partial or pending banking authorizations as of May 2026).

      Key limitations: No public API or developer documentation, no open-source presence,
      undisclosed technology vendor stack, and no public SLA/uptime metrics mean that the
      technological moat claimed by management cannot be independently verified. The high
      cashback rates (up to 15%) and competitive savings rates are offered at pre-profitability
      scale, creating a structural risk that differentiation relies partly on subsidy.
