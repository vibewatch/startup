callouts:
  - calloutType: strength
    title: Proprietary In-House Core Banking Stack
    body: >
      Plata developed its core banking system, CRM, and mobile application entirely in-house.
      This is independently corroborated by both the PRNewswire Series B press release and the
      Elceo reporting on the CNBV banking authorization. A proprietary stack removes third-party
      vendor lock-in, reduces ongoing licensing costs, and accelerates feature velocity—directly
      supporting the sub-30-month 0-to-3.4M customer ramp.
    claimRefs:
      - CE013
      - CE014
      - CE015

  - calloutType: risk
    title: Adverse Signal — Rising Credit Risk on Proprietary AI Underwriting
    body: >
      Fitch's May 2026 rating action documented a cost of risk of 23.9% at 1Q2026 and a
      stage-3 loan ratio of 4.8%, both rising year-on-year. While Plata claims AI-powered
      automated risk management, the underwriting model has not been independently validated
      and its parameters are not disclosed. Rapid asset growth combined with worsening
      impaired-loan generation suggests the proprietary model may be calibrated aggressively
      for acquisition over loss minimization, creating asset-quality risk that could constrain
      future growth.
    claimRefs:
      - CE031
      - CE032
      - CE033

  - calloutType: insight
    title: VestFi Investment Arm — Regulatory Separation Creates Complexity
    body: >
      Investment services are delivered through VestFi, a legally separate CNBV-licensed
      investment advisor (registration 30165), rather than directly through Banco Plata's
      banking license. This structure keeps investment risk off the bank's balance sheet but
      creates a multi-entity customer relationship and may complicate complaints handling and
      dispute resolution. Diligence should confirm the contractual and operational relationship
      between Banco Plata and VestFi, and whether VestFi is a subsidiary, affiliate, or
      independent entity.
    claimRefs:
      - CE008
      - CE009

