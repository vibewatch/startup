  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: "cloud infrastructure"
      missingEvidence: "Name of cloud provider(s) hosting Plata's core banking system and data centers; infrastructure redundancy and disaster recovery architecture."
      whyItMatters: "Single cloud provider dependency without disclosed failover architecture is a critical operational risk for a bank with 3.4M customers."
      diligencePath: "Request technical due diligence session with Plata's CTO; review infrastructure vendor agreements."
      relatedQuestionRefs: [QE020]

    - type: private-evidence-only
      severity: material
      topic: "ambassador delivery network"
      missingEvidence: "Geographic coverage of the ambassador card delivery network; cities served, SLA guarantees, and contractual basis (employee vs. contractor)."
      whyItMatters: "Same-day delivery is a key differentiation claim; scalability beyond CDMX is unknown and critical to the growth thesis."
      diligencePath: "Request operational data from Plata; review ambassador coverage maps."
      relatedQuestionRefs: [QE017]

    - type: private-evidence-only
      severity: material
      topic: "security certification"
      missingEvidence: "ISO 27001, SOC 2, or PCI DSS attestation of compliance for Banco Plata's banking infrastructure."
      whyItMatters: "Banking-grade security certification is expected for a CNBV-licensed institution handling deposits and payment processing for 3.4M customers; absence raises regulatory risk."
      diligencePath: "Request certification documentation from Plata's compliance team; verify with CNBV supervision records."
      relatedQuestionRefs: [QE012]

