company:
  name: Plata
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Banco Plata operates a fully proprietary, cloud-native, AI-powered digital banking
    platform in Mexico that has no physical branches. Its five live product modules—Plata
    Crédito (Mastercard credit card), Plata Cuenta (debit/savings account), Ahorro Fijo/Flexible
    (fixed and flexible savings), Investments (via CNBV-regulated VestFi, registration 30165),
    and nascent PyME/SME banking—are delivered entirely through a mobile app rated 4.8/5 with
    287,000 ratings on the Mexican App Store. The in-house core banking system, CRM, and app,
    all built by an internal team of 3,000+ employees (majority STEM), enable same-day card
    delivery, automated AI risk scoring, and 24/7 personalized support. The bank received CNBV
    authorization in February 2026 and commenced banking operations in March 2026. Key
    diligence gaps include undisclosed technology vendor dependencies, absence of public SLA/uptime
    metrics, no developer-facing API documentation, and unverified security certifications.

sections:
  - id: product-portfolio
    title: Product Portfolio and Customer Value Proposition
    body: >
      Banco Plata's product suite as of May 2026 covers five distinct financial verticals,
      all accessed exclusively through its mobile application on iOS and Android.

      Plata Crédito is the flagship credit card, issued on the Mastercard network with Plata
      as a principal member. It carries a listed ordinary interest rate of 99.9% per annum
      (sin IVA) and a Total Annual Cost (CAT) of 163.83%. A MXN 199/year membership fee applies
      after the first three months; there is no origination fee and no card-replacement fee.
      Signature features include a two-month payment flexibility window (without late charges),
      a real-money cashback program of up to 15% on user-selected categories, a digital card
      for secure online payments, and same-day physical card delivery through Plata's ambassador
      network. Installment conversion (Meses Sin Intereses, MSI) is available for 3/6/9/12
      months at tiered fees. The card is the sole product through which the company built its
      customer base from zero to 3.4 million active customers in under three years.

      Plata Cuenta is a transactional debit account that earns interest: 7% per annum on the
      first MXN 20,000 for Plata Plus subscribers. It sits at the center of Plata's expanding
      deposit franchise and enables sending/receiving money, bill payments, and acting as the
      funding account for all other products. Ahorro Flexible (no-lock savings) pays 10% per
      annum with no balance cap for Plata Plus tier-2 subscribers (7% without), with interest
      accruing daily and IPAB protection up to 400,000 UDI (~MXN 3.5M). Ahorro Fijo (term
      deposits) offers 9–11% per annum for 30–360 day terms with Plata Plus and 7–8% without;
      these are rate-competitive relative to traditional Mexican banks.

      The Investments module, operated by VestFi (Asesor en Inversiones Independiente,
      CNBV registration 30165), offers access to stocks, ETFs, and investment funds across
      12,000+ global instruments including US-listed equities (Google, Apple, NVIDIA). The
      platform markets itself as the first all-in-one investment app in Mexico and provides
      AI-driven personalized recommendations and tournament-style gamification events.

      Personal loans were introduced in 2024 and grew from 3.6% to 6.5% of the total
      portfolio in the first nine months of 2025. PyME (small-business banking) is listed in
      the main navigation but specific product details are not publicly disclosed. Plata Plus
      is a subscription tier (MXN 39–99/month, equivalent to 1% of credit limit) that unlocks
      higher cashback, higher savings rates, and priority service.
