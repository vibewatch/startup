figures:
  - id: FE001
    title: Banco Plata Product Architecture Stack
    type: stack
    layout: wide
    summary: >
      Five-layer technology and product stack from customer interface to external dependencies,
      illustrating Plata's fully proprietary middle layers and third-party integrations at
      the edges.
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
    data:
      layers:
        - label: "Customer Interface Layer"
          detail: >
            Single mobile application (iOS version 2.2.0; Android bundle dif.tech.plata) with
            Mastercard digital card, Apple Pay, and Google Pay integration. 4.8/5 rating,
            287k reviews on Mexican App Store.
          items:
            - "iOS App (App Store ID 6443932656, version 2.2.0, May 2026)"
            - "Android App (bundle: dif.tech.plata)"
            - "Apple Pay tokenization"
            - "Google Pay tokenization"
        - label: "Product Module Layer"
          detail: >
            Five live product modules delivered through the app: credit card (flagship),
            debit/savings account, fixed/flexible savings, investment brokerage (VestFi),
            and nascent SME banking. Plata Plus subscription unlocks premium rates.
          items:
            - "Plata Crédito — Mastercard credit card, up to 15% cashback, MSI"
            - "Plata Cuenta — debit + 7% savings rate (Plata+)"
            - "Ahorro Flexible — 10%/7% no-lock savings, IPAB"
            - "Ahorro Fijo — 9–11%/7–8% term deposits, IPAB"
            - "Investments via VestFi — 12,000+ instruments, CNBV-licensed"
            - "Personal Loans — cross-sell off credit card history"
            - "PyME / Cuenta Empresa — nascent SME banking"
        - label: "Proprietary Core Platform Layer"
          detail: >
            All built in-house by Plata's engineering team (3,000+ employees, majority STEM):
            core banking ledger and transaction engine, AI risk scoring and automated
            underwriting, CRM and customer lifecycle management.
          items:
            - "In-house core banking system (proprietary ledger)"
            - "AI-powered automated risk management and credit scoring"
            - "Internal CRM and customer management"
            - "In-house mobile app development team"
        - label: "Regulatory and Financial Infrastructure Layer"
          detail: >
            Banco Plata operates under full CNBV banking license (Institución de Banca Múltiple,
            authorized February 2026). IPAB deposit insurance covers savings products.
            Fitch B+ / Moody's A- national ratings. Bond issuance program up to USD 200M.
          items:
            - "CNBV banking supervision (Ley de Instituciones de Crédito)"
            - "Banco de México (Banxico) SPEI settlement oversight"
            - "IPAB deposit insurance up to 400,000 UDI"
            - "Bond program up to USD 200M (senior unsecured)"
        - label: "External Network Dependencies"
          detail: >
            Third-party integrations at the edge: Mastercard for card processing, Apple/Google
            for digital wallets, OXXO/Kiosko for cash transactions, and Fasanara Capital
            for credit facilities.
          items:
            - "Mastercard (principal member — card processing, tokenization)"
            - "OXXO / Kiosko (cash deposits, payments)"
            - "Fasanara Capital (USD 100M credit facility)"
            - "Ambassador delivery network (same-day card logistics)"

  - id: FE002
    title: Customer Workflow — From App Download to Full Banking Relationship
    type: flow
    layout: standard
    summary: >
      End-to-end customer journey from initial app download through credit card onboarding,
      savings adoption, and investment cross-sell, illustrating how Plata deepens the
      financial relationship entirely within its mobile app.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
    data:
      nodes:
        - id: download
          label: "App Download"
          detail: "User downloads Banco Plata app from Apple App Store or Google Play; identity verification (INE/passport) done digitally"
        - id: apply_card
          label: "Apply for Plata Crédito"
          detail: "Digital application; AI underwriting runs credit scoring in real time; no branch visit; same-day card delivery by ambassador to chosen address and time"
        - id: card_active
          label: "Card Active — Core Credit User"
          detail: "Physical and digital cards active; 2-month payment flexibility; up to 15% cashback on selected categories; Plata Plus optional subscription (MXN 39–99/month)"
        - id: open_cuenta
          label: "Open Plata Cuenta"
          detail: "Transactional debit account auto-eligible for credit card holders; earns 7% on first MXN 20k (Plata+); enables P2P transfers and bill payments"
        - id: add_savings
          label: "Add Savings Products"
          detail: "Ahorro Flexible (10% no-cap with Plata+2, daily accrual, IPAB) or Ahorro Fijo (9–11% term, 30–360 days); IPAB coverage up to 400k UDI"
        - id: invest
          label: "Start Investing via VestFi"
          detail: "Stocks, ETFs, funds across 12,000+ instruments; minimum USD 1; AI-guided advice; regulated by CNBV (VestFi registration 30165)"
        - id: pyme
          label: "Open Business Account (PyME)"
          detail: "Cuenta Empresa for SME banking; full banking license enables corporate credit; product details nascent as of May 2026"
        - id: full_bank
          label: "Full Banking Relationship"
          detail: "Credit + debit + savings + investments + SME; all in one app; 24/7 phone and in-app chat support; Apple Pay / Google Pay at checkout"

