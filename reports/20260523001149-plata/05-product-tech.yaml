  - id: reliability-support
    title: App Performance, Reliability, and Support
    body: >
      Plata's mobile application serves as the single customer touchpoint for all banking
      operations. Reliability and user experience are therefore central to the value proposition.
      The iOS app (version 2.2.0, released May 14 2026) has accumulated 287,000 ratings with
      an average of 4.8 out of 5 on the Mexican App Store—a strong signal of user satisfaction.
      The app's self-described "new look" release notes highlight a redesigned, lighter, faster,
      and more modern experience, suggesting active UX iteration. The Android version on Google
      Play describes the same features: same-day card delivery, cashback, 2-month payment
      flexibility, and digital card for secure online purchases.

      Support infrastructure is documented as 24/7 via two channels: telephone (published
      numbers) and in-app chat. The Security page lists two phone lines. The FAQ page addresses
      common questions about Plata Crédito, Plata Cuenta, Empresa account, and bank transfers.
      No public status page (uptime / incident history) has been identified; this is a
      diligence gap for institutional investors assessing operational risk.

      Plata's roadmap for 2026 and beyond includes payroll access (nómina), SME lending
      expansion, international transfer capability, and geographic expansion into Colombia.
      These were disclosed in Bloomberg Línea (October 2025) and corroborated by Fintech Futures
      reporting. The bank's legal page also lists an Ahorro Garantizada product agreement,
      indicating a new secured-savings product in the pipeline.
