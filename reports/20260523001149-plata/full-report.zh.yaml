      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: |
              **关键增长驱动：**

              1. *金融普惠政策任务。* 墨西哥政府和金融监管机构推出了一系列聚焦普惠的政策——从 Ley Fintech（2018）到
                 Banxico 的开放银行 CoDi/DiMo 基础设施——目标是扩大正式金融可得性。Fitch 指出，“政府经济发展举措应帮助
                 银行业继续产生稳定业务量”。这为数字优先进入者提供监管顺风。

              2. *移动基础设施。* 墨西哥移动连接渗透率 97.3%、互联网渗透率 83.2%（DataReportal 2024），为纯数字银行提供了
                 接近零实体网点成本的分销基础设施。Plata 自称的当天送卡和 app 内服务，削弱了对网点的依赖。

              3. *传统机构在信贷和定价上的缺口。* 传统五大银行寡头（BBVA、Citibanamex、Santander、Banorte、HSBC）长期回避
                 大众市场，因为服务成本高、小额账户利润薄。成本结构更低、AI 驱动承保的数字优先玩家，可以更有竞争力地定价信贷，
                 同时吸纳未被服务的人群。

              4. *网络效应与多产品迁移。* 当 Plata 及同业把信用卡客户转化为完整银行客户（储蓄、投资、PyME）时，单客收入增加，
                 流失动机下降。CNBV 银行牌照让 Plata 可以吸收存款（IPAB 承保），此前 SOFOM/SOFIPO 身份做不到。

              **关键采用约束：**

              1. *高风险成本。* 墨西哥银行服务不足人群的消费信贷有更高减值风险。Plata 在 1Q26 的风险成本为 23.9%（Fitch），
                 高于区域同业，反映其高收益 / 高风险模型。Stage 3 贷款从 2024 年底的 3.4% 升至 1Q26 的 4.8%。市场规模化后，
                 若信用评分不够有效，减值风险可能限制 SAM 可触达性。

              2. *信任与品牌熟悉度。* 现金仍是墨西哥主导支付工具。消费者要信任新的数字金融机构——尤其是由非墨西哥创始人创建、
                 缺少本土传统银行关系的机构——需要持续投入客户教育。IPAB 存款保险是部分信任桥。

              3. *监管合规成本。* Banco Plata 三年牌照流程说明，从 CNBV 取得完整银行授权资源消耗很重。持续合规（AML/CFT、
                 CNBV 报告、Banxico 准备金要求、经审计财务报表、IPAB 缴费）带来结构性固定成本，使经营杠杆低于非银行金融科技公司。

              4. *竞争与 CAC 压力。* Bloomberg Línea 记录称，“墨西哥多家最大金融科技公司将在下一年以完整持牌银行身份运营”，
                 竞争集合正在趋同。多个资金充足的竞争者（获得初步银行授权的 Nubank、通过收购 Bineo 切入的 Klar、已在运营的
                 Revolut）会压缩获客成本优势。

              5. *负面——宏观经济和 FX 逆风。* Fitch 提示“国内经济增长放缓、贸易不确定性和外部地缘政治风险”，包括可能的溢出效应，
                 “可能推高通胀、市场波动和 GDP 压力”。墨西哥对美国贸易政策风险暴露较高（USMCA 审查周期），增加了宏观波动，
                 可能抑制消费信贷需求并推高减值。
