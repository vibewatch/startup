  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 日期
      - 估值或倍数锚点
      - 与 Plata 的相关性
      - 局限性
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation references for Plata as of the 2026-05-23 run date,
        combining Plata's own priced round anchors, public LatAm digital bank comparables, private Mexican fintech
        rounds, and global consumer credit challenger analogues. Not all listed digital banks worldwide are included.
    rows:
      - - Plata Series A
        - 私募轮，March 2025
        - 融资 USD 160M，投后估值 USD 1.5B；Kora Management 领投
        - 建立了报告日前 12 个月的第一个硬估值锚点；即便对高增长金融科技公司来说，Series B 估值 2× 上台阶也很快。
        - 早于完整银行牌照和吸收存款能力；收入基数显著更小。
      - - Plata Series B
        - 私募轮，October 2025 — 最近硬锚点
        - 融资 USD 250M，投后估值 USD 3.1B；Kora 领投，Moore Strategic Ventures 和 TelevisaUnivision 参投
        - 最干净的公开硬锚点；任何入场分析都应从这里出发。按 1Q26 运行率，意味着 LTM EV/revenue 约 5.2×。
        - 已过去 7 个月；收入已显著增长；但没有新的定价事件确认 USD 5B 管理层说法。
      - - Plata 自称估值
        - 未经验证的管理层沟通，May 2026
        - platacard.mx/en/about 和新闻材料中描述为 USD 5B
        - 定义当前入场要价，以及任何老股交易中的投资人预期。
        - 未经定价轮、老股交易或独立标记确认。意味着 8.4× EV/运行率收入——对一家尚未盈利的银行来说偏贵。
      - - 'Nubank (NYSE: NU)'
        - 上市，NYSE 挂牌；May 2026 市值
        - ~USD 15–17B 市值；基于拉美全域 ~USD 10B+ 收入，LTM EV/revenue 约 ~1.5–1.7×；自 2023 年起盈利
        - 最佳拉美上市数字银行可比对象；信用卡驱动模式和未充分服务人群逻辑直接相似。
        - 运营规模为 Plata 墨西哥客户数的 3×，已经盈利且完整公开披露——这些都支持其倍数低于 Plata 尚未盈利阶段。
      - - Klar
        - 私有公司；2025 Series D 估值 USD 800M
        - 融资 USD 190M，估值 USD 800M+；年化收入约 USD 300M；意味着 EV/revenue 约 2.7×；持有 SOFIPO 牌照
        - 墨西哥市场直接竞争者；目标客群相同；私募市场中阶段最接近的类比。
        - SOFIPO 牌照没有 IPAB 保险同等权益；客户数比 Plata 少 2.3M；产品范围更广（SME），但收入规模约为 Plata 的 50%。
      - - Stori
        - 私有公司；被称为「独角兽」——确切估值未公开披露；持有 SOFIPO 牌照；近期一轮融资 USD 150M
        - 独角兽状态意味着估值 USD 1B+；产品聚焦无征信信用卡和储蓄。
        - 薄信用档案消费信贷领域的墨西哥直接竞争者。
        - 确切估值未经公开验证；SOFIPO 牌照把存款保护限制在 25,000 UDIs，而 Plata 为 400,000 UDIs。
      - - Ualá (Mexico)
        - 持牌银行（CNBV Institución de Banca Múltiple）；私有公司；未披露 2025 年墨西哥特定估值
        - 完整银行牌照，监管地位与 Plata 相同；从阿根廷扩张而来。
        - 监管同等地位和目标客群重叠，使其成为相关护城河可比对象。
        - 未披露墨西哥特定指标；阿根廷母公司财务和拉美全域经营让直接比较变难。
    notes: 倍数锚点按 Plata 的 USD 596M 年化收入运行率计算（1Q26 IR 主页数据）。上市可比倍数反映大约 May 2026 的市场环境。私募可比倍数基于已披露融资规模和公开报道收入数字估算。
