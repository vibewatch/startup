      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >
              Plata 未公开披露净收入留存率、总收入留存率、流失率、续约率或时间序列队列留存数据。对投资人来说，这是重大尽调缺口：公司有 3.4M 活跃客户、声称估值
              $5B，却没有任何公开留存指标，无法区分这是一套高质量、黏性强的客户账簿，还是纯靠获客支出维持的高流失模型。该缺口与 Fitch 的观察一致：Plata「治理和控制的有效性」仍需更长时间检验。


              可用的留存代理指标都是间接的。信用卡循环结构天然带来重复使用：客户每月回来还款并继续消费，产生经常性交易数据。个人贷款（截至 3Q25 占资产组合
              6.5%）代表向现有持卡人的交叉销售，暗示一定关系耐久性。Plata Plus 订阅（MXN 39–99/月）——为更高额度和功能付费的层级——说明有一批高参与、高意图客户愿意支付经常性费用。


              反向信号来自资产质量轨迹：Fitch 数据显示，Stage 3（减值）贷款从 2024 年末 3.4% 升至 2025 年末 4.4%，再到 1Q26 的 4.8%。1Q26 风险成本为
              23.9%，「高于部分无担保消费银行同业」。这些指标说明一部分早期客户队列正在承受信用压力。不过，Fitch
              指出减值贷款「准备充足」，上升趋势部分由快速增长中的资产组合成熟解释。没有队列级数据，无法判断这是永久性信用损失，还是暂时的成熟效应。
