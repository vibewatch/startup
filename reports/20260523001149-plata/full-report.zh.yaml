  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Banco Plata 于 2026 年 2 月从 SOFOM 转为完整 Institución de Banca Múltiple，立即承接 Ley de Instituciones de
              Crédito（LIC）、CNBV Disposiciones de Carácter General、Banxico 支付系统规则和 CONDUSEF 消费者保护要求的完整监管栈。截至
              runDate，银行在新牌照下仅运营两个月，内部审计、董事会构成、独立董事、风险管理委员会报告等关键合规基础设施要么仍处萌芽期，要么未被公开验证。


              Fitch 2026 年 5 月首次 B+ 评级明确把治理不透明列为限制因素：董事会构成、独立董事，以及 CEO Neri Tollardo
              之外的高管深度均未公开披露。问责集中在单一具名高管身上，对一家受监管、吸收存款的银行构成较高治理风险。CONDUSEF 监督针对 Banco Plata
              的所有消费信贷投诉，并发布多元银行业季度申诉统计；投诉指数上升将是合规或产品设计失灵的早期预警。


              Ley para Regular las Instituciones de Tecnología Financiera（Ley Fintech，2018，经修订）监管基于技术的金融服务，并对 Plata
              这类通过数字渠道发放信贷的机构施加额外报告和运营要求。尽管 Plata 的银行牌照在技术上取代了部分 SOFOM 特定 Fintech Law 条款，重叠监管边界仍会给数字渠道义务（生物识别
              KYC、嵌入式数字钱包披露、DPA 数据处理者登记）带来解释风险，而这些义务尚未经执法检验。


              数据隐私风险直接来自 Plata 模式：银行为 3.4M 客户处理生物识别身份、地理位置、行为和金融数据。Ley Federal de Protección de Datos Personales en
              Posesión de los Particulares（LFPDPPP）及其 Reglamento 要求强制泄露通知、目的限制和数据最小化。INAI 可对每次违规处以最高 MXN 320 M 罚款。尚未发现针对
              Plata 的执法行动，但对任何处理敏感个人数据的大型数字银行来说，这都是结构性风险。


              墨西哥数字银行的 AML/CFT 风险较高：FATF 迟至 2021 年仍把墨西哥列入强化监控，CNBV 历史上曾因系统性 AML 失败处罚银行，包括 HSBC Mexico。Plata
              信用卡模式面向信用档案较薄的消费者，帮助其获得首个正式信用工具，因此受益所有人验证负担更高。尚未发现针对 Plata 的 AML 执法行动，但快速开户规模（不到四年 3.4 M
              客户）叠加有限的既往监管记录，需要持续监测。
            claimRefs:
