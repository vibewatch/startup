            title: 信贷质量是近期首要投资逻辑风险
            body: >-
              1Q26 风险成本为 23.9%、NPL 比率为 4.8%，较 2024 的 3.4% 上升，说明组合成熟后 损失高于模型假设。任何宏观恶化——IMF 已将墨西哥 2026 GDP 增长下修至
              ~1.0%——都可能 把 NPL 推高至 8% 以上；届时拨备会吃掉全部收入，投资逻辑失效。这是优先级最高的一项尽调。
