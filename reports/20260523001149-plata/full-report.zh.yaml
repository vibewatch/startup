      - number: '1.2'
        title: 创始团队与领导层
        blocks:
          - type: paragraph
            body: |
              Banco Plata 由 Neri Tollardo、Danil Anisimov 和 Alexander Bro 联合创立，三人都是俄罗斯
              Tinkoff Bank 老将，将数字银行经验用于墨西哥服务不足的信用市场。Neri Tollardo 担任 CEO
              （Director General），签署经审计财务报表，并在监管文件、投资者新闻稿和媒体采访中担任公司
              主要发言人。他公开把公司的技术基础和监管合规纪律列为关键竞争差异化。Tollardo 在 Tinkoff
              的经历——Tinkoff 是俄罗斯最早一批无网点数字银行之一——为 Plata 的墨西哥上线提供了运营蓝图。

              Vadim Shilyagin 担任 Director de Finanzas（CFO），Carlos Romero 担任 Contralor Financiero
              （Financial Controller）；两人均签署 2025 年经审计年度财务报表。完整董事会构成和独立董事
              未公开披露，Fitch 将其列为新设机构的治理限制。董事会结构不透明，使可识别关键人物风险集中在
              Tollardo 身上；多数监管和投资者沟通中，他是唯一具名高管。领导团队已证明能够大规模搭建数字
              信贷产品，但按照 Fitch 2026 年首次评级评估，其能否穿越完整信用周期、承担银行合规义务，并管理
              更加多元的产品组合，仍需更长时间检验。
