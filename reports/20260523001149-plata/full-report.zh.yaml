  - id: FV004
    title: 投资 KPI——IC 评分矩阵
    type: kpi
    notes: 面向 IC 的七个投资维度评分。分数是分析师基于截至 2026 年 5 月已披露证据给出的 1–5 分估计（1 = 很差，5 = 优秀）。
    data:
      items:
        - label: 市场机会
          score: 5
          detail: 墨西哥 USD 800B+ 消费信贷 TAM、46M 无银行账户 / 银行服务不足成年人、信用卡渗透率约 25% 且仍然偏低，以及数字化采用。未来 5–10 年存在结构性增长。
        - label: 产品-市场匹配证明
          score: 4
          detail: 3.4M 活跃客户、USD 596M 年化收入、Fitch 正面展望。牵引力强，但 NIM / 盈利能力仍为负。
        - label: 竞争护城河
          score: 3
          detail: CNBV 银行牌照和 IPAB 护城河真实存在，但 Klar 获批后可能被削弱。技术护城河由公司主张，尚未得到独立验证。
        - label: 单位经济模型
          score: 2
          detail: 1Q26 风险成本 23.9%、尚未盈利、运营亏损占平均资产 –16.5%。收入在增长，但拨备后的 NIM 很可能为负。
        - label: 风险画像
          score: 2
          detail: 高：Fitch B+ 投机级、暴露于信用周期、资金集中、监管合规不成熟、治理不透明。
        - label: 估值
          score: 2
          detail: 管理层声称 USD 5B，折合 LTM 收入 8.4x；对一家尚未盈利的银行来说偏贵。Series B 轮的 USD 3.1B（5.2x）更站得住。公开可比公司按收入 1.5–2.7x 交易。
        - label: 证据质量
          score: 3
          detail: 已有经审计的 2025 年财务报表；Fitch 评级附带数据；财报发布公开。股权结构表、NIM、CAC/LTV 和存款爬坡轨迹未披露。
