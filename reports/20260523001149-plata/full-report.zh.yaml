  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: |
              Banco Plata 的可服务市场覆盖墨西哥消费者金融服务生态：无担保消费信贷（信用卡、个人贷款）、存款和储蓄产品
              （交易账户、固定和灵活期限存款）、支付服务（境内转账、账单支付、Apple Pay 和数字钱包），以及早期投资产品
              （墨西哥和美国股票交易）。公司明确瞄准大众市场墨西哥消费者：无银行账户、银行服务不足，或被传统商业银行
              服务不佳的人群。CNBV、Banxico 和 INEGI 的 Encuesta Nacional de Inclusión Financiera（ENIF）均将这一
              群体记录为墨西哥金融体系的结构性特征，而非短暂缺口。

              不在 Plata 当前市场定义内的包括：企业和 SME 银行业务（仅有早期 PyME 产品）、按揭贷款（未提供）、保险和
              保证类产品（截至 1Q26 未提供），以及国际汇款（未上线）。Plata 信用卡的现状替代品，是 BBVA Mexico、
              Citibanamex、Santander、Banorte 和 HSBC Mexico 的传统银行信用卡；对银行服务不足群体而言，更常见的替代品
              是非正式信贷（tianguis 信贷、家庭借款和高利贷）。支付替代品是现金；按交易量计，现金仍是墨西哥主导支付工具。
              互联网和 app 金融服务（SPEI 转账、CoDi/DiMo、第三方支付 app）提供部分相邻替代。

              CNBV 采用分层牌照体系来界定竞争范围：Instituciones de Banca Múltiple（全服务银行，目前包括 Plata、Revolut
              和 Ualá）、Sociedades Financieras Populares/SFP（有限吸收存款，包括 Nu México Financiera），以及
              Instituciones de Tecnología Financiera（ITF，受 Ley Fintech 2018 监管，主要为 P2P 和众筹）。Banco Plata
              现在持有最宽的牌照层级，可通过 IPAB 提供存款保险（每名存款人最高 400,000 UDIs），并有权直接接入 Banxico 的
              SPEI 清算基础设施。
