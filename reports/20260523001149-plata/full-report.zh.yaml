      - number: '2.5'
        title: 规模缺口、矛盾与尽调问题
        blocks:
          - type: paragraph
            body: |
              多个重要缺口限制了对 Plata 具体机会进行市场规模测算的精确度。

              **ENIF 2024 尚未公开可得。** INEGI 的 ENIF 2024 调查是墨西哥成年金融普惠和产品使用情况最权威的来源，但截至
              runDate，完整结果无法通过 INEGI 网站取得（只有项目落地页在线）。公开可得的最近完整 ENIF 数据来自 ENIF 2021。
              这给权威普惠统计留下了 3 年数据缺口。

              **市场范围表述相互矛盾。** Plata 自身营销一方面称其服务“墨西哥大量银行服务不足人口”（TechFunding News 引用
              Plata 材料），另一方面称其为“拉丁美洲增长最快的金融机构”（Plata About 页面 / IR 站）。这些表述强调普惠叙事，
              却没有给出自下而上的市场规模估计。IR 站首页 KPI（$746M 总组合、3.4M 客户）意味着每名活跃客户平均未偿余额约
              ~$219——与大众市场、征信薄信贷相符，而非高端信用卡产品——但它占墨西哥消费信贷总市场的比例未被说明。

              **分析师市场规模估计不可访问。** Grand View Research、Mordor Intelligence 和 Business Research Insights
              都提供墨西哥数字银行市场报告，但完整数据被付费墙或注册表单拦住。Mordor 唯一可访问的标题页返回 404。没有第三方
              市场规模测算时，TAM 估计只能依赖自下而上的假设，不确定性更高。

              **信用卡发行份额说法未获独立核验。** TechFunding News 称，截至 2025 年 10 月，Plata “发行了墨西哥约 10% 的
              新增信用卡”。这是重要市场份额说法，但尚未得到 CNBV 统计发布或独立分析佐证。新增发卡总量的分母，也没有出现在单一
              可访问 CNBV 来源中。

              **IMF 金融普惠工作论文不可访问。** IMF 2022 年关于墨西哥金融普惠的工作论文（WP/22/209）只返回 IMF 首页，
              无法验证其中的规模估计和政策结论。
            claimRefs:
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 巨大的结构性普惠缺口创造持久 TAM
            body: >-
              墨西哥移动渗透率高（DataReportal 显示移动连接 97.3%），正式金融账户持有率长期偏低——World Bank Findex 和 INEGI ENIF
              均有记录——两者叠加，形成结构性庞大且持久的可服务市场。不同于数字银行主要替代存量机构的市场，墨西哥 可以大规模创造净新增客户，短期内降低 CAC 对竞争强度的敏感度。Fitch 的 'bb+'/Stable
              经营环境评估，以及其明确提到 “信贷渗透率低”这一驱动因素，都佐证这是持续机会，而非一次性机会。
