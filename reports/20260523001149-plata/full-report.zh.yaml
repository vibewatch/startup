  - id: FE001
    title: Banco Plata 产品架构栈
    type: stack
    layout: wide
    summary: |
      从客户界面到外部依赖的五层技术和产品栈，展示 Plata 完全自研的中间层，以及边缘位置的第三方集成。
    claimRefs:
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
    data:
      layers:
        - label: 客户界面层
          detail: >
            单一移动应用（iOS 版本 2.2.0；Android 包名 dif.tech.plata），集成 Mastercard 数字卡、Apple Pay 和 Google Pay。墨西哥 App Store 评分
            4.8/5，评论 287k 条。
          items:
            - iOS App（App Store ID 6443932656，版本 2.2.0，2026 年 5 月）
            - Android App（包名：dif.tech.plata）
            - Apple Pay 令牌化
            - Google Pay 令牌化
        - label: 产品模块层
          detail: |
            App 内上线五个产品模块：信用卡（旗舰）、借记 / 储蓄账户、定期 / 灵活储蓄、投资经纪（VestFi）和萌芽中的 SME 银行。Plata Plus 订阅解锁更高利率。
          items:
            - Plata Crédito — Mastercard 信用卡，最高 15% 返现，MSI
            - Plata Cuenta — 借记 + 7% 储蓄利率（Plata+）
            - Ahorro Flexible — 10%/7% 无锁定储蓄，IPAB
            - Ahorro Fijo — 9–11%/7–8% 定期存款，IPAB
            - 通过 VestFi 投资 — 12,000+ 种工具，CNBV 持牌
            - 个人贷款 — 基于信用卡历史交叉销售
            - PyME / Cuenta Empresa — 萌芽中的 SME 银行
        - label: 自研核心平台层
          detail: |
            Plata 工程团队全部自建（3,000+ 名员工，多数为 STEM 背景）：核心银行账本和交易引擎、AI 风险评分和自动化审批、CRM 与客户生命周期管理。
          items:
            - 自研核心银行系统（自有账本）
            - AI 驱动的自动化风险管理和信用评分
            - 内部 CRM 和客户管理
            - 自研移动 App 开发团队
        - label: 监管与金融基础设施层
          detail: >
            Banco Plata 持完整 CNBV 银行牌照运营（Institución de Banca Múltiple，2026 年 2 月获批）。IPAB 存款保险覆盖储蓄产品。Fitch B+ / Moody's
            A- 国内评级。债券发行计划最高 USD 200M。
          items:
            - CNBV 银行监管（Ley de Instituciones de Crédito）
            - Banco de México（Banxico）SPEI 结算监督
            - IPAB 存款保险，最高 400,000 UDI
            - 债券计划最高 USD 200M（高级无抵押）
        - label: 外部网络依赖
          detail: |
            边缘环节接入第三方：Mastercard 负责卡处理，Apple/Google 负责数字钱包，OXXO/Kiosko 负责现金交易，Fasanara Capital 提供信贷额度。
          items:
            - Mastercard（主会员 — 卡处理、令牌化）
            - OXXO / Kiosko（现金存款、支付）
            - Fasanara Capital（USD 100M 信贷额度）
            - Ambassador 配送网络（当天卡片物流）
