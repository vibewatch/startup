      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: |
              截至 2026 年第一季度，Banco Plata 累计完成超过 $2 billion 的股权和债务融资，是拉丁美洲资本化
              程度最高的金融科技公司之一。融资历史包括两轮主要股权融资和一笔重要债务工具：2025 年 3 月
              Series A 融资 $160 million，估值 $1.5 billion，由 Kora Management 领投，Moore Strategic Ventures
              及其他美国和欧洲投资者参投；随后在 2025 年 10 月完成 Series B 融资 $250 million，估值
              $3.1 billion，由 Kora 领投，Moore Strategic Ventures 继续参投，TelevisaUnivision、Audeo Ventures、
              Spice Expeditions、Hedosophia 以及多家美国和欧洲家族办公室加入。Fasanara Capital 于 2025 年
              5 月提供 $100 million 信贷额度。

              Different Technologies LLC 是位于美国的母公司，持有 Banco Plata 99.99% 股权，是最终控股股东，
              也是股权资本注入的主要来源。截至 2025 年 12 月 31 日，累计股本达到 MXN 10,244 million，仅
              FY2025 就注入 MXN 5,372 million。Kora Management 联合创始人 Nitin Saigal 是公开为 Plata 战略背书的
              主要机构声音。TelevisaUnivision 最初是营销合作伙伴，之后成为投资者，这强化了 Plata 面向墨西哥
              大众消费群体的分销渠道。完整股权结构表，包括精确投资者持股比例、优先股条款和清算优先权，
              仍为私有且未披露。
