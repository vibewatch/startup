      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: |
              四家直接数字挑战者（Nubank、Klar、Stori、Mercado Pago）都已把免年费信用卡作为标准入门产品，消除了 Plata 曾经的
              主要差异化。竞争压力转向三个二阶维度：产品广度和捆绑深度、储蓄收益率，以及分销效率。

              储蓄收益率方面，Klar（Plus/Platino 最高 15%）、Stori（最高 15%）和 Mercado Pago（最高 13%）都提供有竞争力或更高的
              收益。这带来实质性多平台并用风险：客户可能持有 Plata 信用卡用于消费，却把储蓄转到收益最高的平台，切碎单客收入。

              分销方面，Mercado Pago 拥有任何独立新银行都无法匹配的结构性优势。Mercado Libre 估计 45 million 墨西哥用户，让
              Mercado Pago 能以零边际成本交叉销售信用卡，并在 Mercado Libre 购物上提供独特的 24 MSI 好处。Nubank 推荐模型形成
              病毒式获客飞轮；Klar 的 CNBC Top 300 认可支撑有品牌背书的自然增长。Plata 主要依靠数字效果营销竞争，没有自有
              生态，因此相较 Mercado Pago，获客成本结构性更高。

              产品广度方面，Klar 以公开记录中最宽的产品集领先：信用卡、储蓄、个人贷款、投资回报、高端金属卡和 SME 银行业务。
              Nubank 和 Stori 是信用卡加储蓄账户平台，捆绑产品较少。Plata 已披露产品包括信用卡、储蓄账户（Cuenta Plata）和
              早期投资功能——大体匹配 Nubank 的广度。

              监管姿态方面，Plata 和 Ualá 作为完整 Instituciones de Banca Múltiple 处于最有利位置，可为每名存款人提供最高
              400,000 UDIs 的 IPAB 存款保险。持 SOFIPO 牌照的竞争者（Nubank 的 SFP 实体、Klar、Stori）提供的存款保护上限为
              25,000 UDIs——这一结构性限制对高余额存款人最重要，也让 Plata 在较高余额储蓄细分中拥有差异化卖点。
