      - number: '3.5'
        title: 护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: |
              Plata 的竞争护城河建立在三根支柱上：完整银行牌照（IPAB 覆盖、更广产品权限）、AI 承保能力（服务征信薄客户），以及在
              墨西哥大众数字信贷细分中的早期进入优势。每根支柱都有实质性侵蚀路径。

              **牌照护城河侵蚀：** Klar 的 CNBV 银行牌照申请若获批准，将直接消除 Plata 相对 SOFIPO 同业的存款保险差异。Ualá 已获牌照，
              证明取得完整银行牌照的门槛真实存在，但并非不可跨越。竞争者取得同等监管地位前，Plata 建立规模护城河的时间窗口可能比
              投资者假设更窄。

              **功能商品化：** Nubank、Klar、Stori 和 Plata 都大量推出免年费信用卡，说明卡产品本身已基本商品化。返现差异化也被侵蚀：
              Stori 提供最高 10% 品类返现，Klar Platino 则把更高返现与保险捆绑。Plata 的主要产品护城河必须随着竞争者以可比成本
              增加功能而持续上调。

              **资本不对称：** Nubank 在 NYSE 上市（市值 $15B+），让其可以用显著低于私营公司的成本取得股权资本。Klar 以 $800 million
              估值完成 $190 million Series D，说明投资者仍相信墨西哥除 Plata 外还容得下第三家全谱系新银行。这些资本充足的竞争者，
              能比 Plata 资产负债表可能承受的时间更久地维持低于成本定价（补贴收益率、返现）。

              **负面信号——监管投诉：** CONDUSEF 对墨西哥数字金融机构消费者投诉的监测，代表整个品类的运营风险。未经授权扣款、争议解决延迟、
              数据隐私问题的投诉率上升，是包括 Plata 在内的数字银行运营风险负面信号。

              **负面信号——风险成本：** Plata 在 2026 年 1Q 的风险成本为 23.9%（来自市场分析章节和 Fitch 材料），显著高于传统银行信用卡组合。
              竞争对手风险成本没有公开数据，因此无法判断 Plata 的承保表现与 Klar、Stori、Nubank 在同口径下孰优孰劣。
