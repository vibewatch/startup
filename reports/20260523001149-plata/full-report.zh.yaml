      - number: '5.5'
        title: 差异化与竞争定位
        blocks:
          - type: paragraph
            body: >
              Plata 的差异化建立在三个可验证支柱上：执行速度、自研技术和监管定位。

              执行速度：自 2023 年 4 月上线后，Plata 不到 30 个月就突破 2M 活跃信贷客户，公司和主投方 Kora 称这是拉美历史上最快的数字银行搭建速度。到 2024 年末，公司约占墨西哥所有新发信用卡的
              10%——这一指标得到 Techfundingnews.com 佐证。通过大使同日送卡的模式，消除了传统银行邮寄卡片 7–10 个工作日这一关键摩擦点。

              自研技术：多数墨西哥和拉美 fintech 挑战者依赖 Mambu、Temenos 或 Thought Machine 等核心银行平台，Plata 则内部自建核心银行系统、CRM 和移动
              app。这降低了第三方供应商集中风险和持续授权成本，也加快功能迭代；PRNewswire Series B 新闻稿中的 Kora 联合创始人称其代表「新兴市场数字银行的新标准」。这也让 Plata
              能在最初只有信用卡的产品上，18 个月内加上储蓄产品、投资和个人贷款。

              监管定位：Plata 现在是墨西哥仅有的 52 家 Instituciones de Banca Múltiple 之一，也是最近获牌机构中首家数字原生银行（Revolut 另于 2025 年末获牌）。相较
              Klar、Stori 和 Nubank Mexico（截至 2026 年 5 月只有部分或待批银行授权），这让 Plata 在吸收存款、发行债券和提供完整银行服务资格上拥有结构性优势。

              主要限制：没有公开 API 或开发者文档，没有开源存在，技术供应商栈未披露，也没有公开 SLA / 正常运行时间指标，因此管理层声称的技术护城河无法独立验证。最高 15%
              的高返现和有竞争力的储蓄利率仍在盈利前规模提供，形成结构性风险：差异化可能部分依赖补贴。
