      - number: '5.4'
        title: App 表现、可靠性与支持
        blocks:
          - type: paragraph
            body: >
              Plata 移动应用是所有银行操作的唯一客户触点。因此，可靠性和用户体验处在价值主张核心。iOS app（2.2.0 版，2026 年 5 月 14 日发布）已积累 287,000 个评分，墨西哥 App
              Store 平均 4.8/5——这是用户满意度的强信号。app 自称「新外观」的发布说明强调重新设计、更轻、更快、更现代的体验，显示 UX 持续迭代。Google Play 的 Android
              版本描述了相同功能：同日发卡、返现、2 个月付款弹性，以及用于安全线上购物的数字卡。

              支持基础设施记录为 24/7，通过两个渠道提供：电话（公开号码）和 app 内聊天。安全页面列出两条电话线。FAQ 页面回答 Plata Crédito、Plata Cuenta、Empresa
              账户和银行转账的常见问题。未发现公开状态页（正常运行时间 / 事故历史）；对评估运营风险的机构投资人来说，这是尽调缺口。

              Plata 2026 年及之后路线图包括工资账户入口（nómina）、SME 贷款扩张、国际转账能力，以及进入 Colombia。这些内容在 Bloomberg Línea（2025 年 10 月）披露，并由
              Fintech Futures 报道相互印证。银行法律页面还列出 Ahorro Garantizada 产品协议，显示一款新的担保储蓄产品在管线中。
