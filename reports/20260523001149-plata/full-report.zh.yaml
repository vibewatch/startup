      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Banco Plata 公开称自己是一个「高科技金融平台」，将「直觉化产品设计与先进 AI 技术结合」。基于已披露技术事实，其架构落在四个有文档支撑的支柱上：(1) 自研核心银行系统，(2) 内部搭建的 CRM
              和客户管理平台，(3) 自研移动应用（bundle ID: dif.tech.plata），以及 (4) AI 驱动的自动化风险管理和评分。

              Plata 工程团队设计了核心银行系统。2025 年 10 月 Series B 新闻稿称，该系统在全数字模式下支持「自动化风险管理和 24/7 个性化客户服务」。Elceo.com 关于 CNBV 银行授权的
              2026 年 2 月报道独立确认，Plata 自研核心银行系统、CRM 和应用，因此「能够简化流程并向用户提供即时解决方案」。技术栈被描述为云原生；创始团队来自 Tinkoff
              Bank（俄罗斯领先数字银行），两位联合创始人 Alexander Bro 和 Danil Anisimov 曾在那里搭建类似的高速数字银行基础设施。

              Plata Android 应用的 bundle 标识符为 dif.tech.plata，指向前身法律实体 Tecnologías Diffiere S.A.P.I. de
              C.V.，说明代码库延续自金融科技牌照阶段。iOS app（App Store ID 6443932656）于 2026 年 5 月 14 日更新到 2.2.0，显示仍保持活跃发布节奏。该 app 在墨西哥
              App Store 获得 287,000 个评分、平均 4.8/5，跻身墨西哥前三金融 app。GitHub 组织 github.com/dif-tech 没有公开仓库，确认 Plata
              源代码完全私有，未出现开源贡献信号。

              运营上，产品交付依赖三张外部网络：(1) Mastercard 负责卡处理和国际受理，(2) Apple Pay 和 Google Pay 负责数字钱包集成，(3) OXXO 和 Kiosko
              作为现金存入和收款点（列示费用分别为 MXN 30.17 和 MXN 12.93，另加 IVA）。Plata 不设实体网点；所有获客和开户都通过 app。实体卡由 Plata
              自有大使网络配送，可按客户指定地址和时间同日送达。

              到 2025 年末，总员工约 3,000 人（2023 年 4 月上线时为 100 人），公司自称有大量 STEM 人才在内部搭建银行技术。内部团队分为产品开发、业务开发和增长运营。
