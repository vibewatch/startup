      - number: '8.4'
        title: 稀释和优先权压力、退出准备度与回报情景
        blocks:
          - type: paragraph
            body: |
              **稀释跑道与下一轮压力。** Plata 的资本结构需要持续外部融资：2025 年净亏损
              MXN 1,978 million（~USD 99 million），贷款 / 存款比率为 933.5%，组合每增长一比索都需要批发或
              股权融资。按当前增长轨迹，银行需要在 Series B 交割后 18–24 个月内（即 mid-to-late 2027 前）
              新增一轮股权融资。Fitch 报告指出 FCC/RWA 资本化水平为 12.2%，增长压力正在累积。若没有新股权，
              随着组合增长，FCC/RWA 比率会跌破 CNBV 监管最低要求。每一轮新股权融资都会稀释现有股东；
              Series B 投资者的持股比例是移动靶。没有披露的股权结构表或优先认购权条款，就无法精确建模每轮稀释；
              但盈利前至少还需要一轮股权融资（可能为 USD 200–400 million），意味着若新一轮价格等于或低于
              Series B，Series B 前投资者会遭遇实质稀释。

              **优先股堆叠和清算瀑布。** 公开信息中没有 Series A 或 Series B 是否带有非参与型优先清算权、
              反稀释棘轮（广义加权平均或全棘轮）或参与分配上限。按这类阶段 Kora 领投风投轮的常见结构，
              标准条款会包括 1× 非参与型清算优先权，以及广义加权平均反稀释保护——这些条款对创始人尚可管理，
              但在降价轮情景下，如果总退出收入低于 USD 410 million（A+B 合计投入资本），普通股股东可能
              几乎拿不到剩余价值。优先权堆叠未披露，是阻碍精确回报建模的重大尽调缺口。

              **退出路径和时间线。** 三条可行退出路径存在：（1）在 NYSE、Nasdaq 或 BMV（Bolsa Mexicana de
              Valores）IPO；鉴于当前尚未盈利且公开市场上市需要监管记录，时间大概率不会早于 2027 或 2028；
              （2）被寻求快速获取墨西哥数字市场份额的大型金融机构（BBVA、Santander、Citigroup）或金融科技平台
              （MercadoLibre）战略收购；（3）继续作为私营公司，并通过老股流动性事件退出。Bloomberg Línea 文章
              提到 Plata 以 Compañía de Financiamiento 身份扩张至哥伦比亚，说明管理层正在搭建多市场平台，
              最终可支撑区域 IPO 或跨境战略出售。Iupana 文章指出，墨西哥数字银行市场正处在转型阶段，多家银行
              （包括 Nubank、Revolut 和 Plata）现在已持有完整银行牌照。

              **退出估值敏感性。** 若在 2027 或 2028 IPO，假设 Plata 实现 USD 1.0–1.3 billion 收入且净亏损收窄，
              公开市场 3–5× EV/收入倍数（与规模化但尚未盈利的 LatAm 数字银行一致）意味着企业价值为
              USD 3.0–6.5 billion。该区间低端对 2025 年以 USD 3.1 billion 进入的 Series B 投资者上行有限。
              高端（USD 1.3 billion 收入的 5×）需要强劲收入增长，并出现接近盈利的证据——这对应 2028–2030
              时间框架，持有期风险不低。

              **Series B 投资者回报情景。** 假设进入估值为 USD 3.1 billion，在 USD 1.2 billion 收入（2028E）
              上以 4× EV/收入退出，意味着 USD 4.8 billion EV——约 3 年总回报 55%，稀释前 IRR 约 16%。若再计入
              一轮以持平或小幅上调估值完成的 USD 300 million 股权融资，Series B 投资者会被稀释约 10–15%，
              净 IRR 降至约 12–14%。对一家新兴市场中高风险、尚未盈利的消费者信贷银行来说，这是合理但不突出的
              回报。若以 USD 5 billion 进入，则需要 USD 7.5 billion 退出（2.5× 总回报）才能达到同样的
              12–14% IRR——这要求乐观情景完全兑现。
