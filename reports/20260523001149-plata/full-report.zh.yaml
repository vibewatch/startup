      - number: '5.3'
        title: 监管合规、安全与信任控制
        blocks:
          - type: paragraph
            body: >
              Banco Plata 在墨西哥完整银行监管框架下运营。CNBV 于 2026 年 2 月授权 Plata 作为 Institución de Banca Múltiple 经营，银行业务于 2026 年 3
              月启动。该实体也受 Banco de México（Banxico）监管，并遵守 Ley de Instituciones de Crédito。拿到银行牌照前，公司以 Tecnologías Diffiere
              S.A.P.I. de C.V. 名义在 Ley Fintech 框架下运营。

              客户存款由 IPAB（Instituto para la Protección al Ahorro Bancario）保护，每人最高 400,000 UDI（约 MXN 3.5M）。Ahorro Flexible
              和 Ahorro Fijo 账户均适用。投资服务（VestFi）由 CNBV 作为独立投资顾问单独监管（CNBV 注册 30165）。

              评级方面，Fitch Ratings 于 2026 年 5 月给予 Banco Plata B+ 长期 IDR（正面展望），理由包括业务版图扩张、12.2% FCC/RWA
              的稳健资本水平，以及改善中的盈利轨迹。Moody's 给予 A- 国家尺度评级。无担保固定利率优先债券计划建立了最高 USD 200M 的债券发行能力，并列示在 ir.bancoplata.mx 投资者关系门户。

              面向客户宣传的安全控制包括「Escudo de Plata」（银盾），即 24/7 反欺诈技术层。app 提示用户实时冻结和解冻卡片，以防止未经授权扣款。作为 Mastercard
              主会员的认证提供底层卡支付安全框架，包括 Apple Pay 和 Google Pay 的 tokenization。公开了两条电话支持热线（+52 55 9990 8880 和 +52 55 2579
              0079）以及 app 内聊天；这些是欺诈和争议处理的主要渠道。

              反向观察：1Q2026 风险成本（贷款拨备费用占平均资产组合比例）为 23.9%，按 Fitch 分析，高于拉美可比无担保消费银行同业。Stage-3（减值）贷款比例从 2024 年的 3.4% 升至
              1Q2026 的 4.8%，显示增长加速时资产质量恶化。没有公开披露独立安全认证（ISO 27001、SOC 2、PCI DSS）；尽调应核实银行授权流程中是否已经取得这些认证。
