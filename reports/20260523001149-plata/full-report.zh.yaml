      - number: '8.2'
        title: 可比估值框架与倍数分析
        blocks:
          - type: paragraph
            body: |
              Banco Plata 当前阶段没有纯粹可比公司：它是墨西哥一家尚未盈利、以消费者信用卡为主的数字银行，
              February 2026 刚拿到银行牌照，年化收入为 USD 596 million。因此，最有用的基准组合需要分层：
              （1）大型上市 LatAm 数字银行，用来锚定公开市场上限；（2）墨西哥民营金融科技同业，用来比较
              私募轮；（3）全球尚未盈利的消费者信用卡挑战者银行，用作结构类比。

              **公开市场上限：Nubank (NYSE: NU)。** Nubank 是 Plata 最直接相关的公开可比公司：
              它同样是聚焦信用卡、无网点运营、面向原本服务不足人群的 LatAm 消费者数字银行。不过，
              Nubank 规模大一个数量级——在巴西、墨西哥和哥伦比亚拥有超过 100 million 客户，已经全面盈利
              （自 2023 起净利润为正），且 NYSE 上市带来透明披露。截至 May 2026，Nubank 市值约
              USD 15–17 billion。按 LatAm 全域大约 USD 10+ billion 的 LTM 收入基数，当前市值对应的
              EV/收入倍数约为 1.5–1.7×。仅 Nubank Mexico 到 April 2025 就有 10 million 客户——接近
              Plata 总活跃客户的 3×——并计划到 2030 年在墨西哥投资 USD 4.2 billion。把 Nubank 公开市场
              EV/收入区间（1.5–1.7×）套用到 Plata USD 596 million 收入运行率，得到的可比隐含价值约为
              USD 0.9–1.0 billion，远低于 Series B 标记。这个数字更像「成熟、规模化公开市场可比公司」
              的底部参考，并不适合作为锚点，因为 Nubank 已盈利、披露完整、产品宽度也大得多；Plata 可以
              获得成长溢价。

              **墨西哥民营金融科技同业。** Klar 以 SOFIPO 运营，拥有 7 million 用户，年化收入接近
              USD 300 million，2025 年完成 USD 190 million Series D，估值高于 USD 800 million——按其披露的
              年化收入约为 2.7× EV/收入。这个倍数有参考价值，但会低估 Plata 的监管护城河（完整银行牌照
              而非 SOFIPO）和更大的当前收入规模。Stori 是估值未披露的墨西哥独角兽，Ualá 则是持牌银行，
              二者都没有足够的公开验证可比指标。墨西哥民营同业支持的估值区间应高于 Klar 的
              USD 800 million，但低于最昂贵的全球金融科技可比公司；这与成长阶段墨西哥数字银行
              3–5× EV/收入区间一致。

              **全球消费者信用卡挑战者类比。** Fitch 评级报告明确以 LTM 口径将 Plata 1Q26 营业收入
              对标为 USD 112 million，同比 1.9× 增长，并指出这已超过拉丁美洲部分同评级银行。若沿着
              Fitch 预计的 B+/Positive 轨迹，12 至 18 个月内上调至 BB-，Plata 将接近新兴市场中投资级
              边缘消费者信贷同业。这类上调通常会打开更广的机构投资者基础，并支持倍数随时间扩张。

              **收入倍数框架。** 将一组 EV/收入倍数应用于 Plata USD 596 million 年化收入运行率，可得到
              以下估值锚点：
              3× = USD 1.8 billion（深度受压情景，低于已定价轮）
              5× = USD 3.0 billion（接近 Series B 锚点，反映激进增长但尚无利润）
              7× = USD 4.2 billion（溢价情景，需要信贷指标改善和存款爬坡）
              9× = USD 5.4 billion（愿景情景，需要清晰可见的盈利路径）
              USD 3.1 billion Series B 对应约 5.2×，相对拉美民营数字银行可比公司（Klar 为 2.7×）有合理溢价，
              反映 Plata 的完整银行牌照、更快收入增长和更大规模。管理层 USD 5 billion 说法对应约 8.4×，
              需要盈利证据出现阶跃变化、存款爬坡得到确认，或并购 / IPO 溢价；截至 May 2026，这些都没有
              公开验证。

              **反向证据：倍数压缩风险。** Fitch B+ 投机级评级意味着，受投资级约束的机构投资者不能持有
              Plata 债券，这限制了二级市场并带来再融资利差风险。下一轮股权融资若出现降价轮——而资本结构
              会要求 18–24 个月内再融资——估值锚点将被下调。墨西哥历次信贷周期修正（例如 2009 年 MXN
              消费信贷危机）显示，高收益消费者放贷机构的 NPL 比率可能在宏观冲击后四到六个季度内翻三倍。
              在当前 4.8% NPL、23.9% 风险成本下，中等程度的信贷恶化就会压缩投资者愿意支付的倍数。
