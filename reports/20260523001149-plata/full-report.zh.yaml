      - number: '7.2'
        title: 信用质量、资产质量与欺诈风险
        blocks:
          - type: paragraph
            body: >
              信用风险是 Plata 面临的最重要量化风险。Fitch 1Q26 数据显示风险成本为 23.9%——定义为贷款损失准备占平均贷款比例——Stage 3（NPL）比例为 4.8%，高于 2024 年
              3.4%。这些指标相对墨西哥传统消费信贷市场偏高；不过，Fitch 指出，它们处在新兴市场高收益消费信用卡贷款机构观察到的区间内，循环资产组合动态会让 NPL 在周期中段见顶。


              高信用损失的结构性驱动是 Plata 的目标客群：信用档案较薄、正式信用记录有限或没有正式信用记录的消费者，以列示 CAT 163.83%
              年化获取循环信贷。这个客群带来高收益，也在逆风经济环境中带来高核销概率。2025 年贷款损失准备 MXN 2,245 M（同比 +228%）消耗超过一半总净利息收入，使资产组合层面拨备后 NIM 为负。


              欺诈风险内生于全数字消费信贷：身份欺诈（合成身份、SIM-swapping、开户注册欺诈）、Plata Card 交易欺诈，以及账户接管攻击。Plata
              公开安全页面称，多因素认证、设备指纹和实时行为监控是缓释措施。可得来源中未发现 Plata 发生公开数据泄露或重大欺诈事件。不过，未披露欺诈损失指标、净核销率或回收率，是投资人完整承销前必须补上的尽调缺口。


              高循环利率（名义年化 99.9%）、快速客户增长和信用档案较薄借款人叠加，使 Plata 暴露在监管利率上限干预之下。墨西哥 CONDUSEF 和国会曾周期性讨论类似 Chile 和 Colombia
              已实施的信用卡利率上限；任何立法或监管利率上限都会直接压缩 Plata 收益率，并实质性损害当前商业模式的单位经济性。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: 流动性、融资与再融资风险
        blocks:
          - type: paragraph
            body: >
              Plata 的融资结构是重要中期风险。2025 年末，批发债务（银行贷款和债券）合计 MXN 11,698 M，自称加权平均期限较长，缓和近期再融资压力。不过，无抵押市场债务在 2025 年末占总融资
              48.8%，从 2023 年末的 0 上升——反映公司快速依赖资本市场，但尚无穿越信贷周期的表现历史。


              存款业务 2026 年 3 月中旬启动，1Q26 仅有 USD 78 M，对应 USD 746 M 总贷款，贷款 / 存款比率
              933.5%。只有存款账簿扩大后，这一比率才会压缩；对墨西哥数字银行而言，这一过程通常需要两到四年才有意义。在此之前，银行仍结构性依赖批发市场和周期性股权注入。


              墨西哥信贷环境或 Plata 自身信用评级一旦恶化，都可能缩窄甚至关闭机构融资市场入口，形成流动性悬崖。Fitch B+ 属投机级；受投资级约束的机构投资人（养老基金、保险公司）在结构上不能持有 Plata
              债券，限制投资人基础，并可能加剧利差波动。作为持牌银行，Plata 可使用 Banxico 紧急流动性工具，这是部分抵消因素，但从未经过检验。


              股权资本充足率（1Q26 FCC/RWA 12.2%）提供近期缓冲，但若资产组合继续按当前速度增长，18–24 个月内需要新增股权。公司过往融资记录（18 个月两轮股权融资）是正向缓释；不过，美国 VC
              市场——Kora Management 和 Moore Strategic Ventures 是主要股东——或墨西哥宏观环境若出现扰动，都可能延迟或阻断及时融资。
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
      - number: '7.4'
        title: 竞争与关键人物执行风险
        blocks:
          - type: paragraph
            body: |
              2026 年，墨西哥数字银行市场竞争急剧升温。到 April 2025，Nubank Mexico
              客户数超过 10 million，接近 Plata 3.4 million 的三倍；Bloomberg 称其为
              Nubank 集团全球增长最快的板块。到 late 2025，Klar 用户数突破 7 million。
              Stori 在 end-2025 融资 USD 150 million，用于加速墨西哥增长并扩张至哥伦比亚。
              MercadoPago 背靠 MercadoLibre 的 USD 7.6 billion 自由现金流和区域内
              100+ million 用户，靠嵌入式金融产品拿到巨大的分发优势。

              Plata 的竞争护城河主要压在自研 AI 风控、更好的移动 UX、以及当天送达的个性化卡片；
              只要资本足够，这些优势都能复制。Nubank 的规模更大，在信贷数据、资金成本和分发上
              形成网络效应；Plata 如果没有持续增长，很难追上。若 Nubank 和 Klar 先帮薄档案人群
              建立信用记录、挤压可服务市场，Plata 后续新增放款可能面临信用质量下滑，因为最优质的
              薄档案借款人会被竞争对手吸走。

              关键人物风险集中在 CEO Neri Tollardo。Fitch 首次报告指出，董事会构成和独立监督披露有限。
              创始团队的 Tinkoff 履历是优势，也带来声誉考量：三名联合创始人离开俄罗斯创办 Plata，
              但他们与任何俄罗斯机构不存在正式联系这一点，尚未得到独立确认。任何与创始人背景有关的
              不利地缘政治或声誉进展，都会形成头条风险，影响融资、监管姿态和客户信任。
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
