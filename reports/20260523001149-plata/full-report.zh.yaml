      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: |
              Plata 的主要目标，是落入三个重叠细分中的墨西哥大众成年消费者：（1）完全无银行账户、没有正式金融产品的成年人；
              （2）银行服务不足，持有基础银行账户（通常是传统银行的 nómina 或工资账户），但没有信用卡或储蓄工具的成年人；
              （3）“信贷服务不足”的成年人，虽有银行账户，却因信用历史薄而被传统机构拒绝授信。

              预算归属和支付路径：在信用卡模式中，付款方是个人消费者，买方和用户是同一个人（持卡人），授信决策由 Plata 的
              AI 承保引擎作出，没有中间方。相较企业或 B2B 金融产品，这简化了销售漏斗：没有企业采购周期，没有渠道转售商，
              也没有复杂的多利益相关方审批。

              纯数字银行所需的智能手机和互联网基础设施已广泛可得：DataReportal 显示，2024 年初墨西哥有 107.3 million
              互联网用户（渗透率 83.2%）和 125.4 million 活跃移动连接（占人口 97.3%），INEGI 的 ENDUTIH 2024 记录了
              智能手机持有和使用趋势。这意味着可触达的数字 TAM 实质上就是整个联网成年人口——若按各年龄段互联网使用率等比例估算，
              大约为 80–85 million 名成年人。

              次级细分包括墨西哥零工经济参与者（外卖骑手、网约车司机、自由职业者）。他们可能没有 nómina 工资流水，但有规律的
              数字收入——传统银行信用评分长期把这一群体排除在外。Plata 的 AI 承保（投资者材料和 Fitch 评估中“可靠管理团队”评论均有提及）
              正是为服务这类征信薄人群而设计。

              竞争对手分层：Nu México Financiera S.A. de C.V., SFP 按 Ley de Ahorro y Crédito Popular 牌照运营
              （范围比完整银行更窄），瞄准类似大众市场。Ualá, S.A., Institución de Banca Múltiple 拥有完整银行身份，
              目标客群类似。Revolut Bank S.A. 在墨西哥启动完整银行业务，这是其首个非欧洲银行市场，据称更聚焦数字化程度较高的城市消费者。
