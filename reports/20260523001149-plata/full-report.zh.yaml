      - number: '7.5'
        title: 运营、网络安全和合作伙伴 / 依赖风险
        blocks:
          - type: paragraph
            body: |
              Plata 100% 数字化、单办公室模式带来集中的运营风险：没有分支网点分摊负载，
              线下运营没有地理容灾，整个客户体验都压在自研核心银行平台上。核心平台一旦长时间
              中断——无论源于软件缺陷、DDoS 攻击还是云厂商故障——3.4 million 账户的放款、
              支付和客服都会立即停摆，且没有线下备份。安全页面确认了标准控制（MFA、设备指纹、
              实时监控），但公司尚未公开第三方渗透测试结果、SOC 2 认证或 ISO 27001 审计。

              云基础设施集中是结构性依赖。Plata 尚未公开披露云厂商，但其工程团队（GitHub:
              dif-tech）使用的基础设施即代码工具，与超大规模云（AWS 或 GCP）一致。墨西哥区域内
              单一云厂商宕机，在中断期间足以让运营面临生存级风险。墨西哥金融监管机构（CNBV）
              已开始发布云外包指引，但截至 May 2026，面向新银行、具备强制执行力的云专项运营韧性
              测试尚未公开强制实施。

              卡组织依赖（Visa 或 Mastercard——Plata 未披露是哪一家）是核心信用卡产品的关键
              单点故障。卡组织协议若被终止或发生重大修改，Plata 的主要收入来源将被切断。同样，
              Plata 持有每名存款人最高 MXN 3 M 的存款保险（IPAB），保护仍处早期的 USD 78 M
              存款账簿；但 IPAB 覆盖上限意味着，一旦失败，超过上限的任何存款余额都没有担保。

              控股公司结构（Different Technologies LLC，Delaware）带来监管边界风险：CNBV 只监管
              Banco Plata S.A. 这一持牌实体，而美国控股公司的义务、关联方交易和受益所有人披露，
              仍在墨西哥监管边界之外，且尚未公开披露。
