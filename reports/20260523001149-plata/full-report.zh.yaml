  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: |
              Banco Plata 身处拉丁美洲竞争最激烈的数字银行市场之一。竞争集合横跨四类：直接数字挑战者（Nubank、Klar、Stori、
              Mercado Pago 和 Ualá）、传统存量银行（BBVA México、Citibanamex、Santander、Banorte、HSBC）、相邻支付收单进入者
              （Clip），以及定义基线的现状替代品——现金和非正式信贷；Plata 必须从这些替代品中转化用户。

              直接数字挑战者是主要竞争威胁。四家公司都提供免年费信用卡、有竞争力收益的数字储蓄账户，以及完整移动优先开户。
              这种结构性趋同意味着产品平价基本达成，竞争差异化已经上移：监管地位、产品广度、单位经济和分销渠道力量才是关键。

              传统存量银行——以 BBVA México（墨西哥资产规模最大银行）为首——在品牌信任、实体分销和既有客户关系上有结构性优势。
              但它们网点重的成本结构，以及长期较差的信贷普惠记录，为数字优先运营商留下了持续入口。

              Clip 等相邻进入者只在商户支付和收单领域竞争，不发行消费者信贷。Clip 对受理网络形成互补性竞争压力，而不是直接的
              信用卡竞争对手。潜在未来进入者包括正在评估墨西哥的国际新银行（例如已获得完整银行牌照的 Revolut）和本土电信关联金融服务。
            claimRefs:
