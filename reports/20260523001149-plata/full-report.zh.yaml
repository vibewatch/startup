      - number: '4.2'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >
              Plata 的单位经济性是高收益 / 高风险，与面向信用档案较薄借款人的消费信用卡业务一致。公示利率（年化 99.9%）与 Klar 和 Stori 的同类产品相当；循环账簿的实际收益率未公开。Fitch
              估计，运营亏损 / 平均资产从 2025 年的 -28.1% 改善至 1Q26 的 -16.5%，确认公司正向盈亏平衡移动，但缺口仍大。

              2025 年贷款损失准备消耗 MXN 2,245M（同比 +228%），相当于拨备前总 NII 的 54%，合计产生信用损失后的负净息差。Fitch 数据显示 1Q26 风险成本为
              23.9%，高于拉美部分无担保消费金融同业。Stage 3（NPL）比例 1Q26 为 4.8%，高于 2024 年 3.4% 和 2025 年末
              4.4%——这与资产组合快速增长和高风险客群一致；但考虑到信用卡高度循环、能及时暴露逾期趋势，仍处在管理层所称控制区间内。

              2025 年运营费用 MXN 5,785M（同比 +101%，与审计 MXN 5,777M 基本一致），相当于净经营收入（MXN 2,726M）的 212%、总收入（业绩公告口径）的约
              81%。薪酬结构体现了技术和数据科学搭建：银行只在 CDMX 设一个办公室。递延所得税资产 MXN 1,457M（2025 年末）来自累计税亏结转，只有银行产生应税收入后才能兑现。尽管资产接近翻三倍，净亏损仍从
              2024 年 MXN 2,150M 收窄至 2025 年 MXN 1,978M，说明资产组合成熟后经营杠杆在改善。

              CAC、LTV 和回本周期均未披露；信用卡同日个性化配送模式和纯数字获客渠道意在压低 CAC，但没有独立来源确认任何指标。交换费收入嵌在「佣金」科目中，未单独披露。
