  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 改变判断的证据
    rows:
      - - 估值锚点推进
        - Series A USD 1.5B（March 2025）→ Series B USD 3.1B（Oct 2025），7 个月上调 2×，背后有真实收入加速。
        - USD 5B 管理层说法意味着 7 个月再上调 61%，但没有新的定价轮或独立标记。
        - 若 Series C 或老股交易定价达到或高于 USD 4.5B，可确认这次上台阶。
      - - 收入增长动能
        - 1Q26 年化运行率 USD 596M；2025 年收入较 2024 年增长 3.3×；Fitch 显示 1Q26 总营业收入同比增长 1.9×。
        - 收入质量参差——业绩新闻稿与 MX FRS 审计报表分类不同；拨备后的真实 NIM 未披露。
        - 若经审计的 1Q26 MX FRS 财务报表清楚披露 NIM、拨备和 NII，可消除歧义。
      - - 银行牌照护城河
        - >-
          2026 年 2 月获得完整 CNBV Institución de Banca Múltiple 牌照——墨西哥数字挑战者中首家——可提供 400,000 UDIs 的 IPAB 存款保险，而 SOFIPO 对手仅
          25,000 UDIs。
        - Klar 收购 Bineo（Banorte 数字部门）仍待监管批准；若获批，护城河消失。
        - 应跟踪 Klar 监管结果和时间表，它是直接的护城河侵蚀信号。
      - - 资本充足性
        - Fitch 显示，FCC/RWA 12.2%、有形权益 / 资产 11.8% 是相对优势；18 个月内完成多轮股权融资的记录已得到验证。
        - 组合增长和经营亏损会在 18–24 个月内消耗资本，需要再次稀释性融资。
        - 即便只是指引性披露，盈利时间表和存款爬坡轨迹也有助于建模稀释路径。
      - - 信贷质量趋势
        - NPL 率 4.8%、风险成本 23.9%，仍在新兴市场高收益循环消费信贷的预期区间；Fitch 指出「高增长下资产质量仍受控」。
        - 两个指标 2025 年较 2024 年均恶化（NPL 3.4% → 4.8%；损失拨备同比 +228%）；99.9% APR 模型容易受到 CONDUSEF 利率上限干预。
        - 若 NPL 率连续两个季度企稳或下降，将强化信贷质量论点。
      - - 可比估值支撑
        - Klar（估值 USD 800M，收入约 USD 300M）意味着 SOFIPO 的 EV/revenue 约 2.7×；Plata 有银行牌照、规模更大、增长更快，应享有溢价。
        - Nubank——唯一完全可比的上市拉美数字银行——尽管已盈利且墨西哥客户数约为 Plata 的 3×，LTM EV/revenue 仍只有 1.5–1.7×。
        - 如果 Plata 跑出可信的盈亏平衡路径，相对 Nubank 当前倍数给 4–5× 溢价可以讨论。
    notes: 反向逻辑主要来自估值证据缺口和信贷周期暴露，并非根本怀疑 Plata 的经营模式。
