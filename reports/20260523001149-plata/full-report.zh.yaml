      - number: '1.5'
        title: 规模、关键指标与风险信号
        blocks:
          - type: paragraph
            body: |
              截至 2026 年第一季度，Banco Plata 披露 3.4 million 名总活跃客户、$746 million 总贷款组合，以及
              $596 million 年化收入（均按其投资者关系首页以 USD 披露）。截至 2025 年 12 月 31 日，总资产达到
              MXN 17,427 million，较 2024 年 12 月年内增长 186%。到 2025 年底，净贷款组合为 MXN 9,998 million
              （年内 +171%），由强劲信用卡增长和持续扩大的个人贷款账簿驱动。2025 年第四季度单季收入创纪录，
              达 MXN 2,507 million（同比 +212%，环比 +24%）。

              收入快速增长之下，Banco Plata 尚未盈利。FY2025 净亏损 MXN 1,978 million（按约 20 MXN/USD 折算约
              $99 million），较 2024 年的 MXN 2,150 million 有所改善，但累计经营亏损仍在堆高。Fitch 于
              2026 年 5 月 6 日发布首次评级（B+ IDR，正面展望），给盈利与盈利能力打出较弱的 'ccc+'，并指出
              1Q26 经营亏损 / 平均资产比率为 -16.5%（低于 2025 全年的 -28.1%）。资产质量压力正在上升：
              Stage 3 贷款比例在 1Q26 达到 4.8%（高于 2024 年底的 3.4%），风险成本为 23.9%，相对许多消费信贷
              同业偏高。强资本化（1Q26 Fitch Core Capital/RWA 为 12.2%，总资本化比率为 18.0%）以及成立以来
              超过 $500 million 的股东注资，部分抵消了上述风险；但能否持续盈利、能否守住资产质量纪律，仍是
              该行长期信用画像的关键未解问题。
