      - number: '2.2'
        title: 市场规模——多重视角
        blocks:
          - type: paragraph
            body: |
              三个独立测算视角都指向一个庞大、但边界并不精确的市场。

              **视角 1——成年人口与金融账户缺口。** DataReportal 显示，2024 年 1 月墨西哥总人口约
              128.9 million。按成年人口（15+ 人群）约 70% 估算，成年人口约 90 million；World Bank 的 Global Findex
              数据库把正式金融账户持有率作为主要普惠指标。INEGI 与 CNBV、Banxico 每两到三年合作开展的 ENIF，是国内权威来源；
              截至 runDate，ENIF 2024 数据仍在处理中。普惠缺口意味着仍有数千万成年人无银行账户或征信薄，为数字优先进入者
              提供了庞大的可触达人群。

              **视角 2——信贷渗透率。** Fitch Ratings 在 2026 年 5 月对 Banco Plata 的首次评级行动中，明确把“墨西哥信贷渗透率低”
              列为 Plata 核心信用卡业务持续需求的结构性驱动。Fitch 对墨西哥银行的经营环境评估为 'bb+'/Stable，反映其预期
              尽管存在宏观逆风（GDP 增速放缓、贸易不确定性、外部地缘政治风险），整体环境仍大体具备韧性。墨西哥信贷 / GDP
              比率显著低于巴西、智利、哥伦比亚等区域同业，为信贷组合扩张留下空间。Plata 自己的 4Q2025 业绩发布记录显示，
              净贷款组合同比增长 +171% 至 MXN 9,998 million，与其在低渗透市场中快速拿份额一致。

              **视角 3——市场份额与新卡发行。** TechFunding News 于 2025 年 10 月报道称（引用 Plata 在 Series B 当时的
              投资者材料），Plata 发行了墨西哥约 10% 的新增信用卡。如果墨西哥每年新增信用卡发行量估计为 8–12 million 张
              （基于 CNBV 实体数据趋势），这意味着 Plata 每年新增 800K–1.2M 张新卡，与其 2025 年 10 月至 2026 年 5 月
              活跃客户从 2 million 增至 3.4 million 的披露增长相符。

              矛盾和规模测算缺口很重要：没有单一公开来源给出墨西哥纯数字银行板块的明确总可服务贷款余额或存款余额。
              Grand View Research、Mordor Intelligence 等供应商的分析师报告提供了市场规模标题，但网页抓取未能取得可访问全文。
              2025 年 10 月 Bloomberg Línea 文章称墨西哥是“拉丁美洲竞争最激烈的金融科技市场之一”，但没有给出自下而上的市场规模估计。
              IMF 关于墨西哥金融普惠的工作论文也无法检索。这些缺口限制了精确度；区间估计和矛盾保留在证据缺口中。
