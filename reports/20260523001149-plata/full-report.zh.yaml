      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: |
              **Nubank México（Nu México Financiera S.A. de C.V., SFP）** 按规模看，是 Plata 最强的直接竞争对手。Nubank 以
              Sociedad Financiera Popular（SFP）身份在 CNBV 授权下运营，墨西哥客户已超过 10 million，是其全球第二大市场。
              Nubank 在 NYSE 上市（股票代码：NU），市值超过 $15B，能以任何墨西哥私营金融科技公司无法获得的成本取得股权资本。
              其信用卡免年费、免补卡费，支持灵活分期方案（Compras Diferidas、Plan de Pagos Fijos），并集成 Apple Pay /
              Google Pay。Cuenta Nu 增加储蓄 / 借记账户。Nubank 基于推荐的获客模型，形成口碑飞轮，补充付费营销。

              **Stori（Stori México, S.A. de C.V., SOFIPO）** 是墨西哥独角兽，率先为无银行账户墨西哥人推出无需征信记录的信用卡。
              Stori 按 Ley de Ahorro y Crédito Popular 获 CNBV 授权并受其监管，提供免年费信用卡，指定商户类别最高 10% 返现，
              信用额度最高 MXN 220,000，且不要求信用历史。Stori 已扩展到储蓄产品，年化收益最高 15%。其 SOFIPO 牌照把存款保护
              限制在 25,000 UDIs，低于 Plata 的 IPAB 覆盖。

              **Klar（Klar Technology México S.A. de C.V., SOFIPO）** 报告称 2025 年用户达到 7 million，按客户数计是墨西哥第二大
              SOFIPO。Klar 新闻室披露，年化收入接近 $300 million USD，2025 年 $190 million Series D 后估值 $800 million，
              单用户服务成本 $0.75（约为传统银行 10%），活跃用户收入超过 $11。Klar 于 2024 年向 CNBV 申请完整银行牌照
              （Institución de Banca Múltiple）。其产品组合包括信用卡、最高 15% 年化投资回报（Plus/Platino）、个人贷款、
              Klar Empresarial（提供工资和最高 MXN 5M 循环信用的 SME 银行业务），以及 Klar Platino（带 Chubb 保险的高端金属卡）。
              Klar 连续两年入选 CNBC Top 300 Fintechs。

              **Mercado Pago México** 是 MercadoLibre（NASDAQ: MELI）的金融服务部门。Mercado Pago 不是银行，通过
              Mercado Lending S.A. de C.V. 运营，提供免年费 Visa 信用卡、最高 13% 年化收益的数字账户、QR 支付、POS 终端和
              商业账户。Mercado Pago 的分销护城河是结构性的：Mercado Libre 在墨西哥估计有 45 million 用户，提供任何独立新银行
              都拿不到的自有交叉销售基础。该信用卡在 Mercado Libre 购物可享 24 个月 MSI，形成独立发卡方无法复制的生态锁定。

              **Ualá（Ualá, S.A., Institución de Banca Múltiple）** 从阿根廷进入墨西哥，并获得 CNBV 完整银行牌照。Ualá 以信用卡
              和数字账户瞄准与 Plata 相同的无银行账户和银行服务不足人群。Ualá 的完整银行身份给予其与 Plata 相同的 IPAB 保险优势，
              但品牌认知度更低，披露的墨西哥特定指标也更少。

              **BBVA México** 是墨西哥资产规模最大的银行。其宽产品组合——按揭、汽车贷款、工资账户、投资、信用卡——以及估计
              20-25 million 客户基础，给了它存量护城河；数字挑战者无法仅靠品牌信任或实体分销复制这种优势。

              **Clip** 是一家服务微型和 SME 商户的墨西哥支付终端公司，提供 POS 设备、QR 支付系统和收单服务。Clip 不发行消费者
              信用卡，不是 Plata 核心信用卡市场的直接竞争对手。
