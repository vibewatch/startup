              Google Play 列表显示 5M+ 下载，显著高于 3.4M 活跃客户数，说明下载到活跃转化存在一定摩擦，或存在客户流失。个人贷款 2024 年推出，并在 9M2025 期间从资产组合的 3.6% 增至
