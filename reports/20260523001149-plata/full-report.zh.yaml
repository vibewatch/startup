  - id: TR005
    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 信贷质量恶化
        - CNBV 月度组合数据；Fitch 季度跟踪
        - NPL 率连续两个季度 > 8%
        - 投资逻辑破裂：拨备吃掉全部收入；必须全面暂停尽调
      - - 流动性 / 再融资压力
        - Plata 证书债券利差；CNBV 流动性比率
        - 债券利差 > 1,000 bps，或 CNBV 流动性覆盖率违规
        - 投资逻辑破裂：批发融资市场即将关闭；评估救助融资情景
      - - 监管执法
        - CNBV 或 CONDUSEF 新闻稿；DOF 官方公报
        - 任何整改措施、放贷叫停或牌照处罚
        - 投资逻辑破裂：放贷叫停 = 收入立即断崖；评估退出
      - - 竞争性市场份额流失
        - CNBV 行业信用卡组合份额；Nubank / Klar 客户公告
        - 相较过去四个季度，Plata 的净新增客户份额流失 >10 ppts
        - 警示：定价压力信号；需要复核产品差异化
      - - 资本充足压力
        - Fitch 跟踪评级；CNBV 资本充足率报告
        - FCC/RWA 低于 10%，或 Fitch 下调至 B 或以下
        - 投资逻辑有条件成立：下一轮股权融资必须在六个月内完成，否则投资逻辑破裂
      - - 核心人物离职
        - 监管文件；媒体；LinkedIn
        - CEO 离职，且没有具名、具备 CNBV 监管资质的继任者
        - 警示：触发对领导层连续性和投资人信心的独立评估
      - - 比索贬值 / 宏观冲击
        - Banxico 汇率；IMF 墨西哥 GDP 修订
        - 12 个月内 MXN 对 USD 贬值 > 20%，或 GDP 增长 < 0%
        - 观察：抬高 USD 股权成本，并可能挤压薄信用档案客群的信贷质量
      - - 数据泄露 / 网络安全事件
        - INAI 泄露通知；媒体；CONDUSEF
        - 任何影响 > 100,000 条客户记录的重大泄露
        - 投资逻辑有条件成立：INAI 罚款 + 声誉损失可能损害获客
    notes: 阈值是定性的投资监控触发项，不是契约条款；它们按公司概况和财务章节建立的投资假设校准。所有触发项至少应按季度监测。
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 投资建议
        - 观察 / 监测 — 建设性但价格敏感
        - 不要把未经验证的 USD 5B 管理层说法当成买入信号。Series B 的 USD 3.1B 定价相对合理；若新进入价格高于 USD 4.2B，需要看到明确盈利改善。
      - - 估值立场
        - USD 5B 偏高；USD 3.1–4.2B 区间合理
        - USD 5B 下安全边际很薄。按公开可比公司口径，入场价贴近或低于 Series B 锚点更站得住。
      - - 信心
        - 中
        - 增长轨迹清楚；盈利时间表、股权结构和存款爬坡仍不清楚。
      - - 风险评级
        - 高
        - 尚未盈利、Fitch B+ 投机级评级、23.9% 风险成本、933.5% 贷款 / 存款比，以及融资结构集中。
      - - 核心估值锚点
        - Series B USD 3.1B（Oct 2025）— 最近一次硬定价事件
        - 目前最好的公开标记；USD 5B 说法是未经验证的管理层沟通。
      - - 入场纪律
        - 倾向于在 USD 4.2B 或以下入场（7× LTM 收入运行率）
        - 等待可验证的存款爬坡或亏损收窄趋势，比在证据出现前为 USD 5B 付费更理性。
      - - 上调触发项
        - 存款达到 USD 300M+、风险成本降至 <20%，或下一轮定价股权融资确认估值上台阶
        - 会收紧乐观情景，让 USD 5B–6B 在前瞻倍数上站得住。
      - - 主要下行触发项
        - NPL 率 >7%、批发债务再融资受阻，或墨西哥宏观下行落地
        - 可能把公允价值压到 USD 1.8–2.5B 的下轮降价区间。
    notes: 评估是价格敏感判断，不是泛泛的公司质量判断。「合理」指有定价轮次和公开可比证据支撑，不代表内在确定性。
