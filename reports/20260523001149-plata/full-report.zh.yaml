      - number: '7.6'
        title: 宏观 / 外汇风险、投资逻辑失效触发器和终止标准
        blocks:
          - type: paragraph
            body: |
              宏观和外汇风险是次要但实质的敞口。Plata 以 USD 融资（Series B 估值 USD 3.1 B），
              但收入和亏损几乎全部以 MXN 产生。比索贬值会抬高 USD 融资成本，并压缩向投资者报告的
              USD 等值业绩指标。IMF April 2026 World Economic Outlook 预计，墨西哥 2026 GDP
              增长约 1.0%，显著低于大多数墨西哥金融科技扩张模型所依赖的 2.0%+ 假设，主要受美国
              关税不确定性和跨境贸易减少拖累。更深的衰退会压低薄档案客群的消费者信贷质量，造成
              NPL 加速上行与批发融资市场收紧同时发生的局面。

              最直接损害 Plata 投资逻辑的五个触发器是：（1）NPL 比率持续超过 8%（连续两个季度），
              这意味着即便按当前收入运行率，拨备成本也无法被吸收；（2）失去 CNBV 银行牌照，或收到
              重大纠正行动令；（3）信贷市场关闭，使 MXN 11,698 M 批发融资账簿无法在六个月窗口内
              通过债券或贷款再融资；（4）CEO Neri Tollardo 离任，且没有具备同等监管声望的指定继任者；
              （5）CONDUSEF 或 CNBV 采取任何监管执法，要求暂停新增放款——这一「放款停止」情景曾击垮
              多家更早期的墨西哥 SOFOM 放贷机构。

              监控指标包括：Banco Plata 月度 CNBV 组合质量数据；该行相对行业平均的季度 CONDUSEF
              投诉指数；未偿 Plata 证书债券利差（作为批发融资成本代理）；Fitch 评级行动和展望变化；
              以及任何点名 Banco Plata 的 CNBV 或 CONDUSEF 新闻稿。这些信号通常滞后一个到三个月，
              因此相对上述终止标准更像先行指标，而非同步指标。
            claimRefs:
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
