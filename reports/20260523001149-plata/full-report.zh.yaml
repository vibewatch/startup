              1Q26 贷款 / 存款比率为 933.5%，批发债务为 MXN 11,698 M，使 Plata 对机构信贷市场 格外敏感。B+ 投机级评级让投资级投资者被结构性排除在外，债券持有人基础更集中，也带来
              利差波动风险。USD 78 M 的存款业务几乎无法抵消。这一融资风险会在压力情景下放大信贷风险。
