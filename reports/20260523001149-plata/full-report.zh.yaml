  - id: FI002
    title: 单位经济桥 — 从客户活动到净收入
    slug: unit-economics-bridge
    type: flow
    layout: standard
    summary: |
      Plata 信用卡客户活动如何转化为收入、信用损失和净利差。节点为定性描述；数值来自公开披露的近似推导。
    approximationNotes: |
      已实现收益率、CAC 和单客净利差未公开披露。节点中的数值根据披露利率（99.9%）、风险成本（23.9%）、CAT（163.83%）以及估计年化单客收入（约 USD 175）推导。所有数字仅作指示；非直接来源处均标注“估计”。
    data:
      nodes:
        - id: acquisition
          label: 获客
          detail: 纯数字渠道；当天送卡；零开办费；CAC 未披露
        - id: card_issuance
          label: 信用卡发放
          detail: 通过 Mastercard 发行 Plata Crédito；信用额度由 AI 风控审批设定；Plata Plus 可选
        - id: spend
          label: 持卡人消费
          detail: 产生交换费（约占 GMV 的 1–2%，计入费用收入）；特定购买最高 15% 返现是成本
        - id: revolves
          label: 客户循环欠款
          detail: 墨西哥约 50–70% 消费者信用卡客户会循环欠款（估计）；按 99.9% 年利率计息
        - id: interest_revenue
          label: 利息 + 费用收入
          detail: 循环客户总收入约 163.83% CAT；扣除免息期全额还款客户后，已实现收益率更低
        - id: credit_loss
          label: 信用损失（23.9% CoR）
          detail: 1Q26 Stage 3 NPL 为 4.8%；风险成本每年消耗总组合约 24%
        - id: net_margin
          label: 估计单客净收入
          detail: 总收入约 USD 175/年（估计）；再扣除约 23.9% 信用损失和资金成本；当前规模下净利差为负
      edges:
        - from: acquisition
          to: card_issuance
          label: 数字化开户
        - from: card_issuance
          to: spend
