      - number: '4.5'
        title: 证据附录
        blocks:
          - type: callout
            title: 收入会计差异：MX FRS vs. 业绩公告
            body: >
              Plata FY2025 报告利息收入在独立审计的 MX FRS 财务报表（MXN 2,895M）和 4Q2025 业绩公告（MXN 5,999M）之间差异很大。这不是舞弊——差异来自银行牌照前 SAPI
              会计处理：循环信贷收费（GAT 中超出简单利息的组成部分）在部分 NIF 规则下列为佣金，随后在业绩公告口径中重列为利息。总收入更接近（审计 MXN 6,606M vs. 业绩公告 MXN
              7,118M）。投资人应要求提供调节说明。
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
          - type: callout
            title: 资本注入依赖：股权就是商业模式
            body: >
              Plata 的 MXN 10,244M 股本构成高于负债的全部融资基础。MXN 5,117M 留存亏损已经消耗所有注入股本的一半。银行 2026 年需要持续股东支持（Fitch
              明确预测）来在增长同时维持资本率。任何盈利延迟或投资人支持中断，都会快速侵蚀 12.2% FCC/RWA 缓冲。这种结构性依赖是最大单项财务风险。
            calloutType: risk
            claimRefs:
