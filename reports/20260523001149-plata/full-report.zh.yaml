  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、估值锚点和股权结构考量
        blocks:
          - type: paragraph
            body: |
              Banco Plata 已公开披露两轮股权融资：March 2025 的 USD 160 million Series A，估值
              USD 1.5 billion，由 Kora Management 领投，Moore Strategic Ventures 及其他美国和
              欧洲投资者参与；October 2025 的 USD 250 million Series B，估值 USD 3.1 billion，
              仍由 Kora 领投，Moore Strategic Ventures 继续参与，并新增 TelevisaUnivision 作为
              战略锚定投资者。两轮合计股权融资约 USD 410 million。Fitch Ratings 在 May 2026 发布
              首次 B+ 评级时指出，累计注入股权超过 USD 500 million，说明控股股东在这些轮次前还
              投入了额外资本。Plata IR 主页称累计债务和股权融资合计超过 USD 2 billion，反映出在
              股权之上叠加了大量批发债券发行（end-2025 为 MXN 11,698 million）。

              最近一次有价格的硬锚点是 USD 3.1 billion 的 Series B，按当前汇率约等于 MXN 62 billion。
              October 2025 新闻稿和 Bloomberg Línea 报道均确认这一数字。不过，公司 About 页面在
              May 2026 运行日写明估值为 USD 5 billion，比不到八个月前的上一轮定价高 61%。公开来源中
              未发现新的新股融资轮、老股交易或独立第三方估值可确认这次上调。USD 5 billion 数字似乎
              来自管理层沟通或媒体描述，尚未由有价格的融资事件、审计师或评级机构估值背书。

              进入价格纪律需要考虑资本结构：公司架构中，Banco Plata S.A. 是美国注册控股实体
              Different Technologies LLC 的 99.99% 子公司。受益所有权未公开披露。治理文件
              （Estatutos Sociales）已发布，但没有公开股权结构表细节、优先权堆叠机制或反稀释条款。
              股权结构表缺乏透明度——包括优先分配瀑布、清算优先权、任何棘轮或参与分配安排，以及
              Different Technologies LLC 与其投资者之间的确切持股结构——对任何新投资者都是重大尽调缺口。
              Kora Management 连续两轮领投，意味着其持有重要少数股权，但创始团队、Kora、Moore、
              TelevisaUnivision 和其他投资者之间的精确股权拆分仍未披露。

              进入纪律框架还必须计入债务压力。end-2025，该行持有 MXN 11,698 million（~USD 585 million）
              批发债务（债券和银行贷款），以贷款组合和银行经营资产作担保。Fitch 虽指出加权平均期限较长，
              但任何股权估值分析都必须在 EV 到股权价值的桥接中扣除净债务。粗略按净债务调整，若以
              USD 3.1 billion 企业价值锚定，股权公允价值约为 USD 3.1 billion 减 USD 585 million
              （批发债务）加 ~USD 240 million（现金），即落在 USD 2.75 billion 左右——也就是说，
              Series B 投资者支付的约是 USD 2.75 billion 股权价值，而不是 USD 3.1 billion EV。
              若采用 USD 5 billion EV 说法，股权价值约为 USD 4.65 billion，距离可辩护的公开可比区间更远。

              存款业务在 mid-March 2026 推出，1Q26 只有 USD 78 million，而贷款总额为 USD 746 million，
              贷款 / 存款比率达到 933.5%。银行牌照创造了未来选择权：存款规模扩大后，资金成本结构会改善，
              股权故事也会更强。不过，墨西哥数字银行通常需要两到四年才能把存款做出有意义的规模，因此
              任何由存款驱动的估值提升，最早也是 2027+ 的事情。
