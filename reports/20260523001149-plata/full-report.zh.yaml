          - type: callout
            title: 多平台并用是默认消费者行为——不是忠诚度
            body: >-
              墨西哥新银行市场呈现多归属特征：消费者通常同时持有多家发行方信用卡，也会把储蓄账户分散到不同平台以优化收益。Plata
              的活跃卡占总卡量比例和每活跃客户消费额（未公开）最能判断它是否已成为用户主卡，还是仍只是多归属钱包里的第二张卡。
