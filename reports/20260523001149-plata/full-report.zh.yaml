      - number: '4.3'
        title: 资本充足率、融资与现金跑道
        blocks:
          - type: paragraph
            body: >
              Plata 自创立至 1Q26 累计募集超过 USD 500M 股权资本（Fitch）；IR 首页则称累计完成「+$2B 债务 + 股权融资」。最近一次股权注入是 2025 年 10 月以 USD 3.1B
              估值完成的 USD 250M Series B，支撑 4Q 2025 资产组合增长，并叠加同季 MXN 2,638M 债券发行。2025 年末总权益 MXN 5,127M（约 USD 256M），对应累计亏损
              MXN 5,117M；MXN 10,244M 股本反映全部实缴权益。

              截至 1Q26 的资本指标（Fitch）：Fitch 核心资本 / RWA 12.2%，有形权益 / 资产 11.8%，总资本充足率 18.0%。Fitch
              将这些水平描述为相对优势，较部分本土同业更好，同时指出激进贷款增长带来压力。Plata 已持有完整银行牌照（2026 年 2 月 17 日获批；2026 年 3 月 19 日开业），因此必须维持 CNBV
              监管资本底线。

              2025 年末批发债务融资合计 MXN 11,698M，由银行贷款和债券发行构成。无抵押融资（市场债务）占总融资比例从 2023 年末的 0 升至 2025 年末的 48.8%，说明资本市场渠道快速成型。IR
              债券列表页确认已有活跃债券发行。Fitch 指出，加权平均债务期限较长，缓和了近期再融资风险。

              存款业务 2026 年 3 月中旬启动，1Q26 存款 USD 78M，贷款 / 存款比率 933.5%——反映存款动员仍处极早期。Ahorro Flexible 总利率 7%、Ahorro Fijo
              7–7.25%，存款成本初期会高于银行间拆借利率，但随着存款账簿扩大，可能相对批发债券发行降低资金成本。

              不含贷款发放的运营现金消耗（即净亏损加回非现金项目）2025 年约 MXN 1,979M。若计入贷款组合增长（营运资本），经营活动现金流为 MXN -8,152M（业绩公告），主要由 MXN 11,764M
              资本注入和借款覆盖。2025 年末现金 MXN 4,790M、年化运营烧钱约 MXN 2B，纯现金跑道（不含资产组合增长资金需求）约 24–30
              个月。不过，持续扩大资产组合需要持续外部融资；以当前亏损率，银行无法自我融资。
