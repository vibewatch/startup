              - CI021
              - CI022
              - CI028
          - type: callout
            title: 正向轨迹：规模扩大下亏损收窄
            body: >
              尽管 2025 年总资产接近翻三倍，Plata 净亏损从 MXN 2,150M 收窄至 MXN 1,978M。拨备后 NII 转正（MXN 1,875M）。运营亏损 / 资产从 -70.8%（2024）改善至
              -28.1%（2025），再到 -16.5%（1Q26）。这正是 Fitch 正面展望的经营杠杆前提。若 1Q26 轨迹延续，2026 年按净经营口径（运营费用前）可能实现盈亏平衡。
