  - id: TV005
    title: 投资逻辑破裂与终止触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - NPL 率飙升
        - Stage 3（NPL）率连续两个季度超过 7%
        - 拨备成本压过 NII；经营亏损扩大；资本充足被侵蚀的速度快过股权融资修复；公允价值压缩至 USD 1.8–2.5B 悲观情景区间。
        - 暂停新增资本承诺；复核既有持仓是否减值。
      - - 批发融资中断
        - 无法以 <500bps 利差再融资到期债券，或银行同业授信撤回
        - 流动性悬崖迫使组合增长冻结，或以严重稀释完成紧急股权融资；下轮降价风险急剧上升。
        - 立即尽调债务到期表和契约条款；评估潜在强制出售情景。
      - - CONDUSEF / 立法利率上限
        - 国会或行政部门把信用卡利率上限压到 60–70% APR 或以下（智利 / 哥伦比亚先例）
        - 直接压缩 99.9% 名义年利率；循环贷款账簿单位经济转负；必须转向费用和交易收入，却没有时间重建。
        - 按不同上限阈值做收入影响情景分析；立即下调至悲观情景。
      - - Klar 银行牌照获批
        - CNBV 批准 Klar 通过收购 Bineo 取得银行牌照
        - Plata 的主要监管护城河（IPAB 400,000 UDI 优势）被抹平；来自按近似客户数计最大 SOFIPO 的竞争压力加剧。
        - 重新评估可比组中的银行牌照溢价；相应下调倍数。
      - - 存款爬坡失败
        - 截至 2026 年底存款仍低于 USD 150M（上线后超过 9 个月）
        - 融资成本优势逻辑没有兑现；批发债务依赖无限期延续；下一轮股权融资面临下轮降价风险。
        - 降低乐观情景概率权重；将中枢估计推向基准 / 悲观边界。
      - - 核心人物离职
        - CEO Neri Tollardo 离职，或 CNBV 对具名高级管理层采取执法行动
        - 治理不透明放大核心人物风险；机构投资人可能冻结动作，直到继任得到确认。
        - 立即开展治理尽调；在清晰前暂停买入建议。
    notes: 投资逻辑破裂触发项对应可监测事件，来自公开披露、Fitch 季度数据、CONDUSEF 报告、CNBV 监管沟通和监管新闻流。
