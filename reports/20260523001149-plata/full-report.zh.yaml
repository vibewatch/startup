  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Banco Plata 的目标客户是银行服务不足或刚进入银行体系的墨西哥消费者——年龄 18–45 岁、有智能手机，但此前正式信用记录有限或没有正式信用记录的人。价值主张结合三根杠杆：(1)
              通过自有大使网络同日配送实体卡，绕开传统银行常见的数周等待；(2) 真实比索返现（可选类别），奖励可立即使用，而不是锁在积分体系里；(3) 60
              天付款窗口且无滞纳金，为收入周期不规则的消费者提供弹性；这类情况在墨西哥庞大非正规经济中很常见。


              公司完全在消费 B2C 垂直运营。没有 B2B 或 SME 信贷产品（评估时 platacard.mx/en/pyme 页面无法访问）。分销走两条渠道：移动 app（iOS 和
              Android）负责完全自助开户，大使配送网络负责实体卡物流。借记账户（Plata Cuenta）和储蓄产品（Ahorro Fijo、Ahorro Flexible）在 2026
              年初取得银行牌照后推出，把可触达客户从只有信贷用户扩展出去。投资服务（股票、ETF 和基金购买）通过与 VestFi 的白标合作提供，VestFi 是 CNBV 注册的独立投资顾问。


              地域几乎全在墨西哥，发卡集中在大使网络能保证同日服务的城市地区。Colombia 市场进入于 2025 年 8 月启动，结构是一家储蓄 / 存款 Compañía de
              Financiamiento——比墨西哥信用卡业务足迹小得多。
