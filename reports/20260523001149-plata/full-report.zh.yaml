            title: 竞争对手单位经济性仍不透明——反向情景不能排除
            body: >-
              没有一家墨西哥新银行竞争对手公开披露其墨西哥业务的风险成本、净息差或实体层面盈利能力。Klar 的 $300M 收入和 $0.75
              服务成本指向较强单位经济性，但信用质量和净利润仍未知。反向情景是：竞争对手为抢份额补贴信用卡发行，以牺牲盈利为代价制造短期定价压力，但这种模式并不具备结构性可持续性。
