      - number: '6.5'
        title: 扩张与集中风险
        blocks:
          - type: paragraph
            body: >
              Banco Plata 在产品、地域和客户画像三条维度上集中风险较高。信用卡约占 3Q25 贷款组合的 93.5%（个人贷款 6.5%）；储蓄和存款产品到 2026 年 3 月才上线，规模可以忽略（USD 78M
              存款 vs. USD 746M+ 贷款）。地域收入完全来自墨西哥；2025 年 8 月宣布的 Colombia
              储蓄业务仍处早期，未披露客户或存款指标。客户基础偏向此前正式信用记录有限的消费者——相比优质借款人，这一群体通常对宏观冲击（失业、通胀）更敏感。


              办理摩擦对部分目标客户确实构成门槛：Plata 要求智能手机、墨西哥 CURP/ID，以及银行级自拍 / 生物识别才能开户。数字优先流程比传统银行更快，但排除了约 18% 无智能手机接入的墨西哥人（据 INEGI
              ENDUTIH 2024）。大使送卡模式把银行带到客户身边，部分缓和摩擦，但也造成城市地区物流集中。


              没有公开记录显示 Plata 依赖渠道合作伙伴或经销商；Plata 直接面向消费者获客。投资产品由 VestFi 白标提供，形成对一个受 CNBV 监管第三方的产品层依赖。CONDUSEF
              消费者保护框架为客户提供针对 Banco Plata 的正式投诉机制，具体机构投诉页登记在 CONDUSEF 的 banca múltiple 注册体系中。截至运行日期，CONDUSEF
              门户未按单一机构公开披露投诉量数据。
