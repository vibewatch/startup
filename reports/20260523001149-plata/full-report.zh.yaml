  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户价值主张
        blocks:
          - type: paragraph
            body: >
              Banco Plata 的产品矩阵截至 2026 年 5 月覆盖五个不同金融垂直，全部只能通过 iOS 和 Android 移动应用访问。

              Plata Crédito 是旗舰信用卡，以 Plata 作为 Mastercard 主会员发行。它列示普通年利率 99.9%（sin IVA），总年度成本（CAT）为 163.83%。前三个月后收取 MXN
              199/年会员费；无开卡费、无补卡费。标志性功能包括两个月付款弹性窗口（无滞纳金）、最高 15% 的真实现金返还（用户自选类别）、用于安全线上支付的数字卡，以及通过 Plata
              大使网络同日配送实体卡。分期转换（Meses Sin Intereses，MSI）提供 3/6/9/12 个月选项，并按档收费。公司正是靠这张卡，在不到三年内把客户基础从零做到 3.4M 活跃客户。

              Plata Cuenta 是一款计息交易借记账户：Plata Plus 订阅用户前 MXN 20,000 享受年化 7%。它位于 Plata
              扩张存款业务的中心，可收付款、缴账单，并作为所有其他产品的资金账户。Ahorro Flexible（无锁定储蓄）对 Plata Plus 二级订阅用户支付年化 10%，不设余额上限（非订阅为
              7%），利息按日计提，并由 IPAB 保护至 400,000 UDI（约 MXN 3.5M）。Ahorro Fijo（定期存款）在 Plata Plus 下提供 30–360 天期、年化 9–11%（非订阅
              7–8%）；相对墨西哥传统银行有利率竞争力。

              投资模块由 VestFi（Asesor en Inversiones Independiente，CNBV 注册 30165）运营，提供股票、ETF 和投资基金入口，覆盖 12,000+
              全球工具，包括美股上市公司（Google、Apple、NVIDIA）。平台将自己定位为墨西哥首个一体化投资 app，并提供 AI 驱动的个性化推荐和锦标赛式游戏化活动。

              个人贷款于 2024 年推出，2025 年前九个月在总资产组合中的占比从 3.6% 增至 6.5%。PyME（小微企业银行）列在主导航中，但具体产品细节未公开。Plata Plus 是订阅层级（MXN
              39–99/月，相当于授信额度 1%），解锁更高返现、更高储蓄利率和优先服务。
