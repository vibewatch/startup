            title: 负面——竞争趋同压缩 SAM 窗口
            body: >-
              Bloomberg Línea（2025 年 10 月）记录称，Nubank、Revolut、Klar 和 Ualá 正在同时获取或运营完整墨西哥银行牌照。 在资金充足的全球竞争者形成规模前，Plata
              签下无银行账户 / 银行服务不足客户的窗口正在收窄。Nubank 的拉丁美洲打法—— 用信用卡奖励亏损引流、激进数字营销，并最终交叉销售存款——已在巴西证明能压缩新卡 CAC。墨西哥面临同样的压缩动态， 可能让
              Plata 在 SAM 中的先发优势被侵蚀得比市场本身增长更快。Fitch 关于竞争以及所有玩家“高增长胃口”的提示， 是 SAM 利润率持久性的负面信号。
