chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与基础
        blocks:
          - type: paragraph
            body: |
              Banco Plata S.A., Institución de Banca Múltiple 是墨西哥增长最快的数字银行，
              2021 年 5 月 24 日以 Tecnologías Diffiere S.A.P.I. de C.V. 名义依法设立，并于
              2022 年 8 月 1 日启动贷款业务。2026 年 2 月 17 日，CNBV 通过官方函件
              312-1/708647/2026 批准其开展完整银行业务，公司由此完成向持牌多功能银行机构的转型。
              Banco Plata 是 Different Technologies LLC 直接持股 99.99% 的子公司；后者是位于美国的
              控股实体，最终受益所有人未公开披露。

              公司总部位于 Mariano Escobedo 476, Primer Piso, Colonia Anzures, Alcaldía Miguel Hidalgo,
              Ciudad de México（C.P. 11590），以 100% 数字银行运营，不设实体网点。核心商业模式围绕
              消费者金融服务展开——以 Plata Card 信用卡（最高 5% 返现、60 天付款窗口）为锚，叠加个人贷款、
              储蓄产品（Ahorro Flexible 和 Ahorro Fijo）以及投资账户。公司自称按客户数计是墨西哥最大的
              私营数字银行，拥有超过 3 million 名活跃信用卡用户，并声称截至 2026 年 5 月估值 $5 billion。
              Banco Plata 与 Nubank、Klar、Ualá 等区域数字银行挑战者直接竞争；这些公司都在申请，或已在近期
              获得墨西哥银行授权。公司完全自研的 AI 驱动核心银行平台，让其无需网点网络也能跑通全自动
              风险管理和 24/7 个性化客服。
