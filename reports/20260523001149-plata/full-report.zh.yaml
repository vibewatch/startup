companyProfile:
  summary: >
    Banco Plata S.A., Institución de Banca Múltiple——通过 platacard.mx 以消费品牌 "Plata" 运营——按客户数计， 是墨西哥增长最快的数字银行。公司于 2021 年 5
    月 24 日以 Tecnologías Diffiere S.A.P.I. de C.V. 名义依法设立，并于 2026 年 2 月 17 日转换为 CNBV 完整银行牌照；2023 年 4 月，公司公开推出 Plata
    Crédito Mastercard 信用卡。到 2026 年 1Q，Plata 已做到 3.4 million 活跃客户、USD 746 million 总贷款组合和 USD 596 million
    年化收入——商业化运营不到三年。2025 年 10 月 Series B（USD 250 million、 USD 3.1 billion 投后估值，Kora Management 领投）是最近一轮定价股权融资；截至 2026 年
    5 月 About 页面所称 USD 5 billion 估值在此列示，但尚未独立核验。公司的母控股实体是 Different Technologies LLC（US），联合创始人为 Neri Tollardo（CEO）、Danil
    Anisimov 和 Alexander Bro， 三人均曾任 Tinkoff Bank 高管。Fitch Ratings 于 2026 年 5 月给予 Banco Plata B+ 长期 IDR 和正面展望，
    反映强增长轨迹，同时受尚未盈利、高风险成本和治理不透明拖累。用户提供的域名 plata.com.mx 未被确认 是活跃的 Plata 资产；已核验运营域名为 platacard.mx 和 bancoplata.mx。
