      - number: '8.3'
        title: 乐观、基准和悲观情景：假设、估值区间和概率信号
        blocks:
          - type: paragraph
            body: |
              三个情景围绕关键摆动变量搭建投资判断：存款业务爬坡、信贷损失轨迹、监管稳定性、收入增长和
              外部股权市场准入。这些情景是按概率加权的分析师估计，锚定已披露估值标记、经审计 2025 报表和
              1Q26 Fitch 数据中的财务指标，以及可比市场观察；它们不是管理层的前瞻指引。

              **乐观情景（20% 概率信号）。** 乐观情景需要四件事同时发生：（1）存款业务从 1Q26 的
              USD 78 million 扩大到 mid-2027 的 USD 500 million+，相对批发债券显著降低资金成本；
              （2）年化收入从 USD 596 million 增至 end-2027 的 USD 1.1–1.3 billion，驱动来自客户数从
              3.4 million 增至 5–6 million，以及个人贷款、Ahorro 产品和未来薪资 / SME 产品带来的 ARPU 扩张；
              （3）随着组合成熟，风险成本稳定在 20% 或以下，且 Fitch 评级在 18 个月内上调至 BB-，打开更广的
              投资者基础；（4）资本市场继续开放，允许再进行一轮 USD 300–500 million 区间、更高估值的股权融资。
              在乐观情景下，对 USD 900 million 2026E 收入应用 7–9× EV/未来收入倍数，可得到
              USD 4.5–6.3 billion 的公允价值区间，大体验证管理层 USD 5 billion 说法，并相对当前进入价提供上行。

              **基准情景（50% 概率信号）。** 基准情景假设收入继续强劲增长（USD 596 million 年化收入到
              end-2026 增至 USD 800–950 million），但单位经济没有阶跃变化：风险成本仍高达 20–25%，经营亏损
              收窄但最早到 2027–2028 才能盈亏平衡，存款增长慢于乐观情景（end-2026 为 USD 150–250 million）。
              Fitch 正面展望维持，但未来 12 个月不上调。在基准情景下，对 2026E 收入中点
              USD 850 million 应用 5–6× EV/收入倍数，得到 USD 4.25–5.1 billion 公允价值——这意味着按当前轨迹
              回看，Series B 定价合理，而管理层 USD 5 billion 说法位于可辩护基准区间上沿，但并非明显错价。
              基准情景对进入纪律最关键：它告诉投资者，Series B 支付 USD 3.1 billion 是合理的；但今天以
              USD 5 billion 进入的新投资者，是在基准情景区间顶部买入，安全边际有限。

              **悲观情景（30% 概率信号）。** 悲观情景反映信贷周期恶化和融资市场收紧的组合。若墨西哥经济
              明显放缓——这与 IMF 对关税风险升高下墨西哥贸易依赖型经济的下行情景一致——NPL 比率可能在两到三个
              季度内从 4.8% 升至 8–10%。在 30% 风险成本下，贷款损失拨备会吃掉全部总 NII，经营亏损会扩大而非收窄。
              同时，若信贷市场收紧（例如美国衰退或新兴市场资本外逃驱动），批发债券可能无法以可接受利差再融资，
              迫使公司以显著更低估值进行高度稀释的股权融资；在极端情景下，还会把组合增长压到覆盖固定成本所需的
              盈亏平衡速度以下。Klar 待批的银行牌照若获批，也会比预期更早消除 Plata 最主要的监管护城河。
              在悲观情景下，对更低的 USD 600–700 million 2026E 收入（反映信贷标准收紧导致增长放缓）应用
              3–4× EV/收入倍数，得到 USD 1.8–2.8 billion 公允价值——相对 Series B 是降价轮情景。
              悲观情景还考虑 CONDUSEF 信用卡利率上限立法风险；若落地，将直接压缩支撑当前经济性的 99.9% 名义年利率。

              **概率加权中枢估计。** 按概率信号加权三个情景，得到约 USD 3.3–4.0 billion 的概率加权公允价值
              （20% × USD 5.4B 中点 + 50% × USD 4.7B 中点 + 30% × USD 2.3B 中点 ≈ USD 3.8B）。这个值明显高于
              Series B 锚点，但低于管理层 USD 5 billion 说法，说明 Series B 投资者在基准轨迹下有合理预期回报，
              而以 USD 5 billion 进入的新投资者主要押注乐观情景。
