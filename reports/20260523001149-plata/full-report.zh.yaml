      - number: '1.4'
        title: 监管路径与公司里程碑
        blocks:
          - type: paragraph
            body: |
              Plata 从消费信贷公司转型为持牌银行，经历了多年监管流程。公司于 2021 年 5 月依法设立为消费贷款实体，
              2022 年 8 月启动法律意义上的运营后，于 2023 年 4 月公开推出 Plata Card 信贷产品。2023 年至
              2024 年，公司按 CNBV 标准搭建核心银行基础设施和合规系统，并在 2024 年推出第二款产品个人贷款。

              关键监管拐点出现在 2024 年 12 月 16 日：CNBV 批准 Banco Plata 从 Tecnologías Diffiere
              S.A.P.I. de C.V. 转型为完整 Institución de Banca Múltiple。2025 年 1 月 15 日，采纳新银行章程的
              法定股东大会正式公证并向 CNBV 备案。2026 年 2 月 17 日，CNBV 通过官方函件 312-1/708647/2026
              授予开始银行运营的最终授权；根据 Fitch 首次评级评估，完整银行运营于 2026 年 3 月启动。从牌照批准
              到完整运营授权之间接近 14 个月，反映 CNBV 对资本充足、治理和合规的严格要求。Banco Plata 是
              墨西哥首批完成这一监管转型的纯数字银行之一，在 CNBV 框架下比 Mercado Pago 和 Nubank 更早取得
              运营银行身份。
