  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与来源
        blocks:
          - type: paragraph
            body: >
              Plata 的收入模式本质上是一门高收益循环消费信贷业务，主要靠三类机制赚钱：信用卡余额的净利息收入，费用和佣金收入（交换费、取现费、订阅、MSI 重组），以及投资产品（Ahorro Fijo、Ahorro
              Flexible、券商业务）和外汇带来的附加收入。

              Plata Crédito 信用卡列示普通年利率 99.9%（sin IVA），对循环借款客户的总年度成本（CAT）为
              163.83%。在免息期内全额还款的客户不贡献利息，因此交易型客户占比是实际收入收益率的关键未知数。每笔取现 10% + IVA 的费用和每次 MXN 400 的逾期罚金补充了利息收入。Plata Plus
              订阅计划每月按授信额度 1% 收费（最低 / 最高 MXN 39–99，另加 IVA），形成一层不大但可预测的经常性收入。

              2025 全年 4Q 业绩公告披露利息收入 MXN 5,999M、费用 MXN 1,119M；而独立审计的 MX FRS 报表披露利息收入 MXN 2,895M、已赚佣金 MXN
              3,202M。这是重大的会计分类差异，反映银行牌照前 SAPI 阶段在部分 NIF 规则下把循环信贷收费列为佣金而非利息。两套报表均由管理层在不同监管框架下编制；审计数是主要记录来源。2025 年收入约为
              2024 年的 3.3×（审计利息收入 MXN 2,895M 对 MXN 658M），印证资产组合快速放大。

              按业绩公告口径，4Q2025 季度收入达到 MXN 2,507M，同比 +212%、环比 +24%，接近约 MXN 10B 的年化运行率。IR 首页确认截至 1Q26 年化收入 USD 596M（按当前汇率约
              MXN 11.9B），这是公开可得信息中最前瞻的数字。吸收存款于 2026 年 3 月中旬启动，随着时间推移，储蓄账簿也会形成资金成本与净利差模型。
