  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 估值区间
      - 核心假设
      - 主要失败模式
    rows:
      - - 悲观
        - 30%
        - USD 1.8B–USD 2.8B
        - 墨西哥宏观下行；NPL >7–10%；批发融资收紧；风险成本 >30%；可能出台利率上限立法；信用卡渗透率增长停滞；存款爬坡失败。
        - 墨西哥 GDP 同比收缩 >1%，或美国衰退触发新兴市场资本外流，批发债务市场关闭，同时 NPL 飙升。
      - - 基准
        - 50%
        - USD 3.0B–USD 4.2B
        - 到 2026 年底收入增至 USD 800–950M；风险成本稳定在 20–25%；存款达到 USD 150–250M；经营亏损收窄；Fitch 正面展望维持；无重大信贷或监管冲击；下一轮股权融资估值持平或小幅上调。
        - 信贷周期温和转差，限制收入增长并推高拨备，但不演变为全面危机；IPO 推迟至 2028–2029。
      - - 乐观
        - 20%
        - USD 4.5B–USD 6.3B
        - >-
          到 2027 年中存款扩大至 USD 500M+；到 2027 年底收入达到 USD 1.1–1.3B；风险成本改善至 <20%；Fitch 升级至 BB-；IPO 或战略出售窗口在 2027–2028
          打开；哥伦比亚和墨西哥业务同步扩张。
        - 资本市场转向不利于新兴市场消费信贷，或 IPO 窗口在 Plata 盈利前关闭。
      - - 概率加权中枢估计
        - 100%
        - 约 USD 3.3B–USD 4.0B
        - 未来 12–18 个月，随着存款爬坡和信贷质量数据累积，证据缺口收窄；USD 5B 需要对乐观情景赋予更高权重。
        - 在存款爬坡和盈利证据出现前支付 USD 5B，任何下行事件都会让缓冲很薄。
    notes: 情景区间是分析师估计，以十亿美元计，锚定 Series B 定价轮、行业 EV/revenue 可比值和 Fitch 财务数据，而非未披露的管理层指引。概率信号是说明性信号，不是数学概率。
