      - number: '3.4'
        title: 转换成本与锁定动态
        blocks:
          - type: paragraph
            body: |
              墨西哥面向消费者的金融产品，正式转换成本相对低：信用卡除信用额度关系外没有合同锁定，储蓄账户也可同时开立。
              多平台并用（同时持有多个新银行账户）是主导消费者行为，而不是排他忠诚。不过，几个结构性锁定机制创造了不对称竞争护城河。

              **生态锁定（Mercado Pago）：** Mercado Pago 信用卡利益在 Mercado Libre 生态内最大化——Mercado Libre 平台购物 24 MSI、
              QR 支付集成，以及卖家争议自动授信。重度使用 Mercado Libre 的客户无法用其他信用卡发行方复制这些利益，因此 Mercado Pago
              在该客群内拥有黏性主卡地位。

              **雇主层级锁定（Klar Empresarial）：** Klar 的 SME 银行产品集成工资发放、公司卡发行和循环经营信用额度。通过 Klar
              发工资的公司，会为每名员工被动创建 Klar 账户，提供一条零增量成本的消费者银行获客渠道，完全绕开直接消费者营销成本。

              **存量关系锁定（BBVA México）：** BBVA México 与 20-25 million 名墨西哥人建立的按揭、汽车贷款和工资账户关系，
              构成市场中最深的结构性转换壁垒。在 BBVA 有按揭或汽车贷款的客户，切换主银行关系会面临真实财务风险和流程成本。Plata
              等数字挑战者主要在这一基础的边缘获客。

              **存款保险不对称形成锁定：** Plata 的 IPAB 覆盖（400,000 UDIs ≈ MXN 2.7M）相较 SOFIPO 竞争者的 25,000-UDI 上限，
              对高余额存款人构成有意义的锁定优势。存款超过 MXN 170,000 的客户，把资金放在 SOFIPO 而非完整银行，会承担真实风险溢价，
              这让 Plata 和 Ualá 在较高余额储蓄细分中拥有结构性优势。
