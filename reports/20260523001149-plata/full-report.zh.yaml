  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表和优先股堆叠
        - 完整股权结构表，列出投资人名称、股份类别、清算优先权、反稀释条款，以及 Series A 和 B 投资人的按比例跟投权
        - 没有优先权机制，就无法建模真实股权价值、稀释瀑布或下行情景；下轮降价时普通股剩余价值可能归零。
        - 将其作为任何新投资的先决条件，向管理层索取；审阅 Estatutos Sociales，确认已纳入章程的股份类别条款。
      - - 扣除信贷损失后的实际 NIM
        - 扣除拨备和核销后的组合层面净息差（私有）
        - USD 596M 运行率收入质量无法验证；拨备后 NIM 在组合层面可能为负，从而高估股权价值。
        - 要求管理层提供经审计的 NIM 桥，或在 NDA 下审阅内部 MIS 报告。
      - - 客户级 CAC 和 LTV
        - 按客群批次划分的实际获客成本和客户终身价值
        - 回本周期和 CAC/LTV 比决定收入模型能否自我维持；CAC 未披露使单位经济无法验证。
        - 管理层材料；在 NDA 下做客群批次分析。
      - - 存款成本曲线和爬坡轨迹
        - Ahorro Flexible/Fijo 的实际利率成本、存款流失、客户分层，以及升至 USD 500M+ 的预计爬坡路径
        - 乐观逻辑的核心是靠存款降低融资成本；没有轨迹数据就无法估值。
        - 要求提供 3 个月存款账户数据（自 March 2026 上线以来）和管理层预测。
      - - 全额还款 / 循环余额客户结构
        - 信用卡账户中全额还款与循环余额的占比，以及随时间变化的趋势
        - 循环余额客户贡献 99.9% APR 利息收入；全额还款客户只贡献交换费；真实收益率取决于这一结构。
        - 要求管理层披露，或在 NDA 下用内部数据估算。
      - - 债务到期表和契约条款
        - 所有债券和银行授信的完整债务到期表、契约条款和交叉违约条款
        - 再融资悬崖或契约触发可随时迫使紧急股权融资；这是评估流动性风险的关键。
        - 对每只未偿 Certificado Bursátil 的 Prospecto de Colocación 做法律审阅；向管理层索取银行授信资料。
      - - 董事会构成和治理
        - 独立董事姓名、董事会委员会结构、审计 / 风险委员会报告
        - Fitch 明确指出治理不透明；CEO Tollardo 的核心人物风险集中，且缺少独立董事监督，这是监管和 ESG 层面的隐忧。
        - 向管理层索取；审阅 CNBV Disposiciones Generales 合规披露。
      - - Fitch Viability Rating 方法论输入
        - 完整 Fitch VR 模型输入，覆盖资产质量、盈利、资本充足、融资和管理子评分
        - B+/正面轨迹取决于具体指标阈值；知道触发 BB- 上调的确切条件，有助于判断增长催化剂规模。
        - 审阅 Fitch 详细评级报告补充材料；要求与 Fitch 分析师通话。
    notes: 尽调要求按决策关键性排序。第 1 项（股权结构表）和第 2 项（实际 NIM）是任何新投资决策的绝对前置条件。第 3–8 项对承保必不可少，但可在分阶段数据室流程中处理。
