      - number: '4.4'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >
              收入质量在改善，但还达不到投资级。趋势强劲——净经营收入 2025 年转正（MXN 2,726M），资产接近翻三倍但净亏损收窄，Fitch 预计盈利继续改善。不过，运营费用占总收入 81%，风险成本
              23.9%，年化运营亏损 / 资产 -16.5%，都说明公司仍处投入期，且未披露清晰盈利时间表。

              循环消费信贷银行天然资本密集：贷款每增长 1 比索，都需要股权或批发债务提供外部资金。存款业务仍在萌芽期（USD 78M 对 USD 746M 总贷款），按当前存款增长速度，存款带来的资金成本改善要到 2027
              年以后才有意义。债券期限分散部分缓和再融资风险，但银行依赖批发融资且缺少黏性零售存款，对信贷市场环境敏感。

              阻碍完整财务承销的关键尽调缺口包括：(1) 信用损失后的实际 NIM（私有），(2) 客户级 CAC 和 LTV（未披露），(3) 决定真实收益率的交易型 vs. 循环借款客户组合（未披露），(4)
              存款资金成本曲线和预期爬坡路径（建模过早），(5) 银行间授信条款和契约风险（未公开），(6) Plata Plus 订阅渗透率和流失（未披露），以及 (7) 合并财务报表（目前为单体实体；2025
              年末无子公司）。

              Fitch B+ 评级和正面展望为信用质量提供独立合理性检查，完成 CNBV 银行牌照和 IPAB 存款保险登记也是重要制度里程碑。最重大的反向信号是结构性的：名义利率 99.9% 的产品有 23.9%
              风险成本，意味着计入资金成本后每个循环借款客户的毛利润很薄；当前盈亏平衡路径取决于客群扩大时信用损失回落——这一逻辑还没有经过信贷下行周期检验。
