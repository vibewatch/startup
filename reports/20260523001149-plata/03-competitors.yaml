callouts:
  - calloutType: risk
    title: "Klar's Banking License Application Is the Single Highest-Impact Competitive Event"
    body: >-
      Klar filed for a full Institución de Banca Múltiple license from CNBV in 2024. If
      approved, Klar would gain IPAB deposit insurance (400,000 UDI parity with Plata) and
      the legal powers of a commercial bank. This event would eliminate Plata's primary
      regulatory differentiator versus its most technically capable direct competitor. Diligence
      should establish the expected approval timeline and Plata's competitive response if Klar
      achieves full-bank status within 12–24 months.
    claimRefs:
      - CP010
      - CP040

  - calloutType: insight
    title: "Multi-Homing Is the Default Consumer Behavior — Not Loyalty"
    body: >-
      Mexico's neobank market exhibits multi-homing: consumers routinely hold credit cards from
      multiple issuers and maintain savings accounts across platforms for yield optimization.
      Plata's active-card-to-total-card ratio and spend-per-active-customer (not publicly
      available) would be the most diagnostic indicator of whether it has achieved primary-card
      status with its users or remains a second card in multi-homed wallets.
    claimRefs:
      - CP019
      - CP032
      - CP036

  - calloutType: assumption
    title: "Competitor Unit Economics Remain Opaque — Adverse Scenario Not Ruled Out"
    body: >-
      No Mexican neobank competitor has publicly disclosed cost-of-risk, net interest margin, or
      entity-level profitability for Mexico operations. Klar's $300M revenue and $0.75 service
      cost suggest strong unit economics, but credit quality and net profitability are unknown.
      An adverse scenario exists where competitors are subsidizing credit card issuance to build
      share at the expense of profitability, creating temporary pricing pressure without being
      structurally sustainable.
    claimRefs:
      - CP008
      - CP039

