  - id: capability-pricing-gtm
    title: Capability, Pricing, and GTM Comparison
    body: |
      All four direct digital challengers (Nubank, Klar, Stori, Mercado Pago) have converged
      on no-annual-fee credit cards as the standard entry product, eliminating what was once
      Plata's primary differentiator. Competitive pressure has shifted to three second-order
      dimensions: product breadth and bundling depth, savings yield, and distribution efficiency.

      On savings yield, Klar (up to 15% for Plus/Platino), Stori (up to 15%), and Mercado Pago
      (up to 13%) all offer competitive or superior yields. This creates meaningful multi-homing
      risk: a customer might hold a Plata credit card for spending but route savings to whichever
      platform offers the highest yield, fragmenting revenue per customer.

      On distribution, Mercado Pago holds a structural advantage no standalone neobank can match.
      Mercado Libre's estimated 45 million Mexico users give Mercado Pago zero-marginal-cost
      cross-sell for credit-card acquisition and the unique benefit of 24 MSI on Mercado Libre
      purchases. Nubank's referral model creates a viral acquisition flywheel; Klar's CNBC Top
      300 recognition supports brand-aided organic growth. Plata competes primarily through
      digital performance marketing without a captive ecosystem, implying a structurally higher
      customer acquisition cost versus Mercado Pago.

      On product breadth, Klar leads with the widest publicly documented product set: credit
      card, savings, personal loans, investment returns, premium metal card, and SME banking.
      Nubank and Stori are credit-card plus savings account platforms with fewer bundled
      products. Plata's disclosed products include credit card, savings account (Cuenta Plata),
      and early-stage investment features — roughly matching Nubank's breadth.

      On regulatory posture, Plata and Ualá hold the most advantaged position as full
      Instituciones de Banca Múltiple with IPAB deposit insurance up to 400,000 UDIs per
      depositor. SOFIPO-licensed competitors (Nubank's SFP entity, Klar, Stori) offer deposit
      protection capped at 25,000 UDIs — a structural limitation that matters most for
      high-balance depositors and gives Plata a differentiated pitch for the higher-balance
      savings segment.
