        - from: revolves
          to: interest_revenue
          label: "99.9% annual interest charged"
        - from: spend
          to: interest_revenue
          label: "Interchange + fees (all customers)"
        - from: interest_revenue
          to: credit_loss
          label: "23.9% of gross portfolio written off/provisioned"
        - from: interest_revenue
          to: net_margin
          label: "Residual after credit loss and funding cost"
