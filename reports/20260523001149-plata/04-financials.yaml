        - "7–7.25% gross rate offered to depositors"
        - "Nascent — deposits only USD 78M at 1Q26; launched March 2026"
        - Low — early-stage; could grow to meaningful net interest spread as deposit base scales
        - Deposit growth trajectory; cost of funds vs. wholesale debt cost; brokerage take rate
