  - id: financial-verdict
    title: Financial Verdict and Diligence Gaps
    body: >
      Revenue quality is improving but not yet investment-grade. The trajectory is
      strongly positive—net operating income turned positive in 2025 (MXN 2,726M),
      net losses narrowed despite near-tripling of assets, and Fitch projects continued
      earnings improvement. However, operating expenses at 81% of gross revenues, a 23.9%
      cost of risk, and an annualized operating loss/assets of -16.5% indicate the
      business is still in investment mode with no clear profitability timeline disclosed.

      Capital intensity is structurally high for a revolving consumer credit bank:
      every peso of loan growth requires external funding from equity or wholesale debt.
      The deposit franchise is nascent (USD 78M vs USD 746M gross loans), and meaningful
      cost-of-funds improvement from deposits is a 2027+ story at current deposit growth
      rates. Refinancing risk is partially mitigated by bond maturity diversification,
      but the bank's wholesale funding dependency and absence of sticky retail deposits
      make it sensitive to credit market conditions.

      Critical diligence gaps that prevent full financial underwriting include: (1) realized
      NIM after credit losses (private), (2) customer-level CAC and LTV (not disclosed),
      (3) transactor vs. revolver mix determining true yield (not disclosed), (4) deposit
      funding cost curve and expected ramp trajectory (too early to model), (5) interbank
      credit facility terms and covenant risks (not public), (6) Plata Plus subscription
      attach rate and churn (not disclosed), and (7) consolidated financial statements
      (currently standalone entity; no subsidiaries at end-2025).

      The Fitch B+ rating with Positive Outlook provides an independent sanity-check on
      credit quality, and the completion of the CNBV banking license and IPAB deposit
      insurance registration are meaningful institutional milestones. The most significant
      adverse signal is structural: a 23.9% cost of risk on a 99.9% nominal rate product
      implies slim gross profit per revolver once funding costs are included, and the
      current breakeven path is contingent on credit losses moderating while the customer
      base scales—a thesis that has not been tested through a credit downturn.
