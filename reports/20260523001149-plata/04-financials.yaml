  - id: TI001
    title: Revenue Streams
    slug: revenue-streams-table
    layout: standard
    notes: >
      Revenue figures from 4Q2025 earnings release (management IFRS-like) and FY2025 audited MX FRS
      statements differ due to classification of revolving credit income as commissions vs. interest.
      Audited figures are the primary source of record. 1Q26 annualized run-rate from IR homepage.
      Investment income from savings products is nascent (deposits launched March 2026).
    enumerationScope:
      coverage: exhaustive
      basis: "All publicly disclosed revenue streams for Banco Plata as of FY2025 annual report, 4Q2025 earnings release, and official product booklets"
    columns:
      - Stream
      - Mechanism
      - Unit / Rate
      - 2025 Value (Audited MX FRS)
      - Quality
      - Diligence Ask
    rows:
      - - Credit card revolving interest
        - "Interest on unpaid balances at 99.9% annual (sin IVA)"
        - "99.9% annual nominal"
        - "Included in MXN 2,895M interest income; transactor/revolver split not disclosed"
        - High — primary income driver; highly revolving portfolio provides delinquency visibility
        - Realized yield after adjusting for transactor mix; grace-period payment rate
      - - Cash advance and transfer fees
        - "10% + IVA per ATM withdrawal or balance transfer"
        - "10% + IVA per event"
        - "Included in MXN 3,202M commission income; not separately broken out"
        - Medium — event-driven, cyclical with card usage
        - Separate disclosure of fee line items; attach rate to total transactions
      - - Plata Plus subscription
        - "1% of credit limit/month (MXN 39–99 + IVA)"
        - "MXN 39–99/month per subscriber"
        - "Embedded in commission income; attach rate not disclosed"
        - Medium — recurring, predictable if retained
        - Subscriber count and churn rate
      - - Annual card fee
        - "MXN 199/year (first 3 months free)"
        - "MXN 199/year"
        - "Embedded in commission income; card count ~3–4M cards"
        - Low-medium — billing friction mitigated by digital-first account
        - Total cards billed; waiver/churn rate
      - - MSI restructuring fee
        - "Installment plan fee 10.5–30% + IVA for 3–12 months"
        - "Up to 30% + IVA for 12 months"
        - "Included in commission income; volume not disclosed"
        - Medium — margin-enhancing product; adverse if customers over-extend
        - Meses Sin Intereses (MSI) volume and default correlation
      - - Investment products (savings / brokerage)
