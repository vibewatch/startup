    summary: >
      How a Plata credit card customer's activity translates into revenue, credit loss,
      and net margin. Nodes are qualitative; values are approximated from public disclosures.
    approximationNotes: >
      Realized yield, CAC, and per-customer net margin are not publicly disclosed.
      Values in nodes are derived from the stated interest rate (99.9%), cost of risk (23.9%),
      CAT (163.83%), and the estimated annualized revenue per customer (~USD 175). All figures
      are indicative and label with "estimated" where not directly sourced.
    data:
      nodes:
        - id: acquisition
          label: "Customer Acquisition"
          detail: "Digital-only; same-day card delivery; zero origination fee; CAC not disclosed"
        - id: card_issuance
          label: "Credit Card Issued"
          detail: "Plata Crédito via Mastercard; credit limit set by AI underwriting; Plata Plus optional"
        - id: spend
          label: "Cardholder Spends"
          detail: "Generates interchange (~1–2% of GMV embedded in fee income); cashback up to 15% on select purchases is a cost"
        - id: revolves
          label: "Customer Revolves Balance"
          detail: "~50–70% of consumer credit card customers in Mexico revolve (estimated); 99.9% annual interest accrues"
        - id: interest_revenue
          label: "Interest + Fee Revenue"
          detail: "Gross revenue per revolver ~163.83% CAT; net of grace-period transactors the realized yield is lower"
        - id: credit_loss
          label: "Credit Loss (23.9% CoR)"
          detail: "Stage 3 NPL 4.8% at 1Q26; cost of risk consumes ~24% of gross portfolio annually"
        - id: net_margin
          label: "Estimated Net Revenue/Customer"
          detail: "~USD 175/year gross (estimated); less ~23.9% credit loss and funding cost; net margin negative at current scale"
      edges:
        - from: acquisition
          to: card_issuance
          label: "Digital onboarding"
        - from: card_issuance
          to: spend
          label: "Card activated; Plata Plus subscription optioned"
        - from: spend
          to: revolves
