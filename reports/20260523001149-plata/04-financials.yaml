  - id: TI005
    title: Public Financial Gaps
    slug: public-financial-gaps-table
    layout: standard
    notes: >
      This table enumerates material financial metrics required for investment underwriting
      that are not publicly available as of the runDate. Sources include FY2025 audited
      statements, Fitch B+ rating action (May 2026), 4Q2025 and 3Q2025 earnings releases,
      and official product booklets. "Impact" is rated H/M/L on underwriting significance.
    enumerationScope:
      coverage: exhaustive
      basis: "All material financial metrics for underwriting a pre-profitability consumer credit bank that are absent from Plata's public disclosures as of May 2026"
    columns:
      - Missing Metric
      - Impact
      - Why It Matters
      - Exact Diligence Path
    rows:
      - - Transactor vs. revolver mix
        - H — High
        - Determines realized interest yield; transactors pay zero interest, halving effective yield
        - Request management cohort data; board reporting; model sensitivity
      - - Customer-level CAC
        - H — High
        - Without CAC, LTV payback cannot be modeled; digital acquisition cost unknown
        - Marketing spend breakdown; channel-level acquisition reports; management data room
      - - Realized NIM after credit losses by cohort
        - H — High
        - Net spread per cohort shows whether the credit model is viable as it ages
        - Vintage-level P&L; cohort roll-rate data; management reporting pack
      - - Interchange economics / breakdown of commission income
        - M — Medium
        - Interchange is revenue from Mastercard network; may be partially returned in cashback
        - Revenue disaggregation by fee type; Mastercard agreement terms
      - - Individual bond terms and covenants
        - M — Medium
        - Bond covenants may restrict growth actions or trigger acceleration; maturity concentration unknown
        - Bond prospectus / term sheets; IR data room
      - - Deposit cost curve and ramp trajectory
        - M — Medium
        - At 7–7.25% savings rates, funding costs may be higher than wholesale bonds short-term
        - Monthly deposit inflow reporting; comparison with TIIE and CETES benchmark
      - - Consolidated financial statements
        - M — Medium
        - Standalone entity at end-2025; any related-party financing via Different Technologies LLC not captured
        - Confirm single-entity structure; review related-party transactions (Note 11 of audited statements)
      - - Plata Plus subscription attach rate and churn
        - L — Low
        - Subscription is a predictable revenue layer; attach/churn rates affect revenue stability
        - Monthly subscription data; lifecycle analysis
