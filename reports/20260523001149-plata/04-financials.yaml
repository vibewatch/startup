summary: >
  Plata (Banco Plata S.A., Institución de Banca Múltiple) operates a capital-intensive,
  pre-profitability digital bank anchored on revolving credit cards in Mexico. Full-year 2025
  audited results show a net loss of MXN 1,978M on interest income of MXN 2,895M (MX FRS) and
  fee/commission income of MXN 3,202M, with an operating expense load of MXN 5,777M.
  Net loans grew 171% YoY to MXN 9,998M funded by MXN 5,372M equity injections and MXN ~7.9B
  of bond/bank debt. Fitch assigned B+ LT IDR with Positive Outlook (May 2026), citing
  improving losses, sound capitalization at 12.2% FCC/RWA, and prospective deposit-taking
  benefits, but flagged a 23.9% cost of risk, concentrated product mix, and an operating loss
  still running at -16.5% of average assets as of 1Q26. Revenue quality improves—NII after
  provisions turned positive in 2025, and the net loss narrowed despite near-tripling of
  assets—but the bank remains dependent on equity injections and wholesale debt to fund growth.
  Private CAC, true interchange economics, realized NIM, and deposit cost curves are unavailable
  for underwriting.

sections:
  - id: revenue-streams
    title: Revenue Model and Streams
    body: >
      Plata's revenue model is a high-yield revolving consumer credit franchise that earns
      on three primary mechanisms: net interest income on credit card balances, fee and
      commission income (interchange, cash-advance fees, subscription, MSI restructuring),
      and ancillary income from investment products (Ahorro Fijo, Ahorro Flexible, brokerage)
      and FX.

      The credit card product (Plata Crédito) carries a listed ordinary interest rate of 99.9%
      per annum (sin IVA) and a Total Annual Cost (CAT) of 163.83% for customers who revolve
      balances. Customers who pay in full within the grace period generate no interest, making
      transactor mix a key unknown for realized revenue yield. Cash-advance fees of 10% + IVA
      per transaction and a late-payment penalty of MXN 400 per event augment interest.
      The Plata Plus subscription plan adds a recurring charge of 1% of the credit limit per
      month (MXN 39–99 min/max, plus IVA), providing a modest but predictable revenue layer.

      Full-year 2025 4Q earnings release shows interest income of MXN 5,999M and fees of
      MXN 1,119M, while the independently audited MX FRS statements report interest income of
      MXN 2,895M and commissions earned of MXN 3,202M—a material accounting classification
      difference reflecting the pre-bank SAPI treatment of revolving credit charges as
      commissions rather than interest under certain NIF provisions. Both sets of statements
      are prepared by management under different regulatory frameworks; the audited figure
      is the primary source of record. Revenue grew approximately 3.3× in 2025 vs 2024
      (audited interest income MXN 2,895M vs MXN 658M), confirming rapid portfolio scaling.

      4Q2025 quarterly revenue (earnings release definition) reached MXN 2,507M, up 212% YoY
      and 24% QoQ, approaching an annualized run-rate of ~MXN 10B. The IR homepage confirms
      an annualized revenue figure of USD 596M (~MXN 11.9B at current rates) as of 1Q26,
      which is the most forward-looking publicly available figure. Deposit-taking launched
      mid-March 2026 and will over time create a funding cost and net spread model for the
      savings book as well.
