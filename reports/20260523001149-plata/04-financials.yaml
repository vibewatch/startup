  - id: capital-funding
    title: Capital Adequacy, Funding, and Runway
    body: >
      Plata has raised over USD 500M in cumulative equity capital from its founding through
      1Q26 (Fitch), with the IR homepage citing "+$2B debt + equity raised" cumulatively.
      The most recent equity injection—the USD 250M Series B at a USD 3.1B valuation
      (October 2025)—funded Q4 2025 portfolio growth, supplemented by MXN 2,638M of bond
      issuance in the same quarter. Total equity at end-2025 was MXN 5,127M (~USD 256M)
      against accumulated losses of MXN 5,117M; the share capital of MXN 10,244M reflects
      all contributed equity.

      Capitalization metrics as of 1Q26 (Fitch): Fitch Core Capital / RWA 12.2%, tangible
      equity/assets 11.8%, total capitalization ratio 18.0%. These levels are described by
      Fitch as a relative strength, comparing favorably with some domestic peers, while
      noting pressure from aggressive loan growth. The bank must maintain CNBV regulatory
      capital floors now that it holds a full banking license (granted February 17, 2026;
      operations commenced March 19, 2026).

      Wholesale debt funding totaled MXN 11,698M at end-2025, composed of bank loans and
      bond issuances. Unsecured funding (market debt) was 48.8% of total funding at end-2025,
      up from zero at end-2023, indicating rapid capital markets development. The IR listings
      page confirms active bond issuances. Fitch notes a long weighted-average debt maturity
      profile that moderates near-term refinancing risk.

      The deposit franchise launched mid-March 2026 with USD 78M in deposits at 1Q26,
      producing a loans-to-deposits ratio of 933.5%—reflecting the very early stage of
      deposit mobilization. At Ahorro Flexible's 7% gross rate and Ahorro Fijo's 7–7.25%,
      deposit costs will initially be above the interbank lending rate but could reduce
      funding cost relative to wholesale bond issuance as the deposit book scales.

      Operational cash burn excluding loan origination (i.e., net loss plus non-cash items)
      was approximately MXN 1,979M in 2025. Including loan portfolio growth (working capital),
      net cash from operations was MXN -8,152M (earnings release), mostly funded by MXN
      11,764M from capital injections and borrowings. With MXN 4,790M cash at end-2025 and
      annualized operational burn of ~MXN 2B, pure cash runway (excluding portfolio growth
      funding needs) is approximately 24–30 months. However, continued portfolio growth
      requires ongoing external funding; the bank cannot self-fund at current loss rates.
