  evidenceGaps:
    - id: EGI001
      topic: "Transactor-to-revolver mix and realized interest yield"
      description: >
        The fraction of credit card customers who revolve balances vs. pay in full is not
        disclosed. This is the single most important driver of realized revenue yield—transactors
        generate only fee/interchange income, halving or more the effective revenue per card.
        No management guidance, industry proxy, or investor disclosure exists for Plata.
      severity: critical
      relatedQuestionRefs:
        - QI013

    - id: EGI002
      topic: "Customer-level CAC, LTV, and payback period"
      description: >
        Plata does not disclose marketing spend, customer acquisition cost by channel, or
        lifetime value metrics. Without these, the return on customer investment cannot be
        modeled and the sustainability of the growth model at scale is unverifiable.
      severity: critical
      relatedQuestionRefs:
        - QI011
        - QI028

    - id: EGI003
      topic: "Series B structure: equity vs. structured note"
      description: >
        Bloomberg Línea reported the USD 250M Series B was raised via a 'nota estructurada.'
        If this instrument carries debt-like features (yield, redemption, conversion), the
        economic equity content of the contribution may be overstated. No clarification was
        provided in the audited statements or official announcements.
      severity: high
      relatedQuestionRefs:
        - QI030
      relatedTableRefs:
        - TI004

    - id: EGI004
      topic: "Individual bond terms and covenant schedule"
      description: >
        Total bond and bank debt is MXN 11,698M but individual instrument terms, covenants,
        maturity schedule, and collateral pledging are not publicly disclosed. The IR listings
        page confirms bond issuances without providing prospectus details.
      severity: high
      relatedQuestionRefs:
        - QI007
      relatedTableRefs:
        - TI004

    - id: EGI005
      topic: "Deposit funding cost curve and mobilization trajectory"
      description: >
        With only USD 78M in deposits at 1Q26 and savings rates of 7–7.25% offered, the net
        impact on funding costs (vs. wholesale bonds) is unknown. No deposit growth target,
        marketing spend, or funding cost comparison has been disclosed.
      severity: medium
      relatedQuestionRefs:
        - QI021

    - id: EGI006
      topic: "Plata Plus subscription attach rate and brokerage revenue"
      description: >
        The Plata Plus subscription and brokerage (stock/ETF trading) are potentially
        significant recurring revenue streams but no subscriber count, take rate, or revenue
        contribution has been disclosed. The investment platform was launched recently and
        its contribution to 2025 financials is negligible.
      severity: medium
      relatedQuestionRefs:
        - QI009
        - QI028
      relatedTableRefs:
        - TI005
