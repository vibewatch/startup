  - id: market-sizing
    title: Market Sizing — Multiple Lenses
    body: |
      Three independent sizing lenses converge on a large but imprecisely bounded market.

      **Lens 1 — Adult population and financial-account gap.** Mexico had approximately
      128.9 million total residents in January 2024 (DataReportal). Applying the roughly
      70% adult-share (15+ cohort) gives approximately 90 million adults, of whom the World
      Bank's Global Findex database tracks formal financial account ownership as the primary
      inclusion metric. INEGI's ENIF, conducted every two to three years in partnership with
      CNBV and Banxico, is the domestic authoritative source; ENIF 2024 data was in process
      as of the runDate. The inclusion gap implies tens of millions of adults remain
      unbanked or thin-file, providing a large addressable cohort for digital-first entrants.

      **Lens 2 — Credit penetration.** Fitch Ratings, in its inaugural May 2026 rating
      action for Banco Plata, explicitly identifies "low credit penetration in Mexico" as a
      structural driver for sustained demand in Plata's core credit-card franchise. The
      Fitch operating environment assessment for Mexican banks is 'bb+'/Stable, reflecting
      expectations of broadly resilient conditions despite macroeconomic headwinds (slower
      GDP growth, trade uncertainty, external geopolitical risks). Mexico's credit-to-GDP
      ratio is materially below regional peers such as Brazil, Chile, and Colombia, creating
      room for credit portfolio expansion. Plata's own 4Q2025 earnings release documents
      net loan portfolio growth of +171% year over year to MXN 9,998 million, consistent
      with rapid share capture in an underpenetrated market.

      **Lens 3 — Market share and new-card issuance.** TechFunding News reported in October
      2025 (citing Plata's investor materials at the time of the Series B) that Plata was
      issuing approximately 10% of all new credit cards in Mexico. If Mexico's annual new
      credit-card issuance is estimated at 8–12 million cards per year (based on CNBV entity
      data trends), this implies Plata was adding 800K–1.2M new cards per year, consistent
      with its reported growth from 2 million to 3.4 million active customers between
      October 2025 and May 2026.

      Contradictions and sizing gaps are material: no single publicly available source
      provides a definitive total addressable loan balance or deposit balance for the
      digital-only bank segment in Mexico. Analyst reports from Grand View Research,
      Mordor Intelligence, and similar vendors offer market-size headlines but did not
      provide accessible full text via fetch. The Bloomberg Línea article from October 2025
      describes Mexico as "one of the most competitive fintech markets in Latin America"
      but provides no bottom-up market size estimate. IMF working paper coverage of Mexico
      financial inclusion was not retrievable. These gaps limit precision; range estimates
      and contradictions are preserved in the evidence gaps.
