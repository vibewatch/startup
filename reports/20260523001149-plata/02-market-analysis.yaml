callouts:
  - calloutType: strength
    title: Large Structural Inclusion Gap Creates Durable TAM
    body: >-
      Mexico's combination of high mobile penetration (97.3% mobile connections per DataReportal)
      and historically low formal financial account ownership — documented by World Bank Findex and
      INEGI ENIF — creates a structurally large and durable addressable market. Unlike markets
      where digital banking primarily displaces existing incumbents, Mexico offers net new
      customer creation at scale, reducing CAC sensitivity to competitive intensity in the
      near term. Fitch's 'bb+'/Stable OE assessment and explicit "low credit penetration"
      driver note corroborate this as a sustained, not one-time, opportunity.
    claimRefs:
      - CM010
      - CM011
      - CM012
      - CM028
      - CM029

  - calloutType: risk
    title: ADVERSE — Competitive Convergence Compresses SAM Window
    body: >-
      Bloomberg Línea (Oct 2025) documented that Nubank, Revolut, Klar, and Ualá are all
      simultaneously obtaining or operationalizing full Mexican banking licenses. The window
      in which Plata can sign up unbanked/underbanked customers before well-funded global
      competitors achieve scale is narrowing. Nubank's Latin American playbook — loss-leading
      on credit card rewards, aggressive digital marketing, and eventual deposit cross-sell —
      has already proven capable of compressing new-card CAC in Brazil. Mexico faces the same
      compression dynamic, which could erode Plata's first-mover advantage in the SAM
      faster than the market itself grows. Fitch's note on competition and the "high growth
      appetite" of all players is an adverse signal for SAM margin durability.
    claimRefs:
      - CM035
      - CM036
      - CM037
      - CM038

