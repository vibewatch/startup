  - id: sizing-gaps
    title: Sizing Gaps, Contradictions, and Diligence Asks
    body: |
      Several material gaps limit precision in market sizing for Plata's specific opportunity.

      **ENIF 2024 not yet publicly available.** INEGI's ENIF 2024 survey is the most
      authoritative source on Mexican adult financial inclusion and product usage, but full
      results were not accessible via the INEGI website as of the runDate (only the program
      landing page was live). The most recent complete ENIF data available publicly is from
      ENIF 2021. This creates a 3-year data gap for definitive inclusion statistics.

      **Contradictory market scope claims.** Plata's own marketing describes itself as
      serving "Mexico's largely underbanked population" (TechFunding News citing Plata
      materials) and simultaneously as the "fastest-growing financial institution in Latin
      America" (Plata About page / IR site). These framing choices emphasize the inclusion
      narrative but do not provide a bottom-up market size estimate. The IR site's
      headline KPIs ($746M gross portfolio, 3.4M customers) imply an average outstanding
      balance of ~$219 per active customer — consistent with mass-market, thin-file credit
      rather than a premium card product — but the total market size this represents as a
      share of Mexican consumer credit is not stated.

      **Analyst market size estimates inaccessible.** Grand View Research, Mordor
      Intelligence, and Business Research Insights all offer Mexico digital banking market
      reports, but full data was gated behind paywalls or registration forms. The only
      accessible headline from Mordor was a 404 page. Without third-party market sizing,
      the TAM estimate relies on bottom-up assumptions that carry higher uncertainty.

      **Credit-card issuance share claim not independently verified.** TechFunding News
      stated Plata was "issuing about 10% of all new credit cards in Mexico" as of October
      2025. This is a significant market share claim that has not been corroborated by a
      CNBV statistical release or independent analysis. The total new-card issuance
      denominator is not publicly documented in a single accessible CNBV source.

      **IMF financial inclusion working paper inaccessible.** The IMF's 2022 working paper
      on financial inclusion in Mexico (WP/22/209) returned only the IMF homepage, preventing
      validation of its sizing estimates and policy conclusions.
