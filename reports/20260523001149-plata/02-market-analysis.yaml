  - id: buyer-segmentation
    title: Buyer and User Segmentation
    body: |
      Plata's primary target is Mexico's mass-market adult consumer who falls into one of
      three overlapping segments: (1) the fully unbanked adult with no formal financial
      product; (2) the underbanked adult who holds a basic bank account (often a nómina or
      payroll account at a traditional bank) but lacks a credit card or savings vehicle; and
      (3) the "credit-underserved" adult who has a bank account but has been declined for
      credit by traditional institutions due to thin credit history.

      Budget ownership and payment pathway: in the credit card model, the payer is the
      individual consumer, the buyer and user are the same person (the cardholder), and
      credit-granting decisions are made by Plata's AI underwriting engine with no
      intermediary. This simplifies the sales funnel relative to corporate or B2B financial
      products: there is no enterprise procurement cycle, no channel reseller, and no
      complex multi-stakeholder approval.

      The smartphone and internet infrastructure necessary for digital-only banking is
      broadly available: Mexico had 107.3 million internet users (83.2% penetration) and
      125.4 million active mobile connections (97.3% of population) in early 2024 per
      DataReportal, with INEGI's ENDUTIH 2024 documenting smartphone ownership and usage
      trends. This means the reachable digital addressable market is effectively the entire
      internet-enabled adult population — a subset of approximately 80–85 million adults
      assuming proportional internet uptake across age cohorts.

      Secondary segments include Mexico's gig economy participants (delivery riders,
      ride-hailing drivers, freelancers) who may lack nómina payroll but have regular
      digital income — a segment historically excluded from traditional bank credit scoring.
      Plata's AI underwriting (referenced in investor materials and the Fitch assessment's
      "credible management team" comment) is designed to serve this thin-file population.

      Competitor segmentation: Nu México Financiera S.A. de C.V., SFP operates under the
      Ley de Ahorro y Crédito Popular license (more limited than a full bank), targeting a
      similar mass-market segment. Ualá, S.A., Institución de Banca Múltiple has
      full-banking status and targets similar demographics. Revolut Bank S.A. launched
      full banking in Mexico as its first non-European bank and reportedly focuses on
      more digitally sophisticated urban consumers.
