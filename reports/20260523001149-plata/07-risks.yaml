  - id: kill-criteria-synthesis
    title: Macro/FX Risks, Thesis-Break Triggers, and Kill Criteria
    body: |
      Macro and FX risk is a secondary but material exposure. Plata raises equity in USD
      (Series B at USD 3.1 B valuation) but generates revenues and incurs losses almost
      entirely in MXN. Peso depreciation inflates the USD funding cost and compresses
      USD-equivalent performance metrics reported to investors. The IMF's April 2026 World
      Economic Outlook projects Mexico GDP growth of approximately 1.0% for 2026, materially
      below the 2.0%+ assumptions that underpin most Mexico fintech expansion models, driven
      by US tariff uncertainty and reduced cross-border trade. A deeper recession would compress
      consumer credit quality across the thin-file segment, creating a scenario where NPL
      acceleration coincides with tightened wholesale funding markets.

      The five thesis-break triggers that would most directly impair Plata's investment case
      are: (1) NPL ratio exceeding 8% on a sustained basis (two consecutive quarters), which
      would imply provisioning costs that cannot be absorbed even at current revenue run-rates;
      (2) loss of the CNBV banking license or issuance of a material corrective action order;
      (3) credit market closure that prevents bond or loan refinancing of the MXN 11,698 M
      wholesale book within a six-month window; (4) departure of CEO Neri Tollardo without
      a named successor with equivalent regulatory standing; and (5) any regulatory enforcement
      action from CONDUSEF or CNBV that imposes a halt to new origination — the "origination
      stop" scenario that killed several earlier Mexican SOFOM lenders.

      Monitoring indicators include: monthly CNBV portfolio-quality data for Banco Plata;
      quarterly CONDUSEF reclamations index for the bank vs the sector average; bond spread
      on outstanding Plata certificates (as a proxy for wholesale funding cost); Fitch rating
      actions and outlook changes; and any CNBV or CONDUSEF press releases mentioning Banco
      Plata by name. These signals are available with a one-to-three month lag, making them
      leading rather than coincident indicators of the kill criteria above.
    claimRefs:
      - CR034
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
