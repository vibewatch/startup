company:
  name: Plata

chapter:
  number: 6
  title: Customers
  summary: >-
    Banco Plata has grown from zero to 3.4 million total active customers in roughly three
    years, anchored almost entirely on a consumer credit card product serving cost-sensitive,
    mobile-first Mexican consumers. App store evidence — 4.8/5 across 349K Google Play and
    287K Apple App Store reviews, with 5M+ downloads — confirms broad retail adoption and high
    satisfaction, though no NRR, cohort retention, or churn data has been publicly disclosed.
    Concentration risk is material: a single product (credit cards ~93.5% of portfolio), a
    single geography (Mexico), and a customer base that skews toward consumers with limited
    formal credit history. An early Colombia savings entry (August 2025) signals expansion
    intent but remains too small to offset the structural concentration.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation
    body: |
      Banco Plata's target customer is the under-banked or newly-banked Mexican consumer —
      individuals aged 18–45 who have a smartphone but limited or no prior formal credit
      history. The value proposition combines three levers: (1) same-day physical card
      delivery via a proprietary ambassador network, bypassing the weeks-long wait typical
      of incumbent banks; (2) real-peso cashback (selectable categories), making rewards
      immediately usable rather than locked into loyalty points; and (3) a 60-day payment
      window without late-fee penalties, providing flexibility for consumers with irregular
      income cycles common in Mexico's large informal economy.

      The company operates purely in the consumer B2C vertical. There is no B2B or SME
      credit offering (the platacard.mx/en/pyme page was inaccessible at the time of
      review). Distribution runs through two channels: the mobile app (iOS and Android)
      for fully self-serve onboarding, and the ambassador delivery network for physical
      card logistics. The debit account (Plata Cuenta) and savings products (Ahorro Fijo,
      Ahorro Flexible) were added in early 2026 following banking licence receipt, broadening
      the addressable customer base beyond credit-only users. Investment services (stock,
      ETF, and fund purchases) are offered via a white-label partnership with VestFi, a
      CNBV-registered independent investment adviser.

      Geography is overwhelmingly Mexico, with card delivery concentrated in urban areas
      where the ambassador network can guarantee same-day service. A Colombia market entry
      was initiated in August 2025, structured as a savings/deposit Compañía de Financiamiento
      — a much more limited footprint than the Mexico credit card operation.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
