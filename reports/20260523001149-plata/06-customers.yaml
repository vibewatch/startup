  - id: retention-durability
    title: Retention and Durability
    body: |
      Plata has not publicly disclosed any net revenue retention rate, gross revenue retention
      rate, churn rate, renewal rate, or time-series cohort retention data. This is a material
      diligence gap for investors: with 3.4M active customers and a $5B claimed valuation, the
      absence of any public retention metric makes it impossible to distinguish between a
      high-quality sticky customer book and a high-churn model sustained purely by
      acquisition. The gap aligns with Fitch's observation that Plata's "effectiveness [of
      governance and controls] remains to be tested over a longer period."

      The available proxies for retention are indirect. The credit card revolving structure
      creates inherent repeat usage: customers return monthly to pay balances and make further
      purchases, generating recurring transaction data. Personal loans (6.5% of portfolio by
      3Q25) represent a cross-sell to existing card holders, implying some degree of
      relationship durability. The Plata Plus subscription (MXN 39–99/month) — a paid tier
      for premium limits and features — signals a segment of high-engagement, high-intent
      customers willing to pay a recurring fee.

      The adverse signal is in asset quality trajectory: stage 3 (impaired) loans rose from
      3.4% at end-2024 to 4.4% at end-2025 to 4.8% at 1Q26 per Fitch. Cost of risk was
      23.9% at 1Q26, "above that of some consumer unsecured banking peers." These metrics
      suggest that a portion of the early customer cohorts are experiencing credit stress.
      However, Fitch notes that impaired loans are "well reserved" and that the rising trend
      is partly explained by portfolio seasoning during rapid growth. Whether these are
      permanent credit losses or temporary maturation effects cannot be determined without
      cohort-level data.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
