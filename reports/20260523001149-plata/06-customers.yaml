  - id: TU006
    title: Retention Evidence Quality and Gap Assessment
    columns:
      - Retention Dimension
      - Evidence Available
      - Evidence Quality
      - Key Gap
      - Risk if Gap Persists
    rows:
      - - App engagement / repeat transactions
        - 4.8/5 rating (636K reviews); 5M+ downloads; monthly billing cycle creates inherent repeat use
        - Medium (indirect proxy only)
        - No transaction frequency, MAU, or DAU data disclosed
        - Cannot distinguish sticky credit users from defaulted/inactive accounts
      - - Credit loss as churn proxy
        - Stage 3 ratio 4.8% (1Q26); cost of risk 23.9% (1Q26)
        - High (Fitch-corroborated)
        - Rising trend unexplained at cohort level
        - Portfolio seasoning vs. systemic deterioration cannot be resolved without vintage data
      - - Cross-product penetration as retention indicator
        - Personal loans growing (3.6% → 6.5% of portfolio, 9M2025)
        - High (Pareto filings)
        - No % of customers with multiple products; no investment or savings attach rates
        - Low cross-sell penetration would imply shallow customer relationships
      - - Paid subscription retention (Plata Plus)
        - Product page confirms MXN 39–99/month subscription exists
        - Low (no volume data)
        - Subscriber count, attach rate, and cancellation rate undisclosed
        - If attach rate is <5%, Plata Plus is immaterial to retention analysis
      - - Deposit franchise durability
        - USD 78M deposits at 1Q26 (launched March 2026); loans-to-deposits 933.5%
        - High (Fitch)
        - No deposit retention, average balance, or customer count for savings products
        - Deposit franchise could be transient if savings rates are uncompetitive
    notes: >-
      This table substitutes for a time-series cohort retention figure that Plata has not
      publicly disclosed. All evidence is proxy-level. Stage 3 ratio and cost of risk from
      Fitch (May 2026); cross-sell share from Pareto 3Q2025; deposit data from Fitch (1Q26).
      All quality ratings reflect limitations of available public evidence, not underlying
      business reality.
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU026
      - CU034

