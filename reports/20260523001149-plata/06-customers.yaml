callouts:
  - calloutType: strength
    title: Exceptional App Store Validation at Scale
    body: >-
      A 4.8/5 rating across 636K combined reviews on Google Play and Apple App Store MX
      is among the highest satisfaction scores for any digital bank in Latin America at
      comparable scale. This level of user endorsement — sustained through rapid growth
      from zero to 3.4M customers in roughly three years — suggests that Plata's core
      product experience (cashback, 60-day payment window, same-day delivery) genuinely
      resonates with under-served Mexican consumers.
    claimRefs:
      - CU012
      - CU013
      - CU005

  - calloutType: risk
    title: No Retention Metrics Disclosed — Critical Diligence Gap
    body: >-
      Plata has not disclosed any NRR, GRR, churn rate, or cohort retention data. With
      a $5B claimed valuation and 3.4M active customers, the quality of the customer book
      is entirely opaque. The rising stage 3 loan ratio (3.4% → 4.8% from end-2024 to
      1Q26) and cost of risk above LatAm peers (23.9%) indicate credit stress in the
      base. Without cohort-level data, investors cannot distinguish a durable, growing
      revenue base from a high-churn model masked by rapid acquisition spending.
    claimRefs:
      - CU023
      - CU024
      - CU025

