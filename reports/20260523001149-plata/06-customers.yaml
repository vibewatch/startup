  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: retention-gap
      missingEvidence: >-
        Net revenue retention rate, gross revenue retention rate, monthly churn rate,
        and time-series cohort retention data broken out by acquisition vintage.
      whyItMatters: >-
        Without retention metrics, investors cannot assess whether 3.4M active customers
        represent a durable revenue base or a high-churn model dependent on continuous
        acquisition spending. The distinction is critical for LTV/CAC analysis and
        long-run profitability projections.
      diligencePath: >-
        Request cohort-level NRR and churn from management in a data room; cross-check
        against card transaction frequency and balance repayment data from Banxico
        central credit registry (Buró de Crédito).
      relatedQuestionRefs:
        - QU016
      relatedTableRefs:
        - TU004

    - type: private-evidence-only
      severity: material
      topic: complaints
      missingEvidence: >-
        CONDUSEF complaint volume, complaint resolution rates, and sanction history for
        Banco Plata, disaggregated by product type (credit card, personal loan, savings).
      whyItMatters: >-
        Complaint data is a leading indicator of customer dissatisfaction and regulatory
        enforcement risk. High complaint rates relative to peers could signal operational
        weaknesses, deceptive pricing, or aggressive collections practices.
      diligencePath: >-
        Submit a formal information request to CONDUSEF under the transparency framework;
        request SEFI complaint summary from management covering 2023-2026.
      relatedQuestionRefs:
        - QU007
        - QU014

    - type: missing-source
      severity: material
      topic: customer-cohort-data
      missingEvidence: >-
        Customer acquisition cost (CAC), lifetime value (LTV), payback period, and cohort-
        level profitability data disaggregated by acquisition year and product.
      whyItMatters: >-
        CAC and LTV are foundational to assessing the sustainability of Plata's growth
        model. High CAC relative to LTV in early cohorts would indicate an unprofitable
        acquisition strategy even at scale.
      diligencePath: >-
        Request CAC, LTV, and cohort P&L from management. Cross-reference against Fitch's
        cost-of-risk and profitability trajectory; model scenarios from the 23.9% cost
        of risk and estimated ARPU of ~USD 175/yr.
      relatedQuestionRefs:
        - QU010
        - QU022

    - type: missing-source
      severity: material
      topic: market-share-verification
      missingEvidence: >-
        Independent CNBV or Banxico issuer-level data confirming Plata's claimed ~10%
        share of new credit card issuances in Mexico.
      whyItMatters: >-
        The 10% new-card-issuance claim is a key proof point for market-share narrative
        but is sourced only from Plata's own press release. CNBV publishes aggregated
        banking system data that could validate or refute this claim.
      diligencePath: >-
        Download CNBV monthly banking system statistics (estados de cuenta mensual);
        compare credit card account growth at system level against Plata's disclosed
        customer count trajectory.
      relatedQuestionRefs:
        - QU012

    - type: missing-source
      severity: minor
      topic: colombia-expansion
      missingEvidence: >-
        Customer count, deposit volume, and regulatory approval timeline for Plata's
        Colombia savings franchise (Compañía de Financiamiento) entered August 2025.
      whyItMatters: >-
        Colombia entry represents the first geographic diversification and could reduce
        Mexico concentration risk over time, but its scale and growth trajectory are
        entirely opaque.
      diligencePath: >-
        Monitor Iupana and Colombian regulatory disclosures (Superintendencia Financiera
        de Colombia) for Plata Colombia; request update from management on Colombian
        metrics.
      relatedQuestionRefs:
        - QU013

    - type: missing-source
      severity: minor
      topic: plata-plus-adoption
      missingEvidence: >-
        Plata Plus subscriber count, monthly attach rate among credit card users,
        and cancellation/churn rate for the subscription tier.
      whyItMatters: >-
        Plata Plus is a retention and revenue indicator; a high attach rate would imply
        strong LTV expansion while a negligible rate would suggest the subscription is
        an immaterial product.
      diligencePath: >-
        Request from management in data room; alternatively, compare monthly revenue per
        customer to implied Plata Plus contribution.
      relatedQuestionRefs:
        - QU026

    - type: private-evidence-only
      severity: material
      topic: named-customer-proof-coverage
      missingEvidence: >-
        Independent testimonials from named enterprise or SME customers (as opposed to
        aggregate consumer app store ratings); verifiable case studies with quantified
        customer outcomes (e.g., credit limit improvement, time-to-approval vs incumbent).
      whyItMatters: >-
        TU003 (Named Customer Proof) enumerates consumer satisfaction signals but lacks
        enterprise or high-value segment evidence. App store ratings represent broad
        consumer sentiment, not the verified success of priority segments. Without named
        references, institutional investors cannot assess segment-level depth of proof.
      diligencePath: >-
        Request customer reference letters or case studies from management; review
        press releases for any named customer or community testimonials; monitor
        Plata's social media for verified user stories with outcome data.
      relatedQuestionRefs:
        - QU019
        - QU021
      relatedTableRefs:
        - TU003

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The planned retention/repeat cohort figure (FU004) requires time-series retention
      percentages by month or year bucket, which Plata has not publicly disclosed. A cohort
      figure with uninvestigated estimated values would misrepresent the evidence base. The
      planned cohort was substituted with table TU006 (Retention Evidence Quality and Gap
      Assessment) to document what is known, what is estimated, and what is missing.
  - dimension: tableNotes
    reason: >-
      Tables TU001 through TU006 include notes fields where appropriate. TU003 (Named
      Customer Proof) notes explain the enumeration coverage boundary and source limitations.
      All tables have notes populated or the note is structurally not applicable.
