  - id: adoption-trajectory
    title: Adoption Trajectory
    body: |
      Plata's customer acquisition trajectory is among the fastest documented for a consumer
      lender in Latin America. The credit card launched in April 2023; by the time Plata
      announced its $250M Series B in October 2025, the company claimed approximately 10%
      of all new credit cards issued in Mexico — an extraordinary share for a three-year-old
      entrant operating without a single physical branch. The about page as of May 2026 states
      "more than 3 million active credit card users" with "+3 years in operation", while the
      investor relations homepage reports 3.4 million total active customers as of 1Q26.

      Revenue serves as the best available proxy for customer activity and spending volume.
      4Q25 revenue reached MXN 2,507 million, a 212% YoY and 24% QoQ increase. 3Q25 revenue
      was MXN 2,014 million (+303% YoY). Net loans to customers grew 171% YTD by end-2025
      to MXN 9,998 million, and 1.4x YoY at 1Q26 per Fitch — consistent with continued
      rapid customer onboarding. Fitch noted that 1Q26 total operating income grew 1.9x YoY
      to USD 112 million, surpassing some similarly rated Latin American banks.

      The Google Play listing shows 5M+ downloads, substantially higher than the 3.4M active
      customer count, indicating some degree of download-to-active conversion friction or
      customer churn. Personal loans were introduced in 2024 and grew from 3.6% to 6.5% of
      the portfolio during 9M2025, indicating early cross-sell traction. The deposit franchise
      (savings accounts) was only launched in mid-March 2026 and reported USD 78M at 1Q26,
      representing a very early stage ramp with a loans-to-deposits ratio of 933.5%.
    claimRefs:
