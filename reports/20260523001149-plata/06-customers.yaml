  - id: TU005
    title: Expansion and Concentration Risk Table
    columns:
      - Expansion Driver / Concentration Risk
      - Type
      - Current Status
      - Impact on Valuation
      - Diligence Path
    rows:
      - - Credit card product concentration
        - Product concentration
        - ~93.5% of loan portfolio (3Q25)
        - High negative — single-product risk; vulnerable to regulatory cap or category recession
        - Request forward portfolio mix target; model scenario where credit card MAR declines
      - - Mexico geographic concentration
        - Geographic concentration
        - 100% of material revenue (Colombia nascent)
        - High negative — Mexico macro risk (trade tensions, peso volatility) directly flows through
        - Confirm Colombia timeline and first-year target deposits; monitor macroeconomic scenarios
      - - Single-channel digital distribution
        - Channel concentration
        - 100% mobile app; no physical branches
        - Medium negative — excludes ~18% of population without smartphone
        - Confirm OXXO or agent banking partnerships; assess rural market plans
      - - Personal loan cross-sell
        - Expansion driver
        - 6.5% of portfolio, growing
        - Positive — higher-yield, diversifies income; tests underwriting breadth
        - Request default rates on personal loans vs credit cards by cohort
      - - Savings/deposit franchise (Mexico)
        - Expansion driver
        - USD 78M deposits at 1Q26 (launched March 2026)
        - Positive long-term — reduces wholesale funding cost; improves liability mix
        - Monitor loans-to-deposits ratio trajectory; request deposit growth target for 2026
      - - Colombia entry (savings/deposits)
        - Geographic expansion
        - Early stage; Compañía de Financiamiento (savings vehicle)
        - Early positive — diversification optionality; too small to be material
        - Request Colombia customer count, deposit volume, and regulatory timeline for credit product
      - - VestFi investment partnership
        - Third-party product dependency
        - Active; CNBV-registered (registro 30165)
        - Low negative — if VestFi loses licence or exits, investment product disrupted
        - Confirm contractual SLAs and exclusivity terms with VestFi
      - - CONDUSEF complaint mechanism
        - Regulatory/reputational risk
        - CONDUSEF banca múltiple registry entry for Banco Plata exists
        - Low-medium — complaint escalation could trigger CONDUSEF sanctions or reputational damage
        - Request CONDUSEF complaint volume and resolution rates from management
    notes: >-
      Portfolio concentration percentages from Pareto 3Q2025 and 4Q2025 reports; deposit
      data from Fitch (1Q26). Colombia expansion from Iupana (August 2025). Smartphone
      penetration exclusion estimate based on INEGI ENDUTIH 2024 (82% smartphone penetration
      → ~18% excluded). VestFi registration number from Apple App Store product description.
