summary:
  headline: >-
    Banco Plata's extraordinary growth — 3.4 million customers and USD 596 million annualized revenue in under three
    years — validates its model, but a 23.9% cost of risk, pre-profitability, concentrated wholesale funding, and a USD
    3.1 billion valuation that demands sustained execution justify a TRACK stance until a clearer path to profitability
    and deposit funding is visible.
