  - id: scale-and-financial-risks
    title: Scale, Key Metrics, and Risk Signals
    body: |
      As of the first quarter of 2026, Banco Plata reports 3.4 million total active customers,
      a gross loan portfolio of $746 million, and $596 million in annualized revenue (all in USD
      per its investor relations homepage). Total assets reached MXN 17,427 million at 31
      December 2025, growing 186% year-to-date versus December 2024 levels. The net loan
      portfolio was MXN 9,998 million (+171% year-to-date) by year-end 2025, driven by strong
      credit card growth and the growing personal loan book. Fourth-quarter 2025 quarterly revenue
      reached a record MXN 2,507 million (+212% year-over-year, +24% quarter-over-quarter).

      Despite this rapid revenue growth, Banco Plata has not yet achieved profitability. The
      FY2025 net loss was MXN 1,978 million (approximately $99 million at ~20 MXN/USD), improving
      from MXN 2,150 million in 2024, but cumulative operating losses continue to accumulate.
      Fitch, which published inaugural ratings on 6 May 2026 (B+ IDRs, Positive Outlook), assigned
      a weak 'ccc+' score to earnings and profitability, noting the operating-loss-to-average-assets
      ratio was -16.5% in 1Q26 (down from -28.1% for full-year 2025). Asset quality pressures are
      rising: the Stage 3 loans ratio reached 4.8% at 1Q26 (up from 3.4% at end-2024), and cost
      of risk stood at 23.9% — elevated relative to many consumer lending peers. Strong
      capitalization (Fitch Core Capital/RWA of 12.2%, total capitalization ratio of 18.0% at
      1Q26) and over $500 million in shareholder injections since inception partially offset these
      risks, but sustained profitability and asset quality discipline remain key open questions
      for the bank's long-term credit profile.
