chapter:
  number: 1
  title: Company Overview
  summary: >-
    Banco Plata S.A., Institución de Banca Múltiple — legally constituted in May 2021
    as Tecnologías Diffiere S.A.P.I. de C.V. and converted to a licensed bank in February 2026 —
    is the fastest-growing digital bank in Mexico by customer count, reporting 3.4 million active
    customers, a $746 million gross portfolio, and $596 million in annualized revenue as of 1Q26.
    Backed by over $2 billion in combined equity and debt, it completed a $250 million Series B
    at a $3.1 billion valuation in October 2025 and is in the process of expanding beyond
    its core credit card product to full-service banking.

sections:
  - id: company-identity
    title: Company Identity and Foundations
    body: |
      Banco Plata S.A., Institución de Banca Múltiple is Mexico's fastest-growing digital bank,
      legally constituted on 24 May 2021 as Tecnologías Diffiere S.A.P.I. de C.V. and commencing
      lending operations on 1 August 2022. The company completed its transformation to a licensed
      multiple banking institution when the CNBV authorized full banking operations on 17 February
      2026 via official letter 312-1/708647/2026. Banco Plata is a 99.99%-owned direct subsidiary
      of Different Technologies LLC, a US-based holding entity whose ultimate beneficial owners
      are not publicly disclosed.

      Headquartered at Mariano Escobedo 476, Primer Piso, Colonia Anzures, Alcaldía Miguel Hidalgo,
      Ciudad de México (C.P. 11590), the company operates as a 100% digital bank with no physical
      branches. Its core business model centers on consumer financial services — anchored by the
      Plata Card credit card (up to 5% cashback, 60-day payment window) — combined with personal
      loans, savings products (Ahorro Flexible and Ahorro Fijo), and an investment account. The
      company self-describes as the largest private digital bank in Mexico by customer count,
      with over 3 million active credit card users and a claimed $5 billion valuation as of May
      2026. Banco Plata competes directly with regional digital-bank challengers including Nubank,
      Klar, and Ualá, all of which are pursuing or have recently received Mexican banking
      authorizations. Its proprietary AI-powered core banking platform, developed entirely
      in-house, enables fully automated risk management and 24/7 personalized customer service
      without a branch network.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
