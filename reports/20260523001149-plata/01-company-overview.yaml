callouts:
  - calloutType: strength
    title: "First-mover banking authorization among Mexico's digital challengers"
    body: >-
      Banco Plata received CNBV authorization to start banking operations in February 2026,
      completing a three-year regulatory process. This places it ahead of Mercado Pago, Nubank,
      and other fintechs still awaiting full operational clearance in Mexico, giving it a
      first-mover window to expand into deposits, payroll, SME lending, and international
      transfers under a full banking charter.
    claimRefs:
      - CO028
      - CO005

  - calloutType: risk
    title: "Sustained pre-profitability and rising asset quality pressure"
    body: >-
      Despite accelerating revenue growth, Banco Plata reported a FY2025 net loss of MXN 1,978
      million and an operating-loss-to-assets ratio of -16.5% in 1Q26 per Fitch. The Stage 3
      loans ratio rose to 4.8% in 1Q26 (up from 3.4% at end-2024), and cost of risk reached
      23.9%. Fitch scored earnings and profitability at 'ccc+', reflecting that the bank
      has not yet demonstrated the ability to generate sustainable positive returns. Rapid
      loan growth and a concentrated high-yield consumer credit model amplify credit-cycle risk.
    claimRefs:
      - CO037
      - CO040
      - CO044

  - calloutType: insight
    title: "Key-person concentration and undisclosed governance structure"
    body: >-
      Neri Tollardo is the sole named executive in most public regulatory and investor
      communications. The board of directors' composition, independence, and governance practices
      are not publicly disclosed. Fitch flags that governance structures were recently established
      and their effectiveness remains to be tested. Investors should request board composition,
      committee mandates, and succession planning documentation as part of standard diligence.
    claimRefs:
      - CO006
      - CO010

