  - id: regulatory-milestones
    title: Regulatory Journey and Corporate Milestones
    body: |
      Plata's transformation from a consumer credit company to a licensed bank was a multi-year
      regulatory process. The company was legally constituted as a consumer lending entity in
      May 2021 and publicly launched its Plata Card credit product in April 2023 after
      commencing legal operations in August 2022. Throughout 2023 and 2024, the company built
      its core banking infrastructure and compliance systems to CNBV standards, introducing
      personal loans as a second product in 2024.

      The key regulatory inflection point came on 16 December 2024, when the CNBV approved
      Banco Plata's transformation from Tecnologías Diffiere S.A.P.I. de C.V. into a full
      Institución de Banca Múltiple. The statutory shareholder assembly to adopt the new bank
      charter was formally protocolized and filed with the CNBV on 15 January 2025. Final
      authorization to begin banking operations was granted on 17 February 2026 via CNBV official
      letter 312-1/708647/2026, and full banking operations commenced in March 2026 per Fitch's
      inaugural rating assessment. The nearly 14-month gap between license approval and
      full-operations authorization reflects the rigorous capitalization, governance, and
      compliance requirements imposed by the CNBV. Banco Plata is among the first fully
      digital-only banks in Mexico to complete this regulatory transition, placing it ahead
      of Mercado Pago and Nubank in achieving operational bank status under the CNBV framework.
    claimRefs:
