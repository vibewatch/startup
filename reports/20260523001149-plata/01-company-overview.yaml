  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: corporate-structure
      missingEvidence: >-
        Identity of ultimate beneficial owners of Different Technologies LLC (the 99.99% parent)
        and the full capitalization table including investor equity percentages.
      whyItMatters: >-
        Without knowing who controls Different Technologies LLC, the effective control structure
        and potential conflicts of interest cannot be fully assessed; this is a standard AML/KYC
        and governance diligence requirement for banking investments.
      diligencePath: >-
        Request shareholder registry, corporate structure chart, and beneficial ownership
        declarations from Banco Plata management; review US beneficial ownership filings if available.
      relatedQuestionRefs:
        - QO012

    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: >-
        Full board of directors composition, independent director identities, committee structure,
        and succession planning documentation for Banco Plata.
      whyItMatters: >-
        Governance structure effectiveness and key-person risk cannot be fully evaluated without
        knowing the full board composition; Fitch explicitly flags this as a near-term governance
        limitation.
      diligencePath: >-
        Request board composition documentation from Banco Plata; review CNBV governance
        disclosures and any public regulatory filings that name board members.
      relatedQuestionRefs:
        - QO003
      relatedTableRefs:
        - TO002

    - type: stale
      severity: minor
      topic: customers
      missingEvidence: >-
        Verified employee headcount for Banco Plata as of 2026; the most recent public
        figure (2,500–3,000+) is from October 2025 press coverage.
      whyItMatters: >-
        Headcount growth rate is an indicator of operating-expense trajectory and burn rate;
        given the bank's pre-profitability status and rapid scale-up, current employee count
        would inform cost-structure analysis.
      diligencePath: >-
        Request current headcount data from Banco Plata management; monitor IMSS or other
        official Mexican employer records if accessible.
      relatedQuestionRefs:
        - QO016

    - type: missing-source
      severity: minor
      topic: valuation
      missingEvidence: >-
        Independent third-party market valuation for Banco Plata as of 2026 that could
        corroborate or explain the discrepancy between the company's stated $5 billion valuation
        and the October 2025 Series B pricing of $3.1 billion.
      whyItMatters: >-
        The $5 billion figure on the company's about page exceeds the most recent arm's-length
        equity pricing by approximately 60%; without an independent analyst or secondary-market
        reference, the $5 billion figure cannot be validated and may reflect internal model
        assumptions or post-bank-authorization premium claims not yet supported by market data.
      diligencePath: >-
        Request a third-party 409A or fair-market-value appraisal; review any secondary
        transaction pricing or analyst coverage that may reference a post-Series-B valuation.
      relatedQuestionRefs:
        - QO022

    - type: missing-source
      severity: minor
      topic: investors
      missingEvidence: >-
        Detailed cap table for Banco Plata including investor equity percentages, share classes,
        preferred-stock terms, and liquidation preferences for the stakeholder or investor map.
      whyItMatters: >-
        Without confirmed equity percentages, the economic and control importance of each
        investor in the stakeholder map cannot be fully assessed; this is a standard diligence
        requirement for private-equity or venture-stage banking investments.
      diligencePath: >-
        Request audited cap table and shareholder agreement summaries from Banco Plata
        management as part of formal due diligence access.
      relatedQuestionRefs:
        - QO010
      relatedTableRefs:
        - TO003

    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: >-
        Adverse events, partnership announcements, and product-launch details for the milestone
        table beyond what is captured in press releases and earnings filings; specifically,
        adverse regulatory actions, complaints, or material litigation are not evidenced.
      whyItMatters: >-
        The milestone table is the single chronology of record; gaps in adverse events or
        partnership milestones reduce its completeness as a diligence reference and could
        obscure material corporate events.
      diligencePath: >-
        Review CONDUSEF complaint data, CNBV enforcement records, and Mexican court filings
        for any adverse regulatory or legal events involving Banco Plata or its predecessors.
      relatedTableRefs:
        - TO004

