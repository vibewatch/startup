          - type: callout
            title: The best upside case is platform, not hardware
            body: >-
              If Xingyuanzhi wins, it likely wins as a cross-embodiment brain and controller layer rather than as
              another robot-body brand. That can be valuable, but only if attach rates and switching costs become
              visible.
            calloutType: insight
