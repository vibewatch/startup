          - type: callout
            title: Unicorn status does not equal valuation support
            body: >-
              The retained record can support treating Xingyuanzhi as a unicorn-band company, but it cannot support
              price-insensitive underwriting at that level without financial statements, concentration data, and
              term-sheet terms.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV008
