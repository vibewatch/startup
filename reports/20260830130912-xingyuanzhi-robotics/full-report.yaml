      - number: '5.2'
        title: Architecture and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              The architecture that can be inferred from retained sources is sensible for real robots. Lavx describes a
              domain controller paired with general-purpose embodied AI models running on edge hardware in real time,
              explicitly avoiding cloud round-trips. That matches what one would expect for manipulation, navigation,
              and physically interactive workflows where latency and connectivity failures are unacceptable. Public use
              cases span shelf picking, inspection, guidance, food service, eldercare, and intelligent loading and
              unloading, and Lavx specifically ties RoboBrain Pro to EP Equipment loading-unloading work. The partner
              surface and official claims suggest the architecture is intended to generalize across humanoid and
              industrial embodiments rather than a single bespoke robot. At the same time, the public record strongly
              implies high-touch deployment. A brain-layer vendor still depends on robot bodies, sensors, workflows, and
              site-specific validation. The category-level NVIDIA and Isaac documentation shows how much
              plumbing—sensors, ROS 2 packaging, simulation, mapping, pose estimation, and control-loop validation—sits
              beneath the marketing phrase “robot brain.”
