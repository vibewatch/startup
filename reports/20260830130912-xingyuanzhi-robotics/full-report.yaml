  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking and Legal / Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi’s risk profile is not primarily about whether embodied AI has market attention; it is about
              whether a very young brain-layer vendor can commercialize inside a stack it does not fully control. The
              highest residual risks today cluster around advanced-compute dependence, ambiguous legal liability
              allocation, and the lack of public governance artifacts that would let an outside investor verify how
              safety, privacy, and cybersecurity are being handled. Policy conditions in China are supportive, but
              supportive policy is not the same as de-risked operations. In fact, fast policy support can increase
              commercialization pressure before documentation, testing, and cross-border compliance are mature. That
              creates a classic frontier-technology pattern: the addressable opportunity is real, yet the risk-bearing
              mechanisms are still being assembled. For a diligence reader, the practical takeaway is that legal and
              regulatory questions should sit near the top of the checklist, not at the end, because they determine
              whether growth is financeable.
