      - number: '3.2'
        title: Peer Profiles, Product Scope, and Capability Pressure
        blocks:
          - type: paragraph
            body: >-
              Among direct peers, Spirit AI looks strongest on public industrial proof. It combines a VLA
              foundation-model story with the Moz humanoid platform and claims world-first large-scale deployment on
              CATL battery production lines, a level of specific production evidence that Xingyuanzhi has not published.
              X Square Robot looks stronger on research velocity and public technical output, using its official
              research page to showcase world models, embodied foundation models, and hundreds of matched sim-to-real
              rollouts. GigaAI appears to lean harder into Physical AGI and home as well as industrial scenarios, while
              Astribot is more explicitly hardware-forward around a wheeled dual-arm home-assistant form factor. These
              distinctions matter because they show what buyers may really compare: not simply “brain quality,” but the
              depth of deployable embodiment, training data acquisition, and proof that the intelligence layer works in
              physical workflows. Xingyuanzhi’s differentiation remains its neutrality, but that neutrality is only
              defensible if customers believe it beats internal build or vertical integration on time, cost, or
              reliability.
