      - number: '2.2'
        title: Sizing Lenses and Analytical Contradictions
        blocks:
          - type: paragraph
            body: >-
              The market-sizing record for embodied intelligence is crowded but inconsistent because different
              publishers measure different things. Goldman Sachs publishes a long-run global humanoid TAM floor of US$6
              billion and a blue-sky 2035 ceiling of US$154 billion, while CNBC reports a Barclays view that the market
              starts around US$2-3 billion today and could reach US$200 billion by 2035. IDTechEx offers a more moderate
              2036 outcome near US$29.5 billion, and Deloitte frames 2026 industrial-use humanoids at only US$210-270
              million before a possible climb to US$600 million-US$1 billion by 2032. Those differences are not errors
              so much as scope mismatches: some models measure hardware revenue, others future economic value, and
              others current industrial shipments. IFR’s industrial-robot baseline and EmbodiedGlobal’s capital-flow
              data help bound the nearer-term opportunity. China already has the world’s largest industrial-robot
              installed base and the most aggressive capital concentration in embodied AI, which implies that a
              China-first serviceable market for brain-layer vendors exists. What is still missing is a standalone
              published TAM or SAM for the robot-brain layer itself.
