  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Xingyuanzhi is narrower than the headline humanoid-robotics market and broader
              than a single controller SKU. Public company and media sources consistently frame Xingyuanzhi as a seller
              of the robot “brain”: embodied foundation models, world-model software, edge inference, and the controller
              hardware needed to run those systems on different robot bodies. That means the company participates in a
              layer between silicon and whole-robot OEM revenue. Included spend therefore covers the intelligence stack,
              edge compute, integration, and deployment support that make a robot usable in a real workflow. Excluded
              spend includes the manufacture of robot bodies, commodity actuators, and large facility redesign projects
              that a brain-layer vendor does not directly capture. The closest substitutes are not only other brain
              vendors but also fixed industrial robots, AMRs, quadrupeds, in-house autonomy teams, and human labor. For
              Xingyuanzhi to win, buyers must believe that outsourced embodied intelligence can reach acceptable
              latency, safety, and cost without sacrificing control of the finished robot experience.
            claimRefs:
