      - number: '8.2'
        title: Market Growth and Comparable-Valuation Anchors
        blocks:
          - type: paragraph
            body: >-
              The market backdrop is supportive but not clean enough to rescue the missing company-specific metrics.
              Multiple third-party forecasts point to substantial humanoid and physical-AI growth over the next decade,
              which supports the argument that robot-brain platforms may become very valuable if they earn a horizontal
              role. Yet those same forecasts disagree dramatically on market size and slope, which means they are better
              suited to validating strategic direction than to pinning a narrow present-day valuation. Public comps tell
              a similar story. UBTECH, Serve Robotics, and Symbotic span a huge valuation range because the market
              rewards very different things: clear revenue scale, public proof, business-model clarity, and deployment
              depth. Xingyuanzhi has an appealing platform thesis, but it does not yet have Symbotic-level proof or
              UBTECH-level public-market comparability. Private peers such as Spirit AI further constrain the premium
              case because stronger public deployment evidence already exists elsewhere in the same China ecosystem.
              Even the broader boundary comps remind investors that category excitement alone does not create a usable
              pricing formula.
            claimRefs:
