  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Boundary Logic
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi should not be judged against every humanoid company in China as if they all compete in one
              flat market. Its defining strategic choice is to sell an external embodied-brain layer instead of a
              finished robot body. That narrows the direct peer set to companies trying to own robot cognition, world
              models, edge controllers, or the combined software-hardware intelligence stack. Spirit AI, X Square Robot,
              and GigaAI are therefore better direct comparison points than robot manufacturers that primarily monetize
              finished hardware. At the same time, the broader competitive field still matters because buyers can solve
              the same jobs through simpler substitutes such as AMRs, quadrupeds, and fixed automation. Full-stack robot
              OEMs like AgiBot and Astribot are especially important because they can be both partners and future
              displacers. This mixed field means Xingyuanzhi competes simultaneously against direct brain vendors,
              vertically integrated OEMs, incumbents like NVIDIA, and status-quo automation that may be less glamorous
              but easier to buy.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
