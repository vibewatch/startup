              integration, data, workflow know-how, or deployment speed rather than from reinventing every robotics
              primitive. The public roadmap supports an active development-stage interpretation. Official pages show a
              visible shift from T5 to N5, while 36Kr says fresh capital is funding next-generation embodied-brain and
              world-model R&D. Public maturity proof, however, still lags the vision. Commercial deployments exist, but
