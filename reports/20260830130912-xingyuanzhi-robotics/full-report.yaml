  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi’s product story is unusually clear at the positioning level and unusually thin at the
              module-documentation level. Official Chinese and English surfaces consistently describe the company as
              building a general-purpose embodied brain for the physical world, with an emphasis on multimodal spatial
              intelligence and cross-embodiment generalization. That framing implies a customer buys decision-making and
              control capability rather than a robot body. Public module visibility shows at least two hardware-linked
              platform generations. The company overview points to the earlier T5 embodied-brain compute platform, while
              the current product pages foreground N5 and describe it as a compact Jetson Thor platform for on-device
              deployment. Media descriptions reinforce that these products are controller-class systems paired with
              embodied AI models rather than finished robots. What is still missing is the kind of documentation a
              mature platform would expose: richer public SKU breakdowns, performance sheets, or developer-facing module
              docs. As a result, the strategic product definition is strong, but the product-line evidence remains
              partial.
