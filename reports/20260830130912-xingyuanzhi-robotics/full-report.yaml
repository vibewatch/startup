      - number: '8.3'
        title: Bull / Base / Bear Ranges and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Because exact financial statements are not public, the most defensible valuation approach is
              scenario-based. The bull case assumes Xingyuanzhi becomes a de facto neutral brain standard across
              multiple robot OEMs, converts strategic logos into repeatable deployments, and publishes enough
              reliability and retention evidence to earn a platform premium. The base case assumes the company remains
              important and well funded but still China-first, partner-led, and only partially transparent on economics.
              The bear case assumes partner internalization, chip friction, or sentiment cooling before hard proof
              arrives. These scenarios do not pretend to be precise targets; they are disciplined ranges designed to
              express how sensitive value is to milestones that remain unverified today. That is why entry discipline
              matters. A company can be strategically important and still be a poor buy if the investor is paying for
              proof that has not yet been published.
