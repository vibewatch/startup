            title: Top risk is not demand — it is dependency plus opacity
            body: >-
              The public evidence suggests embodied-AI demand and policy support are real. The harder problem is that
              Xingyuanzhi depends on controlled compute, partner embodiments, and still-undisclosed economics while
              offering limited public trust artifacts.
