  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Logic
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi’s public financial story starts with a structurally useful distinction: it is not trying to
              monetize complete robot bodies. Instead, retained company and media sources consistently describe a B2B
              robot-brain business built around controller hardware, embodied-model software, and integration into
              customer robot embodiments. Financially, that places the company somewhere between enterprise hardware
              infrastructure and robotics middleware rather than pure software or capital-heavy OEM manufacturing. This
              distinction matters because it changes what “good” financial performance should look like. Investors
              should expect hardware-enabled deployments, scenario-specific integration, and strategic customer
              relationships—not self-serve subscriptions or mass-market device revenue. Public evidence is still too
              thin to separate exactly how much of each contract comes from hardware, software, or services, but the
              available record strongly suggests that monetization is blended. That blend may become an advantage if the
              company captures recurring software attach on top of controller sales, but today the public disclosure is
              not detailed enough to prove it.
