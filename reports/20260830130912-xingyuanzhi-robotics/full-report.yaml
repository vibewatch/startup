    embodied-brain stack intended to work across humanoid and industrial robot embodiments. Publicly visible
    counterparties such as AgiBot, Beijing Yizhuang Robot, and Zhongli/EP-linked workflows make the company
    strategically relevant, but its commercial quality remains harder to verify than its narrative strength.
