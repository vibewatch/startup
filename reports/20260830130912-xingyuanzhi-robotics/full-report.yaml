              NVIDIA’s hardware and software documentation, plus the visible GitHub ecosystem around Isaac ROS, show
              that robotics developers already have access to common packages for localization, mapping, pose
              estimation, simulation, and humanoid model development. That does not make Xingyuanzhi irrelevant; it
