  evidenceGaps:
  - type: missing-source
    severity: material
    topic: litigation and enforcement visibility
    missingEvidence: Court-record, regulator-enforcement, and recall checks tied directly to Xingyuanzhi or its products.
    whyItMatters: >-
      Without direct legal-record review, investors cannot confirm whether absence of public discussion reflects a clean record or simply weak visibility.
    diligencePath: Run PRC court/regulator searches and request litigation and incident representations from counsel.
    relatedQuestionRefs:
    - QR005
  - type: missing-source
    severity: high
    topic: product liability insurance and indemnity allocation
    missingEvidence: >-
      Insurance certificates, indemnity clauses, and contract allocation of responsibility between Xingyuanzhi, robot OEMs, integrators, and operators.
    whyItMatters: >-
      Liability can crystallize quickly if a deployed robot causes injury or property damage and the stack spans multiple vendors.
    diligencePath: Review master commercial agreements and insurance schedules; confirm limits and exclusions.
    relatedQuestionRefs:
    - QR021
  - type: missing-source
    severity: material
    topic: management depth and board oversight
    missingEvidence: Board composition, reporting lines, and succession coverage for core technical and deployment roles.
    whyItMatters: A young platform company can become key-person fragile just as customer demands and compliance obligations rise.
    diligencePath: Request org chart, board list, option refresh policy, and succession plan.
    relatedQuestionRefs:
    - QR024
  - type: missing-source
    severity: high
    topic: safety incident and recall history
    missingEvidence: Deployment incident logs, near-miss reports, corrective-action records, and any formal recall or field-failure history.
    whyItMatters: Safety credibility cannot be inferred from demos or partnership logos alone.
    diligencePath: Request incident register and post-mortem archive; interview deployment and support leads.
    relatedQuestionRefs:
    - QR025
  - type: private-evidence-only
    severity: high
    topic: export classification and chip sourcing
    missingEvidence: Exact compute BOM, ECCN classification, chip origin, approved substitutes, and end-user compliance procedures.
    whyItMatters: Compute-supply or license disruption could halt deliveries and materially impair valuation.
    diligencePath: Obtain supplier map, ECCN memo, and contingency plan for controlled components.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
