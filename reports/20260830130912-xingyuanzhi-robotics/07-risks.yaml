- id: operational-and-commercialization-risk
  title: Operational Safety, Commercialization, and Data-Governance Risk
  body: >-
    Operationally, Xingyuanzhi sits in one of the hardest corners of AI: systems that have to perceive, decide, and act safely in the physical world. The public record supports a credible product vision, but it does not remove the reality-gap problem between demonstrations and robust site-level performance. OSHA’s generic robotics guidance and Deloitte’s physical-AI analysis both reinforce that failures often emerge during commissioning, maintenance, tuning, or unexpected environmental variation. IFR adds an important market-specific caution: humanoid capabilities remain limited in real production settings even while publicity is expanding. That matters because a company selling an embodied brain is only as good as the consistency of the entire deployment loop. Data governance adds another layer. If Chinese embodied-AI leaders are scaling data-collection operations aggressively, any vendor working in multimodal robotics should be expected to explain provenance, permissions, logging, and
    downstream control even if no scandal is publicly visible yet.
  claimRefs:
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR027
  - CR028
  - CR035
  - CR036
  - CR037
