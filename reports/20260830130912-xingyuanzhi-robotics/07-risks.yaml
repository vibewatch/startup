  figureRefs:
  - FR002
- id: dependency-and-execution-risk
  title: Partner, Geographic, and People / Execution Risk
  body: >-
    Xingyuanzhi’s partner web is both the route to scale and the source of fragility. The company is strongest when it plugs into serious robotics counterparties such as AgiBot and the Beijing robotics ecosystem, because those relationships accelerate access to use cases, events, and buyer attention. The same relationships, however, create internalization, concentration, and geographic-cluster risk. A large OEM can learn from a partner and later pull more of the stack in-house. A Beijing-centered ecosystem can drive rapid visibility while simultaneously making pipeline quality overly dependent on conference activity, local policy, and a single regional cluster. Execution risk also rises because the company is extremely young relative to the breadth of coverage implied by media reports. Public sources do not yet disclose enough about management depth, governance, or deployment-team scale to conclude that the organization is ready for broad multi-account scaling without key-person strain.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR031
  - CR038
  - CR039
  tableRefs:
  - TR003
  - TR004
