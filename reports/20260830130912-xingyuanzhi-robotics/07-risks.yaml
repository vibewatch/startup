callouts:
- calloutType: risk
  title: Top risk is not demand — it is dependency plus opacity
  body: >-
    The public evidence suggests embodied-AI demand and policy support are real. The harder problem is that Xingyuanzhi depends on controlled compute, partner embodiments, and still-undisclosed economics while offering limited public trust artifacts.
  claimRefs:
  - CR001
  - CR003
  - CR012
  - CR033
  - CR042
- calloutType: insight
  title: China-first scale can lower one risk while raising another
  body: >-
    China’s supportive robotics policy and Beijing ecosystem density make early commercialization more achievable, but they can also hide geographic concentration and encourage deployment speed ahead of governance maturity.
  claimRefs:
  - CR023
  - CR024
  - CR029
  - CR030
- calloutType: recommendation
  title: Demand direct evidence before underwriting liability and concentration
  body: >-
    An investor should not rely on logos, funding, or policy momentum alone. The minimum next step is contract-level liability review, export-control classification, customer concentration data, and an incident-history check.
  claimRefs:
  - CR025
  - CR040
  - CR041
