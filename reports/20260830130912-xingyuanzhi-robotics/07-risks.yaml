chapter:
  number: 7
  title: Risks
  summary: >-
    Xingyuanzhi’s biggest risks come from compute dependence, partner/internalization exposure, and a thin public governance record rather than from lack of sector momentum. China’s embodied-AI tailwinds are real, but the public evidence still leaves too much uncertainty around liability allocation, deployment robustness, customer concentration, and underlying economics to rate residual risk anything below high.
sections:
- id: risk-ranking-and-legal-exposure
  title: Risk Ranking and Legal / Regulatory Exposure
  body: >-
    Xingyuanzhi’s risk profile is not primarily about whether embodied AI has market attention; it is about whether a very young brain-layer vendor can commercialize inside a stack it does not fully control. The highest residual risks today cluster around advanced-compute dependence, ambiguous legal liability allocation, and the lack of public governance artifacts that would let an outside investor verify how safety, privacy, and cybersecurity are being handled. Policy conditions in China are supportive, but supportive policy is not the same as de-risked operations. In fact, fast policy support can increase commercialization pressure before documentation, testing, and cross-border compliance are mature. That creates a classic frontier-technology pattern: the addressable opportunity is real, yet the risk-bearing mechanisms are still being assembled. For a diligence reader, the practical takeaway is that legal and regulatory questions should sit near the top of the checklist, not at the end,
    because they determine whether growth is financeable.
  claimRefs:
