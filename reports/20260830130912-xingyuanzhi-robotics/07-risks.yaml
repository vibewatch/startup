  - FR003
- id: financial-model-risk-and-mitigations
  title: Financial / Model Risk, Mitigations, and Kill Criteria
  body: >-
    Financially, the core problem is not that Xingyuanzhi looks underfunded on the surface; it is that public evidence does not show whether the current capital base is being converted into durable, defensible economics. Roughly ¥1 billion raised in less than a year is impressive, but it can amplify expectations faster than it proves repeatable revenue. In a crowded, subsidy-rich sector, a brain-layer specialist must defend both technical relevance and pricing power while simpler automation substitutes keep improving. That means investors should treat missing revenue concentration, burn, margin, and renewal data as first-order risks, not minor gaps. The good news is that the mitigation agenda is clear: diversify compute exposure where possible, publish stronger trust and validation artifacts, prove expansion beyond a few strategic logos, and instrument explicit kill criteria tied to chip access, customer internalization, deployment proof, and safety incidents. Investors should also demand
    evidence that management can prioritize safely when publicity, engineering ambition, and fundraising pressure all rise together. Until those are visible, the appropriate residual rating remains high.
  claimRefs:
