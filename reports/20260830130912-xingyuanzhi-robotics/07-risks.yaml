- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Advanced-compute access disruption
    - Supplier or policy update
    - Loss of access to required chips or no approved substitute within one quarter
    - Pause underwriting; reassess delivery roadmap
  - - Anchor OEM internalization
    - Partner product announcements or contract changes
    - AgiBot or equivalent partner replaces Xingyuanzhi layer on key workflow
    - Thesis-break on partner-led scale case
  - - Deployment proof lag
    - New funding cycle approaches
    - No credible public deployment KPI, retention metric, or revenue proof before next financing event
    - Shift stance toward avoid or deep discount only
  - - Safety or compliance incident
    - Incident, regulator inquiry, or legal notice
    - Meaningful field injury, material data incident, or formal enforcement action
    - Escalate to red-flag diligence and legal review
  - - Key-person / governance shock
    - Executive or board change without visible backfill
    - Departure of core technical leader or hidden governance dispute
    - Reassess execution discount and terms
  - - Concentration remains opaque
    - Diligence data request response
    - Company declines to share customer concentration and burn data in diligence
    - Treat valuation support as insufficient
  notes: Thresholds are investor monitoring rules derived from the public evidence base, not company-published internal limits.
