  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景、证据质量与当前建议
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi 很容易让人觉得投资逻辑有吸引力，却很难精确定价。保留下来的证据支撑了一条强战略叙事：公司立足中国，由 BAAI 孵化，聚焦机器人大脑层而非硬件本体，并在不到一年里融到约 ¥1
              billion。这样的组合足以让严肃投资人重视，也足以把公司视为到 2026
              年中处在独角兽区间。但这还不足以支持在某个明确价格上给出买入结论。公开证据仍没有收入、毛利率、烧钱速度、积压订单或股权结构表细节，尽调团队也就无法把叙事强度转换成常规投资测算模型。因此，正确建议必须随证据而动。按今天的材料，公司应归入继续研究：值得密切跟踪，也可能很有吸引力，但现有支撑还不足以做出肯定且不敏感于价格的投资决定。
