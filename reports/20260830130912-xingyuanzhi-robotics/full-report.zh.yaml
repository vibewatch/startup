      - number: '2.2'
        title: 市场规模口径与分析矛盾
        blocks:
          - type: paragraph
            body: >-
              具身智能的市场规模记录很拥挤，也不一致，因为不同发布方衡量的东西不同。Goldman Sachs 给出长期全球人形机器人 TAM 下限 US$6 billion，以及 2035 年蓝天上限 US$154
              billion；CNBC 则报道 Barclays 的观点，称市场今天约为 US$2-3 billion，到 2035 年可能达到 US$200 billion。IDTechEx 给出更温和的 2036
              年结果，接近 US$29.5 billion；Deloitte 则把 2026 年工业用途人形机器人规模放在仅 US$210-270 million，之后到 2032 年可能升至 US$600
              million-US$1 billion。这些差异并非错误，更像口径错位：有的模型衡量硬件收入，有的衡量未来经济价值，有的衡量当前工业出货。IFR 的工业机器人基线和 EmbodiedGlobal
              的资本流数据，有助于圈定更近端的机会。中国已经拥有全球最大的工业机器人装机基础，也拥有具身 AI
              中最激进的资本集中度，这意味着面向中国、服务大脑层供应商的可服务市场确实存在。仍缺少的是，针对机器人“大脑”层本身的独立公开 TAM 或 SAM。
