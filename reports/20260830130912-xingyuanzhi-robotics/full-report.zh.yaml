companyProfile:
  summary: >-
    Xingyuanzhi Robotics 是一家位于北京的具身智能初创公司，由 Beijing Academy of Artificial Intelligence
    孵化，重点卖机器人“大脑”层，而不是成品机器人本体。它对外讲的产品线围绕 T5 系列和更新的边缘计算平台、多模态空间智能，以及一套希望跨人形和工业机器人形态复用的通用具身大脑栈展开。AgiBot、Beijing Yizhuang
    Robot 以及 Zhongli/EP 工作流等公开可见交易对手，让公司具备战略意义；但和叙事强度相比，它的商业质量仍更难验证。
