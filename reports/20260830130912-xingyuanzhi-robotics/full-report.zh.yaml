    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与落点
        blocks:
          - type: paragraph
            body: >-
              作为一家如此年轻的机器人公司，Xingyuanzhi 的公开身份少见地清晰。它在中文官网、英文官网和更长的公司简介中，都把自己描述为一家位于北京、成立于 2025-08-01、由 Beijing Academy
              of Artificial Intelligence 孵化的具身智能公司。核心卖点不是造完整机器人，而是提供“大脑”层：多模态空间智能、具身基础模型栈，以及可嵌入不同机器人本体的边缘计算。这个定位很关键，因为
              Xingyuanzhi 更像大脑优先的平台供应商，而不是资本开支很重的全栈硬件 OEM。公开地址证据指向海淀联络办公室和亦庄注册主体，也符合一家横跨北京科研与产业集群的公司形态。官方页面还显示产品迭代很快：最初的
              T5 控制器撑起 2025 年发布故事，而当前产品页面已突出更新的 N5 和 BotPack 式边缘平台。因此，尽管许多经营指标披露仍薄，Xingyuanzhi
              看起来已经更像使能型中间件和计算供应商，而不是单一产品初创公司。
