      - number: '1.4'
        title: 里程碑、客户与披露风险
        blocks:
          - type: paragraph
            body: >-
              对一家成立还不到一年的公司来说，Xingyuanzhi 的里程碑曲线异常密集。官方页面把 2025 年与 T5 发布及其早期接入 AgiBot 的 Genie G2 联系起来，又把 2026 年与 ω-EVA
              发布、BAAI 牵头的世界模型实验室、Hannover Messe、Fortune China Tech 50 入选，以及面向 Zhongli 或 EP Equipment
              的装卸解决方案全球商业化推出联系起来。客户图景也强于许多早期具身 AI 初创公司：公开材料直接点名 AgiBot 和 Beijing Yizhuang Robot，把至少 RMB500 million
              的三年订单目标附在 Yizhuang 关系上，并描述覆盖政务服务、巡检、导航和物流的部署。不过，同一批来源也暴露出本报告最大的尽调约束。公开牵引力数据很薄，质量也参差。低信誉摘要称 T5 出货数百台、收入超过
              RMB10 million、团队约 50 人，但主流和官方材料没有进一步给出确认收入、在手订单转化、毛利率或核验员工数。在 2026 年这个资本充裕但商业证明稀缺的赛道里，这个披露缺口是实质问题，不是表面瑕疵。
