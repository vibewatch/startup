              在研发，说明组织主要为技术迭代而搭建，而非为规模化一线销售而搭建。公开产品页面显示控制器平台从 T5 演进到突出 N5 和 Jetson Thor 的界面，这意味着持续硬件刷新和平台移植开支。业务跑在
