  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与边界逻辑
        blocks:
          - type: paragraph
            body: >-
              不应把 Xingyuanzhi
              放在中国所有人形机器人公司旁边，假设它们都在同一个平面市场竞争。它最核心的战略选择，是销售外部具身大脑层，而不是成品机器人本体。这会把直接同业缩小到那些试图掌握机器人认知、世界模型、边缘控制器，或软硬件一体智能栈的公司。因此，Spirit
              AI、X Square Robot 和 GigaAI 比主要靠成品硬件变现的机器人制造商更适合作为直接参照。与此同时，更宽的竞争场也很重要，因为买方可以用
              AMR、四足机器人和固定自动化等更简单的替代方案解决同样任务。AgiBot 和 Astribot 这类全栈机器人 OEM 尤其重要，因为它们既可能是伙伴，也可能在未来替代
              Xingyuanzhi。这个混合场意味着，Xingyuanzhi 同时在和直接大脑供应商、垂直整合 OEM、NVIDIA 等既有厂商，以及不那么炫目但更容易采购的现状自动化竞争。
