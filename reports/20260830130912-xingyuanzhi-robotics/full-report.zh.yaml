      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              相比精确 SAM，Xingyuanzhi 的实际买方地图更清楚。公开来源至少指向四类买方。第一类是 AgiBot 等人形或具身机器人 OEM，它们想要高性能大脑层，但不想每个组件都自己造。第二类是 Zhongli
              或 EP 等工业机器或车辆制造商，它们可以把大脑栈与叉车、移动搬运设备或仓库工作流结合。第三类是 Beijing Yizhuang Robot
              等地方政府或开发区运营方，它们关心服务场景、示范部署和生态搭建。第四类是运行巡检和维护任务的公用事业或工业运营商。各细分市场的预算归属不同，但模式一致：付款方通常不是终端消费者，而是希望快速获得可部署能力的
              OEM 产品团队、运营高管、自动化经理或公共部门采购部门。劳动力短缺、多 SKU 工作流和低延迟边缘控制需求拉动采用。最先形成有意义部署的垂直场景仍是制造、物流和巡检；家庭或广泛消费者服务场景还更远。
