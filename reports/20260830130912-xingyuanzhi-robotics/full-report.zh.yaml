              Deloitte 的物理 AI 分析都强化了一点：故障常常出现在调试、维护、调优或意外环境变化中。IFR
              又给出一个重要的市场特定警示：即便宣传正在扩张，人形机器人在真实生产环境中的能力仍有限。这很关键，因为出售具身大脑的公司，价值取决于整条部署闭环的一致性。数据治理再加一层风险。如果中国具身 AI
              头部企业正激进扩大数据采集运营，任何在多模态机器人中工作的供应商，都应当解释数据来源、授权、日志和下游控制；即使当前尚未出现公开丑闻，也不能跳过这些问题。
