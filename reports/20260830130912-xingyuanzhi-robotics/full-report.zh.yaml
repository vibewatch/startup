        title: 定价、分发能力与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              整个具身 AI 领域的公开定价透明度都很弱，而这本身就有战略意义。保留下来的竞争对手来源很少披露标价、合同结构或维护条款，说明市场仍主要靠战略合作、试点和协商式企业销售运转，而不是 SKU
              级比价。最好的公开对照来自相邻的仓库自动化供应商，例如 EP：它们公布租赁和购买价格，承诺一周交付或一天实施，甚至声称一年内回本。这种清晰度会压迫任何服务相似物流任务的具身智能供应商。因此，Xingyuanzhi
              的切换摩擦不能只来自价格不透明。它必须来自已经安装的工作流、边缘集成、模型调优、安全验证，以及客户在嵌入大脑栈后更换供应商所需付出的努力。多供应商并用同样是严肃风险，因为买方可以组合外部供应商、NVIDIA
              基础组件和内部工程，而不必永远标准化到单一供应商。
