      - number: '3.2'
        title: 同业画像、产品范围与能力压力
        blocks:
          - type: paragraph
            body: >-
              在直接同业中，Spirit AI 的公开工业证明最强。它把 VLA 基础模型叙事与 Moz 人形机器人平台结合，并声称在 CATL 电池产线上完成全球首个大规模部署；这种具体生产证据，Xingyuanzhi
              尚未发布。X Square Robot 在研究速度和公开技术输出上更强，它用官方研究页面展示世界模型、具身基础模型，以及数百次匹配的仿真到真实落地。GigaAI 看起来更偏向 Physical
              AGI，并覆盖家庭和工业场景；Astribot
              则更明确地围绕轮式双臂家庭助手形态推进硬件。这些差异很重要，因为它们说明买方真正比较的未必只是“大脑质量”，而是可部署具身深度、训练数据获取能力，以及智能层能在物理工作流中跑通的证据。Xingyuanzhi
              的差异化仍是中立性，但只有当客户相信它在时间、成本或可靠性上胜过自建或垂直整合时，这种中立性才守得住。
