      - number: '1.3'
        title: 资金底座与投资人结构
        blocks:
          - type: paragraph
            body: >-
              融资叙事是 Xingyuanzhi 成为中国 2026 年具身 AI 浪潮关注对象的最直接原因。公开材料显示，公司在 2025 年 9 月完成 RMB200 million 天使轮，2025 年 12 月完成超过
              RMB100 million 的天使+ 轮，并在 2026-06-03 宣布 Pre-A 轮。公司页面、36Kr、Pandaily 和其他摘要反复出现同一个标题：成立后头十个月累计融资约 RMB1
              billion。投资人名单几乎和融资总额一样重要。天使轮混合了风险资本和 AgiBot、Zhongli 等战略支持方；Pre-A 则集合了财务投资人、国资背景基金，以及 Beijing Industrial
              Investment、CRRC Capital 等产业资本。36Kr 和官方公司简介还称 Yuansheng
              连续跟投三轮，暗示至少有一位高确信度投资人愿意持续押注执行。需要警惕的是，融资速度跑在披露质量前面。公开来源给出投资人名称和高层次资金用途，但没有披露逐轮投后估值、股权结构表、清算优先权、债务或老股交易。投资人显然在为战略可选性付费，但精确的定价架构仍是私有信息。
