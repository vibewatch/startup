  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 先进算力获取冲击
        - 一个季度内没有合格替代关键算力
        - 交付路线图和客户信任同时走弱
        - 暂停投资判断并立即重估下行
      - - 合作方内部化
        - 旗舰 OEM 在核心工作流替换 Xingyuanzhi 层
        - 平台标准投资逻辑破裂
        - 除非估值重置，否则转向回避
      - - 证据滞后拖到下一轮
        - 下一次融资事件前没有有意义的部署 KPI、收入证据或客户广度更新
        - 叙事跑在证据前面；降价轮风险上升
        - 假设会出现结构化条款，或普通股价值更低
      - - 安全或合规事件
        - 重大现场事故、执法行动或数据治理争议
        - 信任折价和客户犹豫加深
        - 施加更大估值折扣
      - - 集中度持续不透明
        - 公司在尽调中拒绝分享头部客户和烧钱数据
        - 无法准确测算下行
        - 维持继续研究 / 不买入立场
    notes: 这些是基于公开证据推导的投资人定义监控规则。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 最新融资条款
        - 精确的投前 / 投后估值、期权池、清算优先权、反稀释、投资人权利
        - 判断标题估值是否匹配普通股价值
        - 要求提供条款清单、股权结构表和董事会同意文件
      - - 经营指标
        - 收入运行率、毛利率、烧钱速度、现金、积压订单
        - 估值和融资风险的核心输入
        - 要求提供月度管理层 KPI 包
      - - 客户集中度
        - 头部客户收入占比、合同期限、扩张管线
        - 把具名客户证据转化为收入质量判断
        - 要求提供前 10 大客户明细表
      - - 部署证据
        - 已安装基数、留存、任务级可用率、替换成本
        - 证明平台溢价所需
        - 要求提供部署评分卡和客户访谈
      - - 供应链韧性
        - 算力 BOM、ECCN、替代方案、采购计划
        - 理解增长天花板和下行风险所需
        - 审阅供应商地图和合规备忘录
    notes: 如果管理层能可信提供这五项，建议可能明显改变。
    claimRefs:
      - CV034
      - CV036
      - CV041
      - CV042
