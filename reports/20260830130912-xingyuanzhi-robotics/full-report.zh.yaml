      - number: '5.3'
        title: 依赖、路线图与成熟度
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi 的技术机会真实存在，但它处在一个快速成熟的外部栈之中。NVIDIA 的硬件和软件文档，加上 Isaac ROS 周边可见的 GitHub
              生态，显示机器人开发者已经可以拿到定位、建图、姿态估计、仿真和人形模型开发的通用包。这并不让 Xingyuanzhi
              变得无关紧要；它划定了公司必须贡献自研价值的位置。优势必须来自跨本体集成、数据、工作流经验或部署速度，而不是重新发明每个机器人 基础组件。公开路线图支持“积极开发阶段”的解读。官方页面显示 T5 到 N5
              的可见切换；36Kr 则称新融资将用于下一代具身大脑和世界模型研发。不过，公开成熟度证明仍落后于愿景。商业部署已经存在，但 Xingyuanzhi
              尚未发布足以让外部测试其平台是否如宣传般泛化的基准、正常运行时间或 SDK 深度。
