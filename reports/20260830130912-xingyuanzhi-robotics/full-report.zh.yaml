  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化逻辑
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi 的公开财务故事，首先来自一个结构上有用的区分：它并不试图靠完整机器人本体变现。相反，保留下来的公司和媒体来源都把它描述成一家 B2B
              机器人“大脑”业务，围绕控制器硬件、具身模型软件，以及接入客户机器人本体的集成来搭建。财务上，公司处在企业硬件基础设施和机器人中间件之间，而不是纯软件或重资本 OEM
              制造。这个区分重要，因为它改变了“好”的财务表现应当长什么样。投资人应该预期看到硬件带动的部署、按场景定制的集成，以及战略客户关系，而不是自助式订阅或大众消费设备收入。公开证据仍太薄，无法精确拆分每份合同中硬件、软件和服务各占多少；但现有记录强烈暗示，变现是混合型的。如果公司能在控制器销售之上捕获持续软件附加，这种组合可能成为优势；但今天的公开披露还不足以证明这一点。
