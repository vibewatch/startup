        title: 风险排序与法律 / 监管敞口
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi 的风险画像，核心不是具身 AI
              是否有市场关注度，而是一家非常年轻的大脑层供应商，能否在自己并不完全控制的栈里完成商业化。今天最高的剩余风险集中在先进算力依赖、法律责任分配不清，以及缺少公开治理材料；这些材料本应让外部投资人核验安全、隐私和网络安全如何处理。中国政策条件支持，但政策支持不等于运营已经去风险。事实上，快速政策支持可能会在文档、测试和跨境合规成熟之前，加大商业化压力。这形成了典型前沿技术格局：可触达机会真实存在，但风险承担机制仍在搭建。尽调读者应把法律和监管问题排在清单前列，而不是放到最后，因为它们决定增长能否被融资支持。
