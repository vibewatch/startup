            body: >-
              Xingyuanzhi 的具名客户数量并不多，但战略意义不低。保留下来的公开记录指向三大细分。第一类是 AgiBot 等机器人 OEM，它们可能把 Xingyuanzhi
              的大脑层嵌入或评估进自己的本体。第二类是与仓储或装卸工作流绑定的工业自动化和搬运伙伴，最明显的是 Zhongli/EP 线索。第三类是 Beijing Yizhuang Robot
              等公共部门或生态运营方，其商业逻辑看起来与示范部署、试点密度和机器人集群活动绑定。这是一张中国优先的客户地图，扎根北京和国内机器人枢纽，而不是国际多元化。公司的公开触达可能宽于具名客户名单：36Kr
              报道其覆盖超过 70% 的头部具身智能公司。但这种宽口径生态主张，不能替代已披露账户名单、细分组合、收入集中度表或持久续约历史。
