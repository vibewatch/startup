  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Xingyuanzhi 的相关市场比“人形机器人”这个热词口径更窄，也比单一控制器 SKU 更宽。公司和媒体公开来源持续把 Xingyuanzhi
              描述为机器人“大脑”供应商：具身基础模型、世界模型软件、边缘推理，以及在不同机器人本体上运行这些系统所需的控制器硬件。这意味着公司参与的是硅片与整机 OEM
              收入之间的一层。纳入支出因此包括智能栈、边缘计算、集成和部署支持，它们让机器人能在真实工作流中可用。排除支出包括机器人本体制造、通用执行器，以及大规模场地改造项目；大脑层供应商无法直接捕获这些支出。最接近的替代品不只是其他大脑供应商，还包括固定式工业机器人、AMR、四足机器人、自建自动化团队和人力。Xingyuanzhi
              要赢，买方必须相信，外包具身智能能达到可接受的延迟、安全性和成本，同时不牺牲对成品机器人体验的控制。
