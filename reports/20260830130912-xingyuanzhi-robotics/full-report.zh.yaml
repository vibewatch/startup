              拥有真实商业信号：已出货产品、披露收入、具名交易对手，以及足以支持激进研发和扩张的融资历史。但这些信号背后，每一个投资判断关键指标都仍被隐藏。公开来源没有披露账面现金、烧钱速度、现金跑道、毛利率、支持负担、应收账款、库存，或按收入口径的客户集中度。即便来源集合中最大的前瞻性商业数字——据报道
