      - number: '1.2'
        title: 创始团队、治理与机构网络
        blocks:
          - type: paragraph
            body: >-
              领导层质量是公司公开可见资产中最强的一项。官方和第三方来源一致称，创始人兼 CEO Liu Dong 曾负责 JD.com 智能驾驶业务，这让 Xingyuanzhi
              拥有一位已经管理过自动驾驶产品、推动过商业部署，并处理过硬件与软件系统级取舍的负责人。BAAI 自己的会议议程更进一步，把 Liu Dong 同时列为公司 CEO 和具身大脑研究中心
              PI，说明这家公司仍与孵化它的机构紧密绑定。其他具名技术负责人包括联合创始人 Mu Yadong，公开资料称其为 Peking University 研究员和 Zhiyuan 学者；以及联合创始人 Sun
              Zhenguo，官方简介称其曾公开发布
              ω-EVA。更不清楚的是治理结构。已审阅来源没有披露董事会、委员会设置或战略投资人的控制权。这留下一个常见的风险投资阶段图景：创始人市场匹配度和机构背书很强，但治理透明度落后于融资速度，需要直接公司尽调才能评估到位。
