            body: >-
              从财务看，核心问题不是 Xingyuanzhi 表面上缺钱；而是公开证据还看不出，现有资本能否转化成持久、可防守的经济性。不到一年融到约 ¥1 billion
              很亮眼，但它放大预期的速度，可能快过证明可重复收入的速度。在一个拥挤、补贴充足的赛道里，专做大脑层的公司既要守住技术价值，也要守住定价权，而更简单的自动化替代方案还在持续进步。因此，收入集中度、烧钱速度、毛利率、续约等数据缺失，投资人应视为一阶风险，而不是小缺口。好消息是，缓释清单很清楚：在可行处降低算力暴露，发布更强的信任与验证材料，证明增长不只来自少数战略客户，并设置与芯片获取、客户自研替代、部署证明和安全事故挂钩的明确叫停标准。投资人还应要求证据，证明当曝光度、工程野心和融资压力同时上升时，管理层仍能把安全优先级排对。上述证据出现前，合适的剩余风险评级仍是高。
