      - number: '2.4'
        title: 政策驱动、集群效应与采用约束
        blocks:
          - type: paragraph
            body: >-
              中国政策环境对具身智能支持力度异常强，但这不是商业化免死金牌。RobotToday 对第十五个五年规划的梳理显示，具身智能被抬升到顶层产业政策位置，围绕模型开发、训练场、零部件和部署给出指令性语言。HEIS
              2026 则把术语、接口、智能计算要求、部件、系统和安全规则标准化，补足这一推力。北京 E-Town 则拿出办公空间、算力、试点活动、融资撮合和产业订单激励，提供具体的本地市场支持。这些力量让北京成为
              Xingyuanzhi 这类公司的尤其强势起步市场。与此同时，最难的壁垒仍是运营问题，而非口号问题。Deloitte
              反复强调数据质量、互操作性、网络风险和工人安全；其汽车分析还称，当下部署仍集中在重复、低变化任务上。Chinabizinsider
              也提出资本市场警告：融资和独角兽诞生速度已经跑在披露经济性前面。因此，市场机会真实存在，也由中国引领，但仍受 ROI 证明、集成复杂度和定价可见度不确定约束。
