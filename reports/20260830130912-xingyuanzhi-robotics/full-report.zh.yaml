              快速公开产品排期、多年战略订单语言，以及反复出现的生态存在感。这有用，但仍远弱于正式续约数据。先落地、再扩张的逻辑是合理的：一个 OEM
              可以增加更多本体，一个工业伙伴可以增加更多站点，一个场馆运营方可以从试点工作流扩展到更广采购。但这条路径仍是假设。有些关系也可能主要为数据收集和品类背书创造战略价值，而不是立即贡献收入，这意味着仅看
              客户名容易高估客户质量。按当前记录看，公司仍早到足以把客户证明解读为留存前阶段。
