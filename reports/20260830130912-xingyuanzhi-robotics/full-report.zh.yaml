      - number: '8.2'
        title: 市场增长与可比估值锚点
        blocks:
          - type: paragraph
            body: >-
              市场背景有利，但还不足以弥补公司层面指标缺失。多家第三方预测都指向未来十年人形机器人和物理 AI
              的显著增长，这支撑了一个判断：如果机器人大脑平台拿到横向角色，价值可能很高。但这些预测对市场规模和增长斜率分歧很大，更适合验证战略方向，而不是锁定狭窄的当下估值。公开可比公司也讲了类似故事。UBTECH、Serve
              Robotics 和 Symbotic 的估值跨度很大，因为市场奖励的是不同东西：清晰收入规模、公开证明、商业模式清晰度和部署深度。Xingyuanzhi 的平台论点有吸引力，但还没有 Symbotic
              级别的证明，也没有 UBTECH 级别的公开市场可比性。Spirit AI
              等私有同业进一步压住了溢价情景，因为同一个中国生态里已经有更强的公开部署证据。更宽泛的边界可比公司也提醒投资人，品类热度本身并不能生成可用的定价公式。
