      - number: '1.5'
        title: 要点
        blocks:
          - type: callout
            title: 只做大脑的定位具备战略差异化
            body: 多数具身 AI 初创公司试图掌握完整机器人栈，Xingyuanzhi 则有意把边缘计算和具身大脑软件卖给其他机器人制造商。如果客户接受独立智能供应商，这给了它成为横向基础设施的机会。
            calloutType: strength
            claimRefs:
              - CO005
              - CO025
              - CO030
          - type: callout
            title: BAAI 孵化叠加 JD.com 自动驾驶履历，解释了融资速度
            body: 机构支持的研究漏斗、具备自动驾驶商业化经验的创始人，以及可见的早期战略投资人，共同解释了为什么公司在披露成熟财务指标之前就能异常快速地融资。
            calloutType: insight
            claimRefs:
