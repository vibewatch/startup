      - number: '8.3'
        title: 乐观 / 基准 / 悲观区间与进入纪律
        blocks:
          - type: paragraph
            body: >-
              精确财务报表尚未公开，因此最可防守的估值方法是情景法。乐观情景假设 Xingyuanzhi 成为多个机器人 OEM
              事实上的中立大脑标准，把战略客户名单转化成可重复部署，并发布足够的可靠性和留存证据，从而拿到平台溢价。基准情景假设公司仍然重要、资金充足，但仍以中国为先、由伙伴牵引，且经济性只做到部分透明。悲观情景则假设，在硬证据到来前，伙伴自研替代、芯片摩擦或情绪降温先发生。这些情景并不假装给出精确目标；它们是有纪律的区间，用来表达价值对尚未验证里程碑的敏感度。因此，进入纪律很重要。一家公司可以具备战略重要性，但如果投资人为尚未发布的证据付钱，仍可能是一笔糟糕买入。
