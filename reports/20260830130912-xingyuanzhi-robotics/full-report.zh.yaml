      - number: '8.4'
        title: 什么会改变投资结论
        blocks:
          - type: paragraph
            body: >-
              本章估值里令人鼓舞的一点是，上调路径很直接。Xingyuanzhi
              不需要一个截然不同的市场来支撑更强估值判断；它需要更好的证据。尽调只要拿到当前收入和烧钱速度、客户集中度、与旗舰伙伴的合同结构以及最新优先股堆叠，就能立刻收窄估值区间。运营证明也一样：更明确的部署指标、少数具名客户之外更广的客户面，以及直接证据证明公司的大脑层一旦嵌入就难以替换。在此之前，投资人应设定清晰的叫停触发器。如果算力获取恶化、伙伴自研替代整套技术栈，或下一轮融资早于商业证明改善到来，下行风险会迅速上升。更强披露也可能提高价格和条款谈判力，而这与公司叙事本身同样重要。换句话说，这家公司值得贴近跟踪，但不适合粗糙定价。
