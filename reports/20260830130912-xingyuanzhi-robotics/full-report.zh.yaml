            title: 可触达市场小于人形机器人热潮标题
            body: Xingyuanzhi 不卖完整人形机器人，所以宽口径 2035 年人形机器人 TAM 图表夸大了近期收入池。更好的镜头，是愿意购买外部具身大脑栈的 OEM 和运营方切片。
