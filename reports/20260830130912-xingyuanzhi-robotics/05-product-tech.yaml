  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: Task-level benchmark data for latency, success rate, uptime, and failure modes on Xingyuanzhi products.
    whyItMatters: >-
      Without comparable technical metrics, the product story remains architectural and anecdotal rather than engineering-grade.
    diligencePath: Request benchmark dossiers or run controlled tests on the same robot body across at least two target workflows.
    relatedQuestionRefs:
    - QE013
    - QE022
    - QE025
  - type: missing-source
    severity: material
    topic: api-docs
    missingEvidence: Public or investor-shareable SDK, API, and deployment documentation for third-party integrators.
    whyItMatters: >-
      A real platform should be easier to integrate than an in-house stack; without docs or SDK evidence that claim is hard to verify.
    diligencePath: Request partner-facing technical docs, SDKs, and onboarding materials.
    relatedQuestionRefs:
    - QE019
    - QE024
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Safety case, cybersecurity architecture, certifications, incident history, or formal quality metrics.
    whyItMatters: >-
      Embodied-intelligence products can create physical-world failures; trust readiness is central to enterprise and government adoption.
    diligencePath: Request safety, security, and quality-control artifacts used in pilots and customer deployments.
    relatedQuestionRefs:
    - QE017
    - QE023
    - QE024
  - type: missing-source
    severity: minor
    topic: ip
    missingEvidence: A clean, company-specific public patent set or other hard IP inventory.
    whyItMatters: >-
      IP is part of the differentiation story, but the retained public search did not produce evidence strong enough for underwriting.
