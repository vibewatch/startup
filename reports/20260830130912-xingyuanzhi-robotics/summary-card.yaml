  topStrengths:
    - >-
      Distinct brain-layer positioning gives Xingyuanzhi a plausible horizontal-platform upside if it becomes embedded
      across multiple robot OEMs.
    - >-
      BAAI incubation and fast early fundraising provide technical credibility, talent signaling, and strategic
      momentum.
