- id: cost-structure-and-capital-needs
  title: Cost Structure, Working Capital, and Capital Needs
  body: >-
    Xingyuanzhi’s cost structure is probably lighter than that of a full humanoid OEM, but it is not software-light. Lavx reports that roughly 90% of a 50-person team is in R&D, indicating an organization built primarily for technical iteration rather than scaled field selling. Public product pages show controller-platform evolution from T5 to surfaces emphasizing N5 and Jetson Thor, which implies ongoing hardware refresh and platform-porting expense. Because the business runs on NVIDIA-class edge compute and software stacks, it likely bears supplier dependence, inventory planning, integration cost, and support obligations that do not show up in a pure foundation-model company. Service-delivery costs also matter more than a casual AI narrative suggests. Real embodied deployments often require site integration, tuning, validation, and operator support. All of that means gross margin could eventually outperform a full robot OEM while still falling well short of a clean software model. The
    current disclosure record does not reveal where on that spectrum Xingyuanzhi actually sits.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
