- calloutType: strength
  title: Avoiding full robot-body manufacturing should improve the eventual margin ceiling
  body: >-
    If Xingyuanzhi truly remains the external brain layer, it should avoid some of the heaviest manufacturing burden facing full humanoid OEMs. The upside only matters, however, if controller, software, and services economics are eventually disclosed and attractive.
