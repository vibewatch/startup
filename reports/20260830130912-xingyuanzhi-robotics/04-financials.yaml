- calloutType: risk
  title: Funding visibility outruns cash visibility
  body: >-
    RMB1 billion raised is impressive, but it does not answer the only questions that matter for underwriting: how much cash remains, how fast it burns, and whether each new deployment improves or worsens cash generation.
  claimRefs:
