  topStrengths:
    - 明确押注大脑层，让 Xingyuanzhi 有机会成为横向平台；只要嵌入多个机器人 OEM，上行空间就能打开。
    - BAAI 孵化加上早期快速融资，给公司带来技术背书、人才信号和战略势能。
    - 公开点名的 AgiBot、Beijing Yizhuang Robot 以及 Zhongli-EP 相关工作流，说明公司接入了真实机器人生态，而不只是实验室 demo。
    - 中国 2026 年具身 AI 政策和融资环境，继续托住需求培育和商业化试验。
  topRisks:
    - 收入、毛利率、烧钱速度和股权结构条款均未披露，投资判断信心受限。
    - 依赖 NVIDIA 级算力和合作伙伴机器人本体，带来供应链和伙伴内化风险。
    - 客户证明有战略价值，但仍然集中、间接，缺少留存和合同经济性证据。
    - 如果部署证明滞后，或具身 AI 情绪降温，独角兽区间定价可能很快被压缩。
    - 安全、隐私和信任文档明显比公司叙事薄。
