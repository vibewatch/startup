    - Top-customer concentration, contract terms, and renewal behavior for AgiBot, Yizhuang, Zhongli-EP, and any additional major accounts.
    - Deployment KPI proof such as installed-base count, uptime, attach rate, and switching-cost evidence.
    - Compute BOM, ECCN classification, and substitution planning for controlled components.
