companyProfile:
  summary: Xingyuanzhi Robotics is a Beijing-based embodied-intelligence startup incubated by the Beijing Academy of Artificial Intelligence and focused on supplying the robot-brain layer rather than finished robot bodies. Its public product story centers on the T5 lineage and newer edge-compute platforms, multimodal spatial intelligence, and a general embodied-brain stack intended to work across humanoid and industrial robot embodiments. Publicly visible counterparties such as AgiBot, Beijing Yizhuang Robot, and Zhongli/EP-linked workflows make the company strategically relevant, but its commercial quality remains harder to verify than its narrative strength.
  foundedDate: '2025-08-01'
  founders: []
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: T5 and successor embodied-brain compute platforms combine edge compute, embodied models, and multimodal spatial intelligence to power humanoid and industrial robotics use cases.
  customerFocus: Humanoid robot OEMs, industrial automation partners, and public-sector or ecosystem operators concentrated in China, especially Beijing-linked robotics clusters.
  businessModel: B2B brain-layer platform monetized through controller hardware, embodied-model/software attach, integration work, and deployment support rather than finished robot-body sales.
  stage: Series A / Pre-A completed
  fundingStatus: By June 2026, company and media sources described roughly RMB1 billion of cumulative funding across angel, angel+, and Pre-A rounds, placing Xingyuanzhi in the unicorn band but without full term-sheet disclosure.
