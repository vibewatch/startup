  topStrengths:
    - Distinct brain-layer positioning gives Xingyuanzhi a plausible horizontal-platform upside if it becomes embedded across multiple robot OEMs.
    - BAAI incubation and fast early fundraising provide technical credibility, talent signaling, and strategic momentum.
    - Publicly named relationships with AgiBot, Beijing Yizhuang Robot, and Zhongli-EP-linked workflows show the company is attached to real robotics ecosystems rather than pure lab demos.
    - China's 2026 embodied-AI policy and funding environment supports continued demand creation and commercialization experiments.
  topRisks:
    - Revenue, gross margin, burn, and cap-table terms remain undisclosed, limiting underwriting confidence.
    - Dependence on NVIDIA-class compute and partner robot embodiments creates supply-chain and internalization risk.
    - Customer proof is strategically meaningful but still concentrated, indirect, and short on retention or contract-economics evidence.
    - Unicorn-band pricing can compress quickly if deployment proof lags or broader embodied-AI sentiment cools.
    - Safety, privacy, and trust documentation remain materially thinner than the company narrative.
  unresolvedGaps:
    - Exact latest post-money valuation, liquidation preferences, anti-dilution terms, and investor-rights stack.
