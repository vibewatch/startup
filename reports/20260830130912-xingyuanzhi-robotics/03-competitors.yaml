- id: pricing-distribution-and-switching
  title: Pricing, Distribution Power, and Switching Friction
  body: >-
    Public pricing transparency is weak across the embodied-AI field, and that is itself strategically relevant. Few retained competitor sources expose sticker prices, contract structure, or maintenance terms, which suggests the market still operates through strategic partnerships, pilots, and negotiated enterprise selling rather than SKU-level comparison. The best public contrast comes from adjacent warehouse automation vendors such as EP, which publish rental and purchase prices, promise one-week delivery or one-day implementation, and even claim sub-one-year ROI. That kind of clarity creates pressure on any embodied-intelligence vendor serving similar logistics jobs. Switching friction for Xingyuanzhi, then, will not come from price opacity alone. It must come from installed workflows, edge integration, model tuning, safety validation, and the effort required for customers to replace the brain stack once it is embedded. Multi-homing also remains a serious risk because buyers can combine
    external suppliers, NVIDIA primitives, and internal engineering rather than standardizing on one vendor forever.
  claimRefs:
  - CP010
  - CP011
  - CP012
  - CP017
