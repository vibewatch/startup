  - - Supplier-layer brand leverage
    - Finished robot OEMs own end-customer mindshare
    - medium
    - Xingyuanzhi is a hidden layer while hardware brands remain visible
    - Request installed-base, attach-rate, and replacement-cost data
  notes: >-
