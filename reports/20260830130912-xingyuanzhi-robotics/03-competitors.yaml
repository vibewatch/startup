- id: moat-durability-and-adverse-evidence
  title: Moat Durability and Adverse Competitive Evidence
  body: >-
    The strongest adverse evidence against a durable Xingyuanzhi moat is not that the market lacks demand, but that too many capital-backed companies are attacking adjacent layers of the same stack. EmbodiedGlobal and China Biz Insider both describe a 2026 field crowded with unicorns, large financings, and thin proof of repeatable commercialization. That environment lets rivals subsidize hiring, pilots, and customer support while hiding weak unit economics. It also increases the odds that robot OEMs decide the most strategic layer—the brain—should stay in-house. NVIDIA contributes another source of moat pressure by making more of the robotics stack available as reusable primitives, which lowers the cost of internal build and new entry. Xingyuanzhi can still win if it becomes the neutral standard embedded across multiple OEMs, but public evidence does not yet show exclusive customer lock-in, benchmark leadership, or pricing power. On the current record, the company has a differentiated position,
    not a proven moat.
