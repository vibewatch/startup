    - Home and industrial robots
    - World-model positioning and early home trials
    - Home orientation is less aligned with Xingyuanzhi’s near-term industrial wedge
  - - Astribot
    - Adjacent full-stack OEM
    - Investor-backed Shenzhen startup
    - Household and light commercial manipulation
    - DFAI architecture and very fast dual-arm manipulation
    - More hardware-forward and less comparable to brain-only supplier model
  - - AgiBot
    - Customer / adjacent competitor
    - High-profile humanoid OEM
    - Humanoid robot platforms
    - Validates demand and potential distribution partner
    - May internalize core intelligence over time
  - - NVIDIA Isaac / Jetson
    - Incumbent platform
    - Global developer ecosystem and silicon scale
    - AMRs, arms, humanoids, robot developers
    - Reusable simulation, AI, ROS, and edge-compute primitives
    - Enables internal build and commoditizes generic stack layers
  - - EP Automation / XP15
    - Status-quo substitute
    - Commercial product with public pricing
    - Warehouse transport and loading workflows
    - Simple deployment, public pricing, clear ROI messaging
    - Lower flexibility than embodied-brain stack in broader tasks
