    - Request partner contracts and renewal / exclusivity terms
  - - Brain-layer technical edge
    - Open research peers compress differentiation
    - high
    - X Square and NVIDIA expose reusable models, tools, or research pathways publicly
    - Request benchmark bake-offs and roadmap evidence
  - - China ecosystem advantage
    - Every domestic rival benefits from the same policy tailwinds
    - medium
