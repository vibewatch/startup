callouts:
- calloutType: strength
  title: Supplier neutrality is a real strategic differentiator
  body: >-
    Most serious Chinese embodied-AI rivals retained here combine cognition with at least one owned robot embodiment or data-acquisition loop. Xingyuanzhi’s willingness to remain the external brain layer is unusual and could widen distribution if partners accept it.
  claimRefs:
  - CP001
  - CP014
  - CP032
  - CP037
- calloutType: risk
  title: Partner-customers can become direct displacers
  body: >-
    The same OEMs that validate Xingyuanzhi’s market are also the buyers most motivated to own robot intelligence themselves. Without exclusivity, benchmark advantage, or replacement-cost proof, the customer list is not automatically a moat.
  claimRefs:
  - CP003
  - CP016
  - CP035
  - CP036
- calloutType: insight
  title: Simpler automation can be the real competitive baseline
  body: >-
    For warehouse and repetitive industrial tasks, buyers may compare Xingyuanzhi less against another AI startup and more against cheaper AMRs or quadrupeds that already publish pricing, deployment speed, and ROI.
  claimRefs:
  - CP012
  - CP018
  - CP030
