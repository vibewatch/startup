- id: what-changes-the-call
  title: What Would Change the Call
  body: >-
    The encouraging part of this valuation chapter is that the upgrade path is straightforward. Xingyuanzhi does not need a radically different market to justify a stronger valuation view; it needs better evidence. A diligence process that surfaces current revenue and burn, customer concentration, contract structure with flagship partners, and the latest preference stack would immediately narrow the valuation range. The same is true for operational proof: more explicit deployment metrics, broader customer breadth outside a few named logos, and direct evidence that the company’s brain layer is hard to replace once embedded. Until that happens, investors should define clear kill triggers. If compute access worsens, a partner internalizes the stack, or the next round arrives before commercial proof improves, downside risk rises quickly. Stronger disclosure could also improve negotiating leverage on price and terms, which matters as much as the company narrative itself. In other words, this
    is a company to keep close, but not one to price lazily.
