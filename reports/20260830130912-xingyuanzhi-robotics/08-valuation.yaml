- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Advanced-compute access shock
    - No qualified substitute for critical compute within one quarter
    - Delivery roadmap and customer trust weaken simultaneously
    - Pause underwriting and reassess downside immediately
  - - Partner internalization
    - Flagship OEM replaces Xingyuanzhi layer on major workflow
    - Platform-standard thesis breaks
    - Move toward avoid unless valuation resets
  - - Proof lag into next round
    - No meaningful deployment KPI, revenue proof, or customer-breadth update before next financing event
    - Narrative outruns evidence; down-round risk rises
    - Assume structured terms or lower common-equity value
  - - Safety or compliance incident
    - Material field incident, enforcement action, or data-governance controversy
    - Trust discount and customer hesitation increase
    - Apply steeper valuation haircut
  - - Opaque concentration persists
    - Company refuses to share top-customer and burn data in diligence
    - No way to underwrite downside accurately
    - Maintain research-more / no-buy posture
  notes: These are investor-defined monitoring rules derived from the public evidence base.
