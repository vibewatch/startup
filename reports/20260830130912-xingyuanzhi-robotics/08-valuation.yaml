- calloutType: recommendation
  title: 'Research-more: compelling thesis, incomplete pricing evidence'
  body: >-
    Xingyuanzhi is worth following closely because the strategic category and product stance are real. The blocking issue is not whether embodied AI matters; it is whether enough hard economic and contractual evidence exists to justify paying for it now.
