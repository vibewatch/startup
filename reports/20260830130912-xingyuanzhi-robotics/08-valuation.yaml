- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Latest financing terms
    - Exact pre/post-money, option pool, liquidation preference, anti-dilution, investor rights
    - Determines whether headline value matches common-equity value
    - Request term sheet, cap table, and board consents
  - - Operating metrics
    - Revenue run rate, gross margin, burn, cash, backlog
    - Core inputs for valuation and financing risk
    - Request monthly management KPI pack
  - - Customer concentration
    - Top-account revenue share, contract term, expansion pipeline
    - Converts logo proof into revenue quality
    - Request top-10 customer schedule
  - - Deployment proof
    - Installed-base count, retention, task-level uptime, replacement cost
    - Needed to justify platform premium
    - Request deployment scorecard and reference calls
  - - Supply-chain resilience
    - Compute BOM, ECCN, substitutions, sourcing plan
    - Needed to understand ceiling on growth and downside risk
    - Review supplier map and compliance memo
  notes: If management provides these five items credibly, the recommendation could move materially.
