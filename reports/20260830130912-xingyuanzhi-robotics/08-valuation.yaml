  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: exact post-money valuation
    missingEvidence: Signed term sheet or cap-table evidence showing exact latest pre-money, post-money, and share count.
    whyItMatters: Without exact pricing, any point estimate risks false precision even if unicorn-band status is directionally supported.
    diligencePath: Request latest financing deck, board consent, and cap table.
    relatedQuestionRefs:
    - QV003
  - type: private-evidence-only
    severity: high
    topic: financial statements and operating metrics
    missingEvidence: Current revenue run rate, gross margin, burn, cash balance, and booked backlog by customer.
    whyItMatters: These are the core inputs needed to decide whether current valuation is stretched or justified.
    diligencePath: Obtain monthly management accounts and trailing-twelve-month KPI pack.
    relatedQuestionRefs:
    - QV004
    - QV029
  - type: private-evidence-only
    severity: high
    topic: preferences and dilution overhang
    missingEvidence: >-
      Liquidation preference terms, participating features, pro-rata rights, anti-dilution clauses, and employee option pool size.
    whyItMatters: Headline valuation can materially overstate common-equity value if downside protection is heavy.
    diligencePath: Review financing documents and full capitalization table.
    relatedQuestionRefs:
    - QV018
  - type: missing-source
    severity: medium
    topic: near-term exit timetable
    missingEvidence: Board-approved exit plan, audited financial readiness, banker engagement, or strategic acquirer inbound evidence.
    whyItMatters: Exit optionality cannot be priced confidently from sector hype alone.
    diligencePath: Request strategic plan, fundraising timeline, and exit-readiness workstreams.
    relatedQuestionRefs:
    - QV027
  - type: missing-source
    severity: material
    topic: Comparable valuation table coverage
    missingEvidence: More directly comparable disclosed private rounds for robot-brain software suppliers and embodied-AI controller vendors.
    whyItMatters: Public comps are useful but imperfect because most mix hardware, services, or far greater scale.
    diligencePath: Expand private comp set with disclosed post-money data and normalized round terms.
    relatedQuestionRefs:
    - QV012
    - QV022
    relatedTableRefs:
    - TV004
