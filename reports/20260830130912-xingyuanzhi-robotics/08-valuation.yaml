chapter:
  number: 8
  title: Valuation
  summary: >-
    Xingyuanzhi likely belongs in the unicorn valuation band by mid-2026, but the public record still lacks the economic and term-sheet evidence needed for a confident buy call. The most defensible stance is research-more with medium confidence, high risk, and a stretched valuation view unless diligence reveals materially stronger revenue, retention, and downside-protection data.
sections:
- id: valuation-context-and-recommendation
  title: Financing Context, Evidence Quality, and Current Recommendation
  body: >-
    Xingyuanzhi is easy to find intellectually attractive and hard to price precisely. The retained evidence supports a strong strategic narrative: the company is China-based, BAAI-incubated, focused on the robot-brain layer rather than hardware bodies, and has raised roughly ¥1 billion in under a year. That combination is enough to justify serious investor attention and to treat the company as operating in the unicorn band by mid-2026. It is not enough, however, to justify a buy call at an exact price. Public evidence still does not provide the revenue, margin, cash-burn, backlog, or cap-table detail that would let a diligence team convert narrative strength into a conventional underwriting model. The correct recommendation therefore has to be evidence-sensitive. On today’s record, the company belongs in research-more: worth tracking closely and potentially compelling, but not yet supported well enough for an affirmative price-insensitive investment decision.
