evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Round-by-round post-money valuations, ownership percentages, and any secondary sales or debt facilities.
    whyItMatters: >-
      Fast fundraising alone does not reveal dilution, liquidation stack, or whether unicorn status came from priced
      equity versus internal marks.
    diligencePath: >-
      Request the cap table, signed term sheets, and any investor-update deck covering the angel, angel+, and Pre-A
      rounds.
    relatedQuestionRefs:
      - QO011
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount-gap
    missingEvidence: >-
      An official current employee count or range from the company, hiring portal, or a reputable third-party data
      provider.
    whyItMatters: >-
      Headcount is a core scaling metric for early-stage AI infrastructure companies and affects burn, execution
      capacity, and investor expectations.
    diligencePath: >-
      Request an HR-confirmed org count or obtain a dated hiring dashboard export from the company or its lead
      investors.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: minor
    topic: product-milestone
    missingEvidence: >-
      A dated primary source clarifying whether the first T5 milestone was August 2025 or whether October-November 2025
      was the first commercial deployment.
    whyItMatters: >-
      The distinction matters less for investment judgment than for timeline accuracy, but it affects how quickly the
      product moved from lab work to external deployment.
    diligencePath: >-
      Ask the company for the launch press release or first customer shipment memo that established the T5 milestone
      chronology.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting control, founder vesting terms, and committee structure.
    whyItMatters: >-
      Without governance visibility it is hard to assess investor control, key-person concentration, and how strategic
      partners influence commercialization choices.
    diligencePath: Request the board observer list, charter documents, and any side letters granted to strategic investors.
    relatedQuestionRefs:
      - QO008
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Recognized revenue, gross margin, backlog conversion, and cash-burn data tied to actual customer contracts.
    whyItMatters: >-
      The public narrative centers on large fundraising and ecosystem wins, but investability depends on proving that
      pilots convert into repeatable gross-profit dollars.
    diligencePath: >-
      Request monthly management accounts, booked-versus-recognized revenue detail, and contract schedules for AgiBot,
      Yizhuang, Zhongli, and any energy customers.
    relatedQuestionRefs:
      - QO016
      - QO024
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: A standalone analyst estimate for the embodied-brain or robot-intelligence middleware market in China.
    whyItMatters: >-
      Most published TAMs measure whole humanoid hardware or broad automation rather than the thinner software plus
      controller layer that Xingyuanzhi actually sells.
    diligencePath: >-
      Request bottom-up market segmentation from investors or analysts that split robot-body, component, and brain-layer
      revenue pools.
    relatedQuestionRefs:
      - QM011
      - QM024
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      A price book, licensing schedule, or dated customer contract that shows controller ASP, software attach,
      maintenance, and integration fees.
    whyItMatters: >-
      Without pricing disclosure it is impossible to bridge broad market demand into Xingyuanzhi-specific revenue
      potential or to test whether the brain-only thesis carries attractive gross margins.
    diligencePath: >-
      Request signed commercial proposals or at least a dated product pricing sheet from the company or a reference
      customer.
    relatedQuestionRefs:
      - QM025
      - QM024
  - type: missing-source
    severity: material
    topic: roi-proof
    missingEvidence: Independent workflow-level ROI benchmarks for deployment in logistics, inspection, or manufacturing.
    whyItMatters: >-
      The market story is strong on funding and policy, but weak on proven cost savings, uptime, and payback for actual
      buyer workflows.
    diligencePath: >-
      Obtain case studies with baseline labor, cycle-time, uptime, and payback data from Yizhuang, AgiBot, Zhongli, or
      energy deployments.
    relatedQuestionRefs:
      - QM020
      - QM024
  - type: missing-source
    severity: minor
    topic: export-compliance
    missingEvidence: >-
      A public document explaining how Chinese-origin embodied-brain vendors plan to address non-China safety and
      cybersecurity procurement requirements.
    whyItMatters: >-
      If the company eventually wants non-China growth, market size and win rate will depend on how much Western
      procurement or compliance friction limits adoption.
    diligencePath: Request export compliance, cyber architecture, and safety-certification roadmaps from management.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: List pricing, realized ASP, and contract terms for Xingyuanzhi, Spirit AI, X Square, and GigaAI.
    whyItMatters: >-
      Without pricing comparability it is impossible to know whether Xingyuanzhi wins because of economics, performance,
      bundling, or relationship-driven pilots.
    diligencePath: >-
      Request dated proposals or signed customer contracts from Xingyuanzhi and at least two competitors or channel
      partners.
    relatedQuestionRefs:
      - QP014
      - QP024
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      Independent side-by-side benchmarks across task success, latency, reliability, and deployment effort for
      Xingyuanzhi versus Spirit AI, X Square, and in-house NVIDIA-based stacks.
    whyItMatters: >-
      The competitive story currently rests on positioning and anecdotal deployment proof rather than standardized
      technical or commercial comparison.
    diligencePath: Run a controlled bake-off in a warehouse or inspection workflow using the same robot body and acceptance criteria.
    relatedQuestionRefs:
      - QP006
      - QP023
      - QP024
  - type: private-evidence-only
    severity: material
    topic: exclusivity
    missingEvidence: >-
      Partner contracts showing whether AgiBot, Yizhuang, or EP commitments are exclusive, recurring, expandable, or
      easily replaceable.
    whyItMatters: >-
      Customer-partner ambiguity is a central competitive risk because the same OEMs may internalize the brain layer
      once pilots end.
    diligencePath: >-
      Review MSA, JDA, or strategic cooperation agreements including exclusivity, renewal, support obligations, and
      termination terms.
    relatedQuestionRefs:
      - QP016
      - QP020
  - type: missing-source
    severity: minor
    topic: trust
    missingEvidence: Public security, safety, or compliance materials for most direct peers.
    whyItMatters: >-
      Enterprise trust posture may become a major buying criterion before public marketing pages catch up, especially in
      industrial or government settings.
    diligencePath: >-
      Request security architecture, safety case, certifications, and incident histories from management and key
      competitors where available.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: cash-burn
    missingEvidence: Cash balance, monthly burn, and board-level runway analysis.
    whyItMatters: >-
      Without cash or burn visibility, investors cannot test whether the latest round funds commercialization long
      enough to reach self-sustaining revenue milestones.
    diligencePath: >-
      Request current balance sheet, monthly cash-flow statement, and a management runway bridge by hiring, inventory,
      and deployment scenario.
    relatedQuestionRefs:
      - QI017
      - QI018
      - QI021
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Dated pricing sheets, realized ASP by SKU, software attach rate, gross margin by product line, and standard
      support terms.
    whyItMatters: >-
      The revenue model cannot be underwritten if controller hardware, software, and integration economics remain
      blended and undisclosed.
    diligencePath: Request proposals, order forms, and invoice-level mix for at least the top ten customer deployments.
    relatedQuestionRefs:
      - QI006
      - QI013
      - QI025
  - type: missing-source
    severity: material
    topic: contract-quality
    missingEvidence: >-
      Primary contract documents for the reported RMB500 million-plus three-year strategic opportunity and clarity on
      the actual counterparty.
    whyItMatters: >-
      Projected order value is only useful if the contract is binding, the counterparty is clear, and the pricing,
      volume, and cancellation terms are known.
    diligencePath: >-
      Review the executed contract or board-approved order schedule and reconcile the EP-versus-Yizhuang source
      conflict.
    relatedQuestionRefs:
      - QI020
      - QI023
      - QI024
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Customer acquisition cost, implementation cost, warranty burden, collections profile, and breakeven shipment
      volume.
    whyItMatters: Topline shipment headlines do not answer whether each deployment creates or destroys cash.
    diligencePath: Request cohort-level economics for at least three completed deployments and one scaled customer.
    relatedQuestionRefs:
      - QI011
      - QI016
      - QI025
  - type: missing-source
    severity: material
    topic: benchmarks
    missingEvidence: Task-level benchmark data for latency, success rate, uptime, and failure modes on Xingyuanzhi products.
    whyItMatters: >-
      Without comparable technical metrics, the product story remains architectural and anecdotal rather than
      engineering-grade.
    diligencePath: Request benchmark dossiers or run controlled tests on the same robot body across at least two target workflows.
    relatedQuestionRefs:
      - QE013
      - QE022
      - QE025
  - type: missing-source
    severity: material
    topic: api-docs
    missingEvidence: Public or investor-shareable SDK, API, and deployment documentation for third-party integrators.
    whyItMatters: >-
      A real platform should be easier to integrate than an in-house stack; without docs or SDK evidence that claim is
      hard to verify.
    diligencePath: Request partner-facing technical docs, SDKs, and onboarding materials.
    relatedQuestionRefs:
      - QE019
      - QE024
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Safety case, cybersecurity architecture, certifications, incident history, or formal quality metrics.
    whyItMatters: >-
