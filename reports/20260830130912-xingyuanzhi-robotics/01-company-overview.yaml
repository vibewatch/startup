- id: capital-base-and-investor-structure
  title: Capital Base and Investor Structure
  body: >-
    The financing narrative is the clearest reason Xingyuanzhi has become a watched name in China’s 2026 embodied-AI wave. Public materials point to a RMB200 million angel round in September 2025, an angel+ round of more than RMB100 million in December 2025, and a Pre-A announcement on 2026-06-03. Across company pages, 36Kr, Pandaily, and other summaries, the same headline repeats: roughly RMB1 billion raised within the first ten months after incorporation. The investor roster matters almost as much as the total. The angel round mixed venture capital with strategic backers such as AgiBot and Zhongli, while the Pre-A assembled financial investors, state-linked funds, and industrial capital including Beijing Industrial Investment and CRRC Capital. 36Kr and the official company profile also say Yuansheng followed through three rounds, suggesting at least one conviction investor willing to keep underwriting execution. The caution is that fundraising speed outruns disclosure quality. Public sources
    identify investor names and high-level use of proceeds, but they do not disclose round-by-round post-money valuations, cap-table ownership, liquidation preferences, debt, or secondaries. Investors are clearly paying for strategic optionality, but the exact pricing architecture remains private.
  claimRefs:
  - CO012
  - CO013
  - CO014
  - CO015
