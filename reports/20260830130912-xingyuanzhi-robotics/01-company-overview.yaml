callouts:
- calloutType: strength
  title: The brain-only position is strategically differentiated
  body: >-
    Unlike most embodied-AI startups that try to own the full robot stack, Xingyuanzhi is deliberately selling edge compute and embodied-brain software into other robot makers. That gives it a chance to become horizontal infrastructure if customers accept an independent intelligence vendor.
  claimRefs:
  - CO005
  - CO025
  - CO030
- calloutType: insight
  title: BAAI incubation plus JD autonomy pedigree explains the funding velocity
  body: >-
    The combination of an institute-backed research funnel, a founder with commercialization experience in autonomy, and visible early strategic investors helps explain why the company raised unusually quickly even before disclosing mature financial metrics.
  claimRefs:
  - CO002
  - CO007
  - CO015
  - CO018
- calloutType: risk
  title: Disclosure quality lags the fundraising narrative
  body: >-
    The company is unusually open about milestones and partner names for its age, but still does not publicly disclose priced-round valuations, official headcount, the board, or normalized financial KPIs such as recognized revenue and burn.
  claimRefs:
  - CO011
  - CO043
