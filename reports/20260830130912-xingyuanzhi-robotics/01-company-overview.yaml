company:
  name: Xingyuanzhi Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Xingyuanzhi Robotics is a Beijing-based, BAAI-incubated embodied-intelligence startup that has raised roughly RMB1 billion in its first ten months by positioning itself as the “brain” vendor for other robot makers. Public evidence supports the founding date, incubation lineage, founder pedigree, and early customer narrative, but still leaves material gaps on valuation, governance, official headcount, and normalized financial quality.
sections:
- id: identity-positioning-and-footprint
  title: Identity, Positioning, and Footprint
  body: >-
    Xingyuanzhi’s public identity is unusually crisp for such a young robotics company. Across its Chinese homepage, English homepage, and longer company profile, it describes itself as a Beijing-based embodied-intelligence company founded on 2025-08-01 and incubated by the Beijing Academy of Artificial Intelligence. The core pitch is not to build complete robots, but to supply the “brain” layer: multimodal spatial intelligence, an embodied foundation model stack, and edge compute that can be embedded into different robot bodies. That positioning matters because it makes Xingyuanzhi a brain-first platform vendor rather than a capital-intensive full-stack hardware OEM. Public address evidence points to a Haidian contact office and a Yizhuang-linked registered entity, which is consistent with a company straddling Beijing’s research and industrial clusters. Official pages also show rapid product iteration: the original T5 controller anchored the 2025 launch story, while current product pages
    foreground newer N5 and BotPack-style edge platforms. The result is a company that already looks more like an enabling middleware and compute supplier than a single-product startup, even though many of its operating metrics remain thinly disclosed.
