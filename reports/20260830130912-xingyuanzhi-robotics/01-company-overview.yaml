- id: founders-governance-and-institutional-network
  title: Founders, Governance, and Institutional Network
  body: >-
    Leadership quality is one of the company’s strongest publicly visible assets. Official and third-party sources agree that founder and CEO Liu Dong previously ran JD.com’s intelligent-driving organization, giving Xingyuanzhi a leader who has already managed autonomy products, deployed them commercially, and worked through systems-level tradeoffs between hardware and software. BAAI’s own conference program goes further by presenting Liu Dong as both company CEO and PI of its embodied-brain research center, showing that the venture is still tightly coupled to the institute that incubated it. Additional named technical leadership includes co-founder Mu Yadong, described publicly as a Peking University researcher and Zhiyuan scholar, and co-founder Sun Zhenguo, whom the official profile credits with publicly releasing ω-EVA. What is less visible is governance. None of the reviewed sources disclose the board, committee structure, or strategic-investor control rights. That leaves a familiar
    venture-stage pattern: strong founder-market fit and institutional prestige, but governance transparency that trails the speed of capital formation and would need direct company diligence to assess properly.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
