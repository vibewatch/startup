- id: milestones-customers-and-disclosure-risk
  title: Milestones, Customers, and Disclosure Risk
  body: >-
    The milestone arc is unusually dense for a company barely a year old. Official pages connect 2025 to the launch of T5 and its early tie-in to AgiBot’s Genie G2, then connect 2026 to the release of ω-EVA, the BAAI-linked world-model laboratory, Hannover Messe, a Fortune China Tech 50 selection, and the global commercial rollout of a loading-and-unloading solution with Zhongli or EP Equipment. The customer picture is also stronger than many early embodied-AI startups can show: public materials name AgiBot and Beijing Yizhuang Robot directly, attach a three-year order target of at least RMB500 million to the Yizhuang relationship, and describe deployments spanning government service, inspection, navigation, and logistics. Still, the same sources expose the report’s biggest diligence constraint. Public traction data is thin and mixed in quality. Low-reputation summaries cite hundreds of T5 shipments, over RMB10 million of revenue, and about fifty employees, but mainstream and official materials
    stop short of giving recognized revenue, backlog conversion, margin, or verified headcount. In a 2026 sector where capital is abundant but commercial proof is scarce, that disclosure gap is material, not cosmetic.
