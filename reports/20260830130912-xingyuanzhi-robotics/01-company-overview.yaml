  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Round-by-round post-money valuations, ownership percentages, and any secondary sales or debt facilities.
    whyItMatters: >-
      Fast fundraising alone does not reveal dilution, liquidation stack, or whether unicorn status came from priced equity versus internal marks.
    diligencePath: Request the cap table, signed term sheets, and any investor-update deck covering the angel, angel+, and Pre-A rounds.
    relatedQuestionRefs:
    - QO011
    - QO024
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: headcount-gap
    missingEvidence: An official current employee count or range from the company, hiring portal, or a reputable third-party data provider.
    whyItMatters: >-
      Headcount is a core scaling metric for early-stage AI infrastructure companies and affects burn, execution capacity, and investor expectations.
    diligencePath: Request an HR-confirmed org count or obtain a dated hiring dashboard export from the company or its lead investors.
    relatedQuestionRefs:
    - QO025
  - type: conflicting-data
    severity: minor
    topic: product-milestone
    missingEvidence: >-
      A dated primary source clarifying whether the first T5 milestone was August 2025 or whether October-November 2025 was the first commercial deployment.
    whyItMatters: >-
      The distinction matters less for investment judgment than for timeline accuracy, but it affects how quickly the product moved from lab work to external deployment.
    diligencePath: >-
      Ask the company for the launch press release or first customer shipment memo that established the T5 milestone chronology.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting control, founder vesting terms, and committee structure.
    whyItMatters: >-
      Without governance visibility it is hard to assess investor control, key-person concentration, and how strategic partners influence commercialization choices.
    diligencePath: Request the board observer list, charter documents, and any side letters granted to strategic investors.
    relatedQuestionRefs:
    - QO008
    - QO024
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: Recognized revenue, gross margin, backlog conversion, and cash-burn data tied to actual customer contracts.
    whyItMatters: >-
      The public narrative centers on large fundraising and ecosystem wins, but investability depends on proving that pilots convert into repeatable gross-profit dollars.
    diligencePath: >-
      Request monthly management accounts, booked-versus-recognized revenue detail, and contract schedules for AgiBot, Yizhuang, Zhongli, and any energy customers.
    relatedQuestionRefs:
    - QO016
    - QO024
