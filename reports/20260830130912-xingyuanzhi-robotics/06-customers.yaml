  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer-level renewal, GRR, NRR, churn, and cohort data.
    whyItMatters: Without renewal evidence, a strategic partner list cannot be translated into durable revenue quality.
    diligencePath: Request customer cohorts, renewal history, and expansion revenue by top account.
    relatedQuestionRefs:
    - QU016
    - QU017
    - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer revenue share, site count, and contract duration for AgiBot, Yizhuang, EP/Zhongli, and other major accounts.
    whyItMatters: >-
      A small number of strategic logos can create a compelling narrative while still leaving the company vulnerable to one-account shocks.
    diligencePath: Request top-10 customer concentration data and contract maturity schedules.
    relatedQuestionRefs:
    - QU018
    - QU022
  - type: missing-source
    severity: material
    topic: production-vs-pilot
    missingEvidence: >-
      A reconciled list showing which named accounts are pilots, production deployments, paid contracts, or only ecosystem partners.
    whyItMatters: Public materials blur pilots, partnerships, and production in ways that can overstate real customer traction.
    diligencePath: Request a dated account list with stage labels and revenue status for each named logo.
    relatedQuestionRefs:
    - QU007
    - QU012
    - QU020
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: customer-satisfaction
    missingEvidence: Independent customer testimonials or quantified satisfaction metrics tied to measurable outcomes.
    whyItMatters: Logos and partner pages say little about day-two operating experience.
    diligencePath: Request reference calls or published customer quotes with outcome specifics.
