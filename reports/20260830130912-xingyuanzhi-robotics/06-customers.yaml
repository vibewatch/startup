chapter:
  number: 6
  title: Customers
  summary: >-
    Xingyuanzhi’s public customer proof is strongest where it touches major robotics OEMs and concrete industrial workflows, especially around AgiBot and EP-linked handling use cases. The record supports meaningful buyer relevance, but it still lacks the retention, renewal, and concentration evidence required to call the customer base durable rather than strategically promising.
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: >-
    Xingyuanzhi’s visible customer base is not broad in logo count, but it is strategically meaningful. The retained public record points to three main segments. First are robot OEMs such as AgiBot that may embed or evaluate Xingyuanzhi’s brain layer inside their own embodiments. Second are industrial automation and handling partners linked to warehouse or loading workflows, most visibly through Zhongli/EP-related references. Third are public-sector or ecosystem operators such as Beijing Yizhuang Robot, where the commercial logic appears tied to showcase deployments, pilot density, and robotics-cluster activity. This is a China-first customer map rooted in Beijing and domestic robotics hubs rather than international diversification. The company’s public reach may be wider than its named customer list: 36Kr reports coverage of more than 70% of leading embodied-intelligence companies. But that broad ecosystem claim does not substitute for a disclosed account list, segment mix, revenue concentration
    table, or durable renewal history.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU030
  - CU035
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption-trajectory
  title: Named Customer Proof and Adoption Trajectory
  body: >-
    The most persuasive part of the customer story is that Xingyuanzhi appears attached to real operating environments, not only concept demos. Lavx and News Globe Now both report hundreds of 2025 shipments and more than RMB10 million of revenue, which is enough to establish genuine adoption. AgiBot is the highest-value named proof because it is a scaled humanoid OEM with visible 2026 deployments. AGIBOT’s official materials describe more than 60 robots operating across WAIC venues, industrial deployments with live line metrics, and a rapidly expanding portfolio. If Xingyuanzhi remains embedded in that ecosystem, the relationship could matter a great deal. EP-linked evidence tells a different but equally relevant story: intelligent loading, unloading, and warehouse-motion tasks are concrete buying jobs in which embodied intelligence can be monetized. Yet these proofs are still indirect. The public record shows the customer workflows more clearly than it shows exactly how much value Xingyuanzhi
    captures inside them.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
