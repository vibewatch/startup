- id: durability-expansion-and-retention-gaps
  title: Durability, Expansion, and Retention Gaps
  body: >-
    The main weakness in Xingyuanzhi’s customer record is not relevance but durability. No retained public source discloses active account counts, site counts, renewal behavior, GRR, NRR, or even basic cohort metrics. The best available durability proxy is ongoing partner cadence—AgiBot’s rapid public product schedule, multi-year strategic-order language, and recurring ecosystem presence. That is useful but still far weaker than formal renewal data. The land-and-expand thesis is plausible: one OEM could add more embodiments, one industrial partner could add more sites, and one venue operator could expand from pilot workflows into broader procurement. But that path is still a hypothesis. Some relationships may also be strategically valuable for data collection and category signaling rather than immediate revenue, which means logos alone can overstate customer quality. On the current record, the company looks early enough that customer proof should be interpreted as pre-retention.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU024
  - CU025
  - CU027
  - CU029
  - CU034
  tableRefs:
  - TU004
  - TU006
- id: concentration-risk-and-customer-verdict
  title: Concentration Risk, Procurement Friction, and Final Customer Verdict
  body: >-
    A concentrated customer base is normal for a company this young, but it is still material. AgiBot is a valuable logo and a potential source of deep scale, yet it is also building its own embodied stack. Yizhuang can accelerate discovery and pilots, but public evidence does not show that it is already a durable high-revenue customer. EP-linked workflows show genuine operational need, but they also show that many buyer jobs can be solved with simpler automation before a buyer must commit to a broad embodied-brain platform. That leaves Xingyuanzhi with a promising but risky customer shape: strategically important logos, concrete workflow relevance, and little public retention evidence. The broader sector context adds caution. China’s embodied-AI capital surge means logos and pilots may accumulate faster than diversified, repeatable customer economics. The correct conclusion is neither skepticism nor overconfidence. The company has real customer proof, but it is still concentrated, indirect,
    and not yet a durable cohort story or repeatable revenue base.
  claimRefs:
  - CU012
  - CU023
  - CU026
  - CU031
  - CU032
  - CU033
  - CU036
