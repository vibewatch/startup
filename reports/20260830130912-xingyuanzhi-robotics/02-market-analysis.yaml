chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Xingyuanzhi addresses a narrower but still meaningful slice of the 2026 robotics boom: the embodied-brain and edge-compute layer that sits between chips and complete robots. Public market evidence shows China’s installed automation base, capital intensity, policy support, and standards push are large enough to make that slice real, but the absence of published brain-layer TAMs, ROI benchmarks, and price disclosure means the market case is still more directional than fully quantifiable.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Substitutes
  body: >-
    The relevant market for Xingyuanzhi is narrower than the headline humanoid-robotics market and broader than a single controller SKU. Public company and media sources consistently frame Xingyuanzhi as a seller of the robot “brain”: embodied foundation models, world-model software, edge inference, and the controller hardware needed to run those systems on different robot bodies. That means the company participates in a layer between silicon and whole-robot OEM revenue. Included spend therefore covers the intelligence stack, edge compute, integration, and deployment support that make a robot usable in a real workflow. Excluded spend includes the manufacture of robot bodies, commodity actuators, and large facility redesign projects that a brain-layer vendor does not directly capture. The closest substitutes are not only other brain vendors but also fixed industrial robots, AMRs, quadrupeds, in-house autonomy teams, and human labor. For Xingyuanzhi to win, buyers must believe that outsourced
    embodied intelligence can reach acceptable latency, safety, and cost without sacrificing control of the finished robot experience.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM036
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: sizing-lenses-and-contradictions
  title: Sizing Lenses and Analytical Contradictions
  body: >-
    The market-sizing record for embodied intelligence is crowded but inconsistent because different publishers measure different things. Goldman Sachs publishes a long-run global humanoid TAM floor of US$6 billion and a blue-sky 2035 ceiling of US$154 billion, while CNBC reports a Barclays view that the market starts around US$2-3 billion today and could reach US$200 billion by 2035. IDTechEx offers a more moderate 2036 outcome near US$29.5 billion, and Deloitte frames 2026 industrial-use humanoids at only US$210-270 million before a possible climb to US$600 million-US$1 billion by 2032. Those differences are not errors so much as scope mismatches: some models measure hardware revenue, others future economic value, and others current industrial shipments. IFR’s industrial-robot baseline and EmbodiedGlobal’s capital-flow data help bound the nearer-term opportunity. China already has the world’s largest industrial-robot installed base and the most aggressive capital concentration in embodied
    AI, which implies that a China-first serviceable market for brain-layer vendors exists. What is still missing is a standalone published TAM or SAM for the robot-brain layer itself.
