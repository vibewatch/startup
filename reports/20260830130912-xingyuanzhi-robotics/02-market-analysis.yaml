  title: China’s policy and cluster stack is a genuine market accelerant
  body: >-
    The combination of Beijing cluster density, the 15th Five-Year Plan, and HEIS 2026 should lower friction for domestic pilots and standards-led procurement faster than many Western markets can match.
  claimRefs:
