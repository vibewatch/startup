- id: buyer-segmentation-and-adoption-path
  title: Buyer Segmentation and Adoption Path
  body: >-
    Xingyuanzhi’s practical buyer map is clearer than its precise SAM. Public sources point to at least four buyer groups. First are humanoid or embodied-robot OEMs such as AgiBot that want a high-performance brain layer without building every component themselves. Second are industrial machine or vehicle makers such as Zhongli or EP that can pair a brain stack with forklifts, mobile handling equipment, or warehouse workflows. Third are local-government or development-zone operators such as Beijing Yizhuang Robot that care about service scenarios, showcase deployments, and ecosystem build-out. Fourth are utilities or industrial operators running inspection and maintenance tasks. Budget ownership varies by segment, but the pattern is consistent: the payer is usually not the end consumer, it is the OEM product team, operations executive, automation manager, or public-sector procurement arm that wants deployable capability quickly. Adoption is pulled by labor scarcity, multi-SKU workflows,
    and the need for low-latency edge control. The first meaningful deployment verticals remain manufacturing, logistics, and inspection; home or broad consumer-service use cases remain farther out.
