callouts:
- calloutType: insight
  title: The addressable market is smaller than the humanoid hype headline
  body: >-
    Xingyuanzhi does not sell a complete humanoid robot, so broad 2035 humanoid TAM charts overstate the near-term revenue pool. The better lens is the slice of OEMs and operators willing to buy an external embodied-brain stack.
  claimRefs:
  - CM001
  - CM015
  - CM016
  - CM040
