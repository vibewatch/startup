- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - 15th Five-Year Plan support
    - positive
    - 2026-2030
    - Policy support should expand pilots, procurement, and training infrastructure
    - Which portions of policy support convert into real purchase orders for brain-layer vendors?
  - - HEIS 2026 standards
    - positive
    - 2026 onward
    - Lower coordination cost and clearer interoperability can accelerate deployments
    - Which interfaces and certifications matter most for Xingyuanzhi products?
  - - Beijing / Yizhuang cluster
    - positive
    - Current
    - Local ecosystem support improves talent access and pilot density
    - How much of current demand is cluster-specific rather than nationwide?
  - - China cost advantage
    - positive
    - Current to medium term
    - Domestic vendors may win earlier on price-performance and deployment speed
    - Can that advantage survive outside China under different compliance rules?
  - - Data and interoperability gaps
    - negative
    - Current
    - Weak data quality and integration can slow generalization and raise deployment cost
    - What dataset or middleware evidence proves Xingyuanzhi can generalize across embodiments?
  - - Cybersecurity and safety risk
    - negative
    - Current
    - Trust requirements can slow procurement in critical environments
    - What secure-edge architecture and safety cases exist?
  - - Task variability and ROI uncertainty
    - negative
    - Current
    - Humanoids still perform best on repetitive low-variability tasks, limiting immediate TAM realization
    - Where are uptime and payback metrics strongest today?
  - - Capital-market exuberance
    - negative
    - Current to 2028
    - Unicorn counts and fundraising may outrun real revenue, increasing down-round risk
    - Which companies are converting pilots into recurring revenue versus only raising capital?
  notes: The market is being pushed forward by policy and capital but gated by engineering reality and procurement trust.
