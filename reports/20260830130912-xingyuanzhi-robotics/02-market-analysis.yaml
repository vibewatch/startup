  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-gap
    missingEvidence: A standalone analyst estimate for the embodied-brain or robot-intelligence middleware market in China.
    whyItMatters: >-
      Most published TAMs measure whole humanoid hardware or broad automation rather than the thinner software plus controller layer that Xingyuanzhi actually sells.
    diligencePath: >-
      Request bottom-up market segmentation from investors or analysts that split robot-body, component, and brain-layer revenue pools.
    relatedQuestionRefs:
    - QM011
    - QM024
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      A price book, licensing schedule, or dated customer contract that shows controller ASP, software attach, maintenance, and integration fees.
    whyItMatters: >-
      Without pricing disclosure it is impossible to bridge broad market demand into Xingyuanzhi-specific revenue potential or to test whether the brain-only thesis carries attractive gross margins.
    diligencePath: Request signed commercial proposals or at least a dated product pricing sheet from the company or a reference customer.
    relatedQuestionRefs:
    - QM025
    - QM024
  - type: missing-source
    severity: material
    topic: roi-proof
    missingEvidence: Independent workflow-level ROI benchmarks for deployment in logistics, inspection, or manufacturing.
    whyItMatters: >-
      The market story is strong on funding and policy, but weak on proven cost savings, uptime, and payback for actual buyer workflows.
    diligencePath: >-
      Obtain case studies with baseline labor, cycle-time, uptime, and payback data from Yizhuang, AgiBot, Zhongli, or energy deployments.
    relatedQuestionRefs:
    - QM020
    - QM024
  - type: missing-source
    severity: minor
    topic: export-compliance
    missingEvidence: >-
      A public document explaining how Chinese-origin embodied-brain vendors plan to address non-China safety and cybersecurity procurement requirements.
    whyItMatters: >-
      If the company eventually wants non-China growth, market size and win rate will depend on how much Western procurement or compliance friction limits adoption.
    diligencePath: Request export compliance, cyber architecture, and safety-certification roadmaps from management.
    relatedQuestionRefs:
