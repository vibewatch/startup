              - CO012
      - number: '1.2'
        title: Capital, leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Flow obtained $350 million from Andreessen Horowitz in August 2022 at a valuation above $1 billion, before
              operations were established. Later reporting described more than $100 million of additional funding and an
              approximately $2.5 billion valuation, while other coverage still described the portfolio and business
              model as difficult to evaluate. Adam Neumann is the disclosed founder and Fawaz Farooqui is identified as
              chairman and CEO of Flow MENA in the 2026 Saudi partnership announcement. Beyond those roles, the public
              record does not establish a complete executive roster, board composition, voting rights, related-party
              arrangements or investor preferences. That governance opacity is material because the company combines
              real-estate ownership, operating contracts and financial-services ambitions.
