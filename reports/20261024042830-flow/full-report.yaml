  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported financing strength is outweighed by missing underwriting inputs and operating-risk signals, leading to a
      research-more decision.
    data:
      nodes:
        - id: financing
          label: Financing access
          detail: $350M reported in 2022 and a later $100M raise at a reported $2.5B mark.
        - id: footprint
          label: Operating footprint
          detail: U.S. and Saudi properties provide tangible operating scope, but portfolio counts conflict.
        - id: model
          label: Valuation method
          detail: Property, fee, rent, vacancy, cap-rate, and financing evidence is needed.
        - id: gaps
          label: Evidence gaps
          detail: No audited Flow financials, asset schedule, cap table, or preference stack in retained sources.
        - id: risk
          label: Downside signals
          detail: Reported Nashville cash-flow concerns and selective capital conditions raise execution risk.
        - id: decision
          label: Research more
          detail: High risk, low-to-medium confidence, and a stretched valuation stance.
      edges:
        - from: financing
          to: footprint
        - from: footprint
          to: model
        - from: model
          to: gaps
        - from: gaps
          to: risk
        - from: risk
          to: decision
    approximationNotes: >-
      The sequence is decision logic, not a quantitative valuation bridge; dollar figures are reported financing marks,
      not verified fair value.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
      - CV011
      - CV012
      - CV013
      - CV016
