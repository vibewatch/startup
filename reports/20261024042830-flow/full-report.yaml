chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Flow was founded in 2022 by Adam Neumann and is headquartered in Miami, Florida. Public descriptions
              consistently place it in residential real estate, but its operating model is broader than a conventional
              software vendor: the company develops, acquires, owns and manages multifamily properties while layering
              technology, design, hospitality and resident-community services onto those assets. Flow's own website
              identifies South Florida, Riyadh and the Bay Area as its regions and presents a lifestyle-oriented
              proposition, while third-party descriptions characterize the business as a vertically integrated
              residential platform. The available record supports the product and asset strategy, but not a precise
              recurring-revenue or software-margin profile.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
