      - number: '1.3'
        title: Milestones, expansion and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Flow's observable milestones run from its 2022 launch and initial apartment acquisition program through
              international expansion and asset-level partnerships. The company initially targeted more than 3,000 units
              across Atlanta, Fort Lauderdale, Miami and Nashville; later accounts describe about 4,000 luxury rentals,
              six United States buildings with two operating, and projects in Miami. In Saudi Arabia, reporting
              described three Riyadh properties totaling approximately 920 units, while the 2026 Rawajeh announcement
              identifies Thara as the first practical operating collaboration under that alliance. Flow also acquired
              the Whalebone magazine and announced a 30% Canada Global stake. These milestones show expansion, but
              public sources do not reconcile portfolio counts, ownership percentages, occupancy, NOI, leverage, cash
              flow or the economics of the Saudi arrangements. Curbed also reported that a financially troubled 358-unit
              Nashville property was sold for less than Flow had paid, demonstrating that expansion has included
              asset-level setbacks rather than uniformly positive performance.
