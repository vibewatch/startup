        - label: Likelihood
          detail: Qualitative exposure based on retained public evidence.
        - label: Impact
          detail: Potential effect on runway, delivery, economics, or operability.
        - label: Mitigation maturity
          detail: Publicly visible state of monitoring or control.
        - label: Residual exposure
          detail: Risk remaining before private diligence.
      rows:
