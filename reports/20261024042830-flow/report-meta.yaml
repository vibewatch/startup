companyProfile:
  summary: >-
    Flow is a private residential real-estate platform founded by Adam Neumann that combines apartment ownership and
    management with design, hospitality, resident services, and digital operations. Its public footprint spans U.S.
    properties, Saudi partnerships, and a growing operating mandate, but the available record does not establish
    consolidated revenue, margins, occupancy, or governance terms.
