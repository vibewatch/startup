  topStrengths:
    - Substantial venture financing and a reported multi-billion-dollar private mark.
    - Tangible residential assets and operating deployments in the United States and Saudi Arabia.
    - Named partner mandates that extend Flow's design, operations, and management role.
  topRisks:
    - Property-level economics, occupancy, NOI, leverage, and cash runway remain undisclosed.
    - Governance, investor preferences, ownership scope, and related-party arrangements remain private.
    - Saudi project economics, delivery obligations, and counterparty concentration are not public.
    - Reported Nashville losses and asset-level setbacks challenge a simple scale narrative.
  unresolvedGaps:
    - Asset-level rent roll, occupancy, NOI, and leverage remain undisclosed.
    - Board composition, governance rights, and cap-table preferences remain private.
    - Resident renewal, NPS, complaint, and service-usage data are not public.
    - Saudi partner economics, entity structure, and return profile are not public.
    - The renter value-sharing or equity mechanism remains conceptually described but operationally under-documented.
