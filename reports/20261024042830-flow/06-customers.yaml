chapter:
  number: 6
  title: "Customers"
  summary: >-
    Flow has tangible adoption evidence in operated apartment communities, a long-dated
    municipal lease at The Fay, and a Saudi operating mandate at Thara. The public record,
    however, measures assets, units, leases, and launches rather than resident retention,
    satisfaction, expansion, or customer concentration.
sections:
  - id: "customer-model-and-segments"
    title: "Customer model and segment boundaries"
    body: >-
      Flow serves more than one economic customer. Residents buy the lived experience:
      an apartment combined with hospitality, maintenance, amenities, community programming,
      and digital service access. Property owners, landowners, and investors can instead buy
      Flow's design, property-management, brand, and operating capabilities. The Saudi
      Rawajeh agreement makes that business-to-business role explicit, while The Fay adds a
      public-sector leasing layer in which San Jose secures units for eligible workers.
      These segments have different payers, procurement cycles, and success measures, so
      apartment counts should not be presented as a single customer count. The available
      evidence identifies deployment surfaces but does not disclose segment revenue,
      resident mix, or contribution margin.
    claimRefs: [CU001, CU002, CU013, CU015, CU016]
    tableRefs: [TU001]
  - id: "adoption-trajectory"
    title: "Adoption is visible through assets and leases, not retention"
    body: >-
      The clearest adoption trail is physical. Early reporting described more than 3,000
      units across four U.S. markets, but a September 2024 account said Flow owned six U.S.
      buildings and operated only two, illustrating why owned, managed, and live units must
      remain distinct. Saudi Arabia added three Riyadh properties totaling about 920 units,
      with only one open and not yet complete at that reporting point. By May 2026, The Fay
      added a 336-unit West Coast deployment; approximately 175 units were occupied and the
      City of San Jose had leased 197 units under a ten-year agreement. These are meaningful
      operating signals, but none supplies renewal, churn, or cohort evidence.
    claimRefs: [CU003, CU004, CU005, CU006, CU011, CU012, CU013, CU016]
    tableRefs: [TU002]
  - id: "named-proof-and-outcomes"
    title: "Named proof ranges from leases to operating mandates"
    body: >-
      The strongest named counterparty proof is the City of San Jose lease at The Fay and
      Rawajeh's operating agreement for Thara. Both move beyond logo-level evidence: one
      specifies units and duration, while the other assigns interior design, operation, and
      management responsibilities. Flow Narjis is also a named live deployment, but its soft
      launch showed an important maturity caveat: Forbes described resident video of a
      partially completed and largely deserted building. Public statements about bringing
      Flow's technology and programming to The Fay are plans, not measured resident
      outcomes. No retained source provides a named resident reference, satisfaction result,
      utilization measure, or renewal result.
    claimRefs: [CU007, CU008, CU009, CU010, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
  - id: "durability-expansion-and-risk"
    title: "Durability and expansion remain underwriting gaps"
    body: >-
      Expansion can occur through additional buildings, owner mandates, public-sector
      leasing, and added services, but the evidence does not show whether existing residents
      stay longer, pay more, or use more services over time. Narjis pricing and The Fay's
      occupancy are point-in-time operating observations with different geographies,
      products, and denominators; they do not form a comparable funnel or cohort. The
      long-dated San Jose lease may stabilize a portion of The Fay, while the Rawajeh
      alliance may widen Flow's Saudi pipeline, yet neither reveals economics or
      concentration. Underwriting therefore requires property-level occupancy, renewal,
      concession, complaint, service-usage, and counterparty-revenue data before treating
      footprint growth as durable customer adoption.
    claimRefs: [CU009, CU010, CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
