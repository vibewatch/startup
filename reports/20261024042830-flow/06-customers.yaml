figures:
  - id: "FU001"
    title: "Customer journey and expansion surfaces"
    type: "journey-map"
    summary: "Flow can expand from lease discovery into resident services and then into owner or institutional mandates, but no public conversion or retention rates connect the stages."
    data:
      nodes:
        - id: "discover"
          label: "Discover a community"
          detail: "Resident encounters a Flow-operated property or an institutional allocation such as The Fay."
          touchpoints: ["Property listing", "Employer or city eligibility channel"]
        - id: "lease"
          label: "Sign a lease"
          detail: "Resident, municipality, or another payer contracts for housing under segment-specific terms."
          touchpoints: ["Resident lease", "Municipal master lease"]
        - id: "move-in"
          label: "Move in"
          detail: "Operational proof begins only when units are open and occupied, not when a property is announced."
          touchpoints: ["Building access", "Onboarding"]
        - id: "use-services"
          label: "Use services and amenities"
          detail: "Hospitality, maintenance, community programming, and digital service tools form the resident proposition."
          touchpoints: ["Concierge", "Maintenance", "Amenities", "Community events"]
        - id: "renew-or-expand"
          label: "Renew or expand"
          detail: "Resident renewal and paid service expansion are plausible but not quantified in the retained evidence."
          touchpoints: ["Lease renewal", "Additional services"]
        - id: "replicate"
          label: "Replicate through counterparties"
          detail: "Flow can add buildings through owner mandates, partner projects, or institutional leasing channels."
          touchpoints: ["Rawajeh operating mandate", "City lease", "New property onboarding"]
    approximationNotes: "The ordered stages are an analytical journey, not a measured funnel; no conversion, retention, or expansion rate is inferred."
    claimRefs: [CU001, CU002, CU013, CU014, CU015, CU016]
callouts:
  - calloutType: "risk"
    title: "Footprint is not retention"
    body: >-
      The available evidence supports assets, units, lease duration, and operating scope,
      but not NRR, GRR, churn, renewal, NPS, complaint rates, or service utilization.
      Investment underwriting should not translate property growth into durable customer
      adoption without the missing property- and cohort-level records.
    claimRefs: [CU003, CU004, CU013, CU016]
