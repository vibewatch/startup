  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory
      missingEvidence: Flow-specific fair-housing, tenant-screening, licensing, permitting, complaint, and enforcement records.
      whyItMatters: A residential operator can face material liability or operational restrictions even when no incident appears in the retained public evidence.
      diligencePath: Request a jurisdiction-by-jurisdiction compliance matrix, policies, training records, complaints, audits, permits, and counsel confirmations.
      relatedQuestionRefs: [QR001, QR010]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: blocking
      topic: economics
      missingEvidence: Audited occupancy, rent roll, concessions, NOI, capex, debt service, and cash runway by property.
      whyItMatters: Reported Nashville losses do not establish whether the current portfolio or operating layer is economically sustainable.
      diligencePath: Review monthly property statements, debt schedules, budgets versus actuals, capex commitments, and consolidated cash forecasts.
      relatedQuestionRefs: [QR002, QR009]
      relatedTableRefs: [TR002]
    - type: enumeration-incomplete
      severity: material
      topic: Saudi-Arabia
      missingEvidence: Complete Saudi project list, entity ownership, approvals, capital obligations, completion milestones, fees, and return waterfalls.
      whyItMatters: The reported Riyadh unit footprint and the later Thara mandate may use different ownership and operating structures.
      diligencePath: Obtain project-level development, ownership, financing, and operating agreements plus licenses and completion certificates.
      relatedQuestionRefs: [QR003, QR005, QR006]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: Data map, privacy assessments, cybersecurity audits, insurance, outage history, and incident register.
      whyItMatters: Digital resident services can create privacy and service-continuity exposure that the assigned public evidence does not quantify.
      diligencePath: Review architecture, subprocessors, access controls, audit reports, insurance certificates, and all security or availability incidents.
      relatedQuestionRefs: [QR001, QR010]
      relatedTableRefs: [TR001, TR002]
