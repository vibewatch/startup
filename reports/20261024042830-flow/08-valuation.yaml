  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-financials
      missingEvidence: Audited financial statements, asset-level rent rolls, occupancy, net operating income, leverage, ownership percentages, and cash-flow forecasts.
      whyItMatters: These inputs are required to distinguish asset value, operating-company value, and speculative platform value without false precision.
      diligencePath: Obtain audited statements and a property-by-property schedule, reconcile them to legal entities and debt, and commission independent appraisal and market work.
      relatedQuestionRefs: [QV008]
      relatedTableRefs: [TV003]
    - type: private-evidence-only
      severity: material
      topic: investor-rights
      missingEvidence: Current cap table, security terms, liquidation preferences, anti-dilution rights, debt covenants, and any investor rights in real-estate assets.
      whyItMatters: Headline enterprise value does not reveal ownership, preference overhang, dilution, or proceeds available to a new investor at exit.
      diligencePath: Review charter documents, financing agreements, side letters, debt documents, and a fully diluted capitalization model.
      relatedQuestionRefs: [QV007]
      relatedTableRefs: [TV001, TV003]
    - type: conflicting-data
      severity: material
      topic: asset-base
      missingEvidence: A dated reconciliation of owned, invested, operated, managed, development, and pipeline units across the United States and Saudi Arabia.
      whyItMatters: Public counts of roughly 500 and more than 3,000 units cannot be compared without consistent scope and timing.
      diligencePath: Reconcile legal ownership and management contracts to a current property schedule and explain every inclusion and disposition.
      relatedQuestionRefs: [QV003]
      relatedTableRefs: [TV002, TV003]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Primary board-approved exit plan, audited reporting readiness, governance controls, and evidence of a viable IPO, strategic sale, or secondary route.
      whyItMatters: A reported aspiration to pursue an eventual IPO does not establish timing, probability, or proceeds.
      diligencePath: Review board materials, audit status, governance documents, banker engagement, secondary activity, and a milestone-based exit-readiness plan.
      relatedQuestionRefs: [QV009]
