callouts:
  - calloutType: strength
    title: Operating proof exceeds software proof
    body: Flow has a visible property and partnership footprint, including a Riyadh opening and a named Thara operating agreement, which is stronger evidence than a purely conceptual proptech pitch.
    claimRefs: [CE006, CE009]
  - calloutType: risk
    title: Product moat remains unproven
    body: The assigned evidence does not establish proprietary architecture, security controls, reliability metrics, or independently measured resident outcomes; the differentiation may be primarily asset selection and operations.
    claimRefs: [CE013, CE014, CE015]
