evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A complete cap table, board roster, voting-rights summary and related-party transaction schedule.
    whyItMatters: >-
      The founder-centered model and mixed asset/operator structure make control and conflicts important to
      underwriting.
    diligencePath: >-
      Request the current capitalization table, shareholder agreement, board materials and related-party disclosures
      under NDA.
    relatedQuestionRefs:
      - QO002
      - QO007
  - type: missing-source
    severity: material
    topic: operating-metrics
    missingEvidence: Property-level occupancy, rent roll, NOI, leverage, cash flow and consolidated revenue or ARR.
    whyItMatters: The reported valuation cannot be compared with operating performance from public evidence.
    diligencePath: Obtain audited or management-certified financial statements and an asset-by-asset operating schedule.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: conflicting-data
    severity: material
    topic: portfolio
    missingEvidence: A current reconciliation of unit count, building count, ownership share and managed-versus-owned assets.
    whyItMatters: >-
      Sources report more than 3,000 units, about 4,000 rentals, six U.S. buildings and separate Saudi units on
      different dates.
    diligencePath: >-
      Request a dated portfolio schedule with ownership, management responsibility, delivery status and financing for
      every property.
    relatedQuestionRefs:
      - QO004
      - QO005
  - type: private-evidence-only
    severity: material
    topic: Saudi-Arabia
    missingEvidence: Saudi entity structure, partner economics, project-level financing, delivery status and return waterfall.
    whyItMatters: Expansion announcements establish relationships and units but not Flow's economic exposure or execution risk.
    diligencePath: >-
      Review the Saudi operating and development agreements, entity chart, budgets and project-level investment
      memoranda.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: leadership
    missingEvidence: A complete current executive and board enumeration.
    whyItMatters: Only the founder and one regional executive are publicly identified in the retained evidence.
    diligencePath: Obtain the current organization chart, biographies, board committee assignments and succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: constrained-sizing
    missingEvidence: A current Flow-eligible pipeline by geography, asset type, ownership or operating role, and expected economics.
    whyItMatters: >-
      Without an eligible pipeline and capture assumptions, broad multifamily demand cannot be converted into a
      defensible SAM or SOM.
    diligencePath: >-
      Request a current pipeline schedule showing units, status, ownership, operating role, capital committed, expected
      opening date, and underwriting returns.
    relatedQuestionRefs:
      - QM004
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-constraints
    missingEvidence: >-
      Property-level occupancy, rent premium, retention, NOI, service cost, and capital intensity for Flow-operated
      communities.
    whyItMatters: >-
      These measures determine whether Flow's brand and operating layer create incremental value rather than only higher
      cost.
    diligencePath: >-
      Obtain asset-level operating statements and cohort metrics for stabilized and newly launched buildings, with
      comparable pre-Flow or market benchmarks.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: conflicting-data
    severity: material
    topic: disclosed-footprint
    missingEvidence: A reconciled current inventory separating owned, operated, partnered, under-construction, and sold assets.
    whyItMatters: >-
      Public sources describe different snapshots and roles, so counting units without ownership and operating status
      can overstate serviceable scale.
    diligencePath: >-
      Reconcile the asset register to legal entities, management agreements, construction status, and current unit
      counts as of the refresh date.
    relatedQuestionRefs:
      - QM003
      - QM009
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable Flow management or software fees, Yardi contract pricing, discounts, contract length, implementation
      cost, and realized owner economics.
    whyItMatters: >-
      Without like-for-like commercial terms, pricing power and total cost of ownership cannot be compared across the
      integrated and software alternatives.
    diligencePath: >-
      Request representative Flow owner agreements and invoices, then benchmark them against two recent Yardi proposals
      and an internal-operation cost allocation.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: outcome-proof
    missingEvidence: >-
      Property-level resident retention, occupancy, NOI uplift, service utilization, satisfaction, and migration data
      benchmarked against comparable assets.
    whyItMatters: >-
      These metrics would show whether Flow's integrated experience creates durable differentiation rather than a
      replicable bundle of amenities and software.
    diligencePath: >-
      Obtain matched-cohort property operating reports, resident surveys, renewal data, and implementation histories for
      Flow-operated and conventionally managed assets.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: blocking
    topic: revenue-recognition
    missingEvidence: >-
      Consolidated income statement, cash-flow statement, revenue-recognition policy, and bridge from gross rent to Flow
      cash.
    whyItMatters: Without the bridge, reported rents and funding cannot be converted into recurring revenue or margin.
    diligencePath: Request audited or management accounts plus monthly property-to-corporate consolidation schedules.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI004
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, debt maturities, construction commitments, and next-round trigger.
    whyItMatters: Financing raised is not cash available and does not establish runway or solvency.
    diligencePath: Obtain a current treasury report, 24-month cash forecast, debt schedule, and financing plan.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: enumeration-incomplete
    severity: material
    topic: portfolio-economics
    missingEvidence: Complete property roster with ownership percentage, occupancy, rent roll, NOI, capex, and concessions.
    whyItMatters: Aggregate unit counts can hide minority stakes, distressed assets, and different economics by property.
    diligencePath: Request an asset-level data room export and reconcile it to legal ownership and lender statements.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: adverse-execution
    missingEvidence: Comparable operating and financial results for Flow's current portfolio versus the closed WeLive predecessor.
    whyItMatters: >-
      A prior residential concept's closure is adverse context, but does not establish whether the current model has
      better economics.
    diligencePath: >-
      Request current-property cohort retention, occupancy, contribution margin, and post-mortem evidence for the
      predecessor.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer or practitioner evidence such as a repository, release history, package usage, API documentation,
      or integration forum activity.
    whyItMatters: >-
      Without a developer-facing signal, the maturity and external adoption of any proprietary technology layer cannot
      be independently assessed.
    diligencePath: >-
      Request a product architecture walkthrough, release history, integration inventory, production usage metrics, and
      a permitted technical reference or sandbox.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Security, privacy, reliability, access-control, incident-response, and service-level documentation for resident
      systems.
    whyItMatters: >-
      The product touches building access, maintenance, communications, and potentially payments, so control quality is
      part of product risk.
    diligencePath: >-
      Obtain current security policies, penetration-test summaries, certifications, uptime and incident logs, data-flow
      diagrams, and vendor-control reports.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: value-sharing
    missingEvidence: Legal and operational documentation for resident value sharing, wallets, or ownership-like benefits.
    whyItMatters: >-
      The proposed mechanism is part of the differentiation thesis, yet its economics, regulatory treatment, and
      resident benefit remain unverified.
    diligencePath: >-
      Request product specifications, entity and contract structure, eligibility rules, historical distributions, and
      regulatory counsel analysis.
    relatedQuestionRefs:
      - QE007
  - type: enumeration-incomplete
    severity: minor
    topic: deployment
    missingEvidence: Complete property, module, and launch-status inventory with asset-level operating metrics.
    whyItMatters: Public accounts differ in scope and do not establish a consistent denominator for deployment maturity.
    diligencePath: >-
      Obtain the current property roster, unit counts, opening dates, operating status, staffing, occupancy, and
      service-performance dashboard.
    relatedQuestionRefs:
      - QE002
      - QE004
  - type: private-evidence-only
    severity: material
    topic: retention-and-satisfaction
    missingEvidence: Property- and cohort-level renewal, churn, NRR, GRR, NPS, complaint, concession, and service-utilization metrics.
    whyItMatters: >-
      Without durability and experience measures, unit growth cannot establish resident loyalty, pricing power, or
      service-led expansion.
    diligencePath: >-
      Request monthly property cohorts, renewal and move-out files, concession schedules, complaint logs, NPS surveys,
      and paid-service attachment data for every operated property.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue, NOI, units, and fees by property, geography, municipality, owner, operating partner, and resident
      segment.
    whyItMatters: >-
      The public footprint cannot reveal whether one property, public lease, partner, or owner relationship drives a
      disproportionate share of economics.
    diligencePath: >-
      Obtain a property- and counterparty-level revenue bridge with the top-ten exposure schedule, contract terms,
      termination rights, and renewal dates.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete roster of live properties, owner clients, institutional lessees, resident references, production dates,
      and measured outcomes.
    whyItMatters: >-
      The public sample cannot establish total customer breadth, production conversion, referenceability, or outcome
      consistency.
    diligencePath: >-
      Reconcile management contracts and rent rolls to a complete deployment roster, then sample named owner and
      resident references independently.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: Flow-specific fair-housing, tenant-screening, licensing, permitting, complaint, and enforcement records.
    whyItMatters: >-
      A residential operator can face material liability or operational restrictions even when no incident appears in
      the retained public evidence.
    diligencePath: >-
      Request a jurisdiction-by-jurisdiction compliance matrix, policies, training records, complaints, audits, permits,
      and counsel confirmations.
    relatedQuestionRefs:
      - QR001
      - QR010
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: economics
    missingEvidence: Audited occupancy, rent roll, concessions, NOI, capex, debt service, and cash runway by property.
    whyItMatters: >-
      Reported Nashville losses do not establish whether the current portfolio or operating layer is economically
      sustainable.
    diligencePath: >-
      Review monthly property statements, debt schedules, budgets versus actuals, capex commitments, and consolidated
      cash forecasts.
    relatedQuestionRefs:
      - QR002
      - QR009
    relatedTableRefs:
      - TR002
  - type: enumeration-incomplete
    severity: material
    topic: Saudi-Arabia
    missingEvidence: >-
      Complete Saudi project list, entity ownership, approvals, capital obligations, completion milestones, fees, and
      return waterfalls.
    whyItMatters: >-
      The reported Riyadh unit footprint and the later Thara mandate may use different ownership and operating
      structures.
    diligencePath: >-
      Obtain project-level development, ownership, financing, and operating agreements plus licenses and completion
      certificates.
    relatedQuestionRefs:
      - QR003
      - QR005
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: security
    missingEvidence: Data map, privacy assessments, cybersecurity audits, insurance, outage history, and incident register.
    whyItMatters: >-
      Digital resident services can create privacy and service-continuity exposure that the assigned public evidence
      does not quantify.
    diligencePath: >-
      Review architecture, subprocessors, access controls, audit reports, insurance certificates, and all security or
      availability incidents.
    relatedQuestionRefs:
      - QR001
      - QR010
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: valuation-financials
    missingEvidence: >-
      Audited financial statements, asset-level rent rolls, occupancy, net operating income, leverage, ownership
      percentages, and cash-flow forecasts.
    whyItMatters: >-
      These inputs are required to distinguish asset value, operating-company value, and speculative platform value
      without false precision.
    diligencePath: >-
      Obtain audited statements and a property-by-property schedule, reconcile them to legal entities and debt, and
      commission independent appraisal and market work.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: investor-rights
    missingEvidence: >-
      Current cap table, security terms, liquidation preferences, anti-dilution rights, debt covenants, and any investor
      rights in real-estate assets.
    whyItMatters: >-
      Headline enterprise value does not reveal ownership, preference overhang, dilution, or proceeds available to a new
      investor at exit.
    diligencePath: >-
      Review charter documents, financing agreements, side letters, debt documents, and a fully diluted capitalization
      model.
    relatedQuestionRefs:
      - QV007
    relatedTableRefs:
      - TV001
      - TV003
  - type: conflicting-data
    severity: material
    topic: asset-base
    missingEvidence: >-
      A dated reconciliation of owned, invested, operated, managed, development, and pipeline units across the United
      States and Saudi Arabia.
    whyItMatters: Public counts of roughly 500 and more than 3,000 units cannot be compared without consistent scope and timing.
    diligencePath: >-
      Reconcile legal ownership and management contracts to a current property schedule and explain every inclusion and
      disposition.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV002
      - TV003
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Primary board-approved exit plan, audited reporting readiness, governance controls, and evidence of a viable IPO,
      strategic sale, or secondary route.
    whyItMatters: A reported aspiration to pursue an eventual IPO does not establish timing, probability, or proceeds.
    diligencePath: >-
      Review board materials, audit status, governance documents, banker engagement, secondary activity, and a
      milestone-based exit-readiness plan.
    relatedQuestionRefs:
      - QV009
