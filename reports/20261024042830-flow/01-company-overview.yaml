company:
  name: Flow
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Flow is a privately held residential real-estate operator founded by Adam Neumann
    in 2022 and headquartered in Miami. The evidence shows a hybrid model spanning
    multifamily ownership, property operations, resident services and community
    branding, with substantial funding and Saudi expansion but limited public
    disclosure of governance, unit economics and operating scale.
sections:
  - id: identity-and-model
    title: Identity and operating model
    body: >-
      Flow was founded in 2022 by Adam Neumann and is headquartered in Miami,
      Florida. Public descriptions consistently place it in residential real estate,
      but its operating model is broader than a conventional software vendor: the
      company develops, acquires, owns and manages multifamily properties while
      layering technology, design, hospitality and resident-community services onto
      those assets. Flow's own website identifies South Florida, Riyadh and the Bay
      Area as its regions and presents a lifestyle-oriented proposition, while
      third-party descriptions characterize the business as a vertically integrated
      residential platform. The available record supports the product and asset
      strategy, but not a precise recurring-revenue or software-margin profile.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: capital-leadership-and-governance
    title: Capital, leadership and governance
    body: >-
      Flow obtained $350 million from Andreessen Horowitz in August 2022 at a
      valuation above $1 billion, before operations were established. Later
      reporting described more than $100 million of additional funding and an
      approximately $2.5 billion valuation, while other coverage still described
      the portfolio and business model as difficult to evaluate. Adam Neumann is
      the disclosed founder and Fawaz Farooqui is identified as chairman and CEO of
      Flow MENA in the 2026 Saudi partnership announcement. Beyond those roles, the
      public record does not establish a complete executive roster, board
      composition, voting rights, related-party arrangements or investor
      preferences. That governance opacity is material because the company combines
      real-estate ownership, operating contracts and financial-services ambitions.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: milestones-and-open-evidence
    title: Milestones, expansion and evidence limits
    body: >-
      Flow's observable milestones run from its 2022 launch and initial apartment
      acquisition program through international expansion and asset-level
      partnerships. The company initially targeted more than 3,000 units across
      Atlanta, Fort Lauderdale, Miami and Nashville; later accounts describe about
      4,000 luxury rentals, six United States buildings with two operating, and
      projects in Miami. In Saudi Arabia, reporting described three Riyadh
      properties totaling approximately 920 units, while the 2026 Rawajeh
      announcement identifies Thara as the first practical operating collaboration
      under that alliance. Flow also acquired the Whalebone magazine and announced
      a 30% Canada Global stake. These milestones show expansion, but public
      sources do not reconcile portfolio counts, ownership percentages, occupancy,
      NOI, leverage, cash flow or the economics of the Saudi arrangements. Curbed
      also reported that a financially troubled 358-unit Nashville property was
      sold for less than Flow had paid, demonstrating that expansion has included
      asset-level setbacks rather than uniformly positive performance.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
