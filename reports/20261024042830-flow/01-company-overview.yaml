callouts:
  - calloutType: strength
    title: Asset-plus-operations model
    body: "Flow has assembled a differentiated combination of multifamily assets, property operations, resident experience and branded community programming rather than presenting solely as a software startup."
    claimRefs: [CO002, CO010]
  - calloutType: risk
    title: Governance and economics remain opaque
    body: "Public sources do not establish board rights, occupancy, NOI, leverage, cash flow or Saudi partnership economics, while Curbed reported one Nashville property sale below cost; the private valuation is therefore difficult to underwrite from public evidence."
    claimRefs: [CO006, CO007, CO016]
