callouts:
  - calloutType: insight
    title: Demand is durable but not automatically monetizable
    body: The cost-to-buy premium and renter-demand outlook support a durable rental backdrop, but Flow must still demonstrate that its branded operating layer produces incremental rent, retention, occupancy, or NOI after service and capital costs.
    claimRefs: [CM005, CM006, CM014]
  - calloutType: risk
    title: Market size can mask asset-level execution risk
    body: Flow's public footprint and Saudi expansion show a route to scale, while reporting on a distressed Nashville asset and the absence of public unit economics limit confidence that broad multifamily growth translates into Flow-level returns.
    claimRefs: [CM008, CM009, CM010, CM014]
