      - ["Resident services", "Concierge, housekeeping, amenities, and app-enabled requests", "Resident or lease package", "Services described; realized attach and pricing undisclosed", "Independent reporting of offering", "Service revenue, utilization, staffing cost, and contribution margin"]
    notes: "Sources mix reported property pricing and partner/company announcements; null economics mean no public realized revenue or margin disclosure."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization
    columns: [Price or contract, Basis, List vs realized, Discount or unknown, Implication]
    rows:
      - ["$4,262", "Average furnished rent at reported open Riyadh property", "Reported average asking/observed rent; realized status unknown", "Occupancy and concessions unavailable", "Premium positioning can increase gross rent but does not establish net property income"]
      - ["$2,843", "Average unfurnished rent at reported open Riyadh property", "Reported average asking/observed rent; realized status unknown", "Occupancy and concessions unavailable", "Two product tiers suggest segmentation; mix and conversion are unknown"]
      - ["Month free", "Lease incentive at Florida locations", "Reported promotion, not a recurring price", "Timing and eligibility unknown", "Concessions can reduce effective rent and delay payback"]
      - ["Undisclosed", "Flow management and operations agreements", "Contract economics unavailable", "Fee, reimbursement, and ownership terms unknown", "Cannot model Flow revenue from partner assets"]
    notes: "Quoted rents and promotion are market-facing or reported property terms; they are not consolidated Flow revenue, ARR, or realized net rent."
    claimRefs: [CI001, CI004, CI013]
  - id: TI003
    title: Unit economics
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Occupancy, null, low, "Determines rent conversion and fixed-cost absorption", "Monthly physical and economic occupancy by property"]
      - [Net operating income, null, low, "Tests asset-level profitability before financing", "Property P&Ls reconciled to bank receipts"]
      - [Gross margin, null, low, "Separates rent/service revenue from delivery cost", "Consolidated and segment gross-profit bridge"]
      - [CAC and payback, null, low, "Tests whether resident acquisition is scalable", "Channel spend, signed leases, churn, and cohort payback"]
      - [Cash burn and runway, null, low, "Determines financing dependency", "Cash balance, monthly burn, commitments, and runway"]
      - [Debt and capex burden, null, low, "Captures downside from owned/developed assets", "Debt schedule, covenants, capex plan, and guarantees"]
    notes: "Every unavailable metric is intentionally null; public sources do not support a defensible estimate without property-level statements and ownership data."
    claimRefs: [CI006, CI007, CI011, CI013, CI014, CI015]
