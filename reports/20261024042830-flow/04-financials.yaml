callouts:
  - calloutType: strength
    title: Capital has translated into operating assets
    body: Flow has moved beyond a pre-launch concept into US properties, Riyadh operations, and a Saudi partner pipeline, although the retained sources do not quantify returns.
    claimRefs: [CI002, CI009]
  - calloutType: risk
    title: Property-level losses are a live underwriting risk
    body: Forbes reports a partially completed, largely deserted early Riyadh building and notes that Flow's prior WeLive locations closed after the WeWork IPO collapse; these are execution signals, not proof of consolidated financial failure.
    claimRefs: [CI006, CI007]
  - calloutType: recommendation
    title: Underwrite assets and contracts separately
    body: Request property-level P&Ls, ownership and debt schedules, management agreements, and cash runway before assigning a consolidated margin or valuation.
    claimRefs: [CI013, CI014, CI015, CI016]
