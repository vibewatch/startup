      The PRIMA implant is 2 x 2 mm and 30 μm thick... a thin crystalline silicon array comprising 378 photovoltaic
      pixels that are each 100 μm wide. The array is implanted subretinally within the atrophic lesion. A frame-mounted
      camera on the PRIMA glasses captures images and projects them, after processing, onto the implant with the use of
      near-infrared light (wavelength 880 nm).
