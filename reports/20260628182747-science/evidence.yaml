    severity: material
    topic: milestone table regulatory timeline FDA decision
    missingEvidence: >-
      Confirmed timeline for FDA regulatory decision and conditions for U.S. PRIMA approval; U.S. pivotal trial
      (NCT07266584) enrollment and design details.
    whyItMatters: >-
      U.S. regulatory timeline is a critical commercial gate; uncertainty in FDA path directly affects valuation and
      commercialization projections.
    diligencePath: >-
      Review FDA MDUFA timeline for Breakthrough Device class; track ClinicalTrials.gov NCT07266584 enrollment updates;
      monitor FDA 510(k)/PMA correspondence if disclosed.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: legal adverse history pending litigation
    missingEvidence: >-
      Any pending lawsuits, regulatory enforcement actions, IP disputes, or material adverse events related to Science
      Corporation or the PRIMA device.
    whyItMatters: >-
      Novel implantable devices face IP challenges; absence of disclosed litigation does not confirm clean legal status,
      especially given Pixium liquidation transfer.
    diligencePath: >-
      Search PACER federal court records; review Paris Commercial Court proceedings for any residual Pixium IP claims;
      check SEC EDGAR for any related party disclosures.
    relatedQuestionRefs:
      - QO018
  - type: stale
    severity: minor
    topic: pricing commercialization reimbursement
    missingEvidence: Pricing strategy, reimbursement pathway, and payer engagement plan for PRIMA in Europe and the U.S.
    whyItMatters: >-
      Without a reimbursement pathway, commercial uptake will be limited to out-of-pocket pay or specialized centers,
      constraining revenue growth and profitability timeline.
    diligencePath: >-
      Monitor company communications and conference presentations (AAO, Retina Society) for pricing disclosures; review
      CMS reimbursement category applications; track comparable cochlear implant reimbursement as proxy.
    relatedQuestionRefs:
      - QO015
  - type: private-evidence-only
    severity: material
    topic: PRIMA per-patient pricing
    missingEvidence: >
      Science Corporation has not disclosed the anticipated device price or total system cost for PRIMA; the only
      available pricing precedent is the Argus II at $115,000–$150,000 per device with ~$500,000 total treatment cost,
      which resulted in limited insurance coverage.
    whyItMatters: >
      Per-patient pricing is the single most critical variable for payer coverage decisions and commercial viability
      modeling; without it, the reimbursement feasibility analysis is incomplete and all SAM/SOM estimates lack a key
      input.
    diligencePath: >
      Request PRIMA pricing model from Science Corporation during due diligence; review any investor materials
      referencing economic modeling; compare to SYFOVRE and gene therapy pricing precedents in retinal disease.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: blocking
    topic: US Medicare national coverage determination for GA retinal prosthetics
    missingEvidence: >
      No US national coverage determination (NCD) exists for geographic atrophy as a retinal prosthetics indication; no
      public CMS engagement timeline or pending LCD applications specifically for PRIMA or a GA-indication retinal
      prosthesis were identified in this research.
    whyItMatters: >
      Without an NCD or MAC-specific LCD for GA-indication retinal prosthetics, PRIMA's US commercial launch depends on
      case-by-case prior-authorization approvals that are slow, inconsistent, and volume-limiting; this is the primary
      near-term commercial risk.
    diligencePath: >
      Confirm whether Science Corporation has initiated CMS pre-consultation for an NCD or MAC LCD; review all existing
      LCD policies for retinal prosthetics at major MACs (Palmetto GBA, Novitas, WPS) to determine whether existing
      RP-LCDs could be extended to PRIMA for GA.
    relatedQuestionRefs:
      - QM014
  - type: conflicting-data
    severity: material
    topic: validated SAM/SOM for photovoltaic retinal prosthetics
    missingEvidence: >
      No independent analyst estimates exist specifically for next-generation photovoltaic retinal implants like PRIMA;
      all published market sizing covers the legacy retinal implants market (dominated historically by Argus II and
      Retina Implant Alpha AMS), making them poor proxies for PRIMA's potential addressable market.
    whyItMatters: >
      The legacy market data creates a systematic underestimation risk (current market is small because Argus II failed;
      PRIMA targets a different and larger indication) and cannot be used to forecast PRIMA's commercial trajectory
      without substantial adjustment.
    diligencePath: >
      Commission custom analysis of surgical candidacy rates within the GA patient population; model reimbursement ramp
      timelines based on comparable novel implantable device launches; benchmark against cochlear implant market
      development as the closest analogue device class.
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: reimbursement
    missingEvidence: >-
      EU and German reimbursement pathway details for PRIMA post-CE Mark, including NUB (New Diagnostic and Treatment
      Methods) process timeline and expected coverage level in Germany
    whyItMatters: >-
      Germany is stated as Science Corp's first commercial market; the NUB pathway was what enabled Argus II European
      reimbursement, and the absence of confirmed NUB status leaves commercial economics unvalidated
    diligencePath: >-
      Request management disclosure on payer engagement status in Germany; review Argus II NUB filing as structural
      precedent
    relatedQuestionRefs:
      - QP009
      - QP016
  - type: private-evidence-only
    severity: material
