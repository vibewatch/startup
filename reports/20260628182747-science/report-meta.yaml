companyProfile:
  summary: >-
    Science Corporation is a clinical-stage neural engineering company founded
    in July 2021 and headquartered in Alameda, California, by Max Hodak
    (former Neuralink co-founder and president) and Alan Mardinly, PhD (Harvard
    neurobiology PhD, former Neuralink research leader). The company's primary
    near-term commercial vehicle is PRIMA, a photovoltaic subretinal retinal
    prosthesis for advanced geographic atrophy from age-related macular
    degeneration, whose October 2025 NEJM-published PRIMAvera pivotal trial
    showed 80% of participants achieved meaningful visual acuity improvement at
    12 months. Science submitted CE Mark and FDA applications in June 2025 and
    is targeting a 2026 EU commercial launch as the first BCI company to place a
    vision-restoration product on market. The company has raised approximately
    $490 million, including a $230 million oversubscribed Series C at an
    approximately $1.5 billion post-money valuation in March 2026. Beyond PRIMA,
    Science is developing a biohybrid neural-interface architecture, a Science
    Eye optogenetic platform, and operates an in-house MEMS foundry in Research
    Triangle Park, North Carolina.
