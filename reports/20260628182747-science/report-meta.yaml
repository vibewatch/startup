  topStrengths:
    - NEJM-published PRIMAvera pivotal trial showing 80% patient success across 38 patients and 17 sites — the highest-quality clinical evidence ever published for an implantable vision-restoration device.
    - "First-mover commercial position: CE Mark application under review with a potential mid-2026 decision that would make Science Corp the first BCI company to place a product on market anywhere."
    - FDA Breakthrough Device designation plus the April 2026 RAPID Coverage Pathway creates a simultaneous FDA approval and Medicare coverage mechanism, materially reducing the historical post-approval reimbursement gap.
    - Experienced founder-operator team combining Neuralink pedigree (Hodak, Mardinly) with commercial medtech depth (Shahida from Butterfly Network) added ahead of the regulatory endgame.
    - In-house MEMS foundry in Research Triangle Park provides manufacturing differentiation, reduces supply-chain risk, and creates platform optionality not available to any prior retinal prosthetics company.
    - "Well-capitalized ($490M raised, $230M Series C oversubscribed) with stated runway sufficient to reach CE Mark commercial launch without immediate dilution pressure."
  topRisks:
    - All three CE-marked predecessor retinal prosthetics companies — Second Sight (Argus II), Pixium Vision (PRIMA), and Retina Implant AG — achieved regulatory clearance but failed commercially, establishing a 0-for-3 sector base rate.
    - CE Mark decision timing is uncertain under EU MDR; a rejection or RFI extending review beyond Q2 2027 would materially damage the commercial timeline and investor confidence.
    - "Reimbursement infrastructure is absent: Anthem's 2026 policy classifies all artificial retinal devices as investigational; EU country-by-country HTA processes typically take 12–36 months after CE Mark in key markets."
    - Zero revenue and undisclosed cap-table preference stack, convertible note conversion terms, and liquidation waterfall make true investor economics opaque; the $1.5B post-money mark may overstate value to common shareholders.
    - "Key-person concentration in CEO Max Hodak who holds scientific vision, investor relationships, regulatory strategy, and primary public spokesperson roles simultaneously."
    - "Platform distraction: parallel biohybrid neural interface, Science Eye optogenetic program, and foundry buildout divide management attention and capital at a stage requiring concentrated PRIMA execution."
  unresolvedGaps:
    - CE Mark outcome from BSI and timing of German/EU first commercial launch are the single highest-information near-term catalysts; status unconfirmed as of June 2026.
    - Cap-table structure, preference stack depth, participation rights, and liquidation waterfall not publicly disclosed; convertible note conversion mechanics at Series C close remain unknown.
    - US FDA PMA decision pending; RAPID Coverage Pathway engagement timeline with FDA/CMS not publicly confirmed; Breakthrough Device designation from FDA primary record should be independently verified.
    - Pricing and reimbursement terms for EU launch undisclosed; Germany first-market access model, ASP, and procedural reimbursement code availability are critical unknowns.
    - Long-term PRIMA safety and durability data beyond 12 months not yet published; 36-month follow-up and geographic atrophy progression data in implanted vs. fellow eye needed.
    - Headcount (~150) derived from a single analyst estimate; official employee count and organizational structure not publicly disclosed.
