  - id: market-sizing
    title: 'Market Sizing: Multiple Lenses and Contradictory Estimates'
    body: |
      Market sizing estimates for retinal prosthetics vary dramatically by perimeter, methodology,
      and analyst, making a single TAM figure misleading. Mordor Intelligence, using a narrow
      definition focused on active device units, values the global retinal implants market at
      $56.53 million in 2025, growing to $61.28 million in 2026 and $91.72 million by 2031 at
      an 8.4% CAGR. Insight Partners, using a broader retinal prosthetics perimeter that includes
      legacy devices, reports $392.53 million in 2025 growing to $922.5 million by 2034 at 11.27%
      CAGR — a 7× discrepancy for ostensibly the same market and year. Neither analyst publicly
      discloses the precise scope differences, and the inconsistency should be treated as a
      limitation of all published retinal prosthetics market estimates.

      For context, the AMD pharmacological market (anti-VEGF drugs, complement inhibitors) was
      $12.64 billion in 2025 and projected at $13.58 billion in 2026, roughly 200× larger than
      even the broadest retinal implant estimate. The broader BCI market overall (Grand View
      Research: $397.59M non-invasive SOM, $168.27B invasive TAM) encompasses far more than
      vision applications and should not be used as a PRIMA proxy. A rough bottom-up patient-
      population SAM for PRIMA, based on ~1M US GA patients at a 2–5% near-term surgical adoption
      rate and a $50,000–$100,000 per-system average selling price, yields a potential US ceiling
      SAM of $1B–$5B — but this is a far-future ceiling with no near-term commercial relevance
      given the nascent reimbursement environment and the 3–5 year post-approval ramp required.
      The contradictions in published estimates and the absence of validated PRIMA-specific sizing
      represent a material evidence gap that diligence should surface.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
