        - label: TAM — Global Retinal Prosthetics & Visual BCIs
          value: '$400M–$1B (2026)'
          description: >
            Analyst range: $56M (narrow, Mordor) to $923M (broad, Insight Partners) for retinal
            prosthetics; broader BCI market is $2.7B+ but encompasses non-vision applications
        - label: SAM — US + EU Advanced GA & IRD Surgical Candidates
          value: '$60M–$200M (near-term buildout)'
          description: >
            Patient-based estimate: ~1M US GA + ~190K US IRD patients × surgical candidacy rate
            × estimated $50K–$100K per-system ASP; subject to reimbursement ramp and candidacy
            narrowing
        - label: SOM — Years 1–5 Post-Approval
