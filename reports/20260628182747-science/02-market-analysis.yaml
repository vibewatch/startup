  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for PRIMA
      - Diligence Ask
    rows:
      - - No approved vision-restoring therapy for advanced GA
        - Strong positive driver
        - Current
        - Clinical comparator is natural history; uniquely favorable competitive position
        - Confirm no pipeline GA therapy crosses efficacy threshold before PRIMA approval
      - - Aging US / EU population expanding GA prevalence
        - Positive driver
        - Current and long-term
        - Structurally growing addressable population; prevalence rises sharply after age 65
        - Track Census / Eurostat aging cohort projections against GA incidence models
      - - GA progression relentless within 2–3 years of diagnosis
        - Positive driver
        - Current
        - Clinical urgency and patient motivation; strengthens market pull once reimbursed
        - Verify referral pathway speed; how long from GA diagnosis to implant candidacy
      - - No US national coverage determination for GA-indication retinal prosthetics
        - Binding constraint
        - Near-term (0–3 years)
        - Limits commercial launch to self-pay or pilot programs until CMS NCD is issued
        - Confirm CMS engagement timeline; assess MAC LCD feasibility as interim path
      - - EU HTAR joint clinical assessments required for Class III devices (2026+)
        - Constraint
        - Medium-term (1–4 years)
        - Adds EU HTA evidence burden; national coverage decisions delayed by JCA process
        - Engage EU HTA bodies early; plan JCA-grade comparative evidence generation
      - - Second Sight / Argus II patient-abandonment precedent
        - Negative constraint
        - Historical / ongoing
        - Erodes patient and payer trust; requires explicit Science post-market device support plan
        - Confirm Science long-term device support commitments and financial reserves for support
      - - Subretinal implant requires specialist surgeon training; concentrates at academic centers
        - Constraint
        - Near-to-medium term
        - Limits rollout velocity; academic center capacity is finite; community expansion slow
        - Map specialized surgical center capacity in US and EU; assess training program scalability
      - - Anti-VEGF market inertia in retina specialist workflow
        - Mild constraint
        - Ongoing
        - Retina specialists comfortable with injections; GA patient referral for surgery is new behavior
        - Assess referral pattern studies; confirm retina specialist openness to surgical referral for GA
      - - Capital intensity of retinal implant surgical centers
        - Constraint
        - Near-term
        - Initial capital outlay for imaging, surgery suite, AI processing hardware deters low-volume
          centers
        - Determine initial capital requirement per center and time-to-breakeven for site adoption
    notes: >
      Timing classifications: current = applies today; near-term = 0–3 years; medium-term = 2–5 years.
      Direction assessments are author's qualitative judgment based on collected evidence. Diligence
      asks are forward-looking and not answered by current evidence.
