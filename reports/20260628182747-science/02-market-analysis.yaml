chapter:
  number: 2
  title: Market Analysis
  summary: >
    Science Corporation's PRIMA targets a precisely bounded, high-urgency market:
    approximately 1 million US patients (5–8 million globally) with advanced geographic
    atrophy from AMD plus roughly 190,000 US patients with end-stage inherited retinal
    diseases (RP, Stargardt), none of whom have an approved vision-restoring therapy.
    Analyst estimates for the addressable surgical implant market range wildly — from
    $56.5M (Mordor Intelligence, narrow definition) to $392.5M (Insight Partners,
    broad perimeter) in 2025 — reflecting incompatible definitions rather than genuine
    market uncertainty. Reimbursement is the central unresolved commercial risk: no US
    national coverage determination exists for GA-indication retinal prosthetics, and
    CE Mark in Europe does not confer reimbursement. The Second Sight Argus II precedent
    — 350+ abandoned patients, limited insurance coverage, and commercial failure —
    remains the strongest adverse signal for the market even as Science's clinical
    evidence improves.

sections:
  - id: market-boundaries
    title: Market Boundaries and Definition
    body: |
      Science Corporation's PRIMA system addresses a precisely bounded market distinct from the
      broader ophthalmology, AMD pharmacological, and general BCI landscapes. The included spend is
      the surgical device system for restoring visual function in end-stage degenerative retinal
      disease — specifically photovoltaic subretinal implants, associated external hardware, and
      implantation procedures. Excluded is the pharmacological AMD treatment market (anti-VEGF
      injections, complement inhibitors, AREDS supplements), optical correction, low-vision aids,
      gene therapies, and cortical visual prostheses that bypass the retina entirely.

      The status-quo comparator for advanced geographic atrophy is watchful monitoring with no
      restorative option: no pharmacological therapy currently restores central vision lost to GA,
      making PRIMA's clinical comparator natural history rather than a competing drug. Wet AMD
      pharmacological treatment (anti-VEGF) is adjacent but orthogonal — anti-VEGF injections
      generate more than 6 million US procedures annually but target a fundamentally different
      disease stage and mechanism, and patients who progress to end-stage GA are beyond the benefit
      window of anti-VEGF. PRIMA's closest adjacencies are other retinal implant approaches
      targeting RP and Stargardt, emerging gene therapies for inherited retinal diseases, and
      cortical visual prostheses for patients with damaged retinal-optic pathways. The larger
      BCI neuroprosthetics TAM ($168.27B invasive BCI TAM per Grand View Research) inflates
      addressable market narratives and should be excluded from PRIMA-specific sizing, as it
      encompasses motor-function BCIs, communication devices, neuromodulation, and other
      non-ophthalmological applications. The AMD drug market ($12.64B in 2025) should similarly
      be treated as context, not PRIMA's market, since it targets a different disease stage.
    claimRefs:
      - CM025
      - CM043
      - CM024
      - CM038
      - CM040
    tableRefs:
      - TM001
    figureRefs: []

  - id: disease-burden-and-population
    title: Disease Burden and Addressable Patient Population
    body: |
      The primary target indication for PRIMA is advanced geographic atrophy (GA) secondary to
      age-related macular degeneration (AMD). Approximately 1 million patients in the United States
      and 5–8 million globally live with GA, with 160,000 new US cases annually. GA
      disproportionately affects older adults: prevalence is 0.28% at ages 60–64 but rises to
      0.98% at ages 70–74, and global AMD prevalence is projected to reach 288 million by 2050
      as populations age. In the four largest European markets alone — Germany (400,000–450,000),
      France (265,000), Italy (170,000), and Spain (155,000) — GA affects over 1 million
      additional patients, constituting a significant European commercial opportunity if
      reimbursement can be secured.

      Beyond GA, Science has expanded PRIMA clinical development into inherited retinal diseases
      (IRDs). Retinitis pigmentosa affects approximately 1 in 4,000 individuals worldwide, with
      80,000–110,000 patients in the US; roughly 12% develop advanced disease with severe vision
      loss (counting fingers or hand motion only), representing the implant-candidacy tier. Stargardt
      disease, the most common juvenile macular dystrophy, affects approximately 1 in 8,000–10,000
      individuals globally, with earlier onset creating a distinct and younger surgical-candidate
      demographic. Combined, the three primary indications yield a US patient pool of approximately
      1.2 million with end-stage retinal degeneration — but surgical candidacy requirements,
      including residual retinal function, intact bipolar-cell layer, and health thresholds for
      surgery, narrow the implantable population considerably below these epidemiological totals.
      GA accounts for approximately 20% of all AMD-related legal blindness, underscoring the
      severity tier PRIMA addresses.
