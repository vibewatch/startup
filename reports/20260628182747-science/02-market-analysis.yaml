      Steps 3–5 are author estimates based on published surgical-candidacy thresholds, center-
      capacity proxies from ophthalmic surgery data, and reimbursement precedent from Argus II
      adoption. All intermediate figures are speculative and should be validated with Science
      Corporation's clinical development data.
    claimRefs:
      - CM028
      - CM030
      - CM016

callouts:
  - calloutType: risk
    title: Reimbursement Gap Is the Binding Commercial Constraint
    body: >
      No US national coverage determination exists for geographic atrophy as a retinal prosthetics
      indication, and CE Mark in Europe does not confer reimbursement. The Second Sight Argus II
      failure, driven in part by limited and inconsistent payer coverage, remains the primary adverse
      market precedent. Science's ability to secure favourable CMS LCDs and EU HTA decisions will
      determine whether PRIMA achieves sustainable commercial uptake or repeats the Argus II pattern
      of clinical success without market success.
    claimRefs:
      - CM014
      - CM016
      - CM026
      - CM027

