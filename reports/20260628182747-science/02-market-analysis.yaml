  - id: buyer-payer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: |
      Science's PRIMA system involves three distinct market roles. The buyer — in the procedural
      sense — is the retina surgeon or specialized ophthalmic center that selects the technology,
      trains on its implantation, and integrates it into the clinical workflow. The user is the
      patient with advanced GA, RP, or Stargardt. The payer is Medicare, private insurance, or a
      national health service. Budget ownership for initial capital expenditure sits with the
      hospital or surgical center, while per-patient reimbursement — once established — flows
      from payers.

      In the US, advanced GA predominantly affects the Medicare-eligible population (age 65+),
      making Medicare the dominant payer. RP and Stargardt patients are younger and rely on
      commercial insurance or, in some cases, Medicaid, with some rare-disease pathways potentially
      relevant for IRD indications. Hospitals account for 54.5% of the global retinal implants end-
      user market in 2025 (Mordor Intelligence), with specialty ophthalmic clinics growing at 11.42%
      CAGR. North America holds 39.75% global market share. RP accounts for 46.95% of the current
      retinal implants market by disease indication — a signal of what is currently commercially
      viable, not necessarily a ceiling. Geographic concentration of procedure capacity matters:
      subretinal implantation requires retina surgeons with specific training, concentrating initial
      adoption at academic medical centers, which limits volume in the early commercial phase.
