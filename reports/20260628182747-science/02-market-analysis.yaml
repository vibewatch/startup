  - id: growth-drivers-and-constraints
    title: Growth Drivers and Adoption Constraints
    body: |
      The principal market driver for PRIMA is the absence of any approved vision-restoring therapy
      for advanced GA: the clinical comparator is natural history, and any degree of functional
      restoration represents a meaningful advance for patients. Aging demographics structurally
      expand the eligible pool as AMD is strongly age-related. GA progression is relentless — a
      majority of diagnosed patients lose substantial vision within 2–3 years — creating clinical
      urgency that drives patient motivation if a safe and reimbursed option exists. Regulatory
      tailwinds include the FDA's Breakthrough Device Designation pathway reducing review cycles
      for visual prosthetics, and cost-of-illness analyses estimating $13.5–$32 billion annual
      burden of inherited retinal diseases in North America that support payer economic cases.
      Tele-ophthalmology is expanding the geographic reach of retinal implant candidate screening
      beyond major centers.

      However, material adoption constraints are real. Subretinal implantation is a complex
      specialized surgery requiring centers with trained retina surgeons, concentrating
      procedures at academic settings and throttling community roll-out. The Second Sight Argus II
      failure — in which more than 350 patients were abandoned with obsolete unsupported implants
      after Second Sight's financial collapse — set a damaging precedent for the retinal prosthetics
      market. Argus II was priced at $115,000–$150,000 per device with total treatment costs
      near $500,000 per patient; limited insurance coverage contributed to its commercial failure.
      The spectre of inadequate post-market device support from a startup remains salient for
      both patients and payers evaluating a novel retinal implant. Capital intensity in surgical
      settings, surgical learning curves, and the absence of established reimbursement codes for
      GA-indication implants compound near-term uptake constraints.
