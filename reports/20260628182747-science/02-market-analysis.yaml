  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: PRIMA per-patient pricing
      missingEvidence: >
        Science Corporation has not disclosed the anticipated device price or total system cost
        for PRIMA; the only available pricing precedent is the Argus II at $115,000–$150,000 per
        device with ~$500,000 total treatment cost, which resulted in limited insurance coverage.
      whyItMatters: >
        Per-patient pricing is the single most critical variable for payer coverage decisions and
        commercial viability modeling; without it, the reimbursement feasibility analysis is
        incomplete and all SAM/SOM estimates lack a key input.
      diligencePath: >
        Request PRIMA pricing model from Science Corporation during due diligence; review any
        investor materials referencing economic modeling; compare to SYFOVRE and gene therapy
        pricing precedents in retinal disease.
      relatedQuestionRefs:
        - QM025

    - type: missing-source
      severity: blocking
      topic: US Medicare national coverage determination for GA retinal prosthetics
      missingEvidence: >
        No US national coverage determination (NCD) exists for geographic atrophy as a retinal
        prosthetics indication; no public CMS engagement timeline or pending LCD applications
        specifically for PRIMA or a GA-indication retinal prosthesis were identified in this research.
      whyItMatters: >
        Without an NCD or MAC-specific LCD for GA-indication retinal prosthetics, PRIMA's US
        commercial launch depends on case-by-case prior-authorization approvals that are slow,
        inconsistent, and volume-limiting; this is the primary near-term commercial risk.
      diligencePath: >
        Confirm whether Science Corporation has initiated CMS pre-consultation for an NCD or MAC
        LCD; review all existing LCD policies for retinal prosthetics at major MACs (Palmetto GBA,
        Novitas, WPS) to determine whether existing RP-LCDs could be extended to PRIMA for GA.
      relatedQuestionRefs:
        - QM014

    - type: conflicting-data
      severity: material
      topic: validated SAM/SOM for photovoltaic retinal prosthetics
      missingEvidence: >
        No independent analyst estimates exist specifically for next-generation photovoltaic retinal
        implants like PRIMA; all published market sizing covers the legacy retinal implants market
        (dominated historically by Argus II and Retina Implant Alpha AMS), making them poor proxies
        for PRIMA's potential addressable market.
      whyItMatters: >
        The legacy market data creates a systematic underestimation risk (current market is small
        because Argus II failed; PRIMA targets a different and larger indication) and cannot be
        used to forecast PRIMA's commercial trajectory without substantial adjustment.
      diligencePath: >
        Commission custom analysis of surgical candidacy rates within the GA patient population;
        model reimbursement ramp timelines based on comparable novel implantable device launches;
        benchmark against cochlear implant market development as the closest analogue device class.
      relatedTableRefs:
        - TM002
