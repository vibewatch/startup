  - id: reimbursement-landscape
    title: 'Reimbursement Landscape: US and Europe'
    body: |
      Reimbursement is the central commercial risk for PRIMA in both the US and Europe. In the
      United States, CPT code 67027 covers implantation of an intraocular retinal prosthesis, and
      Medicare has issued local coverage determinations for retinal prosthetics in end-stage
      retinitis pigmentosa. However, no national coverage determination exists for geographic atrophy
      as a retinal prosthetics indication — PRIMA's primary target — meaning initial coverage will
      depend on MAC-specific LCD decisions and case-by-case prior-authorization requests. CMS's
      2026 Physician Fee Schedule set the non-APM participant conversion factor at $33.40/RVU, but
      payment cuts for facility-based procedures at ambulatory surgical centers reduce procedural
      economics for implant programs that rely on hospital-based infrastructure.

      The Argus II precedent — $115,000–$150,000 per device, total per-patient costs near $500,000,
      and highly variable insurance coverage — demonstrates the commercial fragility of retinal
      implants with unresolved payer pathways. Science must demonstrate a sustainable device-plus-
      procedure economics model that payers can accommodate before wide commercial adoption is
      possible. In Europe, CE Mark is a prerequisite for market entry but does not confer
      reimbursement. The EU Health Technology Assessment Regulation (EU 2021/2282), entering
      phased implementation in January 2025, mandates joint clinical assessments for Class IIb
      and III devices including retinal prosthetics beginning in 2026, adding a pan-European
      evidence requirement before national HTA bodies render coverage decisions. Each EU member
      state independently determines coverage; France's HAS, Germany's G-BA, and the UK's NICE
      have historically been conservative on novel implantable devices with limited long-term
      outcome data. PRIMA's Science-filed CE Mark application (circa late 2024 / early 2025)
      is a necessary but insufficient condition for European commercial success.
