callouts:
  - calloutType: risk
    title: "Zero Commercial Customers and a Multi-Gated Revenue Path"
    body: >
      Science Corporation has no revenue-generating commercial customers as of
      June 2026. All current 'customer' relationships — trial sites, patient registry
      participants, and the Neurosoft ecosystem deal — are pre-commercial. Converting
      any of these into paying relationships requires CE mark approval, FDA clearance,
      reimbursement code assignment, hospital contracting, and patient out-of-pocket
      or insurer coverage. Each gate is independent and uncertain; a delay at any
      single gate blocks the entire commercial chain. The company's valuation of
      approximately $1.5 billion rests entirely on the expectation that these gates
      will clear — not on demonstrated customer economics.
    claimRefs: [CU001, CU023, CU025, CU040]

  - calloutType: risk
    title: "Elite-Center Concentration Creates a Structural Patient Access Bottleneck"
    body: >
      PRIMA's surgical and rehabilitation requirements confine near-term patients
      to a narrow set of elite academic vitreoretinal centers. In the PRIMAvera
      trial, only 17 European sites and one US center qualified. Even after commercial
      launch, access will be constrained by the availability of certified surgical
      centers and multi-month post-implant rehabilitation programs — not by patient
      demand or device supply. This center-of-excellence bottleneck is likely to
      persist for years and represents a durable ceiling on early commercial volume.
    claimRefs: [CU033, CU017, CU034]

