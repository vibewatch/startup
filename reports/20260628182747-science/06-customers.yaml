figures:
  - id: FU001
    title: PRIMA Patient Customer Journey Map — From Diagnosis to Long-term Vision Use
    type: journey-map
    layout: wide
    summary: >
      Six-stage journey illustrating the sequential steps a patient with advanced
      dry AMD traverses from initial diagnosis through surgical implantation to
      long-term device use, with Science Corp touchpoints and adoption barriers
      at each stage.
    data:
      items:
        - label: "Stage 1: Disease Onset & Ophthalmologist Diagnosis"
          description: >
            Patient develops advanced dry AMD / geographic atrophy; BCVA deteriorates
            to ≤20/400; central scotoma confirmed; registered as legally blind.
            Science touchpoint: none at this stage — patient remains in routine
            ophthalmology care.
        - label: "Stage 2: Patient Registry Enrollment"
          description: >
            Patient or caregiver learns about PRIMA and joins Science Corp patient
            registry; baseline functional metrics (reading, face recognition, mobility)
            captured; priority access to clinical trials assigned.
        - label: "Stage 3: Eligibility Screening & Surgical Assessment"
          description: >
            Vitreoretinal surgeon at certified PRIMA center reviews OCT imaging,
            microperimetry, and systemic health status; candidate must be ≥60 years,
            have confirmed central scotoma, and retain peripheral vision in the
            fellow eye. Narrow eligibility funnel screens out most AMD patients.
        - label: "Stage 4: Surgical Implantation at Certified Center"
          description: >
            Trained vitreoretinal surgeon inserts 2×2 mm PRIMA chip into subretinal
            space under local anaesthesia in <2 hours; procedure uses standard
            vitreoretinal toolkit with specialized subretinal delivery technique.
            Restricted to 18 active clinical partnership sites globally.
        - label: "Stage 5: Activation, Glasses Fitting & Rehabilitation"
          description: >
            4–6 weeks post-surgery, PRIMA chip activated; patient fitted with
            augmented-reality glasses (camera + AI processor); months of intensive
            visual rehabilitation training to interpret infrared-projected signals;
            brain learns to fuse prosthetic and peripheral natural vision.
        - label: "Stage 6: Long-term Device Use & Follow-up"
          description: >
            Patient uses PRIMA system at home for reading, face recognition, and
            navigation; scheduled follow-up visits continue; device durability and
            atrophy progression monitored; access to next-generation PRIMA upgrades
            via registry priority pathway.
    claimRefs: [CU014, CU015, CU016, CU017]

  - id: FU002
    title: PRIMA Patient Adoption Funnel — Disease Burden to Trial Completion
    type: funnel
    layout: standard
    summary: >
      Funnel showing progressive narrowing from global advanced dry AMD prevalence
      through eligibility criteria, trial enrollment, follow-up completion, and
      primary endpoint achievement in the PRIMAvera trial.
    data:
      items:
        - label: "Global end-stage atrophic AMD population (approx.)"
          value: 5000000
          note: "~5M worldwide with advanced geographic atrophy; no approved vision-restoring therapy (Science Corp, patient registry announcement)"
        - label: "Estimated PRIMA-eligible patients (advanced GA, ≥60 yrs, BCVA ≤20/400)"
          value: 500000
          note: "Rough estimate; formal eligibility prevalence study not published; narrow central scotoma and fellow-eye vision criteria further restrict the pool"
        - label: "Screened or assessed across all trial sites (PRIMAvera + feasibility)"
          value: 60
          note: "Approximate; screening-to-enrollment ratio not published; estimated from site count and trial enrollment"
        - label: "PRIMAvera trial enrolled (17 EU sites, NCT04676854)"
          value: 38
          note: "Confirmed enrollment per ClinicalTrials.gov and NEJM Oct 2025"
        - label: "Completed 12-month primary follow-up"
          value: 32
          note: "32 of 38 completed 12-month assessment per NEJM Oct 2025"
        - label: "Achieved primary endpoint (≥5-letter ETDRS gain)"
          value: 26
          note: "26 of 32 (81%) achieved meaningful visual acuity improvement per NEJM"
    approximationNotes: >
      Global AMD prevalence and eligible-patient estimates are derived from Science
      Corp's patient registry announcement and general population figures; formal
      PRIMA-specific epidemiology not published. Screened patient count is estimated.
      Trial enrollment and endpoint data are per NEJM Oct 2025.
    claimRefs: [CU003, CU004, CU010, CU014]

