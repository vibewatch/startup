artifact: customers
slug: science
runDate: "2026-06-28"
company:
  name: Science Corporation
chapter:
  number: 6
  title: Customers
  summary: >
    Science Corporation has no revenue-generating commercial customers as of June 2026;
    its "customer" universe consists of 38 enrolled clinical trial patients across 17
    European sites, a nascent patient registry covering AMD/RP/Stargardt disease,
    one named foundry ecosystem partner (Neurosoft Bioelectronics), and the 18 clinical
    partnership sites collectively building toward a post-CE-mark commercial launch.
    Customer acquisition is gated by regulatory approval, reimbursement pathways that do
    not yet exist, and a demanding surgical and rehabilitation infrastructure concentrated
    in elite academic vitreoretinal centers.

sections:
  - id: intro-customer-landscape
    title: "Pre-Commercial Landscape: Defining Science Corporation's Customer Universe"
    body: >
      Science Corporation occupies a fully pre-commercial position as of June 2026.
      The company has no paying customers in the conventional sense; every current
      user of the PRIMA retinal implant system is a clinical trial participant, a
      patient in a compassionate-access or registry context, or a business partner
      in a pre-revenue arrangement. This is not unusual for clinical-stage medtech
      companies, but it is critical context for any commercial assessment: all
      demand signals today are prospective and contingent on regulatory outcomes
      that remain unresolved. The customer landscape can be segmented into four
      distinct roles: (1) patients with advanced geographic atrophy due to AMD, or
      inherited retinal degeneration, who are eligible for implantation; (2) the
      implanting vitreoretinal surgeons and academic hospital systems that operate
      as clinical gatekeepers and eventual commercial purchasers; (3) patient
      advocacy organizations and registries that aggregate and channel patient
      demand; and (4) foundry ecosystem partners — early-stage BCI companies that
      license Science's neural engineering platform. Each segment has a different
      procurement pathway, different evidence of traction, and a different timeline
      to revenue. The customer segmentation table below maps these dimensions in
      full, and the customer journey map illustrates the sequential stages a patient
      traverses from disease onset to long-term device use, highlighting where
      Science must deliver commercial infrastructure before it can convert patient
      demand into revenue.
    claimRefs: [CU001, CU009, CU010, CU013, CU025, CU040]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: clinical-trial-sites
    title: "Trial Sites and Implanting Physicians as Gateway Customers"
    body: >
      The 17 European clinical trial sites that participated in the PRIMAvera trial
      (NCT04676854) represent the most developed layer of Science's early customer
      network. These sites — spanning France, Germany, Italy, the Netherlands, and
      the United Kingdom — collectively enrolled 38 patients aged 60 or older with
      advanced dry AMD and geographic atrophy. The lead investigator was Dr. Frank
      Holz of the University Hospital Bonn, who co-authored the pivotal NEJM
      publication in October 2025. In the UK, Moorfields Eye Hospital served as
      the sole trial site, enrolling five patients under the direction of Dr. Mahi
      Muqit, senior vitreoretinal consultant at Moorfields and the Institute of
      Ophthalmology at UCL. Dr. Muqit described the PRIMA chip operation as safely
      performable "by any trained vitreoretinal surgeon in under two hours," a
      deliberate positioning designed to support broad clinical scalability. In the
      United States, the University of Pittsburgh Medical Center (UPMC) Vision
      Institute led by Dr. José-Alain Sahel was the first US center to implant PRIMA
      in a clinical feasibility study, positioning UPMC as the anchor US commercial
      site for any FDA-cleared launch. Science Corporation reports a total of 18
      clinical partnerships established as of its patient registry announcement, a
      number that encompasses the PRIMAvera European sites and the expanding US
      feasibility network. These trial sites will likely serve as the initial
      commercial customers upon regulatory approval, transitioning from investigator-
      sponsored trial roles to device-purchasing hospital departments — provided
      reimbursement infrastructure exists at the time of launch.
    claimRefs: [CU002, CU006, CU007, CU008, CU013, CU017, CU018, CU044]
    tableRefs: [TU002, TU003]

  - id: patient-registry-demand
    title: "Patient Registry and Advocacy: Channeling Latent Demand"
    body: >
      Science Corporation launched a formal patient registry in 2025-2026 covering
      individuals diagnosed with age-related macular degeneration, retinitis pigmentosa,
      and Stargardt disease. This registry serves multiple commercial functions
      simultaneously: it generates a qualified pipeline of future PRIMA patients,
      informs clinical trial design for expanded indications, and creates a direct
      communication channel between the company and the patient community.
      Participation is free, privacy-respecting, and reversible, with participants
      retaining full data control. The registry tracks not only traditional clinical
      metrics such as best-corrected visual acuity but also functional outcomes —
      reading ability, face recognition, and navigation — that Science has identified
      as the most meaningful indicators of patient benefit. Registry participants
      receive priority access to future clinical trials and emerging device generations.
      Science Corp states that approximately five million people worldwide are affected
      by end-stage atrophic AMD for which no vision-restoring therapy currently exists,
      representing the primary addressable patient pool. The eligibility threshold is
      strict: patients must be 60 years or older, have advanced dry AMD with geographic
      atrophy, and present with best-corrected visual acuity of 20/400 or worse in the
      study eye, with a confirmed central scotoma. This narrow eligibility funnel,
      combined with the need for retained peripheral vision and absence of other
      confounding ocular conditions, is expected to yield a substantially smaller
      commercial-ready population than the headline AMD figure suggests. Patient
      advocacy organizations have been engaged; the Macular Society (UK) described
      the PRIMA results as "encouraging" and stated it was watching closely for UK
      regulatory approval and potential NHS availability.
    claimRefs: [CU003, CU009, CU010, CU011, CU012, CU014, CU035, CU037, CU038]
    figureRefs: [FU002]

  - id: commercial-pathway
    title: "Commercial Adoption Pathway: Regulatory Gates and Reimbursement Gaps"
    body: >
      Science Corporation submitted its CE mark application for PRIMA to the
      European Union and its IDE/PMA-equivalent to the FDA concurrently, as
      confirmed in the company's own patient registry announcement in June 2026.
      Industry analysts and news coverage consistently identify Germany as the
      anticipated first commercial market, given its regulatory framework for new
      devices and historical precedent for early-access neurotechnology approvals.
      CE mark approval was widely anticipated by mid-2026, though no approval had
      been publicly announced as of the reporting date. In the UK, Dr. Muqit
      confirmed a likely additional approval timeline of one to two years post-CE
      mark, requiring sequential approvals from MHRA, NICE health technology
      assessment, and NHS England commissioning — a three-stage gatekeeping process
      typical for high-cost implantable devices. The US pathway is longer still:
      PRIMA carries an FDA Breakthrough Device designation (inherited from the Pixium
      acquisition), which accelerates review but does not bypass the full PMA pathway.
      Critically, as of June 2026, no US Medicare reimbursement code, national
      coverage determination, or local coverage policy exists for PRIMA. The American
      Society of Retina Specialists' review of 2026 Medicare payment proposals did not
      identify a specific code for the PRIMA system; new implantable devices typically
      require an FDA clearance event followed by CPT/HCPCS code assignment and
      subsequent CMS review before any covered clinical use begins. This sequence
      creates a potential multi-year gap between US regulatory clearance and actual
      reimbursed commercial deployment.
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: foundry-ecosystem
    title: "Foundry Ecosystem: B2B Customers of the Science BCI Platform"
    body: >
      Science Corporation announced on February 20, 2026, a multi-year BCI Ecosystem
      partnership with Neurosoft Bioelectronics, a Geneva-based neural data company
      that develops ultra-soft cortical probes for tinnitus, epilepsy, and other
      neurological disorders. Neurosoft's probes had already been deployed in a dozen
      human patients prior to the partnership announcement. Under the Science Ecosystem
      model, partners gain access to Science's complete clinical-grade neural recording
      technology stack — including recording electronics, neural probes, software, and
      application tooling — for a fraction of the cost of developing equivalent
      infrastructure independently. Science estimates that building a full-stack
      clinical-grade BCI platform from scratch costs $75 million to $100 million and
      takes multiple years; the Ecosystem partnership enables first-in-human trials
      for under $5 million in a fraction of the time. Max Hodak, Science CEO, described
      the Neurosoft deal as "the first of many" expected partnerships, positioning the
      Science Ecosystem as a platform business model analogous to foundry services in
      the semiconductor industry. These ecosystem partners are a distinct B2B customer
      category from the patient/hospital channel: they purchase access to Science's
      engineering infrastructure rather than the PRIMA device itself, and they target
      neurological indications beyond Science's in-house programs. The revenue model
      for ecosystem deals involves multi-year, multi-million-dollar contracts, though
      specific financial terms have not been disclosed. The customer proof matrix below
      provides an evidence-quality comparison across all four customer segments.
    claimRefs: [CU025, CU026, CU027, CU028, CU029]
    figureRefs: [FU003]

  - id: adoption-barriers
    title: "Adoption Barriers, Adverse Evidence, and Concentration Risk"
    body: >
      Several structural barriers temper the optimistic demand narrative. First and most
      significantly, PRIMA generates zero revenue as of June 2026: all "customers" are
      clinical trial participants or pre-revenue partners, and no commercial transaction
      has occurred. Second, the device's adverse event profile warrants scrutiny: in
      the PRIMAvera trial, 26 serious adverse events occurred across 19 of 38 patients
      (50% SAE incidence at the patient level), including retinal tears, increased
      intraocular pressure, retinal detachment, and proliferative vitreoretinopathy.
      While 95% of these events resolved within two months, the treated eyes also showed
      a larger increase in geographic atrophy area compared to untreated control eyes,
      raising unresolved questions about device-related acceleration of the underlying
      disease. Third, the near-term commercial footprint is narrowly concentrated at
      elite academic vitreoretinal centers. The PRIMAvera trial required 17 specialized
      European sites and one US center; not all vitreoretinal surgeons have the
      subretinal implantation skills and post-operative rehabilitation infrastructure
      required. Broad geographic access is therefore structurally limited by training
      and center certification requirements, creating a bottleneck that persists even
      after regulatory approval. Fourth, Science's patient eligibility criteria are
      narrow: candidates must be 60 or older with complete central vision loss and must
      retain residual peripheral vision — a profile that screens out many AMD patients.
      Fifth, the entire US commercial path is stalled until both FDA clearance and
      Medicare reimbursement are secured, a sequence that may extend well beyond the
      CE-mark timeline in Europe. These barriers collectively mean that Science's
      commercial ramp, even in an optimistic scenario, will be slow, dependent on
      a handful of specialist centers, and initially confined to single-country European
      markets with the most favorable reimbursement environments.
    claimRefs: [CU001, CU023, CU030, CU031, CU032, CU033, CU034, CU035, CU041, CU042]
    tableRefs: [TU005]

