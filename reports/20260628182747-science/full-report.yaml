      - number: '7.5'
        title: Strategic Concentration, Key-Person, and Platform Distraction Risk
        blocks:
          - type: paragraph
            body: >
              Science Corporation operates four distinct program areas — PRIMA retinal implant, biohybrid neuroscience,
              hardware foundry, and Vessel (wearable BCI hub) — with approximately 150 employees as of March 2026. PRIMA
              is the sole program with clinical data and a near-term revenue path; all other programs are pre-clinical
              or pre-revenue. This concentration means that regulatory delay, clinical setback, or commercial failure in
              PRIMA would eliminate the primary revenue thesis without an alternative near-term fallback. Max Hodak,
              co-founder of Neuralink and CEO of Science Corp, is the company's primary public face and chief strategic
              architect. TIME Magazine named Hodak to its 2026 TIME100 Health list, underscoring his profile — but
              public succession plans and key-person insurance arrangements have not been disclosed. The departure of
              Hodak or Chief Scientific Advisor Jacques-Alain Sahel (one of the world's leading retinal prosthetics
              researchers and a co-author on key PRIMA clinical papers) would likely impair regulatory credibility,
              clinical network access, and investor confidence. The biohybrid brain sensor program targets
              first-in-human implantation before 2027, per comments from Yale collaborator Murat Günel; while
              scientifically compelling, this program requires dedicated engineering and clinical trial infrastructure
              that competes with PRIMA development for talent and management attention. Science Corp's $490M total
              funding and estimated $20-30M annual burn rate imply a 7-8 year runway — sufficient for a 3-year
              regulatory timeline — but capital intensity of commercialization, including surgeon training programs,
              post-market surveillance infrastructure, and US facility build-out, may compress this estimate. The Vessel
              platform adds a fourth regulatory and commercial pathway that further dilutes organizational focus at a
              stage when PRIMA urgently requires concentrated execution.
