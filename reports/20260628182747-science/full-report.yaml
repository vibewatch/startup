      - number: '7.4'
        title: Manufacturing, Operational, and Quality Systems Risk
        blocks:
          - type: paragraph
            body: >
              Science Corporation is building a manufacturing facility in Durham, North Carolina with a $65 million
              investment announced in 2024, targeting 150+ new jobs in life-sciences manufacturing. The PRIMA chip is a
              photovoltaic CMOS/MEMS device whose fabrication relies on semiconductor foundry processes; Science's
              in-house foundry business (offering custom chip manufacturing to external BCI clients) serves dual roles
              as both a revenue diversification vehicle and the primary manufacturing platform for PRIMA arrays. The 21
              CFR Part 820 Quality System Regulation and its international counterpart ISO 13485:2016 require
              comprehensive design controls, process validation records, and corrective-action systems for implantable
              device manufacturers. Science's CE mark submission reportedly includes approximately 60 gigabytes of
              quality system documentation, suggesting an advanced quality management posture — but no public
              confirmation of ISO 13485 certification for the Durham facility has been identified in research conducted
              for this chapter. A manufacturing non-conformance finding during a pre-approval inspection could trigger a
              production hold or require a PMA supplement, potentially delaying commercial launch by 12-24 months.
              Supply chain concentration in the CMOS/MEMS fabrication supply chain — particularly for the specialty
              photovoltaic pixel processes that distinguish PRIMA from standard CMOS — represents an additional
              operational risk not fully mitigated by the in-house foundry capability. The hardware foundry's external
              client business may also compete for fab capacity and engineering talent during the critical PRIMA
              commercial ramp period.
