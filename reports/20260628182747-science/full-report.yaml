        - label: Clinical proof
          value: Strong
          trend: stable
          note: >-
            NEJM publication, 84% success across 47 patients; best published data for any implantable vision-restoration
            device
        - label: Regulatory momentum
          value: Advanced
          trend: growth
          note: CE Mark submitted June 2025; FDA Breakthrough Device designation; RAPID pathway applicable post-FDA approval
        - label: Competitive position
          value: First-mover
          trend: growth
          note: >-
            No commercial BCI implant on any market; Neuralink and Synchron in different indications; MEMS foundry
            differentiator
        - label: Reimbursement readiness
          value: High Risk
          trend: stable
          note: >-
            US no NCD; Anthem adverse policy; EU HTA 12–36 months post-CE Mark; RAPID pathway untested for retinal
            prosthetics
        - label: Capital efficiency
          value: Moderate
          trend: stable
