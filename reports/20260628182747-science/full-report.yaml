        title: 'Foundry Ecosystem: B2B Customers of the Science BCI Platform'
        blocks:
          - type: paragraph
            body: >
              Science Corporation announced on February 20, 2026, a multi-year BCI Ecosystem partnership with Neurosoft
              Bioelectronics, a Geneva-based neural data company that develops ultra-soft cortical probes for tinnitus,
              epilepsy, and other neurological disorders. Neurosoft's probes had already been deployed in a dozen human
              patients prior to the partnership announcement. Under the Science Ecosystem model, partners gain access to
              Science's complete clinical-grade neural recording technology stack — including recording electronics,
              neural probes, software, and application tooling — for a fraction of the cost of developing equivalent
              infrastructure independently. Science estimates that building a full-stack clinical-grade BCI platform
              from scratch costs $75 million to $100 million and takes multiple years; the Ecosystem partnership enables
              first-in-human trials for under $5 million in a fraction of the time. Max Hodak, Science CEO, described
              the Neurosoft deal as "the first of many" expected partnerships, positioning the Science Ecosystem as a
              platform business model analogous to foundry services in the semiconductor industry. These ecosystem
              partners are a distinct B2B customer category from the patient/hospital channel: they purchase access to
              Science's engineering infrastructure rather than the PRIMA device itself, and they target neurological
              indications beyond Science's in-house programs. The revenue model for ecosystem deals involves multi-year,
              multi-million-dollar contracts, though specific financial terms have not been disclosed. The customer
