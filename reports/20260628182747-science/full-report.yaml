      - number: '1.5'
        title: Clinical Evidence, Regulatory Status, and Risk Profile
        blocks:
          - type: paragraph
            body: |
              The PRIMAvera pivotal trial (NCT04676854) enrolled 38 patients at 17 sites across France,
              Germany, Italy, the Netherlands, Spain, and the United Kingdom. All participants had
              advanced geographic atrophy with no residual central vision. Results published in The New
              England Journal of Medicine on October 20, 2025, authored by Frank Holz (University
              Hospital of Bonn, lead), José-Alain Sahel (University of Pittsburgh), and 14 co-authors,
              demonstrated: 80% of participants achieved meaningful visual acuity improvement at 12
              months; 84.4% regained the ability to read letters, numbers, and words; and the mean
              visual acuity gain was approximately 25.5 letters (more than five lines) on the ETDRS
              chart. The Data Safety Monitoring Board concluded that benefits outweigh surgical risks.
              No significant loss of natural peripheral vision was observed. Nineteen patients
              experienced adverse events including elevated intraocular pressure, retinal tears, and
              bleeding; the majority resolved within two months.

              Science submitted a CE Mark application to the European Union in June 2025, applied for
              U.S. FDA regulatory approval in June 2025, and holds an FDA Breakthrough Device
              designation originally granted to Pixium in April 2023 and inherited via the April 2024
              acquisition. A European commercial launch is anticipated in 2026, which would make
              Science the first BCI company with a vision-restoring product on market. The U.S. FDA
              decision remains pending as of mid-2026.

              Material risks include: PRIMA currently delivers only black-and-white prosthetic vision
              at relatively low resolution, not natural color sight; pricing and reimbursement terms
              are undisclosed; the 38-patient trial size may be seen as limited for broad label
              extensions; longer-term safety data beyond 12 months is still being collected; and the
              company remains entirely pre-revenue and dependent on continued investor funding through
              the regulatory and commercial launch process.
