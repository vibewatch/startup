      - number: '6.4'
        title: 'Commercial Adoption Pathway: Regulatory Gates and Reimbursement Gaps'
        blocks:
          - type: paragraph
            body: >
              Science Corporation submitted its CE mark application for PRIMA to the European Union and its
              IDE/PMA-equivalent to the FDA concurrently, as confirmed in the company's own patient registry
              announcement in June 2026. Industry analysts and news coverage consistently identify Germany as the
              anticipated first commercial market, given its regulatory framework for new devices and historical
              precedent for early-access neurotechnology approvals. CE mark approval was widely anticipated by mid-2026,
              though no approval had been publicly announced as of the reporting date. In the UK, Dr. Muqit confirmed a
              likely additional approval timeline of one to two years post-CE mark, requiring sequential approvals from
              MHRA, NICE health technology assessment, and NHS England commissioning — a three-stage gatekeeping process
              typical for high-cost implantable devices. The US pathway is longer still: PRIMA carries an FDA
              Breakthrough Device designation (inherited from the Pixium acquisition), which accelerates review but does
              not bypass the full PMA pathway. Critically, as of June 2026, no US Medicare reimbursement code, national
              coverage determination, or local coverage policy exists for PRIMA. The American Society of Retina
              Specialists' review of 2026 Medicare payment proposals did not identify a specific code for the PRIMA
              system; new implantable devices typically require an FDA clearance event followed by CPT/HCPCS code
              assignment and subsequent CMS review before any covered clinical use begins. This sequence creates a
              potential multi-year gap between US regulatory clearance and actual reimbursed commercial deployment.
