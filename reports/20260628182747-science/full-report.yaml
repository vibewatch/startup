      - number: '5.4'
        title: 'Platform Technology: Science Eye, LUX, and NYX Chip Families'
        blocks:
          - type: paragraph
            body: |
              Beyond PRIMA, Science Corporation is developing a broader neural interface platform whose
              enabling hardware layers are being built in parallel with the PRIMA commercial push.

              The Science Eye is Science Corporation's second visual prosthesis program. Unlike PRIMA,
              which stimulates retinal bipolar cells using a subretinal photovoltaic implant, the Science
              Eye combines an optogenetic gene therapy — delivered by an adeno-associated virus (AAV)
              vector targeting retinal ganglion cells (RGCs) in the optic nerve — with a Lightsheet
              flexible thin-film microLED display inserted directly over the retina. The gene therapy makes
              RGCs light-sensitive; the microLED array then delivers customized stimulation patterns. A key
              technical advantage over projector-based approaches is that the flexible film moves with
              the eye, maintaining a constant pixel-to-cell mapping essential for learning sophisticated
              visual encodings beyond basic flashes. Science Corporation claims the Lightsheet display
              achieves approximately eight times the pixel density of an iPhone 13 Super Retina display.
              The Science Eye targets retinitis pigmentosa and dry AMD where photoreceptors have been
              destroyed but the roughly one million RGCs per eye remain functional. The program has been
              formally deferred until after PRIMA achieves a commercial launch somewhere in the world, with
              animal safety data collection ongoing; no first-in-human trial date has been disclosed. The
              Science Eye and PRIMA are considered complementary: PRIMA addresses high-resolution central
              (foveal) vision; the Science Eye could address peripheral coverage, with both systems
              potentially driven by the same pair of glasses in future configurations.

              The NYX chip family provides the neural recording layer of the platform: NYX is a low-noise,
              low-power programmable mixed-signal ASIC for extracellular neural recording, while NYX 512
              is a 512-channel fully differential version optimized for high-channel-count brain mapping
              experiments. The LUX family provides microLED drive capability for optogenetic applications:
              LUX is a small-form-factor driver designed for single-channel optogenetic stimulation; LUX 2K
              is an active 2,048-pixel driver; and LUX 16K is a passive 16,384-pixel driver for
              high-density stimulation arrays. Both chip families are commercially available for research
              use and are fabricated at the Science Foundry in Durham, NC. The Synapse headstage electronics
              process, store, and transmit signals between neural probes and the network. The Axon
              family includes thin-film and silicon neural probes for tissue-contacting electrode arrays.
            claimRefs:
              - CE024
              - CE025
              - CE026
              - CE027
              - CE028
              - CE029
