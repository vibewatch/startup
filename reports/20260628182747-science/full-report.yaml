      - number: '3.5'
        title: Moat Durability, Displacement Risk, and Disconfirming Evidence
        blocks:
          - type: paragraph
            body: >
              Science Corp's competitive moat is real but fragile, and the historic failure rate in this exact
              competitive niche demands a rigorous adversarial accounting. Three predecessors in direct retinal
              prosthetics—Second Sight, Retina Implant AG, and Pixium Vision—either failed commercially or were acquired
              under distress conditions. The Argus II's CE marking and FDA HDE approval did not translate to commercial
              viability; Retina Implant AG achieved CE marking in 2016 and dissolved three years later; Pixium Vision
              reached a CE Mark submission stage with PRIMA and ran out of capital before approval. Each failure was
              driven by some combination of inadequate reimbursement, high procedural cost, low patient volume, and
              physician adoption inertia—none of which Science Corp has yet demonstrated the ability to overcome at
              scale. The GAO's 2025 report on brain-computer interfaces explicitly identified the lack of dedicated
              reimbursement coding, privacy frameworks, and post-market surveillance standards as systemic barriers
              requiring policy action before widespread BCI commercialization; Medicare currently has no national
              coverage determination or dedicated coding pathway for permanently implanted BCIs, which means PRIMA would
              face case-by-case MAC coverage negotiations in the US similar to those that undermined the Argus II. The
              ethical and regulatory obligation to support implanted patients if Science Corp encounters financial
              distress is also not resolved; the Argus II abandonment precedent (~350 patients left with unsupported
              implants) created pressure for policy changes that have not yet materialized. Neuralink's ~$1.3 billion
              capital base and category-defining media presence could redirect BCI investor flows toward
              motor/communication applications and away from vision restoration if Neuralink achieves FDA approval
              faster than Science Corp achieves EU commercial uptake. BVT, despite limited funding, holds FDA
              Breakthrough Device Designation and is executing a coherent clinical program; if BVT secures a major
              medtech acquisition or partnership, it could rapidly scale into a credible competitor with manufacturing
              and distribution support that Science Corp would need years to replicate. Science Corp's implanted-device
              lock-in is strong at the patient level—the procedural risk of explantation and replacement creates de
              facto patient retention—but it does not prevent hospital systems from establishing relationships with
              competing BCI platforms for motor applications, potentially limiting Science Corp's future intrahospital
              expansion. Surgeon specialization creates a meaningful moat: the vitreoretinal surgical skill set required
              for PRIMA implantation is well-established across major academic centers, reducing training-curve barriers
              compared to the novel craniotomy techniques required by cortical competitors. The PMC-published
              comparative analysis of Second Sight versus Onward Medical concluded that phased commercialization,
              predicate-technology leverage, and physician familiarity are critical success factors that Second Sight
              failed to employ—and that Science Corp's management must internalize as it transitions from clinical to
              commercial mode. In summary, Science Corp's moat is real in the narrow sense of being the only company
              with NEJM-published evidence and a live CE Mark application for retinal BCI vision restoration, but it is
              not durable in the structural sense until reimbursement, physician adoption, and post-market support
              models are proven at commercial scale.
