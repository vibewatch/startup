        title: Trial Sites and Implanting Physicians as Gateway Customers
        blocks:
          - type: paragraph
            body: >
              The 17 European clinical trial sites that participated in the PRIMAvera trial (NCT04676854) represent the
              most developed layer of Science's early customer network. These sites — spanning France, Germany, Italy,
              the Netherlands, and the United Kingdom — collectively enrolled 38 patients aged 60 or older with advanced
              dry AMD and geographic atrophy. The lead investigator was Dr. Frank Holz of the University Hospital Bonn,
              who co-authored the pivotal NEJM publication in October 2025. In the UK, Moorfields Eye Hospital served as
              the sole trial site, enrolling five patients under the direction of Dr. Mahi Muqit, senior vitreoretinal
              consultant at Moorfields and the Institute of Ophthalmology at UCL. Dr. Muqit described the PRIMA chip
              operation as safely performable "by any trained vitreoretinal surgeon in under two hours," a deliberate
              positioning designed to support broad clinical scalability. In the United States, the University of
              Pittsburgh Medical Center (UPMC) Vision Institute led by Dr. José-Alain Sahel was the first US center to
              implant PRIMA in a clinical feasibility study, positioning UPMC as the anchor US commercial site for any
              FDA-cleared launch. Science Corporation reports a total of 18 clinical partnerships established as of its
              patient registry announcement, a number that encompasses the PRIMAvera European sites and the expanding US
              feasibility network. These trial sites will likely serve as the initial commercial customers upon
              regulatory approval, transitioning from investigator- sponsored trial roles to device-purchasing hospital
              departments — provided reimbursement infrastructure exists at the time of launch.
