      - number: '2.5'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: |
              The principal market driver for PRIMA is the absence of any approved vision-restoring therapy
              for advanced GA: the clinical comparator is natural history, and any degree of functional
              restoration represents a meaningful advance for patients. Aging demographics structurally
              expand the eligible pool as AMD is strongly age-related. GA progression is relentless — a
              majority of diagnosed patients lose substantial vision within 2–3 years — creating clinical
              urgency that drives patient motivation if a safe and reimbursed option exists. Regulatory
              tailwinds include the FDA's Breakthrough Device Designation pathway reducing review cycles
              for visual prosthetics, and cost-of-illness analyses estimating $13.5–$32 billion annual
              burden of inherited retinal diseases in North America that support payer economic cases.
              Tele-ophthalmology is expanding the geographic reach of retinal implant candidate screening
              beyond major centers.

              However, material adoption constraints are real. Subretinal implantation is a complex
              specialized surgery requiring centers with trained retina surgeons, concentrating
              procedures at academic settings and throttling community roll-out. The Second Sight Argus II
              failure — in which more than 350 patients were abandoned with obsolete unsupported implants
              after Second Sight's financial collapse — set a damaging precedent for the retinal prosthetics
              market. Argus II was priced at $115,000–$150,000 per device with total treatment costs
              near $500,000 per patient; limited insurance coverage contributed to its commercial failure.
              The spectre of inadequate post-market device support from a startup remains salient for
              both patients and payers evaluating a novel retinal implant. Capital intensity in surgical
              settings, surgical learning curves, and the absence of established reimbursement codes for
              GA-indication implants compound near-term uptake constraints.
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
          - type: table
            tableRef: TM004
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
      - number: '2.6'
        title: 'Reimbursement Landscape: US and Europe'
        blocks:
          - type: paragraph
            body: |
              Reimbursement is the central commercial risk for PRIMA in both the US and Europe. In the
              United States, CPT code 67027 covers implantation of an intraocular retinal prosthesis, and
              Medicare has issued local coverage determinations for retinal prosthetics in end-stage
              retinitis pigmentosa. However, no national coverage determination exists for geographic atrophy
              as a retinal prosthetics indication — PRIMA's primary target — meaning initial coverage will
              depend on MAC-specific LCD decisions and case-by-case prior-authorization requests. CMS's
              2026 Physician Fee Schedule set the non-APM participant conversion factor at $33.40/RVU, but
              payment cuts for facility-based procedures at ambulatory surgical centers reduce procedural
              economics for implant programs that rely on hospital-based infrastructure.

              The Argus II precedent — $115,000–$150,000 per device, total per-patient costs near $500,000,
              and highly variable insurance coverage — demonstrates the commercial fragility of retinal
              implants with unresolved payer pathways. Science must demonstrate a sustainable device-plus-
              procedure economics model that payers can accommodate before wide commercial adoption is
              possible. In Europe, CE Mark is a prerequisite for market entry but does not confer
              reimbursement. The EU Health Technology Assessment Regulation (EU 2021/2282), entering
              phased implementation in January 2025, mandates joint clinical assessments for Class IIb
              and III devices including retinal prosthetics beginning in 2026, adding a pan-European
              evidence requirement before national HTA bodies render coverage decisions. Each EU member
              state independently determines coverage; France's HAS, Germany's G-BA, and the UK's NICE
              have historically been conservative on novel implantable devices with limited long-term
              outcome data. PRIMA's Science-filed CE Mark application (circa late 2024 / early 2025)
              is a necessary but insufficient condition for European commercial success.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
              - CM033
              - CM034
              - CM035
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Reimbursement Gap Is the Binding Commercial Constraint
            body: >
              No US national coverage determination exists for geographic atrophy as a retinal prosthetics indication,
              and CE Mark in Europe does not confer reimbursement. The Second Sight Argus II failure, driven in part by
              limited and inconsistent payer coverage, remains the primary adverse market precedent. Science's ability
              to secure favourable CMS LCDs and EU HTA decisions will determine whether PRIMA achieves sustainable
              commercial uptake or repeats the Argus II pattern of clinical success without market success.
            calloutType: risk
            claimRefs:
              - CM014
              - CM016
              - CM026
