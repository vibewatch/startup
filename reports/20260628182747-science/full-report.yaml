    title: Recommendation logic
    type: flow
    layout: standard
    summary: >
      Chain of evidence from clinical proof through regulatory momentum and first-mover position to the TRACK
      recommendation, showing how adverse factors (predecessor failures, reimbursement gap, premium valuation) condition
      the final judgment.
    data:
      nodes:
        - id: clinical-proof
          label: NEJM Clinical Evidence (84% success, 47 patients)
          role: Highest-quality retinal prosthesis data ever published; de-risks regulatory timeline
        - id: reg-momentum
          label: Regulatory Momentum (CE Mark submitted, FDA Breakthrough)
          role: Advanced EU submission; RAPID pathway available; first commercial BCI possible mid-2026
        - id: first-mover
          label: First-Mover Advantage (first BCI on any market)
          role: Winner-take-most dynamics in BCI; platform optionality from foundry and biohybrid
        - id: adverse-factors
          label: Adverse Factors (sector failures, zero revenue, premium valuation)
          role: Three prior retinal CE-marked companies failed; $1.5B above expected-value; cap table undisclosed
        - id: valuation-check
          label: Valuation Check ($1.5B vs ~$1.1B expected value)
          role: Premium to probability-weighted base; requires partial bull-case execution to break even
        - id: recommendation
          label: Recommendation — TRACK (research-more at $1.0–$1.2B entry)
          role: Monitor CE Mark, EU pricing, and RAPID engagement; entry price improvement significantly changes risk/return
        - id: diligence-gate
          label: Key Diligence Gate — Cap Table + CE Mark Outcome
          role: Preference stack and CE Mark timing are highest-information items before any commitment
      edges:
        - from: clinical-proof
          to: reg-momentum
