      - number: '6.3'
        title: 'Patient Registry and Advocacy: Channeling Latent Demand'
        blocks:
          - type: paragraph
            body: >
              Science Corporation launched a formal patient registry in 2025-2026 covering individuals diagnosed with
              age-related macular degeneration, retinitis pigmentosa, and Stargardt disease. This registry serves
              multiple commercial functions simultaneously: it generates a qualified pipeline of future PRIMA patients,
              informs clinical trial design for expanded indications, and creates a direct communication channel between
              the company and the patient community. Participation is free, privacy-respecting, and reversible, with
              participants retaining full data control. The registry tracks not only traditional clinical metrics such
              as best-corrected visual acuity but also functional outcomes — reading ability, face recognition, and
              navigation — that Science has identified as the most meaningful indicators of patient benefit. Registry
              participants receive priority access to future clinical trials and emerging device generations. Science
              Corp states that approximately five million people worldwide are affected by end-stage atrophic AMD for
              which no vision-restoring therapy currently exists, representing the primary addressable patient pool. The
              eligibility threshold is strict: patients must be 60 years or older, have advanced dry AMD with geographic
              atrophy, and present with best-corrected visual acuity of 20/400 or worse in the study eye, with a
              confirmed central scotoma. This narrow eligibility funnel, combined with the need for retained peripheral
              vision and absence of other confounding ocular conditions, is expected to yield a substantially smaller
              commercial-ready population than the headline AMD figure suggests. Patient advocacy organizations have
              been engaged; the Macular Society (UK) described the PRIMA results as "encouraging" and stated it was
              watching closely for UK regulatory approval and potential NHS availability.
