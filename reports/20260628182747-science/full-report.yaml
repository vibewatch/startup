              - CM038
              - CM040
      - number: '2.2'
        title: Disease Burden and Addressable Patient Population
        blocks:
          - type: paragraph
            body: |
              The primary target indication for PRIMA is advanced geographic atrophy (GA) secondary to
              age-related macular degeneration (AMD). Approximately 1 million patients in the United States
              and 5–8 million globally live with GA, with 160,000 new US cases annually. GA
              disproportionately affects older adults: prevalence is 0.28% at ages 60–64 but rises to
              0.98% at ages 70–74, and global AMD prevalence is projected to reach 288 million by 2050
              as populations age. In the four largest European markets alone — Germany (400,000–450,000),
              France (265,000), Italy (170,000), and Spain (155,000) — GA affects over 1 million
              additional patients, constituting a significant European commercial opportunity if
              reimbursement can be secured.

              Beyond GA, Science has expanded PRIMA clinical development into inherited retinal diseases
              (IRDs). Retinitis pigmentosa affects approximately 1 in 4,000 individuals worldwide, with
              80,000–110,000 patients in the US; roughly 12% develop advanced disease with severe vision
              loss (counting fingers or hand motion only), representing the implant-candidacy tier. Stargardt
              disease, the most common juvenile macular dystrophy, affects approximately 1 in 8,000–10,000
              individuals globally, with earlier onset creating a distinct and younger surgical-candidate
              demographic. Combined, the three primary indications yield a US patient pool of approximately
              1.2 million with end-stage retinal degeneration — but surgical candidacy requirements,
              including residual retinal function, intact bipolar-cell layer, and health thresholds for
              surgery, narrow the implantable population considerably below these epidemiological totals.
              GA accounts for approximately 20% of all AMD-related legal blindness, underscoring the
              severity tier PRIMA addresses.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM004
