          4–6x forward revenue on $45M 2028 midpoint = $180M–$270M; plus strategic premium from EU first-mover =
          $700M–$1.1B range
        - '50%: most consistent with historical BCI regulatory and reimbursement timelines'
        - >-
          Reimbursement delays, Anthem maintaining adverse policy, or SAE re-emergence in commercial use could compress
          to bear
      - - Bear (20% weight)
        - >-
          CE Mark delay past 2026 or RFI requiring supplemental data; EU reimbursement fails within 3 years (sector
          precedent); FDA not-approvable letter; down-round or distressed exit
        - >-
          Distressed exit at 1–2x total capital ($490M–$980M range) minus preference overhang; more likely <$400M net to
          equity below preference threshold
        - '20%: consistent with sector base rate (3 of 3 prior retinal prosthetics companies failed commercially)'
        - >-
          Any two of: CE Mark delay, FDA rejection, reimbursement failure, key executive departure — triggers this
          scenario
    notes: >
      Scenario probabilities are analyst estimates based on regulatory precedent, sector comparables, and public
      evidence as of June 2026; they do not reflect Science Corp's internal projections. Revenue estimates use peer
      device ASP benchmarks ($80K–$145K) and conservative uptake assumptions. DCF discount rate 25% applied to 2028
      values for present-value comparison to March 2026 entry.
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV037
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - CE Mark rejection or RFI delay
        - BSI issues an RFI in 2026 or formal rejection; approval pushed past Q2 2027
        - Eliminates first-mover premium and delays entire EU commercial thesis by 12–24 months; shifts to base or bear
        - Reassess position; demand pre-submission meeting notes; consider entering at lower valuation post-delay
      - - EU commercial revenue missing below target
        - <5 procedures per quarter at 6 months post-CE Mark approval in Germany
        - >-
          Signals physician adoption barrier, reimbursement friction, or patient pipeline problem; base case degrades to
          bear
        - Demand commercial detail (site count, reimbursement confirmations, backlog); suspend further commitment
      - - FDA not-approvable letter or new trial required
        - FDA issues complete response letter requiring new pivotal trial or significant data supplement
        - US revenue thesis delayed 3–5 years; raises burn rate; may require emergency bridge financing
        - Exit or reduce at favorable price; US revenue no longer anchors exit valuation within 5-year hold
      - - Adverse reimbursement decision
        - CMS issues a formal non-coverage determination (NCD) for subretinal prosthetics, or RAPID pathway denied
        - US reimbursement path becomes multi-year advocacy process; bull case collapses to base or bear
        - Reframe as a pure EU play at proportionally lower valuation; reassess entry discipline
      - - Key executive departure
        - Max Hodak (CEO) or Alan Mardinly (CSO) departs within 12 months without a clear successor
        - >-
          Impairs regulatory credibility, investor confidence, and clinical network access; raises probability of
          down-round
        - Accelerate diligence on succession plan and board composition; put on watch list
    notes: >
      Triggers are defined as observable, external events — not internal forecasts. Thresholds were set using publicly
      available sector precedent (Second Sight, Pixium) and medtech FDA review statistics. Not exhaustive; clinical
      safety signals, manufacturing non-conformances, or significant IP challenges could also break the thesis.
    claimRefs:
      - CV005
      - CV022
      - CV029
      - CV035
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Cap table and preference stack
        - >-
          Individual investor ownership, liquidation preferences, participation rights, anti-dilution, and convertible
          note conversion terms
        - >-
          Effective entry economics for Series C investors depend on preference depth; $1.5B post-money may not reflect
          Series C economic ownership
        - Science Corp CFO / legal counsel; request full capitalization table and Series C term sheet
      - - CE Mark outcome and timeline
        - >-
          BSI review status; any RFI or additional information requests received by Science Corp post-June 2025
          submission
        - >-
          CE Mark approval or rejection is the single highest-information event in 2026; entire EU commercial thesis
          hinges on it
        - Science Corp IR; BSI (through Science Corp); independent EU MDR counsel
      - - FDA primary confirmation
        - Primary FDA record confirming Breakthrough Device designation; pre-submission meeting minutes; PMA filing date
        - >-
          Breakthrough Device designation accelerates review; PMA not yet filed as of research date; FDA timeline is
          unknown
        - Science Corp regulatory affairs; FDA CDRH pre-submission database; direct FDA inquiry
      - - Germany commercial launch pricing and reimbursement
        - >-
          PRIMA device ASP, initial hospital contracts, AMNOG early-access application, and German NUB (new examination
          and treatment methods) status
        - >-
          First market pricing establishes global ASP precedent; German AMNOG HTA covers ~12-month early-access bridge
          to full coverage
        - Science Corp commercial team; Spitzenverband Bund der Krankenkassen (GKV-SV) database
      - - Burn rate and runway to profitability
        - >-
          Actual annual cash burn ($20–$30M estimated), monthly runway post-Series C, and whether the $65M foundry capex
          is included in the $490M total
        - >-
          Runway determines whether a Series D is needed before US FDA approval (~2028–2029); dilution risk affects
          Series C return
        - Science Corp CFO; review audited financial statements if available under NDA
    notes: >
      All items are publicly unconfirmed as of June 2026. Diligence paths assume access to Science Corp management under
      NDA. Cap table diligence is the highest-priority item before any investment commitment as it determines effective
      entry economics.
    claimRefs:
      - CV001
      - CV010
      - CV039
      - CV040
      - CV041
      - CV042
