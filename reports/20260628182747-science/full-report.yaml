      - number: '8.4'
        title: Scenario Analysis and Probability-Weighted Valuation
        blocks:
          - type: paragraph
            body: |
              Three scenarios frame the valuation range for Science Corp as of June 2026. The bull case assumes
              CE Mark approval in Q3 2026, German commercial launch with early-access reimbursement by Q4 2026,
              10–15 procedures per quarter ramp at €80K–€90K device ASP, RAPID pathway enabling US Medicare
              coverage within 90 days of FDA approval (2027–2028), and foundry/biohybrid platform optionality
              contributing terminal value. Under this scenario and a 7–10x forward revenue multiple on 2028
              projected revenues of $120M–$200M, the implied enterprise value is $2.5B–$3.5B, representing
              solid risk-adjusted returns from the $1.5B entry. The base case assumes CE Mark in H2 2026 but a
              12–18 month EU HTA process in Germany and France before meaningful reimbursement, a US FDA decision
              in 2029, and cautious hospital uptake reflecting the sector's prior failure history. Base case
              first-year revenue $30M–$50M at a 4–6x forward multiple yields implied EV of $700M–$1.1B — below
              the March 2026 entry valuation. The bear case assumes CE Mark delay beyond 2026, EU reimbursement
              fails to establish within 2 years (following the sector precedent), FDA further delayed past 2030,
              and a down-round or distressed strategic exit is required. Bear case implied value is $150M–$400M,
              representing substantial capital loss for Series C investors. Probability-weighting these scenarios
              — 30% bull, 50% base, 20% bear — yields an expected value of approximately $1.0B–$1.25B, which
              is 17–33% below the March 2026 entry price of $1.5B. This negative expected value gap is partially
              offset by optionality value not captured in the DCF scenarios: the biohybrid program, the foundry
              business, and the Science Eye platform create upside scenarios not modeled in the revenue-based
              valuation. For a fund with a 7–10 year horizon and a portfolio construction that can absorb binary
              FDA risk, the valuation is defensible but not compelling at $1.5B; at $1.0B–$1.2B entry it becomes
              attractive.
