      - number: '3.4'
        title: Comparative Technical Differentiation — Modality, Invasiveness, and Evidence Maturity
        blocks:
          - type: paragraph
            body: >
              Science Corp's PRIMA differentiates from all active competitors on three converging dimensions: evidence
              maturity, commercial proximity, and wireless-by-design architecture. Among all retinal and cortical
              prosthetics companies, PRIMA is the only device with phase II data published in the New England Journal of
              Medicine demonstrating functional vision restoration—80% of patients showed meaningful visual improvement
              in the PRIMAVERA trial across 38 to 47 participants—at the time of its CE Mark submission. No competitor
              in either direct visual prosthetics or the broader BCI tier has reached this combination of journal
              publication tier, enrollment scale, and regulatory filing simultaneously. PRIMA's photovoltaic wireless
              design is architecturally distinct: the 378 photovoltaic pixels in the subretinal chip convert
              near-infrared light delivered through the patient's glasses into electrical stimulation of bipolar cells,
              entirely eliminating external power connections and transcutaneous leads; this reduces infection risk and
              simplifies the system compared to wired or battery-recharged alternatives. BVT's suprachoroidal approach
              places the implant outside the retinal layers, reducing the surgical complexity and retinal trauma risk
              compared to both epiretinal and subretinal approaches, but the 44-electrode design provides significantly
              lower theoretical resolution than PRIMA's 378 pixels and has only been tested in 4 subjects. Cortigent's
              Orion bypasses retinal circuitry entirely by stimulating the visual cortex, which is a genuine
              technological differentiation that could serve a broader blind population but requires a
              craniotomy—surgical burden orders of magnitude greater than PRIMA's vitreoretinal procedure. Science Corp
              acquired all Pixium Vision assets, including clinical trial infrastructure, IP, and the CE Mark
              application, giving it sole control of the PRIMA platform with no competing claim. The Argus II's CMS
              reimbursement of $150,000 against a total ~$500,000 procedure cost established a negative commercial
              precedent that PRIMA will need to explicitly overcome through payer evidence and differentiated outcomes
              data. PRIMA stimulates bipolar cells in the subretinal space, which preserves inner retinal processing
              including lateral inhibition—a theoretical resolution advantage over the Argus II's epiretinal ganglion
              cell stimulation, which bypasses the same circuitry. Synchron's lower surgical burden is a genuine
              competitive advantage in the broader BCI capital competition, as hospital deployment costs and operator
              certification time favor endovascular systems; however, this advantage does not apply to retinal surgery,
              which is a mature procedural specialty with established surgeon training pathways. Precision
              Neuroscience's 510(k)-cleared Layer 7 electrode establishes a commercial regulatory precedent for a
              thin-film cortical interface, a data point relevant to future expansion of Science Corp's cortical BCI
              platform beyond retinal indications. In sum, Science Corp leads on regulatory proximity, evidence
              maturity, and system elegance, but faces the same commercialization overhead—physician adoption, payer
              engagement, and long-term support obligations—that destroyed its direct predecessors.
