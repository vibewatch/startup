  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and Definition
        blocks:
          - type: paragraph
            body: |
              Science Corporation's PRIMA system addresses a precisely bounded market distinct from the
              broader ophthalmology, AMD pharmacological, and general BCI landscapes. The included spend is
              the surgical device system for restoring visual function in end-stage degenerative retinal
              disease — specifically photovoltaic subretinal implants, associated external hardware, and
              implantation procedures. Excluded is the pharmacological AMD treatment market (anti-VEGF
              injections, complement inhibitors, AREDS supplements), optical correction, low-vision aids,
              gene therapies, and cortical visual prostheses that bypass the retina entirely.

              The status-quo comparator for advanced geographic atrophy is watchful monitoring with no
              restorative option: no pharmacological therapy currently restores central vision lost to GA,
              making PRIMA's clinical comparator natural history rather than a competing drug. Wet AMD
              pharmacological treatment (anti-VEGF) is adjacent but orthogonal — anti-VEGF injections
              generate more than 6 million US procedures annually but target a fundamentally different
              disease stage and mechanism, and patients who progress to end-stage GA are beyond the benefit
              window of anti-VEGF. PRIMA's closest adjacencies are other retinal implant approaches
              targeting RP and Stargardt, emerging gene therapies for inherited retinal diseases, and
              cortical visual prostheses for patients with damaged retinal-optic pathways. The larger
              BCI neuroprosthetics TAM ($168.27B invasive BCI TAM per Grand View Research) inflates
              addressable market narratives and should be excluded from PRIMA-specific sizing, as it
              encompasses motor-function BCIs, communication devices, neuromodulation, and other
              non-ophthalmological applications. The AMD drug market ($12.64B in 2025) should similarly
              be treated as context, not PRIMA's market, since it targets a different disease stage.
            claimRefs:
              - CM025
              - CM043
              - CM024
              - CM038
              - CM040
          - type: table
            tableRef: TM001
            claimRefs:
              - CM025
              - CM043
