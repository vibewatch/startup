  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: PRIMA Implant Architecture and Near-Infrared Image Path
        blocks:
          - type: paragraph
            body: |
              The PRIMA system restores central vision in patients whose photoreceptors have been destroyed
              by geographic atrophy (GA) while retaining a functional inner retina. The device exploits the
              eye's optical transparency: an external near-infrared projector delivers both energy and image
              data through the pupil to a wireless subretinal chip, eliminating batteries and percutaneous
              cables that plagued earlier retinal prostheses.

              The implant itself is a thin crystalline silicon photovoltaic array measuring 2 × 2 mm in
              footprint and just 30 µm thick — approximately half the diameter of a human hair. Its 378
              independently controlled pixels are arranged in a hexagonal (honeycomb) grid; each pixel is
              100 µm wide and functions as a combined solar cell and electrode. When infrared light at
              880 nm illuminates a pixel, it generates a local electric current that stimulates the adjacent
              bipolar cells in the retina, re-introducing the visual signal pathway that was interrupted by
              photoreceptor loss. The use of 880 nm wavelength is deliberate: it falls outside the visible
              spectrum, making it invisible to the patient's surviving photoreceptors and preventing
              cross-talk with natural peripheral vision.

              The external hardware consists of three components: (1) sun-lens-equipped glasses with a
              forward-facing camera that captures the scene and an eye-facing infrared projector; (2) a
              pocket processor that applies real-time zoom (up to 12×), contrast enhancement, and
              AI-assisted object-identification algorithms before encoding the result as a NIR pattern;
              and (3) the projector, which beams patterned 880 nm light precisely onto the subretinal
              implant. Only illuminated pixels fire, so image resolution is determined by the pixel count
              on the chip. Because the photovoltaic chip provides power from the incoming light, no
              implanted battery is required and the device is fully wireless — a key advantage over
              prior systems such as the Argus II that required percutaneous leads. The technology was
              originally conceived in 2005 by Daniel Palanker, PhD, at Stanford University, whose lab
              conducted the first-in-human feasibility trials (NCT03333954, NCT03392324) that Science
              Corporation later advanced after acquiring all PRIMA intellectual property and clinical trials
              from Pixium Vision SA in April 2024.
