  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory Approval Risk: FDA PMA and EU CE Mark'
        blocks:
          - type: paragraph
            body: >
              Science Corporation's near-term commercial viability depends entirely on two parallel regulatory outcomes:
              FDA Pre-Market Approval for the US market and CE mark confirmation for the European market. Neither
              approval is guaranteed, and both carry timing uncertainty that could delay commercialization by one to
              three years beyond current projections. FDA Breakthrough Device designation (secured 2023) accelerates
              interactions and review scheduling, but does not reduce the evidentiary threshold for safety and
              effectiveness. The FDA PMA pathway for a Class III implantable device typically takes 180 days for
              substantive review after filing, and the Agency reserves the right to issue Additional Information
              requests that can extend this by 12 months or more. Science's CE mark application, submitted to BSI with
              approximately 60 gigabytes of documentation in June 2025, is under EU MDR review and a decision has not
              been confirmed as of June 2026. The EU Medical Device Regulation (2017/745) imposes post-market clinical
              follow-up requirements on Class IIb implants that Science must design into its commercial surveillance
              program before approval. The FDA and CMS jointly announced the RAPID Coverage Pathway in April 2026, which
              allows Breakthrough Devices to receive Medicare coverage concurrently with FDA approval rather than
              waiting the typical 6-18 months post-approval. This substantially mitigates reimbursement tail risk but
              requires Science to proactively engage with both agencies. The Humanitarian Use Device designation
              request, if granted, would allow PRIMA commercialization under a 8,000-patient annual ceiling with a
              reduced profit-limitation framework, providing a bridging mechanism between clinical trial and full
              commercial scale. Intellectual property risks are modest given the Palanker Lab patent portfolio acquired
              via Pixium, but freedom-to-operate validation remains an open diligence item for the subretinal
              photovoltaic pixel design space.
