      - number: '5.6'
        title: 'Science Foundry: Manufacturing and Compliance'
        blocks:
          - type: paragraph
            body: |
              Science Corporation owns and operates the Science Foundry, a MEMS and ASIC fabrication
              facility located in Research Triangle Park, Durham, North Carolina. The facility originated
              from Science Corporation's acquisition of MEMSCAP's US MEMS foundry assets and team in
              approximately 2022, giving the company an in-house microfabrication capability that is rare
              among clinical-stage neural interface companies. The Foundry manufactures Science's
              proprietary ASIC chip families (NYX neural recording, LUX microLED drivers) and is the
              intended production facility for the PRIMA photovoltaic subretinal array.

              In July 2024, Durham County Commissioners unanimously approved a ten-year, $930,000
              performance-based economic incentive for Science Corporation's planned facility expansion.
              The expansion adds approximately 57,000 square feet to the Durham campus, is expected to
              require a capital investment of $65 million, and is projected to create more than 50
              high-wage manufacturing jobs. The facility is targeted for ISO 9001:2015 quality management
              system certification and FDA current Good Manufacturing Practice (cGMP) compliance.
              NCBiotech reported that the expansion would support manufacturing for the Science portfolio
              including the PRIMA implant and advanced neural interface technologies.

              Vertical integration of the MEMS foundry provides Science Corporation with three strategic
              advantages: (1) supply chain control for the photovoltaic silicon arrays that are the core
              of PRIMA — reducing dependency on external foundry partners whose availability and IP
              tolerance may be uncertain; (2) unit cost reduction leverage as volumes scale, since
              incremental chip cost at an owned foundry is driven primarily by materials and cycle time
              rather than margin-loaded external pricing; and (3) the ability to serve selected external
              biotech and medtech partners as a US-based MEMS foundry, generating non-dilutive revenue
              and validating the foundry's quality system against external use cases. The Foundry's current
              production readiness at commercial PRIMA volumes has not been publicly confirmed; pilot-scale
              manufacturing is the current status. The scale-up to commercial-grade cGMP-certified
              production for a CE Mark-approved medical device represents a significant operational milestone
              that has not yet been publicly reached as of mid-2026.
