      - number: '6.6'
        title: Adoption Barriers, Adverse Evidence, and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Several structural barriers temper the optimistic demand narrative. First and most significantly, PRIMA
              generates zero revenue as of June 2026: all "customers" are clinical trial participants or pre-revenue
              partners, and no commercial transaction has occurred. Second, the device's adverse event profile warrants
              scrutiny: in the PRIMAvera trial, 26 serious adverse events occurred across 19 of 38 patients (50% SAE
              incidence at the patient level), including retinal tears, increased intraocular pressure, retinal
              detachment, and proliferative vitreoretinopathy. While 95% of these events resolved within two months, the
              treated eyes also showed a larger increase in geographic atrophy area compared to untreated control eyes,
              raising unresolved questions about device-related acceleration of the underlying disease. Third, the
              near-term commercial footprint is narrowly concentrated at elite academic vitreoretinal centers. The
              PRIMAvera trial required 17 specialized European sites and one US center; not all vitreoretinal surgeons
              have the subretinal implantation skills and post-operative rehabilitation infrastructure required. Broad
              geographic access is therefore structurally limited by training and center certification requirements,
              creating a bottleneck that persists even after regulatory approval. Fourth, Science's patient eligibility
              criteria are narrow: candidates must be 60 or older with complete central vision loss and must retain
              residual peripheral vision — a profile that screens out many AMD patients. Fifth, the entire US commercial
              path is stalled until both FDA clearance and Medicare reimbursement are secured, a sequence that may
              extend well beyond the CE-mark timeline in Europe. These barriers collectively mean that Science's
              commercial ramp, even in an optimistic scenario, will be slow, dependent on a handful of specialist
              centers, and initially confined to single-country European markets with the most favorable reimbursement
              environments.
