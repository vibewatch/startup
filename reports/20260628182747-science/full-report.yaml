      - number: '7.2'
        title: Clinical Safety and Efficacy Durability Risk
        blocks:
          - type: paragraph
            body: >
              The PRIMAvera pivotal trial reported 26 serious adverse events in 19 of 38 patients — a 50% incidence rate
              — with four classified as severe: macular hole, retinal detachment, proliferative vitreoretinopathy, and
              ocular hypertension. Twenty-one of the 26 SAEs occurred within the first two months post-implant,
              consistent with a surgical-phase event profile rather than a chronic device failure mode. The Science Corp
              Data Safety Monitoring Board reviewed the 24-month data and recommended trial continuation without
              protocol modifications, a signal of acceptable benefit-risk balance for the DSMB. However, two specific
              signals will receive scrutiny in any FDA review. First, geographic atrophy area increased by 8.5 mm² in
              PRIMA-implanted eyes versus 2.5 mm² in fellow control eyes over 24 months — a statistically significant
              difference that Science attributes to the surgical trauma of subretinal space entry and not to the
              photovoltaic chip itself. While visual acuity and letter-reading gains persisted despite this anatomical
              progression, the mechanism requires explanation in the PMA submission. Second, no long-term implant
              durability data beyond 36 months exists for any commercial subretinal photovoltaic device. PRIMA's
              second-generation chip design, which improved pixel density and biocompatibility, may effectively reset
              the durability clock relative to any pre-clinical or earlier cohort data. Analogous risks are visible in
              adjacent BCI development: Neuralink's first human trial recorded wire retraction from brain tissue in its
              initial implant in May 2024, illustrating that biotic-abiotic interface stability at long durations
              remains an open challenge across implantable neural devices. Science's subretinal placement differs
              mechanically from cortical arrays, but the fundamental challenge of maintaining a stable, biocompatible
              interface over decades is shared. Any FDA Additional Information request on GA progression or implant
              durability could add 12-24 months to the review timeline and require supplemental trial data.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
