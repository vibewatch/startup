      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: |
              The bull case for Science Corporation rests on a coherent alignment of clinical, regulatory, and
              strategic factors. PRIMA's NEJM-published pivotal trial result (80–84% of patients achieving
              meaningful visual acuity improvement in 47 patients across 17 EU and US sites) represents the
              highest-quality clinical evidence ever published for an implantable vision-restoration device.
              CE Mark application was submitted to BSI in June 2025 with approximately 60 gigabytes of
              documentation, and a mid-2026 decision would make Science Corp the first BCI company to place
              a product on market anywhere — a first-mover premium that justifies a valuation above pure DCF
              fundamentals in highly competitive platform markets. The FDA Breakthrough Device designation
              enables enhanced FDA engagement and, combined with the April 2026 RAPID Coverage Pathway,
              creates a simultaneous FDA approval and Medicare coverage mechanism that removes the historical
              12–18 month post-approval reimbursement gap. The in-house MEMS foundry provides manufacturing
              differentiation and a platform optionality angle that no other retinal prosthetics company has
              offered. The anti-thesis is equally grounded. Science Corp is pre-revenue globally. All three
              CE-marked predecessor retinal prosthetics companies — Second Sight (Argus II), Pixium Vision
              (Prima Alpha/PRIMA), and Retina Implant AG (Alpha IMS) — achieved regulatory clearance but
              failed commercially, with the sector's combined loss of hundreds of millions in investor capital.
              Anthem's 2026 policy classifies all artificial retinal devices as investigational and not medically
              necessary, representing the current default US private-payer stance before any Science Corp
              commercial presence. EU reimbursement after CE Mark requires country-by-country HTA processes
              typically taking 12–36 months in key markets. Platform distraction risk from biohybrid neural
              interface, Vessel, and the foundry business divides management and capital at a stage requiring
              concentrated PRIMA execution. Private-market mark inflation in the 2025 VC cycle, combined with
              an oversubscribed round from repeat-only investors, raises questions about whether the $1.5B mark
              reflects fundamental value or an optimistic cycle-peak pricing event.
