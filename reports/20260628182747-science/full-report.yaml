      - number: '7.3'
        title: Reimbursement and Commercial Adoption Risk
        blocks:
          - type: paragraph
            body: >
              The United States Centers for Medicare and Medicaid Services has no dedicated CPT code, coverage
              determination, or payment framework for implantable subretinal prostheses as of June 2026. Private payers
              typically follow CMS's lead: Anthem Blue Cross's DME.00052 policy already classifies brain-computer
              interface rehabilitation devices as investigational and not medically necessary, regardless of FDA review
              status. The GAO's 2025 BCI technology assessment (GAO-25-106952) found that BCI developers had
              historically found it difficult to engage with CMS about their devices, and that patients who received
              implants during clinical trials faced device explantation when trial funding ended — a structural risk
              that insurers and hospitals weigh when deciding whether to adopt a novel implantable platform. The April
              2026 RAPID Coverage Pathway directly addresses this issue by allowing simultaneous FDA approval and
              Medicare coverage determination for Breakthrough Devices, but the pathway is new, has not yet been tested
              for any implantable visual prosthetic, and requires proactive co-engagement with the FDA and CMS that
              Science must initiate during the pre-submission phase. The absence of PRIMA commercial pricing in any
              public document makes it impossible to assess whether Science Corp's target price point is compatible with
              what hospitals, HTA bodies, or national payers will accept. Cochlear implant analogy suggests a
              $30,000-$100,000 device cost; retina-specific payer skepticism may set the acceptable ceiling lower. In
              Europe, Science must navigate country-by-country AMNOG and HTA processes for reimbursement after CE mark —
              a process that has typically taken 12-36 months for novel implantable devices. The downstream
              private-payer vacuum created by CMS inaction amplifies this risk: without a US coverage signal, European
              payers have no precedent to reference when setting reimbursement rates, and Science's commercial launch
              timeline becomes dependent on whichever market's payer infrastructure materializes first.
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
