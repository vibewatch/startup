        - label: Evidence quality
          value: High
          trend: stable
          note: NEJM primary data; multiple independent media verification; CE Mark technical documentation submitted
        - label: Exit readiness
          value: 2028–2031
          trend: growth
          note: IPO requires FDA + revenue; M&A most likely post-approval; Medtronic/BSci/J&J/Abbott fit
        - label: Overall IC score
          value: TRACK
          trend: stable
          note: Buy at $1.0–$1.2B; research-more at $1.5B; avoid below-bear scenario execution
