      - number: '1.2'
        title: PRIMA Technology and Product Platform
        blocks:
          - type: paragraph
            body: |
              PRIMA is a photovoltaic subretinal implant approximately 2 × 2 mm in footprint and only
              30 µm thick — about half the diameter of a human hair. The device functions as an artificial
              photoreceptor: the tiny wireless chip, embedded beneath the retina at the photoreceptor layer,
              converts near-infrared light projected onto it into localized electrical stimulation of the
              underlying bipolar cells, reintroducing the retinal signal pathway in patients whose
              photoreceptors have been destroyed by geographic atrophy. The PRIMA system comprises three
              components: the subretinal implant, specialized glasses containing an embedded camera and
              infrared projector, and an AI-powered pocket processor that captures the visual scene,
              identifies salient objects, and directs patterned infrared light to the implant. Because the
              implant is powered wirelessly by the projected light, no internal battery is required —
              a key safety and longevity advantage. The photovoltaic retinal stimulation technology was
              originally developed at Stanford University by Professor Daniel Palanker's laboratory.
              Science acquired all PRIMA intellectual property and three ongoing clinical trials from
              Pixium Vision SA of France in April 2024, after Pixium was placed into liquidation
              proceedings in the Paris Commercial Court. The acquired trial package included the PRIMAvera
              pivotal study (NCT04676854) and two feasibility trials. Science is now expanding the PRIMA
              clinical program to include Stargardt disease and retinitis pigmentosa, two leading causes
              of inherited retinal vision loss in young adults. Current PRIMA prosthetic vision is
              black-and-white with relatively low resolution; Science has disclosed that the next device
              generation will optimize visual performance through digital image processing.
