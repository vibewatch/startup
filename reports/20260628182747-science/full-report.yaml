      - number: '7.6'
        title: Sector Precedent, Structural Risk, and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              The retinal prosthetics sector has a consistent record of commercial failure despite clinical proof of
              concept. Second Sight Medical Products abandoned its Argus II bionic eye product line in 2019, leaving
              more than 350 patients with unsupported implants; the case of Barbara Campbell — whose Argus II failed
              inside a New York City subway station, rendering her suddenly blind in an already dangerous environment —
              became the exemplar of what happens when a medtech company exits without a device-continuity plan. Pixium
              Vision entered Paris Commercial Court liquidation in 2024 and was acquired by Science for approximately €4
              million, demonstrating that even CE-marked devices cannot generate sufficient commercial revenue to
              sustain a standalone company without reimbursement support. Retina Implant AG discontinued operations
              after 16 years of development, citing an innovation-hostile regulatory and reimbursement climate. Science
              Corp's PRIMA design differs fundamentally from these predecessors — subretinal photovoltaic stimulation
              targeting partially sighted patients rather than fully blind subjects, with no external wire and a
              dramatically simpler surgical technique — but the structural risks of payer skepticism, limited long-term
              durability evidence, and small addressable patient populations are shared. The GAO flagged ethical and
              privacy risks in BCI technology — including data security, cognitive liberty, and the risk of
              "neurosurveillance" — as among the 12 most pressing policy challenges for the sector; these concerns are
              intensified by the fact that PRIMA connects to a wearable AI-processing unit that captures continuous
              visual field data. An institutional payer catch-22 compounds these structural risks: limited commercial
              revenue depresses the clinical evidence base required for positive coverage determinations, while coverage
              gaps prevent the commercialization needed to generate that evidence. Monitorable kill criteria include:
              (1) FDA refuses to file the PMA or issues a non-approvable letter; (2) the RAPID pathway CE mark or CMS
              coverage determination is delayed beyond 2029; (3) a third severe SAE type emerges in the extended
              PRIMAvera data; (4) Hodak departs without a disclosed succession plan; and (5) Series D funding cannot be
              raised within 24 months of Series C at a flat or up-round valuation.
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
          - type: table
            tableRef: TR005
            claimRefs: []
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Regulatory-Reimbursement Catch-22: Approval Without Access is Not Enough'
            body: >
              The defining commercial risk for Science Corporation is not regulatory approval alone — it is the
              combination of regulatory timing and reimbursement infrastructure. Second Sight had regulatory clearance
              for Argus II; it had no durable reimbursement pathway. Pixium Vision had CE mark for Prima Alpha and
              PRIMA; it could not generate enough revenue to survive. Science Corp's PRIMA design is meaningfully
              superior to both predecessors, but the structural challenge is identical: a device that costs tens of
              thousands of dollars to implant, with ongoing rehabilitation requirements, cannot be commercially adopted
              without hospital certainty that payers will cover it. The RAPID Coverage Pathway announced in April 2026
              directly addresses this catch-22 — but only if Science actively enrolls and CMS processes its coverage
              determination concurrently with the FDA review. Any slip in this coordination creates the same 6-18 month
              post-approval dead zone that has historically blocked novel device adoption.
            calloutType: risk
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR037
              - CR038
              - CR039
              - CR042
          - type: callout
            title: 'Sector Mortality Rate: Three of Three Predecessors Failed Commercially'
            body: >
              Every developer of a subretinal or epiretinal implant that achieved clinical proof of concept before
              Science Corporation ultimately exited the commercial market: Second Sight (epiretinal, US, abandoned
              2019), Pixium Vision (subretinal, France, liquidated 2024), and Retina Implant AG (subretinal, Germany,
              discontinued after 16 years). Each company had clinical evidence. None achieved commercial sustainability.
              The common failure modes were inadequate reimbursement coverage, insufficient addressable patient volume,
              and capital intensity exceeding what revenue could service. Science Corp's advantages — more selective
              patient targeting, superior visual outcomes, the RAPID pathway, $490M in capital, and integration with an
              active BCI platform — distinguish it meaningfully from each predecessor. But the base rate of commercial
              failure in this sector demands that any investment thesis be stress-tested against the specific mechanisms
              — not just the technical details — that caused three well-funded predecessors to fail.
