  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Tier Structure
        blocks:
          - type: paragraph
            body: >
              Science Corporation's PRIMA implant faces competition across two structural tiers that differ in clinical
              overlap, timelines, and strategic relevance. The first tier—direct visual prosthetics competition—includes
              companies building retinal or cortical devices for the same vision-restoration patient populations that
              PRIMA targets: advanced geographic atrophy from AMD and end-stage inherited retinal diseases. As of
              mid-2026, this tier is remarkably thin: Pixium Vision SA, the French company that originally developed
              PRIMA, was liquidated and its assets acquired by Science Corp in April 2024; Retina Implant AG dissolved
              in 2019; Second Sight's Argus II was commercially withdrawn by 2020; leaving only Bionic Vision
              Technologies (BVT) in Australia and Cortigent (a Vivani Medical subsidiary) as operationally active direct
              peers. The second tier—BCI capital and attention competition—includes Neuralink, Synchron, and Precision
              Neuroscience, which do not compete for the same patients but absorb the same pool of neurotech investor
              capital and clinical-center training capacity. The BCI sector raised over $960 million in Q1 2026 alone,
              with capital consolidating around what industry observers call the "Big 6" invasive BCI companies. Science
              Corp's narrative as a first-to-market vision-restoring BCI company competes with Neuralink's broader
              technological ambition and Synchron's minimally invasive advantage for limited investor attention and
              specialized neurosurgical expertise. Understanding both tiers is essential: direct competitors set the
              clinical evidence bar and precedent commercial failures, while capital competitors define the funding
              environment and can redirect hospital and payer attention away from vision restoration. Pixium Vision's
              history is instructive—it developed PRIMA, conducted early clinical trials, and obtained a CE Mark
              application infrastructure that Science Corp now operates. The acquisition was not merely an IP
              transaction: it removed a potential near-term competitor and gave Science Corp sole control of the most
              clinically advanced subretinal photovoltaic platform in existence. No Medicare national coverage
              determination or FDA premarket approval exists for any permanently implanted BCI device as of June 2026,
              meaning all competitors in both tiers share an unresolved reimbursement risk.
