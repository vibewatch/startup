chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Founding
        blocks:
          - type: paragraph
            body: |
              Science Corporation is a clinical-stage neural engineering company incorporated in 2021 and
              headquartered in Alameda, California. Co-founded by Max Hodak — who previously co-founded
              and served as president of Neuralink until May 2021 — and Alan Mardinly, PhD, a Harvard
              neurobiology PhD and former Neuralink research leader, the company was built around the thesis
              that the brain, as the body's sole non-transplantable organ, represents the ultimate frontier
              of medicine. Science's near-term commercial vehicle is PRIMA, a photovoltaic subretinal
              brain-computer interface (BCI) retinal prosthesis targeting advanced geographic atrophy (GA)
              from age-related macular degeneration. Beyond PRIMA, the company is simultaneously developing
              a biohybrid neural interface architecture designed to grow engineered neurons on chips for
              superior brain integration, a Science Eye optogenetic platform for broader vision restoration,
              and a MEMS semiconductor foundry in Research Triangle Park, North Carolina, providing
              in-house manufacturing capability. The founding team elected to remain private and
              pre-commercial while building a multi-modality neural interface portfolio, staging external
              product launches around regulatory milestones. Company communications consistently frame
              the mission as engaging the brain directly as an information-processing organ to achieve
              effect sizes unreachable by conventional medicine.
