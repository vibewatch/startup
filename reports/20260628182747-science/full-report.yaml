  - id: FE001
    title: PRIMA System Architecture Stack
    type: stack
    layout: standard
    summary: >
      Layered view of the PRIMA system from external wearable hardware to cortical visual processing, showing the
      functional role of each layer, its key components, and Science Foundry's manufacturing position.
    data:
      layers:
        - id: wearable-layer
          label: Wearable External Hardware
          detail: >
            Front-facing camera captures patient's visual field in real time. Pocket processor (AI algorithms) enhances
            contrast, applies zoom (up to 12×), and encodes scene as patterned NIR data. Eye-facing 880 nm projector
            beams encoded infrared pattern through the pupil onto the subretinal implant. Sun lenses attenuate ambient
            visible light. Powers the implant wirelessly via photovoltaic conversion.
        - id: optical-transmission-layer
          label: Optical Power and Data Transmission (880 nm NIR)
          detail: >
            Near-infrared light at 880 nm is invisible to surviving photoreceptors outside the implant zone, preventing
            signal contamination of natural peripheral vision. The projector's spatial light modulator patterns NIR
            intensity per pixel at the implant's 100 µm resolution grid. Transmission through vitreous is non-invasive
            and wireless; no percutaneous cables or internal batteries required.
        - id: photovoltaic-chip-layer
          label: PRIMA Subretinal Photovoltaic Chip (2×2 mm, 30 µm thick, 378 pixels)
          detail: >
            Crystalline silicon photovoltaic array implanted subretinally beneath the atrophic fovea. 378 independent
            pixels in hexagonal honeycomb grid, each 100 µm wide. NIR illumination on each pixel drives a current pulse
            that locally stimulates the overlying bipolar cell via a pillar electrode. No battery required; powered
            entirely by incoming NIR light. Manufactured at Science Foundry, Durham NC.
        - id: retinal-interface-layer
          label: Inner Retinal Neural Interface (Bipolar Cells)
          detail: >
            The electrical pulses from the PRIMA pixel array directly stimulate surviving retinal bipolar cells — the
            second-order neurons that normally receive input from photoreceptors. This bypasses the destroyed
            photoreceptor layer. Requires intact inner retina (bipolar and ganglion cells); patients with inner retinal
            atrophy or glaucoma are not candidates. Natural peripheral photoreceptors and their bipolar cells are
            unaffected.
        - id: optic-nerve-layer
          label: Optic Nerve / Retinal Ganglion Cell Pathway
          detail: >
            Bipolar cell activation propagates through the retinal ganglion cells into the optic nerve and lateral
            geniculate nucleus (LGN). Prosthetic central vision signal travels through the same neural pathway as
            natural vision. Simultaneous natural peripheral and prosthetic central signals are integrated at this stage.
        - id: visual-cortex-layer
          label: Visual Cortex Processing and Perceptual Learning
          detail: >
            Visual cortex processes the integrated prosthetic and natural signal. Training over months post-implantation
            reinforces cortical interpretation of the new prosthetic signal — analogous to the auditory learning
            required for cochlear implant users. Full benefit typically requires 3–6 months of structured visual
            rehabilitation.
    approximationNotes: >
      Layer boundaries represent conceptual functional divisions; physical anatomy differs. Optical coupling efficiency
      and exact pixel current output depend on implant depth, tissue optical properties, and glasses alignment — none
      publicly disclosed by Science Corp.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE020
      - CE039
  - id: FE002
    title: PRIMA Patient Workflow — From Diagnosis to Visual Outcome
    type: flow
    layout: standard
    summary: >
      Step-by-step flow of a PRIMA patient experience from initial candidate identification through surgical
      implantation, rehabilitation, and the 12-month clinical outcome reported in PRIMAvera. Highlights key decision
      gates and the post-implant training dependency.
    data:
      nodes:
        - id: candidate-id
          label: Patient Identification and Candidate Screening
          role: >
            Retinal specialist identifies GA patient with logMAR ≥ 1.2 (worse than 20/320) and no residual central
            vision. OCT imaging confirms preserved inner retinal layers (bipolar cells intact). Candidate must meet
            surgical fitness criteria; glaucomatous optic nerve damage is an exclusion. Inner retinal preservation is
            mandatory.
        - id: pva-imaging
          label: Pre-Surgical Imaging and Planning
          role: >
            OCT and fundus photography delineate the atrophic zone extent and retinal thickness. Surgical plan targets
            chip placement centered under the atrophic fovea. Target retinotomy site is identified temporal to the fovea
            within the atrophic lesion.
        - id: pars-plana-vitrectomy
          label: Pars Plana Vitrectomy and Subretinal Implantation
          role: >
            Standard three-port 23- or 25-gauge PPV is performed. Posterior vitreous detachment induced if absent. Small
            retinotomy created temporal to fovea. PRIMA chip loaded into custom subretinal injector and delivered into
            subretinal space. Chip positioned under atrophic fovea. Endolaser photocoagulation seals retinotomy;
            fluid-air exchange may be performed. No external cable exits the eye; total surgical time typically under
            two hours.
        - id: post-surgical-recovery
          label: Post-Surgical Recovery (4–5 Weeks)
          role: >
            Standard post-vitrectomy care: topical antibiotics, anti-inflammatory drops, head positioning if gas
            tamponade used. Retina reattaches over the implant. No device activation during this period. Compliance
            monitoring and safety follow-up.
        - id: glasses-fitting
          label: PRIMA Glasses Fitting and First Activation
          role: >
            Four to five weeks post-surgery, patient is fitted with PRIMA glasses and pocket processor. First NIR
            projection test; initial visual impressions recorded. Some patients perceive patterns immediately; others
            require weeks of learning.
        - id: visual-rehab
          label: Structured Visual Rehabilitation (Months)
          role: >
            Low vision specialist conducts regular in-clinic sessions. Progresses from basic light/dark detection
            through shape recognition to letter and word reading. Patient trains on zoom, contrast, and brightness
            controls. Home practice reinforces clinic training. Training duration analogous to cochlear implant auditory
            learning.
        - id: twelve-month-outcome
          label: 12-Month Primary Endpoint Assessment
          role: >
            ETDRS visual acuity measured with and without PRIMA glasses vs. baseline. PRIMAvera result: 80% (imputed)
            achieved ≥ 0.2 logMAR improvement; mean gain 5 ETDRS lines; 27/32 read letters/words; best case 12-line
            gain. DSMB concluded benefits outweigh surgical risks. Acuity up to 20/42 with zoom enhancement.
        - id: long-term-monitoring
          label: Long-Term Follow-Up and Upgrade Pathway
          role: >
            Continued periodic clinic visits; device settings adjusted. Wireless design enables future in-situ
            replacement with higher-resolution next-generation chip through a repeat subretinal procedure. Tiled pattern
            of multiple chips also feasible for larger atrophic zones.
    approximationNotes: >
      Surgical steps reflect standard vitreoretinal technique combined with company descriptions of the PRIMA delivery
      system. Exact timing, tamponade choice, and post-op protocol vary by surgical center. Clinical outcomes are from
      PRIMAvera (N=38); real-world outcomes may differ from controlled trial conditions.
