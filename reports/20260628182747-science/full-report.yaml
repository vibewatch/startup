              that was oversubscribed with demand exceeding capital requirements. The Series C implies
              a post-money valuation of approximately $1.5 billion, making Science one of the most
              highly capitalized private BCI companies globally at this stage. Capital is earmarked for
              PRIMA's European commercialization, manufacturing scale-up, and advancement of pipeline
              programs including the biohybrid neural interface and Vessel perfusion platform. The
              company has publicly stated its imperative is to "become the first BCI company to scale
