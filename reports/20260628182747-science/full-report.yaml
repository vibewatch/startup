  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: 'Pre-Commercial Landscape: Defining Science Corporation''s Customer Universe'
        blocks:
          - type: paragraph
            body: >
              Science Corporation occupies a fully pre-commercial position as of June 2026. The company has no paying
              customers in the conventional sense; every current user of the PRIMA retinal implant system is a clinical
              trial participant, a patient in a compassionate-access or registry context, or a business partner in a
              pre-revenue arrangement. This is not unusual for clinical-stage medtech companies, but it is critical
              context for any commercial assessment: all demand signals today are prospective and contingent on
              regulatory outcomes that remain unresolved. The customer landscape can be segmented into four distinct
              roles: (1) patients with advanced geographic atrophy due to AMD, or inherited retinal degeneration, who
              are eligible for implantation; (2) the implanting vitreoretinal surgeons and academic hospital systems
              that operate as clinical gatekeepers and eventual commercial purchasers; (3) patient advocacy
              organizations and registries that aggregate and channel patient demand; and (4) foundry ecosystem partners
              — early-stage BCI companies that license Science's neural engineering platform. Each segment has a
              different procurement pathway, different evidence of traction, and a different timeline to revenue. The
              customer segmentation table below maps these dimensions in full, and the customer journey map illustrates
              the sequential stages a patient traverses from disease onset to long-term device use, highlighting where
              Science must deliver commercial infrastructure before it can convert patient demand into revenue.
