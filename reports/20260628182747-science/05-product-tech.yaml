      Corporation to achieve commercial PRIMA availability, revenue, and patient access.
      Nodes represent actors, assets, or gates; edges show dependency direction.
    data:
      nodes:
        - id: stanford-ip
          label: Stanford / Palanker Lab IP
          role: Foundational photovoltaic pixel technology; licensed through Science Corp's Pixium acquisition; underpins PRIMA chip design
        - id: prima-chip
          label: PRIMA Photovoltaic Subretinal Chip
          role: Core device; 2×2 mm, 378-pixel silicon array; manufactured at Science Foundry; subject to CE Mark and FDA review
        - id: prima-glasses
          label: PRIMA Glasses + Pocket Processor
          role: External wearable system; delivers NIR power and image data; AI processing; forms complete PRIMA system
        - id: science-foundry
          label: Science Foundry (Durham, NC)
          role: In-house MEMS/ASIC fab; manufactures PRIMA photovoltaic arrays and chip families; $65M expansion underway
        - id: surgeons
          label: Trained Vitreoretinal Surgeons
          role: Required for subretinal implantation using PPV technique; learning curve and training program needed for scale
        - id: eu-ce-mark
          label: EU CE Mark Approval
          role: Regulatory gate for European commercial launch; application submitted June 2025; decision pending
        - id: fda-approval
          label: US FDA PMA Approval
          role: Regulatory gate for US commercial launch; Breakthrough Device designation secured; review ongoing
        - id: clinical-evidence
