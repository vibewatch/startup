        - Neural interface developers, academic researchers
        - Open-source; 18 public GitHub repos; last commit June 26, 2026
        - Multi-language (Python, TypeScript, C++) gRPC-based API; NDTP protocol; lab automation stack (Galago)
        - Adoption metrics not publicly disclosed; primarily internal and research use
