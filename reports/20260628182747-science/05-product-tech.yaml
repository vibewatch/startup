  - id: clinical-evidence-surgical-workflow
    title: Clinical Evidence and Surgical Workflow
    body: |
      The PRIMAvera pivotal study (NCT04676854) is Science Corporation's definitive clinical
      evidence base for PRIMA. The open-label, multicenter, prospective, baseline-controlled trial
      enrolled 38 patients older than 60 with advanced GA and baseline visual acuity worse than
      20/320 (logMAR ≥ 1.2) at 17 sites across France, Germany, Italy, the Netherlands, Spain,
      and the United Kingdom. The primary endpoint was a clinically meaningful improvement in visual
      acuity of at least 0.2 logMAR from baseline to month 12. Among the 32 participants who
      completed 12-month follow-up, 26 (81%; 95% CI 64–93; p < 0.001) met the primary endpoint.
      After multiple imputation for the six participants lost to follow-up (three deaths, one
      withdrawal, two unavailable), the estimated responder rate was 80% (95% CI 66–94). Mean
      visual acuity gain was approximately 5 ETDRS lines (25.5 letters); the best single-patient
      improvement reached 12 lines. Of the 32 completers, 27 could read letters, numbers, or words
      at month 12. Patients who also used the digital zoom and contrast features in the glasses
      achieved acuity equivalent to 20/42 in some cases. The study was led by Frank G. Holz (University
      of Bonn), with José-Alain Sahel (University of Pittsburgh) and Daniel Palanker (Stanford)
      as senior authors; the paper appeared in the New England Journal of Medicine on 20 October 2025
      (NEJM 394:232–242; DOI 10.1056/NEJMoa2501396). An accompanying NEJM editorial by Jacque
      Duncan (UCSF) described PRIMA as "the first treatment to restore vision" in advanced GA.

      The implantation procedure uses standard vitreoretinal surgical technique. The surgeon
      performs a three-port 23- or 25-gauge pars plana vitrectomy, induces posterior vitreous
      detachment if needed, creates a small retinotomy temporal to the fovea, then delivers the
      PRIMA chip into the subretinal space using a purpose-built custom injector. The chip is
      centered under the atrophic fovea; endolaser photocoagulation secures the retinotomy edges;
      a fluid-air or gas exchange may be performed. No external power cable exits the eye. Four to
      five weeks post-surgery, patients are fitted with the PRIMA glasses and begin a structured
      visual rehabilitation program with a low vision specialist; it typically takes several months
      of training to reach peak performance — analogous to the auditory learning required for
      cochlear implant users.

      The trial's safety profile is significant but manageable. Twenty-six serious adverse events
      occurred in 19 of 38 patients (50%). The most frequent was ocular hypertension (6 events in
      23% of patients), followed by peripheral retinal breaks (5 patients), subretinal hemorrhage
      during implantation (3 patients), and full-thickness macular holes (3 patients). Critically,
      all SAEs were attributed to the implantation procedure alone or to the procedure together with
      the device; no SAE was attributed to the device alone. Almost all SAEs resolved within two
      months without sequelae. The Data Safety Monitoring Board formally concluded that the
      benefits of PRIMA outweigh its surgical risks.
