  - id: device-limitations-roadmap
    title: Technical Limitations and Next-Generation Roadmap
    body: |
      PRIMA's current commercial specification carries four structural technical limitations that
      bound the initial patient experience and addressable population. First, vision is
      black-and-white only: the photovoltaic pixel outputs are binary, and the current software
      version does not compute grayscale from the scene. Palanker has indicated that a grayscale
      software upgrade is under development; face recognition, which patients rate as their
      second-highest priority after reading, requires grayscale gradation. Second, the implant's
      2 × 2 mm footprint covers only the central macular zone; peripheral vision is unaffected but
      prosthetic coverage of the broader retinal surface is not possible with a single chip at
      current dimensions. Third, the pixel pitch of 100 µm produces coarse prosthetic vision; the
      estimated theoretical acuity ceiling for a 100 µm pitch device is approximately 20/500
      without digital zoom, improving to roughly 20/320–20/200 range with 12× zoom enhancement.
      Fourth, and most critically for patient selection, PRIMA requires a functional inner retina:
      the bipolar cell layer — the neurons PRIMA stimulates — must be intact. Patients whose
      retinal degeneration has progressed to inner retinal atrophy, or those with glaucomatous
      ganglion cell loss, are not candidates.

      The next-generation PRIMA chip, currently in pre-clinical development and tested in rats at
      Stanford, targets pixel pitch of 20 µm with approximately 10,000 pixels per chip. Stanford's
      Daniel Palanker projects that a 20 µm pitch device could deliver 20/80 baseline prosthetic
      acuity, and combined with the glasses' electronic zoom, approach 20/20 functional acuity in
      some conditions. The wireless photovoltaic design also enables future in-situ upgrade: the
      implant can theoretically be replaced with a higher-resolution chip through a repeat subretinal
      procedure with minimal incision, unlike tethered devices. Multiple chips can also be implanted
      in a tiled pattern to cover larger atrophic zones. Science Corporation is also expanding PRIMA
      to new indications: NCT07266584, a feasibility trial at Sydney Eye Hospital, Australia, is
      evaluating PRIMA for Stargardt disease and retinitis pigmentosa — both inherited retinal
      degenerations with macular involvement — with estimated enrollment of five patients and
      primary completion expected by March 2029. The earlier PRIMAvera trial sample size of
      38 patients, while sufficient for CE Mark submission, may be viewed as limited for future
      label extension requests or reimbursement dossiers beyond the initial GA indication.
