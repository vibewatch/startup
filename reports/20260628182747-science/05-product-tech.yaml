        - LUX commercial qualification at Science Eye volumes will be prerequisite for Science Eye launch
      - - Biohybrid neural interface (neuron-embedded thin-film electrode array)
        - Patients with neurological injuries, motor disorders, or ALS (long-term)
        - Preclinical; animal safety study (mice) published 2024; first human sensor trial in preparation
        - Neurons form synaptic connections with host brain; potential for billion-synapse bandwidth vs. hundreds of electrode channels
        - Regulatory pathway for living-cell implant is unprecedented; batch neuron quality uncertainty; no human safety data
