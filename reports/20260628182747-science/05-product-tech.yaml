  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Technical Risk
    rows:
      - - PRIMA photovoltaic pixel array (crystalline silicon)
        - Converts 880 nm NIR light to electrical pulses; stimulates adjacent retinal bipolar cells
        - Stanford/Palanker IP (acquired via Pixium); Science Foundry MEMS manufacturing
        - 100 µm pixel pitch limits resolution; patient inner retina must be intact; photovoltaic efficiency constrains stimulus amplitude
      - - PRIMA NIR glasses projector (880 nm)
        - Delivers patterned infrared light providing both power and image data to subretinal chip
        - Custom optics and projector alignment; user head-mounted wearable form factor
        - Precise foveal alignment required between projector and implant; ambient NIR sources could interfere; glasses form factor must be acceptable to patients
      - - Pocket processor + AI image algorithms
        - Captures visual scene; applies contrast enhancement, zoom, and scene encoding; generates NIR projection pattern
        - Software IP; battery supply; real-time processing latency requirements
        - Image encoding quality limits perceived visual resolution; AI algorithm quality determines effective resolution; battery life constrains use time
      - - LUX microLED driver ASIC family
        - Drives microLED arrays for optogenetic stimulation (Science Eye development and research use)
        - LUX 2K/16K ASICs fabricated at Science Foundry; co-development with Science Eye Lightsheet film
        - Complex pixel drivers for 16K channels; chip qualification at Science Eye production volumes is a prerequisite for Science Eye commercialization
      - - NYX neural recording ASIC family
        - Amplifies and digitizes extracellular neural signals from electrode arrays in brain tissue
        - External ADC ecosystem; Synapse API software stack; probe-to-ASIC interface
        - Noise floor performance across diverse brain-interface applications; requires system-level validation per indication
      - - Biohybrid neuron-electronic interface
        - Biologically integrates lab-grown neurons with host brain; forms synaptic connections for high-bandwidth BCI
        - Stem cell culture quality; regulatory acceptance of living-cell medical device; scale manufacturing of biological neurons
        - Completely novel regulatory pathway; batch-to-batch neuron viability and behavior variability; long-term synaptic stability unknown
      - - Science Foundry MEMS fab (Durham, NC)
        - In-house manufactures photovoltaic PRIMA silicon arrays, NYX/LUX ASICs, and neural probe structures
        - MEMSCAP legacy tooling; $65M expansion capital; clean-room ISO/cGMP qualification
        - Currently pilot-scale only; commercial cGMP certification in progress; scale-up risk for PRIMA volume manufacturing
    notes: >
      Architecture details are sourced from official Science Corporation product pages, Stanford
      Medicine research publications, and NCBiotech facility reporting. Biohybrid and Science Eye
      components are still in R&D phase; manufacturing readiness for these layers is not confirmed.
