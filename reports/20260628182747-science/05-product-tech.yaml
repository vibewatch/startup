  - id: biohybrid-nexus-developer-ecosystem
    title: Biohybrid Neural Interface and Developer Ecosystem
    body: |
      Science Corporation's longest-horizon technical program is the biohybrid neural interface.
      Conventional BCIs use metal or silicon electrodes that cannot form synaptic connections with
      neurons and typically degrade over years due to glial scarring. Science's biohybrid
      architecture embeds lab-grown neurons — derived from stem cells and genetically modified to
      express light-sensitive opsins (optogenetic transduction) — directly into a thin-film
      electrode array. Once implanted, these neurons extend axons and dendrites into the host
      brain, forming synaptic connections. A single thin-film device seeded with one million
      embedded neurons could theoretically form a billion synapses with the brain, providing a
      bandwidth ceiling orders of magnitude higher than metal electrode arrays.

      The current biohybrid device incorporates 520 recording electrodes packed into an area
      approximately the size of a pea. Unlike Neuralink's penetrating electrode approach, Science's
      device rests on the brain surface (cortical surface placement, not penetrating), potentially
      reducing glial damage and enabling longer device stability. In 2024, the company published a
      working paper demonstrating safe implantation and functional optogenetic stimulation of cortical
      circuits in mice. As of April 2026, Yale Medical School's Murat Günel, chair of the Department
      of Neurosurgery, has signed on as scientific adviser for the human implant program. The
      near-term plan is to implant the device's electrode sensor (without embedded neurons) in
      patients already undergoing major brain surgery — such as craniectomy for brain swelling
      management — to evaluate safety. Science Corp has stated it does not plan to seek FDA approval
      for these initial electrode-only sensor trials, arguing the device poses no significant risk.
      Full clinical trials with embedded neurons are anticipated after 2027. The biohybrid R&D
      team is led by CSO Alan Mardinly and numbers approximately 30 researchers.

      On the developer ecosystem side, Science Corporation maintains an active open-source presence
      at github.com/sciencecorp. The primary developer tool is the Synapse API — a set of protocol
      buffer definitions enabling Python, TypeScript, and C++ client libraries to discover and
      communicate with Synapse devices over gRPC. The synapse-python repository had 17 GitHub
      stars and was updated on June 26, 2026; the broader organization hosts 18 public repositories
      covering the Synapse API, Galago lab automation stack, NDTP (Neural Data Transport Protocol),
      and experiment application examples. The open-source ecosystem lowers barriers to research
      adoption of Science's chip families and creates developer lock-in ahead of commercial products.
