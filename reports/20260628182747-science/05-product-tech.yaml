    rows:
      - - Read printed text (books, labels, signs)
        - Magnifying glass, Braille, screen reader, reliance on others
        - PRIMA glasses with digital zoom and contrast; pocket processor encodes large characters
        - 84.4% of PRIMAvera participants read letters, numbers, or words at 12 months (NEJM 2025)
        - Only black-and-white; requires high contrast; minimum print size limited by 100 µm pixel pitch
      - - Navigate environment (indoor / outdoor)
        - White cane, guide dog, constant companion assistance
        - Prosthetic central vision merged with natural peripheral vision; zero peripheral disruption
        - Simultaneous prosthetic + natural peripheral vision confirmed in all trial participants
        - Central field only (2×2 mm chip); fine detail and color absent; obstacle detection limited
      - - Face and object recognition
        - Impossible without functional central vision in GA patients
        - Scene processing and zoom in pocket processor; partial shape recognition possible
        - Some patients reported improved daily activity independence and reading subway signs and food labels
        - Grayscale software not yet shipped; face recognition requires grayscale; currently black-and-white only
      - - PRIMA implant surgery (retinal surgeon)
        - No prior viable surgical treatment for advanced GA
        - Standard PPV + custom subretinal injector; no external cable; laser closure of retinotomy
        - Procedure performed by trained vitreoretinal surgeons; no percutaneous leads; MRI compatibility preserved
        - "SAE in 50% of patients (mostly procedural: IOP, retinal breaks, hemorrhage); experienced surgeon essential"
      - - Post-implant visual rehabilitation
        - N/A (no prior prosthetic vision device for this indication)
        - Structured program with low vision specialist; home practice with glasses; zoom/contrast training
        - Mean 5-line gain by 12 months; 2/3 of patients achieved medium-to-high user satisfaction
        - Months of training required; not all patients reach reading proficiency; protocol not yet standardized
    notes: >
      Use cases reflect PRIMAvera trial participant experience (N=38, NEJM 2025) and company
      communications. Real-world post-commercial outcomes, rehabilitation success rates, and
