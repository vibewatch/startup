figures:
  - id: FI001
    title: Revenue Model Bridge — PRIMA Clinical Activity to Gross Profit
    type: flow
    layout: standard
    summary: >
      How a PRIMA implant procedure flows from patient qualification through payer adjudication to
      Science Corp device revenue and gross profit contribution, highlighting the reimbursement gate.
    data:
      nodes:
        - id: patient
          label: Qualified patient (AMD, Stargardt, RP)
          role: Meets clinical criteria for PRIMA implant under commercial or investigational protocol
        - id: surgeon
          label: Retinal surgeon and hospital/ASC
          role: Performs implant surgery; bills payer for CPT procedure code and device charge
        - id: payer-gate
          label: Payer coverage adjudication (key gate)
          role: Medicare/commercial insurer determines coverage; currently investigational per Anthem 2026 policy
        - id: hospital-purchase
          label: Hospital device purchase from Science Corp
          role: Hospital buys PRIMA unit; Science Corp recognizes revenue; ASP currently undisclosed
        - id: science-revenue
          label: Science Corp device revenue (per unit)
          role: Per-unit ASP; estimated $85K–$145K based on Argus II and Pixium benchmarks; undisclosed
        - id: foundry-cogs
          label: Science Foundry COGS offset
          role: In-house MEMS fabrication; est. $5K–$12K/unit at pilot volumes; targeted 85–92% gross margin
        - id: gross-profit
          label: Gross profit contribution
          role: ASP minus COGS; positive structural margin if scale achieved and reimbursement secured
    approximationNotes: >
      All dollar figures are estimates based on industry benchmarks (Argus II, Pixium). Science Corp has not
      disclosed device pricing, COGS, or margin. Payer coverage status reflects Anthem 2026 policy; other
      payers may differ. EU revenue pathway (CE Mark) may precede US commercial launch.
    claimRefs: [CI014, CI015, CI017, CI019, CI027, CI028, CI036]

  - id: FI002
    title: Unit Economics Bridge — From Device Cost Inputs to Customer Economics
    type: flow
    layout: standard
    summary: >
      Qualitative nodes tracing the inputs that determine PRIMA unit economics, from manufacturing cost
      through gross margin to customer acquisition and payback; all values are estimates or undisclosed.
    data:
      nodes:
        - id: asp
          label: Device ASP (est. $85K–$145K; undisclosed)
          role: Primary revenue input per procedure; EU Pixium and Argus II benchmarks; Science Corp undisclosed
        - id: cogs
          label: Unit COGS (est. $5K–$12K at pilot volumes)
          role: MEMS fabrication, assembly, testing, and packaging; declines with scale automation
        - id: gross-margin
          label: Gross margin (est. 85–92% at scale)
          role: Structural driver of long-run economics; requires volume ramp to materialize
        - id: cac
          label: CAC (physician training + hospital procurement; undisclosed)
          role: Physician education programs, hospital capital committee cycles, payer pre-auth cost
        - id: payback
          label: Payback period (multi-year; payer-cycle-dependent)
          role: One-time implant with multi-year payer adjudication extends recovery vs. recurring-revenue models
    approximationNotes: >
      All nodes are qualitative or estimated; Science Corp has disclosed no unit economics. CAC and payback
      depend heavily on payer coverage decisions not yet secured in the US market.
    claimRefs: [CI025, CI026, CI027, CI032, CI039]

  - id: FI003
    title: Financial Estimate Range — Burn, Runway, Pricing, and Valuation Inputs
    type: range
    layout: wide
    summary: >
      Source-backed bounds on key financial inputs for Science Corporation as of mid-2026; all ranges reflect
      industry benchmarks or reported data rather than company-disclosed figures.
    data:
      items:
        - label: Annual burn rate (industry benchmark, clinical-stage medtech)
          low: 15
          high: 35
          unit: USD M/yr
          note: Clinical-stage device company benchmark; Science Corp undisclosed; ABCMoney cites $20–$30M/yr
        - label: Implied runway post-Series C ($230M)
          low: 6
          high: 15
          unit: years
          note: Based on $230M at estimated burn range; excludes foundry capex draw-down and EU launch costs
        - label: PRIMA device ASP estimate (EU reference)
          low: 85
          high: 145
          unit: USD K
          note: Pixium pre-insolvency EU pricing €80K–€100K converted; Argus II $145K upper bound
        - label: PRIMA full-episode cost estimate
          low: 200
          high: 300
          unit: USD K
          note: Device + surgery + rehabilitation; Argus II historical total-episode cost analogy
        - label: Post-money valuation (Series C, reported)
          low: 1250
          high: 1500
          unit: USD M
          note: Reported in multiple news sources; not independently confirmed; second only to Neuralink in BCI
    approximationNotes: >
      All ranges are estimates or benchmarks. Science Corp has not disclosed burn rate, revenue, or margin.
      Valuation bounds reflect range reported across sources; actual pre-money may differ.
    claimRefs: [CI004, CI016, CI020, CI029]

  - id: FI004
    title: Capital Intensity Waterfall — Series C Deployment Scenario
    type: waterfall
    layout: wide
    summary: >
      Illustrative deployment of the $230 million Series C proceeds against estimated capital requirements;
      all non-Series-C line items are estimates derived from announced commitments and industry benchmarks.
    data:
      items:
        - label: "Series C proceeds (March 2026)"
          value: 230
          detail: Oversubscribed; Lightspeed + Khosla + YC + IQT + Quiet Capital; all prior investors
        - label: "Durham foundry capex commitment"
          value: -65
          detail: Up to $65M announced; multi-year build; Durham County $930K incentive partially offsets
        - label: "Clinical R&D — est. 3-year program"
          value: -60
          detail: Trial execution, PRIMA CE Mark/FDA, Stargardt/RP expansion, personnel; industry est. ~$20M/yr
        - label: "Manufacturing operations — est. 3-year"
          value: -24
          detail: Science Foundry operating costs; partially offset by third-party MEMS service revenue
        - label: "EU commercial launch and market development"
          value: -15
          detail: Physician training, market access, distributor costs, initial EU market entry
        - label: "Implied remaining capital buffer (est.)"
          value: 66
          detail: Residual runway; does not include future financing rounds or revenue offsets
    approximationNotes: >
      All line items except Series C proceeds are author estimates based on public commitments (foundry)
      and industry benchmarks (clinical R&D, operations). Actual deployment will differ from this scenario.
      Science Corp has not disclosed a capital deployment plan.
    claimRefs: [CI007, CI010, CI011, CI020, CI033]

