slug: science
runDate: "2026-06-28"
company:
  name: Science Corporation
chapter:
  number: 4
  title: Financials
  summary: >
    Science Corporation entered mid-2026 having raised approximately $490 million since its 2021 founding,
    including an oversubscribed $230 million Series C in March 2026 at a ~$1.5 billion post-money valuation.
    The company is pre-revenue in the United States; all unit economics remain undisclosed. A planned EU
    commercial launch of PRIMA would make Science Corp the first BCI company to place a vision-restoration
    product on market. The principal financial risk is reimbursement: Anthem's 2026 policy classifies all
    artificial retinal devices as investigational and not medically necessary, while predecessor failures by
    Second Sight ($300M+ invested, <$32M revenue) and Pixium Vision (insolvency 2024) define the sector's
    commercialization difficulty.

sections:
  - id: financing-history-capital-stack
    title: Financing History and Capital Stack
    body: |
      Science Corporation has raised approximately $490 million since its 2021 founding across at least three
      documented capital events. The most recent is the March 2026 oversubscribed $230 million Series C led
      by Lightspeed Venture Partners and Khosla Ventures, with additional participation from Y Combinator,
      IQT (In-Q-Tel), and Quiet Capital; all five were repeat investors, indicating continuity of conviction
      rather than entry by new validators. The round carried a post-money valuation of approximately $1.5
      billion, ranking Science Corp as the second most capitalized dedicated brain-implant startup after
      Neuralink. Prior to the Series C, the company raised a $104 million convertible note in April 2025 led
      by Khosla Ventures. The terms of that note—cap, discount rate, and conversion mechanics—were not
      publicly disclosed, and whether the note converted at the Series C closing or remains as an outstanding
      obligation is unknown. Individual round sizes for Series A and Series B are not publicly reported,
      leaving the full round-by-round dilution progression opaque for diligence. The oversubscribed outcome
      and the rapid cadence from note (April 2025) to equity round (March 2026) signal strong investor
      demand, but the undisclosed cap table structure prevents independent verification of founder dilution,
      preference stack depth, or investor liquidation priorities. With $490 million deployed before first
      commercial revenue, Science Corp's total capital commitment places it firmly in the capital-intensive
      tier of clinical-stage medtech, where raising funds is a necessary but insufficient condition for
      commercial success.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI030, CI031]
    tableRefs: [TI002]
    figureRefs: [FI003]

  - id: capital-intensity-manufacturing
    title: Capital Intensity and Manufacturing Buildout
    body: |
      Science Corporation's capital intensity is anchored by two mutually reinforcing cost centers:
      clinical-stage R&D (trials, regulatory submissions, and a growing engineering workforce) and a
      purpose-built semiconductor fabrication infrastructure. The Science Foundry division occupies a MEMS
      facility in Research Triangle Park, Durham, NC, originally acquired from French company MEMSCAP in
      2022. Science Corp is investing up to $65 million to expand this facility by 57,000 square feet;
      Durham County commissioners unanimously approved a $930,000 ten-year performance-based incentive award
      conditioned on meeting job-creation and investment targets. The expansion is expected to create more
      than 50 new jobs, approximately two-thirds requiring a two-year degree or less, reflecting a
      manufacturing-floor rather than pure-research workforce composition. Most medtech peers outsource MEMS
      production; Science Corp's in-house capability is designed to reduce iteration cycles, lower long-run
      unit costs, and eliminate single-source supply risk. The foundry also offers third-party MEMS services
      to other medical and BCI device companies, creating a nascent secondary revenue stream. The $65 million
      foundry capex is incremental to ongoing R&D and clinical expenses, making total annual cash consumption
      structurally higher than asset-light or outsourced-manufacturing peers. The capex commitment was
      announced in mid-2024 and is being executed concurrently with the PRIMA commercialization push,
      indicating simultaneous manufacturing scale-up and clinical progress—a deliberate but capital-intensive
      strategic choice that requires sustained investor confidence across multiple milestone gates.
    claimRefs: [CI010, CI011, CI012, CI013, CI032, CI033]
    tableRefs: [TI003]
    figureRefs: [FI004]

  - id: revenue-model-reimbursement
    title: Revenue Model and Reimbursement Landscape
    body: |
      Science Corporation is pre-revenue in the United States as of mid-2026. PRIMA's commercial launch was
      targeted for Europe later in 2026 following CE Mark submission; if achieved, this would make Science
      Corp the first BCI company to place a vision-restoration product on a commercial market. No list price,
      hospital purchase price, or procedure cost has been publicly disclosed by Science Corp. The nearest
      historical benchmark is the Argus II (Second Sight), which carried a device-only list price of
      approximately $145,000, a dedicated CMS reimbursement code (C1849), and total episode costs (device,
      surgery, and rehabilitation) of $200,000–$300,000. For PRIMA in Europe, Pixium Vision's pre-insolvency
      pricing was cited in the range of €80,000–€100,000 device-only. U.S. reimbursement is structurally
      uncertain: Anthem's April 2026 coverage policy explicitly classifies all artificial retinal devices as
      investigational and not medically necessary for all indications—representing the current default major
      payer stance rather than an outlier. CMS and FDA jointly announced the RAPID coverage pathway in April
      2026, designed to accelerate Medicare coverage of Breakthrough Device-designated products to within
      60–90 days post-FDA approval, but PRIMA's Breakthrough Device designation status is unconfirmed in
      public records as of the research date. New implant procedures typically require custom HCPCS billing
      codes; the Review of Ophthalmology's 2026 coding update confirms that coverage for artificial retinal
      prostheses remains payer-specific. The CMS 2026 OPPS final rule brings only modest payment increases
      for complex intraocular procedures, with APC-average reimbursement around $4,222—far below the
      expected device purchase cost, reinforcing the reimbursement gap that must be resolved before US
      commercial adoption can scale.
    claimRefs: [CI007, CI008, CI014, CI015, CI016, CI017, CI018, CI019, CI028, CI029, CI035, CI036, CI037]
    tableRefs: [TI001, TI005]
    figureRefs: [FI001]

  - id: unit-economics-private-gaps
    title: Unit Economics Framework and Private Metric Gaps
    body: |
      Science Corporation has not publicly disclosed any revenue, ARR, gross margin, cost of goods sold,
      customer acquisition cost, payback period, or net revenue retention. The company remains pre-commercial
      in the United States, and all unit economics are either pre-determined estimates or proprietary
      information accessible only under NDA. Industry benchmarks for subretinal devices in pilot
      manufacturing volumes suggest per-unit COGS of $5,000–$12,000, declining materially with volume
      automation and supply-chain maturation. Science Corp's vertical MEMS integration may confer a
      structural COGS advantage once scale is achieved, but the $65 million foundry expansion is a sunk
      capital outlay that only pays back through device volumes not yet attained. The ABCMoney investment
      analysis estimates that reaching $500 million or more in annual revenue within 7–10 years would be
      required to justify the $1.5 billion entry valuation at typical medtech exit multiples, implying
      thousands of PRIMA procedures annually at $50,000+ per procedure—aggressive but not implausible if
      reimbursement is established and the AMD addressable population is accessed at scale. Sales cycle
      economics for PRIMA will differ fundamentally from SaaS metrics: physician training costs, hospital
      capital equipment procurement cycles, and individual payer coverage determinations will dominate
      customer acquisition cost. Standard SaaS or marketplace unit economics (NRR, quick ratio, burn
      multiple) are not applicable to the one-time implant model. No public description of Science Corp's
      GTM approach for the EU launch has been issued in commercial terms as of mid-2026, making independent
      assessment of sales efficiency impossible at this stage.
    claimRefs: [CI014, CI016, CI025, CI026, CI027, CI028, CI032, CI039]
    tableRefs: [TI004]
    figureRefs: [FI002]

  - id: adverse-financial-risks
    title: Adverse Evidence and Financial Risk Factors
    body: |
      The most salient adverse evidence for Science Corp's financial model is the commercialization track
      record of its three immediate predecessors. Second Sight Medical Products invested more than $300
      million over 24 years in its Argus II retinal prosthetic, generating less than $32 million in
      cumulative revenue before its abrupt 2019 halt, which left hundreds of implant recipients worldwide
      without product support. Pixium Vision, the original PRIMA developer, entered judicial liquidation in
      early 2024 after exhausting its capital; Science Corp acquired its assets under court supervision.
      Retina Implant AG dissolved in 2019 after Alpha AMS failed to reach commercial scale. Each predecessor
      had credible clinical science but could not bridge from trial data to commercial revenue at scale.
      The reimbursement barrier is structural: Anthem's 2026 policy—classifying all artificial retinal
      devices as investigational and not medically necessary—represents the dominant payer stance until
      large-scale clinical outcomes data and standardized CPT codes are in place. BCI sector fundraising set
      a Q1 2026 record at $960 million and Science Corp's oversubscribed Series C confirms current investor
      appetite, but VC funding is episodic; a clinical setback, regulatory delay, or macro-tightening could
      compress available runway materially. MedTech Impact Partners warns that the proposed CMS repeal of
      the NTAP alternative payment pathway by FY2028 would raise the evidence bar for hospital add-on
      payments, narrowing the reimbursement window for devices not yet covered by that date. With $490
      million raised across multiple preferred-share tranches, investor liquidation preferences could
      materially compress common-stock and founder returns in adverse exit scenarios, and the opaque
      cap table precludes independent assessment of this risk.
    claimRefs: [CI017, CI021, CI022, CI023, CI024, CI030, CI034, CI038]

