  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: >
        Science Corp's actual burn rate, cash balance, monthly cash consumption, and capital deployment
        plan are not publicly disclosed; without these, runway adequacy and capital sufficiency cannot
        be independently verified.
      whyItMatters: >
        Unknown burn rate prevents independent assessment of whether the $230M Series C provides
        adequate runway through PRIMA EU commercial launch, FDA approval, and US commercialization.
        The foundry capex is an additional material draw that may compress runway materially.
      diligencePath: >
        Request quarterly cash-flow statements and 24-month burn bridge from management under NDA;
        reconcile against publicly announced capital commitments (foundry, clinical trials).
      relatedQuestionRefs: [QI010, QI017]

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >
        PRIMA device ASP, COGS, gross margin, CAC, and payback period are all undisclosed; unit
        economics cannot be modeled from public information alone.
      whyItMatters: >
        Without COGS and ASP, gross margin cannot be estimated; without gross margin, the revenue
        volume required for operating profitability is unknown. This prevents fundamental financial
        underwriting of the PRIMA commercial launch.
      diligencePath: >
        Request bill-of-materials, manufacturing cost schedule, and forward COGS projections under NDA;
        triangulate with independent foundry cost benchmarks and EU pilot pricing from Science Corp.
      relatedQuestionRefs: [QI014, QI019, QI021]

    - type: private-evidence-only
      severity: material
      topic: capital-structure
      missingEvidence: >
        Cap table, investor preference waterfall, convertible note conversion terms, and post-Series-C
        fully-diluted share count are not publicly available.
      whyItMatters: >
        Undisclosed liquidation preferences from $490M raised across multiple tranches could compress
        common-stock and founder returns in below-expectations exit scenarios; convertible note
        conversion terms may represent additional dilution not visible in reported equity rounds.
      diligencePath: >
        Request full cap table, investor term sheets summary, convertible note agreement, and
        liquidation waterfall modeling under NDA; verify Series C flow-of-funds reconciliation.
      relatedQuestionRefs: [QI004, QI023, QI025]

    - type: missing-source
      severity: material
      topic: reimbursement
      missingEvidence: >
        PRIMA's FDA Breakthrough Device designation status is unconfirmed in public records; CMS
        coverage determination under the RAPID pathway cannot be projected without knowing designation
        status.
      whyItMatters: >
        RAPID pathway access—which would accelerate Medicare coverage to 60–90 days post-FDA
        approval—requires Breakthrough Device designation; if PRIMA lacks it, the primary US
        reimbursement acceleration mechanism may be unavailable, extending the revenue gap
        post-FDA approval.
      diligencePath: >
        Confirm Breakthrough Device designation status with Science Corp management and through
        FDA CDER/CDRH breakthrough device database; clarify whether RAPID application has been
        submitted.
      relatedQuestionRefs: [QI016]
