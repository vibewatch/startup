  topStrengths:
    - PRIMAvera 枢纽试验发表于 NEJM，覆盖 17 个中心、38 名患者，患者成功率 80%——这是植入式视觉恢复设备迄今公开发表的最高质量临床证据。
    - 商业化先发位置明确：CE Mark 申请正在审评，可能在 2026 年中作出决定；若获批，Science Corp 将成为全球第一家把产品推向市场的 BCI 公司。
    - FDA Breakthrough Device 认定叠加 2026 年 4 月 RAPID Coverage Pathway，形成 FDA 批准与 Medicare 覆盖同步推进的机制，显著压缩历史上的获批后报销缺口。
    - 创始人与运营团队有经验：Hodak、Mardinly 带来 Neuralink 背景，监管终局前又加入来自 Butterfly Network、具备商业 medtech 深度的 Shahida。
    - Research Triangle Park 的自有 MEMS foundry 带来制造差异化，降低供应链风险，也创造此前视网膜假体公司没有的平台可选性。
    - 资本储备充足（累计融资 $490M，$230M Series C 超额认购），公司称现金跑道足以支撑到 CE Mark 商业发布，短期没有立刻稀释压力。
  topRisks:
    - 三家已获 CE 标志的前代视网膜假体公司——Second Sight（Argus II）、Pixium Vision（PRIMA）和 Retina Implant AG——都拿到监管许可却商业失败，行业先验是 0/3。
    - EU MDR 下 CE Mark 决定时间不确定；若被拒或 RFI 把审评拖过 2027 年 Q2，将实质打击商业化时间线和投资者信心。
    - 报销基础设施缺位：Anthem 2026 年政策把所有人工视网膜设备列为 investigational；欧盟关键市场按国别推进 HTA，通常在 CE Mark 后还要 12–36 个月。
    - 公司收入为零，股权结构优先权堆叠、可转债转换条款和清算瀑布均未披露，真实投资者经济性不透明；$1.5B post-money 标记可能高估普通股价值。
    - 关键人集中在 CEO Max Hodak 身上：科学愿景、投资人关系、监管策略和主要公开发言人角色都由他同时承担。
    - 平台化分心风险存在：biohybrid 神经接口、Science Eye optogenetic 项目和 foundry 建设并行推进，在需要集中执行 PRIMA 的阶段分散管理层注意力和资本。
  unresolvedGaps:
    - BSI 的 CE Mark 结果，以及德国 / 欧盟首次商业发布时点，是近期信息量最高的催化剂；截至 2026 年 6 月状态仍未确认。
    - 股权结构、优先权堆叠深度、参与权和清算瀑布未公开披露；Series C close 时可转债转换机制仍未知。
    - 美国 FDA PMA 决定仍在等待；与 FDA/CMS 就 RAPID Coverage Pathway 互动的时间线未公开确认；FDA 原始记录中的 Breakthrough Device 认定应独立核验。
    - 欧盟发布的定价和报销条款未披露；德国首发市场准入模型、ASP 和手术报销代码可用性都是关键未知项。
    - 12 个月以上 PRIMA 长期安全性和耐久性数据尚未发表；仍需要 36 个月随访，以及植入眼与对侧眼地理萎缩进展数据。
    - 员工数（约 150 人）来自单一分析师估计；官方员工数和组织结构未公开披露。
