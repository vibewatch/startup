  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - CE Mark rejection or RFI delay
        - BSI issues an RFI in 2026 or formal rejection; approval pushed past Q2 2027
        - Eliminates first-mover premium and delays entire EU commercial thesis by 12–24 months; shifts to base or bear
        - Reassess position; demand pre-submission meeting notes; consider entering at lower valuation post-delay
      - - EU commercial revenue missing below target
        - <5 procedures per quarter at 6 months post-CE Mark approval in Germany
        - Signals physician adoption barrier, reimbursement friction, or patient pipeline problem; base case degrades to bear
        - Demand commercial detail (site count, reimbursement confirmations, backlog); suspend further commitment
      - - FDA not-approvable letter or new trial required
        - FDA issues complete response letter requiring new pivotal trial or significant data supplement
        - US revenue thesis delayed 3–5 years; raises burn rate; may require emergency bridge financing
        - Exit or reduce at favorable price; US revenue no longer anchors exit valuation within 5-year hold
      - - Adverse reimbursement decision
        - CMS issues a formal non-coverage determination (NCD) for subretinal prosthetics, or RAPID pathway denied
        - US reimbursement path becomes multi-year advocacy process; bull case collapses to base or bear
        - Reframe as a pure EU play at proportionally lower valuation; reassess entry discipline
      - - Key executive departure
        - Max Hodak (CEO) or Alan Mardinly (CSO) departs within 12 months without a clear successor
        - Impairs regulatory credibility, investor confidence, and clinical network access; raises probability of down-round
        - Accelerate diligence on succession plan and board composition; put on watch list
    notes: >
      Triggers are defined as observable, external events — not internal forecasts. Thresholds were set
      using publicly available sector precedent (Second Sight, Pixium) and medtech FDA review statistics.
      Not exhaustive; clinical safety signals, manufacturing non-conformances, or significant IP challenges
      could also break the thesis.
    claimRefs:
