        - 5M+ GA/AMD patients globally; expansion to Stargardt/RP; BCI market $3.2B (2025) growing to $12.9B (2034)
        - Reimbursement-limited accessible market; only patients where surgery is appropriate; gene therapy competing for indications
        - CMS NCD for subretinal prosthetics; EU reimbursement confirmed in ≥2 markets within 12 months of CE Mark
