  - id: recommendation-diligence-asks
    title: Recommendation and Final Diligence Asks
    body: |
      Recommendation: TRACK (research-more posture). The investment thesis is coherent and partially
      de-risked by NEJM-quality clinical evidence, a credible first-mover commercial path, and a strong
      investor syndicate. The anti-thesis is structural: sector base rate of commercial failure, zero
      revenue disclosure, undisclosed cap-table preference stack, and a $1.5B entry that prices in
      partial bull-case execution. The risk rating is HIGH — binary regulatory outcomes dominate the
      valuation, and the predecessor sector failure rate (0 for 3 CE-marked retinal prosthetics companies
      achieving commercial sustainability) cannot be dismissed. Confidence is MEDIUM — the clinical
      evidence is strong, the regulatory process is advanced, but commercial execution evidence does not
      yet exist. At the $1.5B entry price, the risk/return is marginal given the expected-value gap.
      Thesis-break triggers include: CE Mark rejection or RFI delaying approval past Q2 2027; EU launch
      revenue tracking below 5 procedures per quarter at 6 months post-launch; FDA issuing a not-approvable
      letter or requesting a new pivotal trial; or any two founding executives departing within 12 months.
      Diligence should prioritize the cap table, preference stack, and convertible note treatment to
      assess effective entry economics before any investment commitment. CE Mark approval outcome and
      Germany first pricing/reimbursement data are the single highest-information near-term catalyst.
      The RAPID pathway engagement timeline with FDA/CMS and any confirmed Breakthrough Device
      designation from the FDA primary record should be independently verified. A revised entry
      valuation of $1.0B–$1.2B (at next round or secondary) would substantially improve the
      expected-value math.
