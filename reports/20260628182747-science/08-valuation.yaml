  - id: comparable-valuation-analysis
    title: Comparable Valuation Analysis
    body: |
      Stage-adjusted medtech logic — not SaaS multiples — is the correct valuation framework for
      Science Corp. For commercial medtech hardware companies in 2026, EV/Revenue multiples are
      3.5–5.5x and EV/EBITDA multiples are 11–14x (per healthcare.digital's 2026 M&A matrix and
      Equidam's 2026 industry EBITDA survey). Applied to an assumed first-full-year EU revenue of
      $50M–$80M in 2027–2028 at a 35–40% gross margin, these multiples yield an enterprise value
      range of roughly $175M–$440M — well below $1.5B. The valuation premium is supported by three
      non-multiple factors: (1) first-mover and winner-take-most dynamics in BCI vision restoration;
      (2) platform optionality from biohybrid, foundry, and Science Eye programs; and (3) Bain-tracked
      2025 medtech M&A activity reaching $97.6 billion, with strategic buyers paying 15–25x EBITDA
      for category-leading devices. The BCI peer set provides the most directly relevant comps: Neuralink
      at $9.6B post-Series E (May 2025, $656.5M raised, 6x the Science Corp valuation), Synchron at
      approximately $1B post-Series D (November 2025, $345M total raised), and Precision Neuroscience
      at approximately $500M post-Series C (December 2024, $155M total raised). Science Corp's $1.5B
      at $490M total raised compares favorably on capital efficiency: Synchron's implied ~$1B post-$345M
      total is roughly 2.9x total raised, whereas Science's $1.5B on $490M is 3.1x — nearly equivalent,
      but Science Corp has substantially better clinical evidence and a clearer near-term commercial
      path. The ophthalmology M&A comps are less useful because they involve established revenue-generating
      platforms (Cencora's $4.6B acquisition of Retina Consultants of America at 15–23x EBITDA), but
      they do confirm that strategic buyers in retina have been willing to pay high multiples for
      differentiated platforms. The historical retinal prosthetics failures (Second Sight peak market
      cap ~$100M; Pixium acquired for ~€4M; Retina Implant AG discontinued) define the sector's
      downside scenario rather than its exit multiple.
