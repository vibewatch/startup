        - 24-month GA progression (8.5 mm² implanted vs 2.5 mm² fellow eye); SAE rate 50%; no long-term durability data beyond 36 months
        - Long-term efficacy data (48+ months); low SAE rate at commercial scale; DSMB continued recommendation
      - - Regulatory path
        - CE Mark submitted June 2025; FDA Breakthrough Device; RAPID pathway available April 2026; first BCI on market possible mid-2026
        - CE Mark decision unpredictable under EU MDR; FDA PMA 180 days + possible AI extension; Breakthrough does not lower evidence bar
