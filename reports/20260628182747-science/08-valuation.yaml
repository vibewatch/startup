chapter:
  number: 8
  title: Valuation
  summary: >
    Science Corporation's March 2026 $1.5B post-money valuation for its $230M oversubscribed
    Series C sits at a meaningful premium to a probability-weighted medtech fundamental case (~$1.1B–$1.25B
    range) but within plausible reach of the bull scenario if CE Mark approves in H2 2026, EU commercial
    ramp executes, and FDA Breakthrough pathway accelerates. The most relevant BCI peers — Neuralink at
    $9.6B post-Series E, Synchron at ~$1B post-Series D, and Precision Neuroscience at ~$500M
    post-Series C — frame Science as the most commercially advanced sub-BCI subretinal play with the
    clearest near-term revenue path. However, the sector's three predecessor CE-marked retinal
    prosthetics companies (Second Sight, Pixium Vision, Retina Implant AG) all failed commercially,
    establishing a brutal base rate. Zero revenue disclosure, undisclosed cap-table preference stack,
    unresolved US reimbursement infrastructure, and the weight of private-market mark inflation in a
    2025 frothy VC cycle reinforce caution. Recommendation: TRACK with a research-more posture until
    CE Mark outcome, German launch pricing, and an EU reimbursement signal are confirmed; at the right
    entry price ($1.0–$1.2B), the risk/return improves materially. Confidence: medium; Risk: high.

sections:
  - id: valuation-context-round-terms
    title: Valuation Context and Round Terms
    body: |
      Science Corporation closed its Series C in March 2026 at a $1.5 billion post-money valuation,
      raising $230 million in what the company described as an oversubscribed round — a demand signal
      that implies the company had the ability to raise more or turn away capital. Investors included all
      five repeat participants from earlier rounds: Lightspeed Venture Partners, Khosla Ventures,
      Y Combinator, IQT (In-Q-Tel), and Quiet Capital. Repeat-only investor composition removes the
      independent validation that a new lead investor might provide, but also signals sustained conviction
      from sophisticated deeptech investors who have observed the company's progress firsthand. Total
      capital raised since the 2021 founding is approximately $490 million, placing Science among the
      best-capitalized private BCI companies globally behind Neuralink. The previous financing event
      was a $104 million convertible note led by Khosla in April 2025; neither the note's conversion
      cap, discount rate, nor conversion mechanics were publicly disclosed. Whether the note converted
      at Series C close or remains as outstanding obligations that affect the effective post-money
      valuation calculation is unknown. The full cap table structure — including individual investor
      ownership percentages, preference stack depth, participation rights, and liquidation waterfall —
      has not been publicly disclosed, making independent verification of the $1.5B figure's economic
      meaning to each stakeholder impossible without NDA-protected access. The oversubscribed outcome
      in a quarter when overall medtech VC volume cooled from its 2025 peak is a positive signal, but
      the absence of independent pricing discipline (no new lead investor, no disclosed valuation
      methodology) limits the information content of the price mark.
