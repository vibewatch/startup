callouts:
  - calloutType: risk
    title: Predecessor sector failure rate is the primary valuation risk anchor
    body: >
      All three CE-marked retinal prosthetics companies that preceded Science Corp — Second Sight
      (Argus II, FDA and CE approved), Pixium Vision (Prima Alpha CE approved), and Retina Implant AG
      (Alpha IMS CE approved) — failed commercially without achieving sustainable revenue, despite
      regulatory clearance. This is not a valuation footnote; it is the single strongest prior against
      which every bull-case assumption must be tested. Science Corp has better clinical data, more
      capital, and stronger manufacturing capability than any predecessor, but the structural
      reimbursement and adoption barriers that destroyed three prior companies are not yet resolved.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
  - calloutType: recommendation
    title: Entry price materially changes the risk/return profile
    body: >
      At $1.5B (March 2026 Series C), the probability-weighted expected value (~$1.0–$1.25B) implies
      a negative expected return before accounting for time value and dilution. At $1.0–$1.2B
      (available via secondary purchase or next-round entry), the same scenario distribution implies
      a positive expected return of 8–25% above entry. CE Mark approval and German launch pricing are
      the two observable catalysts that would justify moving from TRACK to BUY.
    claimRefs:
      - CV027
      - CV030
      - CV037

