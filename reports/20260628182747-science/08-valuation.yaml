  - id: exit-readiness-pathway
    title: Exit Readiness and Strategic Pathway
    body: |
      Science Corporation is not IPO-ready as of mid-2026 by standard public-market criteria: it has
      no revenue, no disclosed unit economics, and is pre-commercial in all markets. The IPO window
      that reopened for medtech with EdgeMedical's $2.2B surgical robotics listing in January 2026
      requires at minimum commercial revenue and visible profitability trajectory. A realistic IPO
      window for Science Corp is 2028–2031, conditional on EU commercial launch execution, US FDA
      approval, and a minimum of 12–18 months post-approval commercial traction generating $50M+
      annualized revenue. The more likely near-term exit pathway is strategic acquisition by a large
      medtech or pharma platform. Strategic acquirers with the strongest strategic fit include Medtronic
      (neurology portfolio), Boston Scientific (which acquired Penumbra for $14.5B in January 2026 to
      build neuro/vascular capabilities), Johnson & Johnson MedTech (retina and device platform),
      and Abbott (diagnostics and neuromodulation). A strategic acquisition would likely be triggered
      by FDA approval and at least one year of commercial revenue, implying a 2029–2031 transaction
      window. The absence of secondary market liquidity data, disclosed SPAC discussions, or investment
      bank engagement makes it impossible to assess the company's current exit posture. Any acquirer
      due diligence would need to resolve the preference stack and convertible note treatment to
      determine actual proceeds distribution to various stakeholder classes.
