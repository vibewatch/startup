  - id: funding-investors-valuation
    title: Funding History, Investors, and Valuation
    body: |
      Science Corporation has raised approximately $490 million across four known financing
      events since its 2021 founding. A Series A of approximately $47.3 million was closed in
      July 2021, followed by a Series B of approximately $113 million in November 2022. A $104
      million convertible note led by Khosla Ventures was raised in approximately April 2025,
      likely timed to bridge toward the NEJM publication milestone and CE Mark submission.
      The flagship $230 million Series C was closed in March 2026, with participation from
      Khosla Ventures, Lightspeed Venture Partners, Y Combinator, IQT (the venture arm of the
      U.S. intelligence community), and Quiet Capital — all pre-existing investors — in a round
      that was oversubscribed with demand exceeding capital requirements. The Series C implies
      a post-money valuation of approximately $1.5 billion, making Science one of the most
      highly capitalized private BCI companies globally at this stage. Capital is earmarked for
      PRIMA's European commercialization, manufacturing scale-up, and advancement of pipeline
      programs including the biohybrid neural interface and Vessel perfusion platform. The
      company has publicly stated its imperative is to "become the first BCI company to scale
      and achieve profitability." Full investor lists for the Series A and B remain undisclosed.
