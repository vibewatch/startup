  - id: leadership-governance
    title: Leadership and Governance
    body: |
      Science's executive team is led by co-founders with Neuralink pedigrees supplemented by
      commercial hires added ahead of the PRIMA regulatory endgame. Max Hodak, CEO and co-founder,
      previously co-founded and served as president of Neuralink before departing in May 2021 to
      establish Science Corporation. Alan Mardinly, PhD, co-founder and Chief Scientific Officer
      (appointed December 2025), brings a Harvard neurobiology PhD and over 15 years of
      neuroscience research experience including prior leadership roles at Neuralink. Darius
      Shahida, appointed Chief Strategy Officer in December 2025, previously helped raise over
      $1 billion at Butterfly Network, providing directly applicable large-scale medtech
      commercialization experience. Frank Brodie, MD, was appointed Medical Director for Vision
      and PRIMA in December 2025, taking ownership of the U.S. clinical and regulatory pathway.
      Ralf Hornig, PhD, directs clinical affairs, having prior European BCI program experience.
      Matthias Wagner leads biohybrid device development. Board composition has not been
      publicly disclosed; no formal succession plan or key-person insurance for the CEO position
      has been publicly confirmed. Key-person concentration is highest in Max Hodak, who holds
      the scientific vision, investor relationships, regulatory strategy, and primary media
      spokesperson roles.
