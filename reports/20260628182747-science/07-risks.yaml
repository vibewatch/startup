slug: science
runDate: "2026-06-28"
company:
  name: Science Corporation
chapter:
  number: 7
  title: Risks
  summary: >
    Science Corporation faces a concentrated risk stack that is common to clinical-stage
    medtech but is amplified by the structural fragility of the retinal prosthetics
    sector. The primary risks are: FDA PMA and EU CE mark approval timing; clinical
    safety signals in the PRIMAvera trial (26 SAEs in 50% of patients, including
    geographic atrophy acceleration); the absence of any CMS reimbursement pathway for
    subretinal implants; ISO 13485 manufacturing maturity; single-product concentration
    in PRIMA; key-person dependence on CEO Max Hodak; and platform distraction from
    biohybrid and foundry programs. The collapse of Second Sight, Pixium Vision, and
    Retina Implant AG establishes that regulatory clearance alone does not guarantee
    commercial viability for retinal prosthetics — reimbursement infrastructure must
    arrive simultaneously. The FDA/CMS RAPID Coverage Pathway (April 2026) materially
    reduces reimbursement tail risk if PRIMA receives Breakthrough Device treatment,
    but this pathway is untested for implantable visual prostheses. With $490M raised
    and an estimated 7-8 year runway, Science has time — but only if FDA approval and
    commercial adoption stay on a concurrent track.

sections:
  - id: regulatory-approval-risk
    title: "Regulatory Approval Risk: FDA PMA and EU CE Mark"
    body: >
      Science Corporation's near-term commercial viability depends entirely on two
      parallel regulatory outcomes: FDA Pre-Market Approval for the US market and
      CE mark confirmation for the European market. Neither approval is guaranteed,
      and both carry timing uncertainty that could delay commercialization by one to
      three years beyond current projections. FDA Breakthrough Device designation
      (secured 2023) accelerates interactions and review scheduling, but does not
      reduce the evidentiary threshold for safety and effectiveness. The FDA PMA
      pathway for a Class III implantable device typically takes 180 days for
      substantive review after filing, and the Agency reserves the right to issue
      Additional Information requests that can extend this by 12 months or more.
      Science's CE mark application, submitted to BSI with approximately 60 gigabytes
      of documentation in June 2025, is under EU MDR review and a decision has not
      been confirmed as of June 2026. The EU Medical Device Regulation (2017/745)
      imposes post-market clinical follow-up requirements on Class IIb implants that
      Science must design into its commercial surveillance program before approval.
      The FDA and CMS jointly announced the RAPID Coverage Pathway in April 2026,
      which allows Breakthrough Devices to receive Medicare coverage concurrently
      with FDA approval rather than waiting the typical 6-18 months post-approval.
      This substantially mitigates reimbursement tail risk but requires Science to
      proactively engage with both agencies. The Humanitarian Use Device designation
      request, if granted, would allow PRIMA commercialization under a 8,000-patient
      annual ceiling with a reduced profit-limitation framework, providing a bridging
      mechanism between clinical trial and full commercial scale. Intellectual property
      risks are modest given the Palanker Lab patent portfolio acquired via Pixium,
      but freedom-to-operate validation remains an open diligence item for the
      subretinal photovoltaic pixel design space.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007]
    tableRefs: [TR001]
    figureRefs: [FR003]

  - id: clinical-safety-efficacy-risk
    title: "Clinical Safety and Efficacy Durability Risk"
    body: >
      The PRIMAvera pivotal trial reported 26 serious adverse events in 19 of 38
      patients — a 50% incidence rate — with four classified as severe: macular hole,
      retinal detachment, proliferative vitreoretinopathy, and ocular hypertension.
      Twenty-one of the 26 SAEs occurred within the first two months post-implant,
      consistent with a surgical-phase event profile rather than a chronic device
      failure mode. The Science Corp Data Safety Monitoring Board reviewed the 24-month
      data and recommended trial continuation without protocol modifications, a signal
      of acceptable benefit-risk balance for the DSMB. However, two specific signals
      will receive scrutiny in any FDA review. First, geographic atrophy area increased
      by 8.5 mm² in PRIMA-implanted eyes versus 2.5 mm² in fellow control eyes over
      24 months — a statistically significant difference that Science attributes to
      the surgical trauma of subretinal space entry and not to the photovoltaic chip
      itself. While visual acuity and letter-reading gains persisted despite this
      anatomical progression, the mechanism requires explanation in the PMA submission.
      Second, no long-term implant durability data beyond 36 months exists for any
      commercial subretinal photovoltaic device. PRIMA's second-generation chip design,
      which improved pixel density and biocompatibility, may effectively reset the
      durability clock relative to any pre-clinical or earlier cohort data. Analogous
      risks are visible in adjacent BCI development: Neuralink's first human trial
      recorded wire retraction from brain tissue in its initial implant in May 2024,
      illustrating that biotic-abiotic interface stability at long durations remains an
      open challenge across implantable neural devices. Science's subretinal placement
      differs mechanically from cortical arrays, but the fundamental challenge of
      maintaining a stable, biocompatible interface over decades is shared. Any FDA
      Additional Information request on GA progression or implant durability could
      add 12-24 months to the review timeline and require supplemental trial data.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR013, CR014, CR015]
    figureRefs: [FR001]

  - id: reimbursement-commercial-adoption-risk
    title: "Reimbursement and Commercial Adoption Risk"
    body: >
      The United States Centers for Medicare and Medicaid Services has no dedicated
      CPT code, coverage determination, or payment framework for implantable subretinal
      prostheses as of June 2026. Private payers typically follow CMS's lead: Anthem
      Blue Cross's DME.00052 policy already classifies brain-computer interface
      rehabilitation devices as investigational and not medically necessary, regardless
      of FDA review status. The GAO's 2025 BCI technology assessment (GAO-25-106952)
      found that BCI developers had historically found it difficult to engage with CMS
      about their devices, and that patients who received implants during clinical
      trials faced device explantation when trial funding ended — a structural risk
      that insurers and hospitals weigh when deciding whether to adopt a novel
      implantable platform. The April 2026 RAPID Coverage Pathway directly addresses
      this issue by allowing simultaneous FDA approval and Medicare coverage
      determination for Breakthrough Devices, but the pathway is new, has not yet
      been tested for any implantable visual prosthetic, and requires proactive
      co-engagement with the FDA and CMS that Science must initiate during the
      pre-submission phase. The absence of PRIMA commercial pricing in any public
      document makes it impossible to assess whether Science Corp's target price
      point is compatible with what hospitals, HTA bodies, or national payers will
      accept. Cochlear implant analogy suggests a $30,000-$100,000 device cost;
      retina-specific payer skepticism may set the acceptable ceiling lower. In
      Europe, Science must navigate country-by-country AMNOG and HTA processes
      for reimbursement after CE mark — a process that has typically taken 12-36
      months for novel implantable devices. The downstream private-payer vacuum
      created by CMS inaction amplifies this risk: without a US coverage signal,
      European payers have no precedent to reference when setting reimbursement
      rates, and Science's commercial launch timeline becomes dependent on
      whichever market's payer infrastructure materializes first.
    claimRefs: [CR016, CR017, CR018, CR019, CR020, CR021, CR022]

  - id: manufacturing-operational-risk
    title: "Manufacturing, Operational, and Quality Systems Risk"
    body: >
      Science Corporation is building a manufacturing facility in Durham, North
      Carolina with a $65 million investment announced in 2024, targeting 150+
      new jobs in life-sciences manufacturing. The PRIMA chip is a photovoltaic
      CMOS/MEMS device whose fabrication relies on semiconductor foundry processes;
      Science's in-house foundry business (offering custom chip manufacturing to
      external BCI clients) serves dual roles as both a revenue diversification
      vehicle and the primary manufacturing platform for PRIMA arrays. The 21 CFR
      Part 820 Quality System Regulation and its international counterpart ISO
      13485:2016 require comprehensive design controls, process validation records,
      and corrective-action systems for implantable device manufacturers. Science's
      CE mark submission reportedly includes approximately 60 gigabytes of quality
      system documentation, suggesting an advanced quality management posture — but
      no public confirmation of ISO 13485 certification for the Durham facility has
      been identified in research conducted for this chapter. A manufacturing
      non-conformance finding during a pre-approval inspection could trigger a
      production hold or require a PMA supplement, potentially delaying commercial
      launch by 12-24 months. Supply chain concentration in the CMOS/MEMS fabrication
      supply chain — particularly for the specialty photovoltaic pixel processes that
      distinguish PRIMA from standard CMOS — represents an additional operational
      risk not fully mitigated by the in-house foundry capability. The hardware
      foundry's external client business may also compete for fab capacity and
      engineering talent during the critical PRIMA commercial ramp period.
    claimRefs: [CR023, CR024, CR025, CR026, CR027, CR028]
    tableRefs: [TR002]

  - id: strategic-concentration-key-person-risk
    title: "Strategic Concentration, Key-Person, and Platform Distraction Risk"
    body: >
      Science Corporation operates four distinct program areas — PRIMA retinal
      implant, biohybrid neuroscience, hardware foundry, and Vessel (wearable BCI
      hub) — with approximately 150 employees as of March 2026. PRIMA is the sole
      program with clinical data and a near-term revenue path; all other programs
      are pre-clinical or pre-revenue. This concentration means that regulatory
      delay, clinical setback, or commercial failure in PRIMA would eliminate the
      primary revenue thesis without an alternative near-term fallback. Max Hodak,
      co-founder of Neuralink and CEO of Science Corp, is the company's primary
      public face and chief strategic architect. TIME Magazine named Hodak to its
      2026 TIME100 Health list, underscoring his profile — but public succession
      plans and key-person insurance arrangements have not been disclosed. The
      departure of Hodak or Chief Scientific Advisor Jacques-Alain Sahel (one of
      the world's leading retinal prosthetics researchers and a co-author on key
      PRIMA clinical papers) would likely impair regulatory credibility, clinical
      network access, and investor confidence. The biohybrid brain sensor program
      targets first-in-human implantation before 2027, per comments from Yale
      collaborator Murat Günel; while scientifically compelling, this program
      requires dedicated engineering and clinical trial infrastructure that competes
      with PRIMA development for talent and management attention. Science Corp's
      $490M total funding and estimated $20-30M annual burn rate imply a 7-8 year
      runway — sufficient for a 3-year regulatory timeline — but capital intensity
      of commercialization, including surgeon training programs, post-market
      surveillance infrastructure, and US facility build-out, may compress this
      estimate. The Vessel platform adds a fourth regulatory and commercial pathway
      that further dilutes organizational focus at a stage when PRIMA urgently
      requires concentrated execution.
    claimRefs: [CR029, CR030, CR031, CR032, CR033, CR034, CR035, CR036]
    tableRefs: [TR003, TR004]
    figureRefs: [FR002]

  - id: sector-precedent-kill-criteria
    title: "Sector Precedent, Structural Risk, and Kill Criteria"
    body: >
      The retinal prosthetics sector has a consistent record of commercial failure
      despite clinical proof of concept. Second Sight Medical Products abandoned its
      Argus II bionic eye product line in 2019, leaving more than 350 patients with
      unsupported implants; the case of Barbara Campbell — whose Argus II failed
      inside a New York City subway station, rendering her suddenly blind in an
      already dangerous environment — became the exemplar of what happens when a
      medtech company exits without a device-continuity plan. Pixium Vision entered
      Paris Commercial Court liquidation in 2024 and was acquired by Science for
      approximately €4 million, demonstrating that even CE-marked devices cannot
      generate sufficient commercial revenue to sustain a standalone company without
      reimbursement support. Retina Implant AG discontinued operations after 16 years
      of development, citing an innovation-hostile regulatory and reimbursement
      climate. Science Corp's PRIMA design differs fundamentally from these
      predecessors — subretinal photovoltaic stimulation targeting partially sighted
      patients rather than fully blind subjects, with no external wire and a
      dramatically simpler surgical technique — but the structural risks of payer
      skepticism, limited long-term durability evidence, and small addressable patient
      populations are shared. The GAO flagged ethical and privacy risks in BCI
      technology — including data security, cognitive liberty, and the risk of
      "neurosurveillance" — as among the 12 most pressing policy challenges for the
      sector; these concerns are intensified by the fact that PRIMA connects to a
      wearable AI-processing unit that captures continuous visual field data. An
      institutional payer catch-22 compounds these structural risks: limited
      commercial revenue depresses the clinical evidence base required for positive
      coverage determinations, while coverage gaps prevent the commercialization
      needed to generate that evidence. Monitorable kill criteria include: (1) FDA
      refuses to file the PMA or issues a non-approvable letter; (2) the RAPID
      pathway CE mark or CMS coverage determination is delayed beyond 2029; (3) a
      third severe SAE type emerges in the extended PRIMAvera data; (4) Hodak
      departs without a disclosed succession plan; and (5) Series D funding cannot
      be raised within 24 months of Series C at a flat or up-round valuation.
    claimRefs: [CR037, CR038, CR039, CR040, CR041, CR042]
    tableRefs: [TR005]

