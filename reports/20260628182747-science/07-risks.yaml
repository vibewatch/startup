callouts:
  - calloutType: risk
    title: "Regulatory-Reimbursement Catch-22: Approval Without Access is Not Enough"
    body: >
      The defining commercial risk for Science Corporation is not regulatory approval
      alone — it is the combination of regulatory timing and reimbursement infrastructure.
      Second Sight had regulatory clearance for Argus II; it had no durable reimbursement
      pathway. Pixium Vision had CE mark for Prima Alpha and PRIMA; it could not generate
      enough revenue to survive. Science Corp's PRIMA design is meaningfully superior to
      both predecessors, but the structural challenge is identical: a device that costs
      tens of thousands of dollars to implant, with ongoing rehabilitation requirements,
      cannot be commercially adopted without hospital certainty that payers will cover it.
      The RAPID Coverage Pathway announced in April 2026 directly addresses this
      catch-22 — but only if Science actively enrolls and CMS processes its coverage
      determination concurrently with the FDA review. Any slip in this coordination
      creates the same 6-18 month post-approval dead zone that has historically blocked
      novel device adoption.
    claimRefs: [CR016, CR017, CR018, CR037, CR038, CR039, CR042]

  - calloutType: risk
    title: "Sector Mortality Rate: Three of Three Predecessors Failed Commercially"
    body: >
      Every developer of a subretinal or epiretinal implant that achieved clinical proof
      of concept before Science Corporation ultimately exited the commercial market:
      Second Sight (epiretinal, US, abandoned 2019), Pixium Vision (subretinal,
      France, liquidated 2024), and Retina Implant AG (subretinal, Germany, discontinued
      after 16 years). Each company had clinical evidence. None achieved commercial
      sustainability. The common failure modes were inadequate reimbursement coverage,
      insufficient addressable patient volume, and capital intensity exceeding what
      revenue could service. Science Corp's advantages — more selective patient targeting,
      superior visual outcomes, the RAPID pathway, $490M in capital, and integration with
      an active BCI platform — distinguish it meaningfully from each predecessor. But the
      base rate of commercial failure in this sector demands that any investment thesis
      be stress-tested against the specific mechanisms — not just the technical details —
      that caused three well-funded predecessors to fail.
    claimRefs: [CR037, CR038, CR039, CR040]

