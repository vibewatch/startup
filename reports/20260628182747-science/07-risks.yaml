  evidenceGaps:
    - type: missing-source
      severity: material
      topic: FDA PMA filing status
      missingEvidence: >
        Science Corp has not publicly disclosed whether a formal FDA PMA application has been
        filed for PRIMA as of June 2026, or whether the company is still in the pre-submission
        meeting stage. The FDA's CDRH 510(k)/PMA public database would confirm filing once
        submitted, but no entry for PRIMA was identified in research through this date.
      whyItMatters: >
        PMA filing date determines the earliest possible FDA approval date; without this
        information the US commercial launch timeline cannot be assessed with confidence.
        The regulatory approval risk is rated High-Critical; confirming filing status would
        move it from speculative to trackable.
      diligencePath: >
        Monitor FDA CDRH public PMA database (accessdata.fda.gov) for PRIMA / Science
        Corporation entries; request pre-submission meeting transcripts and correspondence
        summary through standard due-diligence documentation request.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]

    - type: missing-source
      severity: material
      topic: RAPID pathway enrollment by Science Corp
      missingEvidence: >
        The FDA/CMS RAPID Coverage Pathway was announced April 23, 2026. No public
        announcement from Science Corp confirming enrollment or application to the
        RAPID pathway was identified. CMS and FDA have not published a list of enrolled
        developers as of June 2026.
      whyItMatters: >
        RAPID enrollment is the primary mitigant for US reimbursement tail risk. Without
        confirmation that Science has enrolled, the reimbursement risk retains High residual
        exposure. A six-month delay in enrollment could push concurrent coverage determination
        beyond the FDA decision window, restoring the 6-18 month gap.
      diligencePath: >
        Contact Science Corp investor relations or regulatory affairs team directly; monitor
        FDA and CMS press releases for RAPID pathway participant announcements; review
        Science Corp SEC or investor disclosures if any are filed.
      relatedQuestionRefs: [QR003]

    - type: missing-source
      severity: minor
      topic: PRIMA maximum implant duration
      missingEvidence: >
        Published PRIMAvera data covers up to 24 months of follow-up; 36-month data has
        been referenced in Science Corp communications but the full dataset has not been
        published as of June 2026. No peer-reviewed publication of 36-month safety and
        efficacy data was identified.
      whyItMatters: >
        Implant durability is a key FDA and payer concern; long-term data demonstrating
        device stability and sustained visual benefit would strengthen both the PMA and
        reimbursement arguments. Absence of 36-month peer-reviewed data leaves the
        long-term durability question open for the FDA review.
      diligencePath: >
        Request 36-month PRIMAvera data from Science Corp under NDA; monitor ClinicalTrials.gov
        NCT04676854 for study completion and publication date; review ASSORetina and AAO
        2026 annual meeting abstracts for PRIMA 36-month presentations.
      relatedQuestionRefs: [QR011]

    - type: missing-source
      severity: blocking
      topic: PRIMA commercial pricing
      missingEvidence: >
        Science Corporation has not publicly disclosed any commercial pricing for PRIMA in
        any jurisdiction. No list price, target ASP, or reimbursement negotiation range has
        been identified in any public document, press release, or investor communication
        through June 2026.
      whyItMatters: >
        Commercial viability cannot be assessed without a price point. If PRIMA is priced
        above reimbursement ceilings (e.g., above cochlear implant analogues in the $30K-$100K
        range), it will face structural payer resistance regardless of regulatory approval.
        The absence of a disclosed price also makes it impossible to model revenue, margin,
        or break-even patient volume with any confidence.
      diligencePath: >
        Request commercial pricing model and hospital pricing strategy from Science Corp
        management; review any HTA submission or AMNOG dossier if European pricing has
        been negotiated; compare against cochlear implant pricing precedents in NHS/GKV
        markets as analog.
      relatedQuestionRefs: [QR018]

    - type: missing-source
      severity: material
      topic: ISO 13485 manufacturing certification status
      missingEvidence: >
        No public confirmation that Science Corp's Durham, NC manufacturing facility has
        received ISO 13485:2016 certification was identified in research through June 2026.
        The CE mark submission references extensive quality documentation, but ISO 13485
        certification by a notified body is a separate prerequisite typically confirmed
        through public certification databases.
      whyItMatters: >
        ISO 13485 certification is required for EU MDR CE mark compliance and is considered
        best practice for FDA PMA manufacturing inspection readiness. A facility that begins
        commercial production without ISO 13485 certification is at elevated risk of a
        non-conformance finding during a pre-approval BSI or FDA audit, which could delay
        CE mark or PMA by 12-24 months.
      diligencePath: >
        Search ISO certification bodies (BSI, TÜV, SGS, Bureau Veritas) public registries
        for Science Corp / Durham NC site certification; request ISO 13485 certificate
        and latest surveillance audit report from company in due diligence.
      relatedQuestionRefs: [QR019]
