        - 累计投入 >$300M
        - '峰值市值约 $100M（NASDAQ: EYES）；实际清算价值 $0'
        - 上市公司文件；股价数据；Fierce Biotech 负面报道
        - 定义赛道下行：获 FDA 批准、获 CE Mark 的视网膜植入物，有专用 CMS 代码，收入仍失败
        - 历史案例；Science PRIMA 的临床结果显著优于 Argus II
      - - Pixium Vision（PRIMA 前身）
        - 破产（清算，2024 年 4 月）；被 Science Corp 收购
        - 投入 €50M+
        - Science Corp 收购价约 €4M
        - Science Corp BusinessWire 收购公告；MarketScreener 记录
        - 最直接的技术先例；倒闭时 CE Mark 待批；失败点在商业化，不在监管
