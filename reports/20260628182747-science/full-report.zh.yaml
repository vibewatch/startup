      - CR027
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: |
      有向无环图梳理 Science Corporation 的关键外部依赖；PRIMA 要商业化上市，必须维持或解决这些依赖。节点代表参与方、资产或关口； 边表示依赖方向，终点指向商业化患者可及。
    data:
      nodes:
        - id: fda
          label: 美国 FDA（Breakthrough Device / PMA）
          role: Sole US commercial authorization authority
        - id: bsi
          label: BSI / EU MDR 公告机构
          role: Sole EU CE mark authorization authority
        - id: cms
          label: CMS / RAPID 覆盖路径
          role: US reimbursement authority; concurrent coverage option via RAPID
        - id: stanford-ip
          label: Palanker Lab / Stanford IP（经 Pixium）
          role: Foundational photovoltaic pixel patents — acquired in 2024
        - id: sahel
          label: Jacques-Alain Sahel（CSA）
          role: Clinical scientific credibility and regulatory advisory access
        - id: durham-facility
          label: Durham NC 制造工厂
          role: Primary production site; ISO 13485 certification required
        - id: vr-surgeons
          label: 受训玻璃体视网膜外科医生
          role: Procedural delivery — bottleneck for commercial scale
        - id: prima-device
          label: PRIMA 光伏视网膜下植入体
          role: Core product — sole current revenue thesis
        - id: clinical-evidence
          label: PRIMAvera 临床证据（N=38，NEJM）
          role: Evidence basis for both regulatory submissions and payer coverage
        - id: patient-access
          label: 商业化患者可及
          role: Final outcome — requires all dependencies to converge simultaneously
        - id: reimbursement
          label: 支付方报销（欧盟 + 美国）
          role: Financial access gate — currently absent in both markets
        - id: hodak
          label: Max Hodak（CEO）
          role: Strategic leadership; investor relationships; no public succession
      edges:
        - from: stanford-ip
          to: prima-device
          label: IP 基础
        - from: durham-facility
          to: prima-device
          label: 制造设备
        - from: clinical-evidence
          to: fda
          label: PMA 证据
        - from: clinical-evidence
          to: bsi
          label: CE 标志证据
        - from: fda
          to: patient-access
          label: 美国监管关口
        - from: bsi
          to: patient-access
          label: 欧盟监管关口
        - from: cms
          to: reimbursement
          label: 美国覆盖认定
        - from: reimbursement
          to: patient-access
          label: 财务可及关口
        - from: vr-surgeons
          to: patient-access
          label: 手术交付
        - from: sahel
          to: clinical-evidence
          label: 科学方向
        - from: hodak
          to: fda
          label: 监管策略
        - from: prima-device
          to: patient-access
          label: 核心设备
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR024
      - CR035
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: |
      从临床验证、监管势能到先发位置，证据链最终指向 TRACK 建议；同时展示负面因素（前代公司失败、报销缺口、估值溢价）如何约束最终判断。
    data:
      nodes:
        - id: clinical-proof
          label: NEJM 临床证据（84% 成功率，47 名患者）
          role: Highest-quality retinal prosthesis data ever published; de-risks regulatory timeline
        - id: reg-momentum
          label: 监管势能（CE 标志已提交，FDA Breakthrough）
          role: Advanced EU submission; RAPID pathway available; first commercial BCI possible mid-2026
        - id: first-mover
          label: 先发优势（任何市场上的首个 BCI）
          role: Winner-take-most dynamics in BCI; platform optionality from foundry and biohybrid
        - id: adverse-factors
          label: 负面因素（行业失败、零收入、估值溢价）
          role: Three prior retinal CE-marked companies failed; $1.5B above expected-value; cap table undisclosed
        - id: valuation-check
          label: 估值校验（$1.5B vs 约 $1.1B 预期价值）
          role: Premium to probability-weighted base; requires partial bull-case execution to break even
        - id: recommendation
          label: 建议——TRACK（$1.0–$1.2B 入场估值时继续研究）
          role: Monitor CE Mark, EU pricing, and RAPID engagement; entry price improvement significantly changes risk/return
        - id: diligence-gate
          label: 关键尽调关口——股权结构 + CE 标志结果
          role: Preference stack and CE Mark timing are highest-information items before any commitment
      edges:
        - from: clinical-proof
          to: reg-momentum
          label: 支撑 CE 标志获批概率
        - from: reg-momentum
          to: first-mover
          label: CE 标志打开欧盟商业化上市
        - from: first-mover
          to: valuation-check
          label: 支持相对纯 DCF 的部分溢价
        - from: adverse-factors
          to: valuation-check
          label: 限制可支撑溢价；引入下行情景
        - from: valuation-check
          to: recommendation
          label: $1.5B 勉强；$1.0–$1.2B 有吸引力
        - from: recommendation
          to: diligence-gate
          label: 投资取决于尽调问题解决
    claimRefs:
      - CV001
      - CV005
      - CV012
      - CV022
      - CV030
      - CV037
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: |
      五组情景组合下的隐含企业价值，变量包括 CE 标志时点、欧盟报销速度和 FDA 路径假设。2026 年 3 月 $1.5B 入场估值作为参照基线。数值单位为百万美元。
    data:
      items:
        - label: 熊市（CE 标志延迟、报销失败、FDA 2030+）
          value: 280
          note: 困境退出；参考前代行业案例；相当于入场估值的 0.57x
        - label: 下行基准（CE 标志 2026 年下半年、HTA 24 个月、FDA 2030）
          value: 750
          note: 低于入场估值；0.5x 回报；仅欧盟价值且爬坡慢
        - label: 基准情景（CE 标志 2026 年下半年、HTA 12 个月、FDA 2029）
          value: 1100
          note: 低于入场估值；将行业适配倍数用于 2028 年收入
        - label: 入场估值——2026 年 3 月 Series C 参照
          value: 1500
          note: 实际投后估值；要打平，需要执行结果高于基准情景
        - label: 牛市（CE 标志 2026 年 Q3、RAPID 路径、FDA 2028、平台可选性）
          value: 3000
          note: 强牛情景；入场估值的 2x；需要商业化执行超越行业水平，并兑现平台价值
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV037
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: |
      牛市、基准和熊市情景下的企业价值区间，同时给出概率加权预期价值和入场估值参照点。上下限反映各情景的内部假设。所有数字单位为百万美元。
    data:
      items:
        - label: 熊市情景区间
          low: 150
          high: 400
          mid: 280
          unit: USD million
          note: CE 标志延迟；报销失败；FDA 2030+；参考行业基础概率
        - label: 基准情景区间
          low: 700
          high: 1500
          mid: 1100
          unit: USD million
          note: CE 标志 2026 年下半年；德国 HTA 12–18 个月；FDA 2029；欧盟保守爬坡
        - label: 牛市情景区间
          low: 2500
          high: 3500
          mid: 3000
          unit: USD million
          note: CE 标志 2026 年 Q3；RAPID 路径；FDA 2027–2028；晶圆厂 + biohybrid 平台价值
        - label: 概率加权预期价值
          low: 1000
          high: 1250
          mid: 1125
          unit: USD million
          note: 30% 牛市 + 50% 基准 + 20% 熊市；比 $1.5B 入场估值低约 17–33%
        - label: 2026 年 3 月入场估值（参照）
          low: 1500
          high: 1500
          mid: 1500
          unit: USD million
          note: Series C 投后估值；用于投资者回报测算的参照点
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: |
      从八个维度给出可供 IC 使用的评分，评估 Science Corporation 在 2026 年 3 月 $1.5B 入场估值下的投资理由。评分仅反映截至 2026 年 6 月的公开证据。
    data:
      items:
        - label: 市场机会
          value: Large
          trend: growth
          note: 5M+ GA/AMD 患者；视网膜植入市场以 8–10% CAGR 增长；BCI 市场到 2034 年从 $3.2B 增至 $12.9B
        - label: 临床验证
          value: Strong
          trend: stable
          note: NEJM 发表论文，47 名患者成功率 84%；在所有植入式视觉恢复设备中，这是已发表的最佳数据
        - label: 监管势能
          value: Advanced
          trend: growth
          note: CE Mark 已于 2025 年 6 月提交；FDA Breakthrough Device 认定；FDA 批准后可适用 RAPID 路径
        - label: 竞争位置
          value: First-mover
          trend: growth
          note: 任何市场上都没有商业化 BCI 植入体；Neuralink 和 Synchron 适应症不同；MEMS 晶圆厂构成差异点
        - label: 报销准备度
          value: High Risk
          trend: stable
          note: 美国无 NCD；Anthem 政策负面；欧盟 CE Mark 后 HTA 需 12–36 个月；RAPID 路径尚未在视网膜假体上验证
        - label: 资本效率
          value: Moderate
          trend: stable
          note: 收入前已融资 $490M；可比公司 Second Sight 花费 $300M+，峰值收入 <$5M
        - label: 估值纪律
          value: Stretched
          trend: stable
          note: $1.5B vs 约 $1.1B 预期价值；溢价需要部分牛市情景执行兑现；行业倍数低于入场估值
        - label: 证据质量
          value: High
          trend: stable
          note: NEJM 原始数据；多家独立媒体验证；CE Mark 技术文件已提交
        - label: 退出准备度
          value: 2028–2031
          trend: growth
          note: IPO 需要 FDA 批准 + 收入；M&A 最可能在获批后发生；Medtronic/BSci/J&J/Abbott 契合
        - label: IC 综合评分
          value: TRACK
          trend: stable
          note: $1.0–$1.2B 可买；$1.5B 继续研究；若执行落到熊市以下则回避
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV027
      - CV028
      - CV030
