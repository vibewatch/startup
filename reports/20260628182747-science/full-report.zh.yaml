      - number: '7.3'
        title: 报销与商业采用风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，美国 Centers for Medicare and Medicaid Services 没有针对植入式视网膜下假体的专门 CPT 代码、覆盖决定或支付框架。私人支付方通常跟随
              CMS：Anthem Blue Cross 的 DME.00052 政策已经把 brain-computer interface 康复设备列为试验性且非医学必需，无论 FDA 审评状态如何。GAO 2025
              BCI 技术评估 （GAO-25-106952）发现，BCI 开发者历史上很难与 CMS 就其设备接触；临床试验中接受植入的患者在试验资金结束后面临设备 explantation——这是保险方和医院决定是否采用
              新型植入平台时会权衡的结构性风险。2026 年 4 月 RAPID Coverage Pathway 直接回应这一问题，允许 Breakthrough Devices 同时获得 FDA 批准和 Medicare
              覆盖决定； 但该路径很新，尚未在任何植入式视觉假体上测试过，并要求 Science 在预提交阶段主动与 FDA 和 CMS 双线接触。任何公开文件中都没有 PRIMA 商业定价，使外部无法判断 Science
              Corp 的目标价位是否能被医院、HTA 机构或国家支付方接受。人工耳蜗类比提示设备成本可能为 $30,000-$100,000；视网膜特定支付方的怀疑可能把可接受上限压得更低。 在欧洲，CE mark
              之后，Science 必须逐国走 AMNOG 和 HTA 流程取得报销——对于新型植入设备，这一过程通常需要 12–36 个月。CMS 不行动造成的下游私人支付方真空会放大该风险：
              没有美国覆盖信号，欧洲支付方在设定报销费率时没有先例可参考，Science 的商业发布时间线将取决于哪个市场的支付基础设施先成熟。
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
      - number: '7.4'
        title: 制造、运营与质量体系风险
        blocks:
          - type: paragraph
            body: >
              Science Corporation 正在北卡罗来纳州 Durham 建设制造工厂，2024 年宣布投入 $65 million，目标是在生命科学制造领域新增 150+ 个岗位。PRIMA 芯片是一种光伏
              CMOS/MEMS 器件，制造依赖半导体晶圆代工流程；Science 的自有晶圆代工业务（向外部 BCI 客户提供定制芯片制造）承担双重角色：既分散收入来源，也是 PRIMA 阵列的核心制造平台。21 CFR
              Part 820 质量体系法规及其国际对应标准 ISO 13485:2016 要求植入式器械制造商具备完整的设计控制、工艺验证记录和纠正措施体系。据称，Science 的 CE 认证提交材料约包含 60GB
              质量体系文件，说明质量管理已推进到较成熟阶段——但本章研究未发现 Durham 工厂已获得 ISO 13485 认证的公开确认。若上市前检查发现制造不符合项，可能触发停产或要求提交 PMA
              补充材料，商业化上市或被推迟 12-24 个月。CMOS/MEMS 制造供应链集中，尤其是让 PRIMA 区别于标准 CMOS 的专用光伏像素工艺，构成另一项运营风险；自有晶圆代工能力尚未完全化解该风险。在
              PRIMA 商业爬坡的关键阶段，硬件代工业务的外部客户也可能与 PRIMA 争夺产能和工程人才。
            claimRefs:
