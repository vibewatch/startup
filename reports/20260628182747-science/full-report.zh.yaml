  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Science Corporation 的 PRIMA 系统对应的是一个边界清晰的市场，区别于更宽泛的眼科、AMD 药物治疗和通用 BCI
              版图。纳入测算的支出是用于恢复终末期退行性视网膜疾病视觉功能的外科设备系统，具体包括光伏视网膜下植入物、配套外部硬件和植入手术。不纳入的是 AMD 药物治疗市场（抗 VEGF 注射、补体抑制剂、AREDS
              补充剂）、光学矫正、低视力辅助工具、基因疗法，以及完全绕过视网膜的皮层视觉假体。


              晚期地图样萎缩的现状对照组是观察随访、没有修复选项：目前没有药物疗法能恢复 GA 失去的中心视力，因此 PRIMA 的临床对照是自然病程，而不是竞争药物。湿性 AMD 药物治疗（抗 VEGF）相邻但正交——抗
              VEGF 注射每年在美国产生超过 600 万例操作，但面向的是根本不同的疾病阶段和机制；进展到终末期 GA 的患者已经错过抗 VEGF 的获益窗口。PRIMA 最接近的相邻领域是其他面向 RP 和
              Stargardt 的视网膜植入路径、针对遗传性视网膜疾病的新兴基因疗法，以及为视网膜—视神经通路受损患者设计的皮层视觉假体。更大的 BCI 神经假体 TAM（Grand View Research 估算侵入式
              BCI TAM 为 $168.27B）会抬高可触达市场叙事，PRIMA 专属测算应剔除，因为它覆盖运动功能 BCI、通信设备、神经调控和其他非眼科应用。AMD 药物市场（2025 年
              $12.64B）同样应作为背景，而非 PRIMA 的市场，因为它针对的是另一个疾病阶段。
