      - number: '6.6'
        title: 采用壁垒、反向证据与集中度风险
        blocks:
          - type: paragraph
            body: >
              多个结构性壁垒削弱了乐观需求叙事。第一，也是最重要的一点，截至 2026 年 6 月，PRIMA 收入为零：所有「客户」都是临床试验参与者或收入前伙伴，
              尚未发生商业交易。第二，设备不良事件情况需要审视：PRIMAvera 试验中，38 名患者里 19 人发生 26 起严重不良事件（患者层面 SAE 发生率 50%），
              包括视网膜裂孔、眼压升高、视网膜脱离和增殖性玻璃体视网膜病变。虽然 95% 事件在两个月内消退，但接受治疗的眼睛相比未治疗对照眼，geographic atrophy
              面积增幅更大，引发了设备是否加速基础疾病的未决问题。第三，近期商业足迹高度集中在精英学术玻璃体视网膜中心。PRIMAvera 试验需要 17 个欧洲专科中心和 1
              个美国中心；并非所有玻璃体视网膜外科医生都具备所需的视网膜下植入技能和术后康复基础设施。因此，广泛地理可及性会被培训和中心认证要求结构性限制， 即使监管批准后，该瓶颈仍会存在。第四，Science
              的患者资格标准狭窄：候选者必须年满 60 岁，完全失去中央视觉，并保留残余周边视觉——这一画像会筛掉很多 AMD 患者。第五，美国商业路径在 FDA clearance 和 Medicare
              报销同时拿下前都会停滞，而这个顺序可能远长于欧洲 CE-mark 时间线。合起来看，即使在乐观情形下， Science 的商业爬坡也会很慢，依赖少数专科中心，并且初期局限在报销环境最有利的单一欧洲国家市场。
