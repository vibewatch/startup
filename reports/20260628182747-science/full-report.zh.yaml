      - number: '5.6'
        title: Science Foundry：制造与合规
        blocks:
          - type: paragraph
            body: |
              Science Corporation 拥有并运营 Science Foundry，这是一座位于北卡罗来纳州 Durham 的 Research Triangle Park 的
              MEMS 和 ASIC 制造设施。该设施源自 Science Corporation 约在 2022 年收购 MEMSCAP 的美国 MEMS foundry 资产和团队，
              让公司获得了临床阶段神经接口公司中少见的内部微制造能力。Foundry 生产 Science 的专有 ASIC 芯片家族
              （NYX 神经记录、LUX microLED 驱动器），并计划承担 PRIMA 光伏视网膜下阵列的生产。

              2024 年 7 月，Durham County Commissioners 一致批准一项十年期、$930,000 的绩效型经济激励，支持 Science Corporation
              计划中的设施扩建。扩建将在 Durham 园区新增约 57,000 平方英尺，预计需要 $65 million 资本投入，并预计创造 50 多个
              高薪制造岗位。该设施目标是取得 ISO 9001:2015 质量管理体系认证，并符合 FDA current Good Manufacturing Practice（cGMP）。
              NCBiotech 报道称，扩建将支持 Science 产品组合的制造，包括 PRIMA 植入体和先进神经接口技术。

              垂直整合 MEMS foundry 给 Science Corporation 带来三项战略优势：（1）掌控 PRIMA 核心光伏硅阵列的供应链——降低对外部
              foundry 合作伙伴的依赖，因为对方产能和 IP 容忍度可能不确定；（2）随着产量放大获得单位成本下降杠杆，因为自有 foundry
              的增量芯片成本主要由材料和周期时间驱动，而不是叠加利润的外部定价；（3）作为美国本土 MEMS foundry，为精选外部 biotech
              和 medtech 伙伴服务，产生非稀释性收入，并用外部用例验证 foundry 的质量体系。Foundry 当前能否以商业 PRIMA 量级投产，
              尚未被公开确认；当前状态是试点规模制造。要为一款 CE Mark 批准医疗设备放大到商业级、cGMP 认证生产，仍是重大运营里程碑；
              截至 2026 年中，Science 尚未公开达到该节点。
