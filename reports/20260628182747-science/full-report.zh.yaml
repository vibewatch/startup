      - number: '3.4'
        title: 比较技术差异——模态、侵入性与证据成熟度
        blocks:
          - type: paragraph
            body: >
              Science Corp 的 PRIMA 在三个维度上区别于所有活跃竞争者：证据成熟度、商业化接近度和无线优先架构。在所有视网膜和皮层假体公司中，PRIMA 是唯一在 CE 认证提交时已拥有 New
              England Journal of Medicine 发表的 II 期数据、并证明功能性视觉修复的设备——PRIMAVERA 试验中 38 至 47 名参与者里，80%
              患者显示有意义的视觉改善。无论是直接视觉假体还是更广义的 BCI 层级，没有竞争者同时达到这种期刊层级、入组规模和监管申报组合。PRIMA 的光伏无线设计在架构上不同：视网膜下芯片中的 378
              个光伏像素把患者眼镜传来的近红外光转化为对双极细胞的电刺激，完全取消外部电源连接和经皮导线；相比有线或电池充电方案，这降低感染风险，也简化系统。BVT
              的脉络膜上路径把植入物放在视网膜层外，相比视网膜上和视网膜下路径，手术复杂度和视网膜创伤风险更低，但 44 电极设计的理论分辨率显著低于 PRIMA 的 378 像素，且只在 4
              名受试者中测试。Cortigent 的 Orion 完全绕过视网膜电路，直接刺激视觉皮层，这是真实的技术差异，可能服务更广泛的失明人群，但需要开颅——手术负担比 PRIMA
              的玻璃体视网膜手术高出数量级。Science Corp 收购了 Pixium Vision 全部资产，包括临床试验基础设施、IP 和 CE 认证申请，使其独占 PRIMA 平台且不存在竞争权利主张。Argus
              II 获得 CMS $150,000 报销、但总手术成本约 $500,000 的先例，留下了负面商业标杆；PRIMA 必须用支付方证据和差异化结果数据明确跨过去。PRIMA
              在视网膜下空间刺激双极细胞，保留包括侧抑制在内的内层视网膜处理；相比绕过同一电路的 Argus II 视网膜上神经节细胞刺激，这带来理论分辨率优势。在更广义的 BCI 资本竞争中，Synchron
              较低的手术负担是真实竞争优势，因为医院部署成本和操作者认证时间更偏向血管内系统；但这一优势不适用于视网膜手术，后者是成熟术式专科，已有既定外科医生培训路径。Precision Neuroscience 获
              510(k) 许可的 Layer 7 电极，为薄膜皮层接口建立了商业监管先例，这一数据点关系到 Science Corp 未来在视网膜适应症之外扩展皮层 BCI 平台。总体看，Science Corp
              在监管接近度、证据成熟度和系统优雅性上领先，但仍面对同样的商业化开销——医生采用、支付方沟通和长期支持义务——这些曾摧毁其直接前辈。
