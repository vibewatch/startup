      - number: '2.6'
        title: 报销格局：美国与欧洲
        blocks:
          - type: paragraph
            body: >
              报销是 PRIMA 在美国和欧洲的核心商业风险。在美国，CPT 代码 67027 覆盖眼内视网膜假体植入，Medicare
              也已针对终末期视网膜色素变性的视网膜假体发布地方覆盖决定。但地图样萎缩作为视网膜假体适应症——PRIMA 的主要目标——没有全国覆盖决定，意味着初始覆盖将取决于各 MAC 的 LCD
              决策和逐案事前授权申请。CMS 2026 年医师费用表将非 APM 参与者转换因子设为 $33.40/RVU，但对门诊手术中心场地程序的支付削减，会削弱依赖医院基础设施的植入项目的程序经济性。


              Argus II 先例——单台设备 $115,000–$150,000、单患者总成本接近 $500,000、保险覆盖高度不稳定——说明支付路径未解决的视网膜植入物商业上有多脆弱。Science
              必须证明一个设备加手术的可持续经济模型，支付方能够承受，广泛商业采用才可能发生。在欧洲，CE 认证是进入市场的前提，但不带来报销。欧盟卫生技术评估法规（EU 2021/2282）自 2025 年 1
              月分阶段实施，要求包括视网膜假体在内的 IIb 和 III 类器械从 2026 年起接受联合临床评估；在各国 HTA 机构作出覆盖决定前，这会增加一项泛欧洲证据要求。每个欧盟成员国独立决定覆盖；法国 HAS、德国
              G-BA 和英国 NICE 历来对长期结果数据有限的新型植入器械较为保守。PRIMA 由 Science 提交的 CE 认证申请（约 2024 年末 / 2025 年初）是欧洲商业成功的必要条件，但远远不够。
