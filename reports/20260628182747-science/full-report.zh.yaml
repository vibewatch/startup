  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管批准风险：FDA PMA 与 EU CE Mark
        blocks:
          - type: paragraph
            body: >
              Science Corporation 的近期商业可行性完全取决于两个并行监管结果：美国市场的 FDA Pre-Market Approval，以及欧洲市场的 CE mark 确认。两项批准都不保证，
              且时间存在不确定性，可能使商业化比当前预期推迟一到三年。FDA Breakthrough Device designation（2023 年取得）可加快互动和审评排期，但不会降低安全性和有效性的
              证据门槛。Class III 植入设备的 FDA PMA 路径通常在提交后需要 180 天实质审查，Agency 保留发出 Additional Information request 的权利，这可能把周期再延长
              12 个月或更久。Science 于 2025 年 6 月向 BSI 提交的 CE mark 申请包含约 60 gigabytes 文档，目前处于 EU MDR 审查中；截至 2026 年 6 月尚未确认决定。
              EU Medical Device Regulation（2017/745）要求 Class IIb 植入物开展上市后临床随访，Science 必须在批准前把该要求嵌入商业监测计划。FDA 与 CMS 于
              2026 年 4 月联合宣布 RAPID Coverage Pathway，允许 Breakthrough Devices 在 FDA 批准同时获得 Medicare 覆盖，而不必等待通常批准后 6–18
              个月的周期。 这显著缓解报销尾部风险，但要求 Science 主动与两个机构同时接触。Humanitarian Use Device designation 申请若获批，将允许 PRIMA 在每年 8,000
              名患者上限、 利润限制较低的框架下商业化，为临床试验与完整商业规模之间提供桥接机制。考虑到通过 Pixium 收购取得的 Palanker Lab 专利组合，知识产权风险较低； 但视网膜下光伏像素设计空间的
              freedom-to-operate 验证仍是开放尽调项。
