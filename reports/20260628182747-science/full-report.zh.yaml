  - id: FU001
    title: PRIMA 患者客户旅程图 — 从诊断到长期视觉使用
    type: journey-map
    layout: wide
    summary: |
      六阶段旅程展示晚期干性 AMD 患者从初始诊断、手术植入到长期设备使用的连续步骤， 以及每个阶段的 Science Corp 触点和采用障碍。
    data:
      items:
        - label: 阶段 1：发病与眼科医生诊断
          description: |
            患者发展为晚期干性 AMD / 地理萎缩；BCVA 下降至 ≤20/400；确认中央暗点； 登记为法定失明。Science 触点：本阶段无——患者仍处于常规眼科护理中。
        - label: 阶段 2：患者登记库加入
          description: |
            患者或照护者了解 PRIMA，并加入 Science Corp 患者登记库；采集基线功能指标 （阅读、面部识别、移动能力）；分配临床试验优先访问资格。
        - label: 阶段 3：资格筛查与手术评估
          description: |
            认证 PRIMA 中心的玻璃体视网膜外科医生审查 OCT 影像、微视野检查和全身健康状态； 候选人必须 ≥60 岁、确认有中央暗点，并在对侧眼保留周边视觉。狭窄的资格漏斗会筛掉多数 AMD 患者。
        - label: 阶段 4：在认证中心手术植入
          description: |
            受训玻璃体视网膜外科医生在局部麻醉下，用 <2 小时把 2×2 mm PRIMA 芯片植入视网膜下空间； 手术使用标准玻璃体视网膜工具包，并结合专门的视网膜下递送技术。全球仅限 18 个活跃临床合作站点。
        - label: 阶段 5：激活、眼镜适配与康复
          description: |
            术后 4–6 周，PRIMA 芯片激活；患者适配增强现实眼镜（摄像头 + AI 处理器）； 随后进行数月密集视觉康复训练，以解读红外投影信号；大脑学习融合假体视觉和自然周边视觉。
        - label: 阶段 6：长期设备使用与随访
          description: |
            患者在家使用 PRIMA 系统进行阅读、面部识别和导航；继续按计划随访； 监测设备耐久性和萎缩进展；通过登记库优先路径获得下一代 PRIMA 升级资格。
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017
