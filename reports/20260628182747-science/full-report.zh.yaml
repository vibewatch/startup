      - number: '5.3'
        title: 技术限制与下一代路线图
        blocks:
          - type: paragraph
            body: |
              PRIMA 当前商业规格有四个结构性技术限制，限定了初始患者体验和可服务人群。第一，视觉只有黑白：
              光伏像素输出是二元的，当前软件版本不会从场景中计算灰度。Palanker 表示灰度软件升级正在开发；
              患者把人脸识别列为仅次于阅读的第二优先需求，而人脸识别需要灰度层次。第二，植入体 2 × 2 mm 的
              面积只覆盖中央黄斑区；周边视觉不受影响，但以当前尺寸，单块芯片无法覆盖更大视网膜表面。
              第三，100 µm 的像素间距带来粗颗粒的假体视觉；估计 100 µm pitch 设备在无数字变焦下的理论视力上限约为
              20/500，配合 12× 变焦增强后可提升至大约 20/320–20/200 区间。第四，也是患者筛选中最关键的一点，
              PRIMA 需要内层视网膜仍能工作：PRIMA 刺激的双极细胞层必须完整。视网膜退化已经进展到内层视网膜萎缩、
              或存在青光眼性神经节细胞丢失的患者，不符合条件。

              目前处于临床前开发、并已在 Stanford 大鼠实验中测试的下一代 PRIMA 芯片，目标是 20 µm 像素间距，
              每块芯片约 10,000 个像素。Stanford 的 Daniel Palanker 预计，20 µm pitch 设备可提供 20/80 的基线假体视力；
              与眼镜电子变焦结合后，在部分条件下可接近 20/20 功能视力。无线光伏设计也支持未来原位升级：
              理论上，植入体可通过再次视网膜下手术、以最小切口替换成更高分辨率芯片，不同于有线牵引设备。
              多块芯片也可按拼贴方式植入，覆盖更大的萎缩区域。Science Corporation 还在把 PRIMA 扩展到新适应症：
              NCT07266584 是澳大利亚 Sydney Eye Hospital 的一项可行性试验，评估 PRIMA 用于 Stargardt disease 和
              retinitis pigmentosa——两者都是累及黄斑的遗传性视网膜退化；预计入组 5 名患者，主要完成时间预计为
              2029 年 3 月。早期 PRIMAvera 试验 38 名患者的样本量足以支持 CE Mark 申报，但在初始 GA 适应症之外，
              若未来申请标签扩展或提交报销材料，可能会被视为有限。
