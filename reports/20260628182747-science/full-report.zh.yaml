      - number: '3.5'
        title: 护城河耐久性、替代风险与反证
        blocks:
          - type: paragraph
            body: >
              Science Corp 的竞争护城河真实但脆弱，这一精确竞争细分赛道的历史失败率要求严苛的反方核算。直接视网膜假体的三个前辈——Second Sight、Retina Implant AG 和 Pixium
              Vision——要么商业失败，要么在困境中被收购。Argus II 的 CE 标志和 FDA HDE 批准没有转化为商业可行性；Retina Implant AG 于 2016 年获得 CE
              标志，三年后解散；Pixium Vision 用 PRIMA 走到 CE 认证提交阶段，却在批准前耗尽资本。每一次失败都由报销不足、手术成本高、患者量低和医生采用惯性中的若干因素驱动——Science Corp
              尚未证明自己能在规模上克服任何一项。GAO 2025 年关于脑机接口的报告明确指出，缺乏专用报销编码、隐私框架和上市后监测标准是系统性障碍，需要政策行动后，BCI 才可能广泛商业化；Medicare
              目前没有针对永久植入式 BCI 的全国覆盖决定或专用编码路径，这意味着 PRIMA 在美国会面临逐案 MAC 覆盖谈判，类似拖垮 Argus II 的路径。如果 Science Corp
              陷入财务困境，继续支持植入患者的伦理和监管义务也没有解决；Argus II 遗弃先例（约 350 名患者被留在无人支持的植入物上）制造了推动政策变化的压力，但变化尚未落地。Neuralink 约 $1.3B
              资本基础和定义品类的媒体存在感，若其比 Science Corp 实现欧盟商业放量更快获得 FDA 批准，可能把 BCI 投资资金流引向运动 / 通信应用、远离视觉修复。BVT 虽然融资有限，但持有 FDA
              Breakthrough Device Designation，并在执行清晰的临床项目；如果 BVT 获得大型医疗科技公司收购或合作，就可能迅速扩展为可信竞争者，获得 Science Corp
              需要数年才能复制的制造和分销支持。Science Corp 的植入式设备锁定在患者层面很强——取出和更换的手术风险形成事实上的患者留存——但这不能阻止医院系统与面向运动应用的竞争 BCI
              平台建立关系，从而可能限制 Science Corp 未来在院内的扩张。外科医生专业化构成有意义的护城河：PRIMA
              植入所需的玻璃体视网膜手术技能在主要学术中心已经成熟，相比皮层竞争者所需的新型开颅技术，培训曲线更低。PMC 发表的 Second Sight 与 Onward Medical
              比较分析认为，分阶段商业化、借助先导技术和医生熟悉度是关键成功因素，Second Sight 未能使用这些因素；Science Corp 管理层从临床转向商业模式时必须内化这一点。总结来说，Science
              Corp 的护城河在狭义上真实：它是唯一拥有 NEJM 发表证据、且有正在审理的 CE 认证申请的视网膜 BCI
              视觉修复公司；但在结构意义上，只有报销、医生采用和上市后支持模型在商业规模上得到证明后，护城河才算耐久。
