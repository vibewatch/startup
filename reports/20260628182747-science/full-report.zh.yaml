  - id: TV004
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值逻辑
      - 概率信号
      - 论点风险
    rows:
      - - 牛市（30% 权重）
        - >-
          2026 年 Q3 获 CE Mark；2026 年 Q4 德国发布；12 个月内欧盟报销落地；2027–2028 年 FDA RAPID 路径获批； 2028 年收入 $120M–$200M；代工厂 /
          生物混合平台增加终值
        - 以 2028 年收入中点 $150M 计，7–10x 远期收入倍数 = $1.05B–$1.5B；叠加 $1.0B–$2.0B 平台期权价值 = $2.5B–$3.5B 区间
        - '>30%：需要 CE Mark、没有 HTA 延迟、RAPID 路径按设计运转，且商业爬坡高于赛道先例'
        - FDA 延迟、CE Mark RFI 或欧盟 HTA 滑坡会把情景压缩至基准；平台价值需要生物混合 IND 获批
      - - 基准（50% 权重）
        - 2026 年下半年获 CE Mark；德国 HTA 流程 12–18 个月；美国 FDA 2029 年批准；2028 年收入 $30M–$60M； MEMS 代工厂第三方收入 <$5M
        - 以 2028 年收入中点 $45M 计，4–6x 远期收入 = $180M–$270M；加上欧盟先发战略溢价 = $700M–$1.1B 区间
        - 50%：最符合历史 BCI 监管和报销时间线
        - 报销延迟、Anthem 维持负面政策，或商业使用中 SAE 重新出现，都可能压缩至熊市
      - - 熊市（20% 权重）
        - CE Mark 延迟至 2026 年之后，或 RFI 要求补充数据；欧盟报销 3 年内失败（赛道先例）；FDA 不可批准函； 下轮融资或困境退出
        - 以总投入 1–2x 困境退出（$490M–$980M 区间），再扣除优先权负担；低于优先权阈值时，股权净值更可能 <$400M
        - 20%：符合赛道基准（此前 3 家视网膜假体公司均商业化失败）
        - 以下任意两项：CE Mark 延迟、FDA 拒绝、报销失败、关键高管离职——触发该情景
    notes: >
      情景概率为分析师估计，基于截至 2026 年 6 月的监管先例、赛道可比公司和公开证据；不反映 Science Corp 内部预测。 收入估计采用同业设备 ASP 基准（$80K–$145K）和保守渗透假设。为与 2026 年
      3 月入场价做现值比较， 对 2028 年价值采用 25% 的 DCF 折现率。
    claimRefs:
      - CV027
      - CV028
      - CV029
      - CV037
  - id: TV005
    title: 论点破裂和终止触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - CE Mark 被拒或 RFI 延迟
        - BSI 在 2026 年发出 RFI 或正式拒绝；批准推迟到 2027 年 Q2 之后
        - 抹掉先发溢价，并让整个欧盟商业论点延迟 12–24 个月；转向基准或熊市
        - 重估持仓；要求查看预提交会议纪要；考虑在延迟后以更低估值入场
      - - 欧盟商业收入低于目标
        - 德国 CE Mark 批准后 6 个月，每季度手术量 <5 例
        - 显示医生采纳门槛、报销摩擦或患者管线问题；基准情形恶化为熊市
        - 要求商业细节（站点数、报销确认、待处理病例）；暂停追加承诺
      - - FDA 不可批准函或要求新试验
        - FDA 发出完整回应函，要求新的关键试验或重大数据补充
        - 美国收入论点延迟 3–5 年；现金消耗率上升；可能需要紧急过桥融资
        - 以有利价格退出或减仓；5 年持有期内，美国收入不再支撑退出估值
      - - 负面报销决定
        - CMS 对视网膜下假体发布正式不覆盖决定（NCD），或 RAPID 路径被拒
        - 美国报销路径变成多年倡议过程；牛市情形坍缩到基准或熊市
        - 按纯欧盟业务重构估值，估值相应下调；重估入场纪律
      - - 关键高管离职
        - Max Hodak（CEO）或 Alan Mardinly（CSO）在 12 个月内离职，且没有清晰接任者
        - 削弱监管可信度、投资人信心和临床网络准入；提高下轮融资概率
        - 加快尽调接班计划和董事会构成；列入观察名单
    notes: |
      触发器定义为可观察的外部事件，而不是内部预测。阈值采用公开可得的赛道先例（Second Sight、Pixium）和 medtech FDA 审评统计。 并非穷尽；临床安全信号、制造不合规或重大 IP 挑战也可能打破论点。
    claimRefs:
      - CV005
      - CV022
      - CV029
      - CV035
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和优先权堆栈
        - 各投资人持股、清算优先权、参与权、反稀释条款和可转债转换条款
        - Series C 投资人的有效入场经济性取决于优先权深度；$1.5B 投后估值未必反映 Series C 经济所有权
        - Science Corp CFO / 法律顾问；索取完整股本表和 Series C 条款清单
      - - CE Mark 结果和时间线
        - BSI 审查状态；2025 年 6 月提交后，Science Corp 是否收到任何 RFI 或补充信息请求
        - CE Mark 批准或拒绝是 2026 年信息量最高的单一事件；整个欧盟商业论点都押在上面
        - Science Corp IR；BSI（通过 Science Corp）；独立 EU MDR 律师
      - - FDA 一手确认
        - FDA 官方记录，确认 Breakthrough Device 指定；预提交会议纪要；PMA 递交日期
        - Breakthrough Device 指定会加速审评；截至研究日期，PMA 尚未递交；FDA 时间线未知
        - Science Corp 监管事务；FDA CDRH 预提交数据库；直接向 FDA 查询
      - - 德国商业发布定价和报销
        - PRIMA 设备 ASP、首批医院合同、AMNOG 早期准入申请，以及德国 NUB（新检查和治疗方法）状态
        - 首个市场定价会确立全球 ASP 先例；德国 AMNOG HTA 提供约 12 个月早期准入桥梁，通向完整覆盖
        - Science Corp 商业团队；Spitzenverband Bund der Krankenkassen（GKV-SV）数据库
      - - 现金消耗和通向盈利的跑道
        - 实际年度现金消耗（估计 $20–$30M）、Series C 后月度跑道，以及 $65M 代工厂 capex 是否计入 $490M 总融资
        - 跑道决定美国 FDA 批准（约 2028–2029 年）前是否需要 Series D；稀释风险影响 Series C 回报
        - Science Corp CFO；若 NDA 下可获得，审查经审计财务报表
    notes: |
      截至 2026 年 6 月，所有事项均未获公开确认。尽调路径假设可在 NDA 下接触 Science Corp 管理层。 在任何投资承诺前，股权结构尽调优先级最高，因为它决定有效入场经济性。
    claimRefs:
      - CV001
      - CV010
      - CV039
      - CV040
      - CV041
      - CV042
