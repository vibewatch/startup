  - id: TR005
    title: 缓释措施和终止标准表
    columns:
      - 风险
      - 可监测触发器
      - 阈值 / 事件
      - 行动含义
    rows:
      - - FDA PMA 被拒
        - FDA 发出不可批准函或拒绝受理 PMA
        - 任一阶段收到 RTF 或不可批准函
        - 论点破裂——重估美国收入时间线；判断缺陷是否可补救；考虑重新接入 RAPID
      - - 报销失败
        - FDA 批准后 24 个月，CMS 拒绝启动 NCD 或 RAPID 路径
        - 批准后 24 个月仍无 CMS 覆盖决定，也无商业保险采纳
        - 重大下行——美国商业收入被堵住；重估欧盟优先的商业化策略
      - - 临床安全升级
        - 第三类严重 SAE 出现，或 DSMB 建议暂停试验；36 个月 GA 加速超过对照组 3 倍
        - 新的严重 SAE 类别或 DSMB 暂停；36 个月数据中 GA 面积比 >3×
        - 论点破裂——立即通知投资人；PMA 可能延迟；评估设计变更
      - - 资本：无法完成 Series D 融资
        - Science Corp 在 2026 年 3 月 Series C 后 24 个月内，无法以平轮或上轮估值完成 Series D
        - 到 2028 年 3 月仍无 Series D 条款清单，且投后估值 ≥$1.5B
        - 严重——显示投资人信心流失；现金消耗见底加速；考虑过桥或合作
      - - 关键人物离职
        - Max Hodak 宣布离职，或在未披露接班计划的情况下被替换 CEO
        - Hodak 离职公告
        - 重大——重估领导层连续性；短期估值大概率受冲击；审查接班安排
    notes: |
      触发器可监测、基于事件，而不是概率预测。阈值设在投资论点必须被明确重估的水平。终止标准彼此独立： 任一触发器出现，都足以启动重估。
