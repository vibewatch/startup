      - number: '1.2'
        title: PRIMA 技术与产品平台
        blocks:
          - type: paragraph
            body: >
              PRIMA 是一款光伏视网膜下植入物，占地约 2 × 2 mm，厚度仅 30
              µm，约为人类头发直径的一半。设备相当于人工感光细胞：这枚微型无线芯片植入视网膜下、位于感光细胞层，能把投射到芯片上的近红外光转化为对下方双极细胞的局部电刺激，在感光细胞已被地图样萎缩破坏的患者体内重新引入视网膜信号通路。PRIMA
              系统由三部分组成：视网膜下植入物、内置摄像头和红外投影仪的专用眼镜，以及由 AI
              驱动的口袋处理器。处理器捕捉视觉场景、识别重要物体，并把图案化红外光导向植入物。植入物由投射光无线供电，不需要内置电池——这是关键的安全性和寿命优势。光伏视网膜刺激技术最初由 Stanford
              University 的 Daniel Palanker 教授实验室开发。2024 年 4 月，Pixium Vision SA 在 Paris Commercial Court 进入清算程序后，Science
              收购了全部 PRIMA 知识产权和三项进行中的临床试验。收购的试验包包括 PRIMAvera 关键研究（NCT04676854）和两项可行性试验。Science 现在正把 PRIMA 临床项目扩展到
              Stargardt 病和视网膜色素变性，这两类疾病是年轻成人遗传性视网膜视力丧失的主要原因。目前 PRIMA 假体视觉为黑白、分辨率相对较低；Science 已披露，下一代设备将靠数字图像处理优化视觉表现。
