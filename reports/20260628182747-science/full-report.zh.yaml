      - number: '4.2'
        title: 资本强度与制造扩建
        blocks:
          - type: paragraph
            body: |
              Science Corporation 的资本强度由两个相互强化的成本中心撑住：
              临床阶段 R&D（试验、监管申报和持续扩张的工程团队），以及
              专门建设的半导体制造基础设施。Science Foundry 部门位于北卡罗来纳州
              Durham 的 Research Triangle Park，一座 MEMS 工厂内；该工厂原属法国公司
              MEMSCAP，2022 年被收购。Science Corp 计划投入最高 $65 million，将该工厂扩建
              57,000 平方英尺；Durham County 委员会一致批准一项为期十年、金额 $930,000 的
              绩效型激励，前提是公司达成就业创造和投资目标。扩建预计新增 50 多个岗位，
              其中约三分之二只要求两年制学位或更低学历，说明团队构成更偏制造一线，而非
              纯研究。多数 medtech 同业外包 MEMS 生产；Science Corp 自建能力，是为了缩短
              迭代周期、压低长期单机成本，并消除单一来源供应风险。该 foundry 也向其他医疗和
              BCI 设备公司提供第三方 MEMS 服务，正在形成一条早期的第二收入线。$65 million 的
              foundry 资本开支叠加在持续 R&D 和临床费用之上，使年度现金消耗在结构上高于
              轻资产或外包制造的同业。这项资本开支承诺于 2024 年中宣布，并与 PRIMA 商业化
              推进同步执行，意味着制造放量和临床进展并行——这是有意为之的战略选择，但资本
              消耗很重，需要投资者在多个里程碑关口持续保持信心。
