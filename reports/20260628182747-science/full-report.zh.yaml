      - number: '6.4'
        title: 商业采用路径：监管关口与报销缺口
        blocks:
          - type: paragraph
            body: >
              Science Corporation 已同步向欧盟提交 PRIMA 的 CE mark 申请，并向 FDA 提交 IDE/PMA-equivalent；公司 2026 年 6 月患者登记公告确认了这一点。
              行业分析师和新闻报道一致把德国视为预期首个商业市场，原因是其新设备监管框架以及 neurotechnology 早期准入批准的历史先例。市场普遍预期 CE mark 会在 2026
              年中获批，但截至报告日期尚未公开宣布批准。英国方面，Dr. Muqit 确认，CE mark 之后可能还需要一到两年额外审批， 依次通过 MHRA、NICE health technology
              assessment 和 NHS England commissioning——这是高成本植入设备典型的三阶段守门流程。美国路径更长： PRIMA 拥有 FDA Breakthrough Device
              designation（继承自 Pixium 收购），可加快审评，但不能绕过完整 PMA 路径。关键在于，截至 2026 年 6 月， 美国没有 PRIMA 的 Medicare
              报销代码、全国覆盖决定或地方覆盖政策。American Society of Retina Specialists 对 2026 年 Medicare 支付提案的审阅， 未发现 PRIMA
              系统的特定代码；新型植入设备通常需要先发生 FDA clearance 事件，再分配 CPT/HCPCS 代码，并随后进入 CMS 审查，之后才开始任何有覆盖的
              临床使用。该顺序可能在美国监管放行与实际可报销商业部署之间制造多年缺口。
