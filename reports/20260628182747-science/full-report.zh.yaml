  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与层级结构
        blocks:
          - type: paragraph
            body: >
              Science Corporation 的 PRIMA 植入物面对两个结构性层级的竞争，它们在临床重叠、时间线和战略相关性上不同。第一层是直接视觉假体竞争，包括为 PRIMA 目标患者群体——AMD
              导致的晚期地图样萎缩和终末期遗传性视网膜疾病——开发视网膜或皮层设备的公司。截至 2026 年中，这一层出奇地稀薄：最初开发 PRIMA 的法国公司 Pixium Vision SA 已被清算，资产于 2024
              年 4 月被 Science Corp 收购；Retina Implant AG 于 2019 年解散；Second Sight 的 Argus II 到 2020
              年已退出商业市场；仍在运营的直接同业只剩澳大利亚的 Bionic Vision Technologies（BVT）和 Cortigent（Vivani Medical 子公司）。第二层是 BCI
              资本和注意力竞争，包括 Neuralink、Synchron 和 Precision Neuroscience。它们不争夺同一批患者，却吸收同一池神经科技投资资本和临床中心培训能力。BCI 板块仅 2026 年
              Q1 就融资超过 $960M，资本正向行业观察者所称的侵入式 BCI “Big 6”集中。Science Corp 作为首个进入市场的视觉修复 BCI 公司的叙事，要同 Neuralink
              更宏大的技术野心、Synchron
              的微创优势争夺有限投资人注意力和专科神经外科经验。必须同时理解两层竞争：直接竞争者设定临床证据门槛和商业失败先例，资本竞争者定义融资环境，并可能把医院和支付方注意力从视觉修复上带走。Pixium Vision
              的历史很有启示意义——它开发 PRIMA、开展早期临床试验，并搭建了 Science Corp 如今运营的 CE 认证申请基础设施。收购不只是一次 IP 交易：它移除了一个潜在近期竞争者，并让 Science
              Corp 独占目前临床进展最成熟的视网膜下光伏平台。截至 2026 年 6 月，任何永久植入式 BCI 设备都没有 Medicare 全国覆盖决定或 FDA
              上市前批准，这意味着两个层级的所有竞争者都共同面对未解决的报销风险。
