  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Science Corporation 自 2021 年创立以来，已通过至少三次有记录的资本事件融资约 $490M。最近一次是 2026 年 3 月超额认购的 $230M Series C，由
              Lightspeed Venture Partners 和 Khosla Ventures 领投，Y Combinator、IQT（In-Q-Tel）和 Quiet Capital
              追加参与；五家均为复投投资者，说明信心延续，而非新验证者入场。该轮投后估值约 $1.5B，使 Science Corp 成为仅次于 Neuralink、资本化程度第二高的专注脑植入创业公司。Series C
              之前，公司于 2025 年 4 月完成 Khosla Ventures 领投的 $104M 可转债。该票据条款——估值上限、折扣率和转换机制——未公开披露；票据是在 Series C
              交割时转换，还是仍作为未偿义务存在，也不得而知。Series A 和 Series B 的单轮规模未公开报告，使完整的逐轮稀释路径在尽调中不透明。超额认购结果，以及从票据（2025 年 4 月）到股权轮（2026
              年 3 月）的快速节奏，说明投资者需求强劲；但未披露的股权结构阻止外部独立核验创始人稀释、清算优先权栈深度或投资人清算优先级。Science Corp 在首笔商业收入前已投入 $490M
              总资本，明确处于临床阶段医疗科技的资本密集层级；在这里，能融资是商业成功的必要条件，但远远不够。
