      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: Argus II 先例使报销成为决定性护城河测试
            body: >
              三个直接前辈——Second Sight（Argus II）、Retina Implant AG（Alpha AMS）和 Pixium Vision（被收购前的
              PRIMA）——即便拥有监管批准和可信临床数据，也都未能实现商业自给。Science Corp 已跨过前辈没能跨过的临床证据门槛，但商业门槛——CMS 报销政策、MAC
              覆盖、医生采用和长期患者支持——仍完全未解。PRIMA 的 CE 认证提交和最终批准会是里程碑，但这个赛道的历史要求尽调同等重视下游商业模型和上游科学。
            calloutType: risk
            claimRefs:
              - CP007
              - CP034
              - CP044
          - type: callout
            title: PRIMA 是唯一处于 CE 认证阶段且拥有 NEJM 证据的活跃视网膜 BCI
            body: >
              截至 2026 年中，Science Corp 位置独特：它是唯一拥有正在审理的视网膜 BCI CE 认证申请、且由 NEJM 发表的双位数患者队列证据支撑的公司。BVT 有临床数据，但监管成熟度至少落后
              PRIMA 三个开发阶段；Cortigent 需要开颅，且只完成了 6 名参与者的可行性研究。没有 BCI 资本竞争者瞄准同一适应症。上述证据优势叠加 Pixium IP
              收购和自有芯片制造，构成真实的中短期竞争护城河，哪怕它尚不足以抵御前述系统性商业化风险。
