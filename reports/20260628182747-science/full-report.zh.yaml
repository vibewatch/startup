      - number: '5.5'
        title: 生物混合神经接口与开发者生态
        blocks:
          - type: paragraph
            body: |
              Science Corporation 时间跨度最长的技术项目，是生物混合神经接口。传统 BCI 使用金属或硅电极，无法与神经元形成突触连接，
              且通常会因胶质瘢痕在数年内退化。Science 的生物混合架构把实验室培养的神经元直接嵌入薄膜电极阵列；
              这些神经元源自干细胞，并经过基因改造以表达光敏 opsins（optogenetic transduction）。植入后，这些神经元向宿主大脑延伸
              轴突和树突，形成突触连接。一块播种 100 万个嵌入神经元的薄膜设备，理论上可与大脑形成 10 亿个突触，
              带宽上限比金属电极阵列高出几个数量级。

              当前生物混合设备在约豌豆大小的面积内塞入 520 个记录电极。Neuralink 采用穿透式电极；Science 的设备则置于脑表面
              （皮层表面放置，不穿透），因此可能减少胶质损伤并延长设备稳定性。2024 年，公司发表 working paper，展示在小鼠中
              安全植入并对皮层回路执行功能性 optogenetic 刺激。截至 2026 年 4 月，Yale Medical School 神经外科系主任
              Murat Günel 已加入，担任人体植入项目科学顾问。近期计划是在已经接受大型脑手术的患者体内植入该设备的电极传感器
              （不含嵌入神经元），例如因脑肿胀管理而接受 craniectomy 的患者，以评估安全性。Science Corp 表示，不计划为这些
              初始的仅电极传感器试验寻求 FDA 批准，理由是设备不构成显著风险。含嵌入神经元的完整临床试验预计在 2027 年之后。
              生物混合 R&D 团队由 CSO Alan Mardinly 领导，约有 30 名研究人员。

              开发者生态方面，Science Corporation 在 github.com/sciencecorp 保持活跃开源存在。主要开发者工具是 Synapse API——
              一组 protocol buffer 定义，让 Python、TypeScript 和 C++ 客户端库能通过 gRPC 发现 Synapse 设备并与其通信。
              synapse-python 仓库有 17 个 GitHub stars，并于 2026 年 6 月 26 日更新；更大的组织下有 18 个公开仓库，覆盖
              Synapse API、Galago 实验室自动化栈、NDTP（Neural Data Transport Protocol）和实验应用示例。开源生态降低了
              Science 芯片家族被研究用户采用的门槛，也在商业产品推出前制造开发者锁定。
