      - number: '3.3'
        title: BCI 资本和注意力竞争——Neuralink、Synchron、Precision Neuroscience
        blocks:
          - type: paragraph
            body: >
              Neuralink、Synchron 和 Precision Neuroscience 不做视觉修复，也不争夺 Science Corp 的患者，但它们是同一投资资本池、临床中心培训资源和公众 BCI
              叙事的主导索取者；这些资源决定估值倍数、媒体关注和医院合作入口。Neuralink 是资本最充足的 BCI 公司，2025 年 6 月完成 $650M Series E，据报累计融资约 $1.3B。截至 2026
              年初，其 PRIME 研究（NCT06429735）已在美国、加拿大和英国入组 21 名参与者，目标是四肢瘫痪患者的光标控制应用。尽管入组势头强劲，Neuralink 第一名人体参与者在植入后数周内约 85%
              电极线从脑组织回缩，显著削弱设备信号解码能力；软件更新部分补偿了问题，但未解决硬件不稳定。美国 SEC 于 2024 年末重启对 Neuralink 潜在误导性安全声明的调查。Elon Musk 的公众形象驱动
              Neuralink 获得异常强的媒体存在感，形成 BCI 心智份额，可能把投资人注意力和媒体覆盖从 Science Corp 更接近商业化、临床故事也可说更成熟的方向上带走。Synchron 于 2025 年
              11 月完成 $200M Series D，使累计融资达到约 $345M；该资金明确投向 2026 年 Stentrode 血管内设备的 FDA 关键临床试验。Synchron
              的路径通过颈静脉把植入物送入运动皮层血供，避免开颅；相比穿透式电极方案，这种微创优势扩大了医院采用漏斗。Synchron 面向 ALS、瘫痪和中风患者；它同 Science Corp
              竞争的是资本和临床中心注意力，不是同一批患者。如果 Synchron 关键试验成功并获得 FDA PMA，它正在争夺“美国首个商业获批 BCI”的头衔，这一里程碑会在叙事上与 Science Corp
              潜在的欧盟率先商业化故事竞争。Precision Neuroscience 于 2026 年 6 月完成 $120M Series D，使累计融资超过 $290M，由 General Catalyst
              领投，Microsoft M12 和 Coatue Management 参与。其 Layer 7 Cortical Interface 是硬膜下薄膜电极阵列，已获得 FDA 510(k) 用于最长 30
              天神经生理应用的许可，使其成为截至 2026 年中唯一拥有任何商业 FDA 许可的新一代皮层 BCI 设备。公司已在超过 85 名患者体内植入设备，合作医院超过 15 家，并正准备为关键 ALS 试验提交
              IDE。和 Neuralink、Synchron 一样，Precision Neuroscience 不面向视觉修复；其竞争相关性在资本和监管注意力。到 2026 年中，这三家公司合计吸收超过 $1.5B
              累计资本，形成竞争性融资环境，Science Corp 必须围绕监管接近度和临床证据特异性讲出差异化叙事。
