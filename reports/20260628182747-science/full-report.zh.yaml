  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 支柱
      - 论点（牛市）
      - 反论点（熊市）
      - 什么会改变判断
    rows:
      - - 临床证据
        - NEJM 论文发表，47 名患者、17 个站点中 80–84% 患者达到成功标准；这是同等规模下首个经同行评审的 BCI 视觉恢复数据
        - 24 个月 GA 进展（植入眼 8.5 mm²，对侧眼 2.5 mm²）；SAE 率 50%；36 个月之后没有长期耐久性数据
        - 长期疗效数据（48+ 个月）；商业规模下 SAE 率低；DSMB 继续建议推进
      - - 监管路径
        - CE Mark 已于 2025 年 6 月提交；FDA Breakthrough Device；2026 年 4 月 RAPID 路径可用；首个 BCI 可能在 2026 年中上市
        - EU MDR 下 CE Mark 决策不可预测；FDA PMA 180 天 + 可能的 AI 延期；Breakthrough 不降低证据门槛
        - CE Mark 批准确认；FDA 预提交会议纪要显示没有额外试验要求
      - - 市场机会
        - 全球 5M+ GA/AMD 患者；可扩展至 Stargardt/RP；BCI 市场从 $3.2B（2025）增长到 $12.9B（2034）
        - 可及市场受报销限制；仅限适合手术的患者；基因疗法在适应症上竞争
        - CMS 对视网膜下假体发布 NCD；CE Mark 后 12 个月内，≥2 个欧盟市场确认报销
      - - 竞争位置
        - 首个商业化 BCI 植入物；市场上没有可比视觉恢复产品；MEMS 代工厂形成差异化
        - Neuralink 通过 Blindsight 项目用皮层植入物瞄准同一 AMD；非侵入式光遗传疗法可能削弱手术意愿
        - Neuralink Blindsight 在任何共同适应症上早于 PRIMA 商业发布
      - - 资本效率
        - 为 CE Mark 阶段临床资产融资 $490M；自有代工厂带来垂直整合优势
        - 在融资 $490M 后仍处收入前；Second Sight 花费 $300M+，峰值年收入低于 $5M
        - CE Mark 批准后 18 个月内，年化收入 >$20M
      - - 估值纪律
        - $1.5B vs Synchron 约 $1B，且临床证据更少；CE Mark 临近可部分支撑溢价
        - $1.5B 已把部分牛市执行计入价格；按情景概率，期望价值约 $1.0B；存在私募市场标记膨胀风险
        - 以 $1.0–$1.2B 入场（二级或下一轮），可把期望价值推到正区间
    notes: |
      所有评估基于截至 2026 年 6 月的公开证据。公司内部财务、股权结构和管线预测可能显著改变各支柱判断。 本表仅供参考，不构成投资建议。
    claimRefs:
      - CV005
      - CV012
      - CV015
      - CV017
      - CV018
      - CV019
      - CV022
  - id: TV003
    title: 可比估值表
