      - number: '2.3'
        title: 市场规模：多重口径与相互冲突的估计
        blocks:
          - type: paragraph
            body: >
              视网膜假体的市场规模估计会随边界、方法和分析师显著变化，单一 TAM 数字容易误导。Mordor Intelligence 使用聚焦活跃设备单元的窄口径，估算全球视网膜植入物市场 2025 年为
              $56.53M，2026 年增至 $61.28M，2031 年达到 $91.72M，CAGR 为 8.4%。Insight Partners 使用更宽的视网膜假体口径、纳入传统设备，报告 2025 年为
              $392.53M，2034 年增至 $922.5M，CAGR 为 11.27%——同一市场和年份表面上出现 7× 差异。两家机构均未公开精确口径差异，这种不一致应视为所有已发布视网膜假体市场估计的局限。


              作为背景，AMD 药物市场（抗 VEGF 药物、补体抑制剂）2025 年为 $12.64B，2026 年预计为 $13.58B，哪怕相比最宽口径的视网膜植入物估计也大约高 200×。更广义的整体 BCI
              市场（Grand View Research：非侵入式 SOM 为 $397.59M，侵入式 TAM 为 $168.27B）远不止视觉应用，不应拿来替代 PRIMA。基于约 100 万美国 GA
              患者、近期手术采用率 2–5%、每套系统平均售价 $50,000–$100,000 的粗略自下而上患者人口 SAM，推得美国潜在天花板 SAM 为
              $1B–$5B——但这只是远期天花板；考虑到报销环境仍处早期，且获批后需要 3–5 年爬坡，近期商业相关性不高。已发布估计互相冲突，且缺乏经过验证的 PRIMA 专属测算，这是尽调应明确指出的重大证据缺口。
