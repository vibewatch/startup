      - number: '8.4'
        title: 情景分析与概率加权估值
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Science Corp 的估值区间可由三种情景框定。多头情景假设：2026 年 Q3 获得 CE Mark；2026 年 Q4 在德国商业化上市并获得早期准入报销；以
              €80K–€90K 器械 ASP，每季度爬坡到 10–15 例手术；RAPID pathway 使美国 Medicare 在 FDA 批准后 90 天内覆盖（2027–2028 年）；晶圆代工 /
              生物混合平台可选性贡献终值。在该情景下，以 2028 年预计收入 $120M–$200M 的 7–10x 远期收入倍数计算，隐含企业价值为 $2.5B–$3.5B，相比 $1.5B
              进入价可带来扎实的风险调整回报。基准情景假设 H2 2026 获得 CE Mark，但德国和法国在形成有意义报销前需要 12–18 个月 EU HTA 流程，美国 FDA 在 2029
              年作出决定，医院采用也因行业过往失败史而谨慎。基准情景首年收入 $30M–$50M，按 4–6x 远期倍数计算，隐含 EV 为 $700M–$1.1B，低于 2026 年 3 月进入估值。空头情景假设 CE
              Mark 延迟到 2026 年之后，欧盟报销在 2 年内无法建立（沿用行业先例），FDA 进一步延后到 2030 年之后，并需要降价轮或困境战略出售。空头情景隐含价值为 $150M–$400M，Series C
              投资人将面临显著资本损失。按 30% 多头、50% 基准、20% 空头加权，期望价值约为 $1.0B–$1.25B，较 2026 年 3 月 $1.5B 进入价低 17–33%。这一负期望价值缺口部分被 DCF
              情景未捕捉的可选性价值抵消：生物混合项目、晶圆代工业务和 Science Eye 平台创造了收入型估值未建模的上行情景。对投资期 7–10 年、组合能承受二元 FDA 风险的基金而言，$1.5B
              估值可以辩护但并不诱人；若以 $1.0B–$1.2B 进入，吸引力会明显提升。
