      - number: '2.4'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >
              Science 的 PRIMA 系统涉及三个不同市场角色。买方——按手术流程意义——是选择技术、接受植入培训并把它纳入临床工作流的视网膜外科医生或专科眼科中心。用户是晚期 GA、RP 或 Stargardt
              患者。支付方是 Medicare、商业保险或国家卫生服务体系。初始资本开支的预算归属医院或外科中心；一旦建立报销，单患者报销资金则来自支付方。


              在美国，晚期 GA 主要影响符合 Medicare 资格的人群（65 岁及以上），因此 Medicare 是主导支付方。RP 和 Stargardt 患者更年轻，依赖商业保险，某些情况下依赖
              Medicaid；IRD 适应症还可能涉及部分罕见病路径。2025 年，医院占全球视网膜植入物终端用户市场的 54.5%（Mordor Intelligence），专科眼科诊所 CAGR 为
              11.42%。北美占全球市场份额 39.75%。RP 占当前视网膜植入物市场疾病适应症的
              46.95%——这说明当前商业可行的方向，不一定代表天花板。手术能力的地理集中很重要：视网膜下植入需要受过专门训练的视网膜外科医生，早期采用会集中在学术医学中心，从而限制商业化早期的量。
