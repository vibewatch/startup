      - number: '2.5'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              PRIMA 的主要市场驱动因素，是晚期 GA 没有任何获批的视觉修复疗法：临床对照是自然病程，因此任何程度的功能恢复都代表对患者有意义的进步。人口老龄化会结构性扩大合格人群，因为 AMD 与年龄高度相关。GA
              进展不可逆——多数确诊患者会在 2–3 年内丧失大量视力——如果存在安全且可报销的选择，临床紧迫性会推动患者意愿。监管顺风包括 FDA 的突破性设备认定路径缩短视觉假体审评周期，以及遗传性视网膜疾病在北美每年
              $13.5B–$32B 疾病负担的成本分析，可支撑支付方经济性论证。远程眼科正在把视网膜植入候选筛查的地理触达从大型中心向外扩展。


              但重大采用约束同样真实。视网膜下植入是复杂的专科手术，需要拥有受训视网膜外科医生的中心，手术会集中在学术场景，社区铺开速度受限。Second Sight Argus II 的失败——Second Sight
              财务崩溃后，超过 350 名患者被留在过时且无人支持的植入物上——为视网膜假体市场立下了负面先例。Argus II 单台设备定价 $115,000–$150,000，单患者总治疗成本接近
              $500,000；保险覆盖有限，是其商业失败的重要原因。患者和支付方评估一款新型视网膜植入物时，仍会高度关注创业公司上市后设备支持不足的风险。外科场景资本强度高、手术学习曲线陡，以及 GA
              适应症植入物缺乏既有报销代码，都会叠加限制近期采用。
