      - number: '4.3'
        title: 收入模式与报销格局
        blocks:
          - type: paragraph
            body: |
              截至 2026 年中，Science Corporation 在美国仍未产生收入。PRIMA 的商业发布目标是在
              CE Mark 申报之后，于 2026 年晚些时候先在欧洲落地；如果实现，Science Corp 将成为
              第一家把视觉恢复产品推向商业市场的 BCI 公司。Science Corp 尚未公开任何标价、
              医院采购价或手术费用。最近的历史参照是 Argus II（Second Sight）：其单设备标价约
              $145,000，拥有专门的 CMS 报销代码（C1849），总治疗周期成本（设备、手术和康复）
              为 $200,000–$300,000。PRIMA 在欧洲的参照价则来自 Pixium Vision 破产前的报价：
              单设备 €80,000–€100,000。美国报销存在结构性不确定性：Anthem 2026 年 4 月的
              覆盖政策明确把所有人工视网膜设备列为试验性，且对所有适应症均非医学必需——这代表
              当前主要支付方的默认立场，而不是孤例。CMS 和 FDA 于 2026 年 4 月联合宣布 RAPID
              覆盖路径，旨在让获得 Breakthrough Device designation 的产品在 FDA 批准后 60–90 天内
              获得 Medicare 覆盖；但截至研究日期，公开记录尚未确认 PRIMA 是否拥有 Breakthrough
              Device designation。新的植入手术通常需要定制 HCPCS 计费代码；Review of Ophthalmology
              的 2026 年编码更新确认，人工视网膜假体的覆盖仍取决于具体支付方。CMS 2026 OPPS
              最终规则只给复杂眼内手术带来小幅支付提升，APC 平均报销约 $4,222——远低于预期设备
              采购成本，进一步说明美国商业采用放量前必须先补上报销缺口。
