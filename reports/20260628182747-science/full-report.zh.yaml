      - number: '7.6'
        title: 行业先例、结构性风险与终止标准
        blocks:
          - type: paragraph
            body: >
              视网膜假体行业即便完成临床概念验证，也持续出现商业失败。Second Sight Medical Products 在 2019 年放弃 Argus II 仿生眼产品线，留下 350
              多名患者使用缺乏支持的植入体；Barbara Campbell 的案例成为典型警示——她的 Argus II
              在纽约地铁站内失效，使她在本已危险的环境中突然失明，说明医疗科技公司若退出却没有器械连续性计划，会给患者带来什么后果。Pixium Vision 在 2024 年进入 Paris Commercial Court
              清算程序，并被 Science 以约 €4 million 收购，说明即便已有 CE 认证的器械，如果缺乏报销支持，也无法产生足够商业收入支撑独立公司。Retina Implant AG 在开发 16
              年后停止运营，理由是监管和报销环境不利于创新。Science Corp 的 PRIMA
              设计与这些前代产品有根本差异——它是视网膜下光伏刺激，面向仍有部分视力的患者，而非完全失明者；没有外部导线，手术技术也显著更简单——但支付方怀疑、长期耐久性证据有限、可服务患者规模小等结构性风险仍然相同。GAO
              将 BCI 技术中的伦理和隐私风险列为该行业 12 项最紧迫政策挑战之一，包括数据安全、认知自由和「神经监控」风险；PRIMA 连接到可穿戴 AI
              处理单元并持续捕捉视野数据，使这些担忧更强。机构支付方的两难进一步放大这些结构性风险：商业收入有限会压低正向覆盖决定所需的临床证据基础，而覆盖缺口又阻止产生这些证据所需的商业化。可监测的终止标准包括：(1)
              FDA 拒绝受理 PMA 或发出不可批准函；(2) RAPID pathway、CE 认证或 CMS 覆盖决定延迟到 2029 年之后；(3) PRIMAvera 延长期数据中出现第三类严重 SAE；(4)
              Hodak 离职且未披露继任计划；(5) Series C 后 24 个月内无法以持平或上轮估值融资完成 Series D。
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
              - CR041
              - CR042
