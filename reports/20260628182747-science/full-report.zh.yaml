      - number: '3.2'
        title: 直接视觉假体同业——传统失败与存活玩家
        blocks:
          - type: paragraph
            body: >
              直接视网膜假体竞争史很大程度上是一部商业失败史，这也让 Science Corp 的 PRIMA 所在赛道中活跃同业少于技术版图表面显示的数量。Second Sight Medical Products
              是第一家获得 FDA 视网膜假体批准的公司，其 Argus II 视网膜上设备于 2013 年通过 Humanitarian Device Exemption（HDE）路径获批；但在 2019–2020
              年撤回产品前，公司用约 20 年累计投入约 $300M，只从全球约 350 名患者身上产生约 $32M 总收入。关键失败原因包括：患者群体太小，无法支撑商业经济性；总手术成本过高（含手术和康复约
              $500,000）；无法获得广泛 Medicare Administrative Contractor（MAC）报销覆盖；医生对新型手术流程不熟悉。产品撤回后，约 350 名 Argus II
              患者被留在无人支持的植入物上，形成了具有长期伦理和监管影响的患者遗弃先例。Second Sight 随后于 2022 年与 Nano Precision Medical 合并为 Vivani
              Medical，并转向药物递送；神经刺激业务被剥离为 Cortigent。Cortigent 的 Orion 视觉皮层假体系统于 2025 年 3 月完成 6 年早期可行性研究，全部 6
              名参与者均显示安全性、可靠性和可测量的视觉评估改善，电极功能损失低于 4%。Orion
              刺激视觉皮层，而非视网膜，绕过整个受损视觉通路——这是一项重要技术差异，因为它可服务同时失去感光细胞和视网膜神经节细胞功能的患者，适应症比 PRIMA 更广。然而，Cortigent
              需要开颅，商业化道路上至少落后 PRIMA 一个完整开发阶段。德国 Alpha AMS 视网膜下电极阵列开发商 Retina Implant AG（2016 年获 CE 认证，1,600 个电极）于 2019 年
              3 月决定解散，理由是欧洲报销不足、监管门槛高、临床结果未达到患者预期；公司没有收购方。澳大利亚公司 Bionic Vision
              Technologies（BVT）是唯一仍活跃、且拥有可信临床数据的直接视网膜假体竞争者。其第二代 44 通道脉络膜上设备植入在视网膜层外、位于巩膜和脉络膜之间；2024 年发表结果显示，4 名临床试验参与者
              2.7 年时电极保留率为 97%，并在导航和物体探测上获得功能改善，FDA Breakthrough Device Designation 支持加速监管路径。不过，BVT 披露总融资约 $18M，约为
              Science Corp 的 1/27；要开展全球关键试验并进入商业化，还需要大幅增加资本。
