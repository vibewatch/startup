      - number: '2.2'
        title: 疾病负担与可触达患者群
        blocks:
          - type: paragraph
            body: >
              PRIMA 的主要目标适应症是年龄相关性黄斑变性（AMD）继发的晚期地图样萎缩（GA）。美国约有 100 万名 GA 患者，全球约 500–800 万名；美国每年新增 160,000 例。GA
              对老年人影响尤其大：60–64 岁患病率为 0.28%，70–74 岁升至 0.98%；随着人口老龄化，全球 AMD 患病人数预计到 2050 年达到 2.88
              亿。仅欧洲四大市场——德国（400,000–450,000）、法国（265,000）、意大利（170,000）和西班牙（155,000）——GA 就影响超过 100
              万名额外患者；若能获得报销，将构成显著的欧洲商业机会。


              除 GA 外，Science 已把 PRIMA 临床开发扩展到遗传性视网膜疾病（IRDs）。视网膜色素变性全球发病率约为 1/4,000，美国患者 80,000–110,000 人；约 12%
              会发展为重度视力丧失（只能数手指或感知手动）的晚期疾病，进入植入候选层。Stargardt 病是最常见的青少年黄斑营养不良，全球约每 8,000–10,000 人中有 1
              人受影响；发病更早，形成了不同且更年轻的手术候选人群。三大主要适应症合计带来约 120
              万美国终末期视网膜退化患者池——但手术候选条件，包括残余视网膜功能、完整双极细胞层和手术健康阈值，会把可植入人群压到显著低于这些流行病学总量。GA 约占所有 AMD 相关法定失明的 20%，凸显 PRIMA
              所切入病情层级的严重性。
