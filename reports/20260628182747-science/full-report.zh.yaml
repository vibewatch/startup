      - number: '6.5'
        title: Foundry 生态：Science BCI 平台的 B2B 客户
        blocks:
          - type: paragraph
            body: >
              Science Corporation 于 2026 年 2 月 20 日宣布，与总部位于 Geneva 的神经数据公司 Neurosoft Bioelectronics 建立多年期 BCI Ecosystem
              合作。 Neurosoft Bioelectronics 开发用于 tinnitus、epilepsy 和其他神经疾病的超软皮层探针；合作宣布前，其探针已用于十几名人体患者。在 Science Ecosystem
              模式下，合作伙伴可获得 Science 完整的临床级神经记录技术栈——包括记录电子系统、神经探针、软件和应用工具——成本只是独立开发同等基础设施的一小部分。 Science 估计，从零搭建全栈临床级 BCI
              平台需要 $75 million 到 $100 million，并耗时多年；Ecosystem 合作使首次人体试验能以不到 $5 million 的成本、 用更短时间启动。Science CEO Max
              Hodak 称 Neurosoft 交易是预期「许多」合作中的第一笔，把 Science Ecosystem 定位成类似半导体行业 foundry 服务的平台商业模式。 这些生态伙伴是不同于患者 / 医院渠道的
              B2B 客户类别：他们购买 Science 工程基础设施的使用权，而不是 PRIMA 设备本身，并且瞄准 Science 内部项目之外的神经适应症。
              生态交易的收入模式是多年期、数百万美元级合同，但具体财务条款尚未披露。下方客户证明矩阵对四类客户细分的证据质量作横向比较。
