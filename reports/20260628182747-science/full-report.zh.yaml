        - 混合商业模式（研究工具 + 临床）；估值方法不清晰
      - - EdgeMedical（IPO 基准）
        - 商业阶段外科机器人；已有收入
        - N/A（IPO 公司）
        - $2.2B IPO 估值（2026 年 1 月，NASDAQ）
        - PitchBook 2026 年 Q1 Medtech VC and PE Trends；Private Markets Insights 报道
        - 为品类领先 medtech 设定公开市场 IPO 基准；Science Corp 需要 FDA 批准和收入，才可能接近这条路径
        - 产品类别完全不同；商业阶段且有收入；Science Corp 仍处收入前
    notes: >
      除非明确确认，私营公司报道估值均为分析师隐含或二级市场估计。Science Corp 的 $1.5B 是 Series C BusinessWire 新闻稿报道的投后数。
      历史可比公司反映终局结果，不代表运营活跃期的峰值估值。除另有说明，所有数字均为美元。
