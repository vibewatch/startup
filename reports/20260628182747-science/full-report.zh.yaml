      - number: '4.5'
        title: 反向证据与财务风险因素
        blocks:
          - type: paragraph
            body: |
              Science Corp 财务模型最突出的反向证据，来自三家直接前身的商业化记录。Second Sight
              Medical Products 在 Argus II 视网膜假体上投入超过 $300 million、历时 24 年，累计收入
              不到 $32 million，随后在 2019 年突然停止，导致全球数百名植入者失去产品支持。
              PRIMA 的原开发方 Pixium Vision 在耗尽资本后于 2024 年初进入司法清算；Science Corp
              在法院监督下收购其资产。Retina Implant AG 的 Alpha AMS 未能达到商业规模后，于
              2019 年解散。三家前身都有可信的临床科学，却都未能把试验数据跨到规模化商业收入。
              报销壁垒是结构性的：Anthem 2026 年政策把所有人工视网膜设备列为试验性且非医学必需；
              在大规模临床结局数据和标准化 CPT 代码到位前，这就是主流支付方立场。BCI 领域融资在
              2026 年 Q1 创下 $960 million 的纪录，Science Corp 超额认购的 Series C 也确认当前投资者
              风险偏好仍强，但 VC 资金具有阶段性；临床挫折、监管延误或宏观收紧，都可能显著压缩
              可用 runway。MedTech Impact Partners 警告，CMS 提议在 FY2028 前废止 NTAP 替代支付路径，
              将提高医院附加支付的证据门槛，压窄届时尚未获覆盖设备的报销窗口。Science 已通过多轮
              优先股融资筹得 $490 million；若退出不利，投资者清算优先权可能大幅压缩普通股和创始人
              回报，而不透明的 cap table 使该风险无法独立评估。
            claimRefs:
              - CI017
              - CI021
              - CI022
              - CI023
