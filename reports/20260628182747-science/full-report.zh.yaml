  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 商业化前格局：界定 Science Corporation 的客户宇宙
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，Science Corporation 仍完全处于商业化前。公司没有传统意义上的付费客户；PRIMA 视网膜植入系统的所有当前用户， 要么是临床试验参与者，要么处在
              compassionate-access 或登记背景下的患者，要么是收入前安排中的商业伙伴。这对临床阶段 medtech
              公司并不反常，但对任何商业评估都是关键背景：今天的所有需求信号都是前瞻性的，并取决于尚未解决的监管结果。客户格局可拆成四类角色： （1）因 AMD 导致 advanced geographic
              atrophy、或遗传性视网膜退化且符合植入条件的患者；（2）作为临床守门人并最终成为商业采购方的 植入玻璃体视网膜外科医生和学术医院系统；（3）汇集并导流患者需求的患者倡导组织和登记系统；（4）foundry
              生态伙伴——授权使用 Science 神经工程平台的早期 BCI 公司。每个细分都有不同采购路径、不同牵引证据、不同收入时间线。下方客户分层表完整映射这些维度；
              客户旅程图则展示患者从疾病出现到长期使用设备依次经历的阶段，并标出 Science 必须先交付哪些商业基础设施，才能把患者需求转成收入。
