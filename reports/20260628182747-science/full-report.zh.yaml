      - number: '6.3'
        title: 患者登记与倡导：导流潜在需求
        blocks:
          - type: paragraph
            body: >
              Science Corporation 于 2025–2026 年推出正式患者登记，覆盖确诊 age-related macular degeneration、retinitis pigmentosa 和
              Stargardt disease 的个人。这个登记系统同时承担多项商业功能：生成未来 PRIMA 患者的合格管线，为扩展适应症的临床试验设计提供信息，
              并在公司与患者社区之间建立直接沟通渠道。参与免费、尊重隐私且可撤回，参与者保留完整数据控制权。登记系统不仅跟踪最佳矫正视力等传统临床指标， 也跟踪 Science
              认定最能体现患者获益的功能结局——阅读能力、人脸识别和导航。登记参与者可优先进入未来临床试验和新一代设备。Science Corp 称，全球约有 500 万人受 end-stage atrophic AMD
              影响，目前没有能恢复视觉的疗法；这构成主要可服务患者池。资格门槛很严：患者必须 年满 60 岁，患有伴 geographic atrophy 的 advanced dry AMD，研究眼最佳矫正视力为
              20/400 或更差，并确认存在中央暗点。这个狭窄的 资格漏斗，再加上保留周边视觉且没有其他混杂眼部疾病的要求，预计会使商业就绪人群远小于 AMD 大盘数字暗示的规模。患者倡导组织已经参与； Macular
              Society（UK）称 PRIMA 结果「令人鼓舞」，并表示正在密切关注英国监管批准和未来 NHS 可及性。
