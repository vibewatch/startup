        - 最直接的阶段可比（CE Mark 阶段、融资规模相近）；Science 临床数据更强
        - 适应症不同（瘫痪 / 运动，不是视觉）；公开临床证据少于 Science
      - - Precision Neuroscience
        - 早期人体测试；硬膜下 ECoG；IDE 批准待定
        - 总计 ~$155M
        - 约 $500M（Series C 后，2024 年 12 月，隐含）
        - 多个分析师估计；未披露；基于 Series C 金额和阶段可比公司
