      - number: '5.2'
        title: 临床证据与手术流程
        blocks:
          - type: paragraph
            body: |
              PRIMAvera 关键研究（NCT04676854）是 Science Corporation 支撑 PRIMA 的决定性临床证据基础。
              这项开放标签、多中心、前瞻性、基线对照试验，在法国、德国、意大利、荷兰、西班牙和英国的
              17 个中心，纳入 38 名 60 岁以上、晚期 GA 且基线视力差于 20/320（logMAR ≥ 1.2）的患者。
              主要终点是从基线到第 12 个月，视力至少改善 0.2 logMAR，达到临床意义。32 名完成 12 个月随访的
              参与者中，26 人（81%；95% CI 64–93；p < 0.001）达到主要终点。对 6 名失访者（三例死亡、
              一例退出、两例不可用）做多重插补后，估计响应率为 80%（95% CI 66–94）。平均视力增益约为
              5 行 ETDRS（25.5 个字母）；单名患者最佳改善达到 12 行。32 名完成者中，27 人在第 12 个月能够
              阅读字母、数字或单词。部分同时使用眼镜数字变焦和对比度功能的患者，达到相当于 20/42 的视力。
              该研究由 Frank G. Holz（University of Bonn）牵头，José-Alain Sahel（University of Pittsburgh）
              和 Daniel Palanker（Stanford）担任资深作者；论文于 2025 年 10 月 20 日发表于 New England Journal
              of Medicine（NEJM 394:232–242；DOI 10.1056/NEJMoa2501396）。Jacque Duncan（UCSF）在同期 NEJM
              社论中称 PRIMA 是晚期 GA 中「第一种恢复视觉的治疗」。

              植入流程采用标准玻璃体视网膜手术技术。外科医生先做三孔 23 或 25 gauge 睫状体平坦部玻璃体切除，
              必要时诱导后玻璃体脱离，在黄斑中心凹颞侧做小视网膜切开口，再用专门定制注射器把 PRIMA 芯片送入
              视网膜下空间。芯片居中置于萎缩的中心凹下方；内激光光凝固定视网膜切开口边缘；可执行液-气或气体交换。
              没有外部电源线从眼球引出。术后四到五周，患者配戴 PRIMA 眼镜，并在低视力专家指导下开始结构化视觉康复；
              通常需要数月训练才能达到峰值表现——类似人工耳蜗用户所需的听觉学习。

              试验安全性负担显著但可管理。38 名患者中 19 人发生 26 起严重不良事件（50%）。最常见的是眼压升高
              （6 起，涉及 23% 患者），其次是周边视网膜裂孔（5 名患者）、植入期间视网膜下出血（3 名患者）和
              全层黄斑裂孔（3 名患者）。关键在于，所有 SAE 都归因于植入手术本身，或手术与设备共同作用；
              没有 SAE 被归因于设备单独导致。几乎所有 SAE 都在两个月内消退且无后遗症。Data Safety Monitoring Board
              正式认定，PRIMA 的获益超过其手术风险。
