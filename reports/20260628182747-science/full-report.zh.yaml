      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Science Corp 应采用按阶段调整的 medtech 逻辑，而不是 SaaS 倍数。2026 年商业化 medtech 硬件公司 EV/Revenue 倍数为 3.5–5.5x，EV/EBITDA 倍数为
              11–14x（据 healthcare.digital 的 2026 M&A 矩阵和 Equidam 的 2026 行业 EBITDA 调查）。若假设 2027–2028 年首个完整年度欧盟收入为
              $50M–$80M、毛利率 35–40%，这些倍数对应的企业价值约为 $175M–$440M，远低于 $1.5B。估值溢价由三类非倍数因素支撑：(1) BCI 视觉恢复中的先发和赢家多拿动态；(2)
              生物混合、晶圆代工和 Science Eye 项目带来的平台可选性；(3) Bain 跟踪的 2025 年 medtech M&A 活动达到 $97.6 billion，战略买家为品类领先器械支付 15–25x
              EBITDA。BCI 同业集提供最直接相关的可比：Neuralink 在 Series E 后估值 $9.6B（2025 年 5 月，融资 $656.5M，为 Science Corp 估值的
              6x），Synchron 在 Series D 后约 $1B（2025 年 11 月，累计融资 $345M），Precision Neuroscience 在 Series C 后约 $500M（2024 年
              12 月，累计融资 $155M）。Science Corp 累计融资 $490M、估值 $1.5B，在资本效率上有利：Synchron 融资 $345M 后隐含约 $1B 投后，约为累计融资的
              2.9x；Science 的 $1.5B 对 $490M 为 3.1x——几乎相当，但 Science Corp 的临床证据明显更强，近期商业化路径也更清晰。眼科 M&A
              可比的参考价值较低，因为它们涉及已有收入的平台（Cencora 以 $4.6B 收购 Retina Consultants of America，对应 15–23x
              EBITDA），但它们确认，视网膜领域战略买家愿意为差异化平台支付高倍数。历史视网膜假体失败案例（Second Sight 峰值市值约 $100M；Pixium 约 €4M 被收购；Retina Implant
              AG 停止运营）定义的是该行业的下行情景，而不是退出倍数。
