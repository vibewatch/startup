      - number: '6.2'
        title: 试验中心与植入医生作为入口客户
        blocks:
          - type: paragraph
            body: >
              参与 PRIMAvera 试验（NCT04676854）的 17 个欧洲临床试验中心，是 Science 早期客户网络中最成熟的一层。这些中心覆盖法国、德国、 意大利、荷兰和英国，共纳入 38 名 60
              岁或以上、患有晚期 dry AMD 和 geographic atrophy 的患者。首席研究者是 University Hospital Bonn 的 Dr. Frank Holz，他共同署名了 2025 年
              10 月的关键 NEJM 论文。在英国，Moorfields Eye Hospital 是唯一试验中心，在 Moorfields 及 UCL Institute of Ophthalmology
              高级玻璃体视网膜顾问 Dr. Mahi Muqit 领导下纳入 5 名患者。Dr. Muqit 称 PRIMA 芯片操作
              可由「任何受训玻璃体视网膜外科医生在两小时内」安全完成；这一表述显然是在为广泛临床可扩展性定位。在美国，由 Dr. José-Alain Sahel 领导的 University of Pittsburgh
              Medical Center（UPMC）Vision Institute 是首个在临床可行性研究中植入 PRIMA 的美国中心，因此成为 任何 FDA 放行发布的美国锚点商业中心。Science
              Corporation 在患者登记公告中称，截至该公告，已建立 18 个临床合作关系；该数字涵盖 PRIMAvera
              欧洲中心和正在扩张的美国可行性网络。监管批准后，这些试验中心很可能成为首批商业客户，从研究者发起的试验角色转为采购设备的 医院科室——前提是发布时已有报销基础设施。
