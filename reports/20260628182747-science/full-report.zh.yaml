            tableRef: TR005
            claimRefs: []
      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 监管—报销困局：获批但没有可及性还不够
            body: >
              Science Corporation 最核心的商业风险不只是监管获批，而是监管时点与报销基础设施的组合。Second Sight 的 Argus II 已获监管许可，却没有持久报销路径。Pixium
              Vision 的 Prima Alpha 和 PRIMA 已有 CE 认证，却无法产生足够收入维持生存。Science Corp 的 PRIMA
              设计明显优于两个前代产品，但结构性挑战相同：一款植入成本数万美元、还需要持续康复的器械，如果医院不能确信支付方会覆盖，就无法被商业化采用。2026 年 4 月公布的 RAPID Coverage Pathway
              正面回应了这一困局——但前提是 Science 主动加入，且 CMS 在 FDA 审评同步处理覆盖决定。只要这一协调出现任何滑坡，就会重现过去阻碍创新器械采用的获批后 6-18 个月空窗期。
            calloutType: risk
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR037
              - CR038
              - CR039
              - CR042
          - type: callout
            title: 行业死亡率：三家前代公司全部商业失败
            body: >
              在 Science Corporation 之前，所有完成临床概念验证的视网膜下或视网膜上植入体开发商最终都退出了商业市场：Second Sight（视网膜上，美国，2019 年放弃）、Pixium
              Vision（视网膜下，法国，2024 年清算）和 Retina Implant AG（视网膜下，德国，开发 16
              年后停止）。每家公司都有临床证据。没有一家实现商业可持续。共同失败模式包括报销覆盖不足、可服务患者规模不够，以及资本强度超出收入承受能力。Science Corp
              的优势——患者选择更精准、视觉结果更好、RAPID pathway、$490M 资本，以及与活跃 BCI
              平台整合——让它明显区别于每个前代公司。但该行业商业失败的基本率要求任何投资论点都必须围绕具体机制压力测试，而不只是技术细节；正是这些机制让三家资金充足的前代公司失败。
            calloutType: risk
            claimRefs:
              - CR037
              - CR038
              - CR039
              - CR040
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与轮次条款
        blocks:
          - type: paragraph
            body: >
              Science Corporation 于 2026 年 3 月以 $1.5 billion 投后估值完成 Series C，融资 $230
              million。公司称该轮超额认购，这一需求信号意味着公司有能力融更多钱，或可以拒绝部分资本。投资方包括前几轮全部五家重复参与者：Lightspeed Venture Partners、Khosla
              Ventures、Y Combinator、IQT (In-Q-Tel) 和 Quiet Capital。投资人全为老股东，削弱了新领投方可能带来的独立验证，但也说明一批成熟 deeptech
              投资人持续看好公司；他们已近距离观察公司的进展。自 2021 年成立以来，Science 累计融资约 $490 million，在全球私有 BCI 公司中资本化程度仅次于 Neuralink。上一轮融资事件是
              2025 年 4 月由 Khosla 领投的 $104 million 可转债；该票据的转股上限、折扣率和转股机制均未公开披露。票据是在 Series C
              交割时转股，还是仍作为未偿义务影响有效投后估值计算，目前未知。完整股权结构——包括各投资人持股比例、优先清算权层级、参与权和清算瀑布——尚未公开披露；没有 NDA 保护下的访问权限，就无法独立核验 $1.5B
              对每类利益相关方的经济含义。在整体 medtech VC 交易量从 2025 年峰值降温的季度里完成超额认购，是一个正向信号；但缺少独立定价纪律（无新领投方、无披露估值方法）限制了价格标记的信息含量。
