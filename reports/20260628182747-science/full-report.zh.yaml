      - number: '7.2'
        title: 临床安全性与疗效持久性风险
        blocks:
          - type: paragraph
            body: >
              PRIMAvera 关键试验报告，38 名患者中 19 人发生 26 起严重不良事件——发生率 50%——其中四起被归为重度：黄斑裂孔、视网膜脱离、增殖性玻璃体视网膜病变和 眼压升高。26 起 SAE 中有 21
              起发生在植入后前两个月内，更像手术阶段事件谱，而不是慢性设备失效模式。Science Corp Data Safety Monitoring Board 审阅 24 个月数据后建议试验继续且不修改方案，这是
              DSMB 认为获益-风险平衡可接受的信号。不过，任何 FDA 审评都会重点看两个具体信号。第一，24 个月内，PRIMA 植入眼的 geographic atrophy 面积增加 8.5 mm²，同侧对照眼为
              2.5 mm²，差异具有统计学意义；Science 将其归因于进入视网膜下空间的手术创伤，而非光伏芯片本身。 尽管视力和读字母收益在这一解剖进展下仍然维持，该机制仍需在 PMA
              申报中解释。第二，任何商业视网膜下光伏设备都没有超过 36 个月的长期植入耐久性数据。 PRIMA 第二代芯片设计提升了像素密度和生物相容性，可能实际上把耐久性时钟相对于临床前或更早队列数据重新归零。相邻 BCI
              开发中也能看到类似风险： Neuralink 首次人体试验在 2024 年 5 月的初始植入中记录到导线从脑组织回缩，说明长期的生物-非生物界面稳定性仍是植入式神经设备共同面对的开放挑战。 Science
              的视网膜下放置方式在机械上不同于皮层阵列，但数十年维持稳定、生物相容界面的根本挑战是相同的。任何 FDA 针对 GA 进展或植入耐久性的 Additional Information
              request，都可能给审评时间线增加 12–24 个月，并要求补充试验数据。
