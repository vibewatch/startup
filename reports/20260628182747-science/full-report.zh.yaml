              Science Corporation 自 2021 年创立以来，已通过四次已知融资事件累计融资约 $490M。公司于 2021 年 7 月完成约 $47.3M Series A，随后在 2022 年 11
              月完成约 $113M Series B。2025 年 4 月前后，公司完成 Khosla Ventures 领投的 $104M 可转债，时间点很可能是为衔接 NEJM 发表和 CE 认证提交里程碑。旗舰融资是
              2026 年 3 月完成的 $230M Series C，参投方包括 Khosla Ventures、Lightspeed Venture Partners、Y
              Combinator、IQT（美国情报界的风险投资机构）和 Quiet Capital——均为既有投资者；该轮超额认购，需求超过资金需求。Series C 对应约 $1.5B 投后估值，使 Science
              成为全球同阶段资本最充足的私有 BCI 公司之一。资金用途包括 PRIMA 欧洲商业化、制造放量，以及推进生物混合神经接口和 Vessel
              灌注平台等管线项目。公司公开表示，其核心任务是“成为第一家规模化并实现盈利的 BCI 公司”。Series A 和 B 的完整投资者名单仍未披露。
