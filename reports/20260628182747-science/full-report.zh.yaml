  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: PRIMA 植入体架构与近红外图像路径
        blocks:
          - type: paragraph
            body: |
              PRIMA 系统面向因 geographic atrophy（GA）导致感光细胞被破坏、但内层视网膜仍能工作的患者，
              恢复其中心视觉。该设备利用眼球的光学透明性：外部近红外投影器通过瞳孔向无线视网膜下芯片
              同时传输能量和图像数据，去掉了早期视网膜假体中问题频出的电池和经皮线缆。

              植入体本身是一块薄型晶体硅光伏阵列，占地 2 × 2 mm，厚度仅 30 µm——约为人类头发直径的一半。
              其 378 个独立控制像素按六边形（蜂窝）网格排列；每个像素宽 100 µm，同时充当太阳能电池和电极。
              当 880 nm 红外光照射某个像素时，该像素会产生局部电流，刺激视网膜相邻的双极细胞，重新接上
              因感光细胞丢失而中断的视觉信号路径。选择 880 nm 波长是有意为之：它位于可见光谱之外，
              患者残存的感光细胞看不到，因此不会与天然周边视觉串扰。

              外部硬件由三部分组成：（1）配有 sun-lens 的眼镜，前向摄像头捕捉场景，面向眼睛的一侧放置
              红外投影器；（2）口袋处理器，在把结果编码成 NIR 图案之前，执行实时变焦（最高 12×）、对比度增强
              和 AI 辅助物体识别算法；（3）投影器，将图案化 880 nm 光精确打到视网膜下植入体上。只有被照亮的
              像素会触发，因此图像分辨率由芯片上的像素数量决定。光伏芯片从入射光取电，不需要植入电池，
              设备完全无线——相较 Argus II 等需要经皮导线的早期系统，这是关键优势。该技术最早由 Stanford
              University 的 Daniel Palanker, PhD 于 2005 年提出；其实验室完成了首次人体可行性试验
              （NCT03333954、NCT03392324）。Science Corporation 后来在 2024 年 4 月从 Pixium Vision SA
              收购所有 PRIMA 知识产权和临床试验后，将项目继续推进。
