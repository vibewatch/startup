  - id: FE001
    title: PRIMA 系统架构栈
    type: stack
    layout: standard
    summary: |
      分层展示 PRIMA 系统从外部可穿戴硬件到皮层视觉处理的链条，说明每一层的功能角色、关键组件， 以及 Science Foundry 的制造位置。
    data:
      layers:
        - id: wearable-layer
          label: 可穿戴外部硬件
          detail: >
            前向摄像头实时捕捉患者视野。口袋处理器（AI 算法）增强对比度、应用变焦（最高 12×）， 并将场景编码为图案化 NIR 数据。面向眼睛的 880 nm 投影器把编码后的红外图案穿过瞳孔，
            投射到视网膜下植入物上。太阳镜片削弱环境可见光。系统通过光伏转换为植入物无线供电。
        - id: optical-transmission-layer
          label: 光学供电与数据传输（880 nm NIR）
          detail: >
            880 nm 近红外光对植入区外存活的感光细胞不可见，可避免污染自然周边视觉信号。 投影器的空间光调制器按植入物 100 µm 分辨率网格，为每个像素生成 NIR 强度图案。
            光穿过玻璃体传输，非侵入且无线；无需经皮电缆或内部电池。
        - id: photovoltaic-chip-layer
          label: PRIMA 视网膜下光伏芯片（2×2 mm，30 µm 厚，378 像素）
          detail: >
            晶体硅光伏阵列植入萎缩中央凹下方的视网膜下。378 个独立像素排成六角蜂窝网格， 每个宽 100 µm。每个像素上的 NIR 照明驱动电流脉冲，通过柱状电极局部刺激上方双极细胞。 无需电池；完全由入射 NIR
            光供电。由 Science Foundry 在 North Carolina Durham 制造。
        - id: retinal-interface-layer
          label: 内层视网膜神经接口（双极细胞）
          detail: >
            PRIMA 像素阵列产生的电脉冲直接刺激存活的视网膜双极细胞——这些二级神经元通常接收感光细胞输入。 这绕过了已被破坏的感光细胞层。系统要求内层视网膜（双极细胞和神经节细胞）完整；
            内层视网膜萎缩或青光眼患者不适合。自然周边感光细胞及其双极细胞不受影响。
        - id: optic-nerve-layer
          label: 视神经 / 视网膜神经节细胞通路
          detail: |
            双极细胞激活后，信号经视网膜神经节细胞进入视神经和外侧膝状体（LGN）。 假体中央视觉信号沿着与自然视觉相同的神经通路传输。自然周边信号和假体中央信号在这一阶段同步整合。
        - id: visual-cortex-layer
          label: 视觉皮层处理与感知学习
          detail: |
            视觉皮层处理整合后的假体与自然信号。植入后数月训练会强化皮层对新假体信号的解读——类似人工耳蜗用户需要的听觉学习。 完整获益通常需要 3–6 个月结构化视觉康复。
    approximationNotes: |
      层级边界代表概念性的功能划分；物理解剖并不完全相同。光学耦合效率和精确像素电流输出取决于植入深度、 组织光学特性和眼镜对准情况——Science Corp 均未公开披露。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE020
      - CE039
  - id: FE002
    title: PRIMA 患者流程 — 从诊断到视觉结果
    type: flow
    layout: standard
    summary: |
      PRIMA 患者体验的分步流程，从最初识别候选人，到手术植入、康复，再到 PRIMAvera 报告的 12 个月临床结果。 图中突出关键决策关口和植入后训练依赖。
    data:
      nodes:
        - id: candidate-id
          label: 患者识别与候选筛查
          role: >
            Retinal specialist identifies GA patient with logMAR ≥ 1.2 (worse than 20/320) and no residual central
            vision. OCT imaging confirms preserved inner retinal layers (bipolar cells intact). Candidate must meet
            surgical fitness criteria; glaucomatous optic nerve damage is an exclusion. Inner retinal preservation is
            mandatory.
        - id: pva-imaging
          label: 术前影像与规划
          role: >
            OCT and fundus photography delineate the atrophic zone extent and retinal thickness. Surgical plan targets
            chip placement centered under the atrophic fovea. Target retinotomy site is identified temporal to the fovea
            within the atrophic lesion.
        - id: pars-plana-vitrectomy
          label: 经睫状体平坦部玻璃体切除与视网膜下植入
          role: >
            Standard three-port 23- or 25-gauge PPV is performed. Posterior vitreous detachment induced if absent. Small
            retinotomy created temporal to fovea. PRIMA chip loaded into custom subretinal injector and delivered into
            subretinal space. Chip positioned under atrophic fovea. Endolaser photocoagulation seals retinotomy;
            fluid-air exchange may be performed. No external cable exits the eye; total surgical time typically under
            two hours.
        - id: post-surgical-recovery
          label: 术后恢复（4–5 周）
          role: >
            Standard post-vitrectomy care: topical antibiotics, anti-inflammatory drops, head positioning if gas
            tamponade used. Retina reattaches over the implant. No device activation during this period. Compliance
            monitoring and safety follow-up.
        - id: glasses-fitting
          label: PRIMA 眼镜适配与首次激活
          role: >
            Four to five weeks post-surgery, patient is fitted with PRIMA glasses and pocket processor. First NIR
            projection test; initial visual impressions recorded. Some patients perceive patterns immediately; others
            require weeks of learning.
        - id: visual-rehab
          label: 结构化视觉康复（数月）
          role: >
            Low vision specialist conducts regular in-clinic sessions. Progresses from basic light/dark detection
            through shape recognition to letter and word reading. Patient trains on zoom, contrast, and brightness
            controls. Home practice reinforces clinic training. Training duration analogous to cochlear implant auditory
            learning.
        - id: twelve-month-outcome
          label: 12 个月主要终点评估
          role: >
            ETDRS visual acuity measured with and without PRIMA glasses vs. baseline. PRIMAvera result: 80% (imputed)
            achieved ≥ 0.2 logMAR improvement; mean gain 5 ETDRS lines; 27/32 read letters/words; best case 12-line
            gain. DSMB concluded benefits outweigh surgical risks. Acuity up to 20/42 with zoom enhancement.
        - id: long-term-monitoring
          label: 长期随访与升级路径
          role: >
            Continued periodic clinic visits; device settings adjusted. Wireless design enables future in-situ
            replacement with higher-resolution next-generation chip through a repeat subretinal procedure. Tiled pattern
            of multiple chips also feasible for larger atrophic zones.
    approximationNotes: |
      手术步骤反映标准玻璃体视网膜技术与公司对 PRIMA 递送系统的描述。具体时间、填塞选择和术后方案因手术中心而异。 临床结果来自 PRIMAvera（N=38）；真实世界结果可能不同于受控试验条件。
