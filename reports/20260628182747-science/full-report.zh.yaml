      - number: '7.5'
        title: 战略集中、关键人物与平台分心风险
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 3 月，Science Corporation 约有 150 名员工，却同时运营四条不同项目线：PRIMA 视网膜植入体、生物混合神经科学、硬件晶圆代工，以及 Vessel（可穿戴 BCI
              中枢）。PRIMA 是唯一已有临床数据且具备近期收入路径的项目；其他项目仍处于临床前或收入前阶段。这样的集中度意味着，一旦 PRIMA
              出现监管延误、临床挫折或商业失败，公司的主要收入论点就会消失，且没有近期替代支点。Max Hodak 是 Neuralink 联合创始人，也是 Science Corp
              CEO，是公司最主要的公众面孔和首席战略设计者。TIME Magazine 将 Hodak 列入 2026 TIME100 Health 榜单，凸显其个人影响力——但公司尚未披露继任计划和关键人物保险安排。若
              Hodak 或首席科学顾问 Jacques-Alain Sahel 离职（Sahel 是全球领先的视网膜假体研究者之一，也是关键 PRIMA
              临床论文的共同作者），很可能削弱监管可信度、临床网络获取能力和投资人信心。Yale 合作者 Murat Günel 的评论显示，生物混合脑传感器项目目标是在 2027
              年前完成人体首次植入；该项目科学上很有吸引力，但需要专门的工程和临床试验基础设施，会与 PRIMA 争夺人才和管理层注意力。Science Corp 累计融资 $490M，估算年烧钱 $20-30M，意味着
              7-8 年 runway——足以覆盖 3 年监管周期——但商业化所需资本强度，包括外科医生培训、上市后监测基础设施和美国设施建设，可能压缩这一估计。Vessel 平台又增加了第四条监管和商业路径，在 PRIMA
              迫切需要集中执行的阶段进一步稀释组织焦点。
