      - number: '8.5'
        title: 退出成熟度与战略路径
        blocks:
          - type: paragraph
            body: >
              按标准公开市场标准，截至 2026 年中，Science Corporation 尚未具备 IPO 条件：公司没有收入，未披露单位经济，且所有市场均处于商业化前。2026 年 1 月 EdgeMedical 以
              $2.2B 估值上市，让 medtech IPO 窗口重新打开，但至少要求已有商业收入和可见盈利路径。Science Corp 更现实的 IPO 窗口是 2028–2031
              年，前提是欧盟商业上市执行到位、获得美国 FDA 批准，并在获批后至少 12–18 个月形成商业牵引，年化收入达到 $50M+。近期更可能的退出路径，是被大型 medtech 或 pharma
              平台战略收购。战略契合度最强的潜在收购方包括 Medtronic（神经科产品组合）、Boston Scientific（2026 年 1 月以 $14.5B 收购 Penumbra 以建设神经 /
              血管能力）、Johnson & Johnson MedTech（视网膜和器械平台）以及 Abbott（诊断和神经调控）。战略收购很可能由 FDA 批准和至少一年商业收入触发，对应 2029–2031
              年交易窗口。缺少二级市场流动性数据、已披露 SPAC 讨论或投行参与，使外部无法评估公司当前退出状态。任何收购方尽调都需要厘清优先清算权层级和可转债处理方式，才能判断各类利益相关方的实际收益分配。
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV005
            claimRefs:
              - CV005
              - CV022
              - CV029
              - CV035
      - number: '8.6'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              建议：跟踪（继续研究姿态）。投资论点连贯，并由 NEJM 级别临床证据、可信的先发商业路径和强投资人组合部分去风险。反论点是结构性的：行业商业失败基本率高、收入披露为零、股权结构优先权层级未披露，以及 $1.5B
              进入价已计入部分多头情景执行。风险评级为高——二元监管结果主导估值，而前代行业失败率（三家获得 CE 认证的视网膜假体公司中，0
              家实现商业可持续）不能被忽视。置信度为中——临床证据强，监管流程推进较深，但商业执行证据尚不存在。以 $1.5B 进入，考虑期望价值缺口，风险 / 回报边际不足。论点破裂触发条件包括：CE Mark 被拒或
              RFI 将批准推迟到 2027 年 Q2 之后；欧盟上市 6 个月后收入低于每季度 5 例手术；FDA 发出不可批准函或要求新关键试验；或任意两名创始高管在 12
              个月内离职。作出任何投资承诺前，尽调应优先厘清股权结构、优先清算权层级和可转债处理，以评估有效进入经济性。CE Mark 批准结果和德国首个定价 / 报销数据，是近期信息含量最高的催化剂。应独立核验
              FDA/CMS 的 RAPID pathway 互动时间线，以及来自 FDA 一手记录的任何已确认 Breakthrough Device designation。若下一轮或二级交易的修正进入估值为
              $1.0B–$1.2B，将显著改善期望价值计算。
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV001
              - CV010
              - CV039
              - CV040
              - CV041
              - CV042
      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 前代行业失败率是估值风险的主要锚
            body: >
              Science Corp 之前的三家 CE 认证视网膜假体公司——Second Sight（Argus II，FDA 和 CE 批准）、Pixium Vision（Prima Alpha CE 批准）和
              Retina Implant AG（Alpha IMS CE 批准）——尽管获得监管许可，却都未能实现可持续收入，最终商业失败。这不是估值脚注；它是检验每个多头假设的最强先验。Science Corp
              拥有比任何前代公司更好的临床数据、更多资本和更强制造能力，但摧毁前三家公司报销和采用结构性障碍仍未解决。
            calloutType: risk
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
          - type: callout
            title: 进入价格会实质改变风险 / 回报结构
            body: >
              以 $1.5B（2026 年 3 月 Series C）进入时，概率加权期望价值（约 $1.0–$1.25B）意味着在考虑时间价值和稀释前，预期回报为负。若以
              $1.0–$1.2B（通过二级购买或下一轮进入）进入，同一情景分布意味着相对进入价有 8–25% 的正预期回报。CE Mark 批准和德国上市定价，是可观察到的两个催化剂，可支持从跟踪转向买入。
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV030
              - CV037
