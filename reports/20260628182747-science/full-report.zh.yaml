      - number: '5.4'
        title: 平台技术：Science Eye、LUX 与 NYX 芯片家族
        blocks:
          - type: paragraph
            body: |
              PRIMA 之外，Science Corporation 正在开发更宽的神经接口平台；支撑硬件层与 PRIMA 商业化推进同步建设。

              Science Eye 是 Science Corporation 的第二个视觉假体项目。PRIMA 用视网膜下光伏植入体刺激视网膜双极细胞；
              与之不同，Science Eye 将一种 optogenetic gene therapy 与 Lightsheet 柔性薄膜 microLED 显示器结合：
              前者由 adeno-associated virus（AAV）载体递送，靶向视神经中的 retinal ganglion cells（RGCs）；
              后者直接插入视网膜上方。基因治疗让 RGCs 对光敏感；microLED 阵列随后输出定制刺激图案。相较基于投影器的方案，
              该路线的关键技术优势在于柔性薄膜会随眼球移动，保持稳定的像素到细胞映射；这是学习基础闪光以外更复杂视觉编码的
              必要条件。Science Corporation 称 Lightsheet 显示器的像素密度约为 iPhone 13 Super Retina 显示屏的 8 倍。
              Science Eye 面向 retinitis pigmentosa 和 dry AMD 患者：他们的感光细胞已经被破坏，但每只眼约 100 万个 RGCs
              仍能工作。该项目已正式推迟到 PRIMA 在全球某地实现商业发布之后；动物安全性数据仍在收集，尚未披露首次人体试验日期。
              Science Eye 与 PRIMA 被视为互补：PRIMA 解决高分辨率中央（中心凹）视觉；Science Eye 可覆盖周边视觉，未来配置中
              两套系统可能由同一副眼镜驱动。

              NYX 芯片家族提供平台的神经记录层：NYX 是一款低噪声、低功耗、可编程混合信号 ASIC，用于细胞外神经记录；
              NYX 512 是 512 通道全差分版本，为高通道数脑图谱实验优化。LUX 家族提供 optogenetic 应用所需的 microLED 驱动能力：
              LUX 是面向单通道 optogenetic 刺激的小尺寸驱动器；LUX 2K 是主动式 2,048 像素驱动器；LUX 16K 是被动式
              16,384 像素驱动器，用于高密度刺激阵列。两个芯片家族均已面向研究用途商业销售，并由北卡 Durham 的 Science Foundry
              制造。Synapse headstage 电子系统在神经探针与网络之间处理、存储和传输信号。Axon 家族包括薄膜和硅神经探针，
              用于接触组织的电极阵列。
