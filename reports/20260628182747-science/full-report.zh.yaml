      - number: '4.4'
        title: 单位经济框架与私有指标缺口
        blocks:
          - type: paragraph
            body: |
              Science Corporation 未公开任何收入、ARR、毛利率、销货成本、获客成本、回本周期或
              净收入留存。公司在美国仍处于商业化前阶段，所有单位经济要么是预先设定的估算，
              要么是只有 NDA 下才能看到的专有信息。行业基准显示，视网膜下设备在试点制造量级下
              单台 COGS 约为 $5,000–$12,000；随着自动化放量和供应链成熟，成本会明显下降。
              Science Corp 的垂直 MEMS 整合在规模达成后可能带来结构性 COGS 优势，但 $65 million
              foundry 扩建已经是沉没资本，只有依靠尚未达到的设备销量才能回收。ABCMoney 的投资分析
              估计，若要用典型 medtech 退出倍数支撑 $1.5 billion 的入场估值，公司需要在 7–10 年内
              做到 $500 million 或更高年收入；这意味着 PRIMA 每年要完成数千台手术，单台价格
              $50,000+——如果报销跑通且 AMD 可服务人群能规模化触达，这一假设激进但并非不可想象。
              PRIMA 的销售周期经济与 SaaS 指标完全不同：医生培训成本、医院资本设备采购周期、
              单个支付方覆盖决定，将主导获客成本。标准 SaaS 或 marketplace 单位经济（NRR、
              quick ratio、burn multiple）不适用于一次性植入模式。截至 2026 年中，Science Corp
              尚未以商业口径公开描述 EU 发布的 GTM 路径，因此现阶段无法独立评估销售效率。
