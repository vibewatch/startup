      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Science Corporation 的多头逻辑建立在临床、监管和战略因素的连贯对齐上。PRIMA 关键试验结果发表于 NEJM（17 个欧盟和美国站点、47 名患者中，80–84%
              实现有意义的视力改善），是植入式视觉恢复器械迄今公开发表的最高质量临床证据。公司于 2025 年 6 月向 BSI 提交 CE Mark 申请，文件约 60GB；若 2026 年中获批，Science Corp
              将成为全球第一家让产品上市的 BCI 公司。在竞争激烈的平台市场中，这种先发溢价可以支撑高于纯 DCF 基本面的估值。FDA Breakthrough Device designation 让公司获得更强 FDA
              互动；叠加 2026 年 4 月 RAPID Coverage Pathway，形成 FDA 批准与 Medicare 覆盖同步推进的机制，移除了历史上获批后 12–18 个月的报销缺口。自有 MEMS
              晶圆代工厂带来制造差异化，也提供其他视网膜假体公司从未具备的平台可选性。反论点同样扎实。Science Corp 在全球仍处于收入前阶段。三家获得 CE 认证的前代视网膜假体公司——Second Sight
              (Argus II)、Pixium Vision (Prima Alpha/PRIMA) 和 Retina Implant AG (Alpha
              IMS)——均获得监管许可却商业失败，整个行业合计消耗了数亿美元投资资本。Anthem 2026 年政策将所有人工视网膜器械归为研究性且非医学必要，代表 Science Corp
              建立商业存在前，美国私营支付方的当前默认立场。CE Mark 后，欧盟报销仍需逐国 HTA 流程，关键市场通常耗时 12–36 个月。生物混合神经接口、Vessel
              和晶圆代工业务带来的平台分心风险，在需要集中执行 PRIMA 的阶段分散管理层和资本。2025 年 VC 周期中的私募市场估值膨胀，加上全由老股东超额认购，也让人质疑 $1.5B
              标记反映的是基本价值，还是周期高点的乐观定价。
