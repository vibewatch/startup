      - number: '1.5'
        title: 临床证据、监管状态与风险画像
        blocks:
          - type: paragraph
            body: >
              PRIMAvera 关键试验（NCT04676854）在法国、德国、意大利、荷兰、西班牙和英国的 17 个中心入组 38 名患者。所有受试者均患有晚期地图样萎缩，且无残余中心视力。2025 年 10 月 20
              日发表于 The New England Journal of Medicine 的结果由 Frank Holz（University Hospital of Bonn，牵头）、José-Alain
              Sahel（University of Pittsburgh）及 14 名共同作者撰写，显示：80% 受试者在 12 个月时取得有意义的视力改善；84.4% 恢复了阅读字母、数字和单词的能力；ETDRS
              视力表平均提升约 25.5 个字母（超过五行）。数据安全监测委员会认为，收益超过手术风险。研究未观察到自然周边视力的显著损失。19 名患者出现不良事件，包括眼压升高、视网膜撕裂和出血；多数在两个月内缓解。


              Science 于 2025 年 6 月向欧盟提交 CE 认证申请，并于同月申请美国 FDA 监管批准；公司还持有 FDA 突破性设备认定，该认定最初于 2023 年 4 月授予 Pixium，并通过 2024
              年 4 月收购承继。欧洲商业化预计在 2026 年启动，若成行，Science 将成为第一家拥有在售视觉修复产品的 BCI 公司。截至 2026 年中，美国 FDA 决定仍待定。


              重大风险包括：PRIMA 目前只能提供黑白、相对低分辨率的假体视觉，而非自然彩色视觉；价格和报销条款未披露；38 人试验规模对于更广泛的适应症标签扩展可能显得有限；12
              个月以后的长期安全数据仍在收集；公司仍完全没有收入，在监管和商业化启动过程中依赖投资者持续供血。
