    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与创立
        blocks:
          - type: paragraph
            body: >
              Science Corporation 是一家临床阶段神经工程公司，2021 年注册成立，总部位于加州 Alameda。公司由 Max Hodak 和 Alan Mardinly 博士联合创立：Hodak
              曾联合创立 Neuralink，并在 2021 年 5 月前担任总裁；Mardinly 拥有 Harvard 神经生物学博士学位，曾任 Neuralink
              研究负责人。公司的底层判断是：大脑是人体唯一不能移植的器官，也是医学的终极前沿。Science 近期商业化载体是
              PRIMA，一款光伏视网膜下脑机接口（BCI）视网膜假体，面向年龄相关性黄斑变性导致的晚期地图样萎缩（GA）。除 PRIMA 外，公司还在同步推进生物混合神经接口架构、Science Eye
              光遗传学平台和位于北卡罗来纳州 Research Triangle Park 的 MEMS 半导体晶圆厂：前者试图让工程化神经元在芯片上生长，以提升大脑整合效果；Science Eye
              面向更广泛的视觉修复；晶圆厂则提供自有制造能力。创始团队选择保持私有、商业化前状态，一边搭建多模态神经接口组合，一边围绕监管里程碑安排外部产品发布。公司对外始终把使命表述为直接接入大脑这个信息处理器官，以取得传统医学无法达到的效应量。
