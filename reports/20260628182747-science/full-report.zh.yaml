        - bioregio-stern.de；bionic-vision.org 历史记录
        - Pixium 之前唯一进入商业化的 CE Mark 视网膜假体；同样败在报销
        - 设备公司更小、资本更少；Science Corp 在规模上完全不同
      - - Blackrock Neurotech
