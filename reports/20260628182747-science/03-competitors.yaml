  - id: direct-visual-prosthetics-peers
    title: Direct Visual Prosthetics Peers — Legacy Failures and Surviving Players
    body: >
      The history of direct retinal prosthetics competition is largely a story of commercial failure,
      leaving Science Corp's PRIMA operating in a field with fewer active peers than the technology
      landscape would suggest. Second Sight Medical Products was the first company to achieve FDA
      approval for a retinal prosthesis—the Argus II epiretinal device—under the Humanitarian Device
      Exemption (HDE) pathway in 2013, but it generated only approximately $32 million in total
      revenue from roughly 350 patients globally against approximately $300 million in cumulative
      investment over two decades before withdrawing the product in 2019-2020. The key failure
      drivers were a patient population too small to sustain commercial economics, prohibitive total
      procedure costs (~$500,000 including surgery and rehabilitation), inability to secure broad
      Medicare Administrative Contractor (MAC) reimbursement coverage, and physician unfamiliarity
      with a novel surgical procedure. Approximately 350 Argus II patients were left with unsupported
      implants after the withdrawal, creating a patient-abandonment precedent with lasting ethical
      and regulatory implications. Second Sight subsequently merged with Nano Precision Medical
      to form Vivani Medical in 2022, which pivoted to drug-delivery; the neurostimulation business
      was spun off as Cortigent. Cortigent's Orion visual cortical prosthesis system completed a
      6-year early feasibility study in March 2025, with all 6 participants demonstrating safety,
      reliability, and measurable improvements in visual assessments with less than 4% electrode
      function loss. Orion stimulates the visual cortex, not the retina, bypassing the entire
      damaged visual pathway—an important technical distinction, as it can serve patients who have
      lost both photoreceptor and retinal ganglion cell function, a broader indication than PRIMA's.
      However, Cortigent requires a craniotomy and is at least one full development phase behind
      PRIMA on the road to commercialization. Retina Implant AG, the German developer of the Alpha
      AMS subretinal electrode array (CE-marked 2016, 1,600 electrodes), resolved to dissolve in
      March 2019, citing inadequate reimbursement across Europe, high regulatory barriers, and
      clinical outcomes that did not meet patient expectations; it had no acquirer. Bionic Vision
      Technologies (BVT), an Australian company, is the only remaining active direct retinal
      prosthetics competitor with credible clinical data. Its second-generation 44-channel
      suprachoroidal device—implanted outside the retinal layers between the sclera and choroid—
      showed 97% electrode retention at 2.7 years across 4 clinical trial participants and functional
      gains in navigation and object detection in 2024-published results, with FDA Breakthrough
      Device Designation supporting an accelerated regulatory path. BVT's total disclosed funding
      of approximately $18 million is, however, roughly 27 times smaller than Science Corp's, and
      it will require substantially more capital to run pivotal worldwide trials and reach commercialization.
