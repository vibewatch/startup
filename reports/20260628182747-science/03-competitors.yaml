  - id: TP004
    title: Moat durability / competitive risk register
    notes: >
      Severity ratings are analyst judgments based on publicly available evidence as of June 2026.
      High = could materially affect commercial trajectory; Medium = manageable with execution;
      Low = minor or distant risk.
    columns:
      - Moat Claim
      - Competitive Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - First-to-CE-Mark in retinal BCI
        - Approval delay (NB assessment takes 12–24 months); BVT closes gap with additional funding
        - High
        - Track CE Mark timeline monthly; contingency plan for 6–12 month slip
      - - NEJM clinical evidence advantage
        - BVT or Cortigent publish comparable outcomes; Neuralink achieves FDA milestone first
        - Medium
        - Monitor peer publications; maintain evidence superiority in follow-up cohorts
      - - In-house chip manufacturing (cost and iteration speed)
        - Competitor secures TSMC or IMEC partnership; advances chip density faster than Science Corp
        - Medium
        - Verify manufacturing capacity, yield, and iteration cycle time vs. outsourced peers
      - - Acquired Pixium assets (sole IP control)
        - Academic spinouts develop alternative photovoltaic approaches; patent challenges
        - Low-Medium
        - Commission patent freedom-to-operate review; monitor academic photovoltaic implant filings
      - - Superior reimbursement narrative vs. Argus II
        - PRIMA fails to demonstrate CMS-acceptable cost-effectiveness vs. status quo (sham control)
        - High
        - Engage payer relations team now; commission health-economics model; seek early NCD engagement
      - - Implanted-device patient lock-in (high switching cost)
        - Next-generation platform (gene therapy, optogenetics) renders PRIMA's electrical approach obsolete
        - Medium-Long
        - Science Corp's own Science Eye optogenetic platform is the internal hedge; timeline tracking needed
