  - id: bci-capital-competition
    title: BCI Capital and Attention Competition — Neuralink, Synchron, Precision Neuroscience
    body: >
      While Neuralink, Synchron, and Precision Neuroscience do not target vision restoration and
      do not compete for Science Corp's patients, they represent the dominant claimants of the
      same investor capital pool, clinical-center training resources, and public BCI narrative that
      determines valuation multiples, press attention, and hospital partnership access. Neuralink
      is the most capitalized BCI company, having raised a $650 million Series E in June 2025 with
      total lifetime funding reported at approximately $1.3 billion. Its PRIME study (NCT06429735)
      enrolled 21 participants across the United States, Canada, and the United Kingdom as of early
      2026, targeting tetraplegia patients for cursor-control applications. Despite strong enrollment
      momentum, Neuralink's first human participant experienced retraction of approximately 85% of
      electrode threads from brain tissue within weeks of implantation, substantially reducing the
      device's signal decoding capacity; software updates partially compensated but did not resolve
      the hardware instability. The US SEC reopened an investigation into Neuralink in late 2024
      regarding potential misleading safety claims. Neuralink's outsized media presence—driven by
      Elon Musk's public profile—generates BCI mindshare that can redirect investor attention and
      press coverage away from Science Corp's nearer-term and arguably more mature clinical story.
      Synchron raised $200 million in a Series D round in November 2025, bringing total funding
      to approximately $345 million, with the capital explicitly directed toward a 2026 FDA pivotal
      clinical trial for the Stentrode endovascular device. Synchron's approach avoids craniotomy
      by routing the implant through the jugular vein into the motor cortex blood supply—a minimally
      invasive advantage that widens the hospital adoption funnel compared to penetrating-electrode
      alternatives. Synchron targets ALS, paralysis, and stroke patients; its competition with
      Science Corp is for capital and clinical-center attention, not for the same patients. Synchron
      is positioning for the title of "first commercially approved BCI in the US" if its pivotal trial
      succeeds and FDA PMA is granted, a milestone that would compete narratively with Science Corp's
      potential EU-first commercialization story. Precision Neuroscience closed a $120 million
      Series D in June 2026, bringing total funding to over $290 million, led by General Catalyst
      with Microsoft M12 and Coatue Management. Its Layer 7 Cortical Interface is a subdural
      thin-film electrode array that received FDA 510(k) clearance for up to 30-day neurophysiology
      applications, making it the only next-generation cortical BCI device with any commercial FDA
      clearance as of mid-2026. The company had implanted its device in over 85 patients across
      more than 15 hospital partners and was preparing an IDE submission for a pivotal ALS trial.
      Like Neuralink and Synchron, Precision Neuroscience does not target visual restoration;
      its competitive relevance is capital and regulatory attention. Together these three companies
      absorbed over $1.5 billion in cumulative capital as of mid-2026, creating a competitive
      funding environment in which Science Corp must articulate a distinct narrative around its
      regulatory proximity and clinical evidence specificity.
