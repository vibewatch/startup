callouts:
  - calloutType: risk
    title: Argus II Precedent Makes Reimbursement the Decisive Moat Test
    body: >
      Three direct predecessors—Second Sight (Argus II), Retina Implant AG (Alpha AMS), and
      Pixium Vision (PRIMA before acquisition)—collectively failed to achieve commercial
      self-sufficiency despite regulatory approvals and credible clinical data. Science Corp
      has cleared the clinical evidence hurdle that its predecessors could not, but the
      commercial hurdles—CMS reimbursement policy, MAC coverage, physician adoption, and
      long-term patient support—remain entirely unresolved. PRIMA's CE Mark submission and
      eventual approval would be a landmark, but the history of this space demands equal
      diligence weight on the downstream commercial model as on the upstream science.
    claimRefs:
      - CP007
      - CP034
      - CP044
  - calloutType: strength
    title: PRIMA Is the Only Active Retinal BCI With NEJM Evidence at CE Mark Stage
    body: >
      As of mid-2026, Science Corp occupies a unique position: it is the only company with a
      live CE Mark application for a retinal BCI, backed by NEJM-published evidence from a
      double-digit patient cohort. BVT has clinical data but is three or more development phases
      behind PRIMA's regulatory maturity, and Cortigent requires a craniotomy and has only
      completed a 6-participant feasibility study. No BCI capital competitor targets the
      same indication. This evidence advantage, combined with the Pixium IP acquisition and
      in-house chip manufacturing, constitutes a short-to-medium-term competitive moat that
      is real even if it is not durable against the systemic commercialization risks identified
      above.
    claimRefs:
      - CP029
      - CP031
      - CP033

