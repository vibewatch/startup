companyProfile:
  summary: "Gilmour Space Technologies is a privately held Australian aerospace company founded in 2012 on the Gold Coast, Queensland, by brothers Adam Gilmour (CEO) and James Gilmour. It runs a vertically integrated 'sovereign space' model spanning the three-stage, hybrid-propulsion Eris orbital launch vehicle (payload ~305 kg to LEO / ~215 kg to SSO), the ~100 kg-class ElaraSat satellite bus, and the Bowen Orbital Spaceport — Australia's first licensed orbital launch site. In January 2026 it raised a A$217 million Series E co-led by the government's National Reconstruction Fund Corporation and industry super fund Hostplus, crossing a A$1 billion valuation to become Australia's first space unicorn. The company deployed its first satellite (ElaraSat MMS-1, carrying a CSIRO payload) via SpaceX in June 2025, but its own Eris TestFlight-1 (30 July 2025) failed roughly nine to fourteen seconds into flight due to a first-stage oxidiser-pump fault; an investigation concluded in April 2026 and a second attempt is targeted for late 2026. Gilmour remains pre-revenue on orbital launch, with income from satellites, defence engineering (a A$17.6M RAAF contract), hypersonic test work, and government grants."
