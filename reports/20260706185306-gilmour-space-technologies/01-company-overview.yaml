company:
  name: "Gilmour Space Technologies"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Gilmour Space Technologies is an Australian aerospace company founded in 2012 by brothers Adam and James Gilmour, developing the hybrid-propulsion Eris orbital rocket and the ElaraSat satellite bus for sovereign small-satellite launch. In January 2026 it raised a A$217 million Series E co-led by the National Reconstruction Fund Corporation and Hostplus, crossing a A$1 billion valuation to become Australia's first space unicorn."
sections:
  - id: "identity-and-business"
    title: "Identity, Business Model, and Corporate Structure"
    body: |
      Gilmour Space Technologies is a privately held Australian aerospace company headquartered in Southport on the Gold Coast, Queensland, with rocket manufacturing, satellite production and a dedicated launch site (the Bowen Orbital Spaceport) all in Queensland. Founded in 2012 by brothers Adam Gilmour (CEO) and James Gilmour, the company began by building spaceflight simulators and educational hardware before pivoting to rocket propulsion research around 2015 and conducting its first hybrid-propellant rocket test flight in 2016.

      The company operates a vertically integrated "sovereign space" model spanning three connected product lines: the Eris orbital launch vehicle, a three-stage small-satellite rocket using in-house hybrid propulsion; the ElaraSat modular satellite bus, a 100-kilogram-class platform that hosts up to 30 kilograms of customer payload; and the Bowen Orbital Spaceport, Australia's first licensed orbital launch facility. This end-to-end stack — build the rocket, build the satellite, own the launch site — is designed to give Australian and allied government, defence and commercial customers a domestically controlled path to low Earth orbit rather than depending on foreign launch providers.

      Gilmour's core value proposition is sovereign Australian launch capability. As of mid-2026 the company is pre-revenue on orbital launch: its Eris TestFlight-1 in July 2025 was the first orbital-class rocket designed, built and launched from Australian soil, though it did not reach orbit. Revenue to date comes from adjacent activities — a satellite bus deployed via SpaceX rideshare, defence launch-engineering and hypersonic test services, and government grants — while the flagship orbital launch business remains in qualification.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: "leadership-and-governance"
    title: "Founders, Leadership, and Governance"
    body: |
      Gilmour Space was co-founded and is led by two brothers who remain its defining figures. Adam Gilmour, chief executive officer, spent roughly two decades in banking (including senior roles at Citigroup across Asia) before leaving finance to build a rocket company; he is the public face of the company and drives its capital-raising and strategy. James Gilmour, his brother and co-founder, leads engineering and launch operations. The founder pairing concentrates both commercial and technical authority in one family, which underpins the company's cohesion but also creates material key-person dependence.

      The company has professionalised its leadership as it scaled, adding functional executives across propulsion, satellites (head of satellites Mark Grimminck), launch operations, and manufacturing, and expanding its workforce to a reported 200-plus staff supported by a network of more than 500 Australian suppliers during the TestFlight-1 campaign. Governance has shifted toward institutional oversight as sophisticated investors — venture funds Blackbird and Main Sequence, Fidelity-affiliated Fine Structure Ventures, superannuation funds including Hostplus, HESTA and NGS Super, state investor QIC, and the Commonwealth's National Reconstruction Fund Corporation — have taken board and observer positions across successive rounds.

      Because Gilmour is private and pre-IPO, granular governance disclosures (board composition, founder equity, voting control, option pools) are not public. The concentration of technical and executive leadership in the two founders, combined with the binary technical risk of an unproven orbital vehicle, makes key-person and succession planning a central diligence question that available public sources cannot fully answer.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: "funding-and-valuation"
    title: "Funding History and Valuation"
    body: |
      Gilmour Space has raised capital across at least five priced venture rounds since 2017, progressively drawing in larger and more institutional backers. Early rounds were venture-led: a Series A of roughly A$5 million in 2017 (Blackbird Ventures, with US accelerator 500 Startups also an early backer) and a Series B of about US$19 million in 2018 led by Main Sequence Ventures, the CSIRO-linked deep-tech fund.

      The Series C closed in June 2021 at A$61 million — then the largest private capital raise for an Australian space company — led by Fine Structure Ventures (an affiliate of Fidelity Investments) alongside Blackbird, Main Sequence, and superannuation funds HESTA, Hostplus and NGS Super. In February 2024 the company raised a A$55 million Series D led by Queensland Investment Corporation (QIC), with Blackbird, Main Sequence, Hostplus and HESTA participating, and later disclosed a A$14.2 million follow-on extension.

      The landmark event was the January 2026 Series E: A$217 million co-led by the Australian Government's National Reconstruction Fund Corporation (NRFC) and industry super fund Hostplus, each committing A$75 million, with participation from the Future Fund, Blackbird, Funds SA, HESTA, NGS Super, Main Sequence, QIC and Brighter Super. The round lifted Gilmour's valuation above A$1 billion, making it Australia's first "space unicorn," and some reports indicate the round was subsequently extended toward A$231 million with additional superannuation participation. Alongside equity, Gilmour has secured non-dilutive government support, including a A$75 million NRFC commitment tied to the round, a A$52 million federal Australian Space Manufacturing Network grant (2023), and a A$5 million Industry Growth Program grant.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022]
    tableRefs: [TO003]
    figureRefs: [FO003]
  - id: "milestones-and-trajectory"
    title: "Milestones, Scale, and Trajectory"
    body: |
      Gilmour's trajectory has been one of steady technical escalation punctuated by both breakthroughs and setbacks. After its 2012 founding and 2016 hybrid-rocket test flights, the company spent the late 2010s and early 2020s scaling propulsion, raising venture capital, and securing the site and licences for the Bowen Orbital Spaceport, which the Australian Space Agency approved as the country's first orbital launch facility.

      In 2024 the company diversified its revenue base, winning a A$17.6 million launch-engineering and R&D contract with the Royal Australian Air Force and later beginning hypersonic test-rocket work for defence and research customers. In June 2025 it reached orbit for the first time as a satellite operator when ElaraSat MMS-1, carrying a CSIRO hyperspectral imager, was deployed via SpaceX's Transporter-14 rideshare — validating its satellite bus even before its own rocket flew.

      The defining test came on 30 July 2025, when Eris TestFlight-1 lifted off from Bowen — the first Australian-made orbital-class rocket to launch from Australian soil — but suffered a first-stage propulsion anomaly around nine seconds into flight and fell back near the pad without reaching orbit. An investigation concluded in April 2026 traced the failure to electrical and thermal faults in the oxidiser-pump subsystem, including externally sourced components. Days-earlier momentum from the January 2026 Series E and unicorn status underpinned the company's ability to fund a second attempt, with Eris TestFlight-2 targeted for late 2026.
    claimRefs: [CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030]
    tableRefs: [TO004]
    figureRefs: [FO001]
  - id: "cover-metrics-and-gaps"
    title: "Cover Metrics and Evidence Gaps"
    body: |
      As of mid-2026 Gilmour Space's verifiable cover metrics are: a post-money valuation above A$1 billion (Series E, January 2026); a headline Series E of A$217 million, reported to have been extended toward A$231 million; total private capital raised well in excess of A$350 million across five-plus rounds since 2017 (databases such as Tracxn cite roughly US$245 million, a figure sensitive to whether grants and extensions are counted); a workforce reported at 200-plus employees; and a headquarters and manufacturing base on the Gold Coast plus the Bowen Orbital Spaceport, both in Queensland.

      Several metrics are not publicly disclosed and are treated here as gaps. Gilmour does not publish revenue, burn rate, cash runway, or gross margin; as a pre-orbital-launch company its revenue is early-stage (satellite, defence services, grants) rather than recurring launch revenue. Exact current headcount, founder and investor equity splits, the full Series E cap table, and the precise total-raised figure all vary by source or are undisclosed. These are flagged with explicit diligence paths rather than estimated.

      The most consequential uncertainty is technical: the company's central asset — a reliable orbital Eris rocket — has not yet been demonstrated, so valuation rests heavily on forward expectations. This overview separates verified facts (rounds, investors, dates, the TestFlight-1 outcome) from company claims and undisclosed private metrics so later chapters can reuse a consistent ground truth.
    claimRefs: [CO031, CO032, CO033, CO034, CO035, CO036]
    figureRefs: [FO004]
