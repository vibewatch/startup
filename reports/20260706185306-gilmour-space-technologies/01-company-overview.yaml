callouts:
  - calloutType: strength
    title: "Sovereign Mandate Backed by Government and Institutional Capital"
    body: "The A$217M Series E was co-led by the government's NRFC and Hostplus, with the Future Fund, QIC and multiple super funds participating — an unusually deep, strategically aligned capital base that reflects national-security demand for sovereign launch."
    claimRefs: [CO014, CO015, CO017]
  - calloutType: risk
    title: "Unicorn Valuation Ahead of a Proven Rocket"
    body: "Gilmour crossed a A$1B valuation before achieving orbit; its first orbital attempt (TestFlight-1, July 2025) failed around nine seconds in due to oxidiser-pump faults. Valuation rests heavily on forward expectations for TestFlight-2 and beyond."
    claimRefs: [CO025, CO026, CO031]
  - calloutType: insight
    title: "Satellite and Defence Lines De-Risk a Pre-Launch Company"
    body: "By deploying the ElaraSat bus via SpaceX and winning a A$17.6M RAAF contract plus hypersonic test work, Gilmour has built adjacent revenue and orbit heritage that reduce reliance on Eris reaching orbit in the near term."
    claimRefs: [CO024, CO028, CO029]
  - calloutType: assumption
    title: "Key-Person Concentration in Two Founders"
    body: "Both commercial (Adam) and technical (James) leadership sit with the two founding brothers. Absent public succession or board disclosures, this is treated as a material governance assumption requiring diligence."
    claimRefs: [CO008, CO009, CO012]
