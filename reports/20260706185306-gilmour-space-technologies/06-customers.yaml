company:
  name: "Gilmour Space Technologies"
chapter:
  number: 6
  title: "Customers"
  summary: "Gilmour Space is a pre-orbital-launch-revenue company whose customer proof is thin but real at the margins. Its strongest evidence is CSIRO's hyperspectral payload operating on the ElaraSat MMS-1 bus (in orbit since June 2025), a A$17.6 million Royal Australian Air Force launch-engineering contract (2024), and a July 2025 channel partnership with Japan's Space BD to market Eris and ElaraSat across Asia-Pacific. Beyond these, adoption is prospective: no orbital launch has yet carried a paying customer, retention data is undisclosed, and the customer base concentrates heavily on Australian government and defence demand."
sections:
  - id: "customer-base-and-segmentation"
    title: "Customer Base and Segmentation"
    body: |
      Gilmour Space serves four distinguishable buyer groups, though only some are yet backed by delivered proof. The first and most strategically important is government and defence: the company positions Eris and the Bowen Orbital Spaceport as sovereign Australian launch capability, and the National Reconstruction Fund Corporation frames Gilmour as providing "access to space to commercial, government, and defence customers." The second is research and civil science, exemplified by CSIRO, whose hyperspectral imager is hosted on the ElaraSat bus. The third is commercial small-satellite operators — the ElaraSat modular 100-kilogram-class bus hosts payloads up to 30 kilograms and is pitched to customers who would otherwise build their own bus. The fourth is international customers reached indirectly through the Space BD channel across the Asia-Pacific.
      Gilmour also launched a "Hyperflight" hypersonic test service targeting Defence agencies and scientists at speeds above Mach 5, adding an adjacent test-services customer line. Segmentation is therefore split between paying, proven relationships (CSIRO, the RAAF) and a large prospective pipeline (defence and government programs, Space Machines Company, Fleet, Skykraft, Inovor, and Asia-Pacific smallsat operators) that will only convert once Eris reaches orbit.
    claimRefs: [CU007, CU008, CU011, CU009, CU033, CU013, CU024]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: "named-customer-proof-and-adoption"
    title: "Named Customer Proof and Adoption Trajectory"
    body: |
      The clearest customer proof is CSIRO. Australia's national science agency contributed a hyperspectral imager — designed to monitor water quality and algae in Queensland waterways — that has been operating on ElaraSat MMS-1 since deployment via SpaceX's Transporter-14 rideshare in June 2025. The satellite (NORAD ID 64539) completed commissioning and demonstrated reliable S-band communications and X-band downlink, establishing genuine on-orbit heritage for the bus. The second proof point is the Royal Australian Air Force, which awarded Gilmour a A$17.6 million launch-engineering and R&D contract in February 2024 through limited tender — the company's largest federal contract, paying roughly A$1 million a month to mid-2025. The third is Space BD, a Japanese integrator that signed a July 2025 partnership to act as an agent marketing Eris launches and ElaraSat hosted-payload capacity to Japanese and global customers, drawing on its record of 90-plus satellite missions and 600-plus space projects.
      Adoption remains early: one satellite bus is on orbit, MMS-2 is slated to follow, and zero orbital launches have yet carried a paying customer to space. Contact with MMS-1 was established within eight hours against a four-day expectation, a positive operational signal.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU025, CU012, CU027, CU031]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: "retention-durability-and-repeat-usage"
    title: "Retention, Durability, and Repeat Usage"
    body: |
      Retention and durability evidence is almost entirely absent, which is expected for a pre-launch-revenue company but material for diligence. Gilmour does not disclose net or gross revenue retention, churn, renewal rates, contract length, cohort behaviour, or satisfaction scores, and there are no public customer reviews, ratings, or third-party testimonials beyond company and partner statements. Repeat usage is nascent: CSIRO is a single-mission relationship to date, and the RAAF's 18-month contract ran to mid-2025 with no publicly confirmed renewal or extension. The most durable structural asset is the ElaraSat bus itself, which is compatible with multiple launch vehicles including Eris, giving hosted-payload customers flexibility and giving Gilmour a recurring product independent of its own rocket's readiness.
      Adam Gilmour has framed the satellite-first strategy as a way to "prove-out the technology" without waiting for the launch business, and the company's stated primary focus is launching a second orbital rocket by the end of 2026 — the event on which repeat launch customers ultimately depend. Until then, retention is a forward assumption rather than a demonstrated fact.
    claimRefs: [CU015, CU016, CU020, CU030, CU032, CU039]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: "expansion-concentration-and-channel-risk"
    title: "Expansion, Concentration, and Channel Risk"
    body: |
      Expansion pathways are credible but unproven. The Space BD channel opens Japanese and broader Asia-Pacific demand, motivated by the Bowen spaceport's access to low- to mid-inclination orbits, and Space BD will also help procure ElaraSat subsystems, deepening the relationship beyond pure distribution. ElaraSat MMS-2, the Hyperflight hypersonic service, and a future Eris launch backlog are the main land-and-expand levers, and Gilmour aspires to become a Southern Hemisphere launch hub. Against this, concentration risk is high. The customer base leans heavily on Australian government and defence demand and on a single anchor satellite mission (CSIRO); there is no recurring launch revenue, with income instead coming from satellite work, defence services, and grants. Channel dependence on Space BD means much prospective Asia-Pacific commercial access is intermediated by one partner that has not yet delivered a Gilmour launch. Most decisively, all customer launch proof is contingent on an orbital vehicle that failed about 14 seconds into its only flight in July 2025. Customer proof quality therefore spans a wide range — from CSIRO's production-grade deployment to prospective defence and commercial prospects that remain pipeline rather than revenue.
    claimRefs: [CU014, CU017, CU018, CU019, CU036, CU037, CU038, CU040, CU034]
    tableRefs: [TU005]
