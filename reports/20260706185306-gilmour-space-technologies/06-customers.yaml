callouts:
  - calloutType: strength
    title: "CSIRO Payload Gives Genuine On-Orbit Customer Proof"
    body: "CSIRO's hyperspectral imager has been operating on ElaraSat MMS-1 since June 2025, with verified S-band and X-band links — production-grade customer proof and real on-orbit heritage for the satellite bus even before Eris reaches orbit."
    claimRefs: [CU002, CU025]
  - calloutType: risk
    title: "No Recurring Launch Customers; Proof Hinges on an Unproven Rocket"
    body: "Zero orbital launches have carried a paying customer, and all launch customer proof depends on Eris, which failed about 14 seconds into its only flight in July 2025. Revenue today is non-recurring — satellite work, defence services, and grants."
    claimRefs: [CU014, CU036]
  - calloutType: insight
    title: "Space BD Channel Opens Asia-Pacific Demand"
    body: "The July 2025 Space BD partnership gives Gilmour an agent with 90-plus satellite missions of experience to market Eris and ElaraSat across Japan and Asia-Pacific, leveraging Bowen's low- to mid-inclination orbital access."
    claimRefs: [CU005, CU040]
  - calloutType: assumption
    title: "Customer Base Concentrated on Australian Government and Defence"
    body: "Proven demand leans on the Commonwealth, the RAAF, and a single CSIRO mission. Absent disclosed revenue splits, heavy sovereign/defence concentration is treated as a material assumption requiring diligence."
    claimRefs: [CU017, CU036]
