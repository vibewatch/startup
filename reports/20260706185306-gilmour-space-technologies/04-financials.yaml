artifact: "financials"
slug: "gilmour-space-technologies"
runDate: "2026-07-06"
company:
  name: "Gilmour Space Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: "Gilmour Space is a private, pre-launch-revenue rocket company whose current income comes from a satellite bus (ElaraSat), defence launch-engineering and R&D (a A$17.6M RAAF contract), nascent hypersonic test work, and non-dilutive government grants — not recurring orbital launch revenue. Its financial thesis rests on future Eris per-launch service revenue, benchmarked against public comparator Rocket Lab (US$601.8M 2025 revenue). Capital intensity is high and the company is deeply financing-dependent, having raised more than A$350M including a A$217M Series E (January 2026) at a >A$1B valuation, yet revenue, burn, runway, gross margin, unit economics and the cap table are all undisclosed and constitute the central underwriting blockers."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Model, Streams, and Monetization"
    body: |
      Gilmour Space is pre-revenue on its flagship business — orbital launch — and does not publish audited financial statements, so its revenue model must be reconstructed from disclosed contracts, product milestones and investor commentary. Today the company monetizes four adjacent activities rather than recurring launch. First, its ElaraSat satellite bus line reached orbit in June 2025 when MMS-1 was deployed via a SpaceX Transporter-14 rideshare carrying a CSIRO hyperspectral payload, establishing a satellite-and-hosted-payload revenue path. Second, defence launch-engineering and R&D is a disclosed, milestone-based line anchored by a A$17.6 million Royal Australian Air Force contract. Third, the company has begun nascent hypersonic test-rocket work for defence and research customers. Fourth, non-dilutive government grants — a A$52 million Australian Space Manufacturing Network grant (2023) and a A$5 million Industry Growth Program grant (2025) — provide funding, though these are subsidies rather than commercial revenue.

      The intended future model is Eris orbital launch revenue: a per-launch, per-kilogram launch service targeting pricing competitive with small-launch peers once the ~305 kg-to-LEO vehicle is qualified. No launch revenue exists yet — Eris TestFlight-1 (July 2025) failed roughly nine-to-fourteen seconds into flight. Gilmour publishes no public price list, so pricing is bespoke and contract-based, and SpaceX rideshare slots at roughly US$300k–500k per smallsat form a cheap substitute that pressures dedicated small-launch pricing. Public comparator Rocket Lab shows the shape of a mature model: US$601.8 million of 2025 revenue, of which Space Systems (not launch) was 66.9%.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI010, CI011, CI012, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics, Cost Structure, and Margin Path"
    body: |
      Gilmour's unit economics are effectively unmeasurable from public data and are treated here as a structured set of nulls with explicit diligence asks rather than estimates. Gross margin, cost per launch, contribution margin per ElaraSat, customer-acquisition cost, sales-cycle length and the launch cadence required to reach breakeven are all undisclosed. Because current revenue is project- and government-contract-based — with long, procurement-driven sales cycles — conventional efficiency proxies such as CAC or payback period cannot yet be computed, and forcing SaaS or marketplace metrics onto a hardware launch business would be misleading.

      What is observable is the cost architecture, which is heavily capital-intensive. Orbital launch requires rocket manufacturing, propulsion test infrastructure, and a dedicated launch site (the Bowen Orbital Spaceport); the A$52 million ASMN grant explicitly funds manufacturing and spaceport facilities, signalling the scale of capex. The company runs in-house manufacturing supported by more than 500 Australian suppliers and 200-plus staff, implying material fixed costs and working-capital needs well before launch revenue arrives. The public comparator is instructive on the margin path: Rocket Lab, far more mature, still posted a 2025 net loss of about US$198 million, underlining that positive unit economics in small launch depend on high cadence and a diversified space-systems mix rather than launch pricing alone.
    claimRefs: [CI027, CI028, CI029, CI030, CI031, CI034, CI036, CI037]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy and Financing Dependency"
    body: |
      Gilmour is a financing-dependent business, and its forward capital adequacy — not its historical round chronology, which the Company Overview details — is the underwriting question. The historical raise trajectory is referenced only as context: Series A (~A$5M, 2017), Series B (~US$19M, 2018), Series C (A$61M, June 2021, then Australia's largest space raise), and Series D (A$55M, February 2024, QIC-led). The material recent events are the January 2026 A$217 million Series E, co-led by the National Reconstruction Fund Corporation and Hostplus at A$75 million each, which lifted the valuation above A$1 billion; a reported extension toward A$231 million; and a further A$14.2 million follow-on secured in May 2026. Cumulative private capital exceeds A$350 million (Tracxn cites roughly US$245 million depending on inclusions).

      Despite this, the underwriting-critical figures are undisclosed. Cash on hand, monthly burn and cash runway are not published; they can only be inferred to be funded near-term by the recent equity plus non-dilutive support (A$75M NRFC, A$52M ASMN, A$5M IGP). The stated use of Series E funds is Eris TestFlight-2, manufacturing scale-up, the Bowen spaceport and next-generation liquid propulsion — all capex-heavy. The most likely next-round trigger is a successful orbital flight; no public debt or project-finance obligations are disclosed, leaving the balance sheet predominantly equity-plus-grant funded and dependent on continued investor conviction ahead of proven launch revenue.
    claimRefs: [CI014, CI015, CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI026]
    tableRefs: [TI004]
    figureRefs: [FI003, FI004]
  - id: "financial-gaps-and-verdict"
    title: "Public Financial Gaps and Verdict"
    body: |
      The defining financial characteristic of Gilmour for an underwriter is the breadth of undisclosed private data. Revenue and revenue mix, burn rate, cash runway, gross margin, signed launch backlog, per-launch unit economics and the full cap table are all unavailable from public sources. Each is a specific diligence blocker with a defined path: management accounts and the Series E data room for revenue and burn; a bottoms-up cost model for gross margin and per-launch economics; customer contracts for backlog; and the shareholders' agreement for the cap table. Public traction is genuine but thin — one satellite in orbit and zero successful orbital launches after TestFlight-1's failure.

      The verdict is that revenue quality is early and project-based rather than recurring; the margin path is unproven and, on the Rocket Lab comparator, likely negative for years; capital intensity is high; and the company carries a greater-than-A$1 billion valuation while pre-launch-revenue with undisclosed burn and runway — a material valuation-versus-fundamentals risk. Sector history (the failures of Astra and Virgin Orbit) shows small-launch unit economics are unproven industry-wide. The investment case is therefore a forward, milestone-driven one contingent on a successful Eris orbital flight; the financial inputs needed to underwrite it are, at present, largely insufficient and must be obtained under NDA.
    claimRefs: [CI030, CI031, CI032, CI033, CI035, CI038, CI039]
    tableRefs: [TI005]
