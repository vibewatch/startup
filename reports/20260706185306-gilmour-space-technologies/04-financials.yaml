callouts:
  - calloutType: risk
    title: "Unicorn Valuation Ahead of Any Launch Revenue"
    body: "Gilmour carries a greater-than-A$1 billion valuation while generating no orbital launch revenue and disclosing neither burn nor runway. With TestFlight-1 having failed and TestFlight-2 not yet flown, the valuation rests on forward expectations rather than demonstrated financial performance."
    claimRefs: [CI014, CI032, CI035]
  - calloutType: insight
    title: "Rocket Lab Is the Benchmark for the Margin Path"
    body: "The closest public comparator, Rocket Lab, earned US$601.8M in 2025 (66.9% from space systems, not launch) yet still lost about US$198M, showing that small-launch economics require high cadence and a diversified mix — and that Gilmour's path to positive margin is long."
    claimRefs: [CI007, CI037, CI009]
  - calloutType: recommendation
    title: "Obtain the Private Financial Pack Under NDA"
    body: "Revenue, burn, runway, gross margin, backlog and the cap table are all undisclosed. Underwriting requires the Series E data room, management accounts, a bottoms-up per-launch cost model, and signed launch contracts before the forward thesis can be tested."
    claimRefs: [CI031, CI039, CI030]
  - calloutType: assumption
    title: "Capital Intensity Drives Continued Financing Dependency"
    body: "Rocket manufacturing, propulsion test and the Bowen spaceport are capex-heavy, and the Series E is earmarked for scale-up. Absent disclosed burn, the working assumption is that Gilmour remains financing-dependent until a successful orbital flight unlocks launch revenue."
    claimRefs: [CI023, CI027, CI028]
