company:
  name: "Gilmour Space Technologies"
chapter:
  number: 8
  title: "Valuation"
  summary: "Gilmour Space crossed a A$1 billion valuation (~US$650M) at its A$217 million January 2026 Series E to become Australia's first space unicorn — before ever reaching orbit, with Eris TestFlight-1 having failed in July 2025. This chapter converts the report's evidence into an investment recommendation of WATCH (medium confidence, high risk): the valuation is rich on fundamentals for a pre-revenue launcher, but is materially supported by strategic, sovereign and government-backing premiums. It benchmarks Gilmour against public and private comparables (Rocket Lab, Firefly, Sierra Space, SpaceX, Isar), lays out bull/base/bear scenarios, and defines the thesis-break triggers and diligence asks that would move the call."
sections:
  - id: "recommendation-and-stance"
    title: "Recommendation, Confidence, and Valuation Stance"
    body: |
      The recommendation for Gilmour Space is WATCH — a track-and-revisit stance rather than a buy or a pass. The company offers rare, strategically significant upside as Australia's only credible sovereign orbital-launch contender, backed by an unusually deep and government-aligned capital base, yet it carries binary technical risk and is pre-revenue on its flagship product. Confidence in the recommendation is medium: the financing facts (A$217 million Series E, valuation above A$1 billion, January 2026) are well documented, but the central value driver — a reliable orbital Eris rocket — remains unproven after TestFlight-1 failed roughly nine to fourteen seconds into flight in July 2025. Risk rating is high, reflecting single-vehicle dependence, capital intensity, and the small-launch sector's history of failures.

      The valuation stance is that Gilmour is rich to stretched on fundamentals but defensible on strategy. At more than A$1 billion for a company with zero successful orbital launches and no disclosed launch revenue, the price cannot be justified on current cash flows or comparables on a pure multiples basis; it is priced like a credible small-launch contender ahead of proof. What supports the mark is a genuine sovereign premium: national-security demand for domestically controlled launch, a co-lead from the Australian Government's National Reconstruction Fund Corporation, participation from the Future Fund and QIC, and non-dilutive grants. Entry discipline therefore matters — the appropriate posture is to wait for TestFlight-2 evidence or negotiate structural downside protection before committing at a unicorn mark.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "thesis-antithesis"
    title: "Investment Thesis and Anti-Thesis"
    body: |
      The bull thesis rests on four pillars. First, market: sovereign and defence launch demand in Australia and the Indo-Pacific is rising, and Gilmour is the first mover with a licensed domestic orbital spaceport at Bowen. Second, capital and endorsement: the January 2026 Series E drew the National Reconstruction Fund Corporation and Hostplus as A$75 million co-leads, plus the Future Fund, QIC and multiple super funds — a patient, strategically aligned base that de-risks financing. Third, diversification: ElaraSat reached orbit via SpaceX in June 2025, and a A$17.6 million RAAF contract plus hypersonic test work give adjacent revenue and orbit heritage before Eris flies. Fourth, scarcity: as a sovereign monopoly candidate, Gilmour could command a premium if Eris works.

      The anti-thesis is equally concrete. The product is unproven — TestFlight-1 failed, and small-launch is littered with well-funded failures (Astra, Virgin Orbit, ABL). The valuation embeds success that has not occurred; independent analysts note many highly valued space companies are pre-revenue or early-revenue relative to their marks. Economics are pressured by low-cost SpaceX rideshare pricing (from roughly US$300,000 per smallsat slot) that undercuts dedicated small launch. Capital intensity is high and burn is undisclosed, creating down-round risk if TestFlight-2 slips. Finally, key-person concentration in the two founding brothers compounds execution risk. Each of these has an explicit "what would change the view" trigger.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: "valuation-context-and-comparables"
    title: "Financing Context and Comparable Valuation"
    body: |
      Gilmour's A$1 billion-plus post-money mark must be read against a space sector that, in 2026, is pricing hardware at premiums not seen in a decade. The relevant public anchor is Rocket Lab, whose stock rose sharply through 2025 to a market capitalisation reported between roughly US$37 billion and US$41 billion on about US$602 million of 2025 revenue — an EV/revenue multiple near 60–67x — after proving Electron and building a satellite business. Firefly Aerospace, which achieved a lunar landing and sought an initial public offering around a US$5.5 billion valuation, trades at a lower price-to-sales multiple on roughly US$160 million of 2025 revenue. Private marks include Sierra Space at about US$8 billion and Isar Aerospace, among Europe's best-funded launchers with well over US$150 million raised, despite a failed first launch. SpaceX, at US$800 billion to US$1.5 trillion-plus, is a scale outlier rather than a comparable.

      Placed in that set, Gilmour's mark looks like an option premium: it is priced as a plausible future small-launch and sovereign-capability provider, not on trailing fundamentals it does not yet have. The uncomfortable fact for entry discipline is that Gilmour carries a billion-dollar valuation with zero successful orbital launches, whereas Rocket Lab's premium is anchored by demonstrated flight and revenue. The public evidence supports the price only if one accepts the sovereign and strategic premium and a high probability of eventual orbital success; on pure multiples, the mark is not supported. Dilution and preference overhang from a large, government-led round are additional unknowns that public sources cannot resolve.
    claimRefs: [CV015, CV016, CV017, CV018, CV019, CV020, CV021, CV022, CV023, CV024]
    tableRefs: [TV004]
    figureRefs: [FV002]
  - id: "scenarios"
    title: "Bull, Base, and Bear Scenarios"
    body: |
      The scenario spread is unusually wide because outcomes hinge on a small number of binary events. In the bull case, Eris TestFlight-2 succeeds in late 2026, Gilmour converts a defence and sovereign backlog into recurring launch revenue, and its position as Australia's de facto sovereign launch monopoly supports a multi-billion-dollar valuation and a public-markets or strategic exit — a re-rating toward the Rocket Lab template. In the base case, the vehicle eventually reaches orbit but on a slower timeline (2027), cadence and pricing are modest against SpaceX rideshare competition, and the company roughly holds its ~A$1 billion mark while consuming further capital.

      In the bear case, TestFlight-2 fails or slips materially, a capital crunch forces a down round or impairment, and Gilmour risks the small-launch "graveyard" fate of Astra, Virgin Orbit and ABL. Probability signals favour a wide, right-skewed-on-strategy but left-tail-heavy-on-technical distribution: the sovereign mandate and deep super-fund capital reduce financing risk relative to peers, but the technical base rate for a second launch attempt after a first-flight failure is sobering. The valuation/return range figure translates these into low, base and high valuation outcomes with explicit assumptions; the sensitivity analysis shows launch-success probability is by far the dominant driver of value.
    claimRefs: [CV025, CV026, CV027, CV028, CV029, CV030]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: "thesis-break-triggers"
    title: "Thesis-Break Triggers and Kill Criteria"
    body: |
      A disciplined WATCH stance requires pre-committed, monitorable triggers so the position can be revisited on evidence rather than sentiment. The single most important trigger is the outcome of Eris TestFlight-2: a second consecutive orbital failure would materially break the thesis, transmitting directly to valuation, financing access and customer confidence, and would push the recommendation toward pass or a demand for a steep down-round entry. A slip of TestFlight-2 beyond mid-2027 without a funded runway is a second trigger, because it converts technical risk into liquidity risk. Evidence of a down round, materially adverse preference terms, or a distressed secondary would confirm the bear path.

      Other triggers are commercial and structural: loss or non-conversion of the defence and sovereign backlog, sustained pricing pressure from SpaceX rideshare that undermines dedicated small-launch economics, departure of either founder given key-person concentration, or withdrawal of government support. On the upside, a successful TestFlight-2 plus signed, priced commercial launch contracts would be a thesis-confirming trigger that could move the call from WATCH toward BUY at a re-underwritten price. Each trigger is paired with a threshold and an action implication so the monitoring is decision-useful rather than descriptive.
    claimRefs: [CV031, CV032, CV033, CV034, CV035, CV036]
    tableRefs: [TV005]
  - id: "diligence-asks-and-kpis"
    title: "Exit Readiness, Diligence Asks, and Investment KPIs"
    body: |
      Exit readiness is early-stage. Gilmour is private and pre-IPO; a public listing or strategic acquisition is plausible only after Eris is proven, and the most visible exit template is Rocket Lab's public-market re-rating. The binding diligence asks therefore centre on the unknowns that public evidence cannot resolve: the full Series E cap table, liquidation preferences and any ratchet or anti-dilution terms; audited or management financials covering revenue, burn, and cash runway to fund TestFlight-2 and beyond; the technical corrective-action package from the TestFlight-1 investigation and independent verification of readiness; the contracted defence and sovereign backlog with values and milestones; and key-person arrangements and succession.

      The investment KPI panel scores the opportunity across the dimensions an investment committee weighs: market attractiveness (high, sovereign-driven), technical proof (low, pre-orbit), moat and scarcity (high on sovereign positioning), unit economics and financials (unproven/undisclosed), risk (high), valuation support (weak on fundamentals, moderate on strategy), and evidence quality (mixed — strong on financing, thin on operating metrics). The composite reads as a high-potential but low-proof, richly priced opportunity — precisely the profile that warrants a WATCH: stay close, define the triggers, and be ready to act when TestFlight-2 resolves the central uncertainty.
    claimRefs: [CV037, CV038, CV039, CV040, CV041, CV042]
    tableRefs: [TV006]
    figureRefs: [FV004]
