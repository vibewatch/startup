      - number: '5.5'
        title: Critical Dependencies and Technical Risks
        blocks:
          - type: paragraph
            body: >
              Eris and ElaraSat sit atop a chain of external dependencies, several of which are already implicated in
              setbacks. The most acute is the external component supply chain: the TestFlight-1 root cause traced to
              electrical and thermal faults in oxidiser-pump motors and inverters that included externally sourced
              components, showing that even a vertically integrated vehicle inherits supplier risk on critical parts.
              Regulatory dependencies are equally binding — every launch requires Australian Space Agency permits and
              CASA airspace coordination, and the multi-year approval timeline already delayed the maiden flight by
              roughly 18 months. Physical dependencies include the Bowen site itself and its weather window, which
              repeatedly scrubbed 2025 attempts, plus the composite-structure and hybrid-propellant (hydrogen peroxide,
              solid-fuel) supply chains and a network of more than 500 Australian suppliers supporting a 200-plus-person
              team.


              A further structural dependency is that ElaraSat, though operational, currently reaches orbit only via
              third-party launch (SpaceX) because Eris is not yet flight-qualified; the vertical-integration thesis only
              closes once Eris is reliable. The critical dependency map below traces suppliers, regulators, facilities,
              and platform relationships. The dominant technical risk remains binary: an unproven orbital vehicle whose
              single flight failed on a propulsion subsystem, leaving valuation and the sovereign-launch thesis
              contingent on TestFlight-2 and subsequent flights demonstrating repeatable performance.
