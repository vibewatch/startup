      - number: '3.4'
        title: Moat Durability, Switching Costs, and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              Gilmour's central moat is sovereignty: a domestically owned, end-to-end Australian launch stack backed by
              government capital, including a A$75 million National Reconstruction Fund Corporation commitment. That
              moat is real for Australian and allied government payloads that value assured, non-foreign access, but it
              is narrow and policy-dependent, and it does nothing to close the capability or heritage gap for
              price-sensitive commercial customers. Switching costs in launch are only moderate — payload integration,
              dispenser compatibility and licensing create friction — and buyers routinely multi-home across providers,
              so no single launcher enjoys strong lock-in. Rocket Lab's deeper moat comes from vertical integration into
              satellites and components (supporting 1,700-plus missions), which Gilmour partly mirrors with ElaraSat but
              at far smaller scale.


              The adverse signals are material. The single largest displacement risk is commoditisation from below:
              SpaceX rideshare's cost advantage and Falcon 9 cadence can absorb the low end of dedicated small launch,
              and Rocket Lab's dominance ($2.2 billion backlog, 36 contracts signed in Q1 2026 alone) leaves little
              oxygen for laggards. The small-launch "graveyard" is a durability warning in its own right — Astra was
              privatised for about US$10-12 million after a 2021 SPAC peak, Virgin Orbit went bankrupt, ABL raised
              roughly US$461 million before pivoting to missiles, and Relativity cancelled Terran-1 after raising over
              US$1.3 billion. Even nominal successes struggle with reliability: Firefly's Alpha logged four anomalies
              across six flights. Gilmour took about 13 years to reach a maiden flight that failed, longer than Isar (~7
              years) or Electron's active development (~4 years), making TestFlight-2 an existential proof point rather
              than a routine milestone.
