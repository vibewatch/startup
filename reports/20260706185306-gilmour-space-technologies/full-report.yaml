      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The Launch Market Is Far Smaller Than the Satellite Market It Serves
            body: >-
              Smallsat demand may reach US$32B by 2030, but the dedicated small-launch market Gilmour actually sells
              into is only ~US$1.8-2.2B today and grows far more slowly. Conflating the two overstates the addressable
              opportunity; the honest boundary is Asia-Pacific/Australian sovereign small launch.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM025
          - type: callout
            title: Sovereign-Capability Demand Is a Structural Tailwind
            body: >-
              Australia's A$9-12B decade-long space commitment, the 2026 Defence Industry Development Strategy, and a
