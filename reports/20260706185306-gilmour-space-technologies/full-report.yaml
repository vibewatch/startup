      - number: '5.4'
        title: Differentiation, Trust, Quality, and Compliance
        blocks:
          - type: paragraph
            body: >
              Gilmour's differentiation is structural rather than proven-in-flight: it owns the whole stack — rocket,
              satellite bus, and a licensed launch site — offering allied and Australian government, defence, and
              commercial customers a domestically controlled path to orbit. Its in-house hybrid propulsion and composite
              manufacturing know-how are the technical moat, and its regulatory position is a real, hard-won asset.
              Gilmour holds Australia's first orbital launch facility licence (granted March 2024 under the Space
              (Launches and Returns) Act 2018), the first Australian orbital launch permit (November 2024), a
              CASA-approved flight management plan, and environmental approval from the Department of Climate Change,
              Energy, the Environment and Water.


              On trust and safety, the record is mixed but not alarming: TestFlight-1 produced no injuries and no
              adverse environmental impacts, and Gilmour coordinated closely with the Australian Space Agency's Office
              of the Space Regulator, CASA, Airservices Australia, and maritime authorities, submitting a final
              failure-investigation report to the regulator. What is unproven is product reliability and quality
              control: with zero successful orbital flights and the sole attempt lost to a subsystem fault involving
              externally sourced parts, there is no demonstrated launch reliability, no published qualification-test
              dataset, and no third-party certification of the vehicle's flight systems. These controls and gaps are
              enumerated in the trust/quality/compliance table.
