      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              The scenario spread is unusually wide because outcomes hinge on a small number of binary events. In the
              bull case, Eris TestFlight-2 succeeds in late 2026, Gilmour converts a defence and sovereign backlog into
              recurring launch revenue, and its position as Australia's de facto sovereign launch monopoly supports a
              multi-billion-dollar valuation and a public-markets or strategic exit — a re-rating toward the Rocket Lab
              template. In the base case, the vehicle eventually reaches orbit but on a slower timeline (2027), cadence
              and pricing are modest against SpaceX rideshare competition, and the company roughly holds its ~A$1
              billion mark while consuming further capital.


              In the bear case, TestFlight-2 fails or slips materially, a capital crunch forces a down round or
              impairment, and Gilmour risks the small-launch "graveyard" fate of Astra, Virgin Orbit and ABL.
              Probability signals favour a wide, right-skewed-on-strategy but left-tail-heavy-on-technical distribution:
              the sovereign mandate and deep super-fund capital reduce financing risk relative to peers, but the
              technical base rate for a second launch attempt after a first-flight failure is sobering. The
              valuation/return range figure translates these into low, base and high valuation outcomes with explicit
              assumptions; the sensitivity analysis shows launch-success probability is by far the dominant driver of
              value.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
