      - number: '2.3'
        title: Buyer Segments, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >
              Demand for Gilmour's stack concentrates in a small number of well-defined buyer segments, most of which
              are budget-owned by government rather than commercial capital. Government and defence is the largest and
              fastest-growing buyer of small launch — Fortune Business Insights estimates the government segment at
              about 44.6% of the small-launch market in 2026 — purchasing sovereign ISR, PNT and resilient
              communications capability funded from Commonwealth defence budgets. Civil government and space agencies
              (the Australian Space Agency, CSIRO) buy Earth-observation and science missions through grants and
              programs. Commercial constellation operators buy launch and buses out of operator capex and venture
              funding to deploy and replenish LEO fleets. Research and academic buyers procure payload-hosting and
              technology demonstration on grant budgets.


              The adoption path is long and procurement-driven. A defence or agency buyer moves from a
              sovereign-capability mandate, through qualification of the launch vehicle and site, to a milestone-based
              contract; a commercial operator qualifies the bus and launch service before committing to a multi-launch
              constellation campaign. Because the payer (a government program office or operator procurement team) is
              usually distinct from the end user (operators, analysts, warfighters), adoption hinges on institutional
              trust and demonstrated flight heritage — precisely what a pre-orbital launch provider still has to earn.
              The 2023 Technology Safeguards Agreement with the United States also opens an allied-buyer channel by
              permitting launches from Australian spaceports.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
