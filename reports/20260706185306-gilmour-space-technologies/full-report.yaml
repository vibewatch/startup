      - number: '7.6'
        title: People, Execution Risk, and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Leadership is concentrated in two founding brothers: Adam Gilmour, CEO and public face who drives strategy
              and capital-raising, and James Gilmour, who leads launch operations and engineering. This pairing gives
              the company cohesion but creates acute key-person dependence — both commercial and technical authority sit
              within one family, and public succession or key-person-insurance disclosures do not exist. The loss or
              departure of either founder would be a step-change event for execution, financing and morale, and is
              therefore treated as a thesis-break trigger rather than a routine HR risk. Execution risk is broader than
              the founders: delivering an unprecedented sequence of orbital launches on schedule, at rate, from a
              greenfield site, with a scaling workforce, is itself a demanding managerial task the company has not yet
              demonstrated.


              Because so much rests on the next flight, we define monitorable kill criteria. A second consecutive
              failure of TestFlight-2, or a slip of the orbital milestone past 2027, would materially break the thesis.
              Cash runway falling below roughly six months without a committed new raise, revocation or indefinite
              suspension of the Bowen launch licence, or the loss of a founder would each be sufficient on their own to
              reassess. Mitigants exist — adjacent hypersonic-test and satellite revenue, a diversified
              government-and-super investor base, a next vehicle already in production, and post-anomaly
              design/qualification changes — but none removes the central binary. The mitigation-and-kill-criteria table
