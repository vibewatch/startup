      - number: '8.5'
        title: Thesis-Break Triggers and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              A disciplined WATCH stance requires pre-committed, monitorable triggers so the position can be revisited
              on evidence rather than sentiment. The single most important trigger is the outcome of Eris TestFlight-2:
              a second consecutive orbital failure would materially break the thesis, transmitting directly to
              valuation, financing access and customer confidence, and would push the recommendation toward pass or a
              demand for a steep down-round entry. A slip of TestFlight-2 beyond mid-2027 without a funded runway is a
              second trigger, because it converts technical risk into liquidity risk. Evidence of a down round,
              materially adverse preference terms, or a distressed secondary would confirm the bear path.


              Other triggers are commercial and structural: loss or non-conversion of the defence and sovereign backlog,
              sustained pricing pressure from SpaceX rideshare that undermines dedicated small-launch economics,
              departure of either founder given key-person concentration, or withdrawal of government support. On the
              upside, a successful TestFlight-2 plus signed, priced commercial launch contracts would be a
              thesis-confirming trigger that could move the call from WATCH toward BUY at a re-underwritten price. Each
              trigger is paired with a threshold and an action implication so the monitoring is decision-useful rather
              than descriptive.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
          - type: table
            tableRef: TV005
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
      - number: '8.6'
        title: Exit Readiness, Diligence Asks, and Investment KPIs
        blocks:
          - type: paragraph
            body: >
              Exit readiness is early-stage. Gilmour is private and pre-IPO; a public listing or strategic acquisition
              is plausible only after Eris is proven, and the most visible exit template is Rocket Lab's public-market
              re-rating. The binding diligence asks therefore centre on the unknowns that public evidence cannot
              resolve: the full Series E cap table, liquidation preferences and any ratchet or anti-dilution terms;
              audited or management financials covering revenue, burn, and cash runway to fund TestFlight-2 and beyond;
              the technical corrective-action package from the TestFlight-1 investigation and independent verification
              of readiness; the contracted defence and sovereign backlog with values and milestones; and key-person
              arrangements and succession.


              The investment KPI panel scores the opportunity across the dimensions an investment committee weighs:
              market attractiveness (high, sovereign-driven), technical proof (low, pre-orbit), moat and scarcity (high
              on sovereign positioning), unit economics and financials (unproven/undisclosed), risk (high), valuation
              support (weak on fundamentals, moderate on strategy), and evidence quality (mixed — strong on financing,
              thin on operating metrics). The composite reads as a high-potential but low-proof, richly priced
              opportunity — precisely the profile that warrants a WATCH: stay close, define the triggers, and be ready
              to act when TestFlight-2 resolves the central uncertainty.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
