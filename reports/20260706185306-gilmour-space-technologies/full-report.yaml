      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The demand tailwinds are real and durable. LEO mega-constellations — Starlink's 7,000-plus satellites,
              Amazon's Project Kuiper, China's Guowang and allied programs — generate sustained, recurring launch and
              smallsat manufacturing demand. National-security spending is rising globally, and in Australia
              specifically Canberra has signalled a A$9-12 billion commitment over the coming decade to resilient
              space-domain awareness and sovereign space capability, reinforced by the 2026 Defence Industry Development
              Strategy's emphasis on a self-reliant industrial base. Falling launch costs from reusability (SpaceX at
              roughly US$2,700-3,000 per kilogram to LEO) enlarge the overall market and lower barriers for satellite
              operators.


              The constraints are equally material and cut against dedicated small launch. SpaceX's Transporter
              rideshare offers smallsat slots at a fraction of a dedicated launch, creating direct substitution and
              price pressure — the single most-cited threat to dedicated small-launch economics. The dedicated
              small-launch market is itself far smaller and slower-growing (roughly 5-12% CAGR) than the smallsat market
              it serves (up to 28%), implying capacity and oversupply risk as many vehicles chase limited dedicated
              demand. Rocket development is capital-intensive with high failure rates, as Gilmour's own TestFlight-1
              loss underscores. Australian manufacturers face a higher cost base and thinner component supply than US
              rivals, sector revenue remains heavily government-dependent, and debris/deorbit regulation adds roughly
              US$200,000-500,000 per satellite in compliance cost. These drivers and constraints together set the timing
              and ceiling on Gilmour's addressable adoption.
            claimRefs:
              - CM021
              - CM022
