              - CV041
              - CV042
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: WATCH — Priced Like a Contender, Not Yet Proven Like One
            body: >-
              Gilmour is Australia's first space unicorn (>A$1B, Jan 2026) but has zero successful orbital launches. The
              defensible stance is WATCH: stay close, define triggers, and act when TestFlight-2 resolves the central
              technical uncertainty rather than paying a unicorn mark ahead of proof.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV031
          - type: callout
            title: Valuation Ahead of a Proven Rocket
            body: >-
              On pure multiples, >A$1B for a pre-revenue launcher is stretched versus Rocket Lab (~US$602M revenue,
              proven flight, ~60-67x). The mark is only defensible via a sovereign/strategic premium — a genuine but
              fragile support that a second launch failure would remove.
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
              - CV031
          - type: callout
            title: Government-Backed Capital De-Risks Financing
            body: >-
              The A$217M Series E was co-led by the government's NRFC and Hostplus, with the Future Fund and QIC
              participating. This unusually deep, strategically aligned base lowers near-term financing risk relative to
              small-launch peers that failed for lack of capital.
            calloutType: strength
            claimRefs:
              - CV009
              - CV010
              - CV029
          - type: callout
            title: Launch-Success Probability Drives the Whole Model
            body: >-
              Sensitivity analysis shows the justified valuation is dominated by the probability that Eris reaches
              orbit. With no disclosed reliability data, this input is assumed and is the single highest-value item for
              diligence and monitoring.
            calloutType: assumption
            claimRefs:
              - CV028
              - CV030
              - CV038
