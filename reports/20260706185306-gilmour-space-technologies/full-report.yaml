      - number: '2.5'
        title: Sizing Gaps, Contradictions, and Diligence
        blocks:
          - type: paragraph
            body: >
              Several sizing and adoption questions cannot be resolved from public evidence and are preserved as gaps
              rather than smoothed over. Gilmour's SAM and SOM — Asia-Pacific and Australian sovereign small-launch
              demand and the share Gilmour can realistically capture — cannot be isolated from published analyst
              reports, which size global or regional markets but not the Australian sovereign-launch niche. Analyst
              estimates for the same underlying markets openly conflict: the small-satellite market is variously
              credited with a 16.4% (Allied Market Research), 21.3% (Technavio) or 28% (MarketsandMarkets) CAGR, and
              small-launch-vehicle sizing ranges from US$1.8 billion (GM Insights) to US$2.22 billion (Fortune Business
              Insights) for 2025 alone, reflecting different scope and methodology.


              There is also a structural adoption risk: independent Australian commentary is candid that, despite years
              of announcements, no Australian company had achieved orbit from Australian soil as of the reporting
              period, that launch economics in a competitive global market are challenging, and that most Australian
              space companies still rely on government funding for the bulk of their revenue. Australia's own A$12
              billion sector goal and 20,000-jobs target by 2030 provide a policy tailwind but not a bankable revenue
              forecast for any single company. These contradictions and the absence of a company-specific SAM are
              exactly the numbers a diligence process must reconcile with management's own market model and contracted
              pipeline before underwriting Gilmour's above-unicorn valuation.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
              - CM029
              - CM038
              - CM039
