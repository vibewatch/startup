      - number: '1.3'
        title: Funding History and Valuation
        blocks:
          - type: paragraph
            body: >
              Gilmour Space has raised capital across at least five priced venture rounds since 2017, progressively
              drawing in larger and more institutional backers. Early rounds were venture-led: a Series A of roughly A$5
              million in 2017 (Blackbird Ventures, with US accelerator 500 Startups also an early backer) and a Series B
              of about US$19 million in 2018 led by Main Sequence Ventures, the CSIRO-linked deep-tech fund.


              The Series C closed in June 2021 at A$61 million — then the largest private capital raise for an
              Australian space company — led by Fine Structure Ventures (an affiliate of Fidelity Investments) alongside
              Blackbird, Main Sequence, and superannuation funds HESTA, Hostplus and NGS Super. In February 2024 the
              company raised a A$55 million Series D led by Queensland Investment Corporation (QIC), with Blackbird,
              Main Sequence, Hostplus and HESTA participating, and later disclosed a A$14.2 million follow-on extension.


              The landmark event was the January 2026 Series E: A$217 million co-led by the Australian Government's
              National Reconstruction Fund Corporation (NRFC) and industry super fund Hostplus, each committing A$75
              million, with participation from the Future Fund, Blackbird, Funds SA, HESTA, NGS Super, Main Sequence,
              QIC and Brighter Super. The round lifted Gilmour's valuation above A$1 billion, making it Australia's
              first "space unicorn," and some reports indicate the round was subsequently extended toward A$231 million
              with additional superannuation participation. Alongside equity, Gilmour has secured non-dilutive
              government support, including a A$75 million NRFC commitment tied to the round, a A$52 million federal
              Australian Space Manufacturing Network grant (2023), and a A$5 million Industry Growth Program grant.
