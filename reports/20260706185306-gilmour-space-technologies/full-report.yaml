chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Corporate Structure
        blocks:
          - type: paragraph
            body: >
              Gilmour Space Technologies is a privately held Australian aerospace company headquartered in Southport on
              the Gold Coast, Queensland, with rocket manufacturing, satellite production and a dedicated launch site
              (the Bowen Orbital Spaceport) all in Queensland. Founded in 2012 by brothers Adam Gilmour (CEO) and James
              Gilmour, the company began by building spaceflight simulators and educational hardware before pivoting to
              rocket propulsion research around 2015 and conducting its first hybrid-propellant rocket test flight in
              2016.


              The company operates a vertically integrated "sovereign space" model spanning three connected product
              lines: the Eris orbital launch vehicle, a three-stage small-satellite rocket using in-house hybrid
              propulsion; the ElaraSat modular satellite bus, a 100-kilogram-class platform that hosts up to 30
              kilograms of customer payload; and the Bowen Orbital Spaceport, Australia's first licensed orbital launch
              facility. This end-to-end stack — build the rocket, build the satellite, own the launch site — is designed
              to give Australian and allied government, defence and commercial customers a domestically controlled path
              to low Earth orbit rather than depending on foreign launch providers.


              Gilmour's core value proposition is sovereign Australian launch capability. As of mid-2026 the company is
              pre-revenue on orbital launch: its Eris TestFlight-1 in July 2025 was the first orbital-class rocket
              designed, built and launched from Australian soil, though it did not reach orbit. Revenue to date comes
              from adjacent activities — a satellite bus deployed via SpaceX rideshare, defence launch-engineering and
              hypersonic test services, and government grants — while the flagship orbital launch business remains in
              qualification.
