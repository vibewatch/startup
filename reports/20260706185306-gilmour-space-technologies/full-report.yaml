              - CV014
      - number: '8.3'
        title: Financing Context and Comparable Valuation
        blocks:
          - type: paragraph
            body: >
              Gilmour's A$1 billion-plus post-money mark must be read against a space sector that, in 2026, is pricing
              hardware at premiums not seen in a decade. The relevant public anchor is Rocket Lab, whose stock rose
              sharply through 2025 to a market capitalisation reported between roughly US$37 billion and US$41 billion
              on about US$602 million of 2025 revenue — an EV/revenue multiple near 60–67x — after proving Electron and
              building a satellite business. Firefly Aerospace, which achieved a lunar landing and sought an initial
              public offering around a US$5.5 billion valuation, trades at a lower price-to-sales multiple on roughly
              US$160 million of 2025 revenue. Private marks include Sierra Space at about US$8 billion and Isar
              Aerospace, among Europe's best-funded launchers with well over US$150 million raised, despite a failed
              first launch. SpaceX, at US$800 billion to US$1.5 trillion-plus, is a scale outlier rather than a
              comparable.


              Placed in that set, Gilmour's mark looks like an option premium: it is priced as a plausible future
              small-launch and sovereign-capability provider, not on trailing fundamentals it does not yet have. The
              uncomfortable fact for entry discipline is that Gilmour carries a billion-dollar valuation with zero
              successful orbital launches, whereas Rocket Lab's premium is anchored by demonstrated flight and revenue.
              The public evidence supports the price only if one accepts the sovereign and strategic premium and a high
              probability of eventual orbital success; on pure multiples, the mark is not supported. Dilution and
              preference overhang from a large, government-led round are additional unknowns that public sources cannot
              resolve.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
