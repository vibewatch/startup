      - number: '1.5'
        title: Cover Metrics and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              As of mid-2026 Gilmour Space's verifiable cover metrics are: a post-money valuation above A$1 billion
              (Series E, January 2026); a headline Series E of A$217 million, reported to have been extended toward
              A$231 million; total private capital raised well in excess of A$350 million across five-plus rounds since
              2017 (databases such as Tracxn cite roughly US$245 million, a figure sensitive to whether grants and
              extensions are counted); a workforce reported at 200-plus employees; and a headquarters and manufacturing
              base on the Gold Coast plus the Bowen Orbital Spaceport, both in Queensland.


              Several metrics are not publicly disclosed and are treated here as gaps. Gilmour does not publish revenue,
              burn rate, cash runway, or gross margin; as a pre-orbital-launch company its revenue is early-stage
              (satellite, defence services, grants) rather than recurring launch revenue. Exact current headcount,
              founder and investor equity splits, the full Series E cap table, and the precise total-raised figure all
              vary by source or are undisclosed. These are flagged with explicit diligence paths rather than estimated.


              The most consequential uncertainty is technical: the company's central asset — a reliable orbital Eris
              rocket — has not yet been demonstrated, so valuation rests heavily on forward expectations. This overview
              separates verified facts (rounds, investors, dates, the TestFlight-1 outcome) from company claims and
              undisclosed private metrics so later chapters can reuse a consistent ground truth.
