  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Alternative Solutions
        blocks:
          - type: paragraph
            body: >
              Gilmour Space sells access to low Earth orbit, a job a buyer can satisfy in several competing ways. The
              direct peers are other dedicated small-lift launch vehicles: Rocket Lab's Electron, Firefly Aerospace's
              Alpha, and Isar Aerospace's Spectrum, plus a long tail of pre-orbital European and Asian entrants such as
              Rocket Factory Augsburg (RFA), HyImpulse and (until it entered administration) the UK's Orbex. Within
              Australia, Southern Launch is an adjacent domestic rival that operates launch sites and range services
              rather than building rockets, competing for the same sovereign-capability narrative and government
              funding.


              The most important alternative, however, is not a dedicated rocket at all. SpaceX's Transporter rideshare
              program is the substitute that reframes the whole market: it moves smallsats to sun-synchronous orbit from
              roughly US$350,000 for up to 50 kilograms plus about US$7,000 per additional kilogram — an order of
              magnitude cheaper per kilogram than a dedicated launch. The status-quo option for many payloads is simply
              to wait for the next rideshare manifest, though 12-to-18-month backlogs and fixed orbits push schedule-
              and orbit-sensitive customers back toward dedicated providers. A further "internal build" alternative
              exists only for the largest national customers who could fund captive launch programs. This chapter
              compares every one of these paths and asks how durable Gilmour's differentiation is against them.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP026
              - CP030
              - CP039
