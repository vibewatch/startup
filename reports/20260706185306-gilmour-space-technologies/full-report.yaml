      - number: '5.2'
        title: 'How Eris Works: Hybrid Propulsion and Vehicle Architecture'
        blocks:
          - type: paragraph
            body: >
              Eris is built around Gilmour's proprietary hybrid propulsion, the company's central technical bet. The
              first stage clusters four Sirius hybrid engines that burn a 3D-printed solid fuel with a liquid oxidiser
              (hydrogen peroxide); the second stage uses a single vacuum-optimised Sirius engine; and the third stage —
              which performs orbital injection — is the liquid-fuelled Phoenix engine. Hybrid propulsion is pitched as
              safer and cheaper than conventional liquid engines while retaining throttle control and restart
              capability, a differentiator versus liquid-fuel small launchers such as Rocket Lab's Electron and Isar
              Aerospace's Spectrum.


              The operating architecture layers upward from propulsion into composite vehicle structures, avionics and
              guidance/navigation/control, the launch site and ground systems at Bowen, the ElaraSat satellite bus, and
              mission operations. Gilmour states that Eris was developed almost entirely in-house — propulsion,
              structures, avionics, software, and the spaceport itself — which concentrates both know-how and execution
              risk internally. The Phoenix liquid-engine line received a A$5 million Industry Growth Program grant to
              accelerate development. Because most performance and qualification data is not independently published,
              the architecture table below distinguishes verified elements (stage configuration, propellant type,
              in-house scope) from company-stated design intent that diligence should probe against ground-test and
              flight telemetry.
