  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Confidence, and Valuation Stance
        blocks:
          - type: paragraph
            body: >
              The recommendation for Gilmour Space is WATCH — a track-and-revisit stance rather than a buy or a pass.
              The company offers rare, strategically significant upside as Australia's only credible sovereign
              orbital-launch contender, backed by an unusually deep and government-aligned capital base, yet it carries
              binary technical risk and is pre-revenue on its flagship product. Confidence in the recommendation is
              medium: the financing facts (A$217 million Series E, valuation above A$1 billion, January 2026) are well
              documented, but the central value driver — a reliable orbital Eris rocket — remains unproven after
              TestFlight-1 failed roughly nine to fourteen seconds into flight in July 2025. Risk rating is high,
              reflecting single-vehicle dependence, capital intensity, and the small-launch sector's history of
              failures.


              The valuation stance is that Gilmour is rich to stretched on fundamentals but defensible on strategy. At
              more than A$1 billion for a company with zero successful orbital launches and no disclosed launch revenue,
              the price cannot be justified on current cash flows or comparables on a pure multiples basis; it is priced
              like a credible small-launch contender ahead of proof. What supports the mark is a genuine sovereign
              premium: national-security demand for domestically controlled launch, a co-lead from the Australian
              Government's National Reconstruction Fund Corporation, participation from the Future Fund and QIC, and
              non-dilutive grants. Entry discipline therefore matters — the appropriate posture is to wait for
              TestFlight-2 evidence or negotiate structural downside protection before committing at a unicorn mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
