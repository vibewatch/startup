      - number: '3.3'
        title: Capability, Pricing, and Distribution Comparison
        blocks:
          - type: paragraph
            body: >
              On raw capability, Gilmour's Eris (~305 kg to LEO, ~215 kg to SSO) is comparable to Rocket Lab's Electron
              (~300 kg) but well below Firefly's Alpha (1,030 kg) and Isar's Spectrum (1,000 kg). Eris's differentiator
              is architecture: it uses in-house hybrid propulsion (solid fuel with a liquid oxidiser) rather than the
              liquid engines its rivals fly — a design Gilmour argues is safer and cheaper, but which is unproven at
              orbit and would, if successful, be the world's first hybrid rocket to reach orbit. The decisive gap is
              flight heritage: Rocket Lab has 91 successful launches and a launch roughly every two-to-three weeks,
              while Gilmour has zero orbital successes after TestFlight-1 lost thrust about 14 seconds into flight on 30
              July 2025.


              On price, published figures cluster around US$7.5 million for a dedicated Electron and roughly US$12-15
              million for a Firefly Alpha, with Isar targeting about €10,000 per kilogram; Gilmour has not published
              firm per-launch pricing. All dedicated providers are undercut on price-per-kilogram by SpaceX rideshare,
              competing instead on orbit precision, schedule control and sovereignty. Distribution power in launch flows
              from owning launch sites and range access — Gilmour owns Bowen Orbital Spaceport, Isar flies from Andøya
              in Norway, and Rocket Lab operates pads in New Zealand and Virginia. Trust and regulatory posture
              increasingly favour incumbents with national-security anchors: Rocket Lab carries US$1.3 billion of Space
              Development Agency work and a Golden Dome selection that a pre-orbital Gilmour cannot yet match.
