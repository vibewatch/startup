      - number: '4.2'
        title: Unit Economics, Cost Structure, and Margin Path
        blocks:
          - type: paragraph
            body: >
              Gilmour's unit economics are effectively unmeasurable from public data and are treated here as a
              structured set of nulls with explicit diligence asks rather than estimates. Gross margin, cost per launch,
              contribution margin per ElaraSat, customer-acquisition cost, sales-cycle length and the launch cadence
              required to reach breakeven are all undisclosed. Because current revenue is project- and
              government-contract-based — with long, procurement-driven sales cycles — conventional efficiency proxies
              such as CAC or payback period cannot yet be computed, and forcing SaaS or marketplace metrics onto a
              hardware launch business would be misleading.


              What is observable is the cost architecture, which is heavily capital-intensive. Orbital launch requires
              rocket manufacturing, propulsion test infrastructure, and a dedicated launch site (the Bowen Orbital
              Spaceport); the A$52 million ASMN grant explicitly funds manufacturing and spaceport facilities,
              signalling the scale of capex. The company runs in-house manufacturing supported by more than 500
              Australian suppliers and 200-plus staff, implying material fixed costs and working-capital needs well
              before launch revenue arrives. The public comparator is instructive on the margin path: Rocket Lab, far
              more mature, still posted a 2025 net loss of about US$198 million, underlining that positive unit
              economics in small launch depend on high cadence and a diversified space-systems mix rather than launch
              pricing alone.
