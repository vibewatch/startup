      - number: '1.4'
        title: Milestones, Scale, and Trajectory
        blocks:
          - type: paragraph
            body: >
              Gilmour's trajectory has been one of steady technical escalation punctuated by both breakthroughs and
              setbacks. After its 2012 founding and 2016 hybrid-rocket test flights, the company spent the late 2010s
              and early 2020s scaling propulsion, raising venture capital, and securing the site and licences for the
              Bowen Orbital Spaceport, which the Australian Space Agency approved as the country's first orbital launch
              facility.


              In 2024 the company diversified its revenue base, winning a A$17.6 million launch-engineering and R&D
              contract with the Royal Australian Air Force and later beginning hypersonic test-rocket work for defence
              and research customers. In June 2025 it reached orbit for the first time as a satellite operator when
              ElaraSat MMS-1, carrying a CSIRO hyperspectral imager, was deployed via SpaceX's Transporter-14 rideshare
              — validating its satellite bus even before its own rocket flew.


              The defining test came on 30 July 2025, when Eris TestFlight-1 lifted off from Bowen — the first
              Australian-made orbital-class rocket to launch from Australian soil — but suffered a first-stage
              propulsion anomaly around nine seconds into flight and fell back near the pad without reaching orbit. An
              investigation concluded in April 2026 traced the failure to electrical and thermal faults in the
              oxidiser-pump subsystem, including externally sourced components. Days-earlier momentum from the January
              2026 Series E and unicorn status underpinned the company's ability to fund a second attempt, with Eris
              TestFlight-2 targeted for late 2026.
