  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'What Gilmour Delivers: Launch, Satellites, and Spaceport'
        blocks:
          - type: paragraph
            body: >
              In customer-workflow terms, Gilmour Space sells sovereign access to low Earth orbit. A satellite operator
              or government payload owner who would otherwise queue for a foreign rideshare can instead run a mission
              through Gilmour's end-to-end funnel — mission enquiry, orbit and payload review, integration, and a
              dedicated or rideshare launch campaign from Australian soil. The company packages this as three connected
              product lines: the Eris orbital launch vehicle, the ElaraSat satellite bus, and the Bowen Orbital
              Spaceport, marketed together as "launch vehicle + satellite platform + licensed spaceport = simplified
              mission planning."


              The Eris Block 1 is a three-stage small-satellite rocket roughly 23 to 25 metres tall, about 2 metres in
              first-stage diameter, with a launch mass near 30 to 33 tonnes and a payload fairing about 1.5 metres
              across. It is designed to place approximately 305 kilograms into low Earth orbit or about 215 kilograms
              into a 500-kilometre sun-synchronous orbit. The ElaraSat platform is a modular, roughly 100-kilogram-class
              satellite bus that hosts up to 30 kilograms of customer payload and is compatible with multiple launch
              vehicles, including Eris. ElaraSat is the most mature asset: MMS-1, carrying a CSIRO hyperspectral imager,
              has operated in orbit since its June 2025 SpaceX Transporter-14 deployment and has verified its bus
              systems and S-band and X-band communications. Bowen, licensed in March 2024, is Australia's first orbital
              launch facility. This portfolio is the subject of the module matrix and workflow table below.
