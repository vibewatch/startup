        - Lower-probability but high-payoff; supported by sovereign demand and deep capital base
      - - Base
        - Orbit eventually reached ~2027 after delays; modest cadence; pricing pressured
        - Roughly holds ~A$1B mark; further dilution to fund scale-up
        - Slippage; SpaceX rideshare pricing; burn
        - Most-probable central case; wide error bars around timing
      - - Bear
        - TestFlight-2 fails or slips materially; capital crunch
        - Down round or impairment; small-launch 'graveyard' fate (Astra/Virgin Orbit/ABL)
        - Second launch failure; liquidity; investor fatigue
        - Material left-tail; second-attempt failure base rate is non-trivial
    notes: >-
      Scenarios are author estimates, not company guidance. Probability signals are qualitative given no disclosed
      financials or launch-reliability data. Comparable 'graveyard' outcomes from independent sector coverage.
