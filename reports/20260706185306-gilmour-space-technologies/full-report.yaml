  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity Ranking
        blocks:
          - type: paragraph
            body: >
              The single most consequential risk at Gilmour Space is technical: the company has never reached orbit.
              Eris TestFlight-1 lifted off from the Bowen Orbital Spaceport on 30 July 2025 — the first orbital-class
              rocket designed and built in Australia to fly from Australian soil — but the flight lasted only about 14
              seconds before the vehicle drifted sideways and fell back near the pad. The company's own investigation
              found that roughly nine seconds after ignition one of the four first-stage hybrid motors lost thrust, a
              second degraded around 17 seconds, and both failures traced to electrical and thermal faults in the
              oxidiser-pump subsystem, including components sourced from an external supplier. Orbital reliability is
              therefore unproven, and management itself notes that rocket companies typically need around three attempts
              to reach orbit.


              This technical risk is inseparable from execution and schedule risk. The launch slipped repeatedly from an
              initial May 2024 target, through a licence that the Australian Space Agency only issued in November 2024
              after roughly two years of assessment, to a May 2025 scrub caused by an unexpected power surge that
              prematurely deployed the payload fairing. TestFlight-2 is now guided to late 2026 — more than a year after
              the first failure — so the binary question of whether Eris can reach orbit remains open well into the
              investment horizon. We rank risks by residual severity: technical/reliability and execution/schedule are
              highest, followed by financial (a >A$1B valuation ahead of a proven rocket), regulatory/licensing,
              partner/dependency (single supplier, single site), competitive (a small-launch "graveyard"), and
              people/key-person concentration.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR008
              - CR015
