  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - TestFlight-2 outcome
        - Second consecutive orbital failure
        - Breaks core technical thesis; hits valuation, financing, customers
        - Move to pass or demand steep down-round entry
      - - Schedule slip
        - TestFlight-2 slips beyond mid-2027 without funded runway
        - Converts technical risk into liquidity risk
        - Pause; require funded runway before any commitment
      - - Financing terms
        - Down round, adverse preference/ratchet, or distressed secondary
        - Confirms bear valuation path; dilutes commonality
        - Re-underwrite at new mark; seek protection
      - - Commercial backlog
        - Loss/non-conversion of defence or sovereign contracts
        - Undermines revenue bridge in base/bull cases
        - Downgrade base-case value; widen bear weight
      - - Pricing pressure
        - Sustained SpaceX rideshare undercutting dedicated small launch
        - Erodes unit economics and long-run margin
        - Stress-test pricing; discount cadence assumptions
      - - Key person
        - Departure of Adam or James Gilmour
        - Elevates execution and governance risk
        - Reassess key-person risk; seek retention/succession
    notes: >-
      Triggers are monitorable and pre-committed for the WATCH stance. Thresholds are author-defined; some (runway,
      preferences) require non-public data flagged as diligence asks in TV006. Upside mirror: successful TestFlight-2 +
      priced contracts is a BUY-ward confirming trigger.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table & preferences
        - Full Series E cap table, liquidation preferences, ratchet/anti-dilution
        - Determines real downside protection and effective entry price
        - Company/lead investors under NDA; review shareholders' agreement
      - - Financials & runway
        - Revenue, burn, cash runway to fund TestFlight-2 and scale
        - Establishes down-round risk and capital adequacy
        - Management accounts and Series E data room; cash-flow model
      - - Technical readiness
        - TestFlight-1 corrective actions and independent readiness verification
        - Central to launch-success probability driving valuation
        - Investigation report; independent engineering review
      - - Commercial backlog
        - Contracted defence/sovereign backlog values and milestones
        - Underpins revenue bridge in base/bull scenarios
        - Contract schedule; customer references
      - - Valuation basis
        - Independent mark / methodology behind >A$1B Series E price
        - Tests whether price is market-clearing or government-led
        - Round documents; comparable transaction analysis
      - - Key person & governance
        - Succession, key-person insurance, board control
        - Founder concentration is a material execution/governance risk
        - Board charter; key-person policies; org chart
    notes: >-
      Diligence asks target the unknowns that public sources cannot resolve. Each maps to a valuation-critical
      uncertainty; most require access to the private data room. Owners are indicative (company, lead investors,
      independent reviewers).
    claimRefs:
