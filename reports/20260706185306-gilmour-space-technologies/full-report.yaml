      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Gilmour Space was co-founded and is led by two brothers who remain its defining figures. Adam Gilmour,
              chief executive officer, spent roughly two decades in banking (including senior roles at Citigroup across
              Asia) before leaving finance to build a rocket company; he is the public face of the company and drives
              its capital-raising and strategy. James Gilmour, his brother and co-founder, leads engineering and launch
              operations. The founder pairing concentrates both commercial and technical authority in one family, which
              underpins the company's cohesion but also creates material key-person dependence.


              The company has professionalised its leadership as it scaled, adding functional executives across
              propulsion, satellites (head of satellites Mark Grimminck), launch operations, and manufacturing, and
              expanding its workforce to a reported 200-plus staff supported by a network of more than 500 Australian
              suppliers during the TestFlight-1 campaign. Governance has shifted toward institutional oversight as
              sophisticated investors — venture funds Blackbird and Main Sequence, Fidelity-affiliated Fine Structure
              Ventures, superannuation funds including Hostplus, HESTA and NGS Super, state investor QIC, and the
              Commonwealth's National Reconstruction Fund Corporation — have taken board and observer positions across
              successive rounds.


              Because Gilmour is private and pre-IPO, granular governance disclosures (board composition, founder
              equity, voting control, option pools) are not public. The concentration of technical and executive
              leadership in the two founders, combined with the binary technical risk of an unproven orbital vehicle,
              makes key-person and succession planning a central diligence question that available public sources cannot
              fully answer.
