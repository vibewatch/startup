      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Gilmour's stack rests on several concentrated dependencies, and one of them has already failed. The
              TestFlight-1 root cause included electrical and thermal faults in oxidiser-pump components sourced from an
              external supplier, exposing single-supplier risk on a flight-critical subsystem where a defect is
              catastrophic rather than degradable. The launch itself depends on a single asset — the Bowen Orbital
              Spaceport — with no alternate pad, so weather, cyclone damage, or a licence issue at that one site stops
              the entire launch business. Capital-provider concentration is a further dependency: the January 2026
              Series E was co-led by the government's National Reconstruction Fund Corporation and Hostplus, and Gilmour
              has openly sequenced its financing around NRFC support, so a change in government-backed appetite would be
              material.


              Distribution and milestone dependencies compound these. The company's satellite and launch commercial
              channels (including international brokers such as Space BD) and its non-dilutive grants are tied to
              delivery milestones — a A$5 million federal grant, for example, is earmarked for next-generation
              liquid-engine development — so slipping schedules can jeopardise both revenue and funding. Because Gilmour
              is pre-orbit, customer commitments are largely forward-looking, meaning a further failure or delay risks
              manifest anchor-customer or backlog attrition that cannot be measured from public data today. The
              partner/dependency register ranks each counterparty exposure by severity.
