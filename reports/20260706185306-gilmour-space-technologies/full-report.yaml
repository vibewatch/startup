companyProfile:
  summary: >-
    Gilmour Space Technologies is a privately held Australian aerospace company founded in 2012 on the Gold Coast,
    Queensland, by brothers Adam Gilmour (CEO) and James Gilmour. It runs a vertically integrated 'sovereign space'
    model spanning the three-stage, hybrid-propulsion Eris orbital launch vehicle (payload ~305 kg to LEO / ~215 kg to
    SSO), the ~100 kg-class ElaraSat satellite bus, and the Bowen Orbital Spaceport — Australia's first licensed orbital
    launch site. In January 2026 it raised a A$217 million Series E co-led by the government's National Reconstruction
