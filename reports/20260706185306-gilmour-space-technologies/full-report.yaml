      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The bull thesis rests on four pillars. First, market: sovereign and defence launch demand in Australia and
              the Indo-Pacific is rising, and Gilmour is the first mover with a licensed domestic orbital spaceport at
              Bowen. Second, capital and endorsement: the January 2026 Series E drew the National Reconstruction Fund
              Corporation and Hostplus as A$75 million co-leads, plus the Future Fund, QIC and multiple super funds — a
              patient, strategically aligned base that de-risks financing. Third, diversification: ElaraSat reached
              orbit via SpaceX in June 2025, and a A$17.6 million RAAF contract plus hypersonic test work give adjacent
              revenue and orbit heritage before Eris flies. Fourth, scarcity: as a sovereign monopoly candidate, Gilmour
              could command a premium if Eris works.


              The anti-thesis is equally concrete. The product is unproven — TestFlight-1 failed, and small-launch is
              littered with well-funded failures (Astra, Virgin Orbit, ABL). The valuation embeds success that has not
              occurred; independent analysts note many highly valued space companies are pre-revenue or early-revenue
              relative to their marks. Economics are pressured by low-cost SpaceX rideshare pricing (from roughly
              US$300,000 per smallsat slot) that undercuts dedicated small launch. Capital intensity is high and burn is
              undisclosed, creating down-round risk if TestFlight-2 slips. Finally, key-person concentration in the two
              founding brothers compounds execution risk. Each of these has an explicit "what would change the view"
              trigger.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
