      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, SOM and Multiple Lenses'
        blocks:
          - type: paragraph
            body: >
              No single number captures Gilmour's market, so multiple analyst lenses are preserved rather than blended.
              The broadest relevant demand pool is the small-satellite market, which MarketsandMarkets sizes at about
              US$9.35 billion in 2025 growing to roughly US$32.13 billion by 2030 at a 28% CAGR — a proxy for how many
              satellites will need rides. The market Gilmour actually sells launch capacity into is the dedicated
              small-launch-vehicle market, an order of magnitude smaller at roughly US$1.8 billion (GM Insights) to
              US$2.22 billion (Fortune Business Insights) in 2025, reaching approximately US$3.2-4.6 billion by
              2030-2034. The wider global launch-services market sits around US$10-27 billion in 2025 depending on
              scope, projected toward US$70-82 billion by 2032-2035.


              Framing this as TAM/SAM/SOM: TAM is the global small-satellite-plus-launch opportunity nested within a
              ~US$626 billion space economy; SAM is Asia-Pacific and Australian sovereign small-launch demand, with
              Asia-Pacific alone representing roughly US$1.04 billion of small-launch value in 2025 (46.8% of the global
              total) and the fastest regional growth; SOM is Gilmour's realistic near-term capture of Australian and
              allied sovereign launches, which cannot yet be precisely isolated from public data. The estimate range is
              wide and methodology-dependent, and analysts openly disagree — smallsat CAGR estimates span 16.4% (Allied
              Market Research) to 28% (MarketsandMarkets) — so the sizing is presented as a band, not a point.
            claimRefs:
