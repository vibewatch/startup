  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Streams, and Monetization
        blocks:
          - type: paragraph
            body: >
              Gilmour Space is pre-revenue on its flagship business — orbital launch — and does not publish audited
              financial statements, so its revenue model must be reconstructed from disclosed contracts, product
              milestones and investor commentary. Today the company monetizes four adjacent activities rather than
              recurring launch. First, its ElaraSat satellite bus line reached orbit in June 2025 when MMS-1 was
              deployed via a SpaceX Transporter-14 rideshare carrying a CSIRO hyperspectral payload, establishing a
              satellite-and-hosted-payload revenue path. Second, defence launch-engineering and R&D is a disclosed,
              milestone-based line anchored by a A$17.6 million Royal Australian Air Force contract. Third, the company
              has begun nascent hypersonic test-rocket work for defence and research customers. Fourth, non-dilutive
              government grants — a A$52 million Australian Space Manufacturing Network grant (2023) and a A$5 million
              Industry Growth Program grant (2025) — provide funding, though these are subsidies rather than commercial
              revenue.


              The intended future model is Eris orbital launch revenue: a per-launch, per-kilogram launch service
              targeting pricing competitive with small-launch peers once the ~305 kg-to-LEO vehicle is qualified. No
              launch revenue exists yet — Eris TestFlight-1 (July 2025) failed roughly nine-to-fourteen seconds into
              flight. Gilmour publishes no public price list, so pricing is bespoke and contract-based, and SpaceX
              rideshare slots at roughly US$300k–500k per smallsat form a cheap substitute that pressures dedicated
              small-launch pricing. Public comparator Rocket Lab shows the shape of a mature model: US$601.8 million of
              2025 revenue, of which Space Systems (not launch) was 66.9%.
