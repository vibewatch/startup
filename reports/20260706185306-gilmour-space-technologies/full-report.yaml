      - number: '7.3'
        title: Operational, Quality, and Reliability Risk
        blocks:
          - type: paragraph
            body: >
              The TestFlight-1 failure is a direct read on operational and quality risk. Two of four first-stage hybrid
              motors lost thrust because of electrical and thermal faults in the oxidiser-pump subsystem, and the
              company has said design, qualification and process improvements are being evaluated and implemented in
              response — an admission that its qualification regime did not catch the fault before flight. Earlier in
              the campaign a wet dress rehearsal surfaced faulty valves and software reconfigurations, and a May 2025
              power surge triggered premature fairing deployment, illustrating how many independent subsystems must work
              for a single launch. Ground testing, by the company's own account, cannot fully replicate flight
              conditions, so reliability can only be proven by flying — and each flight is expensive and slow to stage.


              Facility and environmental-operations risk concentrate at the single Bowen Orbital Spaceport in remote
              North Queensland. Launches have repeatedly scrubbed on upper-level winds and weather, and the region's
              cyclone season adds seasonal exposure to a company with no launch redundancy. Manufacturing and
              supply-chain quality are also unproven at rate: Eris has flown once, so build consistency, workmanship and
              inspection processes across a 500-plus supplier base remain untested at cadence. Security, cyber and
              safety-incident posture are not publicly documented and are treated as diligence items. The operational
              register ranks these failure modes by residual severity.
