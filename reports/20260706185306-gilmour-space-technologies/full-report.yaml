            body: >
              The defining financial characteristic of Gilmour for an underwriter is the breadth of undisclosed private
              data. Revenue and revenue mix, burn rate, cash runway, gross margin, signed launch backlog, per-launch
              unit economics and the full cap table are all unavailable from public sources. Each is a specific
              diligence blocker with a defined path: management accounts and the Series E data room for revenue and
              burn; a bottoms-up cost model for gross margin and per-launch economics; customer contracts for backlog;
              and the shareholders' agreement for the cap table. Public traction is genuine but thin — one satellite in
              orbit and zero successful orbital launches after TestFlight-1's failure.


              The verdict is that revenue quality is early and project-based rather than recurring; the margin path is
              unproven and, on the Rocket Lab comparator, likely negative for years; capital intensity is high; and the
              company carries a greater-than-A$1 billion valuation while pre-launch-revenue with undisclosed burn and
              runway — a material valuation-versus-fundamentals risk. Sector history (the failures of Astra and Virgin
              Orbit) shows small-launch unit economics are unproven industry-wide. The investment case is therefore a
              forward, milestone-driven one contingent on a successful Eris orbital flight; the financial inputs needed
              to underwrite it are, at present, largely insufficient and must be obtained under NDA.
