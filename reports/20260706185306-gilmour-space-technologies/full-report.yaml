      - number: '5.3'
        title: Maturity, Deployment, and Roadmap
        blocks:
          - type: paragraph
            body: >
              Maturity is bifurcated. ElaraSat is deployed and operational, giving Gilmour genuine orbital heritage as a
              satellite operator via SpaceX rideshare. Eris, the flagship, is still in qualification. Its maiden flight,
              TestFlight-1, lifted off from Bowen on 30 July 2025 — the first Australian-made orbital-class rocket to
              launch from Australian soil — but the flight lasted only about 14 seconds. The vehicle cleared the tower,
              drifted from the pad, and fell back within the designated safety area without reaching orbit. An earlier
              attempt in May 2025 had been scrubbed after an unplanned payload-fairing deployment blamed on a power
              surge, and the campaign endured roughly 18 months of approval delays plus weather and technical scrubs.


              The company's investigation, concluded on 24 April 2026, found that about nine seconds after ignition one
              of the four first-stage hybrid motors lost thrust, with a second motor following near 17 seconds, tracing
              two independent failure modes to the oxidiser-pump subsystem — electrical and thermal faults in the
              electric pump motors and inverters, including externally sourced components. A final report was submitted
              to the Australian Space Agency. Gilmour says the next Eris vehicle is already in production with design,
              qualification, and process improvements, and it targets TestFlight-2 for late 2026 (Q4), following a first
              hypersonics flight test in the first half of 2026. The roadmap table and maturity map below lay out these
              stages.
