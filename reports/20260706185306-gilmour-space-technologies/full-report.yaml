      - number: '7.5'
        title: Financial, Model, and Competitive Risk
        blocks:
          - type: paragraph
            body: >
              Gilmour crossed a A$1 billion valuation in January 2026 — becoming Australia's first space unicorn on a
              A$217 million Series E — before demonstrating a single successful orbital launch, so the price embeds
              forward expectations that a repeat failure would sharply re-rate. Rocketry is capital-intensive and the
              company itself frames orbit as typically taking around three attempts, implying multiple further funded
              launch campaigns. Burn rate, cash runway and gross margin are not disclosed, and management has
              acknowledged "going hunting for more money," including a A$14.2 million follow-on in May 2026 and reliance
              on the National Reconstruction Fund. Dependence on government capital and grants introduces policy and
              milestone risk that a purely commercial financier would not carry.


              Competitive and model risk sit alongside the balance-sheet risk. Rocket Lab is an established,
              revenue-generating small-launch operator; Australia's Southern Launch is an NRFC-backed domestic rival;
              and SpaceX's Transporter rideshare — at roughly US$300,000–500,000 per smallsat slot — is a cheap
              substitute that pressures dedicated small-launch pricing. Most soberingly, the small-launch "graveyard" of
              Astra, Virgin Orbit and ABL Space, plus the failed maiden flight of Germany's Isar Aerospace, shows that
              even better-funded new entrants routinely fail or pivot. Gilmour's model — build the rocket, satellite and
              spaceport in-house — spreads capital across three unproven bets, so margin, unit-economics and pricing
              power remain speculative. The financial and competitive exposures feed the risk-transmission map.
            claimRefs:
