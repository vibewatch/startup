      - number: '3.2'
        title: 'Competitor Profiles: Scale, Funding, and Direction'
        blocks:
          - type: paragraph
            body: >
              Rocket Lab is the reference incumbent. Its Electron has completed 91 launches and deployed 262-plus
              satellites, and the company has diversified far beyond launch: it reported record first-quarter 2026
              revenue of US$200.3 million (up 63.5% year on year), a US$2.2 billion backlog, and is developing the
              medium-lift Neutron (13,000 kg to LEO) for a first flight targeted in the fourth quarter of 2026. Firefly
              Aerospace is a better-capitalised peer in the class above Gilmour: its Alpha lifts up to 1,030 kilograms
              to LEO, and it completed an IPO in August 2025 (reported at roughly US$868 million raised near a US$6.3
              billion valuation), giving it public-market access Gilmour lacks.


              Isar Aerospace is Gilmour's closest structural analogue — a national-champion small launcher that suffered
              a maiden-flight failure. Its Spectrum (up to 1,000 kg to LEO) failed about 30 seconds after liftoff in
              March 2025, yet Isar has since raised a €270 million Series D (June 2026) taking total funding to roughly
              €800 million, earlier secured a ~€150 million (US$174 million) convertible bond, and is building a Munich
              factory targeting up to 40 vehicles a year. Behind them sit pre-orbital entrants (RFA, HyImpulse) and
              casualties (Orbex entered administration in February 2026). Gilmour's own scale card is its A$217 million
              Series E and unicorn status, giving it capital depth relative to smaller European peers even as it trails
              on demonstrated flight.
