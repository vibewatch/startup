  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundaries, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Gilmour Space does not sell into a single market; its vertically integrated model spans four connected
              spend pools that must be bounded before they can be sized. The first is dedicated small-launch services —
              orbital delivery of payloads below roughly one tonne, the segment the Eris rocket (~305 kg to LEO)
              directly addresses. The second is small-satellite manufacturing and buses, the layer the ElaraSat
              100-kilogram-class platform serves. The third is launch-site and spaceport operations, monetised through
              the Bowen Orbital Spaceport. The fourth, and the strategic anchor, is sovereign national-security space
              access: assured domestic launch that reduces reliance on foreign providers.


              Explicitly excluded from Gilmour's core boundary are medium and heavy launch, GEO communications
              satellites, deep-space and human spaceflight, and generic ground-equipment spend. The most important
              status-quo substitutes are rideshare aggregation (SpaceX's Transporter program and brokers such as
              Exolaunch) and foreign dedicated small launch (notably Rocket Lab's Electron). These substitutes matter
              because a sovereign buyer can, absent a mandate, simply buy a cheap rideshare slot abroad. Adjacent
              pull-through demand — LEO broadband, Earth-observation analytics and defence constellations — expands the
              opportunity but is not revenue Gilmour captures directly. Defining the boundary this way keeps the sizing
              honest: the launch market Gilmour actually sells into is far narrower than the headline smallsat or
              space-economy numbers.
            claimRefs:
              - CM031
              - CM032
              - CM033
              - CM034
              - CM037
