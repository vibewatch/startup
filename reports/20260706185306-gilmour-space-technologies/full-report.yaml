      - number: '7.2'
        title: Regulatory, Legal, and Licensing Risk
        blocks:
          - type: paragraph
            body: >
              Gilmour operates in one of the world's most tightly regulated activities, and Australian orbital-launch
              regulation is itself immature. Launch and return activity is governed by the Space (Launches and Returns)
              Act 2018 and administered by the Australian Space Agency through the Office of the Space Regulator;
              Gilmour required a first-of-its-kind orbital launch permit, which the Agency took roughly two years to
              grant and issued only in November 2024 on safety grounds. On top of the launch permit the company has
              described needing some 24 separate Queensland permits plus environmental and airspace approvals, the
              latter engaging the Civil Aviation Safety Authority. Each approval is a gating dependency: a licence
              suspension, a failed re-qualification after the TestFlight-1 anomaly, or new environmental conditions at
              the Bowen site could halt launches outright.


              Regulatory delay has already produced concrete financial harm. CEO Adam Gilmour publicly linked the
              drawn-out licensing process to a slower capital raise, saying the delay in approvals was delaying his next
              raise with flow-on effects to jobs and supply chain. Because the final TestFlight-1 investigation report
              was submitted to the Australian Space Agency and the Office of the Space Regulator, the timing and
              conditions of any return-to-flight clearance sit with the regulator rather than the company. Litigation,
              IP and export-control exposure cannot be confirmed from public sources and are logged as diligence paths
              rather than cleared. The regulatory/legal register below ranks these exposures by severity.
            claimRefs:
