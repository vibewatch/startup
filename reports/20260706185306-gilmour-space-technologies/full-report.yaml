              100-kilogram-class bus hosts payloads up to 30 kilograms and is pitched to customers who would otherwise
              build their own bus. The fourth is international customers reached indirectly through the Space BD channel
              across the Asia-Pacific.

              Gilmour also launched a "Hyperflight" hypersonic test service targeting Defence agencies and scientists at
              speeds above Mach 5, adding an adjacent test-services customer line. Segmentation is therefore split
              between paying, proven relationships (CSIRO, the RAAF) and a large prospective pipeline (defence and
              government programs, Space Machines Company, Fleet, Skykraft, Inovor, and Asia-Pacific smallsat operators)
