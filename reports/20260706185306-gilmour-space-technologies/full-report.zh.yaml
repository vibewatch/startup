companyProfile:
  summary: >-
    Gilmour Space Technologies 是一家私人持有的澳大利亚航天公司，2012 年由 Adam Gilmour（CEO）和 James Gilmour
    兄弟在昆士兰州黄金海岸创立。公司走垂直整合的「主权太空」路线，覆盖三条线：三阶段、混合推进的 Eris 轨道运载火箭（有效载荷约 305 kg 至 LEO / 约 215 kg 至 SSO）、约 100 kg 级 ElaraSat
    卫星平台，以及 Bowen Orbital Spaceport——澳大利亚首个获许可的轨道发射场。2026 年 1 月，公司完成 A$217 million Series E，由政府的 National Reconstruction
    Fund Corporation 和行业养老基金 Hostplus 共同领投，估值突破 A$1 billion，成为澳大利亚首个太空独角兽。公司首颗卫星（ElaraSat MMS-1，搭载 CSIRO 载荷）于 2025 年 6
    月借 SpaceX 入轨，但自有 Eris TestFlight-1（2025 年 7 月 30 日）在起飞约 9–14 秒后因一级氧化剂泵故障失败；调查于 2026 年 4 月结束，第二次尝试目标为 2026 年末。Gilmour
    的轨道发射仍未产生收入，目前收入来自卫星、防务工程（A$17.6M RAAF 合同）、高超音速测试工作和政府补助。
