  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Gilmour 交付什么：发射、卫星与航天港
        blocks:
          - type: paragraph
            body: >
              从客户工作流看，Gilmour Space 卖的是主权低地球轨道准入。原本需要排队等外国拼车的卫星运营商或政府载荷所有者，可以改走 Gilmour
              端到端漏斗：任务咨询、轨道与载荷审查、集成，以及从澳大利亚本土发起的专用或拼车发射活动。公司把这包装成三条相连产品线：Eris 轨道运载火箭、ElaraSat 卫星平台和 Bowen Orbital
              Spaceport，并一起营销为「运载火箭 + 卫星平台 + 获许可航天港 = 简化任务规划」。


              Eris Block 1 是一枚三阶段小卫星火箭，高约 23–25 米，一级直径约 2 米，发射质量约 30–33 吨，整流罩直径约 1.5 米。设计能力是将约 305 kg 送入低地球轨道，或将约 215 kg
              送入 500 km 太阳同步轨道。ElaraSat 平台是一款模块化、约 100 kg 级卫星平台，可承载最高 30 kg 客户载荷，并兼容包括 Eris 在内的多种运载器。ElaraSat
              是最成熟资产：MMS-1 搭载 CSIRO 高光谱成像仪，自 2025 年 6 月通过 SpaceX Transporter-14 部署后一直在轨运行，并验证了平台系统以及 S-band 和 X-band
              通信。Bowen 于 2024 年 3 月获许可，是澳大利亚首个轨道发射设施。下方模块矩阵和工作流表覆盖这一产品组合。
