      - number: '7.3'
        title: 运营、质量与可靠性风险
        blocks:
          - type: paragraph
            body: >
              TestFlight-1
              失败直接揭示运营和质量风险。四台一级混合发动机中有两台因氧化剂泵子系统的电气和热故障失去推力；公司称正在评估并落实设计、验证和流程改进作为回应——这等于承认既有验证体系未能在飞行前抓住故障。发射战役早些时候，湿彩排暴露了阀门故障和软件重新配置问题；2025
              年 5 月一次电涌触发整流罩提前展开，说明一次发射需要许多独立子系统同时跑通。按公司自己的说法，地面测试无法完全复现飞行条件，因此可靠性只能靠飞行证明——而每次飞行都昂贵，组织周期也慢。


              设施和环境运营风险集中在 North Queensland 偏远地区的单一 Bowen Orbital
              Spaceport。高空风和天气已多次取消发射，当地气旋季又给一家没有发射冗余的公司增加季节性暴露。制造和供应链质量在节奏化生产下也未证明：Eris 只飞过一次，因此 500
              多家供应商体系下的建造一致性、工艺和检验流程还没有在发射节奏中受检验。安保、网络和安全事故态势没有公开文件，被视为尽调事项。运营台账按剩余严重性排列这些失效模式。
