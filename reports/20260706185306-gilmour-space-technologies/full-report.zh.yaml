      - number: '3.4'
        title: 护城河耐久性、转换成本与负面信号
        blocks:
          - type: paragraph
            body: >
              Gilmour 的核心护城河是主权：一套澳大利亚国内拥有、端到端的发射堆栈，并由政府资本背书，包括 National Reconstruction Fund Corporation A$75 million
              承诺。对看重有保障、非外国准入的澳大利亚及盟国政府载荷而言，这条护城河真实存在；但它很窄、依赖政策，也无法为价格敏感商业客户弥合能力或履历差距。发射的转换成本只是中等——载荷集成、分配器兼容和许可会造成摩擦——买家也会常态化多家供应商并用，因此没有单一发射商能形成强锁定。Rocket
              Lab 更深的护城河来自向卫星和组件的垂直整合（支持 1,700 多次任务），Gilmour 通过 ElaraSat 部分复刻，但规模小得多。


              负面信号很实质。最大的替代风险来自下方商品化：SpaceX 拼车的成本优势和 Falcon 9 发射节奏可以吸收专用小型发射低端需求，Rocket Lab 的主导地位（US$2.2 billion 积压订单，仅
              2026 年第一季度就签下 36 份合同）又让落后者几乎没有生存空间。小型发射「墓地」本身就是耐久性警告——Astra 在 2021 年 SPAC 高峰后以约 US$10–12 million
              私有化，Virgin Orbit 破产，ABL 募集约 US$461 million 后转向导弹，Relativity 募集逾 US$1.3 billion 后取消
              Terran-1。即使名义上的成功者也受可靠性困扰：Firefly Alpha 六次飞行出现四次异常。Gilmour 花了约 13 年才走到失败首飞，比 Isar（约 7 年）或 Electron
              的活跃开发期（约 4 年）更久，使 TestFlight-2 成为生死证明点，而非常规里程碑。
