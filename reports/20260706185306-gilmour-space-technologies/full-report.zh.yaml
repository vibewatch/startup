              若干指标未公开，本报告将其视为缺口。Gilmour
              不披露收入、烧钱速度、现金跑道或毛利率；作为轨道发射前公司，其收入处于早期，来自卫星、防务服务和补助，而非经常性发射收入。当前准确员工数、创始人与投资人股权拆分、完整 Series E
              股权结构、精确累计融资额，要么各来源不同，要么未披露。本报告用明确尽调路径标注，而非估算。


              最关键的不确定性在技术端：公司的核心资产——可靠的 Eris 轨道火箭——尚未被证明。因此，估值很大程度上压在未来预期上。本概览把已核实事实（轮次、投资人、日期、TestFlight-1
              结果）与公司主张和未披露私人指标分开，便于后续章节复用同一套事实底座。
