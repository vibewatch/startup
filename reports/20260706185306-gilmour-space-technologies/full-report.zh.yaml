        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >
              Gilmour Space 服务四类可区分买方，但只有一部分已有交付证据支撑。第一类也是战略上最重要的一类，是政府和国防：公司把 Eris 与 Bowen Orbital Spaceport
              定位为澳大利亚主权发射能力，National Reconstruction Fund Corporation 则称 Gilmour 为商业、政府和国防客户提供「进入太空的通道」。第二类是科研和民用科学，代表是
              CSIRO，其高光谱成像仪搭载在 ElaraSat 平台上。第三类是商业小卫星运营商——ElaraSat 模块化 100 公斤级平台可承载最高 30
              公斤载荷，卖点是让原本需要自建卫星平台的客户直接托管载荷。第四类是通过 Space BD 渠道间接触达的亚太国际客户。

              Gilmour 还推出面向国防机构和科学家的「Hyperflight」高超声速测试服务，速度超过 Mach
              5，为客户线增加相邻测试服务。因此，客户分层一边是已经付费、已有证明的关系（CSIRO、RAAF），另一边是庞大的潜在管线（国防和政府项目、Space Machines
              Company、Fleet、Skykraft、Inovor，以及亚太小卫星运营商）；后者只有在 Eris 入轨后才会转化。
