            title: 拼车从低端商品化
            body: >-
              SpaceX Transporter 拼车（约 US$6,000/kg；50 kg 收费 US$350k）按每公斤比所有专用小型发射商便宜约 10–20 倍。除非 Gilmour
              能守住轨道精度和主权溢价，否则可服务的价格敏感需求会结构性暴露在替代风险下。
            calloutType: risk
            claimRefs:
              - CP035
              - CP018
          - type: callout
            title: 小型发射「墓地」是耐久性警告
            body: >-
              Astra（以约 US$10–12M 私有化）、Virgin Orbit（破产）、ABL（募资约 US$461M 后转向导弹）以及 Relativity 取消
              Terran-1，说明大量拿到资金的小型发射商仍会失败。Gilmour 走了约 13 年才迎来失败首飞，使 TestFlight-2 成为生死证明点。
            calloutType: insight
            claimRefs:
              - CP024
              - CP023
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、收入流与变现
        blocks:
          - type: paragraph
            body: >
              Gilmour Space
              的旗舰业务——轨道发射——尚未产生收入，公司也不发布经审计财务报表，因此收入模式只能从已披露合同、产品里程碑和投资人评论中重建。目前公司变现的是四类相邻活动，而非经常性发射。第一，ElaraSat 卫星平台线在
              2025 年 6 月到达轨道：MMS-1 通过 SpaceX Transporter-14 拼车部署，搭载 CSIRO
              高光谱载荷，建立了卫星与托管载荷收入路径。第二，防务发射工程和研发是一条已披露、按里程碑推进的业务线，由 A$17.6 million Royal Australian Air Force
              合同锚定。第三，公司已开始为防务和科研客户做早期高超音速测试火箭工作。第四，非稀释性政府补助——A$52 million Australian Space Manufacturing Network
              补助（2023 年）和 A$5 million Industry Growth Program 补助（2025 年）——提供资金，但这些是补贴，不是商业收入。


              未来目标模式是 Eris 轨道发射收入：在约 305 kg 至 LEO 运载器完成验证后，按次发射、按公斤提供发射服务，定价对标小型发射同业。发射收入目前为零——Eris TestFlight-1（2025 年
              7 月）在起飞约 9–14 秒后失败。Gilmour 不公开价格表，因此定价为定制、合同制；SpaceX 拼车每颗小卫星约 US$300k–500k，是便宜替代，对专用小型发射定价形成压力。公开可比公司
              Rocket Lab 展示了成熟模式的形态：2025 年收入 US$601.8 million，其中 Space Systems（而非发射）占 66.9%。
