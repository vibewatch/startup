      - number: '3.2'
        title: 竞争者画像：规模、融资与方向
        blocks:
          - type: paragraph
            body: >
              Rocket Lab 是参照系中的在位者。Electron 已完成 91 次发射、部署 262 颗以上卫星，公司也早已走出发射单一业务：2026 年第一季度收入创纪录达 US$200.3 million（同比增长
              63.5%），积压订单 US$2.2 billion，并在开发中型运载 Neutron（13,000 kg 至 LEO），目标 2026 年第四季度首飞。Firefly Aerospace 是 Gilmour
              这一级之上的资金更充足同业：Alpha 可向 LEO 运送最高 1,030 kg，2025 年 8 月完成 IPO（据报募资约 US$868 million，估值接近 US$6.3 billion），因此拥有
              Gilmour 没有的公开市场融资通道。


              Isar Aerospace 是 Gilmour 最接近的结构类比——一个国家冠军型小型发射商，也经历首飞失败。Spectrum（最高 1,000 kg 至 LEO）在 2025 年 3 月起飞约 30
              秒后失败，但 Isar 之后完成 €270 million Series D（2026 年 6 月），累计融资约 €800 million；此前还拿到约 €150 million（US$174
              million）可转债，并在慕尼黑建设工厂，目标年产最高 40 枚火箭。它们后面是尚未入轨的进入者（RFA、HyImpulse）和失败者（Orbex 于 2026 年 2 月进入破产管理）。Gilmour
              自身牌面是 A$217 million Series E 和独角兽身份，相比更小的欧洲同业资金更厚，但已展示飞行履历仍落后。
