      - number: '3.3'
        title: 能力、定价与分销对比
        blocks:
          - type: paragraph
            body: >
              从纯能力看，Gilmour 的 Eris（约 305 kg 至 LEO、约 215 kg 至 SSO）与 Rocket Lab Electron（约 300 kg）相近，但远低于 Firefly
              Alpha（1,030 kg）和 Isar Spectrum（1,000 kg）。Eris 的差异化在架构：它采用自研混合推进（固体燃料加液体氧化剂），而不是竞争对手已飞行的液体发动机；Gilmour
              认为这种设计更安全、更便宜，但尚未在入轨任务中验证。如果成功，它将成为全球首枚入轨的混合火箭。决定性差距是飞行履历：Rocket Lab 已有 91 次成功发射，大约每两到三周发射一次；Gilmour 在
              2025 年 7 月 30 日 TestFlight-1 起飞约 14 秒后失去推力，目前轨道成功次数为零。


              价格方面，公开数字集中在 Electron 专用发射约 US$7.5 million、Firefly Alpha 约 US$12–15 million，Isar 目标约 €10,000 / kg；Gilmour
              尚未发布明确单次发射价格。所有专用供应商在每公斤价格上都被 SpaceX 拼车压低，只能改在轨道精度、时程控制和主权属性上竞争。发射分销力来自发射场所有权和靶场准入——Gilmour 拥有 Bowen
              Orbital Spaceport，Isar 从挪威 Andøya 发射，Rocket Lab 在新西兰和 Virginia 运营发射台。信任和监管姿态越来越偏向有国家安全锚点的在位者：Rocket Lab 手握
              US$1.3 billion Space Development Agency 工作以及 Golden Dome 入选资格，这是尚未入轨的 Gilmour 目前无法匹配的。
