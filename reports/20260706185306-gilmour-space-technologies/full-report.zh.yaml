      - CV026
      - CV027
      - CV029
  - id: FV004
    title: 投资 KPI（IC 评分卡）
    type: kpi
    summary: 面向 IC 的评分，覆盖市场、验证、护城河、经济性、风险、估值支撑和证据质量。
    data:
      items:
        - label: 市场吸引力
          value: High
          unit: score
          trend: up
          detail: 主权 / 国防发射需求；澳大利亚先发者
        - label: 技术验证
          value: Low
          unit: score
          trend: down
          detail: 0 次成功轨道发射；TestFlight-1 失败
        - label: 护城河 / 稀缺性
          value: High
          unit: score
          trend: up
          detail: 主权垄断候选者；已获许可的 Bowen 发射场
        - label: 经济性 / 财务
          value: Unproven
          unit: score
          trend: neutral
          detail: 收入、烧钱速度、现金跑道未披露；尚未有发射收入
        - label: 风险
          value: High
          unit: score
          trend: down
          detail: 技术结果二元、资本密集、关键人集中
        - label: 估值支撑
          value: Weak/Moderate
          unit: score
          trend: neutral
          detail: 基本面看偏贵；主权溢价提供支撑
        - label: 证据质量
          value: Mixed
          unit: score
          trend: neutral
          detail: 融资信息扎实；经营指标薄
    claimRefs:
      - CV004
      - CV037
      - CV041
      - CV042
