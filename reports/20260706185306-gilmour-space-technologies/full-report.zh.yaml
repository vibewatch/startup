      - number: '2.2'
        title: 市场规模：TAM、SAM、SOM 与多重视角
        blocks:
          - type: paragraph
            body: >
              没有一个单一数字能概括 Gilmour 的市场，因此本报告保留多个分析口径，而不是揉成一个数。最宽的需求池是小卫星市场，MarketsandMarkets 估算 2025 年约 US$9.35 billion，到
              2030 年增至约 US$32.13 billion，CAGR 28%——它用来近似衡量未来需要发射的卫星数量。Gilmour 真正向其销售发射能力的是专用小型运载火箭市场，规模小一个数量级：2025 年约
              US$1.8 billion（GM Insights）至 US$2.22 billion（Fortune Business Insights），到 2030–2034 年约 US$3.2–4.6
              billion。更宽的全球发射服务市场在 2025 年约 US$10–27 billion，取决于口径，预计 2032–2035 年走向 US$70–82 billion。


              按 TAM/SAM/SOM 看：TAM 是嵌在约 US$626 billion 太空经济中的全球小卫星加发射机会；SAM 是亚太和澳大利亚主权小型发射需求，其中仅亚太 2025 年就代表约 US$1.04
              billion 小型发射价值（占全球 46.8%），且区域增速最快；SOM 是 Gilmour
              近期可现实捕获的澳大利亚及盟国主权发射，公开数据尚无法精确剥离。估算区间很宽，取决于方法，分析机构也公开分歧——小卫星 CAGR 估计从 16.4%（Allied Market Research）到
              28%（MarketsandMarkets）不等——因此规模以区间呈现，而非单点。
