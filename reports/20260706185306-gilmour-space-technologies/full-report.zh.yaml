      - number: '2.3'
        title: 买方分层、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              Gilmour 技术栈的需求集中在少数清晰买方群体，其中多数预算由政府掌握，而非商业资本。政府和防务是小型发射最大且增长最快的买方——Fortune Business Insights 估计，2026
              年政府部门约占小型发射市场 44.6%——采购由联邦防务预算支持的主权 ISR、PNT 和韧性通信能力。民用政府和太空机构（Australian Space
              Agency、CSIRO）通过补助和项目购买地球观测与科学任务。商业星座运营商用运营商 capex 和风投资金购买发射与平台，部署并补充 LEO 星座。科研和高校买家用补助预算采购载荷搭载和技术验证。


              采用路径很长，由采购驱动。防务或机构买方从主权能力任务出发，经过运载火箭和发射场验证，最终进入按里程碑付款的合同；商业运营商在承诺多次发射的星座计划前，会先验证卫星平台和发射服务。付款方（政府项目办公室或运营商采购团队）通常不同于最终用户（运营商、分析员、作战人员），因此采用取决于机构信任和已展示的飞行履历——这正是轨道发射前供应商仍需赢得的东西。2023
              年与美国签署的 Technology Safeguards Agreement 允许从澳大利亚航天港发射，也打开了盟国买家渠道。
            claimRefs:
