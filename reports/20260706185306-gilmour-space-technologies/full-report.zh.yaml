      - number: '8.6'
        title: 退出准备、尽调问题与投资 KPI
        blocks:
          - type: paragraph
            body: >
              退出准备仍早。Gilmour 是私有且尚未 IPO；公开上市或战略收购只有在 Eris 被证明之后才可信，最显眼的退出模板是 Rocket Lab
              在公开市场的重估。因此，约束性尽调问题集中在公开证据无法解决的未知数：完整 Series E 后股权结构表、清算优先权以及任何棘轮或反稀释条款；覆盖收入、烧钱速度和现金续航期的审计或管理口径财务，用以支撑
              TestFlight-2 及之后；TestFlight-1 调查后的技术整改包和独立就绪验证；有金额和里程碑的国防及主权订单储备合同；以及关键人安排和继任。


              投资 KPI 面板按投委会权衡的维度给机会打分：市场吸引力（高，主权驱动）、技术证明（低，尚未入轨）、护城河和稀缺性（主权定位上高）、单位经济性和财务（未证明 /
              未披露）、风险（高）、估值支撑（基本面弱、战略上中等）以及证据质量（混合——融资证据强，运营指标薄）。综合判断是高潜力但低证明、定价偏贵的机会——这正是需要 WATCH 的画像：保持接近、定义触发器，等
              TestFlight-2 解开核心不确定性后再行动。
