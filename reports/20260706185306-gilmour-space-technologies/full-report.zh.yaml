      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >
              Gilmour Space 自 2017 年以来至少完成五轮定价风险融资，背后资本逐步变大、变机构化。早期由风险资本领投：2017 年约 A$5 million Series A（Blackbird
              Ventures，美国加速器 500 Startups 也是早期支持者）和 2018 年约 US$19 million Series B，由 CSIRO 关联深科技基金 Main Sequence
              Ventures 领投。


              Series C 于 2021 年 6 月完成，金额 A$61 million，是当时澳大利亚太空公司最大的一笔私人融资；由 Fidelity Investments 关联方 Fine Structure
              Ventures 领投，Blackbird、Main Sequence 及养老基金 HESTA、Hostplus、NGS Super 跟投。2024 年 2 月，公司完成 A$55 million Series
              D，由 Queensland Investment Corporation (QIC) 领投，Blackbird、Main Sequence、Hostplus 和 HESTA 参与，后续又披露 A$14.2
              million 追加融资。


              标志性事件是 2026 年 1 月的 Series E：A$217 million，由澳大利亚政府的 National Reconstruction Fund Corporation (NRFC) 和行业养老基金
              Hostplus 共同领投，双方各投 A$75 million，Future Fund、Blackbird、Funds SA、HESTA、NGS Super、Main Sequence、QIC 和
              Brighter Super 参与。该轮把 Gilmour 估值推至 A$1 billion 以上，使其成为澳大利亚首个「太空独角兽」；部分报道显示，此轮后续在更多养老基金参与下扩至约 A$231
              million。股权融资之外，Gilmour 还拿到非稀释性政府支持，包括与该轮挂钩的 A$75 million NRFC 承诺、A$52 million 联邦 Australian Space
              Manufacturing Network 补助（2023 年）和 A$5 million Industry Growth Program 补助。
