      - number: '4.2'
        title: 单位经济、成本结构与利润率路径
        blocks:
          - type: paragraph
            body: >
              Gilmour 的单位经济从公开数据几乎无法衡量，本报告将其处理为一组带明确尽调问题的空值，而非估算。毛利率、单次发射成本、每个 ElaraSat
              贡献毛利、获客成本、销售周期长度，以及达到盈亏平衡所需的发射节奏，都未披露。当前收入来自项目和政府合同，销售周期长且由采购驱动，CAC 或回本周期等传统效率指标尚无法计算；把 SaaS
              或平台型业务指标硬套到硬件发射业务上会误导。


              能观察到的是成本架构，资本开支极重。轨道发射需要火箭制造、推进测试基础设施和专用发射场（Bowen Orbital Spaceport）；A$52 million ASMN 补助明确投向制造和航天港设施，显示
              capex 规模。公司由 500 多家澳大利亚供应商和 200 多名员工支撑自有制造，意味着发射收入到来前就已有实质固定成本和营运资本需求。公开可比公司对利润率路径很有提示：成熟得多的 Rocket Lab
              2025 年仍录得约 US$198 million 净亏损，说明小型发射要跑出正向单位经济，靠的是高频次和多元化太空系统组合，而不只是发射价格。
