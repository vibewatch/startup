chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与公司结构
        blocks:
          - type: paragraph
            body: >
              Gilmour Space Technologies 是一家澳大利亚私人航天公司，总部位于昆士兰州黄金海岸的 Southport；火箭制造、卫星生产和专用发射场（Bowen Orbital
              Spaceport）都在昆士兰。公司由 Adam Gilmour（CEO）和 James Gilmour 兄弟于 2012 年创立，最初做太空飞行模拟器和教育硬件，2015 年左右转向火箭推进研究，2016
              年完成首次混合推进剂火箭试飞。


              公司采用垂直整合的「主权太空」模式，三条产品线彼此咬合：Eris 轨道运载火箭，一枚采用自研混合推进的三阶段小卫星火箭；ElaraSat 模块化卫星平台，一个 100 kg 级平台，可承载最高 30 kg
              客户载荷；以及 Bowen Orbital
              Spaceport，澳大利亚首个获许可的轨道发射设施。端到端堆栈——造火箭、造卫星、掌握发射场——意在给澳大利亚及盟国政府、防务和商业客户一条国内可控的低地球轨道路径，而不是依赖外国发射商。


              Gilmour 的核心价值主张是澳大利亚主权发射能力。截至 2026 年中，公司轨道发射仍无收入：2025 年 7 月 Eris TestFlight-1
              是第一枚在澳大利亚本土设计、制造并发射的轨道级火箭，但未入轨。目前收入来自邻近业务——通过 SpaceX 拼车部署的卫星平台、防务发射工程和高超音速测试服务、政府补助——旗舰轨道发射业务仍在验证中。
