      - number: '7.5'
        title: 财务、模型与竞争风险
        blocks:
          - type: paragraph
            body: >
              Gilmour 2026 年 1 月凭 A$217M Series E 跨过 A$1B
              估值——成为澳大利亚首家太空独角兽——但此前没有完成一次成功轨道发射，因此价格嵌入了前瞻预期；若再次失败，估值会被大幅重定。火箭业务资本密集，公司自己也把入轨描述为通常需要约三次尝试，这意味着还要为多轮发射战役继续融资。烧钱速度、现金续航期和毛利率未披露；管理层承认还在「继续找钱」，包括
              2026 年 5 月 A$14.2M 跟投，并依赖 National Reconstruction Fund。依赖政府资本和补助，会引入纯商业融资方不承担的政策和里程碑风险。


              竞争和商业模式风险与资产负债表风险并行。Rocket Lab 是已经产生收入的小型发射成熟运营商；澳大利亚 Southern Launch 是 NRFC 支持的本土竞争者；SpaceX Transporter
              拼车以每个小卫星星位约 US$300,000–500,000 的价格构成廉价替代，压低专用小型发射定价。更警醒的是，小型发射「坟场」里有 Astra、Virgin Orbit 和 ABL Space，德国
              Isar Aerospace 首飞也失败，说明资金更充足的新进入者也常常失败或转向。Gilmour
              的模式——内部自建火箭、卫星和航天港——把资本摊到三项尚未证明的赌注上，因此利润率、单位经济性和定价权仍属推测。财务和竞争暴露会传导到风险传导图。
