      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              需求顺风真实且持久。LEO 巨型星座——Starlink 7,000 多颗卫星、Amazon Project Kuiper、中国 Guowang
              及盟国项目——带来持续、经常性的发射和小卫星制造需求。国家安全支出在全球上升，澳大利亚尤其是 Canberra 已释放未来十年 A$9–12 billion 投入韧性太空态势感知和主权太空能力的信号；2026
              Defence Industry Development Strategy 强调自力更生的工业基础，又加固了这一趋势。可重复使用带来的发射成本下降（SpaceX 至 LEO 约 US$2,700–3,000 /
              kg）扩大整体市场，也降低卫星运营商门槛。


              约束同样实质，且不利于专用小型发射。SpaceX Transporter
              拼车以专用发射一小部分的价格提供小卫星舱位，形成直接替代和价格压力——这是专用小型发射经济性最常被提及的威胁。专用小型发射市场本身远小于所服务的小卫星市场，增速也更慢（约 5–12% CAGR，对比小卫星最高
              28%），意味着有限专用需求被大量运载器追逐，存在产能和过剩风险。火箭开发资本密集、失败率高，Gilmour 自身 TestFlight-1
              失利就是提醒。澳大利亚制造商的成本基础高于美国对手，组件供应更薄，行业收入仍高度依赖政府，碎片 / 离轨监管又给每颗卫星增加约 US$200,000–500,000 合规成本。这些驱动与约束共同决定
              Gilmour 可服务采用的时间和上限。
