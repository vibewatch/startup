      - number: '5.2'
        title: Eris 如何运作：混合推进与火箭架构
        blocks:
          - type: paragraph
            body: >
              Eris 围绕 Gilmour 自研混合推进打造，这是公司最核心的技术赌注。一级并联四台 Sirius 混合发动机，燃烧 3D 打印固体燃料，并使用液体氧化剂（过氧化氢）；二级使用一台真空优化的 Sirius
              发动机；负责入轨的三级则采用液体燃料 Phoenix 发动机。Gilmour 主张混合推进比传统液体发动机更安全、更便宜，同时保留节流控制和重启能力；相对于 Rocket Lab Electron、Isar
              Aerospace Spectrum 等液体燃料小型运载火箭，这就是差异化点。


              运营架构从推进向上叠到复合材料箭体结构、航电和制导 / 导航 / 控制、Bowen 的发射场与地面系统、ElaraSat 卫星平台，以及任务运营。Gilmour 称 Eris
              几乎完全内部开发——推进、结构、航电、软件和航天港本身都在公司内完成——这把技术诀窍和执行风险都压在内部。Phoenix 液体发动机线获得 A$5M Industry Growth Program
              补助，用于加快开发。由于大多数性能和验证数据没有独立公开，下方架构表把已验证要素（级构型、推进剂类型、内部开发范围）与公司陈述的设计意图分开；尽调需要拿后者去对照地面测试和飞行遥测。
