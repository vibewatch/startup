  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界与替代方案
        blocks:
          - type: paragraph
            body: >
              Gilmour Space 并不是卖进单一市场；垂直整合模式覆盖四个相连的支出池，估算规模前必须先划边界。第一是专用小型发射服务——将约 1 吨以下载荷送入轨道，Eris 火箭（约 305 kg 至
              LEO）直接面向这一段。第二是小卫星制造和平台，ElaraSat 100 kg 级平台服务这一层。第三是发射场和航天港运营，通过 Bowen Orbital Spaceport
              变现。第四也是战略锚点，是主权国家安全太空准入：有保障的本土发射，减少对外国供应商的依赖。


              Gilmour 核心边界明确排除中型和重型发射、GEO 通信卫星、深空与载人航天，以及通用地面设备支出。最重要的现状替代方案是拼车聚合（SpaceX Transporter 计划和 Exolaunch
              等经纪商）以及外国专用小型发射（尤其 Rocket Lab Electron）。这些替代方案重要，因为如果没有强制性主权任务，主权买家也可以直接在海外购买便宜拼车舱位。相邻拉动需求——LEO
              宽带、地球观测分析和防务星座——会扩大机会，但不是 Gilmour 直接捕获的收入。这样划边界能让规模测算更诚实：Gilmour 真正销售的发射市场，远窄于标题里的小卫星或太空经济数字。
