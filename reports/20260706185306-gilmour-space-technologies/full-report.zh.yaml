      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              Gilmour 是一家依赖融资的企业，承销问题在于未来资本是否充足，而不是历史融资时间线；历史部分已在公司概览展开。这里只作为背景引用：Series A（约 A$5M，2017 年）、Series B（约
              US$19M，2018 年）、Series C（A$61M，2021 年 6 月，当时澳大利亚最大太空融资）和 Series D（A$55M，2024 年 2 月，QIC 领投）。近期关键事件是 2026 年 1
              月 A$217 million Series E，由 National Reconstruction Fund Corporation 和 Hostplus 共同领投，各投 A$75 million，把估值推至
              A$1 billion 以上；后续据报扩至 A$231 million；2026 年 5 月又获得 A$14.2 million 追加融资。累计私人资本超过 A$350 million（Tracxn
              根据纳入口径给出约 US$245 million）。


              尽管如此，承销最关键的数字仍未披露。现金余额、月度烧钱和现金跑道没有公开；只能推断，近期股权融资加非稀释性支持（A$75M NRFC、A$52M ASMN、A$5M IGP）覆盖了近期开支。Series E
              资金用途是 Eris TestFlight-2、制造扩产、Bowen 航天港和下一代液体推进——全是 capex
              重的事项。最可能触发下一轮融资的是成功入轨；公开资料未披露债务或项目融资义务，资产负债表因此主要由股权和补助支撑，并在发射收入得到验证前依赖投资人持续信心。
