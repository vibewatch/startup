      - number: '4.4'
        title: 公开财务缺口与结论
        blocks:
          - type: paragraph
            body: >
              对承销方而言，Gilmour
              最突出的财务特征是未披露私人数据的范围很广。收入及收入组合、烧钱速度、现金跑道、毛利率、已签发射积压、单次发射单位经济和完整股权结构，公开来源都拿不到。每一项都是具体尽调阻断点，也有明确路径：收入和烧钱看管理账和
              Series E 数据室；毛利率和单次发射经济看自下而上的成本模型；积压订单看客户合同；股权结构看股东协议。公开牵引确实存在，但很薄——一颗在轨卫星，TestFlight-1 失败后成功轨道发射仍为零。


              结论是：收入质量早期且项目制，不是经常性；利润率路径未验证，按 Rocket Lab 可比样本看，未来多年可能为负；资本强度高；公司在发射收入尚未启动、烧钱和跑道未披露的情况下估值超过 A$1
              billion，存在实质估值相对基本面风险。行业历史（Astra 和 Virgin Orbit 的失败）显示，小型发射单位经济在全行业都未被证明。投资案因此是前瞻、里程碑驱动型，取决于 Eris
              成功入轨；承销所需财务输入目前大多不足，必须在 NDA 下取得。
