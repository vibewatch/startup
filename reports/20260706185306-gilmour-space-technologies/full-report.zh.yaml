      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              多头论点有四根支柱。第一是市场：澳大利亚和 Indo-Pacific 的主权与国防发射需求正在上升，Gilmour 又是先发者，在 Bowen 拥有持牌本土轨道航天港。第二是资本和背书：2026 年 1 月
              Series E 引入 National Reconstruction Fund Corporation 与 Hostplus 各 A$75M 联合领投，另有 Future Fund、QIC
              和多家养老基金参与；这是一组耐心、战略一致的资本基础，可降低融资风险。第三是多元化：ElaraSat 2025 年 6 月借 SpaceX 入轨，A$17.6M RAAF 合同和高超声速测试工作也在 Eris
              飞行前提供相邻收入和在轨履历。第四是稀缺性：如果 Eris 跑通，Gilmour 作为主权垄断候选者可能拿到溢价。


              反论点同样具体。产品尚未证明——TestFlight-1 失败，小型发射赛道遍布资金充足但失败的公司（Astra、Virgin
              Orbit、ABL）。估值嵌入了尚未发生的成功；独立分析师指出，许多高估值太空公司相对其估值仍处于无收入或早期收入阶段。低价 SpaceX 拼车（每个小卫星星位约 US$300,000
              起）挤压专用小型发射经济性。资本强度高且烧钱速度未披露；如果 TestFlight-2 推迟，就有降估值融资风险。最后，两位创始兄弟带来的关键人集中会放大执行风险。每一项都有明确的「什么会改变观点」触发器。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
