    title: Gilmour Space 建议逻辑
    type: flow
    summary: 规模、验证、风险和估值如何串成 WATCH 建议，以及触发上调的条件。
    data:
      nodes:
        - id: market
          label: 市场：主权 / 国防发射需求（正向）
          type: input
        - id: proof
          label: 验证：Eris 未经验证，TestFlight-1 失败（负向）
          type: input
        - id: capital
          label: 资本：A$217M Series E 轮，政府背书（正向）
          type: input
        - id: risk
          label: 风险：技术结果二元、尚未有收入、关键人集中（高）
          type: input
        - id: valuation
          label: 估值：>A$1B，基本面看偏贵（偏高）
          type: process
        - id: watch
          label: 建议：WATCH（中等信心，高风险）
          type: output
        - id: buy
          label: 若 TestFlight-2 成功 + 合同定价落地，上调至 BUY
          type: output
        - id: pass
          label: 若 TestFlight-2 失败 / 下一轮降估值融资，降至 PASS
          type: output
      edges:
        - from: market
          to: valuation
        - from: proof
          to: valuation
        - from: capital
          to: valuation
        - from: risk
          to: valuation
        - from: valuation
          to: watch
        - from: watch
          to: buy
        - from: watch
          to: pass
