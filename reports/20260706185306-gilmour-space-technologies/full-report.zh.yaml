  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、置信度与估值立场
        blocks:
          - type: paragraph
            body: >
              对 Gilmour Space 的建议是
              WATCH——跟踪并复审，而不是买入或放弃。公司作为澳大利亚唯一可信的主权轨道发射竞争者，提供罕见且具有战略意义的上行空间，背后还有异常深厚、与政府目标一致的资本基础；但旗舰产品尚无收入，并承载二元技术风险。建议置信度为中：融资事实（A$217M
              Series E、估值超过 A$1B、2026 年 1 月）有充分记录，但核心价值驱动——可靠的 Eris 轨道火箭——在 2025 年 7 月 TestFlight-1 飞行约 9 到 14
              秒即失败后仍未证明。风险评级为高，反映单一运载火箭依赖、资本强度，以及小型发射行业的失败史。


              估值立场是：按基本面看，Gilmour 偏贵到紧绷；按战略看，仍可辩护。对一家成功轨道发射为零、未披露发射收入的公司，>A$1B
              价格无法靠当前现金流或纯倍数可比公司支撑；市场把它当成已经可信的小型发射竞争者来定价，而证明还没出现。支撑这一定价的是真实的主权溢价：国家安全对本土可控发射的需求、澳大利亚政府的 National
              Reconstruction Fund Corporation 联合领投、Future Fund 和 QIC 参与，以及非稀释补助。因此进入纪律很重要——合适姿态是等待 TestFlight-2
              证据，或在以独角兽估值投入前谈到结构性下行保护。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
