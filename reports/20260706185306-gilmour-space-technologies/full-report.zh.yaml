  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - TestFlight-2 在 2026 年底成功；Eris 商业化发射形成节奏；国防积压订单转化；主权垄断
        - 按 Rocket Lab 模板重估；数十亿估值；IPO / 战略退出
        - 节奏化执行、竞争、扩张资本
        - 概率较低但回报高；主权需求和深厚资本底座支撑
      - - 基准
        - 延误后约 2027 年最终入轨；发射节奏温和；价格承压
        - 大体守住 ~A$1B 估值；继续稀释来支持扩张
        - 延误、SpaceX 拼车定价、烧钱
        - 最可能的中枢情景；时间误差带很宽
      - - 悲观
        - TestFlight-2 失败或严重延误；资金吃紧
        - 折价轮或减值；落入小型发射「墓地」命运（Astra / Virgin Orbit / ABL）
        - 第二次发射失败、流动性、投资者疲劳
        - 左尾风险不小；第二次尝试失败的基准率不可忽视
    notes: 情景为作者估计，不是公司指引。鉴于没有披露财务数据或发射可靠性数据，概率信号为定性判断。可比「墓地」结局来自独立行业报道。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 指标
      - 估值 / 倍数
      - 参考意义
      - 局限
    rows:
      - - Rocket Lab (RKLB)
        - 上市（NASDAQ）；2025 年收入 ~US$602M；Electron 已验证
        - 市值 ~US$37-41B；EV/revenue ~60-67x
        - 关键公开小型发射可比对象和重估模板
        - 规模大得多，飞行已验证且有卫星业务；不是收入前公司
      - - Firefly Aerospace (FLY)
        - 2025 年 IPO 上市；2025 年收入 ~US$160M；完成月球着陆
        - IPO 寻求 ~US$5.5B 估值；P/S ~26x
        - 近期小 / 中型发射上市基准
        - 收入基数更大；前五大客户集中度 >86%
      - - Sierra Space
        - 私营；国防合同；Dream Chaser
        - 投后 ~US$8B
        - 私营航天国防溢价估值
        - 细分不同（空间站 / 空天飞机）；收入未披露
      - - Isar Aerospace
        - 私营（德国）；Spectrum；首次发射约 30s 后失败
        - 资金充足（US$165M Series C+；累计融资 >US$150M）
        - 最接近的入轨前同行，虽失败但资本充足
        - 市场 / 监管地域不同；估值未披露
      - - SpaceX
        - 私营 / IPO；收入 ~US$16-18B；主导者
        - ~US$800B-US$2T
        - 行业必须打穿的规模 / 成本底线
        - 规模异常值，不是同类可比
      - - Gilmour Space（本分析对象）
        - 私营；入轨前；0 次成功轨道发射
        - '> A$1B（约 US$650M）Series E，2026 年 1 月'
        - 本分析对象
        - 证明未到先定价；主权 / 战略溢价
    notes: >-
      样本选取最相关的公开和私营航天可比对象，不是穷尽名单。收入 / 估值数字来自截至 2026 年中的独立市场分析、SEC 文件和新闻；倍数为近似值，因数据提供方而异。Gilmour 行使用规范 Series E
      数字。覆盖范围为样本；见相关 evidenceGap。
    enumerationScope:
      coverage: sample
      basis: >-
        Representative sample of the highest-relevance small-launch and space comparables (public Rocket Lab and
        Firefly, private Sierra Space, Isar and SpaceX) selected for launch-model and valuation comparability; not a
        complete enumeration of every space company as of mid-2026
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV031
  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - TestFlight-2 结果
        - 连续第二次轨道发射失败
        - 击穿核心技术逻辑；冲击估值、融资和客户
        - 转为放弃，或要求以大幅折价轮进入
      - - 进度延误
        - TestFlight-2 推迟到 2027 年中之后，且没有已融资现金跑道
        - 把技术风险转成流动性风险
        - 暂停；任何承诺前先要求已融资现金跑道
      - - 融资条款
        - 折价轮、不利优先权 / 棘轮，或困境二级交易
        - 验证悲观估值路径；稀释普通股权益
        - 按新估值重新评估；争取保护
      - - 商业积压订单
        - 国防或主权合同流失 / 未能转化
        - 削弱基准 / 乐观情景中的收入桥
        - 下调基准情景价值；提高悲观权重
      - - 定价压力
        - SpaceX 拼车持续压低专用小型发射价格
        - 侵蚀单位经济性和长期利润率
        - 压测定价；下修发射节奏假设
      - - 关键人
        - Adam 或 James Gilmour 离任
        - 抬高执行和治理风险
        - 重新评估关键人风险；要求留任 / 接班安排
    notes: >-
      这些触发项可监测，并为 WATCH 立场预先设定。阈值由作者定义；部分数据（现金跑道、优先权）需要非公开信息，已在 TV006 中列为尽调问题。上行镜像：TestFlight-2 成功 + 已定价合同，是朝 BUY
      方向确认的触发项。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表与优先权
        - 完整 Series E 股权结构表、清算优先权、棘轮 / 反稀释
        - 决定真实下行保护和有效入场价格
        - 公司 / 领投方在 NDA 下提供；审查股东协议
      - - 财务与现金跑道
        - 收入、烧钱速度、支持 TestFlight-2 和扩张的现金跑道
        - 判断折价轮风险和资本充足性
        - 管理账和 Series E 数据室；现金流模型
      - - 技术就绪度
        - TestFlight-1 纠正措施和独立就绪验证
        - 直接决定驱动估值的发射成功概率
        - 调查报告；独立工程评审
      - - 商业积压订单
        - 已签约国防 / 主权积压订单金额和里程碑
        - 支撑基准 / 乐观情景中的收入桥
        - 合同排期；客户访谈
      - - 估值依据
        - 独立估值 / 方法论解释 >A$1B Series E 定价
        - 检验价格是市场出清还是政府主导
        - 轮次文件；可比交易分析
      - - 关键人与治理
        - 接班、关键人保险、董事会控制权
        - 创始人集中是重大执行 / 治理风险
        - 董事会章程；关键人政策；组织架构图
    notes: 尽调问题瞄准公开来源无法解答的未知项。每一项都对应估值关键不确定性；多数需要进入私有数据室。负责人仅为指示性（公司、领投方、独立评审方）。
