      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Gilmour Space 由两兄弟共同创立并带领，他们仍是公司最关键的人物。CEO Adam Gilmour 在银行业约二十年，包括 Citigroup
              亚洲区高级岗位；离开金融业后创办火箭公司，是公司对外面孔，主导融资和战略。其兄弟兼联合创始人 James Gilmour
              负责工程和发射运营。这组创始人把商业和技术权力都集中在一个家庭中，支撑公司凝聚力，也带来实质关键人物依赖。


              公司扩张后，管理层开始职业化，补上推进、卫星（卫星负责人 Mark Grimminck）、发射运营和制造等职能高管；TestFlight-1 期间，员工据报超过 200 人，并由 500
              多家澳大利亚供应商网络支撑。随着成熟投资人进入，治理也转向机构化监督：风投 Blackbird 和 Main Sequence、Fidelity 关联的 Fine Structure
              Ventures、Hostplus、HESTA、NGS Super 等养老基金、州投资者 QIC，以及联邦 National Reconstruction Fund
              Corporation，已在历轮融资中取得董事会或观察员席位。


              Gilmour 是私人公司且尚未
              IPO，董事会构成、创始人股权、投票控制、期权池等细颗粒治理信息均未公开。技术和执行领导集中在两位创始人手里，再叠加未经验证的轨道火箭带来的二元技术风险，关键人物与接班安排成为核心尽调问题；现有公开来源无法完整回答。
