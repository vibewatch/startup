      - number: '1.4'
        title: 里程碑、规模与轨迹
        blocks:
          - type: paragraph
            body: >
              Gilmour 的轨迹是技术稳步升级，中间夹杂突破和挫折。2012 年创立、2016 年混合火箭试飞后，公司在 2010 年代末和 2020 年代初扩展推进技术、募集风投资金，并为 Bowen Orbital
              Spaceport 拿下场地和许可；Australian Space Agency 批准其成为澳大利亚首个轨道发射设施。


              2024 年，公司拓宽收入基础，拿下 Royal Australian Air Force A$17.6 million 发射工程与研发合同，随后开始为防务和科研客户做高超音速测试火箭工作。2025 年 6
              月，搭载 CSIRO 高光谱成像仪的 ElaraSat MMS-1 通过 SpaceX Transporter-14 拼车部署，公司首次以卫星运营商身份实现入轨——自有火箭飞行前，卫星平台已经得到验证。


              决定性测试发生在 2025 年 7 月 30 日。Eris TestFlight-1 从 Bowen 起飞，成为第一枚从澳大利亚本土发射的澳制轨道级火箭，但起飞约 9
              秒后出现一级推进异常，坠回发射台附近，未能入轨。2026 年 4 月结束的调查将故障追溯到氧化剂泵子系统的电气和热故障，包括外采组件问题。此前 2026 年 1 月 Series E
              和独角兽身份带来的资金动能，支撑公司投入第二次尝试；Eris TestFlight-2 目标为 2026 年末。
