      - number: '7.2'
        title: 监管、法律与许可风险
        blocks:
          - type: paragraph
            body: >
              Gilmour 做的是全球监管最严的活动之一，而澳大利亚轨道发射监管本身也不成熟。发射和返回活动受 Space (Launches and Returns) Act 2018 约束，由 Australian
              Space Agency 通过 Office of the Space Regulator 管理；Gilmour 需要首个同类轨道发射许可，Australian Space Agency
              以安全为由花了约两年才批准，并直到 2024 年 11 月才发放。在发射许可之外，公司称还需要约 24 项 Queensland 单独许可，以及环境和空域批准，后者涉及 Civil Aviation Safety
              Authority。每项批准都是闸门依赖：许可证暂停、TestFlight-1 异常后重新验证失败，或 Bowen 场地新增环境条件，都可能让发射直接停摆。


              监管拖延已经造成具体财务伤害。CEO Adam Gilmour 公开把拉长的许可流程与融资放慢联系起来，称审批延迟正在拖延下一轮融资，并传导到岗位和供应链。由于 TestFlight-1 最终调查报告提交给
              Australian Space Agency 和 Office of the Space Regulator，任何复飞许可的时间和条件都掌握在监管机构手里，而不是公司手里。诉讼、IP
              和出口管制暴露无法从公开来源确认，因此被列为尽调路径，而不是已解除风险。下方监管 / 法律台账按严重性排列这些暴露。
