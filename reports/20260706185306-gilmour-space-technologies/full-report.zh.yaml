          base: 0.65
          high: 3
        - label: 牛市：向小型发射同业重估（US$B）
          low: 1
          base: 2.5
          high: 5
        - label: 熊市：降估值融资 / 减值（US$B）
          low: 0.1
          base: 0.3
          high: 0.65
