      - number: '5.4'
        title: 差异化、信任、质量与合规
        blocks:
          - type: paragraph
            body: >
              Gilmour
              的差异化更多是结构性的，还不是飞行证明出来的：公司掌握整条栈——火箭、卫星平台和持牌发射场——为盟友体系以及澳大利亚政府、国防和商业客户提供一条本土可控的入轨路径。内部混合推进和复合材料制造诀窍是技术护城河；监管位置也是一项真实、来之不易的资产。Gilmour
              持有澳大利亚首张轨道发射设施许可证（2024 年 3 月根据 Space (Launches and Returns) Act 2018 授予）、首张澳大利亚轨道发射许可（2024 年 11 月）、CASA
              批准的飞行管理计划，以及 Department of Climate Change, Energy, the Environment and Water 的环境许可。


              信任和安全记录有好有坏，但不构成警报：TestFlight-1 没有造成人员受伤，也没有不利环境影响；Gilmour 与 Australian Space Agency 的 Office of the Space
              Regulator、CASA、Airservices Australia
              和海事部门密切协调，并向监管机构提交了最终失效调查报告。尚未证明的是产品可靠性和质量控制：成功轨道飞行次数为零，唯一一次尝试因涉及外采部件的子系统故障失败；公司没有展示过发射可靠性，也没有公布验证测试数据集，飞行系统也没有第三方认证。下方信任
              / 质量 / 合规表列出这些控制项和缺口。
