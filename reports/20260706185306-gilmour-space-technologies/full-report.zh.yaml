              还希望成为南半球发射枢纽。与之相对，集中度风险很高。客户基础高度依赖澳大利亚政府和国防需求，以及单一锚定卫星任务（CSIRO）；没有经常性发射收入，收入来自卫星工作、国防服务和补助。对 Space BD
