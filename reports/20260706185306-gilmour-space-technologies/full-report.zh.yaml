            title: Rocket Lab 主导地位对上零飞行履历
            body: >-
              Rocket Lab 已有 91 次 Electron 发射、US$2.2B 积压订单和深厚国家安全合同；Gilmour 在 TestFlight-1 约 14
              秒后失败后仍无轨道成功。就最关键购买标准——已验证、可靠的准入——Gilmour 落后在位者数年。
            calloutType: risk
            claimRefs:
              - CP022
              - CP004
