      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              情景分布异常宽，因为结果取决于少数二元事件。牛市情景下，Eris TestFlight-2 在 2026 年末成功，Gilmour
              把国防和主权订单储备转化为经常性发射收入，并凭澳大利亚事实上的主权发射垄断地位支撑数十亿澳元估值和公开市场或战略退出——向 Rocket Lab 模板重估。基准情景下，火箭最终入轨但时间更慢（2027 年），在
              SpaceX 拼车竞争下发射节奏和定价都较温和，公司大致守住约 A$1B 估值，同时继续消耗资本。


              熊市情景下，TestFlight-2 失败或大幅滑延，资本紧张迫使降估值融资或减值，Gilmour 可能落入 Astra、Virgin Orbit 和 ABL
              的小型发射「坟场」。概率信号指向一个战略右偏、技术左尾很重的宽分布：主权使命和深厚养老基金资本相较同业降低融资风险，但首飞失败后的第二次发射尝试，技术基础率并不乐观。估值 /
              回报区间图把这些转成低、基准、高估值结果，并列明假设；敏感性分析显示，发射成功概率远是价值的主导驱动。
