            body: >-
              Gilmour 的差异化是一套澳大利亚国内拥有的发射堆栈，由政府资本（A$75M NRFC）和 A$217M Series E
              背书；这让它比更小的欧洲进入者资金更深，也拥有价格型对手难以复制的主权叙事，尤其面向盟国政府载荷。
            calloutType: strength
