      - number: '8.5'
        title: 打破论点的触发器与否决条件
        blocks:
          - type: paragraph
            body: >
              有纪律的 WATCH 需要预先承诺、可监控的触发器，让复审基于证据，而不是情绪。最重要的单一触发器是 Eris TestFlight-2
              结果：连续第二次轨道失败会实质性打破论点，直接传导到估值、融资渠道和客户信心，并会把建议推向放弃，或要求以大幅降估值融资进入。若 TestFlight-2 在没有已融资现金续航期的情况下滑到 2027
              年中之后，也是第二个触发器，因为它会把技术风险转化为流动性风险。出现降估值融资、重大不利优先权条款或困境二级交易，将确认熊市路径。


              其他触发器来自商业和结构：国防与主权订单储备流失或无法转化、SpaceX 拼车持续压价并削弱专用小型发射经济性、关键人集中背景下任一创始人离任，或政府支持撤回。上行方面，TestFlight-2
              成功叠加已签署、已定价的商业发射合同，会成为确认论点的触发器，可能在重新承销后的价格上把建议从 WATCH 推向 BUY。每个触发器都配有阈值和行动含义，使监控能服务决策，而不是停留在描述。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
