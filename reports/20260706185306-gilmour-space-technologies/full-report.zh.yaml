      - number: '5.3'
        title: 成熟度、部署与路线图
        blocks:
          - type: paragraph
            body: >
              成熟度分成两条线。ElaraSat 已部署并运行，借 SpaceX 拼车发射让 Gilmour 作为卫星运营商拿到真实在轨履历。旗舰 Eris 仍在验证阶段。TestFlight-1 于 2025 年 7 月
              30 日从 Bowen 起飞——这是澳大利亚制造的轨道级火箭第一次从澳大利亚本土发射——但飞行只持续约 14 秒。火箭离开发射架后偏离发射台，随后落回指定安全区，没有入轨。2025 年 5
              月的一次尝试因载荷整流罩意外展开而取消，公司把原因归于电涌；整个发射战役还经历约 18 个月审批拖延，以及天气和技术原因的多次取消。


              公司调查于 2026 年 4 月 24 日结束，结论是点火约 9 秒后，四台一级混合发动机中一台失去推力，另一台约 17
              秒时也出现衰减；两个彼此独立的失效模式都指向氧化剂泵子系统——电泵电机和逆变器的电气、热故障，其中包括外部采购部件。最终报告已提交 Australian Space Agency。Gilmour 称下一枚
              Eris 已在生产，并纳入设计、验证和流程改进；公司把 TestFlight-2 目标定在 2026 年末（Q4），此前还计划在 2026 年上半年完成首次高超声速飞行测试。下方路线图表和成熟度图列出这些阶段。
