      - number: '7.6'
        title: 人员、执行风险与否决条件
        blocks:
          - type: paragraph
            body: >
              领导力集中在两位创始兄弟身上：Adam Gilmour 是 CEO 和公众面孔，负责战略和融资；James Gilmour
              负责发射运营和工程。两兄弟组合给公司带来凝聚力，但也形成尖锐关键人依赖——商业和技术权威都在同一个家族内，公开披露中没有继任或关键人保险安排。任一创始人流失都会让执行、融资和士气发生阶跃式变化，因此应视为打破论点的触发器，而不是常规
              HR 风险。执行风险也不止于创始人：按计划、按节奏，在一个新建场地，用扩张中的团队交付前所未有的一串轨道发射，本身就是公司尚未证明的高难度管理任务。


              因为下一次飞行承载太多，我们定义可监控的否决条件。TestFlight-2 连续第二次失败，或轨道里程碑滑到 2027 年之后，都会实质性打破论点。现金续航期降到约 6 个月以下且没有承诺新融资、Bowen
              发射许可证被撤销或无限期暂停，或失去一位创始人，任何一项都足以重新评估。缓释因素存在——相邻高超声速测试和卫星收入、政府与养老金投资人组成的多元资本基础、下一枚火箭已在生产，以及异常后的设计 /
              验证变更——但没有哪项能拿掉核心二元风险。下方缓释与否决条件表以及人员 / 执行台账把这些触发器写成明确、可监控的条件。
