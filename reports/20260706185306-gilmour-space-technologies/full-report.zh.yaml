      - number: '5.5'
        title: 关键依赖与技术风险
        blocks:
          - type: paragraph
            body: >
              Eris 和 ElaraSat 压在一串外部依赖之上，其中几个已经卷入挫折。最尖锐的是外部部件供应链：TestFlight-1
              根因追溯到氧化剂泵电机和逆变器的电气、热故障，其中含有外采部件；这次故障说明，即便整车垂直整合，关键部件仍会继承供应商风险。监管依赖同样卡脖子——每次发射都需要 Australian Space Agency
              许可和 CASA 空域协调，多年审批流程已经让首飞推迟约 18 个月。物理依赖包括 Bowen 场地本身及其天气窗口，2025
              年多次尝试都因此取消；还包括复合材料结构、混合推进剂（过氧化氢、固体燃料）供应链，以及支撑 200 多人团队的 500 多家澳大利亚供应商网络。


              更深一层的结构依赖是：ElaraSat 虽已运行，但目前只能靠第三方发射（SpaceX）入轨，因为 Eris 尚未完成飞行验证；只有 Eris
              变得可靠，垂直整合论点才真正闭合。下方关键依赖图追踪供应商、监管机构、设施和平台关系。主导技术风险仍然是二元的：一枚尚未证明的轨道火箭，唯一一次飞行败在推进子系统上，使估值和主权发射论点都取决于
              TestFlight-2 及后续飞行能否证明可重复性能。
