  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代方案
        blocks:
          - type: paragraph
            body: >
              Gilmour Space 卖的是低地球轨道准入，买家可以用几种相互竞争的方式完成这件事。直接同业是其他专用小型运载火箭：Rocket Lab 的 Electron、Firefly Aerospace 的
              Alpha、Isar Aerospace 的 Spectrum，以及欧洲和亚洲一长串尚未入轨的进入者，如 Rocket Factory Augsburg
              (RFA)、HyImpulse，以及（进入破产管理前的）英国 Orbex。澳大利亚本土，Southern Launch 是相邻国内对手，运营发射场和靶场服务而非造火箭，但争夺同一套主权能力叙事和政府资金。


              然而，最重要的替代方案根本不是专用火箭。SpaceX Transporter 拼车计划重塑了整个市场：它以最高 50 kg 约 US$350,000、额外每 kg 约 US$7,000
              起的价格，把小卫星送入太阳同步轨道；按每公斤算，比专用发射便宜一个数量级。许多载荷的现状选择只是等待下一班拼车清单，不过 12–18
              个月积压和固定轨道，会把重视时程和轨道的客户推回专用供应商。另一个「内部自建」替代方案只适用于能够资助自有发射项目的最大国家客户。本章逐一比较这些路径，并追问 Gilmour 的差异化能在多大程度上扛住它们。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP026
              - CP030
              - CP039
