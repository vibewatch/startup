  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险总览与严重性排序
        blocks:
          - type: paragraph
            body: >
              对 Gilmour Space 最关键的单一风险是技术：公司从未入轨。Eris TestFlight-1 于 2025 年 7 月 30 日从 Bowen Orbital Spaceport
              起飞——这是澳大利亚设计和制造的第一枚从澳大利亚本土飞行的轨道级火箭——但火箭侧向漂移并落回发射台附近前，飞行只持续约 14 秒。公司自身调查发现，点火约 9 秒后四台一级混合发动机中的一台失去推力，第二台约
              17 秒时衰减，两个故障都指向氧化剂泵子系统的电气和热故障，其中包括外部供应商部件。因此，轨道可靠性尚未证明；管理层自己也指出，火箭公司通常需要约三次尝试才能入轨。


              技术风险和执行 / 进度风险绑在一起。发射从最初 2024 年 5 月目标一路滑延；Australian Space Agency 经过约两年评估，直到 2024 年 11 月才发放许可证；2025 年 5
              月又因意外电涌导致载荷整流罩提前展开而取消。TestFlight-2 目前指引到 2026 年末——距离首次失败超过一年——所以 Eris
              能否入轨这个二元问题，会在投资期内继续悬而未决。我们按剩余严重性排序：技术 / 可靠性和执行 / 进度最高，其次是财务（火箭尚未证明前估值已 >A$1B）、监管 / 许可、合作伙伴 /
              依赖（单一供应商、单一场地）、竞争（小型发射「坟场」）以及人员 / 关键人集中。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR008
              - CR015
