      - number: '8.3'
        title: 融资背景与可比估值
        blocks:
          - type: paragraph
            body: >
              Gilmour 超过 A$1B 的投后估值，需要放到 2026 年太空行业硬件估值处于十年来高位的背景中看。可用的公开锚点是 Rocket Lab，其股价在 2025 年大幅上涨，市值据报约 US$37B 至
              US$41B；2025 年收入约 US$602M，对应 EV/revenue 约 60–67x，前提是 Electron 已经证明并建立了卫星业务。Firefly Aerospace 已完成月球着陆，并寻求以约
              US$5.5B 估值 IPO；其约 US$160M 2025 年收入对应的市销率更低。私有市场估值包括 Sierra Space 约 US$8B，以及欧洲融资最充足的发射公司之一 Isar
              Aerospace，虽首飞失败仍已融资远超 US$150M。SpaceX 估值在 US$800B 到超过 US$1.5T，是规模异常值，不是可比公司。


              放进这组样本里，Gilmour 的估值更像一份期权溢价：市场按未来可能成为小型发射和主权能力提供商来定价，而不是按它尚未拥有的历史基本面定价。对进入纪律不舒服的事实是：Gilmour
              在成功轨道发射为零时就背着十亿澳元估值，而 Rocket Lab 的溢价由已证明飞行和收入锚定。公开证据只有在接受主权 /
              战略溢价、并给最终入轨成功较高概率时才支撑价格；按纯倍数看，估值站不住。大型政府领投轮带来的稀释和优先权悬置，也是公开来源无法解决的额外未知。
