      - number: '2.5'
        title: 规模测算缺口、矛盾与尽调
        blocks:
          - type: paragraph
            body: >
              若干规模和采用问题无法从公开证据解决，本报告将其保留为缺口，而不是抹平。Gilmour 的 SAM 和 SOM——亚太及澳大利亚主权小型发射需求，以及 Gilmour
              现实可捕获的份额——无法从已发布分析报告中剥离；这些报告测算全球或区域市场，却不测澳大利亚主权发射利基。同一底层市场的分析机构估计公开冲突：小卫星市场 CAGR 有 16.4%（Allied Market
              Research）、21.3%（Technavio）和 28%（MarketsandMarkets）等不同说法；仅 2025 年小型运载火箭市场规模也从 US$1.8 billion（GM Insights）到
              US$2.22 billion（Fortune Business Insights）不等，反映范围和方法差异。


              还有结构性采用风险：澳大利亚独立评论直言，截至报告期，尽管多年公告不断，还没有澳大利亚公司从澳大利亚本土实现入轨；在竞争激烈的全球市场里，发射经济性很难跑通；多数澳大利亚太空公司仍依赖政府资金贡献大部分收入。澳大利亚自身到
              2030 年实现 A$12 billion 行业规模和 20,000 个就业岗位的目标提供政策顺风，却不能成为任何单一公司的可承销收入预测。这些矛盾和公司级 SAM
              的缺失，正是尽调必须拿管理层自身市场模型和已签约管线来校准的数字，然后才能承销 Gilmour 高于独角兽的估值。
            claimRefs:
