      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Gilmour 的技术栈建立在几项集中依赖上，其中一项已经失效。TestFlight-1
              根因包括外部供应商提供的氧化剂泵部件出现电气和热故障，暴露出飞行关键子系统的单一供应商风险；这里的缺陷不是可降级，而是灾难性。发射本身依赖单一资产——Bowen Orbital
              Spaceport——没有备用发射台，因此天气、气旋损坏或该场地的许可问题都会让整个发射业务停摆。资本提供方集中也是另一层依赖：2026 年 1 月 Series E 由政府的 National
              Reconstruction Fund Corporation 与 Hostplus 联合领投，Gilmour 也公开把融资节奏排在 NRFC 支持之后，因此政府支持胃口变化会很重要。


              分销和里程碑依赖又叠加上来。公司的卫星和发射商业渠道（包括 Space BD 等国际经纪商）以及非稀释补助都绑在交付里程碑上——例如一笔 A$5M
              联邦补助指定用于下一代液体发动机开发——因此进度滑延可能同时危及收入和资金。由于 Gilmour
              尚未入轨，客户承诺大多是前瞻性的；再次失败或拖延可能造成发射清单锚定客户或订单储备流失，而今天无法从公开数据衡量。合作伙伴 / 依赖台账按严重性排列每项交易对手暴露。
