company:
  name: "Gilmour Space Technologies"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Gilmour Space delivers three vertically integrated products — the three-stage Eris orbital launch vehicle powered by in-house hybrid Sirius/Phoenix propulsion, the 100-kilogram-class ElaraSat satellite bus, and the licensed Bowen Orbital Spaceport. ElaraSat is operational in orbit (MMS-1, June 2025), but Eris remains pre-qualification: its maiden TestFlight-1 (30 July 2025) failed roughly 14 seconds after liftoff when oxidiser-pump electrical and thermal faults — including externally sourced components — starved two of four first-stage motors of thrust. The technology's core risk is unproven launch reliability, with a second attempt (TestFlight-2) targeted for late 2026."
sections:
  - id: "product-definition-and-portfolio"
    title: "What Gilmour Delivers: Launch, Satellites, and Spaceport"
    body: |
      In customer-workflow terms, Gilmour Space sells sovereign access to low Earth orbit. A satellite operator or government payload owner who would otherwise queue for a foreign rideshare can instead run a mission through Gilmour's end-to-end funnel — mission enquiry, orbit and payload review, integration, and a dedicated or rideshare launch campaign from Australian soil. The company packages this as three connected product lines: the Eris orbital launch vehicle, the ElaraSat satellite bus, and the Bowen Orbital Spaceport, marketed together as "launch vehicle + satellite platform + licensed spaceport = simplified mission planning."

      The Eris Block 1 is a three-stage small-satellite rocket roughly 23 to 25 metres tall, about 2 metres in first-stage diameter, with a launch mass near 30 to 33 tonnes and a payload fairing about 1.5 metres across. It is designed to place approximately 305 kilograms into low Earth orbit or about 215 kilograms into a 500-kilometre sun-synchronous orbit. The ElaraSat platform is a modular, roughly 100-kilogram-class satellite bus that hosts up to 30 kilograms of customer payload and is compatible with multiple launch vehicles, including Eris. ElaraSat is the most mature asset: MMS-1, carrying a CSIRO hyperspectral imager, has operated in orbit since its June 2025 SpaceX Transporter-14 deployment and has verified its bus systems and S-band and X-band communications. Bowen, licensed in March 2024, is Australia's first orbital launch facility. This portfolio is the subject of the module matrix and workflow table below.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE027, CE040]
    tableRefs: [TE001, TE002]
    figureRefs: [FE002]
  - id: "architecture-and-operating-model"
    title: "How Eris Works: Hybrid Propulsion and Vehicle Architecture"
    body: |
      Eris is built around Gilmour's proprietary hybrid propulsion, the company's central technical bet. The first stage clusters four Sirius hybrid engines that burn a 3D-printed solid fuel with a liquid oxidiser (hydrogen peroxide); the second stage uses a single vacuum-optimised Sirius engine; and the third stage — which performs orbital injection — is the liquid-fuelled Phoenix engine. Hybrid propulsion is pitched as safer and cheaper than conventional liquid engines while retaining throttle control and restart capability, a differentiator versus liquid-fuel small launchers such as Rocket Lab's Electron and Isar Aerospace's Spectrum.

      The operating architecture layers upward from propulsion into composite vehicle structures, avionics and guidance/navigation/control, the launch site and ground systems at Bowen, the ElaraSat satellite bus, and mission operations. Gilmour states that Eris was developed almost entirely in-house — propulsion, structures, avionics, software, and the spaceport itself — which concentrates both know-how and execution risk internally. The Phoenix liquid-engine line received a A$5 million Industry Growth Program grant to accelerate development. Because most performance and qualification data is not independently published, the architecture table below distinguishes verified elements (stage configuration, propellant type, in-house scope) from company-stated design intent that diligence should probe against ground-test and flight telemetry.
    claimRefs: [CE011, CE012, CE013, CE014, CE015, CE016, CE017, CE028]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-deployment-and-roadmap"
    title: "Maturity, Deployment, and Roadmap"
    body: |
      Maturity is bifurcated. ElaraSat is deployed and operational, giving Gilmour genuine orbital heritage as a satellite operator via SpaceX rideshare. Eris, the flagship, is still in qualification. Its maiden flight, TestFlight-1, lifted off from Bowen on 30 July 2025 — the first Australian-made orbital-class rocket to launch from Australian soil — but the flight lasted only about 14 seconds. The vehicle cleared the tower, drifted from the pad, and fell back within the designated safety area without reaching orbit. An earlier attempt in May 2025 had been scrubbed after an unplanned payload-fairing deployment blamed on a power surge, and the campaign endured roughly 18 months of approval delays plus weather and technical scrubs.

      The company's investigation, concluded on 24 April 2026, found that about nine seconds after ignition one of the four first-stage hybrid motors lost thrust, with a second motor following near 17 seconds, tracing two independent failure modes to the oxidiser-pump subsystem — electrical and thermal faults in the electric pump motors and inverters, including externally sourced components. A final report was submitted to the Australian Space Agency. Gilmour says the next Eris vehicle is already in production with design, qualification, and process improvements, and it targets TestFlight-2 for late 2026 (Q4), following a first hypersonics flight test in the first half of 2026. The roadmap table and maturity map below lay out these stages.
    claimRefs: [CE018, CE019, CE020, CE021, CE022, CE023, CE024, CE025, CE026, CE033]
    tableRefs: [TE005]
    figureRefs: [FE004]
  - id: "differentiation-trust-and-compliance"
    title: "Differentiation, Trust, Quality, and Compliance"
    body: |
      Gilmour's differentiation is structural rather than proven-in-flight: it owns the whole stack — rocket, satellite bus, and a licensed launch site — offering allied and Australian government, defence, and commercial customers a domestically controlled path to orbit. Its in-house hybrid propulsion and composite manufacturing know-how are the technical moat, and its regulatory position is a real, hard-won asset. Gilmour holds Australia's first orbital launch facility licence (granted March 2024 under the Space (Launches and Returns) Act 2018), the first Australian orbital launch permit (November 2024), a CASA-approved flight management plan, and environmental approval from the Department of Climate Change, Energy, the Environment and Water.

      On trust and safety, the record is mixed but not alarming: TestFlight-1 produced no injuries and no adverse environmental impacts, and Gilmour coordinated closely with the Australian Space Agency's Office of the Space Regulator, CASA, Airservices Australia, and maritime authorities, submitting a final failure-investigation report to the regulator. What is unproven is product reliability and quality control: with zero successful orbital flights and the sole attempt lost to a subsystem fault involving externally sourced parts, there is no demonstrated launch reliability, no published qualification-test dataset, and no third-party certification of the vehicle's flight systems. These controls and gaps are enumerated in the trust/quality/compliance table.
    claimRefs: [CE027, CE028, CE029, CE030, CE031, CE032, CE033, CE034]
    tableRefs: [TE004]
  - id: "dependencies-and-technical-risks"
    title: "Critical Dependencies and Technical Risks"
    body: |
      Eris and ElaraSat sit atop a chain of external dependencies, several of which are already implicated in setbacks. The most acute is the external component supply chain: the TestFlight-1 root cause traced to electrical and thermal faults in oxidiser-pump motors and inverters that included externally sourced components, showing that even a vertically integrated vehicle inherits supplier risk on critical parts. Regulatory dependencies are equally binding — every launch requires Australian Space Agency permits and CASA airspace coordination, and the multi-year approval timeline already delayed the maiden flight by roughly 18 months. Physical dependencies include the Bowen site itself and its weather window, which repeatedly scrubbed 2025 attempts, plus the composite-structure and hybrid-propellant (hydrogen peroxide, solid-fuel) supply chains and a network of more than 500 Australian suppliers supporting a 200-plus-person team.

      A further structural dependency is that ElaraSat, though operational, currently reaches orbit only via third-party launch (SpaceX) because Eris is not yet flight-qualified; the vertical-integration thesis only closes once Eris is reliable. The critical dependency map below traces suppliers, regulators, facilities, and platform relationships. The dominant technical risk remains binary: an unproven orbital vehicle whose single flight failed on a propulsion subsystem, leaving valuation and the sovereign-launch thesis contingent on TestFlight-2 and subsequent flights demonstrating repeatable performance.
    claimRefs: [CE034, CE035, CE036, CE037, CE038, CE039, CE040]
    figureRefs: [FE003]
