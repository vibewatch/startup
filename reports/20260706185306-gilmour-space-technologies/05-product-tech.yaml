callouts:
  - calloutType: risk
    title: "Unproven Launch Reliability After a Propulsion Failure"
    body: "Eris has zero successful orbital flights; its sole attempt (TestFlight-1, July 2025) failed about 14 seconds in when oxidiser-pump electrical and thermal faults — including externally sourced components — starved two of four first-stage motors. Valuation and the sovereign-launch thesis hinge on TestFlight-2 demonstrating repeatable performance."
    claimRefs: [CE019, CE020, CE033]
  - calloutType: strength
    title: "Operational Satellite Bus and In-House Hybrid Propulsion"
    body: "ElaraSat MMS-1 has been operational in orbit since June 2025, giving Gilmour real orbital heritage independent of Eris, while in-house hybrid Sirius/Phoenix propulsion and composite manufacturing form a genuine technical and sovereign differentiator versus liquid-fuel small launchers."
    claimRefs: [CE006, CE012, CE028]
  - calloutType: insight
    title: "Vertical Integration Only Closes When Eris Flies"
    body: "The launch-vehicle + bus + spaceport thesis is compelling on paper, but ElaraSat still reaches orbit via SpaceX because Eris is not flight-qualified. The integration benefit is contingent on Eris achieving reliable orbit."
    claimRefs: [CE038, CE040, CE001]
  - calloutType: assumption
    title: "External Component Supply Chain Is a Live Risk"
    body: "Even a vertically integrated vehicle inherits supplier risk: the TestFlight-1 root cause lay in externally sourced pump motors and inverters. Diligence should verify supplier qualification and redesign of the oxidiser-pump subsystem before TestFlight-2."
    claimRefs: [CE021, CE034]
