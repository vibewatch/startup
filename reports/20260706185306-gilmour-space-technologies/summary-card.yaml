  topStrengths:
    - >-
      Deep, strategically aligned capital base: A$217M Series E co-led by the government's NRFC and Hostplus, with the
      Future Fund, QIC and multiple super funds, reflecting national-security demand for sovereign launch
    - >-
      Genuine sovereign moat — Australia's first licensed orbital spaceport (Bowen) and first orbital-class launch
      attempt from Australian soil, plus in-house hybrid propulsion and vertical integration
    - >-
      Adjacent revenue and orbit heritage de-risk the pre-launch story: ElaraSat MMS-1 operational in orbit via SpaceX,
      a A$17.6M RAAF contract, hypersonic test work, and a Space BD channel into Asia-Pacific
    - >-
      Substantial non-dilutive support (A$75M NRFC, A$52M ASMN grant, A$5M IGP) extends runway and signals policy
      commitment to a domestic launch capability
  topRisks:
    - >-
      Binary technical risk: Eris has never reached orbit; TestFlight-1 failed ~9-14s in on a first-stage oxidiser-pump
      fault, and the next attempt is not until late 2026
    - >-
      Unicorn (>A$1B) valuation set before a proven rocket — valuation rests heavily on forward expectations and is
      stretched on any near-term fundamentals
    - >-
      Formidable competition and sector mortality: Rocket Lab is far more mature, SpaceX rideshare pressures
      small-launch pricing, and Astra/Virgin Orbit/ABL show how often small-launch entrants fail
    - >-
      Capital intensity with undisclosed burn and runway; heavy dependence on continued government funding and grant
      milestones
    - >-
      Key-person concentration in the two founding brothers (commercial and technical leadership) with no disclosed
      succession plan, and single-site launch exposure at Bowen (weather/cyclone risk)
  unresolvedGaps:
    - >-
      Revenue, burn rate, cash runway and gross margin are undisclosed, so capital efficiency and time-to-orbit runway
      cannot be underwritten
    - Outcome and timing of Eris TestFlight-2 (late 2026 target) — the pivotal de-risking event for the entire thesis
    - Full Series E cap table, founder/investor equity splits, exact total-raised figure, and precise current headcount
    - Firm, revenue-bearing orbital launch contracts and backlog beyond letters of intent and channel partnerships
    - Detailed Eris unit economics and target per-launch pricing versus Rocket Lab Electron and SpaceX rideshare
