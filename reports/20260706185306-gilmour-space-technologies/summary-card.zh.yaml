  topStrengths:
    - 资本基础深，且与国家战略同向：A$217M Series E 由政府旗下 NRFC 与 Hostplus 共同领投，Future Fund、QIC 和多家 super funds 跟投，反映主权发射背后的国家安全需求
    - 主权护城河真实存在：澳大利亚首个获许可轨道级航天港 Bowen、澳洲本土首次轨道级发射尝试，再加上自研混合动力推进和垂直整合
    - 相邻收入和在轨履历给发射前故事降风险：ElaraSat MMS-1 已借 SpaceX 入轨运行，另有 A$17.6M RAAF 合同、高超音速测试工作，以及通过 Space BD 进入亚太的渠道
    - 大额非稀释性支持（A$75M NRFC、A$52M ASMN grant、A$5M IGP）拉长现金跑道，也显示政策层面对本土发射能力的承诺
  topRisks:
    - 技术风险高度二元：Eris 从未入轨；TestFlight-1 发射约 9–14 秒后因一级氧化剂泵故障失败，下一次尝试要到 2026 年底
    - 火箭尚未验证，估值已定在独角兽水平（>A$1B）；估值高度依赖远期预期，按任何短期基本面看都偏紧
    - 竞争强、行业淘汰率高：Rocket Lab 成熟得多，SpaceX 拼车压低小型发射定价，Astra / Virgin Orbit / ABL 也说明小型发射新进入者多容易失败
    - 资本开支重，但烧钱速度和现金跑道未披露；公司高度依赖持续政府资金和补助里程碑
    - 商业与技术领导集中在两位创始兄弟身上，未披露接班计划；发射也集中在 Bowen 单一站点，天气 / 气旋风险难以分散
  unresolvedGaps:
    - 收入、烧钱速度、现金跑道和毛利率均未披露，资本效率和撑到入轨前的时间无法承销
    - Eris TestFlight-2 的结果和时间点（目标为 2026 年底）仍未知，这是整套投资逻辑最关键的去风险事件
    - 完整 Series E 股权结构表、创始人 / 投资人持股拆分、精确累计融资额和当前准确员工数未披露
    - 除意向书和渠道合作外，已签约、可确认收入的轨道发射合同与 backlog 不清楚
    - Eris 详细单位经济，以及相对 Rocket Lab Electron 和 SpaceX 拼车的目标单次发射定价仍缺失
