    body: "Eris TestFlight-1 failed within ~14 seconds when two of four first-stage motors lost thrust to oxidiser-pump electrical/thermal faults, including externally sourced parts. With TestFlight-2 not due until late 2026, the central thesis rests on an unrepeated, unproven capability."
