  claims:
    - id: CR001
      statement: "Eris TestFlight-1 launched from the Bowen Orbital Spaceport on 30 July 2025 and failed within roughly 14 seconds, falling back near the pad without reaching orbit."
      type: third-party-reported
      topic: "technical risk"
      sourceRefs: [SR001, SR002, SR009, SR021]
      confidence: high
      freshness: recent
      answersQuestionRefs: [QR001, QR002]
    - id: CR002
      statement: "Gilmour's investigation found that about nine seconds after ignition one of four first-stage hybrid motors lost thrust and a second degraded near 17 seconds, with both failures traced to electrical and thermal faults in the oxidiser-pump subsystem, including externally sourced components."
      type: third-party-reported
      topic: "technical risk"
      sourceRefs: [SR006, SR002]
      confidence: high
      freshness: recent
      answersQuestionRefs: [QR001, QR013]
    - id: CR003
      statement: "Gilmour has never reached orbit, and management notes rocket companies typically need around three attempts to succeed, leaving orbital reliability unproven."
      type: third-party-reported
      topic: "technical risk"
      sourceRefs: [SR007, SR027]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QR002, QR020]
    - id: CR004
