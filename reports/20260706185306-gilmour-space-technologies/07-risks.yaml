      type: company-claimed
      topic: "technical risk"
      sourceRefs: [SR002]
      confidence: medium
      freshness: recent
      answersQuestionRefs: [QR001]
    - id: CR005
      statement: "The Eris launch slipped repeatedly — from an initial May 2024 target, through a licence issued only in November 2024, to scrubs on weather and a May 2025 power surge — and TestFlight-2 is guided to late 2026."
