    claimRefs: [CR015, CR016, CR017]
  - calloutType: insight
    title: "Single Site, Single Supplier, Single Family"
    body: "Three concentrations amplify each risk: one flight-critical component supplier (already implicated in the failure), one weather-exposed launch site at Bowen, and two founder brothers holding both commercial and technical authority."
