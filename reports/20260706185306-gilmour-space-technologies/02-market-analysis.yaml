callouts:
  - calloutType: insight
    title: "The Launch Market Is Far Smaller Than the Satellite Market It Serves"
    body: "Smallsat demand may reach US$32B by 2030, but the dedicated small-launch market Gilmour actually sells into is only ~US$1.8-2.2B today and grows far more slowly. Conflating the two overstates the addressable opportunity; the honest boundary is Asia-Pacific/Australian sovereign small launch."
    claimRefs: [CM001, CM002, CM025]
  - calloutType: strength
    title: "Sovereign-Capability Demand Is a Structural Tailwind"
    body: "Australia's A$9-12B decade-long space commitment, the 2026 Defence Industry Development Strategy, and a stated A$12B / 20,000-jobs sector goal by 2030 create durable, government-backed demand for exactly the domestic launch and satellite capability Gilmour is building."
    claimRefs: [CM009, CM010, CM014]
  - calloutType: risk
    title: "SpaceX Rideshare Undermines Dedicated Small-Launch Economics"
    body: "Transporter rideshare slots at a fraction of a dedicated launch create direct substitution and price pressure, and the small-launch 'graveyard' shows the segment's fragility. Absent a binding sovereign mandate, buyers can default to cheap foreign rideshare."
    claimRefs: [CM024, CM025, CM012]
  - calloutType: assumption
    title: "Gilmour's SAM/SOM Cannot Be Isolated From Public Data"
    body: "Published analyst reports size global and regional markets but not the Australian sovereign-launch niche. The serviceable and obtainable market are treated as diligence gaps requiring management's own model and contracted pipeline to confirm."
    claimRefs: [CM015, CM011, CM029]
