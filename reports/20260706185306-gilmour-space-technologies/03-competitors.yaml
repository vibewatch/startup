    body: "Gilmour's differentiation is a domestically owned Australian launch stack backed by government capital (A$75M NRFC) and a A$217M Series E, giving it deeper funding than smaller European entrants and a sovereignty narrative that price-based rivals cannot copy for allied government payloads."
    claimRefs: [CP025, CP038]
  - calloutType: risk
    title: "Rocket Lab Dominance Against Zero Flight Heritage"
    body: "Rocket Lab has 91 Electron launches, a US$2.2B backlog and deep national-security contracts, while Gilmour has no orbital successes after TestFlight-1 failed ~14 seconds in. On the decisive buying criterion — proven, reliable access — Gilmour is years behind the incumbent."
    claimRefs: [CP022, CP004]
  - calloutType: risk
    title: "Rideshare Commoditisation From Below"
    body: "SpaceX Transporter rideshare (~US$6,000/kg; US$350k for 50 kg) undercuts every dedicated small launcher by roughly 10-20x per kilogram. Unless Gilmour defends an orbit-precision and sovereignty premium, its addressable, price-sensitive demand is structurally exposed to substitution."
    claimRefs: [CP035, CP018]
  - calloutType: insight
    title: "The Small-Launch Graveyard Is a Durability Warning"
    body: "Astra (privatised for ~US$10-12M), Virgin Orbit (bankrupt), ABL (~US$461M raised, pivoted to missiles) and Relativity's cancelled Terran-1 show how many funded small launchers fail. Gilmour's ~13-year path to a failed maiden flight makes TestFlight-2 an existential proof point."
    claimRefs: [CP024, CP023]
