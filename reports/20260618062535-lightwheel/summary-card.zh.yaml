  topStrengths:
    - Lightwheel 看起来不是卖单一工具模块，而是横跨仿真资产、人类数据采集、评估和部署反馈，拼出了差异化全栈位置。
    - 2026 年 Q1 约 US$100M 订单和 FY2025 增长 10x 的说法，说明公司比许多物理 AI 基础设施同行更早把行业热度变现。
    - NVIDIA Newton、Isaac Lab-Arena 和 Hugging Face LeRobot 的生态信号，提升了技术可信度和开发者心智，不像典型中国机器人私营初创。
  topRisks:
    - 公开记录没有经审计收入、ARR、利润率、留存、股权结构或 post-money 估值披露，单靠公开证据无法做价格纪律。
    - 融资数据在不同来源间不一致：Crunchbase 仍标为 Seed 阶段，而 2026 年来源称其完成两轮 Series A 并成为独角兽。
    - 客户证据仍浅：公开材料强调生态 logo 和 PeritasAI 部署目标，但没有披露客户数、合同金额或生产留存。
  unresolvedGaps:
    - FY2025 和 2026 年 Q1 经审计确认收入，包括订单、收入与任何经常性 ARR 基础的区分
    - 完整法律实体图、离岸持股结构和 2026 年融资轮的清算优先权堆叠
    - 具名客户清单，包括合同规模、生产状态、续约行为，以及区分试点和规模化部署的证据
