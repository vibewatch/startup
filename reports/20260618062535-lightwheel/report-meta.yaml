  customerFocus: Frontier robotics and world-model teams plus industrial enterprises deploying physical AI systems in manufacturing, logistics, and healthcare-adjacent workflows
  businessModel: Enterprise software and services mix spanning simulation-asset licensing, synthetic and human-data generation, evaluation programs, and deployment-oriented infrastructure projects
