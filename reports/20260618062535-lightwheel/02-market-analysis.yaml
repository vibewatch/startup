- id: buyers-users-and-adoption-path
  title: Buyers, Users, and Adoption Path
  body: 'Lightwheel''s source set points to a two-track buying motion. Frontier labs and model teams need higher-quality data,
    harder benchmarks, and faster evaluation loops because open foundation models and cross-robot datasets have raised the
    ceiling for experimentation. Industrial adopters come from a different angle: they want to reconstruct real workspaces,
    validate policies before hardware touches production, and expand deployment gradually once failure modes are visible.
    The users inside these accounts are likely robotics engineers, simulation teams, data operations leads, and evaluation
    owners. The payers and sponsors are more likely to sit in AI infrastructure, automation, manufacturing operations, or
    corporate transformation budgets. That split matters because Lightwheel is not selling one-off datasets alone. It is selling
    a workflow that connects environment capture, behavior data, and readiness diagnostics. The consequence is a market where
    commercial success depends as much on integration and process fit as on raw model performance claims.'
  claimRefs:
  - CM020
  - CM021
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
  tableRefs:
  - TM003
  figureRefs:
  - FM003
  - FM004
- id: drivers-constraints-and-diligence-gaps
  title: Drivers, Constraints, and Diligence Gaps
  body: 'The strongest adoption drivers are easy to identify. More capable open models, expanding robot datasets, and rising
    automation demand all make simulation, data quality, and benchmark trust more important, not less. Genesis, the VLA survey,
    and Lightwheel''s own RoboFinals and EgoSuite materials all frame the same problem from different angles: robotics teams
    cannot scale iteration if data is sparse, evaluation is shallow, or simulators are untrusted. Constraints are equally
    important. The European AI Act raises transparency and oversight burdens for high-risk systems, DigiChina highlights persistent
    uncertainty around cross-border data transfer rules, and the open-source ecosystem sets a low-cost substitute floor under
    core infrastructure. The result is a market with real demand but imperfect monetization clarity. The biggest unresolved
    questions are realized pricing by product layer, customer mix by segment, and how much of Q1 order volume converts into
    recurring, durable software-style economics rather than project-heavy integration revenue. That makes diligence on implementation
    burden and renewal evidence particularly important. and commercialization.'
