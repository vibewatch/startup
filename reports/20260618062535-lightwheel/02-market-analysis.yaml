- id: demand-signals-and-sizing-lenses
  title: Demand Signals and Sizing Lenses
  body: The market is real, but its size cannot be described with one clean headline number. The best public proof of current
    demand is not a third-party TAM deck; it is the pattern of infrastructure spending visible in Lightwheel's own order narrative
    and in broader embodied-AI capital formation. PR Newswire, Morningstar, and Robotics & Automation News all repeated Lightwheel's
    claim of roughly $100 million in Q1 2026 orders across simulation, data, evaluation, and deployment systems, while Crunchbase
    documented heavy 2026 venture inflows into China's robotics sector. Those data points show money moving into the stack,
    but they still do not isolate the exact overlap market Lightwheel serves. Open-source model and dataset projects further
    complicate sizing because they expand the user base while shrinking the purely proprietary revenue pool. Investors should
    therefore treat Lightwheel's market as a constrained infrastructure slice within a larger embodied-AI expansion, not as
    a generic robotics TAM shortcut.
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM038
  - CM039
  - CM040
