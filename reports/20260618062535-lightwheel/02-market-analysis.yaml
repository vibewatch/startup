company:
  name: Lightwheel
chapter:
  number: 2
  title: Market Analysis
  summary: 'Lightwheel operates in a narrow but timely embodied-AI infrastructure layer: simulation assets and scenes, robot-usable
    data generation, industrial-grade evaluation, and deployment-enablement workflows. Demand signals are strong — Lightwheel''s
    roughly $100M Q1 2026 order claim, heavy 2026 robotics funding, open-model scaling, and broader automation momentum all
    point the same direction — but the public corpus does not support a clean standalone TAM for Lightwheel''s exact overlap
    market. Buyers split between frontier labs that need more data and harder benchmarks and industrial operators that need
    validated deployment workflows, while adoption is constrained by simulator trust, regulatory compliance, data-transfer
    friction, and the low-cost floor set by open-source alternatives.'
sections:
- id: market-boundary-and-stack
  title: Market Boundary and Infrastructure Stack
  body: Lightwheel does not fit neatly inside a single software bucket. Its own materials describe a stack that starts with
    SimReady assets and scenes, moves through egocentric human data capture and annotation, and culminates in industrial-grade
    evaluation and deployment workflows. That means the relevant market boundary is not the whole humanoid or robotics market
    and not a narrow simulation engine category either. It is the overlap where robotics teams are paying to recreate operating
    environments, generate robot-usable data, benchmark model behavior, and then connect those artifacts into deployment.
    The same sources also imply clear exclusions. Robot OEM revenue, chip manufacturing, and general AI software are too broad,
    while free community frameworks already cover many primitives. Lightwheel therefore sells into a narrower embodied-AI
    infrastructure layer whose value rests on integration, enterprise readiness, and the ability to turn multiple open components
    into a usable closed loop.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  tableRefs:
  - TM001
  figureRefs:
