- id: TM004
  title: Growth Drivers and Constraints Table
  columns:
  - Driver / Constraint
  - Direction
  - Why It Matters
  - Timing
  - Diligence Ask
  rows:
  - - Open models and large shared datasets
    - Positive
    - Increase the need for scalable data QA and harder evaluation
    - Current
    - How much demand is attached to open-model ecosystems versus closed labs?
  - - Simulation as first deployment environment
    - Positive
    - Lets buyers move validation ahead of hardware deployment
    - Current
    - What portion of revenue is software-like versus services-heavy setup?
  - - Rising industrial automation demand
    - Positive
    - Expands downstream buyer base for deployment-enablement infrastructure
    - Near-term
    - Which verticals are converting first into repeat buyers?
  - - Simulator trust gap and weak legacy benchmarks
    - Negative
    - Buyers will not pay premium prices if simulation does not predict real-world outcomes
    - Current
    - What independent evidence validates Lightwheel's claimed sim-real correlation path?
  - - AI Act and data-transfer compliance
    - Negative
    - Raises oversight and cross-border data friction for sensitive deployments and collection programs
    - Current to medium-term
    - Which products or regions face the heaviest compliance burden?
  - - Open-source substitute floor
    - Negative
    - Compresses monetizable SAM unless Lightwheel wins on integration and enterprise readiness
    - Current
    - How much implementation burden do customers avoid by buying versus building?
  notes: The main uncertainty is not whether demand exists, but whether Lightwheel can capture enough of that demand above
    an open-source baseline to earn durable infrastructure economics.
