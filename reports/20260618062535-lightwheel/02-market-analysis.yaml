  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: monetization-by-layer
    missingEvidence: Realized pricing, gross margin, and recurring revenue mix by assets, data, evaluation, and deployment
      products.
    whyItMatters: Without monetization detail, investors cannot tell whether the closed-loop story behaves like software,
      services, or project revenue.
    diligencePath: Request product-level pricing architecture, contract structure, and cohort-level renewal data from management.
  - type: missing-source
    severity: material
    topic: customer-mix
    missingEvidence: Named customer split between frontier labs and industrial operators, plus concentration and deployment
      stage by account.
    whyItMatters: The buyer map and valuation logic differ materially if order volume is concentrated in a few experimental
      programs.
    diligencePath: Request customer segmentation by sector, ACV, deployment phase, and referenceability.
  - type: missing-source
    severity: minor
    topic: serviceable-market-sizing
    missingEvidence: Independent market research that isolates the overlap of simulation assets, robot data, evaluation, and
      deployment tooling.
    whyItMatters: Current public evidence supports only a constrained qualitative SAM narrative.
    diligencePath: Build a bottoms-up market map from target accounts, product modules, and workflow substitution paths rather
      than relying on robotics TAM decks.
