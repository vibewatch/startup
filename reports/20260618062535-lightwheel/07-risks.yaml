  - id: partner-commercial
    title: Partner, customer, and model risk
    body: >-
      Lightwheel's commercial upside is linked to the same ecosystem dependencies that can weaken negotiating leverage.
      LW-BenchHub and Isaac Lab Arena are explicitly tied to NVIDIA Isaac Lab and Newton. RoboFinals also cites MuJoCo
      and Genesis support, while broader robotics buyers can choose community tooling like Open Robotics, Gazebo,
      LeRobot, or OpenVLA-centered stacks instead of buying a fully packaged vendor workflow. That means Lightwheel must
      keep winning on integration, operations, and enterprise usability rather than on exclusive access to the core tools.
      The public customer evidence is still thin: the company claims trust from leading teams and names Qwen as a partner,
      but the corpus does not show named long-duration customer contracts, retention data, pricing power, or revenue mix
      by module. If buyers conclude that the open ecosystem plus internal engineering can replicate enough of Lightwheel's
      value, margin and renewal risk rise quickly. The substitution threat is highest where buyers already employ strong
      platform engineers and can assemble enough of the stack from open frameworks plus internal data operations.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
      - CR034
      - CR044
      - CR045
      - CR035
      - CR044
      - CR045
    tableRefs:
      - TR003
    figureRefs:
      - FR003
  - id: mitigation-kill-criteria
    title: Mitigations, monitoring indicators, and kill criteria
    body: >-
      The encouraging point is that Lightwheel already markets several mitigation levers: commercially licensed assets,
      on-prem deployment, multi-engine evaluation, and explicit sim-real calibration work. Those levers reduce some buyer
      objections, but they do not replace evidence. The right underwriting frame is conditional. Investors should require
      tangible legal, security, and validation artifacts rather than accepting architecture claims at face value.
      Monitorable triggers should focus on whether Lightwheel can show clean data-rights documentation, a credible
      export-control and privacy program, independent reference customers, and proof that RoboFinals produces useful,
      stable results outside marketing demos. If those proofs are absent, the residual risk remains high because the
      business model relies on enterprise trust in evaluation and data infrastructure rather than on a low-friction
      self-serve software motion. That is especially true in healthcare and industrial settings where validation misses
      can create workflow, safety, and liability problems that are expensive to unwind after deployment.
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
      - CR042
      - CR043
    tableRefs:
      - TR005
