chapter:
  order: 7
  number: 7
  title: Risks
  summary: >-
    Lightwheel's highest risks are not generic startup risks; they are concentrated in cross-border data governance,
    export-control uncertainty, benchmark and simulation-maturity risk, and dependence on the NVIDIA plus open-source
    robotics ecosystem that underpins its product story. Mitigants exist—commercial licensing claims, on-prem
    deployment, multi-engine benchmarking, and Real2Sim calibration—but the public corpus still lacks the compliance,
    security, and independent validation artifacts needed to underwrite those mitigants as mature controls.
sections:
  - id: regulatory-legal
    title: Regulatory and legal risk
    body: >-
      Lightwheel's public materials describe global egocentric data collection, commercially licensed simulation assets,
      enterprise AI infrastructure, and potential deployment into security-sensitive customer environments. That mix puts
      the company close to several legal regimes even before customer-specific use cases are known. The EU AI Act creates
      obligations for AI systems placed on the market or used in the Union, especially where safety, logging,
      transparency, and human oversight matter. China's outbound-data regime remains more permissive than its 2022
      version, but the Stanford DigiChina analysis still highlights uncertainty in how cross-border business data is
      reviewed and interpreted. U.S. export-control exposure matters because Lightwheel's stack touches robotics
      simulation, data, and potentially dual-use technical know-how, while the public corpus does not disclose a formal
      export-compliance program. The legal risk is not that any violation is proven; it is that the company is operating
      in a category where customers and investors will expect clean answers on privacy, licensing, data rights, export
      scope, and jurisdictional controls before production-scale deployment.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR012
      - CR046
    tableRefs:
      - TR001
    figureRefs:
      - FR002
  - id: technical-operational
    title: Technical, operational, and quality risk
    body: >-
      Lightwheel's product promise depends on simulation quality, data quality, and benchmark validity all at once. The
      open robotics literature still describes benchmarking and sim-to-real transfer as difficult, data-hungry, and far
      from solved. Lightwheel's own pages underscore that reality by highlighting Real2Sim calibration and a planned
      real-world correlation benchmark—features that would not be needed if public benchmark validity were already
      settled. Operationally, EgoSuite's scale claims imply a complex field-operations machine spanning many tasks,
      countries, environments, and hardware devices. That is a strength if controlled well, but it also creates
      annotation drift, hardware calibration, safety, staffing, and cross-country process risks that are not visible in
      public QA artifacts. Finally, multi-engine support is strategically smart but expensive to maintain: each simulator
      or benchmark backend introduces versioning, integration, and result-consistency risk.
    claimRefs:
