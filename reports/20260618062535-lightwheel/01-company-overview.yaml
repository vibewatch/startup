- id: coverage-gaps-and-adverse-context
  title: Coverage gaps, regulatory exposure, and how to use this chapter
  body: 'The central limitation of the current record is not the absence of activity; it is the absence of standardized disclosure. Public sources provide strong evidence that Lightwheel exists, launched named products, raised capital, and won at least some enterprise business. They do not provide a filing-grade view of customer count, lifetime capital raised, headcount, board oversight, or realized revenue. Even on scale metrics, the public record is partly self-referential: the company and sympathetic coverage cite large data-hour and environment counts, but there is no independent ledger validating named customers, utilization, or contract economics. That means later chapters should restate only the verified pieces and preserve the rest as company-claimed or unresolved.


    Regulatory context also matters earlier than the company acknowledges in marketing copy. The EU AI Act expands transparency and risk-management requirements for higher-risk AI systems, while the U.S. EAR remains a live cross-border compliance surface for advanced AI and robotics-related trade. Lightwheel may still be early enough that these regimes do not yet bind every product module directly, but they clearly shape future diligence on export exposure, training-data governance, and international deployment. This chapter therefore serves as a reusable ground-truth set with explicit caveats: later chapters can lean on the company''s identity, funding momentum, and product chronology, but should not inherit unverified leadership depth, customer scale, or market-leadership claims as settled fact.'
