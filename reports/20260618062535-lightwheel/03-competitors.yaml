  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lightwheel-win-rates
    missingEvidence: Competitive win-rate data versus open-source builds, NVIDIA-centric stacks, or specific evaluation vendors.
    whyItMatters: Without real displacement or conversion data, moat durability remains mostly analytical rather than empirically
      proven.
    diligencePath: Request lost-deal analysis, pilot-to-production conversion, and competitor mentions from CRM data.
  - type: missing-source
    severity: material
    topic: pricing-comparison
    missingEvidence: Comparable realized pricing for Lightwheel versus integrated or self-built alternatives.
    whyItMatters: Open substitutes can be cheap in software terms but expensive in engineering time; the corpus does not quantify
      that tradeoff.
    diligencePath: Build a workflow TCO model using customer references, implementation timelines, and cloud / staffing assumptions.
  - type: missing-source
    severity: minor
    topic: independent-sim-real-validation
    missingEvidence: Independent third-party validation of Lightwheel's claimed sim-real correlation and benchmark predictive
      power.
    whyItMatters: Evaluation trust is a key competitive dimension and cannot rest only on vendor-authored claims.
    diligencePath: Request external benchmark studies, customer case studies with before/after metrics, or third-party audits
      of evaluation methodology.
