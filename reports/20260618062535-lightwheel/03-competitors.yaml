company:
  name: Lightwheel
chapter:
  number: 3
  title: Competitors
  summary: 'Lightwheel competes against a layered alternative set: the broad NVIDIA Isaac stack, fast-moving simulation challengers
    such as Genesis, modular open ecosystems around MuJoCo and Gazebo, and open data/model stacks such as LeRobot, Open X,
    and OpenVLA. Its wedge is not ownership of basic simulation primitives but the packaging of commercially licensed assets,
    global egocentric data operations, industrial-grade multi-backend evaluation, and deployment workflow into one enterprise-facing
    product. That wedge is real but conditional because buyers can multi-home across open components, while NVIDIA remains
    both a strategic partner and a platform-level competitive threat.'
sections:
- id: landscape-and-solution-classes
  title: Landscape and Solution Classes
  body: 'Lightwheel is not competing against one clean peer set. Buyers can solve the same job through at least five routes:
    the NVIDIA Isaac stack, high-performance open simulation platforms such as Genesis, modular physics and benchmark ecosystems
    around MuJoCo, ROS-native open platforms built around Gazebo, and data or model ecosystems such as LeRobot, Open X, and
    OpenVLA. Internal build is the sixth force sitting underneath all of them. That matters because Lightwheel''s commercial
    advantage is not basic access to simulation or model artifacts; those components are already available. The real question
    is whether a buyer needs a vendor to connect world reconstruction, behavior data, evaluation, and deployment into one
    workflow. In that framing, Lightwheel competes partly against named vendors and partly against the buyer''s confidence
    that it can compose an equivalent stack from open pieces without losing too much time, realism, or benchmark discipline.'
  claimRefs:
  - CP001
  - CP002
  - CP007
  - CP011
