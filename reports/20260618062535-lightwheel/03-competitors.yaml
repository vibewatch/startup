- id: switching-costs-and-status-quo-substitutes
  title: Switching Costs and Status-Quo Substitutes
  body: Switching costs exist, but they are not absolute. Lightwheel benefits when a customer has already recreated environments,
    aligned task data, and built evaluation logic around one workflow, because replacing that loop takes time and operational
    energy. Yet the same source set shows why multi-homing stays plausible. Isaac, MuJoCo, Gazebo, LeRobot, and Open X are
    all open components, and RoboFinals itself supports multiple simulation backends rather than enforcing one proprietary
    engine. That lowers the penalty for buyers to keep one foot in open tooling even when they buy a commercial layer. Teams
    can also start from the status quo — ROS-native stacks, open benchmarks, or modular model pipelines — and add vendor modules
    only where pain becomes acute. The practical result is that Lightwheel's moat is likely strongest in accounts that value
    reduced assembly burden and weakest in accounts that treat workflow assembly as core internal capability.
  claimRefs:
  - CP016
  - CP018
  - CP028
  - CP031
  - CP032
  - CP035
  tableRefs:
  - TP004
- id: moat-durability-and-adverse-signals
  title: Moat Durability and Adverse Signals
  body: 'The adverse case is credible and should not be softened. Genesis is trying to own trusted high-speed evaluation,
    MuJoCo-based stacks keep getting easier to use, ROS and Gazebo remain deeply embedded defaults, and open data and model
    ecosystems continue to erode the scarcity of component layers. Even NVIDIA is both partner and threat: Lightwheel benefits
    from building on Isaac Lab and Newton, but those same layers give NVIDIA and its surrounding community enormous influence
    over the core stack. Lightwheel still has a meaningful wedge because it commercializes licensed assets, large-scale field
    data, and industrial-grade evaluation in one package. But the wedge is conditional. It looks durable only when buyers
    need a closed-loop workflow, enterprise support, or deployment readiness faster than they can assemble it themselves.
    If the open ecosystem keeps absorbing more of those functions, Lightwheel''s differentiation will narrow toward execution
    quality, domain specialization, and customer intimacy rather than toward proprietary technology alone. Buyers should assume
    several viable fallback routes exist if one vendor promise disappoints. during procurement. consistently.'
