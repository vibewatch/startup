  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited income statement, balance sheet, and cash-flow statement for 2025 and latest 2026 period.
    whyItMatters: Without audited statements, the chapter cannot underwrite revenue quality, margin, or runway.
    diligencePath: Request audited historical financials plus the latest management accounts.
    relatedQuestionRefs:
    - QI013
    - QI014
    - QI017
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized contract values, product-level revenue mix, discounting, and gross-margin bridge by stream.
    whyItMatters: A $1M budget floor and large orders do not reveal whether revenue is software-like, service-heavy, or hardware-adjacent.
    diligencePath: Request top-20 contracts, pricing schedules, and product gross margin by line.
    relatedQuestionRefs:
    - QI007
    - QI011
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash on hand, monthly burn, debt obligations, and explicit runway.
    whyItMatters: Fresh financing alone does not establish whether the company is de-risked or simply bridging to the next round.
    diligencePath: Request treasury summary, debt schedule, and 18-month cash plan.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI019
  - type: conflicting-data
    severity: material
    topic: orders
    missingEvidence: A reconciled Q1 2026 orders figure and clear currency translation basis.
    whyItMatters: The difference between approximately $100M and 550 million yuan changes annualized-order and valuation narratives materially.
    diligencePath: Ask management for the exact booking figure, currency, booked period, and revenue-recognition relationship.
    relatedQuestionRefs:
    - QI004
    - QI005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Named top customers, deployment status, and concentration metrics by revenue share.
    whyItMatters: Orders can look strong even if a small number of strategic buyers dominate the book.
    diligencePath: Request top-10 customer list, backlog, and renewal / expansion cohorts.
    relatedQuestionRefs:
    - QI025
