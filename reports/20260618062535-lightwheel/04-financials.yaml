- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue and margin
    - Cannot value the business on realized economics rather than bookings rhetoric
    - Request audited FY2025 / YTD2026 statements and product gross-margin bridge
  - - Cash / burn / runway
    - Cannot judge whether 2026 financing solved or merely delayed capital needs
    - Request treasury report, cash forecast, and monthly burn history
  - - Pricing realization by stream
    - Cannot separate high-margin software from services-heavy delivery
    - Request contract samples, discount policy, and ASP by product line
  - - Customer concentration and backlog
    - Cannot assess churn, renewal, or dependence on a few strategic buyers
    - Request top-customer schedule and signed backlog by stage
  - - Orders reconciliation and FX basis
    - Cannot annualize or compare Q1 traction reliably
    - Request exact order-book definition, currency, and scope reconciliation
  notes: These are the core blockers that prevent open-source underwriting from becoming a financial judgment.
