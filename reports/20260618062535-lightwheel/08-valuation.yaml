  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: post-money-valuation
      missingEvidence: >
        The confirmed post-money valuation for Lightwheel's March 2026 and May 2026 Series A
        rounds, from a primary source such as a term sheet, investor letter, or secondary
        transaction pricing.
      whyItMatters: >
        The unicorn claim cannot be verified, acted upon, or incorporated into any valuation model
        without a confirmed post-money mark. Entry price discipline requires knowing where the last
        round was priced relative to the operational KPIs.
      diligencePath: >
        Obtain term sheets or investor confirmation letters from existing round participants;
        check secondary platforms (Forge, Equity Zen, Liquidnet) for any Lightwheel secondary
        transactions; request post-money mark directly from CFO with board-approved valuation.
      relatedQuestionRefs:
        - QV002
        - QV015

    - type: private-evidence-only
      severity: blocking
      topic: cap-table-preference-terms
      missingEvidence: >
        Full cap table for Lightwheel including all existing shareholders, preference rights,
        liquidation waterfall, antidilution provisions, and pro-rata rights by round.
      whyItMatters: >
        Without preference terms, the effective entry price and distribution of exit proceeds
        cannot be modeled. Heavy preference stacks from state-linked investors could materially
        reduce common-equity returns even in successful exit scenarios.
      diligencePath: >
        Request cap table model from CFO; verify with legal counsel; confirm with each lead
        investor the specific terms of their round; check articles of association for any
        protective provisions or governance rights.
      relatedQuestionRefs:
        - QV019
        - QV026

    - type: conflicting-data
      severity: material
      topic: funding-history-discrepancy
      missingEvidence: >
        A reconciliation of the Crunchbase Seed round from August 2024 with the March 2026
        Series A narrative, clarifying whether these are separate legal entities, different
        funding tranches, or a data ingestion error.
      whyItMatters: >
        If there is a separate earlier entity with its own funding history, the cap table and
        total funding figure may be materially different from what Western databases report.
        Unresolved, this creates a material due diligence red flag.
      diligencePath: >
        Ask Lightwheel's CFO to provide the complete funding history for all legal entities
        in the corporate structure; compare with Crunchbase and Tracxn entries for both
        "Lightwheel" and "Light Wheel Intelligence"; reconcile any differences in legal name
        and entity type.
      relatedQuestionRefs:
        - QV032

    - type: missing-source
      severity: material
      topic: revenue-run-rate
      missingEvidence: >
        Audited or management-confirmed FY2025 revenue, Q1 2026 recognized revenue (as distinct
        from orders), and gross margin or unit economics for Lightwheel's main product lines.
      whyItMatters: >
        All valuation scenarios rest on assumed ARR; without a confirmed figure, the bull, base,
        and bear cases cannot be distinguished, and no revenue multiple can be meaningfully applied.
      diligencePath: >
        Request management accounts with auditor review letter; ask CFO for revenue recognition
        policy distinguishing orders, deferred revenue, and recognized revenue; obtain a billings
        schedule broken down by contract type.
      relatedQuestionRefs:
        - QV006

    - type: missing-source
      severity: material
      topic: secondary-market-pricing
      missingEvidence: >
        Any secondary market transaction, tender offer, or investor-to-investor transfer for
        Lightwheel shares that would provide an independent third-party valuation mark.
      whyItMatters: >
        A secondary transaction is the most reliable independent valuation signal for a private
        company; its absence means all valuation marks are first-party or press-reported estimates.
      diligencePath: >
        Search Forge Global, EquityZen, and Liquidnet for Lightwheel secondary listings; ask
        existing investors whether any secondary transactions have occurred; check with placement
        agents who managed the 2026 rounds.
      relatedQuestionRefs:
        - QV015

    - type: enumeration-incomplete
      severity: material
      topic: comparable-valuation-set
      missingEvidence: >
        Private-market comparables for physical AI simulation and synthetic data infrastructure
        companies with disclosed valuation and revenue data, such as Covariant, Dextrous, Robust
        AI, Synthesis AI, or other companies in the same sub-vertical.
      whyItMatters: >
        The public comp set (Symbotic, Teradyne, Serve) spans a 100x valuation range and has
        limited business model similarity to Lightwheel; private comparables would provide
        more relevant revenue multiples for a stage-appropriate valuation approach.
      diligencePath: >
        Pull PitchBook or Crunchbase Pro data for physical AI data and simulation companies that
        raised Series A or B rounds in 2025-2026; request disclosed revenue or ARR from investors
        in comparable companies who can speak to the sector benchmarks.
      relatedTableRefs:
        - TV004
