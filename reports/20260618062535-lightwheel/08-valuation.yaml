artifact: valuation
slug: lightwheel
runDate: "2026-06-18"
company:
  name: Lightwheel
chapter:
  number: 8
  title: Valuation
  summary: >
    Lightwheel's unicorn claim (>$1B implied valuation after combined Series A rounds totaling
    ~RMB 1B / ~$145M) is structurally plausible given $100M Q1 2026 orders, 10x FY2025 revenue
    growth, and a strong robotics funding environment, but is not independently verified: no ARR,
    cap table, revenue multiple, or post-money valuation is publicly disclosed; a Crunchbase seed
    record conflicts with the 2026 Series A narrative; and comparable public companies (Symbotic
    $24B, Teradyne $64B, Serve Robotics $0.56B) span a 100x range that cannot anchor Lightwheel
    without a revenue figure. The practical recommendation is research-more.

sections:
  - id: financing-context-valuation-claims
    title: Financing Context and Valuation Claims
    body: |
      Lightwheel has raised total funding reported at $145M across two disclosed rounds in
      2026 per Tracxn, with the first round closing March 11, 2026 and the second closing
      May 26, 2026, both characterized as Series A. Chinese-language sources describe a combined
      A++ and A+++ financing totaling RMB 1 billion (~$137-145M at prevailing early-2026 rates),
      which the company used to claim unicorn status as "the world's first embodied data unicorn."
      Ant Group led the latest round per Gasgoo; strategic investors include New Hope Group,
      AUX Group, and Dingbang Investment (the San'an Optoelectronics chairman's family office);
      financial investors include CCB Sci-Tech, Guofang Innovation, Daohe Long-term Investment,
      and Qingxin Capital. The investor roster spans Chinese state-linked funds, industrial
      conglomerates, and private family offices, suggesting a strategic rather than purely
      financial syndicate. A critical discrepancy exists: Crunchbase's organization profile
      for Lightwheel (as "Light Wheel Intelligence") records the last funding type as "Seed"
      from August 2024 at odds with the March 2026 Series A narrative, raising questions about
      data quality or multi-entity structure. Critically, no post-money valuation figure from
      either 2026 round is publicly disclosed; no term sheet, investor letter, or secondary
      transaction provides an independent mark. PitchBook's profile is paywalled; Tracxn shows
      paywalled funding amounts behind placeholder numerals. The unicorn claim therefore rests
      entirely on Lightwheel's own press and Chinese-language third-party articles without
      independent corroboration.
    claimRefs:
