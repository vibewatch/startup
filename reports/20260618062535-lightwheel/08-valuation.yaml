  - id: scenarios-recommendation
    title: "Bull / Base / Bear Scenarios and Recommendation"
    body: |
      The practical recommendation for Lightwheel is research-more. The investment case is
      structurally compelling — full-stack physical AI infrastructure at the intersection of
      frontier AI data needs and industrial automation deployment, validated by record order
      volume and an ecosystem that includes NVIDIA, Hugging Face, and a roster of leading
      robotics companies. The risk case is equally clear: no ARR, no retention data, no cap
      table, no post-money valuation verification, and a significant governance transparency
      gap for a China-domiciled entity targeting international institutional capital. Under a
      bull scenario ($80-100M ARR, 12-15x multiple), implied valuation reaches $960M-$1.5B,
      supporting the unicorn claim and then some. Under a base scenario ($40-50M ARR, 8-10x
      multiple), implied valuation falls to $320-500M — below the unicorn threshold and
      implying a premium entry price. Under a bear scenario ($10-30M ARR, 3-5x multiple due
      to governance discount and multiple compression), implied valuation falls to $30-150M —
      representing material downside from the $1B+ entry price. The key determining variable is
      not the market opportunity (which is demonstrably large and well-funded) but the conversion
      of Q1 2026 orders into durable recurring revenue. A single data room session with audited
      financials, cap table, and revenue recognition policy would move the call materially toward
      buy or avoid. Until that evidence exists, no price-sensitive recommendation is supportable.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
