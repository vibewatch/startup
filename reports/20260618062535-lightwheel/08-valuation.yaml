  - id: public-comparable-benchmarks
    title: Public Comparable Benchmarks and Market Context
    body: |
      Lightwheel operates at the intersection of simulation software, synthetic data, and physical
      AI infrastructure — a category without a direct listed comparable. The most instructive public
      benchmarks are Symbotic (SYM, $24.24B market cap in June 2026), Teradyne (TER, $63.95B
      market cap), and Serve Robotics (SERV, $0.56B market cap). Symbotic provides AI-powered
      warehouse automation at $1.7B+ annual revenue, illustrating the scale a successful physical
      AI infrastructure company can reach; its roughly 14x revenue multiple implies Lightwheel
      would need $70M+ in revenue to justify a $1B valuation at similar multiples. Teradyne, a
      mature industrial automation and robotics test equipment leader with $2.7B revenue, is a
      distant comparable but illustrates peak valuations in the sector. Serve Robotics, the most
      stage-comparable public entity as an early-stage physical AI company, trades at $0.56B on
      minimal revenue — setting a floor reference for unscaled physical AI infrastructure. In the
      private market, Crunchbase data shows China-based embodied AI companies routinely minting
      $1-2B valuations on early-stage Series A rounds in 2026, suggesting Lightwheel's unicorn
      claim is consistent with peer comps in the Chinese funding market, even if not supported by
      independently verifiable revenue multiples. IFR preliminary data confirms US robot
      installations rose 11% in 2025 to 38,000 units, supporting the macro growth narrative that
      underpins sector valuations.
