  - id: diligence-asks-kill-triggers
    title: Final Diligence Asks and Thesis-Break Triggers
    body: |
      Six diligence asks are blocking before any priced investment decision can be made.
      The most critical are: confirmation of post-money valuation from both 2026 rounds with
      independent verification, audited FY2025 revenue and Q1 2026 recognized revenue
      distinguishing orders from ARR, full cap table with preference stack and liquidation
      waterfall, executed PeritasAI contract versus MOU, and a governance and entity structure
      review covering the relationship between the Beijing WFOE and any offshore holding company.
      Thesis-break triggers are operationally defined: a down-round in the next financing event
      would confirm valuation overstatement; PeritasAI deployment delay of 12+ months would
      remove the primary named customer reference; revenue disclosure below $20M ARR would
      collapse the bull and base cases; US-China tech decoupling that restricts US frontier AI
      teams from using Chinese-domiciled AI data infrastructure would materially reduce the
      addressable customer pool; and deprecation of the LeIsaac/Newton ecosystem relationship
      with NVIDIA or Hugging Face would undermine the developer-mindshare moat. These triggers
      should be monitored on a quarterly basis through public signals (GitHub activity, NVIDIA
      documentation updates, Chinese regulatory filings, Lightwheel press page) even before
      a formal investment decision is made.
    claimRefs:
      - CV025
      - CV037
      - CV038
      - CV043
    tableRefs:
      - TV005
      - TV006

