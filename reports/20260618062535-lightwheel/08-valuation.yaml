callouts:
  - calloutType: recommendation
    title: "Research-More: Strong Thesis, Insufficient Disclosure"
    body: >
      Lightwheel presents a structurally compelling investment thesis — full-stack physical AI
      infrastructure at the convergence of frontier AI data demand and industrial automation
      deployment, with record-level order volume and top-tier ecosystem positioning. The
      disqualifying factor for a priced decision is not the business quality but the evidence
      quality: no audited revenue, no cap table, no post-money valuation, and a China-domicile
      governance structure that requires specialist legal review. A single data room session
      with financials, cap table, and revenue recognition policy would likely move the call
      decisively toward buy or avoid.
    claimRefs:
      - CV037
      - CV024
      - CV025

  - calloutType: risk
    title: "Funding History Discrepancy Requires Clarification"
    body: >
      Crunchbase's organization profile for Lightwheel (as "Light Wheel Intelligence") records
      the last funding type as "Seed" from August 2024, materially conflicting with the March
      and May 2026 Series A narrative reported by Tracxn, Pandaily, EqualOcean, and the
      company's own press. This discrepancy may reflect a multi-entity structure (earlier seed
      in a different legal entity), data ingestion lag, or a genuine inconsistency in the
      disclosed funding history. It should be resolved before any investment decision.
    claimRefs:
      - CV005
      - CV015
      - CV044

  - calloutType: assumption
    title: "Orders vs ARR: The Critical Unresolved Assumption"
    body: >
      The entire valuation exercise for Lightwheel rests on a single unresolved assumption:
      whether the $100M in Q1 2026 "orders" represents contracted recurring ARR or project
      backlog. If it is ARR, the valuation case for unicorn status is defensible under
      reasonable multiples. If it is project revenue, the annualized recurring base could
      be materially lower, potentially collapsing the bull and base cases simultaneously.
