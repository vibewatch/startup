              公开技术证据显示，Lightwheel 的架构有意以仿真器为中心，并支持多引擎。LW-BenchHub 构建在 NVIDIA Isaac Lab 之上；Lightwheel 称，随着 NVIDIA 更广泛的
              Isaac-Lab/Newton 工作落地，Newton 集成也在计划中。平台页面称 Lightwheel 的数据工厂可从 Isaac Sim 和 MuJoCo
              采集物理准确轨迹，覆盖遥操作和强化学习采集模式；NVIDIA 和 GitHub 材料显示，Newton 本身是基于 Warp 和 OpenUSD 的开源 GPU 加速物理引擎，MuJoCo Warp
              是关键后端。这意味着 Lightwheel 的架构不依赖发明专有仿真器，而是依赖把多个外部仿真栈集成成可用流水线。优势是上市速度和广泛兼容性。风险是平台质量取决于持续跟上 Isaac Sim、Isaac
