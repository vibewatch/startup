  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现界面
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 的公开材料暗示的是多流收入模式，而不是单一软件授权。SimReady Library 指向商业授权资产；EgoSuite 指向托管式数据采集和标注；RoboFinals
              指向可作为平台或服务销售的评测工作流；Lightwheel-Platform Enterprise 则把这些组件打包为端到端运营层。Q1
              订单页面进一步强化了这种判断，因为公司明确称需求来自仿真、数据生成、评测和面向部署的系统。换句话说，公司似乎变现的是工作流栈，而不是单个 SKU。


              定价证据稀薄，但方向上有用。联系页面以 $1M 起步的项目预算选择器开场，这是企业销售和定制范围界定的强信号。资产库页面强调商业授权，平台页面提供云端和本地部署选项。这些都没有揭示已实现
              ASP、折扣或经常性收入占比，但确立了 Lightwheel 并不像低客单价工具供应商。其可能收入画像是项目制服务、平台访问、定制部署工作，以及可能基于用量或基准的评测收入混合。这种组合可以产生强劲
              bookings，却不一定带来软件式利润率，因此缺少产品线收入披露是实质承保约束。
