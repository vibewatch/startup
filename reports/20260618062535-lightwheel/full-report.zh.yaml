      - number: '1.2'
        title: 领导层可见度、阶段与企业商业化信号
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露很窄。第三方融资报道反复提到 Dr. Xie Chen 是创始人兼 CEO，公司自己的 PeritasAI 公告引用了合作与战略副总裁 Louis
              Lian。除此之外，官方网站没有展示更完整的高管团队、董事会名单或投资者关系治理页面。关键人依赖因此是真实的尽调问题：公司正在向企业买家销售技术野心很大的多产品栈，但外部观察者目前无法核实谁负责产品、运营、财务或合规。


              商业上，网站读起来更像解决方案供应商，而不是研究实验室。联系流程以 $1M 项目预算字段起步，资产库强调商业授权，Q1
              订单页面描述的客户合作覆盖仿真、数据生成、评测和部署系统。这些信号符合高接触基础设施销售。它们不能证明经常性收入质量，但足以支撑把 Lightwheel 视为认真推进企业 GTM
              的公司，而不是商业化前研究项目。第三方报道也把公司放在 Series A 后期或接近独角兽的阶段，即便不同数据库和新闻文章对轮次分类并不一致。
