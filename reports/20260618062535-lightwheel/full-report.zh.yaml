      - number: '2.2'
        title: 需求信号与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              市场真实存在，但规模无法用一个干净的 headline 数字概括。当前需求最好的公开证据不是第三方 TAM deck，而是 Lightwheel 自身订单叙事和更广泛具身 AI
              资本形成中可见的基础设施支出模式。PR Newswire、Morningstar 和 Robotics & Automation News 都转述了 Lightwheel 的说法：Q1 2026 订单约 $100
              million，覆盖仿真、数据、评测和部署系统；Crunchbase 则记录了 2026 年中国机器人领域的大规模风投资金流入。这些数据点说明资金正流入该栈，但仍无法隔离 Lightwheel
              服务的精确重叠市场。开源模型和数据集项目进一步增加了测算难度，因为它们扩大用户基础，同时压缩纯专有收入池。因此，投资者应把 Lightwheel 的市场看成更大具身 AI
              扩张中的受限基础设施切片，而不是通用机器人 TAM 的捷径。
