      - number: '6.2'
        title: 具名客户证明与生态部署
        blocks:
          - type: paragraph
            body: |
              Lightwheel 披露的最重要具名客户证明事件，是与 PeritasAI 的战略
              合作，目标是在 2026 和 2027 年于真实围手术期医疗场景部署最多
              200 台人形机器人。该合作于 2026 年 4 月正式宣布，是尽调投资者
              可获得的主要具名参考。除 PeritasAI 外，中文融资公告提到生态伙伴
              包括 NVIDIA、Google DeepMind、Figure AI、1X Technologies、ByteDance、Alibaba、Agibot、
              Galbot、Toyota、Bosch、BYD 和 Geely。公司称，全球领先具身 AI 团队使用的
              仿真资产和合成仿真数据中，超过 80% 来自 Lightwheel，并称五大顶尖世界模型
              研究团队都是合作方。Tongyi Qianwen（Alibaba 的语言模型部门）与 Lightwheel
              在 RoboFinals-100 上共同开发标准化评测闭环，以建立行业级基准基础。
              可独立验证的是，Hugging Face 已在官方 leRobot 文档中采用 LeIsaac——
              Lightwheel 的仿真工作流——作为标准框架，代表第三方对其规模化技术相关性的认可。
              Lightwheel 还担任 NVIDIA Newton 开源物理引擎的核心顾问，与
              Google DeepMind、Disney Research 和 Toyota Research Institute 并肩合作。
              关键在于，这些关系构成生态采用信号和合作公告——并不是已经确认、
              披露合同金额、上线日期或留存数据的具名生产客户。
