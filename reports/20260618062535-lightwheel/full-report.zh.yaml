      - number: '6.3'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: |
              截至 2026 年 6 月运行日，Lightwheel 未披露净收入留存（NRR）、
              毛收入留存（GRR）、流失率、续约率或 cohort 数据。公开渠道也没有
              客户满意度评分、G2/Capterra/Gartner Peer Insights 评价，或独立归因的
              案例研究。粘性的主要结构性指标来自产品架构本身：EgoSuite 数据采集
              按环境和任务定制，一旦客户针对特定生产场景用 Lightwheel 生成的数据
              训练机器人策略，就会形成自然切换成本。团队一旦在 RoboFinals 内设定
              性能标准，基准依赖也会形成。Lightwheel-Platform Enterprise 捆绑包
              设计成随机器人 fleet 扩展到新任务类型和部署环境而逐步加深账户。
              这些结构性粘性均未被公开披露的留存或扩张指标验证。集中度风险偏高：
              公司订单量很可能不成比例地来自少数大型前沿 AI 模型团队客户。
              New Hope Group 合资企业提供了部分工业细分市场多元化，但范围和
              收入贡献仍未披露。公开渠道没有客户投诉、部署失败或流失账户证据；
              但缺少反向证据不应被解读为高留存确认，因为公司透明度不足以评估
