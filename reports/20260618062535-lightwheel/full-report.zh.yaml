      - number: '1.4'
        title: 覆盖缺口、监管暴露与本章用法
        blocks:
          - type: paragraph
            body: >-
              当前记录的核心限制不是缺少活动，而是缺少标准化披露。公开来源有力证明 Lightwheel
              存在、发布了具名产品、融到资金，并赢得了至少一些企业业务。它们没有提供可用于申报级审查的客户数、累计融资、员工数、董事会监督或已实现收入。即便是规模指标，公开记录也部分自我引用：公司和友好报道引用大量数据小时数和环境数量，但没有独立账本验证具名客户、使用率或合同经济性。因此，后续章节只应复述已验证部分，其余内容保留为公司自称或未解决事项。


              监管背景也比公司营销文案承认得更早重要。EU AI Act 扩大了高风险 AI 系统的透明度和风险管理要求，美国 EAR 仍是先进 AI 与机器人相关贸易的跨境合规界面。Lightwheel
              可能还早到这些制度尚未直接约束每个产品模块，但它们显然会塑造出口暴露、训练数据治理和国际部署的后续尽调。本章因此是一组带有明确保留的可复用事实底座：后续章节可以依赖公司的身份、融资动能和产品时间线，但不应把未经验证的领导层深度、客户规模或市场领先主张继承为既定事实。
