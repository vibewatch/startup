        - label: 牛市情景 — 基于约 $80-100M ARR 的 12-15x（$M）
          value: 1200
        - label: 独角兽说法下限（$M）
          value: 1000
        - label: Serve Robotics 市值（$M）
          value: 560
    approximationNotes: |
      所有情景估值都是说明性估算，来自假设 ARR 区间和可比收入倍数；尚无已确认 ARR。Serve Robotics 市值取自 companiesmarketcap.com，时间为 2026 年 6 月。数值为区间中点。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV018
