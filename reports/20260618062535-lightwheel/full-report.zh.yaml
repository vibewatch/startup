      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 继续研究：投资逻辑强，但披露不足
            body: >
              Lightwheel 展现出结构上有吸引力的投资逻辑：在前沿 AI 数据需求与工业自动化部署的交汇处，提供全栈物理 AI
              基础设施，并拥有创纪录订单量和一线生态位置。阻碍定价决策的不是业务质量，而是证据质量：没有经审计收入， 没有股权结构表，没有投后估值；中国注册地治理结构还需要专项法律审查。只要一次数据室会议能提供财务数据、
              股权结构表和收入确认政策，判断很可能会果断转向买入或回避。
            calloutType: recommendation
            claimRefs:
              - CV037
              - CV024
              - CV025
          - type: callout
            title: 融资历史差异需要澄清
            body: >
              Crunchbase 上 Lightwheel（名为 "Light Wheel Intelligence"）的机构页把上一轮融资类型记录为 2024 年 8 月的 "Seed"，与
              Tracxn、Pandaily、EqualOcean 和公司自有新闻稿所报道的 2026 年 3 月和 5 月 Series A 叙事存在重大冲突。
              这一差异可能来自多实体结构（更早的种子轮发生在另一个法律实体）、数据摄取滞后，也可能是真正的披露融资历史不一致。 任何投资决策前都应先解决这一问题。
            calloutType: risk
            claimRefs:
              - CV005
              - CV015
              - CV044
          - type: callout
            title: 订单 vs ARR：仍未解决的关键假设
            body: >
              Lightwheel 的整个估值工作都压在一个仍未解决的假设上：Q1 2026 的 $100M "orders" 究竟是已签约的经常性 ARR， 还是项目储备。如果是
              ARR，独角兽估值逻辑在合理倍数下可以成立。如果是项目收入，年化经常性基数可能显著更低， 甚至同时击穿乐观和基准情景。这个问题只能通过数据室访问来解决。
            calloutType: assumption
            claimRefs:
              - CV019
              - CV033
              - CV031
