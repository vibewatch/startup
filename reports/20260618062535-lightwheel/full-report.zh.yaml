      - number: '1.3'
        title: 融资里程碑、生态定位与产品时间线
        blocks:
          - type: paragraph
            body: >-
              从 2025 年末开始，公开时间线清晰得多。EgoSuite 和 RoboFinals 均在 2025-12-04 公开发布，让 Lightwheel
              为此前首页概念性预告的行为数据层和评测层提供了具名产品。2026 年，公司又增加了两个面向外部的成熟度信号：官方商业化文案声称 Q1 订单约 $100M，以及与 PeritasAI 达成医疗部署合作，目标是在
              2026 和 2027 年部署最多 200 台人形机器人。合起来看，这些里程碑显示 Lightwheel 正试图从工具供应商转向部署系统编排方。


              2026 年融资报道也明显加速。EqualOcean 报道 3 月 Series A++ 与 A+++ 合计融资 RMB 1 billion；PEDaily 和 Gasgoo 随后报道 5 月由 Ant
              Group 领投的新一轮融资；多家媒体称公司是具身数据领域首个独角兽。这些报道都不能替代股权结构表或经审计财务，但支持一个方向性结论：公司在短时间内吸引了多家机构和产业投资方，同时拓宽外部生态。NVIDIA
              新闻室称 Lightwheel 是 Newton 采用方和 Isaac Lab-Arena 共同开发者，Lightwheel 自己的 Newton
              页面也描述了主动技术贡献，而不只是供应商结盟。这种生态契合是后续产品和市场章节的重要事实锚点。
