      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景与建议
        blocks:
          - type: paragraph
            body: |
              对 Lightwheel 的实操建议是继续研究。投资逻辑在结构上有吸引力：公司做全栈物理 AI 基础设施，
              站在前沿 AI 数据需求与工业自动化部署的交叉点，并由创纪录订单量，以及包含 NVIDIA、Hugging Face
              和一批头部机器人公司的生态背书验证。风险逻辑同样清楚：没有 ARR、没有留存数据、没有股权结构表、
              没有投后估值验证；作为一家中国注册实体，却面向国际机构资本，治理透明度缺口也很大。乐观情景下
              （$80-100M ARR，12-15 倍倍数），隐含估值达到 $960M-$1.5B，足以支撑且超过独角兽主张。基准情景下
              （$40-50M ARR，8-10 倍倍数），隐含估值降至 $320-500M，低于独角兽门槛，也意味着入场价格带溢价。
              悲观情景下（$10-30M ARR，因治理折价和倍数压缩而用 3-5 倍倍数），隐含估值降至 $30-150M，
              相比 $1B+ 入场价存在实质下行。关键决定变量不是市场机会——市场显然足够大，资金也充足——而是
              Q1 2026 订单能否转化为可持续的经常性收入。只要一次数据室会议能提供经审计财务、股权结构表和收入确认政策，
              判断就会明显转向买入或回避。在这些证据出现之前，任何对价格敏感的建议都站不住。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV037
