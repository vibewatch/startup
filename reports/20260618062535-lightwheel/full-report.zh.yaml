  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与买家工作流
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 把自己呈现为 Physical AI 基础设施公司，帮助机器人团队构建、训练、评测和部署机器人模型。其公开产品界面围绕四层组织。SimReady Library
              是世界层，提供带商业授权的预制资产和场景。EgoSuite 是行为层，把第一视角采集转化为结构化人类演示数据和标注。RoboFinals 是评测层，被营销为面向前沿 VLA
              和世界模型的工业级基准与评测平台。Lightwheel-Platform Enterprise 及其 LW-BenchHub
              训练框架位于这些层之上，作为统一仿真、数据采集和基准测试的企业运营栈。产品页面明确写出买家工作流：机器人团队采用基于 Isaac-Lab 的训练基础设施，从 Isaac Sim 和 MuJoCo 采集轨迹，用
              Lightwheel 资产或人类演示增强数据集，再在部署前用 RoboFinals 评测候选策略。这种定位让 Lightwheel 更像机器人实验室的数据与工具平台，而不是独立基础模型供应商。
