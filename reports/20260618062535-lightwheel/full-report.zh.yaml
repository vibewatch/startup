  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 面对的不是一组干净的同行。买家至少可以通过五条路径解决同一任务：NVIDIA Isaac 栈、Genesis 等高性能开放仿真平台、围绕 MuJoCo 的模块化物理和基准生态、以
              Gazebo 为核心构建的 ROS-native 开放平台，以及 LeRobot、Open X、OpenVLA 等数据或模型生态。内部自建是压在所有路径下面的第六股力量。这一点很重要，因为 Lightwheel
              的商业优势不是基本拿到仿真或模型资产；这些组件已经可得。真正的问题是，买家是否需要一个供应商把世界重建、行为数据、评测和部署接成一个工作流。按这个框架，Lightwheel
              部分是在与具名供应商竞争，部分是在与买家信心竞争：买家是否相信自己能用开放部件拼出等效栈，而不会损失太多时间、真实感或基准纪律。
