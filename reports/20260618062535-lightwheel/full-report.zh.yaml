        - $80-100M ARR；12-15x SaaS 基础设施倍数；PeritasAI 规模化落地；再增加 3-4 家具名企业客户；NHG JV 贡献收入；NVIDIA 商业合作
        - 960 — 1,500
        - 机器人融资周期转向时倍数压缩；中国地缘政治升级
        - 低到中：需要确认 ARR，并出现多家具名生产部署
      - - 基准
        - $40-50M ARR；8-10x 倍数；Q1 动能延续；无新增负面事件；3-4 年内 HKEX 退出窗口；未暴露重大治理问题
        - 320 — 500
        - 订单未转化为经常性 ARR；客户集中；留存未知
        - 中：如果 Q1 订单主要是经常性合同而非一次性项目，该情景成立
      - - 熊市
        - $10-30M ARR；3-5x 倍数（计入治理折价）；PeritasAI 延迟 12 个月以上；降价轮；中美技术限制产生实质影响；融资周期收紧
        - 30 — 150
        - 估值重置；降价轮风险；以困境价格被战略收购
        - 低到中：如果收入披露不及预期或治理担忧浮现，风险会落地
    notes: >
      所有情景中的 ARR 估算均是假设，基于 2026 年 Q1 订单量和公司声称的增长率；目前没有已确认的 ARR 数字。收入倍数按可比的实体 AI
      基础设施公司校准，并因私人市场流动性不足和治理不透明而打折。隐含估值仅为指示性结果，并非由已确认输入项推导。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
