      - number: '3.3'
        title: 切换成本与现状替代
        blocks:
          - type: paragraph
            body: >-
              切换成本存在，但并非绝对。客户一旦围绕一个工作流重建环境、对齐任务数据并搭建评测逻辑，Lightwheel
              就会受益，因为替换这条闭环需要时间和运营精力。但同一来源集也说明，多栖仍然可行。Isaac、MuJoCo、Gazebo、LeRobot 和 Open X 都是开放组件，RoboFinals
              本身也支持多个仿真后端，而不是强制绑定一个专有引擎。这降低了买家即便购买商业层也继续保留一只脚在开放工具里的惩罚。团队也可以从现状出发——ROS-native
              栈、开放基准或模块化模型流水线——只在痛点变尖锐处添加供应商模块。实际结果是，Lightwheel 的护城河很可能在重视降低组装负担的账户里最强，在把工作流组装视为核心内部能力的账户里最弱。
