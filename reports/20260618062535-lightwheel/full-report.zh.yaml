  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与基础设施栈
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 无法干净归入单一软件类别。其自有材料描述的栈从 SimReady
              资产和场景起步，经过第一视角人类数据采集与标注，最终落到工业级评测和部署工作流。这意味着相关市场边界既不是整个人形或机器人市场，也不是狭窄的仿真引擎类别，而是机器人团队付费重建作业环境、生成机器人可用数据、对标模型行为，并把这些资产接入部署的交集。同一批来源也暗示了清晰排除项。机器人
              OEM 收入、芯片制造和通用 AI 软件过于宽泛，而免费社区框架已经覆盖许多基础组件。因此，Lightwheel 切入的是更窄的具身 AI
              基础设施层，其价值取决于集成、企业就绪度，以及把多个开放组件变成可用闭环的能力。
