chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与经营范围
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 自有网站始终把公司定义为 Physical AI 基础设施供应商，而不是机器人 OEM。首页和 Lightwheel-Platform
              页面描述的栈覆盖仿真资产、人类行为数据、工业评测和企业部署工作流。对一家年轻公司来说，其公开产品分类异常清晰：SimReady Library 提供商业授权资产；EgoSuite
              提供第一视角人类数据；RoboFinals 提供模型评测；Lightwheel-Platform Enterprise 则把这些组件打包为端到端运营层。这种宽度很重要，因为它解释了后续章节为什么应把
              Lightwheel 作为服务机器人建设者的基础设施与工具供应商来分析，而不是人形机器人厂商的直接硬件竞争者。


              法律实体和地点图景没那么干净。Baidu Baike 记录光轮智能（北京）科技有限公司成立于 2023-01-16，注册地址在海淀区。与此同时，Lightwheel 的英文新闻稿使用美国
              dateline，公开网站也没有发布单一、权威的总部声明。最稳妥的结论是，公司法律足迹以中国为中心，并至少有一定面向美国的商业存在，但公开文件不足以确认一个无争议总部。这种模糊性对草案概览可控，但后续章节不应把它悄悄规范化为假设。
