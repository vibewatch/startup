      - number: '4.2'
        title: 公开牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              最清晰的商业数据点是官方声称 Q1 2026 订单约 $100M，并被 PR Newswire、Morningstar 和 Robotics & Automation News
              转述。这个数字有意义，因为它暗示在完整机器人自主性解决前，买家已愿意承诺部署基础设施。但同一指标并未被干净佐证：Gasgoo 报道 Q1 新订单为 550 million yuan，按当时汇率明显低于
              $100M。差异可能来自翻译、范围差异或不同计量口径，但在管理层解释前，即便旗舰牵引力数字也应被视为方向积极，而不是申报级精确。


              其他公开规模信号进一步说明 Lightwheel 可能承载着服务很重的交付引擎。EgoSuite 声称每周在 7 个国家、500 多个环境中提供超过 20,000 小时演示，Gasgoo 则提到 25,000
              多个环境节点、100,000 种任务类型和超过 1.5 million
              小时交付。这些说法显示有意义的运营吞吐量，但也意味着劳动力、伙伴或基础设施强度，如果收入依赖定制数据生成和部署支持，可能压缩毛利率。反过来，平台叙事——尤其是本地或云端评测以及可复用资产——暗示有走向软件杠杆的路径。因此，本章把单位经济读作混合：平台潜力真实，但公开证据仍不足以判断服务、算力或定制集成是否主导贡献利润。
