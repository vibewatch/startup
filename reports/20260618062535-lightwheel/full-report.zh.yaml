      区间体现每个情景中 ARR 和倍数假设带来的分析不确定性。独角兽说法区间低端来自公司新闻稿隐含估值，高端来自融资轨迹可能隐含的溢价。Lightwheel 尚无已确认的投后估值。
    claimRefs:
