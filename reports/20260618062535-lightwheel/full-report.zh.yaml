  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Lightwheel 的公开材料描述了全球第一视角数据采集、商业授权仿真资产、企业 AI 基础设施，以及进入安全敏感客户环境的潜在部署。即便尚不清楚客户具体用例，这种组合也已经贴近多个法律制度。EU AI Act
              对投放或使用于 Union 的 AI 系统创设义务，尤其是在安全、日志、透明度和人类监督重要的场景。中国出境数据制度比 2022 年版本更宽松，但 Stanford DigiChina
              分析仍强调跨境业务数据如何被审查和解释存在不确定性。美国出口管制暴露也重要，因为 Lightwheel 的栈触及机器人仿真、数据和潜在两用技术
              know-how，而公开语料没有披露正式出口合规计划。法律风险不是已证明存在违规，而是公司所处类别会让客户和投资者在生产级部署前，期待其就隐私、授权、数据权利、出口范围和司法辖区控制给出干净答案。
