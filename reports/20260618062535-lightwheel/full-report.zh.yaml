      - number: '2.4'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强采用驱动很容易识别。更强的开放模型、扩大的机器人数据集和上升的自动化需求，都会让仿真、数据质量和基准可信度更重要，而不是更不重要。Genesis、VLA survey，以及 Lightwheel 自己的
              RoboFinals 和 EgoSuite 材料从不同角度描述同一个问题：如果数据稀疏、评测浅、仿真器不可信，机器人团队就无法扩大迭代。约束同样重要。European AI Act
              提高了高风险系统的透明度和监督负担，DigiChina
              强调跨境数据传输规则仍有持续不确定性，开源生态则在核心基础设施下方设定了低成本替代底线。结果是，市场有真实需求，但变现清晰度并不完美。最大的未解问题是各产品层的已实现定价、按细分市场划分的客户组合，以及 Q1
              订单量中有多少会转化为经常性、耐久的软件式经济性，而不是项目重的集成收入。因此，对实施负担、续约证据以及商业化的尽调尤其重要。
