      - number: '4.3'
        title: 资本充足性、可比公司与披露缺口
        blocks:
          - type: paragraph
            body: >-
              需求之外，最新资本可得性是最强的正向财务信号。EqualOcean 报道 2026 年 3 月 A++ 与 A+++ 融资 RMB 1 billion，PEDaily 和 Gasgoo 报道 5 月由 Ant
              Group 领投的新一轮融资。两类来源都称资金将投入核心基础设施、交付规模和全球扩张。这符合一家仍在积极投入能力建设，而非优化近期 EBITDA 的公司。不过，所引来源没有披露账面现金、烧钱、
              runway、债务或融资 covenant 包。公开记录因此支持公司仍可获得资本的结论，但不能支持资产负债表充足的结论。


              公开可比公司有助于说明透明度缺口，而不是解决它。Serve Robotics、Symbotic 和 Teradyne 都有可见的公开股权或申报界面，让外部投资者能追踪 10-Q、8-K
              和市值。Lightwheel 没有类似申报界面。这意味着即便粗略的相对承保也必须依赖代理：Teradyne 展示规模化机器人平台所有权在公开市场的样子；Symbotic 展示大型自动化叙事如何定价；Serve
              展示规模小得多的交付阶段机器人股权在保持定期披露时如何交易。这些可比公司不能告诉我们 Lightwheel 自身毛利率、booking 转化或现金消耗。开源证据在商业野心上最强，在财务质量上最弱。
