      - number: '8.2'
        title: 收入动能与商业牵引力
        blocks:
          - type: paragraph
            body: |
              Lightwheel 的商业信号是任何估值工作中最强的可用输入，但这些信号仍由公司声称，且未经审计。
              PRNewswire 报道 Q1 2026 订单约 $100M（约 5.5 亿元人民币），Robotics and Automation News
              和 Gasgoo 也独立引用了这一说法。公司称 FY2025 收入较 FY2024 增长 10 倍，并预计仅 Q1 2026
              收入就将超过整个 FY2025 基数，意味着高速复合增长。如果按表面值接受，这会指向 2026 年订单年化运行率约
              $400M+，使 Lightwheel 进入在激进增长倍数下可支撑独角兽估值的收入区间。不过，几个关键模糊点削弱了这些数字的分析价值：
              "orders" 与确认收入之间的关系未说明；订单究竟代表已承诺的 ARR 合同、按项目里程碑计费的服务、意向书，
              还是附条件协议，也不清楚。公司没有公开披露毛利率、获客成本、回本周期或单位经济。New Hope Group 合资企业和
              PeritasAI 合作是两个最突出的具名商业关系；二者都没有披露合同金额、上线日期或收入贡献。由于没有披露 ARR，
              常规收入倍数分析无法直接套用；任何情景分析都取决于对 2026 年收入水平和复现性的假设。
            claimRefs:
              - CV019
