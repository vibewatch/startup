companyProfile:
  summary: >
    Lightwheel 是一家创立于北京的 Physical AI 基础设施公司，围绕仿真资产、第一视角人类数据、评测和部署反馈搭建闭环栈。公开材料把 SimReady Library、EgoSuite、RoboFinals 和
    Lightwheel-Platform Enterprise 定位为核心商业入口。第三方和公司关联来源显示，Lightwheel 在 2026 年两轮 Series A 融资中合计募资约
    US$145M，并声称已达到独角兽状态；NVIDIA 与 Hugging Face
    生态引用也支撑其技术相关性。尽调约束在于披露质量：公司尚未公开经审计收入、ARR、利润率、员工数、客户数或投后估值条款，因此投资判断更依赖数据室验证，而不是公开市场叙事。
