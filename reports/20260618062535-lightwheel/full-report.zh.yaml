  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: |
      基于截至 2026 年 6 月运行日期可获得的证据权重，对七个维度给出 IC 可用评分；图中显示，市场 / 产品证据较厚，财务和估值证据偏薄。
    data:
      items:
        - label: 市场机会
          score: 8
          max: 10
          note: IFR 增长数据；中国机器人投资创纪录；全球 Physical AI 浪潮
        - label: 产品与技术
          score: 8
          max: 10
          note: 全栈基础设施；Newton + HuggingFace；差异化工程站位
        - label: 客户证明
          score: 6
          max: 10
          note: Q1 订单 $100M；具名生态伙伴；具名生产部署偏弱
        - label: 财务透明度
          score: 3
          max: 10
          note: 未披露 ARR、收入、利润率或股权结构表；审计线索有限；中国治理不透明
        - label: 估值支撑
          score: 3
          max: 10
          note: 独角兽说法未经验证；缺少收入倍数锚点；Crunchbase 种子轮信息存在冲突
        - label: 竞争护城河
          score: 7
          max: 10
          note: 仿真资产 80% 份额说法；全栈整合门槛；处在 NVIDIA / HuggingFace 生态位
        - label: 退出准备度
          score: 4
          max: 10
          note: 2028 年以后走向 HKEX 有一定可能；尚无 IPO 申报；大概率至少还要 2–3 年
    claimRefs:
      - CV029
      - CV030
      - CV037
      - CV043
