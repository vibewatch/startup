      - number: '3.2'
        title: 能力比较与买家取舍
        blocks:
          - type: paragraph
            body: >-
              最重要的取舍是宽度与组装负担。NVIDIA 已经覆盖仿真、训练、物理和开放数据集；Genesis 强推仿真可信度和评测速度；MuJoCo 与 robosuite 提供更轻量的模块化栈；LeRobot 加 Open
              X 加 OpenVLA 降低了数据、模型和评测脚本门槛。Lightwheel
              的答案是把这些需求打包进企业工作流，其中包含商业资产、大规模第一视角运营和基准编排。这有差异化，但前提是买家重视一体化闭环胜过开放性和灵活性。许多研究团队会忍受组装成本来保留可选性。有真实部署时间表的工业运营方，如果供应商包能实质降低实施风险，可能更偏好供应商方案。因此，竞争视角不只是功能数量，而是买家选择每条路径后，仍需自行解决多少高摩擦交接。
