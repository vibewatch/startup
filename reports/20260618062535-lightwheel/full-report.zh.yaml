      - number: '6.4'
        title: 反向监管与部署风险
        blocks:
          - type: paragraph
            body: |
              PeritasAI 合作瞄准围手术期医疗——该场景正落在 EU AI Act 的
              高风险 AI 类别内。EU AI Act 于 2024 年 3 月由 European Parliament
              通过，并在 2026-2027 年分阶段全面生效；它把部署于医疗领域的 AI 系统
              归为高风险，并施加严格义务：风险管理系统、技术文档、人类监督机制、
              上市后监测日志，以及市场准入前的一致性评估。若在真实临床环境部署
              最多 200 台人形机器人，合规要求可能实质拉长开发时间、增加合规成本，
              并限制 EU 辖区内可服务市场。EU AI Act 还限制实时生物识别数据处理，
              并要求人类监督工作流保持透明——两者都与围手术期机器人场景相关。
              从尽调角度看，Lightwheel 作为仿真和评测基础设施提供方，意味着
              PeritasAI 在受监管欧洲医疗市场的任何部署都会让它分担合规暴露。
              公司尚未公开 PeritasAI 项目的合规路线图、EU 市场进入策略或
              一致性评估计划。这是医疗垂直客户扩张命题中的实质缺口。
            claimRefs:
              - CU017
              - CU018
              - CU019
              - CU037
              - CU040
