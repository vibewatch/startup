      - number: '2.3'
        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Lightwheel
              的来源集指向双轨购买动作。前沿实验室和模型团队需要更高质量的数据、更难的基准和更快的评测循环，因为开放基础模型和跨机器人数据集抬高了实验上限。工业采用者从另一个角度进入：他们想重建真实工作空间，在硬件接触生产前验证策略，并在故障模式可见后逐步扩大部署。这些账户里的使用者很可能是机器人工程师、仿真团队、数据运营负责人和评测负责人。付款方和赞助方更可能坐在
              AI 基础设施、自动化、制造运营或企业转型预算中。这种分裂很重要，因为 Lightwheel
              不只是销售一次性数据集。它销售的是连接环境采集、行为数据和就绪诊断的工作流。结果是，商业成功不仅取决于原始模型性能主张，也同样取决于集成和流程适配。
