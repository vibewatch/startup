  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与估值主张
        blocks:
          - type: paragraph
            body: |
              Tracxn 显示，Lightwheel 在 2026 年披露的两轮融资中累计募资 $145M，
              首轮于 2026-03-11 关闭，第二轮于 2026-05-26 关闭，均被归为 Series A。
              中文来源称，A++ 与 A+++ 合计融资人民币 10 亿元（按 2026 年初汇率约 $137-145M），
              公司据此宣称成为「全球首个具身数据独角兽」。Gasgoo 称最新一轮由 Ant Group 领投；
              战略投资方包括 New Hope Group、AUX Group、Dingbang Investment（San'an Optoelectronics
              董事长的家族办公室）；财务投资方包括 CCB Sci-Tech、Guofang Innovation、Daohe Long-term Investment
              和 Qingxin Capital。投资人名单横跨中国国资关联基金、产业集团和私人家族办公室，更像战略财团，
              而非纯财务投资组合。一个关键差异在于：Crunchbase 上 Lightwheel（名为
              "Light Wheel Intelligence"）的机构页把上一轮融资类型记录为 2024 年 8 月的 "Seed"，
              与 2026 年 3 月 Series A 叙事相冲突，提示数据质量或多实体结构问题。更关键的是，
              两轮 2026 融资都没有公开披露投后估值；没有条款清单、投资人信或二级交易提供独立标记。
              PitchBook 档案在付费墙后；Tracxn 的融资金额也被占位数字遮挡在付费墙后。因此，独角兽主张完全依赖
              Lightwheel 自身新闻稿和中文第三方文章，缺少独立佐证。
