  - id: TV005
    title: 论点失效与止损触发器
    columns:
      - 风险 / 触发器
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 下一轮融资降价轮
        - 下一轮定价低于当前独角兽声称估值（约 $1B）
        - 证实估值被高估；既有投资者账面标记受损
        - 不按独角兽价格进入；若已投资，加快退出复核
      - - PeritasAI 部署延迟或范围缩减
        - 正式宣布延迟 12 个月以上，或范围缩减超过 50%
        - 主要具名客户背书消失；医疗垂直论点受损
        - 重新评估客户细分多元化；寻找替代生产案例
      - - 下一轮融资收入披露显示 ARR < $20M
        - 资料室或 IPO 文件显示 ARR 明显低于基准情景假设
        - 牛市和基准情景坍塌；熊市变成基准情景
        - 降低敞口或放弃后续投资；重新谈判进入价格
      - - 中美技术脱钩限制 AI 训练数据流
        - 美国行政令或出口管制限制美国实体使用中国注册地 AI 数据
        - 前沿 AI 模型团队细分市场（估计贡献大部分订单）无法使用 Lightwheel
        - 评估美国客户集中度；判断是否可设立 HK 或美国实体
      - - NVIDIA 或 Hugging Face 弱化 LeIsaac / Newton 顾问关系
        - 公开声明或分叉版本不含 Lightwheel；LeIsaac 从官方文档移除
        - 开发者心智护城河坍塌；投资论点核心的生态位置被削弱
        - 按季度监测 GitHub 活动、Hugging Face leRobot 文档和 Newton 项目
    notes: |
      触发阈值基于现有证据和结构性判断定义；在更多数据缺失时，各触发器概率未正式估计。行动含义是组合管理建议，不构成投资建议。
    claimRefs:
      - CV031
      - CV033
      - CV034
      - CV038
      - CV045
  - id: TV006
    title: 最终尽调事项
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和 ARR
        - 经审计 FY2025 收入；2026 年 Q1 已确认收入与订单；按细分市场和合同类型拆分 ARR
        - 任何估值倍数方法都需要这些数据；否则所有情景都只是纯假设
        - 要求资料室财务包；坚持取得审计师函或经审计师复核的管理账
      - - 股权结构和优先权堆栈
        - 完整股权结构表；清算瀑布；反稀释条款；各轮投资者的按比例跟投权
        - 理解稀释风险、投资者一致性和有效进入价格的关键
        - 向 CFO 要股权结构模型；请法律顾问核验；检查异常优先权倍数
      - - 估值标记
        - 2026 年 3 月和 5 月融资的投后估值；任何二级交易定价
        - 没有独立估值标记，不能据独角兽说法行动
        - 获取现有投资者的投资条款清单；寻求领投方确认；检查二级平台
      - - 客户留存
        - NRR；GRR；合同期限；续约率；前 10 大客户收入集中度
        - 没有留存数据，收入轨迹和估值倍数都无法验证
        - 要求 CRM 或计费系统导出；索取队列分析；取得客户访谈
      - - 治理和实体结构
        - 审计师身份和范围；实体结构（BVI/Cayman/WFOE/VIE）；关联方交易；董事会构成
        - 中国注册地治理风险对非中国机构投资者至关重要
        - 聘请熟悉中国注册地的专项法律顾问；审查公司章程和董事会会议纪要
      - - PeritasAI 合同结构
        - 具约束力的合同还是 MOU；里程碑排期；付款条款；解约条款；上线日期
        - 主要具名客户背书；其价值完全取决于它是否是具约束力的收入承诺
        - 直接从 PeritasAI 和 Lightwheel 法务团队取得已签署协议或具约束力的投资条款清单
    notes: |
      这六项尽调都是阻断项：至少 ARR 数字和股权结构表确认前，不应做出有定价的投资决定。治理和实体结构尽调可能需要 30-60 天专项法律工作。尽调路径是建议，不保证能解决问题。
    claimRefs:
      - CV024
      - CV025
      - CV037
      - CV043
