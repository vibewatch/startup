      - number: '8.3'
        title: 公开可比基准与市场背景
        blocks:
          - type: paragraph
            body: |
              Lightwheel 处在仿真软件、合成数据和物理 AI 基础设施的交叉点，这一类别没有直接上市可比公司。
              最有参考价值的公开基准是 Symbotic（SYM，2026 年 6 月市值 $24.24B）、Teradyne（TER，市值 $63.95B）
              和 Serve Robotics（SERV，市值 $0.56B）。Symbotic 提供 AI 驱动的仓储自动化，年收入 $1.7B+，
              展示了一家成功的物理 AI 基础设施公司可以达到的规模；其约 14 倍收入倍数意味着，若套用类似倍数，
              Lightwheel 需要 $70M+ 收入才能支撑 $1B 估值。Teradyne 是成熟的工业自动化和机器人测试设备龙头，
              可比性较远，但展示了该板块的峰值估值。Serve Robotics 是最接近阶段的上市实体，作为早期物理 AI 公司，
              在极低收入基础上交易于 $0.56B，为尚未规模化的物理 AI 基础设施提供了底部参照。私募市场中，
              Crunchbase 数据显示，2026 年中国具身 AI 公司频繁在早期 Series A 轮铸出 $1-2B 估值，说明
              Lightwheel 的独角兽说法与中国融资市场的同业可比相符，即便缺少可独立核验的收入倍数支撑。IFR 初步数据确认，
              2025 年美国机器人装机量增长 11% 至 38,000 台，支持支撑行业估值的宏观增长叙事。
