      - number: '8.5'
        title: 最终尽调要求与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: |
              在作出任何定价投资决定前，有六项尽调要求仍构成阻塞。最关键的是：对两轮 2026 融资的投后估值做独立确认；
              提供经审计的 FY2025 收入和 Q1 2026 确认收入，并区分订单与 ARR；提供完整股权结构表，列明优先股堆叠和清算瀑布；
              核实 PeritasAI 合同是否已签署、还是仅为 MOU；审查治理与实体结构，覆盖北京 WFOE 与任何离岸控股公司之间的关系。
              投资逻辑破裂触发点应按运营口径定义：下一次融资若为 down round，将确认估值被高估；PeritasAI 部署延迟 12+ 个月，
              将移除最主要的具名客户参照；披露收入低于 $20M ARR，将同时击穿乐观和基准情景；若中美技术脱钩限制美国前沿 AI
              团队使用中国注册主体的 AI 数据基础设施，可服务客户池会实质缩小；若 LeIsaac/Newton 与 NVIDIA 或 Hugging Face
              的生态关系降级，将削弱开发者心智护城河。即使在正式投资决定之前，也应按季度通过公开信号监测这些触发点：
              GitHub 活动、NVIDIA 文档更新、中国监管文件和 Lightwheel 新闻页。
            claimRefs:
              - CV025
              - CV037
              - CV038
              - CV043
