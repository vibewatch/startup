      - number: '4.4'
        title: 财务结论与承保阻碍
        blocks:
          - type: paragraph
            body: >-
              最有支撑的财务结论是谨慎但不否定。Lightwheel 几乎肯定有真实企业需求、近期投资者兴趣，以及足够宽的产品栈来支撑多个变现界面。市场背景也有利：IFR
              数据显示美国自动化需求强劲，中国机器人安装活动仍然规模突出，这支撑了管理层关于基础设施买家正从试点走向规模化部署的说法。这些是一个正当增长故事的组成部分。


              阻碍同样清晰。订单不是经审计收入；收入结构没有披露；定价实现未知；没有公开来源提供毛利率、现金、烧钱或 runway。对一家中国关联、服务全球 Physical AI
              客户的基础设施供应商而言，监管和出口管制制度又增加了一层不确定性。因此，本章不判断 Lightwheel
              资本过剩或不足；本章结论是，只有数据室补上亮眼商业化叙事与申报级经济性之间的缺口，公司才具备可投性。具体尽调要求很直接：对齐 Q1
              订单口径，披露各收入流已实现定价，提供经审计财务和现金计划，并展示客户集中度与部署转化。
