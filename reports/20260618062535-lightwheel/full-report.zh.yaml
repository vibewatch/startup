      - number: '5.4'
        title: 信任、质量、合规与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开产品故事包含一些有利于信任的信号，但还不是完整的企业控制包。Lightwheel 强调 SimReady 资产的商业授权、确定性多引擎评测、面向安全敏感买家的本地部署，以及用于基准落地的 Real2Sim
              校准。这些是有用的产品层控制，因为它们降低内容权利摩擦，帮助实验室跨求解器比较模型，并让买家把敏感数据留在自有环境中。与此同时，来源语料没有显示公开隐私政策、安全白皮书、SOC 2 声明、出口管制计划，或
              EgoSuite
              数据运营和基准服务的具名合规认证。结果是一种常见机器人基础设施模式：产品界面有吸引力且技术可信，但大型企业或投资者若要毫无保留地把该栈承保为生产就绪，就必须转向私有材料核验数据权利、安全架构和跨境处理，尤其是大型安全敏感工业部署和采购流程重的行业。
            claimRefs:
              - CE036
              - CE037
              - CE038
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与生态概览
        blocks:
          - type: paragraph
            body: |
              Lightwheel 服务两个正在汇合的客户群：前沿 Physical AI 模型团队
              （需要高质量仿真数据和评测基础设施的基础模型公司、AI 研究实验室
              和具身 AI 初创公司），以及工业制造商（在汽车、物流、医疗和制造
              场景中规模化部署机器人、上线前需要仿真支撑验证的运营方）。公司客户页
              称其「Trusted by the world's leading AI and robotics teams」，但没有公开
              任何客户名称、logo 或用例。战略命题是汇合：两类客户都需要同一套核心
              基础设施——仿真环境、行为数据生成、评测和部署反馈——但结构性原因不同。
              前沿 AI 团队受数据约束；工业制造商受风险约束。Lightwheel 的
              四层平台（World、Behavior、Evaluation、Deployment）通过单一集成栈
              覆盖两类人群。EgoSuite 的人类数据采集网络横跨 7 个以上国家，
              扩大了地理供给。2025 年收入增长 10x，Q1 2026 订单据称超过
              2025 全年收入基数，两者合起来显示早期商业牵引力快速增强，不过订单在前沿
              AI 和工业客户之间如何分布并未公开拆分。与 New Hope Group 组建的合资企业
              旨在把具身数据接入工业农业和制造场景，是工业细分市场战略伙伴渠道发展
              最清晰的证据，但其收入贡献未披露。
