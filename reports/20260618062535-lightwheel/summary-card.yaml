  topStrengths:
    - >-
      Lightwheel appears to own a differentiated full-stack position across simulation assets, human-data capture,
      evaluation, and deployment feedback rather than selling a single tooling module.
    - >-
      Q1 2026 orders of about US$100M and 10x FY2025 growth claims indicate the company is monetizing sector enthusiasm
      earlier than many physical-AI infrastructure peers.
    - >-
      Ecosystem signals from NVIDIA Newton, Isaac Lab-Arena, and Hugging Face LeRobot improve technical credibility and
      developer-mindshare beyond a typical private Chinese robotics startup.
  topRisks:
    - >-
      No audited revenue, ARR, margin, retention, cap-table, or post-money valuation disclosure exists in the public
      record, making price discipline impossible from public evidence alone.
    - >-
      Funding data is inconsistent across sources, with Crunchbase still labeling the company as Seed-stage while 2026
      sources describe two Series A rounds and unicorn status.
    - >-
      Customer proof remains shallow because public materials emphasize ecosystem logos and a PeritasAI deployment
      target without disclosing customer count, contract values, or production retention.
  unresolvedGaps:
    - >-
      Audited FY2025 and Q1 2026 recognized revenue, including the distinction between orders, revenue, and any
      recurring ARR base
    - Full legal entity map, offshore holding structure, and liquidation-preference stack for the 2026 rounds
    - >-
      Named customer list with contract size, production status, renewal behavior, and evidence separating pilots from
      scaled deployments
