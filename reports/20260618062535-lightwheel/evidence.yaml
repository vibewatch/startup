    statement: >
      Lightwheel's core advisory position in the NVIDIA Newton open-source physics engine initiative positions it at the
      center of the Physical AI simulation ecosystem, creating long-term developer mindshare and a potential pathway to
      commercial co-development agreements with NVIDIA or affiliated partners.
    type: company-claimed
    topic: moat
    sourceRefs:
      - SV028
      - SV021
    confidence: medium
    freshness: current
    answersQuestionRefs:
      - QV022
evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, independent directors, and formal governance documentation.
    whyItMatters: Later chapters cannot assess control, oversight, or key-person dependence without a verifiable governance surface.
    diligencePath: Request an org chart, board list, and current cap-table governance package from management.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation and lifetime capital raised across all rounds.
    whyItMatters: >-
      Recommendation framing and dilution analysis depend on knowing whether unicorn status reflects $1B, $1.5B, or
      materially higher value.
    diligencePath: Request the latest term sheet, shareholder register, and financing deck.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customers, customer count, contract sizes, and deployment case studies.
    whyItMatters: The website implies broad adoption but does not let diligence separate pilots from scaled production programs.
    diligencePath: Request customer references, top-10 account list, and deployment win summaries.
    relatedQuestionRefs:
      - QO024
  - type: conflicting-data
    severity: minor
    topic: headquarters
    missingEvidence: A consistent statement on headquarters and operating footprint across China and the U.S.
    whyItMatters: >-
      The public record shows Beijing registration while U.S. press materials use Santa Clara datelines, which affects
      jurisdiction and follow-up diligence routing.
    diligencePath: Ask the company to reconcile legal entity, registered address, principal office, and any U.S. affiliate roles.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-enumeration
    missingEvidence: A complete dated chronology covering every financing tranche, named customer win, and governance change.
    whyItMatters: >-
      The current timeline captures major public milestones but not every financing sub-round or internal governance
      event.
    diligencePath: >-
      Request the company's internal timeline covering formation, all financings, product launches, and leadership
      changes.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: monetization-by-layer
    missingEvidence: Realized pricing, gross margin, and recurring revenue mix by assets, data, evaluation, and deployment products.
    whyItMatters: >-
      Without monetization detail, investors cannot tell whether the closed-loop story behaves like software, services,
      or project revenue.
    diligencePath: Request product-level pricing architecture, contract structure, and cohort-level renewal data from management.
  - type: missing-source
    severity: material
    topic: customer-mix
    missingEvidence: >-
      Named customer split between frontier labs and industrial operators, plus concentration and deployment stage by
      account.
    whyItMatters: >-
      The buyer map and valuation logic differ materially if order volume is concentrated in a few experimental
      programs.
    diligencePath: Request customer segmentation by sector, ACV, deployment phase, and referenceability.
  - type: missing-source
    severity: minor
    topic: serviceable-market-sizing
    missingEvidence: >-
      Independent market research that isolates the overlap of simulation assets, robot data, evaluation, and deployment
      tooling.
    whyItMatters: Current public evidence supports only a constrained qualitative SAM narrative.
    diligencePath: >-
      Build a bottoms-up market map from target accounts, product modules, and workflow substitution paths rather than
      relying on robotics TAM decks.
  - type: private-evidence-only
    severity: material
    topic: lightwheel-win-rates
    missingEvidence: Competitive win-rate data versus open-source builds, NVIDIA-centric stacks, or specific evaluation vendors.
    whyItMatters: >-
      Without real displacement or conversion data, moat durability remains mostly analytical rather than empirically
      proven.
    diligencePath: Request lost-deal analysis, pilot-to-production conversion, and competitor mentions from CRM data.
  - type: missing-source
    severity: material
    topic: pricing-comparison
    missingEvidence: Comparable realized pricing for Lightwheel versus integrated or self-built alternatives.
    whyItMatters: >-
      Open substitutes can be cheap in software terms but expensive in engineering time; the corpus does not quantify
      that tradeoff.
    diligencePath: Build a workflow TCO model using customer references, implementation timelines, and cloud / staffing assumptions.
  - type: missing-source
    severity: minor
    topic: independent-sim-real-validation
    missingEvidence: Independent third-party validation of Lightwheel's claimed sim-real correlation and benchmark predictive power.
    whyItMatters: Evaluation trust is a key competitive dimension and cannot rest only on vendor-authored claims.
    diligencePath: >-
      Request external benchmark studies, customer case studies with before/after metrics, or third-party audits of
      evaluation methodology.
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited income statement, balance sheet, and cash-flow statement for 2025 and latest 2026 period.
    whyItMatters: Without audited statements, the chapter cannot underwrite revenue quality, margin, or runway.
    diligencePath: Request audited historical financials plus the latest management accounts.
    relatedQuestionRefs:
      - QI013
      - QI014
      - QI017
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized contract values, product-level revenue mix, discounting, and gross-margin bridge by stream.
    whyItMatters: >-
      A $1M budget floor and large orders do not reveal whether revenue is software-like, service-heavy, or
      hardware-adjacent.
    diligencePath: Request top-20 contracts, pricing schedules, and product gross margin by line.
    relatedQuestionRefs:
      - QI007
      - QI011
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash on hand, monthly burn, debt obligations, and explicit runway.
    whyItMatters: Fresh financing alone does not establish whether the company is de-risked or simply bridging to the next round.
    diligencePath: Request treasury summary, debt schedule, and 18-month cash plan.
    relatedQuestionRefs:
      - QI017
      - QI018
      - QI019
  - type: conflicting-data
    severity: material
    topic: orders
    missingEvidence: A reconciled Q1 2026 orders figure and clear currency translation basis.
    whyItMatters: >-
      The difference between approximately $100M and 550 million yuan changes annualized-order and valuation narratives
      materially.
    diligencePath: Ask management for the exact booking figure, currency, booked period, and revenue-recognition relationship.
    relatedQuestionRefs:
      - QI004
      - QI005
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Named top customers, deployment status, and concentration metrics by revenue share.
    whyItMatters: Orders can look strong even if a small number of strategic buyers dominate the book.
    diligencePath: Request top-10 customer list, backlog, and renewal / expansion cohorts.
    relatedQuestionRefs:
      - QI025
  - type: private-evidence-only
    severity: material
    topic: trust-gap
    missingEvidence: Public or NDA-only security architecture, privacy policy, and assurance artifacts for enterprise deployments.
    whyItMatters: Large buyers will care about data handling and platform control maturity before production adoption.
    diligencePath: Request SOC 2 or equivalent, privacy policy, architecture review, and customer security questionnaire responses.
    relatedQuestionRefs:
      - QE022
  - type: missing-source
    severity: material
    topic: compliance-gap
    missingEvidence: >-
      Export-control, cross-border data handling, and jurisdiction-specific compliance documentation for EgoSuite
      operations.
    whyItMatters: Multi-country data collection can create legal and operational friction for enterprise buyers and investors.
    diligencePath: Request export-control memo, data-flow maps, and country-by-country operating policy under NDA.
    relatedQuestionRefs:
      - QE023
  - type: stale
    severity: minor
    topic: roadmap-risk
    missingEvidence: >-
      Dated release notes or customer references proving Newton support and sim-real correlation are in production, not
      just planned.
    whyItMatters: Current product maturity depends on whether roadmap items have shipped beyond marketing language.
    diligencePath: Ask for release notes, benchmark runs, and reference deployments using Newton-enabled workflows.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: material
    topic: contract-structure
    missingEvidence: >
      Executed contract or binding term sheet between Lightwheel and PeritasAI confirming the legal structure, milestone
      schedule, payment terms, and breakage clauses.
    whyItMatters: >
      Without confirmation that the PeritasAI partnership is a binding contract rather than an MOU, the flagship
      customer reference has no enforceable revenue commitment, materially affecting the customer proof valuation.
    diligencePath: >
      Request the executed agreement from Lightwheel's legal team; verify with PeritasAI's communications team; if MOU,
      obtain the binding conversion schedule and trigger conditions.
    relatedQuestionRefs:
      - QU003
  - type: missing-source
    severity: material
    topic: customer-retention
    missingEvidence: >
      Any independent evidence of customer churn, failed pilots, declined renewals, or negative customer experience with
      Lightwheel's simulation data or evaluation products.
    whyItMatters: >
      Absence of adverse customer evidence is not the same as high retention. Without churn or renewal data, the
      persistence of the $100M Q1 order run rate cannot be assessed.
    diligencePath: >
      Search for engineer-community discussions on GitHub, Hugging Face forums, and Chinese tech forums for complaints;
      request customer references and contact them independently; seek back-channel references from investors in
      frontier AI model companies.
    relatedQuestionRefs:
      - QU011
  - type: missing-source
    severity: material
    topic: repeat-order-composition
    missingEvidence: >
      A breakdown of Lightwheel's Q1 2026 orders showing the proportion from repeat customers vs. net-new accounts, and
      the proportion of recognized ARR vs. project-based orders.
    whyItMatters: >
      If Q1 orders are primarily net-new project orders rather than recurring revenue expansions, the implied annualized
      run rate is not durable, fundamentally changing the revenue trajectory.
    diligencePath: >
      Request a cohort analysis or billings schedule from the CFO; ask for the split between ARR contracts and
      project/milestone-based contracts in the Q1 2026 order total.
    relatedQuestionRefs:
      - QU025
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >
      The full roster of Lightwheel paying customers, including customer names, contract values, go-live dates, and use
      cases, none of which are publicly disclosed.
    whyItMatters: >
      The named customer proof table captures only 5 relationships from press releases and funding announcements. The
      real customer base is unknown; the concentration and mix of frontier AI vs industrial customers cannot be assessed
      without a customer list.
    diligencePath: >
      Request the customer list under NDA in a data room; ask for the top-10 customers by revenue contribution; verify
      go-live status for each named relationship.
    relatedQuestionRefs:
      - QU002
      - QU025
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: blocking
    topic: licensing
    missingEvidence: Detailed asset, benchmark, and indemnity terms for enterprise contracts.
    whyItMatters: Public marketing language alone is not enough to assess legal or IP liability.
    diligencePath: Request current MSA, benchmark terms, IP schedule, and indemnity clauses.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: privacy
    missingEvidence: Privacy, consent, retention, and data-rights controls for EgoSuite capture operations.
    whyItMatters: Human-data collection across countries is central to the product and could block enterprise adoption.
    diligencePath: Request privacy policy pack, consent flow, retention policy, and data-processing map.
    relatedQuestionRefs:
      - QR006
  - type: missing-source
    severity: material
    topic: validation-gap
    missingEvidence: Independent benchmark audit or reference deployment showing RoboFinals predicts real-world outcomes.
    whyItMatters: Benchmark moat claims are hard to underwrite without third-party proof.
    diligencePath: Ask for external validation study, customer scorecards, or repeatable benchmark report.
    relatedQuestionRefs:
      - QR009
  - type: missing-source
    severity: minor
    topic: legal-disputes
    missingEvidence: Public litigation, enforcement, or dispute disclosures tied to Lightwheel's product operations.
    whyItMatters: Absence in corpus is not evidence of absence, so legal cleanliness is still unverified.
    diligencePath: Run legal dockets, sanctions, and enforcement checks in diligence.
    relatedQuestionRefs:
      - QR029
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-risk-register
    missingEvidence: Customer-specific contractual and insurance obligations beyond the public regime-level risks in the register.
    whyItMatters: Public law is only part of the risk surface for enterprise robotics infrastructure deals.
    diligencePath: Review customer contract templates, insurance coverage, and compliance annexes.
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: blocking
    topic: post-money-valuation
    missingEvidence: >
      The confirmed post-money valuation for Lightwheel's March 2026 and May 2026 Series A rounds, from a primary source
      such as a term sheet, investor letter, or secondary transaction pricing.
    whyItMatters: >
      The unicorn claim cannot be verified, acted upon, or incorporated into any valuation model without a confirmed
      post-money mark. Entry price discipline requires knowing where the last round was priced relative to the
      operational KPIs.
    diligencePath: >
      Obtain term sheets or investor confirmation letters from existing round participants; check secondary platforms
      (Forge, Equity Zen, Liquidnet) for any Lightwheel secondary transactions; request post-money mark directly from
      CFO with board-approved valuation.
    relatedQuestionRefs:
      - QV002
      - QV015
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-preference-terms
    missingEvidence: >
      Full cap table for Lightwheel including all existing shareholders, preference rights, liquidation waterfall,
      antidilution provisions, and pro-rata rights by round.
    whyItMatters: >
      Without preference terms, the effective entry price and distribution of exit proceeds cannot be modeled. Heavy
      preference stacks from state-linked investors could materially reduce common-equity returns even in successful
      exit scenarios.
    diligencePath: >
      Request cap table model from CFO; verify with legal counsel; confirm with each lead investor the specific terms of
      their round; check articles of association for any protective provisions or governance rights.
    relatedQuestionRefs:
      - QV019
      - QV026
  - type: conflicting-data
    severity: material
    topic: funding-history-discrepancy
    missingEvidence: >
      A reconciliation of the Crunchbase Seed round from August 2024 with the March 2026 Series A narrative, clarifying
      whether these are separate legal entities, different funding tranches, or a data ingestion error.
    whyItMatters: >
      If there is a separate earlier entity with its own funding history, the cap table and total funding figure may be
      materially different from what Western databases report. Unresolved, this creates a material due diligence red
      flag.
    diligencePath: >
      Ask Lightwheel's CFO to provide the complete funding history for all legal entities in the corporate structure;
      compare with Crunchbase and Tracxn entries for both "Lightwheel" and "Light Wheel Intelligence"; reconcile any
      differences in legal name and entity type.
    relatedQuestionRefs:
      - QV032
  - type: missing-source
    severity: material
    topic: revenue-run-rate
    missingEvidence: >
      Audited or management-confirmed FY2025 revenue, Q1 2026 recognized revenue (as distinct from orders), and gross
      margin or unit economics for Lightwheel's main product lines.
    whyItMatters: >
      All valuation scenarios rest on assumed ARR; without a confirmed figure, the bull, base, and bear cases cannot be
      distinguished, and no revenue multiple can be meaningfully applied.
    diligencePath: >
      Request management accounts with auditor review letter; ask CFO for revenue recognition policy distinguishing
      orders, deferred revenue, and recognized revenue; obtain a billings schedule broken down by contract type.
    relatedQuestionRefs:
      - QV006
  - type: missing-source
    severity: material
    topic: secondary-market-pricing
    missingEvidence: >
      Any secondary market transaction, tender offer, or investor-to-investor transfer for Lightwheel shares that would
      provide an independent third-party valuation mark.
    whyItMatters: >
      A secondary transaction is the most reliable independent valuation signal for a private company; its absence means
      all valuation marks are first-party or press-reported estimates.
    diligencePath: >
      Search Forge Global, EquityZen, and Liquidnet for Lightwheel secondary listings; ask existing investors whether
      any secondary transactions have occurred; check with placement agents who managed the 2026 rounds.
    relatedQuestionRefs:
      - QV015
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-set
    missingEvidence: >
      Private-market comparables for physical AI simulation and synthetic data infrastructure companies with disclosed
      valuation and revenue data, such as Covariant, Dextrous, Robust AI, Synthesis AI, or other companies in the same
      sub-vertical.
    whyItMatters: >
      The public comp set (Symbotic, Teradyne, Serve) spans a 100x valuation range and has limited business model
      similarity to Lightwheel; private comparables would provide more relevant revenue multiples for a
      stage-appropriate valuation approach.
    diligencePath: >
      Pull PitchBook or Crunchbase Pro data for physical AI data and simulation companies that raised Series A or B
      rounds in 2025-2026; request disclosed revenue or ARR from investors in comparable companies who can speak to the
      sector benchmarks.
    relatedTableRefs:
      - TV004
