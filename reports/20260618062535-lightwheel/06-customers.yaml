  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: contract-structure
      missingEvidence: >
        Executed contract or binding term sheet between Lightwheel and PeritasAI confirming
        the legal structure, milestone schedule, payment terms, and breakage clauses.
      whyItMatters: >
        Without confirmation that the PeritasAI partnership is a binding contract rather than
        an MOU, the flagship customer reference has no enforceable revenue commitment, materially
        affecting the customer proof valuation.
      diligencePath: >
        Request the executed agreement from Lightwheel's legal team; verify with PeritasAI's
        communications team; if MOU, obtain the binding conversion schedule and trigger conditions.
      relatedQuestionRefs:
        - QU003

    - type: missing-source
      severity: material
      topic: customer-retention
      missingEvidence: >
        Any independent evidence of customer churn, failed pilots, declined renewals, or
        negative customer experience with Lightwheel's simulation data or evaluation products.
      whyItMatters: >
        Absence of adverse customer evidence is not the same as high retention. Without churn
        or renewal data, the persistence of the $100M Q1 order run rate cannot be assessed.
      diligencePath: >
        Search for engineer-community discussions on GitHub, Hugging Face forums, and Chinese
        tech forums for complaints; request customer references and contact them independently;
        seek back-channel references from investors in frontier AI model companies.
      relatedQuestionRefs:
        - QU011

    - type: missing-source
      severity: material
      topic: repeat-order-composition
      missingEvidence: >
        A breakdown of Lightwheel's Q1 2026 orders showing the proportion from repeat customers
        vs. net-new accounts, and the proportion of recognized ARR vs. project-based orders.
      whyItMatters: >
        If Q1 orders are primarily net-new project orders rather than recurring revenue expansions,
        the implied annualized run rate is not durable, fundamentally changing the revenue trajectory.
      diligencePath: >
        Request a cohort analysis or billings schedule from the CFO; ask for the split between
        ARR contracts and project/milestone-based contracts in the Q1 2026 order total.
      relatedQuestionRefs:
        - QU025

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >
        The full roster of Lightwheel paying customers, including customer names, contract values,
        go-live dates, and use cases, none of which are publicly disclosed.
      whyItMatters: >
        The named customer proof table captures only 5 relationships from press releases and
        funding announcements. The real customer base is unknown; the concentration and mix of
        frontier AI vs industrial customers cannot be assessed without a customer list.
      diligencePath: >
        Request the customer list under NDA in a data room; ask for the top-10 customers by
        revenue contribution; verify go-live status for each named relationship.
      relatedQuestionRefs:
        - QU002
        - QU025
      relatedTableRefs:
        - TU003

