callouts:
  - calloutType: strength
    title: "$100M Q1 Orders Signal Genuine Commercial Momentum"
    body: >
      Lightwheel's Q1 2026 order volume of approximately $100M (~550M RMB) — confirmed by multiple
      independent sources and consistent across USD and RMB disclosures — represents the strongest
      commercial signal available for this company. The orders span two customer types converging
      on the same infrastructure need, suggesting product-market fit is not concentrated in a single
      use case. The Q1 volume is notable given a 10x revenue growth year in 2025 and the expectation
      that Q1 2026 alone will exceed the full 2025 annual revenue base.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU015
      - CU016

  - calloutType: risk
    title: "Weak Retention and Named Production Disclosure Limits Conviction"
    body: >
      Lightwheel's customer page provides no named customers, no logos with attributed use cases,
      and no case studies. There is no published NRR, GRR, churn rate, or customer count. The
      named customer proof available for diligence — primarily PeritasAI and ecosystem advisory
      roles — does not constitute confirmed production deployment with revenue attribution or
      independently verifiable retention. This is a material gap for any valuation exercise
      premised on recurring revenue assumptions.
    claimRefs:
      - CU005
      - CU020
      - CU021
      - CU022
      - CU032

  - calloutType: risk
    title: "EU AI Act Creates Regulatory Headwind for Healthcare Robotics Expansion"
    body: >
      The PeritasAI perioperative healthcare deployment falls within the EU AI Act's high-risk
      AI category, imposing conformity assessments, risk management systems, human oversight
      documentation, and post-market monitoring requirements. For any EU-jurisdiction healthcare
      deployment, these obligations could extend timelines and increase costs, potentially
      constraining addressable markets or delaying revenue recognition from the flagship
      customer reference. Lightwheel has not disclosed any compliance roadmap for this exposure.
    claimRefs:
      - CU017
      - CU018
      - CU019

