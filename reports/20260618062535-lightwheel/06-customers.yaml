company:
  name: Lightwheel
chapter:
  number: 6
  title: Customers
  summary: >
    Lightwheel closed approximately $100M (~550M RMB) in Q1 2026 orders spanning two converging
    customer types — frontier Physical AI model teams and industrial manufacturers — supported by
    the PeritasAI healthcare partnership, Hugging Face's adoption of LeIsaac, and a reported
    80%+ global simulation-asset share; however, the company names no customers publicly, discloses
    no retention metrics or customer count, and faces material EU AI Act compliance headwinds for
    its flagship healthcare deployment that limit conviction in the expansion thesis.

sections:
  - id: customer-segmentation-ecosystem
    title: Customer Segmentation and Ecosystem Overview
    body: |
      Lightwheel serves two converging customer segments: frontier Physical AI model teams
      (foundation model companies, AI research labs, and embodied AI startups requiring
      high-quality simulation data and evaluation infrastructure) and industrial manufacturers
      (automotive, logistics, healthcare, and manufacturing operators deploying robots at scale
      and needing simulation-backed validation before going live). The company's customer page
      states it is "Trusted by the world's leading AI and robotics teams" without naming any
      customer, logo, or use case publicly. The strategic thesis is convergence: both customer
      types need the same core infrastructure — simulation environments, behavior data generation,
      evaluation, and deployment feedback — but for structurally different reasons. Frontier AI
      teams are data-constrained; industrial manufacturers are risk-constrained. Lightwheel's
      four-layer platform (World, Behavior, Evaluation, Deployment) addresses both cohorts
      through a single integrated stack. The human data collection network spans more than
      7 countries through EgoSuite, broadening geographic supply. Revenue growth of 10x in
      2025 and Q1 2026 orders that reportedly exceeded the full 2025 revenue base collectively
      indicate rapid early commercial traction, though the segmentation of orders between frontier
      AI and industrial customers is not publicly broken out. The New Hope Group joint venture,
      formed to integrate embodied data with industrial agricultural and manufacturing scenarios,
      is the clearest evidence of strategic partner-channel development in the industrial segment,
      though its revenue contribution is undisclosed.
    claimRefs:
      - CU004
      - CU005
      - CU015
      - CU016
      - CU026
      - CU027
      - CU030
      - CU031
      - CU033
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: named-proof-deployments
    title: Named Customer Proof and Ecosystem Deployments
    body: |
      The most significant named customer-proof event disclosed by Lightwheel is its strategic
      partnership with PeritasAI, targeting deployment of up to 200 humanoid robots in live
      perioperative healthcare settings across 2026 and 2027. Announced formally in April 2026,
      this partnership constitutes the primary named reference available to diligence investors.
      Beyond PeritasAI, Chinese-language funding announcements reference ecosystem partners
      including NVIDIA, Google DeepMind, Figure AI, 1X Technologies, ByteDance, Alibaba, Agibot,
      Galbot, Toyota, Bosch, BYD, and Geely. The company claims that over 80% of simulation
      assets and synthetic simulation data used by leading global embodied AI teams originate
      from Lightwheel, and that all five top world-model research teams are collaborators.
      Tongyi Qianwen (Alibaba's language model division) co-develops a standardized evaluation
      loop on RoboFinals-100 with Lightwheel to establish an industry-wide benchmarking
      foundation. Independently verifiable, Hugging Face has adopted LeIsaac — Lightwheel's
      simulation workflow — in its official leRobot documentation as a standard framework,
      representing a third-party endorsement of technical relevance at scale. Lightwheel also
      serves as a core advisor to NVIDIA's Newton open-source physics engine, working alongside
      Google DeepMind, Disney Research, and Toyota Research Institute. Critically, these
      relationships constitute ecosystem adoption signals and partnership announcements — not
      confirmed named production customers with disclosed contract values, go-live dates,
      or retention data.
    claimRefs:
      - CU003
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU023
      - CU024
      - CU025
      - CU028
    tableRefs:
      - TU002
      - TU003
    figureRefs:
      - FU002
      - FU003

  - id: retention-expansion-risk
    title: Retention, Expansion, and Concentration Risk
    body: |
      Lightwheel discloses no net revenue retention (NRR), gross revenue retention (GRR),
      churn rate, renewal rate, or cohort data as of the June 2026 run date. No customer
      satisfaction scores, G2/Capterra/Gartner Peer Insights reviews, or independently
      attributed case studies are publicly available. The primary structural indicator of
      stickiness is the product architecture itself: EgoSuite data capture is
      environment-specific and task-specific, creating natural switching costs once a customer
      has trained robot policies on Lightwheel-generated data for a given production context.
      RoboFinals creates benchmark dependencies once a team has set its performance standards
      inside the platform. The Lightwheel-Platform Enterprise bundle is designed to deepen
      accounts over time as robot fleets expand to new task types and deployment environments.
      None of this structural stickiness has been validated by publicly disclosed retention
      or expansion metrics. Concentration risk is elevated: the company's order volume likely
      derives disproportionately from a small number of large frontier AI model team clients.
      The New Hope Group JV provides partial industrial-segment diversification but scope and
      revenue contribution remain undisclosed. No evidence of customer complaints, failed
      deployments, or churned accounts is publicly available; the absence of adverse evidence
      should not be interpreted as confirmation of high retention, as the company lacks
      transparency sufficient to assess either outcome.
    claimRefs:
      - CU014
      - CU020
      - CU021
      - CU022
      - CU026
      - CU032
      - CU034
      - CU038
      - CU039
    tableRefs:
      - TU004
      - TU005
    figureRefs:
      - FU004

  - id: adverse-regulatory-signals
    title: Adverse Regulatory and Deployment Risk
    body: |
      The PeritasAI partnership targets perioperative healthcare — a setting that falls
      squarely within the EU AI Act's high-risk AI category. Enacted by the European Parliament
      in March 2024 and entering full effect in phases through 2026-2027, the EU AI Act
      classifies AI systems deployed in healthcare as high-risk and imposes stringent
      obligations: risk management systems, technical documentation, human oversight mechanisms,
      post-market monitoring logs, and conformity assessments before market entry. For a
      deployment of up to 200 humanoid robots in live clinical environments, compliance
      requirements could materially extend development timelines, increase compliance costs,
      and limit addressable markets in EU jurisdictions. The EU AI Act also restricts real-time
      biometric data processing and mandates transparency for human oversight workflows — both
      relevant to perioperative robotics contexts. From a diligence perspective, Lightwheel's
      role as the simulation and evaluation infrastructure provider means it shares compliance
      exposure through any PeritasAI deployment into regulated European healthcare markets.
      The company has not publicly disclosed a compliance roadmap, EU market entry strategy,
      or conformity assessment plan for the PeritasAI program. This represents a material gap
      in the customer expansion thesis for the healthcare vertical.
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU037
      - CU040

