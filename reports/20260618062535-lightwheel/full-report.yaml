  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Lightwheel's public materials describe global egocentric data collection, commercially licensed simulation
              assets, enterprise AI infrastructure, and potential deployment into security-sensitive customer
              environments. That mix puts the company close to several legal regimes even before customer-specific use
              cases are known. The EU AI Act creates obligations for AI systems placed on the market or used in the
              Union, especially where safety, logging, transparency, and human oversight matter. China's outbound-data
              regime remains more permissive than its 2022 version, but the Stanford DigiChina analysis still highlights
              uncertainty in how cross-border business data is reviewed and interpreted. U.S. export-control exposure
              matters because Lightwheel's stack touches robotics simulation, data, and potentially dual-use technical
              know-how, while the public corpus does not disclose a formal export-compliance program. The legal risk is
              not that any violation is proven; it is that the company is operating in a category where customers and
              investors will expect clean answers on privacy, licensing, data rights, export scope, and jurisdictional
              controls before production-scale deployment.
