      - number: '3.2'
        title: Capability Comparison and Buyer Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The most important tradeoff is breadth versus assembly burden. NVIDIA already spans simulation, training,
              physics, and open datasets; Genesis pushes hard on simulation trust and evaluation speed; MuJoCo and
              robosuite provide a lighter-weight modular stack; and LeRobot plus Open X plus OpenVLA lower the barrier
              around data, models, and evaluation scripts. Lightwheel's answer is to package these needs into an
              enterprise workflow that includes commercial assets, large-scale egocentric operations, and benchmark
              orchestration. That is differentiated, but only if buyers value an integrated loop more than they value
              openness and flexibility. Many research teams will tolerate assembly effort to keep optionality.
              Industrial operators with real deployment timelines may prefer a vendor package if it materially reduces
              implementation risk. The competitive lens therefore is not feature count alone; it is how many
              high-friction handoffs the buyer still has to solve after choosing each route.
