              Funding coverage also accelerated in 2026. EqualOcean reported combined Series A++ and A+++ financing
              totaling RMB 1 billion in March; PEDaily and Gasgoo later reported a new May round led by Ant Group; and
              multiple outlets called the company the first unicorn in embodied data. None of those reports substitute
              for a cap table or audited financials, but they do support a directional conclusion: the company has
              attracted multiple institutional and industrial investors in rapid succession while broadening its
              external ecosystem. NVIDIA's newsroom identifies Lightwheel as a Newton adopter and Isaac Lab-Arena
              codeveloper, while Lightwheel's own Newton page describes active technical contribution rather than mere
              vendor alignment. This ecosystem fit is an important ground-truth anchor for later product and market
              chapters.
