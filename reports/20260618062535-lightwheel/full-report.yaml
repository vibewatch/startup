      - number: '7.4'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The encouraging point is that Lightwheel already markets several mitigation levers: commercially licensed
              assets, on-prem deployment, multi-engine evaluation, and explicit sim-real calibration work. Those levers
              reduce some buyer objections, but they do not replace evidence. The right underwriting frame is
              conditional. Investors should require tangible legal, security, and validation artifacts rather than
              accepting architecture claims at face value. Monitorable triggers should focus on whether Lightwheel can
              show clean data-rights documentation, a credible export-control and privacy program, independent reference
              customers, and proof that RoboFinals produces useful, stable results outside marketing demos. If those
              proofs are absent, the residual risk remains high because the business model relies on enterprise trust in
              evaluation and data infrastructure rather than on a low-friction self-serve software motion. That is
              especially true in healthcare and industrial settings where validation misses can create workflow, safety,
              and liability problems that are expensive to unwind after deployment.
