        title: Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers are easy to identify. More capable open models, expanding robot datasets,
              and rising automation demand all make simulation, data quality, and benchmark trust more important, not
              less. Genesis, the VLA survey, and Lightwheel's own RoboFinals and EgoSuite materials all frame the same
              problem from different angles: robotics teams cannot scale iteration if data is sparse, evaluation is
              shallow, or simulators are untrusted. Constraints are equally important. The European AI Act raises
              transparency and oversight burdens for high-risk systems, DigiChina highlights persistent uncertainty
              around cross-border data transfer rules, and the open-source ecosystem sets a low-cost substitute floor
              under core infrastructure. The result is a market with real demand but imperfect monetization clarity. The
              biggest unresolved questions are realized pricing by product layer, customer mix by segment, and how much
              of Q1 order volume converts into recurring, durable software-style economics rather than project-heavy
              integration revenue. That makes diligence on implementation burden and renewal evidence particularly
