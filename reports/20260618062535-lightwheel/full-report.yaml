        title: Moat Durability and Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The adverse case is credible and should not be softened. Genesis is trying to own trusted high-speed
              evaluation, MuJoCo-based stacks keep getting easier to use, ROS and Gazebo remain deeply embedded
              defaults, and open data and model ecosystems continue to erode the scarcity of component layers. Even
              NVIDIA is both partner and threat: Lightwheel benefits from building on Isaac Lab and Newton, but those
              same layers give NVIDIA and its surrounding community enormous influence over the core stack. Lightwheel
              still has a meaningful wedge because it commercializes licensed assets, large-scale field data, and
              industrial-grade evaluation in one package. But the wedge is conditional. It looks durable only when
              buyers need a closed-loop workflow, enterprise support, or deployment readiness faster than they can
              assemble it themselves. If the open ecosystem keeps absorbing more of those functions, Lightwheel's
              differentiation will narrow toward execution quality, domain specialization, and customer intimacy rather
              than toward proprietary technology alone. Buyers should assume several viable fallback routes exist if one
