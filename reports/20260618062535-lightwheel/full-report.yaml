  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Lightwheel presents itself as a physical-AI infrastructure company that helps robotics teams build, train,
              evaluate, and deploy robot models. Its public product surface is organized around four layers. SimReady
              Library is the world layer, providing prepared assets and scenes with commercial licensing. EgoSuite is
              the behavior layer, turning egocentric captures into structured human-demonstration data and annotations.
              RoboFinals is the evaluation layer, marketed as an industrial-grade benchmark and evaluation platform for
              frontier VLA and world models. Lightwheel-Platform Enterprise and its LW-BenchHub training framework sit
              above those layers as the operating stack that unifies simulation, data collection, and benchmarking for
              enterprise teams. The buyer workflow is explicit in the product pages: robotics teams adopt
              Isaac-Lab-based training infrastructure, collect trajectories from Isaac Sim and MuJoCo, enrich those
              datasets with Lightwheel assets or human demonstrations, then evaluate candidate policies on RoboFinals
              before deployment. This positioning makes Lightwheel more comparable to a data and tooling platform for
              robotics labs than to a standalone foundation-model vendor.
