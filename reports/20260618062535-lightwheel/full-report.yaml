      - number: '7.3'
        title: Partner, customer, and model risk
        blocks:
          - type: paragraph
            body: >-
              Lightwheel's commercial upside is linked to the same ecosystem dependencies that can weaken negotiating
              leverage. LW-BenchHub and Isaac Lab Arena are explicitly tied to NVIDIA Isaac Lab and Newton. RoboFinals
              also cites MuJoCo and Genesis support, while broader robotics buyers can choose community tooling like
              Open Robotics, Gazebo, LeRobot, or OpenVLA-centered stacks instead of buying a fully packaged vendor
              workflow. That means Lightwheel must keep winning on integration, operations, and enterprise usability
              rather than on exclusive access to the core tools. The public customer evidence is still thin: the company
              claims trust from leading teams and names Qwen as a partner, but the corpus does not show named
              long-duration customer contracts, retention data, pricing power, or revenue mix by module. If buyers
              conclude that the open ecosystem plus internal engineering can replicate enough of Lightwheel's value,
              margin and renewal risk rise quickly. The substitution threat is highest where buyers already employ
              strong platform engineers and can assemble enough of the stack from open frameworks plus internal data
              operations.
