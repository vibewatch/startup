chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and operating scope
        blocks:
          - type: paragraph
            body: >-
              Lightwheel's own site consistently frames the company as a Physical AI infrastructure vendor rather than
              as a robot OEM. The homepage and Lightwheel-Platform pages describe a stack spanning simulation assets,
              human-behavior data, industrial evaluation, and enterprise deployment workflows. The public product
              taxonomy is unusually coherent for a young company: SimReady Library supplies commercially licensed
              assets; EgoSuite supplies egocentric human data; RoboFinals supplies model evaluation; and
              Lightwheel-Platform Enterprise packages those components into an end-to-end operating layer. That breadth
              matters because it explains why later chapters should analyze Lightwheel as an infrastructure and tooling
              supplier serving robotics builders rather than as a direct hardware competitor to humanoid manufacturers.


              The legal-entity and location picture is less clean. Baidu Baike records Lightwheel Intelligent (Beijing)
              Technology Co., Ltd. as established on 2023-01-16 with a Haidian District registered address. At the same
              time, Lightwheel's English-language press materials use U.S. datelines and the public website does not
              publish a single canonical headquarters statement. The safest conclusion is that the company has a
              China-centered legal footprint with at least some U.S.-facing commercial presence, but not enough public
              documentation to declare one uncontested headquarters. That ambiguity is manageable for a draft overview,
              but it should not be silently normalized into later chapter assumptions.
