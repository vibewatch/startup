      - number: '1.3'
        title: Funding milestones, ecosystem positioning, and product chronology
        blocks:
          - type: paragraph
            body: >-
              The public chronology becomes much clearer from late 2025 onward. EgoSuite and RoboFinals were both
              publicly introduced on 2025-12-04, giving Lightwheel named artifacts for the behavior-data and evaluation
              layers that the homepage had already previewed conceptually. In 2026, the company added two more
              outward-facing signals of maturity: official commercialization copy claiming approximately $100M in Q1
