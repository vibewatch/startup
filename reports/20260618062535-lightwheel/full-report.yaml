      - number: '2.3'
        title: Buyers, Users, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Lightwheel's source set points to a two-track buying motion. Frontier labs and model teams need
              higher-quality data, harder benchmarks, and faster evaluation loops because open foundation models and
              cross-robot datasets have raised the ceiling for experimentation. Industrial adopters come from a
              different angle: they want to reconstruct real workspaces, validate policies before hardware touches
              production, and expand deployment gradually once failure modes are visible. The users inside these
              accounts are likely robotics engineers, simulation teams, data operations leads, and evaluation owners.
              The payers and sponsors are more likely to sit in AI infrastructure, automation, manufacturing operations,
              or corporate transformation budgets. That split matters because Lightwheel is not selling one-off datasets
              alone. It is selling a workflow that connects environment capture, behavior data, and readiness
              diagnostics. The consequence is a market where commercial success depends as much on integration and
              process fit as on raw model performance claims.
