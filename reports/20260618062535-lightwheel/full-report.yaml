      - number: '8.2'
        title: Revenue Momentum and Commercial Traction
        blocks:
          - type: paragraph
            body: |
              Lightwheel's commercial signals are the strongest available inputs for any valuation
              exercise, but they remain company-claimed and unaudited. Q1 2026 orders totaled
              approximately $100M (~550M RMB), reported by PRNewswire and independently cited by
              Robotics and Automation News and Gasgoo. The company claims 10x revenue growth in FY2025
              versus FY2024 and projects that Q1 2026 revenue alone will exceed the full FY2025 base,
              implying rapid compounding. If taken at face value, this would suggest an annualized 2026
              run rate of approximately $400M+ in orders, placing Lightwheel in a revenue bracket that
              could support a unicorn valuation under aggressive growth multiples. However, critical
              ambiguities limit the analytical utility of these figures: the relationship between
              "orders" and recognized revenue is unspecified; it is unclear whether orders represent
              committed ARR contracts, project-milestone-based engagements, letters of intent, or
              conditional agreements. No gross margin, customer acquisition cost, payback period, or
              unit economics figure has been publicly disclosed. The New Hope Group joint venture and
              the PeritasAI partnership are the two most prominent named commercial relationships;
              neither has disclosed contract value, go-live date, or revenue contribution. The absence
              of a disclosed ARR figure means no conventional revenue multiple analysis can be directly
              applied, and any scenario analysis depends on assumptions about both the level and
              recurrence of 2026 revenue.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV024
