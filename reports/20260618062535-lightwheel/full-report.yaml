      - number: '5.2'
        title: Architecture, simulators, and workflow design
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence shows that Lightwheel's architecture is intentionally simulator-centric and
              multi-engine. LW-BenchHub is built on NVIDIA Isaac Lab, with Lightwheel stating that Newton integration is
              planned as NVIDIA's broader Isaac-Lab/Newton work lands. The platform page says Lightwheel's data factory
              can collect physics-accurate trajectories from Isaac Sim and MuJoCo, across teleoperation and
              reinforcement-learning collection modes, while the NVIDIA and GitHub materials show that Newton itself is
              an open-source GPU-accelerated physics engine built on Warp and OpenUSD with MuJoCo Warp as a key backend.
              That means Lightwheel's architecture does not depend on inventing a proprietary simulator; instead it
              depends on integrating several external simulation stacks into a usable pipeline. The advantage is speed
              to market and broad compatibility. The risk is that platform quality depends on keeping compatibility
              current across Isaac Sim, Isaac Lab, Newton, MuJoCo, and any additional engines exposed through the
              benchmark layer.
