      - number: '5.4'
        title: Trust, quality, compliance, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public product story contains some trust-positive signals, but not a complete enterprise-control
              package. Lightwheel emphasizes commercial licensing for SimReady assets, deterministic multi-engine
              evaluation, on-premise deployment for security-sensitive buyers, and Real2Sim calibration for benchmark
              grounding. Those are useful product-level controls because they reduce content-rights friction, help labs
              compare models across solvers, and let buyers keep sensitive data inside their own environments. At the
              same time, the source corpus does not show a public privacy policy, security whitepaper, SOC 2 statement,
              export-control program, or named compliance certifications for EgoSuite data operations or benchmark
              services. The result is a common robotics-infrastructure pattern: the product surface is compelling and
              technically credible, but the diligence burden shifts to private materials on data rights, security
              architecture, and cross-border handling before a large enterprise or investor should underwrite the stack
              as production-ready without reservation for large, security-sensitive industrial deployments and
              procurement-heavy sectors.
