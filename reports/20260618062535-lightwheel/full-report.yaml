  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Lightwheel's public materials imply a multi-stream revenue model rather than a single software license.
              SimReady Library points to commercially licensed assets; EgoSuite points to managed data capture and
              annotation; RoboFinals points to evaluation workflows that can plausibly be sold as a platform or service;
              and Lightwheel-Platform Enterprise packages those components into an end-to-end operating layer. The Q1
              orders page strengthens that reading by explicitly saying the company booked demand across simulation,
              data generation, evaluation, and deployment-oriented systems. In other words, the company appears to
              monetize a workflow stack rather than one SKU.


              Pricing evidence is thin but directionally useful. The contact page begins with a project-budget selector
              starting at $1M, which is a strong sign of enterprise sales and custom scoping. The asset-library page
              emphasizes commercial licensing, while the platform page offers cloud and on-prem deployment options. None
              of this reveals realized ASPs, discounting, or recurring mix, but it does establish that Lightwheel is not
              behaving like a low-ticket tooling vendor. The likely revenue profile is a blend of project-based
              services, platform access, custom deployment work, and possibly usage-based or benchmark-based evaluation
              revenue. That mix can produce strong bookings without generating software-like margins, so the absence of
              product-line revenue disclosure is a material underwriting constraint.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
