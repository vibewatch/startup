  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Infrastructure Stack
        blocks:
          - type: paragraph
            body: >-
              Lightwheel does not fit neatly inside a single software bucket. Its own materials describe a stack that
              starts with SimReady assets and scenes, moves through egocentric human data capture and annotation, and
              culminates in industrial-grade evaluation and deployment workflows. That means the relevant market
              boundary is not the whole humanoid or robotics market and not a narrow simulation engine category either.
              It is the overlap where robotics teams are paying to recreate operating environments, generate
              robot-usable data, benchmark model behavior, and then connect those artifacts into deployment. The same
              sources also imply clear exclusions. Robot OEM revenue, chip manufacturing, and general AI software are
              too broad, while free community frameworks already cover many primitives. Lightwheel therefore sells into
              a narrower embodied-AI infrastructure layer whose value rests on integration, enterprise readiness, and
              the ability to turn multiple open components into a usable closed loop.
