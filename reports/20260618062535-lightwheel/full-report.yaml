      - number: '3.3'
        title: Switching Costs and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Switching costs exist, but they are not absolute. Lightwheel benefits when a customer has already
              recreated environments, aligned task data, and built evaluation logic around one workflow, because
              replacing that loop takes time and operational energy. Yet the same source set shows why multi-homing
              stays plausible. Isaac, MuJoCo, Gazebo, LeRobot, and Open X are all open components, and RoboFinals itself
              supports multiple simulation backends rather than enforcing one proprietary engine. That lowers the
              penalty for buyers to keep one foot in open tooling even when they buy a commercial layer. Teams can also
              start from the status quo — ROS-native stacks, open benchmarks, or modular model pipelines — and add
              vendor modules only where pain becomes acute. The practical result is that Lightwheel's moat is likely
              strongest in accounts that value reduced assembly burden and weakest in accounts that treat workflow
              assembly as core internal capability.
