  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              Lightwheel is not competing against one clean peer set. Buyers can solve the same job through at least
              five routes: the NVIDIA Isaac stack, high-performance open simulation platforms such as Genesis, modular
              physics and benchmark ecosystems around MuJoCo, ROS-native open platforms built around Gazebo, and data or
              model ecosystems such as LeRobot, Open X, and OpenVLA. Internal build is the sixth force sitting
              underneath all of them. That matters because Lightwheel's commercial advantage is not basic access to
              simulation or model artifacts; those components are already available. The real question is whether a
              buyer needs a vendor to connect world reconstruction, behavior data, evaluation, and deployment into one
              workflow. In that framing, Lightwheel competes partly against named vendors and partly against the buyer's
              confidence that it can compose an equivalent stack from open pieces without losing too much time, realism,
              or benchmark discipline.
