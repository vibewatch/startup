      - number: '4.3'
        title: Capital adequacy, comparables, and disclosure gap
        blocks:
          - type: paragraph
            body: >-
              Fresh capital availability is the strongest positive financial signal after demand. EqualOcean reports RMB
              1 billion of March 2026 A++ and A+++ financing, while PEDaily and Gasgoo report a new May round led by Ant
              Group. Both sources say proceeds are going into core infrastructure, delivery scale, and global expansion.
              That is consistent with a company still investing aggressively in capability buildout rather than
              optimizing for near-term EBITDA. However, none of the cited sources disclose cash on hand, burn, runway,
              debt, or a financing covenant package. The open record therefore supports a conclusion of continued access
              to capital, but not a conclusion of balance-sheet sufficiency.


              Public comparables help illustrate the opacity gap, not solve it. Serve Robotics, Symbotic, and Teradyne
              all have visible public-equity or filing surfaces that let outside investors trace 10-Qs, 8-Ks, and market
              capitalization. Lightwheel has no analogous filing surface. That means even a rough relative-underwriting
              exercise must rely on proxies: Teradyne shows what scaled robotics-platform ownership looks like in public
              markets; Symbotic shows how large automation narratives can price; Serve shows how much smaller
              delivery-stage robotics equity can trade while still maintaining periodic disclosure. What those
              comparables do not tell us is Lightwheel's own gross margin, booking conversion, or cash consumption.
              Open-source evidence remains strongest on commercial ambition and weakest on financial quality.
