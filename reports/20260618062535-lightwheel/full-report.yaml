companyProfile:
  summary: >
    Lightwheel is a Beijing-founded physical AI infrastructure company building a closed-loop stack across simulation
    assets, egocentric human data, evaluation, and deployment feedback. Public materials position SimReady Library,
    EgoSuite, RoboFinals, and Lightwheel-Platform Enterprise as the core commercial surfaces. Third-party and
    company-linked sources indicate Lightwheel raised roughly US$145M across two 2026 Series A rounds and has claimed
    unicorn status, while NVIDIA and Hugging Face ecosystem references support technical relevance. The diligence
    constraint is disclosure quality: the company has not publicly disclosed audited revenue, ARR, margins, headcount,
    customer count, or post-money valuation terms, so the investability call depends more on data-room verification than
    on public-market narrative.
  foundedDate: '2023-01-16'
