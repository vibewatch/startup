    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Base Power Company 成立于 2023 年，总部位于德州
              Austin。公司跑的是纵向整合的住宅能源模式：在家庭端安装电池，保留硬件所有权，在放松管制的服务区供应电力，并调度聚合电池组提供电网服务或公用事业容量支持。这套结构仍接近「发电售电一体」模式，但到 2026 年
              8 月，运营范围已从德州扩展到两个州。


              面向消费者的方案现在以 Base Core 为中心。这是一款公司自建的家用电池，提供 39.2 kWh 和 78.4 kWh 两种配置。在德州，Base 将硬件与零售电力计划绑定，同时变现零售利润和批发 /
              电网支持价值。在伊利诺伊州，Base 针对 ComEd 服务区调整了模式，采用更偏零售的结构，重点降低容量和输电费用，而不是 ERCOT 式能源套利。在 El Paso Electric、Austin
              Energy 等受管制或市政供电区域，公司则向公用事业出售容量或电网支持服务，房主负责托管电池。


              本次抓取到的公司官网将 Base 定位为一家把可负担、可靠能源带到美国各地家庭的电力公司，并称 Base 已为超过 30,000 户家庭供电。该规模数据来自公司披露而非审计，但明显高于 2026 年早些时候可见的
              10,000 户里程碑，也吻合公司快速跨州扩张的叙事。
