      - number: '2.2'
        title: 市场规模与 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              多家分析机构给出的美国户用储能市场规模差异很大，取决于它们统计的是硬件收入、生命周期服务收入，还是更广义的能源服务。P&S Intelligence 将 2025 年美国户用储能市场估为 $174M，到 2030
              年增至 $604M（CAGR ~28%），口径较窄，覆盖硬件和服务。Emergen Research 采用更宽口径——纳入电网服务合同和软件——将 2024 年美国住宅板块估为 $3.5B，预计 2034 年达到
              $15.2B，CAGR 为 15.9%。估算差异主要来自是否纳入 VPP 电网服务收入和订阅变现路径。根据 SEIA/Benchmark Mineral Intelligence Energy Storage
              Market Outlook Q1 2026，截至 2026 年初，美国累计户用电池储能装机约 9 GWh，仅 2025 年就部署 3.1 GWh，同比增长 51%。

              单看 ERCOT，德州有望在 2026 年超过加州，成为美国最大电池储能市场；进入 2026 年时，电网级 BESS 容量达到 14 GW，是 2025
              年水平的两倍。户用和分布式储能规模小得多，但增长很快。ERCOT 的 ADER 试点（Base Power 已获资格）在 2025 年中将全系统上限从 80 MW 扩至能源 160 MW、non-spin 和
              ECRS 各 80 MW。在德州家庭层面，电池价格已降至约 $117/kWh——约为 2023 年成本的三分之一——扩大了潜在可服务基础。

              自下而上估算 Base Power 在德州的 SOM：ERCOT 服务约 12M 个住宅电表。按 1–2% 年渗透率（Base Power 的公开目标）计算，对应 120,000–240,000
              户家庭。若平均系统为 20 kW（两块 11.4 kW/25 kWh 电池），订阅费为 $29/月，每年每个百分点渗透对应约 $42M–$84M 年化订阅收入，尚未计入电网服务收入。若 ERCOT 全域达到 1%
              渗透，ADER 容量约为 2.4 GW 聚合户用电池组，远超当前试点上限，说明监管扩容余地才是市场获取的约束，而不是需求或硬件成本。

              全球 VPP 市场——Base Power 的参考同业组——2026 年估值约 $6–7B，并预计到 2035 年仅美国市场就达到 $11.5B；根据 GMInsights，住宅板块 CAGR 为
              22.5%。相互矛盾的估算保留不删：分析报告对 2026 年全球市场给出 $4.1B 到 $6.7B 的宽幅区间，反映了「市场规模」到底统计 VPP 平台收入、DER 硬件还是电网服务交易量的真实方法论差异。
