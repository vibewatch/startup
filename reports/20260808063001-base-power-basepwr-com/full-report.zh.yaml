  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从证据支柱到有条件正面建议的决策链，追踪市场、产品、单位经济和估值输入。
    data:
      nodes:
        - id: n1
          label: 部署速度（强）
          description: 声称 30,000+ 户家庭、已部署 500+ MWh、~100 batteries/day、Illinois 已上线
        - id: n2
          label: 电网服务收入（反向）
          description: ERCOT 电池收入 2025 年下降 90% 至 ~$29/kW；结构性饱和可能持续到 2026 年
        - id: n3
          label: 垂直整合模型（有前景）
          description: 拥有 / 运营电池 + 零售电力；若制造规模化，具结构性资本开支优势
        - id: n4
          label: 制造执行（未验证）
          description: 城市激励交易 2026 年 3 月告吹；Gen 3 工厂无确认租约；本土成本曲线未证明
        - id: n5
          label: 全国扩张（未证明）
          description: Illinois 现在确认非 Texas 扩张，但逐州经济性和可重复性仍未证明
        - id: n6
          label: 估值信号（偏贵）
          description: 投后 $13B；约为 2025 年收入估计的 ~1083x、先前 2026 年预测的 ~186x；公开可比支持仍弱
        - id: n7
          label: 继续研究 / 按当前条款放弃
          description: 如果没有私有尽调访问或更低价格，公开记录不支持按 Series D 标记进入
        - id: n8
          label: 必需证据门槛
          description: 经审计单位经济；股权结构表和优先股堆叠；Gen 3 成本曲线；非 ERCOT 市场计划
      edges:
        - from: n1
