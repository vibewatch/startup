      - number: '1.2'
        title: 创始人与领导团队
        blocks:
          - type: paragraph
            body: >
              Base Power 由 Zach Dell（CEO）和 Justin Lopas（COO）于 2023 年 8 月联合创立。Dell 当时 29 岁，是 Dell Technologies 创始人
              Michael Dell 之子。他在 University of Southern California 学习社会科学、心理学和经济学（2019 届），随后先后在 Blackstone 和 Thrive
              Capital 任投资人，并在此形成了对分布式能源主题的判断。Lopas 曾任 Anduril Industries 制造负责人，也曾是 SpaceX 项目的首席制造工程师。多位投资人把两人的互补能力——Dell
              负责金融和战略，Lopas 负责硬件运营——视为关键的降风险因素。

              扩展后的领导层大量来自高精度制造和软件密集型消费硬件背景。Dino Sasaridis（硬件负责人）曾领导 Tesla Powerwall 工程团队。Jared Greene（软件负责人）曾开发 SpaceX
              Starlink 的激光网状通信系统。Cole Jones（增长负责人）曾负责 Starlink 的商业化。Dana Paz（部署负责人）曾领导 Anduril 的制造工程团队。Travis
              Kavulla（政策负责人）曾任 R Street Institute 能源与环境政策主管，也曾任 Montana 公用事业委员。Zina Bash（首席法务官）曾是 Keller Postman 高级合伙人。

              高管经验集中在 SpaceX、Tesla、Anduril、Blackstone 和 Thrive，形成了可见的关键人物依赖：Dell 或 Lopas
              一旦离开，既会冲击投资人关系，也会削弱支撑快速制造爬坡的运营执行力。
