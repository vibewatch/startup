      - number: '8.5'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Base Power 仍有可行 IPO 路径，因为公司现在具备公开市场投资者认得的要素：超高增长叙事、本土制造故事、AI /
              数据中心邻近性、消费者加电网基础设施定位，以及蓝筹股东结构表。但成功上市的门槛也已提高，因为 $13 billion 私有市场标记现在要求大得多的收入、更清晰的毛利披露，以及更高信心证明
              Texas/Illinois 打法可泛化。


              在当前估值下，战略收购作为干净退出的可能性降低，因为多数现实战略买家很难在没有极强经济性证明或独特战略协同的情况下，证明支付高于已很激进的私有市场价格是合理的。这意味着公开市场可行性更重要，而不是更不重要。


              尽调要求也相应比以前更严格：经审计的单位经济、逐州贡献毛利、Series D 后股权结构表和优先权细节、制造吞吐量和良率，以及 Illinois 或第三个市场无需依赖 Texas
              特定假设也能产生有吸引力回报的证明。
