      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 高波动市场里的快速放量
            body: >
              Base Power 在首批部署后约 18 个月内铺设了 >100 MWh 户用电池容量，获得 ERCOT ADER 批发项目资格，并在 2026 年 3 月前锁定五家德州公用事业合作伙伴。住宅许可捷径和
              Lennar 住宅建筑商渠道支撑了这种执行速度，也让 Base 在分布式储能中形成了可持续的先发优势。
            calloutType: strength
            claimRefs:
              - CO029
              - CO031
              - CO032
              - CO035
          - type: callout
            title: 电池放电条款削弱备电价值主张
            body: >
              Base Power 的合同允许公司在用电高峰期将客户电池放电至 20%，以向电网售电——而这恰恰是电网最可能停电的条件。一份独立 DFW
              电工评测将其称为「大多数人最容易忽略的一点」，并建议若要真正实现全屋保护，应将 Base 与补充发电机搭配。商业 VPP 用例与客户备电预期之间的结构性张力，会带来声誉和流失风险，尤其是在高关注度停电事件之后。
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
          - type: callout
            title: 单位经济性依赖波动剧烈的 ERCOT 套利
            body: >
              第三方分析估计，在当前定价下，每个 25 kWh 单元的简单回收期为八到九年，盈利取决于 ERCOT
              批发价格波动能否持续。更多储能资产进入市场后，套利价差可能收窄。此外，公司此前依赖中国制造电池供应链，带来关税敞口；Austin 工厂目前还不能完全替代。
            calloutType: risk
            claimRefs:
