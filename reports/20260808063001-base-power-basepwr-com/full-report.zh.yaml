      - number: '4.3'
        title: 资本充足性与融资架构
        blocks:
          - type: paragraph
            body: >-
              Base Power 的资本底座已经进入真正的巨额轮次区间。继 2025 年 4 月 $200 million Series B、2025 年 10 月 $1 billion Series C 之后，公司在
              2026 年 8 月宣布第二笔 $1 billion 融资，投后估值 $13 billion。与公司相关的发布报道称，累计融资现在已超过 $2.5 billion。


              这笔融资显著拉长了制造设备、库存、部署人工、软件、营运资本和新市场启动成本的现金跑道。它也降低了 Base 在公开证明更多单位经济之前，被迫依赖项目融资或资产支持融资的即时风险。实际含义是，Series D
              降低短期资金风险，同时抬高长期业绩压力：一家估值 $13 billion 的公司，被要求把规模指标转化为可证明更优的经济性，而不只是继续扩大部署收入线。


              当前报道指向的运营规模已经可观。TechCrunch 报道部署超过 500 MWh、每天约安装 100 块电池；与公司相关的行业报道称 Factory 1
              每月生产数千套系统。即便有这种势头，外部投资者仍无法验证烧钱速度、毛利率、获客成本、坏账敞口、质保准备假设，或未来增长在多大程度上继续依赖股权资本补贴。
