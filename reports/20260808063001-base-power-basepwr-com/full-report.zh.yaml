      - number: '4.2'
        title: 硬件成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              Base Power 的单位经济由每块已安装电池的高额前置资本开支决定，再用 36 个月或更长服务周期里的混合收入回收。Sacra 估计，在 $3,000 联邦投资税收抵免之前，Base Power
              每块电池的全包安装成本约为 $10,000；扣除后，公司侧净成本约为每台 $7,000。面向消费者的安装费（$695–$995）覆盖不到公司净硬件成本的 15%，意味着 Base Power 每次安装先垫付约
              $6,000–$6,300 补贴。这种补贴融资模型类似 SolarCity 开创的太阳能租赁打法，规模和长期合约是经济可持续的前提。


              NREL 的 2024 Annual Technology Baseline (ATB) 将采用 LFP 化学体系、2023 车型年系统的住宅电池储能包成本基准定在 $283/kWh
              DC；把逆变器、系统配套、人工、许可和销售成本计入安装口径后，约升至 $1,300/kWh。对 25 kWh 系统而言，市场化安装成本约为 $32,500，远高于 Base Power 面向消费者的价格。Base
              Power 的垂直整合策略——自研设计、自行制造（Austin 的 Factory One 生产 Gen 3）、自营安装——目标是把硬件成本压到市场基准以下，但 Gen 3 在 2026
              年中期前的爬坡带来制造执行风险。


              Sacra 估计回本周期约 3.5 年，主要由零售电力毛利和批发套利驱动，而不是单靠租赁费。这个 3.5 年周期假设 ERCOT 批发价格波动稳定、客户持续留存、ADER
              市场监管准入延续，且电池衰减没有实质性短板。接近零的已披露流失（一名客户截至 2025 年 8 月离开）是正向领先信号，但毛利率、EBITDA 和单台贡献毛利仍未披露，外部无法独立验证回本模型。系统为房主备用保留
              20% 电池容量（每 25 kWh 单元约 ~5 kWh），其余 80% 可用于日常电网交易——这一结构性承诺限制备用深度，但最大化可变现调度容量。
