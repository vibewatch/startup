      - number: '4.5'
        title: 附录图表
        blocks:
          - type: callout
            title: 资本强度相对收入规模过高，使公司结构性依赖持续股权融资
            body: >-
              以约 ~$1.3 billion 融资对应 2025 年 $12 million 收入计算，Base Power 的资本效率比约为 108:1——也就是每产生 $1 年收入，公司已投入超过 $100
              投资人资本。这个比例符合早期硬件平台特征，本身不构成否决项，但意味着公司近期生存的前提，是继续以有利估值获得股权融资。若投资人胃口恶化——由利率变化、政策风险（ITC 逐步退出或 FEOC
              限制）或收入目标落空驱动——fleet 达到现金流盈亏平衡前就可能触发融资危机。
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
              - CI017
              - CI032
          - type: callout
            title: 批发套利收入是回本引擎，但仍未验证且依赖市场
            body: >-
              Base Power 单位经济中所谓 3.5 年回本，依赖批发套利成为主导收入贡献项——这条收入流在单台层面尚未验证，并依赖 ERCOT 价格波动持续、ADER 项目成熟以及 QSE 成本结构。截至 2025
              年中，所有参与方实际调度的 ADER 容量只有 15 MW，单一聚合体的盈亏平衡规模约为 15–20 MW。若新输电或发电增加让 ERCOT 电网条件波动下降，或监管变化限制 ADER 参与，套利层可能明显压缩。
            calloutType: risk
            claimRefs:
              - CI007
              - CI027
              - CI028
              - CI029
          - type: callout
            title: 公用事业 tolling 协议形成第四层收入，可能改善 fleet 经济性
            body: >-
              Austin Energy 交易给出一个战略模板：同一套硬件在既有零售和套利收入之外，还能为 Base Power 带来稳定、不随价格波动的容量付款。40 MW 每年 $4.08 million，隐含费率为
              $8.50/kW-month，提供温和但稳定的增量收益。若在 ERCOT 内更多市政公用事业和合作社复制，tolling 协议可在 200–400 MW 合约容量下贡献 $20–$40 million
              年收入，不增加硬件部署也能显著改善混合资本回本。
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI036
          - type: callout
            title: 2026 年 $70 Million 收入预测假设 Gen 3 制造爬坡成功
            body: >-
              公司 2026 年 $70 million 收入预测取决于 Factory One 扩大 Gen 3 电池产量。CEO 已公开承认，到 2026 年中期，制造爬坡会很「difficult」。如果 Gen 3
              产量低于目标，在不显著抬高成本的情况下，靠进口或外包硬件无法维持 20 MW/月的部署速度。若 2026 年安装量短缺 50%，收入大约只有 $40–$45 million，而不是 $70 million
              目标；这可能迫使公司比 Series C 现金跑道原本支持的时间更早再融资。
            calloutType: assumption
            claimRefs:
              - CI006
              - CI022
              - CI032
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 电池硬件与产品组合
        blocks:
          - type: paragraph
            body: >-
              Base Power 当前旗舰硬件是 Base Core，这是一款公司自制住宅电池，2026 年 8 月发布。系统提供两种配置：39.2 kWh 单柜单元，以及 78.4 kWh 双 Core
              配置。行业报道一致把 Core 描述为美国市场上最大的单柜住宅电池之一。


              Core 系统采用磷酸铁锂（LFP）化学体系，面向全屋备用和电网参与。公开发布报道称，这块电池安装不到一小时，按 -22°F 至 122°F 的极端天气运行设计，内置发电机接口；在 Base
              建模的住宅用电假设下，39.2 kWh 配置可提供约 36 小时备用电力。Solar Power World 报道，新系统至少取得 UL 1973 和 UL 9540 认证。


              Base 的产品栈现在横跨不止一种运营模式。在 Texas 放开的电力市场，电池与 Base 供电绑定；在 Illinois 的 ComEd 区域，电池与围绕分时电价、规避容量费 /
              输电费设计的零售供电报价绑定；在公用事业合作伙伴项目中，电池可由客户托管，但调度控制权在公用事业手中。这种广度具备战略价值，但也意味着「产品」既是电池柜，也是控制与合约系统。
