      - number: '3.5'
        title: 现状与替代方案
        blocks:
          - type: paragraph
            body: >
              最大的竞争集合不是其他 VPP 公司，而是德州房主在遇到 Base 之前会选择的现状方案：没有备用电源（接受停电风险）、丙烷 / 天然气备用发电机、电网友好型智能恒温器，以及完全没有储能的零售电力计划。


              **无备电现状：**多数德州住宅客户经历过一次或多次重大停电事件（Winter Storm Uri 2021、2023 年夏季高温事件、Winter Storm Fern
              2024），但尚未安装备用电源。购买硬件的经济门槛是主要阻碍——Base 以 $695 入门价直接解决这一点，而类似发电机或电池替代方案需要 $15,000+。


              **丙烷 / 天然气备用发电机（Generac、Kohler）：**Generac 在美国家用备用发电机市场占有约 75% 份额。安装成本为
              $10,000–$20,000+，停电期间还需持续燃料成本和维护。发电机只要有燃料即可无限期运行，但会排放 CO，并需要户外安放。Base 面向 GVEC 会员将其方案宣传为相比发电机「比类似备电方案便宜
              95%」。多日长时间停电时，发电机在续航上优于电池；但对典型德州停电（根据 Base 电池组数据，97%+ 低于 3 小时）而言，Base 的 25 kWh 电池几乎覆盖所有事件。


              **需求响应项目（Renew Home/OhmConnect、Voltus、Leap）：**Renew Home——Google 的 Nest Renew 与 OhmConnect
              合并后的实体——现在按入网家庭数计算是北美最大的住宅 VPP，使用智能恒温器和可控负荷，而不是电池。这些项目无需硬件安装负担即可提供电网价值（削峰、负荷转移），但无法在电网停电期间提供全屋备电，而这正是 Base
              最强的消费者价值主张。截至 2026 年 5 月，OhmConnect 已将其德州客户迁移至 Direct Energy，并在 Renew Home 平台下运营。


              **采用分时电价的零售电力计划：**德州放松管制市场（130+ 家
              REP）提供分时、免费夜间和太阳能回购计划，让房主无需电池也能部分套利电网价格波动。随着太阳能回购价值下降（「太阳能孤儿」），这些计划吸引力下降，Sonnen/Solrite 的 VPP
              明确针对这一缺口。Base 作为 REP，直接与其他德州 REP 争夺电费账单关系，其竞争性电价取决于电网条件和电池调度收入分享。


              **既有公用事业扩张电池项目：**目前作为 Base 伙伴的合作社和 IOU，理论上可以用公用事业级电池采购加 AutoGrid 这类 DERMS 供应商，把分布式电池项目内部化。GVEC 的 CEO
              指出，合作社评估过「公用事业级、配电网连接电池」，并判断表后资产能提供更好的输电成本降低价值——这暂时验证了 Base 模式，但也说明公用事业正在积极评估所有选项。
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: ERCOT 收入压缩是单位经济性的重大威胁
            body: >
              ERCOT 电池辅助服务和套利收入从 2023 年到 2025 年下降 89%（Enverus 数据）。Base 估算每块 25 kWh 电池单位收入约 ~$2,075/年，意味着基准情形下回收期为 8–9
              年——对一家资本密集型、员工年开销 $15M+ 的公司而言偏薄。若 ERCOT 长期维持低波动环境，Base 将被迫更多依赖固定公用事业 tolling
              合同，而不是现货市场收入；这会加速向受管制公用事业模式转移，但也要求合同期限长于当前 3 年最低期。
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP028
              - CP029
          - type: callout
            title: 公用事业合作社伙伴模式创造可持续分销护城河
            body: >
              Base 的五个德州公用事业合作社伙伴（CoServ 100 MW、GVEC 50 MW、Bandera、Farmers Electric 等）给了它一个 B2B 获客渠道，硬件 OEM 很难复制。GVEC 的
              CEO 将表后资产描述为相比公用事业级电池能提供更好的输电成本降低价值——这从监管和运营上验证了 Base 模式与纯硬件路径的技术差异。ERCOT 内目前没有竞争者持有类似规模的合作社合同。
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP024
          - type: callout
            title: Tesla 和 Sunrun 在价格战场景下构成规模威胁
            body: >
              Tesla 和 Sunrun 都有现成房主渠道、内部或合约电池供应，以及监管准入（ERCOT REP 牌照、ADER 资格），如果 VPP 经济性支撑激进定价，它们有条件压低 Base
              价格。一位行业分析师指出，「Tesla 或 Sunrun 复制他们的成功并不需要太多」，而且这些公司「会在任何价格战中赢过 Base」。Base 的 $1B Series C 和 Austin
              制造战略，是对这一场景的直接对冲，但对一家 2023 年成立的公司而言，制造执行风险是真实存在的。
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
              - CP027
          - type: callout
            title: Sonnen/Solrite VPP 是结构上最接近的对照，也是最直接的近期对手
            body: >
              Sonnen 在 2026 年 2 月推出的 SOLRITE VPP，是结构上最接近 Base 的竞争者：电池由平台持有，消费者无需预付成本，并在 ERCOT VPP
              中调度，同时保留有上限的备用电量。主要差异在规模（10,000 户家庭，而 Base 覆盖更大）、Sonnen 的公用事业属性（Shell 的资产负债表，而 Base 依赖 VC 资本）以及容量（60 kWh 对
              25 kWh）。两个项目都瞄准同一个 200 MW ADER 上限，Sonnen 明确锁定其中 144 MW。这是 Base 扩张 ERCOT ADER 时最直接的竞争约束。
