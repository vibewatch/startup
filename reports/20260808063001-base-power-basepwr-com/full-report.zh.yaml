      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              之前报告使用的情景框架，换成 $13 billion 进入价格后变得更苛刻。即使 Base 在 2027 年收入达到 $250 million，并获得 20–25x 的溢价远期倍数，先前乐观情景对应的
              $5–6.25 billion 退出估值仍远低于当前标记。实际看，最新一轮似乎在定价一个比旧乐观情景设想更大的未来业务。


              更宽容的读法是，Series D 反映了私有市场愿意为美国分布式电力基础设施的长期期权注资。若如此，投资者买的是这样一种结果：Base 不只放大 Texas 和
              Illinois，还能继续复利到更多州，证明制造成本曲线，并把运营密度转化为竞争对手难以复制的网络或成本优势。


              这种结果可能发生。但公开记录仍留下太多未解变量——收入质量、队列耐久性、州别单位经济、股权结构表条款——让当前价格在风险调整后很难显得传统意义上有吸引力。
