      - number: '4.4'
        title: 财务缺口与承销阻碍
        blocks:
          - type: paragraph
            body: >-
              公开证据最强的部分，仍是价格样例、融资事件、部署速度和基本商业模式机制。最弱的部分，则是把快速增长的硬件 fleet
              转化为可靠回报模型所需的一切：每块已部署电池的已实现收入、对冲后的混合零售毛利、按州拆分的贡献毛利、电池衰减准备、服务人工成本，以及公用事业合约与住宅客户经济性之间的相互作用。


              2026 年 8 月 Series D 放大了这些尽调缺口，因为估值提升快过披露质量。公开观察者现在能看到 30,000+ 户家庭、500+ MWh fleet 和 13 billion dollar
              投后估值的说法，但仍无法独立测试 Illinois 边际客户、Texas 边际客户，以及由公用事业托管的边际电池是否产生可比回报。


              换句话说：Base 已经不缺需求证据。它缺的是足够的财务质量证据。任何承销本轮融资的投资者，都需要在 data room 中看到队列经济、逐州变现、工厂产能与良率、质保假设，以及超过 $2.5 billion
              已投入资本背后的资本结构。
