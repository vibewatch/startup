  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现栈
        blocks:
          - type: paragraph
            body: >-
              Base Power 现在至少靠五层互相叠加的收入来变现住宅储能。在 Texas
              放开的电力市场中，第一层是公司自有硬件绑定的安装费和月度会员费。第二层是直接供电给家庭带来的零售电力毛利。第三层是在电价昂贵或电网可靠性吃紧时调度聚合电池 fleet，赚取批发 / 电网服务价值。第四层是
              Austin Energy、El Paso Electric、CoServ 等项目的公用事业容量合约。第五层已在 Illinois 显现：面向零售供电商，用电池降低其客户组合中的容量费和输电费。


              财务上最关键的一点是，「Base 收入」已经不再等同于单一 ERCOT 套利。Texas 仍像是核心盈利引擎，但 Illinois
              给出另一条变现路径：降低电网费用，重要性可以不亚于在稀缺事件中向电网反售电力。长期看，这会分散收入逻辑；但投资者需要逐市场的贡献数据，而不是一套混合叙事。


              公开价格仍然碎片化。TechCrunch 报道的 Houston 地区代表性套餐包括 $695 安装费、$19/月，以及约 13.1 cents/kWh 的电价。Citizens Utility Board
              记录了 2026 年夏季 Illinois 报价：前 2,000 名客户的入门安装费为 $95（之后为 $295），初始两年期内，分时电价方案保证比 ComEd 的 price to compare 至少低
              25%。这些报价明显优先拉新，而不是追求短期硬件回本。
