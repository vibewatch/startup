      - number: '2.3'
        title: 买方与细分市场图谱
        blocks:
          - type: paragraph
            body: >-
              Base Power 的市场存在三种不同的买方—用户—付款方关系，每一种都有不同的采用触发因素和预算归属。

              第一个、也是核心细分，是放松管制 ERCOT 市场中的德州住宅房主。该客户同时是用户（获得停电保护和账单平滑）和付款方（在 PowerToChoose.org
              上选择不同零售电力供应商）。关键采用触发因素是停电焦虑——Winter Storm Uri（2021）和反复出现的夏季高峰加剧了这种焦虑——再叠加电费波动。2026 年初，德州住宅平均账单达到 $174/月，电价
              15.41 cents/kWh，同比上涨 6.4%。在这一细分中，Base Power 的 $19–$29/月订阅加一次性安装费（$695–$995），被包装成同时对冲停电和夏季高账单的保险产品。

              第二个细分是与 Base Power 合作部署公用事业控制户用 BESS
              的电力公用事业或合作社。这里付款方是公用事业（容量递延价值），用户是房主（备用电力），买方决策者是负责资源规划的公用事业高管。采用由负荷增长、基础设施约束和 ERCOT
              夏季可靠性要求触发。CoServ（330,000+ 个电表，德州北部）和 El Paso Electric（465,000 名客户）代表这一细分；El Paso Electric 10 MW 试点和 CoServ
              100 MW 项目是目前两个最大的在运案例。该细分的预算归属是公用事业资本规划团队，经济逻辑是用容量递延替代新建发电或输电投资。

              第三个、仍处早期的细分由 Lennar
              等住宅建筑商构成，它们希望把具备电网韧性的住宅作为新房差异化卖点。在这里，建筑商是分销渠道伙伴，房主是最终用户和长期付款方，采用触发因素是新房销售市场中的竞争差异化。该渠道降低 Base Power
              的获客成本，并延展其地理触达。
