      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: ERCOT 辅助服务收入崩塌重塑 VPP 经济性
            body: >-
              ERCOT 电网级电池收入从 $149/kW（2023）下降约 90%，至 2025 年预计约 $17/kW（Enverus）。同期，辅助服务占 BESS 收入的比重从 84% 降至 48%。虽然住宅 VPP
              独立于批发电价，还能从客户账单平滑中受益，但在当前 ERCOT 环境下，Base Power 的电网服务收入上行空间已被明显压缩。稀缺事件仍高度不稳定；2026 年夏季高峰将是收入模式的关键检验。
            calloutType: insight
            claimRefs:
              - CM027
              - CM028
          - type: callout
            title: 相互矛盾的市场规模估算显示高度不确定
            body: >-
              分析报告对美国户用储能 TAM 的估算相差两个数量级——从 $174M（P&S Intelligence，2025，仅硬件）到 $3.5B（Emergen Research，2024，宽口径）——取决于是否统计
              VPP 电网服务收入、订阅变现和公用事业容量合同。投资人不应套用单一「大市场」估算；对 Base Power 当前模式更相关的可服务市场，接近 ERCOT SOM（1% 渗透率下 $42–$84M/yr），而不是
              $3.5B 的美国大标题。
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM031
          - type: callout
            title: IRA 30% ITC 提供持续到 2032 年的顺风
            body: >-
              Inflation Reduction Act 的 30% 户用电池投资税收抵免适用于 2023 年至至少 2032 年安装的独立电池系统（≥3
              kWh），无论是否搭配太阳能。该政策显著降低住宅电池部署的实际硬件成本，并支撑 Base Power 所安装系统的经济性。美国本土制造（Base Power 计划中的 Austin 工厂）还可能获得额外 IRA
              制造抵免，进一步改善利润率。
            calloutType: strength
            claimRefs:
              - CM023
              - CM024
          - type: callout
            title: ERCOT 2026 年夏季稀缺事件是重大收入变量
            body: >-
              Base Power 的订阅模式部分依赖 ERCOT 批发市场电网服务收入，以补贴低客户价格。历史上，极端夏季高温事件（2023：峰值电价 $5,000/MWh）在短短几天内贡献了超额 BESS 收入。如果
              2026 年夏季温和，电网服务收入将很低，模型的独立订阅经济性会被检验。这是一个开放尽调问题，需要等 2026 年夏季复盘后回答。
