  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Base Power 最强的论据，仍在运营侧，而且少见地有吸引力。公司不到三年就从 Texas 初创公司走成多州平台，现在公开声称为 30,000+ 户家庭供电，报告运营 fleet 超过 500 MWh，并在
              Austin 制造自有下一代电池。2026 年 8 月 Series D 的投资人阵容也异常强，组合了 fintech、成长股权和战略资本支持方。


              问题不在于公司缺少野心或动量证明。问题是价格。以 $13 billion
              投后估值计，本轮要求投资者承销的不只是进一步获客，还包括全国品类领导地位、制造端持续降本、持久客户留存，以及跨多套监管制度的更优经济性。当前公开证据不足以验证这些假设。


              这形成了异常不对称的估值格局：部署、地理扩张和产品发布上的好消息是真实的，但很大一部分似乎已经计入最新估值。因此，Series D 之后，公开反向逻辑更强，而不是更弱。
