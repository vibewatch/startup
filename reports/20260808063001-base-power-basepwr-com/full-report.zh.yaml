  - id: TV005
    title: 投资逻辑破裂与否决触发因素
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ERCOT 电网服务收入坍塌
        - 到 2026 Q4 收入低于 $20/kW/year
        - 单位回本超过电池可用寿命（~10 年）；堆叠收入模型破裂；2026 年预测无法实现
        - 退出或减仓；视为悲观情景确认
      - - Gen 3 制造成本超支
        - 到 2026 年底单台净电池成本仍高于 $10,000
        - 显示工厂执行失败；资本强度随全国规模倍增；已部署 $1.3B 可能不足
        - 暂停共同投资；任何跟投前要求制造审计
      - - 全国扩张停滞
        - 到 2026 Q4 无 ERCOT 之外确认商业部署
        - 乐观情景收入增长需要多州扩张；按当前安装率，仅 ERCOT 会把 2027 年收入限制在 $50M 以下
        - 将建议从观察名单下调为放弃
      - - 流失加速
        - 任一 12 个月队列客户流失超过 5%
        - 收入耐久性受质疑；零售电力合约执行风险；竞争替代侵蚀模型
        - 深入客户层面尽调；可能显示结构性产品-市场匹配限制
      - - 下轮降估值或压力融资
        - 任何低于 Series D 标记的重大一级融资，或带异常限制性结构的融资
        - 将显示运营进展未能在当前估值下转化为持久资本市场信心
        - 立即重新承销；优先股堆叠和普通股结果可能实质恶化
      - - ERCOT ADER 或 VPP 补偿监管逆转
        - PUCT 修改规则，降低 ADER 项目参与或补偿费率
        - 直接影响主要电网服务收入层；影响所有客户的 ERCOT 经济模型
        - 必须重跑情景分析；折现率需加入监管风险溢价
    notes: 阈值基于判断，来自 GreenCarFuture 单位经济分析、Modo Energy ERCOT 收入预测和可比资本强度研究。监测需要持续访问 ERCOT 市场数据和公司财务。
    claimRefs:
