  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Base Power
              的市场边界分为两层同心圈。外层是美国户用储能市场，涵盖硬件（磷酸铁锂电池系统、逆变器、控制器）、软件驱动的电网服务，以及与家用电池基础设施绑定的零售电力计划。纳入的支出包括：已安装电池系统（资本开支或订阅）、持续维护和软件订阅，以及与房主分成或由聚合商留存的电网服务收入。不属于
              Base Power 直接可服务市场的是公用事业级 BESS（单站点超过 1 MW 的电网级项目）、没有住宅托管的工商业储能系统，以及没有储能的纯屋顶太阳能安装。

              内层、也就是立即可切入的市场，是 ERCOT 户用 VPP 市场——具体指在 Aggregate Distributed Energy Resource（ADER）试点和后续规则下，将低于 1 MW
              的家用电池聚合后调度进 ERCOT 批发电力和辅助服务市场。德州是主要运营地域；随着 Base Power 走出德州，更广义的美国放松管制住宅市场（CAISO、NYISO、PJM 等）构成扩张可服务市场。

              Base Power
              方案的现状替代品包括：（a）没有储能的传统零售电力计划，客户自行承受停电风险和夏季账单波动；（b）独立屋顶太阳能净计量安排，房主获得账单抵扣，但没有备用电力或电网服务参与；（c）独立备用发电机（丙烷 /
              天然气），可提供停电保护，但没有电网收入且需要燃料；（d）Tesla Powerwall 搭配 Tesla Electric、Sunrun VPP，以及新兴 ERCOT ADER
              合格聚合商提供的竞品电池项目。住宅客户的主要切换成本在于安装流程和多年电池生命周期承诺——电池一旦安装并纳入 VPP 项目，切换聚合商就涉及硬件物流和重新入网步骤。
