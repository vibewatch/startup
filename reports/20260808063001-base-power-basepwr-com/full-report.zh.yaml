      - - 全国扩张
        - Illinois 已上线，证明 Base 能在 ERCOT 之外适配
        - Illinois 也显示模型按州变化，未必能以统一经济性复制
        - 部分确认；适应性已证明，可重复性未证明
      - - 退出路径
        - 能源基础设施 IPO 窗口打开；X-energy、Fervo 带来气候科技动量
        - K 型 IPO 市场偏好核能 / 地热，而非重硬件 DER；当前倍数留给上行空间有限
        - 部分确认（TechCrunch 气候科技 IPO 分析，2026）
