      - number: '3.3'
        title: 能力与价格对比
        blocks:
          - type: paragraph
            body: >
              Base Power 相比硬件 OEM 阵营的竞争定位，建立在三个结构性优势上：资产所有权（Base 承担资本开支，而不是消费者）、电池超配（25 kWh，高于 Tesla 的 13.5 kWh 或
              Enphase 的 5 kWh 模块单元）以及与公用事业合作的直接集成。


              **价格差：**Base 收取 $695（单电池）或 $995（双电池）安装费，外加 $19/月（双电池 $29）持续费用。GVEC 会员支付更低——$295 或 $445——且 Base
              完全免收月会员费。竞品硬件购买模式需要前期支付 $7,500–$13,500 购买 Tesla Powerwall 3、$6,500–$8,500 购买 FranklinWH aPower 2，或
              $8,000–$11,000 购买 Sonnen 零售路径。即便扣除 Oncor $4,500 补贴（仅 Oncor 服务区可用），硬件购买型竞争者仍要求消费者投入比 Base 入门价高 5–10×。联邦户用
              ITC 25D 税收抵免在 2025 年底到期，使 2026 年这道差距进一步扩大。


              **容量与电网价值：**Base 的 25 kWh / 11.4 kW 电池提供的储能约为 Tesla Powerwall 3（13.5 kWh）的两倍，是 Enphase IQ Battery 5P
              模块的五倍。更大的电池容量带来单机更多能源套利、ERCOT 每个节点更多收入和更长备电时长。Base 双电池安装（50 kWh）可为普通 GVEC 客户提供最长约 12 小时备电，而单台 Powerwall 3
              约为 3–4 小时。


              **公用事业集成 vs. 消费者控制模式：**Base 模式默认预留 80% 电池容量供公用事业调度，20% 留给房主备电。竞品硬件购买模式把控制权完全交给房主，公用事业会认为这种电网资产可靠性较弱。GVEC
              明确指出，表后资产（Base 模式）提供的输电成本降低收益，是注册为发电机的公用事业级电池无法提供的。Sonnen/Solrite 也提供与 Base 类似的 10–20% 备电保留，反映了同一权衡。Tesla
              的 VPP 允许房主在停电期间退出，降低了电网运营商的调度可靠性。


              **软件与控制栈：**Base 声称其自有自营电池组具备亚秒级遥测和三个九可用性。依赖房主覆盖控制的竞争者（智能恒温器、Sunrun 的客户控制系统）会面临 Base CEO Zach Dell
              在投资人评论中明确提到的「DR 1.0」可靠性质疑：「我们的资产由我们持有，由我们控制。我们有三个九可用性。」AutoGrid 和 Fluence
              可向公用事业提供相当的软件复杂度，但它们本身不持有硬件资产，因此在房主入网层存在执行风险。
            claimRefs:
