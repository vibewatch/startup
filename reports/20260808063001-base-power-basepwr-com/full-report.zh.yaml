      - number: '1.5'
        title: 不利因素与关键风险
        blocks:
          - type: paragraph
            body: >-
              独立来源和消费者导向来源持续指出三类反复出现的风险。第一，Base 的客户合同模式仍允许公司在停电发生前调用户存储电量获取电网或公用事业价值，因此停电那一刻的备电可用性并不保证。Citizens Utility
              Board 2026 年 7 月对伊利诺伊州方案的解释明确提醒消费者，电池未必总有足够电量支撑更长停电，且合同结构会削弱长期切换灵活性。


              第二，估值风险上升速度快于披露质量。Series D 将 Base 的投后估值推至 $13B，距离 $4B Series C
              不到一年，但关于收入、毛利率、烧钱速度和已实现单位经济性的公开证据仍不完整。这让执行观感与可承销基本面之间的缺口继续扩大。


              第三，地理扩张现在带来的是模式风险，而不只是野心风险。伊利诺伊州提供了 Base 能够适配 ERCOT
              之外市场的实时证明，但也显示商业模式会在不同州之间发生实质变化。一家公司在某个市场像德州发电售电一体公司，在另一个市场可能变成零售容量优化方或公用事业容量供应商。适配能力是战略上行空间，但也削弱了「德州模式可干净复制到全国」这种简单说法。
