      - number: '5.4'
        title: 信任、安全、合规与可靠性
        blocks:
          - type: paragraph
            body: >-
              Base Core 的公开技术披露比早期 Gen 1 平台更薄，但若干安全和可靠性事实可以支撑。Solar Power World 报道，当前 39.2 kWh 住宅电池获得 UL 1973 和 UL 9540
              认证。与公司相关的发布报道称，系统安装不到一小时，面向严苛户外环境设计，并集成发电机接口以应对更长停电。


              更大的尽调问题，不是 Base 是否理解住宅电池合规基础，而是当前公开证据是否足够验证公司现称规模下的可靠性。当 fleet 超过 500
              MWh、覆盖数万户家庭后，关键问题变成现场故障率、质保准备、网络加固、fleet 更新纪律，以及不同公用事业、州和安装方之间存在多少性能差异。


              Base 仍运营一支接入互联网、位于客户家中且可调度的电池 fleet，这带来实质性的网络和产品责任暴露。本轮未发现针对 Base 的执法行动、召回或公开记录安全事故，但可靠性审计方面的公开证据仍远弱于增长营销。
