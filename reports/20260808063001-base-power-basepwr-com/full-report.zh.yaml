      - number: '7.4'
        title: 附录图表
        blocks:
          - type: callout
            title: ERCOT 收入压缩是近期商业模式威胁
            body: >-
              2023 至 2025 年间，ERCOT 内 BESS 辅助服务收入下降 90%，多数运营商盈利能力低于 2.2%。Base Power 低于市场价的客户定价，依赖持续的电网交易收入。如果 RTC+B
              和市场饱和继续压缩毛利，靠电池套利补贴客户电价的经济性会显著走弱。未来 12–18 个月 RTC+B 下的运营数据，对验证模型至关重要。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
          - type: callout
            title: 对 ADER 试点的依赖是集中度最高的单一监管风险
            body: >-
              Base Power 参与批发市场，取决于 ERCOT ADER 试点项目；这是 PUCT 授权的试点，没有永久法定地位。PUCT 或 ERCOT 可以修改参与规则、冻结容量或终止试点。50% QSE
              集中度上限意味着，随着 Base Power 的 fleet 增长，它将在 100 MW ADER 容量（200 MW 总量的 50%）触顶。ADER
              解散或永久冻结容量，会拿掉公司最主要的差异化收入机制，是这个风险 universe 中最大的单一否决标准风险。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR040
          - type: callout
            title: 电池调度中的客户利益冲突带来诉讼与监管暴露
            body: >-
              Base Power 可合法地为电网交易把客户电池放电至 20% SOC。社区论坛记录了客户在停电时备用电力未完全可用后的惊讶和不满。如果严重天气事件（可比 Winter Storm Uri）期间，Base
              Power 客户没有获得预期备用电力，而电池此前已为电网收入被调度，声誉损害可能很严重，并可能引发 PUCT 投诉或集体诉讼。这是最清晰的负面客户影响情景，应成为优先尽调重点。
            calloutType: risk
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
          - type: callout
            title: 投资前关键尽调优先事项
            body: >-
              (1) 确认 PUCT Project 53911 ADER 注册及任何容量利用数据。(2) 获取 ERCOT SOC 合规记录，以及任何不合规事件或待决处罚。(3) 审查 Base Power 的 PUCT
              REP docket，查看投诉历史和财务文件。(4) 要求提供 fleet 管理平台的网络安全审计结果（SOC 2 或同等）。(5) 获取 Factory One
              生产数据——产能、良率、出货台数——验证供应链独立逻辑。(6) 审查客户合约中的备用可用性披露语言，以及 PUCT 投诉数据库中的 Base Power 相关文件。
            calloutType: recommendation
            claimRefs:
