      - number: '6.4'
        title: 留存、耐久性与合约条款
        blocks:
          - type: paragraph
            body: >-
              合约耐久性仍是 Base Power 最重要的客户质量信号之一，但条款现在按市场而异，不再统一。Texas 早期产品文件描述的是长期电池服务关系叠加多年电力合约。Illinois 方面，Citizens
              Utility Board 记录了两年初始供电期，搭配 12 年电池托管承诺和 $500 提前终止费。


              这些条款带来真实留存支撑，也带来真实客户摩擦风险。长期协议降低流失，使硬件补贴更容易解释；但也让客户更在意感知到的表现不佳、电价失望，或意识到电池备用并非每一刻都完全保证。CUB
              明确警告，电池在更长停电中未必总有足够电量；屋顶光伏家庭可能比采用 ComEd 标准结构更吃亏。


              实际留存的公开证据仍有限。Sacra 早先近零流失的轶事仍具方向性正面意义，但产生于规模小得多、Illinois 扩张之前。因此，留存证明质量落后于表层客户数证明质量。
