      - number: '8.6'
        title: 附录图表
        blocks:
          - type: callout
            title: ERCOT 收入饱和威胁当前倍数的生存基础
            body: >
              本章最重要的单一负面信号，不是 Base Power 的执行——其执行确实令人印象深刻——而是 ERCOT 电网服务收入的结构性坍塌。平均年度 BESS 收入从 2023 年 $149/kW 降至 2025 年
              $29/kW（Modo Energy），下降 80%，驱动因素是装机容量增加 70×。在 $29/kW 水平下，一块 25 kWh Base Power 电池每年电网服务收入约
              $73——远低于不用长回本周期支撑盈利单位经济所需的零售毛利和租赁费。除非 RTC+B 改革实质性提高每 kW 补偿，或 Base 取得真正零售毛利主导地位，否则核心收入多元化逻辑目前承压严重。任何以 $13B
              进入价格投资的投资者，都必须在风险解除前，对电网服务收入如何回升到 $50/kW 以上有具体且有证据支撑的判断。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV031
              - CV033
              - CV037
              - CV038
          - type: callout
            title: $13B 价格是平台期权溢价，不是收入倍数
            body: >
              在任何合理可比折现率下，都无法用传统收入倍数解释 Base Power 的 $13B
              估值。更准确的理解是，市场隐含地给公司成为美国放开电力市场主导住宅电池和电力平台的期权定价——类似于在基础设施网络达到规模前先定价。这并非天然不理性：Sunrun
              在太阳能资产所有权扩张前也曾类似定价。但投资者必须显式给期权定价，给全国规模化结果分配现实概率，并接受在当前证据质量下，基准情景按当前 Series D 进入价格是亏损的。四轮均领投或共同领投的五家顶级
              VC，并没有看错潜力；但他们可能已经把这份潜力定满了。
            calloutType: insight
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV016
              - CV020
              - CV021
          - type: callout
            title: 任何资本承诺前的尽调门槛
            body: >
              若没有以下条件，不应承诺超过 $5M 资本：（1）data room 访问权，确认截至 2026 Q3 的 2026 年收入轨迹达到或超过 $50M；（2）四轮融资的完整股权结构表和优先股堆叠文件；（3）独立
              Gen 3 制造评估。进入价格在 $2.5B 或以下，是基准情景能产生正预期回报的唯一水平。若缺少上述三项数据且进入价格高于 $3B，就是投机。
            calloutType: recommendation
