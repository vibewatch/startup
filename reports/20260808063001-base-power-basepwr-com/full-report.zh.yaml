      - number: '8.2'
        title: 估值背景与融资结构
        blocks:
          - type: paragraph
            body: >-
              Base Power 的融资时间线，现在已是气候和分布式能源创投中最快的后期重定价案例之一。本报告可见的公开轮次历史包括：2025 年 4 月 $200 million Series B、2025 年 10 月
              $1 billion Series C，以及 2026-08-03 宣布的 $1 billion Series D。最新一轮披露的投后估值为 $13 billion。


              与公司相关的发布报道称，累计融资现在超过 $2.5 billion。这意味着公司既有显著资产负债表支撑，也有比 Series C
              阶段可见规模大得多的优先股堆叠。没有股权结构表、清算优先权、参与权和任何项目层融资细节，外部投资者仍无法建模当前 headline 估值背后的真实经济分配瀑布。


              最重要的背景变化是，公司不再按一个异常有前景的 Texas 运营商来定价。它被按潜在全国基础设施平台定价。因此，进入纪律必须从「$4 billion 是否太贵？」转向「什么证据能让 $13 billion
              站得住？」当前公开证据还没有越过这条线。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV017
