      - number: '5.5'
        title: 技术差异化与产品风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 的核心差异化，仍是把硬件、软件、部署运营和能源市场参与放在同一家公司里。2026 年 8 月发布进一步强化了这个判断，因为 Core
              看起来不是实验室内的单纯再设计，而是吸收了真实现场经验的产品：管理层明确把新电池配置与前 500 MWh 部署学到的经验相连。


              最大的产品风险仍是房主备用预期与电网变现之间的张力。Base 能提供低成本准入，只因公司保留电池所有权和调度权。审查 Illinois 合约结构的消费者倡导者警告，长时间停电期间备用电力并不保证完全可用；独立
              Texas 评测者也对上一代产品提出过同样观点。


              第二个产品风险是，多州扩张证明商业包装具备市场特异性。Illinois 可能验证 Base 的适应能力，但也说明 Texas ERCOT 经济性并不等于 PJM/ComEd
              经济性。即使电池硬件本身快速改进，这也削弱了任何简单的一 SKU / 一模型复制逻辑。
            claimRefs:
              - CE031
              - CE032
