      - number: '7.2'
        title: 财务、资本与收入风险
        blocks:
          - type: paragraph
            body: >-
              ERCOT 电池经济性仍承受市场饱和带来的结构性压力；这一点仍重要，因为 Texas 是 Base Power 商业模式证据最密集的市场。不过，自 2026 年 8 月以来，融资风险的形态已经变化。新的
              Series D 大幅降低近期流动性风险，同时提高预期风险：一家融资超过 $2.5 billion 后估值 $13 billion 的公司，现在不仅要证明增长，还要证明高质量增长。


              换句话说，资本市场问题已经不再是「Base 能不能融到钱？」而是「Base 能否用脱离一小组有利假设后仍站得住的经济性，证明最新价格合理？」如果收入、毛利或现金消耗证据远远落后于规模故事，即便 Series D
              成功，下一次融资仍可能困难。


              当前 Illinois 文件也让消费者风险面更清晰。长期合约、切换摩擦和不保证的停电覆盖，本身并不致命；但当公司规模远大于 Series C 阶段、系统可见性更高时，它们会提高客户保护审查落地的概率。
