  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与市场规则风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 位于三套监管制度的交叉点——ERCOT 市场规则、PUCT 零售电力供应商（REP）认证，以及 ADER 试点项目。任何一套制度都可单方面实质改变公司的经济性或运营权限。

              ERCOT NPRR 1186 于 2024 年 4 月 11 日获批（2024 年 6 月 27 日生效），要求提供辅助服务的 Energy Storage Resources 维持足够 state of
              charge，以履行完整一小时义务期。未能维持所需 SOC 的电池运营商，可能面临每五分钟间隔最高 $25,000 的执法处罚；批评者称这一处罚机制具有歧视性，因为热电机组只有在实际交付失败时才受罚。PUCT
              最初在 2024 年 1 月把 NPRR 1186 发回重审，理由是担心规则的执法条款会惩罚即便已完全遵守调度义务的电池，从而抑制储能投资；委员会在 2024 年 4 月批准了软化版本。Eolian
              等行业参与方警告，NPRR 1186 将「substantially reduce energy storage participation in the ancillary markets and reduce
              competition」。随后 2025 年 12 月上线的 RTC+B（Real-Time Co-optimization plus
              Batteries）用协同优化调度取代这一过渡框架，但也引入更高算法复杂度要求，并压缩依赖市场设计缝隙的结构性 alpha 收入。

              Base Power 通过 ADER（Aggregated Distributed Energy Resource）试点汇聚住宅电池参与批发市场；该试点仍由 PUCT Project No. 53911
              管辖。截至 2025 年 10 月，ERCOT 将全系统 ADER 总容量上限从 160 MW 提高到 200 MW，并将 QSE 集中度限制从 20% 提高到 50%。但由于 ADER 仍是试点，ERCOT 和
              PUCT 保留在相对短时间内修改参与规则、容量上限或终止试点的权力——这项风险直接威胁 Base Power 的主要收入生成机制。据报道 Base Power 参与 ADER 试点，但尚未从 PUCT
              Project No. 53911 文件中识别出公开可得确认。

              作为持牌 Texas REP，Base Power 必须在 3 月 5 日前提交年度报告、在 8 月 15 日前提交半年度报告，维持信用证（少于 50,000 个 ESI IDs 为 $750,000；超过则为
              $1.5 million），并在 15 天内回应提交至 PUCT 的客户投诉。若违反 Public Utility Regulatory Act 或委员会规则，PUCT 有权暂停或撤销 REP 牌照。Uri
              之后的立法改革（SB 6、SB 7、SB 1287 及相关法案）也让 PUCT 监督姿态更主动，ERCOT Protocol Revisions 现在需要 PUCT 批准。

              互联成本风险也在上升：PUCT 修订后的规则 16 TAC §25.195（2026 年 1 月 1 日生效）将超过 $14 million（≤138 kV）或 $20 million（高于 138
              kV）的互联成本直接分配给接入的发电资源；随着 Base Power 扩大工厂直连硬件 fleet，这会形成成本暴露。NERC 的 Texas RE 已把逆变器型资源合规（包括电池）列为 2026
              年优先审计领域，增加合规成本和文档负担。
