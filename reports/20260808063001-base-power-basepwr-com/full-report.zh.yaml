      - number: '5.3'
        title: 控制架构、软件栈与 VPP 调度
        blocks:
          - type: paragraph
            body: >
              Base Power 构建了一套自研端到端软件与控制系统 BaseOS。系统覆盖固件（管理电芯级 BMS、传感器、电力电子和 OTA 更新）、后端服务（协调 fleet
              调度、能源交易、计费和运营物流），以及公用事业合作伙伴用来管理聚合体的原生 SCADA 层。后端主要用 Golang 和 Python 编写，运行在 AWS 上，采用容器化服务（Kubernetes）和
              Terraform 管理的基础设施，并用 Temporal 编排真实世界部署和设备控制流程。固件用 C、C++ 或 Rust 编写，运行在嵌入式 Linux 或微控制器目标上。软件负责人是 Jared
              Greene，此前在 SpaceX Starlink 软件团队；工程团队很大一部分来自 Anduril、SpaceX 和 Tesla。

              现场连接采用三重冗余：（1）客户 WiFi 作为主链路，（2）4G 虚拟蜂窝芯片作为后备，（3）若公用事业已铺设光纤，则使用电表处光纤连接。这一架构让 Base 能把连接加硬件强制停运率归类为低于
              5%——这是公用事业级可靠性说法。ERCOT 调度指令以亚秒级响应执行；交付功率与指令功率偏差在 1% 以内。公用事业合作伙伴可以通过网页仪表盘控制电池聚合体，也可以通过 API 直接接入公用事业的能源管理系统。

              在 ERCOT 放开的市场中，Base 的交易算法实时监控批发价格：价格低时给电池充电（高风电 / 光伏时段常为负价），价格冲高时向电网放电。Base 获得 Texas Aggregated
              Distributed Energy Resource (ADER) 试点资格，可把其分布式 fleet 作为单一虚拟电厂投标进入 ERCOT 批发市场。截至 2025 年 10 月，Base 已用满通过
              ADER 试点可投标的 20 MW 容量，并推动提高上限。ERCOT 在 2026 年 4 月与 Base Power
              举行工作会议，处理节点调度、结算处理、计量、配电服务提供商协同等设计问题——说明该项目监管框架仍在成熟中。
