  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 全队列单位经济
        - 按当前（非峰值）市场费率，经审计的每块电池每 kW ERCOT 收入、每客户月度零售毛利，以及每已部署 MWh 混合全包成本
        - 当前公开估计（Sacra、GreenCarFuture）分歧显著；8.5 年对 3.5 年的回本区间让估值完全无法确定
        - 要求 data room 访问；与 ERCOT 结算数据和公用事业账单记录交叉核验
      - - 股权结构表和优先股堆叠
        - Series D 后完整股权结构表，包括所有 seniority、参与权、反稀释条款和任何资产层融资
        - 在 $13B headline 估值、已融资 >$2.5B 的情况下，没有这些无法评估瀑布经济
        - 法律审查加投资者 data room 访问
      - - Gen 3 制造项目
        - 已签设施租约或建设合同、设备采购时间线、目标吞吐量（MWh/year），以及到 2027 年的单台成本曲线
        - 整个乐观情景和降本逻辑都依赖此项；城市激励告吹且截至 2026 年 5 月无确认工厂，是实质性负面信号
        - 现场参观；独立制造顾问审查；TDLR 注册数据
      - - 全国扩张监管地图
        - 至少两个非 ERCOT 零售选择州的市场进入计划，包括监管要求、互联规则和公用事业合作状态
        - ERCOT 放开具有独特性；PJM、ComEd 和 NY 市场规则差异实质，可能需要不同模型或更长获客时间线
        - 目标州监管法律顾问；市场进入可行性研究
      - - 队列留存曲线
        - 按地理、安装队列和客户细分（新建 vs. 改造）拆分的客户层面流失和留存数据
        - 单一报告客户流失（2025 年 8 月）不足以做统计评估；全国扩张让队列留存成为 LTV 的主要指标
        - Data room 中 CRM 和账单数据；跨队列独立调查 50+ 名客户
      - - 竞争响应准备
        - 面对 Tesla、Sunrun、公用事业赞助电池项目和新 Illinois 式供应商时的可防守性证据
        - 在 $13B 下，即便温和价格压力或扩张放缓，也可能摧毁预期回报
        - 竞争情报和逐州客户访谈
    notes: 任何超过 $50M 的投资前，上述所有尽调要求均为必需。第 1 和第 2 项（单位经济和股权结构表）是门槛项——无论轮次估值如何，缺少它们都不应投资。
    claimRefs:
