      - number: '6.3'
        title: 渠道合作伙伴与安装商生态
        blocks:
          - type: paragraph
            body: >
              Base Power 的进入市场围绕两类渠道设计：公用事业 / 合作社合作（B2B2C）和住宅建商整合（B2B2C 新建住宅）。到 2026 年 3 月，公司已在 Texas 宣布五项公用事业合作，并在 2026
              年 5 月加入第六项（Austin Energy）。


              公用事业合作伙伴模式各不相同：CoServ 和 GVEC 保留电池调度控制权，Base 负责安装和维护；El Paso Electric 是受监管公用事业试点，房主无需预付成本即可获得电池，另有 $250
              付款；Austin Energy 采用 tolling 模型，为 40 MW 预留容量每年向 Base 支付最高 $4.08M。Bandera Electric、Farmers Electric
              等合作社伙伴中，成员支付象征性预付费（GVEC 为 $295）和较低月度订阅费。CoServ 的 100 MW 协议（2026 年 3 月）是迄今最大，目标是在 CoServ 覆盖 330,000 个电表的
              North Texas 区域内新增估计 5,000 户家庭。


              安装商侧，Charge Pro 等第三方承包商执行实体电池支架和放置，Base 持牌电工处理配电盘连接——这是一种劳动解耦策略，目标是压低单台安装成本。客户评论中具名安装商包括 Ben 及其 Charge Pro
              团队，以及 Dylan 和 Thor 团队；多位 Houston 地区客户提到过他们。
