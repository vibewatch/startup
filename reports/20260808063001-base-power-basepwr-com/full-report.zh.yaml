  - id: FV004
    title: 投资 KPI 记分卡
    type: kpi
    layout: standard
    summary: 面向 IC 的八维评分，覆盖市场机会、执行证明、竞争护城河、单位经济、监管风险、估值、资本强度和证据质量。
    data:
      items:
        - label: 市场机会
          note: 强：住宅 DER/VPP 市场年增长 21%；2025 年住宅电池报名 +153%；AI 数据中心需求顺风放大 ERCOT 电网压力
        - label: 部署执行
          note: 强：声称 30,000+ 户家庭 / 500+ MWh / Illinois 启动 / 2026 年 8 月报道每天 100 块电池
        - label: 商业模式新颖性
          note: 好：垂直整合 gentailer 具结构性差异；堆叠收入（零售毛利 + 电网服务 + 租赁）提供部分下限；零售合约创造耐久收入
        - label: 单位经济
          note: 弱–中等：Gen 1 回本随 ERCOT 收入假设在 3.5–8.5 年之间；估计冲突；电网服务收入较 2023 年峰值下降 90%；未在规模下独立验证
        - label: 竞争护城河
          note: 中等：聚合 fleet 的网络效应和数据是真实但早期的；Tesla Powerwall、Sunrun Battery 和公用事业赞助项目是可信威胁；3 年电力合约内嵌切换成本
        - label: 监管与市场风险
          note: 偏高：ERCOT 辅助服务收入结构性坍塌；RTC+B 改革是未确定上行；全国扩张需要不同监管关系；迄今无负面监管事件，但暴露高
        - label: 估值 vs. 证据
          note: 弱：$13B Series D 对应约 ~1083x 2025 年收入估计和 ~186x 早期 2026 年预测；公开可比远低，且缺少股权结构表细节
        - label: 资本强度与融资风险
          note: 高风险：融资 >$2.5B 降低近期流动性风险，但提高回报门槛和优先股资本悬挂
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV020
      - CV021
