        - 规模化制造未证明；Gen 3 工厂延迟；城市激励交易 2026 年 3 月告吹
        - 部分确认；制造风险未解决
      - - 电网服务收入
        - ERCOT ADER 项目提供批发收入；与零售毛利和租赁费叠加
        - ERCOT 电池收入从 2023 年（$193/kW）到 2025 年（$29/kW）下降 90%；结构性饱和可能持续
        - 反向（Enverus、Modo Energy）
      - - 客户经济性
        - 近零流失；有利条件下 3.5 年回本；低于市场的电价
        - 按当前电网服务费率，Gen 1 回本拉长到 8.5 年；盈利模型依赖费率环境
        - 冲突（Sacra 对 GreenCarFuture）
