      - number: '1.4'
        title: 里程碑、牵引力与规模
        blocks:
          - type: paragraph
            body: >-
              Base Power 的第一阶段牵引力集中在德州：2023 年成立，同年稍晚完成首批部署，2024 年推进早期合作社和住宅建筑商合作，2025 年串起 Series B / Series C /
              工厂建设。2026 年可见的第二阶段，是规模放大和模式外延。Base 持续增加德州公用事业合作关系，推出 Austin Energy 和 El Paso Electric 项目，并进入伊利诺伊州，让故事不再只围绕
              ERCOT。


              2026 年 8 月 Series D 发布材料给出了目前最强的规模标记。TechCrunch 报道称，Base 已安装超过 500 MWh 储能，并以每天约 100 块电池的速度部署，折合每天新增约 8 MWh
              储能，目标是在年底前将节奏翻倍。公司关联的行业报道也称，运营电池组超过 500 MWh，公用事业合作代表超过 200 MW 容量，Austin 的 Base Factory 1 每月生产数千套系统。


              同一轮发布还将 Base Core 正式确认为公司新的旗舰电池，并确认公司正在服务德州和伊利诺伊州。官网称 Base 为 30,000+ 户家庭供电，说明 2026
              年客户采用显著提速。公开收入、利润率和队列留存披露仍落后于运营里程碑，因此规模故事的证据明显强于变现故事。
