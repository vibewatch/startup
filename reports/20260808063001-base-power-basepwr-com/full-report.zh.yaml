      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              当前最强采用信号来自公司主页本身：本轮抓取到的 live site 称，超过 30,000 户家庭由 Base 供电。这是营销说法，不是经审计客户数，但相较 2026 年早些时候可见的 10,000+
              里程碑，是一次阶跃。2026 年 8 月发布报道还称，运营 fleet 超过 500 MWh，Base 每天约安装 100 块电池。


              公开具名客户证据仍由 Texas 证言主导。Base 自有评论页面仍提供最清晰的具体结果：房主描述电费显著降低、停电无缝穿越，以及替代发电机。这些证言有方向性价值，但仍是自选择样本，不能替代第三方队列分析、NPS
              衡量或独立验证的停电时长数据。


              Illinois 客户证据还处在更早阶段。Citizens Utility Board 在 2026 年 7 月指出，该报价刚刚进入市场，尚未从足够多消费者处听到反馈来评估实际表现。这意味着 Base
              现在对第二个州的获客触达有更强证据，但对客户耐久性的证据较弱。
