      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Base Power 站在住宅光伏 + 储能、VPP/DER 软件和能源零售商的全新交叉点上，因此很难选择干净可比公司。最相关的公开可比是 Sunrun (RUN)、Fluence Energy (FLNC) 和
              Stem (STEM)。Sunrun 是美国最大的住宅光伏加储能公司，市值约 $3.5B，企业价值 $17.7B，收入 $2.96B（LTM），EV/revenue 约 5.6×。Fluence Energy
              是公用事业级电池软件与服务平台，FY2025 收入 $2.3B，并指引 FY2026 达到 $3.4B；其交易倍数约为未来收入 1.5–2.5×。Stem (STEM) 是最具警示意义的可比：2025 年收入
              $156M、股东权益为负，Macroaxis 估计截至 2026 年中破产概率 >80%。Stem 的轨迹说明，没有粘性经常性收入模型时，资本强度会带来什么后果——Base Power
              的零售电力订阅部分缓解但没有消除这一风险。

              私有可比中，Uplight（整合 AutoGrid 的 DER 软件平台）上次估值约为 2021 年 $1.5B；在一次据称寻求约 $1B 的出售流程后，现在由 Octopus Energy
              持有多数股权——这暗示 2021 至 2026 年间，纯 DER 软件估值被压缩。Renew Home（OhmConnect + Google Nest 合并）控制约 ~3 GW 住宅 VPP 容量，并获
              Sidewalk Infrastructure Partners 支持，但未披露合并后估值。私有市场可比给出的隐含结论是，没有嵌入硬件资产的 VPP 软件公司估值远低于 $1B；Base Power
              的硬件主导模型相对软件同行有溢价理由，但也必须承受重资本业务内生的倍数压缩风险。

              Base Power 隐含 2025 年收入倍数（333×）在任何阶段的可比能源公司中都没有先例；即便是早期纯软件 SaaS 公司，也很少能在短暂 hype 窗口之外维持 50–100× 以上倍数。2026
              年远期收入倍数（57×）对超高增长平台更可辩护，但仍意味着 Base Power 退出时的交易倍数将达到公开可比组中位数的
              5–10×。最合适的理解，是把估值看作平台期权溢价：投资者定价的不是当前收入，而是美国放开电力市场中赢家占大头的住宅电池网络。只有当网络效应（客户数据、优化算法、规模化低成本制造）能真正抵御 Tesla
              Energy、Sunrun Battery 和潜在公用事业赞助项目等资本充足进入者时，这一溢价才合理。
            claimRefs:
