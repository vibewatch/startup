      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              相比 2026 年早些时候，Base Power 的地理集中度已经下降，但仍远谈不上多元化。Texas 仍是核心运营州、经济性整合最完整的市场，也是几乎全部公开客户证言密度的来源。Illinois 降低了「只押
              ERCOT」的二元叙事，但尚未证明多州收入已经均衡。


              Illinois 启动还带来新的集中度细节：Base 可以走出 Texas，但每个新州可能需要不同商业设计、监管接口和客户承诺。这意味着客户数增长并不自动等于运营可复制性干净利落。一个 30,000+
              户家庭平台，仍可能高度依赖少数经济和监管打法。


              公用事业合作伙伴集中度也仍相关。CoServ、Austin Energy、El Paso Electric 和其他 Texas 伙伴给 Base
              带来规模和可信度，但也带来对公用事业预算周期、项目特定表现要求，以及 Base 直接零售漏斗之外部署节奏的暴露。客户基础比过去更宽，但仍不够宽，无法消除机构依赖风险。
