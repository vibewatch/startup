      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >-
              Base Power 的融资史目前有四个清晰拐点：2023–2024 年的早期种子 / A 轮融资，2025 年 4 月的 $200M Series B，2025 年 10 月的 $1B Series C，以及
              2026 年 8 月第二笔 $1B 巨额融资。最新一轮于 2026-08-03 宣布，为 Series D，投后估值 $13B。


              Series D 由 Ribbit Capital、Addition、Valor Equity Partners 和 JPMorganChase 的 Strategic Investment Group
              领投。披露的参投方还包括 Altimeter、D1 Capital Partners、Sands Capital、Coatue、Layer Global 和 Energy Impact
              Partners；Thrive Capital、Andreessen Horowitz、Lightspeed、Trust Ventures、CapitalG
              等主要老股东也继续加注。投资人名单横跨金融科技、成长股权、互联网和基础设施导向资本，说明 Base 正被按平台级能源公司承销，而不是小众硬件供应商。


              与 Series D 同步发布的公司和行业媒体材料称，Base 自创立以来累计融资已超过
              $2.5B。公开列明的轮次并未完整披露所有早期分笔和工具，因此终身融资总额仍应视为公司口径，而非可独立重构的数字。清楚的是，公司现在已拥有可观资本，可投入电池制造、部署人工、软件、营运资金和进一步地理扩张。
