      - number: '5.2'
        title: 安装流程与部署运营
        blocks:
          - type: paragraph
            body: >-
              Base Power 的部署运营现在看起来已经从早期市场冲刺，转为规模化安装机器。TechCrunch 在 2026 年 8 月报道，公司每天约安装 100
              块电池，并计划到年底把速度翻倍。与公司相关的行业报道称，Austin 的 Factory 1 已经每月生产数千套系统。


              运营上，Base 似乎仍沿用此前 Texas 扩张中描述的部署工厂模型：客户筛选、许可、排期、安装、调试和持续 fleet
              管理，都由内部团队协调，并配套软件支持和专业现场人工。这个运营肌肉仍是真正差异点，因为分布式电池只有在许可和部署流程能跨数千户家庭重复执行时，才会创造电网价值。


              2026 年的关键变化是地理，而不只是数量。Base 不再只部署到 Texas 零售选择市场或 Texas 公用事业合作伙伴场景。Latitude Media 和 Citizens Utility Board
              的消费者指南确认，公司现在已进入 Illinois ComEd 区域；在那里，产品和商业流程必须适配面向 PJM 的零售经济性，以及更碎片化的本地许可环境。
