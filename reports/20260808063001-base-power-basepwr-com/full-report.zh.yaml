              - CE035
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与服务区域
        blocks:
          - type: paragraph
            body: >-
              Base Power 现在至少服务三类已上线的住宅客户。第一类仍是 ERCOT 放开区域的核心 Texas 房主：他们想要备用电力和更低或更稳定的电费，但不想直接买断电池。第二类是 Texas
              合作社、市政或投资者所有公用事业项目下托管电池的公用事业合作伙伴家庭。第三类在 2026 年夏季新近可见，是符合条件的 Illinois ComEd 区域房主，他们加入 Base 的电池加供电报价。


              Illinois 启动很重要，因为它证明客户模型不再纯粹绑定 ERCOT。但客户主张不同于 Texas。Citizens Utility Board 描述的是两年期分时供电商计划，搭配更长的 12
              年电池托管承诺；前 2,000 名客户入门安装价 $95（之后 $295），并明确保证相对 ComEd 的 price to compare 节省费用。Latitude Media
              报道，底层经济性依赖降低零售容量费和输电费，而不是 Texas 式批发套利。


              渠道多元化仍是客户故事的一部分。Base 仍通过直接注册、公用事业推荐、Lennar 关联新建社区触达房主；不含电池的 Base Energy
              方案，则把品牌延伸到不能或不愿托管硬件的客户。分群逻辑在改善；但各分群盈利能力的公开衡量并没有同步改善。
