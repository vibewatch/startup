        - 月度单元部署率（已部署 MWh）对比计划
        - 工厂投产后部署率连续 3 个月 < 10 MWh/month
        - 实质性——影响供应链独立逻辑；退回进口硬件采购
      - - 关键高管离职（CEO 或 COO）
        - LinkedIn/PR 监测；投资者沟通
        - CEO 或 COO 离职且无计划继任
        - 投资逻辑风险——评估继任者质量和机构知识转移
      - - 固定电价合约亏损超过准备缓冲
        - 季度财务披露或投资者报告（如有）
        - REP 毛利连续 2+ 个季度转负
        - 投资逻辑破裂——当前批发价格环境下固定电价模型不可持续
    notes: 否决标准定义为需要立即重新评估投资逻辑的事件。行动含义从 'monitor'（低严重性）到 'thesis break'（高严重性，需要考虑退出）不等。
