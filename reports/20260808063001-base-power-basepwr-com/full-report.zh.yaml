  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Base Power 在户用储能市场的位置很特殊：它同时是资产持有方、零售电力供应商（REP）、软件平台和公用事业服务公司。这种纵向整合意味着它的竞争格局横跨四个不同集群。


              **直接 VPP 聚合商和电池即服务提供商**是最接近的替代品，因为它们追求同一件事——部署家用电池以捕捉电网套利收入，同时用较低自付成本为房主提供备电价值。Sonnen（Shell 子公司）及其德州零售伙伴
              SOLRITE Energy 于 2026 年 2 月在 ERCOT 推出纯电池 VPP，以 $20/月提供 60 kWh 储能，并给出 12¢/kWh 的「全包」零售电价——与 Base 的
              $19–$29/月会员模式直接重叠。Sunrun（NASDAQ: RUN）是美国最大的户用太阳能加储能公司，正通过与 NRG/Reliant 的多年合作在德州建设 1 GW VPP，并另有与 Vistra/TXU
              Energy 的电池聚合项目。截至 2026 年，Sunrun 已在全美部署超过 116,000 套储能系统，CalReady VPP 向加州电网交付 51 MW 峰值——这验证了住宅聚合模式，也让 Sunrun
              成为德州公用事业合作社带宽和房主入网的直接竞争者。


              **争夺同一安装位置的硬件 OEM**包括 Tesla（Powerwall 3）、Enphase（IQ Battery 5P）、Generac（PWRcell）、LG Energy Solution（RESU
              Prime）电池方案和 FranklinWH（aPower 2）。这些公司通过第三方安装商销售，而不是持有资产并直接运营。Tesla 还通过 Tesla Electric 作为 ERCOT 的 REP
              运营，并借助 Autobidder 运行自己的 VPP，因此在 ERCOT 是 OEM+聚合商混合型竞争者。Tesla Powerwall 3 单机 13.5 kWh，Base 单机 25 kWh；Tesla
              在德州安装成本为每台 $10,000–$13,500，而 Base 安装费为 $695——这给 Base 带来显著的消费者经济性优势。


              **需求响应和智能恒温器替代品**在不部署电池的情况下争夺电网服务价值栈。Renew Home（由 Google 的 Nest Renew 与 OhmConnect 合并而来）按入网家庭数计算，是北美最大的住宅
              VPP，依靠智能恒温器、智能插座、热水器和 EV。截至 2026 年 5 月，OhmConnect 已将德州客户迁移至 Direct Energy，并以 Renew Home 品牌运营。这些平台争夺同一个
              ERCOT ADER 试点容量上限（总计 200 MW）和房主注意力，但它们无法在停电时提供全屋备电——这是 Base 的核心差异点。


              **现状替代品和既有电网**仍是主导选择。大多数德州房主完全没有备用电源，选择承受停电风险。丙烷或天然气备用发电机（来自 Generac 和 Kohler）是传统韧性选项，安装成本超过 $15,000；Base
              以 $695 入门价利用了这道价格差。NRG/Reliant 和 TXU/Vistra 等既有企业通过 130+ 家 REP 服务 31M
              德州居民；理论上它们可以内部打包电池项目，但目前更倾向于与聚合商（Sunrun、Renew Home、Base）合作，而不是直接持有分布式硬件。
