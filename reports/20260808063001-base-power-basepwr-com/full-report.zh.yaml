      - number: '3.2'
        title: 直接竞争者画像
        blocks:
          - type: paragraph
            body: >
              **Tesla（Powerwall + Autobidder + Tesla Electric）**是 Base Power 最可信的多维竞争对手。Tesla Powerwall 3 容量 13.5
              kWh、连续输出 11.5 kW，在德州每台安装成本 $10,000–$13,500（未扣除 Oncor $4,500 补贴）。Tesla 在 ERCOT 以 Tesla Electric 运营 REP，其
              Autobidder 软件将住宅 Powerwall 聚合为电网服务资产——与 Base 是同一种商业模式。Tesla 德州 VPP 项目向房主支付约 $33/Powerwall/月账单抵扣，外加输出电量约
              $0.05/kWh，意味着典型参与者年总补偿约 $786。Tesla 的优势是品牌认知、内部电芯制造、EV 集成和深厚的 Autobidder 市场经验。劣势是前期成本高、GTM 偏太阳能，以及 13.5 kWh
              电池小于 Base 的 25 kWh 单元——这对 ERCOT 4CP 输电成本管理和单机电网收入很关键。Tesla 架构也要求房主购买设备（对消费者而言资产更重），而不是 Base 提供的轻资产订阅。


              **Sunrun（NASDAQ: RUN）**是美国最大的户用太阳能加储能提供商，拥有超过 1M 太阳能客户和 116,000+ 套已安装储能系统。在德州，Sunrun 已与 NRG/Reliant（目标到
              2035 年建设 1 GW VPP，首期 150 MW）和 Vistra/TXU Energy 建立合作。Sunrun 的加州 CalReady 项目在 16,000 户家庭中平均实现 48 MW
              峰值调度——这是住宅聚合规模化的有力证明。Sunrun 的竞争弱点是债务高（负债 $14B+）、获客成本约 $7,000/客户，以及据称较低的净推荐值，反映出安装延迟和售后服务问题。Sunrun
              要求房主已经拥有或安装太阳能，结构上无法服务无太阳能住宅——Base 的纯电池模式覆盖两类客户。


              **Sonnen（SOLRITE VPP）**于 2026 年 2 月携 SOLRITE Energy 在 ERCOT 上线，目标到 2026 年底覆盖 10,000 名客户、600 MWh/144 MW
              容量。Sonnen 的方案——$20/月提供 60 kWh 储能、12¢/kWh 全包零售电价——在每 kWh 备电价格上直接与 Base 会员方案竞争。Sonnen 由 Shell 持有（2019
              年收购），拥有深厚资产负债表支持。Sonnen 电池（ecoLinx 一代）为零售购买者提供 15,000 次循环 / 15 年质保，安装成本 $1,200–$1,500/kWh——这是高端硬件在订阅 VPP
              语境下的重新定位。Sonnen 第 11 代电池正与 Solrite 一起部署，根据堆叠数量提供 6/12/18 kW 输出。200 MW ADER 试点上限是共同约束；Sonnen 的 144 MW
              目标会直接与 Base 争夺这部分监管余量。


              **Generac（PWRcell + Enbala/Concerto DERMS）**是美国备用发电机主导品牌（约 75% 市占率），并通过 PWRcell 户用储能和 Enbala/Concerto
              DERMS 平台转向清洁能源。截至 2026 年初，Generac 清洁能源板块贡献约 60% 整体收入。Generac 户用电池提供 9–18+ kWh 可扩展容量，具备强浪涌能力，并支持太阳能 DC
              耦合。不同于 Base，Generac 通过经销商网络销售，而不是直接持有资产；它争夺同一批德州安装商心智和房主注意力。Generac Power Systems 还销售备用丙烷 / 天然气发电机（安装后
              $10,000–$20,000+），这是 Base 正在替代的主要既有现状方案。


              **Fluence/AutoGrid（软件层竞争者）**瞄准公用事业 DERMS 和 VPP 软件市场。Fluence（NASDAQ: FLNC）约有 1,670
              名员工，运营成熟的公用事业级和电网服务软件栈；AutoGrid 被 Schneider Electric 收购后，现在在 Fluence 体系内运营，向公用事业提供 VPP 编排和 DERMS
              软件。这些玩家争夺的不是房主，而是 Base 在受管制市场扩张中同样想拿下的公用事业合同——如果某家公用事业采购 AutoGrid 作为 DERMS，就可能把电池组管理内化，而不是外包给 Base。
