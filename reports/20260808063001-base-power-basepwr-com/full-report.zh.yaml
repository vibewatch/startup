      - number: '5.6'
        title: 附录图表
        blocks:
          - type: callout
            title: 垂直整合栈形成可防守护城河
            body: >
              Base Power 把硬件设计、本土制造、自研固件与软件（BaseOS）、自营部署运营和零售供电放进同一家公司。VPP
              或电池即服务提供商中，这种整合并不常见，多数玩家依赖第三方硬件（Tesla、Enphase）和第三方软件（AutoGrid、Itron）。这套栈让 Base
              不依赖供应商就能迭代成本、可靠性和调度速度，并在每一层捕获毛利。
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE021
              - CE031
          - type: callout
            title: 20% SOC 下限意味着备用电力不保证满额
            body: >
              合约允许 Base Power 为履行 ERCOT 电网交易义务，把房主电池放电至 20% state of charge。若重大停电开始时房主电池正处于 20%
              SOC——高峰需求热浪事件中最可能出现的情景——可用电量约为 4.5 kWh，在重空调负载下约等于 1–2
              小时全屋备用。这就是产品核心的结构性张力：让经济性成立的同一机制（电网套利），也会降低备用可靠性。独立电气承包商（Epic Electrical）已公开指出这个缺口，并建议增加补充发电机联锁来补齐。
            calloutType: risk
            claimRefs:
              - CE032
              - CE037
          - type: callout
            title: 中国电芯采购带来关税与供应链暴露
            body: >
              电芯目前来自中国。截至 2025 年 4 月，Base Power CEO 直接承认关税暴露。Austin
              工厂通过在本土制造模块、电池包和电力电子，缓解部分成本暴露；但在非中国供应链建立前，电芯仍是中国来源投入品。美国—中国关税（Section 301
              及相关措施）升级，可能在本土电芯采购落定前实质性抬高电芯成本、压缩毛利，或迫使电池价格调整。
            calloutType: risk
            claimRefs:
              - CE033
              - CE038
          - type: callout
            title: ERCOT ADER 监管成熟是关键路径事项
            body: >
              Base Power 已用满通过 ERCOT ADER 试点可投标的 20 MW。ERCOT 正在评估扩容到 160 MW，待 2026 年 6 月董事会批准；但节点调度和结算规则——Base 变现 fleet
              的主要机制——截至 2026 年 5 月仍在 ERCOT 内部审查。容量上限和结算框架，是 Base 在 Texas 电网服务收入天花板的硬约束；解决结果将决定 ADER 渠道能否扩张到支撑 Base
              的增长野心。
            calloutType: insight
            claimRefs:
              - CE023
