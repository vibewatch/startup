      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              Base Power 的可持续竞争优势集中在五个会复利的因素上：公用事业合作社伙伴合同（切换成本）、ADER 资格（监管护城河）、自有硬件 + 软件纵向栈、本土制造（Austin
              工厂）和部署速度。但几类被替代风险需要认真计入权重。


              **锁定与切换成本：**Base
              电池一旦安装在合作社会员电表之后，由公用事业调度电池组、房主获得备电服务，切换供应商就需要物理拆除并更换硬件——摩擦很高。三年最低合同进一步锚定客户。公用事业合作关系（CoServ 100 MW、GVEC 50
              MW、Bandera、Farmers Electric）也创造 B2B 切换成本：合作社需要重新认证并重新集成新的 DERMS 供应商，纳入其运营和 ERCOT 注册。不过，这些合同有期限，续约并不保证。


              **ADER 监管护城河：**Base 已获得 ERCOT Aggregated Distributed Energy Resource 试点资格，允许其将聚合住宅储能直接投标进 ERCOT
              批发和辅助服务市场。这一监管资格并非轻易可复制——ADER 试点总容量上限为 200 MW，遥测和合规要求会劝退小运营商，互操作性障碍也被 ERCOT ADER Task Force
              认定为「需要解决的关键事项」。Sonnen/Solrite 正瞄准同一 200 MW 上限中的 144 MW，因此这条监管通道上的竞争压力已经在加剧。


              **商品化电池替代风险：**ERCOT 电池收入已经崩塌——Enverus 数据显示，平均年收入从 2023 年的 $149/kW 降至 2025 年预计 $17/kW，下降 89%，由市场饱和驱动（进入
              2026 年时已安装 14 GW）。能源套利策略已经普及，但未能抵消回报下滑，主要运营商年初至今盈利率低于 2.2%。如果辅助服务和套利收入持续受压，Base 的单位经济性（估计每套 25 kWh 系统年总收入约
              $2,075）可能偏薄，尤其是在 100+ 员工带来超过 $15M/年的员工开销时。一位批评者指出，在基准收入情形下，Base 的回收期为「8–9 年」，只有在高波动年份才缩短至 5–6 年。


              **Tesla 和 Sunrun 价格战风险：**Tesla 和 Sunrun 都拥有内部电池制造渠道或合作供应（CATL/Panasonic 伙伴关系），并有现成安装商 / 房主渠道，规模远超 Base
              当前足迹。一位批评者特别警告称，「Tesla 或 Sunrun 复制他们的成功并不需要太多」，这些公司「尤其是 Tesla，已经能接触内部电池制造，任何价格战都会赢过 Base。」Base 2025 年 10
              月的 $1B Series C 和计划中的 Austin 本土工厂，正是对这一风险的明确回应。


              **监管与政策逆风：**联邦户用 ITC 25D 已于 2025 年底到期，削弱了竞品太阳能加储能安装的经济性，也可能降低消费者对任何家庭能源投资的需求。2025 年的「One Big Beautiful
              Bill Act」压缩了开发商时间表，并提高了合规负担。Deloitte 2026 Power and Utilities Outlook
              指出，容量采购、电价设计不确定性和并网延误仍是行业一线风险——这些都会影响 Base 在德州之外签下新受管制市场公用事业合同的能力。
