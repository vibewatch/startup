      - number: '7.3'
        title: 运营、安全、网络与执行风险
        blocks:
          - type: paragraph
            body: >-
              Base Power 的租赁模型形成结构性客户利益冲突：公司可合法地把客户电池调度到 20% state of charge，再向 ERCOT
              批发市场售电；这意味着电网停电发生时，电池未必满电。消费者论坛和电工建议网站明确记录了这一风险：满空调负载下，一块 25 kWh 电池即便满电也只能提供 2-5
              小时备用；若近期刚被调度，时间更短。社区论坛讨论显示，一些客户觉得备用时长保证存在误导，且 20%
              下限实质性降低了有效备用上限。若未来极端天气事件中，客户虽预期有覆盖却没有备用电力，声誉和监管投诉风险会急剧上升。

              电池火灾安全是真实但可管理的风险。Base Power 使用 LFP（Lithium Iron Phosphate）化学体系，热失控风险显著低于 NMC 锂离子电芯，但并非不会起火。CPSC 在 2026
              年因第三方电芯缺陷导致的过热、火灾和灼伤危害，召回约 10,500 套 Tesla Powerwall 2 系统——这说明即便工程良好的住宅电池系统也可能需要召回。Texas
              各县火灾安全许可要求不同，形成分散合规负担。Clean Energy Group 指出，正确安装的电池储能是安全的，但热失控会产生难以扑灭、带有有毒气体的猛烈火灾。随着 Base Power
              扩张到数万户家庭并每日循环，产品责任暴露按比例增加。

              云端管理住宅电池 fleet 的网络安全风险更高。NERC 的 Howard Gugel 指出，面向逆变器型资源的大规模软件更新带来双重担忧：若更新通道被攻破，运营灵活性可能转化为灾难性电网影响。EPRI 研究员
              Sai Ram Ganti 警告，具备双向云连接的电池可由供应商远程操作；一旦云服务器被攻破，将构成重大威胁。Base Power 的 fleet 管理模型依赖这种双向云连接，来实时管理 SOC 并执行
              ERCOT 调度。若 Base Power fleet 管理平台遭遇协同网络攻击，数千块客户电池可能同时失效，构成重大电网可靠性事件和声誉灾难。Brattle/Dragos BESS 网络安全报告（2025 年
              12 月）发现，美国 BESS 部署每年增长 30%，但网络安全标准和监管要求没有跟上。

              随着 Base Power 全国扩张，安装商和供应链风险具有实质性。美国住宅电池安装能力承压：专业人工需求旺盛，中国电芯关税压缩库存可得性并推高成本。预计 2026 年美国住宅电池储能部署下降
              12%，显示近期逆风。Base Power 的本土制造策略（位于前 Austin American-Statesman 场地的 Factory
              One）从结构上处理供应链风险，但也给一家没有既往工厂运营经验的公司增加制造执行风险。

              考虑到 Base Power 的年龄（2023 年 8 月成立）、雄心范围（全国扩张、本土制造、ERCOT 市场参与、REP 运营），以及领导层在运营大型能源公用事业或工厂方面相对缺乏经验，执行风险偏高。CEO
              Zach Dell 具备金融和风险投资背景；COO Justin Lopas 在 Anduril 和 SpaceX 有制造经验，但两人此前都没有带领过这种规模的公用事业级电池 fleet 走完整个市场周期。
