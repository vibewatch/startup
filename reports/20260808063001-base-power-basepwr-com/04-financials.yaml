- id: capital-adequacy
  title: Capital Adequacy and Financing Architecture
  body: |-
    Base Power's capital base has moved into true mega-round territory. After the $200 million Series B in April 2025 and the $1 billion Series C in October 2025, the company announced a second $1 billion round in August 2026 at a $13 billion post-money valuation. Company-linked launch coverage says cumulative capital raised is now above $2.5 billion.

    That financing materially extends runway for manufacturing equipment, inventory, deployment labor, software, working capital, and new-market launch costs. It also lowers the immediate risk that Base must rely on project finance or asset-backed facilities before proving more of its unit economics publicly. In practical terms, the Series D reduces short-term funding risk while increasing long-duration performance pressure: a company valued at $13 billion is being asked to convert scale metrics into demonstrably superior economics, not merely continued top-line deployment growth.

    The operating scale implied by current coverage is substantial. TechCrunch reported more than 500 MWh deployed and roughly 100 batteries installed per day, while company-linked trade coverage says Factory 1 is producing thousands of systems per month. Even with that momentum, outside investors still cannot verify burn rate, gross margin, customer acquisition cost, bad-debt exposure, warranty reserve assumptions, or the degree to which future growth depends on continued subsidy from equity capital.
