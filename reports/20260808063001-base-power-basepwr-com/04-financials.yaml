chapter:
  number: 4
  title: Financials
  summary: 'Base Power''s monetization stack is broader in August 2026 than it was earlier in the year: Texas retail electricity margin, battery-hosting fees, ERCOT/grid-services revenue, utility capacity contracts, and a newly public Illinois retail-capacity model. But the gap between operating scale and financial disclosure remains wide. Base says it has raised more than $2.5 billion, is deploying 100 batteries per day, and has surpassed 500 MWh, yet audited revenue, gross margin, CAC, and cash-burn data remain private. That makes the financial story legible as a capital-intensity case study, not yet a fully underwritable set of public metrics.'
sections:
- id: revenue-model
  title: Revenue Model and Monetization Stack
  body: |-
    Base Power now monetizes residential storage through at least five overlapping revenue layers. In deregulated Texas territories, the first layer is an installation fee and monthly membership attached to company-owned hardware. The second layer is retail electricity margin from serving the home directly. The third layer is wholesale/grid-services value from dispatching the aggregated battery fleet during expensive or reliability-critical periods. The fourth layer is utility capacity contracting for programs such as Austin Energy, El Paso Electric, and CoServ. The fifth, now visible in Illinois, is a retail-focused structure that uses batteries to lower capacity and transmission charges across the supplier's customer portfolio.

    The important financial implication is that "Base revenue" is no longer synonymous with one ERCOT arbitrage play. Texas still appears to be the core earnings engine, but Illinois demonstrates a different monetization path in which reducing grid fees can matter as much as selling energy back during scarcity events. That should diversify the revenue thesis over time, but it also means investors need market-by-market contribution data rather than a single blended story.

    Public pricing remains fragmented. TechCrunch reported a representative Houston-area package of $695 install, $19/month, and roughly 13.1 cents/kWh for electricity. Citizens Utility Board documented a summer 2026 Illinois offer with a $95 introductory installation fee for the first 2,000 customers ($295 thereafter) and a time-of-use plan guaranteed at least 25% below ComEd's price to compare during the initial two-year term. These offers are clearly designed to maximize acquisition rather than near-term hardware payback.
