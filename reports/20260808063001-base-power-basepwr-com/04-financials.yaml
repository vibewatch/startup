- id: TI005
  title: Public Financial Gaps and Diligence Blockers
  columns:
  - Missing Metric
  - Impact on Underwriting
  - Diligence Path
  rows:
  - - Gross margin (company-level and per revenue stream)
    - Cannot assess financial viability; model could be negative-margin at current scale
    - Require audited income statement with revenue and COGS by stream
  - - Wholesale arbitrage revenue and net margin per MWh dispatched
    - Primary payback driver is unverified; ADER participation revenue opaque
    - Obtain ERCOT settlement data and QSE fee schedules from data room
  - - Monthly burn rate and cash balance
    - Current revenue, gross margin, and burn remain private despite a $13B post-money valuation
    - Without audited revenue quality, public investors cannot test whether the valuation step-up is justified
  - - Battery degradation schedule and replacement reserve
    - Lifetime economics depend on battery longevity; LFP is favorable but untested at fleet scale
    - Request cycle count data, warranty reserve policy, and actuarial assumptions
  - - CAC by acquisition channel (organic, homebuilder, utility, direct)
    - Scale efficiency and unit payback depend on acquisition cost
    - Require sales and marketing spend breakdown and conversion rate by channel
  - - Revenue recognition policy for installation fees and tolling agreements
    - Front-loaded vs deferred recognition affects reported financials
    - Require accounting policy memo and auditor sign-off
  - - Regulated-market unit economics (El Paso Electric pilot)
    - Without retail margin and arbitrage, utility-only payback is unproven
    - Require El Paso pilot P&L and capacity payment terms from EPE
  - - Valuation basis and last-round markups by lead investors
    - $4B post-money at $12M revenue implies ~333x revenue multiple; basis unclear
    - Obtain capitalization table and most recent 409A or third-party valuation
  notes: All gaps reflect publicly unavailable private information as of May 2026 access date. Each item represents a material underwriting blocker that should be resolved in a formal diligence data room process before investment.
