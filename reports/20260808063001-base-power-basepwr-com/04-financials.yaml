- id: TI001
  title: Revenue Streams Summary
  columns:
  - Stream
  - Mechanism
  - Unit / Rate
  - Current Status
  - Revenue Quality
  - Diligence Ask
  rows:
  - - Monthly subscription
    - Homeowner pays for battery access and maintenance
    - $19/mo Texas example; Illinois economics differ by market
    - Active across Texas fleet
    - Low (insufficient alone for payback)
    - Confirm churn rate and contract renewal terms
  - - Installation fee
    - One-time hardware onboarding charge
    - $695 (25 kWh) or $995 (50 kWh)
    - Active across Texas fleet
    - Low (covers <15% of net unit cost)
    - Verify refund and cancellation terms
  - - Retail electricity margin
    - REP spread between wholesale cost and 8.5¢/kWh fixed rate
    - 8.5¢/kWh energy plus delivery pass-through
    - Active in ERCOT deregulated territory
    - Medium (fixed rate vs volatile wholesale; hedged by arbitrage)
    - Obtain realized spread data and procurement hedging terms
  - - Wholesale grid arbitrage
    - ADER fleet charges at low prices; discharges at peak prices
    - Spot price spread; ERCOT settlement
    - Qualified ADER participant since 2025
    - High potential; unverified margin
    - Request revenue/MWh dispatched and dispatch frequency
  - - Utility tolling agreement
    - Capacity payment per kW-month from Austin Energy; 40 MW reserved
    - $4.08M/yr (10-year term, non-escalating)
    - Signed May 2026; ramp over 18 months
    - Medium (stable but low yield vs capital; no ERCOT arbitrage competition)
    - Confirm contract structure and dispatch control terms
  - - Base Energy plan (battery-free)
    - Electricity-only plan piggybacks on existing fleet arbitrage
    - 13.2–15.7¢/kWh all-in; 36-month contracts
    - Launched April 2026; CenterPoint / Oncor / AEP territories
    - Low-medium (margin depends on fleet scale for arbitrage subsidy)
    - Quantify customer acquisition and fleet dependency assumptions
  notes: Revenue figures are estimates from Sacra, company press releases, and public filings; realized margins for each stream are not publicly disclosed. Austin Energy tolling value per kW-month is derived from the City Council item authorizing up to $4.08M/year for 40 MW.
