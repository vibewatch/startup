company:
  name: Base Power
chapter:
  number: 1
  title: Company Overview
  summary: 'Base Power is an Austin-based distributed energy company founded in 2023 by Zach Dell and Justin Lopas. It now combines company-owned residential batteries, retail electricity supply, and utility/grid-services dispatch across Texas and Illinois. After a $1 billion Series D announced on 2026-08-03 at a $13 billion post-money valuation, the company says it has raised more than $2.5 billion, deployed more than 500 MWh, serves 30,000+ homes, and is manufacturing its new 39.2 kWh / 78.4 kWh Base Core system in Austin. The core diligence tension is unchanged: execution and investor quality are unusually strong, but public financial disclosure still lags the valuation step-up.'
sections:
- id: identity-and-model
  title: Identity and Business Model
  body: |-
    Base Power Company was founded in 2023 and is headquartered in Austin, Texas. The company operates a vertically integrated residential energy model: it installs batteries at homes, retains ownership of the hardware, supplies electricity in deregulated service areas, and dispatches the aggregated fleet for grid services or utility capacity support. That structure still resembles a "gentailer" model, but by August 2026 it spans two operating states rather than just Texas.

    The consumer offer now centers on Base Core, a company-built home battery available in 39.2 kWh and 78.4 kWh configurations. In Texas, Base pairs the hardware with retail electricity plans and monetizes both retail margin and wholesale/grid-support value. In Illinois, Base has adapted the model for ComEd territory with a retail-focused structure that emphasizes reducing capacity and transmission charges rather than ERCOT-style energy arbitrage. In regulated or municipal territories such as El Paso Electric and Austin Energy, the company instead sells capacity or grid-support services to the utility while homeowners host the battery.

    The live company homepage fetched in this run markets Base as the power company bringing affordable, reliable energy to homes across America and states that more than 30,000 homes are powered by Base. That scale claim is company-reported rather than audited, but it is materially above the 10,000-home milestone visible earlier in 2026 and aligns with the company's broader narrative of rapid multi-state expansion.
