- id: funding-and-investors
  title: Funding History and Investors
  body: |-
    Base Power's financing history now has four visible inflection points: early seed/A financing in 2023–2024, a $200 million Series B in April 2025, a $1 billion Series C in October 2025, and a second $1 billion mega-round in August 2026. The newest round was announced on 2026-08-03 as a Series D at a $13 billion post-money valuation.

    The Series D was led by Ribbit Capital, Addition, Valor Equity Partners, and JPMorganChase's Strategic Investment Group. Disclosed participants also included Altimeter, D1 Capital Partners, Sands Capital, Coatue, Layer Global, and Energy Impact Partners, while major existing backers such as Thrive Capital, Andreessen Horowitz, Lightspeed, Trust Ventures, and CapitalG reinvested. The investor list is notable for breadth across fintech, growth equity, internet, and infrastructure-oriented capital, reinforcing that Base is being underwritten as a platform-scale energy company rather than a niche hardware vendor.

    Company and trade-press materials published with the Series D say Base has now raised more than $2.5 billion since founding. Publicly itemized rounds do not fully disclose every early tranche and instrument, so the exact lifetime total remains better treated as company-reported than independently reconstructed. What is clear is the magnitude of capital now available for battery manufacturing, deployment labor, software, working capital, and additional geographic expansion.
