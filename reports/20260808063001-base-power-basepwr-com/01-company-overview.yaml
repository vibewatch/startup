- id: milestones-and-traction
  title: Milestones, Traction, and Scale
  body: |-
    Base Power's first phase of traction was Texas-specific: founding in 2023, first deployments later that year, early cooperative and homebuilder partnerships in 2024, and the Series B / Series C / factory sequence through 2025. The second phase, visible in 2026, is scale-up and model extension. Base has continued adding Texas utility relationships, launched its Austin Energy and El Paso Electric programs, and moved beyond an ERCOT-only story by entering Illinois.

    The August 2026 Series D launch package provides the strongest current scale markers. TechCrunch reported that Base had installed more than 500 MWh of storage and was deploying roughly 100 batteries per day, equivalent to about 8 MWh of new storage per day, with a goal to double that pace by year-end. Company-linked trade coverage likewise states that the operational fleet exceeds 500 MWh, utility partnerships represent more than 200 MW of capacity, and Base Factory 1 in Austin is producing thousands of systems per month.

    The same launch cycle also formalized Base Core as the company's new flagship battery and confirmed the company is serving Texas and Illinois. The homepage claim of 30,000+ homes powered by Base suggests that customer adoption accelerated materially during 2026. Public revenue, margin, and cohort-retention disclosures still lag these operating milestones, so the scale story is significantly better evidenced than the monetization story.
