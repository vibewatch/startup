callouts:
- calloutType: strength
  title: Rapid Scale in a High-Volatility Market
  body: |
    Base Power deployed >100 MWh of residential battery capacity within roughly 18 months of first deployments, qualified for ERCOT's ADER wholesale program, and secured five Texas utility partnerships by March 2026. The speed of execution—enabled by residential permitting short-cuts and the Lennar homebuilder channel—represents a durable early-mover advantage in distributed storage.
  claimRefs:
  - CO029
  - CO031
  - CO032
  - CO035
- calloutType: risk
  title: Battery Drain Clause Undermines Backup Value Proposition
  body: |
    Base Power's contracts permit it to discharge customer batteries to 20% charge to sell power to the grid during peak demand periods—the exact conditions under which grid outages are most likely. An independent DFW electrician review identified this as the "one thing most people miss" and advised pairing Base with a supplemental generator for true whole-home protection. This structural tension between the commercial VPP use case and the customer's backup expectation is a reputational and churn risk, particularly after a high-profile outage event.
  claimRefs:
  - CO036
  - CO037
- calloutType: risk
  title: Unit Economics Dependent on Volatile ERCOT Arbitrage
  body: |
    Third-party analysis estimates a simple payback period of eight to nine years per 25 kWh unit at current pricing, with profitability hinging on sustained wholesale price volatility in ERCOT. As more storage assets enter the market, arbitrage spreads may compress. Additionally, prior supply- chain dependence on Chinese-manufactured batteries creates tariff exposure that the Austin factory is not yet equipped to fully replace.
  claimRefs:
  - CO038
  - CO039
  - CO040
