- id: risks-and-adverse
  title: Adverse Considerations and Key Risks
  body: |-
    Independent and consumer-oriented sources continue to surface three recurring risk themes. First, Base's customer contract model still allows the company to use stored energy for grid or utility value before an outage occurs, so backup availability at the exact moment of a blackout is not guaranteed. Citizens Utility Board's July 2026 explanation of the Illinois offer explicitly warns consumers that the battery may not always have enough charge for longer outages and that long-term switching flexibility is reduced by the contract structure.

    Second, valuation risk has increased faster than disclosure quality. The Series D lifted Base's post-money valuation to $13 billion less than a year after the $4 billion Series C, yet public evidence on revenue, gross margin, burn, and realized unit economics remains incomplete. That creates a widening gap between execution optics and underwritable fundamentals.

    Third, geographic expansion now introduces model risk rather than merely ambition risk. Illinois provides a live proof point that Base can adapt outside ERCOT, but it also shows that the business model changes materially from state to state. A company that looks like a Texas gentailer in one market can become a retail-capacity optimizer or utility capacity vendor in another. That adaptability is strategic upside, but it weakens any simplistic claim that the Texas model copies cleanly nationwide.
