  topStrengths:
  - Base has scaled from a Texas startup to a 30,000+ home, 500+ MWh multi-state platform in under three years.
  - The company's vertically integrated model spans hardware, deployment, electricity supply, and grid/utility monetization.
  - The August 2026 Series D syndicate and Austin manufacturing launch show unusually strong external confidence and execution capacity.
  topRisks:
  - The $13B Series D valuation is difficult to justify with publicly available revenue, margin, and unit-economics evidence.
  - Customer economics still depend on long contract terms and batteries that may not always be fully charged during outages.
  - Multi-state expansion is real, but Illinois proves that each new market may require a meaningfully different commercial model.
  unresolvedGaps:
  - Audited revenue, gross margin, burn, and state-level contribution margins remain undisclosed.
  - The post-Series-D cap table, preference stack, and any asset-level financing structure are not public.
  - Illinois cohort retention, complaint rates, and customer economics are too early to evaluate rigorously.
  - Independent reliability and cybersecurity audits for the 500+ MWh fleet are not publicly available.
