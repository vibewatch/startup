companyProfile:
  summary: Base Power is an Austin-based distributed energy company that installs company-owned residential batteries, supplies electricity in eligible deregulated markets, and dispatches its aggregated fleet to support the grid. The company began in Texas, has now expanded into Illinois, and in August 2026 launched Base Core — a 39.2 kWh / 78.4 kWh home battery built at its Austin factory. Public evidence supports unusually fast deployment and fundraising momentum, but not yet the full financial transparency required to underwrite the latest $13 billion valuation with confidence.
