      - number: '6.5'
        title: Expansion and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Base Power is less geographically concentrated than it was earlier in 2026, but it is still far from
              diversified. Texas remains the core operating state, the most fully integrated economics, and the source
              of almost all public testimonial density. Illinois reduces the binary ERCOT-only narrative but does not
              yet prove balanced multi-state revenue.


              The Illinois launch also introduces a new concentration nuance: Base can expand beyond Texas, but each new
              state may require a different commercial design, regulatory interface, and customer promise. That means
              growth in customer count does not automatically imply clean operational repeatability. A 30,000+ home
              platform can still be heavily reliant on a small number of economic and regulatory playbooks.


              Utility-partner concentration also remains relevant. CoServ, Austin Energy, El Paso Electric, and other
              Texas partners give Base scale and credibility, but they also create exposure to utility budget cycles,
              program-specific performance requirements, and deployment pacing outside of Base's direct retail funnel.
              The customer base is broader than before, yet still not broad enough to remove institutional dependency
              risk.
