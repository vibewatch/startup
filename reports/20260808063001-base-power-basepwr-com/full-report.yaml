  - id: FR001
    title: Risk Heatmap — Base Power Risk Universe by Likelihood and Impact
    type: matrix
    layout: standard
    summary: >-
      Maps 10 identified risks by likelihood (Low / Medium / High) and business impact (Moderate / High / Critical),
      with residual severity after current mitigations.
    data:
      columns:
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
      rows:
        - label: Critical Impact
          values:
            - Battery fire / thermal runaway; Cyberattack on fleet management
            - ADER pilot capacity freeze or dissolution
            - ERCOT revenue compression / saturation
        - label: High Impact
          values:
            - Interconnection cost overrun; Key executive departure
            - Battery degradation / warranty cost; Software mis-dispatch; Factory One ramp failure
            - Customer conflict of interest (SOC drain vs backup)
        - label: Moderate Impact
          values:
            - ''
            - Installer shortage slowing deployment
            - ''
