      - number: '8.2'
        title: Valuation Context and Financing Structure
        blocks:
          - type: paragraph
            body: >-
              Base Power's financing chronology is now one of the fastest late-stage repricings in climate and
              distributed-energy venture. Public round history visible in this report includes Series B at $200 million
              in April 2025, Series C at $1 billion in October 2025, and Series D at $1 billion announced on 2026-08-03.
              The latest round was disclosed at a $13 billion post-money valuation.


              Company-linked launch coverage says cumulative capital raised now exceeds $2.5 billion. That means the
              company has both significant balance-sheet support and a meaningfully larger preference stack than was
              visible at the Series C stage. Without the cap table, liquidation preferences, participation rights, and
              any project-level financing detail, outside investors still cannot model the true economic waterfall
              behind the current headline valuation.


              The most important contextual change is that the company is no longer being marked like an exceptionally
              promising Texas operator. It is being marked like a potential national infrastructure platform. Entry
              discipline therefore has to shift from "is $4 billion too rich?" to "what evidence could make $13 billion
              defensible?" Public evidence today does not yet clear that bar.
            claimRefs:
