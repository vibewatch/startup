      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Vertically Integrated Stack Creates a Defensible Moat
            body: >
              Base Power combines hardware design, domestic manufacturing, proprietary firmware and software (BaseOS),
              in-house deployment operations, and retail electricity provision in a single company. This integration is
              rare among VPP or battery-as-a-service providers, most of whom rely on third-party hardware (Tesla,
              Enphase) and third-party software (AutoGrid, Itron). The stack allows Base to iterate on cost,
              reliability, and dispatch speed without vendor dependencies, and to capture margin at every layer.
            calloutType: strength
            claimRefs:
              - CE017
              - CE018
              - CE021
              - CE031
          - type: callout
            title: 20% SOC Floor Means Backup Is Not Guaranteed Full
            body: >
              Base Power is contractually permitted to draw homeowner batteries down to 20% state of charge to service
              ERCOT grid-trading obligations. A homeowner whose battery is at 20% SOC when a major outage begins — the
              scenario most likely during a peak-demand heat event — would have approximately 4.5 kWh of usable energy,
              equivalent to roughly 1–2 hours of whole-home backup with heavy air-conditioning load. This is the
              structural tension at the heart of the product: the same mechanism that makes the economics work (grid
              arbitrage) is the mechanism that reduces backup reliability. Independent electrical contractors (Epic
              Electrical) have flagged this gap publicly and recommend a supplemental generator interlock to close it.
            calloutType: risk
            claimRefs:
              - CE032
              - CE037
          - type: callout
            title: China Cell Sourcing Creates Tariff and Supply Chain Exposure
            body: >
              Battery cells are currently sourced from China. As of April 2025, Base Power's CEO acknowledged tariff
              exposure directly. The Austin factory mitigates some cost exposure by building modules, packs, and power
              electronics domestically, but cells remain a China-sourced input until a non-China supply chain is
              established. Escalating US–China tariffs (Section 301 and related measures) could materially increase cell
              cost and compress margins or require battery pricing revisions before domestic cell sourcing is secured.
            calloutType: risk
            claimRefs:
              - CE033
              - CE038
          - type: callout
            title: ERCOT ADER Regulatory Maturation Is a Critical Path Item
            body: >
              Base Power has maxed out the 20 MW it can bid through the ERCOT ADER pilot. ERCOT is reviewing an
              expansion to 160 MW, with pending Board approval in June 2026, but nodal dispatch and settlement rules —
              the primary mechanism through which Base monetizes its fleet — remain under internal ERCOT review as of
              May 2026. The cap and settlement framework are the binding constraint on Base's grid-services revenue
              ceiling in Texas; their resolution will determine whether the ADER channel can scale to support Base's
              growth ambitions.
            calloutType: insight
            claimRefs:
              - CE023
              - CE024
              - CE035
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Service Territories
        blocks:
          - type: paragraph
            body: >-
              Base Power now serves at least three live residential customer archetypes. The first is still the core
              Texas homeowner in a deregulated ERCOT territory who wants backup power and lower or more stable
              electricity bills without buying a battery outright. The second is the utility-partner household that
              hosts a battery under a cooperative, municipal, or investor-owned utility program in Texas. The third,
              newly visible in summer 2026, is the Illinois homeowner in eligible ComEd territory who enrolls in a Base
              battery-plus-supply offer.


              The Illinois launch matters because it proves the customer model is no longer purely ERCOT-bound. However,
              the customer proposition differs from Texas. Citizens Utility Board describes a two-year time-of-use
              supplier plan paired with a much longer 12-year battery-hosting commitment, introductory installation
              pricing of $95 for the first 2,000 customers ($295 thereafter), and an explicit savings guarantee relative
              to ComEd's price to compare. Latitude Media reports that the underlying economics rely on reducing retail
              capacity and transmission charges rather than Texas-style wholesale arbitrage.


              Channel diversification remains a feature of the customer story. Base still reaches homeowners through
              direct sign-up, utility referrals, and Lennar-linked new-construction communities, while the battery-free
              Base Energy plan extends the brand to customers who cannot or will not host hardware. The segmentation
              logic is improving; the public measurement of each segment's profitability is not.
            claimRefs:
