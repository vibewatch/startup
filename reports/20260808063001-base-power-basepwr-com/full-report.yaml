      - number: '7.2'
        title: Financial, Capital, and Revenue Risk
        blocks:
          - type: paragraph
            body: >-
              ERCOT battery economics remain under structural pressure from market saturation, and that still matters
              because Texas is the densest evidence base for Base Power's business model. However, the financing risk
              has shifted shape since August 2026. The new Series D substantially lowers near-term liquidity risk while
              increasing expectation risk: a company valued at $13 billion after raising more than $2.5 billion must now
              prove not just growth, but high-quality growth.


              In other words, the capital-markets question is no longer "Can Base raise money?" It is "Can Base justify
              the latest price with economics that survive outside a narrow set of favorable assumptions?" If revenue,
              margin, or cash-burn evidence lags too far behind the scale story, the next financing event could still be
              difficult even after a successful Series D.


              Current Illinois documentation also makes the consumer-risk surface more legible. Long contract terms,
              switching friction, and non-guaranteed outage coverage are not fatal on their own, but they raise the
              probability that any customer-protection scrutiny would land when the company is much larger and more
              systemically visible than it was at the Series C stage.
