      - number: '4.2'
        title: Hardware Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Base Power's unit economics are defined by a large upfront capital outlay per installed battery that is
              recovered over a 36-month or longer service horizon through blended revenue. Sacra estimates the all-in
              installed cost to Base Power at approximately $10,000 per battery before the $3,000 federal investment tax
              credit, yielding a net company-side cost of roughly $7,000 per unit. The consumer-facing install fee
              ($695–$995) covers less than 15% of the company's net hardware cost, meaning Base Power front-loads a
              subsidy of approximately $6,000–$6,300 per installation. This subsidy-financed model resembles the
              solar-leasing playbook pioneered by SolarCity, where scale and long-duration contracts are prerequisites
              for economic sustainability.


              NREL's 2024 Annual Technology Baseline (ATB) benchmarks residential battery storage pack cost at $283/kWh
              DC for a 2023 model year system using LFP chemistry, rising to approximately $1,300/kWh after inverter,
              balance-of-system, labor, permitting, and sales costs on an installed basis. For a 25 kWh system, that
              implies a market-rate installed cost of approximately $32,500, far above Base Power's consumer-facing
              price. Base Power's vertical integration strategy—designing, manufacturing (Gen 3 at Factory One in
              Austin), and installing in-house—aims to compress hardware cost below market benchmarks, though Gen 3
              ramp-through mid-2026 introduces manufacturing execution risk.


              Sacra estimates the payback period at approximately 3.5 years, driven primarily by retail electricity
              margin and wholesale arbitrage rather than lease fees alone. This 3.5-year horizon assumes stable ERCOT
              wholesale price volatility, sustained customer retention, continued regulatory access to ADER markets, and
              no material battery degradation shortfall. Near-zero reported churn (one lost customer as of August 2025)
              is a positive leading indicator, but gross margins, EBITDA, and contribution margins per unit remain
              undisclosed, precluding independent verification of the payback model. The system reserves 20% of battery
              capacity (~5 kWh per 25 kWh unit) for homeowner backup, with the remaining 80% available for daily grid
              trading—a structural commitment that constrains backup depth but maximizes monetizable dispatch capacity.
            claimRefs:
