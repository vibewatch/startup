      - number: '1.2'
        title: Founders and Leadership Team
        blocks:
          - type: paragraph
            body: >
              Base Power was co-founded in August 2023 by Zach Dell (CEO) and Justin Lopas (COO). Dell, then 29, is the
              son of Dell Technologies founder Michael Dell. He studied social sciences, psychology, and economics at
              the University of Southern California (class of 2019) before working as an investor at Blackstone and then
              Thrive Capital, where he developed conviction in the distributed-energy thesis. Lopas previously served as
              Head of Manufacturing at Anduril Industries and was a lead manufacturing engineer on the SpaceX program.
              Their complementary skill sets—Dell in finance and strategy, Lopas in hardware operations—were cited by
              multiple investors as a key de-risking factor.

              The extended leadership bench draws heavily from high-precision manufacturing and software-intensive
              consumer hardware backgrounds. Dino Sasaridis (Head of Hardware) led the Powerwall engineering team at
              Tesla. Jared Greene (Head of Software) developed the laser-mesh communications system for SpaceX Starlink.
              Cole Jones (Head of Growth) ran go-to-market for Starlink. Dana Paz (Head of Deployments) led
              manufacturing engineering teams at Anduril. Travis Kavulla (Head of Policy) previously served as Director
              of Energy and Environmental Policy at the R Street Institute and as a Montana utility commissioner. Zina
              Bash (Chief Legal Officer) was a senior partner at Keller Postman.

              The concentration of executive experience at SpaceX, Tesla, Anduril, Blackstone, and Thrive creates a
              demonstrable key-person dependency: departure of Dell or Lopas would risk both investor relationships and
              the operational execution capacity that has driven the rapid manufacturing ramp.
