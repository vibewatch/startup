      - number: '8.4'
        title: Bull / Base / Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The scenario framework used in the prior report becomes harsher when translated to a $13 billion entry
              price. Even if Base reaches $250 million of 2027 revenue and wins a premium 20–25x forward multiple, the
              resulting $5–6.25 billion exit valuation from the prior bull case still falls far short of the current
              mark. In practical terms, the latest round appears to be pricing in an even larger future business than
              the old bull case contemplated.


              A more charitable reading is that the Series D reflects private-market willingness to capitalize a
              long-duration option on American distributed power infrastructure. If so, investors are paying for an
              outcome in which Base not only scales Texas and Illinois, but also compounds across additional states,
              proves its manufacturing cost curve, and turns operational density into a network or cost advantage
              competitors cannot easily match.


              That may happen. But the public record still leaves too many unresolved variables — revenue quality,
              cohort durability, state-specific unit economics, and cap-table terms — for the current price to look
              conventionally attractive on a risk-adjusted basis.
