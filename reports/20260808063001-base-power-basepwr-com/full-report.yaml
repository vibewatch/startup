  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The strongest case for Base Power is still unusually compelling on the operating side. The company has
              moved from Texas startup to multi-state platform in under three years, now publicly claims 30,000+ homes
              powered, has reported a 500+ MWh operational fleet, and is manufacturing its own next-generation battery
              in Austin. The investor roster around the August 2026 Series D is also unusually strong, combining
              fintech, growth-equity, and strategic-capital sponsors.


              The problem is not that the company lacks proof of ambition or momentum. The problem is price. At $13
              billion post-money, the new round asks investors to underwrite not just further customer acquisition, but
              national category leadership, sustained cost reduction in manufacturing, durable customer retention, and
              superior economics across multiple regulatory regimes. Public evidence today is not strong enough to
              verify those assumptions.


              That creates an unusually asymmetric valuation setup: good news on deployment, geography, and product
              launch is real, but much of it appears already capitalized into the latest mark. The public anti-thesis
              therefore becomes stronger, not weaker, after the Series D.
