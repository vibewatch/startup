      - number: '6.4'
        title: Retention, Durability, and Contract Terms
        blocks:
          - type: paragraph
            body: >-
              Contract durability is still one of Base Power's most important customer-quality signals, but the terms
              are now market-specific rather than uniform. In Texas, prior product documentation described a long
              battery-services relationship layered with a multi-year electricity contract. In Illinois, Citizens
              Utility Board documented a two-year initial supply term paired with a 12-year battery-hosting commitment
              and a $500 early termination fee.


              These terms create real retention support but also real customer-friction risk. Long-duration agreements
              reduce churn and make hardware subsidy easier to justify, yet they also make customers more sensitive to
              perceived underperformance, rate disappointment, or the realization that battery backup is not fully
              guaranteed at every moment. CUB explicitly warns that the battery may not always have enough charge for
              longer outages and that rooftop-solar households may be worse off than on ComEd's standard structure.


              Public evidence on actual retention remains limited. Sacra's earlier near-zero churn anecdote is still
              directionally positive, but it was generated at much smaller scale and before Illinois expansion. The
              quality of retention proof therefore lags the quality of top-line customer-count proof.
            claimRefs:
