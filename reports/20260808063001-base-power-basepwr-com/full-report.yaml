  - id: FU001
    title: Base Power Customer Journey Map
    type: journey-map
    layout: wide
    summary: >
      Five-stage journey from awareness through advocacy, spanning two acquisition paths (direct retail and
      utility/homebuilder channel) and three key expansion moments.
    data:
      nodes:
        - label: Awareness
          direct: Grid outage media coverage; social ads; neighbor referral; Lennar community walk-through
          utility: Cooperative newsletter; utility program mailer; GVEC/Bandera/CoServ email
        - label: Consideration
          direct: >-
            basepowercompany.com rate comparison tool; powertochoose.org comparison; independent reviews
            (EpicElectrical, TexAgs forum)
          utility: Cooperative website FAQ; virtual site survey eligibility check
        - label: Enrollment
          direct: Online sign-up; REP switch (takes ~2 min per company claims); installation deposit ($295–$995)
          utility: Co-op membership form or EPE program registration; $0 upfront (some programs)
        - label: Active Use
          direct: >-
            Battery backup during outages (<0.5s switchover); monthly bill savings vs. prior provider; app monitoring;
            grid-event battery discharges to 20% floor
          utility: Whole-home backup during outages; utility dispatches battery for peak shaving; homeowner receives $250 (EPE)
        - label: Renewal or Expansion
          direct: >-
            3-year REP contract renewal (guaranteed below-market rate); referral of coworkers/neighbors; potential
            second battery add (50 kWh upgrade); transfer to next homeowner if moving
          utility: Cooperative program auto-continuation; battery system maintained by Base for life of agreement
    approximationNotes: >
      Journey stages are reconstructed from customer testimonials, official process descriptions, and independent
      reviewer analysis. Exact drop-off rates between stages are not publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU029
      - CU031
