      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: ERCOT Revenue Saturation Is an Existential Threat to the Current Multiple
            body: >
              The single most important adverse signal in this chapter is not Base Power's execution — which is
              genuinely impressive — but the structural collapse of ERCOT grid-services revenue. Average annual BESS
              revenue fell from $149/kW in 2023 to $29/kW in 2025 (Modo Energy), an 80% decline driven by a 70× increase
              in installed capacity. At $29/kW, a 25 kWh Base Power battery earns approximately $73/year in
              grid-services revenue — far below the retail margin and lease fee needed to sustain profitable unit
              economics without long payback periods. Unless RTC+B reform materially increases per-kW compensation or
              Base achieves genuine retail margin dominance, the core revenue diversification thesis is currently under
              severe stress. Any investor at the $13B entry price must have a specific, evidenced view on how
              grid-services revenue recovers above $50/kW before this risk resolves.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV031
              - CV033
              - CV037
              - CV038
          - type: callout
            title: The $13B Price Is a Platform Option Premium, Not a Revenue Multiple
            body: >
              Base Power's $13B valuation cannot be rationalised using traditional revenue multiples at any reasonable
              comparable discount rate. It is more accurately understood as a market-implied option on the company
              becoming the dominant residential battery and electricity platform in U.S. deregulated markets — analogous
              to pricing an infrastructure network before it achieves scale. This is not inherently irrational: Sunrun
              was similarly priced ahead of its solar ownership build-out. But it does require investors to price the
              option explicitly, assign realistic probabilities to national-scale outcomes, and accept that the base
              case (at current evidence quality) is a loss at the current Series D entry price. The five top-tier VCs
              who led or co-led all four rounds are not wrong about the potential; they may, however, have priced that
              potential fully.
            calloutType: insight
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV016
              - CV020
              - CV021
          - type: callout
            title: Diligence Gate Before Any Capital Commitment
            body: >
              No capital commitment above $5M is warranted without: (1) data-room access confirming 2026 revenue
              trajectory at or above $50M through Q3 2026; (2) full cap table and preference stack documentation from
              all four rounds; (3) independent Gen 3 manufacturing assessment. Entry price at or below $2.5B is the only
              level at which the base case generates a positive expected return. Entry above $3B without the three data
              points above is speculative.
            calloutType: recommendation
            claimRefs:
              - CV001
