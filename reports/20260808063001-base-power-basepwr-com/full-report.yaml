      - number: '1.5'
        title: Adverse Considerations and Key Risks
        blocks:
          - type: paragraph
            body: >-
              Independent and consumer-oriented sources continue to surface three recurring risk themes. First, Base's
              customer contract model still allows the company to use stored energy for grid or utility value before an
              outage occurs, so backup availability at the exact moment of a blackout is not guaranteed. Citizens
              Utility Board's July 2026 explanation of the Illinois offer explicitly warns consumers that the battery
              may not always have enough charge for longer outages and that long-term switching flexibility is reduced
              by the contract structure.


              Second, valuation risk has increased faster than disclosure quality. The Series D lifted Base's post-money
              valuation to $13 billion less than a year after the $4 billion Series C, yet public evidence on revenue,
              gross margin, burn, and realized unit economics remains incomplete. That creates a widening gap between
              execution optics and underwritable fundamentals.


              Third, geographic expansion now introduces model risk rather than merely ambition risk. Illinois provides
              a live proof point that Base can adapt outside ERCOT, but it also shows that the business model changes
              materially from state to state. A company that looks like a Texas gentailer in one market can become a
              retail-capacity optimizer or utility capacity vendor in another. That adaptability is strategic upside,
              but it weakens any simplistic claim that the Texas model copies cleanly nationwide.
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Rapid Scale in a High-Volatility Market
            body: >
              Base Power deployed >100 MWh of residential battery capacity within roughly 18 months of first
              deployments, qualified for ERCOT's ADER wholesale program, and secured five Texas utility partnerships by
              March 2026. The speed of execution—enabled by residential permitting short-cuts and the Lennar homebuilder
              channel—represents a durable early-mover advantage in distributed storage.
            calloutType: strength
            claimRefs:
              - CO029
              - CO031
              - CO032
              - CO035
          - type: callout
            title: Battery Drain Clause Undermines Backup Value Proposition
            body: >
              Base Power's contracts permit it to discharge customer batteries to 20% charge to sell power to the grid
              during peak demand periods—the exact conditions under which grid outages are most likely. An independent
              DFW electrician review identified this as the "one thing most people miss" and advised pairing Base with a
              supplemental generator for true whole-home protection. This structural tension between the commercial VPP
              use case and the customer's backup expectation is a reputational and churn risk, particularly after a
              high-profile outage event.
            calloutType: risk
            claimRefs:
              - CO036
              - CO037
          - type: callout
            title: Unit Economics Dependent on Volatile ERCOT Arbitrage
            body: >
              Third-party analysis estimates a simple payback period of eight to nine years per 25 kWh unit at current
              pricing, with profitability hinging on sustained wholesale price volatility in ERCOT. As more storage
              assets enter the market, arbitrage spreads may compress. Additionally, prior supply- chain dependence on
              Chinese-manufactured batteries creates tariff exposure that the Austin factory is not yet equipped to
              fully replace.
            calloutType: risk
            claimRefs:
              - CO038
              - CO039
              - CO040
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Base Power's market boundary spans two concentric layers. The outer layer is the U.S. residential energy
              storage market, encompassing hardware (lithium-iron-phosphate battery systems, inverters, controls),
              software-enabled grid services, and retail electricity plans bundled with home battery infrastructure.
              Included spend covers: installed battery systems (capex or subscription), ongoing maintenance and software
              subscriptions, and grid-services revenue shared with homeowners or retained by the aggregator. Excluded
              from Base Power's direct addressable market are utility-scale BESS (grid-scale projects above 1 MW per
              site), commercial and industrial storage systems without residential hosting, and rooftop solar-only
              installations without storage.

              The inner, immediately addressable layer is the ERCOT residential VPP market—specifically the aggregation
              of sub-1 MW home batteries dispatched into ERCOT wholesale energy and ancillary-services markets under the
              Aggregate Distributed Energy Resource (ADER) pilot and successor rules. Texas is the primary operational
              geography, but the broader U.S. deregulated residential market (CAISO, NYISO, PJM, and others) is the
              expansion addressable market as Base Power moves beyond Texas.

              Status-quo substitutes for Base Power's offer include: (a) traditional retail electricity plans with no
              storage, where customers absorb outage risk and volatile summer bills; (b) standalone rooftop solar
              net-metering arrangements, where homeowners earn bill credits but do not have backup power or
              grid-services participation; (c) standalone backup generators (propane/natural gas), which provide outage
              protection but no grid revenue and require fuel; and (d) competing battery programs from Tesla Powerwall
              paired with Tesla Electric, Sunrun VPPs, and emerging ERCOT ADER-qualified aggregators. The primary
              switching cost for residential customers is the installation process and the multi-year battery lifecycle
              commitment—once a battery is installed and enrolled in a VPP program, switching aggregators involves
              hardware logistics and new enrollment steps.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Market Sizing and TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst estimates bracket the U.S. residential energy storage market at materially different
              levels depending on whether they count hardware revenue, lifetime service revenue, or broader energy
              services. P&S Intelligence sized the U.S. residential storage market at $174 million in 2025 growing to
              $604 million by 2030 (CAGR ~28%), capturing hardware-and-services on a narrower perimeter. Emergen
              Research took a broader perimeter—including grid-services contracts and software—and valued the U.S.
              residential segment at $3.5 billion in 2024, projected to reach $15.2 billion by 2034 at a CAGR of 15.9%.
              The discrepancy across estimates arises primarily from the inclusion or exclusion of VPP grid-services
              revenue and subscription monetization paths. As of early 2026, U.S. cumulative residential battery storage
              installations reached approximately 9 GWh, with 3.1 GWh deployed in 2025 alone—a 51% year-over-year
              increase—according to the SEIA/Benchmark Mineral Intelligence Energy Storage Market Outlook Q1 2026.

              For ERCOT specifically, Texas is on track to surpass California as the largest U.S. battery storage market
              in 2026, with grid-scale BESS capacity reaching 14 GW entering 2026, double the 2025 level. Residential
              and distributed storage is a much smaller but fast-growing subset. ERCOT's ADER pilot (which Base Power
              has qualified for) expanded its system-wide cap from 80 MW to 160 MW for energy and 80 MW each for
              non-spin and ECRS in mid-2025. At the Texas household level, battery pricing has fallen to roughly
              $117/kWh—about one-third of 2023 costs—widening the potential addressable base.

              A bottom-up SOM estimate for Base Power in Texas: ERCOT serves approximately 12 million residential
              meters. A 1–2% annual penetration rate (Base Power's stated target) yields 120,000–240,000 homes. At an
              average system of 20 kW (two 11.4 kW/25 kWh batteries) and a $29/month subscription, that translates to
              roughly $42–$84 million in annualized subscription revenue per year of penetration, before grid-services
              revenue. The ADER capacity at 1% penetration across ERCOT would be approximately 2.4 GW of aggregated
              residential battery fleet, well in excess of the current pilot cap, indicating regulatory expansion
              headroom is the binding constraint on market capture rather than demand or hardware costs.

              The global VPP market—Base Power's reference peer group—was valued at approximately $6–7 billion in 2026
              and is expected to reach $11.5 billion in the U.S. alone by 2035, growing at a CAGR of 22.5% for the
              residential segment, according to GMInsights. Contradictory estimates are preserved: the wide dispersion
              across analyst reports (from $4.1B to $6.7B globally for 2026) reflects genuine methodological differences
              in whether "market size" counts VPP platform revenue, DER hardware, or grid-services transaction volume.
            claimRefs:
