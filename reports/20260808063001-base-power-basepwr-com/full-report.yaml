      - number: '3.3'
        title: Capability and Pricing Comparison
        blocks:
          - type: paragraph
            body: |
              Base Power's competitive positioning rests on three structural advantages versus the
              hardware OEM field: asset ownership (Base bears capex, not the consumer), battery
              oversizing (25 kWh vs. Tesla's 13.5 kWh or Enphase's 5 kWh modular units), and
              direct utility partnership integration.

              **Pricing gap:** Base charges $695 (single battery) or $995 (dual) installation plus
              $19/month ($29 for dual) ongoing. GVEC members pay less — $295 or $445 — and Base
              waives the monthly membership fee entirely. The competing hardware-purchase model
              requires $7,500–$13,500 upfront for Tesla Powerwall 3, $6,500–$8,500 for FranklinWH
              aPower 2, or $8,000–$11,000 for Sonnen's retail purchase path. Even after the Oncor
              $4,500 rebate (available in Oncor territory), hardware-buy competitors require a
              consumer investment 5–10× higher than Base's entry price. The expiry of the federal
              residential ITC 25D tax credit at end-2025 makes this gap wider in 2026.

              **Capacity and grid value:** Base's 25 kWh / 11.4 kW battery provides roughly twice
              the energy storage of Tesla Powerwall 3 (13.5 kWh) and five times the capacity of an
              Enphase IQ Battery 5P module. Larger battery capacity allows more energy arbitrage per
              unit, more revenue per node in ERCOT, and more backup duration. A dual-battery Base
              install (50 kWh) delivers up to ~12 hours of backup for average GVEC customers versus
              roughly 3–4 hours for a single Powerwall 3.

              **Utility integration vs. consumer-control models:** Base's model reserves 80% of
              battery capacity for utility dispatch and 20% for homeowner backup by default.
              Competing hardware-buy models give the homeowner full control, which utilities regard
              as a less reliable grid asset. GVEC specifically noted that behind-the-meter assets
              (Base's model) provide transmission-cost-reduction benefits that utility-scale batteries
              registered as generators cannot provide. Sonnen/Solrite offers 10–20% backup reserve
              similar to Base, reflecting the same trade-off. Tesla's VPP gives homeowners opt-out
              capability during outages, which reduces dispatch reliability for grid operators.

              **Software and control stack:** Base claims sub-second telemetry and triple-nines
              uptime for its owned-and-operated fleet. Competitors that rely on homeowner override
              (smart thermostats, Sunrun's customer-controlled systems) face the "DR 1.0" reliability
              critique Base CEO Zach Dell cited explicitly in investor commentary: "Our asset is
              owned by us, it's controlled by us. We have triple nines uptime." AutoGrid and Fluence
              offer comparable software sophistication to utilities but do not own the hardware assets
              themselves, creating execution risk at the homeowner enrollment layer.
            claimRefs:
              - CP017
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
