      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Base Power still has a plausible IPO path because the company now has the ingredients public investors
              recognize: hypergrowth narrative, domestic manufacturing story, AI/data-center adjacency,
              consumer-plus-grid infrastructure positioning, and a blue-chip cap table. But the bar for a successful
              public listing has also risen because a $13 billion private mark now demands much larger revenue, much
              clearer margin disclosure, and more confidence that the Texas/Illinois playbook generalizes.


              Strategic acquisition becomes less likely as a clean exit at the current valuation because most realistic
              strategic buyers would struggle to justify paying above an already aggressive private-market price without
              very strong proof of economics or unique strategic synergies. That means public-market viability matters
              more, not less.


              The diligence asks are correspondingly stricter than before: audited unit economics, state-by-state
              contribution margins, cap-table and preference detail post-Series D, manufacturing throughput and yield,
              and proof that Illinois or a third market can produce attractive returns without leaning on Texas-specific
              assumptions.
