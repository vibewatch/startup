  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >-
      Eight-dimension IC-ready scoring across market opportunity, execution proof, competitive moat, unit economics,
      regulatory risk, valuation, capital intensity, and evidence quality.
    data:
      items:
        - label: Market Opportunity
          note: >-
            Strong: Residential DER/VPP market growing 21%/yr; residential battery enrollment +153% in 2025; AI
            data-center demand tailwind amplifies ERCOT grid stress
        - label: Deployment Execution
          note: 'Strong: 30,000+ homes claimed / 500+ MWh / Illinois launch / 100 batteries per day reported in Aug 2026'
        - label: Business Model Novelty
          note: >-
            Good: Vertically integrated gentailer is structurally differentiated; stacked revenue (retail margin + grid
            services + lease) provides partial floor; retail contract creates durable revenue
        - label: Unit Economics
          note: >-
            Weak–Moderate: Gen 1 payback ranges 3.5–8.5 years depending on ERCOT revenue assumption; conflicting
            estimates; grid-services revenue down 90% from 2023 peak; not independently verified at scale
        - label: Competitive Moat
          note: >-
            Moderate: Network effects and data from aggregated fleet are real but early; Tesla Powerwall, Sunrun
            Battery, and utility-sponsored programmes are credible threats; switching costs embedded in 3-year
            electricity contracts
        - label: Regulatory and Market Risk
          note: >-
            Elevated: ERCOT ancillary revenue collapsed structurally; RTC+B reform is uncertain upside; national
            expansion requires different regulatory relationships; no adverse regulatory event to date but exposure is
            high
        - label: Valuation vs. Evidence
          note: >-
            Weak: ~1083x 2025 revenue estimate and ~186x earlier 2026 projection at the $13B Series D; public comps
            remain far lower and cap-table detail is absent
        - label: Capital Intensity and Financing Risk
          note: >-
            High risk: >$2.5B raised reduces near-term liquidity risk but increases return hurdle and preferred-capital
            overhang
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV020
      - CV021
