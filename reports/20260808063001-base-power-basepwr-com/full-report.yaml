      - number: '3.5'
        title: Status-Quo and Substitute Alternatives
        blocks:
          - type: paragraph
            body: |
              The largest competitive set is not other VPP companies but the status-quo options Texas
              homeowners choose before encountering Base: no backup power (accepting outage risk),
              propane/natural gas standby generators, grid-interactive smart thermostats, and retail
              electricity plans with no storage at all.

              **No-backup status quo:** The majority of Texas residential customers have experienced
              one or more major outage events (Winter Storm Uri 2021, Summer 2023 heat events, Winter
              Storm Fern 2024) but have not installed backup power. The economic barrier for hardware
              purchase is the primary deterrent — Base directly addresses this with its $695 entry
              price versus $15,000+ for comparable generator or battery alternatives.

              **Propane/gas standby generators (Generac, Kohler):** Generac holds ~75% U.S. market
              share in home standby generators. Installed cost ranges from $10,000–$20,000+, with
              ongoing fuel costs during outages and maintenance requirements. Generators can run
              indefinitely if fueled but emit CO and require outdoor siting. Base markets its offering
              as "95% cheaper than similar backup solutions" versus generators for GVEC members.
              During prolonged multi-day outages, generators outperform batteries on duration; for
              typical Texas outages (97%+ under 3 hours based on Base's fleet data), Base's 25 kWh
              battery covers nearly all events.

              **Demand-response programs (Renew Home/OhmConnect, Voltus, Leap):** Renew Home — the
              merged entity of Google's Nest Renew and OhmConnect — is now North America's largest
              residential VPP by enrolled homes, using smart thermostats and controllable loads
              rather than batteries. These programs provide grid value (peak shaving, load shifting)
              without hardware installation burden, but they cannot provide whole-home backup during
              grid outages, which is Base's strongest consumer value proposition. OhmConnect has
              transitioned its Texas customers to Direct Energy and operates under the Renew Home
              platform as of May 2026.

              **Retail electricity plans with time-of-use pricing:** Texas's deregulated market
              (130+ REPs) offers time-of-use, free-nights, and solar buyback plans that allow
              homeowners to partially arbitrage grid price volatility without batteries. As solar
              buyback values decline ("solar orphans"), these plans become less attractive, creating
              the opening Sonnen/Solrite's VPP explicitly addresses. Base as a REP competes directly
              with other Texas REPs for the electricity billing relationship, and its competitive
              rate depends on grid conditions and battery dispatch revenue sharing.

              **Incumbent utilities expanding battery programs:** Co-ops and IOUs that are currently
              Base's partners could theoretically internalize distributed battery programs using
              utility-scale battery procurement plus a DERMS vendor like AutoGrid. GVEC's CEO
              noted that the co-op evaluated "utility-scale, distribution-connected batteries" and
              determined that behind-the-meter assets provide superior transmission-cost reduction
              value — validating Base's model for now, but also signaling that utilities are actively
              evaluating all options.
            claimRefs:
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: ERCOT Revenue Compression Is a Material Threat to Unit Economics
            body: |
              ERCOT battery ancillary and arbitrage revenues have declined 89% from 2023 to 2025
              (Enverus data). Base's estimated unit revenue of ~$2,075/year per 25 kWh battery implies
              an 8–9 year payback at base case conditions — marginal for a capital-intensive business
              with $15M+ in annual employee overhead. A prolonged low-volatility ERCOT environment
              would pressure Base to rely on fixed utility tolling contracts rather than spot market
              revenues, accelerating the shift to the regulated-utility model but requiring longer
              contract tenors than the current 3-year minimum.
            calloutType: risk
            claimRefs:
              - CP025
              - CP026
              - CP028
              - CP029
          - type: callout
            title: Utility Co-Op Partnership Model Creates Durable Distribution Moat
            body: |
              Base's five Texas utility co-op partnerships (CoServ 100 MW, GVEC 50 MW, Bandera,
              Farmers Electric, and others) give it a B2B customer-acquisition channel that hardware
              OEMs cannot easily replicate. GVEC's CEO described behind-the-meter assets as providing
              superior transmission-cost-reduction value versus utility-scale batteries — a regulatory
              and operational validation that Base's model is technically differentiated from a
              pure-hardware approach. No competitor currently holds similar co-op contracts at this
              scale in ERCOT.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP024
          - type: callout
            title: Tesla and Sunrun Are Scale Threats in a Price War Scenario
            body: |
              Both Tesla and Sunrun have pre-existing homeowner channels, in-house or contracted battery
              supply, and regulatory access (ERCOT REP licenses, ADER qualification) that position them
              to undercut Base if VPP economics justify aggressive pricing. An industry analyst noted
              that "it wouldn't take a lot for Tesla or Sunrun to replicate their success" and that
              these companies "will win any price war with Base." Base's $1 B Series C and Austin
              manufacturing strategy are a direct hedge against this scenario, but manufacturing
              execution risk is real for a company founded in 2023.
            calloutType: risk
            claimRefs:
              - CP013
              - CP016
              - CP027
          - type: callout
            title: Sonnen/Solrite VPP Is the Closest Structural Analog and Most Direct Near-Term Rival
            body: |
              Sonnen's SOLRITE VPP launch in February 2026 is structurally the closest competitor to
              Base: battery-owned by the platform, no upfront consumer cost, and ERCOT VPP dispatch
              with a capped backup reserve. The primary difference is scale (10,000 homes vs. Base's
              larger footprint), Sonnen's utility (Shell's balance sheet vs. Base's VC capital), and
              capacity (60 kWh vs. 25 kWh). Both programs target the same 200 MW ADER cap, and Sonnen
              is explicitly targeting 144 MW of it. This is the most direct competitive constraint on
              Base's ERCOT ADER expansion.
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
              - CP025
              - CP026
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Stack
        blocks:
          - type: paragraph
            body: >-
              Base Power now monetizes residential storage through at least five overlapping revenue layers. In
              deregulated Texas territories, the first layer is an installation fee and monthly membership attached to
              company-owned hardware. The second layer is retail electricity margin from serving the home directly. The
              third layer is wholesale/grid-services value from dispatching the aggregated battery fleet during
              expensive or reliability-critical periods. The fourth layer is utility capacity contracting for programs
              such as Austin Energy, El Paso Electric, and CoServ. The fifth, now visible in Illinois, is a
              retail-focused structure that uses batteries to lower capacity and transmission charges across the
              supplier's customer portfolio.


              The important financial implication is that "Base revenue" is no longer synonymous with one ERCOT
              arbitrage play. Texas still appears to be the core earnings engine, but Illinois demonstrates a different
              monetization path in which reducing grid fees can matter as much as selling energy back during scarcity
              events. That should diversify the revenue thesis over time, but it also means investors need
              market-by-market contribution data rather than a single blended story.


              Public pricing remains fragmented. TechCrunch reported a representative Houston-area package of $695
              install, $19/month, and roughly 13.1 cents/kWh for electricity. Citizens Utility Board documented a summer
              2026 Illinois offer with a $95 introductory installation fee for the first 2,000 customers ($295
              thereafter) and a time-of-use plan guaranteed at least 25% below ComEd's price to compare during the
              initial two-year term. These offers are clearly designed to maximize acquisition rather than near-term
              hardware payback.
            claimRefs:
