  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: standard
    summary: >-
      Decision chain from evidence pillars to conditional positive recommendation, tracing market, product, unit
      economics, and valuation inputs.
    data:
      nodes:
        - id: n1
          label: Deployment Velocity (Strong)
          description: 30,000+ homes claimed, 500+ MWh deployed, ~100 batteries/day, Illinois live
        - id: n2
          label: Grid Services Revenue (Adverse)
          description: ERCOT battery revenue down 90% to ~$29/kW in 2025; structural saturation likely persistent through 2026
        - id: n3
          label: Vertical Integration Model (Promising)
          description: Owns/operates batteries + retails electricity; structural CapEx advantage if manufacturing scales
        - id: n4
          label: Manufacturing Execution (Unverified)
          description: City incentive deal fell through March 2026; Gen 3 factory no confirmed lease; domestic cost curve unproven
        - id: n5
          label: National Expansion (Unproven)
          description: Illinois now confirms non-Texas expansion, but state-by-state economics and repeatability remain unproven
        - id: n6
          label: Valuation Signal (Rich)
          description: >-
            $13B post-money; ~1083x 2025 revenue estimate and ~186x prior 2026 projection; public comp support remains
            weak
        - id: n7
          label: Research More / Pass at Current Terms
          description: >-
            Without private diligence access or a lower price, the public record does not support entry at the Series D
            mark
        - id: n8
          label: Required Evidence Gates
          description: Audited unit economics; cap table and preference stack; Gen 3 cost curve; non-ERCOT market plan
      edges:
        - from: n1
          to: n7
          label: supports
        - from: n2
          to: n6
          label: pressures
        - from: n3
          to: n7
          label: supports conditionally
        - from: n4
          to: n6
          label: raises doubt
        - from: n5
          to: n6
          label: limits bull case
        - from: n6
          to: n7
          label: constrains entry
        - from: n8
          to: n7
          label: gates entry
    claimRefs:
