      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity vs. Revenue Scale Creates Structural Dependency on Continued Equity Financing
            body: >-
              With ~$1.3 billion raised against $12 million in 2025 revenue, Base Power's capital efficiency ratio is
              approximately 108:1—meaning the company has deployed over $100 in investor capital for every $1 of annual
              revenue. This ratio is characteristic of early-stage hardware platforms and not inherently disqualifying,
              but it means continued equity access at favorable valuations is a prerequisite for near-term survival. Any
              deterioration in investor appetite—driven by interest rate changes, policy risk (ITC phase-out or FEOC
              restrictions), or missed revenue targets—could trigger a financing crisis before the fleet reaches
              cash-flow breakeven.
            calloutType: risk
            claimRefs:
              - CI005
              - CI016
              - CI017
              - CI032
          - type: callout
            title: Wholesale Arbitrage Revenue Is the Payback Engine but Remains Unverified and Market-Dependent
            body: >-
              The 3.5-year payback period attributed to Base Power's unit economics depends on wholesale arbitrage being
              the dominant revenue contributor—a stream that is unverified at the unit level and dependent on continued
              ERCOT price volatility, ADER program maturation, and QSE cost structures. As of mid-2025, only 15 MW of
              ADER capacity was actively dispatched across all participants, and the break-even scale for a single
              aggregation is approximately 15–20 MW. If ERCOT grid conditions become less volatile due to new
              transmission or generation additions, or if regulatory changes constrain ADER participation, the arbitrage
              layer could compress materially.
            calloutType: risk
            claimRefs:
              - CI007
              - CI027
              - CI028
              - CI029
          - type: callout
            title: Utility Tolling Agreements Create a Fourth Revenue Layer That Could Improve Fleet Economics
            body: >-
              The Austin Energy deal represents a strategic template: Base Power receives stable, non-volatile capacity
              payments on top of its existing retail and arbitrage revenues for the same hardware. At $4.08 million per
              year for 40 MW, the implied rate is $8.50/kW-month, which provides modest but stable incremental yield. If
              replicated with additional municipal utilities and cooperatives in ERCOT, tolling agreements could
              contribute $20–$40 million in annual revenue at 200–400 MW of contracted capacity, materially improving
              the blended capital payback without requiring additional hardware deployment.
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI036
          - type: callout
            title: $70 Million 2026 Revenue Projection Assumes Successful Gen 3 Manufacturing Ramp
            body: >-
              The company's $70 million 2026 revenue projection is contingent on scaling Gen 3 battery production at
              Factory One. The CEO has publicly acknowledged the manufacturing ramp will be "difficult" through
              mid-2026. If Gen 3 production falls short of targets, the deployment pace of 20 MW/month cannot be
              sustained on imported or contracted hardware without significant cost impact. A 50% shortfall in 2026
              installations would imply approximately $40–$45 million in revenue versus the $70 million target,
              potentially triggering the need for an earlier equity raise than the Series C runway would otherwise
              support.
            calloutType: assumption
            claimRefs:
              - CI006
              - CI022
              - CI032
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Battery Hardware and Product Portfolio
        blocks:
          - type: paragraph
            body: >-
              Base Power's current flagship hardware is Base Core, a company-manufactured residential battery launched
              in August 2026. The system is available in two configurations: a 39.2 kWh single-cabinet unit and a 78.4
              kWh dual-Core configuration. Trade coverage consistently describes Core as one of the largest
              single-cabinet residential batteries on the U.S. market.


              The Core system is built around lithium iron phosphate (LFP) chemistry and is designed for whole-home
              backup plus grid participation. Public launch coverage says the battery installs in under an hour, is
              engineered for extreme weather operation from -22°F to 122°F, includes a built-in generator port, and can
              provide approximately 36 hours of backup from the 39.2 kWh configuration under Base's modeled residential
              usage assumptions. Solar Power World reported at least UL 1973 and UL 9540 certifications for the new
              system.


              Base's product stack now spans more than one operating model. In Texas deregulated territories the battery
              is paired with Base-supplied electricity; in Illinois ComEd territory it is paired with a retail electric
              supply offer designed around time-of-use pricing and avoided capacity/transmission charges; and in
              utility-partner programs the battery can be hosted by the customer while dispatch control sits with the
              utility. That breadth is strategically useful, but it means "the product" is as much a
              control-and-contract system as a battery cabinet.
            claimRefs:
