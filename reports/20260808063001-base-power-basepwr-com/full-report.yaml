      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >-
              Base Power's market has three distinct buyer-user-payer relationships, each with different adoption
              triggers and budget ownership.

              The first and primary segment is the Texas residential homeowner in a deregulated ERCOT market. This
              customer is simultaneously the user (who benefits from outage protection and bill smoothing) and the payer
              (who chooses between competing retail electricity providers on PowerToChoose.org). The key adoption
              trigger is outage anxiety—intensified by Winter Storm Uri (2021) and recurring summer peaks—combined with
              electricity bill volatility. The average Texas residential bill reached $174/month in early 2026 at 15.41
              cents/kWh, with rates rising 6.4% year-over-year. For this segment, Base Power's $19–$29/month
              subscription plus one-time installation fee ($695–$995) is positioned as an insurance product against both
              outages and high summer bills.

              The second segment is the electric utility or cooperative that partners with Base Power to deploy
              utility-controlled residential BESS. Here the payer is the utility (capacity deferral value), the user is
              the homeowner (backup power), and the buyer decision-maker is the utility executive responsible for
              resource planning. Adoption is triggered by load growth, infrastructure constraints, and ERCOT summer
              reliability requirements. CoServ (330,000+ meters, North Texas) and El Paso Electric (465,000 customers)
              represent this segment; the El Paso Electric 10 MW pilot and CoServ 100 MW program are the two largest
              live instances. The budget owner in this segment is the utility's capital planning team, and the economic
              rationale is capacity deferral versus new generation build or transmission investment.

              A third, nascent segment consists of homebuilders—such as Lennar—who seek to offer grid-resilient homes as
              a differentiation feature in new construction. Here the builder acts as a distribution channel partner,
              the homeowner is the ultimate user and long-term payer, and the adoption trigger is competitive
              differentiation in the home sales market. This channel reduces Base Power's customer acquisition cost and
              extends its geographic reach.
            claimRefs:
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
