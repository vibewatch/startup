      Exit multiples: bear 8–10x on $30–50M 2027E revenue; base 15–20x on $100–130M; bull 20–25x on $250M. Probability
      weights: bull 20%, base 45%, bear 35%. Preference stack and liquidation terms not publicly disclosed; returns
      could be further impaired by senior preferred overhang.
