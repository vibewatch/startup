      - number: '4.4'
        title: Financial Gaps and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              Public evidence remains strongest on pricing examples, funding events, deployment pace, and the basic
              business-model mechanics. It remains weakest on everything required to convert a fast-growing hardware
              fleet into a reliable return model: realized revenue per deployed battery, blended retail margin after
              hedging, contribution margin by state, battery degradation reserve, service labor cost, and the
              interaction between utility contracts and residential customer economics.


              The August 2026 Series D sharpens these diligence gaps because the valuation increased faster than
              disclosure quality. Public observers can now see a 30,000+ home claim, a 500+ MWh fleet claim, and a 13
              billion dollar post-money mark, but they still cannot independently test whether the marginal Illinois
              customer, the marginal Texas customer, and the marginal utility-hosted battery generate comparable
              returns.


              Put differently: Base no longer lacks evidence of demand. It lacks enough evidence of financial quality.
              Any investor underwriting the current round needs data-room access to cohort economics, state-by-state
              monetization, factory throughput and yield, warranty assumptions, and the capital structure behind more
              than $2.5 billion of invested capital.
            claimRefs:
              - CI026
              - CI027
              - CI028
              - CI029
              - CI030
