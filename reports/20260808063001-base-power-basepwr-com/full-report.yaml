            body: >-
              The strongest current adoption signal is the company homepage itself: the live site fetched in this run
              says more than 30,000 homes are powered by Base. That is a marketing claim, not an audited customer count,
              but it represents a step-change from the 10,000+ milestone visible earlier in 2026. August 2026 launch
