  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ERCOT grid-services revenue collapse
        - Revenue falls below $20/kW/year by Q4 2026
        - >-
          Unit payback exceeds useful battery life (~10 years); stacked revenue model breaks; 2026 projections
          unachievable
        - Exit or reduce position; treat as bear-case confirmation
      - - Gen 3 manufacturing cost overrun
        - Net battery cost per unit remains above $10,000 by end of 2026
        - >-
          Signals factory execution failure; capital intensity multiplies with national scale; $1.3B deployed may be
          insufficient
        - Pause co-invest; demand manufacturing audit before any follow-on
      - - National expansion stalls
        - No confirmed commercial deployment outside ERCOT by Q4 2026
        - >-
          Bull-case revenue growth requires multi-state expansion; ERCOT-only caps 2027 revenue below $50M at current
          install rate
        - Downgrade recommendation from watchlist to pass
      - - Churn acceleration
        - Customer churn exceeds 5% in any 12-month cohort
        - >-
          Revenue durability questioned; retail electricity contract enforcement risk; competitive alternatives erode
          model
        - Deep customer-level diligence; may indicate structural product-market fit limits
      - - Down-round or stressed financing
        - Any material primary raise below the Series D mark or with unusually restrictive structure
        - >-
          Would signal that operating progress is not converting into durable capital-markets confidence at the current
          valuation
        - Re-underwrite immediately; preference stack and common-equity outcome could worsen materially
      - - Regulatory reversal in ERCOT ADER or VPP compensation
        - PUCT modification reducing ADER program participation or compensation rates
        - >-
          Direct revenue impact on the primary grid-services revenue layer; affects ERCOT economics model for all
          customers
        - Scenario analysis must be rerun; regulatory risk premium must be added to discount rate
    notes: >-
      Thresholds are judgment-based and derived from GreenCarFuture unit economics analysis, Modo Energy ERCOT revenue
      projections, and comparable capital intensity studies. Monitoring requires ongoing access to ERCOT market data and
      company financials.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV018
      - CV029
      - CV031
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Unit economics across full cohort
        - >-
          Audited ERCOT revenue per kW per battery, monthly retail margin per customer, and blended all-in cost per
          deployed MWh at current (not peak) market rates
        - >-
          Current public estimates (Sacra, GreenCarFuture) diverge significantly; 8.5-year vs 3.5-year payback range
          makes valuation completely indeterminate
        - Request data-room access; cross-check with ERCOT settlement data and utility billing records
      - - Cap table and preference stack
        - >-
          Full cap table post-Series D, including all seniority, participation, anti-dilution, and any asset-level
          financing
        - At $13B headline value with >$2.5B raised, waterfall economics are impossible to assess without this
        - Legal review plus investor data-room access
      - - Gen 3 manufacturing programme
        - >-
          Signed facility lease or construction contract, equipment procurement timeline, target throughput (MWh/year),
          and per-unit cost curve to 2027
        - >-
          Entire bull case and cost-reduction thesis depends on this; city incentive collapse and no confirmed factory
          as of May 2026 are material adverse signals
        - Site visit; independent manufacturing consultant review; TDLR registration data
      - - National expansion regulatory map
        - >-
          Market entry plan for at least two non-ERCOT retail-choice states, including regulatory requirements,
          interconnection rules, and utility partnership status
        - >-
          ERCOT deregulation is unique; PJM, ComEd, and NY market rules differ materially and may require different
          models or longer customer acquisition timelines
        - Regulatory counsel in target states; market entry feasibility study
      - - Cohort retention curves
        - >-
          Customer-level churn and retention data by geography, installation cohort, and customer segment (new build vs.
          retrofit)
        - >-
          Single reported customer loss (August 2025) is insufficient for statistical assessment; national expansion
          makes cohort retention the primary indicator of LTV
        - Data-room CRM and billing data; independent survey of 50+ customers across cohorts
      - - Competitive response preparedness
        - >-
          Evidence of defensibility against Tesla, Sunrun, utility-sponsored battery programs, and new Illinois-style
          suppliers
        - At $13B, even modest pricing pressure or slower expansion can destroy expected returns
        - Competitive intelligence and state-by-state customer interviews
    notes: >-
      All diligence asks are mandatory before any investment above $50M. Items 1 and 2 (unit economics and cap table)
      are gating — investment should not proceed without them regardless of round valuation.
