      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: ERCOT Ancillary Revenue Collapse Reshapes VPP Economics
            body: >-
              ERCOT grid-scale battery revenue fell roughly 90% from $149/kW (2023) to approximately $17/kW projected
              for 2025 (Enverus). Ancillary services dropped from 84% to 48% of BESS revenue over the same period. While
              residential VPPs benefit from customer bill-smoothing value independent of wholesale prices, Base Power's
              grid-services revenue upside is materially compressed in the current ERCOT environment. Scarcity events
              remain highly variable; the 2026 summer peak will be a key test of the revenue model.
            calloutType: insight
            claimRefs:
              - CM027
              - CM028
          - type: callout
            title: Contradictory Market Sizing Estimates Signal High Uncertainty
            body: >-
              U.S. residential storage TAM estimates span two orders of magnitude across analyst reports—from $174
              million (P&S Intelligence, 2025, hardware-only) to $3.5 billion (Emergen Research, 2024, broader
              perimeter)—depending on whether VPP grid-services revenue, subscription monetization, and utility capacity
              contracts are counted. Investors should not use a single "large market" estimate; the relevant addressable
              market for Base Power's current model is closer to the ERCOT SOM ($42–$84M/yr at 1% penetration) than to
              the $3.5B U.S. headline.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM031
          - type: callout
            title: IRA 30% ITC Provides Durable Tailwind Through 2032
            body: >-
              The Inflation Reduction Act's 30% residential battery Investment Tax Credit applies to standalone battery
              systems (≥3 kWh) installed from 2023 through at least 2032, regardless of solar pairing. This
              substantially reduces the effective hardware cost for residential battery deployment and supports Base
              Power's economics on systems it installs. Domestic manufacturing (Base Power's planned Austin factory) may
              also qualify for additional IRA manufacturing credits, potentially further improving margins.
            calloutType: strength
            claimRefs:
              - CM023
              - CM024
          - type: callout
            title: ERCOT Summer 2026 Scarcity Events Are a Material Revenue Variable
            body: >-
              Base Power's subscription model relies in part on grid-services revenue from ERCOT wholesale markets to
              subsidize low customer prices. Historically, extreme summer heat events (2023: $5,000/MWh peak prices)
              generated outsized BESS revenue concentrated in just a few days. If summer 2026 is mild, grid-services
              revenue will be minimal, testing the model's standalone subscription economics. This is an open diligence
              question that requires a summer 2026 post-mortem.
            calloutType: assumption
            claimRefs:
              - CM026
              - CM027
              - CM029
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              Base Power occupies an unusual position in the residential energy storage market: it is
              simultaneously an asset owner, a retail electricity provider (REP), a software platform,
              and a utility services company. This vertical integration means its competitive landscape
              spans four distinct clusters.

              **Direct VPP aggregators and battery-as-a-service providers** are the closest substitutes
              because they pursue the same home — deploying batteries to capture grid arbitrage revenue
              while offering homeowners backup value at low out-of-pocket cost. Sonnen (Shell subsidiary)
              and its Texas retail partner SOLRITE Energy launched a battery-only VPP in ERCOT in
              February 2026 offering 60 kWh of storage for $20/month with an "all-in" retail rate of
              12¢/kWh — directly overlapping Base's $19–$29/month membership model. Sunrun (NASDAQ:
              RUN), the largest U.S. residential solar-plus-storage company, is building a 1 GW VPP in
              Texas through a multi-year partnership with NRG/Reliant and a separate battery aggregation
              program with Vistra/TXU Energy. As of 2026 Sunrun has deployed more than 116,000 storage
              systems nationally and the CalReady VPP delivered 51 MW peak to California's grid —
              validating the residential aggregation model but also making Sunrun a direct competitor for
              Texas utility co-op bandwidth and homeowner enrollment.

              **Hardware OEMs competing for the same installation slot** include Tesla (Powerwall 3),
              Enphase (IQ Battery 5P), Generac (PWRcell), LG Energy Solution (RESU Prime), and
              FranklinWH (aPower 2). These companies sell through third-party installers rather than
              owning the asset and operating it directly. Tesla additionally operates as a REP through
              Tesla Electric and runs its own VPP via Autobidder, making it a hybrid OEM+aggregator
              competitor in ERCOT. Tesla Powerwall 3 carries 13.5 kWh vs Base's 25 kWh per unit,
              and Tesla's installed cost in Texas is $10,000–$13,500 per unit versus Base's $695
              installation fee — a meaningful consumer economics advantage for Base.

              **Demand-response and smart-thermostat substitutes** compete for the grid-services value
              stack without deploying batteries. Renew Home (formed from the merger of Google's Nest
              Renew and OhmConnect) is North America's largest residential VPP by enrolled homes,
              relying on smart thermostats, smart plugs, water heaters, and EVs. As of May 2026,
              OhmConnect has transitioned Texas customers to Direct Energy and operates under the
              Renew Home brand. These platforms compete for the same ERCOT ADER pilot capacity cap
              (200 MW aggregate) and for homeowner attention, though they cannot provide whole-home
              backup during outages — a core differentiator for Base.

              **Status-quo substitutes and the incumbent grid** remain the dominant alternative. Most
              Texas homeowners have no backup power at all, accepting outage risk. Propane or natural
              gas standby generators (from Generac and Kohler) are the traditional resilience option,
              with installed costs exceeding $15,000 — a price gap Base exploits with its $695 entry
              point. Incumbents like NRG/Reliant and TXU/Vistra serve 31 million Texas residents
              through 130+ REPs; they can theoretically bundle battery programs in-house but currently
              prefer to partner with aggregators (Sunrun, Renew Home, Base) rather than own distributed
              hardware directly.
