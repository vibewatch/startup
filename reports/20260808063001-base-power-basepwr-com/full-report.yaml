      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest growth driver for Base Power's market is the confluence of structural demand growth in Texas
              and regulatory support for residential VPP monetization. ERCOT electricity demand is rising sharply due to
              population growth, data center buildout, and electrification—prompting state regulators to both streamline
              residential battery permitting and expand the ADER pilot. The IRA's 30% federal Investment Tax Credit for
              standalone residential battery storage (in force through at least 2032) lowers the effective cost of
              battery procurement by nearly a third and directly improves Base Power's unit economics on hardware.

              FERC Order 2222, finalized in 2020 and moving into advanced implementation stages by 2026, removes
              barriers for aggregated DER participation in wholesale markets across FERC-jurisdictional ISOs (not ERCOT,
              which is state-level). While Base Power's current Texas market is not FERC-jurisdictional, Order 2222
              creates the national template for the expansion markets Base Power intends to enter. Within ERCOT, the
              Public Utility Commission of Texas (PUCT)-overseen ADER pilot serves the same function, with Phase 3
              expanding the cap to 160/80/80 MW in mid-2025.

              Key constraints include: (1) ERCOT grid-scale BESS revenue compression—average battery revenue fell from
              $149/kW in 2023 to approximately $17/kW projected for 2025, reducing the grid-services revenue pool that
              residential VPPs can tap; (2) switching cost and enrollment friction for homeowners, who must commit to
              multi-year battery lifecycle agreements; (3) IRA policy risk under a shifting federal administration,
              which could curtail the 30% ITC or tariff upstream battery components; (4) capital intensity of rapid
              deployment—deploying 100 MW of residential storage requires hardware, labor, and balance-sheet financing
              at scale; and (5) interoperability and telemetry requirements under ERCOT's 2-second ADER telemetry
              mandate, which raises the technical bar for aggregators.

              A material adverse signal: ESS News and Enverus reported in late 2025 that ERCOT BESS operators posted
              year-to-date profitability below 2.2%, and that energy arbitrage has not offset the collapse in ancillary
              service prices. This directly constrains the grid-services revenue component that Base Power can credit
              against customer bills to maintain its competitive subscription price. If scarcity events do not
              materialize in the 2026 summer peak, Base Power's revenue model will face margin pressure.
            claimRefs:
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
