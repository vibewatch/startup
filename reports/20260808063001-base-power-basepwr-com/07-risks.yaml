    - High — product liability, reputational damage, potential recalls
    - No public safety certifications for Base Power's proprietary hardware confirmed; CPSC recall process exposure
  - - Cloud platform cyberattack disabling fleet dispatch
    - Low–Medium
    - Critical
    - Early — no public cybersecurity framework disclosed
    - High — grid reliability event, reputational catastrophe, ERCOT penalties
    - No public SOC 2 or equivalent security certification; incident response plan not disclosed
  - - SOC non-compliance — battery fails to maintain required state of charge under NPRR 1186
    - Medium
    - High
    - Medium — dispatch software and telemetry systems
    - Material — $25K/5-min penalty; scales with fleet size
    - Telemetry system reliability under peak demand not independently verified
  - - Battery degradation — accelerated capacity loss from daily grid-trading cycles
    - Medium
    - High
    - Low–Medium — LFP chemistry handles cycles well but no public degradation data
    - Material — warranty replacement cost, customer satisfaction, unit economics
    - No published battery degradation curves or warranty cost modeling
  - - Extended grid outage — battery depleted by grid trading, unavailable for backup
    - Medium
    - High
    - Low — 20% SOC floor is the only protection; no pre-outage forecast dispatch halt
    - Material — customer harm, BBB/PUCT complaints, class-action litigation risk
    - No contractual SLA disclosed for backup availability during declared grid emergencies
  - - Installer quality failure — improper installation causing safety or performance issue
    - Low–Medium
    - Medium
