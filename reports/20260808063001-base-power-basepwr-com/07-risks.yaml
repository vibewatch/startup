- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Failure Mode
  - Likelihood
  - Severity
  - Mitigation Maturity
  - Residual Exposure
  - Unresolved Gap
  rows:
  - - Battery fire / thermal runaway at customer home
    - Low
    - Critical
