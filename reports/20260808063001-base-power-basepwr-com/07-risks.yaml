  rows:
  - - ERCOT NPRR 1186 — Battery SOC compliance & penalties up to $25K/5-min interval
    - ERCOT / PUCT
    - Active (effective 2024-06-27); RTC+B supersedes some provisions (Dec 2025)
    - Medium
    - High
    - LFP chemistry with larger capacity buffers; sophisticated dispatch software; ADER portfolio diversification
    - Material — penalty exposure scales with fleet size; SOC management errors under peak conditions
    - Review ERCOT SOC telemetry logs and compliance records; confirm no enforcement actions to date
  - - PUCT REP License — Annual/semiannual reports, letter of credit, customer complaints
    - PUCT Texas
    - Active; required annual report by March 5 and semiannual by August 15
    - Low
    - High
    - Regular compliance filings; dedicated compliance counsel; letter of credit maintained
    - Material — license suspension would halt customer acquisition and revenue
    - Confirm PUCT docket filings current; verify letter of credit status and size vs. ESI ID count
  - - ERCOT ADER Pilot — Pilot termination or capacity cap freeze
    - ERCOT / PUCT (Project 53911)
    - Active pilot; capacity raised to 200 MW (Oct 2025); 50% QSE concentration limit applies
    - Medium
    - Critical
    - Diversify revenue to include energy arbitrage, bilateral contracts, and non-ADER retail margin
    - High — pilot dissolution removes primary wholesale revenue mechanism
    - Monitor PUCT Project 53911 docket; confirm Base Power ADER registration status
  - - Interconnection Cost Allowance (PUCT Rule 25.195 amendment)
    - PUCT Texas
    - Effective Jan 1, 2026; $14M allowance ≤138 kV; excess assigned to resource owner
    - Low–Medium
    - Medium
    - Domestic manufacturing and co-location strategy reduces transmission upgrade needs
    - Minor to medium — applies only to projects with new grid-level interconnections
    - Confirm whether Base Power's aggregated fleet requires new transmission-level SGIAs
  - - NERC Inverter-Based Resource Compliance — Texas RE audits
    - NERC / Texas RE
    - Active focus area 2024–2026; audits include spot checks and investigations
    - Medium
    - Medium
    - Regular firmware updates; compliance documentation; ERCOT telemetry adherence
    - Moderate — compliance program cost and documentation burden scales with fleet
    - Request Texas RE compliance engagement history and any open deficiencies for Base Power
  - - House Bill 1343 — Proposed mandatory state permits for battery storage
    - Texas Legislature
    - Proposed; monitoring required; not enacted as of May 2026
    - Medium
    - Medium
    - Engage Texas energy law counsel to track legislative status
    - Moderate — if enacted, retrofit permitting for existing installations may be required
    - Track Texas legislature session for HB 1343 progress; model permitting cost impact
  - - PUCT customer complaint enforcement — Misrepresentation of backup duration
    - PUCT Texas
    - No known enforcement action; community complaints documented on public forums
    - Low–Medium
    - Medium
    - Clearer marketing disclaimers about 20% SOC floor and actual backup hours under load
    - Moderate — patterns of complaints could trigger PUCT inquiry or attorney general action
    - Review Base Power marketing materials for accuracy; assess PUCT complaint database
  notes: Severity ordered high to low. Likelihood = Low/Medium/High based on observable precedent. Residual exposure assumes current mitigations in place. No Base Power litigation or PUCT enforcement action identified as of May 2026.
