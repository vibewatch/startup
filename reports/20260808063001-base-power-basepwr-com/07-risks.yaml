callouts:
- calloutType: risk
  title: ERCOT Revenue Compression Is a Near-Term Business Model Threat
  body: BESS ancillary revenues in ERCOT fell 90% between 2023 and 2025, and most operators are posting profitability below 2.2%. Base Power's below-market customer pricing depends on sustained grid-trading revenues. If RTC+B and market saturation continue to compress margins, the economics of subsidizing customer rates through battery arbitrage weaken materially. The next 12–18 months of operational data under RTC+B are critical to validating the model.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
- calloutType: risk
  title: ADER Pilot Dependency Is the Single Highest-Concentration Regulatory Risk
  body: Base Power's wholesale market participation is contingent on the ERCOT ADER pilot program, which is a PUCT-authorized pilot with no permanent statutory status. PUCT or ERCOT can modify participation rules, freeze capacity, or terminate the pilot. A 50% QSE concentration cap means that as Base Power's fleet grows, it will hit the ceiling at 100 MW of ADER capacity (50% of 200 MW total). ADER dissolution or permanent capacity freeze would remove the company's primary differentiated revenue mechanism and is the single largest kill-criterion risk in this risk universe.
  claimRefs:
  - CR005
  - CR006
  - CR040
- calloutType: risk
  title: Customer Conflict of Interest in Battery Dispatch Creates Litigation and Regulatory Exposure
  body: Base Power can legally drain customer batteries to 20% SOC for grid trading. Community forums document customer surprise and dissatisfaction when backup power is not fully available during outages. If a severe weather event (comparable to Winter Storm Uri) leaves Base Power customers without expected backup power while batteries were dispatched for grid revenue, the reputational damage could be severe and PUCT complaints or class-action litigation could follow. This is the clearest adverse customer-impact scenario and should be a priority diligence focus.
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021
- calloutType: recommendation
