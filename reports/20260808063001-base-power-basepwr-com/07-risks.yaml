- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - ADER pilot dissolution or capacity freeze
    - PUCT Project 53911 filings; ERCOT market notices
    - Pilot termination notice or cap frozen below Base Power's registered capacity for 2+ quarters
    - Thesis break — wholesale revenue mechanism eliminated; reassess business model viability
  - - ERCOT ancillary revenue compression below retail cost basis
    - Monthly ERCOT BESS revenue index (Enverus/Modo Energy)
    - Average BESS revenue < $10/kW-year for 2 consecutive quarters
    - Material — monitor whether arbitrage or RTC+B revenues compensate; margin analysis required
  - - PUCT REP license enforcement or customer complaint escalation
    - PUCT docket search for Base Power docket; BBB complaint count
    - PUCT opens formal complaint proceeding or issues notice of violation
    - Thesis break risk — REP license suspension halts customer growth; immediate diligence
  - - Battery fire incident at customer home
    - News monitoring; CPSC Saferproducts.gov filings; NFPA reports
    - Any confirmed thermal runaway event at a Base Power-installed site
    - Material trigger — immediate investigation; product liability and recall risk assessment
  - - Cybersecurity breach of fleet management platform
    - SOC 2 audit status; NERC compliance engagement; public incident disclosure
    - Confirmed unauthorized access to fleet management system or mass dispatch event
    - Critical — grid reliability event; ERCOT penalties; reputational damage; regulatory inquiry
  - - Factory One fails to meet deployment capacity targets
    - Monthly unit deployment rate (MWh deployed) vs. plan
    - Deployment rate < 10 MWh/month for 3 consecutive months after factory commissioning
    - Material — affects supply chain independence thesis; revert to imported hardware sourcing
  - - Key executive departure (CEO or COO)
    - LinkedIn/PR monitoring; investor communications
    - CEO or COO departure without planned succession
    - Thesis risk — assess successor quality and institutional knowledge transfer
  - - Fixed-rate contract losses exceed reserve buffer
    - Quarterly financial disclosures or investor reporting (if any)
    - REP margin turns negative for 2+ consecutive quarters
    - Thesis break — fixed-rate model unsustainable at current wholesale price environment
  notes: Kill criteria are defined as events that would require immediate thesis reassessment. Action implications range from 'monitor' (low severity) to 'thesis break' (high severity requiring divestment consideration).
