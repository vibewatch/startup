  title: Risks
  summary: Base Power's main risk set is now easier to rank. Market-rule and revenue volatility in ERCOT still matter, but the sharper risk at the current stage is that a $13 billion valuation, 500+ MWh fleet, and multi-state rollout have outpaced public disclosure on unit economics, reliability auditing, and customer durability. Illinois expansion reduces the pure ERCOT-concentration story while introducing fresh consumer-protection and contract-complexity questions. No litigation or enforcement action specific to Base was identified in public sources reviewed during this run.
sections:
- id: regulatory-market-risk
  title: Regulatory and Market-Rule Risk
  body: |-
    Base Power operates at the intersection of three regulatory regimes—ERCOT market rules, PUCT retail-electric-provider (REP) certification, and the ADER pilot program—each of which can materially alter the company's economics or operational permissions unilaterally.
    ERCOT NPRR 1186, approved April 11, 2024 (effective June 27, 2024), requires Energy Storage Resources providing ancillary services to maintain a state of charge sufficient to fulfil the full one-hour obligation period. Battery operators who fail to maintain the required SOC are exposed to enforcement actions with penalties up to $25,000 per five-minute interval, a penalty regime that critics characterize as discriminatory because thermal generators face penalties only upon actual delivery failure. The PUCT initially remanded NPRR 1186 in January 2024 citing concerns that the rule's enforcement provisions would chill storage investment by penalizing batteries even when they had fully complied with their dispatch obligation; the commission approved a softened version in April 2024. Industry participants such as Eolian warned that NPRR 1186 will "substantially reduce energy storage participation in the ancillary markets and reduce competition." The subsequent RTC+B (Real-Time Co-optimization plus Batteries) launch in December 2025 replaced this interim framework with co-optimized dispatch, but introduced new algorithmic sophistication requirements and compressed structural-alpha revenue that depended on market-design seams.
    The ADER (Aggregated Distributed Energy Resource) pilot, through which Base Power pools residential batteries for wholesale market participation, remains a pilot program governed by PUCT Project No. 53911. As of October 2025, ERCOT raised the total system-wide ADER capacity cap from 160 MW to 200 MW and the QSE concentration limit from 20% to 50%. However, because ADER is a pilot, ERCOT and PUCT retain authority to modify participation rules, cap limits, or terminate the pilot with relatively short notice—a risk that directly threatens Base Power's primary revenue-generation mechanism. Base Power has been reported to participate in the ADER pilot, but no publicly available confirmation from PUCT Project No. 53911 filings has been identified.
    As a licensed Texas REP, Base Power must file annual reports by March 5 and semiannual reports by August 15, maintain letters of credit ($750,000 for fewer than 50,000 ESI IDs; $1.5 million above that), and respond to PUCT-filed customer complaints within 15 days. PUCT has authority to suspend or revoke a REP license for violations of the Public Utility Regulatory Act or commission rules. Post-Uri legislative reforms (SB 6, SB 7, SB 1287 and related bills) have also introduced a more active PUCT oversight posture, with ERCOT Protocol Revisions now requiring PUCT approval.
    Interconnection cost risk is also increasing: PUCT's amended rule 16 TAC §25.195 (effective January 1, 2026) assigns interconnection costs exceeding $14 million (≤138 kV) or $20 million (above 138 kV) directly to the connecting generator resource, creating cost exposure as Base Power scales its factory-direct hardware fleet. NERC's Texas RE has identified inverter-based resource compliance—including batteries—as a priority audit area for 2026, adding compliance cost and documentation burden.
