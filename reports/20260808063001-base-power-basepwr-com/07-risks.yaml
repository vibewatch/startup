- id: operational-safety-people-risk
  title: Operational, Safety, Cyber, and Execution Risk
  body: |-
    Base Power's leasing model creates a structural customer conflict of interest: the company can legally dispatch customer batteries to a 20% state of charge to sell power to the ERCOT wholesale market, meaning the battery may not be fully charged when a grid outage occurs. Consumer forums and electrician advisory sites document this risk explicitly: under full-AC load, a 25 kWh battery provides only 2-5 hours of backup from a full charge, and far less if the battery has been recently dispatched. Community forum discussions indicate that some customers felt misled about backup duration guarantees and that the 20% floor reduces the effective backup ceiling materially. If a future extreme-weather event leaves customers without backup power despite expectations of coverage, the reputational and regulatory complaint risk escalates sharply.
    Battery fire safety is a genuine but manageable risk. Base Power uses LFP (Lithium Iron Phosphate) chemistry, which has significantly lower thermal-runaway risk than NMC lithium-ion cells, but is not immune to fire. The CPSC issued a recall in 2026 for approximately 10,500 Tesla Powerwall 2 systems due to overheating, fire, and burn hazards from a third-party cell defect—demonstrating that even well-engineered residential battery systems can require recalls. Fire safety permitting requirements vary by Texas county, creating a decentralized compliance burden. Clean Energy Group notes that properly installed battery storage is safe but that thermal runaway produces intense fires with toxic gases that are difficult to suppress. As Base Power scales to tens of thousands of homes with daily cycling, product liability exposure increases proportionally.
    Cybersecurity risk is elevated for cloud-managed residential battery fleets. NERC's Howard Gugel noted that mass software updates to inverter-based resources represent a dual concern: operational flexibility vs. catastrophic grid impact if the update channel is compromised. EPRI researcher Sai Ram Ganti warned that batteries with two-way cloud connections can be remotely operated by vendors, creating a significant threat if the cloud server is compromised. Base Power's fleet management model depends on this two-way cloud connectivity for real-time SOC management and ERCOT dispatch. A coordinated cyberattack on Base Power's fleet management platform could disable thousands of customer batteries simultaneously, constituting a significant grid reliability event and reputational catastrophe. The Brattle/Dragos BESS cybersecurity report (December 2025) found that U.S. BESS deployment is growing 30% annually but that cybersecurity standards and regulatory requirements have not kept pace.
    Installer and supply chain risk is material as Base Power scales nationally. U.S. residential battery installer capacity is under strain: specialist labor is in high demand, and tariffs on Chinese battery cells have compressed inventory availability and pushed costs upward. A forecast 12% decline in U.S. residential battery storage deployment in 2026 signals near-term headwinds. Base Power's domestic manufacturing strategy (Factory One at the former Austin American-Statesman site) addresses supply chain risk structurally but adds manufacturing execution risk for a company with no prior factory operations experience.
    Execution risk is elevated given Base Power's age (founded August 2023), the scope of its ambitions (national expansion, domestic manufacturing, ERCOT market participation, REP operations), and the relative inexperience of its leadership in running large-scale energy utilities or factories. CEO Zach Dell brings finance and venture capital background; COO Justin Lopas brings manufacturing experience at Anduril and SpaceX, but neither has previously led a utility-scale battery fleet of this size through a full market cycle.
