chapter:
  number: 5
  title: Product & Technology
  summary: Base Power's product story is now anchored on Base Core, a U.S.-built LFP home battery offered in 39.2 kWh and 78.4 kWh configurations. Current launch coverage says the system installs in under an hour, supports up to 36 hours of backup from a single cabinet, is produced in Austin, and is being deployed in both Texas and Illinois. The company's older Gen 1 platform still matters as installed base and operating proof, but the current technology case depends on whether Base Core and Factory 1 convert that field learning into scalable, reliable, lower-cost manufacturing.
sections:
- id: hardware-product-portfolio
  title: Battery Hardware and Product Portfolio
  body: |-
    Base Power's current flagship hardware is Base Core, a company-manufactured residential battery launched in August 2026. The system is available in two configurations: a 39.2 kWh single-cabinet unit and a 78.4 kWh dual-Core configuration. Trade coverage consistently describes Core as one of the largest single-cabinet residential batteries on the U.S. market.

    The Core system is built around lithium iron phosphate (LFP) chemistry and is designed for whole-home backup plus grid participation. Public launch coverage says the battery installs in under an hour, is engineered for extreme weather operation from -22°F to 122°F, includes a built-in generator port, and can provide approximately 36 hours of backup from the 39.2 kWh configuration under Base's modeled residential usage assumptions. Solar Power World reported at least UL 1973 and UL 9540 certifications for the new system.

    Base's product stack now spans more than one operating model. In Texas deregulated territories the battery is paired with Base-supplied electricity; in Illinois ComEd territory it is paired with a retail electric supply offer designed around time-of-use pricing and avoided capacity/transmission charges; and in utility-partner programs the battery can be hosted by the customer while dispatch control sits with the utility. That breadth is strategically useful, but it means "the product" is as much a control-and-contract system as a battery cabinet.
