- id: safety-compliance-reliability
  title: Trust, Safety, Compliance, and Reliability
  body: |-
    Public technical disclosure on Base Core is thinner than on the earlier Gen 1 platform, but several safety and reliability facts are supportable. Solar Power World reported UL 1973 and UL 9540 certification for the current 39.2 kWh residential battery. Company-linked launch coverage says the system installs in under an hour, is built for harsh outdoor conditions, and incorporates a generator port for extended outages.

    The larger diligence issue is not whether Base understands residential battery compliance basics; it is whether current public evidence is sufficient to verify reliability at the scale the company now claims. Once a fleet exceeds 500 MWh and tens of thousands of homes, the relevant questions become field failure rates, warranty reserves, cyber hardening, fleet-update discipline, and how much performance variability exists across utilities, states, and installers.

    Base still operates an internet-connected fleet with dispatchable batteries in customer homes, which creates a meaningful cyber and product-liability surface. No enforcement action, recall, or publicly documented safety incident specific to Base was identified in this run, but public evidence is still far weaker on reliability auditing than on growth marketing.
