  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Independent third-party audit or ERCOT performance report confirming the claimed <5% forced outage rate and sub-second dispatch compliance for Base Power's fleet.
    whyItMatters: All reliability figures are company-stated; utilities committing 100 MW programs (CoServ) and 40 MW programs (Austin Energy) are relying on these metrics without public independent verification.
    diligencePath: Request fleet-level performance data from Base Power or ERCOT ADER pilot performance reports; review any SLA enforcement provisions in utility program agreements.
    relatedQuestionRefs:
    - QE010
    - QE021
  - type: private-evidence-only
    severity: material
    topic: manufacturing
    missingEvidence: 'Verified production output from the Austin factory: whether 4 GWh/year capacity target has been reached and whether manufacturing quality meets utility-grade specs.'
    whyItMatters: The domestic manufacturing narrative underpins Base Power's claim of cost advantage and tariff resilience; actual production ramp data would validate or contradict the investment thesis.
    diligencePath: Request manufacturing throughput data, factory audit reports, and cost-per-kWh trends from management; review any public Texas economic development incentive filings.
    relatedQuestionRefs:
    - QE016
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: cybersecurity
    missingEvidence: Public or third-party disclosure of Base Power's cybersecurity framework, including network segmentation, firmware signing, API authentication, and incident response plan for its networked fleet.
    whyItMatters: Thousands of grid-dispatched batteries represent a potential aggregated grid disruption vector; the absence of public cybersecurity disclosures is a diligence gap relative to utility-grade expectations.
    diligencePath: Request SOC 2 Type II report or equivalent; review IEC 62443 / NIST CSF alignment documentation; evaluate any utility partner security due diligence conducted for CoServ or Austin Energy programs.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: geographic-expansion
    missingEvidence: Confirmed announcement of Base Power's expansion into Illinois (ComEd territory) or other non-Texas markets, including regulatory approvals and business model adaptations.
    whyItMatters: Texas's unique deregulated ERCOT market has allowed Base Power's gentailer model; replicating this in regulated IOU territories (like EPE) or other deregulated markets requires materially different regulatory and commercial structures.
    diligencePath: Monitor basepowercompany.com and PUCT/ICC filings; track CNBC and trade press for official expansion announcements.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: minor
    topic: end-of-life
    missingEvidence: Base Power's battery take-back, recycling, or end-of-life management policy for LFP cells at the end of the 15-year designed lifespan.
    whyItMatters: As an owner-operator of thousands of batteries, Base Power bears end-of-life liability; absence of a recycling policy creates regulatory and reputational risk as the fleet ages.
    diligencePath: Review service agreements and company policy documents; identify any disclosed recycling partnership or take-back program.
    relatedQuestionRefs:
    - QE025
