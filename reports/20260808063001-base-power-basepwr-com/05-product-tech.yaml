- id: control-architecture-vpp
  title: Control Architecture, Software Stack, and VPP Dispatch
  body: |
    Base Power has built a proprietary end-to-end software and control system called BaseOS. The system spans firmware (managing cell-level BMS, sensors, power electronics, and OTA updates), backend services (coordinating fleet dispatch, energy trading, billing, and operational logistics), and a native SCADA layer used by utility partners to manage aggregations. The backend is written primarily in Golang and Python, runs on AWS with containerized services (Kubernetes) and Terraform-managed infrastructure, and uses Temporal for workflow orchestration of real-world deployment and device-control processes. Firmware is written in C, C++, or Rust on embedded Linux or microcontroller targets. The head of software is Jared Greene, previously on the SpaceX Starlink software team; much of the engineering team was recruited from Anduril, SpaceX, and Tesla.
    Field connectivity uses triple redundancy: (1) customer WiFi as the primary link, (2) a 4G virtual cellular chip as a fallback, and (3) fiber optic connection at the utility meter when the utility has already run fiber. This architecture allows Base to classify connectivity-plus- hardware forced outage rate at under 5% — a utility-grade reliability claim. ERCOT dispatch commands are executed in sub-second response times; delivered power is within 1% of commanded power. Utility partners can control battery aggregations through either a web-based dashboard or an API that can integrate directly into the utility's energy management system.
    In ERCOT's deregulated market, Base's trading algorithm monitors wholesale prices in real time, charging batteries when prices are low (often negative during high wind/solar periods) and dispatching to the grid when prices peak. Base qualified for Texas's Aggregated Distributed Energy Resource (ADER) pilot program, which allows its distributed fleet to bid as a single virtual power plant into the ERCOT wholesale market. As of October 2025, Base had maxed out the 20 MW capacity it could bid through the ADER pilot and was pushing for the cap to be raised. ERCOT held a working session with Base Power in April 2026 to address design issues including nodal dispatch, settlement treatment, metering, and distribution service provider alignment — indicating the program's regulatory framework is still maturing.
