- id: installation-deployment
  title: Installation Workflow and Deployment Operations
  body: |-
    Base Power's deployment operation now appears to have moved from early-market sprint to scaled installation machine. TechCrunch reported in August 2026 that the company was installing roughly 100 batteries per day and aiming to double that pace by year-end. Company-linked trade coverage says Factory 1 in Austin is already producing thousands of systems per month.

    Operationally, Base still appears to run the same deployment-factory model described earlier in its Texas buildout: customer qualification, permitting, scheduling, installation, commissioning, and ongoing fleet management are coordinated in-house with software support and specialized field labor. That operational muscle remains a real differentiator because distributed batteries only create grid value when the permitting and deployment workflow is repeatable across thousands of homes.

    The key 2026 change is geographic rather than purely volumetric. Base is no longer deploying only into Texas retail-choice or Texas utility-partner contexts. Latitude Media and consumer guidance from Citizens Utility Board confirm that the company is now active in Illinois ComEd territory, where the product and commercial workflow must adapt to PJM-facing retail economics and a more fragmented local permitting landscape.
