- id: differentiation-risks
  title: Technology Differentiation and Product Risks
  body: |-
    Base Power's core differentiation remains the combination of hardware, software, deployment operations, and energy-market participation under one roof. The August 2026 launch strengthens that case because Core appears to be a product informed by real field learning rather than a lab-only redesign: management explicitly tied the new battery's configuration to lessons learned from the first 500 MWh deployed.

    The biggest product risk is still the tension between homeowner backup expectations and grid monetization. Lower-cost access is only possible because Base retains battery ownership and dispatch rights. Consumer advocates reviewing the Illinois contract structure warn that backup is not guaranteed to be fully available during longer outages, and independent Texas reviewers have made the same point for the earlier product generation.

    A second product risk is that multi-state expansion proves the commercial wrapper is market-specific. Illinois may validate Base's adaptability, but it also demonstrates that Texas ERCOT economics are not the same as PJM/ComEd economics. That weakens any simplistic one-SKU / one-model replication thesis even if the battery hardware itself is improving rapidly.
