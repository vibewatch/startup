callouts:
- calloutType: strength
  title: Vertically Integrated Stack Creates a Defensible Moat
  body: |
    Base Power combines hardware design, domestic manufacturing, proprietary firmware and software (BaseOS), in-house deployment operations, and retail electricity provision in a single company. This integration is rare among VPP or battery-as-a-service providers, most of whom rely on third-party hardware (Tesla, Enphase) and third-party software (AutoGrid, Itron). The stack allows Base to iterate on cost, reliability, and dispatch speed without vendor dependencies, and to capture margin at every layer.
  claimRefs:
  - CE017
  - CE018
  - CE021
  - CE031
- calloutType: risk
  title: 20% SOC Floor Means Backup Is Not Guaranteed Full
  body: |
    Base Power is contractually permitted to draw homeowner batteries down to 20% state of charge to service ERCOT grid-trading obligations. A homeowner whose battery is at 20% SOC when a major outage begins — the scenario most likely during a peak-demand heat event — would have approximately 4.5 kWh of usable energy, equivalent to roughly 1–2 hours of whole-home backup with heavy air-conditioning load. This is the structural tension at the heart of the product: the same mechanism that makes the economics work (grid arbitrage) is the mechanism that reduces backup reliability. Independent electrical contractors (Epic Electrical) have flagged this gap publicly and recommend a supplemental generator interlock to close it.
  claimRefs:
  - CE032
  - CE037
- calloutType: risk
  title: China Cell Sourcing Creates Tariff and Supply Chain Exposure
  body: |
    Battery cells are currently sourced from China. As of April 2025, Base Power's CEO acknowledged tariff exposure directly. The Austin factory mitigates some cost exposure by building modules, packs, and power electronics domestically, but cells remain a China-sourced input until a non-China supply chain is established. Escalating US–China tariffs (Section 301 and related measures) could materially increase cell cost and compress margins or require battery pricing revisions before domestic cell sourcing is secured.
  claimRefs:
  - CE033
  - CE038
- calloutType: insight
  title: ERCOT ADER Regulatory Maturation Is a Critical Path Item
  body: |
    Base Power has maxed out the 20 MW it can bid through the ERCOT ADER pilot. ERCOT is reviewing an expansion to 160 MW, with pending Board approval in June 2026, but nodal dispatch and settlement rules — the primary mechanism through which Base monetizes its fleet — remain under internal ERCOT review as of May 2026. The cap and settlement framework are the binding constraint on Base's grid-services revenue ceiling in Texas; their resolution will determine whether the ADER channel can scale to support Base's growth ambitions.
  claimRefs:
  - CE023
  - CE024
  - CE035
