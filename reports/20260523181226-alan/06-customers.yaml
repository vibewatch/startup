artifact: customers
slug: alan
runDate: "2026-05-23"
company:
  name: Alan

chapter:
  number: 6
  title: Customers
  summary: >
    Alan reached 1.1 million members across 37,000+ companies in four countries as of Q1 2026, anchored by
    SME employer-sponsored plans in France and accelerating public-sector wins — most visibly the Ministry of
    Finance (Bercy) contract covering up to 465,000 beneficiaries from January 2026, achieved at a 96%
    affiliation rate. Named enterprise clients include HP and Volkswagen in Belgium/Spain. Customer satisfaction
    is reported at 90% with a self-reported NPS of 68 versus an industry average of 3, but retention and churn
    data are not publicly disclosed; growing public-sector concentration, AWS data-sovereignty concerns, and a
    legal challenge from the displaced Bercy incumbent represent material diligence gaps.

sections:
  - id: customer-segmentation
    title: Customer Base & Segmentation
    body: >
      Alan's customer base spans two primary commercial channels: business-to-business (B2B) employer-sponsored
      group health insurance, which drives the large majority of its 1.1 million members, and a smaller but growing
      business-to-consumer (B2C) segment for self-employed professionals (travailleurs non-salariés, TNS) and
      individual members. In France, the SME segment (1–500 employees) remains the historical core; Alan entered
      the market targeting tech startups before scaling to broader mid-market employers. Individual and TNS plans
      (Rubis, Emeraude, Saphir/Diamant) are priced at €49–91/month for a 40-year-old profile, positioning Alan
      at the premium end of the individual market.

      Geographically, France dominates member count and is Alan's only operationally profitable market as of
      2025. Belgium and Spain are meaningful secondary markets where HP and Volkswagen are cited as named
      enterprise clients, with Belgian distribution further accelerated by the Belfius bank partnership. Canada
      obtained provincial licences in 2024 and has commenced commercial operations, though it remains early-stage.

      Public-sector exposure has risen materially since 2023. Alan won the Assemblée nationale contract in 2023,
      the Ministry of Ecology (60,000 civil servants) and Prime Minister Services (4,900 employees) in 2024,
      and the Ministry of Finance (Bercy, 130,000 civil servants, live January 2026) in 2025. This extends Alan's
      buyer profile from private employers to central-government HR departments, introducing different procurement
      dynamics, longer contract cycles, and structural renewal risk tied to French PSC reform continuity.
    claimRefs: [CU001, CU004, CU009, CU010, CU031, CU034, CU038, CU039]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: adoption-growth
    title: Adoption & Growth Trajectory
    body: >
      Alan's member count grew from approximately 650,000 (mid-2024 per OTPP profile) to 1.1 million by Q1 2026,
      nearly doubling in roughly 18 months. Concurrently, covered companies expanded from ~25,000 to 37,000+.
      The step-change in member growth was partly driven by large block contracts: the Ministry of Finance alone
      contributed 130,000 direct civil servants from January 2026, with a 96% affiliation rate — the single
      most visible retention proxy for a discrete cohort. The Q1 2026 shareholder letter confirms new business
      acquisition grew 60% year-on-year with similar marketing investment, pointing to materially improved
      sales and marketing productivity.

      Revenue trajectory corroborates member growth: ARR rose from €505M (mid-2024) to €785M (end-2025) and
      €804M (Q1 2026), representing approximately 59% annual growth. The partial dilution of per-member revenue
      from lower-premium public-sector contracts is an inference based on the relative ARR-to-member growth
      rates, not publicly disclosed. Operational metrics released in the press room show 99% of reimbursements
      processed within a day and 73 million+ reimbursements processed since 2016 as evidence of platform maturity.

      Product adoption beyond core insurance is accelerating: Mo AI health companion is live for 500,000+
      members in France (roughly 45% of French members), delivering four times the engagement of the prior
      human-powered Clinic. Prévenir (occupational health) covers 14,000 employees across 100 companies, showing
      upsell traction into workplace prevention. Alan Play step challenges drove a reported +70% lift in daily
      active users during team events.
    claimRefs: [CU002, CU003, CU007, CU008, CU011, CU013, CU017, CU020, CU021, CU022, CU033, CU040, CU041, CU045]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: named-proof
    title: Named Customer Proof
    body: >
      Alan's named customer evidence is strongest in the French public sector, where competitive tender outcomes
      and official ministry announcements provide primary-tier corroboration. The Ministry of Finance (Bercy)
      contract is the most extensively documented: Alan's official blog post, multiple independent news outlets,
      and the Q1 2026 shareholder letter all confirm the 130,000-agent onboarding with a 96% affiliation rate.
      The Ministry stated Alan's offer was "mieux-disante" on economics, service quality, and lowest management
      costs. The Ministry of Ecology (60,000 agents) and PM Services (4,900 employees) contracts in 2024, and
      the Assemblée nationale contract in 2023, establish a documented staircase of public-sector wins. In total,
      Alan has at least tripled its public-sector coverage base within 24 months.

      In the private sector, HP and Volkswagen are the only named enterprise employer clients confirmed via
      press coverage (abcmoney.co.uk, fintech.global). Alan does not publish a customer list, and specific
      deployment sizes or outcome data for these clients are not publicly available. OTPP's investor profile
      provides independent corroboration that Alan "partnered with 25,000 companies" at an earlier stage.
      The Activepieces case study documents Alan's internal use of automation technology — useful as a
      technology-vendor reference rather than a health-insurance customer proof point.

      Aggregate customer review scores (4.0–4.2/5 across 2,300+ verified reviews on Goodassur aggregating
      Opinion Assurances, Trustpilot, Google Reviews, and Selectra) and the Ministry of Finance's official
      evaluation together represent the strongest third-party endorsements. Adverse reviews from Opinion
      Assurances document reimbursement errors, difficulties reaching a human advisor, and premium increases
      as recurring friction points, particularly for complex claims and TNS profiles.
    claimRefs: [CU005, CU006, CU012, CU014, CU015, CU016, CU018, CU019, CU023, CU024, CU025, CU037]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: retention-satisfaction
    title: Retention, Satisfaction & Durability
    body: >
      Alan does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or
      cohort-level churn rates. Available proxies are: a self-reported 90% member satisfaction rate, an
      NPS of 68 versus an industry average of approximately 3 (cited in the official Bercy announcement blog),
      and an aggregate consumer review score of 4.0–4.2/5 across ~2,300 verified reviews as of May 2026.
      The 96% affiliation rate at Ministry of Finance onboarding is a credible activation proxy for a single
      large cohort, though activation differs from annual renewal rate.

      For employer-sponsored B2B health insurance broadly, industry benchmarks suggest 85–92% annual
      retention when employers bear the majority of the premium. Alan's specific retention by segment is
      unknown. ARR growth from €505M to €804M over ~18 months implies strong portfolio-level revenue
      retention, but does not isolate individual employer renewal rates or segment mix effects. The France
      market's operational profitability implies positive unit economics at scale, which is an indirect
      indicator of durable retention rather than high churn.

      Adverse review signals on Opinion Assurances and Goodassur identify recurring friction in three
      areas: reimbursement errors and laborious correction processes, absence of direct phone support
      for complex cases, and premium increases perceived above market average for TNS and individual
      customers. The Selectra platform shows a notably low 1.5/5 from only 10 reviews — illustrating
      platform-level selection bias — while Google Reviews (4.2/5, 1,464 reviews) and Trustpilot
      (4.1/5, 160 reviews) are consistently more positive, indicating that satisfied employer-covered
      employees dominate high-volume review channels.
    claimRefs: [CU024, CU025, CU030, CU032, CU035, CU040, CU041, CU043, CU044]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: concentration-risk
    title: Concentration & Expansion Risk
    body: >
      Alan's most material concentration risk is its rising public-sector exposure. The PSC contracts won
      across 2023–2026 (Assemblée nationale, Ministry of Ecology, PM Services, Ministry of Finance) collectively
      represent a large bloc of covered lives under a single procurement regime. While each ministry is a
      separate contract, they all derive from the PSC reform mechanism. If a future French government
      reverses PSC reform, or if Alan fails to renew tenders at cycle end, a material share of its member
      base could exit in a compressed timeframe.

      Execution risk on the Bercy contract is active: MGEFI (a Matmut subsidiary), the incumbent insurer,
      filed a pre-contractual legal challenge in June 2025 after being displaced. An earlier MGEN challenge
      against Alan's Ministry of Ecology win was dismissed at referé stage, providing a precedent against
      reversal, but the MGEFI challenge outcome was unresolved as of the run date. French MP Philippe Latombe
      has publicly flagged Alan's AWS hosting of civil servant health data as a digital sovereignty concern —
      a regulatory exposure that could affect future PSC tender eligibility.

      On channel concentration, Belgium relies substantially on the Belfius bank distribution partnership for
      employer acquisition. Canada is too early in its growth arc to carry meaningful concentration risk.
      Offsetting these risks: the 37,000-company private-sector portfolio is highly diversified across SME
      sizes and industries, and no single private employer is disclosed as representing a material revenue
      concentration. Public-sector contracts, while large in covered lives, are priced at lower per-member
      premiums, so their revenue concentration impact is less severe than their headcount concentration.
    claimRefs: [CU026, CU027, CU028, CU029, CU036, CU037, CU038, CU039, CU042]
    tableRefs: [TU005]

