callouts:
  - calloutType: strength
    title: NPS of 68 vs. Industry Average of 3
    body: >
      Alan publicly reports an NPS of 68, against a French health insurance industry average of approximately
      3, as cited in the official blog post announcing the Ministry of Finance contract. The 96% affiliation
      rate for 130,000 civil servants in a compressed onboarding further demonstrates that Alan's user
      experience converts at institutional scale, not just among tech-savvy SME employees. These are the
      strongest available satisfaction proof points, even though both are company-reported rather than
      independently audited.
    claimRefs: [CU005, CU006, CU013]

  - calloutType: risk
    title: No Public Churn or Retention Data — Concentration Cliff Risk
    body: >
      Alan has not disclosed NRR, GRR, or segment-level churn rates. The three French public-sector PSC
      contracts (Ecology, PM, Bercy) represent a structurally high concentration of covered lives under
      a single procurement regime. Legal uncertainty around the Bercy contract (MGEFI challenge unresolved),
      AWS data-sovereignty concerns, and the absence of confirmed private-sector retention benchmarks leave
      investors reliant on proxy satisfaction metrics and industry analogues. Any single PSC contract loss
      or reversal would have outsized member-count impact.
    claimRefs: [CU026, CU029, CU030, CU036]

  - calloutType: insight
    title: Public Sector as Proof-of-Scale, Not Just Revenue
    body: >
      Each public-sector PSC win functions as a referenceable proof-of-scale for enterprise sales: Alan
      now points to 130,000 civil servants onboarded in weeks, a 96% affiliation rate, and displaced
      incumbents across multiple ministries. This creates a virtuous cycle for large private-sector
      employer acquisition in France, where HR departments respond to peer-institution validation.
      The pattern mirrors how early B2B SaaS vendors used government wins to accelerate commercial
      enterprise sales — a strategic asset beyond the direct headcount contribution.
    claimRefs: [CU017, CU033, CU037]

