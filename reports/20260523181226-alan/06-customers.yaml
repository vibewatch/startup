      missingEvidence: "Segment-level NRR, GRR, and annual churn rates broken out by customer type (SME, large enterprise, public sector, individual/TNS) and geography"
      whyItMatters: "Without retention data, it is impossible to assess whether Alan's rapid member growth reflects genuine durability or temporary PSC-block onboarding that could unwind at contract cycle end"
      diligencePath: "Request historical cohort data from Alan in a management meeting; alternatively, cross-reference PSC contract duration terms with renewal dates to model concentration scenario"
      relatedQuestionRefs: [QU028]
      relatedTableRefs: [TU004]

