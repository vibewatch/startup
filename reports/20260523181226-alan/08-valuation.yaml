  - id: scenarios
    title: Bull, Base, and Bear Scenarios
    body: >
      Scenario analysis anchors on three variables: ARR trajectory, path to group profitability, and exit-multiple compression. In the bull case, Alan achieves its €1B ARR target in 2026 and delivers group-level profitability in FY2027 as guided; international markets (Belgium, Spain, Canada) scale to 30%+ of ARR by end-2027; and the company commands a 10× forward ARR multiple at a 2029 IPO—implying a potential equity value of €12–15B on €1.5B+ ARR. In this scenario, early Series E investors (€2.7B entry) see approximately 5× and Series F investors (€4B entry) see approximately 3–4× on invested capital. In the base case, ARR growth moderates to 30–35% in 2026 (€1–1.1B ARR), group profitability arrives in FY2028 rather than 2027, and exit multiple compresses to 6–8× forward ARR at a 2029–2030 exit—implying an equity value of €7–10B, or 40–100% upside from the current €5B mark. Series F investors see 1.75–2.5× return. In the bear case, ARR growth decelerates sharply to below 20% due to public sector churn or loss ratio deterioration, group profitability is delayed to 2030+, the Solvency II review (January 2027 implementation) creates additional capital requirements, and the market reprices Alan as a carrier at 2–3× ARR (implying a valuation of €2–3.3B on €1B ARR)—a 33–60% decline from the current mark. This bear case is structurally possible if the Carbone critique proves correct at scale: that Alan's fundamental economics, stripped of the tech premium, resemble a marginally-profitability niche insurer rather than a technology platform. The Solvency II review is a real structural risk: EIOPA's revised framework, scheduled for implementation on 30 January 2027, may alter capital formula requirements, and Alan's SCR coverage buffer (3.6×), while currently ample, must be maintained under potentially revised calibrations.
