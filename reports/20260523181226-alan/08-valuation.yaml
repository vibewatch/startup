  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: loss-ratio
      missingEvidence: "Claims-to-premiums ratio by year, plan type, and geography; actuarial reserve methodology and stress tests"
      whyItMatters: "The loss ratio is the fundamental actuarial risk metric; Alan's management-stated target of ~100% pass-through has never been independently verified. If claims systematically exceed premiums, the subscription margin and the entire dual-layer model collapses."
      diligencePath: "Request in formal data room; seek reinsurer (Swiss Re, GenRe) third-party confirmation; ask ACPR for published metrics on Alan's reserve adequacy under Pillar 2"
      relatedQuestionRefs: [QV018, QV019]

    - type: private-evidence-only
      severity: blocking
      topic: audited-accounts
      missingEvidence: "IFRS or GAAP audited consolidated financial statements for FY2023, FY2024, and FY2025"
      whyItMatters: "Only Solvency II SFCR summary pages are public; no statutory audit trail exists for revenue recognition, intercompany eliminations, or balance sheet items. Required for any public listing and for independent financial diligence."
      diligencePath: "Request from Alan in data room; verify whether Big 4 or reputable firm has conducted group-level audit; identify whether Solvency II audit opinions cover the whole consolidated group"
      relatedQuestionRefs: [QV009, QV019]
      relatedTableRefs: [TV006]

    - type: private-evidence-only
      severity: material
      topic: per-country-PnL
      missingEvidence: "Revenue, gross margin, operating cost, and EBITDA by country (France, Belgium, Spain, Canada)"
      whyItMatters: "France is operationally profitable, but Belgium, Spain, and Canada are presumably in investment mode. Without per-country P&L, it is impossible to assess the drag from international markets on the 2027 group profitability target."
      diligencePath: "Request management accounts by geography; cross-reference with country headcount and disclosed payroll growth; seek CFO confirmation of Belgium/Spain timelines to profitability"
      relatedQuestionRefs: [QV018]

    - type: private-evidence-only
      severity: material
      topic: CAC-LTV
