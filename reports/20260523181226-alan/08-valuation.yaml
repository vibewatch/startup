  - id: recommendation
    title: Recommendation, Thesis-Break Triggers, and Final Diligence Asks
    body: >
      Our recommendation is TRACK. At €5B post-money, Alan's valuation is defensible but not yet investment-grade for a new position without resolution of key evidence gaps. The business trajectory—France profitable, ARR +53% YoY, losses as a share of ARR at 3.3%, and a 3.6× Solvency II buffer—validates the growth story but does not resolve core actuarial and financial reporting gaps (no loss ratio, no IFRS audited accounts, no per-country P&L). The €5B private mark implies a 25–100% premium to public market comps on the same revenue base (Lemonade at P/S 5.14× is the closest public analog, though still loss-making). This premium is justifiable if: (a) group profitability arrives in FY2027 as guided, (b) the loss ratio remains near 100% as claimed, and (c) Alan successfully scales Belgium, Spain, and Canada without triggering material Solvency II capital calls. An upgrade to RECOMMEND would require: confirmation of FY2027 group-level profitability ahead of schedule; publication of IFRS-audited consolidated financial statements or independent actuarial sign-off on loss ratio; and clear evidence that public sector ARR is not concentrated in any single ministry. A downgrade to AVOID would be triggered by: material loss ratio divergence (claims exceeding 105% of premiums consistently), ARR growth decelerating below 20% in any two consecutive quarters, or a regulatory action by ACPR or the Belgian/Spanish supervisors. The governance concentration risk (founders and employees holding voting majority with 40% capital) is a standard European growth-stage structure but creates secondary liquidity risk for early investors; any prospective investor should seek pro-rata rights, anti-dilution provisions, and board representation commensurate with ownership.
