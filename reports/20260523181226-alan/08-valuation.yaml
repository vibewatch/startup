  - id: comparable-analysis
    title: Valuation Methodology and Comparable Analysis
    body: >
      Alan operates as a hybrid: a regulated Solvency II insurance carrier whose primary economic profit pool is a SaaS-like management fee of approximately 12–14% of premiums, layered atop a near-zero-margin premium pass-through. This dual-layer structure creates a valuation ambiguity: should Alan be priced as a carrier (1.5–3.5× net revenue), a tech-enabled MGA (3–8× net revenue), or an AI-native insurer (15–30× net revenue)? The answer has material consequences. At €5B valuation and €785M FY2025 ARR, Alan's ARR multiple is approximately 6.4×—in the upper band for tech-enabled carriers but well below the SaaS-premium tier. If valued solely on its subscription revenue (12–14% of €785M = approximately €94–110M), the implied multiple rises to approximately 46–53× net subscription revenue, a figure structurally impossible to support. The appropriate framing is the blended ARR multiple (6.4×), acknowledging that premiums and subscriptions are co-bundled and cannot be disaggregated for multiple purposes. The Windsor Drake Q1 2026 Insurtech Valuation Report confirms that public insurtechs currently trade in the 6–10× range while private markets can award higher premiums for quality and growth. Nelson Advisors' European HealthTech M&A 2025 report puts average HealthTech revenue multiples at 4.8× (Q1 2025), rising to 6–8× for AI, telehealth, and analytics platforms. On this view, Alan's 6.4× blended multiple is at the high end of the European HealthTech M&A market but not an outlier, assuming the AI/tech positioning premium is substantiated. Comparing to public comparables: Oscar Health (OSCR, NYSE) has a TTM revenue of $13.3B and market cap of $6.83B (P/S ≈ 0.51×), but Oscar is a full-stack carrier with very different revenue composition and operating at a scale 17× Alan's ARR. Lemonade (LMND, NYSE), a technology-first insurer with $844.7M TTM revenue, trades at a P/S of approximately 5.14× and EV of $4.17B—a more comparable scale, though Lemonade remains loss-making (net loss $138.9M TTM). Clover Health (CLOV, NASDAQ) has an EV of approximately $2B on $2B LTM revenue (EV/Revenue ≈ 1×), trading closer to a pure carrier. The public-market precedent suggests that the private premium Alan commands (6.4× ARR) reflects both illiquidity and growth premium over public comps. Key structural disadvantages vs. public peers: no GAAP/IFRS audited consolidated accounts, no disclosed loss ratio, and no per-country P&L—all of which would be required for any public market listing and significantly elevate diligence risk.
