  - id: TM004
    title: "Growth Drivers and Structural Constraints"
    columns:
      - "Driver / Constraint"
      - "Direction"
      - "Timing"
      - "Implication for Alan"
      - "Diligence Ask"
    rows:
      - ["ANI 2016 private-sector employer mandate",
         "Growth driver",
         "Structural (ongoing since 2016)",
         "Guarantees a large, stable base of group contracts Alan can target; 57% of French complementary health premiums now group/collective",
         "Confirm Alan's win-rate in competitive ANI-linked tenders vs IPs and large assurers"]
      - ["PSC 2025–2026 public-sector extension of employer mandate",
         "Growth driver",
         "Immediate (2025–2026 rollout)",
         "Opens 3.5M civil-servant addressable population; Alan already won Ministry of Economy tender (135K agents); rollout momentum through 2026",
         "Track PSC implementation pace by ministry; assess Alan's win-rate in future public tenders post-first win"]
      - ["Medical inflation and rising healthcare costs",
         "Growth driver + constraint",
         "Current (structural)",
         "Drives premium volume growth (+7.6–8.2% in 2024) that expands the absolute TAM; simultaneously raises claims costs and puts pressure on Alan's equilibrium-pricing model",
         "Monitor claims-to-premium ratio in Alan's SFCR filings; compare to market average of 79% loss ratio (DREES 2025)"]
      - ["Digital transformation of employee health benefits",
         "Growth driver",
         "Near-term (2025–2028)",
         "Creates demand for Alan's app-centric, AI-powered model; 81% of Alan patients chose AI over traditional consultation; 35% weekly engagement on Alan Walk",
         "Benchmark Alan's NPS and retention vs legacy incumbents; verify 90% member satisfaction claim via independent survey"]
      - ["100% Santé / RAC0 reform claims inflation",
         "Structural constraint / headwind",
         "Ongoing (2019–2026+)",
         "Mandates zero-copay baskets for dental/optical/hearing aids; drove €2.1B extra CHI spending 2019–2021; hearing aid utilisation +75%; premiums for elderly rising 7–12%; compresses technical margins market-wide",
         "Assess Alan's exposure by age profile of its member book; quantify portion of claims attributable to 100% Santé basket vs general frais de soins"]
      - ["Incumbent entrenchment via accords de branche (sectoral designation clauses)",
         "Structural constraint / headwind",
         "Structural (ongoing)",
         "Branch-level agreements designate specific IPs for entire professional sectors; even without mandatory designation, incumbents benefit from contractual inertia at branch level, limiting Alan's entry in certain sectors",
         "Map Alan's SME portfolio by NACE industry sector; identify sectors with active branche-designation agreements Alan cannot easily penetrate"]
      - ["Annual-switch right (résiliation infra-annuelle, 2020)",
         "Growth driver (switching enabler)",
         "Operative since 2020",
         "Allows employers to switch group complementary health insurer annually without penalty after first year; reduces switching cost and benefits challenger like Alan",
         "Quantify Alan's win rate from competitive switches vs new-to-insurance customers; track seasonality of contract starts"]
      - ["Multi-jurisdictional regulatory complexity (ACPR/FSMA/DGSFP/OSFI)",
         "Structural constraint",
         "Ongoing",
         "Each new geography requires separate capital, compliance, product localisation, and data-sovereignty work; increases fixed costs of expansion and slows time-to-scale outside France",
         "Assess Alan's compliance resource allocation across jurisdictions; verify solvency ratios in Belgium, Spain, and Canada separately"]
      - ["Third-party operational risk (Almerys cyberattack, May 2026)",
         "Constraint / emerging risk",
         "Current (acute as of runDate)",
         "Almerys breach exposed member data (SSNs, civil status, contract numbers); ACPR and CNIL notified; reputational and regulatory risk; second incident in two years; potential for regulatory sanction and member churn",
         "Determine number of Alan members affected by the May 2026 breach; assess CNIL inquiry timeline; monitor member retention post-disclosure"]
      - ["Low incumbent digital maturity creating opening for digital-native disruptors",
         "Growth driver",
         "Near-term (2025–2028)",
         "Mutuelle and IP incumbents are digitalising slowly; Deloitte Belgium study confirms 44% of Belgians unable to understand invoices; 1/3 postpone care due to financial constraints—pain Alan's UX directly addresses",
         "Track incumbent digital investment levels; assess whether AXA Healthanea, AG Insurances' MyEmployeeBenefit, or Doctolib offerings close the UX gap"]
    enumerationScope:
      coverage: partial
      basis: "Drivers and constraints identified from ACPR, DREES, France Assureurs, DREES 100% Santé study, service-public.fr PSC pages, Deloitte Belgium, Alan letters and press; additional regulatory, macro, or competitive dynamics may exist not captured in public sources as of Q1 2026"
    notes: >
      Direction column uses growth driver / constraint / headwind vocabulary. Timing uses Immediate
      (≤12 months), Near-term (1–3 years), or Structural (multi-year, ongoing). Implication focuses
      on Alan-specific effects, not market-generic. Diligence asks are investor-level verification
      questions, not actionable instructions for Alan management.
    claimRefs:
      [CM003, CM005, CM006, CM007, CM008, CM012, CM013, CM015, CM037, CM038, CM039, CM040, CM041,
       CM042, CM043, CM044, CM045]

figures:
  - id: FM001
    title: "Market Sizing Pyramid — Alan's TAM/SAM/SOM"
    type: pyramid
    layout: standard
    summary: >
      TAM/SAM/SOM hierarchy for Alan's primary market (France + Belgium + Spain). French complementary
      health is the dominant layer; SAM is the B2B employer-group segment; SOM is Alan's current and
      near-term ARR trajectory. Canada is excluded from the SAM/SOM calculation given early commercial
      stage but is included directionally in total TAM.
    data:
      items:
        - label: "TAM — Complementary Health Premium Pool (FR+BE+ES combined)"
          value: "~€50B"
          detail: >
            France: €46.5–47.2B complementary health cotisations (ACPR/DREES 2024 data);
            Belgium: ~€2.5B supplementary health GWP (KPMG 2024);
            Spain: private VHI estimate not primary-sourced; excluded from TAM arithmetic.
            Canada: CAD $55.9B (~€37B) private supplemental benefits (2022 CHLIA) — disclosed
            separately given regulatory/market structural differences.
          tone: neutral
        - label: "SAM — B2B Employer-Group Addressable Segment (FR+BE+ES)"
          value: "~€28–32B"
          detail: >
            France group collectif: 57% × €46.8B = ~€26.7B (France Assureurs 2024);
            Belgium collective: ~€950M (KPMG 2024);
            Spain employer-group VHI: ~€1–3B estimated (not primary-sourced; evidence gap GM001).
            Total: ~€28–32B. Constraint: Alan only competitive in digitally-open employer segments
            willing to switch from legacy IPs or mutuelles.
          tone: neutral
        - label: "SOM — Alan's Current and Near-Term Obtainable Revenue"
          value: "€785M (2025A) → €1B+ (2026 target)"
          detail: >
            Alan ARR: €505M (2024); €785M (FY2025); €804M+ (Q1 2026).
            % of French+Belgian group SAM: ~2.5–3.3%.
            CEO guidance: 40% ARR CAGR through 2026; group-level profitability target 2027.
            5-year SOM at 40% CAGR: ~€3.7B (still below 12% of combined FR+BE group SAM).
          tone: positive
    approximationNotes: >
      TAM: Spain VHI size excluded from TAM sum due to missing primary source; the "~€50B" figure is
      France+Belgium only. Canada excluded from TAM pyramid due to structural differences. SAM: France
      group segment derived as 57% × €46.8B per France Assureurs; Belgium collective from KPMG; Spain
      estimate uses proportionate method and is uncertain. SOM 5-year projection uses management guidance
      CAGR; not independently verified.
    claimRefs: [CM016, CM017, CM018, CM019, CM020, CM021, CM022, CM023, CM024, CM025, CM026, CM027]

  - id: FM002
    title: "Market Estimate Range — French Complementary Health Cotisations 2024"
    type: range
    layout: standard
    summary: >
      Low/base/high estimates of total French complementary health cotisations in 2024 from three
      primary institutional sources. All figures are in EUR billions for the health-only segment
      (excludes prévoyance / incapacité / décès). Sources are DREES, ACPR, and France Assureurs.
    data:
      items:
        - label: "French complementary health cotisations 2024 (DREES/France Assureurs/ACPR range)"
          low: 46.5
          mid: 46.8
          high: 47.2
          detail: >
            Low (46.5B): DREES 2025 annual report — cotisations en santé, excludes journalières.
            Mid (46.8B): France Assureurs — health cotisations 2024, +7.6% vs 2023.
            High (47.2B): ACPR No. 178 — health-specific premium component.
            All three figures refer to data year 2024; differences reflect scope definitions.
          tone: neutral
    approximationNotes: >
      All three figures refer to the same data year (2024) and the same country (France). Differences
      of €0.3–0.7B (~0.6–1.5% range) reflect methodological scope: DREES excludes journalières
      (sickness daily allowances), France Assureurs aggregates member submissions, ACPR may include
      entities not fully captured by DREES scope. For diligence purposes, treat €46.5–47.2B as the
      confirmed range for the French complementary health market in 2024.
    claimRefs: [CM016, CM017, CM018]

  - id: FM003
    title: "Buyer / Segment Flow Map — Alan's B2B Group Health Procurement Journey"
    type: flow
    layout: standard
    summary: >
      How employers, regulators, distribution partners, and end users relate in Alan's core B2B group
      health insurance workflow, from regulatory mandate to member experience.
    data:
      nodes:
        - id: ani-psc-regulator
          label: "ANI 2016 / PSC 2025-26 Mandate\n(Regulatory Driver)"
        - id: employer
          label: "Employer\n(SME / Enterprise / Public Body)"
        - id: broker-partner
          label: "Broker / Distribution Partner\n(Belfius in Belgium; direct in FR/ES)"
        - id: alan-insurance
          label: "Alan Insurance Platform\n(ACPR-licensed complementary insurer)"
        - id: member-app
          label: "Member\n(Employee / Civil Servant)"
        - id: alan-platform
          label: "Alan Digital Services\n(Mo AI, Clinique, Play, optical)"
        - id: reinsurance
          label: "Reinsurance Pool\n(Swiss Re, GenRe, CNP, Hannover Re)"
        - id: third-party-ops
          label: "Third-Party Operator\n(Almerys payment processing)"
      edges:
        - source: ani-psc-regulator
          label: "Mandates group coverage + 50% employer contribution"
          target: employer
        - source: employer
          label: "Selects insurer via RFP / direct / broker"
          target: broker-partner
        - source: broker-partner
          label: "Routes to Alan contract"
          target: alan-insurance
        - source: employer
          label: "Direct digital onboarding (no broker)"
          target: alan-insurance
        - source: alan-insurance
          label: "Issues group policy; collects premiums"
          target: member-app
        - source: alan-insurance
          label: "Cedes risk"
          target: reinsurance
        - source: alan-insurance
          label: "Delegates payment ops"
          target: third-party-ops
        - source: alan-platform
          label: "Digital services, AI, prevention (subscription-funded)"
          target: member-app
        - source: member-app
          label: "Generates reimbursement claims"
          target: alan-insurance
    claimRefs: [CM003, CM004, CM009, CM010, CM030, CM031]

  - id: FM004
    title: "Adoption Funnel — How Employers Move from Status Quo to Alan"
    type: funnel
    layout: standard
    summary: >
      Key stages in the employer adoption journey from awareness to live coverage, with friction
      points and Alan's levers at each stage.
    data:
      items:
        - label: "Regulatory Trigger / Contract Renewal"
          value: 100
          detail: "ANI 2016 compliance, PSC 2025-26 reform, or annual contract renewal activates procurement; friction low at expiry, high mid-cycle. Alan lever: PSC outreach, public-sector tender participation."
          tone: neutral
        - label: "RFP / Comparison"
          value: 60
          detail: "HR director/broker requests 2–5 quotes; assesses price, coverage, digital capabilities. Friction: legacy brokers favour established IPs; switching cost perception high. Alan lever: AI sales productivity +50%, 20-sec response demo."
          tone: neutral
        - label: "Pilot / Onboarding Decision"
          value: 35
          detail: "Employer selects Alan; employee data migrated; coverage activated in 1–4 weeks. Friction: IT/HR integration, mid-year coverage gap risk. Alan lever: digital onboarding tools; 135K civil servants onboarded in 2 weeks."
          tone: neutral
        - label: "Active Coverage (Year 1)"
          value: 30
          detail: "Members use Alan app; reimbursements 70% in <1h, 99% in 24h; virtual clinic, Mo AI, Alan Walk. Friction: app adoption, AI trust. Alan lever: 90% satisfaction, 35% weekly Walk retention."
          tone: positive
        - label: "Renewal / Expansion"
          value: 25
          detail: "Employer renews; may expand tiers or upsell. Friction: premium sensitivity, annual-switch right enables easy churn. Alan lever: NPS lock-in, Aro acquisition, Alan Precision €249 test."
          tone: positive
    claimRefs: [CM007, CM010, CM011, CM029, CM032, CM033, CM034, CM036, CM039]

