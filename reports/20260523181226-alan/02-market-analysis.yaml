company:
  name: "Alan"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Alan operates at the intersection of three layered markets: the French complementary health insurance
    (complémentaire santé) market—the world's most regulated and largest national complementary-only
    premium pool at ~€46.5–47B in 2024—the adjacent Belgian (~€2.5B) and Spanish voluntary health
    insurance (VHI) markets, and the emerging Canadian supplemental benefits market (~CAD $55.9B). The
    core French TAM is dominated by 51 insurer groups capturing 85% of premiums; Alan holds below 1%
    market share despite €785M ARR in 2025, confirming both the scale of the prize and the depth of
    incumbent entrenchment. Key growth drivers include the ANI 2016 private-sector employer mandate,
    the PSC 2025–2026 public-sector extension, rising medical inflation, and AI-driven disruption of
    administrative costs. Structural headwinds include the 100% Santé/RAC0 reform compressing insurer
    margins, high switching inertia in ANI-locked group contracts, multi-jurisdictional regulatory
    complexity, and persistent market concentration. Alan's B2B employer-group SAM across France,
    Belgium, and Spain is approximately €30B, of which current ARR represents ~2.5%; the near-term SOM
    is constrained by sales capacity, brand recognition, and regulatory licensing depth rather than
    market demand. Major sizing gaps remain for Alan's Spanish sub-market and the digitally-addressable
    share of the Canadian market.

sections:
  - id: market-boundary
    title: "Market Boundary & Definition"
    body: >
      Alan operates in the French complémentaire santé (complementary health insurance) market, which
      is structurally distinct from primary social-security health insurance (Assurance Maladie) funded
      through payroll contributions. Complementary health insurance covers the gap between what the
      national health system reimburses and actual healthcare costs—typically copayments, dental, optical,
      hearing aids, specialist fees above tariff, and selected mental-health services. It is financed
      entirely by private premiums, either through employer group ("collectif") contracts or individual
      ("individuel") contracts. As of 2024, ACPR and DREES confirm the French complementary health
      premium pool at approximately €46.5–47.2B in cotisations collectées, making it the largest
      complementary-only insurance market in Europe and the world.

      Three actor families serve this market: mutuelles governed by the Code de la mutualité (249 active
      in 2024, down ~one-third since 2016), institutions de prévoyance (IPs) governed by the Code de la
      sécurité sociale (25 active), and sociétés d'assurance governed by the Code des assurances (99
      active). Market share by premium: assurance companies 56%, mutuelles 26%, IPs 18%. In the
      collective segment (57% of cotisations and Alan's primary hunting ground), assurance companies hold
      54% and IPs hold 30%, with mutuelles at 16%. This concentration reflects both the post-ANI 2016
      shift toward group contracts and decades of M&A activity driven by minimum-capital requirements.
      Fifty-one insurer groups account for 85% of all complementary health cotisations in 2024.

      The French market's defining regulatory features are: (1) the ANI 2016 reform, which since
      1 January 2016 mandates all private-sector employers to offer ACPR-compliant group health coverage
      with at least 50% employer premium co-payment—creating the backbone of Alan's target B2B segment;
      (2) the Contrats responsables framework, which constrains product design by mandating minimum and
      maximum reimbursement levels for all compliant contracts, limiting underwriting differentiation;
      (3) the 100% Santé/RAC0 reform (2019–2021), which mandates zero-out-of-pocket baskets for dental
      prostheses, hearing aids, and glasses, increasing claims costs for all insurers; and (4) the PSC
      reform (Protection Sociale Complémentaire), which extends the ANI-style employer mandate to the
      French public sector, with implementation from 1 January 2025 for most State ministries and
      1 January 2026 for the remaining ministries (Education, Higher Education, Sports) and territorial/
      hospital public employers.

      Adjacent and excluded spend: Alan's offering does not cover primary statutory social-security
      contributions, long-term care (dépendance) insurance (a distinct product class in France), personal
      accident insurance (dommages corporels autres), or private acute-hospital insurance as a standalone.
      Alan's platform subscription fees (12–14% of premium equivalent) fund digital services and are not
      counted in official complementary health premium statistics—creating a modest dual-revenue layer
      on top of insurance cotisations.

      Internationally, Alan is active in Belgium's supplementary health insurance market (~€2.5B GWP),
      Spain's voluntary health insurance (VHI) market (size requires separate estimation—see evidence
      gap GM001), and Canada's employer-supplemental benefits market (~CAD $55.9B in 2022 premiums).
      Each market carries distinct regulatory licensing (FSMA/Belgium, DGSFP/Spain, OSFI/Canada), distinct
      product conventions, and distinct incumbent dynamics. Belgium and Spain are currently loss-making
      for Alan, while France achieved operational profitability in 2025.
