  - id: market-sizing
    title: "Market Sizing — TAM, SAM, and SOM"
    body: >
      The Total Addressable Market (TAM) for Alan is the universe of private complementary health
      insurance premiums in the geographies where it is licensed. In France, the single largest market,
      ACPR Analysis & Synthesis No. 178 (December 2025) confirms €47.2B in health-only complementary
      premiums for 2024; DREES's parallel 2025 annual report records €46.5B in cotisations for the same
      year (methodology differences explained by ACPR including certain border activity). France Assureurs
      reports €46.8B in health-segment cotisations with +7.6% growth in 2024. All three primary sources
      converge on a €46–47B French complementary health premium pool growing at roughly 7–8% annually.

      Belgium adds approximately €2.5B in supplementary health gross written premiums (KPMG 2024 study),
      of which €1.5B is handled by private insurers and €1B by mutualities. The Belgian market is mature
      with low annual growth (~3.6% CAGR 2018–22). Spain's total health insurance market is estimated at
      approximately $41.77B USD in 2024 by Market Research Future; however, this figure includes the
      public Sistema Nacional de Salud, which is tax-funded, not insurance-premium-funded. The relevant
      private VHI/complementary segment in Spain is substantially smaller—Alan has not publicly disclosed
      a Spain-specific market size, and no authoritative regulator-published figure for Spanish private
      complementary premiums alone was identified (see evidence gap GM001). Canada's private employer
      supplemental benefits market collected CAD $55.9B in premiums in 2022 (CHLIA via HelloSafe),
      90% via group plans; this market is heavily concentrated (Manulife at 20%, Sun Life at 15%)
      and structurally different from French complémentaire santé.

      The Serviceable Available Market (SAM)—the portion Alan can realistically target with its B2B
      employer-group digital proposition—centres on collective (group) employer contracts in France,
      Belgium, and Spain. In France, group/collective contracts represent 57% of total complementary
      health cotisations, implying a French group SAM of approximately €26.7B. Belgium's collective
      supplementary health segment totals approximately €950M in GWP. Spain's employer-group VHI share
      is not precisely quantified but is estimated at €2–4B based on proportionate methodology (see
      evidence gap GM001). Combined France+Belgium+Spain B2B SAM: approximately €28–32B. Canada's group
      market (~90% of CAD $55.9B = ~CAD $50B) is large but Alan is in an early-stage commercial
      footprint (1,600+ members) and faces dominant incumbents; it is excluded from the near-term SAM
      calculation.

      Alan's Serviceable Obtainable Market (SOM) is evidenced by its current and target ARR trajectory.
      With €785M ARR in 2025 across France, Belgium, and Spain, and targeting €1B in 2026, Alan
      represents approximately 2.5–3.3% of the combined France+Belgium B2B employer group premium SAM.
      CEO Jean-Charles Samuelian-Werve has confirmed the company has not yet reached 1% market share
      in any of its operating markets—consistent with the math: €785M against a ~€47B French market
      implies ~1.7% penetration on total premiums, and less when Alan's 12–14% platform subscription
      margin is excluded from the premium-equivalent comparison. The SOM growth path depends on annual
      contract churn in the incumbent base, Alan's B2B sales capacity, and speed of PSC reform
      implementation for the public-sector segment. A scenario analysis using 40% ARR CAGR (management
      guidance) implies a €3–5B ARR SOM within five years—still below 10% of the French+Belgian
      employer group market.
