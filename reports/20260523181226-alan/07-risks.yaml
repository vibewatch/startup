  - id: cybersecurity-and-data-privacy-risks
    title: Cybersecurity and Data Privacy Risks
    body: >
      Alan's most material operational risk is its structural dependence on Almerys, the third-party tiers-payant operator that processes all health-reimbursement transactions. Almerys has been compromised twice in 24 months: a January 2024 attack exposed data on 33 million French insured persons (the CNIL opened a formal investigation); and a second attack in May 2026—confirmed on the run-date of this report—again exposed Alan member records including names, birth dates, social-security numbers, member numbers, and coverage details. An estimated 15.5 million unique social-security numbers appeared in the file offered for sale; because one social-security number links to multiple family members, the total individuals at risk is substantially higher. Alan confirmed that banking data, health-treatment details, passwords, and contact information were not compromised in 2026, and that no intrusion reached Alan's own servers. However, the ACPR and CNIL were immediately notified and investigations are open. This is not a one-off event: Almerys is a shared infrastructure dependency for Alan, MGEN, Harmonie Mutuelle, and AG2R La Mondiale, making Alan a systematic indirect beneficiary—and indirect hostage—of that operator's security posture. Separately, Alan hosts all member health data on Amazon Web Services (AWS), whose EU data centres hold HDS (Hébergeur de Données de Santé) certification. Yet AWS remains subject to US extraterritorial legal instruments (Cloud Act, FISA Section 702), which prompted French parliamentarian Philippe Latombe to file question QANR5L17QE7230 asking whether the government would require Alan to migrate to a SecNumCloud-certified sovereign provider. France's concurrent exclusion of AWS, Microsoft Azure, and Google from the national Health Data Hub tender further signals a tightening political consensus on data sovereignty that could eventually mandate a costly platform migration for Alan's public-sector contracts.
    claimRefs:
      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
    tableRefs:
      - TR002

  - id: partner-and-dependency-risks
    title: Partner and Dependency Risks
    body: >
      Alan's risk transfer programme relies on a concentrated panel of reinsurance partners. For French health business, Alan Insurance cedes 49% of net premium to Swiss Re, GenRe, and CNP Assurances under a 50% nominal quota-share arrangement. Prévoyance (disability, life) risk is reinsured at 80% with Hannover Re from 2025, supplemented by a GenRe excess-of-loss treaty for extreme arrêt-de-travail scenarios. Belgian health is ceded at 60% jointly to Swiss Re and Belfius Insurance, whose parent Belfius Bank is also a strategic investor in Alan. This Belfius dual role—reinsurer and investor—creates a conflict-of-interest dimension to monitor: a deterioration in Belfius's own financial position or a strategic shift could simultaneously impair both Alan's capital base and its Belgian reinsurance programme. The SFCR 2024 discloses that counterparty risk (reinsurer and banking-partner credit risk) is the second-largest SCR component at €19.6 million (24.5% before diversification), reflecting the materiality of this dependency. Reinsurance cost in 2024 was net negative at −€1.8 million, indicating a drag during a growth phase when risk-transfer costs are front-loaded relative to maturing claim-experience credits. On the technology-infrastructure side, the AWS dependency noted in the cyber section extends to operations broadly: Alan's entire platform—claims management, member app, tiers-payant connectivity, and AI systems—runs on AWS infrastructure. An AWS region outage or a legal challenge under French data-localisation policy would simultaneously affect all geographies and all product lines. Alan has ISO 27001 certification and conducts penetration tests, but DORA now mandates a documented exit plan for every critical ICT third-party provider, placing the Almerys and AWS dependencies under formal regulatory scrutiny.
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR026
      - CR027
      - CR028
