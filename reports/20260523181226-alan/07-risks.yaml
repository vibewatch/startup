callouts:
  - calloutType: risk
    title: Almerys Structural Dependency Is an Unmitigated Critical Risk
    body: >
      Alan has now experienced two data-breach incidents via its sole tiers-payant operator Almerys within 24 months. Both breaches exposed social-security numbers at scale, triggering CNIL and ACPR investigations. This is not a contingent risk—it is a demonstrated, repeating exposure. Alan's DORA obligation to maintain an ICT third-party exit plan and map critical dependencies makes Almerys the single most urgent diligence item. Until Alan either diversifies tiers-payant providers or internalises key payment-processing functions, this critical-severity, high-likelihood risk will persist.
    claimRefs:
      - CR013
      - CR014
      - CR033
      - CR034

  - calloutType: risk
    title: AWS Hosting Creates a Sovereign-Risk Overhang on Public Sector Contracts
    body: >
      Alan's decision to host all member health data on AWS is currently legal and HDS-compliant, but a French political consensus is forming to exclude US hyperscalers from sensitive public-sector health data. A parliamentary question has already been filed. The concurrent exclusion of AWS from the Health Data Hub contract signals the direction of travel. For an insurer managing data on 130,000 government employees at Bercy—and potentially more civil servants in future procurement cycles—forced migration to SecNumCloud could cost tens of millions of euros and threaten contract renewal eligibility.
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022

  - calloutType: insight
    title: Solvency II Buffer Is Strong but Revised Directive Introduces New Unknowns
    body: >
      Alan's 4.6x SCR coverage at end-2024 is well above the sector median and provides a meaningful shock absorber. However, the revised Solvency II directive—entering transposition across member states from 2026—introduces eight technical measures that will change yield-curve extrapolation, rate-shock factors, and Volatility Adjustment calculations. Alan should produce and disclose its own impact assessment of the revised directive before investors can judge how durable the current buffer is under the new standard formula.
    claimRefs:
      - CR002
      - CR004
      - CR005
      - CR041

