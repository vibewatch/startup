  - id: operational-and-execution-risks
    title: Operational and Execution Risks
    body: >
      Alan's digital-only service model—no telephone line, all support via in-app chat—is a structural vulnerability for complex claims. Customer reviews on platforms including Goodassur, Opinion Assurances, and Selectra consistently surface frustration with maternity reimbursements, inconsistent partial-coverage decisions, and delays when cases fall outside standard automation pathways. These reviews represent adverse sentiment that predates and supplements the data-breach risk. Health-cost inflation was flagged in Alan's own SFCR 2024 as a factor that exceeded actuarial forecasts in 2024, adversely affecting technical equilibrium. This underwriting risk is partly mitigated through annual repricing rights and quota-share reinsurance, but rapid member growth (686,000 at end-2024; 1,059,000 at end-2025) raises the absolute stakes of any tariff misjudgement. Geographic concentration remains high: France accounted for 87% of insured at end-2024, and the public-sector segment—while strategically important—introduces a new customer-concentration risk if a single large contract (like Bercy's 130,000 agents) is repriced, not renewed, or politically disrupted. The SFCR identifies operational SCR at €8.9 million (11.2%), driven by system-failure and fraud risk in the company's highly automated, high-volume transaction processing environment. Alan's international expansion into Canada, Belgium, and Spain creates simultaneous multi-regulatory compliance pressure: different solvency frameworks, distinct data-protection regimes, varying procurement rules, and local talent demands. The company is majority-France staffed and culture-intensive (radical transparency culture documented in the SFCR), which may create friction as it scales geographically. The EU AI Act's August 2026 deadline for high-risk AI systems—specifically applicable to any underwriting or claims-scoring algorithm that influences coverage decisions for natural persons—adds a compliance burden that requires conformity assessments, bias-testing infrastructure, and technical documentation not normally part of an insurer's product-development workflow.
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR036
      - CR037
      - CR038
      - CR039
      - CR044
