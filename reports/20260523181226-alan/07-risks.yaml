company:
  name: Alan

chapter:
  number: 7
  title: Risks
  summary: >
    Alan faces a layered risk profile spanning regulatory, cyber, partner, operational, and execution dimensions. The most material near-term exposures are: (1) a structural third-party cyber dependency on payment processor Almerys—breached twice in two years, exposing millions of Alan members' social-security numbers—creating ongoing CNIL and ACPR investigation risk; (2) AWS cloud-hosting of civil-servant health data under US extraterritorial law, challenged by parliament and facing possible forced migration to a sovereign SecNumCloud provider; (3) EU AI Act high-risk classification of underwriting AI with an August 2, 2026 full-compliance deadline carrying up to €15 M or 3% of global revenue in penalties; and (4) DORA enforcement maturation in 2026 with ACPR shifting from pedagogy to audit and first TLPT penetration tests for significant insurers. Legal risk from the MGEFI public-procurement challenge has cleared its injunction phase but a merits case remains live. Solvency II coverage is strong (4.6× SCR at end-2024), but the revised Solvency II directive entering into force in 2026 introduces eight new capital calculation changes that Alan must quantify.

sections:
  - id: regulatory-and-legal-risk-landscape
    title: Regulatory and Legal Risk Landscape
    body: >
      Alan Insurance SA operates as a licensed health and provident insurer under the supervision of France's Autorité de contrôle prudentiel et de résolution (ACPR), bound by the full Solvency II framework. Alan's own 2024 SFCR discloses €294 million in own funds covering the Solvency Capital Requirement 4.6 times and the Minimum Capital Requirement more than 18 times—comfortably above the sector minimum. However, the revised Solvency II directive now applies across EU member states from 2026, introducing eight technical recalibrations—including new yield-curve extrapolation methods, revised rate-shock factors, and a reformulated Volatility Adjustment—that Alan must model to confirm its capital adequacy position does not deteriorate under the new standard-formula parameters. The ACPR's published 2026 work programme identifies regulatory simplification, governance, AI supervision, and DORA implementation as its five priority axes. Particular pressure falls on Axis 3 (DORA cyber/operational resilience) and Axis 4 (AI risk supervision), both of which bear directly on Alan's technology-centric model. In the public-procurement arena, Alan's Bercy contract for 130,000 civil servants launched on 1 January 2026 after the displaced mutual MGEFI filed a référé précontractuel; the Tribunal administratif de Paris rejected this injunction on 20 June 2025 (ordonnance #2514913/4-1), validating the procurement procedure. MGEFI has signalled intent to pursue a merits challenge on the substance of the award, which leaves a non-trivial litigation tail risk. Trade unions representing the seven Bercy unions publicly opposed the transition, citing data-sovereignty and service-quality concerns, adding political complexity to contract continuity. Finally, the EU AI Act classifies health-insurance underwriting algorithms as high-risk AI systems; compliance obligations for Alan's MO AI system and any claims-scoring algorithms activate on 2 August 2026, with penalties reaching €15 million or 3% of global annual turnover.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR010
