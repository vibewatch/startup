summary:
  headline: >-
    Alan has built the strongest full-stack digital health-insurance franchise in France, but unresolved underwriting
    opacity, cyber dependency, and public-sector concentration keep the current €5B valuation in watchlist rather than
    buy territory.
  overallScore: 7.1
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
