    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 815
    customerCount: 1100000
    headcount: 790
  topStrengths:
    - >-
      Integrated insurer-plus-care-plus-prevention model creates a user experience and engagement moat that legacy
      mutuelles still struggle to match.
    - >-
      Growth remains exceptional for a regulated insurer: ARR reached €804M in Q1 2026 with 1.1M members and 37,000+
      covered organizations.
    - >-
      Capital adequacy is strong, with eligible own funds above €374M and a Solvency II buffer above 3.6x required
      capital.
  topRisks:
    - >-
      Almerys dependency has produced repeated third-party breach exposure, creating ongoing cyber, reputational, and
      regulatory risk.
    - >-
      Public investors still cannot see loss ratio, combined ratio, audited consolidated accounts, or per-country P&L,
      limiting conviction on profit durability.
    - >-
      Public-sector wins, especially Bercy, improve growth but add concentration, procurement, and data-sovereignty
      risk.
  unresolvedGaps:
    - Actual health and prévoyance loss ratios, combined ratio, and reinsurance economics are not publicly disclosed.
    - Per-country revenue, margin, and cash-burn detail for Belgium, Spain, and Canada remain private.
    - Retention, NRR, churn, and cohort behavior are not public; customer durability can only be inferred from proxies.
    - >-
      The long-term remediation path for cyber dependency, SecNumCloud migration, and AI Act compliance is not yet
      publicly quantified.
