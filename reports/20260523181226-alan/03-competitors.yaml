callouts:
  - calloutType: strength
    title: "Alan's Reimbursement Speed Is an Unmatched Competitive Advantage"
    body: >
      Processing more than 70% of reimbursements in under one hour versus the 3–5 day
      standard for most incumbent mutuelles creates a measurable and verifiable product gap.
      This speed advantage is not a UX polish difference but a structural output of Alan's
      fully automated claims pipeline — and it directly addresses members' most common
      friction point with health insurance. As long as incumbents depend on partially
      manual or legacy-integrated claims systems, this advantage is durable.
    claimRefs: [CP026, CP029]

  - calloutType: risk
    title: "CCN-Locked Distribution Is Alan's Largest Structural Gap"
    body: >
      AG2R, Malakoff Humanis, and Generali/Klesia administer mandatory CCN health coverage
      for dozens of professional branches, giving them captive distribution that renews
      automatically unless the CCN is renegotiated. Alan cannot access this channel without
      winning sectoral tenders or partnering with paritaire institutions — a process that
      takes years and requires union-employer co-operation not naturally aligned with a
      digital insurer. This is the most durable structural moat available to incumbents
      and represents Alan's clearest inorganic growth ceiling.
    claimRefs: [CP014, CP039, CP041]

  - calloutType: insight
    title: "Doctolib Is a Complement, Not a Competitor"
    body: >
      Doctolib's core value proposition — reducing administrative burden for healthcare
      providers — is orthogonal to Alan's — reducing friction for employer-sponsored
      health insurance members. Both benefit from digital healthcare adoption, and Alan
      members may book care providers via Doctolib. The risk of competitive overlap
      materialises only if Doctolib moves into insurance carrier or risk-bearing services,
      which its 2026–2029 roadmap does not indicate.
    claimRefs: [CP022, CP037, CP045]

