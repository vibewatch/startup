companyProfile:
  summary: >-
    Alan is a Paris-founded digital health insurer established in 2016 by Jean-Charles Samuelian-Werve and Charles
    Gorintin. It operates as an ACPR-licensed complementary health insurer and has expanded from France into Belgium,
    Spain, and Canada with an integrated model that combines insurance administration, rapid reimbursements, virtual care,
    prevention, and member engagement in a single app. By Q1 2026 Alan reported 1.1 million members, 37,000+ covered
    organizations, €804 million of ARR, and a €5 billion post-money valuation, but the group remains short of full
    consolidated profitability and still withholds core underwriting and retention metrics from public investors.
