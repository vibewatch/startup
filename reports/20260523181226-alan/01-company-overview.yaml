callouts:
  - calloutType: strength
    title: "Regulatory Capital Fortress"
    body: >
      Alan maintains regulatory capital of more than €374M against a ~€105M ACPR requirement—a
      coverage ratio exceeding 3.6×. At a reported ~450% solvency ratio (2023 SFCR), Alan sits
      well above both the French market average of ~241% and the regulatory floor of 100%. This
      positions the company to absorb adverse claims shocks and fund international expansion
      without emergency capital events, while its liquid-only investment policy avoids mark-to-
      market volatility risk.
    claimRefs: [CO022, CO035, CO036]

  - calloutType: risk
    title: "Third-Party Data Breach via Almerys (May 2026)"
    body: >
      The Almerys cyberattack disclosed on 23 May 2026 represents a material operational and
      reputational risk. As Alan's third-party payment processor, Almerys's breach exposed
      Social Security numbers, contract identifiers, and civil-status data for an undisclosed
      number of Alan members. This is a recurring-vendor risk: the same operator suffered a 2024
      breach affecting 33M French citizens. ACPR and CNIL have been notified, but regulatory
      action, member litigation, or commercial reputational damage cannot be excluded. Diligence
      should track whether Alan has commenced alternative vendor sourcing for tiers-payant
      processing.
    claimRefs: [CO032, CO033, CO034]

