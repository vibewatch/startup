company:
  name: "Alan"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Alan is France's first full-stack digital health insurer licensed since 1986, founded in
    February 2016 by Jean-Charles Samuelian-Werve and Charles Gorintin. The company has grown
    to serve 1M+ members across 37,000 businesses in France, Belgium, Spain, and Canada, with
    ARR of €804M as of Q1 2026 and a €5B post-money valuation following a March 2026 €100M
    funding round. Alan's complementary-insurer model—ACPR-licensed coverage combined with a
    digital prevention and care platform—positions it as a rapidly scaling European healthtech
    leader, though the company remains group-loss-making and a May 2026 third-party data
    breach incident at Almerys introduced fresh operational and reputational risk.

sections:
  - id: company-identity
    title: "Identity, Mission & Business Model"
    body: >
      Alan was incorporated on 10 February 2016 in Paris and became the first new independent
      health insurance company to receive an ACPR licence in France since 1986—a market where
      ten players control two-thirds of a €47.2B complementary-health premium pool. The company's
      name is a deliberate tribute to two Alans: Alan Turing, the father of modern computing, and
      Alan Watts, the philosopher of personal integration and well-being, expressing the founders'
      thesis that technology and human flourishing are inseparable.

      Alan describes itself as a "health partner" rather than merely an insurer. Its business model
      has two intertwined revenue streams: (1) ACPR-licensed complementary health insurance premiums
      priced on an equilibrium principle—the company targets zero margin between collected premiums
      and paid reimbursements—and (2) a per-member subscription that funds its digital platform,
      virtual clinic, prevention tools, and AI services. This twin-engine design is intended to
      remove the adversarial premium-extraction dynamic of traditional insurers and instead earn
      margin through platform engagement and scale economics.

      Alan targets French and European employers of all sizes, including large enterprises, SMEs,
      freelancers, and—since 2025—the French civil service. Its proposition rests on radical
      operational speed (70% of reimbursements in under one hour, 99% within 24 hours, and a
      20-second average phone response), a fully digital member experience via a mobile app, and an
      expanding suite of ancillary services: a virtual clinic (Clinique Alan) open seven days a
      week, the Alan Play gamified wellness programme, optical ordering, physiotherapy content, and
      the Mo AI health assistant launched in November 2024.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO037, CO043]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founders-leadership
    title: "Founders, Leadership & Corporate Governance"
    body: >
      Jean-Charles Samuelian-Werve (CEO) and Charles Gorintin (CTO) are the sole co-founders
      and remain executive leaders of the company a decade after launch. Samuelian-Werve previously
      co-founded Expliseat, the creator of the world's lightest certified economy aircraft seat; he
      holds an MSc in Engineering from École des Ponts ParisTech, an MBA from Collège des
      Ingénieurs, and membership in the French Institute of Actuaries. He was awarded the Ordre
      National du Mérite in 2021. Gorintin was a data science leader at Facebook, Instagram, and
      Twitter before Alan, focusing on social network growth and fraud; his academic credentials span
      École des Ponts ParisTech, ENS Paris-Saclay (Machine Learning), and UC Berkeley's Haas School
      of Business (Financial Engineering).

      Both founders are also non-operating co-founders and board members of Mistral AI, the Paris-
      based large-language-model company founded in April 2023 and valued at approximately €12B.
      Alan itself holds a minority stake in Mistral. The intertwining of insurance and AI strategy
      is central to Samuelian-Werve's "methodic optimist" worldview: technology can improve
      healthcare quality at scale, but only if paired with sound insurance and clinical operations.

      Alan's senior management team includes Mihaela Albu (Finance & Strategy, ex-McKinsey
      Associate Partner, INSEAD MBA), Paul Sauveplane (General Secretary and HRD, ex-ACPR and
      Inspection Générale des Finances, the architect of Alan's ACPR licensing process), Marion
      Bergeret (Corporate/Legal, ex-Oxford, UC Berkeley, and AI startup Snips), Laurent Guérin
      (Insurance, ex-French Treasury, École Polytechnique/MIT), and country GMs for France (Fabrice
      Staad), Belgium (Sébastien Fredeau), Spain (Yoann Artus), and Canada (Mark Goad, ex-Curv
      Health and OMERS Ventures). Jan Hammer of Index Ventures has been a board member since
      Alan's Series A in 2018.

      A key governance feature: founders and employees collectively hold more than 40% of Alan's
      capital and maintain a majority of voting rights, insulating strategy from single-investor
      control despite eight funding rounds totalling ~€754M.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO002]

  - id: funding-capital
    title: "Funding History & Capital Structure"
    body: >
      Alan has completed eight funding events since inception, accumulating approximately €754M in
      equity capital and reaching a post-money valuation of €5B as of March 2026—representing a
      30% step-up from the €4B valuation set in September 2024. The fundraising arc reflects the
      successive de-risking of the business: early rounds with Partech Ventures, CNP Assurances, and
      Power Financial of Canada funded the ACPR licensing and market entry; Index Ventures led Series
      A and Series B to scale beyond start-ups and SMEs; Temasek (Singapore sovereign wealth fund)
      added Series C capital during the COVID-accelerated digital-health wave; Ontario Teachers'
      Pension Plan led Series E at the €2.7B mark, signalling that Alan had category-defining scale;
      and Belgian bank-insurer Belfius led Series F in 2024 at €4B, coupling distribution rights
      with capital.

      The March 2026 €100M round was led by Index Ventures through its growth fund and joined by new
      institutional investors Greenoaks (San Francisco) and Kaaf (Dubai), strategic partner Belfius,
      and family office SH. Business angels Tobi Lütke (Shopify CEO), Antoine Griezmann (footballer,
      2018 World Cup winner), Mike Katchen (Wealthsimple CEO), and Kylian Mbappé (via Coalition
      Capital) participated, reflecting both Alan's cultural weight in France and its ambition as a
      consumer brand.

      Alan's balance sheet shows regulatory capital exceeding €374M—more than 3.6 times the
      ~€105M regulatory minimum required by ACPR for group-level operations—with the majority
      held in liquid deposit accounts. Reinsurance partners (Swiss Re, GenRe, CNP Assurances,
      Hannover Re, Belfius Insurance) further cap exposure to healthcare cost volatility. Cash
      reserve was reported at approximately €376M following the March 2026 close.
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO035]
    tableRefs: [TO003]

  - id: metrics-scale
    title: "Operating Metrics, Scale & Geographic Reach"
    body: >
      Alan's ARR trajectory is the clearest signal of its momentum: from €340M in 2023 to €505M
      in 2024 (+48%), €785M for FY2025 (+53%), and €804M already in Q1 2026 alone against a
      full-year €1B target. Member count crossed one million (exactly 1,059,000 at end-2025, +52%
      YoY), served across 37,000+ businesses. Headcount stands at approximately 790+ as of April
      2026, up from ~600 in 2024, with hiring concentrated in Canada and Belgium.

      France remains the dominant market, where Alan insures over 700,000 members and achieved
      operational profitability in 2025—a structural milestone confirming the unit economics of the
      French book. Net loss at group level improved from €39M in 2023 to €34M in 2024 and further
      to €26M in 2025, with losses as a share of ARR falling substantially. Group-level profitability
      is targeted by 2027.

      Belgium is Alan's second-largest market, with a Belfius distribution partnership giving access
      to millions of potential employees of Belfius's corporate clients. Spain grew members 42% in
      2025 and counts HP and Volkswagen among its clients. Canada, launched commercially in early
      2025, is now licensed nationwide; the Quebec rollout began in January 2026, and the company
      serves over 1,600 members in Canada with plans to expand to Montreal. Alan's October 2024
      OSFI licence made it the first new health insurance company in Canada since 1957.

      Public-sector penetration has emerged as a material growth vector: in May 2025, Alan won the
      French Ministry of Economy and Finance complementary health tender covering up to 135,000
      civil servants (potentially 300,000 with dependants). It had previously won contracts for the
      Prime Minister's Office and the Ministry of Ecological Transition.
    claimRefs: [CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO044]
    figureRefs: [FO003]

  - id: milestones-regulatory
    title: "Milestones, Regulatory Standing & Risk Landscape"
    body: >
      Alan's regulatory standing is a foundational strength. Its ACPR authorisation of 20 October
      2016 (Decision n° 2016-C-72) was the first granted to a new French insurer in three decades,
      and the company has maintained a solvency ratio reported at ~450% in 2023—roughly double the
      French market average of ~241% and well above the regulatory minimum. Paul Sauveplane, who
      spearheaded the ACPR licensing process in 2016, remains General Secretary, providing
      institutional continuity on regulatory matters.

      The most material adverse event as of the runDate is the Almerys cyberattack disclosed on
      23 May 2026. Almerys, Alan's third-party payment operator, was breached by a threat actor
      claiming to have accessed over 44 million records and 15 million unique Social Security
      numbers. For Alan members, exposed data includes civil status, date of birth, Social Security
      number, contract number, and insurer name; banking data, health records, and contact details
      were reportedly unaffected. Alan took the affected platform offline, notified ACPR and CNIL,
      and committed to individually informing all members whose data was compromised. As of 23 May
      2026, the total number of affected Alan members remained undisclosed. This is the second major
      Almerys incident: the January 2024 breach alongside Viamedis exposed data of 33 million
      French citizens per CNIL records.

      Independent analysts have also questioned Alan's valuation trajectory. Matteo Carbone of the
      IoT Insurance Observatory called the €4B Series F valuation "unrealistic," citing premium
      levels and persistent losses; the counter-thesis centres on Alan's technology premium and
      growth curve. The valuation step-up to €5B in March 2026 while still group-loss-making will
      remain a diligence focal point for prospective investors.
    claimRefs: [CO032, CO033, CO034, CO036, CO038, CO039, CO040, CO041, CO042, CO045]
    tableRefs: [TO004]
    figureRefs: [FO001]

