      - number: '2.4'
        title: Growth Drivers, Adoption Friction & Structural Constraints
        blocks:
          - type: paragraph
            body: >
              The French complementary health market's growth is structurally underpinned by the ANI 2016 mandate, which
              created a predictable, stable premium pool of employer group contracts and drove group cotisations to 57%
              of all complementary health premiums. The PSC reform (2025–2026) extends this logic to the French public
              sector—3.5 million civil servants across State, territorial, and hospital employers— opening a large,
              previously untapped employer segment where Alan has already demonstrated competitive success. Medical
              inflation further sustains premium growth: France Assureurs confirms +7.6% cotisations growth in 2024,
              driven by both tariff increases and a rising number of contracts. DREES records +8.2% growth, the highest
              since 2012, with 2024 being the first year the overall technical result turned positive since 2011,
              signalling that insurers have begun restoring margins after several loss-making years.

              Digital transformation is a secular demand driver: Alan's Q4 2024 shareholders' letter documents 81% of
              patients chose AI-assisted consultation (Mo) over traditional doctor interaction; 35% weekly engagement on
              Alan Walk (gamified prevention); and a 50% productivity improvement in the sales team from AI tools.
              Deloitte's 2024 Belgian health insurance consumer study confirms 27% of young Belgian adults (25–34) use
              health apps, driving insurer product innovation toward digital-native platforms. European Insurtech market
              is growing at an estimated CAGR of 52% through 2031, confirming investor and operator appetite for digital
              disruption of traditional insurance (Cognitive Market Research 2024).

              The most material structural headwind is the 100% Santé/RAC0 reform, implemented 2019–2021 but continuing
              to push claims higher. DREES's English-language study confirms premiums rose 12% at age 85 and 7% at age
              60 for individual contract holders, CHI organisations paid an extra €2.1B for covered items, and the use
              of hearing aids rose 75% (and dental prostheses/glasses 17%) between 2019 and 2021. This reform
              structurally increases loss ratios for all complementary health insurers, and the claims inflation is
              continuing as coverage awareness grows; the DREES 2025 report records that prestations grew +5.4% in 2024,
              faster than core healthcare inflation. For Alan, which targets equilibrium premiums (zero technical margin
              on insurance), higher structural claims costs mean the subscription margin must bear more burden.

              A second headwind is the concentration and entrenchment of incumbents. Fifty-one groups control 85% of the
              French complementary health market. The top institutions de prévoyance (Malakoff Humanis, Klesia, AG2R La
              Mondiale) dominate the collective segment through branch-level agreements (accords de branche) that
              designate a specific insurer for an entire professional sector—locking employers into incumbents
              regardless of price or service quality. These mandatory designation clauses were partially struck down by
              the Conseil Constitutionnel in 2013 but voluntary designation arrangements remain common and create
              structural inertia.

              A third headwind is multi-jurisdictional regulatory complexity. Alan's international expansion requires
              maintaining separate ACPR (France), FSMA (Belgium), DGSFP (Spain), and OSFI (Canada) licenses—each with
              distinct solvency requirements, product mandates, and data privacy rules. The Almerys cyberattack of May
              2026, involving Alan's third-party payment operator, introduced fresh compliance risk under both ACPR and
              CNIL frameworks and underscores the operational risk of relying on third-party infrastructure in a heavily
              regulated market. Finally, Alan's valuation at €5B while group-loss-making and <1% market share has
              attracted external scrutiny from analysts such as Matteo Carbone (IoT Insurance Observatory), who cited
              the valuation as "unrealistic" relative to premiums and persistent losses, creating a
              diligence-sensitivity headwind for any primary transaction or secondary sale.
