      - number: '7.3'
        title: Partner and Dependency Risks
        blocks:
          - type: paragraph
            body: >
              Alan's risk transfer programme relies on a concentrated panel of reinsurance partners. For French health
              business, Alan Insurance cedes 49% of net premium to Swiss Re, GenRe, and CNP Assurances under a 50%
              nominal quota-share arrangement. Prévoyance (disability, life) risk is reinsured at 80% with Hannover Re
              from 2025, supplemented by a GenRe excess-of-loss treaty for extreme arrêt-de-travail scenarios. Belgian
              health is ceded at 60% jointly to Swiss Re and Belfius Insurance, whose parent Belfius Bank is also a
              strategic investor in Alan. This Belfius dual role—reinsurer and investor—creates a conflict-of-interest
              dimension to monitor: a deterioration in Belfius's own financial position or a strategic shift could
              simultaneously impair both Alan's capital base and its Belgian reinsurance programme. The SFCR 2024
              discloses that counterparty risk (reinsurer and banking-partner credit risk) is the second-largest SCR
              component at €19.6 million (24.5% before diversification), reflecting the materiality of this dependency.
              Reinsurance cost in 2024 was net negative at −€1.8 million, indicating a drag during a growth phase when
              risk-transfer costs are front-loaded relative to maturing claim-experience credits. On the
              technology-infrastructure side, the AWS dependency noted in the cyber section extends to operations
              broadly: Alan's entire platform—claims management, member app, tiers-payant connectivity, and AI
              systems—runs on AWS infrastructure. An AWS region outage or a legal challenge under French
              data-localisation policy would simultaneously affect all geographies and all product lines. Alan has ISO
              27001 certification and conducts penetration tests, but DORA now mandates a documented exit plan for every
              critical ICT third-party provider, placing the Almerys and AWS dependencies under formal regulatory
              scrutiny.
