      - number: '7.5'
        title: Mitigations, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Alan has built meaningful first-generation mitigations against its key risks. Solvency II coverage at 4.6×
              SCR and 18× MCR provides a substantial capital buffer; the company maintains liquidity almost entirely in
              short-duration cash deposits at tier-1 banking partners, minimising market and liquidity risk. Reinsurance
              diversification across five counterparties (Swiss Re, GenRe, CNP, Hannover Re, Belfius Insurance) reduces
              single-counterparty default risk even if credit concentration in the Swiss Re/GenRe panel warrants
              monitoring. ISO 27001 certification and regular penetration testing demonstrate a baseline security
              posture above French insurance norms, though the Almerys breach exposures reveal the limits of perimeter
              security when critical dependencies are shared infrastructure. The ACPR and CNIL notification workflows
              triggered promptly after both Almerys breaches, and Alan's public communications were rapid and
              transparent, limiting acute reputational damage. On the procurement litigation front, the Tribunal
              administratif rejection of the MGEFI injunction reduced near-term contract risk, though the merits case
              creates an ongoing overhang. Investors should define clear tripwires for thesis-break scenarios: a CNIL
              formal sanction or fine exceeding €5 million; ACPR mandatory capital add-on under Pillar 2; MGEFI
              merits-case success reversing Bercy contract; forced SecNumCloud migration costing more than €50 million;
              EU AI Act non-compliance enforcement action before August 2026 rectification; or net loss for 2026
              (group-wide) at a rate above 5% of ARR, signalling that the France profitability milestone is reversing
