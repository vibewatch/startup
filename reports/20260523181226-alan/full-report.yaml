      - number: '7.2'
        title: Cybersecurity and Data Privacy Risks
        blocks:
          - type: paragraph
            body: >
              Alan's most material operational risk is its structural dependence on Almerys, the third-party
              tiers-payant operator that processes all health-reimbursement transactions. Almerys has been compromised
              twice in 24 months: a January 2024 attack exposed data on 33 million French insured persons (the CNIL
              opened a formal investigation); and a second attack in May 2026—confirmed on the run-date of this
              report—again exposed Alan member records including names, birth dates, social-security numbers, member
              numbers, and coverage details. An estimated 15.5 million unique social-security numbers appeared in the
              file offered for sale; because one social-security number links to multiple family members, the total
              individuals at risk is substantially higher. Alan confirmed that banking data, health-treatment details,
              passwords, and contact information were not compromised in 2026, and that no intrusion reached Alan's own
              servers. However, the ACPR and CNIL were immediately notified and investigations are open. This is not a
              one-off event: Almerys is a shared infrastructure dependency for Alan, MGEN, Harmonie Mutuelle, and AG2R
              La Mondiale, making Alan a systematic indirect beneficiary—and indirect hostage—of that operator's
              security posture. Separately, Alan hosts all member health data on Amazon Web Services (AWS), whose EU
              data centres hold HDS (Hébergeur de Données de Santé) certification. Yet AWS remains subject to US
              extraterritorial legal instruments (Cloud Act, FISA Section 702), which prompted French parliamentarian
              Philippe Latombe to file question QANR5L17QE7230 asking whether the government would require Alan to
              migrate to a SecNumCloud-certified sovereign provider. France's concurrent exclusion of AWS, Microsoft
              Azure, and Google from the national Health Data Hub tender further signals a tightening political
              consensus on data sovereignty that could eventually mandate a costly platform migration for Alan's
              public-sector contracts.
