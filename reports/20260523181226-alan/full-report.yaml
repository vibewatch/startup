  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Landscape
        blocks:
          - type: paragraph
            body: >
              Alan Insurance SA operates as a licensed health and provident insurer under the supervision of France's
              Autorité de contrôle prudentiel et de résolution (ACPR), bound by the full Solvency II framework. Alan's
              own 2024 SFCR discloses €294 million in own funds covering the Solvency Capital Requirement 4.6 times and
              the Minimum Capital Requirement more than 18 times—comfortably above the sector minimum. However, the
              revised Solvency II directive now applies across EU member states from 2026, introducing eight technical
              recalibrations—including new yield-curve extrapolation methods, revised rate-shock factors, and a
              reformulated Volatility Adjustment—that Alan must model to confirm its capital adequacy position does not
              deteriorate under the new standard-formula parameters. The ACPR's published 2026 work programme identifies
              regulatory simplification, governance, AI supervision, and DORA implementation as its five priority axes.
              Particular pressure falls on Axis 3 (DORA cyber/operational resilience) and Axis 4 (AI risk supervision),
              both of which bear directly on Alan's technology-centric model. In the public-procurement arena, Alan's
              Bercy contract for 130,000 civil servants launched on 1 January 2026 after the displaced mutual MGEFI
              filed a référé précontractuel; the Tribunal administratif de Paris rejected this injunction on 20 June
              2025 (ordonnance #2514913/4-1), validating the procurement procedure. MGEFI has signalled intent to pursue
              a merits challenge on the substance of the award, which leaves a non-trivial litigation tail risk. Trade
              unions representing the seven Bercy unions publicly opposed the transition, citing data-sovereignty and
              service-quality concerns, adding political complexity to contract continuity. Finally, the EU AI Act
              classifies health-insurance underwriting algorithms as high-risk AI systems; compliance obligations for
              Alan's MO AI system and any claims-scoring algorithms activate on 2 August 2026, with penalties reaching
              €15 million or 3% of global annual turnover.
