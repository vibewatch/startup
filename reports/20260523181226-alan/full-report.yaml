            title: Solvency Fortress — 3.6× Capital Coverage
            body: >
              Alan holds regulatory own funds exceeding €374M against a Solvency II SCR of approximately €105M—a
              coverage ratio of more than 3.6×, compared to the French complementary health insurance market average of
              241% and the regulatory minimum of 100%. Combined with ~€376M in liquid deposits and a conservative
              investment policy, this creates a multi-year buffer against adverse healthcare cost scenarios, making a
              near-term capital distress event highly unlikely.
            calloutType: strength
            claimRefs:
              - CI019
              - CI020
              - CI021
              - CI022
          - type: callout
            title: 'Adverse Signal: Loss-Figure Discrepancy and No Audited Accounts'
            body: >
              Alan's press-released net loss for FY2024 was approximately €54M (per January 2025 press conference, cited
              by Sifted, TechCrunch, and Obliginfos), while the SFCR-published figure shows -€34M for FY2024 improving
              to -€26M for FY2025. This €20M discrepancy—likely reflecting different accounting scopes (full-group IFRS
              vs. Solvency II entity)—cannot be reconciled without audited consolidated financial statements, which Alan
              does not publish. This is a structural diligence gap for any investor or creditor relying on multi-year
              loss trajectories.
