          - type: callout
            title: Union and Incumbent Opposition to Financial Viability
            body: >
              Multiple French trade unions (CGT, CFDT, FO, Solidaires, UNSA, CFTC, CFE-CGC) publicly questioned Alan's
              financial sustainability when it won the €Bercy Ministry of Finance contract in May 2025, calling it a
              "startup déficitaire" whose long-term commitments are "not guaranteed." The MGEFI (displaced incumbent)
              filed a legal challenge. These concerns—while partially mitigated by Alan's Solvency II capital
              buffer—highlight reputational and contract-execution risk in the public sector, which is now a material
              revenue pillar.
