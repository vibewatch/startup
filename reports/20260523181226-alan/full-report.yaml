  - id: FM001
    title: Market Sizing Pyramid — Alan's TAM/SAM/SOM
    type: pyramid
    layout: standard
    summary: >
      TAM/SAM/SOM hierarchy for Alan's primary market (France + Belgium + Spain). French complementary health is the
      dominant layer; SAM is the B2B employer-group segment; SOM is Alan's current and near-term ARR trajectory. Canada
      is excluded from the SAM/SOM calculation given early commercial stage but is included directionally in total TAM.
    data:
      items:
        - label: TAM — Complementary Health Premium Pool (FR+BE+ES combined)
          value: ~€50B
          detail: >
            France: €46.5–47.2B complementary health cotisations (ACPR/DREES 2024 data); Belgium: ~€2.5B supplementary
            health GWP (KPMG 2024); Spain: private VHI estimate not primary-sourced; excluded from TAM arithmetic.
            Canada: CAD $55.9B (~€37B) private supplemental benefits (2022 CHLIA) — disclosed separately given
            regulatory/market structural differences.
          tone: neutral
        - label: SAM — B2B Employer-Group Addressable Segment (FR+BE+ES)
          value: ~€28–32B
          detail: >
            France group collectif: 57% × €46.8B = ~€26.7B (France Assureurs 2024); Belgium collective: ~€950M (KPMG
            2024); Spain employer-group VHI: ~€1–3B estimated (not primary-sourced; evidence gap GM001). Total:
            ~€28–32B. Constraint: Alan only competitive in digitally-open employer segments willing to switch from
            legacy IPs or mutuelles.
          tone: neutral
        - label: SOM — Alan's Current and Near-Term Obtainable Revenue
          value: €785M (2025A) → €1B+ (2026 target)
          detail: >
            Alan ARR: €505M (2024); €785M (FY2025); €804M+ (Q1 2026). % of French+Belgian group SAM: ~2.5–3.3%. CEO
            guidance: 40% ARR CAGR through 2026; group-level profitability target 2027. 5-year SOM at 40% CAGR: ~€3.7B
            (still below 12% of combined FR+BE group SAM).
          tone: positive
    approximationNotes: >
      TAM: Spain VHI size excluded from TAM sum due to missing primary source; the "~€50B" figure is France+Belgium
      only. Canada excluded from TAM pyramid due to structural differences. SAM: France group segment derived as 57% ×
      €46.8B per France Assureurs; Belgium collective from KPMG; Spain estimate uses proportionate method and is
      uncertain. SOM 5-year projection uses management guidance CAGR; not independently verified.
    claimRefs:
