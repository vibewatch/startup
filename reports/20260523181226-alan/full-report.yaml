chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission & Business Model
        blocks:
          - type: paragraph
            body: >
              Alan was incorporated on 10 February 2016 in Paris and became the first new independent health insurance
              company to receive an ACPR licence in France since 1986—a market where ten players control two-thirds of a
              €47.2B complementary-health premium pool. The company's name is a deliberate tribute to two Alans: Alan
              Turing, the father of modern computing, and Alan Watts, the philosopher of personal integration and
              well-being, expressing the founders' thesis that technology and human flourishing are inseparable.

              Alan describes itself as a "health partner" rather than merely an insurer. Its business model has two
              intertwined revenue streams: (1) ACPR-licensed complementary health insurance premiums priced on an
              equilibrium principle—the company targets zero margin between collected premiums and paid
              reimbursements—and (2) a per-member subscription that funds its digital platform, virtual clinic,
              prevention tools, and AI services. This twin-engine design is intended to remove the adversarial
              premium-extraction dynamic of traditional insurers and instead earn margin through platform engagement and
              scale economics.

              Alan targets French and European employers of all sizes, including large enterprises, SMEs, freelancers,
              and—since 2025—the French civil service. Its proposition rests on radical operational speed (70% of
              reimbursements in under one hour, 99% within 24 hours, and a 20-second average phone response), a fully
              digital member experience via a mobile app, and an expanding suite of ancillary services: a virtual clinic
              (Clinique Alan) open seven days a week, the Alan Play gamified wellness programme, optical ordering,
              physiotherapy content, and the Mo AI health assistant launched in November 2024.
