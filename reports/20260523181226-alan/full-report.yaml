      - number: '1.5'
        title: Milestones, Regulatory Standing & Risk Landscape
        blocks:
          - type: paragraph
            body: >
              Alan's regulatory standing is a foundational strength. Its ACPR authorisation of 20 October 2016 (Decision
              n° 2016-C-72) was the first granted to a new French insurer in three decades, and the company has
              maintained a solvency ratio reported at ~450% in 2023—roughly double the French market average of ~241%
              and well above the regulatory minimum. Paul Sauveplane, who spearheaded the ACPR licensing process in
              2016, remains General Secretary, providing institutional continuity on regulatory matters.

              The most material adverse event as of the runDate is the Almerys cyberattack disclosed on 23 May 2026.
              Almerys, Alan's third-party payment operator, was breached by a threat actor claiming to have accessed
              over 44 million records and 15 million unique Social Security numbers. For Alan members, exposed data
              includes civil status, date of birth, Social Security number, contract number, and insurer name; banking
              data, health records, and contact details were reportedly unaffected. Alan took the affected platform
              offline, notified ACPR and CNIL, and committed to individually informing all members whose data was
              compromised. As of 23 May 2026, the total number of affected Alan members remained undisclosed. This is
              the second major Almerys incident: the January 2024 breach alongside Viamedis exposed data of 33 million
              French citizens per CNIL records.

              Independent analysts have also questioned Alan's valuation trajectory. Matteo Carbone of the IoT Insurance
              Observatory called the €4B Series F valuation "unrealistic," citing premium levels and persistent losses;
              the counter-thesis centres on Alan's technology premium and growth curve. The valuation step-up to €5B in
              March 2026 while still group-loss-making will remain a diligence focal point for prospective investors.
