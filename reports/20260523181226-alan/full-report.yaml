  - id: TM004
    title: Growth Drivers and Structural Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Alan
      - Diligence Ask
    rows:
      - - ANI 2016 private-sector employer mandate
        - Growth driver
        - Structural (ongoing since 2016)
        - >-
          Guarantees a large, stable base of group contracts Alan can target; 57% of French complementary health
          premiums now group/collective
        - Confirm Alan's win-rate in competitive ANI-linked tenders vs IPs and large assurers
      - - PSC 2025–2026 public-sector extension of employer mandate
        - Growth driver
        - Immediate (2025–2026 rollout)
        - >-
          Opens 3.5M civil-servant addressable population; Alan already won Ministry of Economy tender (135K agents);
          rollout momentum through 2026
        - Track PSC implementation pace by ministry; assess Alan's win-rate in future public tenders post-first win
      - - Medical inflation and rising healthcare costs
        - Growth driver + constraint
        - Current (structural)
        - >-
          Drives premium volume growth (+7.6–8.2% in 2024) that expands the absolute TAM; simultaneously raises claims
          costs and puts pressure on Alan's equilibrium-pricing model
        - >-
          Monitor claims-to-premium ratio in Alan's SFCR filings; compare to market average of 79% loss ratio (DREES
          2025)
      - - Digital transformation of employee health benefits
        - Growth driver
        - Near-term (2025–2028)
        - >-
          Creates demand for Alan's app-centric, AI-powered model; 81% of Alan patients chose AI over traditional
          consultation; 35% weekly engagement on Alan Walk
        - >-
          Benchmark Alan's NPS and retention vs legacy incumbents; verify 90% member satisfaction claim via independent
          survey
      - - 100% Santé / RAC0 reform claims inflation
        - Structural constraint / headwind
        - Ongoing (2019–2026+)
        - >-
          Mandates zero-copay baskets for dental/optical/hearing aids; drove €2.1B extra CHI spending 2019–2021; hearing
          aid utilisation +75%; premiums for elderly rising 7–12%; compresses technical margins market-wide
        - >-
          Assess Alan's exposure by age profile of its member book; quantify portion of claims attributable to 100%
          Santé basket vs general frais de soins
      - - Incumbent entrenchment via accords de branche (sectoral designation clauses)
        - Structural constraint / headwind
        - Structural (ongoing)
        - >-
          Branch-level agreements designate specific IPs for entire professional sectors; even without mandatory
          designation, incumbents benefit from contractual inertia at branch level, limiting Alan's entry in certain
          sectors
        - >-
          Map Alan's SME portfolio by NACE industry sector; identify sectors with active branche-designation agreements
          Alan cannot easily penetrate
      - - Annual-switch right (résiliation infra-annuelle, 2020)
        - Growth driver (switching enabler)
        - Operative since 2020
        - >-
          Allows employers to switch group complementary health insurer annually without penalty after first year;
          reduces switching cost and benefits challenger like Alan
        - >-
          Quantify Alan's win rate from competitive switches vs new-to-insurance customers; track seasonality of
          contract starts
      - - Multi-jurisdictional regulatory complexity (ACPR/FSMA/DGSFP/OSFI)
        - Structural constraint
        - Ongoing
        - >-
          Each new geography requires separate capital, compliance, product localisation, and data-sovereignty work;
          increases fixed costs of expansion and slows time-to-scale outside France
        - >-
          Assess Alan's compliance resource allocation across jurisdictions; verify solvency ratios in Belgium, Spain,
          and Canada separately
      - - Third-party operational risk (Almerys cyberattack, May 2026)
        - Constraint / emerging risk
        - Current (acute as of runDate)
        - >-
          Almerys breach exposed member data (SSNs, civil status, contract numbers); ACPR and CNIL notified;
          reputational and regulatory risk; second incident in two years; potential for regulatory sanction and member
          churn
        - >-
          Determine number of Alan members affected by the May 2026 breach; assess CNIL inquiry timeline; monitor member
          retention post-disclosure
      - - Low incumbent digital maturity creating opening for digital-native disruptors
        - Growth driver
        - Near-term (2025–2028)
        - >-
          Mutuelle and IP incumbents are digitalising slowly; Deloitte Belgium study confirms 44% of Belgians unable to
          understand invoices; 1/3 postpone care due to financial constraints—pain Alan's UX directly addresses
        - >-
          Track incumbent digital investment levels; assess whether AXA Healthanea, AG Insurances' MyEmployeeBenefit, or
          Doctolib offerings close the UX gap
    enumerationScope:
      coverage: partial
      basis: >-
        Drivers and constraints identified from ACPR, DREES, France Assureurs, DREES 100% Santé study, service-public.fr
        PSC pages, Deloitte Belgium, Alan letters and press; additional regulatory, macro, or competitive dynamics may
        exist not captured in public sources as of Q1 2026
    notes: >
      Direction column uses growth driver / constraint / headwind vocabulary. Timing uses Immediate (≤12 months),
      Near-term (1–3 years), or Structural (multi-year, ongoing). Implication focuses on Alan-specific effects, not
      market-generic. Diligence asks are investor-level verification questions, not actionable instructions for Alan
      management.
