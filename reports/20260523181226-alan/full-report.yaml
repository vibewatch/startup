  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base & Segmentation
        blocks:
          - type: paragraph
            body: >
              Alan's customer base spans two primary commercial channels: business-to-business (B2B) employer-sponsored
              group health insurance, which drives the large majority of its 1.1 million members, and a smaller but
              growing business-to-consumer (B2C) segment for self-employed professionals (travailleurs non-salariés,
              TNS) and individual members. In France, the SME segment (1–500 employees) remains the historical core;
              Alan entered the market targeting tech startups before scaling to broader mid-market employers. Individual
              and TNS plans (Rubis, Emeraude, Saphir/Diamant) are priced at €49–91/month for a 40-year-old profile,
              positioning Alan at the premium end of the individual market.

              Geographically, France dominates member count and is Alan's only operationally profitable market as of
              2025. Belgium and Spain are meaningful secondary markets where HP and Volkswagen are cited as named
              enterprise clients, with Belgian distribution further accelerated by the Belfius bank partnership. Canada
              obtained provincial licences in 2024 and has commenced commercial operations, though it remains
              early-stage.

              Public-sector exposure has risen materially since 2023. Alan won the Assemblée nationale contract in 2023,
              the Ministry of Ecology (60,000 civil servants) and Prime Minister Services (4,900 employees) in 2024, and
              the Ministry of Finance (Bercy, 130,000 civil servants, live January 2026) in 2025. This extends Alan's
              buyer profile from private employers to central-government HR departments, introducing different
              procurement dynamics, longer contract cycles, and structural renewal risk tied to French PSC reform
              continuity.
