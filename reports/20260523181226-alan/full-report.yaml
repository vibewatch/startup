            body: >
              Alan's 2026 roadmap reflects two strategic bets: extending AI from the product layer into go-to-market and
              internal operations, and rebuilding the technology stack into a global multi-country architecture that
              enables 10× faster entry into new geographies. On the commercial AI front, sales productivity gains from
              AI assistance are expected to reach approximately 30% in 2026, building on the ~50% improvement cited by
              Alan's chief revenue officer at the January 2025 results press conference. Alan has also previewed a
              medium-term ambition of a "single AI sales rep" managing a full deal cycle by 2027. The multi-country
