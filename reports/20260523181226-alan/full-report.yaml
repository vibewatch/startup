      - number: '1.4'
        title: Operating Metrics, Scale & Geographic Reach
        blocks:
          - type: paragraph
            body: >
              Alan's ARR trajectory is the clearest signal of its momentum: from €340M in 2023 to €505M in 2024 (+48%),
              €785M for FY2025 (+53%), and €804M already in Q1 2026 alone against a full-year €1B target. Member count
              crossed one million (exactly 1,059,000 at end-2025, +52% YoY), served across 37,000+ businesses. Headcount
              stands at approximately 790+ as of April 2026, up from ~600 in 2024, with hiring concentrated in Canada
              and Belgium.

              France remains the dominant market, where Alan insures over 700,000 members and achieved operational
              profitability in 2025—a structural milestone confirming the unit economics of the French book. Net loss at
              group level improved from €39M in 2023 to €34M in 2024 and further to €26M in 2025, with losses as a share
              of ARR falling substantially. Group-level profitability is targeted by 2027.

              Belgium is Alan's second-largest market, with a Belfius distribution partnership giving access to millions
              of potential employees of Belfius's corporate clients. Spain grew members 42% in 2025 and counts HP and
              Volkswagen among its clients. Canada, launched commercially in early 2025, is now licensed nationwide; the
              Quebec rollout began in January 2026, and the company serves over 1,600 members in Canada with plans to
              expand to Montreal. Alan's October 2024 OSFI licence made it the first new health insurance company in
              Canada since 1957.

              Public-sector penetration has emerged as a material growth vector: in May 2025, Alan won the French
              Ministry of Economy and Finance complementary health tender covering up to 135,000 civil servants
              (potentially 300,000 with dependants). It had previously won contracts for the Prime Minister's Office and
              the Ministry of Ecological Transition.
