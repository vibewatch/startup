        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Capital Fortress
            body: >
              Alan maintains regulatory capital of more than €374M against a ~€105M ACPR requirement—a coverage ratio
              exceeding 3.6×. At a reported ~450% solvency ratio (2023 SFCR), Alan sits well above both the French
              market average of ~241% and the regulatory floor of 100%. This positions the company to absorb adverse
              claims shocks and fund international expansion without emergency capital events, while its liquid-only
              investment policy avoids mark-to- market volatility risk.
