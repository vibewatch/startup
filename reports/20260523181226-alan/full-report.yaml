            body: >
              Alan's most material concentration risk is its rising public-sector exposure. The PSC contracts won across
              2023–2026 (Assemblée nationale, Ministry of Ecology, PM Services, Ministry of Finance) collectively
              represent a large bloc of covered lives under a single procurement regime. While each ministry is a
              separate contract, they all derive from the PSC reform mechanism. If a future French government reverses
              PSC reform, or if Alan fails to renew tenders at cycle end, a material share of its member base could exit
              in a compressed timeframe.

              Execution risk on the Bercy contract is active: MGEFI (a Matmut subsidiary), the incumbent insurer, filed
              a pre-contractual legal challenge in June 2025 after being displaced. An earlier MGEN challenge against
              Alan's Ministry of Ecology win was dismissed at referé stage, providing a precedent against reversal, but
              the MGEFI challenge outcome was unresolved as of the run date. French MP Philippe Latombe has publicly
              flagged Alan's AWS hosting of civil servant health data as a digital sovereignty concern — a regulatory
              exposure that could affect future PSC tender eligibility.

              On channel concentration, Belgium relies substantially on the Belfius bank distribution partnership for
              employer acquisition. Canada is too early in its growth arc to carry meaningful concentration risk.
              Offsetting these risks: the 37,000-company private-sector portfolio is highly diversified across SME sizes
              and industries, and no single private employer is disclosed as representing a material revenue
              concentration. Public-sector contracts, while large in covered lives, are priced at lower per-member
              premiums, so their revenue concentration impact is less severe than their headcount concentration.
