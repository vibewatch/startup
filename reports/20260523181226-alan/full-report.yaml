      - number: '4.3'
        title: Capital Adequacy and Solvency II Compliance
        blocks:
          - type: paragraph
            body: >
              Alan is regulated as an insurance group under Solvency II (Directive 2009/138/EC), supervised by the ACPR
              (Autorité de Contrôle Prudentiel et de Résolution). Under Solvency II Pillar I, Alan must hold eligible
              own funds at or above its Solvency Capital Requirement (SCR)—the amount of capital needed to absorb losses
              with 99.5% probability over one year. Alan's SCR is approximately €105M, driven primarily by health
              insurance underwriting risk (exposure to healthcare cost fluctuations and prévoyance commitments). Alan
              holds regulatory own funds exceeding €374M, a coverage ratio of more than 3.6× the SCR. The FY2023 SFCR
              cited an approximate solvency ratio of 450%, versus the French complementary health insurance market
              average of 241% (H1 2025 per ACPR/Chambers data) and the regulatory minimum of 100%. In FY2025, own funds
              increased by €80M versus end-FY2024, partially from improved net result and capital structure management.
              Cash and liquid deposits total approximately €376M (end FY2025), held conservatively in deposit accounts
              with tier-one financial institutions—no investments in public equities or high-risk instruments,
              consistent with regulatory capital preservation policy. Alan's reinsurance program involves Swiss Re,
              GenRe, CNP Assurances, Hannover Re, and Belfius Insurance, providing structured risk transfer to cap
              healthcare cost volatility and protect the SCR from adverse claims development. The €100M March 2026
              capital raise was characterized by CFO Albu as "opportunistic"—the company had no immediate capital need
              (with €376M on hand at end FY2025)—and is intended to fund M&A and international expansion rather than
              cover operational shortfalls. Annual SFCR publication is a mandatory Solvency II obligation; Alan's FY2025
              SFCR was validated by the board of directors on 22 April 2026.
            claimRefs:
