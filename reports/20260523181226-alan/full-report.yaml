      - number: '2.3'
        title: Buyer Landscape & Segment Map
        blocks:
          - type: paragraph
            body: >
              Alan's primary buyer is the employer—the HR director or business owner who selects and procures group
              complementary health coverage for employees. In the French group market, the employer is both budget owner
              and the contracting party, paying at least 50% of the "cotisation d'équilibre" under ANI 2016. The
              employee (end user and insured member) does not usually select their insurer but experiences the product
              directly through Alan's mobile app, reimbursement speed, virtual clinic, and prevention features. The
              payer structure thus separates procurement (employer) from consumption (employee), creating a dual
              buyer-user dynamic where Alan must win employer trust on price and compliance while winning employee
              satisfaction on experience.

              Segment structure in France operates across five main employer types: (1) SMEs (1–250 employees)— Alan's
              highest-volume segment, where administrative simplicity and speed-of-onboarding are decisive; (2)
              mid-market and large enterprises (250+ employees)—now a growing priority for Alan, which onboarded HP and
              Volkswagen in Spain and multiple French large accounts; (3) public-sector bodies— emerging since the PSC
              reform; Alan won the Ministry of Economy and Finance tender (135,000 agents, up to 300,000 with
              dependants) in May 2025, validating its ability to bid on large-scale procurement tenders; (4) freelancers
              and self-employed (travailleurs indépendants)—a segment Alan has served since 2017, using individual
              rather than group contracts; (5) retirees—a newly addressed segment as of January 2025, with TechCrunch
              reporting 750,000 new retirees annually in France.

              In Belgium, Alan's go-to-market is shaped by its Belfius distribution partnership: Belfius acts as a
              trusted intermediary and distribution channel, directing its own 7,000+ employees and a pipeline of
              corporate and institutional clients to Alan. This partner-channel model reduces Alan's direct sales cost
              but introduces dependency on the Belfius relationship for Belgian growth. In Spain, Alan has targeted
              large multinational enterprises (HP, Volkswagen documented) and is expanding to SMEs. In Canada, Alan is
              in early commercial stage (1,600+ members as of Q1 2026), where the buyer profile mirrors France—employers
              seeking digital-first group supplemental benefits.

              Adoption triggers vary by segment: for SMEs, the trigger is typically administrative pain relief (instant
              reimbursements, zero paper) and competitive pressure for talent; for large enterprises, it is a mix of
              employee experience benchmarking, ESG/well-being reporting requirements, and procurement cycle timing; for
              public-sector bodies, the PSC reform creates a mandated procurement moment. The switching cost for
              existing group contracts is moderated by the French annual-switch right (résiliation infra-annuelle since
              2020), though inertia remains because HR teams must communicate changes, migrate employee data, and manage
              IT-system integrations. Alan's AI-assisted onboarding and digital HR tools are designed explicitly to
              lower this switching friction.
