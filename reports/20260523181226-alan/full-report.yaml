      - number: '5.5'
        title: Trust, Compliance & Data Security
        blocks:
          - type: paragraph
            body: >
              Alan holds ISO 27001 certification—audited and certified by SGS—covering 100% of its teams, operations,
              and geographies (France, Belgium, Spain, and Canada). The company's CNIL data processing declaration (No.
              2004097 v0) governs automated health data handling under French and EU law. Alan's February 2026 privacy
              policy commits explicitly to never selling member data and never using health data for differential
              pricing, a meaningful trust differentiator relative to most traditional insurers.

              The structural security risk is material. Alan delegates third-party payment processing to Almerys, which
              suffered a breach in early 2024 affecting more than 33 million French policyholders; CNIL launched a
              formal investigation. On 23 May 2026—the date of this report—Le Figaro confirmed a new Almerys cyberattack
              affecting Alan members, with social security numbers and insurance contract numbers exposed. Banking data
              and health data were not compromised. Alan immediately shut down the affected platform, notified CNIL and
              ACPR, and committed to individually notifying affected members via email.

              Independent review aggregators (Selectra, Trustpilot) show a consistent adverse pattern: members report
              difficulty reaching human advisors, unexpected premium increases, and AI chatbot misclassification of
              their queries as out of scope. These complaints are structurally connected to Alan's digital-first,
              AI-heavy service model and represent an ongoing churn risk in segments that value human accessibility
              above speed and convenience.
