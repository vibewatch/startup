  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and ARR Trajectory
        blocks:
          - type: paragraph
            body: >
              Alan's business model rests on two explicitly distinct revenue layers. The first is insurance premiums,
              priced at near-equilibrium with expected claims—Alan targets a claims-to-premiums ratio of approximately
              100%, meaning premiums are largely passed through to reimbursements with minimal net actuarial margin for
              Alan. The second is a per-member monthly subscription fee that funds the digital health platform:
              AI-powered medical chat, optical ordering, back-pain programs, and prevention tools. The CEO stated
              publicly that the management fee is set at "12 to 14% of premiums," making the subscription layer a
              structurally separate, high-margin SaaS-like stream atop a low-margin insurance base. Prévoyance
              (disability/life) represents approximately 25% of French revenue and follows the same pass-through
              structure. ARR grew from €340M (FY2023) to €505M (FY2024, +48%) to €785M (FY2025, +53%), with Q1 2026 at
              €804M, on track toward the €1B annual target. France accounts for more than three-quarters of group ARR.
              The public sector, following wins at the Ministry of Economy and Finance (135,000 civil servants) and
              earlier government ministries, represented 32% of FY2024 net ARR growth and multiplied fourfold in FY2025.
              International markets (Belgium, Spain, Canada) are growing but remain a minority of group revenue. The
              implied subscription revenue at 12–14% of €785M is approximately €94–110M, which constitutes the primary
              economic profit pool from which operating expenses must be recovered before any group net result can turn
              positive.
