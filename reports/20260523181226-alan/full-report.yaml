  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Funding History and Current Valuation Mark
        blocks:
          - type: paragraph
            body: >
              Alan's valuation arc is one of the most compressed and consistent in European insurtech. Starting from a
              seed round of €12M in October 2016, the company progressed through seven further rounds to reach a
              post-money valuation of €5B in March 2026—a total equity capital raise of approximately €754M. The Series
              F in September 2024 set the €4B mark at a €173M raise led by Belgian bank and insurer Belfius, which
              simultaneously entered a distribution partnership giving Alan access to Belfius's corporate and
              institutional clients. The March 2026 follow-on raised €100M led by Index Ventures (existing), with new
              institutional backers Greenoaks, Kaaf, and SH Capital and angel investors including Shopify founder Tobi
              Lütke and footballer Antoine Griezmann. The valuation step-up of 25%—from €4B to €5B—was achieved despite
              Alan still reporting a group net loss of €26M in FY2025, albeit sharply improved from €34M in FY2024. The
              €5B mark reflects a €804M Q1 2026 ARR run-rate (implying approximately 6.2× forward ARR) and a disclosed
              path to group profitability by 2027. Critically, 30% of European unicorns lost their billion-dollar status
              in 2024–2025, and Alan's upward revaluation marks it as a clear outlier in a period of multiple
              compression across the region. The ACPR confirmed Alan's FY2025 Solvency and Financial Condition Report
              (SFCR) was board-approved on 22 April 2026; Alan holds regulatory capital of more than €374M against a
              Solvency Capital Requirement of approximately €105M (3.6× coverage vs. the French market average of
              2.41×). The €100M March 2026 round was described by CFO Mihaela Albu as "opportunistic," given the
              existing €376M cash reserve—indicating no near-term solvency or liquidity need, and framing the raise as
              M&A dry powder and growth capital rather than survival financing. Founders and employees retain
              approximately 40% of the capital and the majority of voting rights, which limits secondary liquidity for
              early investors and means any near-term IPO would be a founder-controlled decision.
