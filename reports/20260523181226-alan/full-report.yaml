      - number: '3.4'
        title: Comparative Capabilities, Pricing, and Switching Friction
        blocks:
          - type: paragraph
            body: |
              Alan's primary differentiation versus incumbents is threefold: technology-led
              processing speed, integrated care services, and member experience quality. The
              most verifiable gap is reimbursement turnaround — Alan processes more than 70%
              of reimbursements in under one hour and 99% within 24 hours, compared to 3–5
              business days cited for MGEN and 2–4 days for most traditional mutuelles. Alan's
              consumer NPS of 70+ significantly exceeds what independent review platforms record
              for Malakoff Humanis (84% satisfaction on a binary scale), Harmonie, and AG2R.
              Alan's 100% digital model — no physical branches, no inbound telephone line for
              standard queries — is both its source of cost efficiency and the most commonly
              cited limitation in consumer reviews, particularly for less digitally literate
              members or those with complex care needs.

              In pricing, Alan's 2026 individual plans are: Green (€39–55/month for entry-level),
              Blue (€59–79/month for mid-coverage), and Purple (€89–120/month for premium). Alan
              also offers employer group plans (Green, Blue, Zen) where the employer must cover
              at least 50% per ANI law. Alan raised its premiums approximately 7% on average in
              2026 to reflect 9.5% medical inflation. Harmonie Mutuelle enterprise pricing is
              estimated at €15–80/month per employee depending on tier, company demographics,
              and convention collective. AG2R Flexéosanté starts at €19.77/month for SMEs. MGEN's
              base PSC premium is €75.40/month gross (€37.70 for employee with 50% employer
              share). Pricing differences between Alan and comparable incumbents are within
              roughly ±15–20% for equivalent coverage tiers; neither side has a structural cost
              advantage large enough to make price the primary switching decision.

              Alan charges a 12–14% platform subscription fee on top of insurance premiums for
              its health platform services — a pricing model unique among French CHI players.
              This secondary revenue stream helps diversify monetisation beyond pure insurance
              underwriting but creates an additional cost line that budget-sensitive employers
              may scrutinise.

              Switching friction for employer group contracts is primarily calendar-based: French
              CHI contracts renew annually, and notice periods typically run 1–2 months before
              renewal. Alan imposes no switching fee for onboarding, and its digital onboarding
              eliminates paperwork. However, prior-provider notice periods still apply, and PSC
              and CCN-bound sectoral agreements can lock in specific incumbent providers for the
              duration of the CCN designation. For SMEs and tech companies — Alan's core market
              — multi-homing is relatively easy and switching effort is genuinely lower than with
              paper-heavy traditional processes.
