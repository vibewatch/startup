      - number: '1.2'
        title: Founders, Leadership & Corporate Governance
        blocks:
          - type: paragraph
            body: >
              Jean-Charles Samuelian-Werve (CEO) and Charles Gorintin (CTO) are the sole co-founders and remain
              executive leaders of the company a decade after launch. Samuelian-Werve previously co-founded Expliseat,
              the creator of the world's lightest certified economy aircraft seat; he holds an MSc in Engineering from
              École des Ponts ParisTech, an MBA from Collège des Ingénieurs, and membership in the French Institute of
              Actuaries. He was awarded the Ordre National du Mérite in 2021. Gorintin was a data science leader at
              Facebook, Instagram, and Twitter before Alan, focusing on social network growth and fraud; his academic
              credentials span École des Ponts ParisTech, ENS Paris-Saclay (Machine Learning), and UC Berkeley's Haas
              School of Business (Financial Engineering).

              Both founders are also non-operating co-founders and board members of Mistral AI, the Paris- based
              large-language-model company founded in April 2023 and valued at approximately €12B. Alan itself holds a
              minority stake in Mistral. The intertwining of insurance and AI strategy is central to Samuelian-Werve's
              "methodic optimist" worldview: technology can improve healthcare quality at scale, but only if paired with
              sound insurance and clinical operations.

              Alan's senior management team includes Mihaela Albu (Finance & Strategy, ex-McKinsey Associate Partner,
              INSEAD MBA), Paul Sauveplane (General Secretary and HRD, ex-ACPR and Inspection Générale des Finances, the
              architect of Alan's ACPR licensing process), Marion Bergeret (Corporate/Legal, ex-Oxford, UC Berkeley, and
              AI startup Snips), Laurent Guérin (Insurance, ex-French Treasury, École Polytechnique/MIT), and country
              GMs for France (Fabrice Staad), Belgium (Sébastien Fredeau), Spain (Yoann Artus), and Canada (Mark Goad,
              ex-Curv Health and OMERS Ventures). Jan Hammer of Index Ventures has been a board member since Alan's
              Series A in 2018.

              A key governance feature: founders and employees collectively hold more than 40% of Alan's capital and
              maintain a majority of voting rights, insulating strategy from single-investor control despite eight
              funding rounds totalling ~€754M.
