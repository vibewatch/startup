      - number: '3.2'
        title: Incumbent Mutual Societies and Commercial Insurers
        blocks:
          - type: paragraph
            body: |
              Malakoff Humanis is France's second-largest CHI group by cotisations. Its 2025
              results showed group insurance revenue of €8.37B (health: €4.22B, +5% YoY), a net
              result of €231M, and a solvency ratio of 270%. The group insures approximately 10
              million people across health and prévoyance and serves around 400,000 enterprise
              clients across 83 professional branches, many of which are bound by CCN-level
              agreements. Its health redistribution rate of 84% — meaning €84 paid in claims per
              €100 collected — is a transparency metric that incumbents promote as evidence of
              mutualised value. Malakoff has an employer extranet for digital contract management
              but lacks an integrated wellbeing or AI health assistant platform. Distribution is
              predominantly broker-mediated.

              Harmonie Mutuelle, part of Groupe VYV (the number-one CHI group), protects five
              million members and serves approximately 88,000 enterprise clients, 92% of whom
              recommend it. VYV's total membership of 10.6 million makes it the largest mutual
              network in France. Harmonie offers three enterprise coverage tiers — Économique,
              Confort, and Optimal — and accesses a care-provider network (Kalixia) for optical,
              dental, and audio. Its mutualiste governance reinvests surplus rather than paying
              dividends, supporting stability but limiting product agility. Digital tools include
              an employer extranet and member app but no AI health assistant.

              AG2R LA MONDIALE is a 115-year-old joint employer-union paritaire group. Its
              Flexéosanté SME product starts at approximately €19.77/month with 6 coverage levels
              and optional assistance and wellness packs. AG2R's structural advantage lies in
              administering mandatory CCN health coverage for numerous sectors, creating
              distribution lock-in that is difficult to displace outside contract renewal cycles.
              A digital employer portal exists but clinical and AI health services are absent.

              MGEN (Mutuelle Générale de l'Éducation Nationale) covers four million people,
              almost exclusively in the French public sector (Education nationale, Enseignement
              supérieur, Jeunesse et Sports). From 1 May 2026, MGEN became the mandatory PSC
              (Protection Sociale Complémentaire) provider for all active agents in those
              ministries, with a base premium of €75.40/month (employer covers at least 50%).
              This PSC mandatory designation represents structural lock-in that Alan cannot
              replicate for this specific public-sector segment without winning a national tender.

              Apicil is a paritaire group based in south-east France with €4.03B total revenue
              in 2025, 2.2 million principal insured, 57,573 enterprise clients, and a solvency
              ratio of 182%. Health and prévoyance account for €1.5B of total revenue. The group
              emphasises RSE and regional proximity as differentiation. No AI-driven health
              platform is evident in its public product pages.

              AXA France is the third-largest CHI group by cotisations (€3.57B in 2024, +15.2%
              YoY), with 70.7% in the collective segment. AXA's Q1 2026 group-level life and
              health premiums reached €16.5B (+8%). AXA has the brand recognition, solvency
              capital, and multi-product cross-sell capability to challenge Alan at the large
              enterprise and public-sector contract level. Its digital employer portal is more
              advanced than most mutual societies, and it is actively investing in health
              digitalisation, though its primary competitive posture remains large-enterprise and
              individual market.

              Generali, operating via the Alliance Klesia joint venture, is the fourth-largest
              CHI group (€2.84B cotisations 2024, +14.5% YoY; 66.7% collective). The Generali
              Group recorded a record operating result of €8.0B in 2025 (+9.7%) and a solvency
              ratio of 219%. The Klesia partnership gives access to paritaire sectoral CCN
              distribution, complementing Generali's commercial insurer capital base. No
              differentiated digital experience is publicly prominent.
