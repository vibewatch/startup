      - number: '8.3'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The investment thesis for Alan rests on five interlocking pillars. First, market position: Alan is the
              dominant new-entrant insurer in the €47B French complementary health market, having become the first
              ACPR-licensed carrier since the 1980s and growing to 1.059M members with less than 1% aggregate market
              share—implying a multi-decade runway before hitting saturation. Second, revenue quality: ARR has
              compounded at approximately 50% per year for three consecutive years (€340M → €505M → €785M), with each
              cohort of members generating recurring subscription fee revenue structurally decoupled from claims
              volatility. Third, financial trajectory: France achieved operational profitability in FY2025, losses as a
              share of ARR fell from approximately 17% in FY2023 to 3.3% in FY2025, and the March 2026 cash raise was
              explicitly described as opportunistic (not survival capital). Fourth, AI moat: Alan's Mo AI health
              assistant, automated reimbursement processing (70% within one hour), and fraud detection capabilities
              create operational leverage that is difficult for incumbents using legacy systems to replicate. Fifth,
              capital discipline under regulation: a 3.6× Solvency II coverage ratio and entirely cash-deposit asset
              allocation (no equity or structured product exposure) signal conservative risk management aligned with
              supervisory expectations. The anti-thesis is equally coherent. First, the Solvency II capital constraint:
              because Alan must hold regulatory capital above its SCR as a condition of its licence, the €374M in own
              funds is not freely deployable—it functions more like restricted capital than strategic firepower,
              constraining the "tech company" narrative. Second, valuation dependency on growth: at 6.4× ARR, any ARR
              growth deceleration from 50%+ to below 20% would compress the multiple substantially, particularly if
              group profitability is delayed beyond 2027. Third, undisclosed loss ratio: the core actuarial risk—whether
              health claims are tracking at, above, or below the management-stated 100% pass-through target—is never
              disclosed, making independent risk assessment impossible without data room access. Fourth, governance
              concerns: Belfius occupies the dual role of lead Series F investor and primary distribution partner in
              Belgium, which creates a potential conflict of interest in valuation and governance, a concern explicitly
              raised by independent analyst Matteo Carbone. Fifth, public sector concentration: 32% of net ARR growth in
              FY2024 came from public sector contracts (e.g., Ministry of Economy and Finance), and any reversal or
              non-renewal of public sector wins would disproportionately impair reported ARR momentum.
