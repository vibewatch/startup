      - number: '3.3'
        title: Digital-Native Insurtech and Adjacent Digital Health Players
        blocks:
          - type: paragraph
            body: |
              Doctolib is France's dominant care-navigation platform, holding approximately 90%
              market share in online medical appointment booking. In 2024 it reported ARR of
              €348M (+22.5% YoY) and carried a valuation of approximately $6.4–6.5B, having
              raised over $866M in total. Doctolib's business model is B2B SaaS subscriptions
              for healthcare providers — GPs, specialists, clinics, and hospitals — with patients
              using the platform for free. It is not a complementary health insurer and does not
              hold an ACPR insurance licence. Its 2026–2029 strategic roadmap focuses on clinical
              AI, practice-management financial services, and a potential IPO; entering insurance
              is not flagged. Doctolib and Alan operate in overlapping care-access territory —
              Alan provides teleconsultation, appointment access, and health guidance within its
              own platform, which partly duplicates Doctolib's patient-side booking features.
              The competitive relationship is best characterised as adjacent and partially
              substitutable in care-navigation features, with potential for complementarity
              (Alan members could book via Doctolib) but no direct insurance purchasing
              competition.

              Lifeaz is a French connected-defibrillator (AED) company founded in 2015. In
              February 2026 it completed a €13M funding round (€20M total raised), employs 40
              people, and has installed more than 25,000 defibrillators across France, including
              a partnership with the Croix-Rouge française. Lifeaz is not a health insurer.
              It occupies the employer occupational-safety benefit stack — an employer may deploy
              Lifeaz AEDs alongside an Alan group health contract with no conflict. The
              relationship is adjacent and complementary; Lifeaz's investor Mutuelles Impact
              (backed by the Mutualité Française via XAnge) connects it to the incumbent mutual
              ecosystem rather than to the insurance challenger space.

              In the digital insurtech category more broadly, Seedtable tracks only 6 insuretech
              startups in France in 2026 with aggregate funding of approximately $243M. Alan
              captures the large majority of that capital and is the only ACPR-licensed full-stack
              health insurer among them. Other digital players (Wemind for freelancers, Lovys for
              multi-risk bundles) are primarily brokers or white-label resellers without their
              own insurance licences, competing in Alan's individual and TNS segments but at
              minimal scale compared to the incumbent market.
