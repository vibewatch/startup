  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Structure and Segmentation'
        blocks:
          - type: paragraph
            body: |
              The French complementary health insurance (CHI) market is highly concentrated. The five
              largest groups by 2024 direct cotisations are: Groupe VYV including Harmonie Mutuelle
              (€6.12B), Malakoff Humanis (€3.82B), AXA France (€3.57B), Alliance Klesia-Generali
              (€2.84B), and Groupama (€2.83B). Together, the top 51 groups capture 85% of all CHI
              cotisations. Alan's ARR of €785M for FY2025 places it outside the top-ten ranked
              organisms but growing at 53% YoY versus a sector average of 3–5%.

              This analysis organises competitors into three tiers. Tier 1 comprises large-scale
              incumbent mutual societies (mutuelles) and commercial insurers with deep broker-led
              distribution, mandatory CCN sectoral relationships, and capital reserves far exceeding
              Alan's. Tier 2 includes digital-native challengers and specialised health benefit
              platforms that overlap with Alan on specific features or buyer segments. Tier 3 covers
              adjacent care-navigation and employer-safety players whose service scope intersects with
              Alan's non-insurance health features but who do not compete in the insurance purchasing
              decision. Alan's competitive strategy is to capture the employer SME segment by offering
              a superior product experience at roughly comparable pricing, rather than competing on
              cost or distribution breadth where incumbents hold structural advantages.

              The employer-group (collectif) segment represents approximately 57% of total French CHI
              premiums (≈€26.7B of €46.8B in 2024). Alan's primary attack surface is this collective
              segment, particularly among tech companies, startups, and mid-market SMEs that value
              digital experience, transparency, and integrated wellbeing services over historical
              broker relationships.
