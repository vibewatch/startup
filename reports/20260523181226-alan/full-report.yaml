              high-margin recurring revenue—the equivalent of a meaningful B2B SaaS business. This layer is structurally
              separate from insurance premium pass-through and grows proportionally with member base. As France
              approaches group-level profitability, the subscription fee per member is the dominant driver of operating
              leverage. Investors valuing Alan purely on insurance premium multiples undercount the embedded platform
