      - number: '5.3'
        title: Technology Architecture & AI-Driven Operations
        blocks:
          - type: paragraph
            body: >
              Alan's engineering foundation is built on Python/Flask backend services, React and React Native frontends,
              and PostgreSQL in a shared monorepo—a stack optimised for rapid iteration and end-to-end team ownership
              under a "you build it, you own it" engineering culture. All alan.com services are hosted on Amazon Web
              Services (AWS) Europe, with daily deployment cadences. Alan's careers pages confirm distributed team
              ownership where any engineer can take a feature from conception to production without handoff bottlenecks.

              AI is embedded throughout the operating model rather than isolated as a product feature. The fraud
              detection AI prevented €1 million in fraudulent claims in Q4 2024 alone. Claims document autoparsing
              reaches 67% of submitted claims in France and 39% in Belgium, materially reducing manual review labour.
              AI-powered customer support auto-resolves 17.5% of all mobile contacts (up from 9% in H1 2024), allowing
              customer service headcount to remain flat as membership scales. The most distinctive internal AI
              deployment is Hopper, Alan's autonomous coding agent, which enables non-engineer employees to submit
              production pull requests; pull requests per engineer increased 20–30% in Q1 2026. HR platform
              integrations—Payfit, Workday, and Peepel—automate employer enrollment and coverage lifecycle management
              without manual configuration.
