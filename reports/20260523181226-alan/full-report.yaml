      - number: '1.3'
        title: Funding History & Capital Structure
        blocks:
          - type: paragraph
            body: >
              Alan has completed eight funding events since inception, accumulating approximately €754M in equity
              capital and reaching a post-money valuation of €5B as of March 2026—representing a 30% step-up from the
              €4B valuation set in September 2024. The fundraising arc reflects the successive de-risking of the
              business: early rounds with Partech Ventures, CNP Assurances, and Power Financial of Canada funded the
              ACPR licensing and market entry; Index Ventures led Series A and Series B to scale beyond start-ups and
              SMEs; Temasek (Singapore sovereign wealth fund) added Series C capital during the COVID-accelerated
              digital-health wave; Ontario Teachers' Pension Plan led Series E at the €2.7B mark, signalling that Alan
              had category-defining scale; and Belgian bank-insurer Belfius led Series F in 2024 at €4B, coupling
              distribution rights with capital.

              The March 2026 €100M round was led by Index Ventures through its growth fund and joined by new
              institutional investors Greenoaks (San Francisco) and Kaaf (Dubai), strategic partner Belfius, and family
              office SH. Business angels Tobi Lütke (Shopify CEO), Antoine Griezmann (footballer, 2018 World Cup
              winner), Mike Katchen (Wealthsimple CEO), and Kylian Mbappé (via Coalition Capital) participated,
              reflecting both Alan's cultural weight in France and its ambition as a consumer brand.

              Alan's balance sheet shows regulatory capital exceeding €374M—more than 3.6 times the ~€105M regulatory
              minimum required by ACPR for group-level operations—with the majority held in liquid deposit accounts.
              Reinsurance partners (Swiss Re, GenRe, CNP Assurances, Hannover Re, Belfius Insurance) further cap
              exposure to healthcare cost volatility. Cash reserve was reported at approximately €376M following the
              March 2026 close.
