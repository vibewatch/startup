              - CV045
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'TRACK: Evidence-Conditional Upgrade Path Defined'
            body: >
              Alan's €5B valuation is defensible given France's operational profitability, 53% ARR CAGR, and 3.6×
              Solvency II buffer. However, a RECOMMEND call requires resolution of three critical gaps: (1) group-level
              profitability confirmed in FY2027 or ahead of schedule, (2) independent loss ratio disclosure or actuarial
              sign-off, and (3) per-country P&L revealing international markets are not structurally loss-making at
              scale. Investors entering at €5B accept a base-case 1.4–2× return and a material bear-case risk of 40–60%
              mark-down if the Carbone critique proves correct at scale.
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV043
          - type: callout
            title: 'Adverse View: €4B Valuation Called ''Unrealistic'' by Independent Analyst'
            body: >
              In 2024, Matteo Carbone of the IoT Insurance Observatory publicly stated that Alan's €4B Series F
              valuation was "unrealistic"—specifically noting that "a company with about half a billion premiums and
              that is not even profitable cannot be valued at €4bn," and further that Belfius's dual
              investor-distributor role likely inflated the price. Adrien Choquet of Banque Hottinguer conditionally
              defended the valuation but warned that abandoning the tech offering would leave Alan priced as a
              traditional insurer. At €5B (FY2025 ARR €785M), the valuation has improved its revenue coverage, but the
              core critique—that regulatory capital constraints, undisclosed loss ratio, and group losses make the tech
              premium vulnerable—remains structurally valid.
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
              - CV033
          - type: callout
            title: Solvency II as a Valuation Ceiling, Not Just a Floor
            body: >
              Alan's Solvency II licence creates a durable competitive moat (ACPR-licensed since 2016; only new
              independent carrier in France in 30+ years), but it also functions as a valuation ceiling mechanism. The
              regulatory capital requirement means Alan cannot freely distribute or redeploy its €374M in own funds—they
              serve as a mandated loss buffer. Any comparison to asset-light SaaS businesses that freely generate free
              cash flow overstates Alan's cash generation potential. Prospective investors should model the company as a
              capital-constrained carrier with a tech-premium subscription layer, not as a pure software business.
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV028
