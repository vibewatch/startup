      - number: '6.4'
        title: Retention, Satisfaction & Durability
        blocks:
          - type: paragraph
            body: >
              Alan does not publicly disclose net revenue retention (NRR), gross revenue retention (GRR), or
              cohort-level churn rates. Available proxies are: a self-reported 90% member satisfaction rate, an NPS of
              68 versus an industry average of approximately 3 (cited in the official Bercy announcement blog), and an
              aggregate consumer review score of 4.0–4.2/5 across ~2,300 verified reviews as of May 2026. The 96%
              affiliation rate at Ministry of Finance onboarding is a credible activation proxy for a single large
              cohort, though activation differs from annual renewal rate.

              For employer-sponsored B2B health insurance broadly, industry benchmarks suggest 85–92% annual retention
              when employers bear the majority of the premium. Alan's specific retention by segment is unknown. ARR
              growth from €505M to €804M over ~18 months implies strong portfolio-level revenue retention, but does not
              isolate individual employer renewal rates or segment mix effects. The France market's operational
              profitability implies positive unit economics at scale, which is an indirect indicator of durable
              retention rather than high churn.

              Adverse review signals on Opinion Assurances and Goodassur identify recurring friction in three areas:
              reimbursement errors and laborious correction processes, absence of direct phone support for complex
              cases, and premium increases perceived above market average for TNS and individual customers. The Selectra
              platform shows a notably low 1.5/5 from only 10 reviews — illustrating platform-level selection bias —
              while Google Reviews (4.2/5, 1,464 reviews) and Trustpilot (4.1/5, 160 reviews) are consistently more
              positive, indicating that satisfied employer-covered employees dominate high-volume review channels.
