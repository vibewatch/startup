            title: Third-Party Data Breach via Almerys (May 2026)
            body: >
              The Almerys cyberattack disclosed on 23 May 2026 represents a material operational and reputational risk.
              As Alan's third-party payment processor, Almerys's breach exposed Social Security numbers, contract
              identifiers, and civil-status data for an undisclosed number of Alan members. This is a recurring-vendor
              risk: the same operator suffered a 2024 breach affecting 33M French citizens. ACPR and CNIL have been
              notified, but regulatory action, member litigation, or commercial reputational damage cannot be excluded.
