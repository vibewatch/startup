  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Alan 所处的是法国 complémentaire santé（补充健康保险）市场；该市场在结构上不同于由工资缴费资助的基础社保健康保险（Assurance
              Maladie）。补充健康保险覆盖国家医疗体系报销与实际医疗成本之间的差额——通常包括自付部分、牙科、眼科、助听器、高于基准费率的专科医生费用，以及部分心理健康服务。资金完全来自私人保费，要么通过雇主团体（“collectif”）合同，要么通过个人（“individuel”）合同。截至
              2024，ACPR 和 DREES 确认法国补充健康保费池约为 €46.5–47.2B cotisations collectées，使其成为欧洲乃至全球最大的纯补充保险市场。

              三类主体服务这个市场：受 Code de la mutualité 约束的 mutuelles（2024 年活跃 249 家，较 2016 下降约三分之一）、受 Code de la sécurité
              sociale 约束的 institutions de prévoyance（IPs，活跃 25 家），以及受 Code des assurances 约束的 sociétés d'assurance（活跃 99
              家）。按保费份额看，商业保险公司 56%、mutuelles 26%、IPs 18%。在集体合同板块（占 cotisations 的 57%，也是 Alan 的主要狩猎场），商业保险公司持有 54%，IPs 持有
              30%，mutuelles 为 16%。这种集中度来自 post-ANI 2016 后转向团体合同的趋势，也来自最低资本要求驱动的数十年 M&A。2024 年，51 个保险集团拿走全部补充健康
              cotisations 的 85%。

              法国市场的核心监管特征包括：（1）ANI 2016 改革，自 1 January 2016 起要求所有私营部门雇主提供符合 ACPR 要求的团体健康保障，且雇主至少共同支付 50% 保费——这构成 Alan 目标
              B2B 板块的骨架；（2）Contrats responsables 框架，要求所有合规合同达到最低和最高报销水平，从而限制承保差异化；（3）100% Santé/RAC0
              改革（2019–2021），要求牙科义齿、助听器和眼镜提供零自付篮子，提高所有保险公司的赔付成本；（4）PSC 改革（Protection Sociale Complémentaire），把 ANI
              式雇主强制要求扩展到法国公共部门，多数国家部委自 1 January 2025 实施，其余部委（Education、Higher Education、Sports）以及地方 / 医院公共雇主自 1 January
              2026 实施。

              相邻但排除的支出包括：Alan 的产品不覆盖基础法定社保缴费、长期护理（dépendance）保险（法国的独立产品类别）、个人意外保险（dommages corporels
              autres），也不以独立产品形式覆盖私人急性医院保险。Alan 的平台订阅费（相当于保费的 12–14%）用于支撑数字服务，不计入官方补充健康保费统计——这在保险 cotisations
              之上形成了一层适度的双收入结构。

              国际上，Alan 活跃于比利时补充健康保险市场（约 €2.5B GWP）、西班牙自愿健康保险（VHI）市场（规模需要单独估算——见证据缺口 GM001），以及加拿大雇主补充福利市场（2022 保费约 CAD
              $55.9B）。每个市场都有不同监管牌照（FSMA/Belgium、DGSFP/Spain、OSFI/Canada）、不同产品惯例和不同在位者格局。比利时和西班牙目前对 Alan 仍在亏损，而法国已在 2025
              实现运营盈利。
