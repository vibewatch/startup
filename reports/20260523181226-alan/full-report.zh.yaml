      - number: '1.4'
        title: 运营指标、规模与地理覆盖
        blocks:
          - type: paragraph
            body: >
              Alan 的 ARR 曲线是动能最清晰的信号：从 2023 的 €340M 到 2024 的 €505M（+48%），再到 FY2025 的 €785M（+53%）；Q1 2026 单季已达到
              €804M，对应全年 €1B 目标。会员数突破 1 million（end-2025 为 1,059,000，+52% YoY），服务 37,000+ 家企业。截至 April 2026，员工数约 790+，高于
              2024 的 ~600，招聘集中在加拿大和比利时。

              法国仍是核心市场，Alan 在当地承保超过 700,000 名会员，并在 2025 实现运营盈利——这是确认法国账本单位经济性的结构性里程碑。集团口径净亏损从 2023 的 €39M 改善到 2024 的
              €34M，并在 2025 进一步降至 €26M；亏损占 ARR 的比例显著下降。公司目标是在 2027 实现集团口径盈利。

              比利时是 Alan 第二大市场，Belfius 分销合作让公司触达 Belfius 企业客户中数百万潜在员工。西班牙会员数在 2025 增长 42%，客户包括 HP 和 Volkswagen。加拿大于 early
              2025 商业化启动，目前已获得全国牌照；Quebec 推出始于 January 2026，公司在加拿大服务超过 1,600 名会员，并计划扩展至 Montreal。Alan 的 October 2024
              OSFI 牌照，使其成为 1957 以来加拿大首家新的健康保险公司。

              公共部门渗透已成为实质性增长向量：May 2025，Alan 赢得 French Ministry of Economy and Finance 补充健康招标，覆盖最多 135,000 名公务员（含家属潜在可达
              300,000）。此前公司已拿下 Prime Minister's Office 和 Ministry of Ecological Transition 合同。
