      - number: '6.2'
        title: 采用情况与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Alan 成员数从约 650,000（mid-2024，OTPP profile 口径）增长到 Q1 2026 的 1.1 million，大约 18 个月内几乎翻倍。同期，覆盖公司数从 ~25,000 扩至
              37,000+。成员增长的台阶式跃升部分由大型整块合同驱动：仅 Ministry of Finance 就自 January 2026 起贡献 130,000 名直属公务员，加入率达
              96%——这是离散队列最可见的留存代理指标。Q1 2026 股东信确认，在类似营销投入下，新业务获取同比增长 60%，指向销售与市场效率的实质改善。

              收入轨迹印证成员增长：ARR 从 €505M（mid-2024）升至 €785M（end-2025）和 €804M（Q1 2026），约为 59% 年增长。较低保费公共部门合同对单成员收入的部分稀释，是基于
              ARR 与成员增长率相对关系的推断，并未公开披露。新闻室发布的运营指标显示，99% 的报销在一天内处理，2016 年以来已处理 73 million+ 笔报销，可作为平台成熟度证据。

              核心保险之外的产品采用正在加速：Mo AI 健康伴侣已在法国向 500,000+ 名成员开放（约为法国成员的 45%），互动量是此前人工 Clinic 的四倍。Prévenir（职业健康）覆盖 100 家公司的
              14,000 名员工，显示出向职场预防的增购牵引。Alan Play 步数挑战据报道在团队活动期间推动日活跃用户提升 +70%。
