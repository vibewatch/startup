  - id: TM004
    title: 增长驱动因素与结构性约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 对 Alan 的影响
      - 尽调问题
    rows:
      - - ANI 2016 私营部门雇主强制要求
        - 增长驱动
        - 结构性（2016 以来持续）
        - 保证一块庞大且稳定的团体合约基础，Alan 可持续切入；法国补充医疗保费中 57% 已来自团体 / 集体
        - 确认 Alan 在 ANI 相关竞争性招标中相对 IP 和大型保险公司的中标率
      - - PSC 2025–2026 将雇主强制要求延伸至公共部门
        - 增长驱动
        - 立即（2025–2026 推出）
        - 打开 3.5M 公务员可服务人群；Alan 已中标经济部招标（135K 名公职人员）；推出动能延续至 2026
        - 按部委跟踪 PSC 落地节奏；评估首单之后 Alan 在未来公共招标中的中标率
      - - 医疗通胀和医疗成本上升
        - 增长驱动 + 约束
        - 当前（结构性）
        - 推动保费规模增长（2024 +7.6–8.2%），扩大绝对 TAM；同时推高赔付成本，压迫 Alan 的均衡定价模型
        - 跟踪 Alan SFCR 申报中的赔付 / 保费比率；与 DREES 2025 的市场平均 79% 赔付率对比
      - - 员工健康福利数字化转型
        - 增长驱动
        - 短期（2025–2028）
        - 催生对 Alan 以 app 为中心、AI 驱动模式的需求；81% 的 Alan 患者选择 AI 而非传统问诊；Alan Walk 周活跃 35%
        - 将 Alan 的 NPS 和留存与传统既有机构对标；通过独立调查验证 90% 会员满意度说法
      - - 100% Santé / RAC0 改革带来的赔付通胀
        - 结构性约束 / 逆风
        - 持续（2019–2026+）
        - 强制牙科 / 眼科 / 助听器零共付篮子；2019–2021 推动 CHI 额外支出 €2.1B；助听器使用率 +75%；老年人保费上升 7–12%；压缩全市场技术利润率
        - 按会员账本年龄结构评估 Alan 敞口；量化赔付中 100% Santé 篮子 vs 一般 frais de soins 的占比
      - - 既有机构通过 accords de branche（行业指定条款）固守
        - 结构性约束 / 逆风
        - 结构性（持续）
        - 行业层面的协议为整个职业领域指定特定 IP；即便没有强制指定，既有机构也受益于行业层面的合同惯性，限制 Alan 进入某些行业
        - 按 NACE 行业映射 Alan 的 SME 组合；找出仍有 branche 指定协议、Alan 难以切入的行业
      - - 年度更换权（résiliation infra-annuelle，2020）
        - 增长驱动（降低切换门槛）
        - 2020 起生效
        - 雇主在第一年后可每年无罚金更换团体补充医疗保险人；降低切换成本，利好 Alan 这类挑战者
        - 量化 Alan 来自竞争性切换 vs 新投保客户的胜率；跟踪合同起始季节性
      - - 多司法辖区监管复杂度（ACPR/FSMA/DGSFP/OSFI）
        - 结构性约束
        - 持续
        - 每个新地域都需要单独投入资本、合规、产品本地化和数据主权工作；提高扩张固定成本，拖慢法国以外市场的规模化速度
        - 评估 Alan 跨司法辖区的合规资源配置；分别验证比利时、西班牙和加拿大的偿付能力比率
      - - 第三方运营风险（Almerys 网络攻击，May 2026）
        - 约束 / 新兴风险
        - 当前（截至 runDate 属急性）
        - Almerys 数据泄露暴露会员数据（SSNs、民事身份信息、合同号）；已通知 ACPR 和 CNIL；带来声誉与监管风险；两年内第二次事故；可能引发监管处罚和会员流失
        - 确定受 May 2026 泄露影响的 Alan 会员数；评估 CNIL 调查时间线；监控披露后会员留存
      - - 既有机构数字成熟度低，为数字原生颠覆者打开窗口
        - 增长驱动
        - 短期（2025–2028）
        - Mutuelle 和 IP 既有机构数字化慢；Deloitte Belgium 研究确认 44% 的比利时人看不懂账单；1/3 因财务约束推迟就医——这正是 Alan UX 直接解决的痛点
        - 跟踪既有机构数字投入水平；评估 AXA Healthanea、AG Insurances 的 MyEmployeeBenefit 或 Doctolib 产品是否缩小 UX 差距
    enumerationScope:
