  - id: FV003
    title: 按情景划分的估值与回报区间
    type: range
    layout: standard
    summary: 在悲观、基准、乐观情景下，相对当前 €5B 标记的低 / 基准 / 高隐含股权估值和投资者回报。
    data:
      items:
        - label: 悲观情景（承保方重定价至 2–3× ARR）
          low: 1.7
          mid: 2.5
          high: 3.3
        - label: 基准情景（退出时远期 ARR 6–8×）
          low: 7
          mid: 8.5
          high: 10
        - label: 乐观情景（IPO 时远期 ARR 10×）
          low: 12
          mid: 13.5
          high: 15
    approximationNotes: >-
      区间单位为 €B。悲观情景假设 FY2026E ARR €0.85–1B 按 2–3× 重定价。基准情景假设 FY2027–2028E ARR €1.1–1.3B、倍数 6–8×。乐观情景假设 FY2028–2029E ARR
      €1.5B+、倍数 10×。回报为当前 €5B 标记的倍数，未计稀释。
    claimRefs:
      - CV034
      - CV035
      - CV036
