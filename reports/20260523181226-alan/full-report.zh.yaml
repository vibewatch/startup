      - number: '8.2'
        title: 估值方法与可比分析
        blocks:
          - type: paragraph
            body: >
              Alan 是一个混合体：一边是受 Solvency II 监管的保险承保主体，一边主要经济利润池来自类似 SaaS 的管理费，约占保费
              12–14%，其下还叠着接近零利润的保费穿透层。这种双层结构带来估值歧义：Alan 应按承保公司定价（1.5–3.5× 净收入），按技术赋能 MGA 定价（3–8× 净收入），还是按 AI-native
              保险公司定价（15–30× 净收入）？答案影响很大。在 €5B 估值和 FY2025 ARR €785M 下，Alan 的 ARR 倍数约为 6.4×，处于技术赋能承保公司的上沿，但明显低于 SaaS
              溢价层。若只按订阅收入估值（€785M 的 12–14% = 约 €94–110M），隐含倍数会升到约 46–53× 净订阅收入，结构上撑不住。更合适的框架是混合 ARR
              倍数（6.4×），承认保费和订阅是共同打包，无法为倍数目的拆开。Windsor Drake Q1 2026 Insurtech Valuation Report 确认，公开市场保险科技公司当前交易区间为
              6–10×，而私募市场可因质量和增长给出更高溢价。Nelson Advisors 的 European HealthTech M&A 2025 报告显示，HealthTech 平均收入倍数为 4.8×（Q1
              2025），AI、远程医疗和分析 平台可升至 6–8×。按这个视角，Alan 6.4× 的混合倍数处在欧洲 HealthTech M&A 市场高端，但不是离群值，前提是 AI/tech
              定位溢价能被证实。对比公开可比公司：Oscar Health（OSCR，NYSE）TTM 收入 $13.3B，市值 $6.83B（P/S ≈ 0.51×），但 Oscar
              是全栈承保公司，收入构成差异很大，规模也达到 Alan ARR 的 17×。Lemonade（LMND，NYSE）是技术优先保险公司，TTM 收入 $844.7M，P/S 约 5.14×，EV 为
              $4.17B，规模更可比，但仍亏损（TTM 净亏损 $138.9M）。Clover Health（CLOV，NASDAQ）LTM 收入 $2B，EV 约 $2B（EV/Revenue ≈
              1×），交易更接近纯承保公司。公开市场先例表明，Alan 拿到的私募溢价（6.4× ARR）同时反映了相对公开可比公司的非流动性和增长溢价。相对上市同业，关键结构性劣势是：没有 GAAP/IFRS
              审计合并账目、未披露赔付率、没有按国家拆分的 P&L；这些都是任何公开上市都会要求的信息，也显著抬高尽调风险。
