      - number: '4.4'
        title: 公开财务缺口与尽调结论
        blocks:
          - type: paragraph
            body: >
              Alan 的公开财务披露仅限于：SFCR 摘要网页（不是可访问的完整 PDF SFCR）、发布会上披露的 ARR 和净亏损数字，以及公司沟通中引用的偿付能力比率区间。市场上没有可公开取得的 GAAP 或 IFRS
              审计合并财务报表。全集团缺少法定审计轨迹，意味着投资人和尽调方无法独立验证收入确认、资产负债表项目或现金流动态。具体缺口包括：（1）精确的赔付 /
              保费（亏损）比——健康险核心指标——从未披露，精算风险无法量化；（2）获客成本和回本周期完全不公开，无法做标准 SaaS 单位经济对标；（3）按国家拆分的 P&L（France, Belgium, Spain,
              Canada）不可得，掩盖国际扩张市场对集团盈利路径的拖累；（4）按计划层级计算的单成员订阅费水平未正式披露；第三方可比项引用的总计划保费为
              €39–120/month，但每一层级中订阅费与保险保费的拆分不透明。法国工会和 MGEFI（French Ministry of Finance 的原任互助保险机构）提出的反向担忧集中在 Alan
              持续亏损以及履行多年公共部门义务的能力上。分析师 Matteo Carbone（IoT Insurance Observatory）称，相对保费规模和缺乏盈利能力，Alan 的 €4B 估值“不现实”。Alan
              的 Solvency II 资本缓冲（3.6× SCR）、ACPR 监管和再保险安排部分缓解了上述担忧。财务结论是：Alan 展现出强劲的收入质量改善，并有一条到 2027
              年实现集团盈利的可信路径，但多项关键私有指标缺失，若无数据室，无法给出完整承销式财务评估。
