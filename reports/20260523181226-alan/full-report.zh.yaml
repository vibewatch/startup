        title: 产品组合与数字 App 体验
        blocks:
          - type: paragraph
            body: >
              Alan 的产品组合已经扩展成一个综合健康超级 app，把数字保险、医疗服务、预防和商业服务整合进单一移动体验。核心是 Alan app（App Store 评分 4.9/5，May 2026 版本
              1.451.0），成员可即时使用数字 Tiers Payant 卡，在药房和医疗服务方直接结算；也可拍照提交理赔，并接收实时报销通知。这个 app 是其他 Alan 产品的入口：Alan Clinic（每周 7
              天的医疗聊天和视频问诊）、Alan Play（游戏化健康挑战和预防项目）、Alan Précision（通过 Aro 收购获得的精准生物标志物检测）和 Alan Shop（包含光学产品的精选健康电商）。

              50% 的报销在五分钟内处理完成，这一基准让 Alan 区别于通常需要 48–72 小时的传统保险公司。成员在 app 内拍摄收据即可提交理赔；AI 自动解析文件，无需手动录入。HR 管理门户通过 HRIS
              集成自动完成员工加入和保障生命周期管理，将普通 SMB 每年的保险管理时间压到不到两小时。Alan 通过六个独立法人运营——Alan Insurance、Alan Services、Alan Tech、Alan
