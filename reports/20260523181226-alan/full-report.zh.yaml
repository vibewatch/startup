      - number: '1.2'
        title: 创始人、管理层与公司治理
        blocks:
          - type: paragraph
            body: >
              Jean-Charles Samuelian-Werve（CEO）和 Charles Gorintin（CTO）是仅有的两位联合创始人，公司成立近十年后仍担任执行领导。Samuelian-Werve 此前共同创办
              Expliseat，后者开发了全球最轻的认证经济舱飞机座椅；他拥有 École des Ponts ParisTech 工程硕士、Collège des Ingénieurs MBA，并是 French
              Institute of Actuaries 会员。他于 2021 获得 Ordre National du Mérite。Gorintin 加入 Alan 前曾任 Facebook、Instagram 和
              Twitter 数据科学负责人，聚焦社交网络增长与欺诈；其学术背景横跨 École des Ponts ParisTech、ENS Paris-Saclay（Machine Learning）和 UC
              Berkeley 的 Haas School of Business（Financial Engineering）。

              两位创始人也是 Mistral AI 的非运营联合创始人和董事。Mistral AI 是 April 2023 在巴黎成立的大语言模型公司，估值约 €12B。Alan 自身持有 Mistral 少数股权。保险与
              AI 战略的交织，是 Samuelian-Werve「methodic optimist」世界观的核心：技术可以在规模化层面提升医疗质量，但前提是搭配扎实的保险和临床运营。

              Alan 的高管团队包括 Mihaela Albu（财务与战略，前 McKinsey Associate Partner，INSEAD MBA）、Paul Sauveplane（秘书长兼 HRD，前 ACPR 和
              Inspection Générale des Finances，也是 Alan ACPR 牌照流程的设计者）、Marion Bergeret（公司事务 / 法务，前 Oxford、UC Berkeley 和
              AI startup Snips）、Laurent Guérin（保险，前 French Treasury，École Polytechnique/MIT），以及法国（Fabrice
              Staad）、比利时（Sébastien Fredeau）、西班牙（Yoann Artus）和加拿大（Mark Goad，前 Curv Health 和 OMERS Ventures）的国家负责人。Index
              Ventures 的 Jan Hammer 自 Alan 2018 Series A 起担任董事。

              一个关键治理特征是：创始人和员工合计持有 Alan 超过 40% 的资本，并维持多数表决权。即便 8 轮融资合计约 ~€754M，公司战略也不受单一投资人控制。
