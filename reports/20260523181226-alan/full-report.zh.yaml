  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险图谱
        blocks:
          - type: paragraph
            body: >
              Alan Insurance SA 是持牌健康与保障险保险公司，受法国 Autorité de contrôle prudentiel et de résolution（ACPR）监督，并受完整 Solvency
              II 框架约束。Alan 自身 2024 SFCR 披露，自有资金为 €294 million，覆盖 Solvency Capital Requirement 4.6 倍、Minimum Capital
              Requirement 超过 18 倍，明显高于行业最低要求。不过，修订后的 Solvency II directive 自 2026 起适用于 EU
              成员国，引入八项技术重校准——包括新的收益率曲线外推方法、修订后的利率冲击因子和重构的 Volatility Adjustment——Alan 必须建模确认，在新的标准公式参数下，其资本充足位置不会恶化。ACPR
              发布的 2026 工作计划将监管简化、治理、AI 监督和 DORA 实施列为五个优先轴。压力尤其落在 Axis 3（DORA cyber/operational resilience）和 Axis 4（AI
              risk supervision）上，两者都直接触及 Alan 以技术为中心的模式。在公共采购场景中，Alan 面向 130,000 名公务员的 Bercy 合同已于 1 January 2026
              启动；在此之前，被替换的 mutual MGEFI 提出 référé précontractuel，Tribunal administratif de Paris 于 20 June 2025
              驳回该禁令（ordonnance #2514913/4-1），确认采购程序有效。MGEFI 已表示有意就授标实质继续提起实体挑战，留下非轻微的诉讼尾部风险。代表 Bercy
              七个工会的工会组织公开反对过渡，理由包括数据主权和服务质量担忧，为合同连续性增加政治复杂度。最后，EU AI Act 将健康险承保算法归为高风险 AI 系统；Alan 的 MO AI
              系统以及任何理赔评分算法的合规义务将于 2 August 2026 生效，罚金最高可达 €15 million 或全球年营业额的 3%。
