      - number: '2.4'
        title: 增长驱动、采用阻力与结构性约束
        blocks:
          - type: paragraph
            body: >
              法国补充健康市场的增长由 ANI 2016 强制要求提供结构性支撑：它创造了可预测、稳定的雇主团体合同保费池，并把团体 cotisations 推到全部补充健康保费的 57%。PSC
              改革（2025–2026）把这一逻辑扩展到法国公共部门——国家、地方和医院雇主下的 3.5 million 名公务员——打开此前未被充分开发的大型雇主板块，Alan
              已在这里展示竞争成功。医疗通胀进一步支撑保费增长：France Assureurs 确认 2024 cotisations 增长 +7.6%，由费率上调和合同数量增加共同驱动。DREES 记录 +8.2%
              增长，为 2012 以来最高；2024 也是整体技术结果自 2011 以来首次转正，说明保险公司在多年亏损后开始修复利润率。

              数字化转型是长期需求驱动。Alan 的 Q4 2024 股东信显示，81% 的患者选择 AI 辅助问诊（Mo），而非传统医生互动；Alan Walk（游戏化预防）周活参与度 35%；AI 工具让销售团队生产率提升
              50%。Deloitte 的 2024 比利时健康保险消费者研究确认，27% 的比利时年轻成年人（25–34）使用健康 app，推动保险产品向数字原生平台创新。欧洲保险科技市场预计到 2031 的 CAGR 为
              52%，印证投资人和运营方对传统保险数字化颠覆的需求（Cognitive Market Research 2024）。

              最实质的结构性逆风是 100% Santé/RAC0 改革。该改革在 2019–2021 实施，但仍持续推高赔付。DREES 英文研究确认，个人合同持有人中 85 岁人群保费上涨 12%，60 岁人群上涨
              7%；CHI 机构为覆盖项目额外支付 €2.1B；2019 到 2021 之间，助听器使用量上升 75%（牙科义齿 / 眼镜上升
              17%）。该改革结构性抬高所有补充健康保险公司的赔付率；随着保障认知扩大，赔付通胀仍在延续。DREES 2025 报告记录，2024 prestations 增长 +5.4%，快于核心医疗通胀。对 Alan
              而言，公司把保险保费目标定在均衡水平（保险技术利润为零），结构性赔付成本更高意味着订阅利润必须承担更多压力。

              第二个逆风是在位者集中且根深蒂固。51 个集团控制法国补充健康市场 85%。头部 institutions de prévoyance（Malakoff Humanis、Klesia、AG2R La
              Mondiale）通过行业层面的 accords de branche 主导集体合同板块，这些协议会为整个专业行业指定某一家保险公司——无论价格或服务质量如何，都把雇主锁进在位者。这类强制指定条款在 2013 被
              Conseil Constitutionnel 部分推翻，但自愿指定安排仍然常见，并制造结构性惯性。

              第三个逆风是多司法辖区监管复杂度。Alan 的国际扩张要求同时维持 ACPR（France）、FSMA（Belgium）、DGSFP（Spain）和
              OSFI（Canada）牌照，每张牌照都有不同偿付能力要求、产品规定和数据隐私规则。May 2026 的 Almerys 网络攻击涉及 Alan 的第三方支付运营商，在 ACPR 和 CNIL
              框架下引入新的合规风险，也凸显了在高度监管市场依赖第三方基础设施的运营风险。最后，Alan 在集团亏损且市场份额 <1% 时仍拥有 €5B 估值，已受到 Matteo Carbone（IoT Insurance
              Observatory）等分析师的外部审视；他认为相对保费规模和持续亏损，该估值「不现实」。这会成为任何新股交易或老股出售中的尽调敏感逆风。
