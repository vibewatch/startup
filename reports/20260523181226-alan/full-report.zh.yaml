      - number: '6.3'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              Alan 的具名客户证据在法国公共部门最强，因为竞争性招标结果和官方部委公告提供了一手层级佐证。Ministry of Finance（Bercy）合同记录最充分：Alan 官方博客、多家独立新闻媒体和 Q1
              2026 股东信均确认 130,000 名公务员上线以及 96% 加入率。Ministry 表示 Alan 的报价在经济性、服务质量和最低管理成本上 "mieux-disante"。2024 年的
              Ministry of Ecology（60,000 名公务员）和 PM Services（4,900 名员工）合同，以及 2023 年的 Assemblée nationale
              合同，构成一条有记录的公共部门胜利阶梯。合计看，Alan 在 24 个月内至少将公共部门覆盖基数扩大了三倍。

              私营部门中，HP 和 Volkswagen 是仅有的、经媒体报道（abcmoney.co.uk、fintech.global）确认的具名企业雇主客户。Alan
              不公布客户名单，这些客户的具体部署规模或结果数据也不可公开取得。OTPP 的投资者资料独立佐证，Alan 在更早阶段 "partnered with 25,000 companies"。Activepieces
              案例研究记录的是 Alan 内部使用自动化技术的情况，更适合作为技术供应商参考，而不是健康险客户证明点。

              汇总客户评分（Goodassur 聚合 Opinion Assurances、Trustpilot、Google Reviews 和 Selectra 上 2,300+ 条已验证评论，得分 4.0–4.2/5）与
              Ministry of Finance 官方评估，共同构成最强第三方背书。Opinion Assurances 上的负面评论记录了反复出现的摩擦点：报销错误、难以联系人工顾问，以及保费上涨，尤其集中在复杂理赔和
              TNS 画像。
