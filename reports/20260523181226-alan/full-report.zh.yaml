  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与 ARR 曲线
        blocks:
          - type: paragraph
            body: >
              Alan 的商业模式拆成两层明确分开的收入。第一层是保险保费，定价基本贴近预期赔付；Alan 的目标赔付 / 保费比约为 100%，意味着保费大多直接转付给报销，Alan
              几乎不保留精算净利差。第二层是按成员按月收取的订阅费，用来支撑数字健康平台：AI 医疗聊天、光学产品下单、背痛项目和预防工具。CEO 公开表示，管理费定在 "12 to 14% of
              premiums"，因此订阅层是在低利润保险底座之上的、结构上独立的高毛利类 SaaS 收入流。Prévoyance（伤残 / 人寿）约占法国收入的 25%，也采用同样的穿透转付结构。ARR 从 €340M
              (FY2023) 增至 €505M (FY2024, +48%)、€785M (FY2025, +53%)，Q1 2026 达 €804M，正朝 €1B 年度目标推进。法国占集团 ARR
              的四分之三以上。公共部门在拿下 Ministry of Economy and Finance（135,000 名公务员）及更早的政府部门合同后，贡献 FY2024 净 ARR 增长的 32%，FY2025
              又扩大四倍。国际市场（Belgium, Spain, Canada）在增长，但仍只是集团收入少数。按 €785M 的 12–14% 估算，订阅收入约为
              €94–110M；这是主要经济利润池，必须先覆盖运营费用，集团净利润才可能转正。
