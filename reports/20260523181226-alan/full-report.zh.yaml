      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              情景分析锚定三个变量：ARR 轨迹、集团盈利路径、退出倍数压缩。牛市情景下，Alan 在 2026 年实现 €1B ARR 目标，并按指引在 FY2027 实现集团层面盈利；国际市场（比利时、西班牙、加拿大）到
              end-2027 贡献 ARR 30%+；公司在 2029 IPO 时获得 10× forward ARR 倍数——对应 €1.5B+ ARR 上潜在股权价值 €12–15B。这个情景下，早期 Series E
              投资人（€2.7B 进入估值）约有 5× 回报，Series F 投资人（€4B 进入估值）约有 3–4× 投入资本回报。基准情景下，2026 年 ARR 增速放缓至 30–35%（ARR
              €1–1.1B），集团盈利从 2027 年推迟到 FY2028，2029–2030 年退出时倍数压缩至 6–8× forward ARR——对应股权价值 €7–10B，较当前 €5B 标记有 40–100%
              上行。Series F 投资人获得 1.75–2.5× 回报。熊市情景下，公共部门流失或赔付率恶化导致 ARR 增速快速降至 20% 以下，集团盈利推迟到 2030+，Solvency II 审查（January
              2027 implementation）带来额外资本要求，市场将 Alan 重新按承保公司以 2–3× ARR 定价（在 €1B ARR 上对应 €2–3.3B 估值），较当前标记下跌 33–60%。如果
              Carbone 的批评在规模化后被证明正确，这个熊市情景在结构上成立：剥离 tech 溢价后，Alan 的基本经济性更像一家边际盈利的利基保险公司，而非技术平台。Solvency II
              审查是真实的结构性风险：EIOPA 修订框架计划于 30 January 2027 实施，可能改变资本公式要求；Alan 的 SCR 覆盖缓冲（3.6×）目前充足，但必须在潜在修订校准下继续维持。
