  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与当前估值标记
        blocks:
          - type: paragraph
            body: >
              Alan 的估值曲线是欧洲保险科技里最紧凑、也最连贯的一条。从 October 2016 的 €12M 种子轮起，公司又完成七轮融资，到 March 2026 投后估值达到 €5B，累计股权融资约
              €754M。September 2024 的 Series F 融资 €173M，由比利时银行保险机构 Belfius 领投，把估值定在 €4B；Belfius 同时与 Alan 建立分销合作，让 Alan 触达
              Belfius 的企业和机构客户。March 2026 追加轮融资 €100M，由既有股东 Index Ventures 领投，新机构股东包括 Greenoaks、Kaaf、SH Capital，天使投资人包括
              Shopify 创始人 Tobi Lütke 和足球运动员 Antoine Griezmann。尽管 Alan FY2025 仍披露集团净亏损 €26M——已较 FY2024 的 €34M 大幅改善——估值仍从
              €4B 上调至 €5B，提升 25%。€5B 标记对应 Q1 2026 ARR run-rate €804M（约 6.2× forward ARR），也对应公司披露的 2027
              年集团盈利路径。关键在于，2024–2025 有 30% 的欧洲独角兽失去十亿美元估值身份；在区域整体倍数压缩时，Alan 反向上调估值，是明确的异类。ACPR 确认 Alan FY2025 Solvency
              and Financial Condition Report（SFCR）已在 22 April 2026 获董事会批准；Alan 持有超过 €374M 监管资本，对应约 €105M 的 Solvency
              Capital Requirement（覆盖倍数 3.6×，法国市场平均为 2.41×）。CFO Mihaela Albu 将 March 2026 的 €100M 融资称为「机会型」，原因是公司已有 €376M
              现金储备——这表明近期没有偿付能力或流动性压力，这轮更像 M&A 弹药和增长资本，而非续命融资。创始人与员工仍持有约 40% 股本和多数投票权，这限制早期投资人的二级流动性，也意味着近期若
              IPO，将由创始人控制节奏。
