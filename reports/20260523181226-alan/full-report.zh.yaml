        exist not captured in public sources as of Q1 2026
    notes: >
      “方向”列使用“增长驱动 / 约束 / 逆风”词汇。“时点”列使用“立即（≤12 个月）”“短期（1–3 年）”或“结构性（多年、持续）”。“影响”聚焦 Alan
