          to: moat
          label: 支撑
        - from: moat
          to: valuation
          label: 证明部分溢价有依据
        - from: risks
          to: valuation
          label: 约束
        - from: valuation
          to: recommendation
          label: 导向
    approximationNotes: 定性流程；节点权重不是基数。
