      - number: '4.3'
        title: 资本充足性与 Solvency II 合规
        blocks:
          - type: paragraph
            body: >
              Alan 作为保险集团受 Solvency II（Directive 2009/138/EC）监管，由 ACPR（Autorité de Contrôle Prudentiel et de
              Résolution）监督。在 Solvency II Pillar I 下，Alan 必须持有不低于 Solvency Capital Requirement（SCR）的合格自有资金；SCR 是以 99.5%
              概率吸收一年内损失所需的资本。Alan 的 SCR 约为 €105M，主要由健康险承保风险驱动（暴露于医疗成本波动和 prévoyance 承诺）。Alan 持有超过 €374M 的监管自有资金，覆盖率超过
              SCR 的 3.6×。FY2023 SFCR 引用的偿付能力比率约为 450%，高于法国补充健康险市场 241% 的平均值（H1 2025，ACPR/Chambers 数据）和 100% 的监管下限。FY2025
              自有资金较 FY2024 末增加 €80M，部分来自净结果改善和资本结构管理。现金及流动性存款合计约 €376M（FY2025
              末），以保守方式存放在一线金融机构的存款账户中——不投资公开股票或高风险工具，符合监管资本保全政策。Alan 的再保险安排涉及 Swiss Re、GenRe、CNP Assurances、Hannover Re
              和 Belfius Insurance，通过结构化风险转移封顶医疗成本波动，并保护 SCR 免受不利赔付发展冲击。March 2026 的 €100M 融资被 CFO Albu
              定性为“机会型”——公司并无即时资本需求（FY2025 末手头有 €376M）——资金将用于 M&A 和国际扩张，而不是覆盖运营缺口。年度 SFCR 发布是 Solvency II 的强制义务；Alan 的
              FY2025 SFCR 已在 22 April 2026 经董事会确认。
