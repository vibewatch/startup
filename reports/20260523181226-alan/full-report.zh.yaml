  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >
              Alan 的客户基础横跨两条主要商业渠道：企业对企业（B2B）的雇主赞助团体健康险，贡献其 1.1 million
              名成员中的绝大多数；以及规模较小但增长中的企业对消费者（B2C）板块，面向自雇专业人士（travailleurs non-salariés, TNS）和个人成员。在法国，SME 板块（1–500
              名员工）仍是历史核心；Alan 最初瞄准科技创业公司进入市场，之后扩展到更广泛的中端雇主。个人和 TNS 计划（Rubis, Emeraude, Saphir/Diamant）针对 40 岁画像的定价为
              €49–91/month，使 Alan 处于个人市场的高端。

              从地域看，法国主导成员数量，也是截至 2025 Alan 唯一实现运营盈利的市场。Belgium 和 Spain 是有意义的次级市场，其中 HP 和 Volkswagen 被列为具名企业客户；Belgium
              的分销还受到 Belfius 银行合作伙伴关系的进一步推动。Canada 在 2024 获得省级牌照并已开始商业运营，但仍处早期。

              自 2023 以来，公共部门敞口明显上升。Alan 在 2023 赢得 Assemblée nationale 合同，2024 赢得 Ministry of Ecology（60,000 名公务员）和 Prime
              Minister Services（4,900 名员工）合同，2025 赢得 Ministry of Finance（Bercy, 130,000 名公务员, live January 2026）合同。这把
              Alan 的买方画像从私营雇主扩展到中央政府 HR 部门，引入不同采购动态、更长合同周期，以及与法国 PSC reform 连续性绑定的结构性续约风险。
