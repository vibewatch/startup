      - number: '5.5'
        title: 信任、合规与数据安全
        blocks:
          - type: paragraph
            body: >
              Alan 持有 ISO 27001 认证，由 SGS 审核并认证，覆盖 100% 的团队、运营和地域（France, Belgium, Spain, and Canada）。公司的 CNIL 数据处理声明（No.
              2004097 v0）规范法国和 EU 法律下的自动化健康数据处理。Alan 在 February 2026
              的隐私政策中明确承诺绝不出售成员数据，也绝不使用健康数据进行差别定价；相较多数传统保险公司，这是有意义的信任差异点。

              结构性安全风险很大。Alan 将第三方支付处理交给 Almerys，后者在 early 2024 发生数据泄露，影响 33 million 多名法国投保人；CNIL 已启动正式调查。在 23 May
              2026——本报告日期——Le Figaro 确认 Almerys 遭遇新的网络攻击，影响 Alan 成员，社会保障号和保险合同号被暴露。银行数据和健康数据未受损。Alan 立即关闭受影响平台，通知 CNIL 和
              ACPR，并承诺通过电子邮件逐一通知受影响成员。

              独立评论聚合平台（Selectra、Trustpilot）显示出一致的反向模式：成员反映难以联系到人工顾问、保费意外上涨，以及 AI 聊天机器人将他们的问题误判为超出范围。这些投诉与 Alan 的数字优先、AI
              高占比服务模式存在结构性联系；在重视人工可达性超过速度和便利的细分群体中，这代表持续流失风险。
