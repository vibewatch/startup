      - number: '8.5'
        title: 建议、破坏论点的触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              我们的建议是 TRACK。按 €5B 投后估值，Alan 的估值可以辩护，但在关键证据缺口解决前，还不足以支持新建仓达到 investment-grade。业务轨迹——法国盈利、ARR 同比 +53%、亏损占
              ARR 比重 3.3%、Solvency II 缓冲 3.6×——验证了增长故事，但没有解决核心精算和财务披露缺口（无赔付率、无 IFRS 审计账目、无按国家拆分 P&L）。€5B
              私募标记意味着，在同一收入基数上相对公开市场可比公司有 25–100% 溢价（Lemonade P/S 5.14×，是最接近的公开可比对象，尽管仍亏损）。该溢价只有在以下条件成立时才合理：（a）集团盈利按指引在
              FY2027 到来，（b）赔付率如公司所称维持在接近 100%，（c）Alan 成功放大比利时、西班牙和加拿大业务，且不触发重大 Solvency II 资本补缴。若要上调至
              RECOMMEND，需要：FY2027 集团层面盈利提前或按期得到确认；发布 IFRS 审计合并财报，或获得独立精算方对赔付率签字确认；并有清晰证据表明公共部门 ARR 不集中在单一部委。若出现以下情况，则下调至
              AVOID：赔付率出现重大偏离（理赔持续超过保费 105%）、ARR 增速在任意连续两个季度降至 20% 以下，或 ACPR 及比利时 / 西班牙监管机构采取监管行动。治理集中风险（创始人与员工以 40%
              股本持有投票多数）是欧洲成长期公司的常见结构，但会给早期投资人带来二级流动性风险；任何潜在投资人都应争取按比例认购权、反稀释条款，以及与持股比例相匹配的董事会席位。
