      - number: '2.3'
        title: 买方格局与细分图谱
        blocks:
          - type: paragraph
            body: >
              Alan 的主要买方是雇主——为员工选择并采购团体补充健康保障的 HR 负责人或企业主。在法国团体市场，雇主既是预算所有者也是签约方，按 ANI 2016 至少支付 “cotisation
              d'équilibre” 的 50%。员工（终端用户和被保险会员）通常不选择保险公司，而是通过 Alan 的移动
              app、报销速度、虚拟诊所和预防功能直接体验产品。因此，支付结构把采购（雇主）和消费（员工）拆开，形成买方—用户双重结构：Alan 必须在价格和合规上赢得雇主信任，同时在体验上赢得员工满意。

              法国的细分结构横跨五类主要雇主：（1）中小企业（1–250 名员工）——Alan 交易量最高的板块，行政简化和上线速度是决定因素；（2）中型市场和大型企业（250+ 名员工）——Alan
              目前增长优先级更高，已在西班牙签下 HP 和 Volkswagen，也在法国拿下多个大型账户；（3）公共部门机构——PSC 改革后开始出现；Alan 于 May 2025 赢得 Ministry of
              Economy and Finance 招标（135,000 名 agents，含家属最多 300,000），验证了其参与大规模采购招标的能力；（4）自由职业者和自雇人士（travailleurs
              indépendants）——Alan 自 2017 起服务该板块，使用个人而非团体合同；（5）退休人群——January 2025 起新增覆盖，TechCrunch 报道法国每年新增 750,000
              名退休人员。

              在比利时，Alan 的市场进入受 Belfius 分销合作塑造：Belfius 充当可信中介和分销渠道，把自身 7,000+ 名员工以及企业和机构客户管线导向 Alan。这种伙伴渠道模型降低了 Alan
              的直接销售成本，但也让比利时增长依赖 Belfius 关系。在西班牙，Alan 锁定大型跨国企业（已有 HP、Volkswagen 记录），并向中小企业扩展。在加拿大，Alan 仍处商业化早期（Q1 2026
              会员 1,600+），买方画像与法国类似——寻求数字优先团体补充福利的雇主。

              采用触发点因板块而异：对中小企业，触发点通常是减轻行政痛点（即时报销、零纸面流程）以及人才竞争压力；对大型企业，是员工体验对标、ESG/健康福祉报告要求和采购周期时点的组合；对公共部门机构，PSC
              改革创造了强制采购窗口。既有团体合同的切换成本受到法国年度切换权（résiliation infra-annuelle since 2020）缓和，但惯性仍在，因为 HR 团队必须沟通变更、迁移员工数据并管理
              IT 系统集成。Alan 的 AI 辅助上线和数字 HR 工具，就是为降低这种切换摩擦而设计。
