      - number: '6.4'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >
              Alan 未公开披露净收入留存率（NRR）、总收入留存率（GRR）或队列层面的流失率。可用代理指标包括：自报 90% 成员满意度、NPS 为 68 而行业平均约为 3（官方 Bercy 公告博客引用），以及截至
              May 2026 约 ~2,300 条已验证评论汇总的消费者评分 4.0–4.2/5。Ministry of Finance 上线时 96% 的加入率，是单一大队列可信的激活代理指标，但激活不同于年度续约率。

              对广义雇主赞助 B2B 健康险而言，行业基准显示，在雇主承担大部分保费时，年度留存率为 85–92%。Alan 按细分市场拆分的具体留存未知。ARR 在 ~18 个月内从 €505M 增至
              €804M，意味着组合层面收入留存强劲，但无法隔离单个雇主续约率或细分组合影响。法国市场实现运营盈利，意味着规模下单位经济为正；这是耐久留存的间接指标，而不是高流失的信号。

              Opinion Assurances 和 Goodassur 上的反向评论信号指出三类反复摩擦：报销错误和繁琐纠正流程、复杂案例缺乏直接电话支持，以及 TNS 和个人客户认为保费涨幅高于市场平均。Selectra
              平台仅 10 条评论却显示很低的 1.5/5，说明平台层面存在选择偏差；Google Reviews（4.2/5，1,464 条评论）和 Trustpilot（4.1/5，160
              条评论）则持续更正面，表明由雇主覆盖的满意员工主导了高容量评论渠道。
