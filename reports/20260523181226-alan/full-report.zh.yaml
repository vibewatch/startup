      - number: '7.2'
        title: 网络安全与数据隐私风险
        blocks:
          - type: paragraph
            body: >
              Alan 最重大的运营风险，是结构性依赖 Almerys 这个第三方 tiers-payant 运营商；后者处理所有健康报销交易。Almerys 在 24 个月内被攻破两次：January 2024 攻击暴露
              33 million 名法国被保险人数据（CNIL 启动正式调查）；May 2026 的第二次攻击——在本报告运行日得到确认——再次暴露 Alan
              成员记录，包括姓名、出生日期、社会保障号、成员编号和保障详情。估计有 15.5 million 个唯一社会保障号出现在待售文件中；由于一个社会保障号会关联多个家庭成员，风险涉及的个人总数显著更高。Alan
              确认，2026 事件中银行数据、医疗治疗详情、密码和联系信息未受损，也没有入侵触及 Alan 自有服务器。不过，ACPR 和 CNIL 已立即获报，调查仍在进行。这不是一次性事件：Almerys 是
              Alan、MGEN、Harmonie Mutuelle 和 AG2R La Mondiale 共享的基础设施依赖，使 Alan 成为该运营商安全状态的系统性间接受益者，也成为间接人质。另一个维度是，Alan
              将所有成员健康数据托管在 Amazon Web Services（AWS）上，其 EU 数据中心持有 HDS（Hébergeur de Données de Santé）认证。但 AWS
              仍受美国域外法律工具约束（Cloud Act、FISA Section 702），促使法国议员 Philippe Latombe 提出问题 QANR5L17QE7230，询问政府是否会要求 Alan 迁移到获
              SecNumCloud 认证的主权提供商。法国同时将 AWS、Microsoft Azure 和 Google 排除在国家 Health Data Hub
              招标之外，进一步显示数据主权政治共识正在收紧，最终可能迫使 Alan 为公共部门合同进行高成本平台迁移。
