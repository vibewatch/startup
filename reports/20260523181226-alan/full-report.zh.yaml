      - number: '2.2'
        title: 市场规模——TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >
              Alan 的总可用市场（TAM）是其持牌地区的私人补充健康保险保费总和。法国是单一最大市场，ACPR Analysis & Synthesis No. 178 (December 2025) 确认 2024
              年纯健康补充保费为 €47.2B；DREES 的并行 2025 年度报告记录同年 cotisations 为 €46.5B（方法差异来自 ACPR 纳入部分跨境活动）。France Assureurs
              报告健康板块 cotisations 为 €46.8B，2024 增长 +7.6%。三类一手来源均指向 €46–47B 的法国补充健康保费池，年增速大约 7–8%。

              比利时补充健康总承保保费（GWP）约为 €2.5B（KPMG 2024 study），其中 €1.5B 由私人保险公司处理，€1B 由互助会处理。比利时市场成熟，年增长较低（~3.6% CAGR
              2018–22）。Market Research Future 估计西班牙 2024 年整体健康保险市场约 $41.77B USD；但该数字包含由税收资助、并非保费资助的公共 Sistema Nacional
              de Salud。与 Alan 相关的西班牙私人 VHI/补充板块要小得多——Alan 未公开披露西班牙市场规模，也未识别到监管机构发布的西班牙私人补充保费单独权威数据（见证据缺口
              GM001）。加拿大私人雇主补充福利市场在 2022 收取 CAD $55.9B 保费（CHLIA via HelloSafe），90% 来自团体计划；该市场高度集中（Manulife 20%、Sun Life
              15%），结构上也不同于法国 complémentaire santé。

              可服务市场（SAM）——Alan 能用其 B2B 雇主团体数字方案现实触达的部分——集中在法国、比利时和西班牙的雇主集体合同。在法国，团体 / 集体合同占补充健康 cotisations 总额的
              57%，意味着法国团体 SAM 约 €26.7B。比利时集体补充健康板块 GWP 约 €950M。西班牙雇主团体 VHI 份额没有精确量化，但按比例方法估计为 €2–4B（见证据缺口 GM001）。法国 +
              比利时 + 西班牙 B2B SAM 合计约 €28–32B。加拿大团体市场（约 CAD $55.9B 的 90% = ~CAD $50B）规模很大，但 Alan 商业足迹仍处早期（1,600+
              名会员）且面对强势在位者，因此不纳入近期 SAM 计算。

              Alan 的可获取市场（SOM）由当前和目标 ARR 曲线提供证据。2025 年 Alan 在法国、比利时和西班牙实现 €785M ARR，并以 2026 年 €1B 为目标，这相当于法国 + 比利时 B2B
              雇主团体保费 SAM 的约 2.5–3.3%。CEO Jean-Charles Samuelian-Werve 已确认公司在任何运营市场都尚未达到 1% 市场份额——这与测算一致：€785M 对应约 ~€47B
              法国市场，意味着按总保费计约 ~1.7% 渗透率；若把 Alan 12–14% 平台订阅利润从保费等价比较中剔除，渗透率更低。SOM 增长路径取决于在位者客户基础的年度合同流失、Alan 的 B2B
              销售能力，以及公共部门 PSC 改革的实施速度。采用 40% ARR CAGR（管理层指引）的情景分析显示，五年内 SOM 可达 €3–5B ARR——仍低于法国 + 比利时雇主团体市场的 10%。
