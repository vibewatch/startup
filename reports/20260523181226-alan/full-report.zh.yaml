      - number: '5.2'
        title: Alan Clinic、Mo AI Assistant 与心理健康
        blocks:
          - type: paragraph
            body: >
              Alan 的旗舰临床产品是 Alan Clinic，一个每周 7 天运行的医疗咨询平台，把持证医生与 AI 医疗助手 Mo 结合起来。截至 Q1 2026，Mo 已部署给法国 500,000
              多名成员，带来的成员互动量是 Alan 之前纯人工 Clinic 模式的四倍。Mo 的设计本质上是混合式：AI 会即时回答成员健康问题，但每次对话都由具备认证资质的医生在 15
              分钟内复核并确认。该架构让医生可以同时监督多条 AI 对话，在一个报告期内支撑 260,000 次相当于医生就诊的医疗聊天量；如果只靠医生人头，这在经济上不可行。

              Alan 的大规模临床研究被描述为真实场景中对话式医疗 AI 的首个同类研究，三周内纳入 1,566 次成员对话。在最初被提供人工医生选择的 926 名合格参与者中，81% 选择 Mo。对话后患者满意度为
              4.6/5，95% 的监督医生将 Mo 的回答评为“好”或“优秀”。Mo 约贡献 Alan 生态内全部远程问诊流量的 30%，截至 Q1 2026 已在公司范围内自动化 40% 的护理对话。Alan
              Mind（心理健康）把 Clinic 延伸到心理支持，AI 日志功能估计被 14% 的成员采用，并提供按需访问持证心理学家的能力。
