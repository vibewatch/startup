      - number: '7.4'
        title: 运营与执行风险
        blocks:
          - type: paragraph
            body: >
              Alan 的纯数字服务模式——没有电话线，全部支持通过 app 内聊天——对复杂理赔构成结构性脆弱点。Goodassur、Opinion Assurances 和 Selectra
              等平台上的客户评论持续反映，对生育报销、部分保障决策不一致，以及案件落在标准自动化路径之外时的延迟感到不满。这些评论代表了早于数据泄露风险且对其形成补充的反向情绪。Alan 自身 SFCR 2024
              指出，医疗成本通胀是 2024 年超过精算预测、对技术平衡造成不利影响的因素。年度重新定价权和成数分保对该承保风险有部分缓解，但成员快速增长（end-2024 为 686,000；end-2025 为
              1,059,000）提高了任何费率误判的绝对代价。地域集中度仍高：法国在 end-2024 占被保险人的 87%；公共部门板块虽然具有战略重要性，但如果单一大合同（如 Bercy 的 130,000
              名公务员）被重新定价、未续约或受到政治扰动，也会引入新的客户集中度风险。SFCR 确认运营 SCR 为 €8.9
              million（11.2%），由公司高度自动化、高交易量处理环境中的系统故障和欺诈风险驱动。Alan 向 Canada、Belgium 和 Spain
              的国际扩张，带来同步的多监管合规压力：不同偿付能力框架、不同数据保护制度、各异采购规则和本地人才需求。公司人员主要集中在法国，且文化强度高（SFCR 记录了极端透明文化），这可能在地域扩张时产生摩擦。EU AI
              Act 对高风险 AI 系统的 August 2026
              截止期——具体适用于任何影响自然人保障决策的承保或理赔评分算法——增加了合规负担，需要合格评定、偏差测试基础设施和技术文档；这些通常不是保险公司产品开发流程的一部分。
