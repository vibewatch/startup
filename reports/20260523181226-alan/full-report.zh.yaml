      - number: '3.4'
        title: 能力、定价与切换阻力对比
        blocks:
          - type: paragraph
            body: >
              相比在位者，Alan 的主要差异化有三点：技术驱动的处理速度、一体化医疗服务、会员体验质量。最可验证的差距是报销周转速度——Alan 超过 70% 的报销在 1 小时内处理，99% 在 24
              小时内处理；相比之下，MGEN 被引用的标准是 3–5 个工作日，多数传统 mutuelles 为 2–4 天。Alan 消费者 NPS 70+，显著高于独立评价平台记录的 Malakoff
              Humanis（二元口径 84% 满意度）、Harmonie 和 AG2R。Alan 的 100%
              数字化模式——没有实体网点，标准问题也没有来电热线——既是成本效率来源，也是消费者评论中最常见的限制，尤其影响数字能力较弱或护理需求复杂的会员。


              定价上，Alan 2026 个人计划为：Green（入门级 €39–55/month）、Blue（中等保障 €59–79/month）和 Purple（高端 €89–120/month）。Alan
              也提供雇主团体计划（Green、Blue、Zen），雇主必须按 ANI 法至少承担 50%。Alan 在 2026 将保费平均提高约 7%，以反映 9.5% 医疗通胀。Harmonie Mutuelle
              企业定价估计为每名员工 €15–80/month，取决于档位、公司人口结构和 convention collective。AG2R Flexéosanté 中小企业起价 €19.77/month。MGEN 基础
              PSC 总保费 €75.40/month（雇主承担 50% 时员工为 €37.70）。Alan 与可比在位者的价格差异在同等保障档位下大致处于
              ±15–20%；任何一方都没有大到足以让价格成为主要切换决策的结构性成本优势。


              Alan 在保险保费之上收取 12–14% 平台订阅费，用于健康平台服务——这是法国 CHI
              玩家中独特的定价模型。第二收入流帮助公司在纯保险承保之外实现变现多元化，但也形成一条额外成本线，预算敏感的雇主可能会审视。


              雇主团体合同的切换阻力主要来自日历：法国 CHI 合同每年续约，通知期通常在续约前 1–2 个月。Alan 上线不收切换费，数字化上线也去掉了纸面流程。不过，原提供方通知期仍然适用；PSC 和 CCN
              绑定的行业协议也会在 CCN 指定期间锁定特定在位提供方。对中小企业和科技公司——Alan 的核心市场——多供应商并行相对容易，切换工作量确实低于纸面负担重的传统流程。
