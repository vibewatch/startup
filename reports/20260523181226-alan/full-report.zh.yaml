  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: 从 Alan 的规模、财务证明、风险画像和估值纪律，推导至 TRACK 建议的链条。
    data:
      nodes:
        - id: scale
          label: |-
            规模
            €785M ARR；1M+ 会员；
            53% CAGR
        - id: proof
          label: |-
            证明
            法国盈利；
            亏损/ARR 3.3%
        - id: moat
          label: |-
            护城河
            ACPR 牌照；
            AI 平台；
            Solvency II 缓冲
        - id: risks
          label: |-
            风险
            赔付率未知；
            无 IFRS 账目；
            承保方重定价风险
        - id: valuation
          label: |-
            估值
            €5B = 6.4× ARR；
            若科技溢价守住则合理
        - id: recommendation
          label: |-
            TRACK
            集团盈利能力
            尚未确认；
            上调路径已明确
      edges:
        - from: scale
          to: proof
