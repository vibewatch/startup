  - id: FM001
    title: 市场规模金字塔 — Alan 的 TAM/SAM/SOM
    type: pyramid
    layout: standard
    summary: >
      Alan 主要市场（法国 + 比利时 + 西班牙）的 TAM/SAM/SOM 层级。法国补充健康险是最大层；SAM 是 B2B 雇主团体细分；SOM 是 Alan 当前及近期 ARR 轨迹。加拿大商业化仍早，未计入
      SAM/SOM，但作为方向性总 TAM 纳入。
    data:
      items:
        - label: TAM — 补充健康险保费池（FR+BE+ES 合计）
          value: ~€50B
          detail: >
            法国：€46.5–47.2B 补充健康险 cotisations（ACPR/DREES 2024 数据）；比利时：~€2.5B 补充健康 GWP（KPMG 2024）；西班牙：私人 VHI 估算缺少一手来源，未纳入
            TAM 算术。加拿大：CAD $55.9B（~€37B） 私人补充福利（2022 CHLIA）——因监管 / 市场结构不同，单独披露。
          tone: neutral
        - label: SAM — B2B 雇主团体可服务细分（FR+BE+ES）
          value: ~€28–32B
          detail: >
            法国 group collectif：57% × €46.8B = ~€26.7B（France Assureurs 2024）；比利时 collective： ~€950M（KPMG 2024）；西班牙雇主团体
            VHI：~€1–3B 估算（非一手来源；证据缺口 GM001）。合计：~€28–32B。 约束：Alan 只在愿意从传统 IPs 或 mutuelles 切换、且数字化开放的雇主细分中具备竞争力。
          tone: neutral
        - label: SOM — Alan 当前及近期可获得收入
          value: €785M (2025A) → €1B+ (2026 target)
          detail: >
            Alan ARR：€505M（2024）；€785M（FY2025）；€804M+（Q1 2026）。占法国 + 比利时团体 SAM： ~2.5–3.3%。CEO 指引：到 2026 年 ARR CAGR
            40%；集团层面 2027 年盈利目标。按 40% CAGR 推算的 5-year SOM：~€3.7B（仍低于 FR+BE 团体 SAM 合计的 12%）。
          tone: positive
    approximationNotes: >
      TAM：因缺少一手来源，西班牙 VHI 规模未计入 TAM 汇总；“~€50B”仅为法国 + 比利时。因结构差异，加拿大未纳入 TAM 金字塔。SAM：法国团体细分按 France Assureurs 的 57% ×
      €46.8B 推导；比利时 collective 来自 KPMG；西班牙估算使用比例法，存在不确定性。SOM 5-year 预测使用管理层 CAGR 指引，未独立验证。
