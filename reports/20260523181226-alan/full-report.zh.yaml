      - number: '3.2'
        title: 在位互助社与商业保险公司
        blocks:
          - type: paragraph
            body: >
              Malakoff Humanis 是法国按 cotisations 计第二大的 CHI 集团。其 2025 业绩显示，集团保险收入 €8.37B（健康险：€4.22B，+5% YoY），净利润
              €231M，偿付能力比率 270%。集团在健康险和 prévoyance 领域承保约 10 million 人，服务约 400,000 家企业客户，覆盖 83 个专业分支，其中许多受 CCN
              层面协议约束。其健康再分配率为 84%——即每收取 €100 就支付 €84 赔款——是在位者用来证明互助价值的透明度指标。Malakoff 有用于数字合同管理的雇主外联网，但缺少一体化健康福祉或 AI
              健康助手平台。分销主要由经纪人中介完成。


              Harmonie Mutuelle 隶属于 Groupe VYV（排名第一的 CHI 集团），保障 5 million 名会员，服务约 88,000 家企业客户，其中 92% 推荐它。VYV 总会员 10.6
              million，是法国最大的互助网络。Harmonie 提供三档企业保障——Économique、Confort 和 Optimal——并接入 Kalixia
              医疗服务网络，覆盖眼科、牙科和听力。互助社治理把盈余再投入，而不是支付股息，这支撑稳定性，但限制产品敏捷度。数字工具包括雇主 extranet 和会员 app，但没有 AI 健康助手。


              AG2R LA MONDIALE 是一家拥有 115 年历史的雇主—工会共同治理 paritaire 集团。其 Flexéosanté 中小企业产品起价约 €19.77/month，提供 6
              个保障等级，并可选协助和健康福祉包。AG2R 的结构性优势在于为多个行业管理强制性 CCN 健康保障，形成分销锁定；在合同续约周期之外，这种锁定很难被替代。公司有数字雇主门户，但缺少临床和 AI 健康服务。


              MGEN（Mutuelle Générale de l'Éducation Nationale）覆盖 4 million 人，几乎全部集中在法国公共部门（Education
              nationale、Enseignement supérieur、Jeunesse et Sports）。自 1 May 2026 起，MGEN 成为这些部委所有在职 agents 的强制
              PSC（Protection Sociale Complémentaire）提供方，基础保费 €75.40/month（雇主至少覆盖 50%）。这种 PSC 强制指定形成结构性锁定；Alan
              如果不赢得全国性招标，就无法在这个特定公共部门板块复制。


              Apicil 是总部位于法国东南部的 paritaire 集团，2025 总收入 €4.03B，主要被保险人 2.2 million，企业客户 57,573 家，偿付能力比率 182%。健康险和
              prévoyance 贡献总收入中的 €1.5B。集团强调 RSE 和区域贴近度作为差异化。其公开产品页面未显示 AI 驱动健康平台。


              AXA France 是按 cotisations 计第三大的 CHI 集团（2024 为 €3.57B，+15.2% YoY），其中 70.7% 来自集体板块。AXA 的 Q1 2026
              集团层面寿险和健康险保费达到 €16.5B（+8%）。AXA 具备品牌认知、偿付能力资本和多产品交叉销售能力，可在大型企业和公共部门合同层面挑战
              Alan。其数字雇主门户比多数互助社更先进，也在积极投资健康数字化，但主要竞争姿态仍偏向大型企业和个人市场。


              Generali 通过 Alliance Klesia 合资公司运营，是第四大 CHI 集团（2024 cotisations €2.84B，+14.5% YoY；66.7% 来自集体板块）。Generali
              Group 在 2025 录得创纪录经营利润 €8.0B（+9.7%），偿付能力比率 219%。Klesia 合作为其接入 paritaire 行业 CCN 分销，同时补足 Generali
              的商业保险资本基础。公开层面看不到突出的差异化数字体验。
