      - number: '7.3'
        title: 合作方与依赖风险
        blocks:
          - type: paragraph
            body: >
              Alan 的风险转移方案依赖一组集中的再保险伙伴。法国健康险业务中，Alan Insurance 在 50% 名义成数分保安排下，将净保费的 49% 分出给 Swiss Re、GenRe 和 CNP
              Assurances。Prévoyance（伤残、人寿）风险自 2025 起以 80% 比例由 Hannover Re 再保险，并由 GenRe 超额赔款合约覆盖极端 arrêt-de-travail
              场景。比利时健康险以 60% 比例共同分出给 Swiss Re 和 Belfius Insurance；后者母公司 Belfius Bank 同时也是 Alan 的战略投资人。Belfius
              的双重角色——再保险方和投资人——带来需要监控的利益冲突维度：Belfius 自身财务状况恶化或战略转向，可能同时削弱 Alan 的资本基础和比利时再保险安排。SFCR 2024
              披露，交易对手风险（再保险方和银行合作伙伴信用风险）是第二大 SCR 组成部分，金额 €19.6 million（分散化前占 24.5%），反映该依赖的重要性。2024 年再保险成本为净负 −€1.8
              million，说明在增长阶段，风险转移成本相对成熟理赔经验返还前置，形成拖累。技术基础设施方面，网络安全章节提到的 AWS 依赖延伸到整体运营：Alan 整个平台——理赔管理、成员
              app、tiers-payant 连接和 AI 系统——都运行在 AWS 基础设施上。AWS 区域故障或法国数据本地化政策下的法律挑战，会同时影响所有地域和所有产品线。Alan 拥有 ISO 27001
              认证并开展渗透测试，但 DORA 现在要求每个关键 ICT 第三方供应商都有书面退出计划，使 Almerys 和 AWS 依赖进入正式监管审查。
