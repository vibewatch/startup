      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: Alan 的报销速度是无可匹敌的竞争优势
            body: >
              Alan 超过 70% 的报销在 1 小时内处理，而多数在位 mutuelles 的标准是 3–5 天，这创造了可衡量、可验证的产品差距。这种速度优势不是 UX 打磨差异，而是 Alan
              全自动理赔管线的结构性产出——并且直接解决会员对健康保险最常见的摩擦点。只要在位者仍依赖部分人工或与遗留系统集成的理赔系统，这一优势就具备耐久性。
            calloutType: strength
            claimRefs:
              - CP026
              - CP029
          - type: callout
            title: CCN 锁定分销是 Alan 最大的结构性缺口
            body: >
              AG2R、Malakoff Humanis 和 Generali/Klesia 为数十个专业分支管理强制性 CCN 健康保障，拥有自动续约的锁定分销，除非 CCN 被重新谈判。Alan
              无法进入这条渠道，除非赢得行业招标或与 paritaire institutions 合作——这个过程需要数年，也要求工会—雇主协作，而这并不天然适配数字保险公司。这是在位者可获得的最耐久结构性护城河，也代表
              Alan 最清晰的非内生增长天花板。
            calloutType: risk
            claimRefs:
              - CP014
              - CP039
              - CP041
          - type: callout
            title: Doctolib 是互补方，不是竞争对手
            body: >
              Doctolib 的核心价值主张——为医疗服务提供方减轻行政负担——与 Alan 的核心价值主张——为雇主赞助健康保险会员降低摩擦——是正交的。双方都受益于数字医疗采用，Alan 会员也可能通过 Doctolib
              预约医疗服务提供方。只有当 Doctolib 进入保险承保或风险承担服务时，竞争重叠风险才会实质化；其 2026–2029 路线图并未显示这一点。
