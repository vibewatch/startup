  - id: TI005
    title: 公开财务缺口
    columns:
      - 缺失指标
      - 对分析的影响
      - 严重度
      - 尽调路径
    rows:
      - - GAAP/IFRS 经审计合并集团账目（P&L、资产负债表、现金流）
        - 无法验证收入确认、真实现金消耗或营运资本动态
        - 阻断
        - 向管理层索取经审计合并报表；核对 ACPR 实体层面申报
      - - 理赔 / 保费（赔付）比率 — 实际值 vs. 均衡目标
        - 无法评估精算充足性；不利赔付发展可能迅速侵蚀订阅利润空间
        - 重大
        - 从 SFCR 精算报告附录或尽调资料室获取
      - - 按渠道拆分的获客成本（CAC）与回本周期
        - 无法计算 LTV:CAC，也无法评估相对传统保险公司和 Oscar Health 的销售效率
        - 重大
        - 向管理层索取；对标上市健康保险同业
      - - 按国家拆分的 P&L（法国、比利时、西班牙、加拿大）
        - 无法量化国际业务对集团盈利的拖累，也无法评估国家层面单位经济
        - 重大
        - 索取分部报告；建模法国贡献 vs. 国际投入
      - - 按计划层级和地区拆分的每会员订阅费
        - 无法建模订阅收入增长或流失；限制 SaaS 可比分析
        - 重大
        - 索取计划价格表和账单数据；与第三方定价网站交叉核对
      - - 媒体 vs. SFCR 亏损数字调节（€54M vs. €34M，FY2024）
        - 削弱多年亏损趋势可比性；会计口径未知
        - 重大
        - 要求提供调节桥：IFRS 集团 P&L vs. Solvency II 单体 / 集团结果
    notes: >-
      缺口严重度：阻断 = 没有它无法下财务结论；重大 = 影响对承保假设的信心。SFCR 披露只覆盖 Solvency II 监管口径；私营法国保险公司没有 SEC 10-K 或 AMF Document de Référence
      的等价披露。
    enumerationScope:
      coverage: partial
      basis: >-
        Known gaps in public financial disclosure for Alan as of May 2026, compiled from SFCR summary, press
        conferences, and analyst/union commentary. Further gaps may exist that are not yet visible from public sources.
