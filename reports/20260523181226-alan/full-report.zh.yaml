      - number: '3.3'
        title: 数字原生保险科技与相邻数字健康玩家
        blocks:
          - type: paragraph
            body: >
              Doctolib 是法国占主导的就医导航平台，在线医疗预约市场份额约 90%。2024 年公司披露 ARR €348M（+22.5% YoY），估值约 $6.4–6.5B，累计融资超过
              $866M。Doctolib 的商业模式是面向医疗服务提供方——GPs、专科医生、诊所和医院——销售 B2B SaaS 订阅，患者免费使用平台。它不是补充健康保险公司，也没有 ACPR 保险牌照。其
              2026–2029 战略路线图聚焦临床 AI、诊所管理金融服务和潜在 IPO；没有标示进入保险。Doctolib 和 Alan 在就医访问场景上重叠——Alan
              在自有平台内提供远程问诊、预约访问和健康指导，部分复制了 Doctolib 面向患者的预约功能。二者关系最适合定义为相邻且在就医导航功能上部分可替代，也存在互补空间（Alan 会员可通过 Doctolib
              预约医疗服务提供方），但不存在直接的保险采购竞争。


              Lifeaz 是一家 2015 成立的法国联网除颤器（AED）公司。February 2026，公司完成 €13M 融资（累计融资 €20M），员工 40 人，并已在法国安装超过 25,000 台除颤器，包括与
              Croix-Rouge française 的合作。Lifeaz 不是健康保险公司。它处在雇主职业安全福利栈中——雇主可以在配置 Alan 团体健康合同的同时部署 Lifeaz
              AED，两者不冲突。关系是相邻且互补；Lifeaz 投资人 Mutuelles Impact（由 Mutualité Française 通过 XAnge 支持）把它连接到在位互助生态，而不是保险挑战者空间。


              放到更广义的数字保险科技类别，Seedtable 在 2026 年仅追踪到法国 6 家保险科技初创公司，合计融资约 $243M。Alan 拿走其中绝大多数资本，也是唯一持 ACPR
              牌照的全栈健康保险公司。其他数字玩家（面向自由职业者的 Wemind、面向多风险组合的 Lovys）主要是经纪人或白标转售商，没有自有保险牌照；它们在 Alan 的个人和 TNS
              板块竞争，但相较在位市场规模很小。
