      - number: '5.4'
        title: 预防、游戏化与 Alan Précision
        blocks:
          - type: paragraph
            body: >
              Alan 的预防产品组合覆盖四项服务：Alan Play（通过步数挑战实现游戏化体力活动）、Alan Mind（心理健康日志和心理学家访问）、Alan Back Pain Program（结构化物理治疗辅导）以及
              Alan Précision（通过生物标志物检测做精准预防健康）。

              旗舰游戏化产品 Alan Walk 通过 app 追踪日常活动，并用 berries 奖励成员；berries 是一种虚拟货币，可兑换 Alan Shop 折扣或用于慈善捐赠。到 Q4 2024，Alan
              Walk 已吸引 20,000 名成员加入，覆盖 900 家公司，达到 35% 周活跃用户和六个月 35% 留存。高参与用户相对基线每天约多走 1,200 步（27%）——Alan
              注明该数字来自自选择的高参与队列。Alan Shop 在法国成员中达到 17% 隐形眼镜市场份额和 9% 眼镜市场份额。Back Pain Program 服务超过 22,000 名成员；Alan
              称，在公司报告结果中，14 天内有意义疼痛缓解率为 87%，但尚无独立随机对照试验发表。

              最具潜力的新资产是 Alan Précision，它在 Alan 收购 Aro 后于 March 2026 推出。Précision 通过每年两次血检分析 80+
              项生物标志物，并生成由医生监督的个性化行动计划。它与 Mo、Alan Clinic、Play 和 Shop 做纵向集成。1,500+ 候补名单是在零营销支出下积累的。Alan 的职业健康业务 Prévenir
