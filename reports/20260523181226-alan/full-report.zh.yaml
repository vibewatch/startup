  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Alan 的主要风险置于 4x4 可能性-影响矩阵；最高严重度风险集中在高可能性 / 高影响象限，其中网络安全和 CNIL 执法构成最急迫的近期敞口。
    data:
      columns:
