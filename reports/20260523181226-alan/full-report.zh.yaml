      - number: '4.2'
        title: 成本结构、单位经济与亏损轨迹
        blocks:
          - type: paragraph
            body: >
              Alan 的运营成本主要落在三块：技术与 AI 投入、销售与市场、一般及行政开支。员工数从 ~550 名（FY2024 初）增至 ~600 名（FY2024 末，+8%），再到约 800 名（FY2025；CFO
              Mihaela Albu 在 March 2026 披露工资总额增长 +10%）。FY2025 单员工收入估计达到 €981K/人（€785M / 800），显示出显著运营杠杆——每名 Alaner
              贡献的收入大约是 FY2023 的两倍。净亏损轨迹明显改善：从 ~€59–61M（FY2023，媒体口径）到 ~€54M（FY2024，新闻稿初步口径），再到 €26M（FY2025，SFCR
              口径）。FY2024 新闻发布口径亏损（~€54M，January 2025 发布会及 Maddyness/Obliginfos 报道引用）与 SFCR 披露数字（FY2024 为
              -€34M）存在重大差异，FY2025 收敛至 -€26M。这个差距很可能来自 Solvency II 会计口径与全集团企业 P&L 的范围差异。法国在 FY2025
              实现运营盈利，这是结构性里程碑，因为法国贡献集团收入 >75%。管理层称赔付 / 保费比目标约为
              100%，但从未独立验证；只要持续出现不利偏差，就会侵蚀订阅利润率并加速现金消耗。订阅层隐含的“真实毛利率”很高（接近软件），但合并口径纳入转付保费后毛利率要低得多。亏损占 ARR 的比例从 FY2023 的
              ~17% 降至 FY2025 的 ~3.3%，收入质量改善具有说服力。
