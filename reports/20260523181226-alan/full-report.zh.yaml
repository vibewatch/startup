      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: TRACK：证据到位后可上调的路径已定义
            body: >
              鉴于法国经营盈利、53% ARR CAGR 和 3.6× Solvency II 缓冲，Alan 的 €5B 估值可以辩护。但 RECOMMEND 需要解决三个关键缺口：（1）集团层面盈利在 FY2027
              或提前得到确认，（2）独立披露赔付率或由精算方签字确认，（3）按国家拆分的 P&L 显示，国际市场规模化后并非结构性亏损。以 €5B 进入的投资人接受的是基准情景 1.4–2×
              回报，同时承担一个实质熊市风险：如果 Carbone 的批评在规模化后被证明正确，估值可能下调 40–60%。
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV043
          - type: callout
            title: 反向观点：独立分析师称 €4B 估值「不现实」
            body: >
              2024 年，IoT Insurance Observatory 的 Matteo Carbone 公开表示，Alan 的 €4B Series F
              估值「不现实」——他特别指出，「一家保费约半十亿、且甚至尚未盈利的公司，不可能估值 €4bn」，并进一步认为 Belfius 兼具投资人与分销方的双重角色，可能抬高了价格。Banque Hottinguer 的
              Adrien Choquet 有条件地为该估值辩护，但也警告，如果放弃技术产品，Alan 会被按传统保险公司定价。在 €5B（FY2025 ARR
              €785M）时，估值的收入覆盖有所改善，但核心批评仍在结构上成立：监管资本约束、未披露赔付率和集团亏损，使科技溢价变得脆弱。
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
              - CV033
          - type: callout
            title: Solvency II 是估值天花板，不只是底线
            body: >
              Alan 的 Solvency II 牌照形成了耐久竞争护城河（2016 获 ACPR 牌照；法国 30+ 年来唯一新独立承保公司），但也发挥估值天花板机制。监管资本要求意味着，Alan 不能自由分配或重新部署
              €374M 自有资金——它们是强制性损失缓冲。把 Alan 与可自由产生自由现金流的轻资产 SaaS
              公司相比，会高估其现金生成潜力。潜在投资人应把公司建模为一家资本受限的承保公司，上面叠加一层科技溢价订阅收入，而不是纯软件公司。
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV028
