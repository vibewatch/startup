  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：结构与分层
        blocks:
          - type: paragraph
            body: >
              法国补充健康保险（CHI）市场高度集中。按 2024 直接 cotisations 排名，前五大集团为：包含 Harmonie Mutuelle 的 Groupe VYV（€6.12B）、Malakoff
              Humanis（€3.82B）、AXA France（€3.57B）、Alliance Klesia-Generali（€2.84B）和 Groupama（€2.83B）。合计来看，前 51 个集团拿走全部
              CHI cotisations 的 85%。Alan FY2025 ARR 为 €785M，尚未进入排名前十的机构，但同比增长 53%，显著高于行业 3–5% 的平均水平。


              本分析把竞争者分为三层。第一层是大型在位互助社（mutuelles）和商业保险公司，拥有深厚的经纪渠道、强制性 CCN 行业关系和远超 Alan
              的资本储备。第二层包括数字原生挑战者和专业健康福利平台，它们在特定功能或买方板块上与 Alan 重叠。第三层覆盖相邻的就医导航和雇主安全玩家，其服务范围与 Alan
              的非保险健康功能交叉，但不参与保险采购决策竞争。Alan 的竞争策略，是以大致相近的价格提供更好的产品体验，拿下雇主中小企业板块；公司并不在成本或分销广度上与拥有结构性优势的在位者正面竞争。


              雇主团体（collectif）板块约占法国 CHI 总保费的 57%（2024 年 €46.8B 中约 €26.7B）。Alan
              的主攻面正是这个集体合同板块，尤其是重视数字体验、透明度和一体化健康福祉服务，而不依赖历史经纪关系的科技公司、初创公司和中端市场中小企业。
