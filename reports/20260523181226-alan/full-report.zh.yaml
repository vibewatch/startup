      - number: '7.5'
        title: 缓释措施、否决条件与尽调要求
        blocks:
          - type: paragraph
            body: >
              Alan 已围绕关键风险建立了有意义的第一代缓释措施。Solvency II 覆盖率达到 4.6× SCR 和 18×
              MCR，提供了可观资本缓冲；公司几乎全部流动性都放在一线银行合作伙伴的短久期现金存款中，降低市场和流动性风险。再保险分散到五个交易对手（Swiss Re、GenRe、CNP、Hannover Re、Belfius
              Insurance），降低单一交易对手违约风险，尽管 Swiss Re/GenRe 组合中的信用集中仍需监控。ISO 27001 认证和定期渗透测试表明，其基础安全状态高于法国保险业常态，但 Almerys
              泄露暴露出关键依赖是共享基础设施时，边界安全的上限。两次 Almerys 泄露后，ACPR 和 CNIL 通知流程都及时触发，Alan 的公开沟通迅速且透明，限制了急性声誉损害。采购诉讼方面，Tribunal
              administratif 驳回 MGEFI 禁令，降低了近期合同风险，但实体审理案件仍构成持续悬顶。投资人应为投资逻辑破裂场景设定清晰触发线：CNIL 正式制裁或罚款超过 €5 million；ACPR 在
              Pillar 2 下强制追加资本；MGEFI 实体案件胜诉并逆转 Bercy 合同；强制 SecNumCloud 迁移成本超过 €50 million；August 2026 整改前发生 EU AI Act
              不合规执法；或 2026 年净亏损（集团范围）高于 ARR 的 5%，表明法国盈利里程碑是在规模化中反转，而不是巩固。
