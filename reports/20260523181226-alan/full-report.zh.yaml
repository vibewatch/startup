      - number: '1.3'
        title: 融资历史与股权结构
        blocks:
          - type: paragraph
            body: >
              Alan 自成立以来完成 8 次融资事件，累计获得约 €754M 股权资本，并在 March 2026 达到 €5B 投后估值，较 September 2024 的 €4B 估值上调
              30%。融资路径反映业务风险被逐步拆解：早期轮次由 Partech Ventures、CNP Assurances 和 Power Financial of Canada 支持 ACPR
              牌照申请与市场进入；Index Ventures 领投 Series A 和 Series B，把规模从初创公司和中小企业外扩；Temasek（新加坡主权财富基金）在 COVID 加速数字健康的窗口补入
              Series C 资本；Ontario Teachers' Pension Plan 在 €2.7B 节点领投 Series E，说明 Alan 已具备定义品类的规模；比利时银行保险机构 Belfius 则在
              2024 以 €4B 领投 Series F，把分销权和资本绑定。

              March 2026 的 €100M 轮由 Index Ventures 通过其增长基金领投，新机构投资者 Greenoaks（San Francisco）和 Kaaf（Dubai）、战略伙伴
              Belfius、家族办公室 SH 参投。天使投资人 Tobi Lütke（Shopify CEO）、Antoine Griezmann（足球运动员，2018 World Cup 冠军）、Mike
              Katchen（Wealthsimple CEO）和 Kylian Mbappé（通过 Coalition Capital）也参与其中，既反映 Alan 在法国的文化分量，也反映公司成为消费品牌的野心。

              Alan 资产负债表显示监管资本超过 €374M，是 ACPR 对集团口径运营要求的 ~€105M 最低监管资本的 3.6 倍以上，且大部分放在流动性存款账户。再保险伙伴（Swiss Re、GenRe、CNP
              Assurances、Hannover Re、Belfius Insurance）进一步封顶医疗成本波动敞口。March 2026 交割后，现金储备据报约 €376M。
