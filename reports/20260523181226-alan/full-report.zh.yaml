      - number: '6.5'
        title: 集中度与扩张风险
        blocks:
          - type: paragraph
            body: >
              Alan 最重大的集中度风险，是公共部门敞口上升。2023–2026 年赢得的 PSC 合同（Assemblée nationale、Ministry of Ecology、PM
              Services、Ministry of Finance）合计代表了单一采购制度下的大块保障人数。虽然每个部委都是独立合同，但都来自 PSC reform 机制。如果未来法国政府逆转 PSC reform，或
              Alan 未能在周期结束时续标，其成员基数中相当一部分可能在压缩时间内流出。

              Bercy 合同的执行风险仍在：原保险方 MGEFI（Matmut 子公司）在被替换后，于 June 2025 提出预合同法律挑战。此前 MGEN 针对 Alan Ministry of Ecology
              中标的挑战在 referé 阶段被驳回，为避免逆转提供了先例，但截至报告运行日，MGEFI 挑战结果仍未解决。法国议员 Philippe Latombe 已公开指出，Alan 用 AWS
              托管公务员健康数据构成数字主权担忧——这项监管敞口可能影响未来 PSC 招标资格。

              渠道集中度方面，Belgium 的雇主获取在很大程度上依赖 Belfius 银行分销合作。Canada 仍处增长弧线过早阶段，不构成有意义的集中度风险。抵消因素在于：37,000 家公司的私营部门组合高度分散，跨
              SME 规模和行业；没有披露任何单一私营雇主构成重大收入集中。公共部门合同虽然保障人数很大，但单成员保费较低，因此其收入集中度影响不如人头集中度严重。
