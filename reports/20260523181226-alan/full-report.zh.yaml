      - 重要性
      - 负责人或尽调路径
    rows:
      - - 赔付率 / 理赔率
        - 按年份、计划类型和地域拆分的理赔 / 保费比；精算准备金方法
        - 任何保险公司的核心风险指标；没有它就无法评估精算风险或订阅利润率韧性
        - 在 data room 索取；向 ACPR 或再保险方（Swiss Re、GenRe）寻求独立验证
      - - IFRS/GAAP 审计账目
        - 经审计合并财务报表（不只是 SFCR 摘要）
        - 公开财务资料只有 SFCR 摘要页；没有法定审计轨迹
        - 索取 FY2023–FY2025 审计账目；核验收入确认和公司间抵消
      - - 按国家拆分 P&L
        - 按国家拆分收入、毛利率、CAC 与经营利润（法国、比利时、西班牙、加拿大）
        - 国际扩张拖累被合并数字掩盖；对评估盈利路径很重要
        - 按地域索取管理账；核验比利时 / 西班牙 EBITDA 相对法国的表现
      - - CAC 与回收期
        - 按分部拆分获客成本；按客群拆分回收期
        - 标准 SaaS 单位经济指标；缺失后无法将 LTV:CAC 对标私营市场标准
        - 在 data room 索取；与销售 / 市场团队人手交叉核对
      - - Belfius 治理
        - 董事会构成；Belfius 分销合同细节；终止条款
        - Belfius 同时是投资方、董事会成员和分销伙伴；双重角色制造冲突
        - 审阅股东协议；评估分销协议是否按市场条款签订
      - - SCR 压力测试
        - 修订后 EIOPA 校准（2027 框架）下的 Solvency II SCR 压力测试结果
        - Solvency II 复核（Jan 2027）可能抬高 SCR；需要知道压力情景下的余量
        - 索取内部精算压力测试报告；与再保险计划交叉核对
      - - 公共部门续约 pipeline
        - 前 5 大公共部门客户状态与续约条款；采购时间线
        - FY2024 净 ARR 增长的 32% 来自公共部门；若不续约，集中度风险上升
        - 索取账户级 ARR 和续约 pipeline 数据；访谈采购联系人
    notes: 所有事项都是标准私募股权 / 成长股尽调项目；均不需要 Alan 在惯常 NDA 下可向潜在投资者分享范围之外的监管机密信息。
    claimRefs:
      - CV029
      - CV030
      - CV044
      - CV045
