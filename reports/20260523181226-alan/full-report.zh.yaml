      - number: '1.5'
        title: 里程碑、监管资质与风险格局
        blocks:
          - type: paragraph
            body: >
              Alan 的监管资质是底层强项。其 20 October 2016 的 ACPR 授权（Decision n° 2016-C-72）是法国三十年来首次授予新保险公司的牌照；公司维持的偿付能力比率在 2023
              披露约 ~450%，大约是法国市场平均 ~241% 的两倍，也显著高于监管最低要求。2016 年主导 ACPR 牌照流程的 Paul Sauveplane 仍任 General
              Secretary，为监管事务提供机构连续性。

              截至 runDate，最重大的反向事件是 23 May 2026 披露的 Almerys 网络攻击。Almerys 是 Alan 的第三方支付运营商；攻击者声称已访问超过 44 million 条记录和 15
              million 个唯一 Social Security numbers。Alan 会员暴露的数据包括民事身份、出生日期、Social Security
              number、合同编号和保险公司名称；银行数据、健康记录和联系方式据报道未受影响。Alan 下线了受影响平台，通知 ACPR 和 CNIL，并承诺逐一通知所有数据被泄露的会员。截至 23 May 2026，受影响
              Alan 会员总数仍未披露。这是 Almerys 第二次重大事件：January 2024 与 Viamedis 同时发生的泄露，根据 CNIL 记录暴露了 33 million 名法国公民的数据。

              独立分析师也质疑 Alan 的估值路径。IoT Insurance Observatory 的 Matteo Carbone 称 €4B Series F 估值「不现实」，理由是保费规模和持续亏损；反向逻辑则聚焦
              Alan 的技术溢价与增长曲线。March 2026 估值上调至 €5B 时，集团仍在亏损，这将继续是潜在投资人的尽调焦点。
