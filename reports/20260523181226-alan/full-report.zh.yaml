chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >
              Alan 于 10 February 2016 在巴黎注册成立，并成为 1986 以来法国首家拿到 ACPR 牌照的全新独立健康保险公司；在这个市场，10 家玩家控制着 €47.2B
              补充健康保费池的三分之二。公司名称有意致敬两位 Alan：现代计算之父 Alan Turing，以及强调个人整合与幸福感的哲学家 Alan Watts；这也表达了创始人的判断：技术与人的福祉不可分割。

              Alan 把自己定位为「健康伙伴」，而不只是保险公司。商业模式由两条收入流相互咬合：（1）持 ACPR
              牌照的补充健康保险保费，按均衡原则定价——公司目标是在收取保费与支付报销之间保持零利润；（2）按会员订阅收费，用来支撑数字平台、虚拟诊所、预防工具和 AI
              服务。这套双引擎设计，是为了去掉传统保险公司从保费榨取利润的对立结构，转而靠平台参与度与规模经济赚钱。

              Alan 面向法国和欧洲各种规模的雇主，包括大型企业、中小企业、自由职业者，以及自 2025 起的法国公务员体系。公司的价值主张建立在极快运营上：70% 的报销在 1 小时内完成，99% 在 24
              小时内完成，电话平均响应 20 秒；同时通过移动 app 提供全数字会员体验，并持续扩充附加服务：每周 7 天开放的虚拟诊所（Clinique Alan）、游戏化健康项目 Alan
              Play、眼镜订购、物理治疗内容，以及 November 2024 推出的 Mo AI 健康助手。
