  - id: roadmap-product-evolution
    title: "Roadmap & Product Evolution"
    body: >
      Alan's 2026 roadmap reflects two strategic bets: extending AI from the product layer
      into go-to-market and internal operations, and rebuilding the technology stack into a
      global multi-country architecture that enables 10× faster entry into new geographies.
      On the commercial AI front, sales productivity gains from AI assistance are expected to
      reach approximately 30% in 2026, building on the ~50% improvement cited by Alan's
      chief revenue officer at the January 2025 results press conference. Alan has also
      previewed a medium-term ambition of a "single AI sales rep" managing a full deal cycle
      by 2027. The multi-country architecture rebuild—confirmed in the Q1 2026 shareholder
      letter—represents the engineering prerequisite for expansion beyond the current four
      markets (France, Belgium, Spain, Canada). Alan Précision, Prévenir, and the planned
      extension of Mo to Belgium and Spain are the near-term product releases most likely to
      shift Alan's product-market fit outside its French core. The Hopper coding agent is
      expected to increase autonomous code contributions further, narrowing the competitive
      moat between Alan's staffing cost structure and larger incumbents.
    claimRefs:
      - CE034
      - CE035
