chapter:
  number: 5
  title: "Product & Technology"
  summary: >
    Alan has evolved from a digital insurer into a health super-app anchored by four
    interlocking pillars: digital insurance (app, reimbursements, digital health card),
    Alan Clinic with the Mo AI medical assistant (500k+ France users, 81% patient
    adoption, 95% physician approval), a gamified prevention suite (Alan Play, Alan Mind,
    Alan Précision via the Aro acquisition), and an AI-permeated engineering organisation
    that has deployed fraud detection, claims autoparsing, and the Hopper autonomous
    coding agent. ISO 27001 certification and strong GDPR commitments underpin the trust
    posture, but a structural gap persists: Alan's dependence on third-party payment
    processor Almerys has now produced two confirmed breach events—including a cyberattack
    on the report date (23 May 2026)—exposing member social security numbers.
sections:
  - id: product-modules
    title: "Product Portfolio & Digital App Experience"
    body: >
      Alan's product portfolio has expanded into a comprehensive health super-app that
      integrates digital insurance, medical care, prevention, and commerce in a single
      mobile experience. At its core, the Alan app (4.9/5 App Store rating, version
      1.451.0 as of May 2026) gives members instant access to a digital Tiers Payant
      card for direct billing at pharmacies and healthcare providers, photo-based insurance
      claim submission, and real-time reimbursement notifications. The app serves as the
      entry point for all other Alan products: Alan Clinic (medical chat and video
      consultations 7 days per week), Alan Play (gamified health challenges and prevention
      programs), Alan Précision (precision biomarker testing via the Aro acquisition), and
      Alan Shop (curated wellness commerce including optics).

      Fifty percent of reimbursements are processed in under five minutes—a benchmark that
      sets Alan apart from traditional insurers that routinely require 48–72 hours. Members
      submit claims by photographing receipts within the app; AI autoparsing handles
      document extraction without requiring typed input. The HR administration portal
      automates employee enrollment and coverage lifecycle via HRIS integrations, reducing
      insurance administration to fewer than two hours per year for the average SMB. Alan
      operates through six distinct legal entities—Alan Insurance, Alan Services, Alan
      Tech, Alan CA (Canada), Marmot BE (Belgium), and Marmot Iberia (Spain)—each locally
      regulated and serving a distinct market, providing jurisdictional separation for
      compliance and data residency.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE037
