  - id: alan-clinic-telemedicine-mind
    title: "Alan Clinic, Mo AI Assistant & Mental Health"
    body: >
      Alan's flagship clinical product is Alan Clinic, a 7-days-a-week medical
      consultation platform that combines licensed physicians with Mo, an AI-powered
      medical assistant. As of Q1 2026, Mo is deployed to more than 500,000 members in
      France, delivering four times the member engagement of Alan's prior human-only Clinic
      model. Mo's design is fundamentally hybrid: the AI generates an instant response to
      member health queries, but every conversation is reviewed and validated by a
      board-certified physician within 15 minutes. This architecture allows physicians to
      supervise multiple AI conversations simultaneously, enabling a consultation volume—
      260,000 medical chats equivalent to doctor visits in one reporting period—that would
      be economically impossible with pure physician headcount.

      Alan's large-scale clinical study, described as the first of its kind for
      conversational medical AI in real settings, enrolled 1,566 member conversations over
      three weeks. Of 926 eligible participants initially offered a human doctor, 81% chose
      Mo. Post-conversation patient satisfaction was 4.6/5, and 95% of supervising
      physicians rated Mo's responses as good or excellent. Mo drives approximately 30% of
      all teleconsultation traffic within the Alan ecosystem and has automated 40% of care
      conversations company-wide as of Q1 2026. Alan Mind (mental health) extends Clinic
      into psychological support, with AI-powered journaling adopted by an estimated 14% of
      members and on-demand access to licensed psychologists.
