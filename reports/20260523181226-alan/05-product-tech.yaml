  - id: prevention-precision
    title: "Prevention, Gamification & Alan Précision"
    body: >
      Alan's prevention portfolio spans four offerings: Alan Play (gamified physical
      activity via step challenges), Alan Mind (mental health journaling and psychologist
      access), Alan Back Pain Program (structured physiotherapy coaching), and Alan
      Précision (precision preventive health via biomarker testing).

      Alan Walk, the flagship gamification product, tracks daily activity through the app
      and rewards members with berries—a virtual currency exchangeable for Alan Shop
      discounts or charitable donations. By Q4 2024, Alan Walk had enrolled 20,000 members
      across 900 companies, achieving 35% weekly active users and 35% retention at six
      months. Highly engaged users show an approximately 1,200-step (27%) daily increase
      compared to baseline—a figure Alan notes is from a self-selected high-engagement
      cohort. Alan Shop reached 17% contact lens market share and 9% glasses market share
      among French members. The Back Pain Program serves more than 22,000 members, with
      Alan claiming an 87% meaningful-pain-relief rate within 14 days in company-reported
      outcomes; no independent randomised controlled trial has been published.

      The highest-potential new asset is Alan Précision, launched in March 2026 following
      Alan's acquisition of Aro. Précision analyzes 80+ biomarkers via twice-yearly blood
      tests and generates physician-supervised personalised action plans. It integrates
      longitudinally with Mo, Alan Clinic, Play, and Shop. The 1,500+ waitlist was
      accumulated with zero marketing spend. Prévenir, Alan's occupational health arm, now
      covers 14,000 employees across 100 companies, including an on-site medical centre at
      Alan's Paris headquarters.
