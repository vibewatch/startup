  evidenceGaps:
    - type: missing-source
      severity: material
      topic: alan-precision
      missingEvidence: >
        Pricing, actual member count post-waitlist, and independent clinical validation
        for Alan Précision's 80+ biomarker panel as of May 2026.
      whyItMatters: >
        Alan Précision is positioned as a key product differentiator in preventive health,
        but the business case (revenue contribution, cost structure, patient outcomes)
        cannot be assessed without pricing and actual membership data beyond the 1,500+
        waitlist figure.
      diligencePath: >
        Request Alan Précision commercial terms and early-cohort outcome data directly from
        Alan management; monitor Aro co-founder (Gaspard Hauet) press interviews.
      relatedQuestionRefs:
        - QE013

    - type: private-evidence-only
      severity: material
      topic: cross-market-product-parity
      missingEvidence: >
        Feature-by-feature product comparison across Alan's four markets (France, Belgium,
        Spain, Canada); specifically, which products (Mo, Précision, Walk, Shop) are live
        in each market as of May 2026.
      whyItMatters: >
        Alan's international revenue growth depends on product parity across markets. Mo
        is confirmed live only in France (500k+ members); Belgium, Spain, and Canada
        timelines are unconfirmed. This affects the scalability thesis materially.
      diligencePath: >
        Review country-specific app listings, local alan.com pages, and ask management
        for market-by-market product-launch roadmap.
      relatedQuestionRefs:
        - QE019

    - type: missing-source
      severity: minor
      topic: multi-country-architecture
      missingEvidence: >
        Technical scope, engineering timeline, and cost estimate for Alan's global
        multi-country architecture rebuild referenced in the Q1 2026 shareholder letter.
      whyItMatters: >
        The rebuild is described as the prerequisite for 10× faster international
        expansion. Without scope and timeline, the 2026–2027 expansion plan cannot be
        grounded in engineering feasibility.
      diligencePath: >
        Request technical roadmap document or CTO briefing; review senior engineering
        job postings for architecture titles.
      relatedQuestionRefs:
        - QE022

    - type: missing-source
      severity: minor
      topic: alan-precision
      missingEvidence: >
        Systematic comparison of Alan Précision's biomarker panel, pricing, turnaround
        time, and physician interpretation model against French precision-health
        competitors Zoï and Lucis.
      whyItMatters: >
        Alan Précision entered a market where competitors have multi-year head starts.
        Without a structured comparison, it is not possible to assess whether Alan's
        insurance integration adds enough value to overcome the experience disadvantage.
      diligencePath: >
        Obtain Zoï and Lucis product documentation; conduct structured feature comparison
        against Alan Précision Index Ventures job description.
      relatedQuestionRefs:
        - QE027
