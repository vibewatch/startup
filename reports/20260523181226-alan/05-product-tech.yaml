callouts:
  - calloutType: strength
    title: "Mo AI: industry-first clinical evidence at scale"
    body: >
      Alan's Mo AI medical assistant is backed by the first large-scale conversational
      medical AI study in real clinical settings—81% patient adoption, 95% physician
      approval, and 4.6/5 patient satisfaction—published on Arxiv and independently
      corroborated by French medical press. This evidence base is a defensible moat:
      no comparable European health insurtech has published a randomised or large-cohort
      clinical AI study at this scale, making Mo a genuine product-differentiation asset
      that is hard to replicate quickly.
    claimRefs:
      - CE005
      - CE006
      - CE044

  - calloutType: risk
    title: "Almerys structural dependency: two breaches in 18 months"
    body: >
      Alan's ISO 27001 certification covers 100% of its own operations but explicitly
      excludes third-party processors. Almerys—used for tiers payant payment
      processing—suffered a breach in early 2024 affecting 33M+ French policyholders
      (CNIL investigation launched) and a second confirmed cyberattack on 23 May 2026
      (the date of this report), exposing Alan members' social security numbers and
      contract numbers. This is a structural, not incidental, vulnerability. Alan cannot
      unilaterally remediate Almerys's security posture, and successive incidents signal
      systemic risk in the French healthcare payment infrastructure on which Alan depends.
    claimRefs:
      - CE042
      - CE043

  - calloutType: insight
    title: "AI as operating model, not feature"
    body: >
      Alan deploys AI across at least six distinct operational domains: medical
      consultation (Mo), fraud detection, claims autoparsing, customer support
      auto-resolution, engineering productivity (Hopper), and sales AI. In aggregate,
      these deployments let Alan grow membership 48% in 2024 while growing headcount
      only 8%—compressing the operating leverage gap between Alan and traditional
      insurers with large back-office teams. The Hopper coding agent, which enables
      non-engineers to merge production code, is a further structural bet: if it scales,
      Alan can hire fewer engineers per unit of product velocity than its competitors.
    claimRefs:
      - CE025
      - CE026
      - CE027
      - CE028
      - CE029

