  - id: TI005
    title: Public Financial Gaps
    columns:
      - Missing Metric
      - Impact on Analysis
      - Severity
      - Diligence Path
    rows:
      - - "GAAP/IFRS audited consolidated group accounts (P&L, balance sheet, cash flow)"
        - Cannot verify revenue recognition, true cash burn, or working capital dynamics
        - Blocking
        - "Request audited consolidated statements from management; check ACPR entity-level filings"
      - - "Claims-to-premiums (loss) ratio — actual vs. equilibrium target"
        - Cannot assess actuarial adequacy; adverse development could rapidly erode subscription margin
        - Material
        - "Obtain from SFCR actuarial report appendix or due-diligence data room"
      - - "Customer acquisition cost (CAC) and payback period by channel"
        - Cannot compute LTV:CAC or assess sales efficiency vs. legacy insurers and Oscar Health
        - Material
        - Request from management; benchmark against public health insurer peers
      - - "Per-country P&L (France, Belgium, Spain, Canada)"
        - Cannot quantify international drag on group profitability or assess country-level unit economics
        - Material
        - "Request segment reporting; model France contribution vs. international investment"
      - - "Subscription fee per member by plan tier and geography"
        - Cannot model subscription revenue growth or churn; limits SaaS-comparable analysis
        - Material
        - "Request plan pricing sheet and billing data; cross-check with third-party pricing sites"
      - - "Press vs. SFCR loss figure reconciliation (€54M vs. €34M for FY2024)"
        - Undermines comparability of multi-year loss trend; accounting basis unknown
        - Material
        - "Request reconciliation bridge: IFRS group P&L vs. Solvency II solo/group result"
    notes: "Gap severity: Blocking = cannot reach financial verdict without it; Material = affects confidence in underwriting assumptions. SFCR disclosure covers Solvency II regulatory view only; no equivalent of SEC 10-K or AMF Document de Référence exists for private French insurers."
