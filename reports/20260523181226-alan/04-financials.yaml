  - id: cost-unit-econ
    title: Cost Structure, Unit Economics, and Loss Trajectory
    body: >
      Alan's operating costs fall into three main buckets: technology and AI investment, sales and marketing, and general and administrative overhead. Headcount grew from ~550 employees (start of FY2024) to ~600 (end FY2024, +8%) to approximately 800 (FY2025, +10% payroll growth disclosed by CFO Mihaela Albu in March 2026). Revenue per employee reached an estimated €981K/employee in FY2025 (€785M / 800), reflecting significant operating leverage—each Alaner generates roughly twice the revenue as in FY2023. The net loss trajectory improved substantially: from ~€59–61M (FY2023, per press) to ~€54M (FY2024, per press-release preliminary) to €26M (FY2025, per SFCR). A material discrepancy exists between the press-released FY2024 loss figures (~€54M cited in January 2025 press conferences and the Maddyness/Obliginfos press) and the SFCR-published figure (-€34M for FY2024), resolved to -€26M in FY2025. This gap likely reflects differences in Solvency II accounting versus full-group corporate P&L. France achieved operational profitability in FY2025—a structurally important milestone because France is >75% of group revenue. The loss ratio (claims-to-premiums) targeting ~100% is management-stated but never independently verified; any persistent adverse deviation would erode the subscription margin and accelerate cash consumption. The implied "true gross margin" on the subscription layer is very high (software-like) but the consolidated gross margin including pass-through premiums is much lower. Losses as a share of ARR fell from ~17% in FY2023 to ~3.3% in FY2025, a compelling improvement in revenue quality.
