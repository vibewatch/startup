  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: filing-gaps
      missingEvidence: "GAAP/IFRS audited consolidated financial statements (P&L, balance sheet, cash flow statement) for the Alan group for FY2024 and FY2025."
      whyItMatters: "Without audited accounts, the net loss figure, revenue recognition policy, balance sheet leverage, and actual cash burn cannot be independently verified; the discrepancy between SFCR and press-released loss figures cannot be resolved."
      diligencePath: "Request audited consolidated statements from management; seek ACPR filing data for the French legal entity; benchmark against any future AMF registration if Alan pursues a public listing."
      relatedQuestionRefs:
        - QI026
        - QI007

    - type: missing-source
      severity: material
      topic: loss-ratio
      missingEvidence: "Actual claims-to-premiums ratio (loss ratio) for Alan's complementary health and prévoyance books, by year from FY2021 to FY2025."
      whyItMatters: "The loss ratio is the core actuarial health metric for an insurance company; without it, adverse development risk cannot be quantified and the subscription margin's true protection cannot be assessed."
      diligencePath: "Obtain from SFCR actuarial report appendix; request in due-diligence data room; engage an actuary to review Alan's experience statistics."
      relatedQuestionRefs:
        - QI003

    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: "Customer acquisition cost (CAC) and payback period by sales channel (direct enterprise, broker, public tender, Belfius distribution) for France and international markets."
      whyItMatters: "CAC and payback are essential for LTV:CAC assessment and for benchmarking Alan's sales efficiency against Oscar Health and legacy insurers; without them the growth investment case cannot be fully underwritten."
      diligencePath: "Request from management; model from disclosed headcount growth and sales team size versus ARR growth; compare to public health insurer data."
      relatedQuestionRefs:
        - QI019
        - QI022

    - type: conflicting-data
      severity: material
      topic: net-loss
      missingEvidence: "Reconciliation bridge between Alan's SFCR-published net loss for FY2024 (-€34M) and the press-released preliminary net loss (~€54M), explaining the accounting scope and methodology differences."
      whyItMatters: "A €20M gap in reported losses undermines multi-year trend comparability and raises questions about which basis reflects true economic performance of the group."
      diligencePath: "Request bridge reconciliation from CFO; clarify whether SFCR covers French entity only or consolidated group; obtain IFRS-basis management accounts."
      relatedQuestionRefs:
        - QI007
        - QI005

    - type: missing-source
      severity: material
      topic: international-revenue
      missingEvidence: "Per-country P&L (operating contribution or EBITDA) for France, Belgium, Spain, and Canada for FY2024 and FY2025."
      whyItMatters: "Cannot assess the drag from international scale-up markets (Belgium, Spain, Canada) on the path to group profitability; France contribution absorbs losses from other markets."
      diligencePath: "Request segment reporting from management; model from available member counts by geography and average pricing assumptions."
      relatedQuestionRefs:
        - QI004

    - type: enumeration-incomplete
      severity: minor
      topic: pricing
      missingEvidence: "Official per-plan subscription fee amounts and enterprise pricing schedules for Alan's health insurance plans in France and international markets."
      whyItMatters: "Subscription fee per member is the key unit economic driver; without disclosed pricing, the 12–14% management fee claim cannot be verified at the plan level."
      diligencePath: "Request pricing schedules from Alan enterprise sales team; cross-reference with enterprise client billing data if accessible."
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI002

    - type: enumeration-incomplete
      severity: minor
      topic: revenue-model
      missingEvidence: "Complete breakdown of Alan's revenue by stream (health premiums, prévoyance, subscription, Shop, international) for FY2025, and adjusted gross margin by layer."
      whyItMatters: "Revenue mix analysis (quality of earnings) requires knowing what fraction of ARR is high-margin subscription vs. low-margin premium pass-through; current estimates are back-of-envelope. Without a revenue bridge, the adjusted gross margin cannot be independently verified."
