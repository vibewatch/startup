  - id: financial-gaps-verdict
    title: Public Financial Gaps and Diligence Verdict
    body: >
      Alan's public financial disclosure is limited to: SFCR summary web pages (not a full PDF SFCR in accessible form), ARR and net loss figures disclosed at press conferences, and solvency ratio ranges cited in corporate communications. No GAAP or IFRS audited consolidated financial statements are publicly available. The absence of a statutory audit trail for the full group means investors and diligence parties cannot independently verify revenue recognition, balance sheet items, or cash flow dynamics. Specific gaps include: (1) the exact claims-to-premiums (loss) ratio—a core health insurance metric—has never been disclosed, leaving actuarial risk unquantifiable; (2) customer acquisition cost and payback period are completely private, preventing standard SaaS unit-economic benchmarking; (3) per-country P&L (France, Belgium, Spain, Canada) is unavailable, masking the drag from international scale-up markets on the path to group profitability; (4) subscription fee levels per member by plan tier are not officially disclosed; third-party comparators cite €39–120/month in total plan premiums but subscription vs. insurance premium splits within each tier are opaque. Adverse concerns raised by French trade unions and the MGEFI (incumbent mutuelle at the French Ministry of Finance) center on Alan's ongoing losses and ability to honor multi-year public sector obligations. Analyst Matteo Carbone (IoT Insurance Observatory) called Alan's €4B valuation "unrealistic" relative to premiums and lack of profitability. These concerns are partially mitigated by Alan's Solvency II capital buffer (3.6× SCR), ACPR supervision, and reinsurance program. The financial verdict is that Alan demonstrates strong revenue quality improvement and a credible path to group profitability by 2027, but multiple critical private metrics prevent a fully underwritten financial assessment without a data room.
