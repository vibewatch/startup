company:
  name: Alan

chapter:
  number: 4
  title: Financials
  summary: >
    Alan operates a dual-layer revenue model: near-zero-margin insurance premiums and a 12–14% per-member subscription fee that is the true profit engine. ARR reached €785M (+53% YoY) in FY2025, with Q1 2026 already at €804M. The company achieved operational profitability in France and posted a group net loss of €26M in FY2025 (SFCR-audited), improved from €34M in FY2024 per regulatory accounts (press-released figures differ: €54M for FY2024). Regulatory capital exceeds €374M—3.6× the ~€105M Solvency II SCR—and cash reserves stand at ~€376M, providing multi-year runway. Key diligence gaps remain: no GAAP/IFRS audited consolidated accounts, no public loss ratio, no disclosed CAC or per-country P&L.

sections:
  - id: revenue-model-arr
    title: Revenue Model and ARR Trajectory
    body: >
      Alan's business model rests on two explicitly distinct revenue layers. The first is insurance premiums, priced at near-equilibrium with expected claims—Alan targets a claims-to-premiums ratio of approximately 100%, meaning premiums are largely passed through to reimbursements with minimal net actuarial margin for Alan. The second is a per-member monthly subscription fee that funds the digital health platform: AI-powered medical chat, optical ordering, back-pain programs, and prevention tools. The CEO stated publicly that the management fee is set at "12 to 14% of premiums," making the subscription layer a structurally separate, high-margin SaaS-like stream atop a low-margin insurance base. Prévoyance (disability/life) represents approximately 25% of French revenue and follows the same pass-through structure. ARR grew from €340M (FY2023) to €505M (FY2024, +48%) to €785M (FY2025, +53%), with Q1 2026 at €804M, on track toward the €1B annual target. France accounts for more than three-quarters of group ARR. The public sector, following wins at the Ministry of Economy and Finance (135,000 civil servants) and earlier government ministries, represented 32% of FY2024 net ARR growth and multiplied fourfold in FY2025. International markets (Belgium, Spain, Canada) are growing but remain a minority of group revenue. The implied subscription revenue at 12–14% of €785M is approximately €94–110M, which constitutes the primary economic profit pool from which operating expenses must be recovered before any group net result can turn positive.
