    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI026

callouts:
  - calloutType: strength
    title: Solvency Fortress — 3.6× Capital Coverage
    body: >
      Alan holds regulatory own funds exceeding €374M against a Solvency II SCR of approximately €105M—a coverage ratio of more than 3.6×, compared to the French complementary health insurance market average of 241% and the regulatory minimum of 100%. Combined with ~€376M in liquid deposits and a conservative investment policy, this creates a multi-year buffer against adverse healthcare cost scenarios, making a near-term capital distress event highly unlikely.
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022

  - calloutType: risk
    title: "Adverse Signal: Loss-Figure Discrepancy and No Audited Accounts"
    body: >
      Alan's press-released net loss for FY2024 was approximately €54M (per January 2025 press conference, cited by Sifted, TechCrunch, and Obliginfos), while the SFCR-published figure shows -€34M for FY2024 improving to -€26M for FY2025. This €20M discrepancy—likely reflecting different accounting scopes (full-group IFRS vs. Solvency II entity)—cannot be reconciled without audited consolidated financial statements, which Alan does not publish. This is a structural diligence gap for any investor or creditor relying on multi-year loss trajectories.
    claimRefs:
      - CI013
      - CI014
      - CI028

  - calloutType: risk
    title: Union and Incumbent Opposition to Financial Viability
    body: >
      Multiple French trade unions (CGT, CFDT, FO, Solidaires, UNSA, CFTC, CFE-CGC) publicly questioned Alan's financial sustainability when it won the €Bercy Ministry of Finance contract in May 2025, calling it a "startup déficitaire" whose long-term commitments are "not guaranteed." The MGEFI (displaced incumbent) filed a legal challenge. These concerns—while partially mitigated by Alan's Solvency II capital buffer—highlight reputational and contract-execution risk in the public sector, which is now a material revenue pillar.
    claimRefs:
      - CI031
      - CI032
      - CI033

  - calloutType: insight
    title: "Subscription Revenue: The Hidden SaaS Business Within the Insurer"
    body: >
      At 12–14% of €785M ARR, Alan's subscription fee layer represents approximately €94–110M of genuinely high-margin recurring revenue—the equivalent of a meaningful B2B SaaS business. This layer is structurally separate from insurance premium pass-through and grows proportionally with member base. As France approaches group-level profitability, the subscription fee per member is the dominant driver of operating leverage. Investors valuing Alan purely on insurance premium multiples undercount the embedded platform revenue quality.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005

