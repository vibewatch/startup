  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "financials"
      missingEvidence: >-
        Audited revenue, ARR if applicable, gross margin, cash balance, burn, runway, debt or
        credit facilities, and any secondary component of disclosed financing.
      whyItMatters: >-
        Funding raised is not cash available, and the capital required to reach the November 2028
        mission cannot be assessed without operating cash flows and committed spending.
      diligencePath: >-
        Obtain audited statements, management accounts, bank and debt schedules, the financing
        funds-flow statement, and a milestone-based cash plan through November 2028.
      relatedQuestionRefs:
        - "QO005"
        - "QO006"
        - "QO008"
      relatedTableRefs:
        - "TO001"
    - type: "private-evidence-only"
      severity: "material"
      topic: "commercial-scale"
      missingEvidence: >-
        Contract-by-contract separation of binding backlog from non-binding commitments,
        customer count, deposits, cancellation rights, revenue-recognition timing, and
        concentration.
      whyItMatters: >-
        The reported $2 billion combines contracts and commitments and therefore cannot be
        treated as revenue, ARR, or fully firm backlog.
      diligencePath: >-
        Review the signed contract register, customer schedules, amendments, deposit receipts,
        cancellation clauses, and accounting treatment.
      relatedQuestionRefs:
        - "QO006"
        - "QO008"
      relatedTableRefs:
        - "TO001"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "governance"
      missingEvidence: >-
        Complete executive and board rosters, founder ownership, investor ownership, voting and
        veto rights, observer rights, committees, delegated authorities, and succession plans.
      whyItMatters: >-
        Publicly naming a founder and one incoming investor director does not establish control,
        governance independence, or resilience to key-person loss.
      diligencePath: >-
        Obtain the current cap table, articles, shareholders' agreement, board minutes and
        committee charters, organization chart, and CEO succession plan.
      relatedQuestionRefs:
        - "QO003"
        - "QO004"
        - "QO010"
      relatedTableRefs:
        - "TO002"
        - "TO003"
    - type: "missing-source"
      severity: "material"
      topic: "regulatory-and-adverse-events"
      missingEvidence: >-
        Direct regulator, court, insurance, licensing, incident, or enforcement records for TEC
        and its planned missions; the assigned adverse search returned no retained result URLs.
      whyItMatters: >-
        Absence of a retained adverse record is not proof that no incident, dispute, licensing
        constraint, or enforcement matter exists.
      diligencePath: >-
        Run jurisdiction-specific corporate, court, aviation and space-regulator checks and
        request licensing, insurance, anomaly, claims, and investigation registers from TEC.
      relatedQuestionRefs:
        - "QO009"
