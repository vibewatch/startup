company:
  name: "The Exploration Company"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Founded in 2021, The Exploration Company is a privately held European space-transportation
    developer whose near-term product is the reusable Nyx capsule and whose longer-term stack
    includes the Storm engine. A September 2026 $450 million Series C brought company-reported
    funding secured to approximately $680 million, but revenue, cash availability, ownership,
    and the binding portion of more than $2 billion in reported contracts and commitments remain
    private diligence items.
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >-
      The Exploration Company (TEC) was founded in 2021 by Hélène Huby and a team of aerospace
      veterans. Public location records are close but not identical: Dealroom identifies Planegg,
      Germany as headquarters, while the company-controlled LinkedIn profile identifies Gauting,
      Bavaria and lists sites in France, Italy, the United States, the UAE, and Luxembourg. TEC
      describes a full-stack space-transportation platform built around Nyx, a reusable,
      launcher-agnostic capsule intended to carry cargo to orbital stations and return it to
      Earth, and Storm, a reusable high-thrust engine intended for a future heavy launcher. This
      is a capital-intensive manufacturing and mission-services model rather than a disclosed
      software-style recurring-revenue model; no retained source reports ARR or accounting
      revenue.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "capital-scale-and-milestones"
    title: "Capital, scale, and milestones"
    body: >-
      TEC announced a $450 million Series C on 8 September 2026, co-led by Bessemer Venture
      Partners, Atomico, and the Scaleup Europe Fund managed by EQT. The company said the round
      brought total funding secured to approximately $680 million; that is cumulative financing,
      not cash available or runway. Dealroom separately displayed a broad 2026 valuation range
      of $1 billion to $2.5 billion, which is not an exact post-Series C valuation. Commercial
      scale is also expressed through company-originated operating indicators: more than $2
      billion in contracts and commitments and ten booked Nyx missions. Neither metric is
      presented as recognized revenue, and the retained evidence does not disclose the
      commitment mix, cancellation rights, deposits, or customer concentration. TEC reported
      more than 550 employees, while platform counts use different definitions and should not be
      treated as directly comparable.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
  - id: "leadership-governance-and-execution-risk"
    title: "Leadership, governance, and execution risk"
    body: >-
      Founder and CEO Hélène Huby brings unusually direct founder-market fit: Atomico and
      TechCrunch describe roughly two decades across Airbus and ArianeGroup, including leadership
      of the European Service Module for NASA's Orion spacecraft. Governance disclosure is much
      thinner than operating disclosure. The Series C announcement says Bessemer partner Alex
      Ferrara will join the board, but the complete board, observer rights, voting control,
      founder ownership, and succession plan are not public in the retained evidence. Huby's
      central role in fundraising, product direction, and public positioning therefore creates a
      material key-person diligence question rather than proof of inadequate succession. The
      execution plan is also demanding: TechCrunch calls the timetable tight and reports that
      additional funding would be needed for a launch pad and the rocket itself. The November
      2028 ISS mission remains a target, not a completed capability or contracted revenue event.
    claimRefs:
      - "CO010"
      - "CO012"
      - "CO013"
      - "CO016"
    tableRefs:
      - "TO002"
      - "TO003"
