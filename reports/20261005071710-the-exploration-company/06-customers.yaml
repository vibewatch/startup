callouts:
  - calloutType: "insight"
    title: "Backlog Quality: Distinction Between Non-Binding MOUs and Cash Receipts"
    body: "The headline $2 billion backlog is The Exploration Company's strongest marketing asset, yet diligence indicates that the vast majority consists of commercial space station reservations and agency competitions rather than non-cancellable cash contracts. Investors must distinguish prospective market interest from enforceable revenue backlog."
    claimRefs:
      - "CU001"
      - "CU006"
      - "CU008"
  - calloutType: "risk"
    title: "Extreme Downstream Reliance on Unbuilt Commercial Space Stations"
    body: "With 90% of private commercial bookings originating from Axiom Space, Starlab, and Vast, The Exploration Company is entirely exposed to the operational and financing timelines of commercial space station developers. Setbacks in private station deployment will directly impair the flight manifest of Nyx."
    claimRefs:
      - "CU007"
      - "CU014"
