figures:
  - id: "FU001"
    title: "Customer Adoption Lifecycle and Expansion Surfaces"
    type: "journey-map"
    summary: "Visual map outlining customer journey progression from initial pre-booking letters of intent through operational recurring resupply missions."
    data:
      items:
        - label: "Engagement Stage 1: Pre-Booking & Letter of Intent"
          detail: "Commercial stations and researchers submit non-binding payload reservations via website or bilateral discussions to establish custom volume requirements."
        - label: "Engagement Stage 2: Technical Milestone & Study Award"
          detail: "Institutional agencies (ESA, NASA) award study grants, technical validation agreements, and phased development competitions."
        - label: "Engagement Stage 3: Subscale Flight Demonstration"
          detail: "Customer payloads and internal instrumentation fly on subscale demonstrators (Bikini on Ariane 6, Possible on orbital launcher) to prove re-entry survival."
        - label: "Engagement Stage 4: Formal Launch Service Contract"
          detail: "Execution of binding launch service agreements with milestone payments tied to full-scale Nyx Earth vehicle integration."
        - label: "Engagement Stage 5: Operational LEO Resupply"
          detail: "Targeted 2028 operational cargo docking with the International Space Station and commercial orbital stations delivering pressurized payload."
        - label: "Engagement Stage 6: Expansion & Lunar Transport"
          detail: "Long-horizon expansion to lunar surface logistics (Nyx Moon) and in-orbit orbital refueling services."
    approximationNotes: "Lifecycle stages represent company commercialization framework synthesized from pre-booking protocols and institutional milestone schedules."
