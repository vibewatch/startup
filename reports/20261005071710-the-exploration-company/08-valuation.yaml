    claimRefs: [CV001, CV003, CV004, CV006, CV011, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Side, Argument, Evidence, What would change the view]
    rows:
      - [Thesis, "Capital supports continued development.", "$450M Series C and approximately $680M total funding were reported.", "A quantified program budget and runway would strengthen the link between capital and delivery."]
      - [Thesis, "Demand signals extend beyond a single buyer.", "Sources describe ESA and private-station-provider commitments.", "Executed contracts with funded task orders, payment schedules, and margins would strengthen confidence."]
      - [Anti-thesis, "Operational proof has not closed the reusable-flight loop.", "The adverse report says two tests had not completed planned recovery.", "A recovered mission followed by docking progress would reduce technical risk."]
      - [Anti-thesis, "Public valuation support is thin.", "Reported >$2B talks were non-final and public data pages omit usable transaction terms.", "A signed cap table, preference stack, and independent secondary mark would permit price analysis."]
    notes: "Contract values are reported commitments rather than recognized revenue; evidence does not disclose margins, cancellation rights, or funded backlog."
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV007, CV009, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Successful recovery and docking progress; commitments convert into funded deliveries.", "A premium to the reported >$2B discussion could be considered only after private economics support it.", "Schedule, certification, and cost growth.", "Recovery plus independently verified contract conversion."]
      - [Base, "Technical progress continues and current capital funds the next major milestone.", "Defer fair value; use milestone tranches and downside protection rather than a public multiple.", "Runway and preference overhang remain unknown.", "On-time mission milestones and disclosed runway."]
      - [Bear, "Recovery or docking slips and another financing is needed before operational proof.", "Price below prior terms or defer investment; no public downside floor is supportable.", "Dilution, down-round terms, and commitment cancellation.", "Missed recovery milestone or accelerated financing need."]
    notes: "Cases are conditional frameworks, not forecasts; no probabilities, precise valuation ranges, or target returns are asserted because public inputs are insufficient."
    claimRefs: [CV004, CV006, CV011, CV012, CV013, CV014]
