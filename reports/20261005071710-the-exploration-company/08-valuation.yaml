company:
  name: The Exploration Company
chapter:
  number: 8
  title: Valuation
  summary: >-
    The Exploration Company has substantial financing and company-reported contract
    commitments, but the public record does not disclose the economics, security terms,
    or operating evidence needed to underwrite a precise entry price. The appropriate
    stance is to track and conduct further diligence, with any investment conditioned on
    flight recovery, customer-contract quality, and private financing terms.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is track / research more, with high execution risk and no
      supportable public entry-price conclusion. A reported financing discussion above
      $2 billion was expressly non-final in July 2026, while the later $450 million
      Series C establishes financing capacity but not a disclosed post-money valuation
      or investor return basis. The company has attracted enough capital and commitments
      to merit continued diligence, yet neither funding raised nor contract commitments
      should be treated as cash available, revenue, or margin. Entry discipline should
      therefore be milestone-based: require private access to round terms and economics,
      then connect price to demonstrated recovery, docking progress, and funded delivery
      obligations rather than to a generic European-space premium.
    claimRefs: [CV001, CV002, CV003, CV004, CV011, CV012, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-valuation-context
    title: Financing and valuation context
    body: >-
      The financing trajectory is credible but does not itself establish value. An
      independent report records a $450 million Series C and approximately $680 million
      of total funding, while company-issued LinkedIn material repeats those figures.
      Earlier coverage reported a $160 million Series B and nearly $230 million of total
      funding at that time. The July 2026 discussion of at least $300 million at more
      than $2 billion was not finalized, so it is a negotiation reference rather than a
      transaction mark. Public databases identify rounds and a similarity-based
      comparable set, but the retained pages do not provide usable valuation observations
      or transaction terms. Dilution, liquidation preference, seniority, anti-dilution,
      and pro-rata rights remain material private-data gaps.
    claimRefs: [CV001, CV002, CV004, CV005, CV007, CV011]
    tableRefs: [TV002]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on a large capital base, a reusable capsule and engine platform,
      and commercial or institutional demand signals. Vestbee reports more than $2
      billion in contracts and commitments, while company-issued LinkedIn material
      describes a EUR760 million ESA agreement covering an initial demonstration and two
      future cargo missions. An investor also describes several hundred million in
      contracts, mostly from private station providers. The anti-thesis is equally
      consequential: the most detailed adverse report says neither flight test had
      completed the recovery loop, and a contract headline does not reveal cancellation,
      milestone-payment, cost, margin, or cash-conversion terms. These gaps keep confidence
      below the level needed for a price recommendation.
    claimRefs: [CV003, CV006, CV008, CV009, CV015, CV016]
  - id: scenarios-and-downside
    title: Scenarios and downside
    body: >-
      Scenarios are framed around observable milestones rather than invented revenue
      multiples. The bull case needs successful capsule recovery, docking progress, and
      evidence that awarded commitments convert into funded, economically attractive
      deliveries. The base case assumes continued technical progress and sufficient
      capital but with valuation deferred until unit economics and financing preferences
      can be inspected. The bear case is a delay or failed recovery that forces additional
      financing before operational proof, increasing dilution and reducing negotiating
      leverage. No probability percentage, valuation range, target return, or exit date
      is supportable from the assigned public evidence; each should be populated only
      after data-room review.
    claimRefs: [CV006, CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness is not demonstrated by the retained evidence. The company is
      privately held, continues to fund two capital-intensive development programs, and
      has not supplied public audited financials, cap-table terms, or a priced secondary
      transaction in the assigned sources. Before underwriting an exit, obtain the Series
      C capitalization table and preference stack; audited revenue, cash burn, backlog
      conversion, gross margin, and remaining program cost; the ESA and major commercial
      contracts with termination and milestone-payment schedules; and an independent
      technical review of recovery and docking readiness. Thesis-break triggers are a
      failed or materially delayed recovery milestone, commitments that do not convert
      into funded revenue, or financing terms that impair common-equity outcomes.
    claimRefs: [CV006, CV007, CV010, CV011, CV014, CV015]
