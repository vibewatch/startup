    title: "Contract Quality Dilution: Bookings Versus Firm Cash Flow"
    body: "The Exploration Company cites over $2 billion in commercial contracts and customer commitments, yet this metric blends binding agency development contracts with non-binding letters of intent from speculative commercial space station developers. Diligence must evaluate counterparty viability alongside spacecraft technical maturity."
