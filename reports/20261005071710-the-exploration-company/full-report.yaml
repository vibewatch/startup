chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The Exploration Company (TEC) was founded in 2021 by Hélène Huby and a team of aerospace veterans. Public
              location records are close but not identical: Dealroom identifies Planegg, Germany as headquarters, while
              the company-controlled LinkedIn profile identifies Gauting, Bavaria and lists sites in France, Italy, the
              United States, the UAE, and Luxembourg. TEC describes a full-stack space-transportation platform built
              around Nyx, a reusable, launcher-agnostic capsule intended to carry cargo to orbital stations and return
              it to Earth, and Storm, a reusable high-thrust engine intended for a future heavy launcher. This is a
              capital-intensive manufacturing and mission-services model rather than a disclosed software-style
              recurring-revenue model; no retained source reports ARR or accounting revenue.
            claimRefs:
              - CO001
              - CO002
              - CO003
