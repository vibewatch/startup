              - CM012
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Institutional agencies are the most visible budget owners because they can procure demonstrations, station
              cargo services, and microgravity payloads through funded programs. Commercial station operators are a
              second payer class: investor reporting identifies private station providers as a major source of
              contracts, while Atomico describes demand as broadly split between public and private customers. Research
              organizations and industrial experiment sponsors are users and payload buyers rather than necessarily the
              mission-level payer. The historical sales path began with a pre-booking and letter of intent, with a
              launch contract to follow later. That path makes signed mission contracts, milestone payments,
              cancellation rights, and station readiness more decision-useful than an undifferentiated customer count.
              Crew and lunar users expand the long-term buyer set but remain outside the evidenced near-term cargo
              serviceable market.
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM012
              - CM015
      - number: '2.4'
        title: Growth drivers, adoption constraints, and timing
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver is a structural transition: the ISS is due to retire near the end of the
              decade, successor stations are expected to be commercial, and Europe seeks assured transport and return
              capability. Nyx's planned launcher independence, reuse, and in-orbit refueling could reduce buyer lock-in
              and expand mission flexibility. Adoption nevertheless depends on execution rather than market narrative.
              Re-entry, recovery, station docking, safety approval, launch availability, and capital remain gating
              constraints. The 2025 Mission Possible demonstrator operated in orbit and re-entered, but communication
              was lost before expected splashdown, leaving recovery validation incomplete. The $450 million Series C is
              funding both Nyx and Storm, showing that supply expansion is capital intensive. Mission timing and
              conversion of commitments into revenue therefore remain the critical valuation sensitivities.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand proof is stronger than market-size proof
            body: >-
              Booked missions and disclosed agreements provide concrete procurement signals, but none of the allocated
              sources supplies a comprehensive market denominator or contract-level revenue schedule. Valuation work
              should model mission conversion rather than applying a generic space-economy multiple.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM015
          - type: callout
            title: Station and vehicle schedules are coupled
            body: >-
              The commercial opportunity depends on successor stations becoming operational while Nyx clears docking,
              re-entry, recovery, safety, and launch milestones. Slippage on either side can defer demand even when
              customer interest is real.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Orbital Logistics Landscape and Peer Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The commercial low Earth orbit (LEO) transportation and resupply ecosystem has historically been
              concentrated around heavily subsidized government programs and US commercial cargo providers. The primary
              direct and incumbent operational baseline is established by SpaceX's Dragon vehicle, which commands
              dominant flight heritage under NASA Commercial Resupply Services contracts, alongside Boeing's Starliner
              capsule program. Emerging peers in the commercial space station supply chain include Sierra Space, which
              is developing the Dream Chaser winged spaceplane to offer gentle runway landing for microgravity research
              cargo, and Axiom Space, which operates private orbital missions while developing commercial station
              modules that require diverse logistics partners. Beyond US incumbents, European initiatives such as the
              ESA Space Rider program represent partial institutional substitutes, while ArianeGroup and Airbus Defence
              & Space represent both legacy industrial incumbents and potential strategic partners. TEC positions its
              Nyx capsule as a modular, vehicle-agnostic European platform designed to break single-source dependency on
              US providers while undercutting traditional cost structures.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP012
      - number: '3.2'
        title: Competitor Profiles, Capabilities, and Strategic Trajectories
        blocks:
          - type: paragraph
            body: >-
              Evaluating orbital logistics providers requires examining launch vehicle coupling, payload capacity,
              re-entry capabilities, and capital scale. SpaceX commands unmatched operational cadence and cost
              advantages by vertically integrating Dragon with Falcon 9 and Falcon Heavy launchers, creating an
              incumbent moat in orbital cadence, launch cost absorption, and NASA contracting. Boeing Starliner
              represents a high-capital legacy defense-prime architecture focused primarily on crew transportation,
              burdened by elevated development expenditures and schedule delays that demonstrate the fragility of
              traditional procurement models. Sierra Space offers differentiated runway recovery with Dream Chaser,
              targeting gentler landing environments for sensitive microgravity science and pharmaceutical payloads. In
              contrast, The Exploration Company focuses Nyx on modular pressurized and unpressurized orbital cargo
              delivery with open launcher compatibility, enabling operations across Ariane 6, Falcon 9, and future
              heavy-lift systems, while developing the Storm oxygen-methane engine to establish longer-term sovereign
              launch-and-logistics integration.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: Switching Costs, Channel Power, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Moat durability in space logistics is governed by mission heritage, docking certifications, institutional
              procurement mandates, and launcher access. Incumbent providers like SpaceX possess formidable distribution
              power via established launch schedules, flight-proven thermal protection systems, and long-term NASA
              flight manifests. For commercial space station operators such as Axiom Space, multi-homing across cargo
              providers is an operational imperative to mitigate single-provider launch grounding and geopolitical
              bottlenecks. TEC's structural moat is rooted in European institutional demand for sovereign orbital
              autonomy, codified by ESA's LCRS ALADDIN award of 760 million euros and anchor mission commitments.
              However, TEC faces critical competitive vulnerabilities: absent its own operational launcher, Nyx
              initially depends on third-party launchers including SpaceX's Falcon 9 and Arianespace's Ariane 6, leaving
              delivery cadence and pricing partly subject to external launcher manifests until the 180-ton-thrust Storm
              engine program matures.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Multi-Homing Strategic Imperative for Private Space Stations
            body: >-
              Commercial space station builders such as Axiom Space cannot afford single-source logistics reliance on
              SpaceX, which also develops competing orbital transportation infrastructure. Developing relationships with
              independent, launch-agnostic European logistics operators like The Exploration Company is a strategic
              hedge against transport bottlenecks and unilateral pricing pressure.
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
          - type: callout
            title: Launcher Coupling Bottleneck in Early Operational Phases
            body: >-
              Until The Exploration Company's high-thrust Storm engine qualifies and pairs with a future European
              heavy-lift rocket, Nyx remains vulnerable to launcher scheduling and manifest delays across Ariane 6 and
              third-party launchers such as SpaceX Falcon 9, creating an operational dependency on potential
              competitors.
            calloutType: risk
            claimRefs:
              - CP007
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial Revenue Model, Pricing Mechanics, and Backlog Composition
        blocks:
          - type: paragraph
            body: >-
              The Exploration Company structures its commercial proposition as an integrated space logistics and
              manufacturing provider, targeting public space agencies and emerging commercial orbital destinations. Core
              forward monetization relies on pressurized cargo delivery and return missions to low Earth orbit space
              stations via its reusable Nyx spacecraft, supplemented by long-horizon lunar transport services and
              payload data infrastructure. While the company announces over $2 billion in public and private commercial
              customer contracts and commitments, the headline aggregate bundles firm service contracts, preliminary
              agency study awards, and non-binding commercial space station memorandums of understanding without
              disclosing recognized accounting revenue or contract cancellation provisions. In institutional European
              and international procurement, list pricing per kilogram of pressurized payload is not publicly published,
              operating instead on negotiated milestone-based launch and mission agreements such as the European Space
              Agency LEO Cargo Return Service competition.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI007
      - number: '4.2'
        title: Unit Economics, Cost Structure Drivers, and Manufacturing Boundaries
        blocks:
          - type: paragraph
            body: >-
              Evaluating unit economics for European orbital logistics requires separating prototype development
              expenditure from operational flight cycle costs. The Exploration Company demonstrated capital efficiency
              during early flight testing, expending under €2 million over nine months on the subscale Mission Bikini
              demonstrator and €25 million within three years on the orbital Mission Possible test vehicle. However,
              operational unit margins remain opaque because standard spacecraft operating cost components—including
              launch vehicle procurement, carbon-based thermal protection refurbishment, propellant loading, and
              recovery operations—are entirely unreleased. The company designs Nyx to be launcher-agnostic, flying on
              commercial rockets such as SpaceX Falcon 9 or Arianespace Ariane 6, which insulates initial operations
              from launcher development risk but leaves per-mission gross margins vulnerable to external third-party
              launch pricing and launch slot availability.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
