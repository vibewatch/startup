        title: Capital, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              TEC announced a $450 million Series C on 8 September 2026, co-led by Bessemer Venture Partners, Atomico,
              and the Scaleup Europe Fund managed by EQT. The company said the round brought total funding secured to
              approximately $680 million; that is cumulative financing, not cash available or runway. Dealroom
              separately displayed a broad 2026 valuation range of $1 billion to $2.5 billion, which is not an exact
              post-Series C valuation. Commercial scale is also expressed through company-originated operating
              indicators: more than $2 billion in contracts and commitments and ten booked Nyx missions. Neither metric
              is presented as recognized revenue, and the retained evidence does not disclose the commitment mix,
              cancellation rights, deposits, or customer concentration. TEC reported more than 550 employees, while
              platform counts use different definitions and should not be treated as directly comparable.
