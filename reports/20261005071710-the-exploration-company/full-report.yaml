companyProfile:
  summary: >-
    The Exploration Company is a privately held European space-transportation developer founded in 2021 and organized
    around the reusable Nyx cargo capsule and Storm propulsion program. The company presents itself as a
    launcher-agnostic orbital logistics platform, with public evidence pointing to a German-French operating footprint
    and a customer base anchored by space agencies and commercial space-station operators.
  headquarters: Gauting / Planegg, Bavaria, Germany
  productSummary: >-
    Reusable Nyx cargo capsule and Storm high-thrust engine for orbital logistics, station resupply, and return
    missions.
  customerFocus: Space agencies and commercial space-station operators
  businessModel: Milestone-based spacecraft development and mission-service contracts
  stage: Series C
  fundingStatus: Raised a $450 million Series C in September 2026; cumulative disclosed funding is approximately $680 million.
