      - number: '1.3'
        title: Leadership, governance, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Founder and CEO Hélène Huby brings unusually direct founder-market fit: Atomico and TechCrunch describe
              roughly two decades across Airbus and ArianeGroup, including leadership of the European Service Module for
              NASA's Orion spacecraft. Governance disclosure is much thinner than operating disclosure. The Series C
              announcement says Bessemer partner Alex Ferrara will join the board, but the complete board, observer
              rights, voting control, founder ownership, and succession plan are not public in the retained evidence.
              Huby's central role in fundraising, product direction, and public positioning therefore creates a material
              key-person diligence question rather than proof of inadequate succession. The execution plan is also
              demanding: TechCrunch calls the timetable tight and reports that additional funding would be needed for a
              launch pad and the rocket itself. The November 2028 ISS mission remains a target, not a completed
              capability or contracted revenue event.
