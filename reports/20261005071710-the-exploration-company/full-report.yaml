        - Defer fair value; use milestone tranches and downside protection rather than a public multiple.
        - Runway and preference overhang remain unknown.
        - On-time mission milestones and disclosed runway.
      - - Bear
        - Recovery or docking slips and another financing is needed before operational proof.
        - Price below prior terms or defer investment; no public downside floor is supportable.
        - Dilution, down-round terms, and commitment cancellation.
        - Missed recovery milestone or accelerated financing need.
    notes: >-
      Cases are conditional frameworks, not forecasts; no probabilities, precise valuation ranges, or target returns are
      asserted because public inputs are insufficient.
    claimRefs:
      - CV004
      - CV006
      - CV011
      - CV012
      - CV013
      - CV014
