  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The core market is transportation of cargo from Earth to low-Earth-orbit stations and back, not the full
              launch, satellite, tourism, or downstream space-services economy. The Exploration Company describes Nyx as
              a reusable capsule for station service and presents Storm, a high-thrust engine, as a separate layer of a
              broader transportation stack. Lunar cargo, crew transport, satellite servicing, and launch propulsion are
              adjacencies rather than part of a defensible near-term Nyx cargo market. The status quo is continued
              dependence on non-European transport providers and on the International Space Station logistics system;
              ESA Space Rider and other emerging vehicles are prospective substitutes. This boundary matters because
              station cargo procurement has identifiable missions, payloads, and anchor buyers, whereas a broad "space
              economy" label would mix unrelated spending pools.
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM011
      - number: '2.2'
        title: Evidence-constrained demand sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not support a conventional TAM, SAM, and SOM estimate. Instead, three
              observable lenses bound demand without treating commitments as revenue. Atomico reports 10 booked Nyx
              missions and more than $2 billion in contracts and commitments, broadly split between public programs and
              private operators. The company's LinkedIn page describes a EUR 760 million ESA agreement covering an
              initial ISS demonstration and two future cargo missions. A 2022 report also recorded target prices of EUR
              15,000 per kilogram for operational flights and EUR 1,500 per kilogram for the demonstration, but those
              are historical targets rather than verified 2026 prices. These lenses show commercial intent, procurement
              scale, and a prior price hypothesis; they cannot be summed into market size, annualized, or converted into
              revenue without contract terms, mission cadence, and current pricing.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
