      - number: '5.2'
        title: Architecture and engineering system
        blocks:
          - type: paragraph
            body: >-
              Public materials identify an integrated hardware-software architecture rather than a commodity capsule
              shell. Nyx combines orbital propulsion, docking avionics, flight software and guidance-navigation-control,
              a carbon-based low-density thermal-protection system, and a parachute recovery chain. Recruiting materials
              add evidence of modern C++ and Python, real-time or embedded flight software, requirements traceability,
              integrated mission testing, certification documentation, product-lifecycle management, bills of materials,
              and interface-control documents. These disclosures show the intended engineering process and control
              surfaces; they do not establish production readiness, flight reliability, cybersecurity posture, or
              successful certification.
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE009
