      - number: '5.3'
        title: Maturity, deployment, and reliability
        blocks:
          - type: paragraph
            body: >-
              Maturity is mixed. The company reported a 2026 drop test in which drogue parachutes stabilized the
              dedicated test vehicle, handed over to the main parachutes, and supported a controlled descent and
              recovery. The test vehicle intentionally replicated relevant mass properties, aerodynamic profile, and
              interfaces rather than the full spacecraft, and the land test did not reproduce the planned water
              splashdown. Independent analysis reports that the earlier Mission Possible demonstrator completed
              controlled orbital re-entry but failed during recovery, so customer payload return was not achieved. Red
              River West also reports two test flights, in 2024 and 2025. Together, these facts support genuine
              development progress while leaving docking, undocking, full-scale recovery, turnaround, and reuse outside
              the demonstrated envelope.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE014
              - CE016
      - number: '5.4'
        title: Assurance and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              The public control framework is strongest around aerospace safety and verification. Company-issued
              recruiting materials call for verification and validation, independent verification and validation,
              traceability from system requirements to tests, NASA safety review documentation, qualification,
              certification, anomaly resolution, and flight readiness. A company LinkedIn update further says
              environmental-control and life-support components were tested individually and then integrated with the
              structural test module and thermal-control system. These are useful process signals, but the pool contains
              no independent audit, security architecture, privacy policy for mission data, completed certification
              record, quantified reliability target, or service-level support evidence. The underwriting view is
              therefore positive on engineering specificity but conditional on an end-to-end demonstration and access to
              qualification, incident, supplier, and refurbishment evidence.
            claimRefs:
              - CE010
              - CE011
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recovery testing targets a known failure mode
            body: >-
              The dedicated drop test exercised the drogue-to-main handover and controlled recovery, directly addressing
              the recovery chain that independent analysis says failed on Mission Possible.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
              - CE009
          - type: callout
            title: Architecture breadth exceeds demonstrated operations
            body: >-
              Public disclosures span cargo, crew, propulsion, software certification, and refurbishment, while retained
              evidence does not show a completed station mission or repeated reuse.
            calloutType: risk
            claimRefs:
              - CE001
              - CE011
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation, Buyer Personas, and Monetization Models
        blocks:
          - type: paragraph
            body: >-
              Commercial traction for The Exploration Company spans two core customer constituencies: sovereign public
              space agencies seeking sovereign European orbital access, and private commercial space station operators
              preparing for low Earth orbit operations after the retirement of the International Space Station. In
              institutional procurement, public space organizations such as the European Space Agency act as anchor
              clients, awarding competitive development contracts and technology validation agreements like the LEO
              Cargo Return Service competition. In the commercial arena, private orbital station developers—including
              Axiom Space, Starlab Space, and Vast—contract for pressurized cargo transport to service planned
              commercial orbital habitats. The company structures monetization through multi-tier pricing models: while
              early subscale technology demonstrators offered suborbital or microgravity payload capacity at accessible
              rates, full-scale orbital missions are priced per mission or per payload kilogram. Crucially, list prices
              and realized unit revenues remain unverified in public filings, with procurement relying on bespoke
              milestone-driven launch and service agreements.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
      - number: '6.2'
        title: Commercial Adoption Trajectory, Mission Bookings, and Backlog Firmness
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of The Exploration Company demonstrates rapid commercial interest, transitioning
              from conceptual pre-booking forms on its public website to major institutional and corporate
              announcements. The company has publicly booked ten orbital missions for its Nyx spacecraft and announced
              total customer contracts and commitments exceeding $2 billion. Private comps and financial profiles
              previously documented an interim milestone of $770 million in contract backlog, with private space station
              operators accounting for approximately 90% of order volume and government space agencies representing the
              remaining 10%. However, diligence reveals a fundamental gap in contract quality: the headline $2 billion
              backlog blends binding development milestone contracts with non-binding letters of intent and speculative
              pre-bookings. Because commercial space stations are themselves in pre-operational development stages, this
              backlog cannot be treated as guaranteed future cash flow or recognized revenue until operational flight
              dates are definitively confirmed.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU013
      - number: '6.3'
        title: Named Customer Proof, Institutional Partnerships, and Flight Milestones
        blocks:
          - type: paragraph
            body: >-
              Named customer proof reflects meaningful early-stage validation from both sovereign aerospace authorities
              and commercial station consortia. In 2023, The Exploration Company secured a milestone pre-booking
              agreement with Axiom Space, representing its first major penetration of the United States commercial space
              station market. Domestically, the European Space Agency selected the company for study and demonstration
              awards—including a €25 million cargo capsule contract—positioning the firm as a sovereign European
              transport supplier. The company also concluded a landmark Space Act Agreement with NASA, making it the
              first European venture to achieve this status for technical information and operational coordination. On
              the flight demonstration front, the company completed two subscale test flights: Mission Bikini flying
              aboard Ariane 6 in 2024, and Mission Possible conducting orbital flight and controlled re-entry in 2025.
              While these flights proved thermal protection and aerothermal re-entry mechanics, full-scale cargo
              delivery to the ISS remains unproven until the planned 2028 demonstration flight.
            claimRefs:
              - CU003
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: Customer Concentration, Procurement Friction, and Station Deployment Risks
        blocks:
          - type: paragraph
            body: >-
              The commercial durability of The Exploration Company faces severe external dependency and concentration
              risks. Nearly the entirety of commercial private demand is concentrated across three speculative private
              station developers: Axiom Space, Starlab, and Vast. If any of these commercial orbital developers
              encounters engineering setbacks, financing shortfalls, or regulatory launch delays, The Exploration
              Company's addressable cargo volume would contract substantially. Furthermore, the operational window to
              serve the International Space Station before its decommissioning around 2030 creates intense schedule
              friction. Delays in capsule flight qualification could cause institutional customers to default entirely
              to incumbent American launch systems like SpaceX Dragon or Northrop Grumman Cygnus. Mitigating this
              concentration requires expanding into non-station commercial research, sovereign defense logistics, and
              in-orbit manufacturing payloads, though these nascent segments currently lack large-scale recurring
              procurement budgets.
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU009
              - CU010
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Backlog Quality: Distinction Between Non-Binding MOUs and Cash Receipts'
            body: >-
              The headline $2 billion backlog is The Exploration Company's strongest marketing asset, yet diligence
              indicates that the vast majority consists of commercial space station reservations and agency competitions
              rather than non-cancellable cash contracts. Investors must distinguish prospective market interest from
              enforceable revenue backlog.
            calloutType: insight
            claimRefs:
              - CU001
              - CU006
              - CU008
          - type: callout
            title: Extreme Downstream Reliance on Unbuilt Commercial Space Stations
            body: >-
              With 90% of private commercial bookings originating from Axiom Space, Starlab, and Vast, The Exploration
              Company is entirely exposed to the operational and financing timelines of commercial space station
              developers. Setbacks in private station deployment will directly impair the flight manifest of Nyx.
            calloutType: risk
            claimRefs:
              - CU007
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Approvals, International Space Treaties, and Multi-Jurisdictional Compliance
        blocks:
          - type: paragraph
            body: >-
              Operational deployment of orbital spacecraft exposes The Exploration Company to multi-tiered regulatory
              and statutory oversight across Europe and the United States. Meeting the European Space Agency's strict
              debris-mitigation policy mandates a maximum casualty risk threshold of 1 in 10,000 for spacecraft
              atmospheric re-entry, requiring exhaustive qualification of Nyx's carbon-based thermal protection shield
              and controlled end-of-life disposal systems. In parallel, visiting logistics flights to the International
              Space Station must clear NASA and ESA joint ISS safety review panels to authorize proximity operations,
              rendezvous, and docking to orbital nodes. Beyond orbital safety, TEC operates distributed engineering,
              testing, and executive facilities across Germany, France, Italy, Luxembourg, the United States (Houston),
              and the United Arab Emirates. This multi-jurisdictional operational footprint triggers strict compliance
              under European dual-use export regulations, French Space Operations Act licensing, German foreign trade
              regulations, and US International Traffic in Arms Regulations (ITAR) and Export Administration Regulations
              (EAR) governing aerospace engineering data transfer and transatlantic defense components. Additionally,
              operating across both European and US defense ecosystems necessitates rigorous corporate governance
              firewalls to protect sovereign European intellectual property while maintaining collaborative agreements
              with NASA.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Engineering Execution, Subsystem Qualification, and Subscale Demonstration Trade-Offs
        blocks:
          - type: paragraph
            body: >-
              Orbital hardware maturation involves severe physics-based failure modes across spacecraft thermal
              management, propulsion, avionics, and docking mechanisms. In early prototype flights such as Bikini and
              Mission Possible, TEC deliberately accepted elevated development risk to accelerate mission cycles,
              omitting parachute drop tests, deploying commercial off-the-shelf (COTS) components in custom flight
              computers, and testing propulsion thrusters only at subscale component levels rather than fully integrated
              stack qualification. Transitioning from subscale prototypes to the full-scale Nyx Earth operational
              capsule introduces complex engineering challenges across the Environmental Control and Life Support System
              (ECLSS), pressure-tight top hatches, and service-module stage separation mechanisms. In parallel,
              developing the Storm engine requires mastering a full-flow staged-combustion cycle burning liquid oxygen
              and biomethane at extreme pressures and temperatures, necessitating novel additively manufactured
              superalloys to resist high-pressure oxygen burn environments. Any thermal protection ablation failure,
              thruster anomaly during autonomous terminal rendezvous, or hatch sealing failure during ISS berthing
              represents a catastrophic mission loss that would jeopardize institutional certification.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR009
              - CR011
              - CR012
      - number: '7.3'
        title: Launch Vehicle Dependencies, Counterparty Concentration, and Capital Allocation Caps
        blocks:
          - type: paragraph
            body: >-
              The Exploration Company's operational and commercial viability is heavily tied to external counterparties
              across launch operations, anchor procurement, and capital syndicates. While Nyx is marketed as
              launcher-agnostic to support multiple heavy rockets, near-term orbital flights depend entirely on European
              launch cadences via Arianespace's Ariane 6 and commercial US alternatives such as SpaceX Falcon 9. Launch
              manifest delays, rocket maiden-flight anomalies, or launch slot scarcity directly delay Nyx qualification
              and revenue recognition milestones. Commercially, TEC's forward business model relies heavily on anchor
              institutional service awards—such as ESA's €760 million ALADDIN LEO Cargo Return Service
              contract—alongside emerging private space station developers including Axiom Space and Vast Space.
              Slippage in private station deployment timelines or political budget renegotiations among ESA member
              states would directly impair backlog conversion. Financially, deep-tech hardware scaling demands
              substantial liquidity; while the $450 million Series C closed in September 2026 funds near-term engine and
              capsule milestones, capital intensity has already forced management to abandon near-term human crew
              capsule aspirations due to European venture funding constraints, leaving the company reliant on sustained
              institutional backing.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Launch Vehicle Monopoly and Schedule Dependency
            body: >-
              Despite Nyx's launcher-agnostic engineering, TEC remains operationally reliant on external heavy-lift
              providers Arianespace and SpaceX, leaving mission timelines vulnerable to rocket grounding or manifest
              delays outside the startup's control.
            calloutType: risk
            claimRefs:
              - CR009
          - type: callout
            title: Structural Capital Constraints Capping Human Spaceflight Scope
            body: >-
              High capital requirements and structural limitations in European venture capital depth have forced TEC to
              defer human crew vehicle development, confining commercial roadmap execution to unmanned cargo logistics.
            calloutType: risk
            claimRefs:
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track / research more, with high execution risk and no supportable public
              entry-price conclusion. A reported financing discussion above $2 billion was expressly non-final in July
              2026, while the later $450 million Series C establishes financing capacity but not a disclosed post-money
              valuation or investor return basis. The company has attracted enough capital and commitments to merit
              continued diligence, yet neither funding raised nor contract commitments should be treated as cash
              available, revenue, or margin. Entry discipline should therefore be milestone-based: require private
              access to round terms and economics, then connect price to demonstrated recovery, docking progress, and
              funded delivery obligations rather than to a generic European-space premium.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Financing and valuation context
        blocks:
          - type: paragraph
            body: >-
              The financing trajectory is credible but does not itself establish value. An independent report records a
              $450 million Series C and approximately $680 million of total funding, while company-issued LinkedIn
              material repeats those figures. Earlier coverage reported a $160 million Series B and nearly $230 million
              of total funding at that time. The July 2026 discussion of at least $300 million at more than $2 billion
              was not finalized, so it is a negotiation reference rather than a transaction mark. Public databases
              identify rounds and a similarity-based comparable set, but the retained pages do not provide usable
              valuation observations or transaction terms. Dilution, liquidation preference, seniority, anti-dilution,
              and pro-rata rights remain material private-data gaps.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV015
      - number: '8.3'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on a large capital base, a reusable capsule and engine platform, and commercial or
              institutional demand signals. Vestbee reports more than $2 billion in contracts and commitments, while
              company-issued LinkedIn material describes a EUR760 million ESA agreement covering an initial
              demonstration and two future cargo missions. An investor also describes several hundred million in
              contracts, mostly from private station providers. The anti-thesis is equally consequential: the most
              detailed adverse report says neither flight test had completed the recovery loop, and a contract headline
              does not reveal cancellation, milestone-payment, cost, margin, or cash-conversion terms. These gaps keep
              confidence below the level needed for a price recommendation.
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV009
              - CV015
              - CV016
      - number: '8.4'
        title: Scenarios and downside
        blocks:
          - type: paragraph
            body: >-
              Scenarios are framed around observable milestones rather than invented revenue multiples. The bull case
              needs successful capsule recovery, docking progress, and evidence that awarded commitments convert into
              funded, economically attractive deliveries. The base case assumes continued technical progress and
              sufficient capital but with valuation deferred until unit economics and financing preferences can be
              inspected. The bear case is a delay or failed recovery that forces additional financing before operational
              proof, increasing dilution and reducing negotiating leverage. No probability percentage, valuation range,
              target return, or exit date is supportable from the assigned public evidence; each should be populated
              only after data-room review.
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not demonstrated by the retained evidence. The company is privately held, continues to
              fund two capital-intensive development programs, and has not supplied public audited financials, cap-table
              terms, or a priced secondary transaction in the assigned sources. Before underwriting an exit, obtain the
              Series C capitalization table and preference stack; audited revenue, cash burn, backlog conversion, gross
              margin, and remaining program cost; the ESA and major commercial contracts with termination and
              milestone-payment schedules; and an independent technical review of recovery and docking readiness.
              Thesis-break triggers are a failed or materially delayed recovery milestone, commitments that do not
              convert into funded revenue, or financing terms that impair common-equity outcomes.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment gate
            body: >-
              Require successful recovery evidence, funded-contract economics, audited financials, and the Series C
              preference stack before translating the financing narrative into an entry valuation or target return.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV011
              - CV015
              - CV016
