evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited revenue, ARR if applicable, gross margin, cash balance, burn, runway, debt or credit facilities, and any
      secondary component of disclosed financing.
    whyItMatters: >-
      Funding raised is not cash available, and the capital required to reach the November 2028 mission cannot be
      assessed without operating cash flows and committed spending.
    diligencePath: >-
      Obtain audited statements, management accounts, bank and debt schedules, the financing funds-flow statement, and a
      milestone-based cash plan through November 2028.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Contract-by-contract separation of binding backlog from non-binding commitments, customer count, deposits,
      cancellation rights, revenue-recognition timing, and concentration.
    whyItMatters: >-
      The reported $2 billion combines contracts and commitments and therefore cannot be treated as revenue, ARR, or
      fully firm backlog.
    diligencePath: >-
      Review the signed contract register, customer schedules, amendments, deposit receipts, cancellation clauses, and
      accounting treatment.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive and board rosters, founder ownership, investor ownership, voting and veto rights, observer
      rights, committees, delegated authorities, and succession plans.
    whyItMatters: >-
      Publicly naming a founder and one incoming investor director does not establish control, governance independence,
      or resilience to key-person loss.
    diligencePath: >-
      Obtain the current cap table, articles, shareholders' agreement, board minutes and committee charters,
      organization chart, and CEO succession plan.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: regulatory-and-adverse-events
    missingEvidence: >-
      Direct regulator, court, insurance, licensing, incident, or enforcement records for TEC and its planned missions;
      the assigned adverse search returned no retained result URLs.
    whyItMatters: >-
      Absence of a retained adverse record is not proof that no incident, dispute, licensing constraint, or enforcement
      matter exists.
    diligencePath: >-
      Run jurisdiction-specific corporate, court, aviation and space-regulator checks and request licensing, insurance,
      anomaly, claims, and investigation registers from TEC.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A credible market study with a defined geography, service boundary, time period, mission cadence, and price
      assumptions for LEO cargo delivery and return.
    whyItMatters: >-
      Without a common denominator, disclosed commitments, contract values, payload capacity, and historical prices
      cannot be converted into TAM, SAM, or SOM.
    diligencePath: >-
      Obtain agency demand forecasts, successor-station traffic plans, and an independent bottom-up model of missions,
      kilograms, and prices by year.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-conversion
    missingEvidence: >-
      Executed contracts showing committed versus optional mission value, milestone payments, cancellation rights,
      customer concentration, and revenue-recognition schedules.
    whyItMatters: >-
      More than $2 billion of contracts and commitments cannot be treated as revenue, ARR, backlog, or cash without the
      underlying terms.
    diligencePath: >-
      Review the contract register and sample the ESA and commercial-station agreements, reconciling each amount to
      management's revenue plan.
    relatedQuestionRefs:
      - QM004
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: stale
    severity: material
    topic: historical-pricing
    missingEvidence: >-
      Current 2026 mission pricing, payload mix, utilization assumptions, launch pass-through costs, and gross-margin
      targets.
    whyItMatters: >-
      The available per-kilogram figures were reported in 2022 and are not evidence of current realized pricing or unit
      economics.
    diligencePath: >-
      Obtain current rate cards and signed mission economics, then compare contracted price per kilogram with launch,
      insurance, operations, and recovery costs.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-terms
    missingEvidence: Granular per-kilogram pricing and flight charter fee schedules for Nyx commercial flights to Axiom Station.
    whyItMatters: >-
      Exact margins and competitive pricing viability against SpaceX Dragon commercial missions cannot be audited
      without private contract terms.
    diligencePath: Review commercial launch service agreements during confirmatory diligence under NDA.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited financial statements detailing recognized revenue, gross margin, operating expenses, and cash burn.
    whyItMatters: Essential to determine true operational profitability and verify unit gross margins on space logistics flights.
    diligencePath: Request company management accounts and audited IFRS/HGB statutory financial reports under NDA.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: contract-backlog-split
    missingEvidence: Granular breakdown of the $2 billion backlog distinguishing legally binding contracts from non-binding MOUs.
    whyItMatters: Prevents overstating revenue certainty and models realistic cash receipt schedules.
    diligencePath: Review customer contract agreements, milestone payment criteria, and termination clauses.
    relatedQuestionRefs:
      - QI002
  - type: missing-source
    severity: material
    topic: capital-allocation-budget
    missingEvidence: Programmatic budget allocation separating Nyx ISS qualification from Storm engine turbomachinery R&D.
    whyItMatters: >-
      Ensures the core capsule mission is adequately funded without premature capital depletion into rocket engine
      development.
    diligencePath: Inspect board-approved capital expenditure schedules and project budget models.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: private-evidence-only
    severity: material
    topic: mission-maturity
    missingEvidence: >-
      End-to-end station approach, docking, cargo transfer, undocking, full-scale water recovery, refurbishment, and
      repeated reuse results.
    whyItMatters: >-
      These operations determine whether Nyx is a working transport service rather than a collection of tested
      subsystems and design targets.
    diligencePath: >-
      Obtain mission test reports, anomaly logs, qualification status, recovery data, refurbishment work scopes, and
      independent customer acceptance evidence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: assurance
    missingEvidence: >-
      Independent certification status, cybersecurity architecture, mission-data controls, reliability targets, incident
      history, and supplier quality metrics.
    whyItMatters: >-
      Company-issued process descriptions do not establish that flight, software, security, and supply-chain controls
      operate effectively.
    diligencePath: >-
      Review certification plans and findings, software assurance artifacts, security threat models, reliability
      budgets, incident records, and supplier audit results.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public repository, package, release, contributor, or practitioner-community activity for the flight-software
      stack.
    whyItMatters: >-
      Recruiting disclosures show desired practices but provide no external evidence of code maturity, release cadence,
      or developer adoption.
    diligencePath: >-
      Request private repository activity, release records, defect trends, test coverage, build provenance, and
      independent software-review findings.
    relatedQuestionRefs:
      - QE003
  - type: private-evidence-only
    severity: material
    topic: contract-cancellation-terms
    missingEvidence: >-
      Granular contract terms detailing cancellation rights, customer milestone refundability, and schedule penalty
      clauses for Axiom Space and ESA.
    whyItMatters: >-
      Determines whether the multi-hundred-million-dollar commercial backlog provides enforceable cash protection if
      orbital vehicle development encounters delays.
    diligencePath: >-
      Review customer service contracts and commercial master service agreements under NDA during confirmatory
      diligence.
    relatedQuestionRefs:
      - QU002
      - QU005
    relatedTableRefs:
      - TU002
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-nrr
    missingEvidence: >-
      Audited retention data, customer cohort expansion metrics, and verified repeat booking conversion rates for
      commercial payload offtakers.
    whyItMatters: >-
      Essential to evaluate recurring revenue durability and commercial lifetime value once space station logistics
      missions become operational.
    diligencePath: Obtain customer account pipeline data and signed follow-on mission option logs from company sales management.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: missing-source
    severity: minor
    topic: commercial-pricing-schedule
    missingEvidence: >-
      Official published commercial pricing schedule per kilogram of pressurized and unpressurized orbital return cargo
      across operational Nyx flights.
    whyItMatters: >-
      Enables precise unit margin benchmarking against competing commercial providers like SpaceX Dragon and Northrop
      Grumman Cygnus.
    diligencePath: Request standard customer commercial rate cards and payload user guide pricing annexes.
    relatedQuestionRefs:
      - QU001
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: iss-safety-milestones
    missingEvidence: >-
      Formal Phase 1 and Phase 2 safety review board hazard reports and safety compliance matrices from NASA and ESA ISS
      safety review panels.
    whyItMatters: >-
      Without documented safety panel hazard approvals, the feasibility of meeting the targeted November 2028 ISS
      docking milestone cannot be verified.
    diligencePath: Request executive summaries of ESA ALADDIN and NASA Visiting Vehicle safety milestone phase reviews.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: storm-test-data
    missingEvidence: >-
      Full-scale hot-fire test telemetry and combustion stability margins for the Storm full-flow staged-combustion
      oxygen-methane engine.
    whyItMatters: >-
      Full-flow staged combustion is notoriously difficult to stabilize; failure to achieve stable combustion would
      require fundamental engine redesign and delay heavy launcher availability.
    diligencePath: Obtain test cell hot-fire logs and pre-burner pressure trace records from TEC propulsion testing facilities.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR002
  - type: conflicting-data
    severity: minor
    topic: launch-slot-bindingness
    missingEvidence: >-
      Firm launch service agreement contracts and payment schedules with Arianespace confirming guaranteed Ariane 6
      launch window reservations.
    whyItMatters: >-
      Ariane 6 launch manifest pressure from European institutional missions and Kuiper constellation launches may
      displace commercial demonstration slots.
    diligencePath: Review launch services agreement schedule and delay liquidated damages terms with Arianespace.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Series C capitalization table, post-money valuation, liquidation preferences, seniority, anti-dilution provisions,
      and pro-rata rights.
    whyItMatters: These terms determine effective entry price, dilution, and common-equity outcomes.
    diligencePath: Obtain executed financing documents and a fully diluted capitalization table from company counsel.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: exit-readiness
    missingEvidence: A credible exit route, timing, transaction precedent, and realizable return bridge tied to company economics.
    whyItMatters: Without an exit benchmark and cash-flow basis, target return and hold period cannot be underwritten.
    diligencePath: Review board materials, banker analyses, secondary bids, strategic-buyer discussions, and audited forecasts.
    relatedQuestionRefs:
      - QV010
