callouts:
  - calloutType: "insight"
    title: "The Multi-Homing Strategic Imperative for Private Space Stations"
    body: "Commercial space station builders such as Axiom Space cannot afford single-source logistics reliance on SpaceX, which also develops competing orbital transportation infrastructure. Developing relationships with independent, launch-agnostic European logistics operators like The Exploration Company is a strategic hedge against transport bottlenecks and unilateral pricing pressure."
    claimRefs:
      - "CP002"
      - "CP010"
  - calloutType: "risk"
    title: "Launcher Coupling Bottleneck in Early Operational Phases"
    body: "Until The Exploration Company's high-thrust Storm engine qualifies and pairs with a future European heavy-lift rocket, Nyx remains vulnerable to launcher scheduling and manifest delays across Ariane 6 and third-party launchers such as SpaceX Falcon 9, creating an operational dependency on potential competitors."
    claimRefs:
      - "CP007"
      - "CP013"
