company:
  name: The Exploration Company
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    The product thesis is a vertically integrated space-transport stack led by Nyx, a reusable
    cargo capsule intended to launch, dock, return cargo, and be refurbished. Public evidence
    shows meaningful subsystem and recovery-test progress, but full docking, payload return,
    refurbishment, and repeated reuse remain unproved.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      The near-term customer product is Nyx: a capsule that The Exploration Company says can
      launch on a heavy launcher, dock with a low-Earth-orbit station, deliver and collect cargo,
      re-enter, splash down, and be refurbished for another mission. The company claims return
      capacity of up to 3,000 kg and reuse for up to ten missions, but those are design targets,
      not operating results. The wider portfolio adds Storm, a reusable high-thrust engine, and
      future crew vehicles. This breadth could reduce dependence on outside propulsion and
      vehicle suppliers, yet it also increases qualification scope before the core cargo service
      has completed an end-to-end mission.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE013]
    tableRefs: [TE001, TE002]
  - id: architecture-and-engineering-system
    title: Architecture and engineering system
    body: >-
      Public materials identify an integrated hardware-software architecture rather than a
      commodity capsule shell. Nyx combines orbital propulsion, docking avionics, flight
      software and guidance-navigation-control, a carbon-based low-density thermal-protection
      system, and a parachute recovery chain. Recruiting materials add evidence of modern C++
      and Python, real-time or embedded flight software, requirements traceability, integrated
      mission testing, certification documentation, product-lifecycle management, bills of
      materials, and interface-control documents. These disclosures show the intended
      engineering process and control surfaces; they do not establish production readiness,
      flight reliability, cybersecurity posture, or successful certification.
    claimRefs: [CE010, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-reliability
    title: Maturity, deployment, and reliability
    body: >-
      Maturity is mixed. The company reported a 2026 drop test in which drogue parachutes
      stabilized the dedicated test vehicle, handed over to the main parachutes, and supported a
      controlled descent and recovery. The test vehicle intentionally replicated relevant mass
      properties, aerodynamic profile, and interfaces rather than the full spacecraft, and the
      land test did not reproduce the planned water splashdown. Independent analysis reports
      that the earlier Mission Possible demonstrator completed controlled orbital re-entry but
      failed during recovery, so customer payload return was not achieved. Red River West also
      reports two test flights, in 2024 and 2025. Together, these facts support genuine
      development progress while leaving docking, undocking, full-scale recovery, turnaround,
      and reuse outside the demonstrated envelope.
    claimRefs: [CE006, CE007, CE008, CE009, CE014, CE016]
  - id: assurance-and-diligence-verdict
    title: Assurance and diligence verdict
    body: >-
      The public control framework is strongest around aerospace safety and verification.
      Company-issued recruiting materials call for verification and validation, independent
      verification and validation, traceability from system requirements to tests, NASA safety
      review documentation, qualification, certification, anomaly resolution, and flight
      readiness. A company LinkedIn update further says environmental-control and life-support
      components were tested individually and then integrated with the structural test module
      and thermal-control system. These are useful process signals, but the pool contains no
      independent audit, security architecture, privacy policy for mission data, completed
      certification record, quantified reliability target, or service-level support evidence.
      The underwriting view is therefore positive on engineering specificity but conditional on
      an end-to-end demonstration and access to qualification, incident, supplier, and
      refurbishment evidence.
    claimRefs: [CE010, CE011, CE015, CE016]
