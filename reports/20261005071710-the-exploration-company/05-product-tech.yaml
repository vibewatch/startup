callouts:
  - calloutType: strength
    title: Recovery testing targets a known failure mode
    body: >-
      The dedicated drop test exercised the drogue-to-main handover and controlled recovery,
      directly addressing the recovery chain that independent analysis says failed on Mission
      Possible.
    claimRefs: [CE006, CE007, CE009]
  - calloutType: risk
    title: Architecture breadth exceeds demonstrated operations
    body: >-
      Public disclosures span cargo, crew, propulsion, software certification, and refurbishment,
      while retained evidence does not show a completed station mission or repeated reuse.
    claimRefs: [CE001, CE011, CE013, CE016]
