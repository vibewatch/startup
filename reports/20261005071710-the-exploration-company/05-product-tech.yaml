    columns: [Layer or process, Role, Retained evidence, Dependency, Principal risk]
    rows:
      - [Mission and docking software, "Guidance, navigation, control, and station interface", "C++/Python, requirements tracing, V&V, and NASA review documentation in recruiting materials", "Certified flight software and integrated test environment", "Public process description is not proof of flight reliability"]
      - [Vehicle structure and configuration, "Mechanical architecture, interfaces, and qualified hardware", "CAD, FEA, PLM, bills of materials, and interface-control workflows in recruiting materials", "Supplier acceptance and environmental qualification", "No retained completed-qualification package"]
      - [Thermal protection and re-entry, "Protect capsule and payload during atmospheric return", "Company identifies a carbon-based low-density thermal-protection system", "Flight loads, materials performance, and inspection regime", "Refurbishment burden and repeatability are unknown"]
      - [Recovery and refurbishment, "Transition from drogue to main parachutes, recover vehicle, and prepare reuse", "Dedicated drop test achieved controlled descent and recovery", "Full-scale water recovery and post-flight inspection", "Prior demonstrator recovery failed; reuse has not been shown"]
    notes: "Architecture is reconstructed from company product pages and recruiting disclosures; unavailable qualification artifacts remain explicit risks."
    claimRefs: [CE006, CE007, CE009, CE010, CE012, CE016]
