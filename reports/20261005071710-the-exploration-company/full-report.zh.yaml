      - number: '4.3'
        title: 资本充足性、双项目分配与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月，The Exploration Company 完成 $450m（€387m）C 轮融资，由 Bessemer Venture Partners、Atomico 和 EQT 管理的
              Scaleup Europe Fund 共同领投，使累计已披露股权融资达到约 $680m。虽然这轮融资扩大了跨大西洋股东基础并提供了大量资本，但公司没有公布即时 Nyx 货运舱飞行计划与资本密集型 Storm
              全流量分级燃烧火箭发动机项目之间的正式美元金额分配。公司在法国、德国和意大利的工业基地同时开发高推力甲烷-氧涡轮机械、缩比推力室和主力测试台，并推进航天器轨道认证，造成并行现金消耗。管理层披露承认，部署轨道发射器和专用发射台所需资金超过
              C 轮融资范围，说明公司在达到自我维持的运营现金流前仍依赖外部股权融资或主权机构共同出资。
