        title: 资本、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              TEC 于 2026 年 9 月 8 日宣布完成 $450m C 轮融资，由 Bessemer Venture Partners、Atomico 以及 EQT 管理的 Scaleup Europe Fund
              共同领投。公司称本轮融资使已获得的累计资金达到约 $680m；这是累计融资额，不代表可用现金或现金跑道。Dealroom 另行显示 2026 年估值区间为 $1b 至 $2.5b，但这不是精确的 C
              轮后估值。商业规模还通过公司自报的运营指标体现：合同和承诺金额超过 $2b，已预订 10 次 Nyx 任务。两项指标都没有被表述为已确认收入，留存证据也未披露承诺构成、取消权、押金或客户集中度。TEC
              报告员工超过 550 人，但不同平台采用的统计口径不同，不应直接比较。
