  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              核心市场是把货物从地球运往近地轨道空间站并带回，而不是完整的发射、卫星、旅游或下游空间服务经济。The Exploration Company 将 Nyx 描述为空间站服务用可重复使用货运舱，并将高推力发动机
              Storm 作为更大运输体系中的独立一层。月球货运、载人运输、卫星服务和发射推进属于相邻市场，不是近期可辩护的 Nyx 货运市场。现状是继续依赖非欧洲运输供应商和国际空间站物流体系；ESA Space Rider
              及其他新兴飞行器是潜在替代方案。这个边界很重要：空间站货运采购有明确任务、载荷和锚定买家，而笼统的“太空经济”标签会把无关的支出池混在一起。
            claimRefs:
              - CM001
              - CM002
              - CM010
              - CM011
