              - CR012
      - number: '7.3'
        title: 发射器依赖、交易对手集中度与资本配置上限
        blocks:
          - type: paragraph
            body: >-
              The Exploration Company 的运营和商业可行性高度依赖发射运营、锚定采购和资本联盟中的外部交易对手。虽然 Nyx 被宣传为与发射器无关、可支持多种重型火箭，但近期轨道飞行完全依赖
              Arianespace Ariane 6 的欧洲发射频率和 SpaceX Falcon 9 等美国商业替代方案。发射清单延误、火箭首飞异常或发射窗口稀缺，会直接推迟 Nyx 认证和收入确认里程碑。商业上，TEC
              的前期业务模式高度依赖机构锚定服务奖项，例如 ESA 价值 €760m 的 ALADDIN 低地球轨道货物返回服务合同，以及 Axiom Space、Vast Space
              等新兴私人空间站开发商。私人空间站部署时间表延误或 ESA 成员国之间的政治预算重谈，将直接损害积压订单转化。财务上，深科技硬件扩张需要大量流动性；虽然 2026 年 9 月完成的 $450m C
              轮融资支持近期发动机和货运舱里程碑，但资本密集度已迫使管理层因欧洲风险投资资金限制而放弃近期载人货运舱计划，公司因此依赖持续的机构支持。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 发射器垄断与进度依赖
            body: 尽管 Nyx 的工程设计与发射器无关，TEC 在运营上仍依赖 Arianespace 和 SpaceX 等外部重型运载供应商，因此任务时间表容易受到创业公司无法控制的火箭停飞或飞行清单延误影响。
            calloutType: risk
            claimRefs:
              - CR009
          - type: callout
            title: 结构性资本约束限制载人航天范围
            body: 高额资本需求以及欧洲风险投资深度的结构性限制，迫使 TEC 推迟载人飞行器开发，使商业路线图执行局限于无人货运物流。
            calloutType: risk
            claimRefs:
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为跟踪 / 继续研究，执行风险高，且没有足以支持公开入场价格结论的证据。2026 年 7 月一项超过 $2b 的融资讨论被明确称为尚未最终确定，而后续 $450m C
              轮证明了融资能力，却没有披露投后估值或投资者回报基础。公司吸引的资本和承诺足以支持继续尽调，但融资额和合同承诺都不应被视为可用现金、收入或利润率。因此，入场纪律应以里程碑为基础：要求私下取得本轮条款和经济条件，再将价格与已展示的回收、对接进展及有资金支持的交付义务挂钩，而不是套用泛化的欧洲航天溢价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              融资轨迹可信，但本身不能证明价值。独立报告记录了 4.5 亿美元 C 轮融资和约 6.8 亿美元累计融资，公司发布的 LinkedIn 材料也重复了这些数字。更早报道显示，公司当时完成 1.6 亿美元 B
              轮融资，累计融资接近 2.3 亿美元。2026 年 7 月至少 3 亿美元、估值超过 20
              亿美元的讨论并未最终确定，因此只是谈判参考，而非交易定价。公开数据库识别出融资轮次和基于相似度的可比公司集合，但留存页面没有提供可用的估值观察或交易条款。稀释、清算优先权、优先级、反稀释和按比例认购权仍是重要的私有数据缺口。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV009
              - CV015
      - number: '8.3'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在庞大资本基础、可重复使用的货运舱和发动机平台，以及商业和机构需求信号之上。Vestbee 报告合同和承诺超过 $2b，公司发布的 LinkedIn 材料称与 ESA 达成 EUR 七亿六千万
              协议，覆盖一次初始演示和两次未来货运任务。一名投资者还称，公司拥有数亿欧元合同，主要来自私人空间站供应商。反论点同样重要：最详细的不利报告称两次飞行测试都没有完成回收闭环，而合同标题没有披露取消、里程碑付款、成本、利润率或现金转化条款。这些缺口使信心仍低于提出价格建议所需水平。
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV009
              - CV015
              - CV016
      - number: '8.4'
        title: 情景与下行风险
        blocks:
          - type: paragraph
            body: >-
              情景以可观察里程碑为轴，而不是虚构收入倍数。乐观情景需要货运舱成功回收、对接取得进展，并证明已授予承诺能够转化为有资金支持且经济性有吸引力的交付。基准情景假设技术持续进步并拥有足够资本，但在单位经济和融资优先权可被检查前推迟估值。悲观情景是延误或回收失败，迫使公司在运营证明前追加融资，从而增加稀释并削弱谈判能力。根据指定公开证据，无法支持任何概率百分比、估值区间、目标回报或退出日期；只有完成数据室审阅后才能填入。
            claimRefs:
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              留存证据没有证明退出准备度。公司是私营企业，仍在为两个资本密集型开发项目提供资金，也没有在指定来源中提供公开审计财务报表、股权表条款或有定价的二级交易。在进行退出投资判断前，应取得 C
              轮资本化表和优先股堆叠；经审计的收入、现金消耗、积压转化、毛利率和剩余项目成本；ESA
              及主要商业合同的终止和里程碑付款计划；以及关于回收和对接准备度的独立技术审查。论点破坏触发因素包括回收里程碑失败或严重延误、承诺未能转化为有资金支持的收入，或损害普通股权益结果的融资条款。
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.6'
        title: 展示项
        blocks:
          - type: callout
            title: 投资门槛
            body: 在把融资叙事转化为入场估值或目标回报前，要求取得成功的回收证据、有资金支持的合同经济性、经审计财务报表以及 C 轮优先股堆叠。
            calloutType: recommendation
            claimRefs:
              - CV006
