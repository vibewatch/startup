        blocks:
          - type: paragraph
            body: >-
              从投资判断角度看，The Exploration Company
              展现了前所未有的欧洲主权融资能力和规模可观的商业预订，但进行贴现现金流或回报建模所需的基础财务数据仍属私有且未经验证。历史融资里程碑和知名投资者联盟证明了机构信誉；但预订和融资承诺验证的是未来市场兴趣，而不是飞行表现或已确认现金流。在本十年末国际空间站按计划退役前，对接窗口不断收窄，进度延误将带来严重财务后果。除非公司正式披露经审计的收入确认政策、确定性合同取消罚则、经常性载荷翻修成本以及分项目现金消耗速度，尽调人员无法确认现金跑道长度或毛利率可行性。
