          value: -42
        - label: 飞船制造摊销
          value: -20
        - label: 隔热罩翻新与 AIT
          value: -12
        - label: 任务运营与回收物流
          value: -8
        - label: 估计任务贡献利润
          value: 18
    approximationNotes: 以合同总价值（100）为基准的示意性百分比分解，依据行业成本结构驱动因素和外部发射依赖。
