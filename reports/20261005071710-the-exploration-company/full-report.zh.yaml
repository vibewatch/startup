      - number: '4.2'
        title: 单位经济、成本结构驱动因素与制造边界
        blocks:
          - type: paragraph
            body: >-
              评估欧洲轨道物流的单位经济，需要将原型开发支出与运营飞行周期成本分开。The Exploration Company 在早期飞行测试中展现了资本效率：Mission Bikini 缩比演示器在九个月内支出不到
              €2 million，轨道 Mission Possible 测试飞行器在三年内支出 €25
              million。然而，运营单位利润仍不透明，因为航天器运营的标准成本构成——包括发射器采购、碳基隔热层翻修、推进剂装载和回收作业——均未公开。公司将 Nyx 设计为与发射器无关，可搭载 SpaceX Falcon
              9 或 Arianespace Ariane 6 等商业火箭，这让初期运营免受发射器开发风险影响，但也使每次任务的毛利容易受到第三方发射价格和发射窗口可用性的影响。
