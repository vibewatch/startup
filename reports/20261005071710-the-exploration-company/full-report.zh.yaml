companyProfile:
  summary: >-
    The Exploration Company 是一家私营欧洲航天运输开发商，成立于 2021 年，业务围绕可重复使用的 Nyx 货运舱和 Storm
    推进项目展开。公司将自身定位为与发射器无关的轨道物流平台；公开证据显示其运营范围覆盖德国和法国，客户主要是航天机构及商业空间站运营商。
  headquarters: Gauting / Planegg, Bavaria, Germany
