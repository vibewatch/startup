      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              机构航天部门是最明确的预算所有者，因为它们可以通过有资金支持的项目采购演示任务、空间站货运服务和微重力载荷。商业空间站运营商是第二类付款方：投资者报告将私人空间站供应商列为合同的重要来源，而 Atomico
              称需求大致由公共和私人客户平分。研究机构和工业实验赞助商是用户及载荷买家，但不一定是任务层面的付款方。历史销售路径从预订和意向书开始，之后再签署发射合同。因此，相比不加区分的客户数量，已签署任务合同、里程碑付款、取消权和空间站准备状态更有决策价值。载人和月球用户会扩大长期买家范围，但仍不属于已有证据支持的近期可服务货运市场。
            claimRefs:
              - CM004
              - CM005
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
