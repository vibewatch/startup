      - number: '1.3'
        title: 领导层、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Hélène Huby 具备罕见的创始人与市场直接匹配度：Atomico 和 TechCrunch 介绍她在 Airbus 和 ArianeGroup 累计工作约二十年，期间负责 NASA
              Orion 飞船的欧洲服务舱。治理披露远少于运营披露。C 轮公告称 Bessemer 合伙人 Alex Ferrara
              将加入董事会，但完整董事名单、观察员权利、投票控制、创始人持股和继任计划在留存证据中均未公开。因此，Huby
              在融资、产品方向和对外定位中的核心角色构成重大关键人物尽调问题，但并不能证明继任安排不足。执行计划同样艰巨：TechCrunch 称时间表紧张，并报道建设发射台和火箭本身还需要额外融资。2028 年 11 月的
              ISS 任务仍是目标，并非已完成的能力或已签约收入事件。
