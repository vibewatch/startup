      - number: '2.4'
        title: 增长驱动、采用约束与时点
        blocks:
          - type: paragraph
            body: >-
              最强的需求驱动来自结构性转变：ISS 预计在本十年末退役，后继空间站预计将商业化，欧洲希望拥有有保障的运输和返回能力。Nyx
              计划具备发射器独立性、可重复使用能力和在轨加注能力，可能减少买方锁定并扩大任务灵活性。但采用仍取决于执行，而不是市场叙事。再入、回收、空间站对接、安全审批、发射可用性和资本都是卡点。2025 年 Mission
              Possible 演示器曾在轨运行并再入大气层，但在预计溅落前失去通信，使回收验证尚未完成。4.5 亿美元 C 轮融资同时支持 Nyx 和
              Storm，说明扩大供给需要大量资本。因此，任务时间表以及承诺转化为收入的能力仍是估值的关键敏感因素。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 需求证据强于市场规模证据
            body: 已预订任务和已披露协议提供了具体的采购信号，但已分配来源中没有任何一个提供完整的市场分母或合同层面的收入计划。估值工作应建模任务转化，而不是套用泛化的太空经济倍数。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM015
          - type: callout
            title: 空间站与飞行器时间表相互耦合
            body: 商业机会取决于后继空间站投入运营，同时 Nyx 逐项通过对接、再入、回收、安全和发射里程碑。任一侧延误都可能推迟需求，即使客户兴趣真实存在。
            calloutType: risk
            claimRefs:
