  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 回收和对接取得进展；承诺转化为有资金支持的交付。
        - 只有在私人经济性得到支持后，才可考虑相对报道中的 >$2B 讨论给予溢价。
        - 进度、认证和成本增长。
        - 回收成功，加上独立验证的合同转化。
      - - 基准
        - 技术进展持续，当前资本足以支持下一项重大里程碑。
        - 暂缓判断公允价值；使用里程碑分期和下行保护，而不是公开市场倍数。
        - 融资跑道和优先权悬置仍未知。
        - 任务里程碑按期完成，并披露融资跑道。
      - - 悲观
        - 回收或对接延期，在运营证明前需要再次融资。
        - 以低于此前条款的价格投资，或推迟投资；公开信息无法支持下行底价。
        - 稀释、下轮融资条款和承诺取消。
        - 错过回收里程碑，或加速出现融资需求。
    notes: 这些情景是有条件的分析框架，不是预测；由于公开输入不足，未提出概率、精确估值区间或目标回报。
