  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 投资逻辑
        - 资本支持持续开发。
        - 据报道，C 轮融资 $450M，累计融资约 $680M。
        - 有量化的项目预算和融资跑道后，资本与交付之间的联系会更有说服力。
      - - 投资逻辑
        - 需求信号不止来自单一买方。
        - 来源描述了 ESA 和私人空间站运营商的承诺。
        - 已签署且有资金支持的任务订单、付款计划和利润率会增强信心。
      - - 反向逻辑
        - 运营证明尚未跑通可复用飞行闭环。
        - 反向报告称两次测试尚未完成计划中的回收。
        - 回收成功的任务再取得对接进展，将降低技术风险。
      - - 反向逻辑
        - 公开估值支持薄弱。
        - 报道中的 >$2B 谈判尚未敲定，公开数据页面也没有可用交易条款。
        - 签署版股权结构表、优先股堆叠和独立老股交易估值将允许进行价格分析。
    notes: 合同金额是据报道的承诺，不是已确认收入；证据没有披露利润率、取消权或有资金支持的积压订单。
