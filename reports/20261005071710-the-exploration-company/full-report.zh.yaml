  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管审批、国际空间条约与多司法辖区合规
        blocks:
          - type: paragraph
            body: >-
              轨道航天器投入运营，使 The Exploration Company 面临欧洲和美国多层级的监管与法定监督。满足欧洲航天局严格的碎片减缓政策，要求航天器大气再入的最大伤亡风险阈值不超过万分之一，因此必须对
              Nyx 的碳基隔热罩和受控寿命终止处置系统进行详尽认证。同时，前往国际空间站的物流飞行必须通过 NASA 和 ESA 联合 ISS 安全审查小组，才能获准开展接近、交会和轨道节点对接。除轨道安全外，TEC
              还在德国、法国、意大利、卢森堡、美国（休斯敦）和阿联酋分布运营工程、测试与管理设施。             
              这一多司法辖区运营范围触发了严格合规要求，包括欧洲两用物项出口法规、法国空间运营法许可、德国对外贸易法规，以及管辖航天工程数据传输和跨大西洋防务组件的美国国际武器贸易条例（ITAR）和出口管理条例（EAR）。此外，同时运营于欧洲和美国防务生态，还要求设置严格的公司治理防火墙，在与
              NASA 保持合作协议的同时保护欧洲主权知识产权。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 工程执行、子系统认证与缩比演示取舍
        blocks:
          - type: paragraph
            body: >-
              轨道硬件成熟涉及航天器热管理、推进、航电和对接机构等方面严重的物理失效模式。在 Bikini 和 Mission Possible 等早期原型飞行中，TEC
              有意接受较高开发风险以加快任务周期：省略降落伞空投测试，在定制飞行计算机中部署商用现成（COTS）组件，并只在缩比部件层级测试推进器，而不是进行全栈集成认证。从缩比原型转向全尺寸 Nyx
              地球运营货运舱，会在环境控制和生命保障系统（ECLSS）、气密顶舱门和服务舱级间分离机构方面引入复杂工程挑战。同时，Storm
              发动机需要掌握以液氧和生物甲烷为燃料、在极端压力和温度下运行的全流量分级燃烧循环，并需要新型增材制造高温合金来抵抗高压氧燃烧环境。任何隔热层烧蚀失败、自主末端交会期间的推进器异常，或 ISS
              停靠期间的舱门密封失败，都可能造成灾难性任务损失并危及机构认证。
            claimRefs:
