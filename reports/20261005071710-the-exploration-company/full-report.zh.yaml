        title: 客户群细分、买家画像与变现模式
        blocks:
          - type: paragraph
            body: >-
              The Exploration Company
              的商业牵引力覆盖两类核心客户：寻求欧洲自主轨道进入能力的主权公共航天机构，以及为国际空间站退役后的近地轨道运营做准备的私人商业空间站运营商。在机构采购中，欧洲航天局等公共航天组织是锚定客户，通过竞争性开发合同和技术验证协议授予项目，例如低地球轨道货物返回服务竞标。在商业领域，Axiom
              Space、Starlab Space 和 Vast
              等私人轨道空间站开发商会签约购买加压货物运输，以服务计划中的商业轨道栖息地。公司采用多层定价模式：早期缩比技术演示器以较低价格提供亚轨道或微重力载荷能力，而全尺寸轨道任务则按任务或按载荷公斤定价。关键在于，目录价格和实际单位收入在公开文件中仍未验证，采购依赖定制化、里程碑驱动的发射和服务协议。
