  - id: FE001
    title: Nyx 产品架构与保障体系
    type: stack
    summary: 六个相互衔接的层级展示了目标任务服务依赖哪些尚未验证的集成和保障环节。
    data:
      layers:
        - label: 客户任务
          modules:
            - label: 货物配送与取回
              detail: 空间站运营商和机构是目标买方。
          outputs:
            - label: Returned payload
              detail: Up to 3,000 kg is a company target, not a demonstrated result.
        - label: 空间站接口
          modules:
            - label: 对接航电
            - label: 飞行软件与 GNC
          outputs:
            - label: Autonomous rendezvous and docking
              detail: No completed docking is evidenced in the retained pool.
        - label: 飞船系统
          modules:
            - label: 结构与机构
            - label: 环境控制与生命保障
          outputs:
            - label: Integrated flight vehicle
              detail: Qualification and flight readiness remain in progress.
        - label: 推进与发射
          modules:
            - label: 可复用轨道推进器
            - label: 重型发射器接口
          outputs:
            - label: Orbit insertion and maneuvering
        - label: 再入与回收
          modules:
            - label: 热防护
            - label: 减速伞与主伞
          outputs:
            - label: Controlled descent and splashdown
              detail: Drop-test progress does not equal full-scale water recovery.
        - label: 保障与复用
          modules:
            - label: V&V 与需求可追溯性
            - label: 检查与翻新
          outputs:
            - label: Repeat mission readiness
              detail: Ten missions is a design claim without repeated-use evidence.
    approximationNotes: 层级顺序是对已披露组件的分析性呈现，不代表公司发布的系统设计或认证基线。
