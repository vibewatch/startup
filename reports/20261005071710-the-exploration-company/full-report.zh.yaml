  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 轨道物流格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              商业近地轨道（LEO）运输和补给生态长期集中在高度补贴的政府项目及美国商业货运供应商周围。主要直接竞争者和现役运营基准是 SpaceX 的 Dragon 飞行器；它凭借 NASA
              商业补给服务合同积累了主导性的飞行履历，另有 Boeing 的 Starliner 舱项目。商业空间站供应链中的新兴同业包括 Sierra Space，其正在开发 Dream Chaser
              翼式航天飞机，为微重力研究货物提供更温和的跑道着陆；Axiom Space 则运营私人轨道任务，并开发需要多元物流伙伴的商业空间站舱段。除美国现有企业外，ESA Space Rider
              等欧洲项目构成部分机构替代方案，ArianeGroup 和 Airbus Defence & Space 既是传统工业现有企业，也是潜在战略伙伴。TEC 将 Nyx
              定位为模块化、与飞行器无关的欧洲平台，旨在打破对美国供应商的单一来源依赖，同时压低传统成本结构。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
