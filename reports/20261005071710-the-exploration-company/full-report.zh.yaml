      - number: '3.2'
        title: 竞争者画像、能力与战略路径
        blocks:
          - type: paragraph
            body: >-
              评估轨道物流供应商，需要考察发射器耦合、载荷能力、再入能力和资本规模。SpaceX 通过将 Dragon 与 Falcon 9、Falcon Heavy
              发射器垂直整合，拥有无可匹敌的运营频率和成本优势，形成轨道频率、发射成本吸收能力和 NASA 合同方面的现有企业壁垒。Boeing Starliner
              是高资本投入的传统防务主承包商架构，主要聚焦载人运输；其高昂开发支出和进度延误暴露了传统采购模式的脆弱性。Sierra Space 通过 Dream Chaser
              提供差异化的跑道回收，面向对着陆环境更敏感的微重力科学和药物载荷。相比之下，The Exploration Company 让 Nyx 专注于模块化加压和非加压轨道货运，并开放兼容不同发射器，从而可在
              Ariane 6、Falcon 9 和未来重型运载系统上运行；同时公司开发甲烷-液氧 Storm 发动机，以建立更长期的自主发射与物流整合能力。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: 转换成本、渠道权力与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              太空物流护城河的持久性取决于任务履历、对接认证、机构采购要求和发射器获取能力。SpaceX 等现有供应商凭借成熟的发射排期、经过飞行验证的隔热系统和长期 NASA 飞行清单，拥有强大的分销能力。Axiom
              Space 这类商业空间站运营商必须在多家货运供应商之间多栖，以降低单一供应商发射停飞和地缘政治瓶颈的风险。TEC 的结构性护城河建立在欧洲机构对自主轨道能力的需求之上，并由 ESA 价值 760m 欧元的
              LCRS ALADDIN 奖项和锚定任务承诺予以确立。然而，TEC 也面临关键竞争脆弱性：在没有自有现役发射器的情况下，Nyx 初期依赖 SpaceX Falcon 9 和 Arianespace Ariane
              6 等第三方发射器，因此在 180 吨推力 Storm 发动机项目成熟前，交付频率和定价部分受外部发射器飞行清单影响。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 私人空间站的多栖战略必需性
            body: >-
              Axiom Space 等商业空间站建设者无法承受对 SpaceX 的单一来源物流依赖，因为 SpaceX 同时也在开发竞争性的轨道运输基础设施。与 The Exploration Company
              这类独立、与发射器无关的欧洲物流运营商建立关系，是对冲运输瓶颈和单方面定价压力的战略手段。
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
          - type: callout
            title: 早期运营阶段的发射器耦合瓶颈
            body: >-
              在 The Exploration Company 的高推力 Storm 发动机完成认证并与未来欧洲重型运载火箭配套前，Nyx 仍容易受到 Ariane 6 及 SpaceX Falcon 9
              等第三方发射器排期和飞行清单延误的影响，从而对潜在竞争者形成运营依赖。
            calloutType: risk
            claimRefs:
              - CP007
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 商业收入模式、定价机制与积压订单构成
        blocks:
          - type: paragraph
            body: >-
              The Exploration Company 将商业方案设计为一体化空间物流和制造商，目标客户是公共航天机构及新兴商业轨道目的地。前期变现主要依靠通过可重复使用的 Nyx
              飞船向近地轨道空间站运送和带回加压货物，并辅以长期月球运输服务和载荷数据基础设施。公司虽宣布拥有超过 20
              亿美元的公共和私人商业客户合同与承诺，但这一汇总数字同时包含确定性服务合同、机构前期研究奖项以及非约束性的商业空间站谅解备忘录，且未披露已确认会计收入或合同取消条款。在欧洲机构及国际采购中，加压载荷的每公斤目录价格没有公开，公司主要通过协商式、以里程碑为基础的发射和任务协议运营，例如欧洲航天局低地球轨道货物返回服务竞标。
            claimRefs:
              - CI001
