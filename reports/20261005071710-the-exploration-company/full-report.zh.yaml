chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              The Exploration Company（TEC）由 Hélène Huby 和一批航天老兵于 2021 年创立。公开地点记录接近但并不一致：Dealroom 将德国 Planegg 列为总部，而公司控制的
              LinkedIn 主页标注地点为巴伐利亚 Gauting，并列出法国、意大利、美国、阿联酋和卢森堡的办公地点。TEC 描述的是一套围绕 Nyx 打造的全栈航天运输平台：Nyx
              是可重复使用、与发射器无关的货运舱，计划把货物运往轨道空间站并带回地球；Storm
              则是面向未来重型运载火箭的可重复使用高推力发动机。这是一种资本密集型制造和任务服务模式，并非已披露的软件式经常性收入模式；现有留存来源没有报告 ARR 或会计口径收入。
            claimRefs:
              - CO001
              - CO002
              - CO003
