  - id: FU001
    title: 客户采用生命周期与扩张面
    type: journey-map
    summary: 可视化地图勾勒客户旅程：从最初的预订意向书，推进至运营中的经常性补给任务。
    data:
      items:
        - label: 参与阶段 1：预订与意向书
          detail: 商业空间站和研究机构通过网站或双边讨论提交不具约束力的载荷预订，以确定定制化容量需求。
        - label: 参与阶段 2：技术里程碑与研究授予
          detail: 机构客户（ESA、NASA）授予研究资助、技术验证协议和分阶段开发竞赛。
        - label: 参与阶段 3：缩比飞行演示
          detail: 客户载荷和内部仪器搭载缩比演示器飞行（Ariane 6 上的 Bikini、轨道发射器上的 Possible），以证明再入存活能力。
        - label: 参与阶段 4：正式发射服务合同
          detail: 签署具有约束力的发射服务协议，付款里程碑与全尺寸 Nyx Earth 飞船集成挂钩。
        - label: 参与阶段 5：运营中的 LEO 补给
          detail: 目标是在 2028 年向国际空间站和商业轨道空间站进行运营性货运对接，交付加压载荷。
        - label: 参与阶段 6：扩张与月球运输
          detail: Nyx Moon 向月球表面物流及在轨加注服务进行长期扩张。
    approximationNotes: 生命周期阶段是根据预订协议和机构里程碑计划综合出的公司商业化框架。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU009
      - CU010
      - CU014
