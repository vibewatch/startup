  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, gross margin, and customer-conversion metrics.
    whyItMatters: Without operating metrics, investors cannot underwrite commercialization quality or compare Gravis to other software or robotics businesses.
    diligencePath: Request monthly financials, board dashboards, deployment cohort data, and customer contract summaries.
    relatedQuestionRefs:
    - QI006
    - QI016
    - QI021
    - QI022
    - QI024
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Deployment-level cost breakdowns for hardware, installation, field ops, support, and safety validation.
    whyItMatters: Gross-margin potential is the single biggest variable separating a great autonomy platform from a cash-hungry services-heavy business.
    diligencePath: Review machine-level deployment P&Ls and the assumptions used for pilot-to-production margin improvement.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI013
    - QI014
    - QI015
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, burn trajectory, and capital plan tied to operator-less deployment milestones.
    whyItMatters: A company can raise a lot of money and still be undercapitalized if field operations and safety validation expand faster than expected.
    diligencePath: Request a base / bear / bull cash forecast with hiring plan, inventory needs, and customer support assumptions.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI020
    relatedTableRefs:
    - TI004
