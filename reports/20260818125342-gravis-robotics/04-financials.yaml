chapter:
  number: 4
  title: Financials
  summary: Gravis Robotics has raised enough public capital to remove immediate solvency risk, but not enough public disclosure to underwrite the business on traditional startup-financial metrics. The most plausible model is a deployment-heavy blend of retrofit hardware, installation, field support, and software-like follow-on revenue, with margins and pricing still likely customized around each customer program. The $200 million SoftBank Series A materially strengthens runway, but the real underwriting question remains pilot-to-program conversion rather than capital availability.
sections:
- id: monetization-model
  title: Monetization Model and Revenue Shape
  body: 'Gravis’s public materials do not read like a standard software company because the product is not delivered purely through code. The company retrofits heavy equipment on customer sites, which implies at least some installation, calibration, and deployment-services revenue in addition to any recurring autonomy software charges. Over time, the economic promise likely shifts toward software, remote monitoring, and multi-machine orchestration, especially if Gravis succeeds in moving from supervised single-machine deployments toward coordinated fleets. But the current evidence suggests a hybrid model: some service-heavy revenue to get machines live, followed by recurring value if the customer keeps the system in production. That mix is strategically attractive because it is tied to real jobsite ROI, yet it also means the company probably does not enjoy software-like margins today. For underwriting, the important distinction is not whether Gravis is “software” or “hardware,” but how quickly
    repeat deployments can push the business toward a more leveraged recurring profile.'
  claimRefs:
