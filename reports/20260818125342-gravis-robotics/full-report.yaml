chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Gravis Robotics is now clearly visible as a Zurich-founded physical-AI company rather than a stealth lab
              experiment. Across its official pages, independent funding coverage, and partner announcements, the same
              narrative repeats: the company spun out of ETH Zurich in 2022 to retrofit autonomous capability onto
              existing heavy equipment instead of asking contractors to replace fleets. That distinction matters because
              it aligns the product with how construction companies actually buy machines—through installed fleets,
              regional service relationships, and mixed-brand operating habits. The Gravis Rack and Slate interface
              together make the company look more like an autonomy layer for legacy iron than a new-machine OEM. That
              makes commercialization plausible, but it also means Gravis must solve field deployment, controls
              integration, support, and trust all at once, not just software model performance. In practical diligence
              terms, this chapter establishes the ground truth that later chapters must reuse: Gravis is selling
              autonomy as an upgrade path for the existing fleet, not as a clean-sheet machine platform.
