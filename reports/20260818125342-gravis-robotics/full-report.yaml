      - number: '4.2'
        title: Unit Economics and Cost Drivers
        blocks:
          - type: paragraph
            body: >-
              The unit-economics logic is intuitive even though the numbers are not public. Gravis installs sensors,
              compute, and control systems onto existing machines, which means hardware and labor sit in the cost of
              goods sold in a way they would not for a pure SaaS company. Field operations and customer support also
              matter because the company’s public proof is still deployment-led and supervised. That is the short-term
              burden. The long-term upside is that repetitive excavation workflows are exactly the kind of operating
              environment where repeated installation playbooks, better software, and lower supervision could gradually
              improve margins. If Gravis can standardize more of the install, reduce the oversight burden, and replicate
              similar jobsites, gross margin should move in the right direction. If every job remains a bespoke
              field-integration exercise, however, the business will stay more services-heavy than the valuation
              narrative implies.
