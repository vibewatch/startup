      - number: '6.2'
        title: Adoption Evidence and Named Customer Proof
        blocks:
          - type: paragraph
            body: >-
              The customer evidence is stronger than a typical early startup, but it is still different from a mature
              enterprise-software customer ledger. Gravis has named partners, public workflow quotes, and operating
              metrics from a real Phoenix site. The 65,000-cubic-yard figure matters because it converts customer proof
              from abstract interest into measured activity. At the same time, the company has not published revenue per
              customer, deployment counts by account, or any standardized conversion funnel. That means the correct
              interpretation is “credible and improving proof,” not “fully de-risked adoption.” The quality of the
              reference accounts does help. Sundt and Austin Bridge carry real weight in heavy civil and site work,
              while Champion demonstrates specialist excavation demand. Customer proof today is operational and
              testimonial. Economic proof is the missing layer. That distinction should temper any easy traction
              narrative. Investors still need to separate reference quality from revenue quality.
