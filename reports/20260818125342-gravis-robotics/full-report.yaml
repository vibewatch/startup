      - number: '3.4'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Gravis’s emerging moat is not a single patent or hardware form factor. It is the combination of field
              data, contractor integration, and workflow expertise that can compound as deployments scale. That is
              promising, but it is not secure yet. OEMs remain the biggest threat because they control the machine
              platform, the warranty boundary, and the service channel; if they decide to move aggressively into the
              same repetitive earthmoving use cases, Gravis’s retrofit advantage could narrow. At the same time, startup
              and software-layer competitors show that autonomy stacks themselves may become more interchangeable over
              time. The best defense Gravis has today is proving that contractors trust it, that its system fits their
              workflows with minimal disruption, and that field data from supervised operations improves the product
              faster than rivals can catch up. In other words, Gravis’s moat is learn-rate driven. That can become
              durable, but only if customer conversion and deployment repetition arrive before incumbents close the gap.
              The category is still young enough that execution speed matters enormously.
