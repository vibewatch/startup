      - number: '5.3'
        title: Technical Architecture and Critical Dependencies
        blocks:
          - type: paragraph
            body: >-
              Gravis’s architecture thesis is clear even if the company does not publish a technical whitepaper. The
              founders believe the data-driven autonomy techniques developed at ETH/field can be adapted to
              construction, where machines must interpret terrain, moving assets, and jobsite goals in real time. The
              challenge is tougher than straight-line navigation because construction equipment does not merely move
              through the world; it changes the world as it works. That means perception, planning, and control all have
              to keep up with dynamic terrain and with people and trucks operating nearby. It also means field
              operations become part of the technical system because deployment quality, calibration, and customer trust
              affect whether the software can perform. For Gravis, product architecture and operations architecture are
              inseparable. That is why data, field support, and contractor co-development all show up as dependencies
              rather than as optional add-ons. The product must succeed technically and operationally at the same time.
