      - number: '7.4'
        title: Mitigations and Stop Criteria
        blocks:
          - type: paragraph
            body: >-
              Gravis does have visible mitigations. Supervised deployment keeps a human safety layer in place while the
              product matures. Reversible retrofit lowers buyer anxiety because a machine can fall back to manual
              operation. Partner co-development ensures the product is trained on real workflows rather than synthetic
              demos. Those are meaningful positives. But they are not infinite protection. Eventually Gravis has to show
              that supervised success converts into a safer, lower-touch, economically repeatable operating model. A
              serious incident pattern, a failure to convert partners into durable programs, or rapid OEM catch-up would
              each represent real stop conditions for the thesis. The right investor posture is therefore not to dismiss
              the company because the risks are high, nor to ignore those risks because the pain point is real. The
              right posture is to demand evidence that Gravis’s learning curve is outrunning its risk curve. That is the
              core risk test for the next refresh. It is also the clearest board-level monitoring agenda.
