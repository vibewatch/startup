      - number: '8.4'
        title: Thesis-Break Triggers and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The final investment judgment should turn on a small number of decisive facts. If Gravis can show safe,
              repeatable deployment expansion, improving software leverage, and credible customer-cohort economics, the
              current valuation can still make sense. If instead safety incidents emerge, customers stall at pilot
              stage, or adjacent incumbents close the gap faster than Gravis scales, investors should assume the mark is
              too rich. The discipline here is to define the stop triggers before the next round of narrative momentum
              arrives. That is why the final diligence asks are practical rather than academic: revenue and gross-margin
              cohorts, safety and insurance packages, transition milestones from supervised to lower-touch autonomy, and
              cap-table or preference detail that clarifies downside protection. Without those items, confidence should
              remain medium at best. With them, Gravis could move from an intriguing contech-autonomy bet to a fundable
              conviction case—or to a clearer pass. For now, milestones should drive pricing more than story alone.
