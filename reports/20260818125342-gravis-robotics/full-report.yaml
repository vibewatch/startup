  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the Product Is
        blocks:
          - type: paragraph
            body: >-
              Gravis’s product is best understood as a retrofit autonomy stack, not as a new piece of OEM machinery. The
              company’s own materials describe the Gravis Operator as a sensor-and-software system that can be added to
              existing heavy equipment. Public deployment coverage fills in more detail: LiDAR, GPS, inertial sensors,
              cameras, and onboard compute sit on the machine, while remote progress visibility helps connect autonomy
              to jobsite operations. That combination matters because it tells investors where the product boundary
              really sits. Gravis is selling a way to make today’s fleet behave differently, not a new fleet. The
              product therefore has to solve both robotics and deployment-engineering problems at once. Hardware,
              machine integration, and software are all part of the offer, which raises complexity but also creates a
              stronger wedge if Gravis can make retrofits feel routine for contractors. The careers page also suggests
              engineering depth is still expanding rapidly.
