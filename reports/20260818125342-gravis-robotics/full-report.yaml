      - number: '1.2'
        title: Leadership Bench and Organizational Signals
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture is concentrated but credible. Ryan Luke Johns and Dominic Jud remain the two
              operating founders most visibly attached to commercial expansion, while Marco Hutter supplies academic
              legitimacy and board continuity from the ETH Zurich lineage. The public materials do not show a broad
              executive bench or a fully disclosed board, so key-person dependence remains meaningful, especially
              because Gravis sits at the intersection of deep robotics R&D and hard operational deployment. At the same
              time, the careers and about pages suggest the company is staffing across perception, autonomy, platform,
              hardware, interface, and field application roles. That pattern is what investors would expect from a
              business trying to move from technical novelty toward repeatable deployment operations. It is a positive
              maturity signal, but not a substitute for deeper governance disclosure. The core leadership case is
              therefore strong enough to support the operating story, but still thin enough that investor diligence
              should request a fuller management map and board-rights package.
