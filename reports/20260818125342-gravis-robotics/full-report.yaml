      - number: '6.4'
        title: Concentration and Channel Risk
        blocks:
          - type: paragraph
            body: >-
              Because the named public account set is still small, concentration risk is almost certainly meaningful
              today. That is not unusual for a company this young, but it matters because a handful of design-partner
              relationships can shape roadmap, reference quality, and near-term revenue. Gravis’s best chance to reduce
              that risk is to turn strong reference accounts into a flywheel that opens adjacent contractors and,
              eventually, channel partners such as rental companies. End markets like data centers and domestic
              manufacturing are especially attractive because they combine schedule urgency with large site-prep scopes,
              but those same large projects often come with demanding procurement processes. The customer chapter
              therefore ends in the same place as the financial one: Gravis has enough proof to justify continued
              interest, but not enough public conversion data to assume broad, durable customer adoption yet. Channel
              leverage is the key upside to watch from here. Concentration and expansion must be evaluated together, not
              separately. That framing matters for underwriting discipline.
