      - number: '2.4'
        title: Growth Drivers, Constraints, and Data Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest public demand drivers are straightforward: labor shortage, safety pressure, and the economic
              premium on faster project delivery. AGC’s 2025 survey and ABC’s workforce estimate both describe a labor
              market that remains structurally tight. CDC, BLS, and OSHA materials reinforce that construction is still
              high risk, creating a second logic for automation even before productivity gains are counted. But the same
              evidence base also shows why adoption will not be automatic. Construction sites are temporary, dynamic,
              and socially complex; buyers can often deploy machine-control tools, more operators, or schedule
              workarounds before they commit to autonomy. Public market data also remains frustratingly imprecise. We
              know the macro market is large and the pain is real, but we do not yet have a clean public dataset that
              isolates autonomy budgets, pilot-to-production conversion, or the ROI threshold that makes operator-less
              operation a must-have. Those are the questions later financial and valuation chapters will need to keep in
              view.
