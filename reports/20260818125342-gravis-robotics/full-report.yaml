      - number: '6.3'
        title: Retention, Durability, and Expansion Logic
        blocks:
          - type: paragraph
            body: >-
              Retention is where public evidence runs out quickly. No disclosed source provides renewal rates, NRR,
              churn, or account-level expansion patterns. The best proxy today is whether reference partners continue to
              deepen engagement and whether Gravis can add new contractors without losing the operational quality of
              earlier deployments. That is useful, but it is not a substitute for cohort data. Construction technology
              can win a strong first pilot and still struggle to become a repeat operating budget item if training
              burden, support load, or workflow disruption stays high. Gravis’s promise is that it can help crews tackle
              repetitive earthmoving while preserving human supervision where needed. If that promise holds, expansion
              should be possible. If not, customer relationships may remain shallow and project-specific. For now,
              durability remains more of a diligence question than a public fact. Investors should treat retention as
              unresolved, not implied. Repeatability is the commercial threshold still missing publicly.
