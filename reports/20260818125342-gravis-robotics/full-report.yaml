  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Any company putting autonomous systems onto heavy machinery inherits a high burden of proof. Construction
              is already a dangerous sector, and OSHA, CDC, and BLS materials make clear that hazards are persistent
              even before autonomy is added. That means Gravis does not get credit simply for saying its system is
              safer. It has to demonstrate that safety in ways that regulators, customers, and insurers can trust.
              External research from Frontiers and the ILO strengthens the point by showing that robotics can
              simultaneously reduce certain hazards and introduce new ones. For Gravis, the immediate legal question is
              not whether construction needs better safety tools—it clearly does. The question is whether Gravis can
              create a repeatable liability and compliance framework as it moves from supervised deployments toward
              lower-touch operation. That is still unresolved publicly. Legal clarity may lag the technology curve for
              some time. Courts and insurers may adapt slowly in practice anyway.
            claimRefs:
