      - number: '1.3'
        title: Funding Path, Investor Base, and Validation Milestones
        blocks:
          - type: paragraph
            body: >-
              Gravis’ capital path changed dramatically in less than a year. The November 2025 round provided an early
              validation stack—IQ Capital, Zacua Ventures, Holcim and other backers tied to construction and industrial
              networks—while the August 2026 SoftBank round vaulted the company straight into unicorn territory at
              roughly $1 billion post-money. Publicly disclosed capital therefore totals at least about $223 million, a
              very large amount for a company that still keeps revenue and margin private. The most important part of
              the story is not just fundraising volume; it is the sequence around that volume. Before SoftBank arrived,
              Gravis had already signed public partners, expanded internationally, and demonstrated autonomy on mixed
              fleets and live worksites. That chronology is why the funding can be read as a scale-up bet rather than
              purely a science-project bet. It also means the next milestones will be judged against a much higher
              valuation bar than the 2025 round ever implied.
