      - number: '5.2'
        title: Workflow Fit and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The public evidence is remarkably consistent about where Gravis works best today: repetitive excavation
              and truck loading on large sites. That is a feature, not a limitation. Repetitive workflows are where
              contractors feel labor shortages most acutely and where a machine can generate measurable ROI through
              longer hours, lower fatigue, and more predictable cycle times. Gravis’s partner and media coverage also
              suggests the company is trying hard to fit into current contractor operations rather than forcing an
              all-new work pattern. Install the kit, run supervised operations, measure progress, repeat. That is a
              sensible operating path for a young autonomy company because it lets customers keep humans close to the
              loop while validating performance. The next question is whether that flow expands naturally into broader
              site autonomy or remains most powerful only on narrow excavation-heavy tasks. That transition will
              determine whether Gravis is a workflow solution or a broader platform.
