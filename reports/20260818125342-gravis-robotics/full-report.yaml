  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation Logic
        blocks:
          - type: paragraph
            body: >-
              Gravis deserves a serious place on an investor watchlist because it is attacking a large, painful
              construction problem with credible autonomy talent, visible flagship partners, and a remarkably strong
              $200 million Series A led by SoftBank. That said, the public record is not yet strong enough for a
              high-conviction bullish underwriting call. The reason is straightforward: Gravis’ valuation already
              reflects category-leader ambition, but the public evidence still lags on revenue quality, margin
              structure, customer-conversion depth, and deployment repeatability. Investors can see the round, the
              retrofit thesis, and several strong logos. They cannot yet see commercial cohorts, retention, or what
              proportion of value is becoming software-like versus deployment-heavy. That combination argues for
              recommendation discipline. There is enough evidence to stay engaged, but not enough to underwrite a hard
              buy from public information alone. Research-more is the right call because the company is promising and
              the price is already serious.
