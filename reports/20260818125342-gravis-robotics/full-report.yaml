  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Who Competes with Gravis and Why
        blocks:
          - type: paragraph
            body: >-
              Gravis’s competitive set is wider than a list of startups doing “construction robotics.” The closest
              analogs are companies that solve the same buyer problem—getting more safe, consistent output from heavy
              equipment with less reliance on scarce operators. That creates three practical categories. First are
              startup analogs such as Built Robotics, which shares the construction-automation narrative but has
              concentrated more narrowly on solar workflows. Second are OEM incumbents like Caterpillar that can embed
              autonomy directly into the base machine and bring dealer reach, service, and installed trust. Third are
              adjacent autonomy or workflow players such as Hexagon, Pronto, and Polymath that approach the market
              through software, data, haulage, or platform tooling rather than through Gravis’s contractor
              co-development model. Gravis’s position only makes sense when these categories are compared on workflow
              fit, channel control, and go-live readiness—not when all are collapsed into one broad robotics bucket.
            claimRefs:
