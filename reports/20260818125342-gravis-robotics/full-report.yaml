      - number: '8.3'
        title: Comparable Frame and Its Limits
        blocks:
          - type: paragraph
            body: >-
              Gravis does not have a neat public comparable set. Built Robotics is useful because it shows how a startup
              can build a construction-automation wedge around a narrow workflow and then still face difficult scaling
              choices. Caterpillar and Komatsu matter because they demonstrate the channel, financing, and service power
              that incumbent OEMs can bring to autonomy. Hexagon and Trimble matter because workflow-control layers can
              become powerful without owning the full machine stack. Teleo and related fleet-modernization vendors
              matter because they validate buyer appetite for upgrading legacy fleets instead of waiting for entirely
              new equipment cycles. But none of these is a clean multiple comp. Their products, routes to market,
              capital needs, and customer economics differ too much. That is why this chapter treats comparables as
              archetypes rather than pretending a spreadsheet of public multiples can settle the question. Gravis should
              be valued against what it might become—a cross-brand autonomy layer for heavy equipment—while still
              recognizing that it may never achieve the scale or margins investors are implicitly hoping for today.
            claimRefs:
              - CV018
              - CV019
