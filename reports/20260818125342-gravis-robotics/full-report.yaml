        title: Deployment Footprint, Public Proof, and Remaining Open Risks
        blocks:
          - type: paragraph
            body: >-
              The strongest public operating proof is breadth rather than audited economics. Gravis says its systems are
              live across four continents and seven countries, with public references to Holcim, Taylor Woodrow, HD
              Hyundai, Flannery, Hitachi, Techint and other partners. The UK CAM Pathfinder award, the Manchester
