  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              The right way to frame Gravis’ market is narrower than “construction robotics” and more specific than
              “construction equipment.” The company is not trying to automate every trade on a jobsite. Its disclosed
              proof points center on repetitive earthmoving, truck loading, trenching, grading, quarry materials
              handling, and related site-prep tasks that benefit from long machine hours and tight cycle consistency.
              Gravis also approaches the market as a retrofit layer rather than as an OEM machine program, which means
              the relevant budget is not just new-machine capex. It sits at the intersection of construction equipment,
              machine-control software, telematics, and autonomy. That matters because the closest substitutes are not
              only other autonomy startups; they include machine-guidance vendors, telemetry platforms, dealer-enabled
              OEM autonomy programs, and labor-heavy manual workarounds that attack the same buyer pain from different
              starting points. The market boundary therefore has to be defined by workflow and buyer problem first, not
              by the broadest published TAM category.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
