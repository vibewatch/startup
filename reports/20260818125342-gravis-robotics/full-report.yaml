              view that the company has moved beyond a single demo site. Even so, the overview still ends with
              unresolved underwriting gaps. Independent coverage repeatedly notes that Gravis must prove retrofit
              autonomy scales past pilots and outcompetes OEM-led autonomy stacks. The company has not published
              revenue, cash balance, exact customer count, gross margin, or full board composition. For later diligence
              chapters, those blind spots matter as much as the funding headline. The overview can therefore support a
              strong identity and milestone narrative, but it cannot close the case on commercial durability by itself.
