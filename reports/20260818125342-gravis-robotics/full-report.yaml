      - number: '7.3'
        title: People, Workforce, and Adoption Risk
        blocks:
          - type: paragraph
            body: >-
              Autonomy adoption is never just a technical problem. It changes how work is organized, which people feel
              threatened or empowered, and how much training and trust a customer has to build before relying on the
              system. Gravis’s partner quotes wisely frame the product as freeing skilled operators for more valuable
              tasks rather than simply replacing them. Even so, Brookings, the St. Louis Fed, and the ILO all show that
              worker-displacement narratives can become a real adoption barrier. Internally, the company also faces
              classic startup execution risk: a public identity tied closely to a few founders, fast hiring, and a
              management bench that is still growing into the scale implied by the valuation. If change management or
              workforce acceptance lags behind the product roadmap, customer expansion can slow even if the technology
              continues to improve. Human factors could become the hidden bottleneck.
            claimRefs:
