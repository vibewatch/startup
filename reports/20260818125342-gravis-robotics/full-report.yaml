      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to general contractors, earthmoving subcontractors, quarry operators, and
              plant-hire channels as the first credible buyer groups. They own the schedule risk, the repetitive
              excavation tasks, and the operator bottlenecks Gravis highlights in its field deployments. Industrial
              project builders and heavy civil contractors are especially relevant because large manufacturing, energy,
              infrastructure, and data-center sites create the kind of repeatable site-prep work where autonomy can run
              for long hours without constant workflow changes. Rental companies are strategically interesting because
              Gravis has already linked its retrofit model to Flannery’s distribution path, making mixed-fleet autonomy
              available without forcing permanent fleet replacement. Developers and owners are not the direct buyer in
              most cases, yet they create the economic urgency: a contractor that can finish a data-center pad or a
              pipeline segment faster may win work even if the owner never buys autonomy directly. Adoption will
              therefore likely proceed through contractors first, then through broader channel and OEM partnerships if
              ROI is proven.
