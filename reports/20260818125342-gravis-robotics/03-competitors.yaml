- id: pricing-and-commercial-shape
  title: Packaging, Commercial Shape, and Buying Friction
  body: Pricing is one of the least transparent parts of the competitive landscape. Gravis has not published list pricing, suggesting the current commercial motion is still customized around pilots, sites, and customer-specific deployment scope. That does not make the business weak; it simply means diligence cannot yet compare Gravis to rivals with a clean apples-to-apples price sheet. Built Robotics appears more productized in its solar equipment packaging, while Caterpillar benefits from the ability to bundle autonomy with machine sales and service support. Hexagon can compete through software and workflow ROI, and autonomy-platform players can sometimes price a system layer without owning the vehicle itself. For investors, the main implication is that deployment proof and buyer trust are currently more informative than nominal list price. Until commercial terms are visible, the category should be judged more on installation friction, field support, and proof of repeated use than on sticker
    price alone.
  claimRefs:
  - CP013
  - CP014
  - CP015
  - CP016
