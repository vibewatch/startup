company:
  name: Gravis Robotics
chapter:
  number: 3
  title: Competitors
  summary: Gravis Robotics competes in a fragmented autonomy stack rather than against a single clean peer set. The most direct overlaps come from retrofit and supervised-autonomy startups such as Teleo, plus workflow- or platform-layer competitors such as Polymath and Pronto, while the largest long-term threats are OEMs and incumbents like Caterpillar, Komatsu, Hexagon, and Trimble that control machines, distribution, or site software. Gravis’ best current wedge is mixed-fleet retrofit autonomy for repetitive earthmoving, but that advantage will narrow if incumbents turn autonomy into a low-friction bundle.
sections:
- id: who-competes-and-why
  title: Who Competes with Gravis and Why
  body: Gravis’s competitive set is wider than a list of startups doing “construction robotics.” The closest analogs are companies that solve the same buyer problem—getting more safe, consistent output from heavy equipment with less reliance on scarce operators. That creates three practical categories. First are startup analogs such as Built Robotics, which shares the construction-automation narrative but has concentrated more narrowly on solar workflows. Second are OEM incumbents like Caterpillar that can embed autonomy directly into the base machine and bring dealer reach, service, and installed trust. Third are adjacent autonomy or workflow players such as Hexagon, Pronto, and Polymath that approach the market through software, data, haulage, or platform tooling rather than through Gravis’s contractor co-development model. Gravis’s position only makes sense when these categories are compared on workflow fit, channel control, and go-live readiness—not when all are collapsed into one broad
    robotics bucket.
  claimRefs:
