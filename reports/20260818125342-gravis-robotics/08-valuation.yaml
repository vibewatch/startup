- id: scenario-and-sensitivity
  title: Bull / Base / Bear Scenario Framing
  body: 'This chapter uses scenario analysis because point-estimate valuation work would imply a precision that the public evidence does not support. In the bull case, Gravis converts its flagship customer and OEM references into repeatable, lower-touch programs across multiple machine brands and jobsite types, allowing investors to believe in more durable software and data leverage. In the base case, it becomes a valuable but still operationally heavy autonomy specialist with ongoing strategic backing and respectable deployment momentum. In the bear case, customers keep liking the demos and pilot outcomes without converting into sufficiently broad or profitable scale programs, leaving the current valuation ahead of proof. The important issue is not a single exact number. It is the set of milestones separating these paths: safety and liability readiness, site-generalization performance, customer expansion, and how fast deployment labor declines as a share of value delivery. Scenario discipline
    protects against false precision and clarifies what investors should monitor next.'
  claimRefs:
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
