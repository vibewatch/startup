- id: comparable-frame
  title: Comparable Frame and Its Limits
  body: Gravis does not have a neat public comparable set. Built Robotics is useful because it shows how a startup can build a construction-automation wedge around a narrow workflow and then still face difficult scaling choices. Caterpillar and Komatsu matter because they demonstrate the channel, financing, and service power that incumbent OEMs can bring to autonomy. Hexagon and Trimble matter because workflow-control layers can become powerful without owning the full machine stack. Teleo and related fleet-modernization vendors matter because they validate buyer appetite for upgrading legacy fleets instead of waiting for entirely new equipment cycles. But none of these is a clean multiple comp. Their products, routes to market, capital needs, and customer economics differ too much. That is why this chapter treats comparables as archetypes rather than pretending a spreadsheet of public multiples can settle the question. Gravis should be valued against what it might become—a cross-brand autonomy
    layer for heavy equipment—while still recognizing that it may never achieve the scale or margins investors are implicitly hoping for today.
  claimRefs:
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
  - CV023
  tableRefs:
  - TV004
- id: triggers-and-final-asks
  title: Thesis-Break Triggers and Final Diligence Asks
  body: 'The final investment judgment should turn on a small number of decisive facts. If Gravis can show safe, repeatable deployment expansion, improving software leverage, and credible customer-cohort economics, the current valuation can still make sense. If instead safety incidents emerge, customers stall at pilot stage, or adjacent incumbents close the gap faster than Gravis scales, investors should assume the mark is too rich. The discipline here is to define the stop triggers before the next round of narrative momentum arrives. That is why the final diligence asks are practical rather than academic: revenue and gross-margin cohorts, safety and insurance packages, transition milestones from supervised to lower-touch autonomy, and cap-table or preference detail that clarifies downside protection. Without those items, confidence should remain medium at best. With them, Gravis could move from an intriguing contech-autonomy bet to a fundable conviction case—or to a clearer pass. For now,
    milestones should drive pricing more than story alone.'
