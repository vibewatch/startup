evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue disclosure
    missingEvidence: Booked revenue, ARR if any, gross margin, and cash balance are not publicly disclosed.
    whyItMatters: The $1B post-money valuation cannot be benchmarked against disclosed commercial performance without these metrics.
    diligencePath: Request management financials, board materials, and the SoftBank round deck with revenue bridge and cash runway.
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: material
    topic: board and governance
    missingEvidence: A full board roster, observer rights, and governance controls beyond Marco Hutter are not public.
    whyItMatters: Founder concentration and investor control are key diligence items after a very large concentrated Series A.
    diligencePath: Request current cap table, board list, and investor-rights summary from counsel.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: customer count
    missingEvidence: No audited or dated public customer-count figure is visible in the reviewed sources.
    whyItMatters: Named logos validate use cases but do not reveal concentration or breadth of adoption.
    diligencePath: Request active deployment count, paying-customer count, and revenue concentration by top account.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: tam-isolation
    missingEvidence: A clean public source isolating autonomous earthmoving retrofit spend as a standalone market.
    whyItMatters: >-
      Without a discrete market line, TAM can be overstated by blending machine sales, telematics, and robotics
      categories.
    diligencePath: >-
      Interview buyers and channel partners to estimate real budget pools for autonomy upgrades versus other jobsite
      technology.
    relatedQuestionRefs:
      - QM010
      - QM022
      - QM023
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: Actual autonomy budget owners, deal sizes, and payback thresholds at contractor customers.
    whyItMatters: Market pain does not automatically translate into funded budgets or repeatable buying programs.
    diligencePath: Request a pipeline by segment showing buyer title, budget source, project type, and target payback period.
    relatedQuestionRefs:
      - QM011
      - QM014
      - QM015
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: growth-drivers-constraints
    missingEvidence: >-
      A fuller quantified map of adoption blockers such as insurance, union rules, site connectivity, and customer
      change management.
    whyItMatters: >-
      The driver/constraint table is intentionally partial because public sources emphasize labor and safety more than
      budget mechanics.
    diligencePath: Expand diligence with broker, insurer, and union interviews plus procurement-policy review at named contractors.
    relatedQuestionRefs:
      - QM019
      - QM020
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: Actual Gravis pricing, deployment fees, and support terms versus rival autonomy offerings.
    whyItMatters: Without commercial terms, feature comparison alone cannot determine which vendor has the strongest ROI case.
    diligencePath: Collect customer proposals or pilot statements of work from Gravis and at least two rival solutions.
    relatedQuestionRefs:
      - QP011
      - QP012
      - QP022
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: oem-response
    missingEvidence: >-
      A direct statement from OEMs about whether they plan to interoperate with retrofit autonomy vendors or compete
      head-on.
    whyItMatters: OEM openness or hostility could materially change Gravis’s channel strategy and installation economics.
    diligencePath: Interview Cat, Deere, Komatsu, and Volvo channel partners on retrofit policy and warranty boundaries.
    relatedQuestionRefs:
      - QP008
      - QP017
      - QP018
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-risk-register
    missingEvidence: A fuller list of private startups and machine-control vendors active in adjacent earthmoving autonomy.
    whyItMatters: The public market is fragmented and likely more crowded than the named set visible in accessible sources.
    diligencePath: Expand the competitive census using customer interviews, trade-show notes, and dealer-channel intelligence.
    relatedQuestionRefs:
      - QP001
      - QP005
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR, gross margin, and customer-conversion metrics.
    whyItMatters: >-
      Without operating metrics, investors cannot underwrite commercialization quality or compare Gravis to other
      software or robotics businesses.
    diligencePath: Request monthly financials, board dashboards, deployment cohort data, and customer contract summaries.
    relatedQuestionRefs:
      - QI006
      - QI016
      - QI021
      - QI022
      - QI024
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Deployment-level cost breakdowns for hardware, installation, field ops, support, and safety validation.
    whyItMatters: >-
      Gross-margin potential is the single biggest variable separating a great autonomy platform from a cash-hungry
      services-heavy business.
    diligencePath: Review machine-level deployment P&Ls and the assumptions used for pilot-to-production margin improvement.
    relatedQuestionRefs:
      - QI011
      - QI012
      - QI013
      - QI014
      - QI015
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Cash balance, burn trajectory, and capital plan tied to operator-less deployment milestones.
    whyItMatters: >-
      A company can raise a lot of money and still be undercapitalized if field operations and safety validation expand
      faster than expected.
    diligencePath: Request a base / bear / bull cash forecast with hiring plan, inventory needs, and customer support assumptions.
    relatedQuestionRefs:
      - QI018
      - QI019
      - QI020
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: safety-validation
    missingEvidence: Formal safety case documentation, disengagement logic, and third-party validation metrics for Gravis deployments.
    whyItMatters: >-
      Autonomy credibility depends on more than partner quotes; investors need objective evidence on how the system
      handles edge cases.
    diligencePath: Request safety architecture documents, hazard analyses, and incident / near-miss reporting from active sites.
    relatedQuestionRefs:
