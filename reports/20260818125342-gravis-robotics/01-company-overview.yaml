- id: leadership-and-organizational-signals
  title: Leadership Bench and Organizational Signals
  body: The public leadership picture is concentrated but credible. Ryan Luke Johns and Dominic Jud remain the two operating founders most visibly attached to commercial expansion, while Marco Hutter supplies academic legitimacy and board continuity from the ETH Zurich lineage. The public materials do not show a broad executive bench or a fully disclosed board, so key-person dependence remains meaningful, especially because Gravis sits at the intersection of deep robotics R&D and hard operational deployment. At the same time, the careers and about pages suggest the company is staffing across perception, autonomy, platform, hardware, interface, and field application roles. That pattern is what investors would expect from a business trying to move from technical novelty toward repeatable deployment operations. It is a positive maturity signal, but not a substitute for deeper governance disclosure. The core leadership case is therefore strong enough to support the operating story, but still
    thin enough that investor diligence should request a fuller management map and board-rights package.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO036
  tableRefs:
  - TO002
- id: capitalization-and-milestones
  title: Funding Path, Investor Base, and Validation Milestones
  body: Gravis’ capital path changed dramatically in less than a year. The November 2025 round provided an early validation stack—IQ Capital, Zacua Ventures, Holcim and other backers tied to construction and industrial networks—while the August 2026 SoftBank round vaulted the company straight into unicorn territory at roughly $1 billion post-money. Publicly disclosed capital therefore totals at least about $223 million, a very large amount for a company that still keeps revenue and margin private. The most important part of the story is not just fundraising volume; it is the sequence around that volume. Before SoftBank arrived, Gravis had already signed public partners, expanded internationally, and demonstrated autonomy on mixed fleets and live worksites. That chronology is why the funding can be read as a scale-up bet rather than purely a science-project bet. It also means the next milestones will be judged against a much higher valuation bar than the 2025 round ever implied.
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO027
