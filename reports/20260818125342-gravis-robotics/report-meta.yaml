  topStrengths:
    - Strong retrofit thesis that targets installed fleets instead of waiting for OEM replacement cycles.
    - Visible flagship proof across Holcim, Taylor Woodrow, Techint, Flannery, and OEM demo partnerships.
    - Exceptional capital support from SoftBank for a very young construction-autonomy company.
  topRisks:
    - Valuation already reflects substantial future execution before public commercial metrics are visible.
    - Safety, liability, and insurance frameworks for lower-touch autonomy remain under-disclosed publicly.
    - OEM incumbents and adjacent autonomy vendors can compress the retrofit wedge over time.
  unresolvedGaps:
    - Revenue, gross-margin, and deployment-cohort metrics are needed for a real valuation model.
    - Customer concentration, renewal, and expansion data are not public.
    - Contractual liability allocation and insurer posture remain unclear from public evidence.
