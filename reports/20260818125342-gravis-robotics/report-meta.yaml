      claimRefs: [CO006, CO001]
  headquarters: Zurich, Switzerland
  productSummary: Retrofits existing heavy equipment with the Gravis Rack autonomy kit, the Slate operator interface, sensors, onboard compute, and machine-learning control software.
  customerFocus: Large contractors, quarry and materials operators, infrastructure builders, mining and industrial operators, and channel partners modernizing mixed heavy-equipment fleets.
  businessModel: Hybrid deployment-and-software model built around retrofit installation, supervised autonomy programs, support, and eventual higher-margin fleet-orchestration or workflow software.
  stage: Series A
  fundingStatus: Raised $23M in 2025 and a $200M Series A in August 2026 at about a $1B valuation; public evidence implies at least $223M total funding.
