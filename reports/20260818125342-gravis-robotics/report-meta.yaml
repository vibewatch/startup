companyProfile:
  summary: Gravis Robotics is a Zurich-based autonomy startup spun out of ETH Zurich that retrofits excavators and other heavy equipment with perception, control, and operator-assist systems. The company pairs the Gravis Rack autonomy kit with the Slate interface and is pursuing a mixed-fleet strategy aimed at construction, quarry, mining, and infrastructure workflows where labor scarcity, safety pressure, and productivity constraints are acute.
  foundingLocation: Zurich, Switzerland
