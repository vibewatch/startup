company:
  name: Gravis Robotics
chapter:
  number: 6
  title: Customers
  summary: 'Gravis Robotics has credible early customer proof, but it is proof of quality and traction rather than proof of a broad installed base. Publicly named accounts and partners now span contractors, plant hire, quarry operators, OEM channels, and at least one major pipeline project, which is unusually strong for a young autonomy company. What remains missing is the revenue-quality layer: no public renewal, deployment-cohort, or concentration disclosure yet shows whether these references convert into durable recurring programs.'
sections:
- id: customer-segments
  title: Who the Customer Is
  body: 'Gravis’s public customer story starts with contractors, not with developers, municipalities, or equipment OEMs. That makes sense because the company is solving a workflow problem on the jobsite: who owns the machine, who struggles to staff it, and who gets rewarded if the task finishes faster. General contractors and earthmoving specialists are therefore the cleanest first segments. The named partner list supports that view by centering Sundt, Zachry, Champion Site Prep, and Capitol Aggregates. Rental companies are not proven customers yet, but they matter strategically because a retrofit product can travel across mixed fleets more easily than an OEM-locked system. Large EPC and mega-project builders also matter because they operate the kinds of capital-intensive sites where schedule pressure, labor scarcity, and repetitive site work can create the highest autonomy ROI. Those segments give Gravis a rational customer-ordering strategy. It also suggests enterprise sales discipline
    will matter early.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU030
  - CU031
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-evidence
  title: Adoption Evidence and Named Customer Proof
  body: The customer evidence is stronger than a typical early startup, but it is still different from a mature enterprise-software customer ledger. Gravis has named partners, public workflow quotes, and operating metrics from a real Phoenix site. The 65,000-cubic-yard figure matters because it converts customer proof from abstract interest into measured activity. At the same time, the company has not published revenue per customer, deployment counts by account, or any standardized conversion funnel. That means the correct interpretation is “credible and improving proof,” not “fully de-risked adoption.” The quality of the reference accounts does help. Sundt and Austin Bridge carry real weight in heavy civil and site work, while Champion demonstrates specialist excavation demand. Customer proof today is operational and testimonial. Economic proof is the missing layer. That distinction should temper any easy traction narrative. Investors still need to separate reference quality from revenue
    quality.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
