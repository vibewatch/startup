- id: retention-and-durability
  title: Retention, Durability, and Expansion Logic
  body: Retention is where public evidence runs out quickly. No disclosed source provides renewal rates, NRR, churn, or account-level expansion patterns. The best proxy today is whether reference partners continue to deepen engagement and whether Gravis can add new contractors without losing the operational quality of earlier deployments. That is useful, but it is not a substitute for cohort data. Construction technology can win a strong first pilot and still struggle to become a repeat operating budget item if training burden, support load, or workflow disruption stays high. Gravis’s promise is that it can help crews tackle repetitive earthmoving while preserving human supervision where needed. If that promise holds, expansion should be possible. If not, customer relationships may remain shallow and project-specific. For now, durability remains more of a diligence question than a public fact. Investors should treat retention as unresolved, not implied. Repeatability is the commercial threshold
    still missing publicly.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU029
  - CU034
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-and-channel-risk
  title: Concentration and Channel Risk
  body: 'Because the named public account set is still small, concentration risk is almost certainly meaningful today. That is not unusual for a company this young, but it matters because a handful of design-partner relationships can shape roadmap, reference quality, and near-term revenue. Gravis’s best chance to reduce that risk is to turn strong reference accounts into a flywheel that opens adjacent contractors and, eventually, channel partners such as rental companies. End markets like data centers and domestic manufacturing are especially attractive because they combine schedule urgency with large site-prep scopes, but those same large projects often come with demanding procurement processes. The customer chapter therefore ends in the same place as the financial one: Gravis has enough proof to justify continued interest, but not enough public conversion data to assume broad, durable customer adoption yet. Channel leverage is the key upside to watch from here. Concentration and expansion
    must be evaluated together, not separately. That framing matters for underwriting discipline.'
