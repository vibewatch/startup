chapter:
  number: 5
  title: Product & Technology
  summary: Gravis Robotics delivers a mixed-fleet autonomy stack built around the Gravis Rack retrofit kit, the Slate operator interface, and simulation-trained machine-learning controls. Public evidence is strongest for supervised trenching, loading, bulk excavation, and site-visualization workflows where real-time sensing, terrain understanding, and operator handoff matter more than generic vehicle autonomy. The architecture looks technically ambitious and commercially practical, but public assurance materials still lag the product narrative.
sections:
- id: product-definition
  title: What the Product Is
  body: 'Gravis’s product is best understood as a retrofit autonomy stack, not as a new piece of OEM machinery. The company’s own materials describe the Gravis Operator as a sensor-and-software system that can be added to existing heavy equipment. Public deployment coverage fills in more detail: LiDAR, GPS, inertial sensors, cameras, and onboard compute sit on the machine, while remote progress visibility helps connect autonomy to jobsite operations. That combination matters because it tells investors where the product boundary really sits. Gravis is selling a way to make today’s fleet behave differently, not a new fleet. The product therefore has to solve both robotics and deployment-engineering problems at once. Hardware, machine integration, and software are all part of the offer, which raises complexity but also creates a stronger wedge if Gravis can make retrofits feel routine for contractors. The careers page also suggests engineering depth is still expanding rapidly.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE026
  - CE027
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflow-fit
  title: Workflow Fit and Operating Model
  body: 'The public evidence is remarkably consistent about where Gravis works best today: repetitive excavation and truck loading on large sites. That is a feature, not a limitation. Repetitive workflows are where contractors feel labor shortages most acutely and where a machine can generate measurable ROI through longer hours, lower fatigue, and more predictable cycle times. Gravis’s partner and media coverage also suggests the company is trying hard to fit into current contractor operations rather than forcing an all-new work pattern. Install the kit, run supervised operations, measure progress, repeat. That is a sensible operating path for a young autonomy company because it lets customers keep humans close to the loop while validating performance. The next question is whether that flow expands naturally into broader site autonomy or remains most powerful only on narrow excavation-heavy tasks. That transition will determine whether Gravis is a workflow solution or a broader platform.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE028
  - CE029
  - CE035
