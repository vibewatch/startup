  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tam-isolation
    missingEvidence: A clean public source isolating autonomous earthmoving retrofit spend as a standalone market.
    whyItMatters: Without a discrete market line, TAM can be overstated by blending machine sales, telematics, and robotics categories.
    diligencePath: Interview buyers and channel partners to estimate real budget pools for autonomy upgrades versus other jobsite technology.
    relatedQuestionRefs:
    - QM010
    - QM022
    - QM023
  - type: private-evidence-only
    severity: material
    topic: buyer-budget
    missingEvidence: Actual autonomy budget owners, deal sizes, and payback thresholds at contractor customers.
    whyItMatters: Market pain does not automatically translate into funded budgets or repeatable buying programs.
    diligencePath: Request a pipeline by segment showing buyer title, budget source, project type, and target payback period.
    relatedQuestionRefs:
    - QM011
    - QM014
    - QM015
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: growth-drivers-constraints
    missingEvidence: A fuller quantified map of adoption blockers such as insurance, union rules, site connectivity, and customer change management.
    whyItMatters: The driver/constraint table is intentionally partial because public sources emphasize labor and safety more than budget mechanics.
    diligencePath: Expand diligence with broker, insurer, and union interviews plus procurement-policy review at named contractors.
    relatedQuestionRefs:
    - QM019
    - QM020
    - QM024
    relatedTableRefs:
    - TM004
