company:
  name: Gravis Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: 'Gravis Robotics addresses a very large underlying construction-equipment market but only a narrow near-term autonomy wedge within it: repetitive earthmoving, quarry handling, and site-prep workflows where labor scarcity, safety pressure, and schedule compression matter most. Public market sources range from hundreds of millions for construction robots to tens of billions for smart construction equipment and more than $180 billion for total equipment, reinforcing that a multi-lens TAM approach is more credible than a single headline number. Buyer logic is strongest with general contractors, earthmoving specialists, quarry operators, and rental-linked channels that already manage mixed fleets.'
sections:
- id: market-boundary
  title: Market Boundary and Scope
  body: The right way to frame Gravis’ market is narrower than “construction robotics” and more specific than “construction equipment.” The company is not trying to automate every trade on a jobsite. Its disclosed proof points center on repetitive earthmoving, truck loading, trenching, grading, quarry materials handling, and related site-prep tasks that benefit from long machine hours and tight cycle consistency. Gravis also approaches the market as a retrofit layer rather than as an OEM machine program, which means the relevant budget is not just new-machine capex. It sits at the intersection of construction equipment, machine-control software, telematics, and autonomy. That matters because the closest substitutes are not only other autonomy startups; they include machine-guidance vendors, telemetry platforms, dealer-enabled OEM autonomy programs, and labor-heavy manual workarounds that attack the same buyer pain from different starting points. The market boundary therefore has to be defined
    by workflow and buyer problem first, not by the broadest published TAM category.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM032
