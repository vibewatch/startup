              没有可获取来源给出自主土方改装的权威独立
              TAM，因此单一头条数字会误导人。最佳公开证据提供的是一串相邻估算。放到最宽口径，建筑设备是一个以数千亿美元计的庞大全球市场。智能建筑设备、建筑机器人等更窄类别小得多，但仍足以容纳资金充足的新进入者。对
              Gravis 重要的是，只要公司拿下混合车队中最高价值的重复性工作流，即便只占子集中的一小部分，也能做出有意义的业务。Fortune Business Insights、Global Market
              Insights、Future Market Insights 和 Mordor Intelligence
              之间的差异，应被视为反对过度精确的警示，而不是否定投资逻辑的理由。正确结论是：存量设备基数巨大，自主化切口真实，确切支出池仍需要自下而上的尽调。
