      - number: '7.4'
        title: 缓释因素和止损条件
        blocks:
          - type: paragraph
            body: >-
              Gravis
              确实有可见的缓释因素。有监督部署在产品成熟期间保留了一层人工安全保障。可逆改装降低了买方焦虑，因为机器可以退回手动作业。合作伙伴共研确保产品在真实工作流上训练，而不是在合成演示里训练。这些都是有意义的正面因素。但它们不是无限保护。Gravis
              最终必须证明，有监督成功能转化为更安全、少人工介入、经济上可重复的运营模式。严重事故模式、无法把伙伴转化为耐久项目，或 OEM
              快速追赶，都应成为投资逻辑的真实止损条件。因此，正确的投资姿态不是因为风险高就否定公司，也不是因为痛点真实就忽视风险。正确姿态是要求证据证明 Gravis
              的学习曲线跑赢风险曲线。这是下一次刷新时的核心风险测试，也是最清晰的董事会级监控议程。
            claimRefs:
              - CR021
              - CR022
