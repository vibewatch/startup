      - number: '3.3'
        title: 包装方式、商业形态和购买摩擦
        blocks:
          - type: paragraph
            body: >-
              定价是竞争格局中最不透明的部分之一。Gravis 没有公布标价，说明当前商业动作仍围绕试点、工地和客户特定部署范围定制。这并不意味着业务弱，只意味着尽调还无法把 Gravis
              与竞争对手放在一张干净的同口径价格表上比较。Built Robotics 在太阳能设备包装上似乎更产品化；Caterpillar 则能把自主化与机器销售和服务支持打包。Hexagon 可以靠软件和工作流 ROI
              竞争，自主化平台玩家有时也能在不拥有车辆本体的情况下为系统层定价。对投资人而言，主要含义是：部署证明和买方信任目前比名义标价更有信息量。在商业条款可见之前，判断这个类别更应看安装摩擦、现场支持和重复使用证明，而不是只看标价。
