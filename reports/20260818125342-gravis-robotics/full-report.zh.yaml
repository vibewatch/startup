  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品到底是什么
        blocks:
          - type: paragraph
            body: >-
              Gravis 的产品最好理解为改装式自主化栈，而不是一台新的 OEM 机器。公司自己的材料把 Gravis Operator
              描述为可加装到现有重型设备上的传感器加软件系统。公开部署报道补上了更多细节：LiDAR、GPS、惯性传感器、摄像头和车载计算装在机器上，远程进度可视化则帮助把自主化接入工地运营。这个组合很重要，因为它告诉投资人产品边界真正在哪里。Gravis
              卖的是让今天的车队换一种方式运转，而不是卖一支新车队。因此，产品必须同时解决机器人问题和部署工程问题。硬件、机器集成和软件都是产品的一部分；这提高了复杂度，但如果 Gravis
              能让承包商觉得改装是常规动作，也会形成更强切口。招聘页面还显示，工程深度仍在快速扩张。
