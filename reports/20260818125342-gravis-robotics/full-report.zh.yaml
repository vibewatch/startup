  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户是谁
        blocks:
          - type: paragraph
            body: >-
              Gravis 的公开客户故事从承包商开始，而不是从开发商、市政机构或设备 OEM
              开始。这说得通，因为公司解决的是工地上的工作流问题：谁拥有机器、谁难以配齐操作员、任务更快完成时谁获得回报。因此，总承包商和土方专业公司是最清晰的第一批细分市场。具名合作伙伴名单也支持这一点，核心是
              Sundt、Zachry、Champion Site Prep 和 Capitol Aggregates。租赁公司还不能算已证明的客户，但在战略上重要，因为改装产品比 OEM 锁定系统更容易跨混合车队流动。大型
              EPC 和超级项目建设方也重要，因为它们运营的是资本密集型工地，进度压力、劳动力稀缺和重复场地作业会创造最高的自主化 ROI。这些细分市场给了 Gravis
              一个合理的客户排序策略，也说明企业销售纪律会很早变得重要。
