  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和范围
        blocks:
          - type: paragraph
            body: >-
              Gravis
              的市场应该比“建筑机器人”更窄，也比“建筑设备”更具体。公司并不是想把工地上的每一种工种都自动化。已披露的证明点集中在重复性土方、装车、开沟、整平、采石场物料处理和相关场地准备任务上，这些任务依赖长机器工时和稳定循环节奏。Gravis
              进入市场的方式也是改装层，而不是 OEM
              整机项目，这意味着相关预算不只是新机资本开支。它位于建筑设备、机器控制软件、远程信息处理和自主化的交叉点。这个定位很重要，因为最接近的替代品不只有其他自主化初创公司，还包括机器导引厂商、遥测平台、经销商驱动的
              OEM 自主化项目，以及从不同起点解决同一买方痛点的高人工手动作业替代方案。因此，市场边界要先按工作流和买方问题界定，而不是按最宽泛的公开 TAM 类别界定。
