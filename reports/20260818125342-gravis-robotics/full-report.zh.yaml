      - number: '2.3'
        title: 买方分层和采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向总承包商、土方分包商、采石场运营商和设备租赁渠道，这是第一批可信买方群体。他们承担进度风险，拥有重复挖掘任务，也最受 Gravis
              在现场部署中强调的操作员瓶颈影响。工业项目建设方和重型土木承包商尤其相关，因为大型制造、能源、基础设施和数据中心工地会产生可重复的场地准备工作，让自主化设备能长时间运行而不必频繁调整工作流。租赁公司在战略上很有意思，因为
              Gravis 已经把改装模式接入 Flannery
              的分销路径，让混合车队无需被迫永久更换设备也能获得自主化能力。开发商和业主多数时候不是直接买方，但会制造经济紧迫性：承包商如果能更快完成数据中心地坪或管道段，即使业主从不直接采购自主化，也可能赢得项目。因此，采用大概率先从承包商开始；一旦
              ROI 得到证明，再扩展到更广的渠道和 OEM 伙伴关系。
