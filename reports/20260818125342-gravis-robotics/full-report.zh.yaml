      - number: '3.2'
        title: 功能广度、工作流匹配和渠道深度
        blocks:
          - type: paragraph
            body: >-
              Gravis 最强的产品层差异，是不绑定 OEM 的改装姿态。公开报道显示，公司把系统安装到现有挖掘机上，并在承包商活跃工地部署，而不是要求客户购买一整套全新机器生态。这不同于 Caterpillar
              的模式，后者靠对机器和服务渠道的完整控制强化自主化层；也不同于 Hexagon 的模式，后者更看重工作流数据和工地系统，而不是直接改装机器。Built Robotics
              展示了另一种战略极端：深挖一个可重复的建筑工作流，这能做出更标准化的产品，但会缩窄可触达用例。Pronto 和 Polymath 重要，是因为它们证明自主化能力可以跨越非公路车辆类别流动，即使没有 Gravis
              这种精确工地焦点。因此，Gravis 竞争的核心不是原始功能数量，而是产品能否在真实承包商条件下干净嵌入重复性土方工作流。
