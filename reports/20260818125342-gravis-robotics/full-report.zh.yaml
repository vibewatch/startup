  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 推荐逻辑
        blocks:
          - type: paragraph
            body: >-
              Gravis 值得认真放进投资人观察名单，因为它用可信的自主化人才、可见的旗舰合作伙伴，以及 SoftBank 领投的强劲 $200M Series A
              轮，进攻一个巨大而痛苦的建筑问题。话虽如此，公开记录还不足以支撑高确信度的看多承保。原因很直接：Gravis
              的估值已经反映品类领导者野心，但公开证据在收入质量、利润率结构、客户转化深度和部署可重复性上仍然滞后。投资人能看到融资、改装逻辑和几个强客户品牌；还看不到商业队列、留存，或价值中有多少正在变成软件式而不是部署重。这个组合要求推荐纪律。证据足以继续跟进，但仅凭公开信息还不足以承保一个强买入。继续研究是合适结论，因为公司有前景，价格也已经不低。
            claimRefs:
              - CV001
              - CV002
