        title: 单位经济性和成本驱动因素
        blocks:
          - type: paragraph
            body: >-
              尽管数字不公开，单位经济性逻辑很直观。Gravis 把传感器、计算和控制系统安装到现有机器上，这意味着硬件和人工会进入销货成本，而纯 SaaS
              公司不会这样。现场运营和客户支持也很重要，因为公司的公开证明仍由部署驱动，并且处在有监督阶段。这是短期负担。长期上行在于，重复挖掘工作流正是那类可以通过反复安装剧本、更好软件和更低监督力度逐步改善利润率的运营环境。如果
              Gravis 能标准化更多安装流程、降低监督负担，并复制相似工地，毛利率应该朝正确方向移动。但如果每个项目都仍是定制化现场集成，业务会比估值叙事暗示的更偏服务。
