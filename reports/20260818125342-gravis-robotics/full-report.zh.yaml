    type: flow
    layout: wide
    summary: 建议遵循一条简单链路：问题足够大，验证有可信度，关键缺口仍在，价格已经拉高，因此维持中等信心的继续研究立场。
    data:
      nodes:
        - id: problem
          label: 痛点大且真实
          description: 劳动力短缺和安全压力，形成真实需求拉力。
        - id: proof
          label: 验证有可信度
          description: SoftBank 融资叠加合作伙伴和 OEM 引用，让投资假设仍站得住。
        - id: gaps
          label: 经济性仍未披露
          description: 收入队列、利润率、责任结构和部署杠杆仍未公开。
        - id: price
          label: $1.0B 进入点
          description: 当前估值已经预设了不低的未来执行成果。
        - id: rec
          label: 继续研究建议
          description: 保持跟踪，但需要更深入尽调，并用里程碑约束节奏。
      edges:
        - from: problem
          to: proof
