      - number: '6.4'
        title: 集中度和渠道风险
        blocks:
          - type: paragraph
            body: >-
              由于公开具名账户集合仍然很小，集中度风险今天几乎肯定有意义。对这个年龄的公司来说，这并不罕见，但它很重要，因为少数设计伙伴关系会塑造路线图、参考质量和近期收入。Gravis
              降低这种风险的最佳机会，是把强参考账户变成飞轮，打开相邻承包商，并最终打开租赁公司等渠道伙伴。数据中心和本土制造等终端市场尤其有吸引力，因为它们把进度紧迫性和大规模场地准备范围结合起来；但同样的大型项目往往也伴随严苛采购流程。因此，客户章节和财务章节落在同一个结论：Gravis
              的证明足以支持继续关注，但公开转化数据还不足以假设广泛、耐久的客户采用。渠道杠杆是接下来要看的关键上行。集中度和扩张必须放在一起评估，不能分开看。这个框架对承保纪律很重要。
            claimRefs:
              - CU021
              - CU022
              - CU023
              - CU024
              - CU025
              - CU032
              - CU033
              - CU035
