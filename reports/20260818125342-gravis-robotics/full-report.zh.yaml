chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源和商业模式
        blocks:
          - type: paragraph
            body: >-
              Gravis Robotics 现在已经清楚地从隐身实验室项目变成一家创立于 Zurich 的实体 AI 公司。官方页面、独立融资报道和合作伙伴公告都在讲同一个故事：公司 2022 年从 ETH Zurich
              孵化出来，要把自主作业能力改装到现有重型设备上，而不是要求承包商更换整支车队。这个差别很关键，因为它贴合建筑公司真实的购机方式——依赖既有车队、区域服务关系和多品牌混合运营习惯。Gravis Rack 与
              Slate 界面组合起来，使公司更像是给传统钢铁设备加一层自主化能力，而不是新的整机 OEM。商业化因此更可信，但 Gravis
              也必须同时解决现场部署、控制集成、支持和信任，而不只是软件模型表现。按实际尽调口径，本章确立后续章节必须沿用的基本事实：Gravis 卖的是现有车队的升级路径，而不是从零设计的新机器平台。
