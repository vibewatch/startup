      - number: '2.4'
        title: 增长驱动因素、约束和数据缺口
        blocks:
          - type: paragraph
            body: >-
              最强的公开需求驱动因素很直接：劳动力短缺、安全压力，以及更快交付项目带来的经济溢价。AGC 的 2025 年调查和 ABC 的劳动力估算都显示，劳动力市场仍然结构性紧张。CDC、BLS 和 OSHA
              材料进一步说明，建筑业依然高风险，因此即使不计生产率提升，自动化也有第二层逻辑。但同一组证据也说明，采用不会自动发生。建筑工地临时、动态且社会关系复杂；买方常常会先部署机器控制工具、增加操作员或调整排期，再承诺采用自主化。公开市场数据也仍然令人沮丧地不精确。我们知道宏观市场很大、痛点真实，但还没有一个干净的公开数据集能切出自主化预算、试点到生产的转化率，或让无操作员作业成为必需品的
              ROI 门槛。后续财务和估值章节需要一直盯住这些问题。
