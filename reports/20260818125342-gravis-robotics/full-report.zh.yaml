            body: >-
              Gravis 公开拥有的东西是资本。公司在 2025 年 7 月完成 $80M 启动融资，七个月后又完成 $200M Series A 轮，使公开披露累计融资至少约
              $223M。这给了它比多数早期自主化初创公司强得多的现金垫。它也告诉投资人一件重要的事：Gravis
              获得的是资本密集型扩张公司的融资方式，而不是小额融资的软件实验。对一家需要硬件、安全验证、客户部署团队以及潜在库存的公司来说，这很合理。未解决的问题是充足性，而不是绝对金额。没有烧钱速度、员工数或现金余额披露，外部投资人仍无法判断当前弹药库能支撑两年有纪律的执行，还是在部署快速扩张时只够更短的现金跑道。股权结构表广度显示
              Gravis 大概率还能再融资，但未来融资筹码取决于当前资本能否转化为可复制的商业证据。
