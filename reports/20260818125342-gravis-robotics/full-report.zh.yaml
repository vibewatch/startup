  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              任何把自主系统装到重型机械上的公司，都继承了很高的举证负担。建筑业本来就是危险行业，OSHA、CDC 和 BLS 材料清楚显示，即使还没有加入自主化，危险也持续存在。因此，Gravis
              不能只因为说自己的系统更安全就获得信用。它必须用监管方、客户和保险方都能信任的方式证明安全。Frontiers 和 ILO 的外部研究进一步强化这一点：机器人可以同时降低某些危险，也引入新的危险。对 Gravis
              来说，眼前的法律问题不是建筑业是否需要更好的安全工具——显然需要。问题在于，Gravis
              从有监督部署走向少人工介入作业时，能否建立可复制的责任和合规框架。公开层面这仍未解决。法律清晰度可能在相当长时间里落后于技术曲线，法院和保险方在实践中也可能适应缓慢。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR032
