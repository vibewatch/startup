      - number: '7.3'
        title: 人才、劳动力和采用风险
        blocks:
          - type: paragraph
            body: >-
              自主化采用从来不只是技术问题。它会改变工作组织方式，改变哪些人感到受威胁或被赋能，也改变客户在依赖系统前必须投入多少培训和信任建设。Gravis
              的合作伙伴引述很聪明，把产品描述为释放熟练操作员，让他们去做更有价值的任务，而不是简单替代他们。即便如此，Brookings、St. Louis Fed 和 ILO
              都显示，工人替代叙事可能变成真实的采用障碍。公司内部也面对经典初创公司执行风险：公开身份紧密绑定少数创始人，招聘很快，管理层梯队仍在追赶估值暗示的规模。如果变革管理或劳动力接受度落后于产品路线图，即使技术继续改善，客户扩张也会放慢。人的因素可能成为隐藏瓶颈。
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR030
              - CR033
