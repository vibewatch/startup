      - number: '8.3'
        title: 可比框架及其边界
        blocks:
          - type: paragraph
            body: >-
              Gravis 没有整齐的公开可比公司集合。Built Robotics 有用，因为它展示了一家初创公司如何围绕窄工作流做出建筑自动化切口，并随后仍然面对艰难的规模化选择。Caterpillar 和 Komatsu
              重要，因为它们展示了现有 OEM 能带到自主化中的渠道、融资和服务力量。Hexagon 和 Trimble 重要，因为工作流控制层即使不拥有完整机器栈，也能变得有力量。Teleo
              和相关车队现代化厂商重要，因为它们验证了买方愿意升级传统车队，而不是等待完全新的设备周期。但这些都不是干净的倍数可比。它们的产品、上市路径、资本需求和客户经济性差异太大。因此，本章把可比对象当作原型，而不是假装一张公开倍数表能解决问题。Gravis
              应该按它可能成为的样子估值——重型设备的跨品牌自主化层；同时也要承认，它可能永远达不到投资人今天隐含期待的规模或利润率。
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
          - type: table
            tableRef: TV004
