      - number: '3.4'
        title: 护城河耐久性和竞争风险
        blocks:
          - type: paragraph
            body: >-
              Gravis 正在形成的护城河不是某一项专利或硬件形态，而是现场数据、承包商集成和工作流专业知识的组合；部署扩大后，这些要素可以复利。这很有希望，但还不稳。OEM
              仍是最大威胁，因为它们控制机器平台、质保边界和服务渠道；如果它们决定积极进入同样的重复性土方用例，Gravis
              的改装优势可能收窄。同时，初创公司和软件层竞争者也显示，自主化栈本身可能随时间变得更可替换。Gravis
              今天最好的防守，是证明承包商信任它、系统能以最小扰动贴合客户工作流，并且有监督作业产生的现场数据能让产品改进速度快过对手追赶。换句话说，Gravis
              的护城河由学习速度驱动。它可以变得耐久，但前提是客户转化和部署重复先于巨头补上差距。这个类别仍足够年轻，执行速度极其关键。
