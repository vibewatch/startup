  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 谁在和 Gravis 竞争，为什么
        blocks:
          - type: paragraph
            body: >-
              Gravis 的竞争集合比“做建筑机器人的初创公司名单”更宽。最接近的类比对象，是那些解决同一个买方问题的公司——在更少依赖稀缺操作员的情况下，让重型设备产出更安全、更稳定。实际可以分成三类。第一类是 Built
              Robotics 这样的初创公司类比对象，它同样讲建筑自动化故事，但更集中在太阳能工作流。第二类是 Caterpillar 等 OEM
              巨头，它们可以把自主化直接嵌入基础机器，并带来经销商覆盖、服务能力和已建立的信任。第三类是 Hexagon、Pronto、Polymath
              等相邻自主化或工作流玩家，它们通过软件、数据、运输或平台工具切入市场，而不是采用 Gravis 的承包商共研模式。只有在比较工作流匹配度、渠道控制和上线就绪度时，Gravis
              的位置才说得通；把所有公司塞进一个宽泛机器人桶里并不能解释竞争。
