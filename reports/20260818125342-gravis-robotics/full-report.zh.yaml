        title: 工作流匹配和运营模式
        blocks:
          - type: paragraph
            body: >-
              公开证据对 Gravis 今天最适合的场景非常一致：大型工地上的重复挖掘和装车。这是特点，不是限制。重复性工作流最能让承包商感到劳动力短缺，也最能让机器通过更长工时、更低疲劳和更可预测的循环时间产生可量化
              ROI。Gravis
              的合作伙伴和媒体报道还显示，公司很努力地嵌入现有承包商运营，而不是强迫客户改用全新工作方式。安装套件，跑有监督作业，衡量进度，再复制。对一家年轻自主化公司来说，这是一条合理运营路径，因为它让客户在验证表现时仍能把人留在闭环附近。下一个问题是，这条路径会自然扩展到更广泛的工地自主化，还是只在狭窄的重挖掘任务中最有力。这个过渡将决定
              Gravis 是工作流解决方案，还是更广的平台。
