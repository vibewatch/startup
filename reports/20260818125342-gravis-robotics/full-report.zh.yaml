            body: >-
              本章的核心限制在于，Gravis
              对融资的披露远比经营表现清楚。公开来源没有提供收入、ARR、利润率、客户数、全公司员工数或烧钱速度。因此，今天无法诚实地套用传统收入倍数或按毛利率调整的框架。最有用的公开承保框架反而更简单：公司是否有足够资本推进路线图，现场证据积累速度是否足以支撑下一步估值？这个基础弱于投资人理想状态，但对现阶段私营公司仍有信息量。它迫使后续估值工作保持情景化，而不是假装精确。Gravis
