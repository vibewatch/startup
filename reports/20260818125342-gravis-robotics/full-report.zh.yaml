      - number: '8.2'
        title: 乐观 / 基准 / 悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              本章采用情景分析，因为点估值会暗示一种公开证据并不支持的精确性。乐观情景下，Gravis 把旗舰客户和 OEM
              参考转化为跨多个机器品牌和工地类型的可重复、少人工介入项目，让投资人相信软件和数据杠杆更耐久。基准情景下，它成为一家有价值但运营仍然较重的自主化专科公司，持续获得战略支持，并保持不错的部署动能。悲观情景下，客户继续喜欢演示和试点结果，却没有转化为足够广泛或盈利的规模化项目，使当前估值跑在证明之前。关键问题不是某个精确数字，而是区分这些路径的一组里程碑：安全和责任准备度、工地泛化表现、客户扩张，以及部署劳动在价值交付中占比下降的速度。情景纪律可以避免虚假精确，也能讲清投资人下一步应监控什么。
            claimRefs:
