            body: >-
              留存是公开证据很快断掉的地方。没有披露来源提供续约率、NRR、流失率或账户级扩张模式。今天最好的代理指标，是参考伙伴是否继续加深合作，以及 Gravis
              能否在不损失早期部署运营质量的情况下新增承包商。这有用，但不能替代队列数据。建筑科技可以赢下一个强试点，但如果培训负担、支持负荷或工作流扰动居高不下，仍可能难以变成重复运营预算项。Gravis
              的承诺是，在需要时保留人工监督，同时帮助施工队处理重复性土方。如果承诺成立，扩张应该可能；如果不成立，客户关系可能停留在浅层、项目特定状态。眼下，耐久性更多是尽调问题，而不是公开事实。投资人应把留存视为未解决，而不是默认存在。可重复性仍是公开层面缺失的商业门槛。
