              - CV023
      - number: '8.4'
        title: 打破投资逻辑的触发点和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最终投资判断应转向少数几个决定性事实。如果 Gravis 能证明安全、可重复的部署扩张、改善中的软件杠杆和可信的客户队列经济性，当前估值仍可能说得通。反过来，如果出现安全事故、客户停在试点阶段，或相邻巨头在
              Gravis
              规模化之前更快补上差距，投资人就应假设估值过高。这里的纪律，是在下一轮叙事动能到来之前先定义止损触发点。因此，最终尽调问题应该务实而不是学术：收入和毛利率队列、安全与保险包、从有监督到少人工介入自主化的过渡里程碑，以及能明确下行保护的股权结构表或优先权细节。没有这些，信心最多只能保持中等。有了这些，Gravis
              可能从有意思的建筑科技自主化押注，变成可投资的高确信度案例——也可能变成更清晰的放弃。眼下，里程碑应比故事本身更能决定定价。
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
