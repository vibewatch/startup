  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 变现模式和收入形态
        blocks:
          - type: paragraph
            body: >-
              Gravis
              的公开材料不像一家标准软件公司，因为产品并非纯靠代码交付。公司在客户工地改装重型设备，这意味着除任何经常性自主化软件收费外，收入里至少会有一些安装、校准和部署服务。时间拉长后，经济承诺大概率会转向软件、远程监控和多机编排，尤其是在
              Gravis 成功从有监督单机部署走向协同车队之后。但现有证据指向混合模式：先有服务较重的收入把机器跑起来，随后如果客户让系统留在生产环境中，再形成经常性价值。这个组合在战略上有吸引力，因为它绑定真实工地
              ROI；但也意味着公司今天很可能还没有软件式利润率。承保时的关键不是 Gravis 究竟是“软件”还是“硬件”，而是重复部署能多快把业务推向杠杆更高的经常性收入结构。
