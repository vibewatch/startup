      - number: '7.2'
        title: 运营和依赖风险
        blocks:
          - type: paragraph
            body: >-
              Gravis
              的运营风险来自一个事实：它的系统必须在临时、杂乱、变化中的工地上工作，而不是在受控工厂里工作。粉尘、地形变化、移动卡车和施工人员都会提高感知、规划和现场运营的负担。公开证明令人鼓舞，但仍处在有监督阶段，因此不同于完全成熟的产品。依赖图谱会进一步放大这一点。Gravis
              需要承包商伙伴来学习和证明，需要现场团队保证部署质量，还需要持续兼容并非自己制造的机器。资本也是一种依赖，因为一家全栈自主化公司可能在商业经济性清晰之前就大量花钱。这并不让业务不可行，但意味着规模化路径更少依赖纯软件分发，而更依赖在多个外部约束下有纪律地执行系统。运营卓越不仅是成本中心，也是风险控制。
            claimRefs:
