        title: 技术架构和关键依赖
        blocks:
          - type: paragraph
            body: >-
              即使公司没有发布技术白皮书，Gravis 的架构逻辑也很清楚。创始人相信，在 ETH
              和现场发展出的数据驱动自主化技术可以迁移到建筑业；在这里，机器必须实时理解地形、移动资产和工地目标。这个挑战比直线导航更难，因为建筑设备不只是穿过世界；它一边工作一边改变世界。这意味着感知、规划和控制都必须跟上动态地形，也要跟上附近作业的人和卡车。它还意味着现场运营会成为技术系统的一部分，因为部署质量、校准和客户信任都会影响软件能否发挥作用。对
              Gravis 来说，产品架构和运营架构不可分割。因此，数据、现场支持和承包商共研都不是可选附加项，而是依赖。产品必须同时在技术和运营上跑通。
