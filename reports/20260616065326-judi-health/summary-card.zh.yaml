summary:
  headline: >-
    Judi Health 正在搭一个结构上有差异的透明 PBM 和统一理赔平台，规模已经可观；但 2025 年 9 月 $3.25B 估值计入了大量从未公开披露的 admin-fee
    收入增长。在单位经济性确认前，应以中等确信度维持跟踪。
