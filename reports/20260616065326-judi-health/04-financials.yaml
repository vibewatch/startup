  - id: traction-metrics
    title: Traction Metrics and Growth Trajectory
    body: >
      Capital Rx has achieved meaningful scale in contracted PBM lives while maintaining a significant gap between
      contracted and live (revenue-generating) members. As of January 2026, the company surpassed five million contracted
      employer PBM lives, with approximately one million members live and actively using the platform—a live-to-contracted
      ratio of roughly 20 percent. During calendar 2025, the company contracted and implemented two million new health plan
      lives and signed more than 80 new client partnerships for the second consecutive year, including 13 Fortune 500
      corporations and 21 leading hospital groups. This demand is corroborated by the September 2025 Series F being
      described as oversubscribed. Beyond employer PBM lives, the Judi® platform has 54 million-plus health plan lives
      contracted across Capital Rx's full portfolio (including the Prime Therapeutics alliance), though this figure includes
      lives administered by Prime whose revenue economics flow primarily to Prime, not directly to Judi Health. The company
      cited an internal proof-of-concept on its own employee health plan: 11 percent year-over-year cost savings on 1,800
      members with claims-processing time reduced to 18 days (versus more than six months previously). For the nascent
      unified medical-and-pharmacy administration product, Judi Health reported only roughly 40,000 lives as of September
      2025, highlighting the early stage of that revenue stream. Revenue growth trajectory shows consistent acceleration:
      $429 million gross revenue in 2021, $814 million estimated for 2022, approximately $2.1 billion in 2024, and
      approximately $3.7 billion expected in 2025—compounding at roughly 75 percent in the most recent year. However,
      without admin-fee net revenue disclosure, the interpretation of these topline figures remains limited.
    claimRefs:
