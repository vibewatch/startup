  - id: unit-economics
    title: Unit Economics and Gross Margin Analysis
    body: >
      Because Judi Health has not disclosed admin-fee net revenue, gross margin, cost per member, or per-claim operating
      cost data, the unit economics analysis must rely on structural inference and public comparator benchmarks. The company's
      pass-through revenue accounting model—where drug costs flow through the company's books as both revenue and cost of
      goods—means that gross revenue figures ($2.1 billion in 2024, $3.7 billion expected in 2025) are not comparable to
      the revenue of pure-technology SaaS businesses. The actual admin-fee contribution is estimated at 1-5 percent of
      gross revenue, implying an admin fee revenue range of roughly $21 million to $185 million in 2025—though this range
      is wide and remains unverified. CVS Health's Caremark business, disclosed in the CVS Health 2025 Form 10-K filed with
      the SEC in February 2026, processed 1.9 billion prescriptions at scale with approximately 87 million plan members,
      providing a benchmark for what large-scale PBM operational efficiency looks like. The Big Three PBMs generate profit
      primarily through rebate retention and spread pricing—both absent from Capital Rx's model. Capital Rx's model should
      therefore generate lower gross revenue per member but potentially higher net margins on the admin fee component if
      operating leverage is achieved. The internal health plan data (11 percent cost savings, 18-day claims cycle) suggests
      operational efficiency gains are real, but evidence for the margin profile at commercial scale is entirely missing.
      A critical diligence blocker is that investors and underwriters cannot independently assess the gross margin, sales
      efficiency (CAC), or payback period from publicly available sources. The ratio of live members (1 million) to
      contracted lives (5 million) creates a natural revenue ramp path but also a timing risk: if contracted clients defer
      go-live dates or reduce scope, the anticipated revenue uplift may be delayed substantially.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI036
