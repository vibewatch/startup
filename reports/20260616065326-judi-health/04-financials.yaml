  - id: financial-verdict
    title: Financial Verdict and Underwriting Limits
    body: >
      Judi Health presents a financially credible but analytically incomplete picture. The evidence base supports
      high-confidence conclusions on total capital raised ($607 million), post-money valuation ($3.25 billion), gross
      revenue trajectory ($429 million in 2021 to an expected $3.7 billion in 2025), and contracted member growth (5
      million employer lives). The SEC Form D filings independently corroborate the disclosed round amounts. The business
      model—flat-fee, pass-through PBM administration plus SaaS platform licensing—is structurally sound and aligns
      management and client incentives better than the opacity-based incumbent model. However, the following inputs are
      insufficient for financial underwriting: actual admin-fee net revenue; gross margin on the admin segment; unit
      economics (admin fee PMPM, CAC, payback, churn); monthly cash burn and runway; Prime Therapeutics alliance financial
      terms; EHP licensing economics; and any meaningful revenue contribution from the nascent medical administration
      product. The company's valuation-to-gross-revenue ratio is approximately 0.9x ($3.25 billion / $3.7 billion), which
      optically looks inexpensive relative to pure-SaaS multiples but is distorted by pass-through drug costs that inflate
      the denominator. On a hypothetical admin-fee-only basis, the valuation multiple would be far higher and typical of
      growth-stage health-tech. The PBM Reform Act of 2025 and ongoing FTC enforcement actions present regulatory upside
      (tailwinds for transparent PBMs like Capital Rx) rather than downside risk, per management's own characterization.
      The live-to-contracted gap represents the single most consequential near-term financial risk: the difference between
      a $20 billion business (investor thesis) and a well-funded but still pre-scale platform.
    claimRefs:
      - CI041
      - CI042
      - CI043
      - CI044
      - CI045
    tableRefs:
      - TI005

