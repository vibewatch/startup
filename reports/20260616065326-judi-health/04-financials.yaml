  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit economics
      missingEvidence: "Admin-fee net revenue, gross margin, and PMPM fee rate—the core unit economics of the business—have not been disclosed in any public source."
      whyItMatters: "Without admin-fee net revenue, it is impossible to assess true revenue quality, profitability path, or valuation multiple on a like-for-like basis; the $3.7B gross revenue figure is commercially misleading as a primary financial metric."
      diligencePath: "Request an audited or management-certified segment P&L separating admin-fee revenue from drug-cost pass-through, available under NDA."
      relatedQuestionRefs: [QI005, QI006, QI019]

    - type: private-evidence-only
      severity: blocking
      topic: capital adequacy
      missingEvidence: "Monthly cash burn rate, total cash on hand, and forward-looking runway are not disclosed in any publicly accessible source."
      whyItMatters: "Cannot independently assess capital adequacy or verify whether the $252M Series F provides sufficient runway to reach profitability or the next capital event."
      diligencePath: "Request CFO presentation of trailing 12-month cash flow statement, current cash balance, and 24-month forward cash forecast."
      relatedQuestionRefs: [QI011]

    - type: private-evidence-only
      severity: material
      topic: Prime alliance economics
      missingEvidence: "Financial terms of the Prime Therapeutics exclusive technology alliance, including fee structure, revenue-sharing mechanics, minimum volume commitments, and exit or non-renewal provisions."
      whyItMatters: "Prime Therapeutics represents both a key revenue driver (platform licensing) and a concentration risk; the terms of this relationship directly affect revenue stability and gross margins on the EHP segment."
      diligencePath: "Request the full text of the Prime Therapeutics exclusive technology agreement including all financial schedules."
      relatedQuestionRefs: [QI021]

    - type: private-evidence-only
      severity: material
      topic: live member ramp
      missingEvidence: "Go-live timelines, conversion rates, and implementation success rates for the approximately 4 million contracted employer lives not yet active as of January 2026."
      whyItMatters: "The live-to-contracted ratio of approximately 20 percent creates uncertainty about when contracted revenue will materialize; deferred go-lives or cancellations would significantly affect 2026 financial performance."
      diligencePath: "Request a signed-contract go-live schedule with probability weights, implementation milestone tracking, and historical conversion rate from contracted to live."
      relatedQuestionRefs: [QI010, QI012]

    - type: private-evidence-only
      severity: material
      topic: unit economics
      missingEvidence: "Customer acquisition cost (CAC), payback period, gross margin by client segment, and client churn or renewal rate—all standard SaaS and health-tech diligence metrics."
      whyItMatters: "These metrics determine whether the business is building durable, capital-efficient revenue or burning capital on low-margin accounts that churn before generating positive lifetime value."
      diligencePath: "Request cohort-level unit economics dashboard including CAC by channel, payback period, and annual retention rate for employer and health plan segments."
      relatedQuestionRefs: [QI006, QI023]

    - type: private-evidence-only
      severity: material
      topic: EHP licensing
      missingEvidence: "Judi® EHP and Judi Care license fee structure, average contract value (ACV), and renewal rate for non-Prime licensees."
      whyItMatters: "SaaS platform licensing is central to the General Catalyst $20B thesis; without disclosed economics this segment cannot be independently valued."
      diligencePath: "Request representative license agreements or average ACV, term, and NRR for the EHP licensing business."
      relatedQuestionRefs: [QI027, QI023]

    - type: missing-source
      severity: minor
      topic: adverse financials
      missingEvidence: "No known public adverse financial finding, short seller report, or independent audit critique specifically targeting Capital Rx / Judi Health financial practices."
      whyItMatters: "Absence of adverse financial coverage may reflect private company opacity rather than genuine absence of issues; regulatory disclosures are limited to Form D."
      diligencePath: "Review FTC PBM study data for any Capital Rx-specific references; request compliance officer attestation regarding regulatory interactions."
      relatedQuestionRefs: [QI020]

