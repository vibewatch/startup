callouts:
  - calloutType: risk
    title: Pass-Through Revenue Inflates Topline Metrics
    body: >
      Judi Health's reported gross revenue ($3.7 billion expected in 2025) includes the full drug-cost pass-through that
      flows through the company's accounts. Because Capital Rx does not bear drug cost risk, this topline figure is not
      comparable to SaaS or pure-technology revenues. The actual admin-fee earned revenue—the commercially relevant
      metric—is estimated at 1–5 percent of gross and has never been disclosed. Any valuation or growth analysis based
      solely on the gross revenue figure risks materially overestimating economic progress.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI033

  - calloutType: risk
    title: Live-to-Contracted Gap Is the Near-Term Revenue Risk
    body: >
      With only approximately one million live members out of five million contracted employer PBM lives as of January
      2026, Judi Health carries a 4-to-1 pipeline-to-active ratio. If contracted clients defer go-live dates, reduce scope,
      or churn before activation, the revenue ramp embedded in investor expectations may not materialize on schedule. The
      company has not disclosed go-live timelines, implementation success rates, or churn among contracted but not-yet-live
      accounts.
    claimRefs:
      - CI013
      - CI014
      - CI040
      - CI043

  - calloutType: insight
    title: Investor Thesis Implies Significant Long-Run Revenue Headroom
    body: >
      General Catalyst's lead investor described Judi Health as "absolutely a $20 billion business to be built here,"
      implying expected revenue at scale 5-to-6 times the current $3.7 billion gross run rate or 100x+ the estimated
      admin-fee net revenue. This thesis rests on the expansion of unified medical-plus-pharmacy administration to
      additional health plans, TPAs, and employers—a market currently nascent with only ~40,000 lives in the medical
      product as of September 2025.
    claimRefs:
      - CI031
      - CI018
      - CI006

  - calloutType: recommendation
    title: Underwriting Requires Admin-Fee P&L Disclosure
    body: >
      Before underwriting Judi Health's financial risk, any investor or counterparty should require: (1) admin-fee net
      revenue segregated from drug-cost pass-through; (2) gross margin by segment; (3) trailing 12-month cash burn and
      balance sheet; (4) live-member go-live schedule and probability-weighted revenue forecast; and (5) Prime Therapeutics
      alliance financial terms. Without these five disclosures, financial underwriting is not supportable from publicly
      available data.
    claimRefs:
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041

