chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Judi Health (formerly Capital Rx) addresses three nested markets simultaneously: the global PBM services
    market — measured as total managed prescription drug spend and estimated at $647–$755 billion in 2026 by
    major analysts, though this figure includes drug cost pass-through and is not a pure administrative-fee TAM
    — the emerging cloud-native health benefits administration software market valued at $2.01 billion in 2026,
    and the broader U.S. self-insured employer health benefits pool where the DOL reports 50,700+ self-insured
    plans covering 39+ million participants. The economic buyer is the large self-insured employer, union trust,
    or health plan seeking to replace opaque, vertically-integrated incumbent PBMs with aligned,
    technology-driven administration. The Big Three PBMs (CVS Caremark, Express Scripts, OptumRx) process 80%
    of all U.S. prescription claims per Drug Channels 2026, an oligopoly the Consolidated Appropriations Act of
    2026 — signed February 3, 2026 — begins to unwind by mandating flat-fee PBM compensation in Medicare Part D
    (effective 2028), 100% rebate pass-through, and semiannual transparency reporting. Independent and
    transparent PBM adoption grew from 12% to 31% of employer plans between 2024 and 2025. Key demand drivers
    include a 9% median employer healthcare cost trend in 2026, accelerating specialty drug costs led by GLP-1s
    (21–40% annual increase for plans covering them), benefit fragmentation, and AI-driven administration
    efficiency. Key constraints include multi-year incumbent contracts, implementation disruption risk, ERISA
    fiduciary caution, RFP cycle length, and the capital intensity required to run a full-stack claims
    adjudication platform. The precise administrative-fee SAM and Judi Health's serviceable obtainable market
    are diligence gaps: no public source isolates the independent transparent-PBM service fee pool as a
    distinct, auditable market segment.

sections:
  - id: market-boundary
    title: "Market boundary: PBM services, self-insured employer administration, and the platform adjacency"
    body: >-
      Judi Health competes at the intersection of three partially overlapping markets, and defining each
      boundary clearly matters for sizing and valuation.

      The core market is U.S. pharmacy benefit management, which covers the intermediary functions that sit
      between drug manufacturers, pharmacies, health plan sponsors, and plan members. Included in this market:
      pharmacy claims adjudication and payment; formulary design and tier management; rebate negotiation with
      manufacturers; specialty pharmacy management including prior authorization and utilization review; retail
      pharmacy network contracting; and mail-order dispensing. Excluded from the PBM-services boundary are the
      underlying drug acquisition cost itself (which PBMs pass through to plan sponsors), medical claims
      processing (which is a distinct TPA or insurer function), drug wholesale distribution, and drug
      manufacturing. The PBM "market size" figures published by market-research firms — ranging from $647
      billion to $755 billion for 2026 — include the pass-through drug spend that PBMs administer on behalf of
      plan sponsors, not just PBM service fee revenue. This distinction is critical: Judi Health's actual
      addressable fee pool is a small fraction of these headline numbers. The company's Capital Rx transparent
      PBM charges flat administrative fees per member per month, not a percentage of drug spend, so its
      serviceable market is the pool of administrative service contracts available to be won rather than the
      total drug cost managed.

      The second market layer is health benefits administration more broadly — the platform and services
      business of designing, managing, adjudicating, and reporting on employer health plans across pharmacy,
      medical, dental, and vision. The Judi Enterprise Health Platform (EHP) competes here against traditional
      TPAs, health plan administrative services organizations (ASOs), and standalone benefits administration
      software vendors. Mordor estimates the global benefit administration software market at $2.01 billion in
      2026, growing to $3.27 billion by 2031 at a 10.23% CAGR. This is the cleanest analogue for Judi's
      platform licensing TAM, though it omits the larger TPA administrative services revenue pool.

      The third layer is the total U.S. employer-sponsored health benefit ecosystem — the aggregate pool of
      employer health plan administration fees and managed drug spend from which any PBM or health benefits
      platform extracts revenue. The DOL's 2026 Report to Congress on Self-Insured Group Health Plans
      identifies 50,700 self-insured plans and 4,800 mixed-insured plans with aggregate participant counts
      of 39 million and 33 million respectively. These are the plan sponsor entities from which Judi Health's
      Capital Rx PBM contracts are drawn.

      Status-quo substitutes are primarily the three vertically integrated PBMs — CVS Caremark (CVS Health),
      Express Scripts (Cigna/Evernorth), and OptumRx (UnitedHealth Group) — which together process 80% of all
      U.S. equivalent prescription claims in 2025 per Drug Channels Institute. These incumbents bundle PBM
      services with health insurance, specialty pharmacy, and increasingly care management, creating a
      competitive moat based on vertically integrated economics. Independent substitutes include pass-through
      and transparent PBMs such as Navitus and Padriac, traditional TPAs such as HealthComp, Meritain, and
      UMR, and broader benefits technology platforms such as Businessolver and Employee Navigator. Adjacent
      expansion markets for Judi Health include care navigation (now addressed by Judi Care, acquired via
      Amino Health), Medicare Part D PBM contracts (a different regulatory environment from the employer PBM
      market), and specialty pharmacy services (dominated by PBM-affiliated chains).
