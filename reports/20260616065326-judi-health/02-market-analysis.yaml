  - id: buyer-map
    title: "Buyer, user, and payer map: large employers and health plans demand aligned partners across a fragmented benefit stack"
    body: >-
      Judi Health's buyer universe spans several distinct economic buyer archetypes, each with different
      budget ownership, procurement timelines, and adoption triggers.

      Large self-insured employers (broadly, those with 500+ employees and most commonly those with 1,000+)
      are the primary target for Capital Rx's transparent PBM services. The economic buyer is typically the
      VP of Benefits or Chief Human Resources Officer in collaboration with the CFO, who owns the total cost
      of health benefits. The user is the employee or covered dependent navigating pharmacy benefits. The
      payer is the employer who bears the actuarial risk under a self-funded structure, often with stop-loss
      reinsurance. Adoption trigger is a combination of plan renewal, dissatisfaction with incumbent PBM
      cost transparency, or a benefits strategy review prompted by escalating cost trend — the Business Group
      on Health reports that 79% of large employers experienced increases in GLP-1 utilization in 2025, with
      employers expecting 11–12% pharmacy cost increases from 2025 into 2026. Fortune 500 companies are
      Judi Health's highest-profile buyer segment; the company signed 13 Fortune 500 new partnerships in 2025.

      Jumbo employers (10,000+ employees, especially Fortune 500) are the most sophisticated and
      highest-value targets. More than 90% of jumbo employers use self-funded health plans. These organizations
      have dedicated benefits teams, robust RFP processes, ERISA fiduciary oversight, and multi-year contracts
      with large incumbent PBMs and TPAs. Procurement cycles of 12–24 months are common. The adoption trigger
      is often a strategic review driven by cost escalation, legislative changes (the CAA 2026 transparency
      mandates create a natural audit point), or competitive pressure for benefits equity.

      Union health plans (Taft-Hartley trusts) are multi-employer benefit funds for workers in construction,
      hospitality, entertainment, and other union-dense sectors. They are large self-funded entities with
      complex eligibility rules (hour banks, contribution rates), collective bargaining commitments, and cost
      stewardship obligations to union trustees. Several union plans are among Judi Health's client base
      per the company's January 2026 press release, though individual clients are not named.

      Public sector employers — state governments, municipalities, counties, universities, and K-12 school
      districts — operate self-insured plans subject to public budget scrutiny, collective bargaining, and
      regulatory reporting. Several state employee plans are among Judi Health's announced 2025 partnerships.
      The adoption trigger here is often political or legislative: PBM reform legislation and executive orders
      mandating cost transparency create procurement urgency.

      Hospital systems and health systems (integrated delivery networks) are both employers (they self-insure
      their own employee health benefits) and potential technology customers (for the Judi adjudication
      platform). Judi Health signed 21 hospital group and health system partnerships in 2025. These
      organizations' mission alignment with healthcare reform and their sophistication in clinical data make
      them receptive to the NADAC-anchored, data-transparent model.

      Health plans and Blue Cross Blue Shield plans are the largest buyers of the Judi EHP adjudication
      platform. Prime Therapeutics — a PBM owned by 19 Blue Cross Blue Shield plans collectively covering
      50+ million members — is the anchor client, contracting to run on Judi as its exclusive adjudication
      platform and migrating two health plans in 2025. The economic buyer in health plans is the CIO and VP of
      Operations; the adoption trigger is technology modernization from legacy systems, cost efficiency, and
      the need for unified pharmacy and medical claims processing.

      Third-party administrators (TPAs) are a distribution channel and a buyer: they can embed the Judi
      platform to serve the employers they administer, multiplying Judi Health's reach without direct
      employer sales effort. The TPA market serves many of the 50,700+ self-insured employer plans.
