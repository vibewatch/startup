callouts:
  - calloutType: risk
    title: "Admin-fee SAM obscured by managed-spend headline figures"
    body: >-
      The commonly cited $647B–$755B global PBM market includes drug cost pass-through, not just service fees.
      Judi Health's economic model is built on flat administrative fees, making those headline figures a poor
      proxy for its real TAM. Investors should model from estimated PMPM rates × addressable lives, and push
      for disclosure of actual PMPM range in diligence.
    claimRefs:
      - CM052
      - CM001
      - CM004

  - calloutType: strength
    title: "CAA 2026 regulatory reform converts incumbent liability into Judi Health opportunity"
    body: >-
      The Consolidated Appropriations Act of 2026 mandates flat-fee PBM compensation (effective 2028) and
      rebate passthrough — structural elements that Capital Rx already practices. Incumbent PBMs must
      restructure their business models; Judi Health enters the post-reform era already compliant.
    claimRefs:
      - CM040
      - CM041
      - CM042

  - calloutType: insight
    title: "Contracted-to-live lives gap is the key operational metric to track"
    body: >-
      The 5:1 ratio of contracted to live employer PBM lives (5M vs. ~1M as of January 2026) reveals that
      implementation capacity, not sales, is the near-term binding constraint on revenue recognition.
      Monitoring the rate at which contracted lives go live will be the leading indicator of 2026–2027 revenue
      growth.
    claimRefs:
      - CM032
      - CM047
      - CM048

