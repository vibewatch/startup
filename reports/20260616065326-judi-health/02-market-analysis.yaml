figures:
  - id: FM001
    title: Market sizing pyramid — from global PBM managed spend to Judi Health's serviceable market
    type: pyramid
    layout: standard
    summary: >-
      The global PBM headline market includes massive drug-cost pass-through; each successive layer narrows to
      the service-fee pool actually addressable by a transparent independent PBM like Judi Health.
    data:
      nodes:
        - label: "Global PBM managed drug spend market (2026, Mordor est.)"
          value: 692.47
          unit: USD bn
        - label: "U.S. PBM managed drug spend (Fortune est.: 96.96% of global)"
          value: 626.8
          unit: USD bn
        - label: "U.S. self-insured employer + mixed-insured plan market (~45% of U.S. managed spend, estimated)"
          value: 282.0
          unit: USD bn
        - label: "Transparent/independent PBM admin-fee TAM (72M participants × $25–$60 PMPM, estimated)"
          value: null
          unit: USD bn
          note: "Range $22B–$52B; Judi Health PMPM undisclosed; estimate only"
        - label: "Judi Health employer PBM contracted lives — current SOM proxy"
          value: null
          unit: USD bn
          note: "5M contracted lives; ~1M live; admin fee revenue not disclosed"
    approximationNotes: >-
      Layer 3 ($282B) is derived by applying Mordor's 45.25% employer-sponsored segment share to Fortune's
      U.S. figure — a cross-analyst calculation that carries low confidence. Layer 4 is an estimated range
      using industry-context PMPM rates not confirmed by Judi Health. Layers 4 and 5 are left null because
      no primary source validates a precise dollar figure; they represent evidence gaps rather than confirmed
      market sizes.
    claimRefs:
      - CM010
      - CM011
