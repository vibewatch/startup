  claims:
    - id: CM001
      statement: The pharmacy benefit management industry functions as an intermediary between drug manufacturers, pharmacies, health plan sponsors, and plan members, primarily in the United States.
      type: third-party-reported
      topic: market-boundary
      sourceRefs: [SM003, SM007]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001]

    - id: CM002
      statement: PBM market size figures published by market-research firms ($647B–$755B globally in 2026) include the pass-through drug cost that PBMs administer on behalf of plan sponsors, not solely administrative service fee revenue.
      type: inferred
      topic: market-boundary
      sourceRefs: [SM007, SM008, SM003]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001, QM021]

    - id: CM003
      statement: Capital Rx charges a flat per-member-per-month administrative fee rather than earning revenue through drug-price spread or retained rebates, making the service-fee pool rather than total managed drug spend the relevant TAM for its business model.
      type: company-claimed
      topic: market-boundary
      sourceRefs: [SM013, SM022, SM005]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001, QM021]

    - id: CM004
      statement: The Judi Enterprise Health Platform (EHP) competes in the benefit administration software and platform licensing market estimated at $2.01 billion in 2026 by Mordor Intelligence, growing at 10.23% CAGR to $3.27 billion by 2031.
      type: third-party-reported
      topic: market-boundary
      sourceRefs: [SM009, SM023]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM004]

    - id: CM005
      statement: The status-quo substitute for Judi Health's Capital Rx transparent PBM is the vertically integrated incumbent PBM market dominated by CVS Caremark (CVS Health), Express Scripts (Cigna/Evernorth), and OptumRx (UnitedHealth Group).
      type: third-party-reported
      topic: market-boundary
      sourceRefs: [SM001, SM003]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001, QM005]

    - id: CM006
      statement: Adjacent markets for Judi Health include care navigation (addressed by Judi Care via Amino Health), Medicare Part D PBM contracts (a different regulatory environment), and specialty pharmacy services (currently dominated by PBM-affiliated chains).
      type: inferred
      topic: market-boundary
      sourceRefs: [SM013, SM022, SM027]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM006]

    - id: CM007
      statement: U.S. pharmacies affiliated with the three largest PBMs (CVS Caremark, Express Scripts, OptumRx) account for nearly 70% of all specialty drug revenue, making specialty pharmacy a quasi-captive market for the Big Three.
      type: third-party-reported
      topic: market-boundary
      sourceRefs: [SM003, SM027]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM007]

    - id: CM008
      statement: "Included in the PBM services market: pharmacy claims adjudication and payment, formulary design, rebate negotiation, specialty drug programs, prior authorization, utilization review, retail pharmacy network contracting, and mail-order dispensing."
