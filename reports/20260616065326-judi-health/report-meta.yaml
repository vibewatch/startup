summary:
  headline: >-
    Judi Health is building a structurally differentiated transparent PBM and unified claims platform
    at meaningful scale, but the $3.25B September 2025 valuation prices in substantial admin-fee
    revenue growth that has never been publicly disclosed, warranting a Track stance with medium
    conviction pending confirmation of unit economics.
