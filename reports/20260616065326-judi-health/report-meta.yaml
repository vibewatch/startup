    September 2025 at a $3.25B post-money valuation; $607M total equity raised across seven rounds
    since 2018; prior milestone was a $1.5B Series E valuation (March 2024) when Prime Therapeutics
    became a strategic minority investor
  disclosureProfile: private-undisclosed
