  foundingLocation: New York, NY, United States
  headquarters: New York, NY, United States
  productSummary: >-
    Capital Rx (transparent PBM with flat-fee NADAC pricing), the Judi Enterprise Health Platform
    (EHP — cloud-native unified pharmacy and medical claims engine licensed to Prime Therapeutics and
    other health plans), and Judi Care (AI-powered care navigation and provider search, acquired from
    Amino Health in June 2025)
  customerFocus: >-
    Self-insured employers (5M+ contracted PBM lives), health plans including Prime Therapeutics
    (54M health-plan lives on Judi EHP), third-party administrators, government entities, and
    enterprise clients including 13 Fortune 500 corporations and 21 leading hospital groups
  businessModel: >-
    Flat administrative fee per member per month or per claim (no drug-spread or rebate retention);
    drug costs fully passed through to plan sponsors at NADAC pricing; SaaS licensing of the Judi EHP
    to health plans under the Prime Therapeutics exclusive technology agreement; care-navigation
    subscription revenue via Judi Care
  stage: "Late-stage private (post-Series F)"
  fundingStatus: >-
