companyProfile:
  summary: >-
    Judi Health (corporate parent: Capital Rx, Inc.) is a New York-based enterprise health technology
    company and transparent pharmacy benefit manager founded in 2017 by AJ Loiacono and Ryan Kelly.
    The company rebranded from Capital Rx to Judi Health in September 2025, concurrent with a
    $400 million financing event ($252M Series F equity plus ~$150M secondary) at a $3.25 billion
    post-money valuation on $607 million total raised. Its flagship products—the Capital Rx PBM
    (flat-fee, NADAC-priced) and the Judi Enterprise Health Platform (EHP, cloud-native unified
    claims engine)—serve self-insured employers, health plans, and third-party administrators. By
    January 2026 the company exceeded five million contracted employer PBM lives and 54 million
    health-plan lives via its Prime Therapeutics alliance, with estimated 2025 gross revenue of
    ~$3.7 billion (up more than 75% year-over-year). Care-navigation capabilities were added via the
    June 2025 acquisition of Amino Health (rebranded Judi Care).
  foundedDate: "2017-01-01"
