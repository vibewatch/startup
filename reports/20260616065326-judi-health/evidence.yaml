evidenceGaps:
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: >-
      Official headcount figures or a company-issued employee count from a press release, regulatory filing, or investor
      presentation for Judi Health as of mid-2026.
    whyItMatters: >-
      Workforce size and growth rate are proxies for operational scaling capacity and cost structure; without headcount,
      the relationship between revenue growth and expense growth cannot be assessed.
    diligencePath: >-
      Request official employee count and function-level breakdown in diligence; cross-reference LinkedIn active
      employee profiles; request payroll records in formal data room.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements including EBITDA, net income, gross margin, burn rate, and balance sheet; revenue
      breakdown separating net administrative fee revenue from pass-through drug spend.
    whyItMatters: >-
      Gross revenue including drug spend ($3.7B) substantially overstates the company's actual services revenue. Judi
      Health operates as a technology and administration layer—not a drug payer—so gross margin and unit economics are
      the key valuation inputs, and without them the $3.25B valuation cannot be rigorously assessed.
    diligencePath: >-
      Obtain audited financial statements under NDA; require management accounts showing net fee revenue, direct costs,
      and EBITDA; model gross-to-net revenue adjustment for pass-through drug spend.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Any new partnerships, acquisitions, product launches, regulatory developments, or customer wins announced by Judi
      Health in H1 2026 beyond the January 2026 contracted lives milestone.
    whyItMatters: >-
      The milestone table coverage ends in January 2026; material developments between January and June 2026 may be
      absent from this chapter's chronology.
    diligencePath: >-
      Monitor Judi Health press page, PR Newswire, industry news feeds, and SEC Form D filings for the period
      January–June 2026; conduct a targeted news search with 2026 date filter.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Full board of directors composition, investor voting rights, protective provisions, and governance agreements;
      specific ownership percentages for each investor; any governance changes since the Series F close.
    whyItMatters: >-
      Board composition and control terms determine whether founders maintain operational independence, and investor
      protective provisions could constrain strategic decisions including an exit, secondary sale, or IPO path.
    diligencePath: >-
      Review articles of incorporation and certificate of designation in Delaware filing database; request shareholder
      agreement, voting trust, and board minutes under NDA in formal diligence.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      Revenue recognition policy clarifying what is included in the $3.7B gross revenue figure and what the net
      administrative-fee revenue and gross margin are; Forbes notes the figure is comparable to Fidelity's recordkeeping
      model where only fees, not AUM, are revenue.
    whyItMatters: >-
      If the $3.7B is primarily pass-through drug spend, the company's actual services revenue may be a small fraction
      of that figure, materially affecting revenue-multiple valuation analysis and comparability to traditional SaaS or
      technology company peers.
    diligencePath: >-
      Request revenue recognition policy; segregate administrative fee revenue (PMPM or per-claim) from pass-through
      drug cost; compute gross margin on services revenue only.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: transparent-PBM-admin-fee-SAM
    relatedQuestionRefs:
      - QM022
    missingEvidence: >-
      Judi Health's administrative fee PMPM rate is not publicly disclosed. A validated PMPM range and disclosure of how
      fees vary by plan size, product type, and service tier are needed to construct a defensible SAM model for the
      transparent PBM service-fee market.
  - type: missing-source
    severity: material
    topic: transparent-PBM-adoption-rate
    relatedQuestionRefs:
      - QM018
    missingEvidence: >-
      The 12%-to-31% employer adoption of transparent PBMs is cited from a single self-interested source (Navitus). An
      independent, neutral survey with disclosed methodology and sample frame is needed to corroborate the trend and
      confirm Judi Health's share of the growing transparent-PBM adopter pool.
  - type: conflicting-data
    severity: material
    topic: global-PBM-market-size
    relatedQuestionRefs:
      - QM029
    missingEvidence: >-
      The $576B–$755B range across four analyst market size estimates for 2026 reflects incompatible scope definitions.
      Methodological transparency from at least one primary-tier analyst firm showing whether drug pass-through cost is
      included or excluded would allow comparability. The TPA market sizing from Next MSC ($112B) also uses a broader
      definition that cannot be directly reconciled with the transparent-PBM admin-fee pool without additional
      methodology disclosure.
  - type: private-evidence-only
    severity: material
    topic: contracted-to-live-lives-conversion-rate
    missingEvidence: >-
      The timeline and cost for Judi Health to convert contracted employer PBM lives to live platform members are not
      publicly disclosed. Conversion rate, average implementation duration, and resource cost per implementation are key
      valuation variables requiring investor-level access.
