    severity: minor
    topic: transparent-PBM-SOM-trajectory
    missingEvidence: >-
      No independent forecast exists for how large a share of the self-insured employer PBM market independent
      transparent PBMs can collectively capture by 2028–2030 given the CAA 2026 reform timeline. A bottoms-up model from
      advisory firm or independent analyst would help triangulate Judi Health's 3–5 year SOM trajectory.
