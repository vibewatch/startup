  - id: valuation-context
    title: Valuation Context and Multiple Analysis
    body: >
      The September 2025 Series F established a $3.25 billion post-money valuation, more than doubling the
      $1.5 billion valuation set at the March 2024 Series D in roughly eighteen months. Total equity raised
      across seven rounds stands at $607 million, with the Series F ($252 million equity plus approximately
      $150 million secondary sales) oversubscribed; the secondary component demonstrates demand from new
      investors at the stated price without adding cash to the balance sheet.

      On gross revenue, the implied multiple is approximately 0.9× ($3.25 billion / $3.7 billion expected 2025
      gross). This superficially resembles the trading multiples of traditional PBMs whose valuations
      are compressed by high drug-cost pass-through volumes—CVS Caremark and Evernorth both trade at sub-1×
      total revenues on a consolidated basis. However, Judi Health's model should be evaluated on admin-fee
      net revenue rather than gross pass-throughs; on that basis the implied multiple is 18–90× ($3.25B /
      $37–185M estimated admin-fee NR), which is a growth-equity premium consistent with a 75%+ YoY growth
      trajectory and platform optionality. HealthEquity (HQY), the most directly comparable public benefits-
      administration company with a similarly sticky, recurring, admin-fee model, traded at approximately
      5.3× revenues on a $7 billion market capitalization against $1.31 billion in total revenues for the
      fiscal year ending January 31, 2026. Applied to the $37–185M admin-fee range, a 5× multiple implies
      a $185–925 million intrinsic value today—well below $3.25 billion—underscoring that the current
      valuation prices in substantial future growth to a more mature admin-fee revenue base.

      The company's $607 million total raised against a $3.25 billion valuation implies an approximate 5.4×
      price-to-total-capital ratio; early-stage investors whose original basis was sub-$100 million effectively
      hold a paper value of 30–50× invested capital, explaining the willingness to sell $150 million in
      secondary shares at this round.
