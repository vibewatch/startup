chapter:
  number: 8
  title: Valuation
  summary: >
    Judi Health's September 2025 Series F valued the company at $3.25 billion—roughly 0.9× expected 2025 gross
    revenue of $3.7 billion, but 18–90× estimated admin-fee net revenue of $37–185 million. The premium reflects
    >75% YoY revenue growth, a durable flat-fee / NADAC model insulated from PBM reform, 54 million contracted
    health-plan lives on the Judi EHP platform, and General Catalyst's thesis of a $20 billion unified claims
    platform. Public comparables (HealthEquity ~5× revenue, Evolent Health ~1–2×, CVS Caremark <1×) anchor a
    base-case target of $3–5 billion on admin-fee economics at scale, with a bull case of $8–12 billion if the
    EHP platform achieves mainstream adoption. Key underwriting blockers are the absence of disclosed admin-fee
    net revenue, gross margins, and the live-member ramp trajectory. The recommendation is Track with a medium
    conviction pending confirmation of unit economics in a forthcoming diligence round.

sections:
  - id: investment-thesis
    title: Investment Thesis and Anti-Thesis
    body: >
      Judi Health's bull thesis rests on three structural pillars. First, Capital Rx operates a transparent,
      flat-fee, NADAC-priced pharmacy benefit management model that structurally benefits from the ongoing FTC
      enforcement actions and bipartisan PBM Reform Act of 2025 targeting the spread-pricing practices of the
      incumbent Big Three (Express Scripts/Evernorth, CVS Caremark, OptumRx). Because Capital Rx earns no
      revenue from drug-spread or rebate retention, tightening regulation is a tailwind rather than a threat.
      Second, the Judi Enterprise Health Platform (EHP) represents an option value on unified claims
      processing—a category with virtually no mature public comparables and a total addressable market that
      management and lead investor General Catalyst estimate at $20 billion. Third, the Prime Therapeutics
      alliance (54 million health-plan lives contracted, $115 million strategic investment at $1.5 billion
      valuation in March 2024) provides a distribution moat that is operationally difficult to replicate.

      The anti-thesis centers on execution risk and revenue quality opacity. Judi Health's $3.7 billion 2025
      gross revenue includes drug-cost pass-throughs that dwarf the company's earned income; admin-fee net
      revenue is estimated at just 1–5% of gross, or $37–185 million—making the company's true economic scale
      highly uncertain. Only approximately one million members are live on platform as of January 2026 out of
      five million employer-contracted PBM lives (a ~20% live ratio), meaning the revenue pipeline is
      substantially deferred. The company is spending aggressively on brand—an NBA jersey patch deal with the
      Charlotte Hornets at an undisclosed fee signals elevated marketing costs—while disclosed financial metrics
      remain sparse. Comparable health-tech companies (Evolent Health, Accolade) experienced severe multiple
      compression in 2024–2025, illustrating how quickly sentiment can shift in this sector.
