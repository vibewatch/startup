  - id: comparable-set
    title: Comparable Set — Public Companies and Private Benchmarks
    body: >
      No single public company perfectly mirrors Judi Health's hybrid PBM-plus-EHP platform, but the
      following categories provide valuation anchors. Traditional PBM operators (Evernorth/Express Scripts
      within Cigna, OptumRx within UnitedHealth Group, CVS Caremark) trade at 0.5–1.5× total revenues on
      a consolidated basis, reflecting very thin net margins on the gross drug-cost pass-through. Cigna
      Group's Evernorth segment recorded adjusted revenues up 16% in FY2025 and continues to generate
      high operating income relative to pharmacy-benefit peers, but the market still applies a low
      corporate multiple. UnitedHealth Group's Optum Rx fulfilled 1,659 million adjusted scripts in 2025
      (versus 1,623 million in 2024), with Optum revenues growing 7% in aggregate.

      Benefits-technology and administration platforms trade at materially higher multiples. HealthEquity
      (HSA/FSA custodian and benefits administrator) commands ~5.3× revenues with 70% gross margins and
      $36.5 billion in HSA assets under custody. Omada Health (digital chronic disease management), which
      IPO'd in June 2025 at $19.00 per share and posted ~$261 million in FY2025 revenue (+53% YoY), carried
      approximately $1.05 billion in public float at mid-year, implying a 4× revenue multiple for a high-
      growth digital health company with similar employer-channel distribution. Evolent Health (specialty
      care management, EVH) provides a cautionary data point: revenue declined 26.6% to $1.876 billion in
      FY2025 due to customer contract restructurings, and the company recorded a $398 million non-cash
      goodwill impairment charge—demonstrating how quickly health-tech multiples compress when growth
      decelerates or customer mix deteriorates.

      On a private-market basis, Judi Health's own prior rounds imply accelerating valuation velocity:
      $175 million (June 2022 Series C), $1.5 billion (March 2024 Series D with Prime Therapeutics),
      and $3.25 billion (September 2025 Series F). Rock Health's 2025 digital health market data showed
      $14.2 billion in total digital health venture funding for the year, with mega-deals ($100M+)
      accounting for a growing share of total capital deployed.
