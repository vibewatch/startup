  - id: scenario-analysis
    title: Scenario Analysis — Bull, Base, and Bear Cases
    body: >
      The three scenarios below are indexed to a 2027–2028 exit or mark-to-market horizon and assume that
      admin-fee net revenue becomes the primary valuation basis once disclosed, as it should in any arms-
      length transaction or IPO process. Each scenario applies a different assumption about admin-fee
      penetration rate, live-to-contracted conversion speed, and multiple contraction or expansion.

      Bull Case ($8–12 billion, probability signal: 15–20%): The Judi EHP platform captures 3–5 major
      health-plan customers beyond Prime Therapeutics, adding 20–30 million net-new managed lives within
      24 months. Admin-fee net revenue reaches $350–600 million. PBM Reform Act 2025 passes and mandates
      spread-pricing transparency, materially accelerating client wins for Capital Rx's transparent model.
      General Catalyst's $20 billion thesis is partially vindicated. Applied multiple: 15–20× admin-fee
      NR, consistent with a high-growth SaaS-adjacent recurring platform.

      Base Case ($3–5 billion, probability signal: 55–65%): The current $3.25 billion price is roughly
      maintained or modestly appreciated as the 4 million deferred employer PBM lives come live and
      admin-fee net revenue is confirmed at $150–250 million by 2026–2027. The platform retains Prime
      Therapeutics as anchor tenant. PBM reform provides regulatory validation but not a step-change in
      new wins. Applied multiple: 15–20× admin-fee NR at $150–250 million = $2.25–5.0 billion; midpoint
      approximately $3.5 billion.

      Bear Case ($800 million–$1.5 billion, probability signal: 20–25%): The live-to-contracted
      conversion ratio stagnates at <25% through 2027 due to implementation complexity. Prime
      Therapeutics reviews its alliance under new leadership or M&A. A major health-data breach creates
      regulatory exposure. Admin-fee NR remains at $50–80 million due to deferred ramp. Comparable
      multiple compression in health tech (see Evolent Health, Accolade) brings the administered premium
      to 10–12× NR, implying $500–960 million intrinsic value. Recovery toward $1.5 billion requires
      a strategic acquirer premium.
