  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      AJ Loiacono serves as Co-Founder and CEO and is the company's primary public spokesperson,
      investor relations anchor, and media representative. Aged 53 as of September 2025, he brings
      deep PBM industry experience from his eight-year tenure at Truveris and has been the named
      architect of the NADAC-anchored, flat-fee model since Capital Rx's founding. Ryan Kelly,
      Co-Founder and CTO, built the Judi platform from the ground up and leads all technology
      strategy. The current executive team includes Bryan Birch (COO), Antonio Garcia Cueto (CFO),
      Kristin Begley, PharmD (CCO), Sunil Budhrani, MD, MPH, MBA (Chief Innovation and Medical
      Officer), Lloyd Fiorini (General Counsel and Chief Compliance Officer), and Sara Izadi, PharmD
      (Chief Clinical Officer), reflecting mature clinical, operational, and compliance capabilities.

      Key-person dependency on AJ Loiacono represents a material governance risk: he is the
      architect of the company's reform narrative, leads investor and media engagements, and holds
      the founding vision. The departure of original co-founder Joseph Alexander from the company,
      disclosed in a September 2025 Forbes profile, underscores the concentration of institutional
      knowledge in the two remaining co-founders. Board governance details are not fully disclosed
      for this private company; available evidence indicates that B Capital partner Robert
      Mittendorff joined the board at the June 2022 Series C, with Holly Maloney of General Catalyst
      serving as a board observer. The full board composition, investor voting rights, protective
      provisions, and governance structure remain unavailable in public sources.
