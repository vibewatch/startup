  topStrengths:
    - >-
      Structural regulatory tailwind: the transparent flat-fee / NADAC model is a direct beneficiary of FTC enforcement
      and bipartisan PBM Reform Act of 2025 targeting spread-pricing by the incumbent Big Three, converting industry
      headwinds into a demand catalyst for Capital Rx
    - >-
      Prime Therapeutics alliance (54M health-plan lives contracted on the Judi EHP, ~$115M strategic investment at
      $1.5B valuation) provides a durable distribution moat and validates the platform's enterprise-grade scalability
      with a major health-plan operator
    - >-
      Rapid gross-revenue trajectory (>75% YoY to ~$3.7B estimated 2025) and an oversubscribed Series F led by
      Wellington Management and General Catalyst signal strong institutional conviction and commercial momentum
    - >-
      Unified Claims Processing optionality: the Judi EHP positions the company for a $20B-addressable enterprise health
      administration market beyond PBM, providing a platform-expansion angle unavailable to traditional PBMs
  topRisks:
    - >-
      Revenue quality opacity: admin-fee net revenue—the company's true earned income—has never been publicly disclosed;
      at an estimated $37–185M the implied multiple is 18–90× at the $3.25B valuation, making arms-length underwriting
      impossible without direct management disclosure
    - >-
      Live-to-contracted conversion gap: only ~1M of 5M+ contracted employer PBM lives are live as of January 2026 (~20%
      ratio), deferring a large portion of the revenue pipeline with uncertain timing and implementation complexity
    - >-
      Single dominant channel-partner concentration: Prime Therapeutics (54M lives, strategic minority investor) is the
      anchor tenant of the EHP; leadership change, M&A at Prime, or alliance renegotiation would materially impair the
      growth thesis
    - >-
      Comparable multiple compression precedent: Evolent Health (EVH) saw revenue decline 26.6% in FY2025 and recorded a
      $398M goodwill impairment, illustrating how rapidly health-tech premiums contract on customer-mix deterioration or
      growth deceleration
  unresolvedGaps:
    - >-
      Admin-fee net revenue, gross margin, and contribution margin for FY2024 and FY2025 remain undisclosed; the entire
      valuation underwriting depends on these figures being confirmed in a direct diligence engagement
    - >-
      Live-member ramp trajectory for the ~4M deferred contracted employer PBM lives and the associated revenue
      recognition timeline to quantify the deferred pipeline value
    - >-
      Prime Therapeutics technology license fee economics, aggregate EHP SaaS revenue contribution, and Judi Care
      run-rate revenue post-Amino Health acquisition
    - >-
      Post-Series-F cash runway, monthly burn rate, and capital adequacy pathway to operating breakeven without a
      further equity round
