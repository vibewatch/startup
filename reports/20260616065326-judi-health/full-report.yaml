      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Track (Medium Conviction)
            body: >
              Judi Health is a structurally differentiated PBM-plus-EHP platform operating in a $487 billion U.S. drug
              spend market with a transparent, flat-fee model that benefits from PBM regulatory reform. However, the
              $3.25 billion valuation prices in substantial growth that is not yet observable in disclosed public
              metrics. The company should be placed on the active tracking list and engaged for a direct management
              meeting to obtain admin-fee net revenue, gross margin, and live-member ramp confirmation before a buy
              decision. If admin-fee NR is confirmed at $150M+ with a clear path to $250M+ by 2026, the valuation is
              defensible at a base case of $3–5 billion and attractive relative to the bull-case platform optionality.
            calloutType: recommendation
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV042
          - type: callout
            title: Key Risk — Gross Revenue Inflation Disguises Small Admin-Fee Economics
            body: >
              The most significant underwriting risk in this chapter is that Judi Health's publicly visible revenue
              figure ($3.7 billion expected 2025) is dominated by drug-cost pass-throughs that the company never
              retains. True admin-fee net revenue is estimated at $37–185 million—a 20–50× reduction. Without
              confirmation of this figure, the valuation cannot be robustly anchored. Comparable PBMs (CVS Caremark,
              Evernorth, OptumRx) trade at very low multiples precisely because their gross revenue inflates apparent
              scale. If admin-fee NR is at the low end ($37–50M), the current $3.25B valuation implies an unsustainably
              high 65–90× revenue multiple that requires hyper-growth to justify.
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV006
              - CV007
          - type: callout
            title: Valuation Anchor — HealthEquity Comparable Implies Substantial Future Growth Required
            body: >
              HealthEquity (HQY), the closest public analog—a recurring, admin-fee, benefits-administration
              platform—traded at approximately 5.3× fiscal-year revenues against a $7 billion market cap as of mid-2025.
              Applying that same multiple to Judi's confirmed total admin-fee net revenue (when disclosed) suggests that
              the current $3.25 billion valuation is supportable only if admin-fee NR reaches approximately $613 million
              or if the market awards a substantially higher multiple to reflect the EHP platform's network-effect
              optionality. The required NR to justify $3.25B at a HealthEquity-comparable multiple exceeds the current
              estimated admin-fee run-rate by 3–17×, making this an inherently forward-looking, growth-premium
              valuation.
            calloutType: insight
            claimRefs:
              - CV018
