      - number: '1.4'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Judi Health (operating as Capital Rx) raised its first institutional capital in a seed round of
              approximately $3 million in March 2018, followed by a Series A of $16 million in July 2019. A Series B
              round followed in approximately 2021, with the amount undisclosed in public sources. The most publicly
              documented pre-Series F round is the $106 million Series C in June 2022, led by B Capital Group, which
              brought total funding at the time to $175 million. A Series D (details undisclosed) and a Series E in
              approximately March 2024 followed, with the Series E carrying a post-money valuation of $1.5 billion.
              Prime Therapeutics LLC also became a minority investor in Capital Rx as part of a February 2024 strategic
              technology alliance granting Prime exclusive access to the Judi platform.

              The most significant financing event came on September 23, 2025, when Capital Rx— simultaneously
              rebranding to Judi Health—announced a $400 million investment comprising a $252 million Series F equity
              round and additional securities investments scheduled to close in early October 2025. The round was led by
              Wellington Management and General Catalyst, was described as oversubscribed, and included early investors
              selling more than $150 million of secondary stakes. Additional participating investors include Generation
              Investment Management, Growth Equity at Goldman Sachs Alternatives, 9Yards Capital, B Capital, Edison
              Partners, Prime Health Investments, and Transformation Capital. Total funding raised since founding stands
              at $607 million per company disclosure, with a post-money valuation of $3.25 billion—more than double the
              prior $1.5 billion. As a private company, Judi Health has not disclosed any debt facilities, credit
              agreements, or equity incentive plan details in public sources.
