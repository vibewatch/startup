      Traditional PBMs (Caremark, Evernorth, OptumRx) trade near 0.5–1.5× on consolidated revenue; benefits-admin
      platforms (HealthEquity) and digital health (Omada) command 4–6×; Judi Health's gross-revenue multiple (0.9×)
      falls at the PBM end, while its admin-fee-NR multiple (18–90×) is off-chart.
