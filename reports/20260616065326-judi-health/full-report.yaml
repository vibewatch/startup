      - number: '7.2'
        title: Operational, Technology, and Security Risk
        blocks:
          - type: paragraph
            body: >
              As a health data custodian processing pharmacy benefit claims for 5+ million employer PBM members and 54+
              million health plan lives (contracted), Judi Health carries significant HIPAA exposure. The HIPAA Privacy
              and Security Rules impose obligations on covered entities and business associates, and HHS OCR actively
              enforces them: OCR has obtained corrective action in hundreds of cases annually, securing resolution
              agreements that include civil monetary penalties and multi-year remediation plans. The HIPAA wrongful
              disclosure statute (42 U.S.C. §1320d-6) imposes both civil and criminal penalties for unauthorized PHI
              disclosure. Judi's security architecture—FISMA NIST 800-53 framework, serverless AWS infrastructure with
              minimized attack surface, real-time threat monitoring, and content filtering—represents a deliberate
              security-first posture, but no independent SOC 2 Type II or HITRUST certification has been publicly
              confirmed. The Amino/Care Navigation acquisition introduces integration risk: merging care-navigation
              software, provider-search capabilities, and a benefits wallet with an enterprise PBM adjudication platform
              increases system complexity and implementation surface area. Migrating large employer and health plan
              clients to the Judi platform involves multi-year implementation programs; the current 1M live vs. 5M
              contracted employer-life gap signals that implementation velocity lags contracting velocity. No security
              incidents or data breaches involving Capital Rx or Judi Health were identified in this review.
