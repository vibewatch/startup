  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: PBM services, self-insured employer administration, and the platform adjacency'
        blocks:
          - type: paragraph
            body: >-
              Judi Health competes at the intersection of three partially overlapping markets, and defining each
              boundary clearly matters for sizing and valuation.

              The core market is U.S. pharmacy benefit management, which covers the intermediary functions that sit
              between drug manufacturers, pharmacies, health plan sponsors, and plan members. Included in this market:
              pharmacy claims adjudication and payment; formulary design and tier management; rebate negotiation with
              manufacturers; specialty pharmacy management including prior authorization and utilization review; retail
              pharmacy network contracting; and mail-order dispensing. Excluded from the PBM-services boundary are the
              underlying drug acquisition cost itself (which PBMs pass through to plan sponsors), medical claims
              processing (which is a distinct TPA or insurer function), drug wholesale distribution, and drug
              manufacturing. The PBM "market size" figures published by market-research firms — ranging from $647
              billion to $755 billion for 2026 — include the pass-through drug spend that PBMs administer on behalf of
              plan sponsors, not just PBM service fee revenue. This distinction is critical: Judi Health's actual
              addressable fee pool is a small fraction of these headline numbers. The company's Capital Rx transparent
              PBM charges flat administrative fees per member per month, not a percentage of drug spend, so its
              serviceable market is the pool of administrative service contracts available to be won rather than the
              total drug cost managed.

              The second market layer is health benefits administration more broadly — the platform and services
              business of designing, managing, adjudicating, and reporting on employer health plans across pharmacy,
              medical, dental, and vision. The Judi Enterprise Health Platform (EHP) competes here against traditional
              TPAs, health plan administrative services organizations (ASOs), and standalone benefits administration
              software vendors. Mordor estimates the global benefit administration software market at $2.01 billion in
              2026, growing to $3.27 billion by 2031 at a 10.23% CAGR. This is the cleanest analogue for Judi's platform
              licensing TAM, though it omits the larger TPA administrative services revenue pool.

              The third layer is the total U.S. employer-sponsored health benefit ecosystem — the aggregate pool of
              employer health plan administration fees and managed drug spend from which any PBM or health benefits
              platform extracts revenue. The DOL's 2026 Report to Congress on Self-Insured Group Health Plans identifies
              50,700 self-insured plans and 4,800 mixed-insured plans with aggregate participant counts of 39 million
              and 33 million respectively. These are the plan sponsor entities from which Judi Health's Capital Rx PBM
              contracts are drawn.

              Status-quo substitutes are primarily the three vertically integrated PBMs — CVS Caremark (CVS Health),
              Express Scripts (Cigna/Evernorth), and OptumRx (UnitedHealth Group) — which together process 80% of all
              U.S. equivalent prescription claims in 2025 per Drug Channels Institute. These incumbents bundle PBM
              services with health insurance, specialty pharmacy, and increasingly care management, creating a
              competitive moat based on vertically integrated economics. Independent substitutes include pass-through
              and transparent PBMs such as Navitus and Padriac, traditional TPAs such as HealthComp, Meritain, and UMR,
              and broader benefits technology platforms such as Businessolver and Employee Navigator. Adjacent expansion
              markets for Judi Health include care navigation (now addressed by Judi Care, acquired via Amino Health),
              Medicare Part D PBM contracts (a different regulatory environment from the employer PBM market), and
              specialty pharmacy services (dominated by PBM-affiliated chains).
