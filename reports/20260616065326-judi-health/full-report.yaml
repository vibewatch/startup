  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite and Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              Judi Health operates three primary customer-facing technology brands all powered by the Judi Enterprise
              Health Platform (EHP). Capital Rx delivers transparent, full-service pharmacy benefit management anchored
              to NADAC pricing and flat administrative fees. The Judi Health platform is the company's full-service
              health benefit management offering that integrates pharmacy, medical, dental, and vision claims
              administration in a single system—marketed as the industry's first Unified Claims Processing™ platform.
              Judi (short for adjudication) is the underlying cloud-native EHP that powers both and is licensed to
              external health plans including Prime Therapeutics.

              Beyond these three brands, the suite includes Never Move Again (unbundled PBM with persistent pricing),
              Capital Equilibrium (level-funded PBM for smaller employers), Capital Rx Advantage (a free NADAC-based
              prescription discount card introduced in 2021), and the MPPP (Medicare Prescription Payment Plan). Judi
              Care, the AI-powered care navigation module acquired from Amino Health in June 2025, rounds out the
              portfolio by enabling Benefits Hub, provider search across 200 specialties, real-time appointment booking,
              cost estimation, and prescription drug routing for plan members.

              The architecture is explicitly cloud-native and described by the company as a single scalable SaaS
              solution built to replace 30-year-old legacy PBM technology. The platform was designed from the ground up
              by co-founder and CTO Ryan Kelly to handle administrative workflows for millions of plan members across
              Fortune 500 companies, unions, health systems, Medicare, Medicaid, and academic institutions. Over 54
              million health plan lives are contracted on the Judi platform as of September 2025.
