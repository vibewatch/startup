chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Judi Health is a New York-based enterprise health technology company and benefit administrator that
              provides a unified suite of pharmacy and medical benefit management solutions to self-insured employers,
              health plans, third-party administrators, and government entities. The company operates under three
              primary customer-facing brands: Capital Rx, the company's transparent pharmacy benefit manager (PBM); Judi
              Health, its full-service health benefit management platform spanning pharmacy, medical, dental, and vision
              benefits; and Judi (short for adjudication), its proprietary cloud-native Enterprise Health Platform (EHP)
              that serves as the technology backbone for both brands. A fourth product, Judi Care, is an AI-powered care
              navigation solution acquired via Amino Health in June 2025.

              Capital Rx's core differentiation from traditional PBMs lies in its flat-fee pricing model: rather than
              earning revenue through drug-price spread, rebate retention, or opaque clawbacks, it charges clients a
              fixed administrative fee per member per month or per claim. Drug pricing is anchored to the National
              Average Drug Acquisition Cost (NADAC), a CMS-maintained, publicly available database updated weekly,
              requiring contracted pharmacies to charge NADAC or lower. This model is designed to eliminate conflicts of
              interest embedded in conventional PBM structures and is central to the company's value proposition to
              self-insured employers seeking cost predictability and alignment. The company describes the Judi platform
              as the industry's first Unified Claims Processing system, enabling end-to-end administration of pharmacy
              and medical claims within a single, scalable SaaS environment. The corporate parent, Capital Rx, Inc., is
              organized as a Delaware public benefit corporation (PBC), legally committing the enterprise to social
              purpose alongside profit.
