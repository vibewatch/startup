      - number: '1.2'
        title: Founding Story and Corporate Evolution
        blocks:
          - type: paragraph
            body: >-
              Capital Rx was co-founded in late 2017 in New York City by AJ Loiacono (CEO), Ryan Kelly (CTO), and Joseph
              Alexander (COO). Loiacono, a serial entrepreneur who co-founded pharmacy benefits consulting firm Truveris
              and served as its CEO for eight years, drew inspiration from financial clearinghouse models—particularly
              the New York Stock Exchange—to build a system where all pharmacy customers receive the same price based on
              publicly available cost data rather than individually negotiated, opaque contracts. The company grew
              steadily from PBM operations into a broader enterprise health technology platform, reporting gross revenue
              of approximately $429 million in 2021 and $814 million in 2022 as employer adoption of its transparent
              model expanded.

              The company's evolution accelerated in 2025 with two landmark moves. In June 2025, Capital Rx acquired
              Amino Health, integrating its AI-driven platform as Judi Care and extending the company's capabilities to
              care navigation, provider search, appointment booking, and cost estimation across nearly 60 million
              covered lives. Then in September 2025, concurrent with a $400 million investment round, the company
              officially rebranded from Capital Rx to Judi Health to signal its expansion from a pharmacy-focused PBM
              into a full-spectrum health benefits administration platform. The corporate parent entity remains Capital
              Rx, Inc. (a public benefit corporation), with Judi Health, LLC and Amino, LLC operating as subsidiaries
              per the company's privacy policy. Joseph Alexander, the third original co-founder and former COO, is no
              longer with the company as of September 2025 per a Forbes profile.
            claimRefs:
              - CO002
              - CO003
              - CO004
