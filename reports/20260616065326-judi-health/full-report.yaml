      - number: '1.5'
        title: Scale, Traction, and Key Milestones
        blocks:
          - type: paragraph
            body: >-
              Judi Health demonstrated strong commercial momentum through 2025 and into 2026. In January 2026, the
              company announced that Capital Rx had surpassed five million contracted employer PBM lives, with more than
              one million plan members live on the platform as of January 1, 2026. The company contracted and
              implemented two million new health plan lives in 2025 alone, including 13 Fortune 500 corporations, 21
              leading hospital groups and health systems, and several state employee plans. At the time of the September
              2025 funding announcement, the Judi platform had more than 4 million employer PBM members and over 54
              million health plan lives contracted. The company signed more than 80 new partnerships for the second
              consecutive year in 2025, signaling sustained national demand for its aligned, technology-driven model.
              Forbes reported 2025 revenue was expected to reach approximately $3.7 billion—more than 75% above the
              prior year's approximately $2.1 billion—though this figure represents gross administrative revenue
              including pass-through drug spend and has not been independently audited.

              Key non-financial milestones include a MedTech Breakthrough Award for Best Healthcare InsurTech Solution
              (May 2025) and a multi-year Charlotte Hornets NBA jersey patch partnership announced at the New York Stock
              Exchange on September 24, 2025, with plans to open a Charlotte office and add 200-250 local jobs. The
              regulatory environment is materially relevant: the FTC has active litigation against the three largest
              PBMs (OptumRx, CVS/Caremark, Express Scripts) for alleged anticompetitive insulin rebating, and the
              Consolidated Appropriations Act, 2026 enacted PBM reform provisions including delinking of PBM
              compensation from drug prices in Medicare Part D. Judi Health is not named in any FTC enforcement action;
              its flat-fee NADAC-anchored model is structurally differentiated from the practices under scrutiny. The
              AMA's 2026 Issue Brief confirms that four PBMs control approximately 67% of the national market,
              validating Judi Health's position as an independent challenger well outside the dominant-tier incumbents.
