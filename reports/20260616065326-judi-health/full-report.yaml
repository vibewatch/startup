      - number: '6.4'
        title: Retention, Durability, and Expansion
        blocks:
          - type: paragraph
            body: >-
              Capital Rx self-reports a 99.5% client retention rate and a 100% implementation satisfaction rate. No
              independent audit, third-party NPS study, or regulator-verified figure corroborates these claims, and the
              sample is self-selected (employers who stayed vs. those who churned are not distinguished). The Rice
              University case illustrates why the stickiness dynamic is credible: after implementation, real-time claims
              visibility and same-day issue resolution create high switching costs back to legacy PBMs. The flat-fee
              NADAC model also avoids re-contracting friction—Capital Rx does not profit from higher drug spend, so
              renewal conversations are primarily driven by cost outcomes rather than pricing negotiations. The Never
              Move Again product (unbundled PBM) is explicitly designed to reduce implementation friction and lock in
              pricing continuity, addressing the single largest obstacle to switching. On the expansion side, the
              company's trajectory is from pharmacy-only PBM toward full-spectrum benefits administration. The Judi
              Health Unified Claims Processing platform, which integrates pharmacy and medical claims on one engine, is
              the expansion vehicle; Forbes noted Loiacono's observation that "once you see the medical and pharmacy
              claims coming in at the same time, you never want to go back." Capital Equilibrium (level-funded pharmacy
              benefit) extends the market to budget-sensitive municipalities and small employers who could not
              previously access a transparent PBM model, creating a pipeline of lower CAC upsell targets. The company's
              own deployment on Judi yielded 11% cost savings per member per month internally and reduced claims
              processing time from more than six months to a maximum of 18 days, providing a concrete internal benchmark
              for the expansion value proposition. No net revenue retention (NRR) or gross revenue retention (GRR) data
              is publicly disclosed. Cohort retention by year is unavailable.
