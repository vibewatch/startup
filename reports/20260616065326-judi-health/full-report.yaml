        - label: Revenue Growth Re-Rating
          value: 750
        - label: EHP Platform Optionality
          value: 500
        - label: Strategic Alliance Premium
          value: 300
        - label: Regulatory Tailwind Re-Rating
          value: 200
        - label: Series F Post-Money (Sep 2025)
          value: 3250
    approximationNotes: >
      Attribution components are analyst estimates; the company has not disclosed a valuation bridge. Sum of incremental
      items (750+500+300+200=1750) plus the $1,500M base equals $3,250M. Each component is inherently uncertain and
      should be treated as illustrative only.
