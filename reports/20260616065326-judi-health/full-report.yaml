    title: Judi Health Valuation Bridge — Series D to Series F ($M)
    type: waterfall
    layout: standard
    summary: >
      Waterfall decomposition of the step-up from $1,500M Series D (March 2024) to $3,250M Series F (September 2025)
      across analyst-attributed value drivers. Revenue growth re-rating is the largest single contributor; EHP platform
      optionality and strategic alliance premium together account for nearly half of the incremental value.
    data:
