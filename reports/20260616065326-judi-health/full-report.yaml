          - type: callout
            title: Live-to-Contracted Gap Is the Near-Term Revenue Risk
            body: >
              With only approximately one million live members out of five million contracted employer PBM lives as of
              January 2026, Judi Health carries a 4-to-1 pipeline-to-active ratio. If contracted clients defer go-live
              dates, reduce scope, or churn before activation, the revenue ramp embedded in investor expectations may
              not materialize on schedule. The company has not disclosed go-live timelines, implementation success
              rates, or churn among contracted but not-yet-live accounts.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI040
              - CI043
          - type: callout
            title: Investor Thesis Implies Significant Long-Run Revenue Headroom
            body: >
              General Catalyst's lead investor described Judi Health as "absolutely a $20 billion business to be built
              here," implying expected revenue at scale 5-to-6 times the current $3.7 billion gross run rate or 100x+
              the estimated admin-fee net revenue. This thesis rests on the expansion of unified medical-plus-pharmacy
              administration to additional health plans, TPAs, and employers—a market currently nascent with only
              ~40,000 lives in the medical product as of September 2025.
            calloutType: insight
            claimRefs:
              - CI031
              - CI018
