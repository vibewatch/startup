      - number: '2.4'
        title: >-
          Growth drivers and adoption constraints: regulatory reform opens doors that incumbency, risk aversion, and
          complexity keep partly shut
        blocks:
          - type: paragraph
            body: >-
              The structural demand case for a transparent, technology-driven PBM and benefits platform is strong and
              multivariate, but so is the adoption friction — and both are intensifying simultaneously in 2026.

              On the demand side, healthcare cost inflation is the dominant accelerant. The Business Group on Health's
              2026 Employer Health Care Strategy Survey reports a median projected 9% healthcare cost trend for 2026
              before plan design changes, falling to 7.6% after mitigation — the highest median in over a decade, and
              the second consecutive year where actual costs exceeded employer forecasts and budgets. Pharmacy costs are
              a leading contributor: employers anticipate 11–12% pharmacy cost increases in 2025 into 2026, and 24% of
              all employer health dollars already went to pharmacy expenses in 2024. Specialty drugs — chiefly GLP-1
              agonists for obesity and diabetes, oncology biologics, and rare-disease drugs — represent 52% of net
              prescription drug spend despite accounting for only 2% of drugs dispensed (Navitus, citing AJHP). Milliman
              projects an overall gross pharmacy cost increase of 11–14% annually for commercial plans in 2025–2026,
              with GLP-1s alone projected to rise 21–40% annually for plans electing to cover them.

              The regulatory environment has shifted sharply in Judi Health's favor. The Consolidated Appropriations Act
              of 2026 (CAA 2026), signed by President Trump on February 3, 2026, enacts the most significant federal PBM
              reform ever passed. For Medicare Part D (effective January 1, 2028), PBMs must limit compensation to flat
              bona fide service fees unrelated to drug price, volume, or rebate levels; pass through 100% of
              manufacturer rebates to plan sponsors; and file detailed drug-level reports to the Department of Health
              and Human Services. An any-willing-pharmacy requirement takes effect in 2029. For commercial ERISA plans
              covering 100+ employees, semiannual reporting of net drug spending, spread pricing, and
              manufacturer-derived revenue is required, along with annual audit rights. Full rebate passthrough for
              commercial plans takes effect approximately January 2029. These provisions make Judi Health's
              already-compliant flat-fee model a regulatory-safe harbor and reframe the incumbent PBM model as
              structurally non-compliant with the emerging standard. The FTC's active litigation against the Big Three
              for insulin rebate manipulation and its February 2026 settlement with Express Scripts add legal
              enforcement to the regulatory pressure.

              Benefit fragmentation is a compounding driver. Employers manage separate PBM, TPA, care navigation,
              dental, vision, and stop-loss contracts — often with separate data systems, member IDs, and reporting
              formats. Judi Health's value proposition of a single unified claims adjudication platform is directly
              responsive to this fragmentation, and the January 2026 press release explicitly characterizes the move
              toward unified health benefits management as the direction of the market.

              On the constraint side, incumbent PBM lock-in is the largest friction. The Big Three offer multi-year
              contracts (typically three to five years) with auto-renewal provisions and steep exit clauses that can
              include rebate recapture provisions. Members changing formularies face clinical disruption; data migration
              between claims systems is technically complex and involves PBM cooperation during offboarding — which
              incumbents can delay or obstruct. Many employers are also reluctant to trigger member disruption during
              ongoing benefit years. The FTC found that even after smaller PBMs win a contract, the Big Three can
              continue to profit as behind-the-scenes rebate aggregators because independent PBMs often lack the scale
              to negotiate manufacturer rebates directly.

              ERISA fiduciary duty imposes risk aversion: benefits directors must demonstrate that any PBM switch is in
              the best interest of plan participants. This creates a conservative default toward the status quo and
              lengthens procurement timelines. The CAA 2026 transparency requirements actually increase fiduciary
              scrutiny of incumbent PBMs — which will accelerate RFPs — but the near-term effect may be longer
              procurement cycles as plan sponsors apply new audit rights before making switching decisions.

              Capital intensity is a structural constraint for new entrants but not for Judi Health given its $607
              million raised. Running a full-stack cloud-native claims adjudication platform requires significant
              engineering investment, actuarial and regulatory compliance teams, and client implementation capacity.
              Judi Health's January 2026 press release specifically notes it is using Series F capital to scale teams
              and enterprise technology to meet demand.

              Trust and compliance risk — the fear of implementation failure, claims-processing errors, or regulatory
              violations — is the primary reason large employers hesitate to move to less-tested platforms. Judi
              Health's January 2026 traction (5 million contracted employer PBM lives, 54 million health plan lives, 80+
              new partnerships including 13 Fortune 500 companies) directly addresses this concern by demonstrating
              platform reliability at scale. But the gap between contracted and live lives (5 million contracted vs.
              approximately 1 million live as of January 1, 2026) is itself a signal of the implementation complexity
              and timeline involved.
