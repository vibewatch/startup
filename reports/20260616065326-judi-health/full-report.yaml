      - number: '8.5'
        title: Recommendation, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Recommendation: Track (Medium Conviction). Judi Health is building a structurally differentiated business
              in a large, dysfunctional market. The $3.25 billion September 2025 valuation prices in significant growth
              and platform optionality that is not yet visible in disclosed metrics. Before committing to a buy
              decision, a prospective investor must resolve several material underwriting questions around admin-fee net
              revenue, gross margin, and live-member ramp economics. The company should be prioritized for direct
              engagement to obtain audited or management-confirmed financials at the admin-fee level.

              Risk Rating: High. The combination of (1) gross-revenue distortion obscuring true business scale, (2) a
              20% live-to-contracted conversion ratio creating a deferred revenue pipeline whose timing is uncertain,
              (3) a single dominant channel partner (Prime Therapeutics, 54M lives contracted) representing a material
              concentration risk, and (4) multiple comparable health-tech companies experiencing severe valuation resets
              between 2024–2026, warrants a high risk rating.

              Valuation Stance: Stretched at current price relative to disclosed economics; fair if admin-fee NR is
              confirmed at $150M+ and the live-ramp trajectory is on track for 3 million+ active members by end of 2026.
              The secondary market overhang from early backers who did not sell in the recent round may constrain
              near-term price appreciation.

              Confidence: Medium. The company's business model is well-documented and the regulatory tailwinds are
              credible, but the absence of audited financials at the net-revenue level is a binding uncertainty that
              prevents high confidence. Peer comparison is meaningful but imprecise due to the absence of a direct
              public-market analog.
            claimRefs:
              - CV036
