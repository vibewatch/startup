      - number: '3.3'
        title: Adjacent, Substitute, and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Beyond direct PBM competition, employers solving the same job—reduce pharmacy and health benefit spend
              while simplifying administration—have several adjacent and status-quo paths. Transcarent operates a
              generative AI-powered health and care navigation platform integrating medical, pharmacy, and point
              solutions through its WayFinding experience, which guides members to personalized on-demand care 24/7; it
              competes with Judi Care (Judi Health's care navigation brand acquired from Amino Health) for the
              navigation layer but does not provide claims adjudication or formulary management. Waltz Health, now part
              of EVERSANA following an acquisition, offers a multi-card prescription marketplace search solution that
              optimizes cash-pay and discount-card prices but does not serve as a PBM; it occupies a narrow adjacent
              niche rather than a direct displacement threat. The dominant status-quo alternative remains the carve-out
              PBM plus separate medical TPA plus navigation vendor configuration, where an employer purchases
              best-of-breed point solutions from multiple incumbents; this creates data silos, dual administrative
              overhead, and misaligned incentives—exactly the pain point Judi Health's Judi EHP unified claims
              processing platform is designed to eliminate. Insurer-bundled PBM (where a carrier bundles PBM into an ASO
              arrangement) and in-house self-administration represent additional substitutes for very large or very
              sophisticated employer buyers. Judi Health's Capital Rx transparent model and the broader Judi EHP
              platform explicitly position against all of these status-quo configurations, describing the Judi platform
              as the industry's first Unified Claims Processing system for integrating pharmacy and medical claims in a
              single cloud-native environment. Express Scripts saved clients $38 billion in supply chain and clinical
              programs in 2023 alone, illustrating the financial switching-cost gravity of the incumbent ecosystem even
              for dissatisfied sponsors.
