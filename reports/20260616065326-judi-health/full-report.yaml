  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segment Breadth
        blocks:
          - type: paragraph
            body: >-
              Judi Health / Capital Rx targets a wide arc of institutional buyers that self-fund or administer health
              benefits. The primary segments are (1) self-funded employers ranging from small municipalities to Fortune
              500 corporations; (2) unions, many of which are among the largest in the country; (3) hospital groups and
              health systems that both use and, in some cases, invest in the platform; (4) health plans—commercial,
              Medicare, and Medicaid—served largely through the Prime Therapeutics alliance; (5) third-party
              administrators (TPAs) that license the Judi enterprise health platform; and (6) academic institutions, of
              which Rice University is the publicly named anchor case. Within employer market, Capital Rx addresses both
              fully self-funded plan sponsors (the core Capital Rx PBM product) and smaller, budget-constrained
              employers seeking cost predictability through the Capital Equilibrium level-funded product launched in
              November 2025. The company explicitly serves customers "across all 50 states" and targets large unions,
              state employee benefit plans, and municipalities as high-value segments. The broker and consultant channel
              is central to go-to-market, with Judi Health operating a dedicated broker portal and positioning the
              platform's fiduciary-compliance tools as a competitive differentiator for benefit advisors. On the health
              plan side, the Judi platform supports commercial, Medicare, and Medicaid adjudication, extending the
              addressable market well beyond employer PBM. The acquisition of Amino Health and creation of Judi Care
              (care navigation for pharmacy, medical, dental, and vision) adds a consumer-facing layer that deepens the
              company's hold on its employer clients and creates cross-sell opportunities into comprehensive health
              benefit administration. Customer breadth is validated by the signing of 80-plus new partnerships in 2025
              alone, the second consecutive year at that rate.
