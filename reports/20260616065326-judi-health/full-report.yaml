  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              Judi Health generates revenue under a flat administrative fee model—billing employers and plan sponsors
              either on a per-member-per-month (PMPM) basis or on a per-prescription basis, at the customer's election.
              Unlike the incumbent Big Three PBMs (CVS Caremark, Express Scripts, Optum Rx), which derive profit from
              spread pricing, rebate retention, and clawbacks, Capital Rx prices every drug at the publicly available
              National Average Drug Acquisition Cost (NADAC) maintained by the Centers for Medicare and Medicaid
              Services (CMS). Drug costs are fully passed through to the plan sponsor; Capital Rx receives only its flat
              administrative fee plus disclosed flat clinical fees for services such as prior authorization. The company
              has described this model as "akin to Fidelity's recordkeeping business in administering 401(k) plans."
              Additional clinical fees for prior authorization and other managed-care services are itemized at the
              bottom of client invoices. As of September 2025, Judi Health's Enterprise Health Platform (Judi®) also
              generates SaaS-style licensing revenue from third-party health plans and TPAs—most notably through its
              exclusive technology agreement with Prime Therapeutics—though the license fee structure and aggregate SaaS
              revenue are not publicly disclosed. The recently launched Judi Care navigation product (acquired from
              Amino Health in June 2025) adds a potential fourth revenue stream with approximately 60 million covered
              lives in capacity, but no separate pricing or revenue contribution data has been published. The critical
              implication is that Judi Health's gross-revenue topline ($3.7 billion estimated for 2025) includes the
              full drug-cost pass-through and therefore substantially overstates the company's actual earned revenue;
              the true admin-fee net revenue—the relevant commercial metric—has never been disclosed.
