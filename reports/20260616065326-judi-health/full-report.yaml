      - number: '2.2'
        title: 'Sizing lenses: contradictory analyst TAMs, a meaningful transparent-PBM SAM, and an evidence-constrained SOM'
        blocks:
          - type: paragraph
            body: >-
              The published market size for the global PBM industry should be interpreted cautiously because different
              analysts define the market boundary differently, producing a wide spread of headline numbers that are
              superficially incomparable.

              Mordor Intelligence estimates the global pharmacy benefit management market at $657.51 billion in 2025,
              growing to $692.47 billion in 2026 at a 5.32% CAGR, reaching $897.16 billion by 2031. Mordor attributes
              North America with 45.88% of the 2025 market, implying a North American PBM market of approximately $301.7
              billion. Fortune Business Insights separately estimates the global market at $609.13 billion in 2025 and
              $646.61 billion in 2026, at a 5.5% CAGR to $991.88 billion by 2034. Fortune reports the U.S. alone as
              96.96% of its global market, implying a U.S. figure of approximately $626.8 billion — which is nearly
              double Mordor's North America estimate of $301.7 billion. The Business Research Company puts the global
              market at $755.09 billion for 2026 at an 8.5% CAGR. Precedence Research estimates $575.7 billion in 2026
              growing to $948.2 billion by 2035. This $179-billion spread in 2026 estimates ($576B–$755B) is a material
              diligence gap: the definitions of included spend differ substantially, and none of these figures isolate
              the service-fee revenue (administrative charge) from the drug-cost pass-through.

              A more practically useful lens starts from the DOL's 2026 Self-Insured Report: 50,700 self-insured plans
              plus 4,800 mixed-insured plans cover a combined approximately 72 million plan participants in ERISA-filed
              plans. That participant population times an estimated $25–$60 PMPM (per member per month) transparent PBM
              administrative fee — a range consistent with industry commentary but not publicly confirmed for Judi
              Health — yields an indicative transparent-PBM administrative-fee TAM of $22–$52 billion annually. However,
              this figure is an estimate only: Judi Health has not publicly disclosed its PMPM rate, and the analyst
              community has not published a clean, validated "transparent PBM administrative fee pool" figure.

              For the health benefits platform layer, Mordor's $2.01 billion (2026) benefits administration software
              market is the best available proxy for platform licensing revenue potential. This market grows at 10.23%
              CAGR, faster than the underlying PBM market, reflecting digital transformation tailwinds.

              Transparent and independent PBM adoption is rising sharply: Healthcare Finance News, cited by Navitus,
              reports that employer use of transparent or alternative PBMs grew from 12% to 31% between 2024 and 2025,
              while reliance on the Big Three fell from 72% to 61%. A 79% plan sponsor satisfaction rate among
              transparent PBM users versus lower scores for traditional models supports the claim that the transparent
              model is pulling employers. Mordor separately notes that employer-sponsored programs controlled 45.25% of
              PBM market share in 2025 by revenue, and that specialty pharmacy services led by service category at
              33.42% of total revenue, with claims processing and adjudication projected to grow at 7.12% CAGR through
              2031 — the exact functions the Judi EHP targets.

              Judi Health's SOM is not publicly isolatable. With 5 million contracted employer PBM lives as of January
              2026 and 54 million health plan lives on the Judi adjudication platform (the majority via the Prime
              Therapeutics alliance), the company's current revenue footprint is a small but rapidly growing fraction of
              the total self-insured employer market. The company is not publicly disclosing administrative fee PMPM or
              net service revenue, so a precise SOM cannot be constructed from public evidence.
