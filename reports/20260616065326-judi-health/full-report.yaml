      - number: '6.5'
        title: Concentration Risk, Implementation Gap, and Channel Dependence
        blocks:
          - type: paragraph
            body: >-
              The most material customer risk is concentration through Prime Therapeutics. The 54+ million health plan
              lives on the Judi platform consist largely of Prime's client book— 23 Blue Cross Blue Shield plans and
              affiliates. Prime is both a minority investor and the only third-party PBM licensed on the Judi platform
              as of mid-2026. If Prime terminates or renegotiates the alliance (whether due to its own competitive
              pressures, the AHF antitrust litigation, Express Scripts' growing role in half of Prime's pharmacy
              network, or a change in Prime's strategic direction), Judi Health could lose the majority of its health
              plan lives in one event. The implementation backlog amplifies this risk: with only about one million of
              five million contracted employer PBM lives currently live (as of January 2026), a significant portion of
              contracted revenue has not yet converted to billing. Enterprise benefits implementations typically run
              three to six months and require coordination across HR, payroll, and pharmacy networks, creating a drag on
              revenue realization and a window in which clients could reverse course. A secondary channel risk is broker
              dependence: Judi Health routes a material share of employer wins through independent brokers and
              consultants, and broker consolidation or exclusivity deals with incumbent PBMs could suppress new client
              inflows. The FTC's 2024 PBM industry report catalogued how large, vertically integrated PBMs leverage
              formulary placement and rebate structures as anti-competitive barriers, which validates the structural
              tailwind for Capital Rx but also signals the adversarial market environment the company must navigate. On
              customer concentration within the employer book, no individual employer client is named publicly, and the
              company has not disclosed the revenue contribution of its top five or ten clients, leaving
              Herfindahl-level concentration unassessable without direct diligence.
