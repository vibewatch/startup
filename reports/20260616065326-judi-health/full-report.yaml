        - Confirm how Capital Rx handles specialty drug rebates and GLP-1 cost management for clients
      - - >-
          CAA 2026 PBM reform — Medicare Part D delinking, commercial rebate passthrough, reporting (effective
          2028–2029)
        - Driver ↑
        - 'Phased: reporting now, Part D delinking Jan 2028, any-willing-pharmacy 2029, commercial passthrough ~Jan 2029'
        - >-
          Capital Rx/Judi Health's flat-fee model is already structurally compliant; incumbent PBMs must restructure;
          reform creates conversion urgency for plan sponsors
        - >-
          Monitor CMS and DOL rulemaking on BFSF definitions; understand whether reform benefits apply equally to
          employer PBMs vs. Medicare PBMs in 2028 phase
      - - FTC enforcement and Big Three PBM investigations/settlements
        - Driver ↑
        - 'Active: FTC/Express Scripts settlement February 2026; ongoing FTC market study'
        - >-
          Regulatory litigation validates the reform narrative that supports Capital Rx's brand; FTC findings provide
          third-party evidence for employer RFP arguments
        - >-
          Monitor FTC outcomes for any binding consent decrees that affect competitive dynamics; confirm Judi Health is
          not in FTC scope
      - - Employer demand for benefit consolidation (unified PBM + medical + dental + vision platform)
        - Driver ↑
        - Near-term (2026–2028)
        - >-
          Judi Health's unified platform is the primary technical differentiator; employers explicitly seeking to reduce
          point-solution fragmentation
        - >-
          Verify that actual integration depth (not just API connection) is functional for medical claims alongside
          pharmacy; assess implementation timelines for unified claims
      - - Transparent PBM adoption surge (12% to 31% employer adoption 2024–2025)
        - Driver ↑
        - Current, with strong momentum
        - >-
          Sector-level tailwind that validates the business model; Capital Rx benefits as the best-capitalized
          transparent PBM
        - >-
          Verify sample methodology of adoption data; confirm Judi Health is capturing share proportional to or above
          sector growth
      - - Incumbent PBM multi-year contracts and exit clauses
        - Constraint ↓
        - Structural, multi-year lag
        - >-
          Most employer PBM contracts are 3–5 years; switching window opens only at renewal; contract offboarding
          requires incumbent cooperation
        - Map Judi Health's sales pipeline by contract renewal dates; understand win rates at competitive RFP stages
      - - Implementation complexity and member disruption risk
        - Constraint ↓
        - Per-client 6–18 month implementation
        - >-
          Gap between contracted (5M) and live (~1M) employer PBM lives signals implementation bottleneck; trust in
          platform is built over implementation track record
        - >-
          Assess implementation team capacity vs. contracted pipeline; understand client escalation rate and Net
          Promoter Score post-implementation
      - - ERISA fiduciary duty and risk aversion
        - Constraint ↓
        - Structural, partially mitigated by CAA 2026 audit rights
        - >-
          Benefits leaders must justify PBM switches to plan trustees; risk of claims-processing errors is career risk;
          longer due-diligence cycles
        - >-
          Understand Judi Health's error rate and SLA performance; obtain client references from completed
          implementations
      - - Big Three behind-the-scenes economics (rebate aggregation)
        - Constraint ↓
        - Structural, potentially reduced by CAA 2026
        - >-
          Even when an employer switches to an independent PBM, the Big Three may capture rebate aggregation revenue
          through GPO relationships, limiting savings to the plan sponsor
        - >-
          Confirm whether Capital Rx/Judi Health uses any Big Three rebate aggregation; understand full rebate stack for
          clients
      - - RFP cycle length (12–24 months)
        - Constraint ↓
        - Structural; improved by CAA 2026 reporting requirements
        - >-
          Long sales cycles require substantial capital to fund; Judi Health's $607M raised provides runway; RFP wins
          announced in 2025 likely represent 2023–2024 originations
        - >-
          Verify sales cycle duration and average contract value from Judi Health's commercial team; assess sales team
          scalability
      - - Capital intensity of full-stack platform
        - Constraint ↓
        - Structural barrier to entry, not a constraint for Judi Health post-Series F
        - >-
          Judi Health's $607M in total raised and cloud-native architecture create a competitive barrier to new
          entrants; constraint applies to future independent PBM competitors
        - Assess burn rate vs. Series F capital runway; confirm technology investment roadmap is funded
