        title: Exhibits
        blocks:
          - type: callout
            title: Pass-Through Revenue Inflates Topline Metrics
            body: >
              Judi Health's reported gross revenue ($3.7 billion expected in 2025) includes the full drug-cost
              pass-through that flows through the company's accounts. Because Capital Rx does not bear drug cost risk,
              this topline figure is not comparable to SaaS or pure-technology revenues. The actual admin-fee earned
              revenue—the commercially relevant metric—is estimated at 1–5 percent of gross and has never been
              disclosed. Any valuation or growth analysis based solely on the gross revenue figure risks materially
              overestimating economic progress.
            calloutType: risk
            claimRefs:
              - CI005
