companyProfile:
  summary: >-
    Judi Health (corporate parent: Capital Rx, Inc.) is a New York-based enterprise health technology company and
    transparent pharmacy benefit manager founded in 2017 by AJ Loiacono and Ryan Kelly. The company rebranded from
    Capital Rx to Judi Health in September 2025, concurrent with a $400 million financing event ($252M Series F equity
