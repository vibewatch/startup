      - number: '2.5'
        title: >-
          Diligence gaps: admin-fee SAM, transparent-PBM penetration methodology, and contradictory analyst market
          estimates
        blocks:
          - type: paragraph
            body: >-
              Several evidence gaps materially limit the precision of this market analysis and should be flagged for
              investor diligence.

              The administrative-fee SAM is not publicly isolatable. No major market research firm publishes a dedicated
              "transparent PBM administrative fee revenue" or "independent PBM service contract market" figure. All
              headline PBM market sizes ($647B–$755B for 2026) bundle the enormous drug-cost pass-through with actual
              service fee revenue, making them unsuitable as a direct TAM for Judi Health's economic model. The
              company's flat-fee, NADAC-anchored pricing model generates revenue from service fees only — and the size
              of the available service-fee pool is inferrable only through bottom-up modeling (lives × estimated PMPM),
              which depends on a PMPM rate that Judi Health has not publicly disclosed.

              Transparent PBM adoption data is sourced from a single self-interested publisher. The 12%-to-31% employer
              adoption figure for transparent PBMs is cited by Navitus (a competing transparent PBM) drawing on a
              Healthcare Finance News article from September 2025. While the trend direction is credible and consistent
              with the broader regulatory and cost environment, the sample frame, survey methodology, and definition of
              "transparent PBM" used in that study are not described in the publicly available source. Independent
              confirmation of this adoption rate from a neutral third party is a diligence ask.

              The contradictory analyst market size estimates — Mordor ($692B), Fortune ($647B), TBRC ($755B), and
              Precedence ($576B) — cannot be reconciled without access to each firm's methodology. The primary
              discrepancy between Mordor's North America share (45.88% of global) and Fortune's U.S. share (96.96% of
              global) is particularly stark and suggests the two firms are using incompatible market definitions.
              Investors should treat these as order-of-magnitude context rather than precise competitive intelligence.

              Judi Health's SOM and live-lives trajectory are not publicly available. The company reports 5 million
              contracted employer PBM lives and approximately 1 million live as of January 1, 2026, and 54 million
              health plan lives contracted (largely via Prime Therapeutics). The revenue generated per contracted life
              and per live life, the timeline to move contracted lives to live status, and the organic growth rate of
              net new contracted lives are not publicly disclosed and represent the key valuation variables that require
              investor-level access to confirm.
            claimRefs:
              - CM052
              - CM053
              - CM054
              - CM055
