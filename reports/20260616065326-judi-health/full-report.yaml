              being recruited as of June 2026, signaling an ongoing build-out of the enterprise security function rather
              than a mature, fully-staffed program.

              Key external dependencies include: the CMS NADAC database (updated weekly; pricing accuracy is directly
              tied to CMS update cadence), standard EDI and HL7 protocols for medical claims intake, pharmacy network
              APIs, and health plan eligibility feeds. The Prime Therapeutics alliance—which gives Prime exclusive
              access to the Judi platform for its 50+ million covered lives—creates the single largest technical
              dependency risk: a migration of that scale has no public precedent for a startup-class PBM platform and
              would require sustained engineering investment. The Amino Health acquisition adds a separate data
              integration obligation as the Judi Care platform's AI navigation relies on Amino's proprietary provider
              dataset and configuration engine.

              No public API documentation, developer portal, or integration guide is accessible on the Judi Health
              website as of June 2026. The company's GitHub presence is limited to one forked Grafana repository under
              the capitalrx organization. This absence of public developer surface is consistent with an enterprise B2B
