              $1.5 billion valuation established at the prior March 2024 Series D round, which was anchored by a $115
              million strategic investment by Prime Therapeutics. SEC Form D filings corroborate the disclosed amounts:
              the 2025 filing (accession 0001782959-25-000002) shows $232.9 million offered with $230.8 million sold by
              the September 26 filing date; the 2024 filing (accession 0000950157-24-000482) shows $312.5 million
              offered with $115 million initially sold; and the 2022 filing (accession 0001782959-22-000001) shows $106
              million offered and fully sold. The company's financial model, as stated by management and confirmed by
              investors, does not depend on PBM regulatory reform to generate returns, positioning it as a business
              model rather than a regulatory arbitrage play. General Catalyst's Holly Maloney characterized the long-run
              opportunity as "absolutely a $20 billion business to be built here," suggesting investors see significant
              headroom from current revenue and valuation levels. The $400 million investment is earmarked for expansion
              of PBM operations, scaling the Judi® EHP platform deployment, broadening unified medical claims
              processing, and hiring—with no debt or project-finance obligations publicly disclosed. Cash on hand,
              monthly burn rate, and runway are private and have not been disclosed by the company in any publicly
