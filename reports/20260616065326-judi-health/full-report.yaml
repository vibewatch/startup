          - type: callout
            title: Underwriting Requires Admin-Fee P&L Disclosure
            body: >
              Before underwriting Judi Health's financial risk, any investor or counterparty should require: (1)
              admin-fee net revenue segregated from drug-cost pass-through; (2) gross margin by segment; (3) trailing
              12-month cash burn and balance sheet; (4) live-member go-live schedule and probability-weighted revenue
              forecast; and (5) Prime Therapeutics alliance financial terms. Without these five disclosures, financial
              underwriting is not supportable from publicly available data.
