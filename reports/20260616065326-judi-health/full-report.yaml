      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Aligned Pricing Model as Structural Differentiator
            body: >-
              Capital Rx's NADAC-anchored, flat-fee model eliminates the misaligned incentive structures that regulators
              have targeted in the three dominant PBMs. While the FTC pursues OptumRx, CVS/Caremark, and Express Scripts
              for alleged anticompetitive rebating in insulin pricing, Judi Health's business model is structurally
              exempt from the practices under scrutiny—a defensible competitive position as PBM reform advances through
              legislation and enforcement. The bipartisan PBM Reform Act of 2025 and the Consolidated Appropriations
              Act, 2026 create regulatory tailwinds favoring aligned, transparent models.
            calloutType: strength
            claimRefs:
              - CO008
              - CO009
              - CO038
              - CO041
          - type: callout
            title: Key-Person Dependency on AJ Loiacono
            body: >-
              Judi Health's market narrative, investor relationships, and enterprise sales leadership are heavily
              concentrated in co-founder and CEO AJ Loiacono. The September 2025 departure of third co-founder Joseph
              Alexander from the company underscores the concentration of institutional knowledge in the two remaining
              co-founders. No succession plan or contingency framework for either co-founder has been disclosed
              publicly. This dependency warrants scrutiny in any acquisition or governance due diligence process,
              particularly given the company's expansion into a broader and more operationally complex enterprise health
              technology market.
            calloutType: risk
            claimRefs:
