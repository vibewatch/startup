          - type: callout
            title: Rebrand Signals Full Platform Ambition Beyond PBM
            body: >-
              The September 2025 rebrand from Capital Rx to Judi Health is a strategic repositioning signal: the company
              is moving from a pharmacy-only PBM challenger to a full-spectrum health benefits administration platform.
              The Amino Health acquisition, the Charlotte Hornets brand investment in a non-pharmacy market, and General
              Catalyst's framing of a potential $20 billion business all support this framing. Later chapters on market
              analysis and competitive positioning should assess whether enterprise wins in the medical benefits segment
              materially corroborate this expansion narrative beyond the pharmacy PBM base.
