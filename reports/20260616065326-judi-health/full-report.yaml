  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Judi Health operates in the most heavily regulated segment of U.S. healthcare. The FTC's 2024 interim
              staff report, issued under its Section 6(b) investigation of the six largest PBMs, found that those PBMs
              collectively process nearly 95% of all U.S. prescriptions and have engaged in self-preferencing,
              anticompetitive rebating, and practices that "artificially inflated insulin prices." While Judi Health is
              a transparent, flat-fee PBM and not a target of this investigation, the FTC report explicitly named Prime
              Therapeutics—Judi's largest growth partner—as one of the six covered entities, creating regulatory
              overhang on the alliance. The 2026 federal appropriations bill enacted new PBM reform provisions covering
              spread-pricing bans, rebate pass-through requirements, and enhanced transparency reporting, all of which
              benefit Judi's existing model but impose compliance obligations nonetheless. At the state level, all 50
              states enacted at least one PBM law between 2017 and 2023 per the NAIC; several states impose fiduciary
              duty on PBMs. ERISA preemption creates ongoing legal uncertainty for state PBM mandates, though the
              Supreme Court has upheld some state pharmacy-reimbursement statutes. No public litigation involving
              Capital Rx / Judi Health was identified in this review. HIPAA and ERISA fiduciary obligations apply to
              Judi as a business associate and plan administrator, requiring rigorous data governance and prudent plan
              management standards.
