    title: Admin-Fee Net Revenue — Implied Valuation at Different Multiples (Bar Chart)
    type: bar
    layout: wide
    summary: >
      Bar chart showing the implied enterprise value of Judi Health at three admin-fee NR scenarios (low $37M, mid
      $111M, high $185M) and three revenue multiples (10×, 20×, 30×). The current $3.25B valuation requires mid-to-high
      NR at a 20–30× premium.
    data:
      items:
        - label: Low NR $37M @ 10×
          value: 370
        - label: Low NR $37M @ 20×
          value: 740
        - label: Low NR $37M @ 30×
          value: 1110
        - label: Mid NR $111M @ 10×
          value: 1110
        - label: Mid NR $111M @ 20×
          value: 2220
        - label: Mid NR $111M @ 30×
          value: 3330
        - label: High NR $185M @ 10×
          value: 1850
        - label: High NR $185M @ 20×
          value: 3700
        - label: High NR $185M @ 30×
          value: 5550
    approximationNotes: >
      Admin-fee net revenue estimates (1%, 3%, and 5% of $3.7B gross) are unconfirmed by the company. Multiple range
      references HealthEquity (~5× total revenue), high-growth SaaS health peers (15–25×), and growth-equity premium
      (25–35×). The $3.25B current valuation is most consistent with mid-high NR at 15–30× or high NR at ~18×.
