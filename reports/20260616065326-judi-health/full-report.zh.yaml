  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：PBM 服务、自保雇主管理和平台邻近机会
        blocks:
          - type: paragraph
            body: >-
              Judi Health 竞争的位置横跨三个部分重叠的市场，清楚界定每一层边界对测算规模和估值很关键。

              核心市场是美国药房福利管理，覆盖药品制造商、药房、健康计划赞助方和计划成员之间的中介功能。该市场包括：药房理赔裁定与支付；处方集设计和层级管理；与制造商谈判返利；包括事先授权和使用审核在内的专科药房管理；零售药房网络签约；以及邮寄配药。不计入
              PBM 服务边界的包括底层药品采购成本本身（PBM 将其穿透给计划赞助方）、医疗理赔处理（这是独立的 TPA 或保险公司职能）、药品批发分销和药品制造。市场研究机构发布的 PBM“市场规模”数字——2026 年从
              $647 billion 到 $755 billion 不等——包含 PBM 代计划赞助方管理的穿透式药品支出，而不只是 PBM 服务费收入。这个区别很关键：Judi Health
              真正可触达的费用池只占这些标题数字的一小部分。公司的 Capital Rx 透明 PBM 按成员每月收取固定管理费，而不是按药品支出抽成，因此其可服务市场是可以争取的管理服务合同池，而不是所管理药品总成本。

              第二层市场是更广义的健康福利管理——围绕雇主健康计划，在药房、医疗、牙科和视力福利上设计、管理、裁定理赔并出具报告的平台与服务业务。Judi Enterprise Health
              Platform（EHP）在这里对上传统 TPA、健康计划行政服务组织（ASO）和独立福利管理软件供应商。Mordor 估计，全球福利管理软件市场 2026 年为 $2.01 billion，到 2031 年增至
              $3.27 billion，CAGR 为 10.23%。这是 Judi 平台授权 TAM 最干净的类比口径，但它漏掉了更大的 TPA 管理服务收入池。

              第三层是美国雇主赞助健康福利生态的总量——雇主健康计划管理费和受管理药品支出的总池子，任何 PBM 或健康福利平台都从中抽取收入。DOL 的 2026 Report to Congress on
              Self-Insured Group Health Plans 识别出 50,700 个自保计划和 4,800 个混合保险计划，参与人数分别合计 3900 万和 3300 万。这些计划赞助实体构成 Judi
              Health 的 Capital Rx PBM 合同来源。

              现状替代方案主要是三家纵向整合 PBM——CVS Caremark（CVS Health）、Express Scripts（Cigna/Evernorth）和 OptumRx（UnitedHealth
              Group）。据 Drug Channels Institute，三者在 2025 年合计处理了 80% 的美国等价处方理赔。这些现任者把 PBM
              服务与健康保险、专科药房以及越来越多的护理管理打包，借纵向整合经济性构筑竞争护城河。独立替代方包括 Navitus、Padriac 等穿透式和透明 PBM，HealthComp、Meritain、UMR 等传统
              TPA，以及 Businessolver、Employee Navigator 等更广泛的福利技术平台。Judi Health 的邻近扩张市场包括护理导航（现由通过 Amino Health 收购来的 Judi
              Care 覆盖）、Medicare Part D PBM 合同（监管环境不同于雇主 PBM 市场）和专科药房服务（由 PBM 关联连锁主导）。
