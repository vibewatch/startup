      - number: '4.5'
        title: 财务结论与承销边界
        blocks:
          - type: paragraph
            body: >
              Judi Health 呈现出财务上可信、但分析上不完整的图景。证据基础支持对累计融资 $607 million、投后估值 $3.25 billion、总收入轨迹（2021 年 $429 million 到
              2025 年预计 $3.7 billion）和签约成员增长（500 万雇主覆盖人数）作出高置信结论。 SEC Form D 文件独立印证了披露轮次金额。商业模式——固定费、穿透式 PBM 管理加 SaaS
              平台许可——结构上成立，且比依靠不透明获利的既有模式更能让管理层与客户激励一致。不过， 以下输入不足以支撑财务承销：实际管理费净收入；管理费分部毛利率；单位经济（管理费 PMPM、CAC、回本、流失）；
              月度现金消耗和现金续航期；Prime Therapeutics 联盟财务条款；EHP 许可经济性； 以及刚起步的医疗管理产品贡献的任何有意义收入。公司估值 / 总收入比例约为 0.9x（$3.25 billion
              / $3.7 billion），表面上相对纯 SaaS 倍数显得便宜， 但分母被穿透式药品成本放大而失真。若假设只看管理费口径，估值倍数会高得多， 更接近成长阶段健康科技公司。管理层自己的表述显示，2025 年
              PBM Reform Act 和持续的 FTC 执法行动带来的是监管上行（给 Capital Rx 这类透明 PBM 的顺风），而非下行风险。 上线与签约缺口是近期最重要的单一财务风险：它决定公司究竟能成为一家
              $20 billion 企业（投资者论点），还是只是一家资金充足但仍未规模化的平台。
