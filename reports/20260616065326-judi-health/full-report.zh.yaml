      - number: '1.5'
        title: 规模、牵引力与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              Judi Health 在 2025 年至 2026 年初展现出强劲商业动能。2026 年 1 月，公司宣布 Capital Rx 已超过 500 万名已签约雇主 PBM 覆盖成员，截至 2026 年 1 月 1
              日，平台上已有超过 100 万名计划成员上线。仅 2025 年，公司就签约并实施了 200 万名新的健康计划覆盖成员，包括 13 家 Fortune 500 企业、21
              家领先医院集团和医疗系统，以及若干州雇员计划。到 2025 年 9 月融资公告时，Judi 平台已有超过 400 万名雇主 PBM 成员和超过 5400 万名已签约健康计划成员。2025 年，公司连续第二年签下
              80 多个新合作关系，显示全国范围内对其利益一致、技术驱动模型的需求持续存在。Forbes 报道称，2025 年收入预计将达到约 $3.7 billion，较上一年约 $2.1 billion 增长超过
              75%；但该数字代表包含穿透式药品支出的总管理收入，且未经独立审计。

              关键非财务里程碑包括 2025 年 5 月获得 MedTech Breakthrough Award for Best Healthcare InsurTech Solution，以及 2025 年 9 月 24
              日在 New York Stock Exchange 宣布与 Charlotte Hornets 达成多年 NBA 球衣贴片合作，并计划开设 Charlotte 办公室、增加 200-250
              个本地岗位。监管环境具有实质相关性：FTC 正在对三大 PBM（OptumRx、CVS/Caremark、Express Scripts）提起诉讼，指控其在胰岛素返利上存在反竞争行为；Consolidated
              Appropriations Act, 2026 则通过 PBM 改革条款，包括在 Medicare Part D 中让 PBM 薪酬与药品价格脱钩。Judi Health 未被列入任何 FTC
              执法行动；其固定费用、NADAC 锚定模型在结构上不同于被审查做法。AMA 的 2026 Issue Brief 确认，四家 PBM 控制全国约 67% 市场，印证 Judi Health
              作为独立挑战者的定位：它明显不在主导型现任者阵营内。
