      - number: '5.3'
        title: 技术栈、集成与依赖
        blocks:
          - type: paragraph
            body: >-
              Judi Health 的工程招聘信号——尤其是 Observability 和 Streaming & Realtime Systems 方向的 Senior Scalability
              Engineer、Senior Applied AI/ML Scientist、Full Stack 和 Backend Software Developer、Data Engineer
              职位——确认其云原生架构依赖实时事件流、 可观测性工具和数据工程管线。公司的 GitHub 组织（capitalrx）托管了 Grafana 的一个 fork； Grafana
              是开源可观测性和监控平台，这印证它属于生产基础设施栈。截至 2026 年 6 月，公司仍在招聘 Director of Cloud Security，说明企业安全职能仍在建设， 而不是已经成熟且人员齐备。

              关键外部依赖包括：CMS NADAC 数据库（每周更新；定价准确性直接绑定 CMS 更新节奏）、 医疗理赔摄取所需的标准 EDI 和 HL7 协议、药房网络 API、健康计划资格数据源。 Prime
              Therapeutics 联盟给予 Prime 面向其 5,000 万以上覆盖成员独家访问 Judi 平台的权利， 也形成最大的单一技术依赖风险：这种规模的迁移在创业级 PBM 平台上没有公开先例，
              需要持续工程投入。Amino Health 收购又增加一项独立数据集成义务，因为 Judi Care 平台的 AI 导航依赖 Amino 专有服务方数据集和配置引擎。

              截至 2026 年 6 月，Judi Health 网站没有可访问的公开 API 文档、开发者门户或集成指南。 公司 GitHub 足迹仅限于 capitalrx 组织下一个 fork 的 Grafana
              仓库。缺少公开开发者界面， 与企业 B2B 模型一致，但也限制了对平台能力的独立技术验证。
