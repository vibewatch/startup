  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 现任 PBM 格局
        blocks:
          - type: paragraph
            body: >-
              三家药房福利管理商已连续多年掌握约 80% 的美国等价处方理赔，这一集中度到 2025 年仍保持一致。Express Scripts（Cigna 的 Evernorth 部门）连续第二年位居第一，2025
              年处理约 22.2 亿笔等价理赔，同比增长 4.8%；增长由 2024 年 1 月生效的 Centene 2000 万成员合同从 CVS Caremark 转出推动，也受到 Prime Therapeutics
              继续依赖 Express Scripts 处理约一半零售药房网络签约的支撑。CVS Caremark 在 2025 年处理约 19 亿笔等价理赔，同比下降 0.9%，这是 Centene
              迁移后的连续第二年下滑。Optum Rx 在 2025 年管理 $188 billion 药品支出，其中 46%（$87 billion）被归为专科药；关键在于，Optum Rx 2025 年收入的 63% 来自
              UnitedHealthcare 内部业务，给它提供了外部挑战者无法复制的结构性 captive
              客户基础。三者均由同时控制大型保险公司、专科药房和医疗服务网络的组织持有，能够在幕后形成经济性；即使计划赞助方切换到独立 PBM，它们仍可赢得业务，因为许多独立 PBM 仍把理赔处理、网络签约或返利谈判外包回
              Big Three 之一。Federal Trade Commission 在 2024 年 7 月报告中正式表达担忧，将这些中介称作“推高药品成本、挤压 Main Street 药房的强势中间商”；2025
              年初，一名仲裁员认定 Prime Therapeutics 的 Express Scripts 网络安排违反联邦和州反垄断法——这为挑战者创造监管顺风。Prime Therapeutics 是一家与 Blue
              Cross Blue Shield 关联的 PBM，由 19 个 BCBS 健康计划持有；它 2025 年报告处方支出 $55.3 billion、理赔 4.07 亿笔，但约一半网络理赔由 Express
              Scripts 处理，实质削弱了其独立性。MedImpact Healthcare Systems 是最大私营独立 PBM，2024 年初完成对 Rite Aid 的 Elixir Solutions
              业务收购，但在财务和技术投资披露上越来越保守。
