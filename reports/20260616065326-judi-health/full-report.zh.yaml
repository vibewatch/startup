      - number: '4.2'
        title: 牵引指标与增长轨迹
        blocks:
          - type: paragraph
            body: >
              Capital Rx 在已签约 PBM 覆盖人数上已经达到有意义规模，但签约成员和上线（产生收入）成员之间仍有明显缺口。 截至 2026 年 1 月，公司签约雇主 PBM 覆盖人数超过 500 万，其中约 100
              万成员已上线并活跃使用平台——上线与签约比例约 20%。2025 日历年，公司签约并实施了 200 万新的健康计划成员，并连续第二年签下 80 多个新客户合作，包括 13 家 Fortune 500 公司和 21
              家领先医院集团。2025 年 9 月 Series F 被称为超额认购，也印证了需求。雇主 PBM 覆盖之外，Judi® 平台在 Capital Rx 全组合中已签约 5,400 万以上健康计划成员（包括
              Prime Therapeutics 联盟），但该数字包含 Prime 管理的成员，其收入经济性主要流向 Prime，而非直接流向 Judi Health。公司引用了自有员工健康计划的内部概念验证：1,800
              名成员同比节省成本 11%，理赔处理时间降至 18 天（此前超过 6 个月）。对于刚起步的统一医疗和药房管理产品， Judi Health 截至 2025 年 9 月只披露约 40,000
              名成员，凸显这条收入线仍处早期。 收入增长轨迹持续加速：2021 年总收入 $429 million，2022 年估计 $814 million， 2024 年约 $2.1 billion，2025 年预计约
              $3.7 billion，最近一年复合增速约 75%。不过，缺少管理费净收入披露后，对这些收入顶线的解读仍然受限。
