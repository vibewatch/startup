  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价架构
        blocks:
          - type: paragraph
            body: >
              Judi Health 采用固定管理费模型收费——客户可选择按每成员每月（PMPM）或按每张处方计费， 对象是雇主和计划发起人。既有 Big Three PBM（CVS Caremark、Express
              Scripts、Optum Rx） 依靠价差定价、返利留存和追回款获利；Capital Rx 则把每种药品都按 Centers for Medicare and Medicaid
              Services（CMS）维护、公开可查的 National Average Drug Acquisition Cost（NADAC）定价。药品成本全额穿透给计划发起人；Capital Rx
              只收取固定管理费，以及针对事前授权等服务披露的固定临床费用。公司把这种模式形容为「类似 Fidelity 管理 401(k) 计划时的记录保管业务」。事前授权和其他管理式医疗服务的额外临床费用，
              会在客户发票底部逐项列明。截至 2025 年 9 月，Judi Health 的 Enterprise Health Platform（Judi®）还从第三方健康计划和 TPA 获得类似 SaaS 的许可收入——
              最突出的是通过与 Prime Therapeutics 的独家技术协议——但许可费结构和 SaaS 总收入均未公开披露。 最近推出的 Judi Care 导航产品（2025 年 6 月从 Amino Health
              收购）又增加了潜在第四条收入线， 容量约 6,000 万覆盖人群，但尚无单独定价或收入贡献数据。关键含义是，Judi Health 的总收入口径（2025 年估计 $3.7 billion）包含全部药品成本穿透，
              因而大幅高估公司实际赚取收入；真正的管理费净收入——商业上更相关的指标——从未披露。
