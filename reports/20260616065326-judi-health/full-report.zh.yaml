      - number: '1.4'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Judi Health（当时以 Capital Rx 运营）于 2018 年 3 月完成约 $3 million 种子轮，拿到第一笔机构资本；2019 年 7 月又完成 $16 million Series
              A。约 2021 年，公司完成 Series B，但公开来源未披露金额。Series F 之前公开记录最完整的一轮是 2022 年 6 月的 $106 million Series C，由 B Capital
              Group 领投，当时累计融资达到 $175 million。随后公司完成一轮细节未披露的 Series D，并约在 2024 年 3 月完成 Series E，投后估值 $1.5 billion。Prime
              Therapeutics LLC 也在 2024 年 2 月战略技术联盟中成为 Capital Rx 少数股东，该联盟授予 Prime 对 Judi 平台的独家访问权。

              最重要的融资事件发生在 2025 年 9 月 23 日。Capital Rx 在同步更名为 Judi Health 时宣布 $400 million 投资，包含 $252 million Series F
              股权融资，以及计划于 2025 年 10 月初完成交割的其他证券投资。本轮由 Wellington Management 和 General Catalyst 领投，公司称认购超额；早期投资者出售了超过 $150
              million 的二级股份。其他参与投资者包括 Generation Investment Management、Growth Equity at Goldman Sachs
              Alternatives、9Yards Capital、B Capital、Edison Partners、Prime Health Investments 和 Transformation
              Capital。公司披露，自创立以来累计融资 $607 million，投后估值 $3.25 billion，超过此前 $1.5 billion 的两倍。作为私营公司，Judi Health
              未在公开来源披露任何债务融资、信贷协议或股权激励计划细节。
