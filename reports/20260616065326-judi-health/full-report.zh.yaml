        title: 信任、安全、合规与质量控制
        blocks:
          - type: paragraph
            body: >-
              Judi Health 最近一次更新于 2026 年 4 月 3 日的隐私政策确认，通过 judi.com 成员网页门户、 iOS 和 Android 上 Capital Rx
              品牌移动应用，以及与健康计划客户签署的业务伙伴协议处理的所有受保护健康信息（PHI）， 均遵守 HIPAA 和 HITECH。该政策指定 Capital Rx, Inc. 为设有 Chief Privacy
              Officer 的实体，Judi Health, LLC 和 Amino, LLC 为个人数据共同控制方。公司承认所有适用州的州特定隐私权。

              HIPAA/HITECH 之外，截至 2026 年 6 月，公司尚未公开披露 SOC 2 Type II 或 ISO 27001 等云基础设施独立第三方认证。Prime Therapeutics COO 在
              2024 年 2 月联盟公告中公开称 Judi 平台提供「最先进的安全能力」，但该判断尚未由已发布审计报告或认证支撑。 利用管理岗位招聘提到 URAC/NCQA 认证标准是运营要求，说明公司在运营上瞄准这些标准，
              但公开披露尚未确认正式认证状态。截至 2026 年 6 月仍在招聘 Director of Cloud Security， 表明企业安全项目还在成熟过程中。
