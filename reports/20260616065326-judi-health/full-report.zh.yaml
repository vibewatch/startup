      - number: '3.3'
        title: 邻近、替代与现状方案
        blocks:
          - type: paragraph
            body: >-
              除直接 PBM 竞争外，雇主若要完成同一项任务——降低药房和健康福利支出，同时简化管理——还有若干邻近和现状路径。Transcarent 运营生成式 AI 驱动的健康与护理导航平台，通过 WayFinding
              体验整合医疗、药房和点解决方案，引导成员 24/7 获得个性化按需护理；它在导航层与 Judi Care（Judi Health 通过 Amino Health
              收购获得的护理导航品牌）竞争，但不提供理赔裁定或处方集管理。Waltz Health 在被收购后现属 EVERSANA，提供多卡处方市场搜索方案，优化现金支付和折扣卡价格，但不作为 PBM
              运营；它处在狭窄邻近赛道，而不是直接替代威胁。最主流的现状替代方案仍是 carve-out PBM 加独立医疗 TPA 加导航供应商配置：雇主从多个现任者购买 best-of-breed
              点解决方案；这种模式造成数据孤岛、双重管理开销和激励错配——这正是 Judi Health 的 Judi EHP 统一理赔处理平台要消除的痛点。保险公司捆绑 PBM（承保方在 ASO 安排中打包
              PBM）和内部自主管理，则是面向非常大型或非常成熟雇主买家的额外替代方案。Judi Health 的 Capital Rx 透明模型和更广泛 Judi EHP 平台明确对标所有这些现状配置，并将 Judi
              平台描述为行业首个 Unified Claims Processing 系统，可在单一云原生环境里整合药房和医疗理赔。Express Scripts 仅在 2023 年就通过供应链和临床项目为客户节省 $38
              billion，说明即便计划赞助方不满，现任者生态的财务切换成本引力仍然很强。
