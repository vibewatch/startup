            title: 利益一致的定价模型构成结构性差异
            body: >-
              Capital Rx 的 NADAC 锚定、固定费用模型剔除了监管机构盯上的三大主导 PBM 中的激励错配结构。FTC 追诉 OptumRx、CVS/Caremark 和 Express
              Scripts，指控其在胰岛素定价中存在反竞争返利；Judi Health 的商业模式在结构上不涉及被审查做法。随着 PBM 改革通过立法和执法推进，这一差异构成可防守的竞争位置。两党版 PBM Reform
              Act of 2025 和 Consolidated Appropriations Act, 2026 都在制造监管顺风，偏向利益一致、透明的模型。
