        title: 客户基础与细分广度
        blocks:
          - type: paragraph
            body: >-
              Judi Health / Capital Rx 面向一组很宽的机构买家，核心是自筹资金或管理健康福利的组织。 主要细分包括：（1）自筹资金雇主，从小型市政机构到 Fortune 500 公司；（2）工会，
              其中许多属于全美最大工会；（3）医院集团和健康系统，它们既使用平台，在一些案例中也投资平台； （4）健康计划——商业、Medicare 和 Medicaid——主要通过 Prime Therapeutics
              联盟服务； （5）授权使用 Judi 企业健康平台的第三方管理员（TPA）；（6）学术机构， Rice University 是公开点名的锚定案例。雇主市场内，Capital Rx
              同时覆盖完全自筹资金计划发起人（核心 Capital Rx PBM 产品）和预算受限、希望通过 2025 年 11 月推出的 Capital Equilibrium
              定额自筹产品获得成本可预测性的小型雇主。公司明确服务「全美 50 个州」客户， 并把大型工会、州雇员福利计划和市政机构作为高价值细分。经纪和顾问渠道是市场进入 的中心；Judi Health
              运营专门的经纪门户，并把平台的受托合规工具定位为福利顾问的竞争差异点。 健康计划侧，Judi 平台支持商业、Medicare 和 Medicaid 裁决，把可服务市场远远扩展到雇主 PBM 之外。收购 Amino
              Health 并创建 Judi Care（面向药房、医疗、牙科和视力的护理导航）， 增加了面向消费者的一层，加深公司对雇主客户的黏性，也创造了向综合健康福利管理交叉销售的机会。 客户广度得到 2025 年一年签下
              80 多个新合作的验证，且这是连续第二年达到这一速度。
