        - 要求按雇主与健康计划渠道拆分队列级 CAC 和回本数据
      - - PMPM / 按理赔管理费率
        - 无法对标竞争对手，也无法按会员验证价值交付
        - 要求提供代表性合同费率表，或前四分位客户平均实际费率
      - - EHP 和 Judi Care 授权费结构
        - 无法独立于 PBM 管理业务为平台授权收入定价
        - 要求披露 Judi® 和 Judi Care 授权协议的平均 ACV、期限和续约率
      - - 客户流失和留存队列数据
        - 无法评估收入稳定性；已签约与活跃之间的缺口可能掩盖取消
        - 要求提供自 2021 年以来多年队列留存，展示合同续约和上线转化
      - - Prime Therapeutics 联盟财务条款
        - 无法评估收入集中度、技术费收入或战略依赖风险
        - 要求披露 Prime 排他协议的财务条款，包括费用结构、最低承诺和退出条款
    notes: 这些缺口截至 2026 年 6 月，基于公开可得信息评估。上述所有项目都可由公司在 NDA 下提供给尽调方；私人公司预计不会在公开备案中披露这些内容。
