      - CV025
      - CV015
      - CV016
  - id: FV002
    title: Judi Health 估值桥 — Series D 至 Series F（$M）
    type: waterfall
    layout: standard
    summary: >
      瀑布图拆解估值从 $1,500M 的 Series D（2024 年 3 月）抬升至 $3,250M 的 Series F（2025 年 9 月），并按分析师归因的价值驱动拆分。收入增长带来的重估贡献最大；EHP
      平台期权价值和战略联盟溢价合计贡献了增量价值的近一半。
    data:
      items:
        - label: Series D 投后估值（2024 年 3 月）
          value: 1500
        - label: 收入增长重估
          value: 750
        - label: EHP 平台期权价值
          value: 500
        - label: 战略联盟溢价
          value: 300
        - label: 监管顺风重估
          value: 200
        - label: Series F 投后估值（2025 年 9 月）
          value: 3250
    approximationNotes: |
      归因项为分析师估算；公司未披露估值桥。增量项目合计（750+500+300+200=1750）加上 $1,500M 基准，等于 $3,250M。每个组成部分本身都不确定，仅应视为示意。
