  - id: FV001
    title: 可比公司 EV/Revenue 倍数区间 — PBM 与福利科技（2026 年 6 月）
    type: range
    layout: standard
    summary: >
      相关上市可比公司的 EV/Revenue 倍数区间图，为估值讨论提供锚点。传统 PBM（Caremark、Evernorth、OptumRx）按合并收入计约在 0.5–1.5×
      交易；福利管理平台（HealthEquity）和数字健康公司（Omada）可拿到 4–6×；Judi Health 的总收入倍数（0.9×）落在 PBM 一端，而管理费 NR 倍数（18–90×）已经超出图表范围。
    data:
      items:
        - label: Evernorth (Cigna) — PBM 分部
          low: 0.5
          high: 1
          unit: ×
          note: 按 Cigna 合并 EV/revenue 估算 PBM 分部归属
        - label: CVS Caremark — PBM 分部
          low: 0.4
          high: 0.8
          unit: ×
          note: 按 CVS 合并 EV/revenue 估算 Caremark 分部归属
        - label: OptumRx — PBM 分部
          low: 0.3
          high: 0.6
          unit: ×
          note: 按 UHG 合并 EV/revenue 估算 Optum Rx 归属
        - label: Evolent Health (EVH) — 专科护理管理
          low: 0.3
          high: 0.5
          unit: ×
          note: FY2025 收入 $1.876B；商誉减值压低市值
        - label: Omada Health (OMDA) — 数字健康雇主市场
          low: 3.5
          high: 4.5
          unit: ×
          note: 2025 年 6 月 IPO；FY2025 收入约 $261M；非关联方市值约 $1.05B
        - label: HealthEquity (HQY) — 福利管理 SaaS
          low: 4.8
          high: 5.8
          unit: ×
          note: 截至 2026 年 1 月的财年：收入约 $1.31B；市值约 $7.0B；毛利率 70%
        - label: Judi Health — 按总收入（$3.7B）计算
          low: 0.8
          high: 1
          unit: ×
          note: 当前 $3.25B 估值 / 2025 年预期总收入 $3.7B
        - label: Judi Health — 按管理费 NR（中点估算 $111M）计算
          low: 17
          high: 35
          unit: ×
          note: 区间展示 $3.25B 估值在管理费 NR $37–185M 区间内的对应位置
    approximationNotes: |
      PBM 分部 EV/revenue 倍数由分析师按公司合并财务估算分摊；没有公司单独披露 PBM 分部市值。Judi Health 管理费 NR 尚未确认；区间按总收入估算值的 1–5% 计算。
