chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Judi Health 是一家位于纽约的企业健康科技公司和福利管理机构，为自保雇主、健康计划、第三方管理机构和政府实体提供一套统一的药房与医疗福利管理解决方案。公司面向客户运营三个主要品牌：Capital
              Rx，即公司的透明药房福利管理商（PBM）；Judi Health，即覆盖药房、医疗、牙科和视力福利的全服务健康福利管理平台；以及 Judi（adjudication 的简称），其自研云原生 Enterprise
              Health Platform（EHP），也是前两个品牌的技术底座。第四个产品 Judi Care 是 AI 驱动的护理导航方案，来自 2025 年 6 月收购 Amino Health。

              Capital Rx 区别于传统 PBM 的核心在固定费用定价模型：公司不靠药品价差、返利截留或不透明扣款赚钱，而是向客户按成员每月或按理赔收取固定管理费。药品定价锚定 National Average Drug
              Acquisition Cost（NADAC），这是 CMS 维护、每周更新的公开数据库，要求签约药房按 NADAC 或更低价格收费。该模型旨在剔除传统 PBM
              结构中的利益冲突，也是公司面向追求成本可预测性和利益一致性的自保雇主时的核心价值主张。公司将 Judi 平台称为行业首个 Unified Claims Processing 系统，可在单一、可扩展的 SaaS
              环境里端到端管理药房和医疗理赔。公司母体 Capital Rx, Inc. 注册为 Delaware public benefit corporation（PBC），在法律上承诺企业同时追求社会目标与利润。
