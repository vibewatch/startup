            - HIPAA 大规模泄露；网络 APT 攻击
            - Prime 联盟终止；FTC 对 Prime 或 Judi 执法
        - label: 高影响
          values:
            - AWS 中断；CTO 关键人物流失
            - Amino 整合失败；降轮融资；ERISA 受托责任索赔
            - 雇主已上线数量停滞（1M vs. 5M）；州级 PBM 许可缺口
        - label: 中等影响
          values:
            - CLEAR 身份合作方失败
            - GLP-1 成本激增推动重新谈判；联邦 PBM 改革合规成本
            - 2026 年底前未达到雇主 3M 已上线里程碑；现有对手价格反击
        - label: 低影响
          values:
            - n/a
            - 品牌重塑造成渠道混淆（Capital Rx → Judi Health）
            - 药品改革压缩总毛利率
    approximationNotes: 风险位置是分析师基于公开监管文件、FTC 报告和公司披露作出的定性评估；没有可用的内部风险评分方法。
    claimRefs:
      - CR001
      - CR002
      - CR016
      - CR023
      - CR025
      - CR030
      - CR039
  - id: FR002
