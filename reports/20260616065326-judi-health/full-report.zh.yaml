            body: >-
              Capital Rx PBM 业务是平台最成熟的商业产品。截至 2026 年 1 月，签约雇主 PBM 覆盖人数超过 500 万，公司声称实施满意度 100%、客户留存率 99.5%。相比之下， 2025 年 9
              月 Series F 公告时，Judi Health 统一医疗理赔平台只签下「几个大型雇主计划」 加一个约 40,000 名成员的 TPA——规模只是 PBM 的一小部分——说明医疗集成仍处于早期商业部署。
              $400 million Series F 明确用于扩大这项 EHP 部署。

              关键技术风险集中在三处：（1）Prime Therapeutics 迁移——把 5,000 万以上成员搬到创业公司平台， 是前所未有的技术重活，公开披露并未降低执行风险；（2）Judi Care AI
              导航逻辑和数据新鲜度没有独立验证， Amino Health 数据集并入更广理赔层的整合仍在推进；（3）缺少已发布的 SOC 2、ISO 27001 或类似认证，再加上 2026
              年仍在招聘云安全负责人，企业买家在面对数百万 PHI 记录处理时， 缺少与风险规模匹配的独立安全姿态确认。

              路线图方面，公司确认 MPPP（Medicare Prescription Payment Plan）已作为平台产品提供， Never Move Again 于 2024
              年推出，用来降低计划发起人的迁移摩擦。公司尚未发布 2026 年详细功能路线图。
