      - number: '8.4'
        title: 情景分析——多头、基准与空头
        blocks:
          - type: paragraph
            body: >
              下列三种情景以 2027–2028 年退出或 mark-to-market 窗口为基准，并假设 admin-fee 净收入一旦披露，就会成为主要估值基础；任何 arms-length 交易或 IPO
              流程都应如此。每个情景分别假设不同的 admin-fee 渗透率、live-to-contracted 转化速度，以及倍数收缩或扩张。

              多头情景（$8–12 billion，概率信号：15–20%）：Judi EHP 平台在 Prime Therapeutics 之外拿下 3–5 家主要健康计划客户，24 个月内新增 2000–3000 万
              net-new managed lives。Admin-fee 净收入达到 $350–600 million。PBM Reform Act 2025 通过并强制 spread-pricing 透明，显著加速
              Capital Rx 透明模式获客。General Catalyst 的 $20 billion 论点得到部分验证。适用倍数：15–20× admin-fee NR，符合高增长、SaaS-adjacent
              经常性平台。

              基准情景（$3–5 billion，概率信号：55–65%）：随着 400 万后置雇主 PBM 成员上线，且到 2026–2027 年 admin-fee 净收入被确认为 $150–250 million，当前
              $3.25 billion 价格大体维持或小幅上行。平台留住 Prime Therapeutics 作为 anchor tenant。PBM
              改革提供监管验证，但不会带来新客户获胜的阶跃变化。适用倍数：$150–250 million admin-fee NR 的 15–20× = $2.25–5.0 billion；中点约 $3.5 billion。

              空头情景（$800 million–$1.5 billion，概率信号：20–25%）：受实施复杂度拖累，live-to-contracted 转化率到 2027 年仍停滞在 <25%。Prime
              Therapeutics 在新领导层或 M&A 背景下重新审视联盟。重大健康数据泄露造成监管暴露。由于爬坡后置，admin-fee NR 仍停留在 $50–80 million。Health tech
              可比倍数压缩（见 Evolent Health、Accolade）把管理溢价拉回 10–12× NR，隐含 $500–960 million 内在价值。回到 $1.5 billion 需要战略收购方溢价。
