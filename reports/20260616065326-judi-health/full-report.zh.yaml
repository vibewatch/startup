  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              Judi Health 的多头论点立在三根结构性支柱上。第一，Capital Rx 运营透明、固定费用、按 NADAC 定价的 pharmacy benefit management 模式；FTC
              持续执法以及两党支持的 PBM Reform Act of 2025 正在瞄准传统 Big Three（Express Scripts/Evernorth、CVS Caremark、OptumRx）的
              spread-pricing 做法，Capital Rx 因此在结构上受益。Capital Rx 不从药品价差或 rebate 留存中赚钱，监管收紧是顺风，不是威胁。第二，Judi Enterprise
              Health Platform（EHP）代表统一理赔处理的期权价值——这个品类几乎没有成熟上市可比公司，管理层和领投方 General Catalyst 估算的 TAM 为 $20
              billion。第三，Prime Therapeutics 联盟（已签约 5400 万健康计划成员，2024 年 3 月以 $1.5 billion 估值进行 $115 million
              战略投资）提供了一个运营上很难复制的分销护城河。

              反论点集中在执行风险和收入质量不透明。Judi Health 2025 年 $3.7 billion 总收入包含药品成本 pass-through，规模远大于公司真正赚到的收入；admin-fee
              净收入估计只占总收入 1–5%，约 $37–185 million，公司的真实经济规模高度不确定。截至 2026 年 1 月，500 万已签约雇主 PBM 成员中只有约 100 万 live on
              platform（live 比例约 20%），意味着收入管线大幅后置。公司在品牌上投入激进——与 Charlotte Hornets 的 NBA 球衣 patch
              合作未披露费用，显示营销成本偏高——但公开财务指标仍很稀疏。可比 health-tech 公司（Evolent Health、Accolade）在 2024–2025 年经历了严重 multiple
              compression，说明该板块情绪可以迅速转向。
