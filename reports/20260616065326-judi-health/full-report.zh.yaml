      - number: '5.2'
        title: 工作流与运营模型
        blocks:
          - type: paragraph
            body: >-
              Judi 平台的核心工作流围绕实时理赔裁决展开：计划成员配药时，理赔进入 Judi EHP， 平台套用 NADAC 定价（CMS 每周更新）、验证资格、检查处方集，并实时裁决理赔。
              成员服务代表可同时在平台内看到完整理赔生命周期——包括拒绝原因和批准逻辑——从而实现当日问题解决。 Rice University 自 2024 年中开始成为 Capital Rx
              客户后报告称，计划配置问题可以当天修复， 而遗留 PBM Express Scripts 需要 3–4 周周转。

              医疗理赔工作流与药房模式相似：服务方通过 EDI 标准提交理赔，同一个 Judi 平台摄取、裁决并报告。 Unified Claims Processing™
              让计划发起人在同一套规则、数据访问和报告下管理药房和医疗福利， 消除了分别维护 PBM 和医疗 TPA 关系带来的管理孤岛。Forbes 报道，Judi Health 内部使用自家医疗平台后，理赔处理时间从超过
              6 个月缩短到最多 18 天，同时同比节省成本 11%。

              Judi Care 导航与理赔层整合：成员使用 Benefits Hub，基于 200 个专科的服务方成本和质量数据搜索网内服务方、 实时预约、查看覆盖范围，并借助理赔历史路由处方。这个 AI
              驱动导航层位于裁决引擎之上， 依赖 Amino Health 专有数据聚合和配置框架。
