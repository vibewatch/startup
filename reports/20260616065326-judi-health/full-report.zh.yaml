      - number: '7.2'
        title: 运营、技术与安全风险
        blocks:
          - type: paragraph
            body: >
              Judi Health 作为健康数据托管方，处理 500 万+ 雇主 PBM 会员和 5400 万+（已签约）健康计划成员的药房福利理赔，HIPAA 暴露很重。HIPAA Privacy and Security
              Rules 对受监管实体和商业伙伴都设定义务，HHS OCR 也在积极执法：OCR 每年推动数百起案件完成整改，达成的和解协议通常包含民事罚款和多年整改计划。HIPAA 非法披露条款（42 U.S.C.
              §1320d-6）对未经授权披露 PHI 同时设定民事和刑事处罚。Judi 的安全架构——FISMA NIST 800-53 框架、攻击面最小化的 serverless AWS
              基础设施、实时威胁监控、内容过滤——体现出明确的安全优先姿态，但外部尚未公开确认其拥有独立 SOC 2 Type II 或 HITRUST 认证。Amino/Care Navigation 收购带来整合风险：把
              care-navigation 软件、provider-search 能力和 benefits wallet 并入企业级 PBM adjudication
              平台，会提高系统复杂度和实施接触面。大型雇主和健康计划客户迁移到 Judi 平台，需要多年实施项目；当前 100 万 live 与 500 万已签约雇主成员之间的缺口显示，实施速度落后于签约速度。本次审查未发现
              Capital Rx 或 Judi Health 相关安全事件或数据泄露。
