      - number: '3.4'
        title: 差异化耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Judi Health 的竞争力建立在三根相互交织的差异化支柱上：通过 Capital Rx 采用锚定 NADAC 的固定费用透明定价，消除价差和留存返利；云原生 Judi EHP 统一理赔平台，在同一个
              SaaS 环境里处理药房和医疗理赔；以及与 Prime Therapeutics 的战略联盟，在 Blue 系统规模上验证技术和商业模式。截至 2026 年 1 月，Capital Rx 签约雇主 PBM
              覆盖人数超过 500 万，Judi Health 已签约 5,400 万健康计划成员在 Judi 平台上运行，2025 年收入估计约 $3.7 billion， 同比增长 75% 以上。不过，2025 年独立
              PBM 整体仍在 Big Three 的边缘地带拿份额， 其中许多仍依赖 Big Three 的理赔处理基础设施、网络签约和返利聚合能力； 这种结构限制了任何挑战者 PBM 真正脱离既有生态的程度。正在成形的
              Net Pricing Drug Channel——Drug Channels Institute 认为正在加速的监管和市场转向， 核心是净价透明——会挤压 Big Three 的返利价差利润模型，也可能扩大
              Judi Health 等透明挑战者的结构性优势。关键护城河风险包括：定价透明可能商品化， 因为多个挑战者已经共享这一主张；Prime 对 Express Scripts 的依赖和 2025
              年反垄断裁定仍未解决； Optum Rx 可借 UnitedHealthcare 体系内收入交叉补贴 PBM 定价的垂直整合优势； 以及多产品捆绑（药房 + 医疗）在竞争性 RFP
              中的耐久性尚未被验证。Prime Therapeutics 联盟既是一次验证事件，也是单一伙伴集中风险；如果反垄断案件扰动 Prime 的网络安排，JUDI 平台推出时间表可能被推迟或重塑。
