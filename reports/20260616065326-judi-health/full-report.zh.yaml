      - number: '7.4'
        title: 财务、商业模式与治理风险
        blocks:
          - type: paragraph
            body: >
              Judi Health 披露的总收入（2024 年 $2.1B，2025 年预计约 $3.7B）包含大量药品成本 pass-through；公司尚未披露净收入、毛利率、EBITDA，或 PBM /
              平台层面的单位经济。这种不透明让外部无法判断盈利路径，也无法评估商业模式真正的资本效率。固定 PMPM / 按理赔收费模式让 Judi 免受 spread-pricing 改革风险冲击，但 2026 年 PBM
              改革法下的 rebate pass-through 要求，可能影响任何 PBM 的收入构成。NADAC 定价提供了由 CMS 维护的稳定参考价，但如果药品采购成本持续下移——在 Inflation
              Reduction Act 药价谈判下并非不可能——总收入会按比例下降，净经济性却不一定改善。公司累计股权融资约 $610M；确切 burn rate、现金 runway 和债务结构仍未披露。AJ
              Loiacono（CEO）、Ryan
              Kelly（CTO）和联合创始团队承载了集中的智力资本；考虑到公司偏技术的定位，关键人物离职风险很实质。上市公司常见的治理披露（董事会构成、审计委员会、关联方交易）对这家私营公司并不可得。
