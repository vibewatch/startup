              透明挑战者在增长，但许多独立 PBM——包括 Prime Therapeutics——仍依赖 Express Scripts、CVS Caremark 或 Optum Rx 提供理赔处理、药房网络签约或返利聚合。
              这种结构依赖意味着，计划发起人即使选择替代 PBM，经济利益仍可能回流到 Big Three，从而限制真正竞争性颠覆的程度，也给 Judi Health 这类挑战者按既有巨头规模取得网络杠杆设下天花板。
