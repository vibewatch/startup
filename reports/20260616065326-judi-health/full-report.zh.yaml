  - id: TP003
    title: 替代方案与现状方案
    notes: 各行描述自保险雇主买方可能选择的实质替代配置，而不是全服务透明 PBM 或统一平台供应商。买方优势和限制为基于公开证据与市场观察的定性评估；不同雇主的结果会随规模、经纪成熟度和福利设计而变。
    columns:
      - 替代方案
      - 买方如何选择
      - 买方优势
      - 相对 Judi Health 的限制
      - 替换触发因素
    rows:
      - - 剥离式 PBM + 独立医疗 TPA + 导航供应商
        - 大型自保险雇主追求同类最佳时，默认采用多供应商方案
        - 现任关系、供应商专业化、从当前配置切换成本低
        - 数据孤岛；三家供应商协调开销；激励错位；总成本更高
        - 成本超支、数据质量失败或成员体验问题推动整合
      - - 保险公司捆绑 PBM（绑定承运人 ASO 或全保险）
        - 雇主使用大型承运人的 ASO 计划，并接受捆绑 PBM 作为交易一部分
        - 单一供应商关系、管理简化、RFP 负担降低
        - PBM 返利不透明；承运人利益冲突；更难退出；定制有限
        - 经纪主导的支出审计发现隐藏返利价差；雇主寻求透明拆包
      - - 内部福利自管理
        - 配备专职福利团队的超大型雇主（500K+ 名员工）搭建内部运营
        - 最大限度控制数据和成本；没有中间商利润
        - IT、合规和人员负担极高；对大多数中端市场雇主不现实
        - 监管复杂度或人才短缺让内部模式难以持续
      - - 独立折扣卡或现金支付优化
        - 小雇主或未保险人群寻求最低药房销售点成本
        - 简单、无合同、可立即部署、摩擦低
        - 没有处方集管理、UM、临床项目或理赔裁定能力
        - 福利复杂度上升或新专科药成本要求完整 PBM 关系
      - - 仅导航的点状方案（不更换 PBM）
        - 雇主在不更换 PBM 的情况下，为现有现任 PBM 增加导航供应商
        - 切换成本低；成员体验增量改善；供应商数量变化小
        - 无法解决药房价差或返利不透明；现任 PBM 激励不变
        - 导航投入未能压弯成本曲线后，雇主 CFO 推动完整 PBM RFP
    claimRefs:
