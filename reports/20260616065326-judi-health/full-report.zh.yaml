    title: 护城河耐久性与竞争风险登记表
    notes: 严重程度评级（高 / 中 / 低）是基于公开证据，对近期替换或利润率压缩风险的定性评估。尽调问题代表尚未解决的具体问题，需要访问保密数据才能回答。
