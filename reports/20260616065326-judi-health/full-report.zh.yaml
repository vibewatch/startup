              Judi 平台上的 5,400 万以上健康计划成员主要来自 Prime Therapeutics 联盟。 Prime 也是少数股东，且是 Judi 上唯一获许可的第三方 PBM，给健康计划收入线制造单点故障。
              另一个风险是，雇主 PBM 的签约转上线缺口为 4:1（500 万签约 vs. 约 100 万上线）， 意味着五分之四签约成员尚未转化为收入。两个风险都可管理，但投资者需要建模 Prime
