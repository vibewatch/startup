      - number: '2.4'
        title: 增长驱动与采用约束：监管改革打开门，现任者锁定、风险厌恶和复杂性又让门半掩
        blocks:
          - type: paragraph
            body: >-
              透明、技术驱动的 PBM 与福利平台具备强劲且多变量的结构性需求逻辑，但采用摩擦同样强；到 2026 年，两者都在同步增强。

              需求侧，医疗成本通胀是最大加速器。Business Group on Health 的 2026 Employer Health Care Strategy Survey 报告称，计划设计调整前，2026
              年医疗成本趋势预测中位数为 9%；采取缓解措施后降至 7.6%——这是十多年来最高中位数，也是实际成本连续第二年超过雇主预测和预算。药房成本是主要贡献项：雇主预计 2025 至 2026 年药房成本增加
              11–12%；2024 年，雇主全部健康支出中已有 24% 流向药房费用。专科药——主要是用于肥胖和糖尿病的 GLP-1 激动剂、肿瘤生物制剂和罕见病药物——仅占配发药品的 2%，却代表净处方药支出的
              52%（Navitus 引用 AJHP）。Milliman 预计，2025–2026 年商业计划总药房成本每年增加 11–14%；对于选择覆盖 GLP-1 的计划，仅 GLP-1 就预计每年上升 21–40%。

              监管环境已明显转向有利于 Judi Health。Consolidated Appropriations Act of 2026（CAA 2026）由 Trump 总统于 2026 年 2 月 3
              日签署，落地了有史以来最重大的联邦 PBM 改革。对于 Medicare Part D（2028 年 1 月 1 日生效），PBM 必须把薪酬限制为与药品价格、数量或返利水平无关的固定真实服务费；向计划赞助方穿透
              100% 制造商返利；并向 Department of Health and Human Services 提交详细到药品层级的报告。any-willing-pharmacy 要求将于 2029 年生效。对于覆盖
              100 名以上员工的商业 ERISA 计划，法规要求每半年报告净药品支出、价差定价和来自制造商的收入，并赋予年度审计权。商业计划的全额返利穿透大约于 2029 年 1 月生效。这些条款把 Judi Health
              已经合规的固定费用模型变成监管安全港，也把现任 PBM 模型重新定义为与新标准在结构上不兼容。FTC 对 Big Three 胰岛素返利操纵的持续诉讼，以及 2026 年 2 月与 Express Scripts
              的和解，则把法律执法压力叠加到监管压力上。

              福利碎片化是叠加驱动因素。雇主管理着彼此分离的 PBM、TPA、护理导航、牙科、视力和止损合同——这些合同往往又配有不同数据系统、成员 ID 和报告格式。Judi Health
              的价值主张，即单一统一理赔裁定平台，正面回应了这种碎片化；2026 年 1 月新闻稿也明确把向统一健康福利管理迁移描述为市场方向。

              约束侧，现任 PBM 锁定是最大摩擦。Big Three 提供多年合同（通常三到五年），带自动续约条款和高额退出条款，可能包括返利追回安排。成员更换处方集会面临临床扰动；理赔系统之间的数据迁移技术复杂，还需要
              PBM 在客户退出时配合——现任者可以拖延或阻挠。许多雇主也不愿在福利年度进行中制造成员扰动。FTC 发现，即便较小 PBM 赢得合同，Big Three 仍可作为幕后返利聚合方继续获利，因为独立 PBM
              往往缺乏直接谈判制造商返利的规模。

              ERISA 信托责任带来风险厌恶：福利负责人必须证明任何 PBM 切换都符合计划参与者最佳利益。结果是默认更保守、更偏向现状，也拉长采购周期。CAA 2026 透明度要求确实会加大对现任 PBM
              的信托审查——这会推动 RFP——但短期效果可能是采购周期更长，因为计划赞助方会先使用新的审计权，再决定是否切换。

              资本强度是新进入者的结构性约束，但对已融资 $607 million 的 Judi Health 不是同级别问题。运营一个全栈云原生理赔裁定平台，需要大量工程投入、精算和监管合规团队，以及客户实施能力。Judi
              Health 2026 年 1 月新闻稿明确指出，公司正使用 Series F 资本扩充团队和企业技术，以满足需求。

              信任与合规风险——也就是对实施失败、理赔处理错误或监管违规的担心——是大型雇主不愿迁往验证较少平台的首要原因。Judi Health 2026 年 1 月的牵引力（500 万名已签约雇主 PBM
              覆盖成员、5400 万名健康计划成员、80 多个新合作关系，其中包括 13 家 Fortune 500 公司）直接回应了这一担心，证明平台可在规模化场景下稳定运行。但已签约与已上线成员之间的差距（截至 2026
              年 1 月 1 日，500 万已签约，对比约 100 万已上线）本身也说明实施复杂度和周期仍然存在。
