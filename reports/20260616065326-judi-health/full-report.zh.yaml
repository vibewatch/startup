      - number: '8.2'
        title: 估值背景与倍数分析
        blocks:
          - type: paragraph
            body: >
              2025 年 9 月 Series F 确立了 $3.25 billion 的 post-money 估值，较 2024 年 3 月 Series D 的 $1.5 billion 估值在约 18
              个月内翻了一倍多。七轮股权融资累计达到 $607 million，其中 Series F（$252 million 股权加约 $150 million secondary sales）超额认购；secondary
              部分说明新投资人愿意按该价格接盘，但并未给资产负债表增加现金。

              按总收入看，隐含倍数约 0.9×（$3.25 billion / 2025 年预计 $3.7 billion 总收入）。表面上，这接近传统 PBM 的交易倍数；这类公司因药品成本 pass-through
              体量高，估值被压低——CVS Caremark 和 Evernorth 在合并口径下都低于 1× 总收入。但 Judi Health 的模式应按 admin-fee 净收入而非总 pass-through
              来评估；在这个口径下，隐含倍数为 18–90×（$3.25B / 估计 $37–185M admin-fee NR），这是 growth-equity 溢价，与 75%+ YoY
              增长轨迹和平台期权相符。HealthEquity（HQY）是最直接可比的上市 benefits-administration 公司，同样具备粘性、经常性、admin-fee 模式；截至 2026 年 1 月 31
              日财年，其总收入 $1.31 billion、市值 $7 billion，对应约 5.3× 收入。把 5× 倍数套到 $37–185M admin-fee 区间，今天内在价值为 $185–925
              million，远低于 $3.25 billion；这说明当前估值已经计入未来向更成熟 admin-fee 收入基数增长的大量预期。

              公司累计融资 $607 million、估值 $3.25 billion，隐含 price-to-total-capital 比约 5.4×；原始成本低于 $100 million 的早期投资人，账面上实际持有
              30–50× 投入资本的价值，这也解释了他们愿意在本轮出售 $150 million secondary shares。
