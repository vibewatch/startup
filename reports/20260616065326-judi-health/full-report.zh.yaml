      优先级分类（P1 阻断、P2 重大、P3 建议）反映分析师对每个开放问题阻碍资本配置决策程度的判断。P1 卡点是给出买入建议的绝对前提。状态基于截至 2026 年 6 月运行日的公开来源审阅。
