            body: >-
              五个内容要求领域都仍有关键尽调缺口。客户身份方面，没有 Fortune 500 雇主客户被公开点名， 公司截至 2025 年 9 月也拒绝向 Forbes 披露名称。采用方面，500 万签约与 100
              万上线成员的缺口， 需要厘清实施时间表、预期上线日期，以及上线前交易取消风险。留存方面，99.5% 是自报且定义不清（不清楚覆盖所有客户、 仅续约客户，还是仅全年同期群）。没有同期群或瀑布数据。扩张方面，医疗
              Unified Claims Processing 平台仍在早期部署，涉及一个未具名 TPA 和两个未具名大型雇主计划； 该产品线收入未单独披露。集中方面，Prime Therapeutics
              联盟范围、最低承诺条款和终止条款都是私有信息。 投资者应寻求：（1）五个或更多 Fortune 500 客户的参考名单；（2）至少回溯三年的经审计或顾问验证留存同期群； （3）Prime Therapeutics
              联盟合同期限和无因终止条款；（4）400 万已签约但未上线雇主成员的实施管线计划和预期上线日期； （5）按产品线和细分披露 NRR 与 GRR。
