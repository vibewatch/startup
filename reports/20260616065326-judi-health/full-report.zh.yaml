      - number: '4.3'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >
              Judi Health 在 2019 至 2025 年间完成七轮 SEC 文件记录的股权融资，累计募集 $607 million。最近一笔交易是 2025 年 9 月 23 日宣布的 $252 million
              Series F， 同时新投资者从早期支持者手中购买约 $150 million 二级股份，使这次总投资事件达到约 $400 million。本轮由 Wellington Management 和 General
              Catalyst 领投， Generation Investment Management、Goldman Sachs Alternatives 旗下 Growth Equity、 9Yards
              Capital、B Capital、Edison Partners、Prime Health Investments 和 Transformation Capital 参投。投后估值 $3.25
              billion，较上一轮 2024 年 3 月 Series D 确立的 $1.5 billion 估值翻倍以上；该轮由 Prime Therapeutics $115 million 战略投资锚定。SEC
              Form D 文件印证了披露金额：2025 年文件（accession 0001782959-25-000002）显示发行 $232.9 million，截至 9 月 26 日提交日已售出 $230.8
              million；2024 年文件（accession 0000950157-24-000482）显示发行 $312.5 million，初始售出 $115 million；2022 年文件（accession
              0001782959-22-000001）显示发行 $106 million 并全额售出。管理层表述和投资者确认均显示， 公司财务模型并不依赖 PBM
              监管改革来产生回报，因此更像一个商业模式，而非监管套利。General Catalyst 的 Holly Maloney 把长期机会称为「这里绝对可以建成一家 $20 billion
              的公司」，说明投资者认为相对于当前收入和估值仍有显著上行空间。$400 million 投资将用于扩展 PBM 运营、扩大 Judi® EHP
              平台部署、拓宽统一医疗理赔处理和招聘；公司未公开披露任何债务或项目融资义务。 手头现金、月度烧钱速度和现金续航期都是私有信息，公司未在任何公开可得文件中披露。
