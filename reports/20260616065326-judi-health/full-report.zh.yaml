            body: >-
              2025 年 9 月 $400 million Series F 时，Judi 医疗理赔平台约有 40,000 名成员，不到 PBM 基础的 1%。Prime Therapeutics 5,000
              万以上成员迁移、 以及统一医疗管理的更广扩张，尚未在规模化层面得到验证。另一个问题是，公开层面尚未确认 SOC 2 Type II 或 ISO 27001 认证，再叠加 2026 年仍在招聘 Cloud
              Security Director， 企业买家缺少与这种 PHI 暴露规模相匹配的独立安全保证。
