      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议——跟踪（中等信心）
            body: >
              Judi Health 是一个结构上差异化的 PBM-plus-EHP 平台，处在 $487 billion 的美国药品支出市场中，采用透明、固定费用模式，并受益于 PBM 监管改革。不过，$3.25
              billion 估值已经计入大量增长，而这些增长尚未在公开披露指标中可见。公司应进入 active tracking list，并安排与管理层直接会面；在买入决定前，需要确认 admin-fee 净收入、毛利率和
              live-member 爬坡。如果 admin-fee NR 确认为 $150M+，且到 2026 年有清晰路径达到 $250M+，则在 $3–5 billion
              基准情景下估值可辩护；相对多头情景下的平台期权，也具吸引力。
            calloutType: recommendation
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV042
          - type: callout
            title: 关键风险——总收入膨胀掩盖较小的 admin-fee 经济性
            body: >
              本章最重要的 underwriting 风险，是 Judi Health 公开可见的收入数字（2025 年预计 $3.7 billion）主要由公司不会留存的药品成本 pass-through 构成。真正的
              admin-fee 净收入估计为 $37–185 million，缩小了 20–50×。如果不能确认该数字，估值就缺少稳固锚点。可比 PBM（CVS
              Caremark、Evernorth、OptumRx）之所以交易在很低倍数，正是因为总收入放大了表观规模。如果 admin-fee NR 落在低端（$37–50M），当前 $3.25B 估值隐含不可持续的
              65–90× 收入倍数，需要 hyper-growth 才能支撑。
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV006
              - CV007
          - type: callout
            title: 估值锚——HealthEquity 可比意味着需要大量未来增长
            body: >
              HealthEquity（HQY）是最接近的上市可比对象——一个经常性、admin-fee、福利管理平台；截至 2025 年中，它以约 $7 billion 市值，对应约 5.3× 财年收入。把同一倍数套到
              Judi 已确认的 admin-fee 净收入总额（披露后），意味着当前 $3.25 billion 估值只有在 admin-fee NR 达到约 $613 million，或市场为 EHP
              平台的网络效应期权给出显著更高倍数时，才站得住。按 HealthEquity 可比倍数支撑 $3.25B 所需的 NR，比当前估计 admin-fee run-rate 高
              3–17×，因此这本质上是一个前瞻型、增长溢价估值。
            calloutType: insight
            claimRefs:
              - CV018
              - CV019
              - CV015
              - CV016
              - CV011
              - CV012
