  - id: TM004
    title: 增长驱动与采用约束
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 对 Judi Health 的含义
      - 尽调问题
    rows:
      - - 医疗成本通胀（2026 年中位趋势 9%）
        - 驱动 ↑
        - 当前且持续
        - 雇主更急于审计 PBM 成本；更愿意考虑透明替代方案
        - 核实 Judi Health 的客户赢单是否与续约周期相关，而不只是受长期趋势推动
      - - 专科药成本加速（GLP-1s 21–40%/年；专科药 = 净支出 52%）
        - 驱动 ↑
        - 当前且加速
        - 相信透明 PBM 能更高效管理专科药成本的雇主，是关键买方；锚定 NADAC 的定价，是专科药透明度的差异点
        - 确认 Capital Rx 如何为客户处理专科药返利和 GLP-1 成本管理
      - - CAA 2026 PBM 改革 — Medicare Part D 脱钩、商业返利穿透、报告（2028–2029 生效）
        - 驱动 ↑
        - 分阶段：当前先报告，Part D 2028 年 1 月脱钩，any-willing-pharmacy 2029 年，商业穿透约 2029 年 1 月
        - Capital Rx/Judi Health 的固定收费模式在结构上已经合规；现任 PBM 必须重组；改革让计划发起人更急于切换
        - 跟踪 CMS 和 DOL 围绕 BFSF 定义的规则制定；弄清 2028 阶段改革红利是否同等适用于雇主 PBM 与 Medicare PBM
      - - FTC 执法与 Big Three PBM 调查 / 和解
        - 驱动 ↑
        - 活跃：FTC/Express Scripts 2026 年 2 月和解；FTC 市场研究仍在推进
        - 监管诉讼验证了支撑 Capital Rx 品牌的改革叙事；FTC 发现可为雇主 RFP 论证提供第三方证据
        - 跟踪 FTC 结果，关注是否出现影响竞争格局的有约束力同意令；确认 Judi Health 不在 FTC 范围内
      - - 雇主对福利整合的需求（统一 PBM + 医疗 + 牙科 + 视力平台）
        - 驱动 ↑
        - 近期（2026–2028）
        - Judi Health 的统一平台是主要技术差异点；雇主明确希望减少点状方案碎片化
        - 核实实际整合深度（不只是 API 连接）能否同时跑通医疗理赔和药房；评估统一理赔实施周期
      - - 透明 PBM 采用率跃升（雇主采用率 2024–2025 年从 12% 到 31%）
        - 驱动 ↑
        - 当前，动能强
        - 行业层面顺风验证商业模式；Capital Rx 作为资本最充足的透明 PBM 受益
        - 核实采用数据的样本方法；确认 Judi Health 获取的份额是否达到或超过行业增长比例
      - - 现任 PBM 多年合同与退出条款
        - 约束 ↓
        - 结构性，滞后多年
        - 大多数雇主 PBM 合同为 3–5 年；切换窗口只在续约时打开；合同退出需要现任方配合
        - 按合同续约日期梳理 Judi Health 销售管线；了解竞争性 RFP 阶段的胜率
      - - 实施复杂度与成员扰动风险
        - 约束 ↓
        - 每个客户实施 6–18 个月
        - 已签约（5M）与上线（约 1M）的雇主 PBM 覆盖人数之间存在缺口，说明实施卡点；平台信任要靠实施记录逐步建立
        - 评估实施团队产能与已签约管线是否匹配；了解客户升级率和实施后的 NPS
      - - ERISA 信义义务与风险规避
        - 约束 ↓
        - 结构性，可由 CAA 2026 审计权部分缓解
        - 福利负责人必须向计划受托人解释 PBM 切换；理赔处理错误会变成职业风险；尽调周期更长
        - 了解 Judi Health 的错误率和 SLA 表现；获取已完成实施客户的背调
      - - Big Three 幕后经济账（返利聚合）
        - 约束 ↓
        - 结构性，CAA 2026 可能削弱
        - 即便雇主切换到独立 PBM，Big Three 仍可能通过 GPO 关系拿走返利聚合收入，限制计划发起人的节省
        - 确认 Capital Rx/Judi Health 是否使用任何 Big Three 返利聚合；了解客户完整返利栈
      - - RFP 周期长度（12–24 个月）
        - 约束 ↓
        - 结构性；CAA 2026 报告要求会改善
        - 长销售周期需要大量资本支撑；Judi Health 已融资 $607M，可提供跑道；2025 年宣布的 RFP 赢单，很可能来自 2023–2024 年启动的项目
        - 向 Judi Health 商业团队核实销售周期时长和平均合同价值；评估销售团队可扩展性
      - - 全栈平台资本强度
        - 约束 ↓
        - 结构性进入壁垒；对 Series F 后的 Judi Health 不是约束
        - Judi Health 累计融资 $607M，加上云原生架构，为新进入者竖起竞争壁垒；该约束适用于未来独立 PBM 竞争者
        - 评估烧钱速度与 Series F 资本跑道；确认技术投资路线图已有资金支持
    notes: >-
      驱动因素来源：Business Group on Health 2026、Milliman 2026 药品趋势、Navitus 2026、Pharmacy Times CAA 2026、FTC 2024 中期报告、Drug
      Channels 2026。约束来源：Drug Channels 2026、FTC 2024 中期报告、Sidley Austin CAA 2026 分析、AkingGump CAA 2026 分析、Judi Health
      2026 年 1 月新闻稿（已签约与已上线覆盖人数缺口）。
