      - number: '8.5'
        title: 建议、尽调问题与击穿论点触发器
        blocks:
          - type: paragraph
            body: >
              建议：跟踪（中等信心）。Judi Health 正在一个庞大且失灵的市场里，搭建结构上差异化的业务。2025 年 9 月 $3.25 billion
              的估值，已经计入显著增长和平台期权，但这些还没有在披露指标中显现。潜在投资人在做出买入决定前，必须解决若干重要 underwriting 问题：admin-fee 净收入、毛利率，以及 live-member
              爬坡经济。应优先安排公司直接沟通，获取审计后或管理层确认的 admin-fee 层面财务数据。

              风险评级：高。几个因素叠加，足以支持高风险评级：（1）总收入失真，遮蔽真实业务规模；（2）live-to-contracted 转化率只有
              20%，形成一条时间不确定的后置收入管线；（3）单一主导渠道伙伴（Prime Therapeutics，已签约 5400 万成员）构成重大集中风险；（4）多家可比 health-tech 公司在
              2024–2026 年经历严重估值重置。

              估值立场：相对已披露经济性，当前价格偏紧；如果 admin-fee NR 被确认达到 $150M+，且 live 爬坡路径按计划在 2026 年底达到 300 万+
              活跃成员，则估值合理。上一轮未出售的早期支持者形成的 secondary market overhang，可能压制近期价格上行。

              信心：中等。公司商业模式记录充分，监管顺风可信；但缺少净收入层面审计财务，是阻止高信心的硬不确定性。同行比较有意义，但没有直接上市可比公司，精度有限。
