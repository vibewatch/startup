      - number: '6.5'
        title: 集中风险、实施缺口与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              最重要的客户风险是通过 Prime Therapeutics 形成的集中。Judi 平台上的 5,400 万以上健康计划成员， 主要由 Prime 的客户账本构成——23 个 Blue Cross Blue
              Shield 计划及其附属方。 截至 2026 年中，Prime 既是少数股东，也是唯一获准在 Judi 平台上运行的第三方 PBM。 如果 Prime 终止或重新谈判联盟（无论原因是自身竞争压力、AHF
              反垄断诉讼、Express Scripts 在 Prime 一半药房网络中的作用扩大，还是 Prime 战略方向变化），Judi Health
              可能在一次事件中失去多数健康计划成员。实施积压放大了这一风险：当前上线的 500 万签约雇主 PBM 覆盖人数中只有约 100 万（截至 2026 年 1 月），相当一部分签约收入尚未转化为计费。
              企业福利实施通常需要 3 到 6 个月，并要协调 HR、薪资和药房网络，拖慢收入兑现， 也留下客户反悔的窗口。次要渠道风险是经纪依赖：Judi Health 通过独立经纪和顾问拿下相当比例的雇主客户，
              经纪整合或与既有 PBM 的排他交易可能压制新客户流入。FTC 2024 年 PBM 行业报告梳理了大型垂直整合 PBM 如何利用处方集位置和返利结构作为反竞争壁垒，这既验证了 Capital Rx 的结构顺风，
              也说明公司必须穿越一个对抗性市场环境。雇主账本内的客户集中度方面，没有任何单一雇主客户被公开点名， 公司也未披露前五或前十大客户收入贡献，因此若不做直接尽调，无法评估 Herfindahl 级别集中度。
            claimRefs:
