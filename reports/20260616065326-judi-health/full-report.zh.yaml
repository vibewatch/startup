      - number: '8.3'
        title: 可比公司组——上市公司与私有市场基准
        blocks:
          - type: paragraph
            body: >
              没有一家上市公司能完全镜像 Judi Health 的 PBM-plus-EHP 混合平台，但以下类别可以提供估值锚。传统 PBM 运营商（Cigna 旗下 Evernorth/Express
              Scripts、UnitedHealth Group 旗下 OptumRx、CVS Caremark）在合并口径下交易于 0.5–1.5× 总收入，反映药品成本总 pass-through
              上极薄的净利润率。Cigna Group 的 Evernorth 分部 FY2025 调整后收入增长 16%，相对 pharmacy-benefit
              同业继续产生较高运营收入，但市场仍给低公司倍数。UnitedHealth Group 的 Optum Rx 2025 年完成 1,659 million adjusted scripts（2024 年为
              1,623 million），Optum 总收入增长 7%。

              福利技术和管理平台的交易倍数明显更高。HealthEquity（HSA/FSA 托管方和福利管理员）在 70% 毛利率、托管 HSA 资产 $36.5 billion 的基础上，估值约 5.3× 收入。Omada
              Health（数字慢病管理）于 2025 年 6 月以每股 $19.00 IPO，FY2025 收入约 $261 million（+53% YoY），年中 public float 约 $1.05
              billion，意味着一家具备类似雇主渠道分销的高增长数字健康公司，对应约 4× 收入倍数。Evolent Health（specialty care
              management，EVH）提供了警示样本：由于客户合同重组，FY2025 收入下降 26.6% 至 $1.876 billion，公司计提 $398 million 非现金 goodwill
              impairment；这说明增长放缓或客户组合恶化时，health-tech 倍数会多快被压缩。

              在私有市场口径下，Judi Health 自身历轮融资显示估值速度在加快：$175 million（2022 年 6 月 Series C）、$1.5 billion（2024 年 3 月与 Prime
              Therapeutics 的 Series D）和 $3.25 billion（2025 年 9 月 Series F）。Rock Health 的 2025 年数字健康市场数据显示，当年数字健康 venture
              funding 总额为 $14.2 billion，其中 mega-deals（$100M+）在部署资本中占比上升。
