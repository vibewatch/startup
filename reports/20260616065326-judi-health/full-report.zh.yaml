      - number: '1.3'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              AJ Loiacono 担任联合创始人兼 CEO，也是公司最主要的公开发声人、投资者关系锚点和媒体代表。截至 2025 年 9 月，他 53 岁，在 Truveris 八年任职积累了深厚 PBM 行业经验；自
              Capital Rx 创立以来，他一直是 NADAC 锚定、固定费用模型的具名设计者。联合创始人兼 CTO Ryan Kelly 从零搭建 Judi 平台，并负责全部技术战略。现任高管团队包括 Bryan
              Birch（COO）、Antonio Garcia Cueto（CFO）、Kristin Begley, PharmD（CCO）、Sunil Budhrani, MD, MPH, MBA（Chief
              Innovation and Medical Officer）、Lloyd Fiorini（General Counsel and Chief Compliance Officer）和 Sara Izadi,
              PharmD（Chief Clinical Officer），显示公司已具备较成熟的临床、运营和合规能力。

              对 AJ Loiacono 的关键人依赖构成实质性治理风险：他设计了公司的改革叙事，主导投资者与媒体沟通，也承载创始愿景。2025 年 9 月 Forbes 资料披露，原始联合创始人 Joseph
              Alexander 离开公司，进一步凸显机构知识集中在剩余两位联合创始人手中。作为私营公司，Judi Health 未完整披露董事会治理细节；现有证据显示，B Capital 合伙人 Robert
              Mittendorff 在 2022 年 6 月 Series C 后加入董事会，General Catalyst 的 Holly Maloney
              担任董事会观察员。完整董事会构成、投资者投票权、保护性条款和治理结构仍无法从公开来源获得。
