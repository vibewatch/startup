    Platform（EHP，云原生统一理赔引擎），服务自保雇主、健康计划和第三方管理机构。到 2026 年 1 月，公司已超过 500 万名已签约雇主 PBM 覆盖成员，并通过 Prime Therapeutics 联盟覆盖 5400
    万名健康计划成员；2025 年估计总收入约 $3.7 billion，同比增幅超过 75%。2025 年 6 月收购 Amino Health 后，公司补上护理导航能力，并将其更名为 Judi Care。
