            title: 管理费 SAM 被受管理支出的标题数字遮住
            body: >-
              常见引用的 $647B–$755B 全球 PBM 市场包含药品成本穿透，而不只是服务费。Judi Health 的经济模型建立在固定管理费上，因此这些标题数字很难代表其真实 TAM。投资者应从估计 PMPM 费率
              × 可触达覆盖成员建模，并在尽调中要求公司披露实际 PMPM 区间。
