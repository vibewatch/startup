companyProfile:
  summary: >-
    Judi Health（公司母体：Capital Rx, Inc.）是一家位于纽约的企业健康科技公司和透明药房福利管理商，由 AJ Loiacono 与 Ryan Kelly 于 2017 年创立。2025 年 9 月，公司从
    Capital Rx 更名为 Judi Health，同时完成一笔 $400 million 融资事件（$252M Series F 股权融资加约 $150M 二级交易），投后估值 $3.25 billion，累计融资 $607
