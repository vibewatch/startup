        - 商品化：SmithRx、Navitus、Rightway 都提供透明直通模式；这项主张已不再独特
        - 中
        - 在 2026 年 RFP 中核验其相对透明模式挑战者的溢价定价；评估单靠 NADAC 锚点能否守住续约
      - - 云原生 Judi EHP 作为技术护城河
        - Prime Therapeutics 获得 JUDI 授权可能削弱独占性；三大 PBM 也在投入技术现代化
        - 中
        - 获取 JUDI 授权排他条款；评估平台研发路线图和专有 IP 范围
      - - Prime Therapeutics 战略技术联盟
        - AHF 反垄断仲裁（2025 年裁定）可能重塑 Prime 对 Express Scripts 的依赖和 JUDI 部署时间表
        - 高
        - 跟踪反垄断案件结果；确认 2025 年反垄断裁定后 JUDI 的部署状态
      - - 5M+ 已签约雇主 PBM 会员，且大雇主集中度高
        - 三大 PBM 会用合同改良和量价折扣留住客户；实施切换成本也会形成阻力
        - 中
        - 审计前 20 大客户收入集中度；评估 2026–2027 年合同期限和续约管线
      - - PBC 公司结构作为治理一致性信号
