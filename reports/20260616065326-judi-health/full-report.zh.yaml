      - number: '6.2'
        title: 具名客户证明与案例证据
        blocks:
          - type: paragraph
            body: >-
              具名证据有限，但可信。Rice University 是公开文件中最详尽的案例：人力运营执行董事 Elaine Britt 在学校 2024 财年开始时（2024 年 7 月）把大学从 Express
              Scripts 切换到 Capital Rx。9 个月内，即使新增 GLP-1 药物带来数十万美元增量成本，药房成本仍同比下降约 5%。Britt 提到 Capital Rx 的固定费 NADAC
              定价、当天修复问题的能力（而 Express Scripts 需要 3 到 4 周），以及通过 Judi 平台实时查看理赔。该案例最初由 Employee Benefits News 于 2025 年 4 月
              29 日报道，后转载在 judi.health。Charlotte Hornets（NBA）于 2025 年 9 月宣布与 Judi Health 达成多年、多元素球衣贴片合作。
              虽然这主要是品牌和营销交易，而非健康福利部署，但它确认 Judi Health 的全国知名度在提升， 也验证公司愿意把资本投入到突出、长期的客户关系中。2026 年 1 月 500
              万签约覆盖人数新闻稿点名了客户类型—— 13 家新 Fortune 500 公司、21 家新医院集团 / 健康系统、若干州雇员计划、市政机构和大学—— 但没有披露公司名称。Forbes 2025 年 9
              月指出，Loiacono 当时以保密为由拒绝透露具体 Fortune 500 客户。Prime Therapeutics 联盟（2024 年 2 月宣布）是覆盖量最大的渠道证明： Prime 通过 23 个
              Blue Cross Blue Shield 计划服务 5,000 多万美国人，并承诺使用 Judi 作为其裁决平台，因此 Prime 本身就是最重要的具名客户 / 合作伙伴。2023
              年战略投资轮中的健康系统投资者包括 Atlantic Health System、Banner Health、Hawai'i Pacific Health、Inova Health System、 Lehigh
              Valley Health Network、Memorial Hermann Health System、Nebraska Medicine、 Novant Health、Ochsner Health 和
              WellSpan Health——这验证了领先健康系统足够信任公司并投资， 且很可能也是客户或潜在客户。
