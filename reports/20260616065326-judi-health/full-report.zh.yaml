      - number: '3.2'
        title: 透明且技术赋能的挑战者
        blocks:
          - type: paragraph
            body: >-
              一组采用透明模型的独立 PBM，构成 Judi Health 的 Capital Rx 业务最主要的直接挑战者层级。Navitus Health Solutions 提供完全穿透模型，客户支付的正是
              Navitus 向药房支付的价格，并获得 100% 谈判折扣；其支撑来自自研理赔裁定系统和全资 cost-plus 专科药房子公司 Lumicera Health Services。SmithRx
              主打技术优先、彻底透明的平台，声称客户相较传统 PBM 可节省 20% 或更多总药品成本；其面向雇主的材料强调现代云原生基础设施，可降低计划设计和数据访问摩擦。EmpiRx Health
              以临床驱动模型区分自己，让持牌药师处于服务交付中心，并由名为 Clinically™ 的 AI 人群健康分析平台支撑，目标是为计划赞助方产生有保证的临床节省。Rightway Healthcare 将 100%
              穿透 PBM（单一透明费用；无价差、无截留返利）与一体化临床护理导航结合，报告会员 Net Promoter Score 为 70（称为行业平均的 8.5×）并为客户节省 15% 医疗成本。四家挑战者都与
              Judi Health 共享透明定价定位，但没有一家提供可与 Judi Health 的 Judi EHP 平台相比的一体化医疗福利管理能力。关键竞争进展是 Prime Therapeutics 在 2024
              年决定向当时仍名为 Capital Rx 的 Judi Health 投资 $115 million，并以 JUDI 平台完全替换其既有 RxClaim 裁定架构——这是一项独立第三方验证，说明 JUDI
              技术相对市场替代方案具有有意义优势。不过到 2025 年，Prime 约一半处方理赔仍继续流经 Express Scripts 网络，因此即便与 Judi Health 的裁定关系扩张，间接 Big Three
              依赖仍然存在。
