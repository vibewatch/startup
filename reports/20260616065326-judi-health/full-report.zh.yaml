      - number: '7.5'
        title: 缓释因素、出局标准与证据缺口
        blocks:
          - type: paragraph
            body: >
              Judi Health 对监管风险最主要的结构性缓释，是其透明、固定费用、基于 NADAC 的模式：FTC 改革议程明确瞄准的是定义传统 PBM 的 spread-pricing 和不透明 rebate
              做法，而不是 Judi 的模式。Prime Therapeutics 联盟虽有集中风险，也代表双方存在战略互依（Prime 获得平台技术；Judi 获得健康计划成员规模）。$400M Series F
              之后的资本位置，为公司熬过多个季度的监管扰动提供了 runway。足以击穿投资论点、应触发退出或大幅折价的事件包括：（1）FTC 执法行动明确点名 Capital Rx/Judi Health，或对 Prime
              联盟施加条件；（2）确认发生影响 10,000+ 会员的重大 HIPAA 数据泄露；（3）Prime Therapeutics 在 24 个月内合约退出；（4）到 2026 年底雇主 live 成员数未能从
              100 万推进至 300 万；或（5）出现净收入为负的证据（利润率压缩至 breakeven 以下）。证据缺口包括未披露的盈利指标、Prime 联盟的财务条款，以及缺少独立审计的安全认证。
