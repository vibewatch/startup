      - number: '6.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 连续两年新增 80+ 合作，说明需求有耐久性
            body: >-
              公司在 2024 年和 2025 年都签下 80 多个新合作，仅 2025 年就包括 13 家 Fortune 500 公司和 21 家医院集团。如果这种签约速度延续， 意味着公司会继续从 Big Three
              PBM 手中拿份额，也验证透明定价模型在企业层面有共鸣。 细分覆盖范围很宽——横跨 Fortune 500 雇主、工会、健康系统、学术机构和公共部门实体——
              降低了任何单一垂直枯竭的风险，也让公司能同时受益于多个需求催化因素。
