      - number: '1.2'
        title: 创立故事与公司演进
        blocks:
          - type: paragraph
            body: >-
              Capital Rx 于 2017 年底在纽约市由 AJ Loiacono（CEO）、Ryan Kelly（CTO）和 Joseph Alexander（COO）共同创立。Loiacono
              是连续创业者，曾共同创立药房福利咨询公司 Truveris，并担任 CEO 八年；他从金融清算所模型——尤其是 New York Stock
              Exchange——获得灵感，想搭建一个系统，让所有药房客户基于公开可得的成本数据拿到同一价格，而不是依赖逐一谈判且不透明的合同。随着雇主采用透明模型，公司从 PBM
              运营稳步扩展为更广泛的企业健康科技平台，报告的总收入从 2021 年约 $429 million 增至 2022 年 $814 million。

              2025 年，两项标志性动作让公司演进提速。2025 年 6 月，Capital Rx 收购 Amino Health，将其 AI 驱动平台整合为 Judi
              Care，把能力延伸到护理导航、医生搜索、预约和成本估算，覆盖近 6000 万名成员。随后在 2025 年 9 月，公司配合 $400 million 投资轮，正式从 Capital Rx 更名为 Judi
              Health，释放出从药房聚焦 PBM 扩展为全谱系健康福利管理平台的信号。公司母体仍为 Capital Rx, Inc.（public benefit corporation）；根据公司隐私政策，Judi
              Health, LLC 和 Amino, LLC 作为子公司运营。Forbes 资料显示，第三位原始联合创始人、前 COO Joseph Alexander 截至 2025 年 9 月已不在公司任职。
