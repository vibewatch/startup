    summary: >
      柱状图展示 Judi Health 在三种管理费 NR 情景（低位 $37M、中位 $111M、高位 $185M）和三档收入倍数（10×、20×、30×）下的隐含企业价值。当前 $3.25B 估值需要中高位 NR，并且拿到
      20–30× 的溢价。
