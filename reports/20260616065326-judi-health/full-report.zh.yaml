      - number: '6.4'
        title: 留存、耐久性与扩张
        blocks:
          - type: paragraph
            body: >-
              Capital Rx 自报客户留存率 99.5%、实施满意度 100%。没有独立审计、第三方 NPS 研究或监管验证数字支撑这些说法，样本也带有自我选择（留下的雇主与流失的雇主未区分）。 Rice
              University 案例说明黏性逻辑为何可信：实施后，实时理赔可见性和当日问题解决， 让客户切回遗留 PBM 的成本变高。固定费 NADAC 模型也避免重新签约摩擦——Capital Rx
              不从更高药品支出中获利，因此续约对话主要由成本结果驱动，而不是定价谈判。Never Move Again 产品（非捆绑 PBM）明确设计用来降低实施摩擦并锁定定价连续性，
              解决切换中的最大单一障碍。扩张方面，公司路径是从单一药房 PBM 走向全谱系福利管理。 Judi Health Unified Claims Processing 平台把药房和医疗理赔整合在同一个引擎上，
              是扩张载体；Forbes 记录了 Loiacono 的观察：「一旦你同时看到医疗和药房理赔进入， 就再也不想回去了。」Capital
              Equilibrium（定额自筹药房福利）把市场扩展到预算敏感的市政机构和小型雇主， 这些客户过去无法使用透明 PBM 模型，也形成一条 CAC 更低的追加销售管线。公司自身部署 Judi
              后，内部每成员每月成本节省 11%，理赔处理时间从超过 6 个月降至最多 18 天， 为扩张价值主张提供了具体内部基准。公司未公开披露净收入留存（NRR）或总收入留存（GRR）数据。
              按年份划分的同期群留存不可得。
            claimRefs:
