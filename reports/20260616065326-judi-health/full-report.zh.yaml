      - number: '4.4'
        title: 单位经济与毛利分析
        blocks:
          - type: paragraph
            body: >
              Judi Health 没有披露管理费净收入、毛利率、每成员成本或每笔理赔运营成本数据，
              单位经济分析只能依赖结构推断和公开可比基准。公司的穿透式收入会计模型——药品成本同时作为收入和销货成本流经公司账簿——意味着总收入数字（2024 年 $2.1 billion、2025 年预计 $3.7
              billion）不能与纯技术 SaaS 企业收入直接比较。 实际管理费贡献估计为总收入的 1–5%，意味着 2025 年管理费收入区间约为 $21 million 至 $185
              million——但区间很宽，且未经验证。CVS Health 在 2026 年 2 月向 SEC 提交的 2025 Form 10-K 中披露，Caremark 业务以约 8,700 万计划成员的规模处理 19
              亿张处方，为大型 PBM 运营效率提供基准。Big Three PBM 主要靠返利留存和价差定价获利—— Capital Rx 模型两者都没有。因此，如果跑出运营杠杆，Capital Rx
              模型应产生更低的每成员总收入， 但管理费部分的净利率可能更高。内部健康计划数据（节省成本 11%、理赔周期 18 天）说明运营效率提升确实存在，
              但商业规模下的利润率证据完全缺失。关键尽调阻碍在于，投资者和承销方无法凭公开来源独立评估毛利率、 销售效率（CAC）或回本周期。上线成员（100 万）与签约覆盖人数（500 万）的比例形成自然收入爬坡路径，
              但也带来时间风险：如果签约客户推迟上线日期或缩小范围，预期收入上行可能被大幅延后。
