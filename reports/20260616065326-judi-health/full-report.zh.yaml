    rows:
      - - P1 — 阻断
        - 经审计的管理费净收入和毛利率（FY2024、FY2025）
        - 整个估值框架都压在管理费 NR 上；没有净额数字，总收入（$3.7B）会误导判断
        - 公开渠道未披露；需要直接接触公司
      - - P1 — 阻断
        - 已签约但延期的 4M 雇主覆盖人次，其已上线会员爬坡轨迹和上线节奏
        - 5M 签约覆盖人次里只有 1M 已上线（2026 年 1 月），收入管线被推迟；爬坡速度决定 NTM 收入
        - 公开渠道未披露；需要运营数据
      - - P1 — 阻断
        - 按客户层级和产品线拆分的 PMPM 管理费率（药房 vs. 统一医疗 + 药房）
        - 单位经济学仍是黑箱；不同 PMPM 费率会验证或挑战管理费 NR 区间
        - 未公开披露
      - - P2 — 重大
        - Prime Therapeutics 联盟合同条款：排他性、期限、续约、终止权
        - Prime 代表约 54M 签约健康计划覆盖人次；若流失或重新谈判，牛市情景会明显受损
        - 合同条款未公开披露；需通过直接访问确认
      - - P2 — 重大
        - 截至 2026 年 Q1 的现金余额和月度烧钱速度
        - 看不见烧钱速度，就无法判断资金续航；Series F 的 $252M 募资已部分用于 Amino 收购和平台资本开支
        - 未披露；SEC Form D 记录发行金额，但不披露资金用途
      - - P2 — 重大
        - 雇主 PBM 客户流失率与 NRR（净收入留存率）
        - 管理费收入稳定性取决于计划发起方留存；若要对标 GIC 等 SaaS 可比公司，NRR 需要超过 100%
        - 公开渠道未披露；PBM 行业常见多年合同锁定，但仍需要流失数据
      - - P3 — 建议
        - 2025 年 Fortune 500 新签客户中可具名的参考客户（已披露 13 家）
        - 验证商业动能叙事；交易对手信用质量影响收入耐久性
        - 公司公开拒绝披露客户名称
