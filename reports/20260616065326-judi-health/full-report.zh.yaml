      - number: '2.2'
        title: 规模测算视角：彼此矛盾的分析师 TAM、有意义的透明 PBM SAM，以及受证据约束的 SOM
        blocks:
          - type: paragraph
            body: >-
              全球 PBM 行业公开市场规模应谨慎解读，因为不同分析师对市场边界的定义不同，导致标题数字跨度很大，表面上也不可比。

              Mordor Intelligence 估计，全球药房福利管理市场 2025 年为 $657.51 billion，2026 年按 5.32% CAGR 增至 $692.47 billion，到 2031 年达到
              $897.16 billion。Mordor 将 2025 年市场的 45.88% 归于北美，意味着北美 PBM 市场约为 $301.7 billion。Fortune Business Insights
              另行估计，全球市场 2025 年为 $609.13 billion，2026 年为 $646.61 billion，并以 5.5% CAGR 增至 2034 年 $991.88 billion。Fortune
              报告称美国单独占其全球市场 96.96%，意味着美国规模约 $626.8 billion——几乎是 Mordor 北美估计 $301.7 billion 的两倍。The Business Research
              Company 将 2026 年全球市场定为 $755.09 billion，CAGR 为 8.5%。Precedence Research 估计 2026 年为 $575.7 billion，到 2035
              年增至 $948.2 billion。2026 年估计值之间 $179-billion
              的跨度（$576B–$755B）是实质性尽调缺口：各口径纳入的支出定义差异很大，且没有任何数字把服务费收入（管理费）与药品成本穿透拆开。

              更实用的测算从 DOL 的 2026 Self-Insured Report 出发：50,700 个自保计划加 4,800 个混合保险计划，在 ERISA 申报计划中合计覆盖约 7200
              万名参与者。该参与人群乘以估计 $25–$60 PMPM（每成员每月）的透明 PBM 管理费——这一区间与行业评论一致，但 Judi Health 未公开确认——得到指示性透明 PBM 管理费 TAM，每年为
              $22–$52 billion。不过，这个数字只是估计：Judi Health 未公开披露 PMPM 费率，分析师群体也未发布经过验证的、干净的“透明 PBM 管理费池”数字。

              在健康福利平台层，Mordor 口径下 $2.01 billion（2026 年）的福利管理软件市场，是平台授权收入潜力的最佳可得代理。该市场 CAGR 为 10.23%，快于底层 PBM
              市场，反映数字化转型顺风。

              透明和独立 PBM 的采用率正在快速上升：Navitus 引用 Healthcare Finance News 报道称，雇主使用透明或替代 PBM 的比例在 2024 至 2025 年间从 12% 升至
              31%，对 Big Three 的依赖则从 72% 降至 61%。透明 PBM 用户的计划赞助方满意度达到 79%，高于传统模型，也支撑透明模型正在拉动雇主的判断。Mordor 另指出，按收入计，雇主赞助计划在
              2025 年控制 PBM 市场 45.25% 份额；按服务类别计，专科药房服务以 33.42% 的总收入占比领先，而理赔处理与裁定预计到 2031 年 CAGR 为 7.12%——这些正是 Judi EHP
              瞄准的功能。

              Judi Health 的 SOM 无法从公开信息中单独拆出。截至 2026 年 1 月，公司有 500 万名已签约雇主 PBM 覆盖成员，以及 5400 万名运行在 Judi 裁定平台上的健康计划成员（多数来自
              Prime Therapeutics 联盟）。其当前收入足迹只占自保雇主总市场的一小部分，但增长很快。公司未公开披露管理费 PMPM 或净服务收入，因此无法用公开证据构建精确 SOM。
