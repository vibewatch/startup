  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Judi Health 处于美国医疗体系监管最重的细分市场。FTC 2024 年临时员工报告基于对六大 PBM 的 Section 6(b) 调查发布，发现这些 PBM 合计处理接近 95% 的美国处方，
              并存在自我优待、反竞争返利，以及「人为抬高胰岛素价格」等做法。Judi Health 是透明、固定费 PBM，并非这项调查目标；但 FTC 报告明确点名 Prime Therapeutics—— Judi
              最大增长伙伴——为六家覆盖实体之一，因此给联盟带来监管悬而未决。2026 年联邦拨款法案引入新的 PBM 改革条款，涵盖价差定价禁令、返利穿透要求和更强透明度报告；这些都利好 Judi
              既有模型，但仍带来合规义务。州层面，根据 NAIC，2017 至 2023 年间全美 50 个州都至少通过一项 PBM 法律；若干州对 PBM 施加受托义务。ERISA 优先适用 让州 PBM
              强制要求的法律不确定性持续存在，尽管最高法院已经支持部分州药房报销法规。 本次审阅未发现涉及 Capital Rx / Judi Health 的公开诉讼。HIPAA 和 ERISA 受托义务适用于 Judi
              作为业务伙伴和计划管理员的角色，要求公司具备严格数据治理和审慎计划管理标准。
