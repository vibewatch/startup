      - number: '2.3'
        title: 买方、用户与付款方地图：大型雇主和健康计划需要利益一致的伙伴，穿透碎片化福利堆栈
        blocks:
          - type: paragraph
            body: >-
              Judi Health 的买方宇宙覆盖几类不同的经济买方画像，各自预算归属、采购周期和采用触发点都不同。

              大型自保雇主（大体指 500 名以上员工，最常见为 1,000 名以上）是 Capital Rx 透明 PBM 服务的主要目标。经济买方通常是福利 VP 或首席人力资源官，并与 CFO 协作；CFO
              负责整体健康福利成本。用户是使用药房福利的员工或受保家属。付款方是雇主，它在自筹资金结构下承担精算风险，通常还配有止损再保险。采用触发点往往是计划续约、对现任 PBM
              成本透明度不满，或由成本趋势上升引发的福利战略复盘——Business Group on Health 报告称，2025 年 79% 的大型雇主经历 GLP-1 使用量增长，雇主预计 2025 至 2026
              年药房成本将增加 11–12%。Fortune 500 公司是 Judi Health 最高能见度的买方细分；2025 年，公司签下 13 个新的 Fortune 500 合作关系。

              超大型雇主（10,000 名以上员工，尤其是 Fortune 500）最成熟、价值最高。超过 90% 的超大型雇主使用自筹资金健康计划。这些组织拥有专门福利团队、扎实 RFP 流程、ERISA
              信托责任监督，并与大型现任 PBM 和 TPA 签有多年合同。12–24 个月采购周期很常见。采用触发点通常是成本上升推动的战略复盘、立法变化（CAA 2026
              透明度要求创造天然审计节点），或围绕福利公平性的竞争压力。

              工会健康计划（Taft-Hartley
              trusts）是面向建筑、酒店、娱乐和其他工会密集行业工人的多雇主福利基金。它们是大型自筹资金实体，拥有复杂资格规则（工时账户、缴费率）、集体谈判承诺，以及对工会受托人的成本管理义务。公司 2026 年 1
              月新闻稿显示，若干工会计划已在 Judi Health 客户群中，但未点名具体客户。

              公共部门雇主——州政府、市政、县、大学和 K-12 学区——运营自保计划，接受公共预算审查、集体谈判和监管报告约束。Judi Health 已宣布的 2025
              年合作关系中包括若干州雇员计划。这里的采用触发点往往带有政治或立法属性：PBM 改革立法和要求成本透明的行政命令会制造采购紧迫感。

              医院系统和健康系统（整合型交付网络）既是雇主（为自身员工健康福利自保），也是潜在技术客户（使用 Judi 裁定平台）。Judi Health 在 2025 年签下 21
              个医院集团和健康系统合作。这些组织与医疗改革使命相契合，且在临床数据上更成熟，因此更容易接受 NADAC 锚定、数据透明模型。

              健康计划和 Blue Cross Blue Shield 计划是 Judi EHP 裁定平台的最大买家。Prime Therapeutics 是锚定客户；这家 PBM 由 19 个 Blue Cross Blue
              Shield 计划持有，合计覆盖 5000 万以上成员，已签约把 Judi 作为独家裁定平台运行，并在 2025 年迁移两个健康计划。健康计划中的经济买方是 CIO 和运营
              VP；采用触发点是从遗留系统进行技术现代化、提升成本效率，以及对药房和医疗理赔统一处理的需求。

              第三方管理机构（TPA）既是分销渠道也是买方：它们可以嵌入 Judi 平台，服务自己管理的雇主，从而不靠直接雇主销售也能放大 Judi Health 的触达。TPA 市场服务许多 50,700
              个以上自保雇主计划。
