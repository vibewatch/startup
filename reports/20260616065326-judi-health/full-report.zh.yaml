  - id: TM003
    title: 细分与买方地图 — 谁购买、谁使用、谁付费、什么触发采用
    columns:
      - 细分
      - 经济买方
      - 最终用户
      - 付款方 / 风险承担方
      - 工作流 / 用例
      - 预算所有者
      - 采用触发因素
    rows:
      - - Fortune 500 / 超大型自保险雇主（10,000+ 名员工）
        - 福利副总裁 / CHRO，需 CFO 签批；设有专门福利委员会
        - 员工及受保家属
        - 自保险雇主（配止损再保险）
        - 全福利 PBM 管理、处方集设计、专科药管理、分析
        - CFO / 福利副总裁；超大型雇主年度健康福利预算通常为 $500M+
        - 成本飙升危机、监管变化（CAA 2026 审计权）、对现任 PBM 透明度不满、战略性 HR 复盘
      - - 大型自保险雇主（500–10,000 名员工）
        - HR 总监 / 福利副总裁；通常由福利经纪或顾问提供建议
        - 员工及受保家属
        - 自保险雇主
        - PBM 管理、网络管理、使用审核
        - 福利副总裁 / HR 总监；年度健康支出通常为 $10M–$500M
        - 年度续约、经纪推荐、专科药成本事件、同业雇主转介绍
      - - 工会健康计划（Taft-Hartley 信托）
        - 受托人委员会（工会—管理方联合委员会）
        - 工会成员及家属
        - 多雇主信托基金
        - PBM 管理，处理复杂的多雇主资格与工时银行跟踪
        - 受托人委员会，对工会成员负有信义义务
        - 信托基金偿付能力承压、集体谈判协议续约、福利审计
      - - 州及公共部门雇主
        - 采购 / 福利办公室；通常需要立法或 RFP 批准
        - 州雇员及受保家属
        - 州 / 市自保险计划
        - PBM 管理、透明度报告、兼容 FOIA 的数据披露
        - 州预算机构；通常需要立法层面的透明度
        - PBM 改革立法、州级透明度行政令、现任 PBM 审计结果不佳
      - - 医院系统 / 健康系统（员工自保险）
        - 福利副总裁 / CFO；常由理解 PBM 市场的临床领导参与
        - 医院员工及家属
        - 健康系统自保险计划
        - PBM 管理，并可能把 Judi EHP 用作裁定基础设施
        - 福利副总裁 / CFO
        - 使命一致（健康系统主张福利激励对齐）、对现任 PBM 不满、技术现代化
      - - 健康计划 / BCBS 计划
        - CIO / 运营副总裁 / 首席精算师
        - 健康计划成员（保单持有人）
        - 健康计划（保险公司或管理式医疗组织）
        - 面向药房和 / 或医疗理赔的裁定平台（Judi EHP）；分析基础设施
        - CIO/CTO / 运营预算
        - 遗留系统现代化、成本效率、药房—医疗理赔统一、Prime Therapeutics 战略联盟模板
