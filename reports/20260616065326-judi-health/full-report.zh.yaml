  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与平台架构
        blocks:
          - type: paragraph
            body: >-
              Judi Health 运营三个主要面向客户的技术品牌，底层都由 Judi Enterprise Health Platform（EHP）驱动。Capital Rx 提供透明、全服务的药房福利管理，定价锚定
              NADAC，并收取固定管理费。Judi Health 平台是公司的全服务健康福利管理产品， 把药房、医疗、牙科和视力理赔管理整合在一个系统中——公司称其为行业首个 Unified Claims
              Processing™ 平台。Judi（adjudication 的简称）是支撑上述产品的底层云原生 EHP，也授权给 Prime Therapeutics 等外部健康计划使用。

              除这三个品牌外，产品套件还包括 Never Move Again（带持续定价的非捆绑 PBM）、 Capital Equilibrium（面向较小雇主的定额自筹 PBM）、Capital Rx Advantage
              （2021 年推出的免费 NADAC 处方折扣卡）以及 MPPP（Medicare Prescription Payment Plan）。 Judi Care 是 2025 年 6 月从 Amino Health
              收购的 AI 驱动护理导航模块， 通过 Benefits Hub、横跨 200 个专科的服务方搜索、实时预约、成本估算和处方药路由， 为计划成员补全产品组合。

              架构明确是云原生，公司称其为单一、可扩展的 SaaS 方案，目标是替换已有 30 年历史的 PBM 遗留技术。联合创始人兼 CTO Ryan Kelly 从零设计该平台，用来处理 Fortune 500
              公司、工会、健康系统、Medicare、Medicaid 和学术机构中数百万计划成员的管理流程。 截至 2025 年 9 月，Judi 平台上已签约超过 5,400 万健康计划成员。
