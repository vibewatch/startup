              Prime Therapeutics 在 2024 年决定向 Capital Rx 投资 $115 million，并用 JUDI 平台替换其整套 RxClaim 裁决系统，这是 Judi Health
              技术论点迄今最具商业意义的第三方验证。 一家 BCBS 持有的 PBM、处方支出达 $55.3 billion，却把核心基础设施托付给 JUDI，等于为平台的企业级可扩展性背书，也指向一种健康计划渠道机会：
