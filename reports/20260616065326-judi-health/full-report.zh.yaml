  - id: FV004
    title: 尽调风险与投资影响矩阵
    type: matrix
    layout: standard
    summary: |
      风险—影响矩阵按出现不利结果的概率（横轴）和一旦不利时的潜在投资影响（纵轴）映射关键未决尽调问题。P1 阻断项集中在高影响、中高概率象限。
    data:
      columns:
        - 低影响
        - 中影响
        - 高影响
      rows:
        - label: 不利概率高
          values:
            - 拿不到具名客户披露
            - Capex / R&D 支出未披露
            - 管理费 NR 无法从公开来源确认
        - label: 不利概率中
          values:
            - 营销支出（如 NBA 球衣协议）偏高
            - Prime 联盟合同条款限制较多或期限较短
            - 上线爬坡慢于 2026 年 1 月数据所暗示的速度
        - label: 不利概率低
          values:
            - 领导层变动（AJ Loiacono 离任）
            - 2027 年前现金消耗超过 Series F 融资额
            - PBM 监管改革未能通过，削弱顺风
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
