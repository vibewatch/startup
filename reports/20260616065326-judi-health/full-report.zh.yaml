      - number: '2.5'
        title: 尽调缺口：管理费 SAM、透明 PBM 渗透率方法论，以及彼此矛盾的分析师市场估计
        blocks:
          - type: paragraph
            body: >-
              若干证据缺口实质性限制了本市场分析的精度，投资者尽调时应明确标记。

              管理费 SAM 无法从公开信息中单独拆出。没有主流市场研究机构发布专门的“透明 PBM 管理费收入”或“独立 PBM 服务合同市场”数字。所有 PBM 标题市场规模（2026 年
              $647B–$755B）都把巨大的药品成本穿透与真实服务费收入打包在一起，不能直接作为 Judi Health 经济模型的 TAM。公司的固定费用、NADAC
              锚定定价模型只从服务费产生收入——可得服务费池规模只能靠自下而上建模推断（覆盖成员 × 估计 PMPM），而该模型依赖 Judi Health 尚未公开披露的 PMPM 费率。

              透明 PBM 采用数据来自单一且有利益相关的发布方。12% 到 31% 的雇主透明 PBM 采用率数字由 Navitus（竞争性透明 PBM）引用，源自 2025 年 9 月 Healthcare Finance
              News 文章。趋势方向可信，并与更广泛的监管和成本环境一致，但公开来源没有描述样本框、调查方法和该研究使用的“透明 PBM”定义。来自中立第三方的独立确认，是一项尽调要求。

              分析师市场规模估计彼此矛盾——Mordor（$692B）、Fortune（$647B）、TBRC（$755B）和 Precedence（$576B）——如果没有各家公司方法论，无法调和。Mordor
              的北美份额（全球 45.88%）与 Fortune 的美国份额（全球 96.96%）之间差异尤其刺眼，提示两家公司使用的市场定义并不兼容。投资者应把这些数字视作数量级背景，而不是精确竞争情报。

              Judi Health 的 SOM 和上线成员轨迹并不公开。公司报告，截至 2026 年 1 月 1 日有 500 万名已签约雇主 PBM 覆盖成员、约 100 万名已上线成员，以及 5400
              万名已签约健康计划成员（主要来自 Prime
              Therapeutics）。每名已签约成员和每名已上线成员产生的收入、已签约成员转为上线状态的时间表，以及净新增签约成员的有机增长率均未公开披露，都是需要投资者级别访问权限确认的关键估值变量。
            claimRefs:
              - CM052
              - CM053
              - CM054
              - CM055
      - number: '2.6'
        title: 图表
        blocks:
