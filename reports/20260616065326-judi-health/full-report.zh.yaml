    approximationNotes: >
      管理费净收入估算（$3.7B 总收入的 1%、3% 和 5%）尚未得到公司确认。倍数区间参考 HealthEquity（总收入约 5×）、高增长 SaaS 医疗健康同业（15–25×）以及成长股权溢价（25–35×）。当前
      $3.25B 估值最接近中高位 NR 对应 15–30×，或高位 NR 对应约 18×。
    claimRefs:
