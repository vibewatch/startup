              Consolidated Appropriations Act of 2026 要求 PBM 采用固定费用薪酬（2028 年生效）并穿透返利——这些结构性要素 Capital Rx 已经在执行。现任 PBM
              必须重构商业模式；Judi Health 则已以合规姿态进入改革后时代。
