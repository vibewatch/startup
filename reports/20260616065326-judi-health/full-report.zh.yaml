      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Prime Therapeutics 联盟是 Judi Health 最核心的单点失败风险。截至 2025 年 9 月，Prime 已签约把 5400 万健康计划成员迁移到 Judi 平台，约占 Judi
              已签约总成员数的 92%。Prime Therapeutics 由 Blue Cross Blue Shield 健康计划持有，也是收到 FTC Section 6(b) 调查令的六家 PBM 之一。如果
              Prime 遭遇 FTC 执法、转向新战略，或终止这项多年联盟，Judi 的增长轨迹会受到实质性打击，甚至可能几乎抹去 2024 年以来所有已签约成员增量。Amino Health 收购（care
              navigation 软件）增加了第二个整合依赖，也把 Amino 自身客户关系和技术栈带入 Judi 生态。CLEAR 身份验证合作（2026 年 5
              月宣布）又为会员认证增加了一个第三方技术依赖。Wellington Management 和 General Catalyst 领投 $400M Series
              F；投资人持股集中可以强化纪律，但资本市场环境恶化时，也会限制公司的再融资弹性。AWS 云基础设施集中意味着平台可靠性依赖单一 hyperscaler，尽管 Judi 的 serverless
              架构意在压低这类暴露。
