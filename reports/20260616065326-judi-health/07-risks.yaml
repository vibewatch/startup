  - id: operational-tech-security-risk
    title: Operational, Technology, and Security Risk
    body: >
      As a health data custodian processing pharmacy benefit claims for 5+ million employer PBM
      members and 54+ million health plan lives (contracted), Judi Health carries significant
      HIPAA exposure. The HIPAA Privacy and Security Rules impose obligations on covered entities
      and business associates, and HHS OCR actively enforces them: OCR has obtained corrective
      action in hundreds of cases annually, securing resolution agreements that include civil
      monetary penalties and multi-year remediation plans. The HIPAA wrongful disclosure statute
      (42 U.S.C. §1320d-6) imposes both civil and criminal penalties for unauthorized PHI
      disclosure. Judi's security architecture—FISMA NIST 800-53 framework, serverless AWS
      infrastructure with minimized attack surface, real-time threat monitoring, and content
      filtering—represents a deliberate security-first posture, but no independent SOC 2 Type II
      or HITRUST certification has been publicly confirmed. The Amino/Care Navigation acquisition
      introduces integration risk: merging care-navigation software, provider-search capabilities,
      and a benefits wallet with an enterprise PBM adjudication platform increases system
      complexity and implementation surface area. Migrating large employer and health plan clients
      to the Judi platform involves multi-year implementation programs; the current 1M live vs.
      5M contracted employer-life gap signals that implementation velocity lags contracting
      velocity. No security incidents or data breaches involving Capital Rx or Judi Health were
      identified in this review.
    claimRefs:
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR008
    tableRefs:
      - TR002

  - id: partner-dependency-risk
    title: Partner and Dependency Risk
    body: >
      The Prime Therapeutics alliance is the defining single-point-of-failure risk for Judi
      Health. As of September 2025, Prime had contracted 54 million health plan lives to run
      on the Judi platform—roughly 92% of Judi's total contracted life count. Prime Therapeutics
      is owned by Blue Cross Blue Shield health plans and was one of six PBMs subject to FTC
      Section 6(b) investigation orders. If Prime faces FTC enforcement, undertakes a strategic
      pivot, or terminates the multi-year alliance, Judi's growth trajectory would be materially
      impaired, potentially reversing nearly all the contracted-life gains since 2024. The Amino
      Health acquisition (care navigation software) adds a second integration dependency and
      brings its own customer relationships and technology stack into the Judi ecosystem. The
      CLEAR identity-verification partnership (announced May 2026) creates another third-party
      technology dependency for member authentication. Wellington Management and General Catalyst
      led the $400M Series F; concentrated investor ownership can accelerate discipline but
      also limits the company's refinancing flexibility if capital market conditions worsen.
      AWS cloud infrastructure concentration means platform reliability depends on a single
      hyperscaler, though Judi's serverless architecture is designed to minimize that exposure.
