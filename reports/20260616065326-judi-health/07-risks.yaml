  - id: financial-governance-risk
    title: Financial, Business Model, and Governance Risk
    body: >
      Judi Health's reported gross revenue ($2.1B in 2024, ~$3.7B projected for 2025) includes
      substantial drug-cost passthrough; the company has not disclosed net revenue, gross margin,
      EBITDA, or unit economics at the PBM or platform level. This opacity makes it impossible
      to assess the path to profitability or the true capital efficiency of the business model.
      The flat PMPM/per-claim fee model insulates Judi from spread-pricing reform risk, but
      rebate pass-through mandates under the 2026 PBM reform law could affect revenue composition
      for any PBM. NADAC pricing provides a stable, CMS-maintained reference price, but a
      sustained downward shift in drug acquisition costs—plausible under Inflation Reduction Act
      drug-price negotiation—would proportionally reduce gross revenue without necessarily
      improving net economics. The company has raised ~$610M in total equity capital; exact
      burn rate, cash runway, and debt structure remain undisclosed. AJ Loiacono (CEO), Ryan
      Kelly (CTO), and the co-founder team represent concentrated intellectual capital; key-person
      departure risk is material given the company's technology-forward positioning. Governance
      disclosures typical of public companies (board composition, audit committee, related-party
      transactions) are unavailable for this private company.
    claimRefs:
      - CR030
      - CR031
