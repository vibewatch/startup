  - id: mitigations-kill-criteria
    title: Mitigations, Kill Criteria, and Evidence Gaps
    body: >
      Judi Health's primary structural mitigation against regulatory risk is its transparent,
      flat-fee, NADAC-based model: the FTC's reform agenda explicitly targets the spread-pricing
      and opaque-rebate practices that define incumbent PBMs—not Judi's model. The Prime
      Therapeutics alliance, while a concentration risk, also represents mutual strategic
      dependency (Prime gains platform technology; Judi gains health-plan lives scale). The
      post-$400M Series F capital position provides runway to weather a multi-quarter regulatory
      disruption. Thesis-breaking events that would warrant divestiture or deep discount
      include: (1) FTC enforcement action that specifically names Capital Rx/Judi Health or
      imposes conditions on the Prime alliance; (2) a confirmed material HIPAA data breach
      affecting 10,000+ members; (3) Prime Therapeutics contractual exit within 24 months;
      (4) failure to advance employer live count from 1M to 3M by end of 2026; or
      (5) evidence of negative net revenue (margin compression below breakeven).
      Evidence gaps include undisclosed profitability metrics, the financial terms of the
      Prime alliance, and the absence of independently audited security certifications.
    claimRefs:
      - CR037
      - CR038
      - CR039
      - CR040
      - CR041
