callouts:
  - calloutType: risk
    title: "Prime Therapeutics Dependency Is the Single Largest Thesis Risk"
    body: >
      Roughly 92% of Judi Health's contracted lives (54M of ~59M) flow through the Prime
      Therapeutics alliance. Prime itself was subject to FTC Section 6(b) investigation orders.
      An alliance disruption—whether from FTC enforcement conditions, Prime's strategic
      reassessment, or Blue Cross Blue Shield governance decisions—would be an investment
      thesis break. Investors should treat this as the defining binary risk before increasing
      position size.
    claimRefs:
      - CR023
      - CR024
      - CR025

  - calloutType: risk
    title: "1M Live vs. 5M Contracted: An Implementation Gap Investors Must Monitor"
    body: >
      As of January 2026, only 1 of 5 contracted employer PBM million lives were "live and
      actively using" the Capital Rx platform. This 80% activation gap is normal in enterprise
      PBM migrations but represents real execution risk—contracts can be cancelled during
      implementation, and revenue is recognized only on live members. Monitoring activation
      velocity over the next 12 months is critical to thesis validation.
    claimRefs:
      - CR020
      - CR039

  - calloutType: insight
    title: "Regulatory Tailwind With Execution Dependency"
    body: >
      Judi Health's transparent, NADAC-based model is structurally aligned with the direction
      of federal PBM reform. The 2026 appropriations bill's spread-pricing bans and rebate
      pass-through requirements effectively mandate competitors adopt features that Judi already
      offers. This creates a medium-term competitive tailwind, but only if Judi can execute
      on implementation at scale before incumbents adapt their models.
    claimRefs:
      - CR003
      - CR004
      - CR037
      - CR038

