  - id: TP003
    title: Substitute and Status-Quo Alternatives
    notes: >-
      Rows describe the material alternative configurations a self-insured employer buyer may choose
      instead of a full-service transparent PBM or unified platform vendor. Buyer advantages and
      limitations are qualitative assessments based on public evidence and market observation;
      per-employer outcomes vary by size, broker sophistication, and benefit design.
    columns:
      - "Alternative"
      - "How Buyer Selects It"
      - "Buyer Advantages"
      - "Limitations vs. Judi Health"
      - "Displacement Trigger"
    rows:
      - - "Carve-out PBM + separate medical TPA + navigation vendor"
        - "Default multi-vendor approach for large self-insured employers seeking best-of-breed"
        - "Incumbent relationships, vendor specialization, low switching cost from current config"
        - "Data silos; three-vendor coordination overhead; misaligned incentives; higher total cost"
        - "Cost overruns, data-quality failures, or member experience problems drive consolidation"
      - - "Insurer-bundled PBM (tied to carrier ASO or fully insured)"
        - "Employer uses major carrier's ASO plan and accepts bundled PBM as part of deal"
        - "Single vendor relationship, simplified admin, reduced RFP burden"
        - "Opaque PBM rebates; carrier conflict of interest; harder to exit; limited customization"
        - "Broker-led spend audit uncovers hidden rebate spread; employer seeks transparent unbundling"
      - - "In-house benefits self-administration"
        - "Very large employers (500K+ employees) with dedicated benefits teams build internal ops"
        - "Maximum control over data and cost; no intermediary margin"
        - "Very high IT, compliance, and staffing burden; impractical for most mid-market employers"
        - "Regulatory complexity or talent shortage makes in-house model unsustainable"
      - - "Standalone discount card or cash-pay optimization"
        - "Small employers or uninsured populations seeking lowest pharmacy point-of-sale cost"
        - "Simple, no contracts, immediate deployment, low friction"
        - "No formulary management, UM, clinical programs, or claims adjudication capabilities"
        - "Growing benefit complexity or new specialty drug costs require a full PBM relationship"
      - - "Navigation-only point solution (no PBM change)"
        - "Employers adding a navigation vendor to existing incumbent PBM without changing PBM"
        - "Low switching cost; incremental member experience improvement; low vendor count change"
        - "Does not address pharmacy spread or rebate opacity; incumbent PBM incentives unchanged"
        - "Employer CFO drives full PBM RFP after navigation investment fails to bend cost curve"
