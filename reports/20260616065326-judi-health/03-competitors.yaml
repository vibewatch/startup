company:
  name: Judi Health
chapter:
  number: 3
  title: Competitors
  summary: >-
    The Big Three PBMs (CVS Caremark, Express Scripts, Optum Rx) collectively processed approximately
    80% of U.S. equivalent prescription claims in 2025 and represent Judi Health's primary competitive
    obstacle, each backed by vertically integrated insurer-pharmacy parent companies with structural
    cost advantages that smaller challengers cannot easily replicate. Judi Health's (Capital Rx's)
    strategic technology alliance with Prime Therapeutics—which invested $115 million in 2024 and
    contracted to replace Prime's legacy adjudication system with the JUDI platform—provides critical
    third-party validation of differentiation at scale, though the concurrent Prime-Express Scripts
    network dependency and a 2025 antitrust arbitration finding introduce uncertainty into that
    partnership's trajectory. A growing tier of transparent challengers (Navitus, SmithRx, Rightway,
    EmpiRx Health) shares Judi Health's pass-through pricing ethos but none yet combines it with a
    fully unified pharmacy-and-medical claims platform, leaving Judi Health competitively distinct
    on platform breadth even as pricing transparency alone risks commoditization.

sections:
  - id: incumbent-pbm-landscape
    title: Incumbent PBM Landscape
    body: >-
      Three pharmacy benefit managers have held approximately 80% of U.S. equivalent prescription
      claims for multiple consecutive years, and that concentration was consistent through 2025.
      Express Scripts (Cigna's Evernorth segment) claimed the top position for the second consecutive
      year, processing approximately 2.22 billion equivalent claims in 2025—a 4.8% year-over-year
      increase—driven by the 20-million-life Centene contract shift from CVS Caremark that took
      effect in January 2024 and by Prime Therapeutics' continued reliance on Express Scripts for
      approximately half of its retail pharmacy network contracting. CVS Caremark processed
      approximately 1.9 billion equivalent claims in 2025, a 0.9% decline and the second consecutive
      annual drop following the Centene transition. Optum Rx managed $188 billion in drug spend in
      2025, of which 46% ($87 billion) was classified as specialty pharmaceuticals; crucially,
      63% of Optum Rx revenues in 2025 derived from UnitedHealthcare's internal businesses, giving
      it a structural captive customer base that no external challenger can replicate. All three are
      owned by organizations also controlling major insurers, specialty pharmacies, and provider
      networks, enabling behind-the-scenes economics that allow them to win business even when a plan
      sponsor switches to an independent PBM—many of which still outsource claims processing,
      network contracting, or rebate negotiation back to one of the Big Three. The Federal Trade
      Commission formalized its concern in a July 2024 report characterizing these intermediaries as
      "powerful middlemen inflating drug costs and squeezing Main Street pharmacies," and an
      arbitrator in early 2025 found that Prime Therapeutics' Express Scripts network arrangement
      violated federal and state antitrust laws—creating regulatory tailwinds for challengers. Prime
      Therapeutics, the Blue Cross Blue Shield-affiliated PBM owned by 19 BCBS health plans, reported
      $55.3 billion in prescription spending and 407 million claims in 2025, but roughly half its
      network claims were processed by Express Scripts, reducing its independence meaningfully.
      MedImpact Healthcare Systems, the largest privately held independent PBM, completed its
      acquisition of Rite Aid's Elixir Solutions business in early 2024 but has become increasingly
      secretive about its financials and technology investments.
