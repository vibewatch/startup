callouts:
  - calloutType: strength
    title: Prime Therapeutics Alliance Validates JUDI as Enterprise Infrastructure
    body: >-
      Prime Therapeutics' 2024 decision to invest $115 million in Capital Rx and replace its entire
      RxClaim adjudication system with the JUDI platform represents the most commercially significant
      third-party validation of Judi Health's technology thesis. A BCBS-owned PBM with $55.3 billion
      in prescription spending trusting its core infrastructure to JUDI endorses the platform's
      enterprise scalability and signals the kind of health-plan-channel opportunity that could
      accelerate future growth well beyond the direct employer sales motion.
    claimRefs:
      - CP021
      - CP010
      - CP039

  - calloutType: risk
    title: Independent PBMs Remain Structurally Dependent on the Big Three
    body: >-
      Despite the growth of transparent challengers, many independent PBMs—including Prime
      Therapeutics—still rely on Express Scripts, CVS Caremark, or Optum Rx for claims processing,
      pharmacy network contracting, or rebate aggregation. This structural dependency means that
      plan sponsors choosing an alternative PBM may still funnel economics back to the Big Three,
      limiting the degree of genuine competitive disruption and creating a ceiling on how quickly
      challengers like Judi Health can capture network leverage at incumbent scale.
    claimRefs:
      - CP033
      - CP034
      - CP022

  - calloutType: insight
    title: FTC Scrutiny and Antitrust Proceedings Create Regulatory Tailwind
    body: >-
      The FTC's July 2024 report characterizing incumbent PBMs as "powerful middlemen inflating
      drug costs" and the early-2025 arbitration finding against the Prime-Express Scripts arrangement
      on antitrust grounds collectively strengthen the regulatory case for transparent, independent
      PBMs. These headwinds for incumbents represent a structural tailwind for Judi Health's model
      differentiation narrative in RFPs and broker-consultant channels.
    claimRefs:
      - CP011
      - CP012

