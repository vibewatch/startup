  - id: transparent-tech-challengers
    title: Transparent and Tech-Enabled Challengers
    body: >-
      A cohort of independent, transparent-model PBMs occupies the primary direct-challenger tier
      to Judi Health's Capital Rx business. Navitus Health Solutions offers a fully pass-through
      model in which clients pay exactly what Navitus pays pharmacies and receive 100% of negotiated
      discounts, supported by a built-from-scratch claims adjudication system and a wholly owned
      cost-plus specialty pharmacy subsidiary, Lumicera Health Services. SmithRx competes on a
      technology-first, radically transparent platform, claiming customers save 20% or more on total
      drug costs versus legacy PBMs; its employer-facing materials emphasize a modern, cloud-native
      infrastructure that reduces friction in plan design and data access. EmpiRx Health differentiates
      on a clinically-driven model placing licensed pharmacists at the center of its service delivery,
      supported by an AI-powered population health analytics platform called Clinically™ that aims to
      produce guaranteed clinical savings for plan sponsors. Rightway Healthcare combines a
      100% pass-through PBM (single transparent fee; no spread, no retained rebates) with integrated
      clinical care navigation, reporting a member Net Promoter Score of 70 (claiming 8.5× the
      industry average) and 15% healthcare savings for clients. All four challengers share Judi
      Health's transparent pricing positioning but none offers an integrated medical benefit
      administration capability comparable to Judi Health's Judi EHP platform. The pivotal competitive
      development is Prime Therapeutics' 2024 decision to invest $115 million in Judi Health (then
      Capital Rx) and to replace its existing RxClaim adjudication architecture entirely with the
      JUDI platform—an independent third-party validation that the JUDI technology offers meaningful
      advantages over market alternatives. By 2025, approximately half of Prime's prescription claims
      continued to flow through Express Scripts' network, however, preserving an indirect Big Three
      dependency even as the adjudication relationship with Judi Health expanded.
