  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "competitor pricing"
      missingEvidence: >-
        Realized pricing and discount terms for Big Three PBMs and transparent challengers are
        not publicly disclosed; only list pricing and company-claimed savings percentages are
        available on public surfaces.
      whyItMatters: >-
        Without access to actual contract terms, pricing comparison in TP002 cannot confirm whether
        Judi Health's NADAC model consistently outperforms challenger PBMs in client-facing economics.
      diligencePath: >-
        Request actual contract pricing data from Capital Rx client reference accounts or from
        broker-consultant intermediaries with multi-vendor RFP experience.
      relatedQuestionRefs:
        - QP006

    - type: private-evidence-only
      severity: material
      topic: "switching costs"
      missingEvidence: >-
        No publicly available quantitative data on implementation time, transition cost, or operational
        disruption experienced by employers switching from Big Three PBMs to transparent challengers
        or to Judi Health specifically.
      whyItMatters: >-
        Switching cost estimates are central to the moat durability analysis; without them, the
        severity of the incumbent retention advantage and the pace of Judi Health's growth TAM
        cannot be reliably assessed.
      diligencePath: >-
        Interview Judi Health clients and broker-consultants who have executed PBM transitions; obtain
        implementation timeline and operational disruption data under NDA.
      relatedQuestionRefs:
        - QP023

    - type: missing-source
      severity: minor
      topic: "differentiation commoditization"
      missingEvidence: >-
        No independent third-party study comparing the realized cost savings and differentiation
        durability of NADAC-anchored PBMs versus pass-through challengers without NADAC has been
        found; the comparison relies on company-claimed figures from competing vendors.
      whyItMatters: >-
        If multiple transparent challengers converge on similar realized savings, Judi Health's
        pricing transparency alone will not command a premium, making platform breadth the only
        durable differentiator.
      diligencePath: >-
        Search for employer benefits consulting firm studies, broker benchmark reports, or academic
        analyses comparing NADAC vs. non-NADAC pass-through savings.
      relatedQuestionRefs:
        - QP013

    - type: stale
      severity: minor
      topic: "competitor scale and funding"
      missingEvidence: >-
        Funding totals and revenue figures for SmithRx, EmpiRx Health, Rightway Healthcare, and
        Navitus are not publicly disclosed; the latest known data for each is based on company-
        claimed scale metrics rather than independent financial reporting.
      whyItMatters: >-
        Without current funding or revenue data, it is difficult to assess the relative financial
        sustainability of each challenger and their ability to compete long-term in RFPs.
      diligencePath: >-
        Monitor Crunchbase, PitchBook, or trade press for new funding announcements from
        SmithRx, EmpiRx, Rightway, and Navitus in 2026.

