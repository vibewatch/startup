  - id: adoption-trajectory
    title: Adoption Trajectory and Live Deployment
    body: >-
      Capital Rx's contracted employer PBM lives grew to five million by January 2026, up
      from approximately four million employer members as of September 2025, a step that
      required signing 80-plus new partnerships in 2025 (and the same volume in 2024),
      including 13 Fortune 500 corporations and 21 hospital groups. Live members exceeded
      one million as of January 1, 2026, reflecting a multi-quarter implementation lag common
      in enterprise health benefits. On the health plan side, over 54 million lives were
      contracted to run on the Judi platform as of September 2025, with two million new
      health plan lives contracted and implemented in 2025 through Prime Therapeutics.
      Forbes (September 2025) reported that Judi Health had also signed "a couple of major
      employer plans" and a TPA licensing arrangement representing approximately 40,000
      lives for the new Unified Claims Processing medical benefits product, suggesting the
      medical side is in early commercial deployment. Total portfolio reach (employer PBM
      plus health plan channel) approaches 60 million covered lives per the Amino acquisition
      press release. Growth is accelerating: the company reported $3.7 billion in estimated
      2025 revenue (pharmacy admin fees, not insured risk), up more than 75% year-over-year,
      with healthcare cost headwinds forecast at 6.5%–9% for 2026 driving continued employer
      demand for transparent PBM alternatives. The CLEAR identity verification partnership
      (May 2026) indicates the platform is actively expanding into Medicare and interoperability
      use cases, extending the addressable market and adding a new enterprise segment.
    claimRefs:
      - CU018
      - CU019
