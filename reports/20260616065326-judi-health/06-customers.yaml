  - id: retention-durability
    title: Retention, Durability, and Expansion
    body: >-
      Capital Rx self-reports a 99.5% client retention rate and a 100% implementation
      satisfaction rate. No independent audit, third-party NPS study, or regulator-verified
      figure corroborates these claims, and the sample is self-selected (employers who stayed
      vs. those who churned are not distinguished). The Rice University case illustrates why
      the stickiness dynamic is credible: after implementation, real-time claims visibility
      and same-day issue resolution create high switching costs back to legacy PBMs. The
      flat-fee NADAC model also avoids re-contracting friction—Capital Rx does not profit
      from higher drug spend, so renewal conversations are primarily driven by cost outcomes
      rather than pricing negotiations. The Never Move Again product (unbundled PBM) is
      explicitly designed to reduce implementation friction and lock in pricing continuity,
      addressing the single largest obstacle to switching. On the expansion side, the
      company's trajectory is from pharmacy-only PBM toward full-spectrum benefits
      administration. The Judi Health Unified Claims Processing platform, which integrates
      pharmacy and medical claims on one engine, is the expansion vehicle; Forbes noted
      Loiacono's observation that "once you see the medical and pharmacy claims coming in at
      the same time, you never want to go back." Capital Equilibrium (level-funded pharmacy
      benefit) extends the market to budget-sensitive municipalities and small employers who
      could not previously access a transparent PBM model, creating a pipeline of lower
      CAC upsell targets. The company's own deployment on Judi yielded 11% cost savings
      per member per month internally and reduced claims processing time from more than
      six months to a maximum of 18 days, providing a concrete internal benchmark for the
      expansion value proposition. No net revenue retention (NRR) or gross revenue
      retention (GRR) data is publicly disclosed. Cohort retention by year is unavailable.
    claimRefs:
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU035
      - CU036
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: concentration-risk
    title: Concentration Risk, Implementation Gap, and Channel Dependence
    body: >-
      The most material customer risk is concentration through Prime Therapeutics. The 54+
      million health plan lives on the Judi platform consist largely of Prime's client book—
      23 Blue Cross Blue Shield plans and affiliates. Prime is both a minority investor and the
      only third-party PBM licensed on the Judi platform as of mid-2026. If Prime terminates
      or renegotiates the alliance (whether due to its own competitive pressures, the
      AHF antitrust litigation, Express Scripts' growing role in half of Prime's pharmacy
      network, or a change in Prime's strategic direction), Judi Health could lose the majority
      of its health plan lives in one event. The implementation backlog amplifies this risk:
      with only about one million of five million contracted employer PBM lives currently live
      (as of January 2026), a significant portion of contracted revenue has not yet converted
      to billing. Enterprise benefits implementations typically run three to six months and
      require coordination across HR, payroll, and pharmacy networks, creating a drag on
      revenue realization and a window in which clients could reverse course. A secondary
      channel risk is broker dependence: Judi Health routes a material share of employer
      wins through independent brokers and consultants, and broker consolidation or
      exclusivity deals with incumbent PBMs could suppress new client inflows. The FTC's 2024
      PBM industry report catalogued how large, vertically integrated PBMs leverage formulary
      placement and rebate structures as anti-competitive barriers, which validates the
      structural tailwind for Capital Rx but also signals the adversarial market environment
      the company must navigate. On customer concentration within the employer book, no
      individual employer client is named publicly, and the company has not disclosed the
      revenue contribution of its top five or ten clients, leaving Herfindahl-level
      concentration unassessable without direct diligence.
    claimRefs:
      - CU037
      - CU038
      - CU039
      - CU040
    tableRefs:
      - TU005

  - id: open-gaps
    title: Open Diligence Questions and Evidence Gaps
    body: >-
      Key diligence gaps remain across all five content requirement areas. On customer
      identity, no Fortune 500 employer clients are named publicly and the company declined
      to disclose names to Forbes as of September 2025. On adoption, the five million
      contracted vs. one million live member gap requires clarification on implementation
      timelines, expected go-live dates, and the risk of deal cancellation before go-live.
      On retention, the 99.5% rate is self-reported and undefined (it is unclear whether it
      covers all clients, only renewals, or only full-year cohorts). No cohort or waterfall
      data is available. On expansion, the medical Unified Claims Processing platform is in
      early deployment with an unnamed TPA and two unnamed major employer plans; revenue
      from this product line is not separately disclosed. On concentration, the Prime
      Therapeutics alliance scope, minimum commitment terms, and termination provisions are
      private. Investors should seek: (1) a reference list of five or more Fortune 500
      clients; (2) an audited or consultant-verified retention cohort going back at least
      three years; (3) Prime Therapeutics alliance contract duration and termination-for-
      convenience provisions; (4) the implementation pipeline schedule and expected go-live
      dates for the four million contracted-but-not-live employer lives; and (5) NRR and
      GRR disclosure by product line and segment.
    claimRefs:
      - CU039
      - CU040

