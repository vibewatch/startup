  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Fortune-500-client-names
      missingEvidence: >-
        Names of the 13 Fortune 500 clients signed in 2025 and the estimated four million
        employer PBM lives that are contracted but not yet live.
      whyItMatters: >-
        Without named Fortune 500 clients, investors cannot independently verify the quality
        of the claimed enterprise customer base or assess churn risk at the account level.
      diligencePath: >-
        Request a reference list of five or more named Fortune 500 or similarly scaled clients
        under NDA; obtain production go-live dates and ARR contribution for the top ten accounts.
      relatedQuestionRefs:
        - QU002
        - QU014
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
      topic: Prime-Therapeutics-alliance-terms
      missingEvidence: >-
        Contract duration, termination-for-convenience provisions, minimum commitment
        volumes, and any exclusivity scope of the Prime Therapeutics / Judi platform alliance.
      whyItMatters: >-
        The alliance accounts for the majority of 54 million health plan lives; without
        knowing the binding terms, the durability of this revenue stream is unassessable.
      diligencePath: >-
        Obtain alliance agreement term sheet or summary under NDA; confirm whether Prime has
        a termination-for-convenience right and what the cure period is.
      relatedQuestionRefs:
        - QU015
        - QU016
        - QU020

    - type: missing-source
      severity: material
      topic: audited-client-retention
      missingEvidence: >-
        An audited or independently verified cohort retention waterfall for employer PBM
        clients spanning at least three annual cohorts, including NRR and GRR by segment.
      whyItMatters: >-
        The 99.5% self-reported retention rate is unverifiable; multi-year cohort data would
        confirm or challenge the durability narrative and underpin ARR forecasting.
      diligencePath: >-
        Request client-level retention reconciliation for cohorts 2022-2024 from CFO or VP
        Finance; seek independent third-party validation (e.g., Big Four attestation letter).
      relatedQuestionRefs:
        - QU011
        - QU012
        - QU023

    - type: stale
      severity: minor
      topic: contracted-to-live-pipeline-update
      missingEvidence: >-
        Updated contracted-to-live ratio and implementation pipeline as of mid-2026, given
        the January 2026 figure shows four million contracted lives not yet live.
      whyItMatters: >-
        The implementation backlog affects revenue timing and near-term ARR ramp; an updated
        pipeline would clarify whether the backlog is being worked down or growing.
      diligencePath: >-
        Request Q2 2026 operations dashboard showing go-live pipeline by employer count,
        lives, and expected activation date; compare to January 2026 baseline.
      relatedQuestionRefs:
        - QU007
        - QU017
        - QU019

    - type: missing-source
      severity: minor
      topic: named-union-and-public-sector-clients
      missingEvidence: >-
        Named union clients and specific state or municipal employers using Capital Rx PBM
        or Judi Health platform, beyond the aggregate mention in the January 2026 press release.
      whyItMatters: >-
        Union and public sector accounts are cited as major growth drivers; without names,
        the segment's breadth and durability are unverifiable and could be inflated.
      diligencePath: >-
        Request two or three named reference union or public sector clients; confirm
        production deployment dates and lives covered; check public union benefit fund filings
        for PBM vendor disclosures.
      relatedQuestionRefs:
        - QU004
        - QU005

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TU001 row cells for Fortune 500, unions, municipalities, and TPA segments contain
      analyst estimates or aggregated company-stated values rather than primary-source
      per-row data; a notes field is included at the table level to document this. This
      acknowledgment covers purely inferential cells where no additional row-level source
      exists beyond what is already documented in the table-level notes.
