callouts:
  - calloutType: strength
    title: "80+ New Partnerships for Two Consecutive Years Signals Durable Demand"
    body: >-
      The company signed more than 80 new partnerships in both 2024 and 2025, including
      13 Fortune 500 corporations and 21 hospital groups in 2025 alone. This run-rate, if
      sustained, implies continued market share gains against the Big Three PBMs and validates
      that the company's transparent pricing model resonates at the enterprise level. The
      breadth of segment coverage—spanning Fortune 500 employers, unions, health systems,
      academic institutions, and public sector entities—reduces the risk of any single
      vertical drying up and positions the company to benefit from multiple demand catalysts
      simultaneously.
    claimRefs:
      - CU021
      - CU022
      - CU023

  - calloutType: risk
    title: "Prime Therapeutics Concentration and Contracted-to-Live Lag Are Material Risks"
    body: >-
      The 54+ million health plan lives on the Judi platform are primarily sourced through
      the Prime Therapeutics alliance. Prime is also a minority investor and the only licensed
      third-party PBM on Judi, creating a single point of failure for the health plan revenue
      line. Separately, the 4:1 contracted-to-live gap for employer PBM (5M contracted vs.
      ~1M live) means four-fifths of contracted lives have not yet converted to revenue.
      Both risks are manageable but require investors to model scenarios where the Prime
      alliance restructures and where implementation timelines slip beyond expectations.
    claimRefs:
      - CU037
      - CU038
      - CU039

