  - id: named-customer-proof
    title: Named Customer Proof and Case Evidence
    body: >-
      Named evidence is limited but credible. Rice University is the most detailed publicly
      documented case: Elaine Britt, executive director of HR operations, switched the
      university from Express Scripts to Capital Rx at the start of the school's 2024 fiscal
      year (July 2024). Within nine months, pharmacy costs were down approximately 5%
      year-over-year despite the addition of GLP-1 drugs that added several hundred thousand
      dollars of incremental cost. Britt cited Capital Rx's flat-fee NADAC-based pricing, the
      ability to fix issues the same day rather than in three to four weeks with Express Scripts,
      and real-time claims visibility through the Judi platform. This case was originally
      reported by Employee Benefits News (April 29, 2025) and republished on judi.health.
      The Charlotte Hornets (NBA) announced a multi-year, multi-element jersey patch
      partnership with Judi Health in September 2025. Although this is primarily a brand and
      marketing deal rather than a health-benefits deployment, it confirms Judi Health's
      growing national profile and validates the company's willingness to commit capital to
      prominent, long-term customer relationships. The 5M contracted lives press release
      (January 2026) names customer archetypes—13 new Fortune 500 corporations, 21 new
      hospital groups/health systems, several state employee plans, municipalities, and
      universities—but does not disclose company names. Forbes noted that Loiacono declined to
      name specific Fortune 500 clients as of September 2025, citing confidentiality. The Prime
      Therapeutics alliance (announced February 2024) is the highest-volume channel proof:
      Prime serves 50-plus million Americans through 23 Blue Cross Blue Shield plans and
      committed to use Judi as its adjudication platform, making Prime itself the most material
      named customer/partner. Health system investors from the 2023 strategic investment round
      include Atlantic Health System, Banner Health, Hawai'i Pacific Health, Inova Health
      System, Lehigh Valley Health Network, Memorial Hermann Health System, Nebraska Medicine,
      Novant Health, Ochsner Health, and WellSpan Health—validation that leading health systems
      both trusted the company enough to invest and are likely customers or prospects.
    claimRefs:
