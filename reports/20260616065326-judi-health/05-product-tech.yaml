  - id: trust-security-compliance
    title: Trust, Security, Compliance, and Quality Controls
    body: >-
      Judi Health's privacy policy, last updated April 3, 2026, confirms HIPAA and HITECH
      compliance for all protected health information (PHI) processed through its member web
      portal at judi.com, its Capital Rx-branded mobile application on iOS and Android, and via
      business associate agreements with health plan clients. The policy designates Capital Rx,
      Inc. as the entity with a Chief Privacy Officer, and Judi Health, LLC and Amino, LLC as
      co-controllers of personal data. State-specific privacy rights are acknowledged across all
      applicable states.

      Beyond HIPAA/HITECH, the company has not publicly disclosed independent third-party
      certifications such as SOC 2 Type II or ISO 27001 for its cloud infrastructure as of
      June 2026. Prime Therapeutics' COO publicly described the Judi platform as offering
      "state-of-the-art security" in the February 2024 alliance announcement, but this
      assessment has not been substantiated with a published audit report or certification.
      Utilization management job postings reference URAC/NCQA accreditation standards as
      operating requirements, suggesting the company targets these standards operationally,
      though formal accreditation status is not confirmed in public disclosures. The active
      recruitment of a Director of Cloud Security as of June 2026 indicates the enterprise
      security program is still maturing.
