  - id: workflow-and-operating-model
    title: Workflow and Operating Model
    body: >-
      The Judi platform's core workflow centers on real-time claims adjudication: when a plan
      member fills a prescription, the claim flows through the Judi EHP, which applies NADAC
      pricing (updated weekly by CMS), validates eligibility, checks formulary, and adjudicates
      the claim in real time. Member service representatives can simultaneously view the full
      claim lifecycle—including rejection reasons and approval logic—inside the platform,
      enabling same-day problem resolution. Rice University, a Capital Rx client since mid-2024,
      reported the ability to fix plan configuration issues the same day, compared to a 3-4 week
      turnaround at legacy PBM Express Scripts.

      For medical claims, the workflow mirrors the pharmacy model: providers submit claims via
      EDI standards, which are ingested, adjudicated, and reported through the same Judi platform.
      Unified Claims Processing™ allows a plan sponsor to manage pharmacy and medical benefits
      under identical rules, data access, and reporting—eliminating the administrative silos of
      having separate PBM and medical TPA relationships. Forbes reported that Judi Health's
      internal use of its own medical platform resulted in claims processing time shrinking from
      more than six months to a maximum of 18 days, alongside 11% year-over-year cost savings.

      Judi Care navigation integrates with the claims layer: members use the Benefits Hub to
      search for in-network providers using provider cost and quality data across 200 specialties,
      book appointments in real time, review what is covered, and route prescriptions using claims
      history. This AI-driven navigation layer sits above the adjudication engine and relies on
      Amino Health's proprietary data aggregation and configuration framework.
