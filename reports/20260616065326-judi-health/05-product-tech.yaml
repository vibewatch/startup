  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: security certifications
      missingEvidence: >-
        SOC 2 Type II audit report or ISO 27001 certification for Judi Health's cloud
        infrastructure, covering data security, availability, and confidentiality controls
        for PHI held across millions of covered lives.
      whyItMatters: >-
        Enterprise buyers (health plans, self-insured employers, TPAs) require independent
        security assurance before allowing PHI-handling SaaS vendors into their ecosystems.
        Absence of publicly disclosed certifications is a material diligence risk.
      diligencePath: >-
        Request SOC 2 Type II audit report directly from Judi Health under NDA; confirm
        cloud provider identity and review shared responsibility model; ask whether
        certifications are pending or in-scope for any upcoming audit cycle.
      relatedQuestionRefs: [QE004, QE019]

    - type: missing-source
      severity: material
      topic: API documentation
      missingEvidence: >-
        Public or restricted API documentation, integration guides, or a developer portal
        for connecting external systems to the Judi platform.
      whyItMatters: >-
        Integration complexity is a key procurement criterion for health plan licensees
        and employer buyers. Lack of visible developer surface prevents independent
        assessment of integration cost and timeline.
      diligencePath: >-
        Request integration documentation and API specifications from Judi Health's
        sales/enterprise engineering team; review the forward-deployed engineer job
        role requirements for integration scope signals.
      relatedQuestionRefs: [QE009]

    - type: missing-source
      severity: material
      topic: AI algorithm validation
      missingEvidence: >-
        Published validation documentation for Judi Care's AI algorithms, including
        model training data sources, accuracy benchmarks, and bias testing for provider
        navigation recommendations and cost estimates.
      whyItMatters: >-
        Unvalidated AI recommendations in healthcare settings create liability exposure
        and erode member trust; the Amino Health data integration is incomplete and
        algorithm lineage is unclear.
      diligencePath: >-
        Request AI model validation reports from Judi Health's engineering team; review
        Amino Health's prior published research and any peer-reviewed evaluations of
        the navigation platform.
      relatedQuestionRefs: [QE005]

    - type: private-evidence-only
      severity: material
      topic: medical claims scale
      missingEvidence: >-
        Updated live medical claims membership count and Prime Therapeutics migration
        progress as of Q2 2026, beyond the ~40,000 lives figure from the September 2025
        Forbes article.
      whyItMatters: >-
        Medical claims scale is the central execution risk for the Judi Health thesis.
        If the platform has not grown materially beyond ~40,000 lives nine months after
        the Series F, the execution credibility of the unified benefits platform is
        directly in question.
      diligencePath: >-
        Request quarterly live medical membership data and Prime Therapeutics migration
        timeline directly from Judi Health management; review any investor update materials.
      relatedQuestionRefs: [QE007, QE013]

    - type: missing-source
      severity: minor
      topic: technology stack
      missingEvidence: >-
        Specific cloud provider, programming languages, database technologies, and
        infrastructure topology underlying the Judi EHP.
      whyItMatters: >-
        Cloud provider concentration, data residency, and technical stack choices affect
        scalability limits, vendor lock-in risk, and potential migration costs for platform
        licensees.
      diligencePath: >-
        Review engineering job descriptions for specific technology requirements; request
        architecture overview documentation during technical due diligence.
      relatedQuestionRefs: [QE010, QE023]

