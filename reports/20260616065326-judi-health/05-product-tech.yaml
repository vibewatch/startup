  - id: maturity-roadmap-and-risks
    title: Product Maturity, Roadmap, and Technical Risks
    body: >-
      The Capital Rx PBM business is the platform's most mature commercial product, with over
      five million contracted employer PBM lives as of January 2026, a claimed 100%
      implementation satisfaction rate, and 99.5% client retention rate. By contrast, the
      Judi Health unified medical claims platform had signed "a couple of major employer plans"
      plus a TPA representing approximately 40,000 lives at the time of the September 2025
      Series F announcement—a fraction of the PBM scale—indicating the medical integration
      is still in early commercial deployment. The $400 million Series F is explicitly
      designated to scale this EHP deployment.

      The critical technical risks cluster around three areas: (1) the Prime Therapeutics
      migration—an unprecedented technology lift of 50+ million lives onto a startup platform—
      carries execution risk that is not de-risked by public disclosure; (2) the Judi Care AI
      navigation logic and data freshness are not independently validated, and the integration
      of Amino Health's dataset into the broader claims layer remains in progress; (3) the
      absence of published SOC 2, ISO 27001, or similar certifications, combined with the
      active recruitment of a cloud security director in 2026, leaves enterprise buyers without
      independent confirmation of security posture commensurate with handling millions of PHI
      records.

      On the roadmap, the company confirmed MPPP (Medicare Prescription Payment Plan) as a
      product offered through the platform, and Never Move Again was launched in 2024 to
      address plan sponsor migration friction. No detailed feature roadmap has been published
      for 2026.
