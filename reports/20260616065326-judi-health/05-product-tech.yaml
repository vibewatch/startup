callouts:
  - calloutType: strength
    title: Cloud-Native Unified Claims Processing — Genuine First-Mover
    body: >-
      The Judi EHP is the first platform to adjudicate pharmacy and medical claims on a
      single cloud-native SaaS system, delivering measurable operational advantages over
      legacy PBM technology: claims resolution compressed from 6+ months to 18 days, and
      11% year-over-year cost reductions in internal testing. General Catalyst's Holly Maloney
      and Wellington Management both cited the unified claims capability as the central thesis
      for their investments, projecting a potential $20 billion addressable market.
    claimRefs:
      - CE002
      - CE003
      - CE017
      - CE038

  - calloutType: risk
    title: Medical Claims Scale Is Nascent — Major Execution Risk
    body: >-
      At the time of the $400 million Series F in September 2025, the Judi medical claims
      platform had approximately 40,000 lives—less than 1% of the PBM base. The migration
      of Prime Therapeutics' 50+ million lives and the broader expansion of unified medical
      administration remain unproven at scale. Separately, the absence of publicly confirmed
      SOC 2 Type II or ISO 27001 certifications, combined with active hiring for a Cloud
      Security Director in 2026, leaves enterprise buyers without independent security
      assurance commensurate with PHI exposure at this scale.
    claimRefs:
      - CE041
      - CE042
      - CE009
      - CE039

  - calloutType: insight
    title: Prime Therapeutics Migration Is Both Validation and Concentration Risk
    body: >-
      Prime Therapeutics' exclusive use of the Judi EHP for 50+ million members is the
      platform's single largest external validation and its largest technical concentration
      risk simultaneously. Successful migration would demonstrate the platform's enterprise
      scalability; a material delay or failure would threaten a substantial portion of planned
      SaaS revenue and damage the reference case for future health plan licensees.
    claimRefs:
      - CE009
      - CE010
      - CE036

  - calloutType: recommendation
    title: Diligence Must Confirm Security Certifications and Medical Claims Scale
    body: >-
      Prospective investors and partners should require Judi Health to produce a SOC 2 Type II
      audit report or equivalent, confirm the current live medical claims membership count and
      go-live timeline for Prime Therapeutics, and obtain the Judi Care AI algorithm validation
      documentation before finalizing risk assessments. These three items represent the largest
      non-public information gaps in the product and technology analysis.
    claimRefs:
      - CE039
      - CE041
      - CE042

