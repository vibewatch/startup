      - ["Employer-sponsored program", "Undisclosed contract pricing", "Aon confirms subsidized employer benefit, not member list price", "No PMPM, minimums, or sponsor/member split disclosed", "Aon media room; Dealroom"]
      - ["Capitated model", "Undisclosed fixed amount per covered member", "Only the model is described publicly", "No risk corridor, medical-loss, or utilization assumptions disclosed", "FierceHealthcare; Futurism Today"]
      - ["Brand-name medication pathway", "Medication reimbursement plus care model undisclosed", "No public realized take rate", "Insurance approval rate, member copay, and eMed economics undisclosed", "Yahoo Finance; Telehealth Ally"]
    notes: "This table separates public list pricing and model descriptions from undisclosed realized economics."
    claimRefs: ["CI002", "CI006", "CI007", "CI008"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      - "Metric"
      - "Value/null"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Aon launch registrations", ">1,200 in first six months", "High", "Shows at least one enterprise cohort reached meaningful early scale", "Request cohort size denominator, eligible lives, and activation funnel"]
      - ["Aon launch retention", "95% in first six months", "High", "Retention is the core commercial promise behind capitation and employer ROI", "Validate methodology, cohort definition, and persistence beyond six months"]
      - ["Cash-pay list price", "$249 per month all-in", "Medium", "Sets a visible ARPU anchor and ceiling for self-pay monetization", "Break out medication, clinician, coaching, device, and support costs"]
      - ["Enterprise sales motion", "Formal RFPs, PBM/pharmacy integration, guarantees, and implementation work", "Medium", "Implies longer cycles and higher pre-sales/service cost than app-only telehealth", "Provide win rate, cycle length, and implementation labor by client size"]
      - ["Gross margin / contribution margin", null, "Low", "Needed to judge whether list pricing or capitation can support durable profitability", "Provide margin by product, medication type, and channel"]
      - ["Burn / runway / current cash", null, "Low", "Determines financing dependency even after the 2026 raise", "Provide monthly burn, cash balance, debt, and covenant schedule"]
      - ["Customer concentration / renewal", null, "Low", "Aon is a strong proof point, but public evidence does not show portfolio diversification", "Provide top-customer ACV mix, logo retention, and NRR"]
    notes: "Null values mark underwriting gaps, not zeros; the public record offers proxy outcomes but not operating-cost or retention-cohort detail."
    claimRefs: ["CI004", "CI005", "CI006", "CI009", "CI010", "CI016"]
