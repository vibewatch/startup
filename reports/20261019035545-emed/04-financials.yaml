company:
  name: "eMed"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a mixed monetization model spanning employer contracts, a newer capitated-risk offering, and a $249 per month cash-pay program, but it does not disclose realized pricing, revenue, margin, or burn. The March 2026 $200 million raise and Aon's strategic distribution role reduce immediate financing pressure, yet underwriting still depends on non-public customer economics, pharmacy sourcing, and runway data."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue model and monetization"
    body: >-
      eMed's revenue story is not a pure direct-to-consumer telehealth subscription. Dealroom
      describes the company as serving employers and government payers through subscription-based,
      capitated contracts and population-health services, while multiple 2026 sources show the
      company still maintains a cash-pay consumer entry point. Telehealth Ally reports a $249 per
      month all-in program including compounded semaglutide, physician visits, coaching, and a
      smart scale, and the Novo Nordisk release shows eMed also monetizes access and care around
      brand-name GLP-1s such as Wegovy pill. That mix implies multiple revenue paths, but public
      evidence still separates list pricing from realized economics: no retained source discloses
      employer PMPM levels, take rates on branded medication pathways, discounting, or contribution
      margins by channel.
    claimRefs: ["CI003", "CI006", "CI007", "CI008", "CI016"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "gtm-and-unit-economics-proxies"
    title: "GTM and unit-economics proxies"
    body: >-
      Public GTM evidence points to an enterprise, services-heavy sales motion rather than a low-
      touch app-only funnel. The Simplify job posting shows eMed running formal RFP, RFI, and
      consultant-evaluation processes for self-funded employers and coordinating pricing exhibits,
      ROI models, performance guarantees, and financial commitments across Finance, Clinical,
      Product, Legal, and Operations. Aon's strategic investment and its own workforce deployment
      reinforce that orientation: the partner says more than 1,200 people registered in the first
      six months of its subsidized program, with average weight loss of 22.4 pounds and retention
      of 95 percent. Those are useful commercial proof points, but they are still partner-owned
      pilot metrics rather than audited portfolio-level unit economics. Public sources do not
      disclose cycle length, CAC, payback, gross margin by medication type, or implementation cost.
    claimRefs: ["CI004", "CI005", "CI009", "CI010", "CI011", "CI012"]
    tableRefs: ["TI003"]
  - id: "capital-needs-and-underwriting-blockers"
    title: "Capital needs and underwriting blockers"
    body: >-
      The March 2026 financing gives eMed strategic room to keep funding platform buildout and a
      new capitated employer model, so there is no clear near-term distress signal in retained
      public evidence. Even so, the same evidence set is not enough to underwrite capital adequacy.
      Dealroom publishes only broad valuation, funding, and headcount bands, while the review and
      press coverage do not disclose revenue, ARR, gross margin, cash balance, monthly burn, debt,
      or customer concentration. The most important disconfirming evidence is methodological rather
      than legal: Telehealth Ally argues that eMed's headline 90 percent plus adherence claim lacks
      published methodology, peer review, and 12-month GLP-1 outcomes, and it also notes that the
      company has not publicly identified its compounding pharmacy partners. The investment case can
      support further diligence, but not a public-data-only underwriting decision.
    claimRefs: ["CI001", "CI002", "CI013", "CI014", "CI015", "CI016"]
