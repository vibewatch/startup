    claimRefs: ["CI003", "CI006", "CI007", "CI010", "CI011"]
callouts:
  - calloutType: "insight"
    title: "The economic story is enterprise-first"
    body: "The public record points to an employer distribution model with procurement, reporting, and guarantee obligations, while cash-pay pricing looks more like an acquisition or fallback path than the sole business model."
    claimRefs: ["CI003", "CI006", "CI009", "CI010", "CI011"]
  - calloutType: "risk"
    title: "Outcomes are more visible than economics"
    body: "Aon's pilot metrics and the company's funding are easier to verify than revenue, gross margin, burn, or contract pricing, so the strongest public proof today is demand and retention rather than fully underwritten unit economics."
    claimRefs: ["CI004", "CI005", "CI013", "CI016"]
