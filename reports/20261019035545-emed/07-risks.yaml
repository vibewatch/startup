company:
  name: eMed
chapter:
  number: 7
  title: Risks
  summary: >-
    eMed's highest current risks are evidence-quality and regulatory-transparency risks, not a lack of commercial narrative. The assigned pool supports real partner traction with Novo Nordisk and Aon, but long-duration adherence proof, pharmacy sourcing transparency, and precise financial underwriting data remain too thin to treat residual exposure as low.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture
    body: >-
      The assigned evidence supports a clear ranking: the most important risk is that eMed's value proposition depends on outcomes claims that are still only directionally substantiated in public materials. The company and its partners present strong commercial momentum, but the independent review in the pool directly challenges whether the headline 90%+ adherence figure is measured with a standard clinical definition or over a mature enough time horizon to underwrite retention and ROI claims. Public underwriting is further constrained because the available financial disclosure remains range-based rather than precise, so residual severity stays high until independent outcomes, pharmacy controls, and unit economics are diligenced directly.
    claimRefs: [CR005, CR006, CR007, CR011, CR015]
    figureRefs: [FR001]
  - id: regulatory-and-evidence-risk
    title: Regulatory and evidence-quality risk
    body: >-
      eMed's public materials show a real clinician-supervised care pathway and real medication-access partnerships, but the same sources stop short of proving that the program's most important clinical and regulatory claims are durable. The company says prescriptions require a licensed clinician and that not all people are eligible, which is directionally reassuring, yet the assigned pool does not disclose pharmacy counterparties, 503A versus 503B status, or a standardized method for the 90%+ adherence claim. Because the GLP-1 category is already under scrutiny for compounding and patient-retention quality, the main legal and regulatory risk is not a known enforcement action in the pool but the gap between aggressive commercial claims and still-limited disclosed control evidence.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007]
    tableRefs: [TR001]
  - id: operational-and-partner-dependencies
    title: Operational and partner dependencies
    body: >-
      Operationally, eMed is pitching a high-touch care model that combines prescribing, medication sourcing, monitoring devices, coaching, and biomarker tracking, which makes execution risk inherently multi-step. The model may improve engagement, but the independent review notes that connected devices measure engagement proxies such as weight and glucose data rather than directly confirming that medication was taken, so the operating stack can still overstate adherence quality if the measurement framework is loose. At the same time, current proof points are concentrated in a small set of commercially important relationships, especially Aon as both investor and flagship employer case study and Novo Nordisk as a medication-access enabler, which leaves eMed exposed if partner performance, access terms, or expansion economics deteriorate before broader third-party proof appears.
    claimRefs: [CR001, CR008, CR009, CR010, CR013, CR014]
    tableRefs: [TR002, TR003]
  - id: kill-criteria-and-diligence-path
    title: Kill criteria and diligence path
    body: >-
      The practical kill criteria are measurable. If management cannot provide standardized adherence methodology, cohort-level 12-month outcomes, named pharmacy partners with clear regulatory status, and precise revenue, burn, gross-margin, and concentration data, the risk should remain high and the underwriting case should not advance on public marketing evidence alone. Conversely, the most credible mitigation path is also concrete: show independent longitudinal outcomes, disclose drug-supply and clinical-governance controls, and demonstrate that the capitated employer model remains profitable even if adherence weakens or partner concentration rises. Until those checks are satisfied, the correct posture is to treat current partner traction as encouraging but insufficient.
    claimRefs: [CR011, CR012, CR014, CR015]
