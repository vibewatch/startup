    claimRefs: [CR005, CR007, CR010, CR011, CR014, CR015]
callouts:
  - calloutType: risk
    title: "The main risk is evidence quality, not narrative scarcity"
    body: >-
      eMed has enough public momentum to tell a strong story, but the independent review in the assigned pool directly questions whether the flagship adherence claim is comparable, mature, and independently substantiated.
    claimRefs: [CR004, CR005, CR006, CR013]
  - calloutType: recommendation
    title: "Treat pharmacy, outcomes, and unit economics as hard diligence gates"
    body: >-
      If management cannot produce named supply-chain controls, standardized longitudinal outcomes, and precise cohort economics, the residual risk remains too high for a clean underwriting case.
    claimRefs: [CR007, CR011, CR012, CR015]
