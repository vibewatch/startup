  topStrengths:
    - Clear employer-focused GLP-1 positioning with enterprise distribution and reporting hooks
    - Strategic backing and partnership signals from Aon and Novo Nordisk improve commercial credibility
    - Public product and sales materials show a coherent enterprise workflow rather than a thin consumer app
  topRisks:
    - Revenue, gross margin, burn, and runway are still not publicly disclosed
    - Customer concentration and repeatability beyond the marquee proof points remain unclear
    - Independent validation of adherence and outcomes claims is still weak
    - Governance, cap table, and investor-rights transparency remain limited
  unresolvedGaps:
    - Current revenue, ARR, burn, gross margin, and runway are not publicly disclosed
    - Customer concentration outside Aon and the true scale of paying employer accounts remain unclear
    - Public evidence does not adequately validate eMed's claimed adherence and outcomes methodology
    - Board composition, investor rights, and full cap-table structure are not visible in public materials
    - The technical and regulatory status of eMed's AI layer remains opaque despite heavy branding emphasis
