    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - [Recommendation, research-more, "Proceed only if private diligence can verify operating economics and round terms."]
      - [Confidence, medium, "Public evidence is directionally useful but still thin on financial proof."]
      - [Risk rating, high, "Outcome, concentration, and capitalization opacity can still force pricing resets."]
      - [Valuation stance, stretched, "The >$2B mark is visible; the supporting operating evidence is not."]
      - ["Entry discipline", "Do not match the last mark on public evidence alone", "Require live metrics, structure detail, and concentration analysis first."]
    notes: Public evidence establishes the financing mark but not the operating denominators needed to validate it; recommendation is therefore explicitly price-sensitive.
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV013
      - CV015
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - ["Aon's investment and internal deployment suggest employer demand is real, not hypothetical.", "Upgrade only if similar outcomes are shown across multiple non-anchor employers."]
      - ["Novo access and employer-focused commercialization infrastructure improve distribution credibility.", "Upgrade only if these channels convert into disclosed recurring revenue and durable customer retention."]
      - ["The anti-thesis is that public proof is still mostly partner or company controlled and long-term adherence remains unverified.", "Downgrade further if management cannot show standardized outcome definitions, cohort duration, and independent validation."]
      - ["The current valuation could still work if eMed is building a defensible capitated platform with strong gross margins and low concentration.", "Hold the line until management discloses contract economics, margin profile, and cap-table overhang."]
    notes: This table weighs strategic momentum against evidence quality; the key question is not whether demand exists, but whether enough validated economics exist to support the last price.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV007
      - CV010
      - CV012
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Aon-like employer wins repeat, Novo-linked access broadens intake, and disclosed revenue retention plus margin data prove the company can scale a capital-efficient employer model.", "Paying or growing into the last >$2B mark becomes plausible only if disclosed enterprise metrics look closer to a durable population-health platform than a marketing-led telehealth program.", "Anchor-account concentration or adverse cap-table terms could still dilute upside.", "Would improve materially if management opens the data room on revenue quality, cohort retention, and round structure."]
      - ["Base", "Strategic momentum continues, but public proof remains concentrated in funding coverage, partner releases, and company claims.", "The company stays worth tracking, but entry discipline should remain inside or below the last mark until live diligence validates economics.", "Investors risk paying for narrative before unit economics are visible.", "Most likely while public evidence remains range-based and non-audited."]
      - ["Bear", "Long-term adherence validation does not materialize, premium pricing faces pushback, or capitated-risk economics consume more balance sheet than expected.", "A flat or down round becomes plausible because the current mark lacks public revenue and margin support.", "A later financing could reprice risk through lower valuation, preferences, or both.", "Probability rises if management cannot evidence diversified employer adoption and standardized outcome reporting."]
    notes: Scenario logic is deliberately qualitative because public evidence does not disclose revenue, ARR, gross margin, or round preferences; each case states what evidence would be needed to tighten valuation ranges.
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
