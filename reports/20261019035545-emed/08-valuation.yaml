  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-and-margins
      missingEvidence: Exact revenue, gross margin, burn, and cohort payback by employer account.
      whyItMatters: These are the core denominators needed to test whether the >$2B mark reflects operating quality or only strategic narrative.
      diligencePath: Request board or management reporting for revenue, gross margin, burn, and payback segmented by employer cohort.
      relatedQuestionRefs:
        - QV001
        - QV008
    - type: private-evidence-only
      severity: material
      topic: round-structure
      missingEvidence: Liquidation preferences, anti-dilution protection, option-pool expansion, and other economic terms from the last financing.
      whyItMatters: A headline valuation can still produce weak common-equity outcomes if structure is heavy.
      diligencePath: Review the latest financing documents, cap table, and investor rights summary before underwriting exit value.
      relatedQuestionRefs:
        - QV001
        - QV008
    - type: missing-source
      severity: material
      topic: independent-outcomes-validation
      missingEvidence: Independent or peer-reviewed validation of eMed's adherence and biomarker claims across a meaningful follow-up period.
      whyItMatters: The current public bull case depends heavily on claims that would materially affect pricing power and retention if they are real.
      diligencePath: Ask for methodology, cohort definitions, external validation, and at least 12-month retention and outcomes data.
      relatedQuestionRefs:
        - QV004
        - QV007
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Named employer count, revenue concentration, renewal rates, and the share of growth tied to anchor partners such as Aon.
      whyItMatters: Valuation quality is materially weaker if current traction depends on one or two strategic channels.
      diligencePath: Review cohort, pipeline, and renewal data by employer account and strategic partner.
      relatedQuestionRefs:
        - QV003
        - QV008
