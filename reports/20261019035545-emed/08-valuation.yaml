company:
  name: eMed
chapter:
  number: 8
  title: Valuation
  summary: eMed has credible strategic momentum around employer GLP-1 cost management, but the March 2026 $200 million financing at a valuation above $2 billion is not well supported by public operating data. Public evidence supports a research-more recommendation, medium confidence, high risk, and a stretched valuation stance until management discloses revenue scale, cohort economics, concentration, and round terms.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The public record supports a research-more call rather than a buy. Three
      separate March 2026 news reports corroborate a $200 million Series A at
      a valuation above $2 billion, but the same public package still lacks the
      revenue, gross margin, burn, customer concentration, and preference-stack
      detail needed to decide whether that mark is justified by operating
      performance instead of narrative momentum. The clearest independent
      challenge comes from Telehealth Ally, which says eMed launched its GLP-1
      program in early 2026, cannot yet show 12-month adherence data, and is
      charging a premium monthly price while its headline adherence claim
      remains methodologically unverified. That combination makes the company
      interesting, but the current price point evidence-light.
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV010
      - CV013
      - CV015
    tableRefs:
      - TV001
  - id: what-supports-the-bull-case
    title: What supports the bull case
    body: >-
      The reason eMed remains investable is that the company appears to have
      assembled strategic proof points that matter in employer health: a large
      financing round, an anchor relationship with Aon, a Novo-linked access
      channel for oral Wegovy, and organizational evidence that enterprise
      procurement, pricing, and performance guarantees are becoming core
      operating muscles. Aon's August 2025 release is more useful than generic
      marketing because it ties its investment to an internal deployment with
      more than 1,200 registrants, 95 percent retention, and 22.4 pounds of
      average weight loss in six months. Those signals do not prove broad
      repeatability, but they do suggest eMed is solving a real employer pain
      point rather than just chasing consumer GLP-1 traffic.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV012
      - CV014
    tableRefs:
      - TV002
  - id: scenario-boundaries-and-final-diligence
    title: Scenario boundaries and final diligence
    body: >-
      The valuation debate turns on whether partner-backed early traction can
      convert into independently verifiable, diversified enterprise economics.
      In the bull case, the Aon-style employer motion generalizes, Novo access
      expands enrollment, and management can show revenue quality plus retention
      data that lets investors grow into or above the last mark. In the base
      case, the company continues to attract strategic attention but public
      evidence stays dominated by company, partner, and funding-announcement
      materials, so investors should insist on live diligence before matching
      the last valuation. In the bear case, long-term outcomes validation
      remains missing, capitated-risk economics prove thinner than expected,
      and a later round has to reset price or structure. The immediate
      diligence asks are exact revenue and margin disclosure, employer-account
      concentration, payback by cohort, and the round's liquidation and
      anti-dilution terms.
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
    tableRefs:
      - TV003
    figureRefs:
      - FV001
tables:
