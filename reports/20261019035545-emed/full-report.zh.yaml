chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              公司公开材料一贯将 eMed 定位为面向雇主的 GLP-1
              人群健康平台，而非泛化的远程医疗应用。官网和雇主页面都描述了一个串联诊断、临床监管、药物获取和持续依从性支持的模式，同时允许雇主控制缴费和使用设计。这一定位对后续章节很重要：它意味着 eMed
              卖给福利采购方的是一套受管理的成本与结果方案，而不只是处方履约服务。同一批材料也展示了公司最显眼的运营主张，包括直供定价和内部产出的结果，但这些主张大多仍是管理层口径，尚未有独立基准验证。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO014
