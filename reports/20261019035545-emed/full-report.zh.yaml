            - 全天候依从性辅导
            - 每周临床复诊
            - 行为健康支持合作伙伴
          outputs:
            - 副作用与参与支持
            - 更有可能持续参与
        - label: 依从性分析与集成
          detail: 监测和企业报告把会员端与资助方端连成一体。
          modules:
            - 智能秤与可选 CGM 信号
            - 去标识化雇主仪表盘
            - PBM 及 HR 或福利集成
          outputs:
            - 早期干预信号
            - 资助方对使用情况和结果的可见性
        - label: 企业治理与采购
          detail: 雇主销售和上线需要证据、控制措施，以及多团队协同回复。
          modules:
            - 安全与合规审查
            - 绩效保证与定价回复
            - 实施与客户成功协同
          outputs:
            - 可用于采购的文件
            - 雇主上线审批
    approximationNotes: 分层反映公开工作流描述中的顺序和分组，不代表已披露的内部系统图或 API 图谱。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: eMed 的公开客户闭环从雇主销售开始，经过会员筛查、指导式照护和雇主报告，最后通过渠道扩张。
    data:
      items:
        - label: 雇主 / 付款方评估
          stage: 售前
          actor: 福利、HR、付款方或顾问买方
          touchpoints:
            - 雇主价值主张聚焦使用控制、缴费设计和结果保证
            - RFP 和照护成本评估似乎是销售流程的正式组成部分
          tone: positive
        - label: 会员筛查与注册
          stage: 上线
          actor: 员工或会员
          touchpoints:
            - 居家筛查套件和临床审核共同决定资格
            - 个人渠道确实存在，但公开证据将其定位为次于雇主使用的渠道
          tone: neutral
        - label: 临床医生指导下的处方
          stage: 激活
          actor: 持证临床医生及药房 / 用药可及性合作伙伴
          touchpoints:
            - 项目将处方与结构化用药可及性结合起来
            - NovoCare 的认可支持品牌 Wegovy 药片的可及性
          tone: neutral
        - label: 依从性辅导与监测
          stage: 使用中
          actor: 会员与 eMed 照护团队
          touchpoints:
            - 全天候辅导、生物标志物跟踪和进展监测是留存的核心杠杆
            - 主要的依从性证据仍大多由公司掌握
          tone: positive
        - label: 雇主报告与 ROI 复盘
          stage: 客户管理
          actor: 雇主资助方
          touchpoints:
            - Aon 案例和 AP3 条目都强调雇主可见的结果
            - 公开材料仍未披露多账户续约和客户集中度细节
          tone: risk
        - label: 通过渠道和重复采购扩张
          stage: 扩张
          actor: 渠道合作伙伴、经纪人或顾问
          touchpoints:
            - AP3 条目和 RFP 招聘信息都指向医疗保健—雇主渠道扩张
            - 在 Aon 之外的覆盖广度，公开证据仍披露不足
          tone: risk
    claimRefs:
      - CU001
      - CU007
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: eMed 的公开叙事越依赖未经验证的长期结果、缺乏透明度的供应控制或集中于少数合作伙伴的证据，剩余风险严重度就越高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余暴露
      rows:
        - label: 结果证据 / 依从性主张
          values:
            - label: 高
              tone: risk
              detail: 方法论和时间跨度仍存在争议。
            - label: 高
              tone: risk
              detail: 雇主 ROI 和留存主张都依赖这项证据。
            - label: 低
              tone: warning
              detail: 当前公开缓释措施大多只是方向性的。
            - label: 高
              tone: risk
              detail: 独立的 12 个月数据仍然缺失。
        - label: 复配药 / 供应透明度
          values:
            - label: 中
              tone: warning
              detail: 公开来源没有列出药房合作伙伴。
            - label: 高
              tone: risk
              detail: 控制失效可能影响照护质量和信任。
            - label: 低
              tone: warning
              detail: 临床医生筛查有所帮助，但供应控制未披露。
            - label: 高
              tone: risk
              detail: 在核实交易对手之前，剩余风险仍维持高位。
        - label: Aon 集中度
          values:
            - label: 中
              tone: warning
              detail: Aon 既是投资方，也是旗舰证据点。
            - label: 高
              tone: risk
              detail: 如果案例研究停滞，商业叙事会减弱。
            - label: 中
              tone: neutral
              detail: 有真实运营数据，但只来自一个锚定账户。
            - label: 高
              tone: risk
              detail: 更广泛的雇主证据在现有来源池中仍然有限。
        - label: Novo Nordisk 可及性依赖
          values:
            - label: 中
              tone: warning
              detail: 这一认可很有价值，但还不足以构成完整护城河。
            - label: 中
              tone: warning
              detail: 如果条款发生变化，可及性和可信度可能收窄。
            - label: 中
              tone: neutral
              detail: 这段关系提供了外部验证。
            - label: 中
              tone: warning
              detail: 剩余暴露有实质意义，但单独看还不足以推翻投资论点。
        - label: 财务评估透明度
          values:
            - label: 高
              tone: risk
              detail: 公开数据仍是区间估算，而非精确数据。
            - label: 高
              tone: risk
              detail: 按人头计费合同可能放大利润率和现金流判断错误。
            - label: 低
              tone: warning
              detail: 纳入的证据没有显示经审计的运营指标。
            - label: 高
              tone: risk
              detail: 没有私有数据室证据，剩余暴露仍会维持高位。
        - label: 牌照 / 资格控制
          values:
            - label: 中
              tone: warning
              detail: 存在临床医生审核，但逐州结构未披露。
            - label: 中
              tone: warning
              detail: 控制缺口可能拖慢增长或触发合规成本。
            - label: 中
              tone: neutral
              detail: 公司材料明确提到资格筛查。
            - label: 中
              tone: warning
              detail: 在核实牌照和实体之前，剩余暴露仍会持续。
    approximationNotes: 这是基于来源支撑的序数风险排序热力图；单元格总结的是已披露证据质量，而不是统计概率。
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR011
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略验证已经存在，但持久经济模型和独立结果的证据缺口，让建议仍只能是继续研究。
    data:
      nodes:
        - label: 雇主痛点确实存在
          summary: News coverage frames GLP-1 cost control as a live employer problem.
        - label: eMed 按溢价估值融资
          summary: $200M Series A and >$2B valuation create a high bar for proof.
        - label: 战略渠道真实存在
          summary: Aon investment, Novo access, and enterprise RFP build-out support go-to-market credibility.
        - label: 结果证据仍然薄弱
          summary: Adherence and biomarker claims are mostly company or partner reported.
        - label: 经济模型仍不透明
          summary: Public sources still do not disclose revenue, margins, concentration, or round structure.
        - label: 建议维持继续研究
          summary: Do not underwrite the last mark until diligence closes the evidence gaps.
      edges:
        - from: Employer pain point exists
          to: eMed raised at a premium mark
          label: 支撑需求叙事
        - from: eMed raised at a premium mark
          to: Strategic channels are real
          label: 需要商业证明
        - from: Strategic channels are real
          to: Outcome proof is still thin
          label: 被证据质量抵消
        - from: Outcome proof is still thin
          to: Economics remain opaque
          label: 加重尽调负担
        - from: Economics remain opaque
          to: Recommendation stays research-more
          label: 阻碍投资评估
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV010
      - CV013
      - CV015
