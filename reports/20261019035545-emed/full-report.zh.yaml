        title: 展示材料
        blocks:
          - type: callout
            title: 这首先是一笔企业福利销售，其次才是消费者远程医疗结账
            body: 招聘、合作伙伴和公司资料反复呈现的买方模式，是由顾问、RFP、福利整合和 ROI 论证塑造的自费雇主销售，而不是简单的直达消费者获客漏斗。
