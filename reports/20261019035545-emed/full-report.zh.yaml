        title: 展示材料
        blocks:
          - type: callout
            title: 最清晰的差异化在于适配雇主采购
            body: 留存证据中最站得住脚的优势，不是更便宜的药物或独家获取，而是面向雇主的实施能力：PBM 整合、报告、RFP 准备度和合作伙伴分销。
            calloutType: strength
            claimRefs:
