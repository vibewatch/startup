  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方经济
        blocks:
          - type: paragraph
            body: >-
              当前证据将 eMed 放在雇主赞助的 GLP-1 人群健康市场，而不是宽泛、无差别的远程医疗市场。eMed
              自己的招聘话术称，公司正在赢得那些面临两位数成本上涨、需要有效方案的雇主；合作伙伴和数据库资料则描述了一个整合诊断、临床监管、药物获取、依从性支持和雇主报告的打包模式。这里的经济关系很关键：付费买方通常是自费雇主或其顾问，终端用户是参保成员，付款方是雇主的健康计划预算，而不是一次性购买的消费者。现金付费远程医疗仍是邻近市场和替代方案，但企业销售依赖采购、福利整合和经济性论证。
