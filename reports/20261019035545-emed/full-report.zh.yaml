  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 什么情况会改变判断
    rows:
      - - Aon 的投资和内部部署表明，雇主需求是真实存在的，而非假设。
        - 只有在多个非锚定雇主中看到类似结果，才上调判断。
      - - Novo 的准入和面向雇主的商业化基础设施提升了分销可信度。
        - 只有这些渠道转化为已披露的经常性收入和持久客户留存，才上调判断。
      - - 反论点是，公开证明仍主要由合作伙伴或公司控制，长期依从性也尚未得到验证。
        - 如果管理层无法展示标准化结果定义、队列持续时间和独立验证，则进一步下调判断。
      - - 如果 eMed 正在打造一个具备防御性的按人头付费平台，并且毛利率强劲、集中度较低，当前估值仍可能成立。
        - 在管理层披露合同经济性、利润率结构和股权结构表悬置之前，维持谨慎立场。
    notes: 该表在战略势头和证据质量之间进行权衡；关键问题不是需求是否存在，而是经验证的经济性是否足以支撑上一轮价格。
