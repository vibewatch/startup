  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              留存证据指向的是广泛竞争集合，而不是单一远程医疗同业名单。Venture Tech Chronicle 将 eMed 视为更大 GLP-1 市场中的一种模式，该市场还包括 Ro、Hims & Hers
              Health、LifeMD 等全国性消费者远程医疗平台；低门槛现金付费和复配 GLP-1 项目；以及实体减重或基层医疗诊所。Dealroom 和 AP3 对 eMed 的定位不同于这些直销消费者选项：eMed
              面向雇主和政府付款方，提供人群健康报告与福利整合，而非一次性处方。买方可以通过多种渠道满足同一需求；eMed 最直接的竞争对手，是那些能把药物获取与适用于雇主采购的工作流结合起来的服务商。
