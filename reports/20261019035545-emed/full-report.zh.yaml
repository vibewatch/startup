              头部依从性数字是否按标准临床定义衡量，或时间跨度是否足够成熟，足以支撑留存和 ROI
              主张。由于现有财务披露仍是区间而非精确数值，公开投资判断也受到进一步限制；在独立结果、药房控制和单位经济完成尽调前，剩余风险严重度仍高。
