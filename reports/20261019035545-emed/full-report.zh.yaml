              个月结果、监管状态清晰的具名药房合作伙伴，以及精确的收入、烧钱、毛利率和集中度数据，风险就应维持高位，投资判断不应仅凭公开营销证据推进。反过来，最可信的缓释路径也很具体：展示独立纵向结果，披露药物供应和临床治理控制，并证明即使依从性走弱或合作伙伴集中度上升，按人头计费的雇主模式仍能盈利。在这些核查完成前，正确姿态是把当前合作伙伴
