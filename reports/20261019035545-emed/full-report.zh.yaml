      - number: '3.2'
        title: 能力、监管姿态与信任信号
        blocks:
          - type: paragraph
            body: >-
              留存证据显示，eMed 最强的能力差异并非独家药物获取，而是围绕处方建立结构化监测。GLP-1 Reviews 和 Telehealth Ally 都描述了居家检测、连接设备、教练辅导和临床随访等额外流程，AP3
              则描述了面向雇主买方的报告、PBM 整合和依从性支持。eMed 在 Novo Nordisk 公告中也强调品牌药和临床指导定位，这与 Venture Tech Chronicle
              所说的部分低门槛竞争者依赖面临更多监管审查的复配药物形成对比。即便如此，公开信任证据仍不完整：Telehealth Ally 称 eMed
              的头部依从性主张缺少同行评审方法学，因此信任更多依赖护理设计和合作伙伴背书，而非独立的长期结果。
            claimRefs:
              - CP010
              - CP011
              - CP013
              - CP014
