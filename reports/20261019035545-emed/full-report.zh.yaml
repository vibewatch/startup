      - number: '2.3'
        title: 驱动因素、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              材料中最强的采用驱动因素，是雇主成本压力、对低接触 GLP-1 获取模式更高依从性的需求，以及降低报销、药品目录获取和项目报告摩擦的合作伙伴整合。同一批证据也定义了约束。Telehealth Ally
              明确认为，在公司公布方法学和更长期结果前，eMed 的 90%+ 依从性主张应视为营销；公开来源也没有披露稳健的市场规模方法、雇主队列构成或按细分独立审计的
              ROI。实际而言，市场故事足以支持继续尽调，但还不够具体，无法在缺少客户数、福利设计和实际节省额等私有数据时评估渗透率、定价权或扩张假设。
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
