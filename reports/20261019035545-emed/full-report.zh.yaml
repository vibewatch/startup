      - number: '1.3'
        title: 资本形成、合作伙伴与里程碑质量
        blocks:
          - type: paragraph
            body: >-
              分配材料中最有外部支持的里程碑，是 2025 年 8 月 Aon 的战略投资公告、2026 年 1 月与口服 Wegovy 获取相关的 NovoCare 认可，以及 MobiHealthNews 报道的 2026
              年 3 月融资。它们共同支持这样一种判断：eMed 在 2025—2026 年从雇主试点进展进入资本更充足的扩张阶段。不过，资本叙事比经营披露干净得多：Aon 报告的员工结果来自单一灯塔项目，而
              Telehealth Ally 明确指出，eMed 的依从性头部主张缺少公开方法学和长期验证。公司虽有可信的战略支持和融资势头，但客户集中度、结果可复现性以及股权结构表背后的实际控制安排仍存在明显尽调缺口。
