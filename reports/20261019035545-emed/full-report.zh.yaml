            title: 公开证明仍落后于营销叙事
            body: 第三方评论保留了相互冲突的公开定价叙事，并质疑 eMed 90%+ 依从性故事是否经过独立验证，这给现有企业或记录更充分的同业留下了挑战信任的空间。
            calloutType: risk
            claimRefs:
