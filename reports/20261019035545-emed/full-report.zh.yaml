            body: >-
              2026 年 3 月融资给了 eMed 继续投入平台建设和新按人头计费雇主模式的战略空间，因此留存公开证据中没有明确的近期困境信号。不过，同一证据集还不足以评估资本充足性。Dealroom
              只公布宽泛的估值、融资和员工数区间，评论及新闻报道也未披露收入、ARR、毛利率、现金余额、月度烧钱、债务或客户集中度。最重要的反证来自方法学，而非法律问题：Telehealth Ally 认为 eMed 90%+
