  - id: TV003
    title: 看涨 / 基准 / 看跌情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 看涨
        - 类似 Aon 的雇主客户持续复购，Novo 关联的准入扩大流量入口，披露的收入留存和利润率数据证明公司能够扩张资本效率高的雇主模式。
        - 只有当披露的企业指标更接近持久的人群健康平台，而不是营销驱动的远程医疗项目时，支付或增长到上一轮 >$2B 估值才变得合理。
        - 锚定账户集中度或股权结构表中的不利条款仍可能稀释上行空间。
        - 如果管理层开放数据室，提供收入质量、队列留存和本轮结构信息，判断将显著改善。
      - - 基准
        - 战略势头仍在延续，但公开证据主要集中于融资报道、合作伙伴发布和公司自述。
        - 公司仍值得跟踪，但在实时尽调验证经济模型之前，入场纪律应控制在上一轮估值以内或更低。
        - 投资者可能在单位经济尚未清晰前，就先为叙事买单。
        - 只要公开证据仍停留在区间估算且未经审计，这种情况就最可能发生。
      - - 熊市情景
        - 长期依从性验证迟迟没有结果、溢价定价遭遇阻力，或按人头计费的风险经济学比预期更严重地消耗资产负债表。
        - 由于当前估值缺乏公开收入和利润率支撑，融资平轮或下轮融资都可能出现。
        - 后续融资可能通过更低估值、优先权条款，或两者并用，重新定价风险。
        - 如果管理层无法证明雇主客户采用足够多元，且结果报告已经标准化，概率会进一步上升。
    notes: 由于公开证据没有披露收入、ARR、毛利率或本轮融资优先权条款，情景逻辑刻意保持定性；每种情景都说明了需要哪些证据才能收窄估值区间。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
