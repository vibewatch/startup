      - number: '3.3'
        title: 定价、包装与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              定价具竞争力，但披露并不清晰。Telehealth Ally 将 eMed 描述为每月 $249 的全包项目，包含药物、教练、监测和医生问诊；现金价格高于 Ro 和 Henry Meds，但低于
              Calibrate 将项目与药物分开的结构。GLP-1 Reviews 的实测则看到另一种公开套餐：$49 的不可退款筛查包获批后，再分别收取会员、药物和配送费用。这种不一致本身就有竞争意义，因为买方把 eMed
              与更简单的现金付费同业比较时，可能要先投入更多尽调，才能了解真实合同和成员经济性。Aon 的上线证据和 eMed 面向 RFP 的招聘信息也表明，切换不只是消费者偏好问题，而是要经过正式福利采购、实施和报告承诺。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
