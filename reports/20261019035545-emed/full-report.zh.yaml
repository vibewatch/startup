              - CP009
      - number: '3.4'
        title: 护城河持久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              按当前证据，eMed 的护城河更多来自运营和渠道，而非专有技术。重视依从性管理、结果报告和 PBM 协同的雇主，可能更偏好 eMed 而不是低接触远程医疗供应商；Aon
              的部署也显示，该模式至少能赢下一家成熟雇主客户。但同一证据也限制了护城河主张。公开评论者仍质疑 eMed 的依从性叙事是否经过独立验证，Calibrate
              等成熟选项和现有诊所网络则可凭借信任、保险导航或既有患者关系竞争。如果结构化 GLP-1 管理在保险机构、PBM 和大型远程医疗品牌间标准化，除非 eMed
              把合作伙伴分销和报告能力转化为更难复制的雇主结果，否则优势可能收窄。
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
