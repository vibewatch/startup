      - number: '1.2'
        title: 领导层、治理与商业拓展
        blocks:
          - type: paragraph
            body: >-
              公开领导层形象主要集中在 CEO Linda Yaccarino 和面向公众的健康形象人物 Tom Brady 身上，这既扩大了 eMed
              的品牌触达，也让外部叙事对关键人物的依赖更高。分配到的材料未清楚列出具名创始人、董事会构成或投资者权利，因此现有公开图景在品牌和 GTM 信号上强于治理透明度。一份当前的迈阿密 RFP
              策略招聘简报还显示，eMed 正围绕顾问评估、定价附件、担保和药房福利复杂度，搭建更企业化的雇主销售体系。这有利于商业成熟度，但仍只是间接运营信号，不能证明客户覆盖已经规模化。
            claimRefs:
              - CO008
              - CO015
