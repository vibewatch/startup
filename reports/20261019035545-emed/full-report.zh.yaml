              Wegovy pill 等品牌 GLP-1 变现药物获取与护理服务。这种组合意味着多条收入路径，但公开证据仍把标价与实际经济性分开：没有留存来源披露雇主 PMPM
              水平、品牌药路径的抽成率、折扣或各渠道贡献利润率。
