              获取渠道扩大注册，管理层也能展示收入质量和留存数据，让投资人逐步达到或超过上一轮估值。基准情景下，公司继续吸引战略关注，但公开证据仍由公司、合作伙伴和融资公告材料主导，因此投资人应在匹配上一轮估值前坚持进行现场尽调。悲观情景下，长期结果验证仍缺失，按人头计费的风险经济性比预期更薄，后续融资必须下调价格或重构条款。眼下应索取的资料包括精确收入和利润率、雇主账户集中度、按队列计算的回本期，以及本轮清算和反稀释条款。
