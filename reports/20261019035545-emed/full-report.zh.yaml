      - number: '2.2'
        title: 市场规模视角与采用信号
        blocks:
          - type: paragraph
            body: >-
              公开证据支持雇主确实存在真实问题，但无法构建严谨的 TAM、SAM、SOM 链条。来源提供了负担代理指标、定价信号、试点结果以及流量或规模线索：eMed 招聘文案提到慢性病支出压力，Dealroom
              将其描述为面向雇主和政府付款方的 B2B 按人头计费模式，Telehealth Ally 给出中端市场现金付费基准，Aon
              则披露了自有员工项目的注册、留存和减重结果。这些数据能说明购买意愿和采用曲线形态，但都没有提供严谨市场规模桥接所需的市场分母、按地理调整的患病基数或转化假设。因此，本章将市场视为受证据约束，并把规模视角与估值话术分开。
