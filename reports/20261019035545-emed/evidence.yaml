evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: Current revenue, ARR, burn, runway, gross margin, and exact customer-count disclosures.
    whyItMatters: These metrics anchor scale quality, valuation support, and financing durability.
    diligencePath: >-
      Request the current board deck or management accounts with revenue mix, cash burn, and customer concentration
      tables.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: Named founders, full executive roster, board composition, and committee structure.
    whyItMatters: >-
      Without a full leadership and board picture, founder-market fit and key-person concentration are hard to
      underwrite.
    diligencePath: Request an org chart, board list, and biographies for founders and executive leadership.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-rights
    missingEvidence: Cap table detail, lead investor identity, liquidation preferences, secondaries, and any debt or credit overlays.
    whyItMatters: Control, dilution, and downside economics cannot be judged from named participants alone.
    diligencePath: Request the latest cap table, financing documents, and investor-rights summary.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adherence-skepticism
    missingEvidence: >-
      Peer-reviewed or otherwise independently auditable methodology for eMed's adherence and biomarker claims over a
      meaningful time horizon.
    whyItMatters: Outcome claims are central to the investment story but currently depend mainly on company and partner framing.
    diligencePath: >-
      Request cohort definitions, measurement methodology, raw denominator tables, and any external validation or payer
      studies.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A geography-specific TAM, SAM, and SOM model with prevalence, employer-plan penetration, average covered lives,
      pricing assumptions, and explicit methodology.
    whyItMatters: >-
      Without a denominated market model, valuation and penetration assumptions rest on category enthusiasm and pilot
      anecdotes rather than a testable opportunity size.
    diligencePath: >-
      Request management's current market-sizing workbook and tie each layer to covered-lives assumptions, pricing
      inputs, and employer segment splits.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-validation
    missingEvidence: >-
      Independently reviewed employer ROI, savings methodology, and performance outcomes across multiple customer
      cohorts.
    whyItMatters: >-
      The market case depends on cost savings and adherence claims, but the retained sources do not show whether
      outcomes travel beyond one partner-reported pilot.
    diligencePath: >-
      Obtain cohort-level ROI studies, guarantee definitions, and renewal data by customer segment from eMed and at
      least one reference customer.
    relatedQuestionRefs:
      - QM005
      - QM007
  - type: missing-source
    severity: material
    topic: customer-count-scope
    missingEvidence: A current breakout of employer clients, covered lives, active GLP-1 members, and legacy diagnostic users.
    whyItMatters: >-
      The difference between cumulative historical users and active employer GLP-1 members affects both sizing
      credibility and sales-efficiency assumptions.
    diligencePath: >-
      Request a current customer waterfall by product line, channel, and paying account, plus definitions for
      registered, active, and retained members.
    relatedQuestionRefs:
      - QM004
      - QM008
  - type: stale
    severity: minor
    topic: pricing-comparability
    missingEvidence: >-
      Current enterprise pricing ranges, guarantee structures, and channel-specific economics rather than only a
      cash-pay benchmark.
    whyItMatters: >-
      The visible $249 consumer price helps frame substitutes but does not show what employers actually pay or how
      margins scale in the enterprise channel.
    diligencePath: Ask for current employer pricing exhibits, contract minimums, and guarantee terms used in recent RFPs.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: proof-gap
    missingEvidence: >-
      Independently reviewed cohort data showing eMed's adherence definition, measurement window, comparator set, and
      12-month persistence or biomarker outcomes.
    whyItMatters: >-
      Without third-party outcome validation, eMed's central differentiation claim is easier for incumbents or cheaper
      peers to attack on credibility.
    diligencePath: >-
      Request blinded cohort methodology, employer case studies with denominator definitions, and any peer-reviewed or
      externally audited outcomes package.
    relatedQuestionRefs:
      - QP007
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: >-
      Current contract exhibits or current checkout screenshots that reconcile whether eMed sells a $249 all-in package
      or a lower upfront fee followed by separate recurring charges.
    whyItMatters: >-
      Packaging uncertainty complicates buyer-side comparison against Ro, Henry Meds, Found, Calibrate, and
      employer-benefit alternatives.
    diligencePath: >-
      Obtain the latest member offer sheet, employer contract summary, and current public checkout flow artifacts from
      management.
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy-gap
    missingEvidence: Current cash balance, monthly burn, debt facilities, and management runway forecast.
    whyItMatters: >-
      These are the minimum inputs needed to judge whether the 2026 raise truly funds the capitated expansion or only
      extends time to the next round.
    diligencePath: Obtain latest board deck or lender package with monthly cash bridge, financing obligations, and base-case runway.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: employer-pricing
    missingEvidence: >-
      Signed employer contracts showing PMPM pricing, risk corridors, performance guarantees, and sponsor-versus-member
      cost share.
    whyItMatters: >-
      Public list pricing does not reveal whether employer contracts create attractive gross profit or expose eMed to
      medical-loss volatility.
    diligencePath: Review sample client contracts, pricing exhibits, and implementation statements of work from recent RFP wins.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Customer count, ACV mix, renewal rates, and top-account concentration outside the Aon relationship.
    whyItMatters: A single showcase partner can validate product-market fit without proving a diversified, repeatable revenue base.
    diligencePath: Request customer roster summary with top-10 ARR concentration, logo retention, and pipeline conversion by segment.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: adherence-credibility
    missingEvidence: >-
      Peer-reviewed methodology for the 90%+ adherence claim, including denominator, timeframe, and direct versus proxy
