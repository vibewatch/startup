      - ["Ro / Hims & Hers / LifeMD class", Consumer telehealth, "Not stated in retained sources", "Individual consumers seeking convenient remote prescribing", "Streamlined online consultations and prescription fulfillment", "Retained sources do not show employer-grade reporting or procurement fit"]
      - ["Lower-barrier compounded GLP-1 telehealth", Cash-pay substitute, "Not stated in retained sources", "Price-sensitive consumers", "Flexible refill systems and lower barriers to entry", "Faces growing regulatory scrutiny around compounded GLP-1 products"]
      - [Calibrate, Structured telehealth program, "Not stated in retained sources", "Patients prioritizing insurance navigation and established outcomes", "Board-certified obesity medicine, insurance navigation, and multi-year outcome history", "Higher list program fee and separate medication economics"]
      - ["Brick-and-mortar clinics", In-person substitute, "Existing clinic footprint not quantified in retained sources", "Patients wanting face-to-face care", "Integrated in-person care and established patient relationships", "Scheduling constraints, geography, and lower scalability than digital platforms"]
      - ["Pharma-backed access programs", Adjacent entrant / channel influence, "Not quantified in retained sources", "Employers and patients seeking branded-drug access", "Manufacturer-backed access pathways can shape benefit design and formulary behavior", "Retained sources do not show them replacing full ongoing care management"]
    notes: >-
      Row coverage is partial and restricted to competitor classes explicitly named or evidenced in
      retained sources; cells marked "Not stated in retained sources" reflect missing public detail,
      not a negative finding.
    claimRefs: [CP001, CP003, CP004, CP005, CP007, CP011]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - eMed
      - Consumer telehealth peers
      - Calibrate
      - Brick-and-mortar clinics
    rows:
      - ["Employer / PBM integration", "Yes; AP3 and RFP materials emphasize PBM, benefits, and reporting integration", "Unknown in retained sources", "Unknown in retained sources", "Case-by-case through local care relationships; no employer-program proof in retained sources"]
      - ["Connected monitoring and biomarker workflow", "Yes; at-home labs, smart-scale or CGM-style monitoring, and clinician follow-up are described", "Unknown in retained sources", "Unknown in retained sources", "In-person care exists, but no digital monitoring stack is evidenced in retained sources"]
      - ["Clinical structure beyond intake", "High-touch relative to low-barrier telehealth, with coaching and ongoing oversight", "Streamlined prescribing is evidenced; structured longitudinal oversight is not", "Longer-term program support is implied by outcome history and insurance navigation", "Established clinical relationships, but less scalable and slower access"]
      - ["Public long-term outcomes proof", "No independent long-term methodology disclosed in retained sources", "Unknown in retained sources", "Telehealth Ally cites three-year outcome data", "No quantified outcomes in retained sources"]
      - ["Regulatory / trust posture", "Emphasizes FDA-approved branded access and structured oversight", "Some competitor models use compounded products facing more scrutiny", "Insurance-navigation and specialist-credential story appears stronger in retained sources", "Traditional licensed-care setting lowers novelty risk"]
      - ["Procurement burden for employer buyers", "High; formal RFP, pricing, reporting, and implementation work are evidenced", "Likely lower for individuals but employer workflow fit is not shown", "Unknown in retained sources", "High operational friction because access remains geography- and scheduling-bound"]
    notes: >-
      "Unknown in retained sources" marks unsupported cells rather than inferred negatives. The
      matrix compares what current retained evidence actually supports, not what each platform may
      offer privately.
    claimRefs: [CP002, CP003, CP010, CP011, CP013, CP015]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer
      - Price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - ["eMed (Telehealth Ally framing)", "$249/mo all-in cash-pay program", "Medication, monitoring equipment, coaching, and physician visits", "Brand-drug pricing and insurance support differ by patient", "Premium to budget telehealth, but easier to compare than separate-fee models"]
      - ["eMed (GLP-1 Reviews walkthrough)", "$49 one-time lab/screening fee, then $149/mo membership + $149-$299/mo medication + $10 shipping", "At-home blood kit, telehealth consultation, later medication and membership billing", "Employer sponsorship and approval path materially affect out-of-pocket cost", "Public packaging looks more variable than the all-in framing above"]
      - [Ro, "$149/mo all-in", "Compounded semaglutide", "Outcome evidence and employer fit not detailed in retained sources", "Cheaper direct-to-consumer baseline"]
      - ["Henry Meds", "$149/mo all-in", "Compounded semaglutide", "No retained-source detail on monitoring depth", "Low-price substitute for cash-pay buyers"]
      - [Found, "~$129-$199/mo depending on medication", "Telehealth weight-loss program", "Retained sources do not detail clinical structure or employer fit", "Competitive on entry price"]
      - [Calibrate, "$299/mo program fee + medication costs separate", "Program, clinical support, and insurance navigation", "Total cost depends on medication coverage", "More expensive list structure, but stronger public proof base in retained sources"]
    notes: >-
      Prices come from third-party reviews published in 2026 and are not apples-to-apples across
      medication type, insurance status, or contract form. The two eMed rows intentionally preserve
      conflicting public packaging narratives rather than forcing a single number.
    claimRefs: [CP006, CP007, CP008, CP009]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning from retained evidence places eMed furthest toward employer-channel fit
      and structured ongoing management, while cheaper consumer telehealth models cluster lower on
      both axes.
    data:
      xAxis:
        label: Employer procurement / benefits alignment
        min: 1
        max: 5
        low: Direct-to-consumer
        high: Embedded in employer benefits
        description: Ordinal score anchored on retained evidence about channel fit and procurement readiness
        scale: ordinal
      yAxis:
        label: Clinical structure / monitoring intensity
        min: 1
        max: 5
        low: Low-touch prescribing
        high: Structured ongoing management
        description: Ordinal score anchored on retained evidence about monitoring, coaching, and clinical oversight
        scale: ordinal
      points:
        - label: eMed
          x: 5
          y: 5
          detail: Employer procurement, PBM integration, reporting, diagnostics, and adherence support are all evidenced.
        - label: Consumer telehealth peers
          x: 1.5
          y: 2.5
          detail: Retained sources show convenience and streamlined prescribing, but not employer-grade integration.
        - label: Lower-barrier compounded telehealth
          x: 1
          y: 1.5
          detail: Affordability and flexible refill access are evidenced, alongside higher regulatory scrutiny.
        - label: Calibrate
          x: 2
          y: 4
          detail: Retained evidence highlights insurance navigation and a longer public outcomes record.
        - label: Brick-and-mortar clinics
          x: 2.5
          y: 4.5
          detail: In-person care is structurally deep, but geography and scheduling reduce scalability.
        - label: Pharma-backed access programs
          x: 4
          y: 2.5
          detail: Employer-facing drug-access influence is evident, but retained sources do not show a full care-management stack.
    approximationNotes: >-
      Point values are evidence-backed ordinal judgments from retained sources, not measured market
      shares or benchmark scores.
    claimRefs: [CP002, CP004, CP005, CP010, CP011, CP015]
callouts:
  - calloutType: strength
    title: Employer procurement fit is the clearest differentiator
    body: >-
      The most defensible edge in retained evidence is not cheaper medication or exclusive access;
      it is employer-facing implementation: PBM integration, reporting, RFP readiness, and partner
      distribution.
    claimRefs: [CP002, CP012, CP015]
  - calloutType: risk
    title: Public proof still lags the marketing narrative
    body: >-
      Third-party reviewers preserve conflicting public pricing narratives and question whether
      eMed's 90%+ adherence story is independently validated, which leaves room for incumbents or
      better-documented peers to challenge trust.
    claimRefs: [CP009, CP013, CP014]
