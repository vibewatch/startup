      - number: '5.2'
        title: Operating architecture and deployment dependencies
        blocks:
          - type: paragraph
            body: >-
              The public operating model is more specific about process layers than software architecture. eMed's
              disclosed stack includes an intake and diagnostics layer, a clinician-led care layer, and an employer
              operations layer with reporting and integration requirements. AP3 explicitly claims a de-identified
              reporting dashboard and PBM and employer-platform integration, and the hiring brief implies that
              implementation work spans claims and pharmacy data, prior authorization, accumulator integration, pricing,
              guarantees, and enterprise procurement artifacts. That is useful proof that the product must survive
              complex employer buying and rollout motions, but it is not the same as public evidence of APIs, SLAs, or
              technical reliability. The available evidence supports an implementation- intensive services-plus-software
              operating model with multiple external dependencies rather than a lightweight self-serve app.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE008
              - CE009
              - CE014
          - type: table
            tableRef: TE003
