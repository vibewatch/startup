            claimRefs:
              - CU007
              - CU009
              - CU011
              - CU014
      - number: '6.3'
        title: Expansion motion is visible, but concentration remains under-documented
        blocks:
          - type: paragraph
            body: >-
              Public materials suggest eMed is building a repeatable enterprise go-to-market engine, but not yet a broad
              public roster of named production customers. AP3 positions eMed as a vetted partner for self-funded
              healthcare employers and highlights employer reporting plus PBM and HR-benefits integration, which fits a
              channel-driven expansion path into hospital and health-system buyers. The Simplify job post reinforces
              that reading by showing active investment in RFP strategy, employer health-plan expertise, and
              cost-of-care modeling. Even so, the public named-account evidence in this worker pool still clusters
              around Aon, so top-customer exposure, renewal breadth, and the balance between direct sales and
              partner-assisted distribution remain only partially evidenced.
            claimRefs:
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Independent checks support the workflow but not the headline proof
        blocks:
          - type: paragraph
            body: >-
              Independent reviewers generally agree that eMed's monitored, clinician-guided model is differentiated, but
              they do not validate the core retention narrative at face value. Telehealth Ally explicitly says eMed has
              not publicly disclosed whether its 90 percent adherence claim uses standard medication adherence
              definitions or a full 12-month window, and treats the number as marketing until methodology is published.
              TelehealthMatch adds a softer but still relevant caution: public consumer reviews are polarized, with a
              meaningful share of one-star Trustpilot complaints tied to billing. Together, those signals do not
              disprove product-market fit, but they do mean investors still lack a diversified, independently verified
              view of production retention, renewal quality, and customer concentration.
            claimRefs:
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Aon is the clearest public production proof
            body: >-
              Among the assigned sources, Aon is the only named employer customer with disclosed registrations,
              retention, and weight-loss outcomes.
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
          - type: callout
            title: Durability proof remains concentrated and methodology-light
            body: >-
              eMed's headline adherence story still relies mainly on company or partner reporting, while independent
              reviewers say the public methodology is not yet sufficient for full validation.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a clear ranking: the most important risk is that eMed's value proposition
              depends on outcomes claims that are still only directionally substantiated in public materials. The
              company and its partners present strong commercial momentum, but the independent review in the pool
              directly challenges whether the headline 90%+ adherence figure is measured with a standard clinical
              definition or over a mature enough time horizon to underwrite retention and ROI claims. Public
              underwriting is further constrained because the available financial disclosure remains range-based rather
              than precise, so residual severity stays high until independent outcomes, pharmacy controls, and unit
              economics are diligenced directly.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.2'
        title: Regulatory and evidence-quality risk
        blocks:
          - type: paragraph
            body: >-
              eMed's public materials show a real clinician-supervised care pathway and real medication-access
              partnerships, but the same sources stop short of proving that the program's most important clinical and
              regulatory claims are durable. The company says prescriptions require a licensed clinician and that not
              all people are eligible, which is directionally reassuring, yet the assigned pool does not disclose
              pharmacy counterparties, 503A versus 503B status, or a standardized method for the 90%+ adherence claim.
              Because the GLP-1 category is already under scrutiny for compounding and patient-retention quality, the
              main legal and regulatory risk is not a known enforcement action in the pool but the gap between
              aggressive commercial claims and still-limited disclosed control evidence.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Operationally, eMed is pitching a high-touch care model that combines prescribing, medication sourcing,
              monitoring devices, coaching, and biomarker tracking, which makes execution risk inherently multi-step.
              The model may improve engagement, but the independent review notes that connected devices measure
              engagement proxies such as weight and glucose data rather than directly confirming that medication was
              taken, so the operating stack can still overstate adherence quality if the measurement framework is loose.
              At the same time, current proof points are concentrated in a small set of commercially important
              relationships, especially Aon as both investor and flagship employer case study and Novo Nordisk as a
              medication-access enabler, which leaves eMed exposed if partner performance, access terms, or expansion
              economics deteriorate before broader third-party proof appears.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.4'
        title: Kill criteria and diligence path
        blocks:
          - type: paragraph
            body: >-
              The practical kill criteria are measurable. If management cannot provide standardized adherence
              methodology, cohort-level 12-month outcomes, named pharmacy partners with clear regulatory status, and
              precise revenue, burn, gross-margin, and concentration data, the risk should remain high and the
              underwriting case should not advance on public marketing evidence alone. Conversely, the most credible
              mitigation path is also concrete: show independent longitudinal outcomes, disclose drug-supply and
              clinical-governance controls, and demonstrate that the capitated employer model remains profitable even if
              adherence weakens or partner concentration rises. Until those checks are satisfied, the correct posture is
              to treat current partner traction as encouraging but insufficient.
            claimRefs:
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The main risk is evidence quality, not narrative scarcity
            body: >-
              eMed has enough public momentum to tell a strong story, but the independent review in the assigned pool
              directly questions whether the flagship adherence claim is comparable, mature, and independently
              substantiated.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR013
          - type: callout
            title: Treat pharmacy, outcomes, and unit economics as hard diligence gates
            body: >-
              If management cannot produce named supply-chain controls, standardized longitudinal outcomes, and precise
              cohort economics, the residual risk remains too high for a clean underwriting case.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR011
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports a research-more call rather than a buy. Three separate March 2026 news reports
              corroborate a $200 million Series A at a valuation above $2 billion, but the same public package still
              lacks the revenue, gross margin, burn, customer concentration, and preference-stack detail needed to
              decide whether that mark is justified by operating performance instead of narrative momentum. The clearest
              independent challenge comes from Telehealth Ally, which says eMed launched its GLP-1 program in early
              2026, cannot yet show 12-month adherence data, and is charging a premium monthly price while its headline
              adherence claim remains methodologically unverified. That combination makes the company interesting, but
              the current price point evidence-light.
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: What supports the bull case
        blocks:
          - type: paragraph
            body: >-
              The reason eMed remains investable is that the company appears to have assembled strategic proof points
              that matter in employer health: a large financing round, an anchor relationship with Aon, a Novo-linked
              access channel for oral Wegovy, and organizational evidence that enterprise procurement, pricing, and
              performance guarantees are becoming core operating muscles. Aon's August 2025 release is more useful than
              generic marketing because it ties its investment to an internal deployment with more than 1,200
              registrants, 95 percent retention, and 22.4 pounds of average weight loss in six months. Those signals do
              not prove broad repeatability, but they do suggest eMed is solving a real employer pain point rather than
              just chasing consumer GLP-1 traffic.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario boundaries and final diligence
        blocks:
          - type: paragraph
            body: >-
              The valuation debate turns on whether partner-backed early traction can convert into independently
              verifiable, diversified enterprise economics. In the bull case, the Aon-style employer motion generalizes,
              Novo access expands enrollment, and management can show revenue quality plus retention data that lets
              investors grow into or above the last mark. In the base case, the company continues to attract strategic
              attention but public evidence stays dominated by company, partner, and funding-announcement materials, so
              investors should insist on live diligence before matching the last valuation. In the bear case, long-term
              outcomes validation remains missing, capitated-risk economics prove thinner than expected, and a later
              round has to reset price or structure. The immediate diligence asks are exact revenue and margin
              disclosure, employer-account concentration, payback by cohort, and the round's liquidation and
              anti-dilution terms.
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV010
              - CV013
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence call
            body: >-
              Research more. The strategic setup is credible, but the last financing mark is ahead of what public
              operating evidence can currently support.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV015
          - type: callout
            title: What would move the recommendation
            body: >-
              A faster upgrade path would be audited or management-shared evidence on recurring revenue, gross margin,
              customer concentration, and outcome durability across multiple employer cohorts.
            calloutType: assumption
            claimRefs:
              - CV004
              - CV010
              - CV013
