              - CE010
              - CE014
      - number: '5.3'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              eMed's strongest differentiation claim is that adherence support and monitoring are built into the core
              product rather than left to generic refill workflows. Independent review coverage agrees that the smart
              scale, optional CGM integration, and shared dashboard create a more instrumented experience than many
              telehealth GLP-1 offers. That said, the same review also highlights the key diligence problem: the company
              has not published enough methodology to prove that its headline adherence claims are comparable to
              standard persistence measures or durable across a full 12-month cohort. Trust and quality controls are
              also under-documented for a clinically sensitive category. Public evidence points to clinician oversight,
              eligibility gating, and procurement involvement from legal, compliance, and security teams, but not to
              detailed model governance, privacy or security certifications, pharmacy partner disclosure, or
              quality-assurance documentation.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated workflow is the clearest product strength
            body: >-
              The retained evidence consistently shows eMed trying to own the full GLP-1 journey - intake, clinician
              gating, prescribing, adherence support, and employer reporting - which is a more defensible workflow than
              simple prescription pass-through services if the operational claims hold up.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE005
          - type: callout
            title: Public technical proof is thinner than the commercial narrative
            body: >-
              Independent and partner evidence supports the broad workflow, but public materials still do not show
              enough about adherence methodology, pharmacy quality controls, or AI and security governance to underwrite
              technical maturity with confidence.
            calloutType: risk
            claimRefs:
