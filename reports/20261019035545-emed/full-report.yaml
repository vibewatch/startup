              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              eMed's revenue story is not a pure direct-to-consumer telehealth subscription. Dealroom describes the
              company as serving employers and government payers through subscription-based, capitated contracts and
              population-health services, while multiple 2026 sources show the company still maintains a cash-pay
              consumer entry point. Telehealth Ally reports a $249 per month all-in program including compounded
              semaglutide, physician visits, coaching, and a smart scale, and the Novo Nordisk release shows eMed also
              monetizes access and care around brand-name GLP-1s such as Wegovy pill. That mix implies multiple revenue
              paths, but public evidence still separates list pricing from realized economics: no retained source
              discloses employer PMPM levels, take rates on branded medication pathways, discounting, or contribution
              margins by channel.
