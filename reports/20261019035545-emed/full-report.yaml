  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product in employer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Public materials describe eMed as an end-to-end employer GLP-1 care platform, not a medication-only
              telehealth storefront. The recurring workflow is consistent across company, partner, and review surfaces:
              member intake starts with screening or diagnostics, licensed clinicians control eligibility and
              prescribing, and the program keeps members inside a longer support loop through coaching, monitoring, and
              follow-up. The AP3 partner page is the clearest module map because it breaks the program into screening,
              physician oversight, adherence coaching, behavioral-health support, employer reporting, and PBM and
              benefits integration. The January 2026 Novo Nordisk announcement adds a regulated medication pathway by
              placing Wegovy pill access inside the same clinically guided model, while the Alight launch shows how the
              product is packaged into a large benefits ecosystem for employers that want utilization and outcomes
              visibility.
            claimRefs:
