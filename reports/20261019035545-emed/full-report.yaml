      - number: '2.3'
        title: Drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption drivers in the pool are employer cost pressure, the need for better adherence than
              low-touch GLP-1 access models deliver, and partner integrations that lower friction around reimbursement,
              formulary access, and program reporting. The same evidence also defines the constraints. Telehealth Ally
              explicitly argues that eMed's 90%+ adherence claim should be treated as marketing until the company
              publishes methodology and longer-duration outcomes, and the public sources do not disclose a robust
              market-sizing methodology, employer cohort mix, or independently audited ROI by segment. In practice, that
              means the market story is credible enough to justify continued diligence, but not yet specific enough to
              underwrite penetration, pricing power, or expansion assumptions without private data on customer counts,
              benefit design, and realized savings.
            claimRefs:
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: This is an enterprise benefits sale before it is a consumer telehealth checkout
            body: >-
              The consistent buyer pattern across recruiting, partner, and profile sources is a self-funded employer
              motion shaped by consultants, RFPs, benefit integration, and ROI framing rather than a simple
              direct-to-consumer acquisition loop.
            calloutType: insight
            claimRefs:
