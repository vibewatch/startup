      - number: '4.2'
        title: GTM and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public GTM evidence points to an enterprise, services-heavy sales motion rather than a low- touch app-only
              funnel. The Simplify job posting shows eMed running formal RFP, RFI, and consultant-evaluation processes
              for self-funded employers and coordinating pricing exhibits, ROI models, performance guarantees, and
              financial commitments across Finance, Clinical, Product, Legal, and Operations. Aon's strategic investment
              and its own workforce deployment reinforce that orientation: the partner says more than 1,200 people
              registered in the first six months of its subsidized program, with average weight loss of 22.4 pounds and
              retention of 95 percent. Those are useful commercial proof points, but they are still partner-owned pilot
              metrics rather than audited portfolio-level unit economics. Public sources do not disclose cycle length,
              CAC, payback, gross margin by medication type, or implementation cost.
