      - number: '1.3'
        title: Capital formation, partners, and milestone quality
        blocks:
          - type: paragraph
            body: >-
              The strongest externally supported milestones in the assigned pool are the August 2025 Aon strategic
              investment announcement, the January 2026 NovoCare recognition tied to oral Wegovy access, and the March
              2026 funding round reported by MobiHealthNews. Together they support the view that eMed moved from
              employer pilot traction into a better-capitalized scale-up story during 2025-2026. However, the capital
              narrative is cleaner than the operating disclosure: Aon's reported employee outcomes come from one
              lighthouse program, while Telehealth Ally explicitly argues that eMed's headline adherence claims lack
              public methodology and long-term validation. The result is a company with credible strategic sponsorship
              and funding momentum, but still meaningful diligence gaps on customer concentration, repeatability of
              outcomes, and the actual control structure behind the cap table.
