              - CM012
          - type: callout
            title: Market enthusiasm is easier to find than auditable market sizing
            body: >-
              Aon's pilot metrics and eMed's cost-pressure framing show why the category is attractive, but the public
              pool still lacks a rigorous denominator, independent adherence validation, and segmented ROI disclosure
              needed to underwrite penetration assumptions.
            calloutType: risk
            claimRefs:
