        low: Low-touch prescribing
        high: Structured ongoing management
        description: Ordinal score anchored on retained evidence about monitoring, coaching, and clinical oversight
        scale: ordinal
      points:
        - label: eMed
          x: 5
          'y': 5
          detail: Employer procurement, PBM integration, reporting, diagnostics, and adherence support are all evidenced.
        - label: Consumer telehealth peers
          x: 1.5
          'y': 2.5
          detail: Retained sources show convenience and streamlined prescribing, but not employer-grade integration.
        - label: Lower-barrier compounded telehealth
          x: 1
          'y': 1.5
          detail: Affordability and flexible refill access are evidenced, alongside higher regulatory scrutiny.
        - label: Calibrate
          x: 2
          'y': 4
          detail: Retained evidence highlights insurance navigation and a longer public outcomes record.
        - label: Brick-and-mortar clinics
          x: 2.5
          'y': 4.5
          detail: In-person care is structurally deep, but geography and scheduling reduce scalability.
        - label: Pharma-backed access programs
          x: 4
          'y': 2.5
          detail: >-
            Employer-facing drug-access influence is evident, but retained sources do not show a full care-management
            stack.
    approximationNotes: >-
      Point values are evidence-backed ordinal judgments from retained sources, not measured market shares or benchmark
      scores.
    claimRefs:
      - CP002
      - CP004
      - CP005
      - CP010
      - CP011
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      eMed converts employer or member demand into recurring care revenue by combining screening, prescribing, support,
      and reporting.
    data:
      nodes:
        - id: demand
          label: Demand intake
          value: Employer benefit demand or self-pay member interest
          note: Public evidence shows both enterprise and cash-pay entry points.
        - id: screening
          label: Eligibility and diagnostics
          value: At-home screening plus clinician review
          note: Enrollment starts with medical qualification and diagnostics.
        - id: prescribing
          label: Medication path
          value: Compounded program or brand-name GLP-1 access
          note: Public sources confirm both pathways, but economics differ by channel.
        - id: support
          label: Ongoing support
          value: Coaching, adherence management, and reporting
          note: This service layer is the differentiated part of the offer.
        - id: revenue
          label: Contracted revenue
          value: $249 membership or employer contract/capitation
          note: List price is public for cash-pay, while employer pricing remains undisclosed.
        - id: renewal
          label: Outcomes and renewal logic
          value: Retention, savings, and employer expansion
          note: Aon's pilot metrics are the clearest public proof point for renewal logic.
      edges:
        - from: demand
          to: screening
          label: eligible participants begin care
        - from: screening
          to: prescribing
          label: clinical qualification determines treatment path
        - from: prescribing
          to: support
          label: adherence support protects persistence
        - from: support
          to: revenue
          label: service model underpins fees and contracts
        - from: revenue
          to: renewal
          label: reported outcomes support expansion or renewal
    claimRefs:
      - CI003
      - CI006
      - CI007
      - CI010
      - CI011
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product story layers employer configuration, member intake, clinician-led medication management, and
      reporting/integration surfaces into a single operating stack.
    data:
      layers:
        - label: Employer configuration and launch
          detail: Employer-facing setup, commercial packaging, and implementation planning.
          modules:
            - RFP governance and procurement responses
            - Pricing and performance-guarantee positioning
            - Benefits and implementation requirements intake
          outputs:
            - Configured employer program
            - Launch and rollout workplan
        - label: Intake and diagnostics
          detail: Member qualification starts with screening and baseline clinical inputs.
          modules:
            - Health questionnaire and eligibility capture
            - Proctor-guided screening kit
            - Lab and clinical review
          outputs:
            - Eligibility decision
            - Baseline biomarker context
        - label: Clinical care and medication management
          detail: Clinicians control prescribing while care teams manage continuity.
          modules:
            - Video consultation
            - Clinician-guided prescribing
            - Dose management and follow-up check-ins
          outputs:
            - Medication access
            - Ongoing clinical oversight
        - label: Behavior-change support
          detail: Coaching and lifestyle support aim to improve persistence beyond initial prescription access.
          modules:
            - 24/7 adherence coaching
            - Weekly clinical check-ins
            - Behavioral-health support partners
          outputs:
            - Side-effect and engagement support
            - Higher likelihood of sustained participation
        - label: Adherence analytics and integrations
          detail: Monitoring and enterprise reporting close the loop for members and sponsors.
          modules:
            - Smart scale and optional CGM signals
            - De-identified employer dashboard
            - PBM and HR or benefits integrations
          outputs:
            - Early intervention signals
            - Sponsor visibility into utilization and outcomes
        - label: Enterprise governance and procurement
          detail: Employer sales and onboarding require evidence, controls, and coordinated responses across multiple teams.
          modules:
            - Security and compliance review
            - Performance guarantees and pricing responses
            - Implementation and client-success coordination
          outputs:
            - Procurement-ready documentation
            - Employer launch approvals
    approximationNotes: >-
      Layering reflects the order and grouping used in public workflow descriptions, not a disclosed internal system
      diagram or API map.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE009
      - CE010
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      eMed's public customer loop runs from employer sale to member screening, guided care, employer reporting, and
      channel-led expansion.
    data:
      items:
        - label: Employer / payer evaluation
          stage: Pre-sale
          actor: Benefits, HR, payer, or consultant buyer
          touchpoints:
            - Employer value proposition centers on utilization control, contribution design, and guaranteed outcomes
            - RFP and cost-of-care evaluation appear to be formal parts of the sales motion
          tone: positive
        - label: Member screening and enrollment
          stage: Onboarding
          actor: Employee or member
          touchpoints:
            - At-home screening kit and clinical review determine eligibility
            - Individual channel exists, but public evidence frames it as secondary to employer use
          tone: neutral
        - label: Clinician-directed prescribing
          stage: Activation
          actor: Licensed clinician plus pharmacy / medication-access partners
          touchpoints:
            - Program combines prescribing with structured medication access
            - NovoCare recognition supports branded Wegovy pill access
          tone: neutral
        - label: Adherence coaching and monitoring
          stage: In-use
          actor: Member plus eMed care team
          touchpoints:
            - 24/7 coaching, biomarker tracking, and progress monitoring are core retention levers
            - Headline adherence proof remains mostly company-controlled
          tone: positive
        - label: Employer reporting and ROI review
          stage: Account management
          actor: Employer sponsor
          touchpoints:
            - Aon case and AP3 listing both emphasize employer-visible outcomes
            - Public materials still omit multi-account renewal and concentration detail
          tone: risk
        - label: Expansion through channels and repeat procurement
          stage: Expansion
          actor: Channel partner, broker, or consultant
          touchpoints:
            - AP3 listing and RFP hiring point to healthcare-employer channel expansion
            - Breadth beyond Aon remains under-disclosed in public evidence
          tone: risk
    claimRefs:
      - CU001
      - CU007
      - CU009
      - CU010
      - CU011
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual severity is highest where eMed's public narrative depends on unverified long-duration outcomes, opaque
      supply controls, or concentrated partner proof.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Outcomes evidence / adherence claims
          values:
            - label: High
              tone: risk
              detail: Methodology and time horizon remain disputed.
            - label: High
              tone: risk
              detail: Employer ROI and retention claims depend on this proof.
            - label: Low
              tone: warning
              detail: Current public mitigants are mostly directional.
            - label: High
              tone: risk
              detail: Independent 12-month data is still missing.
        - label: Compounding / supply transparency
          values:
            - label: Medium
              tone: warning
              detail: Public sources do not name pharmacy partners.
            - label: High
              tone: risk
              detail: A control failure could affect care quality and trust.
            - label: Low
              tone: warning
              detail: Clinician screening helps, but supply controls are not disclosed.
            - label: High
              tone: risk
              detail: Residual risk stays high until counterparties are verified.
        - label: Aon concentration
          values:
            - label: Medium
              tone: warning
              detail: Aon is both investor and flagship proof point.
            - label: High
              tone: risk
              detail: Commercial narrative would weaken if the case study stalls.
            - label: Medium
              tone: neutral
              detail: Real operating data exists, but from one anchor account.
            - label: High
              tone: risk
              detail: Broader employer proof is still limited in the pool.
        - label: Novo Nordisk access dependency
          values:
            - label: Medium
              tone: warning
              detail: Recognition is valuable but not a full moat.
            - label: Medium
              tone: warning
              detail: Access and credibility could narrow if terms change.
            - label: Medium
              tone: neutral
              detail: Relationship shows external validation.
            - label: Medium
              tone: warning
              detail: Residual exposure is meaningful but not thesis-breaking alone.
        - label: Financial underwriting opacity
          values:
            - label: High
              tone: risk
              detail: Public data remains range-based rather than precise.
            - label: High
              tone: risk
              detail: Capitated contracts can magnify margin and cash-flow mistakes.
            - label: Low
              tone: warning
              detail: Assigned evidence does not show audited operating metrics.
            - label: High
              tone: risk
              detail: Residual exposure stays high without private data room evidence.
        - label: Licensure / eligibility controls
          values:
            - label: Medium
              tone: warning
              detail: Clinician review exists, but state-by-state structure is not disclosed.
            - label: Medium
              tone: warning
              detail: A control gap could slow growth or trigger compliance costs.
            - label: Medium
              tone: neutral
              detail: Eligibility screening is explicit in company materials.
            - label: Medium
              tone: warning
              detail: Residual exposure persists until licenses and entities are verified.
    approximationNotes: >-
      Ordinal heatmap based on source-backed risk ranking; cells summarize disclosed evidence quality rather than
      statistical probabilities.
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR011
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic validation exists, but evidence gaps on durable economics and independent outcomes keep the
      recommendation at research-more.
    data:
      nodes:
        - label: Employer pain point exists
          summary: News coverage frames GLP-1 cost control as a live employer problem.
        - label: eMed raised at a premium mark
          summary: $200M Series A and >$2B valuation create a high bar for proof.
        - label: Strategic channels are real
          summary: Aon investment, Novo access, and enterprise RFP build-out support go-to-market credibility.
        - label: Outcome proof is still thin
          summary: Adherence and biomarker claims are mostly company or partner reported.
        - label: Economics remain opaque
          summary: Public sources still do not disclose revenue, margins, concentration, or round structure.
        - label: Recommendation stays research-more
          summary: Do not underwrite the last mark until diligence closes the evidence gaps.
      edges:
        - from: Employer pain point exists
          to: eMed raised at a premium mark
          label: supports narrative demand
        - from: eMed raised at a premium mark
          to: Strategic channels are real
          label: needs commercial proof
        - from: Strategic channels are real
          to: Outcome proof is still thin
          label: offset by evidence quality
        - from: Outcome proof is still thin
          to: Economics remain opaque
          label: compounds diligence burden
        - from: Economics remain opaque
          to: Recommendation stays research-more
          label: prevents underwriting
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV010
      - CV013
      - CV015
