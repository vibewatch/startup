      - number: '3.2'
        title: Capability, regulatory posture, and trust signals
        blocks:
          - type: paragraph
            body: >-
              The strongest capability differentiation in retained evidence is not exclusive drug access; it is
              structured monitoring wrapped around prescribing. GLP-1 Reviews and Telehealth Ally both describe extra
              workflow around at-home testing, connected devices, coaching, and clinician follow-up, while AP3 describes
              reporting, PBM integration, and adherence support for employer buyers. eMed also emphasizes branded-drug
              and clinically guided positioning in its Novo Nordisk announcement, which contrasts with Venture Tech
              Chronicle's note that some lower-barrier competitors rely on compounded alternatives facing more
              regulatory scrutiny. Even so, public trust support is incomplete: Telehealth Ally says eMed's headline
              adherence claim lacks peer-reviewed methodology, so trust depends more on care design and partner
              endorsements than on independent long-horizon outcomes.
            claimRefs:
              - CP010
              - CP011
