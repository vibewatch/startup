      - number: '4.3'
        title: Capital needs and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The March 2026 financing gives eMed strategic room to keep funding platform buildout and a new capitated
              employer model, so there is no clear near-term distress signal in retained public evidence. Even so, the
              same evidence set is not enough to underwrite capital adequacy. Dealroom publishes only broad valuation,
              funding, and headcount bands, while the review and press coverage do not disclose revenue, ARR, gross
              margin, cash balance, monthly burn, debt, or customer concentration. The most important disconfirming
              evidence is methodological rather than legal: Telehealth Ally argues that eMed's headline 90 percent plus
              adherence claim lacks published methodology, peer review, and 12-month GLP-1 outcomes, and it also notes
              that the company has not publicly identified its compounding pharmacy partners. The investment case can
              support further diligence, but not a public-data-only underwriting decision.
            claimRefs:
