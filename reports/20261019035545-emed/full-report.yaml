      - number: '1.2'
        title: Leadership, governance, and commercial build-out
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is concentrated around Linda Yaccarino as CEO and Tom Brady as a public-facing
              wellness figure, which gives eMed brand reach but also increases key-person concentration in the external
              narrative. The assigned pool does not clearly identify named founders, board composition, or investor
              rights, so the available public picture is stronger on brand and go-to-market signaling than on governance
              transparency. A current Miami-based RFP-strategy hiring brief also suggests that eMed is building a more
              enterprise-grade employer sales motion around consultant evaluations, pricing exhibits, guarantees, and
              pharmacy-benefit complexity. That is directionally positive for commercial maturity, but it is still an
              indirect operating signal rather than proof of scaled customer breadth.
