              - CP009
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              On current evidence, eMed's moat is more operational and channel-based than proprietary. Employers that
              value adherence management, outcomes reporting, and PBM coordination may prefer eMed to a lower-touch
              telehealth vendor, and Aon's deployment shows that the model can win at least one sophisticated employer
              account. But the same evidence also limits the moat claim. Public reviewers still question whether eMed's
              adherence narrative is independently validated, and established options such as Calibrate or incumbent
              clinic networks can compete on trust, insurance navigation, or pre-existing patient relationships. If
              structured GLP-1 management becomes standardized across carriers, PBMs, and large telehealth brands,
              eMed's advantage could compress unless it turns its partner-led distribution and reporting stack into
              harder-to-replicate employer outcomes.
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Employer procurement fit is the clearest differentiator
            body: >-
              The most defensible edge in retained evidence is not cheaper medication or exclusive access; it is
              employer-facing implementation: PBM integration, reporting, RFP readiness, and partner distribution.
            calloutType: strength
            claimRefs:
              - CP002
              - CP012
              - CP015
          - type: callout
            title: Public proof still lags the marketing narrative
            body: >-
              Third-party reviewers preserve conflicting public pricing narratives and question whether eMed's 90%+
              adherence story is independently validated, which leaves room for incumbents or better-documented peers to
              challenge trust.
            calloutType: risk
            claimRefs:
