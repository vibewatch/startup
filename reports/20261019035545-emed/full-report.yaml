chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Public company materials consistently frame eMed as an employer-focused GLP-1 population-health platform
              rather than a general telehealth app. The official homepage and employer page both describe a model that
              links diagnostics, clinician oversight, medication access, and ongoing adherence support, while giving
              employers control over contribution and utilization design. That positioning matters for later chapters
              because it implies eMed is selling a managed cost-and-outcomes program to benefits buyers, not just a
              prescription fulfillment service. The same materials also surface the company's most visible operating
              claims, including direct-pricing language and internally produced outcomes, but those claims are still
              mostly management assertions rather than independently benchmarked evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO007
              - CO014
