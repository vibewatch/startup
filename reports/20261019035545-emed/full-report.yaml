      - number: '3.3'
        title: Pricing, packaging, and switching friction
        blocks:
          - type: paragraph
            body: >-
              Pricing is competitive but not cleanly disclosed. Telehealth Ally presents eMed as a $249-per-month all-in
              program that bundles medication, coaching, monitoring, and physician visits, placing it above Ro and Henry
              Meds on cash price but below Calibrate's separate program-plus-medication structure. GLP-1 Reviews'
              walkthrough saw a different public package: a $49 non-refundable screening kit, then separate membership,
              medication, and shipping charges after approval. That mismatch itself matters competitively because buyers
              comparing eMed against simpler cash-pay peers may face more diligence work before they know the real
              contract and member economics. Aon's launch evidence and eMed's RFP-oriented job posting also imply
              switching is not just about consumer preference; it runs through formal benefits procurement,
              implementation, and reporting commitments.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP015
