  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer economics
        blocks:
          - type: paragraph
            body: >-
              The current evidence places eMed in employer-sponsored GLP-1 population health, not in a broad
              undifferentiated telehealth bucket. eMed's own recruiting language says the company is winning where
              employers face double-digit cost increases and need programs that work, while partner and database
              profiles describe a bundled model that combines diagnostics, clinician oversight, medication access,
              adherence support, and employer reporting. That framing matters because the economic buyer is usually a
              self-funded employer or its consultant, the end user is the covered member, and the payer is the employer
              health-plan budget rather than a consumer making a one-off purchase. Cash-pay telehealth remains an
              adjacency and substitute, but the enterprise motion depends on procurement, benefit integration, and
              economic justification.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM011
              - CM012
