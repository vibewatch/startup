  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Retained evidence points to a broad competitive set rather than a single telehealth peer list. Venture
              Tech Chronicle frames eMed as one model inside a wider GLP-1 market that also includes national consumer
              telehealth platforms such as Ro, Hims & Hers Health, and LifeMD; lower-barrier cash-pay and
              compounded-GLP-1 programs; and brick-and-mortar weight management or primary-care clinics. Dealroom and
              AP3 position eMed differently from those direct-to-consumer options: eMed is oriented around employers and
              government payers, with population-health reporting and benefits integration rather than one-off
              prescribing. That means the buyer can solve the same job through multiple channels, but eMed's most direct
              competitive set is the subset that can combine medication access with procurement-ready employer
              workflows.
            claimRefs:
              - CP001
              - CP002
              - CP003
