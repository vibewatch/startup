        title: Exhibits
        blocks:
          - type: callout
            title: The economic story is enterprise-first
            body: >-
              The public record points to an employer distribution model with procurement, reporting, and guarantee
              obligations, while cash-pay pricing looks more like an acquisition or fallback path than the sole business
              model.
