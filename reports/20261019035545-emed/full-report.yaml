      - number: '2.2'
        title: Sizing lenses and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports the existence of a real employer problem, but it does not yield a disciplined
              TAM, SAM, and SOM stack. The sources provide burden proxies, pricing signals, pilot outcomes, and traffic
              or scale clues: eMed recruiting copy cites chronic-disease spending pressure, Dealroom describes a B2B
              capitated model aimed at employers and government payers, Telehealth Ally shows a mid-market cash-pay
              benchmark, and Aon discloses pilot registration, retention, and weight-loss outcomes from its own
              workforce program. Those datapoints are useful because they show willingness to buy and the shape of the
              adoption curve, yet none of them provide the market denominator, geography-adjusted prevalence base, or
              conversion assumptions needed for a rigorous market-size bridge. This chapter therefore treats the market
              as evidence-constrained and keeps the sizing lens separate from valuation rhetoric.
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM011
              - CM014
