      - ["Tom Brady", "Chief Wellness Officer and investor participant", "Adds brand reach and appears in funding coverage", "Public role is visible, but governance rights are unclear", "Clarify operating scope, vesting/equity terms, and board access."]
      - ["Linda Yaccarino", "CEO and reported round participant", "Combines leadership visibility with reported capital participation", "Public role is clear, economics are not", "Clarify tenure, compensation, equity ownership, and any board seat."]
      - ["Joe Lonsdale / 8VC", "Reported investor participant", "Adds recognizable venture signaling but no disclosed terms", "Named in one independent funding report only", "Request check size, pro rata rights, and whether 8VC holds formal governance rights."]
      - ["Other named round participants", "Jeff Aronin, Ara Cohen, Antonio Gracias, R.J. Melman, Tom Ricketts", "Suggests a broad syndicate but not the lead-control picture", "Participant list is public; full cap table is not", "Request lead investor identity, liquidation preferences, secondaries, and debt/credit overlays if any."]
    notes: >-
      Partial public map based on named participants and partner disclosures;
      not a substitute for the full cap table, financing documents, or board
      rights package.
