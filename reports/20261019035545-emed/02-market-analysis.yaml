company:
  name: eMed
chapter:
  number: 2
  title: Market Analysis
  summary: eMed is positioning into the employer-sponsored GLP-1 population-health market rather than a generic consumer telehealth category, with the buyer anchored in self-funded employers, consultants, and partner channels. Public evidence supports meaningful demand and early adoption signals, but the pool does not provide a clean TAM/SAM/SOM denominator, so the market case still depends more on cost-pressure narratives, partner validation, and pilot outcomes than on auditable market sizing.
sections:
- id: market-boundary-and-buyer-economics
  title: Market boundary and buyer economics
  body: The current evidence places eMed in employer-sponsored GLP-1 population health, not in a broad undifferentiated telehealth bucket. eMed's own recruiting language says the company is winning where employers face double-digit cost increases and need programs that work, while partner and database profiles describe a bundled model that combines diagnostics, clinician oversight, medication access, adherence support, and employer reporting. That framing matters because the economic buyer is usually a self-funded employer or its consultant, the end user is the covered member, and the payer is the employer health-plan budget rather than a consumer making a one-off purchase. Cash-pay telehealth remains an adjacency and substitute, but the enterprise motion depends on procurement, benefit integration, and economic justification.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM007
  - CM011
  - CM012
  tableRefs:
  - TM001
  - TM003
- id: sizing-lenses-and-adoption-signals
  title: Sizing lenses and adoption signals
  body: 'Public evidence supports the existence of a real employer problem, but it does not yield a disciplined TAM, SAM, and SOM stack. The sources provide burden proxies, pricing signals, pilot outcomes, and traffic or scale clues: eMed recruiting copy cites chronic-disease spending pressure, Dealroom describes a B2B capitated model aimed at employers and government payers, Telehealth Ally shows a mid-market cash-pay benchmark, and Aon discloses pilot registration, retention, and weight-loss outcomes from its own workforce program. Those datapoints are useful because they show willingness to buy and the shape of the adoption curve, yet none of them provide the market denominator, geography-adjusted prevalence base, or conversion assumptions needed for a rigorous market-size bridge. This chapter therefore treats the market as evidence-constrained and keeps the sizing lens separate from valuation rhetoric.'
  claimRefs:
  - CM006
  - CM008
  - CM009
  - CM011
  - CM014
  - CM015
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: drivers-constraints-and-diligence-gaps
  title: Drivers, constraints, and diligence gaps
  body: The strongest adoption drivers in the pool are employer cost pressure, the need for better adherence than low-touch GLP-1 access models deliver, and partner integrations that lower friction around reimbursement, formulary access, and program reporting. The same evidence also defines the constraints. Telehealth Ally explicitly argues that eMed's 90%+ adherence claim should be treated as marketing until the company publishes methodology and longer-duration outcomes, and the public sources do not disclose a robust market-sizing methodology, employer cohort mix, or independently audited ROI by segment. In practice, that means the market story is credible enough to justify continued diligence, but not yet specific enough to underwrite penetration, pricing power, or expansion assumptions without private data on customer counts, benefit design, and realized savings.
  claimRefs:
  - CM010
  - CM012
  - CM013
  - CM014
  - CM015
