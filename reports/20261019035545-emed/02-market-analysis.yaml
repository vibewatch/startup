- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Self-funded employers
    - Benefits, HR, and commercial leadership
    - Covered employees or members using GLP-1 therapy
    - Employer medical and pharmacy budget
    - RFP or consultant-led evaluation, implementation, reporting, and rollout
    - Benefits and finance leadership
    - Rising GLP-1 demand, obesity claims pressure, and desire for visibility into outcomes
  - - Benefits consultants / brokers
    - Consultant team evaluating vendors for employer clients
    - Employer sponsor teams and covered members indirectly
    - Employer client budget after consultant recommendation
    - Formal procurement, benchmark questions, guarantee negotiation, and implementation planning
    - Employer committee with consultant influence
    - Need to compare structured GLP-1 solutions against status quo and competing vendors
  - - Healthcare employers via AP3
    - Healthcare-system HR and finance leaders
    - Employees in self-funded healthcare organizations
    - Employer health plan / stop-loss-sensitive budget
    - AP3 coordination, negotiated terms, and Lockton-linked risk-management workflow
    - HR, finance, and stop-loss stakeholders
    - Need a clinically supervised GLP-1 benefit with reporting and integrated vendor coordination
  - - Cash-pay individuals
    - Consumer making a personal treatment choice
    - Same individual member
    - Household budget or insurance-supported brand-drug spend
    - Online intake, video visit, shipped medication, and optional connected monitoring
    - Household budget owner
    - Need access when employer coverage is absent or insufficient
  notes: 'The buyer and payer split varies by channel: enterprise deals route through employer budgets and consultants, while cash-pay access acts as an adjacent substitute rather than the core motion described in enterprise-oriented sources.'
