company:
  name: eMed
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports an employer-first customer model and one credible named deployment at Aon,
    but most adoption and retention proof remains company-controlled or partner-mediated. Independent
    reviews view the clinical structure as plausible while questioning the methodology behind eMed's
    headline adherence claims, leaving customer durability and concentration risk only partially resolved.
sections:
  - id: employer-first-segmentation
    title: Employer-first segmentation with a secondary consumer channel
    body: >-
      eMed's current customer narrative is built around employers and payers rather than a broad
      direct-to-consumer telehealth base. The official employer page promises that plan sponsors can set
      employee contribution, manage utilization, and receive guaranteed weight-loss and adherence outcomes,
      while Dealroom describes structured enterprise contracts with employers and government payers. A
      separate TelehealthMatch review reaches a similar conclusion from the outside, calling eMed primarily
      an employer and labor-union benefits business and framing the consumer program as secondary. That
      combination implies the paying buyer is usually an employer or payer, the day-to-day user is the
      enrolled member, and the individual cash-pay offer mainly broadens access rather than defining the
      core installed base.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof-and-adoption
    title: Named proof is strongest in one employer deployment
    body: >-
      Aon's program is the clearest public proof that eMed has moved beyond logo marketing into a live
      employer deployment. Aon says its U.S. workforce program, built with eMed, had more than 1,200
      registrations in the first six months, plus 95 percent retention and 22.4 pounds of average weight
      loss. eMed's own employer-facing page also advertises more than 90 percent adherence, 14.2 months of
      average program duration, and matched-lab biomarker improvements, while a January 2026 company release
      adds NovoCare recognition for Wegovy pill access. The catch is that the strongest metrics still come
      from company or partner materials, and only the Aon case provides a named employer plus deployment
      outcomes in the assigned evidence set.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU014]
    tableRefs: [TU002, TU003]
  - id: expansion-motion-and-concentration
    title: Expansion motion is visible, but concentration remains under-documented
    body: >-
      Public materials suggest eMed is building a repeatable enterprise go-to-market engine, but not yet a
      broad public roster of named production customers. AP3 positions eMed as a vetted partner for
      self-funded healthcare employers and highlights employer reporting plus PBM and HR-benefits
      integration, which fits a channel-driven expansion path into hospital and health-system buyers. The
      Simplify job post reinforces that reading by showing active investment in RFP strategy, employer
      health-plan expertise, and cost-of-care modeling. Even so, the public named-account evidence in this
      worker pool still clusters around Aon, so top-customer exposure, renewal breadth, and the balance
      between direct sales and partner-assisted distribution remain only partially evidenced.
    claimRefs: [CU009, CU010, CU011]
  - id: independent-checks-and-open-risks
    title: Independent checks support the workflow but not the headline proof
    body: >-
      Independent reviewers generally agree that eMed's monitored, clinician-guided model is differentiated,
      but they do not validate the core retention narrative at face value. Telehealth Ally explicitly says
      eMed has not publicly disclosed whether its 90 percent adherence claim uses standard medication
      adherence definitions or a full 12-month window, and treats the number as marketing until
      methodology is published. TelehealthMatch adds a softer but still relevant caution: public consumer
      reviews are polarized, with a meaningful share of one-star Trustpilot complaints tied to billing.
      Together, those signals do not disprove product-market fit, but they do mean investors still lack a
      diversified, independently verified view of production retention, renewal quality, and customer
      concentration.
    claimRefs: [CU012, CU013]
