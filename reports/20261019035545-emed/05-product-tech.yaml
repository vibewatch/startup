schemaVersion: report-v2
artifact: product-tech
slug: emed
runDate: 2026-10-19
company:
  name: eMed
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    eMed publicly presents a coherent employer GLP-1 workflow that bundles
    screening, clinician-directed prescribing, adherence support, employer
    reporting, and benefits integrations into one program. The commercial
    packaging looks more mature in 2025-2026 through AP3, Aon, Alight, and Novo
    Nordisk relationships, but public technical proof still lags the narrative:
    independent evidence questions the adherence methodology, and public sources
    do not disclose API, security, uptime, or pharmacy-quality details in enough
    depth for underwriting.
sections:
  - id: delivered-workflow
    title: Delivered product in employer workflow terms
    body: >-
      Public materials describe eMed as an end-to-end employer GLP-1 care
      platform, not a medication-only telehealth storefront. The recurring
      workflow is consistent across company, partner, and review surfaces:
      member intake starts with screening or diagnostics, licensed clinicians
      control eligibility and prescribing, and the program keeps members inside
      a longer support loop through coaching, monitoring, and follow-up. The
      AP3 partner page is the clearest module map because it breaks the program
      into screening, physician oversight, adherence coaching, behavioral-health
      support, employer reporting, and PBM and benefits integration. The January
      2026 Novo Nordisk announcement adds a regulated medication pathway by
      placing Wegovy pill access inside the same clinically guided model, while
      the Alight launch shows how the product is packaged into a large benefits
      ecosystem for employers that want utilization and outcomes visibility.
    claimRefs: [CE001, CE002, CE003, CE006, CE007]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: operating-architecture
    title: Operating architecture and deployment dependencies
    body: >-
      The public operating model is more specific about process layers than
      software architecture. eMed's disclosed stack includes an intake and
      diagnostics layer, a clinician-led care layer, and an employer operations
      layer with reporting and integration requirements. AP3 explicitly claims a
      de-identified reporting dashboard and PBM and employer-platform
      integration, and the hiring brief implies that implementation work spans
      claims and pharmacy data, prior authorization, accumulator integration,
      pricing, guarantees, and enterprise procurement artifacts. That is useful
      proof that the product must survive complex employer buying and rollout
      motions, but it is not the same as public evidence of APIs, SLAs, or
      technical reliability. The available evidence supports an implementation-
      intensive services-plus-software operating model with multiple external
      dependencies rather than a lightweight self-serve app.
    claimRefs: [CE003, CE004, CE005, CE008, CE009, CE014]
    tableRefs: [TE003]
  - id: maturity-and-risks
    title: Maturity, differentiation, and technical risk
    body: >-
      eMed's strongest differentiation claim is that adherence support and
      monitoring are built into the core product rather than left to generic
      refill workflows. Independent review coverage agrees that the smart scale,
      optional CGM integration, and shared dashboard create a more instrumented
      experience than many telehealth GLP-1 offers. That said, the same review
      also highlights the key diligence problem: the company has not published
      enough methodology to prove that its headline adherence claims are
      comparable to standard persistence measures or durable across a full
      12-month cohort. Trust and quality controls are also under-documented for
      a clinically sensitive category. Public evidence points to clinician
      oversight, eligibility gating, and procurement involvement from legal,
      compliance, and security teams, but not to detailed model governance,
      privacy or security certifications, pharmacy partner disclosure, or
      quality-assurance documentation.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Public status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [At-home screening and lab kit, Eligible member, Publicly described core module, Proctor-guided screening lowers intake friction before prescribing, No public vendor list turnaround SLA or state-by-state coverage detail]
      - [Clinician-directed prescribing and oversight, Clinician and member, Publicly described core module, Keeps eligibility medication management and follow-up inside one guided flow, No public titration contraindication or exception-handling protocol]
      - [Adherence coaching and weekly check-ins, Member and care team, Publicly described core module, Puts structured support and side-effect management at the center of the program, No public methodology proving adherence against standard 12-month benchmarks]
      - [Employer reporting dashboard, HR benefits and finance teams, Publicly described enterprise module, De-identified real-time reporting promises visibility into participation and outcomes, No sample report schema metric definitions or benchmark conventions]
      - [PBM and benefits integrations, Employer implementation teams, Publicly described dependency layer, Designed to fit existing employer and pharmacy workflows rather than replace them, No public API docs partner list or implementation timing]
    notes: >-
      Public module map compiled from AP3, partner announcements, and recruiting
      copy; maturity reflects what is explicitly disclosed, and every gap is a
      due-diligence request rather than evidence of absence.
    claimRefs: [CE002, CE003, CE004, CE005, CE009]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow problem
      - eMed solution
      - Measurable benefit disclosed
      - Limitation
    rows:
      - [Launch an employer GLP-1 benefit, Fragmented access and weak adherence oversight make cost control difficult, End-to-end clinically guided GLP-1 program packaged for employer benefits, Partner materials promise visibility into utilization outcomes and cost management, Public sources do not disclose launch timelines SLA commitments or customer implementation references]
      - [Qualify members before treatment, Many programs lack structured screening and eligibility checks, Screening kit lab review and clinician consultation gate prescribing, Company materials explicitly say not all persons qualify for prescribed treatment, No public protocol detail for contraindications prior authorization exceptions or appeals]
      - [Keep members engaged after the first prescription, Drop-off after initiation erodes outcomes and employer ROI, Weekly check-ins coaching and connected monitoring try to catch disengagement early, Independent review says smart scale and dashboard can surface plateaus or missed check-ins, Connected devices track proxies rather than medication ingestion directly]
      - [Give employers operational visibility, Sponsors need proof that benefit spend is generating outcomes, Dashboard and reporting layer expose participation adherence and health-outcome trends, AP3 says reporting is de-identified and real time, No public metric dictionary sample dashboard or audit trail documentation]
    notes: >-
      Benefits are reported by company or partner sources unless otherwise
      noted; limitations capture what the retained public evidence still does not
      document.
    claimRefs: [CE004, CE007, CE010, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Key dependency
      - Risk
    rows:
      - [Screening and diagnostics, Establish eligibility baseline biomarker and lab context, At-home kit operations lab review and licensed clinicians, No public disclosure on lab partners turnaround variability or exception handling]
      - [Clinical decisioning and prescribing, Convert screening into medication access and dose management, Clinician workforce medical protocols and pharmacy relationships, Public evidence supports guided care but not detailed protocol transparency]
      - [Monitoring and coaching, Track progress prompt engagement and support side-effect management, Smart scale optional CGM care-team workflows and member engagement, Review evidence says adherence metrics may rely on engagement proxies rather than confirmed use]
      - [Employer analytics and reporting, Translate member activity into sponsor-facing utilization and outcome views, Claims data reporting definitions and de-identified dashboard design, No public schema benchmark definitions or controls evidence]
      - [Enterprise integration and rollout, Fit into PBM benefits procurement and implementation processes, PBM integration accumulator logic prior authorization and security/compliance coordination, Product appears implementation-heavy and may be hard to scale cleanly without stronger public technical documentation]
    notes: >-
      This is an operating-architecture view synthesized from disclosed workflow
      steps and enterprise requirements; the company has not published enough
      technical detail to represent a software-component diagram more precisely.
    claimRefs: [CE002, CE005, CE008, CE009, CE010, CE014]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product story layers employer configuration, member intake,
      clinician-led medication management, and reporting/integration surfaces
      into a single operating stack.
    data:
      layers:
        - label: Employer configuration and launch
          detail: Employer-facing setup, commercial packaging, and implementation planning.
          modules:
            - RFP governance and procurement responses
            - Pricing and performance-guarantee positioning
            - Benefits and implementation requirements intake
          outputs:
            - Configured employer program
            - Launch and rollout workplan
        - label: Intake and diagnostics
          detail: Member qualification starts with screening and baseline clinical inputs.
          modules:
            - Health questionnaire and eligibility capture
            - Proctor-guided screening kit
            - Lab and clinical review
          outputs:
            - Eligibility decision
            - Baseline biomarker context
        - label: Clinical care and medication management
          detail: Clinicians control prescribing while care teams manage continuity.
          modules:
            - Video consultation
            - Clinician-guided prescribing
            - Dose management and follow-up check-ins
          outputs:
            - Medication access
            - Ongoing clinical oversight
        - label: Behavior-change support
          detail: Coaching and lifestyle support aim to improve persistence beyond initial prescription access.
          modules:
            - 24/7 adherence coaching
            - Weekly clinical check-ins
            - Behavioral-health support partners
          outputs:
            - Side-effect and engagement support
            - Higher likelihood of sustained participation
        - label: Adherence analytics and integrations
          detail: Monitoring and enterprise reporting close the loop for members and sponsors.
          modules:
            - Smart scale and optional CGM signals
            - De-identified employer dashboard
            - PBM and HR or benefits integrations
          outputs:
            - Early intervention signals
            - Sponsor visibility into utilization and outcomes
        - label: Enterprise governance and procurement
          detail: Employer sales and onboarding require evidence, controls, and coordinated responses across multiple teams.
          modules:
            - Security and compliance review
            - Performance guarantees and pricing responses
            - Implementation and client-success coordination
          outputs:
            - Procurement-ready documentation
            - Employer launch approvals
    approximationNotes: >-
      Layering reflects the order and grouping used in public workflow
      descriptions, not a disclosed internal system diagram or API map.
    claimRefs: [CE002, CE003, CE004, CE005, CE009, CE010]
callouts:
  - calloutType: strength
    title: Integrated workflow is the clearest product strength
    body: >-
      The retained evidence consistently shows eMed trying to own the full GLP-1
      journey - intake, clinician gating, prescribing, adherence support, and
      employer reporting - which is a more defensible workflow than simple
      prescription pass-through services if the operational claims hold up.
    claimRefs: [CE001, CE002, CE004, CE005]
  - calloutType: risk
    title: Public technical proof is thinner than the commercial narrative
    body: >-
      Independent and partner evidence supports the broad workflow, but public
      materials still do not show enough about adherence methodology, pharmacy
      quality controls, or AI and security governance to underwrite technical
      maturity with confidence.
    claimRefs: [CE011, CE014, CE015]
