      topic: architecture-proof-gap
      missingEvidence: Public API docs, implementation guides, uptime or service-level commitments, security attestations, and model-governance documentation for Empathetic AI.
      whyItMatters: Enterprise product maturity cannot be underwritten from workflow marketing alone when integrations, patient data, and AI-driven engagement are core to the pitch.
      diligencePath: Request architecture and security documentation, customer implementation artifacts, and any model-governance or incident-response materials used in employer procurement.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
