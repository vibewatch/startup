  topStrengths:
    - 覆盖货到人、托盘、货架、智能搬运等流程的真实产品宽度，并有可见的软件层。
    - Coupang、Radial、Cubyn、Cainiao、Stellantis 等重物流运营商提供了具名生产客户证明。
    - 后期资本可得性和保密 IPO 准备，说明公司有机构化严肃度，不是只会营销的机器人故事。
    - 国际布局、合规投入和伙伴生态支撑一条可信的全球扩张路径。
  topRisks:
    - 经审计收入、毛利率、软件 attach 和客户集中度仍过于不透明，无法精确定价。
    - 模式看起来资本密集、服务重，即使部署增长很强，也会压缩利润率。
    - 全球扩张会在多个司法辖区叠加合规、安全、集成和伙伴协同负担。
    - Geek+、Exotec、Locus、GreyOrange 等仓储自动化厂商带来的竞争压力，可能压住高估值结果。
  unresolvedGaps:
    - 经审计财报、毛利率 bridge、软件 attach / 续费数据。
    - Top-customer 集中度、直接与伙伴 bookings 结构，以及多站点扩张 cohort。
    - 轮次结构、清算优先权、治理权利和真实入场经济性细节。
    - 按旗舰客户 cohort 拆分的 uptime、事故、MTBF / MTTR 和支持指标。
    - 当前公开证据有限，仍需可引用的北美和欧洲客户 KPI。
