      - number: '1.2'
        title: 创始团队、公开领导层和运营模式
        blocks:
          - type: paragraph
            body: >-
              保留材料中最清晰的具名领导者是创始人兼 CEO Yang Wei。官方融资和访谈材料反复将 Yang 标注为创始人和 CEO；他的 2025 年访谈很重要，因为它披露了 Quicktron
              当前形态背后的运营逻辑。Yang 将两大场景——面向零售配送的订单履约系统，以及面向制造物流的物料搬运系统——描述为公司的战略骨架；公司自 2021
              年起形成四大业务支柱，运营模式实际是以中国作为训练场，同时在海外市场追求变现。这使 Quicktron 的管理命题不再是每年发明一款新机器人，而是把模块化产品、软件和服务交付匹配到不同区域的仓储流程中。


              除 Yang 之外，公开可见的领导层宽度仍不足以让投资人在后期 IPO 前放心承销。2024 年 Series D 新闻稿将 Xie Xuan 列为合伙人兼 CFO，第三方数据库快照显示 Zhang Clint
              为供应链总监，Jill Stelfox 是 2024 年 10
              月备案的德州法律实体董事。这些信号有用，说明公司在搭建国际运营班底和法律基础设施，但还构不成完整治理记录。官网没有公开董事会名单或委员会结构，保留的公开来源也没有披露可与上市公司招股书相比的经审计治理包。访谈还强调，国际化在运营上很烧钱：Yang
              称 Quicktron 必须投入本地服务团队、伙伴网络、制造能力和区域合规，包括为满足 CE 相关要求投入数千万人民币。换言之，领导层故事在执行意图上可信，但正式治理披露仍然不足。
