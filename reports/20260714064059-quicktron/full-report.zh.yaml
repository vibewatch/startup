      - number: '2.4'
        title: 约束、周期性和中国语境
        blocks:
          - type: paragraph
            body: >-
              这个市场并非没有摩擦。SupplyChain360 对 Interact 研究的 2026 年综合称，集成复杂度已经超过前期成本，成为新部署的首要障碍；回本预期也已收紧到两到四年区间。Interact 的
              2025-2026 年评论还显示，关税冲击、钢铝通胀以及少数超大零售项目扭曲了订单增长和定价；Inside Logistics 和 SDCExec 则描述了供应商困境，包括 Attabotics 破产和
              Zebra Technologies 关闭机器人部门。这些信号重要，因为它们说明，即便需求真实存在，供应商也可能难以把增长转化为平滑变现。中国同时带来机会和竞争压力。IFR、CSIS、The Diplomat
              以及 Robotics & Automation News 都显示机器人正更深进入中国工业政策，伴随很大规模的国家支持资金计划、2024 年 295,000
              台工业机器人安装量，以及对自动化和具身智能的明确支持。对 Quicktron
              来说，这一组合是双刃剑：中国仍是强大的本土市场试验场和供应基地，但也强化了价格竞争、快速迭代，以及在国内移动机器人份额走向成熟之后继续国际化的必要性。
