        - 本地实体能支撑服务交付
        - 要求提供法律实体图谱和区域合规负责人
    notes: 关键法律问题不是已知执法事件，而是 Quicktron 全球化推进、却仍保持私有公司不透明，合规面随之拉宽。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR006
      - CR022
      - CR032
    enumerationScope:
      coverage: sample
      basis: >-
        Register covers the most decision-relevant legal and regulatory issues visible from public materials, including
        listing disclosure, compliance cost, IP, and entity-footprint complexity; it is not a complete legal audit.
  - id: TR003
    title: 运营和依赖风险表
    columns:
      - 问题
      - 公开信号
      - 风险机制
      - 缓释因素
      - 剩余担忧
    rows:
      - - 复杂系统集成
        - 软件连接 WMS/ERP/MES/OMS/TMS/SCADA 与机器人群
        - 集成失败会带来延期、停机和 ROI 不佳
        - Quicktron 对外强调统一软件栈和标杆部署
        - 缺少公开 API、正常运行时间或事故细节
      - - 安全性和可靠性
        - 官网提到安全传感器、CE 或 PLd 参考，以及全球标准
        - 仓库或工厂运营一旦出事故，就会冲击销售并抬高服务成本
        - 安全定位清晰可见
        - 缺少经审计可靠性指标或安全论证透明度
      - - 服务本地化
        - 创始人访谈提到本地团队、合作伙伴和制造支持
        - 国际增长会抬高固定支持负担和执行风险
        - Series D 轮募资用途明确指向全球扩张
        - 服务成本和质量仍未知
      - - 伙伴渠道
        - Prism 和 Dematic 对部分部署有明显影响
        - 伙伴主导销售会限制定价控制和客户归属
        - 合作伙伴能降低采用阻力
        - 直销与渠道经济性未披露
      - - 客户集中度
        - 大型标杆项目和偏物流的客户组合，暗示可能暴露于大客户依赖
        - 少数客户可能主导收入或服务强度
        - 具名客户覆盖面确实存在
        - 缺少集中度明细
    notes: 复杂集成、全球支持和经合作伙伴交付叠加时，运营与依赖风险最高。
    claimRefs:
      - CR007
      - CR010
      - CR011
      - CR012
      - CR013
      - CR022
      - CR023
      - CR024
      - CR025
  - id: TR004
    title: 财务和模式风险表
    columns:
      - 风险
      - 公开证据
      - 解读
      - 影响
      - 尽调要求
    rows:
      - - 资本密集度
        - 60% 开支用于 R&D；Series D >$100M；海外布局
        - 增长需要持续投入，不只是追加软件开支
        - 如果利润率跟不上，稀释或融资风险会更高
        - 要求提供现金消耗、资金 runway 和资本开支计划
      - - 同业盈利警示
        - Geek+ 的公开披露和 AGVNetwork 评论显示，规模扩大后利润率仍受审视
        - 行业龙头 IPO 后仍可能承受亏损压力
        - 不能假设规模本身就能解决经济性
        - 要求提供硬件 / 软件 / 服务毛利率
      - - 营运资本拖累
        - 项目交付、合规、本地服务和多站点扩张，都意味着现金周期负担
        - 现金转化可能落后于订单或部署
        - 即便收入增长，股权价值也可能被压缩
        - 要求提供应收账款、开票里程碑和支持成本曲线
      - - 硬件商品化
        - Mordor 和 Roland Berger 都暗示，软件价值捕获会越来越重要
        - 机器人硬件如果没有稳固的软件附着，利润率会被压缩
        - 估值应奖励编排能力，而不是出货数量
        - 要求提供软件附着和续约证据
      - - 竞争性定价压力
        - Locus RaaS、GreyOrange 模型和 Exotec 保证抬高买方预期
        - 客户可能按回本期、正常运行时间和融资结构比较供应商
        - Quicktron 可能需要吸收更多服务成本或折扣
        - 要求提供赢单 / 输单分析和定价纪律数据
    notes: 模式风险在于，如果重服务交付跑在软件杠杆前面，Quicktron 即便战略位置强，也可能财务脆弱。
    claimRefs:
      - CR004
      - CR015
      - CR016
      - CR017
      - CR019
      - CR020
      - CR021
      - CR034
      - CR035
  - id: TR005
    title: 缓释因素、指标和论点失效触发因素表
    columns:
      - 主题
      - 当前缓释因素
      - 监测指标
      - 论点失效触发因素
      - 行动含义
    rows:
      - - 披露风险
        - 保密申报可能转化为更完整的公开材料
        - IPO 文件发布、CSRC 状态、审计报表
        - 申报撤回、严重延迟或弱于预期
        - 暂停估值工作，或要求大幅风险折价
      - - 运营可靠性
        - 大型具名案例和全球标准主张
        - 正常运行时间、SLA、事故和服务指标
        - 标杆站点停机、召回或安全争议
        - 重估客户韧性和利润率假设
      - - 软件差异化
        - WES/WCS/RCS/LES 和 QuickMix / QuickBin 架构
        - 软件附着率、扩张率、相对同业的赢单 / 输单
        - 证据显示软件只是捆绑销售，未增厚利润率
        - 价值更接近系统集成商，而非软件驱动平台
      - - 客户质量
        - 大型全球客户和多个垂直行业
        - Top-10 集中度、复购站点扩张、流失率
        - 集中度显著差于预期，或续约疲软
        - 降低投资判断信心和预期退出倍数
      - - 资本充足性
        - 近期私募融资和 IPO 选项
        - 资金 runway、现金消耗、营运资本和债务需求
        - 近期需要以不利条款融资
        - 明确建模稀释和下行保护
    notes: 这些触发因素把宽泛的机器人风险叙事，转成具体尽调关口。
    claimRefs:
