            body: >-
              Quicktron 自身公开牵引力指标真实但不完整。官方页面引用 1,000+ 客户、45,000+ 机器人部署、超过 700
              名员工和很大的国际版图，但这些数字都不揭示收入、积压订单、毛利率、现金转化或经常性软件组合。因此，最好的公开视角来自 Geek+，这个最接近且新近上市的中国 AMR 可比公司。KrASIA 的 IPO
              后分析称，Geek+ 2024 年收入 RMB 2.409 billion，截至 2024 年底交付 56,000 台，超过 70% 收入来自海外市场；即便调整后亏损大幅收窄，仍录得 RMB 832
              million 净亏损。这在战略上很重要，因为它展示了这个类别中「真实规模」在财务上可能是什么样子：强增长、国际服务强度高、积压订单有分量、毛利质量改善，但在完全盈亏平衡前仍有不小亏损。Quicktron 未必与
              Geek+ 完全相同，但这个比较有方向性价值。它反对把装机量或客户数主张当作收入质量证明，也提示应把 Quicktron 的后期融资理解为国际运营杠杆的燃料，而不是经济模型已完全自我供血的信号。
