  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论据
      - 方向
      - 改变判断的证据
    rows:
      - - 真实的产品宽度、具名客户和全球布局支撑战略分量
        - 论点
        - 经审计证据若显示利润率弱或续约差，会削弱这一点
      - - 仓储自动化仍是有意义的品类，且有软件驱动上行空间
        - 论点
        - 若证明 Quicktron 主要是低毛利交付工作，会削弱这一点
      - - 后期资本和 IPO 信号显示其有机构化野心
        - 论点
        - 上市流程延迟或疲弱会降低信心
      - - 收入、集中度和轮次结构仍未公开
        - 反论点
        - 达到申报质量的披露或强 NDA 数据室会提升信心
      - - 公开可比公司过于分散，难以支撑简单的叙事溢价
        - 反论点
        - 明确的软件高占比经济性证据，会支持更收敛的可比公司组
    notes: 反论点主要来自证据质量和模式组合，而不是怀疑 Quicktron 是一家真实业务。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV010
      - CV016
