        title: 直接同业差异化和流程适配
        blocks:
          - type: paragraph
            body: >-
              最强的直接竞争者沿着流程设计和软件哲学分化。Quicktron 官方材料显示其产品栈很宽，覆盖货到人、料架到人、点到点智能搬运、托盘和物料搬运，以及 WES、WCS、RCS 软件。Geek+
              是最接近的宽度匹配者：它营销拣选、分拣、存储、补货、托盘搬运和内部运输，并已带上 2025 年 7 月 HKEX 上市的信任信号。Hai Robotics 角度更窄但更锋利，围绕箱体搬运 ASRS
              和高密度存储，在周转箱和料箱密度主导买方需求时会很有力。Locus 通过 LocusONE 编排、快速部署和 Robots-as-a-Service 经济性，而不是密集结构化存储来差异化。GreyOrange
              更激进地围绕编排软件、多智能体决策和厂商无关执行来定位。Exotec 的 Skypod 系统又不一样：它更像一个垂直爬升的结构化取货平台，并与 WES 紧密集成。ForwardX 作为挑战者值得关注，因为它声称
