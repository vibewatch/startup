      - number: '2.2'
        title: 买方、用户和预算归属
        blocks:
          - type: paragraph
            body: >-
              这个市场是通过运营问题被购买的，而不是通过对机器人的抽象兴趣被购买。保留材料中最可见的需求群包括电商零售商、3PL、包裹运营商、制造仓库，以及医药或冷链场地。Mordor 将零售和电商列为 2025 年支出的
              28.41%，按所有权模式将 3PL 列为 38.96%；Fortune 的仓储机器人视角则把电商放在 2026 年需求的
              47.21%。实际使用者通常是仓库经理、工业工程师和履约负责人，但预算权往往在物流领导层、COO、业务单元财务，或必须守住服务水平和劳动生产率的 3PL 运营商手中。采用通常从履约拥堵、劳动力短缺或 SKU
              复杂度让人工流程过慢、过不稳定的地方开始；试点区证明吞吐、准确率和回本后，再扩展到软件编排和更广的设施重设计。这条预算路径对 Quicktron
              很重要，因为它的销售动作可能必须同时赢得本地运营团队和高级资本配置者。
