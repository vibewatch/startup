  - id: TV005
    title: 论点失效和纪律触发因素表
    columns:
      - 触发因素
      - 阈值
      - 如何传导到论点
      - 行动含义
    rows:
      - - 披露不及预期
        - 申报文件或数据室显示利润率弱、附着率弱或集中度高
        - 打破质量溢价论点
        - 重新定价或退出
      - - 激进定价
        - 卖方或市场在缺少证据时给出显著高于上行情景的估值
        - 抹掉回报垫
        - 跟踪而非追价
      - - 运营可信度冲击
        - 标杆站点出现安全或正常运行时间问题，或跨国客户背调不佳
        - 削弱客户质量论据
        - 下调投资信心和倍数
      - - 结构性包袱
        - 优先权、偏老股转让的条款或治理权利差于预期
        - 压缩普通股上行空间
        - 要求结构保护，或放弃
      - - 融资滑坡
        - IPO 或下一轮融资延迟，且条款疲弱
        - 质疑退出准备度和市场胃口
        - 下调牛市情景概率
    notes: 这些触发因素把宽泛战略兴趣转成具体估值纪律。
    claimRefs:
