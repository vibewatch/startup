      - number: '7.3'
        title: 伙伴、客户与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Quicktron 的客户和销售路径优势也带来依赖风险。公开客户群明显偏向
              3PL、电商和物流密集型运营商，这意味着公司仍暴露在履约周期、仓库资本开支纪律和采购审查之下。公开来源没有披露头部客户集中度，所以一串广泛的具名案例，仍可能掩盖对少数大客户或站点的收入依赖。伙伴动态同样重要。Radial
              项目显示 Dematic 参与设计和交付，Prism 则以北美集成视角销售 Quicktron。这能加速国际扩张、降低实施风险，也可能削弱 Quicktron
              对客户关系的直接控制，并压缩经济性。竞争依赖是问题的另一半。Quicktron 所在赛道里，Locus 销售 RaaS 和快速 ROI，GreyOrange 销售预部署建模和编排，Exotec
              销售长期性能保证，Geek+ 以及其他中国同行都在抬高披露标准。在这个背景下，Quicktron 必须持续证明：它的软件层和多场景宽度足够强，能防止硬件沦为低毛利、易替代的部件。
