        title: 退出准备度可信，但承销准备度仍取决于缺失的核心数据
        blocks:
          - type: paragraph
            body: >-
              退出逻辑有不止一条路径。保密申报报道已经让香港 IPO 路径可见。财务买家之间转手或战略退出也可想象，因为仓储自动化仍具战略价值，Quicktron
              也有客户规模、产品宽度和国际化雄心的证据。但退出准备度不等于估值准备度。给出溢价估值前，投资人应要求一份短而关键的证据清单：经审计收入和分业务线毛利、软件附加率和续约行为、头部客户暴露、伙伴渠道与直销经济性、轮次结构和清算优先权，以及西方或跨国标杆部署强到足以跨区域复制的证据。Robotics.press
              在这里有价值，因为它抵住了简单故事：公司或许有认证和德州据点，但公开西方证据仍落后于全球雄心。这不会杀死投资逻辑，只意味着最终估值判断应靠结构和下行纪律，而不是叙事热情。
