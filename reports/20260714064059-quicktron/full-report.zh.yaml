        title: GTM、定价模型和切换成本
        blocks:
          - type: paragraph
            body: >-
              整个领域的公开定价透明度都很差，这本身就有竞争意义。多数供应商通过配置化项目范围、试点或企业订阅销售，而不是公布单机价格。Locus 在商业姿态上是最清楚的例外，因为其领导层公开强调
              RaaS、较小初始部署，以及无需大额前期资本开支即可弹性扩容。MiR 在上市路径上也突出，因为它明确通过覆盖 60 多个国家和 160 多个解决方案模块的广泛分销商和系统集成商网络营销。Geek+
              称经认证本地伙伴负责安装和上线；Quicktron 较早披露则强调区域子公司和国际运营实体。Exotec
              的模型另有差异：它提供单一供应商技术栈，并通过合同承诺性能和长期服务。这些差异塑造切换成本。密集结构化系统和单栈编排环境可能带来更强运营锁定；柔性 AMR 车队更容易试点和扩展，但初选阶段可能面临更多供应商重叠。
