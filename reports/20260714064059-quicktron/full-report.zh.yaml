  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 达到 IPO 质量的披露扎实，软件附着率高，全球客户扩张，利润率证明比担心的更健康
        - 支持估值靠近私有独角兽区间上沿，并向披露更强的同业参照靠拢
        - 披露不及预期或标杆运营问题可能打破该情景
        - 并非不可能，但取决于隐藏指标能否显著提升信心
      - - 基准
        - Quicktron 是已具规模但资本密集的自动化平台，有实质软件上行空间，也应承担中等不透明折价
        - 支持在 2024 年独角兽底价之上适度上调，但不给顶级溢价
        - 集中度或服务强度仍可能拖低估值标记
        - 最符合当前公开证据
      - - 熊市
        - 客户集中、服务过重、软件附着弱或融资延迟，都会削弱叙事
        - 估值支撑接近或仅略高于 2024 年独角兽锚点
        - 倍数压缩和现金转化疲弱
        - 没有审计证明，不能排除
    notes: 情景逻辑围绕尽调还可能发现什么，而不是市场是否存在。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV028
      - CV035
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - Quicktron 2024 年独角兽锚点
        - 私募估值背景
        - Series D 后概况层面的 ~$1.0B 锚点
        - 最像估值底线的公司专属公开参照
        - 不是经验证的 2026 年市场出清价格
      - - Geek+
        - 私募 / 公开混合可比
        - 2026 年汇总为 ~$4.1B；已上市，并披露收入 / 亏损画像
        - 披露更多、业务宽度最接近的中国仓储机器人同业
        - 仍不是 Quicktron 的直接同口径估值标记
      - - Exotec
        - 私有仓储自动化可比
        - 2026 年机器人估值汇总为 $1.8B-$2.3B
        - 可作为高质量自动化叙事的私募基准
        - 架构、服务模式和披露基础不同
      - - Symbotic
        - 公开市值
        - July 2026 市值 $25.6B
        - 高估值仓储自动化情绪的上限参照
        - 体量大得多，且已上市、结构不同
      - - Ocado
        - 公开市值
        - July 2026 市值 $1.93B
        - 说明公开市场给自动化业务的价值可能远低于热门叙事
        - 商业模式和公开市场历史不同
      - - PitchBook 独角兽追踪器
        - 私募市场背景
        - 独角兽样本很大，但许多估值陈旧或未经验证
        - 支持对未经验证的私募估值打折
        - 不是公司专属定价
    notes: 这些锚点是背景和护栏，不是公式。正确的可比视角要按里程碑和商业模式调整。
    enumerationScope:
      coverage: sample
      basis: >-
        Sample includes the cleanest company-specific private anchor, the nearest disclosed Chinese peer, one relevant
        private automation unicorn, two public market references, and a private-market caution source; it is not a full
        universe of robotics comps.
