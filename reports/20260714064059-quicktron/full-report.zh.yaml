      - number: '8.3'
        title: 牛市、基准和熊市情景更取决于隐藏指标，而非市场规模
        blocks:
          - type: paragraph
            body: >-
              因此，估值讨论应该按情景推进。牛市情景假设 Quicktron 的软件层确实把经济性抬到服务密集型系统业务之上，全球客户能跨站点、跨流程扩张，IPO
              级披露也显示毛利和集中度动态比怀疑者预期更健康。在这种情况下，估值可以向更强的私募独角兽和已披露公开可比公司背景靠近。基准情景假设 Quicktron
              战略上真实、商业上相关，但仍按资本密集型工业自动化平台定价；它有有意义的软件上行空间，却不是纯软件公司。这支持从独角兽底部适度上调，但不支持完全重估到已披露可比样本的顶部层级。熊市情景不是市场消失，而是隐藏的客户集中、较弱的软件附加率、沉重服务负担或融资延迟，把强叙事拉回低质量系统模型。在这种情形下，合理估值会更接近
              2024 年独角兽锚点，而不是更高的机器人可比公司。由于公开证据在最关键驱动因素上并不均衡，信心应保持中等，而非高。
