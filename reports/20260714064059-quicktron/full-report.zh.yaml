  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算视角
        blocks:
          - type: paragraph
            body: >-
              Quicktron
              应放在仓储自动化中分析，但并非每一个公开自动化估算都同等对应其收入机会。最宽的类别包括配送和履约流程中使用的货到人系统、自主移动机器人、AGV、AS/RS、分拣、仓储软件及相关实施服务。这个边界排除了通用干线货运、仓储流程之外的纯工厂地面自动化，以及没有内部物流功能的企业软件。在这个宽市场里，Quicktron
              更靠近仓储机器人和移动自动化层，而不是完整自动化技术栈。公开的 2026 年总仓储自动化估算大致集中在 $27.46 billion 到 $36.43 billion 之间，取决于覆盖范围和方法；Fortune
              Business Insights 则把 2026 年仓储机器人子集放在 $7.35 billion。正确结论不是挑一个醒目的
              TAM，而是保留分层市场结构：广义仓储自动化是伞形需求，仓储机器人是更贴近产品的支出池，移动机器人则是 Quicktron 这类供应商所处的最快变动运营细分。
