      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 建议
      - 置信度
      - 风险评级
      - 估值立场
      - 决策含义
    rows:
      - - 建设性 / 有条件投资
        - 中
        - 中高
        - 价格敏感；不透明度和结构风险必须换来折价
        - 只有价格和条款能补偿隐藏经济性时才推进
      - - 如估值激进，观察 / 跟踪
        - 中
        - 高
        - 不能只凭公开证据给软件式溢价背书
        - 宁愿争取接触和持续跟踪，也不要追逐过热叙事
    notes: 本表将公司质量与入场纪律拆开。
    claimRefs:
