      - number: '1.4'
        title: 商业验证、里程碑连续性和第一章风险框架
        blocks:
          - type: paragraph
            body: >-
              商业层面，Quicktron 已有足够具名部署证据，可以跨过「这家公司真实吗？」这道门槛。官方客户故事和伙伴报道点名 Coupang、Radial Europe、Cubyn、Mercado
              Libre、Murata Manufacturing 和 7-Eleven，The Standard 又把 Huawei、Xiaomi 和 AP Moller Maersk 加入可见客户基础。仅 Radial
              项目本身就是有分量的第一章证据：Automated Warehouse Online 称 Quicktron 向荷兰一个由 Dematic 编排的系统供应 299 台 AGV，覆盖 45 个拣选包装站和 10
              个转运站。Prism 的北美合作公告和 Quicktron 的 MODEX 2026 首秀也显示，公司正试图把硬件可信度转化为中国以外更宽的渠道杠杆。


              不过，亮眼客户 Logo 并不能消除风险。SmartLoadingHub 的 IPO 报道称，投资人必须检验软件附加率、服务组合、国际毛利率和跨境合规；CMRA 的 2025
              年行业综述则认为，即便是领先移动机器人供应商，盈利能力仍是最关键的未解题。这些警示与 Quicktron
              当前公开记录中最大的缺口一致：所审阅材料没有留下经审计收入、毛利率、现金流或董事会治理披露。公开里程碑连续性足以证明公司是一家有规模的私有玩家，且确有国际野心；但概览建议仍必须谨慎，因为公开市场承销最看重的数字仍然私有、摘要口径不一，或只能间接获得。
