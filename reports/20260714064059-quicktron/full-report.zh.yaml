      - number: '1.3'
        title: 资本形成、投资人组合和 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              官方和第三方来源共同支撑其真实的后期融资历史，但无法拼出干净的股权结构桥。Quicktron 自身里程碑显示，公司 2014 年获得天使轮，2015 年 Series A，2017 年由 Cainiao 和
              SBCVC 参与 Series B，2018 年由 CBDEIF 和 Shanghai Guohe Capital 参与 Series C，2020 年由 KION Group 和 Saudi Aramco
              关联资本参与 Series C+，同时扩大与 KION、Linde 和 Dematic 的战略关系。近期证据最扎实的是 2024 年 9 月 Series D：官方新闻稿、The Robot
              Report、Robotics & Automation Magazine、Circuit 和 CMRA 均确认 Quicktron 融资超过 US$100
              million，并计划将资金用于海外扩张和产品打磨。官方新闻稿列出 Golden Oriole Capital、FarGlory Group、Wuxi Liangxi 和 Weifang Yuanfei
              为共同领投方或关键参投基金。


              IPO 路径已经可见，但还未落定。SmartLoadingHub、The Standard、Investing.com 和 KR Asia 等引用 Bloomberg 的摘要均称 Quicktron 已在
              2025 年秘密递交香港 IPO，目标募资至少 US$100 million，上市时间最早可能在 2026 年；这些报道也强调，时间和规模仍在讨论中。同一组报道还把公司与 Alibaba 旗下 Cainiao
              以及 Saudi Aramco 关联基金联系起来，强化了 Quicktron 同时拥有物流战略和工业战略支持者的判断。承销难点在披露质量。Tracxn 的公开页面只显示一轮可见披露融资和 US$100
              million 总额，而 Medbot 和行业摘要暗示约 US$1 billion
              的独角兽估值以及额外融资活动。在公开申请证明或等价申报文件出现之前，公司可以被公平描述为一家后期私有机器人独角兽候选者，融资势头强，但公开估值和所有权透明度不完整。
