  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前收入和利润率
        - 经审计收入、毛利率，以及地域 / 业务线拆分
        - 判断价格与质量是否匹配的核心输入
        - 财务团队 / 申报文件或 NDA 材料包
      - - 软件附着和续约
        - 附着率、维护收入、cohort 扩张和续约机制
        - 决定价值更偏硬件，还是更像平台
        - RevOps + 财务 / 客户 cohort
      - - 集中度和伙伴经济性
        - Top-10 客户、站点集中度、直销 vs 伙伴来源订单
        - 决定下行韧性和定价权
        - 财务 + 销售运营 / 数据室
      - - 轮次结构
        - 新股 vs 老股、优先权、稀释、治理权利
        - 决定名义价格之外的实际投资者结果
        - 法务 + 财务 / 交易文件
      - - 西方和跨国客户证明
        - 带 KPI 的 EU / 北美 / 全球客户参考部署
        - 验证全球化叙事是否可迁移、可持续
        - 客户尽调 + 背调电话
      - - 运营韧性
        - 正常运行时间、事故、MTBF / MTTR 和支持指标
        - 关系到战略故事能否转成可持续回报
        - 支持 / 运营尽调
    notes: 这些要求是把战略质量转成可定价投资观点的最低输入。
