      - number: '2.3'
        title: 增长驱动和技术组合
        blocks:
          - type: paragraph
            body: >-
              即便分析机构和行业来源的顶层 TAM 估算不一致，最强市场驱动因素仍相当一致。劳动力稀缺、工资压力上升、配送时效预期缩短，以及不持续增加地面面积也要提升吞吐量，是反复出现的需求锚点。Mordor、Fortune
              和 Global Market Insights 都把机器人、AI 和软件编排视为提高订单履约速度、降低运营成本的实际路径；Roland Berger 则认为，软件和 AI
              正从外围附加项变成仓储价值创造的核心。移动自动化是 Quicktron 所在类别最重要的技术趋势。Interact Analysis 称移动机器人收入应从 2024 年略低于 $5 billion 增至 2030
              年 $14 billion，CAGR 为 19%；Roland Berger 另行预测 2025 至 2030 年移动自动化 CAGR 约 30%。产品组合也在变化：随着 AMR 上升，AGV
              收入份额下降，订单履约机器人占出货量的比例提高。对 Quicktron 来说，市场增长不只是整体仓储自动化变多，也意味着支出正在流向更灵活、由软件驱动、越来越接近其核心供给的系统。
