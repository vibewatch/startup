  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：建设性看待，但必须严守价格纪律
        blocks:
          - type: paragraph
            body: >-
              Quicktron 的公开证据支持正面的公司质量判断，也支持有条件的估值判断。正方投资逻辑很强：仓储自动化仍是重要品类，Quicktron
              有真实具名客户，产品栈覆盖多种流程，管理层也似乎在向机构级国际化运营搭建。反方逻辑同样清楚：收入、毛利率、软件附加率、客户集中度、续约行为和轮次结构仍未公开。因此，正确建议不是无条件投资，而是有条件的投资。投资人可以继续建设性看待这项资产，同时拒绝按所有隐藏指标都已被证明的价格买入。落到执行上，就是把战略相关性和价格拆开。Quicktron
              也许值得关注、接触和认真尽调，但仅靠公开证据，不足以支持支付区间顶部的机器人溢价，也不足以因为公司有规模叙事和保密 IPO 故事，就给它软件式估值。
