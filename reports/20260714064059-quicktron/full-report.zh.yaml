      - number: '4.4'
        title: 财务结论和尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论必须保持谨慎。公开证据足以说明 Quicktron
              不是一个肤浅的机器人故事：它有真实部署、多层收入模型、反复资本需求，以及明确的国际扩张投入。但这些证据不足以承销收入质量、毛利耐久性或独立资本充足性。保留的公开材料没有经审计收入、没有披露毛利率、没有现金余额、没有月度烧钱、没有合同组合、没有营运资本桥，也没有硬件、软件和服务之间的清晰拆分。即便同业视角也有两面性。Geek+
              显示，头部中国 AMR 玩家可以做到数亿美元收入，却仍承受利润压力；AGVNetwork 更尖锐的评论强调，公开市场会审查现金消耗和营运资本，而不只是收入增长。Quicktron 围绕 HKEX
              秘密递表的叙事让这一点更重要。在出现申报文件包或等价经审计财务材料之前，公司应被视为一家有规模但财务仍不透明的自动化供应商；其投资论点高度依赖仍未公开的信息。
