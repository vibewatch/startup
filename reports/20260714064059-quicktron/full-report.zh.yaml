  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 版图类别和竞争集合
        blocks:
          - type: paragraph
            body: >-
              理解 Quicktron 的竞争集合，按待完成任务划分比按「仓储机器人」这个宽标签划分更清楚。最直接重叠的是向零售、电商、3PL 和制造仓库销售货到人、订单到人、存储和内部物流系统的供应商。这使
              Geek+、Hai Robotics、Locus Robotics、GreyOrange 和 Exotec 在日常采购讨论中最接近 Quicktron，尽管它们的架构差异很大。Geek+ 和 Quicktron
              都是宽产品组合的中国 AMR 玩家。Hai Robotics 更专注于箱体搬运和高密度存储。Locus 更聚焦柔性多流程 AMR 和编排。GreyOrange 更强调跨混合车队的软件驱动编排。Exotec
              以结构化 Skypod 取货为中心。MiR 和 ForwardX 的意义不同：MiR 更接近内部运输既有厂商和渠道平台，ForwardX 则是崛起中的中国 AMR 挑战者，ROI
              信息传递很强。这个领域还包括替代方案，如人工仓库、自建、固定自动化，以及 Amazon 等运营商的自有系统；这些系统不向第三方开放，但仍会塑造买方预期。
