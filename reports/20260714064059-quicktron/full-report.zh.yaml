      - number: '8.2'
        title: 融资背景和可比锚点支持宽区间，而非点估值
        blocks:
          - type: paragraph
            body: >-
              融资背景说明公司确有价值，但不能给出精确价格。Quicktron 超过 $100 million 的 Series D 融资、后期阶段状态和独角兽表述，意味着到 2024
              年，公司已经跨过重要的私募市场门槛。MedBot 的简介明确称，公司在 2024 年 Series D 融资后达到 $1 billion 估值；Tracxn 也确认其 Series D
              阶段和融资历史，但大多数基准细节仍在付费墙后。这足以建立一个近似底部的背景，却不是 2026 年的出清价格。可比锚点把区间拉宽，而不是收窄。New Market Pitch 的机器人估值汇总把 Geek+ 放在约
              $4.1 billion，Exotec 放在约 $1.8 billion 至 $2.3 billion；公开市场参考则显示，2026 年 7 月 Symbotic 约为 $25.6 billion，Ocado
              约为 $1.9 billion。这些数字证明该品类能获得大额估值，也显示一旦披露、商业模式、客户质量和盈利能力不同，估值离散度会很大。Quicktron 今天显然不是 Symbotic
              式公开基准；在经济性可见度大幅改善之前，公开证据也不支持把它放到已披露仓储机器人可比样本的最顶端附近。
