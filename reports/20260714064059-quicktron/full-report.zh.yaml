chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、版图和商业模式
        blocks:
          - type: paragraph
            body: >-
              Quicktron 首先应被理解为一家后期仓储自动化供应商，而不是泛泛的机器人创业公司。其当前英文关于页面称公司成立于 2014
              年、总部位于上海；网站和产品页则围绕内部物流自动化、自主移动机器人，以及由软件驱动的仓储执行来定义业务。保留的官方材料显示产品范围很宽：货到人系统、料箱和周转箱自动化、托盘和货架移动、自主叉车，以及
              RCS、WCS、WES 等控制软件层。产品宽度之所以重要，是因为 Quicktron 已不再推销单一明星机器人，而是在推销一套模块化仓储操作架构，可以用同一套技术栈覆盖订单履约和制造物流。


              公开规模指标很强，但彼此尚未完全对齐。当前关于页面展示 1,000+ 客户、45,000+ AMR 安装量、20+ 国家、600+ 专利申请和 700+ 员工，同页正文仍提到已部署机器人单元超过 35,000
              台。RoboticsTomorrow 的 2026 年 3 月 MODEX 报道引用了截至 2025 年 42,000+ 台机器人，Investing.com 的 IPO 摘要则引用 30,000+
              台机器人。这些数字都指向同一方向——装机规模可观——但显然来自不同报告日期或口径。因此，第一章稳妥的结论是：Quicktron
              确实具备全球部署宽度，但尚未给出单一、经审计且可对账的装机指标。官网还列出美国、英国、德国、澳大利亚、韩国、日本和新加坡子公司，以及上海生产设施，支撑了另一个判断：国际执行已经是商业模式核心，而不是可有可无的出口附加项。
