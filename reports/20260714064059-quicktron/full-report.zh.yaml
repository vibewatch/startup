      - number: '7.4'
        title: 财务模型风险与监测触发点
        blocks:
          - type: paragraph
            body: >-
              最大的投资风险也许仍是财务转化，而不是需求创造。Quicktron
              已经融到大额私募资金，声称研发投入很重，也明显在投入全球服务和合规能力。这组动作可以拼出可信的长期平台，也会带来营运资本拖累、毛利稀释和连续融资风险——如果软件附加率和重复站点经济性提升不够快。Geek+
              给出了最清晰的外部预警：即便是这个赛道资金最充足、国际化程度最高的中国 AMR
              玩家，进入公开市场时仍要接受毛利和烧钱审视。龙头尚且如此，规模更小或披露更少的同行就不该被自动宽待。因此，实际尽调任务是尽早定义打破投资假设的触发点：融资失败或延迟、客户集中度比预期更差、标杆站点出现安全或可用性事故，或者有证据显示软件和服务没能把毛利抬到硬件偏重的系统业务可承受水平之上。Quicktron
              的真实进展足以值得认真关注，但在这些问题用经审计数据和运营证据回答之前，剩余暴露仍显得中高。
