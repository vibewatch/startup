- id: TE005
  title: Technical diligence blocker table
  columns:
  - Question
  - Public evidence today
  - Status
  - Why it matters
  - Requested proof
  rows:
  - - How reproducible are accuracy and efficiency claims?
    - Official pages cite 99.99% accuracy and 3-4x efficiency gains
    - Unverified publicly
    - Performance marketing can mask site-to-site variance
    - Provide benchmark definitions and realized customer KPI distributions
  - - What is the software architecture and API surface?
    - WES/WCS/RCS/LES are named; no detailed docs retained
    - Missing
    - Integration complexity drives cost, timing, and lock-in
    - Provide architecture docs, API specs, and connector inventory
  - - What are fleet uptime and service metrics?
    - No retained public uptime history by product family
    - Missing
    - Availability determines labor savings credibility
    - Provide MTBF, MTTR, uptime, and spare-part statistics
  - - How mature are cybersecurity and privacy controls?
    - No retained public security architecture or certification detail
    - Missing
    - Warehouse systems increasingly touch customer data and operational continuity
    - Provide ISO/SOC evidence, network model, and incident history
  - - How defensible is the IP stack?
    - QuickBin page cites US patents; broader IP architecture remains thin publicly
    - Partial
    - Patents alone do not prove durable technical moat
    - Provide patent map, claim scope, and infringement / freedom-to-operate review
  notes: The public corpus is sufficient to establish product reality, but not enough to underwrite engineering durability without management materials.
