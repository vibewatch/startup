- id: robot-families-software-and-safety-stack
  title: Robot families, software, and safety stack
  body: The retained pages provide more technical detail than Quicktron’s financing narrative but still at a product-marketing level. M-Series pages show payload classes from small-load robots up through 1,500 kg handling. Bin-to-person and QuickBin pages describe tall C56 robots, mini M5 robots, modular gripper choices, and 12-meter vertical storage logic. Pallet and shelf pages add heavier payloads, CE and PLd safety references, and mixed navigation modes including QR-code, inertial, SLAM, and hybrid approaches. The software story is equally important. Quicktron repeatedly names WES, WCS, RCS, and LES as the systems that connect ERP, WMS, MES, SCADA, and shop-floor execution. Public materials also claim collision-free path planning, dynamic allocation, multi-robot collaboration, ABC inventory logic, and demand-based storage optimization. The picture is not of frontier robotics research disclosure; it is of a mature application stack aimed at reliability, integration, and multi-scenario
    orchestration.
