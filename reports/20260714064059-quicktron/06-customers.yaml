- id: retention-durability-and-partner-dynamics
  title: Retention, durability, and partner dynamics
  body: 'Public retention evidence is partial but not absent. There are visible land-and-expand cues: the Quicktron blog frames Cubyn as a phase-two automation expansion, the Radial case explicitly discusses future scalability, and multiple pages stress easy robot-count expansion as volume changes. These are positive signs, but they are not substitutes for disclosed NRR, GRR, renewal rates, or contract durations. Publicly, Quicktron’s customer narrative also depends meaningfully on channel and integration partners. The Prism partnership markets Quicktron as part of a broader warehouse-optimization offer in North America, while Radial’s deployment clearly involved Dematic as the system and automation partner. That partner layer can accelerate access to larger accounts and reduce buyer friction, but it also means some customer ownership may sit in multi-party relationships rather than direct vendor contracts alone. The result is a customer base that appears operationally durable, yet still
    commercially opaque in the dimensions investors care about most: repeat purchasing behavior, wallet share growth, and account stickiness over time.'
