- id: customer-verdict-and-concentration-risk
  title: Customer verdict and concentration risk
  body: 'The customer verdict is favorable on existence and reference quality, cautious on monetization quality. Quicktron has enough public proof to establish that it sells into serious operators with real throughput demands, difficult workflow requirements, and global site footprints. That is a better starting point than many private robotics vendors can show. However, the same public corpus does not reveal how much revenue is concentrated in a handful of large 3PL and e-commerce operators, whether manufacturing accounts are expanding quickly enough to diversify the base, or how frequently early customers add sites after initial go-live. The strongest external corroboration today belongs to Radial and the broader Quicktron global-reference narrative, while many other cases remain largely company-authored. As a result, the central diligence challenge is not customer existence but customer quality: concentration, renewability, expansion economics, and procurement dependence remain materially
    under-disclosed.'
  claimRefs:
  - CU027
  - CU028
  - CU034
  - CU035
