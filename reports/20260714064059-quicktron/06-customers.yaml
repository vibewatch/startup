- id: TU004
  title: Retention and partner dynamics table
  columns:
  - Issue
  - Public evidence
  - Status
  - Why it matters
  - Diligence ask
  rows:
  - - Repeat purchase / expansion
    - Cubyn phase-two framing; Radial scalability language
    - Partial
    - Site expansion is a major value driver in enterprise automation
    - Request cohort expansion and multi-site penetration
  - - Renewal / churn
    - No public GRR, NRR, or churn data retained
    - Missing
    - Durability cannot be inferred from logos alone
    - Request renewal schedule and churn history
  - - Contract duration
    - No retained public contract terms
    - Missing
    - Long implementation cycles can hide weak economic durability
    - Request master service terms and project lifecycle
  - - Partner dependence
    - Prism and Dematic involvement visible
    - Material
    - Channel leverage can help or dilute direct customer ownership
    - Request direct vs partner-sourced bookings split
  - - Customer satisfaction
    - Case-study quotes and outcomes exist; no systematic NPS or SLA disclosures
    - Partial
    - Referenceability matters for land-and-expand motion
    - Request NPS, SLA attainment, and reference-customer pipeline
  notes: The main retention problem is not absence of positive signals; it is absence of standardized cohort and contract disclosure.
