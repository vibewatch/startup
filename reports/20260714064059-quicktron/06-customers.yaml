chapter:
  number: 6
  title: Customers
summary: 'Quicktron’s public customer record is stronger than its public financial record. The retained corpus supports a real, international enterprise base concentrated in logistics-heavy buyers: 3PLs, e-commerce operators, retail fulfillment, and selected manufacturing sites. Named deployments such as Coupang, Radial, Cubyn, Cainiao, 4PX, Maersk, CIRRO, and Stellantis show that Quicktron is already selling into operationally serious environments rather than living on small pilots. The strength of the customer story is production proof at site level. The weakness is commercial opacity: public sources reveal throughput, robots, and labor savings far more readily than contract length, expansion cohorts, churn, or concentration by revenue.'
sections:
- id: customer-base-segmentation-and-footprint
  title: Customer base segmentation and footprint
  body: 'Quicktron’s customer footprint looks broad in workflow terms but not evenly distributed across end markets. The official cases index, products pages, and named deployment pages show a customer base concentrated first in 3PL and e-commerce fulfillment, then extending into retail, cross-border logistics, automotive, food and beverage, and selected industrial manufacturing workflows. Geography is also notably diverse. Official case materials show deployments or references across China, South Korea, the Netherlands, France, the UK, the Americas, Japan, Germany, the UAE, and Southeast Asia, while the MODEX 2026 article and corporate pages position Quicktron as a global provider serving more than 1,000 customers across more than 20 countries and regions. This matters because customer breadth is not just a vanity metric in warehouse robotics. It implies the company can sell into different buyer-user-payer combinations: warehouse operators, 3PLs, omnichannel brands, manufacturing plants,
    and system integrators who influence purchasing decisions. Publicly, however, the proof base still tilts toward logistics-intensive customers rather than a fully balanced cross-industry mix.'
