- id: TU005
  title: Concentration and customer-quality risk table
  columns:
  - Risk
  - Public clue
  - Current judgment
  - Why it matters
  - Needed evidence
  rows:
  - - 3PL / e-commerce concentration
    - Many highest-detail public references are logistics operators
    - Meaningful
    - A concentrated vertical mix can amplify cyclical exposure and pricing pressure
    - Revenue by vertical and customer concentration schedule
  - - Large-account dependence
    - Flagship sites are very large and operationally complex
    - Possible
    - A few whale accounts can dominate service and implementation capacity
    - Top-10 customer revenue and margin contribution
  - - Partner routing
    - Dematic and Prism are visible in external-facing narratives
    - Meaningful
    - Partner intermediation changes go-to-market economics and control
    - Bookings sourced direct vs channel
  - - Reference asymmetry
    - Radial is well corroborated externally; many others remain company-authored
    - Meaningful
    - External validation quality varies across account set
    - Third-party customer references and independent case audits
  - - Commercial opacity
    - Operational metrics dominate over spend or contract data
    - High
    - Customer existence does not equal high-quality recurring revenue
    - Account-level LTV, expansion, and payback metrics
  notes: Quicktron’s customer base appears real and valuable, but concentration risk cannot be underwritten from public operations metrics alone.
