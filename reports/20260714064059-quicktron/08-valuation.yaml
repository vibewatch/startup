- id: TV005
  title: Thesis-break and discipline triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Disclosure disappointment
    - Filing or data room shows weak margins, weak attach, or high concentration
    - Breaks quality-premium thesis
    - Re-price or walk away
  - - Aggressive pricing
    - Seller or market implies valuation materially above upper scenario without evidence
    - Eliminates return cushion
    - Monitor instead of chase
  - - Operational credibility shock
    - Safety or uptime issue at flagship site or poor multinational references
    - Undermines customer-quality argument
    - Reduce conviction and multiple
  - - Structure overhang
    - Preferences, secondary-heavy terms, or governance rights are worse than expected
    - Cuts common-equity upside
    - Demand structural protection or pass
  - - Financing slippage
    - IPO or next financing delayed on weak terms
    - Questions exit readiness and market appetite
    - Lower probability on bull case
  notes: These triggers convert broad strategic interest into concrete valuation discipline.
