- id: scenario-view-and-valuation-ranges
  title: Bull, base, and bear cases depend more on hidden metrics than on market size
  body: The valuation debate should therefore be scenario-led. The bull case assumes that Quicktron’s software layer truly lifts the economics above a service-heavy systems business, that global customers expand across sites and workflows, and that IPO-quality disclosures reveal healthier margin and concentration dynamics than skeptics expect. In that case, valuation can move closer to the stronger private-unicorn and disclosed-public-comp context. The base case assumes that Quicktron is strategically real and commercially relevant, but still prices it as a capital-intensive industrial automation platform with meaningful software upside rather than as a pure software company. That supports a measured step-up from the unicorn floor without endorsing a full re-rating into the top disclosed comp tier. The bear case is not that the market disappears. It is that hidden customer concentration, weak software attach, heavy service burden, or delayed financing turns a strong narrative into a lower-quality
    systems model. That case would leave the right valuation much closer to the 2024 unicorn anchor than to the higher robotics comps. Because public evidence is uneven on the most important drivers, confidence should remain moderate rather than high.
