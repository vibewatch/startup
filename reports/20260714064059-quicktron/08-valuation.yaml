- id: exit-readiness-and-final-asks
  title: Exit readiness is credible, but underwriting readiness still depends on missing core data
  body: 'Exit logic is plausible on more than one path. A Hong Kong IPO path is already visible from the confidential filing reports. A sponsor-to-sponsor or strategic path is also imaginable because warehouse automation remains strategically relevant and Quicktron has evidence of customer scale, product breadth, and international ambition. But exit readiness is not the same as valuation readiness. Before blessing a premium mark, an investor should demand a short list of decisive proofs: audited revenue and gross margin by line, software attach and renewal behavior, top-customer exposure, partner-vs-direct economics, round structure and liquidation preferences, and evidence that Western or multinational reference deployments are strong enough to travel across regions. Robotics.press is useful here because it pushes against the easy story: the company may have certifications and a Texas foothold, but public Western proof still lags the global ambition. That does not kill the thesis. It just
    means the final valuation call should be made with structure and downside discipline, not with narrative enthusiasm.'
