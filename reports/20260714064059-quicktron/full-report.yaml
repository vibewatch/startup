              capability to support overseas credibility. The September 2024 Series D announcement reinforces this
              picture: management explicitly said the funds would be used for global market expansion, local
              cooperation, and product optimization rather than for a simple balance-sheet clean-up. Those details
              matter because they imply persistent spending on product iteration, customer engineering, certification,
              field service, and working capital tied to international deployments. Filing evidence from Bizapedia
