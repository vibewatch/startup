      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict has to stay cautious. There is enough public evidence to conclude that Quicktron is
              not a superficial robotics story: it has real deployments, a multi-layer revenue model, repeat need for
              capital, and explicit international scaling investments. But there is not enough to underwrite revenue
              quality, margin durability, or standalone capital adequacy. The retained public corpus contains no audited
              revenue, no disclosed gross margin, no cash balance, no monthly burn, no contract mix, no working-capital
              bridge, and no clean split between hardware, software, and services. Even the peer lens cuts both ways.
              Geek+ shows that a top Chinese AMR player can produce hundreds of millions of dollars of revenue and still
              remain under profit pressure; AGVNetwork’s harsher commentary underscores that public markets will
              scrutinize cash burn and working capital, not just topline growth. Quicktron’s confidential-HKEX narrative
              makes this even more important. Until there is a filing package or equivalent audited financial deck, the
              company should be treated as a scaled but still financially opaque automation vendor whose investment case
              depends heavily on information that is still private.
