  - id: TV005
    title: Thesis-break and discipline triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Disclosure disappointment
        - Filing or data room shows weak margins, weak attach, or high concentration
        - Breaks quality-premium thesis
        - Re-price or walk away
      - - Aggressive pricing
        - Seller or market implies valuation materially above upper scenario without evidence
        - Eliminates return cushion
        - Monitor instead of chase
      - - Operational credibility shock
        - Safety or uptime issue at flagship site or poor multinational references
        - Undermines customer-quality argument
        - Reduce conviction and multiple
      - - Structure overhang
        - Preferences, secondary-heavy terms, or governance rights are worse than expected
        - Cuts common-equity upside
        - Demand structural protection or pass
      - - Financing slippage
        - IPO or next financing delayed on weak terms
        - Questions exit readiness and market appetite
        - Lower probability on bull case
    notes: These triggers convert broad strategic interest into concrete valuation discipline.
    claimRefs:
      - CV023
      - CV028
      - CV029
      - CV030
      - CV035
      - CV038
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue and margin
        - Audited revenue, gross margin, and geography / line breakdown
        - Core input for any price-to-quality judgment
        - Finance team / filing or NDA package
      - - Software attach and renewals
        - Attach rates, maintenance, cohort expansion, and renewal mechanics
        - Determines whether value is hardware-heavy or platform-like
        - RevOps + finance / customer cohorts
      - - Concentration and partner economics
        - Top-10 customers, site concentration, direct vs partner-sourced bookings
        - Determines downside resilience and pricing power
        - Finance + sales ops / data room
      - - Round structure
        - Primary vs secondary, preferences, dilution, governance rights
        - Defines actual investor outcome beyond headline price
        - Legal + finance / transaction docs
      - - Western and multinational proof
        - Reference deployments with KPIs in EU / North America / global accounts
        - Tests whether global story is portable and durable
        - Customer diligence + reference calls
      - - Operational resilience
        - Uptime, incident, MTBF / MTTR, and support metrics
        - Important to convert strategic story into sustainable returns
        - Support / operations diligence
    notes: These asks are the minimum needed to convert strategic quality into a priced investment view.
    claimRefs:
      - CV003
      - CV010
      - CV037
      - CV038
      - CV039
      - CV040
