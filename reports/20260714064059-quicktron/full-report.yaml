      - number: '1.2'
        title: Founder bench, leadership surface, and operating model
        blocks:
          - type: paragraph
            body: >-
              The clearest named leader in the retained corpus is founder and chief executive Yang Wei. Official
              financing and interview materials repeatedly identify Yang as founder and CEO, and his 2025 interview is
              important because it exposes the operating logic behind Quicktron's current shape. Yang describes two
              major scenarios — order-fulfillment systems for retail distribution and material-handling systems for
              manufacturing logistics — as the strategic backbone of the company, with four business pillars in place
              since 2021 and an operating model that effectively uses China as the training ground while pursuing
              monetization in overseas markets. That makes Quicktron's management thesis less about inventing a new
              robot every year and more about matching modular products, software, and service delivery to different
              warehouse workflows across regions.


              Publicly visible leadership breadth beyond Yang is still thinner than investors would want before
              underwriting a late-stage IPO. The 2024 Series D release names Xie Xuan as partner and CFO, and
              third-party database snapshots surface Zhang Clint as supply-chain director and Jill Stelfox as director
              of the Texas legal entity filed in October 2024. Those are useful signals that the company is building an
              international operating bench and legal infrastructure, but they do not amount to a full governance
              record. The official site does not provide a public board list or committee structure, and the retained
              public sources do not disclose an audited governance package comparable to a public-company prospectus.
              The interview also underscores that internationalization is operationally expensive: Yang says Quicktron
              has had to invest in local service teams, partner networks, manufacturing capabilities, and
              region-specific compliance, including tens of millions of renminbi to satisfy CE-related requirements. In
              other words, the leadership story is credible on execution intent but still under-disclosed on formal
              governance.
