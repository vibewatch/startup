      - number: '3.2'
        title: Direct peer differentiation and workflow fit
        blocks:
          - type: paragraph
            body: >-
              The strongest direct competitors separate along workflow design and software philosophy. Quicktron’s
              official corpus shows a broad product stack spanning goods-to-person, rack-to-person, point-to-point smart
              moving, pallet and material handling, plus WES, WCS, and RCS software. Geek+ is the closest breadth match:
              it markets picking, sorting, storage, replenishment, pallet handling, and internal transport and now
              carries the trust signal of a July 2025 HKEX listing. Hai Robotics takes a narrower but sharper angle
              around case-handling ASRS and high-density storage, which can be powerful where tote and bin density
              dominate buyer requirements. Locus differentiates through LocusONE orchestration, rapid deployment, and
              Robots-as-a-Service economics instead of dense structured storage. GreyOrange positions even more
              aggressively around orchestration software, multi-agent decisioning, and vendor-agnostic execution.
              Exotec’s Skypod system is distinct again: it is closer to a vertically climbing structured retrieval
              platform with tight WES integration. ForwardX matters as a challenger because it claims strong ROI and
              broad AMR deployments, even if its public global reach looks smaller than the largest category leaders.
