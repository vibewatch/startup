  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape classes and competitive sets
        blocks:
          - type: paragraph
            body: >-
              Quicktron’s competitor set is easiest to understand by job-to-be-done rather than by the broad label
              “warehouse robotics.” The most direct overlaps are vendors selling goods-to-person, order-to-person,
              storage, and intralogistics systems into retail, e-commerce, 3PL, and manufacturing warehouses. That puts
              Geek+, Hai Robotics, Locus Robotics, GreyOrange, and Exotec closest to Quicktron in day-to-day procurement
              discussions, though they differ materially in architecture. Geek+ and Quicktron are broad Chinese AMR
              portfolios. Hai Robotics is more specialized around case-handling and dense storage. Locus is more focused
              on flexible multi-workflow AMRs and orchestration. GreyOrange leans harder into software-led orchestration
              across mixed fleets. Exotec centers on structured Skypod retrieval. MiR and ForwardX matter differently:
              MiR is closer to an internal-transport incumbent and channel platform, while ForwardX is a rising Chinese
              AMR challenger with strong ROI messaging. The field also includes substitutes such as manual warehouses,
              internal build, fixed automation, and proprietary systems from operators like Amazon that are not
              available to third parties but still shape buyer expectations.
