      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Best public answer: quality yes, price matters more'
            body: >-
              Quicktron looks like a real late-stage automation asset, but public evidence alone does not justify paying
              as if all economics and concentration questions are already solved.
            calloutType: recommendation
