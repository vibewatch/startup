  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Quicktron should be analyzed inside warehouse automation, but not every published automation estimate is
              equally relevant to its revenue opportunity. The broadest category includes goods-to-person systems,
              autonomous mobile robots, AGVs, AS/RS, sortation, warehouse software, and related implementation services
              used inside distribution and fulfillment workflows. That boundary excludes generic linehaul freight, pure
              factory-floor automation outside warehouse workflows, and enterprise software with no intralogistics
              function. Within that broad market, Quicktron sits closer to the warehouse-robotics and mobile-automation
              layers than to the entire automation stack. Public 2026 estimates for total warehouse automation cluster
              between roughly $27.46 billion and $36.43 billion depending on coverage and methodology, while Fortune
              Business Insights places the warehouse-robotics subset at $7.35 billion in 2026. The right conclusion is
              not to pick one headline TAM, but to preserve the layered market structure: broad warehouse automation as
              umbrella demand, warehouse robotics as the more product-relevant spend bucket, and mobile robotics as the
              fastest-moving operating segment for vendors like Quicktron.
