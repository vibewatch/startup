chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Quicktron should be understood first as a late-stage warehouse-automation vendor rather than as a generic
              robotics startup. Its current English about page says the company was founded in 2014 and is headquartered
              in Shanghai, while its website and product pages frame the business around intralogistics automation,
              autonomous mobile robots, and software-led warehouse execution. The retained official corpus shows a broad
              product scope: goods-to-person systems, bin and tote automation, pallet and shelf movement, autonomous
              forklifts, and control software layers such as RCS, WCS, and WES. That product breadth matters because
              Quicktron is no longer pitching a single hero robot; it is pitching a modular warehouse operating
              architecture that can cover order fulfillment and manufacturing logistics under one stack.


              Public scale indicators are strong but not perfectly reconciled. The current about page displays 1,000+
              clients, 45,000+ AMR installations, 20+ countries, 600+ patent applications, and 700+ employees, while the
              prose on the same page still references more than 35,000 deployed robotic units. RoboticsTomorrow's March
              2026 MODEX coverage cited 42,000+ robots as of 2025, and Investing.com's IPO summary cited 30,000+ robots.
              Those figures point in the same direction — material installed-base scale — but they are clearly drawn
              from different reporting dates or definitions, so the safe chapter-one conclusion is that Quicktron has
              real global deployment breadth without yet offering a single reconciled audited installed-base metric. The
              official site also lists subsidiaries in the U.S., UK, Germany, Australia, South Korea, Japan, and
              Singapore, plus production facilities in Shanghai, which supports the claim that international execution
              is now core to the business model rather than an optional export add-on.
