      - number: '4.2'
        title: Public traction and the peer-disclosure lens
        blocks:
          - type: paragraph
            body: >-
              Quicktron’s own public traction metrics are real but incomplete. Official pages cite 1,000-plus clients,
              45,000-plus robot deployments, more than 700 employees, and a large international footprint, yet none of
              those numbers reveal revenue, backlog, gross margin, cash conversion, or recurring software mix. The best
              available public lens therefore comes from Geek+, the closest newly public Chinese AMR comp. KrASIA’s
              post-IPO analysis says Geek+ generated RMB 2.409 billion of 2024 revenue, delivered 56,000 units by
              year-end 2024, derived over 70% of revenue from overseas markets, and still posted RMB 832 million of net
              loss even as adjusted losses narrowed sharply. That is strategically important because it shows what “real
              scale” in this category can look like financially: strong growth, international service intensity,
              meaningful backlog, improving margin quality, and yet still non-trivial losses before full breakeven.
              Quicktron may not be identical to Geek+, but the comparison is directionally useful. It argues against
              treating installed-base or customer-count claims as proof of revenue quality, and it suggests that
              Quicktron’s late-stage capital raises should be read as fuel for international operating leverage rather
              than as a signal that the economic model is already fully self-funding.
