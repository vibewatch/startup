  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: constructive, but only with strict price discipline'
        blocks:
          - type: paragraph
            body: >-
              Quicktron’s public evidence supports a positive company-quality view and a qualified valuation view. The
              thesis side is strong: warehouse automation remains an important category, Quicktron has real named
              customers, the product stack covers multiple workflows, and management appears to be building toward
              institutional-grade international operations. The anti-thesis is equally clear: revenue, gross margin,
              software attach, customer concentration, renewal behavior, and round structure remain private. That means
              the right recommendation is not an unconditional invest call. It is a conditional one. An investor can
              stay constructive on the asset while still refusing to pay as if all the hidden metrics are already
              proven. In practice, this means separating strategic relevance from price. Quicktron may deserve
              attention, access, and serious diligence, but public evidence alone does not justify paying a top-of-range
              robotics premium or a software-style valuation simply because the company has scale claims and a
              confidential IPO narrative.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
