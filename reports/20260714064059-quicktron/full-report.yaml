    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          IPO-quality disclosure is strong, software attach is high, global customers expand, and margins prove
          healthier than feared
        - Supports valuation near the upper private-unicorn band and toward stronger disclosed peer references
        - Disclosure disappointments or flagship operational issues could break the case
        - Possible, but dependent on hidden metrics improving confidence materially
      - - Base
        - >-
          Quicktron is a scaled but capital-intensive automation platform with meaningful software upside and moderate
          opacity discount
        - Supports a measured step-up above the 2024 unicorn floor without top-tier premium
        - Concentration or service intensity could still drag the mark down
        - Most consistent with current public evidence
      - - Bear
        - Customer concentration, heavy services, weak software attach, or delayed financing undermine the narrative
        - Valuation support sits near or only modestly above the 2024 unicorn anchor
        - Multiple compression and weak cash conversion
        - Cannot be ruled out without audited proof
    notes: Scenario logic is framed around what diligence could still discover, not around whether the market exists.
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV028
      - CV035
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Valuation / status
      - Relevance
      - Limitation
    rows:
      - - Quicktron 2024 unicorn anchor
        - Private valuation context
        - ~$1.0B profile-level anchor after Series D
        - Best public floor-like company-specific reference
        - Not a verified 2026 market-clearing price
      - - Geek+
        - Private/public hybrid comp
        - ~$4.1B in 2026 roundup; public listing and disclosed revenue/loss profile
        - Closest Chinese warehouse-robotics breadth peer with more disclosure
        - Still not a direct like-for-like mark for Quicktron
      - - Exotec
        - Private warehouse-automation comp
        - $1.8B-$2.3B in 2026 robotics valuation roundup
        - Useful private benchmark for high-quality automation narrative
        - Different architecture, service model, and disclosure base
      - - Symbotic
        - Public market cap
        - $25.6B July 2026 market cap
        - Upper-bound sentiment reference for highly valued warehouse automation
        - Much larger, public, and structurally different
      - - Ocado
        - Public market cap
        - $1.93B July 2026 market cap
        - Shows public automation value can sit much lower than hype narratives
        - Different business model and public-market history
      - - PitchBook unicorn tracker
        - Private-market context
        - Unicorn universe large but many values stale or unverified
        - Supports discounting unverified private marks
        - Not company-specific pricing
    notes: >-
      These anchors are context and guardrails, not a formula. The right comp lens is milestone- and
      business-model-adjusted.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample includes the cleanest company-specific private anchor, the nearest disclosed Chinese peer, one relevant
        private automation unicorn, two public market references, and a private-market caution source; it is not a full
        universe of robotics comps.
