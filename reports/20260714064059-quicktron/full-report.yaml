      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              The field’s main risk is convergence. Many vendors now promise fast retrofit deployment, software
              integration, labor reduction, and flexible scaling, which means basic AMR claims are becoming table
              stakes. Roland Berger’s market view is useful here: orchestration and software are increasingly where
              value accumulates, not just the robot chassis. That favors platforms like LocusONE, GreyMatter, Exotec’s
              Deepsky, and Quicktron’s WES/WCS/RCS stack, but it also means the competitive frontier shifts into
              integration quality, data, partner ecosystem, and deployment execution. Geek+ gains a trust and disclosure
              advantage from public-market status. Hai’s specialization may win dense case-handling environments. Locus
              reduces adoption friction with RaaS but may face imitation on flexibility messaging. GreyOrange’s
              vendor-agnostic posture broadens ecosystem fit but invites platform competition from WES and WMS
              incumbents. Exotec’s distinctive geometry creates differentiation but narrows its ideal use cases.
              Quicktron therefore looks strategically credible, yet its moat appears situational rather than absolute:
              strongest where buyers want a broad mobile-automation portfolio plus software, weaker where a customer
              strongly prefers specialized dense storage, an orchestration-first platform, or a public-market leader
              with clearer disclosure.
