      - number: '2.2'
        title: Buyers, users, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The market is bought through an operations problem, not through abstract interest in robotics. E-commerce
              retailers, 3PLs, parcel operators, manufacturing warehouses, and pharma or cold-chain sites are the most
              visible demand clusters in the retained corpus. Mordor identifies retail and e-commerce as 28.41% of 2025
              spend and 3PLs as 38.96% by ownership model, while Fortune’s warehouse-robotics lens places e-commerce at
              47.21% of 2026 demand. In practice, warehouse managers, industrial engineers, and fulfillment leaders are
              usually the day-to-day users, but budget authority often sits with logistics leadership, the COO,
              business-unit finance, or a 3PL operator that must protect service levels and labor productivity. Adoption
              tends to begin where fulfillment congestion, labor shortages, or SKU complexity make manual workflows too
              slow or too inconsistent, then expands toward software orchestration and broader facility redesign once a
              pilot zone proves throughput, accuracy, and payback. That budget path matters for Quicktron because its
              sales motion likely has to win both local operations teams and senior capital allocators.
