- id: gtm-pricing-and-switching-cost
  title: GTM, pricing model, and switching cost
  body: 'Public pricing transparency is poor across the field, which itself is competitively meaningful. Most vendors sell through configured project scopes, pilots, or enterprise subscriptions rather than published unit prices. Locus is the clearest exception in commercial posture because its leadership openly emphasizes RaaS, smaller initial deployments, and elastic scaling without large upfront capex. MiR also stands out on route to market because it explicitly markets through an extensive distributor and systems-integrator network spanning more than 60 countries and 160-plus solution modules. Geek+ says certified local partners handle installation and go-live, while Quicktron’s earlier disclosures emphasize regional subsidiaries and international operating entities. Exotec’s model is differentiated in another way: it offers a single-vendor stack with contractually guaranteed performance and long-term service commitments. These differences shape switching cost. Dense structured systems
    and single-stack orchestration environments can create stickier operational lock-in, while flexible AMR fleets can be easier to pilot and expand but may face more vendor overlap during initial selection.'
