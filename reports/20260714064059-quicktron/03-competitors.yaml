  evidenceGaps:
  - type: missing-data
    severity: material
    topic: realized-pricing
    missingEvidence: Realized pricing, discount levels, and contract economics across Quicktron and its main rivals.
    whyItMatters: Public ROI claims are abundant, but without realized pricing it is hard to compare true competitiveness, margin pressure, or payback quality.
    diligencePath: Request anonymized proposal data, quote ranges, subscription terms, and customer reference economics by workflow.
    relatedQuestionRefs:
    - QP015
    - QP016
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-data
    severity: material
    topic: win-rates-and-share-by-vertical
    missingEvidence: Public win rates, segment share, or apples-to-apples deployment counts by vertical and workflow across major competitors.
    whyItMatters: Logo counts and broad deployment claims do not show who wins in specific archetypes such as grocery, pharma, 3PL, or manufacturing.
    diligencePath: Ask management for competitive win-loss analysis and pipeline segmentation by use case and geography.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: software-attach-and-gross-margin
    missingEvidence: Comparable software attach rates and gross-margin mix for Quicktron versus software-led rivals such as Locus, GreyOrange, and Exotec.
    whyItMatters: The market is moving toward orchestration-led value capture, so durable moat and valuation depend on who monetizes software best.
    diligencePath: Request product-line gross margin, software revenue share, and attach rates under NDA.
    relatedQuestionRefs:
    - QP018
    - QP025
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: installed-base-definitions
    missingEvidence: One standardized definition for deployments, sites, robots, agents, clients, and countries across peer disclosures.
    whyItMatters: Competitors report scale using incompatible units, which can create false precision in direct comparisons.
    diligencePath: Normalize competitor KPIs to sites, deployed robots, recurring revenue, and active customers before using comparative math.
