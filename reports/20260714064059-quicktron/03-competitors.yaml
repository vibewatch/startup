- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Broad AMR + software portfolio
    - Feature overlap with Geek+ and other Chinese AMR suites
    - high
    - Breadth alone may not sustain pricing if buyers see interchangeable mobile automation
    - Test win rates by workflow rather than logo count
  - - Dense-storage specialization
    - Hai and Exotec can win storage-heavy use cases
    - high
    - Specialists may beat generalists where density is the buyer’s priority
    - Segment pipeline by storage archetype and SKU profile
  - - Flexible deployment
    - Locus, Geek+, MiR, and ForwardX all promise retrofit-friendly rollout
    - medium
    - Deployment speed is becoming table stakes in AMR categories
    - Verify time-to-go-live and ramp curves in customer references
  - - Software orchestration
    - GreyOrange, Locus, Exotec, and Quicktron all claim control-layer differentiation
    - high
    - Value capture is shifting from hardware toward orchestration and data
    - Audit attach rates, interoperability, and software gross margin
  - - International channel expansion
    - MiR and Locus show explicit channel and partner leverage
    - medium
    - Global service depth can decide large multi-site tenders
    - Map local SI, maintenance, and spare-parts coverage by region
  - - Private-company agility
    - Geek+ public status may raise trust and financing credibility
    - medium
    - Disclosure quality can affect large enterprise and IPO-era perceptions
    - Track whether Quicktron offsets this with reference wins and service depth
  notes: The key competitive question is not whether Quicktron has credible technology, but where its breadth remains differentiated versus increasingly capable peers.
