- id: TR002
  title: Regulatory / legal risk register
  columns:
  - Issue
  - Public evidence
  - Why it matters
  - Current mitigation
  - Open diligence ask
  rows:
  - - Confidential HKEX filing
    - Multiple media reports say Quicktron filed confidentially for a Hong Kong IPO
    - Critical information may arrive late and under market pressure
    - Confidential route may protect sensitive information
    - Request full IPO-quality data room, CSRC status, and governance package
  - - Cross-border compliance
    - Founder says CE-related compliance cost tens of millions of RMB
    - Regulatory adaptation is recurring, not one-off
    - Management appears willing to invest materially
    - Request compliance roadmap by region and cost history
  - - Overseas listing review themes
    - SmartLoadingHub notes data security, historical equity changes, and export-control disclosures as recurring themes
    - Chinese specialist-tech issuers face multi-regime diligence
    - No public issue disclosed
    - Request counsel memos and regulatory correspondence
  - - IP / patent defensibility
    - QuickBin page cites U.S. patents but broader FTO picture is not public
    - Patent signal helps, but litigation or weak scope can still hurt
    - Named patent references exist
    - Request patent map, claim scope, and dispute history
  - - Entity footprint and local obligations
    - Texas filing confirms U.S. entity buildout
    - More jurisdictions increase tax, labor, and compliance exposure
    - Local entities can support service delivery
    - Request legal-entity map and regional compliance owners
  notes: The key legal issue is not any known enforcement event; it is the widening compliance surface as Quicktron globalizes while remaining privately opaque.
