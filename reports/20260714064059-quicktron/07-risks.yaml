- id: TR005
  title: Mitigations, indicators, and thesis-break triggers table
  columns:
  - Topic
  - Current mitigant
  - Monitoring indicator
  - Thesis-break trigger
  - Action implication
  rows:
  - - Disclosure risk
    - Confidential filing may convert into fuller public package
    - IPO document release, CSRC status, audited statements
    - Filing withdrawn, materially delayed, or weaker than expected
    - Pause valuation work or demand wide risk discount
  - - Operational reliability
    - Large named references and global standards claims
    - Uptime, SLA, incident, and service metrics
    - Flagship-site outage, recall, or safety controversy
    - Reassess customer durability and margin assumptions
  - - Software differentiation
    - WES/WCS/RCS/LES and QuickMix / QuickBin architecture
    - Software attach, expansion rate, win/loss vs peers
    - Evidence software is bundled but not margin accretive
    - Value closer to systems integrator than software-led platform
  - - Customer quality
    - Large global customers and multiple verticals
    - Top-10 concentration, repeat-site expansion, churn
    - Concentration materially worse than expected or renewals weak
    - Lower underwriting confidence and expected exit multiple
  - - Capital adequacy
    - Recent private funding and IPO option
    - Runway, burn, working capital, and debt needs
    - Need for near-term capital on unattractive terms
    - Model dilution and downside protection explicitly
  notes: These triggers translate a broad robotics risk narrative into concrete diligence gates.
