- id: TR003
  title: Operational and dependency risk table
  columns:
  - Issue
  - Public signal
  - Risk mechanism
  - Mitigant
  - Residual concern
  rows:
  - - Complex system integration
    - Software connects WMS/ERP/MES/OMS/TMS/SCADA with robot fleets
    - Integration failure can cause delays, downtime, and poor ROI
    - Quicktron markets unified software stack and reference deployments
    - No public API, uptime, or incident detail
  - - Safety and reliability
    - Official pages cite safety sensors, CE or PLd references, and global standards
    - Any incident in warehouse or factory operations can hurt sales and service costs
    - Safety positioning is visible
    - No audited reliability metrics or safety-case transparency
  - - Service localization
    - Founder interview cites local teams, partners, and manufacturing support
    - International growth raises fixed support burden and execution risk
    - Series D use of funds explicitly targets global expansion
    - Service cost quality remains unknown
  - - Partner routing
    - Prism and Dematic visibly influence some deployments
    - Partner-led sales can limit pricing control or account ownership
    - Partners can reduce adoption friction
    - Direct-vs-channel economics are undisclosed
  - - Customer concentration
    - Large flagship sites and logistics-heavy mix suggest possible whale-account exposure
    - A few accounts may dominate revenue or support intensity
    - Named customer breadth is real
    - No concentration schedule
  notes: Operational and dependency risk is highest where complex integrations, global support, and partner-mediated delivery overlap.
