- id: TR004
  title: Financial and model risk table
  columns:
  - Risk
  - Public evidence
  - Interpretation
  - Implication
  - Diligence ask
  rows:
  - - Capital intensity
    - 60% expense to R&D; Series D >$100M; overseas buildout
    - Growth requires sustained investment, not just incremental software spend
    - Higher dilution or financing risk if margins lag
    - Request burn, runway, and capex plan
  - - Peer profitability warning
    - Geek+ public disclosures and AGVNetwork commentary show scale with ongoing margin scrutiny
    - Sector leaders can still remain under loss pressure after IPO
    - Do not assume scale alone solves economics
    - Request hardware / software / services gross margins
  - - Working capital drag
    - Project delivery, compliance, local service, and multi-site expansion imply cash-cycle burden
    - Cash conversion may lag bookings or deployments
    - Equity value can compress even with revenue growth
    - Request AR, billing milestones, and support cost curves
  - - Hardware commoditization
    - Mordor and Roland Berger both imply software value capture matters more over time
    - Robot hardware without durable software attach can compress margins
    - Valuation should reward orchestration, not unit counts
    - Request software attach and renewal evidence
  - - Competitive pricing pressure
    - Locus RaaS, GreyOrange modeling, and Exotec guarantees raise buyer expectations
    - Customers may compare on payback, uptime, and financing structure
    - Quicktron may need to absorb more service or discounting
    - Request win/loss analysis and pricing discipline data
  notes: The model risk is that Quicktron might be strategically strong and still financially fragile if service-heavy delivery outpaces software leverage.
