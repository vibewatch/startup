  title: Quicktron’s category is large enough, but only the mobile and robotics layers map cleanly to its offer
  body: The broad warehouse-automation TAM is useful context, but the more relevant commercial battleground is the smaller warehouse-robotics and mobile-automation slice where deployment flexibility and orchestration matter most.
