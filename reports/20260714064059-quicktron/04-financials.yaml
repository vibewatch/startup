- id: cost-structure-capital-needs-and-delivery-model
  title: Cost structure, capital needs, and delivery model
  body: 'The retained public record points to a cost structure that is heavier than a software-only company and more complex than a plain industrial-equipment OEM. Quicktron’s official about page says 60% of expenses go to R&D, while the founder interview says the company has spent tens of millions of renminbi on CE-related compliance and has built local service teams, partner networks, and even manufacturing capability to support overseas credibility. The September 2024 Series D announcement reinforces this picture: management explicitly said the funds would be used for global market expansion, local cooperation, and product optimization rather than for a simple balance-sheet clean-up. Those details matter because they imply persistent spending on product iteration, customer engineering, certification, field service, and working capital tied to international deployments. Filing evidence from Bizapedia further shows a newly organized U.S. entity, which is not a financial statement but does
    support the argument that Quicktron is spending to institutionalize international operations. Comp signals sharpen the picture: Locus markets RaaS specifically to shift adoption from capex to opex, GreyOrange markets simulation and orchestration tools that predict build-out costs before deployment, and Exotec promises 10-year performance guarantees and 24/7 monitoring. Those are all signs of a sector where pre-sales engineering, deployment support, monitoring, and post-go-live service are major cost centers.'
