        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，目前无法评估收入质量。客户和部署公告显示商业需求存在，但容量和订单簿 GW 都不能揭示合同金额、回款风险、集中度或毛利率。Propell
              整合可能改善交付控制和全周期经济性，但公开资料没有采购价格、资本预算、产能兑现或利润桥接。2026 年 7
              月一份竞争对手发布的报告还描述了针对服务于德州离网数据中心项目的天然气发电的环境挑战；无论结果如何，这类延误都可能
              推迟投运和收入确认。因此，投资判断应以经审计财务、客户合同、项目层面单位经济性、燃料风险分配、集中度数据和现金续航核对为前提。
