      - number: '3.4'
        title: 护城河高度依赖执行，也容易受许可或部件替代影响
        blocks:
          - type: paragraph
            body: >-
              供应链控制可以提升交付信心：一篇行业文章称，将 QPac 制造合作方纳入内部体系可降低一笔已报告订单簿的暴露；招聘页面显示公司
              正在招募工程、调试、现场服务、天然气处理、软件和网络安全人才。部署后，这些能力可能形成转换成本，因为监控、维护、燃料物流和
              现场运营会嵌入客户的正常运行计划。但它们并不能消除多归属或替代。客户可以把永久发电与租赁备用并用、并行推进公用事业并网，
              或选择其他发动机和控制系统供应商。圣安东尼奥法律挑战还直接冲击了核心的通电速度主张：如果现场天然气资产面临禁令、修改要求或 许可暂停，这座桥梁本身也可能形成延迟。只有当 VoltaGrid
              持续把整合广度转化为更快的获批交付，并以有竞争力的全包成本实现可靠运营， 这份护城河才真正有意义。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 许可可能抹去通电速度优势
            body: 一份竞争对手发布的圣安东尼奥争议报道称，已安装的现场发电仍可能因环境审查而延迟、修改或停止。证据具有不利性但并非独立来源， 因此在评估进度影响前，应直接审阅底层诉讼文件和许可记录。
            calloutType: risk
            claimRefs:
              - CP009
          - type: callout
            title: 评估交付电力，而非名义容量
            body: 对可比场地索取投标级全包价格、燃料转嫁、获批交付日期、可用性保证、保修边界和客户救济。公开融资和订单簿数字不能证明价格更低、 存在免费容量或项目回报更优。
            calloutType: recommendation
            claimRefs:
              - CP007
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 展示的是垂直整合的能源服务模式，而不是公开的产品价格表。其公开材料描述了面向数据中心和工业客户的表后发电、便携式 电力、CNG
              燃料供应、基础设施和能源管理。这种广度可能带来多条收入来源，但审阅过的资料没有拆分设备销售、容量费、售电收入、 燃料转嫁、运维或整合服务。POWER 报道 2.3 GW Oracle
              合作时明确称财务细节和所有权条款未披露。因此，不能把公开部署容量换算成 收入、ARR、订单簿价值或毛利。公司可能受益于经常性服务和燃料关系，但合同期限、照付不议保护、提价条款、取消权、收入确认和实际
              定价都需要一手尽调。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
