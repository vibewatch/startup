      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              指定证据中最强的广泛需求信号，是 MGRID 引述 S&P Global 的预测：到 2030 年，美国数据中心中可能有 27% 完全依赖现场发电， 对应 35 GW。公司层面的信号小得多但仍然可观：Fitch
              预计 VoltaGrid 到 2027 年达到 4.3 GW；披露的项目和设备承诺还包括 Oracle 基础设施 2.3 GW、INNIO 发动机订单 1.5 GW、某未具名超大规模场地 480
              MW，以及东半球项目 400 MW。这些数值不能相加： 它们混合了行业预测、公司部署预期、项目容量和可能重叠的供应商订单。因此，它们只能限定运营规模和设备需求，不能证明收入 TAM、
              SAM、SOM、市场份额或转化概率。
