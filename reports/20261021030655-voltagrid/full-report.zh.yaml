      - number: '1.3'
        title: 规模、里程碑与不利信号
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 当前的规模叙事是 Oracle 主导的建设爬坡，而不是成熟、多元化的运营基础。Fitch 报告称，10 座 TX3 微电网在建， 其中 2 座已运营、第 3 座接近完工；其假设 Oracle
              项目在 2025-2027 年建设，并在 2028 年分阶段运营。MGRID 另称 Oracle 部署规模为 2.3 GW，预计到 2028 年交付一笔 1.5 GW 的发动机订单。2026 年 5 月收购
              Propell 意在增强内部供应链能力， 但也增加整合风险。集中度仍然很高：Fitch 预计 Oracle 将贡献 2028 年 EBITDA 的近 70%。独立报告和竞争对手发布的报告还描述了
              一起针对德州离网天然气发电的法律挑战。这些报告证明许可争议存在，但不代表争议最终结果。当前最有力的综合判断是：
              合同驱动的扩张速度很快，并获得了赞助方和评级机构的真实验证，但建设、技术、交易对手和监管集中度仍是抵消因素。
            claimRefs:
