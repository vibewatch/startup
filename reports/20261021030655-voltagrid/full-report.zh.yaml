  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 运营假设
      - 估值与回报逻辑
      - 概率信号
      - 下行风险或触发因素
    rows:
      - - 乐观
        - Oracle 预计按时投产；达到 99.9% 可用率目标；新增交易对手使 EBITDA 来源更加多元化。
        - 随着完工风险下降、杠杆率接近或低于 3.5 倍，基础设施现金流价值上升。
        - 里程碑按时完成、没有罚款，并签署多元化合同。
        - 任何重大资产表现不佳或合同执行问题。
      - - 基准
        - 分阶段投产继续推进；出现可控的许可延迟；2028 年杠杆率降至约 4.2 倍。
        - 价值仍对价格敏感，应以已签约项目现金流为锚，并计入私有公司折价。
        - Fitch 稳定的 BB- 情景和当前流动性保持不变。
        - 成本超支、补偿延迟或借款基数增长疲弱。
      - - 悲观
        - 许可或技术问题长期存在，推迟补偿，同时集中度和杠杆率维持高位。
        - 股权价值因折现率上升、新增资本需求和优先权稀释而压缩。
        - 2027 年后杠杆率仍高于 Fitch 的负面敏感性阈值。
        - 杠杆率持续高于 4.5 倍、合同终止或项目无法执行。
      - - 入场门槛
        - 可获得经审计 EBITDA、剩余资本开支、股权结构表、优先权和当前股权价格。
        - 只有届时，才能针对三种情景计算目标回报和持有期。
        - 尽调将项目现金流与合并债务及股权对账。
        - 如果下行情景流动性或优先权覆盖不足，不要投资。
    notes: 情景是有条件的分析框架，不是按概率加权的预测；由于经审计收益和当前证券定价不公开，特意省略了精确数值和回报。
