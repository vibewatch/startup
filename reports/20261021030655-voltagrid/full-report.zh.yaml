      - number: '4.2'
        title: 规模信号与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              公开规模指标很大，但仍是运营指标而非财务指标。VoltaGrid 称其订单簿截至 2030 年约为 7.5 GW；POWER 报道面向 Oracle 的 2.3 GW 模块化发电合作。公司还称，收购
              Propell 将把一名关键供应商纳入内部体系，且计划中的两座德州工厂将制造能力提升至 每月约 300
              MW。这些事实支持需求可见度和垂直整合论点，但不能证明转化时点、利用率、利润率或投入资本回报。整合可能降低供应商风险
              并获取制造经济性，也会增加固定成本、营运资金需求、执行风险和资本开支。因此，财务逻辑取决于能否以可接受的单位回报，把订单簿容量 转化为已投运、已签约资产。
            claimRefs:
