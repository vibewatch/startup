            body: >-
              最突出的剩余风险会相互强化，并非各自独立。Fitch 预计，VoltaGrid 建设 10 座 Oracle 微电网期间，2026 年建设杠杆约为 7.4x；Oracle 到 2028 年预计将贡献近 70% 的
              EBITDA。因此，许可一旦延误，补偿可能推迟，杠杆会维持高位，集中度也将随之上升。现有缓释因素不容忽视：截至 Fitch 10 月 20
              日审阅，两座微电网已投运，第三座接近完工；合同期限长，采用固定费率并按容量计费；VoltaGrid 持有 $822 million 现金，另有一笔尚未动用的 $3 billion ABL
              承诺额度，但当时的借款基数为 $1.5 billion。这些保障有助于维持业务连续性，却不能把建设预测变成已经兑现的现金流。
