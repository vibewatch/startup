          - type: paragraph
            body: >-
              交易对手、燃料、设备和资本依赖必须作为一个系统监测。已宣布的 2,300 MW Oracle 部署依赖 Energy Transfer 提供稳定天然气， 也依赖 INNIO Jenbacher 和 ABB
              作为关键供应商；Fitch 预计 Oracle 将贡献 2028 年 EBITDA 的近 70%。长期固定费合同、赔偿上限、
              方便终止时的保证付款、固定价采购、流动性和内部化供应链能力，能降低特定失效模式。若许可不确定性持续超过 6 个月、Oracle 项目时间或成本出现重大偏差、已部署资产未达到可用性或电能质量义务、2027
              年后杠杆仍高于 Fitch 4.5 倍的降级阈值，或客户多元化 未能降低预计 Oracle 集中度，就应重新审视投资论点。交易参与方发布的融资资料不应视为独立验证。
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 论点失效触发点
            body: 如果德州许可不确定性持续超过 6 个月、Oracle 里程碑出现重大延误、运营资产未达到合同 KPI、2027 年后持续杠杆超过 4.5 倍， 或多元化未能降低 Oracle 的预计贡献，应重新进行投资判断。
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
          - type: callout
            title: 公开证据不是运营证明
            body: 公司和赞助方资料声称平台可靠、可扩展且环保，但指定证据没有提供机队可用性、场地级排放、网络安全保证或经审计的事件数据。
            calloutType: assumption
            claimRefs:
              - CR012
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等、风险高，估值立场不确定，而非给出数值公允价值区间。VoltaGrid 于 2026 年 10 月完成 $775 million 首轮股权融资；规模上调至 $800 million
              的老股交易为现有持有人提供流动性，但没有增加公司所得。Fitch 另报告截至 2026 年 6 月 30 日现金为 $822 million，以及一项 $3 billion 资产支持融资额度，当时借款基数为
              $1.5 billion。这些资源提高了近期建设能力，但不是估值基准。因此，入场应以完全摊薄股权价格、优先股堆叠、经审计盈利、剩余项目资本和下行情形下的稀释为条件，而不是依据融资 headline。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV016
      - number: '8.2'
        title: 论点、反论点与商业模式匹配
        blocks:
          - type: paragraph
            body: >-
              论点是：合同化表后发电可以把稀缺的并网机会转化为长期、按容量计费的基础设施现金流。公司报告称合同部署计划超过 4.3 GW， 并有一笔 1.5 GW
              发动机订单；一家行业目录将其方案描述为电力即服务。反论点是：这仍是一项建设与运营投资判断：Fitch 预计 Oracle 将贡献 2028 年 EBITDA 的约 70%，在严格运营目标下要求 99.9%
              可用性，并认为拟议规模存在技术表现和完工风险。供应商发布的 圣安东尼奥争议报告又提供了可信的不利信号：许可可能延误客户为速度而购买的同一座通电桥梁。
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: 情景与可比框架
        blocks:
          - type: paragraph
            body: >-
              情景估值应采用合同基础设施方法，包括项目现金流、债务承载能力和企业价值/EBITDA 交叉核验，而不是软件收入倍数。基准情景要求 Oracle 分阶段投运，杠杆在 2028 年降至 Fitch 预测的 4.2
              倍附近。乐观情景要求许可及时、达到可用性目标，并降低 Oracle 之外的 集中度。悲观情景是许可或性能长期延误，在杠杆维持高位的同时推迟补偿。Solaris 是披露资料中最接近的同行，但 Fitch 称其
              集中度更低、运营表后资产的经验更丰富，且在建设期杠杆更低。由于保留证据中没有当前 VoltaGrid 股权价值、经审计 EBITDA 或 股份条款，三种情景都只是决策条件，而不是精确估值区间。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、决策路径与论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              退出准备取决于证明运营可重复，而不只是为建设扩张提供资金。可投资路径是合同规模、建设资金、按照 99.9% 可用性目标完成投运、 降低集中度并持续去杠杆。正面证据包括 Oracle 微电网按时完工、2027
              年后杠杆不高于 3.5 倍，以及新增高质量交易对手。 论点失效信号包括 2027 年后杠杆持续高于 4.5 倍、合同终止或执行、资产表现重大不达标，或监管延误阻止执行。最终尽调必须取得 2025-2026
              年经审计财务、项目层面的剩余成本和预备金、客户层面合同经济性、完全摊薄资本结构和优先权，以及董事会批准的退出方案， 才能负责任地建模目标回报或持有期。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 继续研究，不要按融资 headline 定价
            body: 首轮融资、债务承载能力和老股流动性验证了资本获取能力，但没有揭示可辩护的股权入场价值或目标回报。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV016
          - type: callout
            title: 规模证明是估值催化剂
            body: 投运、可用性、集中度下降和去杠杆，是把合同兆瓦数转化为更低风险价值的关键里程碑。
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV015
