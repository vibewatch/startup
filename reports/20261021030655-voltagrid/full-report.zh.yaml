      - number: '3.3'
        title: 公开价格不足以进行采购层面的比较
        blocks:
          - type: paragraph
            body: >-
              现有来源没有披露 VoltaGrid 的目录价、每兆瓦实际价格、合同期限、燃料转嫁条款、可用性保证或终止权。同一证据缺口也存在于
              替代类别，因此精确的价格排名只能靠臆测，无法靠观察得出。可以比较的是商业形态：公用事业服务结合费率和并网流程；客户自建需要
              分别决定设备、工程、建设、燃料和运营；竞争对手发布的租赁资料明确将可按合同提供的发电宣传为进度桥接。VoltaGrid 的融资和制造
              收购显示其有能力为部署提供资金，但融资额并不能证明客户价格更低或项目经济性更好。因此，投资判断应关注全包交付成本、保证可用性、 许可责任、燃料指数化和客户救济，而不是名义容量。
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
