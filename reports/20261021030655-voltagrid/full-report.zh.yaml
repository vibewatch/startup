  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场比整个电力、数据中心或微电网经济更窄。VoltaGrid 为并网受限、延迟或不可用的大型用户整合模块化天然气发电、控制、 燃料物流和运营。核心细分是面向 AI
              和高性能计算数据中心的表后供电；油田电气化、偏远工业场地、公共事业和 CNG 配送属于相邻应用。
              不计入的支出包括数据中心建筑和算力、公用事业输配电、上游天然气生产，以及无关的纯可再生能源资产。实际替代方案包括等待公用事业
              并网、内部建设发电设施、签约另一家分布式电力供应商，或在永久电源延迟期间使用临时租赁发电。这个边界避免把所有电力基础设施支出 都视为 VoltaGrid 可触达的市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
