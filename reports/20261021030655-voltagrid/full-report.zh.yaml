      - number: '3.2'
        title: 速度与整合是可见差异化
        blocks:
          - type: paragraph
            body: >-
              最明显的差异化在于运营整合。VoltaGrid 称其便携式系统支持低、中、高电压，符合 IEEE 1547，可在 28 秒内达到峰值需求，
              并把运营数据送入远程运营中心和客户门户。独立资料和目录式描述还将分析、储能、开关设备、燃料配送和发电纳入同一方案。
              相比多供应商建设，这种广度能减少协调负担，但大多数性能证据仍来自公司。平台也依赖可识别的部件生态，包括第三方资料提到的 INNIO 发动机和 ABB
              电网技术。因此，其持久性较少取决于独占发动机技术，更多取决于许可执行、制造获取、现场服务密度、融资能力， 以及运营大规模已安装机组的能力。序数地图展示了这些权衡，不是经过测量的市场基准。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
              - CP014
              - CP015
