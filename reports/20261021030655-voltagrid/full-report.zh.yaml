        - id: execution-gate
          label: 执行门槛
          value: 99.9% availability objective plus permitting
        - id: recommendation
          label: 决策
          value: Research more; valuation remains price-dependent
    approximationNotes: 数值由引用来源报告或预测；流程表示决策顺序，不代表数学转化或概率。
