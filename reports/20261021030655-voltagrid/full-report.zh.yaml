            - CO015
        - date: 2026-05
          label: 收购 Propell
          detail: Fitch 称，此次收购旨在加强内部供应链能力。
          tone: positive
          claimRefs:
            - CO009
        - date: 2026-05
          label: 签署 7.75 亿美元一级资本
          detail: Blackstone Tactical Opportunities 和 Halliburton 提供了披露的资本方案。
          tone: positive
          claimRefs:
            - CO008
        - date: '2026-07-24'
          label: 德州法律挑战被强调
          detail: 竞争对手发布的报告描述了围绕圣安东尼奥离网发电项目的许可和进度风险。
          tone: negative
          claimRefs:
