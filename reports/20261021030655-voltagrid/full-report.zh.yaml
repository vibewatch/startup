  - id: FE001
    title: VoltaGrid 产品架构图
    type: stack
    summary: 该服务整合客户合同、运营中的微电网、控制系统、发电设备以及燃料和供应链依赖。
    data:
      layers:
        - label: 客户与服务层
          detail: 为高负荷站点提供长期主电源
          items:
            - Oracle TX3：在建的十座微电网
            - 油田用例：公司描述的 70 MW 部署
        - label: 站点部署层
          detail: 模块化项目工程、采购和调试
          items:
            - 十座 Oracle 微电网分阶段推进建设
            - 两座据报道已投入运营，第三座接近完工
        - label: 运营与可靠性层
          detail: 电能质量、负荷跟踪和可用率管理
          items:
            - 99.9% 合同约定的可用率目标
            - Fitch 评级情景中的产能约超配 30%
        - label: 自动化与控制层
          detail: 协调响应、电能质量和负荷跟踪
          items:
            - ABB 自动化和控制系统
            - 公开控制和网络安全架构未披露
        - label: 发电层
          detail: 快速响应的模块化天然气发电
          items:
            - INNIO Jenbacher 往复式发动机
            - 报道称冷启动时间低于 5 分钟
        - label: 供应与制造层
          detail: 燃料、制造、采购和站点部署
          items:
            - Propell 意在增强内部供应能力
            - Oracle 建设成本近 85% 由固定价格供应商合同覆盖
    approximationNotes: 仅为逻辑层级；不代表物理拓扑、部件数量、专有边界或经验证的冗余设计。
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE007
      - CE009
      - CE011
  - id: FU001
    title: 基于证据的客户采用与扩张路径
    type: journey-map
    summary: VoltaGrid 的公开证据在签约到建设阶段最强，在运营、续约和组合扩张阶段最弱。
    data:
      nodes:
        - label: 识别电力约束
          detail: 客户面临电网延迟、偏远运营环境或紧急产能需求。
        - label: 签约产能与站点
          detail: 公开公告强调兆瓦数，但很少披露定价或合同保护条款。
        - label: 锁定燃料与设备
          detail: 与合作伙伴安排管道天然气、发动机、控制系统和稳压设备。
        - label: 建设与整合
          detail: ABB 报道称，多座设施在建，并有明确交付计划。
        - label: 带电运行
          detail: 公用事业案例提供了公司报告的运营证据；超大规模项目的投运产能仍未验证。
        - label: 续约与扩张
          detail: 市场宣传覆盖短期和长期使用，但留存、流失、队列和扩张收入均未披露。
    approximationNotes: 阶段顺序是分析工作流，不是经过测量的转化漏斗；没有可获得的转化率或阶段规模。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU014
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 当前已披露缓释措施下，六项最重要风险敞口的序数视图。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释措施成熟度
        - 剩余严重程度
      rows:
        - label: 德州许可
          values:
            - label: 中高
              detail: 据报道，目前处于冻结状态，且仍有空气许可待取得。
            - label: 高
              detail: 延迟可能推迟补偿，并延长建设期杠杆。
            - label: 部分
              detail: 表后设计、激励措施和延迟产能提供帮助。
            - label: 高
              detail: 结果和时间安排仍不受公司控制。
        - label: 环境挑战
          values:
            - label: 中
              detail: 据报道已发出拟诉通知；尚无裁决结果。
            - label: 高
              detail: 禁令或暂停可能使已完工产能闲置。
            - label: 初期
              detail: 未找到公开的备用电力或诉讼解决方案。
            - label: 高
              detail: 许可不确定性尚未解决。
        - label: Oracle 集中度
          values:
            - label: 高
              detail: Fitch 预计 2028 年近 70% 的 EBITDA 来自 Oracle。
            - label: 高
              detail: 交易对手或项目延迟会影响现金流和杠杆。
            - label: 合同性
              detail: 固定费用合同和终止付款提供保护。
            - label: 高
              detail: 多元化仍是预测，而非已经实现的结果。
        - label: 规模与可用率
          values:
            - label: 中
              detail: 已有较小规模的表现，但与拟议配置不同。
            - label: 高
              detail: 失败可能触发损害赔偿、终止和降级压力。
            - label: 部分
              detail: 产能超配三成，加上此前的 KPI 表现，构成缓释因素。
            - label: 高
              detail: 全规模运营历史尚未建立。
        - label: 杠杆与资本开支
          values:
            - label: 高
              detail: Fitch 预计 2026 年建设期杠杆率为 7.4 倍。
            - label: 高
              detail: 完工延迟会推迟去杠杆和现金生成。
            - label: 已融资
              detail: 现金、ABL 额度和发起人资本支持建设扩张。
            - label: 高
              detail: 融资并不能消除成本、进度或再融资风险。
        - label: 供应链
          values:
            - label: 中
              detail: 大额发动机订单和整合工作仍在前方。
            - label: 高
              detail: 设备延迟或表现不佳会推迟投产。
            - label: 部分
              detail: 固定价格覆盖和 Propell 内部化降低了风险敞口。
            - label: 中高
              detail: 交付、吞吐量和可替代性尚未获得公开验证。
    approximationNotes: 分析师根据引用证据作出的序数评估；这些标签不是统计概率、数值评分或独立工程结论。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR006
      - CR010
      - CR011
