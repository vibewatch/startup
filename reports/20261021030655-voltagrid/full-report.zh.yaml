      - number: '2.3'
        title: 买方、使用方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              对 AI 基础设施而言，通常签订容量合同的云运营商或数据中心开发商是经济买方和付款方，最终使用方是算力负载，内部预算负责人 可能属于基础设施、能源或场地开发职能。Fitch 对 Oracle
              独立长期、固定费、按容量计费合同的描述，确认至少有一条重要市场路径 类似合同基础设施，而非现货售电。油气和工业部署的路径不同：现场运营商、服务合作方或场地所有者采购可靠发电，以避免生产延误或
              公用事业服务不稳定。除这些例子外，公开证据没有披露典型采购周期、客户获取成本、最低合同规模或预算归属，因此买方分层仍是 方向性判断，不能视为穷尽。
            claimRefs:
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用动力来自时间错配：数据中心需求正在上升，但公用事业并网和电力设备可能需要多年。模块化发电可以缩短获得通电容量的路径； VoltaGrid
              将天然气宣传为可扩展、启动快、可靠，且比部分化石燃料替代方案成本更低。该模式只是转移风险，并未消除风险。 一份供应商发布的分析称，圣安东尼奥发电项目收到起诉意向通知；Fitch
              则指出德州许可冻结、补偿延迟和执行不确定性。 设备交付周期长、许可时点、排放审查、交易对手集中和大额建设需求，即使需求已有合同，也可能推迟现金产生。因此估值应区分 名义 GW
              与已获许可、已投运、可用及已产生收入的容量，不应将未经支持的 TAM 或份额假设资本化。
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
