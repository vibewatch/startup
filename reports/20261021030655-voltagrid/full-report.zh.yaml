chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fitch 报告称，VoltaGrid 成立于 2020 年，为数据中心、油气、公共事业和压缩天然气配送等大型用户工程设计、采购、设计并 运营模块化电力系统。MGRID
              将总部所在国家列为美国，但指定证据无法确认城市级总部。VoltaGrid 自有材料将天然气微电网定位为
              数据中心可快速部署的过渡或永久电源，也可为工业场地提供可扩展电力。其商业方案更接近合同基础设施服务，而非单纯出售设备： 公司称一份电力协议可覆盖电力、燃料和物流，Fitch 则将 Oracle
              合同描述为长期、固定费、按容量计费的安排。该模式能减少客户 并网等待，但也把执行、燃料管理、许可和资产性能责任转给 VoltaGrid。
