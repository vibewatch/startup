            body: >-
              披露的架构结合往复式燃气发动机、自动化与控制、燃料供应、标准化场地设计，以及 VoltaGrid 的工程和运营层。独立报道确认模块化 平台使用 INNIO Jenbacher 发动机和 ABB
              自动化，冷启动时间据报道低于 5 分钟。Fitch 的评级案例还加入两个重要的可靠性和执行机制： 为满足合同可用性目标，容量约超配 30%；覆盖 Oracle 项目建设成本近 85%
              的供应商合同采用固定价格。2026 年 5 月收购 Propell 意在提升内部供应链能力，但公开证据没有证明实际工厂产能、部件冗余、维护周期、网络安全控制，或 VoltaGrid 专有工程与供应商
              技术的边界。因此，当前护城河更多是整合和执行诀窍，而不是已证明的专有硬件。
