  - id: FM001
    title: 选定的兆瓦级产能信号
    type: bar
    summary: 对行业、公司、项目和设备产能信号进行同单位比较；各柱不可相加，也不代表 TAM / SAM / SOM 层级。
    data:
      items:
        - label: 美国现场数据中心发电预测，2030 年
          value: 35000
          unit: MW
          detail: MGRID 报道的 S&P Global 预测；35 GW 换算为 35,000 MW。
        - label: VoltaGrid 预计部署量，2027 年
          value: 4300
          unit: MW
          detail: Fitch 的预期；取决于执行和许可。
        - label: Oracle Cloud Infrastructure 部署
          value: 2300
          unit: MW
          detail: 公司宣布的德州部署。
        - label: INNIO 表后设备订单
          value: 1500
          unit: MW
          detail: 公司宣布的订单，覆盖 300 台 Jenbacher 发动机。
        - label: Everllence 未具名超大规模项目订单
          value: 480
          unit: MW
          detail: MGRID 报道称，某个未具名美国项目订购 24 台燃气发动机。
        - label: 东半球制造承诺
          value: 400
          unit: MW
          detail: 公司宣布的模块化系统，目标在 2028 年交付。
