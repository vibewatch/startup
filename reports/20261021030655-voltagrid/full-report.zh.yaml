      - number: '4.3'
        title: 融资与资本充足性
        blocks:
          - type: paragraph
            body: >-
              2026 年 10 月完成的交易提供了有意义但边界明确的资本信号。VoltaGrid 报告首轮投资 7.75 亿美元；规模上调至 8 亿美元的老股
              交易为现有成员提供流动性，并未给公司带来所得。因此，融资额不能当作可用现金：只有首轮部分被描述为公司新增资本，来源没有披露
              交割现金、收购对价、债务、现金消耗、已承诺项目融资或剩余流动性。资金用途是加快表后发电部署，而 Propell 收购和工厂扩张创造 了项目层面融资结构；相对于订单簿，首轮所得是否充足无法确定。
