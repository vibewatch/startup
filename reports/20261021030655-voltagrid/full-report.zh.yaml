  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品与客户工作流
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 的产品是面向高负荷场地的一体化供电服务。其官方描述将发电放在一个向多个终端用途分配电力的中央“microsite”，
              让客户从采购和运营单个现场发电机，转向签订托管微电网服务。公开产品覆盖数据中心、油气、公用事业、工业和 CNG 配送，但各场景成熟度 差异很大。公司描述了一项 70 MW 油田部署；较大的 QPac 和
              Oracle 配置据报道分别最高达到每个设施 200 MW 和 10 座微电网。 因此，客户价值在于速度、可扩展容量和降低对并网的依赖，而不是纯软件功能。公开材料没有披露标准化 SKU、按产品线划分的服务级
              救济或完整的已安装基数清单。
            claimRefs:
