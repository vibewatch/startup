      - number: '5.4'
        title: 许可、信任与控制缺口
        blocks:
          - type: paragraph
            body: >-
              产品的主要风险在于，部署速度不只取决于设备是否可用。在 Georgia，Southern Environmental Law Center 报告称，施工据称在
              没有许可的情况下推进，随后收到州政府违规通知和停工令；该机构还另行质疑 VoltaGrid 是否能合法向 Serverfarm 售电。在德州， 一份行业报告称，服务于 Vantage
              离网园区的天然气发电收到起诉意向通知，说明绕开电网排队的桥接方案仍可能继承不确定的法律进度。 这些是指控和流程风险，不是认定每个 VoltaGrid
              场地都不合规。保留的官方页面也没有提供安全、隐私、认证、事件响应、质量管理、 排放表现或公开开发者文档。公开从业者信号仅限于列名的商务/技术联系人、一个 Houston 场地和一份宣传性行业资料；这些表面信息
              不能独立验证工程质量或控制有效性。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
