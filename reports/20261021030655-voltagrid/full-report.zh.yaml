      - number: '5.3'
        title: 部署成熟度与可靠性
        blocks:
          - type: paragraph
            body: >-
              产品成熟度仍处于过渡阶段，并未在超大规模场景充分证明。Fitch 报告 10 座 Oracle 微电网在建、2 座运营、第 3 座接近完工， 这代表了有意义的实体进展；同时还描述了严格的 99.9%
              可用性目标，以及电能质量和负荷跟踪目标。然而，Fitch 明确将拟议规模和 配置下的运营经验有限列为关键信用风险；较小 Oracle 合同上的可比表现并不能消除配置差异。这一点很重要，因为系统承担主供电，
              合同表现不佳可能触发违约赔偿或终止。报告中的五分钟以内发动机启动和设计超配是有用的设计指标，但不能替代跨季节的全机队正常运行时间、
              强迫停机、维护、排放或负荷跟踪数据。因此，尽调应测试运营遥测和独立工程师结论，不能把部件规格当作系统可靠性证明。
            claimRefs:
              - CE004
