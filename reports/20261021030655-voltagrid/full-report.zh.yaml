  - id: FP001
    title: 按部署速度优势和交钥匙整合能力定位竞争者
    type: quadrant
    summary: 分析师的序数定位说明，VoltaGrid 在速度与整合能力同时重要的场景中位置最强，但成本和许可仍存在不确定性。
    data:
      xAxis:
        label: 部署速度优势
        min: 1
        max: 5
        low: 较慢或取决于排队
        high: 更快或可直接部署
        scale: ordinal
        description: Evidence-backed analyst score, not a measured schedule
      yAxis:
        label: 交钥匙整合广度
        min: 1
        max: 5
        low: 部件或外部协调
        high: 从设计到运营的一体化方案
        scale: ordinal
        description: Evidence-backed analyst score, not a market benchmark
      points:
        - label: VoltaGrid 一体化平台
          x: 5
          'y': 5
          detail: 快速部署和一体化运营能力的主张，但受许可风险牵制
        - label: 公用事业并网
          x: 1
          'y': 3
          detail: 并网后供应在运营上实现整合，但暴露于排队时间
        - label: 客户主导的多供应商建设
          x: 2
          'y': 2
          detail: 部件选择灵活，但整合负担由买方承担
        - label: 大型框架式燃气轮机
          x: 1
          'y': 2
          detail: 高容量设备，已引用交付周期较长，且需要单独整合
        - label: 往复式发动机 OEM 方案
          x: 3
          'y': 2
          detail: 模块化发电部件，但不包含完整的交钥匙运营范围
        - label: 租赁发电过渡方案
          x: 4
          'y': 3
          detail: 可通过合同获得的进度过渡方案，已引用的单机规模较小
    approximationNotes: 1 至 5 的序数评分是分析师根据留存证据对交付周期、产品范围和运营责任进行的分类，不是测量均值、价格排名、市场份额或独立基准表现。
    claimRefs:
      - CP003
      - CP006
      - CP009
      - CP010
      - CP016
  - id: FI001
    title: 从需求到财务回报的公开证据桥
    type: flow
    summary: 公开记录支持需求、资本和计划产能，但还没有延伸到收入和毛利润转化。
    data:
      nodes:
        - id: demand
          label: 需求信号
          detail: 截至 2030 年约 7.5 GW 的订单簿，公司自述
        - id: capital
          label: 一级资本
          detail: 2026 年 10 月完成 7.75 亿美元一级投资
        - id: integration
          label: 供应整合
          detail: 收购 Propell，意在将关键供应商纳入内部
        - id: capacity
          label: 计划制造
          detail: 工厂扩建后目标为每月约 300 MW
        - id: deployment
          label: 客户部署
          detail: POWER 报道的 2.3 GW Oracle 合作
        - id: revenue
          label: 收入转化
          detail: 合同价值、定价、所有权和时间安排不可获得
        - id: gross-profit
          label: 毛利润转化
          detail: 毛利率、资本开支强度和项目回报不可获得
    approximationNotes: 该流程图是概念性且有顺序的；它不估算收入、不暗示转化率，也不把产能视为财务价值。
    claimRefs:
