      - number: '1.2'
        title: 领导层、资本与治理
        blocks:
          - type: paragraph
            body: >-
              现有公开证据对融资和信用的覆盖远强于对人员的覆盖。VoltaGrid 网站确认 Dave Bell 为公用事业与微电网开发副总裁，但指定资料池
              没有完整的创始人、高管、董事会或所有权名单。因此无法可靠评估创始人与市场匹配度、继任梯队、董事会独立性或关键人物依赖。 相比之下，Fitch 报告称 Blackstone Tactical
              Opportunities 和 Halliburton 于 2026 年 5 月投入 $775 million 首轮资本；截至 2026 年 6 月 30 日，公司持有 $822 million
              现金，另有一项未使用的 $3 billion 资产支持融资额度，当时借款基础为 $1.5
              billion。这些数字不能混为一谈：首轮投资不等于累计融资总额，已报告现金也不等于扣除已承诺建设支出后的可自由使用现金。因此，Oracle、 资本提供方、贷款方、许可机构和环境争议方构成治理与执行地图的核心。
            claimRefs:
              - CO006
