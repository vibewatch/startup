        blocks:
          - type: paragraph
            body: >-
              现有证据支持三种主要客户场景，而非单一同质客户群。超大规模云和数据中心运营商寻求在公用事业并网前就能到位、并可承受 AI
              负载波动的表后电力。油气运营商和服务公司将移动发电用于电动压裂车队及其他偏远作业。公用事业也可将临时微电网用于应急容量 和变电站支持。VoltaGrid
              在这些场景中推广同一套天然气发电平台，但经济买方和付款方并未始终披露：公开材料点名运营商、
              合作方和终端场地，却没有说明采购负责人、费率结构，或由哪一方承担燃料和建设风险。在无法供电会延误产生收入的数据中心或工业运营中， 其战略价值似乎最高。
