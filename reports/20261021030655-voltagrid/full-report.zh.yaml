  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止直接微电网开发商
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid 处于一体化现场电力位置：第三方资料称其设计、部署并运营交钥匙天然气发电至电力的移动电源和微电网系统，公司同时
              推广并网并行和表后配置。买方也可以通过公用事业并网、自行整合发动机、开关设备和控制系统、大型框架涡轮机、临时租赁发电，
              或等待电网容量到位来解决同一供电可用性问题。这些方案并不等价。公用事业服务无需拥有发电资产，但会暴露于并网时点；大型涡轮机和
              发电机组受设备交付周期影响；客户自建可以保留部件选择权，但把整合和运营风险转给买方。因此，公开证据支持的是解决方案类别地图， 而不是完整的交钥匙同行排名。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
              - CP014
              - CP016
