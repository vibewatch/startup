  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: >-
        Comparable executed customer contracts or binding bids showing all-in price per
        delivered MWh, fuel pass-through, term, uptime guarantees, discounts and remedies.
      whyItMatters: >-
        Without normalized commercial terms, neither VoltaGrid's price position nor the
        customer's switching cost can be underwritten.
      diligencePath: >-
        Obtain recent bids and executed contracts for comparable sites from VoltaGrid,
        customers, utilities, OEM/EPC alternatives and rental providers, then normalize scope.
      relatedQuestionRefs:
        - QP005
      relatedTableRefs:
        - TP003
    - type: enumeration-incomplete
      severity: material
      topic: named-competitors
      missingEvidence: >-
        A verified, current list of named turnkey peers competing for the same hyperscale and
        industrial procurements, with win-loss outcomes and project scope.
      whyItMatters: >-
        Solution classes reveal substitution paths but do not establish VoltaGrid's share,
        win rate or relative delivery performance against direct bidders.
      diligencePath: >-
        Review customer RFP bidder lists, lost-deal records, interconnection alternatives and
        competitor project announcements for matched sites.
      relatedQuestionRefs:
        - QP001
      relatedTableRefs:
        - TP001
    - type: missing-source
      severity: material
      topic: permitting-risk
      missingEvidence: >-
        Primary legal filings, air permits and regulator dispositions for the San Antonio
        projects and a broader sample of VoltaGrid deployments.
      whyItMatters: >-
        The retained adverse account is competitor-issued and cannot establish the legal
        merits, frequency or ultimate schedule impact of permitting disputes.
      diligencePath: >-
        Obtain the notice letter, permit files, docket updates and site-by-site permitting
        history from the relevant agencies and project counterparties.
      relatedQuestionRefs:
        - QP007
