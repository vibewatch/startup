schemaVersion: "report-v2"
artifact: competitors
slug: voltagrid
runDate: 2026-10-21
company:
  name: VoltaGrid
chapter:
  number: 3
  title: Competitors
  summary: >-
    VoltaGrid competes primarily on deployment speed, turnkey integration, and control of
    manufacturing and operations rather than on an exclusive generation technology. The
    strongest substitutes are utility interconnection, customer-led multi-vendor builds,
    conventional turbine or reciprocating-engine packages, and rental generation; however,
    public evidence does not support a reliable named-peer pricing or margin comparison.
sections:
  - id: competitive-landscape
    title: The competitive set is broader than direct microgrid developers
    body: >-
      VoltaGrid occupies an integrated on-site-power position: third-party profiles describe
      the company as designing, deploying, and operating turnkey natural-gas-to-electric
      mobile power and microgrid systems, while the company markets both grid-parallel and
      behind-the-meter configurations. The buyer can solve the same power-availability problem
      through a utility interconnection, a self-integrated package of engines, switchgear and
      controls, large-frame turbines, temporary rental generation, or a status-quo delay until
      grid capacity arrives. Those alternatives are not interchangeable. Utility service can
      avoid owning generation but exposes the project to interconnection timing; large turbines
      and generator packages expose it to equipment lead times; and customer-led builds retain
      component choice while shifting integration and operating risk to the buyer. Public
      evidence therefore supports a solution-class landscape, not a complete ranking of named
      turnkey peers.
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP007
      - CP010
      - CP011
      - CP014
      - CP016
    tableRefs:
      - TP001
  - id: differentiation-and-buying-criteria
    title: Speed and integration are the visible differentiators
    body: >-
      The strongest visible differentiation is operational integration. VoltaGrid says its
      portable systems support low, medium, and high voltages, meet IEEE 1547, reach full peak
      demand in less than 28 seconds, and feed operating data into a remote operations center
      and customer portal. Independent and directory-style descriptions also place analytics,
      storage, switchgear, fuel delivery, and generation within one offer. This breadth reduces
      the coordination burden relative to a multi-vendor build, but most performance evidence
      remains company-issued. The platform also relies on recognizable component ecosystems,
      including INNIO engines and ABB grid technology reported by a third-party profile.
      Consequently, durability depends less on exclusive engine technology and more on
      permitting execution, manufacturing access, field-service density, financing, and the
      ability to operate a large installed fleet. The ordinal map visualizes those trade-offs;
      it is not a measured market benchmark.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP008
      - CP013
      - CP014
      - CP015
    tableRefs:
      - TP002
    figureRefs:
      - FP001
  - id: commercial-comparison
    title: Public pricing is insufficient for a procurement-level comparison
    body: >-
      None of the retained sources publishes VoltaGrid list pricing, realized price per
      megawatt, contract duration, fuel pass-through terms, availability guarantees, or
      termination rights. The same evidence gap affects the alternative classes, so a precise
      price ranking would be invented rather than observed. What can be compared is the
      commercial shape: utility service combines tariff and interconnection processes;
      customer-led builds require separate equipment, engineering, construction, fuel, and
      operations decisions; and the competitor-published rental source explicitly markets
      contract-available generation as a schedule bridge. VoltaGrid's capital raising and
      manufacturing acquisition show capacity to fund deployment, but funding raised is not
      evidence of lower customer pricing or superior project economics. Underwriting should
      therefore focus on all-in delivered cost, guaranteed availability, permitting
      responsibility, fuel-indexation, and customer remedies rather than headline capacity.
    claimRefs:
      - CP007
      - CP009
      - CP010
      - CP011
      - CP012
    tableRefs:
      - TP003
  - id: moat-durability
    title: The moat is execution-heavy and vulnerable to permitting or component substitution
    body: >-
      Supply-chain control can improve delivery confidence: one industry article argues that
      bringing the QPac manufacturing partner in-house reduces exposure against a reported
      order book, and the careers page shows recruiting across engineering, commissioning,
      field service, gas processing, software, and cybersecurity. Those capabilities can create
      switching costs after deployment because monitoring, maintenance, fuel logistics, and
      field operations become embedded in the customer's uptime plan. They do not eliminate
      multi-homing or substitution. A customer can combine permanent generation with rental
      backup, pursue utility interconnection in parallel, or select alternative engine and
      controls vendors. The San Antonio legal challenge also attacks the central time-to-power
      proposition: if on-site gas assets face injunction, modification, or a permitting pause,
      the bridge can acquire a delay profile of its own. The resulting moat is meaningful only
      if VoltaGrid consistently converts integration breadth into faster permitted delivery and
      reliable operations at a competitive all-in cost.
    claimRefs:
      - CP008
      - CP009
      - CP010
      - CP011
      - CP012
      - CP013
      - CP015
      - CP016
tables:
  - id: TP001
    title: Competitive solution-class profiles
    columns:
      - Alternative
      - Category
      - Scale or funding evidence
      - Target use
      - Visible differentiation
      - Material limitation
    rows:
      - - VoltaGrid integrated platform
        - Direct integrated on-site power
        - "$1B strategic equity reported; 4.3+ GW deployment plan reported through 2028"
        - AI data centers, utilities, industrial and remote sites
        - Generation, switchgear, monitoring, fuel and field operations presented as one offer
        - Pricing, realized availability and project-level economics are not public
      - - Utility interconnection
        - Status quo / incumbent
        - Not quantified in retained chapter evidence
        - Grid-served data centers and industrial loads
        - Avoids customer ownership of primary generation
        - Interconnection queues can run for years in constrained markets
      - - Customer-led multi-vendor build
        - Internal build / substitute
        - Component orders can reach gigawatt scale
        - Large sophisticated operators with integration capacity
        - Preserves vendor choice and can mix engines, controls, storage and contractors
        - Buyer retains integration, permitting and operating coordination
      - - Large-frame gas turbines
        - Incumbent on-site generation
        - No vendor funding comparison retained
        - Large steady baseload
        - Mature high-capacity generation architecture
        - Competitor-published source cites 5–7 year equipment lead times
      - - Reciprocating-engine OEM package
        - Adjacent component stack
        - VoltaGrid-related INNIO order reported at 1.5 GW
        - Modular behind-the-meter generation
        - Modular sizing and faster ramp than large-frame alternatives
        - OEM equipment alone does not supply turnkey integration or operations
      - - Rental generation bridge
        - Temporary substitute / complement
        - Example units cited at 310–500 kW
        - Schedule protection during permanent-power delay
        - Marketed as contract-available and already certified
        - Competitor-issued evidence; unit scale is far below hyperscale campus demand
    notes: >-
      Partial solution-class landscape from retained public evidence; scale figures are
      source-reported, not normalized capacity or audited backlog, and named turnkey peers are
      not sufficiently evidenced for an exhaustive enumeration.
    claimRefs:
      - CP001
      - CP005
      - CP007
      - CP010
      - CP011
      - CP014
      - CP015
      - CP016
  - id: TP002
    title: Capability and buying-criteria matrix
    columns:
      - Buying criterion
      - VoltaGrid
      - Utility interconnection
      - Customer-led multi-vendor build
      - Rental generation bridge
      - Evidence qualification
    rows:
      - - Time to power
        - Company claims rapid deployment and sub-30-second peak response
        - Can face multi-year queue constraints
        - Depends on equipment, engineering and permits
        - Marketed as contract-available bridge capacity
        - No common project sample or median schedule was retained
      - - Scalable capacity
        - Reported multi-GW contracted plan and modular hundreds-of-MW systems
        - Potentially large but location and grid constrained
        - Potentially large with enough equipment and integration
        - Individual cited units are hundreds of kW
        - Backlog, installed capacity and available capacity are different measures
      - - Operational integration
        - Company presents generation, switchgear, monitoring and remote operations
        - Utility operates the external grid
        - Buyer or EPC coordinates vendors and operations
        - Supplier operates or supports temporary generation
        - Service-level terms are not public
      - - Permitting exposure
        - Minor-source pathway claimed for some configurations; legal challenge remains
        - Interconnection and utility approvals apply
        - Buyer bears site-specific generation and construction approvals
        - Certification may reduce equipment risk but not every site approval
        - No cross-project permitting success-rate benchmark was retained
      - - Monitoring and controls
        - Company claims AI-backed portal and remote operating center
        - Utility telemetry does not substitute for customer-side plant controls
        - Stack depends on selected controls integrator
        - Not established by retained source
        - Functional claims are not independently benchmarked
      - - Supply and service control
        - Manufacturing acquisition and broad technical hiring indicate vertical integration
        - Grid asset and workforce controlled by utility
        - Buyer can multi-source but must coordinate warranties and service
        - Supplier offers temporary fleet and service
        - Switching-cost and renewal data remain private
    notes: >-
      Qualitative matrix using company claims, third-party profiles and competitor-issued
      adverse material; unknown cells are kept explicit because no standardized benchmark or
      customer procurement record was available.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP006
      - CP008
      - CP009
      - CP013
      - CP014
      - CP015
  - id: TP003
    title: Pricing and packaging evidence
    columns:
      - Alternative
      - Public price or unit
      - Contract model visible in evidence
      - Included capabilities
      - Discount or unknowns
      - Diligence implication
    rows:
      - - VoltaGrid integrated platform
        - Not disclosed
        - Turnkey design, deployment and operation described; commercial form not disclosed
        - Generation, controls, monitoring and field operations
        - Fuel indexation, duration, minimum take, SLA and termination terms unknown
        - Obtain executed contracts and normalized all-in cost per delivered MWh
      - - Utility interconnection
        - Not disclosed in retained evidence
        - Tariff and interconnection structure not reviewed
        - Grid supply and utility network
        - Upgrade contribution, demand charges and queue cost unknown
        - Compare site-specific utility case rather than a generic tariff assumption
      - - Customer-led multi-vendor build
        - Not disclosed
        - Multiple equipment, EPC, fuel and service arrangements inferred
        - Buyer-selected generation, controls, storage and service
        - Integration contingency and warranty boundaries unknown
        - Normalize total installed cost and lifetime operating responsibility
      - - Rental generation bridge
        - Not disclosed
        - Competitor describes availability on a contract rather than construction timeline
        - Containerized natural-gas or propane units and temporary service
        - Mobilization, fuel, minimum term and scaling discounts unknown
        - Price only as schedule insurance for a defined delay window
      - - Large turbine or reciprocating OEM purchase
        - Not disclosed
        - Equipment procurement; broader EPC and operations terms not retained
        - Generation equipment
        - Balance-of-plant, lead-time protection and long-term service costs unknown
        - Separate equipment price from fully permitted and operated power cost
    notes: >-
      Public chapter sources contain no comparable list prices or executed customer terms;
      "not disclosed" is an evidence gap, not an assumption of equal pricing.
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
      - CP016
figures:
  - id: FP001
    title: Competitive positioning by deployment-speed advantage and turnkey integration
    type: quadrant
    summary: >-
      Analyst ordinal placement shows why VoltaGrid's visible position is strongest where
      speed and integration matter together, while preserving uncertainty around cost and
      permitting.
    data:
      xAxis:
        label: Deployment-speed advantage
        min: 1
        max: 5
        low: Slower or queue-dependent
        high: Faster or readily deployable
        scale: ordinal
        description: Evidence-backed analyst score, not a measured schedule
      yAxis:
        label: Turnkey integration breadth
        min: 1
        max: 5
        low: Component or externally coordinated
        high: Integrated design-to-operations offer
        scale: ordinal
        description: Evidence-backed analyst score, not a market benchmark
      points:
        - label: VoltaGrid integrated platform
          x: 5
          y: 5
          detail: Rapid-deployment and integrated-operations claims, tempered by permitting risk
        - label: Utility interconnection
          x: 1
          y: 3
          detail: Operationally integrated supply after connection, but exposed to queue timing
        - label: Customer-led multi-vendor build
          x: 2
          y: 2
          detail: Flexible component choice with buyer-owned integration burden
        - label: Large-frame gas turbines
          x: 1
          y: 2
          detail: High-capacity equipment with long cited lead times and separate integration
        - label: Reciprocating-engine OEM package
          x: 3
          y: 2
          detail: Modular generation component without full turnkey operating scope
        - label: Rental generation bridge
          x: 4
          y: 3
          detail: Contract-available schedule bridge with lower cited unit scale
    approximationNotes: >-
      Ordinal scores from 1 to 5 are analyst classifications based on retained evidence about
      lead times, product scope and operating responsibility. They are not measured averages,
      price rankings, market shares or independently benchmarked performance.
    claimRefs:
      - CP003
      - CP006
      - CP009
      - CP010
      - CP016
callouts:
  - calloutType: risk
    title: Permitting can erase the time-to-power advantage
    body: >-
      A competitor-published account of the San Antonio challenge argues that installed
      on-site generation can still be delayed, modified or stopped by environmental review.
      The evidence is adverse but not independent, so the underlying filings and permit record
      should be reviewed directly before underwriting the schedule impact.
    claimRefs:
      - CP009
  - calloutType: recommendation
    title: Underwrite delivered power, not headline capacity
    body: >-
      Request bid-level all-in pricing, fuel pass-through, permitted delivery dates,
      availability guarantees, warranty boundaries and customer remedies for comparable sites.
      Public funding and order-book figures do not establish lower prices, free capacity or
      superior project returns.
    claimRefs:
      - CP007
      - CP012
