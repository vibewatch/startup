callouts:
  - calloutType: risk
    title: Capital headline overstates company proceeds
    body: >-
      The closed transaction included $775 million of primary capital and $800
      million of secondary liquidity. The secondary amount did not add company
      proceeds and should not be included in cash or runway calculations.
    claimRefs: [CI001, CI002, CI015]
