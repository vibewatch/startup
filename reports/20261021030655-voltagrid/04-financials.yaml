    columns: [Metric, Public value or status, Confidence, Why it matters, Diligence ask]
    rows:
      - [Primary equity proceeds, "$775 million closed in October 2026", "Medium; company-issued release", "Funds deployment and acquisition-related growth", "Reconcile proceeds to current cash and committed uses"]
      - [Secondary transaction, "$800 million; no company proceeds", "Medium; company-issued release", "Must be excluded from available cash", "Confirm cap-table effects and transaction expenses"]
      - [Gross margin, "Unavailable", "High confidence that reviewed sources do not disclose it", "Tests equipment, fuel, labor, and service economics", "Provide audited gross margin by stream and project cohort"]
      - [Cash burn and runway, "Unavailable", "High confidence that reviewed sources do not disclose it", "Determines financing dependency", "Provide monthly burn, unrestricted cash, debt, and 24-month plan"]
      - [Manufacturing capability target, "~300 MW per month after planned expansion", "Medium; forward-looking company claim", "Indicates potential delivery capacity, not realized throughput", "Provide capex, ramp milestones, yield, and actual monthly output"]
      - [Order book, "~7.5 GW through 2030", "Medium; company claim", "Demand proxy but not contracted revenue value", "Provide signed-versus-pipeline split, timing, pricing, and cancellation rights"]
      - ["CAC, payback, utilization, and project IRR", "Unavailable", "High confidence that reviewed sources do not disclose them", "Required to assess sales efficiency and capital returns", "Provide cohort CAC/payback, fleet utilization, capex per MW, and unlevered project IRR"]
    notes: "Values are public disclosures or explicit nulls; funding raised is not treated as cash available, and forward-looking capacity is not treated as realized output."
    claimRefs: [CI001, CI002, CI005, CI006, CI013, CI014, CI015]
