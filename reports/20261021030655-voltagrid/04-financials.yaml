company:
  name: VoltaGrid
chapter:
  number: 4
  title: Financials
  summary: >-
    VoltaGrid has visible demand and funding proxies, including a company-reported
    roughly 7.5 GW order book, a reported 2.3 GW Oracle deployment, and $775 million
    of 2026 primary equity proceeds. Underwriting remains constrained because the
    reviewed public evidence does not disclose audited revenue, gross margin, cash,
    burn, runway, realized pricing, or contract-level returns.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      VoltaGrid presents a vertically integrated energy-services model rather than
      a disclosed product price list. Its public materials describe behind-the-meter
      generation, portable power, CNG fuel supply, infrastructure, and energy
      management for data centers and industrial customers. That breadth creates
      several potential revenue streams, but the reviewed sources do not separate
      equipment sales, capacity charges, energy sales, fuel pass-through, operations
      and maintenance, or integration services. POWER's reporting on the 2.3 GW
      Oracle collaboration explicitly says financial details and ownership terms
      were not disclosed. Consequently, public deployment capacity should not be
      converted into revenue, ARR, backlog value, or gross profit. The business may
      benefit from recurring service and fuel relationships, but contract duration,
      take-or-pay protection, escalation clauses, cancellation rights, revenue
      recognition, and realized pricing all require primary diligence.
    claimRefs: [CI007, CI008, CI009, CI010]
    tableRefs: [TI001, TI002]
  - id: scale-and-operating-leverage
    title: Scale signals and operating leverage
    body: >-
      Public scale indicators are substantial but remain operational rather than
      financial. VoltaGrid says its order book is approximately 7.5 GW through 2030,
      while POWER reported a 2.3 GW modular generation collaboration for Oracle.
      The company also says the Propell acquisition will internalize a key supplier
      and that two planned Texas plants should expand manufacturing capability to
      roughly 300 MW per month. These facts support demand visibility and a plausible
      vertical-integration thesis, but they do not establish conversion timing,
      utilization, margin, or return on invested capital. Integration could lower
      supplier risk and capture manufacturing economics; it also adds fixed costs,
      working-capital needs, execution risk, and capital expenditure. The financial
      case therefore depends on converting order-book capacity into commissioned,
      contracted assets at acceptable unit returns.
    claimRefs: [CI004, CI005, CI006, CI007, CI016]
    figureRefs: [FI001]
  - id: financing-and-capital-adequacy
    title: Financing and capital adequacy
    body: >-
      The October 2026 closing provides a meaningful but precisely bounded capital
      signal. VoltaGrid reported $775 million of primary investment, while an upsized
      $800 million secondary transaction provided liquidity to existing members and
      did not produce company proceeds. Funding raised therefore must not be treated
      as cash available: only the primary component is described as new company
      capital, and the sources do not provide closing cash, acquisition consideration,
      debt, burn, committed project finance, or remaining liquidity. The stated use
      is acceleration of behind-the-meter generation deployment, while the Propell
      acquisition and plant expansion create additional capital calls. Without a
      sources-and-uses schedule and project-level financing structure, the adequacy
      of the primary proceeds relative to the order book cannot be determined.
    claimRefs: [CI001, CI002, CI003, CI004, CI015]
    tableRefs: [TI003]
  - id: verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Revenue quality is presently unscorable from public evidence. Customer and
      deployment announcements indicate commercial demand, but neither capacity nor
      order-book gigawatts reveal contracted dollars, collection risk, concentration,
      or gross margin. The Propell integration could improve delivery control and
      full-cycle economics, yet no public purchase price, capital budget, throughput
      realization, or margin bridge is available. A July 2026 competitor-published
      report also describes a threatened environmental challenge to gas generation
      serving an off-grid Texas data-center project; regardless of outcome, such a
      delay could postpone commissioning and revenue recognition. Investment
      underwriting should therefore remain conditional on audited financials,
      customer contracts, project-level unit economics, fuel-risk allocation,
      concentration data, and a reconciled cash runway.
    claimRefs: [CI008, CI011, CI013, CI014, CI016]
