slug: voltagrid
runDate: 2026-10-21
company:
  name: VoltaGrid
chapter:
  number: 6
  title: Customers
  summary: >-
    VoltaGrid has credible proof of demand across hyperscale data centers, oilfield
    electrification, and utility recovery, led by a company-announced 2,300 MW Oracle
    deployment and third-party reporting on a greater-than-1 GW Vantage relationship.
    The evidence is much weaker on commissioned capacity, repeat use, retention,
    contract durability, and customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying contexts
    body: >-
      The retained evidence supports three principal customer contexts rather than a
      single homogeneous base. Hyperscale cloud and data-center operators seek
      behind-the-meter power that can arrive before utility interconnection and handle
      variable AI loads. Oil-and-gas operators and service companies use mobile
      generation for electric-fracturing fleets and other remote operations. Utilities
      can also use temporary microgrids for emergency capacity and substation support.
      VoltaGrid markets the same natural-gas generation platform across these settings,
      but the economic buyer and payer are not disclosed consistently: public material
      names operators, partners, and end-use sites without identifying procurement
      owners, tariff structures, or which party bears fuel and construction risk. The
      apparent strategic value is highest in schedule-sensitive deployments where
      unavailable power would delay a revenue-producing data center or industrial
      operation.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU010]
    tableRefs: [TU001]
  - id: adoption-and-customer-proof
    title: Adoption trajectory and named-customer proof
    body: >-
      The scale of announced demand increased sharply from an approximately 200 MW
      oilfield deployment described for late 2024 to gigawatt-scale data-center
      commitments in 2025. VoltaGrid announced 2,300 MW for Oracle, while an independent
      industry article reported more than 1 GW for Vantage Data Centers. ABB separately
      said multiple VoltaGrid-powered AI facilities were under construction and that
      first stabilization units were expected to be operational by April 2026. None of
      the assigned evidence confirms that this milestone was achieved by the October
      2026 run date, so contracted capacity and supplier orders should not be read as
      commissioned or utilized capacity. The strongest outcome evidence is an unnamed
      Gulf Coast utility case study in which VoltaGrid says it deployed more than 30 MW
      and prevented rolling blackouts; because the customer is unnamed and the account
      is company-issued, it remains weaker than a customer-authored reference.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU013, CU016]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The public record describes a plausible expansion path but does not quantify its
      durability. VoltaGrid can begin with bridge power, add generation as a site's load
      grows, and potentially remain as a long-term behind-the-meter source; ABB explicitly
      described the offering as suitable for both short- and long-term use. That mechanism
      is not proof of renewal or net retention. The eight retained sources disclose no
      GRR, NRR, churn, renewal rate, contract duration, take-or-pay protection, customer
      count, or revenue concentration. A July 2026 competitor-published report also said
      Vantage and VoltaGrid received a notice of intent to sue over environmental review
      and permitting near San Antonio, illustrating that the speed-to-power value
      proposition can be weakened by customer-site permitting risk. Underwriting should
      therefore separate signed megawatts, equipment ordered, facilities under
      construction, energized capacity, and recurring revenue, and should require a
      customer-level contract and cohort schedule before treating announced capacity as
      durable adoption.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
