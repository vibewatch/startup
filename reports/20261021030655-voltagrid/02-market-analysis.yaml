company:
  name: "VoltaGrid"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    VoltaGrid addresses the grid-constrained market for modular, behind-the-meter
    natural-gas power, with AI data centers as the clearest growth segment and
    industrial, oilfield, utility, and CNG applications as adjacent demand.
    Available evidence demonstrates multi-gigawatt capacity signals and urgent
    interconnection demand, but it does not support a revenue TAM, a clean SAM/SOM,
    or a company share estimate.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      The investable market is narrower than the entire electricity, data-center,
      or microgrid economy. VoltaGrid integrates modular natural-gas generation,
      controls, fuel logistics, and operation for large users that need dispatchable
      power where grid access is constrained, delayed, or unavailable. The core
      segment is behind-the-meter power for AI and high-performance-computing data
      centers; oilfield electrification, remote industrial sites, utilities, and CNG
      distribution are adjacent applications. Excluded spend includes data-center
      buildings and compute, utility transmission and distribution, upstream gas
      production, and unrelated renewable-only assets. The practical substitutes
      are waiting for a utility interconnection, building generation internally,
      contracting another distributed-power provider, or using temporary rental
      generation while a permanent source is delayed. This boundary avoids treating
      all electric-infrastructure spending as addressable to VoltaGrid.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001]
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: >-
      The strongest broad demand signal in the assigned evidence is MGRID's report
      of an S&P Global projection that 27% of U.S. data centers could rely entirely
      on onsite generation by 2030, representing 35 GW. Company-specific signals are
      materially smaller but still large: Fitch expects 4.3 GW for VoltaGrid by
      2027, while disclosed projects and equipment commitments include 2.3 GW for
      Oracle infrastructure, a 1.5 GW INNIO engine order, 480 MW for an unnamed
      hyperscale site, and 400 MW for Eastern Hemisphere projects. These values are
      not additive: they mix an industry forecast, a company deployment expectation,
      project capacity, and supplier orders that may overlap. They therefore bound
      operational scale and equipment demand rather than establish revenue TAM,
      SAM, SOM, market share, or conversion probability.
    claimRefs: [CM002, CM006, CM007, CM008, CM009, CM010, CM011]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: "buyers-and-adoption-path"
    title: "Buyer, user, payer, and adoption path"
    body: >-
      For AI infrastructure, the economic buyer and payer is generally the cloud
      operator or data-center developer entering a capacity contract, while the
      ultimate user is the compute load and the internal budget owner is likely an
      infrastructure, energy, or site-development function. Fitch's description of
      separate long-term, fixed-fee, capacity-based Oracle contracts confirms that
      at least one important route to market resembles contracted infrastructure
      rather than merchant electricity sales. Oil-and-gas and industrial deployments
      follow a different path: a field operator, service partner, or site owner
      procures reliable generation to avoid production delays or weak utility
      service. Public evidence does not reveal representative procurement cycles,
      customer acquisition costs, minimum contract sizes, or budget ownership beyond
      these examples, so buyer segmentation remains directional rather than exhaustive.
    claimRefs: [CM004, CM005, CM016]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation"
    title: "Drivers, constraints, and valuation relevance"
    body: >-
      Adoption is driven by a timing mismatch: data-center demand is advancing while
      utility interconnection and power equipment can take years. Modular generation
      can shorten the route to energized capacity, and VoltaGrid markets natural gas
      as scalable, quick-starting, reliable, and lower-cost than some fossil-fuel
      alternatives. The same model shifts risk rather than removing it. A supplier-
      published analysis describes a notice of intent to sue over San Antonio
      generation, and Fitch identifies a Texas permitting freeze, delayed compensation,
      and execution uncertainty. Long equipment lead times, permit timing, emissions
      review, concentrated counterparties, and large construction requirements can
      postpone cash generation even when demand is contracted. Valuation should
      therefore distinguish headline gigawatts from permitted, commissioned,
      available, and revenue-producing capacity, and should not capitalize unsupported
      TAM or share assumptions.
    claimRefs: [CM003, CM012, CM013, CM014, CM015]
callouts:
  - calloutType: "risk"
    title: "Capacity is not revenue TAM"
    body: >-
      The retained evidence mixes industry forecasts, company expectations, project
      commitments, and equipment orders. None establishes an independently measured
      revenue pool, VoltaGrid's addressable share, or the probability and timing of
      commissioning.
    claimRefs: [CM002, CM006, CM007, CM008, CM009, CM010, CM011]
