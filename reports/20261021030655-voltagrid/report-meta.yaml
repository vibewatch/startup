companyProfile:
  summary: >-
    Formed in 2020, VoltaGrid is building and operating modular natural-gas generation for high-load customers. Its
    model combines power, fuel, logistics, engineering, procurement, and operations under contracted infrastructure
    arrangements. The current expansion is anchored by Oracle data-center projects, with ten microgrids under
    construction and two reported operational, but the public record does not establish a complete leadership roster or
    diversified operating base.
