company:
  name: VoltaGrid
chapter:
  number: 8
  title: Valuation
  summary: >-
    VoltaGrid has credible contracted scale, $822 million of cash at June 30, 2026,
    and deep sponsor support, but Fitch still forecasts 7.4x leverage in 2026,
    nearly 70% Oracle EBITDA concentration by 2028, and material execution risk.
    With no reliable current equity valuation or audited earnings in the retained
    public evidence, the appropriate stance is research-more and price-dependent.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and
      an indeterminate valuation stance rather than a numeric fair-value range.
      VoltaGrid closed $775 million of primary equity in October 2026, while an
      upsized $800 million secondary transaction gave existing holders liquidity
      but did not add company proceeds. Fitch separately reported $822 million of
      cash at June 30, 2026 and a $3 billion asset-backed facility with a current
      $1.5 billion borrowing base. Those resources improve near-term construction
      capacity, but they are not a valuation benchmark. Entry should therefore be
      conditioned on the fully diluted equity price, preference stack, audited
      earnings, remaining project capital, and downside dilution rather than on
      the headline financing volume.
    claimRefs: [CV001, CV005, CV006, CV007, CV013, CV014, CV016]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and business-model fit
    body: >-
      The thesis is that contracted behind-the-meter generation can turn scarce
      grid access into long-duration, capacity-based infrastructure cash flow.
      The company reports a 4.3-plus-gigawatt contracted deployment plan and a
      1.5-gigawatt engine order, while an industry directory describes the
      offering as power-as-a-service. The anti-thesis is that this remains a
      construction-and-operations underwriting: Fitch expects about 70% of 2028
      EBITDA from Oracle, requires 99.9% availability under stringent operating
      objectives, and sees technology-performance and completion risk at the
      proposed scale. A supplier-published report on the San Antonio dispute adds
      a credible adverse signal that permitting can delay the same bridge-to-power
      strategy customers are buying for speed.
    claimRefs: [CV003, CV004, CV008, CV009, CV010, CV012]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable framing
    body: >-
      Scenario valuation should use contracted-infrastructure methods, including
      project cash flow, debt capacity, and an enterprise-value-to-EBITDA cross-check,
      not software revenue multiples. The base case requires phased Oracle
      commissioning and leverage declining toward Fitch's 4.2x forecast in 2028.
      The bull case requires timely permitting, performance against availability
      objectives, and diversification beyond Oracle. The bear case is a prolonged
      permit or performance delay that defers compensation while leverage remains
      elevated. Solaris is the closest disclosed peer, but Fitch describes it as
      less concentrated, more experienced in operating behind-the-meter assets,
      and less leveraged during buildout. Because no current VoltaGrid equity value,
      audited EBITDA, or share terms are public in the retained evidence, all three
      cases remain decision conditions rather than precise valuation ranges.
    claimRefs: [CV002, CV003, CV004, CV005, CV010, CV011, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness, decision path, and thesis-break triggers
    body: >-
      Exit readiness depends on proving repeatable operation, not merely financing
      the buildout. The investable sequence is contracted scale, funded construction,
      commissioning against the 99.9% availability objective, concentration
      reduction, and sustained deleveraging. Positive evidence would include
      on-time Oracle microgrid completion, leverage at or below 3.5x after 2027,
      and additional high-quality counterparties. Thesis-break signals include
      sustained leverage above 4.5x after 2027, contract termination or enforcement,
      material asset underperformance, or regulatory delays that prevent execution.
      Final diligence must obtain audited 2025-2026 financials, project-level
      remaining cost and contingency, customer-level contract economics, the
      fully diluted capitalization and preferences, and a board-approved exit plan
      before a target return or hold period can be responsibly modeled.
    claimRefs: [CV002, CV003, CV004, CV005, CV010, CV015, CV016]
    figureRefs: [FV001]
