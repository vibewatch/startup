    notes: "The company-reported gigawatt plan and supplier-published legal commentary are not independently verified operating results; the demand statistic is secondary reporting of an S&P Global projection."
    claimRefs: [CV003, CV004, CV005, CV008, CV010, CV011, CV012]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Operating assumptions, Valuation and return logic, Probability signal, Downside or trigger]
    rows:
      - [Bull, "Oracle projects commission on time; 99.9% availability objectives are met; new counterparties diversify EBITDA.", "Infrastructure cash-flow value expands as completion risk falls and leverage approaches or beats 3.5x.", "On-time milestones, no penalties, and signed diversified contracts.", "Any material asset underperformance or contract enforcement."]
      - [Base, "Phased commissioning continues; a manageable permitting delay occurs; leverage declines toward 4.2x in 2028.", "Value remains price-sensitive and should be anchored to contracted project cash flow with a private-company discount.", "Fitch's stable BB- case and current liquidity remain intact.", "Cost overruns, delayed compensation, or weak borrowing-base growth."]
      - [Bear, "Prolonged permitting or technology issues defer compensation while concentration and leverage remain high.", "Equity value compresses through higher discount rates, added capital needs, and preference dilution.", "Leverage stays above Fitch's negative sensitivity after 2027.", "Sustained leverage above 4.5x, contract termination, or inability to execute projects."]
      - [Entry gate, "Audited EBITDA, remaining capex, cap table, preferences, and current equity price become available.", "Only then calculate a target return and hold period across the three cases.", "Diligence reconciles project cash flow to consolidated debt and equity.", "Do not invest if downside liquidity or preference coverage is inadequate."]
    notes: "Scenarios are conditional frameworks, not probability-weighted forecasts; precise values and returns are intentionally omitted because audited earnings and current security pricing are not public."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV010, CV015, CV016]
