callouts:
  - calloutType: recommendation
    title: Research more, do not price from financing headlines
    body: >-
      The primary raise, debt capacity, and secondary liquidity validate capital
      access but do not reveal a defensible equity entry value or target return.
    claimRefs: [CV005, CV006, CV007, CV016]
  - calloutType: risk
    title: Scale proof is the valuation catalyst
    body: >-
      Commissioning, availability, concentration reduction, and deleveraging are
      the milestones that can convert contracted megawatts into lower-risk value.
    claimRefs: [CV002, CV003, CV004, CV010, CV015]
