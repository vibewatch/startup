evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete founder, executive, board, ownership, and succession roster with biographies and tenure.
    whyItMatters: >-
      Leadership depth, founder-market fit, board independence, and key-person dependence cannot be assessed from one
      named vice president.
    diligencePath: >-
      Obtain the current organization chart, board register, cap table, biographies, employment terms, and succession
      plan from management.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: Current valuation, cumulative equity raised, debt draw history, instrument terms, and fully diluted ownership.
    whyItMatters: >-
      A single primary-capital package and facility limits do not establish total funding, cash available, valuation, or
      investor control.
    diligencePath: >-
      Review the cap table, financing documents, debt schedules, bank statements, and latest board-approved valuation
      materials.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue, EBITDA, margins, cash commitments, headcount, customer count, and backlog by operating project.
    whyItMatters: >-
      Construction scale, contracted capacity, funding, and liquidity cannot substitute for realized operating and
      financial performance.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, project-level KPIs, payroll records, customer schedule,
      and contracted backlog bridge.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: Complete customer, supplier, lender, regulator, owner, and related-party population with contractual rights.
    whyItMatters: The visible stakeholder set is concentrated but cannot reveal undisclosed vetoes, dependencies, or conflicts.
    diligencePath: >-
      Reconcile the cap table, material-contract register, debt documents, supplier schedule, permit matrix, and
      related-party ledger.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent revenue TAM/SAM/SOM with geography, customer count, deployment timing, pricing, and overlap
      adjustments.
    whyItMatters: >-
      Capacity forecasts cannot be translated into revenue, market share, or valuation multiples without pricing and
      adoption probabilities.
    diligencePath: >-
      Obtain the underlying S&P Global study and triangulate it with utility filings, interconnection data, and customer
      procurement budgets.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Representative customer contracts, procurement cycles, budget owners, minimum project sizes, and win-loss data
      outside Oracle.
    whyItMatters: >-
      The accessible market and sales-cycle risk depend on who controls the budget and how projects move from demand to
      contracted capacity.
    diligencePath: >-
      Review a stratified contract sample and interview customer energy-procurement, site-development, and operations
      leaders.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: fuel-economics
    missingEvidence: Customer-level natural-gas pricing, hedging, fuel pass-through, escalation, and operating-cost terms.
    whyItMatters: >-
      Public fixed-fee contract descriptions do not establish who bears fuel-price risk or how margins respond to
      gas-price volatility.
    diligencePath: Inspect executed contracts, gas-supply agreements, hedge schedules, and project-level margin sensitivities.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: permitting-risk
    missingEvidence: Current permit status, litigation posture, and site-by-site schedule impact for Texas projects.
    whyItMatters: >-
      The evidence confirms active timing risk but does not resolve duration, remedies, or the number of affected
      megawatts.
    diligencePath: >-
      Collect permits, agency orders, court filings, and management's project schedule reconciliation for each affected
      microgrid.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable executed customer contracts or binding bids showing all-in price per delivered MWh, fuel pass-through,
      term, uptime guarantees, discounts and remedies.
    whyItMatters: >-
      Without normalized commercial terms, neither VoltaGrid's price position nor the customer's switching cost can be
      underwritten.
    diligencePath: >-
      Obtain recent bids and executed contracts for comparable sites from VoltaGrid, customers, utilities, OEM/EPC
      alternatives and rental providers, then normalize scope.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: named-competitors
    missingEvidence: >-
      A verified, current list of named turnkey peers competing for the same hyperscale and industrial procurements,
      with win-loss outcomes and project scope.
    whyItMatters: >-
      Solution classes reveal substitution paths but do not establish VoltaGrid's share, win rate or relative delivery
      performance against direct bidders.
    diligencePath: >-
      Review customer RFP bidder lists, lost-deal records, interconnection alternatives and competitor project
      announcements for matched sites.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: permitting-risk
    missingEvidence: >-
      Primary legal filings, air permits and regulator dispositions for the San Antonio projects and a broader sample of
      VoltaGrid deployments.
    whyItMatters: >-
      The retained adverse account is competitor-issued and cannot establish the legal merits, frequency or ultimate
      schedule impact of permitting disputes.
    diligencePath: >-
      Obtain the notice letter, permit files, docket updates and site-by-site permitting history from the relevant
      agencies and project counterparties.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, revenue mix, gross margin, operating expenses, cash, debt, monthly burn, and runway.
    whyItMatters: >-
      Without a reconciled financial baseline, scale announcements cannot be translated into profitability or financing
      needs.
    diligencePath: >-
      Obtain audited 2025 and year-to-date 2026 financial statements plus monthly management accounts and cash
      reconciliation.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Customer-level pricing, contract duration, take-or-pay terms, escalation, cancellation rights, ownership
      structure, and revenue recognition.
    whyItMatters: These terms determine backlog quality, revenue timing, concentration risk, and asset-return durability.
    diligencePath: >-
      Review the largest signed customer contracts and reconcile contracted capacity to forecast revenue and cash
      collections.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, sales cycle, payback, utilization, capex per MW, fuel cost and pass-through, maintenance burden, and project
      IRR.
    whyItMatters: >-
      The operating model may combine manufacturing, owned assets, fuel, and service economics that cannot be assessed
      from deployment capacity.
    diligencePath: Request cohort-level project models and compare forecast assumptions with commissioned-site actuals.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: propell-integration
    missingEvidence: >-
      Propell purchase price, financing, expansion capex, working-capital requirement, actual throughput, and realized
      cost savings.
    whyItMatters: >-
      Vertical integration may improve margin and delivery control but can also increase fixed-cost and execution
      exposure.
    diligencePath: >-
      Obtain the acquisition sources-and-uses, integration plan, plant budget, monthly ramp milestones, and synergy
      bridge.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: permitting-risk
    missingEvidence: Primary legal filings and current procedural status for the threatened San Antonio environmental challenge.
    whyItMatters: A project delay or operating restriction could defer deployment revenue and require additional bridge capital.
    diligencePath: >-
      Obtain the notice letter, permits, agency correspondence, and counsel's current assessment directly from the
      company.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: security and quality controls
    missingEvidence: >-
      Security architecture, privacy practices, cyber certifications, quality-management standards, incident-response
      procedures and independent control audits.
    whyItMatters: >-
      Primary-power infrastructure creates operational and cyber concentration risk that cannot be assessed from
      marketing pages or commercial contacts.
    diligencePath: >-
      Obtain the security package, control framework mappings, incident history, quality manuals and recent independent
      audit or certification reports.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: >-
      Fleet-level availability, forced-outage, maintenance, load-following, power-quality and emissions data by
      configuration and operating period.
    whyItMatters: >-
      Component start time and designed overcapacity do not prove the contracted 99.9% availability objective at the
      proposed Oracle scale.
    diligencePath: >-
      Review monthly operating telemetry, outage root-cause analyses, independent-engineer reports and contract KPI
      calculations for every commissioned microgrid.
  - type: missing-source
    severity: minor
    topic: developer signal
    missingEvidence: >-
      Public engineering releases, technical talks, practitioner discussions, repositories, package activity or
      comparable developer-community evidence.
    whyItMatters: >-
      The available directory listings and contact page do not demonstrate engineering velocity, technical adoption or
      problem-resolution quality.
    diligencePath: >-
      Request an engineering artifact index, named technical references, release history and practitioner-accessible
      operating documentation.
  - type: conflicting-data
    severity: material
    topic: permitting
    missingEvidence: >-
      Final agency, commission and court outcomes for the Georgia and Texas disputes and a site-by-site permit
      compliance schedule.
    whyItMatters: >-
      Unresolved permitting processes can delay energization and weaken the claimed schedule advantage of
      behind-the-meter generation.
    diligencePath: >-
      Obtain permit registers, enforcement correspondence, legal opinions and milestone-linked remediation plans for
      every active development site.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer cohorts showing GRR, NRR, churn, renewal dates, cancellation rights, contract term, satisfaction, and
      repeat deployment.
    whyItMatters: Announced megawatts do not establish recurring revenue durability or expansion within existing accounts.
    diligencePath: >-
      Obtain a customer-level cohort export and reconcile contracts, invoices, energized capacity, renewals, and
      cancellations to audited revenue.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Revenue, backlog, contracted megawatts, and gross margin by customer, including the top one, top three, and top
      ten shares.
    whyItMatters: >-
      Oracle and Vantage dominate disclosed capacity signals, but public sources do not quantify economic concentration
      or counterparty exposure.
    diligencePath: >-
      Review the customer contract register and calculate concentration using both trailing revenue and risk-adjusted
      contracted backlog.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
