              - CO012
      - number: '1.2'
        title: Leadership, capital, and governance
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence is much stronger on financing and credit than on people. VoltaGrid's site
              identifies Dave Bell as Vice President of Utility and Microgrid Development, but it does not provide a
              complete founder, executive, board, or ownership roster in the assigned pool. That prevents a defensible
              assessment of founder-market fit, succession depth, board independence, or key-person dependence. By
              contrast, Fitch reports $775 million of primary capital from Blackstone Tactical Opportunities and
              Halliburton in May 2026, alongside $822 million of cash at June 30, 2026 and an unused $3 billion
              asset-backed facility with a then-current $1.5 billion borrowing base. These figures are distinct: the
              primary investment is not total funding raised, and reported cash is not unrestricted cash available after
              committed construction spending. Oracle, capital providers, lenders, permit authorities, and environmental
              challengers therefore form the core governance and execution map.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO016
