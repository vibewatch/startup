  - id: FU001
    title: Evidence-based customer adoption and expansion path
    type: journey-map
    summary: >-
      VoltaGrid's public evidence is strongest from contracting through construction and weakest at operation, renewal,
      and portfolio expansion.
    data:
      nodes:
        - label: Power constraint identified
          detail: Customer faces grid delay, remote operations, or emergency capacity need.
        - label: Capacity and site contracted
          detail: Public announcements emphasize megawatts, but rarely disclose pricing or contract protections.
        - label: Fuel and equipment secured
          detail: Pipeline gas, engines, controls, and stabilization equipment are arranged with partners.
        - label: Construction and integration
          detail: ABB reported multiple facilities under construction and a dated delivery schedule.
        - label: Energized operation
          detail: >-
            The utility case provides company-reported operating proof; hyperscale commissioned capacity remains
            unverified.
        - label: Renewal and expansion
          detail: Short- and long-term use is marketed, but retention, churn, cohorts, and expansion revenue are undisclosed.
    approximationNotes: >-
      Stage order is an analytical workflow, not a measured conversion funnel; no conversion rates or stage populations
      are available.
    claimRefs:
