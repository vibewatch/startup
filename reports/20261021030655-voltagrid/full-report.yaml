  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than the entire electricity, data-center, or microgrid economy.
              VoltaGrid integrates modular natural-gas generation, controls, fuel logistics, and operation for large
              users that need dispatchable power where grid access is constrained, delayed, or unavailable. The core
              segment is behind-the-meter power for AI and high-performance-computing data centers; oilfield
              electrification, remote industrial sites, utilities, and CNG distribution are adjacent applications.
              Excluded spend includes data-center buildings and compute, utility transmission and distribution, upstream
              gas production, and unrelated renewable-only assets. The practical substitutes are waiting for a utility
              interconnection, building generation internally, contracting another distributed-power provider, or using
              temporary rental generation while a permanent source is delayed. This boundary avoids treating all
              electric-infrastructure spending as addressable to VoltaGrid.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest broad demand signal in the assigned evidence is MGRID's report of an S&P Global projection
              that 27% of U.S. data centers could rely entirely on onsite generation by 2030, representing 35 GW.
              Company-specific signals are materially smaller but still large: Fitch expects 4.3 GW for VoltaGrid by
              2027, while disclosed projects and equipment commitments include 2.3 GW for Oracle infrastructure, a 1.5
              GW INNIO engine order, 480 MW for an unnamed hyperscale site, and 400 MW for Eastern Hemisphere projects.
              These values are not additive: they mix an industry forecast, a company deployment expectation, project
              capacity, and supplier orders that may overlap. They therefore bound operational scale and equipment
              demand rather than establish revenue TAM, SAM, SOM, market share, or conversion probability.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              For AI infrastructure, the economic buyer and payer is generally the cloud operator or data-center
              developer entering a capacity contract, while the ultimate user is the compute load and the internal
              budget owner is likely an infrastructure, energy, or site-development function. Fitch's description of
              separate long-term, fixed-fee, capacity-based Oracle contracts confirms that at least one important route
              to market resembles contracted infrastructure rather than merchant electricity sales. Oil-and-gas and
              industrial deployments follow a different path: a field operator, service partner, or site owner procures
              reliable generation to avoid production delays or weak utility service. Public evidence does not reveal
              representative procurement cycles, customer acquisition costs, minimum contract sizes, or budget ownership
              beyond these examples, so buyer segmentation remains directional rather than exhaustive.
            claimRefs:
              - CM004
              - CM005
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM012
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by a timing mismatch: data-center demand is advancing while utility interconnection and
              power equipment can take years. Modular generation can shorten the route to energized capacity, and
              VoltaGrid markets natural gas as scalable, quick-starting, reliable, and lower-cost than some fossil-fuel
              alternatives. The same model shifts risk rather than removing it. A supplier- published analysis describes
              a notice of intent to sue over San Antonio generation, and Fitch identifies a Texas permitting freeze,
              delayed compensation, and execution uncertainty. Long equipment lead times, permit timing, emissions
              review, concentrated counterparties, and large construction requirements can postpone cash generation even
              when demand is contracted. Valuation should therefore distinguish headline gigawatts from permitted,
              commissioned, available, and revenue-producing capacity, and should not capitalize unsupported TAM or
              share assumptions.
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capacity is not revenue TAM
            body: >-
              The retained evidence mixes industry forecasts, company expectations, project commitments, and equipment
              orders. None establishes an independently measured revenue pool, VoltaGrid's addressable share, or the
              probability and timing of commissioning.
            calloutType: risk
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive set is broader than direct microgrid developers
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid occupies an integrated on-site-power position: third-party profiles describe the company as
              designing, deploying, and operating turnkey natural-gas-to-electric mobile power and microgrid systems,
              while the company markets both grid-parallel and behind-the-meter configurations. The buyer can solve the
              same power-availability problem through a utility interconnection, a self-integrated package of engines,
              switchgear and controls, large-frame turbines, temporary rental generation, or a status-quo delay until
              grid capacity arrives. Those alternatives are not interchangeable. Utility service can avoid owning
              generation but exposes the project to interconnection timing; large turbines and generator packages expose
              it to equipment lead times; and customer-led builds retain component choice while shifting integration and
              operating risk to the buyer. Public evidence therefore supports a solution-class landscape, not a complete
              ranking of named turnkey peers.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP010
              - CP011
              - CP014
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP010
              - CP011
              - CP014
              - CP015
              - CP016
      - number: '3.2'
        title: Speed and integration are the visible differentiators
        blocks:
          - type: paragraph
            body: >-
              The strongest visible differentiation is operational integration. VoltaGrid says its portable systems
              support low, medium, and high voltages, meet IEEE 1547, reach full peak demand in less than 28 seconds,
              and feed operating data into a remote operations center and customer portal. Independent and
              directory-style descriptions also place analytics, storage, switchgear, fuel delivery, and generation
              within one offer. This breadth reduces the coordination burden relative to a multi-vendor build, but most
              performance evidence remains company-issued. The platform also relies on recognizable component
              ecosystems, including INNIO engines and ABB grid technology reported by a third-party profile.
              Consequently, durability depends less on exclusive engine technology and more on permitting execution,
              manufacturing access, field-service density, financing, and the ability to operate a large installed
              fleet. The ordinal map visualizes those trade-offs; it is not a measured market benchmark.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP006
              - CP009
              - CP010
              - CP016
      - number: '3.3'
        title: Public pricing is insufficient for a procurement-level comparison
        blocks:
          - type: paragraph
            body: >-
              None of the retained sources publishes VoltaGrid list pricing, realized price per megawatt, contract
              duration, fuel pass-through terms, availability guarantees, or termination rights. The same evidence gap
              affects the alternative classes, so a precise price ranking would be invented rather than observed. What
              can be compared is the commercial shape: utility service combines tariff and interconnection processes;
              customer-led builds require separate equipment, engineering, construction, fuel, and operations decisions;
              and the competitor-published rental source explicitly markets contract-available generation as a schedule
              bridge. VoltaGrid's capital raising and manufacturing acquisition show capacity to fund deployment, but
              funding raised is not evidence of lower customer pricing or superior project economics. Underwriting
              should therefore focus on all-in delivered cost, guaranteed availability, permitting responsibility,
              fuel-indexation, and customer remedies rather than headline capacity.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: The moat is execution-heavy and vulnerable to permitting or component substitution
        blocks:
          - type: paragraph
            body: >-
              Supply-chain control can improve delivery confidence: one industry article argues that bringing the QPac
              manufacturing partner in-house reduces exposure against a reported order book, and the careers page shows
              recruiting across engineering, commissioning, field service, gas processing, software, and cybersecurity.
              Those capabilities can create switching costs after deployment because monitoring, maintenance, fuel
              logistics, and field operations become embedded in the customer's uptime plan. They do not eliminate
              multi-homing or substitution. A customer can combine permanent generation with rental backup, pursue
              utility interconnection in parallel, or select alternative engine and controls vendors. The San Antonio
              legal challenge also attacks the central time-to-power proposition: if on-site gas assets face injunction,
              modification, or a permitting pause, the bridge can acquire a delay profile of its own. The resulting moat
              is meaningful only if VoltaGrid consistently converts integration breadth into faster permitted delivery
              and reliable operations at a competitive all-in cost.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Permitting can erase the time-to-power advantage
            body: >-
              A competitor-published account of the San Antonio challenge argues that installed on-site generation can
              still be delayed, modified or stopped by environmental review. The evidence is adverse but not
              independent, so the underlying filings and permit record should be reviewed directly before underwriting
              the schedule impact.
            calloutType: risk
            claimRefs:
              - CP009
          - type: callout
            title: Underwrite delivered power, not headline capacity
            body: >-
              Request bid-level all-in pricing, fuel pass-through, permitted delivery dates, availability guarantees,
              warranty boundaries and customer remedies for comparable sites. Public funding and order-book figures do
              not establish lower prices, free capacity or superior project returns.
            calloutType: recommendation
            claimRefs:
              - CP007
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid presents a vertically integrated energy-services model rather than a disclosed product price
              list. Its public materials describe behind-the-meter generation, portable power, CNG fuel supply,
              infrastructure, and energy management for data centers and industrial customers. That breadth creates
              several potential revenue streams, but the reviewed sources do not separate equipment sales, capacity
              charges, energy sales, fuel pass-through, operations and maintenance, or integration services. POWER's
              reporting on the 2.3 GW Oracle collaboration explicitly says financial details and ownership terms were
              not disclosed. Consequently, public deployment capacity should not be converted into revenue, ARR, backlog
              value, or gross profit. The business may benefit from recurring service and fuel relationships, but
              contract duration, take-or-pay protection, escalation clauses, cancellation rights, revenue recognition,
              and realized pricing all require primary diligence.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI008
              - CI009
              - CI010
      - number: '4.2'
        title: Scale signals and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Public scale indicators are substantial but remain operational rather than financial. VoltaGrid says its
              order book is approximately 7.5 GW through 2030, while POWER reported a 2.3 GW modular generation
              collaboration for Oracle. The company also says the Propell acquisition will internalize a key supplier
              and that two planned Texas plants should expand manufacturing capability to roughly 300 MW per month.
              These facts support demand visibility and a plausible vertical-integration thesis, but they do not
              establish conversion timing, utilization, margin, or return on invested capital. Integration could lower
              supplier risk and capture manufacturing economics; it also adds fixed costs, working-capital needs,
              execution risk, and capital expenditure. The financial case therefore depends on converting order-book
              capacity into commissioned, contracted assets at acceptable unit returns.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI007
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
              - CI014
      - number: '4.3'
        title: Financing and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The October 2026 closing provides a meaningful but precisely bounded capital signal. VoltaGrid reported
              $775 million of primary investment, while an upsized $800 million secondary transaction provided liquidity
              to existing members and did not produce company proceeds. Funding raised therefore must not be treated as
              cash available: only the primary component is described as new company capital, and the sources do not
              provide closing cash, acquisition consideration, debt, burn, committed project finance, or remaining
              liquidity. The stated use is acceleration of behind-the-meter generation deployment, while the Propell
              acquisition and plant expansion create additional capital calls. Without a sources-and-uses schedule and
              project-level financing structure, the adequacy of the primary proceeds relative to the order book cannot
              be determined.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality is presently unscorable from public evidence. Customer and deployment announcements
              indicate commercial demand, but neither capacity nor order-book gigawatts reveal contracted dollars,
              collection risk, concentration, or gross margin. The Propell integration could improve delivery control
              and full-cycle economics, yet no public purchase price, capital budget, throughput realization, or margin
              bridge is available. A July 2026 competitor-published report also describes a threatened environmental
              challenge to gas generation serving an off-grid Texas data-center project; regardless of outcome, such a
              delay could postpone commissioning and revenue recognition. Investment underwriting should therefore
              remain conditional on audited financials, customer contracts, project-level unit economics, fuel-risk
              allocation, concentration data, and a reconciled cash runway.
            claimRefs:
              - CI008
              - CI011
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital headline overstates company proceeds
            body: >-
              The closed transaction included $775 million of primary capital and $800 million of secondary liquidity.
              The secondary amount did not add company proceeds and should not be included in cash or runway
              calculations.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's product is an integrated power-delivery service for high-load sites. Its official description
              places generation at a central "microsite" that distributes power to multiple end uses, shifting the
              customer's job from procuring and operating individual onsite generators toward contracting for a managed
              microgrid. The public product surface spans data-center, oil-and-gas, utility, industrial and
              CNG-distribution use cases, but evidence of maturity varies sharply. The company describes a 70 MW
              oilfield deployment, while the larger QPac and Oracle configurations are reported at up to 200 MW per
              facility and ten microgrids respectively. Customer value is therefore speed, scalable capacity and reduced
              dependence on grid interconnection, not a software-only feature set. Public materials do not disclose
              standardized SKUs, service-level remedies by product line, or a complete installed-base inventory.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE007
              - CE013
              - CE014
      - number: '5.2'
        title: Architecture and supply-chain control
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture combines reciprocating gas engines, automation and controls, fuel supply,
              standardized site design, and VoltaGrid's engineering and operations layer. Independent reporting
              identifies INNIO Jenbacher engines and ABB automation in the modular platform, with a reported cold-start
              time below five minutes. Fitch's rating case adds two important reliability and execution mechanisms:
              about 30% overbuilt capacity to support the contracted availability objective and fixed-price supplier
              contracts covering nearly 85% of Oracle project build cost. The May 2026 Propell acquisition is intended
              to increase in-house supply-chain capability, but public evidence does not establish realized factory
              throughput, component redundancy, maintenance intervals, cyber controls, or the boundary between
              proprietary VoltaGrid engineering and supplier technology. The resulting moat is currently more
              integration and execution know-how than demonstrated proprietary hardware.
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE009
              - CE011
      - number: '5.3'
        title: Deployment maturity and reliability
        blocks:
          - type: paragraph
            body: >-
              Product maturity is transitional rather than fully proven at hyperscale. Fitch reports ten Oracle
              microgrids under construction, two operational and a third nearing completion, which is meaningful
              physical progress. It also describes a stringent 99.9% availability target alongside power-quality and
              load-following objectives. However, Fitch explicitly identifies limited operating experience at the
              proposed scale and configuration as a key credit risk; comparable performance on a smaller Oracle contract
              does not remove the configuration difference. This matters because the system is primary power and
              contract underperformance can trigger liquidated damages or termination. Reported sub-five-minute engine
              starts and designed overcapacity are useful design indicators, but neither substitutes for fleet-level
              uptime, forced-outage, maintenance, emissions, or load-following data across seasons. Diligence should
              therefore test operational telemetry and independent-engineer conclusions, not accept component
              specifications as system reliability proof.
            claimRefs:
              - CE004
              - CE006
              - CE007
              - CE009
              - CE011
              - CE012
      - number: '5.4'
        title: Permitting, trust and control gaps
        blocks:
          - type: paragraph
            body: >-
              The principal product risk is that deployment speed depends on more than equipment availability. In
              Georgia, the Southern Environmental Law Center reported a state notice of violation and stop-work order
              after construction allegedly proceeded without a permit, and separately challenged whether VoltaGrid could
              lawfully sell power to Serverfarm. In Texas, a sector report described a notice of intent to sue over gas
              generation serving an off-grid Vantage campus, illustrating how a bridge around grid queues can inherit an
              uncertain legal schedule. These are allegations and process risks, not findings that every VoltaGrid site
              is noncompliant. The retained official pages also provide no security, privacy, certification,
              incident-response, quality-management, emissions-performance, or public developer documentation. Public
              practitioner signals are limited to named commercial/technical contacts, one listed Houston site, and a
              promotional industry profile; these surfaces do not independently verify engineering quality or control
              effectiveness.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Physical deployment has moved beyond a concept-stage product
            body: >-
              Fitch reports two Oracle microgrids operational and a third nearing completion, giving the platform an
              emerging operating base even though the full configuration and scale remain unproven.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
              - CE012
          - type: callout
            title: Permitting is part of product delivery
            body: >-
              Georgia enforcement and Texas legal challenges show that a technically deployable microgrid can still lose
              schedule advantage when environmental or utility-law questions are unresolved.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying contexts
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports three principal customer contexts rather than a single homogeneous base.
              Hyperscale cloud and data-center operators seek behind-the-meter power that can arrive before utility
              interconnection and handle variable AI loads. Oil-and-gas operators and service companies use mobile
              generation for electric-fracturing fleets and other remote operations. Utilities can also use temporary
              microgrids for emergency capacity and substation support. VoltaGrid markets the same natural-gas
              generation platform across these settings, but the economic buyer and payer are not disclosed
              consistently: public material names operators, partners, and end-use sites without identifying procurement
              owners, tariff structures, or which party bears fuel and construction risk. The apparent strategic value
              is highest in schedule-sensitive deployments where unavailable power would delay a revenue-producing data
              center or industrial operation.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
              - CU010
      - number: '6.2'
        title: Adoption trajectory and named-customer proof
        blocks:
          - type: paragraph
            body: >-
              The scale of announced demand increased sharply from an approximately 200 MW oilfield deployment described
              for late 2024 to gigawatt-scale data-center commitments in 2025. VoltaGrid announced 2,300 MW for Oracle,
              while an independent industry article reported more than 1 GW for Vantage Data Centers. ABB separately
              said multiple VoltaGrid-powered AI facilities were under construction and that first stabilization units
              were expected to be operational by April 2026. None of the assigned evidence confirms that this milestone
              was achieved by the October 2026 run date, so contracted capacity and supplier orders should not be read
              as commissioned or utilized capacity. The strongest outcome evidence is an unnamed Gulf Coast utility case
              study in which VoltaGrid says it deployed more than 30 MW and prevented rolling blackouts; because the
              customer is unnamed and the account is company-issued, it remains weaker than a customer-authored
              reference.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
              - CU013
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The public record describes a plausible expansion path but does not quantify its durability. VoltaGrid can
              begin with bridge power, add generation as a site's load grows, and potentially remain as a long-term
              behind-the-meter source; ABB explicitly described the offering as suitable for both short- and long-term
              use. That mechanism is not proof of renewal or net retention. The eight retained sources disclose no GRR,
              NRR, churn, renewal rate, contract duration, take-or-pay protection, customer count, or revenue
              concentration. A July 2026 competitor-published report also said Vantage and VoltaGrid received a notice
              of intent to sue over environmental review and permitting near San Antonio, illustrating that the
              speed-to-power value proposition can be weakened by customer-site permitting risk. Underwriting should
              therefore separate signed megawatts, equipment ordered, facilities under construction, energized capacity,
              and recurring revenue, and should require a customer-level contract and cohort schedule before treating
              announced capacity as durable adoption.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Contracted megawatts are not retained revenue
            body: >-
              Public evidence does not reconcile announced capacity to commissioned megawatts, utilization, recurring
              revenue, or renewal. Customer-level contract schedules are required before underwriting durability or
              concentration.
            calloutType: risk
            claimRefs:
              - CU007
              - CU012
              - CU013
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and underwriting posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks are mutually reinforcing rather than independent. Fitch expects construction
              leverage of about 7.4x in 2026 while VoltaGrid completes ten Oracle microgrids, and it projects nearly 70%
              of 2028 EBITDA from Oracle. A permitting delay can therefore defer compensation, keep leverage elevated,
              and increase concentration at the same time. The current mitigants are meaningful: two microgrids were
              operational and a third was nearing completion as of Fitch's October 20 review; the contracts are
              long-term, fixed-fee and capacity-based; and VoltaGrid had $822 million of cash plus an unused $3 billion
              ABL commitment, although the then-current borrowing base was $1.5 billion. These protections support
              continuity, but they do not turn construction forecasts into realized cash flow.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR010
              - CR011
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Texas permitting is the most immediate legal and schedule risk. Fitch reported a gubernatorial permit
              suspension affecting data-center projects and said VoltaGrid still needed air permits for the remaining
              TX3 microgrids. Separately, a July 2026 industry report described a notice of intent to sue Vantage and
              VoltaGrid over alleged deficiencies in environmental review and permitting near San Antonio. That report
              is published by an equipment-rental competitor, so its allegations are not an independent adjudication;
              nevertheless, the dispute is consistent with Fitch's warning that prolonged regulatory delay could
              pressure the rating. VoltaGrid's own statement that gas generation makes environmental compliance easier
              is not a substitute for site-level permits, emissions testing, or a complete litigation docket.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR012
      - number: '7.3'
        title: Operating, quality, security, and financial execution
        blocks:
          - type: paragraph
            body: >-
              The operating case depends on scaling a configuration that Fitch says has not yet been proven at the
              proposed size. The Oracle contract requires 99.9% availability, power quality, and load following; Fitch
              says underperformance can trigger liquidated damages and termination, while its rating case assumes
              roughly 30% overbuilt capacity and about 85% fixed-price supplier coverage. VoltaGrid's Propell
              acquisition and a reported 1.5 GW Jenbacher engine order improve supply-chain readiness, but they also
              enlarge the integration and delivery burden. Company-issued profiles repeatedly describe the platform as
              reliable, scalable, and environmentally friendly without publishing measured fleet availability,
              emissions, cybersecurity controls, or incident history. Those missing operating records remain a material
              diligence requirement.
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.4'
        title: Dependencies, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Counterparty, fuel, equipment, and capital dependencies must be monitored as one system. The announced
              2,300 MW Oracle deployment relies on Energy Transfer for firm gas and on INNIO Jenbacher and ABB as key
              suppliers, while Fitch projects Oracle at nearly 70% of EBITDA in 2028. Long-term fixed-fee contracts,
              capped liquidated damages, guaranteed payments on termination for convenience, fixed-price procurement,
              liquidity, and internalized supply-chain capability reduce specific failure modes. The investment thesis
              should be revisited if permitting uncertainty persists beyond six months, Oracle project timing or cost
              slips materially, deployed assets miss availability or power-quality obligations, leverage remains above
              Fitch's 4.5x downgrade threshold after 2027, or customer diversification fails to lower the projected
              Oracle concentration. Public financing profiles from transaction participants should not be treated as
              independent validation.
            claimRefs:
              - CR005
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Re-underwrite if Texas permitting uncertainty lasts beyond six months, Oracle milestones slip materially,
              operating assets miss contractual KPIs, sustained leverage exceeds 4.5x after 2027, or diversification
              fails to reduce Oracle's projected contribution.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
          - type: callout
            title: Public evidence is not operating proof
            body: >-
              Company and sponsor profiles assert reliability, scalability, and environmental benefits, but the assigned
              evidence does not provide fleet availability, site-level emissions, cybersecurity assurance, or audited
              incident data.
            calloutType: assumption
            claimRefs:
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and an indeterminate valuation
              stance rather than a numeric fair-value range. VoltaGrid closed $775 million of primary equity in October
              2026, while an upsized $800 million secondary transaction gave existing holders liquidity but did not add
              company proceeds. Fitch separately reported $822 million of cash at June 30, 2026 and a $3 billion
              asset-backed facility with a current $1.5 billion borrowing base. Those resources improve near-term
              construction capacity, but they are not a valuation benchmark. Entry should therefore be conditioned on
              the fully diluted equity price, preference stack, audited earnings, remaining project capital, and
              downside dilution rather than on the headline financing volume.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and business-model fit
        blocks:
          - type: paragraph
            body: >-
              The thesis is that contracted behind-the-meter generation can turn scarce grid access into long-duration,
              capacity-based infrastructure cash flow. The company reports a 4.3-plus-gigawatt contracted deployment
              plan and a 1.5-gigawatt engine order, while an industry directory describes the offering as
              power-as-a-service. The anti-thesis is that this remains a construction-and-operations underwriting: Fitch
              expects about 70% of 2028 EBITDA from Oracle, requires 99.9% availability under stringent operating
              objectives, and sees technology-performance and completion risk at the proposed scale. A
              supplier-published report on the San Antonio dispute adds a credible adverse signal that permitting can
              delay the same bridge-to-power strategy customers are buying for speed.
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios and comparable framing
        blocks:
          - type: paragraph
            body: >-
              Scenario valuation should use contracted-infrastructure methods, including project cash flow, debt
              capacity, and an enterprise-value-to-EBITDA cross-check, not software revenue multiples. The base case
              requires phased Oracle commissioning and leverage declining toward Fitch's 4.2x forecast in 2028. The bull
              case requires timely permitting, performance against availability objectives, and diversification beyond
              Oracle. The bear case is a prolonged permit or performance delay that defers compensation while leverage
              remains elevated. Solaris is the closest disclosed peer, but Fitch describes it as less concentrated, more
              experienced in operating behind-the-meter assets, and less leveraged during buildout. Because no current
              VoltaGrid equity value, audited EBITDA, or share terms are public in the retained evidence, all three
              cases remain decision conditions rather than precise valuation ranges.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, decision path, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness depends on proving repeatable operation, not merely financing the buildout. The investable
              sequence is contracted scale, funded construction, commissioning against the 99.9% availability objective,
              concentration reduction, and sustained deleveraging. Positive evidence would include on-time Oracle
              microgrid completion, leverage at or below 3.5x after 2027, and additional high-quality counterparties.
              Thesis-break signals include sustained leverage above 4.5x after 2027, contract termination or
              enforcement, material asset underperformance, or regulatory delays that prevent execution. Final diligence
              must obtain audited 2025-2026 financials, project-level remaining cost and contingency, customer-level
              contract economics, the fully diluted capitalization and preferences, and a board-approved exit plan
              before a target return or hold period can be responsibly modeled.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV010
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research more, do not price from financing headlines
            body: >-
              The primary raise, debt capacity, and secondary liquidity validate capital access but do not reveal a
              defensible equity entry value or target return.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV016
          - type: callout
            title: Scale proof is the valuation catalyst
            body: >-
              Commissioning, availability, concentration reduction, and deleveraging are the milestones that can convert
              contracted megawatts into lower-risk value.
            calloutType: risk
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV010
              - CV015
