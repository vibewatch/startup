      - number: '1.3'
        title: Scale, milestones, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              VoltaGrid's current scale story is an Oracle-led construction ramp rather than a mature, diversified
              operating base. Fitch reports 10 TX3 microgrids under construction, with two operating and a third nearing
              completion, and assumes Oracle construction during 2025-2027 with phased operations through 2028. MGRID
              separately reports a 2.3 GW Oracle deployment and a 1.5 GW engine order expected by 2028. The May 2026
              Propell acquisition is intended to improve in-house supply-chain capability, but it also adds integration
              risk. Concentration remains pronounced: Fitch expects nearly 70% of 2028 EBITDA from Oracle. Independent
              and competitor-issued reports also describe a Texas legal challenge over off-grid gas generation. Those
              reports establish the existence of a permitting dispute, not its eventual outcome. The strongest current
              synthesis is therefore rapid contracted expansion with real sponsor and rating-agency validation, offset
              by construction, technology, counterparty, and regulatory concentration.
            claimRefs:
