chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Fitch reports that VoltaGrid was formed in 2020 and engineers, procures, designs, and operates modular
              power systems for large users across data centers, oil and gas, utilities, and compressed-natural-gas
              distribution. MGRID identifies the headquarters country as the United States, but the assigned evidence
              does not establish a city-level headquarters. VoltaGrid's own materials position natural-gas microgrids as
              rapidly deployable bridge or permanent power for data centers and as scalable power for industrial sites.
              The commercial proposition is closer to contracted infrastructure service than equipment-only sales: the
              company describes a single power agreement covering power, fuel, and logistics, while Fitch describes the
              Oracle contracts as long-term, fixed-fee, capacity-based arrangements. This model can reduce customer
              interconnection delays, but it shifts execution, fuel-management, permitting, and asset-performance
              obligations onto VoltaGrid.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
