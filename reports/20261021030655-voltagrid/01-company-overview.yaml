      severity: material
      topic: leadership
      missingEvidence: Complete founder, executive, board, ownership, and succession roster with biographies and tenure.
      whyItMatters: Leadership depth, founder-market fit, board independence, and key-person dependence cannot be assessed from one named vice president.
      diligencePath: Obtain the current organization chart, board register, cap table, biographies, employment terms, and succession plan from management.
      relatedQuestionRefs: [QO002, QO007]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: capitalization
      missingEvidence: Current valuation, cumulative equity raised, debt draw history, instrument terms, and fully diluted ownership.
      whyItMatters: A single primary-capital package and facility limits do not establish total funding, cash available, valuation, or investor control.
      diligencePath: Review the cap table, financing documents, debt schedules, bank statements, and latest board-approved valuation materials.
      relatedQuestionRefs: [QO003, QO004, QO008]
      relatedTableRefs: [TO001, TO003]
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: Audited revenue, EBITDA, margins, cash commitments, headcount, customer count, and backlog by operating project.
      whyItMatters: Construction scale, contracted capacity, funding, and liquidity cannot substitute for realized operating and financial performance.
      diligencePath: Obtain audited statements, monthly management accounts, project-level KPIs, payroll records, customer schedule, and contracted backlog bridge.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: minor
      topic: stakeholder-map
      missingEvidence: Complete customer, supplier, lender, regulator, owner, and related-party population with contractual rights.
      whyItMatters: The visible stakeholder set is concentrated but cannot reveal undisclosed vetoes, dependencies, or conflicts.
      diligencePath: Reconcile the cap table, material-contract register, debt documents, supplier schedule, permit matrix, and related-party ledger.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO003]
