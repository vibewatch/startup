    summary: VoltaGrid moved from formation into an Oracle-led construction ramp, major financing, supply-chain expansion, and active regulatory scrutiny.
    data:
      items:
        - date: "2020"
          label: Company formed
          detail: Fitch reports that VoltaGrid was formed in 2020.
          tone: neutral
          claimRefs: [CO001]
        - date: "2025"
          label: Oracle construction period begins
          detail: Fitch's rating case assumes Oracle construction across 2025-2027.
          tone: neutral
          claimRefs: [CO012]
        - date: "2025-10-15"
          label: 2.3 GW Oracle deployment reported
          detail: MGRID reports a contracted 2.3 GW modular-gas deployment for Oracle Cloud in Texas.
