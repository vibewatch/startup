        - date: "2026-05"
          label: Propell acquired
          detail: Fitch says the acquisition was intended to strengthen in-house supply-chain capability.
          tone: positive
          claimRefs: [CO009]
        - date: "2026-05"
          label: $775 million primary capital signed
          detail: Blackstone Tactical Opportunities and Halliburton supplied the disclosed capital package.
          tone: positive
          claimRefs: [CO008]
        - date: "2026-07-24"
          label: Texas legal challenge highlighted
          detail: A competitor-published report describes permitting and schedule risk around San Antonio off-grid generation.
          tone: negative
          claimRefs: [CO013]
        - date: "2026-10-20"
          label: Fitch affirms BB- / Stable
          detail: Fitch kept the issuer rating and outlook unchanged while emphasizing execution and technology risk.
          tone: neutral
          claimRefs: [CO006]
    approximationNotes: >-
      Month-only milestones preserve the precision of the source; reported order
      and contract milestones come from MGRID summaries rather than primary contracts.
    claimRefs: [CO001, CO006, CO008, CO009, CO012, CO013, CO014, CO015]
callouts:
  - calloutType: strength
    title: External credit validation with substantial liquidity
    body: >-
      Fitch's BB-/Stable affirmation, reported $822 million cash balance, and
      asset-backed facility provide a current external credit anchor, while still
      reflecting elevated construction leverage and execution risk.
    claimRefs: [CO006, CO007]
  - calloutType: risk
    title: Oracle and permitting concentration dominate the near-term profile
    body: >-
      Fitch expects Oracle to contribute nearly 70% of 2028 EBITDA, while Texas
      permit delays and the reported San Antonio legal challenge can defer project
      completion and compensation.
    claimRefs: [CO010, CO013]
