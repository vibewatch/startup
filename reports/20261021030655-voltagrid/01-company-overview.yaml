company:
  name: VoltaGrid
chapter:
  number: 1
  title: Company Overview
  summary: >-
    VoltaGrid is a 2020-formed modular-power operator in a capital-intensive
    buildout anchored by Oracle data-center projects. Fitch's current BB-/Stable
    assessment and reported liquidity provide external validation, while customer
    concentration, permitting exposure, and missing valuation, revenue, headcount,
    founder, and full capitalization data remain material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Fitch reports that VoltaGrid was formed in 2020 and engineers, procures,
      designs, and operates modular power systems for large users across data
      centers, oil and gas, utilities, and compressed-natural-gas distribution.
      MGRID identifies the headquarters country as the United States, but the
      assigned evidence does not establish a city-level headquarters. VoltaGrid's
      own materials position natural-gas microgrids as rapidly deployable bridge
      or permanent power for data centers and as scalable power for industrial
      sites. The commercial proposition is closer to contracted infrastructure
      service than equipment-only sales: the company describes a single power
      agreement covering power, fuel, and logistics, while Fitch describes the
      Oracle contracts as long-term, fixed-fee, capacity-based arrangements.
      This model can reduce customer interconnection delays, but it shifts
      execution, fuel-management, permitting, and asset-performance obligations
      onto VoltaGrid.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-capital-and-governance
    title: Leadership, capital, and governance
    body: >-
      The retained public evidence is much stronger on financing and credit than
      on people. VoltaGrid's site identifies Dave Bell as Vice President of Utility
      and Microgrid Development, but it does not provide a complete founder,
      executive, board, or ownership roster in the assigned pool. That prevents a
      defensible assessment of founder-market fit, succession depth, board
      independence, or key-person dependence. By contrast, Fitch reports $775
      million of primary capital from Blackstone Tactical Opportunities and
      Halliburton in May 2026, alongside $822 million of cash at June 30, 2026 and
      an unused $3 billion asset-backed facility with a then-current $1.5 billion
      borrowing base. These figures are distinct: the primary investment is not
      total funding raised, and reported cash is not unrestricted cash available
      after committed construction spending. Oracle, capital providers, lenders,
      permit authorities, and environmental challengers therefore form the core
      governance and execution map.
    claimRefs: [CO006, CO007, CO008, CO016]
    tableRefs: [TO002, TO003]
  - id: scale-milestones-and-adverse-signals
    title: Scale, milestones, and adverse signals
    body: >-
      VoltaGrid's current scale story is an Oracle-led construction ramp rather
      than a mature, diversified operating base. Fitch reports 10 TX3 microgrids
      under construction, with two operating and a third nearing completion, and
      assumes Oracle construction during 2025-2027 with phased operations through
      2028. MGRID separately reports a 2.3 GW Oracle deployment and a 1.5 GW engine
      order expected by 2028. The May 2026 Propell acquisition is intended to
      improve in-house supply-chain capability, but it also adds integration risk.
      Concentration remains pronounced: Fitch expects nearly 70% of 2028 EBITDA
      from Oracle. Independent and competitor-issued reports also describe a Texas
      legal challenge over off-grid gas generation. Those reports establish the
      existence of a permitting dispute, not its eventual outcome. The strongest
      current synthesis is therefore rapid contracted expansion with real sponsor
      and rating-agency validation, offset by construction, technology,
      counterparty, and regulatory concentration.
    claimRefs: [CO006, CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
