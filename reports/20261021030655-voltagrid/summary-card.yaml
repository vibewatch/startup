  topStrengths:
    - Fitch reports ten Oracle microgrids under construction, with two operational and a third nearing completion.
    - >-
      Reported liquidity includes $822 million of cash and an unused $3 billion asset-backed facility with a $1.5
      billion borrowing base at June 30, 2026.
    - The October 2026 financing added $775 million of primary equity from Blackstone-managed funds and Halliburton.
    - >-
      Long-term, fixed-fee, capacity-based contracts and substantial fixed-price supplier coverage provide some
      protection during the buildout.
  topRisks:
    - >-
      Fitch expects nearly 70% of 2028 EBITDA to come from Oracle, creating severe counterparty and project
      concentration.
    - >-
      Texas permitting suspension and reported legal challenges could delay construction, energization, and
      compensation.
    - >-
      The Oracle program requires 99.9% availability at a scale and configuration where VoltaGrid has limited operating
      history.
    - Fitch forecasts leverage of 7.4x in 2026, while growth investment is expected to delay free-cash-flow generation.
    - >-
      Public evidence does not disclose audited earnings, customer-level economics, current equity value, or security
      terms.
  unresolvedGaps:
    - >-
      Audited 2025 and year-to-date 2026 revenue, EBITDA, cash flow, gross margin, debt, and project-level capital
      expenditure.
    - >-
      Current fully diluted equity value, capitalization, liquidation preferences, option pool, and secondary-transfer
      terms.
    - >-
      Customer-level revenue, backlog, margins, fixed fees, termination rights, penalties, renewals, and concentration
      outside Oracle.
    - >-
      Fleet-level availability, outages, maintenance, power-quality, emissions, cybersecurity controls, and independent
      operating audits.
    - Final Georgia and Texas permitting or litigation outcomes and a site-by-site permit compliance schedule.
