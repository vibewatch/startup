company:
  name: "VoltaGrid"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    VoltaGrid delivers modular, behind-the-meter natural-gas generation as an engineered,
    operated power service rather than as a standalone equipment sale. The architecture is
    increasingly tangible, with ten Oracle microgrids under construction and two reported
    operational, but Fitch still identifies configuration-at-scale and 99.9% availability
    execution risk while Georgia and Texas disputes show that permitting can erode the
    deployment-speed advantage.
sections:
  - id: "product-and-customer-workflow"
    title: "Product and customer workflow"
    body: >-
      VoltaGrid's product is an integrated power-delivery service for high-load sites. Its
      official description places generation at a central "microsite" that distributes power
      to multiple end uses, shifting the customer's job from procuring and operating individual
      onsite generators toward contracting for a managed microgrid. The public product surface
      spans data-center, oil-and-gas, utility, industrial and CNG-distribution use cases, but
      evidence of maturity varies sharply. The company describes a 70 MW oilfield deployment,
      while the larger QPac and Oracle configurations are reported at up to 200 MW per facility
      and ten microgrids respectively. Customer value is therefore speed, scalable capacity and
      reduced dependence on grid interconnection, not a software-only feature set. Public
      materials do not disclose standardized SKUs, service-level remedies by product line, or
      a complete installed-base inventory.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "architecture-and-supply-chain"
    title: "Architecture and supply-chain control"
    body: >-
      The disclosed architecture combines reciprocating gas engines, automation and controls,
      fuel supply, standardized site design, and VoltaGrid's engineering and operations layer.
      Independent reporting identifies INNIO Jenbacher engines and ABB automation in the modular
      platform, with a reported cold-start time below five minutes. Fitch's rating case adds two
      important reliability and execution mechanisms: about 30% overbuilt capacity to support
      the contracted availability objective and fixed-price supplier contracts covering nearly
      85% of Oracle project build cost. The May 2026 Propell acquisition is intended to increase
      in-house supply-chain capability, but public evidence does not establish realized factory
      throughput, component redundancy, maintenance intervals, cyber controls, or the boundary
      between proprietary VoltaGrid engineering and supplier technology. The resulting moat is
      currently more integration and execution know-how than demonstrated proprietary hardware.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-maturity-and-reliability"
    title: "Deployment maturity and reliability"
    body: >-
      Product maturity is transitional rather than fully proven at hyperscale. Fitch reports ten
      Oracle microgrids under construction, two operational and a third nearing completion, which
      is meaningful physical progress. It also describes a stringent 99.9% availability target
      alongside power-quality and load-following objectives. However, Fitch explicitly identifies
      limited operating experience at the proposed scale and configuration as a key credit risk;
      comparable performance on a smaller Oracle contract does not remove the configuration
      difference. This matters because the system is primary power and contract underperformance
      can trigger liquidated damages or termination. Reported sub-five-minute engine starts and
      designed overcapacity are useful design indicators, but neither substitutes for fleet-level
      uptime, forced-outage, maintenance, emissions, or load-following data across seasons.
      Diligence should therefore test operational telemetry and independent-engineer conclusions,
      not accept component specifications as system reliability proof.
    claimRefs:
      - "CE004"
      - "CE006"
      - "CE007"
      - "CE009"
      - "CE011"
      - "CE012"
  - id: "permitting-trust-and-control-gaps"
    title: "Permitting, trust and control gaps"
    body: >-
      The principal product risk is that deployment speed depends on more than equipment
      availability. In Georgia, the Southern Environmental Law Center reported a state notice of
      violation and stop-work order after construction allegedly proceeded without a permit, and
      separately challenged whether VoltaGrid could lawfully sell power to Serverfarm. In Texas,
      a sector report described a notice of intent to sue over gas generation serving an off-grid
      Vantage campus, illustrating how a bridge around grid queues can inherit an uncertain legal
      schedule. These are allegations and process risks, not findings that every VoltaGrid site is
      noncompliant. The retained official pages also provide no security, privacy, certification,
      incident-response, quality-management, emissions-performance, or public developer
      documentation. Public practitioner signals are limited to named commercial/technical
      contacts, one listed Houston site, and a promotional industry profile; these surfaces do
      not independently verify engineering quality or control effectiveness.
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
