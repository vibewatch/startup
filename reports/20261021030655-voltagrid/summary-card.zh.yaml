  topStrengths:
    - Fitch 报告称，10 个 Oracle 微电网正在建设，其中 2 个已经运营，第 3 个接近完工。
    - 据报道，截至 2026 年 6 月 30 日，公司持有 $822 million 现金，另有未动用的 $3 billion 资产支持融资额度，当前借款基数为 $1.5 billion。
    - 2026 年 10 月的融资从 Blackstone 管理的基金和 Halliburton 引入 7.75 亿美元新增股权资本。
    - 长期、固定费用、按容量计费的合同，加上大比例的固定价供应商覆盖，为建设期提供了一定保护。
  topRisks:
    - Fitch 预计，2028 年 EBITDA 近 70% 来自 Oracle，交易对手和项目集中度因此都非常高。
    - 得州暂停许可，以及据报道出现的法律挑战，可能拖慢建设、送电和补偿进度。
    - Oracle 项目要求 99.9% 的可用率，但 VoltaGrid 在这种规模和配置下的运营记录仍很有限。
    - Fitch 预测 2026 年杠杆率为 7.4 倍，而增长投入预计会推迟自由现金流的产生。
    - 公开证据没有披露经审计的盈利、客户层面的经济数据、当前股权价值或证券条款。
  unresolvedGaps:
    - 经审计的 2025 年及 2026 年年初至今收入、EBITDA、现金流、毛利率、债务和项目层面资本开支。
    - 当前完全稀释股权价值、资本结构、清算优先权、期权池和二次转让条款。
    - 客户层面的收入、订单积压、利润率、固定费用、终止权、罚金、续约情况，以及 Oracle 之外的客户集中度。
    - 车队层面的可用率、停机、维护、电能质量、排放、网络安全控制和独立运营审计。
    - 佐治亚州和得州许可或诉讼的最终结果，以及逐站点的许可合规时间表。
