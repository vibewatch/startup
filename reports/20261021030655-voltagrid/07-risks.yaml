        - Medium-high
        - High
        - "Partial: two operating and a third nearing completion; about 85% of build cost assumed fixed-price"
        - "Remaining units and growth projects preserve substantial completion risk"
        - "Monthly unit-level budget, completion, permit, commissioning, and payment milestones"
      - - Scaled configuration misses 99.9% availability, power quality, or load following
        - Medium
        - High
        - "Partial: similar KPIs achieved on a smaller Oracle contract; about 30% overbuild assumed"
        - "Configuration and scale differ; underperformance can lead to damages or termination"
        - "Independent engineer report, outage log, acceptance tests, and liquidated-damage history"
      - - Construction leverage remains elevated or free cash flow is delayed
        - High
        - High
        - "$822 million cash and unused $3 billion ABL commitment, subject to a $1.5 billion borrowing base at 2026-06-30"
        - "Fitch forecasts 7.4x leverage in 2026 and says growth capex delays free-cash-flow generation"
        - "Quarterly leverage, borrowing-base availability, capex variance, interest coverage, and cash conversion"
      - - Propell integration or engine delivery constrains supply
        - Medium
        - High
        - "Early: Propell adds in-house capability; MGRID reports a 1.5 GW engine order expected by 2028"
        - "Acquisition integration, manufacturing throughput, and equipment delivery remain unverified"
        - "Supplier schedule, factory acceptance, yield, spare-parts, and Propell integration reporting"
      - - Cyber or controls incident impairs plant availability
        - Unknown
        - High
        - "Not established in the assigned public evidence"
        - "No public control-system architecture, certification, penetration test, or incident record was found"
        - "SOC 2 or equivalent scope, OT segmentation, incident log, recovery tests, and customer security audits"
    notes: >-
      Risk levels are evidence-based analyst assessments, not source-provided probabilities.
      Liquidity figures are Fitch-reported as of 2026-06-30; no public evidence in the assigned
      pool established audited cash burn, realized free cash flow, or cyber-control effectiveness.
