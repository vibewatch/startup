  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: permitting
      missingEvidence: >-
        Complete site-by-site permit matrix, emissions tests, regulator
        correspondence, notice-of-intent letter, company response, and any court
        docket or settlement.
      whyItMatters: >-
        Public sources establish active permitting and legal risk but do not
        establish the scope, timing, or probable outcome for every project.
      diligencePath: >-
        Obtain the permit and litigation data room, validate it with environmental
        counsel, and reconcile milestones to project and compensation schedules.
      relatedQuestionRefs:
        - QR007
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: operating-evidence-gap
      missingEvidence: >-
        Fleet and unit availability, outage causes, power-quality and load-following
        test results, liquidated damages, OT security architecture, independent
        audits, penetration tests, and incident records.
      whyItMatters: >-
        Marketing claims and a smaller prior deployment do not establish reliability
        or cyber resilience at the proposed Oracle scale and configuration.
      diligencePath: >-
        Review independent engineer reports, acceptance tests, operating logs,
        customer scorecards, security certifications, incident registers, and
        disaster-recovery exercises.
      relatedQuestionRefs:
        - QR008
      relatedTableRefs:
        - TR002
    - type: access-blocked
      severity: minor
      topic: financing-source-quality
      missingEvidence: >-
        The assigned DevCuration retrieval exposed only generic site navigation, and
        the assigned J.P. Morgan retrieval exposed disclaimers rather than the
        transaction article body.
      whyItMatters: >-
        Search-result titles and transaction-participant marketing cannot establish
        funding terms, cash availability, valuation, or capital-provider protections.
      diligencePath: >-
        Obtain executed financing documents, capital-call records, funded-cash
        schedules, covenants, preference terms, and an independent capitalization
        reconciliation.
