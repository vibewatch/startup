      - CR003
      - CR005
      - CR006
      - CR010
      - CR011
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Re-underwrite if Texas permitting uncertainty lasts beyond six months, Oracle
      milestones slip materially, operating assets miss contractual KPIs, sustained
      leverage exceeds 4.5x after 2027, or diversification fails to reduce Oracle's
      projected contribution.
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR008
  - calloutType: assumption
    title: Public evidence is not operating proof
    body: >-
      Company and sponsor profiles assert reliability, scalability, and environmental
      benefits, but the assigned evidence does not provide fleet availability,
      site-level emissions, cybersecurity assurance, or audited incident data.
    claimRefs:
      - CR012
      - CR015
