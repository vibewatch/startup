      - CR003
      - CR004
      - CR006
      - CR007
      - CR010
      - CR011
      - CR014
      - CR015
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role and concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Customer and project cash flow
        - Oracle
        - "Fitch projects nearly 70% of EBITDA from one counterparty in 2028"
        - "Permitting, delayed compensation, termination, or weaker demand impairs debt service and diversification"
        - High
        - "Long-term fixed-fee capacity contracts, sole-supplier position, and guaranteed payments for termination for convenience"
        - "Concentration remains high until additional contracted projects contribute material EBITDA"
      - - Firm natural-gas supply
        - Energy Transfer
        - "Pipeline and storage network announced for the 2,300 MW Oracle deployment"
        - "Fuel interruption, basis constraint, or infrastructure delay limits generation"
        - High
        - "Company describes firm supply from an expansive pipeline and storage system"
        - "No public transport terms, redundancy map, curtailment rights, or pass-through mechanism in the assigned evidence"
      - - Generation and automation equipment
        - INNIO Jenbacher and ABB
        - "Key suppliers named for VoltaGrid's modular platform; MGRID reports a 1.5 GW Jenbacher order"
        - "Late engines, controls defects, or spare-parts constraints delay commissioning or reduce availability"
        - High
        - "Large order, modular design, fixed-price supplier coverage, and Propell internalization"
        - "Delivery schedule and single-vendor substitutability remain unverified"
      - - Construction and growth capital
        - "ABL lenders, noteholders, Blackstone Tactical Opportunities, and Halliburton"
        - "Largely debt-funded buildout plus preferred primary capital"
        - "Borrowing-base growth lags construction, capital costs rise, or additional projects keep leverage above thresholds"
        - High
        - "Cash, unused ABL commitment, sponsor-equity history, no forecast dividends, and no near-term amortization"
        - "Liquidity depends on asset commissioning and continued capital access; arranger-hosted profiles are not independent proof"
    notes: >-
      Concentration and liquidity figures are Fitch forecasts or snapshots, not audited outcomes.
      Fuel, equipment, and financing terms are only partially public; residual exposure therefore
      emphasizes contract, redundancy, delivery, and borrowing-base diligence.
