      Ordinal view of the six most consequential exposures after currently disclosed mitigations.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Texas permits
          values:
            - label: Medium-high
