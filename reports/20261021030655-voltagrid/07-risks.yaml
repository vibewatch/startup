artifact: risks
slug: voltagrid
runDate: 2026-10-21
company:
  name: VoltaGrid
chapter:
  number: 7
  title: Risks
  summary: >-
    VoltaGrid's principal underwriting risks are concentrated in Texas permitting,
    execution of a ten-microgrid Oracle buildout, 99.9% availability obligations,
    elevated construction leverage, and projected dependence on one counterparty.
    Contract protections, liquidity, fixed-price procurement, and partial operating
    progress mitigate but do not eliminate those exposures.
sections:
  - id: risk-ranking
    title: Risk ranking and underwriting posture
    body: >-
      The highest residual risks are mutually reinforcing rather than independent.
      Fitch expects construction leverage of about 7.4x in 2026 while VoltaGrid
      completes ten Oracle microgrids, and it projects nearly 70% of 2028 EBITDA
      from Oracle. A permitting delay can therefore defer compensation, keep
      leverage elevated, and increase concentration at the same time. The current
      mitigants are meaningful: two microgrids were operational and a third was
      nearing completion as of Fitch's October 20 review; the contracts are
      long-term, fixed-fee and capacity-based; and VoltaGrid had $822 million of
      cash plus an unused $3 billion ABL commitment, although the then-current
      borrowing base was $1.5 billion. These protections support continuity, but
      they do not turn construction forecasts into realized cash flow.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR007
      - CR008
    figureRefs:
      - FR001
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Texas permitting is the most immediate legal and schedule risk. Fitch reported
      a gubernatorial permit suspension affecting data-center projects and said
      VoltaGrid still needed air permits for the remaining TX3 microgrids. Separately,
      a July 2026 industry report described a notice of intent to sue Vantage and
      VoltaGrid over alleged deficiencies in environmental review and permitting
      near San Antonio. That report is published by an equipment-rental competitor,
      so its allegations are not an independent adjudication; nevertheless, the
      dispute is consistent with Fitch's warning that prolonged regulatory delay
      could pressure the rating. VoltaGrid's own statement that gas generation makes
      environmental compliance easier is not a substitute for site-level permits,
      emissions testing, or a complete litigation docket.
    claimRefs:
      - CR001
      - CR002
      - CR008
      - CR012
    tableRefs:
      - TR001
  - id: operating-financial
    title: Operating, quality, security, and financial execution
    body: >-
      The operating case depends on scaling a configuration that Fitch says has not
      yet been proven at the proposed size. The Oracle contract requires 99.9%
      availability, power quality, and load following; Fitch says underperformance
      can trigger liquidated damages and termination, while its rating case assumes
      roughly 30% overbuilt capacity and about 85% fixed-price supplier coverage.
      VoltaGrid's Propell acquisition and a reported 1.5 GW Jenbacher engine order
      improve supply-chain readiness, but they also enlarge the integration and
      delivery burden. Company-issued profiles repeatedly describe the platform as
      reliable, scalable, and environmentally friendly without publishing measured
      fleet availability, emissions, cybersecurity controls, or incident history.
      Those missing operating records remain a material diligence requirement.
    claimRefs:
      - CR006
      - CR010
      - CR011
      - CR014
      - CR015
    tableRefs:
      - TR002
  - id: dependencies-kill-criteria
    title: Dependencies, mitigations, and thesis-break triggers
    body: >-
      Counterparty, fuel, equipment, and capital dependencies must be monitored as
      one system. The announced 2,300 MW Oracle deployment relies on Energy Transfer
      for firm gas and on INNIO Jenbacher and ABB as key suppliers, while Fitch
      projects Oracle at nearly 70% of EBITDA in 2028. Long-term fixed-fee contracts,
      capped liquidated damages, guaranteed payments on termination for convenience,
      fixed-price procurement, liquidity, and internalized supply-chain capability
      reduce specific failure modes. The investment thesis should be revisited if
      permitting uncertainty persists beyond six months, Oracle project timing or
      cost slips materially, deployed assets miss availability or power-quality
      obligations, leverage remains above Fitch's 4.5x downgrade threshold after
      2027, or customer diversification fails to lower the projected Oracle
      concentration. Public financing profiles from transaction participants should
      not be treated as independent validation.
    claimRefs:
      - CR005
      - CR008
      - CR009
      - CR010
      - CR011
      - CR013
      - CR016
    tableRefs:
      - TR003
