        - label: Environmental challenge
          values:
            - label: Medium
              detail: "A notice of intent was reported; no adjudicated outcome is available."
            - label: High
              detail: "An injunction or pause could strand completed capacity."
            - label: Early
              detail: "No public alternate-power or litigation-resolution plan was found."
            - label: High
              detail: "Permitting uncertainty is unresolved."
        - label: Oracle concentration
          values:
            - label: High
              detail: "Fitch projects nearly 70% of 2028 EBITDA from Oracle."
            - label: High
              detail: "Counterparty or project delay would affect cash flow and leverage."
            - label: Contractual
              detail: "Fixed-fee contracts and termination payments provide protection."
            - label: High
              detail: "Diversification is forecast rather than realized."
        - label: Scale and availability
          values:
            - label: Medium
              detail: "Smaller-scale performance exists, but proposed configuration differs."
            - label: High
              detail: "Failure can trigger damages, termination, and downgrade pressure."
            - label: Partial
              detail: "Thirty percent overbuild and prior KPI performance are mitigants."
            - label: High
              detail: "Full-scale operating history is not yet established."
        - label: Leverage and capex
          values:
            - label: High
              detail: "Fitch forecasts 7.4x construction leverage in 2026."
            - label: High
              detail: "Delayed completion postpones deleveraging and cash generation."
            - label: Funded
              detail: "Cash, ABL capacity, and sponsor capital support the buildout."
            - label: High
              detail: "Funding does not eliminate cost, schedule, or refinancing exposure."
        - label: Supply chain
          values:
            - label: Medium
              detail: "Large engine orders and integration work remain ahead."
            - label: High
              detail: "Late or underperforming equipment can delay commissioning."
            - label: Partial
              detail: "Fixed-price coverage and Propell internalization reduce exposure."
            - label: Medium-high
              detail: "Delivery, throughput, and substitutability are not publicly verified."
    approximationNotes: >-
      Ordinal analyst assessment based on cited evidence; labels are not statistical
      probabilities, numerical scores, or independent engineering conclusions.
