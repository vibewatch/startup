figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  summary: Enterprise adoption path from sales-led scoping and Agent Studio configuration
    to multi-channel deployment, outcome billing, and platform expansion.
  data:
    items:
    - label: 1. Scoping & Qualification
      detail: Sales-led discovery evaluating contact center volume, legacy CRM integrations,
        and high-value workflows.
      touchpoints:
      - Executive briefing
      - Technical scoping call
      - Security & compliance review
    - label: 2. Agent Studio & Ghostwriter Build
      detail: Ingestion of enterprise SOPs, call audio, and transcripts to construct
        custom agent logic and SDK guardrails.
      touchpoints:
      - SOP ingestion
      - Agent SDK guardrail definition
      - CRM & ERP API connector setup
    - label: 3. Sandboxed Testing & Simulation
      detail: Validation of agent actions, compliance boundaries, and hallucination
        safeguards in sandbox environment.
      touchpoints:
      - Synthetic conversation testing
      - Adversarial compliance evaluation
      - Human-in-the-loop review
    - label: 4. Phased Production Launch
      detail: 2-to-10 week ramp into live customer traffic across digital messaging,
        web chat, and voice channels.
      touchpoints:
      - Initial traffic slice routing
      - Real-time supervisor monitoring
      - Escalation to human agents
    - label: 5. Outcome Billing & Monitoring
      detail: Contract-governed resolution billing where fees attach to completed
        business tasks and resolved tickets.
      touchpoints:
      - Task resolution verification
      - Contract outcome metering
      - Explorer trend analysis
    - label: 6. Horizontal Expansion
      detail: Cross-departmental adoption into new channels, voice transactions, and
        multi-step Horizon planning.
      touchpoints:
      - Voice payment rollout
      - ChatGPT app publishing
      - Long-horizon workflow extension
  approximationNotes: Workflow stages synthesized from published customer onboarding
    timelines and architectural review documentation.
