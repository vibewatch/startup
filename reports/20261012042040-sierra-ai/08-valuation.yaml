- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis Argument
  - Anti-Thesis Risk
  - Falsification Trigger
  rows:
  - - Market & Product
    - Leading enterprise AI agent platform commanding 40% of Fortune 50 logos across
      critical transaction workflows.
    - Customer service automation creates massive liability if agents fail in regulated
      insurance and banking tasks.
    - High-profile agent error resulting in regulatory enforcement or contract cancellation
      by Fortune 50 client.
  - - Financial Velocity
    - Rapid acceleration from $100M to $150M ARR within months demonstrates robust
      net expansion and enterprise wallet-share capture.
    - Extreme revenue multiple of ~105x trailing ARR leaves zero margin for deceleration
      or customer churn.
    - Growth deceleration below 50% YoY or multiple compression in private secondary
      transactions.
  - - Pricing & Business Model
    - Outcome-based pricing aligns customer ROI with platform usage, bypassing seat-based
      software license fatigue.
    - Resolution metrics suffer from opacity and potential contract drift, creating
      enterprise billing friction.
    - Customer pushback against outcome definitions or shift toward commoditized per-token
      routing platforms.
  - - Platform Moat & Architecture
    - Constellation architecture of 15+ models insulates against single-provider failure
      and optimizes latency and cost.
    - Structural governance conflict from founder OpenAI role and underlying dependency
      on third-party frontier LLMs.
    - Frontier model providers building native enterprise workflow connectors or OpenAI
      governance overhaul.
  notes: Evaluation contrasts enterprise customer momentum with liability exposure
    and unit-cost economics in production customer service.
