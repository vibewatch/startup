    title: "Outcome-Based Pricing Aligns Economic Incentives but Shifts Risk to Resolution Definition"
    body: "Sierra's outcome-based pricing model charges per resolved conversation rather than per seat, making procurement legible to support leaders comparing costs against human ticket handling. However, contractual definitions of completed resolutions introduce billing reconciliation friction."
    claimRefs:
      - "CM006"
      - "CM012"
  - calloutType: "risk"
    title: "Workforce Management Disconnect and Deployment Complexity Constrain Enterprise Velocity"
    body: "Enterprise support operations struggle to integrate autonomous agents into human staffing forecasts due to the lack of native workforce management tooling. Furthermore, multi-month deployment requirements restrict Sierra's addressable buyer base to well-resourced Fortune 500 enterprises."
    claimRefs:
