evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Unit Economics and Financial Performance
    missingEvidence: >-
      Audited GAAP gross margins, customer cohort retention metrics (NDR/NRR), professional services delivery costs, and
      cloud infrastructure compute expense breakdown.
    whyItMatters: >-
      High reported ARR of $150M+ and an outcome-based pricing model cannot be evaluated for margin sustainability or
      software gross margin profile without gross margin and cohort renewal disclosures.
    diligencePath: >-
      Request audited financial statements, customer cohort renewal analyses, and gross margin schedules under
      non-disclosure agreement during management diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: Detailed Board Composition and Governance Charters
    missingEvidence: >-
      Formal board of directors charter, independent director roster, and conflict-of-interest recusal protocols
      regarding OpenAI commercial interactions.
    whyItMatters: >-
      Clarifies governance guardrails regarding Bret Taylor's dual role as OpenAI board chair and Sierra co-CEO,
      especially as OpenAI expands enterprise distribution.
    diligencePath: >-
      Review certificate of incorporation, investors' rights agreement, voting agreements, and board committee charters
      in confidential data room.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: market-sizing-divergence
    missingEvidence: >-
      Audited third-party segmentation isolating standalone generative AI agent software spend from broader
      contact-center BPO labor and legacy CCaaS infrastructure.
    whyItMatters: >-
      Broad TAM estimates of $50B+ combine human agent labor displacement with software licensing, obscuring the
      serviceable software addressable market for Sierra.
    diligencePath: >-
      Request customer procurement data separating software platform fees from BPO contract offsets across enterprise
      deployments.
  - type: private-evidence-only
    severity: material
    topic: nrr-and-churn
    missingEvidence: >-
      Customer net revenue retention (NRR), gross retention, and logo churn rates segmented by annual contract value
      tiers.
    whyItMatters: >-
      Rapid initial ARR growth to $150M may mask renewal attrition if outcome-based pricing introduces budgetary
      unpredictability.
    diligencePath: Audit cohort renewal schedules and contractual outcome volume trends during management diligence sessions.
  - type: private-evidence-only
    severity: material
    topic: outcome-pricing-metrics
    missingEvidence: >-
      Exact contractual definitions of billable outcomes, escalation billing exclusions, and dispute resolution terms
      across Sierra and direct enterprise competitor agreements.
    whyItMatters: >-
      Without standardized audit metrics for what constitutes a completed resolution, enterprise buyers risk unexpected
      cost creep and budget variance during production scaling.
    diligencePath: >-
      Review redacted customer enterprise master service agreements (MSAs) and statement of work (SOW) outcome schedules
      during technical diligence.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: minor
    topic: independent-benchmarks
    missingEvidence: >-
      Independent third-party accuracy and end-to-end task completion benchmarks comparing Sierra AI directly against
      Decagon, Ada, and Agentforce on identical enterprise customer workflows.
    whyItMatters: >-
      Current comparative materials originate from vendor marketing and rival self-assessments rather than controlled
      arms-length enterprise evaluation studies.
    diligencePath: >-
      Obtain blinded proof-of-concept evaluation logs from shared enterprise design partners or RFP procurement
      advisers.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin breakdowns separating software platform gross margin from pass-through third-party LLM API
      inference costs and human onboarding services.
    whyItMatters: >-
      Without audited gross margin data, investors cannot verify whether Sierra commands true enterprise SaaS software
      margins (70-80%) or operates with compressed tech-enabled service margins (50-65%).
    diligencePath: >-
      Request audited GAAP income statements and cohort contribution margin reports during formal institutional data
      room access.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Cohort net revenue retention (NRR), gross revenue retention, and annual logo churn metrics across enterprise
      customer tiers.
    whyItMatters: >-
      Because outcome-based contracts tie billing to resolved volume rather than locked-in seat licenses, retention
      metrics are vital to gauge revenue durability against customer contact-volume fluctuations.
    diligencePath: Obtain quarterly cohort retention tables segmented by Fortune 50 enterprise customers vs mid-tier accounts.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: contract-terms
    missingEvidence: >-
      Standardized customer contract templates detailing contractual definitions of successful resolution and
      dispute-resolution mechanisms.
    whyItMatters: >-
      Opaque outcome definitions can lead to customer billing disputes if clients challenge whether automated triage
      constituted a fully resolved support ticket.
    diligencePath: Review representative anonymized customer master services agreements (MSAs) and service level agreements (SLAs).
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: llm-inference-unit-economics
    missingEvidence: >-
      Audited model routing logs, token consumption volume by LLM provider (OpenAI vs Anthropic vs Google vs
      open-weight), and cloud compute COGS to establish realized gross margins under outcome-based contracts.
    whyItMatters: >-
      Without knowing the underlying model inference expense per customer resolution, underwriting Sierra's long-term
      software gross margins versus managed services costs remains speculative.
    diligencePath: >-
      Request customer cohort margin schedules, LLM volume commitments and pricing tiers, and compute infrastructure
      bills during management diligence.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal-practitioner-proxy
    missingEvidence: >-
      Public open-source developer activity, GitHub repositories, package registry downloads (npm/PyPI), or public API
      documentation for Sierra Agent SDK.
    whyItMatters: >-
      Sierra operates a proprietary, gated enterprise distribution model without a self-serve developer ecosystem,
      limiting outside practitioner inspection of its SDK architecture.
    diligencePath: >-
      Interview enterprise customer integration engineers who have built custom endpoints using the proprietary Sierra
      Agent SDK.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: retention-and-churn
    missingEvidence: Detailed cohort-level net revenue retention (NRR), gross revenue retention (GRR), and annual churn statistics.
    whyItMatters: >-
      Without verified retention metrics, durability of early customer land-and-expand revenue cannot be independently
      modeled.
    diligencePath: Request audited cohort retention tables and renewal rates under NDA during customer reference diligence.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Exhaustive registry of all active production customer logos and contractual scope.
    whyItMatters: >-
      Public customer disclosures represent a selective subset of enterprise deployments, obscuring total account count
      and customer concentration.
    diligencePath: >-
      Obtain a complete customer master list and top-10 customer revenue concentration breakdown during financial
      diligence.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-regulatory
    missingEvidence: Primary regulator, court, privacy-authority, and incident records covering Sierra and its operating subsidiaries.
    whyItMatters: >-
      The assigned source set cannot establish either the presence or absence of litigation, enforcement, reportable
      incidents, or jurisdiction-specific restrictions.
    diligencePath: >-
      Run jurisdiction-specific docket and regulator searches, obtain counsel's litigation schedule, and reconcile
      results to representations and insurance notices.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: assurance
    missingEvidence: >-
      Full AIUC-1 and Schellman reports, scope boundaries, exceptions, remediation, penetration tests, and production
      incident history.
    whyItMatters: >-
      A certification announcement does not disclose whether the controls cover every product, model, integration,
      customer environment, or material exception.
    diligencePath: >-
      Review complete reports in a data room, interview the control owners, sample evidence for key controls, and trace
      exceptions through remediation closure.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-reliability
    missingEvidence: >-
      Production error, unauthorized-action, latency, transfer, escalation, rollback, uptime, and severity-one incident
      metrics by channel and customer cohort.
    whyItMatters: >-
      Competitor critiques identify plausible failure modes but cannot quantify their frequency, impact, or remediation
      in Sierra deployments.
    diligencePath: >-
      Inspect twelve months of production dashboards and postmortems, reproduce key workflows in a test tenant, and
      conduct reference calls with voice-heavy customers.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: model-and-platform-dependency
    missingEvidence: >-
      Provider-level traffic, spend, pricing commitments, service terms, data-use restrictions, model-routing logic,
      fallback performance, and partner-attributed pipeline.
    whyItMatters: >-
      Public sources do not quantify concentration, substitution cost, contractual exposure, or the economic effect of
      provider and platform changes.
    diligencePath: >-
      Review provider and platform contracts, routing and cost data, outage drills, fallback benchmarks, termination
      rights, and partner-sourced pipeline reports.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      GAAP revenue reconciliation, gross margin, model and voice cost per outcome, services intensity, burn, working
      capital, disputed billing, retention, and customer concentration by cohort.
    whyItMatters: >-
      ARR is not revenue, cash, or margin, and outcome pricing can conceal cost variability without invoice-level and
      cohort-level reconciliation.
    diligencePath: >-
      Reconcile ARR to contracts and audited financials, inspect outcome invoices and credits, and analyze gross margin,
      retention, concentration, and model cost by cohort.
    relatedQuestionRefs:
      - QR004
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-gross-margins
    missingEvidence: >-
      Audited gross margins after multi-model inference costs and Net Revenue Retention (NRR) cohorts across Fortune 50
      clients.
    whyItMatters: >-
      Without visibility into model compute COGS and expansion rates, investors cannot verify whether 105x ARR multiple
      compresses naturally via software-level cash flow generation.
    diligencePath: >-
      Request customer cohort retention matrices, gross margin schedules excluding professional services, and cloud
      compute / model inference cost breakdown in Phase II diligence.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: contract-terms-and-resolution-definitions
    missingEvidence: >-
      Standardized enterprise contract terms, definitions of billable resolved outcomes, and dispute resolution
      mechanisms.
    whyItMatters: >-
      Outcome-based pricing creates ambiguity around what constitutes a successful resolution versus an abandoned
      session, impacting revenue predictability and churn risk.
    diligencePath: >-
      Examine sample master service agreements (MSAs) and audit customer billing reconciliation logs during commercial
      diligence.
    relatedQuestionRefs:
      - QV008
