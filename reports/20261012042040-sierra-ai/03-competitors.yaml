callouts:
  - calloutType: "risk"
    title: "Outcome-Based Billing Opacity and Scope Ambiguity"
    body: "Sierra's outcome-based pricing aligns incentives in theory, but contract opacity creates budgeting risks for enterprise buyers. Without strict contractual definitions separating resolved interactions from multi-touch follow-ups or routing handoffs, scaling automation across complex workflows can drive unexpected budget escalation beyond initial $150K–$350K+ commitments."
    claimRefs:
      - "CP007"
      - "CP008"
      - "CP009"
  - calloutType: "insight"
    title: "Distribution Moats vs. Bespoke Architecture"
    body: "Incumbent CRM and help-desk providers like Salesforce and Zendesk command powerful distribution moats by embedding AI directly into pre-existing customer seats and system records. Sierra counters this gravity by targeting the highest-tier consumer enterprises with bespoke agent workflows that generic desk plugins cannot easily replicate."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP005"
      - "CP013"
