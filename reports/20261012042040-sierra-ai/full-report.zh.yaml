            - 合同结果计量
            - Explorer 趋势分析
        - label: 6. 横向扩张
          detail: 跨部门采用新渠道、语音交易和多步骤 Horizon 规划。
          touchpoints:
            - 语音支付上线
            - ChatGPT 应用发布
            - 长周期工作流扩展
