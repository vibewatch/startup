          label: 客户流入需求
          description: 企业账户通过语音、聊天、SMS、电子邮件和 WhatsApp 产生的大量客户服务请求。
        - id: node-2
          label: Agent OS 路由与分流
          description: 在多 LLM 星座（OpenAI、Anthropic、Meta）之间识别意图、评估护栏并自适应路由。
        - id: node-3
          label: 自主任务解决
          description: 智能体在记录系统中执行退货、保险理赔案件、取消和更新等操作，无需升级给人工即可解决问题。
        - id: node-4
          label: 结果计费触发
          description: 每次成功解决事项预计按约 $1.50 的实现事件计费，或转入对话层级费用。
        - id: node-5
          label: 直接销货成本与服务成本
