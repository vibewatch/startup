  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              面向客服的企业对话式 AI 市场处于 CCaaS 软件、对话自动化工具和联络中心 BPO 人力预算的交汇处。Sierra AI
              将边界划在高量、由客户发起的语音、聊天、邮件和消息服务互动。平台直接替代企业原本用于人工客服、BPO 合同和僵化 IVR
              电话树的支出。它不是只提供静态信息文章，而是跨后台记录系统执行写入动作，因此同时替代旧式关键词拦截机器人和一线人工客服。不过，Sierra
              明确排除通用办公自动化、内部员工服务台和个人生产力流程，专注客户侧企业运营。现状替代方案仍然强大：大型企业常保留传统电话基础设施，把原生机器人能力嵌入现有 CRM，或为复杂处理保留外包人工队列。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与 SOM 的约束
        blocks:
          - type: paragraph
            body: >-
              评估自主企业智能体的机会，需要把客户服务总支出与软件可服务预算拆开。行业分析师经常引用全球超过 $50B 的广义联络中心 TAM，但该数字把庞大人工工资与企业软件支出混在一起。Sierra 的 SAM
              更准确地应限定为生成式 AI 客户体验和自动化智能体软件层，估计每年 $8B–$12B。在这一范围内，SOM 聚焦拥有大量联络中心业务的高量消费企业，年度合同价值通常超过 $150,000，另有一次性
              $50,000–$200,000 的实施费。Sierra 上线公开亮相八个季度内 ARR 超过
              $150M，说明企业愿意为自主解决方案投入大额软件预算。但长期市场规模估算仍有分歧，因为供应商和研究机构对软件许可、按用量计费和外包人工替代的边界定义并不一致。
            claimRefs:
              - CM005
              - CM007
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM014
      - number: '2.3'
        title: 买方细分、预算归属与采购动态
        blocks:
          - type: paragraph
            body: >-
              Sierra 的核心客户是电信、金融服务、消费零售、医疗和数字市场中的大型消费企业。客户披露显示账户高度集中于巨型企业：约 25% 的客户年收入超过 $10B，50% 超过
              $1B。在这些组织里，经济买方通常是客户体验副总裁、首席客户官或联络中心运营负责人，他们掌握工单处理预算，并直接按每次联系成本接受考核。终端用户是希望快速解决订单更新、账单争议、技术排障和订阅变更等交易性问题的消费者。但采购需要
              IT、数据治理和信息安全团队跨职能对齐。由于 Sierra 不公布标准化价格表，且通过 Agent Data Platform 需要深度访问客户内部数据库，采购周期通常要经过四至十周谈判和定制合同起草。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              企业采用自主智能体，主要受高管要求降低联络中心运营成本、同时提升客户满意度的压力推动。Sierra
              的按结果定价直接利用这一经济驱动：主要在智能体确认解决问题时收费，让供应商报酬与可量化的运营分流对齐。但结构性约束会压低采用速度。独立评估指出，Sierra 是缺少集成劳动力管理的自动化单点方案，企业领导者无法把
              AI
              分流量与人工排班需求准确放在一起预测。此外，语音部署需要跨多个大语言模型进行复杂编排，会产生令习惯即时响应的来电者不满的对话延迟。最后，预先界定可计费结果本身存在歧义，尤其在复杂咨询需要人工升级时，会在续约和扩容阶段制造合同摩擦。
            claimRefs:
              - CM008
              - CM009
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 按结果定价对齐经济激励，却把风险转给解决方案定义
            body: Sierra 按解决的对话而非席位收费，便于客服负责人把采购成本与人工工单处理成本比较。但完成解决方案的合同定义会带来账单核对摩擦。
            calloutType: insight
            claimRefs:
              - CM006
              - CM012
          - type: callout
            title: 劳动力管理脱节与部署复杂度限制企业增速
            body: 企业客服运营因缺少原生劳动力管理工具，难以把自主智能体纳入人工排班预测。此外，数月的部署要求把 Sierra 的可服务买方限制在资源充足的 Fortune 500 企业。
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与架构细分
        blocks:
          - type: paragraph
            body: >-
              2026 年的对话式 AI 与客户体验市场分成两种架构：为深度、品牌治理工作流执行打造的定制企业平台，以及嵌入现有 CRM 的服务台原生自动化层。Sierra AI
              位于定制企业细分的顶端，面向在语音、网页聊天、消息和邮件中处理数百万次客户互动的 Fortune 50 消费品牌。该层最主要的风投支持直接竞争者是 Decagon，同样提供销售驱动的多渠道 AI
              礼宾智能体和企业分析。Ada 则是成熟的企业同类产品，支持数十种语言的无代码工作流编写。在垂直市场边缘，Lorikeet
              等平台专注金融科技、医疗和保险等强监管行业，强调亚秒级语音延迟和确定性政策推理。相反，次级企业团队越来越多采用 Macha 等轻量层，在现有服务台上配置 AI 智能体，以可预测的月度计划运行，无需企业级定制开发。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
      - number: '3.2'
        title: 差异化、持久性与定位动态
        blocks:
          - type: paragraph
            body: >-
              Sierra 的竞争壁垒有三根支柱：Bret Taylor 和 Clay Bavor 带来的企业高管触达；把标准作业流程转换为生产智能体的 Ghostwriter 构建工具；以及维持持久对话记忆和上下文智能的
              Agent Data Platform。但平台巨头持续考验这一壁垒。Salesforce 和 Zendesk 把 AI
              智能体直接打包进既有席位许可，凭借巨大分发能力降低企业采购摩擦。为避免孤立并强化品牌自有权威，Sierra 牵头推出与 Meta、Genesys、Shopify、Stripe 和 Walmart 共同开发的
              Personal Agent Protocol 等开放标准。该协议规定消费者侧个人 AI 智能体如何与品牌自有企业智能体交互，使 Sierra 更像基础设施，而非普通客服插件。
            claimRefs:
              - CP001
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP012
              - CP013
              - CP015
      - number: '3.3'
        title: 能力比较与企业集成取舍
        blocks:
          - type: paragraph
            body: >-
              企业买方比较不同 CX 自动化架构时，必须权衡明显取舍。Sierra
              强调跨系统深度执行，让智能体在后台系统中完成订阅修改、保险理赔案件路由和退款等复杂交易。这种深度需要大量集成工程和数周接入，一旦部署就形成较高组织切换成本。相比之下，Ada
              等无代码平台强调运营敏捷性，让非技术客服经理直接编写和调整工作流，但复杂多轮咨询中经常出现客户反馈的上下文漂移。在原生服务台一侧，Zendesk AI 智能体和 Salesforce Agentforce
              可无摩擦部署到原生工单队列，但仍受宿主生态边界限制。叠加在现有工单工具之上的非侵入式平台，则以牺牲原生语音和深度定制护栏为代价换取快速见效。
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP012
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 商业模式、定价不透明与采购风险
        blocks:
          - type: paragraph
            body: >-
              企业 AI 客服行业的定价模式反映出不同的价值获取逻辑。Sierra
              倡导按结果定价，理论上让供应商报酬与交付的商业价值及成功解决案件对齐。但由于公司不公布公开价格档位或价格表，合同需要大量定制调研、范围界定和企业谈判。第三方基准和采购跟踪显示，企业起始承诺约为每年
              $150,000；计入专业服务和上线范围后，第一年总成本常在 $200,000–$350,000 或更高。相比之下，现有服务台方案公布按用量价格，例如 Salesforce Fin 每个结果
              $0.99，Zendesk 每次验证解决 $1.50。Macha 等挑战者工具提供约 $0.40
              的固定单工单价格，不锁定年度合同。对企业买方而言，如果签约前不严格审计结果定义、升级排除项和后续互动归组方式，Sierra 的合同不透明会带来财务敞口。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
