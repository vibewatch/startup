        title: 展示项
        blocks:
          - type: callout
            title: 公开证据不能消除风险
            body: 已分配证据池没有证明具体数据泄露、诉讼、执法行动或宕机，但这种缺失不等于不存在。要通过投资审查，仍需主要法律记录、事故历史、保障报告、客户参考和私人运营数据。
            calloutType: risk
