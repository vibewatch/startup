            - SOP 摄取
            - Agent SDK 护栏定义
            - CRM 与 ERP API 连接器设置
        - label: 3. 沙盒测试与模拟
          detail: 在沙盒环境中验证智能体操作、合规边界及防止幻觉的保护措施。
          touchpoints:
            - 合成对话测试
            - 对抗式合规评估
            - 人在回路评审
        - label: 4. 分阶段生产上线
          detail: 用 2–10 周逐步接入数字消息、网页聊天和语音渠道的真实客户流量。
