  - id: FE001
    title: 产品架构图
    type: stack
    summary: Sierra Agent OS 的多层架构，覆盖客户触点、编排、推理、执行、记忆和合规。
    data:
      layers:
        - label: 渠道与触点层
          detail: 覆盖网页聊天、语音电话、SMS、电子邮件和 WhatsApp 的全渠道客户互动端点，支持 59 种语言。
          modules:
            - 网页聊天与应用内消息
            - 语音智能体与 SIP 电话
            - 消息（SMS、WhatsApp、电子邮件）
        - label: 编排与工具层
          detail: 面向 CX 运营人员和工程师的无代码 / 低代码开发、监控和提示词工程界面。
          modules:
            - Agent Studio 2.0
            - Ghostwriter 自然语言生成器
            - Live Assist 与 Explorer 分析
        - label: Constellation 编排层
          detail: 自主多智能体治理，将规划、工具执行与执行前安全验证分开。
          modules:
            - 规划智能体（意图与任务拆解）
            - 执行智能体（工具调用与编排）
            - 验证智能体（政策与品牌护栏）
        - label: 多模型智能层
          detail: 在 15+ 个前沿及开放权重模型之间动态路由并自动故障转移，按延迟、准确性和成本优化。
          modules:
            - 前沿推理 LLM（OpenAI、Anthropic、Google）
            - 低延迟分类与检索模型
            - 开放权重微调模型（Meta Llama）
        - label: 集成与行动层
          detail: 安全的双向连接器和 Agent SDK 运行时，将自主智能体连接到企业记录系统。
          modules:
            - CRM 连接器（Salesforce、Zendesk）
            - ERP 与订单管理（SAP、NetSuite）
            - 支付网关（PCI DSS Level 1 卡 / ACH）
        - label: 数据与企业治理层
          detail: 跨对话持久记忆、知识索引，以及全球监管框架下的合规执行。
          modules:
            - 智能体数据平台（长期记忆）
            - Expert Answers 知识摄取
            - 合规与安全（SOC 2、ISO 27001、HIPAA、GDPR）
    approximationNotes: 基于已发布技术评测和官方产品披露，对 Sierra 平台架构层的概念性呈现。
    claimRefs:
      - CE001
      - CE008
      - CE009
      - CE011
