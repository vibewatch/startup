chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Sierra AI 是一家总部位于旧金山、2023 年成立的企业软件公司，开发对话式 AI
              智能体，自动化企业服务、销售和账户管理各触点的客户体验流程。传统对话机器人通常只是浅层检索界面，或需要人工接管的轻量封装；Sierra 则将平台定位为智能体操作系统（Agent
              OS）。平台直接接入企业核心记录系统、CRM
              数据库、支付处理器和客服基础设施，独立完成商品退款、订阅更新、复杂保险理赔案件路由等完整运营动作。公司采用按结果计费的商业模式，主要在智能体成功解决客户问题时收费，而非按席位或单次互动收取传统软件订阅费。Sierra
              强调办公室内协作文化，并在旧金山现场进行招聘评估。
            claimRefs:
              - CO001
              - CO009
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: 创始人、治理与组织结构
        blocks:
          - type: paragraph
            body: >-
              Sierra 由两位知名科技高管共同创立，他们的行业声誉已成为拿下 Fortune 50 企业合同和巨额风投的重要助力。联合创始人兼联合 CEO Bret Taylor 曾任 Salesforce 联合
              CEO、Facebook CTO、Twitter 董事会主席，目前同时担任 OpenAI 董事会主席。联合创始人兼联合 CEO Clay Bavor 在 Google 任职 18 年，曾负责 Google
              Labs、增强现实与虚拟现实工程团队及重要消费产品。这样的高管履历带来极强的商业触达，但 Taylor 兼任 OpenAI 董事会主席也带来实质治理考量。Sierra 的架构高度依赖第三方基础模型，包括
              OpenAI 模型和基础设施；随着基础模型供应商扩大企业应用布局，这会引发商业冲突、模型独立性和潜在竞争重叠等结构性问题。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.3'
        title: 资本化历史与投资人联合体
        blocks:
          - type: paragraph
            body: >-
              Sierra 在企业软件史上实现了最快的估值跃升之一：成立三年内完成五轮主要融资，累计股权资本超过 $1.4B。公司于 2024 年 2 月结束隐身状态，完成由 Greenoaks Capital 领投的
              $110M Series A。2024 年 10 月，Greenoaks 与 ICONIQ Growth 领投 $175M Series B，估值 $4.5B；2025 年 9 月，Greenoaks 领投
              $350M Series C，估值 $10B。最近一次是 2026 年 5 月 4 日宣布的 $950M Series E，由 GV（Google Ventures）和 Tiger Global
              Management 领投，Benchmark、Sequoia Capital 与 Greenoaks 参与，投后估值升至 $15.8B。这轮融资把 Sierra 可用现金储备扩大至超过
              $1B，为全球市场拓展、收购及深度多模型研发提供充足资产负债表流动性。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: 运营规模、里程碑与战略逆风
        blocks:
          - type: paragraph
            body: >-
              Sierra 的商业部署覆盖以空前速度扩大：2024 年 11 月报告 ARR 达 $100M，距离上线仅七个季度；到 2026 年初 ARR 已超过 $150M。公司声称已覆盖 Fortune 50 中超过
              40% 的企业客户，公开参考部署包括 SiriusXM、SoFi、Brex、ADT、Cigna、Rocket Mortgage 和 Wayfair。2026 年春季，Sierra
              通过产品发布和收购加速平台能力及区域覆盖，2026 年 3 月推出 Ghostwriter 智能体构建智能体，并收购语音智能体开发商 Receptive AI、日本东京的 Opera Tech
              和巴黎工作流初创公司 Fragment。尽管商业表现强劲，竞争对手和行业观察者仍批评其谈判式结果协议的定价不透明、初次接入需要大量工程集成，以及与 Voiceflow
              等平台供应商的竞争张力；后者更强调客户自有智能体的自主性，而非供应商托管服务。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO012
              - CO014
