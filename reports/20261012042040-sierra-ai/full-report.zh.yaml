      - number: '7.5'
        title: 缓解措施、监测指标与论点失效标准
        blocks:
          - type: paragraph
            body: >-
              投资论点必须以控制措施在生产环境中有效运行为前提，而不能只看产品描述。应监测重大客户影响事故、未经授权动作、数据暴露、回滚频率、人工升级质量、集成交付延期、模型供应商成本变化、有争议的结果账单、续约行为和服务投入强度。论点失效触发条件包括尚未解决的重大安全或隐私事件；无法把已计费结果与可审计客户结果对账；模型或数据处理条款阻止受监管部署；生产反复失败且没有证明补救；或拒绝提供客户集中度、留存、毛利和模型成本证据。通过尽调需要底层报告、日志、合同和
              cohort 经济，而不是从没有公开不利记录推断安全。
            claimRefs:
              - CR003
              - CR004
