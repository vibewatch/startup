        title: 展示项
        blocks:
          - type: callout
            title: 创始人履历支撑的商业速度
            body: Sierra 在八个季度内升至 $150M ARR、覆盖 40% Fortune 50，属于企业软件增速的前十分位，背后由联合创始人声誉和按结果对齐的客户服务合同共同推动。
            calloutType: insight
