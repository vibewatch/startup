      - 反论点风险
      - 证伪触发条件
    rows:
      - - 市场与产品
        - 领先的企业 AI 智能体平台，在关键交易流程中覆盖《财富》50 强企业 40% 的客户标识。
        - 如果智能体在受监管的保险和银行任务中出错，客户服务自动化会造成巨大的责任风险。
