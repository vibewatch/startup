              Sierra 描述了有意义的控制：Ghostwriter 可以在沙盒中测试变更，公司称员工会直接与客户共建智能体。但这种交付模式也依赖实施质量、集成测试和持续监督。HappyRobot
              称部署可能比预期更久，传统集成会造成锁定；Capacity
              称存在语音延迟、通话控制和转接缺口。由于两家发布方都销售竞争产品，这些说法属于不利线索，并非已核验的事故证据。因此尽调应使用生产日志、失败动作率、回滚记录、延迟分布、升级结果、渗透测试和客户访谈，判断公开缓解措施能否规模化生效。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 伙伴、依赖与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              产品必须连接模型供应商、客户记录系统、通信渠道和不断扩大的伙伴生态。竞争者 Teneo 称 Sierra 使用 OpenAI、Anthropic 和 Meta
              的模型；这一点需要合同确认，但确实指向一条合理的集中度和重新定价尽调路径。Sierra
              自身的客户与伙伴公告显示其商业触达，而直接参与客户构建的岗位说明存在服务业务成分，其毛利和规模化影响尚未披露。Featurebase 和 Capacity 分别批评定价不透明，Sierra 公司索引报告 2026
              年 2 月 ARR 超过 $150M。ARR 不是收入、现金或毛利率；公开集合无法量化烧钱速度、毛利率、模型成本、客户集中度或营运资本。
            claimRefs:
              - CR001
              - CR002
