              - CE007
      - number: '5.3'
        title: Constellation Architecture, Integrations & Governance
        blocks:
          - type: paragraph
            body: >-
              Underpinning Sierra's reliability is its proprietary Constellation architecture, which decomposes
              conversation handling across specialized multi-agent roles rather than routing entire interactions through
              a single monolithic model. A planner agent first parses user intent and breaks requests into discrete
              logical steps; dedicated executor agents make parameterized tool calls against connected enterprise APIs;
              and independent validator agents inspect proposed actions against hard-coded compliance rules and company
              policies before execution occurs. To optimize latency, reasoning depth, and cost, Sierra routes tasks
              dynamically across more than 15 frontier and open-weight models from OpenAI, Anthropic, Google, and Meta,
              providing automated redundancy against provider downtime. Context is preserved across sessions via the
              Agent Data Platform, which indexes enterprise knowledge alongside interaction history. However, Sierra
              lacks pre-built plug-and-play connectors for standard helpdesks like Zendesk or Intercom, necessitating
              custom API engineering via the proprietary Agent SDK and extensive professional services that can stretch
              implementation timelines to several months.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
