  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Enterprise Focus
        blocks:
          - type: paragraph
            body: >-
              Sierra concentrates its commercial go-to-market almost exclusively on large enterprise buyers and
              multinational corporations. According to company disclosures and third-party analyst reviews, Sierra
              currently works with approximately 40% of the Fortune 50, with independent assessments noting that fully
              half of its client roster generates over $1 billion in annual revenue and one in four exceeds $10 billion.
              This ultra-large-enterprise concentration is evident across its core industry verticals, which are
              dominated by financial services, healthcare, telecommunications, and high-scale consumer subscription
              businesses. In banking, Sierra reports serving one in three leading institutions, while in healthcare it
              counts five of the top ten global organizations among its customer base. The primary economic buyer is
              typically an executive contact center leader, Chief Customer Officer, or Chief Operations Officer seeking
              to reduce operating expense across millions of annual customer contacts while avoiding the brand damage
              associated with brittle first-generation deflection chatbots.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: Adoption Trajectory and Deployment Velocity
        blocks:
          - type: paragraph
            body: >-
              Sierra's commercial trajectory demonstrates rapid adoption since emerging from stealth in early 2024. The
              company crossed $150 million in annual recurring revenue in February 2026, followed by third-party review
              indications that ARR expanded toward $200 million by August 2026. This trajectory represents one of the
              fastest revenue ramps in enterprise software history, driven by rapid customer expansion rather than
              low-touch product-led acquisition. Implementation velocity typically spans between two and ten weeks from
              initial scoping to live traffic, depending on whether an enterprise relies on pre-built connectors in
              Agent Studio or requires custom engineering for legacy on-premise systems of record. Sierra's platform
              deploys across six primary communication channels, including chat, voice, email, SMS, WhatsApp, and
              ChatGPT. Voice has emerged as a key growth catalyst following Sierra's certification of Level 1
              PCI-compliant payments, enabling agents to complete regulated financial transactions rather than merely
              providing informational responses.
            claimRefs:
              - CU004
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU006
      - number: '6.3'
        title: Named Enterprise Deployments and Production Outcomes
        blocks:
          - type: paragraph
            body: >-
              Publicly verified enterprise deployments confirm that Sierra has advanced beyond exploratory pilot
              programs into high-volume production operations. High-profile reference accounts include ADT, SiriusXM,
              WeightWatchers, Rocket Mortgage, Cigna, Sutter Health, Ramp, Brex, Chime, SoFi, and Nordstrom. In specific
              deployments such as WeightWatchers, company-reported case studies describe initial-week containment rates
              approaching 70% alongside customer satisfaction scores above 4.5 out of 5. The introduction of Ghostwriter
              in March 2026 has further accelerated customer workflow authoring by enabling non-technical customer
              experience managers to generate production-ready agents directly from standard operating procedure
              documents and recorded call transcripts. However, independent analysts caution that public customer proof
              remains selective. Sierra does not publish a standardized resolution benchmark across uniform measurement
              windows or identical workflow difficulty tiers, making it difficult for prospective buyers to evaluate how
              reported containment figures translate to complex, multi-party operational workflows.
            claimRefs:
              - CU004
              - CU005
              - CU008
              - CU010
          - type: table
