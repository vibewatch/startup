      - number: '7.2'
        title: Regulatory, legal, and data exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence contains no regulator record, court docket, incident disclosure, privacy decision,
              or complete assurance report concerning Sierra, so it cannot establish either the presence or absence of a
              legal event. The relevant exposure instead follows from the product surface described by Sierra: customers
              can supply transcripts, process documents, and recordings, and production agents can operate across
              channels. Sierra's September 2026 certification announcement is a mitigation signal, while its nine-city
              office footprint implies multiple operating jurisdictions. Before investment, counsel should verify data
              roles, model-provider terms, retention, audit scope, exceptions, insurance, and customer-specific
              regulatory obligations rather than treating a certification headline as complete coverage.
