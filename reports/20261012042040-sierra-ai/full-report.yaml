      - number: '7.5'
        title: Mitigations, monitors, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The investment case should remain conditional on evidence that controls operate in production, not merely
              on product descriptions. Monitor material customer-impacting incidents, unauthorized actions, data
              exposure, rollback frequency, human-escalation quality, integration delivery slippage, model-provider cost
              changes, disputed outcome invoices, renewal behavior, and services intensity. Thesis-break triggers are an
              unresolved material security or privacy event; inability to reconcile billed outcomes to auditable
              customer results; model or data-processing terms that prevent regulated deployment; repeated production
              failures without demonstrated remediation; or refusal to provide customer concentration, retention,
              gross-margin, and model-cost evidence. Passing diligence requires the underlying reports, logs, contracts,
