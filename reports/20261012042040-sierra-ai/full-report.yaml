              - CU005
      - number: '6.4'
        title: Retention Durability, Pricing Friction, and Platform Risks
        blocks:
          - type: paragraph
            body: >-
              Despite impressive top-line traction, Sierra's customer expansion model faces structural procurement
              friction and vendor lock-in risks. Sierra operates a quote-only, outcome-based pricing model with no
              public rate card or self-serve entry point, requiring prospective buyers to engage in lengthy commercial
              negotiations. While billing for completed resolutions aligns vendor incentives with customer success,
              competitive analyses and procurement reviews note that vendor-defined task completion creates contract
              dispute exposure when resolution definitions diverge. Furthermore, Sierra's proprietary Agent OS and
              declarative SDK prevent exporting agent workflows to open standards, raising enterprise switching costs
              and architectural lock-in concerns. Finally, while Sierra collaborates with major enterprise design
              partners including Walmart, Shopify, and Stripe on industry initiatives like the Personal Agent Protocol,
              the company keeps retention metrics such as net revenue retention, gross revenue retention, and logo churn
              strictly confidential, leaving cohort durability an open question.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
