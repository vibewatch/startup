      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Sierra describes meaningful controls: Ghostwriter can test changes in a sandbox, and the company says
              staff work directly with customers to build agents. Yet this delivery model also creates execution
              dependence on implementation quality, integration testing, and continuous oversight. HappyRobot alleges
              deployments can take longer than expected and legacy integrations can create lock-in; Capacity alleges
              voice latency, call-control, and transfer gaps. Because both publishers sell competing products, these
              claims are adverse leads rather than verified incident evidence. Diligence should therefore use production
              logs, failed-action rates, rollback records, latency distributions, escalation outcomes, penetration
