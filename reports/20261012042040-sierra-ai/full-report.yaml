      - number: '5.2'
        title: Enterprise Workflows & Action Resolution
        blocks:
          - type: paragraph
            body: >-
              The defining technical differentiator of Sierra is action execution: agents do not merely cite knowledge
              base articles or route tickets, but interact directly with enterprise systems of record to complete
              complex transactions end to end. Through secure API connectors, Sierra agents authenticate customers,
              query order management systems (OMS) or enterprise resource planning (ERP) databases, calculate warranty
              or return eligibility, and execute refunds or billing adjustments without human intervention. For
              asynchronous processes that cannot be settled in a single session—such as return merchandise authorization
              requiring transit, warehouse inspection, and subsequent reimbursement—Sierra's Horizon planning subsystem
              maintains persistent state across multiple days, eliminating the friction of customers repeating context
              across touches. Commercially, Sierra aligns this transaction capability with an outcome-based pricing
              framework, charging enterprise buyers based on successfully completed resolutions rather than vanity
              metrics such as seat licenses or raw conversational volume.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
