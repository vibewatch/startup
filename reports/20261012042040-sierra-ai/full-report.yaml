  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Residual risk ranking
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are AI reliability and data governance, integration and deployment
              execution, vendor and platform dependency, and pricing or unit-economics opacity. The impact is
              potentially high because Sierra says Ghostwriter turns operating materials into production agents across
              voice, chat, email, and more than 30 languages, while the company also claims adoption by 40% of the
              Fortune 50. Public mitigations include sandbox validation, guardrails, and an announced AIUC-1
              certification. Those controls are encouraging but remain company-described in this source set; their
              scope, exceptions, incident history, and effectiveness in customer deployments require direct diligence.
              Competitor-authored critiques are useful risk signals, not independent proof.
            claimRefs:
