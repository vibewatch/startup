        - HappyRobot alleges slower-than-expected deployment and difficult custom or legacy connections
        - High
        - Unclear; Sierra says teams work directly with customers
        - Medium-high
        - Implementation plans, delivery variance, custom-code inventory, and exit or migration testing
      - - Voice-channel degradation or failed handoff
        - Capacity alleges latency, weak call control, and missing IVR or transfer features
        - High for voice-dependent customers
        - Unverified in primary evidence
        - Medium-high
        - P50/P95 latency, transfer success, abandonment, escalation quality, and reference calls
      - - Quality regression from rapid autonomous iteration
        - Ghostwriter is described as analyzing, improving, testing, and preparing changes
        - High
        - Company describes a sandbox and review preparation
        - Medium
        - Release approvals, canary controls, regression suites, incident postmortems, and rollback logs
    notes: >-
      Risk likelihood labels are evidence signals rather than measured probabilities; the two negative deployment claims
      are competitor-issued and are retained as diligence leads, not as verified failures.
