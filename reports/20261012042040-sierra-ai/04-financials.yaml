callouts:
- calloutType: risk
  title: Outcome-Based Billing Exposes Revenue to Volume and Definition Volatility
  body: Unlike traditional enterprise SaaS contracts that lock in predictable recurring
    revenue per user seat regardless of software utilization, Sierra's outcome-based
    pricing model links top-line monetization to actual resolved customer interactions.
    This creates quarterly revenue sensitivity to seasonal contact volumes and exposes
    contracts to renegotiation risks over what constitutes an autonomous resolution.
  claimRefs:
  - CI002
  - CI005
- calloutType: insight
  title: Massive Capital Cushion De-Risks Runway Ahead of CFO Appointment
  body: With $950 million secured in its May 2026 Series E round and more than $1
    billion in reported capital available, Sierra has established a fortress balance
    sheet that eliminates near-term financing dependency. The appointment of former
    Spotify executive Julia Brau Donnelly as Chief Financial Officer in September
    2026 positions the company to institute formal financial controls, optimize multi-model
    inference COGS, and prepare for institutional underwriting.
  claimRefs:
  - CI013
  - CI014
