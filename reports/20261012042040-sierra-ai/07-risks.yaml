schemaVersion: "report-v2"
artifact: risks
slug: sierra-ai
runDate: 2026-10-12
company:
  name: Sierra AI
chapter:
  number: 7
  title: Risks
  summary: >-
    Sierra's broad action surface, direct implementation model, opaque outcome pricing, and
    reliance on external model and enterprise-system connections create high-consequence
    execution risks even though the company reports large-enterprise adoption and a recent
    assurance certification. The public evidence does not establish a specific breach,
    enforcement action, lawsuit, or outage; the key investment issue is whether private
    audit, incident, contract, concentration, and unit-economics evidence can reduce the
    residual exposure.
sections:
  - id: residual-risk-ranking
    title: Residual risk ranking
    body: >-
      The highest residual exposures are AI reliability and data governance, integration and
      deployment execution, vendor and platform dependency, and pricing or unit-economics
      opacity. The impact is potentially high because Sierra says Ghostwriter turns operating
      materials into production agents across voice, chat, email, and more than 30 languages,
      while the company also claims adoption by 40% of the Fortune 50. Public mitigations
      include sandbox validation, guardrails, and an announced AIUC-1 certification. Those
      controls are encouraging but remain company-described in this source set; their scope,
      exceptions, incident history, and effectiveness in customer deployments require direct
      diligence. Competitor-authored critiques are useful risk signals, not independent proof.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
    figureRefs:
      - FR001
  - id: regulatory-legal-and-data
    title: Regulatory, legal, and data exposure
    body: >-
      The assigned evidence contains no regulator record, court docket, incident disclosure,
      privacy decision, or complete assurance report concerning Sierra, so it cannot establish
      either the presence or absence of a legal event. The relevant exposure instead follows
      from the product surface described by Sierra: customers can supply transcripts, process
      documents, and recordings, and production agents can operate across channels. Sierra's
      September 2026 certification announcement is a mitigation signal, while its nine-city
      office footprint implies multiple operating jurisdictions. Before investment, counsel
      should verify data roles, model-provider terms, retention, audit scope, exceptions,
      insurance, and customer-specific regulatory obligations rather than treating a
      certification headline as complete coverage.
    claimRefs:
      - CR003
      - CR006
      - CR007
      - CR015
    tableRefs:
      - TR001
  - id: operational-quality-and-security
    title: Operational, quality, and security risk
    body: >-
      Sierra describes meaningful controls: Ghostwriter can test changes in a sandbox, and the
      company says staff work directly with customers to build agents. Yet this delivery model
      also creates execution dependence on implementation quality, integration testing, and
      continuous oversight. HappyRobot alleges deployments can take longer than expected and
      legacy integrations can create lock-in; Capacity alleges voice latency, call-control, and
      transfer gaps. Because both publishers sell competing products, these claims are adverse
      leads rather than verified incident evidence. Diligence should therefore use production
      logs, failed-action rates, rollback records, latency distributions, escalation outcomes,
      penetration tests, and reference calls to determine whether the public mitigations work
      at scale.
    claimRefs:
      - CR004
      - CR005
      - CR009
      - CR010
      - CR011
    tableRefs:
      - TR002
  - id: dependencies-and-economic-model
    title: Partner, dependency, and financial-model risk
    body: >-
      The product must connect model providers, customer systems of record, communication
      channels, and a growing partner ecosystem. Teneo, a competitor, says Sierra uses models
      from OpenAI, Anthropic, and Meta; this needs contractual confirmation, but it identifies
      a plausible concentration and repricing diligence path. Sierra's own customer and partner
      announcements show commercial reach, while direct customer-building roles indicate a
      services component whose margin and scaling effect is undisclosed. Featurebase and
      Capacity separately criticize pricing opacity, and Sierra's corporate index reports more
      than $150 million of ARR in February 2026. ARR is not revenue, cash, or margin; the public
      set cannot quantify burn, gross margin, model cost, customer concentration, or working
      capital.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR008
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
    tableRefs:
      - TR003
  - id: mitigations-monitors-and-kill-criteria
    title: Mitigations, monitors, and thesis-break criteria
    body: >-
      The investment case should remain conditional on evidence that controls operate in
      production, not merely on product descriptions. Monitor material customer-impacting
      incidents, unauthorized actions, data exposure, rollback frequency, human-escalation
      quality, integration delivery slippage, model-provider cost changes, disputed outcome
      invoices, renewal behavior, and services intensity. Thesis-break triggers are an
      unresolved material security or privacy event; inability to reconcile billed outcomes to
      auditable customer results; model or data-processing terms that prevent regulated
      deployment; repeated production failures without demonstrated remediation; or refusal to
      provide customer concentration, retention, gross-margin, and model-cost evidence. Passing
      diligence requires the underlying reports, logs, contracts, and cohort economics, not an
      inference from the absence of public adverse records.
    claimRefs:
      - CR003
      - CR004
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk area
      - Public status
      - Likelihood signal
      - Severity
      - Mitigation evidence
      - Residual exposure
      - Diligence path
    rows:
      - - Privacy and customer-data governance
        - Sierra describes ingesting transcripts, process documents, images, and recordings; no incident is established by this pool
        - Inherent exposure from sensitive enterprise inputs and multi-channel actions
        - High
        - Company-described guardrails and sandbox validation
        - Medium-high until data maps, retention terms, and incident records are reviewed
        - Review DPA, subprocessors, data-flow map, retention controls, pen tests, and material incident register
      - - AI assurance and regulated-use controls
        - Company announced AIUC-1 certification on 2026-09-29 after a Schellman audit and AIUC testing
        - Current certification signal, but scope and exceptions are not in the assigned text
        - High
        - Announced certification plus company-described validation controls
        - Medium until the report, scope, exceptions, and customer deployments are verified
        - Obtain the complete audit report, management response, control exceptions, and regulated-customer references
      - - Model-provider, IP, and contractual allocation
        - A competitor says Sierra uses models from OpenAI, Anthropic, and Meta; contracts are not public here
        - Dependency allegation is plausible but not independently verified
        - High
        - Multi-model architecture may diversify capability, but contractual controls are undisclosed
        - Medium-high pending provider, training-rights, indemnity, and continuity terms
        - Inspect model-provider agreements, IP indemnities, data-use restrictions, fallback tests, and change-of-terms protections
    notes: >-
      Partial public-source enumeration as of 2026-10-12; severity reflects the evidenced
      product surface and potential consequence, not a finding that an incident or violation
      occurred. Competitor assertions require primary-document confirmation.
    enumerationScope:
      coverage: partial
      basis: >-
        Three material legal and regulatory exposure areas identifiable in the assigned
        prefetched source set; no comprehensive docket or regulator search was available.
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR007
      - CR015
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved evidence
    rows:
      - - Agent error or unsafe production action
        - Broad action surface and continuous agent-building cycle
        - High
        - Developing; company describes guardrails and sandbox validation
        - Medium-high
        - Production error rates, unauthorized-action counts, rollback times, and control exceptions
      - - Integration delay or legacy-system lock-in
        - HappyRobot alleges slower-than-expected deployment and difficult custom or legacy connections
        - High
        - Unclear; Sierra says teams work directly with customers
        - Medium-high
        - Implementation plans, delivery variance, custom-code inventory, and exit or migration testing
      - - Voice-channel degradation or failed handoff
        - Capacity alleges latency, weak call control, and missing IVR or transfer features
        - High for voice-dependent customers
        - Unverified in primary evidence
        - Medium-high
        - P50/P95 latency, transfer success, abandonment, escalation quality, and reference calls
      - - Quality regression from rapid autonomous iteration
        - Ghostwriter is described as analyzing, improving, testing, and preparing changes
        - High
        - Company describes a sandbox and review preparation
        - Medium
        - Release approvals, canary controls, regression suites, incident postmortems, and rollback logs
    notes: >-
      Risk likelihood labels are evidence signals rather than measured probabilities; the two
      negative deployment claims are competitor-issued and are retained as diligence leads,
      not as verified failures.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR009
      - CR010
      - CR011
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Foundation-model supply
        - OpenAI, Anthropic, and Meta are named by competitor Teneo
        - Exact traffic, spend, and contractual concentration are undisclosed
        - Repricing, degradation, policy change, or unavailable model interrupts economics or service
        - High
        - Claimed use of multiple providers may permit substitution
        - Medium-high pending contracts, routing data, fallback tests, and cost sensitivity
      - - Customer systems and legacy integrations
        - Customer CRM, order, policy, and other systems of record
        - No integration concentration metrics are public in this pool
        - A brittle connection blocks actions, delays launch, or raises switching cost
        - High
        - Direct customer-building teams and sandbox validation
        - Medium-high pending delivery data and portability tests
      - - Marketplace and ecosystem channels
        - Technology platforms, marketplaces, and service partners announced by Sierra
        - Partner-level pipeline and revenue contribution are undisclosed
        - Changed platform terms or partner underperformance slows distribution or functionality
        - Medium
        - Broader partner ecosystem can diversify access
        - Medium pending partner contracts and attributed pipeline
      - - Outcome billing and implementation labor
        - Sierra pricing is described by competitors as outcome-based; company roles work directly with customers
        - Services intensity, disputed outcomes, and customer-level economics are undisclosed
        - Costs scale faster than realized customer value or delivery capacity
        - High
        - Outcome alignment can connect fees to delivered value when definitions are auditable
        - High until invoices, definitions, gross margin, and cohort economics reconcile
    notes: >-
      Counterparty and pricing observations combine company-issued operating descriptions with
      competitor-issued critiques. ARR is excluded from dependency concentration because it
      does not disclose customer, provider, or channel mix.
    claimRefs:
      - CR005
      - CR008
      - CR010
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
