- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - Sierra Solution
  - Measurable Benefit
  - Technical Limitation
  rows:
  - - Order & Return Management
    - Customer initiates chat/email; human agent looks up order in ERP and issues
      RMA
    - Autonomous agent queries OMS via API, validates return policy, and issues shipping
      label directly
    - End-to-end resolution in under 2 minutes without human escalation
    - Complex warranty exceptions and physical fraud inspections still require human
      escalation
  - - Mortgage & Financial Inquiries
    - Customer calls contact center; IVR routing with 10+ minute queue wait
    - Voice agent authenticates caller, verifies account status, and guides application
      tracking or refinancing steps
    - Immediate 24/7 access with conversational sentiment adaptation
    - Regulated advisory statements require strict hard-coded compliance guardrails
  - - Subscription & Billing Updates
    - Customer navigates web self-serve or queues for billing specialist
    - Agent updates CRM/billing records, applies pro-rated credits, and processes
      PCI-certified card payments
    - Deflects routine billing transactions with zero manual queue load
    - Multi-system reconciliation failures can cause stalled transactions requiring
      manual sync
  - - Multi-Step Warranty Claims
    - Multiple siloed touchpoints across days with repeated customer data entry
    - Horizon long-horizon planning tracks shipment, inspection, and reimbursement
      in a unified thread
    - Persistent conversation state prevents customers from repeating context across
      touches
    - Cross-system timeout or external shipping API outage pauses asynchronous resolution
      thread
  notes: Enterprise customer support workflows synthesized from verified case studies
    (Casper, SiriusXM, Rocket Mortgage) and product technical reviews.
  claimRefs:
  - CE004
  - CE005
  - CE006
  - CE007
- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - System Role
  - Key Dependency
  - Operational & Diligence Risk
  rows:
  - - Planner Agent
    - Intent classification and multi-step task decomposition
    - Frontier LLM reasoning capabilities (OpenAI, Anthropic)
    - Prompt injection or misclassification on adversarial customer inputs
  - - Executor Agents
    - Carries out API calls against connected enterprise systems (CRM, ERP, Billing)
    - Enterprise Agent SDK and custom client REST/GraphQL endpoints
    - Backend API schema changes or rate limits breaking runtime execution
  - - Validator Agents
    - Pre-execution policy verification and brand guardrail enforcement
    - Configured enterprise business rules and compliance policy engines
    - Overly restrictive rules causing false rejections or brittle customer interactions
  - - Agent Data Platform
    - Persistent cross-session memory and conversation state management
    - Distributed storage and enterprise identity resolution mapping
    - Data privacy compliance (GDPR/CCPA) and data synchronization drift
  notes: Architectural components of Sierra Constellation framework compiled from
    technical reviews, platform whitepapers, and practitioner analysis.
