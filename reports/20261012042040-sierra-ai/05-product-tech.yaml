  - CE008
  - CE009
  - CE010
figures:
- id: FE001
  title: Product Architecture Map
  type: stack
  summary: Multi-tier architecture of Sierra Agent OS, spanning client touchpoints,
    orchestration, reasoning, execution, memory, and compliance.
  data:
    layers:
    - label: Channel & Touchpoint Layer
      detail: Omnichannel customer interaction endpoints across web chat, voice telephony,
        SMS, email, and WhatsApp supporting 59 languages.
      modules:
      - Web Chat & In-App Messaging
      - Voice Agents & SIP Telephony
      - Messaging (SMS, WhatsApp, Email)
    - label: Authoring & Tooling Layer
      detail: No-code/low-code development, monitoring, and prompt engineering surfaces
        for CX operators and engineers.
      modules:
      - Agent Studio 2.0
      - Ghostwriter Natural Language Generator
      - Live Assist & Explorer Analytics
    - label: Constellation Orchestration Layer
      detail: Autonomous multi-agent governance separating planning, tool execution,
        and pre-execution safety validation.
      modules:
      - Planner Agent (Intent & Task Decomposition)
      - Executor Agents (Tool Calling & Orchestration)
      - Validator Agent (Policy & Brand Guardrails)
    - label: Multi-Model Intelligence Layer
      detail: Dynamic routing and automatic failover across 15+ frontier and open-weight
        models optimized by latency, accuracy, and cost.
      modules:
      - Frontier Reasoning LLMs (OpenAI, Anthropic, Google)
      - Low-Latency Classification & Lookup Models
      - Open-Weight Fine-Tuned Models (Meta Llama)
    - label: Integration & Action Layer
      detail: Secure bidirectional connectors and Agent SDK runtime linking autonomous
        agents to enterprise systems of record.
      modules:
      - CRM Connectors (Salesforce, Zendesk)
      - ERP & Order Management (SAP, NetSuite)
      - Payment Gateways (PCI DSS Level 1 Card/ACH)
    - label: Data & Enterprise Governance Layer
      detail: Cross-conversation persistent memory, knowledge indexing, and compliance
        enforcement across global regulatory frameworks.
      modules:
      - Agent Data Platform (Long-Term Memory)
      - Expert Answers Knowledge Ingestion
      - Compliance & Security (SOC 2, ISO 27001, HIPAA, GDPR)
