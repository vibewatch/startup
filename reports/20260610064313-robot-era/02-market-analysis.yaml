tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Robot Era
  rows:
  - - Commercial humanoid robots for logistics and warehousing
    - Humanoid hardware, embodied-AI software, end-effectors, integration, deployment support for picking, sorting, induction, and handling
    - Generic warehouse software, AMRs without humanoid manipulation, manual temp labor spend outside robot substitution
    - Warehouse operator, 3PL, courier, or logistics-center automation owner
    - Highest near-term relevance because this is Robot Era's clearest public deployment wedge
  - - Humanoid robots for manufacturing
    - Factory humanoids for component picking, assembly, inspection, and other structured industrial tasks
    - Broad industrial-robot market, machine tools, and non-humanoid fixed automation not requiring human-form factors
    - Plant operations, engineering, and quality leaders
    - High relevance because Chinese factory density and policy support improve deployment odds
  - - Commercial-service humanoids
    - Retail, front-desk, guidance, and similar customer-facing embodied-AI workflows
    - Consumer gadgets, entertainment robots, and generic software assistants
    - Store operator, mall manager, hospital or service-location operator
    - Relevant but less proven than logistics or manufacturing
  - - China embodied-AI scenario market
    - Policy-backed pilots, standards work, industrial deployment support, and enterprise commercialization programs
    - All of China's AI market and all robotics categories
    - Municipal governments, industrial parks, and enterprise adopters
    - Best public SAM geography because policy and applications are concentrated there
  - - Global commercial humanoid market
    - Revenue from commercially deployed humanoid platforms across enterprise verticals
    - Research prototypes, demos, and aspirational home-robot narratives
    - Global enterprise buyers and integrators
    - Useful TAM anchor but too broad to use as Robot Era's near-term serviceable market
  - - Status-quo substitutes
    - Fixed industrial robots, AMRs, cobots, workflow redesign, and human labor
    - N/A
    - The same buyers as above
    - These substitutes compete for the same budget and slow humanoid conversion if ROI is weaker
  notes: The key boundary choice is to size Robot Era against commercially deployed humanoids in structured enterprise tasks, not against all automation or all embodied-AI rhetoric.
