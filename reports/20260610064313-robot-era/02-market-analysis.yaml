- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Logistics centers / parcel operations
    - 3PL, courier, warehouse operator, or large shipper
