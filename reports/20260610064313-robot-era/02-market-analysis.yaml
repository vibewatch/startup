- id: china-policy-and-market-substrate
  title: China policy and automation substrate
  body: 'China matters more than a generic global average for this chapter because both policy and installed automation capacity are unusually concentrated there. Official and state-linked sources show that 2026 brought China''s first national standard framework for humanoid robotics and embodied intelligence, while Shanghai separately set a 2027 plan targeting 100 leading enterprises, 100 application scenarios, 100 products, and more than RMB50 billion of output with subsidy support for commercialization. China Daily also ties embodied AI directly to the 2026 Government Work Report and cites a Development Research Center forecast of a domestic embodied-AI market reaching RMB400 billion by 2030 and more than RMB1 trillion by 2035. The installed automation base is equally important. IFR says China represented 54% of global industrial-robot deployments in 2024, exceeded 2 million robots in operational stock, and still had room for about 10% annual growth through 2028. In other words, Robot
    Era is trying to scale inside the world''s deepest factory-automation market just as policymakers are trying to standardize and accelerate embodied-AI deployment. That is a powerful SAM tailwind, but it does not eliminate technical fragmentation: multiple China sources still emphasize uneven hardware quality, data silos, dexterous-hand bottlenecks, and the need for common evaluation standards before scale becomes routine.'
