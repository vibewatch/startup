- id: target-verticals-and-buyer-map
  title: 'Target verticals: logistics, manufacturing, and commercial services'
  body: 'The strongest buyer evidence is not for a generic household humanoid, but for enterprise operators that already spend heavily on automation and feel labor or throughput pressure. Logistics is the clearest wedge because IFR already records transportation and logistics as the largest professional service-robot application, warehouse-automation analysts expect broader adoption through 2026 and 2027, and Robot Era''s public deployments are concentrated in logistics centers. Manufacturing is the second major wedge because China Daily, IFR, and company-linked reporting all point to structured factory tasks such as component picking, assembly, sorting, and inspection where reliability matters more than social interaction. Commercial services are a third but less standardized wedge: retail, front-of-house, guidance, and similar tasks fit the humanoid form, yet the proof is thinner and more pilot-like than in warehouses or factories. The buyer map therefore splits three ways. In logistics,
    operations or automation leaders own the budget and warehouse teams are the users. In manufacturing, plant, engineering, and quality leaders are both sponsors and adopters. In commercial services, the payer may be a retail operator, mall, hospital, or appliance partner, but adoption still depends on whether the robot beats cheaper fixed-function alternatives. That makes Robot Era''s market less about consumer novelty and more about which enterprise workflows reward a human-compatible form factor quickly enough to justify deployment.'
