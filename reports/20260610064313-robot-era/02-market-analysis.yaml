company:
  name: Robot Era
chapter:
  number: 2
  title: Market Analysis
  summary: Robot Era's market is best framed as commercially deployed humanoid robotics for structured logistics, manufacturing, and commercial-service workflows rather than all robotics or all AI. The evidence supports a narrow near-term market lens of roughly $1.9 billion to $3 billion today with much larger long-run upside cases, while China's policy-backed embodied-AI push makes it the most relevant serviceable geography. For Robot Era specifically, public data supports an early SOM wedge in Chinese logistics and industrial deployments, but not a clean market-share calculation because orders, centers, and delivery plans are disclosed more clearly than recognized revenue, renewals, or unit economics.
sections:
- id: market-boundary-and-estimate-range
  title: Market boundary, included spend, and estimate range
  body: 'Robot Era should not be underwritten against all global robotics, all automation, or all embodied-AI spending. The most defensible boundary is commercially deployed humanoid robots used in structured enterprise workflows where a human-shaped form can substitute for labor in environments already built for people. BCC''s scope is useful because it explicitly focuses on commercial deployments across automotive, logistics and warehousing, government and public services, healthcare, and retail or commercial services, while excluding pilots, demos, and prototypes. IFR and multiple industry commentaries also point to warehousing and manufacturing as the first serious proving grounds, not the full universe of service work. That means the included spend is hardware, embodied-AI software, integration, and deployment services for real logistics, manufacturing, and customer-facing operations. Excluded spend is the much larger pool of conventional industrial robots, AMRs, warehouse software,
    consumer gadgets, and research-stage systems that do not yet represent real humanoid buying behavior. Public estimates remain inconsistent: BCC gives a $1.9 billion 2025 market growing to $11 billion by 2030, while CNBC''s Barclays summary describes only a $2 billion to $3 billion market today but a much larger long-run option value. The contradiction is not a bug; it is the right warning that today''s monetized market is still small relative to the future narratives attached to it.'
