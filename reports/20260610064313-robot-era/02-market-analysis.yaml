- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Labor gaps and 24/7 throughput needs
    - Driver
    - Current / near-term
    - Warehousing and factories already have a budget reason to test humanoids that can work in human-shaped spaces
    - Request customer ROI cases showing labor savings, uptime, and error rates
  - - China policy, standards, and subsidies
    - Driver
    - Current / 2027
    - National and Shanghai policy support can shorten the path from pilot to deployment in China
    - Separate symbolic policy support from signed purchasing commitments
  - - Warehouse automation expansion
    - Driver
    - Current / 2027
    - Humanoids enter a logistics market where automation penetration is still increasing rather than saturated
    - Validate whether humanoids win share against AMRs, fixed systems, and cobots
  - - Rapid cost compression and production scaling
    - Driver
    - Current / 2028
    - Falling prices can unlock broader adoption if reliability holds
    - Check BOM trajectory, service burden, and whether lower prices preserve margins
  - - Dexterous-hand, data, and safety bottlenecks
    - Constraint
    - Current
    - Technical immaturity can delay scale beyond structured tasks and small pilots
    - Request task success rates, intervention rates, safety incidents, and certification roadmap
  - - Weak public SOM visibility
    - Constraint
    - Current
    - Orders and delivery plans look strong, but public sources do not reveal recognized revenue, retention, or unit economics
    - Request customer cohort data, realized revenue, renewal behavior, and gross margins by vertical
  notes: 'The underwriting issue is timing: real demand exists, but commercialization speed depends on whether falling costs outrun persistent reliability, safety, and ROI bottlenecks.'
