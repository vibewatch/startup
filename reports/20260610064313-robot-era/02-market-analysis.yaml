  evidenceGaps:
  - type: missing-source
    severity: material
    topic: specialized-sam
    missingEvidence: A management-grade market model or transaction dataset that isolates paid humanoid demand in China logistics, manufacturing, and commercial services instead of broader embodied-AI or robotics categories.
    whyItMatters: Without a clean SAM denominator, the chapter can support directionally that China is the right geography and set of verticals, but it cannot produce one precise revenue pool for Robot Era.
    diligencePath: Request Robot Era's internal market map by vertical, average selling price by robot class, and the company's own qualified pipeline by logistics, manufacturing, and commercial-service accounts.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: obtainable-market-share
    missingEvidence: Recognized revenue, repeat-order rates, deployment utilization, renewal behavior, and gross margin by customer or vertical for Robot Era's current installed base.
    whyItMatters: Public sources show orders, logistics centers, and delivery plans, but those signals do not reveal whether the company's current SOM is durable, margin-positive, or concentrated in a few strategic customers.
    diligencePath: Ask management for booked versus recognized revenue, cohort-level retention, realized ASPs, deployment economics, and customer concentration for logistics and manufacturing programs.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
