- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Export-control and market-access shock
    - Policy change affecting compute, sensors, or Chinese-made robots
    - Any new rule that blocks a core Robot Era compute component, key sensor, or intended overseas procurement channel
    - Pause global-scale underwriting until management produces a credible technical and commercial workaround
  - - Technical readiness gap
    - Field KPI slippage during scale-up
    - No public or private evidence of improving uptime, error recovery, and safe-operation metrics as deliveries ramp
    - Move from growth thesis to controlled-pilot thesis and haircut valuation for service burden
  - - Commercialization failure
    - Backlog/order story stops converting
    - Flagship logistics deployments do not translate into repeat orders, recognized revenue quality, or customer diversification
    - Treat order headlines as promotional rather than economic proof and tighten downside assumptions
  - - Capital-race disadvantage
    - Peer market stays hot while Robot Era financing weakens
    - Flat or down round, delayed raise, or materially weaker investor quality versus peers like Unitree, UBTECH, Figure, and AgiBot
    - Assume bargaining power and hiring leverage are eroding; revisit survival horizon and price pressure assumptions
  - - Key-person or partner shock
    - Leadership or anchor-partner disruption
    - Founder departure, major customer pause, or strategic-backer withdrawal without a visible bench-level replacement
    - Escalate to thesis-break review because technical credibility and commercialization proof are jointly impaired
  notes: Kill criteria are framed as observable operating or policy events so investors can react before a full impairment becomes obvious.
