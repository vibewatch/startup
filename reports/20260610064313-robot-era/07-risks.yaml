    - Live and tightening in 2025-2026
    - Medium-High
    - Critical
    - China-first deployments, alternative suppliers, model-efficiency work, inventory planning
    - High — Robot Era’s embodied stack still depends on advanced compute and sensor availability while rules are moving upstream into model weights
    - Obtain current compute BOM, export-classification memo, supplier map, and contingency plan for U.S.-origin compute or sensor restrictions
  - - U.S. procurement and market-access restrictions on Chinese robots
    - Federal procurement and possible downstream commercial spillover
    - Active policy risk, not yet universal commercial ban
    - Medium
    - High
    - Stay outside sensitive procurement channels and localize go-to-market by jurisdiction
    - Medium-High — public policy momentum can chill buyers before formal bans arrive
    - Ask management which geographies, customer types, and public-sector channels are in current pipeline and how exposure changes under a federal procurement ban
  - - Fragmented safety and conformity regime across U.S., EU, and China
    - OSHA guidance, EU AI Act, EU Machinery Regulation, China humanoid standards
    - Existing but incomplete humanoid-specific framework
    - High
    - High
    - Use structured-environment deployments, pre-certification testing, and market-by-market compliance packaging
    - High — no retained Robot Era-specific certification evidence closes the gap today
    - Request CE/ISO/UL or equivalent packs, risk assessments, technical files, and country-specific conformity plan before underwriting overseas expansion
  - - Privacy and workplace-data exposure from sensor-rich robots
    - EU/US privacy, AI, and workplace data handling
    - Live whenever robots capture visual, audio, or operational data
    - Medium
    - High
    - Data-minimization, retention limits, customer DPA templates, and on-device processing where possible
    - Medium-High — legal scrutiny is broadening while Robot Era’s public posture remains thin
    - Request retention schedule, subprocessor list, training-data policy, customer DPA, and incident-response process for robot-generated data
  - - Product-liability and incident-disclosure risk
    - Factory, warehouse, and public-space deployments
    - Category risk is real; company-specific public incident history remains undisclosed
    - Medium
    - High
    - Controlled deployments, guarded workflows, fail-safe procedures, and incident logging
    - Medium-High — the industry has real accident precedent and Robot Era has no public safety dossier in this run
    - Review incident log, near-miss reporting, emergency-stop design, insurance coverage, and contractual indemnity language by customer vertical
  notes: Severity ranks legal and regulatory risks by likely effect on market access, deployment speed, and diligence friction rather than by known public enforcement against Robot Era.
