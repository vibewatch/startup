company:
  name: Robot Era
chapter:
  number: 7
  title: Risks
summary: Robot Era’s highest-severity residual risks are geopolitical and market-access exposure to China-U.S. compute controls; a VLA-to-production gap that is still bounded to structured environments and lacks public Robot Era safety or uptime proof; and a brutal capital race against better-funded or more disclosed rivals such as Figure, Unitree, UBTECH, and AgiBot. Fresh financing and logistics traction reduce near-term solvency risk, but they do not eliminate compliance fragmentation, partner concentration, commercialization ambiguity, or key-person dependence on founder Jianyu Chen.
sections:
- id: geopolitical-and-regulatory-exposure
  title: Geopolitical, export-control, and regulatory exposure
  body: 'Robot Era is exposed to the geopolitical layer twice: first through the compute stack needed to train and deploy embodied-AI systems, and second through the market-access politics attached to Chinese-made robots. The company’s own L7 brochure describes an x86-plus-Orin compute stack plus camera, LiDAR, and microphone hardware, which is exactly the kind of advanced, sensor-rich embodied system now sitting inside a more adversarial China-U.S. policy frame. BIS, CRS, and Sidley all show that U.S. controls have moved beyond generic semiconductor rhetoric into active restrictions on advanced computing, Entity List designations, and even certain AI model weights. FDD and IEEE Spectrum add the go-to-market consequence: U.S. policymakers are now willing to discuss Chinese-robot procurement bans and sensor-focused restrictions, while supply chains remain mutually entangled rather than cleanly separable. For Robot Era, that means export-control risk is not just a training-compute issue. It
    can also narrow customer sets, complicate overseas channel expansion, and raise diligence friction with multinational buyers. Regulatory fragmentation compounds the problem. OSHA still has no humanoid-specific standard, the EU AI Act and Machinery Regulation raise formal health, safety, and rights obligations, and McKinsey argues the standards stack is still incomplete for autonomous humanoids. China is moving faster on humanoid-specific standard setting, but that does not simplify cross-border compliance. The practical risk is therefore medium-high likelihood and critical impact: Robot Era can keep selling into China-centered structured workflows, yet any thesis that assumes frictionless global expansion is under-supported by the current public record.'
