  evidenceGaps:
  - type: missing-source
    severity: material
    topic: robotera-certification-gap
    missingEvidence: Robot Era-specific CE, ISO, UL, or equivalent safety-certification pack plus declared operating envelope and incident summary.
    whyItMatters: Without a product-specific safety dossier, cross-market deployment risk cannot be distinguished from generic category risk.
    diligencePath: Request the current certification package, hazard analysis, emergency-stop design notes, and the last 24 months of incident and near-miss reporting.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: robotera-reliability-gap
    missingEvidence: Public or private MTBF, uptime, maintenance interval, and field-failure metrics for L7, M7, Q5, and dexterous-hand deployments.
    whyItMatters: Scale execution cannot be underwritten from delivery claims alone; reliability is what determines service burden and customer renewal quality.
    diligencePath: Obtain fleet dashboards, warranty-return data, service logs, spare-part consumption, and customer acceptance KPI packs.
    relatedQuestionRefs:
    - QR034
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: robotera-cybersecurity-gap
    missingEvidence: Robot Era OTA, authentication, SBOM, vulnerability-management, and disclosure-process documentation.
    whyItMatters: Sensor-rich connected robots create operational and data risk that can block enterprise deployments even when task performance is strong.
    diligencePath: Request security architecture, OTA signing model, pentest results, SBOM policy, and disclosure SLA.
    relatedQuestionRefs:
    - QR033
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: bench-depth-and-succession
    missingEvidence: Named executive bench, delegated operating structure, and succession plan beyond founder Jianyu Chen.
    whyItMatters: A founder-led technical company can still fail commercially if operating authority and continuity are too concentrated.
    diligencePath: Request org chart, board materials on succession, retention packages for top technical leaders, and hiring plans for manufacturing, safety, and finance leaders.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: revenue-conversion-and-concentration
    missingEvidence: Recognized revenue by customer, backlog aging, cancellation terms, renewal rates, and top-customer concentration.
    whyItMatters: Order headlines and deployment counts are not enough to prove a durable business model or manageable concentration risk.
    diligencePath: Request cohort analysis for top logistics customers, signed backlog conversion history, and customer-concentration review from the board package.
    relatedQuestionRefs:
    - QR025
    - QR029
    - QR030
    relatedTableRefs:
    - TR003
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-coverage-scope
    missingEvidence: A jurisdiction-by-jurisdiction conformity matrix for every target export market and end-use environment.
    whyItMatters: The legal register is intentionally scoped to the most material public risks, not every local rule that could matter during expansion.
    diligencePath: Build a market-entry compliance matrix by country, deployment environment, and data-flow pattern before expanding outside core China workflows.
    relatedQuestionRefs:
    - QR030
    - QR031
    relatedTableRefs:
    - TR001
