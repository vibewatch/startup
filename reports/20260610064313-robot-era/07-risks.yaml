callouts:
- calloutType: risk
  title: The geopolitical risk is not abstract because Robot Era’s product stack sits directly on advanced compute and export-sensitive sensors
  body: Robot Era is not just another industrial integrator. Its own brochure points to advanced onboard compute and rich sensing, while U.S. policy has moved beyond generic chip rhetoric into live controls on advanced AI compute and even certain model weights. That makes geopolitical risk part of the product stack, not only part of the sales narrative.
  claimRefs:
  - CR001
  - CR003
  - CR006
  - CR007
- calloutType: risk
  title: Structured logistics is a mitigation, but it is also evidence that open-world autonomy is still unproven
  body: The best public Robot Era traction is in structured logistics centers. That is good execution, but external VLA and humanoid sources keep saying structured environments are where today’s systems work best. Investors should read the logistics wedge as prudent scope control, not proof that the broader technical problem is solved.
  claimRefs:
  - CR030
  - CR031
  - CR032
  - CR033
  - CR040
- calloutType: insight
  title: Fresh financing lowers immediate solvency risk while raising the burden of proof on scale quality
  body: Robot Era’s 2026 funding cadence gives it more room than many startups, but it also raises expectations for conversion from order headlines into durable revenue, uptime, and customer diversification. In a sector where rivals are disclosing bigger valuations, orders, or revenue lines, capital itself is no longer enough to count as differentiation.
  claimRefs:
  - CR036
  - CR039
  - CR045
  - CR046
  - CR048
  - CR050
