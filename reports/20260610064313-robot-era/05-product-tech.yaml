  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: era42-model-card
    missingEvidence: Public or private model-card detail for ERA-42, including parameter count, training data composition, latency, benchmark suite, and safety envelope.
    whyItMatters: Without a model card or measured benchmark pack, outside diligence cannot separate a real production-grade embodied model from a high-level narrative around demos and pilots.
    diligencePath: Request the ERA-42 model card, benchmark deck, hardware latency profile, and failure-mode testing results by workflow.
    relatedQuestionRefs:
    - QE007
    - QE010
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: blocking
    topic: safety-certification
    missingEvidence: Formal safety certifications, emergency-stop / fail-safe documentation, ingress ratings, and customer deployment approvals for L7, M7, Q5, and XHAND.
    whyItMatters: Enterprise rollout and insurability depend on safety and environmental qualification, especially in logistics and factory settings.
    diligencePath: Request certification files, customer acceptance documents, risk assessments, and the current deployment safety playbook for each SKU.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-field-data
    missingEvidence: Fleet uptime, MTBF, maintenance intervals, spare-parts consumption, warranty-return rates, and service-SLA performance.
    whyItMatters: Product relevance is not the same as production readiness, and hardware margins can be destroyed by field-service burden.
    diligencePath: Obtain the field reliability dashboard, warranty statistics, and service logs for the top deployment programs.
    relatedQuestionRefs:
    - QE021
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: deployment-economics
    missingEvidence: Customer-level KPI packs showing pick rate, error rate, labor substitution, throughput lift, uptime, and ROI for warehouse or factory deployments.
    whyItMatters: Public workflow descriptions are encouraging, but they do not prove the economics that decide whether deployments scale.
    diligencePath: Review signed customer case studies, acceptance KPIs, before-and-after metrics, and expansion decisions by use case.
    relatedQuestionRefs:
    - QE015
    - QE022
    - QE023
    relatedTableRefs:
    - TE002
  - type: conflicting-data
    severity: material
    topic: l7-weight
    missingEvidence: One reconciled official specification for L7 weight, including whether the figure includes hands, battery, or deployment accessories.
    whyItMatters: Conflicting weight figures complicate payload, endurance, transport, and safety comparisons across peers and use cases.
    diligencePath: Request the latest official spec sheet with configuration notes for bare robot, with hands, and with battery.
    relatedQuestionRefs:
    - QE002
    - QE018
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: minor
    topic: xbot-l-public-surface
    missingEvidence: A current direct official or credible third-party source that clearly documents XBot-L as a live Robot Era product in this run.
    whyItMatters: The chapter was asked to assess XBot-L if supportable, but the retained direct-source set does not currently provide a stable basis for doing so.
    diligencePath: Re-run source discovery against current official site routes, CES materials, and public developer surfaces specifically for XBot-L naming.
    relatedQuestionRefs:
    - QE006
    relatedTableRefs:
    - TE001
