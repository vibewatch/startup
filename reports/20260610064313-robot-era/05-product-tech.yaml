tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user / workflow
  - Current public spec floor
  - Maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - ERA-42 embodied model + logistics solution
    - Warehouse operators integrating picking/scanning/boxing workflows
    - End-to-end VLA framing; official workflow coverage from order release to outbound
    - Live public framing; real deployment architecture still partly opaque
    - More concrete workflow integration language than a generic humanoid AI pitch
    - No public model card, latency benchmark, or safety envelope
  - - L7 full-size humanoid
    - Logistics, manufacturing, research, and high-visibility demo deployments
    - 171 cm; 55 DoF; 20 kg dual-arm payload; 2.1 m arm span; L7/L7-M7 shared architecture
    - Best-supported flagship; externally covered across multiple sources
    - Combines full-size locomotion with direct-drive hand integration and enterprise workflow framing
    - Public weight, endurance, and certification disclosures remain inconsistent or incomplete
  - - M7 upper-body humanoid
    - Picking, scanning, assembly, retail, and research where legs add limited value
    - 43 DoF including hands; 1660 mm arm span; 2.1 m operating range
    - Publicly listed and conceptually clear, but less independently documented than L7
    - Reuses the core arm/hand stack while reducing deployment and integration burden
    - Few independent sources describe production maturity or customer mix
  - - Q5 wheeled humanoid
    - Reception, service, healthcare, research, teleoperation, and indoor interaction
    - 44 DoF; about 165 cm; wheeled base; 11-DoF XHAND Lite; >4 h / 240 min operating time in retained sources
    - Supported by official and independent spec databases
    - More deployment-pragmatic for indoor service and data-collection settings than a full biped
    - Public pricing, field reliability, and exact software limits remain thin
  - - XHAND1 dexterous hand
    - Research labs, humanoid OEMs, and Robot Era’s own platforms
    - 12 active DoF; fully direct-drive; 80 N grip claim; 25 kg lift claim; tactile fingertips; ROS/C++/Python support
    - Strongest publicly documented module in the stack
    - Clearest proof of in-house component ambition and cross-platform reusability
    - Enterprise qualification, calibration drift, and service-life data are still sparse
  - - XHAND1 Lite
    - Q5 and lighter research or teleoperation setups
    - 11 DoF on Q5-facing sources; 730 g; 1 million no-load grab cycles on official bundle
    - Publicly visible accessory/module, but less fully documented than XHAND1
    - Lighter hand broadens the deployment menu for wheeled service robots
    - Public force, durability-under-load, and customer deployment detail remain limited
  notes: >-
    The matrix uses only modules with supportable retained direct URLs in this
    run. XBot-L is omitted because the retained current public record did not
    provide a stable, supportable direct product surface for it.
