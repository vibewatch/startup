- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Publicly disclosed role
  - Dependency / interface
  - Public proof quality
  - Main technical risk
  rows:
  - - Full-body / upper-body / wheeled platforms
    - L7, M7, and Q5 provide embodiment choices for different workflows
    - Share common hand, sensing, and control concepts across deployment variants
    - medium to high
    - Public embodiment strategy is clearer than real manufacturing complexity or field-service burden
  - - XHAND end-effector layer
    - Direct-drive five-finger manipulation, tactile sensing, and tool-usable hand control
    - Depends on joint modules, teleop, and robot-side control stack
    - high
    - Internal lab metrics are stronger than independent endurance proof
  - - Perception + onboard compute
    - LiDAR, depth vision, microphones, x86 + Orin compute, and real-time control inputs
    - Depends on sensor fusion, onboard inference, and body control loops
    - medium
    - Public sources disclose components more readily than latency, redundancy, or failure handling
  - - ERA-42 embodied model
    - End-to-end VLA / world-model / fast-slow control narrative for perception-to-action
    - Depends on training data, simulation, hand/body actuation, and workflow integration
    - medium
    - Public architecture framing exceeds published benchmark and model-card detail
  - - Workflow integration layer
    - Connects WMS or client business systems to robot tasks and returns status updates
    - Depends on standard interfaces, status codes, and customer-side process mapping
    - medium
    - Public sources do not expose concrete API specs, deployment playbooks, or error budgets
  - - Data / training / digital-twin loop
    - Teleop data collection, processing, model training, simulation checks, and closed-loop validation
    - Depends on real-machine data, open-source pretraining, and operator tooling
    - medium
    - Public disclosure does not quantify data scale, labeling quality, or sim-to-real hit rate
  - - Developer / control surface
    - ROS2 services/actions, trajectory control, MPC, and hand/base APIs via public repos
    - Depends on ROS2, CycloneDDS, teleop_client, and internal developer environment assumptions
    - medium
    - Public SDKs are real but still incomplete proxies for enterprise integration docs
  notes: >-
    Public proof quality reflects only the retained sources in this run. “High”
    does not mean fully disclosed; it means the layer has at least one direct
    technical surface plus corroboration.
