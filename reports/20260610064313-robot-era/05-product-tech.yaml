- id: FE004
  title: Product maturity / capability map
  type: matrix
  layout: wide
  summary: Public maturity view across Robot Era's main modules, separating where the company has concrete deployment proof from where disclosure remains mostly narrative.
  data:
    columns:
    - Current maturity
    - Strongest public proof
    - Main limitation
    rows:
    - label: L7 logistics / industrial cell
      values:
      - Maturing with real pilots
      - Warehouse workflow articles + CES + shipment disclosures
      - KPI, uptime, and safety documentation are not public
    - label: Q5 indoor service platform
      values:
      - Commercially plausible
      - Official bundle + multiple spec databases + service-use writeups
      - Public customer economics and support data remain thin
    - label: M7 upper-body module
      values:
      - Early but strategically useful
      - Official modularity and shared-workflow language
      - Independent validation is lighter than for L7 or Q5
    - label: XHAND1 manipulation module
      values:
      - Best-documented module
      - Official specs + CES + external adopter names
      - Formal qualification and long-run field reliability are not public
    - label: Developer / integration surface
      values:
      - Real but partial
      - Public GitHub org, ROS2 repo, Python SDK
      - Manuals and enterprise docs remain gated or incomplete
    - label: Trust / quality disclosure
      values:
      - Weak
      - Privacy / form consent and some lifecycle snippets
      - No public certification, MTBF, warranty, or security architecture
    - label: Open-world autonomy
      values:
      - Early / narrative-led
      - VLA and world-model framing across official and media sources
      - Independent analysts still say structured environments come first
