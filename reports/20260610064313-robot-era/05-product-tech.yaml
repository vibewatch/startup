callouts:
- calloutType: strength
  title: The strongest moat signal is a reusable hardware-software stack, not one stunt-capable humanoid
  body: >-
    The retained sources support a coherent stack: L7, M7, Q5, and XHAND are
    framed as modular embodiments around the same embodied-AI and control story,
    while public SDK repos show at least some real developer access. That
    combination is more defensible than a single high-visibility robot with no
    reusable module strategy.
  claimRefs:
  - CE002
  - CE019
  - CE033
  - CE038
  - CE039
- calloutType: risk
  title: Public VLA branding is ahead of public engineering disclosure
  body: >-
    Robot Era publicly markets ERA-42 as end-to-end, multimodal, fast-learning,
    and world-model-based, but retained direct sources still do not disclose the
    model card, benchmark methodology, safety envelope, or field latency numbers
    that would let outsiders verify how much of that narrative survives
    production conditions.
  claimRefs:
  - CE024
  - CE025
  - CE030
  - CE032
- calloutType: insight
  title: Q5 and M7 may matter more for near-term deployment than the flagship L7 narrative suggests
  body: >-
    The public record implies Robot Era is not betting only on a full biped. Q5
    lowers locomotion risk in crowded indoor service settings, and M7 lowers
    unnecessary embodiment cost in fixed industrial cells. That is strategically
    important because structured enterprise workflows, not open-world generality,
    are where external analysts think humanoid commercialization will happen
    first.
  claimRefs:
  - CE009
  - CE012
  - CE048
  - CE051
  - CE055
