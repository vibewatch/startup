- id: era42-architecture-and-software-hardware-loop
  title: ERA-42 architecture framing and the software-hardware loop
  body: >-
    Robot Era’s clearest technical story is not a full model card but an
    operating-loop description. On the official solution surface, ERA-42 is
    described as an end-to-end VLA model that connects the embodied brain to
    automation systems and covers the warehouse sequence from order release to
    outbound, picking, scanning, and boxing. The official text also describes a
    two-way loop: business systems issue tasks, the model returns progress and
    status, and a standardized interface layer is supposed to reduce custom
    retraining. That is materially more specific than a generic “AI-powered
    humanoid” claim because it anchors the software to an actual enterprise
    workflow and to integration requirements. Independent coverage adds more
    color but not full transparency. Robotics & Automation News says Robot Era
    frames ERA-42 as a unified vision-language-touch-posture model, matched to
    XHAND1, able to learn tasks quickly and extended by a world-model concept;
    KrASIA further relays a fast-slow hierarchical architecture and a Ctrl-World
    collaboration. GitHub evidence also shows the company publishing ROS 2 and
    Python control surfaces, trajectory and MPC examples, and hand-control APIs.
    The underwriting conclusion is therefore positive but bounded: public sources
    support a real software-hardware loop, but they do not publish the core
    internals investors would normally want, such as parameter count, benchmark
    methodology, safety envelope, or measured latency under load.
