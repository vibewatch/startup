- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / disclosure area
  - Public status
  - Scope
  - Why it matters
  - Gap / next diligence ask
  rows:
  - - Privacy / data-consent surface
    - Officially present
    - Procurement and download forms on the public website
    - Shows the company has a baseline privacy and consent layer for inbound enterprise interactions
    - Review the full data-retention, deletion, and access-control policy for operational robot data, not just web-form data
  - - Public docs / manuals / SDK references
    - Partially present
    - Form-gated document center plus public GitHub repositories
    - Signals that product and developer materials exist beyond a marketing homepage
    - Obtain full manuals, version history, and API compatibility matrix
  - - Safety certification / standards disclosure
    - Not publicly disclosed in retained sources
    - No retained current source surfaces CE, ISO, or equivalent robot safety certification for L7/Q5/M7
    - Enterprise deployments often depend on formal safety review and integration sign-off
    - Request all safety certifications, risk assessments, and emergency-stop / fail-safe documentation
  - - Ingress / environmental ratings
    - Not publicly disclosed
    - Independent databases leave IP / ingress fields blank for L7
    - Environmental limits matter for warehouse and factory uptime
    - Request IP rating, temperature envelope, dust tolerance, and cleaning requirements by SKU
  - - Reliability / lifecycle metrics
    - Thin and uneven
    - XHAND1 and XHAND1 Lite publish some cycle-life and temperature data; fleet MTBF and robot uptime are not public
    - Module-level durability is not the same as system-level reliability
    - Request MTBF, service intervals, spare-part plan, and warranty-return history
  - - Security / OTA / vulnerability posture
    - Not publicly disclosed
    - No retained public source describes software update controls, auth model, or vulnerability disclosure practice
    - Connected robots in enterprise systems create cybersecurity and operational risk
    - Request security architecture, OTA process, SBOM, and disclosure policy
  - - Warranty / support SLA
    - Not publicly disclosed
    - Support email exists in GitHub repo; public service commitments do not
    - Buyer trust depends on field support and replacement response time
    - Request SLA terms, support staffing, geographic coverage, and spare-parts logistics
  - - Performance benchmarking / audited ROI
    - Not publicly disclosed
    - Public sources describe workflows and pilots but not audited productivity, error rate, or ROI packs
    - Without benchmark discipline, capability claims are hard to compare across vendors
    - Request customer KPI packs, acceptance tests, and pre/post deployment metrics
  notes: >-
    Null-style gaps are intentional where retained public sources do not support
    a formal disclosure. The table separates web/privacy controls, developer
    surfaces, and missing operational-quality disclosures.
