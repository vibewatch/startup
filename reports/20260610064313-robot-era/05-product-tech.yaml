- id: TE002
  title: Workflow / use-case table
  columns:
  - User job / environment
  - Current workflow problem
  - Robot Era solution
  - Public measurable benefit / proof point
  - Main limitation
  rows:
  - - Goods-to-person warehouse picking
    - AGVs bring totes, but mixed-SKU picking and scan handling still need human dexterity
    - L7 + XHAND1 + ERA-42 + WMS-linked workflow
    - Public sources say the robot covers up to 2.1 m workspace and handles pick-scan-box / recycle fallback steps
    - No public customer-level productivity, pick-rate, or scan-accuracy dataset
  - - Factory handling / assembly / inspection
    - Flexible industrial tasks are harder to automate with rigid single-purpose arms alone
    - L7 for full-body tasks; M7 where upper-body reach and dexterity matter more than locomotion
    - Public sources repeatedly name screw-driving, assembly, picking, and inspection tasks
    - Public proof is scenario-level, not audited throughput or uptime
  - - Indoor service / reception / healthcare / tourism
    - Human interaction, navigation, and object handoff need safer, more expressive embodiments than a fixed kiosk
    - Q5 wheeled humanoid with high-DoF arms, XHAND Lite, vision, and teleoperation support
    - Public sources cite guided tours, reception, delivery, healthcare assistance, and retail interaction
    - Public pricing and service-maintenance economics remain thin
  - - Research / teleoperation / data collection
    - Labs need controllable platforms for imitation learning, teleoperation, and closed-loop validation
    - Q5, M7, XHAND1, and public ROS2/Python control surfaces
    - Official and GitHub sources show teleoperation, MPC, trajectory, and hand-control pathways
    - Public docs are still partial and some official manuals remain gated
  - - Stand-alone dexterous manipulation
    - Many labs and OEMs need a reusable hand rather than a full humanoid body
    - XHAND1 with direct drive, tactile fingertips, and ROS/C++/Python support
    - Public sources cite external adopters including Skild AI, Extend Robotics, UC Berkeley, MIT, and ByteDance Seed
    - Public calibration, failure-rate, and production-scale service data remain undisclosed
  notes: >-
    Measurable benefit is limited to what retained sources state directly, such
    as workspace coverage, published payloads, or named workflow steps. Where
    only qualitative benefit is public, the limitation column records the
    missing denominator.
