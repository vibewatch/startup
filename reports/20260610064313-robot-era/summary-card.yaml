  topStrengths:
    - >-
      Strong industrial investor and partner roster has helped Robot Era finance quickly and win early enterprise access
      in logistics and manufacturing.
    - >-
      Public commercialization evidence is unusually concrete for a young humanoid company, including more than RMB 500
      million of cumulative orders, more than 10 logistics centers, and thousand-unit delivery claims.
    - >-
      The modular L7 plus M7 plus Q5 plus XHAND stack and ERA-42 workflow framing suggest a broader platform strategy
      than a single demo robot.
    - >-
      China’s policy support, automation depth, and supply-chain advantages make the company’s home market one of the
      most credible early humanoid deployment environments.
  topRisks:
    - >-
      Public materials still do not disclose recognized revenue, gross margin, cash runway, customer concentration, or
      cap-table terms, so investors cannot cleanly underwrite the current valuation.
    - >-
      The strongest commercial proof remains concentrated in structured logistics environments, leaving open whether
      Robot Era can sustain safe, reliable, high-ROI deployments at broader scale.
    - >-
      Cross-border expansion is exposed to China-U.S. technology restrictions, procurement friction, and a fragmented
      global safety and compliance regime.
    - >-
      Competition is intense across China and globally, with rivals such as Unitree, UBTECH, AgiBot, and Figure offering
      stronger price, scale, or disclosure benchmarks.
  unresolvedGaps:
    - Audited revenue by stream, backlog conversion, realized ASP, gross margin, cash burn, and runway.
    - >-
      Exact sequencing, pricing, dilution, and investor-protection terms across the March 2026 strategic round and later
      2026 financing.
    - >-
      Customer concentration, renewal behavior, contract duration, and the split between production deployments and
      research or developer placements.
    - >-
      Robot Era-specific uptime, incident, certification, cybersecurity, and fleet-quality data for multinational
      enterprise deployment.
