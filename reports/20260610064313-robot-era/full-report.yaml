      - number: '8.4'
        title: Adverse evidence, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The adverse file matters because the sector is still very early. Bain says deployments remain mostly in
              highly structured environments and that handling and battery life still gate commercialization. McKinsey
              says the gap between pilot demos and commercially viable scale remains wide. IEEE Spectrum is blunter:
              well-funded humanoid companies can wave unresolved problems away while continuing to raise extraordinary
              amounts of money. Robot Era’s public record fits that warning. The company has stronger financing momentum
              than financial disclosure quality, and the round anchor could still be vulnerable to preference overhang,
              backlog slippage, or a slower-than-advertised conversion from orders into recognized revenue. The
              chapter’s thesis-breaks are therefore operational and financial rather than ideological. A move from
              stretched to fair or attractive requires auditable revenue by stream, gross margin by product, cash and
              monthly burn, contract payment terms on the >RMB 50 million logistics wins, and evidence that overseas
              orders and thousand-unit deliveries are converting into accepted, paid deployments. Without that evidence,
              the current mark is still investable only with more diligence or with downside-protective structure.
