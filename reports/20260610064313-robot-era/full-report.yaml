      - number: '4.2'
        title: Pricing signals, cost proxies, and the limits of public unit economics
        blocks:
          - type: paragraph
            body: >-
              Robot Era’s largest financial blind spot is still pricing. None of the retained Robot Era sources
              publishes a list price for L7, M7, or XHAND in commercial deployments, so the chapter has to rely on
              explicit peer anchors and state-of-market pricing thresholds. Unitree gives the cleanest direct anchor:
              its official G1 page lists a USD 13,500 base price, while third-party procurement coverage places more
              programmable EDU configurations between USD 43,900 and USD 73,900. CnTechPost’s coverage of Unitree’s IPO
              process adds an industrial proxy by reporting a 167,600 yuan humanoid ASP in 2025. Separately, SCIO and
              OFWeek frame the enterprise ROI problem more directly: many humanoids still sell for hundreds of thousands
              of yuan, and an enterprise may view something near 300,000 yuan as a reasonable ROI threshold. Those
              signals matter because they show both pricing compression and the gap between demo hardware and
              production-grade economics. Still, they do not solve Robot Era’s own ASP or cost stack. Any attempt to
              translate the company’s >RMB 500 million backlog into unit counts is only a rough, peer-anchored scenario,
              not a revenue model. The right conclusion is that public demand exists, but realized Robot Era unit
              economics remain opaque.
