  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on analysis
      - Current public status
      - Exact diligence path
    rows:
      - - Recognized revenue by stream
        - Prevents underwriting of growth quality, mix, and conversion from backlog to revenue.
        - Not publicly disclosed in retained Robot Era sources.
        - Request monthly and quarterly revenue by robot, module, software, integration, and support stream.
      - - Realized ASP and discounting
        - Blocks any robust unit-economics or price-power analysis.
        - No public Robot Era list price or realized ASP is retained.
        - Obtain invoice-level ASP by SKU, geography, and customer segment.
      - - Gross margin and cost stack
        - Blocks the margin path and any view on scalable economics.
        - Not publicly disclosed.
        - Request product and service gross margin plus BOM, labor, and warranty detail.
      - - Cash balance, monthly burn, and runway
        - Makes financing dependency impossible to size numerically.
        - Not publicly disclosed.
        - Obtain a 24-month cash bridge, current liquidity statement, and downside runway scenario.
      - - Backlog aging and contract conversion
        - Blocks judgment on order quality and revenue timing.
        - Only gross order signals and shipment anecdotes are public.
        - Review top customer contracts, cancellation terms, and backlog conversion history.
      - - Working capital and billing mechanics
        - Can materially shorten runway even if backlog looks large.
        - No receivable, inventory, milestone, or reserve detail is public.
        - Request AR aging, inventory turns, billing schedules, and warranty reserve policy.
      - - Debt, guarantees, and contingent liabilities
        - Unseen obligations can alter both runway and downside.
        - No public debt or guarantee disclosure is retained.
        - Review debt schedules, covenants, guarantees, and supplier-finance arrangements.
