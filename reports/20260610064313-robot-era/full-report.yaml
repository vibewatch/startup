      - number: '5.3'
        title: Modularity, in-house component depth, and the public developer surface
        blocks:
          - type: paragraph
            body: >-
              The most defensible product differentiator in the retained record is modularity backed by unusually
              aggressive vertical-integration claims. Official sources show L7 and M7 as reconfigurable full-body versus
              upper-body deployments, while Q5 and the XHAND line widen the stack into service robotics and stand-alone
              manipulation. KrASIA and PRNASIA then push the deeper thesis: more than 95% of components, including
              joints, dexterous hands, and motors, are said to be self-developed. XHAND1 is the best-exposed proof point
              inside that claim because the official bundle goes beyond marketing adjectives and lists tactile coverage,
              control frequency, electrical range, communications interfaces, ROS support, and remote-operation
              pathways. That makes the hand a stronger diligence anchor than the broader humanoid body, whose public
              spec surface is still thinner. The developer signal is also real, though still limited. Robot Era has a
              public GitHub organization, an official ROS 2 example repo, and a Python SDK that references Q5, L3, and
              L7 model control plus XHand/XHand Lite APIs. At the same time, the official site’s document center is
              form-gated, and public repos do not yet substitute for full field docs, integration manuals, or
              transparent reliability dashboards. In other words, Robot Era appears materially more open than a pure
              closed-demo hardware vendor, but not yet open enough for outsiders to fully underwrite deployment
              complexity.
