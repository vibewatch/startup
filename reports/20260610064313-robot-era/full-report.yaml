      - number: '2.4'
        title: Evidence-constrained TAM, SAM, and SOM for Robot Era
        blocks:
          - type: paragraph
            body: >-
              A clean TAM-SAM-SOM stack is possible only if each layer is defined narrowly. TAM should be the commercial
              humanoid market, not all robotics, and the best-supported published lens here is BCC's $1.9 billion in
              2025 growing to $11 billion by 2030. A second, more promotional lens comes from Barclays via CNBC, which
              describes a $2 billion to $3 billion market today and $200 billion by 2035. That is useful as upside
              framing, not as the base case. SAM should be narrower still: China-centered embodied-AI deployments in
              logistics, manufacturing, and commercial services, where policy support, factory density,
              logistics-automation demand, and service-robot purchasing already exist. Public evidence supports that
              China-centric SAM qualitatively, but it still does not convert into a single clean revenue pool for Robot
              Era. SOM is the most constrained layer. Public sources support more than RMB500 million of 2025 commercial
              orders, a logistics wedge with SF Group and China Post, more than 10 logistics centers, and thousand-unit
              deliveries initiated in Q2 2026. Those are strong commercialization markers, but they still do not reveal
              recognized revenue, repeat-purchase rates, pricing by robot type, renewal economics, or gross margin. The
              right underwriting conclusion is therefore that Robot Era has a visible early SOM foothold in Chinese
              enterprise deployments, but not a public-data basis for a precise share-of-market calculation.
            claimRefs:
