      - number: '1.5'
        title: Milestones, international partnerships, and adverse sector context
        blocks:
          - type: paragraph
            body: >-
              Robot Era’s 2025-2026 milestone record shows a company trying to turn humanoid hype into repeatable
              enterprise deployments. Public sources tie it to major orders, named industrial partners, logistics-center
              builds with China Post and SF Group, a CES 2026 showcase, and a Riyadh cooperation agreement with UNIDO
              focused on manufacturing, logistics, and commercial services. Those signals suggest the company is
              targeting real operating environments rather than remaining in a demo-only loop. Even so, adverse context
              from outside the company is important. CKGSB argues that China’s humanoid sector still trails U.S. leaders
              on autonomy and true commercial maturity, TNW cites weak buyer satisfaction and persistent battery-life
              and commercialization problems, and The Robot Report describes a crowded field facing pressure and likely
              shakeout during 2026. Those sector warnings do not disprove Robot Era’s traction claims, but they do frame
              the underwriting challenge correctly: Robot Era may be scaling quickly, yet it is doing so in a market
              where customer satisfaction, autonomy, and sustainable deployment economics remain unsettled.
