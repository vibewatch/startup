  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Latest disclosed valuation / status
      - Revenue or order signal
      - Relevance
      - Limitation
    rows:
      - - Robot Era (subject)
        - March 2026 strategic round above RMB 10B; Pandaily framed it above $1.37B
        - '>RMB 500M cumulative orders; orders are not audited revenue'
        - Direct entry price and strongest current market signal
        - No public audited revenue, gross margin, cash, or preference terms
      - - Figure AI
        - 2024 Series B at $2.6B; 2025 round reportedly at $39B
        - Commercial deployment narrative is strong, but retained public sources here do not provide audited revenue
        - Best read-through for the top-end embodied-AI scarcity premium
        - U.S. software-brand premium and capital access make it a very generous comp for Robot Era
      - - Physical Intelligence
        - 2024 funding at $2.4B post-money valuation
        - Retained public coverage emphasizes model talent and investors, not proven revenue
        - Useful read-through for foundation-model optionality premium
        - More software-first and less deployment-proven than Robot Era
      - - Apptronik
        - $350M Series A announced in 2025; valuation not disclosed in retained sources
        - Pilot deals and commercialization push are discussed, but no audited revenue is retained here
        - Shows how much capital serious humanoid builders still require before scale
        - Funding amount is not the same as valuation and should not be over-interpreted
      - - Agility Robotics
        - 2024 minority strategic investment from Schaeffler; valuation not disclosed
        - Commercial RaaS deployment and customer intent across 100 plants matter more than disclosed valuation
        - Good benchmark for enterprise deployment seriousness and commercialization stress
        - No current public valuation anchor in retained sources
      - - Unitree
        - 2026 Shanghai IPO filing seeking to raise 4.2B yuan
        - >-
          2025 revenue 1.708B yuan; 2026 profit pressure despite growth; official G1 entry price starts at US$13.5K
          before shipping
        - Best China benchmark for disclosed growth, pricing pressure, and IPO readiness
        - Prospectus momentum does not itself reveal stable long-term profitability
      - - UBTECH
        - Public market cap about $7.22B in June 2026
        - 2025 revenue RMB 2.001B; full-size humanoid revenue RMB 820.6M; gross margin 37.7%
        - Best disclosure-backed Chinese humanoid-adjacent public comp
        - Public market cap moves daily and includes broader business mix beyond one robot line
      - - Symbotic
        - Public market cap about $25.66B in June 2026
        - TTM revenue about $2.51B; estimated market-cap-to-sales about 10x
        - Useful upper-bound public automation multiple for a scaled logistics-automation winner
        - Warehouse systems are far more mature and revenue-backed than Robot Era
      - - iRobot
        - Public market cap about $14.84M in June 2026
        - 2024 revenue $682M; implied public market cap to 2024 sales is near zero
        - Useful downside reminder of how public robotics equity can collapse when growth and margins break
        - Consumer cleaning robots are not a direct humanoid comp, so treat as a stress case not a valuation peer
      - - Fourier Intelligence
        - 2025 Series E financing of nearly RMB 800M; valuation not disclosed in retained open sources here
        - Funding round confirms large capital needs in Chinese robotics, but no audited revenue is retained here
        - Useful China private-capital depth read-through
        - Not a clean valuation or revenue multiple comp in retained public evidence
    notes: >-
