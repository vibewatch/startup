      - number: '3.4'
        title: Pricing opacity, workflow integration, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The most important underwriting question is not whether Robot Era has real competitors; it is which parts
              of the buyer decision are likely to stay sticky. Public pricing remains one of the largest blind spots.
              Unitree is the only major peer in this evidence set with a crisp public list-price anchor, while Robot
              Era, UBTECH, Figure, Boston Dynamics, and Agility mostly frame the sale around contracts, service, or
              enterprise deployments. That makes switching costs less about sticker price alone and more about whether
              the customer is buying a robot body, a dexterous hand, workflow software, safety validation, service
              support, or a full operating solution. Agility’s Arc stack, Boston Dynamics’ Orbit and workflow
              integrations, and UBTECH’s factory-system connectivity all show how enterprise competitors try to move
              beyond hardware into process lock-in. Physical Intelligence and Figure attack the same problem from the
              autonomy side by advertising generalization and reasoning more explicitly than Robot Era does in public.
              Robot Era still has a real moat claim in vertical integration and logistics-centered deployments, but the
              weaker points are clear: price is not transparent, automotive case studies are thinner than at UBTECH,
              Agility, or Boston Dynamics, and the public software narrative is less mature than Figure’s Helix or
              Physical Intelligence’s VLA publications. Investors should therefore treat Robot Era as competitive and
              promising, but not yet insulated.
