  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and estimate range
        blocks:
          - type: paragraph
            body: >-
              Robot Era should not be underwritten against all global robotics, all automation, or all embodied-AI
              spending. The most defensible boundary is commercially deployed humanoid robots used in structured
              enterprise workflows where a human-shaped form can substitute for labor in environments already built for
              people. BCC's scope is useful because it explicitly focuses on commercial deployments across automotive,
              logistics and warehousing, government and public services, healthcare, and retail or commercial services,
              while excluding pilots, demos, and prototypes. IFR and multiple industry commentaries also point to
              warehousing and manufacturing as the first serious proving grounds, not the full universe of service work.
              That means the included spend is hardware, embodied-AI software, integration, and deployment services for
              real logistics, manufacturing, and customer-facing operations. Excluded spend is the much larger pool of
              conventional industrial robots, AMRs, warehouse software, consumer gadgets, and research-stage systems
              that do not yet represent real humanoid buying behavior. Public estimates remain inconsistent: BCC gives a
              $1.9 billion 2025 market growing to $11 billion by 2030, while CNBC's Barclays summary describes only a $2
              billion to $3 billion market today but a much larger long-run option value. The contradiction is not a
              bug; it is the right warning that today's monetized market is still small relative to the future
              narratives attached to it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM027
              - CM028
