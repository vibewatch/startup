  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and the current public specification floor
        blocks:
          - type: paragraph
            body: >-
              The best-supported public view of Robot Era is a modular product family, not a single flagship robot. The
              retained direct sources consistently support four current anchors: the L7 full-size bipedal humanoid, the
              M7 upper-body humanoid configuration, the Q5 wheeled humanoid, and the XHAND1/XHAND1 Lite dexterous-hand
              line. The official website bundle and CES 2026 release make the hierarchy unusually clear: L7 carries the
              full-size, 55-DoF humanoid story; M7 is the upper-body deployment variant; Q5 is the wheeled service and
              research platform; and XHAND1 is the precision manipulation module that appears across the stack. That
              modular framing matters because it suggests Robot Era is trying to solve multiple near-term deployment
              constraints with different embodiments rather than forcing every workload through one humanoid form
              factor. The disclosed spec floor is also reasonably solid. L7 is repeatedly framed at 171 centimeters, 55
              degrees of freedom, and 20 kilograms of dual-arm payload, while Q5 is repeatedly framed at 44 degrees of
              freedom and roughly 165 centimeters. XHAND1 is clearly marketed as a 12-active-DoF, fully direct-drive
              hand, and M7 is marketed as the upper-body platform derived from the same architecture. The main gap is
              scope discipline: the retained current direct sources do not give a supportable public XBot-L product
              surface, so this chapter does not treat XBot-L as a validated live module.
