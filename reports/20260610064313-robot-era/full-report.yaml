      - - Commercialization failure
        - Backlog/order story stops converting
        - >-
          Flagship logistics deployments do not translate into repeat orders, recognized revenue quality, or customer
          diversification
        - Treat order headlines as promotional rather than economic proof and tighten downside assumptions
      - - Capital-race disadvantage
        - Peer market stays hot while Robot Era financing weakens
        - >-
          Flat or down round, delayed raise, or materially weaker investor quality versus peers like Unitree, UBTECH,
          Figure, and AgiBot
        - >-
          Assume bargaining power and hiring leverage are eroding; revisit survival horizon and price pressure
          assumptions
      - - Key-person or partner shock
        - Leadership or anchor-partner disruption
        - >-
          Founder departure, major customer pause, or strategic-backer withdrawal without a visible bench-level
          replacement
        - Escalate to thesis-break review because technical credibility and commercialization proof are jointly impaired
    notes: >-
      Kill criteria are framed as observable operating or policy events so investors can react before a full impairment
      becomes obvious.
