      - number: '2.2'
        title: China policy and automation substrate
        blocks:
          - type: paragraph
            body: >-
              China matters more than a generic global average for this chapter because both policy and installed
              automation capacity are unusually concentrated there. Official and state-linked sources show that 2026
              brought China's first national standard framework for humanoid robotics and embodied intelligence, while
              Shanghai separately set a 2027 plan targeting 100 leading enterprises, 100 application scenarios, 100
              products, and more than RMB50 billion of output with subsidy support for commercialization. China Daily
              also ties embodied AI directly to the 2026 Government Work Report and cites a Development Research Center
              forecast of a domestic embodied-AI market reaching RMB400 billion by 2030 and more than RMB1 trillion by
              2035. The installed automation base is equally important. IFR says China represented 54% of global
              industrial-robot deployments in 2024, exceeded 2 million robots in operational stock, and still had room
              for about 10% annual growth through 2028. In other words, Robot Era is trying to scale inside the world's
              deepest factory-automation market just as policymakers are trying to standardize and accelerate
              embodied-AI deployment. That is a powerful SAM tailwind, but it does not eliminate technical
              fragmentation: multiple China sources still emphasize uneven hardware quality, data silos, dexterous-hand
              bottlenecks, and the need for common evaluation standards before scale becomes routine.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM017
              - CM018
      - number: '2.3'
        title: 'Target verticals: logistics, manufacturing, and commercial services'
        blocks:
          - type: paragraph
            body: >-
              The strongest buyer evidence is not for a generic household humanoid, but for enterprise operators that
              already spend heavily on automation and feel labor or throughput pressure. Logistics is the clearest wedge
              because IFR already records transportation and logistics as the largest professional service-robot
              application, warehouse-automation analysts expect broader adoption through 2026 and 2027, and Robot Era's
              public deployments are concentrated in logistics centers. Manufacturing is the second major wedge because
              China Daily, IFR, and company-linked reporting all point to structured factory tasks such as component
              picking, assembly, sorting, and inspection where reliability matters more than social interaction.
              Commercial services are a third but less standardized wedge: retail, front-of-house, guidance, and similar
              tasks fit the humanoid form, yet the proof is thinner and more pilot-like than in warehouses or factories.
              The buyer map therefore splits three ways. In logistics, operations or automation leaders own the budget
              and warehouse teams are the users. In manufacturing, plant, engineering, and quality leaders are both
              sponsors and adopters. In commercial services, the payer may be a retail operator, mall, hospital, or
              appliance partner, but adoption still depends on whether the robot beats cheaper fixed-function
              alternatives. That makes Robot Era's market less about consumer novelty and more about which enterprise
              workflows reward a human-compatible form factor quickly enough to justify deployment.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
