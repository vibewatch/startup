  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Robot Era has a real market-clearing private mark, but the public record still supports that mark as
              strategic option value more than as revenue-backed fairness. March 2026 sources corroborate a RMB 1
              billion strategic round at valuation above RMB 10 billion, and third-party coverage translated that anchor
              to roughly the mid-$1 billions. That price is not absurd in a market where Figure, Physical Intelligence,
              and other humanoid leaders have raised enormous rounds, and it is helped by Robot Era’s unusually broad
              industrial investor base, >RMB 500 million of cumulative orders, more than 10 logistics-center
              deployments, and thousand-unit delivery language. The problem is the denominator. Robot Era still does not
              disclose audited revenue, recognized backlog conversion, gross margin, cash, or preference terms. Orders,
              shipments, and investor logos are meaningful, but they are not the same thing as booked revenue or clean
              exit economics. The price-sensitive call is therefore research-more with medium confidence, high risk, and
              a stretched valuation stance rather than a clean buy or avoid.
