          valuation loses its core support.
      - - China deployment advantage
        - >-
          China’s supply chain depth, policy support, and enterprise automation demand can justify a premium to generic
          robotics stories.
        - >-
          If policy support does not translate into recurring paid deployments, the “China premium” collapses into just
          another funding narrative.
      - - Global comp discount
        - >-
          Robot Era trades below top U.S. embodied-AI brands such as Figure and Physical Intelligence, which helps
          relative positioning.
        - A discount to decacorns is not enough if revenue disclosure is still materially weaker than Unitree or UBTECH.
      - - Disclosure gap
        - >-
          The anti-thesis is not that Robot Era lacks demand; it is that demand quality, margin quality, and investor
          economics remain underdisclosed.
