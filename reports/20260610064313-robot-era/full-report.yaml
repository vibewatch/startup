      - number: '2.5'
        title: Growth drivers, constraints, and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              The adoption case is real but still conditional. On the positive side, labor scarcity, 24/7 throughput
              needs, warehouse-automation investment, and rapidly falling hardware costs all support humanoid adoption
              in structured enterprise settings. IFR's industrial and service-robot data show buyers already pay for
              automation in factories and logistics. Interact and McKinsey show those budgets are still broadening, and
              cost-compression signals from BusinessWire and CNBC suggest China can push humanoid pricing down faster
              than many Western investors expected. However, the adverse evidence matters. Humanoid.guide, RobotToday,
              China Daily, and broader industry reporting all keep returning to the same blockers: dexterous hands,
              training data, safety certification, power and thermal limits, and the challenge of proving ROI versus
              cheaper fixed-function systems. That means the investment debate is not whether the market exists, but how
              fast structured pilots become repeatable, margin-positive rollouts. For Robot Era, the strongest market
              read is that logistics and factory deployments can support real growth in the next few years, while
              mainstream service adoption will likely lag and home-market narratives remain premature. Public numbers
              are strong enough to support a positive market thesis, but not strong enough to skip diligence on
              economics, retention, and customer concentration.
            claimRefs:
