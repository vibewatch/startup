      - number: '1.3'
        title: Financing cadence, valuation signals, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The clearest company-level signal in the pack is financing velocity. KrASIA reports a July 2025 Series A
              of nearly RMB500 million led by CDH VGC and Haier, while the November 2025 A+ round was nearly RMB1
              billion with Geely leading and BAIC participating. Yicai adds that disclosed capital had reached CNY1.8
              billion by that point and that orders already exceeded CNY500 million. The 2026 record then accelerates
              further: PRNASIA and Humanoids Daily say a March 2026 strategic round of RMB1 billion pushed valuation
              above RMB10 billion, and a separate April-May 2026 source cluster reported a new round of more than $200
              million led by SF Group with HSG and IDG Capital. This sequence demonstrates strong industrial and
              investor support from automakers, logistics players, and top-tier venture capital, but it also creates a
              reconciliation problem. Public materials do not fully explain how the March 2026 strategic round, the May
              2026 round, and external unicorn-board markers fit together in one clean dilution timeline. The takeaway
              is positive on access to capital and stakeholder quality, but still incomplete on financing structure.
