      - number: '4.3'
        title: Capital adequacy, funding cadence, and what peer filings imply about burn
        blocks:
          - type: paragraph
            body: >-
              Public funding access is not Robot Era’s main weak point. The supported chronology shows three rounds
              totaling CNY 1.8 billion by November 2025, then a March 2026 strategic round of RMB 1 billion, and then
              another financing round of more than USD 200 million in 2026. That cadence is unusually strong for a
              private humanoid startup and is reinforced by a strategic investor roster that overlaps with potential
              channel and customer ecosystems. But that same cadence also signals capital intensity. Repeated large
              raises in close succession usually mean management is financing ahead of manufacturing, deployment, and
              working-capital needs, not that the business is already self-funding. Public peers help show why. Serve
              Robotics’ SEC-backed results disclose modest revenue alongside substantial operating and investing cash
              outflows. Symbotic, despite multi-billion-dollar revenue, still foregrounds liquidity, margin, and free
              cash flow. iRobot’s 10-K documents how quickly hardware-robotics economics can deteriorate when revenue
              disappoints. UBTECH’s filing proves humanoid revenue and corporate gross margin can be disclosed at scale,
              which makes Robot Era’s silence on cash, debt, and balance-sheet detail more conspicuous. The practical
              read is that Robot Era likely has enough external capital to keep scaling in the near term, but no one
              outside management can responsibly compute a precise runway from the public record alone.
