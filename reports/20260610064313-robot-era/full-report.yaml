  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and which rivals matter most right now
        blocks:
          - type: paragraph
            body: >-
              Robot Era should not be benchmarked only against one or two famous humanoid brands. The real buyer choice
              set spans Chinese direct humanoid OEMs now racing on price, scale, and industrial delivery; global
              industrial humanoids with stronger public proof in automotive or logistics workflows; software-stack
              players that raise the autonomy bar without selling the full robot; and lower-cost substitutes that solve
              part of the job with mobile manipulation rather than a full humanoid body. On Robot Era’s own record, the
              strongest public strengths are logistics deployments, high in-house component content, and a product
              family that combines the L7 humanoid with XHAND1 dexterous manipulation. The heaviest pressure points
              differ by rival. Unitree resets expectations on entry price and unit volume. UBTECH brings listed-company
              disclosure and automotive-factory evidence. AgiBot and Galbot push the Chinese scale narrative harder than
              Robot Era. Figure, Boston Dynamics, and Agility show the Western version of the same challenge: public
              enterprise deployments, explicit integrations, and better-advertised software stacks. The right
              underwriting frame is therefore not a single winner-take-all race, but a set of weighted threats that
              attack Robot Era from different angles.
