chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and company framing
        blocks:
          - type: paragraph
            body: >-
              Robot Era presents itself as a humanoid-robotics and embodied-intelligence company rooted in Beijing’s
              Tsinghua ecosystem rather than as a narrow component supplier. The strongest operating-base evidence is
              the company’s official site and application bundle, which surface a Tsinghua Science Park address, a
              marketing email, and a public phone number. That matters because it anchors the company to a real
              commercial footprint rather than a purely academic project. The independent founder interview pack adds
              the formation date: KrASIA says Robot Era was founded in August 2023, which aligns with the current
              narrative of a fast-scaling young company that reached large funding milestones unusually quickly. Just as
              important, the narrative is not “hardware only.” Chen describes a combined brain-and-body strategy with
              modular, Lego-like hardware and an ERA-42 VLA software layer, while the CES 2026 materials frame the
              company around a broader embodied-intelligence product family. Taken together, the reviewed sources
              support an identity as a Beijing-based commercial robotics company with research origins, modular platform
              ambitions, and enough public operating detail to distinguish it from a stealth lab project.
