      - number: '7.3'
        title: Competition, commercialization, and capital-intensity risk
        blocks:
          - type: paragraph
            body: >-
              Robot Era does not operate in a calm financing market where execution alone determines outcome. It is
              competing inside a capital race where rival disclosure quality and scale are already resetting buyer and
              investor expectations. Robot Era itself raised RMB 1 billion at a valuation above RMB 10 billion and then
              more than USD 200 million weeks later, while claiming thousand-unit deliveries and more than ten
              logistics-center deployments. That is impressive, but the same source set also shows how unforgiving the
              benchmark set has become. Unitree is targeting an IPO around RMB 50 billion and says it is already
              profitable with revenue above RMB 1 billion; UBTECH has both an 800 million-yuan order narrative and
              HKEX-backed humanoid revenue disclosure; AgiBot is advertising 10,000 robots rolled out; and Figure still
              commands decacorn capital plus a strong public VLA brand through Helix. Humanoids Daily describes the
              sector as a brutally expensive capital race, and KrASIA is the useful counterweight: the industry still
              lacks a clear path to revenue, and some celebrated deployments are strategic tie-ups rather than scaled
              sales. IEEE Spectrum adds a demand-side warning that no one has yet found a use case requiring several
              thousand humanoids per facility. For Robot Era, that creates two linked risks. First, competition may
              compress prices or move customer expectations faster than Robot Era can prove field economics. Second, the
              company may have to keep raising capital before its own revenue quality, repeatability, and margin profile
              are externally legible. The right residual view is therefore not “funding secured, risk solved,” but
              “funding secured, burn and proof obligations postponed.”
