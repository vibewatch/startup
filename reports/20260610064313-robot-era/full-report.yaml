      - number: '1.2'
        title: Founder profile, leadership visibility, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility in the provided pack is dominated by Jianyu Chen. Independent profiles
              identify him as Robot Era’s founder, while Tsinghua’s official IIIS page establishes the technical
              pedigree behind that role: assistant professor status, an ISR Lab affiliation, a Tsinghua undergraduate
              degree, and a 2020 UC Berkeley PhD under Masayoshi Tomizuka. That background is a meaningful
              founder-market-fit signal because it ties the company to elite controls, robotics, and embodied-AI
              research rather than to a purely financial promotion cycle. The flip side is that the public record
              remains thin beyond Chen. The Wire China adds age context and repeats a major customer claim, but the
              supplied source pack does not surface a fuller executive bench, current board roster, or a detailed
              governance map. For diligence, that means the chapter can strongly underwrite founder credibility, but not
              yet organizational depth or decision-right distribution. Key-person concentration therefore appears high
              until a fuller executive and governance package is available privately.
