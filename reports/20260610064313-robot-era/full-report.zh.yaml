  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 劳动力缺口与 24/7 吞吐需求
        - 驱动
        - 当前 / 近期
        - 仓储和工厂已经有预算理由，去测试能在人类空间工作的仿人机器人
        - 要求提供客户 ROI 案例，展示人力节省、正常运行时间和错误率
      - - 中国政策、标准与补贴
        - 驱动
        - 当前 / 2027
        - 国家和上海政策支持可能缩短在中国从试点走向部署的路径
        - 区分象征性政策支持与已签采购承诺
      - - 仓库自动化扩张
        - 驱动
        - 当前 / 2027
        - 仿人机器人进入的是自动化渗透率仍在上升、而非已经饱和的物流市场
        - 验证仿人机器人能否从 AMR、固定系统和协作机器人手里赢得份额
      - - 成本快速压缩与生产放量
        - 驱动
        - 当前 / 2028
        - 只要可靠性守得住，价格下行就能打开更广泛采用
        - 检查 BOM 走势、服务负担，以及降价后能否保住利润率
      - - 灵巧手、数据与安全瓶颈
        - 约束
        - 当前
        - 技术不成熟可能拖慢从结构化任务和小型试点走向规模化的速度
        - 要求提供任务成功率、介入率、安全事故和认证路线图
      - - 公开 SOM 可见度弱
        - 约束
        - 当前
        - 订单和交付计划看起来强劲，但公开来源没有披露已确认收入、留存或单位经济性
        - 要求按垂直行业提供客户 cohort 数据、已实现收入、续约行为和毛利率
    notes: 承销问题在于时间：真实需求存在，但商业化速度取决于成本下行能否跑赢长期存在的可靠性、安全和 ROI 瓶颈。
