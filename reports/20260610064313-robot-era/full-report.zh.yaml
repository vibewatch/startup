      - number: '5.3'
        title: 模块化、自研部件深度与公开开发者界面
        blocks:
          - type: paragraph
            body: >-
              保留记录中最可辩护的产品差异化，是由异常激进的垂直整合主张支撑的模块化。官方来源显示，L7 和 M7 可在全身与上半身部署之间重组，Q5 和 XHAND 系列则把技术栈拓展到服务机器人和独立操作。KrASIA 与
              PRNASIA 随后推动更深一层逻辑：据称超过 95% 部件自研，包括关节、灵巧手和电机。XHAND1
              是这个主张中暴露最充分的证明点，因为官方资料包不止给出营销形容词，还列出触觉覆盖、控制频率、电气范围、通信接口、ROS
              支持和远程操作路径。这让手部成为比更大人形身体更强的尽调锚点；后者公开规格表面仍较薄。开发者信号也真实存在，但仍有限。Robot Era 有公开 GitHub 组织、官方 ROS 2 示例仓库，以及一个引用
              Q5、L3 和 L7 模型控制、XHand/XHand Lite API 的 Python
              SDK。与此同时，官网文档中心有表单门槛，公开仓库还不能替代完整现场文档、集成手册或透明可靠性仪表盘。换句话说，Robot Era 看起来比纯封闭 demo
              硬件厂商开放得多，但还没开放到足以让外部人完整承销部署复杂度。
