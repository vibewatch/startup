      - number: '3.2'
        title: 中国直接对手在价格、规模和披露上给 Robot Era 施压
        blocks:
          - type: paragraph
            body: >-
              最近的竞争压力仍来自中国。AgiBot 在产品广度和生态野心上看起来最宽：公开资料已覆盖人形机器人、单臂移动操作、灵巧手、四足机器人、数据采集系统，以及不断扩展的 AIMA 开发栈。Unitree
              是资料包中最具冲击力的公开价格信号。$13.5K 的 G1 不能与 Robot Era 的 L7 做一一替代，但它建立了一个市场预期，而许多具身 AI 供应商仍用不透明定价回避这个预期。Unitree 的 IPO
              披露也让其收入增长、出货结构和主动 ASP 压缩异常可见。Fourier 在出货规模上没那么重要，重要的是灵巧性和开发者友好度：GR-2 的 12-DoF 双手、触觉传感器和明确 SDK
              支持，形成了比许多同行更清晰的研究与操作基准。UBTECH 又不一样。其上市公司文件和 Walker S2
              大规模交付表述，提供了中国最强公开证据：人形机器人收入已经成为一条与工厂使用绑定的真实收入项。Galbot 补上最后一个中国威胁：即便产品细节更薄，巨额融资、移动操作器定位和汽车 logo
              也能迅速塑造买方与投资人认知。面对这个赛场，Robot Era 在结构化物流和垂直硬件控制上仍显得最强，但它不是这个类别唯一快速前进的中国竞争者。
