      - number: '5.4'
        title: 各实体形态的部署相关性与产品成熟度
        blocks:
          - type: paragraph
            body: >-
              当 Robot Era 把问题收窄到结构化流程，尤其是物流拣选、工业搬运和受控服务环境时，部署逻辑最强。Humanoids Daily 和 RoboHorizon
              都描述了一个具体仓库单元：货到人系统把料箱送到可触达范围后，L7 接管柔性料箱拣选、条码扫描、装箱和异常处理。相比开放式家庭机器人叙事，这个切口可信得多，因为它只在刚性自动化仍失效的地方使用人形操作。Q5 和
              M7 也因同样原因重要。Q5 的轮式底盘和高 DoF 上半身，使它在研究、酒店、接待和导览服务部署中比拥挤室内空间里的全双足更可信；M7
              则为拣选、扫码和装配式工作降低了实体负担，因为这些场景里腿不是主要价值驱动。公开采纳证明也优于年轻硬件公司平均水平：PRNewswire 称累计交付超过 600 台，China Daily 提到 2025 年出货
              200 台人形机器人且 100 多个订单推进中，PRNewswire 和 KrASIA 也指向 XHAND1
              周边外部研究采纳和开发者生态。不过，成熟度图景仍混合。公开记录支持部署相关性和产品广度，但还不能完整证明可重复正常运行时间、安全性、客户 ROI 或广泛开放世界自主性。
