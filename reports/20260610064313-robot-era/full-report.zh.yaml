  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与当下最重要的对手
        blocks:
          - type: paragraph
            body: >-
              不应只拿 Robot Era 对标一两个人形机器人知名品牌。真实买方选择集覆盖几类玩家：中国直接人形机器人 OEM
              正在价格、规模和工业交付上竞速；全球工业人形机器人在汽车或物流流程中有更强公开证明；软件栈玩家不卖整机，却抬高自主性门槛；更低成本的替代方案则用移动操作解决部分任务，而不是完整人形身体。按 Robot Era
              自己的记录，最强公开优势是物流部署、高自研部件占比，以及把 L7 人形机器人与 XHAND1 灵巧操作结合起来的产品家族。最重的压力点因对手而异。Unitree 重置了入门价格和出货量预期。UBTECH
              有上市公司披露和汽车工厂证据。AgiBot 与 Galbot 比 Robot Era 更用力推动中国规模叙事。Figure、Boston Dynamics 和 Agility
              展示了同一挑战的西方版本：公开企业部署、明确集成和更会讲的软件栈。因此，正确承销框架不是一场赢家通吃竞赛，而是一组加权威胁，从不同角度攻击 Robot Era。
