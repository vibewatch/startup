  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与估算区间
        blocks:
          - type: paragraph
            body: >-
              不能用全球所有机器人、所有自动化或所有具身 AI 支出来给 Robot Era 定价。最可辩护的边界是：在结构化企业流程中商业部署的人形机器人，且人形形态能在已经按人类设计的环境里替代劳动力。BCC
              的范围有用，因为它明确聚焦汽车、物流和仓储、政府和公共服务、医疗、零售或商业服务中的商业部署，同时排除试点、demo 和原型。IFR
              和多份行业评论也指向仓储和制造业，认为它们是最早严肃验证的场地，而不是整个服务业宇宙。因此，纳入支出应是面向真实物流、制造和面客运营的硬件、具身 AI
              软件、集成和部署服务。排除支出则是更大的传统工业机器人、AMR、仓储软件、消费电子和研究阶段系统；这些还不代表真实的人形机器人购买行为。公开估算仍不一致：BCC 给出 2025 年 $1.9 billion
              市场，到 2030 年增长至 $11 billion；CNBC 对 Barclays 的摘要则称当前市场只有 $2 billion 到 $3
              billion，但长期期权价值大得多。这个矛盾不是缺陷，而是正确警告：今天已经货币化的市场，相对于附着其上的未来叙事仍然很小。
