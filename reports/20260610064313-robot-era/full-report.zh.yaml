      - - 商业化失败
        - 积压订单 / 订单故事停止转化
        - 旗舰物流部署没有转化为复购订单、已确认收入质量或客户多元化
        - 把订单头条视为宣传而非经济证明，并收紧下行情景假设
      - - 资本竞赛劣势
        - 同业市场保持火热，而 Robot Era 融资转弱
        - 平轮或下轮、融资延迟，或相较 Unitree、UBTECH、Figure 和 AgiBot 等同业，投资者质量明显转弱
        - 假设议价权和招聘杠杆正在侵蚀；重新评估生存期和价格压力假设
      - - 关键人物或合作伙伴冲击
        - 领导层或锚定合作伙伴中断
        - 创始人离任、主要客户暂停，或战略支持方退出且没有可见的梯队替代
        - 升级到投资逻辑破裂复盘，因为技术可信度和商业化证明同时受损
    notes: 止损标准按可观察的运营或政策事件来设定，让投资者能在全面减值变得明显前反应。
