      - number: '6.4'
        title: 耐久性：logo 组合有希望，但公开披露离可审计客户经济性还差得很远
        blocks:
          - type: paragraph
            body: >-
              本章最大的判断点不是 Robot Era 有没有真实客户，而是披露证据是否足以推断出持久、多元的生产收入。这个问题的答案仍是否定的。作为早期人形机器人公司，Robot Era
              确实给出了少见的具体部署说法，尤其在物流场景里，甚至有一些头部复购表述。但证据包仍缺少客户数、合同期限、NRR、GRR、流失、续约率和头部客户占比。它也没有把工业生产收入与开发者实验室销售或研究平台采用清楚拆开。反向行业资料让这一区分更重要。IEEE
              Spectrum、McKinsey、Robotics & Automation News 和 Forbes 都提醒，人形机器人 logo、试点和展示视频可能跑在运营经济性前面。这些资料没有推翻 Robot Era
              的部署，但确实反驳了投资人把强 logo 页直接等同于持久收入结论的冲动。务实综合看法是建设性但克制：Robot Era
              似乎拥有人形机器人领域较好的公开客户证明包之一，但已披露证据最强的是部署活动，最弱的是集中度、留存和经审计生产收入质量。
