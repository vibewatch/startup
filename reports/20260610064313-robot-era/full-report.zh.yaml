      - number: '1.4'
        title: 产品栈、垂直整合与商业化姿态
        blocks:
          - type: paragraph
            body: >-
              到 CES 2026，Robot Era 展示的不是一台机器人，而是一个家族：L7 人形机器人、Q5 平台和 XHAND1 灵巧手。公开技术细节中支撑最充分的是：L7 身高 171 centimeters，55
              个自由度，重量大约 70 kilograms，双臂负载 20 kilograms；XHAND1 则有 12 个自由度、80 newtons 抓握力和 25 kilograms 提举能力。CES 报道中，Q5
              是一个更轻的 44-DoF 伴随型号。这些规格的重要性不在于炫技指标，而在于说明 Robot Era 正试图把一个可复用平台商业化，覆盖完整人形机器人和操作器。2026 年融资稿进一步强化了这一判断：公司声称超过
              95% 部件自研、2025 年 XHAND 出货超过 1,000 台、2026 年 Q2 启动千台级交付。结合 Chen
              的「脑加身体」表述，已审阅证据支持一个商业化逻辑：模块化硬件、软件集成，以及对一家极年轻公司而言异常深的垂直控制。
