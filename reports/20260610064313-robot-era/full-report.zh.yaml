      - number: '1.5'
        title: 里程碑、国际合作与行业反向背景
        blocks:
          - type: paragraph
            body: >-
              Robot Era 的 2025-2026 年里程碑显示，公司正试图把人形机器人热潮转成可重复的企业部署。公开来源把公司与大额订单、具名产业伙伴、China Post 和 SF Group 的物流中心建设、CES
              2026 展示，以及与 UNIDO 在 Riyadh 签署、聚焦制造、物流和商业服务的合作协议联系起来。这些信号说明，公司目标是真实运营环境，而不是停留在 demo 循环。但公司外部的反向背景同样重要。CKGSB
              认为，中国人形机器人行业在自主性和真正商业成熟度上仍落后美国领导者；TNW 提到买方满意度偏弱，以及电池续航和商业化问题持续存在；The Robot Report 则描述了一个拥挤赛道，2026
              年将面临压力并可能洗牌。这些行业警告不能推翻 Robot Era 的牵引力主张，但能正确框定承销难题：Robot Era 也许扩张很快，却身处一个客户满意度、自主性和可持续部署经济性仍未稳定的市场。
