      - number: '7.2'
        title: 技术、安全、质量与数据治理风险
        blocks:
          - type: paragraph
            body: >-
              核心技术承销问题在于，前沿 VLA 叙事仍领先于经现场验证的机器人运营。DeepMind 发布 Gemini Robotics
              时仍把它表述为迈向通用机器人技术的一步，并称有用的具身系统需要通用性、交互性、灵巧性和安全行动。相关论文说得更清楚：把大型多模态模型转化为物理智能体仍是重大挑战，更难的灵巧任务或新形态任务仍需要额外微调。Bain、McKinsey
              和 Interact 都给出同一方向的反向证据。早期部署仍大多在结构化环境中，电池续航和灵巧性仍是门槛，大规模采用需要跨过安全、正常运行时间、移动能力和成本这些桥，而行业尚未跨过去。这与 Robot Era
              直接相关，因为它最好的公开商业证明是物流中心，不是开放世界自主。聚焦结构化物流是理性的缓释手段，但也说明公司还没有摆脱该品类更广泛的技术边界条件。安全和数据治理风险同样真实。OSHA
              框架是通用的，不是人形机器人专用；中国标准仍在形成；本次保留的公开资料也没有提供 Robot Era 专属认证包、事故日志、网络安全态势、OTA 控制、MTBF 或正常运行时间指标。与此同时，L7
              手册中的摄像头、LiDAR 和麦克风栈意味着每次部署都可能在工作场所和环境中采集数据，而美国法律环境里围绕 AI 和追踪的隐私主张已经在扩张。风险结论是：Robot Era
              可能足以胜任狭窄工作流，但公开证据仍没有证明其车队能在跨国规模上安全、可靠、合规运行。
