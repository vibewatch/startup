  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户 / 工作流
      - 当前公开规格底线
      - 成熟度 / 状态
      - 差异化信号
      - 尽调缺口
    rows:
      - - ERA-42 具身模型 + 物流解决方案
        - 仓库运营商集成拣选 / 扫描 / 装箱工作流
        - 端到端 VLA 框架；官方工作流覆盖从订单释放到出库
        - 公开叙事已上线；真实部署架构仍部分不透明
        - 工作流集成语言比泛泛的人形 AI 宣传更具体
        - 没有公开模型卡、延迟基准或安全边界
      - - L7 全尺寸人形机器人
        - 物流、制造、研究和高曝光演示部署
        - 171 cm；55 DoF；20 kg 双臂载荷；2.1 m 臂展；L7/L7-M7 共享架构
        - 支撑最充分的旗舰产品；多家外部来源覆盖
        - 结合全尺寸运动、直驱手集成和企业工作流叙事
        - 公开重量、续航和认证披露仍不一致或不完整
      - - M7 上半身人形机器人
        - 腿部价值有限的拣选、扫描、装配、零售和研究场景
        - 43 DoF（含手）；1660 mm 臂展；2.1 m 作业范围
        - 已公开列出，概念清晰，但独立文档少于 L7
        - 复用核心臂 / 手栈，同时降低部署和集成负担
        - 少有独立来源描述生产成熟度或客户结构
      - - Q5 轮式人形机器人
        - 接待、服务、医疗、研究、遥操作和室内交互
        - 44 DoF；约 165 cm；轮式底盘；11-DoF XHAND Lite；保留来源中作业时间 >4 h / 240 min
        - 官方和独立规格数据库均有支撑
        - 比完整双足更适合室内服务和数据采集部署
        - 公开定价、现场可靠性和准确软件边界仍薄
      - - XHAND1 灵巧手
        - 研究实验室、人形机器人 OEM，以及 Robot Era 自有平台
        - 12 主动 DoF；全直驱；80 N 抓握力声明；25 kg 提升力声明；触觉指尖；支持 ROS/C++/Python
        - 栈中公开文档最充分的模块
        - 最清晰证明公司有自研部件野心，也具备跨平台复用性
        - 企业认证、校准漂移和使用寿命数据仍稀疏
      - - XHAND1 Lite
        - Q5，以及更轻量的研究或遥操作配置
        - 面向 Q5 的来源显示 11 DoF；730 g；官方套件称 100 万次空载抓取循环
