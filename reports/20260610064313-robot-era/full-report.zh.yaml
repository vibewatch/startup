              不是直接硬件同行，但战略上重要，因为其公开文章解释了为什么大多数机器人仍首先在高度受控环境中成功，以及为什么开放世界泛化是另一个竞争前沿。这正是买方越来越会拿来比较 Robot Era
              和更高调自主性技术栈的缺口。1X 作为近期工厂对手较弱，因为它仍优先家庭场景，距离规模化商业化很远，但它会争夺家庭人形机器人的心智。Boston Dynamics
              在已披露负载、续航和企业集成上仍是最具技术威慑力的基准；Agility 则可能拥有最清楚的运营故事，证明企业买方确实会通过可重复的 RaaS 式物流和汽车部署为人形机器人付费。这些同行不能否定 Robot Era
