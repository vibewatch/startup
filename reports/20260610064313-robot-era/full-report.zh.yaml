      - number: '2.2'
        title: 中国政策与自动化底座
        blocks:
          - type: paragraph
            body: >-
              对本章而言，中国比泛泛的全球平均值更重要，因为政策和已安装自动化产能都异常集中在中国。官方和国家关联来源显示，2026 年中国推出首个人形机器人与具身智能国家标准框架；上海则另行设定 2027 年计划，目标是
              100 家领军企业、100 个应用场景、100 个产品，以及超过 RMB50 billion 的产出，并用补贴支持商业化。China Daily 还把具身 AI 直接连接到 2026 年政府工作报告，并引用
              Development Research Center 预测：中国国内具身 AI 市场到 2030 年达到 RMB400 billion，到 2035 年超过 RMB1
              trillion。已安装自动化基础同样重要。IFR 称，中国在 2024 年占全球工业机器人部署量的 54%，运营存量超过 2 million 台，并且到 2028 年仍有约 10%
              年增长空间。换句话说，Robot Era 正在世界最深的工厂自动化市场里扩张，而政策制定者也正在试图标准化并加速具身 AI 部署。这是强劲的 SAM
              顺风，但不能消除技术碎片化：多个中国来源仍强调硬件质量不均、数据孤岛、灵巧手瓶颈，以及规模化常态化之前需要通用评估标准。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
