  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 继续跟踪 Robot Era，但不要只凭公开证据就把 2026 年 3 月的私募估值视为已充分承保。
      - - 信心
        - 中
        - 证据足以约束价格纪律，但不足以消除分母风险。
      - - 风险评级
        - 高
        - 商业牵引真实存在，但披露、流动性和商业化风险仍然重大。
      - - 估值立场
        - 偏高
        - 当前估值已经把大量收入转化提前计入，而公开证据尚未跟上。
      - - 入场纪律
        - 要求收入证明或下行保护
        - 相比盲目支付头条价格，结构化融资、明确优先权认知或尽调后的价格重置更容易自洽。
      - - 改变判断的因素
        - 收入转化和现金披露
        - 经审计收入、毛利率和 cap table 经济性，比再一个演示视频更重要。
    notes: 本表明确对价格敏感：它判断的是当前 2026 年 3 月估值是否可投，而不是人形机器人这一品类的整体质量。
