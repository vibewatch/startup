      - number: '4.2'
        title: 定价信号、成本代理与公开单位经济性的边界
        blocks:
          - type: paragraph
            body: >-
              Robot Era 最大的财务盲区仍是定价。保留的 Robot Era 来源没有一个公布 L7、M7 或 XHAND 在商业部署中的标价，因此本章只能依赖明确的同行锚点和市场定价阈值。Unitree
              给出最干净的直接锚点：其官方 G1 页面列出 USD 13,500 基础价，第三方采购报道则把更可编程的 EDU 配置放在 USD 43,900 到 USD 73,900 之间。CnTechPost 对
              Unitree IPO 流程的报道又补充了一个产业代理：2025 年人形机器人 ASP 为 167,600 yuan。另外，SCIO 和 OFWeek 更直接地框定企业 ROI
              问题：许多人形机器人售价仍在数十万元人民币，企业可能把接近 300,000 yuan 的价格视为合理 ROI 阈值。这些信号重要，因为它们同时显示价格压缩，以及 demo
              硬件与量产级经济性之间的差距。但它们仍不能解决 Robot Era 自己的 ASP 或成本栈。任何把公司 >RMB 500 million
              积压订单换算成台数的尝试，都只是一个粗略、由同行锚定的情景，而不是收入模型。正确结论是：公开需求存在，但 Robot Era 已实现单位经济性仍不透明。
