      - number: '4.3'
        title: 资本充足性、融资节奏，以及同行文件对烧钱的启示
        blocks:
          - type: paragraph
            body: >-
              公开融资能力不是 Robot Era 的主要弱点。可支撑的时间线显示，截至 2025 年 11 月三轮融资合计 CNY 1.8 billion，之后 2026 年 3 月完成 RMB 1 billion
              战略轮，2026 年又完成一轮超过 USD 200 million
              的融资。这个节奏对一家私有人形机器人创业公司来说异常强，并由一组与潜在渠道和客户生态重叠的战略投资人加强。但同样的节奏也意味着资本密集。短时间连续大额融资，通常说明管理层在为制造、部署和营运资金需求提前融资，而不是业务已经自我供血。公开同行能解释原因。Serve
              Robotics 有 SEC 支撑的业绩披露显示，收入有限，同时经营和投资现金流出很大。Symbotic 即便有数十亿美元收入，仍强调流动性、利润率和自由现金流。iRobot 的 10-K
              记录了硬件机器人经济性在收入不及预期时能多快恶化。UBTECH 文件证明，人形机器人收入和公司毛利率可以在规模上披露，也让 Robot Era 对现金、债务和资产负债表细节的沉默更显眼。务实解读是：Robot
              Era 很可能有足够外部资本在近期继续扩张，但管理层之外没人能仅凭公开记录负责任地算出精确跑道。
