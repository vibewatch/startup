      - number: '2.3'
        title: 目标垂直：物流、制造与商业服务
        blocks:
          - type: paragraph
            body: >-
              最强的买方证据不是泛化家庭人形机器人，而是已经大笔投入自动化、并感受到劳动力或吞吐压力的企业运营方。物流是最清晰切口，因为 IFR 已把运输和物流记录为最大的专业服务机器人应用，仓储自动化分析师预计 2026 和
              2027 年采纳会扩大，Robot Era 的公开部署也集中在物流中心。制造业是第二大切口，因为 China Daily、IFR
              和公司关联报道都指向结构化工厂任务，如零部件拣选、装配、分拣和检测；在这些任务里，可靠性比社交互动更重要。商业服务是第三个、但标准化程度更低的切口：零售、前厅、导览等任务适合人形形态，但证据比仓库或工厂更薄、更像试点。买方图谱因此分成三类。物流中，运营或自动化负责人掌握预算，仓库团队是用户。制造中，工厂、工程和质量负责人既是赞助者也是采纳者。商业服务中，付款方可能是零售运营商、商场、医院或家电合作伙伴，但采纳仍取决于机器人能否胜过更便宜的固定功能替代方案。因此，Robot
              Era 的市场重点不是消费者新奇感，而是哪些企业流程能足够快地奖励人类兼容形态，从而证明部署合理。
