  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户图谱：物流是主要切口，但公开 logo 集覆盖多类买方
        blocks:
          - type: paragraph
            body: >-
              不应把 Robot Era 的公开客户证据看成一张同等生产客户的扁平名单。最强买方类别是物流运营商；Robotera 反复描述与 SF 关联实体和 China Post
              相关的包裹分拣、小件包裹导入和跨境查验流程。第二类是工业制造：Geely 是最清晰的具名例子，公开来源也把 Renault、TCL 和 Lenovo 放进更广泛产业伙伴集合。第三类是商业服务或零售运营，Haier
              是最具体的证明，因为独立报道称共同开发的机器人已经进入零售门店。第四类是开发者生态，ByteDance 机器人实验室和 Skild AI
              显示的是平台或研究采纳，而不是工厂或仓库经常性收入。最后，公司声称拥有更广泛的国际顶级科技客户足迹，但多数名称仍未披露。因此，正确承销视角应分层。物流客户显示最佳生产意图。物流之外的工业 logo
              有帮助，但往往记录不足。开发者实验室买方有战略验证价值，但不应被算作与规模化仓库或工厂部署同等质量的证明。
