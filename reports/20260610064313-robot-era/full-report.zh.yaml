      - number: '2.4'
        title: 受证据约束的 Robot Era TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              只有把每一层都定义得足够窄，才能搭出干净的 TAM-SAM-SOM。TAM 应是商业人形机器人市场，而不是所有机器人；这里支撑最充分的公开口径是 BCC 的 2025 年 $1.9 billion，到 2030
              年增长至 $11 billion。第二个更偏宣传的口径来自 CNBC 转述的 Barclays，称当前市场为 $2 billion 到 $3 billion，到 2035 年达到 $200
              billion。它适合做上行情景，不适合做基准情景。SAM 还应更窄：以中国为中心、落在物流、制造和商业服务中的具身 AI
              部署；这些场景已经有政策支持、工厂密度、物流自动化需求和服务机器人采购。公开证据在定性上支持这个中国中心的 SAM，但仍不能转化为 Robot Era 单一、干净的收入池。SOM 是最受约束的一层。公开来源支持
              2025 年商业订单超过 RMB500 million、以 SF Group 和 China Post 为代表的物流切口、10 多个物流中心，以及 2026 年 Q2
              启动千台级交付。这些都是强商业化标记，但仍未披露已确认收入、复购率、按机器人类型定价、续约经济性或毛利率。因此，正确承销结论是：Robot Era 在中国企业部署中已经有可见的早期 SOM
              落脚点，但公开数据不足以精确计算市场份额。
