        - 即便公开经济性尚不清晰，融资规模也支撑软件和车队建设
      - - 1X NEO
        - $200 定金和早期访问家庭机器人漏斗
        - 留存来源中没有重大财务披露
        - 有限家庭测试；明确距离规模化很远
        - 更像在未来消费叙事上竞争，而不是当前企业采购
      - - Agility Digit
        - RaaS / 合同模式，而非公开标价
        - 私营公司经济性仍未披露
        - 正式付费 GXO 和 Toyota 部署，加上 Amazon 或 Schaeffler 参考
        - 相比资本开支较重的买方，服务模式可能降低采用摩擦
      - - Boston Dynamics Atlas
        - 无公开标价；企业产品销售
        - 此处没有公开的 Atlas 专属收入线
        - Hyundai 商业化路径和 Georgia 工厂证明
        - Robot Era 在企业集成上面临的基准比标价更难
    notes: 最有信息量的比较不只是标价，而是竞争对手是否披露标价、融资或申报是否验证规模，以及公司是否已经从试点叙事跨入付费或重复部署。
