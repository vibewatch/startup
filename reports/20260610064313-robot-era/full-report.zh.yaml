      - number: '5.2'
        title: ERA-42 架构表述与软硬件闭环
        blocks:
          - type: paragraph
            body: >-
              Robot Era 最清晰的技术故事不是完整模型卡，而是一个运行闭环描述。在官方解决方案页面，ERA-42 被描述为端到端 VLA
              模型，把具身大脑连接到自动化系统，并覆盖仓库从订单下发到出库、拣选、扫码和装箱的序列。官方文本还描述了双向闭环：业务系统下发任务，模型回传进度和状态，标准化接口层应减少定制再训练。这比泛泛的「AI
              驱动人形机器人」更具体，因为它把软件锚定在真实企业流程和集成要求上。独立报道补充了更多色彩，但没有给出完整透明度。Robotics & Automation News 称，Robot Era 把 ERA-42
              描述为统一的视觉-语言-触觉-姿态模型，与 XHAND1 匹配，能够快速学习任务，并由世界模型概念扩展；KrASIA 又转述了快慢分层架构和 Ctrl-World 合作。GitHub 证据还显示，公司发布 ROS
              2 和 Python 控制界面、轨迹和 MPC 示例，以及手部控制
              API。因此，承销结论是正面但有边界：公开来源支持真实的软硬件闭环，但没有发布投资人通常想要的核心内部信息，如参数量、基准方法、安全边界，或负载下实测延迟。
