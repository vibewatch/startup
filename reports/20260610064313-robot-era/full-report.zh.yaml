        - 灵活工业任务仅靠刚性单用途机械臂更难自动化
        - L7 处理全身任务；上半身可达性和灵巧性比移动更重要时用 M7
        - 公开来源反复点名拧螺丝、装配、拣选和检验任务
        - 公开证明停留在场景层面，不是经审计的吞吐或在线率
      - - 室内服务 / 接待 / 医疗 / 旅游
        - 人机互动、导航和物品递交需要比固定服务亭更安全、更有表现力的形态
        - Q5 轮式人形机器人，配高 DoF 机械臂、XHAND Lite、视觉和遥操作支持
        - 公开来源提到导览、接待、配送、医疗辅助和零售互动
        - 公开定价和服务维护经济性仍薄
      - - 研究 / 遥操作 / 数据采集
        - 实验室需要可控平台，用于模仿学习、遥操作和闭环验证
        - Q5、M7、XHAND1，以及公开 ROS2/Python 控制接口
        - 官方和 GitHub 来源展示了遥操作、MPC、轨迹和手部控制路径
        - 公开文档仍不完整，部分官方手册仍设门槛
      - - 独立灵巧操作
        - 许多实验室和 OEM 需要可复用的手，而不是完整人形机身
        - XHAND1，配直驱、触觉指尖，并支持 ROS/C++/Python
        - 公开来源提到外部采用者，包括 Skild AI、Extend Robotics、UC Berkeley、MIT 和 ByteDance Seed
        - 公开校准、故障率和量产服务数据仍未披露
