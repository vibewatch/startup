      - number: '2.5'
        title: 增长驱动、约束与承销含义
        blocks:
          - type: paragraph
            body: >-
              采纳逻辑真实存在，但仍有条件。正面看，劳动力短缺、24/7 吞吐需求、仓储自动化投资和快速下降的硬件成本，都支持人形机器人在结构化企业环境中采纳。IFR
              的工业和服务机器人数据说明，买方已经愿意为工厂和物流自动化付费。Interact 和 McKinsey 显示这些预算仍在扩张；BusinessWire 和 CNBC
              的成本压缩信号则说明，中国可能把人形机器人价格压低到许多西方投资者预期之外。可是，反向证据同样重要。Humanoid.guide、RobotToday、China Daily
              和更广泛行业报道都反复指向同一批阻碍：灵巧手、训练数据、安全认证、功耗和散热限制，以及相对更便宜固定功能系统证明 ROI
              的难题。这意味着投资争论不是市场是否存在，而是结构化试点能以多快速度变成可重复、毛利为正的推广。对 Robot Era
              来说，最强的市场解读是：未来几年物流和工厂部署能支撑真实增长；主流服务采纳大概率滞后，家庭市场叙事仍然过早。公开数字足以支持正面市场逻辑，但不足以跳过对经济性、留存和客户集中度的尽调。
