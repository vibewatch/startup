  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 正方逻辑
      - 什么会改变观点
    rows:
      - - 工业赞助
        - Robot Era 拥有中国人形机器人中较强的战略投资者阵容之一，应能帮助分销、制造和客户触达。
        - 如果后续文件显示本轮带有异常沉重的优先权或战略约束，赞助方质量对公司的支持就没有头条显示得那么强。
      - - 商业牵引
        - 累计订单超过 RMB 500 million、大型物流订单、海外占比和千台级交付表述，说明真实需求正在形成。
        - 如果这些指标被证明以试点为主、可取消，或转化为确认收入很慢，当前估值就会失去核心支撑。
      - - 中国部署优势
        - 中国供应链深度、政策支持和企业自动化需求，可以支撑相对普通机器人故事的溢价。
        - 如果政策支持不能转化为经常性付费部署，“中国溢价”就会坍缩成又一个融资叙事。
      - - 全球可比公司折价
        - Robot Era 估值低于 Figure、Physical Intelligence 等美国头部具身 AI 品牌，有助于相对定位。
        - 如果收入披露仍明显弱于 Unitree 或 UBTECH，相对十角兽的折价并不够。
      - - 披露缺口
        - 反方逻辑不是 Robot Era 没有需求，而是需求质量、利润率质量和投资者经济性仍披露不足。
        - 经审计收入、毛利率和合同付款数据，可能把立场从偏高推向合理。
      - - 行业炒作风险
        - 独立反向研究认为，整个品类仍活在结构化环境中，可能跑在真实商业化前面。
        - 如果 Robot Era 发布在线率、转化和续约数据，足以推翻行业层面的怀疑，反向权重应下降。
    notes: 反方逻辑主要关乎分母质量和流动性风险，而不是人形机器人在技术上是否有趣。
