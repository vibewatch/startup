companyProfile:
  summary: >-
    Robot Era 是一家总部位于北京的具身智能与人形机器人公司，由清华教授 Jianyu Chen 于 2023 年 8 月创立。公开资料支撑其模块化产品栈：L7 全尺寸人形机器人、M7 上半身平台、Q5 轮式人形机器人，以及
    XHAND 灵巧手系列；近期商业化最清晰的场景是结构化物流和工业流程。所提供信源包还显示，公司融资速度异常快，2026 年 3 月估值标记超过 RMB 10 billion，累计订单超过 RMB 500 million，已落地 10
    多个物流中心，并有国际需求信号。核心尽调限制不是缺少动能，而是财务透明度不足：公开证据仍未清楚披露已确认收入、毛利率、现金跑道、客户集中度或最终轮次经济条款。
  foundedDate: '2023-08-01'
  founders:
    - name: Jianyu Chen
      role: 创始人
      background: 清华 IIIS 助理教授、ISR Lab 负责人，本科毕业于清华，博士毕业于 UC Berkeley，师从 Masayoshi Tomizuka。
      claimRefs:
        - CO004
        - CO005
        - CO006
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: 人形机器人与具身智能技术栈，围绕 L7 全尺寸人形机器人、M7 上半身机器人、Q5 轮式人形机器人、XHAND 灵巧手，以及用于仓储和工业任务执行的 ERA-42 VLA 软件闭环展开。
  customerFocus: 面向物流、制造业和部分商业服务环境中的企业运营方；这些客户需要在为人类设计的空间里，用灵活的抓取、分拣、搬运和自动化流程解决问题。
  businessModel: 向企业自动化用例销售或部署人形机器人、灵巧手模块和具身 AI 工作流系统，变现很可能来自硬件销售、系统部署，以及相关软件或集成服务。
