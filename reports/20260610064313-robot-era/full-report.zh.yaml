  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 概率信号
      - 假设
      - 估值逻辑
      - 示意公允价值区间
    rows:
      - - 牛市
        - 25%
        - 订单转化强劲，海外占比守住，千台级交付被市场接受为真实部署，管理层披露的利润率更接近中国头部同行，而不是困境中的机器人公司。
        - 投资人继续为具身 AI 可选性支付战略溢价，但仍低于 Figure 式软件品牌的极端水平。
        - RMB 11B-RMB 15B
      - - 基准
        - 50%
        - 订单真实，战略投资人也重要，但到下一轮尽调周期，已确认收入披露、现金和优先权条款仍不完整。
        - 当前估值大致只有在战略轮语境下才站得住，公开分母证据仍有限。
        - RMB 8.5B-RMB 10.5B
      - - 熊市
        - 25%
        - 订单转化放慢，利润率低于预期，或融资条款比头条估值显示的更保护投资人，同时板块热度降温。
        - 估值向公开可比公司的纪律回归，远离私募轮的稀缺性价值。
        - RMB 6B-RMB 8.5B
      - - 概率加权
        - —
        - 基准情形证据占主导，因为最强的公开正面因素真实存在，但并不完整。
        - 上述情景组中点的加权结果。
        - ~RMB 9.5B-RMB 10B
    notes: 这些情景区间是判断区间，锚定已披露融资轮、订单代理指标、公开市场可比公司和负面商业化证据；它们不是 DCF 输出，也不应被误认为经审计的内在价值。
