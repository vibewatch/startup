        - 现场运营、自动化工程师和一线主管
        - 运营预算或已批准的资本开支 / RaaS 支出
        - 包裹导入、分拣、拣选、周转箱搬运、移动操作
        - COO、物流自动化负责人，或仓库总经理
        - 24/7 吞吐需求、劳动力短缺，以及高差异物品处理
      - - 制造工厂
        - 汽车、电子、电器，或精密制造运营商
        - 产线操作员、工业工程师和质量团队
        - 工厂资本开支和自动化预算
        - 零部件拣选、检测、装配支持、物料搬运
        - 工厂经理、制造副总裁，或质量负责人
        - 需要在人类设计的产线里部署灵活自动化
      - - 商业服务场所
        - 零售连锁、商场、医院，或电器 / 服务合作方
        - 门店员工、前台团队，或服务主管
        - 门店运营或数字化转型预算
        - 导览、零售协助、配送，或简单交互任务
        - 总经理、创新负责人，或服务运营负责人
        - 当人形形态重要时，提升客服效率并替代部分劳动力
      - - 政策支持试点 / 产业园
        - 市政府、开发区，或国资关联平台
        - 园区运营方、合作企业、标准团队
        - 公共补贴加企业共同投入
        - 试点验证、标准制定和场景商业化
        - 产业园发起方或市级未来产业办公室
        - 推动具身 AI 加速落地的战略诉求
    notes: Robot Era 的买方地图由企业牵引：物流和制造是近期最强切入口，商业服务和政策支持试点则拓展边缘场景。
