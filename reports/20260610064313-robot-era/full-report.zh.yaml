            title: 地缘政治风险并不抽象，因为 Robot Era 的产品栈直接压在先进算力和出口敏感传感器上
            body: >-
              Robot Era 不只是另一家工业集成商。它自己的手册指向先进板载算力和丰富感知，而美国政策已经从泛泛的芯片话术推进到对先进 AI
              算力、甚至某些模型权重的实时管制。这让地缘政治风险成为产品栈的一部分，而不只是销售叙事的一部分。
