        - id: D
          label: 中国可比公司背景
          detail: Unitree 和 UBTECH 表明，披露收入可以支撑有意义的中国机器人估值。
          tone: neutral
        - id: E
          label: 分母缺失
          detail: Robot Era 仍未披露经审计收入、毛利率、现金或优先权条款。
          tone: risk
        - id: F
          label: 行业怀疑
          detail: Bain、McKinsey 和 IEEE 认为商业化仍处在结构化、早期且容易被炒作的阶段。
          tone: risk
        - id: G
          label: 继续研究 / 偏贵
          detail: 保持跟进，但在更多尽调或下行保护之前，不应按头部估值标记买入。
          tone: risk
      edges:
        - from: A
          to: B
          label: 受支撑于
        - from: B
          to: C
          label: 强化
        - from: C
          to: D
          label: 必须越过
        - from: D
          to: E
          label: 但仍需要
        - from: E
          to: F
          label: 被放大于
        - from: F
          to: G
          label: 因此
