  - id: TV005
    title: 论点破裂与叫停触发表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入转化跟不上故事
        - 管理层无法拿出已确认收入，且该收入与披露的 >RMB 500M 订单基础有实质匹配。
        - 当前估值不再是战略溢价，而像是在为积压订单头条买单过高。
        - 将案例重置到熊市区间定价，或放弃。
      - - 现金和烧钱弱于预期
        - 现金跑道较短，或烧钱速度比部署转化为付费安装的速度更快。
        - 在板块情绪可能降温时，公司变得依赖融资。
        - 要求更强条款、更多尽调，或更低入场价。
      - - 优先权堆栈扭曲头条估值
        - 清算、棘轮或治理保护让表观估值在经济意义上误导投资人。
        - 头条估值不再近似真实普通股价值。
        - 暂停，直到融资文件完成审阅。
      - - 商业验证仍结构化且狭窄
        - 部署仍卡在演示、海关检查或高度脚本化的物流单元里，没有更广泛的车队级验证。
        - 板块负面研究会变成直接针对公司的估值逆风。
        - 将公司从「research-more」推向「track only」或更低。
      - - 市场倍数压缩冲击机器人板块
        - 公开自动化和机器人估值倍数压缩，私募资本也更不愿为可选性买单。
        - Robot Era 失去当前支撑战略轮估值的稀缺性溢价。
        - 承诺投资前，按更低公开倍数区间重新承销。
    notes: 这些是估值叫停触发项，而非泛泛的业务风险；每一项都能直接推翻当前入场价格。
