  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Robot Era 确实有一个市场出清的私募估值标记，但公开记录支持的更多是战略期权价值，而不是收入支撑的公允性。2026 年 3 月资料相互印证了一轮 RMB 1 billion 战略融资，估值超过 RMB
              10 billion，第三方报道把这个锚点折算到约 15 亿美元上下。在 Figure、Physical Intelligence 和其他人形机器人龙头都融到巨额资金的市场里，这个价格并不荒谬；Robot Era
              异常广泛的产业投资人基础、累计订单 >RMB 500 million、10 多个物流中心部署，以及千台级交付表述，也提供了支撑。问题在分母。Robot Era
              仍未披露经审计收入、待转化订单转收入情况、毛利率、现金或优先权条款。订单、出货和投资人 logo
              都有意义，但它们并不等同于入账收入或清晰退出经济性。因此，价格敏感的结论是继续研究，置信度中、风险高、估值偏高，而不是干净的买入或回避。
