      - number: '1.2'
        title: 创始人画像、领导层可见度与治理不透明
        blocks:
          - type: paragraph
            body: >-
              所提供资料中，公开领导层可见度主要集中在 Jianyu Chen。独立报道将他识别为 Robot Era 创始人，清华官方 IIIS 页面则确立了这个角色背后的技术履历：助理教授身份、ISR Lab
              关联、清华本科，以及 2020 年在 UC Berkeley 师从 Masayoshi Tomizuka 获得博士学位。这是有意义的创始人-市场匹配信号，因为它把公司连接到顶尖控制、机器人和具身 AI
              研究，而不是纯财务包装周期。反面是，公开记录在 Chen 之外仍很薄。The Wire China
              补充了年龄背景并重复了一项重要客户说法，但所提供信源包没有呈现更完整的高管梯队、现任董事会名单或详细治理图。尽调上，这意味着本章可以有力支持创始人可信度，但还无法支持组织深度或决策权分布。在更完整的高管和治理资料私下提供之前，关键人集中度看起来偏高。
