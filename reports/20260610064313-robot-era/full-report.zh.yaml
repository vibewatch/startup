      - number: '4.4'
        title: 披露质量、反向证据与仍最重要的尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              公开档案强在商业化叙事，弱在财务卫生。Bain、McKinsey、Interact、SCIO、OFWeek 和 KrASIA 的反向报道都指向同一方向：早期人形机器人需求存在，但商业化仍集中在结构化环境，ROI
              仍脆弱，电池和灵巧性仍是关口，投资人热情可能跑在证据前面。Robot Era 自己的披露也符合这个模式。公司清楚谈订单、部署和产业投资人，但保留来源没有披露已确认收入、已实现
              ASP、毛利率、现金、债务、积压订单账龄、质保准备或计费机制。投资人面对的是一家商业上看起来真实、财务上披露不足的公司。因此，尽调阻塞项很具体，而不是抽象：按收入流的收入确认、按产品和服务的毛利率、现金和月度烧钱、大型部署的营运资金条款，以及已报告订单簿的真实转化质量。在这些交付之前，本章最有支撑的判断是：需求形成和融资能力为正面，经济性和跑道仍需谨慎。
