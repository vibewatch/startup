      - number: '8.2'
        title: 可比边界与中国相对全球的语境
        blocks:
          - type: paragraph
            body: >-
              可比公司同时支持溢价和折价。相较于陷入困境或成熟的上市机器人公司，Robot Era 应享有溢价，因为该品类仍按未来平台价值定价，而不是按当前 GAAP
              盈利定价；中国的供应链深度和政策支持，也让本土部署故事比单看西方公开市场情绪更容易融资。但相较于最受追捧的美国具身 AI 融资，Robot Era 也应有折价。Figure 的私募估值从 2024 年的 $2.6
              billion 升至 2025 年的 $39 billion；Physical Intelligence 在证明广泛商业部署之前，就凭基础模型热度达到 $2.4 billion 投后估值。Robot Era 的
              >RMB 10 billion 锚点明显低于这些全球 AI 品牌峰值，但这并不自动说明它便宜。披露更充分的中国同行是更苛刻的参照。Unitree 在 IPO 材料中披露 2025 年收入增长至 17.08
              亿元，并更新了 2026 年利润压力；UBTECH 披露 2025 年收入 RMB 2.001 billion、全尺寸人形机器人收入 RMB 820.6 million、毛利率
              37.7%，而公开市场数据仍把其股权价值放在约 $7.22 billion。这些同行说明，中国公司可以获得真实溢价，但市场奖励的是已披露的收入转化，而不只是订单头条。
