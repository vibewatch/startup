  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 已确认收入桥接
        - 2025-2026 年按产品、地域和客户类型拆分的季度收入，以及积压订单转化。
        - 它能补上订单与真实销售之间最大的分母缺口。
        - 财务团队、审计师底稿和董事会材料。
      - - 毛利率和服务组合
        - 按产品族拆分硬件、软件、集成和支持毛利率。
        - 估值取决于 Robot Era 规模化后像机器人平台，还是像重人力集成商。
        - CFO 复核，加 SKU 级毛利桥接。
      - - 现金和跑道
        - 2026 年 3 月融资后，账面现金、月度烧钱、资本开支需求和下行情形跑道。
        - 2026 年 3 月融资后仍剩多少稀释风险，融资节奏是核心。
        - 资金计划表和董事会批准的经营计划。
      - - 大订单合同经济性
        - '>RMB 50M 物流订单的付款里程碑、验收测试、质保和取消条款。'
        - 大合同可以看起来亮眼，但经济质量仍然很差。
        - 客户合同、法律审阅和回款数据。
      - - 优先权和治理条款
        - 最新融资轮的股权类别堆栈、清算优先权、反稀释和战略权利。
        - 名义估值可能与有效入场经济性大幅背离。
        - 律师审阅融资文件和附函。
      - - 部署质量指标
        - 已安装基数的正常运行时间、故障率、复购数据和海外订单付费转化。
        - 这是检验公司是否跑赢板块商业化缺口的最快办法。
        - 运营仪表盘、客户访谈和服务日志。
    notes: 要把判断从有边界的观点推进到按当前估值承销入场，这些是最低限度的尽调要求。
