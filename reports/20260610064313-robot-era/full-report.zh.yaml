      - number: '7.3'
        title: 竞争、商业化与资本强度风险
        blocks:
          - type: paragraph
            body: >-
              Robot Era 并不处在一个只靠执行就能决定结果的平静融资市场里。它参与的是一场资本竞赛，竞争对手的披露质量和规模已经在重置买家与投资人的预期。Robot Era 自身以超过 RMB 10 billion
              的估值融资 RMB 1 billion，数周后又融资超过 USD 200 million，同时宣称千台级交付和 10 多个物流中心部署。这很亮眼，但同一组资料也显示基准已经变得多么苛刻。Unitree 正以约
              RMB 50 billion 的估值冲刺 IPO，并称收入已超过 RMB 1 billion 且已经盈利；UBTECH 既有 8 亿元订单叙事，也有 HKEX 支撑的人形机器人收入披露；AgiBot 宣传已经推出
              10,000 台机器人；Figure 仍凭 Helix 掌握十角兽资本和强公开 VLA 品牌。Humanoids Daily 把该行业描述为极其昂贵的资本竞赛，而 KrASIA
              是有用的制衡：行业仍缺少清晰收入路径，一些被热捧的部署只是战略绑定，而非规模化销售。IEEE Spectrum 又从需求侧提醒，目前还没有人找到每个设施需要数千台人形机器人的用例。对 Robot Era
              来说，这产生两个相连风险。第一，竞争可能压缩价格，或让客户预期移动得比 Robot Era
              证明现场经济性更快。第二，公司可能不得不在自身收入质量、可重复性和利润率轮廓对外清晰之前继续融资。因此，合理的剩余判断不是“融资到位，风险解决”，而是“融资到位，烧钱和证明义务被推后”。
