              逐个客户看，证据质量差异很大。SF 相关物流是置信度最高的一行，因为证据包同时包含点名客户路径、海关部署表述、大额披露订单规模和千台级交付说法。China Post
              也反复出现在物流中心叙事里，但公开证据仍主要来自公司侧和媒体侧，而不是 China Post 自身，因此这行真实但仍不完整。Geely 是下一个最强的点名
              logo，因为它反复被界定为战略投资方和产业伙伴，且资料描述了相关制造场景。Haier 比多数剩余工业客户更具体，因为独立报道称双方共研的机器人已经进入零售门店。Renault、TCL 和 Lenovo
              的意义在于把 logo 组合扩展到汽车、消费电子和企业科技，但每一家仍缺少特定场站的公开案例研究。ByteDance 和 Skild AI 提供了另一类证明：它们说明 Robotera
              正在把系统卖入或投放到先进机器人研发环境，但应计作开发者或实验室采用，而不是与规模化物流合同同等质量的证明。
