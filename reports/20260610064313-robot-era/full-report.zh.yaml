  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 这组 KPI 显示，公司融资真实、订单储备有动能，但披露质量还不足以干净支撑当前估值标记。
    data:
      items:
        - label: 参考估值
          value: '>RMB 10B'
          detail: 2026 年 3 月战略轮锚点。
          tone: neutral
        - label: 战略轮规模
          value: RMB 1B
          detail: 足以确认投资人需求仍在，也确认公司持续需要大量资本。
          tone: positive
        - label: 累计订单
          value: '>RMB 500M'
          detail: 商业牵引存在，但这不是已确认收入。
          tone: positive
        - label: 海外订单占比
          value: ~50%
          detail: 如果能转化为付费部署，就是跨境需求的有利信号。
          tone: neutral
        - label: Unitree 2025 年收入
          value: RMB 1.708B
          detail: 中国同业案例，说明 IPO 准备前或过程中可以做到更高披露。
          tone: neutral
        - label: UBTECH 2025 年收入
          value: RMB 2.001B
          detail: 已上市中国同业，披露了人形机器人收入和 37.7% 毛利率。
          tone: neutral
        - label: Symbotic 估算销售倍数
          value: ~10x
          detail: 上市自动化基准，使用 2026 年 6 月市值和过去十二个月收入。
          tone: neutral
        - label: iRobot 压力情景倍数
          value: ~0.02x
          detail: 提醒投资人：当增长和盈利能力走弱，上市机器人公司估值可能崩塌。
          tone: risk
