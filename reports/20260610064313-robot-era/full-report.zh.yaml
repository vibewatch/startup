  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 地缘政治、出口管制与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Robot Era 在地缘政治层面有两重暴露：一是训练和部署具身 AI 系统所需的算力栈，二是中国制造机器人进入市场时附着的政治问题。公司自己的 L7 手册描述了 x86 加 Orin
              的算力栈，以及摄像头、LiDAR 和麦克风硬件，这正是如今处在更对抗性中美政策框架里的先进、传感器密集型具身系统。BIS、CRS 和 Sidley
              都显示，美国管制已经从泛泛的半导体话术，推进到对先进计算、Entity List 指定乃至某些 AI 模型权重的实际限制。FDD 和 IEEE Spectrum
              补上了市场后果：美国政策制定者现在愿意讨论中国机器人采购禁令和聚焦传感器的限制，而供应链仍相互缠绕，并不能干净切开。对 Robot Era
              而言，出口管制风险不只是训练算力问题。它还可能缩窄客户集合、拖慢海外渠道扩张，并提高跨国买家的尽调摩擦。监管碎片化又加重了问题。OSHA 仍没有人形机器人专门标准，EU AI Act 和 Machinery
              Regulation 提出了正式的健康、安全和权利义务，McKinsey
              也认为自动人形机器人的标准栈仍不完整。中国在人形机器人专项标准制定上走得更快，但这并不会简化跨境合规。实际风险因此是中高发生概率、关键影响：Robot Era
              可以继续卖进以中国为中心的结构化工作流，但任何假设全球无摩擦扩张的投资逻辑，都缺少当前公开记录支撑。
