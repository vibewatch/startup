      - number: '8.3'
        title: 情景框架与倍数纪律
        blocks:
          - type: paragraph
            body: >-
              约束估值的正确方式，是明确哪些是估计，哪些是披露。Robot Era 最干净的已披露商业数字，是累计订单超过 RMB 500 million。如果投资人粗糙地把它当成类收入分母，当前 >RMB 10
              billion 估值意味着估计订单簿倍数超过 20x；这只是粗略校验，不是真正销售倍数，因为订单不是收入，时间区间也未标准化。公开可比公司提供第二个视角。CompaniesMarketCap 把 Symbotic
              估在约 $25.66 billion，对应约 $2.51 billion 的过去 12 个月收入，约 10x 销售额；而 iRobot 2026 年 6 月市值仅约 $14.84 million，对比 2024
              年 $682 million 收入，显示当增长和盈利能力断裂时，公开机器人股权会多么剧烈压缩。在这个光谱上，Robot Era
              既不像公开市场便宜货，也不像全球私募市场荒谬高价；它更像一轮按成功收入转化定价的战略融资。这导向一个以略低于当前估值为中心的基准区间，只有当管理层证明订单会转化为确认收入、利润率和重复部署，而不是一次性试点时，才有上行空间。
