    rows:
      - - Robot Era
        - 中国直接仿人机器人现有玩家
        - '> $200M 最新一轮融资；>10 个物流中心；称 2026 年 Q2 交付千台级'
        - 物流、制造、商业服务、科研
        - 声称 95%+ 核心部件自研；L7 加 XHAND1 栈；物流 PMF
        - 没有公开标价；公开汽车工厂证明少于部分对手
      - - AgiBot
        - 中国直接仿人机器人及平台同业
        - 声称第 10,000 台机器人下线；Expedition 出货 2,000+ 台；2025 年收入 RMB1B
        - 工业、物流、服务、零售、安防、教育
        - 产品组合更广，AIMA 生态加上大规模部署叙事
        - 公开标价仍不透明
      - - Unitree
        - 中国直接仿人机器人价格领导者
        - IPO 申报指向 RMB1.71B 的 2025 年收入，并声称出货领先
        - 科研、教育、早期商业和工业用途
        - 公开 $13.5K 的 G1 价格，且积极压缩 ASP
        - 基础 G1 负载相对重型工业仿人机器人偏小
      - - Fourier
        - 中国灵巧度和开发者导向仿人机器人同业
        - 官方将 GR-1 定位为量产；GR-2 增加更丰富的手部工具
        - 科研、医疗、工业试点、开发者生态
        - 12-DoF 触觉手，并明确支持 SDK
        - 公开的工厂级客户数量较少
      - - UBTECH
        - 中国上市工业仿人机器人同业
        - 2025 年仿人机器人收入 RMB820.6M；数百台 Walker S2 批量订单
        - 汽车、智能工厂、物流、工业运营
        - 公开申报透明度高，工厂部署姿态强
        - 价格仍不透明，定位偏工业优先而非广泛消费 / 开发者
      - - Galbot
        - 中国移动操作机器人与具身 AI 同业
        - 累计融资 $800M；估值 $3B；声称千台级订单
        - 制造、零售、移动操作、具身 AI 部署
        - 融资规模很大，工业大客户标识亮眼
        - 官方产品细节弱于融资或部署头条
      - - Figure
        - 全球仿人机器人与自主栈同业
        - '> $1B Series C，估值 $39B；BMW 部署协议'
        - 制造、物流、家庭
        - Helix 软件品牌加公开负载 / 续航披露
        - 商业收入质量仍未公开详述
      - - Physical Intelligence
        - 自主栈相邻竞争者
        - 知名投资方阵容；VLA 研究节奏快
        - 覆盖多种形态的机器人 OEM 与自主合作伙伴
        - 卖点是泛化和软件深度，而不是销售机器人本体
        - 没有披露直接硬件或部署经济性
      - - 1X
        - 家庭优先的仿人机器人相邻同业
        - NEO 早期访问需支付 $200 定金；有限家庭测试
        - 家务协助和消费 / 家庭机器人
        - 家庭定位清晰，设计强调安全
        - 距离规模化商业化仍很远
      - - Boston Dynamics
        - 全球工业现有玩家基准
        - 提到 Hyundai 商业化路径和企业 Atlas 规格表
        - 汽车、物料搬运、企业自动化
        - 本组中披露的负载和系统集成最强
        - 这里没有清晰的公开价格或大批量交付数字
      - - Agility Robotics
        - 全球物流和汽车部署同业
        - 付费 GXO 与 Toyota RaaS 交易，加上 Amazon 或 Schaeffler 参考
        - 仓储、物流、制造
        - 有真实付费部署证据和工作流集成栈
        - 公开数量仍小，标价未披露
      - - AgileX
        - 相邻移动操作替代方案
        - 官网聚焦底盘、机械臂、ALOHA 套件和数据采集
        - 科研、教育、移动机器人、部分自动化
        - 对部分具身智能任务，是更便宜或更简单的替代方案
        - 不是直接的全尺寸仿人机器人基准
    notes: 这些行有意偏向真实 Robot Era 买方决策中最可能重要的玩家，而不是市场评论里提到的每一个仿人机器人品牌。
