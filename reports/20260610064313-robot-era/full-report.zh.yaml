  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 粗略按订单代理口径计算，当前估值标记已默认相对上市自动化公司倍数有溢价，也远高于简单 5x 或 10x 在手订单视角。
    data:
      items:
        - label: 以 >RMB500M 订单代理计 5x
          value: 2.5
          detail: 仅作粗略示意；订单不是收入。
          tone: risk
        - label: 以 >RMB500M 订单代理计 10x
          value: 5
          detail: 更接近强势上市自动化公司的销售倍数，但分母仍是订单而非收入。
          tone: neutral
        - label: 以 >RMB500M 订单代理计 20x
          value: 10
          detail: 当前 >RMB10B 参考估值大致隐含的倍数。
          tone: risk
        - label: 以 >RMB500M 订单代理计 30x
          value: 15
          detail: 需要极激进地相信转化、利润率和战略稀缺性。
          tone: risk
        - label: 当前战略轮参考
          value: 10
          detail: 按公开报道的 2026 年 3 月估值锚点，展示其隐含下限。
          tone: neutral
    approximationNotes: 除参考估值标记本身外，所有柱形都用已披露累计订单作为粗略代理分母。这里刻意标为订单簿估算，而不是经审计销售额测算。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV042
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 按公开证据推导的基准情景接近但略低于当前参考标记；如果没有新证据，上行空间有限。
    data:
      items:
        - label: 熊市公允价值
          low: 6
          mid: 7.3
          high: 8.5
          displayValue: RMB 6B-RMB 8.5B
          detail: 订单转化不及预期，行业倍数压缩加剧。
          tone: risk
        - label: 基准公允价值
          low: 8.5
          mid: 9.5
          high: 10.5
          displayValue: RMB 8.5B-RMB 10.5B
          detail: 订单真实存在，但披露仍不完整，上市可比公司的倍数纪律仍然重要。
          tone: neutral
        - label: 牛市公允价值
          low: 11
          mid: 13
          high: 15
          displayValue: RMB 11B-RMB 15B
          detail: 收入转化、利润率和复部署表现，证明明显好于当前公开材料显示的水平。
          tone: positive
        - label: 当前参考标记
          low: 10
          mid: 10
          high: 10
          displayValue: '>RMB 10B'
          detail: 留存公开来源给出的 2026 年 3 月战略轮锚点。
          tone: neutral
    approximationNotes: 这些是根据已披露轮次锚点、同业信号、上市可比公司倍数纪律和不利商业化证据推导的判断区间；不是贴现现金流输出。
    claimRefs:
      - CV001
