chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与公司定位
        blocks:
          - type: paragraph
            body: >-
              Robot Era
              把自己定位为扎根北京清华生态的人形机器人和具身智能公司，而不是狭义零部件供应商。公司官网和应用资料包是最强的运营基地证据，里面出现了清华科技园地址、营销邮箱和公开电话。这一点重要，因为它把公司锚定在真实商业足迹上，而不是纯学术项目。独立创始人访谈包补充了成立时间：KrASIA
              称 Robot Era 创立于 2023 年 8 月，这与一家快速扩张、异常迅速抵达大额融资节点的年轻公司叙事相符。同样关键的是，叙事并非「只做硬件」。Chen 描述的是脑与身体结合的策略：模块化、类似 Lego
              的硬件，加上一层 ERA-42 VLA 软件；CES 2026
              资料也把公司放在更广泛的具身智能产品家族里。综合来看，已审阅资料支持这样一个身份：一家总部位于北京、源于研究体系的商业机器人公司，有模块化平台野心，也有足够公开运营细节，可与隐身实验室项目区分开。
