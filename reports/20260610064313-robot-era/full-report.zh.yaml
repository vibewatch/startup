      - number: '8.4'
        title: 反向证据、尽调问题与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              反向资料重要，因为这个行业仍非常早期。Bain 称部署仍大多在高度结构化环境里，抓取处理和电池续航仍卡住商业化。McKinsey 称，试点演示与商业可行规模之间的差距仍很大。IEEE Spectrum
              更直白：资金充裕的人形机器人公司可以一边继续融资巨额资金，一边把未解决问题挥开。Robot Era
              的公开记录符合这个提醒。公司的融资势头强于财务披露质量，融资锚点仍可能受到优先权悬挂、待转化订单滑坡，或订单转为确认收入速度慢于宣传的影响。因此，本章的投资逻辑破裂点是运营和财务性的，而不是意识形态性的。要从偏高转为合理或有吸引力，需要按收入流给出可审计收入、按产品给出毛利率、披露现金和月度烧钱速度、披露
              >RMB 50 million 物流订单的合同付款条款，并证明海外订单和千台级交付正在转化为已验收、已付款部署。没有这些证据，当前估值仍只适合在继续尽调或有下行保护结构的前提下投资。
