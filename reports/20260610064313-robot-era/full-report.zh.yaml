      - number: '7.4'
        title: 关键人物依赖、伙伴集中与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              Robot Era 的公开故事异常集中在一个创始人画像和一个商业切口上。Tsinghua 和 The Wire China 合起来显示，陈建宇不仅是公司创始人，还是 Tsinghua 助理教授，拥有
              Berkeley
              机器人学博士学位，并仍在运营一个学术机器人实验室。这对技术可信度、招聘和投资人信号是真正优势，但也带来典型关键人物暴露。保留的公开记录没有浮现出一组清晰点名、在产品、制造、安全或国际合规上同等量级的高管梯队，能够显然吸收创始人离开、分心或声誉事件的冲击。商业上，公司最强的证明集中在物流、China
              Post、SF Group、海关检查，以及覆盖汽车、科技、物流和半导体的广泛但偏战略投资人生态。这给 Robot Era
              带来渠道和产业背书，但也意味着乐观情景的一部分依赖于一组相对集中的交易对手、支持方和用例叙事继续配合。如果这些关系减弱，或订单头条弱于收入转化，下行会很快传导到融资杠杆、估值和客户信心。因此，否决标准应当是运营性的，而不是意识形态性的：随着部署扩大仍无法发布安全和正常运行时间证据，无法把物流切口转化为可重复确认收入，在仍火热的同行市场里融资估值持平或下行，或创始人连续性丧失且没有可见高管梯队，都应被视为损害投资逻辑的事件，而不是短期噪音。
