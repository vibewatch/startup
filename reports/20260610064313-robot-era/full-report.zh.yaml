  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与当前公开规格底线
        blocks:
          - type: paragraph
            body: >-
              对 Robot Era 最有支撑的公开认知是一个模块化产品家族，而不是单一旗舰机器人。保留的直接来源一致支持四个当前锚点：L7 全尺寸双足人形机器人、M7 上半身人形配置、Q5 轮式人形机器人，以及
              XHAND1/XHAND1 Lite 灵巧手系列。官方网站资料包和 CES 2026 发布让层级异常清晰：L7 承载全尺寸、55-DoF 人形叙事；M7 是上半身部署变体；Q5 是轮式服务和研究平台；XHAND1
              是贯穿技术栈的精密操作模块。这种模块化框架重要，因为它说明 Robot Era 正试图用不同实体形态解决多种近期部署约束，而不是强迫所有工作负载都通过同一种人形形态。已披露规格底线也相当扎实。L7 反复被描述为
              171 centimeters、55 个自由度、20 kilograms 双臂负载；Q5 反复被描述为 44 个自由度、约 165 centimeters。XHAND1 明确营销为 12 个主动
              DoF、全直驱手，M7 则被营销为源自同一架构的上半身平台。主要缺口是范围纪律：保留的当前直接来源不能给出可支撑的公开 XBot-L 产品表面，因此本章不把 XBot-L 视为已验证的在售模块。
