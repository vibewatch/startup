      - number: '3.4'
        title: 定价不透明、工作流集成与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              最重要的承销问题不是 Robot Era 是否有真实竞争者，而是买方决策中哪些部分可能保持粘性。公开定价仍是最大盲区之一。在这组证据里，Unitree 是唯一有清晰公开标价锚点的主要同行；Robot
              Era、UBTECH、Figure、Boston Dynamics 和 Agility
              大多围绕合同、服务或企业部署来描述销售。因此，切换成本不只看标价，更要看客户买的是机器人本体、灵巧手、工作流软件、安全验证、服务支持，还是完整运营方案。Agility 的 Arc 技术栈、Boston
              Dynamics 的 Orbit 和工作流集成、UBTECH 的工厂系统连接，都说明企业竞争者如何试图越过硬件，进入流程锁定。Physical Intelligence 和 Figure
              则从自主性一侧攻击同一问题，比 Robot Era 在公开叙事中更明确地宣传泛化和推理。Robot Era 在垂直整合和物流中心部署上仍有真实护城河主张，但弱点清楚：价格不透明，汽车案例研究比
              UBTECH、Agility 或 Boston Dynamics 薄，公开软件叙事也不如 Figure 的 Helix 或 Physical Intelligence 的 VLA 发表成熟。因此，投资人应把
              Robot Era 视为有竞争力且有前景，但还不能认为它已经被隔离保护。
