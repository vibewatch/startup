  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 最新披露估值 / 状态
      - 收入或订单信号
      - 相关性
      - 局限
    rows:
      - - Robot Era（标的）
        - 2026 年 3 月战略轮估值超过 RMB 10B；Pandaily 称其超过 $1.37B
        - '>RMB 500M 累计订单；订单不是经审计收入'
        - 直接入场价格，也是当前最强市场信号
        - 没有公开经审计收入、毛利率、现金或优先权条款
      - - Figure AI
        - 2024 年 Series B 估值 $2.6B；2025 年融资据报估值 $39B
        - 商业部署叙事很强，但这里保留的公开来源没有给出经审计收入
        - 最能映射顶端具身 AI 稀缺性溢价
        - 美国软件品牌溢价和融资能力让它成为 Robot Era 极为宽松的可比对象
      - - Physical Intelligence
        - 2024 年融资投后估值 $2.4B
        - 保留的公开报道强调模型人才和投资人，而不是已验证收入
        - 可用于映射基础模型可选性溢价
        - 比 Robot Era 更偏软件优先，部署验证也更少
      - - Apptronik
        - 2025 年宣布 $350M Series A；保留来源未披露估值
        - 试点交易和商业化推进已有讨论，但这里没有保留经审计收入
        - 显示严肃的人形机器人公司在规模化前仍需要多少资本
        - 融资金额不等于估值，不应过度解读
      - - Agility Robotics
        - 2024 年获 Schaeffler 少数股权战略投资；估值未披露
        - 商业 RaaS 部署和 100 家工厂的客户意向，比披露估值更重要
        - 衡量企业部署严肃度和商业化压力的好基准
        - 保留来源中没有当前公开估值锚点
      - - Unitree
        - 2026 年上海 IPO 申报，拟募资 42 亿元
        - 2025 年收入 17.08 亿元；2026 年增长下仍有利润压力；官方 G1 入门价从 US$13.5K 起，未含运费
        - 中国披露增长、价格压力和 IPO 准备度的最佳基准
        - 招股书动能本身并不说明长期盈利稳定
      - - UBTECH
        - 2026 年 6 月公开市值约 $7.22B
        - 2025 年收入 RMB 2.001B；全尺寸人形机器人收入 RMB 820.6M；毛利率 37.7%
        - 有披露支撑的中国人形机器人相邻公开可比公司中最佳
        - 公开市值每日波动，且包含一条机器人产品线以外的更广业务组合
      - - Symbotic
        - 2026 年 6 月公开市值约 $25.66B
        - TTM 收入约 $2.51B；估算市销率约 10x
        - 对已规模化物流自动化赢家来说，是有用的公开自动化估值倍数上限
        - 仓储系统比 Robot Era 成熟得多，也更有收入支撑
      - - iRobot
        - 2026 年 6 月公开市值约 $14.84M
        - 2024 年收入 $682M；隐含公开市值 / 2024 年销售额接近零
        - 提醒下行情形：增长和利润率断裂后，公开机器人股权会怎样坍塌
        - 消费清洁机器人不是直接人形机器人可比对象，应作为压力案例，而不是估值同业
      - - Fourier Intelligence
        - 2025 年 Series E 融资近 RMB 800M；这里保留的公开来源未披露估值
        - 融资轮确认中国机器人公司需要大量资本，但这里没有保留经审计收入
        - 可用于观察中国私募资本深度
        - 在保留的公开证据中，它不是干净的估值或收入倍数可比对象
    notes: 表内有意混合私募估值、融资轮、公开市值和已披露收入 / 订单信号。凡是估值计算需要依赖订单或未披露收入的行，均明确写出这一局限。
    enumerationScope:
