        - 用于拣选、分拣、导入和搬运的人形硬件、具身 AI 软件、末端执行器、集成和部署支持
        - 通用仓库软件、没有人形操作能力的 AMR、机器人替代范围之外的临时人工支出
        - 仓库运营方、3PL、快递公司或物流中心自动化所有者
        - 近期相关性最高，因为这是 Robot Era 最清晰的公开部署切口
      - - 面向制造业的人形机器人
        - 用于零部件拣选、装配、检测和其他结构化工业任务的工厂人形机器人
        - 广义工业机器人市场、机床，以及不需要人形形态因素的非人形固定自动化
        - 工厂运营、工程和质量负责人
        - 相关性高，因为中国工厂密度和政策支持提高部署概率
      - - 商业服务人形机器人
        - 零售、前台、导览和类似面向客户的具身 AI 工作流
        - 消费电子小工具、娱乐机器人和通用软件助手
        - 门店经营者、商场管理方、医院或服务场所运营方
        - 相关，但不如物流或制造得到验证
      - - 中国具身 AI 场景市场
        - 政策支持试点、标准工作、工业部署支持和企业商业化项目
        - 中国全部 AI 市场和全部机器人品类
        - 市政府、产业园区和企业采用方
        - 最好的公开 SAM 地理范围，因为政策和应用集中在那里
      - - 全球商用人形机器人市场
        - 跨企业垂直行业商业部署的人形平台收入
        - 研究原型、演示和愿景型家用机器人叙事
        - 全球企业买家和集成商
        - 有用的 TAM 锚点，但过宽，不能作为 Robot Era 近期可服务市场
      - - 现状替代品
        - 固定工业机器人、AMR、协作机器人、工作流重设计和人力
        - N/A
        - 与上述相同的买家
        - 这些替代品争夺同一预算；如果 ROI 更弱，会拖慢人形机器人转化
