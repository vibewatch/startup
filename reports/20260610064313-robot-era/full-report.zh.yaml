  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 有证据支撑的理由
      - 缓释 / 尽调问题
    rows:
      - - 垂直整合与自研部件
        - Unitree 价格压缩和 AgiBot 规模
        - 高
        - Robot Era 声称 >95% 自研确有价值，但 Unitree 和 AgiBot 仍可能靠销量和更低入门价压缩市场预期。
        - 要求 Robot Era 提供 BOM、毛利率桥接，并证明垂直整合带来成本或可靠性优势，而不只是增加复杂度
      - - 物流 PMF 和部署牵引
        - Agility 付费物流部署和 UBTECH 工厂扩张
        - 高
        - Robot Era 拥有强物流中心证明，但 Agility 已宣传付费 GXO 部署，UBTECH 也在扩大工业交付。
        - 要求 Robot Era 提供与 Agility、UBTECH 及仓库工作流中固定功能替代方案对比的赢单 / 输单数据
      - - 灵巧手差异化
        - Fourier、Figure 和 Physical Intelligence 的软件或手部栈进展
        - 中
        - Robot Era 的 XHAND1 可信，但 Fourier 公开披露更丰富的手部规格，Figure 或 PI 的自主或操作叙事更强。
        - 验证抓取成功率、循环寿命，以及相对具名同业的基准化操作表现
      - - 中国融资势头
        - Galbot 和 AgiBot 的融资或规模叙事
        - 中
        - 即便底层经济性不同，Galbot 的融资头条和 AgiBot 的 10,000 台机器人主张也可能盖过 Robot Era。
        - 区分品牌势能与已实现部署、客户留存和交付质量
      - - 软件与自主栈
        - Figure Helix 和 PI 泛化研究
        - 高
        - Robot Era 提到 ERA-42，但公开技术深度弱于 Figure 的 Helix 和 PI 的 VLA 论文。
        - 要求提供技术基准、泛化测试，以及证明自主能力超出结构化演示的客户证据
      - - 人形形态战略
        - AgileX 式局部自动化，或更便宜的移动操作替代方案
        - 中
        - 不是每个买家都需要完整人形机身；一些任务用移动底盘、机械臂或数据套件工作流就可能解决。
        - 梳理 Robot Era 哪些场景必须靠人形形态取胜，哪些场景低成本替代方案也能满足预算
