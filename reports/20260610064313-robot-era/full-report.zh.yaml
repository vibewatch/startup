  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Robot Era 把顶尖学术机器人背景、模块化具身 AI 硬件、企业部署和激进融资连在一起，但板块成熟度仍是外部约束。
