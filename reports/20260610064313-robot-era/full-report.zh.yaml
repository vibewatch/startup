      - number: '5.5'
        title: 信任、质量控制与主要技术限制
        blocks:
          - type: paragraph
            body: >-
              Robot Era 的公开产品技术叙事强在能力框架，弱在质量披露。官网有真实隐私和采购界面，保留来源也清楚显示，可下载材料、API、遥操作路径和 SDK
              都存在。但同一批保留来源没有提供企业买方和投资人在承销车队规模前会期待的更深控制：保留的当前公开来源没有给出正式安全认证、防护等级、现场故障率、维护间隔、质保条款、网络安全架构，或 ERA-42
              的经审计基准包。独立技术数据库明确把 L7 部分字段留空，外部行业分析师也反复回到同一批关口：先从结构化环境起步，灵巧性仍难，电池续航仍短，狭窄高价值流程之外经济性仍不清楚。KrASIA
              的反向行业文章尤其有用，因为它指出部分汽车部署可能仍是战略绑定，而不是规模化销售。正确尽调解读应保持平衡。Robot Era 似乎拥有比纯炒作项目更可信的具身 AI
              技术栈，但公司仍需要证明其技术主张能在规模化安全、可靠性和经济性审查中站住。
