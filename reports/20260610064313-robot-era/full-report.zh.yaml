  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、积压订单信号，以及为什么订单标题不等于收入
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 Robot Era 有真实商业引擎，但不支持一个已确认收入模型。公司关联与独立来源持续指向：订单超过 RMB 500 million，单个物流订单超过 RMB 50 million，在 10
              多个物流中心部署，2026 年 Q2 启动千台级交付，2025 年出货 200 台人形机器人，100 多个订单推进中，2025 年出货超过 1,000 台
              XHAND。这些是有意义的商业化标记，尤其是复购订单和大型物流合同出现在同一组信源中。但它们仍是预订、出货或部署信号，不是收入确认披露。即便最接近结构数据的信息，也仍是公司口径：Yicai
              报道海外业务占订单数字的一半，KrASIA 则称海外收入约占总收入一半，但没有披露分母。这在方向上正面，却不足以搭出干净的收入桥。投资人因此应把 Robot Era
              视为一家有可信积压订单和出货牵引力的公司；在管理层披露分业务已入账收入、积压订单转化和客户集中度之前，收入质量仍未验证。
