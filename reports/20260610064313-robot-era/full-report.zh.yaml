      - number: '1.3'
        title: 融资节奏、估值信号与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              资料包里最清晰的公司层面信号是融资速度。KrASIA 报道，2025 年 7 月 Series A 近 RMB500 million，由 CDH VGC 和 Haier 领投；2025 年 11 月 A+ 轮近
              RMB1 billion，由 Geely 领投、BAIC 参与。Yicai 补充称，当时已披露资本达到 CNY1.8 billion，订单已超过 CNY500 million。2026
              年记录进一步加速：PRNASIA 和 Humanoids Daily 称，2026 年 3 月一轮 RMB1 billion 战略融资把估值推至 RMB10 billion 以上；另一个 2026 年 4-5
              月信源群则报道，SF Group 领投、HSG 和 IDG Capital 参与的新一轮融资超过 $200
              million。这条序列显示，汽车、物流和头部创投都给了强力产业与投资支持，但也带来对账问题。公开资料没有充分解释 2026 年 3 月战略轮、2026 年 5
              月轮次以及外部独角兽榜单标记，如何放进一条清晰的稀释时间线。结论是：获得资本和股东方质量为正面信号，但融资结构仍不完整。
