companyProfile:
  summary: >-
    Robot Era is a Beijing-based embodied-intelligence and humanoid-robotics
    company founded in August 2023 by Tsinghua professor Jianyu Chen. Public
    materials support a modular product stack spanning the L7 full-size
    humanoid, the M7 upper-body platform, the Q5 wheeled humanoid, and the
    XHAND dexterous-hand line, with the clearest near-term commercialization in
    structured logistics and industrial workflows. The supplied source pack also
    shows unusually fast financing velocity, a March 2026 valuation marker above
    RMB 10 billion, more than RMB 500 million of cumulative orders, and more
    than 10 logistics-center deployments with international demand signals.
    The core diligence limitation is not lack of momentum but lack of financial
    transparency: public evidence still does not cleanly disclose recognized
    revenue, gross margin, cash runway, customer concentration, or final round
    economics.
