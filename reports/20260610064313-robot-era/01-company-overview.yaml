company:
  name: Robot Era
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Robot Era is a Beijing-based embodied-intelligence and humanoid-robotics company founded in August 2023 by Tsinghua professor Jianyu Chen. The supplied source pack supports unusually fast financing from a July 2025 Series A through multiple 2025-2026 rounds, a public valuation marker above RMB10 billion, and commercialization signals including more than RMB500 million of cumulative orders, 50% overseas order mix, 10-plus logistics-center deployments, and planned thousand-unit deliveries in Q2 2026. The chapter’s main diligence caveats are unresolved round sequencing across 2026 announcements, limited public disclosure on revenue and headcount, and sector-level commercialization risk highlighted by adverse market sources.
sections:
- id: identity-and-positioning
  title: Identity, headquarters, and company framing
  body: >-
    Robot Era presents itself as a humanoid-robotics and embodied-intelligence company rooted in Beijing’s Tsinghua ecosystem rather than as a narrow component supplier. The strongest operating-base evidence is the company’s official site and application bundle, which surface a Tsinghua Science Park address, a marketing email, and a public phone number. That matters because it anchors the company to a real commercial footprint rather than a purely academic project. The independent founder interview pack adds the formation date: KrASIA says Robot Era was founded in August 2023, which aligns with the current narrative of a fast-scaling young company that reached large funding milestones unusually quickly. Just as important, the narrative is not “hardware only.” Chen describes a combined brain-and-body strategy with modular, Lego-like hardware and an ERA-42 VLA software layer, while the CES 2026 materials frame the company around a broader embodied-intelligence product family. Taken together, the reviewed sources support an identity as a Beijing-based commercial robotics company with research origins, modular platform ambitions, and enough public operating detail to distinguish it from a stealth lab project.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO007
  - CO008
  - CO011
  - CO036
  tableRefs:
  - TO001
- id: founder-and-governance
  title: Founder profile, leadership visibility, and governance opacity
  body: >-
    Public leadership visibility in the provided pack is dominated by Jianyu Chen. Independent profiles identify him as Robot Era’s founder, while Tsinghua’s official IIIS page establishes the technical pedigree behind that role: assistant professor status, an ISR Lab affiliation, a Tsinghua undergraduate degree, and a 2020 UC Berkeley PhD under Masayoshi Tomizuka. That background is a meaningful founder-market-fit signal because it ties the company to elite controls, robotics, and embodied-AI research rather than to a purely financial promotion cycle. The flip side is that the public record remains thin beyond Chen. The Wire China adds age context and repeats a major customer claim, but the supplied source pack does not surface a fuller executive bench, current board roster, or a detailed governance map. For diligence, that means the chapter can strongly underwrite founder credibility, but not yet organizational depth or decision-right distribution. Key-person concentration therefore appears high until a fuller executive and governance package is available privately.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO009
  - CO010
  - CO028
  tableRefs:
  - TO002
- id: capital-and-stakeholders
  title: Financing cadence, valuation signals, and stakeholder map
  body: >-
    The clearest company-level signal in the pack is financing velocity. KrASIA reports a July 2025 Series A of nearly RMB500 million led by CDH VGC and Haier, while the November 2025 A+ round was nearly RMB1 billion with Geely leading and BAIC participating. Yicai adds that disclosed capital had reached CNY1.8 billion by that point and that orders already exceeded CNY500 million. The 2026 record then accelerates further: PRNASIA and Humanoids Daily say a March 2026 strategic round of RMB1 billion pushed valuation above RMB10 billion, and a separate April-May 2026 source cluster reported a new round of more than $200 million led by SF Group with HSG and IDG Capital. This sequence demonstrates strong industrial and investor support from automakers, logistics players, and top-tier venture capital, but it also creates a reconciliation problem. Public materials do not fully explain how the March 2026 strategic round, the May 2026 round, and external unicorn-board markers fit together in one clean dilution timeline. The takeaway is positive on access to capital and stakeholder quality, but still incomplete on financing structure.
  claimRefs:
  - CO012
  - CO013
  - CO014
