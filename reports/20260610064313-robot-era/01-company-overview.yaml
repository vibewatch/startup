  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: financing-cadence
    missingEvidence: Authoritative financing documents that reconcile the March 2026 RMB1 billion strategic round with the later-reported >$200 million round and external unicorn-board funding figures.
    whyItMatters: Public valuation and dilution history cannot be cleanly underwritten until the relationship among these 2026 announcements is clear.
    diligencePath: Request the 2025-2026 financing chronology, round-close memos, amended charter documents, and a cumulative cap-table bridge from management or counsel.
    relatedQuestionRefs:
    - QO012
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full current executive roster, board roster, ownership percentages, and decision-right allocation beyond founder Jianyu Chen.
    whyItMatters: Key-person risk, succession depth, and investor control cannot be assessed from the public record alone.
    diligencePath: Request the current org chart, board composition, cap table, and investor-rights summary.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: Current revenue, gross margin, backlog conversion, headcount, and unit-economics metrics supporting the commercialization narrative.
    whyItMatters: High valuation and order figures are difficult to underwrite without evidence that orders convert into profitable repeat revenue.
    diligencePath: Request the latest board deck, monthly KPI pack, customer pipeline conversion data, and audited or management financial statements.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: enumeration-incomplete
    severity: material
    topic: customers
    missingEvidence: A complete named customer roster and contract economics behind the claim of serving 9 of the world’s 10 largest tech firms.
    whyItMatters: Customer concentration, referenceability, and deployment quality are central to evaluating whether public traction claims are durable.
    diligencePath: Request top-customer list, deployment status by account, renewal data, and revenue concentration metrics.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO003
