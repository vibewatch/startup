- id: products-and-commercialization
  title: Product stack, vertical integration, and commercialization posture
  body: >-
    By CES 2026, Robot Era was presenting not one robot but a family: the L7 humanoid, the Q5 platform, and the XHAND1 dexterous hand. The best-supported public technical details show an L7 at 171 centimeters with 55 degrees of freedom, roughly 70 kilograms of weight, and 20 kilograms of dual-arm payload, while XHAND1 is described with 12 degrees of freedom, 80 newtons of grip force, and 25 kilograms of lift. Q5 appears as a lighter 44-DoF companion model in the CES coverage. These specifications matter less as vanity metrics than as evidence that Robot Era is trying to commercialize a reusable platform spanning full humanoids and manipulators. The 2026 financing releases reinforce that interpretation by claiming more than 95% in-house component development, 1,000-plus XHAND units in 2025, and thousand-unit deliveries in Q2 2026. Combined with Chen’s “brain plus body” framing, the reviewed evidence supports a commercialization thesis built on modular hardware, software integration, and unusually deep vertical control for a very young company.
  claimRefs:
