- calloutType: strength
  title: Industrial backers show Robot Era is attracting more than speculative AI capital
  body: >-
    The investor set spans automakers, logistics groups, and venture firms rather than a purely thematic AI syndicate. That matters because Geely, BAIC, and SF Group imply some level of industrial validation alongside financing momentum.
  claimRefs:
  - CO013
  - CO019
  - CO020
- calloutType: risk
  title: Public traction claims are strong, but the market may still be ahead of durable adoption
  body: >-
    Orders, overseas mix, logistics-center deployments, and high valuation markers are encouraging, yet adverse market commentary still flags weak autonomy, low buyer satisfaction, battery constraints, and a likely shakeout. Later diligence should test whether Robot Era’s deployments are repeatable and profitable.
  claimRefs:
