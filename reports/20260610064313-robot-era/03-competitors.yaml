- id: global-rivals-and-software-benchmarks
  title: Global rivals and software-first players raise the autonomy and enterprise bar
  body: 'The global field matters because it highlights where Robot Era’s public record is still thinner. Figure
    combines the cleanest software branding in the pack with meaningful hardware disclosure: Figure 03 now carries
    a public 20 kg payload figure, Helix is positioned as an onboard VLA for logistics and home tasks, BMW is a
    named manufacturing counterparty, and the company’s funding scale is now measured in tens of billions of valuation
    rather than in ordinary venture rounds. Physical Intelligence is not a direct hardware peer, but it matters
    strategically because its public writing explains why most robots still succeed first in tightly controlled
    environments and why open-world generalization is a separate competitive frontier. That is exactly the gap buyers
    will increasingly use to compare Robot Era against better-publicized autonomy stacks. 1X is a weaker near-term
    factory rival because it is still home-first and far from scaled commercialization, but it competes for mindshare
    around household humanoids. Boston Dynamics remains the most technically intimidating benchmark on disclosed
    payload, runtime, and enterprise integrations, while Agility has perhaps the clearest operational story that
    enterprise buyers actually pay for humanoids through repeatable RaaS-style logistics and automotive deployments.
    Those peers do not invalidate Robot Era’s China wedge, but they do raise the standard for what a globally durable
    moat would need to look like.'
