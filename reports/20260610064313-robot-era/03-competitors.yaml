- id: chinese-direct-rivals
  title: Chinese direct rivals pressure Robot Era on price, scale, and disclosure
  body: 'The nearest competitive pressure is still Chinese. AgiBot looks broadest on product breadth and ecosystem
    ambition: its public materials now span humanoids, single-arm mobile manipulation, dexterous hands, quadrupeds,
    data collection systems, and a growing AIMA development stack. Unitree is the most disruptive public price signal
    in the pack. A $13.5K G1 is not an apples-to-apples replacement for Robot Era’s L7, but it establishes a market
    expectation that many embodied-AI vendors still avoid with opaque pricing. Unitree’s IPO disclosures also make
    it unusually visible on revenue growth, shipment mix, and deliberate ASP compression. Fourier matters less on
    unit scale than on dexterity and developer friendliness: the GR-2’s 12-DoF hands, tactile sensors, and explicit
    SDK support imply a sharper research and manipulation benchmark than many peers publish. UBTECH is different
    again. Its listed-company filing and Walker S2 mass-delivery language provide the strongest public evidence
    in China that humanoid revenue has already become a real line item tied to factory use. Galbot adds a final
    Chinese threat: even when product detail is thinner, the combination of giant rounds, mobile-manipulator framing,
    and automotive logos can shape buyer and investor perception quickly. Against that field, Robot Era still looks
    strongest in structured logistics and vertical hardware control, but it is not the category’s only fast-moving
    Chinese contender.'
