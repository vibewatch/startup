callouts:
- calloutType: strength
  title: Robot Era has a real China logistics wedge
  body: Robot Era is not just another demo-stage humanoid startup in the retained record. The combination of 95%+
    in-house component claims, >10 logistics-center deployments, and a product family spanning L7 and XHAND1 gives
    it a concrete operating wedge that several better-funded rivals still describe more abstractly.
  claimRefs:
  - CP001
  - CP002
  - CP004
- calloutType: risk
  title: Price and disclosure pressure come from different rivals
  body: Unitree threatens Robot Era on public price and volume, while UBTECH, Agility, Boston Dynamics, and Figure
    threaten it on public deployment proof, factory integrations, or software visibility. Robot Era therefore does
    not face one monolithic rival; it faces several competitors each stronger in one public dimension.
  claimRefs:
  - CP014
  - CP021
  - CP032
  - CP042
  - CP046
  - CP049
- calloutType: insight
  title: Software depth may become the next competitive test
  body: Figure and Physical Intelligence now market autonomy and generalization more explicitly than most Chinese
    hardware peers. If buyer expectations shift from demo performance toward open-world reasoning and workflow adaptation,
    Robot Era will need stronger public software evidence to keep pace with the narrative leaders.
  claimRefs:
  - CP028
  - CP033
  - CP034
  - CP035
  - CP049
