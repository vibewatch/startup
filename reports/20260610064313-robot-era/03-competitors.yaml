  - - Physical Intelligence
    - Autonomy-stack adjacent competitor
    - High-profile backer roster; rapid VLA research cadence
    - Robot OEMs and autonomy partners across many embodiments
    - Generalization and software depth rather than robot body sales
    - No direct hardware or deployment economics disclosed
  - - 1X
    - Home-first humanoid adjacent peer
    - Early-access NEO with $200 deposit; limited in-home testing
    - Household assistance and consumer/home robotics
    - Clear home positioning and safety-forward design
    - Still far from scaled commercialization
  - - Boston Dynamics
    - Global industrial incumbent benchmark
    - Named Hyundai commercialization path and enterprise Atlas spec sheet
    - Automotive, material handling, enterprise automation
    - Strongest disclosed payload and systems integration in this set
    - No clear public price or large-volume delivery numbers here
  - - Agility Robotics
    - Global logistics and automotive deployment peer
    - Paid GXO and Toyota RaaS deals plus Amazon or Schaeffler references
    - Warehousing, logistics, manufacturing
    - Real paid deployment evidence and workflow integration stack
    - Public volumes are still small and list price is not disclosed
  - - AgileX
    - Adjacent mobile manipulation substitute
    - Official site focuses on chassis, arms, ALOHA kits, and data collection
    - Research, education, mobile robotics, partial automation
    - Cheaper or simpler substitute for some embodied-intelligence tasks
    - Not a direct full-size humanoid benchmark
