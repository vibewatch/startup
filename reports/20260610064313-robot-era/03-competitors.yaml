- id: TP003
  title: Pricing / funding / commercialization comparison
  columns:
  - Company / model
  - Public price or contract signal
  - Funding / financial disclosure
  - Commercial deployment signal
  - Implication
  rows:
  - - Robot Era
    - No public list price in fetched sources
    - '> $200M latest round; private capital structure'
    - '>10 logistics centers; thousand-unit deliveries initiated in Q2 2026; 200 robots shipped in 2025'
    - Strong commercialization narrative, but investors still need realized ASP and repeat-order data
  - - AgiBot
    - No public list price in fetched sources
    - 1 billion yuan of 2025 revenue reported; 10,000th robot rollout claim
    - 2,000+ Expedition shipments; Q2 2026 capacity sold out
    - Scale and speed may compress category expectations even without transparent pricing
  - - Unitree G1
    - US$13.5K list price for G1; EDU upsell for development
    - IPO path with 1.71 billion yuan 2025 revenue and disclosed ASP compression
    - Shipment leadership claim and Nvidia ecosystem signal
    - Public price anchor is the clearest commoditization threat in China
  - - UBTECH Walker S2
    - No public list price; industrial solution sale
    - Listed-company filing with RMB820.6M humanoid revenue
    - Several-hundred-unit deliveries; 5,000 annual capacity target in 2026
    - Disclosure quality and industrial credibility exceed most private peers
  - - Galbot
    - No public list price; order-led enterprise sales
    - $800M cumulative funding; $3B valuation; state-backed round in 2026
    - Thousands-of-unit order claims and mobile-manipulator rollout story
    - Capital strength may matter more than price transparency in buyer perception
  - - Figure 03
    - No public list price; enterprise or pilot contracts
    - '> $1B Series C at $39B valuation'
    - BMW plant deployment and Helix logistics pitch
    - Funding scale supports software and fleet build-out even before public economics are clear
  - - 1X NEO
    - $200 deposit and early-access home robot funnel
    - No major financial disclosure in retained sources
    - Limited in-home testing; explicitly far from scale
    - Competes more on future consumer narrative than current enterprise procurement
  - - Agility Digit
    - RaaS / contract model rather than public sticker price
    - Private-company economics remain undisclosed
    - Formal paid GXO and Toyota deployments plus Amazon or Schaeffler references
    - Service model may lower adoption friction relative to capex-heavy buyers
  - - Boston Dynamics Atlas
    - No public list price; enterprise product sale
    - No public Atlas-specific revenue line here
    - Hyundai commercialization path and Georgia plant proof
    - Robot Era faces a tougher benchmark on enterprise integration than on sticker price
  notes: The most informative comparison is not just sticker price. It is whether the rival discloses list price
    at all, whether financing or filings validate scale, and whether the company has crossed from pilot rhetoric
    into paid or repeated deployments.
