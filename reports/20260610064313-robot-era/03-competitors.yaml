  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: robotera-realized-pricing
    missingEvidence: Robot Era's realized robot ASPs, service pricing, warranty terms, and renewal economics versus
      rivals such as Unitree or Agility.
    whyItMatters: Public price opacity makes it hard to judge whether Robot Era's vertical integration creates margin
      or merely hides commercialization friction.
    diligencePath: Request live quotes, signed customer contracts, service attach rates, warranty terms, and cohort
      data for repeat orders by vertical.
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: win-loss-versus-industrial-peers
    missingEvidence: Comparable win-loss data showing Robot Era outcomes versus UBTECH, Agility, fixed automation,
      and non-humanoid substitutes in logistics or manufacturing.
    whyItMatters: Without win-loss evidence, it is difficult to know whether Robot Era's deployments reflect a defensible
      moat or just an early-market pilot window.
    diligencePath: Request named customer pipeline stages, lost-deal reasons, integrator feedback, and benchmark
      productivity metrics by use case.
    relatedTableRefs:
    - TP001
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: full-global-humanoid-universe
    missingEvidence: An exhaustive current census of every global humanoid startup and robotics lab beyond the weighted
      set included here.
    whyItMatters: This chapter intentionally weights the peers most relevant to Robot Era rather than every name
      in the broader humanoid landscape.
    diligencePath: Expand with market databases and dated source packs if a broader ecosystem map becomes necessary
      for strategy work.
    relatedTableRefs:
    - TP001
    relatedQuestionRefs:
    - QP013
