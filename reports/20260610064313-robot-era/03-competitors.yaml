- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Vertical integration and in-house components
    - Unitree price compression and AgiBot scale
    - High
    - Robot Era’s >95% in-house claim is real, but Unitree and AgiBot may still compress market expectations through
      volume and cheaper entry points.
    - Request Robot Era BOM, gross-margin bridge, and proof that vertical integration yields cost or reliability
      advantage rather than just complexity
  - - Logistics PMF and deployment traction
    - Agility paid logistics deployments and UBTECH factory expansion
    - High
    - Robot Era has strong logistics-center proof, but Agility already advertises paid GXO deployments and UBTECH
      is scaling industrial delivery.
    - Ask for Robot Era win-loss data versus Agility, UBTECH, and fixed-function substitutes in warehouse workflows
  - - Dexterous hand differentiation
    - Fourier, Figure, and Physical Intelligence software or hand-stack advances
    - Medium
    - Robot Era’s XHAND1 is credible, yet Fourier publicly discloses richer hand specs and Figure or PI market stronger
      autonomy or manipulation narratives.
    - Validate grasp success, cycle life, and benchmarked manipulation performance against named peers
  - - China financing momentum
    - Galbot and AgiBot funding or scale narratives
    - Medium
    - Galbot’s funding headlines and AgiBot’s 10,000-robot claim can overshadow Robot Era even if underlying economics
      differ.
    - Separate branding momentum from realized deployments, customer retention, and delivery quality
  - - Software and autonomy stack
    - Figure Helix and PI generalization research
    - High
    - Robot Era mentions ERA-42, but the public technical depth is thinner than Figure’s Helix and PI’s VLA publications.
    - Request technical benchmarks, generalization tests, and customer evidence showing autonomy beyond structured
      demos
  - - Human-form-factor strategy
    - AgileX-style partial automation or cheaper mobile-manipulation substitutes
    - Medium
    - Not every buyer needs a full humanoid body; some tasks may be solved with a mobile base, arm, or data-kit
      workflow.
    - Map where Robot Era wins only with a humanoid form factor and where lower-cost substitutes can satisfy the
      budget instead
  notes: Severity is a qualitative underwriting judgment based on the retained sources as of 2026-06-10, not a forecast
    of market share.
