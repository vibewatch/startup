company:
  name: Robot Era
chapter:
  number: 6
  title: Customers
  summary: Robot Era has stronger customer proof than a typical humanoid startup because its public pack consistently points to more than 10 live logistics centers, Q2 2026 thousand-unit deliveries, and a named SF-linked deployment path; but the evidence is still much stronger on deployment breadth than on durable revenue quality. The clearest proof sits in logistics with SF Group or SF Express and China Post, while Geely, Haier, Renault, TCL, Lenovo, and ByteDance broaden the surface area but remain uneven in public detail. The main diligence risk is that named logos, developer-lab buyers, and pilot-to-scale claims are not yet matched by audited customer counts, retention metrics, or concentration disclosure.
sections:
- id: segmenting-the-customer-surface
  title: 'Customer map: logistics is the lead wedge, but the public logo set spans several buyer types'
  body: 'Robot Era’s public customer evidence should not be read as one flat list of equivalent production customers. The strongest buyer class is logistics operators, where Robotera repeatedly describes parcel-sorting, small-parcel induction, and cross-border inspection workflows with SF-linked entities and China Post. A second bucket is industrial manufacturing: Geely is the clearest named example, and public sources also place Renault, TCL, and Lenovo in the broader industrial-partner set. A third bucket is commercial service or retail operation, where Haier is the most specific proof because independent coverage says co-developed robots have entered retail stores. A fourth bucket is the developer ecosystem, where ByteDance’s robotics lab and Skild AI show platform or research adoption rather than factory or warehouse recurring revenue. Finally, the company claims a much broader international top-tech-customer footprint, but most of those names remain undisclosed. The right underwriting
    lens is therefore tiered. Logistics customers show the best production intent. Industrial logos outside logistics are helpful but often under-documented. Developer-lab buyers are strategically validating but should not be counted as the same quality of proof as a scaled warehouse or factory deployment.'
