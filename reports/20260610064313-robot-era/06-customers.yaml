  evidenceGaps:
  - type: missing-source
    severity: material
    topic: customer-side-proof
    missingEvidence: Customer-authored case studies or procurement disclosures from SF Express, China Post, Geely, Renault, TCL, Haier, or Lenovo that name Robotera directly and quantify operational results.
    whyItMatters: The chapter currently relies heavily on Robotera-side and media-side descriptions, which are useful but weaker than customer-authored proof for production durability.
    diligencePath: Ask management for customer references, signed pilot-to-production expansions, or customer press releases that can be shared under NDA.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU013
    - QU014
    - QU015
    - QU016
    - QU017
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer count, NRR, GRR, churn, contract duration, and repeat-order share by segment.
    whyItMatters: Without retention metrics, the current logo set may exaggerate commercial durability and reduce confidence in land-and-expand assumptions.
    diligencePath: Request cohort retention tables and top-10-customer revenue share from management or the data room.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU022
    - QU026
    relatedTableRefs:
    - TU004
    - TU005
  - type: conflicting-data
    severity: material
    topic: overseas-mix
    missingEvidence: A clean bridge showing whether the cited 50 percent overseas figure refers to revenue, order value, shipped units, or a subset of customers.
    whyItMatters: The chapter treats international demand as real, but the denominator matters for sizing concentration, margin quality, and global go-to-market readiness.
    diligencePath: Ask the company to reconcile international revenue, order book, and shipped-unit mix in the same reporting period.
    relatedQuestionRefs:
    - QU010
    - QU011
    - QU012
    relatedTableRefs:
    - TU001
    - TU002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share and how much of the disclosed logistics scale depends on SF Group or one unnamed large order.
    whyItMatters: If one logistics customer dominates revenue, the apparent breadth of logos would not equal diversified customer durability.
    diligencePath: Request customer concentration disclosure and renewal schedules for the largest three accounts.
    relatedQuestionRefs:
    - QU022
    - QU023
    - QU026
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: developer-vs-production-mix
    missingEvidence: A split between industrial revenue, developer-lab revenue, and research hardware sales.
    whyItMatters: Top-tech-company and lab adoption are strategically useful, but they should not be counted as the same kind of recurring logistics or factory customer.
    diligencePath: Request segment revenue and gross margin by logistics, industrial manufacturing, commercial service, and developer or research channels.
