- id: partner-by-partner-proof-quality
  title: 'Named proof by account: strong for SF-linked logistics, moderate for Geely and Haier, thin for several other logos'
  body: 'A customer-by-customer read shows wide variance in proof quality. SF-linked logistics is the highest-conviction row because the pack combines a named customer path, customs deployment language, large disclosed order size, and thousand-unit-delivery claims. China Post also appears repeatedly in the logistics-center narrative, but public proof remains mostly company-side and media-side rather than China Post-side, so that row is real yet still incomplete. Geely is the next-strongest named logo because it is repeatedly identified as both a strategic backer and an industrial partner, and sources describe relevant manufacturing scenarios. Haier is more specific than most of the remaining industrial names because independent coverage says co-developed robots are already in retail stores. Renault, TCL, and Lenovo matter because they widen the logo set across automotive, consumer electronics, and enterprise technology, but each still lacks a site-specific public case study. ByteDance and
    Skild AI add a different form of proof: they show that Robotera is selling or placing systems into advanced robotics-development environments, yet that should be counted as developer or lab adoption rather than as the same proof quality as a scaled logistics contract.'
