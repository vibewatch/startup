- id: durability-concentration-and-disclosure-risk
  title: 'Durability: the logo set is promising, but public disclosure still stops well short of auditable customer economics'
  body: 'The biggest judgment call in this chapter is not whether Robot Era has real customers; it is whether the disclosed evidence is strong enough to infer durable, diversified production revenue. On that question the answer is still no. The company does provide unusually concrete deployment claims for an early humanoid business, especially in logistics, and even some headline repeat-order language. But the pack still lacks customer count, contract duration, NRR, GRR, churn, renewal rates, and top-customer share. It also does not cleanly split industrial production revenue from developer-lab sales or research-platform adoption. Adverse sector sources make this distinction important. IEEE Spectrum, McKinsey, Robotics & Automation News, and Forbes all caution that humanoid-robotics logos, pilots, and showcase videos can run ahead of operational economics. Those sources do not disprove Robot Era’s deployments, but they do challenge any investor temptation to turn a strong logo page into
    a durable revenue conclusion. The practical synthesis is constructive but disciplined: Robot Era appears to have one of the better public customer-proof packs in humanoids, yet the disclosed evidence is still strongest on deployment activity and weakest on concentration, retention, and audited production revenue quality.'
