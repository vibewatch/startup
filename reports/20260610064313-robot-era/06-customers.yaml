- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Why it matters
  - Current evidence
  - Impact if true
  - Diligence path
  rows:
  - - SF-linked logistics concentration
    - The clearest production path may also be the most concentrated revenue stream
    - Named customs deployment, large disclosed order, and logistics-center scale
    - Could create strong early growth but high customer concentration risk
    - Request top-customer share and contract renewal cadence
  - - China Post proof gap
    - A major logo appears in the pack but still lacks customer-authored confirmation
    - Robotera-side and media-side references dominate
    - Could leave the best breadth narrative less durable than it looks
    - Request customer-side case study or procurement record
  - - International mix ambiguity
    - Overseas demand looks real, but the 50% figure is framed as revenue in some sources and orders in others
    - KrASIA, Yicai, and Humanoids Daily use different wording
    - Could distort valuation of global traction and quality of revenue
    - Reconcile orders, revenue, and shipped units for the same period
  - - Industrial-logo overread
    - Geely, Renault, TCL, and Lenovo widen the logo set, but site-level proof is sparse
    - Names are repeated without many operational KPIs
    - Could make the customer base look more mature than it is
    - Request customer-by-customer deployment maps and KPIs
  - - Developer-lab mix
    - ByteDance and top-tech-customer claims are strategically useful but not equivalent to warehouse recurring revenue
    - R&D adoption is real but economically different
    - Could inflate perceived durability if mixed into one customer count
    - Request revenue split for lab, developer, and industrial accounts
  - - Sector hype risk
    - Humanoid sector commentary warns that logos and demos can outrun commercial value
    - IEEE, McKinsey, Forbes, and CB Insights-linked coverage are skeptical
    - Could compress multiples or expose weak deployments if economics disappoint
    - Anchor diligence on uptime, ROI, and renewal evidence rather than logo count
  notes: The risk table treats concentration and disclosure problems as separate issues so a rich logo set does not get mistaken for diversified, audited customer quality.
