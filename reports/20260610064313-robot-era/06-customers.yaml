- id: logistics-scale-and-international-demand
  title: 'Scale proof: logistics is the clearest pilot-to-production path, and overseas demand appears real but still loosely defined'
  body: 'The chapter’s best adoption evidence sits in logistics rather than in general brand-name customer lists. Robotera’s own March and May 2026 releases say it is working across more than 10 logistics centers and began thousand-unit deliveries in the second quarter of 2026. Independent coverage largely repeats the same pattern rather than contradicting it: Humanoids Daily, RoboticsTomorrow, Automated Warehouse, and Mike Kalil all describe ongoing logistics-center deployment with China Post and SF-linked entities, and they attach operational details like 24/7 operation or roughly 85% of human-level efficiency. The product-side narrative is also coherent. At CeMAT ASIA 2025, the company positioned the L7 as a solution for the warehouse flexible-picking gap, with WMS integration, barcode scanning, and exception routing, which is much closer to a real operations module than to a generic dance demo. International demand also looks meaningful. Public sources say overseas business is about
    half of revenue or order value and name North America, Europe, the Middle East, Japan, and South Korea. Still, the exact denominator is not consistently disclosed, so the right read is that international demand is credible but not yet cleanly audited.'
