  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue
    missingEvidence: Board-approved recognized revenue by quarter, product, and geography plus backlog conversion from orders to accepted revenue.
    whyItMatters: Orders and shipments can support excitement without proving a revenue base that justifies the current valuation.
    diligencePath: Request audited management accounts, revenue-recognition policy, and customer-level backlog conversion schedules.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Cash balance, monthly burn, capex needs, and downside runway after the March 2026 round.
    whyItMatters: Capital intensity and dilution risk are central to whether the headline valuation is investable or just temporarily financeable.
    diligencePath: Review treasury schedules, board budgets, debt facilities, and working-capital assumptions.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: preferences-and-governance
    missingEvidence: Share class stack, liquidation preferences, anti-dilution, strategic rights, and side letters from the latest financing rounds.
    whyItMatters: The economic entry price can differ sharply from the reported headline valuation when preferences are heavy.
    diligencePath: Obtain the latest financing documents and have counsel model liquidation waterfalls.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: deployment-quality
    missingEvidence: Installed-base uptime, paid conversion of overseas orders, repeat-order rates, and service burden on large logistics deployments.
    whyItMatters: These metrics are the cleanest way to tell whether Robot Era is outperforming the broader humanoid commercialization gap.
    diligencePath: Request operational dashboards, customer references, and cohort-style deployment histories.
    relatedQuestionRefs:
    - QV030
