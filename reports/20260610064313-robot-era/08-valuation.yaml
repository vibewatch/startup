- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis
  - What would change the view
  rows:
  - - Industrial sponsorship
    - Robot Era has one of the stronger strategic investor rosters in Chinese humanoids, which should help distribution, manufacturing, and customer access.
    - If later documents show that the round carried unusually heavy preferences or strategic strings, sponsor quality would support the company less than the headline implies.
  - - Commercial traction
    - '>RMB 500 million of cumulative orders, large logistics wins, overseas mix, and thousand-unit delivery language imply real demand formation.'
    - If those metrics prove to be pilot-heavy, cancellable, or slow to convert into recognized revenue, the current valuation loses its core support.
  - - China deployment advantage
    - China’s supply chain depth, policy support, and enterprise automation demand can justify a premium to generic robotics stories.
    - If policy support does not translate into recurring paid deployments, the “China premium” collapses into just another funding narrative.
  - - Global comp discount
    - Robot Era trades below top U.S. embodied-AI brands such as Figure and Physical Intelligence, which helps relative positioning.
    - A discount to decacorns is not enough if revenue disclosure is still materially weaker than Unitree or UBTECH.
  - - Disclosure gap
    - The anti-thesis is not that Robot Era lacks demand; it is that demand quality, margin quality, and investor economics remain underdisclosed.
    - Audited revenue, gross margin, and contract-payment data could move the stance from stretched toward fair.
  - - Sector hype risk
    - Independent adverse research says the whole category still lives in structured environments and can outrun real commercialization.
    - If Robot Era publishes uptime, conversion, and renewal data that disproves the sector-wide skepticism, the adverse weight should fall.
  notes: The anti-thesis is mainly about denominator quality and liquidity risk, not about whether humanoid robots are technically interesting.
