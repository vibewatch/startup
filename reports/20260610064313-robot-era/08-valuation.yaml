- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Recognized revenue bridge
    - Quarterly revenue by product, geography, and customer type for 2025-2026 with backlog conversion.
    - This closes the biggest denominator gap between orders and real sales.
    - Finance team, auditor workpapers, and board materials.
  - - Gross margin and services mix
    - Hardware, software, integration, and support margin splits by product family.
    - The valuation depends on whether Robot Era scales like a robotics platform or a labor-heavy integrator.
    - CFO review plus SKU-level margin bridge.
  - - Cash and runway
    - Cash on hand, monthly burn, capex needs, and downside runway after the March 2026 round.
    - Financing cadence is central to how much dilution risk remains after the March 2026 round.
    - Treasury schedule and board-approved operating plan.
  - - Contract economics on large wins
    - Payment milestones, acceptance tests, warranties, and cancellation terms for >RMB 50M logistics orders.
    - Large contracts can look impressive while still being poor economic quality.
    - Customer contracts, legal review, and collections data.
  - - Preference and governance terms
    - Share class stack, liquidation preferences, anti-dilution, and strategic rights from the latest rounds.
    - Nominal valuation can diverge sharply from effective entry economics.
    - Counsel review of financing documents and side letters.
  - - Deployment quality metrics
    - Installed-base uptime, failure rates, repeat-order data, and paid conversion of overseas orders.
    - This is the fastest way to test whether the company is outrunning the sector’s commercialization gap.
    - Operations dashboards, customer references, and service logs.
  notes: These are the minimum diligence asks required to move the call from bounded opinion to underwritten entry at the current mark.
