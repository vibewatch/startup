- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Assumptions
  - Valuation logic
  - Illustrative fair-value range
  rows:
  - - Bull
    - 25%
    - Order conversion proves strong, overseas mix holds, thousand-unit deliveries become accepted deployments, and management discloses margins that look closer to top China peers than to distressed robotics names.
    - Investors keep paying a strategic premium for embodied-AI optionality, but still below Figure-style software-brand extremes.
    - RMB 11B-RMB 15B
  - - Base
    - 50%
    - Orders are real and strategic investors matter, but recognized revenue disclosure, cash, and preference terms stay incomplete through the next diligence cycle.
    - The current mark is roughly defendable only as a strategic round with limited public denominator proof.
    - RMB 8.5B-RMB 10.5B
  - - Bear
    - 25%
    - Order conversion slows, margins disappoint, or funding terms prove more investor-protective than the headline suggests while sector hype cools.
    - The valuation resets toward public-comp discipline and away from private-round scarcity value.
    - RMB 6B-RMB 8.5B
  - - Probability-weighted
    - —
    - Base-case evidence dominates because the strongest public positives are real but incomplete.
    - Weighted midpoint of the above scenario set.
    - ~RMB 9.5B-RMB 10B
  notes: These scenario ranges are judgment ranges anchored to disclosed rounds, order proxies, public market comps, and adverse commercialization evidence; they are not DCF outputs and should not be mistaken for audited intrinsic value.
