- id: scenario-framing-and-multiple-discipline
  title: Scenario framing and multiple discipline
  body: The right way to discipline the valuation is to be explicit about what is estimated and what is disclosed. The cleanest disclosed Robot Era commercial number is cumulative orders above RMB 500 million. If an investor lazily treats that as a revenue-like denominator, the current >RMB 10 billion mark implies an estimated order-book multiple above 20x; that is a rough sanity check, not a real sales multiple, because orders are not revenue and the time period is not standardized. Public comps provide a second lens. CompaniesMarketCap places Symbotic at roughly $25.66 billion on about $2.51 billion of trailing revenue, or about 10x sales, while iRobot’s June 2026 market cap of only about $14.84 million against 2024 revenue of $682 million shows how violently public robotics equity can compress when growth and profitability break down. On that spectrum, Robot Era looks neither public-market cheap nor global-private absurd; it looks like a strategic round priced for successful revenue conversion.
    That leads to a base range centered just under the current mark, with upside only if management proves that orders convert into recognized revenue, margins, and repeat deployments rather than one-off pilots.
