- id: comparable-bounds-and-china-vs-global-context
  title: Comparable bounds and China-versus-global context
  body: The comparable set argues for both a premium and a discount. Robot Era deserves a premium to distressed or mature public robotics names because the category is still priced on future platform value, not on current GAAP earnings, and because China’s supply chain depth plus policy support make domestic deployment stories more financeable than Western public-market sentiment alone would suggest. But Robot Era also deserves a discount to the most celebrated U.S. embodied-AI rounds. Figure’s private marks moved from $2.6 billion in 2024 to $39 billion in 2025, and Physical Intelligence reached a $2.4 billion post-money valuation on foundation-model excitement before proving broad commercial deployment. Robot Era’s >RMB 10 billion anchor sits well below those global AI-brand peaks, yet that does not automatically make it cheap. Chinese disclosure-backed peers are a more demanding lens. Unitree has disclosed 2025 revenue growth to 1.708 billion yuan and updated 2026 profit pressure in IPO
    materials; UBTECH has disclosed RMB 2.001 billion of 2025 revenue, RMB 820.6 million of full-size humanoid revenue, and a 37.7% gross margin, while public market data still places its equity value around $7.22 billion. Those peers show that China can command real premiums, but they also show the market rewards disclosed revenue conversion, not just order headlines.
