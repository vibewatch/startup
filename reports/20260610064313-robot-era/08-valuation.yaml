tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Keep Robot Era live, but do not treat the March 2026 private mark as fully underwritten from public evidence alone.
  - - Confidence
    - medium
    - The evidence is good enough to bound price discipline, but not good enough to close denominator risk.
  - - Risk rating
    - high
    - Commercial traction is real, yet disclosure, liquidity, and commercialization risk remain material.
  - - Valuation stance
    - stretched
    - The current mark already prices substantial revenue conversion before public proof exists.
  - - Entry discipline
    - Require revenue proof or downside protection
    - A structured round, preference awareness, or post-diligence price reset is easier to justify than paying headline price blindly.
  - - What moves the call
    - Revenue conversion and cash disclosure
    - Audited revenue, gross margin, and cap-table economics matter more than another demo video.
  notes: 'This table is explicitly price-sensitive: it judges the investability of the current March 2026 mark, not the general quality of humanoid robotics as a category.'
