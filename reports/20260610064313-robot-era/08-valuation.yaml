- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue conversion misses the story
    - Management cannot show recognized revenue that meaningfully tracks the disclosed >RMB 500M order base.
    - The current mark stops being a strategic premium and starts looking like overpayment for backlog headlines.
    - Reset the case to bear-range pricing or walk.
  - - Cash and burn are weaker than expected
    - Cash runway is short or burn expands faster than deployments convert into paid installations.
    - The company becomes financing-dependent at a time when sector sentiment could cool.
    - Demand stronger terms, more diligence, or a lower entry.
  - - Preference stack distorts the headline mark
    - Liquidation, ratchet, or governance protections make the apparent valuation economically misleading.
    - Headline valuation stops approximating real common-equity value.
    - Pause until financing documents are reviewed.
  - - Commercial proof remains structured and narrow
    - Deployments stay stuck in demos, customs inspection, or tightly scripted logistics cells without broader fleet proof.
    - Adverse sector research becomes a direct company-specific valuation headwind.
    - Move the company from “research-more” toward “track only” or lower.
  - - Market multiple compression hits robotics
    - Public automation and robotics multiples compress while private capital becomes less willing to pay for optionality.
    - Robot Era loses the scarcity premium that currently supports the strategic-round mark.
    - Re-underwrite against lower public multiple bands before committing.
  notes: These are valuation kill triggers rather than generic business risks; each one can directly invalidate the current entry price.
