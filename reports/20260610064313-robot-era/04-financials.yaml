tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Enterprise humanoid system sales
    - Robot body plus deployment into logistics, manufacturing, or service workflows
    - Order value / delivered units
    - '>RMB 500M of orders disclosed; 200 robots shipped in 2025; thousand-unit deliveries said to have started in Q2 2026'
    - Medium for demand, low for revenue recognition
    - Provide recognized revenue by robot SKU, geography, and quarter.
  - - Large logistics solution contracts
    - Scenario-specific contracts such as customs inspection, sorting, or picking deployments
    - Contract value
    - Largest disclosed single order >RMB 50M; >10 logistics centers cited with China Post and SF Group
    - Medium for backlog signal, low for margin signal
    - Disclose contract scope, acceptance criteria, billing milestones, and backlog aging.
  - - Standalone dexterous hand sales
    - XHAND sold as a separate module rather than only inside full humanoids
    - Units shipped
    - '>1,000 XHAND units shipped in 2025 according to company PR'
    - Medium
    - Provide realized ASP, gross margin, and repeat-customer mix for XHAND.
  - - International commercial activity
    - Export and overseas deployment of robots or modules
    - Order mix / revenue mix
    - Yicai says overseas business was 50% of orders; KrASIA says overseas revenue was about half of total revenue, but no denominator is disclosed
    - Low to medium
    - Reconcile overseas orders, revenue, and shipped units by region.
  - - Support, software, and integration
    - Workflow integration, support, or software attach layered onto deployments
    - Not publicly disclosed
    - Implied by deployment language, but no standalone revenue line or pricing is public
    - Low
    - Break out recurring support and software revenue separately from hardware.
  notes: Rows separate demand signals from recognized revenue quality. Orders, shipments, and deployments are not treated as revenue unless the source explicitly says so.
