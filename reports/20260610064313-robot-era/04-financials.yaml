  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue
    missingEvidence: Monthly or quarterly recognized revenue by stream, including robot bodies, dexterous hands, integration, software, and support.
    whyItMatters: Without stream-level recognized revenue, backlog and shipment headlines cannot be converted into growth quality or margin analysis.
    diligencePath: Request 2025-2026 management accounts and a bookings-to-revenue bridge by stream.
    relatedQuestionRefs:
    - QI003
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-asp
    missingEvidence: Realized ASP, discounting, contract scope, and attach rates for Robot Era’s major deployments.
    whyItMatters: Public peer price anchors are not a substitute for realized Robot Era pricing and make unit economics highly uncertain.
    diligencePath: Obtain the top ten customer contracts, average selling price by SKU, and discount policy.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI009
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Product-level gross margin, bill-of-materials breakdown, installation labor cost, and service burden.
    whyItMatters: Margin path is the key difference between a promising robotics vendor and a capital sink, and public sources do not expose the cost stack.
    diligencePath: Request gross margin by product/service line plus BOM, labor, warranty, and support-cost schedules.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, cash commitments, and downside runway scenario.
    whyItMatters: Runway cannot be underwritten numerically from fundraising announcements alone.
    diligencePath: Obtain a 24-month cash bridge, monthly burn history, and current liquidity statement signed by finance leadership.
    relatedQuestionRefs:
    - QI014
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: contract-conversion
    missingEvidence: Backlog aging, cancellation terms, acceptance criteria, and customer concentration for disclosed order figures.
    whyItMatters: Order quality matters as much as order size because backlog may not convert cleanly into recognized revenue or cash.
    diligencePath: Review top-customer contracts, backlog aging, cancellation clauses, and renewal behavior.
    relatedQuestionRefs:
    - QI002
    - QI004
    - QI005
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
