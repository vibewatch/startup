company:
  name: Robot Era
chapter:
  number: 4
  title: Financials
  summary: Robot Era has far stronger public financing momentum and order momentum than public financial disclosure quality. The retained record supports multiple large rounds, more than RMB 500 million of commercial orders, and real shipment signals, but it still does not disclose recognized revenue, realized ASP, gross margin, cash, debt, or runway, so the right underwriting stance is backlog-positive but economics-unproven.
sections:
- id: revenue-backlog-and-recognition
  title: Revenue model, backlog signals, and why order headlines are not revenue
  body: 'The public record supports a real commercial engine, but not a recognized-revenue model. Company-linked and independent sources consistently point to more than RMB 500 million of orders, a single logistics order above RMB 50 million, deployments across more than 10 logistics centers, Q2 2026 thousand-unit delivery starts, 200 humanoids shipped in 2025, more than 100 orders in progress, and over 1,000 XHAND units shipped in 2025. Those are meaningful commercialization markers, especially because repeat orders and large logistics contracts appear in the same source set. But they are still bookings, shipment, or deployment signals rather than revenue-recognition disclosures. Even the closest thing to mix data is still company-claimed: Yicai reports overseas business as half of the order figure, while KrASIA reports overseas revenue as roughly half of total revenue, without disclosing the denominator. That is directionally positive, but not good enough for a clean revenue bridge. Investors
    should therefore treat Robot Era as a company with credible backlog and shipment traction whose revenue quality remains unverified until management discloses booked revenue by stream, backlog conversion, and customer concentration.'
  claimRefs:
