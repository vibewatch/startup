    - Replace proxy math with actual delivered and booked unit counts by SKU.
  - - Cash burn / runway
    - null
    - low
    - Cash and runway are the key forward variables and remain absent from public sources.
    - Provide cash on hand, monthly burn, and base/downside runway.
  notes: Nulls are deliberate where public evidence does not support a metric. The only numeric unit-count estimate is a peer-anchored proxy and should not be used as a reported Robot Era statistic.
