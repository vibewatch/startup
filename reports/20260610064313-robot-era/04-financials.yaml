- id: disclosure-quality-and-diligence-blockers
  title: Disclosure quality, adverse evidence, and the diligence blockers that still matter most
  body: 'The public file is strong on commercialization storytelling and weak on finance hygiene. Bain, McKinsey, Interact, SCIO, OFWeek, and adverse KrASIA coverage all point in the same direction: early humanoid demand exists, but commercialization is still concentrated in structured environments, ROI remains fragile, battery and dexterity are still gating factors, and investor enthusiasm can outrun evidence. Robot Era’s own disclosures fit that pattern. The company talks clearly about orders, deployments, and industrial investors, yet retained sources do not disclose recognized revenue, realized ASP, gross margin, cash, debt, backlog aging, warranty reserves, or billing mechanics. That leaves investors with a company that looks commercially real but financially underdisclosed. The diligence blockers are therefore specific rather than abstract: revenue recognition by stream, gross margin by product and service, cash and monthly burn, working-capital terms on large deployments, and the
    exact conversion quality of the reported order book. Until those are delivered, the chapter’s best-supported verdict is positive on demand formation and financing access, but cautious on economics and runway.'
