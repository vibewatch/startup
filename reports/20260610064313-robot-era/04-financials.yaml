  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Recognized revenue
    - null
    - low
    - Without recognized revenue, growth quality and operating leverage cannot be underwritten.
    - Provide monthly recognized revenue by stream for 2025-2026.
  - - Gross margin
    - null
    - low
    - Gross margin determines whether Robot Era behaves like a scalable robotics vendor or a capital-intensive integrator.
    - Provide product and service gross margin with BOM and labor detail.
  - - Commercial order book
    - '>RMB 500M'
    - medium
    - Backlog signals demand but not revenue conversion or cash collection.
    - Provide backlog aging, cancellation terms, and conversion to revenue.
  - - Largest single disclosed order
    - '>RMB 50M'
    - medium
    - Large contracts can validate enterprise relevance and expose concentration risk.
    - Disclose customer, scope, payment milestones, and margin profile.
  - - 2025 shipment signal
    - 200 humanoids shipped; >100 orders in progress
    - medium
    - Units shipped are the clearest operational traction proxy, but still do not prove booked revenue.
    - Reconcile shipped units, accepted units, and billed units.
  - - Standalone module shipments
    - '>1,000 XHAND units in 2025'
    - medium
    - Module volume could support better margin than full-system deployments, but pricing is undisclosed.
