  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式由出资方付费并与风险挂钩，但实际价格仍未公开
        blocks:
          - type: paragraph
            body: >-
              公开证据指向由出资方付费、承担风险的收入模式，而不是直接向患者变现。Thyme Care 的支付方页面称，公司与健康险计划和其他承担风险实体合作，对质量、结果和降低总照护成本承担责任；HCTTF
              案例研究称，多数安排让 Thyme 的费用与支付方基准挂钩承担风险，并在成本下降时分享上行收益。服务方页面补上第二条变现腿：Thyme
              与支付方签约，把环绕式导航嵌入社区肿瘤工作流，与服务方伙伴分享节省，同时自己承担全部下行风险。这比通用照护导航发出更强的收入质量信号，但关键定价变量仍被藏起来，因为
              PMPM、按病例费率、基准、风险走廊或实际抽成率表都没有公开。


              面向成员的页面解释了为什么公开收入确认仍难建模。Humana、CareFirst、Premera、EmblemHealth、Microsoft/Premera 和 AON EOM 都把 Thyme Care
              呈现为 $0 或无额外费用福利。Aetna 更微妙：护士和社区健康工作者支持免费，但 Thyme Care 服务方的就诊按其他网内初级保健就诊覆盖，可能产生标准计划自付。再加上法律页脚反复说明 Thyme
              Care, Inc. 提供管理支持和非临床服务、Thyme Care Medical
              提供临床服务，这指向一个混合收入堆栈：由出资方付费的导航、承担风险的绩效费用、服务方激励经济，以及部分临床计费流。承保建模的问题不是没有变现，而是没有合同层费率披露。
