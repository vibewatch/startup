      - number: '1.3'
        title: 资本基础、利益相关方地图和公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 的融资史显示，公司从早期风投资金走向战略含量很高的后期轮次。Andreessen Horowitz 在 2021 年 10 月公开支持公司。第一笔大型公开轮次出现在 2023 年 8
              月，当时 Thyme Care 宣布由 Town Hall Ventures 和 Foresite Capital 共同领投的 $60 million Series B，使披露融资超过 $80
              million，并引入投资人董事会影响力。2024 年 5 月，Echo Health Ventures 和 CVS Health Ventures 追加战略投资。两个月后，公司宣布 $95 million
              Series C，由 $55 million 股权加 $40 million Banc of California 债务构成，使披露资本达到 $178 million，并引入 Concord Health
              Partners。下一次台阶出现在 2025 年 9 月 25 日，Thyme Care 宣布 $97 million Series D，使累计融资达到 $275 million，并新增 Morgan
              Health、Humana、Texas Oncology 和 Memorial Hermann 作为战略投资人。


              公开规模主张很强，但并非全部来自独立来源。AJMC 称公司到 2023 年秋已服务超过 3,000 名患者；2024 年来源把网络规模放在 800 多名肿瘤科医生以上，2025 年 Series D 公告则放在
              1,000 名以上。2025—2026 年官方公告称，Thyme Care 管理超过 $5 billion 肿瘤开支，在全美覆盖 8 million 人，到 2025 年底达到 85,000 名成员，拥有超过
              500 名全职员工，并运营一支 500 人照护团队。这些是有用的封面指标，但不能抹平披露缺口。精确收入、ARR 和付费客户数仍未披露，估值信号也仍是外部报道，不是公司确认的事实。
