      - - 客户集中度和续约
        - 少数大型付款方或雇主合同可能决定收入质量和续约风险
        - Humana、Aetna、AON 以及 Fortune 500 雇主等具名合作伙伴
        - 索取前 10 大客户集中度、续约日期和总留存历史
      - - 实体层面经济性
        - 多个运营实体可能遮蔽利润率到底在哪里赚到或亏掉
        - 法律披露区分 Thyme Care, Inc. 与 Thyme Care Medical
        - 索取法律实体财务报表和内部转移定价逻辑
      - - 节省主张的第三方验证
        - 内部或合作伙伴筛选的案例研究有方向性帮助，但不足以支撑投资判断
        - HCTTF 称未独立验证内部分析；CMS 报告显示模型风险
        - 审阅外部精算验证，以及按付款方划分的共享节余对账结算
      - - 销售效率和实施回本周期
        - 即便临床结果强，企业级医疗 GTM 也可能持续烧钱
        - 岗位组合、雇主扩张说法，以及“数月内实施”的表述
        - 索取获客成本（CAC）、单个 logo 实施成本、爬坡时间，以及按分部划分的渠道回本周期
    notes: 这些不是泛泛的尽调问题。每个缺失指标都会直接卡住收入质量、利润率韧性或现金跑道充足性的判断。
