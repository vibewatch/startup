  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Thyme 位于 PHI 密集工作流中间，监管、法律与隐私风险偏高
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 的法律和监管风险不集中在某一张执照或某一个案件上；它分布在公司架构、HIPAA 数据处理、 网络安全、远程医疗，以及新兴 AI/算法规则之间。官方法律文本称 Thyme Care, Inc.
              提供管理和非临床支持， Thyme Care Medical, PLLC 和 Bobby Green Medical, P.C. 提供临床支持；公司在支付方、雇主和医疗服务方关系中全国扩张时，
              这是一种常见但合规负担重的结构。隐私政策还确认，Thyme 使用 cookie、网络信标、Google Analytics、 第三方分析和健康信息交换工作流，因此合规表面比简单的会员端支持服务更大。HHS OCR
              的追踪技术公告直接相关： 需要登录的门户通常涉及 PHI，一些无需登录的排期或症状录入页面也可能触发 PHI 义务，追踪供应商可能需要 BAA 或患者授权。大型数据泄露和勒索软件增长后，HHS
              同时提出了明显更严的 HIPAA Security Rule；Section 1557 的 2024 最终规则也明确覆盖患者护理决策支持工具和远程医疗。实际含义是，Thyme 的法律暴露部分取决于执行质量：
              公司之所以招聘 AI 治理、隐私和安全岗位，是因为监管预期现在跑得比通用初创公司合规清单更快。
