      - number: '2.2'
        title: 受证据约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              多个规模测算视角都重要，因为没有公开来源能干净地分离出外包肿瘤导航向支付方和服务方销售的美元 TAM。最宽的视角是全国癌症照护成本。NCI 估计美国癌症照护支出 2020 年为 $208.9
              billion；NIHCM 则强调 2030 年预计达到 $246 billion。需求量同样巨大：ACS 预计 2026 年美国新增癌症病例 2.11 million、死亡 626,140 人；NCI 估计
              2025 年新增 2.04 million、死亡 618,120 人；癌症生存者人口已经超过 18 million，并有望到 2040 年达到 26 million。这些数字证明底层问题池很大，但它们并不等同于
              Thyme Care 可服务的软件加服务市场。


              第二个视角是买方预算表面。KFF 称雇主赞助保险覆盖 154 million 非老年人，整体上 63% 的参保员工使用自保，大企业中这一比例为 79%。这让商业支付方、TPA
              和自保雇主具备经济相关性，因为它们直接通过保费、理赔和止损压力感受到肿瘤趋势。Medicare Advantage 同样相关：Chartis 称 MA 领导者在 2026
              年把盈利能力和医疗成本控制列为优先事项；KFF 则显示，随着药品成本压力上升，MA-PD 计划增加了更多免赔额和共保。


              第三个视角是正式肿瘤价值医疗的采用。CMS 的 EOM 只包括 28 个医生集团诊所和 1 个商业支付方，覆盖 350+ 个照护地点。相对肿瘤成本池，这个足迹很小——这正是重点：长期 TAM
              巨大，但近期公开可见、面向外部肿瘤管理伙伴的 SAM 仍处在早期，而且高度异质。Stout 对 2024 年美国肿瘤市场的更窄估计为 $85.6
              billion，也从另一个角度凸显同一问题——有些来源衡量行业收入，另一些衡量全国照护支出。保留这个边界错配，比强行给出单一标题 TAM 更诚实。
