  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 并不在整个肿瘤经济中竞争。公开材料把它放在更窄的运营层：肿瘤导航、环绕式临床支持，以及卖入支付方和服务方工作流的肿瘤价值医疗赋能。在支付方一侧，Thyme Care
              描述了全面癌症照护导航、分析和症状管理支持，帮助健康险计划及其他承担风险实体降低总照护成本。在服务方一侧，它把自己定位为肿瘤科集团和卫生系统的延伸，提供就诊间隙支持、绩效项目和共享节省结构，同时 Thyme
              Care 承担下行风险。TCOP 模型又加入与肿瘤诊所的双向集成、药品开支干预，以及跨支付方和医生集团的规模化风险聚合。


              这个边界排除了几个规模很大但相邻的支出池。Thyme Care 不是药品制造商、输注服务方、EHR 厂商，也不是全风险保险公司。它不取代肿瘤科医生或
              PCP；即便面向成员的页面，也强调与既有医生协调，而不是替代。因此，真正的对照组是现状型癌症照护管理：支付方案例管理项目、服务方雇佣的导航员、通用利用率管理、疾病管理厂商，以及在按服务收费激励下运转、碎片化的转诊、社会需求和随访工作流。真正的尽调问题是，买方会把肿瘤导航当成独立预算项、既有案例管理的延伸，还是嵌在更大范围支付方—服务方合同里的肿瘤价值医疗运营层。
