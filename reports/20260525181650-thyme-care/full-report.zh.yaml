              时间线足够丰富，可以支撑后续章节而不必大量猜测。公开证据支持：2020 年 7 月创立窗口、2021 年 10 月 a16z 投资标记、2023 年 8 月 Series B、2024 年 5 月 Echo
              Health Ventures 和 CVS Health Ventures 战略投资、2024 年 7 月 Series C、2024 年 8 月 Lalan Wilfong 加入领导层、2025 年 7
              月扩展生存期照护与姑息治疗、2025 年 9 月 Series D 同时标志公司实现盈利、2026 年 4 月推出 Integrated Social Support，以及 2026 年 5 月入选 CNBC
              Disruptor 50。这个里程碑组合有价值，因为它显示 Thyme Care 正从导航创业公司演进为更宽的肿瘤运营平台，触点覆盖支付方、服务方、雇主和卫生系统。


              概览仍必须保留无法顺畅对账的部分。来自 Endpoints 和 Bloomberg 的外部报道让 $1 billion 估值成为真实信号，但官方 Series D 公告没有确认。Tracxn 进一步把同一笔
              $97 million Series D 标为 2025 年 4 月 4 日、估值 $1 billion，早于公司自己 2025 年 9 月 25
              日的公告数月，因此在管理层确认规范交割日期前，轮次时间应视为存在冲突。本章还保留一个反向来源：Thyme Care
