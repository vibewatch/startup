      - number: '5.4'
        title: 路线图已从基础导航延伸到药房、心理社会和生存期工作流
        blocks:
          - type: paragraph
            body: >-
              公开能看到的路线图显示，Thyme Care 正从导航扩展成更完整的肿瘤运营层。早期案例研究和 2024 年 Fierce Healthcare 报道提到 Thyme Box 工作流自动化、100
              多套循证支持方案、会员移动端评估， 以及包括 ADT 数据流在内的 EHR 集成扩展。AON 2024 年案例研究显示，该平台已在生产规模上支撑 EOM 要求。到 2025 年，Humana
              协议强调多州落地，覆盖药房干预，以及肿瘤医生、PCP 和专科医生之间的协同。 2025 年底到 2026 年初，Thyme 公开强调 Integrated Social Support
              和生存者护理扩展，释放的信号是走向更宽的全人护理模型， 而不是狭窄的急性治疗产品。


              差异化逻辑因此不只是「更好的导航」。Thyme 把肿瘤专科护理团队、自研内部工具、嵌入工作流的医疗服务方集成， 以及基于价值的合同逻辑拼在一起。HCTTF 和 Morgan Health
              都把该模型描述为人群分析、地方资源协调和主动症状管理的组合。 话虽如此，路线图更容易从新闻稿和案例研究里观察到，而不是从开放产品文档里读清楚。公开材料仍未披露深度版本历史、
              详细集成图谱，也没有公开远程患者监测或原生 app 扩展路线图。最清晰的判断是，Thyme 正在横向延伸到更多肿瘤工作流； 但外部尽调仍不得不过度依赖营销材料、合作伙伴案例研究和从业者评论来推断。
