      - number: '5.3'
        title: 部署高度依赖集成，并围绕支付方、服务方和照护团队工作流设计
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 的部署叙事在运营上可信，但技术上并不简单。支付方页面称，实施会按计划流程、团队和网络设计定制，支持可在数月内启动。同一页面展示了一个成员旅程样例：理赔、HIE 和 EHR 数据预填
              Thyme Box 档案，病情严重度评分影响照护计划，ePRO 结果触发跟进，后续行动再分享回肿瘤诊所。HCTTF、AON 和 AJMC 补充了服务方侧细节：Thyme 使用 EHR
              访问或双向集成、项目专属仪表盘、定制文件、自动化报告和工作流叠层，支持转衔照护、药物干预项目和其他价值医疗活动。


              这种与肿瘤运营的贴合度是真实差异点。Signal 在病历中浮现成员资格，把药物替代和减少浪费的建议路由进服务方工作流，并给肿瘤团队一条直连 Thyme 员工的通道。AON 的案例研究称，Thyme 支持了
              2,700 多名 EOM 患者，满足 ePRO 和 HRSN 项目要求，同时靠自动采集减少手工报告负担。但同一组证据也暴露下行：上线依赖理赔访问、HIE 或 ADT 数据馈送、EHR
              权限、本地工作流映射、变更管理和伙伴教育。Thyme 更像嵌在肿瘤价值医疗里的操作系统，而不是即插即用 SaaS 应用；这种特征在加深防御力的同时，也提高了实施复杂度。
