      - number: '8.5'
        title: 战略出售比 IPO 更可行；尽调仍要补齐核心缺口
        blocks:
          - type: paragraph
            body: >-
              从外部看，Thyme Care 还不像具备 IPO 条件。公司有战略动能，但公开市场奖励审计收入历史、可预测利润率和可重复披露习惯， 而这些 Thyme
              仍缺。今天更可行的是战略路径：支付方、护理导航平台、肿瘤服务整合方或福利基础设施买方可以把 Thyme 视为能力层，而不是独立上市公司。战略逻辑可信，因为 Thyme
              位于肿瘤导航、支付方成本管理和医疗服务方工作流延伸的交汇点， 这些都是存量巨头仍难啃的区域。


              即便如此，最终承销不能只押战略可选性。缺口都很具体：审计 2025 年收入、EBITDA 和现金；清算优先权堆叠以及任何参与分配条款； 队列留存和出资方层面经济性；以及为什么老股数据源显示 $1.5
              billion 估值点， 而其他公开记录只支持 >$1 billion 下限。它们不是表面问题，而是决定 Thyme 到底按真正去风险的肿瘤平台定价，
              还是按有前景但仍不透明的私营资产定价。在该资料包到位之前，正确的委员会姿态是有纪律的好奇， 而不是激进入场。
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
