chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Thyme Care
              最适合被看作一家私有、成长期的肿瘤价值医疗赋能公司，而不是单点应用。官方文案把公司描述为肿瘤导航领导者，与支付方、服务方、雇主和承担风险的服务方合作，改善可及性、疗效和成本。这个定位很关键：公司卖的不只是面向患者的支持服务，而是想站在健康险计划和肿瘤诊所之间，成为一层运营系统，把
              7×24 小时导航、技术，以及对成本和质量的共同责任拼在一起。支付方和服务方页面持续强调全程支持、降低总照护成本、虚拟专家照护团队可及性；Series C 材料更进一步，称公司承担双向财务风险。


              最干净的公开身份锚点是创立年份、总部和阶段。官方及合作伙伴材料称 Thyme Care 创立于 2020 年；AJMC 补充说，公司在 2020 年 7
              月起步，最初聚焦更窄的患者导航。总部证据比许多创业公司档案更清晰：官网称公司总部在 Nashville，多个独立媒体也称其位于 Nashville。阶段上，最稳妥的标签是私有、Series D 后公司。外部报道把
              Thyme Care 放在独角兽门槛，但公司自己只公开确认 $97 million Series D 和 $275 million 累计融资，没有确认投后估值。
