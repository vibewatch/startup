companyProfile:
  summary: >-
    Thyme Care 是一家位于 Nashville 的肿瘤照护导航与价值医疗癌症照护公司，2020 年由 Robin Shah 和 Bobby Green, MD
    创立。公司向健康险计划、雇主和承担风险的服务方销售由出资方付费的项目，用 500 多人的肿瘤训练照护团队，叠加软件、症状监测、服务方工作流工具，以及支付方 / 服务方签约基础设施。到 2026
    年春，公开证据显示平台增长很快：2025 年底达到 85,000 名成员，覆盖 8 million 人，与 1,400 多名肿瘤科医生合作，并完成 $97 million Series
    D；背后是健康险计划、雇主和肿瘤服务方组成的战略财团。
  foundedDate: '2020-07-01'
  founders:
    - name: Robin Shah
      role: 联合创始人兼首席执行官
      background: 肿瘤基础设施运营者，过往经历与 Flatiron Health 及更广泛的癌症照护运营相关。
      claimRefs:
