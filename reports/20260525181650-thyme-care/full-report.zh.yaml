          detail: 患者从所有肿瘤医生和护理场景中识别出来
        - id: benchmark
          label: 设定基准或总护理成本目标
          detail: HCTTF 称费用会基于支付方数据，对照基准承担风险
        - id: navigation-service
          label: 部署 24/7 导航和临床支持
          detail: 护理团队包括肿瘤护士、社工、护理伙伴和临床医生
        - id: provider-programs
          label: 叠加服务提供方和药房干预
          detail: TCOP 和药房项目瞄准药物浪费、替代用药和工作流改变
        - id: savings-realized
          label: 产生急性护理和药物支出节省
          detail: 公开案例提到避免 ED 使用、降低再入院和优化药物成本
        - id: thyme-economics
          label: Thyme 收费置于风险下，并叠加上行分成或激励经济
          detail: 实际 PMPM、按病例费率和节省分成比例未公开
        - id: member-price
          label: $0 或低可见度会员侧价格
          detail: 大多数会员页面没有显示直接收费，而 Aetna 披露会对服务提供方就诊计费
      edges:
        - from: sponsor-contract
          to: attributed-members
          label: 合同形成合格人群
        - from: attributed-members
          to: benchmark
          label: 设定人群基准或目标
        - from: benchmark
