      - number: '8.2'
        title: 估值背景真实存在，但内部不一致
        blocks:
          - type: paragraph
            body: >-
              最可防守的硬锚点是 SEC 文件。Thyme Care 的 Form D 称首次出售发生在 April 4, 2025， 已向 14 位投资人出售 $97.0 million，发行规模为 $100.0
              million。公司随后在 September 25, 2025 公开宣布 Series D，多家媒体复述管理层说法：该轮把 Thyme 推过独角兽门槛。
              组合起来看，这支持一轮真实后期融资的存在，也排除了公司没有达到 $1 billion 估值下限的疑问。


              但这并不能锁定确切估值。Premier Alternatives 显示同一个 September 25, 2025 日期下估值为 $1.5 billion、累计融资为 $280.6 million；Tracxn
              则显示投后估值为 $1.0 billion、累计融资为 $275 million，并绑定 April 4, 2025 首次出售日期。只有额外私有信息才能调和这些数字：
              股权结构表视图、老股交易估值点的方法说明，或公开来源尚未完整记录的后续融资 / 老股交易成交记录。 正确结论不是挑最漂亮的数字，而是保留冲突。公开证据目前支持一个区间，而不是干净的单点估计；缺少审计财务披露，
              也意味着这个区间也应视为暂定。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 可比公司集合支持服务型而非软件型定价纪律
        blocks:
          - type: paragraph
            body: >-
              可比集合需要混合私营导航平台、肿瘤服务平台和公开基于价值护理代理标的，因为没有单一公开可比公司能干净匹配 Thyme Care 的肿瘤聚焦、支付方对齐和私募市场不透明度。Transcarent
              是最好的泛导航基准： Tracxn 显示其 2024 Series D 估值为 $2.2 billion；它在 January 2025 以约 $621 million 股权价值收购
              Accolade，也同时展示了战略野心，以及公开市场定价对比 Thyme 更宽的导航资产可以多么严苛。 OneOncology 不是直接商业模式匹配，但 Cencora 约 $5.0 billion 现金对价和
              Fierce 的 $7.4 billion 企业价值口径显示，当规模化肿瘤服务平台拥有远多于 Thyme 当前披露的医疗服务方基础设施和收入时，出清水平可以到哪里。


              公开代理标的再次强化纪律。Evolent、Astrana、Privia 和 agilon 的 EV/sales 介于约 0.21x 到 1.16x，中位数接近
              0.73x。它们不是完美可比公司，但都比纯软件企业更接近服务密集、承担风险的医疗运营商。 关键在于，Thyme 的公开材料仍没有给出投资人能代入这些倍数的收入基数。可比公司的启示因而是方向性的，
              不是精确值：基于价值护理平台的当前公开市场出清价格偏温和；私营导航和肿瘤平台只有在规模或战略控制力明显强于 Thyme 当前公开披露时， 才能拿到更高估值点。
