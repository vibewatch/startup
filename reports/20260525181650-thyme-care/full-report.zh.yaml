  - id: FO003
    title: 快照 KPI
    type: kpi
    layout: compact
    summary: 在精确经济数据仍未公开的情况下，用序数综合评分给出 Thyme Care 的融资实力、网络规模、员工规模、结果主张和披露质量的管理层视角。
    data:
      items:
        - label: 资本实力
