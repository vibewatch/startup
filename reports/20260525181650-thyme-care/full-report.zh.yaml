  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出 / 工作流
      - 排除 / 相邻领域
      - 主要买方 / 付款方
      - Thyme Care 意义
    rows:
      - - 肿瘤导航和配套支持
        - 24/7 症状支持、分诊、财务毒性援助、社会需求支持、转诊、生存期触点
        - 药品制造、输注执行、医院报销
        - 健康计划、MA 渠道、承担风险主体
        - Thyme Care 明确卖给付款方和会员的核心运营层
      - - 肿瘤价值医疗赋能
        - 人群分析、病情严重度评分、照护计划、ePRO、HRSN 筛查、共享节余 / 下行风险支持
        - 通用疾病管理和非肿瘤 VBC 工具
        - 健康计划、肿瘤医疗集团、承担风险的医疗服务组织
        - 面向出资方的核心价值主张，也是相对通用个案管理的关键差异点
      - - 医疗服务方工作流延伸
        - EHR / HIE / 理赔双向集成、排期支持、照护转衔、就诊间隔触达
        - 替代主治肿瘤医生或 PCP
        - 肿瘤医疗集团、医疗系统、老年初级保健集团
        - 作为延伸而非替代出售，是医疗服务方采用的关键
      - - 现状替代方案
        - 付款方个案管理、医疗服务方雇用的护士导航、利用管理、PCP 随访、碎片化转诊
        - 专门的肿瘤专科外部伙伴
        - 现有付款方 / 医疗服务方运营预算
        - 当前最常见的替代方案；也解释了为何买方教育和优于现状的证明很重要
      - - 排除的全风险类别
        - 药品返利和制造经济性、全风险保险承保、核心 EHR 授权、医院设施费
        - 直接肿瘤管理服务层
        - PBM、保险公司、医院、软件供应商
        - 重要边界：Thyme Care 能影响利用率和协同，但不掌控肿瘤支出的全链条
    notes: 边界依据 Thyme Care 面向付款方、医疗服务方和会员的公开页面划定，排除那些 Thyme Care 能影响结果、但不是主要名义销售方的类别。
