      - number: '3.4'
        title: 切换成本、护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              Thyme Care
              仍有连贯定位。它最好的公开信号是支付方与服务方对齐、不断增长的肿瘤伙伴网络，以及一个把导航连接到临床支持和药房干预、而不是通用福利帮助的照护模型。这些要素确实会制造切换成本：一旦供应商集成进成员外展、肿瘤科医生协调、数据流和替代支付运营，替换就会造成扰动。尽管如此，护城河仍只是中等。多供应商并用完全可能：一个健康险计划可以保留保险公司癌症支持，在诊所使用服务方工作流平台，把选定病例导向
              Carrum，同时再叠加一个导航供应商。广义导航在位者也会把癌症与权益倡导、初级保健和 AI
              导航打包，从而压缩差异化。多数厂商公开经济性仍不透明，竞争周期因此转向信任、客户背书能力和可量化结果。今天主要反向证据就在这里：Navigating Cancer 能引用具名公开结果数据，而 Thyme Care
              最好的公开证明仍来自公司和伙伴材料。除非 Thyme 持续拿出独立证据和续约耐久性，保险公司、服务方在位者和模块化诊断平台会稳步把这个品类商品化。
