        - 需要用它区分高质量的经常性赞助方收入和高人力、低毛利服务工作
        - 只有牵引指标：会员、患者、在管支出、肿瘤科医生数量
        - 索取按 Medicare Advantage、商业保险、雇主、EOM 和药房解决方案划分的分部 P&L
      - - 现金、烧钱速度、现金跑道和债务
        - 这是判断融资依赖、下行规划和稀释风险的必要输入
        - 近期大额融资和管理层盈利说法
