      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动很清楚。癌症发病率和生存者人数在上升，专科药管线越来越贵、运营越来越复杂，雇主和 MA 计划都承受着控制总照护成本的压力。CMS 也把方向说得很明确：EOM 把肿瘤照护周期与导航、7×24
              小时可及、照护计划、ePRO、HRSN 筛查和下行风险责任绑定。Stout、Evernorth、Prime、Milliman 和 KFF
              都从相邻角度强化同一逻辑——肿瘤正在变得更昂贵、更技术密集，也对掌握医疗和药房趋势的出资方更具战略重要性。对 Thyme Care
              来说，这一点有利，因为公开模型围绕肿瘤专属支持、集成和绩效对齐，而不是通用照护管理。


              约束同样重要。正式肿瘤价值医疗采用仍早；相对更大市场，EOM 的公开足迹仍小。肿瘤劳动力短缺正在恶化，ASCO 预计到 2037 年，农村地区肿瘤科医生需求只能满足
              29%；这既提高了对支持工具的需求，也限制了实施带宽。服务方集团还面临职业倦怠、事前授权延迟，以及肿瘤专属基础设施不均。Thyme Care 自己也认为，许多支持活动落在按服务收费报销之外，且节省额可能要 3 到
              5 年才抵消人员和基础设施投入。这些商业化摩擦并不轻。


              数据碎片化和信任是最后的闸门。Thyme Care 自身模型依赖理赔、HIE 和 EHR 数据、双向工作流集成，以及高频患者接触。如果外展像通用服务，成员会脱离；如果服务方工作流被重复，诊所会抵触；如果 ROI
              证据主要仍由公司撰写且区域性很强，采购周期会拉长。务实的尽调结论是，Thyme Care
              处在一个有吸引力的问题区，政策和成本顺风真实存在；但采用会一单一单地靠集成质量、服务方对齐，以及证明导航改变可避免利用率而不只是叠加另一层供应商来赢得。
