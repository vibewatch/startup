            title: 公开证明方向上强，但仍过度依赖合作伙伴生成
            body: Thyme 确实有牵引力和结果改善证据，但最强的报销主张仍来自合作伙伴生成或公司内部分析。CMS 自己的肿瘤模型记录好坏参半， 所以投资人不应只靠公开案例研究来承销持久利润率。
