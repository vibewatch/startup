        blocks:
          - type: paragraph
            body: >-
              最大的投资风险不是癌症导航是否重要，而是 Thyme 的基于价值模型能否在少数合作伙伴证明之外经济上可重复。 支持公司叙事的材料也坦承，OCM、EOM 等过往肿瘤基于价值模型常未能兑现更好结果和更低成本的组合。
              CMS 自己的 OCM 最终评估是文件中最强的反向证据：评估发现 episode 支出降低，但计入月度和绩效付费后， Medicare 净亏损仍超过 $600 million。Thyme
              的回答是直接围绕总护理成本签约，让费用承担风险， 并与肿瘤医生和支付方更紧密对齐。结构上可能更好，但公开证明仍集中在合作伙伴生成证据。HCTTF 2026 年案例研究报告， 一个 MA 合作的 PMPM 降低
              10%、ROI 超过 2:1；但同一文件也说，结果图表依赖 Thyme 内部分析，未经过独立验证。 AON 的 EOM 结果方向上令人鼓舞，但仍只是一个合作伙伴在某模型首期的结果；该模型中只剩 36 家诊所和 2
              个支付方。因此，模型、续约和基准设计风险仍排在严重性堆栈顶端。
