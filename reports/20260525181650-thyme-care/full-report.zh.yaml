      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图是多边的。Thyme Care 的公开证据显示，公司直接面向健康险计划和承担风险实体销售，包括 Humana、EmblemHealth、Premera 的计划赞助成员项目，以及与 CenterWell 和
              Conviva 的老年初级保健渠道。这些关系重要，因为预算所有者通常是医疗管理、肿瘤或总照护成本负责人，而不是接受服务的成员。同时，服务方集团也是明确买方或渠道伙伴：Thyme Care 向肿瘤诊所和卫生系统营销
              7×24 小时就诊间隙支持、绩效项目和工作流集成，并称其在本地市场与支付方签约，同时免费把支持嵌入服务方集团。


              雇主的作用不同。KFF 的 154 million 覆盖人群和高自保比例，使雇主成为肿瘤开支的重要经济出资方；Evernorth 也明确把 2026
              年肿瘤导航和生存期支持界定为健康险计划和雇主共同面对的计划出资方问题。但 Thyme Care
              的公开材料没有披露仅面向雇主的客户数，也没有披露独立雇主定价动作。对尽调而言，这意味着雇主应被视为重要的需求塑造群体，而不是公开记录中最清晰的直接买方。


              终端用户是患者、照护者和肿瘤临床医生。成员页面强调 7×24
              小时支持、二次诊疗意见帮助、症状指导、财务和交通支持，以及与医生协调。服务方页面强调减少工作量、降低紧急升级和共享节省。因此销售动作必须同时对齐三件事：一个掌握预算的出资方、一个愿意集成的服务方网络，以及一种让成员觉得足够癌症专属、而不是通用利用率管理外呼的体验。
