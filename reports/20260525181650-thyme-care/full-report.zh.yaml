          - type: callout
            title: 主要估值风险：合成精确感
            body: 这里最大的承销错误，是把当前估值点当成干净数字。公开来源仍让投资人在 >$1B 下限、 $1.0B 市场数据估值点和 $1.5B 老股交易式估值点之间选择。
            calloutType: risk
            claimRefs:
