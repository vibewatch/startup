  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是嵌入工作流的肿瘤支持服务，不是独立应用
        blocks:
          - type: paragraph
            body: >-
              理解 Thyme Care 的产品，最好用工作流而不是
              SKU。健康险计划、雇主和服务方伙伴购买的是一套环绕式肿瘤支持服务，它坐在癌症就诊之间，围绕主治肿瘤科医生协调，而不是取代医生。支付方页面描述了从诊断前到生存期的 7×24 小时虚拟支持，服务方页面则称
              Thyme 充当肿瘤诊所的延伸，减轻负担，同时把临床决策留给本地团队。面向成员的页面把同一运营模型具体化：符合条件的 Aetna
              成员可以昼夜联系护士、获得社区健康工作者支持、由服务方支持的紧急照护、二次诊疗意见帮助、交通、餐食和财务援助导航。


              数字界面重要，但不是整个产品。Thyme Care Connect 被呈现为私密的在线或移动端友好网页体验，成员可以请求支持、完成症状评估、阅读教育内容，并参加基于 ePRO 的随访打卡。这些输入随后流入
              Thyme 的人工照护模型。公开材料始终把软件描述为多学科肿瘤服务的前门和协调层，而不是纯自助软件工具。这个区别对尽调很重要：它解释了 Thyme
              为什么能声称比通用导航项目有更好结果，但也意味着可扩展性不仅取决于软件质量，同样取决于人员配置、执照、工作流设计和伙伴集成。
