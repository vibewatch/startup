      - number: '5.2'
        title: 三个软件界面和多学科照护团队构成运营架构
        blocks:
          - type: paragraph
            body: >-
              公开文档指向一个架构：大型照护交付组织之上叠加三层软件界面。Thyme Care Connect 是面向成员的数字前门。Thyme Box 是内部照护管理系统，聚合数据、预填成员档案、采集 ePRO 和 HRSN
              评估，并向照护团队提供仪表盘、行动手册和报告。Thyme Care Signal
              是面向服务方的工作流层，把资格、更新和建议直接浮现在肿瘤工作流里。三者合在一起，在成员报告的需求、内部分诊和服务方跟进之间形成闭环。


              软件与多学科运营模型紧密耦合。照护团队页面列出医学总监、姑息治疗医生、肿瘤护士、社工、照护伙伴和入组专员，并称公司拥有 500 多名肿瘤训练专业人员。2026 年 Integrated Social
              Support 上线，增加了更清晰的心理社会模块：持证社工成为早期响应者，100% 成员会接受心理社会障碍筛查，NCCN Distress Thermometer、PHQ-2、GAD-2 和 Columbia
              Suicide Risk Assessment 等验证工具也进入工作流。Pharmacy Solutions 和 Thyme Care Medical
              进一步把版图延伸到药品开支优化和虚拟临床支持。结果是一套带有命名模块的真实服务架构，但其一致性取决于人、软件和伙伴工作流之间的紧密编排。
