      - number: '7.4'
        title: 治理、渠道集中度与未经审计的财务说法仍是重大尽调项
        blocks:
          - type: paragraph
            body: >-
              Thyme 的治理图景好于许多私营医疗科技同行，但透明度仍不足以消除关键人或资本风险顾虑。团队页显示 Robin Shah、Bobby Green、Brad Diephuis、Jesse Waldron 和
              Michael Markowicz 周围有可见的高管梯队； 董事会包括 a16z、Concord、Lightspeed、CVS 和 Town Hall 的投资人代表，并有 Bill Frist 等观察员。
              这有帮助，但也凸显了相对少数创始人、运营者和风投支持方掌握大量战略语境。商业上，同一批合作伙伴往往同时是投资人、 分发验证方和运营依赖方：Humana、Texas Oncology、Memorial
              Hermann、Morgan Health、EmblemHealth、AON 及其他承担风险的集团。 运行顺畅时这很强，但如果一个渠道停滞、重新定价基准，或决定自建或另购，就可能形成相关性下行风险。
              财务上，2025 Form D 证实了一轮真实的 $97.0 million 融资，涉及 14 位投资人；但最强的盈利和规模指标仍是管理层说法，
              而不是审计披露。公开材料未披露合同层面基准、逐支付方集中度、现金跑道或审计利润率，因此否决条件应少看抽象总可用市场（TAM）问题， 多看具体证据：独立 ROI
              复现、安全事件历史、集中度、护理团队填补率，以及管理层是否能用出资方层面经济性支撑公开盈利叙事。
