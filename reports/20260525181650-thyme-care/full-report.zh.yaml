      - number: '4.2'
        title: GTM 看起来偏企业级，支付方、服务方和雇主实施推高回本复杂度
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 的 GTM 动作看起来偏企业级、实施很重。支付方页面承诺在几个月内部署，但前提是先定制激励、接入计划流程，并与既有团队协调；Signal 和 AON 材料描述了理赔、HIE 和 EHR
              数据流、病历内资格标记、ePRO 收集、报告自动化和药房干预项目。这意味着销售周期很可能涉及精算、临床、运营和 IT 利益相关方，而不是快速添加一个福利。Morgan Health
              的投资备忘显示雇主渠道为什么有战略吸引力，但也暗示销售复杂：Thyme Care 称其进入雇主赞助保险第一年，就已经与健康险计划和企业建立伙伴关系，包括 Fortune 500 公司；Fierce
              则报道公司正在直接集成大型雇主。这些标杆客户有价值，但不一定意味着低 CAC。


              招聘模式强化了这个判断。招聘页面强调混合办公招聘和股权；公开招聘板 API 在审阅时显示 33
              个开放岗位，明显偏向临床交付、照护领导和运营，只有少数明确商业岗位，例如服务方合作高级经理、业务发展与运营总监。这个组合说明，公司仍把更多资金花在运营已上线合同上，而不是用传统销售队伍铺市场。GTM
              上行在于，每一次成功实施都可能解锁支付方扩张、服务方网络密度和雇主赞助管理覆盖人群。GTM 风险在于，如果扩张跑在运营准备度前面，实施、照护团队爬坡和数据集成会拖慢回本。
