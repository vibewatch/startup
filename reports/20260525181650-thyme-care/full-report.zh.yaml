      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景应锚定证据，而不是乐观叙事
        blocks:
          - type: paragraph
            body: >-
              悲观情景不是崩盘叙事，而是按披露折价后的估值重置。如果持久的公开锚点只剩确认的独角兽下限、Accolade 私有化收购估值， 以及市场仍怀疑肿瘤基于价值护理能否持续为支付方创造节省，那么 Thyme
              合理的承销区间可能是 $0.6 billion 到 $1.0 billion。该区间假设公司真实且在增长，但投资人不愿在没有审计收入、留存或
              股权结构可见度的情况下支付溢价倍数。它也纳入一种可能：当前盈利说法比标题暗示的更窄或更不持久。


              基准情景是现有公开区间已大致正确：约 $1.0 billion 到 $1.5 billion。这个结果假设管理层的盈利说法经得起尽调，
              战略投资人继续打开渠道，未来披露显示肿瘤专科化相比通用导航形成了持久运营优势。 乐观情景要求的不只是持续讲故事。要承销高于 $1.5 billion、接近 Transcarent $2.2 billion
              估值的估值点， 投资人需要审计收入和利润率证明、主要合同续约并扩张的证据，以及更清晰的支持来证明 Thyme 的肿瘤专科模型配得上广平台定价。入场纪律从这些情景推导出来：在证明包改善前，
              资本应更偏向确认轮次下限附近的定价，而不是老股交易上限估值点。
