  - id: TP001
    title: 竞争者画像表
    columns:
      - 竞争者
      - 类别
      - 规模 / 公开信号
      - 目标细分
      - 关键差异化
      - 相对 Thyme Care 的关键限制
    rows:
      - - Thyme Care
        - 肿瘤导航 + VBC 赋能方
        - 8M 会员可接入；TCOP 覆盖 850+ 名肿瘤医生；预计 2025 年服务 40K+ 名癌症患者
        - 健康计划、雇主、承担风险的医疗服务方
        - 付款方风险对齐，加上直接肿瘤协作和面向药房的节省干预
        - 公开定价和同行评审结果仍有限
      - - OncoHealth
        - 面向付款方的肿瘤管理 + 支持性照护
        - 22 个健康计划伙伴；支持 15M 会员；4K 个雇主伙伴
        - 健康计划和雇主
        - 肿瘤专科深度强，结合利用管理和 24/7 支持性照护
        - 医疗服务方赋能网络不如 Thyme Care 可见
      - - Lantern
        - 雇主癌症导航 + 专科照护平台
        - 服务 12M 人；综合癌症解决方案覆盖 1M 会员；1,000+ 雇主
        - 大型雇主和福利团队
        - 高接触肿瘤护士导航，配合 NCI 评审伙伴和本地照护地点引导
        - 雇主中心定位不如 Thyme Care 具备付款方原生属性
      - - Transcarent + Accolade
        - 广义导航 + 照护 + 倡导平台
        - 20M+ 会员；1,700+ 雇主和健康计划客户
        - 自保雇主和健康计划
        - 在导航、癌症照护、权益倡导、专家意见、初级保健和药房上，集成广度最宽
        - 癌症只是更大平台中的一种体验，而非唯一运营焦点
      - - Included Health
        - 集成导航 + 专科照护栈
        - 4,000+ 专家；全国服务数百万人；设有 Cancer Center 的专科诊所
        - 雇主和健康计划
        - 组合导航、专家医学意见、专科可及、初级保健和心理健康
        - 癌症嵌在更广的专科和导航平台里
      - - Carrum Health
        - 打包式卓越中心癌症福利
        - 最大 COE 网络；单次治疗最高节省 30%；许多情况下会员 OOP 很低或为零
        - 自保雇主
        - 硬打包经济性替代方案，预先谈好价格，并配有顾问肿瘤医生
        - 长期导航和持续症状管理叙事较弱
      - - Navigating Care + OneOncology
        - 医疗服务方工作流和照护管理平台
        - 2,000 名提供者；约 1M 患者；OneOncology 网络背书
        - 社区肿瘤诊所
        - 诊所工作流、ePRO、用药依从性和价值医疗报销支持较强
        - 诊所外由付款方赞助的会员倡导较弱
      - - UnitedHealthcare / Evernorth / Cigna / Kaiser
        - 保险内嵌或整合交付的肿瘤支持
        - UHC 每年 30K+ 患者；全国 COE 和打包选项；整合照护团队
        - 现有计划会员和整合系统患者
        - 分发能力强、内置信任，在部分情况下无需新的点状解决方案
        - 支持质量和范围随出资方和产品而变
      - - Tempus / Guardant / ICON
        - 诊断和路径智能相邻领域
        - Tempus 覆盖 6.5K+ 肿瘤医生；Guardant 由 12K 医生完成 500K+ 测试；ICON 提供全球患者 / 站点服务
        - 医疗服务方、实验室、生物制药公司和患者
        - 可掌控路径指导、试验匹配、检测可及和患者支持中的高价值环节
        - 单独无法替代完整的导航和照护协同层
    notes: 各行强调主要直接同行、替代方案和相邻领域，它们都有可能从 Thyme Care 手中分流同一笔肿瘤支持预算或工作流；实际成交定价大多仍不公开。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most consequential public competitors and substitutes for 2026 procurement: direct oncology
        navigation, bundled programs, carrier-embedded alternatives, provider workflow platforms, and diagnostics
        adjacencies.
