  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议为观察：公司质量不错，但承销必须看价格
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 跨过了后期肿瘤服务投资的第一道门槛：它不再是概念型导航初创。2025 Series D 周边公开来源称， 公司已实现盈利，管理超过 $5 billion 肿瘤支出，并通过
              Medicare、商业保险和雇主合同将服务入口扩展到 8 million 人。投资人组合也重要。Morgan Health、Humana、Texas Oncology 和 Memorial Hermann
              不是泛化财务投资人； 它们是战略上相关的支付方和医疗服务方，参与融资意味着真实分发价值，也显示其对 Thyme 肿瘤专科导航、临床支持和护理成本负责制模型有一定信心。


              问题不只是公司质量，而是价格纪律。公开证据无法对齐到一个精确估值点。确认的下限只是 Series D 将 Thyme Care 推过 $1 billion。Tracxn 记录了一个 $1.0 billion
              投后估值点，对应 April 4, 2025 首次出售日期；Premier Alternatives 则基于老股交易式数据，显示截至 September 25, 2025 的 $1.5 billion
              隐含估值。没有审计收入、EBITDA、现金或股权结构细节， 投资人无法有把握地把这些估值点与公开可比标的归一化。这也是本章落在观察而不是买入的原因：
              公司可能因为肿瘤专科化值得溢价，但当前公开证据仍让价格看起来偏高，而不是明显有吸引力。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
              - CV033
              - CV037
              - CV045
