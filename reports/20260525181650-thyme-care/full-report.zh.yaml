      - number: '4.5'
        title: 结论：经济性有希望，但公开信息仍不足以承保
        blocks:
          - type: paragraph
            body: >-
              财务结论好于披露质量。Thyme Care 看起来有真实商业模式，不是披着业务外衣的试点：由出资方付费的合同已在 Medicare Advantage、商业、雇主赞助和 EOM
              渠道上线；公司至少在部分合同中承担真实绩效风险；AON/Humana
              案例证据显示，支付方和服务方愿意把价值医疗经济性与该服务绑定。这支持我们相对那些只卖互动软件的纯导航厂商，对收入质量做出更正面的判断。这个模型似乎也比资产重的医疗企业轻资本，因为现金需求来自人工、实施和风险结算时点，而不是库存或重资本开支。


              障碍在于，几乎所有能把它变成可融资毛利率故事的承保变量都仍是私有。CMS 的肿瘤模型评估是有用警示：即便照护周期支出下降，计入月度支持付款和绩效奖金后，支付方经济性仍可能令人失望。Thyme Care
              也许能避开这个坑，但公开档案没有证明。下一步尽调因此很具体，不是概念讨论：审阅代表性支付方合同、基准计算、对账报表、出资方层队列毛利率、当前现金和烧钱速度，以及 Thyme Care, Inc. 与 Thyme
              Care Medical 按实体拆分的财务。做到这些之前，正确判断是有希望，但尚未承保。
