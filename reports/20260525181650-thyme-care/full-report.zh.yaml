              28%；过渡护理项目再入院率低 30%；88% 受访会员感觉支持更多。Thyme Care 自己的 North Carolina 页面称 73% 会员避免了额外 ER 或医生行程，并给出 9/10
              满意度；后续公司新闻称支付方合同下会员满意度一直在 90% 左右。投诉流程也已规范化， 有公开升级路径和 30 天书面回复期限。但耐久性盲点很实质：审阅的公开记录没有披露净留存率（NRR）、总留存率（GRR）、
              客户流失、合同期限、续约节奏或客户层面收入集中度。因此，公开证据更能支持产品有用性和客户体验， 远弱于支持客户标识留存或收入耐久性。
