      - number: '4.3'
        title: 模型人力密集，毛利率逻辑取决于节省额能否持续跑赢人工和集成成本
        blocks:
          - type: paragraph
            body: >-
              成本基础明显偏劳动密集。Thyme Care 的服务方和照护团队页面描述了一个 7×24 小时虚拟模型，由肿瘤护士、执业护士、社工、照护伙伴、入组专员、医学总监和姑息治疗医生组成；公司称现在已有 500+
              名全职雇佣、接受过肿瘤训练的专业人员。2025 年照护团队扩充公告把进一步招聘与商业和 Medicare Advantage 增长挂钩；招聘板也持续塞满
              RN、社工和照护交付岗位。这意味着公司不是资本密集型资产建造者，但也不是低接触软件供应商；经常性工资、督导、排班、执照和培训很可能是主要毛利负担。


              公开案例研究仍说明，只要执行够紧，这个模型在经济上可以跑通。HCTTF 将 60-70% 的节省归因于避免急性医疗利用，30-40% 归因于药品开支下降；AJMC 和 AON 则报告 EOM 首期节省接近 $6
              million，并获得基于绩效的付款。成效数据方向上强：ePRO 参与成员相对风险下降 28%，转衔照护队列再入院率降低 30%，满意度 90%，且患者和服务方时间节省可量化。但验证质量不均。HCTTF
              明确表示没有独立验证 Thyme Care 的内部分析，公开记录仍缺少出资方层毛利率、利用率基线和每成员照护团队成本。因此，毛利率路径可信，但仍依赖管理层精选的证据点。
