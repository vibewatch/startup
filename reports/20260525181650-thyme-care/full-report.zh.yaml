      - number: '4.4'
        title: 公开规模真实且很近，但外部仍无法判断资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开牵引力已足以纳入判断。2025—2026 年材料显示，Thyme Care 称其拥有 80,000 名主动治疗中的癌症患者或 85,000 名成员、8 million 可触达覆盖人群、超过 1,400
              名肿瘤科医生，并在 2025 年底管理超过 $5 billion 肿瘤开支。这些不是经审计收入指标，但说明公司已经不再是试点规模。最新资本证据也有意义：2025 年 Form D 记录了 $100.0
              million 发行中已售 $97.0 million，与公司公告的 Series D 一致。同一轮被描述为使 Thyme Care 估值超过 $1 billion，并为更多
              AI、面向成员的技术、照护交付和伙伴扩张提供资金。2021 年和 2023 年更早的 SEC 文件显示，公司在那之前已经能融到实质轮次。


              也就是说，公开数据仍不足以完整判断资本充足性。Fierce 报道管理层称 Thyme Care 在 2025 年 9 月已经盈利，但没有 GAAP
              收入、EBITDA、现金、烧钱速度、现金跑道或债务披露。也没有公开合同组合显示收入有多少来自 Medicare
              Advantage、商业、雇主、EOM、服务方项目或药房服务。务实读法需要细分：近期大额轮次、战略投资人和管理层盈利说法，都降低了短期融资危机概率。但在私下共享资金库数据和出资方层单位经济性之前，投资人无法区分这是一个资本舒适的运营商，还是一个仍需要持续扩张来吸收庞大临床工资单的快速增长业务。
