      - - 隐私 / HIPAA / 网络安全风险
        - 需报告事件、OCR 投诉，或相对 HHS 当前预期的控制缺口
        - 任何需报告泄露、关键供应商 BAA 覆盖缺失，或反复红队 / 审计失败
        - 暂停提高确信度；在承保增长假设前，要求整改计划、事件成本估计和控制复测
      - - 合作伙伴集中风险
        - 头部支付方 / 服务方 / 雇主关系带来的收入或归属会员集中度
        - 头部合作伙伴或合作伙伴集群超过管理层 12 个月内无法补位的水平，或一次重大上线延迟 / 取消
        - 因渠道脆弱性，重评商业化假设并下调估值
      - - 人员配置和照护质量风险
        - 临床招聘、流失和个案量指标
