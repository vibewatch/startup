      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              公开领导班子由创始人主导，并且仍集中在少数高管身上。Robin Shah 是联合创始人兼首席执行官；Bobby Green 是联合创始人、首席医疗官兼总裁；Brad Diephuis
              在融资材料中以总裁兼首席运营官身份出现。公开团队页还列出 Jesse Waldron 担任首席财务官、Marcia Macphearson 担任首席运营官、Michael Markowicz
              担任首席法务官。也就是说，Thyme Care 在财务、运营、法务、支付方 / 服务方合作和产品上都有可见覆盖，但一到战略、临床可信度或投资人叙事，公司对外故事仍高度依赖 Shah、Green 和
              Diephuis。营销领导层通过 Nikkayla Page（营销与传播副总裁）可见，但在已审阅来源中没有找到首席营销官头衔。


              2024 年以来的领导层补充拓宽了班子。Lalan Wilfong 在 2024 年 8 月加入并负责价值医疗，此前在 Texas Oncology 和 The US Oncology Network
              担任高级职位；2025 年 7 月的扩充又为生存期照护和姑息治疗配备了专职医学总监。治理可见度好坏参半。团队页现在列出一个有分量的董事会名单，除创始人外，还包括来自 Andreessen
              Horowitz、Concord、CVS Health Ventures、Echo Health Ventures、Town Hall Ventures 和 Frist Cressey Ventures
              的投资人代表；Series B 材料也明确披露 David Whelan 和 Elizabeth Canis
              新增董事席位。同样重要的是仍未公开的部分：公开来源没有披露委员会结构、观察员权利、保护性条款或当前控制权地图，后续尽调只能把治理视为部分透明。
