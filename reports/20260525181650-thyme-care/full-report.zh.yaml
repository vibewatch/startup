  - id: TP003
    title: 定价 / 打包方案对比
    columns:
      - 竞争对手
      - 公开定价信号
      - 合同 / 打包模式
      - 已包含能力
      - 仍不透明之处
      - 对 Thyme Care 的影响
    rows:
      - - Thyme Care
        - 未公开 PEPM 或节省分成费率表
        - 价值导向肿瘤支持，绑定支付方 / 服务方责任
        - 7×24 小时照护团队、服务方协调、数字支持、药房干预
        - 各细分客群的实际经济性和保证结构
        - Thyme 必须靠成效和集成取胜，而不是公开标价
      - - OncoHealth
        - 未公开标价
        - 健康计划肿瘤管理和支持照护合同
        - 利用管理、支持照护、导航、7×24 小时护理
        - 按病例费率、PMPM 和绩效保证
        - 直接面向支付方的替代方案，预算所有者相似且定价不公开
      - - Lantern
        - ROI 目标公开；标价不公开
        - 雇主专科照护福利合同
        - 肿瘤护士导航、通过 AccessHope 获得 NCI 评审、就医地点引导、临床试验匹配
        - 会员费用、保证机制和支付方打包方式
        - 当雇主节省叙事比支付方风险更重要时，Lantern 竞争力强
      - - Included Health
        - 未公开标价
        - 面向雇主 / 健康计划销售的更宽导航与照护平台
        - 导航、专家医学意见、专科照护、初级保健、心理健康
        - 癌症支持是单独打包，还是并入企业级交易
        - 更宽产品套件可用组合定价压低癌症导航价格
      - - Transcarent + Accolade
        - 未公开标价
        - 面向雇主和健康计划的整合平台
        - 癌症、权益倡导、专家意见、初级保健、药房、WayFinding AI
        - 实际 PMPM、可信合作伙伴模块抽成率，以及肿瘤专项定价
        - 平台宽度可能把买方重点从肿瘤 ROI 转向全平台整合
      - - Carrum
        - 单次治疗最高节省 30%；许多情形下会员几乎无 OOP
        - 预先谈定的癌症疗程打包支付，叠加顾问项目
        - COE 准入、顾问肿瘤医生、导航、财务保护
        - 节省如何在雇主与服务方之间分配，以及哪些疗程符合条件
        - 公开的打包经济性让 Carrum 在 RFP 中成为最清晰的定价替代项
      - - Evernorth / 保险公司项目
        - 单一共付额打包和嵌入式福利表述已公开
        - 计划设计内嵌的保险福利或肿瘤附加项
        - 专属团队、虚拟支持、COE 准入、福利导航、打包计费
        - 计划发起方的增量供应商成本和成效保证
        - 嵌入式选项会让新的独立供应商显得重复
      - - Navigating Care + OneOncology
        - 未公开定价
        - 服务方软件和管理服务经济性
        - 患者门户、ePRO、报销支持、用药依从性
        - 按站点 SaaS 和收入分成机制
        - 服务方既有位置会降低另购会员导航层的意愿
    notes: 只有 Carrum 和 Evernorth 公开了清晰的支付机制；留存来源多数把买方引向演示或客户团队，因此本表区分公开打包方式和隐藏的实际经济性。
