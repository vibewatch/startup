      - number: '5.5'
        title: 信任基础更多来自法律边界和工作流纪律，而非公开认证页
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 的公开信任与合规姿态看得见，但不完整。隐私政策称，与医疗服务方和医保计划客户之间受 HIPAA
              约束的安排决定受保护健康信息（PHI）的处理方式；使用条款则把服务界定为在线或移动端软件、护理协调和远程医疗支持， 交付主体是 Thyme Care Medical，而非 Thyme Care, Inc.
              直接提供。条款还说明，远程医疗不能替代完整医学评估或线下肿瘤就诊， Thyme 医疗人员也不主导癌症诊断或开具癌症治疗处方。这些边界很关键：Thyme 把产品定位为支持和协调层， 而不是自主癌症管理系统。


              更大的尽调问题，是工作流证据和公开控制证据之间的落差。Thyme 公开记录了经验证的心理社会工具、结构化 ePRO 和 HRSN 筛查，以及护理团队手册；招聘版图也包含 AI
              治理、安全、隐私和平台岗位。但留存的公开记录没有披露外部安全认证、 独立审计报告、具体 EHR 供应商、API 细节、可用性承诺，也没有说明新闻材料所称动态病情分级与优先级逻辑的验证细节。 再加上价值主张依赖
              24/7 持证人员、地方工作流买入和庞大的护理团队配置，核心产品风险就很清楚： 这是一个可信但服务密集的系统；仅凭公开材料，运营上比技术上更容易被信任。
