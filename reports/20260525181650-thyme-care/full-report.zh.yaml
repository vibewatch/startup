        - from: care_team
          to: thyme
          label: 24/7 导航、TOC、姑息、社会支持
        - from: data_stack
          to: thyme
          label: 风险分层和 ROI 衡量
        - from: compliance
          to: thyme
          label: 守住数据、AI 和远程医疗工作流可用性
        - from: leadership
          to: thyme
          label: 战略、融资、治理、执行
        - from: capital
          to: thyme
          label: 现金跑道加战略渠道验证
        - from: tcop
          to: data_stack
          label: 共享工作流和 EHR 联动干预
    approximationNotes: null
    claimRefs:
      - CR014
      - CR030
      - CR031
      - CR034
      - CR035
      - CR036
      - CR043
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从披露牵引力和估值冲突，推导最终观察判断的推荐链条。
    data:
      nodes:
        - id: traction
          label: 牵引力：盈利宣称、>$5B 管理支出、8M 可触达
          type: input
        - id: strategic
          label: 战略证明：付款方 / 服务方投资者加入 Series D
          type: input
        - id: conflict
          label: 估值冲突：>$1B 底线 vs $1.5B 老股交易标记
          type: input
        - id: comps
          label: 上市可比公司以 0.21x-1.16x EV/Sales 交易
          type: input
        - id: synthesis
          label: 综合：是真资产，但价格支撑仍不完整
          type: process
        - id: decision
          label: 决策：观察 / 中等信心 / 偏高
          type: output
      edges:
        - from: traction
          to: synthesis
        - from: strategic
          to: synthesis
        - from: conflict
          to: synthesis
        - from: comps
          to: synthesis
        - from: synthesis
          to: decision
    approximationNotes: null
    claimRefs:
      - CV005
      - CV008
      - CV011
      - CV033
      - CV045
  - id: FV002
    title: 退出倍数假设下的估值敏感性
    type: bar
    layout: standard
    summary: 收入仍未披露时，上市可比公司的 EV/Sales 倍数为投资者使用的退出倍数敏感性提供边界。
    data:
      items:
        - label: agilon EV/Sales
          value: 0.21
          unit: x
        - label: Evolent EV/Sales
          value: 0.68
          unit: x
        - label: 上市可比公司中位数
          value: 0.73
          unit: x
        - label: Astrana EV/Sales
          value: 0.77
          unit: x
        - label: Privia EV/Sales
          value: 1.16
          unit: x
    approximationNotes: 这些是上市可比公司倍数，不是 Thyme 当前特定倍数。它们只用于框定退出倍数思考，因为 Thyme 不公开披露收入。
    claimRefs:
      - CV022
      - CV025
      - CV028
      - CV031
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由证据约束的悲观、基准和乐观情景股权价值区间。
    data:
      items:
        - label: 悲观情景
          low: 0.6
          mid: 0.85
          high: 1
          unit: USD B
        - label: 基准情景
          low: 1
          mid: 1.25
          high: 1.5
          unit: USD B
        - label: 乐观情景
          low: 1.5
          mid: 1.85
          high: 2.2
          unit: USD B
        - label: 当前公开支撑区间
          low: 1
          mid: 1.25
          high: 1.5
          unit: USD B
    approximationNotes: 区间锚定四个参照：已披露 >$1B 下限、$1.5B 类老股交易估值点、Accolade $621M 私有化收购， 以及 Transcarent $2.2B 估值；不是折现现金流输出。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 从投委会视角给估值论证打分，采用 1-5 分制，5 分最强。
    data:
      items:
        - label: 市场顺风
          value: 4
          note: 癌症费用压力叠加战略赞助方兴趣，支撑这一品类的重要性。
        - label: 战略验证
          value: 4
          note: Morgan Health、Humana、Texas Oncology 和 Memorial Hermann 增强了渠道可信度。
        - label: 经济性可见度
          value: 2
          note: 新闻稿称公司已盈利，但经审计收入和现金数据仍不可得。
        - label: 可比支撑
          value: 2
          note: 公开可比标的倍数偏温和，削弱软件式估值叙事。
        - label: 政策风险
          value: 2
          note: CMS 肿瘤模型评估仍显示净节省结果有好有坏，甚至偏负面。
        - label: 退出准备度
          value: 2
          note: 按当前披露深度，战略退出比 IPO 更可行。
        - label: 估值纪律
          value: 2
          note: $1.0B 与 $1.5B 之间的价差仍未解释，价格支撑不完整。
        - label: 证据质量
          value: 3
          note: 融资轮真实，可比公司组有用，但财务证据包仍不完整。
    approximationNotes: 评分是定性投资判断辅助，不是加权模型输出。
    claimRefs:
      - CV037
      - CV038
      - CV042
      - CV045
