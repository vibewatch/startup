      - - 治理 / 关键人物风险
        - 创始人 / 高级运营负责人离任或角色被削弱，且没有可信继任安排
        - CEO、CMO / 总裁或其他关键运营负责人离任，且未指定继任者和连续性计划
        - 升级治理和执行风险尽调；若叠加合作伙伴动能放缓，则视为投资逻辑破裂
      - - 财务证明风险
        - 公开盈利叙事与私有财务包之间的对账
        - 管理层无法把盈利主张对齐到经审计或董事会级的出资方经济性
        - 转为继续研究 / 回避，除非价格足以补偿披露风险
    notes: 阈值是投资人监控框架，不是公司披露目标。阈值设计目的，是把公开证据缺口转成尽调关口，在完整运营失误显现前就能证伪投资逻辑。
    claimRefs:
      - CR011
      - CR017
      - CR021
      - CR023
      - CR028
      - CR031
      - CR032
      - CR033
      - CR036
  - id: TV001
    title: 推荐结论摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 投资建议
        - 观察
        - 没有更好的证据包，不要追逐老股式估值标记。
      - - 确信度
        - 中
        - 公开证据方向不错，但估值支撑不完整且相互冲突。
      - - 风险评级
        - 高
        - 业务看起来真实，但当前价格支撑仍依赖公司主张和二级市场数据。
      - - 估值立场
        - 偏高
        - 公开证据支持独角兽估值底部，但撑不起可清晰承保的溢价标记。
      - - 入场纪律
        - 价格更应贴近已确认的 >$1B 底部，而不是 $1.5B 老股标记
        - 支付区间上沿价格前，要求经审计的 2025 年财务和股权结构表细节。
    notes: 评估综合 SEC 文件、公司和媒体融资报道、公开代理倍数和政策模型下行情景证据，并有意避免对当前企业价值给出虚假精度。
    claimRefs:
      - CV011
      - CV012
      - CV038
      - CV040
      - CV045
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑 / 何种证据会改变判断
    rows:
      - - 战略背书
        - Morgan Health、Humana、Texas Oncology 和 Memorial Hermann 参与，说明买方需求真实存在。
        - 战略方名字不能证明单位经济性持久；若这些关系转化为经审计的续约和扩张数据，判断会改善。
      - - 运营证明
        - 新闻稿称 Thyme 已盈利，管理 >$5B 肿瘤支出，触达 8M 人。
        - 上述指标仍主要是公司口径；若有经审计收入、EBITDA 和队列留存，判断会改善。
      - - 品类溢价
        - 肿瘤专科化相比通用导航供应商，可获得一定溢价。
        - 公开代理倍数仍更像服务业，不像软件；若 Thyme 展示出优于广义平台的利润率或留存，判断会改善。
      - - 当前价格支撑
        - 已确认的 >$1B 融资轮为后期估值提供可信底部。
        - 当前精确标记在公开来源间仍有冲突；若管理层解释 $1.0B 与 $1.5B 的差距，判断会改善。
      - - 退出路径
        - 战略并购仍有可能，因为现有巨头仍需要肿瘤工作流和导航能力。
        - 没有经审计披露时，IPO 准备度看起来低；只有出现上市公司级报告节奏后，判断才会改善。
    notes: 反向逻辑列刻意采用行动导向：每一项都指出会推动建议变化的证据，而不只是风险本身。
    claimRefs:
      - CV007
      - CV011
      - CV037
      - CV038
      - CV042
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 显性假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 悲观
        - 盈利主张经不起推敲，经审计收入仍未披露，投资人以公开导航公司和政策风险锚为参照承保 Thyme。
        - $0.6B-$1.0B 区间，以 Accolade $621M 私有化和 Thyme 已确认独角兽底部为锚。
        - 若尽调无法调和估值冲突，或新一轮定价低于独角兽叙事，该情景概率更高。
        - 即便公司运营规模继续增长，估值重置仍可能发生。
      - - 基准
        - 盈利真实，战略投资人继续扩大触达，尽调缩小但没有消除披露缺口。
        - $1.0B-$1.5B 区间，以已确认轮次支撑和当前可见老股标记为锚。
        - 若经审计收入 / 现金数据可接受，但仍不足以支撑广义平台定价，该情景最可能。
        - 如果 $1.5B 标记反映的是清淡老股交易，而非持久融资水平，投资人可能买贵。
      - - 乐观
        - 经审计财务确认盈利持久，支付方留存强，肿瘤专科化获得接近广义导航龙头的溢价。
        - $1.5B-$2.2B 区间，以上沿老股标记和 Transcarent $2.2B 私有估值为锚。
        - 需要新的证据，而不只是更多曝光：经审计收入、利润率持久性，以及验证上沿区间的融资或战略事件。
        - 公司业务范围仍更窄，披露低于 Transcarent，因此溢价平价不会自动成立。
    notes: 区间只是股权价值启发式，不是 DCF 输出。锚点来自已披露轮次标记、私有平台估值和公开基准压力，而非未披露的当前收入基数。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV044
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 估值
      - 状态
      - 参考价值
      - 局限
    rows:
      - - Thyme Care（已确认轮次口径）
        - '> $1.0B Series D 后估值；已售 $97.0M；公开口径累计融资 $275M'
        - 私有后期肿瘤导航 / VBC 赋能方
        - 当前最好的入场纪律底部，因为直接绑定实际 2025 年融资
        - 仍不是精确投后估值；公开来源没有对账到单一数字
      - - Thyme Care（老股 / 市场数据标记）
        - $1.5B 估值；Premier Alternatives 显示累计融资 $280.6M
        - 私有老股式标记
        - 代表当前公开市场数据支撑的上沿
        - 方法不透明，且未经新一轮一级融资确认
      - - Transcarent
        - $2.2B 估值；融资 $424M（Tracxn）
        - 私有广义导航平台
        - 可作为导航赛道上界可比，公司照护体验覆盖更广
        - 范围远宽于 Thyme，且并非肿瘤专科
      - - Accolade
        - $621M 股权价值私有化，价格 $7.03/股
        - 2025 年被收购的前上市导航平台
        - 说明公开市场对广义导航资产的定价可以多严苛
        - 倡导和初级保健组合更宽，使其不是完美肿瘤代理
      - - OneOncology
        - ~$5.0B 现金对价 / 2025 年 $7.4B EV 口径
        - 规模化肿瘤服务平台
        - 显示当规模和基础设施大得多时，成熟肿瘤服务资产可值多少钱
        - 服务方网络 MSO 经济性比 Thyme 披露模型资本化得多
      - - 公开代理篮子（Evolent / Astrana / Privia / agilon）
        - 0.21x-1.16x EV/sales；中位数 ~0.73x
        - 公开价值医疗 / 医生赋能代理
        - 服务属性较重的医疗运营商中，最可用的公开倍数区间
        - 上述公司都披露收入，且比 Thyme 更多元，因此只能作方向性参考，不能直接可比
    notes: 本可比集合并不完整，聚焦截至运行日期在公开来源中最有决策价值的私有和公开参照。Included Health 仍可作为业务宽度参照，但可访问预览没有给出清晰的当前估值标记。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful open-source private navigation, oncology-services, and public value-based-care
        references available as of the 2026 run date; direct oncology-navigation valuation data remain sparse in public.
    claimRefs:
      - CV014
      - CV017
      - CV018
      - CV021
      - CV023
      - CV026
      - CV029
      - CV032
      - CV033
  - id: TV005
    title: 投资逻辑破裂与否决触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 降价融资
        - 任何新一轮一级融资低于公开独角兽叙事，或明显低于 2025 年披露底部
        - 说明老股或媒体口径估值标记高估了真实成交价值
        - 在重新核算价格和优先股堆叠前，先按投资逻辑破裂处理
      - - 盈利逆转
        - 管理层撤回盈利说法，或经审计结果显示存在重大经营亏损
        - 这会削弱为其支付高于通用导航厂商溢价的核心理由
        - 暂停进入，直到重新验证单位经济性
      - - 估值冲突未解
        - 管理层在尽调中无法解释 $1.0B 与 $1.5B 估值标记的差异
        - 这会说明估值支撑仍太拼凑、太碎片化
        - 按区间低端锚定，或直接放弃
      - - 政策 / 节省不及预期
        - 新证据显示，Thyme 类肿瘤项目无法为支付方带来持久节省
        - 这会压缩整个肿瘤 VBC 平台品类的付费意愿
        - 采用悲观情景区间，并要求更大折扣
      - - 战略客户流失
        - 失去标杆支付方 / 服务提供方赞助方，或合同扩张停滞
        - 这会削弱支撑本轮叙事的战略溢价理由
        - 继续尽调前，先重审增长假设
    notes: 阈值刻意按事件设定，因为 Thyme 没有披露内部经营指标，无法支撑更清晰的数字触发线。
    claimRefs:
      - CV034
      - CV035
      - CV038
      - CV044
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计的 2025 财务数据
        - 收入、毛利率 / 护理毛利率、EBITDA、现金和烧钱速度
        - 没有这些数据，就无法有把握地把当前估值标记归一到任何公开倍数
        - 索取经审计的 2025 财务包，以及 2026 年初至今董事会材料
      - - 股权结构表和优先权
        - 分轮所有权、清算优先权、参与权条款和期权池
        - 没有这张视图，下行情景价值可能与名义投后估值相差很大
        - 审阅股权结构表、股票账簿和 Series D 条款清单
      - - 估值对账
        - Premier Alternatives 的 $1.5B 估值标记方法，以及 Tracxn 为何显示 $1.0B / Apr. 4, 2025
        - 这决定上端估值标记到底可投，还是只具指示性
        - 要求管理层和领投方对齐新股与老股参考
      - - 队列经济性
        - 支付方 / 雇主 / 服务提供方队列留存、总节省、Thyme 抽成率和回本周期
        - 证明盈利说法是否持久，还是集中在少数客户身上
        - 审阅队列仪表盘和合同级对账
      - - 客户集中度
        - 按支付方、服务提供方、雇主和渠道拆分的收入结构
        - 即便是战略轮融资，也可能遮住集中度风险
        - 索取前 10 大客户集中度和续约日历
      - - 退出准备度
        - 披露准备度、治理和买方地图
        - 厘清现实路径是战略并购，还是继续作为私营公司复利增长
        - 审阅董事会关于融资策略、投行接触和治理成熟度的材料
    notes: 条目按其对估值信心的直接影响排序。前三项是在当前公开区间上端承销前的门槛尽调问题。
    claimRefs:
      - CV011
      - CV012
      - CV021
      - CV043
