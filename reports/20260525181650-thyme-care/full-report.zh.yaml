  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河或风险领域
      - 重要性
      - 反向证据 / 威胁
      - 严重性
      - 影响或尽调追问
    rows:
      - - 支付方风险对齐
        - 买方需要癌症专项总成本责任时，Thyme 最强
        - 保险公司和 Evernorth 已把肿瘤支持打包进既有福利关系
        - 高
        - 核实 Thyme 拿到的是净新增预算，还是主要补强那些已不满保险公司支持的发起方
      - - 服务方协作
        - TCOP 和肿瘤诊疗机构集成是 Thyme 价值叙事的核心
        - Navigating Care 和 OneOncology 掌握更多诊所日常流程和报销管线
        - 高
        - 测试服务方工作流的既有卡位是否限制 Thyme 在社区肿瘤场景扩张
      - - 会员体验护城河
        - 7×24 小时导航和人工支持在癌症治疗中建立信任
        - Lantern、Transcarent、OncoHealth 和保险公司项目都在营销人工肿瘤支持和护士主导的导航
        - 中-高
        - 判断 Thyme 的满意度和依从性数据，在可比队列中是否跑赢这些替代方案
      - - 更宽平台宽度
        - 部分买方更偏好单一健康入口，而不是仅覆盖癌症的方案
        - Transcarent / Accolade 和 Included Health 将权益倡导、初级保健等品类与癌症支持一起打包
        - 高
        - 评估 Thyme 不扩到肿瘤之外，能否守住品类所有权
      - - 打包疗程经济性
        - 合同结构可见时，硬性节省更容易站住脚
        - Carrum 和 Evernorth 公开打包支付或单一共付额机制，Thyme 定价仍不公开
        - 中
        - 在判断价格竞争力前，索取实际合同基准和保证条款
      - - 证据基础
        - 独立成效研究能支撑经纪商和支付方尽调
        - Navigating Cancer 可引用公开成效研究，而 Thyme 最强的公开证据来自合作伙伴和公司材料
        - 高
        - 索取独立精算验证和续约案例研究
      - - AI / 路径商品化
        - 导航软件在功能层最容易被复制
        - Included Health、Transcarent、Tempus 等都在营销 AI 驱动的指导或路径智能
        - 中-高
        - 估值时更看重照护模型和数据关系，而不是泛化 AI 营销
      - - 多供应商并用风险
        - 买方可能围绕同一癌症旅程保留多家供应商
        - 保险公司项目、服务方平台、诊断供应商和打包疗程都可与导航共存
        - 中
        - 建模部分替代风险，不要假设赢家通吃份额
    notes: 严重性反映对竞争耐久性的预期影响，而非发生概率；每一行都把公开信号转成尽调优先级。
