          - type: paragraph
            body: >-
              Thyme 的运营模型更像分布式肿瘤服务平台，而不是轻量软件供应商。审阅时招聘页显示 33 个开放岗位，其中 16 个类临床岗位，覆盖肿瘤护士导航员、社工、姑息治疗临床人员和护理交付管理，另有 AI
              治理、隐私、安全专岗。 公开材料还显示，公司继续投入生存者护理、姑息治疗和社工能力，这会强化护理主张，但也确认扩张需要持续搭人， 不只是多花一点云支出。外部劳动力市场并未变容易，这一点很关键：ASCO 称 55
              岁及以上美国人中有 68% 生活在肿瘤医生覆盖存在风险的县；HRSA 预计医生短缺将持续到 2038 年，非都市地区的供给充足性更差。 Thyme
              可以用虚拟导航和远程医疗缓解部分压力，但它自己的证明模型仍依赖与肿瘤医生协同的工作流、快速分诊、 护理过渡项目，以及更紧密的药物管理执行。强调节省的同一份 HCTTF 案例研究还说，60-70%
              的节省来自急性护理减少， 而只有 60-70% 的肿瘤医生遵循推荐的高价值药物干预；这意味着运营漂移会很快传导成经济表现不佳。
