      - number: '3.2'
        title: 直接肿瘤导航对手
        blocks:
          - type: paragraph
            body: >-
              Thyme Care 最尖锐的直接威胁，是那些无需买方重构其他环节、就能卖给健康险计划或自保雇主的肿瘤专注厂商。OncoHealth
              是保留下来的来源集中最清晰的支付方面向直接同行：它结合肿瘤管理和支持性照护，声称拥有 22 家健康险计划伙伴、支持 15 million 成员的显著规模，并明确称产品只为肿瘤打造。Lantern 同样肿瘤专属，但
              GTM 更由雇主牵引，差异化来自高接触肿瘤护士导航、低于 10 天的预约可及性，以及 2026 年 AccessHope 合作带来的 NCI 指定专家评审和临床试验匹配。Included Health
              是更宽的在位者，不是单一品类同行，但仍重要，因为其 Expert Medical Opinion 服务和较新的 Specialty Care Clinic
              让雇主能在更宽的导航和虚拟照护合同中购买癌症相关支持。Transcarent 吸收 Accolade 后更难忽视，因为合并平台现在把癌症照护与权益倡导、专家意见、初级保健、药房和 AI 主导导航打包，规模明显大于
