  - id: FI001
    title: 收入模型桥接
    type: flow
    layout: wide
    summary: 公开证据显示，Thyme Care 把赞助方合同和归因癌症人群转化为有风险的服务收入，方式是降低总护理成本；但具体费率表仍未公开。
    data:
      nodes:
        - id: sponsor-contract
          label: 医疗计划、雇主或承担风险的服务提供方签约
