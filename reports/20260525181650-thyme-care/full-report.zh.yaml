  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方待完成任务
        blocks:
          - type: paragraph
            body: >-
              Thyme Care
              所处竞争集合比纯肿瘤导航更宽。支付方或承担风险的服务方可以购买癌症专属支持厂商、更宽的健康导航平台、打包的卓越中心项目、社区肿瘤工作流平台，也可以直接依赖保险公司和整合交付体系福利中已有的肿瘤支持。Thyme
              Care 自己的公开材料强调 7×24 小时肿瘤训练支持、服务方协作、负责任的价值医疗安排，以及 Thyme Care Connect
              等数字工具。因此，最接近的同类同行，是把肿瘤专属指导与支付方级部署或照护成本责任结合起来的厂商，尤其是 OncoHealth、Lantern 和合并后的 Transcarent
              平台。但采购现实比这些直接同行更宽。Included Health 可以靠更广义导航加专科照护竞争，Carrum
              可以拿下想要疗程打包方案的买方，保险公司或卫生系统项目则可能让独立供应商显得重复。真正的买方问题不只是「还有谁有肿瘤护士」，而是谁能在不迫使出资方和肿瘤科医生重建其余照护旅程的前提下，减少摩擦、改善结果并降低成本。
