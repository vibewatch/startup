      - number: '3.3'
        title: 替代品和嵌入式替代方案
        blocks:
          - type: paragraph
            body: >-
              替代品重要，因为许多买方在评估 Thyme Care 之前，已经拥有肿瘤支持堆栈的一部分。Carrum
              是最清晰的硬经济学替代品：它不提供同样的纵向模型，但能给雇主预先谈好的癌症疗程、虚拟肿瘤咨询和明确的节省表述，一些福利团队可能更偏好这种方案，而不是以导航为先的合同。保险公司和整合交付体系替代方案在结构上更重要。UnitedHealthcare、Cigna、Evernorth
              和 Kaiser 都发布肿瘤支持或癌症照护资源，把护士指导、福利导航、卓越中心可及性或整合照护团队嵌入成员已经信任的出资方关系中。服务方一侧，Navigating Care 和 OneOncology 通过
              ePRO、远程监测、用药依从性工具和报销支持占据社区肿瘤工作流；它们公开披露的成效证据强于多数导航厂商。Tempus、Guardant 和 ICON 不能完整替代 Thyme
              Care，但它们可以把路径智能、检测可及性、试验匹配和患者支持任务模块化，而这些任务曾支撑更宽的导航价值主张。
