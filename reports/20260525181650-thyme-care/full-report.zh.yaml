      - number: '8.6'
        title: 展示项
        blocks:
          - type: callout
            title: 建议：观察，不买入
            body: Thyme Care 看起来具有战略相关性，运营也可信，但当前公开证据不足以在没有审计财务和股权结构透明度的情况下， 为可见估值区间顶部买单。
            calloutType: recommendation
            claimRefs:
              - CV038
