              接入工作流的肿瘤诊所或初级保健集团；终端用户则是在肿瘤就诊间隙获得导航、 症状管理和社会资源支持的患者或照护者。公开证明在支付方赞助和医疗服务方赞助渠道最强：Humana、Aetna、Clover、Premera
              和 Blue Cross NC 都有专门的会员页面；CenterWell/Conviva、Oak Street、Vytalize、EmblemHealth 和具名 TCOP
              诊所则显示医疗服务方和承担风险的医疗服务方采用。地域也按渠道分层，而不是一个全国模板。Humana 公开点名 7 个 Medicare Advantage 州，CenterWell/Conviva 点名 7
