    diligencePath: Obtain segment P&L and cohort margin files with utilization, clinical payroll, and implementation allocations.
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
