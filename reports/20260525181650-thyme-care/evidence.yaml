evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-control-rights
    missingEvidence: >-
      Current ownership percentages, board committees, observer rights, protective provisions, and any debt covenant
      constraints tied to major investors.
    whyItMatters: These details determine who can actually influence strategy, future financings, and downside protection.
    diligencePath: >-
      Request the current cap table, board roster with committee assignments, investor side-letter summary, and any debt
      summary from management or lead investors.
    relatedQuestionRefs:
      - QO015
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation-round-timing
    missingEvidence: Official post-money valuation for the Series D and management-confirmed canonical close date for the latest round.
    whyItMatters: >-
      Valuation benchmarking and round chronology are central to later financial and valuation chapters, and the public
      record is not internally consistent.
    diligencePath: >-
      Request the signed financing announcement package, lead-investor confirmation, or cap-table snapshot showing the
      actual close date and post-money valuation.
    relatedQuestionRefs:
      - QO014
      - QO024
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: customer-revenue-disclosure
    missingEvidence: >-
      Exact active-customer count, contract count, current revenue or ARR, and a clean bridge between members, covered
      lives, and employer-sponsored membership.
    whyItMatters: >-
      These metrics govern operating leverage, sales efficiency, and any real assessment of how much of the valuation is
      already in the price.
    diligencePath: >-
      Request a current KPI pack split by members, covered lives, active contracts, revenue, and ARR, with definitions
      for each metric.
    relatedQuestionRefs:
      - QO020
      - QO025
      - QO026
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: legal-entity-record
    missingEvidence: >-
      A canonical incorporation filing and legal-entity tree tying Thyme Care, Inc., Thyme Care Medical, PLLC, and Bobby
      Green Medical, P.C. together.
    whyItMatters: Entity structure affects contracting, clinical liability boundaries, and diligence on intercompany arrangements.
    diligencePath: Pull the Delaware and Tennessee filings or request an org chart and entity list from the company.
    relatedQuestionRefs:
      - QO001
      - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: public-leadership-roster
    missingEvidence: >-
      A canonical current leadership roster with full titles and role boundaries, including whether any chief marketing
      title exists beyond the VP marketing and communications role.
    whyItMatters: >-
      This clarifies management depth, succession coverage, and who owns commercial messaging versus clinical-market
      education.
    diligencePath: Request an org chart or exported leadership roster from the company and reconcile it to the public team page.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investor-map-completeness
    missingEvidence: >-
      Ownership concentration, board-observer rights, liquidation preferences, and non-equity commercial agreements for
      strategic investors.
    whyItMatters: >-
      Without these details it is hard to tell which investors have the greatest economic influence versus strategic
      influence.
    diligencePath: >-
      Request the latest cap table, financing summary, and any strategic-commercial side agreements tied to Morgan,
      Humana, Texas Oncology, Memorial Hermann, CVS, and Echo.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: >-
      A public source that directly sizes outsourced oncology-navigation or oncology-management spend for payer/provider
      buyers as its own market category.
    whyItMatters: >-
      Without a clean market-size study, TAM and SAM must be triangulated from broader cost pools, covered lives, and
      policy adoption footprints.
    diligencePath: >-
      Ask management for third-party market studies, internal win-loss analyses, and contractable-dollar assumptions
      used in board planning.
    relatedQuestionRefs:
      - QM012
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercialization-gap
    missingEvidence: Segmented pricing and contract structures by buyer type, including PMPM, case-rate, and shared-savings terms.
    whyItMatters: >-
      Procurement friction and payback period depend heavily on contract design, but public materials do not disclose
      enough detail to size buying urgency or margin potential.
    diligencePath: >-
      Request anonymized contracts, pricing sheets, and implementation SOWs for a commercial plan, an MA plan, and a
      provider-group partnership.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: outcomes-validation
    missingEvidence: >-
      Independent multi-plan or multi-provider studies validating utilization, readmission, and drug-spend outcomes
      outside company-authored materials.
    whyItMatters: >-
      ROI proof is central to adoption, especially when the buyer is comparing Thyme Care against existing
      case-management or navigation alternatives.
    diligencePath: >-
      Request payer analytics decks, third-party evaluations, and cohort definitions behind the regional Medicare
      Advantage difference-in-differences study and provider impact reports.
    relatedQuestionRefs:
      - QM022
      - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: employer-channel
    missingEvidence: >-
      A public list of direct employer customers or clear evidence showing when Thyme Care sells direct versus through
      plans and provider partners.
    whyItMatters: >-
      Employers clearly fund much of the commercial oncology-spend problem, but the go-to-market path affects SAM
      realism and sales-cycle length.
    diligencePath: Ask management for employer-logo lists, broker/channel strategy, and direct-employer pipeline conversion data.
    relatedQuestionRefs:
      - QM015
      - QM018
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile coverage for TP001
    missingEvidence: >-
      A fully exhaustive list of smaller regional oncology-navigation vendors, Blue-plan programs, and provider-built
      internal workflows competing in local RFPs.
    whyItMatters: >-
      The chapter covers the major direct peers and substitutes, but long-tail local alternatives can still affect
      procurement and renewal decisions.
    diligencePath: >-
      Collect the top ten recent payer or employer RFPs in oncology support and map every invited vendor, including
      carrier-owned and regional care-management programs.
    relatedQuestionRefs:
      - QP001
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: realized oncology-navigation pricing
    missingEvidence: >-
      Signed contracts showing PEPM fees, minimums, performance guarantees, savings-share splits, or bundled-case
      pricing across Thyme Care, Lantern, OncoHealth, Included Health, and Transcarent.
    whyItMatters: >-
      Procurement outcomes depend heavily on realized economics, but public materials mostly omit contract mechanics
      outside Carrum and Evernorth examples.
    diligencePath: >-
      Request redlined customer contracts or consultant benchmark data for recent oncology-navigation deals and compare
      realized pricing against public savings claims.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: Thyme Care independent outcomes evidence
    missingEvidence: >-
      A peer-reviewed or independent actuarial study quantifying Thyme Care’s impact on hospitalization, adherence,
      total cost, and member outcomes across a broad population.
    whyItMatters: >-
      Competing platforms such as Navigating Cancer can point to named published outcomes, so Thyme Care’s evidence
      burden is higher in competitive diligence.
    diligencePath: >-
      Ask management for the full difference-in-differences methodology, third-party validation, and any manuscripts or
      payer-led evaluations not yet published.
    relatedQuestionRefs:
      - QP021
  - type: missing-source
    severity: material
    topic: renewal, win-rate, and displacement data
    missingEvidence: >-
      Cohort-level renewal rates, competitive takeout examples, and broker or consultant references showing where Thyme
      Care wins or loses against carriers, OncoHealth, and broad navigation platforms.
    whyItMatters: >-
      Competitive durability depends less on feature parity than on whether Thyme Care keeps renewing once buyers
      compare outcomes and embedded alternatives.
    diligencePath: >-
      Obtain the last 12 months of RFP and renewal logs, then interview consultants or plan operators who evaluated
      Thyme Care against named alternatives.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: pricing-opacity
    missingEvidence: >-
      Contract-level PMPM, case-rate, shared-savings, benchmark, exclusion, and corridor terms by payer, employer, and
      provider segment.
    whyItMatters: >-
      Without realized pricing and benchmark mechanics, public lives under management cannot be translated into revenue
      quality or gross margin.
    diligencePath: >-
      Review the top customer contracts, benchmark methodologies, and reconciliation statements with realized retained
      savings and any guarantees.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, runway, debt, revolvers, and any minimum-cash or covenant constraints.
    whyItMatters: Capital adequacy cannot be underwritten from fundraising headlines or management profitability claims alone.
    diligencePath: Request the latest treasury pack, 13-week cash forecast, annual operating plan, and debt schedule with covenants.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: segment-margin
    missingEvidence: >-
      Revenue and gross margin by line of business, including Medicare Advantage, commercial, employer, EOM, provider
