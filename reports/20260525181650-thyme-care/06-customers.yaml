- id: expansion-motion-concentration-and-procurement-friction
  title: Expansion Motion, Concentration, and Procurement Friction
  body: 'Thyme Care’s expansion motion appears to start with payer or risk-bearing contracts, then deepen through oncology-practice integration, care-team workflows, and shared-savings programs. EmblemHealth, Oak Street, Vytalize, AON, and CenterWell show the company using a land-and-expand playbook across adjacent buyers once a geography or risk-bearing relationship is established. Public materials also suggest Thyme Care can deploy quickly and customize to partner workflows, but they simultaneously reveal why sales can be hard. Provider integration requires tailoring to each practice’s EHR, staffing model, and culture, and the broader oncology-VBC market still carries skepticism: Abt found the prior CMS Oncology Care Model failed to deliver net savings or better quality overall, and Oncology News Central reported persistent complaints about reporting burden and model complexity in EOM. Those category headwinds likely increase procurement scrutiny, reference-check intensity, and ROI proof
    requirements for Thyme Care. Public concentration risk is difficult to size because revenue mix is undisclosed, but the named proof set still skews toward payer-sponsored channels and senior/risk-bearing provider ecosystems.'
