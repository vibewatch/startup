chapter:
  number: 6
  title: Customers
  summary: 'Thyme Care’s public customer proof is strongest in payer-sponsored and provider-sponsored oncology programs: Humana, CenterWell/Conviva, Aetna, Premera, Blue Cross NC, Clover, EmblemHealth, Oak Street, Vytalize, AON, and multiple TCOP practices are explicitly named. Public scale advanced from 400+ oncologists across 25 states in 2024 to 8 million covered lives, $5B+ oncology spend, 1000+ oncologists, and a 500+ person Care Team by 2025-2026. The main diligence gap is durability: launches and outcome proxies are public, but NRR, churn, contract length, and customer concentration are not.'
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, User, Payer, and Geographic Segmentation
  body: 'Thyme Care’s public customer model is multi-sided. The economic buyer is usually a health plan, self-funded employer, or risk-bearing provider group that wants oncology total-cost accountability; the operational user is an oncology practice or primary-care group integrating Thyme Care into workflows; and the end user is the patient or caregiver receiving navigation, symptom management, and social-resource support between oncology visits. Public proof is strongest in payer-sponsored and provider-sponsored channels: Humana, Aetna, Clover, Premera, and Blue Cross NC all have dedicated member pages, while CenterWell/Conviva, Oak Street, Vytalize, EmblemHealth, and named TCOP practices show provider and risk-bearing-provider adoption. Geography is also segmented by channel rather than by one national template. Humana publicly named seven Medicare Advantage states, CenterWell/Conviva named seven senior-primary-care states, Premera added nationwide self-funded availability, and Thyme Care
    says it now reaches all 50 states through payer and provider contracts. The exception is Thyme Care Now, a Texas-only direct-pay pilot, which suggests the consumer-paid channel is experimental rather than the company’s primary distribution motion.'
