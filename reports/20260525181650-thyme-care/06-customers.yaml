  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-visibility
    missingEvidence: Channel-level NRR, GRR, logo churn, renewal-rate, and contract-renewal disclosures by payer, provider, and employer segment.
    whyItMatters: Durability is central to underwriting customer lifetime value, but public evidence today is mostly outcome proxies rather than renewal metrics.
    diligencePath: Ask management for cohort renewals, logo retention, gross and net revenue retention, and examples of multiyear renewals by channel.
    relatedQuestionRefs:
    - QU015
    - QU016
  - type: missing-source
    severity: material
    topic: concentration-visibility
    missingEvidence: Customer-level revenue share, lives under contract by payer, and concentration by geography or plan sponsor.
    whyItMatters: Public proof spans multiple channels, but concentration risk cannot be sized without revenue or attributed-life distribution.
    diligencePath: Request top-10 customer concentration, covered-lives by customer, and payer/geography mix for booked revenue.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: texas-oncology-memorial-hermann
    missingEvidence: Public deployment details, attributed lives, or outcome case studies showing Texas Oncology or Memorial Hermann as live operating customers.
    whyItMatters: Both names are strategic validators in fundraising materials, but buyers need to know whether that validation converts into production usage.
    diligencePath: Request signed go-live announcements, reference calls, and quantified outcomes if Texas Oncology or Memorial Hermann are active delivery partners.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: employer-channel
    missingEvidence: Named employer logos, covered-employee counts, and employer-specific renewal or ROI statistics.
    whyItMatters: Morgan Health validates the channel, but public employer proof remains materially thinner than the payer and provider proof.
    diligencePath: Request employer reference accounts, case studies, and covered-life counts by employer-sponsored contract.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU001
    - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Public contract start dates, covered-life counts, and renewal status for each named row in the proof table.
    whyItMatters: The public record establishes multiple named relationships, but it does not fully enumerate commercial scope or term durability partner by partner.
    diligencePath: Collect launch dates, attributed lives, customer quotes, and renewal evidence for every named customer before relying on the proof set as exhaustive.
    relatedTableRefs:
    - TU003
