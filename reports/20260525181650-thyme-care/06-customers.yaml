- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver / risk
  - Public signal
  - Potential impact
  - Current mitigation / proof
  - Diligence gap
  rows:
  - - Payer-led land and expand
    - Humana, Premera, EmblemHealth, Aetna, Blue Cross NC, and CenterWell all show payer or delegated-risk traction
    - Supports broad TAM capture and adjacent-channel growth
    - Named launches and member pages across multiple payer brands
    - No public booked-revenue mix by payer or channel
  - - Senior / MA ecosystem skew
    - Humana, CenterWell, Oak Street, Clover, and Blue Cross NC create a strong MA/senior signal
    - Could create concentration in senior or delegated-risk channels if commercial employer mix stays smaller
    - Premera and employer references show some diversification
    - Need commercial vs MA lives and revenue by customer
  - - Provider-integration depth
    - 1000+ oncologists and AON/TCOP proof suggest strong practice traction
    - Can increase switching costs and create more durable contracts
    - TCOP and AON case studies show real operating depth
    - No public renewal rates by practice or partner
  - - Employer-channel opacity
    - Morgan Health validates Fortune 500 progress but no employer logos are named publicly
    - Limits ability to underwrite diversification and referenceability
    - Strong strategic validation from Morgan Health
    - Need named employers, covered employees, and ROI proof
  - - Strategic-validator ambiguity
    - Texas Oncology and Memorial Hermann appear in funding materials
    - May be mistaken for operating customers without actual rollout proof
    - Strong ecosystem validation and investor alignment
    - Need public deployment specifics or customer-reference calls
  - - Direct-pay Texas pilot
    - Thyme Care Now is Texas-only and explicitly framed as new
    - Useful learning loop, but not yet a material diversified revenue channel
    - Shows product extensibility beyond sponsored contracts
    - Need conversion, retention, and pricing data before treating as scaled channel
  notes: Concentration and expansion analysis is constrained by the absence of customer-level revenue or lives data. Risks shown here rely on the mix of named public proof rather than disclosed financial concentration.
