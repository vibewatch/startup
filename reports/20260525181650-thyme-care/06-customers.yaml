- id: retention-durability-and-member-experience
  title: Retention, Durability, and Member Experience
  body: 'Public durability evidence is encouraging but incomplete. Outcome proxies are strong: HCTTF reported a 10% PMPM reduction and more than 2:1 ROI in one Medicare Advantage partnership, 28% lower ED or inpatient risk for ePRO participants, 30% lower readmissions in the transition-of-care program, and 88% of surveyed members feeling more supported. Thyme Care’s own North Carolina page says 73% of members avoided extra trips to the ER or doctor and gives a 9/10 satisfaction figure, while later company press says member satisfaction has remained around 90% across payer contracts. The complaint process is also formalized, with a public escalation path and a 30-day written response window. But the durability blind spots are meaningful: the reviewed public record does not disclose NRR, GRR, customer churn, contract length, renewal cadence, or customer-level revenue concentration. As a result, public evidence supports product usefulness and customer experience far better than it supports
    logo retention or revenue durability.'
