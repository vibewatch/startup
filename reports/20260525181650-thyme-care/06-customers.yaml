- id: TU006
  title: Procurement and Integration Friction Table
  columns:
  - Friction point
  - Public evidence
  - Why it matters
  - Current mitigation
  - Remaining diligence ask
  rows:
  - - Practice-by-practice workflow variation
    - Thyme Care says no two oncology practices have the same EHR, staffing, or culture
    - Raises implementation effort and lengthens provider onboarding
    - Modular tools, workflow adaptation, network-operations support
    - Request implementation timelines, integration resourcing, and failed-deployment examples
  - - Reporting and administrative burden in oncology VBC
    - Oncology News Central says EOM participants still complain about reporting burden and model complexity
    - Providers may resist joining or renewing if admin lift outweighs savings
    - Thyme Care positions analytics and automation as a burden reducer
    - Request provider NPS, retention, and onboarding time by model
  - - Category skepticism after OCM
    - Abt found OCM did not achieve net savings or quality improvement overall
    - Buyers likely scrutinize oncology VBC ROI harder than generic navigation programs
    - Thyme Care counters with payer ROI and named partner outcomes
    - Request independent validations, especially by payer type
  - - Need for local oncologist alignment
    - TCOP and HCTTF both emphasize oncologist integration and shared accountability
    - Sales may stall if the payer contract is signed without local provider cooperation
    - TCOP offers upside-only incentives and EHR-linked workflows
    - Request evidence of time from payer signature to provider go-live
  - - Thin public employer references
    - Morgan Health validates the channel but public employer names are absent
    - Limits social proof for new employer procurement
    - Morgan Health and Fortune 500 language help, but indirectly
    - Request named employer references and renewal proofs
  notes: This table isolates execution friction from concentration risk. The key issue is not whether Thyme Care has proof points, but whether those proof points are enough to overcome historical skepticism and integration overhead.
