  title: Real adoption is visible across payer, provider, and primary-care channels
  body: Thyme Care is not relying on one reference customer. Public proof spans Humana, CenterWell, Premera, Aetna, Blue Cross NC, Clover, EmblemHealth, Oak Street, Vytalize, AON, and named TCOP practices, while company metrics point to 8 million covered lives and more than 1,000 oncologists.
