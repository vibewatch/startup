  rows:
  - - Health-plan contracts
    - 'Buyer: plan executives; user: members/care teams; payer: insurer or MA plan'
    - Aetna, Humana, Clover, Premera, Blue Cross NC member pages
    - National + regional; strongest in MA and commercial plans
    - Core covered-life engine and attributed oncology populations
    - No public contract counts or lives by payer
  - - Senior primary care / MA-adjacent channel
    - 'Buyer: risk-bearing PCP groups; user: PCPs + members; payer: MA / delegated risk entity'
    - CenterWell/Conviva, Oak Street, Vytalize, Humana MA
    - Seven-state CenterWell launch plus Oak Street/Vytalize references
    - Creates referral flow and closes oncology-primary care gaps
    - Public renewal terms and economics not disclosed
  - - Oncology practice / TCOP partners
    - 'Buyer: oncology practice leadership; user: oncologists and staff; payer: shared-savings or risk-bearing partner'
    - TCOP network, AON, NYCBS, RCCA, Astera, SOHA, Center for Cancer and Blood Disorders
    - 25 states at launch; 850+ oncologists by late 2024; 1000+ by 2025-2026
    - Deepens drug, workflow, and navigation integration
    - Named production scope by practice rarely disclosed
  - - Employer-sponsored channel
    - 'Buyer: self-funded employer or employer-focused intermediary; user: employee/member; payer: employer-sponsored plan'
    - Morgan Health says Fortune 500 partnerships already exist
    - National employer market, but public logos absent
    - Important diversification beyond payer-sponsored MA/commercial contracts
    - No named employer references or covered-employee counts
  - - Direct-pay patient pilot
    - 'Buyer/user/payer: patient or caregiver'
    - Texas-only Thyme Care Now subscription pilot
    - Texas only
    - Shows optional consumer channel and product-market-learning loop
    - Pilot only; not evidence of scaled consumer acquisition
  - - Community support / caregiver layer
    - 'Buyer: partner sponsor; user: caregivers and patients; payer: sponsoring contract'
    - Member pages and FAQs repeatedly mention caregiver support and resource connection
    - Across payer-sponsored channels
    - Helps differentiate whole-person support vs pure utilization management
    - No public caregiver-specific utilization or renewal metrics
  notes: Segmentation is based on publicly named payer, provider, employer, and patient-facing channels. Thyme Care does not publicly disclose customer counts, revenue mix, or covered lives by segment.
