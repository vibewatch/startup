  - CU023
- calloutType: risk
  title: Durability is under-disclosed relative to the amount of go-live proof
  body: The public record is rich on launch evidence and outcome proxies, but poor on NRR, GRR, logo churn, contract length, renewals, and customer concentration. That means adoption quality looks credible, yet customer durability still requires diligence rather than inference.
  claimRefs:
  - CU041
  - CU042
- calloutType: risk
  title: Procurement still has to clear category skepticism and practice integration burden
  body: Even with strong case studies, oncology value-based care still inherits buyer skepticism from OCM underperformance and EOM reporting friction. Thyme Care’s own provider materials also admit that EHR and workflow fit are not plug-and-play, so implementation references matter as much as sales references.
  claimRefs:
  - CU045
  - CU046
  - CU047
