- id: adoption-trajectory-and-scale
  title: Adoption Trajectory and Public Scale
  body: The disclosed adoption curve is steep. TCOP launched in 2024 with more than 400 oncologists across 25 states, then more than doubled to 850-plus oncologists by late 2024, before Thyme Care said in September 2025 that it had surpassed 1,000 oncologists, $5 billion in managed oncology spend, and 8 million people with access. By May 2026, the company was also publicly describing a 500-plus-person oncology-trained Care Team, suggesting operations scaled alongside contracting. Named deployment metrics reinforce that this is more than a marketing reach number. Thyme Care’s December 2024 growth release projected support for more than 40,000 people with cancer in 2025. A named provider case study said one oncology-network partnership alone supported more than 7,000 patients, while the CenterWell launch started with about 5,000 eligible patients. AON later said its EOM collaboration with Thyme Care delivered nearly $6 million in CMS savings and a performance-based payment. Together, the numbers
    support real adoption, but they also show that public scale is still reported mostly as access, participating clinicians, and case-study outcomes rather than a clean count of active members by contract.
