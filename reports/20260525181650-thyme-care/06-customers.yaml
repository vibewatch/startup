- id: named-customer-proof
  title: Named Customer Proof and Public Reference Quality
  body: 'The chapter’s strongest proof is explicit, customer-linked evidence rather than logo walls. Humana published a named state rollout for Medicare Advantage members; CenterWell/Conviva published a named seven-state primary-care launch; Premera published a January 2026 cancer-support expansion for all self-funded plans; Aetna, Clover, and Blue Cross NC have public member pages describing live 24/7 support; and Clover’s story names two real members, Nancy and Vanessa. On the provider side, public proof is strongest for AON and for the TCOP network, which names New York Cancer & Blood Specialists, American Oncology Network, Regional Cancer Care Associates, Astera Cancer Care, and other practices. Morgan Health gives the employer angle credibility by stating Thyme Care already works with Fortune 500 businesses, but the public record does not name those employers. Likewise, Texas Oncology and Memorial Hermann are clearly named strategic investors and validators in the Series D, but the
    reviewed sources do not show a public operating rollout with either organization. That distinction matters: payer and provider evidence is explicit and current, while some ecosystem names still function more as validation than as customer proof.'
