      "id": "leadership-governance-and-key-person-risk",
      "title": "Leadership, governance, and key-person risk",
      "body": "The public leadership bench is founder-led and still concentrated around a small number of executives. Robin Shah is the co-founder and chief executive officer; Bobby Green is co-founder, chief medical officer, and president; and Brad Diephuis is presented in financing materials as president and chief operating officer. The public team page also names Jesse Waldron as chief financial officer, Marcia Macphearson as chief operating officer, and Michael Markowicz as chief legal officer. That gives Thyme Care visible coverage across finance, operations, legal, payer/provider partnerships, and product, but the company's external story still leans heavily on Shah, Green, and Diephuis whenever strategy, clinical credibility, or investor messaging is involved. Public marketing leadership is visible through Nikkayla Page as vice president of marketing and communications, but no chief marketing officer title was found in the reviewed source set.\n\nLeadership additions since 2024 have broadened the bench. Lalan Wilfong joined in August 2024 to lead value-based care after senior roles at Texas Oncology and The US Oncology Network, and a July 2025 expansion added dedicated medical directors for survivorship and palliative care. Governance visibility is mixed. The team page now shows a meaningful board roster with founders plus investor representatives from Andreessen Horowitz, Concord, CVS Health Ventures, Echo Health Ventures, Town Hall Ventures, and Frist Cressey Ventures, while Series B materials explicitly disclosed new board seats for David Whelan and Elizabeth Canis. What remains private is just as important: public sources do not disclose committee structure, observer rights, protective provisions, or a current control map, so later diligence should treat governance as only partially transparent.",
