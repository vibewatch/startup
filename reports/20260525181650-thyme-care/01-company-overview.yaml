  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Thyme Care is a Nashville-based value-based oncology care enabler founded in 2020 that scaled from early navigation into a $275 million-funded Series D company by September 2025. Public evidence strongly supports founder-led oncology expertise, payer-provider-employer alignment, and large claimed national scale, while exact customer count, full governance/control rights, and official valuation confirmation remain unresolved. Reputable third-party sources place the latest round at about $1 billion, but the company's own Series D release omitted valuation and Tracxn timestamps the round months earlier than the official announcement."
  },
  "sections": [
    {
      "id": "identity-stage-and-business-model",
      "title": "Identity, stage, and business model",
      "body": "Thyme Care is best framed as a private, growth-stage value-based oncology care enabler rather than a point-solution app. Official copy describes the company as an oncology navigation leader that partners with payers, providers, employers, and risk-bearing providers to improve access, outcomes, and costs. That positioning matters because the company is not simply selling a patient-facing support service; it is trying to sit between health plans and oncology practices as an operating layer that combines 24/7 navigation, technology, and shared accountability for cost and quality. The payers and providers pages consistently emphasize comprehensive support, lower total cost of care, and virtual expert care-team access, while Series C materials go further by saying the company takes two-sided financial risk.\n\nThe cleanest public identity anchors are founding year, headquarters, and stage. Official and partner materials say Thyme Care was founded in 2020, while AJMC adds that the company began in July 2020 with a narrower patient-navigation focus. Headquarters evidence is directionally cleaner than many startup profiles: the official site says the company is headquartered in Nashville, and multiple independent outlets also describe it as Nashville-based. On stage, the most defensible label is private post-Series-D company. External reporting places Thyme Care at the unicorn threshold, but the company itself has only publicly confirmed the $97 million Series D and $275 million total capital raised, not the post-money valuation.",
