    {
      "id": "capital-base-stakeholders-and-public-scale",
      "title": "Capital base, stakeholder map, and public scale signals",
      "body": "Thyme Care's financing history shows a company that moved from early venture backing into a strategically loaded late-stage round. Andreessen Horowitz publicly backed the company in October 2021. The first large public round then came in August 2023, when Thyme Care announced a $60 million Series B co-led by Town Hall Ventures and Foresite Capital, taking disclosed funding to more than $80 million and adding investor board influence. In May 2024, Echo Health Ventures and CVS Health Ventures added a strategic investment. Two months later, the company announced a $95 million Series C composed of $55 million in equity plus $40 million of Banc of California debt, bringing disclosed capital to $178 million and adding Concord Health Partners. The next step change came on September 25, 2025, when Thyme Care announced a $97 million Series D that brought total capital raised to $275 million and added Morgan Health, Humana, Texas Oncology, and Memorial Hermann as new strategic investors.\n\nPublic scale claims are strong but not uniformly independent. AJMC said the company was serving more than 3,000 patients by fall 2023, while 2024 sources put the network above 800 oncologists and the 2025 Series D release put it above 1,000. Official 2025-2026 releases say Thyme Care manages more than $5 billion in oncology spend, reaches 8 million people nationwide, hit 85,000 members by the end of 2025, employs more than 500 full-time staff, and operates with a 500-person care team. Those are useful cover metrics for the chapter, but they do not eliminate disclosure gaps. Exact revenue, ARR, and paying-customer count remain undisclosed, and even the valuation signal is still external reporting rather than company-confirmed fact.",
