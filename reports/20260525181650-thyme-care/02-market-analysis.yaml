- id: buyer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'The buyer map is multi-sided. Public Thyme Care evidence shows direct selling to health plans and risk-bearing entities, including plan-sponsored member programs for Humana, EmblemHealth, Premera, and senior-primary-care channels with CenterWell and Conviva. Those relationships matter because the budget owner is usually a medical-management, oncology, or total-cost-of-care leader rather than the member receiving the service. At the same time, provider groups are also explicit buyers or channel partners: Thyme Care markets 24/7 between-visit support, performance programs, and workflow integration to oncology practices and health systems, and says it contracts with payers in-market while embedding support at no cost to provider groups.


    Employers matter differently. KFF''s 154 million covered lives and high self-funding rates make employers economically important sponsors of oncology spend, and Evernorth explicitly frames 2026 oncology navigation and survivorship support as a plan-sponsor issue for both health plans and employers. But Thyme Care''s public materials do not disclose a direct employer-only client count or a standalone employer pricing motion. For diligence, that means employers should be treated as an important demand-shaping constituency, not yet as the clearest direct buyer in the public record.


    End users are patients, caregivers, and oncology clinicians. Member pages emphasize 24/7 support, second-opinion help, symptom guidance, financial and transportation support, and coordination with doctors. Provider pages emphasize reduced workload, reduced urgent escalations, and shared savings. The sales motion therefore depends on aligning three things at once: a sponsor that owns the budget, a provider network willing to integrate, and a member experience that feels cancer-specific rather than like generic utilization management outreach.'
