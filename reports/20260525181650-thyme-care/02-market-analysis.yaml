  evidenceGaps:
  - type: missing-source
    severity: material
    topic: tam-gap
    missingEvidence: A public source that directly sizes outsourced oncology-navigation or oncology-management spend for payer/provider buyers as its own market category.
    whyItMatters: Without a clean market-size study, TAM and SAM must be triangulated from broader cost pools, covered lives, and policy adoption footprints.
    diligencePath: Ask management for third-party market studies, internal win-loss analyses, and contractable-dollar assumptions used in board planning.
    relatedQuestionRefs:
    - QM012
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: commercialization-gap
    missingEvidence: Segmented pricing and contract structures by buyer type, including PMPM, case-rate, and shared-savings terms.
    whyItMatters: Procurement friction and payback period depend heavily on contract design, but public materials do not disclose enough detail to size buying urgency or margin potential.
    diligencePath: Request anonymized contracts, pricing sheets, and implementation SOWs for a commercial plan, an MA plan, and a provider-group partnership.
    relatedQuestionRefs:
    - QM018
    - QM025
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: outcomes-validation
    missingEvidence: Independent multi-plan or multi-provider studies validating utilization, readmission, and drug-spend outcomes outside company-authored materials.
    whyItMatters: ROI proof is central to adoption, especially when the buyer is comparing Thyme Care against existing case-management or navigation alternatives.
    diligencePath: Request payer analytics decks, third-party evaluations, and cohort definitions behind the regional Medicare Advantage difference-in-differences study and provider impact reports.
    relatedQuestionRefs:
    - QM022
    - QM025
  - type: enumeration-incomplete
    severity: minor
    topic: employer-channel
    missingEvidence: A public list of direct employer customers or clear evidence showing when Thyme Care sells direct versus through plans and provider partners.
    whyItMatters: Employers clearly fund much of the commercial oncology-spend problem, but the go-to-market path affects SAM realism and sales-cycle length.
    diligencePath: Ask management for employer-logo lists, broker/channel strategy, and direct-employer pipeline conversion data.
    relatedQuestionRefs:
    - QM015
    - QM018
    relatedTableRefs:
    - TM003
