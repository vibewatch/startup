  rows:
  - - Oncology navigation and wraparound support
    - 24/7 symptom support, triage, financial-toxicity help, social-needs support, referrals, survivorship touchpoints
    - Drug manufacturing, infusion administration, hospital reimbursement
    - Health plans, MA channels, risk-bearing entities
    - Core operating layer Thyme Care explicitly markets to payers and members
  - - Value-based oncology enablement
    - Population analytics, acuity scoring, care plans, ePROs, HRSN screening, shared savings / downside-risk support
    - Generic disease management and non-oncology VBC tooling
    - Health plans, oncology groups, risk-bearing provider organizations
    - Core sponsor-facing value proposition and a key differentiator versus generic case management
  - - Provider workflow extension
    - Bi-directional EHR/HIE/claims integration, scheduling support, transitions of care, between-visit outreach
    - Replacing the treating oncologist or PCP
    - Oncology groups, health systems, senior-primary-care groups
    - Critical to provider adoption because the service is sold as an extension, not a substitute
  - - Status-quo substitutes
    - Payer case management, provider-employed nurse navigation, utilization management, PCP follow-up, fragmented referrals
    - Dedicated oncology-specialized external partner
    - Existing payer/provider operating budgets
    - Most common alternative today; explains why buyer education and proof of superiority matter
  - - Excluded full-risk categories
    - Drug rebates and manufacturing economics, full-risk insurance underwriting, core EHR licensing, hospital facility fees
    - Direct oncology-management service layer
    - PBMs, carriers, hospitals, software vendors
    - 'Important boundary guardrail: Thyme Care can influence utilization and coordination but does not own the entire oncology spend stack'
  notes: Boundary is defined from public Thyme Care payer/provider/member pages and excludes categories where Thyme Care influences outcomes but is not the primary seller of record.
