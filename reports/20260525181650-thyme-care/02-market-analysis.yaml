chapter:
  number: 2
  title: Market Analysis
  summary: Thyme Care's real market is the oncology management control layer sold to health plans, Medicare Advantage channels, and risk-bearing provider groups—not the full oncology economy. The underlying problem is large and growing, with U.S. cancer-care costs estimated at $208.9 billion in 2020 and projected at $246 billion by 2030, 154 million employer-sponsored nonelderly lives, and rising MA drug-cost pressure, but the near-term outsourced oncology VBC market remains early, as CMS's EOM still has only 28 physician group practices and one commercial payer publicly participating. The result is a credible long-run TAM paired with a diligence-heavy SAM/SOM shaped by workflow integration, trust, and proof of ROI.
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Alternatives
  body: 'Thyme Care does not compete in the full oncology economy. Its public materials place it in a narrower operating layer: oncology navigation, wraparound clinical support, and value-based oncology enablement sold into payer and provider workflows. On the payer side, Thyme Care describes comprehensive cancer-care navigation, analytics, and symptom-management support that reduce total cost of care for health plans and other risk-bearing entities. On the provider side, it positions itself as an extension of oncology groups and health systems, offering between-visit support, performance programs, and shared-savings structures while Thyme Care takes downside risk. The TCOP model adds bi-directional integration with oncology practices, drug-spend interventions, and scaled risk aggregation across payers and physician groups.


    That boundary excludes several large but adjacent pools of spend. Thyme Care is not a drug manufacturer, infusion provider, EHR vendor, or full-risk insurer. It does not replace oncologists or PCPs; even member-facing pages emphasize coordination with existing doctors rather than substitution. The relevant comparison set is therefore status-quo cancer care management: payer case management programs, provider-employed navigators, generic utilization management, disease-management vendors, and fragmented referral, social-needs, and follow-up workflows run under fee-for-service incentives. The real diligence question is whether buyers treat oncology navigation as a standalone budget line, an extension of existing case management, or a value-based oncology operating layer embedded inside broader payer-provider contracts.'
