- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Evidence
  - Implication for Thyme Care
  - Diligence Ask
  rows:
  - - Rising cancer incidence and survivor base
    - Positive
    - Structural / multi-year
    - ACS, NCI, SEER, Stout
    - Expands number of members needing longitudinal support
    - What share of members are actively treated versus survivorship-only in buyer populations?
  - - Specialty-drug pipeline and complex oncology therapeutics
    - Positive
    - Immediate
    - Evernorth, Prime, Milliman, Thyme Care payer article
    - Increases payer appetite for oncology-specific management and utilization oversight
    - Which savings levers are drug-adjacent versus directly drug-price-sensitive?
  - - Employer premium and self-funding pressure
    - Positive
    - Immediate
    - KFF EHBS 2024
    - Makes commercial sponsors more willing to test targeted oncology solutions
    - Can Thyme Care sell directly to employers or mainly through plans/TPAs?
  - - MA profitability and Part D cost-sharing pressure
    - Positive
    - 2025-2026
    - Chartis, KFF Part D, Milliman
    - Supports MA-channel relevance for senior oncology support
    - How concentrated is Thyme Care revenue in MA versus commercial?
  - - CMS EOM / post-OCM policy scaffolding
    - Positive
    - Current
    - CMS EOM pages
    - Validates navigation, 24/7 access, ePROs, and downside-risk structures as policy-aligned
    - How much of Thyme Care demand is tied to EOM-like readiness?
  - - Workforce shortages and burnout
    - Mixed
    - Structural
    - ASCO, Thyme Care provider resources
    - Creates demand for support but limits implementation bandwidth inside practices
    - How much provider-side lift does deployment require in the first 90 days?
  - - Data integration and workflow fragmentation
    - Negative
    - Immediate
    - Thyme Care payer/provider pages, CMS EOM, Thyme Care provider articles
    - Integration quality is a make-or-break adoption variable
    - What % of implementations have claims + EHR + HIE integration live in production?
  - - Trust and personalization versus generic outreach
    - Negative
    - Immediate
    - Thyme Care payer article, member pages
    - Generic case-management alternatives are entrenched and often mistrusted
    - What engagement rates persist beyond initial enrollment by buyer type?
  - - Long payback and pricing / ROI burden
    - Negative
    - Near-term
    - Thyme Care provider article
    - Procurement may stall if savings take years to prove or pricing is opaque
    - Provide contract structures, PMPMs, and shared-savings case studies by segment
  - - Early formal VBC adoption footprint
    - Negative
    - Current
    - CMS EOM participant counts
    - Shows SAM is still far smaller than the macro oncology cost pool
    - What private-market oncology VBC deployments exist outside EOM?
  notes: 'Several constraints simultaneously create need and friction: oncology complexity increases demand for navigation while also making deployment, proof, and provider alignment harder.'
