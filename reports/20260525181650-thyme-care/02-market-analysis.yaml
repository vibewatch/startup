- id: sizing-lenses
  title: Evidence-Constrained Sizing Lenses
  body: 'Multiple sizing lenses matter because no public source cleanly isolates a dollar TAM for outsourced oncology navigation sold to payers and providers. The broadest lens is national cancer cost of care. NCI estimates U.S. cancer-care expenditures at $208.9 billion in 2020, while NIHCM highlights a $246 billion 2030 projection. Demand volume also remains large: ACS projects 2.11 million new U.S. cancer cases and 626,140 deaths in 2026, NCI estimated 2.04 million new cases and 618,120 deaths in 2025, and the survivor population already exceeds 18 million with a path to 26 million by 2040. Those figures justify a very large underlying problem pool, but they are not the same thing as Thyme Care''s serviceable software-and-services market.


    A second lens is the buyer budget surface. KFF says employer-sponsored coverage reaches 154 million nonelderly people, with 63% of covered workers self-funded overall and 79% self-funded in large firms. That makes commercial payers, TPAs, and self-funded employers economically relevant because they directly feel oncology trend through premiums, claims, and stop-loss pressure. Medicare Advantage is also relevant: Chartis says MA leaders are prioritizing profitability and medical-cost control in 2026, while KFF shows MA-PD plans adding more deductibles and coinsurance as drug-cost pressure rises.


    A third lens is formal value-based oncology adoption. CMS''s EOM includes only 28 physician group practices and one commercial payer across 350+ sites of care. That is tiny relative to the oncology cost pool, which is exactly the point: the long-run TAM is huge, but the near-term publicly visible SAM for external oncology-management partners is still early and heterogeneous. Stout''s narrower $85.6 billion 2024 U.S. oncology-market estimate underscores the same issue from another angle—some sources measure industry revenue, while others measure national care expenditures. Preserving that boundary mismatch is more honest than forcing a single headline TAM.'
