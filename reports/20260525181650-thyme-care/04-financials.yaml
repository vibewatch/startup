- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public evidence
  - Current status
  - Revenue quality
  - Diligence ask
  rows:
  - - Sponsor-paid population contracts
    - Payer, employer, or risk-bearing provider contracts tied to attributed cancer populations
    - Payers page, Morgan Health investment note, fact sheet
    - Clearly live across multiple segments
    - Better than pure navigation SaaS because payment is outcome-linked, but pricing is opaque
    - Top 10 contract list with benchmark structure and realized fees
  - - At-risk performance fees
    - Fees put at risk against total-cost-of-care benchmark with upside when savings are delivered
    - HCTTF case study
    - Described as the default structure in most arrangements
    - High if repeatable; low visibility on exclusions and corridors
    - Contract-level reconciliation statements and benchmark specs
  - - TCOP provider economics
    - Savings-sharing or incentive programs with oncology practices while Thyme retains downside risk
    - Provider page and HCTTF/AON materials
    - Live with AON and broader TCOP network
    - Supports provider adoption but adds another payout layer
    - Practice-level waterfall and partner payout logic
  - - Sponsor-paid navigation benefit
    - $0 or no-additional-cost member benefit for navigation and care-partner support
    - Humana, CareFirst, Premera, EmblemHealth, Microsoft, AON pages
    - Consistently visible in public materials
    - Strong buyer willingness signal, weak direct pricing transparency
    - Realized PMPM or case-rate by sponsor segment
  - - Aetna hybrid clinical support
    - No-cost RN and community health worker support, plus in-network provider visits with normal plan cost sharing
    - Aetna member page
    - Live and publicly described
    - Suggests mixed service and clinical billing economics
    - Visit volume, reimbursement rates, and margin by visit type
  - - Pharmacy Solutions
    - Provider-facing advisory and value-based performance programs
    - Pharmacy Solutions page
    - Live but revenue contribution undisclosed
    - Useful diversification beyond navigation, yet unpriced publicly
    - Revenue mix, contract model, and gross margin by pharmacy engagement
  notes: Rows separate what is clearly visible in public materials from the contract mechanics that remain private. Public evidence strongly supports sponsor-paid and at-risk monetization, but not realized rate cards.
