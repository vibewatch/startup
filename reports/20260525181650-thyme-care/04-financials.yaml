- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - Current read-through
  - Underwriting implication
  - Diligence ask
  rows:
  - - Latest round
    - 2025 Form D shows $97.0M sold out of a $100.0M offering; company announced $97M series D
    - Large recent equity cushion is real
    - Improves near-term flexibility but does not prove runway
    - Current cash balance and board-approved operating plan
  - - Valuation signal
    - Series D described as valuing Thyme Care above $1B, about 2x July 2024 valuation
    - Follow-on capital was available at a much higher valuation
    - Suggests investor confidence, but not liquidity sufficiency
    - Latest cap table and preference stack
  - - Use of funds
    - Management said proceeds would fund AI, member-facing technology, and broader ecosystem partnerships
    - Capital is growth-oriented, not obviously rescue financing
    - Burn could remain elevated if hiring and integration continue aggressively
    - Headcount plan and quarterly cash-use forecast
  - - Earlier SEC-documented financing
    - 2023 filing showed $49M sold of $60M target; 2021 filing showed $13.77M sold of $18.0M target
    - Company has repeatedly accessed equity capital before latest round
    - Serial fundraising lowers existential risk but not dilution risk
    - Round-by-round ownership and any side letters
  - - Strategic investor mix
    - Series D included Morgan Health, Humana, Texas Oncology, and Memorial Hermann alongside prior investors
    - Strategic investors may support distribution and credibility
    - Helpful for channel access, but may not eliminate the need for new capital
    - Commercial commitments or rights granted to strategic backers
  - - Profitability claim
    - Fierce said management described the company as profitable in September 2025
    - Potentially reduces financing dependency
    - Cannot be relied on without audited statements
    - Monthly management reporting and auditor review materials
  - - Cash / burn / runway
    - No public disclosure
    - Most important treasury input is missing
    - Runway cannot be underwritten externally
    - Cash waterfall, burn history, and base/upside/downside runway cases
  - - Debt / obligations
    - No public debt, revolver, or covenant disclosure found
    - Could be zero or simply undisclosed
    - Downside exposure cannot be scoped
    - Debt schedule, covenants, guarantees, and minimum cash requirements
  notes: This table focuses on forward capital adequacy rather than reproducing the full round-by-round history. The public record shows funding access, but not treasury detail.
