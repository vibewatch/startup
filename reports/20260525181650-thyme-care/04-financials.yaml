company:
  name: Thyme Care
chapter:
  number: 4
  title: Financials
  summary: Thyme Care monetizes sponsor-paid, at-risk oncology navigation across health plans, employers, and provider groups, with public evidence pointing to shared-savings and outcomes-linked economics rather than direct patient fees. Public traction and a $97 million 2025 round support scale, but the model remains clinically labor-intensive and still lacks audited revenue, margin, cash, and runway disclosure, so financial underwriting hinges on private contract and treasury data.
sections:
- id: revenue-model-and-pricing
  title: Revenue model is sponsor-paid and risk-linked, but realized price points stay private
  body: |-
    Public evidence points to a sponsor-paid, at-risk revenue model rather than direct patient monetization. Thyme Care's payer page says it partners with health plans and other risk-bearing entities to assume accountability for quality, outcomes, and reduced total cost of care, while the HCTTF case study says most arrangements put Thyme's fees at risk against payer benchmarks and share upside when costs fall. The provider page adds a second leg of monetization: Thyme contracts with payers, embeds wraparound navigation into community oncology workflows, and shares savings with provider partners while taking full downside risk itself. That is a stronger revenue-quality signal than generic care navigation, but it still leaves key pricing variables hidden because no PMPM, case-rate, benchmark, corridor, or realized take-rate schedule is public.

    Member-facing pages show why public revenue recognition remains hard to model. Humana, CareFirst, Premera, EmblemHealth, Microsoft/Premera, and AON EOM all present Thyme Care as a $0 or no-additional-cost benefit. Aetna is more nuanced: nurse and community health worker support is free, but visits with Thyme Care providers are covered like other in-network primary care visits and can carry standard plan cost share. Together with the repeated legal footer stating Thyme Care, Inc. provides management support and non-clinical services while Thyme Care Medical provides clinical services, that suggests a hybrid revenue stack spanning sponsor-paid navigation, at-risk performance fees, provider-incentive economics, and some clinical-billing flows. The problem for underwriting is not absence of monetization; it is absence of contract-level rate disclosure.
