- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Savings mix
    - 60-70% of savings from acute-care reduction; 30-40% from drug-spend reduction
    - Medium
    - Most visible clue to gross-margin drivers and where Thyme creates value
    - Sponsor-level savings bridge and retained share by contract
  - - Medicare Advantage case study
    - 10% PMPM spend reduction, >2:1 ROI, 9/10 satisfaction in one MA partnership
    - Medium
    - Shows a concrete benchmark for payer ROI if repeatable
    - Underlying cohort size, control method, and reconciliation detail
  - - Average acute-care impact
    - 15-20% reduction in acute-care spend claimed across value-based programs
    - Medium
    - Supports thesis that labor-heavy navigation can still be economically accretive
    - Independent replication by payer and line of business
  - - ePRO effect
    - 28% relative risk reduction in ED or inpatient events for completing members
    - High
    - Symptom monitoring appears to be a core savings lever
    - Absolute event counts, completion bias, and sponsor-level validation
  - - Transitions-of-care effect
    - 30% relative risk reduction in readmissions for participating complex members
    - High
    - Suggests post-discharge workflows may justify staffing intensity
    - Readmission base rates, savings captured, and confidence intervals
  - - Provider proof point
    - AON and Thyme said first EOM period yielded nearly $6M of Medicare savings plus performance payment
    - High
    - Shows provider-enablement economics can translate into cash value
    - Practice economics after Thyme share and implementation cost
  - - Clinical labor footprint
    - 500+ fully employed oncology-trained professionals plus continued hiring across care-delivery roles
    - High
    - Recurring payroll is likely the largest service-delivery cost bucket
    - Fully loaded care-team cost per engaged member
  - - Public profitability signal
    - Management told Fierce the company was profitable by September 2025
    - Medium
    - Reduces immediate financing risk if accurate
    - Audited revenue, EBITDA, cash flow, and margin bridge
  - - Current hiring mix
    - 33 open roles skewed clinical, with only a small number of overtly commercial roles
    - Medium
    - Suggests expansion still requires significant operational spend
    - Channel CAC, payback, and implementation cost per logo
  notes: Most metrics are company-selected or partner-case-study metrics rather than audited financial outputs. Use them as directional unit-economics evidence, not as a substitute for sponsor-level P&Ls.
