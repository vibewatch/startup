  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: pricing-opacity
    missingEvidence: Contract-level PMPM, case-rate, shared-savings, benchmark, exclusion, and corridor terms by payer, employer, and provider segment.
    whyItMatters: Without realized pricing and benchmark mechanics, public lives under management cannot be translated into revenue quality or gross margin.
    diligencePath: Review the top customer contracts, benchmark methodologies, and reconciliation statements with realized retained savings and any guarantees.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, runway, debt, revolvers, and any minimum-cash or covenant constraints.
    whyItMatters: Capital adequacy cannot be underwritten from fundraising headlines or management profitability claims alone.
    diligencePath: Request the latest treasury pack, 13-week cash forecast, annual operating plan, and debt schedule with covenants.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: segment-margin
    missingEvidence: Revenue and gross margin by line of business, including Medicare Advantage, commercial, employer, EOM, provider programs, pharmacy solutions, and Thyme Care Medical visits.
    whyItMatters: A blended public story can hide whether attractive contract types are subsidizing low-margin service lines.
    diligencePath: Obtain segment P&L and cohort margin files with utilization, clinical payroll, and implementation allocations.
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer concentration, renewal timing, expansion rates, and termination rights across major payer and employer contracts.
    whyItMatters: Revenue quality depends on retention and concentration, not just access lives or named logos.
    diligencePath: Request top-10 customer concentration, gross and net revenue retention, renewal dates, and contract termination provisions.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: outcome-validation
    missingEvidence: Third-party actuarial or payer-reconciled validation of acute-care, readmission, and ROI claims by contract cohort.
    whyItMatters: Internal and partner-selected case studies are directionally helpful but not sufficient to clear underwriting risk.
    diligencePath: Review independent actuarial validation, shared-savings true-ups, and contract-level before/after analyses for major sponsors.
    relatedQuestionRefs:
    - QI018
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
