        tone: neutral
      - label: Direct clinical touchpoints can improve care but complicate revenue recognition and bad-debt exposure
        tone: warning
      - label: Visit mix, reimbursement, and payment-support subsidy rates are not public
        tone: warning
    - label: Recent equity financing
      values:
