        tone: positive
      - label: Funding can absorb care-team and product expansion in the near term
        tone: positive
      - label: Cash on hand, burn, runway, and debt remain undisclosed
        tone: warning
  approximationNotes: Tones reflect underwriting usefulness rather than management quality. Positive cells show visible support for scale; warning cells show the information gaps that still block a clean finance view.
