- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Public proxy today
  - Exact diligence path
  rows:
  - - Realized contract pricing by sponsor type
    - Without PMPM, case-rate, or benchmark-share terms, lives under management cannot be translated into revenue or margin
    - $0-to-member benefit pages plus generic at-risk language
    - Review top payer, employer, and provider contracts with redlines and actual reconciliations
  - - Revenue and gross margin by segment
    - Needed to distinguish high-quality recurring sponsor revenue from labor-intensive low-margin service work
    - 'Traction metrics only: members, patients, spend under management, oncologist count'
    - Request segment P&L by Medicare Advantage, commercial, employer, EOM, and pharmacy solutions
  - - Cash, burn, runway, and debt
    - Essential for financing dependency, downside planning, and dilution risk
    - Recent large round and management profitability claim
    - Obtain current treasury pack, cash forecast, debt schedule, and covenant summary
  - - Customer concentration and renewals
    - A few large payer or employer contracts could dominate revenue quality and renewal risk
    - Named partners such as Humana, Aetna, AON, and Fortune 500 employers
    - Request top-10 customer concentration, renewal dates, and gross-retention history
  - - Entity-level economics
    - Multiple operating entities can hide where margin is earned or lost
    - Legal disclosures distinguish Thyme Care, Inc. from Thyme Care Medical
    - Request legal-entity financials and intercompany transfer-pricing logic
  - - Third-party validation of savings claims
    - Internal or partner-selected case studies are directionally helpful but not enough for underwriting
    - HCTTF says it did not independently validate internal analyses; CMS reports show model risk
    - Review external actuarial validation and payer-specific shared-savings true-ups
  - - Sales efficiency and implementation payback
    - Enterprise healthcare GTM can burn cash even when clinical outcomes are strong
    - Job mix, employer expansion claims, and within-months implementation language
    - Request CAC, implementation cost per logo, ramp time, and channel payback by segment
  notes: These are not generic diligence asks. Each missing metric directly blocks underwriting of revenue quality, margin durability, or runway sufficiency.
