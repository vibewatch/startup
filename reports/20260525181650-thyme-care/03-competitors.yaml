- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Public pricing signal
  - Contract / packaging model
  - Included capabilities
  - What remains opaque
  - Implication for Thyme Care
  rows:
  - - Thyme Care
    - No public PEPM or savings-share schedule
    - Value-based oncology support with payer/provider accountability
    - 24/7 care team, provider coordination, digital support, pharmacy interventions
    - Realized economics by segment and guarantee structure
    - Thyme must win on outcomes and integration rather than published sticker price
  - - OncoHealth
    - No public list pricing
    - Health-plan oncology management and supportive-care contracts
    - Utilization management, supportive care, navigation, 24/7 nursing
    - Case rates, PMPMs, and performance guarantees
    - Direct payer alternative with similar budget owner and private pricing
  - - Lantern
    - ROI target public; list price private
    - Employer specialty-care benefit contracts
    - Oncology nurse navigation, NCI reviews via AccessHope, site-of-care steering, trial matching
    - Member fees, guarantee mechanics, and payer packaging
    - Competes strongly where employer savings narratives matter more than payer risk
  - - Included Health
    - No public list pricing
    - Broader navigation and care platform sold to employers/plans
    - Navigation, expert medical opinion, specialty care, primary care, mental health
    - Whether cancer support is packaged separately or bundled into enterprise deals
    - Broader suite can underprice cancer navigation on a portfolio basis
  - - Transcarent + Accolade
    - No public list pricing
    - Integrated platform for employers and health plans
    - Cancer, advocacy, expert opinion, primary care, pharmacy, WayFinding AI
    - Realized PMPM, take-rates for trusted-partner modules, and oncology-specific pricing
    - Breadth can shift buyer focus from oncology ROI to whole-platform consolidation
  - - Carrum
    - Up to 30% episode savings; little-to-no member OOP in many cases
    - Pre-negotiated bundled cancer episodes plus advisory program
    - COE access, advisory oncologists, navigation, financial protection
    - How savings split across employer and provider and which episodes qualify
    - Public bundle economics make Carrum the clearest pricing substitute in RFPs
  - - Evernorth / carrier programs
    - Single-copay bundles and embedded benefit language are public
    - Embedded insurance benefit or oncology add-on within plan design
    - Dedicated teams, virtual support, COE access, benefit navigation, bundled billing
    - Incremental vendor cost to plan sponsor and outcome guarantees
    - Embedded options can make a new standalone vendor look duplicative
  - - Navigating Care + OneOncology
    - No public pricing
    - Provider software and management-services economics
    - Patient portal, ePRO, reimbursement support, medication adherence
    - Per-site SaaS and revenue-share mechanics
    - Provider incumbency can reduce willingness to buy a separate member-navigation layer
  notes: Only Carrum and Evernorth expose clear public payment mechanics; most retained sources route buyers to demos or account teams, so table entries distinguish public packaging from hidden realized economics.
