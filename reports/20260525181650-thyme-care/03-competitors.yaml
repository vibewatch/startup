- id: substitutes-and-embedded-alternatives
  title: Substitutes and embedded alternatives
  body: 'Substitutes matter because many buyers already own part of the oncology-support stack before they ever evaluate Thyme Care. Carrum is the clearest hard-economics substitute: it does not offer the same longitudinal model, but it gives employers pre-negotiated cancer episodes, virtual advisory oncology, and explicit savings language that some benefits teams may prefer to a navigation-first contract. Carrier and integrated-delivery alternatives are even more structurally important. UnitedHealthcare, Cigna, Evernorth, and Kaiser all publish oncology-support or cancer-care resources that blend nurse guidance, benefit navigation, centers-of-excellence access, or integrated care teams inside the sponsor relationship members already trust. On the provider side, Navigating Care and OneOncology compete by owning the community-oncology workflow through ePROs, remote monitoring, medication-adherence tools, and reimbursement support; their public outcomes evidence is stronger than most navigation
    vendors disclose. Tempus, Guardant, and ICON are not full replacements for Thyme Care, but they can modularize pathway intelligence, testing access, trial matching, and patient-support tasks that once supported a broader navigation value proposition.'
