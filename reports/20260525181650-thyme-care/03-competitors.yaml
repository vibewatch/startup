  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile coverage for TP001
    missingEvidence: A fully exhaustive list of smaller regional oncology-navigation vendors, Blue-plan programs, and provider-built internal workflows competing in local RFPs.
    whyItMatters: The chapter covers the major direct peers and substitutes, but long-tail local alternatives can still affect procurement and renewal decisions.
    diligencePath: Collect the top ten recent payer or employer RFPs in oncology support and map every invited vendor, including carrier-owned and regional care-management programs.
    relatedQuestionRefs:
    - QP001
    - QP024
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: realized oncology-navigation pricing
    missingEvidence: Signed contracts showing PEPM fees, minimums, performance guarantees, savings-share splits, or bundled-case pricing across Thyme Care, Lantern, OncoHealth, Included Health, and Transcarent.
    whyItMatters: Procurement outcomes depend heavily on realized economics, but public materials mostly omit contract mechanics outside Carrum and Evernorth examples.
    diligencePath: Request redlined customer contracts or consultant benchmark data for recent oncology-navigation deals and compare realized pricing against public savings claims.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: Thyme Care independent outcomes evidence
    missingEvidence: A peer-reviewed or independent actuarial study quantifying Thyme Care’s impact on hospitalization, adherence, total cost, and member outcomes across a broad population.
    whyItMatters: Competing platforms such as Navigating Cancer can point to named published outcomes, so Thyme Care’s evidence burden is higher in competitive diligence.
    diligencePath: Ask management for the full difference-in-differences methodology, third-party validation, and any manuscripts or payer-led evaluations not yet published.
    relatedQuestionRefs:
    - QP021
  - type: missing-source
    severity: material
    topic: renewal, win-rate, and displacement data
    missingEvidence: Cohort-level renewal rates, competitive takeout examples, and broker or consultant references showing where Thyme Care wins or loses against carriers, OncoHealth, and broad navigation platforms.
    whyItMatters: Competitive durability depends less on feature parity than on whether Thyme Care keeps renewing once buyers compare outcomes and embedded alternatives.
    diligencePath: Obtain the last 12 months of RFP and renewal logs, then interview consultants or plan operators who evaluated Thyme Care against named alternatives.
    relatedQuestionRefs:
    - QP025
