- id: roadmap-and-differentiation
  title: The roadmap has moved from basic navigation into pharmacy, psychosocial, and survivorship workflows
  body: |-
    The publicly visible roadmap shows a company broadening from navigation into a fuller oncology operating layer. Earlier case studies and the 2024 Fierce Healthcare report describe Thyme Box workflow automation, more than 100 evidence-based support plans, member mobile assessments, and expanded EHR integrations including ADT feeds. AON's 2024 case study shows the platform supporting EOM requirements at production scale. By 2025 the Humana agreement highlights multistate deployment with pharmacy interventions and coordination across oncologists, PCPs, and specialists. In late 2025 and early 2026, Thyme publicly emphasized Integrated Social Support and survivorship expansion, signaling a broader whole-person model instead of a narrow acute-treatment product.

    The differentiation thesis is therefore not just "better navigation." Thyme combines oncology-specific care teams, purpose-built internal tooling, workflow-native provider integrations, and value-based contract logic. HCTTF and Morgan Health both describe a model that pairs population analytics with local resource coordination and proactive symptom management. That said, the roadmap is easier to observe through press releases and case studies than through open product documentation. Public materials still do not disclose a deep release history, detailed integration map, or a public roadmap for remote patient monitoring or native app expansion. The clearest read is that Thyme is extending horizontally across oncology workflows, but external diligence still has to infer too much from marketing, partner case studies, and practitioner commentary.
