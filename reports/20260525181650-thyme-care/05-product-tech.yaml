callouts:
- calloutType: strength
  title: The moat is the combination of software surfaces and a large oncology-trained workforce
  body: Thyme Care's strongest public differentiator is not a single algorithm or app feature. It is the way Connect, Thyme Box, and Signal are coupled to a 24/7 multidisciplinary care team that already operates inside payer and provider workflows. That makes the offering harder to replicate than a benefits-navigation front end or a point EHR overlay alone.
  claimRefs:
  - CE003
  - CE011
  - CE016
  - CE041
  - CE042
- calloutType: insight
  title: Thyme's most important technical asset may be workflow design rather than classic software IP
  body: The retained evidence repeatedly emphasizes playbooks, acuity scoring, EHR overlays, custom dashboards, workflow mapping, and partner-specific rollout. Those are technical assets, but they are operationally expressed. Investors should evaluate them like implementation know-how plus software rather than software alone.
  claimRefs:
  - CE014
  - CE023
  - CE024
  - CE044
- calloutType: risk
  title: Implementation complexity is a first-order product risk
  body: Thyme needs claims or HIE data, some level of EHR access, partner-specific workflow mapping, clinician buy-in, and a sizable human workforce to deliver its promise. That raises switching costs and defensibility, but it also means launches are unlikely to behave like lightweight SaaS deployments.
  claimRefs:
  - CE019
  - CE023
  - CE039
  - CE044
- calloutType: risk
  title: Public trust evidence trails the operational ambition
  body: The privacy policy, terms, and hiring data show Thyme is thinking about privacy, compliance, AI governance, and security. But the retained public record still lacks a disclosed certification page, audit report, or deep public technical documentation. For enterprise buyers, that shifts diligence from brochure review to direct document request.
  claimRefs:
  - CE030
  - CE031
  - CE032
  - CE040
