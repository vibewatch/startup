  evidenceGaps:
  - type: missing-source
    severity: material
    topic: integration-depth
    missingEvidence: Implementation packet or architecture review showing exact EHR vendors, API method, ADT-feed coverage, data-refresh cadence, and uptime or SLA commitments for Connect, Box, and Signal.
    whyItMatters: The product promise depends on workflow integration. Without concrete interface and reliability evidence, buyers cannot estimate rollout risk, integration burden, or operational resilience.
    diligencePath: Request a technical architecture review, sample integration spec, partner implementation checklist, and current uptime / incident summary from product and solutions-engineering leadership.
    relatedQuestionRefs:
    - QE011
    - QE017
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Current security packet covering certifications, third-party audit reports, penetration-testing cadence, subprocessor list, and enterprise access controls.
    whyItMatters: Thyme handles PHI and workflow-critical oncology data, but the retained public record shows policies rather than externally validated control evidence. Procurement and risk review need more than policy text.
    diligencePath: Request SOC 2 or equivalent reports, security overview, vendor-risk packet, and privacy-governance materials from compliance and security leadership.
    relatedQuestionRefs:
    - QE019
    - QE023
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: acuity-model-validation
    missingEvidence: Independent validation, bias monitoring, or QA evidence for the dynamic acuity model and prioritization logic that route members to social-work, nurse, and provider interventions.
    whyItMatters: Public outcomes and workflow claims rely on the quality of prioritization and escalation logic. Without validation evidence, it is hard to judge safety, fairness, and reproducibility.
    diligencePath: Request methodology documentation, model-monitoring dashboards, override rates, and retrospective validation studies for acuity and prioritization workflows.
    relatedQuestionRefs:
    - QE023
    - QE026
    relatedTableRefs:
    - TE004
    - TE003
  - type: missing-source
    severity: minor
    topic: forward-roadmap
    missingEvidence: Forward-looking product roadmap covering remote patient monitoring, native-app decisions, release cadence, and partner-specific feature expansion beyond current public launches.
    whyItMatters: The current product surface is visible only through launches already in market. Buyers and investors still lack a reliable view of what is planned next and on what timeline.
    diligencePath: Request the current roadmap, shipped-vs-planned release history, and explicit rationale for remaining web-based versus native mobile while evaluating RPM expansion.
    relatedQuestionRefs:
    - QE014
    - QE015
    relatedTableRefs:
    - TE005
