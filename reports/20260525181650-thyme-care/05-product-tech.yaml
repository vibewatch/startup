tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public status / maturity
  - What it does
  - Differentiation
  - Diligence gap
  rows:
  - - Multidisciplinary Care Team
    - Member / caregiver / partner clinician
    - Production; 500+ oncology-trained professionals
    - 24/7 virtual navigation, symptom triage, education, social support, transitions, palliative and survivorship support
    - Human-plus-software model tightly coordinated with oncologists rather than generic call-center navigation
    - Need staffing ratios, caseloads, licensure coverage, and escalation SLAs by market
  - - Thyme Care Connect
    - Member
    - Production
    - Private online or mobile-friendly web experience for support requests, educational content, symptom tracking, and ePRO surveys
    - Digital front door is oncology-specific and tied directly to human follow-up
    - No public native-app footprint, release notes, or engagement telemetry disclosed
  - - Thyme Box
    - Internal care team / partner operations
    - Production
    - Internal care-delivery platform with profile prepopulation, analytics, dashboards, playbooks, and reporting
    - Purpose-built oncology care-management layer rather than generic CRM/work queue tooling
    - No public architecture diagram, vendor map, or uptime metrics
  - - Thyme Care Signal
    - Oncology practice staff
    - Production with partner practices
    - EHR-embedded updates, direct communication, eligibility flags, and value-based recommendations
    - Workflow-native provider surface that reduces context switching and administrative burden
    - Exact EHR vendors, integration method, and support scope are not disclosed
  - - Integrated Social Support (ISS)
    - Members with psychosocial or practical barriers
    - Launched internally Dec. 2025; public launch 2026
    - Makes social workers early responders using validated screening and individualized plans
    - Elevates psychosocial support from referral afterthought to core operating module
    - Need outcome data beyond company-selected partner-site examples
  - - Pharmacy Solutions
    - Oncology practices / specialty-pharmacy teams
    - Production
    - Advisory and performance-program support for specialty-pharmacy operations, access, accreditation, and value-based oncology workflows
    - Connects pharmacy economics and workflow redesign to oncology navigation
    - Revenue mix, tooling specifics, and realized savings by engagement type are not public
  - - Thyme Care Medical / telehealth support
    - Members needing urgent or enhanced supportive care
    - Production where eligible
    - Virtual clinical support delivered by Thyme Care Medical providers alongside non-clinical coordination
    - Adds clinician-backed support without redefining Thyme Inc. as a medical practice
    - Scope by state, visit volumes, and escalation thresholds are not disclosed publicly
  - - Payment Support Program
    - Income-eligible members receiving Thyme Care Medical services
    - Production
    - Covers copays, deductibles, and coinsurance for qualifying Thyme Care Medical visits and related services
    - Expands product from navigation into affordability operations
    - Need utilization, approval rates, and funding economics
  notes: Maturity is based on public product pages, case studies, and partner materials as of 2026-05-25; exact customer counts, uptime, and implementation depth remain private.
