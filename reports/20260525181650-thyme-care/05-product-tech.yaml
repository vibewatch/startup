- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role
  - Key inputs / dependencies
  - Main risk
  rows:
  - - Thyme Care Connect
    - Member-facing intake, education, and self-service symptom reporting
    - Member identity, messaging, content, assessment forms
    - Public docs are strong on workflow descriptions but sparse on release cadence and security controls for the web surface
  - - Thyme Box profile + acuity engine
    - Aggregates claims, HIE, EHR, clinical, and social inputs into a member profile and prioritization logic
    - Claims feeds, HIE/ADT feeds, EHR data, social-data capture
    - Dynamic-acuity logic is described publicly but not independently validated or technically documented in depth
  - - Playbooks and workflow automation
    - Turns risk signals into role-specific tasks and follow-up sequences
    - Evidence-based support plans, care-team staffing, notification logic
    - Workflow quality depends on maintenance discipline and local operational fit
  - - Thyme Care Signal / provider workflow layer
    - Shares recommendations, eligibility, updates, and direct communication inside provider workflows
    - Partner EHR access, chart context, provider incentives, practice change management
    - Unknown EHR coverage, API method, and support burden create implementation risk
  - - Human care-delivery layer
    - Nurses, social workers, care partners, NPs, and medical directors execute interventions and escalation
    - Licensed staffing, training, supervision, clinical escalation paths
    - The model is labor-intensive and may scale more slowly than software-only navigation tools
  - - Partner-performance layer
    - Supports pharmacy interventions, reporting, and upside-sharing value-based programs
    - Provider and payer incentives, custom files, dashboards, practice governance
    - Savings durability depends on physician buy-in and operational adoption, not just recommendations
  notes: Architecture reflects only what public pages and case studies disclose. Thyme documents workflow behavior well enough to map surfaces, but not enough to verify vendor choices or nonfunctional controls.
