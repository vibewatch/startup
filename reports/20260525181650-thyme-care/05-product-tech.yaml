- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Pre-Thyme workflow
  - Thyme solution
  - Evidence of benefit
  - Known limitation
  rows:
  - - Get oriented after a cancer diagnosis
    - Member juggles oncologist instructions, plan rules, and fragmented support channels
    - Oncology-trained care team and Connect onboarding create a coordinated plan and ongoing check-ins
    - Public partner materials describe better support and continuity across diagnosis through survivorship
    - Public evidence does not disclose average onboarding time or activation rates
  - - Surface symptoms between clinic visits
    - Symptoms often wait until the next visit or become ED visits
    - Connect/ePRO surveys feed Thyme Box and trigger nurse outreach or oncologist coordination
    - HCTTF reports a 28% relative risk reduction in ED or inpatient events for ePRO completers
    - Outcome analysis is from Thyme internal data and was not independently validated by HCTTF
  - - Resolve social and financial barriers
    - Patients search for transportation, grant, food, or housing help on their own
    - Care partners and social workers screen for barriers and connect members to local resources and grants
    - PRNewswire and AJMC describe high screening rates and successful connections to helpful resources
    - Local resource availability varies by geography and is not fully under Thyme's control
  - - Handle post-discharge transitions
    - Practice staff manually track hospital discharges and follow-up needs
    - ADT/HIE and EHR-linked workflows plus transition playbooks prompt outreach and follow-up scheduling
    - HCTTF reports 83% of discharged members received coordinated follow-up scheduling within days
    - Exact ADT-feed coverage and chart-integration depth are not publicly disclosed
  - - Reduce drug-spend friction in value-based care
    - Practices rely on blunt utilization management, manual reviews, and disconnected pharmacy workflows
    - Signal, analytics, and EHR-integrated overlays recommend substitutions, waste reduction, and practice-specific workflows
    - AJMC and HCTTF describe clinically aligned drug interventions and 60-70% oncologist adherence to recommendations
    - Change management remains practice-specific and depends on clinician buy-in
  - - Pay for Thyme-delivered clinical support
    - Members face copays and deductibles for covered medical support visits
    - Payment Support Program helps qualifying members cover copays, deductibles, and coinsurance for Thyme Care Medical services
    - Official payment-support page shows concrete financial-assistance workflow inside the service stack
    - Public docs do not disclose approval rates, budget, or loss ratios for the program
  notes: Benefits mix company-reported outcomes and partner case-study evidence; where public proof is limited, the limitation column names the diligence hole explicitly.
