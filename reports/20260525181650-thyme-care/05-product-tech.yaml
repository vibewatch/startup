- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / control surface
  - Public evidence
  - Scope
  - Status
  - Gap / implication
  rows:
  - - HIPAA-governed data handling
    - Privacy policy says PHI use with provider or plan customers is governed by HIPAA agreements
    - Protected health information collected in service delivery
    - Disclosed
    - Public policy confirms legal framing but not technical controls, subprocessors, or audit results
  - - Telehealth boundary and clinical authority
    - Terms state Thyme Care Inc. does not practice medicine and Thyme providers do not direct diagnosis or prescribe cancer treatment
    - Online/mobile services and telehealth support
    - Disclosed
    - Clarifies supportive role, but exact escalation rules and clinical-governance model are not fully public
  - - Account and communications controls
    - Terms describe user accounts, authentication responsibilities, email/SMS/push communications, and acceptable use
    - Member online and mobile services
    - Disclosed
    - No public SSO, MFA, uptime, or incident-response detail found
  - - Validated psychosocial screening
    - ISS materials cite NCCN Distress Thermometer, PHQ-2, GAD-2, and Columbia Suicide Risk Assessment
    - Psychosocial triage and support planning
    - Disclosed
    - Public evidence covers tool use, not quality-assurance metrics or false-positive/negative rates
  - - Structured ePRO and HRSN assessments
    - Thyme Box, AON, and HCTTF materials document ePRO and HRSN collection plus playbook-driven follow-up
    - Symptom management, transitions, and social-needs workflows
    - Disclosed
    - Assessment cadence and completion benchmarks are partly public but not fully audited
  - - Security, privacy, and AI-governance hiring
    - Careers and job feed show Head of Enterprise Compliance & Privacy, VP of Security, AI Program & Governance Lead, and platform roles
    - Internal control build-out and governance capacity
    - Positive signal
    - Hiring proves investment intent, not completed certification or audit posture
  - - External security certifications or audit reports
    - No retained public source disclosed SOC 2, HITRUST, ISO 27001, or a public security page
    - Enterprise buyer trust and procurement
    - Undisclosed
    - This is a material diligence gap for a data-rich, workflow-embedded healthcare platform
  notes: This table distinguishes public legal/process controls from missing external validation. The absence of a disclosed certification page is itself a diligence finding, not evidence that certifications do not exist privately.
