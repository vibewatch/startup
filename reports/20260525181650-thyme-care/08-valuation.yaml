- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis
  - Anti-thesis / what would change the view
  rows:
  - - Strategic sponsorship
    - Morgan Health, Humana, Texas Oncology, and Memorial Hermann participation suggests real buyer relevance.
    - Strategic names do not prove durable unit economics; the view would improve if those relationships translated into audited renewal and expansion data.
  - - Operational proof
    - Press releases say Thyme is profitable, manages >$5B of oncology spend, and reaches 8M people.
    - Those are still largely company-framed metrics; the view would improve with audited revenue, EBITDA, and cohort retention.
  - - Category premium
    - Oncology specialization can justify some premium to generic navigation vendors.
    - Public proxy multiples still look services-like, not software-like; the view would improve if Thyme shows superior margins or retention versus broad platforms.
  - - Current price support
    - A >$1B confirmed round gives a credible floor for late-stage valuation.
    - Exact current mark remains conflicted across public sources; the view would improve if management reconciles the $1.0B versus $1.5B spread.
  - - Exit path
    - Strategic M&A remains plausible because incumbents still need oncology workflow and navigation capability.
    - IPO readiness looks low without audited disclosure; the view would improve only after a public-company-grade reporting cadence emerges.
  notes: 'The anti-thesis column is intentionally action-oriented: each item names the evidence that would move the recommendation, not just the risk itself.'
