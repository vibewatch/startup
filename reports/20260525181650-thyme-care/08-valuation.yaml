- id: comp-set-and-method
  title: Comparable set supports service-style, not software-style, pricing discipline
  body: |-
    The comp set needs to mix private navigation platforms, oncology services platforms, and public value-based-care proxies because no single public peer cleanly matches Thyme Care's combination of oncology focus, payer alignment, and private-market opacity. Transcarent is the best broad navigation benchmark: Tracxn shows a $2.2 billion valuation from its 2024 Series D, and its January 2025 acquisition of Accolade for roughly $621 million equity value shows both strategic ambition and how harsh public-market pricing can be for navigation assets that are broader than Thyme. OneOncology is not a direct business-model match, but Cencora's roughly $5.0 billion cash consideration and Fierce's $7.4 billion enterprise-value framing show where scaled oncology-services platforms can clear when they own far more provider infrastructure and revenue than Thyme currently discloses.

    The public proxies reinforce discipline. Evolent, Astrana, Privia, and agilon trade between about 0.21x and 1.16x EV/sales, with a median near 0.73x. Those are not perfect peers, but they are all closer to services-heavy, risk-bearing healthcare operators than to pure software businesses. That matters because Thyme's public materials still do not expose a revenue base that investors can plug into those multiples. The comp lesson is therefore directional rather than precise: current public market clearing prices for value-based care platforms are modest, while private navigation and oncology platforms can command higher marks only when either scale or strategic control is visibly stronger than Thyme's public disclosure currently proves.
  claimRefs:
