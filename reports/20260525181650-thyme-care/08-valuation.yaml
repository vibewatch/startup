- id: valuation-context
  title: Valuation context is real but internally inconsistent
  body: |-
    The most defensible hard anchor is the SEC filing. Thyme Care's Form D says the first sale occurred on April 4, 2025 and that $97.0 million had been sold from a $100.0 million offering to 14 investors. The company then publicly announced the Series D on September 25, 2025, and multiple outlets repeated management's framing that the round pushed Thyme above the unicorn threshold. That combination supports the existence of a bona fide late-stage financing and removes doubt that the company cleared a $1 billion valuation floor.

    What it does not do is settle the exact valuation. Premier Alternatives shows a $1.5 billion valuation and $280.6 million total funding as of the same September 25, 2025 date, while Tracxn shows $1.0 billion post-money and $275 million total funding tied to the April 4, 2025 first-sale date. Those can be reconciled only with additional private information: a cap-table view, a methodological explanation for the secondary mark, or a later financing/secondary print that public sources have not fully documented. The right takeaway is not to pick the most flattering number. It is to preserve the conflict. Public evidence currently supports a range, not a single clean point estimate, and the lack of audited financial disclosure means even that range should be treated as provisional.
  claimRefs:
