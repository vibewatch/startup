  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: exact-valuation-mark
    missingEvidence: A reconciled explanation for why public references show >$1B, $1.0B, and $1.5B marks for the same financing window.
    whyItMatters: The recommendation hinges on whether the current investable price is closer to the confirmed round floor or to the upper secondary mark.
    diligencePath: Request the Series D price per share, post-money cap table, and management/investor explanation for the Tracxn and Premier Alternatives marks.
    relatedQuestionRefs:
    - QV004
  - type: enumeration-incomplete
    severity: material
    topic: private-comparable-coverage
    missingEvidence: Open-data current valuation marks for Included Health and other direct oncology-navigation peers remain sparse.
    whyItMatters: The comparable table necessarily leans on broader navigation and oncology-services references, which limits precision.
    diligencePath: Use subscription datasets or direct banker materials to pull current private marks for the remaining navigation and oncology-management comp set.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack
    missingEvidence: Series-by-series liquidation preferences, participation terms, conversion rights, and ownership dilution.
    whyItMatters: Headline post-money valuation can overstate common-equity value materially if preferences are heavy.
    diligencePath: Review the current cap table, charter, and Series D term sheet before underwriting downside or entry price.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited 2025 revenue, EBITDA, cash, burn, gross / care margin, and customer concentration.
    whyItMatters: Without these, investors cannot test whether the current mark is justified by durable economics or just by strategic sponsorship.
    diligencePath: Request audited 2025 financial statements plus 2026 year-to-date management accounts and cohort dashboards.
    relatedQuestionRefs:
    - QV025
    - QV030
