- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Explicit assumptions
  - Valuation / return logic
  - Probability signal
  - Key risk
  rows:
  - - Bear
    - Profitability claim proves shallow, audited revenue remains undisclosed, and investors underwrite Thyme closer to public-navigation and policy-risk anchors.
    - $0.6B-$1.0B range anchored by Accolade's $621M take-private and Thyme's confirmed unicorn floor.
    - More likely if diligence cannot reconcile the valuation conflict or if a new round prices below the unicorn narrative.
    - A valuation reset can still occur even if the company continues growing operationally.
  - - Base
    - Profitability is real, strategic investors keep expanding access, and diligence narrows but does not eliminate disclosure gaps.
    - $1.0B-$1.5B range anchored by confirmed round support and the currently visible secondary mark.
    - Most likely if audited revenue/cash data are acceptable but still not strong enough to justify broad-platform pricing.
    - Investors may overpay if the $1.5B mark reflects thin secondary activity rather than a durable financing level.
  - - Bull
    - Audited financials confirm durable profitability, payer retention is strong, and oncology specialization earns a premium closer to broad navigation leaders.
    - $1.5B-$2.2B range anchored by the upper secondary mark and Transcarent's $2.2B private valuation.
    - 'Requires new proof, not just more publicity: audited revenue, margin durability, and a financing or strategic event that validates the upper range.'
    - The company still carries narrower scope and lower disclosure than Transcarent, so premium parity is not automatic.
  notes: Ranges are equity-value heuristics, not DCF outputs. They are anchored to disclosed round marks, private-platform valuations, and public benchmark pressure rather than to an undisclosed current revenue base.
  claimRefs:
