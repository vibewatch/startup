- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Down round
    - Any new primary financing below the public unicorn narrative or clearly below the 2025 disclosed floor
    - Would show that secondary or press-based marks overstated clearing value
    - Treat as thesis break until price and preference stack are re-underwritten
  - - Profitability reversal
    - Management retracts profitability or audited results show material operating losses
    - Would weaken the core argument for paying a premium to generic navigation vendors
    - Pause entry until unit economics are re-validated
  - - Unresolved valuation conflict
    - Management cannot reconcile the $1.0B versus $1.5B mark spread in diligence
    - Would signal that valuation support is still too synthetic or fragmented
    - Anchor to lower end of range or pass
  - - Policy / savings disappointment
    - New evidence shows Thyme-like oncology programs fail to generate durable payer savings
    - Would compress willingness to pay for oncology VBC platforms category-wide
    - Use bear-case range and demand a larger discount
  - - Strategic customer slippage
    - Loss of a marquee payer / provider sponsor or stalled contract expansion
    - Would weaken the strategic-premium argument underpinning the round narrative
    - Revisit growth assumptions before further diligence
  notes: Thresholds are intentionally event-based because Thyme does not publish the internal operating metrics that would support cleaner numerical tripwires.
  claimRefs:
  - CV034
  - CV035
  - CV038
  - CV044
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited 2025 financials
    - Revenue, gross margin / care margin, EBITDA, cash, and burn
    - Without them, current marks cannot be normalized to any public multiple with confidence
    - Request audited 2025 financial package plus year-to-date 2026 board materials
  - - Cap table and preferences
    - Series-by-series ownership, liquidation preferences, participation features, and option pool
    - Downside value can differ sharply from headline post-money without this view
    - Review cap table, stock ledgers, and the Series D term sheet
  - - Valuation reconciliation
    - Methodology behind the $1.5B Premier Alternatives mark and why Tracxn shows $1.0B / Apr. 4, 2025
    - This determines whether the upper mark is investable or just indicative
    - Ask management and lead investors to reconcile primary and secondary references
  - - Cohort economics
    - Payer / employer / provider cohort retention, gross savings, Thyme take-rate, and payback
    - Proves whether the profitability claim is durable or logo-concentrated
    - Review cohort dashboards and contract-level reconciliations
  - - Customer concentration
    - Revenue mix by payer, provider, employer, and channel
    - A strategic round can still hide concentration risk
    - Request top-10 customer concentration and renewal calendar
  - - Exit preparedness
    - Disclosure readiness, governance, and buyer map
    - Clarifies whether the realistic path is strategic M&A or extended private compounding
    - Review board materials on financing strategy, banker outreach, and governance maturity
  notes: Items are ordered by how directly they would move valuation confidence. The first three are gating diligence asks before underwriting at the upper end of the current public range.
