- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / valuation
  - Status
  - Relevance
  - Limitation
  rows:
  - - Thyme Care (confirmed round framing)
    - '> $1.0B post-Series D; $97.0M sold; $275M total raised publicly framed'
    - Private late-stage oncology navigation / VBC enabler
    - Best current floor for entry discipline because it is tied to the actual 2025 financing
    - Still not an exact post-money figure; public sources do not reconcile to one number
  - - Thyme Care (secondary / market-data mark)
    - $1.5B valuation; $280.6M total funding on Premier Alternatives
    - Private secondary-style mark
    - Represents the upper end of current public market-data support
    - Methodology is opaque and not confirmed by a new primary financing
  - - Transcarent
    - $2.2B valuation; $424M raised (Tracxn)
    - Private broad navigation platform
    - Useful upper-bound navigation comp with greater breadth across care experiences
    - Much broader than Thyme and not oncology-specific
  - - Accolade
    - $621M equity value take-private at $7.03/share
    - Former public navigation platform acquired in 2025
    - Demonstrates how harsh public-market pricing can be for broad navigation assets
    - Broader advocacy and primary-care mix makes it an imperfect oncology proxy
  - - OneOncology
    - ~$5.0B cash consideration / $7.4B EV framing in 2025
    - Scaled oncology-services platform
    - Shows what a mature oncology-services asset can be worth when scale and infrastructure are much larger
    - Provider-network MSO economics are far more capitalized than Thyme's disclosed model
  - - Public proxy basket (Evolent / Astrana / Privia / agilon)
    - 0.21x-1.16x EV/sales; median ~0.73x
    - Public value-based-care / physician-enablement proxies
    - Best available public multiple range for services-heavy healthcare operators
    - All disclose revenue and are more diversified than Thyme, so they are directional rather than directly comparable
  notes: This is a partial comparable set focused on the most decision-useful private and public references available in open sources as of the run date. Included Health remains a breadth reference, but accessible previews do not expose a clean current mark.
