  - id: governance-financial-and-thesis-break-risk
    title: Governance, channel concentration, and unaudited financial claims are still major diligence items
    body: >-
      Thyme's governance picture is better than many private health-tech peers but still not transparent enough to clear
      key-person or capital-risk concerns. The team page shows a visible senior bench around Robin Shah, Bobby Green,
      Brad Diephuis, Jesse Waldron, and Michael Markowicz, and the board includes investor representation from a16z,
      Concord, Lightspeed, CVS, and Town Hall with observers such as Bill Frist. That helps, but it also underscores how
      much strategic context sits with a relatively small set of founders, operators, and venture backers. Commercially,
      the same partners often appear as investors, distribution validators, and operational dependencies: Humana, Texas
      Oncology, Memorial Hermann, Morgan Health, EmblemHealth, AON, and other risk-bearing groups. This is powerful when
      it works, but it can create correlated downside if one channel stalls, reprices benchmarks, or decides to build or
      buy elsewhere. Financially, the 2025 Form D confirms a real $97.0 million financing with 14 investors, yet the
      strongest profitability and scale metrics remain management statements rather than audited disclosures. Public
      materials do not disclose contract-level benchmarks, payer-by-payer concentration, cash runway, or audited margins,
      so kill criteria should focus less on abstract TAM questions and more on concrete evidence: independent ROI
      replication, security incident history, concentration, care-team fill rates, and whether management can defend the
      public profitability narrative with sponsor-level economics.
    claimRefs:
