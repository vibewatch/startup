  evidenceGaps:
    - type: missing-source
      severity: material
      topic: litigation-enforcement
      missingEvidence: A complete schedule of pending or threatened litigation, subpoenas, OCR/CMS inquiries, demand letters, and settlement discussions involving Thyme Care or its clinical affiliates.
      whyItMatters: Public web research did not surface a clean Thyme-specific legal docket, but absence of easy discovery is not the same as absence of exposure.
      diligencePath: Request litigation and investigation schedules from counsel, board materials, and insurance-carrier loss runs; confirm against OCR/CMS correspondence logs.
      relatedQuestionRefs:
        - QR026
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: contract-economics
      missingEvidence: Representative payer and provider contracts showing benchmark logic, exclusions, downside corridors, renewal terms, and reconciliation methodology.
      whyItMatters: Public ROI claims cannot be underwritten without seeing how much of the savings Thyme actually keeps and what conditions can reprice the economics.
      diligencePath: Review top payer and TCOP contracts plus at least two completed reconciliation packages and one underperforming partner case.
      relatedQuestionRefs:
        - QR014
        - QR028
      relatedTableRefs:
        - TR002
        - TR003
        - TR005
    - type: private-evidence-only
      severity: material
      topic: privacy-security-controls
      missingEvidence: Vendor inventory, BAA coverage, penetration tests, security audits, incident logs, and model-governance documentation for AI or decision-support tooling.
      whyItMatters: Thyme's compliance exposure depends on actual control implementation, not on hiring plans or policy statements alone.
      diligencePath: Request security room materials, most recent audit and red-team outputs, HIPAA risk analysis, and privacy review of tracking technologies and member-facing workflows.
      relatedQuestionRefs:
        - QR004
        - QR005
        - QR029
      relatedTableRefs:
        - TR001
        - TR002
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited revenue, gross margin, EBITDA or operating income, cash balance, burn/runway, and sponsor-level unit economics that reconcile to the public profitability claim.
      whyItMatters: A company can truthfully claim profitability on a narrow internal basis while still being difficult to underwrite on a durable cash-generation basis.
      diligencePath: Review audited financials or board-grade monthly package, cash forecast, and channel-level economics for Medicare, commercial, employer, and provider-risk cohorts.
      relatedQuestionRefs:
        - QR028
      relatedTableRefs:
        - TR005
    - type: enumeration-incomplete
      severity: material
      topic: concentration
      missingEvidence: A complete concentration table for revenue, attributed members, and gross profit by payer, provider partner, employer, and strategic-investor-linked channel.
      whyItMatters: Public logo breadth does not reveal how concentrated the economic base actually is, and correlated channel concentration can amplify downside.
      diligencePath: Request top-10 concentration schedules, renewal calendar, and scenario analysis for the loss or repricing of each major partner cluster.
      relatedQuestionRefs:
        - QR015
        - QR030
      relatedTableRefs:
        - TR003
