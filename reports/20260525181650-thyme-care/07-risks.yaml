company:
  name: Thyme Care
chapter:
  number: 7
  title: Risks
  summary: >-
    Thyme Care's highest residual risks come from proving that a labor-intensive, privacy-sensitive,
    outcomes-based oncology platform can keep generating defensible savings as it scales across payers,
    employers, and oncology practices. Public evidence supports real traction and strategic validation, but
    CMS's mixed oncology-model history, HCTTF's non-independently-validated outcome charts, rising
    HIPAA/privacy/AI scrutiny, and a care model that still requires heavy hiring across clinical, privacy,
    security, and AI-governance functions keep residual exposure high until diligence confirms contract
    economics, incident history, and concentration.
sections:
  - id: regulatory-legal-and-privacy-risk
    title: Regulatory, legal, and privacy risks are elevated because Thyme sits in the middle of PHI-heavy workflows
    body: >-
      Thyme Care's legal and regulatory risk is not concentrated in one license or one case; it is distributed across
      corporate structure, HIPAA data handling, cybersecurity, telehealth, and emerging AI/algorithm rules.
      Official legal language says Thyme Care, Inc. provides management and non-clinical support while Thyme Care
      Medical, PLLC and Bobby Green Medical, P.C. provide clinical support, which is a common but compliance-heavy
      structure when a company scales nationally across payer, employer, and provider relationships. The privacy
      policy also confirms that Thyme uses cookies, web beacons, Google Analytics, third-party analytics, and health
      information exchange workflows, so the compliance surface is larger than a simple member-facing support service.
      HHS OCR's tracking-technology bulletin is directly relevant: authenticated portals generally involve PHI, some
      unauthenticated scheduling or symptom-entry pages can also trigger PHI obligations, and tracking vendors may
      require BAAs or patient authorizations. HHS has simultaneously proposed a materially tougher HIPAA Security Rule
      after large-breach and ransomware growth, while Section 1557's 2024 final rule explicitly reaches patient care
      decision support tools and telehealth. The practical implication is that Thyme's legal exposure is partly a
      function of execution quality: the company is hiring for AI governance, privacy, and security because regulatory
      expectations now move faster than generic startup compliance checklists.
    claimRefs:
