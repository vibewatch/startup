            body: >-
              Public documentation points to a three-surface software architecture layered on top of a large
              care-delivery organization. Thyme Care Connect is the member-facing digital front door. Thyme Box is the
              internal care-management system that aggregates data, pre-populates member profiles, captures ePRO and
              HRSN assessments, and gives the care team dashboards, playbooks, and reporting. Thyme Care Signal is the
              provider-facing workflow layer that surfaces eligibility, updates, and recommendations directly inside
              oncology workflows. Together they create a closed loop between member-reported needs, internal triage, and
              provider follow-through.


              The software is tightly coupled to a multidisciplinary operating model. The care-team page lists medical
              directors, palliative-care physicians, oncology nurses, social workers, care partners, and enrollment
              specialists, and says the company has 500-plus oncology-trained professionals. The 2026 Integrated Social
              Support launch adds a clearer psychosocial module: licensed social workers become early responders, 100%
              of members are screened for psychosocial barriers, and validated tools such as the NCCN Distress
              Thermometer, PHQ-2, GAD-2, and Columbia Suicide Risk Assessment are part of the workflow. Pharmacy
              Solutions and Thyme Care Medical extend the footprint further into drug-spend optimization and virtual
              clinical support. The result is a real service architecture with named modules, but its coherence depends
              on tight orchestration across humans, software, and partner workflows.
