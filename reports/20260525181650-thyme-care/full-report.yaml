  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / public signal
      - Target segment
      - Key differentiation
      - Key limitation versus Thyme Care
    rows:
      - - Thyme Care
        - Oncology navigation + VBC enabler
        - 8M members with access; 850+ oncologists in TCOP; 40K+ people with cancer expected in 2025
        - Health plans, employers, risk-bearing providers
        - Payer-risk alignment plus direct oncology collaboration and pharmacy-oriented savings interventions
        - Public pricing and peer-reviewed outcomes remain limited
      - - OncoHealth
        - Payer-focused oncology management + supportive care
        - 22 health plan partners; 15M members supported; 4K employer partners
        - Health plans and employers
        - Deep oncology specialization with utilization management plus 24/7 supportive care
        - Less visible provider-enablement network than Thyme Care
      - - Lantern
        - Employer cancer navigation + specialty care platform
        - 12M people served; 1M members in comprehensive cancer solution; 1,000+ employers
        - Large employers and benefits teams
        - High-touch oncology nurse navigation with NCI-review partner and local site-of-care steering
        - Employer-centric positioning is less payer-native than Thyme Care
      - - Transcarent + Accolade
        - Broad navigation + care + advocacy platform
        - 20M+ members; 1,700+ employer and health-plan clients
        - Self-insured employers and health plans
        - >-
          Broadest integrated breadth across navigation, cancer care, advocacy, expert opinion, primary care, and
          pharmacy
        - Cancer is one experience inside a much broader platform rather than the sole operating focus
      - - Included Health
        - Integrated navigation + specialty care stack
        - 4,000+ specialists; millions served nationally; specialty clinic with Cancer Center
        - Employers and health plans
        - Combines navigation, expert medical opinion, specialty access, primary care, and mental health
        - Cancer is nested inside a broader specialty and navigation platform
      - - Carrum Health
        - Bundled centers-of-excellence cancer benefit
        - Largest COE network; up to 30% episode savings; little-to-no member OOP in many cases
        - Self-insured employers
        - Hard bundled-economics substitute with pre-negotiated prices and advisory oncologists
        - Weaker longitudinal navigation and ongoing symptom-management story
      - - Navigating Care + OneOncology
        - Provider workflow and care-management platform
        - 2,000 providers; ~1M patients; OneOncology network backing
        - Community oncology practices
        - Strong clinic workflow, ePRO, medication-adherence, and value-based reimbursement support
        - Less payer-sponsored member advocacy outside the clinic
      - - UnitedHealthcare / Evernorth / Cigna / Kaiser
        - Carrier-embedded or integrated-delivery oncology support
        - 30K+ UHC patients annually; national COE and bundled options; integrated care teams
        - Existing plan members and integrated-system patients
        - Distribution power, built-in trust, and no need for a new point solution in some cases
        - Support quality and scope vary by sponsor and product
      - - Tempus / Guardant / ICON
        - Diagnostics and pathway-intelligence adjacency
        - 6.5K+ oncologists on Tempus; 500K+ Guardant tests by 12K doctors; global ICON patient/site services
        - Providers, labs, biopharma, and patients
        - Can own high-value parts of pathway guidance, trial matching, testing access, and patient support
        - Do not replace the full navigation-and-care-coordination layer on their own
    notes: >-
