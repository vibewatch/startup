          - type: callout
            title: Adoption can lag even while the macro problem gets worse
            body: >-
              The same factors that make oncology navigation attractive—workforce strain, rising drug trend, fragmented
              workflows, and policy pressure—also make implementations harder to land. Public evidence still shows a
              small formal VBC footprint, integration-heavy deployment requirements, and incomplete independent ROI
              disclosure, so commercial scaling may trail the growth of oncology spend itself.
