            body: >-
              The sharpest direct threats to Thyme Care are the oncology-focused vendors that can sell to plans or
              self-insured employers without asking buyers to redesign everything else. OncoHealth is the cleanest
              payer-facing direct peer in the retained source set: it combines oncology management and supportive care,
              claims meaningful scale with 22 health-plan partners and 15 million members supported, and is explicit
              that the product is built only for oncology. Lantern is similarly oncology-specific, but its go-to-market
              is more employer-led and its differentiation comes from high-touch oncology nurse navigation, sub-10-day
              appointment access, and the 2026 AccessHope partnership that adds NCI-designated expert review and
              clinical-trial matching. Included Health is a broader incumbent rather than a single-category peer, yet it
              still matters because its Expert Medical Opinion service and newer Specialty Care Clinic give employers a
              way to buy cancer-related support inside a broader navigation and virtual-care contract. Transcarent
              became even harder to ignore after absorbing Accolade, because the combined platform now bundles cancer
