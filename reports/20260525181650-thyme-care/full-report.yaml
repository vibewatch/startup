      - number: '8.5'
        title: Strategic exit is more plausible than IPO; diligence still needs to close core gaps
        blocks:
          - type: paragraph
            body: >-
              Thyme Care does not yet look IPO-ready from the outside. The company has strategic momentum, but public
              markets reward audited revenue history, predictable margins, and repeatable disclosure habits that Thyme
              still lacks. That makes the strategic path more plausible today: a payer, care-navigation platform,
              oncology-services consolidator, or benefits infrastructure buyer could rationalize Thyme as a capability
              layer rather than a standalone public company. The strategic logic is credible because Thyme sits at the
              intersection of oncology navigation, payer cost management, and provider workflow extension, all areas
              where incumbents still struggle.


              Even so, final underwriting cannot rely on strategic optionality alone. The biggest missing items are
              concrete: audited 2025 revenue, EBITDA, and cash; the liquidation preference stack and any participating
              features; cohort retention and sponsor-level economics; and an explanation for why secondary data sources
              show a $1.5 billion mark when other public records only support a >$1 billion floor. Those are not
              cosmetic asks. They determine whether Thyme is being priced like a genuinely de-risked oncology platform
              or like a promising but still opaque private asset. Until that packet is available, the right committee
              posture is disciplined curiosity rather than aggressive entry.
            claimRefs:
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
