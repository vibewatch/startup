  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Thyme Care does not compete in the full oncology economy. Its public materials place it in a narrower
              operating layer: oncology navigation, wraparound clinical support, and value-based oncology enablement
              sold into payer and provider workflows. On the payer side, Thyme Care describes comprehensive cancer-care
              navigation, analytics, and symptom-management support that reduce total cost of care for health plans and
              other risk-bearing entities. On the provider side, it positions itself as an extension of oncology groups
              and health systems, offering between-visit support, performance programs, and shared-savings structures
              while Thyme Care takes downside risk. The TCOP model adds bi-directional integration with oncology
              practices, drug-spend interventions, and scaled risk aggregation across payers and physician groups.


              That boundary excludes several large but adjacent pools of spend. Thyme Care is not a drug manufacturer,
              infusion provider, EHR vendor, or full-risk insurer. It does not replace oncologists or PCPs; even
              member-facing pages emphasize coordination with existing doctors rather than substitution. The relevant
              comparison set is therefore status-quo cancer care management: payer case management programs,
              provider-employed navigators, generic utilization management, disease-management vendors, and fragmented
              referral, social-needs, and follow-up workflows run under fee-for-service incentives. The real diligence
              question is whether buyers treat oncology navigation as a standalone budget line, an extension of existing
              case management, or a value-based oncology operating layer embedded inside broader payer-provider
              contracts.
