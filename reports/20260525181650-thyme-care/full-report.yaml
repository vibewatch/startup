      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track, not buy'
            body: >-
              Thyme Care looks strategically relevant and operationally credible, but current public evidence does not
              justify paying the top of the visible valuation range without audited financials and cap-table
              transparency.
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV040
              - CV045
          - type: callout
            title: 'Primary valuation risk: synthetic precision'
            body: >-
              The biggest underwriting mistake here would be treating the current mark as a clean number. Public sources
              still leave investors choosing among a >$1B floor, a $1.0B market-data mark, and a $1.5B secondary-style
              mark.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV011
