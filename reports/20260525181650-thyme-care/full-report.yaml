      - number: '3.4'
        title: Switching costs, moat durability, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Thyme Care still has a coherent position. Its best public signals are payer and provider alignment, a
              growing oncology-partner network, and a care model that connects navigation to clinical support and
              pharmacy intervention rather than to generic benefits help. Those ingredients do create switching cost
              because once a vendor is integrated into member outreach, oncologist coordination, data flows, and
              alternative-payment operations, replacing it is disruptive. Still, the moat is only moderate. Multi-homing
              is entirely plausible: a plan can keep carrier cancer support, use a provider workflow platform in
              clinics, steer selected cases through Carrum, and still layer on a navigation vendor. Broad navigation
              incumbents also compress differentiation by bundling cancer with advocacy, primary care, and AI
              navigation. Public economics remain opaque for most vendors, which shifts competitive cycles toward trust,
              referenceability, and measurable outcomes. That is where the main adverse evidence sits today: Navigating
              Cancer can cite named public outcomes data, while Thyme Care’s best public proof remains company and
              partner material. Unless Thyme continues to show independent evidence and renewal durability, carriers,
              provider incumbents, and modular diagnostics platforms can steadily commoditize the category.
