      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are clear. Cancer incidence and survivorship are rising, specialty-drug
              pipelines are getting more expensive and operationally complex, and both employers and MA plans are under
              pressure to control total cost of care. CMS has also made the direction of travel explicit: EOM ties
              oncology episodes to navigation, 24/7 access, care plans, ePROs, HRSN screening, and downside-risk
              accountability. Stout, Evernorth, Prime, Milliman, and KFF all reinforce adjacent versions of the same
              thesis—oncology is becoming more expensive, more technology-intensive, and more strategically important to
              sponsors that own medical and pharmacy trend. For Thyme Care specifically, that is favorable because its
              public model is built around oncology-specific support, integration, and performance alignment rather than
              generic care management.


              The constraints are just as important. Formal value-based oncology adoption is still early; EOM's public
              footprint remains small relative to the broader market. Oncology workforce shortages are worsening, with
              ASCO projecting only 29% of rural oncologist demand met by 2037, which both raises demand for support
              tools and limits implementation bandwidth. Provider groups also face burnout, prior-authorization delays,
              and uneven oncology-specific infrastructure. Thyme Care itself argues that many support activities sit
              outside fee-for-service reimbursement and that it can take three to five years for savings to offset
              staffing and infrastructure investment. Those are not trivial go-to-market frictions.


              Data fragmentation and trust are the final gating issues. Thyme Care's own model depends on claims, HIE,
              and EHR data, bi-directional workflow integration, and frequent patient contact. If outreach feels
              generic, members disengage; if provider workflows are duplicated, practices resist; if ROI proof remains
              mostly company-authored and region-specific, procurement cycles lengthen. The practical diligence
              conclusion is that Thyme Care operates in an attractive problem area with real policy and cost tailwinds,
              but adoption will be won buyer by buyer through integration quality, provider alignment, and evidence that
              navigation changes avoidable utilization rather than merely adding another vendor layer.
