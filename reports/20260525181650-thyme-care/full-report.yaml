companyProfile:
  summary: >-
    Thyme Care is a Nashville-based oncology care navigation and value-based cancer care company founded in 2020 by
    Robin Shah and Bobby Green, MD. The company sells sponsor-paid programs to health plans, employers, and risk-bearing
    providers, pairing a 500-plus-person oncology-trained care team with software, symptom monitoring, provider workflow
    tools, and payer/provider contracting infrastructure. Public evidence through spring 2026 shows a fast-growing
    platform that reached 85,000 members by the end of 2025, extended access to 8 million people, worked with more than
    1,400 oncologists, and raised a $97 million Series D backed by a strategic syndicate of health plans, employers, and
    oncology providers.
