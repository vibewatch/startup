      - number: '7.2'
        title: The core model risk is that public outcomes proof is promising but still not independently durable at scale
        blocks:
          - type: paragraph
            body: >-
              The biggest investment risk is not whether cancer navigation matters; it is whether Thyme's value-based
              model remains economically repeatable outside a narrow set of partner proofs. Company-friendly
              publications openly admit that prior oncology value-based models such as OCM and EOM have often failed to
              deliver the hoped-for blend of better outcomes and lower cost. CMS's own OCM final evaluation is the
              strongest disconfirming source in the file: it found lower episode expenditures but still net losses to
              Medicare above $600 million once monthly and performance-based payments were counted. Thyme's answer is to
              contract directly on total cost of care, put fees at risk, and align more tightly with oncologists and
              payers. That may be structurally better, but the public proof set is still concentrated in
              partner-generated evidence. HCTTF's 2026 case study reports a 10% PMPM reduction and greater than 2:1 ROI
              in one MA partnership, yet the same document says the outcome charts rely on Thyme's internal analysis and
              were not independently validated. AON's EOM results are directionally encouraging, but they are still one
              partner's first-period outcome inside a model where only 36 practices and 2 payers remained. That keeps
              model, renewal, and benchmark-design risk at the top of the severity stack.
