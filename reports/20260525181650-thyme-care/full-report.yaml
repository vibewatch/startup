              files, automated reporting, and workflow overlays to support transitions of care, drug-intervention
              programs, and other value-based activities.


              That level of fit with oncology operations is a real differentiator. Signal surfaces member eligibility
              inside the chart, routes recommendations on drug substitutions and waste reduction into provider
              workflows, and gives oncology teams a direct line back to Thyme's staff. AON's case study says Thyme
              supported more than 2,700 EOM patients with ePRO and HRSN program requirements while reducing manual
              reporting burden through automated capture. But the same evidence also surfaces the downside: rollout
              depends on claims access, HIE or ADT feeds, EHR permissions, local workflow mapping, change management,
              and partner education. Thyme looks more like an embedded operating system for value-based oncology than a
              plug-and-play SaaS app, which raises implementation complexity even as it deepens defensibility.
