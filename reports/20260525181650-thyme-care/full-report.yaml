    title: Public financial gaps table
    columns:
      - Missing metric
      - Why it matters
      - Public proxy today
      - Exact diligence path
    rows:
      - - Realized contract pricing by sponsor type
        - >-
          Without PMPM, case-rate, or benchmark-share terms, lives under management cannot be translated into revenue or
          margin
        - $0-to-member benefit pages plus generic at-risk language
        - Review top payer, employer, and provider contracts with redlines and actual reconciliations
