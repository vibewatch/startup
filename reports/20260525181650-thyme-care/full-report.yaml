      - number: '8.2'
        title: Valuation context is real but internally inconsistent
        blocks:
          - type: paragraph
            body: >-
              The most defensible hard anchor is the SEC filing. Thyme Care's Form D says the first sale occurred on
              April 4, 2025 and that $97.0 million had been sold from a $100.0 million offering to 14 investors. The
              company then publicly announced the Series D on September 25, 2025, and multiple outlets repeated
              management's framing that the round pushed Thyme above the unicorn threshold. That combination supports
              the existence of a bona fide late-stage financing and removes doubt that the company cleared a $1 billion
              valuation floor.


              What it does not do is settle the exact valuation. Premier Alternatives shows a $1.5 billion valuation and
              $280.6 million total funding as of the same September 25, 2025 date, while Tracxn shows $1.0 billion
              post-money and $275 million total funding tied to the April 4, 2025 first-sale date. Those can be
              reconciled only with additional private information: a cap-table view, a methodological explanation for
              the secondary mark, or a later financing/secondary print that public sources have not fully documented.
              The right takeaway is not to pick the most flattering number. It is to preserve the conflict. Public
              evidence currently supports a range, not a single clean point estimate, and the lack of audited financial
              disclosure means even that range should be treated as provisional.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Comparable set supports service-style, not software-style, pricing discipline
        blocks:
          - type: paragraph
            body: >-
              The comp set needs to mix private navigation platforms, oncology services platforms, and public
              value-based-care proxies because no single public peer cleanly matches Thyme Care's combination of
              oncology focus, payer alignment, and private-market opacity. Transcarent is the best broad navigation
              benchmark: Tracxn shows a $2.2 billion valuation from its 2024 Series D, and its January 2025 acquisition
              of Accolade for roughly $621 million equity value shows both strategic ambition and how harsh
              public-market pricing can be for navigation assets that are broader than Thyme. OneOncology is not a
              direct business-model match, but Cencora's roughly $5.0 billion cash consideration and Fierce's $7.4
              billion enterprise-value framing show where scaled oncology-services platforms can clear when they own far
              more provider infrastructure and revenue than Thyme currently discloses.


              The public proxies reinforce discipline. Evolent, Astrana, Privia, and agilon trade between about 0.21x
              and 1.16x EV/sales, with a median near 0.73x. Those are not perfect peers, but they are all closer to
              services-heavy, risk-bearing healthcare operators than to pure software businesses. That matters because
              Thyme's public materials still do not expose a revenue base that investors can plug into those multiples.
              The comp lesson is therefore directional rather than precise: current public market clearing prices for
              value-based care platforms are modest, while private navigation and oncology platforms can command higher
              marks only when either scale or strategic control is visibly stronger than Thyme's public disclosure
              currently proves.
            claimRefs:
              - CV013
