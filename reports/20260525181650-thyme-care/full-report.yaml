      - - Earlier SEC-documented financing
        - 2023 filing showed $49M sold of $60M target; 2021 filing showed $13.77M sold of $18.0M target
        - Company has repeatedly accessed equity capital before latest round
        - Serial fundraising lowers existential risk but not dilution risk
        - Round-by-round ownership and any side letters
