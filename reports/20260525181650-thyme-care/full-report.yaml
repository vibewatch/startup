  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The model's core transmission path runs from imperfect proof and benchmark design into renewals, channel
      expansion, and financing quality rather than just near-term patient growth.
    data:
      nodes:
        - id: model_proof
          label: Model proof / benchmark risk
        - id: cms_history
          label: Mixed CMS oncology-model precedent
        - id: partner_validation
          label: Partner-specific evidence set
        - id: renewals
          label: Contract renewals / repricing
        - id: growth
          label: Commercial growth pace
        - id: gross_margin
          label: Unit economics / gross margin quality
        - id: financing
          label: Financing narrative / valuation
        - id: thesis
          label: Investment thesis durability
      edges:
        - from: cms_history
          to: model_proof
          label: Weakens confidence in generic oncology-VBC claims
        - from: partner_validation
          to: model_proof
          label: Limits how broadly public proof can be generalized
        - from: model_proof
          to: renewals
          label: Drives benchmark credibility and savings confidence
        - from: renewals
          to: growth
          label: Affects payer, employer, and provider expansion
        - from: model_proof
          to: gross_margin
          label: Determines whether labor intensity converts into savings retention
        - from: gross_margin
          to: financing
          label: Shapes profitability credibility and next-round quality
        - from: growth
          to: financing
          label: Slower partner wins weaken valuation support
        - from: financing
          to: thesis
          label: Capital quality sets downside protection and optionality
    approximationNotes: null
    claimRefs:
      - CR016
      - CR017
      - CR021
      - CR023
      - CR024
      - CR032
      - CR033
