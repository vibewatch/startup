  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: The product is a workflow-embedded oncology support service, not a standalone app
        blocks:
          - type: paragraph
            body: >-
              Thyme Care's product is best understood in workflow terms rather than SKU terms. Health plans, employers,
              and provider partners buy a wraparound oncology support service that sits between cancer visits and
              coordinates around the treating oncologist instead of replacing that clinician. The payer page describes
              24/7 virtual support from pre-diagnosis through survivorship, and the provider page says Thyme acts as an
              extension of oncology practices, reducing burden while leaving clinical decision-making with the local
              team. Member-facing pages make the same operating model concrete: eligible Aetna members get day-and-night
              access to nurses, community-health-worker support, provider-backed urgent care, second-opinion help,
              rides, meals, and financial-assistance navigation.


              The digital surface is important, but it is not the whole product. Thyme Care Connect is presented as a
              private online or mobile-friendly web experience where members can request support, complete symptom
              assessments, review educational content, and participate in ePRO-based check-ins. Those inputs then route
              into Thyme's human care model. The public materials consistently frame the software as the front door and
              coordination layer for a multidisciplinary oncology service, not as a self-serve software-only tool. That
              distinction matters for diligence because it explains why Thyme can claim better outcomes than generic
              navigation programs, but it also means scalability depends on staffing, licensure, workflow design, and
              partner integration as much as on software quality.
