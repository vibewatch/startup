  - id: FU001
    title: Customer Journey Map
    type: journey-map
    layout: wide
    summary: How payer, provider, and patient stakeholders interact from contract signature through navigation and expansion.
    approximationNotes: Stages synthesize public payer, provider, and member materials rather than one single customer contract flow.
    claimRefs:
      - CU001
      - CU002
      - CU021
      - CU024
      - CU025
      - CU043
    data:
      nodes:
        - id: contract
          label: Contracting
          description: Health plan, employer, or risk-bearing provider signs a value-based oncology arrangement with Thyme Care.
        - id: provider-integration
          label: Provider integration
          description: Oncology practices or PCP groups align workflows, EHR touchpoints, referral logic, and escalation paths.
        - id: member-identification
          label: Member identification
          description: >-
            Eligible members or patients are identified through attributed populations, plan sponsorship, or Texas pilot
            sign-up.
        - id: navigation
          label: 24/7 navigation
          description: Care Team provides symptom management, education, social-support navigation, and care coordination.
        - id: outcomes
          label: Outcome capture
          description: ePROs, acute-care avoidance, satisfaction, and savings are measured for payer and provider partners.
        - id: expansion
          label: Expansion / renewal
          description: Successful pilots expand to more geographies, practices, or adjacent channels such as senior primary care.
  - id: FU002
    title: Adoption / Deployment Funnel
    type: flow
    layout: wide
    summary: Publicly visible land-and-expand motion from payer signing to provider integration and broader rollout.
    approximationNotes: >-
      This is a workflow flow rather than a numeric conversion funnel because public sources do not provide consistent
      stage conversion rates.
    claimRefs:
      - CU021
      - CU022
      - CU024
      - CU025
      - CU045
      - CU046
      - CU047
    data:
      nodes:
        - id: payers
          label: Named payer / PCP partner
          description: Humana, CenterWell, Premera, EmblemHealth, Oak Street, Vytalize, and others provide channel entry.
        - id: oncology
          label: Oncology partner alignment
          description: TCOP or named provider partners coordinate operationally with Thyme Care.
        - id: eligible
          label: Eligible population identified
          description: Attributed members, cancer patients, or Texas direct-pay prospects are enrolled into the support model.
        - id: support
          label: 24/7 support activated
          description: Navigation, ePROs, transitions-of-care, and social support begin.
        - id: measurement
          label: ROI / quality measurement
          description: Savings, ED avoidance, readmission reduction, and satisfaction become part of customer proof.
        - id: renew-expand
          label: Renew / expand
          description: Successful launches deepen to more states, more practices, or adjacent customer classes.
      edges:
        - from: payers
          to: oncology
        - from: payers
          to: eligible
        - from: oncology
          to: support
        - from: eligible
          to: support
        - from: support
          to: measurement
        - from: measurement
          to: renew-expand
