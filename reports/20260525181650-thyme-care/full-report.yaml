      - number: '5.5'
        title: Trust posture is defined more by legal boundaries and workflow discipline than by public certification pages
        blocks:
          - type: paragraph
            body: >-
              Thyme Care's public trust and compliance posture is tangible but incomplete. The privacy policy says
              HIPAA-governed arrangements with provider and plan customers control protected-health-information
              handling, while the terms of use define the service as online or mobile software, care coordination, and
              telehealth support delivered through Thyme Care Medical rather than by Thyme Care, Inc. directly. The
              terms also state that telehealth is not a substitute for a full medical evaluation or an in-person
              oncology visit and that Thyme providers do not direct cancer diagnosis or prescribe cancer treatment.
              Those boundaries matter because they show Thyme positioning the product as supportive and coordinative,
              not autonomous cancer management.


              The bigger diligence issue is the gap between workflow evidence and public control evidence. Thyme
              publicly documents validated psychosocial tools, structured ePRO and HRSN screening, and care-team
              playbooks, and the hiring footprint includes AI governance, security, privacy, and platform roles. But the
              retained public record does not disclose external security certifications, independent audit reports,
              exact EHR vendors, API details, uptime commitments, or validation details for the dynamic acuity and
              prioritization logic described in press materials. Add the operational reality that the value proposition
              depends on 24/7 licensed humans, local workflow buy-in, and large care-team staffing, and the central
              product risk becomes clear: this is a credible but service-intensive system whose architecture is easier
              to trust operationally than to verify technically from public materials alone.
