  - id: FV002
    title: Valuation sensitivity to exit-multiple assumptions
    type: bar
    layout: standard
    summary: >-
      Public proxy EV/sales multiples frame the exit-multiple sensitivity investors should use when revenue is still
      undisclosed.
    data:
      items:
        - label: agilon EV/sales
          value: 0.21
          unit: x
        - label: Evolent EV/sales
          value: 0.68
          unit: x
        - label: Public proxy median
          value: 0.73
          unit: x
        - label: Astrana EV/sales
          value: 0.77
          unit: x
        - label: Privia EV/sales
          value: 1.16
          unit: x
    approximationNotes: >-
      These are public proxy multiples, not Thyme-specific current multiples. They are used only to bound exit-multiple
      thinking because Thyme does not publicly disclose revenue.
    claimRefs:
      - CV022
      - CV025
      - CV028
      - CV031
      - CV033
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Evidence-bounded equity-value ranges for bear, base, and bull outcomes.
    data:
      items:
        - label: Bear case
          low: 0.6
          mid: 0.85
          high: 1
          unit: USD B
        - label: Base case
          low: 1
          mid: 1.25
          high: 1.5
          unit: USD B
        - label: Bull case
          low: 1.5
          mid: 1.85
          high: 2.2
          unit: USD B
        - label: Current public support band
          low: 1
          mid: 1.25
          high: 1.5
          unit: USD B
    approximationNotes: >-
      Ranges are anchored to the disclosed >$1B floor, the $1.5B secondary-style mark, Accolade's $621M take-private,
      and Transcarent's $2.2B valuation. They are not discounted cash flow outputs.
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: IC-style scoring of the valuation case on a 1-5 scale, where 5 is strongest.
    data:
      items:
        - label: Market tailwind
          value: 4
          note: Cancer cost pressure and strategic sponsor interest support category relevance.
        - label: Strategic proof
          value: 4
          note: Morgan Health, Humana, Texas Oncology, and Memorial Hermann strengthen distribution credibility.
        - label: Economics visibility
          value: 2
          note: Profitability is press-stated, but audited revenue and cash data remain unavailable.
        - label: Comp support
          value: 2
          note: Public proxy multiples are modest and pull against software-style valuation narratives.
        - label: Policy risk
          value: 2
          note: CMS oncology-model evaluations still show mixed to negative net savings outcomes.
        - label: Exit readiness
          value: 2
          note: Strategic exit looks more plausible than IPO at current disclosure depth.
        - label: Valuation discipline
          value: 2
          note: The unresolved $1.0B versus $1.5B spread keeps price support incomplete.
        - label: Evidence quality
          value: 3
          note: The round is real and the comp set is useful, but the financial proof package is still incomplete.
    approximationNotes: Scores are qualitative underwriting aids rather than a weighted model output.
    claimRefs:
      - CV037
      - CV038
      - CV042
      - CV045
