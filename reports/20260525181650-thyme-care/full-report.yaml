  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public evidence suggests mature operational workflows in care-team delivery and growing maturity in workflow
      software, but weaker public proof on trust controls and technical documentation depth.
    approximationNotes: >-
      Maturity scores are qualitative judgments based on retained public evidence, not an internal product audit or
      customer survey.
    data:
      columns:
        - Capability
        - Primary surface
        - Public maturity (1-5)
        - Evidence quality (1-5)
        - Most important public proof
        - Main gap
      rows:
        - label: 24/7 care-team operations
          values:
            - 24/7 care-team operations
            - Human care delivery
            - '4.5'
            - '3.5'
            - Official care-team page plus HCTTF and AON case studies
            - Need staffing ratios and service-level metrics
        - label: Thyme Care Connect
          values:
            - Thyme Care Connect
            - Member digital front door
            - '4.0'
            - '3.0'
            - Official Connect and Aetna pages show clear member workflow
            - No public release notes, telemetry, or app-store footprint
        - label: Thyme Box orchestration
          values:
            - Thyme Box orchestration
            - Internal platform
            - '4.0'
            - '3.0'
            - Official Thyme Box page, payer journey, and Fierce workflow write-up
            - No deep technical architecture, vendor, or validation documentation
        - label: Provider workflow integration
          values:
            - Provider workflow integration
            - Signal + EHR / practice overlays
            - '3.5'
            - '3.5'
            - Signal page, AON case study, AJMC drug-spend workflow article
            - Exact EHR coverage and API methods remain private
        - label: Integrated social support
          values:
            - Integrated social support
            - Social-work-led operating model
            - '3.5'
            - '3.0'
            - ISS launch with validated tools and growing social-work team
            - Outcome evidence still mostly company-selected
        - label: Trust / compliance transparency
          values:
            - Trust / compliance transparency
            - Policies + governance roles
            - '2.5'
            - '2.5'
            - Privacy policy, terms of use, compliance/security hiring
            - No retained public certification page or external audit report
