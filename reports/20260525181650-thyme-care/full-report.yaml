      - number: '7.3'
        title: Operational scalability depends on hiring, licensure, and tight clinic integration, not just software adoption
        blocks:
          - type: paragraph
            body: >-
              Thyme's operating model is closer to a distributed oncology-services platform than a lightweight software
              vendor. The job board showed 33 open roles at review time, with 16 clinical-like roles spanning oncology
              nurse navigators, social workers, palliative care clinicians, and care-delivery leadership, plus dedicated
              openings in AI governance, privacy, and security. Public materials also show continuing investment in
              survivorship, palliative care, and social-work capacity, which strengthens the care proposition but
              confirms that scaling requires ongoing people build-out, not just incremental cloud spend. That matters
              because the external labor market is not getting easier: ASCO says 68% of Americans aged 55 and older live
              in counties where oncologist coverage is at risk, and HRSA projects broad physician shortages through 2038
              with materially worse adequacy in nonmetro areas. Thyme can use virtual navigation and telehealth to ease
              some of that pressure, but its own proof model still depends on coordinated workflows with oncologists,
              rapid triage, transitions-of-care programs, and tighter drug-management execution. The same HCTTF case
              study that highlights savings also says 60-70% of savings come from acute-care reduction and only 60-70%
              of oncologists adhere to recommended high-value drug interventions, which means operational drift can
              quickly transmit into economic underperformance.
