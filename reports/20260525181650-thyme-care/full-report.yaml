      - number: '4.5'
        title: 'Verdict: promising economics, but still not public enough to underwrite'
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is better than the disclosure quality. Thyme Care appears to have a real business
              model, not a pilot masquerading as one: sponsor-paid contracts are live across Medicare Advantage,
              commercial, employer-sponsored, and EOM channels; the company takes real performance risk in at least some
              contracts; and AON/Humana case evidence shows payers and providers are willing to tie value-based
              economics to the service. That supports a positive read on revenue quality relative to pure navigation
              vendors that simply sell engagement software. The model also seems less capital-intensive than asset-heavy
              healthcare businesses because its cash needs are driven by labor, implementation, and risk timing rather
              than inventory or hard capex.


              The blocker is that nearly every underwriting variable that would turn this into a financeable margin
              story remains private. CMS's oncology-model evaluations are a useful warning: even when episode spending
              comes down, payer economics can still disappoint after monthly support payments and performance bonuses
              are counted. Thyme Care may avoid that trap, but the public file does not prove it. The next diligence
              step is therefore concrete, not conceptual: review representative payer contracts, benchmark calculations,
              reconciliation statements, sponsor-level cohort margins, current cash and burn, and the entity-by-entity
              financial split between Thyme Care, Inc. and Thyme Care Medical. Until that happens, the right judgment is
              promising but not underwritten.
