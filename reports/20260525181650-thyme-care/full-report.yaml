      - CP037
      - CP038
  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat or risk area
      - Why it matters
      - Adverse evidence / threat
      - Severity
      - Implication or diligence ask
    rows:
      - - Payer-risk alignment
        - Thyme is strongest when the buyer wants cancer-specific total-cost accountability
        - Carriers and Evernorth already package oncology support inside existing benefit relationships
        - High
        - Verify whether Thyme wins net-new spend or mostly augments sponsors already unhappy with carrier support
      - - Provider collaboration
        - TCOP and oncology-practice integration are core to Thyme’s value story
        - Navigating Care and OneOncology own more day-to-day clinic workflow and reimbursement plumbing
        - High
        - Test whether provider workflow incumbency limits Thyme expansion inside community oncology
      - - Member experience moat
        - 24/7 navigation and human support build trust during cancer treatment
        - >-
          Lantern, Transcarent, OncoHealth, and carrier programs all market human oncology support and nurse-led
          navigation
        - Medium-High
        - >-
          Determine whether Thyme’s satisfaction and adherence data outperform these alternatives in apples-to-apples
          cohorts
      - - Broader platform breadth
        - Some buyers prefer a single health front door over a cancer-only solution
        - >-
          Transcarent/Accolade and Included Health bundle advocacy, primary care, and other categories alongside cancer
          support
        - High
        - Assess whether Thyme can remain category owner without expanding outside oncology
      - - Bundled episode economics
        - Hard savings are easier to defend when the contract structure is visible
        - Carrum and Evernorth publicize bundled payment or single-copay mechanics while Thyme pricing is private
        - Medium
        - Request realized contract benchmarks and guarantee language before underwriting price competitiveness
      - - Evidence base
        - Independent outcomes studies help in broker and payer diligence
        - >-
          Navigating Cancer can cite a public outcomes study while Thyme’s best public proof is partner and company
          material
        - High
        - Ask for independent actuarial validation and renewal case studies
      - - AI / pathway commoditization
        - Navigation software is easiest to copy at the feature layer
        - Included Health, Transcarent, Tempus, and others all market AI-enabled guidance or pathway intelligence
        - Medium-High
        - Value the care model and data relationships more than generic AI marketing
      - - Multi-homing risk
        - Buyers may keep multiple vendors around the same cancer journey
        - Carrier programs, provider platforms, diagnostics vendors, and bundled episodes can coexist with navigation
        - Medium
        - Model partial displacement risk instead of assuming winner-take-all share
    notes: >-
      Severity reflects expected impact on competitive durability rather than certainty of occurrence; each row
      translates a public signal into a diligence priority.
