      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is the control layer, not the full oncology economy
            body: >-
              The right boundary for Thyme Care is the portion of oncology spend that a payer or provider can
              realistically influence through navigation, coordination, symptom management, and aligned incentives. That
              layer sits on top of a $200B+ national cost problem, but the near-term outsourced market is much smaller
              and depends on whether buyers are willing to operationalize oncology-specific VBC.
            calloutType: insight
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM033
              - CM045
          - type: callout
            title: Payer-plus-provider distribution matches how oncology budgets are actually controlled
            body: >-
              Thyme Care’s public channel mix spans health plans, MA / senior-primary-care channels, and
              oncology-provider groups. That matters because oncology cost management fails when only one side of the
              payer-provider interface changes behavior; a dual-sided model is directionally aligned with how cancer
              care is financed and delivered.
            calloutType: strength
            claimRefs:
              - CM002
              - CM004
              - CM013
