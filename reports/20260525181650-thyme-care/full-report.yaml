        - Provider page and HCTTF/AON materials
        - Live with AON and broader TCOP network
        - Supports provider adoption but adds another payout layer
        - Practice-level waterfall and partner payout logic
      - - Sponsor-paid navigation benefit
        - $0 or no-additional-cost member benefit for navigation and care-partner support
        - Humana, CareFirst, Premera, EmblemHealth, Microsoft, AON pages
        - Consistently visible in public materials
        - Strong buyer willingness signal, weak direct pricing transparency
