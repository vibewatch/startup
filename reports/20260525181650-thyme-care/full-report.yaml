          in diligence
      - - Privacy / HIPAA / cybersecurity risk
        - Reportable incident, OCR complaint, or control gap against current HHS expectations
        - Any reportable breach, missing BAA coverage for critical vendors, or repeated red-team / audit failure
        - >-
          Pause conviction; require remediation plan, incident-cost estimate, and control retest before underwriting
          growth assumptions
      - - Partner concentration risk
        - Revenue or attributed-members concentration by top payer / provider / employer relationships
        - >-
          Top partner or partner cluster exceeds a level management cannot backfill within 12 months, or one major
          launch is delayed/cancelled
        - Re-rate commercialization assumptions and lower valuation for channel fragility
      - - Staffing and care-quality risk
        - Clinical hiring, attrition, and caseload indicators
        - Persistent vacancy/attrition in care-delivery roles, or caseload expansion without stable outcomes
        - Reduce confidence in operational scalability and insist on market-level staffing dashboards
      - - Governance / key-person risk
        - Departure or role dilution of founder / senior operating leaders without credible succession
        - CEO, CMO/president, or other critical operator exits without a named successor and continuity plan
        - >-
          Escalate diligence on governance and execution risk; treat as a thesis-break if combined with slowing partner
          momentum
      - - Financial proof risk
        - Reconciliation between public profitability narrative and private financial package
        - Management cannot reconcile profitability claims to audited or board-grade sponsor-level economics
        - Move to research-more / avoid unless price compensates for disclosure risk
