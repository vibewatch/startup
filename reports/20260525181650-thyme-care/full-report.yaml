  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation is track: quality company, price-sensitive underwriting'
        blocks:
          - type: paragraph
            body: >-
              Thyme Care clears the first bar for a late-stage oncology-services investment: it is no longer a
              conceptual navigation startup. Public sources around the 2025 Series D say the company had become
              profitable, was managing more than $5 billion of oncology spend, and had extended access to 8 million
              people through Medicare, commercial, and employer contracts. The investor syndicate also matters. Morgan
              Health, Humana, Texas Oncology, and Memorial Hermann are not generic financial sponsors; they are
              strategically relevant payers and providers whose participation suggests real distribution value and some
              confidence in Thyme's model of oncology-specific navigation, clinical support, and cost-of-care
              accountability.


              The problem is not company quality alone; it is price discipline. Public evidence does not reconcile to a
              single exact mark. The confirmed floor is only that the Series D pushed Thyme Care above $1 billion.
              Tracxn records a $1.0 billion post-money mark tied to an April 4, 2025 first-sale date, while Premier
              Alternatives shows a $1.5 billion implied valuation as of September 25, 2025 from secondary-style data.
              Without audited revenue, EBITDA, cash, or cap-table detail, investors cannot normalize those marks against
              public proxies with confidence. That is why the chapter lands on track, not buy: the company may deserve a
              premium for oncology specialization, but the current public evidence still makes the price look stretched
              rather than demonstrably attractive.
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
              - CV033
              - CV037
              - CV045
