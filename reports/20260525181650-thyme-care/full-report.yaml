      - number: '4.3'
        title: >-
          The model is people-intensive, and the margin case depends on keeping savings ahead of labor and integration
          costs
        blocks:
          - type: paragraph
            body: >-
              The cost base is clearly labor-heavy. Thyme Care's provider and care-team pages describe a 24/7 virtual
              model staffed by oncology nurses, nurse practitioners, social workers, care partners, enrollment
              specialists, medical directors, and palliative-care physicians, and the company says it now has 500+ fully
              employed oncology-trained professionals. The 2025 care-team expansion release ties further hiring to
              commercial and Medicare Advantage growth, while the job board remains packed with RN, social work, and
              care-delivery openings. That means the company is not a capital-intensive asset builder, but it is also
              not a low-touch software vendor; recurring payroll, supervision, scheduling, licensure, and training are
              likely the dominant gross-margin burden.


              Public case studies nevertheless show why the model can work economically if execution stays tight. HCTTF
              attributes 60-70% of savings to avoided acute utilization and 30-40% to drug-spend reduction, while AJMC
              and AON report almost $6 million of first-period EOM savings and a performance-based payment. Outcomes
              data are directionally strong: 28% relative risk reduction for ePRO-engaged members, 30% lower
              readmissions in transitions-of-care cohorts, 90% satisfaction, and measurable patient and provider time
              savings. But the validation quality is uneven. HCTTF explicitly says it did not independently validate
              Thyme Care's internal analyses, and the public record still lacks sponsor-level gross margin, utilization
              baselines, and care-team cost per member. So the margin path is plausible, but still relies on
              management-selected proof points.
