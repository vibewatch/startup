      - - Cash, burn, runway, and debt
        - Essential for financing dependency, downside planning, and dilution risk
        - Recent large round and management profitability claim
        - Obtain current treasury pack, cash forecast, debt schedule, and covenant summary
      - - Customer concentration and renewals
        - A few large payer or employer contracts could dominate revenue quality and renewal risk
        - Named partners such as Humana, Aetna, AON, and Fortune 500 employers
        - Request top-10 customer concentration, renewal dates, and gross-retention history
      - - Entity-level economics
        - Multiple operating entities can hide where margin is earned or lost
        - Legal disclosures distinguish Thyme Care, Inc. from Thyme Care Medical
        - Request legal-entity financials and intercompany transfer-pricing logic
      - - Third-party validation of savings claims
        - Internal or partner-selected case studies are directionally helpful but not enough for underwriting
