      - number: '1.4'
        title: Milestones, disclosure conflicts, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The chronology is rich enough to anchor later chapters without much guessing. Public evidence supports a
              July 2020 founding window, an October 2021 a16z investment marker, an August 2023 Series B, a May 2024
              strategic investment from Echo Health Ventures and CVS Health Ventures, a July 2024 Series C, an August
              2024 leadership addition with Lalan Wilfong, a July 2025 survivorship and palliative-care expansion, a
              September 2025 Series D that also marked profitability, an April 2026 Integrated Social Support launch,
              and a May 2026 CNBC Disruptor 50 recognition. This is a useful milestone set because it shows Thyme Care
              evolving from navigation startup into a broader oncology operating platform with payer, provider,
              employer, and health-system touchpoints.


              The overview still has to preserve what does not reconcile cleanly. The $1 billion valuation is real as an
              external reporting signal from Endpoints and Bloomberg, but the official Series D release did not confirm
              it. Tracxn goes further by listing the same $97 million Series D at a $1 billion valuation on April 4,
              2025, months before the company's own September 25, 2025 announcement, so round timing should be treated
              as conflicted until management confirms the canonical close date. The chapter also keeps one adverse
              source on file: Thyme Care's own fraud-warning page shows the company has had to warn candidates about
              scam job offers impersonating its hiring process. That is not a thesis-breaking event, but it is the
              clearest documented adverse surface in the reviewed source set. More importantly for diligence, public
              disclosures still leave exact customer count, current revenue, role boundaries, and governance/control
              rights unresolved.
