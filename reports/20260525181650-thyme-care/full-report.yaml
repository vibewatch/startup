  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer jobs-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Thyme Care sits in a broader competitive set than pure oncology navigation alone. A payer or risk-bearing
              provider can buy a cancer-specific support vendor, a broader health-navigation platform, a bundled
              centers-of-excellence program, a community-oncology workflow platform, or simply rely on the oncology
              support already embedded in carrier and integrated-delivery benefits. Thyme Care’s own public materials
              emphasize 24/7 oncology-trained support, provider collaboration, accountable value-based arrangements, and
              digital tools such as Thyme Care Connect. That makes its closest like-for-like peers the vendors that
              combine oncology-specific guidance with payer-grade deployment or cost-of-care accountability, especially
              OncoHealth, Lantern, and the post-merger Transcarent platform. But the procurement reality is wider than
              those direct peers. Included Health can compete through broader navigation plus specialty care, Carrum can
              win buyers who want episode bundles, and carrier or health-system programs can make a stand-alone vendor
              look duplicative. The real buyer question is not simply who else has oncology nurses; it is who can reduce
              friction, improve outcomes, and lower cost without forcing sponsors and oncologists to rebuild the rest of
              the care journey.
