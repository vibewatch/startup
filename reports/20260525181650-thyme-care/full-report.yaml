  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      How Thyme Care's payer contracts, oncology-practice integration, care-team operations, and strategic investors fit
      together as one company logic.
    data:
      nodes:
        - id: payer-employer-problem
          label: Fragmented oncology economics
          detail: Cancer cost growth and fragmented care create payer and employer demand for a managed layer.
        - id: risk-aligned-contracts
          label: Risk-aligned contracts
          detail: >-
            Thyme Care says it takes two-sided financial risk and works with payers, employers, and risk-bearing
            providers.
        - id: provider-integration
          label: Provider integration
          detail: TCOP and other practice partnerships embed navigation and analytics into oncology workflows.
        - id: care-team-platform
          label: 24/7 care team + platform
          detail: Technology, navigation, and clinical services operate together rather than as separate products.
        - id: strategic-capital
          label: Strategic capital base
          detail: >-
            Morgan, Humana, Texas Oncology, Memorial Hermann, CVS, Concord, and others back distribution and
            credibility.
        - id: scale-outcomes
          label: Scale and outcomes claims
