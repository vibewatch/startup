- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Indicator
  - Public evidence
  - Read-through
  - Gap
  rows:
  - - Shelf continuity
    - Regional brands maintain active websites
    - Suggests ongoing channel presence
    - No sell-through data
  - - Policy compliance
    - Large buyers keep updating standards
    - Need for recurring supplier qualification
    - No supplier scorecards
  - - Export continuity
    - Government trade data series exist
    - Demand is recurring at category level
    - No company-specific repeat data
  - - Premium category persistence
    - Specialty labels continue growing
    - Supports repeat purchase logic
    - No account retention metrics
  notes: Retention is largely inferred from channel continuity, not directly observed through customer KPIs.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk
  - Why it matters
  - Current public read
  - Best diligence test
  rows:
  - - Unnamed top accounts
    - Can hide concentration
    - No top-customer disclosure
    - Customer revenue ladder
  - - Retailer policy shifts
    - Can force capex or assortment change
    - Commitments remain dynamic
    - Buyer contract review
  - - Foodservice volume shocks
    - Menus can rebalance quickly
    - Policy pages do not equal demand guarantees
    - Channel mix trendline
  - - Regional brand dependence
    - Local execution carries the relationship
    - Brand portfolio is fragmented by geography
    - Country-level customer churn data
  notes: "Concentration risk remains open because public sources show demand signals but not direct account concentration."
