- id: TU003
  title: Named customer proof table
  columns:
  - Proof item
  - Type
  - What is actually public
  - Interpretation
  rows:
  - - Retail policy evidence
    - customer-proof
    - Walmart / Kroger / Costco publish welfare standards
    - Downstream buyers care about format compliance
  - - Foodservice policy evidence
    - customer-proof
    - McDonald's and Sysco publish animal-welfare expectations
    - Foodservice can shape mix requirements
  - - Regional brand presence
    - official
    - Hillandale / Granja / Hevo websites show local market access
    - Go-to-market likely brand-led
  - - Channel data
    - regulatory
    - USDA and EU data show broad channel demand
    - Demand exists even without named logos
  notes: Named-customer proof is partial because the company does not publish a customer roster or signed case studies.
