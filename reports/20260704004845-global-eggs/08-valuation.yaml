- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - View
  - Core claim
  - Evidence
  - Failure mode
  rows:
  - - Thesis
    - Global Eggs is becoming the category's multinational consolidator
    - Warburg + acquisition trail
    - Integration or disclosure shortfall
  - - Anti-thesis
    - The platform is being valued ahead of proven disclosure depth
    - Sparse financials and open leverage questions
    - Audited earnings quality proves stronger
  - - Thesis
    - Premium and specialty mix can lift quality of revenue
    - Pearl Valley + welfare transition
    - Buyer adoption stays slower than expected
  - - Anti-thesis
    - Egg economics remain cyclical and risk-heavy
    - Disease and feed volatility persist
    - Biosecurity and pricing prove more resilient
  notes: Both sides of the case remain live because valuation is easier to observe than earnings quality.
