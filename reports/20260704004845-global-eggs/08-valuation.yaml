- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumption set
  - Implied read
  - What must be true
  rows:
  - - Bull
    - Integration works, premium mix rises, margins hold
    - Valuation can be attractive
    - Audited earnings and low leverage
  - - Base
    - Scale grows but disclosure stays moderate
    - Valuation looks fair to stretched
    - Operational discipline with mixed transparency
  - - Bear
    - Disease, capex, or leverage surprise hits
    - Valuation looks expensive
    - Weak control or margin compression
  notes: Scenario framing is qualitative because public statements are insufficient for a full DCF or LBO model.
