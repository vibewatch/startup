  topStrengths:
    - Cross-border egg platform with meaningful operating scale in Brazil, Spain, and the United States.
    - >-
      Vertical integration across breeding, feed, packaging, and logistics supports service reliability and category
      breadth.
    - Warburg Pincus validation and continuing acquisition flow support capital access and strategic optionality.
  topRisks:
