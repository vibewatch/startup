- id: TI002
  title: Pricing / monetization table
  columns:
  - Topic
  - Public signal
  - Interpretation
  - Constraint
  rows:
  - - Commodity exposure
    - Egg price volatility is sector-wide
    - Revenue can move with feed and disease cycles
    - Customer contract terms not public
  - - Specialty mix
    - Cage-free and premium demand can lift value
    - Pearl Valley and welfare shifts can improve mix
    - Affordability slows conversion
  - - Cross-border operations
    - Multiple brands and markets diversify channels
    - May smooth country-specific shocks
    - FX and integration complexity
  - - Private-equity backing
    - Supports scaling and M&A
    - Can fund conversion and expansion
    - Capital cost and rights undisclosed
  notes: "Monetization quality depends on mix and contract structure, neither of which is disclosed at sufficient depth publicly."
