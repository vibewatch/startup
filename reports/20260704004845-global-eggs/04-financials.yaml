    - Large equity cushion announced
    - Supports further expansion and liquidity
    - Exact draw, timing, and terms
  - - Acquisition cadence
    - Multiple deals in 2025-26
    - Capital appetite is high
    - Net leverage and revolver capacity
  - - Adviser set
    - Institutional banks and law firms engaged
    - Transaction standards are sophisticated
    - Reporting package frequency
  - - IPO pause
    - Public-market route deferred
    - Private capital remains central
    - Next financing path
  notes: Capital adequacy looks strong on headline equity support but weak on disclosed leverage detail.
