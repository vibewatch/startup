- id: TI003
  title: Unit economics table
  columns:
  - Element
  - Public evidence
  - Direction
  - Main diligence question
  rows:
  - - Feed cost
    - CoBank / Cal-Maine filings
    - High volatility input
    - Hedging and purchasing policy
  - - Disease shock
    - USDA / CDC / sector filings
    - Can destroy short-term economics
    - Insurance and recovery playbook
  - - Welfare capex
    - Retailer policy + public peers
    - Raises cost base before price capture
    - Conversion ROI by site
  - - Logistics / freshness
    - Company one-day-delivery pitch
    - Potential service premium
    - Cost-to-serve by region
  notes: "Unit-economics framing is inferential because Global Eggs does not publish margin bridge or site-level cost data."
  claimRefs:
