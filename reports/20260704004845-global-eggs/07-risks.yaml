- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk area
  - What would mitigate
  - What would break thesis
  rows:
  - - Disease
    - Audited biosecurity and recovery metrics
    - Repeated flock loss without recovery playbook
  - - Financial control
    - Full audited statements and leverage detail
    - Opaque leverage or covenant stress
  - - Customer compliance
    - Verified cage-free / specialty capacity
    - Major buyer non-compliance
  - - Integration
    - Demonstrated synergy capture and stable service
    - Acquisition-related service or quality slippage
  notes: Mitigations focus on data that should exist internally even if not publicly disclosed.
