    - Can change required production mix
    - Buyer policy pages are explicit
    - Capacity by format not public
  - - Foodservice distributors
    - Gate volume and specification compliance
    - Sysco / McDonald's policies matter
    - Named contracts absent
  - - Adviser / capital partners
    - Enable large transactions
    - Warburg and advisers are active
    - Debt-side partners unclear
  - - Regional operators
    - Hold local know-how
    - Subsidiaries remain brand anchors
    - Central systems depth unclear
  notes: Dependencies sit both upstream and downstream, which raises correlated execution risk.
