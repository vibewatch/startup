        title: Evidence baseline
        blocks:
          - type: paragraph
            body: >-
              Evidence baseline in Company Overview focuses on identity, leadership, funding, scale, and milestones. The
              public record for Global Eggs is sufficient to anchor a diligence view, but it is not sufficient to
              replace management data. This section therefore separates what is directly supported by official releases,
              regulators, customers, competitors, and independent media from what is still inferred or missing. The
              evidence repeatedly points to the same structural conclusion: Global Eggs has assembled unusual geographic
              scale in a category with durable demand, but the investment case still depends on how well management
              converts acquisition activity into clean operating metrics. For underwriting purposes, that means the
              chapter should be read as an evidence-led map of the public file rather than a substitute for audited
              diligence materials. The strongest implication for this section is that decisions about valuation, risk,
              or customer durability should be tied to dated sources and explicit gaps, because the company has
              disclosed enough to prove strategic momentum but not enough to eliminate execution uncertainty.
