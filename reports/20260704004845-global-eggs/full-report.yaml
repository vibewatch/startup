companyProfile:
  summary: >-
    Global Eggs is a privately held multinational egg platform founded in 2018 by Ricardo Faria. It has expanded through
    acquisitions across Brazil, Spain, and the United States and now positions itself as the world’s largest
    multinational producer and distributor of table eggs, with vertical integration across breeding, feed, packaging,
    and logistics. Public evidence supports the scale narrative and the March 2026 Warburg Pincus investment, but key
    operating and leverage metrics remain under-disclosed.
  foundedDate: '2018-01-01'
  founders:
    - name: Ricardo Faria
      role: Founder / Executive Chairman
      background: >-
        Brazilian agribusiness entrepreneur who built the platform through cross-border egg acquisitions and capital
        raises.
      claimRefs:
        - CO015
  foundingLocation: Etobicoke, Ontario, Canada
  headquarters: Etobicoke, Ontario, Canada
  productSummary: >-
    Conventional, cage-free, free-range, specialty, and related egg products sold through regional brands with
    supporting hatchery, feed, packaging, and distribution capabilities.
  customerFocus: >-
    Mass retail, premium retail, foodservice, ingredient buyers, and export channels across the U.S., South America, and
    Europe.
  businessModel: >-
    Own and integrate regional egg-production brands, expand through acquisitions, and monetize both volume and premium
    mix through logistics and welfare-format capabilities.
  stage: Private equity-backed growth platform
  fundingStatus: >-
    Received an up-to-$1 billion Warburg Pincus investment in March 2026 at an $8 billion headline valuation after
    multiple cross-border acquisitions.
  disclosureProfile: private-undisclosed
