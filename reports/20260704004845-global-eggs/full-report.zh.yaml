companyProfile:
  summary: >-
    Global Eggs 是一家非上市跨国鸡蛋平台，由 Ricardo Faria 于 2018
    年创立。公司通过在巴西、西班牙和美国的收购扩张，如今把自己定位为全球最大的跨国鲜食鸡蛋生产和分销商，纵向覆盖育种、饲料、包装和物流。公开证据支撑其规模叙事和 2026 年 3 月 Warburg Pincus
    投资，但关键运营指标和杠杆指标仍披露不足。
  foundedDate: '2018-01-01'
  founders:
    - name: Ricardo Faria
      role: 创始人 / 执行董事长
      background: 巴西农业企业家，通过跨境鸡蛋资产收购和融资搭建出 Global Eggs 平台。
      claimRefs:
        - CO015
  foundingLocation: Etobicoke, Ontario, Canada
  headquarters: Etobicoke, Ontario, Canada
  productSummary: 通过区域品牌销售传统、非笼养、散养、特色蛋及配套蛋品，并配套孵化、饲料、包装和分销能力。
  customerFocus: 覆盖美国、南美和欧洲的大众零售、高端零售、餐饮服务、原料采购方和出口渠道。
  businessModel: 持有并整合区域鸡蛋生产品牌，通过收购扩张，再靠物流和动物福利规格能力同时变现销量与高端产品组合。
  stage: Private equity-backed growth platform
  fundingStatus: 2026 年 3 月，Global Eggs 在多笔跨境收购之后，以 80 亿美元名义估值获得 Warburg Pincus 最高 10 亿美元投资。
