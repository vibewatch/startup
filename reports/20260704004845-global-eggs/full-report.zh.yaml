        - 财务披露稀疏，杠杆问题未解
        - 经审计盈利质量更强
      - - 正方论点
        - 高端与特色品类占比可抬升收入质量
        - Pearl Valley + 动物福利转型
        - 买方接受速度低于预期
      - - 反方论点
