      - number: '7.3'
        title: 财务与执行风险
        blocks:
          - type: paragraph
            body: >
              最后一类风险属于财务维度的不透明性。Semgrep
              虽然拥有充裕的融资支持，但仍未公布足以判别其增长究竟高效还是高昂的核心经营指标。这十分关键，因为未上市的安全软件企业固然可以长期募集资本，但估值最终仍取决于数据实证而非空泛叙事。


              公司现在的规模也让执行风险超出产品发布质量本身。Semgrep 必须持续推出 AI
              功能、维持开发者信任、支撑企业销售，同时不能让开源社区觉得被抛弃。这些目标难以兼顾；若客户增长放缓，或竞品变得“够用”，平衡就更难维持。
            claimRefs:
              - CR009
