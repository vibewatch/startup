              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: 估值区间与研判立场
        blocks:
          - type: paragraph
            body: >
              Semgrep 没有公布营收或
              ARR，因此估值区间只能参考可比非上市公司，不能直接套用收入倍数。务实地看，它的估值大概率高于融资有限的开发者工具公司，但披露不足以支持精确估值。因此，仅凭估值不足以形成强烈的看多判断，当前立场仍是合理但存疑。


              估值讨论的重点不在某个精确数字，而在经营证据是否扎实。若管理层能证明留存强劲、增长高效，且 AI 驱动的产品扩张具有持续性，市场估值就可能维持甚至上升；反之，公开指标不足会继续削弱估值支撑。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 驱动估值校准的潜在变量
        blocks:
          - type: paragraph
            body: >
              提高估值判断置信度，最快的办法是披露当前 ARR、增长率和 NRR。这样才能用更一致的口径，将 Semgrep
              与其他非上市安全和开发者平台公司比较。其次，可提供近期经董事会批准的投后估值，或可信度高于交易平台快照的二级交易参考。


              在这些数据出现前，估值判断只能综合产品质量、客户采用、融资额和零散的外部市场信号。这足以支持工作层面的尽调判断，却不足以给出明确的投资级定价。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
