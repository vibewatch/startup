  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争阵营
        blocks:
          - type: paragraph
            body: >
              Semgrep 面对的直接竞争并不限于 SAST。主要比较对象包括 Snyk Code、Checkmarx、Veracode、SonarQube、DeepSource，以及 GitHub CodeQL /
              GHAS。独立评测也将 OpenGrep 视为最直接的开源分支风险，尤其对那些想要类似 Semgrep 的扫描体验、又不愿受 Community Edition 商业限制的团队而言。


              关键差异不只在功能广度。买家若看重扫描快、规则写法贴近代码，还希望先免费试用、再逐步扩展到平台治理，Semgrep 便能胜出。而竞品获胜的场景通常是提供更广泛的平台捆绑包、更贴合企业采购要求，或是具备更紧密的
              GitHub 原生分发渠道。因此，该赛道存在大量替代品，但真正与 Semgrep 特定产品模式直接对应的同类竞品并不多。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
