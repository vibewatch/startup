      - number: '3.2'
        title: Semgrep 的差异化优势
        blocks:
          - type: paragraph
            body: >
              Semgrep 的差异化来自三点：规则写法贴近代码、扫描快，且商业化没有放弃开源获客入口。付费平台增加跨文件分析、AI 分流和工作流控制，能力明显强于免费的 Community
              Edition。相比单纯扩大扫描器覆盖面，这套组合更有说服力，也让 Semgrep 能同时声称自己开放且具备企业级能力。


              Guardian 将 Semgrep 带入 AI Agent 安全领域，进一步拓宽了产品叙事。这个市场仍处早期，并非所有竞品都能匹配它的定位或工作流入口；但此举也让 Semgrep 更直接地面对原生 AI
              安全产品和综合 AppSec 套件的比较。因此，买家若看重开发者体验和逐步扩展，而非一次性采购大平台，Semgrep 的优势就更突出。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
