      - number: '2.2'
        title: 客群细分、定价与 GTM 架构
        blocks:
          - type: paragraph
            body: >
              Semgrep 的客群划分很清楚。免费 Community Edition 面向独立开发者、安全审计人员，以及愿意接受一定误报、换取速度和控制力的小团队。商业平台则服务需要跨文件分析、AI
              分流、工作流路由和管理员控制的团队。定价也对应这套分层：前 10 位贡献者免费，之后的付费套餐按贡献者计费。


              这形成了典型的 PLG 漏斗，也为客户升级到企业版留出了空间。独立定价和采购路径资料显示，Team 层级通常需要议价，公开标价只是起点。Semgrep
              实际上是把客户从“够用”的免费扫描，带向组织级安全运营。因此，它既参与“好用的开发者工具”市场，也进入更高端的“运营型 AppSec 平台”市场。


              因此，评价 Semgrep 不该只把它当作扫描器厂商，更要看它能否成为代码安全工作流的底层平台。这扩大了潜在买家范围，也让它更直接地面对综合平台的竞争。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
