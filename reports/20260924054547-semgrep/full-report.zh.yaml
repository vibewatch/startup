              - CR004
      - number: '7.2'
        title: 竞争与定价风险
        blocks:
          - type: paragraph
            body: >
              Semgrep 所处的市场环境意味着，产品一旦变贵或难以证明价值，买家就可能转向 GitHub 原生工具、大型 AppSec
              套件或阻力更小的替代方案。公开定价降低了产品的试用门槛，但按贡献者计费的模式也让买家对成本一目了然，使得采购比价极为便利。


              Semgrep 必须守住高信噪比优势。一旦产品变成普通扫描器，买家就会拿它和功能更全、或已在现有供应商体系中的工具比较。风险不在替代品是否存在，而在于它们能多快补上关键工作流，达到可接受的水平。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
