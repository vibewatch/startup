chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 机构定位、起源与产品形态
        blocks:
          - type: paragraph
            body: >
              Semgrep 总部位于旧金山，Isaac Evans、Drew Dennison 与 Luke O'Malley 于 2017 年创立。公司从开源静态分析引擎起步，后来将业务拓展为涵盖 SAST、SCA
              和密钥扫描的商业 AppSec 平台。Semgrep 明确把产品定位给开发者：平台服务于构建者和 Agent，而不只是 AppSec 专家；卖点是扫描快、噪声低，并能直接融入工作流。


              开源仍是 Semgrep 获客的关键。免费的 Community Edition 打开分发入口，商业平台再叠加跨文件分析、AI
              分流、策略控制和报告功能。代码、供应链与密钥检测共用同一核心引擎，产品线因此有统一架构，而不是几款松散工具的拼凑。


              Semgrep 的产品已不止于传统的 PR 检查扫描器。2026 年推出的 Guardian 面向 AI 编写的代码，作为 Agent 安全层，与自主修复和实时防护栏共同构成更广泛的平台叙事。
