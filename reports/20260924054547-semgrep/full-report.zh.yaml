  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 公开市场定价线索传递的信号
        blocks:
          - type: paragraph
            body: >
              Forge 二级市场页面是本次更新资料包中最清晰的公开估值线索，标示 Semgrep 的估值为
              $799.24M。这适合作为外部参考信号，但未经公司审计，也不是正式的投后估值。它至少表明，第三方市场数据给出的水平已不只是种子轮或 Series A 阶段公司的估值。


              其他公开线索大致指向同一结论：Semgrep 已募集可观资金，有明显的企业客户采用，也仍是非上市公司。这些事实至少说明它已处于成长期公司的估值区间。争议在于，估值溢价应高于、接近还是低于 Forge 的指示值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
