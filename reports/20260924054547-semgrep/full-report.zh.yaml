      - number: '3.3'
        title: 竞争风险
        blocks:
          - type: paragraph
            body: >
              最大的风险在于，已使用 GitHub 的买家可能会选择 GitHub 原生安全工具，以避免引入新供应商。次要风险是 OpenGrep 充分复刻了免费 Semgrep 的体验，从而削弱 Community
              Edition 的转化漏斗。第三项风险在于综合套件可能捆绑足够多的周边功能，让买家把 Semgrep 看成单一工具，而非平台。


              Semgrep 的防线在于执行，而非独一无二。它必须继续保持扫描快、结果可行动，开发者体验也要胜过替代品。只要噪声、易用性或定价失守，买家就有足够多的替代工具可选，切换并不难。
