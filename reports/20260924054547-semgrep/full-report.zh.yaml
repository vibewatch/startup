              - CU008
      - number: '6.3'
        title: 客户获得的实际价值
        blocks:
          - type: paragraph
            body: >
              Semgrep 的公开客户内容反复提到三项结果：分流更快、误报更少、修复更早。这也呼应了公司的产品逻辑：安全工具应减少摩擦，而不是增加负担。2026 年推出的 Guardian 把这套做法延伸到 AI
              编写的代码，让客户能在问题随代码引入时就发现它。


              尽调的关键在于：Semgrep 有足够的客户案例支撑企业销售，但公开资料不足以量化留存、客户扩张或流失。客户信号偏正面，却仍以定性证据为主。
