  - number: 6
    title: 客户群体
    sections:
      - number: '6.1'
        title: 标杆客户与背书效应
        blocks:
          - type: paragraph
            body: >
              最直观的客户信号没有变化：Semgrep 公开列出 Dropbox、Figma、Slack、Snowflake、GitLab、Shopify、HashiCorp 和 Notion
              等公司。这些客户都以软件研发为核心，工程交付量大、攻击面也广。因此，Semgrep 的用户不只是业余爱好者，也包括需要大规模维护代码的专业团队。


              Semgrep 官网和面向客户的内容反复强调，产品能加快修复、减少误报。扫描工具融入日常工作后，这些才是客户真正关心的结果。因此，客户信号不只是“用户多”，更是平台已从试用走向持续运营。
            claimRefs:
              - CU001
