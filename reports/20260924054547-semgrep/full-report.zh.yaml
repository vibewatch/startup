  - number: 7
    title: 风险考量
    sections:
      - number: '7.1'
        title: 许可证与声誉风险
        blocks:
          - type: paragraph
            body: >
              最具持续性的重大风险依然是 2024 年的许可证变更及其引发的反弹。OpenGrep 的推出让这种反弹彻底具象化：竞品与生态参与者公开发声，将该分支定性为捍卫开源获取权之举，以此对抗 Semgrep
              的商业化限制。即便商业平台在技术上大幅领先免费分支，这依然造成了难以忽视的声誉拖累。


              风险不止是价值观争议或品牌声誉。社区版越显受限，部分用户就越可能把免费版视作过渡工具，更早转向竞品或分支。这会让品牌争议直接冲击获客和转化漏斗。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
