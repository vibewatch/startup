      - number: '6.2'
        title: 应用模式与客群结构
        blocks:
          - type: paragraph
            body: >
              第三方客户数据库和公司资料显示，Semgrep 的客户包括中型企业团队、大型软件公司，以及从 CI、PR 评论或本地扫描开始使用产品的安全从业者。这符合 PLG
              工具自下而上的扩散路径：先由个人或小组采用，再逐步成为全团队的策略管理层。


              Semgrep 并未被某个垂直行业锁定。客户和应用场景横跨软件、金融科技、云计算及开发者工具，为公司打开了更广的潜在市场。但覆盖面越广，公司越需要在不同代码库中持续证明价值，不能只靠一个横向细分市场。
            claimRefs:
              - CU005
