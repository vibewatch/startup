      - number: '5.2'
        title: 引擎深度与工作流适配
        blocks:
          - type: paragraph
            body: >
              Semgrep 的技术优势，主要在于同时强调速度与上下文理解。公司称商业平台支持 35+ 种语言、提供 20,000+ 条 Pro 规则，并在 Community Edition
              基础上增加跨文件分析。文档还列出多种实际工作流能力：策略模式、PR/MR 评论、Slack 和 Jira 通知、CI/CD 集成及 IDE 支持。


              AI 能力也很关键。Guardian 发布后，Semgrep 将自己定位为持续服务于 Agent 和 IDE 的安全层；Assistant
              则主打问题分流和修复建议，而不是泛用聊天。这一差异在于，产品想减少人工处理发现结果的工作，而非单纯增加告警。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: 护城河与边界局限
        blocks:
          - type: paragraph
            body: >
              Semgrep 确有护城河，但范围有限。开源引擎、自定义规则和工作流集成带来了开发者优先的体验，AI/MCP 功能也让公司较早切入 Agent 编码趋势。但这道护城河并非牢不可破：Community
              Edition 的功能刻意少于付费平台，开源分支也在，因此 Semgrep 必须持续证明升级到商业版物有所值。


              Semgrep 的技术壁垒，靠的是分发和工作流采用共同支撑，而非某个单点突破。它的优势在于语义匹配、快速扫描、治理控制，以及逐渐适配 Agent 编码场景的产品能力。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
