              2026 年更新最有价值的部分，是捕捉公司近期变化：Guardian 已成为 Agent 代码安全的主打叙事，定价页面也逐渐明确为 Free / Teams / Enterprise
              三档。尽调中的主要缺口却没有变化：Semgrep 仍未披露当前 ARR、NRR、burn 或经外部验证的估值。


