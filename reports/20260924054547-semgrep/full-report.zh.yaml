  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 问题定义与市场拉动
        blocks:
          - type: paragraph
            body: >
              Semgrep 面对的需求很直接：组织写出的代码越来越多，AI Agent 也参与其中；安全团队希望提高发现信噪比，减轻审查负担。Semgrep 的产品页面和 Guardian
              发布都把这一变化放在核心位置：构建者和 Agent 需要在日常工作流中直接获得安全防护。独立评测也指出，团队看重扫描速度、可执行的发现结果，以及产品与 PR、IDE、CI 工作流的适配度。


              采购仍由开发者体验驱动。免费 Community Edition 和低门槛定价让产品能自下而上扩散；当团队需要跨文件分析、团队治理和更全面的策略控制时，再升级到商业平台。因此，Semgrep
              比的不只是检测质量，也包括获客方式，以及能否从个人使用扩展到全组织部署。


              AI 编写的代码扩大了市场规模并提升了紧迫性，但同时也提高了竞争门槛。工具如今不仅要对文本进行模式匹配，还需要理解上下文，并跟上由人类与 Agent 共同产生的大量新增代码步伐。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
