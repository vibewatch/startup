      - number: '1.2'
        title: 资本、规模与商业化进展
        blocks:
          - type: paragraph
            body: >
              Semgrep 已有足够资本支持企业级拓展。公司于 2025 年 2 月宣布完成由 Menlo Ventures 领投的 $100M Series D，累计融资达到 $204M。TechCrunch
              此前报道，公司于 2023 年完成 $53M Series C；当时公司规模小得多，创收产品增长很快，但绝对收入仍未披露。投资方仍是典型的安全基础设施风投阵容：机构投资者参与多轮，公司也仍为非上市企业。


              更新资料中的 Tracxn 最新公开数据估计，截至 2026 年 8 月下旬 Semgrep 有 266
              名员工。这个规模与其从开源项目成长为平台厂商的路径相符，但只是方向性信号。公司继续按贡献者定价，提供免费层级；Teams 起价为每位贡献者每月 $30。


              客户信号扎实，但仍不完整。Semgrep 公开列出 Dropbox、Figma、Slack、Snowflake 与 Notion
              等客户，却没有公布客户数或经审计的收入指标。这说明产品已有实际采用，但财务透明度仍有限。
