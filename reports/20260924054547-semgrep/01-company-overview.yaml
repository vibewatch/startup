company:
  name: "Semgrep"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Semgrep is a developer-native application security company that combines an open-source scanning
    engine with a commercial AppSec platform. The company remains founder-led, has raised $204M to date,
    and continues to position itself around fast, high-signal code security that fits the developer workflow.
    The most important refresh signals are the 2025 Series D, the 2026 Guardian launch, and a still-opaque
    financial profile.
sections:
  - id: "identity-and-origin"
    title: "Identity, Origin, and Product Shape"
    body: |
      Semgrep is headquartered in San Francisco and was founded in 2017 by Isaac Evans, Drew Dennison, and Luke O'Malley. The business began as an open-source static analysis engine and has since grown into a commercial AppSec platform that spans SAST, SCA, and secrets scanning. The current positioning is explicitly developer-centric: Semgrep says the platform is for builders and agents, not just AppSec specialists, and it emphasizes fast scans, low noise, and workflow-native delivery.

      The open-source roots still matter. The free Community Edition remains the acquisition wedge, while the commercial platform layers in cross-file analysis, AI triage, policy controls, and reporting. The company now uses the same core engine for code, supply chain, and secret detection, which gives the product line a coherent architecture rather than a bundle of loosely related tools.

      Recent product messaging shows the company moving beyond a traditional PR-check scanner. Guardian, released in 2026, is framed as an agentic security layer for AI-written code and sits alongside the broader platform messaging on autonomous remediation and real-time guardrails.
    claimRefs: [CO001, CO002, CO003, CO010, CO011]
    tableRefs: [TO001, TO004]
    figureRefs: [FO001]

  - id: "capital-and-scale"
    title: "Capital, Scale, and Commercial Traction"
    body: |
      Semgrep's capital base is now large enough to support a broad enterprise push. The company announced a $100M Series D in February 2025 led by Menlo Ventures, bringing total funding to $204M. Earlier, TechCrunch covered the $53M Series C in 2023, when the business was still much smaller and publicly described revenue growth as strong but undisclosed in absolute terms. The current investor mix remains classic venture-backed security infrastructure: institutional, multi-round, and still privately held.

      The latest public headcount data point in the refreshed bundle shows 266 employees as of late August 2026 from Tracxn, which is directionally consistent with a company that has moved from open-source project to scaled platform vendor. The company also continues to market contributor-based pricing, with a free tier and a Teams tier starting at $30 per contributor per month.

      Customer references remain strong but incomplete. Semgrep publicly names companies such as Dropbox, Figma, Slack, Snowflake, and Notion, but it does not publish a current customer count or any audited revenue metric. That combination suggests meaningful adoption without full financial transparency.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002]

  - id: "refresh-delta-and-gaps"
    title: "Refresh Delta and Open Gaps"
    body: |
      The 2026 refresh is most useful where the company has changed recently: Guardian is now the flagship agentic-code-security narrative, and the pricing page has converged on a clearer free/Teams/Enterprise structure. At the same time, the largest diligence gaps remain the same as before: current ARR, NRR, burn, and an externally verified valuation are still not disclosed.

      Those missing numbers matter because Semgrep is now beyond the point where product quality alone resolves the investment case. The business has real traction, but the refreshed evidence still does not allow a clean underwriting of growth efficiency or an exact public-market-style multiple. The right posture is therefore to treat this as a high-quality private software company with strong product evidence and incomplete financial visibility.
    claimRefs: [CO004, CO009, CO010, CO012]
    tableRefs: [TO003]

