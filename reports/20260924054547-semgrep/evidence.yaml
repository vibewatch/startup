evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-opacity
    missingEvidence: Current management ARR, NRR, and burn figures from a board deck or data room.
    whyItMatters: Those metrics determine whether the growth story is efficient enough to justify a premium private-market mark.
    diligencePath: Request the current operating dashboard and latest board pack.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: minor
    topic: customer-count
    missingEvidence: A current customer count or active-account count.
    whyItMatters: It would sharpen the adoption narrative and make the customer base more measurable.
    diligencePath: Ask for a current customer logo list or active-account report.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: A current, citable estimate of Semgrep's TAM/SAM or market share.
    whyItMatters: The top-line opportunity is clear qualitatively, but the size of the addressable market is still not pinned down.
    diligencePath: Pull a current external market-sizing report or management slide.
    relatedQuestionRefs:
      - QM001
      - QM006
  - type: missing-source
    severity: minor
    topic: competitor-benchmark
    missingEvidence: A current independent benchmark that quantifies Semgrep versus at least one major competitor.
    whyItMatters: The qualitative positioning is clear, but not the exact performance gap.
    diligencePath: Pull a recent third-party benchmark or run a direct hands-on evaluation.
    relatedQuestionRefs:
      - QC006
      - QC008
  - type: missing-source
    severity: material
    topic: burn-runway
    missingEvidence: Current burn, cash balance, and runway from management.
    whyItMatters: Without burn and runway, capital dependency cannot be priced properly.
    diligencePath: Request the latest cash-flow bridge and runway forecast.
    relatedQuestionRefs:
      - QI003
      - QI007
  - type: missing-source
    severity: minor
    topic: assistant-performance
    missingEvidence: A current third-party benchmark for Assistant accuracy or remediation quality.
    whyItMatters: It would separate marketing claims from validated performance.
    diligencePath: Request a recent customer benchmark or independent eval.
    relatedQuestionRefs:
      - QP004
      - QP007
  - type: missing-source
    severity: minor
    topic: retention
    missingEvidence: A public or confidential retention / expansion metric.
    whyItMatters: It would turn the customer story from logo-led to economic-quality evidence.
    diligencePath: Request current NRR / gross retention / expansion numbers.
    relatedQuestionRefs:
      - QU007
      - QU008
  - type: missing-source
    severity: minor
    topic: community-attrition
    missingEvidence: A measurable view of how many Community Edition users migrated away after the license change.
    whyItMatters: It would quantify whether the license controversy is only reputational or also funnel-damaging.
    diligencePath: Ask for CE usage and conversion trends around the fork period.
    relatedQuestionRefs:
      - QR001
      - QR002
  - type: missing-source
    severity: material
    topic: valuation-disclosure
    missingEvidence: A board-approved valuation, current ARR, and current growth metrics.
    whyItMatters: Those are the minimum inputs for a tighter private-company mark.
    diligencePath: Request the latest board deck or financing memo.
    relatedQuestionRefs:
      - QV004
      - QV005
      - QV007
