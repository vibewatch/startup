chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Semgrep sits in the developer-native AppSec market where teams want fast signal, low noise, and
    workflow integration rather than heavyweight security theater. The current market still rewards
    products that combine an open-source wedge with enterprise monetization, but AI-coded software is
    increasing the amount of code that needs to be checked and widening the need for in-line guardrails.
sections:
  - id: "market-pull"
    title: "Problem Definition and Market Pull"
    body: |
      The market pull behind Semgrep is straightforward: organizations keep shipping more code, often with AI agents involved, while security teams want higher signal and less review fatigue. Semgrep's own messaging emphasizes exactly that shift, with product pages and the Guardian launch framing the market as one in which builders and agents need guardrails directly in the workflow. Independent comparison sources make the same basic point: teams care about scan speed, actionable findings, and how well a product fits PR, IDE, and CI workflows.

      The buying motion is still anchored in developer experience. Semgrep's free Community Edition and low-friction pricing create a bottom-up motion, while the commercial platform solves the problems that appear once teams need cross-file analysis, team governance, and broader policy control. That means the company is not competing only on detection quality; it is also competing on adoption mechanics and the ability to move from individual usage to org-wide deployment.

      AI-written code makes the market bigger and more urgent, but it also raises the bar. Tools now need to understand context, not just pattern-match text, and they need to keep up with the volume of new code being produced by humans and agents alike.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
    figureRefs: [FM001]

  - id: "segment-and-go-to-market"
    title: "Segmentation, Pricing, and GTM Shape"
    body: |
      Semgrep's segmentation is unusually clear. The free Community Edition targets individual developers, security auditors, and smaller teams that are willing to tolerate some false positives in exchange for speed and control. The commercial platform targets teams that want cross-file analysis, AI triage, workflow routing, and admin controls. The pricing structure mirrors that segmentation by making the first ten contributors free and then charging on a contributor basis for paid tiers.

      That creates a classic product-led funnel with a strong enterprise upgrade path. Independent pricing and buyer-journey sources suggest the Team tier is negotiated enough that public list price is only a starting point. In practice, Semgrep sells an upgrade from "good enough" free scanning to organization-level security operations. The company therefore participates in both the low-end "good developer tool" market and the higher-end "operational AppSec platform" market.

      The market implication is that Semgrep should be judged less like a narrow scanner vendor and more like an operating layer for code-security workflows. That expands the pool of possible buyers but also places the company in more direct competition with broader platforms.
    claimRefs: [CM005, CM006, CM007, CM008]
    tableRefs: [TM002]

  - id: "adoption-signals"
    title: "Adoption Signals and Market Constraints"
    body: |
      Public adoption evidence remains strong. Semgrep's own site names a well-known set of customers, while third-party databases list active usage across mid-market and enterprise organizations. The signal is not just brand names; it is that the product appears in CI/CD, IDE, and AI-assisted coding workflows, which is where the volume of scanning decisions now lives.

      The constraint is that the category is crowded. Buyers can choose between Semgrep, broader enterprise AppSec suites, open-source forks, and adjacent tools that may emphasize vulnerability breadth, code quality, or AI-assisted remediation. That means Semgrep must keep proving two things at once: that it is fast enough to be developer-friendly and deep enough to be worth paying for. The current market narrative supports that position, but it does not make it uncontested.
    claimRefs: [CM009, CM010, CM011, CM012]
    tableRefs: [TM003]

