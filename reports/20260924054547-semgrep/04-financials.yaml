runDate: "2026-09-24"
company:
  name: "Semgrep"
chapter:
  number: 4
  title: "Financials"
  summary: >
    Semgrep's financial picture remains growth-oriented but opaque. The company has raised $204M,
    announced a $100M Series D in 2025, and continues to avoid public revenue disclosure. The refreshed
    record is good enough to confirm scale and fundraising momentum, but not good enough to underwrite
    valuation with high precision.
sections:
  - id: "funding-history"
    title: "Funding and Capital History"
    body: |
      Semgrep's funding history is now straightforward. The company announced a $100M Series D in February 2025 led by Menlo Ventures and said total funding reached $204M. Earlier, TechCrunch reported the $53M Series C in 2023, when the business was still much smaller and revenue-producing products had grown quickly but were not publicly detailed. Crunchbase News and Yahoo Finance both covered the Series D as a major private-market security financing.

      The investor set is still a familiar enterprise-software syndicate: Menlo, Lightspeed, Redpoint, Sequoia, Felicis, and Harpoon. That matters because it suggests the company is still backed by investors who can support long private runways if the business keeps compounding. The key diligence question is not whether the company can raise capital; it is whether the company can justify the next step-up in valuation with current operating efficiency.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]

  - id: "profitability-opacity"
    title: "Revenue, Margin, and Burn Opacity"
    body: |
      Semgrep remains private and does not publish ARR, revenue run-rate, gross margin, NRR, or cash burn. That is normal for a venture-backed private software company, but it is still a meaningful handicap for diligence because the company is now large enough that those metrics should exist internally and should drive the next financing conversation. Without them, the best public underwriting input is still product evidence plus fundraising history.

      Tracxn's latest employee count estimate, 266 as of late August 2026, suggests the company has moved beyond startup scale. That makes the absence of hard operating metrics more important, not less. At this stage, investors care less about the fact that the company is growing and more about the quality of that growth.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]

  - id: "valuation-view"
    title: "Valuation and Capital Markets View"
    body: |
      Semgrep does not disclose an official valuation, but Forge's secondary-market page shows a much higher implied figure than the headline funding round alone would suggest. That is useful as a directional indicator, not as a mark to market. In a private setting, the real question is whether the operating story supports a premium multiple relative to the amount of capital raised.

      The current answer is "probably yes on product quality, not yet fully proven on financial quality." The company has a strong platform, a credible enterprise buyer story, and visible adoption, but the valuation call still depends on management-confirmed growth efficiency and retention. Until those data are available, valuation should remain a range-based judgment rather than a hard point estimate.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]

tables:
