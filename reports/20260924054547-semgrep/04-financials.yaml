      - ["2025-02", "Series D", "$100M", "Menlo Ventures", "Accelerated AI and GTM expansion"]
      - ["2025-02", "Total raised", "$204M", "N/A", "Capital base for the next phase"]
    notes: "Round amounts are from official or widely cited coverage; the company has not published a detailed cap table."
    claimRefs: [CI001, CI002, CI003, CI004]

  - id: "TI002"
    title: "Operating Data Gaps"
    columns: ["Metric", "Public status", "Why it matters"]
    rows:
      - ["ARR", "Not disclosed", "Needed for growth and valuation"]
      - ["Revenue run-rate", "Not disclosed", "Needed for current scale"]
      - ["NRR", "Not disclosed", "Needed for retention quality"]
      - ["Burn", "Not disclosed", "Needed for runway and financing risk"]
      - ["Gross margin", "Not disclosed", "Needed for software economics"]
    notes: "The lack of public operating data is the central financial diligence gap."
    claimRefs: [CI005, CI006, CI007, CI008]

  - id: "TI003"
    title: "Valuation Indicators"
    columns: ["Indicator", "Status", "Interpretation"]
    rows:
      - ["Official valuation", "Not publicly disclosed", "No audited mark available"]
      - ["Forge secondary snapshot", "$799.24M valuation label", "Directional, not audited"]
      - ["Stage", "Series D private", "Still a growth-company valuation problem"]
      - ["Capital raised", "$204M", "Supports a premium private mark, but not proof"]
    notes: "Forge is a secondary-market datapoint and should not be treated as a formal company mark."
    claimRefs: [CI009, CI010, CI011, CI012]

