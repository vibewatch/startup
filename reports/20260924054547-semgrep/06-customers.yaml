company:
  name: "Semgrep"
chapter:
  number: 6
  title: "Customers"
  summary: >
    Semgrep's customer story is still strong: public references point to well-known engineering-heavy
    organizations, while third-party databases show adoption across a broader mid-market and enterprise
    base. The main refresh question is not whether the company has customers, but how broad and sticky
    that adoption is relative to the opaque revenue picture.
sections:
  - id: "named-logos"
    title: "Named Logos and Referenceability"
    body: |
      The most visible customer signal remains the same: Semgrep publicly names companies such as Dropbox, Figma, Slack, Snowflake, GitLab, Shopify, HashiCorp, and Notion. Those logos matter because they are all software-heavy organizations with serious engineering throughput and meaningful security surface area. The product therefore appears to have landed not just with hobby users, but with teams that operate code at scale.

      Semgrep's own pages and customer-facing content also emphasize that the product improves remediation speed and reduces false positives. Those are the outcomes customers care about once a scanner becomes part of the daily workflow. The customer signal is therefore not just "many users"; it is that the platform has moved from experimentation into recurring operational use.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: "adoption-patterns"
    title: "Adoption Pattern and Segment Mix"
    body: |
      Third-party customer databases and company references suggest a mixed customer base: mid-market teams, larger software companies, and security practitioners who adopt the product through CI, PR comments, or local scanning. That pattern is consistent with a bottom-up product-led tool that later becomes a team-wide policy layer.

      The strongest implication is that Semgrep is not locked into one vertical. Its logos and use cases span software, fintech, cloud, and developer-tool companies, which gives the business a broad addressable base. At the same time, that breadth means the company needs to keep proving value across many codebases rather than relying on a single horizontal niche.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]

  - id: "customer-outcomes"
    title: "What Customers Get"
    body: |
      Semgrep's public customer content consistently returns to three outcomes: faster triage, fewer false positives, and earlier remediation. That fits the company's overall narrative that the right security product should reduce friction rather than add it. The 2026 Guardian launch extends that same logic into AI-written code, where customers can catch issues at the moment they are introduced.

      The main diligence point is that the company has enough referenceability to support a real enterprise sales motion, but not enough public reporting to quantify customer retention, expansion, or churn. The customer story is positive, yet still qualitative.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]

