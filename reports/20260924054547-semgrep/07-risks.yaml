      - ["Alternative scanners", "Developer-first competitors", "More switching options"]
    notes: "Competitive pressure is structural and ongoing."
    claimRefs: [CR005, CR006, CR007, CR008]

  - id: "TR003"
    title: "Execution Risk"
    columns: ["Risk", "What could go wrong", "Why it matters"]
