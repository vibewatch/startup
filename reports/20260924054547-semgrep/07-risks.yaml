      - ["Community balance", "Open-source users feel alienated", "Hurts funnel quality"]
      - ["Enterprise scaling", "Sales motion outruns product clarity", "Could raise churn risk"]
    notes: "These are forward-looking risk hypotheses, not confirmed issues."
    claimRefs: [CR009, CR010, CR011, CR012]

