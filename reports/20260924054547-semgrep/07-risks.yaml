  name: "Semgrep"
chapter:
  number: 7
  title: "Risks"
  summary: >
    Semgrep's risks are now well understood: the open-source license controversy created a durable
    reputational overhang, OpenGrep offers a plausible fork path, GitHub-native tools remain a strong
    substitute, and the company still does not disclose the operating metrics needed to prove durable
    unit economics. The business is good; the risk stack is still real.
sections:
  - id: "license-and-reputation"
    title: "License and Reputation Risk"
    body: |
      The biggest durable risk is still the 2024 license change and the backlash that followed. The OpenGrep launch made that backlash concrete: competitors and ecosystem participants publicly framed the fork as a defense of open-source access and as a reaction to Semgrep's commercial restrictions. That creates reputational drag even when the commercial platform is technically stronger than the free fork.

      The risk is not only moral or narrative. The more Semgrep's community edition looks restricted, the more likely it is that some users will treat the free path as transient and move earlier to a competing tool or a fork. That turns a brand event into a funnel event.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]

  - id: "competitive-and-pricing"
    title: "Competitive and Pricing Risk"
    body: |
      Semgrep also sits in a market where buyers can switch to GitHub-native tooling, broad AppSec suites, or lower-friction alternatives if the product becomes expensive or hard to justify. Public pricing makes the product accessible, but the contributor model also gives buyers a clear line of sight into cost, which makes procurement comparison easy.

      In practice, this means Semgrep has to keep its signal-to-noise advantage intact. If the product becomes just another scanner, the market will happily compare it against tools that bundle more capabilities or live inside an existing vendor relationship. Competitive risk is therefore less about whether alternatives exist and more about how quickly those alternatives can match enough of the workflow to be acceptable.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]

  - id: "financial-and-execution"
    title: "Financial and Execution Risk"
    body: |
      The final risk category is financial opacity. Semgrep has strong funding support, but it still does not disclose the operating metrics that would tell us whether growth is efficient or expensive. That matters because private security software can raise capital for a long time, but valuation eventually depends on proof, not narrative.

      The company is also now large enough that execution risk is broader than product release quality. It must keep shipping AI features, preserve developer trust, support enterprise sales, and keep the open-source community from feeling abandoned. That is a difficult balancing act, and it becomes harder if customer growth slows or if competing products get "good enough."
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]

