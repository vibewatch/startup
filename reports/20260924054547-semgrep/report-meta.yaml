companyProfile:
  summary: >
    Semgrep is a San Francisco-based application security company founded in 2017 by Isaac Evans, Drew Dennison, and
    Luke O'Malley. The company started as an open-source static analysis engine and now sells a broader AppSec platform
    that spans Code, Supply Chain, Secrets, Assistant, and Guardian. Its commercial motion is open-core and
    contributor-based, with a free edition used as the distribution wedge and paid tiers layered on top for governance,
    cross-file analysis, and AI-assisted remediation.
