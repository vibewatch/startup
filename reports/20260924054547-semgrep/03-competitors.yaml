chapter:
  number: 3
  title: "Competitors"
  summary: >
    Semgrep competes in a crowded static-analysis and AppSec market where buyers can choose between
    developer-first scanners, broader enterprise suites, open-source forks, and GitHub-native security.
    The company still stands out on workflow fit and custom rules, but its moat depends on maintaining
    better signal, faster scans, and a cleaner upgrade path than adjacent tools.
sections:
  - id: "direct-competitors"
    title: "Direct Competitive Set"
    body: |
      Semgrep's direct competitive set is broader than a single SAST category. The most obvious comparison points are Snyk Code, Checkmarx, Veracode, SonarQube, DeepSource, and GitHub CodeQL / GHAS. Independent comparison pieces also point to OpenGrep as the most immediate open-source fork risk, especially for teams that want Semgrep-like scanning without the commercial restrictions on Community Edition.

      The important competitive distinction is not just feature breadth. Semgrep wins when the buyer values fast scans, custom rules that read like code, and a developer workflow that can start free and later expand into platform governance. Competitors win when they offer broader platform bundles, stronger enterprise procurement fit, or tighter GitHub-native distribution. The category therefore has many substitutes, but not many true like-for-like matches on Semgrep's specific product motion.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]

  - id: "differentiation"
    title: "Where Semgrep Differentiates"
    body: |
      Semgrep's best differentiation is a combination of syntax-like rule authoring, fast scans, and a commercial path that preserves the open-source wedge. The paid platform adds cross-file analysis, AI triage, and workflow controls that are materially stronger than the free Community Edition. That combination is more compelling than pure scanner breadth because it lets the company claim both openness and enterprise readiness.

      The Guardian launch broadens the story further by moving into AI-agent security, which is still early enough that not every competitor can match the narrative or the workflow placement. But the same move also invites closer comparison with other AI-native security products and broader AppSec suites. Semgrep therefore differentiates best when the buyer cares about developer experience and incremental adoption rather than a single all-in platform purchase.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002]

  - id: "competitive-risks"
    title: "Competitive Risks"
    body: |
      The biggest risk is that a buyer already on GitHub can choose GitHub-native security tooling and avoid introducing a new vendor. A second risk is that OpenGrep recreates enough of the free Semgrep experience to blunt the Community Edition funnel. A third risk is that broader suites can bundle enough adjacent functionality to make Semgrep look like a point solution rather than a platform.

      Semgrep's defense is execution, not uniqueness. It needs to keep scans fast, findings actionable, and the developer experience smoother than the alternatives. If it slips on noise, usability, or pricing discipline, the market has enough substitute products to make switching easy.
    claimRefs: [CP009, CP010, CP011, CP012]
    tableRefs: [TP003]
    figureRefs: [FP001]

