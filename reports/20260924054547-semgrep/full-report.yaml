    title: Risks
    sections:
      - number: '7.1'
        title: License and Reputation Risk
        blocks:
          - type: paragraph
            body: >
              The biggest durable risk is still the 2024 license change and the backlash that followed. The OpenGrep
              launch made that backlash concrete: competitors and ecosystem participants publicly framed the fork as a
              defense of open-source access and as a reaction to Semgrep's commercial restrictions. That creates
              reputational drag even when the commercial platform is technically stronger than the free fork.


              The risk is not only moral or narrative. The more Semgrep's community edition looks restricted, the more
              likely it is that some users will treat the free path as transient and move earlier to a competing tool or
              a fork. That turns a brand event into a funnel event.
