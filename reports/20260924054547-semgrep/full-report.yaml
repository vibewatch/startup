chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Product Shape
        blocks:
          - type: paragraph
            body: >
              Semgrep is headquartered in San Francisco and was founded in 2017 by Isaac Evans, Drew Dennison, and Luke
              O'Malley. The business began as an open-source static analysis engine and has since grown into a
              commercial AppSec platform that spans SAST, SCA, and secrets scanning. The current positioning is
              explicitly developer-centric: Semgrep says the platform is for builders and agents, not just AppSec
              specialists, and it emphasizes fast scans, low noise, and workflow-native delivery.


              The open-source roots still matter. The free Community Edition remains the acquisition wedge, while the
              commercial platform layers in cross-file analysis, AI triage, policy controls, and reporting. The company
              now uses the same core engine for code, supply chain, and secret detection, which gives the product line a
              coherent architecture rather than a bundle of loosely related tools.


              Recent product messaging shows the company moving beyond a traditional PR-check scanner. Guardian,
              released in 2026, is framed as an agentic security layer for AI-written code and sits alongside the
              broader platform messaging on autonomous remediation and real-time guardrails.
