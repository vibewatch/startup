      - number: '2.2'
        title: Segmentation, Pricing, and GTM Shape
        blocks:
          - type: paragraph
            body: >
              Semgrep's segmentation is unusually clear. The free Community Edition targets individual developers,
              security auditors, and smaller teams that are willing to tolerate some false positives in exchange for
              speed and control. The commercial platform targets teams that want cross-file analysis, AI triage,
              workflow routing, and admin controls. The pricing structure mirrors that segmentation by making the first
              ten contributors free and then charging on a contributor basis for paid tiers.


              That creates a classic product-led funnel with a strong enterprise upgrade path. Independent pricing and
              buyer-journey sources suggest the Team tier is negotiated enough that public list price is only a starting
              point. In practice, Semgrep sells an upgrade from "good enough" free scanning to organization-level
              security operations. The company therefore participates in both the low-end "good developer tool" market
              and the higher-end "operational AppSec platform" market.


              The market implication is that Semgrep should be judged less like a narrow scanner vendor and more like an
              operating layer for code-security workflows. That expands the pool of possible buyers but also places the
              company in more direct competition with broader platforms.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
