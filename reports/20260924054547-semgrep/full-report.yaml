      - number: '5.3'
        title: Moat and Limits
        blocks:
          - type: paragraph
            body: >
              Semgrep's moat is real but specific. The open-source engine, custom rule model, and workflow integration
              create a strong developer-first experience, and the AI/MCP features push the company into the agentic
              coding wave early. But the moat is not absolute: the Community Edition is intentionally narrower than the
              paid platform, and the open-source fork ecosystem means the company has to keep proving that the
              commercial layer is worth the upgrade.


              In other words, the technology moat is strongest when paired with distribution and workflow adoption.
              Semgrep's best technical advantage is not a single algorithmic breakthrough; it is the combination of
              semantic matching, fast scans, governance controls, and an increasingly agent-aware product surface.
