  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Problem Definition and Market Pull
        blocks:
          - type: paragraph
            body: >
              The market pull behind Semgrep is straightforward: organizations keep shipping more code, often with AI
              agents involved, while security teams want higher signal and less review fatigue. Semgrep's own messaging
              emphasizes exactly that shift, with product pages and the Guardian launch framing the market as one in
              which builders and agents need guardrails directly in the workflow. Independent comparison sources make
              the same basic point: teams care about scan speed, actionable findings, and how well a product fits PR,
              IDE, and CI workflows.


              The buying motion is still anchored in developer experience. Semgrep's free Community Edition and
              low-friction pricing create a bottom-up motion, while the commercial platform solves the problems that
              appear once teams need cross-file analysis, team governance, and broader policy control. That means the
              company is not competing only on detection quality; it is also competing on adoption mechanics and the
              ability to move from individual usage to org-wide deployment.


              AI-written code makes the market bigger and more urgent, but it also raises the bar. Tools now need to
              understand context, not just pattern-match text, and they need to keep up with the volume of new code
              being produced by humans and agents alike.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
