      - number: '1.2'
        title: Capital, Scale, and Commercial Traction
        blocks:
          - type: paragraph
            body: >
              Semgrep's capital base is now large enough to support a broad enterprise push. The company announced a
              $100M Series D in February 2025 led by Menlo Ventures, bringing total funding to $204M. Earlier,
              TechCrunch covered the $53M Series C in 2023, when the business was still much smaller and publicly
              described revenue growth as strong but undisclosed in absolute terms. The current investor mix remains
              classic venture-backed security infrastructure: institutional, multi-round, and still privately held.


              The latest public headcount data point in the refreshed bundle shows 266 employees as of late August 2026
              from Tracxn, which is directionally consistent with a company that has moved from open-source project to
              scaled platform vendor. The company also continues to market contributor-based pricing, with a free tier
              and a Teams tier starting at $30 per contributor per month.


              Customer references remain strong but incomplete. Semgrep publicly names companies such as Dropbox, Figma,
              Slack, Snowflake, and Notion, but it does not publish a current customer count or any audited revenue
              metric. That combination suggests meaningful adoption without full financial transparency.
