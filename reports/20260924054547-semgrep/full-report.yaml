        title: Refresh Delta and Open Gaps
        blocks:
          - type: paragraph
            body: >
              The 2026 refresh is most useful where the company has changed recently: Guardian is now the flagship
              agentic-code-security narrative, and the pricing page has converged on a clearer free/Teams/Enterprise
              structure. At the same time, the largest diligence gaps remain the same as before: current ARR, NRR, burn,
