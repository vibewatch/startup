      - number: '3.3'
        title: Competitive Risks
        blocks:
          - type: paragraph
            body: >
              The biggest risk is that a buyer already on GitHub can choose GitHub-native security tooling and avoid
              introducing a new vendor. A second risk is that OpenGrep recreates enough of the free Semgrep experience
              to blunt the Community Edition funnel. A third risk is that broader suites can bundle enough adjacent
              functionality to make Semgrep look like a point solution rather than a platform.


              Semgrep's defense is execution, not uniqueness. It needs to keep scans fast, findings actionable, and the
              developer experience smoother than the alternatives. If it slips on noise, usability, or pricing
              discipline, the market has enough substitute products to make switching easy.
