      - number: '7.3'
        title: Financial and Execution Risk
        blocks:
          - type: paragraph
            body: >
              The final risk category is financial opacity. Semgrep has strong funding support, but it still does not
              disclose the operating metrics that would tell us whether growth is efficient or expensive. That matters
              because private security software can raise capital for a long time, but valuation eventually depends on
              proof, not narrative.


              The company is also now large enough that execution risk is broader than product release quality. It must
              keep shipping AI features, preserve developer trust, support enterprise sales, and keep the open-source
              community from feeling abandoned. That is a difficult balancing act, and it becomes harder if customer
              growth slows or if competing products get "good enough."
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What the Public Market Mark Says
        blocks:
          - type: paragraph
            body: >
              Forge's secondary-market page is the cleanest public valuation breadcrumb in the refreshed bundle and
              shows a $799.24M valuation label for Semgrep. That is useful as an external signal, but it is not an
              audited company mark and should not be treated as a formal post-money valuation. The key point is simply
              that third-party market data places the company above a mere seed or Series A profile.


              The other public inputs all point in the same general direction: Semgrep has raised a meaningful amount of
              capital, has visible enterprise traction, and is still private. Those facts support a valuation view that
              is at least solidly in growth-company territory. The question is whether the premium should be above, at,
              or below the Forge indication.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Valuation Range and Stance
        blocks:
          - type: paragraph
            body: >
              Because Semgrep does not disclose revenue or ARR, any valuation range has to be grounded in comparable
              private-company logic rather than a hard revenue multiple. The practical judgment is that the company is
              probably above the range of a lightly funded developer tool, but still not well enough disclosed to
              justify a precise mark. That argues for a fair-to-uncertain stance rather than a strong buy thesis on
              valuation alone.


              The valuation debate therefore depends less on the exact number and more on the quality of the operating
              evidence. If management can show strong retention, efficient growth, and durable AI-driven product
              expansion, the market mark can hold or rise. If not, the lack of public metrics will keep the valuation
              case fragile.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: What Would Change the Mark
        blocks:
          - type: paragraph
            body: >
              The fastest way to improve confidence is to disclose current ARR, growth rate, and NRR. Those metrics
              would let us compare Semgrep against other private security and developer-platform names on something
              closer to a standardized basis. The second-best improvement would be a current board-approved post-money
              or secondary reference that is easier to trust than a marketplace snapshot.


              Until then, the valuation call remains a synthesis of product quality, adoption evidence, capital raised,
              and external market snippets. That is enough for a working diligence view, but not enough for a crisp
              investment-grade mark.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
