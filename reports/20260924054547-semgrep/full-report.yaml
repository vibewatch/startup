      - number: '7.2'
        title: Competitive and Pricing Risk
        blocks:
          - type: paragraph
            body: >
              Semgrep also sits in a market where buyers can switch to GitHub-native tooling, broad AppSec suites, or
              lower-friction alternatives if the product becomes expensive or hard to justify. Public pricing makes the
              product accessible, but the contributor model also gives buyers a clear line of sight into cost, which
              makes procurement comparison easy.


              In practice, this means Semgrep has to keep its signal-to-noise advantage intact. If the product becomes
              just another scanner, the market will happily compare it against tools that bundle more capabilities or
              live inside an existing vendor relationship. Competitive risk is therefore less about whether alternatives
              exist and more about how quickly those alternatives can match enough of the workflow to be acceptable.
