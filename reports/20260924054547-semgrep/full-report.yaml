  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Competitive Set
        blocks:
          - type: paragraph
            body: >
              Semgrep's direct competitive set is broader than a single SAST category. The most obvious comparison
              points are Snyk Code, Checkmarx, Veracode, SonarQube, DeepSource, and GitHub CodeQL / GHAS. Independent
              comparison pieces also point to OpenGrep as the most immediate open-source fork risk, especially for teams
              that want Semgrep-like scanning without the commercial restrictions on Community Edition.


              The important competitive distinction is not just feature breadth. Semgrep wins when the buyer values fast
              scans, custom rules that read like code, and a developer workflow that can start free and later expand
              into platform governance. Competitors win when they offer broader platform bundles, stronger enterprise
              procurement fit, or tighter GitHub-native distribution. The category therefore has many substitutes, but
              not many true like-for-like matches on Semgrep's specific product motion.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
