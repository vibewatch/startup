      - number: '3.2'
        title: Where Semgrep Differentiates
        blocks:
          - type: paragraph
            body: >
              Semgrep's best differentiation is a combination of syntax-like rule authoring, fast scans, and a
              commercial path that preserves the open-source wedge. The paid platform adds cross-file analysis, AI
              triage, and workflow controls that are materially stronger than the free Community Edition. That
              combination is more compelling than pure scanner breadth because it lets the company claim both openness
              and enterprise readiness.


              The Guardian launch broadens the story further by moving into AI-agent security, which is still early
              enough that not every competitor can match the narrative or the workflow placement. But the same move also
              invites closer comparison with other AI-native security products and broader AppSec suites. Semgrep
              therefore differentiates best when the buyer cares about developer experience and incremental adoption
              rather than a single all-in platform purchase.
