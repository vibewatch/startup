            body: >
              Semgrep's technology story is strongest where it can claim speed and context at the same time. The company
              says its platform supports 35+ languages on the commercial side, includes 20,000+ Pro rules, and adds
              cross-file analysis beyond the Community Edition. The docs also show practical workflow depth: policy
              modes, PR/MR comments, Slack and Jira notifications, CI/CD integrations, and IDE support.


              The AI layer is equally important. The Guardian launch frames Semgrep as an always-on security layer for
              agents and IDEs, while the Assistant messaging focuses on triage and remediation guidance rather than
              generic chat. That is a meaningful technical distinction because the product is trying to reduce the
              manual work around findings, not just surface more of them.
