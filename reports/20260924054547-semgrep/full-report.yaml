  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Stack and Product Modules
        blocks:
          - type: paragraph
            body: >
              Semgrep's platform now reads like a layered security system rather than a single scanner. The free
              Community Edition gives the company distribution and developer familiarity, while the commercial platform
              adds Semgrep Code, Supply Chain, Secrets, and AI layers. The official site and docs are explicit that the
              commercial offer is designed to unify scanning, triage, and remediation across the SDLC rather than merely
              emit findings.


              That architecture matters because each layer solves a different problem. Code handles SAST, Supply Chain
              handles dependency reachability, Secrets checks credential exposure, and the AI layer reduces noise and
              helps with remediation. Guardian extends that logic into AI-assisted coding workflows so the guardrail
              exists at the moment code is produced.
            claimRefs:
