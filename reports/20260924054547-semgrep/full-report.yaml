              drive the next financing conversation. Without them, the best public underwriting input is still product
              evidence plus fundraising history.


              Tracxn's latest employee count estimate, 266 as of late August 2026, suggests the company has moved beyond
              startup scale. That makes the absence of hard operating metrics more important, not less. At this stage,
