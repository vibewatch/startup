              Semgrep does not disclose an official valuation, but Forge's secondary-market page shows a much higher
              implied figure than the headline funding round alone would suggest. That is useful as a directional
              indicator, not as a mark to market. In a private setting, the real question is whether the operating story
              supports a premium multiple relative to the amount of capital raised.


              The current answer is "probably yes on product quality, not yet fully proven on financial quality." The
              company has a strong platform, a credible enterprise buyer story, and visible adoption, but the valuation
              call still depends on management-confirmed growth efficiency and retention. Until those data are
