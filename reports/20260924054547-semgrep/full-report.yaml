      - number: '2.3'
        title: Adoption Signals and Market Constraints
        blocks:
          - type: paragraph
            body: >
              Public adoption evidence remains strong. Semgrep's own site names a well-known set of customers, while
              third-party databases list active usage across mid-market and enterprise organizations. The signal is not
              just brand names; it is that the product appears in CI/CD, IDE, and AI-assisted coding workflows, which is
              where the volume of scanning decisions now lives.


              The constraint is that the category is crowded. Buyers can choose between Semgrep, broader enterprise
              AppSec suites, open-source forks, and adjacent tools that may emphasize vulnerability breadth, code
              quality, or AI-assisted remediation. That means Semgrep must keep proving two things at once: that it is
              fast enough to be developer-friendly and deep enough to be worth paying for. The current market narrative
              supports that position, but it does not make it uncontested.
