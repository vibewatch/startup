chapter:
  number: 5
  title: "Product and Technology"
  summary: >
    Semgrep's product stack is the main reason the company remains interesting: a fast open-source
    engine, a paid platform with cross-file analysis and AI triage, and a new Guardian layer for
    AI-written code. The technical thesis is that semantic rules plus workflow integration beat
    noisier scanners when developers need action, not just alerts.
sections:
  - id: "platform-stack"
    title: "Platform Stack and Product Modules"
    body: |
      Semgrep's platform now reads like a layered security system rather than a single scanner. The free Community Edition gives the company distribution and developer familiarity, while the commercial platform adds Semgrep Code, Supply Chain, Secrets, and AI layers. The official site and docs are explicit that the commercial offer is designed to unify scanning, triage, and remediation across the SDLC rather than merely emit findings.

      That architecture matters because each layer solves a different problem. Code handles SAST, Supply Chain handles dependency reachability, Secrets checks credential exposure, and the AI layer reduces noise and helps with remediation. Guardian extends that logic into AI-assisted coding workflows so the guardrail exists at the moment code is produced.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
    figureRefs: [FE001]

  - id: "engine-and-workflow"
    title: "Engine Depth and Workflow Fit"
    body: |
      Semgrep's technology story is strongest where it can claim speed and context at the same time. The company says its platform supports 35+ languages on the commercial side, includes 20,000+ Pro rules, and adds cross-file analysis beyond the Community Edition. The docs also show practical workflow depth: policy modes, PR/MR comments, Slack and Jira notifications, CI/CD integrations, and IDE support.

      The AI layer is equally important. The Guardian launch frames Semgrep as an always-on security layer for agents and IDEs, while the Assistant messaging focuses on triage and remediation guidance rather than generic chat. That is a meaningful technical distinction because the product is trying to reduce the manual work around findings, not just surface more of them.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE002]

  - id: "technical-moat"
    title: "Moat and Limits"
    body: |
      Semgrep's moat is real but specific. The open-source engine, custom rule model, and workflow integration create a strong developer-first experience, and the AI/MCP features push the company into the agentic coding wave early. But the moat is not absolute: the Community Edition is intentionally narrower than the paid platform, and the open-source fork ecosystem means the company has to keep proving that the commercial layer is worth the upgrade.

      In other words, the technology moat is strongest when paired with distribution and workflow adoption. Semgrep's best technical advantage is not a single algorithmic breakthrough; it is the combination of semantic matching, fast scans, governance controls, and an increasingly agent-aware product surface.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]

