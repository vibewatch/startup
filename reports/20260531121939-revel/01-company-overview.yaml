  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-metrics
    missingEvidence: Current revenue, ARR, gross margin, burn, and cash runway disclosures.
    whyItMatters: Without operating metrics, investors cannot judge whether the financing pace is justified by software economics or only by product promise.
    diligencePath: Request board materials, KPI dashboards, and budget/ramp assumptions from management during diligence.
    relatedQuestionRefs:
    - QO015
    - QO016
  - type: private-evidence-only
    severity: material
    topic: governance-structure
    missingEvidence: Full board roster, committee structure, and any observer or protective-rights arrangements.
    whyItMatters: The public narrative is highly founder-centric, so control and oversight cannot be evaluated from public materials alone.
    diligencePath: Request the cap table, voting agreements, board consents, and current board materials.
    relatedQuestionRefs:
    - QO008
    - QO026
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: valuation-disclosure
    missingEvidence: Primary or tier-one confirmation of the exact post-money valuation for the February 2026 Series B.
    whyItMatters: The strongest explicit valuation figure comes from a low-tier startup newsletter rather than official financing materials.
    diligencePath: Request signed financing docs or a lead-investor confirmation and check whether any later tier-one financial profile prints the number.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: current-customer-count
    missingEvidence: A current total customer count, production-vs-pilot breakdown, and any concentration data by revenue or deployments.
    whyItMatters: Public sources show strong lighthouse anecdotes but do not establish breadth, durability, or concentration risk.
    diligencePath: Request a customer list, ACV concentration table, and production deployment roster.
    relatedQuestionRefs:
    - QO016
    - QO019
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: current-headcount
    missingEvidence: A current headcount snapshot after the February 2026 fundraise.
    whyItMatters: The one-year post gives a dated 18-person point, but investors need a more current sense of hiring velocity and burn.
    diligencePath: Request current org charts and hiring plans, or corroborate through payroll and benefits data.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
