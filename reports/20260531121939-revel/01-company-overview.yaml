company:
  name: Revel
chapter:
  number: 1
  title: Company Overview
  summary: Revel is a Los Angeles-area hardware-control software startup founded in late 2024 by former SpaceX control-systems leader Scott Morton that emerged from stealth in April 2025 with $30 million across seed and Series A financing, then raised a $150 million Series B in February 2026 led by Index Ventures. Public evidence shows unusually strong founder-market fit, early customer proof across space and advanced-energy programs, and fast product expansion from test-stand software into broader industrial command-and-control, but current revenue, current customer count, full governance disclosure, and a primary-source valuation remain undisclosed.
sections:
- id: identity-mission-and-platform
  title: Identity, Mission, and Platform Scope
  body: 'Revel describes itself as a comprehensive software platform for developing, deploying, and commanding hardware systems from prototype through production. The company launched publicly in April 2025 after roughly six months of work and framed its mission as replacing decades-old control software used in aerospace, energy, manufacturing, automotive, and other industrial settings. Across its homepage, stealth-launch post, and later Series B materials, Revel consistently presents the product as a full-stack hardware-control environment rather than a narrow test utility: an intuitive command-and-control interface, a specialized programming language, and a high-performance runtime that supports deterministic execution, telemetry visibility, dashboards, alerts, and historical analysis. The homepage now distinguishes two named product surfaces: RevelTest for rapid hardware test development and RevelC2 for always-on industrial operations. That product framing matters because it shows the
    company already positioning itself beyond a single rocket-test use case and toward a broader software-defined control layer for critical physical systems.'
  claimRefs:
  - CO001
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
