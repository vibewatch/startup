- id: founder-market-fit-and-governance
  title: Founder-Market Fit, Team Pedigree, and Governance Visibility
  body: 'Scott Morton is the central public figure in Revel’s story, and the public record gives him unusually strong founder-market fit for this product. Fortune, Index Ventures, Redpoint, and Felicis all anchor the story in Morton’s more than nine years at SpaceX building and operating control software used in Falcon and Starship environments where one bad line of code can create catastrophic failure. Revel’s official materials extend that pedigree to a broader engineering cohort from SpaceX, Anduril, and Palantir, which supports the claim that the team understands real-time, mission-critical systems rather than approaching hardware control as generic SaaS. Public governance disclosure is much thinner. The February 2026 Series B announcement states that Index partner Nina Achadjian joined the board, but the company does not publish a full board roster, independent-director list, or broader executive bench on its public site. That asymmetry makes founder dependence material: Morton is simultaneously
    the public face, technical credibility anchor, and the clearest named executive in the fetched source set.'
  claimRefs:
  - CO002
  - CO012
  - CO016
  - CO018
  - CO019
  - CO037
  tableRefs:
  - TO002
  figureRefs: []
- id: capital-base-and-investor-map
  title: Capital Base, Investors, and Stage Progression
  body: Revel’s capital formation has been unusually compressed. The company’s stealth-launch materials state that it raised $30 million across a seed round led by Felicis and Abstract Ventures and a preemptive $23.1 million Series A led by Thrive Capital, with Dylan Field, Earthrise Ventures, and Commodity Capital also disclosed in the early investor set. By February 2026, that early investor base had been followed by a $150 million Series B led by Index Ventures, with Redpoint joining and Thrive, Felicis, and Abstract returning. Public sources are clear on the round size and investor list, and they are directionally clear on stage progression from stealth seed/Series A to later-stage institutional financing. They are not equally clear on the current capitalization table, preferences, or an official post-money valuation. Sourcery reports a roughly $1.005 billion valuation, but the official company announcement, Index thesis, and other primary-source material do not state a valuation number.
    That means the company is clearly at Series B stage, but the precise price is better treated as third-party reported than officially confirmed.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO014
  - CO015
  - CO017
  - CO040
  - CO041
