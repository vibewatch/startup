    - medium
    - Talent-pool limits and customer constraints can increase hiring costs and slow certain deployments
    - Request percentage of roles requiring export eligibility and impact on hiring velocity or international pipeline
  notes: The table intentionally mixes null metrics with qualitative proxies because Revel’s public record reveals cost buckets and workflow leverage, not classical software unit economics.
