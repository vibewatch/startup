  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: pricing-opacity
    missingEvidence: Actual price cards, realized initial ACVs, expansion ACVs, discount policy, and revenue-recognition treatment for RevelTest and RevelC2.
    whyItMatters: Without actual contract economics, investors cannot judge pricing power, discount discipline, or whether workflow value translates into attractive software revenue.
    diligencePath: Request current price cards, last ten signed orders, discount approvals, and a recognized-versus-booked revenue bridge by product line.
    relatedQuestionRefs:
    - QI011
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway case, and any debt, lease, or project obligations.
    whyItMatters: The company has raised a lot of capital publicly, but adequacy cannot be modeled without the balance-sheet and burn picture.
    diligencePath: Request latest balance sheet, trailing six-month cash-flow bridge, board runway view, and debt or lease schedule.
    relatedQuestionRefs:
    - QI022
    - QI023
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-visibility
    missingEvidence: Software gross margin, blended gross margin, deployment COGS, services mix, and support burden by deployment type.
    whyItMatters: Public sources reveal cost buckets but not whether Revel’s business scales like high-margin software or a heavier deployment-services hybrid.
    diligencePath: Request margin reporting by product and deployment architecture plus software-versus-services revenue split.
    relatedQuestionRefs:
    - QI010
    - QI027
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: sales-efficiency-visibility
    missingEvidence: Cohort CAC, sales-cycle timing, win-loss data, pilot-to-paid timing, and renewal or expansion history.
    whyItMatters: Public customer proof is impressive but not enough to determine whether the commercial motion is repeatable beyond founder-led or lighthouse deals.
    diligencePath: Request pipeline funnel metrics, cohort conversion data, and account expansion history by segment.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI003
