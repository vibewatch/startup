- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Diligence path
  rows:
  - - Current revenue / ARR
    - Cannot judge penetration, growth, or valuation multiple discipline from public sources alone
    - Request trailing-twelve-month revenue, current ARR, and booked-versus-recognized revenue bridge by product line
  - - Price cards and realized ACV
    - Cannot assess pricing power, discounting, or contract quality without actual initial and expansion contract data
    - Request current price cards, last ten signed contracts, and average discount by segment
  - - Gross margin and services mix
    - Cannot separate software economics from deployment or support labor
    - Request software gross margin, blended gross margin, and software-versus-services revenue split
  - - Current cash, burn, and runway
    - Cannot test capital adequacy or next-round timing
    - Request latest balance sheet, monthly burn bridge, and management runway case
  - - CAC, payback, and win rates
    - Cannot tell whether early customer proof is repeatable or merely founder-led
    - Request cohort CAC, sales-cycle length, pilot-to-paid conversion timing, and win/loss analysis
  - - Active customer count and concentration
    - A few lighthouse accounts can look strong while still masking concentration risk
    - Request active customer roster, revenue concentration, and top-five-account share
  - - Renewal and expansion metrics
    - Pilot conversion is encouraging but does not substitute for renewal durability or expansion efficiency
    - Request gross retention, expansion rates, and account-level expansion history
  - - Deployment COGS by architecture
    - Air-gapped or field-heavy deployments may carry materially different support and qualification costs
    - Request COGS by on-prem, edge, and cloud deployment model plus implementation staffing assumptions
  - - Debt, credit, or project obligations
    - Hidden obligations could change effective runway and downside risk
    - Request debt schedule, equipment leases, letters of credit, and any government contract obligations
  - - Current headcount and function mix
    - The only public team-size datapoint is stale, which limits burn analysis and operating-leverage assessment
    - Request current headcount by function, planned hiring, and loaded compensation model
  notes: These are not nice-to-have asks. They are the minimum private datapoints required to underwrite Revel’s financial profile responsibly.
