    - Request cloud and observability spend, data-retention policy, and gross margin by deployment architecture
  - - Field-hardware burden
    - Hardware qualification, burn-in, latency profiling, fleet monitoring, and secure hardware support are explicit in hiring
    - high
    - These responsibilities can create hidden deployment COGS and slower support leverage
    - Request per-deployment hardware qualification effort and any pass-through hardware costs
