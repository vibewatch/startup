  - - RevelC2 software contracts
    - Software for unified, always-on industrial command and control
    - Unknown; likely enterprise contract rather than self-serve purchase
    - Named product surface on official site, but no public monetization mechanics
    - Medium-High if expansion from test into operations is real
    - Request first three production contracts, billing unit, and expansion path from test to operations
  - - Pilot-to-customer expansion
    - Land on a painful workflow, then convert and expand within the same account
    - Unknown
    - Officially, Revel says every pilot has converted into a customer
    - Medium because conversion language is strong, but contract size and durability are unknown
    - Request pilot cohort history, conversion timing, and expansion revenue by cohort
  - - Deployment, integration, and support services
    - Customer-site setup, field deployment, integration with existing hardware environments, and technical support
    - Unknown; services, statement-of-work, or bundled enablement
