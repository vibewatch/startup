- id: capital-adequacy-and-finance-ops
  title: Capital Adequacy, Valuation Caveats, and Finance-Ops Visibility
  body: |-
    Revel’s public capital base is unusually large for how little financial detail it shares. The company’s April 2025 launch post says it had already raised $30 million across seed and Series A financing, including a $23.1 million Series A led by Thrive. In February 2026, Revel and its syndication partners disclosed a $150 million Series B led by Index Ventures. That produces a clearly supportable public total of $180 million in disclosed equity funding. Official Series B materials say the capital will be used for team expansion, product development, and broader market deployment, which is directionally consistent with the growing engineering and commercial hiring footprint visible in the fetched job set.

    What the public record does not disclose is at least as important. No reviewed source gives current cash on hand, monthly burn, runway, debt, or project-finance obligations. Official materials also do not publish an exact post-money valuation; the only precise number in the fetched set is Sourcery’s third-party report of roughly $1.005 billion, which should be treated as reported, not confirmed. Finance-function visibility is also thin. A registry-derived California filing page lists Scott Morton as CEO, CFO, and Secretary, which may simply reflect an early-stage corporate setup, but it does not show a separately disclosed finance bench. Combined with the broken revel.build domain and otherwise thin public operating disclosure, the signal is clear: Revel has raised enough capital to buy time and ambition, but not enough public transparency to model adequacy with confidence.
