  - - Realized pricing / ACV
    - null
    - low
    - Price discipline determines whether workflow compression translates into attractive contract economics
    - Request price cards, last ten initial ACVs, expansion ACVs, and discount policy
  - - CAC / payback
    - null
    - low
    - First-AE and first-BDR hiring show a maturing sales motion, but not enough to calculate efficiency
