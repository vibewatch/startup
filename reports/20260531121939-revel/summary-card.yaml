  topStrengths:
    - >-
      Revel addresses a real control-software pain point in high-consequence hardware environments with unusually strong
      founder-market fit from Scott Morton’s SpaceX background.
    - >-
      Public customer proof goes beyond logos: Impulse, Astro Mechanica, Radiant Nuclear, Gravitics, and Orbital
      Operations all appear in the reviewed source set, with concrete workflow gains disclosed for Impulse and Astro
      Mechanica.
    - >-
      The product record is unusually specific for a young company, with named modules, telemetry, dashboards,
      deterministic control logic, and evidence of serious investment in compiler, runtime, HIL, and deployment
      infrastructure.
    - >-
      $180 million of disclosed funding provides time and ambition to build out a broad software-defined control
      platform if deployment and compliance execution keep pace.
  topRisks:
    - >-
      Revenue, ARR, gross margin, burn, runway, customer concentration, and renewal metrics are all undisclosed, leaving
      valuation underwriting heavily narrative-driven.
    - >-
      The reported ~$1.005 billion valuation is third-party reported rather than officially disclosed, and public
      sources do not reveal preference terms or structured downside protection.
    - >-
      Deployments appear high touch and may carry significant implementation, support, hardware qualification, and
      compliance burden relative to standard software businesses.
    - >-
      The customer proof set is still concentrated in a handful of aerospace and advanced-energy references, with
      limited public evidence on breadth, retention, or self-scaling go-to-market efficiency.
    - >-
      Trust and assurance posture is directionally positive but not publicly validated by named certifications, audited
      controls, or disclosed uptime / incident metrics.
  unresolvedGaps:
    - Current revenue, ARR, gross margin, cash burn, and runway.
    - Exact post-money valuation, dilution, and preference-stack mechanics for the February 2026 Series B.
    - Customer count, concentration by revenue, renewal behavior, and expansion economics.
    - Full board composition, finance leadership depth, and KPI cadence after the Series B.
    - >-
      Security, export-control, and sector-specific compliance readiness for always-on control in regulated
      environments.
