summary:
  headline: >-
    Revel has a credible control-software wedge and unusually strong founder-market fit, but public metrics remain too
    thin to justify conviction at the third-party-reported $1B+ valuation.
  overallScore: 5.9
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
