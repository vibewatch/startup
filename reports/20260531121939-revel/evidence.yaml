    relatedQuestionRefs:
      - QR001
      - QR002
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Monthly and quarterly revenue or ARR by customer cohort, product surface, deployment type, and conversion path
      from pilot to production.
    whyItMatters: >-
      Without revenue-quality evidence, the reported valuation cannot be tied to software scale, durability, or
      expansion economics.
    diligencePath: Request a finance export and board-ready cohort analysis, then reconcile it with customer reference calls.
    relatedQuestionRefs:
      - QV013
      - QV024
      - QV030
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack
    missingEvidence: >-
      Executed term sheet, cap table, liquidation preferences, participation rights, ratchets, and ownership dilution
      for the latest round.
    whyItMatters: >-
      The headline valuation may materially overstate common-equity value if downside protections or seniority are
      aggressive.
    diligencePath: Obtain counsel-approved financing documents and a board-level cap-table summary.
    relatedQuestionRefs:
      - QV004
      - QV023
      - QV024
  - type: private-evidence-only
    severity: material
