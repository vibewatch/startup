    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer count, top-account ARR concentration, contract terms, renewal cadence, and expansion revenue by named
      account.
    whyItMatters: >-
      The public record supports real deployments, but not whether one or two logos dominate economics or whether
