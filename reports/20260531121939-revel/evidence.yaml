evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-metrics
    missingEvidence: Current revenue, ARR, gross margin, burn, and cash runway disclosures.
    whyItMatters: >-
      Without operating metrics, investors cannot judge whether the financing pace is justified by software economics or
      only by product promise.
    diligencePath: Request board materials, KPI dashboards, and budget/ramp assumptions from management during diligence.
    relatedQuestionRefs:
      - QO015
      - QO016
  - type: private-evidence-only
    severity: material
    topic: governance-structure
    missingEvidence: Full board roster, committee structure, and any observer or protective-rights arrangements.
    whyItMatters: >-
      The public narrative is highly founder-centric, so control and oversight cannot be evaluated from public materials
      alone.
    diligencePath: Request the cap table, voting agreements, board consents, and current board materials.
    relatedQuestionRefs:
      - QO008
      - QO026
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation-disclosure
    missingEvidence: Primary or tier-one confirmation of the exact post-money valuation for the February 2026 Series B.
    whyItMatters: >-
      The strongest explicit valuation figure comes from a low-tier startup newsletter rather than official financing
      materials.
    diligencePath: >-
      Request signed financing docs or a lead-investor confirmation and check whether any later tier-one financial
      profile prints the number.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: current-customer-count
    missingEvidence: >-
      A current total customer count, production-vs-pilot breakdown, and any concentration data by revenue or
      deployments.
    whyItMatters: Public sources show strong lighthouse anecdotes but do not establish breadth, durability, or concentration risk.
    diligencePath: Request a customer list, ACV concentration table, and production deployment roster.
    relatedQuestionRefs:
      - QO016
      - QO019
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: current-headcount
    missingEvidence: A current headcount snapshot after the February 2026 fundraise.
    whyItMatters: >-
      The one-year post gives a dated 18-person point, but investors need a more current sense of hiring velocity and
      burn.
    diligencePath: Request current org charts and hiring plans, or corroborate through payroll and benefits data.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: software-only-sam
    missingEvidence: >-
      A credible public or paid dataset isolating software-only spend for hardware test and control across aerospace,
      advanced energy, industrial control, and defense mission systems.
    whyItMatters: >-
      Without a software-only category, published automation and IIoT figures are only contextual envelopes and can
      materially overstate direct addressable spend.
    diligencePath: >-
      Ask management for bottom-up pipeline segmentation by use case and incumbent replaced, then benchmark against paid
      market maps for control software, SCADA/HMI, and mission-software budgets.
    relatedQuestionRefs:
      - QM006
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner-splits
    missingEvidence: >-
      Program-level evidence showing whether initial purchases come from engineering, operations, capex modernization,
      or defense RDT&E budgets in real customer accounts.
    whyItMatters: >-
      Knowing the real budget owner is necessary to estimate sales-cycle length, land-and-expand feasibility, and
      realistic near-term SOM.
    diligencePath: >-
      Collect closed-won deal data and reference-account procurement paths, including approval chains, budget codes, and
      who signed the first contract.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: export-classification-specifics
    missingEvidence: >-
      Product-level export classification, jurisdiction, and customer-by-customer restrictions for Revel modules used in
      defense-adjacent or dual-use deployments.
    whyItMatters: >-
      Export and compliance burdens can change which customers are reachable, how fast deals close, and whether
      international expansion is practical.
    diligencePath: >-
      Request formal trade-compliance analysis, ECCN or jurisdiction determinations, and any existing customer
      restrictions tied to defense or dual-use deployments.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: negotiated-pricing
    missingEvidence: >-
      Real enterprise quotes, expansion discounts, and support pricing for NI, Ignition, Beckhoff, Rockwell, Siemens,
      and Revel in comparable deployments.
    whyItMatters: >-
      Pricing transparency determines whether Revel wins on total cost or only on deployment speed and product
      ergonomics.
    diligencePath: >-
      Request anonymized quote packs or procurement screenshots from three recent competitive deals and map them against
      the TP003 comparison rows.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: installed-base
    missingEvidence: >-
      Installed-base counts by target vertical for NI, Beckhoff, Ignition, Rockwell, Siemens, and Keysight in aerospace,
      advanced energy, critical infrastructure, and defense-adjacent programs.
    whyItMatters: >-
      Installed-base density is a major determinant of switching costs, partner leverage, and how realistic brownfield
      displacement is for Revel.
    diligencePath: >-
      Pull customer-logo sets, disclosed reference counts, reseller or SI program data, and any public installed-base
      metrics by vertical before underwriting expansion assumptions.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: incumbent-displacement-proof
    missingEvidence: >-
      Brownfield references showing Revel displacing a mature incumbent stack rather than only replacing homegrown
      tooling.
    whyItMatters: >-
      The moat case is much stronger if Revel can prove wins against standardized NI, Ignition, TwinCAT, or FactoryTalk
      environments instead of just internal tools.
    diligencePath: >-
      Ask management for a reference set of competitive takeouts, including lost deals and deployment timelines, broken
      down by homegrown versus packaged-incumbent replacement.
  - type: private-evidence-only
    severity: blocking
    topic: pricing-opacity
    missingEvidence: >-
      Actual price cards, realized initial ACVs, expansion ACVs, discount policy, and revenue-recognition treatment for
      RevelTest and RevelC2.
    whyItMatters: >-
      Without actual contract economics, investors cannot judge pricing power, discount discipline, or whether workflow
      value translates into attractive software revenue.
    diligencePath: >-
      Request current price cards, last ten signed orders, discount approvals, and a recognized-versus-booked revenue
      bridge by product line.
    relatedQuestionRefs:
      - QI011
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly burn, runway case, and any debt, lease, or project obligations.
    whyItMatters: >-
      The company has raised a lot of capital publicly, but adequacy cannot be modeled without the balance-sheet and
      burn picture.
    diligencePath: Request latest balance sheet, trailing six-month cash-flow bridge, board runway view, and debt or lease schedule.
    relatedQuestionRefs:
      - QI022
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-visibility
    missingEvidence: Software gross margin, blended gross margin, deployment COGS, services mix, and support burden by deployment type.
    whyItMatters: >-
      Public sources reveal cost buckets but not whether Revel’s business scales like high-margin software or a heavier
      deployment-services hybrid.
    diligencePath: Request margin reporting by product and deployment architecture plus software-versus-services revenue split.
    relatedQuestionRefs:
      - QI010
      - QI027
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: sales-efficiency-visibility
    missingEvidence: Cohort CAC, sales-cycle timing, win-loss data, pilot-to-paid timing, and renewal or expansion history.
    whyItMatters: >-
      Public customer proof is impressive but not enough to determine whether the commercial motion is repeatable beyond
      founder-led or lighthouse deals.
    diligencePath: Request pipeline funnel metrics, cohort conversion data, and account expansion history by segment.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: integration-docs-gap
    missingEvidence: >-
      Public API references, supported protocol lists, deployment topologies, and integration runbooks for RevelTest and
      RevelC2.
    whyItMatters: >-
      Without concrete integration documentation, investors cannot judge implementation burden, switching cost, or
      breadth of hardware compatibility from public evidence alone.
    diligencePath: >-
      Request architecture review materials, API or protocol docs, and three recent customer integration plans with
      time-to-go-live timelines.
    relatedQuestionRefs:
      - QE022
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: assurance-gap
    missingEvidence: Third-party security attestations, audit summaries, uptime or SLA history, and incident-response evidence.
    whyItMatters: >-
      Public evidence shows controls in progress, but not whether those controls have been externally validated or
      translated into reliable operating outcomes.
    diligencePath: >-
      Request SOC 2 or ISO reports if they exist, customer security questionnaires, uptime dashboards, incident logs,
      and postmortem samples.
    relatedQuestionRefs:
      - QE023
      - QE024
      - QE027
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: export-control-context
    missingEvidence: >-
      Product classification, DDTC or BIS registration posture, customer export-control workflows, and evidence of how
      air-gapped or restricted deployments are governed.
    whyItMatters: >-
      Hiring constraints imply export-sensitive work, but the public record does not show whether compliance obligations
      create material friction in deployment, support, or staffing.
    diligencePath: >-
      Request counsel memo on ITAR or EAR exposure, sample customer compliance checklists, and internal process
      documents for restricted programs.
    relatedQuestionRefs:
      - QE018
      - QE026
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: deployment-repeatability
    missingEvidence: >-
      Supported hardware matrix, rollback and patching model, field failure thresholds, and deployment cadence across
      disconnected systems.
    whyItMatters: >-
      Revel’s product promise depends on repeatable, reliable field deployment across heterogeneous hardware, which
      cannot be fully underwritten from job descriptions and one case study.
    diligencePath: >-
      Request SRE and deployment playbooks, hardware qualification reports, and metrics for failed installs, rollback
      frequency, and mean time to restore.
    relatedQuestionRefs:
      - QE008
      - QE015
      - QE025
    relatedTableRefs:
      - TE003
      - TE004
