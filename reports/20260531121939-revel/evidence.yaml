    whyItMatters: >-
      Without external assurance evidence, investors cannot tell whether Revel’s security posture has matured at the
      same pace as its move into higher-consequence operational environments.
    diligencePath: >-
      Request current audit roadmap, recent penetration-test summaries, vulnerability-disclosure process, and a redacted
