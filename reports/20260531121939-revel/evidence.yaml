    whyItMatters: >-
      A large financing round without operating metrics makes valuation judgment and downside underwriting highly
      dependent on narrative rather than on economics.
    diligencePath: Obtain the current board deck or equivalent investor packet with monthly KPI, cash, and forecast data.
