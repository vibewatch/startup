    topic: regulatory-risk-register
    missingEvidence: >-
      An internal inventory of customer-specific approvals, export classifications, privacy workflows, and security
      commitments by deployment type.
    whyItMatters: >-
      The public register can rank likely exposures, but it cannot enumerate all obligations across Revel’s actual
