      accounts.
    relatedQuestionRefs:
      - QU017
      - QU027
  - type: private-evidence-only
    severity: blocking
    topic: top-account-revenue-share
    missingEvidence: >-
      Revenue concentration by top customer, including whether Impulse or any other reference account represents a
