    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: litigation-enforcement
    missingEvidence: >-
      A full PACER, state-court, and regulatory-enforcement sweep tied to Revel Software Corporation, executives, and
