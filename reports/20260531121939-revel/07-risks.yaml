- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Compliance and export readiness
    - Named owner, counsel memo, and product-boundary definition
    - No credible export / privacy / regulated-deployment ownership map during diligence
    - Stop unless regulated uses are ring-fenced and ownership is explicit.
  - - Security and assurance
    - Third-party audit and secure-development roadmap
    - No audit roadmap or customer security-review package within the next two quarters
    - Haircut multiple and require milestone-based financing logic.
  - - Deployment scalability
    - Implementation cadence and self-service ratio
    - More than half of new installs still require heavy on-site engineering after the current hiring wave
    - Model the company as services-heavier and lower-margin than headline software comps.
  - - Customer concentration
    - Top-account exposure and sector mix
    - Top customer above roughly 30% of ARR or no credible diversification beyond aerospace
    - Reduce conviction or demand pricing that reflects concentration risk.
  - - GTM repeatability
    - Founder dependence in enterprise sales
    - Founders still carry most enterprise deals after first AE/BDR ramp
    - Downgrade scaling assumptions and lengthen time-to-plan.
  - - Financial transparency
    - Board/investor KPI cadence
    - No burn, runway, gross-margin, or services-mix disclosure after a major financing round
    - Avoid valuation-dependent underwriting until basic metrics are shared.
  notes: Thresholds are practical underwriting triggers, not guaranteed failure points; they are meant to force crisp go / no-go decisions in follow-up diligence.
