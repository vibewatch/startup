- id: partner-customer-and-ecosystem-dependencies
  title: Partner, Customer, and Ecosystem Dependencies
  body: 'Revel also has a classic dependency stack problem. The customer story is strongest in aerospace and adjacent advanced-energy accounts, with real proof but still narrow breadth. That means customer concentration is not a theoretical downside; it is the default assumption until the company shows a broader installed base and contract diversification. The sales motion reinforces that reading. Public recruiting shows the first enterprise AE and first BDR being hired into an aerospace-led market, which is a normal startup milestone but also evidence that repeatable go-to-market is still being built rather than proven. If one or two marquee accounts dominate references, pilots, or revenue, those accounts have outsized influence on roadmap, implementation burden, and future fundraising narratives.


    The ecosystem side is equally material. Investor and company materials explicitly frame the opportunity as replacing old industrial and test-control stacks, while incumbent vendors such as Beckhoff, Ignition, Rockwell, and MathWorks market broad protocol support, lifecycle tooling, web deployment, analytics, HIL, and long-lived migration paths. That means Revel is not selling into a vacuum; it is asking teams to switch from entrenched systems with known failure modes but mature ecosystems. Astro Mechanica proves replacement can work, yet it also underscores the counter-risk: every migration may require protocol adaptation, customer-specific integration, and substantial trust-building before the economic model becomes repeatable.'
