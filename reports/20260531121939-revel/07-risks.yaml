  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: assurance-gap
    missingEvidence: Named third-party assurance artifacts such as SOC 2, ISO 27001, IEC 62443, security architecture review outputs, and customer security-review packets.
    whyItMatters: Without external assurance evidence, investors cannot tell whether Revel’s security posture has matured at the same pace as its move into higher-consequence operational environments.
    diligencePath: Request current audit roadmap, recent penetration-test summaries, vulnerability-disclosure process, and a redacted customer security questionnaire response set.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: litigation-enforcement
    missingEvidence: A full PACER, state-court, and regulatory-enforcement sweep tied to Revel Software Corporation, executives, and affiliates.
    whyItMatters: Open-source legal search is incomplete, so investors cannot treat a public zero-result search as a definitive absence of litigation or enforcement risk.
    diligencePath: Have counsel run formal docket and enforcement searches and confirm any threatened, pending, or settled matters.
    relatedQuestionRefs:
    - QR006
    - QR007
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer count, top-account ARR concentration, contract terms, renewal cadence, and expansion revenue by named account.
    whyItMatters: The public record supports real deployments, but not whether one or two logos dominate economics or whether revenue durability is actually repeatable.
    diligencePath: Request anonymized customer concentration bands, contract term samples, renewal history, and expansion metrics.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: blocking
    topic: financial-opacity
    missingEvidence: Current ARR, burn, gross margin, services mix, cash balance, runway, and board-level KPI package.
    whyItMatters: A large financing round without operating metrics makes valuation judgment and downside underwriting highly dependent on narrative rather than on economics.
    diligencePath: Obtain the current board deck or equivalent investor packet with monthly KPI, cash, and forecast data.
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register
    missingEvidence: An internal inventory of customer-specific approvals, export classifications, privacy workflows, and security commitments by deployment type.
    whyItMatters: The public register can rank likely exposures, but it cannot enumerate all obligations across Revel’s actual customer base and regulated end-use mix.
    diligencePath: Request a deployment-by-deployment compliance map covering end use, geography, export posture, and required security attestations.
    relatedQuestionRefs:
    - QR001
    - QR002
    - QR003
    relatedTableRefs:
    - TR001
