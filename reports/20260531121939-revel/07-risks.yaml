- id: mitigations-and-kill-criteria
  title: Mitigations and Kill Criteria
  body: 'The mitigation case is real, but it is still mostly visible as intent and hiring rather than as audited outcomes. Revel is clearly staffing for design assurance, hardware qualification, HIL validation, deployment tooling, and telemetry infrastructure, which is the right direction for a company serving high-consequence environments. The positive read is that management sees the hard problems early. The skeptical read is that investors are still funding the build-out of the control surface, not observing a fully institutionalized operating system for critical infrastructure. That distinction matters because the downside is not binary fraud or product nonexistence; it is becoming a valuable but slower-growing, service-heavier, compliance-constrained business than the headline valuation implies.


    The investment decision should therefore be gated by monitorable thresholds rather than by generic enthusiasm for defense- or industrial-software multiples. The chapter’s kill criteria are straightforward. If Revel cannot show a credible export/privacy/compliance ownership map, if deployments remain heavily site-led after the current hiring wave, if customer proof remains concentrated in a few logos, or if post-Series-B disclosure still omits basic operating metrics, the thesis should be marked down sharply. Conversely, evidence of repeatable deployment, broader customer breadth, and a clear assurance roadmap would materially de-risk the story.'
