  - id: architecture-and-operating-model
    title: Architecture and Operating Model
    body: |-
      The fetched set supports a layered architecture rather than a vague “AI for hardware” pitch. Official product copy and investor posts outline the same core stack: browser-based operator interfaces on top, RevelCode and compiler infrastructure for authoring control logic, a high-performance runtime that executes that logic deterministically, and a telemetry/reporting layer for live visibility plus historical analysis. The engineering hiring mix sharpens that picture considerably. Compiler recruiting shows a dedicated compiler subsystem. Embedded and Rust runtime roles show a performance-sensitive execution layer that bridges software to industrial machinery and real-time capabilities. Backend hiring describes high-frequency, high-cardinality telemetry pipelines, data storage and querying, and a gradual transition from on-premise deployments toward more cloud-based infrastructure. Simulation and HIL roles show that validation is being built as part of the product and release system rather than as an afterthought.

      Just as important, the product appears to be intentionally opinionated about the operator surface. The full-stack, early-career software, product-manager, and design-systems roles all reinforce that Revel wants browser-native, data-dense, mission-critical interfaces rather than a local engineering console alone. Design-systems language around ISA-101, NUREG-0700, WCAG, and NASA-STD-3001 is especially notable because it implies the company sees human factors as part of the core architecture for hazardous environments, not merely as UI polish. Put together, the operating model looks like a vertically integrated control stack: customer hardware and protocols at the edge, qualified compute and Linux runtime underneath, telemetry and reporting in the data plane, and collaborative browser interfaces for authoring, monitoring, and live operation at the top.
