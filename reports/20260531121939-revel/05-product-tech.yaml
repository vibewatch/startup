  evidenceGaps:
    - type: missing-source
      severity: material
      topic: integration-docs-gap
      missingEvidence: Public API references, supported protocol lists, deployment topologies, and integration runbooks for RevelTest and RevelC2.
      whyItMatters: Without concrete integration documentation, investors cannot judge implementation burden, switching cost, or breadth of hardware compatibility from public evidence alone.
      diligencePath: Request architecture review materials, API or protocol docs, and three recent customer integration plans with time-to-go-live timelines.
      relatedQuestionRefs:
        - QE022
      relatedTableRefs:
        - TE003
    - type: private-evidence-only
      severity: material
      topic: assurance-gap
      missingEvidence: Third-party security attestations, audit summaries, uptime or SLA history, and incident-response evidence.
      whyItMatters: Public evidence shows controls in progress, but not whether those controls have been externally validated or translated into reliable operating outcomes.
      diligencePath: Request SOC 2 or ISO reports if they exist, customer security questionnaires, uptime dashboards, incident logs, and postmortem samples.
      relatedQuestionRefs:
        - QE023
        - QE024
        - QE027
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: export-control-context
      missingEvidence: Product classification, DDTC or BIS registration posture, customer export-control workflows, and evidence of how air-gapped or restricted deployments are governed.
      whyItMatters: Hiring constraints imply export-sensitive work, but the public record does not show whether compliance obligations create material friction in deployment, support, or staffing.
      diligencePath: Request counsel memo on ITAR or EAR exposure, sample customer compliance checklists, and internal process documents for restricted programs.
      relatedQuestionRefs:
        - QE018
        - QE026
      relatedTableRefs:
        - TE004
    - type: missing-source
      severity: material
      topic: deployment-repeatability
      missingEvidence: Supported hardware matrix, rollback and patching model, field failure thresholds, and deployment cadence across disconnected systems.
      whyItMatters: Revel’s product promise depends on repeatable, reliable field deployment across heterogeneous hardware, which cannot be fully underwritten from job descriptions and one case study.
      diligencePath: Request SRE and deployment playbooks, hardware qualification reports, and metrics for failed installs, rollback frequency, and mean time to restore.
      relatedQuestionRefs:
        - QE008
        - QE015
        - QE025
      relatedTableRefs:
        - TE003
        - TE004
