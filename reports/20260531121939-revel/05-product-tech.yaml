  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control / program
      - Public status
      - Scope
      - What it proves
      - Gap / implication
    rows:
      - - Human-factors and HMI standards
        - Explicit in hiring
        - Dashboards and control-room interfaces used under stress, fatigue, and degraded conditions
        - Revel is intentionally grounding UI work in named standards and accessibility guidance rather than generic visual design
        - Public hiring is not the same as a validated human-factors program or customer audit outcome
      - - Platform security controls
        - Explicit in hardware-platform role
        - Secure Boot, TPM 2.0, disk encryption, image signing, and field system hardening
        - Product is designed for security-sensitive environments and not only for open internet-connected use cases
        - No public external audit, penetration-test summary, or certification disclosure
      - - Air-gapped and disconnected operation
        - Explicit in hardware-platform and deployment roles
        - Systems with no connectivity to external services and fleets of remote or embedded devices
        - Revel is not cloud-only and expects constrained deployment environments
        - Patch, update, and key-management model for disconnected systems is not public
      - - Validation and qualification campaigns
        - Explicit in hardware, simulation, and HIL roles
        - Thermal stress, burn-in, latency profiling, long-duration stability, simulation, and CI-backed HIL workflows
        - Reliability engineering appears to be a real investment area, not just marketing language
        - No public failure-rate, pass-rate, or uptime metrics to translate effort into outcomes
      - - Privacy and data handling
        - Published privacy policy
        - Accounts, payment-service-provider workflows, device and usage data, analytics, retention, and compliance disclosures
        - The company has at least baseline public legal/process documentation for web and application surfaces
        - Product-data boundaries, tenant isolation, and telemetry retention specifics are not publicly documented
      - - ITAR and export-control sensitivity
        - Visible but indirect
        - Dashboard and backend roles include ITAR constraints; BIS frames export controls as a compliance regime tied to national security
        - Revel likely serves programs where U.S.-person eligibility and export controls matter operationally
        - This is not proof of product classification, DDTC registration, or any specific license posture
      - - Public certifications and attestations
        - None disclosed in reviewed sources
        - Enterprise trust, procurement, and regulated-environment assurance
        - Publicly, the evidence supports engineering intent and controls-in-progress, not audited trust status
        - >-
          Material diligence item: request SOC 2 or ISO reports, customer security
          questionnaires, and any sector-specific approvals
    notes: This table intentionally separates evidence of controls being built from evidence of formal third-party assurance. Public sources support the former, not the latter.
