  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow / pain
      - Revel solution
      - Measurable public benefit
      - Limitation
    rows:
      - - Quick-turn benchtop and iterative R&D testing
        - Teams lose time wiring together homegrown scripts, bespoke telemetry displays, and expert-only stand-control logic
        - RevelTest plus RevelCode, real-time telemetry, dashboards, alerts, and historical reporting
        - Official materials say setups can move from days or weeks to hours and testing cadence can increase materially
        - Benefit data is strong but still mostly company-published rather than independently benchmarked
      - - Engine test stand modernization
        - Astro Mechanica relied on a homegrown control platform that created specialist dependency and slowed iteration
        - Revel replaced the existing platform, integrated with an in-house driver protocol, and let operators manage logic and dashboards directly
        - Astro case study says the stand was operational within one day and operators gained direct ownership
        - Single named case study; more customer references would strengthen confidence on repeatability
      - - Facility-wide industrial control
        - Control rooms still depend on older operator software, manual setup, and fragmented control layers
        - RevelC2, automated discovery, safe command execution, browser dashboards, and operator-centric control-room workflows
        - Homepage says manual setup is reduced and operations can begin quickly after hardware is connected
        - Named public deployments are thinner here than in the testing wedge
      - - Remote and embedded field deployment
        - Diverse customer hardware and edge environments make reproducible releases and fleet support difficult
        - Qualified x86 or ARM platforms, Linux real-time tuning, CI/CD, image signing, air-gapped support, and remote fleet delivery
        - Public roles show Revel is building reproducible deployment systems for fleets of remote and embedded devices
        - No public fleet size, patch cadence, rollback model, or MTBF data disclosed
      - - Pre-live validation before hazardous operation
        - Testing directly on live hardware increases risk and slows confident rollout
        - Simulation engine, HIL systems, qualification campaigns, runtime checks, and latency profiling
        - Public hiring shows validation is tied into CI and testing workflows rather than left to ad hoc manual checks
        - No public benchmark data on defect catch rate or validation coverage
    notes: The table emphasizes what the reviewed sources actually prove in the user workflow, not what an ideal future deployment might look like.
