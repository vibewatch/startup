  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / surface
      - Primary user
      - What it does
      - Evidence of maturity / status
      - Differentiation signal
      - Diligence gap
    rows:
      - - RevelTest
        - Test engineers, propulsion teams, hardware R&D programs
        - Design and run hardware tests, iterate on control logic, monitor telemetry, and operate stands from prototype through production test
        - Strongest public proof in the set; explicit product page support plus Impulse and Astro case evidence
        - Packages authoring, monitoring, and operational iteration into one workflow instead of a brittle internal toolchain
        - Request public or private evidence on supported protocols, pricing boundaries, and deployment repeatability across customers
      - - RevelC2
        - Control-room operators, facility engineers, industrial operations teams
        - Unified, facility-wide control for always-on critical operations with operator-centric interfaces
        - Clearly marketed on the homepage and in 2026 funding materials, but named production proof is thinner than for RevelTest
        - Extends the same software stack from test into live operations rather than selling a separate legacy HMI suite
        - Request named production deployments, uptime expectations, and operator-permission model details
      - - RevelCode
        - Test and controls engineers, operators authoring control logic
        - Python-inspired hardware control language with deterministic execution, runtime checks, and debuggability
        - Strong public evidence from homepage, launch post, Business Wire, SiliconANGLE, and compiler hiring
        - Makes hazardous-system control logic more approachable without giving up determinism and precision
        - Request public language docs, examples, and compatibility boundaries with existing codebases
      - - Dashboards and control interfaces
        - Operators, supervisors, product teams, customer stakeholders
        - Browser-based dashboards, live control surfaces, alerting, and human-facing command workflows
        - Supported by homepage copy, Astro proof, dashboard PM, design-systems, and frontend/full-stack hiring
        - Treats operator ownership and mission-critical UX as core product, not an afterthought
        - Request public screenshots, component library detail, and role-based access model documentation
      - - Telemetry, reports, and analytics
        - Reliability engineers, operators, program leads
        - Real-time telemetry, historical data retention, reports, log export, and external-tool streaming
        - Strong official proof plus backend hiring for high-cardinality telemetry, analytics, and reporting
        - Native data path from sensor to screen to historical analysis reduces context switching
        - Request retention policy, schema, integration catalogue, and storage-topology details
      - - Runtime, deployment, and hardware platform
        - Runtime engineers, embedded teams, deployment and field operations
        - High-performance runtime, device drivers, qualified hardware, CI/CD, fleet delivery, and security-hardened field systems
        - Strong hiring signal across embedded, Rust, hardware platform, DevOps, HIL, and solutions engineering
        - Vertical integration reaches all the way down to hardware qualification and field reliability
        - Request supported hardware list, rollback and recovery behavior, and real-world failure metrics
    notes: Public sources are sufficient to identify Revel’s major module surfaces and architectural assets, but not to verify every boundary between product packaging, contract terms, and deployment topology.
