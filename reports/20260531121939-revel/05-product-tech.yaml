  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Public role
      - Key dependency
      - Main risk / gap
    rows:
      - - Operator UI and dashboards
        - Browser-based command, monitoring, alerting, and human-facing decision support for mission-critical operations
        - Customer network access, high-quality frontend performance, and operator-centered design standards
        - Public marketing is strong, but public docs do not show permissions, audit trails, or offline behavior in detail
      - - RevelCode and compiler
        - Control-language authoring surface with deterministic execution goals, runtime checks, and debuggability
        - Specialized compiler infrastructure and compatibility with runtime layer
        - No public language reference, API docs, or migration guidance from legacy control code
      - - Runtime and embedded control layer
        - Executes control logic against real hardware with performance-sensitive, mathematically correct drivers
        - Linux tuning, real-time capabilities, device drivers, and qualified hardware
        - Field operating limits, supported protocol breadth, and recovery behavior are not publicly documented
      - - Telemetry ingestion, storage, and reporting
        - High-volume, high-frequency, high-cardinality data path for real-time visibility, reports, and analytics
        - Storage systems, querying, streaming pipelines, and partial shift toward cloud infrastructure
        - No public retention policy for product telemetry, schema examples, or benchmark numbers on scale and latency
      - - Simulation and HIL validation
        - Validates automation and operator control before live deployment and supports CI-based testing workflows
        - Simulation engine, physics models, HIL infrastructure, and integration with compiler and frontend teams
        - No public proof of coverage depth, model fidelity, or defect-detection rates
      - - Deployment and fleet operations
        - Reproducible build, release, rollout, and support workflows across customer sites and remote edge devices
        - CI/CD, infrastructure automation, solutions engineering, and customer-site deployment labor
        - No public SRE package, rollback policy, or upgrade process for disconnected installations
      - - Hardware platform and platform security
        - Approved compute and networking hardware, observability, secure boot chain, air-gapped support, and qualification campaigns
        - Vendor supply, Linux bring-up, firmware stability, and long-duration validation
        - Qualification exists in hiring language, but public matrices and pass/fail thresholds are undisclosed
    notes: Architecture detail is reconstructed from official product copy, investor posts, and highly specific role descriptions. That is enough to map the stack, but not enough to replace private architecture review.
