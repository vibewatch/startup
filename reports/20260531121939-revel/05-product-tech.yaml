  - id: trust-safety-security-and-compliance
    title: Trust, Safety, Security, and Compliance
    body: |-
      Publicly, Revel is stronger on intent and engineering posture than on formal trust proof. The positive evidence is concrete. The design-systems role ties the product to named HMI and accessibility standards intended for control-room use under stress, fatigue, and degraded conditions. Hardware-platform recruiting describes secure boot, TPM 2.0, disk encryption, image signing, and air-gapped environments. HIL, simulation, and qualification campaigns point to a culture that treats validation as part of release engineering rather than a box-check at the end. The privacy policy also confirms that Revel’s web and application surfaces handle account data, payment-service-provider workflows, device and usage logging, and Google Analytics, and that the company has published baseline statements about data protection and retention.

      The negative evidence is just as important. The reviewed official, partner, and news sources do not disclose SOC 2, ISO 27001, DO-178C compliance, another named certification, public uptime/SLA metrics, or incident history. Jobs referencing ITAR constraints and BIS’s export-control role make it reasonable to infer that some customer work is export-sensitive, but that is not the same thing as proving DDTC registration, product classification, or sector-specific approval. Investors should therefore interpret Revel’s public trust posture carefully: there is strong evidence that the company is building for hazardous and security-sensitive environments, and weak evidence that third parties have formally audited or certified those controls. That gap is material for diligence but not fatal; it simply means the next step must be a private security and compliance review rather than an assumption that the certifications already exist.
