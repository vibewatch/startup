  - CM039
  - CM040
callouts:
- calloutType: risk
  title: The biggest market risk is boundary inflation
  body: The available public datasets are large because they include broad automation, IIoT, equipment, and services categories. Revel still needs bottom-up evidence showing how much of that spend is reachable software budget rather than adjacent context.
  claimRefs:
  - CM018
  - CM039
  - CM040
- calloutType: insight
  title: Revel’s strongest wedge is workflow replacement, not category creation
  body: The clearest public proof comes from teams replacing homegrown or legacy control workflows where setup speed, operator ownership, and deterministic execution matter immediately. That is a more defensible adoption path than claiming the whole automation stack.
