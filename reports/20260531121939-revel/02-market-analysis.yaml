tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters
  rows:
  - - Revel core wedge
    - Runtime software for hardware test, telemetry, command, alerts, dashboards, logs, and control-language workflows
    - Underlying equipment, plant assets, and physical hardware programs themselves
    - Engineering, operations, and program owners buying control software
    - This is the direct product boundary Revel describes on its own site and in its Series B materials
  - - Industrial automation and control systems adjacency
    - SCADA, DCS, HMI, PLC-related control software, plant control infrastructure, and modernization budgets
    - Much of the category still includes hardware-heavy automation equipment and services
    - Plant engineers, controls teams, and facility operators
    - Grand View gives the most relevant published broad adjacency but it is still wider than Revel’s software-only layer
  - - Industrial IoT adjacency
    - Connected telemetry, analytics, software-defined production, predictive maintenance, and OT/IT data flows
    - Broader IIoT hardware, connectivity, and managed services unrelated to real-time control
    - Operations leaders, digital-transformation teams, and platform owners
    - Precedence captures the wider shift toward software-defined industrial systems but materially overstates direct fit
  - - Defense T&E / mission-control adjacency
    - Operational test workflows, software-defined mission systems, multi-agent orchestration, and audit-friendly control layers
    - Weapons platforms, munitions, and non-software procurement categories
    - Program managers, integrators, and defense operators
    - Revel’s defense framing is better understood as control/orchestration software inside modernization budgets
  - - Incumbent commercial substitute stack
    - LabVIEW, TwinCAT, Ignition, FactoryTalk, Simulink, and similar engineering-control suites
    - Generic office software and undifferentiated enterprise SaaS
    - Controls, validation, and automation teams already running established tools
    - These products define the practical comparison set and switching-cost barrier
  - - Status-quo in-house tooling
    - Homegrown scripts, bespoke test stands, custom dashboards, and one-off control apps
    - External packaged suites not yet adopted
    - Technical leads who built internal tools plus the manager absorbing fragility
    - Astro Mechanica shows this remains a real starting point for early adopters
  notes: Boundary rows separate broad adjacent market context from Revel’s direct software wedge. Included and excluded spend are analytical classifications based on official product pages, customer proof, and public market-report scope descriptions.
