- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  - Relevance to Revel
  rows:
  - - New-space / propulsion R&D
    - VP Engineering, head of test, or program lead
    - Test engineers, controls engineers, operators
    - Engineering or program budget
    - Bring up a stand, run iterative hardware tests, analyze telemetry
    - Replace homegrown tooling and cut setup time
    - Matches Impulse, Astro Mechanica, and other propulsion-heavy reference workflows
  - - Advanced energy / critical infrastructure
    - Operations or engineering leadership
    - Operators, reliability engineers, control-room staff
    - Program, facility, or infrastructure budget
    - Move from bench validation into monitored live operations
    - Need always-on telemetry, alarms, and centralized control
    - Fits Radiant-style 24/7 monitoring and high-consequence uptime needs
  - - Defense modernization / OTA prototype programs
    - Program manager, integrator lead, or government sponsor
    - Systems engineers, mission operators, autonomy teams
    - RDT&E, prototype, or mission-system budget
    - Rapid prototyping, integration, test, and operational rehearsal
    - Need faster iteration plus auditable, software-defined control
    - Maps to OTA-heavy defense programs and mission-autonomy stacks
  - - Industrial facility modernization
    - Plant manager, controls lead, or operations excellence owner
    - Plant engineers and control-room staff
    - Operations or capex modernization budget
    - Retrofit legacy HMI/SCADA/control workflows
    - Need better visibility, easier configuration, and less brittle integration
    - This is the broadest commercial expansion path but also the most incumbent-dense
  - - Mission autonomy / multi-agent systems
    - Defense or autonomy product leadership
    - Mission planners and autonomy engineers
    - Program or product budget
    - Coordinate heterogeneous machines in contested environments
    - Need interoperable orchestration, guardrails, and operator-facing control
    - Competes most directly with the defense-software adjacency described by Applied, Shield, and Palantir
  notes: Buyer roles are inferred from public customer workflows, official defense-software pages, and the FY2026 OTE budget context. Public sources rarely disclose exact internal budget codes, so budget-owner labels remain directional.
