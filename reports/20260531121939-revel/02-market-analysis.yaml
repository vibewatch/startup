- id: sizing-lenses-and-broad-market-overstatement
  title: Sizing Lenses and Broad-Market Overstatement Risk
  body: |-
    Public market data supports a large backdrop, but only as layered context. Grand View sizes industrial automation and control systems at $226.8 billion in 2025, $250.3 billion in 2026, and $504.4 billion by 2033 at a 10.5% CAGR. Precedence sizes the broader industrial IoT market at $514.39 billion in 2025, $602.87 billion in 2026, and $2.43 trillion by 2035 at a 16.8% CAGR. Read together, those reports show that software-defined control, telemetry, and industrial connectivity are growing inside very large markets. They do not prove that Revel can capture those totals.

    The adverse interpretation is essential: both published categories still overstate Revel’s true addressable spend. Grand View’s category includes substantial hardware and full automation-system revenue, while Precedence’s IIoT frame is even broader because it includes connectivity, services, and multiple endpoint classes. No reviewed source isolates a clean global market for software-only hardware test and control across aerospace, advanced energy, industrial facilities, and defense mission systems. The right analytical move is therefore to use the published estimates as low/high outer bounds for adjacent market context, then narrow with customer workflow evidence, incumbent replacement logic, and budget-owner analysis. That preserves uncertainty instead of hiding it behind a single headline TAM.
