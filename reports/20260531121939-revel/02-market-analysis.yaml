  evidenceGaps:
  - type: missing-source
    severity: material
    topic: software-only-sam
    missingEvidence: A credible public or paid dataset isolating software-only spend for hardware test and control across aerospace, advanced energy, industrial control, and defense mission systems.
    whyItMatters: Without a software-only category, published automation and IIoT figures are only contextual envelopes and can materially overstate direct addressable spend.
    diligencePath: Ask management for bottom-up pipeline segmentation by use case and incumbent replaced, then benchmark against paid market maps for control software, SCADA/HMI, and mission-software budgets.
    relatedQuestionRefs:
    - QM006
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner-splits
    missingEvidence: Program-level evidence showing whether initial purchases come from engineering, operations, capex modernization, or defense RDT&E budgets in real customer accounts.
    whyItMatters: Knowing the real budget owner is necessary to estimate sales-cycle length, land-and-expand feasibility, and realistic near-term SOM.
    diligencePath: Collect closed-won deal data and reference-account procurement paths, including approval chains, budget codes, and who signed the first contract.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: export-classification-specifics
    missingEvidence: Product-level export classification, jurisdiction, and customer-by-customer restrictions for Revel modules used in defense-adjacent or dual-use deployments.
    whyItMatters: Export and compliance burdens can change which customers are reachable, how fast deals close, and whether international expansion is practical.
    diligencePath: Request formal trade-compliance analysis, ECCN or jurisdiction determinations, and any existing customer restrictions tied to defense or dual-use deployments.
    relatedQuestionRefs:
    - QM024
