- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Revel
  - Diligence ask
  rows:
  - - Smart manufacturing and predictive maintenance
    - Positive
    - Current to multi-year
    - Supports more software-defined control, telemetry, and analytics budgets
    - Quantify which portions of target accounts are runtime-control spend versus broader digital-transformation spend
  - - IIoT and OT/IT convergence
    - Positive
    - Current to multi-year
    - Makes unified data plus control workflows more valuable
    - Test whether Revel can coexist with existing data and SCADA layers rather than replace them entirely
  - - Defense modernization and rapid prototyping
    - Positive
    - 2026 onward
    - Creates demand for faster integration, test, and mission-control software
    - Identify which program offices and integrators can buy software quickly versus through long prime-led cycles
  - - Homegrown-tool replacement
    - Positive
    - Near term
    - Creates a sharp wedge where operator ownership and faster setup matter immediately
    - Collect more before/after deployment metrics like Astro Mechanica and Impulse
  - - Entrenched incumbent suites
    - Negative
    - Persistent
    - Raises switching costs because buyers already use integrated engineering and runtime stacks
    - Build win-loss data versus LabVIEW, TwinCAT, Ignition, FactoryTalk, and model-based tooling
  - - Certification, assurance, and auditability requirements
    - Negative
    - Persistent
    - Increases validation burden in aerospace, defense, and other safety-critical environments
    - Clarify which modules need formal assurance evidence and what proof package customers demand
  - - Export-control and dual-use compliance
    - Negative
    - Persistent
    - Can slow or restrict certain deployments and partnerships
    - Obtain product-level export classification and jurisdiction analysis
  - - Long qualification and procurement cycles
    - Negative
    - Persistent
    - Pushes revenue realization later than pilot enthusiasm suggests
    - Measure deal-cycle length separately for commercial, advanced-energy, and defense buyers
  - - Broad-TAM overstatement risk
    - Negative / adverse
    - Current analytical risk
    - Can distort valuation if investors mistake adjacency for direct spend
    - Keep SAM/SOM framed as approximate until software-budget evidence is stronger
  notes: This table mixes macro growth drivers with adoption constraints. Timing labels describe likely decision cadence, not guaranteed commercialization speed.
