- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Revel’s likely purchase path starts with a painful test or control bottleneck and expands only after trust is established.
  data:
    nodes:
    - id: pain
      label: Acute workflow pain
      detail: A team is slowed by homegrown tooling, brittle control code, or slow stand/facility setup.
    - id: pilot
      label: Pilot on one hardware workflow
      detail: Revel lands on a test stand, prototype program, or critical facility use case rather than enterprise-wide rollout.
    - id: prove
      label: Prove deterministic control and operator leverage
      detail: The buyer validates telemetry visibility, alerting, safety checks, and faster iteration.
    - id: expand
      label: Expand to broader operational scope
      detail: Successful pilots broaden into additional stands, facilities, or mission-control workflows.
    - id: govern
      label: Clear assurance and governance hurdles
      detail: The vendor must satisfy auditability, certification, security, and procurement expectations.
    - id: standardize
      label: Standardize as control layer
      detail: Only then can the software become part of an enduring plant, fleet, or mission-system stack.
    edges:
    - from: pain
      to: pilot
      label: wedge
    - from: pilot
      to: prove
      label: validation
    - from: prove
      to: expand
      label: scale
    - from: expand
      to: govern
      label: institutionalize
    - from: govern
      to: standardize
      label: trusted adoption
  approximationNotes: The sequence is derived from public customer narratives, defense-software product positioning, and mission-critical procurement logic; it is not a company-disclosed pipeline funnel.
