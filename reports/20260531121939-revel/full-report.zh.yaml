      - number: '7.2'
        title: 部署、可靠性与安全执行风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Revel 更像一家高后果系统公司，而不是轻量 SaaS 供应商。公开招聘显示，公司要做客户现场部署、远程和嵌入式机队、合格 x86 和 ARM 硬件、空气隔离安全控制、HIL
              支撑的验证，以及正向云系统扩展的高频遥测管线。这些投入都合理，但放在一起意味着不小的执行负担。公司试图在延迟、安全、uptime
              和操作员信任都很关键的环境里，交付基于浏览器的控制平面、确定性运行时行为、告警和遥测可见性。任何一层表现不达标，后果都不只是支持工单；它可能导致测试延误、部署停滞，或关键任务工作流中的信任流失。


              最重要的细节是，正向证据并不消除规模化风险。Astro Mechanica 案例研究很亮眼，因为 Revel
              据称替换了自研栈，并在一天内搭起试车台；但它也说明部署仍涉及客户专属协议和集成工作。解决方案工程师岗位把现场部署直接接到产品反馈，进一步说明这一点。硬件平台岗位同样透露很多：鉴定、老化测试、重新验证、安全启动、TPM
              和供应商生命周期管理都是可见职责。再加上公开事实——评审时 revel.build 无法访问——整体图景是一家公司认真做基础设施，但在拓宽产品界面时，仍容易受到执行滑坡和基础卫生缺口的影响。
