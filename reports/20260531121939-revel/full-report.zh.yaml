  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 竞争对手
      - 公开价格 / 合同模式
      - 包含能力
      - 未知项 / 折扣
      - 影响
    rows:
      - - Revel
        - 公开标价或套餐层级未知
        - RevelTest 和 RevelC2 的定位覆盖硬件测试、遥测、指挥和持续运营
        - 合同期限、席位模型、部署定价和折扣未知
        - 买方需要直接接触销售，因此很难和定价透明的既有厂商做简单基准比较
      - - NI / LabVIEW
        - >-
          Base 版 $560/year 或 $1,959 永久许可；Full 版 $1,731/year 或 $6,057 永久许可；Professional 版 $2,750/year 或 $9,625
          永久许可；LabVIEW+ Suite $4,155/year 或 $14,543 永久许可；部署许可证按目标计算机计费
        - Base 提供测试与控制环境，更高层级增加 AI、构建器、报告和数据库工具；完整套件再加入 TestStand、 FlexLogger、InstrumentStudio 和 DIAdem
        - 企业折扣和实际席位经济性未知
        - 公开标价便于直接比预算，但部署和套件扩展会很快推高总成本
      - - Beckhoff TwinCAT
        - 工程环境免费；运行时和功能许可证按平台等级与选项付费
        - PLC 工程、实时运行时、HMI、测量、视觉和连接模块
        - 具体运行时价格主要按硬件配置和功能组合报价
        - 开发入门摩擦低，但存量场景的运行时经济性取决于硬件规模
      - - Ignition
        - Standard 和 Edge 按服务器一次性购买永久许可证；Cloud Edition 按用量计费；支持计划按层级每年收取零售价的 16%、20% 或 24%
        - 在所选服务器许可证范围内，标签、用户、设计器、设备、模块和 Web 客户端不限量
        - 获取文本未显示套件标价和谈判后的企业折扣；冗余部署会增加额外许可证成本
        - 标签和用户数量大的场景经济性明显更好，一旦采用，服务器标准化会形成很强黏性
      - - Rockwell Optix / Design Studio
        - 运行时按能力授权，另有免费 90 天 Optix Studio Pro 试用和免费 Studio Standard 下载；采购通常走销售或订购指南
        - HMI、IIoT、边缘运行时、云端设计、AI 规划与构建流程、远程部署、控制器集成
        - 生产运行时价格、订阅组合和套装折扣未知
        - 采购优势往往来自既有控制器和服务关系，而不是透明标价
      - - Siemens WinCC Unified
        - 已审阅来源中没有公开标价
        - 面板、边缘和 PC HMI 或 SCADA、API、Web 客户端、协议集成
        - 许可证层级、服务定价和企业折扣未知
        - 已经在 Siemens 体系内的买方，很可能把它放进更大的项目报价里采购，而不是拿单一 SKU 做基准比较
      - - Keysight PathWave Test Automation
        - 需要许可证；可免费使用社区许可证，但不含支持或担保
        - 测试自动化编辑器、包管理器、结果查看器、时序分析器、Linux 支持
        - 商业企业定价和支持打包方式未知
        - 说明除 LabVIEW 外仍有现代测试自动化替代方案，但不拿到报价，经济性仍不透明
      - - MathWorks / Simulink
        - 已审阅来源以联系销售 / 试用为主
        - 仿真、基于模型的设计、HIL、代码生成、贴合认证的工作流
        - 附加工具箱价格和实际企业折扣未知
        - 工程工作流选择很强，但无法与运行时控制价格做透明的一一比较
      - - Palantir / Shield / Applied
        - 以演示或报价为主；已审阅来源未见公开标价
        - 国防 AI、自主系统中间件、任务控制、集成、治理、人机协同
        - 合同结构、部署基础和服务组合未知
        - 这些技术栈卖的是项目预算和能力楔子，而不是 SKU 级商品化定价
    notes: 本表只记录有直接证据支持的公开定价或打包方式。标为「未知」的单元格有意保留证据缺口，不用记忆或经销商说法补全。
