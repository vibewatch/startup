      - number: '4.4'
        title: 资本充足性、估值注意事项和财务运营透明度
        blocks:
          - type: paragraph
            body: >-
              Revel 公开资本基础相对它披露的财务细节来说异常庞大。公司 2025 年 4 月发布文章称，它已经完成种子轮和 Series A 融资合计 $30 million，其中包括由 Thrive 领投的 $23.1
              million Series A 轮。2026 年 2 月，Revel 及其联合发布伙伴披露了由 Index Ventures 领投的 $150 million Series B
              轮。这形成了一个可清晰支持的公开口径：已披露股权融资合计 $180 million。官方 Series B
              材料称，资金将用于团队扩张、产品开发和更广泛市场部署，这与已抓取岗位集中可见的工程和商业招聘扩张方向一致。


              公开记录没有披露的内容至少同样重要。没有已审阅来源给出当前现金、月烧钱速度、现金跑道、债务或项目融资义务。官方材料也没有公布精确投后估值；已抓取集合中唯一精确数字是 Sourcery 的第三方报道，大约
              $1.005 billion，应视为报道而非确认。财务职能透明度也很薄。一个来自登记信息的加州备案页面列出 Scott Morton 同时担任 CEO、CFO 和
              Secretary，这可能只是早期公司设置，但没有显示单独披露的财务团队。结合破损的 revel.build 域名和其他同样薄的公开运营披露，信号很清楚：Revel
              已经融到足够资本来买时间和抱负，但公开透明度不足以让人有信心地建模资本充足性。
