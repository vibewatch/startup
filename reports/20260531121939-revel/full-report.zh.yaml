  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 现有工作流 / 痛点
      - Revel 方案
      - 可量化公开收益
      - 局限
    rows:
      - - 快速周转的实验台和迭代式研发测试
        - 团队把自研脚本、定制遥测显示和只有专家能维护的测试台控制逻辑拼在一起，耗掉大量时间
        - RevelTest 搭配 RevelCode、实时遥测、仪表盘、告警和历史报告
        - 官方材料称，搭建周期可从数天或数周缩到数小时，测试节奏也能明显提升
        - 收益数据很强，但仍主要来自公司发布，缺少独立基准
      - - 发动机测试台现代化
        - Astro Mechanica 依赖自研控制平台，造成专家依赖，也拖慢迭代
        - Revel 替换了既有平台，接入内部驱动协议，并让操作员直接管理逻辑和仪表盘
        - Astro 案例研究称，测试台一天内投入运行，操作员拿到直接主导权
        - 目前只有一个具名案例研究；更多客户引用会提高对可复制性的信心
      - - 全设施工业控制
        - 控制室仍依赖老旧操作员软件、手工设置和碎片化控制层
        - RevelC2、自动发现、安全指令执行、浏览器仪表盘和以操作员为中心的控制室工作流
        - 官网称，手工设置减少，硬件连接后很快就能开始运行
        - 这里的具名公开部署少于测试切入点
      - - 远程和嵌入式现场部署
        - 客户硬件和边缘环境差异大，可复现发布和机群支持变得困难
        - 合格的 x86 或 ARM 平台、Linux 实时调优、CI/CD、镜像签名、气隙隔离支持和远程机群交付
        - 公开岗位显示，Revel 正在为远程和嵌入式设备机群建设可复现部署系统
        - 未披露公开机群规模、补丁节奏、回滚模型或 MTBF 数据
      - - 危险操作上线前验证
        - 直接在真实硬件上测试会抬高风险，也拖慢有把握的上线
        - 仿真引擎、HIL 系统、资质认证活动、运行时检查和延迟剖析
        - 公开招聘显示，验证已接入 CI 和测试工作流，而不是临时人工检查
        - 未公开缺陷捕获率或验证覆盖率的基准数据
    notes: 该表强调审阅来源在用户工作流中实际证明了什么，而不是理想未来部署可能是什么样。
