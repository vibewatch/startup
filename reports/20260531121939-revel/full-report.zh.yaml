        - 控制语言编写界面，目标是确定性执行、运行时检查和可调试性
        - 专门的编译器基础设施，以及与运行时层的兼容性
        - 没有公开语言参考、API 文档，也没有从遗留控制代码迁移的指南
      - - 运行时和嵌入式控制层
        - 在真实硬件上执行控制逻辑，依赖性能敏感、数学正确的驱动
        - Linux 调优、实时能力、设备驱动和合格硬件
        - 现场运行边界、支持协议广度和恢复行为没有公开文档
      - - 遥测摄取、存储和报告
        - 面向实时可见性、报告和分析的大容量、高频、高基数数据链路
        - 存储系统、查询、流式管道，以及向云基础设施的部分迁移
        - 没有公开产品遥测留存政策、schema 示例，也没有规模和延迟基准数据
      - - 仿真和 HIL 验证
        - 在真实部署前验证自动化和操作员控制，并支持基于 CI 的测试工作流
        - 仿真引擎、物理模型、HIL 基础设施，以及与编译器和前端团队的集成
        - 没有覆盖深度、模型保真度或缺陷检测率的公开证明
      - - 部署和机群运营
        - 跨客户现场和远程边缘设备，跑通可复现构建、发布、上线和支持工作流
        - CI/CD、基础设施自动化、解决方案工程和客户现场部署人力
        - 没有公开 SRE 包、回滚政策或离线安装升级流程
      - - 硬件平台和平台安全
        - 获批计算与网络硬件、可观测性、安全启动链、气隙隔离支持和认证活动
        - 供应商供货、Linux 启动适配、固件稳定性和长周期验证
