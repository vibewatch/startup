      - CR021
      - CR024
      - CR029
      - CR030
      - CR035
      - CR038
      - CR039
      - CR044
      - CR046
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从品类证明和客户证明出发，穿过披露缺口和可比公司背景，走到「继续研究」 的建议。
    data:
      nodes:
        - id: n1
          label: 品类证明
          detail: 面向硬件测试与控制的统一软件层
          type: input
        - id: n2
          label: 客户证明
          detail: 首个客户、案例研究、数十个部署
          type: input
        - id: n3
          label: 融资支撑
          detail: 截至 Series B 轮披露融资 $180M
          type: input
        - id: n4
          label: 披露缺口
          detail: 未公开收入、利润率、集中度或优先权结构
          type: risk
        - id: n5
          label: 可比上限
          detail: Palantir / Shield / Anduril / NI 显示市场有胃口，不证明可迁移
          type: risk
        - id: n6
          label: 公司质量
          detail: 看起来足够强，值得深挖
          type: intermediate
        - id: n7
          label: 价格支撑
          detail: 媒体报道轮次未获得公开独立验证
          type: intermediate
        - id: n8
          label: 继续研究
          detail: 留在流程中，但不要追媒体报道价格
          type: output
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n7
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n8
        - from: n7
          to: n8
    claimRefs:
      - CV001
      - CV005
      - CV015
      - CV029
      - CV030
      - CV031
      - CV035
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 会改变当前估值公开支撑力度的最大变量及相对影响。
    data:
      items:
        - label: ARR / 队列披露
          value: 5
        - label: 毛利率 / 服务收入占比
          value: 5
        - label: 优先权结构清晰度
          value: 4
        - label: 客户集中度 / 续约
          value: 4
        - label: 持续在线控制的安全准备度
          value: 3
        - label: 板块倍数压缩
          value: 3
    approximationNotes: 刻度是对估值支撑影响的 1–5 定性评分，不是美元敏感性模型，因为公开 来源没有披露建模所需输入。
    claimRefs:
      - CV015
      - CV018
      - CV020
      - CV026
      - CV029
      - CV038
      - CV044
      - CV045
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 方向性估值支撑区间，而非精确建模回报。
    data:
      items:
        - label: 测算用估值区间（USD M）
          low: 400
          mid: 1005
          high: 2500
        - label: 后续轮次方向评分（0=下行，1=持平，2=上行）
          low: 0
          mid: 1
          high: 2
        - label: 公开资料尽调信心（1-5）
          low: 1
          mid: 2
          high: 4
    approximationNotes: 中点采用第三方报道的 Series B 轮估值；低、高边界是方向性情景锚点， 不是精确回报预测。
    claimRefs:
      - CV014
      - CV037
      - CV040
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 按投委会口径，对当前公开证据集做 1–5 分评分。
    data:
      items:
        - label: 市场痛点 / 紧迫性
          value: 4
          detail: 高后果硬件团队看起来确有工作流痛点
        - label: 产品证明
          value: 4
          detail: 有具名用例和部署证据
        - label: 客户证明
          value: 4
          detail: 首个客户、案例研究和“数十个部署”的表述
        - label: 经济性披露
          value: 1
          detail: 收入、利润率和留存未公开
        - label: 估值支撑
          value: 2
          detail: 有媒体报道估值，但官方支撑薄
        - label: 融资强度
          value: 4
          detail: 披露融资 $180M，显示市场支持较强
        - label: 退出准备度
          value: 2
          detail: 按当前披露，战略并购比 IPO 更可信
    approximationNotes: 评分只反映公开证据，不能替代一手尽调。
    claimRefs:
      - CV005
      - CV031
      - CV034
      - CV036
      - CV043
      - CV049
      - CV050
