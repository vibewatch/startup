      - number: '2.4'
        title: 增长驱动、约束和剩余缺口
        blocks:
          - type: paragraph
            body: >-
              这个市场的乐观逻辑很直接。Grand View 把自动化增长与智能制造、预测性维护、云 SCADA、数字孪生、AI 赋能自动化和实时流程可见性联系起来。Precedence 描述的 IIoT
              增长来自机器间通信、软件定义生产、低成本感知、AI 诊断和 OT/IT 融合。在国防侧，BVP 和 NSTXL 都描述了 2026
              年采购现代化、快速原型、AI、自主、网络安全和更多软件定义系统带来的动能。SIPRI、DOT&E 年报节奏，以及 FY2026 Operational Test and Evaluation
              预算申请，都进一步说明国防现代化和测试基础设施仍是有资金支持的制度性项目，而非一次性实验。


              约束同样实质。买方已经在用根深蒂固的技术栈，例如 LabVIEW、TwinCAT、Ignition、FactoryTalk 和基于模型的工程工具；这些工具把工程、运行时、分析和 HMI
              功能组合在一起。关键任务部署还面临可审计性、认证和合规负担：RTCA 的 DO-178C 生态凸显正式软件保证要求，Palantir 强调国防 AI 的审计轨迹和护栏，BIS
              维护先进技术出口管制基础设施。因此，核心未解问题不是广义相邻领域是否足够大，而是在后果严重的项目中，究竟有多少预算真的可由外部供应商拿走，用来替换既有或内部控制软件。
