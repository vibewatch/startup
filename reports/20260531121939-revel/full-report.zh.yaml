              对一家如此年轻的公司来说，Revel 已经有异常具体的公开运营证据，尽管它没有披露收入或客户数。脱离隐身公告把 Impulse Space 列为首个客户，并称软件已经部署在一处发动机测试设施。到 2026 年 2
