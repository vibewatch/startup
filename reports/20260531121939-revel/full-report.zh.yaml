      - number: '5.2'
        title: 架构和运营模型
        blocks:
          - type: paragraph
            body: >-
              已抓取集合支持的是分层架构，而不是含混的“面向硬件的 AI”叙事。官方产品文案和投资人文章勾勒出同一套核心栈：最上层是基于浏览器的操作员界面；中间是用于编写控制逻辑的 RevelCode
              和编译器基础设施；底层是高性能运行时，确定性执行这些逻辑；另有遥测 / 报告层，提供实时可见性和历史分析。工程招聘组合显著强化了这幅图。编译器招聘显示有专门编译器子系统。嵌入式和 Rust
              运行时岗位显示，执行层对性能敏感，负责把软件连接到工业机器和实时能力。后端招聘描述高频、高基数遥测管线、数据存储和查询，以及从本地部署逐步转向更多云基础设施。仿真和 HIL
              岗位显示，验证正在成为产品和发布系统的一部分，而不是事后补丁。


              同样重要的是，产品似乎刻意对操作员界面有鲜明取舍。全栈、早期职业软件、产品经理和设计系统岗位都强化了一个判断：Revel 想要浏览器原生、数据密集、面向关键任务的界面，而不只是本地工程控制台。设计系统语言提到
              ISA-101、NUREG-0700、WCAG 和 NASA-STD-3001，尤其值得注意，因为这意味着公司把人为因素视为危险环境核心架构的一部分，而不只是 UI
              打磨。合在一起看，运营模型像一个垂直整合控制栈：边缘侧是客户硬件和协议，下层是认证计算和 Linux 运行时，数据平面承载遥测和报告，顶层则是用于编写、监控和实时运营的协作式浏览器界面。
