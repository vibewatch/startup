  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: compact
    summary: 竞争耐久性在替换自研工具这一切入点上最强；既有厂商或相邻防务平台已经掌握项目信任的地方最弱。
    approximationNotes: 该图混合了近似计数指标和定性就绪度标签，因为公开竞争证据在包装机制和切入点匹配上较强，但对已实现胜率数据披露很弱。
