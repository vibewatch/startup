      - number: '1.2'
        title: 创始人与市场契合度、团队履历和治理透明度
        blocks:
          - type: paragraph
            body: >-
              Scott Morton 是 Revel 故事中的核心公开人物，公开记录显示，他做这款产品的创始人与市场契合度异常强。Fortune、Index Ventures、Redpoint 和 Felicis
              都把叙事锚定在 Morton 于 SpaceX 超过 9 年的经历：他曾构建并运营 Falcon 和 Starship 环境中的控制软件，在那里一行错误代码就可能造成灾难性故障。Revel
              官方材料把这条履历扩展到来自 SpaceX、Anduril 和 Palantir 的更广泛工程团队，支撑了团队理解实时、关键任务系统的说法，而不是把硬件控制当作通用 SaaS 来做。公开治理披露薄得多。2026
              年 2 月 Series B 公告称 Index 合伙人 Nina Achadjian 加入董事会，但公司没有在官网公布完整董事名单、独立董事名单或更宽的高管梯队。这种不对称让创始人依赖成为实质问题：Morton
              同时是公开门面、技术可信度锚点，也是已抓取来源集中最清晰具名的高管。
