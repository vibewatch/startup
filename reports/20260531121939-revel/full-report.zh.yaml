        - from: pilot
          to: prove
          label: 验证
        - from: prove
          to: expand
          label: 扩张
        - from: expand
          to: govern
          label: 制度化
        - from: govern
          to: standardize
          label: 建立信任后采用
    approximationNotes: 这一顺序来自公开客户叙事、防务软件产品定位和任务关键采购逻辑；它不是公司披露的管线漏斗。
