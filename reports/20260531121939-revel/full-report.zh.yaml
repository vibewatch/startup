  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与保证风险
        blocks:
          - type: paragraph
            body: >-
              最高严重度风险在于，Revel 越来越把自己呈现为防务、能源和工业控制基础设施，但公开证据中还没有同等成熟的合规与保证体系。公司页面和 Series B
              叙事把范围从测试软件推进到关键系统的指挥控制用例，同时一则公开招聘带有美国出口监管 / ITAR 风格的资格语言。这个组合不能证明当前存在违规，但意味着投资人应假定监管边界比常规 devtools
              故事更宽。相关失效模式不是戏剧性的公开事故，而是更慢、更安静的摩擦：客户安全审查、出口管制问题、外籍员工用工限制，以及受监管账户中被拉长的采购周期。


              隐私和安全义务构成第二层。Revel 的隐私政策覆盖账户、设备、使用、职业信息，以及可能的支付信息，因此公司不只是销售运营软件；它也持有可能触发消费者和商业安全责任的数据。CISA、NIST、California
              Attorney General 和 FTC 的美国公开指南把门槛说得很清楚：默认安全设计、日志、访问控制、事故预案和隐私权响应流程都重要。缺口在于，已审阅公开材料没有披露 SOC 2、ISO 27001 或
              IEC 62443 等具名第三方保证里程碑，而公开诉讼 / 执法记录只能从开放来源中部分获知。已审阅来源中没有发现公开诉讼或执法行动，但这应被当作一条尽调路径，而不是法律风险已清零。
