      - 公开作用
      - 关键依赖
      - 主要风险 / 缺口
    rows:
      - - 操作员 UI 和仪表盘
        - 为任务关键型操作提供基于浏览器的指挥、监控、告警和面向人的决策支持
        - 客户网络访问、高质量前端性能和以操作员为中心的设计标准
        - 公开营销很强，但公开文档没有详细说明权限、审计轨迹或离线行为
