              的客户背书方向上都偏正面。这些信号有用，但还拼不出留存框架。已审阅来源没有披露客户数、NRR、GRR、流失、队列留存、合同期限、续约日期或具体客户扩张 ARR。


              这意味着，客户章节不能仅凭公开证据提出强耐久性主张。正确解读应更窄：Revel
              有多项可信迹象显示早期客户满意度不错，也至少有一个公开的试点转客户声明，但续约机制、合同条款和扩张经济性仍是私密信息。投资人应在这里克制，不要从客户背书过度外推。少数强故事可以证明产品价值；单靠它们，还不能证明经常性收入耐久或低流失。
