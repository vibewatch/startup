            body: >-
              公开证据在具名账户之间分布并不均匀。Impulse Space 是最强的一行，因为部署地点、运营用途和规模化实例数都可见。Astro Mechanica
              次之：证据由公司控制，但细节少见地具体，包含具名高管，并描述了替换自研系统、现场试车台运行和操作员编写自动化。这两个账户足以支持一个结论：Revel 已经越过 PPT 阶段，进入真实硬件项目。


              Radiant Nuclear 和 Gravitics 可信，但证据更薄。Radiant 有客户背书和独立具名，但没有公开安装细节。Gravitics 拿出了 Impulse
              之外最好的单项量化结果，却没有第三方部署确认。Orbital Operations
              只能弱支撑：官网背书显示双方有某种关系，但没有告诉投资人这个账户是试点、生产部署、参考客户，还是只是一句友好评价。结果是，本章确实有具名证据，但前两个账户之后证据质量明显下降，还不足以回答客户广度、阶段组合或独立印证等尽调问题。
