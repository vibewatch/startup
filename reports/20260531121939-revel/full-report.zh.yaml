      - number: '2.2'
        title: 规模测算视角和大市场夸大风险
        blocks:
          - type: paragraph
            body: >-
              公开市场数据支持一个大背景，但只能作为分层语境。Grand View 估算工业自动化与控制系统市场在 2025 年为 $226.8 billion，2026 年为 $250.3 billion，到 2033
              年达到 $504.4 billion，复合年增长率 10.5%。Precedence 估算更宽的工业 IoT 市场在 2025 年为 $514.39 billion，2026 年为 $602.87
              billion，到 2035 年达到 $2.43 trillion，复合年增长率 16.8%。合在一起看，这些报告说明，软件定义控制、遥测和工业连接正在非常大的市场中增长；但它们并不能证明 Revel
              能捕获这些总量。


              反向解读必须保留：两个公开类别都仍然高估了 Revel 真正可触达的支出。Grand View 的类别包含大量硬件和完整自动化系统收入，而 Precedence 的 IIoT
              框架更宽，因为它纳入连接、服务和多类端点。没有已审阅来源单独切出一个干净的全球市场，专门对应跨航空航天、先进能源、工业设施和国防任务系统的软件型硬件测试与控制。正确的分析动作，是把公开估算作为相邻市场语境的低 /
              高外层边界，再用客户工作流证据、既有方案替换逻辑和预算负责人分析向内收窄。这样能保留不确定性，而不是把它藏在一个单一醒目的 TAM 后面。
