  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价界面和披露边界
        blocks:
          - type: paragraph
            body: >-
              Revel 明显像一家软件公司，但公开记录没有给投资人正常的软件指标。官方产品页面展示了一个统一平台，横跨硬件开发、测试、部署、遥测和从原型到量产的持续控制。官网列出两个产品界面——用于硬件测试的
              RevelTest 和用于工业运营的 RevelC2——这足以支撑一个产品驱动的收入地图，尽管没有任何页面披露合同是按站点、席位、设备、部署还是年度平台承诺定价。演示页面进一步说明，Revel
              通过销售沟通售卖，而不是发布价目表：行动号召是申请演示，证明点是更快的测试吞吐，而不是自助上手或透明 SKU 定价。


              这种不透明很重要。Revel 隐私政策显示，公司预计服务栈中存在账户和支付信息，这支持其存在付费软件关系，但没有揭示计费机制。公开证据只能支持一个受限结论：Revel
              几乎肯定在围绕测试和指挥控制工作流变现软件，收入很可能与部署和扩张绑定；但实际定价、ACV、续约结构，以及软件与服务收入组合仍未披露。本章刻意不靠记忆或可比公司回填缺失数字。公开层面，商业模式看得懂；定价模型看不清。
