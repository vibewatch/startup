        - 识别哪些项目办公室和集成商能快速采购软件，哪些仍要走主承包商主导的长周期
      - - 自研工具替换
        - 正向
        - 近期
        - 在操作员掌控和快速搭建马上见效的场景中形成清晰切入口
        - 收集更多类似 Astro Mechanica 和 Impulse 的部署前后指标
