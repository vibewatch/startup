      - number: '8.2'
        title: 当前融资背景与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              Revel 披露的融资历史很清楚，尽管估值并不清楚。公司公开披露，到 2025 年 4 月种子轮和 Series A 合计 $30 million，随后在 2026 年 2 月完成 $150 million
              Series B，披露股权融资合计 $180
              million。官方材料称最新一轮融资用于团队扩张、产品开发和更广泛的市场部署。它们没说的同样重要：已审阅材料中没有任何官方来源给出准确投后估值、普通股稀释、清算优先权堆叠或其他决定标题估值是否能代表普通股价值的条款。


              这个缺口迫使估值工作更多依赖方向性先例，而不是直接套用。Palantir 说明防务邻近软件可以拿到极高公开市场倍数，但 BVP 关于约 65x NTM 收入的观察，建立在 Revel
              尚未公开匹配的超高速增长和公开流动性之上。Emerson 以 $8.2 billion 收购 NI 在战略上相关，因为它证明工业买家重视软件连接的测试系统；但 NI 带来的是 $1.66 billion
              收入、35,000 个客户，以及成熟得多的软件加硬件版图。Shield AI 和 Anduril 证明，2026
              年私人防务软件资本仍然充沛；但两轮融资都建立在更广平台、更多已披露规模，或结构化融资之上，导致其标题估值并不是完美参照。


              正确的 read-through 不是 Revel 因关联就配得上这些估值，而是市场只有在规模、增长耐久性或战略稀缺性证据比 Revel 当前公开披露更清晰时，才会为防务和工业软件支付高价。因此，报道的
              Series B 估值更像公开承销的工作上限，而不是已经验证的底部。
