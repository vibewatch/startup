    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 为何可比
      - 局限
    rows:
      - - Revel（据报道 B 轮）
        - 私募轮估值
        - 第三方报道 $150M B 轮对应 ~$1.005B 估值；公司未官方披露
        - 本次尽调当前工作价格锚
        - 报道估值缺少公开收入、毛利率和投资条款清单支撑
      - - Palantir
        - 公开市场软件倍数
        - BVP 称 Palantir 2025 年交易价格接近 NTM 收入 65x；SEC 材料显示 Q1 2026 增长 85%，并上调 FY2026 指引
        - 显示公开市场国防软件热情能到达的上限
        - 公开流动性、高速增长和大得多的已披露规模，使其只能作为天花板可比
      - - Emerson 收购 NI
        - 战略并购先例
        - $8.2B 收购；NI 2022 年收入 $1.66B，软件占比 ~20%，客户约 ~35,000 家
        - 证明接入软件的测试与测量资产具备战略价值
        - 规模大得多、更成熟，也比 Revel 更深绑定硬件
      - - Shield AI
        - 私有国防软件融资先例
        - 投后估值 $12.7B，包含 $1.5B G 轮和 $500M 固定回报优先股
        - 显示 2026 年资本仍愿意支持国防软件龙头
        - 结构化融资和更宽的自主平台降低直接可比性
      - - Anduril
        - 私有国防平台融资先例
        - $5B H 轮对应 $61B 估值；公司称 2025 年收入达到 $2.2B
        - 对具备战略稀缺性的软件赋能国防平台，是有用的上限信号
        - 规模、制造足迹和已披露收入基础都远超 Revel 的公开画像
    enumerationScope:
      coverage: partial
      basis: >-
        This table is a directional set of public and private precedents most relevant to Revel’s pricing problem; it is
