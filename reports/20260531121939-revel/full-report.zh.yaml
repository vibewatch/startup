      - number: '3.2'
        title: 能力覆盖、打包和定价机制
        blocks:
          - type: paragraph
            body: >-
              直接既有厂商的打包模式并不完全相同，但它们都给了买方留在现有技术栈内的理由。NI 披露了最清晰的标价：多个 LabVIEW 版本以订阅或永久许可证销售，高阶版本加入构建器、分析功能，以及
              TestStand、FlexLogger、InstrumentStudio 和 DIAdem 等完整测试系统软件。Beckhoff
              走的是另一条路：工程工具免费，但运行时和功能许可证收费，并与平台等级绑定；这降低试用摩擦，同时保留运行时变现和装机基础黏性。Ignition
              的服务器中心模式是另一个强经济楔子：一个服务器许可证承诺无限标签、用户和客户端，再通过支持计划、云使用、模块和冗余节点扩张变现。


              Rockwell 和 Siemens 较少靠透明标价竞争，更多靠生态拉力。Rockwell 的 FactoryTalk 家族横跨设计、运营、维护、分析和硬件；更新的 Optix 和 Design Studio
              界面加入基于能力的运行时授权、云协作和 AI 辅助控制设计。Siemens 推动 WinCC Unified 成为面向未来的 HMI 与 SCADA 层，可从面板跑到边缘再到 PC，并支持
              HTML5、JavaScript、Web 客户端、API 和广泛协议互操作。这些方案不一定比 Revel 便宜，但许多存量买方更容易为它们给出理由，因为它们能接入已经存在的控制器、HMI 和服务资产。


              定价透明度本身就是竞争比较的一部分。在已审阅集合中，NI 和 Ignition 披露了最可操作的公开打包机制。Beckhoff 透露的信息足以理解免费工程工具和按性能收费的运行时授权，但没有报价就难以做干净的
              TCO 对比。Rockwell、Siemens、Palantir、Shield AI、Applied Intuition、MathWorks 和 Revel
              多数把买方导向演示、试用或销售沟通。这种不透明并不意味着这些供应商弱；它意味着采购惯性往往会偏向买方已经知道如何预算和审批的技术栈。
