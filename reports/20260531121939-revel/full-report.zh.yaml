      - number: '7.5'
        title: 缓释因素与否决条件
        blocks:
          - type: paragraph
            body: >-
              缓释逻辑真实存在，但公开可见的主要还是意图和招聘，而不是经审计的结果。Revel 显然在为设计保证、硬件鉴定、HIL
              验证、部署工具和遥测基础设施招人；对一家服务高后果环境的公司来说，这是正确方向。正向解读是，管理层很早就看到了难题。怀疑性解读是，投资人仍在出钱建设控制界面，而不是已经看到一套面向关键基础设施的、充分制度化的运营系统。这个区别很重要，因为下行不是二元的欺诈或产品不存在，而是公司可能成为一家有价值但增长更慢、服务更重、受合规约束更多的业务，低于标题估值隐含的期待。


              因此，投资决策应由可监控阈值卡住，而不是由对防务或工业软件倍数的泛泛热情推动。本章的否决条件很直接。如果 Revel 无法展示可信的出口 / 隐私 /
              合规责任地图，如果当前招聘潮之后部署仍高度依赖现场，如果客户证据仍集中在少数 logo，或如果 Series B
              后披露仍缺少基本运营指标，投资逻辑就应大幅下调。反过来，可复制部署、更广客户宽度和清晰保证路线图的证据，会显著降低这个故事的风险。
