  - id: FP001
    title: 竞争定位图
    type: quadrant
    layout: wide
    summary: 有证据支撑的序数图：x 轴比较实时控制深度，y 轴比较编排或自主广度；分值更高只代表范围更广，并不自动意味着每个买家都能拿到更好的产品。
    approximationNotes: 坐标轴采用 1-5 的序数判断，依据是本次审阅的来源包，而不是供应商发布的评分体系。该图用于呈现竞争形态和相邻边界，不代表市场份额。
    data:
      xAxis: 实时控制与硬件运行时深度（1=轻量或间接，5=贴近硬件的深运行时）
      yAxis: 跨项目编排与自主广度（1=单一工作流，5=多系统或任务层广度）
      points:
        - label: Revel
          x: 4
          'y': 3
          note: 控制层深度和操作员工作流速度强，但公开呈现的广度窄于大型既有厂商或任务平台
        - label: NI / LabVIEW
          x: 4
          'y': 2
          note: 测试和验证栈很深，任务或企业编排叙事较轻
        - label: Beckhoff TwinCAT
          x: 5
          'y': 2
          note: 本次审阅集合中最深的直接运行时和控制器相邻能力
        - label: Ignition
          x: 4
          'y': 3
          note: 强势工厂现场枢纽，集成覆盖广，但任务自主范围较小
        - label: Rockwell / Siemens
          x: 5
          'y': 4
          note: 工业生态覆盖广，同时覆盖设计和运营
        - label: MathWorks / Simulink
          x: 3
          'y': 2
          note: 基于模型的工程和 HIL 很强，但核心不是操作员控制层
        - label: Palantir AIP
          x: 2
          'y': 5
          note: 审计和编排广度最高，硬件控制的直接运行时深度最低
        - label: Shield AI EdgeOS
          x: 4
          'y': 4
          note: 确定性自主中间件，在机器人和防务中具备多智能体广度
        - label: Applied Intuition Defense
          x: 4
