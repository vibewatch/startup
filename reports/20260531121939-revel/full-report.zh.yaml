      - number: '3.3'
        title: 相邻国防和工业平台替代方案
        blocks:
          - type: paragraph
            body: >-
              本章最重要的分析区分，在于直接测试或控制既有厂商，与相邻的国防或工业软件平台。Simulink
              是相邻而非直接等价的最清晰例子。当团队需要多域建模、HIL、代码生成和部署前面向认证的验证时，它占据主导。它可以在航空航天、机器人和能源项目中具备很强战略力量，但并不会自动解决操作员面对的运行时控制、遥测仪表盘或日常指令工作流；这些才是工厂现场或测试台控制产品要解决的问题。


              Palantir、Shield AI 和 Applied Intuition 更靠近任务编排、自主和治理。Palantir AIP for Defense
              强调机密部署、完整审计轨迹、互操作性和人机协同。Shield AI 的 EdgeOS 强调静态配置、确定性共享内存通信和多智能体机器人。Applied Intuition 的国防栈现在捆绑 Mission
              Control、集成工作流，以及覆盖空中、地面、海上、太空和作战管理用例的板载自主能力。这些供应商重要，是因为国防买方可能偏好一个同时组合编排、自主和可审计性的宽项目栈。除非购买问题本身从硬件测试与控制转向机队级自主或任务软件，否则它们仍然相邻于
              Revel 的核心楔子。


              这种相邻压力有两面。它意味着 Revel 在国防项目里不能轻视保证、互操作性或操作员信任。但这也意味着 Revel 不需要按这些自主或决策平台的规则逐项击败它们。更现实的问题是，Revel
              能否拥有这些更大系统之下的低延迟硬件控制和操作员工作流层，还是更大系统供应商最终吸收足够多控制功能，把这个楔子压扁。
            claimRefs:
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
              - CP040
              - CP042
              - CP043
      - number: '3.4'
        title: 切换成本、分发力量和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              反向证据很直接：买方已经有可信替代方案，而且这些替代方案没有停在原地。NI 路线图加入 Docker、CI 或 CD，以及 AI 辅助开发。Beckhoff 继续把 TwinCAT
              扩展到控制、HMI、视觉、测量和连接，同时用可迁移许可证保护既有投资。Ignition 持续押注无限经济模型和工厂现场集成。Rockwell 和 Siemens
              把软件与控制器生态、合作伙伴网络和采购关系结合起来，而年轻供应商还没有这些资源。即便 Revel 在技术上有吸引力，这些事实也会在培训、协议集成、运行时授权、控制器选择、支持预期和验证负担上形成真实切换成本。


              Revel 最好的公开护城河证据更窄，但确实存在。Astro Mechanica 案例研究显示，团队从自研工具迁移后，部署非常快、关键人依赖下降，操作员主导权增强。Redpoint
              在更高层面强化了同一叙事：客户在数周内替换遗留供应商和内部基础设施，并把测试台部署从数月缩短到数天。这是有吸引力的楔子，因为买方不必相信 Revel 会替换每一套标准化既有栈；他们只需要相信，Revel
              是消除脆弱瓶颈最快的方法。


              护城河未被证明的部分，是初始楔子之后的耐久性。公开材料仍没有展示协商后的定价、相对 NI、Ignition、TwinCAT 或 FactoryTalk 的量化胜率，也没有一份扎实的存量客户名单，证明 Revel
              替换的是成熟既有厂商而非自研工具。因此，本章结论是平衡的：在速度、灵活性和操作员优先控制最重要的地方，Revel
              有可信的直接差异化；但中期威胁面仍主要来自既有厂商捆绑和相邻栈整合，而不是另一个从零搭同一细分品类的创业公司。
