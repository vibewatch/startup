      - number: '8.4'
        title: 退出准备度、否决触发因素与最终尽调
        blocks:
          - type: paragraph
            body: >-
              基于当前公开证据，Revel 更像未来的战略收购候选，而不是 IPO 候选。NI 先例说明，软件连接的测试和测量平台对工业收购方可能有战略价值；如果 Revel
              能持续复合增长，它的控制层定位也可能对自动化、工业软件或防务平台买家有意义。但 IPO 准备度取决于远比 Revel 当前更成熟的公开披露界面。revel.build
              域名不活跃只是一个小信号，但方向上与更大的问题一致：公司尚未选择披露公开市场投资人会期待的指标。


              这也是本节把否决触发因素写得很具体的原因。如果尽调无法证实 ARR
              质量、按部署类型拆分的毛利率，以及客户在试点之外的扩张，即便产品受欢迎，估值逻辑也会断裂。如果最新一轮包含标题报道看不见的重度优先权负担或结构化下行保护，普通股故事就会重置。如果公司无法展示在受监管环境中支持
              always-on 控制所需的可信安全与保证准备度，叙事应从宽广控制平台上行，退回到更窄的测试软件楔子。


              因此，最终尽调问题不再是确认 Revel 是否有意思，而是确认报道价格是否可投。在这些问题清掉之前，正确姿态是有纪律的好奇，而不是确信。
