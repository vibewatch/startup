      - number: '4.2'
        title: GTM 模式和收入质量代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据强于公开定价证据。Revel 称历史上每一个试点都转化为客户，客户证据也具体到足以产生分量：据称 Impulse 把搭建时间从 14 天缩短到 8
              小时，把测试频率从每隔一天提升到每天多次，现在运行 80 多个 RevelTest 实例；Astro Mechanica 称 Revel 替换了自研平台，并在 1 天内让测试台可运行。官网还列出来自
              Radiant Nuclear、Gravitics、Impulse Space 和 Orbital Operations 的具名支持者。这并不能在会计意义上证明收入质量，但它支持一个可信的
              先落地再扩张模式：初始销售解决紧迫工作流瓶颈，随后扩展到更广泛的控制用例。


              招聘信号强化了这种解读。Revel 正在招募首位企业 AE、首位企业 BDR
              和面向客户的解决方案工程岗位，而不是宣传自助式动作。产品管理岗位描述了与航空航天和核环境用户的紧密循环，解决方案工程师岗位则要求在客户现场部署。这些都是高接触企业销售的典型标志，可能带来较高合同价值，但也意味着实施负担、较慢采购，以及不成熟的获客成本（CAC）或回本周期能见度。公开层面，Revel
              看起来早期付费意愿证据很强，但关于可重复、成熟销售效率的公开证据很弱。
