  - id: TI003
    title: 单位经济模型表
    columns:
      - 指标
      - 数值或状态
      - 置信度
      - 为什么重要
      - 尽调问题
    rows:
      - - 收入 / ARR
        - null
        - 低
        - 没有公开收入，投资人无法锚定渗透率、续约规模或估值倍数纪律
        - 索取当前 ARR、滚动收入，以及预订收入与确认收入桥表
      - - 毛利率
        - null
        - 低
        - 部署重、对安全敏感的软件，毛利率强弱取决于服务和支持组合
        - 索取软件毛利率、混合毛利率和服务附着率
      - - 实际定价 / ACV
        - null
        - 低
        - 定价纪律决定工作流压缩能否转化为有吸引力的合同经济性
        - 索取价目表、最近十份初始 ACV、扩展 ACV 和折扣政策
      - - CAC / 回本周期
        - null
        - 低
        - 首位 AE 和首位 BDR 招聘显示销售动作在成熟，但不足以计算效率
        - 索取全口径销售与营销支出、按细分市场划分的 CAC，以及按队列划分的回本周期
      - - 部署效率代理指标
        - Impulse 设置从 14 天缩短到 8 小时；Astro Mechanica 台架一天内投入运行
        - 中
        - 强实施速度案例支持买方 ROI，尽管它们不是完整财务指标
        - 用另外三个客户部署和价值实现时间分布来验证
      - - 销售周期负担
        - 从首位 AE、首位 BDR 和解决方案工程师招聘推断为高接触企业销售
        - 中
        - 长销售周期可以和高 ACV 并存，但会推迟回本并增加集中风险
        - 索取按细分市场划分的销售周期中位数、采购周期和试点转付费时长
      - - 数据平台负担
        - 高频遥测摄取、存储、留存和云迁移工作在招聘中明确出现
        - 高
        - 这很可能是不小的基础设施成本中心，独立于标准应用托管
        - 索取云与可观测性支出、数据留存政策，以及按部署架构划分的毛利率
      - - 现场硬件负担
        - 硬件认证、老化测试、延迟画像、机队监控和安全硬件支持在招聘中明确出现
        - 高
        - 这些责任会形成隐藏部署 COGS，并拖慢支持杠杆
        - 索取每次部署的硬件认证工作量，以及任何转嫁硬件成本
      - - 验证负担
        - 公开招聘显示有专门的仿真、HIL 和运行时团队
        - 高
        - 验证基础设施提升信任，但在收入规模化前会吃掉大量工程时间
        - 索取验证基础设施成本，以及按职能划分的人员配置
      - - 出口管制摩擦
        - 公开岗位中出现 ITAR 或出口授权资格要求
