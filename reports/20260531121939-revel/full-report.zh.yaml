      - - 平台安全控制
        - 硬件平台岗位明确提及
        - Secure Boot、TPM 2.0、磁盘加密、镜像签名和现场系统加固
        - 产品面向安全敏感环境设计，不只是开放互联网连接场景
        - 未披露公开外部审计、渗透测试摘要或认证
      - - 气隙隔离和断连运行
        - 硬件平台和部署岗位明确提及
        - 无法连接外部服务的系统，以及远程或嵌入式设备机群
        - Revel 不是纯云产品，并预期会进入受限部署环境
        - 断连系统的补丁、更新和密钥管理模型未公开
