  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和模块地图
        blocks:
          - type: paragraph
            body: >-
              Revel 没有在公开层面把自己包装成一个单点工具。从官网、公司页面、发布文章到 Series B
              材料，公司始终描述的是一套综合指挥控制软件平台，横跨从原型到量产的硬件开发、部署和实时运营。公开模块地图也异常清晰。RevelTest
              是测试楔子，面向快周转台架搭建、迭代式研发项目，以及从原型到量产的测试工作流。RevelC2
              是更宽的运营界面，用于统一的全设施控制、持续运行关键运营和以操作员为中心的控制室。官网随后补齐了这些产品之下的技术子组件：自动系统发现和配置、实时遥测、用于硬件控制逻辑和运行时检查的
              RevelCode、基于浏览器的仪表盘、可编程告警，以及带报告和日志导出的历史数据。


              客户证据很重要，因为它显示这些界面不只是命名约定。Astro Mechanica 案例研究称，Revel 替换了自研控制平台，在 1 天内让发动机测试台上线，让操作员自行编写
              RevelCode、搭建仪表盘，并加入此前不存在的遥测、告警和中止逻辑。2026 年官方材料称，Impulse 现在运行 80 多个 RevelTest 实例，Revel
              正把同一套栈从测试延伸到核能、炼油、水务、电力、国防、数据中心和生物医药环境中的工业控制。公开层面，产品定义因此站得住：Revel 看起来在销售一套集成的软件栈，用于硬件测试和控制；其中 RevelTest
              是证据最充分的界面，RevelC2 是扩张界面，公开部署证据正在增长但仍更薄。
