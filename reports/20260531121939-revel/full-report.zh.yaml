  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多个可见风险会直接传到收入韧性、毛利率和估值支撑，而不是只留在 工程层面。
    data:
      nodes:
        - id: compliance
          label: 合规 / 保证缺口
          description: 出口管制、隐私和安全开发义务超过已披露的控制措施。
        - id: deployment
          label: 重交付部署
          description: 客户现场集成和现场支持仍然吃重。
        - id: telemetry
          label: 遥测 / 架构复杂度
          description: 边缘、本地和云组件混在一起，抬高可靠性负担。
        - id: switching
          label: 现有厂商切换成本
          description: 传统生态拖长迁移和销售周期。
        - id: concentration
          label: 客户集中度
          description: 少数标杆客户主导证据，可能也主导收入。
        - id: revenue
          label: 收入转化
          description: 审查和部署拉长后，订单和续约会滑落。
        - id: margin
          label: 毛利率
          description: 服务和定制集成会挤压软件经济性。
        - id: valuation
          label: 估值韧性
          description: 不透明和运营拖累会削弱高估值倍数支撑。
        - id: incident
          label: 信任 / 事故风险
          description: 运营错误或保证薄弱会打击买方信心。
      edges:
        - from: compliance
          to: revenue
          label: 审批变慢
        - from: compliance
          to: incident
          label: 保证失效
        - from: deployment
          to: margin
          label: 服务负荷
        - from: deployment
          to: revenue
          label: 上线变慢
        - from: telemetry
          to: incident
          label: 运营故障
        - from: telemetry
          to: margin
          label: 更高基础设施成本
        - from: switching
          to: revenue
          label: 销售周期拉长
        - from: concentration
          to: revenue
          label: 标杆客户依赖
        - from: concentration
          to: valuation
          label: 叙事脆弱
        - from: incident
          to: valuation
          label: 信任流失
        - from: revenue
          to: valuation
          label: 增长重置
        - from: margin
          to: valuation
          label: 倍数承压
    claimRefs:
      - CR008
      - CR009
      - CR019
      - CR020
      - CR024
      - CR028
      - CR035
      - CR036
      - CR041
      - CR043
      - CR045
      - CR046
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 公司同时依赖专业人才、合格硬件、客户环境、现有厂商，以及承载叙事的 外部利益相关方。
    data:
      nodes:
        - id: revel
          label: Revel 平台
          description: 集成测试、遥测和控制栈。
        - id: founder
          label: 创始人可信度
          description: Scott Morton 是品类定义和信任建立的核心。
        - id: se
          label: 解决方案工程
          description: 现场部署和客户赋能能力。
        - id: hardware
          label: 合格硬件供应商
          description: 经过批准的计算、网络、存储和组件供应。
        - id: customers
          label: 标杆客户
          description: Impulse / Astro / Radiant 这类证据和早期扩张。
        - id: incumbents
          label: 传统生态
          description: NI、Beckhoff、Ignition、Rockwell 和 Simulink 等替代生态。
        - id: regulators
          label: 监管机构 / 指引
          description: 出口管制、隐私和安全开发预期。
        - id: investors
          label: 投资者 / 董事会信号
          description: 外部背书和治理预期。
        - id: data
          label: 遥测栈
          description: 横跨边缘与云的高频数据平面。
      edges:
        - from: revel
          to: founder
        - from: revel
          to: se
        - from: revel
          to: hardware
        - from: revel
          to: customers
        - from: revel
          to: incumbents
        - from: revel
          to: regulators
        - from: revel
          to: investors
        - from: revel
          to: data
        - from: se
          to: customers
        - from: hardware
          to: data
        - from: incumbents
          to: customers
        - from: regulators
          to: customers
        - from: investors
          to: valuation
        - from: founder
          to: investors
    claimRefs:
