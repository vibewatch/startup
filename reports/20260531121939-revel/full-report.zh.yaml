      - number: '4.5'
        title: 财务结论和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              正向财务逻辑是，Revel
              似乎在解决昂贵的工作流痛点；在这些市场里，可靠性、速度和操作员信任足够重要，可能支撑有分量的合同价值。具名客户、强证言、试点转客户表述，以及从测试扩展到更广泛指挥控制的产品路径，都指向真实收入机会。公司也已经披露了足够多股权融资，使近期问题不再是外部人是否相信这个品类存在，而是
              Revel 能否把品类可信度转化为可重复、高毛利的软件经济模型。


              阻断项是披露。此处审阅的公开来源仍未揭示收入、ARR、实际定价、毛利率、CAC、回本周期、现金、烧钱速度、现金跑道、客户集中度、续约数据或合同组合。出口管制和 ITAR
              约束出现在公开招聘中，气隙、安全敏感部署也意味着上手更慢、支持投入比标准软件销售更重。因此，财务结论需要保留层次：Revel
              的收入质量很可能好于其单薄公开指标暗示的水平，但投资人无法只凭公开证据承销利润率路径或资本效率。下一步不是继续辩论叙事，而是提出私有数据清单。
