      - number: '8.3'
        title: 乐观、基准、悲观情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Revel 没有披露常规私营软件估值模型所需的运营指标，所以这里的情景框架刻意保持宽泛和方向性。乐观情景不是简单的“Revel
              继续增长”。它具体要求证明当前部署能转成可复制的经常性软件收入，支持和实施工作不会吞掉毛利率，并且公司能从测试延伸到更连续的控制工作流，而不被安全或采购摩擦打断。如果这些条件都过关，估值明显高于报道轮次是可能的，因为可比市场曾经积极奖励防务和工业软件。


              基准情景更保守，也更符合当前实际可得证据。Revel
              看起来是一家强公司，品类叙事确实有共鸣，但公开证据目前仍更支持围绕最近报道估值跟踪，而不是为纯叙事溢价加价。这意味着当前报道估值附近有一个粗略支撑带，而不是一个有把握的上行案例。悲观情景很直接：如果部署无法转化为干净的软件经济性，或高端行业倍数压缩，即便产品质量很强，公司也可能面临持平甚至下行融资。


              入场纪律来自这个设定。今天的价格应被视为一个尽调问题，而不是一个假设。在没有收入、毛利率和股权结构输入的情况下，精确目标回报和持有期只会是编造出来的精确。投资人应改为承销下一项证据更可能把公司推入乐观路径，还是暴露悲观路径中的条款重置。
