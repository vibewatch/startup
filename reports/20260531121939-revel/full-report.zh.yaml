  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与买方角色
        blocks:
          - type: paragraph
            body: >-
              公开客户证据指向的买方，更集中在技术复杂的硬件项目，而不是一般工业软件团队。可支撑的具名账户聚成五类：空间机动（Impulse Space）、先进能源与核能（Radiant
              Nuclear）、大型空间结构和轨道基础设施（Gravitics）、轨道防御 / 拦截项目（Orbital Operations），以及超音速推进测试（Astro
              Mechanica）。公司材料也谈到汽车、制造、机器人和更广泛的工业控制，但这些类别仍主要停留在叙事层面，缺少具名公开部署支撑。


              可能的商业路径是先卖给工程领导层，再让操作员采用，最后通过企业审批。首个客户经理岗位明确聚焦航空航天，解决方案工程师岗位则围绕在客户现场部署系统，并把现场使用反馈闭环到产品方向。这种组合说明，买方往往是工程高管或技术项目负责人，日常用户是测试操作员、软件工程师或推进工程师，付款方则是愿意赞助关键任务工具变更的预算负责人。截至
              runDate，公开证据更支持一个航空航天优先的楔子，并向先进能源等邻近领域扩张，而不是一个广泛的工业装机客户基础。
