  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对投资判断的影响
      - 尽调路径
    rows:
      - - 当前收入 / ARR
        - 仅靠公开来源，无法判断渗透率、增长或估值倍数纪律
        - 索取过去 12 个月收入、当前 ARR，以及按产品线划分的预订收入与确认收入桥表
      - - 价目表与实际 ACV
        - 没有真实初始合同和扩展合同数据，就无法评估定价权、折扣或合同质量
        - 索取当前价目表、最近十份已签合同，以及按细分市场划分的平均折扣
      - - 毛利率与服务组合
        - 无法把软件经济性同部署或支持人力分开
        - 索取软件毛利率、混合毛利率，以及软件与服务收入拆分
      - - 当前现金、烧钱速度和跑道
        - 无法检验资金充足性或下一轮时间
        - 索取最新资产负债表、月度烧钱桥表和管理层跑道情景
      - - CAC、回本周期和赢率
        - 无法判断早期客户证据是否可复制，还是只是创始人主导
        - 索取队列 CAC、销售周期长度、试点转付费时间，以及赢 / 输分析
      - - 活跃客户数与集中度
        - 少数灯塔客户看起来很强，但仍可能掩盖集中风险
        - 索取活跃客户名单、收入集中度和前五大账户占比
      - - 续约与扩展指标
        - 试点转化令人鼓舞，但不能替代续约耐久性或扩展效率
        - 索取总留存率、扩展率和账户级扩展历史
      - - 按架构划分的部署 COGS
        - 气隙或现场依赖重的部署可能带来显著不同的支持和认证成本
        - 索取按本地、边缘和云部署模型划分的 COGS，以及实施人员配置假设
      - - 债务、授信或项目义务
        - 隐藏义务可能改变有效跑道和下行风险
        - 索取债务明细表、设备租赁、信用证和任何政府合同义务
      - - 当前员工数与职能结构
        - 唯一公开团队规模数据已经过时，限制了烧钱分析和运营杠杆评估
        - 索取当前按职能划分员工数、招聘计划和全负担薪酬模型
    notes: 这些不是可有可无的问题。它们是审慎评估 Revel 财务画像所需的最低私有数据点。
