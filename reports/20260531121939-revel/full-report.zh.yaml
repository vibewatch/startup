      - number: '7.4'
        title: 财务、治理与关键人不透明
        blocks:
          - type: paragraph
            body: >-
              披露不对称放大了财务风险。公开来源能证明 Revel 在短时间内融资很多，但没有披露收入、烧钱速度、毛利率、服务占比、现金余额、现金跑道或客户集中度。这让投资人只能在运营遥测很薄的情况下承销估值故事。第三方报道把
              Series B 估值称为大约 $1.0 billion，而公司自己的公告完全没有提估值。对私营公司来说这并不罕见，但在这里更重要，因为部署服务、合格硬件和安全 /
              合规工作可能深刻塑造商业模式，却不会出现在牵引力叙事帖子里。


              治理披露同样有限。公开记录强调创始人-市场匹配，并提到 Index 董事席位加入，但已审阅公司材料没有说明更广泛的董事会构成、正式 KPI 节奏或管理层厚度。已审阅语料中最后一个明确的公司员工数更新称，Revel
              创立一年多一点时有 18 人；公司现在显然更大，但当前规模没有公开披露。这个组合带来两个相关风险：公司可信度和产品愿景对 Scott Morton
              的关键人依赖，以及未来融资或定价讨论可能更多依赖故事动能，而不是透明运营证明。
