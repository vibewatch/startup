companyProfile:
  summary: >-
    Revel 是一家位于洛杉矶地区的私营公司，正在为硬件测试和关键任务工业运营搭建软件定义控制栈。公司由 Scott Morton 在 SpaceX 工作 9 年多后于 2024 年底创立，2025 年 4 月带着种子轮和
    Series A 轮合计 $30 million 脱离隐身，随后在 2026 年 2 月完成由 Index Ventures 领投的 $150 million Series B
    轮。公开证据最强的部分集中在航空航天和先进能源客户，例如 Impulse Space、Astro Mechanica、Radiant Nuclear 和 Gravitics，也包括测试台调通更快、RevelTest
    使用扩大等具体流程收益。收入、当前客户数、完整董事会构成和官方披露估值仍未公开。
