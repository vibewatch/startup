  - id: FM004
    title: 采用漏斗 / 价值链图
    type: flow
    layout: standard
    summary: Revel 可能的采购路径从痛点鲜明的测试或控制瓶颈开始；只有建立信任后才会扩张。
    data:
      nodes:
        - id: pain
          label: 急迫工作流痛点
          detail: 团队被自研工具、脆弱控制代码或缓慢的试验台 / 设施搭建拖慢。
        - id: pilot
          label: 单一硬件工作流试点
          detail: Revel 先落在试验台、原型项目或关键设施用例上，而不是全企业铺开。
        - id: prove
          label: 证明确定性控制与操作员杠杆
          detail: 买家验证遥测可见性、告警、安全检查和更快迭代。
        - id: expand
          label: 扩展到更广运营范围
          detail: 成功试点会扩到更多试验台、设施或任务控制工作流。
        - id: govern
          label: 清除保证与治理门槛
          detail: 供应商必须满足可审计、认证、安全和采购预期。
        - id: standardize
          label: 标准化为控制层
          detail: 只有到这一步，软件才可能成为长期工厂、机队或任务系统栈的一部分。
      edges:
        - from: pain
