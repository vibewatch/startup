    rows:
      - - 按队列拆分的收入 / ARR
        - 按客户、队列和产品界面拆分的月度及季度收入；试点转生产历史
        - 没有这些，报道估值无法挂钩真实软件规模
        - CFO 或财务负责人导出数据室材料，并逐队列讲解
      - - 毛利率和服务收入结构
        - 按软件与部署 / 实施服务、主要部署类型拆分的毛利率
        - 决定 Revel 应按软件、工具加服务，还是基础设施来投资测算
        - 财务材料包加交付运营复盘
      - - 客户集中度和续约
        - 前 10 大客户收入集中度、续约日期、扩张率和流失历史
        - 没有集中度和持久性，无法判断下行风险和退出质量风险
        - 董事会材料、收入明细表和客户访谈
      - - 优先股堆叠 / 稀释
        - 清算优先权、参与权、优先级、棘轮条款、期权池处理方式和股权结构表
        - 报道估值可能与普通股价值明显背离
        - 已签署投资条款清单、股权结构表和律师摘要
      - - 安全 / 保障准备度
        - 安全审查材料包、客户保障文档、认证路线图，以及常在线控制部署证据
        - 乐观情景假设公司能扩张到更连续的运营工作流
        - 安全负责人访谈加尽调室文件
      - - 退出路径现实性
        - 主动战略兴趣、M&A 沟通历史，以及管理层 IPO 准备计划
        - 判断 M&A 选择权是真实存在，还是只有主题叙事
        - CEO / 董事会访谈和投行推荐人访谈
    notes: 这些问题会阻断估值，而不是只补信息；回答前不应上调建议。
    claimRefs:
      - CV016
      - CV037
      - CV038
      - CV043
      - CV044
      - CV045
      - CV046
      - CV048
      - CV049
