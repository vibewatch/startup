  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和相邻领域
        blocks:
          - type: paragraph
            body: >-
              Revel 应被界定为工业自动化与控制系统、硬件测试环境，以及国防或其他关键任务控制工作流中的软件层，而不是一家通用纯软件公司。Revel
              自己的产品语言异常明确：平台用于从原型到量产开发、部署并指挥硬件系统；RevelTest 面向硬件测试，RevelC2 面向持续运行的工业运营。2026 年 2
              月公司公告把范围进一步扩展到航空航天、国防、机器人、先进能源和工业市场，背景是物理系统正变得更自主、更由软件驱动。


              这条边界很重要，因为最大的一组公开市场数字包含了 Revel 并不能直接捕获的支出。Grand View
              的工业自动化与控制系统估算包括控制阀、DCS、SCADA、机器人和完整工厂控制基础设施；Precedence 的 IIoT 估算更宽，覆盖传感器、连接、服务和软件定义生产流程。这些类别适合作为外层包络，但
              Revel 的实际楔子是运行时、遥测、指令、告警和操作员工作流层，用来替换自研控制代码或挤压既有自动化套件。因此，现状并不是通用 SaaS，而是内部工具、PLC/SCADA
              套件、测试软件和新兴国防自主栈的混合体。
