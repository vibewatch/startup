        - 硬件、仿真和 HIL 岗位明确提及
        - 热应力、老化测试、延迟剖析、长时间稳定性、仿真和 CI 支持的 HIL 工作流
        - 可靠性工程看起来是真投入，不只是营销说法
        - 没有公开故障率、通过率或正常运行时间指标，无法把投入映射到结果
      - - 隐私和数据处理
        - 已发布隐私政策
        - 账户、支付服务商工作流、设备和使用数据、分析、留存和合规披露
        - 公司至少为 Web 和应用界面提供了基础公开法律 / 流程文档
        - 产品数据边界、租户隔离和遥测留存细节没有公开文档
      - - ITAR 和出口管制敏感性
        - 可见但间接
        - 仪表盘和后端岗位包含 ITAR 约束；BIS 将出口管制界定为与国家安全相关的合规制度
        - Revel 可能服务 U.S. person 资格和出口管制在运营上很重要的项目
        - 这不能证明产品分类、DDTC 注册或任何具体许可状态
