      - number: '5.3'
        title: 部署、集成、可靠性和支持
        blocks:
          - type: paragraph
            body: >-
              Revel 的公开证据指向深度服务式部署模型。最强证据是 Astro Mechanica 案例研究：Revel 称它与客户既有环境集成，连接到内部驱动协议，并在 1
              天内让替换后的测试台可运行。这比泛泛的“易集成”口号更强，因为它显示公司声称能处理客户特定硬件接口，而不只是干净的演示环境。解决方案工程师岗位进一步支撑了这种解读，明确描述客户现场部署，以及把现场反馈带回路线图的循环。DevOps
              岗位又加了一层：Revel 正在为边缘计算和嵌入式环境、CI/CD 管线，以及跨远程设备的机队交付构建可复现部署系统。这不是一个简单纯云控制台的足迹。


              可靠性工程也看起来真实，但仍部分停留在公司内部，而非外部证明。硬件平台招聘描述了 x86 和 ARM 认证、兼容性矩阵、面向实时工作负载的 Linux 调优、Prometheus/Grafana
              机队健康监测、安全启动、TPM 2.0、磁盘加密、镜像签名和气隙部署。独立 HIL
              和仿真岗位显示，测试基础设施、验证和上线前保证都是明确投入领域。这是好消息。边界在于公开披露：已审阅材料没有公布支持硬件矩阵、集成目录、回滚行为、正常运行时间承诺、事故历史或故障率指标。公开层面，Revel
              对部署和可靠性看起来技术上很认真，但买方仍需要一份私有尽调包，才能承销这些部署跨多个客户和行业的可重复性。
