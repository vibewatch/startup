      - 差异化信号
      - 尽调缺口
    rows:
      - - RevelTest
        - 测试工程师、推进团队、硬件研发项目
        - 设计和运行硬件测试，迭代控制逻辑，监控遥测，并操作从原型到生产测试阶段的台架
        - 本组公开证据最强；有明确产品页支持，也有 Impulse 和 Astro 案例证据
        - 把编写、监控和运营迭代打包成一个工作流，而不是脆弱的内部工具链
        - 索取公开或私有证据，验证支持协议、定价边界，以及跨客户部署可重复性
      - - RevelC2
        - 控制室操作员、设施工程师、工业运营团队
        - 面向持续运行的关键运营，提供统一设施级控制和以操作员为中心的界面
        - 首页和 2026 年融资材料都明确推广 RevelC2，但具名生产证据比 RevelTest 薄
        - 把同一软件栈从测试延伸到实时运营，而不是销售一套独立的传统 HMI 套件
        - 要求提供具名生产部署、正常运行时间预期和操作员权限模型细节
      - - RevelCode
        - 测试与控制工程师、编写控制逻辑的操作员
        - 受 Python 启发的硬件控制语言，具备确定性执行、运行时检查和可调试性
        - 官网主页、发布文章、Business Wire、SiliconANGLE 和编译器招聘提供了强公开证据
        - 在不牺牲确定性和精度的前提下，让危险系统的控制逻辑更容易上手
        - 要求提供公开语言文档、示例，以及与现有代码库的兼容边界
      - - 仪表盘和控制界面
        - 操作员、主管、产品团队、客户利益相关方
        - 基于浏览器的仪表盘、实时控制界面、告警和面向人的指挥工作流
        - 官网文案、Astro 案例证据、仪表盘产品经理岗位、设计系统以及前端 / 全栈招聘共同支撑
        - 把操作员主导权和任务关键型 UX 当作核心产品，而不是事后补丁
        - 要求提供公开截图、组件库细节和基于角色的访问模型文档
      - - 遥测、报告和分析
        - 可靠性工程师、操作员、项目负责人
        - 实时遥测、历史数据留存、报告、日志导出和外部工具流式传输
        - 官方证据很强，后端招聘也指向高基数遥测、分析和报告能力
        - 从传感器到屏幕再到历史分析的原生数据链路减少上下文切换
        - 要求提供留存政策、schema、集成目录和存储拓扑细节
      - - 运行时、部署和硬件平台
        - 运行时工程师、嵌入式团队、部署和现场运营
        - 高性能运行时、设备驱动、合格硬件、CI/CD、设备队列交付和安全加固的现场系统
        - 嵌入式、Rust、硬件平台、DevOps、HIL 和解决方案工程招聘都给出强信号
        - 垂直整合一路深入到硬件认证和现场可靠性
        - 要求提供支持硬件清单、回滚和恢复行为，以及真实故障指标
    notes: 公开来源足以识别 Revel 的主要模块界面和架构资产，但还不足以核验产品打包、合同条款和部署拓扑之间的每一条边界。
