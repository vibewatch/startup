      - number: '5.5'
        title: 信任、安全、信息安全和合规
        blocks:
          - type: paragraph
            body: >-
              公开资料里，Revel 在意图和工程姿态上的证据强于正式信任证明。正向证据很具体：设计系统岗位把产品明确接到 HMI 和无障碍标准，目标是在压力、疲劳和降级条件下的控制室使用；硬件平台招聘提到安全启动、TPM
              2.0、磁盘加密、镜像签名和空气隔离环境；HIL、仿真和鉴定活动说明团队把验证当作发布工程的一部分，而不是最后补一个勾。隐私政策也确认，Revel
              的网页和应用界面会处理账户数据、支付服务商流程、设备和使用日志、Google Analytics，并且公司已经发布了关于数据保护和保留的基线表述。


              反向证据同样重要。已审阅的官方、合作伙伴和新闻来源没有披露 SOC 2、ISO 27001、DO-178C 合规、其他具名认证、公开 uptime/SLA 指标或事故历史。招聘信息提到 ITAR 约束和 BIS
              的出口管制角色，说明部分客户工作可能涉及出口敏感性，但这并不等于证明 DDTC 注册、产品分类或行业专项批准。投资人因此应谨慎解读 Revel
              的公开信任姿态：公司面向高危和安全敏感环境建设产品的证据很强，但第三方已正式审计或认证这些控制的证据很弱。这个缺口对尽调重要，但不致命；它只是意味着下一步必须做私下安全与合规审查，而不能默认认证已经存在。
