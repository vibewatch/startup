  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 尽调确认可重复的经常性软件收入、可接受的软件式毛利率、低集中度、干净优先条款，以及向测试之外扩张所需的可信安全准备度
        - 尽调前方向性支撑区间约 $1.5B–$2.5B；公开证据仍支撑不了精确回报测算，但高于报道估值的上行空间变得可信
        - 安全或采购摩擦、隐性服务强度和结构化融资条款仍可能压住上行空间
        - 目前较低；需要多项私有数据过关
      - - 基准
        - Revel 战略位置仍强，但指标只部分披露，投资人拒绝为纯叙事支付溢价
        - 方向性支撑区间约 $0.8B–$1.3B，围绕最近报道估值，符合观察或继续研究的立场
        - 即便产品质量高，估值仍被披露缺口和市场情绪牵制
        - 当前信号最强
      - - 悲观
        - 部署证明无法转化为干净的软件经济性，集中度偏高，或高溢价行业倍数压缩
        - 存在低于报道估值的平轮至降轮风险；下行区间刻意设得较宽，因为公开来源支撑不了精确回收测算
        - 收入质量、毛利质量或融资条款任一落空，都可能加速该结果
        - 实质且不可忽视
    notes: 情景区间是方向性估值支撑带，不是模型输出；公开来源没有披露精确回报预测所需输入。
