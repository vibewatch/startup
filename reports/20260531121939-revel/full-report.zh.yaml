      - number: '6.2'
        title: 采用轨迹与部署成熟度
        blocks:
          - type: paragraph
            body: >-
              Revel 的采用轨迹，在公司披露运营细节的地方最强。Impulse Space 是首个公开披露客户；那次公告不只是贴 logo，而是说 Revel 已部署在发动机测试设施，并用于执行操作。后来的 Series
              B 博客把证据进一步做实，称 Impulse 现在在多个测试设施运行 80 多个 RevelTest 实例。这是目前最清晰的公开信号：Revel
              不只是在赢试点，而是在一个拥有热试车基础设施、全栈测试台和多站点飞行硬件运营的客户处，嵌入重复工作流。


              其余公开客户的成熟度不一。Astro Mechanica 案例研究描述了一天内搭起试车台、操作员拥有自动化能力，并表示项目扩张后计划扩大使用。Gravitics 给出了量化结果——首个使用 RevelTest
              的测试活动把测试节奏提升到 4 倍；Radiant 则提供了具名背书，外加一篇独立文章称其为 RevelTest 客户。站在本章层面，最重要的 caveat 是：Revel
              公开声称每个试点都转成了客户，这在方向上令人鼓舞，但仍缺少分母、时间和合同金额细节。
