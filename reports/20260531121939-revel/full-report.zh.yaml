      - number: '7.3'
        title: 合作伙伴、客户与生态依赖
        blocks:
          - type: paragraph
            body: >-
              Revel
              也有典型的依赖栈问题。客户故事在航空航天和相邻先进能源账户中最强，证据真实但广度仍窄。这意味着客户集中度不是理论下行，而是在公司展示更广装机基础和合同多元化之前的默认假设。销售动作也强化了这一解读。公开招聘显示，公司正在面向航空航天主导的市场招聘首位企业
              AE 和首位 BDR，这是一家创业公司的正常里程碑，但也说明可复制 go-to-market
              还在建设，而非已经被证明。如果一两个头部账户主导参考、试点或收入，这些账户就会对路线图、实施负担和未来融资叙事产生过大影响。


              生态侧同样重要。投资人和公司材料明确把机会描述为替换老旧工业和测试控制栈，而 Beckhoff、Ignition、Rockwell、MathWorks
              等现有厂商则主打广泛协议支持、生命周期工具、网页部署、分析、HIL 和长期迁移路径。这意味着 Revel 不是在真空中销售；它是在要求团队从故障模式已知但生态成熟的既有系统切换出来。Astro Mechanica
              证明替换可以成功，但也凸显了反向风险：每次迁移都可能需要协议适配、客户专属集成和大量信任建设，经济模型才可能变得可复制。
