    rows:
      - - 新航天 / 推进研发
        - 工程副总裁、测试负责人或项目负责人
        - 测试工程师、控制工程师、操作员
        - 工程或项目预算
        - 拉起测试台架，迭代跑硬件测试，分析遥测数据
        - 替换自研工具，缩短搭建时间
        - 匹配 Impulse、Astro Mechanica 等推进密集型参考工作流
      - - 先进能源 / 关键基础设施
        - 运营或工程负责人
        - 操作员、可靠性工程师、控制室人员
        - 项目、设施或基础设施预算
        - 从台架验证走向受监控的实时运营
        - 需要常开遥测、告警和集中控制
        - 契合 Radiant 式 24/7 监控和高后果场景的正常运行时间需求
      - - 防务现代化 / OTA 原型项目
        - 项目经理、集成商负责人或政府资助方
        - 系统工程师、任务操作员、自治团队
        - RDT&E、原型或任务系统预算
        - 快速原型、集成、测试和作战演练
        - 需要更快迭代，以及可审计的软件定义控制
        - 对应 OTA 密集的防务项目和任务自治技术栈
      - - 工业设施现代化
        - 工厂经理、控制负责人或运营卓越负责人
        - 工厂工程师和控制室人员
        - 运营或资本开支现代化预算
        - 改造存量 HMI/SCADA/控制工作流
        - 需要更好的可视性、更易配置，并降低集成脆弱性
        - 这是最宽的商业扩张路径，也是存量厂商最密集的路径
      - - 任务自治 / 多智能体系统
        - 防务或自治产品负责人
        - 任务规划人员和自治工程师
        - 项目或产品预算
        - 在对抗环境中协调异构机器
        - 需要可互操作的编排、护栏和面向操作员的控制
        - 最直接竞争的是 Applied、Shield 和 Palantir 所代表的防务软件相邻市场
    notes: 买方角色来自公开客户工作流、官方防务软件页面和 FY2026 OTE 预算语境的推断。公开来源很少披露精确内部预算代码，因此预算负责人标签仍是方向性判断。
