      - number: '2.3'
        title: 买方、用户、付费方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Revel
              的具名客户和证言组合指向一个相当一致的买方模式。用户是一线控制工程师、测试工程师、操作员和软件负责人，他们需要快速配置硬件、监控实时遥测、安全下发指令，并避开脆弱的调通步骤。经济买方通常是工程、运营或项目负责人，负责测试台、设施或任务系统的进度风险。Astro
              Mechanica 的案例很有代表性：触发因素不是抽象的企业数字化，而是想替换一个自研控制平台，降低对单一内部专家的依赖，并让操作员在不等待定制工具开发的情况下更快迭代。


              Revel 引用客户周围的细分地图显示出三个实用 GTM
              楔子。第一是推进、航空航天和军民两用硬件团队的硬件研发与测试。第二是持续运行的工业或先进能源运营，原型阶段之后，遥测、告警和集中监控开始变得重要。第三是国防和任务自主项目，如今多个供应商都在向异构机器推销软件优先的编排、可审计性和控制。共同购买路径是先落在一个痛感强的测试或试点工作流上，证明可靠性和操作员效率，再扩展到更广泛的运营控制。
