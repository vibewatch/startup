      - number: '4.3'
        title: 成本结构和单位经济模型缺口
        blocks:
          - type: paragraph
            body: >-
              Revel 的公开成本结构看起来比商品化 SaaS
              重得多，尽管它仍然软件优先。高级后端岗位描述了一套数据平台，要处理高容量、高频、高基数工业遥测、长期留存，并逐步转向更多云端系统。全栈岗位强调基于浏览器的操作员界面中的实时和流式工作流。硬件平台岗位更有信息量：Revel
              预计要认证 x86 和 ARM 硬件、选择网络设备和存储、用 Prometheus 和 Grafana
              监控机队健康、运行老化和延迟测试，并支持带安全启动、TPM、加密和镜像签名的气隙环境。DevOps、HIL、仿真和运行时系统等独立岗位，意味着公司会持续在测试基础设施、验证、发布工具和确定性执行上投入，而不是只做简单
              CRUD 软件。


              关键区别在于可见成本桶和不可见单位经济模型。公开证据足以说明，Revel
              很可能在工程薪酬、可观测性和存储基础设施、部署工具、现场硬件认证、验证以及面向客户的实施支持上重投入。公开证据不足以计算毛利率、软件与服务组合、CAC、回本周期，或按部署类型划分的贡献利润。换句话说，本章可以识别什么可能消耗现金，但不能判断
              Revel 把这些支出转化为经常性软件毛利的效率。这就是核心单位经济模型缺口。
