    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与平台边界
        blocks:
          - type: paragraph
            body: >-
              Revel 将自己描述为一套综合软件平台，用于从原型到量产开发、部署并指挥硬件系统。公司在约 6 个月工作后，于 2025 年 4
              月公开亮相，并把使命定义为替换航空航天、能源、制造、汽车和其他工业场景中沿用数十年的控制软件。从官网、脱离隐身公告到后来的 Series B 材料，Revel
              始终把产品定位为全栈硬件控制环境，而不是狭窄的测试工具：直观的指挥控制界面、专用编程语言和高性能运行时，支撑确定性执行、遥测可见性、仪表盘、告警和历史分析。官网现在区分出两个具名产品界面：面向快速硬件测试开发的
              RevelTest，以及面向持续运行工业运营的 RevelC2。这个产品框架很重要，因为它显示公司已经在把自己从单一火箭测试用例推向更广泛的关键物理系统软件定义控制层。
