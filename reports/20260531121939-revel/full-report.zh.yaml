  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 改变判断的证据
    rows:
      - - 投资逻辑：Revel 切中痛点明确的控制层切口
        - 统一的软硬件结合定位、早期客户胜利，以及客户关于更快搭建试车台和替代自研工具的证明
        - 如果尽调显示部署主要是定制服务、可重复性弱，这条投资逻辑会明显削弱
      - - 投资逻辑：品类共鸣真实存在
        - Index、Redpoint 和 Felicis 都把公司定义为高后果硬件基础设施，公司也快速融到 $180M
        - 如果后续需求更多来自投资人风口，而不是持久客户预算，就应下调该信号权重
      - - 投资逻辑：战略选择权有价值
        - NI/Emerson 说明接入软件的测试系统会影响战略买家，Revel 也在相邻测试 / 控制工作流中搭建能力
        - 如果产品和利润率尽调后买家兴趣逻辑站不住，退出选择权就弱于表面
      - - 反向逻辑：公开经济指标不透明
        - 未公开收入、ARR、毛利率、留存、集中度或优先股堆叠披露
        - 私有数据若证实经常性收入、软件毛利和干净条款，该担忧会下降
      - - 反向逻辑：关键任务部署可能很吃支持
        - 演示驱动销售、围绕运营搭建的客户证明，以及关键任务工作流复杂度，都指向不小的实施负担
        - 标准化部署、低服务占比和短价值兑现周期的证据，会降低该威胁
      - - 反向逻辑：估值只来自第三方报道
        - 官方来源确认融资轮次，但未确认精确估值；Sourcery 给出具体 ~$1.005B 数字
        - 公司官方披露或已签署投资条款清单的访问权，会让估值分析可靠得多
    notes: 右栏刻意设置为可证伪：每行都列出会实质上调或下调判断的证据。
