        - 未发现公开标价
        - 首页和预约演示页面把买方导入销售流程
        - 看不到 SKU 列表、席位价格、部署费或年度合同底价
        - 采购必须直接接触销售，基准比较和折扣因此不透明
      - - RevelTest 套餐
        - 产品已命名，实际价格未披露
        - 官网将 RevelTest 定位为硬件测试界面
        - 未知按项目、设施、部署、席位还是用量计价
        - 很难在总拥有成本上直接对比既有测试自动化套件
      - - RevelC2 套餐
        - 产品已命名，实际价格未披露
        - 官网将 RevelC2 定位在持续运行的工业运营上
        - 未知是单独销售、打包销售，还是作为扩展模块销售
        - 扩展经济性可能有吸引力，但公开证据无法证明
      - - 试点转客户路径
        - 有转化证据，但没有实际 ACV
        - Revel 称每个试点都已转化为客户
        - 公开来源未披露试点定价、免费试用结构或付费概念验证条款
        - 转化质量可能很强，但回本和折扣纪律未知
