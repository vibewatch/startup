        - 未知是单独计费还是打包
        - 客户现场部署和一天完成台架设置，说明确有实施工作
        - 没有公开披露把专业服务收入与软件收入分开
        - 软件与服务混合经济性可能遮蔽真实毛利率
      - - 账户与支付
