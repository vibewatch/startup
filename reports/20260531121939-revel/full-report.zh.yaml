        blocks:
          - type: paragraph
            body: >-
              Revel 的资本形成节奏异常压缩。公司脱离隐身材料称，已完成 $30 million 融资，包括由 Felicis 和 Abstract Ventures 领投的种子轮，以及由 Thrive Capital
              领投、抢投的 $23.1 million Series A 轮；早期投资方还披露了 Dylan Field、Earthrise Ventures 和 Commodity Capital。到 2026 年 2
              月，这批早期投资方之后又出现由 Index Ventures 领投的 $150 million Series B 轮，Redpoint 加入，Thrive、Felicis 和 Abstract
              继续跟投。公开来源对融资规模和投资方名单很清楚，对公司从隐身种子轮 / Series A 轮推进到后期机构融资的方向也很清楚；但对当前股权结构表、优先权或官方投后估值并不同样清楚。Sourcery 报道估值大约
              $1.005 billion，但公司官方公告、Index 投资逻辑和其他一手材料都没有给出估值数字。因此，公司显然处于 Series B 阶段，但精确价格更应被视为第三方报道，而非官方确认。
