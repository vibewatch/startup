  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量无法证实
        - 管理层无法按客户和部署类型提供队列收入、ARR 或可信续约证据
        - 投资案例从软件复利故事塌缩为有趣产品，但缺少可用于投资测算的经济性
        - 在报道价格停止推进，待经营数据披露后再重新投资测算
      - - 毛利率 / 服务占比不及预期
        - 部署经济性显示交付偏服务化，或利润率明显低于软件预期
        - 即便需求真实，普通股上行空间也被压缩
        - 不支付溢价倍数；只有估值明显降低才重新审视
      - - 优先股堆叠比报道估值更苛刻
        - 清算优先权、参与型优先股、棘轮条款或其他下行保护明显偏向新钱、压过普通股
        - 报道估值夸大普通股价值
        - 将该轮估值视为不可比，并重设价格预期
      - - 面向常在线控制的安全或保障准备度不可信
        - 公司拿不出面向安全审查、保障和受监管部署预期的可信路线图
        - 广义控制平台的上行空间收窄回仅测试切口
        - 删除乐观情景，只保留窄路径投资逻辑
      - - 试点之外的部署扩张疲弱
        - 客户访谈显示试点没有扩张，或头部账户主导使用但缺少持久续约
        - 先落地再扩张的逻辑破裂，下行融资风险上升
        - 转为回避或仅观察，直到出现新证据
    notes: 这些触发因素是尽调闸门，不是交易信号；每项都会直接改变普通股投资测算逻辑。
