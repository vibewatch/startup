  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Revel
        - 直接控制挑战者
        - 已披露 $150M Series B 轮；公开收入和估值在已审阅来源中仍未获官方说明
        - 从测试走向常开运营的高后果硬件团队
        - 部署快、控制工作流面向操作员，遥测和指令层不绑定硬件
        - 公开定价、装机基础规模和长期合规证明仍有限
      - - NI / LabVIEW
        - 直接测试存量厂商
        - 多版本存量产品，公布标价；当前具体单项规模未知
        - 测试与测量实验室、验证团队、自动化测试系统
        - 测试技术栈广，覆盖部署、分析、编排和语言集成
        - 公开定位中较少强调常开工业指挥控制运营
      - - Beckhoff TwinCAT
        - 直接工业控制存量厂商
        - TwinCAT 自 1996 年起定位为核心控制软件；TwinCAT 准确收入未知
        - PLC、运动控制、HMI、机器人和基于 PC 的自动化团队
        - 基于 PC 的实时控制，配套模块化工程、运行时、HMI、测量和连接能力
        - 相比 Revel 的操作员优先切入口，更偏 PLC 和控制工程
      - - Ignition
        - 直接工业平台存量厂商
        - 成熟工业平台，提供永久、Edge 和云版本；公司准确规模未知
        - SCADA、HMI、IIoT、MES 和车间集成买方
        - 无限服务器许可、强数据集成、快速应用设计、Web 部署
        - 对确定性高后果硬件测试台架的定位没那么直接
      - - Rockwell FactoryTalk
        - 直接工业生态存量厂商
        - 存量自动化软件家族；FactoryTalk 产品线准确收入未知
        - Allen-Bradley 及更广泛工业自动化资产
        - 设计、运营、维护、分析、边缘和硬件集成集中在一个产品家族
        - 棕地项目和控制器生态引力会让它比创业公司切入口更重、更不灵活
      - - Siemens WinCC Unified
        - 直接 HMI / SCADA 存量厂商
        - 存量 HMI 和 SCADA 平台；准确单项规模未知
        - 面板、边缘和基于 PC 的工业可视化与控制团队
        - 开放 API、HTML5 和 JavaScript、Web 客户端、广泛协议互操作
        - 已审阅来源未显示公开定价，也未显示明确的测试台架优先定位
      - - Keysight PathWave Test Automation
        - 直接测试自动化相邻市场
        - 授权制 PathWave 软件，目前有免费社区许可选项；准确商业规模未知
        - 测试自动化开发者和仪器密集型验证工作流
        - 现代测试自动化工具，支持 Linux，发布节奏活跃
        - 已审阅来源未显示完整企业定价或工厂运营广度
      - - MathWorks / Simulink
        - 相邻模型化设计平台
        - 大型工程软件平台；Simulink 细分收入未知
        - 控制、仿真、HIL 和以认证为中心的工程团队
        - 部署前的仿真、代码生成和验证工作流很强
        - 更偏上游设计和认证，不是日常操作员控制
      - - Palantir AIP for Defense（防务 AI 平台）
        - 相邻防务编排平台
        - 大型防务和企业 AI 平台；AIP for Defense 准确收入未知
        - 需要涉密部署、治理和多供应商决策工作流的防务机构
        - 完整审计轨迹、护栏、互操作性和人机协作
