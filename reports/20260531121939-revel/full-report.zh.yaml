  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓解措施 / 尽调问题
    rows:
      - - 快速替换自研工具
        - 既有厂商简化入门套餐，或集成商在 Revel 进入前就把 Ignition、TwinCAT 或 FactoryTalk 标准化
        - 中
        - 要求提供最近三次部署时间线和赢单 / 输单记录，说明买方为何选择 Revel，而不是自研或打包替代方案
      - - 操作员优先的控制与测试 UX
        - 存量工厂和实验室已经围绕既有 HMI、PLC 或 LabVIEW 工作流完成培训
        - 高
        - 索取存量场景客户证明，确认 Revel 替代过成熟既有厂商，而不只是替换内部软件
      - - 面向高后果场景的确定性运行时
        - 买方要求更强的认证、审计和保障证明，接近 Simulink 或 Palantir 式治理预期
        - 高
        - 审查安全、保障和受监管部署路线图，以及航空航天、国防或关键基础设施中的任何引用案例
      - - 硬件无关控制层
        - Beckhoff、Rockwell 和 Siemens 的控制器生态会把采购锁定在现有硬件和集成商关系上
        - 高
        - 审查已支持协议、迁移工具，以及进入既有体系所需的 SI 或渠道准入
      - - 国防扩张邻近性
        - Applied、Shield 和 Palantir 把自主系统、任务控制和治理打包进一个更宽的技术栈
        - 中高
        - 厘清 Revel 计划自己掌控控制层，还是接入更广的自主系统或任务软件栈
      - - 定价不透明
        - 买方会拿 Revel 同有公开标价或成熟报价流程的厂商比较，并可能把不透明的创业公司定价视为执行风险
        - 中
        - 获取价目表、试点 ACV、扩展定价，以及相对 NI 和 Ignition 基准的折扣政策
    notes: 严重性衡量的是对 Revel 当前公开切入点的竞争影响，而不是厂商绝对实力。「缓解措施」列给出在判断护城河耐久性前必须追问的尽调问题。
