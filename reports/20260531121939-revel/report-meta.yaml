companyProfile:
  summary: >-
    Revel is a Los Angeles-area private company building a software-defined control stack for hardware
    testing and mission-critical industrial operations. Founded in late 2024 by Scott Morton after
    more than nine years at SpaceX, Revel emerged from stealth in April 2025 with $30 million across
    seed and Series A financing, then raised a $150 million Series B in February 2026 led by Index
    Ventures. Public proof is strongest around aerospace and advanced-energy customers such as Impulse
    Space, Astro Mechanica, Radiant Nuclear, and Gravitics, plus concrete workflow gains like faster
    test-stand bring-up and scaled RevelTest usage. Revenue, current customer count, full board
    composition, and an officially disclosed valuation remain private.
  foundedDate: null
  founders:
    - name: Scott Morton
      role: Founder & CEO
      background: Former SpaceX control-systems leader who worked on Falcon and Starship test/control software for more than nine years.
      claimRefs: [CO002]
  foundingLocation: Los Angeles, CA
  headquarters: Los Angeles, CA
  productSummary: >-
    Revel sells a multi-layer software platform for physical-system development and operations,
    centered on RevelTest for hardware test workflows, RevelC2 for always-on industrial control,
    RevelCode for deterministic control logic, and browser-based telemetry, dashboards, alerts,
    reporting, and command surfaces.
  customerFocus: >-
    Aerospace, defense-adjacent, advanced-energy, and other hardware-heavy teams that need faster,
    safer, and more observable control of test stands, facilities, or mission-critical systems.
  businessModel: >-
    Enterprise software sold through a high-touch motion around hardware test and control deployments,
    with expansion potential from initial test workflows into broader operational command-and-control
    use cases. Public pricing and contract structure are not disclosed.
  stage: Series B
  fundingStatus: >-
    Publicly disclosed funding totals $180 million, including $30 million across seed and Series A
    by April 2025 and a $150 million Series B in February 2026. The exact post-money valuation was
    not officially disclosed; a third-party report cited roughly $1.005 billion.
  disclosureProfile: private-undisclosed
