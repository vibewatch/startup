- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue / ARR by cohort
    - Monthly and quarterly revenue by customer, cohort, and product surface; pilot-to-production conversion history
    - Without this, the reported valuation cannot be tied to real software scale
    - CFO or finance lead data room export plus cohort walk-through
  - - Gross margin and services mix
    - Gross margin by software versus deployment / implementation services and by major deployment type
    - Determines whether Revel should be underwritten as software, tools-plus-services, or infrastructure
    - Finance package plus delivery-ops review
  - - Customer concentration and renewals
    - Top-10 revenue concentration, renewal dates, expansion rates, and churn history
    - Downside and exit-quality risk cannot be judged without concentration and durability
    - Board deck, revenue schedule, and customer reference calls
  - - Preference stack / dilution
    - Liquidation preferences, participation, seniority, ratchets, option-pool treatment, and ownership table
    - Headline valuation may diverge materially from common-equity value
    - Executed term sheet, cap table, and counsel summary
  - - Security / assurance readiness
    - Security review packet, customer assurance docs, certification roadmap, and evidence for always-on control deployments
    - Bull case assumes expansion into more continuous operational workflows
    - Security lead interview plus diligence-room documents
  - - Exit path realism
    - Inbound strategic interest, M&A dialogue history, and management’s IPO-readiness plan
    - Determines whether M&A optionality is real or merely thematic
    - CEO / board interview and banker references
  notes: These asks are valuation-blocking rather than informational; the recommendation should not improve until they are answered.
