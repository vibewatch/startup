- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Revel (reported Series B)
    - Private round mark
    - Third-party-reported ~$1.005B valuation on $150M Series B; not officially disclosed by the company
    - Current working price anchor for this diligence process
    - Headline mark lacks public revenue, margin, and term-sheet support
  - - Palantir
    - Public market software multiple
    - BVP said Palantir traded near 65x NTM revenue in 2025; SEC materials show 85% Q1 2026 growth and raised FY2026 guidance
    - Shows the upper bound that public defense-software enthusiasm can reach
    - Public liquidity, hyper-growth, and far greater disclosed scale make it a ceiling comp
  - - NI acquired by Emerson
    - Strategic M&A precedent
    - $8.2B acquisition; NI had $1.66B 2022 revenue, ~20% software mix, and ~35,000 customers
    - Demonstrates strategic value for software-connected test and measurement assets
    - Much larger, more mature, and more hardware-entangled than Revel
  - - Shield AI
    - Private defense-software financing precedent
    - $12.7B post-money valuation with $1.5B Series G plus $500M fixed-return preferred equity
    - Shows that 2026 capital remains available for defense-software leaders
    - Structured financing and broader autonomy platform reduce direct comparability
  - - Anduril
    - Private defense platform financing precedent
    - $61B valuation on $5B Series H; company said 2025 revenue reached $2.2B
    - Useful upper-bound signal for software-enabled defense platforms with strategic scarcity
    - Scale, manufacturing footprint, and disclosed revenue base are far beyond Revel’s public profile
  enumerationScope:
    coverage: partial
