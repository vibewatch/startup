- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Diligence confirms repeatable recurring software revenue, acceptable software-like gross margins, low concentration, clean preference terms, and credible security readiness for expansion beyond testing
    - Directional pre-diligence support band of roughly $1.5B–$2.5B; public evidence still does not support exact return math, but upside above the reported mark becomes plausible
    - Security or procurement friction, hidden services intensity, and structured financing terms can still cap upside
    - Low today; requires multiple private-data clears
  - - Base
    - Revel remains strategically strong, but metrics remain only partly shared and investors refuse to pay a narrative-only premium
    - Directional support band of roughly $0.8B–$1.3B, centered near the last reported mark and consistent with a track-or-research-more posture
    - Valuation stays hostage to disclosure gaps and market mood even if product quality remains high
    - Highest current signal
  - - Bear
    - Deployment proof does not translate into clean software economics, concentration is high, or premium sector multiples compress
    - Flat-to-down-round risk below the reported mark; downside range is intentionally broad because public sources do not support exact recovery math
    - Any miss on revenue quality, margin quality, or financing terms can accelerate this outcome
    - Material and non-trivial
  notes: Scenario ranges are directional valuation-support bands rather than model outputs, because public sources do not disclose the inputs needed for precise return forecasting.
