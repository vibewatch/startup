  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Monthly and quarterly revenue or ARR by customer cohort, product surface, deployment type, and conversion path from pilot to production.
    whyItMatters: Without revenue-quality evidence, the reported valuation cannot be tied to software scale, durability, or expansion economics.
    diligencePath: Request a finance export and board-ready cohort analysis, then reconcile it with customer reference calls.
    relatedQuestionRefs:
    - QV013
    - QV024
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: preference-stack
    missingEvidence: Executed term sheet, cap table, liquidation preferences, participation rights, ratchets, and ownership dilution for the latest round.
    whyItMatters: The headline valuation may materially overstate common-equity value if downside protections or seniority are aggressive.
    diligencePath: Obtain counsel-approved financing documents and a board-level cap-table summary.
    relatedQuestionRefs:
    - QV004
    - QV023
    - QV024
  - type: private-evidence-only
    severity: material
    topic: concentration-and-renewals
    missingEvidence: Top-customer concentration, contract renewal dates, expansion history, and churn or contraction data.
    whyItMatters: Downside risk and exit quality depend heavily on whether revenue is durable or concentrated.
    diligencePath: Review customer schedules, renewal calendars, and reference calls for the top revenue accounts.
    relatedQuestionRefs:
    - QV023
    - QV024
    - QV029
  - type: missing-source
    severity: material
    topic: control-assurance
    missingEvidence: Security-review package, assurance roadmap, and evidence that always-on control use cases can clear customer and regulator scrutiny.
    whyItMatters: The bull case assumes Revel can move beyond test workflows into more continuous operational control without trust or compliance friction.
    diligencePath: Meet the security owner, review customer security questionnaires, and inspect the assurance roadmap for regulated deployments.
    relatedQuestionRefs:
    - QV019
    - QV023
    - QV026
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: A broader set of directly comparable private control-layer software transactions with disclosed terms and scale.
    whyItMatters: The current comp set is directional, but it mixes public multiples, M&A, and broader defense platforms because no perfect public analog is available.
    diligencePath: Supplement with banker precedent decks, private market databases, and management commentary on live peer sets.
    relatedQuestionRefs:
    - QV018
    relatedTableRefs:
    - TV004
