- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Revel occupies a painful control-layer wedge'
    - Unified software-for-hardware positioning, early customer win, and customer proof around faster stand bring-up and replacing homegrown tools
    - If diligence shows deployments are mostly bespoke services with weak repeatability, this thesis weakens materially
  - - 'THESIS: Category resonance is real'
    - Index, Redpoint, and Felicis all frame the company as infrastructure for high-consequence hardware, and the company has raised $180M quickly
    - If follow-on demand depends more on investor fashion than durable customer budgets, the signal should be discounted
  - - 'THESIS: Strategic-option value exists'
    - NI/Emerson shows software-connected test systems can matter to strategic buyers, and Revel is building in adjacent test/control workflows
    - If no buyer-interest logic survives after product and margin diligence, exit optionality is weaker than it appears
  - - 'ANTI-THESIS: Public economics are opaque'
    - No public revenue, ARR, gross margin, retention, concentration, or preference-stack disclosure
    - Private-data confirmation of recurring revenue, software margins, and clean terms would move this concern down
  - - 'ANTI-THESIS: Mission-critical deployments may be support-heavy'
    - Demo-led sales, customer proof around operational setup, and mission-critical workflow complexity all suggest non-trivial implementation burden
    - Evidence of standardized deployment, low services mix, and short time-to-value would make this less threatening
  - - 'ANTI-THESIS: The valuation is only third-party reported'
    - Official sources confirm the rounds but not the exact mark; Sourcery supplies the specific ~$1.005B figure
    - Official company disclosure or signed term-sheet access would make valuation analysis much more reliable
  notes: 'The right-hand column is intentionally falsifiable: each row names the evidence that would materially upgrade or downgrade the call.'
