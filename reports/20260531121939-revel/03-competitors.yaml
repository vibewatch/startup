- id: capability-packaging-and-pricing
  title: Capability Coverage, Packaging, and Pricing Mechanics
  body: |-
    The direct incumbents do not compete on exactly the same packaging model, but they all give buyers a reason to stay inside an existing stack. NI discloses the clearest list pricing: multiple LabVIEW editions sold as subscription or perpetual licenses, with higher tiers adding builder, analytics, and full test-system software such as TestStand, FlexLogger, InstrumentStudio, and DIAdem. Beckhoff takes a different route: engineering is free, but runtime and function licenses are paid and tied to platform levels, which lowers trial friction while preserving runtime monetization and installed-base stickiness. Ignition’s server-centric model is another strong economic wedge, promising unlimited tags, users, and clients under one server license, then monetizing support plans, cloud usage, modules, and redundant-node expansion.

    Rockwell and Siemens compete less through transparent list pricing than through ecosystem pull. Rockwell’s FactoryTalk family spans design, operations, maintenance, analytics, and hardware; its newer Optix and Design Studio surfaces add capability-based runtime licensing, cloud collaboration, and AI-assisted control design. Siemens pushes WinCC Unified as a future-proof HMI and SCADA layer running from panel to edge to PC, with HTML5, JavaScript, web clients, APIs, and broad protocol interoperability. Those offers are not necessarily cheaper than Revel, but they are easier for many brownfield buyers to justify because they connect into controller, HMI, and services estates already in place.

    Pricing transparency itself is part of the competitive comparison. NI and Ignition disclose the most actionable public packaging mechanics in the reviewed set. Beckhoff reveals enough to understand free engineering and performance-based runtime licensing, but not enough for clean TCO comparisons without a quote. Rockwell, Siemens, Palantir, Shield AI, Applied Intuition, MathWorks, and Revel mostly push buyers toward demos, trials, or sales engagement. That opacity does not mean those vendors are weak; it means procurement gravity will often favor whichever stack a buyer already knows how to budget and approve.
