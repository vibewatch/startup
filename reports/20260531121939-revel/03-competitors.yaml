- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Public price / contract model
  - Included capabilities
  - Unknowns / discounts
  - Implication
  rows:
  - - Revel
    - unknown public list price or package tiers
    - RevelTest and RevelC2 positioning around hardware test, telemetry, command, and always-on operations
    - Contract length, seat model, deployment pricing, and discounts unknown
    - Buyers need direct sales engagement, which limits simple benchmark comparisons against transparent incumbents
  - - NI / LabVIEW
    - Base $560/year or $1,959 perpetual; Full $1,731/year or $6,057 perpetual; Professional $2,750/year or $9,625 perpetual; LabVIEW+ Suite $4,155/year or $14,543 perpetual; deployment licenses per target computer
    - Base test and control environment, higher tiers add AI, builders, report and database tools, and full suite adds TestStand, FlexLogger, InstrumentStudio, and DIAdem
    - Enterprise discounts and realized seat economics unknown
    - Transparent list pricing helps direct budget comparison, but deployment and suite expansion can raise total cost quickly
  - - Beckhoff TwinCAT
    - Engineering free; runtime and function licenses paid by platform level and options
    - PLC engineering, real-time runtime, HMI, measurement, vision, and connectivity modules
    - Exact runtime price by hardware profile and function mix mostly quote-based
    - Low development-entry friction but brownfield runtime economics depend on hardware footprint
  - - Ignition
    - Standard and Edge are one-time perpetual licenses per server; Cloud Edition usage-based; support plans billed annually at 16%, 20%, or 24% of retail depending on tier
    - Unlimited tags, users, designers, devices, modules, and web clients within the chosen server license footprint
    - Suite list prices and negotiated enterprise discounts not visible in the fetched text; redundancy adds extra license cost
    - Economics strongly favor large tag and user counts, making server standardization sticky once adopted
  - - Rockwell Optix / Design Studio
    - Capability-based runtime licensing plus free 90-day Optix Studio Pro trial and free Studio Standard download; ordering usually through sales or ordering guides
    - HMI, IIoT, edge runtime, cloud design, AI plan-and-build workflows, remote deployment, controller integration
    - Production runtime price, subscription mix, and bundle discounts unknown
    - Procurement advantage often comes from existing controller and services relationships rather than transparent list prices
  - - Siemens WinCC Unified
    - unknown public list price in reviewed source pack
    - Panel, edge, and PC HMI or SCADA, APIs, web clients, protocol integrations
    - License tiers, service pricing, and enterprise discounts unknown
    - Buyers inside Siemens estates can likely buy it as part of a broader project quote rather than a simple SKU benchmark
  - - Keysight PathWave Test Automation
    - Requires a license; community license available at no cost but without support or warranty
    - Test automation editor, package manager, results viewer, timing analyzer, Linux support
    - Commercial enterprise pricing and support packaging unknown
    - Shows there are still modern test-automation alternatives beyond LabVIEW, but economics remain opaque without a quote
  - - MathWorks / Simulink
    - contact sales / trial oriented in reviewed source pack
    - Simulation, model-based design, HIL, code generation, certification-aligned workflows
    - Add-on toolbox pricing and realized enterprise discounts unknown
    - Strong engineering workflow option, but not a transparent apples-to-apples runtime-control price comparison
  - - Palantir / Shield / Applied
    - demo or quote oriented; no public list pricing in reviewed sources
    - Defense AI, autonomy middleware, mission control, integration, governance, human-machine teaming
    - Contract structure, deployment basis, and services mix unknown
    - These stacks sell into program budgets and capability wedges rather than SKU-level commodity pricing
  notes: The table records public pricing or packaging only where directly supported. unknown cells intentionally preserve missing evidence instead of backfilling from memory or reseller claims.
