- calloutType: risk
  title: Incumbency is the main competitive threat
  body: The deepest risk is not that another startup copies Revel’s product category. It is that NI, Beckhoff, Ignition, Rockwell, Siemens, or adjacent defense stacks already own enough workflow, trust, and procurement surface area to make switching look unnecessary.
  claimRefs:
