- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Fast replacement of homegrown tooling
    - Incumbents simplify starter packages or integrators standardize on Ignition, TwinCAT, or FactoryTalk before Revel lands
    - Medium
    - Ask for three recent deployment timelines and win or loss notes showing why buyers chose Revel over both homegrown and packaged alternatives
  - - Operator-first control and test UX
    - Brownfield plants and labs are already trained on incumbent HMI, PLC, or LabVIEW workflows
    - High
    - Request brownfield references where Revel displaced a mature incumbent rather than only replacing internal software
  - - Deterministic high-consequence runtime
    - Buyers demand stronger certification, audit, and assurance proof closer to Simulink or Palantir-style governance expectations
    - High
    - Review security, assurance, and regulated-deployment roadmap plus any references in aerospace, defense, or critical infrastructure
  - - Hardware-agnostic control layer
    - Controller ecosystems from Beckhoff, Rockwell, and Siemens lock procurement to existing hardware and integrator relationships
    - High
    - Audit supported protocols, migration tooling, and SI or channel access for moving into incumbent estates
  - - Defense expansion adjacency
    - Applied, Shield, and Palantir bundle autonomy, mission control, and governance into one wider stack
    - Medium-High
    - Clarify where Revel is intended to own the control layer versus plug into broader autonomy or mission software stacks
  - - Pricing opacity
    - Buyers compare against vendors with public list prices or well-known quote processes and may view opaque startup pricing as execution risk
    - Medium
    - Obtain price cards, pilot ACVs, expansion pricing, and discount policy versus NI and Ignition benchmarks
  notes: Severity reflects competitive impact on Revel’s current public wedge, not absolute vendor strength. The mitigation column names diligence asks needed before underwriting moat durability.
