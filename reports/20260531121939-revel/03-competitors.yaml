  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: negotiated-pricing
    missingEvidence: Real enterprise quotes, expansion discounts, and support pricing for NI, Ignition, Beckhoff, Rockwell, Siemens, and Revel in comparable deployments.
    whyItMatters: Pricing transparency determines whether Revel wins on total cost or only on deployment speed and product ergonomics.
    diligencePath: Request anonymized quote packs or procurement screenshots from three recent competitive deals and map them against the TP003 comparison rows.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: enumeration-incomplete
    severity: material
    topic: installed-base
    missingEvidence: Installed-base counts by target vertical for NI, Beckhoff, Ignition, Rockwell, Siemens, and Keysight in aerospace, advanced energy, critical infrastructure, and defense-adjacent programs.
    whyItMatters: Installed-base density is a major determinant of switching costs, partner leverage, and how realistic brownfield displacement is for Revel.
    diligencePath: Pull customer-logo sets, disclosed reference counts, reseller or SI program data, and any public installed-base metrics by vertical before underwriting expansion assumptions.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: incumbent-displacement-proof
    missingEvidence: Brownfield references showing Revel displacing a mature incumbent stack rather than only replacing homegrown tooling.
    whyItMatters: The moat case is much stronger if Revel can prove wins against standardized NI, Ignition, TwinCAT, or FactoryTalk environments instead of just internal tools.
    diligencePath: Ask management for a reference set of competitive takeouts, including lost deals and deployment timelines, broken down by homegrown versus packaged-incumbent replacement.
