  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue quality not substantiated
        - Management cannot provide cohort revenue, ARR, or credible renewal evidence by customer and deployment type
        - The case collapses from software compounding story to interesting product without underwritable economics
        - Stop at the reported price and re-underwrite only after operating data is shared
      - - Gross margin / services mix disappoints
        - Deployment economics show services-heavy delivery or margin profile materially below software expectations
        - Common-equity upside compresses even if demand is real
        - Do not pay a premium multiple; revisit only at a materially lower valuation
      - - Preference stack is more punitive than the headline suggests
        - >-
          Liquidation preferences, participating preferred, ratchets, or other downside protections materially favor new
          money over common
        - The reported mark overstates common-equity value
        - Treat the round mark as non-comparable and reset price expectations
      - - Security or assurance readiness is not credible for always-on control
        - >-
          Company cannot evidence a convincing roadmap for security reviews, assurance, and regulated deployment
          expectations
        - The broad control-platform upside narrows back to a test-only wedge
        - Cut the bull case and keep only a narrow-track thesis
      - - Deployment expansion beyond pilots is weak
        - Reference calls show pilots are not expanding, or top accounts dominate usage without durable renewals
        - The land-and-expand thesis breaks and downside financing risk rises
        - Move to avoid or watch-only until new evidence emerges
    notes: >-
      Triggers are framed as diligence gates rather than trading signals; each one directly changes the common-equity
      underwriting logic.
