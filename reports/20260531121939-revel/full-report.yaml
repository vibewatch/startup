        title: Financial, Governance, and Key-Person Opacity
        blocks:
          - type: paragraph
            body: >-
              Financial risk is amplified by disclosure asymmetry. Public sources establish that Revel has raised a
              large amount of capital quickly, but they do not disclose revenue, burn, gross margin, services mix, cash
              balance, runway, or concentration by customer. That leaves investors underwriting a valuation story with
              thin operating telemetry. Third-party coverage reported the Series B at roughly a $1.0 billion valuation,
              while the company’s own announcement omitted valuation entirely. That is not unusual for private
              companies, but it matters more here because the business model may be meaningfully shaped by deployment
              services, qualified hardware, and security/compliance work that do not show up in narrative traction
              posts.


              Governance disclosure is similarly limited. The public record emphasizes founder-market fit and the
              addition of an Index board seat, but reviewed company materials do not spell out broader board
              composition, formal KPI cadence, or management-layer depth. The last explicit company headcount update in
              the reviewed corpus said Revel had 18 people a little over a year after founding; the company is obviously
              larger now, but the current scale is not publicly disclosed. That combination creates two related risks:
              key-person dependence on Scott Morton for credibility and product vision, and the possibility that future
