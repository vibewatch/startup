      - number: '8.4'
        title: Exit Readiness, Kill Triggers, and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              On current public evidence, Revel looks more like a future strategic-acquisition candidate than an IPO
              candidate. The NI precedent shows that software-connected test and measurement platforms can be
              strategically valuable to industrial acquirers, and Revel’s control-layer positioning could be relevant to
              automation, industrial software, or defense-platform buyers if it compounds. But IPO readiness depends on
              a much more mature public disclosure surface than Revel currently offers. The inactive revel.build domain
              is a minor signal, yet directionally consistent with the bigger point: the company has not chosen to
              expose the metrics public-market investors would expect.


              That is why the kill triggers here are concrete. If diligence cannot substantiate ARR quality, gross
              margin by deployment type, and customer expansion beyond pilots, the valuation case breaks even if the
              product is beloved. If the latest round contains heavy preference overhang or structured downside
              protection that is invisible in headline coverage, the common-equity story resets. If the company cannot
              show credible security and assurance readiness for always-on control in regulated environments, the
              narrative should revert from broad control-platform upside back to a narrower test-software wedge.


              The final diligence asks are therefore less about confirming that Revel is interesting and more about
              confirming that the reported price is investable. Until those asks are cleared, the correct stance is
              disciplined curiosity rather than conviction.
