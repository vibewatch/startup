      - number: '1.3'
        title: Capital Base, Investors, and Stage Progression
        blocks:
          - type: paragraph
            body: >-
              Revel’s capital formation has been unusually compressed. The company’s stealth-launch materials state that
              it raised $30 million across a seed round led by Felicis and Abstract Ventures and a preemptive $23.1
              million Series A led by Thrive Capital, with Dylan Field, Earthrise Ventures, and Commodity Capital also
              disclosed in the early investor set. By February 2026, that early investor base had been followed by a
              $150 million Series B led by Index Ventures, with Redpoint joining and Thrive, Felicis, and Abstract
              returning. Public sources are clear on the round size and investor list, and they are directionally clear
              on stage progression from stealth seed/Series A to later-stage institutional financing. They are not
              equally clear on the current capitalization table, preferences, or an official post-money valuation.
              Sourcery reports a roughly $1.005 billion valuation, but the official company announcement, Index thesis,
              and other primary-source material do not state a valuation number. That means the company is clearly at
              Series B stage, but the precise price is better treated as third-party reported than officially confirmed.
