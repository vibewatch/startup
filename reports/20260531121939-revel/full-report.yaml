      - number: '4.3'
        title: Cost Structure and Unit Economics Gaps
        blocks:
          - type: paragraph
            body: >-
              Revel’s public cost structure looks much heavier than commodity SaaS even though it remains
              software-first. The senior-backend posting describes a data platform built for high-volume,
              high-frequency, high-cardinality industrial telemetry with long-term retention and a transition toward
              more cloud-based systems. The full-stack role emphasizes real-time and streaming workflows in
              browser-based operator interfaces. The hardware-platform role is even more revealing: Revel expects to
              qualify x86 and ARM hardware, select networking equipment and storage, monitor fleet health with
              Prometheus and Grafana, run burn-in and latency campaigns, and support air-gapped environments with secure
              boot, TPM, encryption, and image signing. Separate roles for DevOps, HIL, simulation, and runtime systems
              imply continued spend on test infrastructure, validation, release tooling, and deterministic execution
              rather than on simple CRUD software.


              The important distinction is between visible cost buckets and invisible unit economics. Public evidence is
              strong enough to say Revel likely spends heavily on engineering payroll, observability and storage
              infrastructure, deployment tooling, field hardware qualification, validation, and customer-facing
              implementation support. Public evidence is not strong enough to calculate gross margin,
              software-versus-services mix, CAC, payback, or contribution margin by deployment type. In other words, the
              chapter can identify what probably consumes cash, but not how efficiently Revel converts that spending
              into recurring software gross profit. That is the core unit-economics gap.
