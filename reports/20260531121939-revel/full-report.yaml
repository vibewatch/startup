  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Revel is not publicly presenting itself as a point tool. Across its homepage, company page, launch post,
              and Series B materials, the company consistently describes a comprehensive command-and-control software
              platform that spans hardware development, deployment, and live operation from prototype through
              production. The public module map is also unusually legible. RevelTest is the testing wedge, aimed at
              quick-turn benchtop setups, iterative R&D programs, and prototype-to-production test workflows. RevelC2 is
              the broader operational surface for unified facility-wide control, always-on critical operations, and
              operator-centric control rooms. The homepage then fills in the technical subcomponents that sit underneath
              those products: automated system discovery and configuration, real-time telemetry, RevelCode for hardware
              control logic and runtime checks, browser-based dashboards, programmable alerts, and historical data with
              report and log export.


              The customer evidence matters because it shows those surfaces are not just naming conventions. Astro
              Mechanica’s case study says Revel replaced a homegrown control platform, went live on an engine stand
              within a day, let operators write RevelCode and build dashboards themselves, and added telemetry,
              alerting, and abort logic that did not previously exist. Official 2026 materials say Impulse now runs more
              than 80 instances of RevelTest and that Revel is extending the same stack beyond test into industrial
              control across nuclear, refinery, water, power, defense, data-center, and biomedical environments.
              Publicly, the product definition is therefore supportable: Revel appears to sell an integrated software
              stack for hardware test and control, with RevelTest as the best-proven surface and RevelC2 as the
              expansion surface with growing but still thinner public deployment proof.
