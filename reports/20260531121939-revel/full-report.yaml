      - number: '5.3'
        title: Deployment, Integration, Reliability, and Support
        blocks:
          - type: paragraph
            body: >-
              Revel’s public evidence points to a high-touch deployment model. The strongest proof is the Astro
              Mechanica case study: Revel says it integrated with the customer’s existing environment, connected to an
              in-house driver protocol, and got a replacement test stand operational within a day. That is stronger
              evidence than a generic “easy integration” slogan because it shows the company claims to work with
              customer-specific hardware interfaces and not just clean-sheet demos. The Solutions Engineer role
              reinforces that interpretation by explicitly describing customer-site deployment and a field-feedback loop
              back into the roadmap. The DevOps role adds another layer: Revel is building reproducible deployment
              systems for edge compute and embedded environments, CI/CD pipelines, and fleet delivery across remote
              devices. This is not the footprint of a simple cloud-only console.


              Reliability engineering also looks real, but still partly internal to the company rather than externally
              attested. Hardware Platform hiring describes x86 and ARM qualification, compatibility matrices, Linux
              tuning for real-time workloads, Prometheus/Grafana fleet-health instrumentation, secure boot, TPM 2.0,
              disk encryption, image signing, and air-gapped deployments. Separate HIL and simulation roles show that
              test infrastructure, validation, and pre-live assurance are explicit investment areas. That is the good
              news. The limit is public disclosure: the reviewed material does not publish supported hardware matrices,
              integration catalogues, rollback behavior, uptime commitments, incident history, or failure-rate metrics.
              Publicly, Revel looks technically serious about deployment and reliability, but the buyer still needs a
              private diligence package to underwrite how repeatable those deployments are across many customers and
              sectors.
