        blocks:
          - type: paragraph
            body: >-
              Revel’s disclosed financing history is straightforward even if the valuation is not. The company publicly
              disclosed $30 million across seed and Series A by April 2025, then a $150 million Series B in February
              2026, for $180 million of disclosed equity funding. Official materials say the latest round funds team
              expansion, product development, and broader market deployment. What they do not say is equally important:
              no official source in the reviewed pack gives an exact post-money valuation, common dilution, liquidation
              preference stack, or other terms that determine whether the headline mark is actually representative of
              common-equity value.


              That gap forces valuation work onto directional precedents rather than direct transfer. Palantir shows
              that defense-adjacent software can command extraordinary public multiples, but BVP’s ~65x NTM revenue
              observation sits on hyper-growth and public liquidity that Revel has not publicly matched. Emerson’s $8.2
              billion acquisition of NI is strategically relevant because it proves industrial buyers value
              software-connected test systems, yet NI brought $1.66 billion of revenue, 35,000 customers, and a much
              more mature software-plus-hardware footprint. Shield AI and Anduril prove that private defense-software
              capital remains abundant in 2026, but both rounds rest on broader platforms, more disclosed scale, or
              structured financing that make their headline marks imperfect guideposts.


              The right read-through is not that Revel deserves those marks by association. It is that the market will
              pay rich prices for defense and industrial software only when there is clearer proof of scale, growth
              durability, or strategic scarcity than Revel currently discloses publicly. That makes the reported Series
              B mark a working ceiling for public underwriting, not a validated floor.
            claimRefs:
              - CV003
