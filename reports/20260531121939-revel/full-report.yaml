        title: Exhibits
        blocks:
          - type: callout
            title: The biggest market risk is boundary inflation
            body: >-
              The available public datasets are large because they include broad automation, IIoT, equipment, and
              services categories. Revel still needs bottom-up evidence showing how much of that spend is reachable
              software budget rather than adjacent context.
            calloutType: risk
            claimRefs:
