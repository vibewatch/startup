  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Assurance Risk
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk is that Revel increasingly presents itself as infrastructure for defense,
              energy, and industrial control before there is comparable public evidence of a mature compliance and
              assurance program. Company pages and the Series B narrative push beyond test software into
              command-and-control use cases for critical systems, while one public job posting carries U.S.
              export-regulation / ITAR-style eligibility language. That combination does not prove a current violation,
              but it does mean investors should assume the regulatory perimeter is broader than a conventional devtools
              story. The relevant failure mode is not a dramatic public incident; it is slower, quieter friction:
              customer security reviews, export-control questions, staffing constraints for foreign nationals, and
              elongated procurement in regulated accounts.


              Privacy and security obligations add a second layer. Revel’s privacy policy covers account, device, usage,
              professional, and potentially payment information, so the company is not only selling operational
              software; it is also holding data that can trigger consumer and commercial security duties. Public U.S.
              guidance from CISA, NIST, the California Attorney General, and the FTC makes the bar clear:
              secure-by-design defaults, logging, access control, incident planning, and privacy-rights response
              processes matter. The gap is that reviewed public materials do not disclose named third-party assurance
              milestones such as SOC 2, ISO 27001, or IEC 62443, and the public lawsuit / enforcement record is only
              partially knowable from open sources. No public lawsuit or enforcement action was found in reviewed
              sources, but that should be treated as a diligence path, not as cleared legal risk.
