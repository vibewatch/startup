  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              Revel should be framed as the software layer inside industrial automation and control systems, hardware
              test environments, and defense or other mission-critical control workflows—not as a generic all-software
              company. Revel’s own product language is unusually explicit: the platform is built to develop, deploy, and
              command hardware systems from prototype through production, with RevelTest aimed at hardware testing and
              RevelC2 aimed at always-on industrial operations. The February 2026 company announcement extends that
              scope across aerospace, defense, robotics, advanced energy, and industrial markets as physical systems
              become more autonomous and software-driven.


              That boundary matters because the largest available public market numbers include spend that Revel does
              not capture directly. Grand View’s industrial automation and control systems estimate includes control
              valves, DCS, SCADA, robotics, and full plant-control infrastructure; Precedence’s IIoT estimate is broader
              still because it spans sensors, connectivity, services, and software-defined production processes. Those
              categories are useful outer envelopes, but Revel’s practical wedge is the runtime, telemetry, command,
              alerting, and operator workflow layer that can replace homegrown control code or displace incumbent
              automation suites. The status quo is therefore not generic SaaS; it is a mix of in-house tooling,
              PLC/SCADA suites, test software, and emerging defense autonomy stacks.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
