companyProfile:
  summary: >-
    Revel is a Los Angeles-area private company building a software-defined control stack for hardware testing and
    mission-critical industrial operations. Founded in late 2024 by Scott Morton after more than nine years at SpaceX,
    Revel emerged from stealth in April 2025 with $30 million across seed and Series A financing, then raised a $150
    million Series B in February 2026 led by Index Ventures. Public proof is strongest around aerospace and
    advanced-energy customers such as Impulse Space, Astro Mechanica, Radiant Nuclear, and Gravitics, plus concrete
    workflow gains like faster test-stand bring-up and scaled RevelTest usage. Revenue, current customer count, full
    board composition, and an officially disclosed valuation remain private.
