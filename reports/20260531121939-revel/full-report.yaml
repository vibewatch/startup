  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Surfaces, and Disclosure Limits
        blocks:
          - type: paragraph
            body: >-
              Revel clearly looks like a software company, but the public record stops short of giving investors the
              normal software metrics. Official product pages show a unified platform that spans hardware development,
              testing, deployment, telemetry, and always-on control from prototype through production. The homepage
              names two product surfaces — RevelTest for hardware testing and RevelC2 for industrial operations — which
              is enough to support a product-led revenue map, even though no page discloses whether contracts are priced
              by site, seat, device, deployment, or annual platform commitment. The demo page reinforces that Revel
              sells through a sales conversation, not a posted price card: the call to action is to request a demo and
              the proof point is faster test throughput, not self-serve onboarding or transparent SKU pricing.


              That opacity matters. Revel’s privacy policy shows the company expects accounts and payment information in
              its services stack, which supports the existence of paid software relationships, but it does not reveal
              billing mechanics. Public evidence therefore supports only a constrained conclusion: Revel almost
              certainly monetizes software for test and command-and-control workflows, likely with contract revenue tied
              to deployments and expansion, while realized pricing, ACV, renewal structure, and software-versus-services
              mix remain undisclosed. This chapter intentionally does not backfill missing numbers from memory or comps.
              Publicly, the business model is legible; the pricing model is not.
