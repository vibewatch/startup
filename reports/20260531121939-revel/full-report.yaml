chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Platform Scope
        blocks:
          - type: paragraph
            body: >-
              Revel describes itself as a comprehensive software platform for developing, deploying, and commanding
              hardware systems from prototype through production. The company launched publicly in April 2025 after
              roughly six months of work and framed its mission as replacing decades-old control software used in
              aerospace, energy, manufacturing, automotive, and other industrial settings. Across its homepage,
              stealth-launch post, and later Series B materials, Revel consistently presents the product as a full-stack
              hardware-control environment rather than a narrow test utility: an intuitive command-and-control
              interface, a specialized programming language, and a high-performance runtime that supports deterministic
              execution, telemetry visibility, dashboards, alerts, and historical analysis. The homepage now
              distinguishes two named product surfaces: RevelTest for rapid hardware test development and RevelC2 for
              always-on industrial operations. That product framing matters because it shows the company already
              positioning itself beyond a single rocket-test use case and toward a broader software-defined control
              layer for critical physical systems.
