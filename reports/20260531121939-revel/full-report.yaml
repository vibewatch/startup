      - number: '8.3'
        title: Bull, Base, Bear, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              Because Revel does not disclose the operating metrics needed for a conventional private-software valuation
              model, the scenario framework here is intentionally broad and directional. The bull case is not simply
              “Revel keeps growing.” It specifically requires proof that current deployments convert into repeatable
              recurring software revenue, that support and implementation work do not overwhelm margins, and that the
              company can extend from testing into more continuous control workflows without security or procurement
              friction breaking the motion. If those conditions clear, a valuation comfortably above the reported round
              is plausible because comparable markets have rewarded defense and industrial software aggressively.


              The base case is more conservative and more consistent with the evidence actually available now. Revel
              looks like a strong company with real category resonance, but public evidence still supports tracking
              around the last reported mark rather than paying up for a narrative-only premium. That implies a rough
              support band around the current reported valuation, not a confident upside case. The bear case is
              straightforward: if deployments do not translate into clean software economics, or if premium sector
              multiples compress, the company could face a flat-to-down financing despite strong product quality.


              Entry discipline follows from that setup. The price today should be treated as a diligence question, not
              an assumption. Exact target returns and hold periods would be fabricated precision without revenue,
              margin, and cap-table inputs. Investors should instead underwrite whether the next piece of evidence is
              more likely to move the company into the bull lane or expose a bear-lane term reset.
            claimRefs:
