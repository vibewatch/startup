      - number: '1.2'
        title: Founder-Market Fit, Team Pedigree, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Scott Morton is the central public figure in Revel’s story, and the public record gives him unusually
              strong founder-market fit for this product. Fortune, Index Ventures, Redpoint, and Felicis all anchor the
              story in Morton’s more than nine years at SpaceX building and operating control software used in Falcon
              and Starship environments where one bad line of code can create catastrophic failure. Revel’s official
              materials extend that pedigree to a broader engineering cohort from SpaceX, Anduril, and Palantir, which
              supports the claim that the team understands real-time, mission-critical systems rather than approaching
              hardware control as generic SaaS. Public governance disclosure is much thinner. The February 2026 Series B
              announcement states that Index partner Nina Achadjian joined the board, but the company does not publish a
              full board roster, independent-director list, or broader executive bench on its public site. That
              asymmetry makes founder dependence material: Morton is simultaneously the public face, technical
              credibility anchor, and the clearest named executive in the fetched source set.
            claimRefs:
              - CO002
              - CO012
              - CO016
              - CO018
              - CO019
