      - number: '1.4'
        title: Customer Proof and Early Operational Traction
        blocks:
          - type: paragraph
            body: >-
              For a company this young, Revel has unusually concrete public operating proof even though it does not
              disclose revenue or customer count. The stealth-launch post identified Impulse Space as the first customer
              and said the software was already deployed at an engine-test facility. By February 2026, the company’s own
              afterburner-round post claimed that Impulse ran more than 80 instances of RevelTest across hardware
              testing facilities, that engine-test stand setups had fallen from 14 days to eight hours, and that
              propulsion teams moved from testing every other day to multiple times per day. The homepage and syndicated
              Series B coverage broaden public customer proof to Radiant Nuclear, Gravitics, Astro Mechanica, and
              Orbital Operations, while the Astro Mechanica case study adds a concrete deployment narrative: replacement
              of a homegrown control platform in one day, operator-authored automation, and use of dashboards, alerting,
              and abort logic during live test operations. The strongest public proof therefore comes from testimonials
              and case-study anecdotes rather than traditional SaaS metrics.
