      - number: '2.4'
        title: Growth Drivers, Constraints, and Remaining Gaps
        blocks:
          - type: paragraph
            body: >-
              The bullish case for this market is straightforward. Grand View ties automation growth to smart
              manufacturing, predictive maintenance, cloud SCADA, digital twins, AI-enabled automation, and real-time
              process visibility. Precedence describes IIoT growth around machine-to-machine communication,
              software-defined production, low-cost sensing, AI diagnostics, and OT/IT convergence. On the defense side,
              BVP and NSTXL both describe 2026 momentum from procurement modernization, rapid prototyping, AI, autonomy,
              cybersecurity, and more software-defined systems. SIPRI, DOT&E’s annual-report cadence, and the FY2026
              Operational Test and Evaluation budget request all reinforce that defense modernization and test
              infrastructure remain funded institutions rather than one-off experiments.


              The constraints are equally material. Buyers already use entrenched stacks such as LabVIEW, TwinCAT,
              Ignition, FactoryTalk, and model-based engineering tools that combine engineering, runtime, analytics, and
              HMI functions. Mission-critical deployments also face auditability, certification, and compliance burdens:
              RTCA’s DO-178C ecosystem highlights formal software assurance expectations, Palantir stresses audit trails
              and guardrails for defense AI, and BIS maintains export-control infrastructure for advanced technologies.
              The core unresolved question is therefore not whether the broad adjacency is large; it is how much budget
              is actually available to an outside vendor replacing incumbent or in-house control software in
              high-consequence programs.
            claimRefs:
