chapter:
  number: 6
  title: Customers
  summary: Revel’s public customer proof is real but still narrow. Impulse Space is the strongest production-like reference because deployment at an engine test facility and a footprint of more than 80 RevelTest instances are both disclosed; Astro Mechanica is the next-best proof via a detailed case study and customer quote; Gravitics and Radiant Nuclear have usable but thinner signals; Orbital Operations is only weakly supportable from a testimonial. The chapter’s central risk is not whether Revel has any customers, but whether a handful of aerospace and advanced-energy references overstates durability, diversification, and revenue concentration while on-site deployment and sales hiring imply a high-touch motion.
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation and Buyer Roles
  body: |-
    Public customer evidence points to a buyer set concentrated in technically sophisticated hardware programs rather than general industrial software teams. The supportable named accounts cluster into five segments: in-space mobility (Impulse Space), advanced energy and nuclear (Radiant Nuclear), large space structures and orbital infrastructure (Gravitics), orbital defense/intercept programs (Orbital Operations), and supersonic propulsion testing (Astro Mechanica). Company materials also talk about automotive, manufacturing, robotics, and broader industrial control, but those categories remain narrative-led rather than backed by named public deployments.

    The likely commercial pattern is a technical sale into engineering leadership, followed by operator adoption and enterprise approval. The first account executive role is explicitly aerospace-focused, while the solutions engineer role centers on deploying systems at customer sites and closing the loop between field usage and product direction. That mix implies the buyer is often an engineering executive or technical program owner, the daily users are test operators and software or propulsion engineers, and the payer is a budget owner willing to sponsor a mission-critical tooling change. As of runDate, public proof still supports an aerospace-first wedge with adjacent expansion into advanced energy more than a broad industrial installed base.
