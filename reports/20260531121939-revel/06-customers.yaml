- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver / risk
  - Current evidence
  - Impact
  - Why it matters
  - Diligence path
  rows:
  - - 'Expansion driver: more surfaces inside one account'
    - Impulse has 80+ instances across facilities
    - Positive
    - Shows multi-instance spread is possible once a customer standardizes on Revel
    - Ask how many modules, stands, or sites this footprint spans
  - - 'Expansion driver: deeper adoption at existing account'
    - Astro Mechanica says it expects to expand use as it scales
    - Positive
    - Suggests a land-and-expand path inside engineering programs
    - Request committed expansion roadmap or signed scope change
  - - Reference concentration risk
    - A handful of logos dominate public proof
    - Material
    - A small public set can overstate diversification if one account is unusually important
    - Request top-account revenue mix and full customer count
  - - Sector concentration risk
    - Named accounts cluster in aerospace, space infrastructure, and advanced energy
    - Material
    - Makes the industrial-expansion thesis less proven than the company narrative implies
    - Request named or anonymized accounts outside these sectors
  - - High-touch deployment burden
    - Solutions Engineer role centers on deploying systems at customer sites
    - Material
    - On-site support can slow scaling and pressure gross margins
    - Request implementation time, team-to-account ratio, and travel burden
  - - Early sales-playbook risk
    - First AE role says Revel is still establishing the revenue playbook
    - Material
    - Commercial repeatability may lag product fit
    - Request sales-cycle data, win rates, and repeatable ICP definition
  - - Channel / partner gap
    - No public evidence of reseller or channel-led motion
    - Minor to material
    - Direct-only growth can work, but it limits leverage outside the initial beachhead
    - Ask whether any integration, OEM, or channel partners materially source pipeline
  notes: The table distinguishes upside drivers from risks without inventing revenue concentration, contract length, or retention metrics that are not publicly disclosed.
