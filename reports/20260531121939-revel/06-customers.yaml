- id: named-customer-proof-quality
  title: 'Named Customer Proof Quality: Production, Pilot, and Unknown'
  body: |-
    Public proof is not evenly distributed across the named accounts. Impulse Space is the strongest row because deployment location, operational use, and scaled instance count are all visible. Astro Mechanica is next: the evidence is company-controlled, but it is unusually specific, includes a named executive, and describes replacement of a homegrown system, live stand operation, and operator-written automation. Those two accounts are enough to conclude Revel has moved beyond slideware and into real hardware programs.

    Radiant Nuclear and Gravitics are credible but thinner proofs. Radiant has a testimonial and independent naming, but no public installation detail. Gravitics has the best quantified single outcome outside Impulse, yet no third-party deployment confirmation. Orbital Operations is only weakly supportable: the homepage testimonial shows some relationship, but it does not tell investors whether the account is a pilot, production deployment, reference customer, or simply a friendly quote. The result is a chapter where named proof exists, but proof quality drops sharply after the top two accounts and does not yet solve the diligence questions around breadth, stage mix, or independent corroboration.
