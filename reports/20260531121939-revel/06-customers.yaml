  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-base-denominator
    missingEvidence: Total active customer count by vertical, stage (pilot vs production), and named vs unnamed mix.
    whyItMatters: Without a denominator, the public logo set can overstate or understate concentration and makes cross-vertical adoption impossible to judge.
    diligencePath: Request a current account list or segmented customer counts showing pilots, production deployments, and vertical mix as of runDate.
    relatedQuestionRefs:
    - QU005
    - QU018
    - QU026
  - type: private-evidence-only
    severity: material
    topic: renewal-and-contract-duration
    missingEvidence: Contract lengths, renewal dates, churn history, and customer-specific expansion terms.
    whyItMatters: Durability cannot be inferred from testimonials alone; contract mechanics determine whether today’s reference accounts persist into recurring revenue.
    diligencePath: Request anonymized contract summaries, renewal schedules, and any available customer-success reporting for named accounts.
    relatedQuestionRefs:
    - QU017
    - QU027
  - type: private-evidence-only
    severity: blocking
    topic: top-account-revenue-share
    missingEvidence: Revenue concentration by top customer, including whether Impulse or any other reference account represents a material share of ARR.
    whyItMatters: Reference concentration is visible publicly, but economic concentration is the real risk variable for valuation and downside underwriting.
    diligencePath: Request top-5 customer revenue mix, pipeline concentration, and any single-account exposure thresholds used by management or the board.
    relatedQuestionRefs:
    - QU020
    - QU027
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: Independent corroboration of deployment stage for Radiant Nuclear, Gravitics, and Orbital Operations, plus any additional named accounts outside the current public set.
    whyItMatters: The named-customer table is only a public slice; weaker rows remain difficult to classify as production, pilot, or reference-only without more direct evidence.
    diligencePath: Request customer reference calls or third-party deployment evidence for medium- and low-confidence rows, and reconcile the table against the full customer list.
    relatedQuestionRefs:
    - QU001
    - QU012
    - QU013
    - QU014
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: channel-motion
    missingEvidence: Any public reseller, partner-led, OEM, or systems-integrator channel evidence tied to customer acquisition.
    whyItMatters: A purely direct model is not fatal, but it affects sales efficiency, onboarding cost, and expansion pace outside Revel’s initial aerospace beachhead.
    diligencePath: Ask management whether any channel, integration, or OEM relationships contribute pipeline or deployments, and obtain supporting partner materials if they exist.
    relatedQuestionRefs:
    - QU025
