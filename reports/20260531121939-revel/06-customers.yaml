- id: retention-durability-and-evidence-gaps
  title: Retention, Durability, and What Public Evidence Cannot Show
  body: |-
    Public materials provide very little direct durability evidence. Revel says every pilot it has run has converted into a customer, and Astro Mechanica’s executive quote suggests at least one account sees room to expand. Customer testimonials from Impulse, Radiant, and Gravitics are all directionally positive. Those are useful signals, but they do not add up to a retention framework. No reviewed source discloses customer count, NRR, GRR, churn, cohort retention, contract length, renewal dates, or customer-specific expansion ARR.

    That means the customer chapter cannot legitimately make a strong durability claim on public evidence alone. The right reading is narrower: Revel has multiple credible indications of early customer satisfaction and at least one public claim of pilot-to-customer conversion, but renewal mechanics, contract terms, and the economics of expansion remain private. This is where investors should resist over-extrapolation from testimonials. A handful of strong stories can prove product value; they do not, by themselves, prove recurring revenue durability or low churn.
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
