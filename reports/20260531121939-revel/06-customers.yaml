  - TU006
- id: expansion-vs-concentration-risk
  title: Expansion Opportunity Versus Concentration Risk
  body: |-
    Revel’s upside case is visible in the shape of the current proof. Impulse already shows multi-instance spread across testing facilities, and Astro Mechanica openly says it expects to expand use as the program scales. Those are the right early signals for a land-and-expand motion: start on a painful test or control workflow, prove faster iteration or operator leverage, then add more stands, sites, or adjacent command-and-control surfaces. The company’s narrative about moving from test infrastructure toward broader industrial control is coherent with that pattern.

    The risk is that public proof is still concentrated in a few logos and a few adjacent sectors. The named accounts are overwhelmingly aerospace, space infrastructure, defense-adjacent, or advanced energy. The solutions engineer role implies customer deployments remain high touch and field-assisted, while the first aerospace AE implies the commercial playbook is still being formalized. No public evidence points to a channel-led acquisition model, and no public data shows whether Impulse or another marquee logo dominates revenue. In other words, expansion potential is credible, but concentration and execution risk remain material until Revel can show a broader, more self-scaling customer base.
