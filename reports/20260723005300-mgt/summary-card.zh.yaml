  topStrengths:
    - SLED 技术服务赛道首家且唯一独角兽——市场位置独特，缺少直接可比公司
    - 程序化 M&A 引擎已跑通：2016 年以来完成 13 笔收购，并统一品牌、整合平台
    - 2021 年以来收入年复合增长率 144%，规模扩张速度罕见
    - 全服务线深耕 SLED 领域；覆盖 52 个州级 MSA，完成 30,000+ 个客户项目
    - 机构投资人背书强：Vistria Group、J.P. Morgan、WhiteHorse Capital 和 Ares Management（AUM $595B）
    - 2026 年外部认可度高：AI-as-a-Service Solution of the Year、#3 E-Rate provider、GovTech 100
  topRisks:
    - Ares $350M 投资采用信贷结构且债务条款未披露；增长放缓时会放大杠杆风险
    - 收入和增长指标均由公司披露，缺少经审计财务文件，质量未验证
    - 快速 M&A 带来整合风险：9 年 13 笔收购，文化、运营和技术一致性都要经受考验
    - CEO Trey Traviesa 主导四年价值创造计划，关键人风险突出
    - SLED 预算回归常态：约 50% 的州预计 2026 年收入增长放缓或普通基金下降
    - 政府采购复杂且周期长，压低收入可预测性和可见度
  unresolvedGaps:
    - 需要经审计财务报表来验证 $400M+ 收入、CAGR 和 EBITDA 利润率
    - Ares 信贷投资条款（利率、到期日、契约）未公开披露
    - 股权结构表和 Vistria 持股比例未披露；J.P. Morgan 角色不清
    - 技术服务与咨询服务的收入拆分不可得
    - 经常性客户与项目制客户组合、客户集中度数据未披露
    - PE 控股下的董事会构成和治理权利缺少文件支持
