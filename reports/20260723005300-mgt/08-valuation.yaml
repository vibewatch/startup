- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Dimension
  - Thesis (Bull)
  - Anti-Thesis (Bear)
  - Net View
  rows:
  - - Market demand
    - SLED IT, cyber, AI, and modernization demand create a large addressable opportunity.
    - Budget normalization and public-sector procurement delays can slow bookings.
    - Positive market, moderate growth, not SaaS-speed by default.
  - - Growth
    - MGT claims >$400M 2024 revenue and 144% revenue CAGR since 2021.
    - Revenue is company-stated, unaudited, and organic-vs-acquired split is not public.
    - Strong signal, medium confidence until QoE.
  - - Distribution
    - OMNIA and E-Rate relevance can reduce procurement friction for SLED buyers.
    - Revenue by vehicle, E-Rate exposure, and concentration are not disclosed.
    - Useful channel, but concentration proof needed.
  - - Revenue quality
    - Cyber and managed IT can create recurring managed-services revenue.
    - Advisory, implementation, E-Rate, and roll-up work can be project-based and lower margin.
    - Hybrid potential, but services discount applies.
  - - Capital structure
    - Ares credit participation suggests lender diligence and cash-flow confidence.
    - Credit capital can add covenants, debt service, and refinancing risk.
    - Mild positive signal, not equity validation.
  notes: Bull and bear arguments are paired to avoid treating company-stated growth, channel access, or lender support as
    conclusive valuation evidence.
