- id: TV004
  title: Comparable Valuation Table
  columns:
  - Company
  - Business Mix
  - EV/Revenue (approx)
  - Recurring/Margin Profile
  - Relevance to MGT
  rows:
  - - Tyler Technologies
    - Public-sector software and payments leader
    - ~5x+ revenue screen
    - Higher recurring software mix and public-company margins
    - Useful upper ceiling; MGT should not automatically receive Tyler software multiple
  - - Accenture
    - Global consulting, outsourcing, and public-service technology
    - ~3x revenue broad IT-services lens
    - Services-heavy with scale and diversified delivery
    - Closer services benchmark for base-case multiple discipline
  - - CGI
    - Government and enterprise IT services
    - ~1.5x-2x revenue services range
    - Integration and managed services, lower software purity
    - Relevant lower services benchmark for delivery-heavy revenue
  - - Leidos / SAIC
    - U.S. government technology and mission services
    - ~1x-1.5x revenue services range
    - Contracted services and systems integration
    - Downside lens if MGT is primarily project/services revenue
  - - ICF
    - Government consulting and digital services
    - ~1x revenue services lens
    - Consulting and implementation economics
    - Relevant if advisory/services mix dominates
  - - MGT
    - Private SLED services platform with managed-services upside
    - ~3.1x implied on >$400M revenue floor
    - Private, unaudited, services-heavy with possible recurring pockets
    - Above pure services peers and below Tyler; requires proof of hybrid quality
  notes: Comparable set is a public-evidence sample, not exhaustive; multiples are approximate revenue-multiple lenses drawn
    from retained market-data and public-company context.
  enumerationScope:
    coverage: sample
    basis: Publicly traded public-sector IT and government services comparables benchmarked on revenue multiples
