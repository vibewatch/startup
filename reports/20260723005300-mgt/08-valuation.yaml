schemaVersion: report-v2
artifact: valuation
slug: mgt
runDate: '2026-07-23'
company:
  name: MGT
chapter:
  number: 8
  title: Valuation
  summary: 'MGT''s valuation is credible enough to merit continued diligence but not public-evidence buy support: the stated
    $1.25 billion value implies roughly 3x company-stated revenue and sits above pure services peers but below Tyler''s software
    ceiling. The final recommendation is research-more / conditional track, with audited financials, debt terms, recurring-revenue
    proof, customer concentration, and integration evidence as the decisive asks.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and Price Discipline
  body: MGT is a credible scale platform, but the valuation recommendation should remain research-more / conditional track
    rather than buy. The strongest public facts are the $1.25 billion stated valuation, $350 million Ares credit investment,
    company-stated 2024 revenue above $400 million, and 144% revenue CAGR since 2021. Those facts support a serious diligence
    process and justify watching the company closely. They do not, by themselves, underwrite price. The revenue base is unaudited
    publicly, the Ares capital is credit-fund capital rather than a clean equity round, and the public record lacks EBITDA,
    gross margin, organic growth, recurring share, customer concentration, and covenant terms. At roughly 3x company-stated
    revenue, MGT looks fair-to-stretched for a services-heavy platform unless private diligence proves software-like retention
    and margin durability.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV011
  - CV029
  - CV030
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-and-anti-thesis
  title: Thesis and Anti-Thesis
  body: 'The bull case is real enough to keep MGT on the investment committee agenda. SLED buyers need modernization, cybersecurity,
    AI enablement, E-Rate-supported connectivity, and advisory capacity; MGT has public proof of broad services, cooperative-channel
    access, and a large client and engagement footprint. The anti-thesis is equally important. This is not a pure SaaS company
    in the public record. MGT describes technology and advisory services, but it does not disclose recurring revenue, renewal
    cohorts, service-line margins, backlog, or organic growth. Ares lender involvement is a constructive signal because sophisticated
    credit investors evaluate cash-flow support, yet debt holders are not common-equity validators. The resulting thesis is
    conditional: if recurring managed services and margins are proven, MGT can deserve a premium; if not, it should be valued
    closer to government IT services peers.'
  claimRefs:
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
  - CV017
  - CV018
  - CV044
  tableRefs:
  - TV002
- id: scenario-analysis
  title: Bull, Base, and Bear Scenario Analysis
  body: 'The cleanest public valuation method is a revenue-multiple sensitivity because MGT does not publish EBITDA, free
    cash flow, gross margin, or retention. The base case uses the stated valuation as a reference point: $1.25 billion divided
    by a revenue floor slightly above $400 million is roughly 3.1x revenue. That multiple is not obviously irrational if MGT
    proves high growth, recurring managed-services revenue, durable margins, and broad customer diversification. It is also
    not cheap if the company is mostly services, advisory, and acquisition-driven project work. The bull case requires audited
    scale and a premium hybrid multiple. The bear case applies a lower services multiple or revenue haircut, particularly
    if public-market comps compress, the Ares facility limits cash flow, or audited results miss public claims.'
  claimRefs:
  - CV003
  - CV005
  - CV010
  - CV019
  - CV020
  - CV021
  - CV031
  - CV032
  - CV035
  tableRefs:
  - TV003
  figureRefs:
  - FV002
  - FV003
- id: comparable-valuation-benchmarking
  title: Comparable Valuation Benchmarking
  body: Comparable valuation should bracket MGT between a public-sector software ceiling and services-heavy floors. Tyler
    Technologies is the most relevant public SLED software leader because it sells public-sector software at much larger scale
    and can support a premium revenue multiple. MGT should not receive Tyler's multiple unless management proves recurring
    software-like economics. Accenture is a better broad services reference for a roughly 3x revenue base-case lens, while
    CGI, Leidos, SAIC, and ICF are useful government IT and consulting comps for lower services multiples. MGT's implied 3x
    revenue multiple therefore prices a premium to pure services peers and a discount to the Tyler software ceiling. That
    is a defensible conditional position only if the company demonstrates recurring managed services, retention, margins,
    and acquisition integration quality.
  claimRefs:
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV031
  tableRefs:
  - TV004
- id: kill-triggers-and-monitoring
  title: Kill Triggers and Monitoring
  body: 'The final chapter should turn uncertainty into explicit monitoring rules. MGT should be re-underwritten or passed
    if audited revenue is materially below the public $400 million floor, if organic growth is materially weaker than the
    144% CAGR narrative implies, or if service-line margins look like low-end consulting rather than managed-services economics.
    The Ares facility creates a second set of hard triggers: covenant breach, refinancing failure, high cash interest burden,
    or collateral constraints would turn the credit capital from a growth enabler into a valuation overhang. Commercial triggers
    matter as well, including loss of a cooperative vehicle, E-Rate disruption, customer concentration, a major breach, security
    litigation, or leadership disruption without succession proof. These are not known events; they are diligence thresholds.'
  claimRefs:
  - CV010
  - CV029
  - CV031
  - CV032
  - CV033
  - CV034
  - CV035
  - CV042
  tableRefs:
  - TV005
  figureRefs:
  - FV004
- id: final-diligence-asks-and-verdict
  title: Final Diligence Asks and Verdict
  body: The verdict is conditional rather than negative. MGT has the scale, sponsor backing, and market relevance to merit
    continued diligence, but the public valuation case cannot be closed without a data room. The highest-value ask is audited
    financials plus a quality-of-earnings bridge that separates organic from acquired growth and reconciles revenue, EBITDA,
    free cash flow, and working capital. The next asks are recurring-revenue definitions, renewal cohorts, customer and channel
    concentration, service-line P&Ls, Ares credit documents, certification and incident history, and acquisition integration
    scorecards. A buy view would require those materials to confirm durable growth, manageable leverage, defensible customer
    retention, and a credible exit route. Without that proof, the appropriate stance is research-more at disciplined price,
    not valuation-chasing.
  claimRefs:
  - CV028
  - CV036
  - CV037
  - CV038
  - CV039
  - CV040
  - CV041
  - CV042
  - CV044
