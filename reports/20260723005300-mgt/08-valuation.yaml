  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Revenue quality and recurring mix
    missingEvidence: Revenue by service line, recurring-versus-project split, backlog, renewal cohorts, NRR, churn, and organic
      versus acquired growth bridge
    whyItMatters: The implied 3x revenue multiple is only defensible if public revenue scale converts into durable recurring
      revenue and margins.
    diligencePath: Request audited financials, QoE, revenue cohort schedules, ARR or managed-services definitions, backlog,
      and acquired-cohort performance.
    relatedQuestionRefs:
    - QV005
    - QV007
    - QV009
    relatedTableRefs:
    - TV002
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Ares credit terms and covenant capacity
    missingEvidence: Credit agreement, interest rate, maturity, amortization, collateral, covenant package, lender model,
      and compliance history
    whyItMatters: Credit-fund capital can support growth or create a valuation overhang depending on debt-service capacity
      and refinancing flexibility.
    diligencePath: Review the Ares credit documents, covenant model, debt-service forecast, refinancing options, and board
      liquidity plan.
    relatedQuestionRefs:
    - QV011
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Customer and channel concentration
    missingEvidence: Revenue by top customer, state, vertical, OMNIA or other cooperative vehicle, E-Rate exposure, renewal
      status, and gross margin by channel
    whyItMatters: Client-count and engagement-count claims do not reveal whether revenue is concentrated in channels or customers
      that could reset valuation.
    diligencePath: Request concentration schedules, channel attribution, contract renewal calendar, E-Rate revenue history,
      and customer reference calls.
    relatedQuestionRefs:
    - QV018
    relatedTableRefs:
    - TV005
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: Comparable Valuation Table TV004 sample coverage
    missingEvidence: Exhaustive public-company and M&A transaction comp set with live enterprise values, revenue, EBITDA,
      growth, margins, and acquisition premiums
    whyItMatters: TV004 is a representative public-evidence benchmark, not a full valuation banker comp book; additional comps
      could shift the fair multiple range.
    diligencePath: Build a banker-style comp set using real-time market data, M&A databases, sponsor deal comps, and private-company
      financial detail.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: Cap table, preferences, dilution, and exit readiness
    missingEvidence: Fully diluted cap table, liquidation preferences, debt paydown requirements, sponsor ownership, employee-owner
      plan economics, and expected exit timetable
    whyItMatters: Return potential depends on the securities stack and exit route, not just enterprise value and revenue multiple.
    diligencePath: Request cap table, preference stack, debt waterfall, employee-ownership plan documents, sponsor hold-period
      assumptions, and exit-scenario model.
    relatedQuestionRefs:
    - QV030
    - QV022
    relatedTableRefs:
    - TV001
    - TV006
