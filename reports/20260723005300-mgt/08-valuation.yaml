- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Revenue Assumption
  - Multiple
  - Implied Value
  - Key Driver
  rows:
  - - Bull
    - Revenue grows above the $400M floor and recurring managed-services mix is proven
    - 3.5x-4.0x revenue
    - $1.5B-$1.8B illustrative
    - Audited growth, high retention, margin durability, and premium hybrid positioning
  - - Base
    - Company-stated revenue floor is broadly accurate but revenue quality remains services-heavy
    - ~3.0x revenue
    - $1.2B-$1.3B illustrative
    - Current stated valuation is near fair value but requires debt and QoE proof
  - - Bear
    - Revenue is haircut or multiple resets toward government-services peers
    - 1.5x-2.0x revenue
    - $0.6B-$0.9B illustrative
    - Unaudited revenue, debt pressure, organic-growth weakness, or multiple compression
  - - Pass case
    - Debt stress, covenant breach, or audited revenue materially misses public claims
    - Below 1.5x or no supportable bid
    - Re-underwrite / pass
    - Credit structure and revenue quality overpower market tailwinds
  notes: Scenario values are rough revenue-multiple sensitivities using public revenue claims; they are not a DCF or audited
