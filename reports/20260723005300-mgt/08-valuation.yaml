- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Signal
  - Impact on Thesis
  - Severity
  rows:
  - - Audited revenue materially below public $400M claim
    - QoE, audit, or monthly accounts show a lower scale base
    - Implied multiple rises and valuation support weakens immediately
    - High
  - - Covenant breach or refinancing failure
    - Ares credit facility cannot be serviced or refinanced on acceptable terms
    - Debt overhang overwhelms growth and acquisition platform narrative
    - High
  - - Loss of key cooperative contract or E-Rate channel
    - OMNIA, E-Rate, or similar public-sector route is suspended or de-emphasized
    - Distribution advantage and revenue visibility deteriorate
    - Medium-High
  - - Major breach, litigation, or certification failure
    - Client security incident, regulatory action, or failed security diligence
    - Cyber trust and public-sector procurement eligibility are impaired
    - High
  - - CEO departure without succession proof
    - A. Trey Traviesa exits and management depth is not validated
    - Execution and capital-market confidence weaken during integration
    - Medium
  - - Comparable multiple compression
    - Government IT services valuation screens fall or PE activity remains weak
    - Exit valuation and base-case multiple reset lower
    - Medium-High
  notes: Triggers are proposed investment-committee thresholds; public sources do not indicate these events have occurred.
