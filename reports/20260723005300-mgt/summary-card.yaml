  topStrengths:
    - First and only unicorn in SLED technology services—distinctive market position with no direct comparator
    - 'Proven programmatic M&A engine: 13 acquisitions since 2016 with unified brand and platform integration'
    - 144% compound annual revenue growth since 2021 creating exceptional scale velocity
    - Deep SLED domain expertise across all service lines; 52 state MSAs and 30,000+ client engagements
    - 'Institutional investor confidence: Vistria Group, J.P. Morgan, WhiteHorse Capital, and Ares Management ($595B AUM)'
    - 'Strong 2026 recognition: AI-as-a-Service Solution of the Year, #3 E-Rate provider, GovTech 100'
  topRisks:
    - $350M Ares investment is credit-structured with undisclosed debt terms—creates leverage risk if growth decelerates
    - Revenue and growth metrics are company-stated with no audited financial disclosure; quality unverified
    - >-
      Rapid M&A integration risk: 13 acquisitions in 9 years creates cultural, operational, and technology coherence
      challenges
    - Dependence on CEO Trey Traviesa who architects the four-year value-creation plan; key-person risk
    - 'SLED budget normalization: ~50% of states projecting slower revenue growth or general fund declines in 2026'
    - Government procurement complexity and long cycles create revenue predictability and visibility challenges
  unresolvedGaps:
    - Audited financial statements needed to verify $400M+ revenue, CAGR, and EBITDA margins
    - Ares credit investment terms (interest rate, maturity, covenants) not publicly disclosed
    - Cap table and Vistria ownership percentage not disclosed; J.P. Morgan role unclear
    - Revenue breakdown between technology services and advisory services not available
    - Recurring vs. project-based client mix and client concentration data not disclosed
    - Board composition and governance rights under PE majority control not documented
