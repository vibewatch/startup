  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: certification gaps
    missingEvidence: SOC 2, FedRAMP, StateRAMP, ISO 27001, penetration-test, and security-policy evidence for the applicable MGT offerings.
    whyItMatters: Public security and AI governance claims cannot be converted into buyer-grade assurance without named certification scope and
      audit evidence.
    diligencePath: Request current certification reports, bridge letters, control matrices, pentest summaries, and security questionnaires from
      management.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: roadmap gaps
    missingEvidence: Formal release calendar, product roadmap, AI Experience Center packaging, pricing, API/docs surface, and roadmap owner.
    whyItMatters: The AI center is new and roadmap opacity affects whether it is a scalable product line or a bespoke services motion.
    diligencePath: Request product roadmap, release notes, sales collateral, backlog, mgt.ai analytics, and roadmap governance materials.
    relatedQuestionRefs:
    - QE017
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: integration gaps
    missingEvidence: Post-acquisition integration KPIs, shared toolchain, delivery playbooks, customer cross-sell rates, and retention of acquired
      technical teams.
    whyItMatters: MGT’s breadth is a core strength only if acquired capabilities have been integrated into repeatable delivery and support operations.
    diligencePath: Interview integration owners and review operating dashboards, org charts, common systems migration, and acquired-team retention
      data.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: quality gaps
    missingEvidence: Uptime, incident history, response-time attainment, SLA exceptions, customer support metrics, and managed-service renewal/retention
      evidence.
    whyItMatters: Managed services are only as valuable as proven reliability, support quality, and renewal durability; public pages do not disclose
      these metrics.
    diligencePath: Request SLA history, ticket data, incident postmortems, NOC/SOC dashboards, customer references, and renewal cohorts.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE004
