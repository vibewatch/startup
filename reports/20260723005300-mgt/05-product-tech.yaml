  - - AI & data / AI Experience Center
    - Governed AI agents and digital employees for SLED workflows using private cloud AI, privacy-preserving inference, and GPU acceleration
    - 'Partner-composed: MGT service design + HPE infrastructure + Protopia inference + NVIDIA acceleration'
    - New 2026 launch / early commercialization
    - Customer adoption, usage, pricing, and production outcomes not public
  - - Networking, physical security, and E-Rate
