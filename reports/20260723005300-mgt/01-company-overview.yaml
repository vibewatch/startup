callouts:
  - calloutType: "strength"
    title: "First and Only SLED Technology Unicorn"
    body: >
      MGT's $1.25 billion valuation established it as the first unicorn in the SLED technology services
      industry—a significant market position that signals institutional confidence in the sector and gives
      MGT a competitive differentiation story that no direct competitor can replicate.
    claimRefs: [CO018, CO019]

  - calloutType: "risk"
    title: "Ares Investment is Credit, Not Equity—Debt Service Risk"
    body: >
      The $350 million from Ares Management was structured through Ares Credit funds, not as equity.
      This means MGT carries a debt obligation with potential covenants, interest, and maturity that are
      not publicly disclosed. If growth decelerates or acquisitions underperform, debt service could
      strain cash flows. The lack of audited public financials makes it impossible to independently assess
      the company's debt coverage ratios or leverage.
    claimRefs: [CO021, CO023, CO024, CO025]

  - calloutType: "assumption"
    title: "Revenue and Impact Metrics Are Company-Reported"
    body: >
      The $400M+ projected 2024 revenue, 144% CAGR, and impact metrics (200M people, 20M K-12 students)
      are all company-stated figures without independent audit or third-party verification identified in
      public sources. Diligence should seek audited financials and independent verification of these metrics.
    claimRefs: [CO007, CO008, CO029]

  - calloutType: "insight"
    title: "Programmatic M&A as Core Strategy"
    body: >
      MGT's 13 acquisitions since 2016 reflect a deliberate platform-building strategy—adding capabilities
      in cybersecurity, IT infrastructure, education performance, human capital, and higher education finance.
      This programmatic M&A has driven the majority of employee and revenue growth, but integration complexity
      and cultural cohesion across acquired entities represent execution risk at scale.
    claimRefs: [CO036, CO037, CO038, CO039]

