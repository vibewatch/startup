company:
  name: "MGT"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    MGT is a Tampa, Florida-based national technology and advisory solutions leader serving the state,
    local, and education (SLED) government sector, founded in 1974 and operating under new leadership
    since 2016. In December 2025, the company closed a $350 million investment from Ares Management,
    achieving a $1.25 billion valuation and becoming the first unicorn in the SLED services industry,
    midway through a four-year value-creation plan that has tripled enterprise value since April 2023.

sections:
  - id: "identity-and-business-model"
    title: "Identity, Headquarters, and Business Model"
    body: >
      MGT (mgt.us) is a national technology and advisory solutions leader headquartered in Tampa, Florida,
      serving state, local, and education (SLED) government clients across the United States. The company
      was founded in 1974 by experts in education and government management—though some company materials
      reference 1975 as the founding year, a minor discrepancy the company has not publicly reconciled.
      MGT describes itself as committed to "impacting communities for good," providing specialized solutions
      that address mission-critical priorities at the top of government client leadership agendas. The
      company's product and service portfolio spans technology modernization and AI, cyber and campus
      security, human capital management, fiscal and facilities management, and K-12 school improvement.
      MGT operates as an employee-ownership model and serves as a trusted advisory and implementation
      partner to over 2,500 SLED clients nationally. Under new leadership since 2016, MGT has transformed
      from a niche education consulting firm into a diversified government technology platform through a
      combination of organic growth and 13 strategic acquisitions. Revenues were projected to exceed
      $400 million in 2024, with compound annual revenue growth of 144% since 2021. The company's unified
      brand was launched in September 2024, integrating 10+ prior acquisitions under the singular MGT
      identity on mgt.us. The tagline "Impacting communities for good" reflects MGT's social impact
      mission and differentiates the company from pure-play IT service providers.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: "leadership-and-governance"
    title: "Leadership, Governance, and Key-Person Dependence"
    body: >
      MGT's leadership team is anchored by CEO A. Trey Traviesa, who has been central to the company's
      transformation since taking the helm and driving the aggressive M&A and growth strategy. Lawrence
      Cowan serves as Chief Operating Officer of Revenue Operations and is the public-facing media contact
      for major transactions. Thomas Cahill holds the role of Senior Vice President, Partner and Alliance
      Solutions, with public visibility on major technology partnerships such as the HPE-Protopia AI center
      announced in March 2026. In early 2026, MGT expanded its leadership team with Omar Bhatti as EVP and
      President of the Technology Solutions Group, and Adam Appleby as EVP and President of Advisory
      Solutions—demonstrating the company's move to a more structured enterprise architecture. Ibrahim
      "Ibo" Otun was appointed as Chief AI and Information Officer to lead the firm's AI factory, enterprise
      technology, and data platforms. Stefan Schmidt, Vice President of Field Engineering, was recognized
      in CRN's 2026 Next-Gen Solution Provider Leaders list. Key-person risk exists primarily around CEO
      Traviesa, whose strategic vision drives the four-year value-creation plan. Governance structure as a
      private company backed by majority investor The Vistria Group (since April 2023) and institutional
      investors J.P. Morgan, WhiteHorse Capital, and Ares Management places control with institutional
      investors. The board composition has not been publicly disclosed in detail. MGT's employee-ownership
      model, referenced repeatedly in press releases, aligns employee incentives with company growth and
      value creation. The company has not disclosed any material leadership departures or governance
      controversies in public filings or press releases reviewed for this report.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017]
    tableRefs: [TO002]

  - id: "funding-and-investors"
    title: "Funding History, Valuation, and Investor Map"
    body: >
      MGT's financing history accelerated sharply with The Vistria Group's majority investment in April
      2023, which triggered the current four-year value-creation plan. Since that investment, the company
      tripled its enterprise value by December 2025. The pivotal transaction in MGT's history to date is
      the December 3, 2025 close of a $350 million investment from Ares Credit funds (Ares Management
      Corporation, NYSE: ARES), which valued the company at $1.25 billion and positioned it as the first
      unicorn in the SLED services industry. The Ares investment is structured as credit rather than
      equity, which is important for understanding the capital structure—it is debt-like capital intended
      to fund acquisitions and organic growth acceleration, not a traditional venture equity round. Existing
      institutional investors include The Vistria Group (majority shareholder, $17B AUM impact investment
      firm), J.P. Morgan, and WhiteHorse Capital. Ares Management (NYSE: ARES, $595 billion AUM as of
      September 2025) participated through its Opportunistic Credit strategy, led by Craig Snyder,
      Co-Head of Opportunistic Credit. The $1.25 billion valuation makes MGT the first privately held SLED
      technology services company to reach unicorn status, a widely cited market milestone. Total capital
      raised prior to the Ares investment has not been publicly disclosed; the company has not released
      audited financials or detailed balance sheet data. The Ares capital is explicitly earmarked for
      larger acquisitions and growth acceleration as part of the ongoing value-creation plan.
    claimRefs: [CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: "scale-metrics-and-reach"
    title: "Scale, Traction, and Geographic Reach"
    body: >
      As of December 2025, MGT employs over 1,100 employee-owners and serves more than 2,500 SLED clients
      across the United States. The company reports annual impact reaching over 200 million people,
      including 20 million K-12 students. MGT operates across multiple states—company marketing materials
      cite service across 38+ states, though independent verification of the exact state count is
      unavailable. The company holds over 50 Master Service Agreements with government entities and has
      completed more than 30,000 client engagements over its operating history. Key metrics include
      100+ projects for state agencies, 38 projects with State Departments of Education (DOEs), and 52
      state agency Master Service Agreements as disclosed on the company's state government solutions page.
      In 2025, MGT ranked No. 830 on the Inc. 5000 list of fastest-growing private companies with 508%
      growth, and No. 6 on CRN's Fast Growth 150 list for fastest-growing technology companies in North
      America. MGT has been named to the 2026 GovTech 100, a recognition for top companies driving
      innovation for state and local government. The company ranked No. 3 as an E-Rate provider for the
      2026 season (Year 29), highlighting leadership in education technology connectivity programs. MGT
      was awarded the 2026 AI-as-a-Service Solution of the Year by AI Breakthrough for its secure,
      governance-first AI approach. Employee count reflects rapid growth from 900+ professionals in
      September 2024 to 1,100+ by December 2025, a 22% headcount expansion in approximately 15 months.
    claimRefs: [CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO035]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: "milestones-and-adverse-signals"
    title: "Key Milestones, Strategic Developments, and Adverse Signals"
    body: >
      MGT's transformation accelerated in 2016 with new leadership and an acquisition-led growth strategy.
      Between 2020 and 2024, the company completed 10 acquisitions that were integrated under the MGT
      brand, including Cira Infotech (cybersecurity), Layer 3 Communications (IT infrastructure and
      managed services), GovHR USA (human capital), AMS.NET (IT and physical security), and rpk GROUP
      (higher education finance). The April 2023 Vistria Group majority investment funded the current
      phase of growth. The September 2024 brand unification consolidated all acquired entities under
      MGT, launching the mgt.us platform. December 2025 saw the landmark Ares investment at $1.25B
      valuation. In March 2026, MGT announced a national AI Experience Center in partnership with
      Protopia AI and HPE to enable secure AI deployment for SLED agencies. MGT made a minority
      investment in Eddi in 2026, an AI platform for education and government grant management.
      Key adverse signals and open questions include: (1) the company has not publicly disclosed audited
      revenue, EBITDA margins, or profitability; (2) the Ares investment is credit-based rather than
      equity, creating debt service obligations not visible from public disclosures; (3) rapid M&A
      integration risk remains—13 acquisitions since 2016 with varying cultural and technical maturity;
      (4) an Inc. 5000 profile shows 508% growth, but the baseline period and measurement methodology
      are not independently verified; (5) founding year discrepancy (1974 vs. 1975 across MGT materials)
      represents a minor data integrity issue. No lawsuits, regulatory sanctions, data breaches, or
      material leadership controversies were identified in publicly available sources reviewed for this
      chapter as of July 2026.
    claimRefs: [CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043]

