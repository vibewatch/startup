- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Gap
  - Public Status
  - Impact on Underwriting
  - Diligence Path
  - Related Requirement
  rows:
  - - Audited financial statements
    - Not public; MGT is private
    - Blocks verification of revenue, EBITDA, cash flow, and debt capacity
    - Request audited statements, QoE report, and monthly management accounts
    - Public traction and gaps
  - - EBITDA / gross margin / net income
    - Not disclosed
    - Prevents valuation, leverage, and margin-path analysis
    - Request service-line P&L, gross margin waterfall, and adjusted EBITDA bridge
    - Unit economics
  - - Debt terms and covenants
    - Not disclosed despite Ares Credit investment
    - Debt service could constrain growth or acquisitions
    - Request credit agreement, covenant model, maturity schedule, and lender materials
    - Capital adequacy
  - - Revenue mix and recurring share
    - Not disclosed by stream, channel, or contract type
    - Revenue quality cannot be scored against SaaS or pure consulting benchmarks
    - Request revenue by service line, project/recurring split, backlog, and renewal cohort
    - Revenue model
  - - Cap table and proceeds allocation
    - Prior capital and ownership details incomplete
    - Determines dilution, leverage, sponsor incentives, and employee-owner economics
    - Request full capitalization table, proceeds waterfall, and employee-ownership plan terms
    - Financing dependency
  - - Cohort retention and CAC/payback
    - Not disclosed
    - Blocks LTV/CAC, sales efficiency, and moat analysis
    - Request cohort retention, NRR, churn reasons, sales cycle, CAC, and payback by segment
    - GTM efficiency
  notes: This table intentionally lists diligence blockers rather than filling missing private metrics with unsupported estimates.
