company:
  name: MGT
chapter:
  number: 4
  title: Financials
  summary: "MGT's public financial story is high-growth but private and unaudited: the company says 2024 revenue was projected above $400 million, revenue compounded 144% since 2021, and a $350 million Ares Credit investment valued the business at $1.25 billion. The diligence conclusion is that revenue scale is credible enough to underwrite a services platform, but margins, recurring mix, debt terms, burn, retention, and audited statements remain material blockers."
sections:
- id: revenue-model-and-streams
  title: Revenue Model and Revenue Streams
  body: "MGT appears to make money through a services-led SLED platform rather than a single software SKU. Public materials point to technology modernization, cybersecurity/SOC-NOC managed services, AI enablement, networking and E-Rate work, and advisory services for fiscal, facilities, human capital, K-12, and higher-education buyers. The company's own Ares announcement supplies the headline financial scale: 2024 revenue projected above $400 million, 144% revenue CAGR since 2021, and 30,000+ engagements across 2,500+ clients. What is not public is as important as what is public: no audited revenue schedule, no recurring-versus-project split, no revenue recognition policy, no backlog, and no service-line mix. For underwriting, this means the revenue model is plausible and diversified, but the quality of that revenue cannot be scored like a SaaS company without private contract, cohort, and margin data."
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  - CI012
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-monetization-and-channel-economics
  title: Pricing, Monetization, and Channel Economics
  body: "Public evidence supports the monetization mechanisms more than the price levels. Professional services and advisory work likely monetize through project or retainer fees; managed cybersecurity and managed IT can convert into recurring subscriptions or retainers; cooperative-contract vehicles such as OMNIA can reduce procurement friction; and E-Rate-funded projects create a third-party payer mechanism for K-12 connectivity. However, MGT does not publish standardized rate cards, realized pricing, discounting, contract duration, payment terms, implementation fees, or take-rate economics by channel. The result is a classic services diligence problem: revenue can be real even when unit economics are opaque. The key diligence package should include representative contracts, cooperative-vehicle schedules, realized hourly/blended rates, renewal escalators, channel-attributed revenue, gross margin by capability, and any pass-through hardware or subcontractor cost treatment."
  claimRefs:
  - CI010
  - CI011
  - CI013
  - CI014
  - CI018
  - CI035
  tableRefs:
  - TI002
- id: unit-economics-and-margin-quality
  title: Unit Economics, Margin Quality, and Retention Proxies
  body: "MGT's unit economics are not publicly disclosed. No source in the retained public set gives gross margin, EBITDA, net income, sales and marketing expense, CAC, payback, net revenue retention, utilization, delivery margin by service line, or cohort behavior. The best public proxies are indirect: the company claims 2,500+ clients and 30,000+ engagements, which implies repeated project volume, and the >$400 million revenue claim across 1,100+ employee-owners implies revenue per employee above roughly $360,000. Those proxies are useful but insufficient. Services gross margins can vary widely depending on labor mix, subcontractors, hardware pass-through, and utilization; managed services may be stickier but require SOC/NOC labor, tools, and customer support. The underwriting answer is therefore qualitative: MGT may have attractive recurring-service pockets, but the margin path and retention economics are private-evidence-only until management supplies cohorts and service-line P&Ls."
  claimRefs:
  - CI015
  - CI016
  - CI017
  - CI019
  - CI020
  - CI036
  - CI037
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-adequacy-and-financing-risk
  title: Capital Adequacy, Credit Structure, and Cash-Flow Risk
  body: Capital adequacy is the sharpest financial diligence issue. MGT announced a $350 million investment from Ares Credit funds at a $1.25 billion valuation, implying roughly 3x enterprise value to the company's >$400 million revenue floor if that revenue base is accurate. The announcement is positive because it adds institutional financing and gives MGT a first-SLED-unicorn signal; it is also a risk because the capital is described as coming from credit funds, not a conventional equity round. Public sources do not disclose maturity, interest rate, amortization, covenants, collateral, debt service, restricted cash, or whether the facility supports acquisitions, refinancing, owner liquidity, or organic growth. Burn, cash on hand, working capital, and runway are also absent. For a services platform, cash-flow durability depends on collections, payroll, subcontractors, integration spending, acquisition earnouts, and the timing of SLED appropriations, none of which can be confirmed publicly.
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
