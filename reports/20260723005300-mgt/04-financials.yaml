- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Mechanism
  - Unit / Contract Basis
  - Public Pricing Visibility
  - Likely Revenue Quality
  - Diligence Ask
  rows:
  - - Professional-services fees
    - Statements of work, advisory engagements, implementation projects, or blended labor rates
    - Not publicly disclosed
    - Depends on utilization, labor mix, and scope control
    - Request realized billing rates, utilization, write-offs, and project gross margin
  - - Managed-services subscriptions / retainers
    - Monthly or annual monitoring/support agreements for SOC, NOC, managed IT, or security services
    - Not publicly disclosed
    - Potentially higher quality if multi-year and renewable
    - Request ARR/recurring-revenue definition, renewal rate, NRR, and churn by service line
  - - Cooperative-contract sales
    - Purchases through OMNIA and similar pre-competed public-sector vehicles
    - Contract access public; price schedules and realized discounts not public
    - Faster procurement but not exclusive distribution
    - Request revenue by vehicle, fee leakage, win rates, and discounting history
  - - E-Rate-funded projects
    - K-12 connectivity and networking projects supported by USAC/FCC reimbursement mechanisms
    - Program mechanics public; MGT realized economics not public
    - Funded channel with timing and compliance constraints
    - Request E-Rate revenue, reimbursement timing, contribution margin, and denial/write-off history
  - - Advisory retainers and education finance work
    - Fiscal, facilities, human capital, K-12, and higher-education finance/planning engagements
    - No standardized rate cards retained
    - Relationship-driven but can be project-based
    - Request contract duration, repeat rate, margin, and revenue concentration by client
  notes: Pricing mechanisms are inferred from service lines and channels; public sources do not show list prices, realized pricing, discounting, or contract-level economics.
  claimRefs:
