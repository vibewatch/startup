callouts:
- calloutType: insight
  title: Revenue Scale Is Plausible, but Revenue Quality Is Unproven
  body: MGT's >$400M revenue floor and 144% CAGR claim indicate meaningful scale, yet public sources do not disclose audited revenue, mix, backlog, recurring share, or service-line margin.
  claimRefs:
  - CI002
  - CI003
  - CI012
  - CI031
- calloutType: risk
  title: Credit Capital Raises the Bar for Cash-Flow Proof
  body: The Ares financing is described as credit-fund capital, so debt terms, covenants, interest cost, maturity, and free-cash-flow coverage are essential diligence items.
  claimRefs:
  - CI021
  - CI022
  - CI027
  - CI030
- calloutType: recommendation
  title: Do Not Underwrite the Valuation Without a QoE and Credit Agreement
  body: The diligence package should start with audited statements, QoE, service-line P&Ls, recurring-revenue definitions, cohort retention, cash forecast, and the Ares credit documents.
  claimRefs:
  - CI023
  - CI028
  - CI037
  - CI040
- calloutType: assumption
  title: Services-Heavy Mix Should Be Valued Differently Than Tyler Software
  body: Tyler's software-centric public multiple is useful context, but MGT's services-led revenue should be discounted unless management proves recurring mix, retention, and margin durability.
  claimRefs:
  - CI033
  - CI034
  - CI035
