- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Value / Status
  - Basis
  - Why It Matters
  - Confidence
  rows:
  - - Gross margin
    - Not disclosed; services sensitivity often modeled qualitatively rather than observed
    - No MGT audited financials or service-line P&L found in public sources
    - Determines whether $400M+ revenue converts into durable EBITDA
    - Low
  - - Managed-services margin mix
    - Not disclosed; likely varies by SOC/NOC labor, software tools, and support intensity
    - MGT discloses cyber/managed services capability but not economics
    - Managed services may improve revenue quality if renewals are sticky
    - Low
  - - CAC / payback proxy
    - Not disclosed; SLED cycles and procurement complexity imply elevated selling cost
    - Cooperative vehicles reduce friction but do not eliminate long public-sector sales motions
    - Sales efficiency determines scalability of the platform model
    - Medium
  - - LTV / retention proxy
    - Not disclosed; 2,500+ clients and 30,000+ engagements are positive but not retention metrics
    - Company-stated client and engagement counts
    - Multi-year retention is central to valuation quality
    - Medium
  - - Revenue per employee-owner
    - More than ~$360k using >$400M revenue divided by 1,100+ employee-owners
    - Report-derived calculation from company-stated revenue and headcount
    - Helps benchmark labor productivity but not gross margin
    - Medium
  - - Revenue mix by stream
    - Not disclosed
    - Public sources list services but not the contribution of each stream
    - Mix determines margin, renewal, and cyclicality profile
    - Low
  notes: Values are public gaps or report-derived proxies; none should be treated as audited MGT unit economics without management data-room support.
