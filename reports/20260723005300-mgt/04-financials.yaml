  - TI004
  figureRefs:
  - FI003
  - FI004
- id: financial-trajectory-gaps-and-verdict
  title: Financial Trajectory, Public Gaps, and Underwriting Verdict
  body: "The financial trajectory is directionally strong but not independently underwritable from public sources alone. Company and wire-service announcements consistently repeat the same growth story: revenue above $400 million, 144% revenue CAGR since 2021, 400% employee growth, and a unicorn valuation. Independent context from Tyler Technologies provides a useful ceiling: Tyler is a larger, public, software-centric SLED peer around the low-$2-billion revenue scale and can command software-like revenue multiples that should not be mechanically assigned to a services-heavy MGT. The adverse macro point is that Capstone reported stalled government IT M&A and reduced private-equity activity amid DOGE-related contract cancellations and valuation volatility, which matters for an acquisition-led, credit-financed platform. The verdict is research-more: MGT has scale and market demand, but valuation, leverage, and margin quality require audited financials, debt documents, revenue mix, retention, and cohort evidence."
