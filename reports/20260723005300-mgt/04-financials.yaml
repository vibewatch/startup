  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue mix and recurring share
    missingEvidence: Revenue by service line, channel, contract type, backlog, and recurring-versus-project split
    whyItMatters: The valuation depends on revenue quality, but public sources only disclose aggregate unaudited revenue and broad service categories.
    diligencePath: Request management revenue bridge by stream, contract cohort, backlog, ARR/recurring definition, and recognition policy.
    relatedQuestionRefs:
    - QI003
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: margin and unit economics
    missingEvidence: Gross margin, EBITDA, net income, utilization, CAC, payback, NRR, churn, and service-line P&L
    whyItMatters: MGT cannot be valued confidently without proof that services revenue converts into durable earnings and cash flow.
    diligencePath: Request QoE, audited financials, service-line P&Ls, cohort retention, sales-cycle metrics, and CAC/payback analysis.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: debt terms and covenants
    missingEvidence: Ares credit agreement, maturity, interest rate, amortization, collateral, covenant package, and debt-service schedule
    whyItMatters: Credit-fund capital can constrain growth if debt service or covenants consume cash flow.
    diligencePath: Review the full credit agreement, lender model, covenant compliance certificate, and sensitivity cases.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: cash on hand, burn, and runway
    missingEvidence: Cash balance, free cash flow, monthly burn, working-capital schedule, and post-financing runway model
    whyItMatters: Capital adequacy cannot be assessed without liquidity and cash-conversion data.
    diligencePath: Request monthly management accounts, cash forecast, AR aging, payroll run-rate, capex schedule, and covenant model.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: employee ownership economics
    missingEvidence: ESOP, phantom equity, option, profit-sharing, or other employee-owner plan documents and redemption obligations
    whyItMatters: Employee-ownership economics can affect dilution, compensation expense, retention, and cash obligations.
    diligencePath: Request plan documents, ownership waterfall, redemption schedule, compensation accounting, and post-Ares pro forma cap table.
