              - CV044
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case is real enough to keep MGT on the investment committee agenda. SLED buyers need
              modernization, cybersecurity, AI enablement, E-Rate-supported connectivity, and advisory capacity; MGT has
              public proof of broad services, cooperative-channel access, and a large client and engagement footprint.
              The anti-thesis is equally important. This is not a pure SaaS company in the public record. MGT describes
              technology and advisory services, but it does not disclose recurring revenue, renewal cohorts,
              service-line margins, backlog, or organic growth. Ares lender involvement is a constructive signal because
              sophisticated credit investors evaluate cash-flow support, yet debt holders are not common-equity
              validators. The resulting thesis is conditional: if recurring managed services and margins are proven, MGT
              can deserve a premium; if not, it should be valued closer to government IT services peers.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV044
          - type: table
            tableRef: TV002
            claimRefs:
