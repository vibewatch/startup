      - number: '2.3'
        title: Buyer Landscape and Procurement Mechanics
        blocks:
          - type: paragraph
            body: >
              SLED demand is fragmented across more than 90,000 government entities: 50 states, over 3,000 counties,
              roughly 19,000 municipalities, more than 13,000 school districts, and thousands of public colleges and
              special districts. Buyer, user, and payer roles frequently diverge—an agency CIO may specify a solution, a
              program director is the end user, and an elected budget authority or school board approves funding, often
              on annual appropriation cycles tied to state fiscal years ending June 30. Procurement rarely happens
              through simple direct sales; a large and growing share flows through cooperative purchasing vehicles such
              as OMNIA Partners, NASPO ValuePoint, and Sourcewell, which together move an estimated $60-70 billion
              annually and let entities buy off pre-competed contracts. MGT's disclosed footprint—52 state agency Master
              Service Agreements, 100+ state agency projects, and cooperative listings including OMNIA Partners—shows it
              has invested in the contract vehicles that shorten sales cycles. Education technology adds a distinct
              payer mechanism: the federal E-Rate program administered by USAC and the FCC subsidizes school and library
              connectivity, and MGT ranks as the No. 3 E-Rate provider for the 2026 season, giving it a funded channel
              into K-12 buyers.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
          - type: table
            tableRef: TM003
            claimRefs:
