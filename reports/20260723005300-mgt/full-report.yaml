              Education projects, 2,500 education projects completed, and a No. 3 ranking among E-Rate providers for the
              2026 season. These figures suggest meaningful penetration into SLED procurement and education channels,
              especially where cooperative vehicles and E-Rate lower buying friction. However, they are mostly
              cumulative and company-stated. Public sources do not disclose the active customer denominator, logo adds
              by year, deployment starts versus completions, average contract size, backlog, win rate, or revenue
              contribution by vehicle. The chapter therefore treats the figures as adoption proxies, not as evidence of
              current recurring revenue or retention.
