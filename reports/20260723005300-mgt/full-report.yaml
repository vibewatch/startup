              - CV015
              - CV016
              - CV018
      - number: '8.3'
        title: Bull, Base, and Bear Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation method is a revenue-multiple sensitivity because MGT does not publish
              EBITDA, free cash flow, gross margin, or retention. The base case uses the stated valuation as a reference
              point: $1.25 billion divided by a revenue floor slightly above $400 million is roughly 3.1x revenue. That
              multiple is not obviously irrational if MGT proves high growth, recurring managed-services revenue,
              durable margins, and broad customer diversification. It is also not cheap if the company is mostly
              services, advisory, and acquisition-driven project work. The bull case requires audited scale and a
              premium hybrid multiple. The bear case applies a lower services multiple or revenue haircut, particularly
              if public-market comps compress, the Ares facility limits cash flow, or audited results miss public
              claims.
            claimRefs:
              - CV003
