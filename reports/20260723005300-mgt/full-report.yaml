          - type: callout
            title: Programmatic M&A as Core Strategy
            body: >
              MGT's 13 acquisitions since 2016 reflect a deliberate platform-building strategy—adding capabilities in
              cybersecurity, IT infrastructure, education performance, human capital, and higher education finance. This
              programmatic M&A has driven the majority of employee and revenue growth, but integration complexity and
              cultural cohesion across acquired entities represent execution risk at scale.
