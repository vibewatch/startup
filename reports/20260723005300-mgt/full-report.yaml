        title: Switching Cost, Lock-In, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              MGT's moat is real but softer than a proprietary software moat. Its strongest durable assets are SLED
              relationships, procurement vehicles, integrated breadth, recognized market momentum, and execution
              capacity funded by institutional capital. Tyler's moat is harder: once courts, payments, ERP, or
              public-safety workflows are embedded, switching is disruptive and multi-year. Consulting giants have a
              different moat—brand, staffing depth, and balance-sheet credibility for mega-programs. For MGT, the
              principal risks are services commoditization, integration complexity across acquisitions, and price
              pressure when buyers can multi-home among software vendors, advisory firms, and internal IT. Cybersecurity
              and AI are attractive demand pockets, but standards, frameworks, and reference architectures are widely
