              - CM018
              - CM031
      - number: '2.5'
        title: Constraints, Headwinds, and Sizing Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              The market also carries meaningful constraints. Budget normalization is the most cited: roughly half of
              states are projecting slower revenue growth or outright declines, tightening discretionary technology
              spending even as mandatory obligations rise. Procurement complexity and long, multi-stakeholder sales
              cycles slow revenue recognition and raise customer-acquisition cost. The wind-down of federal MS-ISAC
              funding removes a shared cybersecurity support layer many smaller entities relied on, creating both a risk
              (unprotected buyers) and an opportunity (paid replacement services) whose net effect is unsettled. On the
              deal side, one analyst report documents that government IT M&A volume stalled and private-equity activity
              fell year-over-year amid DOGE-driven federal contract cancellations and valuation volatility—a headwind
              for an acquisition-led platform. Finally, the sizing itself has genuine gaps: analyst SLED IT totals
              cluster near $160 billion but differ on vertical splits and growth, MGT's SAM cannot be isolated from
              public data, and the company's own revenue and growth figures are unaudited. These contradictions are
              preserved rather than resolved, and each is paired with a concrete diligence path.
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: MGT Is a Specialized Share-Taker, Not an Incumbent
            body: >
              Against a $160.2 billion 2026 SLED IT market, MGT's >$400M company-stated revenue is well under 0.3% of
              total spend. This implies a long growth runway, but it also means the investment thesis rests on continued
              share capture in specific verticals rather than defending a dominant position.
            calloutType: insight
            claimRefs:
              - CM008
              - CM011
          - type: callout
            title: Funded Channels Lower Adoption Friction
            body: >
              Cooperative purchasing vehicles (OMNIA, NASPO ValuePoint, Sourcewell) move an estimated $60-70 billion
              annually and let buyers skip lengthy procurements, while the E-Rate program subsidizes K-12 connectivity.
              MGT's presence on these vehicles and its No. 3 E-Rate ranking give it funded, lower-friction routes to
              cash-constrained buyers.
            calloutType: strength
            claimRefs:
              - CM016
              - CM017
              - CM019
          - type: callout
            title: Budget Normalization and M&A Stall Are Real Headwinds
            body: >
              Roughly half of states project slower revenue or declines, tightening discretionary technology budgets,
              and one analyst report documents a government-IT M&A stall with falling PE activity amid DOGE contract
              cancellations. Both pressure an acquisition-led growth model whose revenue is unaudited.
            calloutType: risk
            claimRefs:
              - CM026
              - CM029
          - type: callout
            title: SAM/SOM Ranges Are Report-Derived Estimates
            body: >
              Because MGT's serviceable market cannot be isolated from public analyst data and company revenue is
              unaudited, the $30-50B SAM and $2-6B SOM figures are triangulated estimates. Diligence should validate
              them against MGT's internal pipeline, win rates, and audited revenue by vertical.
            calloutType: assumption
            claimRefs:
              - CM009
              - CM032
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Peer Set
        blocks:
          - type: paragraph
            body: >-
              MGT's competitive arena is broader than a list of SLED services firms. Direct and near-direct alternatives
              include Tyler Technologies, CGI, ICF, Accenture, Deloitte, and regional government IT integrators;
              adjacent entrants include Leidos and SAIC, whose public positioning is more federal-government and
              mission-IT oriented but whose delivery capacity could move into SLED when demand is attractive.
              Substitutes are equally important: agency IT teams can keep work internal, school districts can rely on
              E-Rate consultants or local managed-service providers, and buyers can defer modernization when budgets
              tighten. The resulting map shows MGT occupying a services-led, SLED-specialized lane. That lane is
              attractive because it bundles advisory, cyber, AI, and education/government expertise, but it is not
              protected by the same software lock-in that Tyler enjoys through embedded transaction systems.
