              - CO019
          - type: callout
            title: Ares Investment is Credit, Not Equity—Debt Service Risk
            body: >
              The $350 million from Ares Management was structured through Ares Credit funds, not as equity. This means
              MGT carries a debt obligation with potential covenants, interest, and maturity that are not publicly
              disclosed. If growth decelerates or acquisitions underperform, debt service could strain cash flows. The
              lack of audited public financials makes it impossible to independently assess the company's debt coverage
              ratios or leverage.
