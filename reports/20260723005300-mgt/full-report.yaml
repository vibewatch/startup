      - number: '6.4'
        title: Retention, Repeat Usage, and Satisfaction Signals
        blocks:
          - type: paragraph
            body: >
              Retention evidence is the chapter's largest customer-quality gap. Positive public signals exist: more than
              30,000 engagements across 2,500+ clients implies repeated project volume; South Bay Union's testimonial
              describes more than a decade of facility-planning support; Hillsborough, Paul R. Brown, Texas A&M, and
              other customer quotes indicate satisfaction in selected engagements; and cooperative or E-Rate channels
              can support repeat procurement when buyers continue to need technology, facilities, cyber, or advisory
              work. None of those signals is equivalent to net revenue retention, gross revenue retention, logo churn,
              renewal rate, cohort expansion, average contract length, NPS, CSAT, or an independently audited reference
              program. For a services-heavy SLED company, this distinction is critical: repeat engagements can be
              durable, but they can also be episodic consulting work. The base-case underwriting treatment should assign
              medium confidence to repeat-work proxies and low confidence to any precise retention economics until
              management provides cohort data.
