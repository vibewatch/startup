      - number: '8.5'
        title: Kill Triggers and Monitoring
        blocks:
          - type: paragraph
            body: >-
              The final chapter should turn uncertainty into explicit monitoring rules. MGT should be re-underwritten or
              passed if audited revenue is materially below the public $400 million floor, if organic growth is
              materially weaker than the 144% CAGR narrative implies, or if service-line margins look like low-end
              consulting rather than managed-services economics. The Ares facility creates a second set of hard
              triggers: covenant breach, refinancing failure, high cash interest burden, or collateral constraints would
              turn the credit capital from a growth enabler into a valuation overhang. Commercial triggers matter as
              well, including loss of a cooperative vehicle, E-Rate disruption, customer concentration, a major breach,
              security litigation, or leadership disruption without succession proof. These are not known events; they
              are diligence thresholds.
            claimRefs:
              - CV010
              - CV029
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
