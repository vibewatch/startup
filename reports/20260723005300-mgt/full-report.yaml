  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              MGT is a credible scale platform, but the valuation recommendation should remain research-more /
              conditional track rather than buy. The strongest public facts are the $1.25 billion stated valuation, $350
              million Ares credit investment, company-stated 2024 revenue above $400 million, and 144% revenue CAGR
              since 2021. Those facts support a serious diligence process and justify watching the company closely. They
              do not, by themselves, underwrite price. The revenue base is unaudited publicly, the Ares capital is
              credit-fund capital rather than a clean equity round, and the public record lacks EBITDA, gross margin,
              organic growth, recurring share, customer concentration, and covenant terms. At roughly 3x company-stated
              revenue, MGT looks fair-to-stretched for a services-heavy platform unless private diligence proves
              software-like retention and margin durability.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV029
              - CV030
