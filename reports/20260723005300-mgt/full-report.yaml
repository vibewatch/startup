      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: First and Only SLED Technology Unicorn
            body: >
              MGT's $1.25 billion valuation established it as the first unicorn in the SLED technology services
              industry—a significant market position that signals institutional confidence in the sector and gives MGT a
              competitive differentiation story that no direct competitor can replicate.
            calloutType: strength
            claimRefs:
