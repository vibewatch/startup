      - number: '7.4'
        title: Financial, People, Execution, and Governance Risks
        blocks:
          - type: paragraph
            body: >-
              Financial risk is unusually important for MGT because the headline unicorn event was a $350 million
              investment from Ares Management credit funds, not a simple equity round. That makes debt service,
              covenants, refinancing, interest rates, and free cash flow part of the underwriting case, especially
              because public revenue figures are company-stated and unaudited. The same evidence points to rapid growth
              and a large employee-owner base, but those signals need separation into organic growth, acquired growth,
              recurring revenue, and project-based services. People risk compounds the financial risk. The public
              narrative is closely associated with CEO A. Trey Traviesa, 1,100+ employee-owners, and hundreds of
              certified cybersecurity engineers. Employee ownership is a mitigant, yet integration pressure, cyber/AI
              labor competition, and PE-backed exit incentives make leadership depth, retention, and governance controls
              central diligence items.
