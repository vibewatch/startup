      - number: '1.4'
        title: Scale, Traction, and Geographic Reach
        blocks:
          - type: paragraph
            body: >
              As of December 2025, MGT employs over 1,100 employee-owners and serves more than 2,500 SLED clients across
              the United States. The company reports annual impact reaching over 200 million people, including 20
              million K-12 students. MGT operates across multiple states—company marketing materials cite service across
              38+ states, though independent verification of the exact state count is unavailable. The company holds
              over 50 Master Service Agreements with government entities and has completed more than 30,000 client
              engagements over its operating history. Key metrics include 100+ projects for state agencies, 38 projects
              with State Departments of Education (DOEs), and 52 state agency Master Service Agreements as disclosed on
              the company's state government solutions page. In 2025, MGT ranked No. 830 on the Inc. 5000 list of
              fastest-growing private companies with 508% growth, and No. 6 on CRN's Fast Growth 150 list for
              fastest-growing technology companies in North America. MGT has been named to the 2026 GovTech 100, a
              recognition for top companies driving innovation for state and local government. The company ranked No. 3
              as an E-Rate provider for the 2026 season (Year 29), highlighting leadership in education technology
              connectivity programs. MGT was awarded the 2026 AI-as-a-Service Solution of the Year by AI Breakthrough
              for its secure, governance-first AI approach. Employee count reflects rapid growth from 900+ professionals
              in September 2024 to 1,100+ by December 2025, a 22% headcount expansion in approximately 15 months.
