      - number: '2.2'
        title: TAM / SAM / SOM Sizing Through Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              No single generic TAM captures MGT's opportunity, so this analysis triangulates using several lenses. The
              top-down lens starts from the $160.2 billion 2026 SLED IT market and applies the seven analyst
              verticals—Health and Human Services ($44.4B), Education ($41B), Transportation ($19.2B), Finance and
              Administration ($16.7B), Justice and Public Safety ($15B), Utilities ($13.5B), and Environment and Housing
              ($10.4B). MGT's serviceable addressable market (SAM) concentrates in the Education,
              Finance/Administration, Justice/Safety, and cross-cutting cybersecurity and modernization segments where
              its portfolio is strongest. A conservative SAM of roughly $30-50 billion emerges if MGT's capabilities map
              to services-heavy portions of these verticals. The serviceable obtainable market (SOM) is bounded by MGT's
              current delivery capacity of 1,100+ employee-owners and its cooperative contract footprint; with
              company-stated revenue exceeding $400 million, MGT holds well under 0.3% of total SLED IT spend, implying
              a long runway but also that the company is a specialized share-taker rather than a dominant incumbent.
              Every sizing figure above blends independent analyst market data with company-stated revenue that remains
              unaudited, so the ranges are estimates rather than precise measurements.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
