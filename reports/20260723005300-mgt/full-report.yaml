companyProfile:
  summary: >
    MGT is a Tampa, Florida-based national technology and advisory solutions provider exclusively focused on the state,
    local, and education (SLED) government sector. Founded in 1974 by educators and government management experts, MGT
    transformed under new leadership starting in 2016 through a programmatic acquisition strategy—completing 13
    acquisitions—to become a diversified government technology platform spanning cybersecurity, IT modernization, AI,
    human capital, E-Rate connectivity, fiscal management, and K-12 school improvement. In December 2025, Ares
    Management invested $350 million in MGT via credit instruments, valuing the company at $1.25 billion and
