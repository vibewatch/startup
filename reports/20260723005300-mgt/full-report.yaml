        title: Exhibits
        blocks:
          - type: callout
            title: Conditional Track, Not Buy
            body: >-
              MGT deserves continued diligence, but the public record does not verify the revenue quality, debt terms,
              or margins needed to underwrite a buy at $1.25 billion.
            calloutType: recommendation
            claimRefs:
