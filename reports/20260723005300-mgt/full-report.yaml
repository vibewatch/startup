      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >
              MGT's leadership team is anchored by CEO A. Trey Traviesa, who has been central to the company's
              transformation since taking the helm and driving the aggressive M&A and growth strategy. Lawrence Cowan
              serves as Chief Operating Officer of Revenue Operations and is the public-facing media contact for major
              transactions. Thomas Cahill holds the role of Senior Vice President, Partner and Alliance Solutions, with
              public visibility on major technology partnerships such as the HPE-Protopia AI center announced in March
              2026. In early 2026, MGT expanded its leadership team with Omar Bhatti as EVP and President of the
              Technology Solutions Group, and Adam Appleby as EVP and President of Advisory Solutions—demonstrating the
              company's move to a more structured enterprise architecture. Ibrahim "Ibo" Otun was appointed as Chief AI
              and Information Officer to lead the firm's AI factory, enterprise technology, and data platforms. Stefan
              Schmidt, Vice President of Field Engineering, was recognized in CRN's 2026 Next-Gen Solution Provider
              Leaders list. Key-person risk exists primarily around CEO Traviesa, whose strategic vision drives the
              four-year value-creation plan. Governance structure as a private company backed by majority investor The
              Vistria Group (since April 2023) and institutional investors J.P. Morgan, WhiteHorse Capital, and Ares
              Management places control with institutional investors. The board composition has not been publicly
              disclosed in detail. MGT's employee-ownership model, referenced repeatedly in press releases, aligns
              employee incentives with company growth and value creation. The company has not disclosed any material
              leadership departures or governance controversies in public filings or press releases reviewed for this
              report.
