      - number: '2.4'
        title: Growth Drivers and Tailwinds
        blocks:
          - type: paragraph
            body: >
              Several structural tailwinds support MGT's market. First, artificial intelligence has moved from pilots to
              production across SLED in 2026, and agencies increasingly seek secure, governance-first deployment
              partners—directly aligned with MGT's AI Experience Center and its 2026 AI-as-a-Service award. Second,
              cybersecurity is the top SLED technology priority as ransomware attacks against governments and schools
              rise; demand for managed detection, security operations, and resilience services is expanding. Third,
              decades of legacy systems create a durable technology modernization and cloud migration backlog that
              services firms are positioned to capture. Fourth, SLED has remained comparatively insulated from the
              federal spending contraction, and some analysts note a federal-to-SLED shift as vendors redirect capacity
              toward state and local demand. Fifth, cooperative purchasing and E-Rate funding lower the friction and
              cost of adoption for cash-constrained buyers. Together these drivers favor multi-capability platforms that
              can bundle AI, cybersecurity, modernization, and advisory work, which is precisely the integrated
              positioning MGT has assembled through acquisition. The timing of these tailwinds is near-term for AI and
              cybersecurity and multi-year for modernization.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
              - CM025
          - type: table
            tableRef: TM004
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM026
              - CM027
              - CM028
              - CM029
          - type: figure
