  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: SLED Market Definition, Boundary, and Size
        blocks:
          - type: paragraph
            body: >
              The market MGT serves is state, local, and education (SLED) government technology and advisory solutions
              in the United States. The included spend is SLED information technology: hardware, software, networking,
              cybersecurity, managed services, cloud modernization, AI platforms, and the professional and advisory
              services that surround them. Independent analysts estimate total SLED IT spending at approximately $160.2
              billion in 2026, growing at a moderate 4-6% over 2025. This IT figure sits inside a far larger SLED
              procurement universe—estimated at $1.5-2 trillion annually across all categories (construction, education
              operations, health and human services delivery, and more)—of which technology and advisory services are a
              defined slice. Excluded from MGT's addressable boundary are pure federal civilian and defense IT
              contracting, consumer technology, and non-government commercial IT, although federal budget dynamics spill
              over into SLED demand. Adjacent spend includes management consulting, staffing, and facilities services
              that MGT partially addresses through its advisory lines. The status-quo substitute for most buyers is
              continued reliance on legacy in-house IT teams, incumbent system integrators, or deferring modernization
              entirely—each a real competitive alternative to engaging a specialized SLED platform like MGT.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
