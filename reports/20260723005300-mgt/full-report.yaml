              - CV009
              - CV017
              - CV029
              - CV043
              - CV044
      - number: '8.6'
        title: Final Diligence Asks and Verdict
        blocks:
          - type: paragraph
            body: >-
              The verdict is conditional rather than negative. MGT has the scale, sponsor backing, and market relevance
              to merit continued diligence, but the public valuation case cannot be closed without a data room. The
              highest-value ask is audited financials plus a quality-of-earnings bridge that separates organic from
              acquired growth and reconciles revenue, EBITDA, free cash flow, and working capital. The next asks are
              recurring-revenue definitions, renewal cohorts, customer and channel concentration, service-line P&Ls,
              Ares credit documents, certification and incident history, and acquisition integration scorecards. A buy
              view would require those materials to confirm durable growth, manageable leverage, defensible customer
              retention, and a credible exit route. Without that proof, the appropriate stance is research-more at
              disciplined price, not valuation-chasing.
            claimRefs:
              - CV028
              - CV036
              - CV037
              - CV038
