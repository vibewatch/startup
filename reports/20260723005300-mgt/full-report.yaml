      - number: '7.3'
        title: Partner, Supplier, and Channel Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              The partner and dependency map is broader than a standard software-vendor channel model. MGT depends on
              cooperative purchasing vehicles for easier public-sector access, E-Rate administrators for a funded K-12
              route, institutional capital providers for acquisition-led growth, specialized talent for delivery, and
              technology partners for AI. The AI Experience Center highlights this directly: MGT, HPE, and Protopia AI
              are the visible partnership stack, while NVIDIA public-sector AI infrastructure makes GPU and
              accelerated-computing availability relevant to deployment timing and economics. Cooperative vehicles such
              as OMNIA, NASPO ValuePoint, and Sourcewell can lower buyer friction, but the risk flips if revenue is
              concentrated in one vehicle or if eligibility changes. Public evidence does not quantify channel revenue,
              partner concentration, supplier substitutability, or contractual protections, so the dependency register
              remains partly unresolved until data-room schedules are reviewed.
