chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              MGT (mgt.us) is a national technology and advisory solutions leader headquartered in Tampa, Florida,
              serving state, local, and education (SLED) government clients across the United States. The company was
              founded in 1974 by experts in education and government management—though some company materials reference
              1975 as the founding year, a minor discrepancy the company has not publicly reconciled. MGT describes
              itself as committed to "impacting communities for good," providing specialized solutions that address
              mission-critical priorities at the top of government client leadership agendas. The company's product and
              service portfolio spans technology modernization and AI, cyber and campus security, human capital
              management, fiscal and facilities management, and K-12 school improvement. MGT operates as an
              employee-ownership model and serves as a trusted advisory and implementation partner to over 2,500 SLED
              clients nationally. Under new leadership since 2016, MGT has transformed from a niche education consulting
              firm into a diversified government technology platform through a combination of organic growth and 13
              strategic acquisitions. Revenues were projected to exceed $400 million in 2024, with compound annual
              revenue growth of 144% since 2021. The company's unified brand was launched in September 2024, integrating
              10+ prior acquisitions under the singular MGT identity on mgt.us. The tagline "Impacting communities for
              good" reflects MGT's social impact mission and differentiates the company from pure-play IT service
              providers.
