      - number: '7.2'
        title: Operational, Quality, Security, and Integration Risks
        blocks:
          - type: paragraph
            body: >-
              MGT's operating model bundles advisory, managed technology, cybersecurity, AI, education, and
              human-capital services. That breadth is commercially attractive but creates execution risk because
              failures can occur in project delivery, cyber operations, incident response, partner-supported AI
              deployments, and post-acquisition integration. The most severe operational scenario is a major breach
              involving MGT or a managed-security client: CISA and NIST evidence makes the threat environment clear,
              while MGT's own cyber positioning makes trust central to the value proposition. Acquisition integration is
              the second large operational risk. MGT's rebrand was tied to integrating multiple acquisitions, and rpk
              GROUP adds another higher-education capability set. Without data-room evidence on delivery defects, SLAs,
              incident history, backlog quality, and organic versus acquired performance, public evidence supports a
              medium-to-high operational risk rating rather than a clean scale-platform assumption.
            claimRefs:
              - CR006
