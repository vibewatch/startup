      - number: '8.4'
        title: Comparable Valuation Benchmarking
        blocks:
          - type: paragraph
            body: >-
              Comparable valuation should bracket MGT between a public-sector software ceiling and services-heavy
              floors. Tyler Technologies is the most relevant public SLED software leader because it sells public-sector
              software at much larger scale and can support a premium revenue multiple. MGT should not receive Tyler's
              multiple unless management proves recurring software-like economics. Accenture is a better broad services
              reference for a roughly 3x revenue base-case lens, while CGI, Leidos, SAIC, and ICF are useful government
              IT and consulting comps for lower services multiples. MGT's implied 3x revenue multiple therefore prices a
              premium to pure services peers and a discount to the Tyler software ceiling. That is a defensible
              conditional position only if the company demonstrates recurring managed services, retention, margins, and
              acquisition integration quality.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV031
          - type: table
            tableRef: TV004
            claimRefs:
              - CV022
