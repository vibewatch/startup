      - number: '6.5'
        title: Expansion Paths and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              MGT has multiple expansion paths: cross-sell from advisory into managed technology, cyber, AI, and
              facilities work; higher-education expansion through the rpk GROUP acquisition; K-12 networking through
              E-Rate; and geographic whitespace in states, counties, municipalities, and education entities not yet
              served. Cooperative purchasing through OMNIA, NASPO, and Sourcewell can reduce procurement friction, while
              MGT's breadth lets the company pursue adjacent budget owners after landing a client. The risks sit on the
              same axis. Public evidence does not disclose top-customer concentration, revenue by state, revenue by
              vertical, revenue by cooperative vehicle, acquired-client retention, or channel-attributed bookings. Heavy
              SLED budget exposure also matters because state and local buyers face revenue normalization, staffing
              pressure, and complex public procurement. The customer diligence package should therefore quantify
              concentration, verify whether acquired customer bases are retained, and separate repeat expansion from
