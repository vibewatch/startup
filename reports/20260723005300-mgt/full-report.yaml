              large competitors publish standardized SLED rate cards on the retained pages, so this chapter treats
              pricing and packaging as directional. Tyler likely monetizes through software license/subscription and
              services around installed systems; MGT appears contract-vehicle and services-led; global consultancies
              typically package large transformation programs; and internal build substitutes convert vendor cost into
