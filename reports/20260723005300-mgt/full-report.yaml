              The competitor profiles divide into three archetypes. Tyler is the scaled public-sector software
              incumbent: its ERP, courts, payments, public-safety, and civic workflows create product depth and
              switching costs that MGT's services-led model does not replicate. Accenture, Deloitte, CGI, and ICF bring
