      - number: '1.5'
        title: Key Milestones, Strategic Developments, and Adverse Signals
        blocks:
          - type: paragraph
            body: >
              MGT's transformation accelerated in 2016 with new leadership and an acquisition-led growth strategy.
              Between 2020 and 2024, the company completed 10 acquisitions that were integrated under the MGT brand,
              including Cira Infotech (cybersecurity), Layer 3 Communications (IT infrastructure and managed services),
              GovHR USA (human capital), AMS.NET (IT and physical security), and rpk GROUP (higher education finance).
              The April 2023 Vistria Group majority investment funded the current phase of growth. The September 2024
              brand unification consolidated all acquired entities under MGT, launching the mgt.us platform. December
              2025 saw the landmark Ares investment at $1.25B valuation. In March 2026, MGT announced a national AI
              Experience Center in partnership with Protopia AI and HPE to enable secure AI deployment for SLED
              agencies. MGT made a minority investment in Eddi in 2026, an AI platform for education and government
              grant management. Key adverse signals and open questions include: (1) the company has not publicly
              disclosed audited revenue, EBITDA margins, or profitability; (2) the Ares investment is credit-based
              rather than equity, creating debt service obligations not visible from public disclosures; (3) rapid M&A
              integration risk remains—13 acquisitions since 2016 with varying cultural and technical maturity; (4) an
              Inc. 5000 profile shows 508% growth, but the baseline period and measurement methodology are not
              independently verified; (5) founding year discrepancy (1974 vs. 1975 across MGT materials) represents a
              minor data integrity issue. No lawsuits, regulatory sanctions, data breaches, or material leadership
              controversies were identified in publicly available sources reviewed for this chapter as of July 2026.
            claimRefs:
              - CO036
              - CO037
              - CO038
              - CO039
              - CO040
              - CO041
