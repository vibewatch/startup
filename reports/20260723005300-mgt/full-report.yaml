      - number: '1.3'
        title: Funding History, Valuation, and Investor Map
        blocks:
          - type: paragraph
            body: >
              MGT's financing history accelerated sharply with The Vistria Group's majority investment in April 2023,
              which triggered the current four-year value-creation plan. Since that investment, the company tripled its
              enterprise value by December 2025. The pivotal transaction in MGT's history to date is the December 3,
              2025 close of a $350 million investment from Ares Credit funds (Ares Management Corporation, NYSE: ARES),
              which valued the company at $1.25 billion and positioned it as the first unicorn in the SLED services
              industry. The Ares investment is structured as credit rather than equity, which is important for
              understanding the capital structure—it is debt-like capital intended to fund acquisitions and organic
              growth acceleration, not a traditional venture equity round. Existing institutional investors include The
              Vistria Group (majority shareholder, $17B AUM impact investment firm), J.P. Morgan, and WhiteHorse
              Capital. Ares Management (NYSE: ARES, $595 billion AUM as of September 2025) participated through its
              Opportunistic Credit strategy, led by Craig Snyder, Co-Head of Opportunistic Credit. The $1.25 billion
              valuation makes MGT the first privately held SLED technology services company to reach unicorn status, a
              widely cited market milestone. Total capital raised prior to the Ares investment has not been publicly
              disclosed; the company has not released audited financials or detailed balance sheet data. The Ares
              capital is explicitly earmarked for larger acquisitions and growth acceleration as part of the ongoing
              value-creation plan.
            claimRefs:
