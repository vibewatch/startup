    1,100+ employee-owners, and impacts 200 million+ people annually including 20 million K-12 students. MGT's 2024
    revenues were projected at $400M+ with 144% CAGR since 2021, though these figures are company-stated and unaudited.
    Key institutional investors include The Vistria Group (majority), J.P. Morgan, WhiteHorse Capital, and Ares
    Management.
