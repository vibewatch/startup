  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              MGT's regulatory risk is less about a single known enforcement action and more about operating in heavily
              governed customer workflows. The company sells into K-12, state agencies, and local governments, and it
              publicly highlights E-Rate relevance, cybersecurity, managed technology, and AI. That means procurement
              rules, E-Rate eligibility and documentation, education-data privacy, cybersecurity frameworks, and
              certification posture all matter before an investor treats revenue quality as low-risk. FCC and USAC
              sources establish the E-Rate program mechanics; NIST and CISA establish the cyber-risk management bar; and
              legal-analysis sources underscore that regulatory implementation details can change compliance burdens.
              The main gap is public specificity: retained evidence does not confirm SOC 2, FedRAMP, StateRAMP, FERPA
              controls, E-Rate audit history, or material litigation status. Diligence should therefore convert this
              category into document requests rather than assuming clean compliance.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
