      - number: '7.5'
        title: Mitigations, Kill Criteria, and Residual Risk View
        blocks:
          - type: paragraph
            body: >-
              MGT has credible mitigants: a large stated client base, broad SLED exposure, employee ownership,
              cooperative purchasing access, E-Rate relevance, and market demand for cybersecurity, modernization, and
              AI. Those mitigants do not eliminate residual risk because most downside triggers are private-evidence
              problems. The investment committee should treat the following as hard re-underwrite or kill events:
              covenant breach or failed refinancing; a major client breach, security litigation, or enforcement event;
              loss or suspension of a key cooperative vehicle or E-Rate channel; CEO departure without validated
              succession; and audited revenue or organic growth materially below public claims. Monitoring should be
              explicit: channel revenue, top-customer concentration, incident history, SLA credits, acquired-cohort
              retention, debt terms, and certifications. The residual view is therefore not 'avoid'; it is 'underwrite
              only with contractual, financial, security, and concentration evidence that converts public claims into
              verifiable risk controls.'
