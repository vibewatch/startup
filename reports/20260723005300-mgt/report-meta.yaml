companyProfile:
  summary: >
    MGT is a Tampa, Florida-based national technology and advisory solutions provider exclusively
    focused on the state, local, and education (SLED) government sector. Founded in 1974 by
    educators and government management experts, MGT transformed under new leadership starting
    in 2016 through a programmatic acquisition strategy—completing 13 acquisitions—to become a
    diversified government technology platform spanning cybersecurity, IT modernization, AI,
    human capital, E-Rate connectivity, fiscal management, and K-12 school improvement. In
    December 2025, Ares Management invested $350 million in MGT via credit instruments, valuing
    the company at $1.25 billion and establishing it as the first unicorn in SLED technology
    services. The company serves 2,500+ SLED clients, employs 1,100+ employee-owners, and
    impacts 200 million+ people annually including 20 million K-12 students. MGT's 2024 revenues
    were projected at $400M+ with 144% CAGR since 2021, though these figures are company-stated
    and unaudited. Key institutional investors include The Vistria Group (majority), J.P. Morgan,
    WhiteHorse Capital, and Ares Management.
  foundedDate: "1974-01-01"
  founders:
    - name: "Founders (names not publicly disclosed)"
      role: "Founders"
      background: "Experts in education and government management per company materials"
      claimRefs: [CO036]
  foundingLocation: "United States (specific city not documented pre-2016)"
  headquarters: "Tampa, FL, USA"
  productSummary: >
    MGT offers technology modernization and AI services, cybersecurity (24/7/365 SOC/NOC with
    350+ certified engineers), E-Rate connectivity programs, human capital consulting, fiscal and
    facilities management, and K-12 school improvement advisory—all delivered through a unified
    platform on mgt.us backed by 13 integrated acquisitions and 100+ technology partner alliances.
  customerFocus: "State and local government agencies, K-12 school districts, higher education institutions, and targeted public sector organizations across 38+ US states"
  businessModel: >
    MGT generates revenue through professional services contracts (advisory and consulting), managed
    technology services (cybersecurity SOC/NOC, IT managed services), E-Rate program facilitation
    and service delivery, project-based engagements, and long-term Master Service Agreements.
    The company operates under cooperative purchasing vehicles (OMNIA Partners) to streamline
    government procurement and enable repeat business.
  stage: "Growth unicorn (private, PE-backed)"
  fundingStatus: "$350M credit investment from Ares Management at $1.25B valuation (December 2025); existing investors Vistria Group (majority), J.P. Morgan, WhiteHorse Capital"
