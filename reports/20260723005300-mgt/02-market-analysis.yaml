company:
  name: "MGT"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    MGT operates in the U.S. state, local, and education (SLED) technology and advisory market, where
    total government IT spending is projected at roughly $160.2 billion in 2026, growing 4-6% over 2025.
    The broader SLED procurement opportunity across all categories is estimated at $1.5-2 trillion annually
    across 90,000+ government entities. Growth is driven by AI moving from pilots to production, rising
    cybersecurity demand, and technology modernization, while budget normalization, procurement complexity,
    and the wind-down of federal MS-ISAC funding are the primary headwinds shaping adoption timing.

sections:
  - id: "market-definition-and-size"
    title: "SLED Market Definition, Boundary, and Size"
    body: >
      The market MGT serves is state, local, and education (SLED) government technology and advisory
      solutions in the United States. The included spend is SLED information technology: hardware, software,
      networking, cybersecurity, managed services, cloud modernization, AI platforms, and the professional
      and advisory services that surround them. Independent analysts estimate total SLED IT spending at
      approximately $160.2 billion in 2026, growing at a moderate 4-6% over 2025. This IT figure sits inside
      a far larger SLED procurement universe—estimated at $1.5-2 trillion annually across all categories
      (construction, education operations, health and human services delivery, and more)—of which technology
      and advisory services are a defined slice. Excluded from MGT's addressable boundary are pure federal
      civilian and defense IT contracting, consumer technology, and non-government commercial IT, although
      federal budget dynamics spill over into SLED demand. Adjacent spend includes management consulting,
      staffing, and facilities services that MGT partially addresses through its advisory lines. The
      status-quo substitute for most buyers is continued reliance on legacy in-house IT teams, incumbent
      system integrators, or deferring modernization entirely—each a real competitive alternative to
      engaging a specialized SLED platform like MGT.
    claimRefs: [CM001, CM002, CM003, CM004, CM005]
    tableRefs: [TM001]
    figureRefs: [FM001]

  - id: "tam-sam-som-sizing"
    title: "TAM / SAM / SOM Sizing Through Multiple Lenses"
    body: >
      No single generic TAM captures MGT's opportunity, so this analysis triangulates using several lenses.
      The top-down lens starts from the $160.2 billion 2026 SLED IT market and applies the seven analyst
      verticals—Health and Human Services ($44.4B), Education ($41B), Transportation ($19.2B), Finance and
      Administration ($16.7B), Justice and Public Safety ($15B), Utilities ($13.5B), and Environment and
      Housing ($10.4B). MGT's serviceable addressable market (SAM) concentrates in the Education,
      Finance/Administration, Justice/Safety, and cross-cutting cybersecurity and modernization segments
      where its portfolio is strongest. A conservative SAM of roughly $30-50 billion emerges if MGT's
      capabilities map to services-heavy portions of these verticals. The serviceable obtainable market
      (SOM) is bounded by MGT's current delivery capacity of 1,100+ employee-owners and its cooperative
      contract footprint; with company-stated revenue exceeding $400 million, MGT holds well under 0.3% of
      total SLED IT spend, implying a long runway but also that the company is a specialized share-taker
      rather than a dominant incumbent. Every sizing figure above blends independent analyst market data
      with company-stated revenue that remains unaudited, so the ranges are estimates rather than precise
      measurements.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM012]
    tableRefs: [TM002]
    figureRefs: [FM002]

  - id: "buyer-landscape-procurement"
    title: "Buyer Landscape and Procurement Mechanics"
    body: >
      SLED demand is fragmented across more than 90,000 government entities: 50 states, over 3,000 counties,
      roughly 19,000 municipalities, more than 13,000 school districts, and thousands of public colleges and
      special districts. Buyer, user, and payer roles frequently diverge—an agency CIO may specify a
      solution, a program director is the end user, and an elected budget authority or school board approves
      funding, often on annual appropriation cycles tied to state fiscal years ending June 30. Procurement
      rarely happens through simple direct sales; a large and growing share flows through cooperative
      purchasing vehicles such as OMNIA Partners, NASPO ValuePoint, and Sourcewell, which together move an
      estimated $60-70 billion annually and let entities buy off pre-competed contracts. MGT's disclosed
      footprint—52 state agency Master Service Agreements, 100+ state agency projects, and cooperative
      listings including OMNIA Partners—shows it has invested in the contract vehicles that shorten sales
      cycles. Education technology adds a distinct payer mechanism: the federal E-Rate program administered
      by USAC and the FCC subsidizes school and library connectivity, and MGT ranks as the No. 3 E-Rate
      provider for the 2026 season, giving it a funded channel into K-12 buyers.
    claimRefs: [CM013, CM014, CM015, CM016, CM017, CM018, CM019]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: "growth-drivers-tailwinds"
    title: "Growth Drivers and Tailwinds"
    body: >
      Several structural tailwinds support MGT's market. First, artificial intelligence has moved from
      pilots to production across SLED in 2026, and agencies increasingly seek secure, governance-first
      deployment partners—directly aligned with MGT's AI Experience Center and its 2026 AI-as-a-Service
      award. Second, cybersecurity is the top SLED technology priority as ransomware attacks against
      governments and schools rise; demand for managed detection, security operations, and resilience
      services is expanding. Third, decades of legacy systems create a durable technology modernization and
      cloud migration backlog that services firms are positioned to capture. Fourth, SLED has remained
      comparatively insulated from the federal spending contraction, and some analysts note a federal-to-SLED
      shift as vendors redirect capacity toward state and local demand. Fifth, cooperative purchasing and
      E-Rate funding lower the friction and cost of adoption for cash-constrained buyers. Together these
      drivers favor multi-capability platforms that can bundle AI, cybersecurity, modernization, and
      advisory work, which is precisely the integrated positioning MGT has assembled through acquisition.
      The timing of these tailwinds is near-term for AI and cybersecurity and multi-year for modernization.
    claimRefs: [CM020, CM021, CM022, CM023, CM024, CM025]
    tableRefs: [TM004]
    figureRefs: [FM004]

  - id: "constraints-headwinds-gaps"
    title: "Constraints, Headwinds, and Sizing Diligence Gaps"
    body: >
      The market also carries meaningful constraints. Budget normalization is the most cited: roughly half of
      states are projecting slower revenue growth or outright declines, tightening discretionary technology
      spending even as mandatory obligations rise. Procurement complexity and long, multi-stakeholder sales
      cycles slow revenue recognition and raise customer-acquisition cost. The wind-down of federal MS-ISAC
      funding removes a shared cybersecurity support layer many smaller entities relied on, creating both a
      risk (unprotected buyers) and an opportunity (paid replacement services) whose net effect is unsettled.
      On the deal side, one analyst report documents that government IT M&A volume stalled and private-equity
      activity fell year-over-year amid DOGE-driven federal contract cancellations and valuation volatility—a
      headwind for an acquisition-led platform. Finally, the sizing itself has genuine gaps: analyst SLED IT
      totals cluster near $160 billion but differ on vertical splits and growth, MGT's SAM cannot be isolated
      from public data, and the company's own revenue and growth figures are unaudited. These contradictions
      are preserved rather than resolved, and each is paired with a concrete diligence path.
    claimRefs: [CM026, CM027, CM028, CM029, CM030, CM031, CM032]

