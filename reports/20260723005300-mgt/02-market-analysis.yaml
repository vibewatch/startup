callouts:
  - calloutType: "insight"
    title: "MGT Is a Specialized Share-Taker, Not an Incumbent"
    body: >
      Against a $160.2 billion 2026 SLED IT market, MGT's >$400M company-stated revenue is well under 0.3%
      of total spend. This implies a long growth runway, but it also means the investment thesis rests on
      continued share capture in specific verticals rather than defending a dominant position.
    claimRefs: [CM008, CM011]

  - calloutType: "strength"
    title: "Funded Channels Lower Adoption Friction"
    body: >
      Cooperative purchasing vehicles (OMNIA, NASPO ValuePoint, Sourcewell) move an estimated $60-70 billion
      annually and let buyers skip lengthy procurements, while the E-Rate program subsidizes K-12 connectivity.
      MGT's presence on these vehicles and its No. 3 E-Rate ranking give it funded, lower-friction routes to
      cash-constrained buyers.
    claimRefs: [CM016, CM017, CM019]

  - calloutType: "risk"
    title: "Budget Normalization and M&A Stall Are Real Headwinds"
    body: >
      Roughly half of states project slower revenue or declines, tightening discretionary technology budgets,
      and one analyst report documents a government-IT M&A stall with falling PE activity amid DOGE contract
      cancellations. Both pressure an acquisition-led growth model whose revenue is unaudited.
    claimRefs: [CM026, CM029]

  - calloutType: "assumption"
    title: "SAM/SOM Ranges Are Report-Derived Estimates"
    body: >
      Because MGT's serviceable market cannot be isolated from public analyst data and company revenue is
      unaudited, the $30-50B SAM and $2-6B SOM figures are triangulated estimates. Diligence should validate
      them against MGT's internal pipeline, win rates, and audited revenue by vertical.
    claimRefs: [CM009, CM032]

