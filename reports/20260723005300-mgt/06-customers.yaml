schemaVersion: "report-v2"
artifact: "customers"
slug: "mgt"
runDate: "2026-07-23"
company:
  name: "MGT"
chapter:
  number: 6
  title: "Customers"
  summary: >
    MGT's customer evidence supports real SLED adoption but remains much stronger on breadth than on durability:
    the company states 2,500+ clients, 30,000+ engagements, 38 states served, 52 state-agency MSAs, and 100+
    state-agency projects, while public named proof consists mostly of company-controlled case studies and
    testimonials. The underwriting gap is retention and concentration: public sources do not disclose NRR, GRR,
    logo churn, top-customer revenue, revenue by cooperative vehicle, or independent satisfaction metrics.

sections:
  - id: "customer-segmentation"
    title: "Customer Segmentation and Buyer / User / Payer Map"
    body: >
      MGT sells into a fragmented U.S. SLED universe rather than a single homogeneous customer category. The
      publicly supported segments are state agencies and state departments of education, local governments
      (counties, municipalities, special districts, and utilities), K-12 districts, and higher-education
      institutions. Buyers are typically CIOs, procurement officers, superintendents, boards, agency heads, or
      city/county administrators; users are program teams, IT teams, educators, and administrators; payers are
      appropriated public budgets, school boards, higher-education budgets, or federally supported mechanisms
      such as E-Rate. MGT's own segmentation is broad: technology modernization, cyber, AI, facilities, fiscal,
      human-capital, education improvement, and higher-education advisory. That breadth creates cross-sell
      surface, but it also makes customer quality hard to underwrite without revenue by segment and buyer type.
      The most concrete public scale markers are self-reported state-agency projects, state-agency MSAs,
      education projects, and public customer testimonials, not audited active-account records.
    claimRefs: [CU002, CU003, CU004, CU005, CU006, CU010]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: "growth-adoption-trajectory"
    title: "Growth and Adoption Trajectory"
    body: >
      MGT's adoption trajectory is best described as large-scale, company-stated breadth with limited public
      denominator disclosure. The company and independent coverage repeat the headline operating markers: more
      than 2,500 clients, more than 30,000 engagements, 1,100+ employee-owners, 38 states with dedicated presence,
      52 state-agency Master Service Agreements, 100+ state-agency projects, 38 state Department of Education
      projects, 2,500 education projects completed, and a No. 3 ranking among E-Rate providers for the 2026 season.
      These figures suggest meaningful penetration into SLED procurement and education channels, especially where
      cooperative vehicles and E-Rate lower buying friction. However, they are mostly cumulative and
      company-stated. Public sources do not disclose the active customer denominator, logo adds by year,
      deployment starts versus completions, average contract size, backlog, win rate, or revenue contribution by
      vehicle. The chapter therefore treats the figures as adoption proxies, not as evidence of current recurring
      revenue or retention.
    claimRefs: [CU001, CU003, CU004, CU007, CU008, CU020, CU026]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: "named-customer-proof"
    title: "Named Customer Proof and Reference Quality"
    body: >
      Public named proof is real but selected and uneven. MGT's own pages cite or quote education and government
      customers including Hillsborough County Public Schools, Paul R. Brown Leadership Academy, South Bay Union
      School District, Texas A&M University, Ogden School District, Gwinnett County Public Schools, City of
      Baltimore, Madison County, the Utah State Board of Education, and a Des Moines education resource-center
      engagement. Those examples matter because they tie MGT to concrete public-sector use cases such as school
      improvement, facilities planning, boundary and GIS work, higher-education strategy, supplier-diversity
      studies, and parcel-data modernization through OMNIA. But most of the proof is company-hosted rather than
      customer-hosted, and several snippets do not disclose contract value, implementation date, production status,
      renewal, or measurable outcome. The diligence conclusion is that MGT has credible referenceable customers,
      while the public set is only a sample and cannot prove portfolio-wide adoption, retention, or customer ROI.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU036]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: "retention-repeat-and-satisfaction"
    title: "Retention, Repeat Usage, and Satisfaction Signals"
    body: >
      Retention evidence is the chapter's largest customer-quality gap. Positive public signals exist: more than
      30,000 engagements across 2,500+ clients implies repeated project volume; South Bay Union's testimonial
      describes more than a decade of facility-planning support; Hillsborough, Paul R. Brown, Texas A&M, and other
      customer quotes indicate satisfaction in selected engagements; and cooperative or E-Rate channels can support
      repeat procurement when buyers continue to need technology, facilities, cyber, or advisory work. None of
      those signals is equivalent to net revenue retention, gross revenue retention, logo churn, renewal rate,
      cohort expansion, average contract length, NPS, CSAT, or an independently audited reference program. For a
      services-heavy SLED company, this distinction is critical: repeat engagements can be durable, but they can
      also be episodic consulting work. The base-case underwriting treatment should assign medium confidence to
      repeat-work proxies and low confidence to any precise retention economics until management provides cohort
      data.
    claimRefs: [CU021, CU022, CU023, CU024, CU025, CU037, CU038, CU040]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: "expansion-and-concentration-risk"
    title: "Expansion Paths and Concentration Risk"
    body: >
      MGT has multiple expansion paths: cross-sell from advisory into managed technology, cyber, AI, and
      facilities work; higher-education expansion through the rpk GROUP acquisition; K-12 networking through
      E-Rate; and geographic whitespace in states, counties, municipalities, and education entities not yet served.
      Cooperative purchasing through OMNIA, NASPO, and Sourcewell can reduce procurement friction, while MGT's
      breadth lets the company pursue adjacent budget owners after landing a client. The risks sit on the same
      axis. Public evidence does not disclose top-customer concentration, revenue by state, revenue by vertical,
      revenue by cooperative vehicle, acquired-client retention, or channel-attributed bookings. Heavy SLED budget
      exposure also matters because state and local buyers face revenue normalization, staffing pressure, and
      complex public procurement. The customer diligence package should therefore quantify concentration, verify
      whether acquired customer bases are retained, and separate repeat expansion from one-off project volume.
    claimRefs: [CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU039, CU040]
    tableRefs: [TU005]

