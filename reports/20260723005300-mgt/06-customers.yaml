figures:
  - id: "FU001"
    title: "Customer Journey Map"
    type: "journey-map"
    layout: "wide"
    summary: "Representative SLED customer journey from public need through procurement, delivery, repeat work, and expansion."
    data:
      nodes:
        - id: "need"
          label: "Public-sector need"
          detail: "Agency, district, or institution faces modernization, cyber, staffing, facilities, fiscal, or education-performance pressure."
        - id: "budget"
          label: "Budget / mandate"
          detail: "Appropriation, school-board approval, higher-education budget, grant, ARPA, or E-Rate mechanism frames affordability."
        - id: "procurement"
          label: "Procurement route"
          detail: "Buyer uses direct RFP, state MSA, OMNIA, NASPO, Sourcewell, or E-Rate-supported procurement."
        - id: "deployment"
          label: "MGT delivery"
          detail: "Advisory, managed technology, cyber, AI, facilities, education, or higher-education work is delivered by project teams."
        - id: "reference"
          label: "Reference / proof"
          detail: "Named testimonials and case studies support selected outcomes, but most are company-hosted."
        - id: "expansion"
          label: "Repeat / expansion"
          detail: "Potential expansion into adjacent services exists; retention and wallet-share metrics are not public."
    approximationNotes: "Qualitative journey map; it shows the public sales and delivery mechanics rather than measured conversion rates."
    claimRefs: [CU034, CU035, CU039]

  - id: "FU002"
    title: "Adoption / Deployment Funnel"
    type: "funnel"
    layout: "standard"
    summary: "Illustrative adoption funnel anchored to public procurement mechanics and MGT's undisclosed conversion gaps."
    data:
      items:
        - label: "Addressable SLED entities"
          value: 100
        - label: "Reachable via vertical / channel fit"
          value: 55
        - label: "Qualified need and funding"
          value: 35
        - label: "Contract vehicle or award path"
          value: 24
        - label: "Deployment / engagement delivered"
          value: 16
        - label: "Repeat or expansion opportunity"
          value: 9
    approximationNotes: "Indexed illustrative funnel only; MGT does not publish actual lead, win, deployment, renewal, or expansion conversion rates."
    claimRefs: [CU025, CU026, CU034, CU037]

  - id: "FU003"
    title: "Customer Proof Matrix"
    type: "matrix"
    layout: "wide"
    summary: "Public customer proof by segment, outcome specificity, and retention visibility."
    data:
      columns: ["Proof surface", "Outcome specificity", "Retention visibility", "Independence"]
      rows:
        - label: "State DOE / Utah"
          values: ["Named state education selection", "Scope described", "Not disclosed", "Company-hosted"]
        - label: "K-12 / Hillsborough"
          values: ["Named district and principal", "Qualitative testimonial", "Year-1 reference only", "Company-hosted"]
        - label: "K-12 / South Bay"
          values: ["Named district", "Long-tenure facilities support", "More than a decade proxy", "Company-hosted"]
        - label: "Higher ed / Texas A&M"
          values: ["Named university", "Organizational-effectiveness quote", "Not disclosed", "Company-hosted"]
        - label: "County / Madison County"
          values: ["Named county teaser", "ARPA/GIS outcome teaser", "Not disclosed", "Company + partner channel"]
    approximationNotes: "Matrix scores evidence quality qualitatively; it does not assign revenue, contract value, or independent satisfaction metrics."
    claimRefs: [CU011, CU013, CU015, CU016, CU017, CU023, CU036]

  - id: "FU004"
    title: "Retention / Repeat Cohort"
    type: "cohort"
    layout: "standard"
    summary: "Proxy retention scorecard showing why public repeat signals cannot substitute for true retention cohorts."
    data:
      columns: ["Client-count proxy", "Repeat-work proxy", "Published cohort metric", "Data-room proof"]
      rows:
        - label: "All SLED clients"
          values: [65, 70, 0, 20]
        - label: "Education references"
          values: [60, 75, 0, 25]
        - label: "Cooperative channels"
          values: [55, 60, 0, 15]
    approximationNotes: "Values are 0-100 proxy scores for evidence availability, not actual retention percentages; public NRR, GRR, churn, and cohort retention are unavailable."
    claimRefs: [CU021, CU022, CU023, CU038, CU040]

callouts:
  - calloutType: "strength"
    title: "Breadth Is Real, Even if It Is Self-Reported"
    body: >
      MGT's 2,500+ client and 30,000+ engagement claims, together with state-agency MSAs, DOE projects,
      education projects, E-Rate rank, and named testimonials, support a broad SLED footprint.
    claimRefs: [CU001, CU003, CU004, CU007, CU022]
  - calloutType: "risk"
    title: "Retention and Concentration Are Not Public"
    body: >
      Public sources do not disclose NRR, GRR, churn, average contract length, top-customer revenue,
      revenue by state, or revenue by cooperative vehicle, so customer durability remains a data-room issue.
    claimRefs: [CU021, CU032, CU033, CU040]
  - calloutType: "insight"
    title: "Named Proof Is Strongest in Education and Government Advisory"
    body: >
      The clearest public customer examples are education improvement, facilities planning, higher-education
      strategy, state DOE work, supplier-diversity studies, and local-government GIS or parcel-data work.
    claimRefs: [CU011, CU012, CU013, CU015, CU016, CU017]
  - calloutType: "recommendation"
    title: "Underwrite Customer Quality From Cohorts, Not Logos"
    body: >
      The diligence package should start with active-account cohorts, renewal history, expansion revenue,
      acquired-customer retention, customer concentration, and independent reference calls by segment.
    claimRefs: [CU020, CU021, CU040]

