          label: 证据质量缺口
          detail: 经审计收入、利润率、留存、有机增长和集中度均未公开。
        - id: capital
          label: 信贷结构
          detail: Ares 信贷基金带来资本，同时引入债务偿付和债务契约尽调。
        - id: comps
          label: 可比公司纪律
          detail: MGT 位于服务同业与 Tyler 软件估值天花板之间。
        - id: decision
          label: 继续研究 / 有条件跟踪
          detail: 只有数据室证明验证收入质量、杠杆承受力和退出路径，才继续推进。
      edges:
        - from: scale
          to: decision
          label: 支持跟踪
        - from: market
          to: decision
          label: 支持上行
        - from: quality
          to: decision
          label: 使买入不成立
        - from: capital
          to: decision
          label: 抬高尽调门槛
        - from: comps
          to: decision
          label: 设定价格纪律
    approximationNotes: 定性逻辑图；箭头不代表量化概率。
