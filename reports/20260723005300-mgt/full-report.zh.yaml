            title: 预算正常化和 M&A 停滞是真实逆风
            body: |
              约一半州预计收入放缓或下降，压缩可自由支配技术预算；一份分析师报告还记录了 DOGE 合同取消背景下政府 IT M&A 停滞、PE 活动下滑。这两点都会压迫一个收购驱动、且收入未经审计的增长模型。
