            body: >
              面对 2026 年 $160.2 billion 的 SLED IT 市场，MGT 公司口径的 >$400M 收入占总支出远低于
              0.3%。这意味着增长跑道很长，但投资论点建立在继续抢占特定垂直领域份额上，而不是守住主导地位。
