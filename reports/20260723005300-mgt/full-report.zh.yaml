      - 严重性
    rows:
      - - 经审计收入显著低于公开 $400M 说法
        - QoE、审计或月度账目显示规模基数更低
        - 隐含倍数上升，估值支撑立即变弱
        - 高
      - - 违反契约或再融资失败
        - Ares 信贷额度无法偿付，或无法按可接受条款再融资
        - 债务包袱压过增长和收购平台叙事
        - 高
      - - 关键协作合同或 E-Rate 渠道丧失
        - OMNIA、E-Rate 或类似公共部门路径被暂停或不再重点推进
        - 分销优势和收入可见度恶化
        - 中高
      - - 重大安全事件、诉讼或认证失败
        - 客户安全事件、监管行动，或安全尽调失败
        - 网络安全信任和公共部门采购资格受损
        - 高
      - - CEO 离任且无接班证明
        - A. Trey Traviesa 离任，且管理层深度未经验证
        - 整合期间，执行和资本市场信心减弱
        - 中
      - - 可比倍数压缩
        - 政府 IT 服务估值筛查下行，或 PE 活动持续疲弱
        - 退出估值和基准情景倍数下调
        - 中高
    notes: 触发项是拟议投委会阈值；公开来源未显示这些事件已经发生。
