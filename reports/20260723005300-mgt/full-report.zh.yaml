      - number: '2.4'
        title: 增长驱动与顺风
        blocks:
          - type: paragraph
            body: >
              几个结构性顺风支撑 MGT 的市场。第一，2026 年 AI 在 SLED 领域已从试点走向生产，机构越来越需要安全、治理优先的部署伙伴；这与 MGT 的 AI Experience Center 和 2026
              年 AI-as-a-Service 奖项直接匹配。第二，随着针对政府和学校的勒索软件攻击上升，网络安全成为 SLED
              技术的首要优先事项；托管检测、安全运营和韧性服务需求正在扩张。第三，数十年的遗留系统形成持久的技术现代化和云迁移积压，服务公司正好可以承接。第四，SLED
              相对不受联邦支出收缩影响；部分分析师指出，供应商将产能转向州和地方需求，形成从联邦到 SLED 的转移。第五，合作采购和 E-Rate 资金降低了预算受限买家的采用摩擦和成本。这些驱动因素合在一起，有利于能打包
              AI、网络安全、现代化和咨询工作的多能力平台；MGT 正是通过收购拼出了这种整合定位。AI 和网络安全的顺风更偏短期，现代化则是多年周期。
            claimRefs:
