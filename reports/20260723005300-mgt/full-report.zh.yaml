      - number: '1.4'
        title: 规模、牵引力与地域覆盖
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 12 月，MGT 拥有 1,100+ 名员工持股者，服务全美 2,500+ 个 SLED 客户。公司称每年影响 200 million+ 人，其中包括 20 million 名 K-12
              学生。MGT 在多个州运营；公司营销材料称服务覆盖 38+ 个州，但外部无法独立核验确切州数。公司持有 50+ 份政府实体主服务协议，运营历史中完成了 30,000+
              个客户项目。公司在州政府解决方案页面披露的关键指标包括：为州机构完成 100+ 个项目、与州教育部（DOE）合作 38 个项目，以及 52 份州机构主服务协议。2025 年，MGT 在 Inc. 5000
              最快增长私人公司榜单中排名第 830，增速 508%；在 CRN 北美增长最快技术公司 Fast Growth 150 榜单中排名第 6。MGT 入选 2026 GovTech
              100，该榜单认可推动州和地方政府创新的顶尖公司。公司在 2026 年季（Year 29）的 E-Rate 服务商中排名第 3，凸显其在教育技术连接项目中的领导地位。凭借安全、治理优先的 AI 方法，MGT 获得
              AI Breakthrough 评选的 2026 AI-as-a-Service Solution of the Year。员工数从 2024 年 9 月的 900+ 名专业人员增至 2025 年 12 月的
              1,100+，约 15 个月增长 22%。
