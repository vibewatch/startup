  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >-
              MGT 的监管风险，不在于某个已知执法行动，而在于它服务的客户流程本身高度受监管。公司面向 K-12、州机构和地方政府销售，并公开强调 E-Rate 相关性、网络安全、托管技术和
              AI。这意味着投资者在把收入质量视为低风险前，必须核查采购规则、E-Rate 资格与文档、教育数据隐私、网络安全框架以及认证状态。FCC 和 USAC 来源说明了 E-Rate 项目的机制；NIST 和 CISA
              设定了网络风险管理门槛；法律分析来源也强调，监管实施细节变化会改变合规负担。主要缺口在于公开材料不够具体：已保留证据不能确认 SOC 2、FedRAMP、StateRAMP、FERPA 控制、E-Rate
              审计历史或重大诉讼状态。因此，尽调应把这一类问题转化为文件清单，而不是默认合规干净。
