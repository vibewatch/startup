      - number: '2.2'
        title: 多视角 TAM / SAM / SOM 测算
        blocks:
          - type: paragraph
            body: >
              没有一个通用 TAM 能完整概括 MGT 的机会，因此本分析用多重视角交叉测算。自上而下视角从 2026 年 $160.2 billion 的 SLED IT
              市场出发，并套用七个分析师垂直领域：健康与人类服务（$44.4B）、教育（$41B）、交通（$19.2B）、财政与行政（$16.7B）、司法与公共安全（$15B）、公用事业（$13.5B），以及环境与住房（$10.4B）。MGT
              的可服务市场（SAM）集中在教育、财政 / 行政、司法 / 安全，以及跨领域网络安全和现代化板块；这些是其组合最强的地方。如果把 MGT 能力映射到这些垂直领域中服务权重较高的部分，保守 SAM 约为
              $30-50 billion。可获得市场（SOM）受 MGT 当前 1,100+ 名员工持股者交付能力和合作合同覆盖限制；以公司披露的超过 $400 million 收入计算，MGT 在 SLED IT
              总支出中的份额远低于 0.3%，意味着增长跑道很长，但公司更像垂直领域的专业份额掠夺者，而非主导型既有厂商。上述所有规模测算都把独立分析师市场数据与未经审计的公司收入口径混合使用，因此是估计区间，不是精确计量。
