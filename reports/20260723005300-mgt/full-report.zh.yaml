        title: 留存、重复使用与满意度信号
        blocks:
          - type: paragraph
            body: >
              留存证据是本章最大的客户质量缺口。公开正面信号确实存在：2,500+ 客户对应 30,000+ 项目，说明项目量有重复；South Bay Union
              的证言描述了十多年设施规划支持；Hillsborough、Paul R. Brown、Texas A&M 等客户引述显示部分项目满意度较高；合作采购或 E-Rate
              渠道也能在买方持续需要技术、设施、网络安全或咨询服务时支撑重复采购。但这些信号都不等同于净收入留存率（NRR）、总收入留存率（GRR）、logo
              流失、续约率、队列扩张、平均合同期、NPS、CSAT，或经独立审计的客户参考计划。对一家服务占比高的 SLED
              公司来说，这个区分很关键：重复项目可以很稳，也可能只是阶段性咨询工作。基准承销时，应对重复工作代理指标给中等置信度；在管理层提供队列数据前，对任何精确留存经济性都只能给低置信度。
