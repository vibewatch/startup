      - number: '2.3'
        title: 买方格局与采购机制
        blocks:
          - type: paragraph
            body: >
              SLED 需求分散在 90,000+ 个政府实体中：50 个州、3,000+ 个县、约 19,000 个市镇、13,000+ 个学区，以及数千所公立高校和特别区。买方、用户和付款方常常分离——机构 CIO
              可能指定解决方案，项目负责人是终端用户，民选预算机构或学区委员会批准资金；资金周期往往按年度拨款走，并与 6 月 30 日结束的州财政年度绑定。采购很少通过简单直销完成；越来越大的一部分流经 OMNIA
              Partners、NASPO ValuePoint 和 Sourcewell 等合作采购渠道，这些渠道合计每年推动约 $60-70 billion 采购，并允许实体基于已预竞标合同购买。MGT 披露的覆盖——52
              份州机构主服务协议、100+ 个州机构项目，以及包括 OMNIA Partners 在内的合作采购上架——说明公司已投入能缩短销售周期的合同渠道。教育技术还有独特付款机制：由 USAC 和 FCC 管理的联邦
              E-Rate 项目补贴学校和图书馆连接；MGT 在 2026 年季排名第 3 的 E-Rate 服务商，拥有进入 K-12 买家的有资金支持渠道。
