        - 经审计增长、高留存、利润率韧性和高溢价混合定位
      - - 基准
        - 公司所称收入底线大体准确，但收入质量仍偏服务
        - 收入 ~3.0x
        - $1.2B-$1.3B 示意
        - 当前所称估值接近公允价值，但需要债务和 QoE 证据
      - - 熊市
        - 收入被打折，或倍数向政府服务同业回落
        - 收入 1.5x-2.0x
        - $0.6B-$0.9B 示意
        - 收入未经审计、债务压力、有机增长疲软或倍数压缩
      - - 放弃情形
        - 债务压力、违反契约，或经审计收入显著低于公开说法
        - 低于 1.5x，或没有可支撑报价
        - 重新承销 / 放弃
        - 信贷结构和收入质量压过市场顺风
    notes: 情景价值是基于公开收入说法的粗略收入倍数敏感性分析；不是 DCF，也不是经审计的公司估值。
    claimRefs:
      - CV003
      - CV005
      - CV019
      - CV020
      - CV021
      - CV031
      - CV032
  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 业务组合
      - EV/Revenue（约）
      - 经常性 / 利润率画像
      - 对 MGT 的参考意义
    rows:
      - - Tyler Technologies
        - 公共部门软件与支付龙头
        - 收入 ~5x+ 口径
        - 经常性软件占比更高，且具备上市公司利润率
        - 有用的上限参照；MGT 不应自动拿 Tyler 的软件倍数
      - - Accenture
        - 全球咨询、外包和公共服务技术
        - 广义 IT 服务视角下收入 ~3x
        - 服务占比高，但具备规模和多元交付
        - 更接近服务业基准，可约束基准情景倍数
      - - CGI
        - 政府和企业 IT 服务
        - 服务业务收入 ~1.5x-2x 区间
        - 系统集成和托管服务，软件纯度较低
        - 对交付占比较高的收入，是可参考的较低服务基准
      - - Leidos / SAIC
        - 美国政府技术与任务服务
        - 服务业务收入 ~1x-1.5x 区间
        - 合约服务和系统集成
        - 如果 MGT 主要是项目 / 服务收入，可作为下行情景参照
      - - ICF
        - 政府咨询和数字服务
        - 服务视角下收入 ~1x
        - 咨询和实施经济性
        - 若咨询 / 服务组合占主导，则有参考意义
      - - MGT
        - 私有 SLED 服务平台，带有托管服务上行空间
        - 基于 >$400M 收入底线隐含 ~3.1x
        - 私有、未经审计、服务占比较高，但可能有经常性收入块
        - 高于纯服务同业、低于 Tyler；需要证明混合业务质量
    notes: 可比样本基于公开证据，并不穷尽；倍数是从保留的市场数据和上市公司语境提取的近似收入倍数视角。
    enumerationScope:
      coverage: sample
      basis: Publicly traded public-sector IT and government services comparables benchmarked on revenue multiples
