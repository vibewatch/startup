            body: >-
              最后一章应把不确定性转成明确监控规则。如果经审计收入显著低于公开的 $400 million 下限，或内生增长明显弱于 144% CAGR
              叙事暗示，或服务线利润率看起来更像低端咨询而非托管服务经济性，就应重新承销 MGT 或放弃。Ares
              融资工具带来第二组硬触发点：违反契约、再融资失败、高现金利息负担或抵押品限制，都会让信用资本从增长助推器变成估值包袱。商业触发点也重要，包括失去合作采购工具、E-Rate
              中断、客户集中度、重大入侵、安全诉讼，或没有继任证明的领导层动荡。这些不是已知事件，而是尽调门槛。
            claimRefs:
              - CV010
              - CV029
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV010
              - CV029
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV009
              - CV017
              - CV029
              - CV043
              - CV044
      - number: '8.6'
        title: 最终尽调材料清单与结论
        blocks:
          - type: paragraph
            body: >-
              结论是有条件的，而不是负面的。MGT
              具备规模、赞助方支持和市场相关性，值得继续尽调，但没有数据室，公开估值案无法闭合。最高价值的材料，是经审计财务加收益质量桥表，用来拆分内生和收购增长，并勾稽收入、EBITDA、自由现金流和营运资本。下一批材料包括经常性收入定义、续约队列、客户和渠道集中度、服务线
              P&L、Ares 信用文件、认证和事件历史，以及收购整合记分卡。买入观点要求这些材料确认增长耐久、杠杆可控、客户留存有防御性，并存在可信退出路径。没有这些证明，合适立场是在价格纪律下继续研究，而不是追估值。
            claimRefs:
              - CV028
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV044
          - type: table
            tableRef: TV006
            claimRefs:
              - CV028
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV044
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 条件跟踪，而非买入
            body: MGT 值得继续尽调，但公开记录没有验证收入质量、债务条款或利润率，不足以支撑以 $1.25 billion 估值买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV011
              - CV030
          - type: callout
            title: 债务不是股权验证
            body: Ares 信用参与是建设性的贷款方信号，但它提出的是契约和债务服务尽调问题，而不是验证普通股上行空间。
            calloutType: risk
            claimRefs:
              - CV006
              - CV018
              - CV032
          - type: callout
            title: 只能做近似倍数
            body: 收入倍数区间仅作示意，因为 MGT 不披露经审计财务、EBITDA、自由现金流或公开股权结构条款。
            calloutType: assumption
            claimRefs:
              - CV005
              - CV015
              - CV020
              - CV021
          - type: callout
            title: 溢价需要混合模式证明
            body: 只有管理层证明经常性托管服务、留存、利润率和整合质量，MGT 才能证明相对服务可比公司享有溢价。
            calloutType: insight
            claimRefs:
              - CV012
              - CV026
              - CV044
