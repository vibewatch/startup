      - number: '2.5'
        title: 约束、逆风与规模测算尽调缺口
        blocks:
          - type: paragraph
            body: >
              这个市场也有实质性约束。最常被提到的是预算正常化：约一半州预计收入增长放缓或直接下降；即便强制性支出上升，可自由支配的技术预算也会收紧。采购复杂、销售周期长、利益相关方多，会拖慢收入确认并抬高获客成本。联邦
              MS-ISAC 资金退出，拿掉了许多小型实体依赖的共享网络安全支持层；它同时带来风险（买家保护不足）和机会（付费替代服务），净效应尚未定论。交易层面，一份分析师报告记录，受 DOGE
              驱动的联邦合同取消和估值波动影响，政府 IT M&A 交易量停滞，私募股权活动同比下降；这对收购驱动的平台是逆风。最后，规模测算本身存在真实缺口：分析师对 SLED IT 总额的估计集中在 $160
              billion 附近，但垂直拆分和增速不同；MGT 的 SAM 无法从公开数据中剥离；公司自己的收入和增长数字也未经审计。本报告保留这些矛盾，不强行解决，并为每个问题配套具体尽调路径。
            claimRefs:
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
