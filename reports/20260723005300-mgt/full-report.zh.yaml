      - number: '1.3'
        title: 融资历史、估值与投资者图谱
        blocks:
          - type: paragraph
            body: >
              MGT 的融资进程在 2023 年 4 月 The Vistria Group 多数股权投资后明显加速，该投资触发了当前四年价值创造计划。自那笔投资以来，公司企业价值到 2025 年 12 月已增长至三倍。MGT
              迄今最关键的交易，是 2025 年 12 月 3 日完成的 Ares Credit 基金（Ares Management Corporation，NYSE: ARES）$350 million
              投资；该交易把公司估值推至 $1.25 billion，并使其成为 SLED 服务行业首个独角兽。理解资本结构时，Ares
              投资采用债权而非股权这一点很重要：这是一笔类债务资本，用于支持收购和内生增长提速，不是传统风险股权轮。现有机构投资者包括 The Vistria Group（多数股东，AUM $17B
              的影响力投资机构）、J.P. Morgan 和 WhiteHorse Capital。Ares Management（NYSE: ARES，截至 2025 年 9 月 AUM 为 $595 billion）通过
              Opportunistic Credit 策略参与，由 Opportunistic Credit 联席负责人 Craig Snyder 领导。$1.25 billion 的估值让 MGT
              成为首家达到独角兽状态的私营 SLED 技术服务公司，这一市场里程碑被广泛引用。Ares 投资之前的总融资额未公开；公司也未发布审计财务报表或详细资产负债表数据。Ares
              资本被明确指定用于更大规模收购和增长提速，服务于正在推进的价值创造计划。
