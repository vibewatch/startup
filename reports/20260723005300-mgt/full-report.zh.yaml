        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              MGT 是可信的规模化平台，但估值建议应保持继续研究 / 条件跟踪，而不是买入。最强的公开事实包括：公司声称估值 $1.25 billion、Ares 信用投资 $350 million、公司自述 2024
              年收入超过 $400 million，以及自 2021 年以来收入 CAGR 达 144%。这些事实足以支撑严肃尽调，也值得继续密切跟踪公司。它们本身不能支撑价格承销。收入基础未公开审计，Ares
              资金是信用基金资本而不是干净股权融资，公开记录也缺少 EBITDA、毛利率、内生增长、经常性收入占比、客户集中度和契约条款。按公司自述收入计算，MGT 估值约为
              3x；除非私有尽调证明其具备软件式留存和利润率耐久性，否则对一家服务占比高的平台而言，这个价格看起来介于合理和偏高之间。
