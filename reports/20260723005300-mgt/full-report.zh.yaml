      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              MGT 的领导团队以 CEO A. Trey Traviesa 为核心；自接掌公司并推动激进 M&A 与增长策略以来，他一直是公司转型的关键人物。Lawrence Cowan
              担任收入运营首席运营官，也是重大交易的公开媒体联系人。Thomas Cahill 担任合作伙伴与联盟解决方案高级副总裁，在重大技术合作上有公开曝光，例如 2026 年 3 月宣布的 HPE-Protopia AI
              中心。2026 年初，MGT 扩充领导团队，任命 Omar Bhatti 为 EVP 兼技术解决方案集团总裁，Adam Appleby 为 EVP
              兼咨询解决方案总裁，显示公司正在走向更结构化的企业架构。Ibrahim「Ibo」Otun 被任命为首席 AI 与信息官，负责公司的 AI 工厂、企业技术和数据平台。现场工程副总裁 Stefan Schmidt
              入选 CRN 2026 Next-Gen Solution Provider Leaders 榜单。关键人物风险主要围绕 CEO Traviesa；他的战略愿景驱动当前四年价值创造计划。作为私人公司，MGT
              由多数股权投资者 The Vistria Group（自 2023 年 4 月起）以及 J.P. Morgan、WhiteHorse Capital、Ares Management
              等机构投资者支持，控制权落在机构投资者手中。董事会构成尚未详细公开。MGT
              在新闻稿中反复提到员工持股模式，该模式把员工激励与公司增长和价值创造绑定。根据本报告审阅的公开申报和新闻稿，公司未披露任何重大高管离职或治理争议。
