            body: >-
              MGT
              的单位经济未公开披露。保留的公开资料中，没有任何来源给出毛利率、EBITDA、净利润、销售与营销费用、CAC、回本周期、净收入留存、利用率、按服务线划分的交付利润率或队列表现。最好的公开代理指标也只是间接的：公司称拥有
              2,500+ 个客户和 30,000+ 个项目，暗示重复项目量；> $400 million 的收入声明与 1,100+ 名员工持股者对应，暗示人均收入高于约
              $360,000。这些代理指标有用但不够。服务毛利率会随劳动力结构、分包商、硬件转售和利用率大幅波动；托管服务可能更黏，但需要 SOC/NOC 人力、工具和客户支持。因此，承销答案只能是定性的：MGT
              可能拥有有吸引力的经常性服务口袋，但在管理层提供队列和服务线 P&L 之前，利润率路径和留存经济只能依赖私有证据。
