companyProfile:
  summary: >
    MGT 是一家总部位于佛罗里达州坦帕的全国性技术与咨询解决方案提供商，专注服务美国州、地方和教育（SLED）政府市场。公司由教育和政府管理专家于 1974 年创立；2016 年新领导层上任后，MGT 通过程序化收购策略完成 13
    笔收购，转型为多元化政府技术平台，覆盖网络安全、IT 现代化、AI、人力资本、E-Rate 连接、财政管理和 K-12 学校改进。2025 年 12 月，Ares Management 通过债权工具向 MGT 投入 $350
    million，公司估值达到 $1.25 billion，并使其成为 SLED 技术服务领域首个独角兽。公司服务 2,500+ 个 SLED 客户，拥有 1,100+ 名员工持股者，每年影响 200 million+ 人，其中包括
    20 million 名 K-12 学生。MGT 预计 2024 年收入为 $400M+，自 2021 年以来 CAGR 为 144%，但这些数据均为公司口径，未经审计。主要机构投资者包括 The Vistria
    Group（多数股权）、J.P. Morgan、WhiteHorse Capital 和 Ares Management。
