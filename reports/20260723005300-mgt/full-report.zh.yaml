            body: >-
              资本充足性是最尖锐的财务尽调问题。MGT 宣布 Ares Credit 基金按 $1.25 billion 估值投资 $350 million；如果 >$400 million
              的收入基数准确，这意味着企业价值约为收入底线的 3x。这一公告有积极面，因为它增加了机构融资，并给 MGT 首个 SLED
              独角兽的信号；它也带来风险，因为资本被描述为来自债权基金，而非传统股权轮。公开资料没有披露到期日、利率、摊销、契约、抵押品、债务偿付、受限现金，也没有说明该融资支持收购、再融资、股东流动性还是内生增长。烧钱、账上现金、营运资本和资金可支撑时长也缺失。对服务平台而言，现金流耐久性取决于回款、薪资、分包商、整合支出、收购
              earnout，以及 SLED 拨款时点；这些都无法从公开资料中确认。
