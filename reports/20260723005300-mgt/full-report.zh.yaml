        blocks:
          - type: paragraph
            body: >
              MGT 面向的是碎片化的美国 SLED 市场，不是单一同质客群。公开材料能支撑的细分客群包括州政府机构和州教育厅、地方政府（县、市、特殊区和公用事业机构）、K-12 学区以及高等教育机构。采购决策者通常是
              CIO、采购官、学监、董事会、机构负责人或市 / 县行政官；使用者是项目团队、IT 团队、教育工作者和行政人员；付款方来自公共拨款预算、学校董事会、高等教育预算，或 E-Rate 等联邦支持机制。MGT
              自己把业务切得很宽：技术现代化、网络安全、AI、设施、财政、人力资本、教育改进和高等教育咨询。业务面宽带来交叉销售空间，也意味着如果没有按细分业务和买方类型拆分的收入，客户质量很难下判断。最具体的公开规模标记，是公司自报的州机构项目、州机构
