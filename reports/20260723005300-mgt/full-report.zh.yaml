              的需求。这些缓释因素不能消除剩余风险，因为多数下行触发点都需要私有证据验证。投委会应把以下事项视为硬性重新承销或放弃事件：违反契约或再融资失败；重大客户入侵、安全诉讼或执法事件；关键合作采购工具或 E-Rate
              渠道丢失 / 暂停；CEO 离任且继任未经验证；以及经审计收入或内生增长显著低于公开口径。监控应明确包括：渠道收入、头部客户集中度、事件历史、SLA
              抵扣、被收购队列留存、债务条款和认证。剩余风险判断因此不是「回避」，而是「只有拿到能把公开说法转化为可验证风险控制的合同、财务、安全和集中度证据，才继续承销」。
