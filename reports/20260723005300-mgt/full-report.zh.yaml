    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              MGT（mgt.us）是一家总部位于佛罗里达州坦帕的全国性技术与咨询解决方案领导者，服务全美州、地方和教育（SLED）政府客户。公司由教育和政府管理专家于 1974 年创立，不过部分公司材料称创立年份为 1975
              年；这个小口径差异公司尚未公开解释。MGT 称自己致力于「为社区创造正向影响」，提供专门解决方案，覆盖政府客户高层议程中的关键任务优先事项。公司的产品和服务组合横跨技术现代化与
              AI、网络与校园安全、人力资本管理、财政与设施管理，以及 K-12 学校改进。MGT 采用员工持股模式，是全美 2,500+ 个 SLED 客户信任的咨询与实施伙伴。2016 年以来，在新领导层推动下，MGT
              通过内生增长和 13 笔战略收购，从一家小众教育咨询公司转型为多元化政府技术平台。公司预计 2024 年收入超过 $400 million，自 2021 年以来收入 CAGR 为 144%。2024 年 9
              月，公司推出统一品牌，把 10+ 个此前收购的实体整合到 mgt.us 上的单一 MGT 身份之下。口号「为社区创造正向影响」体现 MGT 的社会影响使命，也让公司区别于纯 IT 服务商。
