  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: SLED 市场定义、边界与规模
        blocks:
          - type: paragraph
            body: >
              MGT 服务的市场，是美国州、地方和教育（SLED）政府技术与咨询解决方案。纳入范围的支出为 SLED 信息技术：硬件、软件、网络、网络安全、托管服务、云现代化、AI
              平台，以及围绕这些技术的专业服务和咨询服务。独立分析师估计，2026 年 SLED IT 总支出约为 $160.2 billion，较 2025 年温和增长 4-6%。这个 IT 数字嵌在更大的 SLED
              采购宇宙中——所有品类（建设、教育运营、健康与人类服务交付等）年度规模估计为 $1.5-2 trillion——技术和咨询服务只是其中一个明确切片。MGT 可服务边界不包括纯联邦民用和国防 IT
              承包、消费技术，以及非政府商业 IT，尽管联邦预算动态会外溢影响 SLED 需求。相邻支出包括管理咨询、人员配置和设施服务，MGT 通过咨询业务线覆盖其中一部分。多数买家的现状替代方案，是继续依赖老旧内部 IT
              团队、既有系统集成商，或干脆推迟现代化；这些都是选择 MGT 这类专业 SLED 平台之外的真实竞争选项。
