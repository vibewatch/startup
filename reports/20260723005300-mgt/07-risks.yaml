- id: TR001
  title: Regulatory / Legal Risk Register
  columns:
  - Risk
  - Regulatory Basis
  - Exposure
  - Likelihood
  - Evidence
  rows:
  - - Government procurement / contract compliance
    - State and local procurement rules plus cooperative-vehicle requirements
    - Bid protests, disallowed purchases, lost vehicle access, delayed awards
    - Medium
    - OMNIA/NASPO/Sourcewell mechanisms and legal/regulatory implementation risk
  - - Data privacy / education records
    - Education customers imply student-data and privacy obligations; public FERPA-specific controls are not confirmed
    - Contractual liability, breach notification, and school-district trust erosion
    - Medium
    - MGT education and cyber surfaces plus NIST/CISA risk-management expectations
  - - E-Rate / USAC program compliance
    - FCC and USAC administer E-Rate funding for eligible school and library services
    - Eligibility, documentation, audit, repayment, or fraud-enforcement risk if controls fail
    - Medium
    - FCC and USAC program sources; MGT E-Rate relevance
  - - Cybersecurity frameworks and guidance
    - NIST Cybersecurity Framework and CISA ransomware/threat guidance
    - Higher standard of care for managed cyber services to governments
    - High
    - NIST, CISA StopRansomware, and CISA cyber-threat sources
  - - Public certification gap
    - No retained public source confirms SOC 2, FedRAMP, StateRAMP, or equivalent certifications
    - Procurement friction and diligence blocker for regulated buyers
    - Medium
    - MGT cybersecurity page reviewed against NIST/GAO public-sector IT oversight context
  notes: Partial risk register based only on public regulatory, legal, and official sources; it is not a legal opinion or
    exhaustive compliance inventory.
