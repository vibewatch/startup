company:
  name: MGT
chapter:
  number: 7
  title: Risks
  summary: MGT's top risks are leverage/refinancing after the Ares credit investment, cybersecurity liability in a ransomware-heavy
    SLED market, acquisition-integration debt, SLED budget/channel concentration, partner dependency in AI, and private-company
    disclosure gaps. Public evidence supports meaningful mitigants—client breadth, employee ownership, cooperative channels,
    E-Rate relevance, and market demand—but the investment case requires data-room proof on debt terms, security controls,
    audited revenue, channel concentration, acquired-cohort retention, and succession.
sections:
- id: regulatory-legal-compliance-risks
  title: Regulatory, Legal, and Compliance Risks
  body: 'MGT''s regulatory risk is less about a single known enforcement action and more about operating in heavily governed
    customer workflows. The company sells into K-12, state agencies, and local governments, and it publicly highlights E-Rate
    relevance, cybersecurity, managed technology, and AI. That means procurement rules, E-Rate eligibility and documentation,
    education-data privacy, cybersecurity frameworks, and certification posture all matter before an investor treats revenue
    quality as low-risk. FCC and USAC sources establish the E-Rate program mechanics; NIST and CISA establish the cyber-risk
    management bar; and legal-analysis sources underscore that regulatory implementation details can change compliance burdens.
    The main gap is public specificity: retained evidence does not confirm SOC 2, FedRAMP, StateRAMP, FERPA controls, E-Rate
    audit history, or material litigation status. Diligence should therefore convert this category into document requests
    rather than assuming clean compliance.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR008
  tableRefs:
  - TR001
- id: operational-quality-and-security-risks
  title: Operational, Quality, Security, and Integration Risks
  body: 'MGT''s operating model bundles advisory, managed technology, cybersecurity, AI, education, and human-capital services.
    That breadth is commercially attractive but creates execution risk because failures can occur in project delivery, cyber
    operations, incident response, partner-supported AI deployments, and post-acquisition integration. The most severe operational
    scenario is a major breach involving MGT or a managed-security client: CISA and NIST evidence makes the threat environment
    clear, while MGT''s own cyber positioning makes trust central to the value proposition. Acquisition integration is the
    second large operational risk. MGT''s rebrand was tied to integrating multiple acquisitions, and rpk GROUP adds another
    higher-education capability set. Without data-room evidence on delivery defects, SLAs, incident history, backlog quality,
    and organic versus acquired performance, public evidence supports a medium-to-high operational risk rating rather than
    a clean scale-platform assumption.'
  claimRefs:
  - CR006
  - CR007
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: partner-dependency-and-channel-risks
  title: Partner, Supplier, and Channel Dependency Risks
  body: 'The partner and dependency map is broader than a standard software-vendor channel model. MGT depends on cooperative
    purchasing vehicles for easier public-sector access, E-Rate administrators for a funded K-12 route, institutional capital
    providers for acquisition-led growth, specialized talent for delivery, and technology partners for AI. The AI Experience
    Center highlights this directly: MGT, HPE, and Protopia AI are the visible partnership stack, while NVIDIA public-sector
    AI infrastructure makes GPU and accelerated-computing availability relevant to deployment timing and economics. Cooperative
    vehicles such as OMNIA, NASPO ValuePoint, and Sourcewell can lower buyer friction, but the risk flips if revenue is concentrated
    in one vehicle or if eligibility changes. Public evidence does not quantify channel revenue, partner concentration, supplier
    substitutability, or contractual protections, so the dependency register remains partly unresolved until data-room schedules
    are reviewed.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR041
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-people-and-governance-risks
  title: Financial, People, Execution, and Governance Risks
  body: Financial risk is unusually important for MGT because the headline unicorn event was a $350 million investment from
    Ares Management credit funds, not a simple equity round. That makes debt service, covenants, refinancing, interest rates,
    and free cash flow part of the underwriting case, especially because public revenue figures are company-stated and unaudited.
    The same evidence points to rapid growth and a large employee-owner base, but those signals need separation into organic
    growth, acquired growth, recurring revenue, and project-based services. People risk compounds the financial risk. The
    public narrative is closely associated with CEO A. Trey Traviesa, 1,100+ employee-owners, and hundreds of certified cybersecurity
    engineers. Employee ownership is a mitigant, yet integration pressure, cyber/AI labor competition, and PE-backed exit
    incentives make leadership depth, retention, and governance controls central diligence items.
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  tableRefs:
  - TR004
  figureRefs:
  - FR002
- id: mitigations-kill-criteria-and-residual-view
  title: Mitigations, Kill Criteria, and Residual Risk View
  body: 'MGT has credible mitigants: a large stated client base, broad SLED exposure, employee ownership, cooperative purchasing
    access, E-Rate relevance, and market demand for cybersecurity, modernization, and AI. Those mitigants do not eliminate
    residual risk because most downside triggers are private-evidence problems. The investment committee should treat the
    following as hard re-underwrite or kill events: covenant breach or failed refinancing; a major client breach, security
    litigation, or enforcement event; loss or suspension of a key cooperative vehicle or E-Rate channel; CEO departure without
    validated succession; and audited revenue or organic growth materially below public claims. Monitoring should be explicit:
    channel revenue, top-customer concentration, incident history, SLA credits, acquired-cohort retention, debt terms, and
    certifications. The residual view is therefore not ''avoid''; it is ''underwrite only with contractual, financial, security,
    and concentration evidence that converts public claims into verifiable risk controls.'''
  claimRefs:
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
  - CR042
