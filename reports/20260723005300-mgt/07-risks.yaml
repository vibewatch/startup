- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk Area
  - Mitigant
  - Residual Risk
  - Kill Trigger
  - Confidence
  rows:
  - - Leverage / refinancing
    - Large SLED demand base and Ares institutional support
    - Debt-service, covenant, and refinancing terms not public
    - Covenant breach, failed refinancing, or inability to service Ares credit facility
    - High
  - - Breach / litigation
    - Cybersecurity offering, NIST/CISA-aligned diligence path, public-sector demand for cyber resilience
    - A major incident could destroy trust in a cyber vendor
    - Major client breach, material security litigation, or regulatory enforcement
    - High
  - - Contract / channel concentration
    - 2,500+ clients, cooperative channels, and E-Rate relevance diversify access routes
    - Revenue by vehicle, state, and customer is undisclosed
    - Loss or suspension of a key cooperative contract or E-Rate channel
    - High
  - - Key-person / talent
    - Employee ownership and 1,100+ employee-owner base
    - CEO visibility and cyber/AI labor scarcity remain material
    - CEO departure without validated succession or material cyber-talent attrition
    - High
  - - Revenue credibility / growth sustainability
    - Public scale claims and market tailwinds support upside
    - Revenue, organic growth, margins, and retention are unaudited publicly
    - Audited revenue, organic growth, or retention materially below public claims
    - High
  notes: Kill triggers are monitorable investment-committee thresholds, not known events; each should be tested with debt
