  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: Regulatory / Legal Risk Register TR001 partial coverage
    missingEvidence: A counsel-reviewed compliance inventory covering procurement rules by state, E-Rate audit history, FERPA/privacy
      controls, cyber certifications, material litigation, and open enforcement matters.
    whyItMatters: TR001 is a public-evidence sample of risk categories, not a legal opinion or exhaustive compliance register;
      undisclosed issues could change the risk rating.
    diligencePath: Request legal counsel memo, compliance calendar, contract templates, E-Rate audit records, privacy policies,
      certification reports, litigation schedule, and government-contracting exceptions.
    relatedQuestionRefs:
    - QR003
    - QR005
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: Debt terms and audited financial quality
    missingEvidence: Credit agreement, covenant package, interest-rate exposure, refinancing maturity, audited revenue, organic/acquired
      revenue bridge, project margins, and cash-flow conversion.
    whyItMatters: The $350 million credit investment and public revenue/growth claims drive leverage and valuation risk, but
      public evidence cannot quantify debt-service capacity.
    diligencePath: Request the Ares credit documents, lender model, covenant calculations, audited financial statements, revenue
      bridge, backlog, retention cohorts, and board-approved forecast.
    relatedQuestionRefs:
    - QR016
    - QR017
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: Partner, supplier, and channel concentration
    missingEvidence: Revenue by OMNIA, NASPO, Sourcewell, E-Rate, direct RFP, HPE/Protopia/NVIDIA-supported AI work, top customer,
      state, and vertical.
    whyItMatters: Public evidence confirms dependencies but not concentration; a concentrated channel or partner could become
      a material thesis-break risk.
    diligencePath: Request channel-attribution schedules, partner contracts, procurement-vehicle renewal terms, AI architecture
      bill of materials, and top-customer concentration by revenue and gross margin.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: Security operations and incident history
    missingEvidence: SOC/NOC uptime, MTTD/MTTR, incident log, cyber insurance claims, penetration tests, certifications, customer
      breach notices, SLA credits, and tabletop exercise records.
    whyItMatters: Cybersecurity is a central product promise; a hidden incident or weak controls would materially change customer
      trust and legal risk.
    diligencePath: Request security package, third-party assessments, incident-response records, vulnerability-management
      metrics, insurance questionnaires, customer notices, and reference calls with managed-security clients.
    relatedQuestionRefs:
    - QR006
    - QR007
    relatedTableRefs:
    - TR002
