- id: pricing-packaging-and-gtm
  title: Pricing, Packaging, and Go-to-Market
  body: 'Public pricing is the weakest evidence area in the competitive analysis. Neither MGT nor the reviewed large competitors
    publish standardized SLED rate cards on the retained pages, so this chapter treats pricing and packaging as directional.
    Tyler likely monetizes through software license/subscription and services around installed systems; MGT appears contract-vehicle
    and services-led; global consultancies typically package large transformation programs; and internal build substitutes
    convert vendor cost into staffing, schedule, and execution risk. Distribution is more supportable than pricing. MGT''s
    52 state MSAs and OMNIA listing indicate procurement access, while NASPO ValuePoint and Sourcewell show why cooperative
    purchasing is a recurring go-to-market pattern in SLED. The strategic implication is that channels are useful but not
    exclusive: they reduce friction but do not prevent a buyer from choosing another approved vendor or splitting work across
    multiple providers.'
  claimRefs:
  - CP013
  - CP023
  - CP024
  - CP025
  - CP026
  - CP027
  - CP036
  tableRefs:
  - TP003
- id: switching-cost-and-moat-risks
  title: Switching Cost, Lock-In, and Moat Durability
  body: 'MGT''s moat is real but softer than a proprietary software moat. Its strongest durable assets are SLED relationships,
    procurement vehicles, integrated breadth, recognized market momentum, and execution capacity funded by institutional capital.
    Tyler''s moat is harder: once courts, payments, ERP, or public-safety workflows are embedded, switching is disruptive
    and multi-year. Consulting giants have a different moat—brand, staffing depth, and balance-sheet credibility for mega-programs.
    For MGT, the principal risks are services commoditization, integration complexity across acquisitions, and price pressure
    when buyers can multi-home among software vendors, advisory firms, and internal IT. Cybersecurity and AI are attractive
    demand pockets, but standards, frameworks, and reference architectures are widely available, so differentiation must come
    from verticalized delivery, trust, and measurable outcomes rather than generic managed-service claims.'
  claimRefs:
  - CP022
  - CP028
  - CP029
  - CP030
  - CP031
  - CP032
  - CP037
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: adverse-evidence-and-diligence-priorities
  title: Adverse Evidence and Diligence Priorities
  body: 'The adverse case is not that MGT lacks a market; the adverse case is that its defensibility may lag its valuation
    narrative. Tyler''s public revenue scale and software focus demonstrate what a harder SLED moat can look like. Accenture
    and Deloitte can credibly undercut MGT''s executive-access advantage in large transformations. Leidos and SAIC could redirect
    federal IT capacity into SLED if procurement tailwinds persist. Meanwhile, many MGT capabilities—managed IT, cybersecurity
    operations, AI enablement, and advisory support—can be competed by regional providers or built internally over time. The
    diligence path is therefore evidence-driven: request win-loss records against Tyler and global consultancies, retention
    and renewal data by service line, gross margin by capability, channel-attributed revenue through cooperative vehicles,
    and proof that acquisitions have produced integrated cross-sell rather than merely aggregated revenue.'
  claimRefs:
  - CP020
  - CP022
  - CP025
  - CP027
  - CP028
  - CP029
  - CP036
  - CP037
