- id: profiles-capabilities-and-scope
  title: Profiles, Capabilities, and Product Scope
  body: 'The competitor profiles divide into three archetypes. Tyler is the scaled public-sector software incumbent: its ERP,
    courts, payments, public-safety, and civic workflows create product depth and switching costs that MGT''s services-led
    model does not replicate. Accenture, Deloitte, CGI, and ICF bring consulting, implementation, and modernization capacity,
    but their differentiation is broad government transformation rather than a purpose-built SLED mid-market platform. Leidos
    and SAIC are credible capacity threats from adjacent federal IT markets, particularly if SLED budgets keep growing and
    federal demand softens. MGT''s best capability story is integrated breadth: technology modernization, cybersecurity, AI
    deployment, advisory, education, and cooperative-contract access under one brand. The capability matrix therefore marks
    unsupported cells clearly instead of assuming every competitor has equal SLED specialization, public pricing, or proprietary
    product depth.'
  claimRefs:
  - CP002
  - CP003
  - CP004
  - CP011
