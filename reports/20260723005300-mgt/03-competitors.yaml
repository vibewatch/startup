- id: TP004
  title: Moat Durability / Competitive Risk Register
  columns:
  - Moat Claim
  - Threat / Counter-Evidence
  - Severity
  - Why It Matters
  - Mitigation / Diligence Ask
  rows:
  - - SLED-specialized integrated breadth
    - Consultancies and integrators can bundle similar services
    - Medium
    - Breadth alone can be copied if delivery outcomes are not differentiated
    - Request cross-sell, renewal, and outcome evidence by service line
  - - Procurement access via MSAs and OMNIA
    - Cooperative channels are useful but nonexclusive
    - Medium
    - Distribution lowers friction but does not prevent multi-sourcing
    - Quantify revenue by vehicle and exclusivity, if any
  - - Cybersecurity and AI differentiation
    - Frameworks and reference architectures are widely available
    - High
    - Generic managed services can commoditize under price pressure
    - Validate proprietary delivery assets, certifications, SOC metrics, and margins
  - - Acquisition-led capability breadth
    - 13 acquisitions raise integration and culture risk
    - High
    - Fragmented delivery weakens the one-platform story
    - Review integration KPIs, systems consolidation, retention, and cross-sell
  - - Brand signal as first SLED unicorn
    - Tyler has public scale and harder software lock-in
    - High
    - Valuation narrative is not the same as durable defensibility
    - Compare win-loss versus Tyler and gross retention by account
  - - Mid-market SLED focus
    - Internal teams and regional firms can undercut price
    - Medium
    - Buyers may choose cheaper or familiar substitutes
    - Benchmark price, NPS, renewal, and time-to-value against regional alternatives
  notes: Severity reflects competitive threat to MGT's moat, not probability of failure. The register preserves adverse evidence
    rather than assuming valuation equals defensibility.
