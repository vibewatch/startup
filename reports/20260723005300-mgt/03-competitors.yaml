company:
  name: MGT
chapter:
  number: 3
  title: Competitors
  summary: MGT competes in a fragmented SLED technology market where Tyler Technologies is the hardest direct incumbent, global
    consultancies and government integrators threaten larger programs, and internal build or regional providers remain credible
    substitutes. MGT's differentiation is integrated SLED-specialized services, procurement access, cyber/AI breadth, and
    unicorn-brand momentum, but its moat is softer than Tyler's proprietary software lock-in and requires win-loss, retention,
    and margin proof.
sections:
- id: landscape-and-peer-set
  title: Landscape and Peer Set
  body: 'MGT''s competitive arena is broader than a list of SLED services firms. Direct and near-direct alternatives include
    Tyler Technologies, CGI, ICF, Accenture, Deloitte, and regional government IT integrators; adjacent entrants include Leidos
    and SAIC, whose public positioning is more federal-government and mission-IT oriented but whose delivery capacity could
    move into SLED when demand is attractive. Substitutes are equally important: agency IT teams can keep work internal, school
    districts can rely on E-Rate consultants or local managed-service providers, and buyers can defer modernization when budgets
    tighten. The resulting map shows MGT occupying a services-led, SLED-specialized lane. That lane is attractive because
    it bundles advisory, cyber, AI, and education/government expertise, but it is not protected by the same software lock-in
    that Tyler enjoys through embedded transaction systems.'
