      - number: '3.4'
        title: 切换成本、锁定与分销力
        blocks:
          - type: paragraph
            body: >-
              切换成本高度不对称。对嵌入式遗留客户基础而言，McAfee ePO 管理平台代表了很深的基础设施粘性：运行多 OS 策略管理、复杂 DLP 规则和遗留 FireEye HX
              取证集成的客户，迁移到云原生替代方案时会面临显著整改成本。分析师估计 35% 企业会在续约时从 Trellix 迁出，意味着 65% 留存率，这与公开披露的 Magenta Buyer 财务数据中 80%
              经常性收入占比相符。对净新增采购而言，切换成本接近为零，因为 Trellix 与对手在同一威胁向量维度竞争，没有既有席位优势。分销力由超大规模云厂商（Microsoft 借 M365，PANW
              借安全行业最大现场销售团队）以及 Splunk 之后具备广泛企业 IT 覆盖的 Cisco 主导。Trellix 分销主要渠道优先（Xtend），成本效率高，但限制了直接企业关系。STG 的双 CEO
              结构（Vishal Rao 同时领导 Trellix 和 Skyhigh Security）集中战略决策，但可能限制每个品牌的独立投资。Trellix 没有披露规模可比 CrowdStrike $1.69
              billion Falcon Flex ARR 或 Microsoft Azure Marketplace 杠杆的公共云市场交易，这在由云采购中心主导的交易中形成结构性分销劣势。
            claimRefs:
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
              - CP026
      - number: '3.5'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              Trellix 的护城河靠三根支柱：受监管和政府行业的存量客户惯性、云原生对手难以匹配的混合 / 隔离网络部署能力，以及来自 100 million+
              端点的深度威胁情报。这些能力真实存在，对现有客户基础也可防守。但三股反向力量威胁耐久性。第一，云原生对手创新速度快过 Trellix：CrowdStrike 在 FY2026 Q4 实现 GAAP
              净利润转正，订阅毛利率 79%，可在比 Trellix 负担更重的 PE 结构更健康的资本基础上激进再投 R&D；截至 2025 年 7 月，Trellix 约 8.4x debt/EBITDA 杠杆，并获
              S&P CCC+ 发行人评级。第二，平台化整合削弱了「广度」护城河：PANW、Microsoft 和 Cisco 如今也能提供宽平台覆盖，使 Trellix 原生广度不再那么独特。第三，2026 年 5 月
              Trellix 源代码泄露事件中，RansomHouse 组织声称未经授权访问了 Trellix 内部代码库的一部分；这在公司试图经历多年重组后重建企业信任的关键时点引入了产品完整性担忧。Trellix
              表示没有客户环境受损，发布流水线也未受影响，但安全供应商自身遭遇入侵，声誉成本会被放大。反向情景是，收入下滑、高杠杆、CEO 交接和 2026 年 5 月事件共同压缩 Trellix
              的稳定窗口，资本约束可能迫使其重组或出售。
