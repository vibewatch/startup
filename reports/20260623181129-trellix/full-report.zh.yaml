      - number: '2.3'
        title: 买方分层与采用
        blocks:
          - type: paragraph
            body: >-
              XDR 采购决策通常由安全运营用户牵头，但需要高管预算所有者背书。日常用户是 SOC 分析师、威胁猎手、事件响应人员和安全工程团队，他们想要更少控制台、更好关联和更快遏制。预算权通常在 CISO、安全
              VP、CIO 或集中式基础设施负责人手中，取决于组织把 XDR 视为 SecOps 现代化、端点更新，还是更广的平台整合项目。大型企业仍是主导买方，BFSI
              因合规压力高、攻击面密集而尤其突出。联邦、国防和关键基础设施买方对 Trellix 权重更高，因为公共部门认证、混合部署支持、隔离网络或 OT
              敏感环境会缩窄合格供应商范围。采用路径也随细分市场而变：大型企业和政府买方通常在多年合同前跑正式 RFP 和试点，中端市场账户则更依赖渠道，也更容易被 Microsoft
              套装等「足够好」的原生替代方案侵蚀。这种不对称解释了为什么 Trellix 的最佳适配对象不是所有企业，而是监管严格、异构或混合资产组合、且部署灵活性重要的那一部分。
