      - number: '8.4'
        title: 牛、基准与熊案例
        blocks:
          - type: paragraph
            body: >-
              我们的基准案例（40% 权重）假设收入到 2027 年稳定在每年约 USD 1.0–1.1B，成本纪律带来温和 EBITDA 利润率改善，但 NRR 没有恢复到足以驱动增长。按 3–4×
              EV/revenue，企业价值落在 USD 3.0–4.4B；扣除约 USD 4.26B 债务后，股权价值接近零到小幅为正。第一留置权债务按面值或略低于面值回收。该场景意味着 STG 相对 USD 5.2B
              收购成本大幅亏损退出。牛案例（25% 权重）要求 Trellix Wise 加速企业采用，NRR 恢复到 100% 以上，且 RansomHouse 泄露不对客户留存造成持久损害。在该场景下，收入以每年
              8–10% 增至 2027 年 USD 1.3–1.4B，EBITDA 利润率扩张至接近 20%，以 5–6× EV/revenue 退出可产生 USD 6.5–8.4B
              企业价值——足以覆盖债务栈，并带来温和股权回报。熊案例（35% 权重）假设泄露后收入收缩加速至每年 5–8%，Microsoft Defender 和 CrowdStrike 的竞争替代推动流失，资本结构迫使
              covenant 豁免或重组并损害贷款人回收。在该场景下，第一留置权贷款人每美元回收 60–75 美分；第二留置权贷款人回收 20–40 美分；股权归零。考虑趋势证据，熊案例概率偏高：S&P 的 CCC+
              负面展望于 2025 年 7 月发布，2026 年 5 月泄露又增加了增量压力。
