      - number: '4.6'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              收入质量受损：最大担忧不是收入水平（估计约 ~$1.1B），而是方向——经常性收入在下滑，不只是增长缓慢。递延收入侵蚀、Fitch 降级数据和 S&P 持续 CCC+
              负面展望相互一致、彼此佐证。毛利率在改善（云迁移带来 35% COGS 降幅，重组已完成），但起点远低于云原生对手。资本结构是主要投资论点风险：一家 8.4x 杠杆、PE 持有、有负 FCF 历史、2028 年
              7 月到期墙和 CCC+ 信用评级的实体，无法以 CrowdStrike（$1.24B FCF）或 PANW（FY2025 约 $3.5B FCF）相同节奏投入竞争性 R&D。承销前的尽调阻碍包括：（1）经确认的
              ARR 和 NRR 趋势数据，用来验证收入下滑是否已经稳定；（2）按债务层级列示的准确本金余额和剩余 PIK 选择权；（3）2024 年后的 EBITDA
              利润率轨迹，且需实际数据而非依赖加回项的估计；（4）STG 的退出时间表，以及是否正在推进 recap
              或出售流程；（5）泄露事件后的客户留存数据。基准情景是业务温和改善——成本削减帮助利润率，存量客户基本有粘性，Xtend 渠道改善订单——但公司被一个为 ROI 提取而非增长投资设计的资本结构困住。
