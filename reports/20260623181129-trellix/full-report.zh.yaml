      - number: '5.2'
        title: XDR 架构与 Trellix Wise
        blocks:
          - type: paragraph
            body: >-
              Trellix 在 2025–2026 年最关键的架构押注是 Trellix Wise，它被定位为 GenAI 驱动的 SOC
              co-pilot，位于现有安全工具之上，而不是要求全面替换平台。核心设计选择是联邦式数据读取：Wise 从
              SIEM、SOAR、EDR、云和第三方来源的原生位置查询数据，在避免数据搬迁成本的同时构建多来源置信矩阵。白皮书称，Wise 每调查 100 个告警可节省 8 小时 SOC
              人力，并能通过引导式自然语言工作流，让初级分析师达到 Tier-3
              水平。置信矩阵模型聚合五个维度——发生了什么、谁受影响、这是否符合预期、我是否见过、我该怎么做——以达到自动驾驶式自动修复所需阈值。平台支持本地、隔离网络、云和混合部署，因此 Wise 对无法完全迁往 SaaS
              的受监管和政府客户有意义。支撑性的 XDR 引擎关联整个 Trellix 产品套件和第三方工具的数据，生成优先级排序的多向量检测，Helix 则作为主要 SecOps 中枢，配有无代码
              Hyperautomation playbook 和 AI 引导调查工作流。架构上，Trellix 报告称，每天有来自超过 100 million 个端点的 68 billion
              次威胁查询输入智能层，这是让行为和异常关联在企业范围内有效所需的大规模数据。源数据质量是否准确、与异构第三方工具的 API 连接是否干净，以及 Wise 建议的负责任 GenAI
              治理，都是当前公开材料尚未完全解决的尽调事项。
