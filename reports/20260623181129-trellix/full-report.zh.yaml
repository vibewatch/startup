      - number: '5.4'
        title: 信任、合规与安全控制
        blocks:
          - type: paragraph
            body: >-
              在企业安全厂商中，Trellix 的合规与信任姿态相对可信，具名认证组合同时覆盖商业和政府采购要求。ISO 认证（27001、27017、27018、27701）均在 2022 年取得。SOC 2 Type II
              覆盖云平台。FedRAMP 授权云产品进入美国联邦机构采购。DoD IL5 授权 EDR 处理敏感 DoD 数据。Common Criteria EAL2+ 为 Endpoint Security
              提供国际第三方验证，TISAX 覆盖欧洲汽车行业要求。2026 年 2 月，Trellix 宣布与 RapidFort 合作强化供应链，把全产品套件的容器基础镜像替换为加固版本；这些镜像比传统
              distroless 镜像小 30%，CVE 少 20%，客户无需迁移或移植软件。这个动作直接回应了安全厂商越来越难回避的软件供应链攻击面。但信任章节必须纳入 2026 年 5 月源代码事件：Trellix
              确认其内部源代码仓库部分内容遭未授权访问，称客户数据和生产环境未受影响，并指出其安全开发生命周期（SDLC）未被攻破。德国 BSI Cyber Response Center
              向关键基础设施运营方发布指引；安全分析师也指出，攻击者若拿到检测源代码，可能针对 Trellix 产品设计规避技术。外界批评 Trellix
              披露不够具体，没有说明哪些产品受影响，也缺少取证时间线。RapidFort 项目和源代码事件放在一起看，说明供应链风险仍是一个正在管理的议题，而不是已经彻底解决的问题。
