  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 责任方 / 尽调路径
    rows:
      - - FY2025 + 2026 上半年经审计财务
        - 按分部拆分的收入、毛利率、EBITDA、FCF
        - 证实或推翻 S&P 的负面论点；任何承销都需要它
        - 在正式尽调流程中向 Trellix/STG 索取
      - - 按分部划分的 NRR 和客户标识流失
        - 政府 vs 商业 NRR；过去 4 个季度流失率
        - 判断收入下滑是结构性（流失）还是周期性（执行）
        - 向 Trellix 管理层索取；结合前 5 大 VAR 调研交叉验证
      - - 债务契约包和合规证书
        - 全部契约、补救期、违约事件定义
        - 主风险：契约违约触发重组，股权归零
        - 向法律顾问索取；Magenta Buyer 行政代理
      - - 2026 年 5 月泄露事件最终取证报告
        - 数据外泄完整范围、已发送客户通知、监管状态
        - 量化诉讼、监管和声誉尾部风险
        - 向 Trellix 索取；监控 GDPR 监管机构登记簿
      - - Trellix Wise 企业预订额和毛利率
        - 按产品拆分的管线、转化率和毛利率
        - 检验 AI 平台是真正收入催化剂，还是仍处商业化前
        - 向 Trellix 商业团队索取；与头部 MSSP 做渠道调研
      - - 客户集中度 + 前 10 大账户健康度
        - 前 10 大账户收入占总收入比例；续约状态
        - 如果前 10 大账户贡献超过 30% 收入，流失风险会集中
        - 向 Trellix 索取；与采购联系人做渠道调研
    notes: 这些尽调事项是把投资建议从继续研究上调所需的最低材料；缺少任意一项，都不足以支持承销。
    claimRefs:
