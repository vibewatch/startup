      - number: '5.3'
        title: 端点、邮件与网络能力
        blocks:
          - type: paragraph
            body: >-
              Trellix 的终端产品线来自老牌业务，也是第三方验证最深的一块。Trellix Endpoint Security 在 SE Labs Enterprise Endpoint Security 测试中拿到
              100% 检出率且零误报；AV-TEST 和 AV-Comparatives 也分别认可其防护质量、低误报和低性能影响。EDR with Forensics 声称可在每个事件不到一分钟内自动完成告警调查，如今接入
              Wise 后，还能用 GenAI 上下文丰富检测结果。EDR 的 DoD IL5 认证打开了美国国防部市场；在这里，高敏感数据处理要求让第三方认证成为采购前提。ePO 管理控制台提供不依赖 Active
              Directory 的统一视图，客户证据也确认，对于要管理多个被收购子公司、且 IT 环境分散的组织，这一点尤其有价值。邮件侧，Trellix Email Security 每年处理超过 50 亿个附件和
              URL，云邮件产品具备 FedRAMP 认证，并声称 SLA 可用性高于 99.995%。PhishVision（深度学习图像分析）和
              Kraken（行为分析）让引擎区别于只靠签名的方法。网络产品族提供无签名威胁检测，覆盖 160+ 文件类型，把检测映射到 MITRE ATT&CK，并集成取证包捕获用于调查。NDR 在 2025 年 12
              月更新了 OT-IT 安全融合能力，把适用场景延伸到工业和关键基础设施买家。Intelligent Sandbox 支持大规模文件引爆和 URL 分析，Threat Intelligence Exchange
              则在所有已连接的 Trellix 安全系统之间实时持续共享判定结果。对于企业整合型买家，这种宽度确实有差异化；但每个模块也都有独立实施复杂度，在大型或深度 OT 集成环境中可能叠加放大。
