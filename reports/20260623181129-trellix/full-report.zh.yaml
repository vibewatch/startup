      - number: '8.2'
        title: 建议、信心与立场
        blocks:
          - type: paragraph
            body: >-
              我们给出继续研究建议，信心低，风险评级为关键，估值立场未知。低信心评级反映公开可得的经审计财务数据几乎完全缺失：收入为分析师估计（约 USD 1.1B），毛利率未确认，NRR
              未披露，完整债务约束条款包为私有。关键风险评级反映 CCC+ 杠杆资本结构、收入下滑和近期源代码泄露。估值立场未知，是因为没有入场价格、已披露 preference stack 或经审计
              EBITDA，无法计算可支撑的 EV-to-revenue 或 EV-to-EBITDA 倍数。作为背景，公开可比公司 CrowdStrike 和 Palo Alto 分别以 18–19× 和 11–12×
              NTM 收入交易；一家收入下滑、资本结构困境、增速低于行业的公司会获得大幅折价——在困境场景下最好也许只有 2–4× 收入。按 USD 1.1B 收入和 3× 倍数计算，企业价值为 USD 3.3B；扣除 USD
              4.26B
              债务后，剩余股权价值净额可能为负——也就是说，任何回收由贷款人而非股权持有人获得。继续研究意味着，进一步尽调（取得经审计财务、NRR、约束条款数据和明确进入机制）可能打开困境债机会，也可能确认这是价值陷阱。该建议不是对公司质量的判断，而是对价格、信息和资本结构的判断。
