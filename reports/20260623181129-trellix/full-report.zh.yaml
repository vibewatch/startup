  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 产品 / 模块
      - 领域
      - 交付模式
      - 核心能力
      - 目标买家 / 操作方
      - 公开成熟度信号
      - 尽调缺口
    rows:
      - - Trellix XDR Platform（XDR 平台）
        - 平台 / 跨域
        - 云原生、本地部署、气隙环境、混合部署
        - 统一关联、多向量检测、AI 驱动调查，并可开放集成 1,000+ 控制项
        - 寻求整合的企业 CISO 和 SecOps 负责人
        - 产品页将其描述为商业化集成层；具名客户也提到它
        - 需要独立证明生产部署中的跨模块关联质量
      - - Trellix Wise
        - GenAI / AI 运营
        - 厂商无关覆盖层；支持本地、云和气隙环境
        - 联邦式读取数据、自动调查 100% 告警、置信度矩阵、自然语言查询、自动驾驶式修复
        - SOC 分析师和安全工程团队；把初级分析师抬升到 Tier-3 能力
        - 白皮书声称每 100 条告警可追回 8 小时；已作为平台层公开发布
        - GenAI 治理、幻觉控制和审计轨迹深度的公开披露仍偏少
      - - Trellix Helix
        - 安全运营（SIEM / SOAR）
        - 云原生 SaaS
        - 500+ 集成 / 230 家厂商、多向量检测、无代码 Hyperautomation、案件管理、AI 引导调查
        - 需要统一采集、关联和响应且不写代码的 SOC 分析师
        - 有具名产品页；在 SMS Group 和 SOC 客户案例中被引用
        - 需要独立查询性能基准，以及规模化环境下调优复杂度证据
      - - Trellix EDR with Forensics（取证版 EDR）
        - 端点检测与响应
        - 本地部署 / 云托管
        - AI 引导调查、威胁狩猎、取证工件分析、少于 1 分钟自动调查声明、Wise 增强
        - 精简 SOC 中的安全分析师；DoD 和 IL5 授权环境
        - DoD IL5 认证；AU Small Finance Bank 和 SMS Group 生产部署
        - 需要与其他 EDR 厂商在企业部署中的 MTTD/MTTR 对比数据
      - - Trellix Endpoint Security（ENS）
        - 端点保护平台
        - 本地部署 / 云托管
        - 多层保护、基于 ML 的检测、SE Labs 100% 检出率、零误报、获 AV-TEST 认可
        - 以单代理端点保护做标准化的企业 IT 和安全团队
        - SE Labs 100% 检出；获 AV-TEST 和 AV-Comparatives 认可；AU Small Finance Bank 合规率 99.6%
        - 需要异构企业端点中的资源占用和部署复杂度数据
      - - Trellix ePolicy Orchestrator（ePO，策略编排）
        - 端点管理
        - 本地部署 / 云
        - 单一管理面板、不依赖 Active Directory、并购接入、ePO API 集成
        - 管理大规模或碎片化端点资产的 IT 安全管理团队
        - SMS Group、AU Small Finance Bank 和化工制造商案例研究引用
        - 需要 ePO 可扩展性上限，以及迁移到云原生管理的路径证据
      - - Trellix Email Security
        - 邮件和协作防护
        - 云原生 SaaS
        - 每年处理 5B+ 附件 / URL、PhishVision 深度学习图像分析、Kraken 行为引擎、FedRAMP、>99.995% SLA、出站 DLP
        - 保护 M365/Google Workspace 免受钓鱼、BEC 和勒索软件攻击的组织
        - FedRAMP 认证；产品页披露规模；符合联邦机构采购条件
        - 需要独立钓鱼检测基准，并与 Microsoft Defender for Office 365 对比
      - - Trellix Network Detection and Response（NDR，网络检测响应）
        - 网络安全
        - 本地部署 / 混合
        - 无签名威胁检测、160+ 文件类型、横向移动跟踪、MITRE ATT&CK 映射、OT-IT 融合（2025 年 12 月更新）
        - 保护企业和 OT/ICS 网络边界的安全运营团队
        - 2025 年 12 月发布 OT-IT 融合；SMS Group 和化工制造商已在生产使用
        - 需要活体 OT 环境中零日网络威胁的独立 MTTD 数据
      - - Trellix DLP（数据丢失防护）
        - 数据安全
        - 端点、网络、云、邮件
        - AI Data Risk Dashboard（2026 年 4 月）、受批准和影子 AI 监控、开箱即用合规规则、ARM 设备支持（2025 年 8 月）、事件管理
        - 受监管行业中的合规负责人和数据安全团队
        - 2026 年 4 月新闻稿；Gartner Peer Insights 367 个评分给出 4.4/5；Arab National Bank 生产使用
        - 需要大型企业环境中的 DLP 策略准确性证明，以及 AI 工具监控的误报率
      - - Trellix Threat Intelligence Exchange（TIE，威胁情报交换）
        - 威胁情报共享
        - 本地部署 / 混合
        - 在所有已连接 Trellix 安全系统间实时共享自适应裁决；整合多类威胁数据源
        - 需要情报在端点、网络和邮件间即时传播的 SecOps 团队
        - SMS Group 案例研究引用；产品页描述自适应检测
        - 需要生产环境中的裁决延迟和准确性证据，以及 TIE 与非 Trellix 工具的集成效果
      - - Trellix Insights
        - 威胁态势和优先级排序
        - 云托管
        - 基于攻击活动的 CVE 优先级排序、集成 CISA 的评分、安全态势评分、按行业和地区过滤的攻击活动可见性
        - 衡量并传达安全态势的 CISO 和安全项目经理
        - Trellix Insights 产品文档；SMS Group 案例研究引用
        - 需要独立评估态势评分相对同业基准数据的准确性
      - - Trellix SecondSight
        - 托管威胁狩猎
        - 服务覆盖层
        - 人类威胁猎手叠加 Trellix 产品遥测；主动、低噪声的高级威胁检测；定向调查和修复确认
        - 想获得精英级威胁狩猎能力但缺少内部专长的企业和政府
        - 2026 年 2 月发布；产品页已上线；定位为 SOC 增强服务
        - 2026 年 2 月推出的新服务；需要早期客户案例研究和平均驻留时间缩短数据
    notes: 成熟度信号基于公开产品页、具名案例研究和第三方测试结果。收入结构或模块附加率未公开。
