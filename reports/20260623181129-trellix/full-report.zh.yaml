      - number: '8.6'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Trellix 的退出准备度受三项结构性因素限制：CCC+ 资本结构使多数 M&A 交易需要贷款人同意；缺少公开经审计财务，而 IPO 或大型战略出售流程都需要这些材料；2026 年 5 月
              RansomHouse 泄露带来未量化的监管和诉讼尾部风险。截至运行日，公司没有准备 IPO。向更大网络安全厂商（Cisco、IBM Security 或
              mega-PE）战略出售，是最可能的近期退出路径，但交易结构必须处理债务规模。按当前困境债价格进行二级 PE
              收购理论上可行，但需要贷款人同意，也需要买方愿意承销收入稳定。任何考虑股权或困境债入场的投资者，最可执行的尽调要求是：（1）FY2025 和 H1 2026 经审计财务报表及 EBITDA
              bridge；（2）按细分市场拆分的 NRR 和 logo 流失；（3）约束条款合规证书和完整债务协议副本；（4）2026 年 5 月泄露的最终取证报告及所有司法辖区的泄露通知状态；（5）Trellix Wise
              企业采用数据（pipeline、bookings 和按产品线毛利率）。没有这五项，投资建议无法从继续研究上调。
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
