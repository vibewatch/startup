    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Trellix 于 2022-01-19 正式发布，是 McAfee Enterprise 与 FireEye Products 合并后形成的新品牌；这两项大型安全资产剥离由 Symphony
              Technology Group（STG）组装。这个出身很关键：Trellix 不是从零进入市场的小型风投创业公司，而是发起人搭建的平台，一开始就继承了存量客户、宽产品面和号称 40,000
              家客户的基础。SecurityWeek 报道称，合并业务发布时年收入规模约 US$2 billion，进一步说明 Trellix 从诞生起就是一个规模化整合项目，而非早期软件公司。


              到 2026 年，Trellix 将自己描述为以扩展检测与响应为核心的网络安全平台公司，并向企业和公共部门买家销售相邻的端点、邮件、网络、云、数据和安全运营能力。平台页面强调 600+
              个原生和开放集成，Trellix Wise 则被定位为用于 SOC 自动化的专利生成式 AI 层。总部证据有时间敏感性：发布材料提到加利福尼亚州 San Jose，而 2025-2026
              年第三方评论目录把德克萨斯州 Plano 列为当前总部。因此，本章将 Plano 视为当前运营总部，将 San Jose 视为发布期新闻地点。
