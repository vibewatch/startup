      - number: '4.4'
        title: 公开牵引与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              已发布牵引指标稀薄且间接。最可靠的指标是公司口径客户数：截至 2025 年 4 月（来自 RSAC 新闻稿）拥有 50,000+ 家企业和政府客户，包括 78% 的 Fortune Global 500。2026
              年公司 fact sheet 称有 3,400 名员工、覆盖 185 个国家、拥有 600+ 项专利。GrowJo 2025 年 8 月估计年化收入约 $1.1 billion，与 Fitch 和 S&P
              报告暗含的收入规模一致（Fitch 在持续经营 EBITDA 估计中，以约 ~$1.1B 收入基础推算 $450M EBITDA，意味着压力情景下 EBITDA 利润率约 40%）。收入趋势信号偏负面：2023
              年 Q3 总收入同比下降约 11%（Trellix 分部下降 12%，Skyhigh 下降 4%），Fitch 预计 2023 年低双位数下滑，随后 2024 年中个位数下滑。S&P 2025 年 7
              月确认评级时指出，收入下滑和负自由现金流在 2025 年仍在持续。经审计收入、准确 ARR、净收入留存、流失率和续约率全是私有数据——这些是承销收入质量论点所需的核心指标，公开来源无法取得。截至 2023 年 9
              月递延收入同比下降 14%，是公开可得的最佳前瞻订单疲弱代理。2026 年 5 月源代码泄露又引入额外未知：披露后数月内，该事件是否导致实质客户流失或评估推迟，目前尚无文档证明。
