      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: Trellix Wise 的联邦式 GenAI 方法解决了真实采购异议
            body: >-
              Wise 直接读取数据原始位置，而不是要求迁移数据，因此击中了企业采用 AI 驱动 SecOps 的最大障碍——企业不愿把敏感安全遥测迁到云端 AI
              环境。本地部署和气隙环境兼容性进一步把可触达市场扩展到无法全面转向 SaaS 的监管行业和政府买家。
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE029
              - CE036
          - type: callout
            title: 2026 年 5 月源代码泄露留下未解决的产品风险
            body: >-
              Trellix 尚未公开披露哪些产品受影响，也没有给出取证时间线。攻击者若能看到检测源代码，就能设计规避技术；德国 BSI
              已经向关键基础设施运营方发布指引。在完整取证报告发布前，客户和投资者都应把该事件视为未关闭的产品完整性风险。
            calloutType: risk
            claimRefs:
              - CE033
              - CE034
              - CE035
          - type: callout
            title: 产品组合宽度是一项双刃剑式竞争资产
            body: >-
              Trellix 声称拥有 20+ 具名产品和 1,000+ 集成，是企业安全厂商中覆盖最宽的平台之一。买家若优先考虑供应商整合，这种宽度就是重要卖点——SMS Group 部署
              Trellix「几乎所有产品」就是例证。对较小客户，或在特定领域需要同类最佳方案的客户，这种宽度可能转化为集成复杂度，以及模块之间质量不均的风险。
            calloutType: insight
