      - number: '6.2'
        title: 具名客户证据与使用场景
        blocks:
          - type: paragraph
            body: >-
              截至 2026-06-23 研究运行日，Trellix 公开提供六个客户案例研究，均有可验证的具名联系人和可衡量结果。


              SMS Group 是一家活跃于工厂工程和冶金领域的德国工业集团，部署了广泛套件，包括 Trellix EDR、ePO、Helix SIEM、Insights、Threat Intelligence
              Exchange（TIE）、Intelligent Sandbox 和 Intrusion Prevention System。CISO Karsten L. 告诉 Trellix，ePO 不依赖 Active
              Directory，让并购整合更简单：「我们只需要连上需要部署 Trellix 解决方案的系统。」IT Security 负责人 Dennis W. 确认，下一阶段计划加入 DLP Endpoint 和
              Device Control。Trellix Insights 让 CISO 能实时回答管理层关于防护态势的询问。


              AU Small Finance Bank（印度）把终端合规率从上线时约 60% 提升到 99.6%；CISO Manish Sehgal 称，部署以来没有出现病毒爆发、勒索软件事件或入侵指标。该银行以
              Trellix 终端安全作为迈向完整 XDR 的基础。Sehgal 认为 Trellix 提供了「可执行情报」，让 SOC 分析师能在几分钟内隔离受影响终端。


              Arab National Bank（沙特阿拉伯）部署 Trellix DLP 和终端解决方案，用来整合孤岛式安全工具。Cybersecurity 负责人 Mohammed Alfayez
              表示，Trellix「整合了我们的方法，帮助混乱局面恢复秩序」，减少冗余、降低培训成本，并提升分析师可见性。


              TeamWorx Security 通过 AWS 云平台部署 Trellix Detection as a Service，成本降低 50%，事件响应数据可在五到十分钟内交付，平台可用性达 99.9%。EVP
              Laura Nolan 表示，云交付模式消除了本地断电影响风险，也让分析师能专注于阻止攻击。


              Trellix 自己的 Security Operations Center 使用 XDR、EDR、ePO、Helix 和 Insights。SOC 负责人 Carlos Gonzalez 将 XDR
              解决方案称为捕捉威胁暴露、增强决策的「关键工具」；安全分析师 Lauren Driscoll 则强调，把所有东西放在一个地方「让我们不用登录多个工具」。


              一家特种化学品制造商（匿名）用 Trellix 整合 IT/OT 安全，约 95% 的安全数据覆盖依赖 Trellix。部署范围横跨运营技术和信息技术环境中的终端与网络安全。
