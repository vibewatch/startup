      - number: '1.3'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >-
              Trellix 的资本故事早于 Trellix 品牌本身。STG 于 2021 年以约 US$4 billion 收购 McAfee Enterprise，又单独以 US$1.2 billion 收购
              FireEye Products，随后在 2021 年 10 月合并这些资产，并于 2022 年 1 月发布 Trellix。这意味着 Trellix 实际上的「融资历史」更应理解为发起人支持的 M&A
              组装，而非一串风投轮次。公开来源没有披露发布后干净的独立股权估值，也没有完整呈现只属于 Trellix 的二级交易流、股权估值标记或贷款人经济安排。


              后续最清晰的资本事件，是 Magenta Buyer LLC 于 2024 年完成 US$400 million 再融资；Trellix 将其描述为覆盖 Trellix 与 Skyhigh Security
              的控股结构所募集的新资本。这次再融资重要，并不是因为它证明了风投意义上的成长融资，而是因为它显示公司继续依赖杠杆化发起人所有权。匿名裁员评论不应被当成已证实事实，但与再融资放在一起看，它凸显了核心尽调问题：控股公司债务、跨组合治理和
              STG 设定的退出预期，而不是公开市场披露纪律，到底限制了多少运营灵活性。
