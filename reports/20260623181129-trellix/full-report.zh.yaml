  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础概览
        blocks:
          - type: paragraph
            body: >-
              Trellix 称其客户基础超过 50,000 家组织，覆盖 185 个国家；这一数字得到 2026 年公司概况表佐证，也被 Google Cloud 发布的 Trellix 案例研究独立写明为「超过
              50,000 家组织」。客户组合横跨联邦、州、地方和教育层面的政府机构；受监管行业中的大型全球企业；以及中型组织。2026 年概况表列出 3,400 名员工，并称结合 McAfee Enterprise 与
              FireEye 传承，公司拥有 30 年以上安全经验。Trellix 将自己定位为一个平台，服务于需要在终端、邮件、数据、网络和云安全向量上降低风险、建立网络韧性、推动合规并提升运营效率的组织。


              政府是战略上重要且技术上经过验证的客户细分市场。Trellix 服务美国联邦政府三大分支和所有内阁级机构，EDR 产品持有 DoD Impact Level 5 授权，并提供 FedRAMP 认证云服务。由
              Optiv/ClearShark 管理的 DoD Enterprise Software Initiative Blanket Purchase Agreement（ESI BPA），让所有 DoD
              部门、机构、情报共同体和 Foreign Military Sales 都可下单采购。公共部门数据表给出了政府客户的三个价值驱动：AI 驱动的学习与适应、拥有 500+ 集成的原生开放平台，以及来自
              Advanced Research Center 的内置专家威胁情报。


              企业和商业侧，公开客户故事档案披露了制造与 OT（SMS Group、特种化学品）、金融服务（AU Small Finance Bank、Arab National Bank）、航空航天与国防（未具名）、IT
              服务与 MSP（TeamWorx Security）、法律和高等教育等具名案例。Trellix 客户落地页还提到一家未具名公用事业提供商，将八个独立安全产品整合进 Trellix
              平台。跨细分市场看，共同购买模式是整合：客户把减少工具蔓延、通过 ePO 集中管理、获得统一可见性列为主要驱动；结果数据则显示合规改善、成本降低和事件响应加速。
