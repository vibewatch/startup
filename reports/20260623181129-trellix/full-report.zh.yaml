      - number: '3.3'
        title: 能力、定价和 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              在能力广度上，Trellix 最大差异化是真正覆盖所有基础设施类型：2025 年 Gartner EPP 确认 Trellix
              是拥有本地和隔离网络基础设施的混合云组织的首选，这一需求是纯云原生对手无法完全满足的。Trellix 每天从超过 100 million 个端点处理 8.75TB 威胁数据，并通过 Advanced
              Research Center 跟踪超过 5,300 个威胁活动，支撑深度威胁情报。其平台原生集成 500+ 个第三方工具，并交付 Attack Path Discovery 和 Trellix Wise
              这个可投产的 GenAI 调查助手。但 Palo Alto 的 cyberpedia 和从业者评论持续指出控制台碎片化（端点、DLP、邮件、网络关联分布在不同管理界面）以及相较轻量 CrowdStrike
              Falcon 传感器更高的 CPU/RAM 消耗，两者都会增加分析师工作负担。定价方面，Trellix 企业标价约为每端点每年 $26 至 $68；企业折扣 25% 至 55% 很常见。Microsoft 对
              M365 E5 客户几乎免费；CrowdStrike 要价更高（打包 Falcon 定价折算每端点 $50+），但凭运营简单性赢单。SentinelOne 价格具竞争力，约每端点 $30 至
              $45。Go-to-market 方面，Trellix 的 Xtend 渠道贡献超过 90% 收入，并在数据、邮件、端点、NDR 和 XDR 设有专项能力。CrowdStrike
              采用自下而上的开发者与企业现场销售混合模式。Microsoft 通过既有采购和 E5 升级活动取胜。PANW 依赖庞大现场团队和平台化免费 token 激励计划。合规与信任方面，Trellix 独有支持 FIPS
              140-2、面向 ICS/SCADA 和工业环境的隔离网络部署，并具备 OT/工业关键资产保护认证，这是 CrowdStrike 缺少的。对国防和关键基础设施买方而言，这一差异化仍具决定性。
