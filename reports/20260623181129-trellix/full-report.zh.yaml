      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Trellix 的监管面横跨美国联邦、欧盟和行业特定框架。美国侧，公司为其 GovCloud 平台（部署在 AWS GovCloud 上）持有 FedRAMP High 和 Moderate 授权，EDR
              产品持有 DoD Impact Level 5 认证，因此可销售给联邦和国防客户。这些认证要求持续监控，并带来重新认证成本；FedRAMP 将在 2026 年转向新的 Certification Classes
              框架，要求年底前完成合规更新。欧盟侧，截至 2026 年，NIS2 在成员国已进入执行阶段；属于适用范围的 Trellix 客户（关键基础设施、基本服务）必须满足 NIS2 第 21
              条要求，包括事件通知。Trellix 自身运营也必须满足 GDPR 第 32 条技术控制；任何客户数据泄露——在 2026 年 5 月源代码事件背景下尤其敏感——都会带来罚款和声誉损害。公司持有 ISO
              27001、27017、27018 和 27701 认证，证明其信息安全管理、云安全和隐私信息管理能力，构成基础合规姿态。截至运行日，尚未确认针对 Trellix 的重大诉讼或执法行动；但 RansomHouse
              泄露可能触发客户泄露通知义务、多司法辖区监管询问，以及在客户遭受下游损害时的潜在诉讼。另一个独立风险来自高杠杆资本结构（CCC+ 评级）带来的 covenant 相关法律风险：2023
              年，在盈利承压背景下，Magenta Buyer 的第一留置权贷款人聘请法律顾问（Akin Guckman 和 Gibson Dunn），释放出债权人监督信号，可能限制战略灵活性。
