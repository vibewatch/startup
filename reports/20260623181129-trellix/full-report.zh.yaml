  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与平台
        blocks:
          - type: paragraph
            body: >-
              Trellix 的产品架构围绕一个开放安全平台组织，横跨五个主要保护域：端点、邮件、网络、数据和安全运营。该组合来自 2022 年 McAfee Enterprise 与 FireEye 的合并，如今以
              Trellix Wise GenAI 层驱动的集成 XDR 平台来营销。堆栈顶层是 Wise，一个供应商无关的联邦智能引擎，能从安全数据的原生位置读取数据，并在不要求数据迁移的情况下自动调查 100%
              传入告警。Wise 之下，Security Operations 家族包括 Helix（SecOps、SIEM、SOAR，横跨 230 家供应商的 500+ 个集成）、用于 SIEM 式实时监控的
              Enterprise Security Manager（ESM），以及用于无代码 playbook 编排的 Hyperautomation。端点家族覆盖 Endpoint Security（ENS）、带
              Forensics 的 EDR、Endpoint Forensics、Application and Change Control、Mobile Threat Defense 和 ePolicy
              Orchestrator（ePO）。邮件与协作家族提供云原生邮件保护、钓鱼模拟和协作平台沙箱检测。网络家族包括 Network Detection and Response（NDR）、Intrusion
              Prevention System（IPS）、Network Forensics 和 Intelligent Sandbox。数据安全家族横跨 DLP、Data Encryption 和 Database
              Security。威胁情报由 Insights、Threat Intelligence Exchange（TIE）、Advanced Research Center（ARC）和 SecondSight
              托管威胁狩猎服务提供。截至 2026 年 6 月，公开产品目录显示 20 多个具名产品——产品组合异常宽，既强化了整合供应商叙事，也为尽调留下集成与理顺问题。
