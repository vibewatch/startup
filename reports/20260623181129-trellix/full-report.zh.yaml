        - 立即停止——任何层级都不投资
      - - 收入收缩同比超过 −10% 且继续加速
        - 连续两次分析师估计修订确认
        - 悲观情景启动；困境倍数进一步压缩
        - 退出或维持任何持仓不增；按悲观情景重做承销
      - - 12 个月内发生第二起安全事件
        - 2026 年 6 月后披露任何已确认泄露
        - 信任结构性受损；政府部门客户流失加速
        - 退出或减仓；Trellix 可能无法为政府合同投保
      - - CEO 12 个月内离任
        - 2026 年 1 月前辞任或公开宣布
        - 组织不稳定性激增；交易执行暂停
        - 暂停任何投资；等待永久继任者
      - - Microsoft 宣布 Defender XDR 价格调整，消除 EPP 成本
        - 公开定价公告
        - Trellix 在商业企业市场商品化的最快路径
        - 重新承销可服务市场；可能提前进入悲观情景
      - - 到 2026 年四季度仍没有确认退出流程
        - 未披露银行家授权、S-1 或意向书
        - STG 持有期超过 5 年窗口；LP 对 STG 退出时间线的压力上升
        - 进一步压低进入价；有干火药机会，但没有催化剂
    notes: 终止触发项是作者设定的论点失效阈值；它们是投资者监控指标，不是 Trellix 的契约或合同义务。
