      - number: '4.3'
        title: 成本结构与毛利率
        blocks:
          - type: paragraph
            body: >-
              Trellix 的成本结构比纯 SaaS 模式更偏硬件和基础设施密集，反映其本地设备和软件许可根基、威胁情报数据处理（8.75TB/day）以及端点代理云基础设施。Fitch 估计 2023 年 EBITDA
              利润率在低 30% 区间，意味着毛利率可能在低至中 40%——显著低于云原生对手 CrowdStrike（FY2026 GAAP 78%）和 SentinelOne（FY2026 GAAP 74%）70% 至
              80% 的毛利率。最具体的成本改善写在 AWS 案例研究中：Trellix 将安全分析索引基础设施从自管理迁移到 Amazon OpenSearch Service，截至 2024 年 Q3 将 COGS 降低
              35%，并把数据处理吞吐量提升 40%。这一单一举措把基础设施管理开销从每周八至十小时降至三十至六十分钟，释放了工程产能。其他成本杠杆包括 2022–2023 年基本完成的劳动力重组，以及 Skyhigh
              Security 共享服务足迹的持续优化。尽管已有改善，资本结构仍是硬约束：复杂多层债务（super-priority、first-out、second-out、third-out 定期贷款，约 $400M
              super-priority 加上分层旧融资余额）的利息支出吃掉了本可用于产品再投资的现金。部分债务层级可选择
              PIK（payment-in-kind）利息，带来临时现金缓冲，但会把利息资本化进本金，随时间推高杠杆。
