  - id: FE001
    title: 产品架构地图
    type: stack
    layout: wide
    summary: Trellix 在检测之下铺设采集和情报层，再叠加 GenAI 编排、响应自动化和合规表面，全部通过 XDR 平台和 ePO 管理连接。
    approximationNotes: 这是基于公开产品页、Trellix Wise 白皮书和客户案例综合出的产品架构，不代表内部组件图。
    data:
      layers:
        - label: 数据采集和来源
          detail: 端点代理、邮件网关、网络传感器、OT/ICS 连接器、云 API，以及通过 Helix 接入的 500+ 第三方集成，把多向量遥测导入平台。
          modules:
            - ePO 代理部署
            - Helix 集成
            - NDR 网络传感器
            - 邮件网关
          outputs:
            - 覆盖全部向量的原始安全事件
        - label: 威胁情报和富集
          detail: TIE 在所有已连接系统之间共享实时威胁判定；ARC 每天从 680 亿次威胁查询和 1 亿个端点中产出情报；Insights 按行业和地域把 CVE 映射到活跃攻击活动。
          modules:
            - Threat Intelligence Exchange
            - ARC 研究遥测
            - Insights 攻击活动映射
          outputs:
            - 实时判定和富集后的 CVE 上下文
        - label: 检测和关联
          detail: Helix 预置分析和规则把多厂商事件关联成多向量检测；NDR 使用无签名 ML 检测和 MITRE ATT&CK 映射；ESM 提供 SIEM 式实时监控。
          modules:
            - Helix 关联引擎
            - NDR 无签名检测
            - ESM SIEM 监控
          outputs:
            - 已排序的告警和案件
        - label: GenAI 编排 — Trellix Wise
          detail: Wise 在 SIEM、SOAR、EDR 和云工具中就地读取源数据；聚合 5 个分析维度，构建置信矩阵；自动调查 100% 告警；达到置信阈值后，支持自然语言威胁狩猎和自动驾驶式修复。
          modules:
            - 联邦数据查询引擎
            - 置信矩阵构建器
            - 自然语言界面
            - 自动驾驶式修复
          outputs:
            - 判定、引导操作，以及每 100 个告警节省 8 小时的 SOC 时间
        - label: 响应和自动化
          detail: Hyperautomation 提供无代码拖拽式剧本，可集成任何带 API 的工具；ePO 在端点资产中执行策略响应；ServiceNow、Slack 和 Jira webhook 队列把判定路由给合适的响应团队。
          modules:
            - Hyperautomation 剧本
            - ePO 策略执行
            - Webhook 队列路由
          outputs:
            - 自动化遏制、富集和案件关闭
        - label: 数据保护和合规
          detail: >-
            DLP 覆盖端点、网络和邮件；Data Encryption 限制静态数据访问；Database Security 用零停机补丁保护数据库；AI Data Risk Dashboard 监控获准和影子 AI
            的数据暴露。
          modules:
            - DLP（端点、网络、邮件）
            - Data Encryption
            - Database Security
            - AI Data Risk Dashboard
          outputs:
            - 数据丢失防护事件和合规报告
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE008
      - CE015
      - CE029
      - CE030
      - CE038
      - CE040
      - CE041
      - CE045
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开资料显示的 Trellix 运营闭环：从多源遥测接入，到 AI 富集检测、Wise 自动调查、人工批准或自动驾驶式响应，再到持续姿态度量。
    data:
      nodes:
        - id: onboard
          label: 接入遥测来源
          detail: 在端点部署 ePO 代理；连接邮件网关、NDR 传感器、云 API，并通过 Helix 接入最多 500+ 第三方集成。
          tone: neutral
        - id: enrich
          label: 用威胁情报富集
          detail: TIE 提供实时威胁判定；ARC 用攻击活动和 CVE 上下文富集检测；Insights 呈现特定行业的攻击活动优先级。
          tone: positive
        - id: detect
          label: 检测和关联
          detail: Helix 规则和预置分析把多厂商遥测关联成优先级排序后的多向量案件；NDR 用无签名 ML 处理网络威胁。
          tone: positive
        - id: investigate
          label: Wise 自动调查
          detail: Trellix Wise 就地查询全部源数据，跨 5 个分析维度构建置信矩阵，并带完整证据链给出判定；初级分析师也能获得有引导、可用自然语言访问的调查路径。
          tone: positive
        - id: respond
          label: 响应或自动修复
          detail: 高置信判定路由到自动驾驶式修复；低置信发现进入需分析师批准的 Hyperautomation 剧本（端点隔离、IOC 阻断、创建 ITSM 工单）。
          tone: positive
        - id: measure
          label: 度量姿态并报告
          detail: Insights 姿态评分把检测映射到攻击活动；SecondSight hunters 对低噪声信号做人工复核；ESM 仪表盘跟踪合规和董事会汇报所需 KPI。
          tone: neutral
      edges:
        - from: onboard
          to: enrich
          label: 原始事件
        - from: enrich
          to: detect
          label: 上下文富集遥测
        - from: detect
          to: investigate
          label: 优先级告警
        - from: investigate
          to: respond
          label: 判定和置信分数
        - from: respond
          to: measure
          label: 已关闭案件和修复数据
        - from: measure
          to: onboard
          label: 覆盖缺口反馈
    approximationNotes: 该流程描述产品页和 Wise 白皮书所暗示的运营顺序。真实部署可能因客户架构和功能采用情况而跳过或调整步骤。
