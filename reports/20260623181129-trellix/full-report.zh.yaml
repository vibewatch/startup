      - number: '1.4'
        title: 规模、牵引与里程碑
        blocks:
          - type: paragraph
            body: >-
              Trellix 的公开规模指标有意义，但证据强弱不均。公司发布时拥有 40,000 家客户，随后在 2024 年末和 2025 年初材料中提到 50,000+
              家客户，说明初始合并整合后账户仍在增长。它的公开技术证明点强于财务披露：Trellix 称拥有 600+ 个集成，Advanced Research Center 每天处理 8.75 TB 遥测数据，跟踪
              5,300+ 个威胁活动，邮件安全每天处理 2 billion 个样本和 93 million 个附件。这些都是大型私有安全平台的运营信号，支持 Trellix 尽管经历品牌更替，商业相关性仍在。


              规模图景较弱的一面，是财务和组织透明度。Growjo 等第三方目录估计年收入约 US$1.1 billion、员工约 3,800 人，而 Gartner 评论页面只给出 1001-5000
              人的宽泛员工区间。Trellix 的外部定位稳固，但并非品类主导：公司材料提到 2025 年 Gartner 将其列为 Network Detection and Response 的 Niche
              Player、Endpoint Protection Platform 的 Challenger，同时获得 CRN Security 100 认可和六项 Global InfoSec
              Awards。里程碑时间线因此呈现的是一家有真实规模和市场相关性的公司，但最关键的投资指标仍需要保密尽调验证。
