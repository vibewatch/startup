      - number: '8.3'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Trellix 近期没有独立股权融资；Magenta Buyer LLC 资本结构反映了 2021 年 PE 收购融资：McAfee Enterprise 为 USD 4B，FireEye 产品业务为 USD
              1.2B。2023 年，Trellix 通过 Liability Management Exercise（LME）募集 USD 400M 新资本，重组债务到期、降低年度利息支出，并加入
              super-priority tranche。S&P 对重组后 tranche 的评级如下：super-priority B+、first-out B、second-out CCC、third-out
              CCC-。资本栈复杂，意味着任何股权入场都必须先计入完整债务规模，才能判断剩余股权价值。若采取困境债方法，第一留置权贷款（交易在约 66–68
              美分）意味着，如果公司出售或再融资，可能回收到面值加应计利息，较当前市价上行约 47–52%——但前提是收入稳定或增长。Magenta Buyer LLC 结构意味着任何收购方实际买下的是 Trellix 和
              Skyhigh Security 合并组合；单独剥离 Trellix 需要更复杂的重组。STG 的典型退出模式包括二级收购、向战略买家完整出售和 IPO；截至 2026 年 6 月，尚未确认退出流程，公司也未提交
              S-1 或宣布聘请投行。
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
