      - number: '6.3'
        title: 客户采用轨迹与市场认可
        blocks:
          - type: paragraph
            body: >-
              Trellix 于 2022 年 1 月以 McAfee Enterprise 和 FireEye 合并实体身份推出，继承了终端安全（McAfee 的主要强项）以及威胁情报与事件响应（FireEye
              的传承）两块大型装机基础。50,000+ 组织客户数反映了这部分继承基础，也包括 2022 至 2026 年 Trellix 品牌下的有机增长。


              分析师定位显示，各产品线轨迹不一。在终端防护上，Trellix 被列为 2025 Gartner Magic Quadrant for Endpoint Protection Platforms
              的「Challenger」，较 McAfee Enterprise 在 2017 和 2018 年 Magic Quadrants 中继承来的「Leader」分类后退一步。但 Trellix 同时是
              XDR（Extended Detection and Response）和 NDR（Network Detection and Response）的 GigaOm Leader，也是 DLP 的 GigaOm
              Leader。2026 CRN Security 100 榜单在终端和托管安全类别认可 Trellix；2025 SE Labs Enterprise Endpoint 奖项也认可了 Trellix 的
              Windows 终端性能。


              渠道和伙伴覆盖广泛。由 Optiv/ClearShark 管理的 DoD ESI BPA 提供政府采购入口。TeamWorx 展示了由 MSSP 伙伴在 AWS 上交付的模式。伙伴生态让 Trellix
              能触达中端市场和政府细分市场；如果只靠直销，覆盖这些细分市场的成本会很高。


              Google Cloud 迁移案例研究展示了一种内部采用模式：Trellix 将 SAP 生产工作负载迁到 Google Cloud，集成 BigQuery 作为数据湖，从 Salesforce、Siebel 和
              SAP Business Warehouse 拉取数据，并基于权益数据为自身客户群配置自动续约触发器。这说明公司有结构化、数据驱动的客户生命周期管理方法，但续约转化率细节没有公开。
