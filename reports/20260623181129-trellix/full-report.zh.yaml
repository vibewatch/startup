      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Trellix 的创始运营负责人是 Bryan Palma，他从发布起担任 CEO 至 2025 年 1 月，并推动市场将公司理解为 McAfee Enterprise 与 FireEye Products
              合并后的 XDR 继承者。2025 年 1 月，Trellix 任命 Vishal Rao 为 CEO；他同时继续担任姊妹公司 Skyhigh Security 的
              CEO，构成公司发布以来最关键的领导层变动。Rao 此前曾任 Snow Software CEO，并在 Splunk 和 Cloudera 担任高级产品及 go-to-market 领导职务，这些经历为
              Trellix 下一阶段提供了相关的企业软件和安全平台资历。


              公开高管团队还包括 Harold Rivas（CISO）、Nanhi Singh（总裁兼首席客户官）、Jason Andrew（首席营收官）、Yuneeb Khan（CFO）和 Tara
              Flanagan（总法律顾问）。发起人侧，Marc Bala 在 STG 的角色很重要，因为 Trellix 仍是 STG 控制的平台，而不是独立上市公司。治理风险不在于 Trellix
              缺少高管，而在于关键决策仍集中在双重任职 CEO 和私募股权所有者手中，后者通过控股公司运作，对董事席位、股东权利和贷款人约束的公开披露有限。
