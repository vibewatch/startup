  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Trellix 的市场边界应定为企业扩展检测与响应，而不是「所有网络安全」，甚至也不是所有 SecOps
              软件。纳入范围的支出，是把端点、网络、云、邮件、身份相邻能力和响应工作流统一到一个调查界面的平台，以及对这些信号采取行动所需的自动化和跨域关联。这比传统 EDR 更宽，但比 CISO
              预算中的每一种相邻控制更窄。最重要的排除项或相邻池包括纯 SIEM、单独采购的点状 EDR 和 NDR、仅 SOAR 工具、以身份为中心的平台、防火墙更新和通用合规软件。Forrester 2024 年 Q2
              XDR Wave 很重要，因为它正式取消独立 EDR Wave，并把 XDR 定义为当前承载主流 SecOps 团队最强「SIEM 替代」野心的品类。实践中，许多 XDR
              采购是整合项目，而不是绿地预算。因此，Trellix 的竞争对手不只是具名 XDR 平台，还包括 MDR 外包的现状、Microsoft 原生安全套装，以及企业在没有清晰运营 ROI 前不愿拆除的存量 SIEM
              主导架构。
