      - number: '6.5'
        title: 客户集中度与留存风险
        blocks:
          - type: paragraph
            body: >-
              章节级尽调中最实质的缺口，是没有任何公开客户留存指标。Trellix 不披露 Net Revenue Retention（NRR）、Gross Revenue Retention（GRR）、logo
              流失或续约率。50,000 家组织总数只是一个静态时点数字，没有时间序列能说明客户基础在增长、稳定还是收缩。可比的企业安全 SaaS 公司若实现强 NRR（高于
              115%），通常会把它作为关键投资者信号公开；Trellix 或其母公司完全没有留存披露，是尽调中的重要缺口。


              客户集中度风险因大型企业和政府客户占比偏高而结构性抬升。政府机构和大型企业的多年合同带来粘性、可预测收入，但单个账户流失——尤其在 DoD 或联邦民用细分市场——可能构成重大收入事件。Trellix 不披露前
              10 或前 20 大账户的收入贡献。


              2026 年 5 月源代码泄露给续约和扩张动态带来具体风险。虽然 Trellix
              称客户数据未被攻破，但哪些具体产品代码库被访问仍不确定，安全敏感型企业客户很可能触发合同审查条款和供应商风险重评。受监管行业客户（金融服务、医疗、关键基础设施）有供应商安全要求，内部可能施压，推迟续约，或在扩张前要求额外安全保证。


              扩张侧，Trellix 的 land-and-expand 叙事得到多产品部署充分支持。SMS Group 正在增加 DLP；AU Small Finance Bank 正在走向 XDR；TeamWorx
              正在扩展到托管检测。500+ 集成生态和开放架构降低了已投入平台客户的切换成本，ePO 不依赖 Active Directory 也方便企业客户快速完成并购整合。


              渠道和伙伴集中度是另一条风险向量。DoD ESI BPA 与 Optiv/ClearShark 关系代表政府收入入口的重要部分；该渠道关系若中断，会削弱政府细分市场增长。支持 TeamWorx 式托管检测模式的
              AWS 合作，是触达中端市场的机会，但缺少公开规模数据。
