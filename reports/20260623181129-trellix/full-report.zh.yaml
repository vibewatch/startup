      - number: '7.5'
        title: 人员、执行与终止标准
        blocks:
          - type: paragraph
            body: >-
              Vishal Rao 于 2025 年 1 月接替 Bryan Palma 出任 CEO，拥有 Splunk、Cloudera 和 Snow Software 经历，同时还双重领导 Skyhigh
              Security——这带来显著运营复杂度。CEO 更替带来常规风险：战略中断、人才流失，以及任期前十二到十八个月客户侧决策变慢。Blind 员工评价提到组织频繁变化、管理层不稳定和职业成长有限，这与
              2021–2022 年合并后持续多年的 PE 驱动降本相一致。在客户看来，McAfee Enterprise 与 FireEye
              整合为单一平台仍未在运营上完成，他们反馈控制台割裂、产品质量不一致。财务压力（CCC+ 债务、收入下滑）、围绕 Trellix Wise AI
              现代化产品的需求，以及与云原生、资本充足同行的竞争冲刺叠加，使执行风险升高。论点失效触发器包括：Magenta Buyer LLC 违反债务约束条款，或困境债务重组加速；2026 年 5 月
              RansomHouse 事件后十二个月内发生第二起重大安全事件；政府或关键基础设施细分市场年度客户 logo 流失率确认高于 10%；CEO 上任十二个月内离任；或 Microsoft Defender
              交叉销售在单季度内替代 Trellix 超过三个前十大企业账户。监控指标包括 Magenta Buyer 贷款的季度信用市场定价、Gartner Peer Insights 评分趋势，以及 2026 年 5
              月泄露引发的任何监管询问披露。
