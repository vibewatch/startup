      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              公开 XDR/EPP 可比公司交易估值显著高于 Trellix 可能获得的估值。CrowdStrike（CRWD）是最接近的云原生 XDR 公开参照，截至 2026 年 1 月报告 USD 5.25B
              ARR（同比 +24%），交易约为 18–19× NTM 远期收入；溢价由 ARR 增长、79% 订阅毛利率和平台扩张支撑。Palo Alto Networks Cortex XDR 以 11–12× NTM
              收入交易，FY2025 收入 USD 9.2B，且 GAAP 盈利。SentinelOne 以 9–11× NTM 收入交易，ARR 为 USD
              1B，利润率正在改善。对一家收入下滑、资本结构困境且未披露毛利率的私有公司，套用 sector 中位倍数并不合适。一组 PE 支持或困境网络安全公司（如 IPO 前的 Darktrace 或转型前的 McAfee
              Enterprise）显示，低增长、高杠杆资产的收入倍数为 1.5–3×。按 Trellix 估计 USD 1.1B 收入取 3×，USD 3.3B
              中点完全落在债务栈内；没有收入恢复，就没有明确股权价值。2026 年网络安全领域 M&A 交易中，「must-own」平台领导者以 18–32× 收入成交（Google/Wiz 为 32×，顶级
              M&A），强但非领导者资产为 5–8×——以 Trellix 当前财务画像看，其位置更接近 2–4×。
