      - number: '2.2'
        title: 市场规模与 TAM
        blocks:
          - type: paragraph
            body: >-
              XDR 的公开市场规模测算有方向意义，但差异太大，无法在没有提示的情况下支撑单一「标题 TAM」。最宽口径来自 MarketsandMarkets 和 Frost & Sullivan，它们将 2024
              年品类规模置于约 $5.5 billion 至 $7.4 billion，2025 年约 $7.9 billion，并预计长期增长至 2027 年 $14.5 billion 或 2030 年 $30.9
              billion，取决于预测期限和范围。Mordor Intelligence、Straits Research 等较窄口径发布方把 2025 年规模放在更接近 $2.1 billion 至 $2.3
              billion，2030 年接近 $5.0 billion，这意味着分歧的很大一部分来自定义，而不只是预测误差。北美似乎仍占市场收入约五分之二，云部署已经占主导，托管服务层增长快于核心市场。就 Trellix
              而言，可以用客户数和第三方收入估计粗略勾勒可服务市场代理值，但公开证据没有披露 XDR-only 收入、分客群 ACV 或地域组合。正确结论因此应是区间化规模框架，而不是虚假的单点 TAM/SAM/SOM 精度。
