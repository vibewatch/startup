  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制 / 认证
      - 状态
      - 范围 / 机制
      - 对采购的意义
      - 未决尽调点
    rows:
      - - ISO 27001、27017、27018、27701
        - 2022 年认证
        - ISO 27001（ISMS）、ISO 27017（云控制）、ISO 27018（云中 PII）、ISO 27701（PIMS / 隐私）
        - 满足企业和受监管行业对安全管理、云安全和数据隐私的基线要求
        - 需要当前证书日期和范围边界；2022 年认证日期需要确认年度监督审核
      - - SOC 2 Type II
        - 已认证（持续）
        - 基于 AICPA，对云产品的安全性、可用性、处理完整性、保密性和隐私作评估
        - 企业 SaaS 采购通常要求；验证安全数据管理控制
        - 需要报告期间、范围和审计方身份；并非所有 Trellix 产品都一定在范围内
      - - FedRAMP
        - 云产品已获授权
        - 美国联邦政府用于标准化云安全评估和授权的项目
        - 美国联邦机构采购云服务必须满足；支撑获得 FedRAMP 授权的云电子邮件和安全服务
        - 需要具体产品授权和 FedRAMP 包 ID，以确认市场中的当前状态
      - - DoD Impact Level 5（IL5）
        - Trellix EDR 已认证
        - 美国 DoD 对存储和处理高度敏感非机密数据的授权
        - 为终端检测与响应工作负载打开 DoD 和情报共同体采购
        - 需要确认哪个 EDR 版本持有 IL5，相关产品（ePO、Helix）是否在范围内，以及续期时间表
      - - Common Criteria EAL2+
        - Endpoint Security 已认证
        - 国际 IT 安全评估框架；EAL2+ 为安全主张提供独立第三方验证
        - 支持国际政府采购；许多欧盟和亚太受监管环境要求或偏好该认证
        - 需要确认当前 CC 证书编号和产品版本范围
      - - TISAX
        - 已认证
        - 欧洲汽车行业信息安全评估标准；覆盖数据保护和第三方连接安全
        - 欧洲汽车行业供应链和伙伴信任通常要求；对 SMS Group 等德国制造客户有意义
        - 需要确认 TISAX 评估等级，以及覆盖客户服务还是仅覆盖内部运营
      - - RapidFort 供应链加固
        - 合作已生效（2026 年 2 月）
        - Trellix 产品容器镜像现在由 RapidFort 平台整理：比 distroless 小 30%，CVE 少 20%；无需迁移即可替换
        - 在厂商泄露风险升高阶段，直接压低软件供应链攻击面
        - 需要确认哪些产品线已切换为加固镜像，以及完整产品组合覆盖时间表
      - - 源代码事件（2026 年 5 月）
        - 已披露；调查进行中
        - Trellix 源代码仓库部分内容遭未授权访问；Trellix 称 SDLC 未受损，客户数据和生产环境未受影响
        - 如果攻击者利用源代码访问发现或构造规避技术，仍有残余零日风险；德国 BSI 已向关键基础设施运营方发布指导
        - 需要完整取证报告、受影响产品范围、时间线，以及未访问规避相关代码的证据
    notes: 状态仅反映公开披露和新闻稿主张。本章未独立复核任何认证证书。
