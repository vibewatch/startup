      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Trellix 的资本结构在 2024 年困境债务交换中重组（2024 年 9 月完成）。当前结构包括一笔新的 $400 million super-priority 定期贷款和 senior 位置的 $125
              million super-priority 循环信贷额度，后面接分层 first-out、second-out 和 third-out 定期贷款结构，全部于 2028 年 7 月到期。S&P 在交换后把评级从
              SD（选择性违约）上调至 CCC+，承认短期流动性改善，以及部分债务层级 PIK 选择权降低了现金利息支出。但 S&P 在 2025 年 7 月确认
              CCC+，展望负面，并明确表示，如果收入不能稳定、盈利能力不能改善，资本结构长期不可持续。Debt/EBITDA 杠杆仍约 8.4x（2024 年数据），远高于投资级软件同业通常的 3 至 4x。私募股权发起人
              STG 对资本配置有显著影响，并在历史上优先考虑 ROE（2022 年 $415 million
              增量定期贷款就是证据，大部分资金作为发起人股息支付）。这种治理姿态限制了即便成本削减推升利润率后的自愿债务提前偿还。手头现金、烧钱率和 runway 未公开披露。截至 2025 年 Q1，S&P
              表示流动性足以满足近期义务——主要来自循环信贷余量和 EBITDA 利润率改善——但这一位置脆弱。2028 年 7 月到期墙构成距当前报告日期（2026 年 6 月）约 24
              个月的再融资事件，也是下一个可识别的资本充足性风险触发点。STG 能否在 2028 年 7 月前、且不进一步触发契约压力的情况下组织再融资、出售或部分资本重组，决定当前资本结构能否维持。
