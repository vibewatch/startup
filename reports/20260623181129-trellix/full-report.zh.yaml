companyProfile:
  summary: >-
    Trellix 是一家由私募股权支持的网络安全平台，由 McAfee Enterprise 与 FireEye Products 合并而成，2022-01-19 在 Symphony Technology Group
    持有下正式发布。公司销售以 XDR 为牵引的平台，覆盖端点、邮件、网络、云和 SOC 工作流，服务 185 个国家的 50,000 多家组织，并越来越多地把 Trellix Wise 定位为 AI
    自动化层。公开投资争论的焦点，不在品类是否相关，而在于庞大存量客户和宽产品面能否抵消收入下滑，以及 Magenta Buyer 资本结构高负债且承压的问题。
