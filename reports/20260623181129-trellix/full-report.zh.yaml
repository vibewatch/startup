      - number: '6.4'
        title: 客户满意度、评价与负面信号
        blocks:
          - type: paragraph
            body: >-
              独立评价平台给出的 Trellix 客户体验图景方向上偏正面，但运营层面需要谨慎。Gartner Peer Insights 上，Trellix Endpoint Security 在 2,000 多条评价中得分
              4.5/5 星；Trellix 在该平台的 EDR 和 SIEM 市场中也被列为评分最高的厂商之一。Gartner Peer Insights 的邮件安全市场评价者 100% 推荐 Trellix。G2 汇总
              742 条评价，综合评分 4.2/5 星。GetApp 和 Capterra 评价者给 Trellix Endpoint Security 的评分约 4.2/5，理由包括管理全面、病毒检测强、集中式管理。


              负面信号在多个平台上反复出现。G2 和 GetApp/Capterra 的多名评价者提到 Trellix agent 资源占用高，会拖慢低配置硬件。复杂部署、需要明显 IT
              专业能力和配置工作，是反复出现的主题。较小企业和中端市场评价者提到价格不透明、灵活性有限。一名 Gartner Peer Insights 评价者在 2025 年给出 3.0
              分，并评论「复杂部署但终端可见性高：公平取舍？」这些信号符合企业级平台特征：对没有成熟安全团队的组织，平台确实带来运营开销。


              2026 年最重要的负面信号，是 Trellix 在 2026 年 5 月确认的源代码泄露。RansomHouse 勒索软件组织声称未授权访问了内部源代码仓库。Trellix 表示客户数据和生产系统未被攻破，但
              UpGuard、securitytoday.de 和 State of Surveillance 均独立评估，该事件抬高了供应链风险。攻击者拿到源代码后，可以在 Trellix
              或安全社区修补前数月寻找零日漏洞。德国 BSI Cyber Response Center 正在主动跟踪该事件，并已向依赖 Trellix 工具的关键基础设施运营方发布指引。State of
              Surveillance 批评最初披露「含糊」，并指出初始公告缺少时间线、归因和范围。


              母公司 Magenta Buyer LLC（Trellix 的法律实体）截至 2024–2026 年获得 Fitch Ratings 的 CCC-/负面展望评级，反映 Symphony Technology
              Group 私募股权组合常见的高杠杆。虽然评级反映的是债务结构，而不是运营表现，但对长期依赖 Trellix 平台的安全买家而言，这抬高了供应商连续性风险。
