      - number: '7.3'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月 RansomHouse 事件是 Trellix 最急迫的运营风险。攻击者在 2026 年 4 月 17 日左右访问内部系统，并从公司私有仓库外泄源代码。RansomHouse 于 2026
              年 5 月 7 日发布截图证明访问权限，并将 Trellix 列入其暗网泄露站点。Trellix
              聘请取证专家并配合执法机构，公开表示没有证据显示其发布或分发流水线受影响；但研究人员指出，掌握源代码会让对手映射检测逻辑、设计规避技术，并可能在受 Trellix 保护的环境中发现零日漏洞——影响超过
              53,000 家企业和政府客户。该泄露尤其有杀伤力，因为 Trellix 的核心产品价值主张就是保护企业环境；如果厂商无法保护自己的源代码，安全采购团队的信任会明显受损。撇开泄露不谈，客户在 Gartner
              Peer Insights 和 PeerSpot 评价中也持续反馈：Trellix 需要熟练技术资源才能部署，终端 CPU 和内存占用高，复杂问题支持响应不足，界面复杂且继承自 McAfee/FireEye
              重塑品牌。这些运营摩擦点抬高流失风险，也拖慢既有账户扩张。FedRAMP 监控体系下可靠性整体尚可，但公司不发布标准商业 SLA，合同可靠性承诺仍不透明。GovCloud 部署依赖 AWS GovCloud 和
              Microsoft Azure，也给运营足迹增加了集中度风险。
