      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              CrowdStrike 是 Trellix 最危险的直接竞争对手：FY2026（截至 2026 年 1 月 31 日）期末 ARR 达 $5.25 billion，同比增长 24%，总收入 $4.81
              billion，GAAP 订阅毛利率 78%，全年自由现金流 $1.24 billion。CrowdStrike 的 Falcon 平台是云原生、单代理架构，如今 50% 客户覆盖六个或更多模块（Falcon
              Flex），包括 FY2026 宣布正式可用的 AI Detection and Response（AIDR）。2024 年 7 月全球宕机造成声誉损伤，但随后 CrowdStrike ARR 增速加快至
              24%，说明买方粘性仍在。Microsoft Defender XDR 是最具破坏力的价格竞争者，因为它被捆绑进 Microsoft 365 E5，对大量 Microsoft 标准化企业客户而言几乎免费；它在
              Security Copilot AI 驱动下关联端点、身份、Office 365 和云信号。SentinelOne FY2026 ARR 达 $1.119 billion（同比增长 22%），收入 $1.001
              billion，首次实现运营盈利，并凭借可离线运行的自主端侧 AI 推理、一键勒索软件回滚和单代理 Linux/Mac/OT 支持形成差异化。Palo Alto Networks FY2025 收入 $9.2
              billion，下一代安全 ARR 为 $5.6 billion（增长 32%），积极推进平台化：Cortex XDR、XSIAM、XSOAR 和 Xpanse 打包销售，在大型企业替代点状方案，PANW 目标
              FY2026 NGS ARR 达 $7.0 billion 至 $7.1 billion。Cisco 在完成 $28 billion Splunk 收购后，把网络遥测、SIEM 和 XDR 集成进单一 SOC
              平台，并拥有广泛企业分销。Trend Micro Vision One 是稳定的 Gartner EPP Leader，威胁情报深、多 OS 支持强，主要在受监管行业以威胁情报深度竞争。Broadcom 通过
              Symantec Endpoint Security 保留了类似 Trellix 的大型但收缩中的传统企业基础，不过其 VMware 收购后重点已转向大型机和半导体。Skyhigh
              Security（Trellix 的 STG 姊妹公司）专注 SSE/云安全，并在网络遥测层与 Trellix 集成，但对于想整合到单一 SSE+XDR 供应商的客户，它也是潜在替代品。
