      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 继续研究不是放行，而是尽调任务书
            body: >-
              Trellix 是真实的企业网络安全平台，也有真正优势。继续研究建议反映的是根本性信息缺口：没有经审计财务、NRR、covenant
              数据和完整泄露取证报告，就不能负责任地上调投资建议。如果收入稳定，困境债角度（第一留置权约 66–68 美分）是分析上最可支撑的入场方式；股权则是低概率押注。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV031
          - type: callout
            title: 债务规模是股权价值上限
            body: >-
              按估计收入 USD 1.1B 计算，任何低于约 3.9× 的 EV 倍数都会让整个企业价值低于约 USD 4.26B 未偿债务。股权持有人拿不到任何回收。只有在牛案例中（收入增长且 EV/revenue 为
              5–6×），股权才有价值。这不是正常 PE 支持软件公司的估值，更接近困境重组场景。
            calloutType: risk
            claimRefs:
              - CV001
              - CV013
              - CV017
              - CV018
              - CV019
          - type: callout
            title: 网络安全厂商的 S&P CCC+ 评级是负面投资信号
            body: >-
              S&P 在 2025 年 7 月确认 Magenta Buyer LLC CCC+
              且负面展望，是一项独立、公允的评估：若没有收入恢复，资本结构长期不可持续。对评估股权或高级债的投资者，这一评级是现有最可信的单一负面信号，应锚定下行情景。
            calloutType: risk
            claimRefs:
