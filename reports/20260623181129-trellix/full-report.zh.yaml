  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Trellix 身处快速整合的 XDR 和端点安全市场，2025 年规模约 $7.9 billion，预计到 2030 年达到 $30.9 billion，CAGR 为 31.2%。Palo Alto
              Networks、Cisco、CrowdStrike、IBM 和 Microsoft 五家合计持有约 50% 至 60% 的 XDR 总市场份额，使 Trellix
              主要靠大型遗留存量客户竞争，而不是靠净新增企业赢单。竞争格局有六个清晰层次：（1）纯云原生 XDR/EDR 平台，主要是 CrowdStrike 和 SentinelOne，它们在开放采购中对 Trellix
              威胁最大；（2）集成安全巨型平台，主要是 Microsoft Defender XDR、Palo Alto Networks Cortex 和 Cisco
              XDR，它们把端点安全打包进更广采购组合；（3）Trend Micro Vision One、Broadcom Symantec 等传统存量同业，与 Trellix 一样采取遗留客户防守策略；（4）IBM
              QRadar 和 Exabeam 等 SIEM 主导平台，从 SOC 分析方向竞争；（5）Zscaler、Netskope 等 SSE/SASE 优先供应商，与 Trellix 姊妹公司 Skyhigh
              Security 相邻；（6）MSSP 和内部自建，作为企业完全外包检测与响应的现状替代。2025 年 Gartner Endpoint Protection Platforms 魔力象限在 111 家候选中评估
              15 家供应商；Trellix 位列 15 家之中，但被放在 Challenger 象限，而不是 CrowdStrike、Microsoft、Trend Micro、SentinelOne 和 Palo Alto
              Networks 所在的 Leaders。平台整合正在加速：Palo Alto Networks 于 2025 年完成对 CyberArk 的 $25 billion 收购，Cisco 于 2024 年吸收
              Splunk 的 $28 billion 整合，压缩了 Trellix 可触达的白地空间。
