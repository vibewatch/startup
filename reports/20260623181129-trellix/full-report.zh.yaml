      - number: '2.4'
        title: 增长驱动、约束与缺口
        blocks:
          - type: paragraph
            body: >-
              XDR
              的需求逻辑很直接：攻击面正在向端点、网络、云和邮件扩散；买方想要集成分析和响应；分析师人手持续紧缺，自动化更重要；监管也为更强的监控和事件响应提供支出理由。与此同时，约束并非表面问题。与现有工具集成仍然混乱，许可和运营成本让中端市场买方吃力，数据主权或隔离网络要求让混合架构继续存在，即使云原生对手宣称能简化一切。Trellix
              最大的结构性逆风是 Microsoft 捆绑：如果 Defender XDR 已嵌入 M365 E5 承诺，独立采购就必须跨过很高的增量价值门槛。竞争压力也被
              CrowdStrike、SentinelOne、Palo Alto Networks 等资本更充足的平台供应商放大，它们披露的规模或增长都强于 Trellix。最后，本章保留一个实质尽调缺口：公开数据不足以验证
              Trellix 真正的 XDR-only SAM 或 SOM，因为产品线收入、客户组合和实际 ACV 均未披露。相互矛盾的发布方估计应被保留，而不是被抹平。
