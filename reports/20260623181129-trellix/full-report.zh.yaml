    title: 技术 / 运营架构表
    columns:
      - 层
      - 组件
      - 在工作流中的作用
      - 关键依赖 / 技术
      - 风险
    rows:
      - - 采集与摄取
        - Helix 集成（500+）、ePO 代理、网络传感器、电子邮件网关
        - 把终端、电子邮件、网络、云、OT 和第三方工具遥测带入中央数据平面
        - API 连通性、代理部署、客户对日志源的访问权限
        - 长尾来源存在覆盖缺口；OT 环境可能受无代理约束
      - - 检测与关联
        - Helix 预置分析和规则、ESM、NDR 无签名引擎
        - 把原始事件转成带攻击杀伤链上下文的多向量、多厂商检测
        - ARC 刷新规则；NDR 映射 MITRE ATT&CK 框架
        - 规则未调优会造成告警疲劳；没有独立基准验证规模化误报率
      - - 情报层
        - Threat Intelligence Exchange（TIE）、ARC、Insights、全球遥测（每天 68B 次查询）
        - 用实时威胁判定、CVE 攻击活动上下文和态势评分丰富检测
        - 全球终端与传感器网络规模（100M+ 终端）；ARC 研究质量
        - 情报新鲜度取决于 Trellix ARC 输出；专有情报不开放共享，限制社区验证
      - - AI 与 GenAI 编排
        - Trellix Wise（联邦式 GenAI）、置信度矩阵、自然语言界面
        - 自动调查 100% 告警；构建多源置信分；推荐或自动执行响应动作
        - 不搬移数据也能连通异构来源；LLM 选择和提示词设计
        - 自动驾驶模式存在幻觉风险；AI 推荐修复的治理机制尚无公开文档
      - - 响应与自动化
        - Hyperautomation（无代码剧本）、Helix 案件管理、ePO 策略执行
        - 自动化分诊、终端隔离、IOC 阻断和案件记录；在 webhook 队列（Jira、ServiceNow、Slack）上执行剧本
        - 无代码拖拽式工作流构建器；Trellix 与第三方工具的 API 可用性
        - 剧本覆盖广度需要客户配置；API 卫生和权限管理增加运营开销
      - - 管理与可视性
        - ePO（单一视窗）、Insights 态势评分、ESM 仪表板
        - 在完整终端与安全资产上执行策略；衡量安全态势；提供合规报告
        - ePO 不依赖 Active Directory，便于并购接入；Insights 映射 CVE 到攻击活动
        - G2 评价提到大型环境管理复杂；ePO 向云原生迁移仍是投入方向
      - - 数据与供应链安全
        - DLP（终端、网络、电子邮件）、Data Encryption、Database Security、RapidFort 加固容器镜像
        - 防止数据外泄；限制 AI 工具访问受保护数据；加固产品供应链以抵御 CVE
        - RapidFort 合作（2026 年 2 月）带来小 30% 的镜像、少 20% 的 CVE；AI Data Risk Dashboard 监控影子 AI
        - 源代码泄露（2026 年 5 月）留下残余零日风险，即便客户数据未受影响
