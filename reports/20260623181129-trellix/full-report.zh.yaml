      - number: '5.5'
        title: 路线图、发布与技术风险
        blocks:
          - type: paragraph
            body: >-
              Trellix 2025–2026 年的产品动作显示，公司在多条产品线上保持活跃发布，并围绕 AI 优先叙事推进。2026 年 2 月发布的 SecondSight
              是一项托管式主动威胁狩猎服务，目标是捕捉自动过滤器可能归为背景噪声的低噪声高级威胁。2026 年 4 月的数据安全发布，用 AI Data Risk Dashboard 扩展 DLP，并为 Database
              Security 加入 Analytics Hub，直接回应企业快速采用 GenAI 后，88% 企业面临的影子 AI 和合规 AI 数据泄露风险。DLP Endpoint Complete 在 2025 年 8
              月获得 ARM 设备支持，回应 Snapdragon 芯片 PC 浪潮。面向 OT-IT 融合的 NDR 创新随后在 2025 年 12 月推出。2025 年 6 月深化 AWS
              集成，改进云托管工作负载的云原生部署机制和安全控制。Joe Chen 于 2026 年 5 月出任 CTO，显示公司继续投入技术领导力。值得跟踪的技术风险有四项：第一，Wise 的 GenAI
              置信模型和幻觉控制是否有足够文档，让重视安全的企业买家批准 AI 驱动的自动修复；第二，源代码泄露是否会在 Trellix
              发布完整取证披露前形成可利用的规避向量；第三，广泛产品组合能否由伙伴网络和专业服务团队交付并集成，而不在大型多模块部署中积累实施债；第四，围绕 Trellix API
              的开发者社区参与度是否足以支撑平台依赖的第三方集成生态，进而覆盖足够多的数据源。
