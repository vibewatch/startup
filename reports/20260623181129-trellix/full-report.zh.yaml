      - number: '4.2'
        title: Go-to-Market 与销售效率
        blocks:
          - type: paragraph
            body: >-
              Trellix 采用渠道优先的 go-to-market：超过 90% 收入来自 Xtend 全球伙伴网络，该网络在 2025 年大幅改造，设立端点、邮件、数据、NDR 和 XDR
              五个正式专项能力。伙伴完成解决方案领域认证可获得更高激励，这通过要求伙伴先具备技术深度再销售来集中订单质量。这种重渠道模式降低直接销售成本，但也让 Trellix
              与终端客户距离更远，限制了净收入留存可见度。企业网络安全的新 logo 销售周期通常为三至九个月，续约为一至两个月；Trellix
              可能也在此区间，但未披露。客户获取成本（CAC）、回本期、净收入留存（NRR）等销售效率代理指标没有公开披露。最相关的间接代理是递延收入趋势：Fitch 报道，截至 2023 年 9 月，递延收入同比下降
              14%，显示前瞻订单承诺走弱。这与新 logo 输给 CrowdStrike、SentinelOne 和 Microsoft 的竞争损失一致，而不是存量客户续约失败。Trellix 没有披露规模可比
              CrowdStrike 数十亿美元 AWS Marketplace 承诺的 AWS 或 Microsoft Marketplace 采购工具，限制了云采购中心主导决策时的企业采购便利性。2025 年 Xtend
              改造专门瞄准伙伴驱动管线可预测性和联合销售能力，2025 年和 2026 年已报告伙伴参与度改善的早期信号。
            claimRefs:
              - CI017
              - CI018
              - CI019
              - CI022
