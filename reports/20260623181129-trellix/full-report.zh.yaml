  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: wide
    summary: 典型 Trellix 企业或政府客户路径：从安全事件或合规触发，到初始部署、整合，再到多产品扩张；依据保留下来的具名客户案例和评论主题整理。
    data:
      items:
        - label: 触发
          detail: 客户通常从安全事件（勒索软件、内部威胁、监管违规通知）、合规要求（FedRAMP、CMMC、TISAX、PCI），或为降低运营 5–10 个点产品成本和复杂度而发起的工具整合项目开始。
          touchpoints:
            - 需要 SOC 现代化的安全事件
            - 监管审计暴露端点或 DLP 缺口
            - M&A 事件要求快速完成多实体安全标准化
            - DoD 或联邦采购周期触发供应商评估
        - label: 评估
          detail: >-
            客户会做概念验证或供应商对比；M&A 场景常由 ePO 不依赖 AD 的优势推动，政府场景则常由 FedRAMP/IL5 要求限制可选供应商。最常对比 CrowdStrike、Microsoft Defender 和
            Palo Alto。
          touchpoints:
            - RFP 或竞争性比测（通常是 Trellix 对 CrowdStrike 对 Microsoft）
            - DoD ESI BPA 或 FedRAMP 市场审查
            - 在被收购实体系统上部署 ePO 的概念验证
            - 安全团队研究 Gartner Peer Insights 和 G2 评论
        - label: 初始部署
          detail: 初始部署以 ePO 管理控制台加一两个端点或邮件安全产品为锚。政府客户通常从 EDR（IL5 授权）开始。企业客户常以端点安全或邮件安全作为最初的平台锚点。
          touchpoints:
            - ePO 控制台部署（不依赖 AD）
            - EDR 或端点安全初始推广
            - 邮件安全或 DLP 作为首个附加产品
            - Helix SIEM 或 Insights 用于 SOC 集成
        - label: 整合
          detail: >-
            初始部署之后，客户把全部端点管理标准化到 ePO，并增加互补的 Trellix 产品来替换点解决方案。AU Small Finance Bank 合规率提升到 99.6%；Arab National Bank
            替换孤岛化工具；TeamWorx 转向完整 DaaS 模式。
          touchpoints:
            - 端点合规改善（向 99%+ 覆盖推进）
            - 工具蔓延减少：把 5–10 个点产品整合到 Trellix 平台
            - DLP 和设备控制叠加到既有 ePO 部署
            - Insights 仪表盘主动映射 CVE 到活跃威胁
        - label: 多产品扩张
          detail: >-
            扩张客户会增加网络安全、NDR、完整 DLP、Hyperautomation（Helix），并规划完整 XDR。SMS Group 正在增加 DLP 和 Device Control；AU Small Finance
            Bank 正在转向 XDR；TeamWorx 正在扩展托管检测范围。
          touchpoints:
            - XDR 集成把端点、网络、邮件接入统一调查
            - DLP Endpoint 和 Device Control 加到既有 ePO 基础
            - 面向 OT/IT 客户的 Network IPS 和 Intelligent Sandbox
            - Wise GenAI 用于 SOC 自动化（多数客户处于试点 / 路线图阶段）
        - label: 续约与扩张风险
          detail: 续约摩擦主要来自几类问题：小客户抱怨代理占用资源，配置维护复杂，预算受限买家觉得定价不透明，以及 2026 年 5 月源代码泄露让受监管行业重新评估供应链风险。
          touchpoints:
            - 年度续约时审查代理性能（评论中的常见抱怨）
            - 金融服务和关键基础设施客户因泄露事件重新评估供应商风险
            - Microsoft 重度账户拿 Microsoft 365 Defender 捆绑包作价格对比
            - Magenta Buyer LLC CCC- 评级触发合同连续性审查
    approximationNotes: 旅程阶段综合了六个具名客户故事，以及 2026-06-23 研究期间访问的 G2、GetApp 和 Gartner Peer Insights 评论中的反复主题。单个客户路径会有差异。
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU013
      - CU025
      - CU026
      - CU028
