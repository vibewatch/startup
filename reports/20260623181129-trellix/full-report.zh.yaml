  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流与定价模式
        blocks:
          - type: paragraph
            body: >-
              Trellix 通过三条相互连接的收入流变现。第一，订阅软件许可——占主导且增长中的收入流——覆盖端点安全（XDR、EDR、DLP）、邮件安全、网络检测与响应（NDR）和 Trellix Security
              Platform 的按端点年度许可。这些产品通过 Xtend
              渠道以一年至三年合同销售。第二，遗留支持和维护合同覆盖尚未转向订阅的永久软件许可持有人；这部分产生稳定现金，但随着客户转订阅或流失而下滑。第三，专业服务和托管检测与响应（MDR）按项目和保留服务提供实施、威胁狩猎和
              SOC 服务。收入组合未公开披露。Fitch 报道称，经常性收入（订阅加遗留支持）在 2023 年 Q3 约占总收入 80%——这是高比例，但值得注意的是，这 80% 本身同比下滑 6%。同期非经常性收入同比下降
              27%，反映永久许可支持合同持续流失。端点安全企业标价约为每端点每年 $26 至 $68；企业客户通常能拿到 25% 至 55%
              折扣，多产品捆绑会进一步增加定价复杂度。收入确认大体按期摊销（订阅许可在合同期内确认），符合 SaaS 惯例，但遗留永久支持可能在续约时确认，导致季度报告波动。
