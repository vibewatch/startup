              在正式企业 RFP 中，Gartner Challenger 定位会让 Trellix 相对五家 Leaders（CrowdStrike、Microsoft、PANW、Trend
              Micro、SentinelOne）明显处于劣势。在 Trellix 获得 Leader 地位之前，其遗留客户基础之外的净新增赢率仍受结构性约束。
