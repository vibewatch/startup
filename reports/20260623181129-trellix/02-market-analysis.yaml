tables:
  - id: TM001
    title: Market definition table
    columns:
      - Category
      - Included
      - Excluded / Adjacent
      - Note
    rows:
      - - XDR Core
        - Endpoint detection, network detection, cloud workload protection, email security, cross-domain correlation and response automation
        - Pure SIEM, standalone firewall, identity management, threat intel feeds only
        - Core XDR platform functionality targeted at Trellix and direct category peers
      - - Adjacent Spend
        - SOAR, MDR services, security data lakes, managed XDR overlays
        - General IT infrastructure, backup, compliance-only tools
        - Adjacent spend is often pulled into larger platform or managed-service deals
      - - Substitutes
        - Standalone EDR, NGFW plus SIEM combo, MDR outsourcing, Microsoft Defender built-in
        - Security awareness training, GRC tools
        - These are the main status-quo alternatives XDR attempts to displace
      - - SSE Adjacent
        - Secure Access Service Edge, CASB, SWG, ZTNA
        - Traditional VPN, basic web filtering
        - Sister-market adjacency matters because Skyhigh Security covers part of this wallet
      - - OT/ICS Security
        - Operational technology XDR for critical infrastructure and air-gapped estates
        - Consumer security, pure IoT device management
        - Trellix has comparatively stronger fit here than cloud-only rivals
    notes: Boundary reflects XDR platform spend relevant to Trellix plus immediate substitutions; adjacent categories are shown because buyers often consolidate them in one enterprise security budget motion.
    claimRefs:
      - CM013
      - CM014
      - CM016
      - CM036
      - CM040
