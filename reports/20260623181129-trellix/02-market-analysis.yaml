callouts:
  - calloutType: insight
    title: Divergent Market Sizing Reflects Definitional Ambiguity
    body: >-
      Published XDR estimates differ by roughly three to four times because some analysts size a narrow standalone XDR category while others include broader converged platform spend and services. That spread is not noise to average away; it is evidence that the market boundary is still contested.
    claimRefs:
      - CM006
      - CM038
  - calloutType: risk
    title: Microsoft Bundling Is the Structural Headwind
    body: >-
      The most durable adoption constraint for Trellix is not whether enterprises need XDR. It is whether those buyers perceive enough incremental value to pay separately when Microsoft Defender XDR is already wrapped into an existing M365 E5 commitment.
    claimRefs:
      - CM028
      - CM029
  - calloutType: risk
    title: Financial Pressure Limits Competitive Response
    body: >-
      Trellix participates in a growing market, but the parent-level credit profile remains stressed. S&P's CCC+ negative-outlook stance and Debtwire's reporting on revenue decline and lender activity imply less room to outspend faster-growing rivals on R&D or aggressive go-to-market investment.
    claimRefs:
      - CM026
      - CM027
