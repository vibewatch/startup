        - RFP to pilot to enterprise contract
        - Strong installed-base and renewal fit, but faces strong competitive displacement in net-new deals
      - - Government / Federal
        - CISO / Security Director
        - ~20%
        - Compliance, nation-state threat profile, hybrid requirements
        - Mandatory requirements to procurement to multi-year award
        - Strongest relative fit because of certifications and hybrid deployment support
      - - BFSI
        - CISO
        - ~24%
        - Regulatory pressure and dense attack surface
        - Compliance-led evaluation to enterprise deal
        - Good fit where legacy estate complexity and auditability matter
      - - Healthcare
        - CISO / IT Director
        - ~10%
        - Ransomware exposure and privacy obligations
        - Risk assessment to RFP to pilot
        - Moderate fit, but often price and staffing constrained
      - - Mid-Market (500-5000 employees)
        - IT Security Manager / CIO
        - ~8%
        - Simplification and limited staffing
        - Channel-led evaluation to cloud deployment
        - Mixed fit; native Microsoft bundles are a frequent blocker
      - - Critical Infrastructure / OT
        - OT Security Manager
        - ~3%
        - Infrastructure protection and government mandates
        - Specialized evaluation to long-term contract
        - Differentiated niche where Trellix remains more defensible than cloud-only peers
    notes: Share estimates combine published vertical data with directional segmentation logic; the table is intended as a buyer map, not a census of every XDR vertical.
