        - Frost & Sullivan / MarketsandMarkets
        - Broad enterprise SecOps and converged-platform lens
        - Includes integrated platform framing and therefore sits at the high end of published estimates
      - - TAM (Narrow XDR)
        - $2.13B-$2.34B
        - "2025"
        - Straits Research / Mordor Intelligence
        - Standalone XDR-specific spend lens
        - Excludes more adjacent platform and bundled-security revenue pools
      - - North America Slice
        - 37.6%-42.2% share
        - 2024-2025
        - MarketsandMarkets / Mordor Intelligence
        - Regional revenue share from published market reports
        - Supports a North America-first commercial lens for Trellix but is not itself SAM
      - - Managed-XDR Services Growth
        - 32.5% CAGR
        - 2025-2030
        - MarketsandMarkets
        - Sub-segment CAGR inside XDR forecast
        - Suggests services and overlays may scale faster than software-only deployments
      - - SAM Trellix (rough proxy)
        - ~$1.5B-$3.0B
        - "2025"
        - Author estimate anchored on public customer and revenue proxies
        - 50,000+ customers and low-to-mid five-figure ACV bands as directional inputs
        - Public data is insufficient to verify product-line mix, geography mix, or true XDR attach rate
      - - SOM Trellix (rough proxy)
        - ~$1.1B revenue base / low-teens share of broad lens
        - "2026"
        - GrowJo plus official customer disclosures
        - Third-party revenue estimate divided against broad XDR sizing lens
        - Directional only; should not be treated as audited XDR revenue or stable market share
    notes: Published XDR figures are not directly comparable because scope differs materially across analysts; the Trellix SAM/SOM rows are rough proxies preserved with explicit uncertainty rather than promoted to verified market fact.
