- id: leadership-and-governance
  title: Leadership and Governance
  body: >-
    Trellix's founding operating leader was Bryan Palma, who served as CEO from launch through January 2025 and helped frame
    the company as the XDR-focused successor to the McAfee Enterprise and FireEye Products combination. In January 2025,
    Trellix appointed Vishal Rao as CEO while he also remained CEO of sister company Skyhigh Security, creating the most
    consequential leadership transition since launch. Rao's prior operating record includes CEO experience at Snow Software
    and senior product and go-to-market leadership at Splunk and Cloudera, which gives him relevant enterprise-software and
    security-platform credentials for Trellix's next phase.


    The broader public executive bench includes Harold Rivas (CISO), Nanhi Singh (President and Chief Customer Officer), Jason
    Andrew (Chief Revenue Officer), Yuneeb Khan (CFO), and Tara Flanagan (General Counsel). On the sponsor side, Marc Bala's
    role at STG matters because Trellix remains an STG-controlled platform rather than an independent public company. The
    governance risk is not that Trellix lacks executives, but that key decision-making remains concentrated around a dual-role
    CEO and a private-equity owner operating through a holdco with limited public disclosure of board seats, shareholder rights,
    and lender constraints.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
