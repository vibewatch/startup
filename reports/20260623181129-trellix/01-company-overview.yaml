company:
  name: Trellix
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Trellix is a private-equity-backed cybersecurity platform officially launched on 2022-01-19 from the merger of McAfee
    Enterprise and FireEye Products. As of the 2026-06-23 run date, the company appears to be a mature XDR-led enterprise
    security vendor with 50,000+ customers, 600+ integrations, and meaningful product telemetry, but with material remaining
    opacity around standalone valuation, leverage, and exact governance economics inside the STG/Magenta Buyer structure.
sections:
- id: identity-and-business-model
  title: Identity and Business Model
  body: >-
    Trellix officially launched on 2022-01-19 as the new brand created from the merger of McAfee Enterprise and FireEye Products,
    two large security carve-outs assembled by Symphony Technology Group (STG). That origin matters: Trellix was not a small
    venture-backed startup entering the market from zero, but a sponsor-built platform launched with an inherited installed
    base, broad product surface, and stated 40,000-customer footprint. SecurityWeek reported the combined business at launch
    was running at roughly US$2 billion of annual revenue scale, reinforcing that Trellix began life as a scaled integration
    project rather than an early-stage software company.


    In 2026, Trellix describes itself as a cybersecurity platform company centered on extended detection and response, with
    adjacent endpoint, email, network, cloud, data, and security-operations capabilities sold primarily to enterprise and
    public-sector buyers. The platform page emphasizes 600+ native and open integrations, while Trellix Wise is positioned as
    a patented generative-AI layer for SOC automation. Headquarters evidence is time-sensitive: launch materials referenced
    San Jose, California, while third-party review directories in 2025-2026 identify Plano, Texas as current headquarters.
    The chapter therefore treats Plano as the current operating HQ and San Jose as the launch-era press location.
  claimRefs:
