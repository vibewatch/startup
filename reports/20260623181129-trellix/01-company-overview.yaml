  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation gap
    missingEvidence: Exact current standalone Trellix equity valuation, sponsor mark, and any internal valuation bridge since launch.
    whyItMatters: Without a valuation bridge, later return and downside analysis cannot distinguish platform quality from sponsor accounting.
    diligencePath: Request board materials, quarterly sponsor valuation marks, and any lender or auditor valuation schedules covering Trellix standalone.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance rights
    missingEvidence: Board composition, committee chairs, shareholder rights, and any veto or reserved-matter controls held by STG.
    whyItMatters: Control rights determine whether a minority investor would be underwriting management execution or sponsor process risk.
    diligencePath: Obtain the current board list, shareholder agreement, and governance summary from management or counsel.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: debt covenants
    missingEvidence: Lender identities, maturity ladder, interest costs, covenant package, and intercompany cash-flow restrictions at Magenta Buyer.
    whyItMatters: Debt structure can cap investment capacity, influence pricing flexibility, and determine restructuring risk during slower growth.
    diligencePath: Request the full debt schedule, covenant summary, and latest compliance certificate for Magenta Buyer and relevant subsidiaries.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: dual-role duration
    missingEvidence: Explicit disclosure on whether Vishal Rao's dual-CEO arrangement across Trellix and Skyhigh is transitional or intended to persist.
    whyItMatters: The durability of the dual role changes how investors should assess succession, focus, and resource allocation risk.
    diligencePath: Ask management for reporting lines, planned duration, and any separation triggers between the Trellix and Skyhigh CEO roles.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: minor
    topic: standalone operating metrics
    missingEvidence: Audited current revenue, headcount, and product-mix detail for Trellix as a standalone operating company.
