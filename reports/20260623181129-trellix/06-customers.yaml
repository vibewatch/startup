    "title": "Customers",
    "summary": "Trellix's customer base spans more than 50,000 organizations in 185 countries, anchored by large enterprise and government accounts across financial services, manufacturing and OT, aerospace and defense, IT services, and all segments of U.S. federal and SLED government. Six public named case studies with verifiable outcomes\u2014SMS Group, AU Small Finance Bank, Arab National Bank, TeamWorx Security, a specialty chemicals manufacturer, and the Trellix internal SOC\u2014demonstrate multi-product deployments with measurable results. Analyst recognition is broad: Gartner Peer Insights ratings average 4.5/5 for endpoint security; G2 aggregates 742 reviews at 4.2/5; 100% of Gartner Peer Insights email security reviewers recommend Trellix. Adverse signals include recurring user complaints about resource-intensive agents, deployment complexity, and pricing opacity; a May 2026 source code breach by the RansomHouse ransomware group that raises zero-day supply chain risk; and the parent entity Magenta Buyer LLC's CCC- Fitch rating that elevates vendor continuity risk. Customer retention metrics\u2014NRR, GRR, logo churn\u2014are not publicly disclosed and remain a material diligence gap."
