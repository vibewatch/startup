      "id": "named-customer-evidence",
      "title": "Named Customer Evidence and Use Cases",
      "body": "Six customer case studies with verifiable, named contacts and measurable outcomes are publicly available from Trellix as of the 2026-06-23 research run.\n\nSMS Group, a German industrial conglomerate active in plant engineering and metallurgy, deployed an extensive suite including Trellix EDR, ePO, Helix SIEM, Insights, Threat Intelligence Exchange (TIE), Intelligent Sandbox, and Intrusion Prevention System. CISO Karsten L. told Trellix that ePO's Active Directory independence simplifies M&A integrations: 'All we need is a connection to the systems that need to get the Trellix solution deployed.' Head of IT Security Dennis W. confirmed a planned next phase adding DLP Endpoint and Device Control. Trellix Insights enables the CISO to answer management inquiries about protection posture in real time.\n\nAU Small Finance Bank (India) increased endpoint compliance from approximately 60% on arrival to 99.6%, and CISO Manish Sehgal reports no virus outbreaks, ransomware incidents, or indicators of compromise since deployment. The bank uses Trellix endpoint security as the foundation for its journey toward full XDR. Sehgal credits Trellix with providing 'actionable intelligence' that lets SOC analysts isolate affected endpoints within minutes.\n\nArab National Bank (Saudi Arabia) deployed Trellix DLP and endpoint solutions to consolidate siloed security tools. According to Head of Cybersecurity Mohammed Alfayez, Trellix 'consolidated our approach and helped bring order to the chaos,' reducing redundancies, lowering training costs, and improving analyst visibility.\n\nTeamWorx Security deployed Trellix Detection as a Service via an AWS cloud platform and achieved a 50% reduction in cost, with incident response data delivery in five to ten minutes and 99.9% platform availability. EVP Laura Nolan stated the cloud delivery model eliminates on-premises power-outage risk and frees analysts to focus on stopping attacks.\n\nTrellix's own Security Operations Center uses XDR, EDR, ePO, Helix, and Insights. SOC Head Carlos Gonzalez describes XDR solutions as 'vital tools' for capturing threat exposure and enhancing decision-making, while security analyst Lauren Driscoll highlighted that having everything in one place 'saves us from having to log into multiple tools.'\n\nA specialty chemicals manufacturer (anonymous) consolidates IT/OT security with Trellix, relying on Trellix for approximately 95% of its security data coverage. The deployment spans endpoint and network security across operational and information technology environments.",
