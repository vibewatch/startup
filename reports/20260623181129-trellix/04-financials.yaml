  evidenceGaps:
    - type: private-evidence-only
      severity: critical
      topic: public traction and private-metric gaps table
      missingEvidence: >-
        Confirmed ARR, net revenue retention (NRR), and gross revenue retention (GRR)
        by customer segment — these are private and not accessible without a due diligence
        data room.
      whyItMatters: >-
        These are the primary metrics required to assess whether the revenue decline has
        stabilized. Without them, the financial underwriting thesis cannot be verified.
      diligencePath: >-
        Obtain management presentation with ARR, bookings, renewal rates, and NRR data;
        cross-check against deferred revenue trend and S&P/Fitch statements.
      relatedQuestionRefs: [QI002, QI007, QI016]
    - type: private-evidence-only
      severity: critical
      topic: capital adequacy and debt structure table
      missingEvidence: >-
        Exact outstanding principal balances per tranche, accrued PIK principal to date,
        and current revolver draw status. These are not publicly disclosed.
      whyItMatters: >-
        Exact debt quantum determines whether the July 2028 maturity wall is serviceable
        from operating cash flows or requires external capital.
      diligencePath: >-
        Obtain credit facility documentation and most recent lender certificates from
        data room; cross-reference with Fitch/S&P reports.
      relatedQuestionRefs: [QI018, QI020, QI025]
    - type: missing-source
      severity: material
      topic: public traction and private-metric gaps table
      missingEvidence: >-
        Post-May 2026 source code breach customer retention and sales-cycle impact data.
        No public evidence of churn acceleration or sales deferrals following the breach.
      whyItMatters: >-
        A source code breach at a security vendor can accelerate competitive evaluation
        cycles. Impact on FY2026 bookings is unknown.
      diligencePath: >-
        Request pipeline data and customer satisfaction surveys from post-breach period
        from sales operations.
      relatedQuestionRefs: [QI028]
