callouts:
  - calloutType: risk
    title: July 2028 maturity wall is the primary near-term capital event
    body: >-
      All tranches of Magenta Buyer's restructured debt mature in July 2028 — approximately
      25 months from this report date. With negative FCF history and CCC+ credit, refinancing
      is feasible only if revenue stabilizes and EBITDA margins improve materially. Failure
      to refinance would require a new distressed exchange, sponsor capital injection, or sale.
    claimRefs: [CI009, CI023, CI028]
  - calloutType: risk
    title: Declining recurring revenue is the core adverse signal
    body: >-
      Subscription recurring revenue was declining 6% year over year in Q3 2023, and S&P
      noted continued revenue decline in its July 2025 affirm. A security subscription
      business with a declining recurring revenue base — not just slow growth — is a
      category warning signal that points to competitive displacement within the installed
      base, not just lack of new logo wins.
    claimRefs: [CI003, CI016, CI030]
