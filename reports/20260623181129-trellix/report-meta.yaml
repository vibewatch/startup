companyProfile:
  summary: >-
    Trellix is a private-equity-backed cybersecurity platform created from the merger of McAfee
    Enterprise and FireEye Products, officially launched on 2022-01-19 under Symphony Technology
    Group ownership. The company sells an XDR-led platform spanning endpoint, email, network,
    cloud, and SOC workflows, serves more than 50,000 organizations across 185 countries, and is
    increasingly positioning Trellix Wise as its AI automation layer. The public investment debate
    is less about category relevance than about whether a large installed base and broad product
    footprint can overcome declining revenue trends and a distressed, debt-heavy Magenta Buyer
    capital structure.
  foundedDate: "2022-01-19"
  founders:
    - name: "Bryan Palma"
      role: "Launch CEO / founding executive"
      background: "Led Trellix from launch until January 2025 during the McAfee Enterprise and FireEye integration period."
      claimRefs: [CO011]
  foundingLocation: "San Jose, California, USA"
  headquarters: "Plano, Texas, USA"
  productSummary: >-
    Enterprise cybersecurity platform centered on XDR, EDR, email security, NDR, DLP, threat
    intelligence, and SOC automation, with 600+ integrations and an AI layer branded Trellix Wise.
  customerFocus: >-
    Large enterprises, government agencies, critical-infrastructure operators, and regulated
    institutions that need hybrid, on-premises, cloud, and air-gapped security operations.
  businessModel: >-
    Subscription-heavy enterprise software sold primarily through channel partners, with attached
    support, services, and managed detection/response offerings.
  stage: "Private (PE-backed)"
  fundingStatus: >-
    No standalone equity round has been publicly disclosed since launch; instead, the company sits
    inside STG's Magenta Buyer structure, including a 2024 US$400M refinancing and a 2021 combined
    US$5.2B acquisition basis for McAfee Enterprise and FireEye Products.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO006, CO016, CO017, CU001, CV002]
summary:
  headline: >-
    Trellix remains a scaled, relevant XDR platform with real enterprise and government reach, but
    declining revenues, a distressed capital structure, and unresolved breach-related trust risk
    make it a diligence-heavy situation rather than a clean equity investment.
