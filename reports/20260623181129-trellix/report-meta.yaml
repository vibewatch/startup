    - "50,000+ organizations across 185 countries with meaningful government and Fortune 500 penetration."
    - "Broad XDR-led platform with endpoint, email, network, data, and SOC automation capabilities plus 600+ integrations."
    - "Large inherited installed base and operational relevance from the McAfee Enterprise and FireEye heritage."
