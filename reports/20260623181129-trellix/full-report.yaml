  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Typical Trellix enterprise or government customer path from security incident or compliance trigger through
      initial deployment, consolidation, and multi-product expansion, based on retained named customer stories and
      review themes.
    data:
      items:
        - label: Trigger
          detail: >-
            Customers typically start with a security incident (ransomware, insider threat, regulatory breach notice), a
            compliance mandate (FedRAMP, CMMC, TISAX, PCI), or a tool-consolidation initiative to reduce cost and
            complexity of operating 5-10 point products.
          touchpoints:
            - Security incident requiring SOC modernization
            - Regulatory audit revealing endpoint or DLP gaps
            - M&A event requiring rapid multi-entity security normalization
            - DoD or federal procurement cycle triggering vendor evaluation
        - label: Evaluation
          detail: >-
            Accounts run a proof-of-concept or vendor comparison, often driven by ePO's AD-independence advantage in M&A
            contexts or by FedRAMP/IL5 requirements that constrain vendor options for government. Comparison most
            commonly against CrowdStrike, Microsoft Defender, and Palo Alto.
          touchpoints:
            - RFP or competitive bakeoff (typically Trellix vs CrowdStrike vs Microsoft)
            - DoD ESI BPA or FedRAMP marketplace review
            - Proof-of-concept with ePO deployment on acquired entity systems
            - Gartner Peer Insights and G2 review research by security team
        - label: Initial Deployment
          detail: >-
            Initial deployment is anchored on the ePO management console plus one or two endpoint or email security
            products. Government accounts typically begin with EDR (IL5 authorized). Enterprise accounts often start
            with endpoint security or email security as the initial platform anchor.
          touchpoints:
            - ePO console deployment (AD-independent)
            - EDR or endpoint security initial rollout
            - Email security or DLP as first add-on
            - Helix SIEM or Insights for SOC integration
        - label: Consolidation
          detail: >-
            After initial deployment, accounts standardize on ePO for all endpoint management and add complementary
            Trellix products to replace point solutions. AU Small Finance Bank consolidated to 99.6% compliance; Arab
            National Bank replaced siloed tools; TeamWorx moved to full DaaS model.
          touchpoints:
            - Endpoint compliance improvement (tracking toward 99%+ coverage)
            - 'Tool-sprawl reduction: consolidate 5-10 point products to Trellix platform'
            - DLP and device control layered onto existing ePO deployment
            - Insights dashboard for proactive CVE-to-active-threat mapping
        - label: Multi-Product Expansion
          detail: >-
            Expanded accounts add network security, NDR, DLP complete, Hyperautomation (Helix), and plan for full XDR.
            SMS Group is adding DLP and Device Control; AU Small Finance Bank is moving toward XDR; TeamWorx is
            expanding managed detection scope.
          touchpoints:
            - XDR integration connecting endpoint, network, email into unified investigation
            - DLP Endpoint and Device Control added to existing ePO base
            - Network IPS and Intelligent Sandbox for OT/IT customers
            - Wise GenAI for SOC automation (pilot/roadmap phase for most accounts)
        - label: Renewal and Expansion Risks
          detail: >-
            Renewal friction points include resource-intensive agent complaints from smaller accounts, complex
            configuration maintenance, pricing opacity for budget-constrained buyers, and the May 2026 source code
            breach that introduces supply chain risk reassessment in regulated sectors.
          touchpoints:
            - Agent performance review at annual renewal (common complaint in reviews)
            - Breach-related vendor risk reassessment in financial services and critical infrastructure
            - Pricing comparison vs Microsoft 365 Defender bundle at Microsoft-heavy accounts
            - Magenta Buyer LLC CCC- rating triggering contract continuity reviews
    approximationNotes: >-
      Journey stages are synthesized from six named customer stories and recurring themes in G2, GetApp, and Gartner
      Peer Insights reviews accessed during the 2026-06-23 research run. Individual customer paths vary.
    claimRefs:
      - CU007
      - CU009
      - CU011
      - CU013
      - CU025
      - CU026
      - CU028
