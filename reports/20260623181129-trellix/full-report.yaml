          - type: callout
            title: The hybrid/air-gapped moat is real but narrow and shrinking
            body: >-
              Trellix's most defensible differentiation is OT/ICS/air-gapped certified deployment support, which no
              cloud-native rival matches. This anchors government, critical infrastructure, and defense contracts.
              However, this moat protects perhaps 20–30% of the revenue base; the remaining commercial enterprise book
              is subject to full competitive pressure from cloud-native peers.
