        title: Exhibits
        blocks:
          - type: callout
            title: Challenger positioning in a Leader-take-all procurement market
            body: >-
              In formal enterprise RFPs, a Gartner Challenger designation materially disadvantages Trellix against the
              five Leaders (CrowdStrike, Microsoft, PANW, Trend Micro, SentinelOne). Until Trellix achieves Leader
              status, its net-new win rate outside its legacy base remains structurally constrained.
            calloutType: risk
            claimRefs:
