  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Trellix operates inside a rapidly consolidating XDR and endpoint security market sized at approximately
              $7.9 billion in 2025 and projected to reach $30.9 billion by 2030 at a 31.2% CAGR. Five players, Palo Alto
              Networks, Cisco, CrowdStrike, IBM, and Microsoft, collectively hold roughly 50 to 60 percent of total XDR
              market share, leaving Trellix competing primarily on its large legacy installed base rather than on
              net-new enterprise wins. The competitive landscape has six distinct layers: (1) pure-play cloud-native
              XDR/EDR platforms, chiefly CrowdStrike and SentinelOne, which are the most threatening to Trellix in open
              procurement; (2) integrated security mega-platforms, principally Microsoft Defender XDR, Palo Alto
              Networks Cortex, and Cisco XDR, which bundle endpoint security into broader purchase packages; (3) legacy
              incumbent peers such as Trend Micro Vision One and Broadcom Symantec that share Trellix's
              heritage-installed-base defense strategy; (4) SIEM-led platforms including IBM QRadar and Exabeam
              competing from the SOC analytics direction; (5) SSE/SASE-first vendors such as Zscaler and Netskope,
              adjacent to Trellix's sister company Skyhigh Security; and (6) MSSPs and internal build as status-quo
              alternatives where enterprises outsource detection and response entirely. The 2025 Gartner Magic Quadrant
              for Endpoint Protection Platforms evaluated 15 vendors out of 111 candidates; Trellix was among the 15 but
              was placed in the Challenger quadrant, not among the Leaders which include CrowdStrike, Microsoft, Trend
              Micro, SentinelOne, and Palo Alto Networks. Platform consolidation is accelerating: Palo Alto Networks
              completed a $25 billion acquisition of CyberArk in 2025, and Cisco absorbed Splunk's $28 billion
              integration in 2024, compressing Trellix's addressable white space.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
