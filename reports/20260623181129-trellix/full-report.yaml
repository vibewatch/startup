      - number: '2.4'
        title: Growth Drivers, Constraints, and Gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case for XDR is straightforward: attack surfaces are spreading across endpoint, network, cloud,
              and email; buyers want integrated analytics and response; automation matters more as analyst labor stays
              scarce; and regulation provides spending justification for stronger monitoring and incident response. At
              the same time, the constraints are not cosmetic. Integration with existing tools remains messy, licensing
              and operating costs are difficult for mid-market buyers, and data-sovereignty or air-gap requirements keep
              hybrid architectures alive even as cloud-native rivals claim simplification. The biggest structural
              headwind for Trellix is Microsoft bundling: if Defender XDR is already embedded in an M365 E5 commitment,
              a standalone purchase must clear a high incremental-value bar. Competitive pressure is also amplified by
              better-capitalized platform vendors such as CrowdStrike, SentinelOne, and Palo Alto Networks, all of which
              report stronger scale or growth than Trellix. Finally, the chapter preserves a material diligence gap:
              public data is insufficient to verify Trellix's true XDR-only SAM or SOM because product-line revenue,
              customer mix, and realized ACV are not disclosed. Contradictory publisher estimates should be preserved,
              not smoothed away.
