              - CV022
              - CV023
      - number: '8.6'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Trellix's exit readiness is constrained by three structural factors: the CCC+ capital structure that
              requires lender consent for most M&A transactions, the absence of publicly audited financials that would
              be required for any IPO or large strategic sale process, and the May 2026 RansomHouse breach that creates
              unquantified regulatory and litigation tail risk. An IPO is not being prepared as of the run date. A
              strategic sale to a larger cybersecurity vendor (Cisco, IBM Security, or a mega-PE) is the most plausible
              near-term exit path, but would need to be structured to handle the debt quantum. A secondary PE buyout at
              current distressed-debt prices is theoretically possible but would require both lender agreement and a
              buyer willing to underwrite revenue stabilization. The most actionable diligence asks for any investor
              considering either equity or distressed-debt entry are: (1) audited FY2025 and H1 2026 financial
              statements with EBITDA bridge; (2) NRR and logo churn by segment; (3) covenant compliance certificate and
              a full copy of the debt agreement; (4) May 2026 breach forensic final report and breach notification
              status in all jurisdictions; (5) Trellix Wise enterprise adoption data (pipeline, bookings, and gross
              margin by product line). Without these five items, no investment recommendation can be upgraded beyond
              research-more.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
