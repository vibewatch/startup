      - number: '2.3'
        title: Buyer Segmentation and Adoption
        blocks:
          - type: paragraph
            body: >-
              XDR purchase decisions are usually led by security-operations users but justified by executive budget
              owners. The daily users are SOC analysts, threat hunters, incident responders, and security engineering
              teams that want fewer consoles, better correlation, and faster containment. Budget authority typically
              sits with the CISO, VP of security, CIO, or a centralized infrastructure leader, depending on whether the
              organization treats XDR as part of a SecOps modernization, endpoint refresh, or broader
              platform-consolidation program. Large enterprises remain the dominant buyers, while BFSI is a standout
              vertical because of high compliance pressure and dense attack surfaces. Federal, defense, and critical
              infrastructure buyers matter disproportionately for Trellix because public-sector certifications, hybrid
              deployment support, and air-gapped or OT-sensitive environments narrow the field of acceptable vendors.
              Adoption paths also vary by segment: large enterprises and government buyers usually run formal RFPs and
              pilots before multi-year contracts, while mid-market accounts are more channel-led and more vulnerable to
              “good enough” native alternatives such as Microsoft bundles. That asymmetry explains why Trellix's
              strongest fit is not every enterprise, but the subset with regulated, heterogeneous, or hybrid estates
              where deployment flexibility matters.
            claimRefs:
