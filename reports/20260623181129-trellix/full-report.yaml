              - CV021
      - number: '8.5'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              Public XDR/EPP comparables trade at substantial premiums to where Trellix would likely be valued.
              CrowdStrike (CRWD), the closest public analog for cloud-native XDR, reported USD 5.25B ARR (+24% YoY) as
              of January 2026 and trades at approximately 18–19× NTM forward revenue—a premium justified by ARR growth,
              79% subscription gross margins, and platform expansion. Palo Alto Networks Cortex XDR trades at 11–12× NTM
              revenue with USD 9.2B FY2025 revenue and GAAP profitability. SentinelOne trades at 9–11× NTM revenue on
              USD 1B ARR and improving margins. For a private company with declining revenues, a distressed capital
              structure, and no disclosed gross margin, applying sector-median multiples is inappropriate. A comparable
              set of PE-backed or distressed cybersecurity companies (like the pre-IPO Darktrace or pre- turnaround
              McAfee Enterprise) suggests 1.5–3× revenue for below-growth, high-leverage assets. The USD 3.3B mid-point
              at 3× Trellix's estimated USD 1.1B revenue sits entirely within the debt stack, leaving no unambiguous
              equity value without revenue recovery. M&A transactions in the cybersecurity space in 2026 have closed at
              18–32× revenue for "must-own" platform leaders (Google/Wiz at 32×, top-tier M&A) and 5–8× for strong but
              non-leader assets—Trellix's position in that spectrum is closer to 2–4× given its current financial
              profile.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV004
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV037
              - CV038
          - type: figure
