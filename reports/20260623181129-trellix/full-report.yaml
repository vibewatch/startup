      - number: '4.2'
        title: Go-to-Market and Sales Efficiency
        blocks:
          - type: paragraph
            body: >-
              Trellix operates a channel-first go-to-market: over 90% of revenue flows through the Xtend global partner
              network, which was substantially overhauled in 2025 to create five formal specializations — endpoint,
              email, data, NDR, and XDR. Partners earn richer incentives for solution-area certifications, which
              concentrates booking quality by ensuring partners have technical depth before selling. This channel-heavy
              model reduces direct sales cost but also distances Trellix from the end customer, constraining net revenue
              retention visibility. Sales cycles in enterprise cybersecurity typically run three to nine months for new
              logo and one to two months for renewal; Trellix's are likely in this range, though undisclosed. Sales
              efficiency proxies such as customer acquisition cost (CAC), payback period, and net revenue retention
              (NRR) are not publicly disclosed. The most relevant indirect proxy is the deferred revenue trend: Fitch
              reported deferred revenues fell 14% year over year as of September 2023, indicating declining forward
              booking commitments. This is consistent with competitive loss of new logo to CrowdStrike, SentinelOne, and
              Microsoft rather than renewal failure in the installed base. Trellix has no disclosed AWS or Microsoft
              Marketplace procurement vehicle at the scale of CrowdStrike's multi-billion-dollar AWS Marketplace
              commitment, limiting enterprise procurement convenience for cloud-buying-center-led decisions. The Xtend
              2025 overhaul specifically targeted partner-driven pipeline predictability and co-selling capability, with
              early signals of improved partner engagement reported through 2025 and 2026.
            claimRefs:
