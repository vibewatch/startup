      - number: '4.5'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Trellix's capital structure was restructured in a 2024 distressed debt exchange (completing September
              2024). The current structure comprises a new $400 million super-priority term loan and $125 million
              super-priority revolving credit facility at the senior position, followed by a tiered first-out,
              second-out, and third-out term loan structure, all maturing in July 2028. S&P's post-exchange upgrade to
              CCC+ from SD (selective default) acknowledged improved short-term liquidity and lower cash interest
              expense from the PIK optionality on certain tranches. However, S&P affirmed CCC+ in July 2025 with
              negative outlook and explicitly stated the capital structure is unsustainable longer term without revenue
              stabilization and improved profitability. Debt/EBITDA leverage remains approximately 8.4x (2024 data),
              well above the 3 to 4x typical of investment-grade software peers. STG, the private equity sponsor, holds
              significant influence over capital allocation and has historically prioritized ROE (evidenced by the 2022
              $415 million incremental term loan, majority proceeds paid as a sponsor dividend). This governance posture
              limits voluntary debt prepayment even as margins improve from cost cuts. Cash on hand, burn rate, and
              runway are not publicly disclosed. As of Q1 2025, S&P indicates sufficient liquidity to meet near-term
              obligations — primarily from the revolver headroom and improved EBITDA margins — but this is a fragile
              position. The July 2028 maturity wall creates a refinancing event approximately 24 months from the current
              report date (June 2026), which is the next identifiable capital adequacy risk trigger. STG's ability to
              orchestrate a refinancing, sale, or partial recap before July 2028 without further covenant stress
              determines whether the current capital structure holds.
