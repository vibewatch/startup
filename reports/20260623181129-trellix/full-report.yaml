              - CR002
              - CR003
          - type: callout
            title: The RansomHouse breach breaks the product trust narrative
            body: >-
              A cybersecurity vendor that suffers a confirmed source code breach faces a uniquely severe reputational
              penalty. Customers must now assess whether detection logic contained in the leaked code can be studied by
              adversaries to craft evasion techniques, directly undermining the product value proposition for 53,000+
              enterprise and government customers.
            calloutType: risk
            claimRefs:
              - CR014
              - CR015
              - CR016
          - type: callout
            title: Revenue trend is the leading indicator for debt sustainability
            body: >-
              S&P's CCC+ affirmation cites declining revenues as the primary driver of the negative outlook. Revenue
              stabilization—not just cost control—is required for Magenta Buyer LLC to sustainably service its interest
              expense and avoid a covenant trigger that would force restructuring.
            calloutType: assumption
