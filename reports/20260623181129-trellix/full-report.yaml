      - number: '4.3'
        title: Cost Structure and Gross Margin
        blocks:
          - type: paragraph
            body: >-
              Trellix's cost structure is more hardware- and infrastructure-intensive than a pure SaaS model, reflecting
              its roots in on-premises appliance and software licensing, its threat intelligence data processing
              (8.75TB/day), and its endpoint agent cloud infrastructure. Fitch estimated EBITDA margins in the low-30s
              percent range in 2023, implying gross margins likely in the low-to-mid 40s — materially below the 70 to 80
              percent gross margins of cloud-native rivals CrowdStrike (78% GAAP FY2026) and SentinelOne (74% GAAP
              FY2026). The most concrete cost improvement is documented in the AWS case study: Trellix migrated its
              security analytics indexing infrastructure from self-managed to Amazon OpenSearch Service, reducing COGS
              by 35% as of Q3 2024 and increasing data-processing throughput by 40%. This single initiative reduced
              infrastructure management overhead from eight to ten hours per week to thirty to sixty minutes, freeing
              engineering capacity. Additional cost levers include workforce restructuring completed largely through
              2022–2023 and ongoing optimization of Skyhigh Security's shared-services footprint. Despite these
              improvements, the capital structure remains the binding constraint: interest expense on the complex
              multi-tranche debt (super-priority, first-out, second-out, third-out term loans totaling roughly $400M
              super-priority plus layered prior facility balance) absorbs cash that could fund product reinvestment. The
              availability of PIK (payment-in-kind) interest on some tranches provides temporary cash relief but
              capitalizes interest into principal, worsening leverage over time.
