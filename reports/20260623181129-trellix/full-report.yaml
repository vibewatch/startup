            body: >-
              Trellix was launched in January 2022 as the combined entity of McAfee Enterprise and FireEye, inheriting a
              large installed base in both endpoint security (McAfee's primary strength) and threat intelligence and
              incident response (FireEye's heritage). The 50,000-plus organization customer count reflects this
              inherited base plus organic growth under the Trellix brand from 2022 through 2026.


              Analyst positioning shows a mixed trajectory across product lines. In endpoint protection, Trellix was
              named a 'Challenger' in the 2025 Gartner Magic Quadrant for Endpoint Protection Platforms, a step back
              from the inherited 'Leader' classification McAfee Enterprise held in the 2017 and 2018 Magic Quadrants.
              However, Trellix is named a GigaOm Leader in both XDR (Extended Detection and Response) and NDR (Network
              Detection and Response), and a GigaOm Leader in DLP. The 2026 CRN Security 100 list recognized Trellix in
              the endpoint and managed security category, and the 2025 SE Labs Enterprise Endpoint awards recognized
              Trellix for Windows endpoint performance.


              Channel and partner coverage is broad. The DoD ESI BPA administered by Optiv/ClearShark provides
              government procurement access. TeamWorx demonstrates an MSSP-partner-delivered model on AWS. The partner
              ecosystem enables Trellix to reach mid-market and government segments that would be expensive to cover
              through direct sales alone.


              The Google Cloud migration case study illustrates an internal adoption pattern: Trellix moved its SAP
              production workloads to Google Cloud, integrated BigQuery as a data lake pulling from Salesforce, Siebel,
