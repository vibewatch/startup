            title: Unusually scaled starting point for a 2022 brand launch
            body: >-
              Trellix launched with the customer base and product breadth of two already scaled enterprise-security
              businesses, which is why its 2022 founding date can be misleading without merger context. The combination
              of 40,000 launch customers, broad product coverage, and large telemetry metrics makes Trellix materially
