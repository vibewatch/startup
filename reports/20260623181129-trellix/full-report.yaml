      - number: '3.2'
        title: Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              CrowdStrike is Trellix's most dangerous direct competitor: it reached $5.25 billion in ending ARR in
              FY2026 (ended January 31, 2026), up 24% year over year, on $4.81 billion in total revenue, with a 78% GAAP
              subscription gross margin and $1.24 billion in free cash flow for the year. CrowdStrike's Falcon platform
              is cloud-native, single-agent, and now covers 50% of customers across six or more modules (Falcon Flex),
              including AI Detection and Response (AIDR) announced for general availability in FY2026. The July 2024
              global outage created reputational damage but CrowdStrike's ARR growth accelerated to 24% afterwards,
              suggesting buyer stickiness. Microsoft Defender XDR is the most disruptive pricing competitor because it
              is bundled into Microsoft 365 E5, effectively making it free for the large enterprise
              Microsoft-standardized base; it correlates signals across endpoint, identity, Office 365, and cloud,
              powered by Security Copilot AI. SentinelOne reached $1.119 billion ARR in FY2026 (up 22% year over year)
              on $1.001 billion revenue, attaining first-time operating profitability, and differentiates on autonomous
              on-device AI inference that functions offline, one-click ransomware rollback, and single-agent
              Linux/Mac/OT support. Palo Alto Networks reported $9.2 billion revenue in FY2025 with next-generation
              security ARR of $5.6 billion (up 32%), pursuing aggressive platformization: Cortex XDR, XSIAM, XSOAR, and
              Xpanse sold together displace point solutions at large enterprises, and PANW targets $7.0 to $7.1 billion
              in NGS ARR for FY2026. Cisco, following its $28 billion Splunk acquisition, integrates network telemetry,
              SIEM, and XDR into a single SOC platform with broad enterprise distribution. Trend Micro Vision One is a
              consistent Gartner EPP Leader with deep threat intelligence and multi-OS support, competing primarily on
              threat-intelligence depth in regulated sectors. Broadcom, through Symantec Endpoint Security, retains a
              large but contracting legacy enterprise base similar to Trellix, though its focus has shifted to mainframe
              and semiconductor post-VMware acquisition. Skyhigh Security (Trellix's STG sister company) focuses on
              SSE/cloud security and integrates with Trellix at the network telemetry layer, but is a potential
              substitute for customers consolidating toward a single SSE+XDR vendor.
