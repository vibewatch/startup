  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Trellix's market should be bounded as enterprise extended detection and response rather than “all
              cybersecurity” or even all SecOps software. In-scope spend covers platforms that unify endpoint, network,
              cloud, email, identity-adjacent, and response workflows into one investigation surface, plus the
              automation and cross-domain correlation needed to act on those signals. That is broader than classic EDR,
              but narrower than every adjacent control in a CISO budget. The most important excluded or adjacent pools
              are pure SIEM, point EDR and NDR bought separately, SOAR-only tooling, identity-centric platforms,
              firewall refresh, and generic compliance software. Forrester’s Q2 2024 XDR Wave matters because it
              formally retired the standalone EDR Wave and framed XDR as the category that now carries the strongest
              “SIEM replacement” ambition for mainstream SecOps teams. In practice, many XDR purchases are consolidation
              projects, not greenfield budgets. That is why Trellix competes not only against named XDR platforms, but
              also against the status quo of MDR outsourcing, Microsoft-native security bundles, and incumbent SIEM-led
              architectures that organizations are reluctant to unwind without clear operational ROI.
            claimRefs:
              - CM006
              - CM013
              - CM014
