  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Model
        blocks:
          - type: paragraph
            body: >-
              Trellix generates revenue through three interconnected streams. First, subscription software licenses —
              the dominant and growing stream — cover annual per-endpoint licenses for endpoint security (XDR, EDR,
              DLP), email security, network detection and response (NDR), and the Trellix Security Platform. These are
              sold as one-year to three-year contracts through the Xtend channel. Second, legacy support and maintenance
              contracts cover perpetual software license holders who have not yet transitioned to subscriptions; these
              generate stable cash but are declining as customers either convert to subscriptions or churn. Third,
              professional services and managed detection and response (MDR) provide implementation, threat hunting, and
              SOC services on a project and retainer basis. Revenue mix is not publicly disclosed. Fitch reported that
              recurring revenues (subscriptions plus legacy support) comprised approximately 80% of total revenues in Q3
              2023 — a high figure, but notable because this 80% was itself declining at 6% year over year.
              Non-recurring revenues fell 27% year over year in the same period, reflecting the ongoing attrition of
              perpetual-license support contracts. Enterprise list pricing for endpoint security runs approximately $26
              to $68 per endpoint per year at list; enterprise customers routinely achieve 25 to 55 percent discounts,
              and multi-product bundles introduce further pricing complexity. Revenue recognition is largely ratable
              (subscription licenses recognized over the contract term), consistent with SaaS norms, but legacy
              perpetual support may be recognized at time of renewal, creating lumpiness in quarterly reporting.
            claimRefs:
              - CI001
