      - number: '7.5'
        title: People, Execution, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Vishal Rao became CEO in January 2025, succeeding Bryan Palma, bringing experience from Splunk, Cloudera,
              and Snow Software as well as dual-role leadership of Skyhigh Security—a notable operational complexity.
              The CEO transition creates a standard risk of strategic disruption, talent attrition, and slower
              customer-facing decision-making during the first twelve to eighteen months of tenure. Employee reviews on
              Blind cite frequent organizational changes, management instability, and limited career growth, consistent
              with the multi-year PE-driven cost reduction that has followed the 2021–2022 merger. The integration of
              McAfee Enterprise and FireEye into a single platform remains operationally incomplete in the view of
              customers who report fragmented consoles and inconsistent product quality. Execution risk is elevated by
              the combination of financial pressure (CCC+ debt, declining revenue), the need to modernize the product
              around Trellix Wise AI, and the competitive sprint against cloud-native, well-capitalized peers.
              Thesis-break triggers include: a breach of Magenta Buyer LLC debt covenants or acceleration of
              distressed-debt restructuring; a second major security incident within twelve months of the May 2026
              RansomHouse event; confirmed annual customer logo churn above 10% in government or critical-infrastructure
              segments; the CEO departing within twelve months of appointment; or Microsoft Defender cross-selling
              displacing Trellix in more than three top-ten enterprise accounts in a single quarter. Monitoring
              indicators include quarterly credit-market pricing for Magenta Buyer loans, Gartner Peer Insights rating
              trends, and any regulatory inquiry disclosures arising from the May 2026 breach.
            claimRefs:
