companyProfile:
  summary: >-
    Trellix is a private-equity-backed cybersecurity platform created from the merger of McAfee Enterprise and FireEye
    Products, officially launched on 2022-01-19 under Symphony Technology Group ownership. The company sells an XDR-led
    platform spanning endpoint, email, network, cloud, and SOC workflows, serves more than 50,000 organizations across
    185 countries, and is increasingly positioning Trellix Wise as its AI automation layer. The public investment debate
    is less about category relevance than about whether a large installed base and broad product footprint can overcome
    declining revenue trends and a distressed, debt-heavy Magenta Buyer capital structure.
  foundedDate: '2022-01-19'
