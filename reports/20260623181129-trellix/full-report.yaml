              All tranches of Magenta Buyer's restructured debt mature in July 2028 — approximately 25 months from this
              report date. With negative FCF history and CCC+ credit, refinancing is feasible only if revenue stabilizes
              and EBITDA margins improve materially. Failure to refinance would require a new distressed exchange,
