      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Trellix's regulatory surface spans US federal, EU, and sector-specific frameworks. On the US side, the
              company holds FedRAMP High and Moderate authorizations for its GovCloud platform (deployed on AWS
              GovCloud) and DoD Impact Level 5 certification for its EDR offering, enabling sale to federal and defense
              customers. These certifications require continuous monitoring and carry recertification costs; FedRAMP is
              transitioning to a new Certification Classes framework in 2026, requiring compliance updates by end of
              year. In the EU, NIS2 enforcement is active across member states as of 2026, and customers of Trellix that
              are in-scope entities (critical infrastructure, essential services) must satisfy NIS2 article 21
              requirements including incident notification. Trellix's own operations must also meet GDPR article 32
              technical controls; any breach of customer data— especially material given the May 2026 source code
              incident—carries fines and reputational damage. The company holds ISO 27001, 27017, 27018, and 27701
              certifications attesting to information security management, cloud security, and privacy information
              management, which provide a baseline compliance posture. No material litigation or enforcement action
              against Trellix has been confirmed as of the run date; however, the RansomHouse breach may generate
              customer breach notification obligations, regulatory inquiries in multiple jurisdictions, and potential
              litigation if customers suffer downstream harm. Separately, the heavily leveraged capital structure (CCC+
              rated) creates covenant-related legal risk: Magenta Buyer's first-lien lenders engaged legal advisors
              (Akin Guckman and Gibson Dunn) in 2023 amid earnings pressure, signaling creditor oversight that could
              restrict strategic flexibility.
