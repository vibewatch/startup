chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Trellix officially launched on 2022-01-19 as the new brand created from the merger of McAfee Enterprise
              and FireEye Products, two large security carve-outs assembled by Symphony Technology Group (STG). That
              origin matters: Trellix was not a small venture-backed startup entering the market from zero, but a
              sponsor-built platform launched with an inherited installed base, broad product surface, and stated
              40,000-customer footprint. SecurityWeek reported the combined business at launch was running at roughly
              US$2 billion of annual revenue scale, reinforcing that Trellix began life as a scaled integration project
              rather than an early-stage software company.


              In 2026, Trellix describes itself as a cybersecurity platform company centered on extended detection and
              response, with adjacent endpoint, email, network, cloud, data, and security-operations capabilities sold
              primarily to enterprise and public-sector buyers. The platform page emphasizes 600+ native and open
              integrations, while Trellix Wise is positioned as a patented generative-AI layer for SOC automation.
              Headquarters evidence is time-sensitive: launch materials referenced San Jose, California, while
              third-party review directories in 2025-2026 identify Plano, Texas as current headquarters. The chapter
              therefore treats Plano as the current operating HQ and San Jose as the launch-era press location.
