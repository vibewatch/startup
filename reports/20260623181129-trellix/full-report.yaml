      - number: '3.3'
        title: Capability, Pricing and GTM Comparisons
        blocks:
          - type: paragraph
            body: >-
              On capability breadth, Trellix's greatest differentiation is genuine coverage across all infrastructure
              types: the 2025 Gartner EPP confirms Trellix as the leading choice for hybrid-cloud organizations with
              on-premises and air-gapped infrastructure, a requirement that cloud-native-only rivals cannot fully
              satisfy. Trellix processes 8.75TB of threat data daily from more than 100 million endpoints and tracks
              over 5,300 threat campaigns through its Advanced Research Center, supporting deep threat intelligence. Its
              platform integrates with 500+ third-party tools natively and ships Attack Path Discovery and Trellix Wise,
              a production-ready GenAI investigation assistant. However, Palo Alto's cyberpedia and practitioner reviews
              consistently flag console fragmentation (endpoint, DLP, email, network correlations living in separate
              management interfaces) and relatively high CPU/RAM consumption compared to the lightweight CrowdStrike
              Falcon sensor, both of which raise analyst-workload concerns. On pricing, Trellix enterprise list price
              runs approximately $26 to $68 per endpoint per year; enterprise discounts of 25 to 55 percent are widely
              available. Microsoft is effectively free for M365 E5 customers; CrowdStrike commands a premium ($50+ per
              endpoint equivalent in bundled Falcon pricing) but wins on operational simplicity. SentinelOne prices
              competitively in the $30 to $45 per endpoint range. On go-to-market, Trellix's Xtend channel drives over
              90% of revenue, with specializations in data, email, endpoint, NDR, and XDR. CrowdStrike uses a hybrid
              bottoms-up developer and enterprise field-sales model. Microsoft wins through existing procurement and E5
              upgrade campaigns. PANW relies on its large field organization and a platformization free-token incentive
              program. On compliance and trust, Trellix uniquely supports FIPS 140-2, air-gapped deployments for
              ICS/SCADA and industrial environments, and has certifications for OT/industrial critical-asset protection
              that CrowdStrike lacks. This differentiation remains decisive for defense and critical infrastructure
              buyers.
