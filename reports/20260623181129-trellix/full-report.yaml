            surfaces sector-specific campaign priorities.
          tone: positive
        - id: detect
          label: Detect and correlate
          detail: >-
            Helix rules and pre-built analytics correlate multi-vendor telemetry into prioritized multi-vector cases;
            NDR uses signature-less ML for network threats.
          tone: positive
        - id: investigate
          label: Wise auto-investigation
          detail: >-
            Trellix Wise queries all source data in place, builds a confidence matrix across 5 analytical dimensions,
            and presents verdicts with full evidence trails; junior analysts receive guided, natural-language-accessible
            investigation paths.
          tone: positive
        - id: respond
          label: Respond or auto-remediate
