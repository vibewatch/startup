      - number: '1.3'
        title: Funding and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Trellix's capital story starts before the Trellix brand existed. STG acquired McAfee Enterprise for
              roughly US$4 billion in 2021 and separately acquired FireEye Products for US$1.2 billion, then merged the
              assets in October 2021 ahead of the January 2022 launch. This means Trellix's effective "funding history"
              is better understood as sponsor-backed M&A assembly rather than a venture-round ladder. The public source
              set does not disclose a clean standalone post-launch equity valuation, nor does it provide a complete
              picture of secondary flows, equity marks, or lender economics specific to Trellix alone.


              The clearest later capital event is Magenta Buyer LLC's 2024 US$400 million refinancing, which Trellix
              described as new capital raised for the holding structure spanning Trellix and Skyhigh Security. That
              refinancing is important not because it proves growth financing in the venture sense, but because it
              signals continuing reliance on leveraged sponsor ownership. Anonymous layoff commentary should not be
              treated as proven fact, but when read alongside the refinancing it highlights the core diligence question:
              how much operating flexibility is constrained by holdco debt, cross-portfolio governance, and exit
              expectations set by STG rather than by public-market disclosure discipline.
            claimRefs:
