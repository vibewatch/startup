      - number: '2.2'
        title: Market Sizing and TAM
        blocks:
          - type: paragraph
            body: >-
              Public market sizing for XDR is directionally useful but too inconsistent to support a single “headline
              TAM” without caveat. The broadest lens comes from MarketsandMarkets and Frost & Sullivan, which place the
              category around $5.5 billion to $7.4 billion in 2024 and roughly $7.9 billion in 2025, with long-range
              growth to $14.5 billion by 2027 or $30.9 billion by 2030 depending on horizon and scope. Narrower
              publishers such as Mordor Intelligence and Straits Research place 2025 closer to $2.1 billion to $2.3
              billion and 2030 nearer $5.0 billion, implying that a large share of disagreement is definitional rather
              than purely forecasting error. North America still appears to account for about two-fifths of market
              revenue, cloud deployment is already dominant, and managed-services layers are growing faster than the
              core market. For Trellix specifically, a rough serviceable-market proxy can be sketched from customer
              count and third-party revenue estimates, but public evidence does not disclose XDR-only revenue, ACV by
              segment, or geography mix. The right conclusion is therefore a range-based sizing frame, not a falsely
              precise single-point TAM/SAM/SOM.
