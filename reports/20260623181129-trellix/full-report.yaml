      - number: '6.5'
        title: Customer Concentration and Retention Risks
        blocks:
          - type: paragraph
            body: >-
              The most material gap in chapter-level diligence is the absence of any public customer retention metrics.
              Trellix does not disclose Net Revenue Retention (NRR), Gross Revenue Retention (GRR), logo churn, or
              renewal rates. The 50,000-organization total is a static point-in-time count without time-series context
              showing whether the base is growing, stable, or contracting. Comparable enterprise security SaaS companies
              achieving strong NRR (greater than 115%) report this publicly as a key investor signal; the absence of any
              retention disclosure from Trellix or its parent is a meaningful gap for diligence.


              Customer concentration risk is structurally elevated by the heavy skew toward large enterprise and
              government clients. Multi-year contracts with government agencies and large enterprises provide sticky,
              predictable revenue, but individual account losses—particularly in the DoD or federal civilian
              segment—could represent significant revenue events. Trellix does not disclose the revenue contribution of
              its top 10 or top 20 accounts.


              The May 2026 source code breach introduces a specific risk to renewal and expansion dynamics. While
              Trellix reported no customer data compromise, the uncertainty over which specific product codebases were
              accessed is likely to trigger contract review clauses and vendor risk reassessment at security-focused
              enterprise customers. Regulated industry customers (financial services, healthcare, critical
              infrastructure) with vendor security requirements may face internal pressure to delay renewal or require
              additional security assurances before expanding.


              On the expansion side, Trellix's land-and-expand story is well-supported by its multi-product deployments.
              SMS Group is adding DLP; AU Small Finance Bank is building toward XDR; TeamWorx is expanding into managed
              detection. The 500-plus integration ecosystem and open architecture reduce switching costs for customers
              already invested in the platform, and ePO's Active Directory independence facilitates rapid M&A
              integration for enterprise customers.


              Channel and partner concentration is another risk vector. The DoD ESI BPA and Optiv/ClearShark
              relationship represent a significant portion of government revenue access; any disruption to that channel
              relationship could impair government segment growth. The AWS partnership enabling TeamWorx-style managed
              detection models is an opportunity for mid-market reach but lacks public scale data.
