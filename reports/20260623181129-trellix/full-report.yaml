      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The capital structure is the master risk
            body: >-
              Magenta Buyer LLC's CCC+ S&P rating with negative outlook means every other risk (breach, competitive
              displacement, CEO transition) is amplified by the company's limited ability to raise fresh capital or
              refinance at non-distressed terms. The first-lien loans at ~66–68 cents and second-lien at ~36–39 cents
              signal market skepticism about full debt recovery.
            calloutType: risk
