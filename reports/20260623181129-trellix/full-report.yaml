  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Trellix layers collection and intelligence under detection, GenAI orchestration, response automation, and
      compliance surfaces, all connected through the XDR platform and ePO management.
    approximationNotes: >-
      This is a synthesized product architecture based on public product pages, the Trellix Wise whitepaper, and
      customer stories. It does not represent an internal component diagram.
    data:
      layers:
        - label: Data collection and sources
          detail: >-
            Endpoint agents, email gateway, network sensors, OT/ICS connectors, cloud APIs, and 500+ third-party
            integrations via Helix bring multi-vector telemetry into the platform.
          modules:
            - ePO agent deployment
            - Helix integrations
            - NDR network sensors
            - Email gateway
          outputs:
            - Raw security events across all vectors
        - label: Threat intelligence and enrichment
          detail: >-
            TIE shares real-time threat verdicts across all connected systems; ARC produces daily intelligence from 68
            billion threat queries and 100 million endpoints; Insights maps CVEs to active campaigns by sector and
            geography.
          modules:
            - Threat Intelligence Exchange
            - ARC research telemetry
            - Insights campaign mapping
          outputs:
            - Real-time verdicts and enriched CVE context
        - label: Detection and correlation
          detail: >-
            Helix pre-built analytics and rules correlate multi-vendor events into multi-vector detections; NDR uses
            signature-less ML detection and MITRE ATT&CK mapping; ESM provides SIEM-style real-time monitoring.
          modules:
            - Helix correlation engine
            - NDR signature-less detection
            - ESM SIEM monitoring
          outputs:
            - Prioritized alerts and cases
        - label: GenAI orchestration — Trellix Wise
          detail: >-
            Wise reads source data in place across SIEMs, SOAR, EDR, and cloud tools; builds a confidence matrix
            aggregating 5 analytical dimensions; auto-investigates 100% of alerts; supports natural-language threat
            hunting and auto-pilot remediation when confidence threshold is reached.
          modules:
            - Federated data query engine
            - Confidence matrix builder
            - Natural language interface
            - Auto-pilot remediation
          outputs:
            - Verdicts, guided actions, and 8-hour-per-100-alerts SOC recovery
        - label: Response and automation
          detail: >-
            Hyperautomation provides no-code drag-and-drop playbooks integrating any tool with an API; ePO enforces
            policy responses across the endpoint estate; ServiceNow, Slack, and Jira webhook queues route verdicts to
            the right response team.
          modules:
            - Hyperautomation playbooks
            - ePO policy enforcement
            - Webhook queue routing
          outputs:
            - Automated containment, enrichment, and case closure
        - label: Data protection and compliance
          detail: >-
            DLP covers endpoint, network, and email; Data Encryption restricts access at rest; Database Security
            protects databases with zero-downtime patching; AI Data Risk Dashboard monitors sanctioned and shadow AI
            data exposure.
          modules:
            - DLP (endpoint, network, email)
            - Data Encryption
            - Database Security
            - AI Data Risk Dashboard
          outputs:
            - Data-loss prevention events and compliance reports
