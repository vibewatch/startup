      - number: '4.4'
        title: Public Traction Versus Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              Published traction metrics are thin and indirect. The most reliable indicators are company-stated customer
              counts: 50,000+ business and government customers as of April 2025 (from the RSAC press release),
              including 78% of Fortune Global 500. The 2026 corporate fact sheet states 3,400 employees, 185 countries,
              and 600+ patents. GrowJo's August 2025 estimate puts annualized revenue at approximately $1.1 billion,
              consistent with the Fitch and S&P reports' implicit revenue scale (Fitch's going-concern EBITDA estimate
              of $450M on a revenue base of ~$1.1B implies roughly 40% EBITDA margins at stress-case scenario). Revenue
              trend signals are adverse: total revenues declined approximately 11% year over year in Q3 2023 (Trellix
              segment down 12%, Skyhigh down 4%), and Fitch projected low-double-digit declines in 2023 followed by
              mid-single-digit declines in 2024. S&P's July 2025 affirm notes that revenue declines and negative free
              cash flow continued in 2025. Audited revenue, exact ARR, net revenue retention, churn rate, and renewal
              rate are all private — the principal metrics required to underwrite the revenue quality thesis are
              unavailable from public sources. The deferred-revenue decline of 14% year over year through September 2023
              is the best publicly available proxy for forward bookings weakness. The May 2026 source code breach
              introduced an additional unknown: whether the incident caused material customer churn or evaluation
              deferrals in the months following disclosure is not yet documented.
