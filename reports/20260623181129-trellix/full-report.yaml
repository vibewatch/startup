      - number: '7.3'
        title: Operational and Security Risk
        blocks:
          - type: paragraph
            body: >-
              The May 2026 RansomHouse incident is Trellix's most acute operational risk. Attackers accessed internal
              systems on or around April 17, 2026 and exfiltrated source code from the company's private repositories.
              RansomHouse published screenshots demonstrating access on May 7, 2026 and listed Trellix on its dark web
              leak site. Trellix engaged forensic experts and law enforcement and publicly stated no evidence that its
              release or distribution pipeline was affected; however, researchers noted that possessing the source code
              enables adversaries to map detection logic, craft evasion techniques, and potentially discover zero-day
              vulnerabilities in Trellix-protected environments—affecting over 53,000 business and government customers.
              The breach is especially damaging because Trellix's core product value proposition is protecting
              enterprise environments; a vendor that cannot protect its own source code faces significant trust erosion
              among security procurement teams. Independent of the breach, customers consistently report in Gartner Peer
              Insights and PeerSpot reviews that Trellix requires skilled technical resources to deploy, causes high CPU
              and memory consumption on endpoints, offers inadequate support responsiveness for advanced issues, and has
              a complex interface inherited from the McAfee/FireEye rebranding. These operational friction points
              increase churn risk and slow expansion within existing accounts. Reliability is broadly adequate under the
              FedRAMP monitoring regime, but the company does not publish a standard commercial SLA, leaving contractual
              reliability commitments opaque. Supply-chain dependencies on AWS GovCloud and Microsoft Azure for GovCloud
              deployments add concentration risk to the operational footprint.
            claimRefs:
              - CR014
              - CR015
              - CR016
              - CR017
