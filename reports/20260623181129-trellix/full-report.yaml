            Hyperautomation playbooks (endpoint isolation, IOC blocking, ITSM ticket creation).
          tone: positive
        - id: measure
          label: Measure posture and report
          detail: >-
            Insights posture scoring maps detections to campaigns; SecondSight hunters provide human review of low-noise
            signals; ESM dashboards track KPIs for compliance and board reporting.
          tone: neutral
