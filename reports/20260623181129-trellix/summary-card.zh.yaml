  topStrengths:
    - 覆盖 185 个国家的 50,000+ 家组织，在政府和 Fortune 500 客户中有实质渗透。
    - 以 XDR 为核心的平台很宽，覆盖终端、邮件、网络、数据和 SOC 自动化能力，并有 600+ 个集成。
    - 承接 McAfee Enterprise 和 FireEye 资产，继承了庞大装机基础和运营相关性。
  topRisks:
