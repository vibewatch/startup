    - 2026 年 5 月源码泄露叠加 Microsoft Defender 和 CrowdStrike 的强竞争，可能进一步推高流失风险。
  unresolvedGaps:
    - FY2025 和 H1 2026 审计财务未公开，包括 EBITDA 和自由现金流桥。
    - NRR、GRR、logo 流失和头部客户集中度仍未披露。
    - Magenta Buyer 内部的完整契约包、债务瀑布和发起人 / 股东经济安排仍属私有信息。
    - 2026 年 5 月源码泄露的最终取证和监管结果仍未落定。
