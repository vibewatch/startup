callouts:
  - calloutType: risk
    title: Challenger positioning in a Leader-take-all procurement market
    body: >-
      In formal enterprise RFPs, a Gartner Challenger designation materially disadvantages
      Trellix against the five Leaders (CrowdStrike, Microsoft, PANW, Trend Micro, SentinelOne).
      Until Trellix achieves Leader status, its net-new win rate outside its legacy base remains
      structurally constrained.
    claimRefs: [CP004, CP012]
  - calloutType: insight
    title: The hybrid/air-gapped moat is real but narrow and shrinking
    body: >-
      Trellix's most defensible differentiation is OT/ICS/air-gapped certified deployment support,
      which no cloud-native rival matches. This anchors government, critical infrastructure, and
      defense contracts. However, this moat protects perhaps 20–30% of the revenue base; the
      remaining commercial enterprise book is subject to full competitive pressure from
      cloud-native peers.
    claimRefs: [CP011, CP026]
