      "id": "product-portfolio-and-platform",
      "title": "Product Portfolio and Platform",
      "body": "Trellix's product architecture is organized around a single open security platform spanning five major protection domains: endpoint, email, network, data, and security operations. The portfolio emerged from the 2022 merger of McAfee Enterprise and FireEye, and today it markets itself as an integrated XDR platform powered by the Trellix Wise GenAI layer. At the top of the stack sits Wise, a vendor-agnostic federated intelligence engine that reads security data from its native location and auto-investigates 100% of incoming alerts without requiring data migration. Under Wise, the Security Operations family includes Helix (SecOps, SIEM, SOAR with 500+ integrations across 230 vendors), the Enterprise Security Manager (ESM) for SIEM-style real-time monitoring, and Hyperautomation for no-code playbook orchestration. The endpoint family covers Endpoint Security (ENS), EDR with Forensics, Endpoint Forensics, Application and Change Control, Mobile Threat Defense, and ePolicy Orchestrator (ePO). The email and collaboration family provides cloud-native email protection, phishing simulation, and sandboxed inspection for collaboration platforms. The network family includes Network Detection and Response (NDR), Intrusion Prevention System (IPS), Network Forensics, and the Intelligent Sandbox. The data security family spans DLP, Data Encryption, and Database Security. Threat intelligence is served by Insights, Threat Intelligence Exchange (TIE), the Advanced Research Center (ARC), and the SecondSight managed threat hunting service. The public product catalog as of June 2026 shows more than 20 distinct named products\u2014an unusually broad portfolio that both strengthens the consolidated-vendor pitch and creates integration and rationalization questions for diligence.",
