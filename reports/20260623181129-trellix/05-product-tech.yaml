  "callouts": [
    {
      "calloutType": "strength",
      "title": "Trellix Wise's federated GenAI approach solves a real procurement objection",
      "body": "By reading data from its native location rather than requiring data migration, Wise addresses the primary enterprise barrier to AI-powered SecOps \u2014 the reluctance to move sensitive security telemetry to a cloud AI environment. The on-premises and air-gapped compatibility further extends the addressable market to regulated and government buyers who cannot move to full SaaS.",
      "claimRefs": [
        "CE002",
        "CE003",
        "CE004",
        "CE029",
        "CE036"
      ]
    },
    {
      "calloutType": "risk",
      "title": "The May 2026 source code breach creates unresolved product risk",
      "body": "Trellix has not publicly disclosed which products were affected or provided a forensic timeline. Attackers with visibility into detection source code can craft evasion techniques, and Germany's BSI has already issued guidance for critical-infrastructure operators. Until a full forensic report is published, customers and investors should treat the incident as an open product-integrity risk.",
      "claimRefs": [
        "CE033",
        "CE034",
        "CE035"
      ]
    },
    {
      "calloutType": "insight",
      "title": "The portfolio breadth is a double-edged competitive asset",
      "body": "Trellix's 20+ named products and 1,000+ integration claim make it one of the broadest enterprise security vendor platforms available. For buyers prioritizing vendor consolidation, that breadth is a major selling point \u2014 as illustrated by SMS Group deploying 'almost everything' from Trellix. For smaller customers or those needing best-of-breed in specific areas, the breadth can translate to integration complexity and risk of uneven quality across modules.",
      "claimRefs": [
        "CE001",
        "CE031",
        "CE039",
        "CE042"
      ]
    }
  ],
