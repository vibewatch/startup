evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation gap
    missingEvidence: Exact current standalone Trellix equity valuation, sponsor mark, and any internal valuation bridge since launch.
    whyItMatters: >-
      Without a valuation bridge, later return and downside analysis cannot distinguish platform quality from sponsor
      accounting.
    diligencePath: >-
      Request board materials, quarterly sponsor valuation marks, and any lender or auditor valuation schedules covering
      Trellix standalone.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance rights
    missingEvidence: Board composition, committee chairs, shareholder rights, and any veto or reserved-matter controls held by STG.
    whyItMatters: >-
      Control rights determine whether a minority investor would be underwriting management execution or sponsor process
      risk.
    diligencePath: Obtain the current board list, shareholder agreement, and governance summary from management or counsel.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: debt covenants
    missingEvidence: >-
      Lender identities, maturity ladder, interest costs, covenant package, and intercompany cash-flow restrictions at
      Magenta Buyer.
    whyItMatters: >-
      Debt structure can cap investment capacity, influence pricing flexibility, and determine restructuring risk during
      slower growth.
    diligencePath: >-
      Request the full debt schedule, covenant summary, and latest compliance certificate for Magenta Buyer and relevant
      subsidiaries.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: dual-role duration
    missingEvidence: >-
      Explicit disclosure on whether Vishal Rao's dual-CEO arrangement across Trellix and Skyhigh is transitional or
      intended to persist.
    whyItMatters: >-
      The durability of the dual role changes how investors should assess succession, focus, and resource allocation
      risk.
    diligencePath: >-
      Ask management for reporting lines, planned duration, and any separation triggers between the Trellix and Skyhigh
      CEO roles.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: standalone operating metrics
    missingEvidence: Audited current revenue, headcount, and product-mix detail for Trellix as a standalone operating company.
    whyItMatters: Public scale estimates are good enough for orientation but not strong enough for precise underwriting.
    diligencePath: Request the latest monthly operating pack with revenue by product, employee count by function, and customer mix.
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone table coverage
    missingEvidence: >-
      A fuller public chronology of non-announced restructurings, partner launches, and any dated adverse operating
      events after the 2024 refinancing.
    whyItMatters: >-
      The milestone table is directionally complete, but sparse disclosure can hide whether governance or workforce
      changes were isolated or part of a broader pattern.
    diligencePath: >-
      Reconcile the public chronology against management board decks, HR restructuring logs, and internal launch
      calendars before treating the timeline as exhaustive.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: Disclosed revenue breakdown by product and geography sufficient to isolate Trellix's true XDR-only SAM and SOM.
    whyItMatters: >-
      Without product-line revenue and ACV detail, Trellix-specific market sizing remains a proxy built from customer
      counts and third-party revenue estimates rather than verified commercial data.
    diligencePath: >-
      Request a data-room breakdown of XDR revenue, attachment by module, geography, ACV bands, and regulated-sector
      mix.
    relatedQuestionRefs:
      - QM014
  - type: missing-source
    severity: material
    topic: competitor profile table
    missingEvidence: >-
      Win/loss data documenting how often Trellix wins or loses against specific rivals in enterprise procurement and
      what the primary displacement reason is.
    whyItMatters: >-
      Identifies which competitive layer is most threatening to the installed base and shapes the durability of
      Trellix's hybrid-moat thesis.
    diligencePath: >-
      Request Trellix competitive win/loss analysis from sales operations or customer success; supplement with
      enterprise buyer interviews.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: moat durability / competitive risk register
    missingEvidence: >-
      Net revenue retention (NRR) and gross revenue retention (GRR) rates for Trellix across enterprise, mid-market, and
      government segments — these are private and not disclosed.
