  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-structure
      missingEvidence: >-
        Magenta Buyer LLC debt covenant package, compliance certificates, and actual EBITDA and FCF
        for fiscal year 2025 and H1 2026 — all private lender materials.
      whyItMatters: >-
        Without covenant headroom data, it is impossible to assess proximity to a debt acceleration
        trigger, which is the master risk for equity value.
      diligencePath: >-
        Request covenant compliance certificate and financial statements directly from Trellix / STG as
        part of any investment due diligence process.
      relatedQuestionRefs: [QR026, QR027]

    - type: private-evidence-only
      severity: blocking
      topic: revenue-retention
      missingEvidence: >-
        Net revenue retention (NRR) and logo churn rates by customer segment are not publicly disclosed
        by Trellix or Magenta Buyer LLC.
      whyItMatters: >-
        NRR is the single most important indicator of whether the revenue decline is structural (customer
        attrition) or cyclical (sales execution), directly determining the severity of the capital
        structure risk.
      diligencePath: >-
        Request NRR and logo churn by segment (government, enterprise, SMB) from Trellix management
        during diligence; channel checks with top VAR and MSSP partners can triangulate.
      relatedQuestionRefs: [QR027]

    - type: enumeration-incomplete
      severity: material
      topic: security-breach
      missingEvidence: >-
        Full scope of the May 2026 RansomHouse breach: which source code modules were exfiltrated,
        whether customer PII was co-located, whether any Trellix customer has suffered downstream harm,
        and the status of breach notifications to EU supervisory authorities.
      whyItMatters: >-
        Material downstream harm or a GDPR fine would significantly elevate litigation and regulatory
        exposure; the current stated position ("no evidence of distribution pipeline tampering") may
        not be final.
      diligencePath: >-
        Monitor Trellix trust/security advisory page; engage with forensic investigator findings; check
        EU supervisory authority registries for Trellix breach notifications.
      relatedTableRefs: [TR002]

    - type: private-evidence-only
      severity: material
      topic: partner-dependency
      missingEvidence: >-
        Top-10 channel partner revenue concentration, contract tenure and renewal terms with Xtend VAR
        and MSSP partners, and volume data from Azure and AWS Marketplace.
      whyItMatters: >-
        Trellix's actual go-to-market dependence on its three largest channel partners is unquantified;
        defection of a top partner to CrowdStrike would materially reduce enterprise reach.
      diligencePath: >-
        Request partner concentration data; conduct channel checks with GuidePoint, Optiv, and other
        top Xtend partners.
      relatedQuestionRefs: [QR014]

    - type: stale
      severity: minor
      topic: capital-structure
      missingEvidence: >-
        Updated Magenta Buyer LLC debt trading prices (current as of June 2026) and any refinancing
        activity since the 2024 LME transaction.
      whyItMatters: >-
        The most recent loan prices cited (from ION Analytics, November 2023) may understate or
        overstate current distress levels; a subsequent LME could have changed maturity profiles.
      diligencePath: >-
        Pull current Magenta Buyer LLC loan prices from Markit or Bloomberg leveraged loan data;
        verify whether any 2025–2026 refinancing has occurred.

    - type: missing-source
      severity: minor
      topic: operational-risk
      missingEvidence: >-
        Trellix's standard commercial SLA terms (uptime, incident response) are not published on the
        Trellix website; customer contractual terms are negotiated individually.
      whyItMatters: >-
        Without a public SLA, enterprise customers and investors cannot assess contractual reliability
        exposure or benchmark against competitors who publish formal uptime guarantees.
      diligencePath: >-
        Request sample customer MSA and SLA addendum from Trellix during commercial diligence.
      relatedQuestionRefs: [QR011]

    - type: private-evidence-only
      severity: material
      topic: security-breach
      missingEvidence: >-
        Customer-facing breach notifications and forensic investigation conclusions from the May 2026
        RansomHouse incident, including whether any customer suffered downstream harm.
      whyItMatters: >-
        Evidence of downstream customer harm would trigger litigation and regulatory escalation;
        the current absence of confirmed harm is consistent with early-stage investigation.
      diligencePath: >-
        Monitor Trellix trust/security advisory page; check EU supervisory authority registries;
        engage forensic investigator findings when available.
      relatedQuestionRefs: [QR025]

