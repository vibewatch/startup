callouts:
  - calloutType: risk
    title: The capital structure is the master risk
    body: >-
      Magenta Buyer LLC's CCC+ S&P rating with negative outlook means every other risk (breach, competitive
      displacement, CEO transition) is amplified by the company's limited ability to raise fresh capital
      or refinance at non-distressed terms. The first-lien loans at ~66–68 cents and second-lien at
      ~36–39 cents signal market skepticism about full debt recovery.
    claimRefs: [CR001, CR002, CR003]

  - calloutType: risk
    title: The RansomHouse breach breaks the product trust narrative
    body: >-
      A cybersecurity vendor that suffers a confirmed source code breach faces a uniquely severe
      reputational penalty. Customers must now assess whether detection logic contained in the leaked
      code can be studied by adversaries to craft evasion techniques, directly undermining the product
      value proposition for 53,000+ enterprise and government customers.
    claimRefs: [CR014, CR015, CR016]

  - calloutType: assumption
    title: Revenue trend is the leading indicator for debt sustainability
    body: >-
      S&P's CCC+ affirmation cites declining revenues as the primary driver of the negative outlook.
      Revenue stabilization—not just cost control—is required for Magenta Buyer LLC to sustainably
      service its interest expense and avoid a covenant trigger that would force restructuring.
    claimRefs: [CR004, CR005, CR006]

