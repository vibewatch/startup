schemaVersion: "report-v2"
artifact: valuation
slug: trellix
runDate: "2026-06-23"
company:
  name: Trellix
chapter:
  number: 8
  title: Valuation
  summary: >-
    We rate Trellix research-more with low confidence, a critical risk rating, and an unknown
    valuation stance. The business protects 53,000+ enterprise and government customers with a
    recognized XDR platform, Gartner Magic Quadrant inclusion, and a growing AI automation story
    in Trellix Wise. But the PE-backed capital structure (Magenta Buyer LLC, CCC+ S&P rating, ~$4.3B
    in distressed debt, declining revenues) means equity value is heavily impaired by leverage, an
    exit valuation estimated well below the ~$5.2B acquisition cost, and no confirmed exit path. A
    confirmed May 2026 source code breach adds near-term uncertainty. Without access to audited
    financials, NRR, covenant data, or a disclosed exit price, any precise valuation is false
    precision; a diligence-first stance is required before any investment decision.

sections:
  - id: thesis-antithesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      The bull thesis for Trellix rests on three pillars. First, the company operates a recognized,
      broad-based cybersecurity platform serving 53,000+ enterprise and government customers across
      endpoint, email, network, and XDR layers, with deep government penetration via FedRAMP High and
      DoD IL5 certifications. Second, the XDR market in which Trellix competes is projected to grow
      from USD 7.92B in 2025 to USD 30.86B by 2030 (MarketsandMarkets CAGR 31.2%), providing a
      structural growth tailwind even for a vendor growing below market. Third, the Trellix Wise AI
      platform (winning six Global InfoSec Awards at RSA 2025) represents a genuine product investment
      in autonomous SOC automation that, if it gains enterprise traction, could improve gross margins
      and differentiate against Microsoft Defender's commoditized bundling. The Gartner Magic Quadrant
      2025 inclusion (one of only 15 vendors from 111 contenders) and the company's hybrid/air-gapped
      deployment strength position it distinctively in sectors where cloud-native-only XDR vendors
      cannot operate.
      The anti-thesis is structural and financial. Magenta Buyer LLC's CCC+ S&P rating (negative
      outlook, July 2025) on approximately USD 4.26B of leveraged debt trading at distressed levels
      means that even a modest improvement in operating performance may not translate to equity value.
      STG Partners acquired McAfee Enterprise and FireEye for approximately USD 5.2B combined in 2021;
      analyst exit valuations for Trellix alone range near USD 3B, implying a material sponsor loss.
      Revenues are declining (S&P cites this as the primary credit risk driver). The confirmed May
      2026 source code breach by RansomHouse uniquely damages a cybersecurity vendor's core trust
      proposition. Competition from CrowdStrike (USD 5.25B ARR, 18–19× NTM forward revenue) and Palo
      Alto Networks Cortex XDR (USD 9.2B revenue, 11–12× NTM) places Trellix in a structurally
      unfavorable competitive position against better-capitalized, cloud-native peers.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV002]
    figureRefs: [FV001]

  - id: recommendation
    title: Recommendation, Confidence, and Stance
    body: >-
      We issue a research-more recommendation with low confidence, a critical risk rating, and an
      unknown valuation stance. The low confidence rating reflects the near-complete absence of
      publicly available audited financial data: revenues are analyst estimates (~USD 1.1B), gross
      margins are unconfirmed, NRR is undisclosed, and the full debt covenant package is private.
      The critical risk rating reflects the CCC+ leveraged capital structure with declining revenues
      and a recent source code breach. The unknown valuation stance reflects that without an
      entry price, disclosed preference stack, or audited EBITDA, no supportable EV-to-revenue or
      EV-to-EBITDA multiple can be calculated. For context, public peers CrowdStrike and Palo Alto
      trade at 18–19× and 11–12× NTM revenue; a company with declining revenues, a distressed
      capital structure, and below-sector growth would attract a substantial discount—perhaps 2–4×
      revenue at best in a distress scenario. At USD 1.1B revenue and a 3× multiple, the enterprise
      value would be USD 3.3B; after subtracting USD 4.26B of debt, residual equity value could be
      negative on a net basis—meaning lenders, not equity holders, capture any proceeds. Research-more
      reflects that further diligence (obtaining audited financials, NRR, covenant data, and an
      explicit entry mechanism) could either unlock a distressed-debt opportunity or confirm a
      value trap. The recommendation is not a company quality judgment; it is a price, information,
      and capital-structure judgment.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV001]

  - id: financing-context
    title: Financing Context and Entry Discipline
    body: >-
      Trellix has no recent standalone equity financing; the Magenta Buyer LLC capital structure
      reflects the 2021 PE buyout financing of USD 4B (McAfee Enterprise) and USD 1.2B (FireEye
      product business). In 2023, Trellix raised USD 400M of new capital via a Liability Management
      Exercise (LME) that restructured debt maturities, reduced annual interest expense, and added
      a super-priority tranche. S&P rates the resultant tranches as follows: super-priority B+,
      first-out B, second-out CCC, third-out CCC-. The complexity of the capital stack means that
      any equity entry must account for full debt quantum before any residual equity value. For
      a distressed-debt approach, the first-lien loans (trading at ~66–68 cents) imply a potential
      recovery to par plus accrued interest if the company is sold or refinanced, with upside
      approximately 47–52% from current market prices—but only if revenues stabilize or grow. The
      Magenta Buyer LLC structure means any acquirer effectively buys the combined Trellix and Skyhigh
      Security portfolio; a carve-out of Trellix alone would require a more complex restructuring.
      STG's typical exit patterns include secondary buyouts, full sales to strategic buyers, and
      IPOs; as of June 2026, no exit process has been confirmed, and the company has not filed an
      S-1 or announced a banker mandate.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]

  - id: scenarios
    title: Bull, Base, and Bear Cases
    body: >-
      Our base case (40% weight) assumes revenues stabilize at approximately USD 1.0–1.1B annually
      through 2027, with modest EBITDA margin improvement from cost discipline but no NRR recovery
      sufficient to drive growth. Enterprise value on a 3–4× EV/revenue basis lands at USD 3.0–4.4B;
      after deducting the approximately USD 4.26B debt, equity value is near zero to modestly
      positive. First-lien debt recovers at or slightly below par. This scenario implies STG
      exits at a significant loss relative to the USD 5.2B acquisition cost. The bull case (25%
      weight) requires Trellix Wise to accelerate enterprise adoption, NRR to recover above 100%,
      and the RansomHouse breach to leave no lasting customer-retention damage. In this scenario
      revenues grow 8–10% annually to USD 1.3–1.4B by 2027, EBITDA margins expand toward 20%,
      and an exit at 5–6× EV/revenue generates USD 6.5–8.4B enterprise value—enough to satisfy
      the debt stack and deliver modest equity returns. The bear case (35% weight) assumes revenue
      contraction accelerates to 5–8% annually following the breach, competitive displacement by
      Microsoft Defender and CrowdStrike drives churn, and the capital structure forces a covenant
      waiver or restructuring that impairs lender recovery. In this scenario first-lien lenders
      recover 60–75 cents on the dollar; second-lien lenders 20–40 cents; equity is worthless.
      The bear case has elevated probability given the trend evidence: S&P's CCC+ negative outlook
      was issued in July 2025 and the May 2026 breach adds incremental pressure.
    claimRefs: [CV017, CV018, CV019, CV020, CV021]
    tableRefs: [TV003]
    figureRefs: [FV003]

  - id: comparables
    title: Comparable Valuation Set
    body: >-
      Public XDR/EPP comparables trade at substantial premiums to where Trellix would likely be
      valued. CrowdStrike (CRWD), the closest public analog for cloud-native XDR, reported USD 5.25B
      ARR (+24% YoY) as of January 2026 and trades at approximately 18–19× NTM forward revenue—a
      premium justified by ARR growth, 79% subscription gross margins, and platform expansion.
      Palo Alto Networks Cortex XDR trades at 11–12× NTM revenue with USD 9.2B FY2025 revenue and
      GAAP profitability. SentinelOne trades at 9–11× NTM revenue on USD 1B ARR and improving
      margins. For a private company with declining revenues, a distressed capital structure, and
      no disclosed gross margin, applying sector-median multiples is inappropriate. A comparable
      set of PE-backed or distressed cybersecurity companies (like the pre-IPO Darktrace or pre-
      turnaround McAfee Enterprise) suggests 1.5–3× revenue for below-growth, high-leverage assets.
      The USD 3.3B mid-point at 3× Trellix's estimated USD 1.1B revenue sits entirely within the
      debt stack, leaving no unambiguous equity value without revenue recovery. M&A transactions
      in the cybersecurity space in 2026 have closed at 18–32× revenue for "must-own" platform
      leaders (Google/Wiz at 32×, top-tier M&A) and 5–8× for strong but non-leader assets—Trellix's
      position in that spectrum is closer to 2–4× given its current financial profile.
    claimRefs: [CV022, CV023, CV024, CV025, CV026]
    tableRefs: [TV004]
    figureRefs: [FV002]

  - id: exit-diligence
    title: Exit Readiness and Final Diligence Asks
    body: >-
      Trellix's exit readiness is constrained by three structural factors: the CCC+ capital structure
      that requires lender consent for most M&A transactions, the absence of publicly audited
      financials that would be required for any IPO or large strategic sale process, and the May 2026
      RansomHouse breach that creates unquantified regulatory and litigation tail risk. An IPO is
      not being prepared as of the run date. A strategic sale to a larger cybersecurity vendor
      (Cisco, IBM Security, or a mega-PE) is the most plausible near-term exit path, but would need
      to be structured to handle the debt quantum. A secondary PE buyout at current distressed-debt
      prices is theoretically possible but would require both lender agreement and a buyer willing
      to underwrite revenue stabilization. The most actionable diligence asks for any investor
      considering either equity or distressed-debt entry are: (1) audited FY2025 and H1 2026
      financial statements with EBITDA bridge; (2) NRR and logo churn by segment; (3) covenant
      compliance certificate and a full copy of the debt agreement; (4) May 2026 breach forensic
      final report and breach notification status in all jurisdictions; (5) Trellix Wise enterprise
      adoption data (pipeline, bookings, and gross margin by product line). Without these five
      items, no investment recommendation can be upgraded beyond research-more.
    claimRefs: [CV027, CV028, CV029, CV030, CV031]
    tableRefs: [TV005, TV006]
    figureRefs: [FV004]

