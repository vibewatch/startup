  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financials
      missingEvidence: >-
        Audited FY2025 and H1 2026 financial statements for Magenta Buyer LLC / Trellix including
        revenue breakdown by segment, gross margin, EBITDA, and free cash flow.
      whyItMatters: >-
        Without audited financials, revenue estimates (~USD 1.1B) cannot be verified, margin
        assumptions are unconfirmed, and the S&P CCC+ thesis cannot be validated or challenged;
        this is the single most important gap for any underwriting decision.
      diligencePath: >-
        Request financial statements and EBITDA bridge from Trellix / STG as part of any formal
        investment process.
      relatedQuestionRefs: [QV009, QV026]

    - type: private-evidence-only
      severity: blocking
      topic: revenue-retention
      missingEvidence: >-
        Net revenue retention (NRR) and logo churn rates by customer segment (government, commercial
        enterprise) for the last four quarters.
      whyItMatters: >-
        NRR is the decisive metric for determining whether revenue decline is structural (attrition)
        or cyclical; without it, the base vs. bear case probability assignment is highly uncertain.
      diligencePath: >-
        Request NRR data from Trellix management; triangulate with top VAR/MSSP channel checks.
      relatedQuestionRefs: [QV027]

    - type: missing-source
      severity: material
      topic: product-revenue
      missingEvidence: >-
        Trellix Wise enterprise bookings, pipeline conversion rate, and gross margin by product—
        essential to assess whether AI platform is a real revenue driver or pre-commercial.
      whyItMatters: >-
        If Wise is converting enterprise pipeline to bookings, it could offset commercial segment
        churn and support the bull case; without this data, the bull case probability is speculative.
      diligencePath: >-
        Request Wise-specific bookings and pipeline data from Trellix commercial team; channel checks
        with top MSSPs deploying Wise in managed service offerings.
      relatedQuestionRefs: [QV011]

    - type: private-evidence-only
      severity: material
      topic: corporate-structure
      missingEvidence: >-
        Full allocation of revenue and EBITDA between Trellix and Skyhigh Security within Magenta
        Buyer LLC, and any intra-group transfer pricing or cost-sharing agreements.
      whyItMatters: >-
        A combined exit vs. carve-out exit have very different valuation implications; the
        Trellix-only value cannot be determined without the segment split.
      diligencePath: >-
        Request segment financial statements in any formal diligence process.
      relatedQuestionRefs: [QV029]
      relatedTableRefs: [TV004]

    - type: missing-source
      severity: minor
      topic: gross-margin
      missingEvidence: >-
        Trellix gross margin by product line (endpoint, email, XDR, Wise AI) for FY2025 and H1 2026;
        no disclosed data from the company.
      whyItMatters: >-
        Software vs. services gross margin mix determines the defensible multiple; a 70%+ gross
        margin profile would support higher multiples than a services-heavy 50% profile.
      diligencePath: >-
        Request gross margin by product from Trellix CFO; channel checks with resellers on deal
        economics.
      relatedQuestionRefs: [QV026]

