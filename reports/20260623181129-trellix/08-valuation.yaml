callouts:
  - calloutType: recommendation
    title: Research-more is not a pass — it is a diligence mandate
    body: >-
      Trellix is a real enterprise cybersecurity platform with genuine strengths. The research-more
      recommendation reflects a fundamental information deficit: without audited financials, NRR,
      covenant data, and the full breach forensic report, no investment recommendation can be
      responsibly upgraded. The distressed-debt angle (first-lien at ~66–68 cents) is the most
      analytically supportable entry if revenue stabilizes; equity is a low-probability bet.
    claimRefs: [CV007, CV008, CV011, CV031]

  - calloutType: risk
    title: The debt quantum is the equity value ceiling
    body: >-
      At estimated revenues of USD 1.1B, any EV multiple below approximately 3.9× leaves the entire
      enterprise value below the approximately USD 4.26B debt outstanding. Equity holders receive
      nothing. Only in the bull scenario (5–6× EV/revenue on growing revenues) does equity become
      valuable. This is not a normal PE-backed software company valuation; it is closer to a
      distressed restructuring scenario.
    claimRefs: [CV001, CV013, CV017, CV018, CV019]

  - calloutType: risk
    title: An S&P CCC+ rating on a cybersecurity vendor is an adverse investment signal
    body: >-
      S&P's July 2025 affirmation of CCC+ with negative outlook on Magenta Buyer LLC is an
      independent, arms-length assessment that the capital structure is unsustainable in the long
      term without revenue recovery. For an investor evaluating equity or senior debt, this rating
      is the most credible single adverse signal available and should anchor the downside scenario.
    claimRefs: [CV001, CV004, CV013, CV014]

