evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Public board composition, investor control rights, and governance documents are not disclosed in the reviewed
      source set.
    whyItMatters: >-
      Beacon’s strategy depends on rapid capital deployment and founder alignment, so board control and protective
      rights matter for execution and downside analysis.
    diligencePath: Request an updated cap-table and board observer/seat summary from management or an investor reference.
    relatedQuestionRefs:
      - QO008
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: >-
      The precise Ontario or federal legal entity record for Beacon Software was not identified directly from public
      registries during this run.
    whyItMatters: >-
      Incorporation details help confirm founding chronology, directors, and any operating entities relevant to
      acquisitions across Canada and the United States.
    diligencePath: >-
      Run a paid or authenticated search in the Ontario Business Registry and Corporations Canada using the exact legal
      entity name from company counsel.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: portfolio-scale
    missingEvidence: Beacon has not published a complete list of acquired or partnered businesses or a precise current company count.
    whyItMatters: >-
      A roll-up thesis is hard to assess without knowing which verticals, customer bases, and integration burdens are
      actually inside the portfolio.
    diligencePath: >-
      Request a portfolio list with acquisition dates, sectors, and current operating managers; reconcile it against M&A
      announcements and customer sites.
    relatedQuestionRefs:
      - QO017
      - QO018
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: Public sources conflict between a 2024 founding/launch and a description that implied a 2023 origin.
    whyItMatters: >-
      The exact start date changes how investors interpret acquisition velocity, time-to-unicorn, and maturity of the
      internal operating platform.
    diligencePath: Confirm incorporation date and first close date directly with the company or through the legal entity record.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: metrics-disclosure
    missingEvidence: >-
      Beacon has not publicly disclosed exact revenue, headcount, customer count, concentration metrics, or the fully
      sourced valuation mechanics behind the June 2026 round.
    whyItMatters: >-
      The missing metrics limit any attempt to benchmark current operating leverage or underwrite the speed of the
      2025-2026 valuation step-up.
    diligencePath: >-
      Request current ARR, revenue growth, gross margin, headcount, top-customer concentration, and the detailed
      post-Series-C cap-table from management or investors.
    relatedQuestionRefs:
      - QO015
      - QO020
      - QO023
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      A current list of Beacon-owned companies with vertical, revenue band, geography, and customer concentration that
      would allow a defensible SAM/SOM cut.
    whyItMatters: >-
      Without a disclosed portfolio and pipeline screen, broad market TAM risks overstating what Beacon can
      realistically buy and improve.
    diligencePath: >-
      Request the current portfolio list, acquisition funnel, and target-screening rubric by ARR, profitability,
      geography, and workflow category.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: portfolio-outcomes
    missingEvidence: >-
      Post-acquisition product, retention, NRR, churn, support, and release-velocity data for Beacon portfolio
      companies.
    whyItMatters: >-
      The thesis depends on AI-enabled product improvement after acquisition, but public sources do not show realized
      operating outcomes at the portfolio level.
    diligencePath: >-
      Request portfolio KPI cohorts before and after acquisition, including churn, release cadence, EBITDA contribution,
      and customer references.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: pipeline-pricing-and-geography
    missingEvidence: Public disclosure on acquisition multiples, target geography mix, and current pipeline depth.
    whyItMatters: >-
      The market can be large while the available and attractively priced target pool remains much smaller; geography
      mix also determines how Canadian ecosystem tailwinds matter.
    diligencePath: >-
      Request pipeline coverage by country and vertical plus the last 10 signed or evaluated deal multiples and seller
      profiles.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: acquisition-pricing
    missingEvidence: >-
      Executed purchase multiples, earn-out structures, and seller economics for Beacon and the closest permanent-home
      peers.
    whyItMatters: >-
      Without transaction-level pricing data it is hard to know whether Beacon wins on economics, speed, or story, and
      hard to underwrite whether its capital base supports discipline.
    diligencePath: >-
      Request anonymized LOIs or closed-deal case studies from Beacon plus comparable founder references from Valsoft,
      Banyan, or bankers active in niche software M&A.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: portfolio-outcomes
    missingEvidence: >-
      Cohort-level retention, product-release velocity, margin, and customer-outcome data for companies Beacon has
      already modernized with AI.
    whyItMatters: >-
      Beacon’s differentiation depends on repeatable operational proof, not only on financing momentum or investor
      testimonials.
    diligencePath: >-
      Request portfolio scorecards by acquisition cohort showing pre/post product cadence, churn, upsell, margin, and
      engineering productivity changes.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: sourcing-engine
    missingEvidence: A breakdown of proprietary versus banker-run or auctioned deals in Beacon’s current acquisition funnel.
    whyItMatters: >-
      If sourcing is mostly intermediated, then larger capital pools and established consolidators may be able to erode
      Beacon’s seller-side differentiation faster than the public narrative suggests.
    diligencePath: >-
      Ask management to provide pipeline attribution by channel, close-rate by channel, and win-loss examples against
      Constellation, Valsoft, Banyan, and sponsor buyers.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: consolidated-revenue
    missingEvidence: Consolidated revenue, ARR, and growth bridge by quarter and by major revenue line.
    whyItMatters: >-
      Without a denominator, the chapter cannot judge valuation efficiency, growth quality, or the weight of recurring
      revenue versus services and payments.
    diligencePath: >-
      Request the latest board package or monthly management accounts with revenue by subsidiary cluster, ARR bridge,
      and year-over-year growth.
    relatedQuestionRefs:
      - QI014
      - QI024
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, liquidity sources, debt schedule, and management runway case.
    whyItMatters: >-
      Capital adequacy is the core forward-looking financial risk, but public evidence only proves fundraising access
      rather than current liquidity or burn.
    diligencePath: >-
      Request the latest balance sheet, trailing six-month cash flow statement, covenant package, and base / downside
      runway model.
    relatedQuestionRefs:
      - QI017
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR, churn, and acquisition purchase-multiple or integration-lift KPIs.
    whyItMatters: These are the metrics needed to separate a narrative AI roll-up from a durable recurring-software compounder.
    diligencePath: >-
      Request a KPI pack by product family and acquisition cohort, including customer retention, net dollar retention,
      and time-to-value after integration.
    relatedQuestionRefs:
      - QI024
  - type: private-evidence-only
    severity: material
    topic: central-ai-architecture
    missingEvidence: >-
      Internal architecture docs naming model vendors, routing, tenancy boundaries, evaluation metrics, and rollback
      design for Beacon’s shared AI layer.
    whyItMatters: >-
      Without this, investors cannot tell whether the platform is a robust common service or mostly an operating
      narrative layered over disconnected products.
    diligencePath: >-
      Request architecture review materials, environment diagrams, model governance SOPs, and incident-response runbooks
      from the platform team.
    relatedQuestionRefs:
      - QE017
      - QE020
      - QE025
    relatedTableRefs:
      - TE003
      - TE004
  - type: private-evidence-only
    severity: material
    topic: technical-diligence-playbook
    missingEvidence: >-
      Technical diligence scorecards, migration checklists, data-cutover plans, rollback criteria, and portfolio KPI
      baselines used during acquisitions.
    whyItMatters: >-
      The economic thesis depends on repeated, low-friction integrations; public claims about speed and AI are not
      enough to prove that playbook quality.
    diligencePath: >-
      Review the last three acquisition integration packs and compare planned versus actual migration, uptime, and
      product-velocity outcomes.
    relatedQuestionRefs:
      - QE002
      - QE017
      - QE025
    relatedTableRefs:
      - TE003
      - TE005
