  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: central-ai-architecture
    missingEvidence: Internal architecture docs naming model vendors, routing, tenancy boundaries, evaluation metrics, and rollback design for Beacon’s shared AI layer.
    whyItMatters: Without this, investors cannot tell whether the platform is a robust common service or mostly an operating narrative layered over disconnected products.
    diligencePath: Request architecture review materials, environment diagrams, model governance SOPs, and incident-response runbooks from the platform team.
    relatedQuestionRefs:
    - QE017
    - QE020
    - QE025
    relatedTableRefs:
    - TE003
    - TE004
  - type: private-evidence-only
    severity: material
    topic: technical-diligence-playbook
    missingEvidence: Technical diligence scorecards, migration checklists, data-cutover plans, rollback criteria, and portfolio KPI baselines used during acquisitions.
    whyItMatters: The economic thesis depends on repeated, low-friction integrations; public claims about speed and AI are not enough to prove that playbook quality.
    diligencePath: Review the last three acquisition integration packs and compare planned versus actual migration, uptime, and product-velocity outcomes.
    relatedQuestionRefs:
    - QE002
    - QE017
    - QE025
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: material
    topic: trust-security-disclosure
    missingEvidence: A Beacon trust center or equivalent public artifact describing security, privacy, model governance, and AI deployment controls.
    whyItMatters: Portfolio-level privacy or compliance hints do not substitute for a central-stack control narrative when Beacon markets an AI-native operating platform.
    diligencePath: Ask management for SOC reports, security architecture, model governance policies, and any control mapping to NIST or secure-AI frameworks.
