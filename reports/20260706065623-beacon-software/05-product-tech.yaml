  - - PowerUp Sports suite
    - Club admins, parents, coaches, officials
    - Live production workflow software with mobile and support surfaces
    - Deep operational coverage across registration, scheduling, officials, and communications
    - Payments transparency is weaker than registration and scheduling transparency
  - - College Kickstart
    - Students, counselors, school leadership
    - Mature multi-surface data product spanning student, counselor, and board workflows
    - Strong external-data and enrichment layer rather than just transactional SaaS
    - No public AI-stack or data-governance detail beyond workflow claims
  - - VieFUND Back Office
    - Canadian investment-dealer back offices and advisors
    - Broad regulated workflow coverage with visible legacy infrastructure assumptions
    - Combines dealer operations, KYC, compliance reporting, and third-party exports
    - Legacy server requirements imply heavier modernization and change-control work
  - - Shared AI / modernization playbook
    - Beacon engineering and operations teams
