- id: portfolio-workflows
  title: Portfolio product surfaces and customer workflows
  body: >-
    The clearest public evidence of what Beacon is actually modernizing comes from the portfolio products themselves. Soccer software is the most legible case: Pulse 2.0 says Beacon is combining E2E Soccer and PowerUp Sports into a full-stack platform, while the product pages show what that means at workflow level—registration, waivers, facilities, scheduling, standings, referee assignment, discipline, payroll, mobile communications, and ongoing operator support. E2E explicitly says its modules can run standalone or as an integrated end-to-end suite, which matters because Beacon can unify adjacent workflows without forcing an immediate brand or product migration. Outside sports, College Kickstart shows a different pattern: data-rich admissions planning for students and counselors plus a board-reporting workflow that ingests CSV exports from third-party school systems and returns enriched reports in two to three business days. VieFUND adds yet another product shape, exposing regulated dealer
    back-office workflows, KYC, order processing, compliance reporting, and Salesforce export. Together these assets suggest Beacon’s product surface is not one neat SaaS category but a portfolio of mission-critical operating workflows that share modernization needs while differing sharply in user types, data models, and regulatory context.
