  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-coverage
      missingEvidence: A complete parent-level register of Beacon litigation, claims history, policy exceptions, and non-public compliance incidents across all portfolio companies.
      whyItMatters: The public risk register only covers the legal and regulatory exposures visible in reviewed pages and public enforcement materials, so hidden matters could materially change severity rankings.
      diligencePath: Request a litigation and regulatory schedule from Beacon plus counsel letters covering the parent and each acquired software business.
      relatedQuestionRefs:
        - QR026
        - QR030
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: integration-scorecards
      missingEvidence: Post-close integration scorecards, KPI baselines, rollout timelines, and milestone dashboards for Beacon’s operating platform.
      whyItMatters: Without scorecards, investors cannot distinguish between a good narrative and a repeatable integration engine.
      diligencePath: Request board or operating-review materials showing pre-close thesis, post-close actions, KPI deltas, and remediation plans for at least three acquisitions.
      relatedQuestionRefs:
        - QR026
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Holdco-level retention, gross churn, NRR, customer concentration, and cross-portfolio revenue exposure data.
      whyItMatters: Roll-up durability cannot be validated from public sources if recurring revenue quality, expansion, and concentration remain undisclosed.
      diligencePath: Request historical cohort files, customer concentration schedules, and product-level renewal data for each material portfolio business.
      relatedQuestionRefs:
        - QR027
        - QR029
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: acquisition-pricing-and-financing
      missingEvidence: Deal-level acquisition multiples, debt terms, earn-outs, and underwriting guardrails used by Beacon to keep returns above its hurdle.
      whyItMatters: Compressed public software multiples and active sponsor competition increase the risk that Beacon pays too much or finances deals on terms that weaken downside protection.
      diligencePath: Review recent deal memos, lender terms, and post-close performance against original underwriting assumptions.
      relatedQuestionRefs:
        - QR028
      relatedTableRefs:
        - TR005
    - type: missing-source
      severity: material
      topic: central-security-and-ai-governance
      missingEvidence: Parent-level security attestations, AI governance policies, model-evaluation routines, incident response standards, or third-party audits for the shared operating platform.
      whyItMatters: Beacon’s thesis assumes cross-portfolio AI leverage, but public evidence does not show how the parent governs data boundaries, safety, privacy, or rollback controls.
      diligencePath: Request parent security architecture diagrams, policy manuals, vendor inventories, red-team results, and AI governance committee materials.
      relatedQuestionRefs:
        - QR030
      relatedTableRefs:
        - TR002
    - type: missing-source
      severity: minor
      topic: portfolio-control-surface
      missingEvidence: Parent-level privacy, security, and disclosure policies that cover every portfolio company instead of product-specific pages only.
      whyItMatters: Product-level policies confirm real compliance surfaces but do not prove that Beacon has a consistent control layer across the portfolio.
      diligencePath: Ask Beacon for the parent policy stack, common DPA language, and cross-portfolio control requirements imposed on acquisitions.
      relatedQuestionRefs:
        - QR026
        - QR030
