  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - AI ROI miss
        - Public or diligence-only KPI updates show pilots reaching production but not delivering measurable lift
        - Two consecutive major AI initiatives fail to beat baseline cost, speed, or revenue goals
        - Pause underwriting of AI premium and revalue Beacon as a conventional software holding company
      - - Integration backlog outruns acquisition pace
        - Central teams cannot evidence completed post-close milestones across recent deals
        - Acquisition pace remains near one per week while documented post-close backlog grows for two quarters
        - Require slower pace, more integration hires, or a lower valuation before investing
      - - Acquisition math weakens under market pressure
        - Software comps remain compressed while target pricing stays elevated due to sponsor competition
        - New deals require underwriting above a reasonable downside multiple or below hurdle IRR
        - Treat capital-allocation discipline as broken and reduce conviction materially
      - - Roll-up scrutiny intensifies
        - Regulators expand enforcement or ask for information in software or adjacent workflow markets
        - Any Beacon transaction draws second requests, investigations, or market-concentration complaints
        - Increase legal reserve assumptions and reassess the scalability of the serial-acquisition model
      - - Sensitive-data control failure
        - A portfolio business reports a security, privacy, or compliance incident tied to shared systems or parent processes
        - Material incident, regulator inquiry, or breach notice at a sensitive asset such as College Kickstart or VieFUND
        - Assume trust-layer immaturity, raise residual risk, and require remediation evidence before proceeding
      - - Narrative outpaces disclosure
        - Management cannot provide integration scorecards, concentration files, or parent governance artifacts in diligence
        - Missing core diligence items persist into advanced diligence or come only with weak caveats
        - Treat disclosure risk as structural and avoid underwriting management narrative at face value
    notes: Each kill criterion is designed to be monitorable with either public signals or standard private diligence requests. The goal is to catch thesis drift before valuation marks or customer disruption make the issue obvious.
