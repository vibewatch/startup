chapter:
  number: 6
  title: Customers
  summary: 'Beacon''s strongest public customer proof sits inside the acquired workflow-software products rather than at the
    holdco level: sports clubs and leagues are directly observable on PowerUp Sports and E2E Soccer portals, College Kickstart
    has named school and counselor references, and Let''s Camp publishes campground case studies plus independent campground
    reviews. Those proofs show real deployment breadth across sports, education, campgrounds, dealer back-office operations,
    and reseller-MAP enforcement, but they do not disclose Beacon-level churn, NRR, GRR, or customer concentration. The result
    is a customer story with credible vertical fit and workflow-based switching-cost signals, but uneven named-logo quality
    and material retention-disclosure gaps.'
sections:
- id: portfolio-customer-map-and-adoption-proxies
  title: Portfolio customer map and adoption proxies
  body: 'Beacon''s own February 2026 OpenAI announcement names four portfolio products directly -- College Kickstart, Let''s
    Camp, PowerUp Sports, and MAP Policy Partners -- while the April 2026 E2E Soccer acquisition shows Beacon explicitly combining
    E2E with PowerUp into one soccer stack without changing customer contracts or service levels. That makes the public customer
    map clear even if Beacon still withholds holdco-level customer counts. Sports is the most legible vertical: PowerUp sells
    to clubs, leagues, and governing bodies, and E2E says its customers range from small clubs to provincial associations.
    Education is the next-clearest vertical through College Kickstart''s counselor-centered planning workflow. Let''s Camp
    serves campground owners and campers in a two-sided booking model. VieFUND serves Canadian investment dealers, while MAP
    Policy Partners sells into brand and reseller-channel teams trying to enforce pricing discipline. Public adoption proxies
    exist, but they are product-specific rather than revenue-weighted: E2E discloses leagues, teams, and games; College Kickstart
    discloses institutions tracked and school program participation; and review platforms show nontrivial review counts for
    PowerUp and Let''s Camp. The evidence therefore supports real product deployment across multiple verticals, but not a
    consolidated Beacon customer-count narrative.'
