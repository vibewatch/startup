  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-disclosure
    missingEvidence: Product-level and Beacon-level NRR, GRR, churn, renewal-rate, and cohort-retention data by acquired product.
    whyItMatters: Without quantitative durability data, the chapter can only infer stickiness from workflow depth and anecdotal
      reviews, which is weaker than cohort evidence.
    diligencePath: Request product-level retention dashboards, renewal cohorts, churn reasons, and any customer-success board
      reporting from Beacon management.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer revenue share, top-10 customer concentration, vertical revenue mix, and customer concentration
      by acquired product.
    whyItMatters: Public customer logos do not reveal revenue dependence. A small number of large accounts could still drive
      portfolio economics even if the visible proof looks diversified.
    diligencePath: Request top-customer mix by product, largest-account ARR, logo retention by revenue decile, and any lender
      or board concentration reporting.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Comprehensive named customer lists or referenceable customer calls for VieFUND, MAP Policy Partners,
      and the full installed base behind the other products.
    whyItMatters: The named-customer proof table is necessarily partial. Stronger underwriting needs either customer-operated
      references or independently reachable logos, especially for the finance and MAP products.
    diligencePath: Ask Beacon for product-by-product customer references, reference-call permissions, and any public or private
      logo lists segmented by product.
    relatedTableRefs:
    - TU003
acknowledgedWarnings:
- dimension: figureType
  reason: No reviewed public source disclosed time-bucket retention percentages for any Beacon portfolio product, so rendering
    a cohort figure would have required fabrication rather than reporting.
