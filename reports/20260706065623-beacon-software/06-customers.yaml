- id: named-customer-proof-direct-vs-company-claimed
  title: 'Named customer proof: strongest in sports, mixed in education and camping, thin in finance and MAP'
  body: 'The highest-quality proof in this chapter is direct deployment evidence on customer-branded pages. West Ottawa Soccer
    Club, Calgary Foothills Soccer Club, North Simcoe Soccer Club, and Saint John Soccer Club all show live PowerUp registration
    or PowerUp Connect surfaces, while Ontario Soccer League shows active schedules on E2E. Those are stronger than a logo
    wall because they show the software in use for registrations, calendars, rosters, or league operations. College Kickstart
    has a mixed proof set: its own homepage names schools and counseling practices such as The Hewitt School, Horace Mann
    School, Orange Lutheran High School, Shady Side Academy, Baldwin School, and Upward College Planning, but those are still
    vendor-published references; the stronger direct evidence is Carondelet High School''s own 2026 Kickstart program page
    and an independent consultant blog stating that College Kickstart is used for all student clients. Let''s Camp follows
    a similar pattern: its own case-study hub names Big Bend Conservation Area, Sherwood Forest Golf and Country Club, and
    Emerald Lake Regional Park, while Capterra independently names Avoca Birches Campground as a user since 2021. By contrast,
    VieFUND and MAP Policy Partners clearly describe their target customer types, but the public pages reviewed here do not
    surface named customer logos that can be independently checked.'
