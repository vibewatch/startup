- id: retention-switching-costs-and-evidence-limits
  title: Retention, switching-cost signals, and the hard evidence limits around churn and concentration
  body: 'Public retention evidence is structural rather than metric-based. PowerUp and E2E sit directly inside registration,
    roster, scheduling, referee, discipline, and communication workflows, which raises switching costs because clubs and leagues
    would need to move multiple interconnected functions at once. The PowerUp review corpus strengthens that story with long-tenure
    language, including a nine-year user who says they would never change systems. College Kickstart is sticky in a different
    way: counselor ownership modes, scenario analysis, historical activity, PDFs, and school-specific local context all embed
    it into annual planning rhythms, though a College Confidential thread provides the chapter''s clearest adverse note by
    arguing that its grading can be too conservative for some schools. Let''s Camp likewise embeds into bookings, payments,
    refunds, check-ins, and reporting, and reviews show both multi-year use and modest service/reporting complaints. VieFUND
    and MAP Policy Partners look operationally sticky because they touch compliance, trading, evidence capture, and seller
    enforcement, but public named customer proof is thinner. Critically, no reviewed source discloses Beacon-level or product-level
    NRR, GRR, churn, renewal rate, top-customer share, or revenue concentration. That means public evidence can support a
    switching-cost hypothesis, but not a quantified durability or concentration conclusion. The underwriting burden therefore
    still shifts to private cohort data, reference calls, and concentration schedules.'
