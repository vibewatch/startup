tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Beacon Software
    - AI-first permanent acquirer
    - '>$550M disclosed capital; >30 businesses bought; ~weekly pace'
    - Founder-led everyday-economy and niche vertical software, often under $20M ARR
    - Permanent-home pitch plus explicit AI modernization and shared operating layer
    - Short public operating record and limited cohort-level proof of repeatable outcomes
  - - Constellation Software
    - Public VMS compounder
    - 2025 revenue $11.623B; 2025 acquisition consideration $1.579B; TSX-listed
    - Mission-critical vertical-market software across specialized industries
    - Decades-long buy-and-hold discipline, public disclosure, and autonomous operating groups
    - Less visibly AI-first and less explicitly tailored to founder-legacy branding
  - - Vista Equity Partners
    - Software-focused private-equity and private-credit sponsor
    - $103B AUM; 90+ portfolio companies; 650+ PE transactions
    - Enterprise software across the lifecycle
    - Large-scale operating platform, AI factory, and portfolio ecosystem
    - Public framing still runs from acquisition to exit rather than forever-hold stewardship
  - - Thoma Bravo
    - Software-focused buyout platform
    - $172B+ AUM; ~80 current portfolio companies; ~590 transactions
    - Enterprise software, cybersecurity, CX, and selected vertical SaaS
    - Hyperscaler partnerships, category-platform building, and flexible deal structures
    - No explicit permanent-ownership promise and strong fund-structure orientation
  - - Valsoft Corporation
    - Permanent-hold VMS consolidator
    - 150+ companies across 20+ industries; 25 acquisitions reported for 2024
    - Mission-critical vertical software globally
    - Long-term ownership, decentralized operating groups, and shared AI capabilities
    - AI appears supportive but less central to public differentiation than at Beacon
  - - Banyan Software
    - Permanent-home software acquirer
    - 100+ companies acquired; zero sold; €100M France envelope announced for 2026
    - Profitable software companies, often $2M+ revenue with recurring revenue and niche leadership
    - Never-sell promise, high seller referenceability, and AI-enabled growth ops
    - Less public evidence than Constellation on scale and less public capital depth than megasponsors
  - - Status quo / internal build
    - Substitute rather than buyer
    - No transaction required; existing ownership and internal resources only
    - Founders who keep operating their current software business
    - Avoids sale friction and preserves full control
    - Often lacks the capital, AI talent, and operating bandwidth Beacon is selling
  notes: Selected landscape rows cover the main buyer archetypes and the status-quo substitute relevant to Beacon’s seller audience; they are intentionally not an exhaustive list of every software consolidator.
  enumerationScope:
    coverage: partial
    basis: 'Rows cover the principal buyer archetypes emphasized by the chapter brief: canonical public comp, sponsor benchmarks, permanent-home peers, and the status-quo substitute facing founder-led vertical software sellers in 2026.'
