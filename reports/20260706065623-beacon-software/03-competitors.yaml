- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Price / unit / contract model
  - Included capabilities
  - Public unknowns
  - Implication
  rows:
  - - Beacon Software
    - No public list price; founder-specific deal terms; own-capital process; 60-day LOI-to-close target; indefinite hold
    - AI modernization, engineers, automation, and shared operating support
    - Purchase multiples, earn-out math, and realized seller outcomes are not public
    - Competes as a succession-and-modernization package rather than as a transparent auction price benchmark
  - - Constellation Software
    - No public revenue floor; recurring-revenue preference; indefinite ownership inside decentralized structure
    - Capital allocation discipline, autonomy, and operating-group support
    - Exact terms by deal and seller role economics remain private
    - Best fit for founders who want a proven long-term home more than a visibly AI-centric narrative
  - - Vista Equity Partners
    - Fund-based acquisition model spanning Endeavor through Evergreen; explicit acquisition-to-exit process
    - Large-scale value creation, AI platform, consulting bench, and community programs
    - Asset-level seller terms and exit timing vary by fund and are not public
    - Stronger capital and operating depth, but less clearly positioned as a forever-home buyer
  - - Thoma Bravo
    - Control and minority ownership structures both possible; platform combinations and strategic partnerships visible
    - Google Cloud access, engineering support, AI commercialization, and category consolidation
    - Founder economics, hold period, and portfolio-specific integration terms remain private
    - Attractive where scale and distribution matter more than indefinite stewardship
  - - Valsoft Corporation
    - Long-term ownership with no predefined horizon; growth-equity-backed acquisition engine
    - Operating groups, shared AI capabilities, capital, and support while keeping autonomy
    - Exact multiples and post-close economics are private
    - Close seller-side substitute for Beacon on permanence, but with a less explicitly AI-first brand
  - - Banyan Software
    - Flexible stay-or-exit structure; valuation range can come quickly; permanent vehicle modeled after a family office
    - AI, talent, sales and marketing, payments, product, finance, cybersecurity, legal, and peer network support
    - Exact current multiples and pace-adjusted underwriting terms are private
    - Very strong alternative for founders prioritizing legacy, autonomy, and never-sell certainty
  notes: Because public list pricing is unavailable for software acquirers, the table compares founder-facing transaction package, ownership horizon, and post-close support instead of software subscription prices.
