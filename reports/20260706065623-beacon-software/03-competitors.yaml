company:
  name: Beacon Software
chapter:
  number: 3
  title: Competitors
  summary: Constellation Software is the clearest canonical comparable because it offers public proof that buy-and-hold vertical software compounding can scale into an $11.6B-revenue enterprise. Valsoft and Banyan are closer to Beacon on permanent-home seller messaging, while Vista and Thoma Bravo are closer on capital scale, AI operating leverage, and distribution. Beacon’s real differentiation is the combination of AI-first modernization, sub-$20M ARR founder-led targets, and permanent-ownership framing, but public evidence still proves the narrative more strongly than the repeatability of outcomes.
sections:
- id: constellation-as-canonical-comparable
  title: Constellation as the canonical public comparable
  body: 'If an investor wants the cleanest public benchmark for Beacon’s model, the answer is Constellation Software rather than another venture-backed roll-up. Constellation has already shown, in public filings and operating materials, that mission-critical vertical software can be acquired, left relatively autonomous, and compounded through disciplined capital allocation for decades. Its acquisition criteria also line up with the broad shape of Beacon’s target universe: proprietary B2B software, recurring revenue, low attrition, and defensible niche positions. The scale gap is enormous. Beacon is still being described through funding rounds, investor essays, and a fast but young acquisition cadence; Constellation is disclosing more than $11.6 billion of annual revenue, more than $1.5 billion of acquisitions closed in 2025, and additional committed capital after year-end.


    That is why Constellation is the canonical comparable, not because Beacon is already equivalent to it. Beacon’s public pitch adds a stronger founder-facing permanence narrative and much more overt AI language than Constellation uses. But on the most important underwriting question—whether vertical-software buy-and-hold can actually work at scale—Constellation is the nearest proven precedent. It also highlights the bar Beacon eventually has to clear: durable capital allocation, decentralized execution, and a long enough public record that the model is evaluated on realized outcomes rather than on fundraising momentum or product rhetoric alone.'
