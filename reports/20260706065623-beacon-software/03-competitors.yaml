  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: acquisition-pricing
    missingEvidence: Executed purchase multiples, earn-out structures, and seller economics for Beacon and the closest permanent-home peers.
    whyItMatters: Without transaction-level pricing data it is hard to know whether Beacon wins on economics, speed, or story, and hard to underwrite whether its capital base supports discipline.
    diligencePath: Request anonymized LOIs or closed-deal case studies from Beacon plus comparable founder references from Valsoft, Banyan, or bankers active in niche software M&A.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: portfolio-outcomes
    missingEvidence: Cohort-level retention, product-release velocity, margin, and customer-outcome data for companies Beacon has already modernized with AI.
    whyItMatters: Beacon’s differentiation depends on repeatable operational proof, not only on financing momentum or investor testimonials.
    diligencePath: Request portfolio scorecards by acquisition cohort showing pre/post product cadence, churn, upsell, margin, and engineering productivity changes.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: sourcing-engine
    missingEvidence: A breakdown of proprietary versus banker-run or auctioned deals in Beacon’s current acquisition funnel.
    whyItMatters: If sourcing is mostly intermediated, then larger capital pools and established consolidators may be able to erode Beacon’s seller-side differentiation faster than the public narrative suggests.
    diligencePath: Ask management to provide pipeline attribution by channel, close-rate by channel, and win-loss examples against Constellation, Valsoft, Banyan, and sponsor buyers.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP004
