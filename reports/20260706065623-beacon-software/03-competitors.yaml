- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Beacon moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Permanent-home seller pitch
    - Valsoft and Banyan make very similar legacy-preservation and never-sell claims
    - High
    - Request win-loss examples showing why founders picked Beacon over permanent-home peers
  - - AI-first modernization engine
    - Vista, Thoma Bravo, Valsoft, and Banyan all now market AI operating support in some form
    - High
    - Quantify pre/post release velocity, churn, upsell, and margin gains for acquired Beacon assets
  - - Own-capital speed and founder-flexible terms
    - Larger sponsors may still outbid or out-resource Beacon in banker-run processes
    - Medium
    - Map close-rate by deal channel and show where Beacon wins without being the highest bidder
  - - Focus on overlooked sub-$20M ARR software
    - Constellation and permanent-home peers already scan much of the same VMS terrain
    - Medium
    - Demonstrate proprietary sourcing, niche pattern recognition, and target-screen advantages
  - - Decentralized autonomy with shared platform support
    - Weekly acquisition cadence can create integration debt even if brands remain independent
    - High
    - Provide cohort scorecards for implementation burden, engineering lift, and customer retention
  - - Anti-PE public narrative
    - Adverse coverage says the model could still be PE with sharper marketing and a GPU
    - High
    - Back the narrative with seller references and hard operating outcomes instead of investor prose alone
  notes: The risk register tests whether Beacon’s claimed moat remains unique once the market is segmented into public compounders, permanent-home peers, and AI-enabled sponsor platforms.
