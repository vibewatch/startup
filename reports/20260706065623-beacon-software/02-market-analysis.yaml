tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core vertical workflow systems
    - Recurring subscriptions for systems of record that run registrations, bookings, policy admin, student
      guidance, and similar operational workflows
    - Generic horizontal productivity suites and unrelated consumer apps
    - Owner / GM or functional lead; ultimately business or institution budget
    - This is the core category Beacon says it wants to own
  - - Adjacent workflow modules
    - Communications, reporting, embedded compliance, payments, and automation features attached to the
      system of record
    - Standalone point tools without workflow control
    - Functional budget owner with finance sign-off
    - These modules expand ACV once trust and data are already in place
  - - Post-acquisition operating layer
    - Shared engineering, AI features, automation, and data tooling applied after acquisition
    - Traditional cost-cutting without product improvement
    - Beacon holdco investment budget
    - This is where Beacon tries to create alpha versus passive ownership
  - - Horizontal software and generic AI tools
    - Only included when they are embedded inside the acquired workflow product
    - Pure horizontal suites sold independently of a vertical workflow
    - Central IT or mixed departmental budgets
    - Too broad to define Beacon’s real market
  - - Pure services or offline operations
    - Only the software layer supporting the workflow is in scope
    - Labor-only services, physical operations, or generic outsourcing revenue
    - N/A
    - These categories would overstate TAM without improving Beacon fit
  notes: This boundary table defines the addressable market around trusted vertical workflow systems and
    adjacent software layers, not around all SMB IT spend.
