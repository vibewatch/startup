  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: A current list of Beacon-owned companies with vertical, revenue band, geography,
      and customer concentration that would allow a defensible SAM/SOM cut.
    whyItMatters: Without a disclosed portfolio and pipeline screen, broad market TAM risks overstating
      what Beacon can realistically buy and improve.
    diligencePath: Request the current portfolio list, acquisition funnel, and target-screening rubric
      by ARR, profitability, geography, and workflow category.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: portfolio-outcomes
    missingEvidence: Post-acquisition product, retention, NRR, churn, support, and release-velocity data
      for Beacon portfolio companies.
    whyItMatters: The thesis depends on AI-enabled product improvement after acquisition, but public sources
      do not show realized operating outcomes at the portfolio level.
    diligencePath: Request portfolio KPI cohorts before and after acquisition, including churn, release
      cadence, EBITDA contribution, and customer references.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: pipeline-pricing-and-geography
    missingEvidence: Public disclosure on acquisition multiples, target geography mix, and current pipeline
      depth.
    whyItMatters: The market can be large while the available and attractively priced target pool remains
      much smaller; geography mix also determines how Canadian ecosystem tailwinds matter.
    diligencePath: Request pipeline coverage by country and vertical plus the last 10 signed or evaluated
      deal multiples and seller profiles.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
    - TM003
