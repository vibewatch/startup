- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Large North American base of small and medium businesses
    - Positive
    - Structural / multi-year
    - Creates a deep installed base for workflow software and acquisition sourcing
    - Quantify which sub-verticals have the best retention and founder-seller density
  - - Vertical software growing faster than broad SMB software
    - Positive
    - 2026-2031
    - Supports a focus on niche workflow systems rather than generic SMB tools
    - Rank target verticals by growth, retention, and compliance intensity
  - - SMB AI revenue and productivity evidence
    - Positive
    - Immediate / 1-2 years
    - Creates a real budget narrative for AI add-ons and workflow automation
    - Test whether portfolio products can convert productivity proof into pricing power
  - - Security and trust as buying gates
    - Negative
    - Immediate
    - Trusted vendors win; weak security posture can block adoption even when ROI is clear
    - Review security controls, data governance, and customer trust posture across targets
  - - IT scarcity and user-adoption friction
    - Negative
    - Immediate
    - Favors embedded, low-change products and punishes complex rip-and-replace motions
    - Measure implementation burden, activation, and support load before scaling AI modules
  - - 2026 M&A selectivity and valuation reset
    - Negative
    - '2026'
    - Buyers pay up only for embedded, profitable, defensible assets
    - Benchmark margins, retention, and workflow depth before paying acquisition multiples
  - - Canadian scaling and exit bottleneck
    - Negative
    - 2026-2027
    - Domestic ecosystem is supportive but may not supply enough scaled targets by itself
    - Map the cross-border sourcing and financing strategy explicitly
  - - Narrow willing-seller acquisition universe
    - Negative
    - Structural
    - Topline TAM overstates how many founder-owned vertical vendors are actually buyable
    - Build a screen for profitability, owner readiness, workflow criticality, and AI fit
  notes: This table mixes structural demand drivers with the execution constraints that are most likely
    to determine whether AI-enabled software consolidation clears underwriting hurdles in 2026.
