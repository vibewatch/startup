- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Five-step operating path for AI-enabled software consolidation, from sourcing a workflow asset
    to scaling it safely.
  data:
    nodes:
    - id: source
      label: Source a profitable workflow asset
      description: Founder-owned vertical software with sticky operational usage and low churn tolerance.
    - id: retain
      label: Retain workflow trust and customer continuity
      description: Keep brand, team, and daily workflow stable so users do not face a disruptive migration.
    - id: embed
      label: Embed AI inside the incumbent system of record
      description: Prioritize AI features that switch on inside CRM, ERP, accounting, or workflow tools
        already in use.
    - id: govern
      label: Add pricing, security, and AI risk controls
      description: Transparent pricing, trusted-vendor posture, and trustworthiness controls are gating
        requirements.
    - id: scale
      label: Scale shared engineering and portfolio operations
      description: Only after trust and adoption hold can shared data, engineering talent, and M&A synergies
        expand margins.
    edges:
    - to: retain
      label: acquire without breaking the workflow
      from: source
    - to: embed
      label: ship AI into an already trusted product
      from: retain
    - to: govern
      label: prove ROI while controlling risk and spend
      from: embed
    - to: scale
      label: expand across the portfolio when adoption is stable
      from: govern
