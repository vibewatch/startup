  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consolidated-revenue
    missingEvidence: Consolidated revenue, ARR, and growth bridge by quarter and by major revenue line.
    whyItMatters: Without a denominator, the chapter cannot judge valuation efficiency, growth quality, or the weight of recurring revenue versus services and payments.
    diligencePath: Request the latest board package or monthly management accounts with revenue by subsidiary cluster, ARR bridge, and year-over-year growth.
    relatedQuestionRefs:
    - QI014
    - QI024
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash balance, monthly burn, liquidity sources, debt schedule, and management runway case.
    whyItMatters: Capital adequacy is the core forward-looking financial risk, but public evidence only proves fundraising access rather than current liquidity or burn.
    diligencePath: Request the latest balance sheet, trailing six-month cash flow statement, covenant package, and base / downside runway model.
    relatedQuestionRefs:
    - QI017
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, CAC, payback, NRR, churn, and acquisition purchase-multiple or integration-lift KPIs.
    whyItMatters: These are the metrics needed to separate a narrative AI roll-up from a durable recurring-software compounder.
    diligencePath: Request a KPI pack by product family and acquisition cohort, including customer retention, net dollar retention, and time-to-value after integration.
    relatedQuestionRefs:
    - QI024
