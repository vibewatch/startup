  - - Series C financing
    - $225M
    - Official release plus BetaKit
    - Follow-on primary equity arrived only ~7 months later, extending acquisition firepower
    - Confirm whether any bridge, extension, or delayed tranche existed.
  - - Implied Series B new-money dilution
    - 20% to 25%
    - Depends on whether reported $1B valuation was pre- or post-money
    - Material dilution is supportable even though exact ownership is not
    - Request price per share, pre-money, post-money, and option pool changes.
  - - Implied Series C new-money dilution
    - 13.8% to 16.1%
    - Depends on whether reported $1.4B valuation was pre- or post-money
    - Further dilution is material but directional only
    - Request price per share and full preferred-stock terms.
  - - Pre-Series-B holder retention after both rounds
    - 62.9% to 69.0%
    - Arithmetic range from public round assumptions
    - Useful for order-of-magnitude thinking only, not exact governance math
    - Request cap-table waterfall including founders, employees, and prior investors.
  - - Planned use of funds
    - Acquisitions plus AI operating-system buildout
    - Official releases and reported commentary
    - Capital is earmarked for both external and internal compounding levers
    - Request capital-allocation budget by M&A, engineering, hiring, and working capital.
  - - Cash on hand
    - null
    - Not publicly disclosed
    - Cannot size immediate acquisition dry powder from public evidence alone
    - Request latest unrestricted cash and revolver availability.
  - - Monthly burn
    - null
    - Not publicly disclosed
    - Runway cannot be calculated without burn or cash-consumption data
    - Request net cash burn and cash conversion by quarter.
  - - Runway months
    - null
    - Not supportable from public sources
    - Capital adequacy remains qualitative, not quantitative
    - Request base, upside, and downside runway under acquisition and no-acquisition cases.
  - - Debt / project-finance obligations
    - No public operating debt package disclosed
    - Observed absence in reviewed Beacon sources
    - Equity rounds are clear, but leverage and off-balance-sheet obligations are not
    - Request debt schedule, covenants, acquisition facilities, and earn-out liabilities.
  notes: The table separates disclosed equity facts from the much larger set of unknown capital-adequacy variables that remain private.
