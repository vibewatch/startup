- id: revenue-model-and-pricing-signals
  title: Revenue model and pricing signals from the named portfolio
  body: |-
    Public evidence supports a more concrete revenue story at the subsidiary level than at the holdco level. Named portfolio company pages show that Beacon is not consolidating a single clean SaaS archetype. College Kickstart mixes consumer subscription pricing with institutionally sold annual subscriptions and paid add-ons. PowerUp and E2E emphasize demo-led club or league-management software that bundles registration, payments, scheduling, and operational workflows. VieFUND is a deeper enterprise back-office system for Canadian investment dealers that exposes broad compliance and transaction functionality but no public pricing. In other words, the visible portfolio spans at least three monetization styles: self-serve or semi-self-serve subscriptions, annual institutional contracts, and quote-led enterprise workflow software.

    That mix is economically useful but analytically incomplete. It tells us Beacon is assembling recurring, workflow-embedded software rather than one-off services shops, and it suggests the company can combine consumer, SMB, and enterprise-like pricing models inside one platform. It also implies a hybrid go-to-market motion: some portfolio products can publish list prices or annual-fee logic, while many still require demos or direct sales. What the public pages do not reveal is the revenue weight of each stream, the renewal behavior behind them, or the gross-margin differences between software license revenue, payment-linked workflows, implementation work, and support. So the chapter can support the existence of diversified monetization, but not the mix percentages or revenue quality by contribution.
