company:
  name: Beacon Software
chapter:
  number: 4
  title: Financials
  summary: Beacon’s public record strongly supports capital access and a diversified recurring-software acquisition thesis, but it stops well short of full financial underwriting. The last two rounds were large, all-equity financings that likely caused material dilution, while consolidated revenue, ARR, gross margin, cash, burn, and cap-table terms remain private. Public product pages show multiple monetization paths across the portfolio, yet the evidence supports narrative unit economics more than audited revenue quality.
sections:
- id: round-economics-and-dilution
  title: Round economics and inferred dilution
  body: |-
    Beacon’s public financing record is unusually strong on headline dollars and unusually thin on capital-structure detail. The combination of Beacon’s own Business Wire releases and BetaKit’s reporting makes the basic chronology clear: a $250 million Series B in late 2025 followed by a $225 million Series C in June 2026, both described as all-equity, all-primary financings. That is enough to support a firm conclusion that outside investors materially increased the company’s equity capital base and that dilution, not disclosed leverage, was the main mechanical consequence of the last two rounds. It is not enough to publish a precise post-round ownership table. The company’s own Series B release never stated the $1 billion valuation that later coverage attached to the round, and the Series C valuation appears only through third-party reporting.

    That ambiguity matters. If the reported valuation figures were post-money marks, Series B and Series C investors would have bought about a quarter and about one-sixth of the company, respectively. If they were pre-money marks, the percentages are slightly lower but still very material. Either way, the public record supports meaningful dilution for pre-Series-B holders over seven months of follow-on fundraising, while leaving the cap table’s exact shape unresolved because share counts, option-pool changes, liquidation preferences, anti-dilution clauses, and any secondary components remain undisclosed. The financial takeaway is therefore directional rather than exact: Beacon clearly has powerful capital access, but public evidence is not strong enough to underwrite ownership outcomes beyond a reasonable range.
