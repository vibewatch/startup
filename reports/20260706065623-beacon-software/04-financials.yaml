  rows:
  - - College Kickstart families
    - Direct college-admissions software subscription
    - List price of $50, $80, or $125 per season
    - Recurring subscription with transparent public pricing but unknown subscriber count or renewal profile
    - Request active subscribers, renewal rate, and gross margin by plan.
  - - College Kickstart schools
    - Annual subscription priced by covered student count plus paid add-ons
    - Custom annual fee; no per-counselor charge; add-ons sold separately
    - Institutional recurring SaaS with clear upsell hooks but undisclosed contract sizes
    - Request ACV, renewal rate, upsell penetration, and school-versus-family mix.
  - - PowerUp Sports clubs
    - Club-management platform spanning registration, payments, scheduling, and websites
    - Packages and demos are public, but not price points
    - Likely recurring software with payment-linked workflows; price realization is private
    - Request contract form, payment-processing economics, and churn by club cohort.
  - - E2E Soccer clubs and leagues
    - Club and league management software with online registration, discipline, and reporting
    - Demo/request-info motion; “reasonable cost” language only
    - Workflow software appears sticky, but pricing and margin visibility are low
    - Request ARR, implementation revenue share, and retention history.
  - - VieFUND dealers
    - Back-office and compliance platform for Canadian investment dealers
    - No public pricing; contact-sales only
    - Enterprise workflow software with high operational embeddedness but opaque commercial terms
    - Request dealer count, pricing basis, implementation fees, and services mix.
