- id: TV005
  title: Thesis-Break and Kill Triggers Table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR quality breaks
    - Verified recurring ARR is materially below what premium or even normal software bands would require
    - Current price no longer clears disciplined software comp ranges
    - Pause or demand a materially lower entry price
  - - Margin / services mix disappoints
    - Gross margin is dragged down by services-heavy work or AI/integration cost structure
    - AI premium compresses toward ordinary or legacy software bands
    - Re-cut valuation on lower bands immediately
  - - Retention or concentration is weak
    - NRR, gross retention, or customer concentration fail to show durable workflow embedment
    - Moat argument weakens and the Constellation/Valsoft analogy loses force
    - Assume slower compounding and lower exit multiple
  - - Round terms are investor-protective
    - Preferences, secondaries, or other term-stack details reduce common-equity upside
    - Headline valuation overstates economics available to new money or common holders
    - Do not rely on the mark alone; re-underwrite ownership outcomes
  - - AI ROI is not measurable
    - Management cannot show that automation or product rebuilds produced KPI lift across cohorts
    - The AI thesis becomes marketing rather than valuation support
    - Treat Beacon more like a traditional roll-up and cut the premium
  notes: These are the smallest number of variables most likely to move Beacon from premium candidate to overvalued financing story.
