  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: beacon-arr-quality
    missingEvidence: Audited ARR, revenue mix, NRR, gross retention, and cohort churn data for the Beacon holdco and major acquisition cohorts.
    whyItMatters: These metrics determine whether Beacon clears premium AI-enabled bands, normal software bands, or something closer to legacy software.
    diligencePath: Request the board KPI pack, audited revenue bridge, and cohort retention dashboard.
    relatedTableRefs:
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Price per share, preference stack, secondary mix, option-pool changes, anti-dilution, and any other investor protections in the 2025 and 2026 rounds.
    whyItMatters: Headline post-money marks can overstate the economics available to common shareholders or new investors if the term stack is protective.
    diligencePath: Review financing documents, cap table, and counsel summary before using the headline valuation in return math.
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: acquisition-discipline
    missingEvidence: Deal-level purchase multiples, earn-out structures, integration timelines, and post-close KPI lift for recent Beacon acquisitions.
    whyItMatters: The roll-up can justify a premium only if acquisitions are priced and integrated in a way that compounds value rather than merely scaling narrative and complexity.
    diligencePath: Inspect investment memos, post-close operating reviews, and acquisition scorecards for a sample of recent deals.
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: margin-structure
    missingEvidence: Gross margin and cost-to-serve by portfolio cluster, including the direct cost of AI engineering, implementation, and shared-platform support.
    whyItMatters: The valuation range changes sharply depending on whether Beacon behaves like high-margin software or services-heavy modernization work.
    diligencePath: Request a cost decomposition by revenue line and by acquired-product cohort.
    relatedTableRefs:
    - TV004
    - TV006
