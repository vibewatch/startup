company:
  name: Beacon Software
chapter:
  number: 8
  title: Valuation
  summary: Beacon’s reported $1.0 billion November 2025 mark and roughly $1.4 billion June 2026 mark are plausible financing prices for a well-capitalized, AI-marketed vertical-software roll-up, but public evidence still falls far short of full underwriting. Constellation and Valsoft validate the permanent-hold software model, and 2026 market data confirms a real AI premium alongside a meaningful legacy-software discount. The supportable public-evidence call is therefore research-more with high risk and a stretched valuation stance until private diligence proves Beacon’s ARR quality, margins, retention, deal discipline, and round terms.
sections:
- id: valuation-facts-and-disclosure-quality
  title: Valuation Facts and Disclosure Quality
  body: 'Beacon’s public financing record supports momentum, but not precise valuation underwriting. The official November 2025 and June 2026 releases clearly establish two very large all-primary financings, the strategic use of proceeds, and management’s view that AI can modernize overlooked vertical software. They do not, however, publish the valuation marks, revenue base, margin profile, retention, or cap-table terms needed to judge whether the price is attractive. Third-party reporting fills in the headline numbers: BetaKit attached a $1.0 billion valuation to the $250 million Series B and roughly $1.4 billion to the $225 million Series C. Those reports, together with the official releases, make it reasonable to treat Beacon as a real and unusually well-financed software consolidator. The harder question is whether the public file supports the price rather than simply the existence of the price. On that point, the answer is no. Public evidence substantiates funding access, acquisition
    pace, and management narrative; it does not substantiate the revenue and cash-flow denominator behind the mark. TNW’s observation that Beacon came back for a larger round only seven months after signaling that the prior round might be its last sharpens that distinction. The 2026 mark is best treated as a financing datapoint, not as a fully proven fair value.'
