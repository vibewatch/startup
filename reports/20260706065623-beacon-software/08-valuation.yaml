- id: TV004
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Core assumptions
  - Indicative clearing logic
  - Illustrative fair-value range (USD B)
  - Probability signal
  rows:
  - - Bull
    - Private diligence shows clean recurring ARR, strong retention, good margins, disciplined acquisition pricing, and real AI KPI lift
    - Beacon clears as a high-quality AI-enabled holdco with partial access to premium AI bands
    - 1.4-1.7
    - Requires evidence that today is not just a financing premium but an operating premium
  - - Base
    - Beacon is a promising Constellation/Valsoft-style analogue but disclosure remains incomplete and AI proof is only partial
    - Current mark can be directionally credible, but only at the upper end of a disciplined range
    - 1.0-1.3
    - Best public-evidence range today
  - - Base-down
    - Revenue quality is solid enough for ordinary software treatment but not for a meaningful AI premium
    - Market clears Beacon nearer public SaaS averages or AI-enabled normalizing bands
    - 0.8-1.0
    - Most likely compression path if diligence is merely okay, not strong
  - - Bear
    - Retention, margins, or integration economics disappoint, or round terms shift economics away from common equity
    - The story resets toward legacy or lower-quality software clearing bands
    - 0.6-0.8
    - Downside if AI lift is narrative-heavy and disclosure remains weak
  notes: Ranges are heuristic judgment bands anchored to the reported financing marks, 2026 public/private software multiple spreads, and a material disclosure discount; they are not a DCF or fairness opinion because Beacon does not disclose ARR or margin inputs publicly.
