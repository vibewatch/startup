- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Model fit
    - Constellation and Valsoft show that permanent-hold vertical software can compound over time
    - Beacon is much younger and lacks public cohort-level proof that its version repeats cleanly
    - Post-close cohort scorecards on retention, margin uplift, and integration pace
  - - AI premium
    - 2026 buyers still pay up for defensible AI-enabled workflow software with proprietary context
    - The same market is sharply discounting generic, services-heavy, or weakly defended software
    - Evidence that Beacon’s AI layer improves KPI outcomes rather than just the fundraising story
  - - Capital access
    - Beacon has raised unusually large all-equity rounds and can keep buying
    - Capital access alone does not prove valuation efficiency or common-equity upside
    - ARR bridge, cash-flow conversion, and acquisition purchase-multiple discipline
  - - Mark quality
    - A $1.0B to ~$1.4B step-up in seven months signals real investor demand
    - Neither official financing release disclosed the valuation mark or the terms behind it
    - Price per share, liquidation preferences, secondaries, and option-pool changes
  - - Comparable frame
    - Beacon can clear as a promising AI-enabled software holdco
    - Public evidence does not support valuing it like a proven AI-native scarcity asset
    - Private proof on recurring revenue, retention, gross margin, and workflow embedment
  notes: The anti-thesis here is mostly about disclosure, denominator quality, and multiple compression rather than an immediate prediction of operational collapse.
