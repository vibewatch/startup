- id: TV003
  title: Comparable Valuation Table
  columns:
  - Comparable / band
  - Metric or valuation status
  - Why it matters
  - Relevance to Beacon
  - Limitation
  rows:
  - - Beacon Series B (reported)
    - $250M raise at $1.0B reported valuation
    - Anchors the late-2025 financing mark
    - Shows where investors initially cleared the roll-up thesis
    - Official release did not disclose the mark; third-party reporting supplied it
  - - Beacon Series C (reported)
    - $225M raise at ~$1.4B reported valuation
    - Latest public price anchor for the company
    - Defines the current entry debate
    - Again, the official release omitted the valuation and operating denominator
  - - Constellation Software
    - Public filer with Q1 2026 revenue $3.181B, FCFA2S $733M, and disclosed acquisition spend
    - Best benchmark for what mature software-compounder disclosure looks like
    - Useful operating and governance benchmark, not a direct maturity match
    - Much larger, older, and more proven than Beacon
  - - Valsoft
    - Private permanent-hold vertical-software peer; no public holdco valuation disclosed
    - Shows that the ownership model has a real private precedent
    - Helpful analogue on hold-forever structure and decentralization
    - No audited public financial disclosure to anchor valuation
  - - AI-native / AI-enabled / legacy software bands
    - 21.2x and 11.5x for AI-native; 8.5x and 7.0x for AI-enabled; 5.5x and 3.8x for legacy SaaS
    - Quantifies the 2026 premium/discount spread across software categories
    - Useful for stress-testing how much ARR Beacon would need at the reported mark
    - Band data is market-wide, not Beacon-specific
  - - Public SaaS basket
    - 5.34x average and 3.04x median revenue multiple across 144 public SaaS companies as of July 3, 2026
    - Frames what ordinary public software clears without a scarcity premium
    - Important downside discipline if Beacon proves less differentiated than the story implies
    - Broad basket rather than a custom vertical-software peer set
  notes: 'This benchmark set is exhaustive for the valuation lenses actually used in this chapter: reported Beacon rounds, a public software-compounder benchmark, a private permanent-hold peer, segmented AI/legacy software bands, and a broad public SaaS clearing range.'
  enumerationScope:
    coverage: exhaustive
    basis: Rows cover every benchmark cluster explicitly used in this chapter’s valuation logic as of the 2026-07-06 run date, rather than every software buyer or public ticker in the market.
