- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Recurring ARR bridge
    - Audited split between true recurring software revenue, services, implementation, and any payments-linked revenue
    - Determines which comp band Beacon can legitimately clear
    - CFO walkthrough plus board materials
  - - Retention and concentration
    - NRR, gross retention, churn by acquisition cohort, and top-customer concentration schedules
    - Tests whether the platform has workflow gravity or just near-term momentum
    - Customer cohort review and operating dashboard
  - - Gross margin and AI cost structure
    - Gross margin by portfolio cluster plus direct AI / engineering / integration cost burden
    - Separates premium software economics from expensive modernization work
    - Finance diligence plus engineering cost decomposition
  - - Acquisition discipline
    - Deal-level purchase multiples, earn-out structure, time-to-integration, and post-close KPI lift
    - Shows whether value creation comes from operations rather than financing optics
    - M&A pipeline review and post-close operating scorecards
  - - Round mechanics
    - Price per share, preference stack, secondary mix, anti-dilution, and other investor protections
    - Determines whether the headline mark reflects common-equity economics
    - Lead investor counsel and cap-table review
  notes: Each ask can move the comp set and therefore the valuation materially; none is cosmetic.
