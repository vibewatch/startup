  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与多重规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Beacon
              追的不是整个软件市场。公司自己的定位和投资人叙事指向更窄的边界：创始人搭建、承载真实世界工作流的垂直软件，服务中小运营者、学校、社区组织和其他本地机构。因此，纳入的支出不只是记录系统的经常性订阅，也包括工作流自动化、沟通、嵌入式合规，以及收购后可以叠加的运营层升级。排除的支出应包括横向生产力套件、消费者应用、纯服务收入，以及不掌控关键任务工作流的软件类别。这个边界很关键，因为
              Beacon 的价值主张不主要靠原始席位数，而靠拥有可信且足够深入的工作流；这种深度要能扛住控制权变更，也能吸收 AI 改进，而不迫使客户迁移和替换。


              在这个较窄框架下，留存证据支持一个大市场，但不支持单一、干净的 TAM。Mordor 的宽口径 SMB 软件市场在 2026 年为 $77.33B，垂直软件口径同年更大，达到 $164.06B，且到 2031
              年增长更快。两个市场都已经明显偏北美，这很重要，因为 Beacon 扎根多伦多，但收购命题面向美国和加拿大。一个有用的投资测算结论是，Beacon 不需要拿下通用 SMB
              软件的显著份额也能成立。它只需要从嵌入式、创始人持有且拥有可信客户工作流的垂直资产中切下一小片。尽调难点在于，公开来源对这个更窄的收购宇宙只能定性描述，所以 SAM 或 SOM 必须被视为证据受限，不能假装精确。
