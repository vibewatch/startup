      - number: '3.2'
        title: 赞助方基准与永久归宿型同行
        blocks:
          - type: paragraph
            body: >-
              其余竞争格局分成两个重要集群。Vista Equity Partners 和 Thoma Bravo 是规模基准：它们拥有深得多的资本池、更成熟的软件运营生态，以及越来越明确的 AI 计划。Vista
              现在把自己定位为企业软件和 AI 投资领导者；其 Agentic AI Factory 把 AI 从流行词变成组合层面的运营系统。Thoma Bravo 同样明确表示，超大规模云厂商关系、AI
              工具和类别平台建设已是赞助方打法的一部分。这些公司重要，是因为它们能从上方压缩 Beacon 所声称的 AI 优势。如果 AI 现代化成为赞助方标准运营实践，Beacon 就不能只靠 AI 语言构成护城河。


              Valsoft 和 Banyan 重要则出于相反原因。它们在卖方叙事上更接近 Beacon。两家公司都明确把自己包装成软件企业的长期或永不出售归宿，都强调自治和传承保留，也都开始把永久性故事与共享 AI
              或增长运营支持结合。换句话说，Beacon 不是唯一告诉创始人“出售仍可保留文化、领导层和长期所有权”的买方。Beacon 的优势在于，它把这些承诺包装进一个更年轻、更显眼的 AI
              原生现代化命题，并更聚焦于规模较小、由创始人主导的日常经济资产。但永久归宿集群证明，Beacon 的卖方话术已经有可信替代选项。
