      - number: '1.2'
        title: 创始人、领导层与地理布局
        blocks:
          - type: paragraph
            body: >-
              公开证据足以确认 Beacon 的创始团队，尽管治理信息比履历信息薄。Nilam Ganenthiran 被一致认定为创始人兼 CEO，既有 Instacart 的运营可信度，也有 D1 Capital
              的投资经验。Divyahans Gupta——外界常称 Divya Gupta——被一致认定为技术联合创始人和初任 CTO，少见地兼具 Sequoia 的创投背景，以及
              Databricks、Airbnb、Palantir 的工程经验。两人的背景支撑了公司的承诺：能评估收购、招到技术人才，并改造已收购代码库，而不是只做成本优化。Lightspeed 称其自 2021 年起就与
              Ganenthiran 讨论这一概念，这进一步说明 Beacon 并不是为了追赶 2025 年 AI 融资周期才临时拼出的项目。


              地理上，多伦多是最清晰的锚点。多家来源称 Beacon 总部在多伦多，E2E Soccer 收购公告也称公司总部位于多伦多。但到 2026 年 6 月，Beacon 也在释放加深旧金山布局的信号。Series C
              轮公告加入了前 Instacart 和 AngelList 高管 Mark Schaaf 与 Goutham
              Buchi，并把二人放在新的旧金山办公室，暗示公司采用双中心模式：多伦多承载控股公司身份和加拿大收购基础，旧金山承担人才和高管枢纽。缺失的是正式治理层。已审阅的官方和投资人材料都没有披露融资轮背后的董事会、投票控制或保护性权利结构。这让领导班子本身可信，但具体权力图谱仍不透明；对于一个预计高速部署资本的收购平台，这一点很重要。
