  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 参考出清逻辑
      - 示例公允价值区间（USD B）
      - 概率信号
    rows:
      - - 乐观
        - 私下尽调显示经常性 ARR 干净、留存强、利润率好、收购定价克制，且 AI 确实拉动 KPI
        - Beacon 可被市场按高质量 AI 控股公司定价，并部分拿到 AI 溢价带
        - 1.4-1.7
        - 需要证明当前估值不只是融资溢价，而是经营溢价
      - - 基准
        - Beacon 像一个有潜力的 Constellation/Valsoft 式样本，但披露仍不完整，AI 证据也只是局部成立
        - 当前估值方向上可以说得通，但只能落在克制区间的上沿
        - 1.0-1.3
        - 目前公共证据最能支撑的区间
      - - 基准偏下
        - 收入质量足以按普通软件公司处理，但撑不起有意义的 AI 溢价
        - 市场会把 Beacon 定在更接近上市 SaaS 平均水平，或 AI 赋能软件回归常态的估值带
        - 0.8-1.0
        - 若尽调只是过关而非强劲，这是最可能的压缩路径
      - - 悲观
        - 留存、利润率或整合经济性低于预期，或融资条款把经济利益从普通股移走
        - 估值叙事会回到传统软件或低质量软件的出清区间
        - 0.6-0.8
        - 若 AI 提升主要停留在叙事，且披露继续偏弱，这是下行情景
    notes: 这些区间是启发式判断带，锚定已报道的融资估值、2026 年公私市场软件倍数差，以及显著的信息披露折价；它们不是 DCF 或公允性意见，因为 Beacon 没有公开披露 ARR 或利润率输入。
    claimRefs:
      - CV031
      - CV033
      - CV035
      - CV036
      - CV039
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: TV005
    title: 投资逻辑破裂与止损触发表
    columns:
      - 触发项
      - 阈值或事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 质量失守
        - 经验证的经常性 ARR 显著低于溢价甚至普通软件估值带所需水平
        - 当前价格无法再通过克制的软件可比公司区间
        - 暂停，或要求大幅降低入场价格
      - - 利润率 / 服务组合不及预期
        - 毛利率被服务占比过高，或 AI / 整合成本结构拖累
        - AI 溢价压缩到普通或传统软件估值带
        - 立即按更低估值带重切估值
      - - 留存或集中度偏弱
        - NRR、总留存率或客户集中度无法证明工作流嵌入具备耐久性
        - 护城河论证变弱，Constellation/Valsoft 类比失去说服力
        - 按更慢复利和更低退出倍数建模
      - - 融资条款偏保护投资人
        - 优先权、老股交易或其他条款堆叠细节压低普通股上行空间
        - 名义估值高估新资金或普通股持有人可获得的经济利益
        - 不要只看估值标记；重新测算持股结果
      - - AI ROI 无法衡量
        - 管理层无法证明自动化或产品重构在多个队列中带来 KPI 提升
        - AI 投资逻辑就会变成营销话术，而非估值支撑
        - 按传统并购整合平台看待 Beacon，并削减溢价
    notes: 这些变量数量最少，却最可能把 Beacon 从溢价候选变成估值过高的融资故事。
    claimRefs:
      - CV014
      - CV029
      - CV030
      - CV032
      - CV034
      - CV035
      - CV041
      - CV044
      - CV046
      - CV048
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经常性 ARR 桥接
        - 经审计拆分真实经常性软件收入、服务、实施，以及任何支付挂钩收入
        - 决定 Beacon 合理落入哪一组可比公司估值带
        - CFO 讲解，加董事会材料
      - - 留存与集中度
        - NRR、总留存率、按收购队列划分的流失率，以及头部客户集中度明细
        - 检验平台有工作流引力，还是只有短期动能
        - 客户队列复盘和运营仪表盘
      - - 毛利率与 AI 成本结构
        - 按资产组合集群划分的毛利率，加直接 AI / 工程 / 整合成本负担
        - 区分高溢价软件经济性和昂贵的现代化改造
        - 财务尽调，加工程成本拆解
      - - 收购纪律
        - 单笔交易购买倍数、业绩支付结构、整合周期，以及交割后 KPI 提升
        - 看清价值创造来自运营，还是来自融资观感
        - M&A 管线复盘和交割后运营记分卡
      - - 融资机制
        - 每股价格、优先股堆叠、老股交易占比、反稀释和其他投资人保护
        - 判断名义估值是否反映普通股经济利益
        - 领投方律师和股权结构表复核
    notes: 每个问题都可能实质性改变可比公司组，进而改变估值；没有一项只是走过场。
    claimRefs:
