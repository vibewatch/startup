      - number: '1.4'
        title: 里程碑、组合信号与未决风险
        blocks:
          - type: paragraph
            body: >-
              Beacon 早期里程碑更体现节奏，而不是某一次旗舰产品发布。到 2025 年 11 月，Ganenthiran 对 BetaKit 表示，公司已经大约每两周收购一家新企业；到 2026 年 6 月，Beacon
              称节奏已加快到约每周一次收购。公司公开公告只能部分展示组合到底包含什么，但具名案例足以说明命题是真实的，不只是口号。Beacon 和第三方报道明确提到 Let’s Camp、PowerUp
              Sports、VieFUND、College Kickstart、MAP Policy Partners 和 E2E
              Soccer。这些案例横跨娱乐、教育和金融服务工作流，与融资公告中的“日常经济”语言一致。E2E 收购尤其有用，因为它披露了一个运营原则：Beacon 把 E2E 与 PowerUp
              合并成一个足球软件平台，同时承诺两个品牌和管理团队都会保留。


              风险信号同样重要，因为 Beacon 仍是一家年轻且资本快速上升的整合平台。公开规模说法——数千家企业客户、间接服务数十万名员工、超过一百万活跃用户、EBITDA 增长超过
              50%——方向上令人印象深刻，但仍是公司自报。独立负面报道没有指控 Beacon 存在不当行为，却提出了正确问题。Reuters 指出，AI 驱动的整合回报仍未经验证；The Next Web
              更进一步警告，快速连续收购小公司可能悄悄累积整合债务。还有一个基础尽调问题：公司尚未公布完整组合名单、董事会图谱或控股公司财务披露。因此，第 1 章支持对 Beacon
              身份和融资势头形成强判断，但只能部分判断其运营系统能否像叙事那样顺畅扩张。
