    Beacon Software 是一家总部在多伦多的永续资本控股公司，收购创始人主导、服务日常经济工作流的垂直软件企业，再用共享工程、AI、金融科技和 GTM 能力改造它们。公开证据最一致地显示，公司由 Nilam
    Ganenthiran 和 Divyahans（Divya）Gupta 于 2024
