      - number: '7.4'
        title: 监管审视、披露风险与投资组合控制面
        blocks:
          - type: paragraph
            body: >-
              Beacon 的策略也带来真实的监管和披露负担。FTC 和 DOJ 已在多份 2024 年材料中表示，连续收购和 roll-up 策略可能损害竞争，有时是一串低于普通 Hart-Scott-Rodino
              门槛的交易造成影响。USAP 案并不是软件行业类比，但它说明，当机构认为收购和有关行为削弱竞争、推高价格时，受私募股权支持的 roll-up 会被怎样叙事。反垄断之外，SEC 2024 年针对 AI
              夸大宣传的执法也重要，因为 Beacon 把自己定位为 AI 原生。SEC 针对 Delphia 和 Global Predictions 的新闻稿与命令显示，若 AI
              能力、表现和控制的说法缺少证据和治理，就会变成法律负债。投资组合本身也让合规更难。College Kickstart 的隐私政策称，数据可能出于内部运营和投资组合管理目的与母公司 Beacon
              及关联方共享；但也称该产品目前不使用会处理、训练或分享学生数据的 AI 工具。相比之下，VieFUND 披露了 KYC 密集的经销商工作流、MFDA
              式合规、审计轨迹和第三方基础设施链接。上述披露本身不是红旗，却意味着，在控股公司公开披露仍薄的同时，Beacon 母公司层面的控制负担横跨学生数据、金融合规和 AI 营销说法。
