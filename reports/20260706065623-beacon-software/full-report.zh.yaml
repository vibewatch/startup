chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与永续资本命题
        blocks:
          - type: paragraph
            body: >-
              Beacon 的官方网页证明，用户提供的 beaconsoftware.com 是正确且仍在运行的公司官网：网站首页可访问，并把 Beacon
              描述为关键企业的“长期归宿”，而不是销售单一应用的软件供应商。官网、投资人笔记和媒体报道的核心叙事一致。Beacon
              收购已经对客户有实际价值、盈利且由创始人主导的垂直软件或服务企业，保留这些品牌继续运营，再叠加一个集中式运营系统，里面包括工程人才、AI 工具、自动化和 GTM 支持。这明显不同于 Beacon
              明确反对的标准私募股权打法。公司自己的文案强调永久持有、面向创始人的定制交易结构，以及从意向书到交割的快速执行；独立报道还引用 Ganenthiran 的说法，称公司是“反私募股权公司”。


              Beacon
              的命题对目标市场也说得异常具体。公司没有瞄准宽泛的企业软件类别，而是持续把投资人引向“主街”或日常经济工作流：青少年体育、露营地、财务后台、教育工具，以及其他承重但常被忽视的细分场景。Lightspeed 和
              General Catalyst 都把机会描述为碎片化垂直软件：客户信任稳固，但产品栈投入不足。这套逻辑很关键，因为它解释了 Beacon 为什么选择买下运营中的企业，而不只是向它们卖 AI
              工具。公司似乎认为，客户关系、嵌入式工作流数据和分销渠道才是稀缺资产，AI 和软件人才则是 Beacon
              可以集中供给的加速器。结果是一个混合身份：一部分是收购载体，一部分是软件平台，一部分是老旧但盈利细分应用的运营伙伴。
