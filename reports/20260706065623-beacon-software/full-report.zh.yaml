      - number: '5.2'
        title: 组合产品界面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              组合产品本身提供了最清晰的公开证据，说明 Beacon 实际在改造什么。足球软件是最容易读懂的案例：Pulse 2.0 称 Beacon 正把 E2E Soccer 和 PowerUp Sports
              合并为一个全栈平台，产品页面则展示了工作流层面的含义——注册、豁免、场地、排程、积分榜、裁判分配、纪律、工资、移动沟通和持续运营支持。E2E
              明确表示，其模块既可单独运行，也可作为一体化端到端套件运行；这很重要，因为 Beacon 可以统一相邻工作流，而不必立即强制品牌或产品迁移。体育之外，College Kickstart
              展现了另一种模式：为学生和顾问提供数据密集型升学规划，再加上一个董事会报告工作流，摄取第三方学校系统的 CSV 导出，并在两到三个工作日内返回增强报告。VieFUND
              又增加了一种产品形态，暴露受监管交易商后台工作流、KYC、订单处理、合规报告和 Salesforce 导出。这些资产合在一起表明，Beacon 的产品界面不是一个整齐的 SaaS
              类别，而是一组关键任务运营工作流；它们共享现代化需求，但用户类型、数据模型和监管语境差异很大。
