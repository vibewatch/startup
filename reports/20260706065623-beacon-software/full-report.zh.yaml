      - number: '8.4'
        title: 尽调问题与破题触发点
        blocks:
          - type: paragraph
            body: >-
              只要一小组私有尽调答案清楚，决策就能迅速转向任一方向。如果 Beacon 能证明经常性收入干净、扩张耐久、毛利率在 AI
              与整合成本下仍强，并且各批次的收购定价有纪律，那么当前估值会合理得多。若缺失证据显示收入服务占比重、留存弱、整合昂贵，或融资条款让新投资者优先于普通股经济性，估值逻辑会迅速压缩回普通软件档。本章的公开证据边界在于：逻辑不会先败在野心，也不会先败在融资渠道。模型会先败在
              AI 溢价是否能在数字中被衡量。由于 Beacon 选择不公布这些数字，投资者应把当前估值视为有条件的。实际含义很简单：不要只靠故事承销 $1.4B 估值，也不要让 Constellation 或 Valsoft
              类比替代 Beacon 自身在 ARR 质量、利润率结构、整合 KPI 和优先权负担上的证据。
