  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 同一个已报道约 $1.4B 标记，在适用不同 2026 软件倍数区间时，会对应完全不同的 ARR 要求。
    data:
      items:
        - label: 11.5x AI 原生 M&A
          value: 121.7
        - label: 7.0x AI 赋能型 M&A
          value: 200
        - label: 5.34x 公开 SaaS 平均值
          value: 262.2
        - label: 3.8x 传统 SaaS M&A
          value: 368.4
        - label: 3.04x 公开 SaaS 中位数
          value: 460.5
      yAxis:
        label: 约 $1.4B 估值所需 ARR（USD M）
    approximationNotes: 数值用已报道的 2026 年 6 月估值标记除以第三方 2026 软件倍数区间；它们展示分母敏感性，不是 Beacon 披露的 ARR。
