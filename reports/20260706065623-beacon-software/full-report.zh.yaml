      - number: '4.3'
        title: 单位经济、资本充足性与公开可比基准
        blocks:
          - type: paragraph
            body: >-
              Beacon 自身和第三方材料信号足够描述单位经济命题的形状，但不足以用数字证明。公司称其收购盈利软件企业，用共享 AI 平台加速，并表示这种方法在过去一年带来超过 50% EBITDA 增长。公开报道还称
              Beacon 自身已经盈利，已披露资本超过 $550
              million，同时收购节奏加快到约每周一笔交易。这些指标很有意义，说明平台并不缺资本，管理层也相信经济性足以支撑进一步扩张。但它们离真正的承销包还差得远，因为没有披露收入基数、EBITDA
              利润率、毛利率桥、CAC 或回收期指标、NRR 或流失率，也没有现金与烧钱额披露可用于计算资金续航。


              与 Constellation Software 的对比很有启发。Constellation 的 2026 年 Q1 文件恰好披露了 Beacon
              没有披露的指标类型：季度收入、包括递延对价在内的收购支出、经营现金流、自由现金流、现金余额、有追索权和无追索权债务、递延收入、留置应付款，以及按经常性、服务、硬件和许可线拆分的收入结构。这并不意味着
              Constellation 是一个直接苹果对苹果的估值可比公司，但它说明成熟连续收购方的披露长什么样。以这个基准看，Beacon 目前只能支撑命题层面的判断——资本充足、收购驱动、AI
              增强——不能支撑现金流层面对收入质量、利润率路径或资本充足性的判断。
