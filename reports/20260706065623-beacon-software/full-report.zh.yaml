      - number: '1.3'
        title: 资本基础与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              Beacon 的资本形成是公开记录里最清晰的一部分。2025 年末的 Series B 轮有公司、投资人博客、加拿大媒体、Reuters 转发和 Crunchbase News 多方佐证：General
              Catalyst、Lightspeed 和 D1 Capital 领投 $250 million，估值 $1 billion，累计已披露融资达到 $335 million。Business Wire 还点名
              BDT & MSD Partners、Chris Rogers 和 Sator Grove 等追加参与方；General Catalyst 另称自己在加码 Series B 轮之前已经领投 Beacon 的
              Series A 轮。这一点重要，因为它意味着 Beacon 在成为独角兽之前就已获得相当强的早期机构支持，尽管 Series A 轮的具体规模和时间在公开文件中仍不透明。


              下一步融资很快到来。2026 年 6 月，Beacon 宣布由 General Catalyst 和 HarbourVest 领投 $225 million Series C
              轮，Lightspeed、Intrepid Growth Partners、BDT & MSD 关联基金等参与。这样一来，公司在创立约两年内已披露资本超过 $500 million。BetaKit 援引 The
              Globe and Mail 报道称估值为 $1.4 billion，但 Beacon 自己的新闻稿没有披露这个数字，因此应把它视为强信号但间接的当前估值标记。即使没有资本表，利益相关方含义也很清楚：Beacon
              现在拥有一排愿意在完整控股公司财务披露公开之前就为收购引擎注资的蓝筹风险投资人。负面解读则是，估值标记和投资人胃口跑在了所有权、治理和组合层面经济披露深度之前。
