              Partners——而 2026 年 4 月 E2E Soccer 收购显示，Beacon 明确把 E2E 与 PowerUp 合并成一个足球软件栈，同时不改变客户合同或服务水平。这样一来，即使 Beacon
              仍不披露控股公司层面的客户数量，公开客户图谱也很清楚。体育是最容易读懂的垂直：PowerUp 卖给俱乐部、联赛和管理机构，E2E 称其客户从小俱乐部到省级协会都有。教育是下一条最清晰的垂直，通过 College
              Kickstart 以顾问为中心的规划工作流体现。Let's Camp 以双边预订模式服务露营地业主和露营者。VieFUND 服务加拿大投资交易商，MAP Policy Partners
              则卖给试图执行定价纪律的品牌和经销商渠道团队。公开采用代理指标存在，但都偏产品特定，而非按收入加权：E2E 披露联赛、球队和比赛；College Kickstart 披露追踪机构和学校项目参与；评论平台显示
