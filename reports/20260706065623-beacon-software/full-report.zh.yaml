  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 模型契合度
        - Constellation 和 Valsoft 证明，永久持有型垂直软件可以随时间复利
        - Beacon 年轻得多，也缺少公开队列级证据证明其版本能够顺畅复制
        - 交割后队列计分卡，覆盖留存、利润率提升和整合速度
      - - AI 溢价
        - 2026 年买家仍愿意为有自有上下文、可防御的 AI 赋能工作流软件付溢价
        - 同一市场也在大幅折价通用型、服务偏重或防御薄弱的软件
        - 证明 Beacon 的 AI 层改善 KPI 结果，而不只是抬高融资故事的证据
      - - 资本可得性
        - Beacon 完成了异常大的全股权融资轮，仍有能力继续收购
        - 仅有资本可得性，不能证明估值效率或普通股上行空间
        - ARR 桥、现金流转化和收购购买倍数纪律
      - - 标记质量
        - 七个月内从 $1.0B 到 ~$1.4B 的上调，说明真实投资人需求存在
        - 两份官方融资稿都没有披露估值标记或背后条款
        - 每股价格、清算优先权、老股交易和期权池变化
      - - 可比框架
        - Beacon 可以作为有潜力的 AI 赋能软件控股公司出清
        - 公开证据不足以支撑把它按已验证的 AI 原生稀缺资产估值
        - 关于经常性收入、留存、毛利率和工作流嵌入度的私有证明
    notes: 这里的反向逻辑主要指向披露、分母质量和倍数压缩，而不是立即预测运营崩塌。
