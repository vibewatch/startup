      - number: '4.4'
        title: 披露边界与财务结论
        blocks:
          - type: paragraph
            body: >-
              核心尽调问题不是 Beacon 能不能融资；显然可以。问题是，公开记录是否能按投资人通常要求的条款，支撑对一家高速整合方的完整财务承销。答案是否定的。公开来源没有提供合并收入或 ARR，没有经审计 EBITDA
              基数，没有现金余额或烧钱额，没有债务包，没有营运资本画像，没有收购倍数披露，也没有把收购节奏与留存、交叉销售或利润率耐久性相连的分组证据。这意味着最有支撑的公开判断是不对称的：资本通道和战略证据充分，收入质量和下行韧性仍大多停留在叙事层。


              负面背景让这种谨慎更重要，而不是更不重要。通用 AI 经济学研究警告，基础设施和整合成本可能跑在已实现生产力之前；The Next Web 针对 Beacon 的批评称，AI
              整合模式即便在报告增长看起来诱人的同时，也可能悄悄累积整合债务。这些警告没有推翻 Beacon 的模式，但确实抬高了举证门槛。财务上，Beacon
              作为一家资本充足、收购平台型、拥有异质经常性软件敞口的公司，看起来可信；但公开透明度还不足以支持精确所有权测算、资金续航承销，或对组合层面收入质量给出高置信结论。这是本章应守住的公开证据边界。
