    rows:
      - - Beacon Software
        - AI 优先的永久持有型收购方
        - 披露资本 >$550M；已收购 >30 家企业；约每周一单
        - 创始人主导的日常经济和细分垂直软件，通常 ARR 低于 $20M
        - 永久归宿叙事，加上明确的 AI 现代化和共享运营层
        - 公开运营记录短，缺少按批次证明结果可重复的证据
      - - Constellation Software
        - 上市 VMS 复利平台
        - 2025 年收入 $11.623B；2025 年收购对价 $1.579B；TSX 上市
        - 专业行业里的关键垂直市场软件
        - 数十年的买入并长期持有纪律、公开披露和自治运营组
        - AI 优先特征没那么显眼，也不如 Beacon 那样明确贴合创始人传承品牌叙事
      - - Vista Equity Partners
        - 聚焦软件的私募股权和私募信贷资方
        - $103B AUM；90+ 家组合公司；650+ 笔 PE 交易
        - 覆盖全生命周期的企业软件
        - 大型运营平台、AI 工厂和组合生态
        - 对外叙事仍从收购走向退出，而不是永久持有式守护
      - - Thoma Bravo
        - 聚焦软件的控股收购平台
        - $172B+ AUM；约 80 家现有组合公司；约 590 笔交易
        - 企业软件、网络安全、CX 和精选垂直 SaaS
        - 云巨头合作、品类平台打造和灵活交易结构
        - 没有明确的永久持有承诺，基金结构导向强
      - - Valsoft Corporation
        - 永久持有型 VMS 整合者
        - 覆盖 20+ 个行业的 150+ 家公司；2024 年报告收购 25 笔
        - 全球关键垂直软件
        - 长期持有、去中心化运营组和共享 AI 能力
        - AI 看起来是支撑项，但在公开差异化中不如 Beacon 核心
      - - Banyan Software
        - 永久归宿型软件收购方
        - 已收购 100+ 家公司；零出售；宣布 2026 年 €100M 法国资金包
        - 盈利软件公司，通常收入 $2M+，具备经常性收入和细分领导地位
        - 永不出售承诺、高卖方背书能力和 AI 赋能的增长运营
        - 规模证据不如 Constellation 公开，公开资本深度不如巨型资方
      - - 现状 / 内部自建
        - 替代项，而非买方
        - 无需交易；只有现有所有权和内部资源
        - 继续经营现有软件业务的创始人
        - 避开出售摩擦，保留完整控制权
        - 往往缺少 Beacon 所兜售的资本、AI 人才和运营带宽
    notes: 所选行业图谱行覆盖最贴近 Beacon 卖方受众的主要买方原型和现状替代项；本表刻意不穷尽所有软件整合者。
