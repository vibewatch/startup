  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象 / 区间
      - 指标或估值状态
      - 重要性
      - 与 Beacon 的相关性
      - 局限
    rows:
      - - Beacon Series B（据报道）
        - $250M 融资，报告估值 $1.0B
        - 锚定 2025 年末融资标记
        - 显示投资人最初在哪个价格出清连续并购逻辑
        - 官方公告未披露估值标记；第三方报道补足了它
      - - Beacon Series C（据报道）
        - $225M 融资，报告估值 ~$1.4B
        - 公司最新公开价格锚
        - 定义当前入场争议
        - 官方公告同样省略估值和经营分母
      - - Constellation Software
        - 公开申报公司；Q1 2026 收入 $3.181B、FCFA2S $733M，并披露收购支出
        - 成熟软件复利型公司披露应长什么样，Constellation 是最佳标尺
        - 有用的运营和治理标尺，但成熟度不能直接对齐
        - 规模更大、历史更久，验证也比 Beacon 更充分
      - - Valsoft
        - 私有永久持有型垂直软件同行；未披露公开控股公司估值
        - 说明这种所有权模式有真实的私营先例
        - 对永久持有结构和去中心化有参考价值
        - 没有经审计的公开财务披露来锚定估值
      - - AI 原生 / AI 赋能 / 传统软件区间
        - AI 原生为 21.2x 和 11.5x；AI 赋能为 8.5x 和 7.0x；传统 SaaS 为 5.5x 和 3.8x
        - 量化 2026 年软件类别之间的溢价 / 折价差
        - 可用于压力测试 Beacon 在报告估值下需要多少 ARR
        - 区间数据覆盖全市场，并非 Beacon 专属
      - - 公开 SaaS 篮子
        - 截至 2026 年 7 月 3 日，144 家公开 SaaS 公司收入倍数平均值 5.34x、中位数 3.04x
        - 框定普通公开软件在没有稀缺性溢价时的出清水平
        - 如果 Beacon 差异化不如故事暗示那么强，这是重要下行纪律
        - 宽口径篮子，而非定制垂直软件同行组
    notes: 这个基准集穷尽了本章实际使用的估值视角：报告中的 Beacon 轮次、公开软件复利型公司标尺、私有永久持有型同行、分段 AI / 传统软件区间，以及宽口径公开 SaaS 出清范围。
