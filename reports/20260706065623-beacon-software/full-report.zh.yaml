  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从已报道融资估值出发，经过披露和可比估值筛选，落到「继续研究」结论。
    data:
      nodes:
        - id: n1
          label: 已报道估值
          detail: 第三方报道给出 2025 年末 $1.0B、2026 年 6 月约 $1.4B 的标记
        - id: n2
          label: 模式先例
          detail: Constellation 和 Valsoft 证明，长期持有垂直软件是一个真实品类
        - id: n3
          label: 2026 市场筛选
          detail: AI 溢价仍在，但只给耐久且防守扎实的软件资产
        - id: n4
          label: 披露缺口
          detail: Beacon 未披露 ARR、NRR、利润率、收购倍数或融资轮条款
        - id: n5
          label: 输出
          detail: 私有尽调补齐缺口前：继续研究 / 高风险 / 偏贵
