      - number: '6.3'
        title: 留存、切换成本信号，以及围绕流失和集中度的硬证据边界
        blocks:
          - type: paragraph
            body: >-
              公开留存证据更多是结构性的，不是指标型。PowerUp 和 E2E 直接嵌在报名、名册、排期、裁判、纪律和沟通工作流里，俱乐部和联赛若要迁移，就得一次搬走多个相互连接的功能，切换成本因此变高。PowerUp
              的评论样本强化了该判断，其中包括一位使用九年的用户称自己绝不会换系统。College Kickstart 的粘性不同：咨询顾问所有权模式、情景分析、历史活动、PDF 和学校本地语境，把它嵌进年度规划节奏；不过
              College Confidential 讨论串给出本章最清楚的反向证据，认为它对部分学校的评分可能过于保守。Let’s Camp
              同样嵌进预订、支付、退款、入住和报表，评论既显示多年使用，也提到服务和报表上的轻微抱怨。VieFUND 和 MAP Policy Partners
              看起来也有运营粘性，因为它们触及合规、交易、证据留存和卖方执行，但公开的具名客户证据更薄。关键是，没有任何审阅来源披露 Beacon 层面或产品层面的
              NRR、GRR、流失率、续约率、头部客户占比或收入集中度。因此，公开证据可以支撑切换成本假设，却不能支撑量化的耐久性或集中度结论。投资判断仍要回到私有分群数据、客户访谈和集中度明细。
