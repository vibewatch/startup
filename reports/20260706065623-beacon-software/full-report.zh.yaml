  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: Constellation 是标准公开可比公司
        blocks:
          - type: paragraph
            body: >-
              如果投资人想为 Beacon 的模式找最干净的公开基准，答案是 Constellation Software，而不是另一家风投支持的整合平台。Constellation
              已经通过公开文件和运营材料证明，关键任务垂直软件可以被收购、保持相对自治，并靠有纪律的资本配置复利几十年。它的收购标准也与 Beacon 目标宇宙的大致形状吻合：专有 B2B
              软件、经常性收入、低流失，以及可防御的细分位置。规模差距巨大。Beacon 仍主要通过融资轮、投资人文章以及快速但年轻的收购节奏被描述；Constellation 披露的年收入超过 $11.6
              billion，2025 年已完成收购超过 $1.5 billion，年末后还有额外承诺资本。


              因此，Constellation 是标准可比公司，并不是因为 Beacon 已经与它等量齐观。Beacon 的公开说法比 Constellation 更强调面向创始人的永久性叙事，也使用了更明显的 AI
              语言。但在最重要的投资测算问题上——垂直软件买入并长期持有到底能否规模化——Constellation 是最近的已验证先例。它也凸显了 Beacon
              终究需要跨过的门槛：持久资本配置、去中心化执行，以及足够长的公开记录，让市场根据已实现结果评估模式，而不是只看融资势头或产品话术。
