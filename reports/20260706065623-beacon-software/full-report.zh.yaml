  - id: TR005
    title: 缓解措施和否决标准表
    columns:
      - 风险
      - 可监测触发信号
      - 阈值 / 事件
      - 行动含义
    rows:
      - - AI ROI 未达预期
        - 公开或仅限尽调的 KPI 更新显示，试点已进入生产但没有带来可衡量提升
        - 连续两个重大 AI 项目未跑赢基线成本、速度或收入目标
        - 暂停承认 AI 溢价，将 Beacon 按传统软件控股公司重新估值
      - - 整合积压超过收购速度
        - 中央团队无法证明近期交易已完成交割后里程碑
        - 收购速度仍接近每周一项，同时有记录的交割后积压连续两个季度增长
        - 投资前要求放慢速度、增加整合招聘，或降低估值
      - - 市场压力下收购测算变弱
        - 软件可比公司倍数仍受压，而标的价格因财务赞助方竞争保持高位
        - 新交易需要用高于合理下行倍数的价格测算，或测算 IRR 低于门槛
        - 将资本配置纪律视为失效，并大幅降低信心
      - - 连续并购审查加剧
        - 监管机构在软件或相邻工作流市场扩大执法或索取信息
        - 任何 Beacon 交易引发二次请求、调查或市场集中度投诉
        - 提高法律储备假设，并重新评估连续收购模型的可扩展性
      - - 敏感数据控制失效
        - 某组合业务报告与共享系统或母公司流程有关的安全、隐私或合规事件
        - College Kickstart 或 VieFUND 等敏感资产出现重大事件、监管询问或泄露通知
        - 假设信任层不成熟，上调剩余风险，并在推进前要求补救证据
      - - 叙事跑在披露前面
        - 管理层无法在尽调中提供整合计分卡、集中度文件或母公司治理材料
        - 核心尽调事项到深度尽调阶段仍缺失，或只能附带薄弱限制说明才提供
        - 将披露风险视为结构性风险，避免按管理层叙事表面值测算
    notes: 每项否决标准都设计成可用公开信号或标准私有尽调请求监测。目标是在估值标记或客户中断把问题暴露前，抓住投资逻辑漂移。
