      - number: '4.2'
        title: 具名组合显示的收入模式与定价信号
        blocks:
          - type: paragraph
            body: >-
              与控股公司层面相比，公开证据更能在子公司层面支撑一个具体收入故事。具名组合公司页面显示，Beacon 并没有整合成单一、干净的 SaaS 原型。College Kickstart
              混合了消费者订阅定价、面向机构销售的年度订阅和付费附加项。PowerUp 与 E2E 强调演示驱动的俱乐部或联赛管理软件，把注册、支付、排程和运营工作流打包。VieFUND
              是更深的加拿大投资交易商企业后台系统，提供广泛合规和交易功能，但没有公开定价。换句话说，可见组合至少横跨三种变现方式：自助或半自助订阅、年度机构合同，以及报价驱动的企业工作流软件。


              这种组合有经济价值，但分析上仍不完整。它说明 Beacon 正在组装经常性、嵌入工作流的软件，而不是一次性服务商；也暗示公司可以在一个平台内组合消费者、SMB 和类企业定价模式。它还意味着混合 GTM
              动作：有些组合产品可以公开标价或年度费用逻辑，很多产品仍需要演示或直销。公开页面没有揭示的是各收入流权重、背后的续约行为，或软件许可收入、支付挂钩工作流、实施工作和支持之间的毛利率差异。因此，本章能支持多元变现存在，但不能支持收入结构占比或按贡献拆分的收入质量。
