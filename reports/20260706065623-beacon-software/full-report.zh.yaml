  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 轮次经济学与推断稀释
        blocks:
          - type: paragraph
            body: >-
              Beacon 的公开融资记录在头部金额上异常强，在资本结构细节上异常薄。Beacon 自己的 Business Wire 公告与 BetaKit 报道合在一起，基本时间线很清楚：2025 年末完成 $250
              million Series B 轮，2026 年 6 月完成 $225 million Series C
              轮，两轮都被描述为全股权、全部一级发行融资。这足以支持一个明确结论：外部投资人显著提高了公司的股权资本基础；过去两轮的主要机制后果是稀释，而不是已披露杠杆。它不足以发布精确的轮后所有权表。公司自己的 Series
              B 轮公告从未写明后来报道所附的 $1 billion 估值，Series C 轮估值也只出现在第三方报道中。


              这种模糊性很重要。如果报道中的估值数字是投后估值，Series B 和 Series C
              投资人将分别买下公司约四分之一和约六分之一。如果是投前估值，比例会略低，但仍然非常可观。无论哪种情况，公开记录都支持一个判断：Series B
              前持有人在七个月后续融资中遭遇了实质稀释；但资本表的精确形状仍未解决，因为股数、期权池变化、清算优先权、反稀释条款和任何二级交易成分都未披露。因此，财务结论只能给方向，不能给精确数值：Beacon
              明显有强资本通道，但公开证据不足以在合理区间之外承销所有权结果。
