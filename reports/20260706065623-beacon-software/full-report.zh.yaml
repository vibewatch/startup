      - number: '7.3'
        title: 来自更大买方的竞争、估值倍数压缩与资本配置风险
        blocks:
          - type: paragraph
            body: >-
              Beacon 并不是在真空里争抢收购标的。2026 年市场背景有两面性：Bain 显示 M&A 确实反弹，但 BMO、PwC、Multiples.vc 和 AlixPartners 都指向一个更挑剔、按 AI
              姿态高度分化，并对传统软件经济性耐久度存疑的软件市场。roll-up
              模型因此承压：最好的标的——拥有经常性收入、低流失、多元客户和关键任务属性的垂直软件公司——也正是更大买方想买的资产。公开投资方页面把竞争格局摆在台面上。Thoma Bravo、Vista、Hg、Volaris
              和 Constellation 都展示活跃的软件投资组合或买入并持有策略，Constellation 还公开表示偏好经常性收入、多元客户、低流失和领先份额。市场更松时，收购价格会被推高；市场更紧时，Beacon
              会在为优质标的加价和伸手买更弱资产之间陷入更难选择。与此同时，软件估值倍数已经重置，离散度扩大，错估一两笔收购带来的伤害会大于统一牛市里同样的失误。因此，资本配置是核心风险，不是背景因素：如果 Beacon 的
              AI 逻辑无法足够快地改善产品耐久性，公司可能继续收购，却摧毁回报。
