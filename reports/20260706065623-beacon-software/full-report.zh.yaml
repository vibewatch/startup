      - number: '3.3'
        title: 卖方选择、切换成本与分销能力
        blocks:
          - type: paragraph
            body: >-
              对 Beacon 而言，最关键的竞争不是通常 SaaS
              意义上的产品功能竞争，而是争夺创始人信任，以及拥有嵌入小型垂直记录系统中的客户关系的权利。由于交易定价不公开，卖方评估这些买方时，包装几乎和经济条件一样重要：交割速度、出售后自治、领导层延续、AI
              与工程支持，以及买方是否计划转售资产。即便在签署意向书之前，买方选择里也已经存在真实切换成本。深度在意传承、员工连续性和无限期托管的创始人，从 Beacon 转向 Vista 或 Thoma Bravo
              时，并不是在一组完全可替代选项中做选择。


              分销能力造成另一种不对称。Vista 和 Thoma Bravo 可以把软件专长与更广生态结合，包括超大规模云厂商关系、合作伙伴渠道，以及 Beacon 尚未以同等深度公开证明的企业 GTM
              杠杆。Constellation 另有一种信任优势：公开市场披露和数十年的运营记录。因此，Beacon 必须靠更精准的承诺赢下它想要的创始人群体——规模较小、被忽视、由创始人主导的软件所有者，他们看重 AI
              现代化和传承确定性，超过依附场内最大资本池。这是一个真实楔子，但每一次竞争性出售流程中都必须重新赢得这个楔子。
