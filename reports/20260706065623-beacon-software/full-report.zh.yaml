      - CV035
      - CV036
      - CV039
      - CV043
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: Beacon 能否被视为高溢价 AI 赋能软件、普通 SaaS，还是更接近传统软件，会让示意公允价值区间大幅摆动。
    data:
      items:
        - label: 牛市区间
          low: 1.4
          mid: 1.55
          high: 1.7
        - label: 基准区间
          low: 1
          mid: 1.15
          high: 1.3
        - label: 基准偏下区间
          low: 0.8
          mid: 0.9
          high: 1
        - label: 熊市区间
          low: 0.6
          mid: 0.7
          high: 0.8
    approximationNotes: 区间是判断性区间，锚定已报道融资估值、分段的 2026 软件倍数数据，并加入较大披露折价，因为 Beacon 未披露收入和利润率输入，模型无法更精细。
    claimRefs:
      - CV042
      - CV043
      - CV045
      - CV046
      - CV047
