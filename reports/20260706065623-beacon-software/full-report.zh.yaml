      - number: '2.4'
        title: 加拿大生态位势、驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              加拿大支持 Beacon 的模式，但不足以独立支撑它。Inovia 2026 年回顾称，加拿大软件融资相对其他非美国枢纽表现稳健，AI 原生软件已经拿到全国软件融资的大份额。CVCA 仍看到 AI 和 SaaS
              种子、种子前投资活跃；ISED 的小企业统计则强调 SMB 运营基础有多大：雇主企业超过一百万家，几乎全部是中小企业。Statistics Canada 也在按行业和就业规模明确追踪企业 AI 采用，这说明
              SME 数字化已经成为严肃的经济政策议题，而不是边缘话题。


              约束在于规模和退出管道。BDC 的生态报告称，加拿大正在产生创新，但没有持续捕获长期价值，因为交易数量更少、Series A 及以后资本更稀缺，M&A 加 IPO 的流动性也偏弱。这一点直接关系
              Beacon。多伦多身份有利于招聘、政策对齐和寻找创始人关系，但只靠加拿大的策略很可能太窄。最可信的命题是跨境版本：把加拿大作为人才和平台基地，再从更大的北美创始人持有垂直软件池里寻找标的。模式仍有真实约束——安全、定价、整合能力，以及关于已实现组合结果的公开证据有限——但宏观背景足够支持，因此这些约束应被视为执行风险，而不是市场不存在的证据。
