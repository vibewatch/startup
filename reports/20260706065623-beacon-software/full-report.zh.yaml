      - number: '8.2'
        title: Roll-up 可比框架与 AI 溢价
        blocks:
          - type: paragraph
            body: >-
              可比公司问题最终框定了 Beacon 的估值。Constellation 是底层商业模式最干净的公开运营基准：它的筛选标准强调经常性收入、多元客户、低流失和关键任务软件；其 2026 年 Q1
              公开文件披露了收入结构、现金生成、递延收入、现金余额和收购支出，细度远超 Beacon。Valsoft 在所有权模式上提供了有用的私有类比，但披露质量不同。Valsoft 的公开页面和 2025 年 10
              月运营集团公告显示，永久持有型垂直软件可以在去中心化结构中扩张，但仍远未达到上市公司文件的透明度。市场数据来源随后解释了 Beacon 为什么可能应得一定溢价，却不能自动进入最高 AI
              估值档。PwC、Multiples.vc、Silverpeak、Windsor Drake、Kroll、Sapphire、SaasRise、Breakwater、Public SaaS Companies 和
              Scalar 从不同角度描述了同一个 2026 年图景：投资者和买方仍愿意为具备工作流引力、专有上下文、强留存和清晰 AI
              赋能差异化的软件加价；但正在压缩防守力弱、服务占比重或通用型软件的估值。因此，Beacon 既不应被估作纯 AI 基础设施赢家，也不应被估作普通传统 roll-up。Beacon 处在更难的中间地带：一家 AI
              赋能的垂直软件控股公司，其溢价取决于 AI 层是否能产生可衡量的耐久性，而不只是更好听的融资叙事。
