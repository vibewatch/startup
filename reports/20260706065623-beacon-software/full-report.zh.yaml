      - number: '2.2'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Beacon 目标市场的买方逻辑更像业主主导的运营软件，而不是典型 CIO 主导的企业采购。IDC 2026 年研究显示，SMB 正通过 GenAI 工具和云市场发现软件，但它们最在意的仍是部署容易、ROI
              可衡量，以及产品能否适配可能完全没有全职 IT 员工的团队。这一点与 Beacon
              高度契合。在微型和小型组织里，实际付款方往往是业主、总经理、主计长或财务负责人；日常用户是行政和运营人员；只有软件贴近既有工作流，而不是另起一个 AI 目的地产品，采用才跑得通。


              这就是为什么嵌入式 AI 比炫目的 AI 更重要。IDC 明确表示，已经看到成效的 SMB 通常是在自己信任的 CRM、ERP、会计或工作流平台里打开 AI。Salesforce 的调研强化了经济侧：多数 SMB
              至少在试用 AI，大多数 AI 用户报告收入提升和利润率改善，买方也愿意为可信供应商支付更高价格。但同一批来源也说明，Beacon
              不能假设落地毫无阻力。安全是最高购买门槛之一，用户采用仍是实际瓶颈，不可预测的用量定价也会迅速摧毁信任。换句话说，Beacon 最好的目标公司不只是有忠诚客户的垂直产品；它们还是核心记录系统，AI
              可以在熟悉工作流里、在已受信任品牌之下、以低实施摩擦的方式开启。
