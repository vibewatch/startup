  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值事实与披露质量
        blocks:
          - type: paragraph
            body: >-
              Beacon 的公开融资记录支撑了增长动能，却不足以精确承销估值。官方 2025 年 11 月和 2026 年 6 月公告清楚确认了两轮规模很大的全额主融资、资金用途，以及管理层认为 AI
              可以改造被忽视垂直软件的观点。但公告没有披露判断价格是否有吸引力所需的估值标记、收入基数、利润率、留存或股权结构条款。第三方报道补上了头条数字：BetaKit 将 $250M Series B 对应到 $1.0B
              估值，并将 $225M Series C 对应到约 $1.4B。报道与官方公告结合，足以让人把 Beacon
              视为一家真实且融资能力异常强的软件整合者。更难的问题是，公开材料是否支撑该价格，而不只是证明价格存在。答案是否定的。公开证据证明了融资渠道、收购节奏和管理层叙事；却没有证明估值背后的收入与现金流分母。TNW
              观察到，Beacon 曾暗示上一轮可能是最后一轮，却仅七个月后又回来融了更大一轮，该事实让上述区别更尖锐。2026 年估值最好被视为一个融资数据点，而不是已经充分证明的公允价值。
