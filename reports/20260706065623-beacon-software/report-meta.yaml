companyProfile:
  summary: Beacon Software is a Toronto-based permanent-capital holding company that acquires founder-led vertical software businesses serving everyday-economy workflows and then modernizes them with shared engineering, AI, fintech, and go-to-market capabilities. Public evidence most consistently describes the company as launched in 2024 by Nilam Ganenthiran and Divyahans (Divya) Gupta, with named portfolio exposure across sports, education, campgrounds, financial-services back office, and policy-enforcement software. The business has attracted unusually strong follow-on financing for its age, but still discloses far less than investors would normally want for a full holdco underwriting.
  foundedDate: '2024-01-01'
  founders:
    - name: Nilam Ganenthiran
      role: Founder & CEO
      background: Former Instacart president and former D1 Capital partner with both operating and capital-allocation experience.
      claimRefs: [CO009, CO011]
    - name: Divyahans (Divya) Gupta
      role: Co-Founder
      background: Former Sequoia partner and former engineer at Databricks, Airbnb, and Palantir.
      claimRefs: [CO010, CO012]
  foundingLocation: Toronto, Ontario, Canada
  headquarters: Toronto, Ontario, Canada
  productSummary: Acquire and hold niche software businesses, preserve their brands and customer relationships, and improve their products and operations through a shared AI-native operating platform.
  customerFocus: Founder-led vertical software businesses for acquisition; downstream end users include clubs, schools, campgrounds, dealers, and other local institutions.
  businessModel: Permanent-capital software holding company that compounds recurring software cash flows by acquiring profitable assets and modernizing them with centralized product, engineering, AI, and GTM support.
  stage: Series C / Growth
  fundingStatus: '$250M Series B in 2025 and $225M Series C in 2026; more than $550M of disclosed capital and a latest public valuation around $1.4B.'
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO007, CO009, CO010, CO013, CO019, CO021, CO022, CO023]
