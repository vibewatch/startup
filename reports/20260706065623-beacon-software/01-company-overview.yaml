  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Public board composition, investor control rights, and governance documents are not disclosed in the
      reviewed source set.
    whyItMatters: Beacon’s strategy depends on rapid capital deployment and founder alignment, so board control and protective
      rights matter for execution and downside analysis.
    diligencePath: Request an updated cap-table and board observer/seat summary from management or an investor reference.
    relatedQuestionRefs:
    - QO008
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: legal-entity
    missingEvidence: The precise Ontario or federal legal entity record for Beacon Software was not identified directly from
      public registries during this run.
    whyItMatters: Incorporation details help confirm founding chronology, directors, and any operating entities relevant to
      acquisitions across Canada and the United States.
    diligencePath: Run a paid or authenticated search in the Ontario Business Registry and Corporations Canada using the exact
      legal entity name from company counsel.
    relatedQuestionRefs:
    - QO025
  - type: private-evidence-only
    severity: material
    topic: portfolio-scale
    missingEvidence: Beacon has not published a complete list of acquired or partnered businesses or a precise current company
      count.
    whyItMatters: A roll-up thesis is hard to assess without knowing which verticals, customer bases, and integration burdens
      are actually inside the portfolio.
    diligencePath: Request a portfolio list with acquisition dates, sectors, and current operating managers; reconcile it
      against M&A announcements and customer sites.
    relatedQuestionRefs:
    - QO017
    - QO018
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: Public sources conflict between a 2024 founding/launch and a description that implied a 2023 origin.
    whyItMatters: The exact start date changes how investors interpret acquisition velocity, time-to-unicorn, and maturity
      of the internal operating platform.
    diligencePath: Confirm incorporation date and first close date directly with the company or through the legal entity record.
    relatedQuestionRefs:
    - QO004
  - type: private-evidence-only
    severity: material
    topic: metrics-disclosure
    missingEvidence: Beacon has not publicly disclosed exact revenue, headcount, customer count, concentration metrics, or
      the fully sourced valuation mechanics behind the June 2026 round.
    whyItMatters: The missing metrics limit any attempt to benchmark current operating leverage or underwrite the speed of
      the 2025-2026 valuation step-up.
    diligencePath: Request current ARR, revenue growth, gross margin, headcount, top-customer concentration, and the detailed
      post-Series-C cap-table from management or investors.
    relatedQuestionRefs:
    - QO015
    - QO020
    - QO023
