            body: >-
              The highest-quality proof in this chapter is direct deployment evidence on customer-branded pages. West
              Ottawa Soccer Club, Calgary Foothills Soccer Club, North Simcoe Soccer Club, and Saint John Soccer Club
              all show live PowerUp registration or PowerUp Connect surfaces, while Ontario Soccer League shows active
              schedules on E2E. Those are stronger than a logo wall because they show the software in use for
              registrations, calendars, rosters, or league operations. College Kickstart has a mixed proof set: its own
