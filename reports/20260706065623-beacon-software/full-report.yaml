      - number: '7.4'
        title: Regulatory scrutiny, disclosure risk, and the portfolio control surface
        blocks:
          - type: paragraph
            body: >-
              Beacon’s strategy also carries a real regulatory and disclosure burden. The FTC and DOJ have now stated in
              multiple 2024 materials that serial acquisitions and roll-up strategies can harm competition, sometimes
              through strings of deals that sit below ordinary Hart-Scott-Rodino thresholds. The USAP case is not a
              software analogue, but it demonstrates how a private-equity-backed roll-up can be framed when agencies
              believe acquisitions and related conduct have reduced competition and raised prices. Separate from
              antitrust, the SEC’s 2024 AI-washing actions matter because Beacon markets itself as AI-native. The SEC’s
              press release and orders against Delphia and Global Predictions show that claims about AI capability,
              performance, and controls can become legal liabilities if they are not substantiated and governed. The
              portfolio itself increases the difficulty of staying clean. College Kickstart’s privacy policy says data
              may be shared with parent Beacon and affiliates for internal operational and portfolio-management
              purposes, but it also says the product does not currently use AI tools that process, train on, or share
              student data. VieFUND, by contrast, discloses KYC-heavy dealer workflows, MFDA-style compliance, audit
              trails, and third-party infrastructure links. Those are not red flags by themselves. They do mean that
              Beacon’s parent-level control burden spans student data, financial compliance, and AI marketing claims at
              the same time while public holdco disclosure remains thin.
