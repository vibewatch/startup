      - number: '2.4'
        title: Canadian ecosystem posture, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Canada is supportive but not self-sufficient for Beacon’s model. Inovia’s 2026 review says Canadian
              software funding held up well against other non-US hubs and that AI-native software already captures a
              large share of national software funding. CVCA still sees active seed and pre-seed investing in AI and
              SaaS, while ISED’s small-business statistics underline how large the SMB operating base is: more than one
              million employer businesses, almost all of them small or medium sized. Statistics Canada is also
              explicitly tracking business AI adoption by sector and employment size, which signals that SME
              digitization is now a serious economic-policy topic rather than a side conversation.


              The constraint is scale and exit plumbing. BDC’s landscape report says Canada is generating innovation but
              not consistently capturing long-term value because fewer deals get done, Series A and later capital is
              scarcer, and M&A plus IPO liquidity are weak. That matters directly for Beacon. A Toronto identity is a
              feature for recruiting, policy alignment, and sourcing founder relationships, but a Canada-only strategy
              would likely be too narrow. The most credible version of the thesis is cross-border: use Canada as a
              talent and platform base, then source across the much larger North American pool of founder-owned vertical
              software. The model still has real constraints—security, pricing, integration capacity, and limited public
              evidence on realized portfolio outcomes—but the macro backdrop is supportive enough that those constraints
              should be treated as execution risks, not as proof the market is imaginary.
