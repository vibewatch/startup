        - stage: Operate
          label: 'Daily workflows run inside the product: scheduling, bookings, planning, trades, or seller monitoring.'
        - stage: Coordinate
          label: Multiple stakeholders work inside shared views, communications, or compliance checkpoints.
        - stage: Report
          label: History, reports, dashboards, and evidence capture accumulate inside the system.
