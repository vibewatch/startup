  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Facts and Disclosure Quality
        blocks:
          - type: paragraph
            body: >-
              Beacon’s public financing record supports momentum, but not precise valuation underwriting. The official
              November 2025 and June 2026 releases clearly establish two very large all-primary financings, the
              strategic use of proceeds, and management’s view that AI can modernize overlooked vertical software. They
              do not, however, publish the valuation marks, revenue base, margin profile, retention, or cap-table terms
              needed to judge whether the price is attractive. Third-party reporting fills in the headline numbers:
              BetaKit attached a $1.0 billion valuation to the $250 million Series B and roughly $1.4 billion to the
              $225 million Series C. Those reports, together with the official releases, make it reasonable to treat
              Beacon as a real and unusually well-financed software consolidator. The harder question is whether the
              public file supports the price rather than simply the existence of the price. On that point, the answer is
              no. Public evidence substantiates funding access, acquisition pace, and management narrative; it does not
              substantiate the revenue and cash-flow denominator behind the mark. TNW’s observation that Beacon came
              back for a larger round only seven months after signaling that the prior round might be its last sharpens
              that distinction. The 2026 mark is best treated as a financing datapoint, not as a fully proven fair
              value.
