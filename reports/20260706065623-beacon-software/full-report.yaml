      - number: '3.4'
        title: Durability of differentiation and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Beacon’s differentiation is strongest when the claim is phrased narrowly: it is trying to be the AI-first
              permanent owner of small, founder-led vertical software companies that larger sponsors or public
              consolidators may overlook or under-serve. In that framing, Constellation is the public benchmark, Valsoft
              and Banyan are the closest seller-message peers, and Vista and Thoma Bravo are the operating-and-capital
              overhang. The problem is that each rival cluster can erode part of the thesis. Permanent ownership is not
              unique. AI operating support is not unique. Seller flexibility is not unique. What remains relatively
              distinctive is the combination, plus the explicit focus on rebuilding neglected products with AI rather
              than merely optimizing cost structures around them.


              The strongest public adverse evidence therefore goes straight at repeatability. The Next Web’s
              critique—that the AI roll-up may still just be private equity with sharper marketing and a GPU—captures
              the core risk. Beacon has funding, pace, and strong investor validation, but not yet a long public record
              of cohort-level outcomes that proves AI-led modernization repeats across dozens of acquired assets. Until
              that evidence is available, Beacon’s moat should be treated as plausible rather than settled. Its
              competitive position is promising, but the burden of proof remains on management to show that the model
              compounds like Constellation, wins founder trust like Banyan and Valsoft, and still keeps enough technical
              edge to resist being copied by better-capitalized sponsor platforms.
