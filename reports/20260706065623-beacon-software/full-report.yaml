              Lutheran High School, Shady Side Academy, Baldwin School, and Upward College Planning, but those are still
              vendor-published references; the stronger direct evidence is Carondelet High School's own 2026 Kickstart
              program page and an independent consultant blog stating that College Kickstart is used for all student
              clients. Let's Camp follows a similar pattern: its own case-study hub names Big Bend Conservation Area,
              Sherwood Forest Golf and Country Club, and Emerald Lake Regional Park, while Capterra independently names
              Avoca Birches Campground as a user since 2021. By contrast, VieFUND and MAP Policy Partners clearly
              describe their target customer types, but the public pages reviewed here do not surface named customer
