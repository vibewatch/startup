        - Do not rely on the mark alone; re-underwrite ownership outcomes
      - - AI ROI is not measurable
        - Management cannot show that automation or product rebuilds produced KPI lift across cohorts
        - The AI thesis becomes marketing rather than valuation support
        - Treat Beacon more like a traditional roll-up and cut the premium
    notes: >-
      These are the smallest number of variables most likely to move Beacon from premium candidate to overvalued
      financing story.
