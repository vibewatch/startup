  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview and what likely breaks first
        blocks:
          - type: paragraph
            body: >-
              Beacon’s underwriting challenge is not a lack of strategic ambition but the stacking of several hard
              things at once. Public sources show a parent company trying to buy software businesses at roughly one per
              week, fold them into a shared operating platform, and use AI to accelerate engineering, automation, and
              growth. That combination can work, but the public evidence base is still narrative-heavy. The best
              independent evidence suggests that enterprise AI programs often fail because leadership frames the wrong
              problem, data quality is weak, or infrastructure and trust controls lag rollout. At the same time, the
              software market in 2026 is punishing weak durability narratives and questioning how AI changes pricing
              power and terminal value. That means the first visible failure is unlikely to be an immediate shutdown of
              acquired products; Beacon explicitly promises continuity at close. The more likely first break is softer
              and easier to miss: KPI stagnation on AI initiatives, slower integration progress than the acquisition
              pace implies, or acquisition returns that weaken as software multiples compress and larger sponsors stay
              active. The chapter’s base view is therefore that execution and capital-allocation discipline matter more
              than the headline funding story.
