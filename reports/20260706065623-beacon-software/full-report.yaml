      - number: '7.5'
        title: Dependency map, people risk, and concrete thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The practical question for investors is what must be true for Beacon’s story to keep working. Public
              evidence suggests that people, governance, and dependency management are the hard constraints. Beacon’s
              jobs page shows central legal, M&A, engineering, and product functions, which is useful, but it does not
              prove that integration staffing is keeping pace with deal volume. The reviewed sources also do not show
              holdco-level scorecards for retention, concentration, synergy realization, or security governance. That
              absence matters because several dependencies are visible already. Beacon depends on continuing access to
              attractive targets despite larger buyers staying active. It depends on AI initiatives showing measurable
              ROI before cost, privacy, and security drag the narrative down. It depends on portfolio products with very
              different control surfaces—such as College Kickstart and VieFUND—staying operationally stable while the
              parent layers on shared systems. If the thesis weakens, the cleanest public triggers to monitor are slower
              acquisition cadence, fewer concrete product-integration wins, more talk about AI capability than evidence
              of KPI lift, or a harder fundraising and valuation environment for software assets. Those are the signals
              that would indicate the model is becoming story-heavy and return-light.
