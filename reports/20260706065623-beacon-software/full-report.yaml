companyProfile:
  summary: >-
    Beacon Software is a Toronto-based permanent-capital holding company that acquires founder-led vertical software
    businesses serving everyday-economy workflows and then modernizes them with shared engineering, AI, fintech, and
    go-to-market capabilities. Public evidence most consistently describes the company as launched in 2024 by Nilam
    Ganenthiran and Divyahans (Divya) Gupta, with named portfolio exposure across sports, education, campgrounds,
    financial-services back office, and policy-enforcement software. The business has attracted unusually strong
    follow-on financing for its age, but still discloses far less than investors would normally want for a full holdco
    underwriting.
