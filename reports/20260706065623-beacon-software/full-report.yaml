      - number: '7.3'
        title: Competition from larger buyers, valuation compression, and capital allocation risk
        blocks:
          - type: paragraph
            body: >-
              Beacon is not competing for acquisitions in a vacuum. The 2026 market backdrop is two-sided: Bain shows a
              real M&A rebound, but BMO, PwC, Multiples.vc, and AlixPartners all point to a software market that is
              increasingly selective, highly segmented by AI posture, and skeptical about the durability of legacy
              software economics. That is dangerous for a roll-up model because the best targets—mission-critical
              vertical software companies with recurring revenue, low attrition, and diversified customers—are exactly
              the assets larger buyers also want. Public sponsor pages make that competition visible. Thoma Bravo,
              Vista, Hg, Volaris, and Constellation all advertise active software portfolios or buy-and-hold strategies,
              and Constellation openly says it prefers recurring revenue, diversified customers, low attrition, and
              leading share. In a looser market, that can inflate acquisition prices; in a tighter market, it can leave
              Beacon with a harder choice between paying up for quality or stretching into weaker assets. Meanwhile,
              software multiples have reset and dispersion has widened, so mispricing one or two acquisitions can hurt
              more than it would in a uniform bull market. Capital allocation is therefore a core risk, not a background
              consideration: if Beacon’s AI thesis fails to improve product durability fast enough, the company could
              keep buying but destroy returns.
