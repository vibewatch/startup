      - number: '3.3'
        title: Seller choice, switching costs, and distribution power
        blocks:
          - type: paragraph
            body: >-
              For Beacon, the most relevant competitive battle is not product-feature competition in the usual SaaS
              sense; it is a contest for founder trust and for the right to own the customer relationship embedded in
              small vertical systems of record. Because transaction pricing is private, sellers evaluate these buyers on
              packaging as much as on economics: speed to close, post-sale autonomy, leadership continuity, AI and
              engineering support, and whether the buyer intends to resell the asset. That creates real switching costs
              in buyer choice even before a letter of intent is signed. Founders who care deeply about legacy, staff
              continuity, and indefinite stewardship are not choosing among perfect substitutes when moving from Beacon
              to Vista or Thoma Bravo.


              Distribution power creates another asymmetry. Vista and Thoma Bravo can pair software specialization with
              broader ecosystems, including hyperscaler relationships, partner channels, and enterprise go-to-market
              leverage that Beacon has not publicly matched at the same depth. Constellation has a different trust
              advantage: public-market disclosure and a decades-long operating record. Beacon therefore has to win by
              making a tighter promise to the specific founder cohort it wants—smaller, overlooked, founder-led software
              owners who value AI modernization and succession certainty more than they value attachment to the biggest
              capital pool in the room. That is a real wedge, but it is a wedge that must be continuously re-earned in
              every competitive sale process.
