      - number: '4.3'
        title: Unit economics, capital adequacy, and public-comparable benchmarking
        blocks:
          - type: paragraph
            body: >-
              Beacon’s own and third-party materials contain enough signal to describe the shape of the unit-economics
              thesis but not enough to prove it numerically. The company claims to buy profitable software businesses,
              accelerate them with a shared AI platform, and has said that this approach produced more than 50% EBITDA
              growth over the last year. Public reporting also says Beacon itself is profitable and has reached more
              than $550 million of disclosed capital while accelerating acquisition cadence to about one deal per week.
              Those are meaningful indicators that the platform is not capital-starved and that management believes the
              economics justify additional scale. But they stop short of a true underwriting package because there is no
              disclosed revenue base, no EBITDA margin, no gross-margin bridge, no CAC or payback metric, no NRR or
              churn, and no cash-versus-burn disclosure that would allow a runway calculation.


              The contrast with Constellation Software is instructive. Constellation’s Q1 2026 filing publishes exactly
              the types of metrics Beacon withholds: quarterly revenue, acquisition spend including deferred
              consideration, operating cash flow, free cash flow, cash balances, debt with and without recourse,
              deferred revenue, holdback payables, and revenue mix by recurring, services, hardware, and license lines.
              That does not make Constellation a direct apples-to-apples valuation comparable, but it does show what
              mature serial-acquirer disclosure looks like. Against that benchmark, Beacon currently supports a
              thesis-level verdict—well-capitalized, acquisition-led, AI-augmented—but not a cash-flow-level verdict on
              revenue quality, margin path, or capital adequacy.
