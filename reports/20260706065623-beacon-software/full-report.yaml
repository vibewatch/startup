  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and multiple sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Beacon is not chasing the whole software market. Its own positioning and investor narrative point to a
              narrower boundary: founder-built, load-bearing vertical software that runs real-world workflows for small
              and mid-sized operators, schools, community organizations, and other local institutions. That means
              included spend is not just the recurring subscription for the system of record; it also includes adjacent
              modules such as workflow automation, communications, embedded compliance, and the operating-layer upgrades
              that can be added after an acquisition. Excluded spend should include horizontal productivity suites,
              consumer apps, pure services revenue, and software categories that do not control a mission-critical
              workflow. The boundary matters because Beacon’s value proposition depends less on raw seat count than on
              owning trusted workflow depth that can survive a control change and absorb AI improvements without forcing
              a rip-and-replace migration.


              On that narrower framing, the retained evidence supports a large market but not a single clean TAM.
              Mordor’s broad SMB software lens sits at $77.33B in 2026, while its vertical-software lens is much larger
              at $164.06B in the same year and grows faster through 2031. Both markets are already North America-heavy,
              which matters because Beacon is Toronto-rooted but operates against a US-and-Canada acquisition thesis. A
              useful underwriting conclusion is that Beacon does not need to win a meaningful share of generic SMB
              software to matter. It only needs a thin slice of embedded, founder-owned vertical assets with trusted
              customer workflows. The diligence problem is that this narrower acquisition universe is qualitative in
              public sources, so a SAM or SOM must be treated as evidence-constrained rather than claimed with false
              precision.
