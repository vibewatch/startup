chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Permanent-Capital Thesis
        blocks:
          - type: paragraph
            body: >-
              Beacon’s official web presence confirms that the user-supplied website, beaconsoftware.com, is the correct
              live company site: it returns a functioning homepage and frames Beacon as a “permanent home” for essential
              businesses rather than a software vendor selling a single application. The core pitch is consistent across
              the website, investor notes, and press coverage. Beacon acquires profitable, founder-led vertical software
              or service businesses that already matter to their customers, keeps those brands running, and layers on a
              centralized operating system that includes engineering talent, AI tools, automation, and go-to-market
              support. That is materially different from the standard private-equity playbook Beacon is explicitly
              positioning against. Its own copy stresses permanent ownership, founder-specific deal structures, and fast
              execution from letter of intent to close, while independent reporting quotes Ganenthiran calling the
              company the “anti-private equity firm.”


              The thesis is also unusually specific about where Beacon wants to play. Instead of broad enterprise
              software categories, the company keeps pointing investors toward “Main Street” or everyday-economy
              workflows: youth sports, campgrounds, finance back offices, education tools, and other load-bearing but
              often overlooked niches. Lightspeed and General Catalyst both describe the opportunity as fragmented
              vertical software with durable customer trust but underinvested product stacks. That logic matters because
              it explains why Beacon is buying operating businesses rather than only selling AI tools to them. The
              company appears to believe that ownership of the customer relationship, embedded workflow data, and
              distribution channel is the scarce asset, while AI and software talent are the accelerants Beacon can
              centralize. The result is a hybrid identity: part acquisition vehicle, part software platform, and part
              operating partner for legacy but profitable niche applications.
