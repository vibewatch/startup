  - id: FV001
    title: Recommendation Logic
    type: flow
    layout: wide
    summary: >-
      The recommendation moves from reported financing marks through disclosure and comp filters to a research-more
      conclusion.
    data:
      nodes:
        - id: n1
          label: Reported marks
          detail: $1.0B in late 2025 and ~$1.4B in June 2026 through third-party reporting
        - id: n2
          label: Model precedent
          detail: Constellation and Valsoft validate permanent-hold vertical software as a real category
        - id: n3
          label: 2026 market filter
          detail: AI premiums persist, but only for durable and well-defended software assets
        - id: n4
          label: Disclosure gap
          detail: Beacon does not publish ARR, NRR, margins, purchase multiples, or round terms
        - id: n5
          label: Output
          detail: Research-more / high risk / stretched until private diligence closes the gap
      edges:
        - from: n1
          to: n2
          label: needs context from
        - from: n2
          to: n3
          label: must clear
        - from: n3
          to: n4
          label: still depends on
        - from: n4
          to: n5
          label: drives
    claimRefs:
      - CV009
      - CV017
      - CV024
      - CV033
      - CV044
      - CV047
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    layout: wide
    summary: >-
      The same ~$1.4B reported mark implies very different ARR requirements depending on which 2026 software band
      actually applies.
    data:
      items:
        - label: 11.5x AI-native M&A
          value: 121.7
        - label: 7.0x AI-enabled M&A
          value: 200
        - label: 5.34x public SaaS average
          value: 262.2
        - label: 3.8x legacy SaaS M&A
          value: 368.4
        - label: 3.04x public SaaS median
          value: 460.5
      yAxis:
        label: ARR required for ~$1.4B valuation (USD M)
    approximationNotes: >-
      Values divide the reported June 2026 valuation marker by third-party 2026 software multiple bands; they illustrate
      denominator sensitivity rather than a Beacon-reported ARR figure.
    claimRefs:
      - CV035
      - CV036
      - CV039
      - CV043
      - CV044
