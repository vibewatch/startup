      - number: '8.4'
        title: Diligence Asks and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The decision can move quickly in either direction with a short set of private diligence answers. If Beacon
              can show clean recurring revenue, durable expansion, strong gross margins despite AI and integration
              costs, and disciplined purchase pricing across cohorts, then the current mark can look much more
              reasonable. If the missing evidence instead shows services-heavy revenue, weak retention, expensive
              integrations, or round terms that favor new investors over common-equity economics, the valuation case
              compresses fast toward ordinary software bands. That is the key public-evidence boundary for this chapter:
              the thesis does not fail first on ambition, and it does not fail first on capital access. It fails first
              on whether the AI premium is measurable in the numbers. Because Beacon has chosen not to publish those
              numbers, investors should treat the current valuation as conditional. The practical implication is simple:
              do not underwrite the $1.4 billion mark on story alone, and do not let the Constellation or Valsoft
              analogy substitute for Beacon-specific proof on ARR quality, margin structure, integration KPIs, and
              preference overhang.
