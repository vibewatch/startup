      - number: '3.2'
        title: Sponsor benchmarks versus permanent-home peers
        blocks:
          - type: paragraph
            body: >-
              The rest of the landscape splits into two important clusters. Vista Equity Partners and Thoma Bravo are
              the scale benchmarks: they bring far deeper capital pools, more mature software operating ecosystems, and
              increasingly explicit AI programs. Vista now markets itself as a leader in enterprise software and AI
              investing, while its Agentic AI Factory turns AI from a buzzword into a portfolio-wide operating system.
              Thoma Bravo is similarly explicit that hyperscaler relationships, AI tooling, and category
              platform-building are now part of the sponsor playbook. These firms matter because they can compress
              Beacon’s claimed AI advantage from above. If AI modernization becomes standard sponsor operating practice,
              Beacon cannot rely on AI language alone as a moat.


              Valsoft and Banyan matter for the opposite reason. They are closer to Beacon on the seller narrative. Both
              explicitly market themselves as long-term or never-sell homes for software businesses, both emphasize
              autonomy and legacy preservation, and both now pair that permanence story with shared AI or growth-ops
              support. In other words, Beacon is not the only buyer telling founders that a sale can preserve culture,
              leadership, and long-duration ownership. Its edge is that it packages those promises around a younger,
              more visibly AI-native modernization thesis and a tighter focus on smaller founder-led everyday-economy
              assets. But the permanent-home cluster proves that Beacon’s seller message already has credible
              alternatives.
