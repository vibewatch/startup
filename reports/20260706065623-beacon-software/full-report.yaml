      - number: '1.2'
        title: Founders, Leadership, and Geography
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong on who founded Beacon, even if it is thinner on governance than on biography.
              Nilam Ganenthiran is consistently identified as founder and CEO, with prior operating credibility from
              Instacart and investing experience from D1 Capital. Divyahans Gupta—widely referenced as Divya Gupta—is
              consistently identified as the technical co-founder and original CTO, with a rare mix of venture and
              engineering experience spanning Sequoia, Databricks, Airbnb, and Palantir. Together, those backgrounds
              support the company’s promise to underwrite acquisitions, recruit technical talent, and then modernize
              acquired codebases rather than only optimize costs. Lightspeed’s account that it had been discussing the
              concept with Ganenthiran since 2021 further suggests Beacon was not improvised in reaction to the 2025 AI
              funding cycle.


              Geographically, Toronto is the clearest anchor. Multiple sources call Beacon Toronto-based, and the E2E
              Soccer acquisition release says the company is headquartered in Toronto. By June 2026, however, Beacon was
              also signaling a deeper San Francisco footprint. Its Series C release added former Instacart and AngelList
              executives Mark Schaaf and Goutham Buchi and located them in a new San Francisco office, implying a
              dual-center model: Toronto as the holdco identity and Canadian acquisition base, with San Francisco as a
              talent and executive hub. What remains missing is the formal governance layer. None of the reviewed
              official or investor materials disclosed the board, voting control, or protective rights structure behind
              the financing rounds. That makes the leadership bench credible but the exact power map opaque, which is
              important for any acquisition platform expected to deploy capital at high velocity.
