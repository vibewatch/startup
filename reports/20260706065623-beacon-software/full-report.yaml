      - number: '1.3'
        title: Capital Base and Stakeholder Map
        blocks:
          - type: paragraph
            body: >-
              Beacon’s capital formation is one of the cleanest parts of the public record. The late-2025 Series B is
              well corroborated by the company, investor blogs, Canadian press, Reuters syndication, and Crunchbase
              News: $250 million led by General Catalyst, Lightspeed, and D1 Capital at a $1 billion valuation, taking
              cumulative disclosed funding to $335 million. Business Wire also named BDT & MSD Partners, Chris Rogers,
              and Sator Grove among the additional participants, while General Catalyst separately said it had already
              led Beacon’s Series A before doubling down in the Series B. That matters because it implies Beacon had
              substantial early institutional support before becoming a unicorn, even though the precise size and timing
              of the Series A are still not transparent in the public file.


              The next capital step came quickly. In June 2026, Beacon announced a $225 million Series C led by General
              Catalyst and HarbourVest, with participation from Lightspeed, Intrepid Growth Partners, BDT & MSD
              affiliate funds, and others. That pushed total disclosed capital above half a billion dollars within
              roughly two years of launch. BetaKit, citing The Globe and Mail, reported a $1.4 billion valuation, but
              that number was not disclosed in Beacon’s own press release and should therefore be treated as a strong
              but indirect current mark. The stakeholder implication is clear even without a cap table: Beacon now has a
              deep bench of blue-chip venture backers willing to fund an acquisition engine before full holdco financial
              disclosure is public. The less positive read is that valuation marks and investor appetite have moved
              faster than disclosure depth around ownership, governance, and portfolio-level economics.
