  topStrengths:
    - >-
      More than a decade in crypto market structure plus official claims of broad client, venue, and asset coverage give
      GSR a credible institutional-liquidity position.
    - >-
      SC Ventures becoming the first external strategic shareholder adds validation, potential bank-adjacent
      distribution leverage, and tokenization ecosystem relevance.
    - >-
      GSR has expanded beyond pure market making through GSR One, broker-dealer infrastructure, the Autonomous/Architech
      acquisition, and tokenization partnerships such as Libeara, DigiFT, and Chainlink.
  topRisks:
    - >-
      Current consolidated revenue mix, margin quality, cash, leverage, and customer concentration are not publicly
      disclosed, limiting underwriting confidence at the reported unicorn mark.
    - >-
      Principal-trading conflicts, sector-wide market-manipulation scrutiny, and multi-jurisdiction regulatory change
      create trust and compliance execution risk.
    - >-
      The May 2026 round size, security terms, board rights, and liquidation-preference stack remain undisclosed, so
      new-money downside protection cannot be evaluated from public evidence.
    - >-
      Leadership turnover in 2024, acquisitions, and regulated expansion increase execution complexity while current
      control evidence remains mostly narrative rather than audited.
  unresolvedGaps:
    - >-
      Exact SC Ventures check size, ownership percentage, board rights, liquidation preferences, anti-dilution terms,
      and whether further strategic capital closed after May 2026.
    - >-
      Current 2025 and YTD 2026 revenue, margin, cash, debt, trading-capital usage, and segment mix across market
      making, OTC, advisory, and broker-dealer activities.
    - >-
      Top-customer and counterparty concentration, retention, referenceability, and whether the 1,000-plus client claim
      reflects active revenue-contributing relationships.
    - >-
      Audited evidence of market-surveillance, conflict-management, partner SLA, cybersecurity, and post-acquisition
      integration performance.
