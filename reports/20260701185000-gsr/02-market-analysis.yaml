chapter:
  number: 2
  title: Market Analysis
  summary: GSR operates in institutional digital-asset capital markets, where public sizing is large but sharply
    boundary-dependent. The most supportable market view narrows broad crypto, stablecoin, and tokenized-RWA pools
    into liquidity, execution, treasury, and regulated tokenization workflows, with adoption pulled by 2026 regulatory
    clarity and institutional participation but constrained by volume cyclicality, market concentration, and compliance
    risk.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and substitutes
  body: 'GSR should be assessed as an institutional digital-asset capital-markets infrastructure company, not as
    a generic crypto asset bet. The public service boundary includes market making, OTC execution, options, DeFi
    liquidity, advisory, venture, and asset-management-adjacent activities; the common buyer job is reliable liquidity,
    market access, and capital-markets execution across token lifecycles. This boundary excludes consumer brokerage,
    custody-only wallets, mining, generic L1 infrastructure, and passive asset exposure unless those markets create
    demand for liquidity or treasury workflows. The substitutes are fragmented: token issuers can use exchange-native
    makers or internal treasury teams, institutions can route through banks or OTC desks, and conservative buyers
    can defer adoption until regulated bank infrastructure matures. That fragmentation is favorable for GSR only
    where it can bundle liquidity, risk management, and transparent execution into a lower-friction adoption path.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM001
  figureRefs:
  - FM003
- id: sizing-lenses-and-market-structure
  title: Sizing lenses and market structure
  body: 'The market is large but boundary-sensitive. A broad TAM lens is the digital-asset capital-markets universe:
    BCG sizes crypto assets near $3 trillion, stablecoins near $300 billion, and visible Digital RWAs near $30 billion
    at year-end 2025, while the Federal Reserve updates stablecoin market capitalization to $317 billion as of April
    2026. A more realistic SAM for GSR is smaller: institutional liquidity, execution, tokenization, stablecoin,
    and treasury workflows where professional market makers or platforms are budgeted. Recent exchange data supports
    demand but also warns against extrapolation. CoinDesk Data reported May 2026 centralized exchange volume of
    $4.41 trillion, while TokenInsight reported Q1 2026 volume down 32% quarter over quarter to $17.9 trillion.
    Thus the sizing case needs multiple lenses rather than a single headline TAM, with SOM tied to workflows GSR
    can actually win.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
