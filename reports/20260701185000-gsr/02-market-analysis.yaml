- id: contradictions-and-diligence-gaps
  title: Contradictions and diligence gaps
  body: 'The main contradiction is not whether digital assets are “large,” but which spend pool is investable for
    GSR. BCG’s broad categories imply a very large capital-markets opportunity, while GSR’s DigiFT framing and partner
    evidence point to narrower RWA liquidity pools that are still early, regulated, and operationally constrained.
    Stablecoins show the same tension: Fed and BCG data show scale, but WEF notes that most transaction value has
    still been trading or on/off-ramping rather than mainstream commerce. Before translating TAM into valuation,
    diligence should request GSR’s revenue by segment, volume by product, take-rate ranges, counterparty concentration,
    regulatory-license map, and renewal or wallet-share evidence. Without those private metrics, the chapter supports
    a large and improving market, but not a precise revenue SAM or durable SOM.'
  claimRefs:
