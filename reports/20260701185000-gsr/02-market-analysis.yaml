- id: buyer-user-payer-segmentation
  title: Buyer, user, and payer segmentation
  body: 'The buyer map is multi-sided. Token issuers and foundations buy liquidity and market-structure advice to
    support listings, treasury, and secondary-market confidence; treasury desks and funds use OTC execution and
    derivatives to move size without excessive slippage; stablecoin issuers and payment infrastructure providers
    need reserves, liquidity, on/off ramps, and partner credibility; asset managers and regulated venues need compliant
    tokenized-asset issuance, trading, and settlement support. Users are often traders, treasury operators, portfolio
    managers, and product teams, while payers may be foundations, issuers, market venues, funds, or regulated financial
    institutions. Adoption triggers differ by segment: launch readiness for issuers, spread or settlement improvement
    for treasury teams, regulatory approval for banks, and secondary price discovery for tokenized RWA sponsors.'
  claimRefs:
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
