evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital structure gap
    missingEvidence: >-
      Cap table, SAFEs/convertibles, debt facilities, secondaries, investor rights, and the SC Ventures transaction
      documents.
    whyItMatters: Capital-stack opacity affects valuation quality, control, dilution, and downside preference analysis.
    diligencePath: >-
      Request management cap table, board consents, financing agreements, credit lines, and any secondary transaction
      schedules.
    relatedQuestionRefs:
      - QO009
      - QO023
  - type: missing-source
    severity: material
    topic: metrics gap
    missingEvidence: >-
      Current 2026 ARR, revenue run-rate, gross margin, customer count, customer concentration, churn, and audited group
      accounts.
    whyItMatters: The public file supports scale but not unit economics or revenue quality, limiting valuation confidence.
    diligencePath: >-
      Obtain monthly management accounts, audited consolidated statements, revenue by product, customer cohort exports,
      and top-counterparty exposure.
    relatedQuestionRefs:
      - QO010
      - QO011
      - QO023
  - type: missing-source
    severity: material
    topic: headcount gap
    missingEvidence: Current headcount by geography, function, regulated entity, and contractor status as of the run date.
    whyItMatters: >-
      GSR’s institutional strategy depends on trading, compliance, engineering, and advisory execution capacity after
      leadership changes.
    diligencePath: Request HRIS export, organization chart, regulated-function roster, and hiring plan for 2026-2027.
    relatedQuestionRefs:
      - QO012
      - QO023
  - type: private-evidence-only
    severity: material
    topic: governance gap
    missingEvidence: >-
      Parent-company board composition, observer rights, voting thresholds, related-party arrangements, and ultimate
      beneficial ownership.
    whyItMatters: Strategic investors and regulated-entity ownership can materially affect control, conflicts, and exit optionality.
    diligencePath: >-
      Review constitutional documents, shareholder agreements, board minutes, regulatory ownership filings, and KYC/UBO
      records.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
