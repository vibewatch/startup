companyProfile:
  summary: GSR is a London-centered private digital-asset trading and market-infrastructure firm that describes itself as crypto's capital-markets partner. Its public business model combines market making, institutional OTC execution, treasury and risk-management support, venture backing, tokenization and advisory capabilities, and an expanding regulated-entity footprint across the UK, Singapore, and the U.S. The May 2026 SC Ventures investment and related product, acquisition, and broker-dealer milestones show strategic momentum, but current consolidated economics and financing terms remain only partially visible in public sources.
