- id: final-diligence-asks-and-thesis-breaks
  title: Final Diligence Asks and Thesis-break Triggers
  body: 'The diligence path is straightforward: verify the economics that public sources cannot. The committee should request
    audited consolidated accounts through the most recent quarter, segment revenue and gross margin, trading VaR and inventory
    policy, cash and debt, collateral lines, top-ten customer concentration, counterparty losses, regulatory permissions by
    jurisdiction, cap table, option pool, liquidation preference stack, and the SC Ventures security terms. The valuation
    should break or be repriced if current revenue is materially below the reported 2024 base, if after-tax profitability
    was driven mainly by non-repeatable trading gains, if the additional strategic raise requires senior preferences, if GSR
    Securities cannot execute capital-formation mandates within its regulatory perimeter, or if market-integrity controls
    are insufficient for institutional counterparties. Conversely, the view could move to buy if management proves durable
    fee revenue, controlled inventory risk, clean compliance history, diversified counterparties, and a price meaningfully
    below the implied comparable range.'
