- id: TV003
  title: Bull / Base / Bear Scenario Table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Probability signals
  - Downside trigger
  rows:
  - - Bull
    - Tokenization, broker-dealer capital formation, treasury advisory, and OTC growth compound into durable fee plus spread
      revenue.
    - Strategic premium above $1B can be justified if 2026 revenue and profit exceed the 2024 base with higher-quality mix.
    - SC Ventures partnership, Libeara, GSR Securities, and GSR One all convert into revenue.
    - No evidence of recurring advisory or regulated mandate revenue by next diligence refresh.
  - - Base
    - GSR remains a scaled, profitable market maker with incremental capital-markets services and cyclical volumes.
    - Above-$1B is plausible but should be structured or discounted because the current run-rate and preference stack are
      private.
    - Reported 2024 profit, scale claims, and comp range support continuing interest.
    - Exchange volumes remain soft and management cannot prove margin resilience.
  - - Bear
    - Trading volumes compress, conflicts/regulatory scrutiny increase, and strategic funding requires senior preferences.
    - Down-round, flat round, or heavy investor protections become necessary to preserve downside.
    - Market-volume softness, undisclosed terms, and adverse industry/regulatory signals dominate.
    - Regulatory issue, customer concentration, or current revenue materially below 2024 base.
  notes: No explicit probability percentages are assigned because public sources do not support that precision.
