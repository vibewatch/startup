- id: TV002
  title: Thesis / Anti-thesis Table
  columns:
  - Argument
  - Evidence support
  - What would change the view
  rows:
  - - 'Thesis: strategic-bank validation'
    - SC Ventures became first external strategic shareholder and frames the partnership around institutional infrastructure.
    - Buy case strengthens if SC Ventures also supplies distribution, banking rails, and follow-on capital.
  - - 'Thesis: scale in market making'
    - Official pages cite >1,000 clients, >$1T traded volume, 60+ exchange integrations, and 250+ assets.
    - View weakens if management data shows concentration or inactive-client inflation.
  - - 'Thesis: capital-markets expansion'
    - Autonomous/Architech, Libeara, GSR One, and broker-dealer approval expand beyond pure liquidity provision.
    - View strengthens if advisory and capital-formation fees become recurring and material.
  - - 'Thesis: comp support'
    - Keyrock’s reported 2026 $1.1B valuation gives a close fresh private-market anchor.
    - View weakens if GSR’s revenue quality or growth is below Keyrock-like peers.
  - - 'Anti-thesis: valuation opacity'
    - Investment size, security terms, current revenue, margin, and cap table are not public.
    - Move to buy only with audited accounts and full preference/dilution disclosure.
  - - 'Anti-thesis: cyclicality'
    - TokenInsight and CoinDesk Data show 2026 exchange-volume softness.
    - Increase discount if GSR revenue correlates heavily with volatile trading volume.
  - - 'Anti-thesis: conflicts/regulation'
    - GSR terms disclose principal trading and conflicts; IOSCO and SEC sources highlight market-integrity risk.
    - Require policies, surveillance results, and no unresolved enforcement exposure.
  - - 'Anti-thesis: trust/execution'
    - Legal history, impersonation alerts, and past leadership churn lower confidence at the margin.
    - Neutralize with current controls evidence, customer references, and management stability.
  notes: Rows intentionally pair pro and contra evidence so the recommendation remains evidence-sensitive rather than brand-led.
