  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round terms and preference stack
    missingEvidence: SC Ventures investment amount, pre/post-money basis, security type, liquidation preference, anti-dilution
      terms, board rights, and option-pool refresh.
    whyItMatters: The same headline valuation can produce very different investor outcomes depending on preference seniority
      and dilution.
    diligencePath: Request executed financing documents, cap table before and after the round, and pro forma waterfall by
      exit value.
    relatedQuestionRefs:
    - QV004
    - QV007
    relatedTableRefs:
    - TV005
    - TV007
  - type: private-evidence-only
    severity: material
    topic: current financial performance
    missingEvidence: Audited 2025 financials, YTD 2026 management accounts, segment revenue, gross margin, cash, debt, trading
      capital, and adjusted EBITDA.
    whyItMatters: The valuation can only be tested if 2026 performance supports or exceeds the stale 2024 revenue and profit
      clues.
    diligencePath: Review audited statements, bank/custody confirmations, management accounts, and revenue-recognition policies.
    relatedQuestionRefs:
    - QV006
    - QV021
    relatedTableRefs:
    - TV001
    - TV007
  - type: private-evidence-only
    severity: material
    topic: customer and counterparty concentration
    missingEvidence: Top customer revenue concentration, counterparty exposure, retention, mandate duration, and collateral
      or settlement losses.
    whyItMatters: Scale claims are less valuable if revenue or risk is concentrated in a few venues, token projects, or counterparties.
    diligencePath: Request anonymized top-ten customer schedules, retention cohorts, counterparty exposure reports, and contract
      samples.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV007
  - type: missing-source
    severity: minor
    topic: exit route specificity
    missingEvidence: Direct evidence of buyer interest, IPO readiness, banker feedback, or comparable M&A multiples for market-maker/capital-markets
      hybrids.
    whyItMatters: Exit route uncertainty affects target return, hold period, and whether strategic-bank validation converts
      into liquidity.
    diligencePath: Interview sector bankers and strategic buyers; review audit readiness, governance, and historical inbound
      approaches.
    relatedQuestionRefs:
    - QV015
    relatedTableRefs:
    - TV007
