chapter:
  number: 8
  title: Valuation
  summary: 'GSR earns a track / research-more recommendation: strategic-bank validation, reported profitability, and regulated
    capital-markets expansion make the >$1B valuation plausible, but public evidence is not sufficient for a buy. The decisive
    blockers are undisclosed round terms, current financials, preference/dilution stack, customer concentration, and risk-control
    proof.'
sections:
- id: recommendation-and-valuation-stance
  title: Recommendation and Valuation Stance
  body: 'The investment call is track / research-more, not buy. GSR has credible scale signals: SC Ventures became the first
    external strategic shareholder, independent coverage places the transaction above a $1 billion valuation, official pages
    cite more than 1,000 clients and more than $1 trillion of traded volume, and the FINRA broker-dealer acquisition expands
    U.S. capital-markets optionality. The reason not to underwrite a buy today is price and evidence quality rather than company
    quality. The round size was not disclosed, GSR may be seeking additional strategic capital, and public filings do not
    reveal current revenue run-rate, margin, cash, debt, top-customer concentration, or liquidation preferences. The reported
    $287 million revenue and $71 million after-tax profit for the year ending June 2024 make the reported valuation plausible,
    but they are stale relative to 2026 acquisitions, regulatory expansion, and exchange-volume volatility. Entry should require
    either a lower price, investor-protective terms, or a management data room that confirms current growth, quality of earnings,
    balance-sheet capacity, and preference overhang.'
