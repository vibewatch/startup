tables:
- id: TV001
  title: Recommendation Summary Table
  columns:
  - Decision field
  - Current call
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more
    - Scale and strategic-bank backing are credible, but price, round terms, and current financials are incomplete.
    - Do not issue buy until data-room evidence supports the >$1B mark or price is reset.
  - - Confidence
    - Medium-low
    - Multiple independent sources corroborate valuation context, but key operating metrics are private.
    - Use staged diligence and avoid false precision.
  - - Risk rating
    - High
    - Principal-trading conflicts, crypto volume cyclicality, regulatory scrutiny, and opaque concentration remain material.
    - Require risk controls, audited financials, and regulatory perimeter review.
  - - Valuation stance
    - Fair-to-stretched / under-supported
    - '> $1B can be plausible versus reported 2024 profit, but 2026 quality of earnings is unknown.'
    - Entry should demand discount, structure, or confirmed growth.
  - - Return posture
    - Option value, not base-case underwrite
    - Tokenization, broker-dealer, and advisory expansion can increase strategic value if durable revenue emerges.
    - Treat upside as diligence-contingent rather than bankable.
  notes: Recommendation is price-sensitive; unknown round size, preference stack, and current financials prevent a precise
    entry valuation.
