  - - Amber Group
    - 2022 Series B+ valued Amber at $3B with $328M total capital raised.
    - Older broad digital-asset platform comp.
    - Shows upper-cycle strategic value for scaled digital-asset services.
    - Different consumer/AUM/business mix and older market cycle.
  - - Wintermute
    - 2021 $20M Series B; $30B monthly volume by Dec. 2020.
    - Historical market-making growth comp.
    - Validates high operating leverage in liquidity provision.
    - No valuation disclosed and vintage predates 2022-2023 crypto reset.
  - - B2C2
    - SBI acquired B2C2 after taking a minority stake; B2C2 said OTC volumes quadrupled after the partnership.
    - Strategic buyer / institutional desk comp.
    - Shows strategic acquisition path for bank-owned crypto dealing and liquidity infrastructure.
    - Public release does not provide current valuation or multiples.
  - - Cumberland / DRW
    - DRW-backed global cryptoasset liquidity business.
    - Strategic incumbent comp.
    - Highlights competition from well-capitalized trading firms.
    - No standalone valuation or revenue metrics.
  - - Market-volume backdrop
    - Q1 2026 exchange volume down 32% QoQ; May centralized volumes down 3.45% to $4.41T.
    - Market cycle reference.
    - Frames revenue sensitivity for market makers.
    - Exchange-level volume is not GSR-specific revenue.
