tables:
- id: TU001
  title: Customer Segmentation Table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Token issuers and foundations
    - Issuer/foundation budget; market operations and treasury users
    - Market making, exchange strategy, token liquidity, treasury planning
    - GSR says it works with leading projects and has 300+ liquidity partners
    - Core liquidity and advisory wedge
    - No revenue split by issuer cohort
  - - Institutional OTC desks and funds
    - Treasury, trader, fund, or institutional client
    - Large spot/derivative execution across crypto and fiat
    - OTC page cites 200+ assets, 25 fiat currencies, and up to $100M trades
    - Principal spread, execution, and relationship value
    - No active-client or repeat-trade cohort
  - - Tokenized RWA investors and exchanges
    - DigiFT platform and eligible institutional investors
    - Live secondary OTC liquidity and price discovery
    - DigiFT/GSR launch covers multiple tokenized RWA units
    - Strategic RWA liquidity beachhead
    - No volume, take rate, or renewal data
  - - Stablecoin issuers
    - Qualified stablecoin issuers; Chainlink/GSR program users
    - Launch strategy, fiat ramps, trading venues, data, PoR, CCIP
    - Program and application path retained
    - Potential multi-service issuer relationship
    - No named issuers or conversion rate
  - - Institutional ECN participants
    - Payment providers, brokers, OTC desks, hedge funds, custodians
    - Firm quotes and zero-slippage execution via Finery Markets
    - Finery says 150 market participants and first trade completed
    - Channel distribution leverage
    - GSR share of flow not disclosed
  - - Regulated U.S. market participants
    - Kalshi and institutional derivatives participants
    - Liquidity for regulated perpetual futures
    - GSR says it supports Kalshi perps launch
    - Regulated market credibility
    - GSR economics and duration undisclosed
  - - DeFi protocols and token communities
    - Protocol foundations and ecosystem teams
    - Market making, DeFi stack support, community/event engagement
    - Moby and Sonic named GSR for liquidity roles
    - Protocol ecosystem relevance
    - Token-market quality may be incentive-sensitive
  - - Capital-formation and advisory clients
    - Issuers, fund managers, foundations
    - Broker-dealer, token launch, treasury, capital planning
    - FINRA approval and Autonomous/Architech acquisition
    - Expansion beyond pure liquidity
    - Mandate pipeline not disclosed
  notes: Segmentation is based on public product pages, named proof, and partner releases; customer counts are not converted
    into paying-account cohorts.
