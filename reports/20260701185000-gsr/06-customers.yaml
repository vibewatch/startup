- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion driver
  - Concentration / dependency risk
  - Impact
  - Diligence path
  rows:
  - - Market making to OTC / treasury / advisory cross-sell
    - Revenue may concentrate in a small number of issuers or tokens
    - High if top accounts drive inventory and fee economics
    - Request top-10 customer revenue, token exposure, and wallet-share movement
  - - DigiFT RWA liquidity
    - Channel and regulated-platform dependence
    - Medium; RWA proof depends on DigiFT demand and token universe
    - Request volume, SLA, exclusivity, and additional RWA roadmap
  - - Finery Markets ECN channel
    - GSR may be one liquidity provider among many
    - Medium; channel scale may not equal GSR wallet share
    - Request quote share, completed trades, and counterparty retention
  - - Chainlink stablecoin issuer program
    - Issuer conversion risk from application funnel
    - Medium; program may not convert to named issuers
    - Request pipeline, accepted issuers, launch dates, and attach rate
  - - Kalshi regulated market participation
    - Regulatory and incentive-dependent liquidity quality
    - Medium to high; venue economics may change
    - Request contract term, economics, and organic vs incentive-supported volume
  - - Broker-dealer and SC Ventures channel
    - Compliance-heavy procurement and bank-channel dependency
    - Medium; regulated credibility may slow sales cycles
    - Review licenses, pipeline, regulated revenue, and sponsor dependencies
  notes: Risk rows combine public channel evidence with explicit missing private metrics.
