slug: gsr
runDate: '2026-07-01'
company:
  name: GSR
chapter:
  number: 6
  title: Customers
  summary: GSR has credible 2025-2026 customer proof across institutional OTC, tokenized RWA liquidity, stablecoin issuer
    enablement, regulated market liquidity, and protocol market-making, but public evidence stops short of retention, concentration,
    and customer economics. The underwriting stance is positive on institutional relevance and partner/channel reach, cautious
    on durability until private renewal, repeat-usage, and top-account data are provided.
sections:
- id: segmentation-and-buyer-map
  title: Customer Segmentation and Buyer/User/Payer Map
  body: 'GSR''s public customer file supports an institutional, multi-sided segmentation rather than a simple logo-count story.
    The broadest official claim is 1,000-plus clients, $1 trillion-plus traded volume, 60-plus exchange integrations, and
    250-plus supported assets, but that is a company-defined scale metric rather than a disclosed active-customer cohort.
    The buyer and payer can be a token issuer, foundation, exchange, OTC desk, payment provider, broker, fund, treasury team,
    stablecoin issuer, or regulated financial institution; the day-to-day user is often a trading, treasury, market-operations,
    or issuer-go-to-market team. The strongest segmentation proof comes from workflow-specific surfaces: systematic OTC for
    approved institutional clients, market making for projects and exchanges, RWA liquidity through DigiFT, stablecoin issuer
    enablement with Chainlink, and regulated U.S. broker-dealer capacity for capital formation. The diligence stance is therefore
    to accept the segment breadth but not convert it into recurring revenue or retained-account quality without a customer
    definition, ARR/volume split, and top-account schedule.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU016
  - CU025
  - CU039
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-named-proof
  title: Adoption Trajectory and Named Proof
  body: 'The adoption trajectory is credible but unevenly measured. Public proof shows multiple 2025-2026 customer or partner
    launches: GSR One expanded client analytics and onboarding, systematic OTC added API/UI access and an Astar testimonial,
    DigiFT launched live RWA OTC liquidity, Finery Markets reported a live integration and first trade, Kalshi named GSR liquidity
    support for regulated perpetual futures, Zama completed a confidential OTC trade, and Moby and Sonic Labs publicly named
    GSR for liquidity or market-making roles. Those data points are fresher than a static logo page and include several production
    words such as live, completed, launched, and engaged. However, outcome specificity varies: DigiFT and Finery describe
    operational availability and market participants, Astar supplies qualitative usability feedback, while Chainlink''s stablecoin
    program is a funnel with an application path but no named issuer outcome in the retained sources. This supports adoption
    breadth, not yet retention durability. The decisive diligence test is whether these public references translate into contracted,
    repeatable accounts with measurable volume, renewal behavior, and share-of-wallet rather than one-off launch announcements
    or ecosystem marketing.'
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU014
  - CU016
  - CU018
