  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, churn, renewal rate, contract length, repeat-volume cohorts, and satisfaction data by product
      and channel.
    whyItMatters: Without retention data, public launches cannot be converted into durable recurring revenue or lifetime-value
      assumptions.
    diligencePath: Request cohort retention schedules, contract samples, CRM exports, product telemetry, and reference-call
      access for named customers.
    relatedQuestionRefs:
    - QU014
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue, volume, wallet share, token exposure, and channel concentration by quarter.
    whyItMatters: A few issuers, venues, or partners could drive a disproportionate share of revenue and inventory risk.
    diligencePath: Request anonymized top-10 account schedule, segment P&L, exposure limits, and partner-channel revenue split.
    relatedQuestionRefs:
    - QU015
    - QU020
    - QU025
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named customer proof table partial coverage
    missingEvidence: A management-confirmed complete list of production customers, pilots, churned customers, and logo-use
      permissions.
    whyItMatters: The public proof table may overrepresent customers that chose to announce while excluding private deployments
      or failed pilots.
    diligencePath: Reconcile public proof against CRM, contracts, customer success records, and referenceable-customer list.
    relatedQuestionRefs:
    - QU009
    - QU017
    relatedTableRefs:
    - TU003
