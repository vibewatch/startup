- id: TU006
  title: Procurement and Regulatory Friction Table
  columns:
  - Friction point
  - Evidence
  - Customer effect
  - Mitigation / diligence ask
  rows:
  - - Approved-jurisdiction gating
    - OTC page says clients in approved jurisdictions can access assets
    - Limits self-serve global reach
    - Map jurisdictions, onboarding rules, and rejection rates
  - - Institutional-only disclosures
    - GSR materials say they are intended for sophisticated or institutional investors
    - Narrows customer universe but improves compliance posture
    - Review suitability checks and customer onboarding controls
  - - Data privacy obligations
    - GSR privacy notice cites GDPR and other privacy laws
    - Enterprise onboarding may require privacy review
    - Request DPA/security questionnaire and privacy incident history
  - - FCA 2026 cryptoasset regime
    - FCA published final rules and guidance on 30 June 2026
    - UK permissions can shape launch timing and marketing
    - Map affected products and authorisation pathway
  - - AML/CTF registration
    - FCA requires registration before in-scope cryptoasset services
    - Adds onboarding and compliance friction
    - Review AML policies, monitoring, and regulator correspondence
  - - Market-maker conflict scrutiny
    - SEC/IOSCO cite manipulation, conflicts, and market-integrity risks in crypto markets
    - Customers may require stronger transparency and controls
    - Request surveillance, conflict policies, KPI reporting, and third-party attestations
  notes: Procurement friction table is not a finding of GSR misconduct; it identifies category and regulatory gates relevant
    to enterprise customers.
