  - FU003
- id: retention-durability-and-expansion
  title: Retention, Durability, and Expansion Evidence
  body: 'Durability is the main evidence gap. GSR''s public materials imply repeat use through 24/7 liquidity, daily reports,
    performance analytics, GSR One dashboards, treasury integration, and channel integrations, but none of the retained public
    sources discloses NRR, GRR, churn, renewal rate, contract length, cohort retention, or satisfaction scores. The expansion
    logic is more visible than retention metrics: clients can land through market making or OTC, expand into treasury, risk,
    options, advisory, token launch support, stablecoin issuance, regulated capital raising, and broker-dealer-enabled services.
    The Autonomous/Architech acquisition sharpens that path by adding pre-launch, token economics, fundraising, and treasury
    support. Still, every expansion claim should be treated as a pipeline hypothesis until management provides cohort-level
    repeat usage, product attach rates, and customer-level wallet-share evidence. The chapter therefore records nulls for
    retention KPIs instead of substituting liquidity availability for renewal proof.'
  claimRefs:
  - CU006
  - CU007
  - CU011
  - CU016
  - CU025
  - CU026
  - CU036
  - CU037
  - CU040
  - CU042
  - CU044
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-channel-and-procurement-friction
  title: Concentration, Channel Dependence, and Procurement Friction
  body: 'The customer risk profile is less about absence of logos and more about dependence on channels, regulated venues,
    and trust-sensitive procurement. Public proof clusters around ecosystem intermediaries—DigiFT, Finery, Chainlink, Kalshi,
    Zama, Moby, Sonic Labs, SC Ventures, and the new broker-dealer pathway—so a large share of visible demand may depend on
    partner distribution and market-structure launches. Top-customer concentration and revenue mix are not disclosed. The
    adverse file is category-level rather than GSR-specific: SEC enforcement against other crypto market makers, IOSCO market-integrity
    concerns, Kalshi''s liquidity incentives, FCA financial-promotion and AML rules, and GSR''s own proprietary-interest disclaimers
    all create diligence questions around liquidity quality, conflicts, customer acquisition, and compliance-driven sales
    friction. These do not negate GSR''s customer proof, but they raise the bar: underwrite named deployments as proof of
    institutional relevance, not as evidence of durable recurring revenue until contracts, renewal cohorts, and concentration
    schedules are reviewed.'
  claimRefs:
