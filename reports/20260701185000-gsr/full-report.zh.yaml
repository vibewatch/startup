      - number: '4.2'
        title: GTM、牵引力与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              销售动作看起来由关系驱动、面向机构，而非自助式。公开证明来自平台宽度、合作伙伴分发、具名流动性合作和受监管市场定位。Finery Markets 称，GSR 流动性已通过确定报价和零滑点执行，面向 150
              名已连接市场参与者上线；DigiFT 称，GSR 为代币化真实世界资产提供系统化 OTC 流动性；Moby 和 Sonic Labs 公开点名 GSR
              作为流动性或做市伙伴。这些引用暗示，协议、交易所、支付提供商、经纪商、OTC 柜台和代币发行方存在可重复需求，但它们没有披露 CAC、销售周期长度、胜率、实际合同规模或留存。GSR One
              是重要的销售效率代理指标，因为它把实时交易活动、定制 KPI、准入、资金集成和报告放在一个客户平台里；这可能降低人工服务负担并支撑续约，但经济影响未量化。因此，GTM
              结论只能是方向性的：公开牵引力可信，且带有机构背书，但销售效率仍是从伙伴 logo、产品范围和流程自动化推断出来，而不是由队列数据衡量。
