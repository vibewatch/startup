        - 低到中；变现可能是事件驱动或按市值计价。
        - 将费用收入与投资收益和按市值计价变动分开。
      - - 稳定币与代币化赋能
        - 为发行人提供流动性、OTC、法币接入、咨询和分销支持。
        - 项目或交易经济性未披露。
        - Chainlink 和 DigiFT 材料将 GSR 定位为稳定币和 RWA 的资本市场伙伴。
