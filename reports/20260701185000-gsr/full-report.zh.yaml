  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与市场诚信风险
        blocks:
          - type: paragraph
            body: >-
              GSR 最高严重度风险不是某一起待决案件，而是一个自营加密做市商在 UK、EU、U.S.、Singapore、代币化、咨询和 broker-dealer
              边界内扩张时，因行业监管机构正在主动审查市场操纵而形成的控制负担。公开档案包含重要缓释因素：GSR 表示交易对手必须完成尽职调查和 KYC / AML，FINRA BrokerCheck 显示 GSR
              Securities LLC 没有披露事件或暂停记录，2026 年报道称 FINRA 批准了 broker-dealer 收购。但剩余敞口仍高，因为规则在移动。FCA 于 2026 年 6 月 30
              日发布最终加密资产制度规则，MiCA 已成为 EU 正式生效的授权和监督框架，UK 法定文书和 FCA CP25/41 材料显示，准入、披露、市场滥用、以自营方 / 代理方身份交易、安排、平台、托管、稳定币和
              staking 活动正在进入更完整的 FSMA 边界。SEC 针对其他所谓加密做市商的案件，包括 2025 年对 CLS Global 的最终判决，说明刷量交易和人为成交量指控会损伤整个品类。GSR
              历史诉讼似乎显示，它是在托管争议中受损的原告，而不是被指控的市场操纵者；但该案仍凸显交易控制和交易对手欺诈敞口。
