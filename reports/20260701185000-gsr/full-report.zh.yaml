        title: 成本结构、单位经济与营运资本
        blocks:
          - type: paragraph
            body: >-
              GSR 的单位经济性由市场质量、资产负债表投放、技术规模、交易对手准入、合规和交易风险控制驱动。官方条款披露，GSR
              可能在客户交易之前或同时交易、对冲敞口、内部化或撮合订单，并自行决定报价；这支撑一种毛利模型，但该模型暴露于价差、对冲成本、库存波动、场所流动性、运营结算成本和合规控制。GSR 的 Markets 页面列出 60
              多个交易所集成、自有系统、自动报告和绩效分析，说明工程和基础设施成本不低；如果成交量增长，也具备经营杠杆。营运资本更难判断：自营 OTC
              和衍生品活动可能需要抵押品、库存、结算流动性和银行额度，而咨询和资金服务可能是更轻资产负债表的业务。公开档案没有披露毛利率、交易
              VaR、库存水平、应收、应付、抵押品、客户集中度或分部盈利能力。这个缺口很关键，因为即便 $287 million 收入报告显示盈利，如果交易收益占主导，仍可能掩盖波动；高质量服务收入组合则应得到不同的承销处理。
