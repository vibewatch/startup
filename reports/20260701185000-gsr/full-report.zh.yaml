              尽调路径很直接：验证公开来源看不到的经济性。委员会应要求提供截至最近季度的经审计合并账目、分部收入和毛利率、交易 VaR
              与库存政策、现金和债务、抵押品额度、前十大客户集中度、交易对手损失、各司法辖区监管许可、股权表、期权池、清算优先权层级，以及 SC Ventures 投资证券条款。若当前收入显著低于报道的 2024
              年基数、税后盈利主要由不可重复的交易收益驱动、额外战略融资需要更高级优先权、GSR Securities
              无法在其监管边界内执行资本形成委托，或市场诚信控制不足以服务机构交易对手，估值就应打破或重定价。反过来，如果管理层证明手续费收入耐久、库存风险受控、合规历史干净、交易对手多元，且价格明显低于隐含可比区间，观点可以转为买入。
