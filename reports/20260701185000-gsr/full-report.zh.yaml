        - 现金规划、风险管理、代币经济学、交易所策略
        - 没有收入结构或咨询留存指标
      - - RWA 投资者需要二级流动性
        - NAV 延迟，代币化资产可交易性有限
        - 带 GSR 报价的 DigiFT OTC 流动性
