      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图是多边的。代币发行方和基金会购买流动性和市场结构建议，用来支撑上市、资金管理和二级市场信心；资金柜台和基金使用 OTC
              执行与衍生品，在不过度滑点的情况下移动大额头寸；稳定币发行方和支付基础设施提供商需要储备、流动性、出入金通道和伙伴可信度；资产管理人和受监管场所需要合规的代币化资产发行、交易和结算支持。用户通常是交易员、资金运营人员、投资组合经理和产品团队，付款方则可能是基金会、发行方、市场场所、基金或受监管金融机构。不同细分的采用触发点不同：发行方看发行准备度，资金团队看价差或结算改善，银行看监管批准，代币化
              RWA 发起方看二级价格发现。
