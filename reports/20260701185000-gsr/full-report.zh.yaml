  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              GSR 竞争的不是一个边界清晰的软件品类，而是拥挤的机构加密流动性市场。直接同业包括 Wintermute、Cumberland、B2C2、Amber、Keyrock 等加密原生做市商和 OTC 柜台；Jump
              Crypto 相邻，因为它把交易和基础设施建设结合起来；对最成熟的机构而言，内部执行团队和直接走交易所的流程也是替代方案。这一点重要：GSR
              的买方不只是挑一个供应商，而是在决定把多少资产负债表、结算、风险转移、合规舒适度和市场微观结构专长外包出去。GSR 自我定位很宽：做市、系统化 OTC、GSR One 透明度、通过 Autonomous 和
              Architech
              支持代币化组织，以及市场结构研究影响力。宽度让公司比单一报价提供商更具战略性，但也会招来由母公司支撑的既有玩家比较；这些玩家可以在单个模块上匹配。因而，更适合把格局读成一张多对多替代地图：做市商解决流动性，既有机构解决信任和分发，基础设施建设者解决协议层瓶颈，内部团队解决控制权，但要付出运营负担。
