      - number: '2.5'
        title: 矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              核心矛盾不是数字资产是否「大」，而是哪一块支出池对 GSR 可投资。BCG 的宽口径类别暗示资本市场机会很大，GSR 的 DigiFT 叙事和合作伙伴证据则指向更窄的 RWA
              流动性池：这些池子仍处早期，受监管约束，也有运营限制。稳定币呈现同样张力：Fed 和 BCG 数据显示规模，WEF 则指出，大部分交易价值仍来自交易或出入金，而不是主流商业支付。在把 TAM
              转成估值依据之前，尽调应要求 GSR
              提供按细分划分的收入、按产品划分的成交量、抽成率区间、交易对手集中度、监管牌照地图，以及续约或钱包份额证据。没有这些私有指标，本章只能支持一个规模大且改善中的市场，而不能支持精确收入 SAM 或持久 SOM。
