  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 融资条款
        - SC Ventures 投资金额、投前 / 投后估值口径、证券类型、清算优先权、反稀释条款和董事会权利。
        - 决定入场价格、稀释和下行清偿顺序。
        - 索取已签署条款清单，以及本轮前后的股权结构表。
      - - 当前财务
        - 2025 年和 2026 年 YTD 收入、毛利率、调整后 EBITDA、现金、债务和交易资本。
        - 把公开估值变成可承销的估值倍数。
        - 审阅审计报表、管理账和现金 / 抵押品证明。
      - - 收入质量
        - 做市、OTC、咨询、财资、创投 / 资产管理和经纪交易商费用的收入构成。
        - 经常性费用收入和波动性交易收益不能用同一个倍数。
        - 索取按季度拆分的分部 P&L 与客户队列桥接表。
      - - 客户集中度
        - 前十大客户贡献、留存和交易对手敞口。
        - 如果高度集中，规模叙事价值会打折。
        - 审阅匿名化客户台账、合同和流失情况。
      - - 风险控制
        - 交易 VaR、库存限额、预对冲控制、监控和利益冲突政策。
        - 自营交易冲突会直接影响估值置信度。
        - 审阅政策、例外日志、审计和监管往来函件。
      - - 监管边界
        - 美国、英国、新加坡、瑞士以及面向欧盟业务的牌照和获准活动。
        - 决定资本形成和代币化收入能否落地。
        - 按司法辖区出具法律备忘录，并列明 FINRA/SEC 权限和限制。
      - - 整合证据
        - Autonomous、Architech、Libeara、GSR One 和 GSR Securities 的收入贡献与销售管线。
        - 区分战略叙事和已经变现的平台扩张。
        - 审阅销售管线、已签委托、收入归因和整合 KPI。
      - - 退出路径
        - 战略买家兴趣、IPO 准备度、审计控制和可比交易胃口。
        - 决定目标回报和持有期。
        - 访谈投行，审阅审计准备度，并梳理战略收购方。
    notes: 这些问题是从跟踪推进到买入或回避所需的最低材料包。
