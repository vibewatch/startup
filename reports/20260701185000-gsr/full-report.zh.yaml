      - - 论点：战略银行验证
        - SC Ventures 成为首个外部战略股东，并将合作定位在机构基础设施。
        - 若 SC Ventures 还带来分发、银行轨道和跟投资本，买入逻辑会更强。
      - - 论点：做市规模
        - 官方页面称客户 >1,000、交易量 >$1T、对接 60+ 交易所、覆盖 250+ 资产。
        - 若管理层数据证明集中度高或非活跃客户抬高口径，判断会削弱。
      - - 论点：资本市场扩张
        - Autonomous / Architech、Libeara、GSR One 和经纪交易商资格获批，让业务越过纯流动性供给。
        - 若顾问费和资本形成费用变得经常性且规模可观，判断会增强。
      - - 论点：可比公司支撑
        - Keyrock 据报 2026 年 $1.1B 估值提供了接近且新鲜的私募市场锚点。
        - 若 GSR 的收入质量或增长低于 Keyrock 一类同行，判断会削弱。
      - - 反论点：估值不透明
        - 投资规模、证券条款、当前收入、利润率和股权结构未公开。
        - 只有拿到审计账目和完整优先权 / 稀释披露，才转向买入。
      - - 反论点：周期性
        - TokenInsight 和 CoinDesk Data 显示 2026 年交易所成交量疲软。
        - 若 GSR 收入与波动的交易量高度相关，应提高折扣。
      - - 反论点：冲突 / 监管
        - GSR 条款披露自营交易和冲突；IOSCO 与 SEC 来源强调市场诚信风险。
        - 要求政策、监控结果，并确认没有未解决的执法敞口。
      - - 反论点：信任 / 执行
        - 法律历史、冒名提醒和过去领导层流失，在边际上降低置信度。
        - 用当前控制证据、客户推荐和管理层稳定性来抵消。
    notes: 各行刻意配对正反证据，使建议保持对证据敏感，而不是由品牌牵引。
