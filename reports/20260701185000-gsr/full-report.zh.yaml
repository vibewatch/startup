      - number: '3.3'
        title: 能力、定价、GTM 与信任对比
        blocks:
          - type: paragraph
            body: >-
              能力差异没有供应商话术说得那么宽。几乎每个直接同业都能声称自己有流动性、机构准入或做市专长，因此承销应聚焦那些既具体又难复制的供给。GSR 最清晰的具体点，是覆盖 200 多种数字资产和 25 种法币的 OTC
              主张、GSR One 透明度，以及代币化组织平台扩张。Cumberland 的具体点偏流程和资产负债表：免预融资、语音 / 聊天 / API / 网页接入、TWAP 执行、期权和期货。B2C2
              强调机构支持和交易所双边报价；Keyrock 叠加 DEX 流动性和资产管理；Jump 建设 Pyth、Firedancer 等基础设施，而不是销售传统 OTC
              柜台。定价是公开维度中最弱的一环：竞争对手材料里有免 OTC 费用或免预融资的迹象，但实际价差、授信条款、返佣和保留费结构均未披露。信任证据更丰富。FCA、MiCA、IOSCO、FINRA 和 SEC
              来源都暗示，合规姿态、冲突控制、托管和市场诚信流程，正与执行质量一起影响供应商选择。
