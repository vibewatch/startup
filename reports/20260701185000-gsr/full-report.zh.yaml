      - number: '1.2'
        title: 领导层、治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              当前公开领导层档案以 Xin Song 任 CEO、Jakob Palmstierna 任总裁、Cristian Gil 任董事长为核心。这一结构体现了 2024-2026
              年间的显著演变。BusinessWire 在 2024 年 6 月宣布 Rich Rosenblum 和 Xin Song 将出任联席 CEO，Palmstierna 从 CEO 转任总裁；The Block
              随后报道，联合创始人兼联席 CEO Rosenblum 和 CTO John MacDonald 将离职。当前团队页面已列出 Song 为
              CEO，暗示过渡后运营模式更清晰，但也留下创始人依赖和技术领导连续性的尽调问题。治理披露仍偏薄：Companies House 给出了 UK
              子公司的高管和一名重大控制人，公开文章识别出战略股东，但完整母公司董事会、投票权、投资人保护和最终经济利益仍属私有信息。因此，关键人物风险不再主要集中于某一位创始人 CEO，而在于 GSR
              能否把监管、交易、资金管理和咨询执行能力制度化，沉淀到更宽的资深团队中。
