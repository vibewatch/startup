  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认
        blocks:
          - type: paragraph
            body: >-
              GSR 变现的资本市场栈，比简单代币做市保留费更宽。官方服务页面至少支撑五类收入：自营 OTC 执行、做市项目、定制期权和结构化衍生品、资金 / 风险管理解决方案，以及面向代币化组织的咨询 /
              资本规划工作。最强的明确定价信号，是 OTC 页面给出的 $250,000 最低交易额；markets 页面则称 GSR 支持最高 $100 million 的交易，服务超过 1,000 名客户，累计交易量超过
              $1 trillion。公开页面没有披露实际价差、保留费、taker / maker 费、咨询费、资产管理费或分部收入。收入确认也是尽调问题：业务条款称 GSR
              通常以自营方而非代理方身份行事，因此交易经济性很可能混合了价差捕获、库存 / 对冲结果和协商服务费，而不是干净的订阅 ARR。Ledger Insights 给出了找到的唯一明确历史 P&L 数据点，报道截至
              2024 年 6 月财年收入 $287 million、税后利润 $71 million，但这个第三方数字没有拆分交易收益与服务收入。
