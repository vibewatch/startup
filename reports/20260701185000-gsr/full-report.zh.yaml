        title: 身份、商业模式与当前阶段
        blocks:
          - type: paragraph
            body: >-
              应把 GSR 看作一家私营加密资本市场基础设施公司，而不是纯交易所、托管商或软件供应商。GSR 自有材料和合作伙伴公告反复描述同一门生意：做市、机构 OTC
              交易、风险投资、资金与风险管理、代币咨询，以及接入全球流动性。最清晰的公开阶段标记，是 2026 年 5 月 SC Ventures 投资：GSR 仍是私营公司，但 Standard Chartered
              的创投部门成为 GSR 自 2013 年创立以来首个外部战略股东。独立报道给出的估值高于 $1 billion，公司和投资方则未披露投资规模。总部叙事没有营销材料那么干净。公开稿件和报道反复使用
              London，正式法律通知则指向 UK、Singapore 和 U.S. 受监管实体；尽调中最稳妥的表述，是「以 London
              为中心、拥有多地实体足迹的全球集团」，而不是得出已完全映射的母公司总部结论。因此后续章节应在每项主张背后标出实体、司法辖区和监管边界来源，不应把 GSR 当作一个已披露的单一公司壳。
