      - number: '3.2'
        title: 同业画像、规模、融资与战略方向
        blocks:
          - type: paragraph
            body: >-
              即便私有财务仍不透明，同业集合也给出了可信规模信号。Wintermute 保留下来的 Series B 新闻稿显示，到 2021 年它已覆盖近 50 个场所、数千个交易对，并在走向 RFQ
              和衍生品。Cumberland 受益于 DRW 数十年的交易传承，公开产品宽度覆盖 OTC、TWAP、期权、期货和免预融资流程。B2C2 带来 SBI 所有权、24/7/365
              机构支持、全球办公室足迹和公开市场诚信姿态。Amber 今天已不那么像纯做市可比公司，但其 $3 billion Series B+ 估值，以及财富 / 咨询 /
              流动性定位，使它成为相邻的机构数字资产平台。Keyrock 更接近 GSR 当前的战略扩张，因为它把做市、期权、OTC、DEX 流动性、资产管理和报道 $1.1 billion 估值组合在一起。GSR 自身
              2026 年 SC Ventures 投资和 broker-dealer 批准提升了机构可信度，但同一批来源也说明，这个市场正在吸引银行关联资本和受监管基础设施，且不止一个竞争者。
