  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              评估 GSR，应把它看作机构数字资产资本市场基础设施公司，而不是泛泛的加密资产押注。公开服务边界包括做市、OTC 执行、期权、DeFi
              流动性、咨询、风险投资，以及资产管理相邻活动；共同买方任务，是围绕代币生命周期获得可靠流动性、市场准入和资本市场执行。除非消费经纪、纯托管钱包、挖矿、通用 L1
              基础设施和被动资产敞口会产生流动性或资金管理流程需求，否则不应纳入这个边界。替代方案很碎：代币发行方可以使用交易所内生做市商或内部资金团队，机构可以经由银行或 OTC
              柜台路由，保守买方可以等受监管银行基础设施成熟后再采用。只有当 GSR 能把流动性、风险管理和透明执行打包成更低摩擦的采用路径时，这种碎片化才对它有利。
            claimRefs:
