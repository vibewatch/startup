      - number: '7.5'
        title: 监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              投资姿态应靠客观触发器监测，而不是泛泛说“加密波动”。最重要的领先指标包括监管状态变化、FINRA 披露、FCA / 英国许可里程碑、MiCA 授权姿态、针对 GSR 或其客户的不利执法提及、预对冲 /
              内部化的客户结果证据、经审计控制报告、伙伴事件历史和高管稳定性。任何可信执法行动只要涉及操纵、客户伤害、制裁、AML 失效、牌照暂停或未补救的结算失败，都会打破论点，因为 GSR
              的投资逻辑依赖可信市场基础设施地位。较软但仍重要的触发器，是市场成交量持续收缩，或公司无法解释收入究竟来自耐久客户服务还是波动性交易收益。当前缓释项说得通——KYC/AML 准入、专业客户边界、监管实体、GSR
              One 透明度、伙伴级基础设施——但还不能替代私下尽调。下一份尽调包必须包括合规政策、与英国市场滥用预期对齐的交易监控输出、事件日志、SOC / 安全证据、经审计账目、风险限额、合作伙伴 SLA
              和管理层留任计划。
