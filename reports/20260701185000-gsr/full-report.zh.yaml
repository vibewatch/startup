      - number: '7.2'
        title: 运营、安全与客户结果风险
        blocks:
          - type: paragraph
            body: >-
              GSR 的核心业务把 24/7 交易、自由裁量定价、预对冲、内部化成交、客户报告、钱包 / 安全控制和多法律实体放在一起，运营风险因此很重。公司条款说得很清楚：GSR
              通常以自营商身份交易，可能围绕客户交易预对冲，可能内部化或交叉撮合订单，也不承诺报价就是市场最佳价格。这些披露对交易商并不异常，但会把客户信任转成控制证据问题：投资人要看政策、监控、例外日志和客户结果测试，而不能只看法律告知。GSR
              One 是有意义的缓释项，因为它展示实时交易活动、订单簿深度、绩效指标、钱包控制、安全管理和准入流程。冒名诈骗警示也有用，它说明公司在主动监测品牌欺诈；但反过来，欺诈者也把 GSR
              品牌视为可利用资产。隐私和实体复杂度又叠加一层运营负担，横跨 BVI、香港、新加坡、西班牙、瑞士、英国和美国实体。
