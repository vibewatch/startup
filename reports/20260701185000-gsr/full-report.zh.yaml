  - id: TV006
    title: 论点破裂与终止触发器表
    columns:
      - 触发器
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入重置
        - 2026 年 run-rate 显著低于据报 2024 年收入基数。
        - 使 >$1B 的规模支撑失效。
        - 回避，或要求大幅下轮降价。
      - - 利润率质量
        - 利润主要来自按市值计价或一次性交易收益。
        - 削弱可持续盈利倍数。
        - 只按正常化费用 / 价差 EBITDA 重新定价。
      - - 优先权悬挂
        - 新战略资本带有高级清算权、棘轮或重度反稀释。
        - 压缩普通股 / 新资金回报。
        - 要求同等或更高级保护，否则放弃。
      - - 监管限制
        - 经纪交易商或加密许可不覆盖计划中的资本形成用例。
        - 降低扩张期权价值。
        - 在法律边界形成文件前推迟投资。
      - - 市场诚信问题
        - 出现当前调查、执法或重大监控失效。
        - 损害机构信任和退出准备度。
        - 除非已补救并反映在价格中，否则回避。
      - - 集中度
        - 头部客户或交易对手主导收入或抵押品敞口。
        - 抬高流失、信用和流动性风险。
        - 要求多元化里程碑和下行情景条款。
      - - 交易量冲击
        - 中心化交易所成交量连续多个季度收缩，又没有咨询收入抵消。
        - 挤压价差和流动性经济性。
        - 按熊市情景承销，或等待。
    notes: 这些触发项是可监测的尽调阈值；具体数字阈值需要管理层数据，公开来源无法给出。
