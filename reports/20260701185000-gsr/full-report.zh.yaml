    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: GSR 的客户工作流从机构需求出发，进入获批开户、产品选择、执行或咨询交付、报告，再延伸到后续资金管理或市场质量支持。
    data:
      nodes:
        - id: demand
          label: 机构 / 发行人需求
          detail: 代币发行人、交易所、资金管理方、资产管理人、支付提供商和交易场所需要流动性、执行、对冲或发行支持。
        - id: qualification
          label: 对手方资格审核
          detail: 交易客户必须通过协议、尽职调查和 KYC/AML，成为获批对手方。
        - id: solution
          label: 模块选择
          detail: GSR 将需求映射到 systematic OTC、高触达 OTC、做市、期权、资金管理、咨询、DeFi/RWA 或合作伙伴计划。
        - id: execution
          label: 执行 / 交付
          detail: GSR 报价、路由、执行、对冲、结算、提供流动性，或交付发行 / 资金管理咨询。
        - id: partner_rails
          label: 必要时接入伙伴轨道
