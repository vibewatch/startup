      - number: '7.3'
        title: 合作伙伴、依赖与结算风险
        blocks:
          - type: paragraph
            body: >-
              合作伙伴故事改善分销，却带来依赖风险。SC Ventures 具有战略价值：它是首位外部战略股东，也给 GSR 带来一个贴近传统银行的代币化基础设施伙伴；但这同时抬高了受监管执行的要求，并可能把战略预期集中到
              Standard Chartered 生态。Chainlink、Finery Markets 和 DigiFT 说明 GSR 如何触达稳定币发行方、ECN 参与者和代币化 RWA
              投资人，但每个伙伴都有自己的失效模式：预言机 / 互操作性标准、ECN 可用性和参与者流动性、智能合约结算、受监管交易所可用性，以及从手工流程迁移到自动化流程。美联储 2026
              年稳定币报告把这个问题从理论变成现实：中介链条、纵向整合和运营中断都可能把冲击传导到数字资产和传统金融通道。尽调要问的因此不是 GSR 有没有伙伴，而是每个收入关键依赖项是否都有合同
              SLA、备用结算路径、事件预案、集中度限制和第三方控制报告。
