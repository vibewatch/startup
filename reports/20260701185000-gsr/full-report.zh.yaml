      - number: '8.3'
        title: 可比公司组与退出准备度
        blocks:
          - type: paragraph
            body: >-
              可比集只能支持方向，不能给精度。Keyrock 是最近的私人市场估值锚，因为 SC Ventures 和 Ripple 领投了 2026 年 Series C，报道估值 $1.1 billion；但
              Keyrock 在地域、人员规模和业务结构上不同。Amber 2022 年 $3 billion 估值可作为更宽数字资产平台的上限参照，但这是上一周期证据，且其消费者和财富管理组合与 GSR
              并不相同。Wintermute 2021 年 $20 million Series B 和 $30 billion 月交易量说明流动性提供商可以快速放大，但估值未披露，时间点也在 FTX 之前。B2C2 和
              Cumberland 证明战略买方和机构流动性价值成立；不过 B2C2 自身收购公告也显示，银行旗下加密交易台是一条退出路径。GSR
              的退出准备度好于典型私有加密交易台，因为它有战略银行背书、券商可选路径、代币化资产，以及 ETF / 咨询邻近性。即便如此，没有经审计分部财务、控制证据和更清晰监管边界，IPO 准备度仍未证明。
