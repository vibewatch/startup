        title: 里程碑、指标缺口与不利记录
        blocks:
          - type: paragraph
            body: >-
              GSR 的公开时间线显示，这家公司穿越了多个加密周期，现在试图把数字资产资本市场专业化。2013 年创立、2024 年联席 CEO 过渡、2024 年末高管离职、2025 年平台发布、2026 年
              Autonomous / Architech 收购、SC Ventures 投资，以及 FINRA 批准的 broker-dealer 收购，是定义性里程碑。不利记录有分量，但需要区分。GSR 在一起涉及所谓
              $2 million 比特币托管欺诈的 Wells Fargo 过失上诉中败诉，但 GSR 是原告，不是被指控的违法方；GSR 也曾警示有人冒用其品牌行骗。另一个维度是，SEC
              对其他加密做市商的执法强化了品类层面的操纵风险；做市是高度依赖信任的业务，这一点重要。主要尽调缺口不是 GSR 是否真实存在、是否具备机构动能，而是当前经审计经济性、客户数量、员工数、董事会 /
              控制条款、资本结构细节，以及支撑其扩张的合规控制质量。
