      - number: '2.2'
        title: 规模测算视角与市场结构
        blocks:
          - type: paragraph
            body: >-
              市场很大，但对边界高度敏感。宽口径 TAM 是数字资产资本市场宇宙：BCG 估算 2025 年底加密资产约 $3 trillion，稳定币约 $300 billion，可见 Digital RWAs 约 $30
              billion；Federal Reserve 则把 2026 年 4 月稳定币市值更新为 $317 billion。对 GSR 更现实的 SAM
              要小得多：机构流动性、执行、代币化、稳定币和资金管理流程，且这些流程已有专业做市商或平台预算。近期交易所数据支持需求，也提醒不能线性外推。CoinDesk Data 报道 2026 年 5 月中心化交易所成交量为
              $4.41 trillion，TokenInsight 报道 2026 年 Q1 成交量环比下降 32% 至 $17.9 trillion。因此，规模论证需要多个视角，而不是单一标题 TAM；SOM 则应绑定
              GSR 真能拿下的流程。
