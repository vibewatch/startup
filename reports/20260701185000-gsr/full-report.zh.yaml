  - id: TI006
    title: 公开财务缺口表
    columns:
      - 缺失私有指标
      - 对投资评估的影响
      - 具体尽调路径
    rows:
      - - 当前收入和增长
        - 阻断 2026 年收入倍数、增长耐久度和 2024 年后趋势分析。
        - 索取经审计的 2024–2026 年按月分部收入，并与管理层 KPI 定义做桥接。
      - - 收入结构与确认
        - 自营交易、顾问费、咨询、衍生品和资产管理应给不同的质量评分。
        - 要求提供会计政策，以及按净交易收益、费用、顾问费、咨询和投资拆分的收入瀑布。
      - - 毛利率和交易亏损历史
        - 用来判断盈利是否稳固，还是依赖特定市场周期。
        - 要求按业务流提供毛利率、对冲 P&L、回撤、亏损日和 VaR 限额突破情况。
      - - 现金、烧钱、跑道和债务
        - 2026 年扩张之后，无法直接评估资本充足性。
        - 要求提供当前现金、月度烧钱、债务 / 融资安排、抵押品，以及基准 / 下行计划下的跑道。
      - - 客户和交易对手集中度
        - 代币发行方或机构集中度可能让收入随周期波动。
        - 要求提供前 10 大收入占比、活跃交易对手、留存和最大敞口限制。
      - - CAC、回本期和销售周期
        - 公开合作伙伴进展无法量化销售效率。
        - 要求提供管线转化、销售周期长度、CAC / 回本期、合作伙伴来源签约额和续约群组。
      - - 受监管实体经济性
        - 经纪交易商和多司法辖区布局可能既筑起护城河，也带来成本负担。
        - 要求提供监管资本要求、合规成本、受监管收入和计划产品范围。
      - - 不利控制与冲突
        - 自营交易冲突和行业操纵执法让控制在财务上变得重要。
        - 要求提供冲突政策、监控工具、预对冲控制、投诉和监管检查。
    notes: 这些阻断项是最低限度的数据请求；拿到之后，才能从中等置信度的方向判断推进到财务模型。
