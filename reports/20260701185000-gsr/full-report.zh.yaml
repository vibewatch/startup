  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: GSR 的产品扩展依赖内部系统、对手方、受监管实体和合作伙伴基础设施的组合。
    data:
      nodes:
        - id: gsr_stack
          label: GSR 核心交易栈
          detail: 自有路由、定价、做市、OTC、衍生品和报告系统。
        - id: venues
          label: 场所和对手方
          detail: 中心化 / 去中心化场所、FX 流动性、OTC 对手方和做市商。
        - id: reg_entities
          label: 受监管实体边界
          detail: FINRA 经纪交易商记录、英国 / 新加坡声明、FCA/MiCA 语境和客户资格。
        - id: digift
          label: DigiFT
          detail: 面向代币化 RWA 流动性的受监管平台和智能合约结算。
        - id: chainlink
          label: Chainlink
          detail: 面向稳定币发行人的 CCIP、数据、储备证明、隐私、合规和运行环境。
        - id: kalshi
          label: Kalshi
          detail: 接收流动性支持的受监管永续期货市场场所。
        - id: zama
          label: Zama
          detail: 面向已 KYC 的 OTC 对手方的机密链上转账协议。
        - id: finery
          label: Finery Markets
          detail: 通过 ECN/SaaS 将 GSR 可成交报价分发给机构参与者。
        - id: clients
          label: 机构客户 / 发行人
          detail: 需要合规接入、执行质量、隐私、结算、分析和支持。
      edges:
        - from: clients
          to: reg_entities
          label: 必须满足
        - from: reg_entities
          to: gsr_stack
          label: 划定接入边界
        - from: gsr_stack
          to: venues
          label: 从中获取流动性
        - from: gsr_stack
          to: digift
          label: 通过其结算 RWA 交易
        - from: gsr_stack
          to: chainlink
          label: 与其打包稳定币基础设施
        - from: gsr_stack
          to: kalshi
          label: 向其提供场所流动性
        - from: gsr_stack
          to: zama
          label: 与其测试机密结算
        - from: gsr_stack
          to: finery
          label: 通过其分发可成交报价
        - from: digift
          to: clients
          label: 支持 RWA 投资者工作流
        - from: chainlink
          to: clients
          label: 支持稳定币发行人工作流
    approximationNotes: 依赖图基于公开合作和监管语境；合同归属和 SLA 未公开。
