  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发
    rows:
      - - 牛市
        - 代币化、经纪交易商资本形成、财资顾问和 OTC 增长复合，形成可持续的费用和价差收入。
        - 如果 2026 年收入和利润超过 2024 年基数，且组合质量更高，>$1B 的战略溢价可以成立。
        - SC Ventures 合作、Libeara、GSR Securities 和 GSR One 都转化为收入。
        - 到下一轮尽调刷新时，仍无经常性顾问收入或受监管委托收入证据。
      - - 基准
        - GSR 仍是有规模且盈利的做市商，资本市场服务增量推进，交易量随周期波动。
        - 由于当前 run-rate 和优先权结构仍私有，>$1B 虽可成立，但应加结构保护或折价。
        - 已报道的 2024 年利润、规模主张和可比区间支持继续关注。
        - 交易所成交量持续疲软，管理层无法证明利润率韧性。
      - - 熊市
        - 交易量压缩，冲突 / 监管审查升温，战略融资需要高级优先权。
        - 为守住下行，需要下轮降价、平轮或厚重投资人保护。
        - 市场成交量疲软、条款未披露以及行业 / 监管负面信号占主导。
        - 出现监管问题、客户集中，或当前收入显著低于 2024 年基数。
    notes: 公开来源不支持这种精度，因此未分配明确概率百分比。
