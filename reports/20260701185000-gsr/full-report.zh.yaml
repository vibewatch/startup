            body: 对 GSR 可投资的市场不是完整加密市值，而是能转化为费用或价差的机构流动性、执行、代币化和资金管理流程子集。
            calloutType: insight
            claimRefs:
              - CM036
              - CM037
          - type: callout
            title: 监管既是催化剂，也是限速器
            body: 2026 年监管清晰度可以释放预算，但 FCA、MiCA、IOSCO、Federal Reserve 和沙盒约束也会推高合规成本，并放慢部分发布。
            calloutType: risk
            claimRefs:
