      - number: '3.4'
        title: 切换成本、多供应商使用、护城河与不利风险
        blocks:
          - type: paragraph
            body: >-
              切换成本看起来中等，而非很高。机构买方可以在多个 OTC 柜台和做市商之间多供应商使用，因为若干提供商都暴露 API、语音、网页、RFQ
              或双边报价流程，而流动性供给这项底层任务，并不像深度嵌入的企业系统那样具有专属性。摩擦在于合规准入、结算可靠性、交易对手限额、信用、资本接入，以及柜台在压力市场中行为良好的信心。因此，当 GSR 把受监管
              U.S. broker-dealer 能力、SC Ventures 背书、资产宽度、透明度工具和代币化组织运营基础设施打包起来时，护城河最强。不利面同样重要。SEC
              对所谓做市商的行动显示，该行业可能与操纵风险绑定；BIS 和 IOSCO 警示集中化、冲突、欺诈和运营风险；TokenInsight 的 2026 年 Q1 成交量下降指向交易经济性的周期压力；The Block
              关于 GSR 高管离职的报道则带来连续性问题。因此，竞争结论是正面但不能自满：GSR 有可信的机构护城河，但如果受监管分发和平台深度不能变得明显粘性，商品化和母公司支持的同业会侵蚀它。
