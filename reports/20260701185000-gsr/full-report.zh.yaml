      - number: '8.2'
        title: 论点、反论点与情景区间
        blocks:
          - type: paragraph
            body: >-
              GSR 的核心论点是，它可以从大型加密做市商演进为受监管、全栈的数字资产资本市场伙伴。证据支撑这些要素：GSR One 增加透明度和报告，OTC 升级扩大资产和法币覆盖，Autonomous 和
              Architech 收购补上资金管理与咨询能力，Libeara 提供代币化通道，GSR Securities 则为发行人资本形成打开美国券商路径。反论点同样关键。2026 年 Q1 和 5
              月数据显示交易量下滑，公开财务披露不完整，GSR 条款明确写出自营交易冲突，监管方仍持续关注做市商行为、冲突、托管和滥用。因此，情景分析应写成区间和触发器，而不是精确
              DCF。只有受监管代币化和咨询业务能把块状做市经济转成耐久手续费收入时，牛市情景才值得给溢价。基本情景是一个有利润、有规模、具战略意义但收入周期性强的做市商。熊市情景则是交易量、合规成本或信任问题压缩盈利后，出现
              降价轮或结构化融资。
