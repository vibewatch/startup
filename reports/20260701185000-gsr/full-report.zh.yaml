      - number: '7.4'
        title: 人员、执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              人员风险和财务模型风险绑在一起。GSR 当前公开团队页展示出可信的高管梯队：Xin Song 任 CEO，Jakob Palmstierna 任总裁，Cristian Gil
              任董事长，首席法务与战略官具备产品和监管经验。但 2024 年领导层调整并不平静：BusinessWire 先宣布联席 CEO 与总裁架构，随后 The Block 报道联合创始人 / 联席 CEO Rich
              Rosenblum 和 CTO John MacDonald 离任。这不能证明组织失灵，但值得重视，因为 GSR 同期完成了 $57 million
              收购、完成券商收购、加深战略银行关系，并扩展咨询和代币化野心。财务上，外部数据正面但不完整。Ledger Insights 报道截至 2024 年 6 月的年度收入 $287 million、税后利润 $71
              million、估值 $1 billion；Companies House 则显示当前英国账目到 2027 年 3 月才到期。因此，模型风险集中在收入结构、交易资本、集中度、债务、库存和收购后整合经济性的不透明。
