    sections:
      - number: '8.1'
        title: 建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              投资结论是跟踪 / 继续研究，不是买入。GSR 有可信的规模信号：SC Ventures 成为首位外部战略股东，独立报道显示交易估值高于 $1 billion，官方页面称客户超过 1,000 个、交易量超过 $1
              trillion，FINRA 券商收购也扩展了美国资本市场可选路径。今天不承销买入，不是因为公司质量，而是因为价格和证据质量。轮次规模未披露，GSR
              可能正在寻求额外战略资本，公开备案也没有披露当前收入年化水平、利润率、现金、债务、头部客户集中度或清算优先权。截至 2024 年 6 月的年度，报道收入 $287 million、税后利润 $71
              million，这让报道估值有一定合理性；但相对于 2026
              年收购、监管扩张和交易所成交量波动，这些数据已经滞后。入场需要满足至少一项：更低价格、保护投资人的条款，或管理层数据室能确认当前增长、盈利质量、资产负债表承载力和优先权负担。
