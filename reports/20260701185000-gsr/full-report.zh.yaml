            body: >-
              2026 年 SC Ventures 投资之后，资本充足性方向上更强，但公开记录仍不足以承销。SC Ventures 称其成为 GSR
              首个外部战略股东，双方合作旨在建设合规、可扩展的机构数字资产基础设施。Bloomberg syndicated Yahoo 报道称，该交易对 GSR 的估值高于 $1 billion，且 GSR
