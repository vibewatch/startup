      - 指标 / 估值标记
      - 状态
      - 与 GSR 的相关性
      - 局限
    rows:
      - - GSR
        - 据报估值 >$1B；截至 2024 年 6 月财年收入 $287M，税后利润 $71M。
        - 新近 2026 年战略投资背景。
        - 直接估值锚点，也是唯一公开 P&L 线索。
        - 轮次规模、证券条款和 2026 年财务数据仍未公开。
      - - Keyrock
        - 官方 2026 年 Series C 新闻稿称估值 $1.1B；独立报道提到可能最高融资 $100M。
        - 新近私募做市商可比对象。
        - 当前最接近的独角兽估值锚，与 SC Ventures 有重叠，覆盖 85 个场所，运营规模 220 人。
        - 地理、人数和业务组合不同；滚动交割和确切证券条款未公开。
      - - Amber Group
        - 2022 年 Series B+ 对 Amber 估值 $3B，累计融资 $328M。
        - 较早期的综合数字资产平台可比对象。
        - 展示有规模数字资产服务在上行周期的战略价值。
        - 消费者 / AUM / 业务组合不同，市场周期也更早。
      - - Wintermute
        - 2021 年 $20M Series B；截至 2020 年 12 月月交易量 $30B。
        - 历史做市增长可比对象。
        - 验证流动性供给中的高经营杠杆。
        - 未披露估值，年份早于 2022-2023 年加密市场重置。
      - - B2C2
        - SBI 先持有少数股权，随后收购 B2C2；B2C2 称合作后 OTC 交易量翻了四倍。
        - 战略买方 / 机构交易台可比对象。
        - 展示银行旗下加密交易和流动性基础设施的战略收购路径。
        - 公开稿未提供当前估值或倍数。
      - - Cumberland / DRW
        - DRW 支持的全球加密资产流动性业务。
        - 战略性在位者可比对象。
        - 凸显资金雄厚交易公司的竞争。
        - 无独立估值或收入指标。
      - - 市场成交量背景
        - 2026 年 Q1 交易所成交量环比下降 32%；5 月中心化成交量下降 3.45% 至 $4.41T。
        - 市场周期参照。
        - 勾勒做市商收入敏感性。
        - 交易所层面成交量不是 GSR 特定收入。
