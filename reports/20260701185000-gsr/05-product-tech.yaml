- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / quality area
  - Public status
  - Scope
  - Gap
  rows:
  - - Counterparty onboarding and KYC/AML
    - Disclosed in trading terms
    - Trading and liquidity services for approved counterparties
    - No onboarding pass/fail metrics or sanctions-screening details
  - - Privacy and data protection
    - Privacy notice references GDPR, UK DPA, rights, DPO, and non-UK annexes
    - Clients, market participants, suppliers, enquirers, visitors, newsletter subscribers
    - No third-party privacy/security audit posted
  - - Acceptable use and site security
    - AUP prohibits unlawful use, spam, harmful code, and abusive content
    - Website and user interactions
    - Not a substitute for product security controls
  - - Principal conflicts and pre-hedging
    - Trading terms disclose principal role, conflicts, price discretion, and pre-hedging
    - OTC and related trading activities
    - Need surveillance, information-barrier, and best-execution policy evidence
  - - Broker-dealer/regulatory footprint
    - FINRA BrokerCheck lists GSR Securities LLC; GSR claims US/UK/Singapore/Switzerland permissions
    - Regulated entities and relevant jurisdictions
    - Exact product permissions and entity mapping need counsel review
  - - UK/EU crypto regime readiness
    - FCA 2026 final rules and MiCA/ESMA regime are live context
    - Cryptoasset firms, promotions, permissions, EU CASP-like activities
    - Need jurisdiction-by-product compliance matrix
  - - Impersonation/phishing response
    - GSR issued an impersonation alert with verification hygiene steps
    - Partners, clients, public communications
    - Need incident count, takedown process, and control owner
  - - Market integrity adverse control
    - SEC enforcement against other market makers shows manipulation risk category
    - Sector-level market-making surveillance and controls
    - Need GSR-specific surveillance, wash-trade, spoofing, and conflict-control testing
  notes: Regulatory and legal rows are public-record/status checks; they do not prove control operating effectiveness.
