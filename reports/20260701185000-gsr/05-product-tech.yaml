- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow pain
  - GSR solution
  - Measurable public benefit
  - Limitation
  rows:
  - - Token issuer needs market quality
    - Fragmented venues and shallow order books
    - Market making with KPIs and automated reporting
    - 60+ exchange footprint, spread/depth/uptime/volume tracking
    - No public contract-level KPI outcomes
  - - Institution needs large asset/FX execution
    - Slippage, opaque depth, fragmented crypto-fiat liquidity
    - Systematic OTC or high-touch OTC
    - 200+ assets, 25+ fiat, up to $100M ticket claim
    - No public fill-quality or rejected-order data
  - - Foundation needs treasury planning
    - Token-heavy balance sheet and fragmented advisors
    - Risk, treasury, Autonomous, Architech advisory
    - Cash planning, risk management, token economics, exchange strategy
    - No revenue mix or advisory retention metrics
  - - RWA investor needs secondary liquidity
    - Delayed NAVs and limited tokenized-asset tradeability
    - DigiFT OTC liquidity with GSR quotes
    - Live Asian-hours liquidity for named RWA tokens
    - Future 24/7 coverage and automation not yet proven
  - - Stablecoin issuer needs launch infrastructure
    - Multi-chain data, reserves, compliance, fiat access, market access
    - Chainlink infrastructure plus GSR capital-markets support
    - CCIP, Proof of Reserve, compliance/privacy standards, liquidity/OTC/fiat access
    - Qualified issuer selection and production outcomes undisclosed
  - - Regulated market venue needs liquidity
    - Onshoring perps requires market depth and efficient books
    - GSR liquidity for Kalshi perpetual futures
    - GSR participation in CFTC-regulated perpetual futures markets
    - Agreement terms and liquidity contribution not public
  - - DeFi protocol needs token liquidity
    - New token market depth and ecosystem confidence
    - Official market-making deployment
    - Sonic Labs named GSR official market maker for S token
    - No market-depth or retention data disclosed
  notes: Workflow benefits are stated or inferred from public sources; quantitative customer outcomes are mostly unavailable.
