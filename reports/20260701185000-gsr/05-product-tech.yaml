- id: trust-safety-security-compliance-and-quality-controls
  title: Trust, Safety, Security, Compliance, and Quality Controls
  body: 'Trust controls are material because GSR’s products combine principal trading, client data, settlement workflows, regulated venues, and market-making activities in a sector with known manipulation and impersonation risks. The public control file is strongest on legal and process disclosures: GSR describes approved-counterparty onboarding, due diligence, KYC/AML, principal-capacity conflicts, pre-hedging, no-advice terms, privacy-law coverage, acceptable-use rules, and a phishing/impersonation response checklist. Regulatory sources add context: FINRA BrokerCheck lists GSR Securities LLC as a registered broker-dealer entity, FCA guidance shows a changing 2026 UK crypto regime, and MiCA/ESMA materials define the EU regime relevant to cross-border product deployment. The adverse read is not that public evidence shows GSR manipulation; rather, the SEC’s cases against other crypto market makers and GSR’s own conflict disclosures make surveillance, conflicts governance, market-abuse controls, and independent security assurance key diligence requests. The biggest quality-control gap is external verification: SOC/ISO, uptime logs, audit reports for GSR One, and incident history are not
    public.'
