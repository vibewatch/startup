chapter:
  number: 5
  title: Product & Technology
  summary: 'GSR’s product is a hybrid institutional capital-markets stack: proprietary OTC/market-making execution, GSR One analytics, human coverage, regulated-entity controls, and partner rails for RWAs, stablecoins, perps, and confidential settlement. Public evidence supports breadth and live deployment, but core diligence gaps remain around independent reliability metrics, API/security documentation, incident history, and entity-by-product regulatory scope.'
sections:
- id: product-surface-and-workflow-definition
  title: Product Surface and Customer Workflow Definition
  body: 'GSR is best understood as a digital-asset capital-markets operating platform rather than a single software SKU. The public surface starts with a Markets line that includes systematic OTC, high-touch OTC, market making, options and structured derivatives, treasury/risk management, and DeFi liquidity, then extends into advisory and asset-management adjacencies. In workflow terms, a token issuer, exchange, payment provider, asset manager, or institution enters through relationship-led discovery, must pass approved-counterparty onboarding and KYC/AML where trading is involved, and then uses GSR for liquidity, execution, risk transfer, market-quality support, treasury planning, or launch/advisory work. The strongest productized interface is GSR One, which unifies real-time trading activity, execution tracking, customized market-making analytics, wallet/security controls, treasury integration, and onboarding. The result is a hybrid service-plus-platform model: software exposes liquidity and analytics, while human coverage, balance sheet, regulated entities, and partner infrastructure deliver the actual trading or capital-markets outcome. This framing also clarifies which public claims
    are product proof and which remain diligence requests.'
