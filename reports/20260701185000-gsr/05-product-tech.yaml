  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: GSR One and systematic OTC uptime history, incident postmortems, latency targets, fill-quality reports, support SLAs, and disaster-recovery evidence.
    whyItMatters: Reliability is central to market making and OTC execution; public claims of uptime and resilience are not independently auditable.
    diligencePath: Request customer-facing SLA templates, status-history exports, incident logs, architecture review, and two reference calls focused on execution reliability.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: developer signal
    missingEvidence: Public API documentation, SDKs, GitHub repositories, changelog, technical blog, package downloads, or engineering talk materials tied to GSR trading products.
    whyItMatters: A thin public developer surface makes it harder to verify extensibility, integration quality, developer adoption, and technology depth.
    diligencePath: Ask GSR for API docs under NDA, release notes, integration guide, engineering headcount by platform, and security/developer-roadmap materials.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: security attestation
    missingEvidence: SOC 2, ISO 27001, penetration-test summaries, access-control design, vendor-risk program, and GSR One security architecture evidence.
    whyItMatters: Trading portals, wallet-control features, client data, and settlement workflows carry operational and cyber risk that legal terms alone do not mitigate.
    diligencePath: Request current security attestations, latest penetration-test executive summary, cloud/security architecture, vendor inventory, and incident-response tabletop results.
    relatedQuestionRefs:
    - QE020
    - QE021
    - QE022
    relatedTableRefs:
    - TE004
  - type: conflicting-data
    severity: minor
    topic: regulatory entity scope
    missingEvidence: Entity-by-entity mapping of which GSR affiliates provide each product in each jurisdiction, including FCA/MAS/FINRA/Singapore/Switzerland permissions and restrictions.
    whyItMatters: Marketing pages aggregate capabilities globally, but investor risk depends on the precise regulated entity and product perimeter.
    diligencePath: Have counsel review licenses, customer contracts, order forms, regulatory permissions, and jurisdictional exclusions for each product module.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
