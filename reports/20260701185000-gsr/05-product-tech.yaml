- id: architecture-integration-reliability-and-support
  title: Architecture, Integration, Reliability, and Support
  body: 'The public architecture resolves into six layers: client access through UI, API, and coverage teams; proprietary pricing, routing, and algorithmic execution; liquidity supply across global counterparties and venues; execution and settlement rails; GSR One reporting and analytics; and compliance/onboarding controls. That architecture is credible because multiple sources identify concrete surfaces—more than 200 digital assets, more than 25 fiat currencies, 60-plus exchange integrations, API/UI access, fast settlement, automated reporting, and market-making KPIs. Integration maturity is uneven by product line. Core market-making and systematic OTC are mature and live; DigiFT, Finery, Chainlink, Kalshi, and Zama show extensibility through partner rails; however, several critical engineering details remain private. Public materials do not provide latency targets, incident history, a status page, service-level commitments, security certifications, or postmortems. Support appears high-touch and institutional, with coverage and execution specialists supporting bespoke trades while GSR One should reduce manual reporting and onboarding load.'
