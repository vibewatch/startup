figures:
- id: FE001
  title: Product Architecture Map
  type: stack
  layout: wide
  summary: GSR’s public architecture stacks institutional access, proprietary execution, liquidity networks, settlement, analytics, and controls.
  data:
    layers:
    - label: Client access and coverage
      detail: Institutions, issuers, treasuries, and partners access GSR through relationship coverage, GSR One, systematic OTC UI/API, or high-touch trading desks.
      modules:
      - GSR One
      - Systematic OTC UI/API
      - Coverage and execution specialists
    - label: Pricing, routing, and risk engine
      detail: Proprietary algorithms, pricing discretion, pre-hedging, internalization, and risk-management processes convert demand into executable quotes.
      modules:
      - Proprietary routing
      - Pricing models
      - Hedging and exposure controls
    - label: Liquidity and venue network
      detail: GSR sources and supplies liquidity across centralized venues, decentralized venues, OTC counterparties, FX liquidity, and partner distribution.
      modules:
      - 60+ CEX/DEX venues
      - Global counterparties
      - Finery ECN
      - FX liquidity
    - label: Execution and settlement rails
      detail: Trades settle through fiat/digital-asset rails, regulated partner platforms, smart contracts, or privacy-preserving on-chain protocols depending on use case.
      modules:
      - OTC settlement
      - DigiFT smart contracts
      - Zama confidential transfers
      - Kalshi venue liquidity
    - label: Reporting and analytics
      detail: GSR One and market-making reporting expose order-book depth, performance metrics, custom KPIs, execution tracking, and treasury integration.
      modules:
      - Custom KPIs
      - Automated reporting
      - Treasury analytics
    - label: Trust and compliance controls
      detail: KYC/AML onboarding, privacy notices, legal terms, acceptable-use rules, conflict disclosures, and regulated entities constrain access and behavior.
      modules:
      - KYC/AML
      - Privacy and legal terms
      - FINRA/FCA/MiCA context
  approximationNotes: Layering is inferred from public service descriptions; GSR does not publish a detailed engineering architecture.
