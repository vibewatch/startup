- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: >-
    Capital adequacy looks directionally stronger after the 2026 SC Ventures investment, but the public record is not underwritable. SC Ventures says it became GSR's first external strategic shareholder and that the partnership is meant to build compliant, scalable institutional digital-asset infrastructure. Bloomberg-syndicated Yahoo coverage says the deal valued GSR above $1 billion and that GSR was in talks to raise as much as $150 million more from strategic investors; FinanceFeeds separately says financial terms were not disclosed while multiple reports point to an above-$1 billion valuation. These are valuation and investor-support signals, not cash-balance evidence. On the use-of-funds side, GSR spent $57 million to acquire Autonomous and Architech, received FINRA approval to complete a broker-dealer acquisition, and expanded advisory, treasury, and capital-formation capabilities. Those moves indicate an active buildout that may require continuing investment in compliance, engineering, regulated entities, and balance-sheet capacity. Missing items are cash on hand, monthly burn, runway, debt, trading capital allocation, collateral demands, and whether the strategic round covered the acquisition and U.S. regulatory expansion plan.
