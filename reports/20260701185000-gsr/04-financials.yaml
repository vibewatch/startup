- id: TI002
  title: Pricing / Monetization and Recognition Table
  columns:
  - Pricing / recognition signal
  - Source-backed evidence
  - List vs realized
  - Financial implication
  - Unsupported gap
  rows:
  - - OTC minimum ticket
    - GSR OTC page says a minimum trade value of $250,000 is required.
    - List / eligibility signal only.
    - Screens for institutional-sized flow and reduces small-ticket service burden.
    - Realized spread, minimum by asset, and waived-minimum exceptions are undisclosed.
  - - Maximum trade capacity
    - Markets and systematic OTC materials describe support for trade sizes up to $100 million.
    - Capacity claim, not revenue.
    - Indicates need for deep liquidity, banking/settlement capacity, and risk controls.
    - No disclosure of average ticket size, fill rate, or net economics per trade.
  - - Principal-dealer model
    - Terms say GSR usually acts as principal, not agent or fiduciary.
    - Recognition likely net trading economics plus fees, but not disclosed.
    - Revenue quality depends on spread capture, hedging, and inventory outcomes.
    - Need accounting policy and revenue bridge by trading gains, fee revenue, and advisory.
  - - Market-making KPI programs
    - Official pages reference spread, depth, volume, market share, uptime, volatility, and automated reporting.
    - Contract structure unknown.
    - Supports retainers or performance fees, but can also require capital inventory.
    - Need contract samples, KPI targets, penalties, and token inventory terms.
  - - Advisory and treasury services
    - Acquisition materials describe cash/liquidity planning, cash-flow forecasting, risk management, capital allocation, and fundraising/exchange strategy.
    - Fee structure unknown.
    - Potentially higher-quality service revenue if not tied to trading P&L.
    - Need segment P&L and recurring vs project revenue.
  - - Third-party P&L datapoint
    - Ledger Insights reports $287 million revenue and $71 million after-tax profit for the year ending June 2024.
    - Third-party-reported, not audited in the public source reviewed here.
    - Suggests meaningful scale and profitability at least historically.
    - No segment mix, accounting policy, or 2025/2026 update.
  notes: Table separates public pricing/eligibility signals from realized monetization and accounting recognition; no margin or ARR is invented.
