    - null
    - Low
    - Core driver of principal OTC economics.
    - Provide net spread after hedging, venue fees, settlement costs, and losses.
  - - Inventory and collateral intensity
    - Principal model and derivatives imply capital needs, but amounts are undisclosed.
    - Low
