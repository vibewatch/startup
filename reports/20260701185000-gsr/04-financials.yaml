chapter:
  number: 4
  title: Financials
  summary: >-
    GSR has multiple public monetization surfaces—principal OTC trading, market making, derivatives, treasury/risk management, advisory, venture/asset-management adjacencies, and regulated capital-markets expansion—but the public financial file remains thin. Third-party reporting says GSR generated $287 million of revenue and $71 million of after-tax profit for the year ending June 2024, and Bloomberg-syndicated coverage says SC Ventures' 2026 investment valued the firm above $1 billion; those figures are useful but not enough to underwrite revenue mix, gross margin, burn, or runway. The financial verdict is medium-confidence: public evidence supports real scale and capital-market relevance, while private-metric gaps around realized spread, inventory risk, customer concentration, cash, debt, and segment profitability remain blockers.
sections:
- id: revenue-model-pricing-and-recognition
  title: Revenue Model, Pricing, and Recognition
  body: >-
    GSR monetizes a broader capital-markets stack than a simple token market-making retainer. The official services pages support at least five revenue families: principal OTC execution, market-making programs, bespoke options and structured derivatives, treasury/risk-management solutions, and advisory/capital-planning work for tokenized organizations. The strongest explicit pricing signal is the OTC page's $250,000 minimum trade value, while the markets page says GSR supports transactions up to $100 million and serves more than 1,000 clients with more than $1 trillion of traded volume. Public pages do not disclose realized spreads, retainers, taker/maker fees, advisory fees, asset-management fees, or revenue by segment. Recognition is also a diligence issue: the terms of business say GSR usually acts as principal, not agent, so trading economics likely blend spread capture, inventory/hedging outcomes, and negotiated service fees rather than clean subscription ARR. Ledger Insights provides the only explicit historical P&L datapoint found, reporting $287 million of revenue and $71 million of after-tax profit for the year ending June 2024, but that third-party figure does not break out trading gains versus service revenue.
