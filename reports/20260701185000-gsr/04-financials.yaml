- id: verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: >-
    The financial verdict is cautiously positive but not model-ready. GSR has public evidence of scale, a broad institutional product surface, regulatory momentum, and a strategic investor that plausibly improves access to banking and tokenization channels. The best case is an increasingly diversified capital-markets platform with multiple ways to monetize institutional digital-asset activity: principal spread, market-quality retainers, bespoke derivatives, advisory, treasury, and regulated capital formation. The underwriting blockers are equally clear. GSR does not disclose current revenue, revenue mix, gross margin, adjusted EBITDA, cash, burn, runway, trading capital, debt, or customer concentration. The 2024 third-party revenue/profit datapoint is encouraging but stale relative to 2026 strategic expansion and does not reveal how much profit depends on market conditions. Adverse context also matters: SEC enforcement against other crypto market makers shows why transparent controls are a financial necessity, GSR's own terms disclose principal-trading conflicts, and litigation history includes a case in which GSR was left out $2 million in Bitcoin. The diligence path is to request audited consolidated accounts, segment P&Ls, trading-risk limits, cash/runway, top-customer concentration, and contract samples before assigning a high-confidence valuation multiple.
