- id: TI006
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current revenue and growth
    - Blocks 2026 revenue multiple, growth durability, and post-2024 trend analysis.
    - Request audited 2024-2026 monthly revenue by segment and bridge to management KPI definitions.
  - - Revenue mix and recognition
    - Principal trading, retainers, advisory, derivatives, and asset management deserve different quality scores.
    - Request accounting policies and revenue waterfall by net trading gains, fees, retainers, advisory, and investments.
  - - Gross margin and trading loss history
    - Determines whether profitability is durable or market-regime-dependent.
    - Request gross margin by stream, hedge P&L, drawdowns, loss days, and VaR limit breaches.
  - - Cash, burn, runway, and debt
    - Prevents direct capital adequacy assessment after 2026 expansion.
    - Request current cash, monthly burn, debt/facilities, collateral, and runway under base/downside plans.
  - - Customer and counterparty concentration
    - Token issuer or institution concentration could make revenue cyclical.
    - Request top-10 revenue share, active counterparties, retention, and largest exposure limits.
  - - CAC, payback, and sales cycle
    - Public partner traction does not quantify sales efficiency.
    - Request pipeline conversion, sales-cycle length, CAC/payback, partner-sourced bookings, and renewal cohorts.
  - - Regulated-entity economics
    - Broker-dealer and multi-jurisdiction posture may create moat and cost burden.
    - Request regulatory capital requirements, compliance cost, regulated revenue, and planned product scope.
  - - Adverse controls and conflicts
    - Principal-trading conflicts and industry manipulation enforcement make controls financially material.
    - Request conflicts policy, surveillance tooling, pre-hedging controls, complaints, and regulatory exams.
  notes: These blockers are the minimum data request to move from medium-confidence directional assessment to a financial model.
