  title: Capital Intensity / Cash-Flow Map
  type: matrix
  layout: wide
  summary: GSR's capital intensity depends on the mix between balance-sheet-heavy principal trading and lighter advisory/platform revenue.
  data:
    columns:
    - Capital intensity
    - Public support
    - Diligence implication
    rows:
    - label: Principal OTC and derivatives
      values:
      - High / variable
      - Terms describe principal dealing, pricing discretion, hedging, and internalization.
      - Need inventory, collateral, VaR, and loss-history data.
    - label: Market-making mandates
      values:
      - Medium to high
      - Official pages cite exchange integrations, KPIs, and liquidity provision.
      - Need token inventory, retainer, spread, and penalty terms.
    - label: Advisory and treasury
      values:
      - Low to medium
      - Acquisition materials add cash planning, risk management, capital allocation, and fundraising support.
      - Need fee revenue, utilization, and attach to trading revenue.
    - label: Broker-dealer / regulated capital markets
      values:
      - Medium
      - FINRA approval enables regulated U.S. institutional support and issuer capital raising.
      - Need regulatory capital and compliance cost.
    - label: GSR One analytics platform
      values:
      - Low incremental if built once
      - GSR One unifies onboarding, execution tracking, market-making analytics, and treasury services.
      - Need adoption, support cost, and retention lift.
  approximationNotes: Matrix is a qualitative capital-intensity map; cash, debt, collateral, and margin data are private.
