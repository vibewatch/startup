    - Provide inventory, collateral, margin, counterparty exposure, and VaR by asset class.
  - - Technology and exchange-integration leverage
    - 60-plus exchange integrations, automated reporting, and proprietary systems.
    - Medium
    - Scale leverage depends on automation versus high-touch service burden.
