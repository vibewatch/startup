tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Stream
  - Mechanism
  - Unit / pricing signal
  - Public value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Principal OTC execution
    - GSR quotes and executes large spot or derivative trades as counterparty.
    - Spread / negotiated price; $250,000 minimum trade value and up to $100 million per trade disclosed.
    - Official pages support 200-plus digital assets, 25-plus fiat currencies, and broad OTC access.
    - Medium; demand is concrete, realized spread and volatility are not public.
    - Provide realized spread, volume, net trading revenue, and counterparty concentration by quarter.
  - - Market-making programs
    - Liquidity provision across centralized and decentralized venues with KPIs such as spread, depth, volume, market share, uptime, and volatility.
    - Retainer, performance fee, spread capture, inventory economics, or hybrid; public terms not disclosed.
    - Official pages cite 60-plus exchange integrations and automated performance analytics.
    - Medium; repeatable if contracts are KPI-based, riskier if economics rely on token inventory.
    - Share contract templates, KPI fee schedules, token inventory policy, and gross margin by mandate.
  - - Bespoke options and structured derivatives
    - Custom swaps, options, hedges, yield strategies, and treasury optimization for institutions and crypto-native teams.
    - Bilateral pricing; no public rate card.
    - Options and risk-management pages describe tailor-made structures and volatility/risk reduction.
    - Medium; differentiated but exposes hedging and counterparty risk.
    - Provide derivative P&L, collateral terms, hedge effectiveness, and counterparty credit exposure.
  - - Treasury and risk-management services
    - Cash/liquidity planning, risk management, capital allocation, hedging, yield strategies, and runway modeling.
    - Advisory fee, execution revenue, or asset-management-linked economics; not disclosed.
    - Acquisition of Autonomous and Architech explicitly expands treasury, capital planning, and advisory capabilities.
    - Medium; less balance-sheet-intensive if fee-based.
    - Break out recurring advisory fees, one-off project fees, and attached trading revenue.
  - - Digital asset advisory / capital formation
    - Token design, go-to-market, fundraising, exchange strategy, and regulated broker-dealer-enabled issuer support.
    - Project fee, success fee, placement fee, or advisory retainer; no public pricing.
    - FINRA approval and advisory acquisitions expand the product surface.
    - Medium; strategic upside but dependent on regulatory scope and deal flow.
    - Provide pipeline, completed mandates, fee structure, and regulatory-permission limits.
  - - Venture and asset management adjacencies
    - Strategic venture backing, asset-management capabilities, and ecosystem investments.
    - Management fees, carry, gains, or strategic returns; not disclosed.
    - Official and partner releases reference venture backing and asset-management capabilities.
    - Low to medium; monetization may be episodic or mark-to-market.
    - Separate fee revenue from investment gains and mark-to-market movements.
  - - Stablecoin and tokenization enablement
    - Liquidity provisioning, OTC, fiat access, advisory, and distribution support for issuers.
    - Program or transaction economics not disclosed.
    - Chainlink and DigiFT materials position GSR as a capital-markets partner for stablecoins and RWAs.
    - Medium; secular demand is strong but contract economics are opaque.
    - Provide issuer contract economics and attach of liquidity, advisory, and trading revenue.
  - - Client analytics / platform layer
    - GSR One delivers real-time insights, onboarding, market-making analytics, execution tracking, treasury integration, and reporting.
    - Likely bundled enablement; standalone pricing not public.
    - Official GSR One launch supports workflow automation and transparency.
    - Low as standalone revenue, medium as retention and service-cost lever.
    - Clarify whether GSR One is separately monetized or bundled into trading and market-making relationships.
  notes: Rows cover public monetization surfaces; GSR does not disclose actual revenue mix, realized spreads, fee schedules, or segment margins.
