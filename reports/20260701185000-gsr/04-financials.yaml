  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current revenue, ARR-style recurring revenue if any, revenue by segment, and revenue-recognition policy.
    whyItMatters: Without segment revenue and recognition, principal trading gains cannot be separated from more durable service or advisory revenue.
    diligencePath: Request audited consolidated statements, revenue waterfall, accounting policy memo, and monthly 2025-2026 management accounts.
    relatedQuestionRefs:
    - QI003
    - QI026
    relatedTableRefs:
    - TI002
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin, take rate, hedging cost, inventory losses, venue fees, settlement cost, and support cost by business line.
    whyItMatters: GSR's revenue quality depends on whether profits come from durable fee streams or volatile trading/inventory outcomes.
    diligencePath: Request segment P&L, trading-risk dashboard, loss-day history, hedge effectiveness, and direct-cost allocation by product.
    relatedQuestionRefs:
    - QI011
    - QI026
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash on hand, monthly burn, runway, debt, collateral requirements, and post-investment use of funds.
    whyItMatters: Strategic investment and valuation reporting cannot be converted into runway without actual liquidity and obligations.
    diligencePath: Request treasury report, operating plan, debt schedule, collateral schedule, and board-approved downside case.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, sales cycle, win rate, partner-sourced pipeline, renewal rate, churn, and NRR or equivalent repeat-volume retention.
    whyItMatters: Public partner traction does not prove that GSR acquires and retains mandates efficiently.
    diligencePath: Request CRM funnel export, cohort retention, partner-channel attribution, and revenue renewal/expansion bridge.
    relatedQuestionRefs:
    - QI007
    relatedTableRefs:
    - TI003
    - TI006
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-counterparty exposure, active mandates, and token issuer concentration.
    whyItMatters: A liquidity provider can look diversified publicly while relying financially on a small number of large institutions or token issuers.
    diligencePath: Request anonymized customer concentration schedule, counterparty exposure limits, and revenue by customer cohort.
    relatedQuestionRefs:
    - QI007
    - QI015
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: material
    topic: adverse-controls
    missingEvidence: Direct evidence of GSR's market-surveillance controls, pre-hedging approvals, conflict-management testing, and regulator exam outcomes.
    whyItMatters: SEC enforcement against other market makers and GSR's own principal-trading disclosures make controls financially material.
    diligencePath: Request compliance policies, surveillance screenshots, exam letters, complaints log, and independent controls testing.
    relatedQuestionRefs:
    - QI022
    - QI025
    relatedTableRefs:
    - TI006
