- id: SP-switching-moat-risk
  title: Switching cost, multi-homing, moats, and adverse risk
  body: 'Switching costs look moderate, not high. Institutional buyers can multi-home across OTC desks and market
    makers because several providers expose API, voice, web, RFQ, or two-sided quote workflows, and the underlying
    job of liquidity provision is not proprietary in the way a deeply embedded enterprise system would be. The friction
    sits in compliance onboarding, settlement reliability, counterparty limits, credit, capital access, and confidence
    that the desk will behave well in stressed markets. That is why GSR''s moat is strongest when it bundles regulated
    U.S. broker-dealer capability, SC Ventures validation, asset breadth, transparency tooling, and tokenized-organization
    operating infrastructure. The adverse side is material. SEC action against so-called market makers shows the
    sector can be associated with manipulation risk; BIS and IOSCO warn about centralization, conflicts, fraud,
    and operational risks; TokenInsight''s Q1 2026 volume decline points to cyclical pressure on trading economics;
    and The Block''s reporting on GSR executive departures creates continuity questions. The competitive verdict
    is therefore positive but not complacent: GSR has a plausible institutional moat, yet commoditization and parent-backed
    peers can erode it unless regulated distribution and platform depth become visibly sticky.'
