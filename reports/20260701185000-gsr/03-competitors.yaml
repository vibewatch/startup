- id: SP-capability-pricing-trust
  title: Capability, pricing, GTM, and trust comparison
  body: 'Capability differentiation is narrower than vendor language suggests. Nearly every direct peer can claim
    liquidity, institutional access, or market-making expertise, so underwriting should focus on where the offer
    is both specific and difficult to copy. GSR''s clearest specifics are the 200-plus digital asset and 25-fiat
    OTC claim, GSR One transparency, and the tokenized-organization platform expansion. Cumberland''s specifics
    are workflow and balance-sheet oriented: no prefunding, voice/chat/API/web access, TWAP execution, options,
    and futures. B2C2 emphasizes institutional support and two-sided exchange quoting; Keyrock adds DEX liquidity
    and asset management; Jump builds infrastructure such as Pyth and Firedancer rather than selling a conventional
    OTC desk. Pricing is the weakest public dimension: there are indications of no OTC fees or no prefunding in
    competitor material, but realized spreads, credit terms, rebates, and retainer structures are not disclosed.
    Trust is more evidence-rich. FCA, MiCA, IOSCO, FINRA, and SEC sources imply that compliance posture, conflicts
    controls, custody, and market-integrity procedures increasingly shape vendor selection alongside execution quality.'
  claimRefs:
