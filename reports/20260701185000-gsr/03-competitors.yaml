- id: TP004
  title: Trust and regulatory posture comparison
  columns:
  - Actor / regime
  - Evidence retained
  - Trust benefit
  - Residual risk
  rows:
  - - GSR
    - SC Ventures investment, FINRA broker-dealer approval announcement, FINRA BrokerCheck listing
    - Improves U.S. institutional trust and regulated distribution story
    - Need scope of approved activities and controls under new ownership
  - - Wintermute
    - UK FCA cryptoasset registration stated on website
    - Signals regulatory onboarding and AML registration in a major market
    - Registration is not a full prudential endorsement or pricing proof
  - - B2C2
    - SBI ownership, global offices, regulatory-license milestone claim, Solidus market-integrity partnership link
      on homepage
    - Parent credibility and market-integrity posture help enterprise buyers
    - Detailed current authorizations by jurisdiction need confirmation
  - - Cumberland
    - DRW affiliation and institutional testimonials from Goldman Sachs / Bloomberg
    - Legacy trading parent and distribution references reduce counterparty concern
    - Private metrics and exact regulatory perimeter remain opaque
  - - Keyrock
    - SC Ventures-led reported Series C with Ripple support
    - Bank-linked capital and crypto-native partner validation
    - Valuation and funding amount are not the same as regulatory authorization
  - - MiCA / ESMA / EU
    - Uniform rules covering transparency, disclosure, authorization and supervision
    - Raises bar for all EU-facing competitors
    - Implementation differences and grandfathering can change timing
  - - IOSCO / SEC market-integrity frame
    - IOSCO recommendations and SEC market-maker manipulation case
    - Highlights why controls, conflicts, and surveillance matter
    - Bad actors can taint the broader market-maker category
  - - BIS structural-risk frame
    - BIS highlights fragmentation and de-facto centralization
    - Supports diligence on venue concentration and operational resilience
    - Can weaken moat narratives that rely only on liquidity volume
  notes: Trust posture combines company evidence with regulatory context; it is not a legal opinion on any firm's
    licensing status.
