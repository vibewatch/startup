  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized pricing
    missingEvidence: Provider-level realized spreads, retainers, rebates, credit terms, and minimum-volume commitments
      across GSR and direct peers.
    whyItMatters: Public pages show packaging but not economic durability, so margin pressure and price leadership
      cannot be underwritten from public evidence alone.
    diligencePath: Request anonymized quote logs, spread history, contract templates, and win/loss pricing data
      from GSR and customer references.
    relatedQuestionRefs:
    - QP010
    - QP021
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: customer concentration and retention
    missingEvidence: Active institutional customer counts, top-counterparty concentration, churn, multi-homing share,
      and product attach rates for GSR One and OTC.
    whyItMatters: Switching-cost conclusions remain qualitative until public breadth is tied to retained customer
      behavior.
    diligencePath: Review CRM exports, cohort retention by client segment, counterparty wallet share, and platform
      usage telemetry.
    relatedQuestionRefs:
    - QP008
    - QP016
    - QP017
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: minor
    topic: competitor regulatory perimeter
    missingEvidence: A jurisdiction-by-jurisdiction license and registration matrix for Wintermute, Cumberland,
      B2C2, Amber, Jump, and Keyrock.
    whyItMatters: Regulatory posture is a key competitive variable, but public pages are uneven and can overstate
      comparability.
    diligencePath: Collect regulator-register extracts for each operating entity and reconcile them to customer-facing
      services.
    relatedQuestionRefs:
    - QP012
    - QP014
    - QP015
    relatedTableRefs:
    - TP004
  - type: conflicting-data
    severity: minor
    topic: peer scale metrics
    missingEvidence: Current trading volume, AUM, balance sheet, and revenue for privately held peers using the
      same time window and definitions.
    whyItMatters: Funding valuation and historical volume signals are not interchangeable with current operating
      scale.
    diligencePath: Triangulate management disclosures, exchange counterparty references, investor materials, and
      bank onboarding diligence files.
    relatedQuestionRefs:
    - QP005
    - QP006
    - QP007
    - QP025
    relatedTableRefs:
    - TP001
