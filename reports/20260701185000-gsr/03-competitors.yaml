  - - Market volume tailwinds
    - TokenInsight reported Q1 2026 volume decline, pressuring activity-sensitive revenue
    - Medium
    - Stress-test revenue under lower exchange volumes and higher compliance cost
  notes: Severity reflects risk to GSR's competitive durability, not standalone legal culpability for any cited
