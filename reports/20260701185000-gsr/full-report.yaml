      - number: '2.2'
        title: Sizing lenses and market structure
        blocks:
          - type: paragraph
            body: >-
              The market is large but boundary-sensitive. A broad TAM lens is the digital-asset capital-markets
              universe: BCG sizes crypto assets near $3 trillion, stablecoins near $300 billion, and visible Digital
              RWAs near $30 billion at year-end 2025, while the Federal Reserve updates stablecoin market capitalization
              to $317 billion as of April 2026. A more realistic SAM for GSR is smaller: institutional liquidity,
              execution, tokenization, stablecoin, and treasury workflows where professional market makers or platforms
              are budgeted. Recent exchange data supports demand but also warns against extrapolation. CoinDesk Data
              reported May 2026 centralized exchange volume of $4.41 trillion, while TokenInsight reported Q1 2026
              volume down 32% quarter over quarter to $17.9 trillion. Thus the sizing case needs multiple lenses rather
              than a single headline TAM, with SOM tied to workflows GSR can actually win.
