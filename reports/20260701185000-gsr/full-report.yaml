      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is pulled forward by regulatory normalization, institutional participation, tokenized-asset
              experimentation, stablecoin infrastructure, and demand for transparent execution tooling. The World
              Economic Forum argues that 2026 regulatory clarity and enterprise-grade deployment are pushing blockchain
              toward financial-market infrastructure; SC Ventures’ investment in GSR shows bank-affiliated capital
              targeting institutional liquidity infrastructure; and the DigiFT partnership supplies concrete RWA
              secondary-liquidity proof. The constraints are equally material. IOSCO, the FCA, MiCA, and the Federal
              Reserve show that regulatory compliance, market integrity, financial-stability oversight, and consumer
              protection will shape who can participate. TokenInsight’s Q1 2026 contraction and high venue concentration
              also signal that liquidity demand is cyclical and platform power remains concentrated.
