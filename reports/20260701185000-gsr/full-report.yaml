      - number: '7.2'
        title: Operational, Security, and Client-Outcome Risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is material because GSR’s core business combines always-on trading, discretionary
              pricing, pre-hedging, internalization, client reporting, wallet/security controls, and multiple legal
              entities. The company’s own terms are transparent that it usually acts as principal, may pre-hedge around
              client transactions, may internalize or cross orders, and does not represent that its quoted prices are
              the best available price. Those disclosures are normal for a dealer, but they convert client trust into a
              control-evidence question: investors need to see policies, surveillance, exception logs, and client
              outcome testing, not merely legal notices. GSR One is a meaningful mitigation because it exposes real-time
              trading activity, order-book depth, performance metrics, wallet controls, security management, and
              onboarding. The impersonation alert is also useful because it shows active brand-fraud monitoring, but it
              simultaneously proves fraudsters view the GSR brand as exploitable. Privacy and entity complexity add
              another operational layer across BVI, Hong Kong, Singapore, Spain, Switzerland, UK, and U.S. entities.
            claimRefs:
