  - id: TV006
    title: Thesis-break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue reset
        - 2026 run-rate materially below the reported 2024 revenue base.
        - Invalidates scale support for >$1B.
        - Avoid or require major down-round price.
      - - Margin quality
        - Profit was mainly mark-to-market or one-off trading gain.
        - Weakens durable earnings multiple.
        - Reprice on normalized fee/spread EBITDA only.
      - - Preference overhang
        - New strategic capital has senior liquidation, ratchets, or heavy anti-dilution.
        - Compresses common/new-money return.
        - Demand equal or senior protections or pass.
      - - Regulatory restriction
        - Broker-dealer or crypto permissions do not cover planned capital-formation use cases.
        - Reduces expansion option value.
        - Delay investment until legal perimeter is documented.
      - - Market-integrity issue
        - Current investigation, enforcement, or material surveillance failure emerges.
        - Damages institutional trust and exit readiness.
        - Avoid unless remediated and priced.
      - - Concentration
        - Top customers or counterparties dominate revenue or collateral exposure.
        - Raises churn, credit, and liquidity risk.
        - Require diversification milestones and downside terms.
      - - Volume shock
        - Centralized exchange volumes continue multi-quarter contraction without offsetting advisory revenue.
        - Pressures spread and liquidity economics.
        - Underwrite bear case or wait.
    notes: >-
      Triggers are monitorable diligence thresholds; exact numerical thresholds require management data not public
      sources.
