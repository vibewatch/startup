  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              GSR competes in a crowded institutional crypto liquidity market rather than a clean software category. The
              direct peer group includes crypto-native market makers and OTC desks such as Wintermute, Cumberland, B2C2,
              Amber, and Keyrock; Jump Crypto is adjacent because it combines trading with infrastructure building,
              while internal execution teams and exchange-direct workflows are substitutes for the most sophisticated
              institutions. This matters because GSR's buyer is not simply choosing a vendor; the buyer is deciding how
              much balance sheet, settlement, risk transfer, compliance comfort, and market microstructure expertise to
              outsource. GSR's self-positioning is broad: market making, systematic OTC, GSR One transparency,
              tokenized-organization support through Autonomous and Architech, and market-structure thought leadership.
              That breadth makes the company more strategic than a single-purpose quote provider, but it also invites
              comparison with parent-backed incumbents that can match individual modules. The landscape is therefore
              best read as a many-to-many alternatives map: market makers solve liquidity, incumbents solve trust and
              distribution, infrastructure builders solve protocol-level bottlenecks, and internal teams solve control
              at the cost of operational burden.
