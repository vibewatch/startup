            body: >-
              The capital story is strong but incomplete. The 2026 SC Ventures strategic investment, reported valuation
              above $1 billion, prior funding estimate of $167 million, and Ledger Insights revenue/profit datapoints
              all support a scaled private company narrative. At the same time, the amount and mechanics of the SC
              Ventures deal, whether any secondaries were involved, and whether debt or credit facilities support
              trading activity remain undisclosed. Regulatory positioning is becoming more concrete: GSR’s official
              materials point to UK and Singapore authorisations, FINRA BrokerCheck now lists GSR Securities LLC, and
              FinanceWire reported FINRA approval to complete the broker-dealer acquisition. Partnerships with
              Chainlink, Finery Markets, DigiFT, and Zama add commercial proof across stablecoins, liquidity
              distribution, tokenized real-world assets, and confidential OTC settlement. These proof points support
              institutional ambition but do not by themselves prove recurring revenue quality, retention, or
