              reports, performance analytics, GSR One dashboards, treasury integration, and channel integrations, but
              none of the retained public sources discloses NRR, GRR, churn, renewal rate, contract length, cohort
              retention, or satisfaction scores. The expansion logic is more visible than retention metrics: clients can
              land through market making or OTC, expand into treasury, risk, options, advisory, token launch support,
              stablecoin issuance, regulated capital raising, and broker-dealer-enabled services. The
              Autonomous/Architech acquisition sharpens that path by adding pre-launch, token economics, fundraising,
              and treasury support. Still, every expansion claim should be treated as a pipeline hypothesis until
              management provides cohort-level repeat usage, product attach rates, and customer-level wallet-share
              evidence. The chapter therefore records nulls for retention KPIs instead of substituting liquidity
              availability for renewal proof.
