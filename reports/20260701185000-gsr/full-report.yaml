  - id: TV007
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Round terms
        - >-
          SC Ventures investment amount, pre/post-money basis, security, liquidation preference, anti-dilution, and
          board rights.
        - Determines entry price, dilution, and downside waterfall.
        - Request signed term sheet and cap table before and after the round.
      - - Current financials
        - 2025 and YTD 2026 revenue, gross margin, adjusted EBITDA, cash, debt, and trading capital.
        - Turns headline valuation into an underwritable multiple.
        - Review audited accounts, management accounts, and proof of cash/collateral.
      - - Revenue quality
        - Mix of market making, OTC, advisory, treasury, venture/asset management, and broker-dealer fees.
        - Recurring fee revenue deserves different multiple than volatile trading gains.
        - Request segment P&L and cohort bridge by quarter.
      - - Customer concentration
        - Top ten customer contribution, retention, and counterparty exposure.
        - Scale claims are less valuable if concentrated.
        - Review anonymized customer ledger, contracts, and churn.
      - - Risk controls
        - Trading VaR, inventory limits, pre-hedging controls, surveillance, and conflicts policies.
        - Principal-trading conflicts directly affect valuation confidence.
        - Review policies, exception logs, audits, and regulator correspondence.
      - - Regulatory perimeter
        - Licenses and permitted activities in the U.S., UK, Singapore, Switzerland, and EU-facing operations.
        - Determines whether capital-formation and tokenization revenue can be executed.
        - Legal memo by jurisdiction plus FINRA/SEC permissions and restrictions.
      - - Integration proof
        - Autonomous, Architech, Libeara, GSR One, and GSR Securities revenue contribution and pipeline.
        - Separates strategic narrative from monetized platform expansion.
        - Review pipeline, closed mandates, revenue attribution, and integration KPIs.
      - - Exit path
        - Strategic buyer interest, IPO readiness, audit controls, and comparable transaction appetite.
        - Determines target return and holding period.
        - Interview bankers, review audit readiness, and map strategic acquirers.
    notes: These asks are the minimum package needed to move from track to buy or avoid.
