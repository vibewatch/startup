  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              GSR should be assessed as an institutional digital-asset capital-markets infrastructure company, not as a
              generic crypto asset bet. The public service boundary includes market making, OTC execution, options, DeFi
              liquidity, advisory, venture, and asset-management-adjacent activities; the common buyer job is reliable
              liquidity, market access, and capital-markets execution across token lifecycles. This boundary excludes
              consumer brokerage, custody-only wallets, mining, generic L1 infrastructure, and passive asset exposure
              unless those markets create demand for liquidity or treasury workflows. The substitutes are fragmented:
              token issuers can use exchange-native makers or internal treasury teams, institutions can route through
              banks or OTC desks, and conservative buyers can defer adoption until regulated bank infrastructure
              matures. That fragmentation is favorable for GSR only where it can bundle liquidity, risk management, and
              transparent execution into a lower-friction adoption path.
