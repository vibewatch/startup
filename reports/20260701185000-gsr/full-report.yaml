        title: Cost Structure, Unit Economics, and Working Capital
        blocks:
          - type: paragraph
            body: >-
              GSR's unit economics are driven by market quality, balance-sheet deployment, technology scale,
              counterparty onboarding, compliance, and trading-risk controls. The official terms disclose that GSR may
              trade before or alongside client transactions, hedge exposures, internalize or cross orders, and determine
              its own quoted prices; that supports a gross-margin model exposed to spreads, hedging costs, inventory
              volatility, venue liquidity, operational settlement cost, and compliance controls. GSR's markets page
              cites 60-plus exchange integrations, proprietary systems, automated reporting, and performance analytics,
              which implies meaningful engineering and infrastructure cost but also operating leverage if volumes grow.
              Working capital is harder: principal OTC and derivatives activity may require collateral, inventory,
              settlement liquidity, and banking lines, while advisory and treasury services are likely lighter
              balance-sheet businesses. The public file does not disclose gross margin, trading VaR, inventory levels,
              receivables, payables, collateral, customer concentration, or segment profitability. That gap matters
              because a profitable $287 million revenue report can still mask volatility if trading gains dominate, and
              a high-quality service revenue mix would deserve a different underwriting treatment.
