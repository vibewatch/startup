      - number: '3.2'
        title: Peer profiles, scale, funding, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              The peer set has credible scale signals even when private financials remain opaque. Wintermute's retained
              Series B release shows a firm that had already reached thousands of pairs across almost 50 venues by 2021
              and was moving toward RFQ and derivatives. Cumberland benefits from DRW's multi-decade trading heritage
              and public product breadth across OTC, TWAP, options, futures, and no-prefunding workflows. B2C2 brings
              SBI ownership, 24/7/365 institutional support, a global office footprint, and a public market-integrity
              posture. Amber is less directly a pure market-making comp today, but its $3 billion Series B+ valuation
              and wealth/advisory/liquidity positioning make it an adjacent institutional digital-asset platform.
              Keyrock is closer to GSR's current strategic expansion because it combines market making, options, OTC,
              DEX liquidity, asset management, and a reported $1.1 billion valuation. GSR's own 2026 SC Ventures
              investment and broker-dealer approval improve its institutional credibility, yet those same sources show
              the market is attracting bank-linked capital and regulated infrastructure across more than one contender.
