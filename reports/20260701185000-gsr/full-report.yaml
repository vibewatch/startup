      - number: '8.2'
        title: Thesis, Anti-thesis, and Scenario Ranges
        blocks:
          - type: paragraph
            body: >-
              The thesis is that GSR can evolve from a large crypto market maker into a regulated, full-stack
              digital-asset capital-markets partner. Evidence supports the ingredients: GSR One adds transparency and
              reporting, the OTC upgrade broadens asset and fiat coverage, the Autonomous and Architech acquisition adds
              treasury and advisory capabilities, Libeara gives tokenization rails, and GSR Securities creates a U.S.
              broker-dealer path for issuer capital formation. The anti-thesis is equally investment-critical. Trading
              volumes fell in Q1 and May 2026 data, public financial disclosure is incomplete, principal-trading
              conflicts are explicit in GSR terms, and regulators continue to focus on market maker conduct, conflicts,
              custody, and abuse. Scenario work should therefore be framed as ranges and triggers, not a precise DCF.
              The bull case deserves a premium only if regulated tokenization and advisory attach turn lumpy
              market-making economics into durable fee revenue. The base case is a profitable scaled market maker with
              strategic relevance but cyclical revenue. The bear case is a down-round or structured-financing outcome if
              volumes, compliance costs, or trust issues compress earnings.
