      - number: '7.3'
        title: Partner, Dependency, and Settlement Risk
        blocks:
          - type: paragraph
            body: >-
              The partnership story improves distribution but creates dependency risk. SC Ventures is strategically
              valuable because it is the first external strategic shareholder and gives GSR a traditional-bank-adjacent
              partner for tokenization infrastructure; however, it also raises the bar for regulated execution and may
              concentrate strategic expectations around Standard Chartered-linked ecosystems. Chainlink, Finery Markets,
              and DigiFT demonstrate how GSR reaches stablecoin issuers, ECN participants, and tokenized-RWA investors,
              but each partner introduces separate failure modes: oracle/interoperability standards, ECN uptime and
              participant liquidity, smart-contract settlement, regulated exchange availability, and manual-to-automated
              workflow migration. The Federal Reserve’s 2026 stablecoin note makes this more than theoretical by warning
              that intermediation chains, vertical integration, and operational disruptions can transmit shocks across
              digital-asset and traditional-finance rails. The diligence ask is therefore not whether GSR has partners;
              it is whether contractual SLAs, fallback settlement routes, incident runbooks, concentration limits, and
              third-party control reports exist for each revenue-critical dependency.
