      - number: '8.3'
        title: Comparable Set and Exit Readiness
        blocks:
          - type: paragraph
            body: >-
              The comparable set supports direction, not precision. Keyrock is the closest fresh private mark because SC
              Ventures and Ripple led a 2026 Series C at a reported $1.1 billion valuation, but Keyrock differs by
              geography, staffing, and business mix. Amber’s 2022 $3 billion valuation is useful as an upper reference
              for a broader digital-asset platform, yet it is older-cycle evidence with a consumer and wealth-management
              mix not identical to GSR. Wintermute’s 2021 $20 million Series B and $30 billion monthly volume show how
              liquidity providers can scale rapidly, but the valuation was not disclosed and the vintage is pre-FTX.
              B2C2 and Cumberland validate strategic buyer and institutional-liquidity relevance, but B2C2’s own
              acquisition release shows a bank-owned crypto dealing-desk exit path. Exit readiness is better than a
              typical private crypto desk because GSR has strategic-bank backing, broker-dealer optionality,
              tokenization assets, and ETF/advisory adjacency. Still, IPO readiness is unproven without audited segment
              financials, controls evidence, and clearer regulatory perimeter.
