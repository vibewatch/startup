    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Current Stage
        blocks:
          - type: paragraph
            body: >-
              GSR should be treated as a private crypto capital-markets infrastructure firm rather than a pure exchange,
              custodian, or software vendor. Its own materials and partner announcements consistently describe a
              business built around market making, institutional OTC trading, venture backing, treasury and risk
              management, token advisory, and access to global liquidity. The clearest public stage marker is the May
              2026 SC Ventures investment: GSR remained private, but Standard Chartered’s venture arm became the first
              external strategic shareholder since GSR’s 2013 founding. Independent coverage reported a valuation above
              $1 billion, while the company and investor left the investment size undisclosed. Headquarters are less
              clean than the marketing narrative. Public releases and coverage repeatedly use London, while official
              legal notices point to UK, Singapore, and U.S. regulated entities; the safest diligence position is
              London-centered global group with entity-level footprints rather than a fully mapped parent-HQ conclusion.
              Later chapters should therefore cite the entity, jurisdiction, and regulated-perimeter source behind each
              claim instead of treating GSR as one disclosed corporate shell.
