      - number: '1.2'
        title: Leadership, Governance, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              The current public leadership file centers on Xin Song as CEO, Jakob Palmstierna as President, and
              Cristian Gil as Chairman. That structure represents a notable 2024-2026 evolution. BusinessWire announced
              in June 2024 that Rich Rosenblum and Xin Song would become co-CEOs while Palmstierna moved from CEO to
              President; The Block later reported that co-founder/co-CEO Rosenblum and CTO John MacDonald were leaving.
              The current team page now lists Song as CEO, suggesting a cleaner post-transition operating model but also
              leaving diligence questions about founder dependence and technology leadership continuity. Governance
              disclosure is still thin: Companies House gives UK-subsidiary officers and a person with significant
              control, and public articles identify strategic shareholders, but the full parent board, voting rights,
              investor protections, and ultimate economics remain private. The key-person risk is therefore concentrated
              less in one founder-CEO and more in whether GSR can institutionalize regulatory, trading, treasury, and
              advisory execution across a broad senior bench.
