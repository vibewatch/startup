  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow Definition
        blocks:
          - type: paragraph
            body: >-
              GSR is best understood as a digital-asset capital-markets operating platform rather than a single software
              SKU. The public surface starts with a Markets line that includes systematic OTC, high-touch OTC, market
              making, options and structured derivatives, treasury/risk management, and DeFi liquidity, then extends
              into advisory and asset-management adjacencies. In workflow terms, a token issuer, exchange, payment
              provider, asset manager, or institution enters through relationship-led discovery, must pass
              approved-counterparty onboarding and KYC/AML where trading is involved, and then uses GSR for liquidity,
              execution, risk transfer, market-quality support, treasury planning, or launch/advisory work. The
              strongest productized interface is GSR One, which unifies real-time trading activity, execution tracking,
              customized market-making analytics, wallet/security controls, treasury integration, and onboarding. The
              result is a hybrid service-plus-platform model: software exposes liquidity and analytics, while human
              coverage, balance sheet, regulated entities, and partner infrastructure deliver the actual trading or
              capital-markets outcome. This framing also clarifies which public claims are product proof and which
              remain diligence requests.
