    figureRefs:
      - FO001
  - id: milestones-metrics-gaps-and-adverse-record
    title: Milestones, Metrics Gaps, and Adverse Record
    body: >-
      GSR’s public chronology shows a company that has survived multiple crypto cycles and is now trying to
      professionalize digital-asset capital markets. Founding in 2013, the 2024 co-CEO transition, the late-2024
      executive departures, the 2025 platform launches, the 2026 Autonomous/Architech acquisition, SC Ventures
      investment, and FINRA-approved broker-dealer acquisition are the defining milestones. The adverse record is
      meaningful but nuanced. GSR lost a Wells Fargo negligence appeal tied to an alleged $2 million bitcoin escrow
      fraud, but it was the plaintiff rather than the accused wrongdoer; GSR has also warned of impersonation fraud
      against its brand. Separately, SEC enforcement against other crypto market makers reinforces category-level
      manipulation risk, which matters because market making is a trust-sensitive business. The main diligence gaps are
      not whether GSR exists or has institutional momentum; they are current audited economics, customer count,
      headcount, board/control terms, capital-stack details, and the quality of compliance controls behind its
      expansion.
    claimRefs:
