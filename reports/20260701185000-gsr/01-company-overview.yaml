slug: gsr
runDate: '2026-07-01'
company:
  name: GSR
chapter:
  number: 1
  title: Company Overview
  summary: >-
    GSR is a private, London-centered crypto capital-markets and liquidity firm founded in 2013, now repositioning from
    market making and OTC execution into broader tokenization, advisory, treasury, and regulated capital-markets
    infrastructure. The clearest 2026 inflection is SC Ventures becoming the first external strategic shareholder at a
    reported valuation above $1 billion, while GSR also completed a FINRA-approved broker-dealer acquisition and bought
    Autonomous/Architech for $57 million. Public evidence supports strong market-infrastructure depth but leaves key
    diligence gaps around exact parent headquarters, current revenue, headcount, customer count, total raised, board
    control, secondaries, and debt.
sections:
  - id: identity-business-model-and-stage
    title: Identity, Business Model, and Current Stage
    body: >-
      GSR should be treated as a private crypto capital-markets infrastructure firm rather than a pure exchange,
      custodian, or software vendor. Its own materials and partner announcements consistently describe a business built
      around market making, institutional OTC trading, venture backing, treasury and risk management, token advisory,
      and access to global liquidity. The clearest public stage marker is the May 2026 SC Ventures investment: GSR
      remained private, but Standard Chartered’s venture arm became the first external strategic shareholder since GSR’s
      2013 founding. Independent coverage reported a valuation above $1 billion, while the company and investor left the
      investment size undisclosed. Headquarters are less clean than the marketing narrative. Public releases and
      coverage repeatedly use London, while official legal notices point to UK, Singapore, and U.S. regulated entities;
      the safest diligence position is London-centered global group with entity-level footprints rather than a fully
      mapped parent-HQ conclusion. Later chapters should therefore cite the entity, jurisdiction, and regulated-perimeter source behind each claim instead of treating GSR as one disclosed corporate shell.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO020
      - CO041
    tableRefs:
      - TO001
    figureRefs:
      - FO002
      - FO003
  - id: leadership-governance-and-key-person-risk
    title: Leadership, Governance, and Key-Person Risk
    body: >-
      The current public leadership file centers on Xin Song as CEO, Jakob Palmstierna as President, and Cristian Gil as
      Chairman. That structure represents a notable 2024-2026 evolution. BusinessWire announced in June 2024 that Rich
      Rosenblum and Xin Song would become co-CEOs while Palmstierna moved from CEO to President; The Block later
      reported that co-founder/co-CEO Rosenblum and CTO John MacDonald were leaving. The current team page now lists
      Song as CEO, suggesting a cleaner post-transition operating model but also leaving diligence questions about
      founder dependence and technology leadership continuity. Governance disclosure is still thin: Companies House
      gives UK-subsidiary officers and a person with significant control, and public articles identify strategic
      shareholders, but the full parent board, voting rights, investor protections, and ultimate economics remain
      private. The key-person risk is therefore concentrated less in one founder-CEO and more in whether GSR can
      institutionalize regulatory, trading, treasury, and advisory execution across a broad senior bench.
    claimRefs:
      - CO021
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO039
    tableRefs:
      - TO002
  - id: capital-base-regulatory-footprint-and-partnerships
    title: Capital Base, Regulatory Footprint, and Partnerships
    body: >-
      The capital story is strong but incomplete. The 2026 SC Ventures strategic investment, reported valuation above $1
      billion, prior funding estimate of $167 million, and Ledger Insights revenue/profit datapoints all support a
      scaled private company narrative. At the same time, the amount and mechanics of the SC Ventures deal, whether any
      secondaries were involved, and whether debt or credit facilities support trading activity remain undisclosed.
      Regulatory positioning is becoming more concrete: GSR’s official materials point to UK and Singapore
      authorisations, FINRA BrokerCheck now lists GSR Securities LLC, and FinanceWire reported FINRA approval to
      complete the broker-dealer acquisition. Partnerships with Chainlink, Finery Markets, DigiFT, and Zama add
      commercial proof across stablecoins, liquidity distribution, tokenized real-world assets, and confidential OTC
      settlement. These proof points support institutional ambition but do not by themselves prove recurring revenue
      quality, retention, or end-customer concentration.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
