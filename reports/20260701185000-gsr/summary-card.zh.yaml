  topStrengths:
    - 十多年深耕 crypto 市场结构，加上公司宣称覆盖广泛客户、交易场所和资产，让 GSR 具备可信的机构流动性位置。
    - SC Ventures 成为首个外部战略股东，带来验证、潜在银行邻近分销杠杆，以及 tokenization 生态相关性。
    - GSR 已通过 GSR One、broker-dealer 基础设施、收购 Autonomous/Architech，以及 Libeara、DigiFT、Chainlink 等 tokenization 合作，走出纯做市。
  topRisks:
    - 当前合并收入结构、利润率质量、现金、杠杆和客户集中度都未公开披露，限制了以据报独角兽估值承销的信心。
    - 自营交易冲突、全行业市场操纵审查和多司法辖区监管变化，带来信任和合规执行风险。
    - 2026 年 5 月融资规模、证券条款、董事会权利和清算优先权堆叠仍未披露，公开证据无法评估新资金的下行保护。
    - 2024 年领导层更替、收购和受监管扩张提升了执行复杂度，而当前控制证据仍主要是叙述，不是审计结果。
  unresolvedGaps:
    - SC Ventures 精确出资额、持股比例、董事会权利、清算优先权、反稀释条款，以及 2026 年 5 月后是否又完成战略资本。
    - 当前 2025 年和 2026 YTD 收入、利润率、现金、债务、交易资本使用，以及做市、OTC、advisory 和 broker-dealer 业务的分部结构。
    - 大客户和交易对手集中度、留存、可荐证性，以及 1,000+ 客户宣称是否代表活跃贡献收入的关系。
    - 市场监控、冲突管理、伙伴 SLA、网络安全和收购后整合表现的审计证据。
