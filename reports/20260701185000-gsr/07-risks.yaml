company:
  name: GSR
chapter:
  number: 7
  title: Risks
  summary: 'GSR’s top residual risk is regulatory and market-integrity control execution: the firm has credible mitigations,
    including KYC onboarding, professional-client perimetering, regulatory entity buildout, FINRA BrokerCheck with no disclosures,
    and GSR One transparency, but public evidence does not yet prove audited surveillance, client outcome testing, or partner-failure
    resilience. Secondary risks cluster around operational reliability, partner/settlement dependencies, leadership and acquisition
    execution, and financial-model opacity.'
sections:
- id: regulatory-legal-and-market-integrity-risk
  title: Regulatory, Legal, and Market-Integrity Risk
  body: 'GSR’s highest-severity risk is not a single pending case; it is the control burden created by a principal crypto
    market maker expanding across UK, EU, U.S., Singapore, tokenization, advisory, and broker-dealer perimeters while sector
    regulators are actively scrutinizing market manipulation. The public file contains important mitigants: GSR states that
    counterparties must complete due diligence and KYC/AML, FINRA BrokerCheck shows no disclosed events or suspension for
    GSR Securities LLC, and 2026 coverage says FINRA approved the broker-dealer acquisition. But the residual exposure remains
    high because the rules are moving. The FCA published final cryptoasset regime rules on 30 June 2026, MiCA is now a live
    EU authorization and supervision framework, and the UK statutory instrument and FCA CP25/41 materials show admissions,
    disclosures, market-abuse, dealing-as-principal/agent, arranging, platform, custody, stablecoin, and staking activities moving
    into a fuller FSMA perimeter. SEC cases against other purported crypto market makers, including a 2025 final judgment against
    CLS Global, show how wash trading and artificial-volume allegations can damage the whole category. Historical GSR litigation
    appears to show GSR as a plaintiff harmed by an escrow dispute rather than an accused market manipulator, yet it still highlights
    transaction-control and counterparty-fraud exposure.'
