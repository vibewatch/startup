- id: people-execution-and-financial-model-risk
  title: People, Execution, and Financial-Model Risk
  body: 'People and financial-model risk are linked. GSR’s current public team page shows a credible senior bench, with Xin
    Song as CEO, Jakob Palmstierna as President, Cristian Gil as Chairman, and a chief legal and strategy officer with product
    and regulatory experience. Yet the 2024 leadership sequence was noisy: BusinessWire announced co-CEOs and a president
    structure, then The Block reported the departure of co-founder/co-CEO Rich Rosenblum and CTO John MacDonald. That does
    not prove dysfunction, but it matters because GSR simultaneously executed a $57 million acquisition, completed a broker-dealer
    acquisition, deepened strategic-bank ties, and expanded advisory and tokenization ambitions. Financially, the external
    data are encouraging but incomplete. Ledger Insights reported $287 million of revenue and $71 million of after-tax profit
    for the year ending June 2024 and a $1 billion valuation, while Companies House shows current UK accounts are not due
    until March 2027. The model risk is therefore opacity around revenue mix, trading capital, concentration, debt, inventory,
    and post-acquisition integration economics.'
