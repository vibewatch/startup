- id: monitoring-indicators-and-thesis-breaks
  title: Monitoring Indicators and Thesis-Break Triggers
  body: The investment posture should be monitored through objective triggers rather than generic “crypto volatility” language.
    The most important leading indicators are regulatory status changes, FINRA disclosures, FCA/UK permission milestones,
    MiCA authorisation posture, adverse enforcement references to GSR or its clients, client-outcome evidence on pre-hedging/internalization,
    audited control reports, partner incident history, and senior leadership stability. A thesis-break event would be any
    credible enforcement action involving manipulation, client harm, sanctions, AML failure, license suspension, or unremediated
    settlement failure, because the GSR thesis depends on trusted market-infrastructure status. A softer but still material
    trigger would be persistent market-volume contraction or inability to explain whether revenue comes from durable client
    services versus volatile trading gains. Current mitigations are plausible—KYC/AML onboarding, professional-client perimeter,
    regulatory entities, GSR One transparency, partner-grade infrastructure—but they are not yet a private-diligence substitute.
    The next diligence package must include compliance policies, trade surveillance outputs aligned to UK market-abuse expectations,
    incident logs, SOC/security evidence, audited accounts, risk limits, partner SLAs, and management retention plans.
