- id: TR005
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory permission
    - FCA, UK statutory instrument, FINRA, SEC, MiCA, or MAS status change
    - Suspension, material disclosure event, rejected permission, market-abuse breach, or restricted activity
    - Thesis break until remediation and scope clarity are independently verified
  - - Market integrity
    - Client-harm, wash-trading, manipulation, or surveillance failure signal
    - Named enforcement, credible whistleblower, exchange sanction, or audit exception
    - Avoid / stop underwriting; require independent investigation
  - - Principal-trading conflicts
    - Client outcome testing and pre-hedging controls
    - No written policy, no surveillance output, or adverse sample results
    - Do not price as trusted infrastructure; require remediation plan
  - - Operational reliability
    - GSR One, settlement, wallet/security, or trading-system incidents
    - Material outage, missing uptime metrics, or repeated client-impacting incidents
    - Downgrade risk rating; require SLA and incident evidence
  - - Partner dependency
    - Chainlink, DigiFT, Finery, stablecoin, or bank-rail disruption
    - Depeg, smart-contract incident, ECN outage, or loss of regulated partner
    - Pause growth assumptions tied to affected product line
  - - Leadership execution
    - Senior churn in CEO, CTO, CRO, legal/compliance, or revenue leadership
    - Two or more critical departures during integration window
    - Increase execution-risk discount and require retention plan
  - - Financial model
    - Current accounts, revenue mix, capital, inventory, debt, or VaR remain unavailable
    - No audited accounts or risk schedule after diligence request
    - Research-more / avoid false precision in valuation
  - - Market cyclicality
    - Trading volumes and liquidity conditions weaken
    - Multi-quarter volume decline, spread compression, or customer inactivity
    - Stress-case revenue and capital requirements before any buy recommendation
  notes: Kill criteria are monitorable diligence triggers derived from risk-register evidence; thresholds require private
    diligence to calibrate numerically.
