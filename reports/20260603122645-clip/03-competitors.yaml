- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Local SMB bundle breadth
    - Mercado Pago can bundle wallet, account, and lending; Openpay and Kushki can bundle deeper omnichannel or regional infrastructure
    - High
    - Measure attach rate across POS, checkout, account, and credit rather than reader installs alone
  - - Visible pricing simplicity
    - Mercado Pago and SumUp match or beat Clip on headline card MDR, while Conekta undercuts on online card acceptance
    - High
    - Collect realized merchant pricing by segment and product mix, not only list MDR screenshots
  - - Hardware-led onboarding
    - Tap to Pay lowers hardware barriers for Clip, but the same shift also makes terminal-only differentiation easier to copy
    - Medium-high
    - Track activation-to-90-day retention for Tap to Pay versus physical readers
  - - Trust and enterprise readiness
    - Openpay benefits from BBVA backing and certifications; larger merchants may prefer bank-backed or enterprise-acquirer trust signals
    - High
    - Split pipeline and churn by merchant size, regulated vertical, and need for enterprise controls
  - - Regional expansion / omnichannel scope
    - Kushki is extending further into Mexico present-payments while keeping regional acquiring depth
    - Medium-high
    - Track whether Clip loses larger omnichannel accounts that outgrow a Mexico-only orientation
  - - Merchant switching cost
    - Links, checkout, cash rails, and transfers are available across several rivals, making multi-homing plausible
    - High
    - Request win-loss, churn, and share-of-wallet data to test whether Clip owns merchants or only one payment surface
  notes: Severity reflects competitive underwriting risk, not legal or financial severity. The diligence asks focus on data that public sources
    still do not provide.
