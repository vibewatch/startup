- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider
  - public list pricing
  - included capabilities
  - unknowns
  - implication
  rows:
  - - Clip estándar
    - 3.6% + IVA por transacción; no mensualidad, inactividad, ni mínimo de ventas
    - Reader/TPV acceptance plus broader Clip stack around checkout, account, and loans
    - Negotiated enterprise pricing, realized MDR by segment, and retention economics are not public
    - Competes well on simplicity but not on the lowest visible base MDR
  - - Clip Tap to Pay
    - 2.99% + MXN1 + IVA por transacción; no renta mensual; Android 10+ con NFC
    - Contactless cards and wallets without extra hardware; immediate settlement into Clip Cuenta
    - Ticket cap of MXN1,000 makes it a lighter mobility product, not a full smart-terminal replacement
    - Useful low-capex acquisition surface for small-ticket merchants
  - - Mercado Pago Point
    - 3.50% + IVA por venta; dinero al instante; sin renta mensual
    - Terminal acceptance plus wallet/account, investing, and lending ecosystem around merchant funds
    - Retained evidence is clearer on POS pricing than on broader merchant-software ops depth
    - Strong direct pressure where merchants optimise for familiar ecosystem and visible list terms
  - - Conekta standard
    - 3.4% + MXN3 + IVA en tarjeta; efectivo y SPEI se cobran aparte
    - API, checkout, plugin, button, link, cards, cash, transfers, MSI, and panel de control
    - No physical terminal stack in retained evidence; enterprise tiers still negotiated
    - Often undercuts reader vendors on online SMB acceptance economics
  - - Openpay
    - Preferred or custom commissions signalled, especially for BBVA clients; no clean self-serve fee card retained
    - Link de pago, gateway, cards, transfers, BNPL, cash, certifications, and BBVA backing
    - Comparable realized cost for a small Mexican merchant is not visible publicly in retained evidence
    - Competes more on trust and omnichannel breadth than on transparent teaser pricing
  - - Kushki
    - Flexible pricing for high-volume businesses; no public SMB list MDR retained
    - Pay-ins, payouts, acquiring, Smartlink, presencial, and regional infrastructure
    - Little public visibility on realized Mexico SMB economics
    - More credible as enterprise/regional infrastructure than as a pure first-reader rival
  - - SumUp
    - 3.50% + IVA por transacción; MXN0 costo mensual
    - Simple terminal acceptance and digital tools for micro and small merchants
    - Retained evidence is thinner on checkout, lending, and broader ops tooling
    - Keeps pressure on Clip in first-device and price-sensitive decisions
  notes: This table compares published list terms or explicit pricing posture. It does not estimate negotiated enterprise contracts, rebates,
    or realized MDR by merchant segment.
