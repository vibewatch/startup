- id: TP001
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale/funding
  - target segment
  - differentiation
  - limitation
  rows:
  - - Clip
    - Direct local SMB platform
    - US$100M investment in 2024; says it is Mexico's largest digital payments and commerce platform by merchants served
    - Mexico SMBs needing card-present, lightweight POS, online checkout, settlement, and credit
    - Broad local SMB bundle across readers, POS kit, Tap to Pay, checkout, account, and loans
    - Standard card price is visible but not uniquely lowest; public retention and merchant-count data are thin
  - - Mercado Pago
    - Direct ecosystem rival
    - Mercado Pago wallet/account/lending ecosystem plus Point hardware; published POS pricing
    - SMBs that want terminal acceptance plus wallet/account/credit bundle
    - Brand trust, no monthly Point rent, instant settlement, visible 3.50% + IVA pricing
    - Self-serve surface is strong, but retained evidence is thinner on local POS-ops tooling than on payments/account ecosystem
  - - Conekta
    - Online-first local gateway
    - Public SMB pricing and broad local rails across cards, cash, SPEI, links, checkout, and MSI
    - Digital-first SMBs and merchants that need API or omnichannel collection without Clip-style hardware focus
    - Strong local alternative-payment coverage and transparent pricing for online flows
    - Less evidence of a broad in-store hardware or POS-operations stack
  - - Openpay (BBVA)
    - Bank-backed omnichannel incumbent
    - BBVA-backed platform with enterprise logos and operations across Mexico, Colombia, Peru, and Argentina
    - Merchants that value gateway depth, trust signals, and bank-backed omnichannel acceptance
    - Cards, transfers, cash, BNPL, link de pago, gateway, certifications, and enterprise trust
    - Public retained evidence does not expose a simple self-serve Mexico SMB fee card
  - - Kushki
    - Regional enterprise paytech
    - Regional acquiring/pay-ins/payouts platform; expanded Mexico card-present capability via Billpocket acquisition
    - High-transacting merchants, PSPs, and merchants needing regional or enterprise infrastructure
    - Regional scope, acquiring depth, Smartlink, and explicit Mexico present-payments push
    - Public pricing is positioned around high-volume flexibility rather than a clear SMB list rate
  - - SumUp
    - Direct low-friction terminal rival
    - Official site says 4 million businesses use SumUp globally; Mexico card-present pricing is public
    - Micro and small merchants that want simple terminal acceptance with no monthly cost
    - Visible 3.50% + IVA price card and zero monthly cost keep it relevant in first-reader decisions
    - Retained evidence shows less breadth in merchant-software, credit, and omnichannel rails than Clip
  notes: Scale/funding reflects only retained public evidence. Rows intentionally mix funding, ecosystem size, and public customer/distribution
    signals where private merchant counts or revenue are not fully disclosed.
