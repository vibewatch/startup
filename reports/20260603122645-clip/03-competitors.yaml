- id: substitutes-legacy-and-status-quo
  title: Substitutes, status quo, and what remains unresolved
  body: 'The substitute set is broader than branded readers. Conekta and Openpay explicitly market cash, transfer, and link-based collection,
    which matters because a large part of Mexican payment behaviour still rewards flexibility across cards and non-card rails. Clip partially
    answers that with payment links, checkout, and Tap to Pay, but not every merchant problem is solved by a terminal. For larger sellers, internal
    build or a stack of specialized providers remains a live substitute: one vendor for POS, another for gateway, another for cash or transfer
    references, and perhaps a separate wallet or BNPL partner. This also clarifies the PayPal question. The retained 2026 evidence is stronger
    for PayPal as a regulated e-money and wallet actor under an IFPE license than for an active Mexico SMB terminal push, so PayPal Here should
    be treated as legacy context rather than the center of the current peer group. What is still missing is equally important. Public sources
    do not yet show negotiated enterprise pricing, merchant retention, current bank-TPV share by segment, or win-loss patterns between Clip and
    the strongest rivals. Those gaps limit how far the chapter can go from structured comparison into hard market-share underwriting.'
