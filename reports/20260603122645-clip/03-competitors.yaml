  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: Negotiated MDR, rebates, settlement economics, and bundled pricing by merchant segment for Clip, Openpay, and Kushki.
    whyItMatters: Without enterprise price realization, the chapter can only compare public list cards and pricing posture, not true unit economics
      or procurement outcomes.
    diligencePath: Request current fee cards, rebate schedules, and realized take-rate ranges by merchant segment during management diligence.
    relatedQuestionRefs:
    - QP021
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: merchant-retention-and-share
    missingEvidence: Active merchant counts, cohort retention, attach rates across products, and wallet share by payment rail.
    whyItMatters: Bundle breadth only becomes a durable moat if merchants stay active and adopt multiple products; public marketing pages do not
      show that conversion.
    diligencePath: Request merchant cohorts, product attach curves, and churn or dormancy data split by reader, Tap to Pay, checkout, and account
      products.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: traditional-bank-tpv-pressure
    missingEvidence: Current 2026 product, pricing, and merchant-segment detail for bank-owned TPV fleets such as Getnet and other traditional
      acquirers in Mexico.
    whyItMatters: Traditional bank TPVs are clearly part of the substitute set, but the retained public evidence is not strong enough to weight
      them precisely against Clip in SMB acquisition.
    diligencePath: Pull current bank TPV brochures, merchant onboarding terms, and any disclosed installed-base or merchant-segment data before
      final underwriting.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
  - type: access-blocked
    severity: minor
    topic: paypal-here-legacy-status
    missingEvidence: A clean current official PayPal Mexico source explicitly mapping PayPal Here legacy status versus current local merchant
      POS strategy.
    whyItMatters: The chapter can reasonably downgrade PayPal Here from the core peer set, but a direct Mexico-specific official statement would
      remove residual ambiguity.
    diligencePath: Search PayPal Mexico help, product, and legal surfaces or request PayPal local merchant materials to confirm whether POS hardware
      is still actively marketed.
    relatedQuestionRefs:
    - QP020
  - type: private-evidence-only
    severity: material
    topic: win-loss-patterns
    missingEvidence: Current win-loss, RFP, and displacement data by merchant size, vertical, and channel for Clip versus Mercado Pago, Conekta,
      Openpay, and Kushki.
    whyItMatters: Public feature comparison does not show which rival actually wins in each merchant segment, which is essential for weighing
      moat durability and commoditization risk.
    diligencePath: Request recent competitive-deal logs, top-loss reasons, and merchant-size segmentation from sales or revenue operations.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
