company:
  name: Clip
chapter:
  number: 3
  title: Competitors
  summary: 'Clip''s closest current pressure is not one single rival but a stacked field: Mercado Pago and SumUp attack the self-serve terminal
    lane, Conekta attacks online SMB acceptance with public pricing, and Openpay plus Kushki pressure larger omnichannel merchants with bank-backed
    or regional infrastructure. Public evidence shows Clip still has one of the broadest local SMB bundles in Mexico—reader, POS kit, Tap to Pay,
    checkout, account, and credit—but that wedge is more about distribution and workflow breadth than uniquely low base pricing. The resulting
    moat is credible yet moderate: merchants can multi-home, enterprise pricing is opaque, and incumbents or regional acquirers can copy much
    of the visible surface area.'
sections:
- id: landscape-and-player-classes
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: 'Clip should not be benchmarked against only one reader vendor. The current Mexican field splits into at least four classes. First are
    direct self-serve acquisition rivals that can win the same small merchant at sign-up: Mercado Pago Point and SumUp both market easy onboarding,
    visible transaction pricing, and no monthly terminal rent. Second are online-first local gateways such as Conekta, which compete less on hardware
    and more on checkout, payment links, cash references, SPEI, and other merchant acceptance rails. Third are larger omnichannel or enterprise-oriented
    infrastructures such as Openpay and Kushki. They are less obviously a tiendita card-reader substitute, but they matter as soon as a merchant
    wants gateway depth, BBVA-backed trust, cross-border or regional reach, or online and offline orchestration on one platform. Fourth are adjacent
    substitutes and likely entrants: PayPal now looks more relevant as a regulated wallet and merchant-payments actor than as an actively marketed
    Mexico SMB terminal stack, while traditional bank TPVs and internal build remain real but under-documented in the retained public set. This
    is why the known set needs refinement: Mercado Pago, Conekta, Openpay, Kushki, and SumUp are current, observable pressure points; PayPal Here
    is legacy; and bank-owned TPVs are a genuine but still partially unresolved layer.'
