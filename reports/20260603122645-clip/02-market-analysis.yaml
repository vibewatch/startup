  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-lens
    missingEvidence: A reconciled public methodology that bridges merchant counts, official card-flow data, and vendor digital-payments forecasts into one Mexico merchant-acceptance TAM/SAM stack.
    whyItMatters: Without a common denominator, any single TAM number risks overstating or understating Clip’s reachable payment volume and the revenue pool attached to it.
    diligencePath: Request a bottoms-up market model from management that maps merchant cohorts, active devices, and GPV by in-person, remote, and online channels to a consistent denominator.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: clip-som-disclosure
    missingEvidence: Active merchant count, active-device count, GPV, and cohort-level take-rate or churn data for Clip’s Mexican merchant base.
    whyItMatters: Those disclosures are necessary to convert Clip’s broad merchant footprint into a defensible SOM and to judge whether valuation should be anchored on device growth, merchant count, or payment volume.
    diligencePath: Ask Clip for active merchants, monthly active devices, GPV split by in-person versus online channels, and merchant retention by cohort for the last 12 months.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: active-tpv-stock
    missingEvidence: A public source separating installed versus active TPVs by merchant size, geography, and acquirer class after the nonbank-acceptance expansion of 2024–2026.
    whyItMatters: Installed-terminal counts can overstate addressable acceptance economics if many devices are dormant, seasonal, or concentrated in merchants outside Clip’s target bands.
    diligencePath: Obtain bank-versus-payfac active terminal, active merchant, and monthly transaction intensity data from Banxico, CNBV, or leading acquirers under NDA.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
