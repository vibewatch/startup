- id: TM004
  title: Growth Drivers and Adoption Constraints
  columns:
  - Factor
  - Direction
  - Timing
  - Mechanism
  - Diligence Ask
  rows:
  - - Establishment-level shift away from cash
    - Driver
    - 2018–2024
    - INEGI and ENIF both show card, transfer, and app usage rising while cash remains dominant but recedes
    - How much of the shift is permanent versus category-specific?
  - - Double-digit 2024 card growth
    - Driver
    - Current
    - Banxico’s 2024 card volume and amount growth expands the underlying acceptance pie
    - Which merchant cohorts captured the incremental flow?
  - - Contactless and Tap-to-Pay scaling
    - Driver
    - 2025–2026
    - Contactless usage and Tap to Pay reduce checkout friction and hardware barriers for small merchants
    - How much of contactless growth is incremental versus cannibalized card usage?
  - - Merchant enablement and training friction
    - Constraint
    - Persistent
    - Stanford’s Guadalajara experiment shows setup, training, and customer communication materially affect retention
    - What is Clip’s activation and 90-day retention with and without field support?
  - - Cash persistence in small purchases
    - Constraint
    - Persistent
    - Low-ticket spend still defaults to cash, particularly where cards or wallets are not yet habitual
    - What ticket-size bands are least profitable for merchants at current fees?
  - - CoDi / A2A rails not yet dominant
    - Constraint
    - Current
    - Infrastructure exists but behavioral intensity remains low relative to headline user counts
    - Could account-to-account payments become a true substitute for Clip in low-ticket retail?
  - - Interchange and open-finance reform
    - Driver + Constraint
    - 2026 onward
    - Fee caps could widen acceptance economics, but regulatory uncertainty and incomplete open-finance rails slow ecosystem design
    - When will final rules land and how will they change SME economics?
  - - Competition from scaled payfacs and wallets
    - Constraint
    - Current
    - Mercado Pago and other networks raise acquisition costs and normalize fast onboarding across the market
    - How differentiated is Clip on retention, device productivity, or merchant software attachment?
  notes: Direction labels capture whether each factor mostly helps, hurts, or cuts both ways for adoption. Diligence asks are follow-up questions, not verified facts.
