- id: sizing-lenses-and-sam-logic
  title: 'Sizing Lenses: Merchant Counts, Card Flow, and Digital Commerce'
  body: |-
    Three public lenses describe Clip’s market, and they should not be collapsed into one headline TAM. The first is the merchant-count lens. INEGI counted 5.45 million private-sector economic units in 2023, of which 95.5% were micro businesses. That makes Mexico structurally attractive to a payfac built for fragmented merchants, and it implies a micro-merchant core above 5.2 million units. But merchant counts do not tell investors how many merchants are active, card-accepting, or economically attractive.

    The second lens is official payments flow. Banco de México reported 9.9 billion card-payment operations and MXN5.8 trillion of card-payment value in 2024, with card payments representing 57.9% of retail electronic-payment volume. That is the best official upper-bound lens for digitally accepted card spend, and it is already a very large market. Banxico also shows card e-commerce value reaching MXN1.11 trillion in 2024 after an 18x increase since 2015, which confirms that Clip’s online adjacency is material rather than decorative.

    The third lens is vendor forecast data. PPRO projects Mexico’s broader digital-payments market from roughly USD103 billion in 2023 to USD168 billion in 2028 and sees e-commerce reaching USD176.8 billion by 2026. These figures are directionally useful, but they mix different denominators than Banxico and INEGI. The right conclusion is not that one lens is “correct”; it is that Clip’s SAM should be built from merchant cohorts and activity, while broad payments figures serve as boundary checks.
  claimRefs:
