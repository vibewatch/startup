callouts:
- calloutType: insight
  title: Why Merchant Counts Matter More Than a Generic “Payments TAM”
  body: Clip wins merchants one activation at a time. The broadest payments-market numbers prove Mexico is large, but they do not reveal how many merchants are reachable, active, or economically attractive. For underwriting, the count and behavior of merchant cohorts is the more decision-useful lens.
  claimRefs:
  - CM007
  - CM017
  - CM022
  - CM045
  - CM049
  - CM051
- calloutType: risk
  title: Cheap Devices Do Not Guarantee Usage
  body: 'The Stanford evidence is directly relevant to any Clip growth model: giving merchants low-cost hardware is not enough. Setup support, staff training, and customer communication meaningfully change the activation curve. That makes distribution quality and merchant-success operations part of the moat—not just device price.'
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM048
- calloutType: risk
  title: Regulatory Relief Could Help Adoption but Add Earnings Volatility
  body: If interchange fees are capped, small-ticket acceptance could become easier to sell to micro merchants. But the same reform could force repricing across the ecosystem. Combine that with incomplete open finance and the policy outlook is more supportive for adoption than for easy forecasting of unit economics.
  claimRefs:
  - CM033
  - CM034
  - CM048
- calloutType: assumption
  title: Treat Clip SOM as Undisclosed Until Active Merchants and GPV Are Verified
  body: The company clearly has scale, but current public evidence stops short of a defensible share calculation. A merchant-footprint proxy is helpful context, not a substitute for active merchant, active device, or GPV disclosures. The chapter therefore uses the footprint only as a directional SOM proxy.
  claimRefs:
  - CM005
  - CM045
  - CM049
  - CM050
