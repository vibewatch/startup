chapter:
  number: 2
  title: Market Analysis
  summary: Clip operates in a large but definition-sensitive Mexican merchant-payments market. INEGI shows a 5.45 million-unit merchant base that is 95.5% micro businesses, while Banxico reports MXN5.8 trillion of 2024 card-payment flow and MXN1.11 trillion of card e-commerce value. The opportunity is real, but precise SAM and SOM remain unverified because public sources do not disclose Clip active merchants or GPV and because merchant-count, card-flow, and digital-payments forecasts use incompatible denominators.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: |-
    Clip’s operative market is not “all Mexican fintech” and not even “all payments.” The cleanest boundary is merchant acceptance and commerce enablement for Mexican micro, small, and mid-sized businesses: card-present acceptance through readers, POS devices, and Tap to Pay; remote and social-commerce acceptance through links and QR; online checkout and recurring payments for SMEs; and the merchant software or financing tools that raise ARPU once acceptance is live. That framing matches Clip’s own product architecture, which is organized around helping merchants collect money, settle faster, sell remotely, and manage basic business workflows.

    What should stay outside the core boundary is equally important. Enterprise core banking, consumer deposits, payroll infrastructure, and purely offline cash transactions that are never digitized do not belong inside Clip’s immediate TAM. They matter only when they connect back to merchant activation or wallet/card acceptance. Status-quo substitutes remain powerful: cash, legacy bank terminals, bank transfers, and incumbent PSPs all solve the same job for merchants that just need to get paid. The market therefore has two layers at once: a very large merchant-count opportunity, and a narrower monetizable opportunity that depends on whether merchants actually activate digital acceptance and keep using it.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM006
  - CM044
