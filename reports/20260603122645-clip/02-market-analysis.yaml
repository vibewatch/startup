- id: buyer-and-adoption-path
  title: Buyer Segmentation, Budget Ownership, and Adoption Path
  body: |-
    Clip’s buyer is usually not a procurement department. In the core segment, the buyer and budget owner is the owner-manager of a cash-first micro merchant, a small retailer, a restaurant operator, or an online-first SME choosing how to collect payments. The user may be that owner or a cashier, but the payer is the end consumer bringing a debit card, credit card, contactless wallet, payment link, or QR interaction to the transaction. This matters because the merchant’s adoption decision is less about abstract fintech modernity and more about fast settlement, fewer lost sales when customers prefer cards, simpler omnichannel selling, and basic business tooling.

    The segmentation also explains why Clip’s product surface is broader than a reader business. A street-level or neighborhood merchant may start with Tap to Pay or a low-cost reader. A growth-stage SMB may add payment links, QR, checkout, catalog, and eventually financing. An online-first merchant may never buy a terminal but still sits inside Clip’s market through checkout and recurring payments. The common thread is that the merchant is paying to widen the set of payments they can accept and to compress the operational friction around collections, settlement, and simple back-office tasks.
