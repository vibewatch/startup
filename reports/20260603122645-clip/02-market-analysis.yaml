- id: contradictions-and-diligence-gaps
  title: Contradictory Estimates Preserved and Remaining Diligence Gaps
  body: |-
    The most important contradiction in Clip’s market analysis is that public sources describe different things. INEGI provides the cleanest merchant-count denominator. Banxico provides the cleanest official card-flow and e-commerce-flow denominator. Vendor studies provide directional digital-payments and e-commerce forecasts. None of these are wrong, but none can be turned into a precise Clip SAM or SOM without management data on active merchants, active devices, GPV, or cohort take-rates.

    That means the right underwriting stance is discipline rather than false precision. A count-based SAM explains why Mexico is attractive for a merchant-acquirer serving fragmented SMBs. Banxico explains why payment volume is already large enough to matter and still growing. Stanford and the CoDi evidence explain why adoption friction and cash persistence still cap conversion. Until Clip discloses active merchants, active terminal intensity, and payment volume by channel, investors should treat any precise share claim as a modeling assumption rather than a verified fact. The chapter therefore preserves the sizing spread on purpose and recommends diligence centered on active-merchant behavior, not just total installed devices or a generic “payments TAM.”
  claimRefs:
