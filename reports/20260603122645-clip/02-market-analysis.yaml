- id: TM003
  title: Segment / Buyer Map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / Budget Owner
  - Workflow
  - Adoption Trigger
  - Clip Relevance
  rows:
  - - Cash-first micromerchant
    - Owner-operator of a tienda, stall, or solo service business
    - Owner or one cashier
    - Merchant operating budget / consumer pays
    - Face-to-face sales, often low ticket and cash-heavy
    - Accept cards quickly, get paid fast, avoid losing sales
    - Largest numerical target cohort; price and setup friction matter most
  - - Small retailer / restaurant
    - Store or restaurant manager
    - Cashier plus back-office owner
    - Merchant operating budget
    - Counter payments plus occasional phone or social orders
    - Faster checkout, contactless acceptance, weekend settlement
    - Natural fit for POS plus links and QR
  - - Mobile service merchant
    - Tradesperson, delivery seller, or field-service operator
    - Owner using phone in the field
    - Merchant operating budget
    - No fixed checkout lane; payment captured on the go
    - Hardware-light onboarding and portable acceptance
    - Tap to Pay meaningfully expands reach here
  - - Online-first SME
    - Founder or e-commerce manager
    - Back-office operator
    - Merchant growth budget
    - Website, social, and messaging-led sales
    - Checkout conversion and omnichannel collections
    - Checkout, recurring payments, and links matter more than a reader
  - - Multi-location SMB
    - Regional operator or finance lead
    - Store staff plus headquarters admin
    - Operations / finance budget
    - Branch reporting, mixed in-person and remote collections
    - Visibility across locations and richer merchant tooling
    - Higher-value cohort for POS, software, and lending upsell
  notes: Segment logic is synthesized from Clip’s product pages and Mexico’s establishment structure. Budget ownership is merchant-side even though the transaction payer is the consumer.
