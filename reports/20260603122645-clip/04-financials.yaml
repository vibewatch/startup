  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, runway by base and downside case, and debt covenant headroom after the 2024 round.
    whyItMatters: Capital adequacy is the core financial question for a private payments fintech that promises fast settlement and now runs lending plus account infrastructure.
    diligencePath: Request the latest monthly management accounts, treasury report, debt schedule, and board runway deck.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A reconciled round-by-round cap-table ledger showing which historical financings are equity, debt, secondary, or other instruments.
    whyItMatters: Third-party sources disagree materially on total capital raised, which affects dilution analysis and interpretations of capital intensity.
    diligencePath: Request the latest cap table, financing timeline, and investor-rights summary from management or lead counsel.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Net take rate, gross margin by payment product, dispute/fraud loss rate, and merchant cohort payback.
    whyItMatters: List pricing alone cannot show whether Clip’s payment, support, and settlement promises create attractive contribution margins.
    diligencePath: Request product-level gross-margin bridge, monthly cohort dashboard, and processor / network cost schedule.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: credit-losses
    missingEvidence: Prestaclip approval rate, average balance, delinquency buckets, net charge-offs, recoveries, and vintage curves.
    whyItMatters: Embedded lending can look attractive in headline product mix but destroy margin if loss rates or servicing costs are higher than implied by the sales-linked repayment design.
    diligencePath: Request loan tape, vintage performance deck, underwriting scorecard, and collections waterfall.
    relatedQuestionRefs:
    - QI021
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: hardware-margin
    missingEvidence: SKU-level ASP, COGS, warranty cost, return rate, and inventory days for current terminals.
    whyItMatters: The economic role of hardware—profit center versus subsidized distribution—changes the quality of Clip’s revenue mix and CAC assumptions.
    diligencePath: Request inventory report, device gross-margin schedule, warranty reserve policy, and cohort payback by SKU.
    relatedQuestionRefs:
    - QI009
    - QI010
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
