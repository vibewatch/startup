- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / channel
  - Public price or fee
  - Settlement timing
  - Current caveat
  - Source basis
  rows:
  - - Regular transaction processing
    - 3.6% + IVA per successful sale
    - 24 hours generally; immediate for some Clip Cuenta domestic card-present flows
    - List pricing; net take after processor costs undisclosed
    - Current Clip calculator and checkout pages
  - - Months without interest (MSI)
    - Base fee plus bank surcharge; published surcharge examples 4.57% + IVA to 27.17% + IVA
    - Merchant receives full sale less fee and surcharge within 24 hours
    - All-in fee depends on tenor and bank mix
    - Clip calculator page
  - - Link de Negocio
    - No monthly rent; 3.6% + IVA on processed payments
    - Customer pays through link into Clip account flow
    - Only usage-priced; no public subscription fee
    - Link de Negocio page
  - - Checkout
    - 3.6% + IVA on successful cash-sale transactions
    - Clip says merchants receive money every day / up to 24 hours
    - Installments add surcharge; risk limits vary by merchant age
    - Checkout page
  - - Clip Cuenta
    - No annual fee, account fee, transfer fee, or hidden charges
    - Immediate for some present domestic card flows; 24 hours for links, checkout, vouchers, and AMEX
    - Economic model likely indirect rather than explicit fee-based
    - Clip Cuenta page
  - - Clip Plus 2 / Pro 2 / Ultra / Total 3
    - Observed promo prices MXN119 / MXN399 / MXN599 / MXN899
    - One-time hardware purchase
    - Public pages emphasize no rent and later transaction monetization
    - Current web-store product pages
  - - Clip Empresas / Pin Pad
    - Preferential pricing for merchants above MXN50,000 monthly card volume
    - Enterprise / negotiated
    - Exact rate card undisclosed
    - Pin Pad enterprise page
  - - Prestaclip
    - Fixed charge plus IVA; exact rate disclosed only in invitation offer
    - Funds in 24 hours after approval according to product page
    - No public APR or loss-rate disclosure
    - Prestaclip page
  notes: This table captures public list pricing and product mechanics, not realized enterprise discounts or net margin. Storefront hardware prices are promotional current observations from 2026-06-03.
