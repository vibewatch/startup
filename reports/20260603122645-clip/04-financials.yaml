- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value / status
  - Evidence quality
  - Underwriting implication
  - Diligence ask
  rows:
  - - 2024 growth-equity round
    - US$100M from Morgan Stanley Tactical Value and a large West Coast mutual fund manager
    - High
    - Confirms access to fresh equity capital for product development and growth
    - Request closing cap table, liquidation preferences, and board-approved use of proceeds
  - - 2022 revolving facility
    - US$50M unsecured, three-year revolving credit facility from Morgan Stanley, J.P. Morgan, and HSBC
    - High
    - Supports liquidity and working capital but adds counterparty / covenant considerations
    - Request covenants, drawings, pricing, maturity profile, and any remaining availability
  - - 2021 Series D
    - US$250M at valuation approaching US$2B
    - High
    - Large prior cushion that reduced near-term financing pressure entering 2022
    - Request remaining primary proceeds at 2024 close and major preferred rights
  - - Current valuation signal
    - 2024 round said to value Clip in line with 2021; Tracxn also shows current valuation of US$2B
    - Medium
    - Flat headline valuation suggests resilience, but not necessarily step-up economics
    - Request exact post-money, fully diluted share count, and any structured terms
  - - Lifetime funding estimate
    - Tracxn lists roughly US$497M over 11 rounds
    - Medium
    - Suggests more capital than the headline disclosed rounds alone
    - Request reconciled funding history and which instruments are equity, debt, or other
  - - Financing stance
    - LatAmList said CFO Mariano Carranza viewed financing needs as covered in 2022 and did not need an IPO then
    - Medium
    - Lowers immediate distress concern in that period, but says nothing about 2026 runway
    - Request current fundraise plans, trigger metrics, and downside scenario funding needs
  - - Cash / burn / runway
    - Not publicly disclosed in primary sources reviewed for this chapter
    - Low
    - This is the main blocker to underwriting capital adequacy
    - Request cash balance, monthly burn, runway by base/downside case, and board reporting package
  notes: The table separates directly disclosed financing events from third-party tracker estimates. It is intentionally explicit about where the public record ends.
