- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on judgment
  - Current proxy
  - Exact diligence path
  rows:
  - - Audited revenue / ARR
    - Without company-confirmed revenue, valuation multiples and payback claims stay speculative
    - GetLatka model-based estimate of US$173M 2024 revenue / ARR
    - Request monthly revenue bridge by product line plus auditor or board materials
  - - Net take rate and gross margin
    - List fee is visible but true margin after network, processor, fraud, and support costs is unknown
    - 3.6% + IVA list price and MSI surcharge schedule
    - Request gross-margin bridge by payment type and month
  - - Cash balance, burn, and runway
    - Main capital-adequacy blocker; impossible to size financing dependency without it
    - 2021/2022/2024 financing events only
    - Request latest cash balance, monthly burn, runway, and covenant headroom
  - - Prestaclip loss performance
    - Needed to know whether lending is accretive or a hidden drag on margin
    - Eligibility rules and sales-linked repayment mechanism only
    - Request approval funnel, NPLs, net charge-offs, recoveries, and vintage curves
  - - Hardware margin and inventory turns
    - Determines whether devices are profitable SKUs or subsidized distribution
    - Observed web-store promo prices and no-rent positioning
    - Request SKU-level ASP, COGS, returns, warranty cost, and inventory days
  - - Merchant count and GPV mix
    - Adoption claims are broad, but active merchant count and online/offline GPV mix are missing
    - Company claims to be largest by merchants served and to capture two of three new digital-payment merchants in 2022
    - Request active merchants, retention cohorts, GPV split by channel, and merchant concentration
  - - Settlement reserves and dispute losses
    - Complaints about retained funds make reserve policy financially relevant
    - Anecdotal complaint portal data and 24-hour settlement claims
    - Request reserve policy, chargeback loss rate, fraud loss rate, and complaint-resolution SLA data
  notes: Every row names a specific diligence artifact rather than a generic follow-up. The table is designed to turn the public-evidence limits into an investor workplan.
