tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value/status
  - Revenue quality
  - Diligence ask
  rows:
  - - Card-present payment acceptance
    - 3.6% + IVA regular fee on successful sales; installment sales add bank surcharge
    - '% of processed volume'
    - Live and broadly advertised
    - High recurring potential; recurring fee line tied to merchant GPV
    - Request net take rate after processor, network, and dispute costs
  - - Checkout / e-commerce gateway
    - Same 3.6% + IVA cash-sale pricing for online checkout; surcharge for installments
    - '% of online GPV'
    - Live; plugin and API both supported
    - High if online mix is growing; authorization and chargeback economics are not public
    - Request online GPV mix, chargeback rate, and authorization rate
  - - Link de Negocio / remote payments
    - No setup rent; monetized when customers pay through links or catalog
    - '% of remote-payment GPV'
    - Live; positioned as free to create
    - Good attachment line, but public volumes are undisclosed
    - Request remote-payment share of total GPV and repeat-merchant usage
  - - Hardware terminals
    - One-time device sale plus downstream payment processing
    - MXN per device
    - Observed discounted prices span MXN119-MXN899 across current devices
    - 'Likely mixed quality: useful for acquisition, but margin unknown'
    - Request device COGS, returns, warranty cost, and subsidy policy
  - - Clip Cuenta
    - No explicit account fee; economics likely via settlement capture, balances, and card usage rather than headline fees
    - Balance / wallet activity
    - Live; free transfers and immediate settlement for some flows
    - Strategically important but publicly under-monetized
    - Request account balances, active accounts, interchange income, and float economics
  - - Prestaclip loans
    - Principal plus fixed charge with IVA; repayment via monthly schedule or sales-linked deduction
    - Loan yield
    - Live but invitation-only
    - Potentially attractive, but credit-loss visibility is absent
    - Request approval rate, average ticket, APR-equivalent, and loss vintages
  - - Add-on commissions
    - Bill payments and airtime top-ups generate merchant commissions and likely spread revenue for Clip
    - Commission spread
    - Live but economics undisclosed
    - Incremental rather than core, but additive to SMB wallet share
    - Request attach rate and unit economics by add-on service
  notes: Rows mix company list pricing, observed product availability, and inferred monetization paths. Hardware row uses current storefront promotional prices, not realized net ASP or gross margin.
