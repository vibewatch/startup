- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Headline take rate
    - 3.6% + IVA regular; 9.5%-35.7% all-in example range on long-tenor MSI
    - Medium
    - Shows monetization ceiling before processor, fraud, and support costs
    - Request blended take rate net of interchange, acquirer, and dispute expense
  - - Settlement promise
    - Immediate for some Clip Cuenta domestic card-present flows; otherwise usually 24 hours
    - High
    - Fast payout improves merchant retention but can create prefunding / working-capital needs
    - Request share of GPV settling immediately versus next day and any reserve policy
  - - Hardware economics
    - Upfront device prices are visible; realized gross margin is not
    - Medium
    - If devices are subsidized, hardware is CAC rather than profit center
    - Request BOM/COGS, warranty claims, return rates, and payback by device cohort
  - - Enterprise pricing mix
    - Custom rates for merchants above MXN50,000 monthly card volume
    - Medium
    - Higher-volume merchants often compress take rate but improve GPV density
    - Request GPV share under negotiated pricing and average blended take by cohort
  - - Credit underwriting structure
    - Invitation-only after 3 months and MXN1,500 monthly sales; repayment can be linked to sales
    - Medium
    - Embedded flow data can reduce underwriting risk relative to off-platform lending
    - Request approval rate, loan size distribution, delinquency, net charge-offs, and recovery data
  - - Operating-cost footprint
    - Tracxn shows 1,259 employees as of Apr 2026; public sources cite ongoing product expansion and support promises
    - Medium
    - Headcount plus support, compliance, and connectivity commitments drive burn sensitivity
    - Request payroll split across S&M, product, engineering, risk, and operations
  - - Profitability signal
    - One secondary report says Clip was on the brink of profitability in 2024
    - Low
    - Potentially important if true, but it is not backed by audited statements
    - Request latest management accounts and EBITDA / contribution-margin bridge
  notes: Values combine official list pricing, third-party market-data, and clearly labeled inference. Confidence is about evidence quality, not about strategic importance.
