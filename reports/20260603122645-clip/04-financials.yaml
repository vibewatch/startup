callouts:
- calloutType: insight
  title: Diversification is real; explicit segment economics are not
  body: Clip clearly monetizes more than one thing, but the only hard recurring price the web surface really gives investors is the payment fee schedule. The rest of the stack broadens wallet share without revealing product-level revenue or contribution margin.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI030
- calloutType: risk
  title: Settlement trust is financially material
  body: If merchants choose Clip for immediate or next-day liquidity, complaints about retained funds are not just customer-support noise; they are a direct risk to retention, reserve policy perception, and payment-volume durability.
  claimRefs:
  - CI008
  - CI031
  - CI032
- calloutType: assumption
  title: The 2024 round bought time, not transparency
  body: The funding trail suggests Clip is not capital-starved, but investors still need internal data on burn, runway, net take rate, and loan losses before treating the capital stack as fully de-risked.
  claimRefs:
  - CI021
  - CI023
  - CI025
  - CI030
