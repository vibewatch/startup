company:
  name: Clip
chapter:
  number: 1
  title: Company Overview
  summary: Clip is a Mexico City-founded SMB payments and commerce platform founded in 2012 by Adolfo Babatz and Vilash Poovala. Official 2024 fundraising materials, current product pages, and third-party coverage support a broad stack spanning point-of-sale hardware, online checkout, payment links, Tap to Pay on iPhone, merchant credit, and enterprise integrations, backed by a US$100 million 2024 investment that preserved the roughly US$2 billion unicorn valuation first reached in 2021. The main unresolved items are exact current merchant count, audited operating metrics, board and cap-table transparency, and the precise regulatory perimeter of each product line, while the clearest adverse public signal in the retained pack is mixed 2026 customer-review sentiment rather than a disclosed enforcement action.
sections:
- id: identity-platform-product-scope
  title: Identity, platform scope, and public operating markers
  body: 'The strongest public picture of Clip is of a Mexico-focused commerce-enablement platform built for small and mid-sized businesses rather than a narrow card-reader vendor. Official 2024 fundraising language from Clip and Morgan Stanley describes the company as Mexico''s leading digital payments and commerce-enablement platform by merchants served, while current product pages show why that positioning matters: the stack now spans in-person card acceptance, online checkout, payment links and buttons, business management features, merchant credit, and a hardware-light Tap to Pay on iPhone workflow. The website also makes the commercial proposition concrete. Core SMB pages highlight five-minute onboarding, next-day or same-day style payout messaging depending on product, 3.6% plus VAT headline pricing on standard flows, support for installments, and the ability to accept credit, debit, voucher, wallet, international, and contactless payments. At the same time, the retained public pack
    does not fully validate some common scale talking points. Official materials support “largest by merchants served,” “hundreds of thousands of businesses,” 1M+ app downloads, and broad product breadth, but they do not directly substantiate a current 1M+ merchant count or 2M+ devices shipped. For chapter-one ground truth, Clip is best treated as a mature Mexican payments platform with broad SMB and mid-market coverage, not as a company with fully audited public operating disclosures.'
