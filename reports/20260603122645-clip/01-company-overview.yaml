  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: merchant-scale
    missingEvidence: A company-certified active-merchant count, with definition and as-of date.
    whyItMatters: Merchant count is central to Clip's category-leadership claim and affects market-share and monetization assumptions.
    diligencePath: Request an investor deck, board presentation, or audited KPI pack defining active merchants and showing cohort movement.
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and major-investor governance rights after the 2024 round.
    whyItMatters: Board composition and investor protections determine control, founder dependence, and downside governance in a private company.
    diligencePath: Obtain the post-2024 cap table, shareholder agreement summary, and board observer list from the company or lead investors.
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: regulatory-perimeter
    missingEvidence: A clean product-by-product map of which Clip entities and services sit inside or outside formal ITF licensing perimeter.
    whyItMatters: Regulatory treatment varies across payments, wallet-like balances, loans, and merchant services, affecting risk and economics.
    diligencePath: Request legal entity charts, product terms, and any applicable authorization or registration identifiers for each business line.
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited revenue, gross profit, take-rate, chargeback, and profitability disclosures.
    whyItMatters: Chapter one can anchor identity and capital history, but valuation work later in the report needs harder operating metrics.
    diligencePath: Request monthly revenue dashboards, audited statements, and lender covenant packages covering 2023-2026.
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: devices-shipped
    missingEvidence: An authoritative public or private source validating cumulative devices or readers shipped.
    whyItMatters: The background claim of 2M-plus readers shipped could materially affect installed-base and replacement-cycle assumptions if true.
    diligencePath: Ask management for cumulative shipped devices, active deployed devices, and replacement rates by hardware generation.
