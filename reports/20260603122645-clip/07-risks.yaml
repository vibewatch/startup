  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Clip’s highest residual risks come from a widening Mexican compliance perimeter, merchant-facing first-loss exposure on chargebacks and service failures, and a rapidly capitalized Mercado Pago-led competitive stack. PrestaClip expands upside but also adds credit, AML, privacy, and partner dependencies around thin-file SMB borrowers, external data rails, and financed hardware delivery. The public record supports a viable platform, but not enough portfolio-loss, outage, CFDI, or runway disclosure to underwrite those risks without private diligence."
  },
  "sections": [
    {
      "id": "regulatory-and-compliance",
      "title": "Regulatory and compliance risk",
      "body": "Clip’s regulatory surface is materially wider than its simple reader-and-app branding implies. The company publicly says it aligns with CNBV, Banxico, ABM, PCI, and EMV requirements, but the retained record also shows why compliance should be treated as a first-order risk rather than a box-checking exercise. Clip’s privacy notices say geolocation is captured across terminal operations by legal instruction, biometrics such as facial recognition may be used for identity verification, and merchant data are processed on third-party servers in the United States. PrestaClip adds another layer: the company says its lending arm is supervised by SAT as an Actividad Vulnerable, can query credit bureaus, and can request additional AML documentation under LFPIORPI. Banxico is also revising the electronic-transfer rulebook in 1H26 because fragmented banking applications still generate user friction and errors. The remaining problem is perimeter clarity. Public pages identify Cuenta as Clip AI, S.A. de C.V., IPFE and loans as Prestaclip, S.A. de C.V., but they do not fully enumerate the broader payments and settlement stack. That matters because Mexico’s 2026 legal reforms make adverse rules costlier to challenge and leave regulated operators more exposed to uneven enforcement while they wait for case-by-case relief.",
