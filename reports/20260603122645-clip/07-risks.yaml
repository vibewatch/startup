    {
      "id": "credit-competition-and-market",
      "title": "Credit, competition, and market risk",
      "body": "PrestaClip is strategically important because lending increases merchant monetization, but it also creates the most obvious balance-sheet risk in the public record. Eligibility is tied to existing Clip usage and sales activity, and repayment can be linked directly to merchant sales flows. That structure is operationally elegant, but it is being aimed at a borrower pool where alternative-data providers say a large share of applications still fail for lack of bureau history. Clip’s response has been to rely on Belvo employment and income data, dynamic risk adjustment, and automated recurring collections; that may expand inclusion, yet it also means underwriting quality now depends on external data rails and models that the company does not publicly disclose in loss-rate terms. The competitive backdrop makes the margin equation harder. Mercado Pago already exceeds 1 million active POS terminals in Mexico, has originated millions of SME loans, launched a 2026 PointTap softPOS product with a 2.99% promo rate, and sits inside a MercadoLibre group that planned US$3.4 billion of Mexico investment and is seeking a banking license for Mercado Pago. Clip’s own public fee framing — 3.6% plus IVA, with bundled fraud and dispute services — is clear, but clear pricing does not protect take rate if a larger rival subsidizes acquisition, settlement speed, or credit. Add Banxico’s weak-growth backdrop and the peso’s depreciation bias, and the risk transmission runs through both payment volume and loan-performance quality.",
