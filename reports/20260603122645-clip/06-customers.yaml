schemaVersion: report-v2
artifact: customers
slug: clip
runDate: 2026-06-03
company:
  name: Clip
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports a broad and real Clip customer base across Mexican SMBs, independent merchants,
    ecommerce sellers, restaurants, and selected higher-volume enterprise or channel programs. The strongest proof
    comes from official vertical pages, app-store footprints, named testimonials, and partner campaigns rather than
    from disclosed active-merchant, retention, or concentration metrics. Customer quality therefore looks good enough
    to confirm real adoption, but not yet transparent enough to underwrite durability or top-account risk with high
    precision.
sections:
  - id: customer-segmentation-and-buyer-map
    title: Customer segmentation and buyer map
    body: >-
      Clip is clearly not selling to a single merchant archetype. Its public segmentation pages span new businesses,
      microenterprises, PyMEs, large companies, and online stores, then go one level deeper into food-and-beverage,
      retail, and service verticals. That breadth matters because it shows Clip is trying to own the long tail of
      Mexican commerce while still building lanes for more complex, higher-ticket merchants. The self-serve and
      smaller-business motion is visible in app-led products like payment links, QR, and checkout, while Clip para
      Empresas creates a separate motion for merchants processing roughly MXN 50k-60k or more in monthly card volume.
      The resulting customer map is structurally attractive: independent merchants, restaurants, clinics, beauty and
      home-service operators, ecommerce sellers, and larger multisite companies can all start inside the same
      ecosystem and then adopt additional tools. The main caveat is that Clip publicly markets many target segments
      but does not publish revenue mix or active-account counts by segment, so breadth is much better evidenced than
      monetization mix.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU024
      - CU030
      - CU031
      - CU032
      - CU039
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: adoption-trajectory-and-scale-proxies
    title: Adoption trajectory and scale proxies
    body: >-
      Public adoption evidence is strong enough to confirm that Clip has meaningful customer reach, even though it is
      weaker on exact active-merchant disclosure than on app footprint and merchant positioning. Official and
      independent funding materials describe Clip as Mexico's largest digital payments and commerce enablement platform
      by merchants served and explicitly frame the company around SMB enablement. Yahoo Finance's Bloomberg pickup adds
      an important quality-of-adoption detail: about 85% of Clip merchants had been cash-only before using the
      platform, which suggests Clip is not merely swapping processors for already-digitized enterprises but onboarding
      merchants into electronic acceptance. The public app surfaces reinforce this reach story. Google Play shows more
      than 1 million downloads and more than 62 thousand reviews, while the Mexican App Store listing shows 126 thousand
      ratings. That is real evidence of a scaled merchant-facing surface. The missing denominator is the one investors
      still need most: none of the reviewed public sources provide a current, explicitly defined active-merchant count,
      nor do they bridge app downloads to retained transacting merchants.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU033
      - CU037
    tableRefs:
      - TU002
    figureRefs:
      - FU002
  - id: named-customer-and-channel-proof
    title: Named customer and channel proof
    body: >-
      The best named proof in public materials comes from a mix of merchant testimonials and explicit channel or
      vertical programs. Clip's own homepage and enterprise page quote Rodrigo Mena of Muebles chidos, Mariana
      Villanueva, and César Miranda; the quotes are short, but they do establish that live merchants are willing to
      endorse faster settlement, better service versus banks, and usefulness for smaller businesses. Beyond generic
      testimonials, Clip has built named acquisition programs around Invisalign doctors, Siigo customers, CANACINTRA
      members, the Consejo Coordinador Empresarial del Estado de México, and Grupo Modelo-selected clients. These are
      important because they show Clip reaching customers through software, trade associations, and vertical channels
      rather than only by generic direct response. The weakness is that most of these sources prove offer availability,
      not deployment scale or renewal quality. The one broader enterprise-logo claim in the retained evidence is a
      LatamList report naming Oxxo, Walmart, and AT&T as customers; without primary corroboration on Clip-owned pages,
      it is helpful directional evidence but not yet top-tier deployment proof.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU035
      - CU036
      - CU040
    tableRefs:
      - TU003
    figureRefs:
      - FU003
  - id: retention-quality-and-complaint-signal
    title: Retention, quality, and complaint signal
    body: >-
      Clip's public quality signal is positive on the surface but mixed once third-party review data and complaint text
      are layered in. Apple's Mexican App Store listing is very strong at 4.9 out of 5 from 126 thousand ratings, and
      Google Play remains solid at 4.3 from 62.1 thousand opinions. Those are meaningful footprints for a merchant app,
      not a niche utility. However, DXR AI's 2026 review aggregation is more cautious, with a 5.3 out of 10 score, 56%
      positive sentiment, and 42% negative sentiment. The category-level weaknesses it surfaces around payments,
      deposits, cards, app speed, and account access fit the concrete complaints visible on Google Play, where recent
      users describe broken barcode scanning after updates, unresolved support waits, unwanted card-detail persistence,
      and repeated app logouts. This does not invalidate the product; it does mean that public retention evidence is
      proxy-heavy and operationally noisy. Clip promises daily or immediate settlement, 24/7 support, and strong
      security controls, but it does not disclose NRR, GRR, churn, or cohort retention that would let diligence cleanly
      separate customer love from customer inertia.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU034
      - CU038
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: expansion-motion-and-concentration-risk
    title: Expansion motion and concentration risk
    body: >-
      Clip's customer expansion logic is visible and credible even if the financial outcomes are not. Once a merchant
      starts with card acceptance, Clip can upsell payment links, business links, QR, checkout, subscriptions, catalog,
      service payments, airtime top-ups, loans, and in some cases more specialized workflows such as Wansoft for
      restaurants or custom enterprise integrations. Channel expansion is also visible through Siigo, trade
      associations, healthcare programs, and selected large-client promotions. That ecosystem should create room for
      land-and-expand behavior and make Clip harder to displace than a single-purpose card reader. The problem is that
      public sources still stop short of the two investor questions that matter most: who are the biggest customers,
      and how sticky are they after onboarding? The reviewed material does not quantify active multi-product merchants,
      renewal rates in channel programs, or top-customer revenue concentration. As a result, the public record supports
      a credible expansion engine, but it does not yet prove that the higher-value customer layers are durable or
      diversified enough to dismiss concentration risk.
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032
      - CU034
      - CU037
      - CU039
      - CU040
    tableRefs:
      - TU005
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public proof
      - Strategic value
      - Gap
    rows:
      - - New businesses and microenterprises
        - Buyer=user=payer; owner-managed merchant
        - Start accepting cards and digital payments without monthly rent or heavy setup
        - Clip segment page explicitly lists nuevos negocios and microempresas
        - Captures Mexico's long tail of small merchants early in the lifecycle
        - No public active-account count or TPV mix for the smallest merchants
      - - PyMEs
        - Buyer=owner or manager; users=store staff; payer=business
        - Broader payment acceptance plus operational tools as businesses scale
        - Clip segment page explicitly lists PyME and enterprise-style ecosystem tools
        - Core SMB cohort for multi-product expansion and financial-inclusion thesis
        - No public disclosure of active PyME count or retention by cohort
      - - Large companies / multisite merchants
        - Buyer=finance or operations lead; users=branch staff; payer=company
        - Tailored rates, integrations, user controls, and branch management
        - Clip para Empresas and trade-association pages market custom pricing and high-volume handling
        - Supports higher ARPU and larger rollouts than pure self-serve merchants
        - No top-customer or multisite concentration disclosure
      - - Online stores and social-commerce sellers
        - Buyer=merchant admin; user=payer may be the same person
        - Checkout, payment links, business links, and ecommerce plugins
        - Official checkout and pagos digitales pages plus partner directory
        - Extends Clip beyond card-present acceptance into ecommerce and remote commerce
        - Public sources do not break out online-only merchant share
      - - Restaurants and hospitality operators
        - Buyer=owner or operations manager; users=front-of-house staff
        - In-store payments, delivery, loyalty, reconciliation, and inventory workflows
        - Tipo de negocio page, Wansoft by Clip, and tap-to-pay vertical list
        - Attractive because payments can expand into software and recurring operational workflows
        - No published restaurant logo list, retention curve, or attach rate for Wansoft
      - - Service professionals and mobile merchants
        - Buyer=user=payer; often solo or small-team operators
        - Remote payments, on-site card acceptance, QR, and smartphone tap-to-pay
        - Pagos digitales and tap-to-pay pages list professionals, beauty, health, home service, and other mobile use cases
        - Strong fit with Mexico's fragmented service SMB base and cash displacement opportunity
        - No public split between active service merchants and dormant app downloaders
    notes: >-
      Rows mix explicit Clip segmentation with channel/product evidence; missing account counts are genuine public-data
      gaps rather than omitted analysis.
    claimRefs:
