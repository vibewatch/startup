        - Outcome detail is positive but narrow and company-curated
      - - Invisalign Doctor clinics
        - Healthcare / dental vertical program
        - Preferred-rate payment acceptance for clinics using Invisalign
        - Live channel program
        - Clip offers 24-hour settlement, tailored support, and staff training for participating clinics
        - Public source proves offer availability, not clinic-count adoption or renewal
      - - Siigo customers
        - SMB software-partner channel
        - Businesses using Siigo Aspel can access special Clip rates and tailored offers
