callouts:
  - calloutType: strength
    title: Clip has a broader customer surface than a simple card-reader narrative implies
    body: >-
      Public evidence shows Clip spanning micro-merchants, online sellers, restaurants, service SMBs, larger companies,
      and channel-led programs. That matters because Clip can expand from acceptance into software, ecommerce, and
      finance workflows instead of depending on a one-product merchant relationship.
    claimRefs:
      - CU001
      - CU004
      - CU024
      - CU030
      - CU031
      - CU039
  - calloutType: risk
    title: Reach is easier to prove than durability
    body: >-
      Clip's app-store footprints, testimonials, and partner programs prove real usage, but public materials still do
      not disclose a current active-merchant figure, retention cohorts, or top-customer concentration. Third-party
      review aggregation and recent app complaints also show that service quality is not uniformly positive.
    claimRefs:
      - CU014
      - CU015
      - CU017
      - CU018
      - CU019
      - CU033
      - CU034
