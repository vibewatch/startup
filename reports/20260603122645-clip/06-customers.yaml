  evidenceGaps:
    - type: missing-source
      severity: material
      topic: active-merchant-disclosure
      missingEvidence: A current public or management-provided active-merchant count with a clear active definition and date stamp.
      whyItMatters: Without an active-account definition, app downloads and relative-scale claims cannot be translated into durable merchant adoption.
      diligencePath: Ask management for monthly active merchants, transacting merchants, and active definitions by product.
      relatedQuestionRefs:
        - QU023
      relatedTableRefs:
        - TU002
    - type: private-evidence-only
      severity: material
      topic: retention-disclosure
      missingEvidence: NRR, GRR, logo churn, merchant cohort retention, and multi-product attach curves by merchant segment.
      whyItMatters: Ratings and testimonials are useful but insufficient to underwrite customer durability or lifetime value.
      diligencePath: Request cohort retention decks, monthly churn by merchant size, and product-attach retention analysis.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, active enterprise-logo list, and renewal history for trade-association or channel programs.
      whyItMatters: Large-channel and enterprise programs could either diversify revenue or create hidden customer concentration.
      diligencePath: Request top-20 merchant concentration, channel-sourced GMV share, and renewal data for named programs.
      relatedQuestionRefs:
        - QU024
      relatedTableRefs:
        - TU005
    - type: enumeration-incomplete
      severity: material
      topic: named-enterprise-logos
      missingEvidence: Primary documentation for large-logo customers such as Oxxo, Walmart, and AT&T, including scope and current status.
      whyItMatters: Secondary logo mentions are encouraging but not enough to treat large-enterprise proof as fully validated.
      diligencePath: Ask for customer references, signed case studies, or live deployment letters for large named accounts.
      relatedQuestionRefs:
        - QU025
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: minor
      topic: complaint-operations
      missingEvidence: Internal metrics for chargebacks, app crashes, refund turnaround, and support SLA performance.
      whyItMatters: Public review complaints can overstate or understate operational reality without company-side resolution metrics.
      diligencePath: Request weekly incident, app reliability, and support-resolution dashboards for the past 12 months.
      relatedQuestionRefs:
        - QU013
      relatedTableRefs:
        - TU004
