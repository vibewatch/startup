  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration / durability risk
      - Impact
      - Diligence path
    rows:
      - - Self-serve merchants moving from card acceptance into links, QR, checkout, subscriptions, and catalog
        - No public disclosure of active multi-product merchant share
        - Strong land-and-expand logic if adoption extends beyond the first reader or first link
        - Request cohort-level attach rates and retention after second product adoption
      - - Restaurant software motion via Wansoft by Clip
        - No public logo list, rollout count, or software renewal data
        - Could materially increase stickiness in hospitality because operations and payments are unified
        - Request number of restaurant sites live on Wansoft, net adds, and churn
      - - Siigo and ecommerce integration channels
        - No public activation or revenue share by partner channel
        - Offers a scalable way to reach software-led SMEs without direct acquisition alone
        - Request active merchants sourced by Siigo and ecommerce-partner ecosystem
      - - Trade-association acquisition programs
        - Public pages prove offers, not sustained member usage
        - Channels like CANACINTRA and CCE can lower acquisition friction for SMB clusters
        - Request member sign-ups, activation rates, and retention from association campaigns
      - - Vertical healthcare program with Invisalign doctors
        - No disclosed clinic count, TPV, or renewal history
        - Vertical specialization could support better economics in healthcare payments
        - Request enrolled clinics, average TPV, and program conversion rate
      - - Large-client promotions such as Grupo Modelo selected clients
        - Promotion terms do not disclose ongoing transaction volume or concentration
        - Could signal access to important enterprise or distributor channels
        - Request list of active large-channel clients and revenue share by channel
      - - Large-logo claims from secondary coverage
        - Oxxo, Walmart, and AT&T appear only in one secondary source in this review
        - If confirmed, would materially strengthen Clip's enterprise proof set
        - Request primary references, contract status, and current production scope for named logos
    notes: >-
      Public evidence supports several credible expansion motions, but concentration and durability still require private
      merchant-level evidence before the upside can be underwritten confidently.
