figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Clip's customer journey starts with a broad SMB or independent-merchant acquisition surface and expands into more
      operationally embedded payment and software workflows.
    data:
      items:
        - id: discover
          label: Discover
          actor: Merchant owner / admin / association member / partner-referred business
          description: >-
            Merchants encounter Clip through direct app or terminal discovery, association campaigns, software partners,
            or vertical programs tailored to specific business types.
          channels:
            - Homepage / device pages
            - App stores
            - CANACINTRA / CCE programs
            - Siigo / Invisalign channels
        - id: onboard
          label: Onboard
          actor: Owner or finance / operations lead
          description: >-
            Smaller merchants can register from the app in minutes, while higher-volume accounts can route into Clip para
            Empresas for tailored pricing and integration support.
          channels:
            - App self-serve signup
            - Clip para Empresas sales
            - Partner referrals
        - id: accept-payments
          label: Accept payments
          actor: Merchant staff / solo operator
          description: >-
            The first use case is usually card acceptance, payment links, QR, checkout, or smartphone tap-to-pay in the
            merchant's native selling environment.
          channels:
            - Reader / terminal
            - Payment links
            - QR / checkout
            - Tap to Pay Android
        - id: expand
          label: Expand workflow
          actor: Merchant owner / manager
          description: >-
            Once active, merchants can add catalog, subscriptions, service payments, airtime, loans, or vertical
            software integrations such as Wansoft for restaurant operations.
          channels:
            - Catalog / dashboard
            - Loans / services
            - Wansoft by Clip
            - Ecommerce plugins
        - id: deepen
          label: Deepen / retain
          actor: Merchant owner / channel manager
          description: >-
            Retention should improve when Clip becomes embedded in operations or when channel programs keep merchants in
            the ecosystem, but public renewal and cohort metrics remain undisclosed.
          channels:
            - Enterprise support
            - Association or partner programs
            - Settlement / support experience
            - Multi-product usage
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU030
      - CU031
