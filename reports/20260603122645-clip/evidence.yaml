evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: merchant-scale
    missingEvidence: A company-certified active-merchant count, with definition and as-of date.
    whyItMatters: >-
      Merchant count is central to Clip's category-leadership claim and affects market-share and monetization
      assumptions.
    diligencePath: >-
      Request an investor deck, board presentation, or audited KPI pack defining active merchants and showing cohort
      movement.
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, and major-investor governance rights after the 2024 round.
    whyItMatters: >-
      Board composition and investor protections determine control, founder dependence, and downside governance in a
      private company.
    diligencePath: >-
      Obtain the post-2024 cap table, shareholder agreement summary, and board observer list from the company or lead
      investors.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: regulatory-perimeter
    missingEvidence: >-
      A clean product-by-product map of which Clip entities and services sit inside or outside formal ITF licensing
      perimeter.
    whyItMatters: >-
      Regulatory treatment varies across payments, wallet-like balances, loans, and merchant services, affecting risk
      and economics.
    diligencePath: >-
      Request legal entity charts, product terms, and any applicable authorization or registration identifiers for each
      business line.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited revenue, gross profit, take-rate, chargeback, and profitability disclosures.
    whyItMatters: >-
      Chapter one can anchor identity and capital history, but valuation work later in the report needs harder operating
      metrics.
    diligencePath: Request monthly revenue dashboards, audited statements, and lender covenant packages covering 2023-2026.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: devices-shipped
    missingEvidence: An authoritative public or private source validating cumulative devices or readers shipped.
    whyItMatters: >-
      The background claim of 2M-plus readers shipped could materially affect installed-base and replacement-cycle
      assumptions if true.
    diligencePath: >-
      Ask management for cumulative shipped devices, active deployed devices, and replacement rates by hardware
      generation.
  - type: conflicting-data
    severity: material
    topic: market-sizing-lens
    missingEvidence: >-
      A reconciled public methodology that bridges merchant counts, official card-flow data, and vendor digital-payments
      forecasts into one Mexico merchant-acceptance TAM/SAM stack.
    whyItMatters: >-
      Without a common denominator, any single TAM number risks overstating or understating Clip’s reachable payment
      volume and the revenue pool attached to it.
    diligencePath: >-
      Request a bottoms-up market model from management that maps merchant cohorts, active devices, and GPV by
      in-person, remote, and online channels to a consistent denominator.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: clip-som-disclosure
    missingEvidence: >-
      Active merchant count, active-device count, GPV, and cohort-level take-rate or churn data for Clip’s Mexican
      merchant base.
    whyItMatters: >-
      Those disclosures are necessary to convert Clip’s broad merchant footprint into a defensible SOM and to judge
      whether valuation should be anchored on device growth, merchant count, or payment volume.
    diligencePath: >-
      Ask Clip for active merchants, monthly active devices, GPV split by in-person versus online channels, and merchant
      retention by cohort for the last 12 months.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: active-tpv-stock
    missingEvidence: >-
      A public source separating installed versus active TPVs by merchant size, geography, and acquirer class after the
      nonbank-acceptance expansion of 2024–2026.
    whyItMatters: >-
      Installed-terminal counts can overstate addressable acceptance economics if many devices are dormant, seasonal, or
      concentrated in merchants outside Clip’s target bands.
    diligencePath: >-
      Obtain bank-versus-payfac active terminal, active merchant, and monthly transaction intensity data from Banxico,
      CNBV, or leading acquirers under NDA.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Negotiated MDR, rebates, settlement economics, and bundled pricing by merchant segment for Clip, Openpay, and
      Kushki.
    whyItMatters: >-
      Without enterprise price realization, the chapter can only compare public list cards and pricing posture, not true
      unit economics or procurement outcomes.
    diligencePath: >-
      Request current fee cards, rebate schedules, and realized take-rate ranges by merchant segment during management
      diligence.
    relatedQuestionRefs:
      - QP021
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: merchant-retention-and-share
    missingEvidence: Active merchant counts, cohort retention, attach rates across products, and wallet share by payment rail.
    whyItMatters: >-
      Bundle breadth only becomes a durable moat if merchants stay active and adopt multiple products; public marketing
      pages do not show that conversion.
    diligencePath: >-
      Request merchant cohorts, product attach curves, and churn or dormancy data split by reader, Tap to Pay, checkout,
      and account products.
