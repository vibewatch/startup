  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'THESIS: Clip has strategic relevance in Mexican SMB payments.'
        - Official materials call Clip the largest merchant-served digital payments and commerce-enablement platform in Mexico, with payments, software, hardware, and credit products.
        - Audited operating metrics showing weak merchant retention or weak monetization would erode this advantage.
      - - 'THESIS: The 2024 round showed valuation resilience.'
        - Morgan Stanley invested $100M in June 2024 without a markdown, preserving the $2B valuation set in 2021.
        - A next round below $2B would show that the flat round was a temporary hold rather than durable price support.
      - - 'THESIS: Payment profitability creates optionality.'
        - Bloomberg/Yahoo reported that payments are more than 85% of the business and already profitable.
        - Consolidated audited financials that still show weak gross-profit conversion would limit this upside.
      - - 'ANTI-THESIS: The same $2B price after three more years is not a rerating.'
        - The 2024 round maintained, rather than exceeded, the 2021 Series D valuation.
        - A priced up-round with audited numbers would remove this concern.
      - - 'ANTI-THESIS: Public revenue and funding history are not cleanly corroborated.'
        - GetLatka and Tracxn disagree on both revenue/funding framing and the full financing history.
        - Audited statements plus a reconciled funding ledger would resolve the uncertainty.
      - - 'ANTI-THESIS: Public comps do not support a double-digit sales multiple for an opaque private processor.'
        - Nu is the premium outlier at 7.6x sales; other selected LatAm payment comps trade around 0.7x-2.8x.
        - Clip would need audited growth and margin quality that clearly exceed the public set to justify a premium above Nu.
    notes: >-
      The anti-thesis is valuation-centered. It does not argue that Clip lacks product-market fit; it argues that price currently runs ahead of public evidence quality.
