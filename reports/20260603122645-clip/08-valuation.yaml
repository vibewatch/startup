  - id: SV002
    title: Comparable framework and disclosure discount
    body: |
      The cleanest way to value Clip from public evidence is not a DCF; there is no audited revenue bridge, no gross-profit disclosure, no margin history, and no cap-table visibility. Instead, the right framework is a market-multiple comparison with an explicit disclosure discount. On public screens as of early June 2026, Nu trades at roughly 7.6x sales, dLocal at about 2.8x, MercadoLibre at about 2.7x, StoneCo at about 1.0x, and PagSeguro at about 0.7x. Nu is the premium outlier because it combines scale, strong growth, and public-company disclosure. MercadoLibre is a ceiling reference, not a clean peer, because its multiple reflects e-commerce, ads, and credit as well as payments. StoneCo and PagSeguro are slower-growth acquiring/payment references that show what mature-market skepticism can do to processor multiples.

      Against that set, Clip's implied multiple looks demanding. Using GetLatka's $173 million 2024 revenue estimate, the current $2 billion private mark implies about 11.6x revenue — above even Nu's premium public multiple and far above StoneCo, PagSeguro, dLocal, or MercadoLibre. That does not prove Clip is worth less than $2 billion, because private investors may be paying for Mexican cash-to-digital migration, merchant reach, and product adjacency. It does mean the current price already embeds a sizable execution and disclosure premium. Public comps also all expose investor-relations or filing infrastructure, while Clip's public record is still mostly press releases and database summaries. That disclosure gap is itself a valuation discount, because investors are being asked to pay a public-premium multiple with private-company opacity.
