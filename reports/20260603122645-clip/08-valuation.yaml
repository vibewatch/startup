  - id: TV005
    title: Thesis-Break and Decision Triggers Table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down round below the 2024 mark
        - Next priced equity round announced below $2B
        - Confirms that the flat 2024 round did not represent durable price support.
        - Re-underwrite valuation from public-comp ranges; suspend any buy recommendation.
      - - Revenue quality disappointment
        - Audited revenue or gross profit materially below the public estimate and management framing
        - Breaks the multiple case because current price already assumes premium monetization quality.
        - Move to avoid or wait for repricing.
      - - Cap-table/preference stack more punitive than expected
        - Participating preferred, heavy ratchets, or senior overhang that absorbs exit proceeds
        - Makes apparent enterprise value translate poorly into common-equity returns.
        - Demand different terms, secondary structure, or lower price.
      - - No pathway from payment profitability to company profitability
        - New diligence shows profitable payments but structurally loss-making adjacencies
        - Narrows the path to a premium multiple and delays exit readiness.
        - Treat the company as a narrower payments asset, not a platform premium story.
      - - Ongoing disclosure opacity
        - Management declines to provide audited statements, TPV/take-rate, or funding reconciliation in diligence
        - Keeps the public-evidence discount in place and blocks confidence upgrade.
        - Keep recommendation at research-more / track even if business momentum remains solid.
    notes: >-
      Triggers are framed to be observable in diligence or through future financing events. They are designed to convert a qualitative thesis into explicit invest / wait / walk-away decisions.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV028
      - CV029
      - CV039
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited financial statements
        - 2024 and 2025 audited revenue, gross profit, TPV, take rate, and cash flow
        - The current valuation debate rests on a third-party revenue estimate rather than audited facts.
        - CFO / finance room request; reconcile to tax and audit packs.
      - - Funding reconciliation
        - Round-by-round ledger explaining why public databases differ on total funding
        - Return modeling changes materially if total invested capital is closer to $150M, $350M, or $497M.
        - Finance / counsel; provide capitalization schedule by round and instrument.
      - - Preference stack and anti-dilution terms
        - Liquidation waterfall, participation rights, ratchets, and debt priority
        - Enterprise value can overstate equity value when preference overhang is large.
        - Legal diligence; review charter, investor-rights agreements, and debt documents.
      - - Profitability bridge
        - Evidence linking profitable payments to consolidated company profitability
        - Investors need to know whether adjacent products consume or enhance payment economics.
        - Finance / segment reporting; provide contribution margin by product line.
      - - Merchant cohort quality
        - Retention, churn, take-rate stability, and credit-loss behavior by merchant vintage
        - Premium multiples require durable monetization, not just broad merchant reach.
        - Data room cohort export; validate with board pack or monthly business reviews.
      - - Exit readiness
        - IPO preparation status, governance readiness, and liquidity roadmap
        - A premium private price is easier to underwrite if public-market readiness is visible.
        - CEO / GC / banker diligence; request governance and financing timeline.
    notes: >-
      These asks are prioritized in the order they most directly change underwriting. Items 1-3 are valuation-critical blockers; items 4-6 determine whether the premium case can be sustained.
    claimRefs:
