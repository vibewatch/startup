  - id: TV004
    title: Comparable Valuation Table
    columns:
      - Comparable
      - Latest public anchor
      - Multiple or valuation
      - Relevance to Clip
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private references surfaced during this run: Clip's own priced rounds, five listed LatAm fintech/payment benchmarks, and filing/IR infrastructure as a disclosure-quality check. It is not an exhaustive census of all global payment peers.
    rows:
      - - Clip 2024 round
        - June 2024 private financing
        - $100M at valuation in line with 2021 Series D; headline mark $2B
        - Most relevant current price anchor; shows investors defended the unicorn valuation.
        - No public cap table, liquidation waterfall, or audited financial package accompanies the round.
      - - Clip implied multiple
        - GetLatka 2024 revenue estimate
        - ~$173M revenue at $2B implies ~11.6x
        - Converts the headline private mark into a comparable market-style lens.
        - Revenue figure is third-party estimated and not audited by the company.
      - - Nu Holdings
        - June 2026 public market
        - 7.64x sales; $58.0B market cap; $7.59B LTM revenue
        - Premium LatAm digital-finance multiple; best public bull-case ceiling in the set.
        - Much larger scale and much better disclosure than Clip.
      - - dLocal
        - June 2026 public market
        - 2.84x sales; $3.44B market cap; $1.21B LTM revenue
        - High-growth LatAm payments infrastructure reference.
        - Cross-border PSP model differs from Clip's SMB acquiring focus.
      - - MercadoLibre
        - June 2026 public market
        - 2.67x sales; $84.81B market cap; $31.80B LTM revenue
        - Ceiling reference for a scaled LatAm commerce-fintech platform.
        - Includes e-commerce, ads, logistics, and credit; not a pure payment peer.
      - - StoneCo
        - June 2026 public market
        - 1.05x sales; $2.73B market cap; 3.24B BRL LTM revenue
        - Merchant-acquiring and software reference for what mature processor skepticism looks like.
        - Revenue is BRL-denominated and growth was negative in the latest period.
      - - PagSeguro
        - June 2026 public market
        - 0.67x sales; $2.56B market cap; 19.81B BRL LTM revenue
        - Another Brazil payments/acquiring benchmark anchoring the lower end of the comp range.
        - Mature public processor, slower growth, and different geography.
    notes: >-
      Public-comp multiples are used as valuation discipline, not as mechanical intrinsic value. Clip's private mark should trade at a premium only if audited growth, margin quality, and disclosure justify it.
