  evidenceGaps:
    - type: missing-source
      severity: material
      topic: audited-financials
      missingEvidence: Audited 2024 and 2025 income statements, TPV, take rate, gross profit, and cash-flow data for Clip.
      whyItMatters: Public valuation support currently rests on a third-party revenue estimate instead of audited financial evidence.
      diligencePath: Request the audited financial package plus board-level KPI reporting from management or counsel.
      relatedQuestionRefs:
        - QV009
        - QV021
        - QV029
    - type: private-evidence-only
      severity: material
      topic: cap-table-preferences
      missingEvidence: Current cap table, investor classes, liquidation preferences, anti-dilution mechanics, and debt seniority.
      whyItMatters: Equity return modeling can differ materially from enterprise-value thinking when several hundred million dollars of prior capital may sit ahead of a new buyer.
      diligencePath: Review the charter, investor-rights agreements, financing documents, and waterfall model in legal diligence.
      relatedQuestionRefs:
        - QV023
        - QV029
    - type: conflicting-data
      severity: material
      topic: total-funding-reconciliation
      missingEvidence: A round-by-round funding ledger that reconciles Tracxn's $497M / 11-round history with GetLatka's narrower $150M / two-round view.
      whyItMatters: The total invested capital base drives dilution, liquidation overhang, and the realism of any return target.
      diligencePath: Ask finance to provide a fully reconciled capital history by instrument, date, and investor.
      relatedQuestionRefs:
        - QV008
        - QV029
    - type: stale
      severity: minor
      topic: exit-readiness
      missingEvidence: A formal liquidity roadmap, IPO preparation timetable, or banker-ready financing plan.
      whyItMatters: A premium private entry is easier to support when exit timing and governance readiness are visible.
      diligencePath: Request management's financing calendar, governance readiness memo, and any IPO-prep workstreams.
      relatedQuestionRefs:
        - QV022
        - QV028
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: Reliable private valuation marks for Mexican and LatAm payment peers such as Openpay, Conekta, and more recent secondary transactions.
      whyItMatters: The current comparable table is decision-useful but still skews toward public benchmarks because private peer marks are sparse or not well disclosed.
      diligencePath: Expand the private-peer workup through banker comps, secondary data rooms, and direct company or investor disclosures.
      relatedQuestionRefs:
        - QV014
        - QV027
      relatedTableRefs:
        - TV004
