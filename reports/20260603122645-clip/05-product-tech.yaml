- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  - Source
  rows:
  - - Device encryption and tamper response
    - Documented
    - Clip says terminals encrypt received data and wipe data if tampered with
    - No independent device-security audit report or certification scope document was found
    - Clip security page
  - - EMV, PIN/signature, and card-policy controls
    - Documented
    - Terminal and checkout surfaces reference EMV, PIN/signature, PCI, and card-network policy compliance
    - No explicit PCI DSS certificate number or effective date is publicly shown
    - Clip security + checkout pages
  - - Regulatory alignment for payments and account layer
    - Documented
    - Checkout cites CNBV / ABM / Banxico requirements; Clip Cuenta cites CNBV / Banxico / CONDUSEF oversight
    - No single public trust center consolidates all regulatory artifacts
    - Checkout + Clip Cuenta
  - - Settlement transparency by payment type
    - Partially documented
    - Clip Cuenta FAQ distinguishes immediate domestic chip-and-PIN flows from 24-hour AMEX / CNP / checkout / vale flows
    - No unified payout matrix by every product / card / signature mode
    - Clip Cuenta FAQ
  - - Plugin security and data handling
    - Documented by developer-signal
    - WordPress.com plugin page references PCI DSS processing, 3D Secure, tokenization, and optional Datadog monitoring
    - No public SOC-style summary or hosted-monitoring architecture note
    - WordPress.com plugin page
  - - Reliability observability
    - Gap
    - Support and security claims are public, but uptime or incident reporting is not
    - No public status page, MTTR metric, fraud-loss rate, or external incident history was found in reviewed materials
    - Reviewed official + developer surfaces
  notes: Controls are a mix of direct product claims and developer-signal evidence; absence of public metrics should be treated as a diligence gap, not as proof of failure.
