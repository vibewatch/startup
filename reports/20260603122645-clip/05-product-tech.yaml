- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Clip solution
  - Measurable benefit
  - Limitation
  rows:
  - - Accept a card in person from a phone-first business
    - Merchant opens the app, enters amount, and pairs a mobile reader or phone-based Tap to Pay
    - Plus 2, Tap to Pay on iPhone, or Tap to Pay on Android
    - Avoids dedicated terminal purchase for some use cases and supports contactless / digital receipts
    - Android public page lists a MXN 5 to MXN 1,000 band for the advertised Tap to Pay flow
  - - Run a higher-volume counter with ticketing and inventory
    - Merchant uses a countertop device instead of a simple reader
    - Stand 2 or full Punto de Venta kit
    - Barcode scanning, integrated printing, and order / inventory workflows are embedded in the device
    - No public SLA for uptime or peripheral availability
  - - Sell remotely over social channels
    - Merchant shares a branded page or direct payment link with the customer
    - Link de negocio / direct Clip payment links
    - No-code setup, catalog exposure, and card or cash-style digital collection from a single page
    - No public abandonment or conversion benchmarks
  - - Add a secure ecommerce checkout
    - Merchant installs a plugin or custom API integration
    - Checkout Clip plus marketplace plugins and APIs
    - Flat advertised pricing, MSI support, and refund / status hooks through Clip tooling
    - Public docs recommend a fullstack team for custom API integrations
  - - Reconcile payments into operations systems
    - Merchant or integrator queries receipts, deposits, and status changes
    - Transactions API, Deposits API, and webhooks
    - Receipt-level and settlement-level automation reduces dashboard-only manual reconciliation
    - No public rate-limit, latency, or uptime commitments
  - - Reuse sales proceeds for spend or financing
    - Merchant receives funds into Clip Cuenta and can access loan offers from sales history
    - Clip Cuenta plus préstamos / capital flow
    - Immediate balance for some domestic card-present sales and fast loan disbursement for qualified merchants
    - Settlement timing varies by channel, and no public underwriting performance metrics are disclosed
  notes: Benefits are drawn from Clip product copy and technical docs; rows should not be read as audited conversion or throughput results.
