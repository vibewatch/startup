- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Public evidence
  - Key dependency
  - Risk
  rows:
  - - Merchant access layer
    - Clip app, Tap to Pay, remote-payment pages, and merchant-facing terminals expose the acceptance surface
    - Homepage, Tap to Pay pages, and device manuals
    - Mobile OS support, merchant onboarding, device pairing / login
    - No public release-note discipline or app-store operational metrics were found
  - - Hardware acceptance layer
    - Readers and smart terminals capture chip, magstripe, NFC/contactless, and PIN interactions
    - Manuals and security page
    - Terminal firmware, connectivity, and physical device quality
    - Public materials show features but not fleet reliability or replacement cadence
  - - Checkout / links / plugin layer
    - Card-not-present commerce runs through Link, Checkout APIs, and marketplace plugins
    - Checkout page, API docs, Shopify, WordPress, Tiendanube, and PrestaShop listings
    - Plugin upkeep, merchant CMS compatibility, and payment-form security
    - WordPress reviews show breakage and seller-protection frustration can hit production merchants
  - - Data and reconciliation layer
    - Transactions API, Deposits API, and webhooks provide receipt, deposit, and status detail
    - Developer docs and webhook reference
    - Authentication tokens, developer implementation quality, and Clip API availability
    - No public rate-limit, change-management, or SLA disclosures
  - - Enterprise POS integration layer
    - Pin Pad and terminal SDK / POS API tie payment acceptance into existing merchant systems
    - Developer home, Pin Pad page, and launch releases
    - Merchant POS compatibility, API correctness, and onsite deployment support
    - No public list of enterprise integrations or supported POS vendors
  - - Settlement and control layer
    - Clip Cuenta receives proceeds and exposes transfer, balance, and payout timing logic
    - Clip Cuenta FAQ and terminal / checkout pricing pages
    - Clip AI fintech entity, channel-specific settlement rules, and merchant support
    - Payment-type-specific settlement logic can confuse merchants and complicate reconciliation
  notes: The architecture table is built from public developer and device materials, not from an internal system diagram or audited infrastructure disclosure.
