- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Clip Plus 2 mobile reader
    - Micro-merchants and mobile sellers
    - Mature and live
    - Bluetooth reader tied to the Clip app for card-present acceptance with chip, magstripe, contactless, and PIN entry
    - No public throughput, failure-rate, or installed-base data by reader generation
  - - Clip Pro 2 and Clip Ultra smart terminals
    - Field sellers, delivery, and merchants needing standalone mobility
    - Mature and live
    - Self-contained terminals with SIM-backed unlimited data, Wi-Fi, contactless, and onboard device UX without requiring a phone
    - No public performance, battery-life-in-use, or device failure-rate disclosure
  - - Clip Stand 2 / Punto de Venta countertop stack
    - Higher-volume stores and multi-process checkout counters
    - Live and expanding
    - Combines payments, scanner, printer, inventory/order workflows, and countertop mobility in one device / kit
    - No public deployment mix between Stand 2, Total, and bundled POS kits
  - - Clip Pin Pad (Clip Empresas)
    - Enterprise and chain merchants with existing POS
    - Recent launch / enterprise rollout
    - API-connected fixed terminal for high-volume counters and self-service with Ethernet-first stability
    - No public enterprise customer logos, API latency metrics, or rollout count
  - - Clip Link + Checkout + Tap to Pay
    - Remote sellers, ecommerce operators, and phone-based acceptance use cases
    - Live and broad
    - Lets merchants accept card-not-present and contactless payments without custom bank acquiring contracts
    - No public conversion, dispute, or fraud-rate split by channel
  - - Clip Cuenta + préstamos / capital
    - Merchants managing proceeds and working capital
    - Live and embedded in the stack
    - Turns payment acceptance into an account-and-credit workflow with instant balance for some flows and tailored loan offers
    - No public loan loss, approval-rate, or adoption-rate metrics
  notes: Rows reflect currently visible public surfaces; maturity describes public product evidence, not audited deployment scale.
