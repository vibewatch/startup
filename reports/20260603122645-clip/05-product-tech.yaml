  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-gap
    missingEvidence: A public status page, uptime history, incident log, or service-quality dashboard for merchant-facing Clip surfaces.
    whyItMatters: Without public reliability telemetry, investors cannot judge whether Clip's broad product stack scales with enterprise-grade operational quality.
    diligencePath: Request internal uptime / incident KPIs by channel and device family, plus any merchant-facing status / incident communications.
    relatedQuestionRefs:
    - QE024
  - type: conflicting-data
    severity: material
    topic: pricing
    missingEvidence: A reconciled and dated fee matrix explaining whether in-person, link, checkout, and plugin channels are 3.5% or 3.6% + IVA and when exceptions apply.
    whyItMatters: Public pricing inconsistency makes unit-economics, merchant take-rate, and competitive-position analysis less reliable.
    diligencePath: Ask Clip for the current merchant pricing book by product, payment type, card brand, MSI band, and settlement destination.
    relatedQuestionRefs:
    - QE018
    - QE019
  - type: private-evidence-only
    severity: material
    topic: enterprise-pos
    missingEvidence: Named enterprise Pin Pad customers, supported POS vendors, implementation timelines, and POS API performance / error metrics.
    whyItMatters: The enterprise thesis depends on Clip succeeding beyond SMB readers, but the public evidence for production enterprise rollout is still light.
    diligencePath: Request customer references, signed rollout pipeline, POS compatibility matrix, and deployment / support KPIs for Clip Empresas.
    relatedQuestionRefs:
    - QE014
    - QE016
  - type: missing-source
    severity: minor
    topic: plugin-ecosystem
    missingEvidence: A unified public changelog or release-notes feed across Clip's APIs, SDKs, and marketplace plugins.
    whyItMatters: Version visibility is important for evaluating developer trust, backwards-compatibility discipline, and integration maintenance load.
    diligencePath: Ask for API / SDK versioning policy, deprecation windows, webhook schema-change notices, and plugin release governance.
    relatedQuestionRefs:
    - QE022
