          tone: positive
        - date: '2013-01-01'
          label: 首笔交易
          detail: 官方历史页称，Clip 于 2013 年完成首笔交易。
          tone: positive
        - date: '2014-01-01'
          label: WSA 获奖
          detail: WSA 后来称 Clip 获得 2014 年商业与商务奖。
          tone: positive
        - date: '2021-06-10'
