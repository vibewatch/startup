      - number: '3.4'
        title: 替代品、现状和仍未解决的问题
        blocks:
          - type: paragraph
            body: >-
              替代品集合比品牌读卡器更宽。Conekta 和 Openpay 明确营销现金、转账和基于链接的收款，这一点很重要，因为墨西哥支付行为中很大一部分仍奖励银行卡和非卡轨道之间的灵活性。Clip 用付款链接、结账和
              Tap to Pay 部分回应这一点，但并非每个商户问题都由终端解决。对更大卖家而言，内部自建或一组专业供应商仍是活跃替代品：POS 一家、网关一家、现金或转账参考一家，也许还要单独的钱包或 BNPL
              合作伙伴。这也厘清了 PayPal 问题。保留的 2026 年证据更支持把 PayPal 视为持 IFPE 牌照的受监管电子货币和钱包参与者，而非正在积极推动墨西哥 SMB 终端，因此 PayPal Here
              应作为历史语境，而不是当前同行组的中心。缺失的信息同样重要。公开来源尚未显示议定企业定价、商户留存、当前银行 TPV 按细分的份额，或 Clip
              与最强对手之间的胜负模式。这些缺口限制了本章从结构化比较推进到硬市场份额承保的程度。
