      - number: '2.5'
        title: 保留相互矛盾的估计和剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Clip 市场分析中最重要的矛盾，是公开来源在描述不同东西。INEGI 给出最干净的商户数量分母。Banxico
              给出最干净的官方银行卡流水和电商流水分母。供应商研究给出方向性的数字支付和电商预测。这些来源都没有错，但如果没有管理层关于活跃商户、活跃设备、GPV 或队列抽成率的数据，任何一个都不能转化为精确的 Clip
              SAM 或 SOM。


              因此，正确承保姿态是纪律，而不是虚假的精度。基于数量的 SAM 解释了为什么墨西哥对服务碎片化 SMB 的商户收单机构有吸引力。Banxico 解释了为什么支付量已经大到足以重要，而且仍在增长。Stanford
              和 CoDi 证据解释了为什么采用摩擦和现金黏性仍会限制转化。在 Clip
              披露活跃商户、活跃终端强度和按渠道划分的支付量之前，投资人应把任何精确份额主张视为建模假设，而非已验证事实。因此，本章有意保留规模区间，并建议尽调聚焦活跃商户行为，而不只是累计安装设备或泛泛的“支付 TAM”。
            claimRefs:
              - CM017
              - CM022
              - CM035
              - CM039
              - CM045
              - CM049
              - CM050
              - CM051
              - CM052
