              - CV042
      - number: '8.4'
        title: 入场纪律、投资逻辑否定触发点和尽调要求
        blocks:
          - type: paragraph
            body: >
              实际投资结论很直接：Clip 值得继续尽调，但不值得在 $2 billion 估值上盲目承销。入场纪律应从四项请求开始。第一，2024 和 2025 年经审计财务，包括
              TPV、抽佣率、毛利润、净收入和队列表现，因为当前公开收入信号只是数据库估计，不是经审计数字。第二，逐轮融资对账和当前股权结构表，因为 Tracxn 的 $497 million / 11 轮历史与
              GetLatka 更窄的 $150 million /
              两轮记录并不匹配。第三，优先股堆叠和反稀释结构，因为公开证据已经指向累计数亿美元资本，因此存在不容忽视的清算瀑布。第四，证明盈利能力能扩展到核心支付线之外，因为管理层 2024 年 6
              月的评论距离全公司盈利还差一步。


              这些尽调要求对应清晰的投资逻辑否定触发点。低于 2024 年价格的降价融资轮、经审计收入显著低于公开估计，或毛利润转化明显弱于隐含水平，都会挑战当前标记估值。反过来，如果新一轮定价高于 $2
              billion，并由经审计收入支撑，或公开披露显示经常性收入和利润率质量显著更强，建议会被上调。在此之前，最高质量的结论不是「回避」，也不是「买入」。结论是 Clip
              仍具战略吸引力，但投资人只有在能补上公开来源留下的披露缺口时，才应该支付当前名义价格。
