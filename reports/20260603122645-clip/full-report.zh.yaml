            body: >-
              Clip 显然不是只卖给单一商户原型。它的公开分层页面覆盖新企业、微型企业、PyME、大公司和在线商店，并进一步深入到餐饮、零售和服务业垂直。这种宽度很重要，因为它说明 Clip
              正试图拿下墨西哥商业长尾，同时也为更复杂、更高客单价商户搭建通道。付款链接、QR 和结账等应用驱动产品显示了自助和小商户动线，而 Clip para Empresas 为每月银行卡交易额约 MXN 50k-60k
              或更高的商户创建了单独动线。由此形成的客户地图在结构上有吸引力：独立商户、餐厅、诊所、美容和家政服务经营者、电商卖家，以及更大的多点位公司，都能从同一个生态内起步，再采用更多工具。主要提醒是，Clip
              公开营销许多目标细分，但不发布按细分划分的收入组合或活跃账户数，因此宽度的证据远强于变现组合。
