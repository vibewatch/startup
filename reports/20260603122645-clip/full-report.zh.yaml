  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对判断的影响
      - 当前代理指标
      - 具体尽调路径
    rows:
      - - 经审计收入 / ARR
        - 没有公司确认收入，估值倍数和回本说法都停留在推测
        - GetLatka 基于模型估计 2024 年收入 / ARR 为 US$173M
        - 索取按产品线拆分的月度收入桥接，以及审计师或董事会材料
      - - 净抽佣率和毛利率
        - 标价费率可见，但扣除网络、处理商、欺诈和支持成本后的真实利润率未知
        - 3.6% + IVA 标价和 MSI 附加费表
        - 按支付类型和月份索取毛利率桥接
      - - 现金余额、烧钱速度和现金跑道
        - 资本充足性判断的主要障碍；没有它无法测算融资依赖
        - 仅有 2021/2022/2024 年融资事件
        - 索取最新现金余额、月度烧钱、现金跑道和契约余量
      - - Prestaclip 损失表现
        - 需要用它判断放贷是在增厚利润，还是隐性拖累利润率
        - 仅有准入规则和销售额挂钩还款机制
        - 索取审批漏斗、不良贷款（NPLs）、净核销、回收和 vintage 曲线
      - - 硬件利润率和库存周转
        - 决定设备是盈利 SKU 还是补贴式分发
        - 观察到的网店促销价和无租金定位
        - 索取 SKU 级 ASP、COGS、退货、保修成本和库存天数
      - - 商户数和 GPV 组合
        - 采用度说法很宽，但缺少活跃商户数和线上 / 线下 GPV 组合
        - 公司称按服务商户数为最大，并在 2022 年拿下每 3 个新增数字支付商户中的 2 个
        - 索取活跃商户、留存队列、按渠道拆分 GPV 和商户集中度
      - - 结算准备金和争议损失
        - 有关资金留置的投诉让准备金政策影响财务判断
        - 投诉门户的零散数据和 24 小时结算说法
        - 索取准备金政策、拒付损失率、欺诈损失率和投诉解决 SLA 数据
    notes: 每一行都点名具体尽调材料，而不是泛泛跟进。本表把公开证据边界转成投资人工作计划。
