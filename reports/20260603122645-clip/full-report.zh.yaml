      - number: '4.2'
        title: 单位经济和运营成本驱动因素
        blocks:
          - type: paragraph
            body: >-
              公开数据足以勾勒经济桥梁，但不足以干净承保。Clip
              的标价抽成率可见；扣除处理商、收单机构、交换费、欺诈、争议和支持成本后的净抽成率不可见。几项产品承诺意味着投资人应假设存在真实成本负担，即使公司没有披露：设备无月租、24/7 支持、高端终端捆绑连接、即时或 24
              小时结算、Clip Cuenta 内免费银行转账，以及在还款完成前预支资金的借贷产品。这些选择有战略合理性，因为它们降低 SMB
              入驻摩擦并提高附着，但也把更多经济性转移到交易量、留存和交叉销售上。硬件尤其像分销驱动：设备预先销售，但公开信息强调通过交易量快速回本，而非设备盈利。信贷产品结构优于纯平台外贷款，因为准入要求 Clip
              销售历史，且还款可绑定商户流水，但公司不公布违约曲线、批准率或已实现收益率。可比的区域模型存在——MercadoLibre 的 SEC 文件显示拉美商业金融科技生态如何把线上 / 线下支付与日常金融服务结合——但
              Clip 把内部细分测算留作私有信息。
