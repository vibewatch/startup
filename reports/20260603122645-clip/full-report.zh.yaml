  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：Clip 在墨西哥 SMB 支付中具备战略相关性。
        - 官方材料称，Clip 是墨西哥面向商户的最大数字支付和商业赋能平台，产品覆盖支付、软件、硬件和信贷。
        - 经审计运营指标若显示商户留存弱或变现弱，会侵蚀这一优势。
      - - 投资逻辑：2024 年轮次显示估值韧性。
        - Morgan Stanley 于 2024 年 6 月投资 $100M，未下调估值，守住了 2021 年设定的 $2B 估值。
        - 下一轮若低于 $2B，将表明持平轮只是暂时托住价格，而不是持久支撑。
      - - 投资逻辑：支付盈利能力带来可选性。
        - Bloomberg/Yahoo 报道，支付业务占比超过 85%，且已经盈利。
        - 合并经审计财务若仍显示毛利转化弱，会限制上行空间。
      - - 反向逻辑：三年后仍是同一个 $2B 价格，并不是重估。
        - 2024 年轮次维持而非超过 2021 年 Series D 估值。
        - 带经审计数字的上调估值轮会消除这一担忧。
      - - 反向逻辑：公开收入和融资历史没有被清晰交叉印证。
        - GetLatka 和 Tracxn 在收入 / 融资口径以及完整融资历史上并不一致。
        - 经审计报表加上已核对的融资台账可以消除不确定性。
      - - 反向逻辑：公开可比公司不支持一个不透明私营支付处理商拿到两位数销售倍数。
        - Nu 是溢价离群值，销售倍数为 7.6x；其他入选 LatAm 支付可比公司约在 0.7x-2.8x 交易。
        - Clip 需要经审计的增长和利润率质量明确超过这组上市公司，才能证明高于 Nu 的溢价合理。
    notes: 反向逻辑以估值为中心。它不是说 Clip 缺少产品市场匹配，而是说当前价格跑在公开证据质量前面。
