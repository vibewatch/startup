            title: 多元化真实存在；明确的分部经济性不存在
            body: Clip 显然不只靠一件事变现，但网页表面真正给投资人的硬经常性价格，只有支付费率表。其余产品栈拓宽钱包份额，却没有揭示产品级收入或贡献利润率。
