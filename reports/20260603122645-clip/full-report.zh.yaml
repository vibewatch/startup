        title: 图表资料
        blocks:
          - type: callout
            title: 为什么商户数量比泛化的“Payments TAM”更重要
            body: Clip 一次激活一个商户。最宽口径的支付市场数字证明墨西哥很大，但无法揭示有多少商户可触达、活跃或经济上有吸引力。承保时，商户队列的数量和行为才是更有决策价值的视角。
