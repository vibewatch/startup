  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Clip
        - 本地中小商户直接平台
        - 2024 年获得 US$100M 投资；称按服务商户数计，它是墨西哥最大的数字支付和商业平台
        - 需要线下刷卡、轻量 POS、在线结账、结算和信贷的墨西哥中小商户
        - 围绕读卡器、POS 套件、Tap to Pay、结账、账户和贷款，提供覆盖面广的本地中小商户套餐
        - 标准银行卡费率可见，但并非独家最低；公开留存和商户数量数据偏薄
      - - Mercado Pago
        - 直接生态竞争对手
        - Mercado Pago 的钱包 / 账户 / 信贷生态加 Point 硬件；POS 定价公开
        - 想要终端收款加钱包 / 账户 / 信贷组合的中小商户
        - 品牌信任、Point 无月租、即时结算、可见的 3.50% + IVA 定价
        - 自助入口很强，但留存证据在本地 POS 运营工具上弱于支付 / 账户生态
      - - Conekta
        - 线上优先的本地网关
        - SMB 定价公开，本地支付轨道覆盖银行卡、现金、SPEI、链接、结账和 MSI
        - 需要 API 或全渠道收款、但不需要 Clip 式硬件重点的数字优先 SMB
        - 本地替代支付覆盖强，线上交易定价透明
        - 广泛线下硬件或 POS 运营栈的证据较少
      - - Openpay (BBVA)
        - 银行背书的全渠道在位者
        - BBVA 背书的平台，拥有企业客户标识，并在墨西哥、哥伦比亚、秘鲁和阿根廷运营
        - 看重网关深度、信任信号和银行背书全渠道受理的商户
        - 银行卡、转账、现金、BNPL、付款链接、网关、认证和企业级信任
        - 留存的公开证据没有展示简单的墨西哥 SMB 自助费率卡
      - - Kushki
        - 区域性企业支付科技
        - 区域收单 / 收款 / 付款平台；通过收购 Billpocket 扩展墨西哥线下刷卡能力
        - 高交易量商户、PSP，以及需要区域或企业基础设施的商户
        - 区域覆盖、收单深度、Smartlink，以及明确推进墨西哥线下支付
        - 公开定价强调高交易量灵活性，而不是清晰的 SMB 标价
      - - SumUp
        - 低摩擦终端直接竞争对手
        - 官网称全球有 4 million 家企业使用 SumUp；墨西哥线下刷卡定价公开
        - 想要无月费简单终端收款的微型和小型商户
        - 可见的 3.50% + IVA 费率卡和零月费，让它在首次购置读卡器决策中仍有相关性
        - 留存证据显示，它在商户软件、信贷和全渠道轨道上的广度不及 Clip
    notes: 规模 / 融资只反映留存的公开证据。在私营商户数或收入未完全披露时，各行有意混合融资、生态规模和公开客户 / 分销信号。
