  - id: TM004
    title: 增长驱动因素和采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 机制
      - 尽调问题
    rows:
      - - 经营单位层面的去现金化转移
        - 驱动因素
        - 2018–2024
        - INEGI 和 ENIF 都显示银行卡、转账和应用使用率上升，现金仍占主导但在回落
        - 这一转移有多少是永久性的，多少只发生在特定品类？
      - - 2024 年银行卡双位数增长
        - 驱动因素
        - 当前
        - Banxico 2024 年银行卡交易笔数和金额增长，扩大了底层受理市场
        - 哪些商户队列拿到了增量流水？
      - - 非接触式和 Tap to Pay 扩张
        - 驱动因素
        - 2025–2026
        - 非接触式使用和 Tap to Pay 降低了小商户的结账摩擦和硬件门槛
        - 非接触式增长中有多少是增量，有多少只是蚕食既有银行卡使用？
      - - 商户启用和培训摩擦
        - 约束
        - 持续存在
        - Stanford 在 Guadalajara 的实验显示，开通、培训和客户沟通会显著影响留存
        - Clip 在有 / 没有现场支持时的激活率和 90 天留存率是多少？
      - - 小额消费中现金黏性
        - 约束
        - 持续存在
        - 小额支出仍默认用现金，尤其是在银行卡或钱包尚未成为习惯的场景
        - 在当前费率下，哪些客单价区间对商户最不赚钱？
      - - CoDi / A2A 支付轨道尚未占主导
        - 约束
        - 当前
        - 基础设施已在，但实际使用强度相对表面用户数仍低
        - 账户到账户支付会不会成为小额零售中 Clip 的真正替代品？
      - - 交换费和开放金融改革
        - 驱动因素 + 约束
        - 2026 年以后
        - 费率上限可能改善受理经济性，但监管不确定性和开放金融轨道不完整拖慢生态设计
        - 最终规则何时落地，会如何改变中小企业经济性？
      - - 规模化支付服务商和钱包竞争
        - 约束
        - 当前
        - Mercado Pago 等网络抬高获客成本，也让快速开通成为市场标配
        - Clip 在留存、设备产出或商户软件绑定上差异化有多强？
    notes: 方向标签描述每个因素主要促进、阻碍还是双向影响采用。尽调问题是后续问题，不是已验证事实。
