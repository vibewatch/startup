  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 数值 / 状态
      - 置信度
      - 为什么重要
      - 尽调索取项
    rows:
      - - 名义抽佣率
        - 常规 3.6% + IVA；长期限 MSI 示例综合费率范围为 9.5%-35.7%
        - 中
        - 显示扣除处理商、欺诈和支持成本前的变现上限
        - 索取扣除交换费、收单方和争议成本后的混合净抽佣率
      - - 结算承诺
        - 部分 Clip Cuenta 境内当面刷卡流程即时结算；否则通常 24 小时
        - 高
        - 快速打款能提升商户留存，但可能带来垫资 / 营运资金需求
        - 索取即时结算与次日结算 GPV 占比，以及任何准备金政策
      - - 硬件经济性
        - 设备前端售价可见；实际毛利率不可见
        - 中
        - 若设备有补贴，硬件就是 CAC，而不是利润中心
        - 按设备队列索取 BOM/COGS、保修索赔、退货率和回本周期
      - - 企业定价组合
        - 月卡交易额超过 MXN50,000 的商户采用定制费率
        - 中
        - 高交易额商户往往压低抽佣率，但能提高 GPV 密度
        - 索取协商定价下的 GPV 占比，以及按队列划分的平均混合抽佣
      - - 信贷承保结构
        - 入驻 3 个月且月销售额达 MXN1,500 后仅限受邀；还款可与销售额挂钩
        - 中
        - 相比平台外放贷，嵌入式流水数据可降低承保风险
        - 索取通过率、贷款规模分布、逾期率、净核销和回收数据
      - - 运营成本规模
        - Tracxn 显示截至 2026 年 4 月员工数为 1,259；公开来源提到产品仍在扩张，并承诺提供支持
        - 中
        - 员工数叠加支持、合规和连接承诺，会推高烧钱敏感度
        - 索取 S&M、产品、工程、风险和运营之间的薪酬成本拆分
      - - 盈利信号
        - 一份二手报告称 Clip 在 2024 年接近盈利
        - 低
        - 若属实则很重要，但没有审计报表支撑
        - 索取最新管理报表，以及 EBITDA / 贡献毛利桥接
    notes: 数值结合官方标价、第三方市场数据和明确标注的推断。置信度衡量证据质量，不衡量战略重要性。
