            body: >-
              Clip 的创始故事有相当充分的证据支撑，但公开治理图景比运营团队图景更薄。WSA 和 Tracxn 都把 Adolfo Babatz 与 Vilash Poovala 列为 2012 年联合创始人，官方
              “Sobre nosotros” 页面也继续把 Babatz 置于 Founder and CEO 的核心位置。Endeavor、The Org 和 Clay 的独立画像同样强化了 Babatz 从 PayPal
              和早期投资岗位走向创办 Clip
              的路径，这有助于解释公司的支付市场契合度，也解释投资人为何仍围绕他本人讲述公司故事。创始人之外，官方领导层页面确实给出了有意义的现任团队：财务、运营、外部事务、产品与技术、研究、人力、软件、支付商业化和金融服务负责人均被点名。这足以说明
              Clip 已不再是单人商业故事。但保留的公开资料中，看不到当前董事会名单、独立董事阵容，也无法轻松读出 2024
