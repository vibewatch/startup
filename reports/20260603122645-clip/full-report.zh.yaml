  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件和商户工作流
        blocks:
          - type: paragraph
            body: >-
              Clip 当前公开产品地图远不止入门级读卡器。硬件侧，网站和手册显示一条从蓝牙 Plus 2 到 Pro 2、Ultra、Stand 2 等一体化智能终端，再到企业向 Pin Pad 的阶梯。软件侧，Clip
              营销付款链接、数字结账流程、部分线下收卡流程可即时查看余额的商业账户，以及与商户活跃度绑定的借贷报价。iPhone 和 Android 上的 Tap to Pay
              又进一步扩展了产品栈，把商户手机本身变成受理设备。这具有战略意义，因为 Clip 卖的是运营工作流，而不只是受理硬件：商户可以从连接应用的读卡器开始，为远程销售增加付款链接，为电商采用结账，把结算迁入 Clip
              Cuenta，然后通过 Clip Capital 提前获得营运资金。因此，产品套件围绕同一个待办任务保持一致：帮助墨西哥 SMB
              接受、对账并复用来自线下和数字渠道的支付款项，不需要银行式合同，也不必每一步都找不同供应商。
