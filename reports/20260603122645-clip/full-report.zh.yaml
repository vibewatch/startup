      - number: '2.3'
        title: 买方分层、预算归属和采用路径
        blocks:
          - type: paragraph
            body: >-
              Clip 的买方通常不是采购部门。在核心客群里，买方和预算所有者，是一家现金优先微型商户的小老板、小零售商、餐厅经营者，或正在选择如何收款的线上优先
              SME。用户可能是老板本人，也可能是收银员，但付款方是带着借记卡、信用卡、非接触钱包、付款链接或 QR 交互进入交易的终端消费者。这一点很关键，因为商户的采用决策并不围绕抽象的 fintech
              现代化，而是围绕快速结算、客户偏好刷卡时减少丢单、更简单的全渠道销售，以及基础经营工具。


              分层也解释了为什么 Clip 的产品表面比读卡器业务更宽。街边或社区商户可能先从 Tap to Pay 或低价读卡器开始。成长阶段 SMB
              可能再加付款链接、QR、结账、商品目录，并最终加入融资。线上优先商户可能从不买终端，但仍通过结账和经常性付款落在 Clip
              的市场里。共同主线是，商户付费是为了扩大可接受的支付方式，并压缩收款、结算和简单后台任务上的运营摩擦。
