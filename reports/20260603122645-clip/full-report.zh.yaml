      - number: '4.4'
        title: 公开牵引信号、反向证据和尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              Clip 的公开牵引故事可信但不完整。官方来源称，公司按服务商户数是全国最大的数字支付和商业赋能平台，超过 75% 商户加入前只收现金，2022 年进入墨西哥数字支付系统的每三家商户中有两家使用 Clip
              产品。这些都是强采用信号；FinTech Futures 对 Bloomberg 采访的摘要又补充了一个更柔性的盈利数据点，称 Clip 在 2024
              年接近盈利。问题在于，硬财务科目仍是私有信息。最佳公开收入信号只是第三方估计：GetLatka 列出 2024 年收入 / ARR 为 US$173
              million，并明确称该数字基于模型，而非管理层确认。与此同时，本章的反向来源并非灾难性，但具有财务相关性：TuQuejaSuma
              上有多条商户关于资金被留置和账户被暂停的投诉，这正是会削弱以结算为核心的价值主张的问题。净看，Clip
              似乎已经实现变现多元化，并持续获得外部资本，但收入质量、已实现利润率和资产负债表韧性仍需要管理层证据，而不是网页研究。
