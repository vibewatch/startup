      - number: '4.3'
        title: 资本充足性和融资依赖
        blocks:
          - type: paragraph
            body: >-
              从外部可见融资看，Clip 仍显得资金支持充足。公司 2021 年通过 SoftBank / Viking 轮融资 US$250 million 成为独角兽，估值接近 US$2 billion；2022 年又从
              Morgan Stanley、J.P. Morgan 和 HSBC 获得 US$50 million 无担保三年循环授信；2024 年再从 Morgan Stanley Tactical Value
              与一家大型西海岸共同基金管理人募得 US$100 million，估值被描述为与该 Series D 一致。管理层把 2022 年授信描述为对已有稳固流动性位置的支持，LatAmList 报道 CFO
              称此前融资加上授信覆盖了当时融资需求，因此当时不需要 IPO。第三方市场数据追踪把累计融资数字推得更高——Tracxn 显示约 US$497 million、11 轮融资，以及截至 2026 年 4 月约
              1,259 名员工。这个组合很重要，因为它意味着 Clip 同时在资助产品宽度和有意义的运营成本基础。仍不透明的，是最重要的承保连接：本文审阅的主要来源均未披露当前现金、月度烧钱速度、契约或 2024
              年融资后的现金跑道。
