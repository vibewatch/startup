    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围和公开经营指标
        blocks:
          - type: paragraph
            body: >-
              Clip 在公开资料中最清晰的形象，是一个面向墨西哥小微和中型企业的商业赋能平台，而不是单一读卡器厂商。Clip 与 Morgan Stanley 在 2024
              年官方融资表述中称，公司按服务商户数是墨西哥领先的数字支付和商业赋能平台；当前产品页面也解释了这一定位为何重要：产品栈已经覆盖线下收卡、在线结账、付款链接和按钮、经营管理功能、商户信贷，以及轻硬件的 iPhone
              Tap to Pay 流程。官网还把商业主张说得很具体。核心 SMB 页面强调 5 分钟入驻、按产品不同可次日或类似当日到账、标准流程 3.6% 加 VAT
              的标价、支持分期，并可接受信用卡、借记卡、代金券、钱包、国际卡和非接触支付。与此同时，保留的公开资料并未完全验证若干常见规模说法。官方材料支持“按服务商户数最大”“数十万家企业”、1M+
              应用下载量和广泛产品宽度，但没有直接证明当前 1M+ 商户数或 2M+ 台设备出货量。作为第一章的事实底座，更适合把 Clip 视为一家成熟的墨西哥支付平台，覆盖广泛 SMB
              和中端市场，而不是一家已公开完整审计经营披露的公司。
