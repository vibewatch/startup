      - number: '8.3'
        title: 乐观、基准和悲观估值区间
        blocks:
          - type: paragraph
            body: >
              情景区间应锚定一个问题：Clip 要赚到、守住或失去当前 $2 billion 标记估值，需要哪些条件成立。乐观情景下，Clip 需要证明管理层提到的支付业务盈利能力能扩展到全公司，收入基数显著高于 $173
              million 的第三方估计，并且经审计披露显示抽佣率、毛利润和队列留存动态健康。在这种世界里，高个位数到低两位数收入倍数仍可争辩，因为墨西哥现金数字化跑道仍大，许多商户此前只收现金，而 Clip
              可以在支付之上叠加软件、信贷和嵌入式金融变现。这是当前估值说得通的路径。


              基准情景没那么宽容。如果 $173 million 收入估计大体正确，而 Clip 仍是强劲但部分不透明的私营支付平台，6x-8x 的承销区间会得出约 $1.0-1.4 billion
              的价值。这个结果低于今天的标记估值，但没有灾难性地低；它意味着公司不错，只是当前入场价格偏高。悲观情景更严厉：如果收入质量令人失望，如果下一次定价轮低于 2024 年标记估值，或如果私营金融科技倍数向
              StoneCo、PagSeguro、dLocal 或 MercadoLibre 式公开可比公司靠拢，公允价值区间可能压缩到约 $0.7-1.0
              billion。因此，建议对价格敏感。下行不是因为产品投资逻辑坏了；而是因为 Clip 在拿出高溢价公开市场证据之前，投资人就先支付了高溢价公开市场倍数。
