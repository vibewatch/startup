  - id: TP003
    title: 定价 / 打包比较
    columns:
      - 服务商
      - 公开标价
      - 已包含能力
      - 未知项
      - 含义
    rows:
      - - Clip 标准版
        - 每笔交易 3.6% + IVA；无月费、无闲置费、无最低销售额要求
        - 读卡器 / TPV 收款，加上围绕结账、账户和贷款的更广 Clip 栈
        - 企业议价、按细分客群的实际 MDR 和留存经济性未公开
        - 简单性上竞争力不错，但可见基础 MDR 不是最低
      - - Clip Tap to Pay 产品
        - 每笔交易 2.99% + MXN1 + IVA；无月租；Android 10+ 且支持 NFC
        - 无需额外硬件即可受理非接触式银行卡和钱包；资金立即结算到 Clip Cuenta
        - 单笔上限 MXN1,000，让它更像轻量移动产品，而不是完整智能终端替代品
        - 面向小额商户的低资本开支获客入口
      - - Mercado Pago Point
        - 每笔销售 3.50% + IVA；即时到账；无月租
        - 终端受理，加上围绕商户资金的钱包 / 账户、投资和信贷生态
        - 留存证据对 POS 定价更清楚，对更广商户软件运营深度则较薄
        - 当商户偏好熟悉生态和可见标价时，它形成强直接压力
      - - Conekta 标准方案
        - 银行卡 3.4% + MXN3 + IVA；现金和 SPEI 另行收费
        - API、结账、插件、按钮、链接、银行卡、现金、转账、MSI 和控制面板
        - 留存证据中没有实体终端栈；企业级层级仍需议价
        - 在线 SMB 受理经济性常常优于读卡器供应商
      - - Openpay
        - 显示有优惠或定制佣金，尤其面向 BBVA 客户；没有留存清晰的自助费率卡
        - 付款链接、网关、银行卡、转账、BNPL、现金、认证和 BBVA 背书
        - 对墨西哥小商户而言，可比实际成本在留存公开证据中不可见
        - 更靠信任和全渠道广度竞争，而不是透明的引流价
      - - Kushki
        - 面向高交易量企业的灵活定价；未留存公开 SMB 标价 MDR
        - 收款、付款、收单、Smartlink、线下受理和区域基础设施
        - 墨西哥 SMB 实际经济性的公开可见度很低
        - 作为企业 / 区域基础设施更可信，不太像纯首次读卡器竞争对手
      - - SumUp
        - 每笔交易 3.50% + IVA；MXN0 月费
        - 面向微型和小型商户的简单终端收款和数字工具
        - 留存证据在结账、信贷和更广运营工具上较薄
        - 在首台设备和价格敏感决策上持续挤压 Clip
    notes: 本表比较公开标价条款或明确的定价姿态。它不估算企业议价合同、返利或按商户细分的实际 MDR。
