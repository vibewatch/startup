      - number: '5.3'
        title: 信任、结算和控制层
        blocks:
          - type: paragraph
            body: >-
              Clip 的公开信任故事建立在设备安全声明、银行卡行业控制和结算披露的组合之上。安全页面称，终端会加密接收的数据，检测到篡改会删除数据，不存储卡号，并支持 PIN 或签名流程；结账材料则补充
              PCI、卡组织政策和墨西哥监管对齐表述。更有意思的产品细节，是结算被嵌入 Clip Cuenta，而不是被当成一次单独的银行交接。Clip 称，部分本地线下 Visa 和 Mastercard
              chip-and-PIN 流程会立即出现在账户余额中，而 American Express、非线下卡付款链接、订阅、vales 和结账会在 24
              小时内结算。对小商户而言，这是实实在在的运营优势，但也制造了复杂性，因为到账时间取决于渠道和支付类型。公开定价和可靠性表面不够干净。电商页面反复显示 3.6% 加 VAT、最多 24 期分期，但另一个终端 FAQ
              仍引用 3.5%，已审阅材料均未发布状态页、欺诈损失率或正式正常运行时间 SLA。因此，信任层可信，但还不够透明，尽调不能止步于营销文案。
