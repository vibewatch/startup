  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有机构、邻近玩家和替代品
        blocks:
          - type: paragraph
            body: >-
              不能只拿一家读卡器厂商来给 Clip 做基准。当前墨西哥市场至少分成四类。第一类是直接的自助收单竞争对手，能在注册时争夺同一个小商户：Mercado Pago Point 和 SumUp
              都主打简单入驻、清晰交易定价，以及无月租终端。第二类是 Conekta 这类线上优先本地网关，竞争重点不在硬件，而在结账、付款链接、现金参考、SPEI 和其他商户受理轨道。第三类是 Openpay 和
              Kushki 这类更大的全渠道或企业向基础设施。它们未必显然是 tiendita 读卡器的替代品，但只要商户需要更深的网关能力、BBVA
              背书信任、跨境或区域覆盖，或在一个平台上编排线上线下，它们就重要。第四类是邻近替代品和可能进入者：PayPal 现在更像一个受监管钱包和商户支付参与者，而不是正在积极营销墨西哥 SMB 终端栈的玩家；传统银行
              TPV 和内部自建也真实存在，但在保留公开资料中记录不足。因此，已知集合仍需细化：Mercado Pago、Conekta、Openpay、Kushki 和 SumUp 是当前可观察的压力点；PayPal
              Here 属于历史语境；银行自有 TPV 是真实但仍部分未解决的一层。
