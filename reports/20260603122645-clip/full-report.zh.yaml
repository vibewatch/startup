      - number: '2.2'
        title: 规模测算视角：商户数量、银行卡流水和数字商业
        blocks:
          - type: paragraph
            body: >-
              三个公开视角描述 Clip 的市场，不能把它们压成一个 TAM 标题。第一个是商户数量视角。INEGI 统计 2023 年私营部门经济单位为 5.45 million，其中 95.5%
              是微型企业。这让墨西哥对服务碎片化商户的 payfac 结构上很有吸引力，也意味着微型商户核心超过 5.2 million 个单位。但商户数量不能告诉投资人，有多少商户是活跃的、能收卡的，或在经济上有吸引力的。


              第二个视角是官方支付流水。Banco de México 报告称，2024 年银行卡支付操作为 9.9 billion 笔，银行卡支付金额为 MXN5.8 trillion，银行卡支付占零售电子支付笔数的
              57.9%。这是数字化受理银行卡支出的最佳官方上限视角，而且市场已经很大。Banxico 还显示，银行卡电商支付金额在 2024 年达到 MXN1.11 trillion，自 2015 年以来增长 18x，确认
              Clip 的线上邻近业务不是装饰，而是实质机会。


              第三个视角是供应商预测数据。PPRO 预计墨西哥更广义数字支付市场将从 2023 年约 USD103 billion 增至 2028 年 USD168 billion，并认为电商将在 2026 年达到
              USD176.8 billion。这些数字有方向性价值，但它们与 Banxico 和 INEGI 使用的分母不同。正确结论不是哪一个视角“正确”，而是 Clip 的 SAM
              应从商户队列和活跃度搭建，广义支付数字则用作边界校验。
