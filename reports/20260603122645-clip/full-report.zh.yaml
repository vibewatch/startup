      - number: '3.2'
        title: 能力、定价和渠道对比
        blocks:
          - type: paragraph
            body: >-
              比较 Clip 时最大的错误，是把线下收卡、线上网关和商户运营流程压成一个无差异分数。对一家墨西哥 SMB 金融科技公司而言，Clip 自身公开表面异常宽：它销售读卡器和 TPV、带打印机和现金盒的 POS
              套装、Android Tap to Pay、电商结账、即时结算到 Clip Cuenta，以及商业贷款。这让它比纯支付网关更宽。但宽度不等于最低标价。Clip 公布的标准 MDR 是 3.6% + IVA，而
              Mercado Pago Point 和 SumUp 均显示 3.50% + IVA，Conekta 的线上 SMB 银行卡方案起价更低，为 3.4% + MXN3 + IVA。Clip 确实展示了 2026
              年获客促销，价格为 2.99% + IVA + MXN1，但法律条款说清楚了，这是定向首台读卡器促销，而非持久基础费率卡。相比之下，Openpay 和 Kushki 竞争时较少依赖透明自助价格卡，更多依赖
              BBVA 关联或企业式全渠道打包。实际看，商户想要同一个本地运营商覆盖终端、轻量 POS、Tap to Pay、在线结账和结算时，Clip
              的差异化最强；随着受理复杂度、替代轨道或企业需求上升，Conekta、Openpay 和 Kushki 会变得更危险。
