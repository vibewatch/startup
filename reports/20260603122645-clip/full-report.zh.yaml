  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 线下刷卡支付受理
        - 成功销售收取 3.6% + IVA 常规费用；分期销售另加银行附加费
        - 处理交易量的 %
        - 已上线并广泛宣传
        - 经常性潜力高；经常性收费项与商户 GPV 绑定
        - 索取扣除处理商、网络和争议成本后的净抽佣率
      - - 结账 / 电商网关
        - 在线结账同样按现金销售收取 3.6% + IVA；分期另收附加费
        - 线上 GPV 的 %
        - 已上线；同时支持插件和 API
        - 若线上占比增长，质量较高；授权和拒付经济性未公开
        - 索取线上 GPV 占比、拒付率和授权率
      - - Link de Negocio / 远程支付
        - 无开通租金；客户通过链接或目录付款时变现
        - 远程支付 GPV 的 %
        - 已上线；定位为免费创建
        - 良好的绑定收入线，但公开交易量未披露
        - 索取远程支付占总 GPV 的比例和复购商户使用情况
      - - 硬件终端
        - 一次性设备销售加后续支付处理
        - 每台设备 MXN
        - 当前设备观察到的折扣价在 MXN119-MXN899 之间
        - 质量可能不一：有助获客，但利润率未知
        - 索取设备 COGS、退货、保修成本和补贴政策
      - - Clip Cuenta
        - 不收明确账户费；收益更可能来自结算流、余额和卡使用，而不是显性收费
        - 余额 / 钱包活跃度
        - 已上线；部分流程支持免费转账和即时结算
        - 战略重要，但公开信息看变现不足
        - 索取账户余额、活跃账户数、交换费收入和浮存收益经济性
      - - Prestaclip 贷款
        - 本金加固定费用，另加 IVA；按月还款或随销售额扣款
        - 贷款收益率
        - 已上线，但仅限受邀
        - 潜在收益有吸引力，但信用损失不可见
        - 索取通过率、平均单笔金额、APR 等价口径和按放款批次划分的损失数据
      - - 附加服务佣金
        - 账单支付和话费充值给商户带来佣金，也可能给 Clip 带来价差收入
        - 佣金价差
        - 已上线，但经济性未披露
        - 不是核心收入，但能增厚 SMB 钱包份额
        - 按附加服务索取绑定率和单位经济性
    notes: 各行混合了公司标价、观察到的产品可用性和推断的变现路径。硬件行采用当前店面促销价，不是实际净 ASP 或毛利率。
