              - CM049
              - CM051
          - type: callout
            title: 便宜设备不保证使用
            body: Stanford 证据与任何 Clip 增长模型都直接相关：给商户低价硬件还不够。安装支持、员工培训和顾客沟通会实质改变激活曲线。因此，分销质量和商户成功运营也是护城河的一部分，不只是设备价格。
