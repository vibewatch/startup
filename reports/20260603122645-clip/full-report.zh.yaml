  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重程度
      - 缓释措施 / 尽调问题
    rows:
      - - 本地 SMB 套餐广度
        - Mercado Pago 可打包钱包、账户和信贷；Openpay 和 Kushki 可打包更深的全渠道或区域基础设施
        - 高
        - 衡量 POS、结账、账户和信贷的绑定率，而不是只看读卡器安装量
      - - 可见定价简单
        - Mercado Pago 和 SumUp 在名义银行卡 MDR 上追平或低于 Clip，而 Conekta 在线上银行卡受理上定价更低
        - 高
        - 按细分客群和产品组合收集商户实际定价，不只看标价 MDR 截图
      - - 硬件驱动开通
        - Tap to Pay 为 Clip 降低硬件门槛，但同一转移也让终端单点差异化更容易被复制
        - 中高
        - 跟踪 Tap to Pay 与实体读卡器的激活至 90 天留存
      - - 信任和企业级就绪度
        - Openpay 受益于 BBVA 背书和认证；较大商户可能更偏好银行背书或企业收单机构的信任信号
        - 高
        - 按商户规模、受监管垂直行业和企业控制需求拆分销售管线和流失
      - - 区域扩张 / 全渠道范围
        - Kushki 在保持区域收单深度的同时，进一步切入墨西哥线下支付
        - 中高
        - 跟踪 Clip 是否流失那些超出墨西哥单一定位的大型全渠道账户
      - - 商户切换成本
        - 多家对手都提供链接、结账、现金轨道和转账，多栖使用具备可行性
        - 高
        - 索取赢单 / 输单、流失和钱包份额数据，检验 Clip 拥有的是商户关系还是仅一条支付入口
    notes: 严重程度反映竞争承销风险，不是法律或财务严重性。尽调问题聚焦公开来源仍未提供的数据。
