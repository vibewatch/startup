  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、融资背景和反向逻辑
        blocks:
          - type: paragraph
            body: >
              Clip 仍像一个具有战略相关性的墨西哥 SMB 支付平台：公司称，按服务商户数计，它是墨西哥最大的数字支付和商业赋能平台，业务横跨 POS 硬件、线上支付、软件和贷款；Bloomberg
              报道，核心支付业务已经贡献超过 85% 的活动量，并且已经盈利。这些都是实质性正面因素。2024 年 6 月融资也很重要：Morgan Stanley Tactical Value 和另一家大型西海岸基金投入
              US$100 million，没有压低估值；在一个比 2021 年融资热潮更挑剔得多的风险投资市场里，公司守住了独角兽地位。


              反向逻辑针对估值，不是针对公司质量。同样的 $2 billion 价格在 2021 年 6 月 Series D 时已经存在，因此又执行了三年后，投资人并未公开把 Clip
              向上重估。第三方数据库在累计融资和收入两个口径上都对不上，这让稀释、优先股堆叠和回报建模变得不确定。如果唯一可得的公开收入估计（2024 年 $173
              million）方向正确，当前估值已经假设两位数收入倍数。只有当 Clip
              在下一轮尽调中证明异常持久的增长、异常干净的单位经济性，或异常强的披露质量，这个估值才说得通。今天的公开证据还达不到这个门槛，所以正确姿态是把 Clip
              留在名单上，但把它当作一个由披露程度把关的机会，而不是清晰买入。
