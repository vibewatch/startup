        - 收银员和负责后台的业主
        - 商户运营预算
        - 柜台收款，偶尔接电话或社交渠道订单
        - 更快结账、非接触式受理、周末结算
        - POS、链接和 QR 的自然适配场景
      - - 移动服务商户
        - 技工、配送卖家或现场服务经营者
        - 在外用手机收款的业主
        - 商户运营预算
        - 没有固定结账通道；移动中完成收款
        - 轻硬件开通和便携受理
        - Tap to Pay 在这里显著扩大触达
      - - 线上优先中小企业
        - 创始人或电商经理
        - 后台运营人员
        - 商户增长预算
        - 网站、社交和消息渠道驱动的销售
        - 结账转化和全渠道收款
        - 结账、定期付款和链接比读卡器更重要
      - - 多门店中小商户
        - 区域运营负责人或财务负责人
        - 门店员工和总部管理员
        - 运营 / 财务预算
        - 分店报表，线下和远程收款混合
        - 跨门店可视化和更丰富的商户工具
        - POS、软件和贷款增购的更高价值客群
    notes: 细分逻辑综合自 Clip 的产品页和墨西哥经营网点结构。预算归属在商户侧，尽管交易付款方是消费者。
