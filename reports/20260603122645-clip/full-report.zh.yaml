      - number: '6.5'
        title: 扩张动线和集中度风险
        blocks:
          - type: paragraph
            body: >-
              Clip 的客户扩张逻辑看得见，也有可信度，只是财务结果还没有公开证明。商户先用 Clip 收卡后，Clip 可以继续卖支付链接、商业链接、QR、结账、订阅、商品目录、服务缴费、话费充值、贷款，有些场景还能推
              Wansoft 餐饮方案或定制企业集成。渠道扩张也能从 Siigo、行业协会、医疗项目和部分大客户促销中看出来。这套生态应该能给「先落地、再扩张」留出空间，也让 Clip
              比单一读卡器更难被替换。问题在于，公开资料仍没有回答投资人最关心的两个问题：最大客户是谁，以及客户上线后到底有多黏。已审阅材料没有量化活跃多产品商户、渠道项目续约率或头部客户收入集中度。因此，公开记录支持一个可信的扩张引擎，但还没有证明高价值客户层足够持久、足够分散，可以排除集中度风险。
