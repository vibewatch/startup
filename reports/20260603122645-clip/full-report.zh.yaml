        - 通常 24 小时；部分 Clip Cuenta 境内当面刷卡流程即时结算
        - 标价可见；扣除处理商成本后的净抽佣未披露
        - 当前 Clip 费率计算器和 Checkout 页面
      - - 免息分期（MSI）
        - 基础费率加银行附加费；公开示例为 4.57% + IVA 至 27.17% + IVA
        - 商户在 24 小时内收到扣除费率和附加费后的全额销售款
        - 综合费率取决于期数和银行组合
        - Clip 费率计算器页面
      - - Link de Negocio 付款链接
        - 无月租；已处理支付收取 3.6% + IVA
        - 客户通过链接进入 Clip 账户流程付款
        - 仅按使用收费；未见公开订阅费
        - Link de Negocio 页面
      - - Checkout
        - 成功全款销售交易收取 3.6% + IVA
        - Clip 称商户每日收款 / 最迟 24 小时到账
        - 分期另加附加费；风控额度随商户入驻时间变化
        - Checkout 页面
      - - Clip Cuenta
        - 不收年费、账户费、转账费或隐藏费用
        - 部分境内当面刷卡流程即时结算；支付链接、Checkout、凭证和 AMEX 为 24 小时
        - 经济模型可能偏间接，而非显性收费
        - Clip Cuenta 页面
      - - Clip Plus 2 / Pro 2 / Ultra / Total 3 终端
        - 观察到促销价 MXN119 / MXN399 / MXN599 / MXN899
        - 一次性硬件购买
        - 公开页面强调无租金，后续靠交易变现
        - 当前网店产品页
      - - Clip Empresas / Pin Pad
        - 月卡交易额超过 MXN50,000 的商户享优惠费率
        - 企业 / 协商定价
        - 具体费率表未披露
        - Pin Pad 企业页
      - - Prestaclip
        - 固定费用另加 IVA；具体费率仅在邀请报价中披露
        - 产品页称获批后 24 小时内放款
        - 未公开 APR 或损失率
        - Prestaclip 页面
