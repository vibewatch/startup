        - 高
        - 支撑流动性和营运资金，但增加交易对手 / 契约约束考量
        - 索取契约条款、提款情况、定价、到期结构和剩余额度
      - - 2021 年 Series D 轮
        - 融资 US$250M，估值接近 US$2B
        - 高
        - 此前的大额缓冲降低了进入 2022 年时的近期融资压力
        - 索取 2024 年交易交割时剩余新股资金，以及主要优先股权利
      - - 当前估值信号
        - 据称 2024 年融资对 Clip 的估值与 2021 年持平；Tracxn 也显示当前估值为 US$2B
        - 中
        - 名义估值持平显示韧性，但不一定代表经济条款上调
        - 索取准确投后估值、完全摊薄股数和任何结构化条款
      - - 累计融资估计
        - Tracxn 列示 11 轮合计约 US$497M
        - 中
