  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和现状替代品
        blocks:
          - type: paragraph
            body: >-
              Clip 的经营市场不是“整个墨西哥 fintech”，甚至也不是“所有支付”。最清晰的边界，是面向墨西哥微型、小型和中型企业的商户受理与商业赋能：通过读卡器、POS 设备和 Tap to Pay
              做线下收卡；通过链接和 QR 做远程与社交电商收款；为 SME 提供在线结账和经常性付款；并在收款跑通后，用商户软件或融资工具提高 ARPU。这一框架与 Clip
              自身产品架构一致：帮助商户收钱、更快结算、远程销售，并管理基础经营流程。


              哪些不应进入核心边界，同样重要。企业核心银行、消费者存款、薪资基础设施，以及永远不会数字化的纯线下现金交易，不属于 Clip 的直接 TAM。只有当它们重新连接到商户激活或钱包 /
              卡受理时，才相关。现状替代品依然强大：现金、传统银行终端、银行转账和既有
              PSP，都能为只需要收款的商户完成同一项工作。因此市场同时有两层：一个非常大的商户数量机会，以及一个更窄、可变现的机会，后者取决于商户是否真正激活数字受理并持续使用。
