  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和变现栈
        blocks:
          - type: paragraph
            body: >-
              Clip 已不再呈现为单一插接式读卡器业务。在当前公开表面上，公司销售线下收卡、在线结账、付款链接、商户账户余额、营运资金贷款、库存工具，以及多款硬件终端。核心列示变现锚点仍是交易定价：Clip 反复公布常规销售
              3.6% + IVA 的标价，而分期方案会叠加银行附加费，在更长期限下可能把全包费率显著推高。这让支付成为经常性引擎，但不是唯一引擎。硬件以低促销价预先出售，Link de Negocio
              免费启动，只在付款流经它时变现；Clip Cuenta 在明示费用口径下免费，但加深结算捕获；Prestaclip 通过固定费用加 IVA
              变现。销售动线分层也体现在定价中：低端商户可通过网店和无租金产品页面自助购买，而月银行卡交易量超过 MXN50,000 的较大商户会被导向企业销售和定制定价。实际看，收入质量取决于有多少 GPV
              落入重复交易费，而不是可见度较低的硬件或商户信贷等收入线。
