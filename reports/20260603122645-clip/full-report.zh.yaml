      - number: '7.2'
        title: 运营、欺诈和服务风险
        blocks:
          - type: paragraph
            body: >-
              Clip
              的运营风险重点不在于有没有安全宣传，而在于商户工作流出问题时，谁来吸收摩擦。公司强调异常监控、可疑交易验证、加密，以及不存储银行卡数据的承诺，但法律条款显示，第一损失敞口仍可能很快流回商户群。商户可能因拒付、退款和罚款被扣款，Clip
              也保留广泛的直接拒付追扣权，追索窗口有限。2026 年 1 月返现项目很能说明问题：它只补偿一笔有利争议，且上限只有 MXN 1,400，说明保障是战术性的，不是结构性的。公开投诉面也强化了这个判断。DXR 的
              2026 年评论汇总显示，一款商户金融 app 的情绪分数异常弱；Downdetector 分类则覆盖资金转账、登录、支付、QR 和网站问题。Clip
              自己的保修政策还写明，读卡器不保证不间断运行，符合条件的维修在收货后可能需要 7 个工作日。因此，公开记录支持一项实质性的服务质量和拒付管理风险：Clip
              也许能控制部分欺诈向量，但并未公开披露准备金率、争议胜率、宕机频率或 CFDI 支持指标，无法证明商户痛点在规模化后被控制住。
