      - number: '3.3'
        title: 切换成本、信任信号和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Clip 的护城河真实存在，但保留的公开证据指向的护城河，比简单市场领导者故事更窄。最强的持久楔子，是面向 SMB 的本地工作流宽度：线下收卡硬件、POS 运营、Tap to
              Pay、电商结账、即时资金和借贷，都放在一个聚焦墨西哥的伞下。当商户围绕一个提供商标准化员工流程、结算流和运营工具时，这会创造有意义的切换成本。问题在于，许多可见表面并非独占。Mercado Pago
              增加钱包、账户和借贷杠杆；Openpay 借力 BBVA 信任、认证和企业客户名单；Kushki 在收购 Billpocket 后更果断进入墨西哥线下支付；Conekta 加 Openpay
              都在强化仍然现金和数字混合经济中重要的非卡轨道。公开数据在实际定价、活跃商户数、留存和胜负率上很薄，因此最有支撑的结论是谨慎的：Clip
              的护城河更强在本地捆绑执行，而非原始定价权。多平台并用仍有可能，尤其是商户可以把终端需求与线上网关或资金管理需求拆开时。即便 Clip 仍是市场上最宽的 SMB 方案之一，商品化风险也仍然偏高。
