      - number: '5.2'
        title: 架构和集成表面
        blocks:
          - type: paragraph
            body: >-
              Clip 的公开技术证据强于典型 SMB 支付网站，但仍面向集成商，而不是深入基础设施。开发者门户列出模块化栈：商户认证 Clip 账户，用 API 处理交易、存款和结账，接入 webhook
              获取实时更新，并可通过终端 SDK 或 Pin Pad / POS API 表面，把终端集成进销售点流程。存款和交易 API
              尤其相关，因为它们暴露的是对账模型，而不只是受理；商户可以查询小票级和结算级数据，而不必只依赖仪表盘。Clip 还通过应用市场列表和合作伙伴目录分发集成，降低
              Shopify、WooCommerce、WordPress.com、Tiendanube 和 PrestaShop 商户的采用摩擦。尽管如此，公开材料在重要位置仍留下架构不透明性。公司没有发布系统图，大多数
              API 没有公开变更日志，也没有外部可见的可用性仪表盘。投资人应把开发者表面视为真实集成计划的证据，但不要把它误认为生产级可观测性或企业部署质量的证明。
