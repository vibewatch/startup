  - id: FR001
    title: Clip 风险热力图
    type: matrix
    layout: standard
    summary: 只用公开可支撑证据，按发生可能性和影响定位 Clip 剩余风险。
    data:
      columns:
        - 严重影响
        - 高影响
        - 中等影响
      rows:
        - label: 高可能性
          values:
            - tone: negative
              label: 合规开销和边界不透明
            - tone: negative
              label: 拒付、争议和服务摩擦
            - tone: negative
              label: Mercado Pago 价格和 softPOS 压力
        - label: 中等可能性
          values:
            - tone: negative
              label: PrestaClip 对薄档案商户的信贷损失
            - tone: negative
              label: 隐私 / 敏感数据控制失效
            - tone: neutral
              label: 融资硬件合作伙伴争议
        - label: 低可能性
          values:
            - tone: negative
              label: 正式执法显著收窄运营
            - tone: negative
              label: 估值持平融资后出现资金或跑道重置
            - tone: neutral
              label: CFDI 流程故障在公开层面显现
    approximationNotes: 发生可能性和影响是分析师基于截至生成日留存公开证据作出的判断。单元格显示公开缓释之后的剩余敞口，不只是不加缓释的固有风险。
    claimRefs:
      - CR012
      - CR014
      - CR022
      - CR028
      - CR038
      - CR042
      - CR045
      - CR049
  - id: FR002
    title: Clip 风险传导图
    type: dag
    layout: standard
    summary: 合规、服务、竞争和宏观风险如何流向信任、利润率、贷款损失和估值。
    data:
      nodes:
        - id: reg
          label: 合规 / 监管变化
          description: 边界不透明、Banxico 规则、AML 和隐私义务
        - id: ops
          label: 服务 / 拒付摩擦
          description: 资金转账问题、争议、硬件停机
        - id: credit
          label: 薄档案贷款敞口
          description: 替代数据承销和催收风险
        - id: comp
          label: Mercado Pago 压力
          description: 规模、促销定价、银行业务野心、softPOS
        - id: macro
          label: 宏观 / 比索走弱
          description: 活动转弱、融资压力、贬值倾向
        - id: trust
          label: 商户信任侵蚀
          description: 客服痛点和结算不确定性
        - id: margin
          label: 费率 / 利润率压缩
          description: 支持成本更高、定价权更低
        - id: losses
          label: 信贷损失 / 准备金需求
          description: 贷款账簿的第一损失负担更高
        - id: valuation
          label: 估值和融资压力
          description: 增长质量下降，执行失误空间更小
      edges:
        - from: reg
          to: margin
          label: 更高合规成本
        - from: reg
          to: valuation
          label: 更大法律不确定性
        - from: ops
          to: trust
          label: 商户痛点
        - from: ops
          to: margin
          label: 支持和争议成本
        - from: credit
          to: losses
          label: 借款人质量更薄
        - from: losses
          to: valuation
          label: 单位经济性下降
        - from: comp
          to: margin
          label: 价格压缩
        - from: comp
          to: trust
          label: 竞品工具更好
        - from: macro
          to: losses
          label: 商户现金流走弱
        - from: macro
          to: valuation
          label: 增长放缓和成本压力
        - from: trust
          to: valuation
          label: 流失和留存走弱
        - from: margin
          to: valuation
          label: 经营杠杆下降
    approximationNotes: 边只表示定性关系，不分配数值概率或权重。该图旨在展示因果关系，不是模型输出。
    claimRefs:
      - CR014
      - CR015
      - CR022
      - CR028
      - CR033
      - CR034
      - CR038
      - CR040
      - CR042
      - CR045
      - CR048
  - id: FR003
    title: Clip 依赖图
    type: dag
    layout: standard
    summary: 覆盖监管、承销数据、移动平台和融资硬件交付的关键外部依赖。
    data:
      nodes:
        - id: clip
          label: Clip 核心平台
          description: 支付、贷款、商户软件、支持
        - id: networks
          label: 卡组织 / 收单机构
          description: 收单、争议、卡组织规则、结算逻辑
        - id: regulators
          label: Banxico / CNBV / SAT
          description: 支付规则、AML 义务、监管
        - id: belvo
          label: Belvo 数据和借记通道
          description: PrestaClip 所需的雇佣数据和经常性扣收
        - id: cavimex
          label: CAVIMEX
          description: 设备交付、安装、质保和退货
        - id: mobile
          label: Google / Apple 移动生态
          description: 应用分发、隐私披露、设备兼容性
        - id: merchants
          label: 商户
          description: 交易量、还款流、支持需求
        - id: mercadopago
          label: Mercado Pago / MercadoLibre
          description: 兼具贷款、softPOS 和银行业务野心的规模化竞争者
      edges:
        - from: clip
          to: networks
        - from: clip
          to: regulators
        - from: clip
          to: belvo
        - from: clip
          to: cavimex
        - from: clip
          to: mobile
        - from: merchants
          to: clip
        - from: mercadopago
          to: merchants
          label: 价格和产品牵引
        - from: belvo
          to: merchants
          label: 经常性扣款和数据可见性
        - from: cavimex
          to: merchants
          label: 设备履约
        - from: regulators
          to: merchants
          label: 规则变化影响工作流
    approximationNotes: 依赖边只表示方向和性质。它们用于显示集中点，而不是合同排他性。
    claimRefs:
      - CR033
      - CR034
      - CR036
      - CR038
      - CR040
      - CR041
      - CR046
      - CR047
      - CR048
      - CR051
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 投资建议的正面来自强业务质量和真实融资韧性，负面则是披露折价和隐含溢价倍数。
    data:
      nodes:
        - id: n1
          label: 业务质量
          detail: 商户触达、产品宽度和支付盈利能力是真实优势。
        - id: n2
          label: 融资信号
          detail: 2024 轮保持 $2B 标记，没有接受下行轮。
        - id: n3
          label: 披露质量
          detail: 无审计财务、无公开股权结构表，数据库融资历史也不一致。
        - id: n4
          label: 市场可比检验
          detail: 拉美上市支付可比公司多数低于 Clip 隐含倍数。
        - id: n5
          label: 估值评估
          detail: $2B 只有在执行要求很高的上行情景下才站得住。
        - id: n6
          label: 建议
          detail: 继续研究 / 跟踪，直到价格或披露改善。
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CV015
      - CV016
      - CV020
      - CV024
      - CV030
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 当前 $2B 标记高于多数上市可比换算点，并要求相对唯一公开收入估计给出溢价倍数。
    approximationNotes: 数值把 $173M 公开收入估计换算成不同销售倍数下的估值结果；它们不是管理层指引。
    data:
      items:
        - label: 4x 下行上市区间
          value: 692
        - label: 6x 有纪律基准区间
          value: 1038
        - label: 7.6x Nu 上市溢价
          value: 1315
        - label: 8x 强劲私营增长区间
          value: 1384
        - label: 10x 乐观私营溢价
          value: 1730
        - label: 11.6x 当前 Clip 标记
          value: 2000
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV035
      - CV036
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 情景区间显示，当前买方需要乐观情景成立才能支撑完整估值；基准情景定价仍低于当前名义估值。
    approximationNotes: 公允价值区间是情景估计，锚定上市可比换算和 Clip 估计 2024 收入，而不是经审计的公司预测。
    data:
      items:
        - label: 悲观公允价值（USD M）
          low: 700
          mid: 850
          high: 1000
        - label: 基准公允价值（USD M）
          low: 1000
          mid: 1300
          high: 1600
        - label: 乐观公允价值（USD M）
          low: 1800
          mid: 2100
          high: 2400
        - label: 总价值 / $2B 进入价（x）
          low: 0.35
          mid: 0.65
          high: 1.2
    claimRefs:
      - CV018
      - CV019
      - CV021
      - CV041
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: Clip 在市场和产品相关性上得分较好，但披露质量差，当前价格下估值纪律也只是中等。
    data:
      items:
        - label: 市场机会
          value: 8
          detail: 墨西哥从现金转向数字支付仍有很大空间。
        - label: 产品宽度
          value: 7
          detail: 支付、POS、软件、信贷和线上工具拓宽变现选项。
        - label: 商户触达
          value: 8
          detail: 官方材料把 Clip 定位为本土市场服务商户最多的平台。
        - label: 盈利证明
          value: 6
          detail: 据报道核心支付已盈利，但公司整体经审计盈利能力不公开。
        - label: 披露质量
          value: 3
          detail: 公开证据仍缺审计报表、股权结构表细节和可对账的融资历史。
        - label: 估值纪律
          value: 4
          detail: 当前标记相对多数上市可比公司隐含溢价倍数。
        - label: 融资包袱
          value: 4
          detail: 数亿美元累计资本很可能在退出分配瀑布中排在新买方面前。
    claimRefs:
      - CV017
      - CV024
      - CV030
      - CV039
      - CV040
