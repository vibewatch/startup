      - - 收入质量不及预期
        - 经审计收入或毛利显著低于公开估计和管理层叙事
        - 当前价格已经假设高质量变现，这会打破倍数逻辑。
        - 转为回避，或等待重新定价。
      - - 股权结构表 / 优先股堆叠比预期更苛刻
        - 参与型优先股、重度反稀释棘轮，或会吸走退出收益的高级负担
        - 账面企业价值难以转化为普通股回报。
        - 要求不同条款、老股交易结构，或更低价格。
      - - 看不到从支付业务盈利走向公司整体盈利的路径
        - 新增尽调显示支付业务盈利，但邻近业务结构性亏损
        - 高溢价倍数的路径收窄，退出就绪也被推迟。
        - 把公司按更窄的支付资产看待，不再按平台溢价故事定价。
      - - 披露持续不透明
        - 管理层在尽调中拒绝提供经审计报表、TPV / 抽佣率，或融资勾稽
        - 公开证据折价继续存在，也挡住置信度上调。
        - 即便业务动能仍稳，也把建议维持在继续研究 / 观察。
    notes: 这些触发条件都设计成能在尽调中或未来融资事件中观察到，用来把定性投资逻辑转化为明确的投资 / 等待 / 放弃决策。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV028
      - CV029
      - CV039
  - id: TV006
    title: 最终尽调追问清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计财务报表
        - 2024、2025 年经审计收入、毛利、TPV、抽佣率和现金流
        - 当前估值争议建立在第三方收入估计上，而不是经审计事实。
        - CFO / 财务资料室请求；与税务和审计包勾稽。
      - - 融资勾稽
        - 逐轮融资台账，解释公开数据库为何对累计融资额口径不一
        - 如果累计投入资本更接近 $150M、$350M 或 $497M，回报模型会显著变化。
        - 财务 / 法务；按轮次和工具提供股权结构表。
      - - 优先股堆叠和反稀释条款
        - 清算分配瀑布、参与权、棘轮条款和债务优先级
        - 优先权负担较大时，企业价值可能高估股权价值。
        - 法律尽调；审阅章程、投资人权利协议和债务文件。
      - - 盈利桥接
        - 支付业务盈利如何传导到公司合并口径盈利的证据
        - 投资人需要判断邻近产品是在消耗还是增强支付业务经济性。
        - 财务 / 分部报告；按产品线提供贡献利润率。
      - - 商户队列质量
        - 按商户获客批次拆分的留存、流失、抽佣率稳定性和信用损失表现
        - 高溢价倍数需要可持续变现，而不只是广泛商户触达。
        - 数据室导出队列数据；用董事会材料或月度经营复盘验证。
      - - 退出就绪度
        - IPO 准备状态、治理就绪度和流动性路线图
        - 如果能看见公开市场就绪度，高溢价私募价格更容易测算。
        - CEO / 总法律顾问 / 银行家尽调；索取治理和融资时间表。
    notes: 这些追问按改变投资测算的直接程度排序。第 1-3 项是估值关键阻断点；第 4-6 项决定高溢价逻辑能否持续。
    claimRefs:
      - CV016
      - CV023
      - CV029
      - CV038
      - CV040
