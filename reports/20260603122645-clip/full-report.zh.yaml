        - 索取已核对的融资历史，并标明各工具是股权、债务还是其他
      - - 融资立场
        - LatAmList 称 CFO Mariano Carranza 认为 2022 年融资需求已覆盖，当时不需要 IPO
        - 中
        - 降低了当期即时资金压力担忧，但无法说明 2026 年现金跑道
        - 索取当前融资计划、触发指标和下行情景资金需求
      - - 现金 / 烧钱速度 / 现金跑道
        - 本章审阅的一级来源未公开披露
        - 低
