  - id: TI004
    title: 资本充足性表
    columns:
      - 资本项目
      - 公开数值 / 状态
      - 证据质量
      - 投资判断含义
      - 尽调索取项
    rows:
      - - 2024 年成长股权轮
        - Morgan Stanley Tactical Value 和一家大型西海岸共同基金管理人投资 US$100M
        - 高
        - 证实公司能拿到新的股权资本，用于产品开发和增长
