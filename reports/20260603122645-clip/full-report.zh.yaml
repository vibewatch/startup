      - number: '7.3'
        title: 信贷、竞争和市场风险
        blocks:
          - type: paragraph
            body: >-
              PrestaClip 具有战略重要性，因为贷款能提高商户变现，但它也制造了公开记录里最明显的资产负债表风险。资格与既有 Clip
              使用和销售活动绑定，还款也可直接挂钩商户销售流水。这套结构在运营上很顺，但目标借款人池里，替代数据提供商称仍有很大一部分申请因为缺少征信记录而失败。Clip 的应对是依赖 Belvo
              就业和收入数据、动态风险调整以及自动经常性扣款；这可能扩大普惠覆盖，但也意味着承销质量现在取决于外部数据轨道和模型，而公司没有用损失率口径公开披露。竞争背景让利润率方程更难。Mercado Pago
              在墨西哥已有超过 1 million 台活跃 POS 终端，发放了数百万笔 SME 贷款，推出了 2026 年 PointTap softPOS 产品并给出 2.99% 促销费率，还隶属于
              MercadoLibre 集团；该集团计划在墨西哥投资 US$3.4 billion，并正在为 Mercado Pago 申请银行牌照。Clip 自己公开的费率框架——3.6% 加
              IVA，捆绑欺诈和争议服务——很清楚，但如果更大的对手补贴获客、结算速度或信贷，清晰定价保护不了抽佣率。再叠加 Banxico 的弱增长背景和比索贬值倾向，风险会同时传导到支付交易量和贷款表现质量。
