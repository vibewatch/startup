      - number: '1.3'
        title: 融资历史、投资人基础和资本结构含义
        blocks:
          - type: paragraph
            body: >-
              对一家墨西哥私营金融科技公司而言，Clip 的融资历史异常可见，足以支撑后续章节。2024 年轮次是最干净、证据最强的事件：Clip 和 Morgan Stanley 均称公司从 Morgan Stanley
              Tactical Value 与一家未具名的大型西海岸共同基金管理人获得 US$100 million，估值与 2021 年 Series D 保持一致。这一点很重要，因为它说明，在融资环境更挑剔时，Clip
              仍能募集大额私募资本，且没有公开承认降价轮。2021 年 Business Wire 公告仍是标准的独角兽里程碑，称公司由 SoftBank Latin America Fund 与 Viking Global
              领投，融资 US$250 million，估值接近 US$2 billion。Tracxn 和 LatAmList 补充了 2022 年债务融资的证据，并把累计资本放在约 US$497
              million，但这个累计数字仍应视为第三方追踪器计算，而非公司认证披露。已点名投资人组合也具有战略意义，不只是财务意义：SoftBank、Viking、General
              Atlantic、Ribbit、Goldman Sachs、Morgan Stanley、Banorte、Visa 和其他投资人，为 Clip
              带来增长资本、本地金融关系和生态可信度的深度组合。资本尽调剩下的两大问题，是 2024 年轮次后的精确股权结构表，以及早期股权持有人和新近结构化或债务提供方所附带的治理权利。
