  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与合规风险
        blocks:
          - type: paragraph
            body: >-
              Clip 的监管触面明显比读卡器加 app 的简单品牌印象更宽。公司公开表示会对齐 CNBV、Banxico、ABM、PCI 和 EMV 要求，但保留记录也说明，合规不该被当成打勾事项，而是一阶风险。Clip
              的隐私通知写明，法律指令要求终端操作中采集地理位置，身份验证可能使用面部识别等生物识别信息，商户数据会在美国第三方服务器上处理。PrestaClip 又加了一层：公司称其贷款业务作为 Actividad
              Vulnerable 受 SAT 监管，可以查询征信机构，并可依据 LFPIORPI 要求补充 AML 文件。Banxico 也在 1H26
              修订电子转账规则，因为割裂的银行应用仍让用户遇到摩擦和错误。剩下的问题是边界清晰度。公开页面把 Cuenta 识别为 Clip AI, S.A. de C.V., IPFE，把贷款识别为 Prestaclip,
              S.A. de C.V.，但没有完整列出更广的支付和清结算栈。这个点重要，因为墨西哥 2026 年法律改革让不利规则更难挑战，也让受监管运营商在等待个案救济时更暴露于不均衡执法。
