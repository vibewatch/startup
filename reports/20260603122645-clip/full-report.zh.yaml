              SMB 赋能来定位公司。Yahoo Finance 转载的 Bloomberg 报道又加入了一个重要采用质量细节：约 85% 的 Clip 商户在使用平台前只收现金，说明 Clip
              不只是为已经数字化的企业更换处理商，而是在把商户带入电子受理。公开应用表面进一步强化了覆盖故事。Google Play 显示超过 1 million 下载、超过 62 thousand 条评论，墨西哥 App
