      - number: '2.4'
        title: 增长驱动因素和采用约束
        blocks:
          - type: paragraph
            body: >-
              Clip 的长期顺风是真实的。2018 年至 2023 年，经营场所层面的现金使用大幅下降，银行卡和电子转账上升。随后 Banxico 报告 2024 年银行卡又实现一年两位数增长，Banxico 与 2026
              年行业来源也显示，非接触和数字渠道使用仍在加速。供给侧，非银行收单机构和 payfac 扩张受理的速度快于银行，这有利于 Clip
              这类靠分销速度、简单入驻和软件驱动获客竞争，而不是靠网点基础设施竞争的运营商。Tap to Pay 应会强化这一模式，因为它降低了小商户立即开始收卡的硬件摩擦。


              悲观情景同样具体。墨西哥小额购买仍高度依赖现金，仅靠降低设备价格并未解决商户赋能。Stanford 的 Guadalajara
              实验在这里尤其相关：免费硬件本身带来的留存很弱，入驻支持和面向顾客的宣传则显著改变结果。与此同时，CoDi 的采用仍低于最初预期，意味着账户到账户 QR
              轨道还没有以纯政策叙事暗示的速度替代银行卡或现金。监管变化也是双刃剑。交换费改革可能帮助小额受理，但开放金融仍未完成，Mercado Pago 和其他规模化网络的竞争也会推高获客压力。
