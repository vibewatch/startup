companyProfile:
  summary: >-
    Clip 是一家后期私营的墨西哥支付和商业赋能公司，2012 年由 Adolfo Babatz 与 Vilash Poovala 在 Mexico City 创立。公司最初靠小商户收卡建立位置，随后扩展到 POS
    硬件、付款链接、在线结账、Tap to Pay、商户软件，以及类似营运资金的信贷。公开融资证据显示，Clip 在 2021 年以约 $2 billion 估值完成 $250 million Series D，2024 年又获得
    $100 million 投资，并守住独角兽估值。公司在墨西哥 SMB 数字化中具有战略重要性，但在经审计收入、商户活跃度、利润率和治理权利上，公开披露仍不完整。
