        - 收入数字由第三方估计，未经公司审计。
      - - Nu Holdings
        - 2026 年 6 月公开市场
        - 7.64x 销售；$58.0B 市值；$7.59B LTM 收入
        - LatAm 数字金融溢价倍数；这组公开乐观情景里最好的上限。
        - 规模远大于 Clip，披露也好得多。
      - - dLocal
        - 2026 年 6 月公开市场
        - 2.84x 销售；$3.44B 市值；$1.21B LTM 收入
        - 高增长 LatAm 支付基础设施参照。
        - 跨境 PSP 模式不同于 Clip 聚焦 SMB 收单。
      - - MercadoLibre
        - 2026 年 6 月公开市场
        - 2.67x 销售；$84.81B 市值；$31.80B LTM 收入
        - 规模化 LatAm 商业金融科技平台的上限参照。
        - 包含电商、广告、物流和信贷，不是纯支付同业。
      - - StoneCo
        - 2026 年 6 月公开市场
        - 1.05x 销售；$2.73B 市值；3.24B BRL LTM 收入
        - 商户收单和软件参照，显示成熟支付处理商遭遇市场折价时的样子。
        - 收入以 BRL 计价，最近一期增长为负。
      - - PagSeguro
        - 2026 年 6 月公开市场
        - 0.67x 销售；$2.56B 市值；19.81B BRL LTM 收入
        - 另一个巴西支付 / 收单基准，锚定可比区间低端。
        - 成熟上市处理商，增长较慢，地域也不同。
    notes: 公开可比倍数用于约束估值纪律，不是机械的内在价值。只有经审计增长、利润率质量和披露能支撑时，Clip 的私募估值标记才应享有溢价。
