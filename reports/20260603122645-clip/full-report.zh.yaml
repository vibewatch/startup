      - number: '8.2'
        title: 可比框架和披露折价
        blocks:
          - type: paragraph
            body: >
              仅凭公开证据给 Clip 估值，最干净的方法不是 DCF；这里没有经审计收入桥、没有毛利润披露、没有利润率历史，也看不到股权结构表。更合适的框架，是带有明确披露折价的市场倍数比较。按 2026 年 6
              月初的公开筛选，Nu 的收入倍数约 7.6x，dLocal 约 2.8x，MercadoLibre 约 2.7x，StoneCo 约 1.0x，PagSeguro 约 0.7x。Nu
              是高溢价异类，因为它同时具备规模、强增长和上市公司披露。MercadoLibre 是估值上限参考，不是干净可比公司，因为它的倍数不只反映支付，也反映电商、广告和信贷。StoneCo 和 PagSeguro
              是增长较慢的收单 / 支付参照，显示成熟市场怀疑情绪会怎样压低支付处理商倍数。


              放在这组可比公司旁边，Clip 的隐含倍数偏高。用 GetLatka 的 2024 年 $173 million 收入估计计算，当前 $2 billion 私人市场标记估值约等于 11.6x 收入——高于 Nu
              的高溢价上市倍数，也远高于 StoneCo、PagSeguro、dLocal 或 MercadoLibre。这并不能证明 Clip 不值 $2
              billion，因为私人投资人可能是在为墨西哥现金向数字迁移、商户覆盖和产品邻接付费。但它确实说明，当前价格已经嵌入相当大的执行和披露溢价。公开可比公司也都有投资者关系或申报基础设施，而 Clip
              的公开记录仍主要是新闻稿和数据库摘要。这个披露缺口本身就是估值折价，因为投资人被要求在私营公司不透明度下，支付上市公司溢价倍数。
