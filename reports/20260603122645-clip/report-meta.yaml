companyProfile:
  summary: >-
    Clip is a late-stage private Mexican payments and commerce-enablement
    company founded in 2012 by Adolfo Babatz and Vilash Poovala in Mexico City.
    It built its initial position in card acceptance for small merchants, then
    expanded into POS hardware, payment links, online checkout, Tap to Pay,
    merchant software, and working-capital style credit. Public fundraising
    evidence shows a $250 million 2021 Series D at roughly a $2 billion
    valuation and a further $100 million 2024 investment that preserved that
    unicorn mark. The business looks strategically important in Mexican SMB
    digitization, but public disclosure remains incomplete on audited revenue,
    merchant activity, margins, and governance rights.
  foundedDate: '2012-01-01'
  founders:
    - name: Adolfo Babatz
      role: Founder, Chairman, and CEO
      background: >-
