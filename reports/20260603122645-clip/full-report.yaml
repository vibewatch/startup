  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, financing context, and anti-thesis
        blocks:
          - type: paragraph
            body: >
              Clip still screens as a strategically relevant Mexican SMB-payments platform: the company says it is the
              country's largest digital payments and commerce-enablement platform by merchants served, it spans POS
              hardware, online payments, software, and lending, and Bloomberg reported that the core payments business
              already generates more than 85% of activity and is profitable. Those are real positives. The June 2024
              financing also matters: Morgan Stanley Tactical Value and another large West Coast fund invested $100
              million without forcing a markdown, so the company defended its unicorn status in a far more selective
              venture market than the 2021 funding boom.


              The anti-thesis is valuation-specific rather than company-quality-specific. The same $2 billion price was
              already in place in the June 2021 Series D, so investors have not publicly rerated Clip upward over three
              additional years of execution. Third-party databases do not reconcile cleanly on either total funding or
              revenue, which makes dilution, preference-stack, and return modeling uncertain. If the only public revenue
              estimate available ($173 million for 2024) is directionally correct, the current valuation already assumes
              a double-digit sales multiple. That can be justified only if Clip proves unusually durable growth,
              unusually clean unit economics, or unusually strong disclosure in the next diligence round. Public
              evidence today does not clear that bar, so the right stance is to keep Clip on the list, but underwrite it
              as a disclosure-gated opportunity rather than a clear buy.
            claimRefs:
