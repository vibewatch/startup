  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization stack
        blocks:
          - type: paragraph
            body: >-
              Clip no longer presents as a single dongle reader business. Across its current public surface, the company
              sells card-present acceptance, online checkout, payment links, merchant account balances, working-capital
              loans, inventory tools, and several hardware terminals. The core listed monetization anchor is still
              transaction pricing: Clip repeatedly publishes a 3.6% + IVA headline fee for regular sales, while
              installment plans add a bank surcharge that can push the all-in fee materially higher at longer tenors.
              That makes payments the recurring engine, but not the only one. Hardware is sold up front at low
              promotional prices, Link de Negocio is free to launch and monetized only when payments run through it,
              Clip Cuenta is free on an explicit-fee basis but deepens settlement capture, and Prestaclip monetizes
              through a fixed charge plus IVA. The GTM split is also visible in pricing: low-end merchants can
              self-serve through the web store and no-rent product pages, while larger merchants above MXN50,000 in
              monthly card volume are routed to enterprise sales and tailored pricing. In practice, revenue quality
              depends on how much GPV lands in repeat transaction fees versus lower-visibility lines such as hardware or
              merchant credit.
