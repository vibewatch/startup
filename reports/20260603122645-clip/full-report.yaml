              businesses, microenterprises, PyMEs, large companies, and online stores, then go one level deeper into
              food-and-beverage, retail, and service verticals. That breadth matters because it shows Clip is trying to
              own the long tail of Mexican commerce while still building lanes for more complex, higher-ticket
              merchants. The self-serve and smaller-business motion is visible in app-led products like payment links,
              QR, and checkout, while Clip para Empresas creates a separate motion for merchants processing roughly MXN
              50k-60k or more in monthly card volume. The resulting customer map is structurally attractive: independent
              merchants, restaurants, clinics, beauty and home-service operators, ecommerce sellers, and larger
              multisite companies can all start inside the same ecosystem and then adopt additional tools. The main
              caveat is that Clip publicly markets many target segments but does not publish revenue mix or
