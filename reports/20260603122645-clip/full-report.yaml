      - number: '1.3'
        title: Funding history, investor base, and capital-structure implications
        blocks:
          - type: paragraph
            body: >-
              Clip's financing history is unusually visible for a private Mexican fintech and is strong enough to anchor
              later chapters. The 2024 round is the cleanest supported event: Clip and Morgan Stanley both said the
              company secured US$100 million from Morgan Stanley Tactical Value and an unnamed large West Coast mutual
              fund manager, with the valuation held in line with the 2021 Series D. That matters because it shows Clip
              was still able to raise substantial private capital without publicly conceding a down round in a more
              selective funding environment. The 2021 Business Wire announcement remains the canonical unicorn
              milestone, describing a US$250 million raise led by SoftBank Latin America Fund and Viking Global at a
              valuation approaching US$2 billion. Tracxn and LatAmList add evidence of a 2022 debt raise and place
              lifetime capital near US$497 million, but that cumulative figure should still be treated as third-party
              tracker math rather than company-certified disclosure. The named investor set is also strategically
              useful, not merely financial: SoftBank, Viking, General Atlantic, Ribbit, Goldman Sachs, Morgan Stanley,
              Banorte, Visa, and other investors give Clip a deep mix of growth capital, local financial relationships,
              and ecosystem credibility. The two biggest remaining capital diligence asks are the exact cap table after
              the 2024 round and the governance rights associated with both earlier equity holders and newer structured
              or debt providers.
