      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              On externally visible financing, Clip still looks well-backed. The company became a unicorn in 2021 on a
              US$250 million SoftBank/Viking round at a valuation approaching US$2 billion, added a US$50 million
              unsecured three-year revolving facility from Morgan Stanley, J.P. Morgan, and HSBC in 2022, and then
              raised another US$100 million from Morgan Stanley Tactical Value and a large West Coast mutual fund
              manager in 2024 at a valuation described as in line with that Series D. Management framed the 2022
              facility as support for an already solid liquidity position, and LatAmList reported that the CFO said the
              prior financing plus the facility covered financing needs at the time, so an IPO was not necessary then.
              Third-party market-data tracking pushes the lifetime funding number higher still—Tracxn shows roughly
              US$497 million over 11 rounds and about 1,259 employees as of April 2026. That combination matters because
              it implies Clip is funding both product breadth and a meaningful operating-cost base. What remains opaque
              is the most important underwriting link: none of the primary sources reviewed here disclose current cash,
              monthly burn, covenants, or runway after the 2024 raise.
