  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Clip’s operative market is not “all Mexican fintech” and not even “all payments.” The cleanest boundary is
              merchant acceptance and commerce enablement for Mexican micro, small, and mid-sized businesses:
              card-present acceptance through readers, POS devices, and Tap to Pay; remote and social-commerce
              acceptance through links and QR; online checkout and recurring payments for SMEs; and the merchant
              software or financing tools that raise ARPU once acceptance is live. That framing matches Clip’s own
              product architecture, which is organized around helping merchants collect money, settle faster, sell
              remotely, and manage basic business workflows.


              What should stay outside the core boundary is equally important. Enterprise core banking, consumer
              deposits, payroll infrastructure, and purely offline cash transactions that are never digitized do not
              belong inside Clip’s immediate TAM. They matter only when they connect back to merchant activation or
              wallet/card acceptance. Status-quo substitutes remain powerful: cash, legacy bank terminals, bank
              transfers, and incumbent PSPs all solve the same job for merchants that just need to get paid. The market
              therefore has two layers at once: a very large merchant-count opportunity, and a narrower monetizable
              opportunity that depends on whether merchants actually activate digital acceptance and keep using it.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM044
