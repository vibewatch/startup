        title: Architecture and integration surface
        blocks:
          - type: paragraph
            body: >-
              Clip's public technical evidence is stronger than a typical SMB-payments site, but it is still
              integrator-facing rather than infrastructure-deep. The developer portal spells out a modular stack:
              merchants authenticate a Clip account, use APIs for transactions, deposits, and checkout, wire webhooks
              for real-time updates, and can integrate terminals into a point-of-sale flow through the terminal SDK or
              Pin Pad / POS API surfaces. The deposit and transaction APIs are especially relevant because they expose
              the reconciliation model rather than just acceptance; merchants can query receipt-level and
              settlement-level data instead of relying solely on the dashboard. Clip also distributes integrations
              through marketplace listings and its partner directory, which lowers adoption friction for Shopify,
              WooCommerce, WordPress.com, Tiendanube, and PrestaShop merchants. That said, the public material still
              leaves architectural opacity in important places. There is no published system diagram, no public
              changelog for most APIs, and no externally visible availability dashboard. Investors should read the
              developer surface as evidence of a real integration program, but not confuse it with proof of
              production-grade observability or enterprise deployment quality.
