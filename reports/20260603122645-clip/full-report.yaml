disclaimer: >-
  This report-meta artifact is based only on public sources reviewed in the chapter YAMLs as of 2026-06-03. It uses
  official company and investor releases where available and otherwise flags third-party tracker or estimate data
  explicitly. Because Clip remains a private company, valuation and financial judgments are sensitive to undisclosed
  cap-table terms and missing audited operating metrics.
