        title: Trust, settlement, and control layer
        blocks:
          - type: paragraph
            body: >-
              Clip's public trust story rests on a combination of device security claims, card-industry controls, and
              settlement disclosures. The security page says terminals encrypt received data, delete data if tampering
              is detected, do not store card numbers, and support PIN or signature flows, while checkout materials add
              PCI, card-network policy, and Mexican regulatory alignment language. The more interesting product detail
              is how settlement is embedded into Clip Cuenta rather than treated as a separate bank handoff. Clip says
              some domestic card-present Visa and Mastercard chip-and-PIN flows appear immediately in the account
              balance, while American Express, card-not-present links, subscriptions, vales, and checkout settle within
              24 hours. That is a real operating advantage for small merchants, but it also creates complexity because
              payout timing depends on channel and payment type. Public pricing and reliability surfaces are less clean.
              Ecommerce pages repeatedly show 3.6% plus VAT and up to 24 installments, but another terminal FAQ still
              cites 3.5%, and none of the reviewed materials publish a status page, fraud-loss rate, or formal uptime
              SLA. The trust layer is therefore credible, but not yet transparent enough for diligence to stop at
              marketing copy.
