      - number: '4.2'
        title: Unit economics and operating cost drivers
        blocks:
          - type: paragraph
            body: >-
              The public data give enough to sketch the economic bridge, but not enough to underwrite it cleanly. Clip’s
              list take rate is visible; its net take rate after processor, acquirer, interchange, fraud, dispute, and
              support costs is not. Several product promises imply cost load that investors should assume is real even
              if undisclosed: no monthly rent on devices, support available 24/7, bundled connectivity on higher-end
              terminals, immediate or 24-hour settlement, free bank transfers inside Clip Cuenta, and a lending product
              that advances capital before repayment is complete. Those choices make strategic sense because they reduce
              SMB onboarding friction and increase attachment, but they also shift more economics into volume,
              retention, and cross-sell. Hardware looks especially distribution-led: the devices are sold up front, yet
              the public messaging emphasizes fast payback through transaction volume rather than device profitability.
              The credit product is better structured than a pure off-platform loan because eligibility requires Clip
              sales history and repayment can be linked to merchant flows, but the company does not publish default
              curves, approval rates, or realized yield. A comparable regional model exists—MercadoLibre’s SEC filing
              shows how Latin American commerce-fintech ecosystems combine online/offline payments with everyday
              financial services—but Clip keeps the internal segment math private.
