  - id: FR002
    title: Clip risk transmission map
    type: dag
    layout: standard
    summary: How compliance, service, competition, and macro risks flow into trust, margin, lending losses, and valuation.
    data:
      nodes:
        - id: reg
          label: Compliance / regulatory change
          description: Perimeter opacity, Banxico rules, AML and privacy duties
        - id: ops
          label: Service / chargeback friction
          description: Funds transfer issues, disputes, hardware downtime
        - id: credit
          label: Thin-file lending exposure
          description: Alternative-data underwriting and collections risk
        - id: comp
          label: Mercado Pago pressure
          description: Scale, promo pricing, banking ambition, softPOS
        - id: macro
          label: Macro / peso weakness
          description: Weaker activity, financing stress, depreciation bias
        - id: trust
          label: Merchant trust erosion
          description: Support pain and settlement uncertainty
        - id: margin
          label: Take-rate / margin compression
          description: More support cost and lower pricing power
        - id: losses
          label: Credit losses / reserve need
          description: Higher first-loss burden in lending book
        - id: valuation
          label: Valuation and financing pressure
          description: Lower growth quality and less room for execution error
      edges:
        - from: reg
          to: margin
          label: higher compliance cost
        - from: reg
          to: valuation
          label: greater legal uncertainty
        - from: ops
          to: trust
          label: merchant pain
        - from: ops
          to: margin
          label: support and dispute cost
        - from: credit
          to: losses
          label: thinner borrower quality
        - from: losses
          to: valuation
          label: lower unit economics
        - from: comp
          to: margin
          label: price compression
        - from: comp
          to: trust
          label: better rival tools
        - from: macro
          to: losses
          label: weaker merchant cash flow
        - from: macro
          to: valuation
          label: slower growth and cost pressure
        - from: trust
          to: valuation
          label: churn and weaker retention
        - from: margin
          to: valuation
          label: reduced operating leverage
    approximationNotes: >-
      Edges are qualitative and do not assign numerical probabilities or weights. The figure is meant to show causality,
      not a model output.
