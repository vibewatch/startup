        - label: Medium likelihood
          values:
            - tone: negative
              label: PrestaClip credit losses on thin-file merchants
            - tone: negative
              label: Privacy / sensitive-data control failure
            - tone: neutral
              label: Financed hardware partner disputes
        - label: Low likelihood
          values:
