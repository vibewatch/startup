  - id: FV001
    title: Recommendation Logic
    type: flow
    summary: >-
      The recommendation is driven by a strong business and real financing resilience on one side, offset by a
      disclosure discount and a premium implied multiple on the other.
    data:
      nodes:
        - id: n1
          label: Business quality
          detail: Merchant reach, product breadth, and payments profitability are real strengths.
        - id: n2
          label: Financing signal
          detail: 2024 round preserved the $2B mark instead of taking a down round.
        - id: n3
          label: Disclosure quality
          detail: No audited financials, no public cap table, and inconsistent database funding histories.
        - id: n4
          label: Market comp test
          detail: Public LatAm payment comps trade mostly below Clip's implied multiple.
        - id: n5
          label: Valuation assessment
          detail: $2B looks defensible only in an execution-heavy upside case.
        - id: n6
          label: Recommendation
          detail: Research-more / track until price or disclosure improves.
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CV015
      - CV016
      - CV020
      - CV024
      - CV030
  - id: FV002
    title: Valuation Sensitivity
    type: bar
    summary: >-
      The current $2B mark sits above most public-comp translation points and requires a premium multiple against the
      only public revenue estimate available.
    approximationNotes: >-
      Values translate the $173M public revenue estimate into valuation outcomes under different sales multiples; they
      are not management guidance.
    data:
      items:
        - label: 4x downside public band
          value: 692
        - label: 6x disciplined base band
          value: 1038
        - label: 7.6x Nu public premium
          value: 1315
        - label: 8x strong private growth band
          value: 1384
        - label: 10x optimistic private premium
          value: 1730
        - label: 11.6x current Clip mark
          value: 2000
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV035
      - CV036
      - CV042
  - id: FV003
    title: Valuation / Return Range
    type: range
    summary: >-
      The scenario range shows that current buyers need the bull case to justify full valuation, while the base case
      still prices below the current headline mark.
    approximationNotes: >-
      Fair-value ranges are scenario estimates tied to public-comp translation and Clip's estimated 2024 revenue rather
      than to audited company forecasts.
    data:
      items:
        - label: Bear fair value (USD M)
          low: 700
          mid: 850
          high: 1000
        - label: Base fair value (USD M)
          low: 1000
          mid: 1300
          high: 1600
        - label: Bull fair value (USD M)
          low: 1800
          mid: 2100
          high: 2400
        - label: Gross value / $2B entry (x)
          low: 0.35
          mid: 0.65
          high: 1.2
    claimRefs:
      - CV018
      - CV019
      - CV021
      - CV041
      - CV042
  - id: FV004
    title: Investment KPIs
    type: kpi
    summary: >-
      Clip scores well on market and product relevance but poorly on disclosure quality and only middling on valuation
      discipline at the current price.
    data:
      items:
        - label: Market opportunity
          value: 8
          detail: Mexico's cash-to-digital conversion still offers large runway.
        - label: Product breadth
          value: 7
          detail: Payments, POS, software, credit, and online tools broaden monetization options.
        - label: Merchant reach
          value: 8
          detail: Official materials position Clip as the largest merchant-served platform in its home market.
        - label: Profitability proof
          value: 6
          detail: Core payments are reportedly profitable, but full-company audited profitability is not public.
        - label: Disclosure quality
          value: 3
          detail: Public evidence still lacks audited statements, cap-table detail, and reconciled funding history.
        - label: Valuation discipline
          value: 4
          detail: The current mark implies a premium multiple versus most public comps.
        - label: Financing overhang
          value: 4
          detail: Several hundred million dollars of cumulative capital likely sit ahead of a new buyer in the waterfall.
    claimRefs:
      - CV017
      - CV024
      - CV030
      - CV039
      - CV040
