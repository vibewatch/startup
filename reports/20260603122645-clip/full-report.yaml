      - number: '2.5'
        title: Contradictory Estimates Preserved and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The most important contradiction in Clip’s market analysis is that public sources describe different
              things. INEGI provides the cleanest merchant-count denominator. Banxico provides the cleanest official
              card-flow and e-commerce-flow denominator. Vendor studies provide directional digital-payments and
              e-commerce forecasts. None of these are wrong, but none can be turned into a precise Clip SAM or SOM
              without management data on active merchants, active devices, GPV, or cohort take-rates.


              That means the right underwriting stance is discipline rather than false precision. A count-based SAM
              explains why Mexico is attractive for a merchant-acquirer serving fragmented SMBs. Banxico explains why
              payment volume is already large enough to matter and still growing. Stanford and the CoDi evidence explain
              why adoption friction and cash persistence still cap conversion. Until Clip discloses active merchants,
              active terminal intensity, and payment volume by channel, investors should treat any precise share claim
              as a modeling assumption rather than a verified fact. The chapter therefore preserves the sizing spread on
              purpose and recommends diligence centered on active-merchant behavior, not just total installed devices or
              a generic “payments TAM.”
            claimRefs:
              - CM017
              - CM022
              - CM035
              - CM039
              - CM045
              - CM049
              - CM050
              - CM051
              - CM052
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Why Merchant Counts Matter More Than a Generic “Payments TAM”
            body: >-
              Clip wins merchants one activation at a time. The broadest payments-market numbers prove Mexico is large,
              but they do not reveal how many merchants are reachable, active, or economically attractive. For
              underwriting, the count and behavior of merchant cohorts is the more decision-useful lens.
            calloutType: insight
            claimRefs:
              - CM007
              - CM017
              - CM022
              - CM045
              - CM049
              - CM051
          - type: callout
            title: Cheap Devices Do Not Guarantee Usage
            body: >-
              The Stanford evidence is directly relevant to any Clip growth model: giving merchants low-cost hardware is
              not enough. Setup support, staff training, and customer communication meaningfully change the activation
              curve. That makes distribution quality and merchant-success operations part of the moat—not just device
              price.
            calloutType: risk
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM048
          - type: callout
            title: Regulatory Relief Could Help Adoption but Add Earnings Volatility
            body: >-
              If interchange fees are capped, small-ticket acceptance could become easier to sell to micro merchants.
              But the same reform could force repricing across the ecosystem. Combine that with incomplete open finance
              and the policy outlook is more supportive for adoption than for easy forecasting of unit economics.
            calloutType: risk
            claimRefs:
              - CM033
              - CM034
              - CM048
          - type: callout
            title: Treat Clip SOM as Undisclosed Until Active Merchants and GPV Are Verified
            body: >-
              The company clearly has scale, but current public evidence stops short of a defensible share calculation.
              A merchant-footprint proxy is helpful context, not a substitute for active merchant, active device, or GPV
              disclosures. The chapter therefore uses the footprint only as a directional SOM proxy.
            calloutType: assumption
            claimRefs:
              - CM005
              - CM045
              - CM049
              - CM050
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Clip should not be benchmarked against only one reader vendor. The current Mexican field splits into at
              least four classes. First are direct self-serve acquisition rivals that can win the same small merchant at
              sign-up: Mercado Pago Point and SumUp both market easy onboarding, visible transaction pricing, and no
              monthly terminal rent. Second are online-first local gateways such as Conekta, which compete less on
              hardware and more on checkout, payment links, cash references, SPEI, and other merchant acceptance rails.
              Third are larger omnichannel or enterprise-oriented infrastructures such as Openpay and Kushki. They are
              less obviously a tiendita card-reader substitute, but they matter as soon as a merchant wants gateway
              depth, BBVA-backed trust, cross-border or regional reach, or online and offline orchestration on one
              platform. Fourth are adjacent substitutes and likely entrants: PayPal now looks more relevant as a
              regulated wallet and merchant-payments actor than as an actively marketed Mexico SMB terminal stack, while
              traditional bank TPVs and internal build remain real but under-documented in the retained public set. This
              is why the known set needs refinement: Mercado Pago, Conekta, Openpay, Kushki, and SumUp are current,
              observable pressure points; PayPal Here is legacy; and bank-owned TPVs are a genuine but still partially
              unresolved layer.
            claimRefs:
