  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Qualitative maturity map across Clip modules based on public evidence depth, launch timing, and integration
      friction.
    data:
      columns:
        - Public maturity
        - Visible strength
        - Main caveat
      rows:
        - id: reader-core
          label: Reader / terminal family
          values:
            - Mature
            - Multiple current devices cover phone-paired, portable, countertop, and enterprise-counter use cases
            - Public scale and failure data by device line are absent
        - id: remote-payments
          label: Link + Checkout
          values:
            - Mature
            - No-code links, plugins, and API checkout cover social commerce and ecommerce
            - Public conversion, chargeback, and uptime data are absent
        - id: tap-to-pay
          label: Tap to Pay phone-native acceptance
          values:
            - Expanding
            - Lets merchants accept contactless payments without separate hardware
            - Android public marketing still shows a narrow amount band and limited technical detail
        - id: settlement-account
          label: Clip Cuenta settlement layer
          values:
            - Mature
            - Free account, CLABE, transfers, and channel-specific immediate / 24h settlement logic are documented
            - Complex payout rules by payment type need a cleaner public matrix
        - id: enterprise-pos
          label: Clip Empresas / Pin Pad
          values:
            - Recent rollout
            - Direct POS API integration targets higher-volume chains and self-service lanes
            - Few external proofs of live enterprise deployments
        - id: plugin-ecosystem
          label: Ecommerce plugin ecosystem
          values:
            - Active but mixed
            - Marketplace presence and 2026 plugin maintenance show ongoing work
            - Marketplace reviews show stability and seller-protection complaints
    approximationNotes: >-
      Maturity is qualitative and based on reviewed public sources, not on confidential merchant adoption or
      release-velocity data.
    claimRefs:
      - CE002
      - CE006
      - CE023
      - CE024
      - CE035
      - CE036
      - CE040
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Clip's customer journey starts with a broad SMB or independent-merchant acquisition surface and expands into more
      operationally embedded payment and software workflows.
    data:
      items:
        - id: discover
          label: Discover
          actor: Merchant owner / admin / association member / partner-referred business
          description: >-
            Merchants encounter Clip through direct app or terminal discovery, association campaigns, software partners,
            or vertical programs tailored to specific business types.
          channels:
            - Homepage / device pages
            - App stores
            - CANACINTRA / CCE programs
            - Siigo / Invisalign channels
        - id: onboard
          label: Onboard
          actor: Owner or finance / operations lead
          description: >-
            Smaller merchants can register from the app in minutes, while higher-volume accounts can route into Clip
            para Empresas for tailored pricing and integration support.
          channels:
            - App self-serve signup
            - Clip para Empresas sales
            - Partner referrals
        - id: accept-payments
          label: Accept payments
          actor: Merchant staff / solo operator
          description: >-
            The first use case is usually card acceptance, payment links, QR, checkout, or smartphone tap-to-pay in the
            merchant's native selling environment.
          channels:
            - Reader / terminal
            - Payment links
            - QR / checkout
            - Tap to Pay Android
        - id: expand
          label: Expand workflow
          actor: Merchant owner / manager
          description: >-
            Once active, merchants can add catalog, subscriptions, service payments, airtime, loans, or vertical
            software integrations such as Wansoft for restaurant operations.
          channels:
            - Catalog / dashboard
            - Loans / services
            - Wansoft by Clip
            - Ecommerce plugins
        - id: deepen
          label: Deepen / retain
          actor: Merchant owner / channel manager
          description: >-
            Retention should improve when Clip becomes embedded in operations or when channel programs keep merchants in
            the ecosystem, but public renewal and cohort metrics remain undisclosed.
          channels:
            - Enterprise support
            - Association or partner programs
            - Settlement / support experience
            - Multi-product usage
