      - number: '7.2'
        title: Operational, fraud, and service risk
        blocks:
          - type: paragraph
            body: >-
              Clip’s operational risk is less about whether it has security marketing and more about who absorbs
              friction when merchant workflows break. The company highlights anomaly monitoring, suspicious-transaction
              validation, encryption, and a promise not to store card data, but the legal terms show that first-loss
              exposure can still flow back to the merchant base quickly. Merchants can be debited for chargebacks,
              refunds, and penalties, and Clip reserves broad direct-chargeback rights with limited recourse windows.
              The January 2026 cashback program is revealing because it reimbursed only one favorable dispute and only
              up to MXN 1,400, which signals that coverage is tactical rather than structural. Public complaint surfaces
              reinforce the point. DXR’s 2026 review aggregation shows unusually weak sentiment for a merchant-finance
              app, while Downdetector categories span funds transfer, login, payments, QR, and website issues. Clip’s
              own warranty policy further says uninterrupted reader operation is not guaranteed and valid repairs can
              take seven business days after receipt. The public record therefore supports a meaningful service-quality
              and chargeback-management risk: Clip may control some fraud vectors, but it does not publicly disclose
              reserve rates, dispute win rates, outage frequency, or CFDI support metrics that would show whether
              merchant pain is contained at scale.
