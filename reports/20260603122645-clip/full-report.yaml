            body: >-
              Clip's public quality signal is positive on the surface but mixed once third-party review data and
              complaint text are layered in. Apple's Mexican App Store listing is very strong at 4.9 out of 5 from 126
              thousand ratings, and Google Play remains solid at 4.3 from 62.1 thousand opinions. Those are meaningful
              footprints for a merchant app, not a niche utility. However, DXR AI's 2026 review aggregation is more
              cautious, with a 5.3 out of 10 score, 56% positive sentiment, and 42% negative sentiment. The
              category-level weaknesses it surfaces around payments, deposits, cards, app speed, and account access fit
              the concrete complaints visible on Google Play, where recent users describe broken barcode scanning after
              updates, unresolved support waits, unwanted card-detail persistence, and repeated app logouts. This does
              not invalidate the product; it does mean that public retention evidence is proxy-heavy and operationally
              noisy. Clip promises daily or immediate settlement, 24/7 support, and strong security controls, but it
