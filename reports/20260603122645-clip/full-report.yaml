      - number: '8.3'
        title: Bull, base, and bear valuation range
        blocks:
          - type: paragraph
            body: >
              The scenario range should be anchored on what would need to be true for Clip to earn, sustain, or lose the
              current $2 billion mark. In the bull case, Clip would need to prove that the payment business
              profitability noted by management scales to the whole company, that the revenue base is materially above
              the $173 million third-party estimate, and that audited disclosure shows healthy take-rate, gross-profit,
              and cohort-retention dynamics. In that world, a high-single-digit to low-double-digit sales multiple could
              still be arguable because Mexico's cash-digitization runway remains large, many merchants were previously
              cash-only, and Clip could compound software, credit, and embedded-finance monetization on top of payments.
              That is the path where the current mark works.


              The base case is less forgiving. If the $173 million revenue estimate is roughly right and Clip remains a
              strong but still partly opaque private payments platform, a 6x-8x underwriting band produces roughly
              $1.0-1.4 billion of value. That is below today's mark, but not disastrously below it; it implies the
              company is good, while the current entry price is demanding. The bear case is harsher: if revenue quality
              disappoints, if the next priced round lands below the 2024 mark, or if private fintech multiples gravitate
              toward StoneCo, PagSeguro, dLocal, or MercadoLibre-style public comparables, the fair-value range can
              compress into roughly $0.7-1.0 billion. That is why the recommendation is price-sensitive. The downside is
              not driven by a broken product thesis; it is driven by the risk of paying premium-public-market multiples
              before Clip has provided premium-public-market evidence.
