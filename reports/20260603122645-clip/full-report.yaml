      - number: '8.4'
        title: Entry discipline, thesis-break triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >
              The practical investment conclusion is straightforward: Clip is worth continuing to diligence, but not
              worth underwriting blindly at $2 billion. Entry discipline should start with four requests. First, audited
              2024 and 2025 financials, including TPV, take rate, gross profit, net revenue, and cohort behavior,
              because the current public revenue signal is a database estimate rather than an audited number. Second, a
              round-by-round funding reconciliation and current cap table, because Tracxn's $497 million / 11-round
              history does not match GetLatka's much narrower $150 million / two-round capture. Third, the preference
              stack and anti-dilution structure, because public evidence already points to several hundred million
              dollars of cumulative capital and therefore a non-trivial liquidation waterfall. Fourth, proof that
              profitability scales beyond the core payments line, since management's June 2024 comments stop just short
              of whole-company profitability.


              Those diligence asks translate into clear thesis-break triggers. A down round below the 2024 price,
              audited revenue materially below the public estimate, or evidence that gross profit conversion is much
              weaker than implied would all challenge the current mark. Conversely, a new priced round above $2 billion
              backed by audited revenue, or public disclosure showing materially stronger recurring revenue and margin
              quality, would move the recommendation upward. Until then, the highest-quality conclusion is not "avoid"
              and not "buy". It is that Clip remains strategically interesting, but investors should only pay the
              current headline price if they can close the disclosure gap that public sources leave open.
