        title: Product suite and merchant workflows
        blocks:
          - type: paragraph
            body: >-
              Clip's current public product map covers far more than entry-level card readers. On the hardware side, the
              site and manuals show a ladder from the Bluetooth-based Plus 2 into self-contained smart terminals such as
              Pro 2, Ultra, Stand 2, and the enterprise-oriented Pin Pad. On the software side, Clip markets payment
              links, digital checkout flows, a business account with instant balance visibility for some card-present
              flows, and lending offers tied to merchant activity. Tap to Pay on iPhone and Android extend the stack
              even further by turning the merchant phone itself into the acceptance device. That matters strategically
              because Clip is selling an operating workflow, not just acceptance hardware: a merchant can start with an
              app-linked reader, add payment links for remote sales, adopt checkout for ecommerce, move settlement into
              Clip Cuenta, and then pull forward working capital through Clip Capital. The product suite is therefore
              coherent around one job-to-be-done: help Mexican SMBs accept, reconcile, and reuse payment proceeds across
              physical and digital channels without bank-style contracts or separate vendors for every step.
