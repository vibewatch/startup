      - number: '3.3'
        title: Switching costs, trust signals, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Clip's moat is real, but the retained public evidence points to a narrower moat than a simple
              market-leader story would imply. The strongest durable wedge is local workflow breadth for SMBs:
              card-present hardware, POS operations, Tap to Pay, ecommerce checkout, immediate funds, and lending all
              under one Mexico-focused umbrella. That can create meaningful switching cost when a merchant standardises
              staff routines, settlement flows, and operational tools around one provider. The problem is that much of
              the visible surface area is not exclusive. Mercado Pago adds wallet, account, and lending leverage;
              Openpay leans on BBVA trust, certifications, and an enterprise customer roster; Kushki is moving more
              decisively into Mexican present-payments after Billpocket; and Conekta plus Openpay both strengthen the
              non-card rails that matter in a still-mixed cash-and-digital economy. Public data is thin on realized
              pricing, active merchant counts, retention, and win-loss rates, so the best supported conclusion is
              cautious: Clip's moat looks stronger in bundled local execution than in raw pricing power. Multi-homing
              remains plausible, especially for merchants that can separate terminal needs from online gateway or
              treasury needs. That keeps commoditization risk elevated even if Clip remains one of the broadest SMB
              offers in the market.
