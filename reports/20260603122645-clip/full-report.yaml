      - number: '1.2'
        title: Founders, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Clip's founder story is reasonably well supported, but the public governance picture is thinner than the
              operating-bench picture. WSA and Tracxn both identify Adolfo Babatz and Vilash Poovala as the 2012
              co-founders, while the official “Sobre nosotros” page keeps Babatz front and center as Founder and CEO.
              Independent profile pages from Endeavor, The Org, and Clay also reinforce Babatz's path from PayPal and
              prior investing roles into founding Clip, which helps explain the company's payments-market fit and why
              investors still frame the business around him personally. Beyond the founder, the official leadership page
              does provide a meaningful current bench: finance, operations, external affairs, product and technology,
              research, people, software, payments go-to-market, and financial-services leads are all named. That is
              enough to conclude that Clip is no longer a one-person commercial story. What is not visible in the
              retained public pack is a current board roster, independent-director slate, or an easy public read on
              post-2024 governance rights across the shareholder base. In practical diligence terms, leadership
              credibility is supported, founder key-person dependence remains material, and formal governance
              transparency is still a follow-up item rather than a verified strength.
