      - number: '7.4'
        title: Execution, dependencies, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The execution question for Clip is whether one organization can keep payment acceptance, consumer-grade
              app reliability, merchant lending, enterprise tooling, and partner-dependent hardware financing all inside
              the same control envelope without a visible operating miss. Public pages show the company now spans
              readers, softPOS, payment links, checkout, catalog, bill pay, recharges, enterprise branch management,
              digital accounts, and loans. That breadth increases product-surface risk even before adding external
              dependencies. Belvo matters to credit decisioning and recurring collections. CAVIMEX matters to financed
              equipment delivery and warranty resolution. Card networks, settlement rails, app stores, and regulators
              each impose separate rules that can create downtime, margin pressure, or customer friction. The public
              funding story is not a distress signal — Clip raised US$100 million in 2024 and kept its unicorn valuation
              — but the flat valuation and only partial profitability language mean the market is not obviously giving
              management unlimited time to prove lending economics, service quality, and enterprise-grade controls
              simultaneously. For investors, the thesis should break on measurable events: a real enforcement action
              that narrows permitted operations, a disclosed credit-loss problem, sustained service deterioration around
              funds transfer or disputes, or a competitive reset in Mexico that forces Clip to buy growth faster than
              its 2024 round and operating leverage can support.
