  - id: FR001
    title: Clip risk heatmap
    type: matrix
    layout: standard
    summary: Residual Clip risks positioned by likelihood and impact using only publicly supportable evidence.
    data:
      columns:
        - Critical impact
        - High impact
        - Moderate impact
      rows:
