      - number: '3.2'
        title: Capability, pricing, and channel comparison
        blocks:
          - type: paragraph
            body: >-
              The biggest mistake in comparing Clip is to collapse card-present, online gateway, and merchant-operating
              workflows into one undifferentiated score. Clip's own public surface is unusually broad for a Mexico SMB
              fintech: it markets readers and TPVs, a POS kit with printer and cash box, Tap to Pay on Android,
              ecommerce checkout, immediate settlement into Clip Cuenta, and business loans. That makes it broader than
              a pure payment gateway. But breadth is not the same thing as lowest headline price. Clip's published
              standard MDR is 3.6% + IVA, while Mercado Pago Point and SumUp both show 3.50% + IVA, and Conekta's online
              SMB card plan starts lower at 3.4% + MXN3 + IVA. Clip does show a 2026 acquisition promotion at 2.99% +
              IVA + MXN1, but the legal terms make clear that this is a targeted first-reader promotion rather than the
              durable base fee card. By contrast, Openpay and Kushki compete less with a transparent self-serve price
              card and more with BBVA-linked or enterprise-style omnichannel packaging. In practical terms, Clip's
              differentiation is strongest when the merchant wants one local operator for terminal, lightweight POS, Tap
              to Pay, online checkout, and settlement—while Conekta, Openpay, and Kushki become more dangerous as
              acceptance complexity, alternative rails, or enterprise requirements rise.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
