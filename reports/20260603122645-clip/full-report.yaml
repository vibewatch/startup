      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The secular tailwind for Clip is real. Establishment-level cash use fell sharply between 2018 and 2023,
              while cards and electronic transfers moved up. Banxico then reported another year of double-digit
              card-growth in 2024, and both Banxico and 2026 industry sources show contactless and digital-channel usage
              still accelerating. On the supply side, nonbank acquirers and payfacs are expanding acceptance faster than
              banks, which favors operators like Clip that compete on distribution speed, simple onboarding, and
              software-led merchant acquisition rather than branch infrastructure. Tap to Pay should reinforce that
              pattern by lowering hardware friction for small merchants who want to start accepting cards immediately.


              The bear case is equally concrete. Mexico is still heavily cash-oriented for small-ticket purchases and
              has not solved merchant enablement just by lowering device prices. Stanford’s Guadalajara experiment is
              especially relevant here: free hardware by itself produced weak retention, while onboarding support and
              customer promotion made a major difference. At the same time, CoDi’s adoption remains below initial
              expectations, which means account-to-account QR rails are not yet displacing cards or cash at the speed a
              pure-policy narrative might imply. Regulatory change is also double-edged. Interchange reform could help
              small-ticket acceptance, but open finance remains incomplete, and competition from Mercado Pago and other
              scaled networks raises customer-acquisition pressure.
            claimRefs:
