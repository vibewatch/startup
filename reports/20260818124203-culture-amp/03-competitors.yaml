chapter:
  number: 3
  title: Competitors
  summary: Culture Amp competes in a crowded field split between specialist employee-experience platforms, broader performance and people suites, and incumbent HCM vendors that can bundle listening into a wider contract. The clearest direct comparators are Qualtrics EX, Microsoft Viva Glint, and Workday Peakon at the enterprise end, with Lattice, 15Five, Leapsome, Engagedly, Personio, and Rippling widening the field through manager workflows or broader HR platforms. The central competitive question is whether Culture Amp’s benchmark depth and people-science positioning are strong enough to preserve pricing power against suite bundling and AI feature convergence.
sections:
- id: landscape-and-competitor-classes
  title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
  body: Culture Amp does not compete against one homogeneous set. The direct specialist comparison set is Qualtrics EX, Microsoft Viva Glint, and Workday Peakon because all three sell structured listening, analytics, and action workflows to large employers. The adjacent but increasingly relevant specialist set is Lattice, 15Five, Leapsome, and Engagedly, each of which combines engagement with goals, feedback, performance, or broader talent workflows. Then there are suite players and substitutes such as SAP, Rippling, and Personio that can make employee feedback one capability inside a much larger HR or workforce platform. That matters because buyers can solve the “employee experience” job with a specialist listening layer, a performance-first suite, or a full HCM stack depending on segment and procurement preferences. Culture Amp’s benchmark depth and people-science framing clearly differentiate the brand, but the functional overlap is large enough that the buyer often sees a capability
    set, not a category moat.
  claimRefs:
