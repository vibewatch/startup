  evidenceGaps:
  - type: missing-source
    severity: material
    topic: win-rate-gap
    missingEvidence: Segmented win/loss data versus Qualtrics, Glint, Peakon, Lattice, and suite competitors.
    whyItMatters: Competitive positioning is ultimately decided by actual procurement outcomes, not marketing-page overlap.
    diligencePath: Request CRM win/loss analysis by segment, deal size, and incumbent system of record.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: discounting-gap
    missingEvidence: Realized contract pricing and discount bands across enterprise, midmarket, and renewal motions.
    whyItMatters: List pricing overstates true price discipline and can mislead valuation assumptions about gross retention or ACV.
    diligencePath: Request sample order forms, quote histories, and pricing waterfall data.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: minor
    topic: independent-testing-gap
    missingEvidence: A neutral benchmark or evaluator comparing feature depth, benchmark quality, and admin burden across the main vendors.
    whyItMatters: Public product pages are self-authored and do not prove product superiority.
    diligencePath: Use customer reference calls, analyst notes, or hands-on sandbox trials to score product depth.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: minor
    topic: multihoming-stickiness
    missingEvidence: Data on how often customers run Culture Amp alongside Workday, Microsoft, SAP, or Rippling and for how long.
    whyItMatters: If multihoming is common and sticky, specialist-category risk is lower than bundle fear implies.
    diligencePath: Request install-base overlap and renewal data by adjacent platform.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
