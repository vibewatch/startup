    - Tight tie to HCM, retention, DEI, and transformation workflows
    - Best leverage often comes when Workday is already system of record.
  - - Lattice
    - Adjacent specialist
    - Modular SaaS with published seat pricing
    - Midmarket to enterprise
    - Strong manager workflows and modular packaging
    - Less obvious benchmark moat than Culture Amp.
  - - 15Five
    - Adjacent specialist
    - 3,000+ companies trust it
    - SMB / midmarket / manager-led programs
    - Deep performance and manager-effectiveness motion
    - Brand centers on manager performance more than benchmark listening.
  - - Leapsome
    - Adjacent broader people platform
    - 2,000+ organizations on AI-native HR platform
    - Midmarket and growth companies
    - Unified HRIS, recruiting, talent, and AI agents
    - Broader scope can dilute EX specialization.
  - - Engagedly
    - Adjacent specialist
    - Modular platform with annual minimum pricing
    - Midmarket
    - Bundles engagement, performance, mentoring, compensation, and services
    - Vendor-authored comparisons make external validation thinner.
  - - SAP SuccessFactors
    - Incumbent suite
    - Part of SAP HCM and employee experience stack
    - Enterprise
    - Suite bundling with broader HR and ERP estate
    - EX is one module among many, not always the deepest listening specialist.
