- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Commercial model
  - Public pricing signal
  - Included / emphasized capabilities
  - Implication
  rows:
  - - Culture Amp
    - Quote-led enterprise pricing
    - No self-serve list pricing
    - CultureOS, AI Coach, HRIS and Slack/Teams integrations
    - Signals enterprise focus but reduces transparency for smaller buyers.
  - - Microsoft Viva
    - Bundle and add-on pricing
    - $2, $6, and $12 user/month bundles; Glint has 50-seat minimum
    - Employee communications, insights, analytics, employee feedback
    - Easy upsell inside Microsoft estate and strong bundling leverage.
  - - Qualtrics
    - Request pricing with usage metrics
    - Pay for planned usage / interaction model
    - Unified XM platform, segmentation, automation, integrations
    - Commercial complexity fits enterprise programs more than lightweight teams.
  - - Lattice
    - Modular seat-based pricing
    - $10 performance, $8 goals, $4 engagement modules
    - Performance, goals, engagement, AI agent, analytics
    - Transparent packaging helps modular land-and-expand.
  - - 15Five
    - Tiered per-user pricing
    - Starts at $4/user/month
    - Engage, Perform, Total Platform
    - Midmarket-friendly and manager-workflow oriented.
  - - Engagedly
    - Tiered modular pricing with minimums
    - $7,500/year minimum plus add-on suites
    - Engagement, performance, mentoring, compensation, services
    - Smaller buyers can price quickly but services and minimums still matter.
  notes: Public list prices are pre-discount list signals only; enterprise contracts and bundle discounts can materially change realized pricing.
