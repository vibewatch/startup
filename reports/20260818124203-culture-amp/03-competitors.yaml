- id: distribution-trust-and-switching-costs
  title: Distribution power, trust posture, and switching-cost realities
  body: 'Distribution is where the largest incumbents gain their leverage. Workday’s investor site says more than 11,500 organizations and over 65% of the Fortune 500 trust Workday, Microsoft bundles employee experience into the broader Viva and Microsoft 365 stack, and SAP sells employee experience as part of SuccessFactors and HCM. Those positions do not automatically beat Culture Amp on user experience or benchmark context, but they do make the incumbent proposal easier to fund from existing budgets and vendor relationships. Midmarket challengers fight on different terrain. Lattice, 15Five, Engagedly, and Leapsome emphasize modular adoption, transparent packaging, and unified people workflows. That can lower switching friction for a buyer that wants one system for feedback, performance, and development. The practical result is that Culture Amp faces both displacement risk from suites above it and scope-creep risk from workflow platforms below it. Buyers can also multi-home: Lattice explicitly
    references Workday as the system of record while powering performance and goals, which shows that interoperability reduces all-or-nothing winner-take-all dynamics.'
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
