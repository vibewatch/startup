- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Low global engagement
    - positive for demand
    - current
    - Persistent disengagement sustains spend on listening and action tools.
    - Test whether budgets expand despite macro cost scrutiny.
  - - Manager engagement slump
    - positive for demand / negative for execution
    - current
    - Creates urgency for manager coaching and retention tools.
    - Ask which products best monetize manager pain.
  - - AI adoption wave
    - positive
    - near term
    - Vendors can sell summaries, recommendations, and coaching overlays.
    - Separate real workflow value from AI feature inflation.
  - - Suite bundling from Microsoft, Workday, SAP
    - negative for specialists
    - current
    - Standalone vendors risk price compression or displacement.
    - Measure win rates against suite incumbents.
  - - Privacy and confidentiality thresholds
    - negative friction
    - current
    - Enterprise programs need enough respondents and careful governance.
    - Ask how confidentiality rules affect smaller-team adoption.
  - - Integration and change-management burden
    - negative friction
    - current
    - Software purchase alone rarely solves engagement-action gaps.
    - Audit implementation time, services attach, and admin burden.
  - - Continuous listening vs annual surveys shift
    - positive for richer tools
    - current
    - Favors platforms that connect signals to action and workflow.
    - Check actual manager usage, not just survey launches.
  - - Budget overlap with HCM, collaboration, and BI
    - mixed
    - current
    - Can expand total spend but also blur category boundaries.
    - Clarify who owns the budget and renewal motion.
  notes: Direction refers to specialist EX-platform demand, not to HR software generally.
