  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-unclear
    missingEvidence: A public or paid analyst report that isolates employee-experience software spend from adjacent HCM and collaboration categories.
    whyItMatters: Without a cleaner market boundary, valuation work has to rely on proxy lenses rather than a directly observed SAM.
    diligencePath: Obtain Gartner, IDC, or similar market reports and map specialist EX revenue to adjacent suite categories.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-size-opacity
    missingEvidence: Segment-level contract values, ACVs, and deployment durations for enterprise and midmarket EX buyers.
    whyItMatters: Buyer quality and sales efficiency depend on real contract size and implementation burden, not just seat minimums and marketing pages.
    diligencePath: Request internal pipeline by segment, implementation-time data, and sample redacted order forms.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: minor
    topic: services-attach
    missingEvidence: Attach-rate data for consulting, people-science services, or implementation support.
    whyItMatters: Software margins and defensibility change materially if a large share of successful deployments depend on services.
    diligencePath: Ask management for services revenue mix and post-launch support staffing.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-growth
    missingEvidence: Independent market-growth estimates that can validate or challenge vendor-authored “tens of billions by 2030” framing.
    whyItMatters: Growth expectations feed multiple assumptions in the valuation chapter, so low-confidence vendor TAMs should be cross-checked.
    diligencePath: Pull independent market-research estimates and compare their category definitions to vendor-authored claims.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
