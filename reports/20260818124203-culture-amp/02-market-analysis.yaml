- id: buyer-user-payer-map
  title: Buyer, user, payer, and the path from HR pain to budget approval
  body: This market is multi-sided. HR leaders usually own the pain statement, but the user and payer map expands quickly. Microsoft Viva Glint describes organization-wide surveys driven by leadership and supported by certified partners, while Workday Peakon pitches retention, DEI, wellbeing, and transformation outcomes to executives who want enterprise change programs rather than one-off feedback tools. Lattice, 15Five, Leapsome, and Engagedly broaden the motion again by tying engagement to 1:1s, goals, feedback, recognition, and manager workflows, which pulls frontline managers and sometimes revenue or operations leaders into the buying process. Culture Amp’s own benchmark and benchmark-report surfaces suggest buyers want context and actionability, not just data collection. In practice, the budget often sits with CHRO or People teams, but adoption requires manager usage, IT or security approval, and executive sponsorship because confidentiality thresholds, integrations, and change-management
    effort all matter. That structure favors vendors that can show workflow depth and integration maturity rather than survey completion rates alone.
