- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Culture Amp
  rows:
  - - Employee listening / voice of employee
    - Engagement surveys, pulse surveys, lifecycle surveys, confidentiality-safe comment analysis
    - Payroll, benefits admin, ATS
    - CHRO / People Ops
    - Core category anchor and the first landing zone for Culture Amp.
  - - Performance and goals
    - Performance reviews, feedback, goals, development plans, manager coaching
    - Comp-only systems or payroll performance bonuses
    - CHRO with business leaders
    - Critical because Culture Amp now sells beyond surveys into performance and development.
  - - People analytics / retention insight
    - Benchmarking, turnover insight, manager action recommendations
    - General BI tooling without HR workflow context
    - People analytics lead / HR leadership
    - Important differentiator because vendors pitch actionable analytics, not just data storage.
  - - EX within HCM suites
    - Bundled employee voice inside HCM, collaboration, and ERP contracts
    - Core system-of-record transactions themselves
    - HRIT / CIO / procurement
    - Main bundling threat from Workday, Microsoft, and SAP.
  - - Learning and development adjacencies
    - Coaching, career paths, competencies, manager enablement
    - Standalone LMS content libraries
    - L&D / HRBP / business leaders
    - Supports Culture Amp upsell when development data connects to engagement.
  - - Consulting and change services
    - People science advisory, implementation, survey design support
    - Pure technology resale without change support
    - CHRO / transformation office
    - Relevant because enterprise deployments often need services alongside software.
  notes: Included and excluded spend are workflow-based rather than GAAP-defined market categories because public sources describe overlapping suites rather than one clean taxonomy.
