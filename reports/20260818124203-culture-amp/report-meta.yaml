  topStrengths:
    - Real customer and deployment proof across thousands of organizations and multiple verticals.
    - Broad product surface spanning engagement, performance, development, analytics, and AI-guided actioning.
    - Repeated institutional investor support through Series C to Series F.
    - Public trust and security documentation is stronger than that of many private SaaS peers.
  topRisks:
    - Public disclosure is still too thin on gross margin, retention, cap-table terms, and customer concentration.
    - Privacy, confidentiality, and operational reliability matter disproportionately because the platform handles sensitive employee data.
    - Layoffs, ongoing losses, and mixed customer-friction signals keep execution risk elevated.
    - AI-organization litigation and limited public AI-governance detail complicate the premium thesis.
  unresolvedGaps:
    - Gross margin and the split between subscription software and services or consulting revenue.
    - GRR, NRR, logo churn, and contract-length distributions by customer segment.
    - Cap-table preferences, liquidation terms, and true downside protection at the current mark.
    - Customer concentration by account, industry, and geography after the 2025-2026 reset.
    - Incident history, support-capacity metrics, and verified AI-governance evidence.
disclaimer: Public-web diligence only; conclusions should be updated with management data room materials, customer calls, and financing documents before any investment decision.
