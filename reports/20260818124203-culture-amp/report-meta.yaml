companyProfile:
  summary: Culture Amp is a Melbourne-founded private employee-experience software company that sells a multi-module platform across engagement listening, performance reviews, goals, development workflows, people analytics, and AI-guided manager actioning. Public evidence supports real global scale, with more than 6,000 organizations and 25 million employees represented on official surfaces, plus a funding history that culminated in a $100 million Series F at a valuation above $1.5 billion. The business looks strategically relevant in enterprise HR tech, but public underwriting evidence remains incomplete on margins, retention, customer concentration, and cap-table economics.
  foundedDate: '2009-01-01'
  founders:
    - name: Didier Elzinga
      role: Co-founder; former CEO; Executive Chairman
      background: Public materials identify Elzinga as the long-time founding CEO who moved to executive chairman in 2026.
      claimRefs: [CO019]
  foundingLocation: Melbourne, Australia
  headquarters: Melbourne, Australia
  productSummary: Culture Amp sells a people platform that combines engagement surveys, benchmarks, analytics, performance reviews, 360 feedback, goals, development plans, career paths, and AI Coach into one workflow for managers and people teams.
  customerFocus: Mid-market and enterprise employers, people leaders, and globally distributed organizations that need employee-feedback, performance, and development workflows.
  businessModel: Quote-led subscription software with module upsells plus consulting, training, implementation, and customer-success layers.
  stage: Series F / late-stage private
  fundingStatus: Official funding history shows a $20M Series C in 2017, $40M Series D in 2018, $82M Series E in 2019, and a $100M Series F in 2021 at a valuation above $1.5B; independent reporting later indicated a 23.5% markdown implying roughly $1.15B.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO006, CO009, CO011, CO012, CO013, CO019, CE010, CV006]
