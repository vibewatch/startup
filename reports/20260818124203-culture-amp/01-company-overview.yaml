- id: adverse-signals-and-core-diligence-gaps
  title: Adverse signals, operating stress, and what remains unresolved
  body: 'The adverse record is meaningful enough to shape later underwriting. Startup Daily reports that Culture Amp cut about 60 roles in November 2025 and another 70 roles, or roughly 9% of staff, in July 2026 under the new CEO, while the same publication and AFR both describe a slower growth profile and ongoing losses. Trustpilot and TrustRadius add customer and user texture: TrustRadius reviewers praise analytics depth and benchmarking but flag integration friction and usability complexity, and Trustpilot’s visible score is only 3.1 out of 5 from a very small public sample. None of those signals alone break the thesis, but together they show a company balancing genuine category leadership against execution pressure and private-market repricing. The biggest unresolved items are a reconciled current valuation after Blackbird’s write-down, a canonical employee count after multiple rounds of layoffs, the exact current board composition and preference stack, and a clean legal-entity trail
    spanning Australia and the United States. Those gaps are why later chapters should treat Culture Amp as a scaled but disclosure-limited private company rather than a transparently reported near-public asset.'
