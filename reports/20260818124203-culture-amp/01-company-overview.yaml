chapter:
  number: 1
  title: Company Overview
  summary: Culture Amp is a Melbourne-founded employee experience platform that now presents itself as a unified CultureOS spanning engagement, performance, development, and AI-assisted coaching. The public record is strongest on the platform’s global footprint, its 2017-2021 funding cadence culminating in a $100 million Series F at a $1.5 billion-plus valuation, and the January 2026 CEO succession from founder Didier Elzinga to Caroline Rawlinson. The biggest open questions are the exact current cap-table mark after Blackbird’s 2025 write-down, canonical headcount, and a fully reconciled legal-entity and board-governance picture.
sections:
- id: identity-scale-and-footprint
  title: Identity, scale claims, and geographic footprint
  body: 'Culture Amp’s current positioning is broader than a survey point solution. The homepage and pricing page now market a complete CultureOS that combines engagement, performance, development, and AI Coach, while the trust, benchmarking, and company pages reinforce that the platform is sold as enterprise-grade workflow infrastructure rather than a lightweight HR plug-in. The company’s public scale claims are also substantial enough to matter for later chapters: the homepage says 25 million employees across 6,000-plus organizations use the platform, the about page lists 6,000-plus customers, 70.5 thousand-plus surveys launched, 13 million-plus responses, and 594.3 million-plus questions answered, and the benchmarking page says the benchmark layer covers more than one billion survey responses. Those numbers support a real installed base and data-network story, but they are still company-authored metrics rather than audited disclosures. Geographic footprint is better corroborated: careers
    and hub-flexibility pages identify Melbourne as headquarters and list operating hubs across Sydney, San Francisco, New York, Chicago, London, Berlin, and Austin, while the 2022 Berlin-office launch anchors European expansion with dated evidence.'
