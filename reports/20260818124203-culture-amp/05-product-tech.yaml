- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - HRIS ingestion
    - Pull employee records and demographics into the platform
    - Workday and BambooHR and HiBob data connections
    - Stale or misconfigured HRIS data can distort analytics and survey targeting.
  - - Feedback capture and survey layer
    - Collect engagement and experience signals
    - Internal product templates and participation workflows
    - Response quality and anonymity controls are not fully visible publicly.
  - - Performance and development workflows
    - Run reviews and goals and competencies and growth plans
    - Shared employee record and manager workflow adoption
    - Adoption may be uneven by module and manager capability.
  - - AI guidance layer
    - Translate engagement and performance data into coaching and action plans
    - AI Coach plus underlying people-science content
    - Public model architecture and hallucination controls and evaluation methods are not disclosed.
  - - Integration and flow-of-work surfaces
    - Deliver reminders and feedback and downstream actions in tools employees already use
    - Slack and Teams and partner ecosystem
    - Partner changes or sync failures can impair value without Culture Amp owning the system of record.
  summary: Architecture appears intentionally lightweight on source-of-record ownership and heavy on orchestration, analytics, and actioning.
