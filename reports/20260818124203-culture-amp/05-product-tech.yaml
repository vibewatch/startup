  title: Product & Technology
summary: Culture Amp’s product evidence supports a real multi-module people platform rather than a single survey tool. Public materials clearly show engagement, performance, development, AI coaching, and integrations working together, and the trust portal exposes meaningful security-process detail. The main diligence gap is not whether product exists, but how much low-level architecture, reliability, and AI-model detail enterprise buyers can verify without private access.
sections:
- id: platform-scope-and-module-map
  title: Product scope is broad enough to support a platform thesis, not just an engagement-survey thesis
  body: Culture Amp’s public product map is materially broader than the legacy view of the company as an employee-engagement vendor. The Engage product still anchors the suite with survey templates, analytics, benchmarking, and action planning, but the public surface then fans out into performance reviews, 360 feedback, goals, development plans, career paths, competencies, development analytics, and AI Coach. That matters because the platform story is not merely “collect employee sentiment.” It is to gather people signals, connect them to manager workflows, and push action across performance and development loops. The strongest evidence for breadth comes from first-party product pages that describe concrete jobs-to-be-done for managers, people teams, and employees. The downside is that attach rates, product-family revenue mix, and module-level usage are still hidden. So investors can verify scope and workflow intent, but not yet the exact depth of adoption inside each module.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflow-and-integration-architecture
  title: The operating model centers on inbound HRIS data, analytics, and manager actioning rather than a heavy transactional system of record
  body: 'The public technical story is strongest at the workflow and integration layer. Culture Amp’s integrations page explicitly frames the platform around connecting to tools such as Workday, Slack, Gusto, and BambooHR, and the support guide for Workday shows a secure one-way sync into Culture Amp rather than full bi-directional systems orchestration. BambooHR and HiBob marketplace materials reinforce the same pattern: employee data is pulled in automatically, often daily or nightly, to keep employee records fresh for surveys, analytics, and performance workflows. Slack then acts as an in-flow-of-work engagement surface for invitations, reminders, and feedback. This architecture is coherent for a people-insights platform because it lowers data-entry friction and lets Culture Amp sit above systems of record. It also exposes a dependency tradeoff. Culture Amp appears easier to adopt because it does not replace core HRIS, but that means data freshness, demographic hygiene, and partner integrations
    remain mission-critical external dependencies.'
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
