  - FE003
- id: trust-security-and-governance-controls
  title: Trust posture is unusually visible for a private company, though still more process-transparent than architecture-transparent
  body: Culture Amp’s trust portal is one of the stronger public diligence surfaces in this report. The security and data-protection pages go beyond generic reassurance and describe CI/CD security gates, OWASP training, peer review, automated code scanning, threat modeling, secure code review, multi-cloud deployment across AWS and GCP, encryption in transit and at rest, key management, tenancy-level access controls, supplier security assessment, and internal privileged-access controls such as just-in-time provisioning. The Slack app listing independently echoes parts of that posture by describing AES-256 encryption at rest, TLS 1.2+ in transit, strong MFA, logged access, and explicit retention/deletion behavior. Those are real positives because they show a control environment that can plausibly serve enterprise HR data. But the trust record is still stronger on program maturity than on service specifics. Public pages do not give deep uptime commitments, system-topology diagrams, AI-model
    hosting architecture, or detailed incident history. So the trust verdict is positive, but not complete.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: maturity-roadmap-and-product-verdict
  title: Product maturity looks real and expanding, while low-level reliability and AI-governance detail remain the key underwriting gap
  body: 'Taken together, the retained evidence supports a product verdict that is positive on breadth, credible on maturity, and still incomplete on deep technical diligence. Culture Amp is clearly shipping around a multi-product operating loop: collect feedback, interpret data, align goals, run reviews, coach managers, and develop employees. AI Coach increases the platform’s ambition by using engagement and performance context to push next-best-action guidance rather than stop at dashboards. Public review and editorial sources help balance the company narrative. They consistently credit Culture Amp for analytics, benchmarking, and thoughtful employee-experience workflows, but they also point to implementation, usability, and setup friction. That combination is believable for enterprise HR software: differentiated insight can coexist with operational complexity. The remaining concern is that public evidence still does not reveal API limits, detailed release cadence by module, uptime history,
    or model-governance specifics. Investors can therefore underwrite product reality and strategic coherence, but not yet enterprise-grade technical assurance without private diligence.'
  claimRefs:
  - CE032
  - CE033
  - CE034
  - CE035
  - CE036
  tableRefs:
  - TE005
