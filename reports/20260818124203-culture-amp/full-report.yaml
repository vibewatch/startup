      - number: '8.2'
        title: >-
          The thesis is a scaled multi-product people platform; the anti-thesis is that quality and downside protection
          remain under-disclosed
        blocks:
          - type: paragraph
            body: >-
              The pro-valuation case is straightforward. Culture Amp is not merely a survey vendor. Official product
              pages and funding history show a company that built engagement, performance, development, AI coaching, and
              people-science workflows into a platform adopted by thousands of organizations. That supports premium
              logic because there are several ways to expand wallet share if customers retain well. The anti-thesis is
              just as important. The business is still private, still quote-led, still appears to mix software with
              consulting and enablement work, and still does not publish the metrics investors need to know whether the
              revenue base deserves a software-quality multiple. Losses, layoffs, and litigation around the AI
              organization also raise the probability that future value creation is bumpier than the product narrative
              suggests. The right approach is to respect the asset, but discount the evidence quality. That is why
              valuation discipline here must be evidence-sensitive, not just company-quality-sensitive.
            claimRefs:
              - CV011
