  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, packaging, and what customers are actually paying for
        blocks:
          - type: paragraph
            body: >-
              Culture Amp’s public pricing surfaces show a revenue model built around enterprise software plus services,
              not self-serve volume. The pricing page asks buyers to contact sales, offers enterprise pricing, and
              frames CultureOS as a combined engagement, performance, and development stack with AI Coach embedded
              across modules. The same page also shows explicit service layers: People Science Consulting, pre-launch
              review, manager and executive trainings, one-on-one coaching, and different customer-success coverage by
              company size. That suggests revenue is not a single flat subscription fee. It likely includes module
              subscriptions, implementation and enablement work, and higher-touch service packages for larger accounts.
              The Engage page reinforces the business case by promising bottom-line impact, retention support, and
              productivity gains. AI Coach extends that monetization logic by turning benchmark and workflow data into a
              new premium management layer. In other words, Culture Amp appears to monetize not only survey collection
              but also analytics, enablement, and behavior change.
