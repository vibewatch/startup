chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scale claims, and geographic footprint
        blocks:
          - type: paragraph
            body: >-
              Culture Amp’s current positioning is broader than a survey point solution. The homepage and pricing page
              now market a complete CultureOS that combines engagement, performance, development, and AI Coach, while
              the trust, benchmarking, and company pages reinforce that the platform is sold as enterprise-grade
              workflow infrastructure rather than a lightweight HR plug-in. The company’s public scale claims are also
              substantial enough to matter for later chapters: the homepage says 25 million employees across 6,000-plus
              organizations use the platform, the about page lists 6,000-plus customers, 70.5 thousand-plus surveys
              launched, 13 million-plus responses, and 594.3 million-plus questions answered, and the benchmarking page
              says the benchmark layer covers more than one billion survey responses. Those numbers support a real
              installed base and data-network story, but they are still company-authored metrics rather than audited
              disclosures. Geographic footprint is better corroborated: careers and hub-flexibility pages identify
              Melbourne as headquarters and list operating hubs across Sydney, San Francisco, New York, Chicago, London,
              Berlin, and Austin, while the 2022 Berlin-office launch anchors European expansion with dated evidence.
