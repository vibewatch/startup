      - number: '4.2'
        title: Public traction, outcome proof, and imperfect efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The company does provide strong qualitative evidence that customers buy Culture Amp for outcomes rather
              than simple compliance. The Unifonic case study cites a 30% increase in sustained employee productivity,
              OLX says engagement improved 11% during major organizational change, and NASCAR reports a 30% reduction in
              L&D cycle time plus a 107% increase in survey completions. Those are not audited financial statements, but
              they do show how the product is sold: as a lever for productivity, retention, leadership effectiveness,
              and faster organizational adaptation. Review surfaces add a second proxy. TrustRadius users praise
              analytics depth and benchmarking but flag integration and usability frictions, SoftwareReviews reports
              high stated likelihood to recommend, plan to renew, and cost-to-value scores, and third-party review
              summaries emphasize action planning, integrations, and continuous listening. None of this substitutes for
              CAC, payback, or NRR disclosures, but it does suggest Culture Amp’s value case is tied to measurable
