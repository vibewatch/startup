      - number: '8.3'
        title: >-
          Public-comparable discipline suggests the current mark lives inside a supportable band, but nearer the full
          end than the bargain end
        blocks:
          - type: paragraph
            body: >-
              The best public valuation discipline here comes from simple revenue-multiple framing rather than false
              precision. Using FY2025 revenue of $177 million, the implied multiple is about 6.5 times at the
              post-markdown mark and about 8.5 times at the old $1.5 billion peak. Using the lower-confidence GetLatka
              ARR estimate of $227.2 million, the multiples fall to roughly 5.1 times and 6.6 times. Those numbers are
              not absurd for a scaled private SaaS asset with sticky workflows, but they are also not obviously cheap
              when the company is still loss-making and public disclosure is thin. Public peers like Workday, SAP, and
              Microsoft are far larger and far better disclosed, which means they are imperfect valuation peers and
              should not be used to justify a premium casually. The current mark therefore fits inside a defendable
              band, but only with meaningful caution around quality and execution. In other words, the range is
              supportable, but conviction at the top end is still weak.
            claimRefs:
