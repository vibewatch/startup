      - number: '3.3'
        title: Distribution power, trust posture, and switching-cost realities
        blocks:
          - type: paragraph
            body: >-
              Distribution is where the largest incumbents gain their leverage. Workday’s investor site says more than
              11,500 organizations and over 65% of the Fortune 500 trust Workday, Microsoft bundles employee experience
              into the broader Viva and Microsoft 365 stack, and SAP sells employee experience as part of SuccessFactors
              and HCM. Those positions do not automatically beat Culture Amp on user experience or benchmark context,
              but they do make the incumbent proposal easier to fund from existing budgets and vendor relationships.
              Midmarket challengers fight on different terrain. Lattice, 15Five, Engagedly, and Leapsome emphasize
              modular adoption, transparent packaging, and unified people workflows. That can lower switching friction
              for a buyer that wants one system for feedback, performance, and development. The practical result is that
              Culture Amp faces both displacement risk from suites above it and scope-creep risk from workflow platforms
              below it. Buyers can also multi-home: Lattice explicitly references Workday as the system of record while
              powering performance and goals, which shows that interoperability reduces all-or-nothing winner-take-all
              dynamics.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
      - number: '3.4'
        title: Moat durability, commoditization risk, and where Culture Amp still has an edge
        blocks:
          - type: paragraph
            body: >-
              Culture Amp’s strongest defensible claims remain benchmark depth, people-science credibility, and a
              product architecture intentionally built around engagement plus performance plus development. Those
              strengths matter most when a buyer wants high-confidence benchmarking and manager action rather than
              merely a survey engine or generic AI assistant. But public competitor pages show how quickly the field is
              converging. Microsoft, Workday, 15Five, Leapsome, Rippling, and Engagedly all foreground AI, coaching,
              insights, or workflow automation. Qualtrics frames its own platform as category-defining, SAP links
              employee experience to autonomous HR, and Workday positions AI agents inside mission-critical business
              context. The moat is therefore relative rather than absolute. Culture Amp has a meaningful specialization
              advantage against generic suite modules, but that edge narrows if buyers care more about contract
              consolidation, HRIS integration, or broader workforce-OS capabilities than about benchmark nuance. The
              competitive risk is not that one rival is categorically better; it is that many rivals are “good enough”
              once bundled with adjacent systems or sold through a stronger incumbent channel.
