      - number: '1.3'
        title: Capital history, investors, and scale milestones of record
        blocks:
          - type: paragraph
            body: >-
              Culture Amp’s capital history is unusually well documented through its own announcements, even if current
              mark-to-market valuation is not. The company announced a $20 million Series C in 2017, a $40 million
              Series D in 2018, an $82 million Series E in 2019 that lifted lifetime funds raised above $158 million,
              and a $100 million Series F in July 2021 at a valuation above $1.5 billion. The investor base named across
              those rounds includes Sapphire, Blackbird, Felicis, Index, Sapphire, TDM, Sequoia Capital China,
              Salesforce Ventures, Skip Capital, Grok Ventures, Hostplus, and Global Founders Capital, which is
              consistent with a late-stage venture-backed platform rather than a thinly capitalized software vendor.
              Public reporting since 2025 complicates the picture. AFR and Startup Daily both show slowing revenue
              growth and sizable losses, while Capital Brief says Blackbird marked the business down by 23.5% at its
              2025 investor day. GetLatka then offers a current but lower-confidence revenue and funding rollup. Taken
              together, the company has enough history and investor support to count as a durable scaled private asset,
              but not enough transparent disclosures to treat the last private mark as fully underwritten.
