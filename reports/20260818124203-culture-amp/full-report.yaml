      - number: '8.4'
        title: >-
          The decision still hinges on revenue quality, retention quality, and cap-table quality more than on the
          existence of product demand
        blocks:
          - type: paragraph
            body: >-
              The biggest remaining valuation question is not whether Culture Amp built something valuable. It is
              whether the current price already assumes too much about quality, durability, and downside protection.
              Investors still need audited or management-verified answers on gross margin, retention, contract length,
              concentration, support burden, and the actual preference stack. Those gaps matter because even a modest
              deterioration in growth or service mix would change what kind of multiple the business deserves. The
              reverse is also true: if management can show solid retention, improving burn, and a clean cap table near
              the post-markdown price, the recommendation could move upward. Until then, the underwriting burden remains
              high. A new wave of layoffs, worsening burn, governance escalation in the AI organization, or weak
              monetization of the newer modules would all argue for more discount, not less. The remaining work is
              classic late-stage diligence, not abstract market storytelling. at today’s price.
            claimRefs:
