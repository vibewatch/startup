              The retained source pack shows a business that is strategically coherent but operationally exposed. On the
              product side, Culture Amp depends on upstream HRIS data and flow-of-work integrations to keep customer
              records current and make survey or performance workflows useful. Workday, BambooHR, HiBob, Slack, and the
              Developer API are strengths for product fit, but they are also dependencies that can break, drift, or
              require support-heavy implementation. Independent reviews back that concern up by calling out integration
              complexity and the need for IT support or more enterprise customizations. On the company side, the public
              financial and personnel record shows strain: job cuts in late 2025 and again in mid-2026, slowing growth,
              ongoing losses, and a 23.5 percent investor markdown. The AI-specialist litigation matters here too
              because it coincides with the company’s attempt to push AI deeper into the product. That combination
              creates execution risk across support quality, product delivery, culture, and strategic focus.
