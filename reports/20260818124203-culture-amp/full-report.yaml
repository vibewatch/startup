companyProfile:
  summary: >-
    Culture Amp is a Melbourne-founded private employee-experience software company that sells a multi-module platform
    across engagement listening, performance reviews, goals, development workflows, people analytics, and AI-guided
    manager actioning. Public evidence supports real global scale, with more than 6,000 organizations and 25 million
    employees represented on official surfaces, plus a funding history that culminated in a $100 million Series F at a
    valuation above $1.5 billion. The business looks strategically relevant in enterprise HR tech, but public
    underwriting evidence remains incomplete on margins, retention, customer concentration, and cap-table economics.
