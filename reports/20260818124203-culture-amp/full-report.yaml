      - number: '1.2'
        title: Leadership transition, founder dependence, and company story
        blocks:
          - type: paragraph
            body: >-
              The public leadership story changed materially in 2026. Culture Amp’s own January 2026 announcement says
              founder Didier Elzinga moved from chief executive to executive chairman while Caroline Rawlinson, who had
              joined roughly a year earlier as chief financial and operating officer, became CEO. That transition
              matters because it shifts the company from a long founder-led operating model into a more institutional
              scale-up posture oriented around economics, customer success, and execution pace. Rawlinson’s stated remit
              includes product vision, roadmap, markets, customers, and economics, which suggests the board wanted
              operating discipline as much as symbolic succession. Governance transparency remains incomplete, however.
              The retained public pack names investors and, through older funding announcements, identifies Kevin
              Diestel joining the board in the Series C round, but it does not provide a current complete board roster
              or definitive control-rights disclosure. The company story is also slightly messy in public databases:
              Startup Daily refers to a 2009 launch, Techboard lists 2010 commencement, and the 2019 official
              announcement says the company was founded in 2011. That inconsistency is not thesis-breaking, but it is a
              real diligence item because later chapter timelines should distinguish legal incorporation, commercial
              launch, and platform scale-up.
