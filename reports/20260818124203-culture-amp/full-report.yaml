      - number: '4.4'
        title: Financial verdict on revenue quality, margin path, and what remains unknown
        blocks:
          - type: paragraph
            body: >-
              Financially, Culture Amp looks like a meaningful software asset with real revenue, meaningful deferred
              revenue, and a product that can articulate ROI. But the public record is still too thin to make a clean
              high-conviction case on unit economics. There is no public gross margin, no disclosed NRR or GRR, no CAC
              or payback, no disclosed free-cash-flow bridge, and no segment or module revenue mix. Review data and case
              studies suggest customers do see value, yet they also imply implementation and enablement effort that
              could create service intensity or support burden. The GetLatka ARR figure of US$227.2 million is
              directionally helpful but lower-confidence than the reported statutory revenue figures, and public
              statements about being “meaningfully cash generative” remain unproven without audited cash-flow
              disclosures. The practical financial verdict is therefore mixed: Culture Amp likely has enough scale and
              customer value to remain financeable, but the current private-market mark depends on assumptions about
              retention, margin expansion, and support efficiency that public evidence does not fully validate.
            claimRefs:
              - CI031
