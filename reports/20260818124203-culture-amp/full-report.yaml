      - number: '3.2'
        title: Capability breadth, packaging, and where the buying motion diverges
        blocks:
          - type: paragraph
            body: >-
              The capability matrix shows why competition is intense. Qualtrics, Microsoft, Workday, and Culture Amp all
              tie listening to analytics and recommended action. Lattice, 15Five, and Leapsome push harder into manager
              workflow with 1:1s, goals, reviews, and development. Rippling and SAP sell EX as one layer within a much
              broader operational system, which changes procurement math because the EX feature is only one part of the
              value story. Pricing and packaging highlight similar divergence. Microsoft publishes Viva bundles at
              roughly $2, $6, and $12 per user per month while requiring a 50-seat minimum for Glint, Lattice publishes
              modular list pricing at $10, $8, and $4 per seat per month for different capabilities, 15Five says plans
              start at $4 per user per month, and Engagedly discloses a $7,500 annual minimum. Qualtrics remains
              request-priced and usage-metered. Culture Amp’s lack of self-serve pricing leaves it looking more
              enterprise-native but also less transparent to midmarket buyers than some workflow-centric rivals.
