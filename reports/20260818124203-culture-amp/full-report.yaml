  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, confidentiality, and employment-law exposure are the clearest legal and regulatory risks
        blocks:
          - type: paragraph
            body: >-
              Culture Amp is not just another workflow SaaS product. It processes employee feedback, survey responses,
              people analytics, and in some cases individual feedback flows that sit close to employment, privacy, and
              workplace-governance risk. The privacy policy, confidentiality guidance, and general terms collectively
              show how sensitive the promise is: employees are told their responses will be protected, administrators
              are given scoped reporting access, and privacy-related documents are explicitly part of the commercial
              agreement. That means a failure is not merely technical embarrassment. It could become contractual,
              regulatory, and reputational harm at the same time. The OAIC’s Australian Privacy Principles make the
              local regulatory stakes clear, while the European Commission’s GDPR explainer shows why re-identifiable or
              pseudonymised employee data is still highly regulated. The AI-specialist court dispute adds a separate
              legal and governance layer: even if unresolved, it introduces employment-law and culture-risk questions in
              a strategically important product area.
            claimRefs:
