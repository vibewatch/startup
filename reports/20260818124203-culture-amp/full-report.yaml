  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Culture Amp does not compete against one homogeneous set. The direct specialist comparison set is
              Qualtrics EX, Microsoft Viva Glint, and Workday Peakon because all three sell structured listening,
              analytics, and action workflows to large employers. The adjacent but increasingly relevant specialist set
              is Lattice, 15Five, Leapsome, and Engagedly, each of which combines engagement with goals, feedback,
              performance, or broader talent workflows. Then there are suite players and substitutes such as SAP,
              Rippling, and Personio that can make employee feedback one capability inside a much larger HR or workforce
              platform. That matters because buyers can solve the “employee experience” job with a specialist listening
              layer, a performance-first suite, or a full HCM stack depending on segment and procurement preferences.
              Culture Amp’s benchmark depth and people-science framing clearly differentiate the brand, but the
              functional overlap is large enough that the buyer often sees a capability set, not a category moat.
            claimRefs:
