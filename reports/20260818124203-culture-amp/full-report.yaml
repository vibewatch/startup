  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and what counts as the job to be done
        blocks:
          - type: paragraph
            body: >-
              Culture Amp’s market is best defined as the employee experience layer that sits between core HR systems of
              record and day-to-day people-management workflows. The included spend is not just survey software. Public
              product pages from Culture Amp, Qualtrics, Microsoft Viva Glint, Workday Peakon, Lattice, and SAP all
              position the category around listening, engagement, retention, development, and manager action in one way
              or another. That means the relevant market includes employee listening, performance and goals, development
              planning, pulse surveys, analytics, and increasingly AI-guided recommendations for leaders. It excludes
              payroll processing, core benefits administration, and pure HRIS recordkeeping except when suite vendors
              bundle those adjacent modules into the buying motion. The status quo substitute is still the combination
              of annual survey tools, manual spreadsheet analysis, HR business partner follow-up, and lightweight point
              solutions for goals, recognition, or feedback. Culture Amp’s opportunity exists because employers
              increasingly want a joined-up system that ties sentiment data to retention, performance, and manager
              behavior rather than a once-a-year survey event.
            claimRefs:
              - CM001
              - CM002
