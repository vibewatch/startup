  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation stays research-more because today’s mark is plausible but not yet obviously cheap
        blocks:
          - type: paragraph
            body: >-
              Culture Amp does not look disconnected from business reality. It has real customer scale, a broader
              product set than a simple survey tool, and a still-material private valuation even after a meaningful
              markdown. But the public pack is not strong enough to call the current mark obviously attractive. The
              cleanest current anchor is Blackbird’s reported 23.5 percent markdown from the $1.5 billion Series F
              reference, which implies roughly $1.15 billion. That is materially better than the peak, yet it still
              rests on a company that lost $37 million in FY2025 and grew only 10.8 percent. Public evidence therefore
              supports a research-more stance: the price is no longer as demanding as in 2021, but neither disclosure
              nor operating proof is clean enough to turn a plausible valuation into a compelling one. The important
              nuance is that plausibility is not the same thing as margin of safety. right now.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV022
              - CV026
