      - number: '2.4'
        title: Sizing lenses, adjacency pressure, and what the market structure implies for Culture Amp
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports market attractiveness, but not a single clean TAM. The most defensible lens is
              workload and problem intensity rather than one glossy market-research number. Culture Amp’s own
              private-company benchmark says its July 2025 to June 2026 benchmark already covers about 50 million
              questions across roughly 3,000 organizations, Gallup says engagement remains globally low, and
              vendor-authored market overviews like Engagedly describe a category headed toward tens of billions of
              dollars by 2030 as AI, sentiment analysis, and real-time feedback become standard. Those signals point to
              a meaningful category, but they also show why Culture Amp’s lane is contested. Suite incumbents such as
              Microsoft, Workday, and SAP can bundle employee experience into broader HCM or collaboration contracts,
              while point-solution vendors like Lattice, 15Five, and Leapsome differentiate through manager workflow and
              ease of deployment. For Culture Amp, the implication is that market size alone is not the moat. The
              company wins if buyers continue to pay for a specialized employee-experience system with credible
              benchmarks, people science, and cross-workflow analytics rather than accepting EX features bundled into
              larger platforms. That is a healthy market, but one where bundling pressure and deployment complexity cap
              the standalone premium.
