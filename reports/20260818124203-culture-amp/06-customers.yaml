- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - All-in-one product breadth across engagement, performance, development, and AI coaching
    - Large logos may mask uneven smaller-account adoption
    - Cross-sell potential is real but could be concentrated in a narrow upper tier
    - Request module attach and ARR by company size.
  - - Adjacent workflow expansion such as Etsy adding exit interviews
    - Case-study expansions may not generalize across the installed base
    - Can overstate true land-and-expand rate
    - Request cohort expansion curves and attach by tenure.
  - - Named marquee brands create social proof
    - Revenue concentration may sit in a few major accounts or geographies
    - Loss of a small number of brands could distort growth and retention
    - Request top-10 customer revenue share and industry mix.
  - - Review-platform satisfaction suggests usable value
    - Implementation and support friction can raise churn risk in smaller or less technical buyers
    - Durability may be lower outside well-supported accounts
    - Request churn reasons and onboarding success metrics by segment.
  - - Global footprint and varied industries
    - Contract terms and procurement cycles may vary sharply by customer type
    - Working-capital and renewal profile may be less uniform than logos imply
    - Request contract-length distribution and billing cadence.
  summary: Expansion logic is visible, but concentration and contract-quality visibility remain too thin for high-conviction underwriting.
  notes: This risk table translates public customer evidence into diligence asks rather than assuming missing data is benign.
