- id: durability-and-satisfaction
  title: Review evidence supports real usage and positive value perception, but retention remains mostly inferential
  body: 'Independent review surfaces are useful here because they show how customers talk when they are not participating in a Culture Amp case study. TrustRadius reviews describe easy-to-analyze survey data, confidentiality protections, and strong reporting, while also flagging harder integrations and a desire for more hands-on support. SoftwareReviews adds structured score signals: 8.4 out of 10 overall, 88 for likelihood to recommend, 95 for plan to renew, and 77 for satisfaction of cost relative to value. Those are supportive, but they are still review-platform proxies rather than audited cohort metrics. Trustpilot’s 3.1 out of 5 and some editorial review caveats on integrations and enterprise customizations remind investors that product affection is not universal. The clearest public durability signal is still anecdotal, not portfolio-wide. Etsy’s three-year usage shows account survival; it does not substitute for GRR, NRR, or churn by segment.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-verdict
  title: Cross-sell logic exists, but concentration and contract-quality disclosure are still thin
  body: 'The customer chapter supports a positive view on adoption reality and a more cautious view on durability math. Expansion logic is visible in two ways. First, product breadth lets Culture Amp move from surveys into reviews, development, and action planning. Second, case evidence such as Etsy’s move into exit interviews shows that at least some customers adopt more than one workflow over time. Review and editorial pages also consistently describe Culture Amp as an all-in-one employee-experience platform rather than a one-purpose tool, which supports cross-sell potential. But public evidence still does not disclose concentration, average contract length, renewal cohorts, or the share of revenue tied to large marquee brands versus smaller customers. That omission matters because a portfolio can look healthy on logos and still be fragile on economics. The best evidence-constrained verdict is that customers are real and value-bearing, while retention quality and concentration still require
    management disclosure. Another practical caveat is channel opacity: public materials do not tell investors how much adoption comes from direct enterprise selling versus lighter-touch lower-ACV buyers, which limits confidence in support scalability.'
