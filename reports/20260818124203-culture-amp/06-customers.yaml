- id: named-production-proof
  title: Named production proof is strong because the best stories quantify outcomes and show real operational use
  body: Culture Amp’s strongest customer evidence comes from case studies with concrete operating signals rather than empty endorsements. Etsy says it had used the platform for three years, kept engagement participation above 85 percent, and expanded into exit interviews. Unifonic reports a 30 percent increase in sustained employee productivity, plus improvement in leadership trust and employee satisfaction. OLX says engagement rose 11 percent during major organizational change and sat 4 percent above external benchmarks. NASCAR reports a 10 percent increase in feedback-collection efficiency, a 30 percent reduction in L&D cycle time, a 15 percent increase in L&D enrollment, and a 107 percent increase in survey completions. Those are exactly the kinds of facts that distinguish production use from vague affinity. The caveat is that the stories are curated and company-mediated. They prove deployment reality and outcome plausibility, but not the distribution of outcomes across the whole installed
    base.
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
