  evidenceGaps:
  - type: private-evidence-only
    priority: high
    question: What are GRR, NRR, logo churn, and renewal rates by segment and cohort?
    impact: Without actual cohort data, review scores and case studies cannot prove durability.
    suggestedOwner: CFO or VP Customer Success
    claimRefs:
    - CU034
    - CU038
    relatedQuestionRefs:
    - QU018
  - type: private-evidence-only
    priority: high
    question: What share of ARR comes from the top 10 customers, top industries, and top geographies?
    impact: Named logos help with credibility, but concentration can still materially change downside risk.
    suggestedOwner: Finance or RevOps
    claimRefs:
    - CU035
    - CU038
    relatedQuestionRefs:
    - QU017
  - type: private-evidence-only
    priority: medium
    question: What contract lengths, renewal mechanics, and billing cadence govern the major customer cohorts?
    impact: Contract structure materially affects cash-flow predictability and churn timing.
    suggestedOwner: Finance or Legal
    claimRefs:
    - CU036
    relatedQuestionRefs:
    - QU019
  - type: missing-public-data
    priority: medium
    question: What is the public-defensible split between enterprise, mid-market, and smaller customers?
    impact: Public customer logos show breadth, but they do not reveal economic mix or where cross-sell is strongest. The named-customer-proof table is intentionally partial.
    suggestedOwner: RevOps
    claimRefs:
    - CU003
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
