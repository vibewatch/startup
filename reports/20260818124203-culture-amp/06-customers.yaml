  title: Customers
summary: 'Culture Amp clears the public-adoption bar. The retained pack shows real named deployments across software, retail, ecommerce, marketplaces, and sports, plus outcome-oriented case studies that go beyond a logo wall. The main gap is durability quality: public sources support usage and satisfaction, but not portfolio-grade retention, concentration, or contract-quality underwriting.'
sections:
- id: customer-mix-and-segmentation
  title: Customer evidence is broadest across complex people-operations environments rather than one narrow HR niche
  body: 'Culture Amp’s customer footprint looks materially broader than a handful of hand-picked startup logos. The official homepage and company page anchor the scale claim at more than 6,000 organizations and tens of millions of employees touched through the platform. The case-study set then shows a useful cross-section of buyers: digital-native software companies such as DigitalOcean and Credit Karma, multinational marketplace operators such as OLX, global communications software provider Unifonic, large consumer brands such as Etsy and Coles, and even complex sports organizations such as NASCAR. That pattern matters because it suggests the product resonates where feedback, performance, and change-management workflows are operationally important, not just culturally fashionable. The public record still does not disclose revenue by segment, country, or vertical. So the right read is that customer breadth is real, but the economic mix inside that breadth remains private.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
