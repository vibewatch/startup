  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、巨头、邻近厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              Culture Amp 面对的不是一组同质对手。直接专业对标对象是 Qualtrics EX、Microsoft Viva Glint 和 Workday
              Peakon，因为三者都向大型雇主销售结构化员工倾听、分析和行动工作流。邻近但越来越相关的专业厂商包括 Lattice、15Five、Leapsome 和
              Engagedly，它们都把敬业度与目标、反馈、绩效或更宽的人才工作流结合起来。再往外是 SAP、Rippling 和 Personio 这类套件玩家和替代方案，它们可以把员工反馈做成更大 HR
              或劳动力平台中的一项能力。这很关键，因为买家可以按细分市场和采购偏好，用专业倾听层、绩效优先套件或完整 HCM 栈来解决“员工体验”任务。Culture Amp
              的基准深度和人才科学叙事明显让品牌差异化，但功能重叠足够大，买家常常看到的是一组能力，而不是一个品类护城河。
