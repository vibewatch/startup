            body: >-
              能力矩阵解释了为什么竞争激烈。Qualtrics、Microsoft、Workday 和 Culture Amp 都把倾听接到分析和推荐行动上。Lattice、15Five 和 Leapsome
              更用力地切入管理者工作流，覆盖 1:1、目标、评审和发展。Rippling 和 SAP 把 EX 作为更宽运营系统中的一层来卖，这会改变采购账，因为 EX
              功能只是价值故事的一部分。定价和打包也显示了类似分叉。Microsoft 公开 Viva 套餐约为每用户每月 $2、$6 和 $12，同时要求 Glint 最低 50 个 seat；Lattice
              公开模块化标价，不同能力分别为每 seat 每月 $10、$8 和 $4；15Five 称套餐从每用户每月 $4 起；Engagedly 披露年度最低 $7,500。Qualtrics
              仍是询价定价并按使用计量。Culture Amp 没有自助定价，让它看起来更企业原生，但相比一些以工作流为中心的竞争对手，对中端市场买家的透明度也更低。
