            title: 减记有帮助，但不能解决执行风险
            body: 价格低于 2021 年高峰是正面因素，但亏损、裁员和公开情绪混杂，意味着估值仍应带有显著的私营公司折扣。
            calloutType: assumption
            claimRefs:
