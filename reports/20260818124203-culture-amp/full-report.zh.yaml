  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、打包方式，以及客户实际在为什么付费
        blocks:
          - type: paragraph
            body: >-
              Culture Amp 的公开定价页面显示，收入模式建立在企业软件加服务之上，而不是自助式规模成交。定价页要求买家联系销售，提供企业定价，并把 CultureOS
              描述为一套结合员工敬业度、绩效和发展的技术栈，AI Coach 嵌入各模块。同一页面还明确展示服务层：People Science
              Consulting、上线前审查、管理者和高管培训、一对一辅导，以及按公司规模区分的客户成功覆盖。这说明收入不是单一固定订阅费。它很可能包括模块订阅、实施和赋能工作，以及面向大客户的高触达服务包。Engage
              页面进一步强化商业理由，承诺改善利润底线、支持留存并提升生产力。AI Coach 则把这种变现逻辑延伸了一层：把基准和工作流数据转化为新的高溢价管理能力。换句话说，Culture Amp
              变现的不只是问卷收集，也包括分析、赋能和行为改变。
