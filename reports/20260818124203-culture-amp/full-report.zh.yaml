  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及要解决的真实任务
        blocks:
          - type: paragraph
            body: >-
              Culture Amp 的市场最好定义为员工体验层：它位于核心 HR 记录系统和日常人员管理工作流之间。纳入的支出不只是问卷软件。Culture Amp、Qualtrics、Microsoft Viva
              Glint、Workday Peakon、Lattice 和 SAP
              的公开产品页面，都以不同方式把这个品类放在员工倾听、敬业度、留存、发展和管理者行动周围。这意味着相关市场包括员工倾听、绩效和目标、发展规划、脉冲问卷、分析，以及越来越多面向领导者的 AI
              引导建议。薪资处理、核心福利管理和纯 HRIS 记录维护应排除在外，除非套件厂商把这些邻近模块打包进采购动作。现状替代方案仍是年度问卷工具、手工表格分析、HRBP
              跟进，以及用于目标、认可或反馈的轻量单点工具。Culture Amp 的机会来自雇主需求变化：企业越来越想要一套连起来的系统，把情绪数据接到留存、绩效和管理者行为上，而不是只办一年一次的问卷项目。
