      - number: '8.2'
        title: 投资逻辑是一个规模化的多产品人力平台；反向逻辑是质量和下行保护披露仍不足
        blocks:
          - type: paragraph
            body: >-
              支持估值的理由很直接。Culture Amp 不只是一个调研供应商。官方产品页和融资历史显示，公司把敬业度、绩效、发展、AI
              辅导和人力科学工作流做成了平台，已有数千家组织采用。如果客户留存良好，公司有多条路径扩大钱包份额，因此可以支撑一定溢价。反向逻辑同样重要。公司仍是私营企业，仍靠报价驱动销售，仍看起来把软件与咨询、赋能工作混在一起，也仍不披露投资人判断收入基础是否配得上软件质量倍数所需的指标。AI
              组织周边的亏损、裁员和诉讼，也提高了未来价值创造比产品叙事更颠簸的概率。正确做法是尊重资产，但给证据质量打折。因此，这里的估值纪律必须对证据敏感，而不能只看公司质量。
