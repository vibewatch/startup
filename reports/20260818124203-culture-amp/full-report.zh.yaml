      - number: '2.4'
        title: 规模测算视角、邻近压力，以及市场结构对 Culture Amp 的含义
        blocks:
          - type: paragraph
            body: >-
              公开证据支持市场吸引力，但没有给出一个干净的 TAM。最可辩护的视角是工作量和问题强度，而不是一个漂亮的市场研究数字。Culture Amp 自己的私营公司基准称，2025 年 7 月至 2026 年 6
              月的基准已覆盖约 50 million 个问题、约 3,000 家机构；Gallup 称全球敬业度仍处低位；Engagedly 这类厂商撰写的市场概览则描述了一个到 2030 年走向数百亿美元的品类，原因是
              AI、情绪分析和实时反馈正在成为标准。这些信号指向一个有意义的品类，也解释了为什么 Culture Amp 的赛道很拥挤。Microsoft、Workday 和 SAP 等套件巨头可以把员工体验打包进更宽的
              HCM 或协作合同；Lattice、15Five 和 Leapsome 等单点厂商则靠管理者工作流和易部署性差异化。对 Culture Amp
              来说，含义是市场规模本身不是护城河。只有当买家继续为一套专业员工体验系统付费，并认可可信基准、人才科学和跨工作流分析，而不是接受大平台捆绑的 EX
              功能时，公司才会赢。这是一个健康市场，但捆绑压力和部署复杂性会限制独立厂商溢价。
