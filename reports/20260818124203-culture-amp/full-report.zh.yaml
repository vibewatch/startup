      - number: '1.4'
        title: 负面信号、运营压力和仍未解决的问题
        blocks:
          - type: paragraph
            body: >-
              负面记录足以影响后续投资判断。Startup Daily 报道称，Culture Amp 在 2025 年 11 月裁掉约 60 个岗位，新 CEO 上任后又在 2026 年 7 月裁掉 70
              个岗位，约占员工总数 9%；同一媒体和 AFR 都描述了增长放缓和持续亏损。Trustpilot 与 TrustRadius 补充了客户和用户层面的质感：TrustRadius
              评价者认可分析深度和基准能力，但指出集成摩擦和易用性复杂；Trustpilot 可见评分只有 3.1 /
              5，且公开样本很小。单看任何一个信号都不足以打破投资逻辑，但放在一起，它们显示公司一边有真实品类领导力，一边承受执行压力和私募市场重新定价。最大的未决事项包括：Blackbird
              减记后的当前估值口径、几轮裁员后的规范员工数、当前董事会构成和优先股堆叠、以及横跨 Australia 和 United States 的清晰法人实体链路。也正因为这些缺口，后续章节应把 Culture Amp
              视为已成规模但披露受限的私营公司，而不是透明度接近上市公司的资产。
