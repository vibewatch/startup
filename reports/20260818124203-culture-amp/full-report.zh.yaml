      - number: '8.3'
        title: 公开可比约束显示当前估值落在可支撑区间内，但更接近充分定价端，而非便宜端
        blocks:
          - type: paragraph
            body: >-
              这里最好的公开估值纪律，不是假精确，而是简单的收入倍数框架。按 FY2025 收入 $177M 计算，减记后估值对应约 6.5 倍收入，旧的 $1.5B 高峰估值约为 8.5 倍。若采用置信度较低的
              GetLatka ARR 估计 $227.2M，倍数分别降至约 5.1 倍和 6.6 倍。对于一家已有规模、工作流黏性强的私营 SaaS
              资产，这些数字并不荒唐；但公司仍在亏损，公开披露又薄，也谈不上明显便宜。Workday、SAP、Microsoft
              等公开上市同行规模大得多、披露也充分得多，因此作为估值可比并不完美，不应被随意用来证明溢价合理。因此，当前估值落在一个可辩护区间内，但必须对质量和执行保持实质性谨慎。换句话说，区间可支撑，但靠近上沿的信心仍弱。
