  - id: TV005
    title: 破坏投资逻辑与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 再次大规模裁员
        - 2026 年裁员后又一次大规模减员
        - 表明经营杠杆更弱，并可能出现支持质量下降
        - 除非有强盈利能力证据抵消，否则把立场调得更负面。
      - - 烧钱恶化或现金跑道缩短
        - 亏损加深，或现金压力明显重现
        - 削弱溢价案例，并提高融资风险折扣
        - 下调可支撑估值区间。
      - - 留存被证实弱于隐含假设
        - 私下尽调显示 GRR、NRR 疲弱，或以支持问题为主的流失偏高
        - 打破软件质量逻辑
        - 按更低倍数框架重估。
      - - AI 或治理问题升级
        - 诉讼扩大，或 AI 变现明显不及预期
        - 损害围绕最新产品界面的选择权逻辑
        - 提高治理和执行风险权重。
      - - 股权结构表不利
        - 优先权、悬置股份或稀释显著恶化新资金经济性
        - 即使企业价值说得通，也会压低实际上行空间
        - 要求更低进入价，否则放弃。
    notes: 触发因素聚焦会直接改变现值或下行保护的事件，而非泛泛担忧。
    claimRefs:
      - CV028
      - CV032
      - CV033
      - CV034
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 毛利率和服务组合
        - 没有公开毛利率或订阅 / 服务拆分
        - 利润率质量决定溢价软件倍数是否站得住
        - CFO 和董事会材料
      - - 留存质量
        - 没有公开 GRR、NRR 或队列流失
        - 在当前估值标记下，耐久性是最重要未知数
        - CFO 或客户成功负责人
      - - 股权结构表和优先权
        - 没有公开清算堆叠或优先权条款
        - 私营公司经济性可能与名义企业价值大幅偏离
        - 总法律顾问和融资文件
      - - 客户集中度
        - 没有公开头部客户或垂直行业收入集中度
        - 客户标识广度不等于经济多元化
        - 财务或 RevOps
      - - 支持和实施负担
        - 裁员后没有公开支持指标
        - 服务负担可能挤压利润率和留存质量
        - 客户成功和运营负责人
    notes: 这些要求是把判断从继续研究推向更高确信度投资观点所需的最低资料包。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV038
      - CV039
