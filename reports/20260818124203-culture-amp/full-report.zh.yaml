      - number: '1.2'
        title: 领导层交接、创始人依赖与公司叙事
        blocks:
          - type: paragraph
            body: >-
              公开领导层叙事在 2026 年发生了实质变化。Culture Amp 自己在 2026 年 1 月发布的公告称，创始人 Didier Elzinga 从首席执行官转任执行董事长；Caroline
              Rawlinson 在约一年前加入公司担任首席财务和运营官，随后接任 CEO。这个交接重要，因为公司从长期创始人主导的运营模式，转向更制度化的规模化姿态，重心放在经济性、客户成功和执行速度上。Rawlinson
              的公开职责覆盖产品愿景、路线图、市场、客户和经济性，说明董事会想要的不是象征性传承，而是运营纪律。不过，治理透明度仍不完整。本次保留的公开材料列出投资者，并通过较早融资公告确认 Kevin Diestel 在
              Series C 轮加入董事会，但没有给出当前完整董事会名单，也没有明确披露控制权条款。公司的公开数据库叙事也略显混乱：Startup Daily 称公司在 2009 年启动，Techboard 列出 2010
              年开始运营，2019 年官方公告则称公司创立于 2011 年。这一不一致不足以推翻投资逻辑，但确实是尽调事项，因为后续时间线应区分法人设立、商业上线和平台规模化。
