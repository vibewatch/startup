        - 不是纯粹员工体验可比公司。
      - - Microsoft
        - 上市可比 / 市值
        - ≈$3.566T 市值
        - 只适合作为披露质量和规模的外围对照
        - 太大且多元，不能直接用于倍数。
      - - ADP
        - 上市可比 / 市值
        - ≈$105.7B 市值
        - 工资发放和 HCM 标杆，雇主侧工作流具备经常性
        - 规模仍远大于 Culture Amp，更成熟，披露也更多。
      - - Paychex
        - 上市可比 / 市值
        - ≈$42.2B 市值
        - 工资发放和雇主软件标杆，量级接近 Workday
        - 仍是上市、成熟公司，结构上不同于私营成长资产。
    notes: 本表刻意保守：上市公司市值可比对象提供纪律和背景，不是直接一一对应的倍数。
