      - number: '1.3'
        title: 资本历史、投资者和已记录的规模里程碑
        blocks:
          - type: paragraph
            body: >-
              Culture Amp 的资本历史通过自家公告记录得异常完整，哪怕当前按市值重估的估值并不透明。公司在 2017 年宣布 $20 million Series C，2018 年宣布 $40 million
              Series D，2019 年宣布 $82 million Series E，并把累计融资额推高到超过 $158 million；2021 年 7 月，公司又以超过 $1.5 billion 估值完成 $100
              million Series F。这些轮次中出现的投资者包括 Sapphire、Blackbird、Felicis、Index、Sapphire、TDM、Sequoia Capital
              China、Salesforce Ventures、Skip Capital、Grok Ventures、Hostplus 和 Global Founders
              Capital，符合一家后期风投支持平台的画像，而不是资本薄弱的软件供应商。2025 年以来的公开报道让图景变复杂。AFR 和 Startup Daily 都显示收入增长放缓、亏损仍大；Capital Brief
              称 Blackbird 在 2025 年投资者日把该业务估值下调 23.5%；GetLatka
              随后给出了一个当前但低置信度的收入和融资汇总。合在一起看，公司有足够历史和投资者支持，可算作有韧性的规模化私营资产；但透明披露不足，不能把上一轮私募估值视为已经充分验证。
