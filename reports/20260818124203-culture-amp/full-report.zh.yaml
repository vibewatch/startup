        blocks:
          - type: paragraph
            body: >-
              Culture Amp 看起来并未脱离商业现实。公司有真实客户规模，产品集也比单纯调研工具更宽，即使经历明显减记，私有估值仍有分量。但公开材料还不足以证明当前估值明显有吸引力。现在最干净的锚点，是
              Blackbird 据报道相较 $1.5B Series F 参考估值下调 23.5%，这意味着估值约为 $1.15B。这个位置比高峰期好得多，但支撑它的仍是一家 FY2025 亏损 $37M、增长只有
              10.8% 的公司。因此，公开证据支持继续研究：价格已经不像 2021 年那样苛刻，但披露和运营证明都还不够干净，无法把一个说得通的估值变成有说服力的估值。关键细节是，说得通不等于有安全边际，尤其是现在。
