    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、保密和劳动法风险敞口是最清晰的法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              Culture Amp 不只是另一款工作流
              SaaS。它处理员工反馈、问卷回复、人才分析，有时还处理贴近就业、隐私和职场治理风险的个人反馈流。隐私政策、保密指引和通用条款合在一起，显示这项承诺有多敏感：员工被告知其回复会受到保护；管理员获得有范围限制的报表权限；隐私相关文件明确构成商业协议的一部分。这意味着一旦失败，就不只是技术尴尬，而可能同时变成合同、监管和声誉损害。OAIC
              的 Australian Privacy Principles 说明了本地监管分量；European Commission 的 GDPR 解释也显示，能被重新识别或假名化的员工数据仍受到高度监管。AI
              专家法院纠纷又叠加了单独的法律和治理层：即便尚未解决，它也在一个战略重要产品领域引入了劳动法和文化风险问题。
