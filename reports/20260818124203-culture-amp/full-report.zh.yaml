companyProfile:
  summary: >-
    Culture Amp 是一家创立于 Melbourne 的私营员工体验软件公司，销售一个多模块平台，覆盖员工倾听、绩效评审、目标、发展工作流、人才分析，以及由 AI
    引导的管理者行动。公开证据显示公司已具备全球规模：官方页面称平台覆盖超过 6,000 家机构、25 million 名员工，融资历史则在估值超过 $1.5 billion 的 $100 million Series F
    轮达到高点。业务在企业 HR 科技里具备战略相关性，但毛利率、留存、客户集中度和股权结构经济性等公开尽调证据仍不完整。
