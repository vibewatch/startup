      - number: '8.4'
        title: 决策关键仍是收入质量、留存质量和股权结构表质量，而不是产品需求是否存在
        blocks:
          - type: paragraph
            body: >-
              剩下最大的估值问题，不是 Culture Amp
              是否已经打造出有价值的东西；而是当前价格是否已经对质量、耐久性和下行保护假设过满。投资人仍需要经审计或管理层验证的答案，覆盖毛利率、留存、合同期限、集中度、支持负担和实际优先股堆叠。这些缺口重要，因为即使增长或服务组合只是温和恶化，也会改变这家公司应享有的倍数。反过来也成立：如果管理层能证明留存稳固、烧钱改善，并且减记后价格附近的股权结构表干净，建议就可能上调。在此之前，承销负担仍高。新一轮裁员、烧钱恶化、AI
              组织治理升级，或新模块变现乏力，都意味着需要更大折扣，而不是更小折扣。剩余工作是典型的后期尽调，不是抽象市场故事，尤其是在今天这个价格上。
