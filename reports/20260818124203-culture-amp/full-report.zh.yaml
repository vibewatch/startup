        blocks:
          - type: paragraph
            body: >-
              最清晰的公开财务数据来自媒体对已提交账目的二级报道。Startup Daily 称，Culture Amp FY2025 收入为 US$177 million，增长 10.8%，全年亏损 A$37
              million，FY2024-FY2025 累计亏损 A$91.5 million。报道还称，经营活动净现金流从 FY2024 的 -US$14 million 改善到 FY2025 的 -US$10
              million，递延收入增长 12% 至 US$94 million，创始人 Didier Elzinga 对 Capital Brief 表示公司账上仍有 US$36 million。AFR
              独立印证了放缓路径，报道称 FY2024 销售额为 US$159.8 million，增长率从 FY2023 的 32% 降至 FY2024 的 19%。再加上 2025-2026 年裁员和 Blackbird
              减记，这描绘出典型的后期重置：公司仍在增长，规模仍然可观，但必须提升经营杠杆，并守住私募市场估值标记。因此，公开证据足以说明公司有真实收入规模，却不足以证明它已经具备可持续现金生成能力。
