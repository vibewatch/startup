            title: 资产真实到值得考虑溢价
            body: 客户规模、产品宽度和投资人多轮跟投支持显示，Culture Amp 不是一家投机性的无产品公司。
            calloutType: strength
            claimRefs:
              - CV001
              - CV013
              - CV016
          - type: callout
            title: 披露质量仍是最大的估值问题
            body: 公开材料仍缺少利润率、留存、集中度和股权结构表细节，投资人因此无法有信心地把公司质量转化为每股价值。
            calloutType: risk
            claimRefs:
              - CV030
              - CV031
              - CV032
