      - number: '5.4'
        title: 产品成熟度真实且在扩张，但底层可靠性和 AI 治理细节仍是关键投资验证缺口
        blocks:
          - type: paragraph
            body: >-
              合在一起，本次保留的证据支持一个产品结论：宽度正面、成熟度可信，但深层技术尽调仍不完整。Culture Amp 明显围绕一条多产品运营闭环出货：收集反馈、解读数据、对齐目标、开展评审、辅导管理者、发展员工。AI
              Coach 用敬业度和绩效上下文推动下一步最佳行动，而不是停在仪表盘上，从而抬高了平台野心。公开评价和编辑来源有助于平衡公司叙事。它们一致认可 Culture Amp
              的分析、基准和经过思考的员工体验工作流，但也指出实施、易用性和配置摩擦。这种组合对企业 HR 软件可信：差异化洞察可以和运营复杂度共存。剩下的担忧是，公开证据仍没有揭示 API
              限制、按模块拆分的详细发布节奏、uptime 历史或模型治理细节。因此，投资者可以判断产品真实存在且战略上自洽，但若没有私下尽调，还不能给出企业级技术保证。
