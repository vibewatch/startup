  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、规模主张与地理布局
        blocks:
          - type: paragraph
            body: >-
              Culture Amp 现在的定位已经不只是单点问卷工具。官网和定价页都在营销一套完整的 CultureOS，把员工敬业度、绩效、发展和 AI Coach
              合在一起；信任、基准和公司页面也在强化同一件事：平台卖的是企业级工作流基础设施，而不是轻量 HR 插件。公司的公开规模主张也足以影响后续章节：官网称 6,000 多家机构、25 million
              名员工使用平台；关于页面列出 6,000 多家客户、70.5 thousand 多份已发起问卷、13 million 多份回复和 594.3 million 多个已回答问题；基准页面称基准层覆盖超过 one
              billion 份问卷回复。这些数字支撑了真实装机基础和数据网络故事，但仍是公司自己发布的指标，不是经审计披露。地理布局有更好的旁证：招聘和办公中心灵活性页面确认总部在 Melbourne，并列出
              Sydney、San Francisco、New York、Chicago、London、Berlin 和 Austin 等运营中心；2022 年 Berlin 办公室启动也用带日期证据锚定了欧洲扩张。
