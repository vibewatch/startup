      - number: '4.2'
        title: 公开牵引力、结果证明和不完美的效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公司确实提供了强有力的定性证据，说明客户购买 Culture Amp 是为了结果，而不只是合规打卡。Unifonic 案例研究称持续员工生产力提高 30%；OLX 称重大组织变革期间敬业度提升
              11%；NASCAR 报告 L&D 周期时间缩短 30%，问卷完成量增加
              107%。这些不是经审计财务报表，但显示了产品的销售方式：作为提升生产力、留存、领导力有效性和组织适应速度的杠杆。评价平台提供了第二层代理证据。TrustRadius
              用户认可分析深度和基准能力，但指出集成和易用性摩擦；SoftwareReviews
              报告较高的推荐意愿、续订计划和成本价值评分；第三方评测摘要强调行动规划、集成和持续倾听。这些都不能替代获客成本（CAC）、回本周期或净留存率（NRR）披露，但说明 Culture Amp
              的价值主张绑定在可衡量的人才结果上；如果客户真的把工具落进日常运营，这些结果可以支撑增购和续约。
