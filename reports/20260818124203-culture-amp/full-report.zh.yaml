      - number: '2.2'
        title: 需求驱动、采用紧迫性和最大采用约束
        blocks:
          - type: paragraph
            body: >-
              这个品类的需求信号异常扎实，因为职场问题始终顽固。Gallup 的 2026 State of the Global Workplace 报告称，全球员工敬业度已降至 20%，低敬业度让全球经济损失约 $10
              trillion 生产力；2024 至 2025 年，管理者敬业度也从 27% 急降到 22%。这些数字为更好的员工倾听和行动系统提供了持久经济理由。与此同时，McKinsey、Mercer 和 Deloitte
              都把劳动力技术放进更广的人机转型里：McKinsey 称 92% 的公司计划增加 AI 支出，但只有 1% 自认为成熟；Mercer 的 2026 年调查覆盖 16 个地理区域和行业、近 12,000
              名利益相关者；Deloitte 则称 2026 年是工作设计的拐点。不过，采用并不顺滑。Microsoft 对 Glint 设定 50 个 seat
              下限、对回复数量设置隐私阈值，并采用高度依赖伙伴的部署模式，说明企业级销售动作很复杂。Qualtrics 自己也认为年度问卷太慢，意味着买家是在同时解决工具和组织变革两个问题。
