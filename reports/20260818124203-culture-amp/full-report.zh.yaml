      - number: '2.3'
        title: 买方、用户、付款方，以及 HR 痛点走向预算批准的路径
        blocks:
          - type: paragraph
            body: >-
              这个市场是多边的。HR 负责人通常拥有痛点定义，但用户和付款方地图会很快扩展。Microsoft Viva Glint 描述的是由领导层推动、认证伙伴支持的全组织问卷；Workday Peakon
              则把留存、DEI、幸福感和转型结果卖给想要企业变革项目的高管，而不是只卖一次性反馈工具。Lattice、15Five、Leapsome 和 Engagedly 又把采购动作拓宽一步，把敬业度接到
              1:1、目标、反馈、认可和管理者工作流上，从而把一线管理者，有时还包括收入或运营负责人，拉进采购流程。Culture Amp
              自己的基准和基准报告页面说明，买家想要的是上下文和可行动性，不只是数据收集。实践中，预算往往在 CHRO 或人力团队手里，但采用还需要管理者使用、IT
              或安全审批以及高管背书，因为保密阈值、集成和变革管理投入都很重要。这种结构偏向能证明工作流深度和集成成熟度的厂商，而不是只证明问卷完成率的厂商。
