        - CHRO 与业务负责人
        - 关键在于 Culture Amp 现在销售范围已从调研扩展到绩效和发展。
      - - 人力分析 / 留存洞察
        - 基准对标、流失洞察、经理行动建议
        - 没有 HR 工作流语境的通用 BI 工具
        - 人力分析负责人 / HR 领导层
        - 重要差异化在于供应商卖的是可行动分析，而不只是数据存储。
      - - HCM 套件中的 EX
        - HCM、协作和 ERP 合同中打包的员工之声
        - 核心记录系统交易本身
        - HRIT / CIO / 采购
        - 来自 Workday、Microsoft 和 SAP 的主要打包威胁。
      - - 学习与发展邻近品类
        - 辅导、职业路径、能力模型、经理赋能
        - 独立 LMS 内容库
        - L&D / HRBP / 业务负责人
        - 当发展数据连接到敬业度时，支撑 Culture Amp 增购。
      - - 咨询与变革服务
        - 人力科学咨询、实施、调研设计支持
        - 没有变革支持的纯技术转售
        - CHRO / 转型办公室
        - 原因是企业部署通常需要服务与软件并行。
    notes: 纳入和排除支出按工作流划分，而不是按 GAAP 定义的市场品类划分，因为公开来源描述的是相互重叠的套件，而不是一个干净分类。
