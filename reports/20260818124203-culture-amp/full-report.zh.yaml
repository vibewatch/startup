              组织法律敞口扩大、集成反复中断，或又一轮降本削弱产品和支持质量，当前风险状态会迅速恶化。反过来，如果私下证据显示事件率稳定、支持运营强、供应商控制集中、员工关系治理更干净，这个故事会大幅去风险。实际承销含义是：风险应被视为可管理，但尚未到低风险。公开来源足以让人相信
