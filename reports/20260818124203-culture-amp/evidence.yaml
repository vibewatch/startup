evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-year
    missingEvidence: >-
      A primary corporate or registry document that clearly distinguishes incorporation date, commercial launch year,
      and first revenue year.
    whyItMatters: >-
      Public sources currently point to 2009, 2010, and 2011, which can create timeline drift in later chapters and
      final profile fields.
    diligencePath: Pull ASIC or equivalent corporate-registry records and reconcile them with management materials.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: board-and-control
    missingEvidence: A current board roster, committee map, and summary of investor control rights after the CEO transition.
    whyItMatters: >-
      Leadership succession and valuation interpretation both depend on who actually controls the board and major
      reserved matters.
    diligencePath: Request latest board deck index, governance chart, and major investor-rights schedule.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: >-
      A current fully diluted cap table with share classes, liquidation preferences, anti-dilution terms, and
