  topStrengths:
    - Real customer and deployment proof across thousands of organizations and multiple verticals.
    - Broad product surface spanning engagement, performance, development, analytics, and AI-guided actioning.
    - Repeated institutional investor support through Series C to Series F.
    - Public trust and security documentation is stronger than that of many private SaaS peers.
  topRisks:
