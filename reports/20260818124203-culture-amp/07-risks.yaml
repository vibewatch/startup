- id: privacy-security-and-reliability
  title: Security controls are visible and credible, but public evidence is stronger on process than on operational outcomes
  body: One of Culture Amp’s best public strengths is that it exposes more trust-process detail than many private software peers. The trust portal, security pages, secure-development descriptions, and internal-environment notes together describe CI/CD security gates, OWASP training, peer review, code scanning, threat modeling, multi-cloud infrastructure, key management, just-in-time privileged access, endpoint detection and response, and SIEM-backed monitoring. The Slack app security sheet independently reinforces parts of that posture with encryption, MFA, access logging, and explicit deletion practices. Those are meaningful mitigations. They do not close the reliability case. The public record still does not provide strong uptime commitments, incident frequency, MTTR, red-team outcomes, or AI-evaluation evidence for the newest product surfaces. For a platform promising confidentiality and actionable people insight, that gap matters because the downside from a privacy or reliability failure
    would land directly on employee trust and customer willingness to keep using the product.
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
