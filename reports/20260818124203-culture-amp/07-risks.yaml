- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy or confidentiality failure
    - Confirmed incident or regulator action
    - Any material exposure of employee feedback or personal data
    - Pause underwriting or demand strong remediation evidence.
  - - Reliability or integration failure
    - Repeated cycle-critical outages
    - Two or more deadline-affecting incidents without transparent fix path
    - Increase risk discount and re-test customer durability.
  - - AI governance breakdown
    - Customer or legal issue tied to AI output or data use
    - Substantiated safety, bias, or misuse event
    - Reassess product differentiation versus liability.
  - - Execution stress from layoffs
    - Support or onboarding metrics deteriorate after headcount cuts
    - Rising backlog, slower response, or increased churn reasons tied to support
    - Lower confidence in operating leverage thesis.
  - - Legal and people-governance stress
    - Adverse court finding or repeated workplace-rights complaints
    - Escalating litigation or governance failures in AI org
    - Increase governance risk weighting materially.
  - - Financial pressure
    - Another major markdown or worsening burn without offsetting growth
    - Further investor write-down or cash-pressure signals
    - Treat valuation and roadmap assumptions more conservatively.
  notes: Kill criteria focus on monitorable events that would directly change the investment case rather than generic cautionary language.
