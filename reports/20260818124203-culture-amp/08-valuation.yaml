- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Renewed major layoffs
    - Another large workforce reduction after the 2026 cuts
    - Signals weaker operating leverage and possible support degradation
    - Move stance more negative unless offset by strong profitability proof.
  - - Burn worsens or runway shrinks
    - Losses deepen or cash pressure reappears materially
    - Undercuts premium case and increases financing-risk discount
    - Lower supportable valuation range.
  - - Retention proves weaker than implied
    - Private diligence shows weak GRR, NRR, or high support-heavy churn
    - Breaks the software-quality thesis
    - Re-rate toward lower multiple framework.
  - - AI or governance issue escalates
    - Litigation broadens or AI monetization disappoints materially
    - Damages optionality thesis around the newest product surfaces
    - Increase governance and execution risk weighting.
  - - Cap-table structure is unfavorable
    - Preferences, overhang, or dilution materially worsen economics for new money
    - Reduces realized upside despite plausible enterprise value
    - Demand a lower entry or pass.
  notes: Triggers focus on events that would directly alter present value or downside protection, not generic concerns.
