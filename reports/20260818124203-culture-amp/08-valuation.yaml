- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Gross margin and services mix
    - No public gross margin or subscription/services split
    - Margin quality determines whether a premium software multiple is justified
    - CFO and board materials
  - - Retention quality
    - No public GRR, NRR, or cohort churn
    - Durability is the most important unknown beneath the current mark
    - CFO or customer-success leadership
  - - Cap table and preferences
    - No public liquidation stack or preference terms
    - Private-company economics can diverge materially from headline enterprise value
    - General counsel and financing docs
  - - Customer concentration
    - No public top-customer or vertical revenue concentration
    - Logo breadth does not equal economic diversification
    - Finance or RevOps
  - - Support and implementation burden
    - No public support metrics after layoffs
    - Services burden can compress margins and retention quality
    - Customer-success and operations leaders
  notes: These asks represent the minimum pack needed to move from research-more to a higher-conviction investment view.
