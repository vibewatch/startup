  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: CAC, payback, channel mix, and pipeline-conversion data by segment.
    whyItMatters: Without sales-efficiency metrics, growth quality and burn sustainability cannot be underwritten cleanly.
    diligencePath: Request board or planning decks with CAC, payback, funnel conversion, and partner-sourced pipeline contribution.
    relatedQuestionRefs:
    - QI009
    - QI025
  - type: private-evidence-only
    severity: material
    topic: gross-margin-gap
    missingEvidence: Gross margin by product family and services contribution to cost of delivery.
    whyItMatters: Margin profile determines whether Culture Amp is a scalable software asset or a heavier services-assisted model.
    diligencePath: Request audited gross margin bridge and software versus services revenue split.
    relatedQuestionRefs:
    - QI019
    - QI023
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: GRR, NRR, churn, expansion, and cohort retention by segment and module.
    whyItMatters: Retention quality is the key support for any late-stage software valuation, especially after a markdown.
    diligencePath: Request renewal dashboards and cohort analyses for the last eight quarters.
    relatedQuestionRefs:
    - QI018
    - QI024
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Revenue mix across subscriptions, services, and AI or consulting add-ons.
    whyItMatters: Mix influences gross margin, expansion logic, and how durable the headline ARR story really is.
    diligencePath: Request management P&L split by product and service line.
    relatedQuestionRefs:
    - QI022
    - QI026
