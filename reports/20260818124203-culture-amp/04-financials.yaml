- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Best available proxy
  - Next diligence ask
  rows:
  - - Gross margin
    - Separates software leverage from service burden
    - Undisclosed
    - Case-study and review evidence suggest value but not cost structure
    - Request audited gross margin by product family.
  - - NRR / GRR
    - Core retention and expansion proof
    - Undisclosed
    - Review renewal signals and multi-module packaging
    - Request logo churn, GRR, and NRR by segment.
  - - CAC / payback
    - Tests sales efficiency
    - Undisclosed
    - Case studies imply ROI, but not acquisition cost
    - Request CAC, blended payback, and CAC by channel.
  - - Cash-flow durability
    - Determines financing need
    - Public quotes only
    - Operating cash burn improved, but still negative
    - Request full cash-flow bridge and latest treasury position.
  - - Revenue mix by module / services
    - Explains quality and margin path
    - Undisclosed
    - Pricing and consulting page imply multiple streams
    - Request revenue split across subscriptions, services, and AI add-ons.
  - - Headcount efficiency
    - Links burn to operating leverage
    - Public count not canonical
    - Layoff reports and low-confidence database counts
    - Request ARR or revenue per employee trend.
  notes: This table is intentionally a diligence agenda, because public evidence is materially thinner than the scale narrative.
