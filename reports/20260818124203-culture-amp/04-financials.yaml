- id: reported-financials-capital-and-runway
  title: Reported financials, capital adequacy, and visible runway pressure
  body: 'The clearest public financial data come from secondary reporting on filed accounts. Startup Daily says Culture Amp generated US$177 million of FY2025 revenue, grew 10.8%, lost A$37 million in the year, and had cumulative FY2024-FY2025 losses of A$91.5 million. It also reports that net cash from operating activities improved from -US$14 million in FY2024 to -US$10 million in FY2025, deferred revenue increased 12% to US$94 million, and founder Didier Elzinga told Capital Brief the company still had US$36 million in the bank. AFR independently corroborates the slowdown path by reporting US$159.8 million of FY2024 sales and a deceleration from 32% growth in FY2023 to 19% in FY2024. Together with the 2025-2026 layoffs and Blackbird markdown, that paints a classic late-stage reset: still growing, still material in scale, but under pressure to improve operating leverage and defend the private-market mark. Public evidence is therefore good enough to say the company has real revenue scale,
    not good enough to say it has proven durable cash generation.'
  claimRefs:
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
  - CI026
