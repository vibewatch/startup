  topStrengths:
    - 面向消费者的预防性健康服务覆盖 160 多项生物标志物，并提供可选影像检查。
    - Mark Hyman 带来的品牌与分发杠杆，加上 Quest 支持的采样基础设施。
    - 外部资本获取能力强，公开报道的规模增长迅速。
  topRisks:
    - 经审计财务数据、GAAP 收入、利润率和 CAC / 回本周期仍未披露。
    - 各公开来源中的会员数与实际 ARPU 尚未完全对账。
    - 临床有效性与后续过度治疗风险的公开证据仍不足。
    - 监管问题和收购后的整合问题仍未解决。
  unresolvedGaps:
    - 经审计财务报表、GAAP 收入、各 cohort 的贡献利润以及 CAC / 回本周期均未披露；$100M ARR 无法独立核实
    - 任何细分市场都没有公开披露留存指标（NRR、GRR、流失率、复购率、cohort 续费率）
    - 实际 ARPU（约 $100）与 $499 标价之间无法对账；折扣结构、免费试用 cohort、合作伙伴补贴会员及非完整年度的会计处理均未公开
    - Function Medical Intelligence 的临床证据基础（敏感度、特异度、后续过度治疗率）尚未发表于同行评审文献
    - 2025 年法院撤销 FDA LDT 规则后的监管立场，以及 FTC 就 Mark Hyman 大使角色依据背书指南进行的任何往来，均未披露
    - Ezra（2025 年 5 月）和 Getlabs（2026 年 4 月）收购的整合经济性、会员重叠及增量 ARPU 贡献均未披露
    - 2025 年 11 月 $298M B 轮融资的资金用途，除“AI 平台和品类扩张”的高层表述外，具体细节尚未公开
