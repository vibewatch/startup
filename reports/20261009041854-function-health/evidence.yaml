evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-retention
    missingEvidence: >-
      Audited GAAP financial statements, ARR reconciliation, cohort churn, NRR, GRR, CAC payback, active-member
      definitions, and a reliable current headcount are not publicly disclosed.
    whyItMatters: >-
      Without audited statements and cohort definitions, Sacra's $100M revenue run-rate estimate cannot be treated as
      ARR or independently reconciled to paid and retained membership.
    diligencePath: >-
      Request the management financial package, quarterly income statements, revenue-recognition policy, cohort renewal
      analyses, workforce roster, and verified CAC-to-LTV metrics in a closed data room.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: structured-debt-terms
    missingEvidence: >-
      Detailed credit agreement, interest structure, revenue-share percentages, and seniority terms of the $450M General
      Catalyst Customer Value Fund financing are not public.
    whyItMatters: >-
      The financing's instrument type, amounts drawn, repayment formula, security, and covenants determine cash
      availability and equity risk; the announcement-sized figure alone does not.
    diligencePath: >-
      Obtain the Customer Value Fund facility agreement, repayment schedules, revenue sweep formulas, and intercreditor
      agreements.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: governance-and-control
    missingEvidence: >-
      A complete current board roster, committee memberships, voting rights, founder ownership, preferred-stock
      protections, and executive succession plan are not public.
    whyItMatters: >-
      One disclosed investor board member does not establish control, minority protections, succession readiness, or the
      rights attached to later financing.
    diligencePath: >-
      Request the current cap table, charter, bylaws, voting agreements, board and committee roster, option pool, and
      succession materials.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: regulatory-and-legal-record
    missingEvidence: The assigned adverse query returned no regulator, court, enforcement, or incident URL addressing Function Health.
    whyItMatters: >-
      Analyst discussion of regulatory and false-positive risk does not establish the company's actual legal,
      enforcement, or incident history, while absence from this search is not proof of absence.
    diligencePath: >-
      Run jurisdiction-specific regulator, court-docket, attorney-general, privacy-breach, and medical-board checks in a
      subsequent authorized search allocation.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A sourced count of eligible US buyers, willingness-to-pay by segment, and geographic availability sufficient to
      define a serviceable market.
    whyItMatters: >-
      Without a bounded population and spend denominator, global category forecasts cannot support Function-specific
      SAM, SOM, or market-share claims.
    diligencePath: >-
      Obtain management's market model and validate its population, geography, exclusions, pricing, and conversion
      assumptions against independent consumer-spending data.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: renewal-and-attachment
    missingEvidence: >-
      Cohort renewal, gross retention, testing completion, imaging attachment, and channel conversion by acquisition
      cohort.
    whyItMatters: >-
      The evidence shows acquisition capacity but not whether members renew or expand spend after receiving an initial
      baseline.
    diligencePath: >-
      Request anonymized monthly cohorts with paid starts, completed draws, first renewal, second renewal, add-on
      purchase, acquisition cost, and contribution margin.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
