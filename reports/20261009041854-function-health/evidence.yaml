      Public figures above 500,000 conflict with a 300,000-to-450,000 analyst estimate, making obtainable scale and
      revenue estimates unstable.
    diligencePath: >-
      Reconcile billing-system active paid accounts to completed annual testing cycles at quarter end and separate
      sponsored, discounted, and full-price users.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
