callouts:
  - calloutType: "recommendation"
    title: "Investment Stance: Track Pending Retention Proof"
    body: "Function Health demonstrates exceptional top-of-funnel consumer health momentum, having built a recognizable brand, achieved an estimated $100M+ ARR run-rate, and secured $450M in innovative customer acquisition financing from General Catalyst. However, trading at 15.2x to 22.8x core ARR places the company at a substantial premium relative to both diagnostic infrastructure providers and digital health subscription peers. Because annual cohort retention, GAAP unit economics, and long-term diagnostic compliance remain unverified by audited disclosures, investors should maintain a disciplined track stance until second-year renewal rates and contribution margins are demonstrably established."
    claimRefs:
      - "CV007"
      - "CV008"
      - "CV010"
      - "CV012"
  - calloutType: "risk"
    title: "Contingent Encumbrance Under CVF Structure"
    body: "While General Catalyst's $450M Customer Value Fund financing avoids cap-table dilution and board seat reallocation, it creates a formal balance-sheet liability tied directly to member cohort revenues. If customer acquisition efficiency declines or cohort churn exceeds initial underwriting models, the 12% to 20% capped return obligation will encumber a substantial share of gross profit, delaying full cash flow reversion to Function Health and restricting liquidity for proprietary clinical research and software development."
    claimRefs:
      - "CV002"
      - "CV005"
      - "CV008"
      - "CV013"
