chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Function Health 是一家总部位于 Austin 的私营消费者健康科技公司。Unify GTM 和 Silicon Valley Investment Club 将其成立时间定为 2021 年，而
              Forge 列为 2022 年，因此确切的法律成立日期应以设立记录核实，不能视为已确定。当前消费者产品为 $365 年费会员，包含两个检测周期内的 160+
              项实验室检测、临床医生审阅的解读以及可选影像检查。Function 将自己定位为科技公司，而非实验室或医疗服务提供者。检测可在 2,000 多个 Quest
              地点完成，也可上门采血，交付环节集中依赖第三方实验室基础设施。2025 年 5 月收购 Ezra 后增加了 $499、22 分钟的 MRI 产品；之后收购 Getlabs 和
              SuppCo，拓宽了采集和补充剂相关能力，但整合后的经济性未公开。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
