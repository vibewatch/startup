  - id: FE001
    title: Function Health 全栈诊断与数据运营架构
    type: stack
    summary: 六层架构模型展示诊断采集、物流、数据接入编排、语义治理、智能分析和会员交付层。
    data:
      layers:
        - label: 线下诊断采集
          detail: 覆盖全国的采集点，包括 2,000 多家 Quest Diagnostics 患者服务中心、Quest 参考实验室和 200 多家合作影像诊所。
        - label: 移动物流与上门采血
          detail: 整合 Getlabs 移动采血网络，提供家庭和企业办公室样本采集、冷链处理及快递调度。
        - label: 数据接入与管线编排
          detail: 自动化的事件驱动管线接入 HL7/FHIR 实验室结果和 DICOM 影像文件，并通过 AWS 和 GCP 上的 Apache Airflow 编排。
        - label: 语义治理与数据湖仓
          detail: 基于 Databricks Unity Catalog 和 Delta Lake 构建集中式单一事实来源语义层，执行符合 HIPAA 的 PHI 数据契约。
        - label: 医疗智能实验室（MI Lab）
          detail: 生成式 AI 多模态推理引擎，将连续生物标志物和影像扫描与最佳功能基线进行比较，并交由医生审核。
        - label: 会员应用与 AI 集成
          detail: 跨平台 Vue.js 网页和移动应用，配备临床医生审核仪表盘，并通过安全连接器接入 ChatGPT Health 和 Microsoft Copilot。
    approximationNotes: 架构综合自工程招聘信息、公司平台更新和临床系统文档。
    claimRefs:
      - CE002
      - CE011
      - CE012
      - CE013
      - CE015
  - id: FU001
    title: 客户采纳、参与和扩展旅程
    type: journey-map
    summary: 多阶段会员旅程，覆盖从首次获客到临床审核及高 ARPU 诊断服务加购。
    approximationNotes: 阶段反映标准商业入门流程、Quest 采血运营及附加服务定价层级。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
    data:
      items:
        - label: 获客与注册
          stage: 获客与注册
          touchpoints:
            - 数字营销与创始人渠道推荐
            - 选择 $365 年度订阅层级
            - 填写生活方式和补充剂相关健康问卷并完成入门
          sentiment: positive
        - label: 样本采集
          stage: 样本采集
          touchpoints:
            - 在 2,000 多家 Quest Diagnostics 患者中心预约
            - 现场采血，最多抽取 20 管血液
            - 可选 Getlabs 上门移动采血
          sentiment: neutral
        - label: 结果交付与洞察
          stage: 结果交付与洞察
          touchpoints:
            - 数字仪表盘发布 160 多项生物标志物结果
            - 最多八页的临床医生审核生活方式建议
            - Function Medical Intelligence AI 跟踪
          sentiment: positive
        - label: 扩展与加购
          stage: 扩展与加购
          touchpoints:
            - 下单全身 Ezra AI MRI 扫描（$499）
            - 下单心脏与肺部 CT 扫描（$349）
            - 专项抗体和自身免疫面板（$69 至 $549）
          sentiment: mixed
        - label: 年度复测
          stage: 年度复测
          touchpoints:
            - 6 个月时进行第二次 60 多项指标复查
            - 首年年度续费提醒（$365/年）
            - 对照未经验证的 cohort 流失率，复盘长期趋势
          sentiment: neutral
        - label: 长期留存
          stage: 长期留存
          touchpoints:
            - 多年生物标志物对比仪表盘
            - 如果基线结果仍属正常，用户可能流失
            - 转入雇主赞助的福利保障
          sentiment: mixed
  - id: FR001
    title: 风险严重性与可能性评估矩阵
    type: matrix
    summary: 按可能性和潜在业务影响，对运营、监管、合作伙伴及财务风险进行分类评估。
    approximationNotes: 评估参考已发布的临床共识警示、诊断平台单位经济学和合作伙伴集中度画像。
    claimRefs:
      - CR001
      - CR003
      - CR006
      - CR007
      - CR011
      - CR014
      - CR015
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 高可能性
          values:
            - 样本采集排期出现小幅延迟
            - 各州特定的实验室处理费（NY/NJ）
            - 无症状偶发发现及后续临床焦虑
            - 消费者检测疲劳与未经验证的年度会员流失
        - label: 中等可能性
          values:
            - 二级诊所 MRI 维护积压
            - 各州消费者健康数据隐私审计（WA MHMD）
            - CVF 融资义务下受约束的 cohort 现金流
            - 与 Quest Diagnostics 重新谈判合同或费用上涨
        - label: 低可能性
          values:
            - API 集成短暂中断
            - SuppCo 补充剂标签验证难题
            - FTC 对大使背书的调查
            - PHI 湖仓发生灾难性健康数据泄露
        - label: 极低可能性
          values:
            - 门户软件常规补丁延迟
            - 消耗性纸质申请单短缺
            - 医生网络地域重组
            - 联邦法律禁止消费者直接订购实验室检测
        - label: 偶发可能性
          values:
            - 采血人员临时交通取消
            - 生物标志物参考区间校准调整
            - 第三方单点登录延迟
            - 商业保险方全面拒绝承保全身 MRI 而引发诉讼
        - label: 有条件的可能性
          values:
            - 局部快递运输受天气影响中断
            - 区域实验室样本改道延迟
            - 关联医生执照续期积压
            - 长期会员 cohort 流失超过同比 50%
  - id: FV001
    title: 估值与投资判断决策流程
    type: flow
    summary: 将运营规模、资本结构、可比公司倍数、情景风险和尽调要求串成逻辑链，最终导向投资建议。
    data:
      nodes:
        - id: scale
          label: 1. 运营规模：500K+ 会员、$100M–$164M ARR 运行率、已完成 50M+ 次检测
        - id: capital
          label: 2. 资本结构：$298M B 轮，估值 $2.5B；$450M 非稀释性 GC CVF 增长轮
        - id: multiples
          label: 3. 估值溢价：15x–23x ARR，较实验室同行（2x）和远程医疗同行（2.5x）大幅溢价交易
        - id: scenarios
          label: 4. 情景风险画像：悲观情景 ARR 压缩（$130M–$160M）对比乐观情景扩张（$350M+）
        - id: risks
          label: 5. 结构性阻力：未经验证的 cohort 留存、CVF 现金流约束、对过度诊疗的反弹
        - id: decision
          label: 6. 决策立场：高度确信地跟踪；待单位留存情况明确后再入场
      edges:
        - from: scale
          to: capital
        - from: capital
          to: multiples
        - from: multiples
          to: scenarios
        - from: scenarios
          to: risks
        - from: risks
          to: decision
    approximationNotes: 流程图展示定性分析推进过程；节点指标反映当前已发布数据和行业估算 [CV001, CV002, CV007, CV008, CV010, CV014]。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV008
      - CV010
      - CV013
      - CV014
