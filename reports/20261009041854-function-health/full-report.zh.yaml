            title: 客户队列留存完全不透明
            body: >-
              Function Health 会员超过 500,000、收入运行率达到
              $100M，但没有发布任何队列留存或续费数据。平台依赖自费消费者支付而非标准健康保险报销；如果健康订阅者在基线年度后出现检测疲劳，长期客户终身价值尚未证实。
            calloutType: risk
