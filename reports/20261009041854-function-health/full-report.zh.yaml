            body: >-
              公开规模证据只能说明方向，未经审计。Sacra 估算 2025 年 2 月收入运行率为 $100M，同比约增长 450%，并称截至 2025 年 5 月会员超过 200,000。该指标既不是披露的 GAAP
              收入，也不是 ARR。Value Add VC 后来报告会员超过 500,000，自 2023 年上线以来记录的实验室检测超过 100 million，但未定义活跃、付费或留存会员。Function
              当前自有页面称已交付超过 75 million 个结果、拥有 2,000 多个检测地点，这与累计检测次数使用的分母不同。员工数也未厘清，因为一个资料同时显示 50 名员工和另一项 602 人估算。Sacra 和
              Value Add VC 将监管不确定性、假阳性后续处理及自费需求列为风险；指定的负面查询没有返回监管或法律记录，这只是证据缺口，不代表不存在事件。
