  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险态势
        blocks:
          - type: paragraph
            body: >-
              Function Health
              处于复杂的多司法辖区医疗监管环境中，业务同时涉及直面消费者（DTC）实验室开单、医学影像监管和健康数据隐私。公司将运营组织为医疗科技软件实体，而非持牌医疗机构或临床实验室，并把诊断检测开单和结果解读外包给关联医生网络及独立合作设施。在数据治理上，Function
              的隐私文件明确承认，公司及其企业关联方在特定企业项目中可能作为 HIPAA 业务伙伴运营，但 HIPAA 保护不适用于其数字平台直接收集的所有消费者个人健康数据。在 New York、New Jersey 和
              Rhode Island 等对直达检测有严格法规的州，该模式面临特定监管风险，这些州要求特定临床开单流程、医生审阅和法定处理费。因此，在州级消费者健康数据法规不断演进的背景下，公司持续面临隐私合规风险，例如
              Washington 的 My Health My Data Act 和 California 的 CCPA/CPRA。此外，临床界仍在争论无症状全身 MRI
              筛查和广泛生物标志物面板的证据基础，可能因预防性健康声明和医生大使背书而引发 FTC 消费者保护审查风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
      - number: '7.2'
        title: 运营物流、偶发发现连锁反应与信息安全
        blocks:
          - type: paragraph
            body: >-
              平台的运营完整性依赖复杂的实体样本物流、先进影像排期和多模态软件处理，同时不拥有实体设施。样本采集路径带来明显运营脆弱性：Function 收购 Getlabs 提供上门采血，并与 Quest
              Diagnostics 在 2,000 多个患者中心合作，提升了采集便利性，但采血依从性仍是关键运营闸门，初始基线检测最多需要 20 管血。临床上，广泛的多面板生物标志物筛查（160+ 项）叠加全身 MRI
              和低剂量 CT，会显著暴露于假阳性、偶发瘤和无法行动的解剖异常。American College of Radiology
              及传统医学专业协会多次警告无症状成年人不应常规接受全身筛查，因为它可能触发侵入性、昂贵且引发焦虑的后续诊断，例如活检和重复影像，把未获补偿的分诊负担转嫁给基层医生。技术基础设施层面，Function 通过
              Medical Intelligence Lab 整合高容量生物标志物数据库、DICOM 影像档案和生成式 AI 接口，因此面临存储高度敏感的纵向个人健康记录所固有的系统性网络安全和数据泄露风险。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
