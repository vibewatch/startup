            body: >-
              为缓解消费者获客摩擦上升，Function 正通过 Aon、Mercer 和 WTW 等员工福利顾问建立企业分销管道，同时与 Equinox、NBPA 和 John Hancock 合作。从纯 DTC
              获客转向补贴型企业覆盖，是 Function 改善客户持久性的主要机制。
