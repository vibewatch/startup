      - number: '3.3'
        title: 经济护城河、定价动态与替代风险
        blocks:
          - type: paragraph
            body: >-
              Function Health 的主要竞争优势来自规模驱动的采购经济性和消费者品牌认知，而非专有诊断技术或临床排他性。通过聚合数十万会员，Function 在 Quest Diagnostics 全国
              2,000+ 个患者服务中心网络上谈下批量检测折扣，把单项检测成本压到碎片化竞争者或自费住院患者之下。品牌分发还受到有机名人渠道的强力加持，包括联合创始人 Mark Hyman 博士的社交影响力、与 NBPA
              的运动合作以及与 Equinox 的健康联盟。不过，Function 的商业模式在客户留存和差异化持久性上存在结构性脆弱点。Function
              严格来说只是诊断信息层：它识别生物标志物异常并生成临床医生审阅的评论，但不开药、不安排确认性诊断检查，也不提供纵向临床治疗。这一护理缺口让会员必须依赖外部基层医生或功能医学从业者采取行动，对期待完整护理闭环的用户造成摩擦。定价压力也在加剧。Function
              将基础会员价格调整为每年 $365（低于最初标出的 $499），但促销折扣、推荐激励和雇主补贴经常压低实际实现价格。Empirical Health（一次性
              $190）和非捆绑折扣服务表明，原始生物标志物面板持续承受通缩压力。此外，完成初始基线和 6 个月复查后，若订阅者的生物标志物保持稳定，就会出现订阅疲劳，开始质疑没有临床干预时年度会员的持续价值。Function
              收购 Ezra、Getlabs 和 SuppCo，是扩大会员钱包份额、打造抗商品化一体化生态的防御性动作。
