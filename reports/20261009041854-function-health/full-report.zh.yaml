      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              品类增长受消费者对主动检测的兴趣、更广泛的诊断服务直达渠道，以及现有实验室网络分发的支持。Function 还获得 General Catalyst Customer Value Fund 提供的 $450
              million 增长融资；报道显示，该工具为销售和营销提供资金，并从这些支出带来的客户价值中获得封顶比例。融资能力可以加速获客，但已募集资金既不是市场需求，也没有证明可自由使用。约束同样明显：Forbes 和
              EMARKETER 描述了一个拥挤的品类，存在类似实验室合作和定价压力；一篇亲身评测则称信息过载，且两次检测之间缺少行动指导。EMARKETER 和 ValueAddVC
              还保留了对广泛筛查导致假阳性、焦虑和后续成本的担忧。在没有披露队列续费、增购率、获客经济性或核对后的会员数之前，估值不应把全球品类预测资本化为已签约收入。
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM014
              - CM016
