        - 商业模式显著暴露于基线检测后的会员流失、对 Quest Diagnostics 的轻资产依赖、临床过度诊断反噬及 CVF 抵押负担 [CV008, CV013, CV014]。
        - 需要激进的下行情景评估；终止投资标准应聚焦续费下滑及合作伙伴合同修订 [CV014]。
      - - 估值立场
        - 偏高
        - 核心 ARR 的隐含估值倍数为 15.2x 至 22.8x（$110M-$164M ARR 对应 $2.5B），相较诊断（1.6x-2.0x）及数字健康（2.5x）同业溢价显著 [CV008, CV010]。
