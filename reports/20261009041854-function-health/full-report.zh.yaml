  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的支出
        blocks:
          - type: paragraph
            body: >-
              Function Health 的核心市场是消费者自费购买预防性实验室检测、解读和纵向结果追踪。其条款称 Function
              促成第三方实验室服务，但不自行提供医疗建议、诊断或治疗；该服务也不是健康保险。当前官方产品为每年 $365，包含 160+
              项年度检测，至少分两个检测轮次完成。因此纳入支出从会员费开始，并可能延伸至另行收费的影像或其他检测。保险覆盖的诊断护理、医生治疗、处方和住院服务不在边界内。现状替代方案包括医生开具的实验室检测和完全不做主动检测；相邻支出包括自费影像及其他健康服务。这个边界避免把所有诊断或数字健康支出都当作
              Function 可触达的需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
