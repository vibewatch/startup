      - number: '3.2'
        title: 竞争者规模、战略画像与能力
        blocks:
          - type: paragraph
            body: >-
              预防性诊断领域的直接及相邻竞争者，在资本结构、规模画像和护理整合策略上各不相同。Function Health 已在会员量上建立品类领先地位，会员超过 500,000，截至 2026 年记录的实验室检测超过
              100 million。公司通过大额融资支撑这一规模，包括 2025 年 11 月以 $2.5 billion 估值完成的 $298 million Series B，以及 2026 年 7 月来自
              General Catalyst Customer Value Fund 的后续 $450 million 非稀释性增长融资。为抵御商品化，Function 推进纵向整合：2025 年 5 月收购 AI
              影像初创公司 Ezra，推出全身 MRI 增值服务；2026 年 4 月收购移动采血服务商 Getlabs；2026 年 5 月收购补充剂平台 SuppCo。Superpower 是 Function
              最直接的风投支持同业，标准价格点相近（每年 $349 至 $499），覆盖 100+ 项生物标志物，强调与护理团队双向沟通、可穿戴设备接入和精选健康产品分发。竞争已从商业竞争升级为法律冲突：Function 于
              2026 年 1 月在加州中区联邦法院起诉 Superpower，依据 Lanham Act 指控虚假广告和不正当竞争，显示品牌摩擦和获客竞争激烈。InsideTracker 面向运动员和注重表现的消费者，提供约
              20 至 48 项生物标志物的分层检测套餐。它不强制年度订阅，而是强调算法化的生活方式和营养干预规则；但每项生物标志物成本更高，对希望反复进行综合监测的会员而言经济性较差。与此同时，Private MD Labs
              等折扣服务通过非捆绑检测菜单变现，软件抽象很少，服务于直接访问检测法律较宽松州的自助消费者，但在 New York、New Jersey 和 Massachusetts 等监管严格的司法辖区仍受限制。
