            body: >-
              Function Health 以全身生物标志物诊断检测为核心，采用直面消费者的医疗会员模式。产品最初定价每年 $499，但管理层于 2025 年 11 月将标价降至每年 $365（每天
              $1），以加速大众消费者采用。年度订阅包含每年两次血液面板，覆盖 160+ 项生物标志物：先做 100+ 项基线检测，3 至 6 个月后再做 60+ 项标志物复检。除基础会员费外，Function
              还建立了毛利更高的诊断和治疗增值服务收入。2025 年 5 月收购 Ezra 后，公司推出全身 MRI，会员增购价 $499 至 $899，覆盖全国 200 多家合作影像中心；同时提供 $349 的 Heart
              and Lungs CT。2026 年初，公司通过合作推出 GRAIL 的 Galleri 面板，以 $949 提供多癌种早期检测。B2B 和企业合作是补充消费者渠道的新兴扩张方向。Function 已与
              Equinox（补贴价 $249 的首年服务，支持 EQX ARC）、John Hancock Vitality PLUS、National Basketball Players
