      - number: '7.3'
        title: 合作方集中、单位经济性持久性与融资负债
        blocks:
          - type: paragraph
            body: >-
              Function Health 的轻资产模式把交易对手风险集中在少数关键基础设施合作方，同时暴露于消费者可自由支配支出的波动。公司在全国临床实验室处理上根本依赖 Quest Diagnostics；Quest
              网络发生合同中断、费用重定价或劳资纠纷，都可能立即中止核心检测交付。同样，Function 的影像层依赖区域合作影像设施，在约 200 个中心使用 Ezra 的 AI 方案执行扫描。财务上，Function
              快速扩张至估计 350,000 至 500,000 名会员和 $100M+
              收入运行率，面临严重的订阅者流失风险。年度会员费（$365/year）为自费且没有保险报销，得到正常结果或产生检测疲劳的订阅者可能在第一年后停止续费。General Catalyst Customer Value
              Fund（CVF）于 2026 年 7 月提供的 $450 million 增长融资进一步放大了这一留存动态。CVF 融资要求以特定客户队列产生的参考收入中一个封顶比例（通常为 12% 至 20%
              回报门槛）偿还，因此订阅者流失加剧或获客成本上升，会延长资本回收周期并占用未来运营现金流。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
