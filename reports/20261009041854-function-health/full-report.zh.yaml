          'y': 9.5
    approximationNotes: 坐标轴代表基于 2026 年能力审计的 1–10 序数评分。X 轴代表诊断广度（生物标志物和检测模态的数量）；Y 轴代表医疗整合度与处方深度。
    claimRefs:
