        title: 创始人、管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              已披露的创始团队覆盖商业、医疗、产品、技术和法律职能：Jonathan Swerdlin、Mark Hyman、Pranitha Patil、Mike Nemke、Seth Weisfeld 和 Daniel
              Swerdlin。Jonathan Swerdlin 仍任 CEO；Hyman 的医疗背景和公众曝光既带来分发杠杆，也形成关键人物风险，但指定资料池没有量化获客对任一创始人的依赖程度。管理层头衔曾变化：a16z
              在 2024 年称 Patil 为 COO，2026 年目录则称其为首席商务官；Function 于 2025 年 11 月宣布前 Slack COO Neil Shah 出任新 COO。Function 还任命
              Daniel K. Sodickson 为首席医学科学家。公司公告确认 a16z 合伙人 Daisy Wolf 是董事，但没有证明 Redpoint
              拥有董事席位。完整的现任董事名单、委员会架构、投票控制权和创始人持股情况仍不可得。
