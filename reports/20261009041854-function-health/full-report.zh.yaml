      - number: '2.2'
        title: 不制造虚假 TAM / SAM / SOM 的测算视角
        blocks:
          - type: paragraph
            body: >-
              最有价值的公开自上而下视角来自 Forbes：文章引用全球直面消费者实验室检测市场估算，2024 年为 $3.44 billion，2034 年为 $8.07 billion，CAGR 为
              8.90%。同一文章还引用 Newsweek 的另一项分析：2025 年 $3.62 billion，2030 年接近 $6 billion。这些是全球品类预测，保留文本没有披露底层方法；它们不是
              Function 特定的 TAM、美国 SAM 或可获得份额。自下而上的信号同样不一致：ValueAddVC 报告 2026 年 7 月会员超过 500,000，而 New Market Pitch 估计为
              300,000 至 450,000，并明确指出准确数目未披露。New Market Pitch 估算的年度会员收入区间为 $110 million 至 $164 million，依据是该会员区间和 $365
              价格，而非报告收入或 ARR。Sacra 另行给出的 2025 年 2 月 $100 million 数字标为收入运行率，而非 ARR。因此，计算 SAM 或 SOM 会制造虚假精确度。
