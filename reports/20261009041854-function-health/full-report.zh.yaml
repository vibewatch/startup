      - number: '6.3'
        title: 持久性、单位经济性与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              Function 的商业持久性受留存指标和合同续期信息高度不透明的限制。净收入留存率（NRR）、毛收入留存率（GRR）、年度续费率和纵向队列流失均未公开。此外，商业模式需要持续投入营销：General
              Catalyst Customer Value Fund 于 2026 年 7 月提供 $450 million 增长融资，通过自清偿、封顶收入分成机制支持 GTM
              支出，说明持续获客需要非稀释性的资产负债表保护。与此同时，Superpower Health 等竞争诊断平台加剧竞争，并因生物标志物定义引发联邦虚假广告诉讼，说明客户留存高度取决于消费者信任和对诊断正当性的感知。
            claimRefs:
