  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 预防性检测格局与品类结构
        blocks:
          - type: paragraph
            body: >-
              预防性健康检测市场包括直面消费者（DTC）的生物标志物订阅、非捆绑诊断折扣服务、全身影像专科服务和综合型高端医疗服务。Function Health 以高频检测订阅切入市场，核心是每年 100 至 160
              多项生物标志物，主要通过 Quest Diagnostics 患者服务中心采集。Function
              不自营实验室，也不雇用全职临床团队，而是作为轻资产技术编排层，把签约实验室采集、第三方医生开单网络和算法解读组合起来。订阅生物标志物领域的直接竞争者包括 Superpower 和
              InsideTracker。Superpower 在面板范围、价格和采集频率上接近 Function，同时试图凭借更丰富的临床沟通、持续可穿戴设备接入和下游补充剂商城差异化。相反，InsideTracker
              采用非捆绑的按检测交易结构，核心面板每项检测 $249，并提供算法化饮食和运动建议，而不要求持续多年订阅。除直接订阅同业外，Function 还承受相邻和替代模式的竞争压力。WalkinLab、Private
              MD Labs 和 Own Your Lab 等简化型检测折扣服务，以按项方式向消费者提供相同的 Quest 和 LabCorp 面板，让注重预算的消费者完全绕过年度会员承诺。与此同时，Empirical
              Health（一次性综合面板 $190）和 Goodlabs（符合条件的献血者可免费获得合作方生物标志物面板）等低价替代方案，持续压低入门价格预期。市场高端的 Fountain Life
              和高端长寿医疗机构，则把诊断直接与治疗医生、处方疗法和固定临床方案捆绑。传统基层医疗也构成持久的结构性替代：有保险患者可以以很低的自费成本获得常规代谢、血脂和甲状腺指标，但标准保险计划通常不覆盖
              ApoB、Lp(a) 和有毒金属面板等预防性专科检测，除非有记录在案的医疗必要性。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
