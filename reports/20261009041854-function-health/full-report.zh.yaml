      - number: '4.2'
        title: 成本结构、毛利与 GTM 效率
        blocks:
          - type: paragraph
            body: >-
              Function Health 采用轻资产运营模式，避免实体实验室和影像地产的大额资本开支。公司把样本处理外包给 Quest Diagnostics 全国 2,000+
              个患者服务中心网络，将固定的临床实验室间接成本转为可变销货成本。临床检测开单和结果审阅由签约的独立医生远程医疗网络处理，而非全职雇佣临床人员，因此保留了类似软件公司的高毛利潜力。历史上，获客成本（CAC）约为每名会员
              $300 至 $600，受 Mark Hyman 博士的社交媒体影响力、知名名人和运动员支持者及消费者口碑推动。但随着大众市场渗透需要更广泛的效果营销，获客效率开始面临阻力。2026 年 4 月收购
              Getlabs 移动采血业务、2026 年 5 月收购 SuppCo 补充剂验证业务，目的在于减少采血摩擦、提高复检依从性，并建立可重复的高毛利补充剂收入。尽管收入端毛利率表现有利，Function
              仍严重暴露于订阅疲劳和消费者流失。当年度生物标志物面板显示结果稳定或正常时，消费者续费 $365 或 $499
              自费订阅的意愿会明显下降。队列层面的净收入留存率（NRR）和年度订阅者流失率均未公开，这是机构投资判断的主要尽调缺口。
