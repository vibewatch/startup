      - number: '4.3'
        title: 资本充足性、非稀释性增长债务与财务结论
        blocks:
          - type: paragraph
            body: >-
              Function Health 已筹集大量机构资本，用于平台扩张和公司收购。公司于 2024 年完成 $53 million Series A，并于 2025 年 11 月由 Redpoint Ventures
              领投、以 $2.5 billion 投后估值完成超额认购的 $298 million Series B；Andreessen Horowitz Bio + Health、General Catalyst
              及知名私人科技投资者参与其中。2026 年 7 月，Function 从 General Catalyst 的 Customer Value Fund（CVF）获得 $450 million
              增长融资。与会重新定价公司估值或稀释现有股东的标准股权轮不同，这笔 CVF 交易属于与收入挂钩的增长融资。General Catalyst 为获批获客支出的 70% 至 85%
              提供资金，并仅通过这些特定客户队列产生的现金流中一个封顶比例（通常为 12% 至 20% 回报门槛）获得偿还。虽然这种非稀释结构保护了 Function 的 $2.5 billion
              估值基准，却让未来队列现金流背负高级自清偿偿还义务。如果会员留存走弱或 CAC 上升，偿债期限会延长，可供内部再投资的净现金生成减少。Function 的商业收入规模亮眼，但缺少经审计财务报表、GAAP
              披露和经验证的队列留存指标，无法完成机构层面的投资判断。
