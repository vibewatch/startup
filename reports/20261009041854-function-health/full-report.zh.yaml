      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 对 Quest Diagnostics 的单一来源依赖
            body: >-
              Function Health 的全国运营交付几乎完全依赖 Quest Diagnostics 的处理设施和 2,000+ 个患者服务中心。虽然 Function 已完成超过 50 million 次检测，但
              Quest 运营能力或收费表出现任何中断，都会构成无法由替代实验室网络迅速缓解的灾难性脆弱点。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
          - type: callout
            title: Customer Value Fund 融资造成队列负担
            body: >-
              General Catalyst 的 $450 million Customer Value Fund
              融资保护母公司股权免受稀释，却创造了与客户队列表现挂钩的结构化财务负债。如果会员流失加速或获客成本上升，队列收入需要更长时间才能达到 12% 至 20%
              的回报门槛，未来会持续被占用，从而压缩可用于平台再投资的净现金流。
            calloutType: insight
            claimRefs:
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与资本化背景
        blocks:
          - type: paragraph
            body: >-
              Function Health 已经在面向消费者的主动诊断领域建立起强势品牌：它把 160 多项生物标志物实验室检测、纵向生物特征跟踪和临床医生审核的可执行方案，打包进年度消费者会员服务，起初定价
              $499，后来调整为每年 $365（每天 $1）。公司资本化历程显示估值快速扩张，随后又以非稀释方式扩张资产负债表：完成种子轮和记录 3 million 次检测的 beta 上线后，Function 于 2024
              年 6 月获得 Andreessen Horowitz Bio + Health 领投的 Series A，投后估值 $191M；17 个月后，又于 2025 年 11 月获得 Redpoint Ventures
              领投的 $298M Series B，估值 $2.5B [CV001, CV002, CV006, CV007]。2026 年 7 月，Function 又从 General Catalyst 的
              Customer Value Fund（CVF）获得 $450M 增长融资，使股权融资与增长融资合计投入资本超过 $800M [CV002, CV003, CV004,
              CV008]。这笔融资采用非稀释型获客资本结构，把销售和营销支出隔离为与客户 cohort 匹配、可自我清偿的资产类别，将获客支出与资产负债表上的股权稀释脱钩，同时保留此前 $2.5B 的股权估值基准
              [CV005, CV008]。但这种非稀释资本结构也带来或有财务负债：在长期生命周期收入完全回归 Function Health 之前，General Catalyst 直接从 cohort
              产生的参考收入或毛利中收回本金，并取得 12% 至 20% 的封顶回报 [CV008]。              这种结构无需稀释股权结构表就能加速全国品牌扩张；但一旦会员留存或 cohort 的 CAC
              回收曲线恶化，就会占用现金流、拉长偿还周期，形成类似债务的现金流拖累，却没有正式的债务契约 [CV008]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
