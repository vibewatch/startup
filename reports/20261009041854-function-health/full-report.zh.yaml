      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              主要买方、用户和付款方是直接购买年度会员的个人；符合条件时可能使用 HSA 或 FSA 资金。Function
              的法律条款也允许企业会员由雇主、组织或其他第三方报销、补贴或支付，因此付款方和用户可以不同，但产品不会因此变成保险。Sacra 报告 Equinox、National Basketball Players
              Association、John Hancock
              和雇主福利等新兴渠道，但这些只是渠道案例，不是细分收入结构的证据。采用路径是数字化注册、通过第三方基础设施安排实验室检测、交付并解读结果，然后重复检测；另行购买的影像可扩大支出。便利性、广泛的标志物覆盖、税前支付资格和赞助都可能推动采用，但尚未厘清的是，用户了解初始基线后是否会续费。
            claimRefs:
              - CM002
