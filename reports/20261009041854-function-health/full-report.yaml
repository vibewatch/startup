      - number: '4.2'
        title: Cost Structure, Gross Margins, and GTM Efficiency
        blocks:
          - type: paragraph
            body: >
              Function Health maintains an asset-light operating model that avoids the heavy capital expenditures of
              physical laboratory and imaging real estate. By outsourcing specimen processing to Quest Diagnostics'
              national network of 2,000+ patient service centers, Function converts fixed clinical laboratory overhead
              into variable cost of goods sold. Clinical test ordering and results reviews are handled by contracted
              independent physician telehealth networks rather than full-time employed clinical staff, preserving high
              software-like gross margin potential.


              Customer acquisition costs (CAC) have historically trended between $300 and $600 per member, supported by
              Dr. Mark Hyman's social media presence, prominent celebrity and athlete backers, and organic consumer
              word-of-mouth. However, customer acquisition efficiency faces emerging headwinds as mass-market
              penetration requires broader performance marketing. The April 2026 acquisition of Getlabs mobile
              phlebotomy and the May 2026 acquisition of SuppCo supplement verification were executed to reduce draw
              friction, increase re-test compliance, and build recurring high-margin supplement revenue streams.


              Despite favorable top-line gross margin mechanics, Function's business model faces acute exposure to
              subscription fatigue and consumer churn. When annual biomarker panels reveal stable or normal findings,
              discretionary consumer willingness to renew a $365 or $499 out-of-pocket subscription declines sharply.
              Neither cohort-level net revenue retention (NRR) nor annual subscriber churn rates are publicly disclosed,
              representing a primary diligence gap for institutional underwriters.
            claimRefs:
              - CI002
              - CI004
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
