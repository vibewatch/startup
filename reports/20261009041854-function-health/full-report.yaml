  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Function Health delivers a direct-to-consumer health data platform centered on an annual subscription that
              costs $365 per year ($1 per day). The core service includes access to more than 160 lab biomarkers
              evaluated across biannual testing cycles, beginning with an initial panel of 100+ tests and a follow-up
              panel of 60+ markers three to six months later. Testing covers cardiovascular lipidomics (ApoB, Lp(a)),
              metabolic markers, thyroid panels, autoimmunity, environmental toxins, and early cancer indicators.
              Members complete specimen collection either at more than 2,000 Quest Diagnostics patient service centers
              nationwide or via at-home blood draws conducted by licensed phlebotomists following the acquisition of
              Getlabs. Diagnostic results are synthesized within the mobile application into personalized reports
              alongside clinician review notes that explain biological findings and outline lifestyle or dietary
              protocols.
