        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track Pending Retention Proof'
            body: >-
              Function Health demonstrates exceptional top-of-funnel consumer health momentum, having built a
              recognizable brand, achieved an estimated $100M+ ARR run-rate, and secured $450M in innovative customer
              acquisition financing from General Catalyst. However, trading at 15.2x to 22.8x core ARR places the
              company at a substantial premium relative to both diagnostic infrastructure providers and digital health
              subscription peers. Because annual cohort retention, GAAP unit economics, and long-term diagnostic
              compliance remain unverified by audited disclosures, investors should maintain a disciplined track stance
              until second-year renewal rates and contribution margins are demonstrably established.
            calloutType: recommendation
            claimRefs:
