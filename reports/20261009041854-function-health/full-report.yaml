  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Function Health's core market is cash-pay access to preventive laboratory testing, interpretation, and
              longitudinal result tracking. Its terms say Function facilitates third-party laboratory services and does
              not itself provide medical advice, diagnosis, or treatment; the service is also not health insurance. The
              current official offer is $365 per year for 160+ annual tests across at least two testing rounds. Included
              spend therefore begins with the membership and may extend to separately charged imaging or other tests.
              Insured diagnostic care, physician treatment, prescriptions, and hospital services sit outside this
              boundary. Status-quo substitutes include physician-ordered laboratory work and doing no proactive testing,
              while adjacent spend includes elective imaging and other cash-pay wellness services. This boundary avoids
              treating all diagnostics or digital health expenditure as Function-addressable demand.
            claimRefs:
