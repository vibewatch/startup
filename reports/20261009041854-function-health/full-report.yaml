      - number: '7.3'
        title: Partner Concentration, Unit Economic Durability, and Financing Liabilities
        blocks:
          - type: paragraph
            body: >-
              Function Health's asset-light business model concentrates counterparty exposure across a narrow roster of
              key infrastructure partners while remaining exposed to consumer discretionary spending volatility. The
              company is fundamentally dependent on Quest Diagnostics for nationwide clinical laboratory processing; any
              contractual disruption, fee repricing, or labor dispute within Quest's network would immediately halt core
              testing delivery. Similarly, Function's imaging tier relies on regional partner imaging facilities to
              execute scans using Ezra's AI protocols across approximately 200 centers. Financially, Function's rapid
              scaling to an estimated 350,000 to 500,000 members and $100M+ revenue run rate faces severe subscriber
              churn risks. Because annual memberships ($365/year) are paid out of pocket without insurance
              reimbursement, subscribers who receive normal results or experience testing fatigue may discontinue
              renewal after year one. This retention dynamic is magnified by the $450 million growth financing secured
              from General Catalyst's Customer Value Fund (CVF) in July 2026. Because CVF financing requires repayment
              via a capped share (typically 12% to 20% return hurdle) of reference revenues generated by specific
              customer cohorts, elevated subscriber churn or rising customer acquisition costs would prolong the capital
