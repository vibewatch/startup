  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Capitalization Context
        blocks:
          - type: paragraph
            body: >-
              Function Health has established a commanding brand in direct-to-consumer proactive diagnostics by
              packaging over 160 biomarker lab tests, longitudinal biometric tracking, and clinician-reviewed actionable
              protocols into an annual consumer membership initially priced at $499 and later calibrated to $365 per
              year ($1 per day). The company's capitalization history reflects rapid valuation expansion followed by
              non-dilutive balance-sheet scaling: after an initial seed and beta rollout logging 3 million tests,
              Function secured a Series A in June 2024 led by Andreessen Horowitz Bio + Health at a $191M post-money
              valuation, followed 17 months later by a $298M Series B in November 2025 led by Redpoint Ventures at a
              $2.5B valuation [CV001, CV002, CV006, CV007]. In July 2026, Function secured an additional $450M in growth
              financing from General Catalyst's Customer Value Fund (CVF), bringing total capital deployed across equity
              and growth financing past $800M [CV002, CV003, CV004, CV008]. This financing is structured as non-dilutive
              customer acquisition capital that isolates sales and marketing expenditures into a cohort-matched,
              self-liquidating asset class, decoupling customer acquisition spend from balance-sheet equity dilution
              while preserving the prior $2.5B equity valuation benchmark [CV005, CV008]. However, this non-dilutive
              capital structure introduces contingent financial liabilities: General Catalyst recovers principal plus a
              capped return of 12% to 20% directly from cohort-generated reference revenues or gross margins before full
              long-tail lifetime revenues revert entirely to Function Health [CV008]. While enabling national brand
              acceleration without cap-table dilution, any deterioration in member retention or cohort CAC payback
              curves encumbers cash flows and extends repayment cycles, creating debt-like cash flow drag without formal
              debt covenants [CV008].
