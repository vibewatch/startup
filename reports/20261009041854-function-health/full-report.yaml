        title: Durability, Unit Economics, and Customer Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Function's commercial durability remains constrained by acute data opacity surrounding retention metrics
              and contract renewals. Neither Net Revenue Retention (NRR), Gross Revenue Retention (GRR), annual renewal
              rates, nor longitudinal cohort churn are publicly disclosed. Furthermore, the commercial model requires
              continuous capital deployment into marketing: General Catalyst's Customer Value Fund provided $450 million
