              While the base subscription democratizes access to broad biomarker testing, real user economics diverge
              significantly through specialized add-ons such as full-body MRI scans, heart and lung CTs, and specialized
              pathology panels that rapidly elevate annual expenditure beyond $1,000. In parallel, Function is actively
