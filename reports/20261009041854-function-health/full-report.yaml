      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Category growth is supported by consumer interest in proactive testing, broader direct access to
              diagnostic services, and distribution through existing laboratory networks. Function also obtained $450
              million in growth financing from General Catalyst's Customer Value Fund; reporting says that vehicle
              finances sales and marketing and receives a capped portion of value from customers acquired with that
              spending. Financing capacity can accelerate acquisition, but funding raised is neither market demand nor
              cash proven to be freely available. Constraints are material: Forbes and EMARKETER describe a crowded
              category with comparable lab partnerships and pricing pressure, while a first-hand review reported data
              overload and limited help acting between tests. EMARKETER and ValueAddVC also preserve concerns about
              false positives, anxiety, and downstream follow-up costs from broad screening. Without disclosed cohort
              renewal, attach rates, customer-acquisition economics, or a reconciled member count, valuation should not
              capitalize global category forecasts as if they were contracted revenue.
            claimRefs:
              - CM007
              - CM011
              - CM012
              - CM014
              - CM016
