      - number: '8.2'
        title: Peer Benchmarking and Multiple Realities
        blocks:
          - type: paragraph
            body: >-
              Evaluating Function Health's $2.5B equity valuation against its estimated operational scale demonstrates
              that institutional growth investors are pricing the company as an integrated consumer health AI platform
              rather than a traditional diagnostic testing aggregator [CV008, CV010]. Function trades at an implied
              revenue multiple of 15.2x to 22.8x core membership ARR ($110M to $164M baseline based on an estimated
              active member base of 300,000 to 450,000 subscribers at $365/year), placing it at an extreme premium
              relative to traditional clinical laboratories such as Quest Diagnostics (2.0x revenue) and Labcorp (1.6x
              revenue), as well as direct-to-consumer telehealth platforms such as Hims & Hers (2.5x revenue) [CV007,
              CV008, CV009, CV010]. Even when benchmarked against high-growth clinical AI infrastructure peers like
              Tempus AI (6.0x to 6.5x revenue) or tech-enabled primary care networks like One Medical prior to
              acquisition (~4.0x revenue), Function commands a substantial platform premium [CV008]. On a per-member
              basis, Function's valuation implies $5,600 to $8,300 per active subscriber, compared to ~$2,400 per
              subscriber for Hims & Hers and ~$4,800 per commercial member for One Medical [CV008]. To rationalize its
              $2.5B valuation under conventional growth-stage software multiples of 10.0x ARR, Function must expand
              revenue to $250M (requiring approximately 685,000 core members), while justifying a stricter 6.5x platform
              multiple would necessitate $385M in ARR (~1.05M active members) [CV008]. The company's ability to compress
              this multiple depends on aggressive ARPU expansion via higher-margin add-ons—specifically Ezra full-body
              MRI ($499 to $1,000), low-dose CT screening ($349), mobile phlebotomy fees, and SuppCo-driven supplement
              protocols—rather than relying exclusively on top-line DTC subscriber acquisition [CV008, CV011, CV012].
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
