          - type: callout
            title: Customer Value Fund Financing Protects Valuation at the Expense of Cash Flow
            body: >-
              The $450M General Catalyst CVF facility enables Function Health to fund aggressive customer acquisition
              and acquisitions without diluting its $2.5B equity valuation. However, because repayment is tied directly
              to a capped share of customer cohort cash flows, underperforming cohorts will tie up operating cash flow
              and extend debt service obligations.
