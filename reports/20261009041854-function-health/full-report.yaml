      - number: '5.4'
        title: Medical Intelligence Lab, Clinical Governance, and Security Controls
        blocks:
          - type: paragraph
            body: >-
              The core clinical engine is the Medical Intelligence Lab (MI Lab), co-directed by Dr. Dan Sodickson and
              Dr. Mark Hyman. MI Lab applies generative AI models against multi-modal patient data—serial blood markers,
              anatomical MRI scans, and wearable physiological metrics—to identify long-term biological trends against
              optimal functional thresholds rather than broad population-average reference ranges. To maintain clinical
              precision and regulatory compliance, algorithmic outputs undergo review by contracted licensed physicians
              before delivery. The company enforces rigorous product security controls, deploying automated static
              analysis (SAST), software composition analysis (SCA), secrets scanning, and AI-assisted CI/CD code review
              to safeguard protected health information (PHI) under HIPAA regulations.
