  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Preventive Testing Landscape and Category Structure
        blocks:
          - type: paragraph
            body: >
              The preventive health testing landscape spans direct-to-consumer (DTC) biomarker subscriptions, unbundled
              diagnostic discounters, full-body imaging specialists, and comprehensive concierge medicine providers.
              Function Health entered the market with a high-volume testing subscription centered on over 100 to 160
              annual biomarkers drawn primarily through Quest Diagnostics patient service centers. Rather than operating
              its own laboratories or employing a full-time clinical staff, Function functions as an asset-light
              technology orchestration layer that combines contracted lab draws, third-party physician ordering
              networks, and algorithmic interpretation.


              Direct competitors in the subscription biomarker segment include Superpower and InsideTracker. Superpower
              mirrors Function's comprehensive panel scope, pricing, and draw cadence while attempting to differentiate
              through richer clinical messaging, continuous wearable integration, and a downstream supplement
              marketplace. In contrast, InsideTracker relies on an unbundled, per-test transactional structure ($249 per
              test for core panels) with algorithmic dietary and exercise guidance rather than requiring an ongoing
              multi-year subscription.


              Beyond direct subscription peers, Function faces substantial competitive pressure from adjacent and
              substitute models. No-frills testing discounters such as WalkinLab, Private MD Labs, and Own Your Lab
              offer direct consumer access to identical Quest and LabCorp panels on an a la carte basis, allowing
              budget-conscious consumers to bypass annual membership commitments entirely. Simultaneously, emerging
              low-cost alternatives like Empirical Health ($190 one-time comprehensive panel) and Goodlabs (partnered
              biomarker panels free with qualifying blood donation) actively compress entry-level price expectations.


              At the high end of the market, integrated platforms like Fountain Life and concierge longevity practices
              bundle diagnostics directly with treating physicians, prescription therapies, and regular clinical
              protocols. Traditional primary care providers also serve as a persistent structural substitute: insured
              patients can obtain routine metabolic, lipid, and thyroid markers with minimal out-of-pocket costs, though
              standard insurance plans systematically exclude preventive specialty tests like Apolipoprotein B (ApoB),
              Lipoprotein(a) [Lp(a)], and toxic metal panels without documented medical necessity.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
              - CP008
              - CP010
