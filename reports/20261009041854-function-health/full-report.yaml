  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Function Health's primary customer base consists of self-directed, health-conscious consumers seeking
              proactive biological insight outside traditional primary care workflows. Subscribers pay out of pocket for
              the core annual membership—recently adjusted from $499 to $365 per year—to access more than 160 baseline
