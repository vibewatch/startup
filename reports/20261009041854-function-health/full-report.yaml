            title: Subscription Fatigue Threatens Long-Term Unit Economics
            body: >-
              Function Health's reliance on discretionary out-of-pocket health spending leaves it vulnerable to
              subscription fatigue. When asymptomatic members receive normal test results across sequential biannual
              panels, the perceived utility of paying $365 annually diminishes, potentially accelerating churn and
              increasing dependency on expensive customer acquisition.
            calloutType: risk
            claimRefs:
