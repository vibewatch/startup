      - number: '7.2'
        title: Operational Logistics, Incidental Finding Cascades, and Information Security
        blocks:
          - type: paragraph
            body: >-
              The platform's operational integrity depends on orchestrating complex physical specimen logistics,
              advanced imaging scheduling, and multi-modal software processing without owning physical facilities. The
              specimen collection pathway introduces acute operational vulnerabilities: while Function expanded
              collection convenience by acquiring Getlabs for mobile doorstep phlebotomy and partnering with Quest
              Diagnostics across 2,000+ patient centers, phlebotomy draw adherence remains an essential operational
              gating factor, requiring up to 20 blood vials during initial baselining. Clinically, broad multi-panel
              biomarker screening (160+ tests) alongside whole-body MRI and low-dose CT scans creates substantial
              vulnerability to false-positive results, incidentalomas, and non-actionable anatomical anomalies. The
              American College of Radiology and conventional medical professional associations have repeatedly warned
              against routine whole-body screening in asymptomatic adults due to the risk of triggering invasive,
              costly, and anxiety-provoking diagnostic follow-ups, such as biopsies and repeat imaging, that offload
              uncompensated triage burdens onto primary care providers. On technical infrastructure, Function integrates
              high-volume biomarker databases, DICOM imaging archives, and generative AI interfaces via the Medical
              Intelligence Lab, exposing the company to systemic cybersecurity and data breach risks inherent in storing
              highly sensitive personal longitudinal health records.
            claimRefs:
