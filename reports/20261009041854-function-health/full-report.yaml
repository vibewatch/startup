            - SuppCo supplement label verification challenges
            - FTC ambassador endorsement investigation
            - Catastrophic health data breach of PHI lakehouse
        - label: Remote Likelihood
          values:
            - Routine portal software patch latency
            - Consumable paper requisition shortages
            - Physician network geographic realignment
            - Federal statutory ban on DTC direct laboratory ordering
        - label: Occasional Likelihood
          values:
            - Transient phlebotomist transit cancellations
            - Biomarker reference interval calibration adjustments
            - Third-party single-sign-on latency
            - Comprehensive whole-body MRI commercial payer non-coverage lawsuits
        - label: Conditional Likelihood
          values:
            - Localized courier transport weather disruptions
            - Regional laboratory specimen rerouting delays
            - Affiliated physician licensing renewal backlog
