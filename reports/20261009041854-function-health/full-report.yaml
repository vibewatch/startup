chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Function Health is an Austin-based, privately held consumer health-technology company. Unify GTM and
              Silicon Valley Investment Club date its founding to 2021, while Forge lists 2022, so the exact legal
              inception date should be verified against formation records rather than treated as settled. The current
              consumer offer is a $365 annual membership that provides 160+ lab tests over two testing cycles,
              clinician-reviewed explanations, and access to optional imaging. Function describes itself as a technology
              company rather than a laboratory or medical provider. Testing is available through more than 2,000 Quest
              locations or an at-home draw, concentrating delivery on third-party laboratory infrastructure. The May
              2025 Ezra acquisition added a $499, 22-minute MRI offer; later Getlabs and SuppCo acquisitions broadened
              collection and supplement-related capabilities, but their integration economics are not public.
