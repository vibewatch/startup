      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The primary buyer, user, and payer is an individual who purchases the annual membership directly,
              potentially using HSA or FSA funds where eligible. Function's legal terms also contemplate enterprise
              memberships that an employer, organization, or other third party may reimburse, subsidize, or pay, so
              payer and user can diverge without turning the product into insurance. Sacra reports emerging channels
              through Equinox, the National Basketball Players Association, John Hancock, and employer benefits, but
              these are channel examples rather than evidence of segment revenue mix. The adoption path is digital
              enrollment, laboratory scheduling through third-party infrastructure, result delivery and interpretation,
              then repeat testing; separately purchased imaging can expand spend. Convenience, broad marker coverage,
              pre-tax payment eligibility, and sponsorship can trigger adoption, while the unresolved step is whether
              users renew after learning an initial baseline.
