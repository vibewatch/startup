              While General Catalyst's $450M Customer Value Fund financing avoids cap-table dilution and board seat
              reallocation, it creates a formal balance-sheet liability tied directly to member cohort revenues. If
              customer acquisition efficiency declines or cohort churn exceeds initial underwriting models, the 12% to
              20% capped return obligation will encumber a substantial share of gross profit, delaying full cash flow
              reversion to Function Health and restricting liquidity for proprietary clinical research and software
              development.
            calloutType: risk
            claimRefs:
