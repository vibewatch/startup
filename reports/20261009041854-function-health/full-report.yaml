      - number: '5.3'
        title: Technology Stack and Data Architecture
        blocks:
          - type: paragraph
            body: >-
              Function Health operates an asset-light hybrid architecture combining physical healthcare operations with
              multi-cloud infrastructure spanning Databricks, Google Cloud Platform (GCP), and Microsoft Azure.
              Laboratory orders, raw electronic health records, and DICOM imaging files are ingested through automated
              event-driven pipelines orchestrated by Apache Airflow. Structured biomarker results and high-volume
              clinical records are governed in a centralized semantic layer built on Databricks Unity Catalog and Delta
              Lake, enforcing HIPAA-compliant role-based access controls and consistent data contracts. Backend services
              utilize ASP.NET Core and Python microservices deployed in Docker and Kubernetes containers, interfacing
              with modern Vue.js and mobile frontends. Diagnostic data is made portable through external consumer AI
