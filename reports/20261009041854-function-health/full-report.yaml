              - CI003
              - CI005
              - CI006
      - number: '4.3'
        title: Capital Adequacy, Non-Dilutive Growth Debt, and Financial Verdict
        blocks:
          - type: paragraph
            body: >
              Function Health has raised substantial institutional capital to support platform scaling and corporate
              acquisitions. The company raised a $53 million Series A in 2024 and an oversubscribed $298 million Series
              B in November 2025 led by Redpoint Ventures at a $2.5 billion post-money valuation, with participation
              from Andreessen Horowitz Bio + Health, General Catalyst, and prominent private technology investors.


              In July 2026, Function secured $450 million in growth financing from General Catalyst's Customer Value
              Fund (CVF). Unlike standard equity rounds that reprice company valuation or dilute existing equity
              holders, this CVF transaction functions as revenue-linked growth financing. General Catalyst finances 70%
              to 85% of approved customer acquisition spending and is repaid exclusively through a capped share
              (typically 12% to 20% return hurdle) of the cash flow generated by those specific customer cohorts.


              While this non-dilutive structure insulates Function's $2.5 billion valuation benchmark, it encumbers
              future cohort cash flows with senior self-liquidating repayment obligations. If member retention softens
              or CAC inflates, debt service timelines extend, reducing net cash generation available for internal
              reinvestment. Function presents impressive commercial top-line scale, but absence of audited financial
              statements, GAAP disclosures, and verified cohort retention metrics prevents complete institutional
              underwriting.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
