            body: >-
              Function Health decouples preventive diagnostic software from physical capital expenditure by routing
              laboratory specimen processing through Quest Diagnostics' nationwide network and MRI scans through
              existing regional imaging clinics. This enables rapid national scale, though it concentrates operational
              dependency on third-party SLA performance and fee schedules.
