  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risk Posture
        blocks:
          - type: paragraph
            body: >-
              Function Health operates in a complex, multi-jurisdictional healthcare regulatory landscape that combines
              direct-to-consumer (DTC) laboratory ordering, medical imaging oversight, and health data privacy. The
              company structures its operations as a healthcare technology software entity rather than a licensed
              medical practice or clinical laboratory, outsourcing diagnostic testing orders and results interpretation
              to an affiliated physician network and independent partner facilities. This model faces distinct
              regulatory exposure across states with strict direct-access testing statutes, such as New York, New
              Jersey, and Rhode Island, which mandate specific clinical ordering protocols, physician reviews, and
              statutory handling fees. On data governance, Function's published privacy documentation explicitly
              acknowledges that while the company and its corporate affiliates may operate as a business associate under
              HIPAA for specific enterprise programs, HIPAA protections do not apply to all consumer personal health
              data collected directly across its digital platform. This creates ongoing consumer privacy compliance
              exposure under evolving state-level consumer health data regulations (such as Washington's My Health My
              Data Act and California's CCPA/CPRA). Furthermore, the clinical establishment continues to debate the
              evidentiary basis of asymptomatic full-body MRI screening and expansive biomarker panels, raising
              institutional risks around potential FTC consumer protection scrutiny regarding preventive health claims
              and physician ambassador endorsements.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
