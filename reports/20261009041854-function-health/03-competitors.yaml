callouts:
  - calloutType: "risk"
    title: "The Treatment Gap Leaves Customer Retention Exposed"
    body: "Function Health's decision to avoid clinical prescribing and physician consultations protects gross margins and regulatory simplicity, but creates severe long-term retention risk. Because Function informs rather than treats, members with abnormal findings must transition to external doctors who often challenge the clinical necessity of out-of-pocket biomarker panels."
    claimRefs:
      - "CP003"
      - "CP006"
      - "CP016"
  - calloutType: "insight"
    title: "Vertical Integration as Defense Against Diagnostic Deflation"
    body: "With low-cost alternatives like Empirical Health ($190) and unbundled discounters exerting downward pressure on basic blood panels, Function's acquisitions of Ezra (imaging), Getlabs (at-home phlebotomy), and SuppCo (supplements) represent a necessary evolution into a multi-modal health ecosystem that cannot be easily matched by point-solution lab discounters."
    claimRefs:
      - "CP001"
      - "CP013"
      - "CP014"
      - "CP015"

