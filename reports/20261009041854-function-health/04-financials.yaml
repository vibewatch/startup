callouts:
  - calloutType: "risk"
    title: "Subscription Fatigue Threatens Long-Term Unit Economics"
    body: "Function Health's reliance on discretionary out-of-pocket health spending leaves it vulnerable to subscription fatigue. When asymptomatic members receive normal test results across sequential biannual panels, the perceived utility of paying $365 annually diminishes, potentially accelerating churn and increasing dependency on expensive customer acquisition."
    claimRefs:
      - "CI001"
      - "CI007"
      - "CI011"
  - calloutType: "insight"
    title: "Customer Value Fund Financing Protects Valuation at the Expense of Cash Flow"
    body: "The $450M General Catalyst CVF facility enables Function Health to fund aggressive customer acquisition and acquisitions without diluting its $2.5B equity valuation. However, because repayment is tied directly to a capped share of customer cohort cash flows, underperforming cohorts will tie up operating cash flow and extend debt service obligations."
    claimRefs:
      - "CI014"
      - "CI015"
      - "CI016"

