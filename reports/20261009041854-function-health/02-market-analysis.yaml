callouts:
  - calloutType: "risk"
    title: "SAM and SOM remain unquantified"
    body: "Public sources do not isolate the US population willing and eligible to pay, disclose Function's renewal or add-on attachment rates, or reconcile conflicting member estimates. Applying a global market forecast to Function would overstate the evidence."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM016"
  - calloutType: "insight"
    title: "Financing can accelerate acquisition, but it does not prove demand"
    body: "The $450 million Customer Value Fund financing is designed around sales and marketing economics. It may expand customer acquisition capacity, but funding raised is not revenue, cash availability, retention, or proof that acquired cohorts will renew."
    claimRefs:
      - "CM012"
      - "CM016"
