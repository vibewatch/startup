chapter:
  number: 5
  title: "Product & Technology"
  summary: "Function Health operates an asset-light preventive diagnostics platform combining 160+ annual biomarker tests, full-body MRI/CT imaging, mobile phlebotomy, and generative AI synthesis under a $365 annual membership. Its architecture integrates physical laboratory and imaging networks via Quest Diagnostics, Ezra, and Getlabs with a multi-cloud data pipeline (Databricks, GCP, Azure) and the Medical Intelligence Lab AI engine."
sections:
  - id: "product-definition-workflow"
    title: "Product Definition and Customer Workflow"
    body: "Function Health delivers a direct-to-consumer health data platform centered on an annual subscription that costs $365 per year ($1 per day). The core service includes access to more than 160 lab biomarkers evaluated across biannual testing cycles, beginning with an initial panel of 100+ tests and a follow-up panel of 60+ markers three to six months later. Testing covers cardiovascular lipidomics (ApoB, Lp(a)), metabolic markers, thyroid panels, autoimmunity, environmental toxins, and early cancer indicators. Members complete specimen collection either at more than 2,000 Quest Diagnostics patient service centers nationwide or via at-home blood draws conducted by licensed phlebotomists following the acquisition of Getlabs. Diagnostic results are synthesized within the mobile application into personalized reports alongside clinician review notes that explain biological findings and outline lifestyle or dietary protocols."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE002"
  - id: "modular-offerings-acquisitions"
    title: "Modular Product Suite and M&A Integration"
    body: "Beyond standard phlebotomy panels, Function Health has transformed into a multi-modality diagnostic platform through vertical acquisitions executed between 2025 and 2026. In May 2025, Function acquired Ezra, an AI-assisted medical imaging company, introducing a full-body MRI scan priced at $499 to $899 across more than 200 partner imaging centers, as well as a low-dose Heart and Lungs CT scan for $349. In April 2026, the company acquired Getlabs to remove in-person draw compliance bottlenecks through mobile doorstep phlebotomy. In mid-2026, Function acquired SuppCo, integrating a supplement analysis platform that audits over 35,000 commercial formulations via ISO 17025 accredited laboratory testing. These additions enable Function to expand beyond pure biochemical lab data into structural imaging and direct consumer interventions."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE001"
  - id: "architecture-and-data-platform"
    title: "Technology Stack and Data Architecture"
    body: "Function Health operates an asset-light hybrid architecture combining physical healthcare operations with multi-cloud infrastructure spanning Databricks, Google Cloud Platform (GCP), and Microsoft Azure. Laboratory orders, raw electronic health records, and DICOM imaging files are ingested through automated event-driven pipelines orchestrated by Apache Airflow. Structured biomarker results and high-volume clinical records are governed in a centralized semantic layer built on Databricks Unity Catalog and Delta Lake, enforcing HIPAA-compliant role-based access controls and consistent data contracts. Backend services utilize ASP.NET Core and Python microservices deployed in Docker and Kubernetes containers, interfacing with modern Vue.js and mobile frontends. Diagnostic data is made portable through external consumer AI connectors, allowing members to link summarized records to ChatGPT Health and Microsoft Copilot."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "ai-medical-intelligence-and-governance"
    title: "Medical Intelligence Lab, Clinical Governance, and Security Controls"
    body: "The core clinical engine is the Medical Intelligence Lab (MI Lab), co-directed by Dr. Dan Sodickson and Dr. Mark Hyman. MI Lab applies generative AI models against multi-modal patient data—serial blood markers, anatomical MRI scans, and wearable physiological metrics—to identify long-term biological trends against optimal functional thresholds rather than broad population-average reference ranges. To maintain clinical precision and regulatory compliance, algorithmic outputs undergo review by contracted licensed physicians before delivery. The company enforces rigorous product security controls, deploying automated static analysis (SAST), software composition analysis (SCA), secrets scanning, and AI-assisted CI/CD code review to safeguard protected health information (PHI) under HIPAA regulations."
    claimRefs:
      - "CE002"
      - "CE014"
      - "CE015"
      - "CE016"
