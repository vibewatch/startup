callouts:
  - calloutType: "insight"
    title: "Asset-Light Leverage of Established Clinical Infrastructure"
    body: "Function Health decouples preventive diagnostic software from physical capital expenditure by routing laboratory specimen processing through Quest Diagnostics' nationwide network and MRI scans through existing regional imaging clinics. This enables rapid national scale, though it concentrates operational dependency on third-party SLA performance and fee schedules."
    claimRefs:
      - "CE003"
      - "CE007"
      - "CE011"
  - calloutType: "risk"
    title: "Clinical Controversy Surrounding Asymptomatic Whole-Body Screening"
    body: "The expansion into full-body MRI scans and broad 160+ biomarker screening panels faces skepticism from conventional medical bodies regarding incidental findings (incidentalomas) and overdiagnosis in asymptomatic populations, potentially prompting unnecessary downstream interventions."
    claimRefs:
      - "CE004"
      - "CE007"
