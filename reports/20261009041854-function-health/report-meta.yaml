companyProfile:
  summary: >-
    Function Health sells a consumer preventive-health membership that bundles 160+ lab biomarkers, clinician-reviewed
    reporting, and optional imaging. The company is privately held, Austin-based, and uses third-party lab and
    collection infrastructure rather than operating its own lab network. Public profiles disagree on its founding year,
    but the business is consistently described as a Mark Hyman/Jonathan Swerdlin-led platform that scaled quickly after
    launch and reached a $2.5B valuation in its November 2025 Series B.
  foundingLocation: Austin, Texas, United States
  headquarters: Austin, Texas, United States
  productSummary: Annual preventive-health membership with 160+ biomarkers, results reporting, and optional MRI/body-imaging add-ons.
