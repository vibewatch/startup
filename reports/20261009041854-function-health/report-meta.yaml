  topStrengths:
    - Large consumer preventive-health offer with 160+ biomarkers and optional imaging.
    - Strong brand and distribution leverage from Mark Hyman plus Quest-enabled collection infrastructure.
    - Substantial external capital access and rapid reported scale.
  topRisks:
    - Audited financials, GAAP revenue, margins, and CAC/payback remain undisclosed.
    - Member counts and effective ARPU are not fully reconciled across public sources.
    - Clinical validity and downstream over-treatment risks remain insufficiently published.
    - Regulatory and post-acquisition integration questions remain open.
  unresolvedGaps:
    - >-
      Audited financial statements, GAAP revenue, contribution margin per cohort, and CAC/payback are not disclosed; the
      $100M ARR cannot be independently verified
    - >-
      Retention metrics (NRR, GRR, churn, repeat-purchase rate, cohort renewal) are not publicly disclosed for any
      segment
    - >-
      Reconciliation of effective ARPU (~$100) against the $499 list price — the discount mix, free trial cohorts,
      partner-subsidised members, and partial-year accounting — is not public
    - >-
      Clinical evidence base for Function Medical Intelligence (sensitivity, specificity, downstream over-treatment
      rates) is not published in peer-reviewed literature
    - >-
      Regulatory posture under FDA LDT rulemaking post-2025 vacatur, and any FTC endorsement-guides correspondence
      regarding Mark Hyman's ambassador role, are not disclosed
    - >-
      Integration economics, member overlap, and incremental ARPU contribution of the Ezra (May 2025) and Getlabs (April
      2026) acquisitions are not disclosed
    - >-
      Use-of-proceeds detail for the November 2025 $298M Series B beyond high-level 'AI platform and category expansion'
      framing is not published
