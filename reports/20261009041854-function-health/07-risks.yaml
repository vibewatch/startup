callouts:
  - calloutType: "risk"
    title: "Sole-Source Dependency on Quest Diagnostics"
    body: "Function Health's nationwide operational delivery rests almost entirely on Quest Diagnostics' processing facilities and 2,000+ patient service centers. While Function completed over 50 million tests, any disruption in Quest's operating capacity or fee schedules represents a catastrophic vulnerability that cannot be rapidly mitigated by alternative lab networks."
    claimRefs:
      - "CR011"
      - "CR012"
  - calloutType: "insight"
    title: "Cohort Encumbrance via Customer Value Fund Financing"
    body: "General Catalyst's $450 million Customer Value Fund financing protects parent equity from dilution but creates structured financial liabilities tied to customer cohort performance. If member churn accelerates or acquisition costs rise, cohort revenues will remain encumbered longer to reach the 12% to 20% return hurdle, constricting net cash flow available for platform reinvestment."
    claimRefs:
      - "CR014"
      - "CR015"
