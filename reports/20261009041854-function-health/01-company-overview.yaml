company:
  name: "Function Health"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Function Health sells a $365 annual preventive-health membership centered on 160+ lab tests, clinician-reviewed guidance, and optional imaging. Its November 2025 Series B set a $2.5B valuation, while later financing, member-count, revenue run-rate, and headcount figures come from third-party sources with unresolved definition or reconciliation gaps."
sections:
  - id: "corporate-identity-and-business-model"
    title: "Corporate Identity, Operating Architecture, and Business Model"
    body: "Function Health is an Austin-based, privately held consumer health-technology company. Unify GTM and Silicon Valley Investment Club date its founding to 2021, while Forge lists 2022, so the exact legal inception date should be verified against formation records rather than treated as settled. The current consumer offer is a $365 annual membership that provides 160+ lab tests over two testing cycles, clinician-reviewed explanations, and access to optional imaging. Function describes itself as a technology company rather than a laboratory or medical provider. Testing is available through more than 2,000 Quest locations or an at-home draw, concentrating delivery on third-party laboratory infrastructure. The May 2025 Ezra acquisition added a $499, 22-minute MRI offer; later Getlabs and SuppCo acquisitions broadened collection and supplement-related capabilities, but their integration economics are not public."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "founders-governance-and-leadership"
    title: "Founders, Executive Leadership, and Governance Structure"
    body: "The disclosed founding team combines commercial, medical, product, technical, and legal coverage: Jonathan Swerdlin, Mark Hyman, Pranitha Patil, Mike Nemke, Seth Weisfeld, and Daniel Swerdlin. Jonathan Swerdlin remains chief executive, while Hyman's medical profile and public visibility create both distribution leverage and key-person exposure; no source in the assigned pool quantifies how much acquisition depends on either founder. Leadership titles have evolved: a16z described Patil as COO in 2024, while a 2026 directory lists her as chief business officer, and Function announced former Slack COO Neil Shah as its new COO in November 2025. Function also added Daniel K. Sodickson as chief medical scientist. The company announcement identifies a16z partner Daisy Wolf as a board member, but it does not establish a Redpoint board seat. A complete current board roster, committee structure, voting controls, and founder ownership remain unavailable."
    claimRefs:
      - "CO009"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-map"
    title: "Capitalization History, Financing Structure, and Stakeholders"
    body: "The disclosed financing sequence includes a $53M Series A led by a16z in June 2024 and a $298M Series B led by Redpoint in November 2025 at a $2.5B valuation. A July 2026 Value Add VC report describes a separate $450M General Catalyst Customer Value Fund financing tied to revenue performance rather than a traditional priced equity round; the facility agreement, repayment mechanics, and cash actually drawn are not public. Forge presents a different current lens: two July 30, 2026 B-2 and B-3 entries totaling $159.19M, a $2.94B estimated post-money valuation, and $521.18M of total funding. Forge simultaneously shows no current Forge Price or matched trade, so its $2.94B figure should not be described as a secondary transaction price. These records cannot be safely summed or reconciled without cap-table and financing documents, and funding raised should not be treated as cash available."
    claimRefs:
      - "CO010"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "operating-scale-and-diligence-gaps"
    title: "Operating Scale, Commercial Partnerships, and Diligence Realities"
    body: "Public scale evidence is directional rather than audited. Sacra estimates a $100M revenue run-rate in February 2025, up approximately 450% year over year, and reports more than 200,000 members by May 2025. That metric is neither disclosed GAAP revenue nor ARR. Value Add VC later reports more than 500,000 members and more than 100 million lab tests logged since the 2023 launch, but does not define active, paid, or retained membership. Function's own current pages report more than 75 million results delivered and more than 2,000 test locations, creating a different denominator from cumulative tests. Headcount is also unresolved because one profile displays both 50 employees and a separate 602-person estimate. Sacra and Value Add VC flag regulatory uncertainty, false-positive follow-up, and out-of-pocket demand as risks; no regulator or legal record was returned by the assigned adverse query, which is an evidence gap rather than proof that no incident exists."
    claimRefs:
      - "CO006"
      - "CO008"
      - "CO013"
