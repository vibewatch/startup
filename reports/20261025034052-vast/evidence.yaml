evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary round announcements, term sheets, and an entity-level financing ledger reconciling the reported $200M,
      $412.5M, and $644M figures.
    whyItMatters: >-
      Headline valuation and total raised are central to ownership, dilution, and valuation analysis, but the assigned
      public sources use inconsistent totals and one database mixes unrelated VAST Data information.
    diligencePath: Obtain executed financing documents, cap-table extracts, and investor confirmations from management or lead funds.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Recognized revenue, ARR, gross margin, customer concentration, retention, debt, and liquidation preferences.
    whyItMatters: User counts and financing do not establish recurring revenue quality, profitability, or common-equity value.
    diligencePath: >-
      Request the latest management accounts, cohort and retention schedule, debt schedule, and capitalization
      waterfall.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive roster, board membership, committees, and succession coverage.
    whyItMatters: The evidence names only the founder and leaves key-person dependence and governance controls unresolved.
    diligencePath: Request an organization chart, board materials, committee mandates, and key-person insurance or succession plans.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: stale
    severity: minor
    topic: users
    missingEvidence: A current, consistently defined active-user and developer/customer count as of the report date.
    whyItMatters: >-
      Reported counts range from 3 million creators to roughly 20 million users and may cover different products or
      periods.
    diligencePath: >-
      Request dated monthly active users, paid subscribers, developers, enterprise accounts, and asset-generation
      definitions.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: A Vast-specific serviceable market model separating paid creator, studio, and enterprise/API demand.
    whyItMatters: Without a bounded SAM/SOM, broad China AI figures can overstate the revenue opportunity relevant to Vast.
    diligencePath: >-
      Request management's segment-level market model with buyer counts, pricing assumptions, geography, and exclusion
      rules.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: user-count
    missingEvidence: A reconciled definition and period for individual users, active users, studios, companies, and paying accounts.
    whyItMatters: Conflicting user counts change the implied conversion and valuation narrative.
    diligencePath: Obtain dated product analytics and a customer-account reconciliation by plan and region.
    relatedQuestionRefs:
      - QM003
      - QM008
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: enterprise-adoption
    missingEvidence: Named-customer contract value, renewal, usage, and acceptance-rate evidence.
    whyItMatters: Reported integrations show distribution potential but do not prove recurring enterprise revenue.
    diligencePath: Request anonymized cohort metrics, ACV bands, renewal cohorts, API volume, and customer concentration.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Comparable current list and realized pricing for Tripo, Meshy, Luma, and relevant enterprise APIs.
    whyItMatters: >-
      Without price, usage, and discount evidence, competitive positioning cannot establish willingness to pay or
      pricing power.
    diligencePath: Obtain current vendor pricing pages, API rate cards, enterprise proposals, and anonymized realized-contract bands.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat
    missingEvidence: Retention, paid conversion, renewal, multi-homing, and switching-cost evidence by customer segment.
    whyItMatters: Technical quality and user counts do not prove durable customer lock-in or a defensible commercial moat.
    diligencePath: >-
      Request cohort retention, renewal, logo concentration, integration depth, and customer migration data under
      diligence access.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: missing-source
    severity: minor
    topic: trust
    missingEvidence: Comparable security, compliance, uptime, SLA, and content-governance documentation across vendors.
    whyItMatters: Enterprise adoption may depend on governance and reliability more than model quality alone.
    diligencePath: Collect vendor trust centers, DPAs, SLA terms, incident history, and enterprise reference calls.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      Audited or management-reconciled revenue by stream, ARR, gross margin, free cash flow, cash balance, and monthly
      burn.
    whyItMatters: Without these values, revenue quality, margin path, capital adequacy, and valuation cannot be underwritten.
    diligencePath: >-
      Request monthly management accounts, bank and cash schedule, revenue recognition policy, and direct-cost bridge
      through the latest month.
    relatedQuestionRefs:
      - QI002
      - QI005
      - QI007
      - QI009
  - type: conflicting-data
    severity: material
    topic: funding-conflict
    missingEvidence: Executed financing documents and a reconciled round-by-round capitalization schedule.
    whyItMatters: >-
      Reported Series B and cumulative financing figures differ materially and may use different labels or aggregation
      boundaries.
    diligencePath: >-
      Obtain signed term sheets, closing statements, currency conversions, investor ownership, and use-of-proceeds
      schedule.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Paid conversion, ARPU or ACV, retention, CAC, payback, compute cost, and support-cost data by cohort.
    whyItMatters: Large usage counts and financing access do not establish a scalable gross-profit engine.
    diligencePath: >-
      Request cohort exports, product billing tables, sales funnel, infrastructure invoices, and customer concentration
      schedule.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
      - QI005
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Independent security, privacy, safety, licensing and compliance documentation for enterprise deployment.
    whyItMatters: These controls determine whether generated assets and customer inputs can be used in production workflows.
    diligencePath: >-
      Request current security documentation, DPA, retention policy, incident history, model-use terms and commercial
      asset-rights schedule.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Independent uptime, latency, error-rate and queue-performance evidence by plan and region.
    whyItMatters: A production workflow depends on predictable asynchronous generation and download behavior.
    diligencePath: Obtain SLA, status history, regional performance data and representative API logs.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: material
    topic: model-maturity
    missingEvidence: Reproducible benchmark results for topology, UV quality, organic forms, generation speed and manual cleanup time.
    whyItMatters: Marketing claims and limited reviews do not establish consistent production readiness.
    diligencePath: Run a blinded benchmark on representative customer assets and compare cleanup hours against named alternatives.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: stale
    severity: minor
    topic: roadmap
