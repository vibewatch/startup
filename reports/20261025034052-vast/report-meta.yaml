companyProfile:
  summary: >-
    Vast is a Beijing-founded AI company building Tripo, a generative-3D platform for converting text and image prompts
    into usable digital assets. Public reporting indicates broad creator and developer adoption, enterprise workflow
    integrations, and rapid financing, while private-company financial disclosure and governance evidence remain
    limited.
