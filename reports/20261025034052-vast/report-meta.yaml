  topStrengths:
    - Strong product positioning in generative 3D with broad creator and developer adoption signals.
    - Named enterprise workflow integrations and a differentiated founder pedigree.
    - Significant investor interest and financing momentum in a growing category.
  topRisks:
    - Revenue, gross margin, retention, paid conversion, and cash-burn evidence are not publicly verified.
    - Financing totals and round descriptions conflict across retained sources.
    - >-
      China, export-control, intellectual-property, and platform-commoditization risks could constrain global
      monetization.
  unresolvedGaps:
    - Verified ARR, recognized revenue, gross margin, and free-to-paid conversion by plan or cohort.
