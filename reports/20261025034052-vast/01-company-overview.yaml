company:
  name: Vast
chapter:
  number: 1
  title: Company Overview
  summary: Vast is a Beijing-founded AI company whose Tripo platform generates 3D assets from text and images for creators, developers, and enterprise workflows. The company has disclosed rapid user and financing growth, but private-company revenue, governance, and cap-table evidence remain incomplete and public metrics vary by date and definition.
sections:
  - id: identity-and-business
    title: Identity, product, and operating model
    body: >-
      Vast was founded in 2023 by Simon Song after his work at SenseTime and
      MiniMax, according to multiple independent profiles. The company operates
      the Tripo AI/Tripo Studio platform, which turns text or image prompts
      into 3D objects and is positioned for game, film, industrial-design, and
      XR workflows. Public descriptions identify Beijing as the operating base,
      with reporting also describing staff split between Beijing and Hangzhou and
      a Cayman Islands registration for Tripo AI. The commercial model is not
      fully disclosed, but reporting describes creator subscriptions,
      token-based usage, and project-based enterprise charges. The product is
      therefore best understood as a hybrid creator software and enterprise/API
      platform rather than a pure consumer application. The available evidence
      supports a clear product identity, while the legal-entity structure,
      board composition, and precise recurring-revenue mix remain diligence
      items.
    claimRefs: [CO001, CO002, CO003, CO004, CO006, CO007]
    tableRefs: [TO001]
  - id: leadership-and-scale
    title: Leadership, team, and adoption signals
    body: >-
      Simon Song is the only named executive consistently identified in the
      assigned evidence. His prior SenseTime and MiniMax experience is relevant
      founder-market-fit evidence for an AI platform, but the pool does not
      establish a complete executive team, board, or succession plan. Scale
      signals are substantial but inconsistent: one June 2026 profile reports
      roughly 20 million users and around 150 staff, while an earlier company
      announcement reported more than 6.5 million creators, 90,000 developers,
      and nearly 100 million generated assets. These figures may reflect
      different dates, product surfaces, or user definitions; they should not
      be combined into a single funnel. Enterprise references to NetEase, Sony,
      Tencent, Microsoft, and others indicate distribution and workflow
      validation, but the evidence does not disclose contract size, retention,
      or customer concentration. Key-person dependence should remain a
      material diligence risk until governance and leadership depth are
      documented.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: financing-and-milestones
    title: Financing, milestones, and evidence limits
    body: >-
      The financing record shows a rapid sequence of disclosed rounds and a
      valuation threshold, but it is not yet a clean audited capitalisation
      history. Bloomberg and other coverage report nearly $200 million raised
      in the financing that took Vast above a $1 billion valuation; Forbes
      reports a March 2026 $50 million Series A and says two people familiar
      with the later deal placed the valuation at about $1.5 billion, while the
      company declined to comment on an exact figure. A Dealroom News item
      later reports a $412.5 million Series B and approximately $687.5 million
      raised in under six months, whereas a private-company database reports
      $644 million across three rounds and includes clearly unrelated VAST Data
      entries. These discrepancies require round documents and entity-level
      reconciliation before using total raised or valuation as precise cover
      metrics. Product milestones include Project Eden, platform upgrades, and
      a stated ambition to make 3D creation broadly accessible; no assigned
      source establishes recognized revenue, profitability, debt, liquidation
      preferences, or board control.
    claimRefs: [CO014, CO015, CO016, CO017]
    tableRefs: [TO003]
    figureRefs: [FO001]
