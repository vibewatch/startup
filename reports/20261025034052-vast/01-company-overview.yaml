callouts:
  - calloutType: strength
    title: Founder-product alignment
    body: Simon Song's prior AI-company experience and the rapid progression from text/image-to-3D tooling to reported enterprise integrations support a credible founder-product fit.
    claimRefs: [CO002, CO003, CO013]
  - calloutType: risk
    title: Capital and scale disclosure risk
    body: Public evidence supports momentum but not a reconciled capitalisation or operating KPI set; the reported valuation, total raised, user counts, and revenue quality should remain conditional until primary records are reviewed.
    claimRefs: [CO009, CO011, CO015, CO016, CO017]
