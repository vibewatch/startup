      - [Studios and companies, "Approximately 90,000", "2026-05", "KuCoin report", "low", "Enterprise prospect and integration surface", "Paying accounts, production deployments, and concentration"]
    notes: "Values are source-reported and use different populations and vintages; no growth rate is calculated because the denominators are not comparable."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [NetEase, Game studio, "Technology used in Where Winds Meet; interactive 3D avatars are described", "Reported production use, independently unverified here", "Named game deployment signal", "No contract value, seats, renewal, or customer quote"]
      - [Tencent, Technology/content company, "Tripo model integrated into workflows", "Deployment status not specified", "Named enterprise integration signal", "No use-case outcome or customer-authored evidence"]
      - [ByteDance, Technology/content company, "Tripo model integrated into workflows", "Deployment status not specified", "Named enterprise integration signal", "No use-case outcome or customer-authored evidence"]
      - [Microsoft, Technology/content company, "Tripo model integrated into workflows", "Deployment status not specified", "Named enterprise integration signal", "No use-case outcome or customer-authored evidence"]
    enumerationScope:
      coverage: sample
      basis: "Publicly named relationships found in current 2026 sources; not a complete customer census or verified revenue-ranked list."
    notes: "Named relationships are retained as proof signals only; the sources do not provide a common production-status definition, outcome metric, contract term, or independent customer confirmation for every row."
    claimRefs: [CU010, CU011, CU012, CU013]
