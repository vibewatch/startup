schemaVersion: "report-v2"
artifact: customers
slug: vast
runDate: 2026-10-25
company:
  name: Vast
chapter:
  number: 6
  title: Customers
  summary: Vast has credible evidence of broad creator and developer reach, named game-industry use, and a freemium-to-paid path, but public evidence does not yet establish active-account quality, production durability, renewal, or customer concentration. The strongest adoption signal is the combination of reported platform scale and named integrations; the principal diligence gap is converting these top-line and company-reported figures into auditable cohorts and revenue-linked deployments.
sections:
  - id: customer-segments
    title: Who uses and pays for Tripo
    body: >-
      Vast’s customer surface spans individual creators, developers, studios and companies, and potentially industrial users. The company describes Tripo AI as serving creators and developers, while external coverage reports nearly 10 million individual users and approximately 90,000 studios and companies; another current account reports 20 million users but also describes the figure as coming from the company. These counts are not directly comparable because their populations and dates differ, so they should be treated as reported reach rather than a verified active-customer base. The commercial path is visible in the public pricing structure: a free, non-commercial tier is separated from paid plans beginning at $20 per user per month, with higher limits and commercial features. This supports a plausible self-serve acquisition funnel, but no public source here discloses paid conversion, account-level revenue, contract value, or the share of users who become production customers.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption signals and durability
    body: >-
      The clearest trajectory signal is the increase in reported platform scale across contemporaneous accounts: Tripo’s March release said more than 6.5 million creators and 90,000 developers had generated nearly 100 million models, while May coverage cited nearly 10 million individual users and roughly 90,000 studios and companies. A later funding account reported tens of millions of users globally and integrations into NetEase, Tencent, ByteDance, and Microsoft, but it did not provide active-user, paid-account, or revenue denominators. The named production evidence is stronger than logo-only evidence where a use case is specified: the company’s GDC material describes game-engine workflows and a 250-person developer event, and current coverage identifies NetEase use in Where Winds Meet. Still, the public record does not establish repeat usage, renewal, churn, gross retention, net retention, or whether named relationships are pilots, production deployments, or ecosystem integrations.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-expansion
    title: Named proof, expansion, and concentration
    body: >-
      Named-company evidence indicates that Tripo is moving beyond an individual creator tool toward developer and studio workflows. Implicator reports NetEase use in the game Where Winds Meet and identifies the company’s stated developer and enterprise/API reach; Dealroom reports integrations into NetEase, Tencent, ByteDance, and Microsoft. These are useful validation signals, but they remain principally company-originated or secondary summaries rather than customer-authored outcome studies. The public evidence does not quantify production seats, spend, deployment locations, time-to-value, asset acceptance rates, expansion from a first team to a wider organization, or revenue concentration by customer. Pricing research also indicates that commercial use, private models, higher concurrency, batch generation, and API/integration access sit behind paid tiers, making those upgrade triggers plausible but not proof of conversion. Investors should therefore distinguish reach and integration from durable, revenue-producing adoption and request customer-level cohort evidence before underwriting expansion.
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
  - id: customer-gaps
    title: Evidence limits and diligence priorities
    body: >-
      Public customer evidence is directionally positive but incomplete. The sources support segmentation, reported reach, named ecosystem relationships, and a visible usage-based subscription model; they do not support a precise active-customer count, paid conversion rate, cohort retention, expansion rate, average contract value, or concentration percentage. Conflicting scale figures should not be reconciled by averaging them: the 6.5 million creator figure, nearly 10 million individual-user figure, and 20 million user figure have different sources, dates, and denominators. The next diligence step is a customer-level export that ties account IDs to plan, geography, use case, production status, gross and net retention, expansion, churn reason, and revenue. A second step is reference verification with at least three named customers, including one that can attest to production use rather than experimentation.
    claimRefs: [CU014, CU015, CU016]
    tableRefs: []
