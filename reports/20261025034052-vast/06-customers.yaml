    title: Customer journey from creation to production expansion
    type: journey-map
    summary: Reported customer path from low-friction creation to paid, team, and production use, with the main evidence gaps at each transition.
    data:
      nodes:
        - id: discover
          label: Discover
          title: Free creator entry
          details: "Free tier and public creator tooling lower trial friction."
          touchpoints: ["Free plan", "Text/image prompts", "Public models"]
        - id: create
          label: Create
          title: Repeat asset generation
          details: "Reported creator and model-generation volume indicates broad usage, but repeat-user rates are not disclosed."
          touchpoints: ["6.5M+ creators reported", "Nearly 100M models reported", "No active denominator"]
        - id: upgrade
          label: Upgrade
          title: Paid commercial workflow
          details: "Commercial use, higher credits, concurrency, and integrations are positioned as paid-plan upgrade triggers."
          touchpoints: ["Pro from $20/user/month", "Commercial use", "Higher limits"]
        - id: deploy
          label: Deploy
          title: Studio and developer integration
          details: "Named enterprise relationships and game use suggest workflow integration, but production status is unevenly specified."
          touchpoints: ["NetEase", "Tencent", "ByteDance", "Microsoft"]
        - id: expand
          label: Expand
          title: Durable organizational adoption
          details: "Expansion, renewal, and concentration are not publicly quantified."
          touchpoints: ["Retention", "Seats and locations", "ACV and concentration gap"]
        - id: verify
          label: Verify
          title: Customer reference diligence
          details: "Reference calls and cohort exports are needed to validate production durability."
          touchpoints: ["Reference calls", "Cohort export", "Revenue reconciliation"]
    claimRefs: [CU003, CU004, CU005, CU007, CU010, CU014]
callouts:
  - calloutType: strength
    title: Broad reach with a visible monetization path
    body: "Reported creator, developer, and studio scale is paired with a public free-to-paid structure, giving Vast a credible acquisition and monetization surface even though conversion is undisclosed."
    claimRefs: [CU001, CU003, CU004, CU005]
  - calloutType: risk
    title: Adoption quality is not yet auditable
    body: "Public materials do not establish active usage, paid conversion, renewal, expansion, or customer concentration, and reported user totals use inconsistent populations and dates."
    claimRefs: [CU008, CU009, CU014, CU015]
  - calloutType: recommendation
    title: Request customer-level cohorts before underwriting expansion
    body: "Require plan-level cohorts and references that separate experimentation, pilots, production deployments, and renewed revenue before treating reported reach as durable customer traction."
    claimRefs: [CU014, CU016]
