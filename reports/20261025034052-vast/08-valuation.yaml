callouts:
  - calloutType: recommendation
    title: Recommendation
    body: Public evidence supports tracking Vast as a potentially important AI-3D platform, not buying at an assumed valuation. The decisive next step is an investor-grade metric and cap-table package.
    claimRefs: [CV001, CV005, CV009, CV010]
  - calloutType: risk
    title: Thesis-break triggers
    body: Treat unreconciled financing disclosures, weak paid conversion, inference-driven margin compression, or material customer and geopolitical concentration as reasons to reduce the valuation stance or stop diligence.
    claimRefs: [CV005, CV011, CV012, CV013, CV014, CV016]
