schemaVersion: "report-v2"
artifact: valuation
slug: vast
runDate: 2026-10-25
company:
  name: Vast
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a well-capitalized AI-3D company with unicorn-scale financing and meaningful reported adoption, but it does not disclose verified revenue, margins, retention, or common-equity terms. The appropriate stance is track/research-more until the financing record and operating metrics reconcile.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Vast has a credible category and financing signal: independent coverage describes Tripo AI as a text- and image-to-3D platform, while public reporting attributes nearly $200 million of 2026 financing to the company and says it crossed the billion-dollar valuation threshold. Reported distribution is also notable: AI Weekly describes 10 million individual users and 90,000 studios, and names Sony and NetEase as customers, although those figures are company-reported or reported without audited denominators. The anti-thesis is that this evidence establishes attention and capital access, not economic value. No retained source verifies ARR, recognized revenue, gross margin, retention, customer concentration, preference terms, or a precise post-money valuation. A second set of 2026 data pages reports a much larger Series B and substantially higher cumulative funding, but those figures conflict with the nearly $200 million account and require cap-table and announcement-level verification before underwriting.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Price discipline and comparable evidence
    body: >-
      The available public comparable evidence supports a framework, not a defensible mark for Vast. Multiples' October 2026 public software sample reports a 3.5x EV/revenue median for artificial-intelligence software and a 2.1x median across the listed horizontal SaaS categories; the source says its public-market data is powered by FactSet consensus estimates and Morningstar historical data. Acquiry's private-market discussion places high-growth AI-native SaaS at 10x–20x ARR, but explicitly says private transactions are not directly comparable to public companies and stresses NRR, CAC payback, gross margin, and profitability. Vast's retained evidence does not provide those inputs, and the company's model combines subscription and usage-based revenue according to a market-data profile. Applying either benchmark to an unverified revenue base would create false precision, so the missing metric pack is itself the central valuation finding.
      TechCrunch's report of a $20 billion financing valuation for Chinese AI company Moonshot is a useful signal of private-market appetite, not a direct comp: Moonshot builds language models, and this chapter has no evidence that its revenue quality, economics, or financing rights match Vast's.
    claimRefs: [CV006, CV007, CV008, CV009, CV015]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence triggers
    body: >-
      A bull case requires converting reported user and studio reach into paid usage, repeat production workflows, durable gross margins, and a clean financing record. A base case assumes the product remains strategically relevant but public evidence cannot yet demonstrate monetization or common-equity value; that supports tracking rather than a buy call. A bear case combines financing-data inconsistency, AI-3D competition from Tencent and other model providers, customer or geopolitical concentration, and a valuation reset if growth does not become measurable revenue. Exit readiness is therefore conditional: a future financing, secondary, acquisition, or public-market process should disclose audited or investor-grade revenue, retention, unit economics, cap-table preferences, dilution, and customer concentration. The immediate thesis-break triggers are a failure to reconcile the rounds, materially weaker paid conversion than reported reach implies, or evidence that inference costs prevent attractive gross margins.
      A low-reputation but directionally adverse category survey adds a caution rather than a benchmark: it characterizes generative AI and generic AI platforms as crowded or overvalued and consumer-focused startups as riskier. That warning does not prove Vast is overvalued, but it reinforces the need to price verified economics rather than category enthusiasm.
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - [Recommendation, track, "Maintain exposure only as a monitored opportunity; do not underwrite a buy from public evidence."]
      - [Confidence, medium-low, "The category and financing signals are credible, but operating and terms data are incomplete."]
      - [Risk rating, high, "Financing inconsistency, monetization opacity, competition, and China/geopolitical exposure remain material."]
      - [Valuation stance, stretched, "A unicorn threshold is reported, but public evidence does not support a precise price or revenue multiple."]
      - [Target return / hold / exit, "Not supportable from retained evidence", "Require a verified revenue base, ownership terms, and exit assumptions before setting a target."]
    notes: Public reporting is directional and includes company-reported adoption figures; null or unsupported financial inputs are not treated as zero.
    claimRefs: [CV001, CV004, CV005, CV006, CV010, CV011, CV012, CV013, CV014, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Category leadership and product relevance", "Tripo converts text or images into 3D assets; coverage reports a latest model and production-oriented use cases.", "Independent quality, workflow-retention, and paid-usage data would strengthen or weaken the moat claim."]
      - ["Distribution can become monetization", "AI Weekly reports 10M users and 90K studios, with Sony and NetEase named as customers.", "Cohort conversion, ACV, renewal, and concentration disclosures are required."]
      - ["Capital access is a strength", "Sources report a 2026 financing near $200M and unicorn status.", "Signed round documents and post-money terms must reconcile the larger alternative financing accounts."]
      - ["Price may outrun proof", "No retained source supplies verified ARR, revenue, margin, NRR, or preference terms.", "Investor-grade financials and cap-table terms could support a re-rating."]
    notes: Rows separate reported signals from underwriting requirements; customer and financing figures are not independently audited in the retained sources.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Verified ARR growth exceeds 50%, reported reach converts to paid studio workflows, retention and gross margin are strong, and financing terms are clean.", "Use Acquiry's 10x–20x ARR range only against verified ARR, then apply the actual dilution and preference waterfall; no Vast enterprise value can be calculated yet.", "Competition and inference-cost escalation could compress margins.", "Low-to-medium until the metric pack is verified."]
      - [Base, "Product remains relevant and capitalized, but monetization and common-equity terms remain opaque.", "The 3.5x NTM revenue public-AI reference is a benchmark only; without recognized revenue, no company value or target return is supportable.", "Dilution, preferences, customer concentration, and geopolitical exposure.", "Medium."]
      - [Bear, "Reported financing figures cannot be reconciled or paid conversion is weak; public-market AI multiples compress.", "A 2.1x–3.5x NTM revenue reference range spans the horizontal-software median and AI category benchmark, but cannot be converted without revenue; a down round remains plausible.", "Commercialization failure, cost intensity, regulatory or cross-border constraints.", "Material downside; probability cannot be quantified from retained evidence."]
    notes: ARR and NTM revenue benchmarks are shown separately and are not interchangeable; no verified Vast revenue base, margins, retention, cap table, or preference stack is retained, and probability signals are not statistical probabilities.
    claimRefs: [CV005, CV006, CV007, CV008, CV011, CV012, CV013, CV014, CV015, CV016]
