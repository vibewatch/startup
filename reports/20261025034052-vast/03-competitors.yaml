    title: Feature and capability matrix
    columns: [Buying criterion, Vast / Tripo, Meshy, Luma or Microsoft, Internal build, Evidence implication]
    rows:
      - [Text/image-to-3D, "Reported core capability", "Published product capability", "Not established by retained sources", "Possible but requires internal models or tools", "Specialist evidence favors Vast and Meshy"]
      - [PBR texturing and animation, "Not established in retained sources", "Published PBR texturing, rigging, and animation", "Not established", "Possible with pipeline components", "Meshy has broader visible workflow coverage"]
      - [Game-engine and production workflow, "Enterprise API and production-ready claim reported", "Unity, Unreal, Godot, Blender, and Maya compatibility published", "Creative workflow broad but 3D support not established", "Existing pipeline may be strongest for incumbents", "Integration depth and realized usage need diligence"]
      - [Model/research differentiation, "Five SIGGRAPH papers and Tripo P1.0/P2.0 signals reported", "Product quality and reviews claimed by company", "Luma says it builds models underneath its product", "Proprietary know-how possible", "Research visibility is not the same as defensible distribution"]
      - [Enterprise trust or channel access, "Reported integrations at NetEase, Tencent, ByteDance, and Microsoft", "Customer testimonial and platform presence claimed", "Brand and enterprise platform context", "Existing procurement and governance", "Customer references, contracts, and exclusivity are unknown"]
      - ["Reliability, SLA, and compliance", "Unknown in retained sources", "Unknown in retained sources", "Microsoft documentation provides product documentation but not a comparative SLA here", "Can be controlled internally", "Do not infer trust parity from product pages"]
    notes: "Cells summarize only retained evidence. Unsupported capabilities are marked unknown or not established; no feature parity is inferred from absence."
    claimRefs: [CP002, CP003, CP004, CP005, CP008, CP009, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider or alternative, Price or unit, Contract model, Included capability signal, Discount or unknowns, Buyer implication]
    rows:
      - [Vast / Tripo, Unknown, Studio plus enterprise API reported, Text/image-to-3D and production-oriented model positioning, "Realized price, API minimums, SLA, and discounts unknown", "Pricing power cannot be underwritten"]
      - [Meshy, "Unknown in retained product and release sources", "Subscription or usage model not stated in retained text", "Creation, texturing, rigging, animation, and print workflows", "Enterprise terms and realized discount unknown", "Breadth may increase willingness to pay but public price is missing"]
      - [Luma, Unknown, "Creative-team platform model not stated", "Multimodal agents and proprietary models", "Contract and usage terms unknown", "Can compete for creative-workflow budget"]
      - [Microsoft Sora, Unknown in retained documentation, "API preview documentation", "Video generation capability", "Consumption prices and enterprise terms not in retained source", "Platform procurement may simplify adjacent adoption"]
      - [Internal build or manual workflow, Unknown, "Labor, software, and infrastructure budget", "Control and customization", "Total cost and cycle time not quantified", "Requires customer-specific build-versus-buy diligence"]
    notes: "No retained source provides a comparable realized price per asset, API call, seat, or contract. The table therefore preserves unknowns instead of manufacturing a price comparison."
    claimRefs: [CP003, CP004, CP005, CP012]
