company:
  name: Vast
chapter:
  number: 3
  title: Competitors
  summary: >-
    Vast competes in a fast-forming AI-3D category where Tripo's foundation-model and enterprise positioning is differentiated, but Meshy already shows stronger public commercial disclosure and adjacent multimodal platforms widen the substitution set. The evidence supports category momentum and research visibility, not yet a durable moat in distribution, pricing, or switching costs.
sections:
  - id: landscape
    title: Competitive landscape and strategic position
    body: >-
      Vast's relevant competitive set spans specialized text-to-3D products, multimodal creative platforms, and the incumbent workflow of manual modeling or internal studio teams. Independent coverage describes Tripo as a 3D foundation-model and content-platform effort. Meshy is the closest specialized public comparator: its own product surface emphasizes text/image-to-3D, PBR texturing, rigging, animation, game-engine exports, and 3D-printing workflows. Luma is a broader creative-intelligence platform spanning video, image, audio, and text, and Microsoft's Sora documentation shows how general-purpose video generation can absorb adjacent creative budgets without proving direct 3D parity. The practical buyer choice is therefore not only which 3D generator to use, but whether to buy a specialist, use a broader creative suite, or retain manual and internal production. Public evidence does not enumerate all likely entrants, so platform expansion remains a scenario rather than a complete competitor census.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP013]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-comparison
    title: Capability, pricing, and buyer trade-offs
    body: >-
      Public evidence supports a capability comparison but leaves important commercial cells unresolved. Vast's reported Tripo Studio and enterprise API address game studios and content producers, while Meshy publishes a wider visible workflow spanning creation, texturing, rigging, animation, game engines, and print exports. A Meshy-issued release distributed by PRNewswire claims $15 million ARR, 30% monthly revenue growth in 2025, 85% gross margin, and six million users; each metric remains a competitor claim rather than an independent benchmark of Vast. Publicly visible comparable pricing is absent from the retained Vast, Meshy, Luma, and Microsoft evidence. Accordingly, the matrix marks price, realized discounts, SLA, and switching costs as unknown rather than inferring parity from feature lists or treating funding as operating scale.
    claimRefs: [CP006, CP007, CP008, CP009, CP012, CP014, CP015]
    tableRefs: [TP002, TP003]
  - id: moat-risk
    title: Moat durability and displacement risk
    body: >-
      Vast has credible technical and ecosystem signals: a Hamidun report says its Tripo P1.0 model generated a topologically clean model in about two seconds and that the company had five SIGGRAPH Technical Papers in 2026. Dealroom reports Tripo P2.0 Preview raised the single-object cap from 20,000 to 50,000 triangles and added native quad topology, while Dealroom and KuCoin name integrations or clients including NetEase, Tencent, ByteDance, Microsoft, and Sony. Those signals can support product quality and distribution, but they do not establish retention, paid conversion, gross profit, or exclusive supply. Meshy's visible workflow breadth and claimed commercial scale raise commoditization pressure, while Luma and Microsoft illustrate substitution by broader creative or multimodal platforms. Multiples' reported funding total shows capital capacity, not customer lock-in. The moat is therefore conditional on continued model quality, workflow completion, enterprise trust, and measurable usage conversion.
    claimRefs: [CP008, CP009, CP010, CP011, CP012, CP013, CP016]
    tableRefs: []
callouts:
  - calloutType: insight
    title: Specialist advantage, open commercial proof
    body: >-
      Vast appears technically credible and strategically well-funded, but the retained evidence does not show that its specialist position converts into superior paid economics or customer lock-in versus Meshy and broader creative platforms.
    claimRefs: [CP006, CP010, CP012, CP016]
  - calloutType: risk
    title: Distribution and commoditization risk
    body: >-
      Competitors can attack from both directions: specialized workflow breadth from Meshy and multimodal platform breadth from Luma or Microsoft. Vast's public evidence does not yet quantify switching costs, renewals, or channel exclusivity.
    claimRefs: [CP003, CP004, CP005, CP013]
