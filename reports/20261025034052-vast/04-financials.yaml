company:
  name: Vast
chapter:
  number: 4
  title: Financials
  summary: Vast has a documented subscription and usage-based model, rapidly expanding creator and developer usage, and substantial reported financing, but public evidence does not disclose recognized revenue, gross margin, cash balance, burn, or runway. The underwriting conclusion is therefore driven by monetization proxies and financing dependency rather than a verified earnings profile.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Vast monetizes Tripo through subscription tools, creator software, and developer APIs, while public reporting also describes a B2B and B2C customer focus. The product is distributed globally: SCMP reported that more than 85% of users were outside China and identified Europe and the United States as the largest markets. The same report said monthly income grew 2.5 times within one month and fivefold within three months after the beta launch, but this is a founder quotation rather than audited revenue. Auganix reported more than 6.5 million creators, 90,000 developers, and nearly 100 million generated assets, while Dealroom described tens of millions of Tripo Studio users and integrations with NetEase, Tencent, ByteDance, and Microsoft. These are useful demand and distribution indicators, but they do not establish paid conversion, recognized revenue, average revenue per account, retention, or enterprise contract value. The strongest commercial diligence question is whether usage converts into durable paid cohorts rather than promotional or free activity.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing, delivery economics, and unit economics
    body: >-
      Public sources identify the monetization mechanisms but not list prices, realized prices, discounting, API consumption rates, or customer-level contract terms. That prevents a reliable calculation of gross profit per generated asset, contribution margin by plan, CAC payback, or sales efficiency. SCMP described a very lean commercial motion in which only two salespeople were focused on service and the company relied on organic growth and word of mouth; this supports a low reported sales-and-marketing burden at that point in time, but it is not a complete CAC measure and may not persist as enterprise selling scales. The technical and service-cost side is also unresolved: generating production-ready meshes in seconds and operating a large spatial-asset corpus imply compute, storage, inference, and support costs, but no public source supplies a cost-per-generation or gross-margin figure. The table therefore distinguishes observed mechanisms from missing underwriting inputs.
      An independent review adds pricing risk: Tencent's open-source Hunyuan3D could push the
      category toward commoditization before Vast proves retention in production workflows.
    claimRefs: [CI006, CI007, CI009, CI019]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Vast has unusually strong public financing signals for a private company. Independent coverage described nearly $200 million raised around June 2026 and a valuation above $1 billion; Multiples subsequently listed a September Series B of about $446 million and total financing of $644 million across three rounds, while Dealroom's article text said the company reported roughly $687.5 million raised in under six months. These figures are not fully reconciled: sources use different round labels, currencies, and aggregation boundaries, and the company-level financing announcement in Cyzone describes more than RMB1 billion for an A3 strategic round without publishing cash-on-hand or obligations. Capital raised is not cash available. No assigned source reports cash balance, monthly burn, runway, debt, project-finance commitments, or the next-round trigger. The financing pace reduces near-term funding risk only conditionally; it also raises the diligence need for cap-table terms, use of proceeds, investor concentration, and whether infrastructure investment will consume capital faster than monetization develops.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI004]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: The public record supports a thesis of strong demand signals and financing access, not a verified profitability or valuation case. Usage growth, international reach, named enterprise integrations, and a broad investor base are positive indicators for revenue potential. Conversely, the evidence does not establish ARR, recognized revenue, gross margin, net revenue retention, free cash flow, customer concentration, or the realized price paid by enterprise users. Open-source competition adds a credible risk to pricing power before paid-cohort durability is known. The reported valuation and financing totals are particularly difficult to underwrite because they are headline private-market figures rather than a disclosed common-equity value or a cash-flow multiple. A decision-ready model should be built from monthly paid accounts, API and subscription revenue by cohort, generation volume, inference and storage cost, enterprise ACV, renewal and expansion data, headcount, cash, burn, debt, and financing preferences. Until those inputs are supplied, Vast merits continued diligence rather than a conclusion based on revenue quality or margin path.
    claimRefs: [CI016, CI017, CI019]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and observable traction
    columns: [Stream, Mechanism, Unit or public signal, Current value/status, Quality and diligence ask]
    rows:
      - [Creator subscriptions, "Subscription tools and creator software", "Account or plan", "Mechanism reported; price and paid conversion undisclosed", "Company/third-party descriptions; obtain plan-level paid cohorts and realized ARPU"]
      - [Developer/API usage, "Developer APIs and platform integration", "Developer or API account", "90,000 developers reported by Auganix; API price and volume undisclosed", "Third-party report of company statement; obtain usage billing and retention by cohort"]
      - [Enterprise workflows, "Production use and integrations", "Named platform or enterprise relationship", "Integrations reported with NetEase, Tencent, ByteDance, and Microsoft", "Relationship presence does not prove revenue; obtain contracts, ACV, renewal, and concentration"]
      - [Asset-generation activity, "Generated 3D assets supporting demand", "Assets generated", "Nearly 100 million assets reported by Auganix", "Activity proxy, not revenue; reconcile paid versus free generation and compute cost"]
    notes: "Public sources describe mechanisms and activity proxies, not recognized revenue. Values are as reported by named sources; null or undisclosed pricing and conversion require company evidence."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Metric, Public evidence, List versus realized pricing, Confidence, Diligence ask]
    rows:
      - [Subscription pricing, "Subscription model identified by Multiples", "No public price retained in the assigned pool", medium, "Provide plan catalog, paid accounts, discounts, ARPU, and cohort retention"]
      - [Usage-based pricing, "Usage-based model identified by Multiples", "No API unit price or consumption schedule retained", medium, "Provide API calls, credits, GPU-minute economics, and overage realization"]
      - [Sales motion, "Two salespeople focused on service; organic and word-of-mouth growth reported by SCMP", "No CAC or sales-cycle data", medium, "Provide fully loaded CAC, conversion funnel, cycle length, and enterprise pipeline"]
      - [Gross-margin driver, "Seconds-level mesh generation and large asset corpus described by Auganix", "Compute, storage, and support costs undisclosed", low, "Provide unit cost per generation, infrastructure commitments, and support cost allocation"]
    notes: "The table separates monetization mechanisms from realized prices and economics. No public list-price or margin figure was available in the retained evidence."
    claimRefs: [CI006, CI007, CI009]
  - id: TI004
    title: Financing and capital-adequacy evidence
    columns: [Financing signal, Reported amount or status, Period, Source posture, Underwriting implication]
    rows:
      - [Series A, "$50M", "March 2026", "Reported by KuCoin and Auganix; terms not independently audited", "Shows early financing access; does not establish cash remaining"]
      - [Series A+/A++ financing, "Nearly $200M total", "June 2026 reporting", "Reported by independent coverage and company-syndicated release", "Supports capital access; reconcile round boundaries and proceeds"]
      - [Series B or B+ financing, "$446M in Multiples; about $412.5M in Dealroom headline", "September 2026", "Private-market database and Dealroom reporting differ", "Material conflicting amount; obtain signed financing documents"]
      - ["Cash, burn, runway, debt, and preferences", null, "As of 2026-10-25", "Not disclosed in retained evidence", "Capital raised cannot substitute for cash available; obtain current financial pack and cap table"]
    notes: "Financing figures are not additive without reconciling currencies, labels, and aggregation periods. Capital raised is not cash available and no runway is inferred."
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: From usage activity to underwritten revenue
    type: flow
    summary: Public evidence supports a path from creator and developer activity to subscription, API, and enterprise revenue, but the conversion and margin stages remain unverified.
    data:
      nodes:
        - id: activity
          label: "Creators, developers, and generated assets"
          detail: "6.5M creators, 90K developers, and nearly 100M assets were reported by Auganix; these are activity indicators."
        - id: self_serve
          label: "Subscription and creator software"
          detail: "Subscription tools and creator software are described as monetization mechanisms; paid conversion is undisclosed."
        - id: api
          label: "Developer API usage"
          detail: "Developer APIs are described as a monetization mechanism; unit prices and usage volumes are undisclosed."
        - id: enterprise
          label: "Enterprise workflows"
          detail: "Integrations with named platforms are reported; contract value and renewal are undisclosed."
        - id: revenue
          label: "Recognized revenue"
          detail: "No recognized revenue or ARR figure was retained in the assigned evidence."
        - id: gross_profit
          label: "Gross profit"
          detail: "Compute, storage, support costs, and gross margin were not disclosed."
      edges:
        - from: activity
          to: self_serve
        - from: activity
          to: api
        - from: activity
          to: enterprise
        - from: self_serve
          to: revenue
        - from: api
          to: revenue
        - from: enterprise
          to: revenue
        - from: revenue
          to: gross_profit
    approximationNotes: "This is an evidence-backed operating model, not a quantitative revenue bridge; no conversion rate, revenue amount, or margin is inferred."
    claimRefs: [CI001, CI003, CI006, CI007, CI016, CI017]
callouts:
  - calloutType: strength
    title: Demand and capital access are visible
    body: Public activity metrics, global usage, named integrations, and large reported financing rounds provide credible reasons to investigate commercial scale.
    claimRefs: [CI001, CI002, CI003, CI010, CI011]
  - calloutType: risk
    title: The earnings bridge is still missing
    body: ARR, recognized revenue, gross margin, cash, burn, runway, and paid-cohort conversion remain unavailable in the retained evidence, so headline valuation cannot be tested against operating performance.
    claimRefs: [CI016, CI017]
  - calloutType: recommendation
    title: Request a finance and cohort pack
    body: Prioritize monthly revenue by stream, paid cohorts, enterprise ACV and renewal, direct compute costs, cash and burn, debt, and financing preferences before underwriting.
    claimRefs: [CI017]
