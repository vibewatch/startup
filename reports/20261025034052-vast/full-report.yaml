chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Vast was founded in 2023 by Simon Song after his work at SenseTime and MiniMax, according to multiple
              independent profiles. The company operates the Tripo AI/Tripo Studio platform, which turns text or image
              prompts into 3D objects and is positioned for game, film, industrial-design, and XR workflows. Public
              descriptions identify Beijing as the operating base, with reporting also describing staff split between
              Beijing and Hangzhou and a Cayman Islands registration for Tripo AI. The commercial model is not fully
              disclosed, but reporting describes creator subscriptions, token-based usage, and project-based enterprise
              charges. The product is therefore best understood as a hybrid creator software and enterprise/API platform
              rather than a pure consumer application. The available evidence supports a clear product identity, while
              the legal-entity structure, board composition, and precise recurring-revenue mix remain diligence items.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO007
              - CO009
              - CO010
              - CO014
      - number: '1.2'
        title: Leadership, team, and adoption signals
        blocks:
          - type: paragraph
            body: >-
              Simon Song is the only named executive consistently identified in the assigned evidence. His prior
              SenseTime and MiniMax experience is relevant founder-market-fit evidence for an AI platform, but the pool
              does not establish a complete executive team, board, or succession plan. Scale signals are substantial but
              inconsistent: one June 2026 profile reports roughly 20 million users and around 150 staff, while an
              earlier company announcement reported more than 6.5 million creators, 90,000 developers, and nearly 100
              million generated assets. These figures may reflect different dates, product surfaces, or user
              definitions; they should not be combined into a single funnel. Enterprise references to NetEase, Sony,
              Tencent, Microsoft, and others indicate distribution and workflow validation, but the evidence does not
              disclose contract size, retention, or customer concentration. Key-person dependence should remain a
              material diligence risk until governance and leadership depth are documented.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
