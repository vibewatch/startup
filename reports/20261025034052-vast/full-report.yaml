  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and financing support continued diligence, while missing operating metrics and financing terms
      constrain the recommendation to track.
    data:
      nodes:
        - id: scale
          label: Reported scale
          detail: 10M users and 90K studios are reported, but denominators and audit quality are not established.
        - id: capital
          label: Financing signal
          detail: Public sources report nearly $200M and unicorn status; other sources report materially larger rounds.
        - id: proof
          label: Missing economic proof
          detail: >-
            ARR, revenue, gross margin, retention, paid conversion, and concentration are undisclosed in retained
            evidence.
        - id: price
          label: Price discipline
          detail: Public and private software benchmarks cannot be applied without a verified revenue or ARR base.
        - id: risk
          label: Downside controls
          detail: Reconcile financing, preferences, dilution, inference costs, competition, and geopolitical exposure.
        - id: call
          label: Track / research-more
          detail: Do not issue a buy recommendation until the metric pack and terms are verified.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV010
      - CV014
      - CV015
      - CV016
