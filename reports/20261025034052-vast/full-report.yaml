  - id: FI001
    title: From usage activity to underwritten revenue
    type: flow
    summary: >-
      Public evidence supports a path from creator and developer activity to subscription, API, and enterprise revenue,
      but the conversion and margin stages remain unverified.
    data:
      nodes:
        - id: activity
          label: Creators, developers, and generated assets
          detail: >-
            6.5M creators, 90K developers, and nearly 100M assets were reported by Auganix; these are activity
            indicators.
        - id: self_serve
          label: Subscription and creator software
          detail: >-
            Subscription tools and creator software are described as monetization mechanisms; paid conversion is
            undisclosed.
        - id: api
          label: Developer API usage
          detail: Developer APIs are described as a monetization mechanism; unit prices and usage volumes are undisclosed.
        - id: enterprise
          label: Enterprise workflows
          detail: Integrations with named platforms are reported; contract value and renewal are undisclosed.
        - id: revenue
          label: Recognized revenue
          detail: No recognized revenue or ARR figure was retained in the assigned evidence.
        - id: gross_profit
          label: Gross profit
          detail: Compute, storage, support costs, and gross margin were not disclosed.
      edges:
        - from: activity
          to: self_serve
        - from: activity
          to: api
        - from: activity
          to: enterprise
        - from: self_serve
          to: revenue
        - from: api
          to: revenue
        - from: enterprise
          to: revenue
        - from: revenue
          to: gross_profit
    approximationNotes: >-
      This is an evidence-backed operating model, not a quantitative revenue bridge; no conversion rate, revenue amount,
      or margin is inferred.
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI007
      - CI016
      - CI017
  - id: FE001
    title: Tripo product architecture map
    type: stack
    summary: >-
      Tripo's public product surface runs from generation inputs through model and post-processing layers into APIs,
      plugins and creator workflows.
    data:
      layers:
        - label: Inputs and generation
          detail: User prompts and visual references are transformed into candidate 3D assets.
          items:
            - name: Text-to-3D
              detail: Natural-language prompt to 3D asset
            - name: Image and multi-view
              detail: Single or multiple visual references to 3D asset
            - name: H3.1 and P1.0
              detail: Model families described in 2026 product coverage
        - label: Asset preparation
          detail: Generated geometry and materials are refined for downstream use.
          items:
            - name: Geometry and topology
              detail: Native-spatial generation and Smart Mesh positioning
            - name: Textures and optimization
              detail: PBR/texturing, low-poly and mesh refinement workflows
            - name: Rigging and animation
              detail: Post-processing support described by product reviews
        - label: API and task orchestration
          detail: Asynchronous tasks connect application requests to generated outputs.
          items:
            - name: API
              detail: REST task submission, polling and downloadable outputs
        - label: Plugins and exports
          detail: Generated assets move into creator and game tools.
          items:
            - name: Integrations
              detail: Engine integrations plus GLB, GLTF, FBX and OBJ paths
        - label: Creator platform
          detail: Subscriptions, workspace, developer surface and community surround the workflow.
          items:
            - name: Platform surface
              detail: Creator applications, developer APIs and community
        - label: Trust and operations
          detail: Operational controls determine whether the workflow can be embedded in production.
          items:
            - name: Controls to validate
              detail: Reliability, privacy, licensing, security and support commitments
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE011
  - id: FU001
    title: Customer journey from creation to production expansion
    type: journey-map
    summary: >-
      Reported customer path from low-friction creation to paid, team, and production use, with the main evidence gaps
      at each transition.
    data:
      nodes:
        - id: discover
          label: Discover
          title: Free creator entry
          details: Free tier and public creator tooling lower trial friction.
          touchpoints:
            - Free plan
            - Text/image prompts
            - Public models
        - id: create
          label: Create
          title: Repeat asset generation
          details: Reported creator and model-generation volume indicates broad usage, but repeat-user rates are not disclosed.
          touchpoints:
            - 6.5M+ creators reported
            - Nearly 100M models reported
            - No active denominator
        - id: upgrade
          label: Upgrade
          title: Paid commercial workflow
          details: Commercial use, higher credits, concurrency, and integrations are positioned as paid-plan upgrade triggers.
          touchpoints:
            - Pro from $20/user/month
            - Commercial use
            - Higher limits
        - id: deploy
          label: Deploy
          title: Studio and developer integration
          details: >-
            Named enterprise relationships and game use suggest workflow integration, but production status is unevenly
            specified.
          touchpoints:
            - NetEase
            - Tencent
            - ByteDance
            - Microsoft
        - id: expand
          label: Expand
          title: Durable organizational adoption
          details: Expansion, renewal, and concentration are not publicly quantified.
          touchpoints:
            - Retention
            - Seats and locations
            - ACV and concentration gap
        - id: verify
          label: Verify
          title: Customer reference diligence
          details: Reference calls and cohort exports are needed to validate production durability.
          touchpoints:
            - Reference calls
            - Cohort export
            - Revenue reconciliation
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU007
      - CU010
      - CU014
