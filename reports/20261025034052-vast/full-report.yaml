  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and workflow
        blocks:
          - type: paragraph
            body: >-
              The relevant market is software and usage spend for generating, editing, and integrating production-ready
              3D assets from text or images. It includes creator subscriptions, enterprise/API usage, plugins, and
              workflow integrations serving games, digital content, ecommerce, XR, and design. It excludes GPU hardware,
              model-training infrastructure, general purpose AI applications, and downstream game or media revenue. This
              boundary matters because broad China AI figures combine chips, infrastructure, models, and services, while
              private-market estimates may cover only software and applications. Status-quo substitutes remain internal
              3D artists, outsourced studios, procedural tools, and generic image/video models that do not deliver
              editable geometry. The economic wedge is reduced modeling and cleanup time, but production acceptance
              still depends on topology, UVs, materials, and editability rather than visual plausibility alone.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and adoption signals
        blocks:
          - type: paragraph
            body: >-
              No retained source isolates a defensible Vast-specific SAM or SOM. A bounded sizing approach therefore
              separates three lenses: the broad China AI stack, the narrower software/application market, and the
              company-relevant generative-3D workflow. Axis Intelligence reports that China’s core AI industry exceeded
              1.2 trillion yuan in 2025, while it separately cites a $28.18 billion 2025 China AI software and
              applications estimate and $12.4 billion of private AI investment. These values are not interchangeable
              market revenues. The same source reports 602 million generative-AI users in December 2025, but that is a
              usage population, not a paid 3D buyer count. Vast-related reporting describes roughly 10 million
              individual users and 90,000 studios or companies, while other reporting says Tripo Studio serves tens of
              millions globally; the discrepancy makes an addressable paid-user calculation premature. The market case
              is therefore directionally attractive but valuation-sensitive to conversion, retention, enterprise ACV,
              and the share of workloads that require production-grade 3D output.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM015
      - number: '2.3'
        title: Buyers, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map has at least three routes. Individual creators and small studios are likely self-serve
              subscription users; larger game, media, design, and technology organizations are API or integration
              buyers; and strategic investors or platform partners can provide distribution while also shaping
              requirements. Dealroom reports Tripo integration into NetEase, Tencent, ByteDance, and Microsoft
              workflows, and other reporting names NetEase and Sony as clients, but the public record does not disclose
              contract values, budget owners, renewal rates, or deployment volumes. Adoption drivers are labor-cost
              compression, faster prototyping, and expanding demand for interactive content. Constraints include quality
              assurance, workflow switching and integration costs, compute intensity, content and safety compliance,
              open-source competition, platform bundling, and cross-border technology restrictions. Chinese guidance
              issued by the Cyberspace Administration of China, NDRC, and MIIT emphasizes safety, security,
              standardization, and application-driven development for AI agents; while not a 3D-specific rule, it is a
              relevant policy signal that regulated deployment and controllability can affect enterprise adoption
              timing.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Sizing and adoption gaps
        blocks:
          - type: paragraph
            body: >-
              The central diligence gap is not whether AI adoption is growing, but how much of that growth becomes
              recurring spend on Vast’s production-grade 3D workflow. Public sources do not provide a consistent
              paid-user denominator, cohort conversion, enterprise ACV, usage-based gross margin, or customer
              concentration. They also do not reconcile whether reported user counts are registered, active, or paying,
              nor whether “studios and companies” are customers, prospects, or platform accounts. Broad industry figures
              should not be used to back-solve Vast revenue. A buyer diligence request should obtain plan-level active
              users, free-to-paid conversion, retention, API volume, named-customer production use, compute cost per
              generated asset, and the percentage of output accepted without substantial human rework. Until those
              measures are available, market momentum supports a positive adoption thesis but not a precise revenue
              multiple or SOM claim.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad AI adoption is an input, not Vast TAM
            body: >-
              China’s AI adoption and capital signals support category timing, but the retained evidence does not
              convert them into a paid, generative-3D serviceable market.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM015
          - type: callout
            title: User-count quality is valuation-critical
            body: >-
              Public user counts vary materially and lack a consistent active, paid, or enterprise denominator, leaving
              conversion and recurring revenue untested.
            calloutType: risk
            claimRefs:
              - CM009
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Vast's relevant competitive set spans specialized text-to-3D products, multimodal creative platforms, and
              the incumbent workflow of manual modeling or internal studio teams. Independent coverage describes Tripo
              as a 3D foundation-model and content-platform effort. Meshy is the closest specialized public comparator:
              its own product surface emphasizes text/image-to-3D, PBR texturing, rigging, animation, game-engine
              exports, and 3D-printing workflows. Luma is a broader creative-intelligence platform spanning video,
              image, audio, and text, and Microsoft's Sora documentation shows how general-purpose video generation can
              absorb adjacent creative budgets without proving direct 3D parity. The practical buyer choice is therefore
              not only which 3D generator to use, but whether to buy a specialist, use a broader creative suite, or
              retain manual and internal production. Public evidence does not enumerate all likely entrants, so platform
              expansion remains a scenario rather than a complete competitor census.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
