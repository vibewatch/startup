              - CP004
              - CP005
      - number: '3.2'
        title: Capability, pricing, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a capability comparison but leaves important commercial cells unresolved. Vast's
              reported Tripo Studio and enterprise API address game studios and content producers, while Meshy publishes
              a wider visible workflow spanning creation, texturing, rigging, animation, game engines, and print
              exports. A Meshy-issued release distributed by PRNewswire claims $15 million ARR, 30% monthly revenue
              growth in 2025, 85% gross margin, and six million users; each metric remains a competitor claim rather
              than an independent benchmark of Vast. Publicly visible comparable pricing is absent from the retained
              Vast, Meshy, Luma, and Microsoft evidence. Accordingly, the matrix marks price, realized discounts, SLA,
              and switching costs as unknown rather than inferring parity from feature lists or treating funding as
              operating scale.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP012
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Vast has credible technical and ecosystem signals: a Hamidun report says its Tripo P1.0 model generated a
              topologically clean model in about two seconds and that the company had five SIGGRAPH Technical Papers in
              2026. Dealroom reports Tripo P2.0 Preview raised the single-object cap from 20,000 to 50,000 triangles and
              added native quad topology, while Dealroom and KuCoin name integrations or clients including NetEase,
              Tencent, ByteDance, Microsoft, and Sony. Those signals can support product quality and distribution, but
              they do not establish retention, paid conversion, gross profit, or exclusive supply. Meshy's visible
              workflow breadth and claimed commercial scale raise commoditization pressure, while Luma and Microsoft
              illustrate substitution by broader creative or multimodal platforms. Multiples' reported funding total
              shows capital capacity, not customer lock-in. The moat is therefore conditional on continued model
              quality, workflow completion, enterprise trust, and measurable usage conversion.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Specialist advantage, open commercial proof
            body: >-
              Vast appears technically credible and strategically well-funded, but the retained evidence does not show
              that its specialist position converts into superior paid economics or customer lock-in versus Meshy and
              broader creative platforms.
            calloutType: insight
            claimRefs:
              - CP006
              - CP010
              - CP012
              - CP016
          - type: callout
            title: Distribution and commoditization risk
            body: >-
              Competitors can attack from both directions: specialized workflow breadth from Meshy and multimodal
              platform breadth from Luma or Microsoft. Vast's public evidence does not yet quantify switching costs,
              renewals, or channel exclusivity.
            calloutType: risk
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Vast monetizes Tripo through subscription tools, creator software, and developer APIs, while public
              reporting also describes a B2B and B2C customer focus. The product is distributed globally: SCMP reported
              that more than 85% of users were outside China and identified Europe and the United States as the largest
              markets. The same report said monthly income grew 2.5 times within one month and fivefold within three
              months after the beta launch, but this is a founder quotation rather than audited revenue. Auganix
              reported more than 6.5 million creators, 90,000 developers, and nearly 100 million generated assets, while
              Dealroom described tens of millions of Tripo Studio users and integrations with NetEase, Tencent,
              ByteDance, and Microsoft. These are useful demand and distribution indicators, but they do not establish
              paid conversion, recognized revenue, average revenue per account, retention, or enterprise contract value.
              The strongest commercial diligence question is whether usage converts into durable paid cohorts rather
              than promotional or free activity.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Pricing, delivery economics, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public sources identify the monetization mechanisms but not list prices, realized prices, discounting, API
              consumption rates, or customer-level contract terms. That prevents a reliable calculation of gross profit
              per generated asset, contribution margin by plan, CAC payback, or sales efficiency. SCMP described a very
              lean commercial motion in which only two salespeople were focused on service and the company relied on
              organic growth and word of mouth; this supports a low reported sales-and-marketing burden at that point in
              time, but it is not a complete CAC measure and may not persist as enterprise selling scales. The technical
              and service-cost side is also unresolved: generating production-ready meshes in seconds and operating a
              large spatial-asset corpus imply compute, storage, inference, and support costs, but no public source
              supplies a cost-per-generation or gross-margin figure. The table therefore distinguishes observed
              mechanisms from missing underwriting inputs. An independent review adds pricing risk: Tencent's
              open-source Hunyuan3D could push the category toward commoditization before Vast proves retention in
              production workflows.
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI019
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI009
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Vast has unusually strong public financing signals for a private company. Independent coverage described
              nearly $200 million raised around June 2026 and a valuation above $1 billion; Multiples subsequently
              listed a September Series B of about $446 million and total financing of $644 million across three rounds,
              while Dealroom's article text said the company reported roughly $687.5 million raised in under six months.
              These figures are not fully reconciled: sources use different round labels, currencies, and aggregation
              boundaries, and the company-level financing announcement in Cyzone describes more than RMB1 billion for an
              A3 strategic round without publishing cash-on-hand or obligations. Capital raised is not cash available.
              No assigned source reports cash balance, monthly burn, runway, debt, project-finance commitments, or the
              next-round trigger. The financing pace reduces near-term funding risk only conditionally; it also raises
              the diligence need for cap-table terms, use of proceeds, investor concentration, and whether
              infrastructure investment will consume capital faster than monetization develops.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI004
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a thesis of strong demand signals and financing access, not a verified
              profitability or valuation case. Usage growth, international reach, named enterprise integrations, and a
              broad investor base are positive indicators for revenue potential. Conversely, the evidence does not
              establish ARR, recognized revenue, gross margin, net revenue retention, free cash flow, customer
              concentration, or the realized price paid by enterprise users. Open-source competition adds a credible
              risk to pricing power before paid-cohort durability is known. The reported valuation and financing totals
              are particularly difficult to underwrite because they are headline private-market figures rather than a
              disclosed common-equity value or a cash-flow multiple. A decision-ready model should be built from monthly
              paid accounts, API and subscription revenue by cohort, generation volume, inference and storage cost,
              enterprise ACV, renewal and expansion data, headcount, cash, burn, debt, and financing preferences. Until
              those inputs are supplied, Vast merits continued diligence rather than a conclusion based on revenue
              quality or margin path.
            claimRefs:
              - CI016
              - CI017
              - CI019
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI006
              - CI007
              - CI016
              - CI017
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand and capital access are visible
            body: >-
              Public activity metrics, global usage, named integrations, and large reported financing rounds provide
              credible reasons to investigate commercial scale.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI011
          - type: callout
            title: The earnings bridge is still missing
            body: >-
              ARR, recognized revenue, gross margin, cash, burn, runway, and paid-cohort conversion remain unavailable
              in the retained evidence, so headline valuation cannot be tested against operating performance.
            calloutType: risk
            claimRefs:
              - CI016
              - CI017
          - type: callout
            title: Request a finance and cohort pack
            body: >-
              Prioritize monthly revenue by stream, paid cohorts, enterprise ACV and renewal, direct compute costs, cash
              and burn, debt, and financing preferences before underwriting.
            calloutType: recommendation
            claimRefs:
              - CI017
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and user jobs
        blocks:
          - type: paragraph
            body: >-
              Vast delivers Tripo as a creator and developer workflow rather than only a model endpoint. Public
              descriptions cover text-to-3D, image-to-3D and multi-view generation, with exports into common 3D formats
              and a REST API for application integration. A review describes the product as spanning modeling,
              texturing, retopology, rigging and animation, while another source describes an integrated workspace,
              creator applications and developer APIs. This makes the immediate customer job clear: create a usable
              starting asset quickly, then move it into an existing game, visualization or content pipeline. The
              strongest use cases are rapid prototyping, props, hard-surface objects and budget-constrained teams; final
              hero assets and complex organic forms still require specialist intervention. Public user and generation
              totals are company-reported through coverage that does not expose denominators, cohort definitions or
              production conversion, so they are adoption signals rather than proof of durable commercial usage.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE008
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE006
              - CE009
              - CE011
              - CE013
      - number: '5.2'
        title: Technical architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The product architecture has three observable layers. First, Tripo exposes generation modes and model
              families, including H3.1 and P1.0, with the company describing P1.0 as a native 3D diffusion approach that
              models spatial structure holistically. Second, post-processing addresses topology, texturing, low-poly
              optimization and rigging. Third, plugins, standard exports and an asynchronous API connect outputs to
              Unity, Unreal, Godot, ComfyUI and other tools. This is a credible operating model for reducing workflow
              friction, but several maturity claims remain issuer-led: production-ready output, two-second generation,
              and platform scale are reported by publications relaying company claims. An independent review is more
              qualified: it reports strong results for simple props while finding hollow areas, organic shapes, UVs and
              rigging still need manual work. The architecture therefore appears commercially usable for bounded
              workflows, not yet a zero-touch replacement for 3D production.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE011
      - number: '5.3'
        title: Differentiation, dependencies and trust risks
        blocks:
          - type: paragraph
            body: >-
              Differentiation is concentrated in the combination of native 3D model development, workflow integrations
              and a growing creator/developer surface, rather than in a publicly audited benchmark. The independent
              review's comparison credits Tripo with speed, broad plugin coverage and value, while giving competitors an
              advantage on some complex geometry or editing workflows. The API guide shows practical dependencies on API
              authentication, asynchronous task polling, credit limits, rate limits and downloadable result URLs; these
              are implementation and service-continuity considerations for enterprise adoption. Public evidence does not
              establish uptime, security certifications, privacy controls, data-retention terms, model-evaluation
              methodology, or the legal status of generated asset rights across jurisdictions. Project Eden and
              world-model descriptions are roadmap material, not shipped capability. Buyers should validate
              asset-license terms, reproducibility, failure rates, queue behavior, incident history and support
              commitments before embedding Tripo in production.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Product diligence conclusion
        blocks:
          - type: paragraph
            body: >-
              Product evidence supports a useful wedge: fast 3D asset ideation and pipeline acceleration for creators,
              developers and smaller studios. The evidence is less conclusive on enterprise-grade reliability and on
              whether the platform can consistently produce final assets without cleanup. Vast has expanded from
              generation into APIs, plugins and post-processing, which can increase switching costs if integrations
              become embedded in customer workflows. The central technical risk is quality variance at the boundary
              between a compelling demo and a repeatable production asset: topology, hollow geometry, UV seams, organic
              forms, licensing and operational controls all remain diligence items. Treat current adoption, model
              performance and unreleased world-model initiatives as separate evidence categories rather than assuming
              one proves the others.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow breadth is the clearest product strength
            body: >-
              Tripo extends beyond generation into preparation, APIs and integrations, giving users more opportunity to
              keep the workflow inside one product surface.
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE006
          - type: callout
            title: Production-readiness remains conditional
            body: >-
              Independent testing supports rapid prototyping and bounded asset classes, but topology, UV, organic-shape
              and licensing controls still require validation before production dependence.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE012
          - type: callout
            title: Roadmap is not current capability
            body: >-
              Project Eden and world-model descriptions are treated as development direction rather than shipped product
              evidence.
            calloutType: assumption
            claimRefs:
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who uses and pays for Tripo
        blocks:
          - type: paragraph
            body: >-
              Vast’s customer surface spans individual creators, developers, studios and companies, and potentially
              industrial users. The company describes Tripo AI as serving creators and developers, while external
              coverage reports nearly 10 million individual users and approximately 90,000 studios and companies;
              another current account reports 20 million users but also describes the figure as coming from the company.
              These counts are not directly comparable because their populations and dates differ, so they should be
              treated as reported reach rather than a verified active-customer base. The commercial path is visible in
              the public pricing structure: a free, non-commercial tier is separated from paid plans beginning at $20
              per user per month, with higher limits and commercial features. This supports a plausible self-serve
              acquisition funnel, but no public source here discloses paid conversion, account-level revenue, contract
              value, or the share of users who become production customers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
      - number: '6.2'
        title: Adoption signals and durability
        blocks:
          - type: paragraph
            body: >-
              The clearest trajectory signal is the increase in reported platform scale across contemporaneous accounts:
              Tripo’s March release said more than 6.5 million creators and 90,000 developers had generated nearly 100
              million models, while May coverage cited nearly 10 million individual users and roughly 90,000 studios and
              companies. A later funding account reported tens of millions of users globally and integrations into
              NetEase, Tencent, ByteDance, and Microsoft, but it did not provide active-user, paid-account, or revenue
              denominators. The named production evidence is stronger than logo-only evidence where a use case is
              specified: the company’s GDC material describes game-engine workflows and a 250-person developer event,
              and current coverage identifies NetEase use in Where Winds Meet. Still, the public record does not
              establish repeat usage, renewal, churn, gross retention, net retention, or whether named relationships are
              pilots, production deployments, or ecosystem integrations.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
              - CU010
              - CU014
      - number: '6.3'
        title: Named proof, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named-company evidence indicates that Tripo is moving beyond an individual creator tool toward developer
              and studio workflows. Implicator reports NetEase use in the game Where Winds Meet and identifies the
              company’s stated developer and enterprise/API reach; Dealroom reports integrations into NetEase, Tencent,
              ByteDance, and Microsoft. These are useful validation signals, but they remain principally
              company-originated or secondary summaries rather than customer-authored outcome studies. The public
              evidence does not quantify production seats, spend, deployment locations, time-to-value, asset acceptance
              rates, expansion from a first team to a wider organization, or revenue concentration by customer. Pricing
              research also indicates that commercial use, private models, higher concurrency, batch generation, and
              API/integration access sit behind paid tiers, making those upgrade triggers plausible but not proof of
              conversion. Investors should therefore distinguish reach and integration from durable, revenue-producing
              adoption and request customer-level cohort evidence before underwriting expansion.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Evidence limits and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Public customer evidence is directionally positive but incomplete. The sources support segmentation,
              reported reach, named ecosystem relationships, and a visible usage-based subscription model; they do not
              support a precise active-customer count, paid conversion rate, cohort retention, expansion rate, average
              contract value, or concentration percentage. Conflicting scale figures should not be reconciled by
              averaging them: the 6.5 million creator figure, nearly 10 million individual-user figure, and 20 million
              user figure have different sources, dates, and denominators. The next diligence step is a customer-level
              export that ties account IDs to plan, geography, use case, production status, gross and net retention,
              expansion, churn reason, and revenue. A second step is reference verification with at least three named
              customers, including one that can attest to production use rather than experimentation.
            claimRefs:
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad reach with a visible monetization path
            body: >-
              Reported creator, developer, and studio scale is paired with a public free-to-paid structure, giving Vast
              a credible acquisition and monetization surface even though conversion is undisclosed.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
          - type: callout
            title: Adoption quality is not yet auditable
            body: >-
              Public materials do not establish active usage, paid conversion, renewal, expansion, or customer
              concentration, and reported user totals use inconsistent populations and dates.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU014
              - CU015
          - type: callout
            title: Request customer-level cohorts before underwriting expansion
            body: >-
              Require plan-level cohorts and references that separate experimentation, pilots, production deployments,
              and renewed revenue before treating reported reach as durable customer traction.
            calloutType: recommendation
            claimRefs:
              - CU014
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              Vast's highest-consequence risks are not disproven incidents; they are exposed dependencies that public
              evidence does not yet close. The company operates a generative-AI service whose output and training-data
              obligations can create legal exposure, while its rapid financing trajectory raises expectations that may
              outpace disclosed revenue. Commercial proof is described through user, studio, and enterprise-integration
              counts, but those measures do not establish paid conversion, retention, gross margin, or customer
              concentration. The operating thesis therefore depends on converting adoption into durable revenue while
              maintaining documented data governance, output review, and resilient service operations. Kill criteria
              should be tied to observable events rather than inferred from the absence of public incidents.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR009
              - CR010
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The most concrete external risk is the unsettled boundary between generative-AI training, copyrighted
              inputs, and infringing outputs. The retained legal analyses describe divergent U.S. district-court
              outcomes and emphasize that fair-use treatment is fact-specific, that unauthorized acquisition can
              undermine a defense, and that outputs can still create liability. China-focused guidance describes
              controls for training-data provenance, harmful-content filtering, personal-information consent,
              monitoring, complaints, and continuity. These are risk indicators and compliance expectations, not proof
              that Vast violated a rule. The diligence priority is a documented inventory of training sources, licenses
              and consents, complaint handling, model monitoring, and jurisdiction-by-jurisdiction obligations.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, financial, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Vast's operating model has several linked execution risks. The sources describe a fast sequence of funding
              rounds, a large claimed user and studio base, enterprise integrations, and a plan to build both foundation
              models and a distribution platform. Those signals can support scale, but they also create exposure to
              inference and storage costs, model-quality regressions, platform uptime, enterprise procurement, and the
              need to turn broad usage into paid recurring or usage-based revenue. The investor mix includes strategic
              and state-linked participants, which may provide capital and distribution but can also complicate
              governance, concentration, and future financing expectations. Public evidence does not establish runway,
              cash burn, customer concentration, or contractual protections.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The appropriate mitigation is evidence-led operating control rather than a blanket assumption that Vast is
              either safe or unsafe. Management should be asked for training-data lineage and rights records, model and
              output incident logs, privacy and consent procedures, service-continuity tests, unit economics by plan and
              workload, customer renewal and concentration data, and financing documents. Monitoring should distinguish
              a disclosed fact from an unresolved gap: a new complaint, takedown, outage, failed enterprise deployment,
              material model-quality regression, down-round, or inability to reconcile funding and cash availability
              would be more probative than a marketing metric alone. Until those records are produced, the residual risk
              remains material and the investment case should use conservative assumptions.
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Require source-rights and consent records, output-governance controls, customer retention and
              concentration data, unit economics, and financing documents before reducing the risk rating.
            calloutType: risk
            claimRefs:
              - CR006
              - CR008
              - CR009
              - CR010
              - CR012
          - type: callout
            title: What the public record does not prove
            body: >-
              No retained source establishes Vast's actual incident history, ARR, revenue, cash burn, gross margin,
              runway, or customer concentration; these remain diligence gaps rather than inferred zeros.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR009
              - CR010
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Vast has a credible category and financing signal: independent coverage describes Tripo AI as a text- and
              image-to-3D platform, while public reporting attributes nearly $200 million of 2026 financing to the
              company and says it crossed the billion-dollar valuation threshold. Reported distribution is also notable:
              AI Weekly describes 10 million individual users and 90,000 studios, and names Sony and NetEase as
              customers, although those figures are company-reported or reported without audited denominators. The
              anti-thesis is that this evidence establishes attention and capital access, not economic value. No
              retained source verifies ARR, recognized revenue, gross margin, retention, customer concentration,
              preference terms, or a precise post-money valuation. A second set of 2026 data pages reports a much larger
              Series B and substantially higher cumulative funding, but those figures conflict with the nearly $200
              million account and require cap-table and announcement-level verification before underwriting.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
      - number: '8.2'
        title: Price discipline and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              The available public comparable evidence supports a framework, not a defensible mark for Vast. Multiples'
              October 2026 public software sample reports a 3.5x EV/revenue median for artificial-intelligence software
              and a 2.1x median across the listed horizontal SaaS categories; the source says its public-market data is
              powered by FactSet consensus estimates and Morningstar historical data. Acquiry's private-market
              discussion places high-growth AI-native SaaS at 10x–20x ARR, but explicitly says private transactions are
              not directly comparable to public companies and stresses NRR, CAC payback, gross margin, and
              profitability. Vast's retained evidence does not provide those inputs, and the company's model combines
              subscription and usage-based revenue according to a market-data profile. Applying either benchmark to an
              unverified revenue base would create false precision, so the missing metric pack is itself the central
              valuation finding. TechCrunch's report of a $20 billion financing valuation for Chinese AI company
              Moonshot is a useful signal of private-market appetite, not a direct comp: Moonshot builds language
              models, and this chapter has no evidence that its revenue quality, economics, or financing rights match
              Vast's.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              A bull case requires converting reported user and studio reach into paid usage, repeat production
              workflows, durable gross margins, and a clean financing record. A base case assumes the product remains
              strategically relevant but public evidence cannot yet demonstrate monetization or common-equity value;
              that supports tracking rather than a buy call. A bear case combines financing-data inconsistency, AI-3D
              competition from Tencent and other model providers, customer or geopolitical concentration, and a
              valuation reset if growth does not become measurable revenue. Exit readiness is therefore conditional: a
              future financing, secondary, acquisition, or public-market process should disclose audited or
              investor-grade revenue, retention, unit economics, cap-table preferences, dilution, and customer
              concentration. The immediate thesis-break triggers are a failure to reconcile the rounds, materially
              weaker paid conversion than reported reach implies, or evidence that inference costs prevent attractive
              gross margins. A low-reputation but directionally adverse category survey adds a caution rather than a
              benchmark: it characterizes generative AI and generic AI platforms as crowded or overvalued and
              consumer-focused startups as riskier. That warning does not prove Vast is overvalued, but it reinforces
              the need to price verified economics rather than category enthusiasm.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV010
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Public evidence supports tracking Vast as a potentially important AI-3D platform, not buying at an assumed
              valuation. The decisive next step is an investor-grade metric and cap-table package.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
          - type: callout
            title: Thesis-break triggers
            body: >-
              Treat unreconciled financing disclosures, weak paid conversion, inference-driven margin compression, or
              material customer and geopolitical concentration as reasons to reduce the valuation stance or stop
              diligence.
            calloutType: risk
            claimRefs:
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
