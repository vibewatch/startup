              - CO013
      - number: '1.3'
        title: Financing, milestones, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The financing record shows a rapid sequence of disclosed rounds and a valuation threshold, but it is not
              yet a clean audited capitalisation history. Bloomberg and other coverage report nearly $200 million raised
              in the financing that took Vast above a $1 billion valuation; Forbes reports a March 2026 $50 million
              Series A and says two people familiar with the later deal placed the valuation at about $1.5 billion,
              while the company declined to comment on an exact figure. A Dealroom News item later reports a $412.5
              million Series B and approximately $687.5 million raised in under six months, whereas a private-company
              database reports $644 million across three rounds and includes clearly unrelated VAST Data entries. These
              discrepancies require round documents and entity-level reconciliation before using total raised or
              valuation as precise cover metrics. Product milestones include Project Eden, platform upgrades, and a
              stated ambition to make 3D creation broadly accessible; no assigned source establishes recognized revenue,
              profitability, debt, liquidation preferences, or board control.
