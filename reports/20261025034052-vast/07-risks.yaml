  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule / legal issue, Jurisdiction, Status in retained evidence, Likelihood, Severity, Mitigation and diligence path]
    rows:
      - [Training-data copyright and output substitution, "United States / cross-border", "Courts are divergent and fact-specific; output liability remains possible", "Medium", "High", "Inventory sources, licenses, provenance, output review, takedown and indemnity terms"]
      - [Unauthorized or harmful training data, "China / cross-border", "China-focused guidance calls for source assessment, filtering, rights management, and audits", "Medium", "High", "Obtain dataset lineage, authorization records, filtering metrics, and audit ownership"]
      - [Personal-information and sensitive-data consent, "China / applicable user jurisdictions", "Guidance calls for consent or lawful basis and explicit consent for sensitive information", "Medium", "High", "Review data maps, consent flows, opt-out records, retention, and processor agreements"]
      - ["Model monitoring, complaints, and continuity", "China / service markets", "Guidance describes monitoring, complaint channels, updates, backups, and recovery", "Medium", "Medium-High", "Request control testing, incident logs, recovery objectives, and complaint closure data"]
    enumerationScope:
      coverage: partial
      basis: "Public legal and regulatory guidance retained for generative-AI training, outputs, privacy, monitoring, and continuity; not a complete jurisdictional inventory."
    notes: "Rows are a partial public-evidence register, not a complete legal inventory; status describes the retained guidance rather than a finding that Vast is compliant or non-compliant."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Operational, quality, security, and dependency register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Inference and infrastructure cost escalation, "Medium", "High", "Not evidenced", "High", "No public unit-cost, gross-margin, or workload economics by product tier"]
      - [Model-quality regression or post-processing burden, "Medium", "Medium-High", "Product claims only", "Medium-High", "No independent acceptance-rate, rework, or quality benchmark disclosed"]
      - [Enterprise procurement and retention friction, "Medium", "High", "Named integrations reported", "High", "No contract, renewal, ACV, cohort, or concentration evidence"]
      - [Service outage or data/model recovery failure, "Low-to-medium", "High", "Continuity guidance exists; Vast controls absent", "Medium-High", "No public uptime, incident, backup, or recovery test record"]
      - [Financing and strategic-channel concentration, "Medium", "Medium-High", "Multiple backers reported", "Medium-High", "No cap-table, preference, runway, or dependence disclosure"]
      - [Competitive substitution by larger platforms, "Medium", "Medium-High", "Distribution and model roadmap described", "Medium-High", "No defensible evidence on switching costs, share, or sustained price power"]
    notes: "Rows separate operating failure modes from legal rules. Reported funding is not cash available, and reported users or integrations are not proof of paid retention or revenue."
    claimRefs: [CR001, CR002, CR003, CR009, CR010, CR011]
