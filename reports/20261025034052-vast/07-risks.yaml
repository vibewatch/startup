chapter:
  number: 7
  title: Risks
  summary: Vast has credible adoption and financing signals, but the public record leaves material uncertainty around regulatory compliance, copyright provenance, commercialization, financing expectations, and execution at scale. The most actionable posture is to monitor measurable controls and require diligence on data rights, revenue conversion, capital structure, and service continuity before treating the growth narrative as de-risked.
sections:
  - id: risk-ranking
    title: Ranked risk profile
    body: Vast's highest-consequence risks are not disproven incidents; they are exposed dependencies that public evidence does not yet close. The company operates a generative-AI service whose output and training-data obligations can create legal exposure, while its rapid financing trajectory raises expectations that may outpace disclosed revenue. Commercial proof is described through user, studio, and enterprise-integration counts, but those measures do not establish paid conversion, retention, gross margin, or customer concentration. The operating thesis therefore depends on converting adoption into durable revenue while maintaining documented data governance, output review, and resilient service operations. Kill criteria should be tied to observable events rather than inferred from the absence of public incidents.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: The most concrete external risk is the unsettled boundary between generative-AI training, copyrighted inputs, and infringing outputs. The retained legal analyses describe divergent U.S. district-court outcomes and emphasize that fair-use treatment is fact-specific, that unauthorized acquisition can undermine a defense, and that outputs can still create liability. China-focused guidance describes controls for training-data provenance, harmful-content filtering, personal-information consent, monitoring, complaints, and continuity. These are risk indicators and compliance expectations, not proof that Vast violated a rule. The diligence priority is a documented inventory of training sources, licenses and consents, complaint handling, model monitoring, and jurisdiction-by-jurisdiction obligations.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operating-dependencies
    title: Operational, financial, and partner dependencies
    body: Vast's operating model has several linked execution risks. The sources describe a fast sequence of funding rounds, a large claimed user and studio base, enterprise integrations, and a plan to build both foundation models and a distribution platform. Those signals can support scale, but they also create exposure to inference and storage costs, model-quality regressions, platform uptime, enterprise procurement, and the need to turn broad usage into paid recurring or usage-based revenue. The investor mix includes strategic and state-linked participants, which may provide capital and distribution but can also complicate governance, concentration, and future financing expectations. Public evidence does not establish runway, cash burn, customer concentration, or contractual protections.
    claimRefs: [CR001, CR002, CR003, CR009, CR010, CR011]
    tableRefs: [TR003]
  - id: monitoring-and-diligence
    title: Mitigations, monitoring, and thesis-break triggers
    body: >-
      The appropriate mitigation is evidence-led operating control rather than a blanket assumption that Vast is either safe or unsafe. Management should be asked for training-data lineage and rights records, model and output incident logs, privacy and consent procedures, service-continuity tests, unit economics by plan and workload, customer renewal and concentration data, and financing documents. Monitoring should distinguish a disclosed fact from an unresolved gap: a new complaint, takedown, outage, failed enterprise deployment, material model-quality regression, down-round, or inability to reconcile funding and cash availability would be more probative than a marketing metric alone. Until those records are produced, the residual risk remains material and the investment case should use conservative assumptions.
    claimRefs: [CR006, CR008, CR009, CR010, CR011, CR012]
    figureRefs: []
