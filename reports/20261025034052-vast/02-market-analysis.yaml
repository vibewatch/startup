  - id: TM002
    title: Sizing lenses and limitations
    columns: [Publisher, Year, Geography, Value, CAGR, Methodology, Confidence, Limitation]
    rows:
      - ["Axis Intelligence Research citing MIIT", 2025, China, "¥1.2T+ core AI industry", null, "Broad stack including chips, infrastructure, software and services", medium, "Not a generative-3D or software-only market"]
      - ["Axis Intelligence Research citing Fortune Business Insights", 2025, China, "$28.18B AI software and applications", "32.5% toward $202B in 2032", "Private research estimate for software/applications", medium, "Perimeter differs from core AI industry"]
      - ["Axis Intelligence Research citing Stanford HAI", 2025, China, "$12.4B private AI investment", null, "VC and PE capital flows", medium, "Investment is not market revenue"]
      - ["CNNIC via Axis Intelligence Research", 2025, China, "602M generative-AI users", null, "Six-month active-use population measure", medium, "Users are not paid 3D buyers"]
      - ["Dealroom News", 2026, Global, "Tens of millions of Tripo Studio users", null, "Company-reported product traction", low, "No denominator, period, or paid share disclosed"]
      - ["The Planet Tools", 2026, Global, "About 10M individuals and 90,000 studios/companies", null, "Reported company/user figures", low, "Conflicts with other public user counts"]
    notes: >-
      Values use the source's own units and perimeters. They are separate
      lenses, not additive TAM/SAM/SOM layers; no source isolates Vast's SAM or
      SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM015]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer, Workflow, Budget owner, Adoption trigger]
    rows:
      - ["Individual creators", "Creator", "Creator", "Creator", "Prompt/image to draft asset", "Creator software budget", "Lower cost and faster iteration"]
      - ["Small studios", "Studio lead", "Artists and designers", "Studio", "Batch asset prototyping", "Production tools budget", "Throughput and staffing leverage"]
      - ["Game publishers", "Production or technical art lead", "Artists and developers", "Studio/business unit", "API/plugin production pipeline", "Content production budget", "Accepted assets at scale"]
      - ["Film and digital content", "VFX or content operations", "Artists and producers", "Production company", "Concept and scene asset workflow", "Project production budget", "Shorter production cycles"]
      - ["Ecommerce and design", "Design or merchandising lead", "Designers and sellers", "Business unit", "Product visualization and variants", "Design/commerce budget", "More variants with same team"]
      - ["XR and interactive platforms", "Platform or product lead", "Developers and creators", "Platform", "User-generated 3D content", "Platform growth budget", "Content supply and engagement"]
    notes: >-
      Buyer roles are an analytical segmentation, not disclosed customer
      contract evidence. Public sources identify product and workflow use but
      do not disclose budget ownership or adoption conversion.
    claimRefs: [CM010, CM011, CM012, CM013]
