schemaVersion: "report-v2"
artifact: market-analysis
slug: vast
runDate: 2026-10-25
company:
  name: Vast
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Vast operates in generative 3D asset creation, a narrower market than the
    broad AI industry figures often used in fundraising narratives. Public
    evidence supports strong China-wide AI adoption and a growing 3D workflow
    opportunity, but does not isolate Vast's serviceable market, paid conversion,
    or durable enterprise spend.
sections:
  - id: market-boundary
    title: Market boundary and workflow
    body: >-
      The relevant market is software and usage spend for generating, editing,
      and integrating production-ready 3D assets from text or images. It
      includes creator subscriptions, enterprise/API usage, plugins, and
      workflow integrations serving games, digital content, ecommerce, XR, and
      design. It excludes GPU hardware, model-training infrastructure, general
      purpose AI applications, and downstream game or media revenue. This
      boundary matters because broad China AI figures combine chips,
      infrastructure, models, and services, while private-market estimates may
      cover only software and applications. Status-quo substitutes remain
      internal 3D artists, outsourced studios, procedural tools, and generic
      image/video models that do not deliver editable geometry. The economic
      wedge is reduced modeling and cleanup time, but production acceptance
      still depends on topology, UVs, materials, and editability rather than
      visual plausibility alone.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and adoption signals
    body: >-
      No retained source isolates a defensible Vast-specific SAM or SOM. A
      bounded sizing approach therefore separates three lenses: the broad
      China AI stack, the narrower software/application market, and the
      company-relevant generative-3D workflow. Axis Intelligence reports that
      China’s core AI industry exceeded 1.2 trillion yuan in 2025, while it
      separately cites a $28.18 billion 2025 China AI software and applications
      estimate and $12.4 billion of private AI investment. These values are not
      interchangeable market revenues. The same source reports 602 million
      generative-AI users in December 2025, but that is a usage population, not
      a paid 3D buyer count. Vast-related reporting describes roughly 10 million
      individual users and 90,000 studios or companies, while other reporting
      says Tripo Studio serves tens of millions globally; the discrepancy makes
      an addressable paid-user calculation premature. The market case is
      therefore directionally attractive but valuation-sensitive to conversion,
      retention, enterprise ACV, and the share of workloads that require
      production-grade 3D output.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-drivers-constraints
    title: Buyers, drivers, and constraints
    body: >-
      The buyer map has at least three routes. Individual creators and small
      studios are likely self-serve subscription users; larger game, media,
      design, and technology organizations are API or integration buyers; and
      strategic investors or platform partners can provide distribution while
      also shaping requirements. Dealroom reports Tripo integration into
      NetEase, Tencent, ByteDance, and Microsoft workflows, and other reporting
      names NetEase and Sony as clients, but the public record does not disclose
      contract values, budget owners, renewal rates, or deployment volumes.
      Adoption drivers are labor-cost compression, faster prototyping, and
      expanding demand for interactive content. Constraints include quality
      assurance, workflow switching and integration costs, compute intensity,
      content and safety compliance, open-source competition, platform bundling,
      and cross-border technology restrictions. Chinese guidance issued by the
      Cyberspace Administration of China, NDRC, and MIIT emphasizes safety,
      security, standardization, and application-driven development for AI
      agents; while not a 3D-specific rule, it is a relevant policy signal that
      regulated deployment and controllability can affect enterprise adoption
      timing.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: Sizing and adoption gaps
    body: >-
      The central diligence gap is not whether AI adoption is growing, but how
      much of that growth becomes recurring spend on Vast’s production-grade
      3D workflow. Public sources do not provide a consistent paid-user
      denominator, cohort conversion, enterprise ACV, usage-based gross margin,
      or customer concentration. They also do not reconcile whether reported
      user counts are registered, active, or paying, nor whether “studios and
      companies” are customers, prospects, or platform accounts. Broad
      industry figures should not be used to back-solve Vast revenue. A buyer
      diligence request should obtain plan-level active users, free-to-paid
      conversion, retention, API volume, named-customer production use,
      compute cost per generated asset, and the percentage of output accepted
      without substantial human rework. Until those measures are available,
      market momentum supports a positive adoption thesis but not a precise
      revenue multiple or SOM claim.
    claimRefs: [CM015, CM016]
    tableRefs: []
