    title: Market sizing lens
    type: pyramid
    summary: >-
      Broad China AI measures narrow from the full industry stack to software,
      investment, and the unresolved generative-3D serviceable market.
    data:
      nodes:
        - {id: broad-ai, label: "China core AI industry", value: "¥1.2T+ (2025)", tone: neutral}
        - {id: ai-software, label: "AI software and applications", value: "$28.18B (2025)", tone: opportunity}
        - {id: private-capital, label: "Private AI investment", value: "$12.4B (2025)", tone: low}
        - {id: gen3d, label: "Generative 3D SAM/SOM", value: "Not isolated publicly", tone: warning}
        - {id: paid-3d, label: "Paid 3D buyer pool", value: "Not disclosed", tone: neutral}
        - {id: production-share, label: "Production-grade share", value: "Not disclosed", tone: risk}
    approximationNotes: >-
      This is an ordered presentation of incompatible sizing lenses, not a
      proportional or additive funnel; values retain source perimeters.
    claimRefs: [CM005, CM006, CM007, CM015]
callouts:
  - calloutType: insight
    title: Broad AI adoption is an input, not Vast TAM
    body: >-
      China’s AI adoption and capital signals support category timing, but the
      retained evidence does not convert them into a paid, generative-3D
      serviceable market.
    claimRefs: [CM005, CM006, CM008, CM015]
  - calloutType: risk
    title: User-count quality is valuation-critical
    body: >-
      Public user counts vary materially and lack a consistent active, paid, or
      enterprise denominator, leaving conversion and recurring revenue untested.
    claimRefs: [CM009, CM015, CM016]
