  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              指定证据中后果最高的风险不是有记录的 eSentire 违规事件，而是广泛响应主张与客户可验证、可通过合同获得并可导出的内容之间存在缺口。eSentire 将 Atlas
