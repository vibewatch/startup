      - number: '4.2'
        title: 定价架构与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开定价证据只是参考，不是公司价目表。Vendr 报告称，100-500 个端点的买方范围约为每端点每年 $40-$80，并表示多年承诺和更大部署可能将价格推向低端。另一份 2026
              年成本参考估计，中型市场合同为 500-2,000 个端点每年 $80,000-$250,000，更大部署为 $300,000-$500,000；该来源明确将数字标为参考值，并指出 eSentire
              不发布目录价格。两项来源使用不同样本和范围定义，不应混合成单一 ARPU 或 ARR 估计。Built In
              的客户经理招聘信息提供了定性的销售效率代理指标：该岗位负责企业账户的续约、留存、增购、交叉销售、预测和合同谈判。在指定证据中，没有找到公开的 CAC、回本周期、赢单率、实际折扣、流失率、GRR 或 NRR
              序列。这些缺失指标使可靠计算贡献利润率或客户终身价值成为不可能。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
