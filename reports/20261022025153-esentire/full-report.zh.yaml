      - number: '5.3'
        title: 差异化、信任与技术风险
        blocks:
          - type: paragraph
            body: >-
              eSentire 的防守性产品主张在于供应商无关的多信号覆盖、主动响应，以及从威胁狩猎反馈到检测的闭环。数据表将五项机器学习专利归因于威胁检测和数据传输；网站称其每天新增 200 项威胁防护，并根据全球 SOC
              调查每天增加 200 个 IOC/IP。这些数字由公司报告，没有公开分母、测试协议或独立复现。公司还将 Atlas AI
              描述为受控自治并有人类复核，这是治理设计选择，而不是模型质量证明。外部页面补充了有用的实施限制。一份独立 MDR 评测在基础价格描述中涵盖六类攻击面中的五类，称 APAC
              覆盖部分依赖区域分析师和合作伙伴，并指出公开的 15 分钟平均遏制时间不等于合同 SLA。独立成本参考描述了 Atlas
              锁定以及终止后失去历史调查数据访问权。这些主张需要合同和架构验证，但提出了具体尽调问题：可移植性、服务抵扣、区域覆盖、行动权限、数据导出、保留期限，以及 AI 和遏制指标背后的证据。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: 产品结论与尽调重点
        blocks:
          - type: paragraph
            body: >-
              该产品作为一种托管安全运营模式是可信的，具备广泛集成意图和明确的人类责任。其最强证据是多个公司页面对 Atlas、多信号、全天候 SOC
              和主动响应的一致描述，加上客户引述的摄取、响应速度和作为内部团队延伸的使用方式。主要投资判断风险不是 eSentire
              有没有产品描述，而是公开主张能否在不同客户和环境中转化为可衡量、可移植且合同上可执行的结果。在把产品视为持久差异化因素前，尽调应取得按层级划分的集成和响应矩阵、独立的可用性和遏制分布、AI
              运营者错误与升级指标、安全认证和当前保障报告、数据保留与导出条款、区域 SOC 覆盖及已点名的生产客户。公开开发者活动支持工程信号，但不能填补这些缺口。按当前证据，Atlas
              是一个合理的运营优势，但尚未成为完全证明的技术护城河。
            claimRefs:
              - CE002
              - CE008
              - CE012
              - CE013
              - CE014
