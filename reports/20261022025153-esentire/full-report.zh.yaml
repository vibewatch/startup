  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品与客户工作流
        blocks:
          - type: paragraph
            body: >-
              eSentire 销售的是托管安全服务，而非独立端点产品。其公开材料将 Atlas 描述为 AI 和 XDR 平台，收集端点、网络、日志、云、身份、漏洞、浏览器和 SaaS
              表面的信号，再由分析师和威胁猎手调查并遏制事件。因此，客户工作流是一条运营闭环：连接现有工具、摄取遥测、检测和调查、执行获准的响应动作，并报告风险降低情况。数据表称，该服务包括全天候监控、实时 SOC
              分析师支持、威胁狩猎、威胁打击、遏制、指定的 Cyber Risk Advisor 和 Insight Portal。这些是公司主张，不是经独立审计的服务水平结果。公开的上线主张是平均 14
              天；比较页面称服务可使用客户既有投资，借助 BYOL/BYOS
              避免从头替换的摩擦，但也让尽调重点转向集成深度、权限、数据保留以及各合同层级允许的确切响应动作。公开材料没有披露完整的客户实施手册、上线平均值的分母，或使用各类信号的客户比例。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
