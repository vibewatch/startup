        - AI 效果、响应责任、竞争性捆绑、执行
        - 在私人证据确认前为低
      - - 基准
        - MDR 需求持续；增长温和；合同金额按正常服务组合转化为经常性收入
        - 无法支持数字区间；需要核实价格、标准化可比公司集合、流动性折扣和下行保护
        - 未知的 NRR、利润率、集中度、债务和退出时点
        - 基准投资判断，不是目标价
      - - 悲观
        - 增长放缓；折扣和续约压力上升；服务或 IR 强度稀释利润率；估值压缩
        - 除非入场价格在优先权和债务之后仍留出经核实的下行安全边际，否则不投资
        - 下轮融资、客户流失、平台锁定、响应范围争议
        - 重大且当前未解决
