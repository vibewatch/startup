      - number: '7.2'
        title: 法律、监管与安全保障暴露
        blocks:
          - type: paragraph
            body: >-
              指定证据池无法确定当前 eSentire 是否有执法行动、诉讼、违规、认证状态、FedRAMP 授权或加拿大公共部门评估。这是证据缺口，不是不存在的证据。现有安全材料确实表明 eSentire
              的产品处理身份、云、端点、网络、日志和漏洞数据，其响应模式可能暂停用户、重置密码、隔离主机或中断网络流量。这些动作会产生授权、隐私、可审计性和客户变更控制依赖，应在每次部署中测试。CISA 当前的 KEV
              指引可作为有用的外部控制基线：其称组织应优先处理有可靠主动利用证据且有明确补救动作的漏洞，并建议对无法更新的产品及时实施供应商补救或移除。eSentire
              自身材料称其从调查中增加检测并关联信号，但指定证据无法验证客户特定的补丁关闭表现或监管机构批准的控制环境。买方应要求当前鉴证、子处理方和保留条款、事件通知条款，以及特权响应动作已记录且可逆的证据。
            claimRefs:
              - CR007
              - CR008
              - CR011
