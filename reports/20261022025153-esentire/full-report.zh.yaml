      - number: '4.3'
        title: 成本结构、利润率路径与资本充足性
        blocks:
          - type: paragraph
            body: >-
              该服务在运营上劳动密集：公开描述强调全天候 SOC 覆盖、威胁猎手、分析师、客户成功、集成和事件响应。独立成本参考称，典型合同每年包括 100-200
              小时的事件响应时数池，并列出单独定价的专业服务、渗透测试、漏洞管理、数字取证、vCISO 咨询和暴露管理。该来源还将 Atlas 描述为分析师平台，并指出客户通常自带 EDR
              许可。这些是有用的成本驱动和打包信号，不是 eSentire
              毛利率或服务交付成本的证据。同一来源指出平台锁定以及终止后失去历史调查访问权限，这对买方是商业上的不利因素，也影响留存假设的尽调。指定来源没有披露现金余额、债务、烧钱速度、现金跑道、经审计收入、EBITDA、毛利率或融资契约。因此，资本充足性和下一轮融资触发条件仍是重大的投资判断缺口，不能从定价范围估算。
