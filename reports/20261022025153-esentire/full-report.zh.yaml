  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比点名的 MDR 同行更广。买方可以从 eSentire、CrowdStrike 或 ReliaQuest 采购专门的 MDR 服务；使用 Microsoft Defender
              这样的平台打包方案；保留自有 SIEM 并运营共同管理服务；或自行建设和配备内部 SOC。eSentire 的比较材料将服务定位在多信号可见性、威胁遏制和响应上，而 Microsoft
              的产品说明展示了打包套件如何组合端点、身份、邮件和 SaaS 保护。这些是不同的采购路径：专业服务商销售运营所有权，而平台套件则能降低现有 Microsoft 体系的增量采购摩擦。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
      - number: '3.2'
        title: 能力、分发与信任差异化
        blocks:
          - type: paragraph
            body: >-
              eSentire 的防守性切入点在于原生服务运营、广泛集成和人在回路中的响应相结合。其 CrowdStrike 比较材料称，eSentire 支持 300
              多个集成，可摄取端点、网络、日志、云、身份和漏洞数据；奖项申报材料称 Atlas 将智能体运营者与工程化的人类判断控制结合起来。SentinelOne 的 2022 年合作公告独立确认了从端点到云的协作模式，以及
              eSentire 结合 SentinelOne XDR 提供全天候多信号 MDR 的做法。寻求共同管理和响应的买方会认可这一定位，但最有力的性能数字仍由公司或合作伙伴发布，而非独立基准。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: 定价、打包与切换经济性
        blocks:
          - type: paragraph
            body: >-
              公开定价并不完整。独立 SOC 成本来源报告称，500-2,000 个端点的年度参考范围为 $80,000-$250,000，2,000-5,000 个端点为 $300,000-$500,000，同时明确表示
              eSentire 不发布公开价目表。其描述的范围结合了端点、用户、日志和云工作负载，且来源称端点许可通常另计。因此，应按整体运营范围比较
              eSentire，而不是按简单席位价格比较。同一来源指出一项转换成本：合同结束时客户会失去 Atlas
              和历史调查访问权限，除非协商导出窗口。因此，买方应比较总合同成本、事件响应超额费用、数据可移植性以及替代内部团队的成本，而不是依赖标题报价。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP016
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              其护城河建立在运营和数据网络上，而不是简单的软件功能清单。eSentire
              称，调查和威胁情报会持续反馈，构成闭环；客户推荐则描述服务商成为安全团队的延伸。这些优势会凭借工作流熟悉度、积累的案件历史和响应权限推高切换成本，但并非不可逆。PeerSpot 的 2026 年 9 月比较将
              ReliaQuest 排在 eSentire 之上，并称两款产品各只有两条评论，因此该信号是方向性的，不是市场份额衡量。Microsoft Defender 的打包许可和 CrowdStrike
              以端点为中心的生态仍是可信的替代路径。关键尽调测试是：对目标分段而言，eSentire 的留存、响应结果和数据可移植性是否足以抵消这些替代方案。
            claimRefs:
              - CP013
              - CP014
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP008
              - CP013
              - CP016
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 最强竞争切入点
            body: 当买方重视明确的运营服务、广泛的遥测覆盖和响应所有权，同时不希望替换现有的每一种安全工具时，eSentire 的定位最有利。
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
              - CP008
          - type: callout
            title: 主要替代风险
            body: 平台套件和现有生态可以凭借采购简便性取胜；而 Atlas 访问权和历史数据可移植性则可能让替换谈判变得重要。
            calloutType: risk
            claimRefs:
              - CP003
              - CP011
              - CP016
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              eSentire 的公开材料描述了一种托管服务，将全天候监控、威胁狩猎、调查和响应覆盖到端点、网络、云、身份、SaaS 和应用环境。因此，其商业模式更接近经常性托管服务合同，而不是自助式软件订阅。独立的 2026
              年定价参考称，公司不发布公开价目表，而是按端点、用户、日志源和云工作负载报价；这是现有最有力的变现维度描述，但不是经审计的收入披露。Vendr
              的买方数据分析同样描述了年度承诺、最低资产或支出门槛、服务层级和可选模块。公司称其 MDR 支持自带许可或订阅部署，因此不能假定每份合同都包含端点许可收入。eSentire
              的客户管理招聘材料明确将续约、留存、增购、交叉销售和扩张收入交给商业团队，直接表明续约与扩张是核心经济杠杆。
