      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              证据支持一种经常性、基于合同的 MDR
              模式，并有多条扩张路径：扩大遥测范围、提高服务层级、增加模块、专业服务和续约。但证据不足以支持精确的收入运行率、利润率、现金消耗或估值计算。关键财务问题是：劳动和响应义务能否高效扩展，使经常性合同价值带来持久的毛利率扩张。投资决策前，管理层应提供从订单到确认收入的队列桥接、续约与扩张队列、每项受保护资产的实际价格、每份合同的分析师和基础设施成本、事件响应超额服务经济性，以及当前现金/债务/现金跑道资料包。
