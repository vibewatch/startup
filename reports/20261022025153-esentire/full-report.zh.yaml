  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场是托管检测与响应服务收入，而不是全部网络安全支出。Business Research Company 将 MDR
              定义为帮助企业识别危险并在发现后响应的合同服务；其收入边界包括威胁情报、威胁狩猎、安全监控、事件分析和事件响应。本章排除独立端点许可、SIEM
              软件、漏洞扫描器、一次性咨询和内部安全人员成本，除非它们被打包进托管检测与响应项目。它们在经济上仍是重要替代方案：买方可以保留内部 SOC、主要使用 MSSP
              转发告警，或分别采购技术和事件响应保留服务。eSentire 的自身定位比狭义端点监控更宽：它描述端点、网络、日志、云、身份及其他遥测的多信号覆盖；渠道合作伙伴也将持续威胁暴露管理以及数字取证与事件响应和 MDR
              并列。这些相邻服务可以扩大钱包份额，但把其完整类别计入核心 MDR 会夸大相关市场。公司发布的能力页面能确定预期范围，但不能独立证明产品效果或市场份额。
            claimRefs:
              - CM007
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM007
              - CM016
      - number: '2.2'
        title: 市场规模视角与买方分层
        blocks:
          - type: paragraph
            body: >-
              两家独立发布机构对起点较小但增长迅速的全球类别形成了共识，但对预测路径存在分歧。Precedence Research 估计 2025 年为 $3.40 billion、2026 年为 $3.92
              billion，并预计 2026-2035 年按 15.12% CAGR 增长至 2035 年的 $13.90 billion。Business Research Company 估计 2025 年为 $3.46
              billion、2026 年为 $4.16 billion，并预计 2026-2030 年按 19.8% CAGR 增长至 2030 年的 $8.57 billion。因此，发布机构给出的范围是 2025 年
              $3.40-$3.46 billion、2026 年 $3.92-$4.16 billion。这些是采用不同分类法和时间跨度的全球类别估计，不是可相加的数值，也不是 eSentire 的
              TAM/SAM/SOM。Precedence 报告北美占 2025 年市场价值的 46%，中小企业是最大企业规模分段，大型企业是 2026-2035 年增长最快的规模分段，BFSI
              是领先垂直行业。这支持双重买方路径：资源受限的中型市场组织外包 SOC 能力，大型受监管企业则将 MDR 用作共同管理层。公开证据没有披露 eSentire
              的赢单率、可服务账户、预算归属或按分段划分的平均合同价值，因此不能声称公司特定的 SAM 或 SOM。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
      - number: '2.3'
        title: 采用驱动因素、阻力与估值影响
        blocks:
          - type: paragraph
            body: >-
              云迁移、攻击日益复杂、合规负担和网络安全人才短缺共同支撑需求。Precedence Research 特别将技能短缺列为采用驱动因素，这与 MDR 中隐含的外包还是自建决策一致。买方证据提供了有用的时间视角：G2
              显示 eSentire 平均实施周期为两个月、平均投资回报周期为十二个月，说明采用可以嵌入年度预算周期，但这些是平台汇总值，不是经审计的队列统计。约束不只是价格。G2
              的评论摘要和单条评论指出误报、噪声告警、定期调优以及偶尔缺失告警细节。这些摩擦会增加客户工作量，削弱其替代稀缺内部人力的承诺。估值上，类别增长支持有利的需求背景，但不应直接转化为 eSentire
              的收入增长。投资判断应要求按分段拆分的订单、留存、毛利率、部署时间和支持负担。公司自述的差异化主张和合作伙伴列表有助于判断定位，但不是独立的市场份额证据。首要尽调门槛是从合格账户、合同价值、渠道贡献以及实际赢单率和留存率出发，搭建自下而上的
              SAM/SOM 桥接。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 发布机构趋同有用但有限
            body: 两项独立估计在 2025 年仅相差 $0.06 billion，但预测窗口和类别分类法不同；该范围更像方向性的类别锚点，而不是精确的估值输入。
            calloutType: insight
