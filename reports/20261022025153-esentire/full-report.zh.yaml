      - number: '5.2'
        title: 架构、模块与成熟度
        blocks:
          - type: paragraph
            body: >-
              最有依据的架构是分层服务模式。在输入层，Atlas 根据 eSentire 的比较和产品页面连接 300 多项技术集成，并可摄取端点、网络、日志、云、身份、漏洞、浏览器和 SaaS
              信号。在分析层，公司描述了情报图谱、机器学习和行为检测、MITRE ATT&CK
              映射，以及根据威胁研究构建的检测。在行动层，公开示例包括主机隔离、哈希阻断、账户暂停、邮件清除、系统重启以及其他遏制或补救动作。人员层包括 SOC 分析师、精英威胁猎手、Threat Response Unit
              和 Cyber Risk Advisors。一个 GitHub 组织提供了开发者信号代理指标，但其可见仓库的年龄和活跃度不一：页面显示 33 个仓库，其中既有 2026
              年更新的仓库，也有更早和已归档的项目。这证明存在公开工程界面，但不能证明这些仓库驱动商业 Atlas 产品。公开记录也无法确定 AI
              错误率、误报或生产可用性的独立基准。成熟度的主要证据是运营广度和已点名的流程组件，而技术内部细节和保障证据仍属私有。
