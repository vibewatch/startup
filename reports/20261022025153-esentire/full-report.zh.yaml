    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              eSentire 于 2001 年在 Ontario 成立，并将自己定位为托管检测与响应服务商，而非单点产品供应商。其官方数据表称，公司为 80 多个国家、35 个行业的 2,000
              多个组织提供保护；公司描述的服务包括持续威胁暴露管理、MDR、数字取证与事件响应、全天候 SOC 分析师、精英威胁猎手和威胁响应团队。2026 年一份独立资料将其描述为双 SOC
              模式，集成端点、云、身份、SaaS 和网络环境，但也指出合同响应时间条款和分析师人数未公开披露。这些来源支持其成熟的服务模式和全球覆盖，但未独立验证公司的客户总数、当前人员规模或商业规模。
