        - 出售或资本重组耗时超过计划，且优先资本拥有优先受偿主张
        - 在计算普通股价值前，建模退出时间、优先权瀑布、稀释和发起人回报门槛
        - 流动性、融资可得性、治理
        - 必须结合股权结构表测试
      - - 证据失败
        - 管理层无法提供可靠的价格、KPI、cohort 或资本化证据
        - 不作估值结论；保留 research-more 决策
        - 信息不对称和逆向选择
        - 作为尽调结果为高
    notes: 这些是条件性投资判断情景，不是预测。指定来源没有提供当前 eSentire 估值、ARR、收入增长、利润率、NRR、债务或优先股堆叠，因此有意省略数字价格区间。
    claimRefs:
      - CV006
      - CV007
      - CV009
      - CV010
