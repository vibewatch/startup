  - id: FE001
    title: Atlas 产品架构图
    type: stack
    summary: 公开资料所述的 eSentire 运营层，将客户遥测数据连接到 Atlas 分析、人力运营、响应行动和客户治理。
    data:
      layers:
        - label: 信号与集成输入
          detail: 客户遥测数据通过受支持的集成接入，覆盖终端、网络、云、身份、日志、漏洞、浏览器和 SaaS 等场景。
          modules:
            - label: 多信号连接器
              detail: 终端、网络、云、身份、日志、漏洞、浏览器和 SaaS 输入。
        - label: Atlas 智能层
          detail: Atlas 关联各类信号，并应用特征、指标、行为分析和机器学习检测。
          modules:
            - label: 智能图谱
              detail: 公司称其会追踪、测试并验证威胁行为者的技术。
        - label: 检测工程
          detail: 威胁研究和检测内容被描述为运营反馈闭环的输入。
          modules:
            - label: ATT&CK 映射检测
              detail: 数据表介绍了 MITRE ATT&CK 映射和自动化检测。
        - label: 人工安全运营
          detail: SOC 分析师和威胁猎手负责调查、验证事件并提供建议。
          modules:
            - label: 24/7 SOC 与猎杀
              detail: 公司介绍了实时分析师、精英威胁猎手、威胁响应和网络风险顾问。
        - label: 响应与修复
          detail: 获批行动可包括遏制、干扰、隔离、阻断和账户控制。
          modules:
            - label: 遏制剧本
              detail: 公开示例包括主机隔离、暂停账户、阻断哈希及其他行动。
        - label: 客户治理
          detail: 门户、报告、业务评审和数据留存条款共同管理面向客户的一层。
          modules:
            - label: Insight Portal 与评审
              detail: 公司介绍了可视化、报告、建议和业务评审。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 从安全需求到扩张的客户旅程
    type: journey-map
    summary: 公开证据支持这样一条路径：资源受限的安全运营逐步走向集成监控与响应，但续约和扩张结果仍未经验证。
    data:
      nodes:
        - id: need
          label: 资源受限的安全团队
          title: Need
          details: 私募股权案例研究显示，eSentire 内部用于 24/7 检测与响应的专业能力、资源和工具有限。
          touchpoints:
            - Limited internal expertise
            - Need for 24/7 coverage
        - id: deploy
          label: 集成现有技术栈
          title: Deploy
          details: 公司称其 MDR 可集成超过 300 个技术解决方案，平均 14 天完成上线。
          touchpoints:
            - BYOL or bundled service
            - Multi-signal integrations
        - id: monitor
          label: 持续监控
          title: Monitor
          details: 数据表介绍了终端、网络、日志、云、身份、资产和漏洞信号，以及 24/7 SOC 支持。
          touchpoints:
            - Multi-signal visibility
            - 24/7 SOC analysts
        - id: respond
          label: 调查与遏制
          title: Respond
          details: 数据表报告平均 15 分钟完成遏制，并将主机隔离、网络干扰和账户暂停列为响应措施。
          touchpoints:
            - Threat hunting
            - Containment and remediation
        - id: prove
          label: 展示价值
          title: Prove
          details: Atlas 客户门户被描述为提供调查可视性、KPI 跟踪和同业比较。
          touchpoints:
            - Real-time reporting
            - Executive and board visibility
        - id: expand
          label: 续约与扩张
          title: Expand
          details: 客户管理职位说明将留存、扩张、续约、客户满意度和账户健康度列为职责，但未公开披露结果指标。
          touchpoints:
            - Renewal management
            - Upsell and cross-sell
    claimRefs:
      - CU005
      - CU006
      - CU009
      - CU010
    approximationNotes: 各阶段按定性顺序排列；未推断转化率、阶段时长或与价值成比例的宽度。
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最重要的剩余风险集中在响应保障、数据可移植性、集成覆盖范围和合同范围。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余风险
      rows:
        - label: 响应 SLA 与授权
          values:
            - 高
            - 严重
            - 低，待合同审查
            - 高
        - label: 集成或信号盲区
          values:
            - 高
            - 严重
            - 中
            - 高
        - label: Atlas 数据可移植性
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 隐私与监管保障
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 区域人员覆盖
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 定价与事件响应范围
          values:
            - 中
            - 高
            - 低
            - 高
    approximationNotes: 可能性、影响和剩余风险标签均综合了引用证据与尚未解决的尽调缺口；它们不是统计概率。
    claimRefs:
      - CR001
      - CR007
      - CR013
      - CR016
      - CR020
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: MDR 的广泛价值和指示性合同经济性支持有条件地跟踪并继续研究，但价格、财务质量和资本结构仍未经验证。
    data:
      nodes:
        - id: scale
          label: MDR 需求与广泛信号覆盖
          detail: 公司介绍了 Atlas 对终端、网络、云、身份、电子邮件和 SaaS 的覆盖。
        - id: product
          label: 产品差异化
          detail: 人工复核的受控自主能力和快速响应均为公司自述。
        - id: contracts
          label: 指示性合同经济性
          detail: Vendr 和独立定价来源提供了宽泛的 ACV 与范围区间。
        - id: missing
          label: 缺少投资级指标
          detail: 在指定证据中，估值、ARR、NRR、利润率、集中度、债务和优先权信息均未公开。
        - id: discipline
          label: 入场纪律
          detail: 需要股权结构表、价格、经审计 KPI、客户群组和标准化可比公司。
        - id: recommendation
          label: 跟踪 / 继续研究
          detail: 在证据缺口弥合前，不给出精确估值或买入建议。
      edges:
        - from: scale
          to: product
        - from: product
          to: contracts
        - from: contracts
          to: missing
        - from: missing
          to: discipline
        - from: discipline
          to: recommendation
    claimRefs:
      - CV001
      - CV006
      - CV010
      - CV014
