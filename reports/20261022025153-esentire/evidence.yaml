evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: private-company-disclosure
    missingEvidence: >-
      Current audited or management financials covering revenue, ARR, growth, margin, cash, debt, and total capital
      raised.
    whyItMatters: >-
      Without current financial definitions and periods, scale, valuation, and financing-risk judgments would be
      speculative.
    diligencePath: >-
      Request the latest investor data room financial package, capitalization table, debt schedule, and
      preferred-security terms under NDA.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete current executive and board roster with dates of appointment and departures.
    whyItMatters: >-
      Leadership continuity, key-person dependence, and sponsor governance cannot be assessed from two named individuals
      and customer references.
    diligencePath: >-
      Obtain a current corporate leadership page, board materials, and a dated leadership-change schedule from
      management.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Active-customer definition, cohort retention, customer concentration, and independent reference calls.
    whyItMatters: The 2,000+ figure is company-issued and may not reveal paid, active, or recurring-revenue customers.
    diligencePath: >-
      Request customer-count reconciliation, GRR/NRR by cohort, top-customer concentration, and permissioned reference
      calls.
    relatedQuestionRefs:
      - QO001
      - QO006
    relatedTableRefs:
      - TO003
  - type: access-blocked
    severity: material
    topic: contractual-SLA
    missingEvidence: Customer contracts or service schedules specifying response-time commitments, exclusions, and service credits.
    whyItMatters: Public mean-time-to-contain marketing cannot be treated as a contractual guarantee or a realized customer outcome.
    diligencePath: >-
      Review representative MDR order forms, SLA schedules, service-credit clauses, and incident-action authority under
      NDA.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Independent, dated records for product, regulatory, partnership, and adverse milestones not represented in the
      assigned pool.
    whyItMatters: >-
      The timeline is stronger for financing and product announcements than for governance, regulatory status, or
      adverse events.
    diligencePath: Obtain a dated corporate chronology and search regulator, court, and partner records for the refresh period.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market-size
    missingEvidence: >-
      eSentire-specific eligible-account counts, average contract value by segment, geographic eligibility, channel
      contribution, win rates, and retention-adjusted penetration.
    whyItMatters: >-
      Global category forecasts cannot establish a defensible company-specific SAM or attainable SOM and should not be
      converted directly into revenue growth assumptions.
    diligencePath: >-
      Obtain management's bottom-up market model and reconcile it to CRM account counts, segment-level ACV, pipeline
      conversion, channel-sourced bookings, and cohort retention.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: >-
      Independent procurement evidence identifying the economic buyer, payer, budget owner, decision cycle, and
      switching process for each priority segment.
    whyItMatters: >-
      Buyer-role hypotheses cannot establish sales-cycle duration, budget durability, or the practical route from market
      demand to eSentire bookings.
    diligencePath: >-
      Review recent requests for proposal, lost-deal notes, channel pipeline records, and at least five independent
      customer procurement interviews by segment.
    relatedQuestionRefs:
