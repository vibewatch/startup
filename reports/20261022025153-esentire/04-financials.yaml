      - ["Add-ons and professional services", "Vulnerability, digital risk, forensics, consulting and integrations", "Module, engagement or hours", "Separately priced in public cost reference", "Indicative; contract verification required", "Attach rate, backlog, delivery cost and revenue recognition"]
      - ["Renewal and expansion", "Renewals, upsell and cross-sell across enterprise accounts", "Contract value and account portfolio", "Commercial responsibility stated in job posting", "Company job-posting signal", "GRR, NRR, churn and expansion cohorts"]
    notes: "Rows combine company-described offerings with third-party pricing descriptions; public evidence does not establish revenue mix, realized pricing, or accounting treatment."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization benchmarks
    columns: [Scope or metric, Indicative value, Basis, Confidence, Why it matters, Diligence ask]
    rows:
      - [Endpoint MDR, "$40-$80 per endpoint/year", "Vendr-described buyer outcomes for 100-500 endpoints", "Medium; anonymized buyer data", "Sets a directional unit-price range", "Contract-level realized price by tier and term"]
      - [Endpoint MDR, "$30-$60 per endpoint/year", "MDRProviders-described buyer data for 1,000+ endpoints", "Medium; dated third-party report", "Suggests volume price compression", "Validate sample, scope and EDR-license inclusion"]
      - [Mid-market contract, "$80K-$250K/year", "SecurityOperationsCost estimate for 500-2,000 endpoints with full log integration", "Low-to-medium; indicative", "Frames annual budget scale", "Reconcile protected assets, users, logs and services"]
      - [Larger deployment, "$300K-$500K/year", "SecurityOperationsCost estimate for 2,000-5,000 endpoints", "Low-to-medium; indicative", "Frames enterprise contract scale", "Validate mix, term, discounts and add-ons"]
      - [Contract structure, "Annual or multi-year; minimums and add-ons", "Vendr pricing-structure description", "Medium; not a rate card", "Identifies negotiation and retention levers", "Obtain standard order form and renewal escalators"]
    notes: "Values are not eSentire-disclosed revenue or ARR. Sources use different populations and scope definitions; do not combine ranges into a single average price."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [CAC, null, "Unavailable", "Cannot assess sales efficiency or payback", "Bookings-to-CAC by channel and cohort"]
      - [CAC payback, null, "Unavailable", "Cannot test growth efficiency", "CAC payback using realized gross margin"]
      - [GRR / NRR, null, "Unavailable", "Renewal quality is central to recurring economics", "Cohort retention and expansion by segment"]
      - [Gross margin, null, "Unavailable", "Labor intensity may constrain margin expansion", "Gross margin by tier, telemetry scope and geography"]
      - [Cash, burn and runway, null, "Capital dependency cannot be assessed", "Current cash, monthly burn, debt schedule and runway"]
      - [Incident-response overage, "100-200 hours typically included; above-pool rates described by third party", "Medium; indicative", "Unplanned response can change account contribution margin", "Included hours, surge rates and historical utilization"]
    notes: "Null means no usable public value was found in the assigned pool; it is not zero. The incident-response range is a third-party contract description, not a company-wide policy."
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
