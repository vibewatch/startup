company:
  name: eSentire
chapter:
  number: 4
  title: Financials
  summary: eSentire sells a scope-based, multi-surface MDR service rather than a transparent software SKU. Public evidence supports a recurring contract model with endpoint, network, cloud, log-source, add-on, and services components, but does not disclose audited revenue, margin, cash, burn, or runway; underwriting therefore depends on customer-level contract diligence and capital-adequacy evidence that remains private.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      eSentire's public materials describe a managed service that combines 24/7 monitoring,
      threat hunting, investigation, and response across endpoint, network, cloud, identity,
      SaaS, and application environments. Its commercial model is therefore closer to recurring
      managed-service contracts than to a self-serve software subscription. The independent
      2026 pricing reference says the company does not publish a public rate card and quotes
      against endpoints, users, log sources, and cloud workloads; this is the strongest available
      description of the monetization dimensions, but it is not an audited revenue disclosure.
      Vendr's buyer-data analysis likewise describes annual commitments, minimum asset or spend
      floors, service tiers, and optional modules. The company says its MDR can support bring-your-
      own-license or subscription deployments, so endpoint-license revenue should not be assumed
      to be bundled into every contract. eSentire's account-management hiring material explicitly
      assigns renewals, retention, upsell, cross-sell, and expansion revenue to the commercial
      team, providing a direct signal that renewal and expansion are core economic levers.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-sales-efficiency
    title: Pricing architecture and sales-efficiency proxies
    body: >-
      Public pricing evidence is indicative, not a company rate card. Vendr reports endpoint
      buyer ranges of roughly $40-$80 per endpoint per year for 100-500 endpoints and says
      multi-year commitments and larger deployments can move pricing toward the lower end.
      A separate 2026 cost reference estimates mid-market contracts at $80,000-$250,000 per
      year for 500-2,000 endpoints and larger deployments at $300,000-$500,000, while expressly
      labeling the figures as indicative and noting that eSentire does not publish list pricing.
      The two sources use different samples and scope definitions, so their ranges should not be
      blended into a single ARPU or ARR estimate. A Built In account-manager posting provides a
      qualitative sales-efficiency proxy: the role owns renewals, retention, upsell, cross-sell,
      forecasts, and contract negotiation for enterprise accounts. No public CAC, payback,
      win-rate, realized discount, churn, GRR, or NRR series was found in the assigned evidence.
      These missing metrics prevent a reliable contribution-margin or lifetime-value calculation.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI002]
  - id: cost-structure-and-capital
    title: Cost structure, margin path, and capital adequacy
    body: >-
      The service is operationally labor-intensive: public descriptions emphasize 24/7 SOC
      coverage, threat hunters, analysts, customer success, integrations, and incident response.
      The independent cost reference says typical contracts include a pool of 100-200 incident-
      response hours per year and identifies separately priced professional services, penetration
      testing, vulnerability management, digital forensics, vCISO consulting, and exposure
      management. It also describes Atlas as the analyst platform and notes that customers
      generally bring their own EDR licenses. These are useful cost-driver and packaging signals,
      not evidence of eSentire's gross margin or service-delivery cost. The same source flags
      platform lock-in and loss of historical investigation access after termination, which is
      commercially relevant downside for buyers and a diligence issue for retention assumptions.
      No assigned source discloses cash on hand, debt, burn, runway, audited revenue, EBITDA,
      gross margin, or financing covenants. Capital adequacy and the next-round trigger therefore
      remain material underwriting gaps rather than values to estimate from pricing ranges.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The evidence supports a recurring, contract-based MDR model with several expansion paths:
      broader telemetry scope, higher service tiers, add-on modules, professional services, and
      renewals. It does not support a precise revenue run-rate, margin, cash-burn, or valuation
      calculation. The key financial question is whether labor and response obligations scale
      efficiently enough for recurring contract value to produce durable gross-margin expansion.
      Management should provide a cohort bridge from bookings to recognized revenue, renewal and
      expansion cohorts, realized price per protected asset, analyst and infrastructure cost per
      contract, incident-response overage economics, and a current cash/debt/runway package before
      an investment decision.
    claimRefs: [CI004, CI008, CI009, CI012, CI013, CI014]
callouts:
  - calloutType: risk
    title: Financial underwriting remains disclosure-constrained
    body: Public pricing benchmarks describe buyer economics but do not establish eSentire revenue, ARR, gross margin, cash, burn, or runway. Treat any precise financial model as scenario analysis until management supplies contract-level and capital-adequacy data.
    claimRefs: [CI006, CI009, CI013]
