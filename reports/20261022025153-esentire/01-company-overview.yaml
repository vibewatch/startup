chapter:
  number: 1
  title: Company Overview
  summary: eSentire is a Waterloo-founded, private cybersecurity provider built around managed detection and response, exposure management, incident response, and its Atlas platform. The assigned evidence supports a long operating history, broad customer and integration claims, and recent agentic-AI product activity, but does not independently establish current valuation, revenue, headcount, or financing status.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      eSentire was founded in 2001 in Ontario and positions itself as a managed
      detection and response provider rather than a point-product vendor. Its
      official datasheet describes protection for more than 2,000 organizations
      across 80+ countries and 35 industries, while the company describes a
      service set spanning continuous threat exposure management, MDR, digital
      forensics and incident response, 24/7 SOC analysts, elite threat hunters,
      and a threat response unit. A 2026 independent profile describes the
      offering as a dual-SOC model with integrations across endpoint, cloud,
      identity, SaaS, and network environments, but also notes that contractual
      response-time terms and analyst headcount were not publicly disclosed.
      These sources support a mature service model and global reach; they do
      not independently verify the company's customer total, current staffing,
      or commercial scale.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-stakeholders
    title: Leadership, founders, and stakeholder coverage
    body: >-
      Public evidence identifies Eldon Sprikerhoff as founder and identifies
      Dustin Hillard as Chief Product and Technology Officer in the 2026 Atlas
      announcement. The supplied evidence does not provide a complete current
      executive roster, board composition, or a dated record of material
      leadership changes. Customer-facing proof is broad but predominantly
      company-published: eSentire names security leaders at Quarles & Brady,
      Texas United Management, Elemica, Rawlings Sporting Goods, Thomas H. Lee
      Partners, CubeSmart, and Hexagon as users or references. A Built In
      reposted job description indicates that the commercial organization owns
      renewals, retention, expansion, and executive relationships, which is
      useful operating context but is not evidence of realized retention or
      growth. Key-person and governance diligence therefore remain open.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: funding-milestones-and-gaps
    title: Funding, milestones, and diligence gaps
    body: >-
      The assigned historical source records a $1 million Canadian federal
      development loan in 2011, followed by Series A through D financings from
      2012 to 2016 and a growth-equity investment of more than $100 million
      from Warburg Pincus in 2017. Those entries are historical and do not
      establish a current total raised, valuation, debt balance, ownership
      structure, or liquidity event. More recent evidence shows a February
      2026 MDR explainer, a May 27, 2026 Atlas AI Operatives launch, and a
      2026 company threat-outlook release discussing 2025 incident data.
      The company claims hundreds of thousands of autonomous investigations,
      95%+ senior-analyst alignment, and sub-five-minute signal-to-context
      performance, while independent buyer-oriented material flags undisclosed
      contractual SLAs and pricing that varies by tier and endpoint scale.
      The resulting diligence priority is to obtain current financing,
      governance, recurring-revenue, retention, staffing, and customer
      concentration evidence rather than infer those metrics from marketing
      or job-posting language.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
