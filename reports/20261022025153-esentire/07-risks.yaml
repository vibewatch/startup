callouts:
  - calloutType: risk
    title: Contractual response assurance is the key diligence gate
    body: "eSentire publishes fast-containment and broad-response claims, but the independent profile says no public contractual response-time SLA or service-credit terms were found. Require a customer-environment proof and enforceable service scope before underwriting the operating benefit."
    claimRefs: [CR003, CR004]
  - calloutType: assumption
    title: No recorded incident is not evidence of no incident
    body: "The assigned pool does not establish current litigation, enforcement, breach, certification, or customer-concentration status. Those are unresolved diligence items rather than clean findings."
    claimRefs: [CR011]
