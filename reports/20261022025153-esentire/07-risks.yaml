      - ["Privacy, retention, and cross-border security telemetry", "Customer-specific / international", "Not established in assigned pool", medium, high, "Map endpoint, identity, cloud, log, and vulnerability data flows", "Medium-high", "Review DPA, subprocessors, retention, residency, deletion, and transfer mechanisms"]
      - ["Vulnerability remediation and exploited-asset exposure", "Global customer environments", "CISA KEV provides external prioritization baseline", medium, high, "Prioritize exploited vulnerabilities and apply updates or remove unpatchable products", "Medium", "Request current vulnerability-closure evidence and customer-specific KEV operating metrics"]
      - ["Certification, authorization, and public-sector eligibility", "Canada / United States / customer regimes", "Current eSentire status not confirmed", medium, high, "Require current attestations and scope-specific control mapping", "High", "Verify FedRAMP, CCCS, SOC, ISO, and other required authorizations directly"]
      - ["Litigation, enforcement, and breach history", "Canada / United States / other operating jurisdictions", "No current conclusion from assigned pool", unknown, high, "Use legal and incident disclosure review before reliance", "High", "Run counsel-led docket, regulator, breach-notice, and sanctions checks"]
      - ["Customer change-control and service liability", "Contract-specific", "Terms not publicly established", medium, high, "Define approval, notification, liability, and service-credit provisions", "Medium-high", "Negotiate measurable SLA, service credits, indemnity, and customer approval rights"]
    notes: "Rows synthesize the assigned company, CISA, and independent MDR sources; unknown or unconfirmed status is preserved rather than treated as no incident or no obligation."
    enumerationScope:
      coverage: partial
      basis: "Publicly accessible assigned-pool evidence as of the 2026-10-22 report run; not a complete legal or regulatory docket."
    claimRefs: [CR007, CR008, CR011]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Signal blind spot or integration failure", high, critical, "Company describes 300+ integrations and multi-signal ingestion; customer proof is required", high, "Validate every required source and degraded-mode behavior in a live test"]
      - ["Containment slower than advertised", medium, critical, "Company publishes sub-15-minute claims; independent profile says no public contractual SLA found", high, "Measure p50/p95 alert-to-action and contractualize thresholds"]
      - ["False positives or analyst overload", medium, high, "Atlas and threat-hunting claims are company-described", medium-high, "Review alert rates, escalations, tuning ownership, and missed-event samples"]
      - ["Human oversight or staffing continuity gap", medium, high, "Company describes 24/7 analysts and six-year average tenure", medium, "Request staffing, turnover, coverage, and escalation evidence by region"]
      - ["AI or automation action error", medium, high, "Company says humans remain on the loop", medium-high, "Test approval gates, rollback, audit trails, and unsafe-action handling"]
      - ["Portal, evidence, or case-history portability loss", medium, high, "Independent cost research describes proprietary Atlas and recommends negotiating export", high, "Require machine-readable export, retention window, and transition assistance"]
      - ["Regional coverage mismatch", medium, high, "Independent profile flags no dedicated APAC SOC", medium-high, "Verify follow-the-sun staffing and contractual coverage for every operating region"]
      - ["Incident-response scope or surge-cost surprise", medium, high, "Independent sources describe included hours, tier differences, and possible add-ons", high, "Define included actions, hours, surge rates, and forensic boundaries"]
    notes: "Likelihood and severity are analytical judgments anchored to the cited operating evidence; the table intentionally marks unverified customer outcomes as gaps."
    claimRefs: [CR001, CR002, CR003, CR005, CR013, CR016, CR020]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Endpoint and security-tool ecosystem, "CrowdStrike / Microsoft / other technology partners", "Telemetry, identity, endpoint, and response integration", "Not quantified", "API, licensing, or partner-policy change reduces coverage or response", high, "Maintain multi-vendor support and test fallbacks", medium-high]
      - [Customer-owned security stack, "Customer", "BYOL/BYOS data and control plane", "Customer-specific", "Customer cannot provide usable telemetry or authorization", high, "Scope onboarding prerequisites and degraded-mode runbooks", medium]
      - ["Atlas platform and historical case data", "eSentire", "Investigation surface and detection workflow", "Potentially high where Atlas is system of record", "Termination blocks access to history or logic", high, "Negotiate export window and machine-readable records", high]
      - [SOC analyst expertise and regional coverage, "eSentire", "24/7 investigation, hunting, containment", "Not quantified", "Turnover, queueing, or geography delays response", high, "Contract staffing, escalation, and response metrics", medium-high]
      - [Channel and reseller route, "Partners / distributors", "Commercial access and procurement", "Not quantified", "Intermediary changes economics or service accountability", medium, "Contract directly where possible and define support ownership", medium]
      - ["Customer concentration and retention", "Customer base", "Recurring MDR revenue and threat-learning data", "Not disclosed in assigned pool", "Large customer loss weakens growth or model data", high, "Request cohort, churn, NRR, and concentration data", high]
    notes: "Counterparties and concentration are retained as explicit dependencies; the assigned pool does not support customer-level concentration percentages or audited retention metrics."
    claimRefs: [CR013, CR014, CR015, CR016]
