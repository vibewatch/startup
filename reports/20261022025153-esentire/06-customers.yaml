      - ["Countries", "80+", "Current company data sheet; fetched 2026-10-22", "Company-claimed", "Indicates geographic breadth", "Revenue or account mix by geography"]
      - ["Industries", "35", "Current company data sheet; fetched 2026-10-22", "Company-claimed", "Indicates vertical diversification", "Customer count by vertical"]
      - ["Technology integrations", "300+", "Current company switch page; fetched 2026-10-22", "Company-claimed", "Supports multi-vendor deployment flexibility", "Paid integrations and active production usage"]
      - ["Average onboarding", "14 days", "Current company switch page; fetched 2026-10-22", "Company-claimed", "Suggests low initial deployment friction", "Sample size, scope, and variance"]
      - ["Gartner Peer Insights rating", "4.6 / 5 across 85 ratings", "All time; page fetched 2026-10-22", "Independent review platform", "Supports favorable aggregate customer sentiment", "Self-selected ratings are not a retention cohort"]
      - ["NRR / GRR", null, "Not found in assigned fetched text", "Evidence gap", "Cannot establish recurring-revenue durability", "Request audited cohort retention"]
      - ["Logo churn and renewal rate", null, "Not found in assigned fetched text", "Evidence gap", "Cannot establish renewal durability", "Request trailing 12-month bridge"]
      - ["Contract duration and expansion", "Partial", "Account-management role emphasizes renewals and upsell", "Company operating signal", "Expansion motion is described but not measured", "Obtain booking and expansion cohorts"]
      - ["Top-customer concentration", null, "Named customers are examples, not a concentration schedule", "Evidence gap", "Broad reach may conceal concentration", "Request top-10 customer ARR share"]
      - ["Channel concentration", null, "Partner-distributed positioning appears in TD SYNNEX page", "Evidence gap", "Channel dependence may affect renewals", "Request partner-sourced ARR share"]
      - ["Regional service coverage", "Partial", "Independent review says dual SOC model with additional regional coverage; contractual SLA not disclosed", "Independent review", "Service scope may affect procurement", "Verify staffing, authority, and service credits"]
    notes: "These are heterogeneous company-reported operating indicators, not a comparable growth funnel; null means the metric was not found in assigned public evidence, and no conversion, active-account, utilization, or time-series calculation is made."
    claimRefs: [CU001, CU005, CU006, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer, Segment, Deployment or use case, Production versus pilot, Stated outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Named customer examples visible on the assigned eSentire case-study page fetched 2026-10-22; not a complete customer population."
    rows:
      - [Quarles & Brady LLP, Legal, Trusted MDR relationship and peer recommendation, "Not disclosed", "CIO says they would recommend eSentire without hesitation", "Qualitative testimonial; no measured outcome"]
      - ["Elemica", "Supply-chain manufacturing", "Managed SOC, 24/7 detection and threat hunting, consolidated dashboard and reporting", "Not disclosed", "CISO describes capabilities; no contract or retention evidence", "No contract, outcome denominator, or retention evidence"]
      - [CubeSmart, Real estate, Security monitoring and response relationship, "Not disclosed", "Director says eSentire is looking out for the network and environment", "Qualitative testimonial; no incident or renewal data"]
      - [Thomas H. Lee Partners, Private equity, Portfolio risk assessment and MDR across portfolio companies, "Not disclosed", "Case study says eSentire provides visibility, vulnerability closure, and consistent posture", "35+ portfolio-company scope is not a disclosed deployment count"]
    notes: "Rows are a partial enumeration of named examples, not proof that each relationship is current, paid, production-wide, or renewed. Claims backing rows use the case-study page plus the company data sheet or independent review where available."
    claimRefs: [CU003, CU004, CU007, CU011]
figures:
  - id: FU001
    title: Customer journey from security need to expansion
    type: journey-map
    summary: Public evidence supports a journey from resource-constrained security operations to integrated monitoring and response, while renewal and expansion outcomes remain unverified.
    data:
      nodes:
        - id: need
          label: Resource-constrained security team
          title: Need
          details: "eSentire's private-equity case study describes limited in-house expertise, resources, and tools for 24/7 detection and response."
          touchpoints: ["Limited internal expertise", "Need for 24/7 coverage"]
        - id: deploy
          label: Integrate existing stack
          title: Deploy
          details: "The company says its MDR integrates with more than 300 technology solutions and averages 14-day onboarding."
          touchpoints: ["BYOL or bundled service", "Multi-signal integrations"]
        - id: monitor
          label: Continuous monitoring
          title: Monitor
          details: "The data sheet describes endpoint, network, log, cloud, identity, asset, and vulnerability signals plus 24/7 SOC support."
          touchpoints: ["Multi-signal visibility", "24/7 SOC analysts"]
        - id: respond
          label: Investigate and contain
          title: Respond
          details: "The data sheet reports a 15-minute mean time to contain and names host isolation, network disruption, and account suspension as response measures."
          touchpoints: ["Threat hunting", "Containment and remediation"]
        - id: prove
          label: Report value
          title: Prove
          details: "The Atlas customer portal is described as providing investigation visibility, KPI tracking, and peer comparisons."
          touchpoints: ["Real-time reporting", "Executive and board visibility"]
        - id: expand
          label: Renew and expand
          title: Expand
          details: "The account-management listing assigns responsibility for retention, expansion, renewals, customer satisfaction, and account health, but public outcome metrics are not disclosed."
          touchpoints: ["Renewal management", "Upsell and cross-sell"]
    claimRefs: [CU005, CU006, CU009, CU010]
    approximationNotes: "The stages are qualitative and ordered; no conversion rates, stage durations, or value-proportional widths are inferred."
callouts:
  - calloutType: risk
    title: Retention and concentration are unverified
    body: No assigned source provides NRR, GRR, churn, renewal, contract-length, or top-customer ARR data; treat customer breadth as a reach indicator rather than a durability proxy.
    claimRefs: [CU009, CU010, CU012]
  - calloutType: insight
    title: Production proof is stronger than logo proof
    body: Named users describe operating workflows and outcomes, but the public record does not provide contracts, deployment dates, usage denominators, or independent validation for every case.
    claimRefs: [CU003, CU007, CU011]
