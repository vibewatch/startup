schemaVersion: "report-v2"
artifact: customers
slug: esentire
runDate: 2026-10-22
company:
  name: eSentire
chapter:
  number: 6
  title: Customers
  summary: eSentire presents a broad, global MDR customer base across 35+ industries, with named case studies showing use by legal, manufacturing, supply-chain, real-estate, software, banking, and private-equity organizations. Gartner Peer Insights reports a 4.6/5 all-time rating across 85 ratings, but public evidence does not establish retention, renewal, concentration, or independently verified adoption growth.
sections:
  - id: customer-segments
    title: Customer segments and buyer value
    body: >-
      eSentire's public customer surface points to a broad enterprise and mid-market
      base rather than a single vertical. The company says it protects 2,000+
      organizations in 80+ countries and 35 industries, while its case-study
      portfolio names legal, mining and metals, supply-chain manufacturing, sports
      equipment, real estate, software, banking, consumer goods, and private equity.
      The buyer is typically a security or IT leader who needs 24/7 monitoring,
      threat hunting, and response without building a fully staffed internal SOC.
      A customer quoted on the case-study page describes the provider as an extension
      of the team, and the private-equity example describes portfolio-wide visibility
      and consistent security posture as the use case. These examples indicate
      strategic value in scarce expertise, response coverage, and standardization,
      but they are company-published proof and do not disclose account-level revenue,
      active-use denominators, or payer-versus-user splits.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named deployment proof
    body: >-
      The strongest public adoption evidence is deployment and workflow detail, not
      a time series. eSentire describes 300+ technology integrations, average
      onboarding in 14 days, and 24/7 SOC support; its customer materials identify
      named organizations, their industries, employee scale in several cases, and
      specific operating outcomes such as consolidated reporting, continuous
      monitoring, or portfolio coverage.       Gartner's 2026 review page reports a 4.6 out of 5 all-time rating across
      85 ratings, providing a separate market-facing adoption signal, but it does
      not expose a customer-count series or retention metric. Accordingly, the
      evidence supports breadth and plausibility of production deployments while
      leaving growth rate, utilization, and cohort durability unresolved.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: retention-expansion-risk
    title: Retention, expansion, and concentration diligence
    body: >-
      Public evidence does not substantiate NRR, GRR, logo churn, renewal rates,
      contract duration, cohort curves, or top-customer concentration. A current
      account-management recruiting listing is informative about the commercial
      operating model: the role is accountable for retention, expansion, renewals,
      customer value realization, account health, and customer       satisfaction. That is evidence of management priorities, not evidence that
      those outcomes have been achieved. Gartner also surfaces an October 2023
      complaint about SOC communication, malware labeling, and ticket turnaround.
      Independent buyer-oriented material flags questions about pricing, scope,
      response authority, and regional coverage, which can affect renewal friction
      and expansion. The investment case therefore depends on obtaining a customer
      cohort export, renewal and expansion bridge, concentration schedule, and
      reference calls that distinguish production use from marketing logos and
      pilots.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014]
tables:
