  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is managed detection and response service revenue, not all cybersecurity spending.
              The Business Research Company defines MDR as a contracted service that helps businesses identify dangers
              and respond after detection; its revenue boundary includes threat intelligence, threat hunting, security
              monitoring, incident analysis, and incident response. For this chapter, standalone endpoint licenses, SIEM
              software, vulnerability scanners, one-off consulting, and internal security payroll are excluded unless
              they are bundled into a managed detection-and-response engagement. They remain economically important
              substitutes because a buyer can retain an in-house SOC, use an MSSP primarily for alert forwarding, or
              assemble technology and incident-response retainers separately. eSentire's own positioning is broader than
              narrow endpoint monitoring: it describes multi-signal coverage across endpoint, network, logs, cloud,
              identity, and other telemetry, while a channel partner also presents continuous threat exposure management
              and digital forensics and incident response alongside MDR. Those adjacencies can enlarge wallet share, but
              counting their full categories inside core MDR would overstate the relevant market. The company-issued
              capability pages establish intended scope, not independent proof of product efficacy or market share.
            claimRefs:
              - CM007
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM007
              - CM016
      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              Two independent publishers converge on a small but fast-growing global category at the starting point
              while diverging on the forecast path. Precedence Research estimates $3.40 billion in 2025 and $3.92
              billion in 2026, then projects $13.90 billion by 2035 at a 15.12% CAGR for 2026-2035. The Business
              Research Company estimates $3.46 billion in 2025 and $4.16 billion in 2026, then projects $8.57 billion by
              2030 at a 19.8% CAGR for 2026-2030. The resulting publisher ranges are $3.40-$3.46 billion for 2025 and
              $3.92-$4.16 billion for 2026. These are global category estimates with different taxonomies and horizons,
              not additive values and not eSentire TAM/SAM/SOM. Precedence reports North America at 46% of 2025 market
              value, SMEs as the largest enterprise-size segment, large enterprises as the fastest-growing size segment
              for 2026-2035, and BFSI as the leading vertical. That supports a dual buyer motion: resource-constrained
              mid-market organizations outsourcing SOC capability and larger regulated enterprises using MDR as a
              co-managed layer. Public evidence does not disclose eSentire win rates, serviceable accounts, budget
              ownership, or average contract value by segment, so no company-specific SAM or SOM is asserted.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
