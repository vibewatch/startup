  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              eSentire was founded in 2001 in Ontario and positions itself as a managed detection and response provider
              rather than a point-product vendor. Its official datasheet describes protection for more than 2,000
              organizations across 80+ countries and 35 industries, while the company describes a service set spanning
              continuous threat exposure management, MDR, digital forensics and incident response, 24/7 SOC analysts,
              elite threat hunters, and a threat response unit. A 2026 independent profile describes the offering as a
              dual-SOC model with integrations across endpoint, cloud, identity, SaaS, and network environments, but
              also notes that contractual response-time terms and analyst headcount were not publicly disclosed. These
              sources support a mature service model and global reach; they do not independently verify the company's
              customer total, current staffing, or commercial scale.
