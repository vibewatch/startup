  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          NRR and gross margin are strong; Atlas expands within accounts; growth is durable; price and preference terms
          are investor-friendly
        - >-
          No numeric range is supportable until audited KPIs and normalized comparable evidence establish a defensible
          multiple
        - AI efficacy, response liability, competitive bundling, execution
        - Low until private evidence confirms
      - - Base
        - MDR demand persists; growth is moderate; contract values convert to recurring revenue with normal services mix
        - >-
          No numeric range is supportable; require verified price, a normalized comp set, a liquidity discount, and
          downside protection
        - Unknown NRR, margin, concentration, debt, and exit timing
        - Base underwriting case, not a target price
      - - Bear
        - >-
          Growth slows; discounts and renewal pressure rise; services or IR intensity dilute margins; valuation
          compresses
        - Do not invest unless entry price provides a verified downside margin after preferences and debt
        - Down round, customer loss, platform lock-in, response-scope disputes
        - Material and currently unresolved
      - - Exit-constrained
        - Sale or recap takes longer than planned and preferred capital has senior claims
        - Model time-to-exit, preference waterfall, dilution, and sponsor return hurdles before common-equity value
        - Liquidity, financing availability, governance
        - Must be tested with cap table
      - - Evidence-failure
        - Management cannot provide reliable price, KPI, cohort, or capitalization evidence
        - No valuation conclusion; retain a research-more decision
        - Information asymmetry and adverse selection
        - High as a diligence outcome
    notes: >-
      These are conditional underwriting scenarios, not forecasts. No assigned source supplies a current eSentire
      valuation, ARR, revenue growth, margin, NRR, debt, or preference stack; numeric price ranges are therefore
      intentionally omitted.
