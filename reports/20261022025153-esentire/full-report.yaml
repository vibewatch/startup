companyProfile:
  summary: >-
    eSentire is a private cybersecurity company founded in Ontario in 2001 that sells managed detection and response,
    threat exposure management, digital forensics, and incident response. Its Atlas platform combines telemetry and
    analyst-led response across endpoint, network, cloud, identity, SaaS, and related security environments. Public
    evidence supports a mature, broad operating model and named customer deployments, while key financial, retention,
    governance, and capitalization facts remain private or undisclosed.
