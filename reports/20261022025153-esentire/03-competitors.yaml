    notes: "Sources mix company comparisons, competitor product documentation, and a third-party comparison; figures are not normalized market share or audited scale."
    claimRefs: [CP001, CP002, CP003, CP004, CP013]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, eSentire, CrowdStrike MDR, ReliaQuest GreyMatter, Microsoft Defender, Evidence qualification]
    rows:
      - ["Multi-signal telemetry", "Endpoint, network, log, cloud, identity, vulnerability", "Limited in eSentire comparison", "Not established in assigned text", "Endpoint, identity, email, SaaS workloads", "Vendor-authored comparison for eSentire/CrowdStrike; Microsoft official description"]
      - ["Human-led response", "24/7 SOC, threat hunting, containment and response", "Human support details not established here", "Service and support are comparison dimensions", "Automatic attack disruption; human service layer not established here", "Do not infer parity from product labels"]
      - ["Integrations or ecosystem", "300+ integrations claimed", "In-house endpoint focus in eSentire comparison", "Not established in assigned text", "Eligible Defender workloads and Microsoft 365 suites", "Integration counts are not independently benchmarked"]
      - ["Data portability", "Atlas history may require negotiated export", "Unknown", "Unknown", "Unknown", "Portability is a diligence question, not a confirmed competitor advantage"]
      - ["Pricing transparency", "Quoted by scope; no public rate card", "Unknown", "Pricing is a comparison dimension; amount not disclosed", "Suite/product licensing described, price not in assigned text", "Unknown cells remain intentionally unscored"]
    notes: "Unknown cells mean the assigned successful sources did not establish the capability or price; they are not negative findings."
    claimRefs: [CP005, CP006, CP009, CP010, CP011]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Option, Public price evidence, Contract or packaging model, Included or emphasized capability, Buyer implication]
    rows:
      - [eSentire MDR, "$80K-$250K typical mid-market; $300K-$500K larger deployments (indicative)", "Scope-based on endpoints, users, log sources, and cloud workloads", "24/7 SOC, named analyst team, threat hunting, incident-response hour pool", "Compare total scope and overage terms; endpoint licenses may remain separate"]
      - [CrowdStrike MDR, "Not disclosed in assigned sources", "Endpoint-centered platform ecosystem", "In-house endpoint agent and platform distribution", "May fit a standardized CrowdStrike estate; assess non-endpoint coverage"]
      - [ReliaQuest GreyMatter, "Not disclosed; PeerSpot comparison includes pricing as a comparison dimension", "MDR service comparison", "Service, support, deployment, and ROI are comparison dimensions", "Validate actual quote, deployment effort, and reference quality"]
      - [Microsoft Defender Suite, "Not disclosed in assigned source", "Eligible Defender products and Microsoft 365 or security suites", "Endpoint, identity, email, SaaS, and automatic attack disruption", "Potential procurement leverage for existing Microsoft customers; confirm service ownership"]
      - ["Internal SOC / co-managed SIEM", "Not quantified in assigned sources", "Staffing and customer-owned tooling", "Control, customization, and existing SIEM preservation", "Compare labor, coverage hours, response authority, and execution risk"]
    notes: "The eSentire ranges are explicitly indicative and sourced from independent SOC-cost research; null or undisclosed competitor prices are not estimates."
    claimRefs: [CP009, CP010, CP012, CP016]
figures:
  - id: FP001
    title: Competitive positioning by integration breadth and managed response
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning highlights eSentire's intended
      advantage in broad integrations and managed response, not a measured
      market ranking.
    data:
      points:
        - {label: eSentire, x: 4, y: 4, note: "300+ integrations and 24/7 multi-signal response are company- or partner-supported claims", tone: positive}
        - {label: CrowdStrike, x: 2, y: 3, note: "Endpoint ecosystem is established; eSentire's comparison describes limited broader visibility", tone: neutral}
        - {label: ReliaQuest, x: 3, y: 3, note: "PeerSpot comparison establishes an MDR peer and service comparison, but not integration breadth", tone: neutral}
        - {label: "Microsoft Defender", x: 3, y: 2, note: "Broad Microsoft workload coverage and automatic disruption are documented; managed service depth is not established", tone: neutral}
        - {label: "Internal SOC", x: 1, y: 4, note: "Can provide direct control, but assigned evidence describes staffing and maintenance constraints", tone: warning}
        - {label: "Co-managed SIEM", x: 2, y: 3, note: "Preserves customer-owned tooling, but comparative response and integration evidence is not established in the pool", tone: neutral}
      xAxis: "Evidence-backed ordinal integration breadth (1 low, 4 high)"
      yAxis: "Evidence-backed ordinal managed-response ownership (1 low, 4 high)"
    approximationNotes: "Ordinal scores are analyst synthesis from the cited capability evidence, not a vendor benchmark or quantitative market score."
    claimRefs: [CP006, CP008, CP013, CP016]
