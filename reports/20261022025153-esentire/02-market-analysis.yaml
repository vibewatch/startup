company:
  name: "eSentire"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Independent market publishers place the global managed detection and response market at
    $3.40-$3.46 billion in 2025 and $3.92-$4.16 billion in 2026, but their different definitions
    and forecast horizons prevent those figures from serving as a company-specific addressable
    market. eSentire is exposed to attractive cloud, skills-shortage, and regulatory demand while
    buyer-reported alert noise and absent public budget-owner, SAM, and SOM evidence constrain
    underwriting precision.
sections:
  - id: "market-boundary"
    title: "Market boundary and status-quo substitutes"
    body: >-
      The investable market is managed detection and response service revenue, not all
      cybersecurity spending. The Business Research Company defines MDR as a contracted service
      that helps businesses identify dangers and respond after detection; its revenue boundary
      includes threat intelligence, threat hunting, security monitoring, incident analysis, and
      incident response. For this chapter, standalone endpoint licenses, SIEM software,
      vulnerability scanners, one-off consulting, and internal security payroll are excluded
      unless they are bundled into a managed detection-and-response engagement. They remain
      economically important substitutes because a buyer can retain an in-house SOC, use an MSSP
      primarily for alert forwarding, or assemble technology and incident-response retainers
      separately. eSentire's own positioning is broader than narrow endpoint monitoring: it
      describes multi-signal coverage across endpoint, network, logs, cloud, identity, and other
      telemetry, while a channel partner also presents continuous threat exposure management and
      digital forensics and incident response alongside MDR. Those adjacencies can enlarge wallet
      share, but counting their full categories inside core MDR would overstate the relevant
      market. The company-issued capability pages establish intended scope, not independent proof
      of product efficacy or market share.
    claimRefs: [CM007, CM016]
    tableRefs: [TM001]
  - id: "sizing-and-segmentation"
    title: "Sizing lenses and buyer segmentation"
    body: >-
      Two independent publishers converge on a small but fast-growing global category at the
      starting point while diverging on the forecast path. Precedence Research estimates
      $3.40 billion in 2025 and $3.92 billion in 2026, then projects $13.90 billion by 2035 at a
      15.12% CAGR for 2026-2035. The Business Research Company estimates $3.46 billion in 2025 and
      $4.16 billion in 2026, then projects $8.57 billion by 2030 at a 19.8% CAGR for 2026-2030.
      The resulting publisher ranges are $3.40-$3.46 billion for 2025 and $3.92-$4.16 billion for
      2026. These are global category estimates with different taxonomies and horizons, not
      additive values and not eSentire TAM/SAM/SOM. Precedence reports North America at 46% of
      2025 market value, SMEs as the largest enterprise-size segment, large enterprises as the
      fastest-growing size segment for 2026-2035, and BFSI as the leading vertical. That supports
      a dual buyer motion: resource-constrained mid-market organizations outsourcing SOC
      capability and larger regulated enterprises using MDR as a co-managed layer. Public
      evidence does not disclose eSentire win rates, serviceable accounts, budget ownership, or
      average contract value by segment, so no company-specific SAM or SOM is asserted.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006, CM008, CM009, CM010, CM011]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001]
  - id: "adoption-drivers-and-constraints"
    title: "Adoption drivers, friction, and valuation relevance"
    body: >-
      Demand is supported by cloud migration, increasing attack sophistication, compliance
      burdens, and the shortage of cybersecurity professionals. Precedence Research specifically
      identifies the skills shortage as an adoption driver, which is consistent with the
      outsource-versus-build decision implicit in MDR. Buyer evidence adds a useful timing lens:
      G2 displays a two-month average implementation period and a twelve-month average return on
      investment for eSentire, suggesting that adoption can fit an annual budgeting cycle, though
      these are platform aggregates rather than audited cohort statistics. The constraint is not
      merely price. G2's review summary and individual reviews identify false positives, noisy
      alerts, periodic tuning, and occasional missing alert detail. These frictions can increase
      customer workload and weaken the promised substitute for scarce internal labor. For
      valuation, category growth supports a favorable demand backdrop, but it should not be
      converted directly into eSentire revenue growth. Underwriting should instead require
      segment-level bookings, retention, gross margin, deployment time, and support burden.
      Company-authored differentiation claims and partner listings are relevant to positioning
      but are not independent market-share evidence. The principal gating diligence item is a
      bottom-up SAM/SOM bridge from eligible accounts, contract value, channel contribution, and
      observed win and retention rates.
    claimRefs: [CM012, CM013, CM014, CM015, CM016]
callouts:
  - calloutType: "insight"
    title: "Publisher convergence is useful but limited"
    body: >-
      The two independent estimates differ by only $0.06 billion for 2025, but their forecast
      windows and category taxonomies differ; the range is a directional category anchor rather
      than a precise valuation input.
    claimRefs: [CM001, CM003, CM005]
  - calloutType: "risk"
    title: "SAM and SOM remain unproven"
    body: >-
      No allocated public source provides eSentire-specific eligible-account counts, average
      contract value by segment, win rates, or retention-adjusted penetration, so a bottom-up
      serviceable market cannot be calculated without private operating data.
    claimRefs: [CM005, CM006]
