  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "market-size"
      missingEvidence: >-
        eSentire-specific eligible-account counts, average contract value by segment, geographic
        eligibility, channel contribution, win rates, and retention-adjusted penetration.
      whyItMatters: >-
        Global category forecasts cannot establish a defensible company-specific SAM or attainable
        SOM and should not be converted directly into revenue growth assumptions.
      diligencePath: >-
        Obtain management's bottom-up market model and reconcile it to CRM account counts,
        segment-level ACV, pipeline conversion, channel-sourced bookings, and cohort retention.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: "missing-source"
      severity: "material"
      topic: "buyer-segmentation"
      missingEvidence: >-
        Independent procurement evidence identifying the economic buyer, payer, budget owner,
        decision cycle, and switching process for each priority segment.
      whyItMatters: >-
        Buyer-role hypotheses cannot establish sales-cycle duration, budget durability, or the
        practical route from market demand to eSentire bookings.
      diligencePath: >-
        Review recent requests for proposal, lost-deal notes, channel pipeline records, and at
        least five independent customer procurement interviews by segment.
      relatedQuestionRefs: [QM004, QM005]
      relatedTableRefs: [TM003]
    - type: "conflicting-data"
      severity: "minor"
      topic: "market-size"
      missingEvidence: >-
        Transparent source methodologies that reconcile category inclusions, currency treatment,
        base-year estimates, and forecast assumptions across the two market publishers.
      whyItMatters: >-
        The estimates are directionally consistent at the base year but diverge in forecast rate
        and horizon, limiting the precision of any category-growth multiple.
      diligencePath: >-
        Obtain the full publisher methodologies or triangulate with public-company managed-security
        disclosures and government or industry spending datasets.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM002]
acknowledgedWarnings:
  - dimension: "figureType"
    reason: >-
      The allocated evidence does not support nested eSentire TAM, SAM, and SOM values, so a bar
      chart preserves separate publisher observations without implying unsupported market layers.
