      - ["Precedence Research", "2026", "Global", "$3.92B", null, "MDR market estimate", "Medium; forecast value"]
      - ["Precedence Research", "2035", "Global", "$13.90B", "15.12% (2026-2035)", "Long-range MDR forecast", "Low-to-medium; long horizon and opaque assumptions"]
      - ["The Business Research Company", "2025", "Global", "$3.46B", null, "Revenue from MDR services sold to end users", "Medium; taxonomy differs from other publishers"]
      - ["The Business Research Company", "2026", "Global", "$4.16B", "20.3% (2025-2026)", "MDR market forecast", "Medium; one-year forecast step"]
