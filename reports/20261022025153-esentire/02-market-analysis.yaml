      - ["Large enterprises; highest projected size-segment CAGR", "CISO or SOC leader (hypothesis)", "Internal SOC and incident-response teams", "Enterprise security budget; not publicly verified", "Co-managed, multi-signal layer across existing tools", "Integration complexity and switching costs"]
      - ["BFSI; leading 2025 vertical in Precedence", "CISO and cyber-risk leadership (hypothesis)", "Security operations and risk teams", "Security, risk, or compliance budget; not publicly verified", "Regulated continuous monitoring and rapid response", "Sensitive data and compliance burden"]
      - ["IT and telecom; projected fast-growing vertical", "CISO or network/security operations leader (hypothesis)", "Cloud, network, and SOC teams", "Technology/security budget; not publicly verified", "Cloud, endpoint, network, and identity coverage", "Expanding attack surface and telemetry volume"]
      - ["Channel-served mid-market organizations", "End-customer security leader with reseller influence", "Customer IT/security team", "End customer, potentially transacted through partner", "Partner-led selection and outsourced operating extension", "Trust, response ownership, and channel economics"]
    notes: >-
      Segment rankings come from Precedence Research and the channel route is evidenced by TD
      SYNNEX; buyer, payer, and workflow assignments are clearly labelled hypotheses because the
      allocated public sources do not disclose procurement authority or budget ownership.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM016]
