schemaVersion: "report-v2"
artifact: valuation
slug: esentire
runDate: 2026-10-22
company:
  name: eSentire
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a differentiated, multi-signal MDR proposition and a sizeable mid-market service opportunity, but it does not disclose a current equity valuation, ARR, retention, margin, cap table, or preference stack. The appropriate public-evidence stance is track/research-more until price and financing terms are verified.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      eSentire has a credible product-value thesis: its Atlas platform combines
      endpoint, network, cloud, identity, email, and SaaS signals with human
      review, while the company claims 24/7 response, 300+ integrations, and
      rapid containment. The commercial logic is strongest where buyers value
      managed expertise and broad coverage rather than a point tool. External
      pricing references also describe scope-based contracts, multi-year
      discounts, and material add-on and renewal levers, suggesting that
      contract design can materially affect customer lifetime value and
      valuation quality. A competitor-authored comparison identifies 13 named
      alternatives, reinforcing that the operating thesis must survive a broad
      substitute set rather than rely on category growth alone. The anti-thesis
      is equally important: public sources
      do not establish revenue growth, gross margin, NRR, free cash flow,
      valuation, debt, preference rights, or customer concentration. Independent
      pricing material describes a wide range of contract values and warns that
      platform lock-in, capped incident-response hours, professional services,
      and renewal escalators can change total cost. Without audited operating
      metrics and transaction terms, an investor cannot distinguish durable
      recurring growth from service intensity or determine whether the current
      price compensates for execution and liquidity risk.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV016]
    tableRefs: [TV002]
  - id: price-and-entry-discipline
    title: Price evidence and entry discipline
    body: >-
      The available evidence is useful for a diligence framework, not a
      mark-to-market valuation. Vendr reports anonymized transaction ranges,
      including $50,000–$150,000 annual contracts for smaller buyers,
      $150,000–$500,000 for mid-market packages, and more than $500,000 for
      some enterprise deployments; it also reports 10–25% lower annual pricing
      for multi-year commitments and 15–30% discounts in competitive
      evaluations. A separate independent pricing reference gives $80,000 to
      $250,000 for 500–2,000 endpoints and $300,000 to $500,000 for larger
      deployments, while explicitly calling the figures indicative. These are
      contract-spend signals, not eSentire revenue or ARR and not comparable
      company valuation multiples. Entry should therefore be conditional:
      require a current financing or secondary price, fully diluted
      capitalization, preference and debt terms, audited or diligence-grade
      ARR and revenue bridge, gross margin, NRR/GRR, logo and dollar retention,
      cohort data, and customer concentration before underwriting a multiple.
      The absence of a public mark is a material uncertainty rather than
      evidence that the company is cheap.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and thesis breaks
    body: >-
      A scenario framework should use operating drivers that management can
      substantiate: net retention, new-logo growth, gross margin, incident
      response utilization, sales efficiency, renewal escalators, customer
      concentration, and the share of revenue associated with Atlas versus
      services and add-ons. The bull case requires evidence that the platform
      converts its broad integrations and threat-response claims into durable
      recurring expansion with improving margins and low churn. The base case
      assumes continued demand for outsourced MDR but applies a moderate
      multiple until private-company financials and the capital structure are
      verified. The bear case reflects lower growth, multiple compression,
      platform or response-scope friction, renewal pressure, and a financing
      or exit process that transfers value to preferred holders or creditors.
      A decision should move toward invest only after independent validation of
      price and terms; otherwise track or research-more is the disciplined
      outcome. Thesis-break triggers include NRR below the underwriting floor,
      material customer or channel concentration, failed response SLAs,
      persistent gross-margin deterioration, a down round, or an exit price
      below the preference-adjusted return threshold. The newly fetched Evercore
      page confirms only the firm's generic U.S. investment-banking business;
      it does not provide eSentire-specific transaction, valuation, or timing
      evidence, so any advisor or sale-process claim remains a diligence item.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
callouts:
  - calloutType: recommendation
    title: Public-evidence decision
    body: Track / research-more. Do not underwrite a buy or a precise valuation until price, capitalization, preference, audited KPI, and retention evidence are supplied.
    claimRefs: [CV010, CV014]
  - calloutType: risk
    title: Principal valuation risk
    body: The central risk is not a demonstrated product deficit; it is the inability to connect public service and pricing claims to an investable equity price, durable recurring revenue, and preference-adjusted returns.
    claimRefs: [CV009, CV010, CV014]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence boundary, Decision implication]
    rows:
      - [Recommendation, track / research-more, "No current equity price or audited KPI set in assigned public evidence", "Advance only after private-data diligence"]
      - [Confidence, medium-low, "Product and contract-price signals are available; financial and capital-structure evidence is not", "Use conditional milestones, not a firm target price"]
      - [Risk rating, high, "Preference, debt, retention, concentration, and margin are unverified", "Require downside protections and thesis-break triggers"]
      - [Valuation stance, unknown, "No defensible current valuation or comparable multiple can be calculated", "Do not label attractive, fair, or stretched"]
    notes: >-
      This is an analyst assessment based on assigned public evidence. Contract
      values are not company ARR, revenue, cash flow, or equity valuation.
    claimRefs: [CV006, CV009, CV010, CV014]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Broad managed-security value proposition", "Atlas connects endpoint, network, cloud, identity, email, and SaaS signals; company reports 24/7 human review", "Independent customer retention and expansion data"]
      - ["Commercial demand can support meaningful contracts", "Vendr reports $50,000–$150,000 smaller-buyer ACVs, $150,000–$500,000 mid-market ACVs, and $500,000+ enterprise ACVs", "Signed-contract cohort and ARR reconciliation"]
      - ["Pricing power is not proven", "Vendr reports 10–25% multi-year savings and 15–30% competitive discounts", "Renewal uplift, realized price, and gross-retention analysis"]
      - ["Platform economics may carry lock-in and scope risk", "Independent pricing sources flag Atlas access/data transition, tier differences, IR caps, and add-ons", "Contract terms, export rights, service utilization, and margin bridge"]
      - ["Competitive differentiation is plausible but issuer-led", "eSentire claims 300+ integrations and under-15-minute containment; UnderDefense identifies 13 named alternatives", "Independent benchmark or customer references using comparable definitions"]
    notes: >-
      Company pages and competitor comparisons are issuer claims, not
      independent benchmarks. Independent pricing references are indicative and
      should be verified against contracts.
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV009, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "NRR and gross margin are strong; Atlas expands within accounts; growth is durable; price and preference terms are investor-friendly", "No numeric range is supportable until audited KPIs and normalized comparable evidence establish a defensible multiple", "AI efficacy, response liability, competitive bundling, execution", "Low until private evidence confirms"]
      - [Base, "MDR demand persists; growth is moderate; contract values convert to recurring revenue with normal services mix", "No numeric range is supportable; require verified price, a normalized comp set, a liquidity discount, and downside protection", "Unknown NRR, margin, concentration, debt, and exit timing", "Base underwriting case, not a target price"]
      - [Bear, "Growth slows; discounts and renewal pressure rise; services or IR intensity dilute margins; valuation compresses", "Do not invest unless entry price provides a verified downside margin after preferences and debt", "Down round, customer loss, platform lock-in, response-scope disputes", "Material and currently unresolved"]
      - [Exit-constrained, "Sale or recap takes longer than planned and preferred capital has senior claims", "Model time-to-exit, preference waterfall, dilution, and sponsor return hurdles before common-equity value", "Liquidity, financing availability, governance", "Must be tested with cap table"]
      - [Evidence-failure, "Management cannot provide reliable price, KPI, cohort, or capitalization evidence", "No valuation conclusion; retain a research-more decision", "Information asymmetry and adverse selection", "High as a diligence outcome"]
    notes: >-
      These are conditional underwriting scenarios, not forecasts. No assigned
      source supplies a current eSentire valuation, ARR, revenue growth,
      margin, NRR, debt, or preference stack; numeric price ranges are therefore
      intentionally omitted.
    claimRefs: [CV006, CV007, CV009, CV010, CV011, CV012, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Broad MDR value and indicative contract economics lead to a conditional track/research-more decision because price, financial quality, and capital structure remain unverified.
    data:
      nodes:
        - id: scale
          label: "MDR demand and broad signal coverage"
          detail: "Company describes Atlas coverage across endpoint, network, cloud, identity, email, and SaaS."
        - id: product
          label: "Product differentiation"
          detail: "Human-reviewed controlled autonomy and rapid response are company-reported."
        - id: contracts
          label: "Indicative contract economics"
          detail: "Vendr and independent pricing sources provide broad ACV and scope ranges."
        - id: missing
          label: "Missing investor-grade metrics"
          detail: "Valuation, ARR, NRR, margin, concentration, debt, and preferences are not public in the assigned evidence."
        - id: discipline
          label: "Entry discipline"
          detail: "Require cap table, price, audited KPIs, cohorts, and normalized comps."
        - id: recommendation
          label: "Track / research-more"
          detail: "No precise valuation or buy recommendation until the evidence gap closes."
      edges:
        - from: scale
          to: product
        - from: product
          to: contracts
        - from: contracts
          to: missing
        - from: missing
          to: discipline
        - from: discipline
          to: recommendation
    claimRefs: [CV001, CV006, CV010, CV014]
