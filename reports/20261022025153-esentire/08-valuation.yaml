  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation
      missingEvidence: Current equity valuation, latest financing or secondary transaction price, fully diluted capitalization, preference stack, debt schedule, and sponsor exit economics.
      whyItMatters: Without price and seniority terms, public operating evidence cannot be converted into an investor return or dilution analysis.
      diligencePath: Obtain the latest cap table, financing documents, debt agreements, liquidation preferences, option pool, board-approved valuation materials, and any current advisor mandate or transaction-process materials under NDA.
      relatedQuestionRefs: [QV002, QV006]
    - type: private-evidence-only
      severity: material
      topic: financial-performance
      missingEvidence: Audited revenue and ARR bridge, growth, gross margin, NRR/GRR, cohort retention, burn, runway, and customer concentration.
      whyItMatters: Contract-price references do not establish company revenue quality, profitability, or the multiple that recurring revenue can support.
      diligencePath: Request monthly KPI packs, cohort schedules, customer-level ARR concentration, bookings and pipeline conversion, and audited financial statements.
      relatedQuestionRefs: [QV001, QV003, QV004]
    - type: missing-source
      severity: material
      topic: comparables
      missingEvidence: Current comparable-company and transaction set with normalized growth, margin, ARR/revenue definitions, and applicable control or liquidity discounts.
      whyItMatters: Public product comparisons and pricing guides are not sufficient to select an equity multiple or exit benchmark.
      diligencePath: Build a dated comp set from public MDR/security companies and verified private transactions, then normalize business mix and accounting definitions.
      relatedQuestionRefs: [QV005]
    - type: conflicting-data
      severity: material
      topic: commercial-economics
      missingEvidence: Contract-level separation of recurring MDR, professional services, incident-response hours, add-ons, and renewal escalators.
      whyItMatters: Different external pricing references describe materially different scopes and ranges, so blended contract value could misstate recurring economics.
      diligencePath: Sample signed contracts and renewal cohorts by tier, geography, endpoint count, and service scope; reconcile bookings to recognized revenue.
      relatedQuestionRefs: [QV007, QV008]
