  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product-assurance
      missingEvidence: >-
        Independent uptime, containment-distribution, false-positive, and AI-operatives quality measurements by customer
        cohort and signal type.
      whyItMatters: >-
        Product differentiation depends on operational outcomes, but public company claims do not establish
        distribution, denominator, or repeatability.
      diligencePath: >-
        Request recent third-party assurance reports, anonymized KPI distributions, service-credit history, and customer
        references with permission to verify production outcomes.
      relatedQuestionRefs:
        - QE004
        - QE005
        - QE009
    - type: private-evidence-only
      severity: material
      topic: portability
      missingEvidence: >-
        Contractual data-retention, export, deletion, and post-termination access terms for Atlas investigations and
        customer telemetry.
      whyItMatters: >-
        A proprietary operating platform can create switching cost and continuity risk even when BYOL integrations are
        broad.
      diligencePath: >-
        Review the MSA, DPA, security schedule, termination-assistance clause, and a sample machine-readable
        case-history export.
      relatedQuestionRefs:
        - QE007
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: >-
        Current certifications, penetration-test scope, independent controls reports, and product security disclosure
        for Atlas and integrations.
      whyItMatters: >-
        eSentire receives privileged telemetry and may execute containment actions, so trust and authorization
        boundaries are core product risks.
      diligencePath: >-
        Request current SOC 2/ISO evidence where applicable, pen-test executive summary, vulnerability-disclosure
        policy, and privileged-access controls.
      relatedQuestionRefs:
        - QE007
        - QE009
    - type: stale
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        A product-linked public engineering changelog, release cadence, or repository attribution that connects the
        developer surface to Atlas.
      whyItMatters: >-
