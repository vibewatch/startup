company:
  name: eSentire
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    eSentire delivers managed detection and response through the Atlas platform, multi-signal integrations, and 24/7
    human security operations. Public materials support a differentiated operating model and rapid-response claims, but
    independent evidence on production reliability, security controls, and AI performance remains limited.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: >-
      eSentire sells a managed security service rather than a standalone endpoint product. Its public materials describe
      Atlas as an AI and XDR platform that collects signals across endpoint, network, log, cloud, identity,
      vulnerability, browser, and SaaS surfaces, while analysts and threat hunters investigate and contain incidents.
      The customer workflow is therefore an operating loop: connect existing tools, ingest telemetry, detect and
      investigate, take approved response actions, and report on risk reduction. The data sheet says the service
      includes 24/7 monitoring, live SOC analyst support, threat hunting, threat disruption, containment, a named Cyber
      Risk Advisor, and an Insight Portal. These are company claims, not independently audited service-level results.
      The published onboarding claim is 14 days on average, and the comparison page says the service can use customer
      investments through BYOL/BYOS. That reduces rip-and-replace friction but shifts diligence toward integration
      depth, permissions, data retention, and the exact response actions permitted in each contract tier. Public
      materials do not disclose a complete customer implementation runbook, the denominator behind the onboarding
      average, or the proportion of customers using each signal type.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001
      - TE002
  - id: architecture-and-maturity
    title: Architecture, modules, and maturity
    body: >-
      The most supportable architecture is a layered service model. At the input layer, Atlas connects to more than 300
      technology integrations and can ingest endpoint, network, log, cloud, identity, vulnerability, browser, and SaaS
      signals according to eSentire's comparison and product pages. At the analytics layer, the company describes an
      intelligence graph, machine-learning and behavioral detections, MITRE ATT&CK mapping, and detections built from
      threat research. At the action layer, public examples include host isolation, hash blocking, account suspension,
      email purges, system reboots, and other containment or remediation actions. The human layer includes SOC analysts,
      elite threat hunters, a Threat Response Unit, and Cyber Risk Advisors. A GitHub organization provides a
      developer-signal proxy, but its visible repositories are mixed in age and activity: the page shows 33
      repositories, including repositories updated in 2026 alongside older and archived projects. This is evidence of a
      public engineering surface, not proof that the repositories power the commercial Atlas product. The public record
      also does not establish independent benchmarks for AI error rates, false positives, or production availability.
      The principal maturity evidence is operational breadth and named process components, while technical internals and
      assurance evidence remain private.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: differentiation-and-controls
    title: Differentiation, trust, and technical risks
    body: >-
      eSentire's defensible product proposition is the combination of vendor-agnostic multi-signal coverage, active
      response, and a feedback loop from threat hunting into detections. The data sheet attributes five machine-learning
      patents to threat detection and data transfer, while the site describes adding 200 new threat protections daily
      and 200 IOCs/IPs per day from global SOC investigations. Those metrics are company-reported and lack a public
      denominator, test protocol, or independent replication. The company also presents Atlas AI as controlled autonomy
      with human review, which is a governance design choice rather than proof of model quality. External pages add
      useful implementation caveats. An independent MDR review describes five of six attack surfaces in its base-price
      characterization, says APAC coverage relies partly on regional analysts and a partner, and notes that a public
      15-minute mean time to contain is not the same as a contractual SLA. An independent cost reference describes Atlas
      lock-in and loss of historical investigation-data access after termination. These claims require contract and
      architecture verification, but they identify concrete diligence questions: portability, service credits, regional
      coverage, action authority, data export, retention, and the evidence behind AI and containment metrics.
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE013
      - CE014
  - id: product-verdict
    title: Product verdict and diligence priorities
    body: >-
      The product is credible as a managed security operating model with broad integration ambition and explicit human
      accountability. Its strongest evidence is the consistency of the Atlas, multi-signal, 24/7 SOC, and
      active-response description across several company surfaces, plus customer quotations describing ingestion,
      responsiveness, and use as an extension of internal teams. The principal underwriting risk is not whether eSentire
      has a product description; it is whether the public claims translate into measurable, portable, and contractually
      enforceable outcomes across customers and environments. Before relying on the product as a durable differentiator,
      diligence should obtain the integration and response matrix by tier, independent uptime and containment
      distributions, AI-operatives error and escalation metrics, security certifications and current assurance reports,
      data-retention and export terms, regional SOC coverage, and named production references. Public developer activity
      supports an engineering signal but does not close those gaps. On current evidence, Atlas is a plausible operating
      advantage with material verification needs rather than a fully proven technical moat.
    claimRefs:
      - CE002
      - CE008
      - CE012
      - CE013
      - CE014
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or asset
      - User or buyer
      - Public maturity/status
      - Differentiation
      - Diligence gap
    rows:
      - - Atlas AI and XDR platform
        - Security and IT teams
        - Commercial platform described on current product surfaces
        - Correlates multi-signal telemetry and supports controlled autonomy
        - Independent model-quality, uptime, and customer adoption data
      - - 24/7 SOC and threat hunting
        - Organizations without a full in-house SOC
        - Commercial managed service
        - Human investigation and response alongside automation
        - Analyst capacity, staffing by region, and response distribution
      - - Integrations and BYOL/BYOS
        - Customers with existing security stack
        - 300+ integrations claimed; partner coverage varies
        - Avoids full rip-and-replace and broadens signal coverage
        - Supported-version matrix, depth of actions, and implementation effort
      - - Threat Response Unit and threat intelligence
        - Security leaders and operators
        - Ongoing research and detection-content function described
        - Feeds original research and detections into operations
        - Attribution of detections to outcomes and reproducibility
      - - Insight Portal and reporting
        - Security operations and executives
        - Customer-facing portal and reporting described
        - Investigation timelines, visualizations, and business reviews
        - Self-service query depth, export format, and retention after termination
    notes: >-
      Company and third-party descriptions are qualitative; “300+” and other counts are not independently audited.
      Maturity means publicly described commercial availability, not independent validation.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE009
      - CE013
  - id: TE002
    title: Workflow and use-case table
    columns:
      - User job
      - Current workflow
      - eSentire solution
      - Measurable benefit or claim
      - Limitation
    rows:
      - - Monitor a distributed attack surface
        - Teams operate endpoint, network, cloud, identity, and log tools
        - Atlas ingests and correlates multi-signal data
        - Complete-visibility and integration claims
        - Signal coverage and telemetry quality vary by deployment
      - - Investigate suspicious activity
        - Analysts triage alerts and threat intelligence
        - AI detections plus human-led investigation and hunting
        - Faster investigation and lower alert burden claimed
        - No independent false-positive or precision benchmark
      - - Contain an active threat
        - Customer approves or performs isolation and remediation actions
        - Host isolation, account suspension, blocking, purges, and other actions
        - 15-minute mean time to contain claimed
        - Metric denominator and contractual SLA are not public
      - - Operate without a 24/7 internal SOC
        - Recruit, staff, and retain specialized analysts
        - 24/7 SOC analyst, threat hunter, and advisor coverage
        - Access to managed expertise and continuous monitoring
        - Regional staffing, handoffs, and capacity require verification
      - - Improve security posture over time
        - Review incidents and tune controls
        - Threat research, new detections, runbooks, and business reviews
        - 200 new protections daily claimed
        - No public method or independent outcome evidence
    notes: >-
      Benefits are stated as company claims unless explicitly marked as an external observation; no row establishes a
      guaranteed customer outcome.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE006
      - CE010
      - CE011
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role
      - Dependency
      - Risk or diligence question
    rows:
      - - Signal and integration layer
        - Ingest endpoint, network, log, cloud, identity, vulnerability, browser, and SaaS signals
        - Customer tools, permissions, APIs, and supported versions
        - What telemetry is unavailable or degraded in a BYOL deployment?
      - - Atlas intelligence and detection layer
        - Correlate signals and apply signatures, IOCs, behavioral analytics, and ML
        - Training data, detection engineering, and current threat research
        - What are precision, recall, drift, and human-escalation rates?
      - - Human operations layer
        - SOC analysts investigate, hunt, validate, and advise
        - Staffing, regional coverage, playbooks, and analyst retention
        - How do queues, handoffs, and regional gaps affect response?
      - - Response and remediation layer
        - Execute approved containment and disruption actions
        - Customer authority, integrations, and playbook permissions
        - Which actions are included by tier and what is the service-credit remedy?
      - - Customer portal and governance layer
        - Provide timelines, reporting, reviews, and recommendations
        - Portal availability, data retention, and export controls
        - Can customers export complete case history at termination?
    notes: >-
      Architecture is synthesized from public product descriptions and is not a disclosed internal system diagram;
      dependencies and risks are diligence questions, not confirmed defects.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE013
      - CE014
