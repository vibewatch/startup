          tone: neutral
          claimRefs: [CM007, CM015]
        - label: Agentic AI wedge
          displayValue: USD 0.85B
          unit: 2025 market size
          note: Fast-growing niche inside predictive maintenance, not the full bundled market.
          tone: opportunity
          claimRefs: [CM008, CM015]
    approximationNotes: >
      Ordered from broad contextual layers toward narrower workflow wedges; layers are not additive
      and do not represent a mathematically nested TAM/SAM/SOM bridge.
    claimRefs: [CM005, CM006, CM007, CM008, CM013, CM014, CM015]
