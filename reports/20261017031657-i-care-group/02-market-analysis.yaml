    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - MarketsandMarkets
        - "2026-2031"
        - Global
        - USD 13.89B in 2026 to USD 23.79B in 2031
        - 11.4%
        - Predictive maintenance market forecast
        - Medium
        - Best direct category lens, but still broader than I-care's disclosed commercial slice
      - - MarketsandMarkets
        - "2026-2032"
        - Global
        - USD 2.40B in 2026 to USD 4.32B in 2032
        - 10.3%
        - Asset performance management market forecast
        - Medium
        - Adjacent workflow market, not interchangeable with predictive maintenance
      - - MarketsandMarkets
        - "2026-2032"
        - Global
        - USD 1.54B in 2026 to USD 2.67B in 2032
        - 9.6%
        - CMMS market forecast
        - Medium
        - Execution-system adjacency; excludes much of I-care's sensing and services layer
      - - MarketsandMarkets
        - "2025-2032"
        - Global
        - USD 0.85B in 2025 to USD 6.87B in 2032
        - 35.4%
        - Agentic AI in predictive maintenance market forecast
        - Medium
        - Niche wedge inside the broader category, not a full TAM
    notes: >
      These lenses use different market boundaries and should not be summed into one TAM; they are
      comparative denominators only.
    claimRefs: [CM005, CM006, CM007, CM008, CM013, CM015]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Multi-site industrial manufacturers
        - Plant leadership seeking reliability gains
        - Reliability engineers and maintenance teams
        - Plant or operations budget
        - Monitor critical machines, predict failures, schedule interventions
        - Plant manager or operations sponsor
        - Need to improve uptime, productivity, and sustainability across fleets
      - - Asset-intensive operators wanting partner delivery
        - Operations leaders choosing between point tools and bundled partners
        - Local engineering and field teams
        - Reliability transformation or maintenance-improvement budget
        - Combine sensors, analytics, and expert support in one program
        - Reliability or operations executive
        - Shortage of internal skills plus need for long-term support
      - - Existing maintenance organizations using execution systems
        - Maintenance management teams
        - Planners and technicians consuming alerts
        - Maintenance systems budget
        - Feed predictive outputs into maintenance planning systems
        - Head of maintenance or asset management
        - Need to connect PdM insights to work-order execution
      - - Buyers evaluating subscription deployment
        - Sponsors preferring opex-style rollout over piecemeal capex
        - Site teams operating the installed base
        - Program owner funding bundled service
        - Deploy Wi-care as a Service with hardware, software, and services
        - Program sponsor with cross-functional mandate
        - Faster scale-up with one vendor and local support capacity
    notes: >
      Budget-owner assignments are inferred from public buyer and workflow descriptions; no source
      in the pool discloses I-care's exact buyer-by-buyer procurement path.
    claimRefs: [CM003, CM004, CM009, CM010, CM011, CM012]
