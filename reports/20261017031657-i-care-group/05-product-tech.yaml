    title: "Product module / asset matrix"
    columns:
      - "Module / asset / product line"
      - "Buyer / user"
      - "Status / maturity"
      - "Differentiation"
      - "Diligence gap"
    rows:
      - ["Wi-care sensors", "Reliability teams / maintenance engineers", "Commercial; third-party profile and current company materials both surface it", "Proprietary sensor layer tied to in-house production scale", "No public spec sheet, certification pack, or battery / networking detail in retained evidence"]
      - ["I-see analytics platform", "Reliability analysts / planners", "Commercial; current platform claims backed by company and independent summaries", "AI-based failure prediction plus workflow handoff into planning systems", "No public API, protocol, or model-governance detail in retained evidence"]
      - ["Predictive Maintenance as a Service", "Plant manager / asset owner", "Commercial subscription offer", "Bundles sensors, software, and expert services into one contract", "No public realized pricing, SLA, or module attach-rate disclosure"]
      - ["Reliability engineering and training", "Plant reliability organizations", "Publicly surfaced service layer", "Extends the offer beyond software into operating change and workforce enablement", "No public split between service labor and platform revenue"]
      - ["Industry 4.0 sensor manufacturing facility", "Internal operations / rollout teams", "Scaling asset in operation", "Supports faster hardware rollout with announced capacity up to 2,000 sensors per day", "No public yield, utilization, or supply-chain concentration data"]
    notes: "Rows synthesize currently surfaced modules/assets from retained public evidence; null-like phrasing marks undisclosed details rather than absence of capability."
    claimRefs: ["CE001", "CE002", "CE003", "CE007", "CE008"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow"
      - "Company solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Detect emerging machine failure", "Periodic inspections and reactive maintenance", "Continuous sensing plus I-see failure prediction", "Higher asset uptime and lower unplanned downtime are the stated outcomes", "No public false-positive, lead-time, or accuracy data"]
      - ["Scale predictive maintenance across many assets", "Discrete capex projects and fragmented tools", "Subscription bundle aligns sensing, software, and expert support", "Better financial predictability and easier technology upgrades are explicit value props", "No public payback, contract-length, or realized budget data"]
      - ["Push condition data into maintenance planning", "Siloed machine-health information", "I-see integrates with external systems and supplies planning data", "Bridges monitoring to execution workflow", "No public list of supported systems, connectors, or integration methods"]
      - ["Ramp deployments without hardware bottlenecks", "Rollout pace constrained by sensor supply", "Internal production unit with announced 2,000-sensor/day capacity", "Supports faster installation scaling if demand converts", "No public evidence on actual throughput utilization or backlog conversion by product line"]
    notes: "Benefits are source-stated outcomes, not independently audited customer ROI; limitations mark where retained evidence does not quantify delivery quality."
    claimRefs: ["CE002", "CE003", "CE005", "CE006"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Sensor layer", "Capture machine-health data continuously at the asset edge", "Wi-care hardware availability and installation footprint", "Public evidence does not disclose technical specifications or certification depth"]
      - ["Analytics layer", "Aggregate signals and generate predictive insights in I-see", "Model performance plus data quality from connected assets", "No public model-quality, governance, or false-positive documentation"]
      - ["Workflow integration layer", "Pass operational data into maintenance-planning systems", "External-system compatibility and connector maintenance", "No public API/protocol detail despite workflow claims"]
      - ["Service delivery layer", "Wrap hardware and software with expert implementation and support", "Field-service capacity and customer-change management", "No public service-level metrics or implementation-time benchmarks"]
      - ["Manufacturing / supply layer", "Produce and ship new-generation sensors at volume", "Facility throughput and component supply", "No public yield, sourcing, or redundancy disclosure"]
    notes: "This architecture table reflects only directly supported layers/processes from retained evidence and flags missing public implementation detail as risk."
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE012"]
