callouts:
  - calloutType: "insight"
    title: "Integrated bundle is the core product story"
    body: "The strongest direct evidence is not a standalone software feature list; it is a bundled operating model that ties proprietary sensing, I-see analytics, and expert delivery into one subscription narrative."
    claimRefs: ["CE001", "CE002", "CE007", "CE008"]
