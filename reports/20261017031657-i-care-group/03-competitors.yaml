  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: Signed price cards, proposal examples, or contract exhibits showing unit economics, discounting, and service bundling by deployment size.
      whyItMatters: Public sources describe packaging classes but not comparable TCO, which limits conviction on whether I-care wins on ROI or simply on broader scope.
      diligencePath: Request three recent customer proposals or executed order forms across SMB, mid-market, and enterprise deployments.
      relatedQuestionRefs: [QP006]
      relatedTableRefs: [TP003]
    - type: conflicting-data
      severity: material
      topic: financial-durability
      missingEvidence: Audited FY2024-FY2025 revenue bridge, order-book definition, and segment split that reconciles Belga's revenue/loss disclosure with later scale claims.
      whyItMatters: Competitive durability depends on whether I-care can fund service-heavy differentiation without overstating like-for-like scale versus incumbents.
      diligencePath: Obtain audited financial statements plus a management bridge from booked orders to recognized revenue and recurring subscription mix.
      relatedQuestionRefs: [QP008]
    - type: private-evidence-only
      severity: material
      topic: win-loss-data
      missingEvidence: Named competitor overlap, win/loss records, and customer switching narratives versus SAP, Rockwell/Fiix, Siemens-affiliated offerings, and CMMS-led substitutes.
      whyItMatters: Public product descriptions do not prove where I-care actually wins or loses, so moat durability cannot be underwritten from catalog evidence alone.
      diligencePath: Request the last 12 months of CRM-coded competitive deals and 5-10 anonymized loss reviews by segment.
      relatedQuestionRefs: [QP003, QP004]
