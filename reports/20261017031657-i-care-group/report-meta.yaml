companyProfile:
  summary: >
    I-care Group is a Mons-based industrial predictive-maintenance platform founded in 2004 that combines proprietary
    Wi-care sensors, the I-see analytics stack, and on-site reliability services into a bundled offering for
    asset-intensive operators. The current public evidence points to a global installed base, more than 1,000 employees,
    and a commercial footprint spanning 55+ countries, but it still leaves key diligence gaps around revenue mix,
    audited margins, and independent price discovery.
