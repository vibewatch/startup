        label: 商业可及性与软件主导的易用性（评分 1-5）
        min: 1
        max: 5
      points:
        - label: I-care
          x: 5
          'y': 2
          note: 传感器、AI 分析、现场工程师和订阅方案共同构成深度，但也意味着更重的销售与部署流程。
        - label: Fiix
          x: 2
          'y': 4
          note: CMMS / 工单功能完备，在中端市场有渗透率，且以软件为主导、易于接入。
        - label: Limble
          x: 1
          'y': 5
          note: 在保留的 G2 证据中易用性信号最高，但已有证据覆盖范围比 I-care 的完整可靠性体系更窄。
        - label: eMaint
          x: 2
          'y': 3
          note: 可定制的 CMMS，覆盖广泛的维护工作流，但复杂度和移动端投诉削弱了评价。
        - label: Brightly Asset Essentials
          x: 2
