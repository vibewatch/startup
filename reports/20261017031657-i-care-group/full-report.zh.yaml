        title: 单位经济分析因利润率、定价和现金跑道披露缺失而受阻
        blocks:
          - type: paragraph
            body: >-
              最大的投资判断约束不是缺少业务活动，而是缺少足以决策的财务细节。Companyweb 的控股公司页面显示，2024 年债务为 EUR17.1 million、权益为 EUR69.2
              million，控股公司营业额规模较小且只有 3.8
              名全职员工；这有助于理解法律实体，但不能替代集团现金消耗或合并毛利率。公开简介还宣传定价资源，却没有公开实际费率表；行业来源则确认预测性维护支出背景良好，买方决策与资产对利润的关键性相关。这足以描绘商业模式，却不足以估算实际
              ASP、硬件毛利率、服务利用率、获客经济性、CAC 回收期或现金跑道。因此，财务结论对需求和产品广度持正面判断，但在管理层披露结构、利润率和融资需求前仍属有条件结论。
