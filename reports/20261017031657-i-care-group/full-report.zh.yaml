      - number: '2.2'
        title: 市场规模视角显示核心市场很大，但没有干净的 SAM/SOM
        blocks:
          - type: paragraph
            body: >
              最有力的公开市场规模证据来自相邻且重叠的品类，而不是一个完全贴合 I-care 的分母。MarketsandMarkets 给出的预测性维护市场规模为 USD 13.89 billion in 2026，2031
              年增至 USD 23.79 billion；同一出版方另给出资产绩效管理市场规模 USD 2.40 billion in 2026、CMMS 市场规模 USD 1.54 billion in 2026，以及代理型
              AI 预测性维护细分市场 USD 0.85 billion in 2025。这些数字可以作为观察窗口，但不能相加，也不能视为干净的 TAM/SAM/SOM
              层级，因为每个数字对应的产品、工作流和部署边界不同。结论是增长背景可信，但对 I-care 这种硬件—软件—服务组合的估值精度有限。
