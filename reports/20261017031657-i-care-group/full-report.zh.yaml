      - number: '3.4'
        title: 护城河可信，但耐久性仍取决于公司叙事之外的证据
        blocks:
          - type: paragraph
            body: >-
              证据支持 I-care
              的真实战略位置：它不是试点阶段的分析工具，而是拥有全球交付能力、自有传感技术和订阅加服务模式的规模化供应商。不过，影响护城河耐久性的三个方面仍缺乏完整公开基准。第一，软件型竞争者可能在更看重易用性和部署速度的低复杂度交易中实现商品化。第二，拥有装机基础的在位者可以把可靠性服务捆进更大的自动化关系。第三，I-care
              自身的规模披露虽方向性强，却无法在不同来源间完全比较，削弱了相对于上市在位者的清晰基准。总体而言，公司在复杂、重服务的市场端具备可信护城河，但还没有证据证明其长期不受捆绑销售或软件商品化影响。
