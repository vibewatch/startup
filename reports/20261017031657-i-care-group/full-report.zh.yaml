      - number: '2.3'
        title: 买方、用户和预算归属都偏向资产密集型运营商
        blocks:
          - type: paragraph
            body: >
              现有买方证据指向拥有正常运行时间、安全和生产率结果的资产密集型制造商及其他工业运营商。Plant Engineering 的 2026
              年运营与维护研究称，制造商正从依赖内部技能的做法转向加大技术投入、深化供应商合作；I-care 2026 年 7
              月美国公告进一步说明，客户越来越希望由一家合作伙伴同时提供技术、工程和长期支持。日常用户很可能是可靠性或维护团队，预算决策权则可能在工厂领导层或运营负责人手中；他们能够为完整的可靠性项目辩护，而非只采购孤立工具。I-care
              扩大本地团队也意味着采用仍取决于现场覆盖和服务能力。
