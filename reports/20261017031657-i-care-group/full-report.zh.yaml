      - number: '2.4'
        title: 采用驱动因素清晰，主要约束是分母含混
        blocks:
          - type: paragraph
            body: >
              各来源对需求侧驱动的判断一致：工业运营商正增加可靠性技术、AI 辅助维护工作流和供应商合作投入，以减轻内部团队负担。I-care
              的订阅打包和传感器高吞吐量（公司自称）支持面向全车队部署而非一次性试点的规模化叙事。制约因素是分析层面的，而非生存层面的：公开来源没有披露 I-care 的可服务机会中有多少属于经常性软件、捆绑式
              WaaS、工程服务或相邻 APM/CMMS 支出。这使市场叙事保持积极，但也要求尽调把 SAM/SOM、预算归属和 ROI 转化视为待推进事项，而非既定事实。
