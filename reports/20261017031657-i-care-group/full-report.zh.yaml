            title: 已经缓释下行风险的因素
            body: 创始人持股、可见的参考股东和具名合规职能都是真实的缓释信号，但不能替代经审计的经济数据、董事会流程证据或客户运营指标。
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              保留证据支持“跟踪”而非立即投资的建议。I-care 确实有有意义的运营证明：多份保留来源显示，在 2025 年 12 月独角兽公告前后，年收入超过 €100 million / $110
              million，订单储备超过 €200 million / $220 million，员工数超过 1,000 人。但当前 headline
              估值来自仅向现有股东和员工开放的融资轮，而不是新披露的外部领投方，或公开文件中独立资本实际支付价格的证据。因此，当前估值可以作为参考点，却还不足以证明外部投资者无需折价或更强尽调证据，就应按同一入场价做投资判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 估值背景与可比锚点
        blocks:
          - type: paragraph
            body: >-
              估值背景方向上偏正面，但仍不完整。Brussels Times 和 EU-Startups 都把 2025 年 12 月里程碑描述为独角兽事件；Silicon Valley Investclub 列出 $1.16
              billion 估值和约 $95 million 总融资，却也称所有轮次均未披露 EV/Rev 和阶段。这一缺失很重要，因为指定资料池中最好的公开可比公司 Augury 同时展示了此前 $180 million
              Series E 独角兽阶段和 2025 年新一轮 $75 million Series F，说明工业 AI 龙头在后期仍能吸引大额外部资本。MarketsandMarkets 和 Plant
              Engineering 提供品类支持，却解决不了 I-care 特有的定价不透明；市场增长只是背景，不能替代透明的变现和融资条款。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              严谨的情景判断应保持相对性，不要制造虚假的精确度。只有在计划中的外部投资阶段确实以有利条款落地，且经审计结果确认近期增长转化成持久的订阅或类软件经济性，而不只是项目或硬件吞吐量时，乐观情景才可以守住或略超
              2025 年 12 月独角兽估值。基准情景是在外部资金、经审计 FY2025 结果和更清晰的收入结构披露弥合信息缺口前，让 I-care 维持在该估值附近或略低。若推迟的 IPO
              再度延后、外部融资未能落地，或新条款意味着稀释、清算优先权或估值重置，而现有公开证据没有揭示这些内容，悲观情景就变得合理。
            claimRefs:
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出准备度尚未被证伪，但也没有得到独立验证。公司拥有规模叙事、大额订单储备、推迟的 IPO 计划，以及持续受数字化维护利好的市场，这足以让 I-care
              留在观察名单上。仍然缺的是外部投资者通常需要的证据，用来从“可信独角兽”走到“当前价格有吸引力”：经审计 FY2025 财务数据，硬件、服务和 WaaS/软件的收入结构，计划中的 2026
              年外部融资实际条款，以及影响下行保护的任何优先权或债务特征。打破投资论点的条件很直接：外部融资再次延迟、出现下轮融资或高度结构化融资，或经审计结果无法支撑当前估值叙事。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV012
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 在外部价格发现出现前保持跟踪
            body: I-care 的规模和品类顺风足以让它原则上保持可投资性，但在对 2025 年 12 月独角兽估值做投资判断前，公开证据仍支持等待外部融资轮、经审计 FY2025 结果和更清晰的下行保护。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV012
              - CV014
              - CV015
