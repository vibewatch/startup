  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开客户旅程从资产密集型工业客户定位开始，经订阅驱动的部署和已安装客户群监测，最终走向并购驱动的扩张。
    data:
      items:
        - label: 资产密集型目标行业
          actor: 买方 / 细分市场选择
          phase: 目标定位
          touchpoints:
            - 在 Grand View Research 2025 年的划分中，制造业是最大的预测性维护终端市场。
            - IBM 将能源、交通、制造和采矿列为常见的预测性维护行业。
        - label: 识别可靠性问题
          actor: 维护与工程团队
          phase: 评估
          touchpoints:
            - 预测性维护依靠 IoT 传感器和实时状态监测。
            - 振动分析是泵、压缩机和电机等旋转设备的常见技术。
        - label: 全栈部署
          actor: I-care 平台与现场服务模式
          phase: 部署
          touchpoints:
            - Wi-care 传感器、I-see 平台和专家服务组成运营方案。
            - 该方案定位为减少停机并改善机器健康。
        - label: 订阅打包
          actor: 付款方与商业买方
          phase: 商业推广
          touchpoints:
            - Wi-care as a Service 被描述为一体化订阅方案。
            - 订阅模式可以降低小型组织的入场门槛。
        - label: 已安装客户群运营
          actor: 已部署的客户群
          phase: 生产使用
          touchpoints:
            - I-care 称其服务覆盖 55 个以上国家。
            - 一份二手档案称，公司在全球监测超过 300,000 台工业机器。
        - label: 扩张与迁移循环
          actor: 客户成功与并购
          phase: 扩张
          touchpoints:
            - I-care 向前 Sensirion 客户提供了延续其预测性维护战略的方案。
            - I-care 称，这些客户所在的工业细分市场与其现有覆盖范围互补。
