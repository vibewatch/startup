              保留证据将 Fabrice Brion 和 Arnaud Stiévenart 列为创始人，并反复把 Brion
              放在战略、技术押注和融资里程碑的公开叙事中心。这足以确认创始人延续性，以及其围绕工业可靠性的创始人—市场匹配度，但不足以让我们有把握地判断治理深度。现有来源没有披露完整董事会、独立董事构成，或分别负责产品、财务和国际运营的更完整管理团队。因此，后续章节可以沿用创始人身份和
