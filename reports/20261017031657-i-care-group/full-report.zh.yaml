chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              I-care 将自己定位为端到端预测性维护公司，而非单点软件供应商。保留的官方页面一贯展示一套由专利监测物联网硬件、I-see 分析平台和大型现场服务团队组成的技术栈；独立公司简介与新闻来源也相互印证，公司
              2004 年成立于比利时
              Mons，如今已达到跨国工业规模。这对后续尽调很重要：产品似乎把硬件、分析和服务捆成一套运营模式；规模说法也得到多个不完全相同来源的方向性佐证，而非只依赖一页营销材料。行业环境同样有利：第三方市场报告仍预计预测性维护到
              2031 年保持两位数增长，这也解释了 I-care 为何试图把现有装机基础转化为更多市场份额。
