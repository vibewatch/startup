        title: 资本、规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              本轮更新最大的变化在财务而非产品：公司控制的来源与独立来源如今都确认，2025 年 12 月的一次融资及再融资操作把 I-care
              推入独角兽行列，但该轮只向现有股东和员工开放，没有新外部投资者参与。这一区别很关键：它支持 headline 估值，却限制了独立价格发现。同一组来源称，2026 年将进入第二阶段，吸引外部投资者；此前 IPO
              已在上一年春季推迟。公开规模指标偏正面，但仍有部分由发行方控制：收入被描述为超过 $116 million，订单储备超过 $232 million，公司把增长归因于 Wi-care as a
              Service、大批量传感器生产和广泛的国际版图。因此，本章确认了增长势头，却还不能确认所有权结构、融资构成或持续的公开市场准备度。
