  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >
              公开来源将 I-care 描述为不止于独立状态监测软件供应商。公司 2026 年 7 月的扩张公告、该公告的联合发布版本和第三方公司简介，都把产品描述为 Wi-care 传感器、I-see
              分析平台和可靠性工程支持的组合。因此，相关市场边界比一般工业软件窄，却比纯传感器 SKU 宽：真正的替代方案包括采用人工巡检的内部维护团队、单点监测工具、以 CMMS
              为核心的工作流，以及更广泛的资产绩效管理技术栈。组合式定位很重要，因为买家似乎想要能从检测走到现场执行的合作伙伴，而不只是另一个仪表盘。
