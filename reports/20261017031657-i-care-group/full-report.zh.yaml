    title: 产品架构图
    type: stack
    summary: 公开证据支持从传感硬件到分析和工作流交付的分层技术栈，制造规模是其中的赋能层。
    data:
      layers:
        - label: 业务结果
          detail: 来源所述的价值主张，重点是正常运行时间、成本控制和更轻松的升级周期。
          outputs:
            - label: Financial predictability
            - label: Reduced unplanned downtime
            - label: Longer asset lifespan
        - label: 订阅方案封装层
          detail: Predictive Maintenance as a Service 将硬件、软件和专家服务打包。
          modules:
            - label: 一体化订阅
            - label: 专家服务
            - label: 升级模式
        - label: 传感器层
          detail: Wi-care 硬件是监测端，并与自有生产能力绑定。
          modules:
            - label: Wi-care 传感器
            - label: 24/7 监测
          outputs:
            - label: Machine-health signals
        - label: 分析层
          detail: I-see 处理传感器数据，并支持故障预测。
          modules:
            - label: I-see 平台
            - label: '>150,000 个传感器已监测'
          outputs:
            - label: Failure predictions
        - label: 工作流集成层
          detail: 独立报道称，I-see 汇总多种技术，并将数据送入规划工作流。
          modules:
            - label: 外部系统集成
            - label: 多技术汇总
          outputs:
            - label: Maintenance-planning data
        - label: 制造规模层
          detail: 传感器推广由 Industry 4.0 工厂支持，已公布产能最高为 2,000 个传感器 / 日。
          modules:
            - label: 自有生产单元
