          detail: 预测性维护支出和数字优先维护的采用率都在扩大。
        - id: scale
          label: 运营证明
          detail: I-care 报告收入 €100M+ / $110M+、订单簿 €200M+ / $220M+，以及 1,000+ 名员工。
        - id: price
          label: 标题独角兽估值
          detail: 2025 年 12 月的来源显示，公司估值约为 €1B / $1.16B。
        - id: gap
          label: 价格发现缺口
          detail: 独角兽轮次由内部人士主导，公开 EV/Revenue 和优先权条款仍未披露。
        - id: comp
          label: 可比公司门槛
          detail: Augury 的外部融资展示了后期同行能够达到的独立资本验证水平。
        - id: verdict
          label: 推荐 = 跟踪
          detail: 等待外部轮次验证、经审计的 FY2025 业绩，或更有利的入场点。
