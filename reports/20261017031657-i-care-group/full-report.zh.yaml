        - 若能证明 I-care 通过更高毛利的经常性收入捕获这部分增长，估值区间就有理由收窄。
      - - 反论点
        - 2025 年 12 月的轮次仅面向现有股东和员工，因此当前独角兽估值缺乏新鲜的第三方价格发现。
        - 清晰披露、条款具有支持性的 2026 年外部轮次，将显著降低这一担忧。
