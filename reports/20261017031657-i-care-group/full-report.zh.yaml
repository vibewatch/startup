      - number: '3.3'
        title: 分销能力与定价不透明，是两大竞争压力点
        blocks:
          - type: paragraph
            body: >-
              最可信的护城河挑战不只是功能对等，而是分销。Mordor 称 Siemens、ABB 和 Schneider
              等在位者拥有装机基础知识和从传感器延伸到分析的交钥匙产品组合；专注边缘侧的新进入者则试图用易于改造的软件解除硬件锁定。              I-care
              的应对方式是在美国增加本地工程、可靠性、销售和营销能力，但公开证据显示，定价透明度仍远低于产品范围的透明度。保留来源展示的是 I-care
              及其同行如何描述打包方式和用例，而不是经过审计的公开标价、折扣或实际合同经济性。这削弱了我们对切换成本和 TCO 的把握。Belga 的报道还显示，I-care
              仍在亏损，并在后续融资前预期会出现现金缺口；因此，公司必须在缺少公开价格透明度的情况下守住重服务差异化，而价格透明度本可让采购更容易进行同口径比较。
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP013
              - CP015
