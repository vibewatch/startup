evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: >-
      Current board composition, independent-director presence, and named executive responsibilities beyond the
      founder/CEO.
    whyItMatters: >-
      Without a fuller governance picture, key-person dependence and succession readiness cannot be underwritten from
      public evidence.
    diligencePath: Request an org chart, board list, and governance materials during management meetings.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership-and-round-terms
    missingEvidence: >-
      Named investors, ownership percentages, debt or refinancing terms, and whether the December 2025 round included
      secondary liquidity.
    whyItMatters: >-
      The headline valuation is less informative without knowing who priced it, what rights changed, and how much of the
      capital was primary versus refinancing.
    diligencePath: Obtain the cap table, term sheet, and board resolutions for the December 2025 operation.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited FY2025 revenue mix, ARR, gross margin, EBITDA or cash-burn data, and a clear bridge between order book and
      recognized revenue.
    whyItMatters: >-
      The chapter can anchor scale, but it cannot distinguish software-like economics from services or hardware
      intensity using the retained public evidence alone.
    diligencePath: Request audited financial statements plus segment or product-line revenue detail.
    relatedQuestionRefs:
      - QO005
  - type: stale
    severity: material
    topic: external-investor-phase
    missingEvidence: Independent confirmation that the planned 2026 external-investor phase has launched, closed, or been deferred.
    whyItMatters: >-
      That phase is the cleanest upcoming test of valuation support, dilution, and IPO readiness, yet the retained
      evidence only records management intent.
    diligencePath: Ask management for financing status, named counterparties, and a refreshed IPO timetable.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      A management-quality SAM/SOM split showing how much of the opportunity is software, WaaS, engineering services,
      and geography-specific demand.
    whyItMatters: >-
      Without a company-shaped denominator, valuation benchmarking risks overstating or understating I-care's true
      addressable market.
    diligencePath: >-
      Request board or fundraising materials that break revenue and pipeline by product bundle, geography, and customer
      segment.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-map
    missingEvidence: Public proof of exact budget ownership, buyer journey, and ROI approval path by customer segment.
    whyItMatters: >-
      Budget-line ownership determines sales cycle, expansion motion, and whether subscription packaging genuinely
      lowers adoption friction.
    diligencePath: >-
      Collect customer case studies, procurement records, or reference calls that identify signer, budget line, and
      implementation champion.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: boundary-discipline
    missingEvidence: A single source that reconciles predictive maintenance, APM, CMMS, and AI wedges into a consistent taxonomy.
    whyItMatters: >-
      Adjacent categories are directionally helpful but can mislead if treated as one comparable market or summed into
      an invented TAM.
    diligencePath: >-
      Build an internal taxonomy memo before valuation work and test it against management's pricing, pipeline, and
      customer cohorts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Signed price cards, proposal examples, or contract exhibits showing unit economics, discounting, and service
      bundling by deployment size.
    whyItMatters: >-
      Public sources describe packaging classes but not comparable TCO, which limits conviction on whether I-care wins
      on ROI or simply on broader scope.
    diligencePath: >-
      Request three recent customer proposals or executed order forms across SMB, mid-market, and enterprise
      deployments.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: financial-durability
    missingEvidence: >-
      Audited FY2024-FY2025 revenue bridge, order-book definition, and segment split that reconciles Belga's
      revenue/loss disclosure with later scale claims.
    whyItMatters: >-
      Competitive durability depends on whether I-care can fund service-heavy differentiation without overstating
      like-for-like scale versus incumbents.
    diligencePath: >-
      Obtain audited financial statements plus a management bridge from booked orders to recognized revenue and
      recurring subscription mix.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Named competitor overlap, win/loss records, and customer switching narratives versus SAP, Rockwell/Fiix,
      Siemens-affiliated offerings, and CMMS-led substitutes.
    whyItMatters: >-
      Public product descriptions do not prove where I-care actually wins or loses, so moat durability cannot be
      underwritten from catalog evidence alone.
    diligencePath: Request the last 12 months of CRM-coded competitive deals and 5-10 anonymized loss reviews by segment.
    relatedQuestionRefs:
      - QP003
      - QP004
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Realized pricing by product line, discount corridors, contract length, and billing units for WaaS, hardware, and
      services.
    whyItMatters: >-
      Without realized pricing, it is impossible to judge revenue quality, discounting pressure, or the extent of
      recurring versus project-based revenue.
    diligencePath: Request current price books, standard order forms, and a cohort split of recurring versus one-time revenue.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by stream, field-engineer utilization, hardware gross margin, CAC, payback, and backlog conversion
      assumptions.
    whyItMatters: >-
      These are the inputs needed to underwrite margin expansion and determine whether scale is improving unit economics
      or simply funding more service delivery.
    diligencePath: >-
      Request FY2025/FY2026 management accounts with segment gross margin, sales-efficiency KPIs, and services
      utilization dashboards.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Group cash balance, quarterly burn, debt maturities/covenants, and management's next financing trigger.
    whyItMatters: >-
      Public sources show expansion spending and a delayed IPO path, but they do not show whether the current balance
      sheet can fund the plan without another raise.
    diligencePath: Request a 12- to 18-month cash bridge with debt schedule, covenant package, and board-approved financing plan.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: private-evidence-only
    severity: minor
    topic: acquisition-integration
    missingEvidence: >-
      Revenue contribution, purchase price, goodwill, and margin profile for acquired businesses such as SDT
      International.
    whyItMatters: >-
      Acquisition economics affect both the quality of consolidated growth and the sustainability of cross-sell
      assumptions in the revenue model.
    diligencePath: Request acquisition summaries, integration scorecards, and acquired revenue/margin bridges by year.
    relatedQuestionRefs:
      - QI001
      - QI006
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A public developer-signal or practitioner-community proxy such as repos, package stats, API forum activity,
      integrator talks, or engineering-community references.
    whyItMatters: >-
      Without an ecosystem proxy, it is hard to judge whether I-care's integration surface and practitioner pull extend
      beyond company-controlled messaging.
    diligencePath: >-
      Request public API/developer references, partner implementation talks, marketplace listings, or
      practitioner-community traces that show external usage.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Public trust-center material, product-security architecture, current certifications, SLA/status disclosures, and
      AI/compliance documentation for I-see.
    whyItMatters: >-
      These artifacts are needed to underwrite enterprise deployment risk, regulated-environment suitability, and
      governance overhead.
    diligencePath: >-
      Request the latest security pack, certification register, uptime reporting surface, and AI-governance / compliance
      documentation.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: deployment-reliability
    missingEvidence: >-
      Named integrations, rollout timelines, support ratios, uptime metrics, and customer implementation outcomes by
      product module.
    whyItMatters: >-
      Public marketing proves the architecture direction but not how consistently the system deploys or performs at
      enterprise scale.
    diligencePath: >-
      Request customer implementation decks, reference calls, status/SLA exports, and integration inventory from the
      product team.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Named customer case studies with deployment scope, production status, and quantified outcomes.
    whyItMatters: Without named references, public customer proof stays cohort-level and weaker for enterprise diligence.
    diligencePath: Request three named production references by vertical and geography, with deployment age and outcome metrics.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Public or diligence-room disclosure of NRR, GRR, churn, renewal rates, contract terms, and top-customer share.
    whyItMatters: Durability and concentration are the core remaining uncertainties in the quality of I-care's installed base.
    diligencePath: Request cohort data, renewal schedules, and top-10 customer revenue concentration for the last two fiscal years.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: minor
    topic: customer-count-denominator
    missingEvidence: >-
      Active account count, site count, and deployment split across services, subscriptions, and acquired customer
      bases.
    whyItMatters: Country count and machine count do not translate directly into customer quality or recurring revenue mix.
    diligencePath: >-
      Ask management for customer-account, site, and deployed-sensor counts reconciled to recurring and non-recurring
      revenue.
    relatedQuestionRefs:
      - QU002
      - QU008
  - type: missing-source
    severity: material
    topic: external-capital-proof
    missingEvidence: >-
      External-round materials, lead-investor identity, pricing terms, underwriting status, and a dated IPO-readiness
      workplan.
    whyItMatters: >-
      Without third-party price discovery, the unicorn valuation and IPO narrative remain largely insider-supported
      execution claims rather than validated market outcomes.
    diligencePath: >-
      Request the 2026 fundraising deck, cap table bridge, board approvals, and any bank engagement letters or draft
      timetable.
    relatedQuestionRefs:
      - QR001
      - QR002
  - type: private-evidence-only
    severity: material
    topic: control-and-security-proof
    missingEvidence: >-
      Underlying ISO 27001 certificate scope, security architecture, incident history, DPA/SOC materials, and board
      committee documentation.
    whyItMatters: >-
      A named compliance function and a third-party certification label are directionally positive, but they do not
      prove control depth for enterprise diligence or public-market scrutiny.
    diligencePath: >-
      Request the certificate, statement of applicability, recent audits, board committee charters, and the internal
      incident register.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: ecosystem-and-customer-proof
    missingEvidence: >-
      Public API/integration documentation, partner certifications, customer architecture references, renewal data, and
      concentration metrics.
    whyItMatters: >-
      The market increasingly rewards integration depth and vendor partnerships, but the assigned pool does not yet show
      that I-care's ecosystem proof matches those buyer expectations.
    diligencePath: >-
      Request API docs, partner program materials, top-customer concentration, renewal cohorts, and named deployment
      references.
