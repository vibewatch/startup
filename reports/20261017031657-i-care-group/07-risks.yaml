  evidenceGaps:
    - type: missing-source
      severity: material
      topic: external-capital-proof
      missingEvidence: External-round materials, lead-investor identity, pricing terms, underwriting status, and a dated IPO-readiness workplan.
      whyItMatters: Without third-party price discovery, the unicorn valuation and IPO narrative remain largely insider-supported execution claims rather than validated market outcomes.
      diligencePath: Request the 2026 fundraising deck, cap table bridge, board approvals, and any bank engagement letters or draft timetable.
      relatedQuestionRefs: [QR001, QR002]
    - type: private-evidence-only
      severity: material
      topic: control-and-security-proof
      missingEvidence: Underlying ISO 27001 certificate scope, security architecture, incident history, DPA/SOC materials, and board committee documentation.
      whyItMatters: A named compliance function and a third-party certification label are directionally positive, but they do not prove control depth for enterprise diligence or public-market scrutiny.
      diligencePath: Request the certificate, statement of applicability, recent audits, board committee charters, and the internal incident register.
      relatedQuestionRefs: [QR006]
      relatedTableRefs: [TR001]
    - type: missing-source
      severity: material
      topic: ecosystem-and-customer-proof
