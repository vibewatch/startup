callouts:
  - calloutType: risk
    title: Highest-priority kill criteria
    body: >-
      The thesis should break if I-care cannot show an external-led financing
      or revived IPO timetable, if scale-up produces quality or uptime issues,
      or if institutional diligence still cannot verify governance and control
      depth from documents.
    claimRefs: [CR002, CR004, CR007, CR009, CR016]
  - calloutType: insight
    title: What already mitigates the downside
    body: >-
      Founder ownership, visible reference shareholders, and a named
      compliance function are real mitigation signals, but they are not
      substitutes for audited economics, board-process evidence, or
      customer-operating metrics.
    claimRefs: [CR004, CR005, CR006, CR011]
