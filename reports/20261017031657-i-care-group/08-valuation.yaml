    columns: ["Dimension", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Track", "Keep active diligence, but do not underwrite the headline valuation on current public evidence alone."]
      - ["Confidence", "Medium", "Scale and market direction are real, but financing transparency is incomplete."]
      - ["Risk rating", "High", "Funding-term opacity and still-deferred external price discovery can move entry economics materially."]
      - ["Valuation stance", "Stretched", "The insider-led unicorn round is a reference point, not yet a fully independent clearing price."]
      - ["Entry discipline", "Require discount or stronger proof", "Look for audited FY2025 results, external-round terms, and clearer recurring-revenue quality before upgrading."]
    notes: "Assessments synthesize retained source facts plus explicitly labeled valuation inferences."
    claimRefs: [CV001, CV002, CV003, CV005, CV012, CV014]
  - id: TV002
    title: "Thesis / anti-thesis table"
    columns: ["Lens", "Argument", "What would change the view"]
    rows:
      - ["Thesis", "I-care has real commercial proof, with reported revenue above €100M / $110M+, order book above €200M / $220M+, and 1,000+ employees around the unicorn event.", "Audited FY2025 financials and better revenue-mix disclosure would strengthen confidence in valuation durability."]
      - ["Thesis", "The category still has tailwinds: MarketsandMarkets projects predictive maintenance from $13.89B in 2026 to $23.79B in 2031, while Plant Engineering describes manufacturers moving to digital-first maintenance spending.", "Proof that I-care captures this growth through higher-margin recurring revenue would justify a tighter valuation range."]
      - ["Anti-thesis", "The Dec 2025 round was reserved for existing shareholders and employees, so the current unicorn mark lacks fresh third-party price discovery.", "A clearly disclosed 2026 external round on supportive terms would materially reduce this concern."]
      - ["Anti-thesis", "Public evidence still does not disclose EV/Rev, stage, preference stack, or audited unit economics, making downside protection and comparable selection unreliable.", "Disclosure of EV/Revenue, cap-table terms, and FY2025 audit would allow a model-based underwrite instead of relative discipline."]
    notes: "Arguments combine reported facts with explicit investment interpretation rather than pretending to be a full valuation model."
    claimRefs: [CV001, CV004, CV005, CV006, CV009, CV010, CV012, CV013]
  - id: TV003
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "External investors enter on constructive terms, audited FY2025 results hold strong growth quality, and WaaS / software mix proves scalable.", "At or modestly above the Dec 2025 unicorn mark becomes defendable because outside capital validates the reference price.", "Execution slippage, slower recurring mix, or weaker-than-expected margins.", "Needs a disclosed external round and audited proof, neither of which is public in the assigned pool."]
      - ["Base", "The company keeps scaling, but public disclosures stay incomplete and the next financing event remains undisclosed or delayed.", "Entry should be around or below the current reference mark because evidence supports company quality more than price certainty.", "Opacity around financing terms, revenue mix, and downside protection persists.", "Most consistent with the current retained evidence set."]
      - ["Bear", "External fundraising slips again, new terms imply structure or dilution, or audited results do not support the current narrative.", "The current unicorn mark becomes a ceiling rather than a floor, implying materially lower fair entry value.", "Down-round risk, preference overhang, and reduced IPO readiness.", "Would be triggered by a delayed or weakly priced external round."]
    notes: "Scenario ranges stay relative to the Dec 2025 unicorn mark because no public EV/Revenue multiple or preference stack is disclosed."
    claimRefs: [CV004, CV006, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
