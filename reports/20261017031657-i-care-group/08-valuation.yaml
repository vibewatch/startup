artifact: valuation
slug: i-care-group
runDate: 2026-10-17
company:
  name: "I-care Group"
chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence supports a credible industrial predictive-maintenance platform with real scale, but not a clean invest-at-today's-price call. The Dec 2025 unicorn mark was set by an insider-led round, while public sources still do not disclose EV/Revenue, preference terms, or audited FY2025 unit economics, so the valuation stance remains stretched and the recommendation stays track."
sections:
  - id: recommendation-and-price-discipline
    title: "Recommendation and price discipline"
    body: |-
      The retained evidence supports a **track** recommendation rather than an immediate invest call. I-care clearly has meaningful operating proof: multiple retained sources place annual revenue above €100 million / $110 million, order book above €200 million / $220 million, and headcount above 1,000 around the Dec 2025 unicorn announcement. But the current headline valuation was established in a round reserved for existing shareholders and employees, not through a newly disclosed external lead investor or a public filing that shows the price paid by independent capital. That leaves the current mark usable as a reference point, but not yet as sufficient proof that an outside investor should underwrite the same entry price without a discount or stronger diligence evidence.
    claimRefs: [CV001, CV002, CV003, CV005, CV012, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-context-and-comparable-anchors
    title: "Valuation context and comparable anchors"
    body: |-
      The valuation context is directionally positive but still incomplete. Brussels Times and EU-Startups both describe the Dec 2025 milestone as a unicorn event, while Silicon Valley Investclub lists a Dec 2025 valuation of $1.16 billion and total funding of roughly $95 million, yet also states that EV/Rev and stage are not disclosed for any round. That omission matters because the best public comparable in the assigned pool, Augury, highlights both a prior $180 million Series E unicorn step and a new $75 million Series F in 2025, showing that industrial-AI leaders can attract sizable external capital at later stages. MarketsandMarkets and Plant Engineering add category support, but they do not solve I-care-specific pricing opacity; market growth is helpful context, not a substitute for transparent monetization and financing terms.
    claimRefs: [CV003, CV004, CV006, CV007, CV008, CV009, CV010, CV012, CV013]
    tableRefs: [TV002]
  - id: bull-base-bear-framing
    title: "Bull, base, and bear framing"
    body: |-
      A disciplined scenario view should stay relative rather than falsely precise. The bull case can defend or modestly exceed the Dec 2025 unicorn mark only if the planned external-investor step actually happens on supportive terms and if audited results confirm that recent growth is translating into durable subscription or software-like economics, not just project or hardware throughput. The base case keeps I-care around or somewhat below that mark until outside money, audited FY2025 results, and clearer revenue-mix disclosures close the information gap. The bear case becomes plausible if the delayed IPO slips further, the external round fails to materialize, or new terms imply dilution, liquidation preferences, or a valuation reset that today’s public evidence does not reveal.
    claimRefs: [CV004, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence-asks
    title: "Exit readiness and final diligence asks"
    body: |-
      Exit readiness is not disproven, but it is not yet independently validated either. The company has a scale narrative, a large order book, a deferred IPO ambition, and a market with continuing digital-maintenance tailwinds, which is enough to keep I-care on the watchlist. What is still missing is the evidence an external investor would normally need to bridge from “credible unicorn” to “priced attractively now”: audited FY2025 financials, revenue-mix detail across hardware, services, and WaaS/software, the actual terms of the planned 2026 external raise, and any preference or debt features that affect downside protection. Thesis-breakers are straightforward: another delay in external fundraising, a down-round or heavily structured round, or audited results that fail to substantiate the current valuation narrative.
    claimRefs: [CV004, CV005, CV006, CV012, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: "Track until external price discovery exists"
    body: "I-care has enough scale and category tailwinds to stay investable in principle, but public evidence still supports waiting for an external round, audited FY2025 results, and clearer downside protection before underwriting the Dec 2025 unicorn mark."
    claimRefs: [CV005, CV012, CV014, CV015]
