      - number: '3.3'
        title: Distribution power and pricing opacity remain the two main competitive pressure points
        blocks:
          - type: paragraph
            body: >-
              The most credible moat challenge is not feature parity alone, but distribution. Mordor says incumbents
              such as Siemens, ABB, and Schneider bring installed-base knowledge and turnkey portfolios that run from
              sensors to analytics, while edge-focused newcomers try to remove hardware lock-in with retrofit-friendly
              software. I-care is responding by adding more local engineering, reliability, sales, and marketing
              capacity in the United States, but public evidence still leaves pricing much less transparent than product
              scope. The retained sources show I-care and peers describing packaging and use cases, not auditable public
              list pricing, discounts, or realized contract economics. That limits certainty on switching cost and TCO.
              It matters because Belga’s reporting also shows I-care remained loss-making and expected a cash shortfall
              before its later financing, so the company must defend service-heavy differentiation without the public
              pricing clarity that would make apples-to-apples procurement easier.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP007
              - CP011
              - CP013
      - number: '3.4'
        title: The moat is credible, but its durability still depends on proof outside company narratives
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a real strategic position for I-care: it is not a pilot-stage analytics tool, but a
              scaled vendor with global delivery reach, proprietary sensing, and a subscription-plus-services model.
              Still, public benchmarking remains incomplete in three places that matter for underwriting durability.
              First, software-led rivals may commoditize lower-complexity deals where usability and deployment speed
              matter more than full-service delivery. Second, installed-base incumbents can bundle reliability into
              larger automation relationships. Third, I-care’s own scale disclosures are directionally strong but not
              perfectly comparable across sources, which weakens clean benchmarking versus public incumbents. The net
              result is a credible moat at the complex, service-intensive end of the market, but not yet evidence of
              uncontested long-term insulation from bundling or software commoditization.
            claimRefs:
              - CP005
              - CP006
              - CP014
              - CP015
              - CP016
