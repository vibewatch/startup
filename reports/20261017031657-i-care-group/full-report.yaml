  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public customer journey runs from asset-heavy industrial targeting to subscription-led deployment,
      installed-base monitoring, and M&A-led expansion.
    data:
      items:
        - label: Asset-heavy target sectors
          actor: Buyer / segment selection
          phase: Targeting
          touchpoints:
            - Manufacturing is the largest predictive-maintenance end market in Grand View Research's 2025 split.
            - IBM lists energy, transportation, manufacturing, and mining as common predictive-maintenance sectors.
        - label: Reliability problem identification
          actor: Maintenance and engineering teams
          phase: Evaluation
          touchpoints:
            - Predictive maintenance relies on IoT sensors and real-time condition monitoring.
            - Vibration analysis is a common technique for rotating equipment such as pumps, compressors, and motors.
        - label: Full-stack deployment
          actor: I-care platform and field-services motion
          phase: Deployment
          touchpoints:
            - Wi-care sensors, the I-see platform, and expert services form the operating bundle.
            - The offer is positioned around reducing downtime and improving machine health.
        - label: Subscription packaging
          actor: Payer and commercial buyer
          phase: Commercial rollout
          touchpoints:
            - Wi-care as a Service is described as an all-in-one subscription-based solution.
            - Subscription models can lower entry barriers for smaller organizations.
        - label: Installed-base operations
          actor: Deployed customer base
          phase: Production use
          touchpoints:
            - I-care says it serves customers in more than 55 countries.
            - A secondary profile says the company monitors more than 300,000 industrial machines worldwide.
