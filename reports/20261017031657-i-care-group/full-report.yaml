  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          External investors enter on constructive terms, audited FY2025 results hold strong growth quality, and WaaS /
          software mix proves scalable.
        - >-
          At or modestly above the Dec 2025 unicorn mark becomes defendable because outside capital validates the
          reference price.
        - Execution slippage, slower recurring mix, or weaker-than-expected margins.
        - Needs a disclosed external round and audited proof, neither of which is public in the assigned pool.
      - - Base
        - >-
          The company keeps scaling, but public disclosures stay incomplete and the next financing event remains
          undisclosed or delayed.
        - >-
          Entry should be around or below the current reference mark because evidence supports company quality more than
          price certainty.
        - Opacity around financing terms, revenue mix, and downside protection persists.
        - Most consistent with the current retained evidence set.
      - - Bear
        - >-
          External fundraising slips again, new terms imply structure or dilution, or audited results do not support the
          current narrative.
        - The current unicorn mark becomes a ceiling rather than a floor, implying materially lower fair entry value.
        - Down-round risk, preference overhang, and reduced IPO readiness.
        - Would be triggered by a delayed or weakly priced external round.
    notes: >-
      Scenario ranges stay relative to the Dec 2025 unicorn mark because no public EV/Revenue multiple or preference
      stack is disclosed.
    claimRefs:
      - CV004
      - CV006
      - CV009
      - CV010
      - CV011
