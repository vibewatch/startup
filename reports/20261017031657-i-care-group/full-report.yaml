      - number: '2.3'
        title: Buyer, user, and budget ownership skew toward asset-intensive operators
        blocks:
          - type: paragraph
            body: >
              The available buyer evidence points to asset-intensive manufacturers and other industrial operators that
              own uptime, safety, and productivity outcomes. Plant Engineering's 2026 operations-and-maintenance study
              says manufacturers are shifting from internal, skills-dependent approaches toward higher technology
              spending and deeper vendor partnerships; I-care's July 2026 U.S. release then adds the company-specific
              read-through that customers increasingly want one partner combining technology, engineering, and long-term
              support. That suggests the daily user is a reliability or maintenance team, while budget authority likely
              sits with plant leadership or operations sponsors who can justify broader reliability programs instead of
              isolated tooling purchases. I-care's local-team expansion also implies adoption still depends on field
              coverage and services capacity.
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption drivers are clear; the main constraint is denominator ambiguity
        blocks:
          - type: paragraph
            body: >
              The demand-side driver is consistent across sources: industrial operators are spending more on reliability
              technology, AI-assisted maintenance workflows, and vendor partnerships that reduce the burden on in-house
              teams. I-care's subscription packaging and high claimed sensor throughput support a scaling story aimed at
              fleet-wide deployments rather than one-off pilots. The counterweight is analytical rather than
              existential: public sources do not disclose how much of I-care's addressable opportunity is recurring
              software, bundled WaaS, engineering services, or adjacent APM/CMMS spend. That keeps the market narrative
              positive while forcing diligence to treat SAM/SOM, budget-line ownership, and ROI conversion as open
              workstreams rather than settled facts.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
