      - number: '2.2'
        title: Sizing lenses show a large core market but no clean SAM/SOM
        blocks:
          - type: paragraph
            body: >
              The strongest public market-size evidence comes from adjacent and overlapping categories rather than a
              single I-care-shaped denominator. MarketsandMarkets sizes predictive maintenance at USD 13.89 billion in
              2026 growing to USD 23.79 billion by 2031, while the same publisher separately sizes asset performance
              management at USD 2.40 billion in 2026, CMMS at USD 1.54 billion in 2026, and an
              agentic-AI-in-predictive-maintenance niche at USD 0.85 billion in 2025. Those figures are useful as
              lenses, but they should not be added together or treated as a clean TAM/SAM/SOM cascade because each uses
              a different product, workflow, and deployment boundary. The result is a credible growth backdrop with
              limited valuation precision for I-care's hybrid hardware-software-service bundle.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
