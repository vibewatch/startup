  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          I-care has real commercial proof, with reported revenue above €100M / $110M+, order book above €200M / $220M+,
          and 1,000+ employees around the unicorn event.
        - >-
          Audited FY2025 financials and better revenue-mix disclosure would strengthen confidence in valuation
          durability.
      - - Thesis
        - >-
          The category still has tailwinds: MarketsandMarkets projects predictive maintenance from $13.89B in 2026 to
          $23.79B in 2031, while Plant Engineering describes manufacturers moving to digital-first maintenance spending.
        - >-
          Proof that I-care captures this growth through higher-margin recurring revenue would justify a tighter
          valuation range.
      - - Anti-thesis
        - >-
          The Dec 2025 round was reserved for existing shareholders and employees, so the current unicorn mark lacks
          fresh third-party price discovery.
        - A clearly disclosed 2026 external round on supportive terms would materially reduce this concern.
      - - Anti-thesis
        - >-
          Public evidence still does not disclose EV/Rev, stage, preference stack, or audited unit economics, making
          downside protection and comparable selection unreliable.
        - >-
          Disclosure of EV/Revenue, cap-table terms, and FY2025 audit would allow a model-based underwrite instead of
          relative discipline.
    notes: >-
      Arguments combine reported facts with explicit investment interpretation rather than pretending to be a full
      valuation model.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV009
