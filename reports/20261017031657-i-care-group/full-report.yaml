        title: Capital, scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              The biggest refresh-era change is financial rather than product-related; company-controlled and
              independent sources now agree that a December 2025 fundraising and refinancing operation pushed I-care to
              unicorn status, but the round was reserved for existing shareholders and employees rather than new outside
              investors. That distinction is important because it supports the headline valuation while limiting
              independent price discovery. The same source cluster says a second phase in 2026 is meant to attract
