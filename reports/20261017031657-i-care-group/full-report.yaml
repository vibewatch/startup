      - number: '4.3'
        title: Unit-economics underwriting is blocked by missing margin, pricing, and runway disclosure
        blocks:
          - type: paragraph
            body: >-
              The biggest underwriting constraint is not lack of activity; it is lack of decision-grade financial
              detail. Companyweb's holding-company page shows 2024 debt of EUR17.1 million, equity of EUR69.2 million, a
              small holding-company turnover base, and only 3.8 FTE, which is useful for legal-entity context but not a
              substitute for group cash burn or consolidated gross margin. Public profiles also advertise pricing
              resources without exposing actual rate cards, while industry sources confirm a favorable
              predictive-maintenance spending backdrop and a buyer decision frame tied to bottom-line asset criticality.
              That is enough to frame the business model, but not enough to estimate realized ASPs, hardware gross
              margin, services utilization, acquisition economics, CAC payback, or runway. The financial verdict is
              therefore positive on demand and breadth of offering, but still conditional until management discloses
              mix, margin, and funding-need detail.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
