      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained evidence shows a long operating history, a visible late-2025 scale step-up, a 2025 IPO delay, and a
      December 2025 insider-led unicorn round that sets up a still-unproven 2026 external-investor phase.
    data:
      items:
        - year: 2004
          label: Founded in Mons, Belgium
          detail: Independent profile and news sources place I-care’s founding in 2004 in Mons, Belgium.
          tone: positive
          claimRefs:
            - CO004
            - CO005
        - period: Late 2025
          label: Public revenue and order-book scale becomes visible
          detail: >-
            Late-2025 company disclosures frame I-care at more than $116 million of annual revenue and more than $232
            million of order book.
          tone: positive
          claimRefs:
            - CO010
        - period: Spring 2025
          label: Postpones planned IPO
          detail: >-
            Independent and company-linked coverage say I-care postponed an initial public offering before pursuing the
            insider-led refinancing.
          tone: risk
          claimRefs:
            - CO008
        - period: Late 2025
          label: Links growth to Wi-care as a Service and scaled sensor manufacturing
          detail: >-
            Management says Wi-care as a Service, a new-generation sensor line, and factory capacity of up to 2,000
            sensors per day are current growth levers.
          tone: positive
          claimRefs:
            - CO003
            - CO011
        - period: Late 2025
          label: Independent profile reports 300,000+ machines monitored
          detail: >-
            A third-party profile source describes a 300,000-machine monitored footprint, reinforcing scale while using
            a different denominator from the 150,000-sensor disclosure.
          tone: positive
          claimRefs:
            - CO012
        - period: Dec 2025
          label: Closes insider-led fundraising and refinancing round
          detail: >-
            The round was reserved for existing shareholders and employees and marked the company at about €1 billion /
            $1.16 billion.
          tone: neutral
          claimRefs:
            - CO007
        - period: Dec 2025
          label: Claims global scale at unicorn milestone
          detail: >-
            Late-2025 sources cluster around more than 1,000 employees, 36 offices across 16 countries, and service
            coverage across 55+ countries or markets.
          tone: positive
          claimRefs:
            - CO006
        - year: 2026
          label: Targets external-investor phase
          detail: >-
            Management’s public next step is to attract outside investors in 2026, which would provide more independent
            price discovery than the 2025 insider round.
          tone: risk
          claimRefs:
            - CO009
            - CO016
