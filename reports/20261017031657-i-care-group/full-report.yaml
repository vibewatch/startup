              - CP014
          - type: callout
            title: Bundling risk comes from both incumbents and simpler software substitutes
            body: >-
              Incumbents can wrap predictive maintenance into broader automation relationships, while CMMS-led tools can
              undercut complexity in mid-market accounts. That leaves I-care defending two fronts at once: high-end
              bundling pressure and low-end commoditization pressure.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
          - type: callout
            title: Public pricing opacity keeps switching-cost analysis softer than feature comparison
            body: >-
              The retained sources describe solution scope far better than they disclose actual pricing, discounts, or
              contract economics. That makes it easier to compare vendor categories than to prove who wins on total cost
              of ownership.
            calloutType: risk
            claimRefs:
