  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: the buyer can solve the job in several ways'
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than "predictive maintenance software." Mordor describes a moderately
              concentrated market in which diversified automation leaders, cloud platforms, and AI-first specialists all
              compete, while G2’s category view shows buyers also evaluating maintenance platforms such as Fiix, Limble,
              eMaint, Brightly Asset Essentials, and SAP Predictive Asset Insights. Plant Engineering’s 2026
              operations-and-maintenance study adds the final substitute: manufacturers are still moving away from
              internal, skills-based maintenance toward digital-first programs, which means internal build and
              do-nothing remain part of the buyer’s consideration set even if they are losing ground. For I-care, that
              means the battle is not only for superior diagnostics, but also for whether a prospect wants a full
              reliability partner, a software tool layered onto existing teams, or no vendor-led change at all.
            claimRefs:
