        - The insider-led unicorn round is a reference point, not yet a fully independent clearing price.
      - - Entry discipline
        - Require discount or stronger proof
        - Look for audited FY2025 results, external-round terms, and clearer recurring-revenue quality before upgrading.
    notes: Assessments synthesize retained source facts plus explicitly labeled valuation inferences.
