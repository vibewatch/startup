      - number: '5.2'
        title: Architecture, workflow fit, and delivery scale
        blocks:
          - type: paragraph
            body: >-
              The best-supported architecture is a layered operating model: Wi-care sensors capture machine-health data,
              I-see aggregates and analyzes those signals, and the service wrapper feeds maintenance planning and
              rollout execution. Company and third-party coverage both point to concrete scale markers, including an
              Industry 4.0 manufacturing facility with announced capacity for up to 2,000 sensors per day and an I-see
              installed base monitoring more than 150,000 sensors. Independent coverage also says I-see integrates with
              external systems and aggregates multiple predictive-maintenance techniques, which is useful workflow
              evidence even though the public sources here do not document protocols, APIs, or named integration depth.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
