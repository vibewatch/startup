  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered solution and product surface
        blocks:
          - type: paragraph
            body: >-
              Retained evidence supports a solution-first offer rather than a single software SKU. I-care's current
              product narrative centers on Predictive Maintenance as a Service, which combines sensing, analytics, and
              expert delivery into one subscription contract, while third-party profiles also surface Wi-care sensors,
              I-see analytics, reliability services, and training as publicly named offer components. That positioning
              matters because it frames the buyer conversation around uptime, budget predictability, and maintenance
              outcomes instead of a point tool purchase. The gap is that public materials describe the bundle clearly
              but do not provide realized pricing, attach-rate, or module-level adoption data.
