        title: Exhibits
        blocks:
          - type: callout
            title: I-care's best differentiation is operational depth, not lowest-friction software adoption
            body: >-
              The retained evidence consistently places I-care on the full-stack side of the market: proprietary
              sensing, analytics, reliability engineering, training, and local service expansion. That gives it a
              stronger answer in complex industrial environments than a CMMS-only rival can usually provide.
