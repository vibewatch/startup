        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The retained evidence names Fabrice Brion and Arnaud Stiévenart as founders and repeatedly centers Brion
              as the public face of strategy, technology bets, and capital-raising milestones. That is enough to
              establish founder continuity and founder-market fit around industrial reliability, but it is not enough to
              assess governance depth with confidence. The source set does not disclose a full board,
              independent-director mix, or a broader executive bench with clear ownership of product, finance, and
              international operations. As a result, later chapters can safely reuse the founder identity and CEO
              continuity, but they should treat board quality, succession readiness, and key-person concentration as
              unresolved diligence items rather than implied strengths.
