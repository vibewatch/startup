      - number: '4.2'
        title: Traction is visible, but expansion and financing signals imply continuing capital intensity
        blocks:
          - type: paragraph
            body: >-
              I-care has credible public scale signals, but they should be read alongside investment needs. EU-Startups
              reports consolidated annual revenue above EUR100 million and an order book above EUR200 million, and the
              Silicon Valley Investclub profile separately lists 2024 revenue of $110 million+, a $1.16 billion
              valuation, and roughly $95 million of cumulative funding. At the same time, Pulse2 reports a fresh $25
              million investment into the U.S. subsidiary and says the company has already committed more than $50
              million over several years to technology development and manufacturing. EU-Startups also says the December
              2025 EUR20 million round was reserved for existing shareholders and employees, that external investors
              were still a 2026 objective, and that the IPO had been postponed. Those facts support growth momentum, but
              they also imply that scaling depends on continued spending for local teams, manufacturing capacity, and
              commercial execution rather than software-only self-funding dynamics.
