  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              Public sources describe I-care as more than a stand-alone condition-monitoring software vendor. The
              company's own July 2026 expansion release, a syndicated version of that release, and a third-party company
              profile all frame the offer as a bundle of Wi-care sensors, the I-see analytics platform, and reliability
              engineering support. That means the relevant market boundary is narrower than general industrial software
              but broader than a pure sensor SKU: the real substitute set includes internal maintenance teams using
              manual rounds, point monitoring tools, CMMS-led workflows, and broader asset-performance-management
              stacks. The bundled framing matters because buyers appear to want a partner that can move from detection
              to field execution, not just another dashboard.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM014
              - CM015
