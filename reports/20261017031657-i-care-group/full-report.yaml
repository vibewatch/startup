chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              I-care describes itself as an end-to-end predictive-maintenance company rather than a point software
              vendor. The retained official pages consistently present a stack that combines patented monitoring IoT
              hardware, the I-see analytics platform, and a large field-services layer, while independent profile and
              news sources reinforce that the company was founded in Mons, Belgium in 2004 and now operates at
              multinational industrial scale. That matters for later diligence because the product offer appears to
              bundle hardware, analytics, and services into one operating model, and because scale claims are
              directionally corroborated by multiple non-identical sources rather than resting on a single marketing
              page. Sector context also remains supportive; a third-party market report still projects double-digit
              predictive-maintenance growth through 2031, which helps explain why I-care is trying to convert its
              installed footprint into further share gains.
