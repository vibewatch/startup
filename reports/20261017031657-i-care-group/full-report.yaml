  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is diversified, but public mix disclosure is thin
        blocks:
          - type: paragraph
            body: >-
              The public record points to a bundled revenue model rather than a single pure-software SKU. G2 describes
              I-care as combining "patented IoT monitoring hardware, AI-driven analytics software, and global
              engineering expertise," while EU-Startups says the company has rolled out "Wi-care as a Service,"
              described as an all-in-one subscription offer. Silicon Valley Investclub separately lists PdM as a
              Service, reliability engineering, training, and the SDT ultrasound line, which implies monetization across
              hardware, software, field services, and adjacent products. What remains undisclosed is the actual revenue
              mix across those streams, the share of recurring subscription revenue versus project/services revenue, and
              whether list positioning converts into realized pricing power. That limits confidence in revenue quality:
              the model looks broader than a single-tool sale, but the public evidence does not quantify which streams
              are highest-margin, recurring, or most scalable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
