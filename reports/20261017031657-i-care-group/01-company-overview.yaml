  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance-gap
      missingEvidence: Current board composition, independent-director presence, and named executive responsibilities beyond the founder/CEO.
      whyItMatters: Without a fuller governance picture, key-person dependence and succession readiness cannot be underwritten from public evidence.
      diligencePath: Request an org chart, board list, and governance materials during management meetings.
      relatedQuestionRefs:
        - QO003
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: material
      topic: ownership-and-round-terms
      missingEvidence: Named investors, ownership percentages, debt or refinancing terms, and whether the December 2025 round included secondary liquidity.
      whyItMatters: The headline valuation is less informative without knowing who priced it, what rights changed, and how much of the capital was primary versus refinancing.
      diligencePath: Obtain the cap table, term sheet, and board resolutions for the December 2025 operation.
      relatedQuestionRefs:
        - QO004
        - QO008
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited FY2025 revenue mix, ARR, gross margin, EBITDA or cash-burn data, and a clear bridge between order book and recognized revenue.
      whyItMatters: The chapter can anchor scale, but it cannot distinguish software-like economics from services or hardware intensity using the retained public evidence alone.
      diligencePath: Request audited financial statements plus segment or product-line revenue detail.
      relatedQuestionRefs:
        - QO005
    - type: stale
      severity: material
      topic: external-investor-phase
      missingEvidence: Independent confirmation that the planned 2026 external-investor phase has launched, closed, or been deferred.
      whyItMatters: That phase is the cleanest upcoming test of valuation support, dilution, and IPO readiness, yet the retained evidence only records management intent.
      diligencePath: Ask management for financing status, named counterparties, and a refreshed IPO timetable.
      relatedQuestionRefs:
        - QO004
        - QO008
      relatedTableRefs:
        - TO003
