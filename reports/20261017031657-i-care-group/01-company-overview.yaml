schemaVersion: report-v2
artifact: company-overview
slug: i-care-group
runDate: '2026-10-17'
company:
  name: I-care Group
chapter:
  number: 1
  title: Company Overview
  summary: I-care Group enters this refresh as a 2004-founded Mons predictive-maintenance platform that combines proprietary sensors, the I-see analytics stack, and a large field-engineering footprint. Retained sources converge on more than 1,000 employees, 36 offices across 16 countries, and a €1 billion / $1.16 billion unicorn valuation from a December 2025 insider-led refinancing, but broader governance disclosure, precise ownership, and independent price discovery from the planned 2026 external-investor phase remain open.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      I-care describes itself as an end-to-end predictive-maintenance company rather than a
      point software vendor. The retained official pages consistently present a stack that
      combines patented monitoring IoT hardware, the I-see analytics platform, and a large
      field-services layer, while independent profile and news sources reinforce that the
      company was founded in Mons, Belgium in 2004 and now operates at multinational
      industrial scale. That matters for later diligence because the product offer appears
      to bundle hardware, analytics, and services into one operating model, and because
      scale claims are directionally corroborated by multiple non-identical sources rather
      than resting on a single marketing page. Sector context also remains supportive; a
      third-party market report still projects double-digit predictive-maintenance growth
      through 2031, which helps explain why I-care is trying to convert its installed
      footprint into further share gains.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO006
      - CO012
      - CO013
    tableRefs:
      - TO001
  - id: leadership-governance-and-key-person-dependence
    title: Leadership, governance, and key-person dependence
    body: >-
      The retained evidence names Fabrice Brion and Arnaud Stiévenart as founders and
      repeatedly centers Brion as the public face of strategy, technology bets, and
      capital-raising milestones. That is enough to establish founder continuity and
      founder-market fit around industrial reliability, but it is not enough to assess
      governance depth with confidence. The source set does not disclose a full board,
      independent-director mix, or a broader executive bench with clear ownership of
      product, finance, and international operations. As a result, later chapters can
      safely reuse the founder identity and CEO continuity, but they should treat board
      quality, succession readiness, and key-person concentration as unresolved diligence
      items rather than implied strengths.
    claimRefs:
      - CO004
      - CO005
      - CO015
    tableRefs:
      - TO002
      - TO003
  - id: capital-scale-and-milestones
    title: Capital, scale, and milestones
    body: >-
      The biggest refresh-era change is financial rather than product-related;
      company-controlled and independent sources now agree that a December 2025 fundraising
      and refinancing operation pushed I-care to unicorn status, but the round was
      reserved for existing shareholders and employees rather than new outside investors.
      That distinction is important because it supports the headline valuation while
      limiting independent price discovery. The same source cluster says a second phase in
      2026 is meant to attract external investors, after an IPO was postponed the prior
      spring. Public scale indicators are positive but still partly issuer-controlled:
      revenue is described as above $116 million, the order book as above $232 million,
      and the company links growth to Wi-care as a Service, high-volume sensor production,
      and a broad international footprint. The chapter therefore establishes momentum, but
      not yet a clean external validation of ownership structure, funding mix, or durable
      public-market readiness.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO016
    figureRefs:
      - FO001
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap
    rows:
      - - Founded
        - 2004; Mons, Belgium origin anchored across retained sources
        - '2004'
        - High
        - None on year or origin, but one later media recap miscites the founding year.
      - - Business model
        - Integrated hardware + AI analytics + services; Wi-care as a Service positioned as an all-in-one subscription offer
        - Current pages + 2025 release
        - High
        - No public split between hardware, subscription, and services revenue.
      - - Headcount / footprint
        - '>1,000 employees; 36 offices across 16 countries; service coverage in 55+ countries or markets'
        - 2025-2026 reporting window
        - High
        - Independent support confirms scale directionally, but exact as-of date is not disclosed.
      - - Valuation
        - €1.0B / $1.16B unicorn mark from December 2025 refinancing round
        - Dec 2025
        - High
        - Price was set in an insider-led round rather than a newly announced external lead investment.
      - - Capital event
        - Round reserved for existing shareholders and employees; 2026 external-investor phase planned
        - Dec 2025 / 2026 plan
        - Medium
        - No named 2026 investor, term sheet, or post-money cap-table detail is public in the retained set.
      - - Revenue / order book
        - '>$116M annual revenue and >$232M order book (company-controlled disclosure); profile database rounds this to $110M+ and $220M+'
        - 2024-2025 figures reported in late 2025 materials
        - Medium
        - No audited statement, revenue mix, ARR, or margin disclosure in the retained public pool.
      - - Installed base metrics
        - 150,000+ sensors monitored by I-see; 300,000+ machines monitored worldwide
        - Late 2025 profile / release window
        - Medium
        - These are different denominators and should not be collapsed into one installed-base metric.
      - - Public-market readiness
        - IPO postponed last spring; management now frames 2026 external investors as the next validation step
        - 2025-2026
        - Medium
        - Timing, valuation floor, and underwriting readiness remain undisclosed.
    notes: Dates mix publication periods and current-status snapshots; nulls are avoided here by using narrative status fields where the retained public evidence does not support a precise figure as of 2026-10-17.
    claimRefs:
      - CO003
      - CO004
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO016
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role / status
      - Background or context
      - Founder-market fit / functional coverage
      - Key-person dependency
    rows:
      - - Fabrice Brion
        - Founder and CEO repeatedly cited in retained sources
        - Public face of the 2025 financing narrative and product/manufacturing strategy
        - Strong fit on industrial reliability vision, capital allocation, and commercialization of the integrated PdM stack
        - 'High: the retained evidence over-indexes on Brion relative to the rest of the bench.'
      - - Arnaud Stiévenart
        - Co-founder named in independent profile coverage
        - Co-founder identity is consistent, but current operating remit is not detailed in the retained public pool
        - Supports founder continuity and technical/market origin story
        - 'Medium: founder continuity is positive, but present-day scope is under-disclosed.'
    notes: Publicly retained evidence identifies the founders and CEO prominence, but it does not disclose a full board or broader executive roster.
    enumerationScope:
      coverage: partial
      basis: Rows cover the founders and leaders explicitly named in retained public profile, financing, and company-overview sources as of the run date.
    claimRefs:
      - CO004
      - CO005
      - CO015
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Current evidence
      - Diligence ask
    rows:
      - - Existing shareholders
        - Provided the December 2025 refinancing capital
        - Their willingness to reinvest set the headline unicorn mark
        - Company and independent coverage agree the round was reserved to insiders
        - Obtain investor roster, check whether the round was pro-rata, and confirm governance rights tied to the refinancing.
      - - Employees
        - Participated in the reserved round and remain part of the incentive structure
        - Participation can align retention, but it does not equal external validation
        - Retained financing coverage says employees were included in the round
        - Request option-pool size, dilution, and any secondary liquidity terms.
      - - Prospective external investors
        - Planned target for phase two in 2026
        - They are the clearest missing source of independent price discovery
        - Only intent is public; no named investor or term sheet is in the retained set
        - Confirm pipeline, lead investor status, valuation expectations, and use of proceeds.
      - - Public-market investors
        - Potential phase-three audience via a future IPO
        - An IPO would reset disclosure obligations and valuation comparables
        - Management says the IPO was postponed last spring
        - Clarify conditions for re-opening the IPO track and what milestones must be met first.
      - - Large industrial customers
        - Core commercial constituency for expansion and cross-sell
        - Customer adoption underwrites revenue quality and geography expansion
        - Independent reporting cites large industrial clients, but the retained pool does not expose customer concentration
        - Request top-customer concentration, renewal behavior, and proof of WaaS expansion within the installed base.
    notes: This is a public-evidence stakeholder map rather than a cap table; control percentages, named outside investors, and debt terms are not disclosed in the retained pool.
    enumerationScope:
      coverage: partial
      basis: Rows cover stakeholder groups that appear economically or operationally material in retained financing and company-profile evidence, not an exhaustive cap table.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO015
      - CO016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: The retained evidence shows a long operating history, a visible late-2025 scale step-up, a 2025 IPO delay, and a December 2025 insider-led unicorn round that sets up a still-unproven 2026 external-investor phase.
    data:
      items:
        - year: 2004
          label: Founded in Mons, Belgium
          detail: Independent profile and news sources place I-care’s founding in 2004 in Mons, Belgium.
          tone: positive
          claimRefs:
            - CO004
            - CO005
        - period: Late 2025
          label: Public revenue and order-book scale becomes visible
          detail: Late-2025 company disclosures frame I-care at more than $116 million of annual revenue and more than $232 million of order book.
          tone: positive
          claimRefs:
            - CO010
        - period: Spring 2025
          label: Postpones planned IPO
          detail: Independent and company-linked coverage say I-care postponed an initial public offering before pursuing the insider-led refinancing.
          tone: risk
          claimRefs:
            - CO008
        - period: Late 2025
          label: Links growth to Wi-care as a Service and scaled sensor manufacturing
          detail: Management says Wi-care as a Service, a new-generation sensor line, and factory capacity of up to 2,000 sensors per day are current growth levers.
          tone: positive
          claimRefs:
            - CO003
            - CO011
        - period: Late 2025
          label: Independent profile reports 300,000+ machines monitored
          detail: A third-party profile source describes a 300,000-machine monitored footprint, reinforcing scale while using a different denominator from the 150,000-sensor disclosure.
          tone: positive
          claimRefs:
            - CO012
        - period: Dec 2025
          label: Closes insider-led fundraising and refinancing round
          detail: The round was reserved for existing shareholders and employees and marked the company at about €1 billion / $1.16 billion.
          tone: neutral
          claimRefs:
            - CO007
        - period: Dec 2025
          label: Claims global scale at unicorn milestone
          detail: Late-2025 sources cluster around more than 1,000 employees, 36 offices across 16 countries, and service coverage across 55+ countries or markets.
          tone: positive
          claimRefs:
            - CO006
        - year: 2026
          label: Targets external-investor phase
          detail: Management’s public next step is to attract outside investors in 2026, which would provide more independent price discovery than the 2025 insider round.
          tone: risk
          claimRefs:
            - CO009
            - CO016
    claimRefs:
      - CO004
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO016
callouts:
  - calloutType: strength
    title: Integrated stack plus field coverage is the core identity signal
    body: Across retained official and independent sources, I-care’s clearest differentiation is not a standalone software product but the combination of sensors, analytics, and a large field-engineering layer that can act on the outputs.
    claimRefs:
      - CO001
      - CO003
      - CO006
      - CO011
  - calloutType: risk
    title: The unicorn valuation is real, but external validation is still deferred
    body: The December 2025 round established a unicorn headline, yet it did so with insiders rather than a newly named third-party lead, while the IPO was postponed and the 2026 external-investor phase remains only an intention.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO016
