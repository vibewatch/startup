company:
  name: I-care Group
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer evidence supports a real, global installed base for I-care,
    but most proof is company-issued and cohort-level rather than named-account
    level. The clearest adoption signals are customers in 55+ countries,
    300,000 monitored machines, and expansion mechanisms through Wi-care as a
    Service plus an installed base measured in hundreds of thousands of
    monitored machines and acquired AiSight customer continuity, while retention,
    concentration, and named production references remain undisclosed.
sections:
  - id: customer-base-segmentation
    title: Customer base is broad by use case, but public segmentation is mostly inferred from market and product evidence
    body: >-
      The available evidence points to I-care selling into asset-heavy
      industrial environments where uptime, asset reliability, and safety
      justify predictive-maintenance spending. IBM describes predictive
      maintenance as most relevant in sectors such as energy, transportation,
      manufacturing, and mining, while Grand View Research says manufacturing
      was the largest end market in 2025 and large enterprises held the largest
      enterprise-size share. Against that backdrop, I-care's own product mix
      combines Wi-care sensors, the I-see platform, subscription/service
      packaging, and reliability engineering, which suggests a buyer centered
      on maintenance and reliability leaders rather than a pure software
      self-serve motion. What remains unproven publicly is the revenue mix
      across verticals, plant sizes, and geographies.
    claimRefs: [CU001, CU002, CU003, CU015]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-breadth
    title: Adoption breadth is visible through geography, service footprint, and monitored-machine scale
    body: >-
      I-care has stronger public proof of breadth than of cohort quality. The
      company said in an employee-shareholder announcement that it had customers
      in more than 55 countries, and EU-Startups later repeated the same
      55-country footprint, giving a
      reasonable cross-check that the business operates internationally rather
      than through a handful of isolated projects. Public scale indicators also
      differ across the retained publications: the employee-round announcement
      cited offices in 11 countries, while EU-Startups cited 36 offices across
      16 countries and more than 1,000 employees. A secondary profile also says
      I-care monitors more than 300,000 industrial machines worldwide. These
      signals support real deployment at scale, but they still do not reveal
      active account count, usage frequency, site count, or renewal quality.
    claimRefs: [CU004, CU005, CU007, CU008]
    tableRefs: [TU002]
  - id: expansion-mechanics
    title: Expansion appears to come from subscription packaging, local support density, and acquired customer continuity
    body: >-
      The strongest public expansion mechanisms are commercial packaging and
      acquisition-led continuity. EU-Startups reported that Wi-care as a
      Service is an all-in-one subscription-based solution and linked its
      rollout to strong growth, while the Silicon Valley Investclub profile
      presents PdM as a Service as a bundled hardware-software-services offer.
      Separately, the Sensirion transaction shows a concrete land-and-expand
      path: I-care acquired the AiSight product line, said it already had four
      offices in Germany, and positioned the deal as a way for former
      Sensirion customers to continue their predictive-maintenance strategy.
      That is meaningful commercial proof, but it is still migration/continuity
      evidence rather than disclosed net-new logo wins or quantified expansion
      rates.
    claimRefs: [CU006, CU009, CU010, CU012]
    tableRefs: [TU003]
  - id: durability-and-risk
    title: Durability, retention, and concentration remain the key unresolved customer risks
    body: >-
      The chapter's biggest diligence gap is not whether I-care has customers,
      but whether those customers are durable and diversified. Brussels Times
      and EU-Startups both reported more than €100 million of revenue and more
      than €200 million of order book, which implies a meaningful
      commercial base, yet neither source discloses how much of that backlog is
      recurring subscription, services, hardware, or acquired-customer carryover.
      Grand View Research also notes that predictive-maintenance adoption is
      slowed by high implementation costs and integration complexity, which is a
      real procurement friction for any vendor selling into industrial
      environments. Because the assigned pool contains no public NRR, GRR,
      churn, renewal, or top-customer-share disclosure, concentration risk
      remains materially unquantified.
    claimRefs: [CU008, CU011, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Large industrial enterprises
        - Reliability leaders and maintenance teams / plant users / enterprise or site operations budget
        - Reduce downtime and improve machine health on critical assets
        - Manufacturing is the largest predictive-maintenance end market and large enterprises are the biggest buyer cohort
        - Fits I-care's global service footprint and enterprise-scale order-book claims
        - No disclosed revenue split by enterprise size, geography, or vertical
      - - Energy, transportation, mining, and other asset-heavy operators
        - Operations and maintenance leaders / engineering and field teams / asset-owner budget
        - Condition monitoring and predictive maintenance on uptime-critical equipment
        - IBM lists these sectors among common predictive-maintenance users
        - Broadens the addressable segment beyond factory-floor manufacturing
        - No public vertical mix or named-account evidence in the assigned pool
      - - Former AiSight / Sensirion installed base in Germany
        - Existing condition-monitoring customers / maintenance users / continuity and migration budget
        - Continue predictive-maintenance programs after Sensirion exited the category
        - I-care said it already had four German offices and that these customers sit in complementary industrial segments
        - Clear M&A-led cross-sell and continuity surface
        - No disclosed customer count, migration rate, or expansion revenue
      - - SME / mid-market plants reached via subscription packaging
        - Plant managers and maintenance leads / technician users / operating budget
        - Lower-entry deployment of hardware, software, and expert services
        - Market research says subscription models reduce entry barriers for smaller organizations
        - Could widen the funnel beyond very large enterprises
        - No verified public disclosure of I-care's actual SME mix
    notes: >-
      Rows synthesize company-specific evidence with market-side buyer evidence.
      Null customer-mix metrics reflect the absence of disclosed segment revenue
      or account counts in the assigned pool.
    claimRefs: [CU001, CU002, CU003, CU006, CU009, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Customer footprint
        - 55+ countries
        - Official article date not stated; later report URL dated 2025/12
        - I-care employee-round announcement; EU-Startups
        - High
        - Supports a globally distributed customer base rather than a single-market business
        - Active account count, site count, and revenue per geography
      - - Local support footprint
        - Offices in 11 countries in the official article; 36 offices in 16 countries in the later report
        - Official article date not stated; later report URL dated 2025/12
        - I-care employee-round announcement; EU-Startups
        - Medium
        - Indicates heavier field coverage and implementation/support capacity over time
        - Office productivity, customer density, and support load per office
      - - Installed machine base
        - 300,000+ industrial machines monitored worldwide
        - Profile date not stated; accessed 2026-10-17
        - Silicon Valley Investclub
        - Medium
        - Suggests a large telemetry surface and ongoing post-deployment operations
        - Paying-site count and overlap between machines and customer accounts
      - - Commercial backlog
        - Revenue >EUR100m and order book >EUR200m
        - EU-Startups URL dated 2025/12; Brussels Times article date not stated
        - EU-Startups; Brussels Times
        - Medium
        - Implies meaningful commercial traction and future workload visibility
        - Recurring vs one-time mix and customer concentration within the backlog
      - - Subscription-led deployment capacity
        - Wi-care as a Service rollout plus sensor production capacity up to 2,000 per day
        - EU-Startups URL dated 2025/12
        - EU-Startups
        - Medium
        - Creates a plausible mechanism for faster multi-site rollout and expansion
        - Actual deployed-sensor volume and subscription penetration
    notes: >-
      The table preserves the original metric basis from public sources.
      Growth/scale signals are not equivalent to retention, active usage, or
      revenue quality, so missing denominators are called out explicitly.
    claimRefs: [CU004, CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Former Sensirion Connected Solutions / AiSight customers
        - Industrial monitoring customers in complementary German segments
        - Continuation of existing predictive-maintenance programs after product-line acquisition
        - Existing production programs implied by continuity language, not a new pilot
        - I-care gained a concrete migration and cross-sell surface in Germany
        - No customer names, counts, or conversion economics disclosed
      - - Publicly disclosed global customer base
        - Multinational industrial fleets across 55+ countries
        - Ongoing predictive-maintenance and reliability services
        - Production-scale customer claim, not cohort analytics
        - Demonstrates international commercial reach
        - No named references, active-account denominator, or renewal data
      - - Installed machine estate tied to Wi-care and I-see
        - Asset-heavy plants using monitoring hardware plus analytics
        - Monitoring of 300,000+ industrial machines worldwide
        - Production-scale operations signal, not pilot evidence
        - Large telemetry base supports land-and-expand potential
        - Machine count is not customer count and comes from a secondary profile
    notes: >-
      Public customer proof in the assigned pool is sample-based and mostly
      cohort-level. The table records the strongest available production signals
      without overstating them as named-reference evidence.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample of publicly documented customer-proof surfaces in the assigned
        pool, combining migration evidence, geographic footprint claims, and
        installed-base scale rather than a full customer registry.
    claimRefs: [CU004, CU007, CU009, CU010, CU013]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public customer journey runs from asset-heavy industrial targeting to
      subscription-led deployment, installed-base monitoring, and M&A-led
      expansion.
    data:
      items:
        - label: Asset-heavy target sectors
          actor: Buyer / segment selection
          phase: Targeting
          touchpoints:
            - Manufacturing is the largest predictive-maintenance end market in Grand View Research's 2025 split.
            - IBM lists energy, transportation, manufacturing, and mining as common predictive-maintenance sectors.
        - label: Reliability problem identification
          actor: Maintenance and engineering teams
          phase: Evaluation
          touchpoints:
            - Predictive maintenance relies on IoT sensors and real-time condition monitoring.
            - Vibration analysis is a common technique for rotating equipment such as pumps, compressors, and motors.
        - label: Full-stack deployment
          actor: I-care platform and field-services motion
          phase: Deployment
          touchpoints:
            - Wi-care sensors, the I-see platform, and expert services form the operating bundle.
            - The offer is positioned around reducing downtime and improving machine health.
        - label: Subscription packaging
          actor: Payer and commercial buyer
          phase: Commercial rollout
          touchpoints:
            - Wi-care as a Service is described as an all-in-one subscription-based solution.
            - Subscription models can lower entry barriers for smaller organizations.
        - label: Installed-base operations
          actor: Deployed customer base
          phase: Production use
          touchpoints:
            - I-care says it serves customers in more than 55 countries.
            - A secondary profile says the company monitors more than 300,000 industrial machines worldwide.
        - label: Expansion and migration loop
          actor: Customer success and M&A
          phase: Expansion
          touchpoints:
            - Former Sensirion customers were offered continuity for their predictive-maintenance strategy.
            - I-care said those customers sit in industrial segments complementary to its existing footprint.
    claimRefs: [CU001, CU002, CU004, CU006, CU007, CU009, CU010, CU015]
callouts:
  - calloutType: risk
    title: Key customer diligence risk
    body: >-
      Public evidence confirms breadth, but not customer durability. The
      assigned pool does not disclose NRR, GRR, churn, renewal rate, named
      production references, or top-customer concentration, so the quality of
      I-care's installed base is still materially under-proven.
    claimRefs: [CU013, CU014]
