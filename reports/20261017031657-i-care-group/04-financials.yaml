artifact: financials
slug: i-care-group
runDate: 2026-10-17
company:
  name: I-care Group
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a real multi-product revenue model and meaningful scale, but it does
    not support a clean underwriting model for realized pricing, gross margin, or runway. I-care's
    2025 insider-led round, 2026 U.S. expansion spend, and holding-company debt figures indicate
    continuing capital needs even as reported revenue and order-book figures have crossed the
    nine-digit euro threshold.
sections:
  - id: revenue-model
    title: Revenue model is diversified, but public mix disclosure is thin
    body: >-
      The public record points to a bundled revenue model rather than a single pure-software SKU.
      G2 describes I-care as combining "patented IoT monitoring hardware, AI-driven analytics
      software, and global engineering expertise," while EU-Startups says the company has rolled
      out "Wi-care as a Service," described as an all-in-one subscription offer. Silicon Valley
      Investclub separately lists PdM as a Service, reliability engineering, training, and the SDT
      ultrasound line, which implies monetization across hardware, software, field services, and
      adjacent products. What remains undisclosed is the actual revenue mix across those streams,
      the share of recurring subscription revenue versus project/services revenue, and whether list
      positioning converts into realized pricing power. That limits confidence in revenue quality:
      the model looks broader than a single-tool sale, but the public evidence does not quantify
      which streams are highest-margin, recurring, or most scalable.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-capital
    title: Traction is visible, but expansion and financing signals imply continuing capital intensity
    body: >-
      I-care has credible public scale signals, but they should be read alongside investment needs.
      EU-Startups reports consolidated annual revenue above EUR100 million and an order book above
      EUR200 million, and the Silicon Valley Investclub profile separately lists 2024 revenue of
      $110 million+, a $1.16 billion valuation, and roughly $95 million of cumulative funding.
      At the same time, Pulse2 reports a fresh $25 million investment into the U.S. subsidiary and
      says the company has already committed more than $50 million over several years to technology
      development and manufacturing. EU-Startups also says the December 2025 EUR20 million round
      was reserved for existing shareholders and employees, that external investors were still a
      2026 objective, and that the IPO had been postponed. Those facts support growth momentum, but
      they also imply that scaling depends on continued spending for local teams, manufacturing
      capacity, and commercial execution rather than software-only self-funding dynamics.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: underwriting-gaps
    title: Unit-economics underwriting is blocked by missing margin, pricing, and runway disclosure
    body: >-
      The biggest underwriting constraint is not lack of activity; it is lack of decision-grade
      financial detail. Companyweb's holding-company page shows 2024 debt of EUR17.1 million,
      equity of EUR69.2 million, a small holding-company turnover base, and only 3.8 FTE, which is
      useful for legal-entity context but not a substitute for group cash burn or consolidated gross
      margin. Public profiles also advertise pricing resources without exposing actual rate cards,
      while industry sources confirm a favorable predictive-maintenance spending backdrop and a
      buyer decision frame tied to bottom-line asset criticality. That is enough to frame the business model,
      but not enough to estimate realized ASPs, hardware gross margin, services utilization,
      acquisition economics, CAC payback, or runway. The financial verdict is therefore positive on
      demand and breadth of offering, but still conditional until management discloses mix, margin,
      and funding-need detail.
    claimRefs: [CI011, CI012, CI013, CI014, CI015]
callouts:
  - calloutType: insight
    title: Revenue quality is plausible, not proven
    body: >-
      The source set supports a hybrid hardware-plus-software-plus-services model and meaningful
      demand, but not the recurring-revenue share or gross-margin shape that would justify a SaaS
      or premium-industrial multiple without discount.
    claimRefs: [CI001, CI002, CI003, CI011, CI015]
  - calloutType: risk
    title: Capital adequacy still hinges on nonpublic data
    body: >-
      Public evidence shows ongoing investment in U.S. expansion and manufacturing plus a postponed
      IPO and a still-pending external raise, but it does not disclose cash, burn, debt covenants,
      or next-round triggers.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - [Wi-care as a Service, "Subscription bundle combining hardware, software, and expert services", "Subscription / contract", "Publicly confirmed; volume and realized pricing undisclosed", "Medium: existence is public, economics are not", "Disclose ARR, contract length, renewal, and hardware-versus-service cost allocation for WaaS customers"]
      - [Wi-care sensors, "Device sale or device-led monitoring deployment", "Per sensor / deployment", "New-generation sensors in production; capacity cited publicly, realized pricing not disclosed", "Medium: product exists, monetization terms undisclosed", "Provide sensor ASP, hardware gross margin, and attach-rate into analytics or service contracts"]
      - [I-see analytics, "Analytics / monitoring software attached to machine data", "Per site / asset / user basis not disclosed", "Publicly confirmed platform; no standalone commercial terms disclosed", "Low-Medium: software role is clear, billing basis is not", "Share software packaging, standalone pricing, and percentage of customers buying software without broader services"]
      - [Reliability engineering services, "On-site engineering, reliability, and support work", "Project / retainer / labor basis not disclosed", "Publicly confirmed service line; U.S. team expansion implies ongoing services demand", "Medium: service line exists, utilization and margin unknown", "Provide services revenue share, gross margin, engineer utilization, and backlog conversion assumptions"]
      - ["Training, ultrasound, and adjacent product lines", "Training/certification plus acquired or adjacent reliability products", "Course / equipment / service basis not disclosed", "Publicly listed in profiles, but revenue contribution undisclosed", "Low: existence visible, contribution unknown", "Quantify SDT contribution, training revenue, and cross-sell rate into the core platform"]
    notes: >-
      Public sources confirm the presence of these streams but not their mix, contract structure, or
      realized pricing; rows distinguish observed offerings from missing economics.
    claimRefs: [CI001, CI002, CI003, CI004, CI011]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Public pricing signal
      - Contract / unit basis
      - List vs realized pricing
      - Source / implication
    rows:
      - [Wi-care as a Service, "Subscription-based solution publicly described", "All-in-one contract basis; exact billing unit not disclosed", "List and realized pricing both unavailable publicly", "EU-Startups confirms subscription positioning, but not ASP or discounting"]
      - [Integrated asset-health solution, "Pricing pages are advertised but no public price points are exposed in assigned sources", "Implementation-specific basis likely, but unsupported publicly", "Only the existence of pricing information is visible", "G2 profile links pricing resources, so diligence should request actual rate cards and discount corridors"]
      - [Engineering / reliability services, "No public rate card in assigned sources", "Likely scoped by labor, site, or program; not publicly evidenced", "Realized pricing unknown", "U.S. expansion into engineering and reliability teams suggests labor-backed delivery remains commercially important"]
      - [Hardware / sensors, "Public production and product claims but no public price point", "Per unit / deployment basis not disclosed", "Realized margin and bundled discounting unknown", "Hardware economics cannot be separated from software/services based on current evidence"]
    notes: >-
      This table records monetization signals, not verified price lists; the assigned source pool does
      not expose actual rate cards or discount terms, so unknowns are preserved explicitly.
    claimRefs: [CI002, CI003, CI005, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Consolidated revenue scale", "Over EUR100M annual revenue; Silicon Valley Investclub separately lists 2024 revenue at $110M+", Medium, "Shows real scale, but source chain and accounting basis remain partly indirect", "Provide FY2025 audited consolidated revenue with segment split and revenue-recognition policy"]
      - ["Demand / backlog proxy", "Order book above EUR200M; separate profile lists $220M+", Medium, "Suggests forward demand and service visibility, but timing and conversion remain unknown", "Disclose backlog composition, cancellation rights, and expected conversion window"]
      - ["Holding-company leverage snapshot", "I-Care Holding 2024 debts EUR17.1M; equity EUR69.2M", Medium, "Useful legal-entity context, but not a substitute for consolidated debt or net cash", "Provide group debt schedule, covenants, leasing, and cash balance by quarter"]
      - ["Near-term expansion spend", "$25M invested into the U.S. subsidiary in July 2026", Medium, "Signals capital deployment into GTM and service capacity before any disclosed external raise closes", "Explain source of funds, expected payback, and whether this spend is one-off or part of a larger multi-year plan"]
      - ["Manufacturing / capex intensity", "More than $50M invested over several years in technology development and manufacturing", Medium, "Implies gross-margin and return-on-capital questions that differ from pure software models", "Provide plant utilization, capex cadence, depreciation burden, and hardware gross-margin bridge"]
      - ["Gross margin, CAC payback, and runway", null, Low, "Core underwriting metrics are absent from public sources, so valuation and financing risk cannot be normalized", "Provide gross margin by stream, CAC, payback, burn, runway, and next-round trigger thresholds"]
    notes: >-
      Null means the assigned public evidence did not disclose the metric. Holding-company figures are
      not treated as group-level substitutes, and separate third-party revenue figures are preserved as
      corroborating proxies rather than audited truth.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public sources support a bundled path from machine monitoring to analytics and engineering
      delivery, but they do not quantify realized pricing or gross-profit split by stream.
    data:
      nodes:
        - label: Critical industrial assets
          description: Customer sites with uptime-sensitive machinery create the economic problem I-care sells into.
          claimRefs: [CI013, CI014, CI015]
        - label: Wi-care sensors and monitoring
          description: Patented IoT hardware captures condition data from monitored machines.
          claimRefs: [CI001, CI003]
        - label: I-see analytics layer
          description: AI analytics aggregates multiple maintenance signals and produces predictive insights.
          claimRefs: [CI001, CI003]
        - label: Reliability engineering workflow
          description: Engineers translate alerts into planning, support, and field execution.
          claimRefs: [CI001, CI005]
        - label: Contracted monetization
          description: Revenue can come from subscription-style WaaS, hardware, and engineering/service work.
          claimRefs: [CI002, CI004]
        - label: Gross-profit outcome
          description: Margin quality depends on mix, utilization, and hardware-versus-services economics that remain undisclosed publicly.
          claimRefs: [CI011, CI012]
      edges:
        - from: Critical industrial assets
          to: Wi-care sensors and monitoring
          relationship: Monitoring deployment
          claimRefs: [CI001, CI015]
        - from: Wi-care sensors and monitoring
          to: I-see analytics layer
          relationship: Machine data feeds analytics
          claimRefs: [CI001, CI003]
        - from: I-see analytics layer
          to: Reliability engineering workflow
          relationship: Predictive outputs inform intervention planning
          claimRefs: [CI001, CI003]
        - from: Reliability engineering workflow
          to: Contracted monetization
          relationship: Services and support convert workflow into billable delivery
          claimRefs: [CI001, CI005]
        - from: Contracted monetization
          to: Gross-profit outcome
          relationship: Mix determines revenue quality and margin path
          claimRefs: [CI002, CI011, CI012]
    approximationNotes: >-
      This figure is a business-model bridge, not a quantified waterfall. Public evidence confirms
      the operational steps and offerings, but not the revenue or margin share at each step.
    claimRefs: [CI001, CI002, CI003, CI011, CI012]
