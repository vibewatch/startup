chapter:
  number: 6
  title: Customers
  summary: Blitzy sells to Global 2000 enterprises with large legacy codebases in regulated industries, and offers named, quantified proof — State Street, QAD (24-to-6-month iOS-to-Android migration), Builders FirstSource (3x velocity, 120 engineers), and GNP, Mexico's largest insurer (1,000+ developer pilot, 5-10x velocity) — alongside a claimed dozens of Global 2000 customers across 10+ industries. The adoption story is real and high-value, but customer count, net revenue retention, churn, and pilot-to-production conversion are undisclosed, and several flagship results are recent and partly pilot-stage, leaving durability and concentration as the central diligence questions.
sections:
- id: section-1
  title: Customer segmentation and who buys Blitzy
  body: 'Blitzy sells to Global 2000 enterprises that carry large, complex legacy codebases, with named adoption concentrated in regulated and code-heavy industries: financial services (State Street), enterprise software (QAD), building materials (Builders FirstSource), and insurance (GNP, described as Mexico''s largest insurer). The company states it serves dozens of Global 2000 companies across more than ten industries, but does not disclose an exact customer count, which removes the denominator behind every adoption and retention metric. The economic buyer is typically engineering and technology leadership — CTOs, CIOs, and VPs of Engineering — while the end users are the enterprise''s own software engineers, who at Builders FirstSource numbered 120 moving into AI-native workflows. Named deployments span the United States and Mexico, giving early international reach, and the concentration in finance and insurance fits Blitzy''s compliance posture (SOC 2 Type II, ISO 27001) and its legacy-modernization value proposition. State Street and GNP carry strategic reference value in regulated verticals well beyond their direct revenue. The segmentation table and journey-map figure below lay out segments, buyers, strategic value, and the path from discovery to expansion.'
