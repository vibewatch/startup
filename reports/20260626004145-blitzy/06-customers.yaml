- id: section-2
  title: Adoption trajectory and named customer proof
  body: Blitzy's adoption story rests on a small set of named, quantified, recent engagements that are unusually strong for a company founded in late 2023. QAD compressed a 24-month iOS-to-Android migration to roughly six months — about 3x faster market access. Builders FirstSource reports 3x development velocity in its first three months with 120 engineers in AI-native workflows. GNP ran a 1,000-plus developer pilot citing 5-10x velocity on legacy mainframe modernization, and a Fortune 100 customer reportedly had 33 million lines of mainframe code reverse-engineered — work estimated at nine months — in about 3.5 days. Underpinning these, Blitzy reports more than one billion lines of enterprise code processed since September 2025. The evidence is named and consistent around 3-10x velocity, and independent and trade press corroborate the existence and scale of the relationships even where the metrics themselves are company- or customer-supplied. Importantly, several flagship engagements are explicitly pilot or early-stage, so production durability is only partly proven. The named-customer-proof table (an enumeration of accounts, stage, and outcome) and the adoption funnel and proof-matrix figures organize this evidence by stage and reference quality.
