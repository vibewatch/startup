- id: section-3
  title: Retention, satisfaction, and review signal
  body: The weakest part of the customer picture is durability evidence. Blitzy does not disclose net revenue retention, gross retention, churn, or renewal rates, and typical contract lengths and renewal terms are not public; the annual platform tiers imply yearly commitments, but no cohort renewal data is available to confirm whether customers expand or stall. Direct third-party reviews of Blitzy are scarce on mainstream platforms such as G2, TrustRadius, and Gartner Peer Insights, reflecting an enterprise, sales-led motion rather than self-serve adoption — which limits independent satisfaction signal and means satisfaction must be inferred from named-customer testimonials. Public reviews of comparable AI coding tools like GitHub Copilot show enterprises prize reliability, security, and integration, the same criteria Blitzy must satisfy at far higher contract values. No public churn, failed-pilot, or complaint reporting on Blitzy was found, but that absence is a diligence limitation, not positive proof of retention. The retention/satisfaction table and retention cohort figure below mark each durability metric as null with an explicit diligence ask, so the reader can see exactly what must be requested in a data room.
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU023
  - CU030
  - CU022
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: section-4
  title: Expansion, concentration, and customer verdict
  body: 'On expansion and concentration, the product ladder from a free Reverse Engineer tier through Structured Pilot to Commercial, Enterprise, and Transformation, combined with the pilot-to-rollout pattern at GNP and Builders FirstSource, indicates a land-and-expand motion within accounts. That upside is real but unquantified: without net revenue retention it is impossible to confirm whether pilots expand or stall after initial wins, and with only a handful of named accounts public and total customer count undisclosed, revenue concentration among top customers cannot be assessed — a material risk for an early-stage company writing large contracts. Strategic investors such as Liberty Mutual and Erie may channel Blitzy into insurance accounts, which aids access but could concentrate dependence, and enterprise adoption in regulated sectors carries security-review, procurement, and change-management friction that lengthens cycles despite strong ROI claims. The expansion-and-concentration table maps each driver and risk to a diligence path. On balance, Blitzy''s customer proof is unusually strong for its stage — named, quantified, and multi-industry — but durability and concentration remain unproven and are the central customer diligence asks.'
