      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Qualified Buy, conditioned on diligence
            body: >-
              Blitzy is a high-quality company at a full price with low financial transparency. The call is a
              medium-confidence Buy that converts to conviction if ARR, margin, and retention validate — and to a pass
              if they disappoint.
            calloutType: recommendation
            claimRefs:
              - CV003
