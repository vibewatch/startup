      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Two exposures outside Blitzy's control
            body: >-
              Model dependency and autonomous-code reliability are the highest residual risks; both depend on third
              parties (model providers) and an unsolved industry problem (reliable AI code at scale).
            calloutType: risk
