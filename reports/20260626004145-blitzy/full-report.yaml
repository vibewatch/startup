              uses different base years, so the chapter preserves the spread rather than averaging it into false
              precision. A larger framing comes from the adjacent enterprise software maintenance and
              legacy-modernization pool, on the order of $200 billion per year, which Blitzy's per-line economics attack
              directly. Serviceable and obtainable layers cannot be precisely isolated from public data: a defensible
              SAM is the share of the modernization pool addressable by autonomous per-line automation, and Blitzy's
