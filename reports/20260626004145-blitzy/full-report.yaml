chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and corporate snapshot
        blocks:
          - type: paragraph
            body: >-
              Blitzy is a Cambridge, Massachusetts company that markets an autonomous software development platform
              purpose-built for the large, legacy enterprise codebases that frontier foundation models have never been
              trained on. Founded in November 2023 by Brian Elliott and Sid Pardeshi, the company positions itself not
              as a developer copilot but as a system that reverse-engineers an organization's existing code, builds a
              dynamic knowledge graph of the estate, and then orchestrates thousands of AI agents in parallel for days
              to weeks of continuous inference. The platform draws on models from Google, Anthropic, and OpenAI and
              reports calling them more than 100,000 times per run, claiming to deliver more than 80% of a project's
              code autonomously with end-to-end testing. Blitzy advertises a record SWE-Bench Pro score of 66.5% and up
              to 5x engineering velocity. By mid-2026 the company employs roughly 80 people, having more than doubled
              headcount in six months, and reports deployments across ten Global 2000 industries. The snapshot KPI table
              and figure below separate publicly supportable facts from undisclosed private metrics such as absolute ARR
              and the cap table.
