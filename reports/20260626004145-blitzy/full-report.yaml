      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The central operational risk is reliability: independent enterprise data shows only a minority of
              AI-generated code merges without human rework, and at 100-million-line scale an undetected error is
              costly, with a high-profile failure at a regulated customer capable of outsized reputational and sales
              damage. Generated code can also carry security vulnerabilities; the OWASP LLM Top 10 and MITRE ATT&CK
              frameworks define a threat surface that Blitzy's compile-test-validate gate must continuously cover, and
              customer-code confidentiality is a top enterprise concern that Blitzy addresses with SOC 2 Type II, ISO
              27001, and a no-training-on-customer-code policy — controls that are real but not publicly audited. As a
              platform performing massive parallel inference, Blitzy faces availability risk both from its own
              orchestration of more than 100,000 model calls per execution and from upstream model-provider outages, and
              that orchestration complexity grows with deal size. No public security incident or breach affecting Blitzy
              was found, consistent with its compliance posture, though the company is young and lightly covered. The
              operational/quality/security register below ranks each failure mode by severity with its mitigation
              maturity and unresolved gap.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR036
              - CR038
          - type: table
            tableRef: TR002
            claimRefs:
