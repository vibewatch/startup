      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Blitzy operates in an unsettled regulatory and legal environment. The EU AI Act establishes tiered
              obligations for AI systems, and autonomous code generation deployed inside regulated EU enterprises could
              attract transparency and risk-management duties. U.S. Copyright Office guidance that purely AI-generated
              output may not be copyrightable creates ownership uncertainty over the very code Blitzy delivers, a
              question customers in IP-sensitive industries will press. Ingesting and reverse-engineering customer code
              can implicate GDPR and the CCPA where repositories embed personal data, and enterprise customers will flow
              processor obligations down to Blitzy. Aggressive AI performance claims — the 3-10x velocity multiples —
              can attract consumer-protection scrutiny, with the FTC signaling it polices unsubstantiated AI marketing.
              On the positive side, no public litigation, enforcement action, or regulatory proceeding against Blitzy
              surfaced in court-record and news searches as of June 2026, and NIST's AI Risk Management Framework and
              CISA's AI guidance offer recognized governance scaffolding that enterprise buyers will expect Blitzy to
              align with. The regulatory/legal risk register below enumerates each rule, its status, likelihood,
              severity, mitigation, and residual exposure, ordered by severity.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
