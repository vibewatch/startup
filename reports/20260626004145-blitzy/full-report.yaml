            claimRefs:
              - CV013
              - CV009
              - CV018
      - number: '8.3'
        title: Scenarios, drivers, and return range
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the outcome. In the bull case, Blitzy converts its large pilots (GNP's 1,000
              developers, Builders FirstSource's rollout) into production contracts, sustains capital efficiency, and
              compounds into a category-defining enterprise platform, justifying multiple expansion from the $1.4B mark.
              In the base case, it grows steadily in regulated enterprises but absorbs margin pressure from inference
              costs and competition, roughly supporting the current valuation over time. In the bear case, a reliability
              or model-cost shock, slow pilot conversion, or competitive multiple compression triggers a flat or down
              round and a markdown — and because this is a private growth-stage equity position, downside protection is
              limited to whatever (undisclosed) preference terms apply. The valuation is most sensitive to ARR growth
              and retention, gross margin driven by inference cost, pilot-to-production conversion, and the revenue
              multiple the market assigns; if the category re-rates downward, even strong execution could leave the
              entry mark looking full. The scenario table and valuation/return-range figure below make the assumptions
              and the spread of outcomes explicit, while acknowledging that the implied revenue multiple cannot be
              computed until ARR is disclosed.
            claimRefs:
              - CV010
              - CV011
