      - number: '3.4'
        title: Status quo, category creation, and durability verdict
        blocks:
          - type: paragraph
            body: >-
              Beyond named vendors, Blitzy's largest and most durable competitor is the status quo itself: scarce,
              expensive senior engineers and multi-year systems-integrator modernization programs that perform today the
              work Blitzy proposes to automate. That status quo is also Blitzy's strongest return-on-investment
              argument, since named proof points show multi-month migrations compressed into days. Blitzy's deliberate
              enterprise-only focus narrows its overlap with consumer and prosumer tools, but it concentrates revenue on
              a smaller set of large, slow-moving buyers and lengthens sales cycles. GitHub Copilot's Microsoft backing
              compounds the threat: procurement, security, and bundling advantages inside enterprises already running
              Azure, GitHub Enterprise, and Office make it easy to add Copilot seats and harder for a challenger to
              displace incumbent tooling. The central durability question is whether Blitzy is genuinely creating an
              'autonomous software development' category or merely occupying a premium niche that incumbents will
              eventually enter; if they bundle multi-agent autonomy into per-seat subscriptions, Blitzy could face a
              price war on its $500K-$50M engagements. By orchestrating multiple frontier models rather than betting on
              one, Blitzy hedges single-vendor model risk but cannot claim proprietary model superiority, so its
              defensibility ultimately rests on orchestration depth, accumulated enterprise code understanding, and
              regulated-industry trust rather than on the models themselves.
            claimRefs:
              - CP034
              - CP032
              - CP031
              - CP026
              - CP033
              - CP035
