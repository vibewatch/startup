              - CR012
              - CR013
      - number: '7.4'
        title: Partner, dependency, and financial risk
        blocks:
          - type: paragraph
            body: >-
              Blitzy's most severe dependency is the foundation-model layer: it orchestrates OpenAI, Google, and
              Anthropic models rather than owning one, ceding control of cost, availability, and capability, and
              provider documentation confirms that pricing and usage policies are set unilaterally. If providers raise
              inference prices, restrict access, or change terms, Blitzy's gross margin and product capability are
              directly affected with limited near-term substitutes, though using multiple providers and a growing
              open-model supply partially hedges single-vendor risk. Massive parallel inference also implies heavy
              cloud-compute reliance, a second infrastructure concentration. On the financial side, inference-driven
              variable cost and forward-deployed delivery make Blitzy more capital-intensive than pure software, raising
              burn risk if growth outpaces efficiency; gross margin could compress under rising model costs,
              services-heavy deals, or competitive pricing pressure from Cursor, Replit, GitHub Copilot, OpenAI Codex,
              and Anthropic Claude Code. A $1.4B valuation on roughly $204M raised implies significant forward
              expectations, so a stumble could trigger down-round risk, and undisclosed burn and runway mean financing
              dependency cannot be quantified. The partner/dependency register below ranks each counterparty and
              concentration risk by severity.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
