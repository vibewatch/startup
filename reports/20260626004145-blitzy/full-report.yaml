  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Blitzy operates in the AI code tools and autonomous software development market, a fast-growing subset of
              the broader generative-AI software category that focuses specifically on writing, migrating, testing, and
              maintaining enterprise code. The relevant included spend is AI-assisted code generation, legacy
              modernization, and maintenance automation; general IT services, cloud infrastructure, and non-code AI
              applications fall outside the boundary. Critically, Blitzy's true competitive set is not only other AI
              vendors but the status quo: in-house engineering headcount, offshore systems integrators, and developer
              copilots such as GitHub Copilot and Cursor. Because Blitzy prices per line of code onboarded and generated
              and targets enterprise-wide modernization rather than developer seats, its economic frame is the roughly
              $200 billion-per-year enterprise software maintenance pool more than the narrower copilot market. Defining
              this boundary before sizing it matters, because conflating copilots, agents, and modernization spend is
              exactly what makes published estimates diverge. The market definition table below separates included from
              excluded spend and names the substitutes Blitzy must out-compete on cost and trust.
