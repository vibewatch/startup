            body: >-
              Blitzy's cost structure differs fundamentally from a pure-software business. Its largest variable cost is
              third-party model inference: the platform makes more than 100,000 model calls per run across OpenAI,
              Google, and Anthropic, so those vendors' inference prices flow directly into Blitzy's gross margin and
              create a structural cost dependency the company does not control. Forward-deployed engineering to onboard
              massive legacy estates adds a services-heavy layer that can dilute software-like margins unless
              productized, and SOC 2 Type II and ISO 27001 compliance impose ongoing but table-stakes costs for
              regulated revenue. Against this, Blitzy claims that its gross margin, inclusive of inference and
              forward-deployed costs, looks closer to a true SaaS business than to code-generation tools — a notable
              assertion, but one made without an absolute figure and against a backdrop of uneven enterprise GenAI ROI
