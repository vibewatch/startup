      - number: '2.4'
        title: Growth drivers, adoption constraints, and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The market's structural drivers are powerful: the rising cost and scarcity of senior engineers, a large
              and aging base of legacy code, continued frontier-model capability gains, and board-level AI mandates, all
              reinforced by IDC's multi-hundred-billion-dollar AI spending trajectory and survey evidence that most
              professional developers already use AI coding tools. But the constraints are equally real and define the
              diligence frontier. Enterprise GenAI ROI is uneven — copilots absorb a majority of AI spend while only
              about a quarter of AI-generated code merges without rework — and BCG finds most enterprises have not yet
              captured scaled value. Switching costs from entrenched SDLC tooling and systems-integrator relationships
              are material, and regulation such as the EU AI Act and the NIST AI RMF raises the compliance bar (favoring
              certified vendors but lengthening sales cycles). Published estimates contradict one another because of
              inconsistent category definitions, and granular SAM/SOM inputs are simply not public. The
              drivers-and-constraints table and value-chain funnel below capture these forces, and the chapter flags
              budget-shift reality and sizing inputs as unresolved gaps.
