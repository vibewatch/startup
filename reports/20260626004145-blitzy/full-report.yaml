      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Blitzy's leadership story is unusually concentrated, which is both its origin advantage and a core
              diligence risk. Co-founder and CEO Brian Elliott is a serial entrepreneur and former US Army Ranger whose
              Joint Special Operations Command background informs the company's emphasis on large-scale orchestration
              under real constraints. Co-founder and CTO Sid Pardeshi is a former NVIDIA Master Inventor who spent
              nearly eight years at the company, was hand-picked into a private internal machine-learning research
              distribution circulated by Jensen Huang in 2015-2016, and holds more than 27 patents spanning neural
              networks, image generation, and AI-driven interface translation. The two met as technical students at
              Harvard Business School, where they formed both the personal bond and the contrarian technical thesis that
              became Blitzy. Public materials, however, name no broader executive bench, board-independent directors, or
              functional leaders, so strategy, fundraising, model partnerships, and technical direction appear to rest
              with two people. That concentration is common for a company barely two years past founding, but it
              elevates key-person risk and governance opacity as questions later chapters must revisit.
