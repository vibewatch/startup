      - number: '3.3'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              The durability question turns on switching costs, distribution power, and supply access. Blitzy's
              knowledge-graph onboarding and per-line engagements create higher switching costs than an easily swapped
              copilot, but they also impose a longer, more expensive sales cycle, and enterprises can multi-home — using
              copilots for daily assist and Blitzy for large modernization programs — which blunts direct displacement.
              Distribution power favors the incumbents: GitHub/Microsoft and the frontier-model vendors reach developers
              at a scale Blitzy cannot match, so Blitzy must win on depth in legacy enterprise code rather than reach.
              Because Blitzy and its rivals all depend on the same OpenAI, Google, and Anthropic models, supply access
              is broadly shared, and differentiation must come from orchestration rather than model exclusivity. That
              exposes two adverse risks: frontier-model vendors commoditizing autonomous coding by bundling agentic
              features, and incumbents like Copilot adding multi-agent, long-horizon capabilities at lower price points.
              The moat register and readiness KPIs below grade each moat claim against its threat and flag incumbent
              response speed as an unresolved gap.
