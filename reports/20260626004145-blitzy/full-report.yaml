          - type: callout
            title: The mark prices in unverified growth
            body: >-
              A $1.4B valuation on ~$204M raised, with ARR undisclosed and no filings, means the price leads the public
              evidence — disciplined, information-conditioned entry is essential.
            calloutType: risk
