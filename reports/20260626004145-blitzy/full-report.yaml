        title: Funding, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Blitzy's capital base stepped up sharply in May 2026, when it announced a $200 million growth round at a
              $1.4 billion valuation led by Northzone, with partner Sanjot Malhi calling it a paradigm-shifting product
              in Autonomous AI Coding. The round brought total funding above $204 million and minted Blitzy as Boston's
              newest unicorn. New investors included PSG, Battery Ventures, Jump Capital, Morgan Creek Digital, and
              Defiant; existing backers Flybridge, Link Ventures, NFX, Picus Capital, and Venture Guides re-upped; and
              strategic investors Liberty Mutual Strategic Ventures, Erie Strategic Ventures, and BAL Ventures joined, a
              signal of insurance and enterprise pull given Blitzy's stated focus on regulated industries. The company
              says it will spend the capital expanding its research team and scaling go-to-market. Blitzy also markets
              capital efficiency, claiming $2.91 of ARR generated per dollar burned since January 2025, though absolute
