      - number: '5.1'
        title: What Blitzy is and the jobs it performs
        blocks:
          - type: paragraph
            body: >-
              Blitzy is an autonomous software-development platform whose product, in customer-workflow terms, is the
              conversion of slow, expensive human engineering on large legacy codebases into fast, machine-driven
              delivery of production code. Rather than assisting a single developer inside an editor, the platform takes
              an enterprise objective — migrate an application, modernize a mainframe, refactor a monolith, or build a
              feature — and autonomously plans, writes, compiles, tests, and validates the code, with human engineers
              concentrated on setting objectives, reviewing output, and handling exceptions. Blitzy attributes more than
              80% of delivered project code to autonomous generation and reports up to 5x engineering velocity. The
              platform is packaged as a ladder of product lines — Reverse Engineer, Concept Validation, Structured
              Pilot, Commercial, Enterprise, and Transformation — each mapped to a codebase-scale band from roughly 100K
              lines on the free tier to about 500M lines on the largest engagement. The workflow and module tables below
              enumerate the jobs Blitzy performs and the product lines that deliver them, while the operating-flow
              figure traces how a customer objective moves through the system to validated code.
