  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment thesis is that Blitzy has early but real enterprise product-market fit for the autonomous
              modernization of large legacy codebases, evidenced by named, quantified customer outcomes (QAD, Builders
              FirstSource, GNP, State Street), a claimed $2.91 of ARR generated per dollar burned, more than one billion
              lines of code processed, and a purpose-built knowledge-graph-plus-parallel-agent architecture that
              constitutes a genuine moat. The anti-thesis is that a $1.4B valuation prices in growth that is not yet
              publicly verified, into a market populated by far larger and better-funded competitors — Cursor/Anysphere
              near $29B and roughly $3.4B raised, Replit around $9B, Lovable around $6.6B — and that Blitzy's high-ACV,
              per-line pricing narrows the addressable buyer set to large enterprises with no self-serve growth motion.
              Weighing both, the recommendation is a qualified Buy with medium confidence and a medium risk rating,
              explicitly contingent on validating undisclosed ARR, margin, retention, and burn. Across IC-ready KPIs,
              Blitzy scores strongly on market and proof, moderately on moat and economics, and weakly on evidence
              quality, and the recommendation-logic and investment-KPI figures make that chain explicit. The
              thesis/anti-thesis and recommendation-summary tables below capture the two-sided case and the resulting
              call.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV023
