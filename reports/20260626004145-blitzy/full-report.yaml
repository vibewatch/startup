      - number: '2.3'
        title: Buyers, users, payers, and segmentation
        blocks:
          - type: paragraph
            body: >-
              The economic buyer for Blitzy is typically an enterprise CTO, CIO, or head of engineering or digital
              transformation who controls modernization and R&D budgets, while the end users are the software engineers
              and platform teams that adopt AI-native workflows alongside the platform. Purchases are funded from IT
              modernization, transformation, and R&D lines rather than seat-based developer-tool budgets, which is
              consistent with Blitzy's enterprise-wide, budget-led positioning. The most addressable segments are
              regulated, code-heavy industries — financial services, insurance, government, telecom, and manufacturing —
              where aging mainframe and legacy estates create acute modernization pressure and where compliance favors
              certified vendors. Adoption typically progresses along a defined path: a free reverse-engineering trial, a
              paid concept validation, a structured pilot, and finally enterprise rollout, mirroring Blitzy's published
              pricing tiers. The buyer/segment map figure and segmentation table below tie each segment to its buyer,
              user, payer, workflow, budget owner, and adoption trigger, making explicit who must say yes for a deal to
