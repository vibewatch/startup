  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risks and transmission
        blocks:
          - type: paragraph
            body: >-
              Blitzy's risks rank, by severity and residual exposure, as: foundation-model dependency, autonomous-code
              reliability and security, regulatory-legal overhang, and financial/valuation risk. These are not
              independent — they transmit into the investment thesis through three channels. Model pricing and
              availability flow into gross margin; autonomous-code reliability and customer concentration flow into
              revenue durability; and any growth or reliability stumble flows into valuation through down-round or
              markdown risk. The highest residual exposures, after mitigations, are model dependency and reliability,
              because both sit partly outside Blitzy's direct control: it orchestrates rather than owns its models, and
              the broader industry has not yet solved AI-generated-code reliability at scale. The risk heatmap and
              risk-transmission figures below position each risk by likelihood and impact and trace how it propagates to
              revenue, margin, financing, and valuation, while the registers in the following sections decompose
              regulatory, operational, dependency, and people risks with mitigation maturity and a diligence path for
              each. The chapter deliberately pairs every top risk with a monitorable kill criterion so an investor can
              track deterioration rather than rely on a static snapshot.
            claimRefs:
              - CR001
              - CR002
              - CR031
              - CR015
              - CR010
