  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing, and revenue mix
        blocks:
          - type: paragraph
            body: >-
              Blitzy monetizes the work of understanding and rewriting enterprise code. Revenue derives from two metered
              activities — onboarding (reverse-engineering existing code) at roughly $0.10 per line and generation of
              new code at roughly $0.20 per line — packaged into annual platform tiers that scale from a free Reverse
              Engineer plan (up to 100K lines), through $50K Concept Validation and $250K Structured Pilot engagements,
              to $500K Commercial, $5M Enterprise, and $50M Transformation contracts with rising included-line
              allowances. This makes the model a hybrid of one-time onboarding, usage-based generation, and recurring
              annual platform fees, though Blitzy does not disclose the mix among them. Importantly, published prices
              are list prices; realized pricing, enterprise discounts, and negotiated terms are private, and the
              combination of multi-month pilots with consumption-based generation introduces revenue-recognition nuance
