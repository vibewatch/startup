- id: section-5
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is that Blitzy''s revenue quality appears high on the strength of demonstrable pricing power and a striking capital-efficiency claim, but it is fundamentally unverifiable from public sources: absolute ARR, gross margin, churn, net revenue retention, CAC, payback, burn, and runway all rest on company assertions, and EDGAR full-text and company searches return no Blitzy registration statements. The business is also more capital-intensive than pure software because inference and forward-deployed delivery are real, scaling costs, even if Blitzy argues productization keeps margins SaaS-like. For underwriting, the primary blockers are the undisclosed ARR bridge and margin structure, the inference-cost sensitivity that ties Blitzy''s economics to third-party model vendors, and the absence of any audited or filed financials. The public-financial-gaps table enumerates each missing private metric, its impact on the investment case, and the exact diligence path to close it, and the capital-intensity / cash-flow map visualizes how inference, services, and R&D spend convert capital into delivered revenue.'
