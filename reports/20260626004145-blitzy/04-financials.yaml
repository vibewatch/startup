- id: section-4
  title: Traction, capital adequacy, and financing dependency
  body: On traction, Blitzy points to more than one billion lines of code processed since September 2025, up to 5x engineering velocity, dozens of Global 2000 customers, and concrete ROI proof — QAD's 24-to-6-month migration, Builders FirstSource's 3x velocity gain, and a Fortune 100 customer's 33-million-line reverse-engineering job completed in 3.5 days — all of which support premium pricing power even though absolute ARR is withheld. On capital adequacy, the May 2026 $200 million round (lifting total funding above $204 million) leaves Blitzy well-capitalized, with stated use of funds to expand research and scale go-to-market in regulated industries; the exact post-round cash balance, monthly burn, runway, debt obligations, and next-round trigger are not disclosed. Per the chapter's mandate, the historical funding chronology lives in Company Overview and is only referenced here, with local Financials claims minted for the forward capital-adequacy facts. The capital-adequacy table and financial-estimate-range figure capture what is public (raise size, efficiency ratio) and mark burn, runway, and ARR as nulls requiring a data room.
  claimRefs:
  - CI015
