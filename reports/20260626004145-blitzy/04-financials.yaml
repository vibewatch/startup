chapter:
  number: 4
  title: Financials
  summary: Blitzy monetizes through per-line code onboarding and generation priced into $0-$50M annual tiers, and claims unusual capital efficiency at $2.91 of ARR generated per dollar burned since January 2025 with near-SaaS gross margins. But absolute ARR, burn, runway, and cost structure are undisclosed, no SEC filings exist, and the forward capital-adequacy picture rests on the May 2026 $200M raise, leaving revenue quality and margin path as primary diligence blockers.
sections:
- id: section-1
  title: Revenue streams, pricing, and revenue mix
  body: Blitzy monetizes the work of understanding and rewriting enterprise code. Revenue derives from two metered activities — onboarding (reverse-engineering existing code) at roughly $0.10 per line and generation of new code at roughly $0.20 per line — packaged into annual platform tiers that scale from a free Reverse Engineer plan (up to 100K lines), through $50K Concept Validation and $250K Structured Pilot engagements, to $500K Commercial, $5M Enterprise, and $50M Transformation contracts with rising included-line allowances. This makes the model a hybrid of one-time onboarding, usage-based generation, and recurring annual platform fees, though Blitzy does not disclose the mix among them. Importantly, published prices are list prices; realized pricing, enterprise discounts, and negotiated terms are private, and the combination of multi-month pilots with consumption-based generation introduces revenue-recognition nuance that cannot be verified without financial statements. The revenue-streams and pricing tables below catalog each stream, its mechanism, and its disclosure quality, and the revenue-model bridge figure traces how customer activity (lines onboarded and generated) converts into billings and recurring revenue.
  claimRefs:
  - CI001
  - CI002
