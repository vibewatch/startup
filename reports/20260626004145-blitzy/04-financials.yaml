  evidenceGaps:
  - id: EGI001
    type: private-evidence-only
    severity: blocking
    topic: Absolute ARR, margin, and burn undisclosed
    missingEvidence: Audited ARR bridge, gross margin inclusive of inference and delivery, monthly burn, and runway.
    whyItMatters: Without these the capital-efficiency claim and any valuation multiple cannot be validated.
    diligencePath: Request a full financial data room with ARR, margin, burn, and runway in diligence.
    relatedQuestionRefs:
    - QI015
    - QI019
    - QI022
    relatedTableRefs:
    - TI005
  - id: EGI002
    type: private-evidence-only
    severity: material
    topic: Unit economics (CAC, payback, NRR) unavailable
    missingEvidence: CAC, payback period, net revenue retention, and gross retention by segment.
    whyItMatters: Sales efficiency and revenue durability cannot be underwritten without these.
    diligencePath: Request cohort retention, CAC, and payback data segmented by tier and vertical.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI003
  - id: EGI003
    type: private-evidence-only
    severity: material
    topic: Inference cost structure and model contracts not public
    missingEvidence: Per-run inference spend and the terms of model-provider agreements.
    whyItMatters: Inference is the dominant variable cost and the key margin-risk vector.
    diligencePath: Request model-provider contracts, committed-spend terms, and inference cost per engagement.
    relatedQuestionRefs:
    - QI012
