- id: section-2
  title: Go-to-market motion and sales efficiency
  body: Blitzy runs a top-down enterprise go-to-market motion in which a free reverse-engineering trial funnels prospects into paid concept validations, structured pilots, and ultimately forward-deployed enterprise engagements at Global 2000 accounts. The clearest sales-efficiency signal Blitzy offers is its claimed $2.91 of ARR generated per dollar burned since January 2025, which, if accurate, implies a markedly more efficient growth engine than typical AI startups; named multi-account expansion (for example, scaling pilots into broader rollouts) reinforces the narrative. However, the conventional efficiency primitives — sales-cycle length, customer acquisition cost, and payback period — are not disclosed and must be inferred from the cost intensity of onboarding 100-million-line estates with forward-deployed engineers. Strategic investors such as Liberty Mutual, Erie, and BAL Ventures may also function as a channel into insurance and enterprise accounts, supplementing direct sales. The chapter treats CAC and payback as open questions and flags that growth investors' participation implies private diligence-backed confidence in unit economics that public sources cannot confirm.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI031
  - CI029
- id: section-3
  title: Cost structure, gross margin, and unit economics
  body: 'Blitzy''s cost structure differs fundamentally from a pure-software business. Its largest variable cost is third-party model inference: the platform makes more than 100,000 model calls per run across OpenAI, Google, and Anthropic, so those vendors'' inference prices flow directly into Blitzy''s gross margin and create a structural cost dependency the company does not control. Forward-deployed engineering to onboard massive legacy estates adds a services-heavy layer that can dilute software-like margins unless productized, and SOC 2 Type II and ISO 27001 compliance impose ongoing but table-stakes costs for regulated revenue. Against this, Blitzy claims that its gross margin, inclusive of inference and forward-deployed costs, looks closer to a true SaaS business than to code-generation tools — a notable assertion, but one made without an absolute figure and against a backdrop of uneven enterprise GenAI ROI that argues for caution. The unit-economics table records each metric with its confidence and a specific diligence ask, and the unit-economics bridge figure shows qualitatively how revenue per engagement nets down through inference and delivery costs to gross profit.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
