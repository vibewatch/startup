- id: section-2
  title: 'Architecture: knowledge graph and parallel agent orchestration'
  body: Technically, Blitzy is best understood as three stacked layers. First, an ingestion and reverse-engineering layer reads an enterprise's existing code and builds a dynamic knowledge graph — the core asset that gives every agent a shared, queryable model of how the software actually works. Second, an orchestration layer deploys thousands of AI agents in parallel, making more than 100,000 frontier-model calls per execution to plan, generate, and cross-check code against the graph. Third, a model layer routes those calls to external frontier models from OpenAI, Google Gemini, and Anthropic Claude — Blitzy does not train its own foundation model — and a compile-test-validate layer gates output before delivery. OpenAI, Google, and Anthropic publicly document the agent and model APIs Blitzy builds on, confirming that the model layer is a documented but externally controlled dependency. The architecture and technology tables below decompose each layer, its role, and its dependency risk, and the architecture-map and dependency-map figures visualize the stack and its critical external reliances. The knowledge graph plus massively parallel orchestration is the part Blitzy argues lets agents reason coherently about an entire codebase, unlike file-local copilots.
  claimRefs:
