  evidenceGaps:
  - id: EGE001
    type: unverified-company-claim
    severity: material
    topic: Autonomous-code reliability and rework rate undisclosed
    missingEvidence: Independent measurement of how often Blitzy's autonomously generated code passes review without rework or defects.
    whyItMatters: Reliability at 100M-line scale is the core technical risk; without it, velocity claims cannot be risk-adjusted.
    diligencePath: Request defect/rework metrics, validation methodology, and a technical reference call or audit.
    relatedQuestionRefs:
    - QE012
    - QE023
    relatedTableRefs:
    - TE004
  - id: EGE002
    type: private-evidence-only
    severity: material
    topic: Deployment topology and integration depth not documented
    missingEvidence: Whether Blitzy runs SaaS, in-VPC, or on-prem, plus CI/CD integration, language coverage, and support SLAs.
    whyItMatters: Regulated buyers need deployment and integration certainty before production adoption.
    diligencePath: Request an architecture and deployment briefing plus a list of supported languages and integrations.
    relatedQuestionRefs:
    - QE011
    - QE025
    relatedTableRefs:
    - TE002
  - id: EGE003
    type: private-evidence-only
    severity: minor
    topic: SWE-Bench Pro result is self-reported
    missingEvidence: Independent reproduction of the 66.5% SWE-Bench Pro score under controlled conditions.
    whyItMatters: A self-reported benchmark cannot fully substantiate the autonomy and quality narrative.
    diligencePath: Request benchmark configuration and, ideally, third-party reproduction.
    relatedQuestionRefs:
    - QE015
