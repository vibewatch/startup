chapter:
  number: 5
  title: Product & Technology
  summary: Blitzy is an autonomous software-development platform that reverse-engineers enterprise codebases into a dynamic knowledge graph, then deploys thousands of parallel AI agents — 100,000+ frontier-model calls per execution across OpenAI, Google, and Anthropic — to write, compile, test, and validate production code, reporting 80%+ autonomous delivery, up to 5x velocity, and a 66.5% SWE-Bench Pro score. Its moat is the graph-plus-orchestration architecture purpose-built for 100M-line legacy estates, hardened by SOC 2 Type II and ISO 27001 with no training on customer code; the principal technical risks are dependence on third-party models and the industry-wide reliability gap in unverified AI-generated code.
sections:
- id: section-1
  title: What Blitzy is and the jobs it performs
  body: Blitzy is an autonomous software-development platform whose product, in customer-workflow terms, is the conversion of slow, expensive human engineering on large legacy codebases into fast, machine-driven delivery of production code. Rather than assisting a single developer inside an editor, the platform takes an enterprise objective — migrate an application, modernize a mainframe, refactor a monolith, or build a feature — and autonomously plans, writes, compiles, tests, and validates the code, with human engineers concentrated on setting objectives, reviewing output, and handling exceptions. Blitzy attributes more than 80% of delivered project code to autonomous generation and reports up to 5x engineering velocity. The platform is packaged as a ladder of product lines — Reverse Engineer, Concept Validation, Structured Pilot, Commercial, Enterprise, and Transformation — each mapped to a codebase-scale band from roughly 100K lines on the free tier to about 500M lines on the largest engagement. The workflow and module tables below enumerate the jobs Blitzy performs and the product lines that deliver them, while the operating-flow figure traces how a customer objective moves through the system to validated code.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE010
