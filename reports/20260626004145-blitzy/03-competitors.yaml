- id: section-2
  title: Capability, pricing, and trust comparison
  body: 'On capability, Blitzy differentiates by operating over 100M+ line enterprise codebases, building a dynamic knowledge graph, and running thousands of agents in parallel — a markedly different scope from copilots that assist a developer in the editor or app builders that scaffold new web apps. Its reported SWE-Bench Pro score of 66.5% is positioned ahead of incumbents, though cross-vendor benchmark comparability is imperfect. On pricing, the contrast is structural: Blitzy charges per line of code ($0.10/line onboard, $0.20/line generate) within $500K-$50M annual engagements, while Cursor, Copilot, Replit, and Lovable sell per-seat subscriptions (Copilot business/enterprise around $19-$39 per user per month). That makes Blitzy a budget-led modernization purchase rather than a seat expense. On trust, Blitzy''s SOC 2 Type II, ISO 27001, and explicit no-training-on-customer-code commitments target regulated buyers more directly than consumer-oriented rivals. The capability matrix and pricing comparison tables, plus the feature-breadth map, render these differences and mark cells where public evidence is thin.'
  claimRefs:
  - CP013
  - CP016
  - CP014
  - CP008
