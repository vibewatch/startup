company:
  name: Blitzy
chapter:
  number: 3
  title: Competitors
  summary: Blitzy competes against well-funded developer-tool companies (Cursor/Anysphere ~$29B, Replit ~$9B, Lovable ~$6.6B), the ecosystem-embedded GitHub Copilot, model-native agents (Anthropic Claude Code, OpenAI Codex, Cognition Devin), and the status quo of in-house engineers and systems integrators. Its differentiation is enterprise-grade autonomy over legacy codebases, but its moat faces commoditization risk from frontier-model vendors moving up-stack.
sections:
- id: section-1
  title: Competitive landscape and likely entrants
  body: 'Blitzy faces an unusually broad competitive field that spans four layers. The first is well-funded developer-tool peers: Cursor (Anysphere), an AI-native IDE valued around $29 billion on roughly $3.4 billion raised; Replit, a browser-based app-builder valued near $9 billion; and Lovable, a startup-focused app builder around $6.6 billion. The second is the ecosystem incumbent, GitHub Copilot, embedded in GitHub, VS Code, and the Microsoft enterprise estate. The third is model-native agents — Anthropic''s Claude Code, OpenAI''s Codex, and Cognition''s Devin — whose ''autonomous engineer'' framing is closest to Blitzy''s own. The fourth, and arguably most important, is the status quo: in-house engineering headcount and systems integrators that today perform the modernization work Blitzy automates. The most credible new entrants are the frontier-model vendors themselves moving up-stack. Crucially, most peers chase individual developers bottoms-up, whereas Blitzy targets Global 2000 modernization top-down, so it competes less head-to-head and more on a distinct enterprise-autonomy axis, as the competitor profile table and positioning map detail.'
