    type: private-evidence-only
    severity: material
    topic: Post-money cap table and preference stack undisclosed
    missingEvidence: Cap table, founder ownership, option pool, and liquidation preferences.
    whyItMatters: Founder control and downside protection cannot be assessed without the preference stack.
    diligencePath: Obtain the cap table and stock purchase agreements; confirm preference seniority.
    relatedQuestionRefs:
