  - id: EGO001
    type: private-evidence-only
    severity: blocking
    topic: Absolute ARR and revenue run-rate not disclosed
    missingEvidence: Audited or management financials showing 2025-2026 ARR, revenue, and burn.
    whyItMatters: Without absolute ARR the $2.91 ARR/$1 burn efficiency claim and the $1.4B valuation multiple cannot be validated.
    diligencePath: Request a financial data room with ARR bridge, burn, and runway in diligence.
    relatedQuestionRefs:
      - QO023
