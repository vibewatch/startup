- id: section-4
  title: Comparables, exit, triggers, and diligence asks
  body: Blitzy's comparable set is the cohort of venture-backed AI-coding companies — Cursor/Anysphere (~$29B valuation, ~$3.4B raised), Replit (~$9B, browser-based), and Lovable (~$6.6B, startup-focused) — against which Blitzy at $1.4B is far smaller but distinctly enterprise- and autonomy-focused. Comparability is limited because peers differ in business model, disclosure, and stage, so these are directional anchors rather than precise benchmarks, and given an early-stage, private, consumption-priced model the most defensible methods are forward revenue multiples on validated ARR and comparable private-round marks rather than DCF. Plausible exits are a strategic acquisition by a cloud, enterprise-software, or developer-tools incumbent, or a later IPO if ARR scales, over a multi-year window. Investors should monitor explicit thesis-break triggers — a flat or down round, a reliability or security failure at a flagship account, a material model-cost shock, or stalled pilot conversion — and the final diligence asks center on ARR and growth, gross margin and inference costs, net revenue retention, customer concentration, model-provider contracts, and round preference terms. The comparable-valuation, thesis-break, and final-diligence tables below operationalize the comp set, the triggers, and the exact evidence that would convert this qualified Buy into conviction or a pass.
