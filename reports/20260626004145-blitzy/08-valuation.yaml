- id: section-2
  title: Financing context, entry discipline, and price support
  body: 'Blitzy raised about $200M in May 2026 at a $1.4B valuation led by Northzone, with participation from PSG, Battery, and strategic insurers, lifting total funding above $204M and making it one of Boston''s newest unicorns; exact ownership percentages, board composition, and the preference and option-pool terms are not public and must be obtained before underwriting returns. Entry discipline therefore requires conditioning any investment on access to ARR, gross margin, retention, and burn, because the gap between the mark and disclosed metrics is wide: public evidence — named customers, the $2.91 efficiency ratio, and 1B+ lines processed — supports direction but not the absolute multiple, since ARR itself is undisclosed and SEC and registry searches return no filings, leaving valuation reliant on private-round marks and company disclosures rather than audited statements. Northzone''s lead and growth-investor participation signal institutional conviction that partially validates the mark, but the claimed capital efficiency, if unvalidated, cannot carry the full price. The valuation-sensitivity figure shows how dependent the outcome is on the inputs an investor cannot yet see, framing a stretched-but-not-unreasonable entry that rewards information-conditioned discipline.'
  claimRefs:
  - CV006
  - CV007
  - CV008
