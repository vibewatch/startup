  evidenceGaps:
  - id: EGV001
    type: private-evidence-only
    severity: blocking
    topic: Valuation-critical financials undisclosed
    missingEvidence: Absolute ARR and growth, gross margin and inference cost, net revenue retention, and burn/runway.
    whyItMatters: Without these the $1.4B mark cannot be converted into a defensible multiple or return.
    diligencePath: Condition any term sheet on a full financial data room covering ARR, margin, retention, and burn.
    relatedQuestionRefs:
    - QV018
    - QV004
    - QV009
    relatedTableRefs:
    - TV006
  - id: EGV002
    type: private-evidence-only
    severity: material
    topic: Cap-table, preference, and dilution terms unknown
    missingEvidence: Round preference stack, option pool, board composition, and ownership percentages.
    whyItMatters: These determine downside protection and realizable returns at any exit.
    diligencePath: Request cap table and round documents under NDA before underwriting returns.
    relatedQuestionRefs:
    - QV008
    relatedTableRefs:
    - TV001
  - id: EGV003
    type: weak-independent-evidence
    severity: material
    topic: Comparables differ in model and disclosure
    missingEvidence: Stage- and model-matched comparables with disclosed revenue multiples.
    whyItMatters: Directional comps cannot precisely benchmark a private, consumption-priced enterprise model.
    diligencePath: Triangulate with private-round marks and, once ARR is known, forward revenue multiples.
    relatedQuestionRefs:
    - QV017
    - QV029
    relatedTableRefs:
    - TV004
