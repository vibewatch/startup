- id: section-5
  title: People, execution, mitigations, and kill criteria
  body: 'On people and execution, Blitzy is founder-led and leans on CTO Sid Pardeshi''s patent-backed technical leadership, concentrating key-person risk in a small senior team; headcount roughly doubled in six months to about 80, and scaling hiring while preserving engineering quality and culture is a classic execution risk, compounded by fierce competition for elite AI and systems talent whose departure would slow the roadmap and weaken the moat. Against the full risk set, Blitzy''s mitigations — SOC 2 Type II and ISO 27001, a multi-model strategy, a compile-test-validate gate, and a no-training-on-customer-code policy — reduce but do not eliminate residual exposure, and their efficacy is unaudited. Accordingly, investors should track monitorable kill criteria: a sustained model-price shock, a reliability or security incident at a flagship account, evidence of customer-concentration loss, or a down-round signal. The most material diligence paths are model-provider contract review, independent reliability and defect metrics, customer-concentration disclosure, and a financial data room covering burn and runway. The people/execution register and the mitigation-and-kill-criteria table below convert these into rows an investment committee can monitor over time.'
