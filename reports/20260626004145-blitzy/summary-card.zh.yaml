  topStrengths:
    - 已验证企业 PMF：QAD、Builders FirstSource、GNP、State Street 等 Global 2000 账户具名披露 3-10x 提速
    - 公司称每烧 $1 可生成 $2.91 ARR，资本效率显著高于典型纯 AI 工具
    - 技术 moat：动态知识图谱 + 大规模并行 multi-agent 编排，专为 100M 行企业代码库设计
    - SOC 2 Type II、ISO 27001 和不使用客户代码训练，让其受监管行业滩头更粘
  topRisks:
    - 竞争激烈，且对手规模更大、资金更足（Cursor/Anysphere 约 $29B、Replit 约 $9B、GitHub Copilot），价格点更低
    - 高 ACV 按行定价把可服务买家收窄到大型企业，缺少自助式增长 motion
    - 对第三方 AI 模型（OpenAI、Google、Anthropic）的基础依赖带来毛利、可用性和能力风险
    - 在已融资约 $204M 基础上的 $1.4B 估值隐含大幅倍数扩张，而 autonomous-code 可靠性仍未在规模化场景证明
  unresolvedGaps:
    - 绝对 ARR 和 revenue run-rate 未披露；没有 data room 无法验证 $2.91 ARR/$1 burn 效率比
    - 除“数十家 Global 2000 公司”外，客户数、净收入留存、流失和 pilot-to-production 转化未披露
    - 毛利率和推理成本结构未公开，margin path 与 SaaS-like 质量仍未验证
    - 轮次优先权、稀释条款和董事会构成未披露，限制回报 underwriting
