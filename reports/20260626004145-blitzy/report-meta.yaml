companyProfile:
  summary: "Blitzy is an autonomous software-development platform, founded in November 2023 and headquartered at One Kendall Square in Cambridge, MA, that reverse-engineers large enterprise codebases into a dynamic knowledge graph and deploys thousands of parallel AI agents to autonomously write, test, and validate production code. In May 2026 it raised roughly $200M at a $1.4B valuation led by Northzone, becoming one of Boston's newest unicorns, with total funding above $204M and about 80 employees."
