  topStrengths:
    - "Proven enterprise PMF with named, quantified 3-10x velocity gains at Global 2000 accounts (QAD, Builders FirstSource, GNP, State Street)"
    - "Claimed $2.91 of ARR generated per $1 burned signals capital efficiency well above typical pure-play AI tools"
    - "Technical moat: dynamic knowledge graph plus massively parallel multi-agent orchestration purpose-built for 100M-line enterprise estates"
    - "Sticky regulated-industry beachhead hardened by SOC 2 Type II and ISO 27001 with no training on customer code"
  topRisks:
    - "Intense competition from far larger, better-funded players (Cursor/Anysphere ~$29B, Replit ~$9B, GitHub Copilot) with lower price points"
    - "High-ACV per-line pricing narrows the addressable buyer set to large enterprises with no self-serve growth motion"
    - "Foundational dependency on third-party AI models (OpenAI, Google, Anthropic) creates margin, availability, and capability risk"
    - "$1.4B valuation on ~$204M raised implies significant multiple expansion, with autonomous-code reliability still unproven at scale"
