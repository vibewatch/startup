      claimRefs: [CO006, CO007]
  foundingLocation: "Cambridge, MA"
  headquarters: "One Kendall Square, Cambridge, MA 02139"
  productSummary: "A multi-agent AI platform that reverse-engineers enterprise codebases into a dynamic knowledge graph and deploys thousands of agents (100,000+ frontier-model calls per execution across OpenAI, Google, and Anthropic) to autonomously write, test, and validate production-ready code, reporting 80%+ autonomous delivery and up to 5x engineering velocity."
  customerFocus: "Global 2000 enterprises with complex legacy codebases in regulated industries (financial services, insurance, enterprise software, building materials)"
  businessModel: "Consumption pricing for code onboarding (~$0.10/line) and generation (~$0.20/line), packaged into annual platform tiers from a free Reverse Engineer plan to $500K Commercial, $5M Enterprise, and $50M Transformation contracts"
  stage: "Series A"
  fundingStatus: "$200M Series A at $1.4B valuation, May 2026 (led by Northzone); total raised >$204M"
