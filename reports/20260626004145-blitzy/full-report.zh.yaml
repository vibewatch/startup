      - number: '8.3'
        title: 情景、驱动因素和回报区间
        blocks:
          - type: paragraph
            body: >-
              三种情景框定结果。牛市情景下，Blitzy 将大型试点（GNP 的 1,000 名开发者、Builders FirstSource 的
              rollout）转成生产合同，维持资本效率，并复利成长为定义品类的企业平台，从而支撑相对 $1.4B
              标记的倍数扩张。基准情景下，公司在受监管企业中稳步增长，但承受推理成本和竞争带来的毛利压力，长期大致支撑当前估值。熊市情景下，可靠性或模型成本冲击、试点转生产缓慢，或竞争导致的倍数压缩，会触发平轮或降轮及账面减记；由于这是一笔私人市场成长阶段股权，向下保护只限于未披露优先权条款所提供的部分。估值对
              ARR 增长和留存、由推理成本驱动的毛利率、试点转生产率，以及市场给予的收入倍数最敏感；如果品类整体重估下行，即便执行强劲，入场估值也可能显得偏满。下面的情景表和估值 /
              回报区间图，明确假设和结果分布，同时承认在 ARR 披露之前，隐含收入倍数无法计算。
