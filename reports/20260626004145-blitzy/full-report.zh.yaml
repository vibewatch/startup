      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Blitzy 所处的监管和法律环境仍未稳定。EU AI Act 为 AI 系统设定分层义务，部署在受监管欧盟企业内部的自主代码生成，可能触发透明度和风险管理要求。U.S. Copyright Office
              的指引认为，纯 AI 生成产物可能不具备版权保护，这让 Blitzy 交付代码的所有权存在不确定性，IP 敏感行业的客户会重点追问。摄取并逆向解析客户代码时，如果代码库嵌入个人数据，就可能牵涉 GDPR 和
              CCPA；企业客户也会把处理者义务下传给 Blitzy。激进的 AI 性能宣称——3-10x 的速度倍数——可能引来消费者保护审查，FTC 已明确会监管缺乏依据的 AI 营销。积极的一面是，截至 2026 年 6
              月，法院记录和新闻检索未发现针对 Blitzy 的公开诉讼、执法行动或监管程序；NIST 的 AI Risk Management Framework 和 CISA 的 AI 指引也提供了企业买家会期待
              Blitzy 对齐的公认治理框架。下面的监管 / 法律风险登记表逐项列出规则、状态、可能性、严重性、缓释措施和剩余敞口，并按严重性排序。
