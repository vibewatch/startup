      - number: '8.4'
        title: 可比公司、退出、触发器和尽调要求
        blocks:
          - type: paragraph
            body: >-
              Blitzy 的可比公司是风险投资支持的 AI 编码公司队列——Cursor/Anysphere（估值约 $29B，融资约 $3.4B）、Replit（约 $9B，基于浏览器）和 Lovable（约
              $6.6B，面向初创公司）。相比之下，Blitzy $1.4B
              的估值小得多，但更聚焦企业和自主化。可比性有限，因为同行在商业模式、披露和阶段上都不同，所以这些只是方向性锚点，不是精确基准。考虑到早期、私人、按消耗计价的模式，最有防御力的方法是基于已验证 ARR
              的远期收入倍数，以及可比私募轮标记，而非 DCF。可行退出包括被云厂商、企业软件或开发者工具 incumbent 战略收购；如果 ARR 放大，也可能在数年窗口后
              IPO。投资者应监测明确的投资逻辑失效触发器——平轮或降轮、旗舰客户发生可靠性或安全故障、重大模型成本冲击，或试点转生产停滞。最终尽调要求集中在 ARR
              和增长、毛利率和推理成本、净收入留存、客户集中度、模型供应商合同，以及轮次优先权条款。下面的可比估值表、投资逻辑失效表和最终尽调表，把可比公司集合、触发器，以及能把有条件买入转成高信心或放弃的确切证据落到行项目。
