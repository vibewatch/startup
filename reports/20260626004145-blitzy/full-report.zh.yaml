            body: >-
              人才和执行层面，Blitzy 由创始人主导，技术领导力主要依赖 CTO Sid Pardeshi 及其专利背书，小型高管团队里存在关键人风险；员工数在六个月内大约翻倍至约 80
              人，招聘扩张时还要守住工程质量和文化，这是典型执行风险。顶级 AI 与系统人才竞争激烈，一旦流失，会拖慢路线图并削弱护城河。面对完整风险集，Blitzy 的缓释措施——SOC 2 Type II 和 ISO
              27001、多模型策略、编译-测试-验证关口，以及不使用客户代码训练的政策——能降低但不能消除剩余敞口，且效果未经审计。因此，投资者应跟踪可监测的止损标准：模型价格持续冲击、旗舰客户发生可靠性或安全事件、客户集中度流失证据，或降轮信号。最关键的尽调路径是模型供应商合同审查、独立可靠性和缺陷指标、客户集中度披露，以及覆盖烧钱和
              runway 的财务 data room。下面的人才 / 执行登记表和缓释及止损标准表，把这些内容转成投委会可持续监控的行项目。
            claimRefs:
