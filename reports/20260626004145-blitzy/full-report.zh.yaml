            body: >-
              Blitzy 的差异化主张是架构性的：系统从第一性原理出发，为 1 亿行级遗留资产而设计，而不是把自动补全加到 IDE 上。公司报告 SWE-Bench Pro 得分
              66.5%——这是独立维护、基于真实软件工程任务的 benchmark——并称自 2025 年 9 月以来已处理超过 10 亿行企业代码，同时借助联合创始人 Sid Pardeshi 作为前 NVIDIA
              Master Inventor、拥有 27+ 项 AI 专利的履历证明技术深度。benchmark 数字应被视为指示性，因为它由公司自报，但方法由外部定义。相较 GitHub Copilot 和 Cursor
              等按座席 IDE copilot，Blitzy 瞄准整座代码库自主交付，这是不同的技术和商业类别；与此同时，GitHub、OpenAI Codex、Anthropic Claude Code 和 Google
              都在向 agentic 多文件工作流收敛，未来会越来越多争夺同一地盘。开发者社区信号——Hacker News 讨论、Thoughtworks Technology Radar，以及 Stack Overflow
              调查和博客分析——显示自主编码 agent 正在快速但有争议地被采用，也提醒从业者信任仍在形成。成熟度地图按模块给 Blitzy 能力打分，区分已验证强项和路线图主张。
