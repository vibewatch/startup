      - number: '1.2'
        title: 创始人、领导层与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Blitzy 的领导力叙事异常集中，这既是起源优势，也是核心尽调风险。联合创始人兼 CEO Brian Elliott 是连续创业者和前美国陆军游骑兵，他在 Joint Special Operations
              Command 的经历影响了公司对真实约束下大规模编排的强调。联合创始人兼 CTO Sid Pardeshi 曾任 NVIDIA Master Inventor，在 NVIDIA 工作近八年，2015–2016
              年被 Jensen Huang 亲自选入一份内部私密机器学习研究分发名单，并持有 27 项以上专利，覆盖神经网络、图像生成和 AI 驱动界面翻译。二人在 Harvard Business School
              以技术背景学生身份相识，建立了个人纽带，也形成了后来变成 Blitzy
              的逆向技术判断。但公开材料没有列出更完整的高管班子、独立董事或职能负责人，因此战略、融资、模型合作和技术方向看起来都压在两个人身上。对一家成立刚满两年左右的公司而言，这种集中并不罕见，但会抬高关键人物风险和治理不透明度，后续章节必须回到这个问题。
