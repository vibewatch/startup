      - number: '2.2'
        title: 机会测算：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              独立分析机构估算，2026 年 AI 代码工具市场规模约在 $9.4B 到 $16.1B 之间，预测 CAGR 约为 23% 到 37%，Precedence Research 预计到 2035 年约达
              $91B。由于各发布方对类别范围和基准年份设定不同，这些数字不能直接对比；本章保留区间，而不是平均成虚假的精确值。更大的框架来自相邻的企业软件维护与遗留现代化池，每年约 $200B，Blitzy
              的按行收费经济模型正面切入这个池子。公开数据无法精确拆分可服务和可获得层：可辩护的 SAM 是现代化池中可被自主按行自动化覆盖的部分，Blitzy 近期 SOM 则受其 $500K–$50M 合同规模和数十个
              Global 2000 账户约束。测算视角金字塔和估算区间图同时呈现分层漏斗和公开数字之间的分歧；测算表记录每个视角的发布方、年份、数值、CAGR、方法和限制。
