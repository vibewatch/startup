            body: >-
              技术上，Blitzy 最适合被理解为三层堆栈。第一层是摄取和反向工程层，读取企业既有代码并建立动态知识图谱——这是核心资产，让每个 agent 都拥有共享、可查询的软件真实运行模型。第二层是编排层，并行部署数千个
              AI agent，每次执行发起超过 100,000 次前沿模型调用，根据图谱规划、生成并交叉检查代码。第三层是模型层，把这些调用路由到 OpenAI、Google Gemini 和 Anthropic
              Claude 的外部前沿模型——Blitzy 不训练自己的基础模型——再由编译-测试-验证层在交付前卡住输出。OpenAI、Google 和 Anthropic 都公开记录了 Blitzy 所依赖的 agent
              和模型 API，确认模型层是有文档支撑但受外部控制的依赖。下方架构和技术表拆解每一层、角色和依赖风险；架构图和依赖图呈现堆栈及关键外部依赖。Blitzy 认为，知识图谱加大规模并行编排，才让 agent
              能连贯推理整座代码库，而不是像文件局部 copilot 那样只看局部。
