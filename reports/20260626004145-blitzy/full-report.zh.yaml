  summary: >-
    Blitzy 是一家自主软件开发平台公司，2023 年 11 月成立，总部位于马萨诸塞州剑桥 One Kendall Square。它把大型企业代码库反向工程成动态知识图谱，并调度数千个并行 AI
    agent，自主编写、测试和验证生产代码。2026 年 5 月，公司完成约 $200M 融资，估值 $1.4B，由 Northzone 领投，成为波士顿最新独角兽之一；累计融资超过 $204M，员工约 80 人。
