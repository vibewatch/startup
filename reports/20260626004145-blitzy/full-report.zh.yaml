      - number: '5.4'
        title: 信任、可靠性、依赖与技术判断
        blocks:
          - type: paragraph
            body: >-
              信任和质量上，Blitzy 已通过 SOC 2 Type II 合规和 ISO 27001 认证，并称不会使用客户代码训练模型——这对评估 IP
              泄露风险的受监管企业是重要控制；公司还把编译-测试-验证门作为阻止错误或不安全代码出货的机制。外部定义框架（ISO/IEC 27001、SOC 2、OWASP LLM Top 10、MITRE ATT&CK 和
              NIST AI Risk Management Framework）给这一姿态提供了可识别范围，但 Blitzy 的质量主张没有任何一项在公开层面经过独立审计。核心技术风险有两类。第一是依赖：Blitzy
              编排模型而非拥有模型，因此供应商价格、可用性和能力变化会直接进入产品质量和经济性；Hugging Face 等开放模型 hub 同时展示了对冲路径和商品化压力。第二是可靠性：独立企业数据显示，只有少数 AI
              生成代码无需人工返工即可合并；在 1 亿行规模下，任何未被发现的验证失误都代价高昂。下方信任 / 合规表和路线图表记录每项控制和里程碑及其缺口。总体看，Blitzy
              的防御性建立在专门构建的图谱加编排架构和企业合规上，但基础模型依赖，以及规模化自主代码可靠性仍未证明，会部分抵消这点。
