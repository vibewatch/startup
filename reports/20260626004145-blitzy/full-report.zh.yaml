              2026 年 5 月，Blitzy 宣布完成 $200M 成长轮融资，估值 $1.4B，由 Northzone 领投，合伙人 Sanjot Malhi 称其为 Autonomous AI Coding
              中范式迁移级产品，公司资本基础由此大幅抬升。本轮使累计融资超过 $204M，也让 Blitzy 成为波士顿最新独角兽。新进投资方包括 PSG、Battery Ventures、Jump
              Capital、Morgan Creek Digital 和 Defiant；老股东 Flybridge、Link Ventures、NFX、Picus Capital 和 Venture Guides
              继续加码；战略投资方 Liberty Mutual Strategic Ventures、Erie Strategic Ventures 和 BAL Ventures 入局，结合 Blitzy
              对受监管行业的明确聚焦，显示保险和企业端需求牵引。公司称资金将用于扩张研究团队和放大 go-to-market。Blitzy 也强调资本效率，称自 2025 年 1 月以来每烧掉 1 美元可产生 $2.91
