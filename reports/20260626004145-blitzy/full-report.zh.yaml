            title: 有条件买入，取决于尽调
            body: Blitzy 是一家高质量公司，但价格已满、财务透明度低。结论是中等置信度买入；如果 ARR、毛利率和留存得到验证，可升级为高信心；若表现不及预期，则转为放弃。
