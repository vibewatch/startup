      - number: '2.3'
        title: 买方、用户、付款方与分层
        blocks:
          - type: paragraph
            body: >-
              Blitzy 的经济买方通常是企业 CTO、CIO、工程负责人或数字化转型负责人，他们掌控现代化和 R&D 预算；最终用户则是采用 AI-native 工作流的软件工程师和平台团队。采购资金来自 IT
              现代化、转型和 R&D 预算，而不是按座席计费的开发者工具预算，这与 Blitzy
              企业级、预算驱动定位一致。最可触达的细分市场是受监管且代码密集的行业——金融服务、保险、政府、电信和制造业——这些行业老化的大型机和遗留系统带来急迫现代化压力，合规要求也偏好已认证供应商。采用通常沿固定路径推进：免费反向工程试用、付费概念验证、结构化试点，最终进入企业
              rollout，与 Blitzy 已发布的定价层级相呼应。下方买方 / 分层地图和分层表把每个细分市场与其买方、用户、付款方、工作流、预算所有者和采用触发因素相连，明确一笔交易需要谁点头，以及到底由哪笔预算买单。
