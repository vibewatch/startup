  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Blitzy 所处市场是 AI 代码工具和自主软件开发，这是更宽泛的生成式 AI 软件类别中快速增长的子集，专注于企业代码的编写、迁移、测试和维护。纳入范围的支出包括 AI
              辅助代码生成、遗留系统现代化和维护自动化；一般 IT 服务、云基础设施和非代码 AI 应用不在边界内。关键在于，Blitzy 真正的竞争集合不只是其他 AI
              厂商，还包括现状：企业内部工程人力、离岸系统集成商，以及 GitHub Copilot、Cursor 等开发者 copilot。Blitzy
              按接入和生成的代码行收费，目标是企业级现代化而非开发者座席，因此其经济框架更接近每年约 $200B 的企业软件维护池，而不是更窄的 copilot 市场。先划定边界再测算市场很重要，因为把
              copilot、agent 和现代化支出混在一起，正是公开估算分歧的来源。下方市场定义表将纳入和排除的支出分开，并列出 Blitzy 必须在成本和信任上击败的替代方案。
