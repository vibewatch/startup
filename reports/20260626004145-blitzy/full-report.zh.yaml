      - number: '2.4'
        title: 增长驱动、采用约束与测算缺口
        blocks:
          - type: paragraph
            body: >-
              市场的结构性驱动很强：资深工程师成本上升且稀缺，遗留代码基数庞大且老化，前沿模型能力持续提升，董事会层面的 AI 指令不断加码；IDC 数千亿美元级 AI 支出路径和多数专业开发者已使用 AI
              编码工具的调查证据，也在强化这些力量。但约束同样真实，并定义尽调边界。企业 GenAI ROI 并不均衡——copilot 吸收了多数 AI 支出，但只有约四分之一 AI 生成代码无需返工即可合并——BCG
              也发现多数企业尚未获取规模化价值。既有 SDLC 工具和系统集成商关系带来的切换成本不低；EU AI Act 和 NIST AI RMF
              等监管提高合规门槛（有利于认证供应商，但拉长销售周期）。公开估算因类别定义不一致而相互矛盾，细粒度 SAM/SOM
              输入也并不公开。下方驱动与约束表、价值链漏斗捕捉这些力量；本章将预算迁移真实性和测算输入标为未解决缺口。
