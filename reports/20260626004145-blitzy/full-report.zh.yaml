  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Blitzy 面对的竞争面异常宽，横跨四层。第一层是资金充足的开发者工具同行：Cursor（Anysphere），一家 AI-native IDE，估值约 $29B，累计融资约 $3.4B；Replit，浏览器端
              app builder，估值接近 $9B；以及面向创业公司的 app builder Lovable，估值约 $6.6B。第二层是生态在位者 GitHub Copilot，嵌入 GitHub、VS Code 和
              Microsoft 企业体系。第三层是模型原生 agent——Anthropic 的 Claude Code、OpenAI 的 Codex、Cognition 的 Devin——它们的“自主工程师”框架最接近
              Blitzy。第四层，也可以说最重要的一层，是现状本身：内部工程人力和系统集成商今天承担着 Blitzy
              试图自动化的现代化工作。最可信的新进入者，是前沿模型厂商自己向上游应用层移动。关键差异在于，多数同行自下而上追逐个人开发者，而 Blitzy 自上而下瞄准 Global 2000
              现代化，因此它不是纯粹正面竞争，而是在独特的企业自主化轴线上竞争，详见竞争对手画像表和定位图。
