    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与公司快照
        blocks:
          - type: paragraph
            body: >-
              Blitzy 位于马萨诸塞州剑桥，主打自主软件开发平台，专为大型、遗留企业代码库而建——这类代码库从未进入前沿基础模型训练语料。公司由 Brian Elliott 和 Sid Pardeshi 于 2023 年
              11 月创立。它不把自己定位成开发者 copilot，而是一套系统：先反向工程企业既有代码，建立动态知识图谱，再并行编排数千个 AI agent，连续推理数天到数周。平台使用 Google、Anthropic 和
              OpenAI 的模型，每次运行调用模型超过 100,000 次，并称能自主交付项目代码的 80% 以上且完成端到端测试。Blitzy 宣传其 SWE-Bench Pro 得分达到纪录级
              66.5%，工程速度最高提升 5x。到 2026 年中，公司约有 80 名员工，六个月内人数翻番以上，并称已部署到十个 Global 2000 行业。下方快照 KPI 表和图示把公开可支撑事实，与绝对
              ARR、股权结构等未披露私营指标分开。
