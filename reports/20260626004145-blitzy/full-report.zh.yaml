      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 两个不受 Blitzy 控制的敞口
            body: 模型依赖和自主代码可靠性是剩余风险最高的两项；两者分别取决于第三方（模型供应商）和一个尚未解决的行业难题（规模化可靠 AI 代码）。
            calloutType: risk
            claimRefs:
              - CR015
              - CR010
              - CR031
          - type: callout
            title: 监管和 IP 阴影仍未消散
            body: EU AI Act、AI 代码版权性，以及摄取代码上的隐私义务，构成不断移动的合规目标，可能抬高成本或引发输出所有权争议。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 可监测的止损标准
            body: 跟踪模型价格持续冲击、旗舰客户发生可靠性 / 安全事件、客户集中度流失，或平轮 / 降轮，把它们作为投资逻辑失效触发器。
            calloutType: insight
            claimRefs:
              - CR030
              - CR023
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反逻辑和建议
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，Blitzy 在大型遗留代码库的自主现代化上，已经拿到早期但真实的企业产品市场匹配：QAD、Builders FirstSource、GNP、State Street
              等具名客户给出量化成果；公司声称每烧掉 $1 可生成 $2.91 ARR；已处理超过 10 亿行代码；其专门构建的知识图谱加并行 agent 架构，也构成真实护城河。反逻辑是，$1.4B
              估值已经计入尚未公开验证的增长，而市场里有规模更大、资金更充足的竞争者——Cursor/Anysphere 接近 $29B、融资约 $3.4B，Replit 约 $9B，Lovable 约
              $6.6B；同时，Blitzy 的高 ACV、按行计价模式，把可触达买家收窄到大型企业，也没有自助式增长动作。两边权衡后，建议是有条件买入，置信度中等、风险评级中等，明确取决于对未披露
              ARR、毛利率、留存和烧钱的验证。在投委会可用 KPI 上，Blitzy 在市场和证明项得分强，护城河和经济性中等，证据质量偏弱；建议逻辑和投资 KPI 图把这条链条拆开。下面的投资逻辑 /
              反逻辑表和建议摘要表，概括正反两面的案例及最终判断。
