      - number: '8.2'
        title: 融资背景、入场纪律和价格支撑
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，Blitzy 由 Northzone 领投，PSG、Battery 和战略保险公司参投，按 $1.4B 估值融资约 $200M，总融资额超过
              $204M，并成为波士顿最新独角兽之一；具体持股比例、董事会构成，以及优先权和期权池条款尚未公开，必须在承销回报前取得。因此，任何投资都应以获得
              ARR、毛利率、留存和烧钱数据为条件，因为估值标记与已披露指标之间缺口很大：公开证据——具名客户、$2.91 效率比和 10 亿行以上代码处理量——支持方向，但不支持绝对倍数；ARR 本身未披露，SEC
              和注册检索也没有申报文件，使估值更多依赖私募轮标记和公司披露，而非经审计报表。Northzone
              领投和成长投资者参与，传递出机构信心，部分验证了估值标记；但若所谓资本效率未经验证，它无法独自支撑完整价格。估值敏感性图显示，结果高度依赖投资者尚未看到的输入项，也把这次入场界定为价格偏满但并非不合理——前提是严守以信息为条件的纪律。
            claimRefs:
              - CV006
