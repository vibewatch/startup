            body: >-
              从客户工作流看，Blitzy
              是一个自主软件开发平台，产品价值在于把大型遗留代码库上缓慢、昂贵的人类工程，转成快速、机器驱动的生产代码交付。平台不是在编辑器里辅助单个开发者，而是接收企业目标——迁移应用、现代化大型机、重构单体或构建功能——然后自主规划、编写、编译、测试和验证代码；人类工程师集中设定目标、审查输出和处理例外。Blitzy
              称交付项目代码中超过 80% 来自自主生成，工程速度最高提升 5x。平台被包装成产品线阶梯——Reverse Engineer、Concept Validation、Structured
              Pilot、Commercial、Enterprise 和 Transformation——每一级对应不同代码库规模，从免费层约 100K 行，到最大项目约 500M 行。下方工作流和模块表列出 Blitzy
