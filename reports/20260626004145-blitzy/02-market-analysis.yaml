chapter:
  number: 2
  title: Market Analysis
  summary: Blitzy sells into the AI code tools market, sized at roughly $9-16B in 2026 and compounding 23-37% annually, while positioning against the far larger ~$200B/yr enterprise software maintenance and legacy-modernization spend. Buyers are enterprise engineering and transformation budget owners in regulated Global 2000 verticals, but adoption is constrained by trust, ROI variance, and switching costs that the chapter preserves as diligence gaps.
sections:
- id: section-1
  title: Market boundary and status-quo substitutes
  body: 'Blitzy operates in the AI code tools and autonomous software development market, a fast-growing subset of the broader generative-AI software category that focuses specifically on writing, migrating, testing, and maintaining enterprise code. The relevant included spend is AI-assisted code generation, legacy modernization, and maintenance automation; general IT services, cloud infrastructure, and non-code AI applications fall outside the boundary. Critically, Blitzy''s true competitive set is not only other AI vendors but the status quo: in-house engineering headcount, offshore systems integrators, and developer copilots such as GitHub Copilot and Cursor. Because Blitzy prices per line of code onboarded and generated and targets enterprise-wide modernization rather than developer seats, its economic frame is the roughly $200 billion-per-year enterprise software maintenance pool more than the narrower copilot market. Defining this boundary before sizing it matters, because conflating copilots, agents, and modernization spend is exactly what makes published estimates diverge. The market definition table below separates included from excluded spend and names the substitutes Blitzy must out-compete on cost and trust.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM035
  - CM030
  tableRefs:
  - TM001
- id: section-2
  title: 'Sizing the opportunity: TAM, SAM, and SOM'
  body: 'Independent analysts size the AI code tools market between roughly $9.4 billion and $16.1 billion in 2026, with forecast CAGRs spanning about 23% to 37% and Precedence Research projecting roughly $91 billion by 2035. These figures are not directly comparable because each publisher scopes the category differently and uses different base years, so the chapter preserves the spread rather than averaging it into false precision. A larger framing comes from the adjacent enterprise software maintenance and legacy-modernization pool, on the order of $200 billion per year, which Blitzy''s per-line economics attack directly. Serviceable and obtainable layers cannot be precisely isolated from public data: a defensible SAM is the share of the modernization pool addressable by autonomous per-line automation, and Blitzy''s near-term SOM is bounded by its $500K-$50M contract sizes across dozens of Global 2000 accounts. The sizing-lens pyramid and estimate-range figures visualize both the layered funnel and the divergence among published numbers, while the sizing table records publisher, year, value, CAGR, methodology, and limitation for each lens.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM028
