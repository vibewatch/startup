  evidenceGaps:
  - id: EGM001
    type: conflicting-estimates
    severity: material
    topic: Published AI code tools market estimates diverge widely
    missingEvidence: A reconciled, like-for-like 2026 market size with consistent category scope and base year.
    whyItMatters: Divergent vendor definitions make the headline TAM unreliable for underwriting Blitzy's share.
    diligencePath: Commission or triangulate a scoped market model isolating autonomous enterprise modernization spend.
    relatedQuestionRefs:
    - QM021
    - QM022
    relatedTableRefs:
    - TM002
  - id: EGM002
    type: private-evidence-only
    severity: material
    topic: SAM/SOM inputs for autonomous enterprise code generation unavailable
    missingEvidence: Per-account addressable legacy LOC, realistic automation share, and ACV by segment.
    whyItMatters: Without these, serviceable and obtainable market layers cannot be sized beyond rough proxies.
    diligencePath: Obtain customer LOC inventories and segment-level ACV in a buyer/budget diligence workstream.
    relatedQuestionRefs:
    - QM025
  - id: EGM003
    type: private-evidence-only
    severity: minor
    topic: Whether AI tooling budgets are additive or substitutive is unestablished
    missingEvidence: Evidence on enterprise reallocation from engineering headcount to AI tooling.
    whyItMatters: Budget-shift dynamics determine whether the market grows by displacing labor or only adds spend.
    diligencePath: Survey CIO budget plans and track headcount-vs-tooling reallocation at reference accounts.
    relatedQuestionRefs:
    - QM026
