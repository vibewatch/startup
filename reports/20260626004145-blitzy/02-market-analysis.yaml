- id: section-3
  title: Buyers, users, payers, and segmentation
  body: 'The economic buyer for Blitzy is typically an enterprise CTO, CIO, or head of engineering or digital transformation who controls modernization and R&D budgets, while the end users are the software engineers and platform teams that adopt AI-native workflows alongside the platform. Purchases are funded from IT modernization, transformation, and R&D lines rather than seat-based developer-tool budgets, which is consistent with Blitzy''s enterprise-wide, budget-led positioning. The most addressable segments are regulated, code-heavy industries — financial services, insurance, government, telecom, and manufacturing — where aging mainframe and legacy estates create acute modernization pressure and where compliance favors certified vendors. Adoption typically progresses along a defined path: a free reverse-engineering trial, a paid concept validation, a structured pilot, and finally enterprise rollout, mirroring Blitzy''s published pricing tiers. The buyer/segment map figure and segmentation table below tie each segment to its buyer, user, payer, workflow, budget owner, and adoption trigger, making explicit who must say yes for a deal to close and which budget actually funds it.'
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM016
  - CM017
  - CM031
  tableRefs:
  - TM003
  figureRefs:
  - FM003
- id: section-4
  title: Growth drivers, adoption constraints, and sizing gaps
  body: 'The market''s structural drivers are powerful: the rising cost and scarcity of senior engineers, a large and aging base of legacy code, continued frontier-model capability gains, and board-level AI mandates, all reinforced by IDC''s multi-hundred-billion-dollar AI spending trajectory and survey evidence that most professional developers already use AI coding tools. But the constraints are equally real and define the diligence frontier. Enterprise GenAI ROI is uneven — copilots absorb a majority of AI spend while only about a quarter of AI-generated code merges without rework — and BCG finds most enterprises have not yet captured scaled value. Switching costs from entrenched SDLC tooling and systems-integrator relationships are material, and regulation such as the EU AI Act and the NIST AI RMF raises the compliance bar (favoring certified vendors but lengthening sales cycles). Published estimates contradict one another because of inconsistent category definitions, and granular SAM/SOM inputs are simply not public. The drivers-and-constraints table and value-chain funnel below capture these forces, and the chapter flags budget-shift reality and sizing inputs as unresolved gaps.'
