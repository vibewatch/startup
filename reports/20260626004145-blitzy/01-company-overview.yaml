- id: section-2
  title: Founders, leadership, and key-person dependence
  body: Blitzy's leadership story is unusually concentrated, which is both its origin advantage and a core diligence risk. Co-founder and CEO Brian Elliott is a serial entrepreneur and former US Army Ranger whose Joint Special Operations Command background informs the company's emphasis on large-scale orchestration under real constraints. Co-founder and CTO Sid Pardeshi is a former NVIDIA Master Inventor who spent nearly eight years at the company, was hand-picked into a private internal machine-learning research distribution circulated by Jensen Huang in 2015-2016, and holds more than 27 patents spanning neural networks, image generation, and AI-driven interface translation. The two met as technical students at Harvard Business School, where they formed both the personal bond and the contrarian technical thesis that became Blitzy. Public materials, however, name no broader executive bench, board-independent directors, or functional leaders, so strategy, fundraising, model partnerships, and technical direction appear to rest with two people. That concentration is common for a company barely two years past founding, but it elevates key-person risk and governance opacity as questions later chapters must revisit.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO033
  - CO032
  tableRefs:
  - TO002
- id: section-3
  title: Funding, valuation, and stakeholder map
  body: Blitzy's capital base stepped up sharply in May 2026, when it announced a $200 million growth round at a $1.4 billion valuation led by Northzone, with partner Sanjot Malhi calling it a paradigm-shifting product in Autonomous AI Coding. The round brought total funding above $204 million and minted Blitzy as Boston's newest unicorn. New investors included PSG, Battery Ventures, Jump Capital, Morgan Creek Digital, and Defiant; existing backers Flybridge, Link Ventures, NFX, Picus Capital, and Venture Guides re-upped; and strategic investors Liberty Mutual Strategic Ventures, Erie Strategic Ventures, and BAL Ventures joined, a signal of insurance and enterprise pull given Blitzy's stated focus on regulated industries. The company says it will spend the capital expanding its research team and scaling go-to-market. Blitzy also markets capital efficiency, claiming $2.91 of ARR generated per dollar burned since January 2025, though absolute ARR, the preference stack, and founder ownership remain undisclosed. The stakeholder map and snapshot-logic figure below capture the most material disclosed backers and how capital, product, and customers reinforce one another.
  claimRefs:
  - CO009
