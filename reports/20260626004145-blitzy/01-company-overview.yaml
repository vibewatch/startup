- id: section-4
  title: Milestones, traction proof, and adverse context
  body: 'The milestone record below is the single chronology later chapters should reuse. It runs from Pardeshi''s NVIDIA-era exposure to early machine-learning research, through a November 2023 founding, to a roughly two-year build, the ingestion of more than one billion lines of enterprise code since September 2025, an April 2026 Builders FirstSource partnership, and the May 2026 unicorn round. Customer proof points anchor the story: Builders FirstSource reported a 3x velocity gain with 120 engineers in AI-native workflows, QAD compressed a 24-month migration into 6 months, and a Fortune 100 customer reverse-engineered 33 million lines of mainframe code in 3.5 days. Blitzy further reports SOC 2 Type II compliance, ISO 27001 certification, and a no-training-on-customer-code commitment. Balancing the promotional record, Forbes framed Blitzy as a $1.4 billion challenger to incumbents such as Claude Code and Codex, and independent enterprise data shows GenAI ROI remains uneven, with only about a quarter of AI-generated code merging without rework. Those adverse signals, plus the absence of any SEC filing or disclosed ARR, define the diligence frontier.'
