  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: unsecured credit first, deposits second'
        blocks:
          - type: paragraph
            body: >-
              Upgrade should be analyzed first as an unsecured consumer-credit platform, not as a generic fintech or a
              full-service neobank. The relevant problem set is the household need to refinance high-cost revolving
              balances, smooth a large purchase, or convert volatile monthly card payments into a fixed installment
              schedule. Upgrade's own product set supports that narrower boundary: it markets personal loans up to
              $50,000, an installment-style Upgrade Card, rewards checking, and a 3.05% APY savings account. Those
              deposit products matter because they can acquire rate-sensitive households and support cross-sell, but
              they do not create a new core lending TAM by themselves. The operative substitutes are still revolving
              bankcards, other personal loans, checkout BNPL, and in some cases savings drawdown or 0% promotional
              cards. That framing keeps the chapter anchored on monetizable credit demand instead of inflating the
              opportunity set by counting all consumer deposits or all fintech activity as addressable revenue for
              Upgrade.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM040
              - CM042
