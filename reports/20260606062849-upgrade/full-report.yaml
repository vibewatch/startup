  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price context and recommendation
        blocks:
          - type: paragraph
            body: >-
              Upgrade's reported $7.3 billion Series G mark deserves to be underwritten as a price, not as a generic
              quality badge. The supportive evidence is real. Official and syndicated coverage confirm a $165 million
              round, more than $42 billion of delivered credit, over 7.5 million customers, six products, $750 million
              of lifetime equity, and management-reported annualized revenue above $1 billion with cash-flow positivity.
              Those facts separate Upgrade from a typical subscale online lender. But valuation discipline still
              matters. At more than 7x the only public revenue anchor, the round already prices in continued cross-sell
              efficiency, benign funding access, and an orderly late-stage exit market. Public comps with disclosed
              financials do not clear that same bar today. The most defensible IC stance is therefore TRACK with medium
              confidence and high risk: the business quality looks credible, but the price still leans on diligence
              assumptions that are not yet public.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
