              reviewed in this run do not surface him, so his present governance or operating role remains unclear. Tom
              Botts appears publicly as the Flex Pay president, which adds visible executive depth around BNPL, but
              key-person dependence still appears highest around Laplanche and the long-standing card-and-loan
