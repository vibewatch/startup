      - number: '8.2'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull thesis starts with a more interesting platform than the public comp labels suggest. Upgrade is
              not only a personal-loan originator. Public sources show a six-product stack, meaningful scale, and
              partner-bank infrastructure that can support cards, deposits, and installment lending together.
              Management-reported signals are directionally strong: the company says it has served millions of
              customers, annualized revenue passed $1 billion in 2025, the business had been cash-flow positive for
              three years, and Flex Pay or BNPL appears to be a powerful customer-acquisition engine. The anti-thesis is
              just as clear. The current mark already embeds much of that upside, while core underwriting facts remain
              private: audited consolidated financials, the preference stack, channel-level CAC and LTV, and
              product-level credit losses. Add founder-governance baggage and a tightening credit-policy backdrop, and
              the result is not a broken thesis but a price that requires more proof than the public record currently
              supplies.
            claimRefs:
              - CV009
