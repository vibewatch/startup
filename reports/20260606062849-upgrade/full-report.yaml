            body: >-
              Upgrade’s operating architecture is partner-led by design. Official disclosures repeatedly stress that
              Upgrade is not a bank, while Cross River surfaces explain how the system works in practice: bank
              origination and account provision sit with the partner bank, cards and debit rails ride Visa acceptance,
              deposit access relies on Allpoint, and Upgrade sits on top with origination UX, underwriting analytics,
              servicing, and mobile controls. Cross River’s own case study makes the architecture concrete by saying its
              card-issuance and payment APIs power backend processing and settlement for Upgrade Card, while Rewards
              Checking runs on Cross River’s deposit and ACH infrastructure. Upgrade’s institutions page adds the
              asset-side twist: loans are facilitated through an originating-bank model, sold to partner institutions,
              and still serviced by Upgrade. That gives the company a reusable platform across lending, cards, and
              deposits, but it also makes product continuity dependent on a small number of external bank, network, ATM,
