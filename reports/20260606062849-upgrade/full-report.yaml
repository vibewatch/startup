          label: Bank-partner scrutiny
          description: Reg E, disclosures, outsourced records, and end-user confusion risks
        - id: n2
          label: Cross River dependence
          description: Origination, deposits, cards, and facility support concentrated in one key bank partner
        - id: n3
          label: Macro credit stress
          description: Higher delinquency pressure and tighter funding risk appetite
        - id: n4
          label: Complaint and servicing friction
          description: Credit-reporting, payment-date, and support issues
        - id: n5
