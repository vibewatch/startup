      - number: '8.5'
        title: Downside triggers and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The downside case is not primarily about whether Upgrade can keep growing; it is about whether public
              signals overstate the quality of that growth at the current price. The first trigger is denominator risk:
              if audited 2025 revenue or 2026 run-rate data land below the current public narrative, the implied
              multiple could look materially too rich. The second is conversion risk: Upgrade's valuation now leans
              meaningfully on the idea that BNPL is a low-cost acquisition funnel into higher-value lending and card
              products. If those cohorts do not convert or season well, the premium evaporates quickly. The third is
              policy and funding risk. CRS, the CFPB, Richmond Fed, and credit-bureau data all reinforce that BNPL and
              unsecured consumer credit remain politically visible and economically cyclical. The practical underwriting
              response is simple: require proof of clean terms, durable cohort economics, and resilient funding before
              paying near the headline Series G price.
            claimRefs:
              - CV017
              - CV024
