      - number: '3.5'
        title: Durability and downside
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence-backed moat for Upgrade is integration, not ownership. Cross River describes a
              shared platform spanning lending, cards, deposits, and credit facilities, and Upgrade's own product pages
              show a coherent journey from loan to spending account to BNPL. That is meaningful because it gives Upgrade
              more cross-sell surface than Upstart, Oportun, or a single-product BNPL merchant flow. But the same
              evidence shows why the moat is fragile. Partner concentration creates dependence on outside banks and
              capital providers; bank-chartered peers can lean on owned funding; BNPL specialists still own stronger
              checkout habits; and incumbents retain trust, acceptance, and reward budgets at a completely different
              scale. In other words, Upgrade has built a compelling bundle, but its competitive durability still depends
              on proving that bundle lowers acquisition cost or raises lifetime value enough to offset weaker charter,
              network, and balance-sheet control.
            claimRefs:
