companyProfile:
  summary: |
    Upgrade is a San Francisco-based consumer-finance company built by LendingClub alumni to offer a
    digital alternative to legacy unsecured lending and revolving-credit products. Its current public
    footprint spans personal loans, the installment-oriented Upgrade Card family, OneCard debit/credit
    hybrids, savings and checking products, Flex Pay BNPL, and selected auto and home-improvement
    financing programs. The company operates nationwide online through partner-bank infrastructure
    rather than a branch network and positions itself around mainstream consumers who want simpler,
    fixed-payment credit tools.
  foundedDate: '2017-01-01'
  founders:
    - name: Renaud Laplanche
      role: Co-founder and CEO
      background: Founder and former CEO of LendingClub; leads Upgrade's strategy, fundraising, and public positioning.
      claimRefs:
        - CO004
        - CO006
    - name: Soul Htite
      role: Co-founder
      background: >-
