    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Reviewed public milestones show Upgrade evolving from a disputed 2016-2017 founding window into a broader
      card-plus-deposits-plus-BNPL platform with fresh 2025 financing and visible complaint/litigation signals.
