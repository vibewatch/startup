      - number: '4.4'
        title: Credit performance proxies and downside evidence
        blocks:
          - type: paragraph
            body: >-
              Public credit-performance evidence is much stronger for structure and assumptions than for realized
              portfolio outcomes. Upgrade's current partner page suggests a reasonably prime consumer base in the
              loan-purchase channels, with weighted-average FICO of 725 for personal loans and 775 for home-improvement
              financing, while also noting that sub-660 FICO loans are typically routed to institutional buyers. Fitch's
              April 2026 UPG HI 2026-1 report adds harder downside math: base-case lifetime defaults of 7.66%,
              rating-case defaults of 24.2%, zero recovery assumptions, and only limited historical history for a
              program that began in 2022. Macro conditions do not look benign enough to ignore those assumptions. The
              New York Fed said 4.8% of household debt was delinquent in Q1 2026 and that card early-delinquency
              transitions were still 8.6% annualized, while FRED banking tables showed 2.64% consumer-loan charge-offs
              and 3.84% credit-card charge-offs. Adverse evidence also exists on servicing and consumer-experience risk:
              complaint aggregators built from CFPB data show roughly 4,000-plus complaints against Upgrade,
              concentrated in credit reporting, debt collection, payments, and unexpected-fee issues. None of those
              complaint databases proves unit losses, but they do signal servicing, compliance, and remediation costs
              that can erode contribution margins.
            claimRefs:
              - CI013
