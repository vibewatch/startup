      - number: '4.5'
        title: What public evidence still cannot prove
        blocks:
          - type: paragraph
            body: >-
              The main underwriting blocker is not whether Upgrade has multiple revenue streams; it is whether the
              economics of those streams are durable after rewards expense, funding costs, servicing costs, and credit
              losses. Public evidence supports diversified revenue sources, repeated access to capital, and
              management-reported profitable growth, but it still does not disclose audited GAAP profitability by year,
              product-level charge-off curves for the flagship unsecured products, CAC and payback by acquisition
              channel, servicing-margin detail, or the exact revenue share on deposits gathered for partner
              institutions. Warehouse terms are also opaque: the facility headline is public, but advance rates,
              covenants, eligibility triggers, and concentration limits are not. In practice, that means the chapter can
              support a constructive view on revenue quality and liquidity access, yet still only a research-more
              underwriting verdict. A buyer should ask management to bridge origination volume to gross revenue, gross
              profit, operating cash generation, and required balance-sheet support by product before taking a stronger
              stance on normalized earnings power.
            claimRefs:
              - CI040
