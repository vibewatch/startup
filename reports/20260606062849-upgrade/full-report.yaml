  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape framing
        blocks:
          - type: paragraph
            body: >-
              Upgrade is no longer competing only with online personal-loan originators. The public product set now
              spans debt-consolidation loans, the installment-style Upgrade Card, Rewards Checking Preferred, Premier
              Savings, and Flex Pay at checkout. That makes the relevant landscape four-sided: deposit-funded digital
              banks like LendingClub and SoFi; marketplace and underwriting specialists like Upstart; checkout and
              wallet-centric installment networks like Affirm and Klarna; and large incumbent card-and-deposit
              franchises such as Capital One/Discover and Synchrony. The strategic attraction is obvious: Upgrade can
              pitch a simpler, fixed-payment consumer-credit bundle than a revolving card issuer without forcing users
              into a mono-line loan product. The strategic risk is equally obvious: every flank has a stronger native
              asset than Upgrade does, whether that is a bank charter, a merchant network, a proprietary data flywheel,
              or mass-market trust and acceptance.
