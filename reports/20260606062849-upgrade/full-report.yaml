  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and conduct risk
        blocks:
          - type: paragraph
            body: >-
              Upgrade’s bank-partner structure is not a regulatory moat; it is the core regulatory risk surface. Upgrade
              publicly says it is not a bank and instead relies on partner banks to originate loans, issue cards, and
              provide deposit products, while the company itself publishes NMLS and state-license disclosures. That
              model keeps Upgrade inside the blast radius of bank-partnership supervision, because law-firm analyses of
              the 2024 agency statement say partner banks remain accountable for outsourced records, disclosures,
              Regulation E disputes, AML controls, and customer confusion over which entity is responsible. The 2026
              White House order is directionally innovation-friendly, but it explicitly preserves safety, soundness,
              consumer protection, and oversight rather than removing them. Public adverse evidence is not empty: BBB
              says the 2026 complaint review concerned credit-reporting issues, and UniCourt shows at least one recent
              consumer-credit suit that recorded a settlement notice. The result is a high residual risk of conduct or
              complaint-management failures turning into a broader supervisory or litigation issue even without a known
              CFPB enforcement action today.
