      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              A range-based framework is more honest than a point estimate because the public record still leaves too
              many denominators unresolved. The bull case can justify something at or modestly above the Series G mark,
              but only if audited revenue is already well above the $1 billion annualized anchor, BNPL-led acquisition
              keeps lowering blended CAC, and the cap table proves economically clean for new money. The base case
              assumes Upgrade is a high-quality but not yet premium-priced consumer-fintech platform: revenue around
              $1.0 billion to $1.1 billion and a multiple closer to larger profitable public fintech peers. The bear
              case assumes the opposite: slower cross-sell, more regulation around partner-bank or BNPL models, funding
              friction, or public-market comps staying anchored near LendingClub or Upstart levels. Because the current
              mark overlaps only the top of the bull range and sits above the base range, new money should behave as if
              upside is conditional rather than already banked.
            claimRefs:
