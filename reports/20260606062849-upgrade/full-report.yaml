      - number: '7.2'
        title: Funding, credit, and macro risk
        blocks:
          - type: paragraph
            body: >-
              Upgrade still has clear access to funding in 2026, but the evidence also shows how contingent that access
              is. Cross River disclosed a February 2026 upsize of Upgrade’s revolving facility from $150 million to $250
              million secured by personal credit line assets, while KBRA said Upgrade’s ST2 deal was the company’s
              second term ABS securitization of 2026 and totaled $206.2 million across five note classes. DBRS pages
              show another 2026 trust, ST1, remained in live rating coverage. That is the mitigation story. The risk
              story is that the same evidence points to dependence on external capital providers, rating agencies, and
              investor appetite. FRED and the New York Fed continue to flag elevated household debt and meaningful
              delinquency levels across consumer credit, and J.P. Morgan argues higher-rate conditions are changing
              fintech economics and charter incentives. For Upgrade, a worsening credit cycle would hit collateral
              performance, warehouse and ABS pricing, and partner-bank willingness at the same time; the company can be
              fundamentally healthy and still face sharply worse funding terms.
            claimRefs:
