      - number: '2.2'
        title: 'Sizing lenses: very large balance pool, narrower serviceable pocket'
        blocks:
          - type: paragraph
            body: >-
              The balance pool is large even before any aggressive TAM storytelling. Equifax reported $1.12 trillion of
              bankcard balances in January 2026, while the New York Fed reported $1.252 trillion of credit-card balances
              in Q1 2026; LendingTree put outstanding personal-loan balances at $276 billion in Q4 2025. Together, those
              figures support a broad unsecured balance opportunity of roughly $1.4 trillion to $1.5 trillion. But SAM
              and SOM need stricter discipline. Richmond Fed estimated about $70 billion of BNPL transaction value in
              2025, yet the average BNPL debt outstanding was only about $3 billion because pay-in-four loans amortize
              quickly. Likewise, deposits help customer acquisition but are not additive to credit balances. The
              cleanest lower-bound serviceable market is the existing personal-loan stock, while the debt-consolidation
              share of that stock is the best evidence-constrained proxy for Upgrade's immediate use case.
