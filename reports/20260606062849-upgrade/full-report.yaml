      - number: '2.3'
        title: 'Buyer and borrower segmentation: fair-to-good is the real lane'
        blocks:
          - type: paragraph
            body: >-
              Upgrade's practical lane is the fair-to-good consumer who wants fixed payments and digital convenience
              more than prime-bank pricing. Independent reviews consistently place the effective score floor around 600,
              while U.S. News frames viable approval in a high-500s to low-600s band; NerdWallet reports an average
              borrower score of 677. That places Upgrade between prime-bank underwriting and true subprime or
              no-credit-check alternatives. The pricing data reinforces the same boundary. NerdWallet's June 2026 rate
              data shows average APRs of 22.86% for fair-credit shoppers and 18.99% for good-credit shoppers, while
              LendingTree's closed-loan data shows rates climbing above 30% as scores drop into the 580s and low 600s.
              The result is a buyer map where debt consolidators, payment-simplifiers, and cash-flow borrowers are the
              core users, while BNPL-accustomed households and savers are adjacent acquisition paths rather than
              separate markets.
