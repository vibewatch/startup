        title: Trust, compliance, and product-quality signals
        blocks:
          - type: paragraph
            body: >-
              Public trust and quality signals are mixed but not absent. On the positive side, Upgrade publishes a
              coordinated vulnerability disclosure policy, documents scam and ACH-safety topics in its help center, and
              provides unusually explicit custodial-deposit disclosures for both Performance Savings and the
              secured-card savings account. App-store disclosures also show active maintenance, privacy disclosures, and
              large review volumes. On the negative side, the retained evidence is mostly process-level, not
              assurance-level. There is no public bug bounty, no downloaded SOC 2 or PCI package in the reviewed
              sources, and no customer-facing status page or uptime commitments surfaced during research.
              Customer-experience evidence is similarly uneven. Apple ratings are very strong, Trustpilot scale is
              large, and review sites praise speed and ease of onboarding, but Google Play reviews describe payment
