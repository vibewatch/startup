      - number: '3.3'
        title: Marketplace and BNPL peers
        blocks:
          - type: paragraph
            body: >-
              Upstart, Affirm, and Klarna compete with Upgrade from different angles. Upstart is the strongest
              underwriting-and-distribution rival: its disclosed 100-plus bank-partner network, large loan history, and
              AI positioning create more external reach than Upgrade has public evidence for, even though Upstart lacks
              Upgrade's direct deposit and card surfaces. Affirm and Klarna invert the problem. Their core behavior is
              checkout and app-led installment usage, not debt consolidation, but both have added debit or
              balance-account features that pull consumers into banking-like daily loops. Upgrade's card and Flex Pay
              products split the difference between those models. The card looks like a mainstream spending substitute
              with fixed-payment DNA, while Flex Pay lets Upgrade address point-of-sale installments without becoming a
              pure merchant network. That mixed architecture is differentiated, but it also means Upgrade must defend
              two fronts simultaneously: underwriting quality versus marketplaces and habit formation versus BNPL
              networks.
