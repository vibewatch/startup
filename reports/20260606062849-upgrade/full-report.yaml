  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      How scale proof, partner dependence, public comp pressure, and disclosure gaps combine into a TRACK
      recommendation.
    data:
      nodes:
        - id: scale
          label: 'Scale proof: $42B+ credit, 7.5M+ customers, six products'
          type: input
        - id: growth
          label: 'Growth proof: >$1B annualized revenue and cash-flow-positive narrative'
          type: input
        - id: channel
          label: 'Cross-sell support: BNPL drives users and marketing intensity screens better than peers'
          type: input
        - id: comp
          label: 'Public comp reality: 1.9x-5.4x revenue for closest public peers'
          type: input
        - id: gaps
          label: 'Disclosure gaps: audited financials, cap table, loss curves, covenants'
          type: input
        - id: valuation
          label: 'Current mark: $7.3B and >7x public revenue anchor'
          type: process
        - id: recommendation
          label: 'Recommendation: TRACK with medium confidence and high risk'
          type: output
      edges:
        - from: scale
          to: valuation
        - from: growth
          to: valuation
        - from: channel
          to: valuation
        - from: comp
          to: valuation
        - from: gaps
          to: valuation
        - from: valuation
          to: recommendation
    approximationNotes: >-
      This flow is decision logic, not a mechanical model. It shows why quality evidence is necessary but not sufficient
      at the current preferred-round price.
    claimRefs:
      - CV017
      - CV018
      - CV040
      - CV041
      - CV042
      - CV049
      - CV050
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Indicative Upgrade valuation if investors apply different revenue multiples to a $1.0B public revenue anchor.
    data:
      items:
        - label: 3.0x revenue
          value: 3000
          note: Harsh lender-style bear case
        - label: 4.0x revenue
          value: 4000
          note: Still below SoFi and Affirm screens
        - label: 5.0x revenue
          value: 5000
          note: Low end of profitable multi-product fintech range
        - label: 5.5x revenue
          value: 5500
          note: Base-case midpoint close to larger public fintech comps
        - label: 7.3x implied
          value: 7300
          note: Approximate current Upgrade headline screen
        - label: 8.0x revenue
          value: 8000
          note: Bullish premium only if diligence closes key gaps
    approximationNotes: >-
      The chart intentionally keeps revenue fixed at the only public anchor to show how much of the debate is about
      multiple choice versus missing denominator evidence.
    claimRefs:
      - CV040
      - CV043
      - CV044
      - CV045
      - CV049
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull valuation ranges with explicit revenue and multiple assumptions.
    data:
      items:
        - label: Bear case
          low: 3000
          mid: 3500
          high: 4000
          note: About $1.0B revenue at 3.0x-4.0x because policy, funding, or credit risk bites
        - label: Base case
          low: 5000
          mid: 5500
          high: 6000
          note: $1.0B-$1.1B revenue at 5.0x-5.5x close to better public consumer-fintech comps
        - label: Bull case
          low: 7500
          mid: 8250
          high: 9000
          note: '>$1.2B revenue and still-premium 6.25x-6.9x multiple with clean terms and credible exit path'
    approximationNotes: >-
      Ranges are evidence-constrained but remain assumption-heavy because Upgrade does not publish audited current
      financials or the Series G preference stack.
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of Upgrade on market proof, business quality, risk, and price discipline.
    data:
      items:
        - label: Scale proof
          value: 4
          note: Large delivered-credit base and broad product set support relevance
        - label: Growth quality
          value: 3.5
          note: Profitable-growth signals exist, but they are still management-reported
        - label: Cross-sell / CAC edge
          value: 3.5
          note: BNPL funnel and marketing-efficiency claims are encouraging but unverified
        - label: Funding resilience
          value: 3
          note: Facility expansion helps, yet partner and buyer dependence remains material
        - label: Competitive durability
          value: 2.5
          note: Public comps and reopened IPOs show capable rivals and realistic valuation ceilings
        - label: Valuation discipline
          value: 1.5
          note: The Series G screen already overlaps the public bull case rather than the base case
        - label: Evidence completeness
          value: 1.5
          note: Audited financials, terms, and loss curves are still missing publicly
    approximationNotes: >-
      Scores are directional judgment aids on a five-point scale; low scores reflect missing evidence and price
      pressure, not a denial of product traction.
    claimRefs:
      - CV041
      - CV042
      - CV046
      - CV047
      - CV049
      - CV050
