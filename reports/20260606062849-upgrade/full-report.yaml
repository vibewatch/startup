      - number: '7.4'
        title: Operational, security, and reputation risk
        blocks:
          - type: paragraph
            body: >-
              Upgrade has visible security and fraud mitigants, but its public surface is more policy-oriented than
              telemetry-oriented. The company’s help center covers scams, privacy, ACH linkage, identity verification,
              and other security topics, and the company operates a Drata-powered trust center. Yet the retained public
              sources do not disclose incident history, uptime trends, fraud-loss rates, or postmortems. That creates an
              information asymmetry: there is enough evidence to know Upgrade takes spoofing and phishing seriously, but
              not enough to verify how often those controls fail in production. Reputation risk is similarly mixed.
              Trustpilot and NerdWallet show strong overall sentiment and easy-application feedback, but BBB ties
              complaints to credit reporting, ComplaintsBoard highlights rude service and delays, and public loan
              disclosures make clear that origination fees reduce proceeds. None of that alone proves systemic failure;
              together, it shows that servicing, credit-reporting, and fee transparency are the most plausible pathways
              for a manageable customer-friction issue to become a sharper conduct or brand problem.
