      - number: '4.3'
        title: Profitability signals and capital adequacy since 2020
        blocks:
          - type: paragraph
            body: >-
              Public profitability evidence is directionally positive but not audit-grade. Historically, Upgrade's
              January 2021 rewards-checking launch already described a $1 billion annualized pace of new card credit
              lines and more than 1 million monthly applicants for an Upgrade Card or loan, indicating meaningful
              acquisition scale well before the latest funding round. By 2023, CEO Renaud Laplanche told The Financial
              Brand that the company was profitable. In October 2025, Upgrade's own funding release and syndicated
              coverage described sustained profitable growth, while CNBC reported that management said the business had
              been cash-flow positive for the prior three years and had crossed $1 billion of annualized revenue in May
              2025. The same 2025 round also raised $165 million at a reported $7.3 billion valuation and brought
              lifetime equity raised to $750 million. That combination implies a platform that may be operating
              profitably while still choosing to add equity and structured liquidity to accelerate product launches,
              balance-sheet support, and distribution. The underwriting caveat is that none of those claims substitutes
              for audited product-level revenue, contribution margin, or GAAP earnings by year.
