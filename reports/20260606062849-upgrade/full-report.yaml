      - number: '1.1'
        title: Identity, inception signal, and product architecture
        blocks:
          - type: paragraph
            body: >-
              Upgrade’s own current pages consistently present the business as a financial technology company rather
              than a bank, and they show a platform that now spans personal loans, installment-style credit cards,
              checking, savings, and buy now, pay later. The company’s 2025 financing release and current homepage both
              frame the operating thesis the same way: give mainstream consumers cheaper, more predictable alternatives
              to revolving-card debt while cross-selling adjacent products through one app and partner channels. The
              chronology is less clean than the current brand story implies. Official materials use 2017 as the
              inception marker, but Reuters said Laplanche co-founded Upgrade with Soul Htite in August 2016 before the
              public 2017 launch period. Product breadth is better supported than exact borrower targeting: reviewed
              sources support a fair-credit and near-prime orientation, especially around cards and personal loans, but
              they do not prove a single official 580-700 company-wide underwriting band.
