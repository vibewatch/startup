      - number: '3.4'
        title: Non-prime and incumbent substitutes
        blocks:
          - type: paragraph
            body: >-
              Oportun and OneMain prove that Upgrade also competes with lenders whose advantage is not app elegance but
              access, servicing, and borrower rehabilitation. Oportun stays focused on smaller-ticket and secured
              personal loans for underserved users, while OneMain pairs non-prime lending with a 1,300-plus branch
              footprint and a BrightWay card that rewards on-time behavior with APR or limit improvements. Those
              products matter because they keep Upgrade from owning the near-prime recovery story outright. At the other
              end of the market, Capital One, Discover, and Synchrony represent the status-quo substitute that many
              consumers already trust: broad rewards cards, strong card acceptance, and recognizable deposit products.
              Discover's merger into Capital One further thickens that moat by combining card scale, bank distribution,
              and a larger integrated deposit franchise. Synchrony, meanwhile, reminds investors that even “card
              companies” now compete for deposits and savings attention rather than only revolving balances.
