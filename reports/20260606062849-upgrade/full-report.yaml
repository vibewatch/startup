        title: Maturity path, differentiation, and key risks
        blocks:
          - type: paragraph
            body: >-
              The strongest product-tech signal is not any one feature; it is the reuse pattern across launches. Cross
              River says Upgrade Card arrived first, Rewards Checking followed on the same bank infrastructure, and then
              OneCard, Secured OneCard, and Flex Pay extended the same control-oriented UX into adjacent use cases.
              Careers messaging reinforces that product-iteration posture with an explicit “launch, test, iterate, and
              fix” culture and a Montreal engineering center. That suggests real platform leverage rather than a pile of
              unrelated experiments. The differentiation case is therefore credible: predictable installment repayment,
              hybrid debit/credit behavior, deposit-linked rewards, automation tools, and a single app together make
              Upgrade feel more integrated than a point-solution lender. The main underwriting risk is that this
              integration still rides on external rails. Cross River, Visa, Allpoint, participating institutions, Apple,
