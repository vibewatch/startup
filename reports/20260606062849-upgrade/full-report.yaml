            body: >-
              The public record supports an expansion thesis more than a retention thesis. Upgrade clearly wants
              multi-product households: it markets bundle discounts, offers a checking switch kit, supports joint
              accounts, and argues that its product set increases lifetime value through cross-product engagement. Those
              mechanisms make intuitive sense for a digital lender trying to become a broader financial hub. Even so,
              the chapter cannot promote that into a true durability conclusion because Upgrade does not publish
              retention cohorts, repeat-borrowing rates, refinance rates, NRR, GRR, or product-level active-account
              disclosures. The few repeat-use signals available are anecdotal, not statistical. Concentration risk is
              therefore less about one enterprise customer and more about channel dependence: how much demand comes from
              merchant and dealer funnels, how much receivable demand comes from banks and credit unions, and whether
              adverse servicing friction is concentrated in products like Flex Pay or cards. Those are the key diligence
