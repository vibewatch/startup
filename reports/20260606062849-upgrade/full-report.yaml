          date: Apr 2017
          detail: Reuters reported the lender launched publicly with $60M of equity and convertible notes.
          tone: positive
        - label: OneCard launch
          date: Jul 2022
          detail: Upgrade introduced a Pay Now / Pay Later card that combined debit-like and credit-card features.
          tone: positive
        - label: Secured OneCard launch
          date: Dec 2023
          detail: Credit-builder version extended the card model to consumers with little or no credit history.
          tone: positive
        - label: Taylor lawsuit filed
          date: Dec 2024
          detail: Consumer-credit suit filed in New Mexico federal court against Upgrade and credit bureaus.
          tone: adverse
        - label: Flex Pay rebrand
          date: Dec 2024
          detail: Upgrade rebranded Uplift into Flex Pay, its BNPL platform.
          tone: positive
        - label: Settlement notice as to Upgrade
          date: Jan 2025
          detail: UniCourt recorded a notice of settlement as to Upgrade in the Taylor case.
          tone: neutral
        - label: Series G and board update
