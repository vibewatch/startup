  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和变现栈
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的收入模式比头部个人贷款产品更宽。当前产品页和合作伙伴披露显示，三层变现同时运转。第一，个人贷款仍有明确前端经济性：Upgrade 示例 APR 包含 5% 发起费；管理层告诉 The
              Financial Brand，个人贷款资产通常按面值出售给最终贷款方，并继续产生服务费。第二，卡业务通过固定利率余额、交换费和服务费增加经常性经济性。Upgrade Card 明确定位为具备分期贷款还款行为的
              Visa 卡；管理层告诉 The Financial Brand，卡应收账款会溢价出售，Upgrade
              保留服务和交换费。第三，支票和储蓄看起来是战略经济性，而不是独立的银行利差收入：当前支票和储蓄页面强调奖励、APY 和通过合作银行提供的保险；The Financial Brand
              称，当合作机构通过平台吸收存款时，Upgrade 收取费用。合在一起，公开记录支持一个由发起、服务、交换费和合作伙伴经济性构成的多元变现栈，而不是靠 Upgrade 自己资产负债表直接持有贷款和存款。
