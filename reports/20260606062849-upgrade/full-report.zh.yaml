      - number: '3.4'
        title: 非优质和既有替代品
        blocks:
          - type: paragraph
            body: >-
              Oportun 和 OneMain 证明，Upgrade 也在与优势并非 App 体验、而是准入、服务和借款人修复的贷款机构竞争。Oportun 专注于面向服务不足用户的小额和有抵押个人贷款，OneMain
              则把非优质贷款、1,300 多家分支网点，以及用准时还款奖励 APR 或额度改善的 BrightWay 卡配在一起。这些产品重要，因为它们让 Upgrade 无法独占准优质修复故事。市场另一端，Capital
              One、Discover 和 Synchrony 代表许多消费者已经信任的现状替代品：广泛的奖励卡、强卡受理能力和可识别的存款产品。Discover 并入 Capital One
              进一步加厚护城河，把卡规模、银行分销和更大的整合存款体系合到一起。Synchrony 则提醒投资人，即便是“卡公司”，现在也在争夺存款和储蓄注意力，而不只是循环余额。
