        - 与直接存款挂钩的借记卡奖励、Bill Pay Guard、Auto Balance、Allpoint 使用权
        - 需要活跃账户数和参与度指标
      - - Premier / Performance Savings
        - 在支票账户旁赚取收益并安排流动性
        - 已成熟上线
        - 通过托管扫款计划提供更高 APY 和多机构保险
        - 需要当前机构分配逻辑和客户采用率
      - - Flex Pay
        - 在结账时为旅行或零售消费融资
