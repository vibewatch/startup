      - number: '2.3'
        title: 买方和借款人分层：中等到良好信用才是真赛道
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的实际赛道是中等到良好信用消费者：他们想要固定还款和数字便利性，多于优质银行定价。独立评测一致把有效分数下限放在约 600；U.S. News 则把可获批区间描述为 500 多分后段到 600
              多分前段；NerdWallet 报告平均借款人分数 677。由此，Upgrade 位于优质银行承保与真正次级或免查信用替代品之间。定价数据也强化同一边界。NerdWallet 2026 年 6
              月利率数据称，中等信用借款人的平均 APR 为 22.86%，良好信用为 18.99%；LendingTree 的已成交贷款数据则显示，当分数跌入 580 多分和 600 多分前段，利率会升至 30%
              以上。由此形成的买方地图是：债务整合者、还款简化者和现金流借款人是核心用户；习惯 BNPL 的家庭和储蓄用户，则是相邻获客路径，不是独立市场。
