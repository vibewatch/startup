  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面和用户任务
        blocks:
          - type: paragraph
            body: >-
              Upgrade 当前产品界面更像消费金融操作层，而不是单一贷款 SKU。公开网站仍以个人贷款开场，但同一导航和主页现在展示分期式卡产品、OneCard 变体、Rewards Checking、高收益储蓄、Flex
              Pay BNPL 和统一移动 App。这种广度重要，因为客户任务彼此相连：为昂贵循环债务再融资，用可预测分期卡覆盖日常消费，把工资和现金流活动导入 Rewards
              Checking，把流动性停放在高收益储蓄账户，并在同一个移动界面管理全部。卡家族也做了分层，而非单一产品。Cash Rewards 强调简单的 1.5% 返现，Life Rewards
              强调更高品类奖励，OneCard 则在同一分期信用概念上叠加类似借记的“Pay Now”行为。结果是一张面向主流家庭预算优化的产品地图，而不是为纯资产负债表贷款量优化。
