      - number: '3.2'
        title: 持牌银行全栈同行
        blocks:
          - type: paragraph
            body: >-
              LendingClub 和 SoFi 是最接近的全栈替代品，因为两者都把个人贷款与自有存款体系配在一起。LendingClub 明确描述了韧性银行基础与轻资本撮合平台的组合，其消费者网站也把贷款与支票、储蓄和
              CD 打包。SoFi 起点不同——它是更宽的金融超级 App，覆盖银行、借款和投资——但同样用存款和会员行为，通过自动还款和直接存款折扣影响贷款经济性。相比这些同行，Upgrade
              产品完整，但资金端偏轻。它可以模仿用户可见的组合，尤其是债务整合和日常现金管理；但底层牌照和资产负债表功能仍依赖合作银行和外部资本设施。竞争意义很大：有银行的对手可以选择在资金成本上压价，或用存款经济性更长期补贴获客，Upgrade
              很难同样做到。
