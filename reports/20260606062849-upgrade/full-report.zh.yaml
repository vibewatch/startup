      - number: '8.6'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              退出可选性存在，但还不能独自支撑估值。CNBC 显示管理层在考虑 IPO 窗口和员工流动性，Chime 的 2025
              年上市也说明市场会再次为有规模的消费金融科技故事融资。这有帮助，但不够。同一批公开证据表明，后期金融科技定价仍很挑剔；Upgrade
              也没有发布经审计财务桥接或条款细节，外部投资人无法判断优先股轮次的名义估值是否能干净映射到普通股价值。因此，最后一组要求很明确：经审计合并财务、完整 Series G 优先股堆叠、渠道级 CAC 和
              LTV、产品级损失曲线，以及关键融资线背后的契约条款或集中度架构。如果这些材料证实 Upgrade
              确实应获得高于上市同业的更高质量倍数，重新接触是合理的。在此之前，这个名字应留在有纪律的跟踪名单上，而不是进入批准模式。
