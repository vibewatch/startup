      - number: '4.5'
        title: 公开证据仍不能证明什么
        blocks:
          - type: paragraph
            body: >-
              主要承保障碍不在于 Upgrade
              是否有多条收入流，而在于扣除奖励费用、资金成本、服务成本和信用损失后，这些收入流的经济性是否耐久。公开证据支持多元收入来源、反复进入资本市场，以及管理层报告的盈利增长；但仍没有披露逐年经审计 GAAP
              盈利、旗舰无抵押产品的产品级核销曲线、按获客渠道划分的 CAC
              和回本周期、服务利润率细节，或为合作机构吸收存款的确切分成。仓储融资条款也不透明：设施总额公开，但预付率、契约、合格资产触发器和集中度限制并未公开。实践上，本章可以支持对收入质量和流动性可得性的建设性看法，但承保结论仍只能是继续研究。买方应要求管理层按产品把发起量桥接到总收入、毛利、经营现金生成和所需资产负债表支持，再对常态化盈利能力采取更强判断。
