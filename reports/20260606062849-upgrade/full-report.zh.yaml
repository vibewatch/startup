figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 留存的公开里程碑显示，Upgrade 从存在争议的 2016-2017 年创立窗口，演进为卡、存款和 BNPL 并行的更宽平台；2025 年新融资已落地，投诉 / 诉讼信号也可见。
    data:
      items:
        - label: 据报道 2016 年共同创立
          date: Aug 2016
          detail: Reuters 称 Renaud Laplanche 与 Soul Htite 于 2016 年 8 月共同创立 Upgrade。
          tone: neutral
        - label: 公开上线融资
          date: Apr 2017
          detail: Reuters 报道，该贷款机构公开上线时获得 $60M 股权和可转债融资。
          tone: positive
        - label: OneCard 上线
          date: Jul 2022
          detail: Upgrade 推出 Pay Now / Pay Later 卡，结合了类似借记卡和信用卡的功能。
          tone: positive
        - label: Secured OneCard 上线
          date: Dec 2023
          detail: 信用建设版本把卡模式扩展到信用记录很薄或没有信用记录的消费者。
          tone: positive
        - label: Taylor 诉讼提交
          date: Dec 2024
          detail: 消费者信用诉讼在新墨西哥联邦法院提交，被告包括 Upgrade 和信用局。
          tone: adverse
        - label: Flex Pay 更名
          date: Dec 2024
          detail: Upgrade 将 Uplift 更名为 Flex Pay，作为其 BNPL 平台。
          tone: positive
        - label: 针对 Upgrade 的和解通知
          date: Jan 2025
          detail: UniCourt 记录了 Taylor 案中针对 Upgrade 的和解通知。
          tone: neutral
        - label: Series G 与董事会更新
          date: Oct 2025
          detail: $165M 融资、据报道 $7.3B 估值，以及 Peter Sterling 加入董事会。
          tone: positive
        - label: 当前网站规模标记
          date: Jun 2026
          detail: About 页面现在称，Upgrade 过去八年已提供超过 $47B 信贷额度。
          tone: positive
    approximationNotes: 创立窗口被刻意展示为争议点，因为当前官方材料使用 2017 年，而 Reuters 将共同创立放在 2016 年。
