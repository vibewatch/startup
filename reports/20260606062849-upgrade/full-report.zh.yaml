      - number: '4.3'
        title: 2020 年以来的盈利信号和资本充足性
        blocks:
          - type: paragraph
            body: >-
              公开盈利证据方向上为正，但未到审计级别。历史上，Upgrade 2021 年 1 月推出 Rewards Checking 时已描述新卡信用额度年化节奏 $1 billion，以及每月超过 1 million
              人申请 Upgrade Card 或贷款，说明它在最新融资前很久就有可观获客规模。到 2023 年，CEO Renaud Laplanche 告诉 The Financial Brand 公司已盈利。2025 年
              10 月，Upgrade 自身融资新闻稿和转载报道描述其持续盈利增长；CNBC 报道称管理层表示，公司此前三年现金流为正，并在 2025 年 5 月跨过年化收入 $1 billion。同一轮 2025
              年融资还以报道称 $7.3 billion 估值募集 $165 million，使累计股权融资达到 $750
              million。几项信号合在一起意味着平台可能已经盈利运营，同时仍选择增加股权和结构化流动性，以加速产品发布、资产负债表支持和分销。承保限制是，这些说法都不能替代经审计的产品级收入、贡献利润率或逐年 GAAP
              盈利。
