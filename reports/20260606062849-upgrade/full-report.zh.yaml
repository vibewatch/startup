    layout: wide
    summary: Upgrade 的模式把合作银行发起 / 发行、多产品组合、伙伴驱动分发和主流消费者获客串在一起；投诉与诉讼仍是清晰可见的风险叠加层。
    data:
      nodes:
        - id: leadership
