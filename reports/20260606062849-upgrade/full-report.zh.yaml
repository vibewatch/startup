  - id: TI003
    title: 合作伙伴 / 资产负债表经济性表
    columns:
      - 交易对手 / 渠道
      - 合作方经济性
      - Upgrade 经济性
      - 公开证据
      - 尽调含义
    rows:
      - - 信用合作社和银行买方
        - 购买符合定制买入规则的贷款，获得带收益资产
        - 发起、贷后服务和资产出售收益
        - 200+ / 约 220 家机构，定制标准，保留贷后服务
        - 表外模式降低资本强度，但依赖二级市场需求
      - - 面向较低 FICO 资产的机构投资者
        - 购买不符合典型合作信用社筛选条件的贷款
        - 发起并出表风险更高的信贷，无需长期持有
        - 当前合作伙伴页面称，FICO 低于 660 的贷款通常卖给机构投资者
        - 低信用队列的流动性是关键下行情景依赖
      - - Cross River 和其他放款银行
        - 提供牌照、合规框架，部分情况下提供资本支持
        - 快速产品上线和合作银行发起基础设施
        - 公司新闻稿按产品角色列出 Cross River、Blue Ridge、Celtic 和 Sutton
        - 银行合作方集中度和监管监督仍是重要尽调项
      - - 仓储 / PCL 融资提供方
        - 获得以应收账款抵押的敞口和费用收入
        - 用非存款流动性扩张卡和 PCL 资产
        - Cross River 融资额度在 2026 年从 $150 million 提高到 $250 million
        - 重新定价、契约或续期摩擦可能卡住增长
      - - 吸收存款的合作机构
        - 接收 Upgrade 前端吸收的存款
        - 访谈称，机构通过 Upgrade 获得存款时，Upgrade 会收取费用
        - 存款再次被描述为有价值资产，也是合作方经济性的一部分
        - 存款经济性可能改善利润率，但实际收入分成不透明
    notes: Upgrade 更像市场和分销层，而不是自筹资金的银行。出售收益、贷后服务收入和合作伙伴费用分成之间的确切拆分未公开，需要管理层材料。
