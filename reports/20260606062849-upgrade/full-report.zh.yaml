      - number: '7.3'
        title: 合作伙伴、平台和银行集中风险
        blocks:
          - type: paragraph
            body: >-
              Cross River 不只是 Upgrade 技术栈里的一个供应商。公开的公司材料和合作伙伴材料合在一起看，Cross River
              同时触及贷款发起、发卡、存款基础设施和一条重要融资线；案例研究里，它还以贷款发起银行、基础设施提供方和资金伙伴的身份出现。Upgrade 也提到 The Bancorp 等其他机构，以及 Blue
              Ridge、WebBank 的历史角色，但公开证据仍显示 Cross River 是系统里最关键的外部节点。这种依赖横跨多个产品界面，而不是集中在某一款旗舰贷款上。Cross River
              自己的案例研究称，Upgrade 现在提供六条产品线，其中四条使用 Cross River 的银行基础设施和 /
              或资金支持。关系顺畅时，这种集中度很高效；一旦监管检查、风险偏好、服务问题或合同变化导致项目中断，风险就很大。由于合作伙伴集中度和运营复杂度同步上升，投资人应把一个情景纳入承销：银行层面的问题同时传导到贷款发起、卡、存款服务和融资能力。
