  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 单位
      - 公开证据 / 状态
      - 收入质量
      - 尽调追问
    rows:
      - - 个人贷款
        - 前置发起费，加上按面值出售贷款和留存贷后服务的收益
        - 已发放贷款
        - 公开贷款示例显示 5% 发起费；访谈称贷款按面值卖给最终出资方，同时保留贷后服务费
        - 前置收入叠加经常性贷后服务；对买方胃口和损失表现敏感
        - 要求提供实际费率区间、出售溢价 / 折价，以及按放款批次划分的贷后服务 bps
      - - Upgrade Card / 个人信用额度
        - 固定利率余额产生的财务费用，加上刷卡交换费、贷后服务和买方溢价
        - 消费额和应收余额
        - 产品页展示分期卡结构和奖励；访谈称交换费、溢价出售和贷后服务都会贡献收入
        - 收入有经常性，也可能有粘性，但奖励成本和信用损失很关键
        - 要求提供扣除奖励后的净交换费、APR 实现率，以及按队列划分的买方经济性
      - - 支票账户
        - 存款导流或账户费分成，加上更便宜的信贷获客
        - 活跃账户 / 存款余额
        - 访谈称 Upgrade 为提供存款收取费用；合作伙伴页面强调交叉销售和更低贷款利率
        - 公开证据里战略价值大于直接货币化
        - 要求提供收入分成、余额、附着率，以及按队列划分的流失
      - - 储蓄账户
        - 为合作机构吸收存款余额，但利差分成不清楚
        - 平均储蓄余额
        - 当前产品页主打 3.05% APY 和合作银行保险，但 Upgrade 自身抽成率未披露
        - 间接经济性可能与合作伙伴关系绑定
        - 要求提供利差分成、余额结构和增量交叉销售转化
      - - 家装融资
        - 发起费、贷后服务费、承包商渠道分销，以及期限 ABS 发行
        - 融资项目 / 贷款提款
        - 2025 年新闻稿称累计家装融资超过 $2 billion；Fitch 预售报告显示有专用 ABS 资金
        - 如果损失表现守得住，吸引力较强，但长期数据历史还短
        - 要求提供承包商 CAC、出售收益和静态池损失曲线
      - - 汽车融资和 BNPL / 旅行渠道
        - 按渠道划分的发起收入或商户经济性
        - 发起量 / 商户交易量
        - 2025 年新闻稿提到 $1 billion 汽车融资，以及自有旅行 / 承包商 / 经销商渠道
        - 各渠道和产品的经济性可能差异很大
        - 要求按渠道提供商户折扣、复购、欺诈和损失率
    notes: 公开证据混合了当前面向消费者的定价页面、管理层访谈和融资新闻稿。Upgrade 不披露产品级收入结构，因此收入流质量只能反映有来源支撑的机制，而不是已披露比例。
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI009
      - CI024
      - CI030
      - CI034
      - CI040
