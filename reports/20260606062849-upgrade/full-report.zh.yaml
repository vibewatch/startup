            body: >-
              Upgrade 在 2026 年仍明确能拿到资金，但证据也显示这种可得性多么依赖条件。Cross River 披露，2026 年 2 月 Upgrade 以个人信用额度资产作抵押的循环设施从 $150
              million 上调至 $250 million；KBRA 称 Upgrade 的 ST2 交易是公司 2026 年第二笔定期 ABS 证券化，五档票据合计 $206.2 million。DBRS
              页面显示，另一只 2026 年信托 ST1 仍处于实时评级覆盖。缓释端证据明确；风险端同样明确，同一批证据指向对外部资本提供方、评级机构和投资者胃口的依赖。FRED 和 New York Fed
              继续提示家庭债务偏高、消费者信用逾期水平有意义；J.P. Morgan 则认为高利率环境正在改变金融科技经济性和牌照激励。信用周期一旦恶化，Upgrade 会同时遭遇抵押品表现、仓储融资和 ABS
              定价、以及合作银行意愿的冲击；公司即使基本面健康，也可能面对急剧恶化的融资条款。
