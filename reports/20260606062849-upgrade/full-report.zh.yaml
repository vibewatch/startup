    type: range
    layout: standard
    summary: 在明确收入与倍数假设下的悲观、基准、乐观估值区间。
    data:
      items:
        - label: 悲观情景
          low: 3000
          mid: 3500
          high: 4000
          note: 约 $1.0B 收入、3.0x-4.0x 倍数，政策、融资或信用风险开始压住业务
        - label: 基准情景
          low: 5000
          mid: 5500
          high: 6000
          note: $1.0B-$1.1B 收入、5.0x-5.5x 倍数，接近更好的上市消费金融科技可比公司
        - label: 乐观情景
          low: 7500
          mid: 8250
          high: 9000
          note: 收入 >$1.2B，条款干净、退出路径可信，仍可支撑 6.25x-6.9x 溢价倍数
    approximationNotes: 区间受证据约束，但仍高度依赖假设，因为 Upgrade 未公开最新经审计财务或 Series G 优先股堆叠。
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以投委会口径对 Upgrade 的市场证明、业务质量、风险和价格纪律打分。
    data:
      items:
        - label: 规模证明
          value: 4
          note: 已投放信贷规模大、产品线宽，支撑市场存在感
        - label: 增长质量
          value: 3.5
          note: 有盈利性增长信号，但仍来自管理层口径
        - label: 交叉销售 / CAC 优势
          value: 3.5
          note: BNPL 漏斗和营销效率说法有吸引力，但尚未验证
        - label: 融资韧性
          value: 3
          note: 融资设施扩容有帮助，但伙伴和买方依赖仍然显著
        - label: 竞争持久性
          value: 2.5
          note: 上市可比公司和 IPO 窗口重开显示，对手有能力，估值天花板也更现实
        - label: 估值纪律
          value: 1.5
          note: Series G 筛出的估值已经与上市乐观情景重叠，而不是基准情景
        - label: 证据完整性
          value: 1.5
          note: 经审计财务、条款和损失曲线仍未公开
    approximationNotes: 评分是五分制的方向性判断工具；低分反映证据缺失和价格压力，不是否认产品牵引力。
    claimRefs:
      - CV041
      - CV042
      - CV046
      - CV047
      - CV049
      - CV050
