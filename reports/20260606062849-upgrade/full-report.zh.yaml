        title: 身份、成立信号与产品架构
        blocks:
          - type: paragraph
            body: >-
              Upgrade 当前自有页面一致把公司呈现为金融科技公司而非银行，也显示其平台已覆盖个人贷款、分期式信用卡、支票、储蓄和先买后付。公司 2025
              年融资新闻稿和当前主页给出的经营逻辑相同：为主流消费者提供比循环卡债更便宜、更可预测的替代方案，同时通过一个 App 和合作伙伴渠道交叉销售相邻产品。时间线没有当前品牌叙事那么干净。官方材料以 2017
              年作为成立标记，但 Reuters 称，Laplanche 在公开的 2017 年发布期之前，于 2016 年 8 月与 Soul Htite 共同创立
              Upgrade。产品广度比确切借款人定位更有证据支撑：已审阅来源支持其中等信用和准优质取向，尤其是在卡和个人贷款上，但不能证明公司存在单一官方的 580-700 全公司承保区间。
