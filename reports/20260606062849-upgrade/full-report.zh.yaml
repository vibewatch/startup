            body: >-
              采用证明在平台层面最强，而不是产品层面。Upgrade 在 2025 年 8 月称已服务超过 7 million 客户、发放信用超过 $40
              billion；同一备忘录把这种规模与多产品、多渠道模式相连。公开材料显示，客户来自官网直获、商户和承包商网络、销售点 BNPL、汽车经销商，以及购买平台发起贷款的金融机构合作伙伴。仅汽车备忘录就引用了 29
              个州超过 1,000 家经销商；合作伙伴页面则引用了 200
              多家金融机构关系。公司还主张，这种结构能降低获客成本并提高客户终身价值，因为第一次互动后，它可以继续向借款人跟进支票、卡或其他信贷产品。缺的仍是分母：Upgrade
              不公布渠道组合或按产品划分的活跃账户，因此广义平台规模无法干净分配到具体客户队列。
