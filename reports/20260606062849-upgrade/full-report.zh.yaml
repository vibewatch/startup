      - number: '2.2'
        title: 规模口径：余额池巨大，可服务口袋更窄
        blocks:
          - type: paragraph
            body: >-
              不用激进 TAM 故事，余额池也很大。Equifax 报告 2026 年 1 月银行卡余额为 $1.12 trillion，New York Fed 报告 2026 年 Q1 信用卡余额为 $1.252
              trillion；LendingTree 则称 2025 年 Q4 未偿个人贷款余额为 $276 billion。合计来看，这些数字支持大约 $1.4 trillion 至 $1.5 trillion
              的广义无抵押余额机会。但 SAM 和 SOM 需要更严格。Richmond Fed 估计 2025 年 BNPL 交易额约 $70 billion，但平均未偿 BNPL 债务只有约 $3
              billion，因为四期付款贷款摊还很快。同样，存款有助于获客，但不能与信用余额相加。最干净的可服务市场下限是现有个人贷款存量；其中债务整合占比，是在证据约束下衡量 Upgrade 近期用例的最佳代理指标。
