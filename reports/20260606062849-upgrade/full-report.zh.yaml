  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局框架
        blocks:
          - type: paragraph
            body: >-
              Upgrade 已不再只与线上个人贷款发起方竞争。公开产品组合已覆盖债务整合贷款、分期式 Upgrade Card、Rewards Checking Preferred、Premier Savings 和结账端
              Flex Pay。相关竞争格局因此变成四条战线：LendingClub、SoFi 这类由存款支持的数字银行；Upstart 这类撮合平台和承保专家；Affirm、Klarna
              这类以结账和钱包为中心的分期网络；以及 Capital One/Discover、Synchrony 等大型既有卡和存款巨头。战略吸引力很明显：相比循环卡发行方，Upgrade
              能推一个更简单、固定还款的消费信贷组合，又不把用户锁进单线贷款产品。战略风险也同样明显：每个侧翼都有比 Upgrade 更强的原生资产，不管是银行牌照、商户网络、专有数据飞轮，还是大众市场信任和受理范围。
