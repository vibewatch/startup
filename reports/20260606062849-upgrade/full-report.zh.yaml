      - number: '7.5'
        title: 执行、缓释措施与终止触发点
        blocks:
          - type: paragraph
            body: >-
              承销问题不是 Upgrade 有没有缓释措施；它显然有。具名银行伙伴、活跃 ABS
              评级、反欺诈指引、身份验证披露和公开信任中心都显示公司在用真实控制运营。问题在于，大多数决定性风险变量都落在公开来源无法充分验证的范围之外。公开材料没有展示合作伙伴 SLA
              或终止权，没有展示月度信托层级损失数据，也没有展示足以证明一个多产品消费金融平台能够干净扩张的投诉处理和事件指标。这让执行质量本身成为核心风险。产品宽度扩展到贷款、卡、支票账户和存款相邻服务之后，合规运营、争议处理、资本市场执行和欺诈响应的门槛都会抬高。因此，投资人应监控一小组会打破投资逻辑的事件：Cross
              River 或另一家关键银行伙伴收缩，ABS 执行转弱，投诉和信用报告问题升级，或一次公开安全事件同时削弱多个产品的信任。
