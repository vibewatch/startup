        - 公开下限低于 Upgrade
      - - Upstart
        - 平台型个人贷款
        - 贷款：6.2%-35.99% APR，3-5 年，无提前还款费
        - 贷款页面未披露存款抓手
        - 定价和审批速度直接对标 Upgrade 贷款
      - - SoFi
        - 银行个人贷款
        - 结合自动还款、会员 / 存款折扣的动态定价；多数获批借款人可当日放款
        - 直接入账、SoFi Plus 和合格存款影响定价
        - 优质借款人若已在 SoFi 体系内，经济性可能更好
      - - Affirm
        - 四期付款和分期计划 + 借记卡
        - 0%-36% APR，取决于商户和购买金额
        - 资金账户 + 借记卡闭环
        - 结账灵活性强，债务整合定位弱
      - - Klarna
        - Visa 卡和先买后付计划
        - 定价随计划变化；卡绑定返现和余额账户 APY
        - 卡附带银行账户 / 余额账户和会员权益
        - 购物闭环强于贷款整合价值主张
      - - Oportun
        - 无抵押和有抵押个人贷款
        - $300-$10,000 无抵押；$2,525-$18,500 有抵押，APR 低于产权抵押贷
        - 以信用建设为叙事，而非存款产品包
        - 面向服务不足的小额余额用例
      - - OneMain
        - 个人贷款 + BrightWay 卡
        - 贷款：11.99%-35.99% APR；卡用 APR 或额度改善来奖励按时还款行为
        - BrightWay 将还款进度与更好条款挂钩
        - 非优质客群留存工具，但成本高于有银行底座的同业
      - - Capital One / Discover / Synchrony
        - 卡和银行账户
        - 保留来源显示，定价因具体卡和储蓄产品而异
        - 奖励、ATM 使用、存款和品牌信任
        - 传统巨头更多靠触达和信任竞争，而不是一张简化价格表
    notes: 当保留的公开页面没有给出统一 APR 表时，各行只写披露的抓手，不猜一个标称利率。
