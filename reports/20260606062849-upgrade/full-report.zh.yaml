      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              区间框架比点估计更诚实，因为公开记录仍留下太多未解的分母。乐观情景可以支撑接近或略高于 Series G 轮估值的结果，但前提是经审计收入已经明显高于 $1 billion 年化锚点，BNPL
              拉动的获客继续降低混合 CAC，且股权结构对新资金在经济上足够干净。基准情景假设 Upgrade 是一家高质量但尚未配得上溢价定价的消费金融科技平台：收入约 $1.0 billion 到 $1.1
              billion，倍数更接近规模更大且盈利的上市金融科技同业。悲观情景则假设相反：交叉销售放慢，合作银行或 BNPL 模式面临更多监管，融资摩擦增加，或公开市场可比仍锚定在 LendingClub、Upstart
              附近。由于当前估值只与乐观区间顶部重叠，并高于基准区间，新资金应把上行视为有条件兑现，而不是已经入袋。
