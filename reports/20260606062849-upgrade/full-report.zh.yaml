      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观投资逻辑的起点，是 Upgrade 平台比公开可比标签暗示的更有意思。Upgrade
              不只是个人贷款发起方。公开来源显示，它有六款产品、可观规模，以及能同时支撑卡、存款和分期贷款的合作银行基础设施。管理层披露的信号方向上很强：公司称已服务数百万客户，年化收入在 2025 年超过 $1
              billion，业务已连续三年现金流为正，Flex Pay 或 BNPL 似乎是强有力的获客引擎。反向逻辑同样清楚。当前估值已经嵌入大量上行，而核心承销事实仍未公开：经审计合并财务、优先股堆叠、渠道级 CAC 和
              LTV、产品级信用损失。再加上创始人治理包袱和趋紧的信贷政策背景，结论不是投资逻辑破裂，而是这个价格需要比公开记录目前提供的更多证据。
