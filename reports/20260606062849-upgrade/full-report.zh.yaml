      - number: '5.3'
        title: 运营架构和合作银行模式
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的运营架构从设计上就由合作伙伴牵引。官方披露反复强调 Upgrade 不是银行；Cross River 页面则说明系统实际如何运转：银行发起和账户提供由合作银行承担，卡和借记支付轨道依托 Visa
              受理，存款接入依赖 Allpoint，Upgrade 在上层负责发起 UX、承保分析、服务和移动控制。Cross River 自己的案例研究把架构说得很具体：其发卡和支付 API 为 Upgrade Card
              的后端处理和结算提供动力，Rewards Checking 则运行在 Cross River 的存款和 ACH 基础设施上。Upgrade 机构页面加入资产端转折：贷款经发起银行模式撮合，出售给合作机构，并仍由
              Upgrade 服务。这给公司带来一个可在贷款、卡和存款之间复用的平台，但也让产品连续性依赖少数外部银行、网络、ATM 和 App 分发关系。
