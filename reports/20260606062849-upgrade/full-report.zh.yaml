  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: >
    Upgrade 销售无抵押个人贷款、封闭式分期卡产品、OneCard 借记 / 信用混合卡、支票和储蓄账户、Flex Pay
    BNPL，以及相邻的汽车和房屋装修融资。产品设计强调固定还款、数字化账户管理，以及贷款、卡和存款界面之间的交叉销售。
  customerFocus: >
    美国主流消费者，尤其是中等信用和准优质家庭，他们把信用用于债务整合、大额购买、应急、旅行、房屋装修或汽车需求。公开证据显示 Upgrade
    触达广泛消费者；承保比只做优质客群的银行卡更包容，但出售给合作伙伴的资产池比深度次级贷款机构更干净。
  businessModel: |
    Upgrade 靠组合收入变现：贷款发起费、服务费收入、交换费、存款相关费用，以及经合作银行和资本市场融资出售资产时的收益或溢价。BNPL 和卡产品看起来是摩擦更低的获客入口，长期可把用户导向其他贷款和存款产品。
  stage: Series G
  fundingStatus: 累计股权融资 $750M；2025 年 10 月宣布 $165M Series G，报道称估值 $7.3B。
