        - 示例为 $10,000 / 36 个月 17.98% APR，包含 5% 发起费，无提前还款费
        - 借款人；贷款由合作银行发放
        - 前置费用收入和计息产品设计证据清楚
        - 示例定价不是实际组合均值，也不是完整利率区间
      - - Upgrade Card Cash Rewards
        - 无限 1.5% 现金返还，无年费
        - 持卡人消费；通过合作银行模式发行
        - 说明分期卡财务费用之外，还能叠加交换费收入
        - 奖励支出后的净利润率未披露
      - - Upgrade Card Life Rewards
        - 汽油、杂货等消费 3% 现金返还，无年费
        - 持卡人消费
        - 奖励更厚，意味着交换费利润率更低；除非卡收益率或交叉销售能抵消
        - 营销优惠看不出组合结构或盈利能力
      - - Upgrade Select
        - $39 年费
        - 持卡人消费
        - 年费档位说明可能存在更高价值或分层经济性
        - 公开数据未披露该档位采用率或留存
      - - Rewards Checking Preferred
        - 最高 2% 现金返还；每月 $1,000 直接存款可解锁通往 Performance Savings 更高 APY 的路径
        - 通过合作银行结构提供的存款账户
        - 存款奖励似乎用来加深绑定，并降低贷款获客成本
        - 现金返还支出和收入分成未披露
      - - Premier Savings
        - 余额 $1,000 或以上享 3.05% APY
        - 通过 Cross River 或参与机构提供的存款账户
        - 收益率有吸引力，可能帮助留住客户，也帮合作方吸收存款
        - 未披露 Upgrade 的利差分成或支撑该账户的服务成本
    notes: 本表记录挂牌或营销定价，不是实际客户经济性。公开产品页可用来识别变现抓手，但不能衡量组合平均收益率、奖励支出或抽成率。
