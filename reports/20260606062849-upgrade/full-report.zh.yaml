      - number: '8.3'
        title: 上市公司与交易可比筛选
        blocks:
          - type: paragraph
            body: >-
              压力测试 Series G 轮估值最干净的办法，是看公开市场今天愿意为类似消费金融科技收入支付多少倍数。按保留的 2026 年 6 月数据，Affirm 和 SoFi 的交易价格都约为五倍往绩收入，而
              LendingClub 和 Upstart 筛选结果低得多。即使 Upgrade 因多产品架构和交叉销售动作应获得溢价，据报道的 Series G
              轮价格仍高于已披露上市可比区间。交易可比也不能完全托住这个估值。Chime 重启 IPO 对后期金融科技偏好是建设性的，但它也说明，后期私募估值在公开定价前可以大幅重置。Klarna 的 2026
              年披露节奏有助于提升透明度，但保留的公开记录在估值上仍不如在运营可见性上明确。净结果：公开市场和交易证据支持把 $7.3 billion 读作合理到偏高，而不是明显便宜的入场点。
