        - 要求提供 2020 年以来按产品拆分的已审计年度和季度收入
      - - 毛利率和贷后服务利润率
        - 无法把发放量桥接到贡献利润率
        - 访谈称保留贷后服务且存在费用收入
        - 要求提供产品 P&L 和按渠道划分的贷后服务经济性
      - - 净利润 / EBITDA / 现金消耗
        - 无法验证盈利声明质量
        - CEO 和投资人关于盈利增长和现金流为正的表述
        - 要求提供已审计财报和月度管理账
      - - 仓储预付率和契约
        - 无法建模再融资压力或借款基础折扣
        - 只有 $250 million 融资额度标题
        - 要求提供融资协议、契约包和抵押品合格性测试
      - - 产品级逾期和核销曲线
        - 无法验证个人贷款或 Upgrade Card 的违约假设
        - Fitch 家装 ABS 假设和宏观银行代理指标
        - 要求按产品、放款批次和渠道提供静态池明细数据
      - - CAC、回本周期和渠道贡献
        - 无法证明各来源渠道的低成本获客或利润率耐久性
        - 2021 年月申请量规模，以及旅行 / 承包商 / 经销商分销说法
        - 要求按直销、旅行、承包商、汽车和 BNPL 渠道提供队列 CAC、复购率和回本周期
      - - 存款利差 / 费用分成
        - 无法判断存款是利润中心还是获客补贴
        - 访谈称，机构通过平台吸收存款时 Upgrade 会收到费用
        - 要求提供合作协议、平均余额和单账户毛利
    notes: 这些不是泛泛而谈的资料清单：每个缺口都会阻断一条从公开发放量和产品说法通往正常化盈利能力与流动性韧性的承销桥。
