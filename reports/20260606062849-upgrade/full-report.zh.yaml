      - number: '7.4'
        title: 运营、安全与声誉风险
        blocks:
          - type: paragraph
            body: >-
              Upgrade 有可见的安全和反欺诈缓释措施，但公开界面更偏政策披露，而不是遥测数据。公司帮助中心覆盖诈骗、隐私、ACH 绑定、身份验证等安全议题，也运营一个由 Drata
              支撑的信任中心。不过，保留的公开来源没有披露事件历史、可用性趋势、欺诈损失率或复盘。这造成信息不对称：证据足以说明 Upgrade
              重视冒名和钓鱼攻击，但不足以验证这些控制在生产环境里多常失效。声誉风险同样混合。Trustpilot 和 NerdWallet 显示整体情绪强、申请体验反馈好；但 BBB
              把投诉指向信用报告，ComplaintsBoard
              突出服务粗鲁和延误，公开贷款披露也说明发起费会减少到账资金。单看这些都不能证明系统性失败；合在一起看，服务、信用报告和费用透明度最可能让可控的客户摩擦升级为更尖锐的行为规范或品牌问题。
