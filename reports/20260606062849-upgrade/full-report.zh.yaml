      - number: '2.5'
        title: 监管和估值含义
        blocks:
          - type: paragraph
            body: >-
              监管和数据可见性比表面 TAM 更决定这个市场的质量。CFPB 持续追踪发起量和借款人队列；CRS 显示，BNPL 政策争议仍围绕 Truth in Lending
              覆盖、信用报告，以及政策制定者是否有足够视野看清四期付款义务。Richmond Fed 和 Federal Reserve 证据也解释了 BNPL
              为何相关但不具颠覆性：它相对卡规模仍小，却被财务受限家庭不成比例地使用，因此不能当作无摩擦增长品类。Upgrade 的估值因此应锚定在狭窄无抵押信用和再融资池的盈利捕获上。正确的尽调问题不是消费者金融科技 TAM
              是否巨大，而是 Upgrade 能否在不滑入核销、监管或获客成本压力快于收入增长的队列的情况下，从中等到良好信用借款人中拿到一块盈利份额。
