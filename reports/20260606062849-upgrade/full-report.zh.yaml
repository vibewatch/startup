  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：无抵押信用优先，存款其次
        blocks:
          - type: paragraph
            body: >-
              分析 Upgrade 时，首先应把它看作无抵押消费信贷平台，而不是泛金融科技或全服务数字银行。相关问题是家庭需要为高成本循环余额再融资、平滑大额购买，或把波动的每月卡还款转成固定分期计划。Upgrade
              自身产品组合支持这一较窄边界：它营销最高 $50,000 的个人贷款、分期式 Upgrade Card、Rewards Checking 和 3.05% APY
              储蓄账户。存款产品重要，因为它们能获取对利率敏感的家庭并支撑交叉销售，但存款本身不会创造新的核心贷款 TAM。真正替代品仍是循环银行卡、其他个人贷款、结账 BNPL，以及某些情况下动用储蓄或 0%
              促销卡。这个框架让本章锚定在可变现的信用需求上，而不是把所有消费者存款或所有金融科技活动都算作 Upgrade 可触达收入，进而抬高机会规模。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM040
              - CM042
