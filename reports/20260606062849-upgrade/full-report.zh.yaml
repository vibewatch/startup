companyProfile:
  summary: >
    Upgrade 是一家总部位于 San Francisco 的消费金融公司，由 LendingClub 前成员创建，目标是为传统无抵押贷款和循环信用产品提供数字化替代。公司当前公开版图覆盖个人贷款、偏分期的 Upgrade Card
    系列、OneCard 借记 / 信用混合卡、储蓄和支票账户、Flex Pay BNPL，以及部分汽车和房屋装修融资项目。公司不设分支网点，而是借助合作银行基础设施在线覆盖全美，并围绕希望获得更简单、固定还款信用工具的主流消费者定位。
  foundedDate: '2017-01-01'
  founders:
    - name: Renaud Laplanche
      role: 联合创始人兼 CEO
      background: LendingClub 创始人、前 CEO；负责 Upgrade 的战略、融资和公开定位。
      claimRefs:
