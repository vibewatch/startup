  - id: TP003
    title: 资金、分销与信任对比
    columns:
      - 公司
      - 资产负债表 / 合作伙伴模式
      - 分销触点
      - 信任 / 监管线索
      - 对 Upgrade 的影响
    rows:
      - - Upgrade
        - 合作银行提供贷款、卡和存款；外部资本额度
        - 直面消费者的 App 和网页流程
        - 金融科技品牌；银行伙伴承担存款保险和牌照功能
        - 产品灵活度高，但资产负债表控制较弱
      - - LendingClub
        - 自有银行 + 市场平台
        - 数字银行关系和现有会员基础
        - FDIC 保险银行叙事
        - 看重存款信任的债务整合客户，会把它视为更接近的替代品
      - - Upstart
        - 仅市场平台；贷款由合作机构发放
        - 100+ 家银行合作伙伴和贷款方集成
        - 受监管金融机构贷款方模式
        - 分销网络大于 Upgrade，但直接交叉销售触点更少
      - - SoFi
        - 自有全国性银行
        - 横跨银行、投资和借贷的 App 生态
        - 银行发行的存款和卡产品
        - 能靠关系经济性为优质用户给出比 Upgrade 更有吸引力的条件
      - - Affirm
        - 合作银行资金账户和卡产品
        - 商户结账、App、虚拟卡和借记卡
        - 非银行；资金账户由合作银行持有
        - 商户行为和 App 习惯与 Flex Pay 竞争
      - - Klarna
        - 合作银行余额账户和卡
        - Visa 受理网络 + App 驱动购物和合作伙伴优惠
        - 存款由 WebBank 持有，不在 Klarna
        - 结账和购物闭环强于 Upgrade 已披露的 BNPL 触达
      - - OneMain / Oportun
        - 资产负债表消费者贷款
        - OneMain 有线下网点；两者都面向服务不足的信贷客群
        - 长期贷款机构定位 + 信用修复叙事
        - 这些对手守住信用重建赛道，Upgrade 只覆盖其中一部分
      - - Capital One / Discover
        - 大型一体化银行和卡平台
        - 大众市场卡受理、70,000+ 台免手续费 ATM、银行产品
        - 美联储批准的合并纳入 Discover Bank
        - 传统巨头的信任和分销压住 Upgrade 的主流市场上行空间
      - - Synchrony
        - 嵌入式金融 + 线上银行
        - 商户金融关系和存款营销
        - FDIC 保险储蓄产品
        - 说明即便卡专业户如今也在争夺存款注意力
    notes: 本表聚焦结构性信任和分销优势，而不是哪家品牌的功能列表最花哨。
