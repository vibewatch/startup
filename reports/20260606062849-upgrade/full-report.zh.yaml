          detail: Laplanche 和 Wierman 锚定战略与产品主导权。
        - id: bank-partners
          label: 合作银行通道
          detail: Cross River、Blue Ridge 和 Celtic 支撑发行与放贷能力。
        - id: products
          label: 贷款 + 卡 + 存款 + BNPL
