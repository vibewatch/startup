      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的需求逻辑很直接：卡余额仍高于 $1.1 trillion，2026 年 4 月循环信用增速仍快于非循环信用，超过一半个人贷款借款人用贷款整合债务。Fitch
              还显示，金融科技贷款机构如今发起一半无抵押个人贷款债务，数字分销已成为主流。约束端同样重要。TransUnion 描述的是 K 型信用市场：超优质家庭更强，非优质家庭承受更多可负担性压力。Federal
              Reserve 研究显示逾期趋于稳定、没有螺旋上升，但原因不是低端客群变得更安全；压力仍集中在那里。Upgrade 已审阅 APR
              和费用区间意味着，低端用户使用产品仍可能很贵；如果承保过度下探，留存、盈利能力和公平贷款容忍度都会被压住。
