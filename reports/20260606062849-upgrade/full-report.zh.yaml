      - number: '5.2'
        title: 客户流程和还款 UX
        blocks:
          - type: paragraph
            body: >-
              客户流程从发起到服务都刻意由 App 介导。个人贷款获客先从软性查价开始，再进入验证和放款。卡 UX 围绕控制感而非免息浮动设计：Upgrade Card 把消费转成固定利率分期余额；OneCard
              让用户决定某笔交易应像借记一样“Pay Now”，还是随时间摊还“Pay Later”。存款产品补上循环另一半。Rewards Checking 推直接存款奖励、提前发薪、账单支付、移动支票存款、免手续费
              ATM，以及在支票和储蓄之间自动转钱的智能转账工具。移动 App 随后成为控制平面，覆盖贷款、卡、BNPL
              和存款账户的付款、余额查询、转账、奖励追踪和信用健康监测。弱点在例外处理：公开服务页面仍描述可能耗时数周的人工支票流程，近期 Android 评论也抱怨付款分配和自动还款不清晰。
