        - 继续研究并跟踪，不现在买入
        - 该估值标记只与公开乐观情景的上沿重叠
        - 经审计数字和条款补上主要缺口后，才继续推进
    notes: 本表把证据转成投委会姿态，而不是泛泛的质量分。估值立场绑定留存的公开收入锚点和已披露的可比公司组合。
