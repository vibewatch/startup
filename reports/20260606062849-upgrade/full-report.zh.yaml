        - 2025 或 2026 年收入显著低于 >$1B 年化公开锚点
        - 当前估值标记不再像高溢价增长业务，转而明显偏高
        - 把入场价重置到悲观情景水平
      - - BNPL 向核心产品转化走弱
        - Flex Pay 或 BNPL 带来用户，却不能证明可盈利地交叉销售到卡或贷款
        - 获客效率逻辑和溢价倍数同时失效
        - 重新介入前先要求渠道经济性证据
      - - 融资条款收紧
        - 仓储或前向流转契约、预付率或集中度限制明显收紧
        - 合作银行和流动性依赖成为股权价值上限
        - 压低估值并上调风险评级
      - - 政策负担上升
        - BNPL 或合作银行监管显著增加承保、报告或牌照成本
        - 利润率韧性和增长速度双双下降
        - 把基准情景推近类贷款机构倍数
      - - 轮次条款保护性强
        - 股权结构表显示新优先股有强优先权或参与权
        - 名义投后估值高估普通股价值
        - 只按普通股经济性重切交易
      - - 信用周期恶化重启
        - 非优质客群压力和循环余额压力恶化，超过当前 2026 年读数
        - 损失预期和获客质量双双恶化
        - 下调信心，重审悲观情景假设
    notes: 触发因素同时覆盖公开监测项和私有尽调门槛，因为当前建议更多被估值和披露卡住，而不是缺少需求证据。
