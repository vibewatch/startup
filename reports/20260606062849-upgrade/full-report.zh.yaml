      - number: '3.3'
        title: 撮合平台和 BNPL 同行
        blocks:
          - type: paragraph
            body: >-
              Upstart、Affirm 和 Klarna 从不同角度与 Upgrade 竞争。Upstart 是最强的承保和分销对手：其披露的 100 多家银行合作网络、大量贷款历史和 AI 定位，比 Upgrade
              有公开证据支持的外部触达更广，尽管 Upstart 缺少 Upgrade 的直接存款和卡入口。Affirm 和 Klarna 则把问题倒过来。它们的核心行为是结账和 App
              驱动的分期使用，不是债务整合，但两者都增加了借记或余额账户功能，把消费者拉进类似银行的日常循环。Upgrade 的卡和 Flex Pay 产品介于两种模式之间。卡看起来像带固定还款基因的主流消费替代品，Flex
              Pay 则让 Upgrade 能触达销售点分期，而不必变成纯商户网络。这种混合架构有差异化，但也意味着 Upgrade 必须同时防守两条战线：对阵撮合平台看承保质量，面对 BNPL 网络看习惯养成。
