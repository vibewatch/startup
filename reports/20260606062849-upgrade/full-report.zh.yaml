      - number: '8.5'
        title: 下行触发点与入场纪律
        blocks:
          - type: paragraph
            body: >-
              下行情景的核心不在 Upgrade 能否继续增长；而在当前价格下，公开信号是否夸大了增长质量。第一个触发点是分母风险：如果经审计的 2025 年收入或 2026
              年运行率数据低于当前公开叙事，隐含倍数可能显得明显过高。第二个是转化风险：Upgrade 的估值现在很大程度依赖一个判断，即 BNPL
              是低成本获客漏斗，能把客户导入更高价值的贷款和卡产品。如果这些队列没有顺利转化或成熟表现不佳，溢价会很快蒸发。第三个是政策和融资风险。CRS、CFPB、Richmond Fed
              和征信机构数据都强化了一个事实：BNPL 和无担保消费信贷仍具有政治可见度，也受经济周期影响。实际承销回应很简单：在接近公开宣称的 Series G 价格付费前，要求清晰条款、耐久队列经济和有韧性的融资得到证明。
