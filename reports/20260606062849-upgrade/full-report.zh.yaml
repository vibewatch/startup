      - number: '4.4'
        title: 信用表现代理指标和下行证据
        blocks:
          - type: paragraph
            body: >-
              公开信用表现证据对结构和假设的支撑，远强于对实际组合结果的支撑。Upgrade 当前合作伙伴页面显示，贷款购买渠道的消费者基础相当优质：个人贷款加权平均 FICO 为 725，房屋装修融资为 775；同时注明
              sub-660 FICO 贷款通常导向机构买方。Fitch 2026 年 4 月 UPG HI 2026-1 报告给出更硬的下行数学：基准情景全生命周期违约为 7.66%，评级情景违约为
              24.2%，假设零回收，并且 2022 年才开始的项目历史有限。宏观环境也没有温和到可以忽视这些假设。New York Fed 称 2026 年 Q1 家庭债务中 4.8% 逾期，卡早期逾期迁移仍为年化
              8.6%；FRED 银行表显示消费贷款核销率 2.64%、信用卡核销率 3.84%。服务和消费者体验风险上也有反向证据：由 CFPB 数据构建的投诉汇总显示，针对 Upgrade 的投诉大约 4,000+
              起，集中在信用报告、债务催收、付款和意外费用问题。任何投诉数据库都不能证明单位损失，但它们确实提示了可能侵蚀贡献利润率的服务、合规和补救成本。
