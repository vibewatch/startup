        - 申请快，且无逾期费或提前还款费
        - 需要当前美国商户名单、贷款方版图和单位经济模型
      - - 移动 App + Credit Health
        - 用一台设备管理全套账户
        - 已成熟上线
        - 一个 App 覆盖贷款、卡、BNPL、存款、奖励和信用分监测
        - 需要发布说明节奏和各产品功能采用率
      - - 合作银行 / 控制层
