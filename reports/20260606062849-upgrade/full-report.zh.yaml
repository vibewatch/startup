      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 推荐
        - 观察
        - 业务质量可信，但当前估值水平下，公开估值支撑仍不完整
        - 保持跟进，但不要把 Series G 公布估值直接按明显便宜来投资论证
