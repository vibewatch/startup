      - number: '3.5'
        title: 耐久性与下行
        blocks:
          - type: paragraph
            body: >-
              Upgrade 最有证据支撑的护城河是整合，而不是所有权。Cross River 描述了一个覆盖贷款、卡、存款和信贷设施的共享平台；Upgrade 自身产品页也展示了从贷款到账户消费再到 BNPL
              的连贯旅程。整合有意义，因为它给 Upgrade 的交叉销售界面多于 Upstart、Oportun 或单产品 BNPL
              商户流。但同一批证据也说明护城河为什么脆弱。合作伙伴集中带来对外部银行和资本提供方的依赖；持牌银行同行可以靠自有资金；BNPL
              专家仍掌握更强的结账习惯；既有巨头在信任、受理和奖励预算上的规模完全不同。换句话说，Upgrade
              已经搭出一个有吸引力的组合，但竞争耐久性仍取决于它能否证明，这套组合足以降低获客成本或抬高客户终身价值，抵消牌照、网络和资产负债表控制较弱的劣势。
