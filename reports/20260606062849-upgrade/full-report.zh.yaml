      - number: '4.2'
        title: 合作银行、仓储融资和证券化架构
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的资本架构看起来刻意轻资产，但仍高度依赖外部交易对手。官方披露称贷款和信用额度由合作银行发行；合作伙伴和访谈材料称，出售资产通常不留在 Upgrade 资产负债表上，但仍由 Upgrade
              服务。该结构降低了对完整银行资产负债表的需求，也意味着流动性取决于买方需求、合作银行关系和再融资市场能否保持健康。当前证据栈对资金可得性较正面：Cross River 支持的披露显示，个人信用额度设施在 2026
              年从 $150 million 上调到 $250 million；KBRA 称 Upgrade 在 2026 年完成第二笔无抵押消费贷款定期 ABS；Fitch 在 2026 年 4 月评级另一笔 $316.1
              million 房屋装修 ABS；SEC 文件显示 2017 至 2026 年 ABS-15G 记录未中断。主要承保结论是，Upgrade
              显然能反复进入仓储融资和资本市场执行，但可见性集中在资产和设施层面，而不是合并公司现金层面。
