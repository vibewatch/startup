        title: 耐久性、扩张和开放问题
        blocks:
          - type: paragraph
            body: >-
              公开记录更支持扩张逻辑，而非留存逻辑。Upgrade
              显然想要多产品家庭：它营销捆绑折扣，提供支票切换工具包，支持联名账户，并主张产品组合通过跨产品互动提高客户终身价值。捆绑、切换工具和联名账户对试图从数字贷款机构变成更广泛金融中枢的公司来说直观合理。即便如此，本章不能把它拔高为真正的耐久性结论，因为
              Upgrade 不公布留存队列、重复借款率、再融资率、NRR、GRR
              或产品级活跃账户披露。少数可用重复使用信号只是个案，不是统计证据。因此，集中风险并不是某一个企业客户，而是渠道依赖：多少需求来自商户和经销商漏斗，多少应收资产需求来自银行和信用合作社，以及反向服务摩擦是否集中在
              Flex Pay 或卡等产品。在积极承保 LTV 或交叉销售假设前，上述问题是关键尽调要求。
