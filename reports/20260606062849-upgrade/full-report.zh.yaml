  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 影响
    rows:
      - - 一体化固定还款产品包
        - 持牌银行同业用更低资金成本复制表层体验
        - 高
        - LendingClub 和 SoFi 将贷款与自有存款绑定，Upgrade 则依赖合作伙伴
        - Upgrade 需要更强 UX 和交叉销售，抵消较弱的资金控制
      - - 合作银行速度
        - 集中依赖 Cross River 和银行合作伙伴
        - 高
        - Cross River 覆盖发起、卡、存款和 2026 年额度扩张
        - 运营杠杆和依赖度同步上升
      - - 分期卡差异化
        - 结账网络掌握更多日常消费意图
        - 高
        - Affirm 和 Klarna 的产品围绕商户或 App 驱动的购买行为展开
        - Upgrade 可以赢在清晰度，但仍可能输在习惯和分销
      - - 全栈宽度
        - 传统巨头在奖励、信任和受理上投入更多
        - 高
        - Capital One / Discover 和 Synchrony 已经把卡、存款和广泛触达组合起来
        - 除非 Upgrade 明显更便宜或更简单，主流用户可能默认选择传统巨头
      - - 数字便利性
        - OneMain 和 Oportun 守住信用修复赛道
        - 中
        - OneMain 网点和 BrightWay 里程碑，加上 Oportun 有抵押准入，很难用纯数字方式复制
        - 需要辅导或线下安心感的借款人，Upgrade 可能服务不足
      - - BNPL 邻近业务
        - 监管口径变化改变经济性或披露
        - 中
        - CFPB 撤回 2024 年解释性规则，监管方仍把 BNPL 视为演进中领域
        - 合规成本和产品条款的变化速度可能超过产品包叙事
      - - 交叉销售逻辑
        - 公开证据未显示实际附加或留存提升
        - 中
        - 尽管产品集较宽，产品包经济性仍未公开
        - 护城河逻辑因此仍缺一部分验证
      - - 中端市场定位
        - Upgrade 受到两端挤压
        - 高
        - 其他平台有更低 APR 下限，传统巨头或结账网络拥有更强信任或触达
        - 公司必须证明产品包改变单位经济性，而不只是换了说法
    notes: 严重性反映该风险对 Upgrade 的竞争重要性，而不是单看对手产品的绝对质量。
