    title: 客户情况
    sections:
      - number: '6.1'
        title: 借款人分层和定位
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的公开客户证据指向的是满足广泛主流消费信贷需求的贷款机构，而不是只服务超优质家庭。公司自己称服务主流消费者，最可信的评测网站也一致把 Upgrade
              描述为中等信用可及，而非排他性产品。最关键的细节是，面向消费者的评测网站把贷款资格起点描述在约 580 到 600；而面向银行和信用合作社的购买项目，则强调平均 FICO 高于 720、合作伙伴最低标准 660+
              的优质加权贷款池。这种组合意味着 Upgrade 获取的借款人信用谱系，比它向存款机构营销的应收资产池更宽。实践上，最清晰的公开客户分层是债务整合借款人、快速融资应急借款人、Upgrade Card
              用户、Rewards Checking 家庭，以及经汽车、房屋装修和 BNPL 入口进入的销售点借款人。
