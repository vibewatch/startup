  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格背景与建议
        blocks:
          - type: paragraph
            body: >-
              Upgrade 据报道的 $7.3 billion Series G 估值应按价格来承销，而不是当作泛泛的质量标签。支持性证据确实存在。官方和转载报道确认了 $165 million 融资、已提供超过 $42
              billion 信贷、超过 7.5 million 名客户、六款产品、累计股权融资 $750 million，以及管理层披露的年化收入超过 $1 billion、现金流为正。这些事实让 Upgrade
              区别于典型的小规模线上贷款机构。但估值纪律仍然重要。相对唯一公开收入锚点超过
              7x，轮次价格已经计入持续交叉销售效率、温和的融资可得性和有序的后期退出市场。拥有披露财务数据的上市可比公司今天并未达到同样门槛。因此，最站得住脚的 IC
              立场是以中等信心、高风险继续观察：业务质量看起来可信，但价格仍依赖尚未公开的尽调假设。
            claimRefs:
