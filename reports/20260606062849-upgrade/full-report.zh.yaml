      - number: '5.4'
        title: 信任、合规和产品质量信号
        blocks:
          - type: paragraph
            body: >-
              公开信任和质量信号有好有坏，但不是空白。正面看，Upgrade 发布了协调漏洞披露政策，在帮助中心记录诈骗和 ACH 安全主题，并为 Performance Savings
              和有抵押卡储蓄账户提供少见的明确托管存款披露。应用商店披露也显示公司持续维护、有隐私披露且评论量大。负面看，留存证据大多停留在流程层面，不是保证层面。已审阅来源中没有公开漏洞赏金，没有下载到 SOC 2 或
              PCI 包，也没有浮现面向客户的状态页或正常运行时间承诺。客户体验证据同样不均衡。Apple 评分很强，Trustpilot 规模大，评测网站赞扬速度和开户注册便利；但 Google Play
              评论描述付款误用、分期可见性不清、以及扰人的信用额度变化。信号组合支持一种判断：产品运营能力合格，但服务和保证层面仍有明显盲点。
