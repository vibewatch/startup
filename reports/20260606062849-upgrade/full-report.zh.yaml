  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和行为风险
        blocks:
          - type: paragraph
            body: >-
              Upgrade 的银行合作结构不是监管护城河，而是核心监管风险界面。Upgrade 公开称自己不是银行，而是依赖合作银行发起贷款、发行卡并提供存款产品；公司自身则发布 NMLS 和州牌照披露。该模式让
              Upgrade 落在银行合作监管的冲击半径内，因为律所对 2024 年机构声明的分析称，合作银行仍要为外包记录、披露、Regulation E 争议、AML 控制，以及客户对责任主体的混淆负责。2026 年
              White House 命令方向上利好创新，但它明确保留安全稳健、消费者保护和监督，而不是取消这些要求。公开反向证据并非空白：BBB 称 2026 年投诉审查涉及信用报告问题，UniCourt
              显示至少一宗近期消费信贷诉讼记录了和解通知。结果是，即便今天没有已知 CFPB 执法行动，行为或投诉管理失败仍有较高剩余风险，可能演变为更广泛的监管或诉讼问题。
