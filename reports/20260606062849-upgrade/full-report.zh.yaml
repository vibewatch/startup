  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 为什么重要
      - 什么会改变判断
    rows:
      - - 多产品规模真实存在
        - 已发放信贷超过 $42B、客户 7.5M+、六个产品，说明它不只是单一产品贷款机构
        - 如果经审计数字显示每客户变现弱或补贴很重，下调判断
      - - BNPL 可能是高效漏斗
        - 据报道，BNPL 贡献约 75% 新用户，并在整合 Uplift 后让年收入翻倍
        - 如果队列向更高价值产品的转化差，下调判断
      - - 管理层口径盈利能力有正面意义
        - 现金流为正和盈利增长，可以支撑比困境贷款机构更高的出价
        - 如果经审计 2025 或 2026 年业绩明显落后于叙事，下调判断
      - - 公开可比公司仍显得更便宜
        - Affirm 和 SoFi 交易在接近 5x 收入，LendingClub 和 Upstart 明显更低
        - 只有增长、利润率和损失表现比同业更干净，Upgrade 才配得上溢价
      - - 治理与监管增加摩擦
        - 创始人历史、BNPL 或合作银行审查都会抬高尽调负担
        - 只有治理、检查和合规架构能被证明足够扎实，才上调判断
      - - 轮次条款可能比名义估值更重要
        - 优先股保护可能显著转移普通股价值
        - 只有完整审阅股权结构表和优先股堆叠后，才上调判断
    notes: 本表把乐观逻辑与可能推翻它的精确证据配对。目标是让估值纪律始终绑定仍会在尽调中变化的事实。
