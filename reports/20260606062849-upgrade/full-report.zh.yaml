        - 高
        - 信用周期分化、合作伙伴依赖、监管和披露缺口仍然都很关键
        - 相比干净的 SaaS 式增长故事，需要更厚的安全边际
      - - 估值立场
        - 偏高至合理
        - 隐含收入倍数 >7x，高于已披露公开可比公司的约 1.9x-5.4x 区间
        - 只有尽调证明乐观情景经济性，才接近标记价出价
