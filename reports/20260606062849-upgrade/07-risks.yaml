    {
      "id": "partner-platform-and-bank-concentration-risk",
      "title": "Partner, platform, and bank concentration risk",
      "body": "Cross River is not just one vendor in Upgrade’s stack. Public company and partner materials together show Cross River touching origination, card issuance, deposit infrastructure, and a major funding line, while also appearing in a case study as the originating bank, infrastructure provider, and capital partner. Upgrade does name other institutions such as The Bancorp and historical roles for Blue Ridge and WebBank, but public evidence still makes Cross River the most consequential external node in the system. The dependency runs across several product surfaces rather than a single flagship loan. Cross River’s own case study says Upgrade now offers six product lines and that four of them use Cross River for banking infrastructure and or capital support. This concentration is efficient when the relationship works; it is dangerous if regulatory exams, risk appetite, servicing issues, or contractual changes cause a program interruption. Because partner concentration and operational complexity rise together, investors should underwrite a scenario where a bank-level issue propagates simultaneously into originations, cards, deposit servicing, and funding capacity.",
