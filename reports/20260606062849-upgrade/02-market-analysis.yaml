- id: regulatory-and-valuation-implications
  title: Regulatory and valuation implications
  body: 'Regulation and data visibility shape the quality of this market more than headline TAM does. CFPB continues to track originations and borrower cohorts, and CRS shows that BNPL policy debate still centers on Truth in Lending coverage, credit reporting, and whether policymakers have enough visibility into pay-in-four obligations. Richmond Fed and Federal Reserve evidence also shows why BNPL is relevant but not transformative: it remains small relative to cards, yet it is disproportionately used by financially constrained households and therefore cannot be treated as a frictionless growth category. For Upgrade, that means valuation should anchor on profitable capture of a narrow unsecured-credit and refinance pool. The right diligence question is not whether consumer-fintech TAM is enormous; it is whether Upgrade can take a profitable slice of fair-to-good borrowers without drifting into cohorts that raise charge-off, regulatory, or acquisition-cost pressure faster than revenue grows.'
