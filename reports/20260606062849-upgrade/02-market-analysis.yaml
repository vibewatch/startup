figures:
- id: FM001
  title: Adoption funnel or value-chain map
  type: flow
  layout: wide
  summary: Typical path from a high-APR card balance or large expense into Upgrade's installment products and then into a broader relationship.
  data:
    nodes:
    - id: need
      label: High-APR revolving balance or large expense
      detail: The consumer starts with card debt, payment volatility, or a one-time spend need.
    - id: search
      label: Digital comparison and soft prequalification
      detail: Borrower compares refinance, BNPL, status-quo revolving, and digital-lender options.
    - id: underwrite
      label: Score and cash-flow underwriting
      detail: Fair-to-good borrowers are the most natural fit; weaker cohorts face much higher rates.
    - id: credit
      label: Personal loan or Upgrade Card selection
      detail: Consumer chooses a closed-end loan or an installment-style card payoff path.
    - id: relationship
      label: Checking / savings / direct-deposit relationship
      detail: Deposit products can deepen retention, discounts, and later cross-buy behavior.
    - id: outcome
      label: Payment simplification, repeat use, or attrition
      detail: Success depends on lower interest versus revolving cards and disciplined underwriting.
    edges:
    - from: need
      to: search
      label: creates demand
    - from: search
      to: underwrite
      label: prequalifies
    - from: underwrite
      to: credit
      label: assigns product fit
    - from: credit
      to: relationship
      label: cross-sell or discount path
    - from: credit
      to: outcome
      label: repayment experience
    - from: relationship
      to: outcome
      label: retention / repeat-borrow
