chapter:
  number: 2
  title: Market Analysis
  summary: Upgrade sits in a very large U.S. unsecured consumer-credit pool, but the investable market is narrower than generic fintech TAM narratives imply. The best lens is fair-to-good credit debt consolidation and installment-card substitution, with BNPL and high-yield deposits acting as adjacent acquisition channels rather than additive standalone TAM blocks.
sections:
- id: market-boundary
  title: 'Market boundary: unsecured credit first, deposits second'
  body: 'Upgrade should be analyzed first as an unsecured consumer-credit platform, not as a generic fintech or a full-service neobank. The relevant problem set is the household need to refinance high-cost revolving balances, smooth a large purchase, or convert volatile monthly card payments into a fixed installment schedule. Upgrade''s own product set supports that narrower boundary: it markets personal loans up to $50,000, an installment-style Upgrade Card, rewards checking, and a 3.05% APY savings account. Those deposit products matter because they can acquire rate-sensitive households and support cross-sell, but they do not create a new core lending TAM by themselves. The operative substitutes are still revolving bankcards, other personal loans, checkout BNPL, and in some cases savings drawdown or 0% promotional cards. That framing keeps the chapter anchored on monetizable credit demand instead of inflating the opportunity set by counting all consumer deposits or all fintech activity
    as addressable revenue for Upgrade.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM040
  - CM042
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: tam-sam-som
  title: 'Sizing lenses: very large balance pool, narrower serviceable pocket'
  body: The balance pool is large even before any aggressive TAM storytelling. Equifax reported $1.12 trillion of bankcard balances in January 2026, while the New York Fed reported $1.252 trillion of credit-card balances in Q1 2026; LendingTree put outstanding personal-loan balances at $276 billion in Q4 2025. Together, those figures support a broad unsecured balance opportunity of roughly $1.4 trillion to $1.5 trillion. But SAM and SOM need stricter discipline. Richmond Fed estimated about $70 billion of BNPL transaction value in 2025, yet the average BNPL debt outstanding was only about $3 billion because pay-in-four loans amortize quickly. Likewise, deposits help customer acquisition but are not additive to credit balances. The cleanest lower-bound serviceable market is the existing personal-loan stock, while the debt-consolidation share of that stock is the best evidence-constrained proxy for Upgrade's immediate use case.
  claimRefs:
  - CM005
