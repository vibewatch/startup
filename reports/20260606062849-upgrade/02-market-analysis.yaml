- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Upgrade
  - Diligence ask
  rows:
  - - Card balances remain above $1.1T and revolving credit is still growing faster than nonrevolving
    - Positive
    - Immediate
    - Supports refinance and installment-card demand
    - Track mix of revolving borrowers by score band and utilization
  - - Debt consolidation remains the dominant personal-loan use case
    - Positive
    - Immediate
    - Reinforces Upgrade's strongest product-market fit
    - Request purpose mix and repeat-borrow behavior by channel
  - - Fintech distribution now accounts for half of unsecured personal-loan debt
    - Positive
    - 12 months
    - Confirms digital origination is mainstream rather than niche
    - Request Upgrade CAC, conversion, and funding-cost benchmarks against peers
  - - Savings-rate dispersion keeps deposit-led acquisition relevant
    - Positive
    - Immediate
    - Checking and savings can widen top-of-funnel reach and cross-sell opportunities
    - Request deposit attach rate and incremental loan take-up from account holders
  - - K-shaped credit market concentrates stress in non-prime households
    - Negative
    - Immediate
    - Requires precision underwriting and can narrow the profitable served segment
    - Request score-band loss curves, DTI mix, and early-delinquency trends
  - - APR caps and origination fees make low-end approvals expensive
    - Negative
    - Immediate
    - Weakens borrower economics and can raise scrutiny if positioned as a savings product
    - Request borrower NPS and prepay/charge-off by fee tier
  - - BNPL policy debate remains unsettled around TILA and reporting
    - Negative
    - 12-24 months
    - Installment-style product expansion may face disclosure and reporting changes
    - Obtain legal view on pay-later disclosures, reporting, and partner-bank exposure
  - - Company-specific partner-bank and state constraint data remain private
    - Negative
    - Immediate
    - Caps precision on SOM and legal scalability
    - Request partner-bank agreements, state matrices, and supervisory commentary
  notes: Timing reflects how quickly each force can affect origination mix or economics. Diligence asks focus on evidence needed to turn chapter-level market observations into company-specific underwriteable KPIs.
