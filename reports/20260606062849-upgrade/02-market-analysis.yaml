tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or balances
  - Excluded spend or balances
  - Buyer / payer
  - Relevance to Upgrade
  rows:
  - - Unsecured personal loans
    - Closed-end consumer installment loans used for debt consolidation, major purchases, or cash-flow smoothing
    - Mortgages, auto loans, student loans, secured home-equity products
    - Consumer borrower / consumer payer
    - Core market and clearest serviceable baseline
  - - Installment credit cards / card-linked credit lines
    - General-purpose cards or lines that convert purchases into fixed installment payoffs
    - Transactor card spend paid in full each month
    - Consumer cardholder / consumer payer
    - Core adjacency because Upgrade Card substitutes for revolving balances
  - - Pay-in-four BNPL
    - Short-duration point-of-sale loans repaid in four or fewer payments
    - Longer-term installment plans already captured in personal-loan or card stats
    - Checkout user / checkout user
    - Adjacent demand shaper and substitute at checkout, but not additive to core balance TAM
  - - High-yield savings / digital checking
    - FDIC-insured savings and checking used for acquisition, direct deposit, and relationship expansion
    - Wholesale funding, traditional branch banking TAM, total deposits of the U.S. banking system
    - Depositor / depositor
    - Acquisition and retention adjacency, not a core lending market unit
  - - Status-quo substitutes
    - Revolving credit cards, promotional balance transfers, savings drawdown, and alternative online lenders
    - Non-consumer or secured credit categories
    - Consumer / consumer
    - Defines the incumbent behavior Upgrade must displace
  notes: Categories intentionally overlap in household behavior but are not additive for TAM math; the table separates core monetization surfaces from acquisition adjacencies and status-quo substitutes.
