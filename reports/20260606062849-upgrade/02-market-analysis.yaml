  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: score-band-balance-share
    missingEvidence: A bureau- or lender-level breakout of current revolving balances held by 630-719 borrowers who would likely pass Upgrade underwriting.
    whyItMatters: Without a score-band balance cut, the chapter can only bound SAM using total card balances and cannot isolate the highest-probability refinance pool.
    diligencePath: Request bureau or servicing data that segments outstanding card balances by FICO band, utilization, and recent delinquency status.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-conversion
    missingEvidence: Upgrade product attach, repeat-borrow, and deposit-to-credit conversion rates by cohort.
    whyItMatters: The chapter can show that deposits are an acquisition adjacency, but it cannot quantify how much checking or savings meaningfully lowers CAC or raises lifetime value.
    diligencePath: Request cohort retention and product attach data showing conversion from savings/checking users into personal-loan or Upgrade Card borrowers.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: partner-bank-state-constraints
    missingEvidence: Publicly documentable company-specific partner-bank structure, APR-cap exceptions, and 2026 state or supervisory constraints tied to Upgrade's exact product stack.
    whyItMatters: Sector-wide BNPL and consumer-credit regulation is visible, but company-specific legal constraints can narrow where growth and pricing are actually available.
    diligencePath: Obtain partner-bank agreements, state-by-state licensing matrix, and legal counsel memos describing any product-specific restrictions or supervision findings.
    relatedQuestionRefs:
    - QM028
  - type: conflicting-data
    severity: minor
    topic: minimum-credit-score-disclosure
    missingEvidence: A direct official disclosure of Upgrade's minimum FICO by product and risk tier.
