- id: drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'The demand case for Upgrade is straightforward: card balances remain above $1.1 trillion, revolving credit was still growing faster than nonrevolving in April 2026, and more than half of personal-loan borrowers use those loans to consolidate debt. Fitch also shows that fintech lenders now originate half of unsecured personal-loan debt, so digital distribution is already mainstream. The constraint side is equally important. TransUnion describes a K-shaped credit market in which super-prime households gain strength while non-prime households absorb more affordability stress. Federal Reserve research shows delinquencies have stabilized rather than spiraled, but not because the lower end became safer; stress remains concentrated there. Upgrade''s own reviewed APR and fee range means the product can still be expensive at the low end, which can cap retention, profitability, and fair-lending tolerance if underwriting drifts too far down-market.'
  claimRefs:
  - CM022
  - CM023
  - CM024
  - CM025
