- id: TP003
  title: Funding, distribution, and trust comparison
  columns:
  - Company
  - Balance-sheet / partner model
  - Distribution surface
  - Trust / regulatory cue
  - Implication for Upgrade
  rows:
  - - Upgrade
    - Partner-bank loans, cards, and deposits; external capital facilities
    - Direct-to-consumer app and web flow
    - Fintech brand; bank partners carry deposit insurance and charter functions
    - Great product flexibility, but weaker balance-sheet control
  - - LendingClub
    - Owned bank plus marketplace
    - Digital bank relationship and existing member base
    - FDIC-insured bank framing
    - Closer substitute for debt-consolidation customers who value deposit trust
  - - Upstart
    - Marketplace only; loans made by partner institutions
    - 100+ bank partners and lender-side integrations
    - Regulated-financial-institution lender model
    - Bigger distribution network than Upgrade, but less direct cross-sell surface
  - - SoFi
    - Owned national bank
    - App ecosystem across banking, investing, and borrowing
    - Bank-issued deposit and card products
    - Can use relationship economics to outbid Upgrade for prime users
  - - Affirm
    - Partner-bank money and card products
    - Merchant checkout, app, virtual card, and debit card
    - Not a bank; partner banks hold money accounts
    - Merchant behavior and app habit compete with Flex Pay
  - - Klarna
    - Partner-bank balance account and card
    - Visa acceptance plus app-led shopping and partner deals
    - Deposits held at WebBank, not Klarna
    - Checkout and shopping loop are stronger than Upgrade's disclosed BNPL reach
  - - OneMain / Oportun
    - Balance-sheet consumer lending
    - Branches for OneMain; underserved-credit orientation for both
    - Longstanding lender positioning and rehabilitation messaging
    - These rivals defend the credit-rebuilding lane Upgrade only partially covers
  - - Capital One / Discover
    - Large integrated bank and card platform
    - Mass-market card acceptance, 70,000+ fee-free ATMs, bank products
    - Federal Reserve-approved merger adds Discover Bank
    - Incumbent trust and distribution cap Upgrade's mainstream upside
  - - Synchrony
    - Embedded-finance plus online bank
    - Merchant-finance relationships and deposit marketing
    - FDIC-insured savings products
    - Shows that even card specialists now compete for deposit attention
  notes: This table focuses on structural trust and distribution advantages, not which brand has the flashiest feature list.
