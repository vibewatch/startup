tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding cue
  - Target segment
  - Differentiation
  - Primary limitation versus Upgrade
  rows:
  - - Upgrade
    - Hybrid consumer-credit fintech
    - Private fintech; >$24B credit extended; 2026 facility upsized to $250M
    - Mainstream debt consolidation plus everyday spend management
    - Loans + installment card + checking/savings + Flex Pay
    - No bank charter; partner concentration
  - - LendingClub
    - Digital bank lender
    - Public bank; 5M+ members; bank foundation plus marketplace
    - Prime / near-prime debt consolidators
    - Deposit-funded lending with familiar bank products
    - Less novel card / BNPL posture
  - - Upstart
    - AI lending marketplace
    - 100+ bank partners; 6M+ loans; $57B+ originations since inception
    - Broad prime / near-prime applicants via partner lenders
    - Underwriting and distribution data scale
    - No owned deposits or direct daily-banking loop
  - - SoFi
    - Bank-chartered finance super-app
    - National bank with integrated cards and deposits
    - Affluent mainstream members and refinancers
    - Deposit-led cross-sell and member pricing hooks
    - Less distinctive installment-card format
  - - Affirm
    - BNPL and app-led installment network
    - Public BNPL platform with partner-bank money account and debit card
    - Checkout-centric shoppers and merchants
    - Flexible merchant-linked installment behavior
    - Weaker debt-consolidation fit
  - - Klarna
    - BNPL plus card / balance-account ecosystem
    - Public filer with Visa card, balance account, and membership perks
    - App-centric shoppers and merchants
    - Cashback plus banking-like app loop
    - Less direct personal-loan positioning
  - - Oportun
    - Inclusive personal lender
    - Public lender; Q1 2026 sixth consecutive GAAP profitable quarter
    - Underserved and credit-building borrowers
    - Small-dollar and secured loan access
    - Narrower product breadth
  - - OneMain
    - Branch-heavy non-prime lender
    - Public lender with 1,300+ branches and BrightWay card
    - Non-prime emergency and rebuilding borrowers
    - Physical servicing reach plus rehab card
    - Higher cost and weaker digital elegance
  - - Capital One / Discover
    - Card-and-bank incumbent
    - Large integrated card and deposit footprint after 2025 merger
    - Mass-market card and bank customers
    - Trust, acceptance, rewards budgets, and deposits
    - Less simplified fixed-payment framing
  - - Synchrony
    - Embedded-finance and savings incumbent
    - Retail-finance relationships plus online savings bank
    - Private-label / co-brand shoppers and savers
    - Merchant-finance reach plus deposit yield products
    - No single direct-consumer super-app
  notes: Rows summarize the closest public competitive archetypes and use disclosed scale cues only where retained sources provided them.
