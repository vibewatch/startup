  evidenceGaps:
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized approval-rate and APR distribution data for Upgrade, SoFi, LendingClub, and Upstart by borrower tier.
    whyItMatters: List-rate comparisons overstate how often consumers actually qualify for the headline floor APRs in this chapter.
    diligencePath: Request conversion funnels and funded-loan APR distributions by FICO or internal risk band from management and key peers where available.
    relatedQuestionRefs:
    - QP007
    relatedTableRefs:
    - TP002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-economics
    missingEvidence: Product-level attachment, retention, and CAC payback for Upgrade customers who add cards, checking, savings, or Flex Pay.
    whyItMatters: Upgrade's durability thesis depends on bundle economics, but public materials do not show whether the extra surfaces materially improve retention or margin.
    diligencePath: Ask management for cohort retention, product attachment, and contribution-margin bridges for single-product versus multi-product users.
    relatedQuestionRefs:
    - QP017
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: flex-pay-merchant-scale
    missingEvidence: Current merchant count, GMV, and repeat-use metrics for Flex Pay versus Affirm and Klarna.
    whyItMatters: Without merchant-footprint data it is hard to know whether Upgrade is building a meaningful checkout network or only a targeted add-on product.
    diligencePath: Request active merchant count, GMV mix, largest categories, and repeat usage for Flex Pay, then compare with merchant-network disclosures from BNPL peers.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
  - type: stale
    severity: material
    topic: capitalone-discover-integration
    missingEvidence: Concrete post-merger milestones showing when Capital One will unify Discover card, deposit, and network advantages into one proposition.
    whyItMatters: Competitive pressure from incumbents will matter more if the merged company rapidly cross-sells and rationalizes rewards, acceptance, and deposit distribution.
    diligencePath: Monitor quarterly integration disclosures, card portfolio migration timelines, and product-change notices for Discover and Capital One customers.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
