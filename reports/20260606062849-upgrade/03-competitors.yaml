- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Implication
  rows:
  - - Integrated fixed-payment bundle
    - Bank-chartered peers copy the surface with cheaper funding
    - High
    - LendingClub and SoFi pair loans with owned deposits while Upgrade relies on partners
    - Upgrade needs superior UX and cross-sell to offset weaker funding control
  - - Partner-bank speed
    - Concentration on Cross River and bank partners
    - High
    - Cross River spans origination, cards, deposits, and the 2026 facility expansion
    - Operational leverage and dependency rise together
  - - Installment-card differentiation
    - Checkout networks own more daily spend intent
    - High
    - Affirm and Klarna center their products on merchant or app-led purchase behavior
    - Upgrade can win on clarity but still lose on habit and distribution
  - - Full-stack breadth
    - Incumbents outspend on rewards, trust, and acceptance
    - High
    - Capital One / Discover and Synchrony already combine cards with deposits and broad reach
    - Mainstream users may default to incumbents unless Upgrade is clearly cheaper or simpler
  - - Digital convenience
    - OneMain and Oportun defend the rehabilitation lane
    - Medium
    - OneMain branches and BrightWay milestones plus Oportun secured access are hard to replicate digitally
    - Upgrade may underserve borrowers who need coaching or physical reassurance
  - - BNPL adjacency
    - Regulatory drift alters economics or disclosures
    - Medium
    - CFPB withdrew the 2024 interpretive rule and regulators still treat BNPL as an evolving area
    - Compliance costs and product terms can change faster than the bundle story
  - - Cross-sell thesis
    - Public evidence does not show actual attachment or retention lift
    - Medium
    - Bundle economics remain private even though the product set is broad
    - This keeps the moat thesis partly unproven
  - - Middle-market positioning
    - Upgrade gets squeezed from both sides
    - High
    - Lower APR floors exist elsewhere and incumbents or checkout networks own stronger trust or reach
    - The company must prove that its bundle changes unit economics, not just messaging
  notes: Severity reflects competitive importance to Upgrade specifically, not the absolute quality of the rival product in isolation.
