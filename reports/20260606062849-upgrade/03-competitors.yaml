- id: TP002
  title: Pricing / packaging comparison
  columns:
  - Company
  - Core consumer credit offer
  - Published terms
  - Linked account / rewards hook
  - Takeaway
  rows:
  - - Upgrade
    - Personal loan + installment-style card + Flex Pay
    - 'Loans: 7.74%-35.99% APR, 1.85%-9.99% fee, 24-84 months'
    - Checking can earn up to 2% cash back; savings up to 3.05% APY; card has no annual fee
    - Broad bundle, but not the lowest posted floor APR
  - - LendingClub
    - Personal loans plus banking
    - 'Loans: 5.96%-35.99% APR, 0%-8% fee, 24-84 months'
    - Checking, savings, and CDs inside bank relationship
    - Cheaper published floor than Upgrade
  - - Upstart
    - Marketplace personal loans
    - 'Loans: 6.2%-35.99% APR, 3-5 years, no prepayment fee'
    - No deposit hook disclosed on loan page
    - Pricing and approval speed compete directly with Upgrade loans
  - - SoFi
    - Bank personal loans
    - Dynamic pricing with autopay and member / deposit discounts; same-day funding for most approved borrowers
    - Direct deposit, SoFi Plus, and qualifying deposits affect pricing
    - Prime borrowers may see better economics when already inside SoFi
  - - Affirm
    - Pay in 4 and installment plans plus debit card
    - 0%-36% APR depending on merchant and purchase amount
    - Money account plus debit-card loop
    - Strong checkout flexibility, weak debt-consolidation positioning
  - - Klarna
    - Visa card and pay-later plans
    - Pricing varies by plan; card tied to cashback and balance-account APY
    - Card comes with bank account / balance account and membership perks
    - Shopping loop is stronger than loan-consolidation value prop
  - - Oportun
    - Unsecured and secured personal loans
    - $300-$10,000 unsecured; $2,525-$18,500 secured with lower APR than title loans
    - Credit-building framing rather than deposit bundle
    - Geared to underserved smaller-balance use cases
  - - OneMain
    - Personal loans plus BrightWay card
    - 'Loans: 11.99%-35.99% APR; card rewards on-time behavior with APR or limit improvements'
    - BrightWay links repayment progress to better terms
    - Non-prime retention tool, but costlier than banked peers
  - - Capital One / Discover / Synchrony
    - Cards and bank accounts
    - Product-specific pricing varies across cards and savings products in retained sources
    - Rewards, ATM access, deposits, and brand trust
    - Incumbents compete more on reach and trust than on one simplified price sheet
  notes: Where retained public pages did not surface one normalized APR table, the row states the disclosed hook rather than guessing a headline rate.
