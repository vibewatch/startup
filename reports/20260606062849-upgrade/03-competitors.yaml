- id: bank-chartered-peers
  title: Bank-chartered full-stack peers
  body: LendingClub and SoFi are the closest full-stack substitutes because both pair personal lending with owned deposit franchises. LendingClub explicitly describes a resilient bank foundation combined with a capital-light marketplace, while its consumer site bundles loans with checking, savings, and CDs. SoFi comes from a different starting point—a broader financial super-app with banking, borrowing, and investing—but it also uses deposits and membership behavior to influence loan economics through autopay and direct-deposit discounts. Relative to those peers, Upgrade looks product-complete but funding-light. It can imitate the user-facing bundle, especially for debt consolidation and everyday cash management, yet it still relies on partner banks and external capital facilities for the underlying charter and balance-sheet functions. That matters in competitive terms because a banked rival can choose to underprice on funding or use deposit economics to subsidize acquisition longer than
    Upgrade plausibly can.
  claimRefs:
  - CP012
  - CP013
  - CP014
  - CP019
