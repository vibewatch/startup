company:
  name: Upgrade
chapter:
  number: 3
  title: Competitors
  summary: 'Upgrade competes across three stronger archetypes than a normal online lender faces: bank-chartered digital lenders, checkout-first installment networks, and incumbent card-and-deposit franchises. The evidence shows Upgrade''s edge is product integration across loans, installment card, deposits, and BNPL, while its weakness is lack of owned charter, network, and balance-sheet control.'
sections:
- id: landscape-frame
  title: Landscape framing
  body: 'Upgrade is no longer competing only with online personal-loan originators. The public product set now spans debt-consolidation loans, the installment-style Upgrade Card, Rewards Checking Preferred, Premier Savings, and Flex Pay at checkout. That makes the relevant landscape four-sided: deposit-funded digital banks like LendingClub and SoFi; marketplace and underwriting specialists like Upstart; checkout and wallet-centric installment networks like Affirm and Klarna; and large incumbent card-and-deposit franchises such as Capital One/Discover and Synchrony. The strategic attraction is obvious: Upgrade can pitch a simpler, fixed-payment consumer-credit bundle than a revolving card issuer without forcing users into a mono-line loan product. The strategic risk is equally obvious: every flank has a stronger native asset than Upgrade does, whether that is a bank charter, a merchant network, a proprietary data flywheel, or mass-market trust and acceptance.'
  claimRefs:
  - CP005
  - CP006
  - CP010
  - CP011
  - CP039
  - CP040
  - CP041
  - CP043
  - CP044
  - CP045
