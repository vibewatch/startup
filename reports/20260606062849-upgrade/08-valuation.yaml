  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - TRACK
    - Business quality is credible, but public valuation support is incomplete at the current mark
    - Stay engaged but do not underwrite the Series G headline as clearly cheap
  - - Confidence
    - Medium
    - Key metrics are management-reported and unaudited in retained public evidence
    - Treat the view as price-sensitive and diligence-sensitive
  - - Risk rating
    - High
    - Credit-cycle bifurcation, partner dependence, regulation, and disclosure gaps all remain material
    - Require a tighter margin of safety than a clean SaaS-style growth story
  - - Valuation stance
    - Stretched to fair
    - Implied >7x revenue sits above disclosed public comp band of roughly 1.9x-5.4x
    - Only pay near the mark if diligence proves bull-case economics
  - - Decision implication
    - Research and track, not buy now
    - The mark overlaps only the top end of the public bull case
    - Advance only after audited numbers and terms close the main gaps
  notes: This table translates the evidence into an IC posture rather than a generic quality score. The valuation stance is tied to the retained public revenue anchor and the disclosed comp set.
