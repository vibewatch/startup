  figureRefs: []
- id: comparable-screen
  title: Public and transaction comparable screen
  body: 'The cleanest way to pressure-test the Series G mark is to ask how much the public market is paying for similar consumer-fintech revenue today. On retained June 2026 data, Affirm and SoFi both trade around five times trailing revenue, while LendingClub and Upstart screen much lower. Even if Upgrade merits a premium for its multi-product architecture and cross-sell motion, the reported Series G price still screens above the disclosed public comp band. Transaction comps do not fully rescue the mark. Chime''s reopened IPO is constructive for late-stage fintech appetite, but it also demonstrates how sharply late private marks can reset before public pricing. Klarna''s 2026 reporting cadence helps on disclosure, yet the retained public record is still less definitive on valuation than on operating visibility. Net result: public and transaction evidence supports a fair-to-stretched reading of $7.3 billion, not an obviously cheap entry point.'
  claimRefs:
