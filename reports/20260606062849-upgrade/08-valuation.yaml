company:
  name: Upgrade
chapter:
  number: 8
  title: Valuation
  summary: Upgrade's reported $7.3 billion Series G mark prices in much of the bull case already. Public evidence supports profitable, multi-product growth and potentially better acquisition efficiency than simpler lenders, but the implied >7x revenue screen still sits above disclosed public comps and the round lacks the audited financials and term-stack detail needed for a buy call.
sections:
- id: price-context
  title: Price context and recommendation
  body: 'Upgrade''s reported $7.3 billion Series G mark deserves to be underwritten as a price, not as a generic quality badge. The supportive evidence is real. Official and syndicated coverage confirm a $165 million round, more than $42 billion of delivered credit, over 7.5 million customers, six products, $750 million of lifetime equity, and management-reported annualized revenue above $1 billion with cash-flow positivity. Those facts separate Upgrade from a typical subscale online lender. But valuation discipline still matters. At more than 7x the only public revenue anchor, the round already prices in continued cross-sell efficiency, benign funding access, and an orderly late-stage exit market. Public comps with disclosed financials do not clear that same bar today. The most defensible IC stance is therefore TRACK with medium confidence and high risk: the business quality looks credible, but the price still leans on diligence assumptions that are not yet public.'
  claimRefs:
  - CV001
  - CV002
  - CV004
  - CV005
  - CV006
  - CV008
  - CV009
  - CV040
  - CV049
  - CV050
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-vs-antithesis
  title: Investment thesis versus anti-thesis
  body: 'The bull thesis starts with a more interesting platform than the public comp labels suggest. Upgrade is not only a personal-loan originator. Public sources show a six-product stack, meaningful scale, and partner-bank infrastructure that can support cards, deposits, and installment lending together. Management-reported signals are directionally strong: the company says it has served millions of customers, annualized revenue passed $1 billion in 2025, the business had been cash-flow positive for three years, and Flex Pay or BNPL appears to be a powerful customer-acquisition engine. The anti-thesis is just as clear. The current mark already embeds much of that upside, while core underwriting facts remain private: audited consolidated financials, the preference stack, channel-level CAC and LTV, and product-level credit losses. Add founder-governance baggage and a tightening credit-policy backdrop, and the result is not a broken thesis but a price that requires more proof than the public
    record currently supplies.'
  claimRefs:
  - CV009
  - CV017
  - CV018
  - CV019
  - CV020
  - CV041
  - CV042
  - CV046
  - CV047
  - CV048
