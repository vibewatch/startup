- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited revenue bridge disappoints
    - 2025 or 2026 revenue lands materially below the >$1B annualized public anchor
    - The current mark stops screening as a premium growth business and becomes clearly stretched
    - Reset entry price toward bear-case levels
  - - BNPL-to-core conversion weakens
    - Flex Pay or BNPL adds users without showing profitable cross-sell into cards or loans
    - Marketing-efficiency thesis and premium multiple both break
    - Require proof of channel economics before re-engaging
  - - Funding terms tighten
    - Warehouse or forward-flow covenants, advance rates, or concentration limits look materially restrictive
    - Partner-bank and liquidity dependence becomes an equity-value cap
    - Discount valuation and increase risk rating
  - - Policy burden rises
    - BNPL or partner-bank regulation materially increases underwriting, reporting, or licensing cost
    - Margin durability and growth speed both fall
    - Shift base case closer to lender-like multiples
  - - Round terms are protective
    - Cap table reveals strong preferences or participation rights for the new preferred
    - Headline post-money overstates common-equity value
    - Re-cut the deal from common-equity economics only
  - - Credit-cycle deterioration resumes
    - Non-prime stress and revolving-balance pressure worsen beyond current 2026 readings
    - Loss expectations and acquisition quality both deteriorate
    - Reduce confidence and revisit bear-case assumptions
  notes: Triggers combine public monitoring items with private-diligence gating items because the current recommendation is blocked more by valuation and disclosure than by lack of demand evidence.
  claimRefs:
  - CV024
  - CV025
  - CV027
  - CV028
  - CV029
  - CV051
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current financials
    - Audited 2025 and latest 2026 consolidated financial statements
    - The price cannot be underwritten responsibly without a current audited denominator
    - Finance team and board materials
  - - Series G terms
    - Cap table, share classes, preferences, side letters, and secondary-sale mechanics
    - Common-equity value may differ materially from the headline post-money
    - Legal counsel plus finance ops
  - - Channel economics
    - CAC, LTV, payback, and BNPL-to-core-product conversion by acquisition channel
    - The premium case depends on structurally better acquisition economics
    - Growth analytics and FP&A
  - - Credit performance
    - Product-level vintages, delinquencies, charge-offs, fraud, and servicing cost curves
    - A consumer lender should not be valued on growth alone if losses are under-disclosed
    - Credit, risk, and servicing teams
  - - Funding resilience
    - Warehouse and forward-flow covenants, buyer concentration, and renewal exposure
    - Funding friction can compress both volume and valuation quickly
    - Treasury and capital-markets teams
  - - Exit readiness
    - Banker feedback, IPO preparedness, and strategic or sponsor buyer map
    - The current valuation needs a plausible exit path, not just a future round narrative
    - CEO, CFO, and advisers
  notes: Every diligence ask maps directly to a variable that can move the recommendation, the acceptable entry price, or both.
  claimRefs:
  - CV046
  - CV047
  - CV048
  - CV052
