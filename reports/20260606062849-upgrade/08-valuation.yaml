  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited or board-approved 2025 and 2026 consolidated revenue, EBITDA, operating cash flow, and segment bridge.
    whyItMatters: Without a current audited denominator, the investment committee cannot know whether the $7.3 billion mark is underwriting a 6x business or a materially richer multiple.
    diligencePath: Request the latest audited financial statements, board package, and monthly KPI bridge from finance leadership.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: series-g-cap-table
    missingEvidence: Series G term sheet, cap table, liquidation preferences, participation rights, side letters, and any structured secondary mechanics.
    whyItMatters: Headline post-money valuation can materially overstate common-equity value if the preferred stack is protective or if liquidity was priced through special rights.
    diligencePath: Obtain the cap table from legal and finance and re-cut valuation from common-equity economics, not the press headline.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-losses
    missingEvidence: Channel-level CAC and LTV, BNPL-to-core-product conversion, and product-level delinquency, charge-off, and servicing-cost curves.
    whyItMatters: The current bull case depends on cross-sell and better acquisition efficiency; if those metrics are weaker than management implies, the premium multiple collapses quickly.
    diligencePath: Request cohort decks, static-pool loss tables, marketing-payback by channel, and BNPL conversion analysis.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: material
    topic: funding-covenants
    missingEvidence: Warehouse and forward-flow covenants, advance rates, renewal triggers, and buyer concentration data for major facilities.
    whyItMatters: Valuation support assumes Upgrade can keep scaling without a funding shock; hidden covenants or concentration limits could cut volume and compress equity value.
    diligencePath: Collect credit agreements, covenant packages, and counterparty concentration reports from treasury or capital-markets leadership.
    relatedQuestionRefs:
    - QV023
    - QV024
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: private-comp-set
    missingEvidence: Direct late-stage private consumer-fintech transaction comps with disclosed revenue and term sheets that match Upgrade's mix of lending, card, deposits, and travel BNPL.
    whyItMatters: The comparable table necessarily leans on public comps and one major IPO reset because close private analogs still disclose too little to price cleanly.
    diligencePath: Use banker market soundings and recent private-placement materials to supplement the public comp set before final pricing.
    relatedQuestionRefs:
    - QV014
    relatedTableRefs:
    - TV004
