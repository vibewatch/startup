- id: diligence-and-exit
  title: Exit readiness and final diligence asks
  body: 'Exit optionality exists, but it is not ready to do the valuation work alone. CNBC indicates management is thinking about an IPO window and employee liquidity, and Chime''s 2025 listing shows that the market will finance scaled consumer-fintech stories again. That is helpful, but not enough. The same public evidence says late-stage fintech pricing is still selective, and Upgrade has not published the audited financial bridge or terms detail that would let an outside investor know whether the preferred-round headline maps cleanly to common-equity value. The right final ask set is therefore unambiguous: audited consolidated financials, the full Series G preference stack, channel-level CAC and LTV, product-level loss curves, and the covenant or concentration architecture behind key funding lines. If those materials confirm that Upgrade really earns a higher-quality multiple than public peers, re-engagement makes sense. Until then, the name belongs on a disciplined track list rather
    than in approval mode.'
