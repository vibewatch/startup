- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Why it matters
  - What would change the view
  rows:
  - - Multi-product scale is real
    - More than $42B delivered credit, 7.5M+ customers, and six products support relevance beyond a mono-line lender
    - Downgrade if audited numbers show weak monetization per customer or heavy subsidy
  - - BNPL may be an efficient funnel
    - BNPL reportedly drives about 75% of new users and has doubled annual revenue since Uplift integration
    - Downgrade if cohort conversion into higher-value products is poor
  - - Management-reported profitability is constructive
    - Cash-flow positivity and profitable growth can justify paying more than for distressed lenders
    - Downgrade if audited 2025 or 2026 results materially lag the narrative
  - - Public comps still screen cheaper
    - Affirm and SoFi trade near 5x revenue while LendingClub and Upstart screen materially lower
    - Upgrade only deserves a premium if growth, margins, and loss performance are cleaner than peers
  - - Governance and regulation add friction
    - Founder history and BNPL or partner-bank scrutiny raise diligence burden
    - Upgrade the view only if governance, exams, and compliance architecture are demonstrably robust
  - - Round terms may be more important than headline valuation
    - Preferred protections can shift common-equity value materially
    - Upgrade the view only after the cap table and preference stack are fully reviewed
  notes: The table pairs the bull thesis with the exact evidence that could invalidate it. The goal is to keep valuation discipline tied to facts that can still move in diligence.
