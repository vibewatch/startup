companyProfile:
  summary: |
    Upgrade is a San Francisco-based consumer-finance company built by LendingClub alumni to offer a
    digital alternative to legacy unsecured lending and revolving-credit products. Its current public
    footprint spans personal loans, the installment-oriented Upgrade Card family, OneCard debit/credit
    hybrids, savings and checking products, Flex Pay BNPL, and selected auto and home-improvement
    financing programs. The company operates nationwide online through partner-bank infrastructure
    rather than a branch network and positions itself around mainstream consumers who want simpler,
    fixed-payment credit tools.
  foundedDate: '2017-01-01'
  founders:
    - name: Renaud Laplanche
      role: Co-founder and CEO
      background: Founder and former CEO of LendingClub; leads Upgrade's strategy, fundraising, and public positioning.
      claimRefs: [CO004, CO006]
    - name: Soul Htite
      role: Co-founder
      background: Reuters identified Soul Htite as a co-founder, though current official leadership pages reviewed in this run do not visibly feature him.
      claimRefs: [CO004, CO009]
  foundingLocation: San Francisco, CA
  headquarters: San Francisco, CA
  productSummary: |
    Upgrade sells unsecured personal loans, closed-end installment-style card products, OneCard debit/
    credit hybrids, checking and savings accounts, Flex Pay BNPL, and adjacent auto and home-improvement
    financing. The product design emphasizes fixed payments, digitally managed accounts, and cross-sell
    between lending, card, and deposit surfaces.
  customerFocus: |
    Mainstream US consumers, especially fair-credit and near-prime households using credit for debt
    consolidation, major purchases, emergencies, travel, home improvement, or automotive needs. Public
    evidence suggests broad consumer reach with underwriting that is more inclusive than prime-only bank
    cards but cleaner partner-sale pools than deep subprime lenders.
  businessModel: |
    Upgrade monetizes a mix of origination fees, servicing income, interchange, deposit-related fees,
    and gains or premiums on asset sales routed through partner banks and capital-markets funding.
    BNPL and card products appear to act as lower-friction acquisition surfaces that can feed other
    lending and deposit products over time.
  stage: Series G
  fundingStatus: $750M lifetime equity raised; $165M Series G announced in October 2025 at a reported $7.3B valuation.
  disclosureProfile: private-disclosed
  claimRefs: [CO002, CO003, CO004, CO005, CO010, CO012, CO013, CO014, CO015, CO032, CO035, CI040]

