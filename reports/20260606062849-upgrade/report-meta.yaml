coverageNotes: |
  This report was produced on 2026-06-06 using publicly available sources only. Upgrade is a
  private company, so audited 2025-2026 financial statements, full cap-table terms, product-level
  credit losses, and warehouse covenant detail are not publicly disclosed in the retained evidence.
  Current official materials use 2017 as the company's inception marker, while Reuters reported an
  August 2016 founding chronology; this report uses 2017 for current-profile consistency while
  noting the discrepancy. The $7.3B valuation, $165M Series G raise, $750M lifetime equity raised,
  and $1B+ annualized revenue reference points come from 2025 company statements and independent
  coverage rather than audited filings. Public evidence supports fair-credit and near-prime
  positioning, but does not prove a single official company-wide 580-700 underwriting band.

