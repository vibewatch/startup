    title: Multi-product distribution is the core strategic asset
    body: >-
      The strongest public signal is not any single product SKU; it is the way Upgrade combines bank-partner
      origination, multiple consumer-credit products, and nontraditional acquisition channels to cross-sell at
      lower apparent acquisition cost.
    claimRefs:
      - CO002
      - CO016
      - CO039
      - CO042
  - calloutType: risk
    title: Key public facts still need reconciliation before a clean underwrite
    body: >-
      The reviewed record still leaves meaningful ambiguity around the founding chronology, Soul Htite's
      current role, exact borrower segmentation, and the difference between cash-flow positivity and a fully
      evidenced since-2020 profitability history.
