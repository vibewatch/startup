company:
  name: Upgrade
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Upgrade is a late-stage U.S. consumer-fintech platform with verified breadth across personal loans,
    installment-style cards, checking and savings products, and BNPL. The reviewed public record strongly
    supports the 2025 Series G raise, current scale claims above 7.5 million customers and $42 billion of
    credit delivered, and a multi-channel distribution model, but it does not fully reconcile the
    2016-versus-2017 founding chronology, the exact borrower credit band, or the current role of co-founder
    Soul Htite.
sections:
  - id: identity-product-model
    title: Identity, inception signal, and product architecture
    body: >-
      Upgrade’s own current pages consistently present the business as a financial technology company rather
      than a bank, and they show a platform that now spans personal loans, installment-style credit cards,
      checking, savings, and buy now, pay later. The company’s 2025 financing release and current homepage
      both frame the operating thesis the same way: give mainstream consumers cheaper, more predictable
      alternatives to revolving-card debt while cross-selling adjacent products through one app and partner
      channels. The chronology is less clean than the current brand story implies. Official materials use
      2017 as the inception marker, but Reuters said Laplanche co-founded Upgrade with Soul Htite in August
      2016 before the public 2017 launch period. Product breadth is better supported than exact borrower
      targeting: reviewed sources support a fair-credit and near-prime orientation, especially around cards
      and personal loans, but they do not prove a single official 580-700 company-wide underwriting band.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO019
      - CO020
      - CO021
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
      - CO032
    figureRefs:
      - FO002
  - id: founders-governance-and-key-persons
    title: Founders, leadership, governance, and key-person dependence
    body: >-
      The strongest current leadership evidence centers on Renaud Laplanche and Matt Wierman. Laplanche’s
      biography and his own website tie him directly to the consumer-lending model he previously built at
      LendingClub, while Wierman’s page shows a co-founder still running cards and loans, the product areas
      most central to Upgrade’s identity. The latest financing also created a clear governance update:
      Neuberger’s Peter Sterling joined the board in connection with the Series G round. That gives the
      2025 lead investor direct governance influence on top of economic exposure. Soul Htite is the main
      unresolved founder variable. Reuters explicitly named him as a co-founder in 2016, but the current
      public biographies reviewed in this run do not surface him, so his present governance or operating
      role remains unclear. Tom Botts appears publicly as the Flex Pay president, which adds visible
      executive depth around BNPL, but key-person dependence still appears highest around Laplanche and the
      long-standing card-and-loan leadership bench.
    claimRefs:
      - CO004
      - CO006
      - CO007
      - CO008
      - CO009
      - CO046
    tableRefs:
      - TO002
  - id: capital-base-scale-and-distribution
    title: Capital base, scale signals, and distribution model
    body: >-
      Upgrade’s latest funding round is well supported in the public record even though the valuation point
      is third-party rather than official. Company materials, PRNewswire syndication, CNBC, and FinTech
      Futures all align on the $165 million raise and the investor set, and CNBC supplies the $7.3 billion
      valuation marker. The same October 2025 wave of sources supports $750 million of lifetime equity
      raised, more than 7.5 million customers served, and more than $42 billion of credit delivered, while
      the current about page moves the credit figure above $47 billion. Distribution is part of the scale
      story, not just a footnote. Official materials emphasize hundreds of airlines and cruise lines,
      thousands of contractors and car dealers, and bank-partner relationships that let Upgrade originate or
      issue products without becoming a chartered bank itself. Profitability evidence is directionally strong
      but not audit-grade: CNBC quotes Laplanche saying Upgrade was cash-flow positive for the prior three
      years, and The Financial Brand separately reported the company was profitable, yet no reviewed public
      source provided a full year-by-year profitability bridge back to 2020.
    claimRefs:
      - CO005
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO033
      - CO034
      - CO039
      - CO040
      - CO041
      - CO042
      - CO043
    tableRefs:
      - TO001
      - TO003
    figureRefs:
      - FO003
  - id: milestones-adverse-signals-and-open-gaps
    title: Milestones, adverse signals, and open diligence gaps
    body: >-
      The reviewed chronology is strong enough to anchor the rest of the report. It starts with the
      2016-versus-2017 founding dispute, moves through the 2022 OneCard launch and the 2023 Secured OneCard
      rollout, then shows BNPL integration and rebranding in 2024 before culminating in the 2025 Series G.
      Public downside signals are also material enough to record in chapter 1. A CFPB-based complaint
      profile shows a nationwide complaint footprint concentrated in credit reporting and servicing issues,
      and U.S. News separately cites 186 Upgrade personal-loan complaints during 2025. UniCourt also shows
      a 2024 New Mexico consumer-credit case that reached a notice of settlement as to Upgrade in January
      2025. None of these items alone disproves the growth narrative, but together they argue against a
      purely celebratory overview chapter. The largest remaining diligence gaps are governance and borrower
      segmentation: public sources do not provide a fully reconciled cap table, a complete current founder
      roster, or product-level FICO distributions that would settle the exact 580-700 targeting claim.
    claimRefs:
      - CO015
      - CO026
      - CO036
      - CO037
      - CO038
      - CO044
      - CO045
    tableRefs:
      - TO004
    figureRefs:
      - FO001
