  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: profitability-history
      missingEvidence: Audited or management-certified year-by-year profitability and cash-flow data back to 2020.
      whyItMatters: Public sources show cash-flow positivity and profitability commentary, but not enough to prove the stronger since-2020 profitability claim without caveat.
      diligencePath: Request annual management accounts, lender deck excerpts, or securitization materials that reconcile net income and operating cash flow by year.
      relatedQuestionRefs:
        - QO013
    - type: missing-source
      severity: material
      topic: leadership-public-disclosure
      missingEvidence: A current public or company-supplied statement clarifying Soul Htite's present role, if any, at Upgrade.
      whyItMatters: Founder attribution is central to chapter 1 and the current public record does not resolve whether Htite remains operationally or governantly relevant.
      diligencePath: Request a current founder and board roster, review archived team pages, and check corporate filings or direct company commentary on Htite's status.
      relatedQuestionRefs:
        - QO027
      relatedTableRefs:
        - TO002
    - type: private-evidence-only
      severity: material
      topic: stakeholder-map
      missingEvidence: Current cap table, ownership percentages, board committee assignments, and any investor governance rights tied to Series G.
      whyItMatters: Chapter 1 can identify named investors and a new board seat, but it cannot underwrite control, dilution, or liquidation dynamics from public sources alone.
      diligencePath: Request the cap table, preferred-stock term summary, board observer schedule, and any side-letter summary from the company or lead investors.
      relatedQuestionRefs:
        - QO026
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: minor
      topic: borrower-fico-distribution
      missingEvidence: Product-level borrower FICO distributions or underwriting cohort summaries across loans, cards, and BNPL.
      whyItMatters: Public reviews support fair-credit and near-prime positioning, but they do not conclusively validate the exact claimed 580-700 focus across the full platform.
      diligencePath: Request underwriting summaries, securitization presales, or internal borrower-mix data by product and vintage.
      relatedQuestionRefs:
        - QO021
