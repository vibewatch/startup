chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Upgrade’s product stack is now a unified, partner-bank-dependent consumer-finance platform spanning personal loans, installment-style cards, OneCard variants, checking, savings, BNPL, and a single mobile app. Public evidence supports real reuse across these surfaces, but also shows lingering diligence gaps around assurance artifacts, current BNPL partner visibility, and servicing-quality consistency.
sections:
- id: product-surface
  title: Product surface and user jobs
  body: >-
    Upgrade’s current product surface looks more like a consumer-finance operating layer than a single lending SKU. The public site still opens with personal loans, but the same navigation and homepage now expose installment-style card products, OneCard variants, rewards checking, high-yield savings, Flex Pay BNPL, and a unified mobile app. That breadth matters because the customer jobs are related: refinance expensive revolving debt, use a predictable-installment card for everyday spend, route paycheck and cash-flow activity through rewards checking, park liquidity in a high-yield savings account, and manage all of it from the same mobile surface. The card family is also segmented instead of monolithic. Cash Rewards emphasizes simple 1.5% cash back, Life Rewards emphasizes higher category rewards, and OneCard overlays debit-like “Pay Now” behavior on the same installment-credit concept. The result is a product map optimized for mainstream household budgeting rather than for pure balance-sheet
    lending volume.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE008
