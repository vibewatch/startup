- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Underwriting and pricing analytics
    - Use richer bureau data and ratios to approve or decline applicants and set pricing
    - Upgrade models plus originating-bank oversight
    - Public evidence describes inputs, not realized approval-lift or loss performance
  - - Bank origination and account layer
    - Provide loans, personal credit lines, checking, savings, and legal account structure
    - Cross River and other bank-partner arrangements
    - Partner changes or bank-policy shifts can disrupt launches and disclosures
  - - Card network and wallet layer
    - Enable card acceptance and digital-wallet usage
    - Visa acceptance, Apple Pay, Google Wallet
    - Network or wallet-policy changes can alter economics or user experience
  - - Deposit custody and participating institutions
    - Sweep balances, increase insurance coverage, and collateralize secured card funds
    - Cross River custodial program plus participating institutions
    - Customers must track where deposits sit to understand insurance coverage
  - - Servicing and payment operations
    - Collect payments, manage autopay, accept checks, and support users
    - Upgrade app, servicing teams, mailing operations, and partner-bank rails
    - Manual exceptions remain slow and customer complaints center on payment handling
  - - Distribution and support surface
    - Deliver the product through mobile and web entry points
    - Apple App Store, Google Play, Allpoint locator, help center, security page
    - Storefront approval, review quality, and channel outages influence customer access
  notes: >-
    Architecture is synthesized from Upgrade and Cross River disclosures rather than from a formal systems diagram. The table captures the minimum public stack needed to explain how products are delivered and where control sits.
