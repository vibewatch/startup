- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Upgrade solution
  - Public benefit
  - Limitation
  rows:
  - - Debt consolidation
    - Shop for an installment loan and compare monthly payment options
    - Soft-check prequalification into fixed-rate personal loan
    - Fast online application and fixed-term repayment
    - Verification and servicing metrics are not public
  - - Everyday card spend
    - Swipe a rewards card but avoid long revolver debt
    - Upgrade Card converts purchases into fixed-rate installment balances
    - More predictable payoff path than minimum-payment revolving cards
    - No retained public evidence of a grace-period-style transactor workflow
  - - Budgeted discretionary spend
    - Decide purchase by purchase whether to pay immediately or over time
    - OneCard Pay Now / Pay Later split inside one Visa card
    - One plastic and app flow handle debit-like and credit-like behavior
    - Current adoption and issuer detail are not public
  - - Spend-plus-save banking
    - Receive paycheck, pay bills, move money, and earn some rewards
    - Rewards Checking plus Premier Savings with smart transfer tools
    - 2% debit rewards, direct-deposit perks, and app-based automation
    - APY and insurance depend on active-account and partner-bank rules
  - - Checkout financing
    - Finance a travel or retail purchase over time
    - Flex Pay application at partner checkout
    - Quick decision with no late or prepayment fees
    - Public North American merchant coverage is thin
  - - Exception handling
    - Resolve payment issues, autopay conflicts, or off-app repayment
    - Upgrade servicing plus manual-check fallback
    - Multiple repayment paths exist if app or bank-link flow breaks
    - Manual checks can take 2-3 weeks and recent reviews flag confusion
  notes: >-
    This table blends loan, card, deposit, BNPL, and servicing workflows. Benefits are limited to what retained public sources explicitly describe; private conversion or retention data remains undisclosed.
