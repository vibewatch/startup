  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: Public SOC 2, PCI, penetration-test summary, or customer-facing uptime/SLA documentation for current Upgrade products.
    whyItMatters: Security process pages exist, but institutional diligence still needs assurance artifacts or an uptime history before treating operational resilience as fully underwritten.
    diligencePath: Request the latest SOC 2 report, PCI attestation, incident-history summary, and any status-page or SLA documents from security or enterprise diligence channels.
    relatedQuestionRefs:
    - QE020
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: flex-pay-coverage
    missingEvidence: Current US Flex Pay merchant roster, lender/issuer map, repayment-servicing workflow, and segment-level origination volumes.
    whyItMatters: The retained BNPL evidence proves a live surface and partner categories, but not enough detail to size revenue concentration or operational exposure by merchant or funding partner.
    diligencePath: Ask management for a current Flex Pay partner list, top merchants by volume, lender map, servicing KPIs, and any US vs Canada product differences.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: underwriting-performance
    missingEvidence: Current approval-rate, pricing-lift, override, delinquency, and servicing-remediation metrics for the underwriting model across cards and loans.
    whyItMatters: The public record describes richer data usage and compliance support, but does not reveal whether the model’s extra complexity improves unit economics or reduces complaints in production.
    diligencePath: Request internal underwriting scorecards, approval funnels, delinquency by score band, complaint-resolution SLAs, and loss curves by major product.
    relatedQuestionRefs:
    - QE012
    - QE023
    relatedTableRefs:
    - TE003
    - TE004
  - type: conflicting-data
    severity: minor
    topic: issuer-evolution
    missingEvidence: A current product-by-product issuer history showing where older OneCard disclosures differ from current Cross River-centric bank-partner pages.
    whyItMatters: Public materials suggest partner-bank evolution over time, which matters for legal docs, servicing flows, and change-management risk even if the customer UX stays stable.
    diligencePath: Request a dated issuer and bank-partner timeline by product, including when card, deposit, or lending programs moved between partner banks.
    relatedQuestionRefs:
    - QE021
    - QE024
    relatedTableRefs:
    - TE003
    - TE005
