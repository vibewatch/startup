- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / metric
  - Status
  - Scope
  - Gap
  rows:
  - - Coordinated vulnerability disclosure
    - Public program page live
    - Security researchers can report issues under defined rules
    - No public bug bounty and no downloadable assurance package
  - - Privacy and ACH safety help content
    - Public help-center overview live
    - Scam avoidance, online application safety, ACH linking, privacy topics
    - Education exists, but it is not a substitute for audit evidence
  - - Custodial deposit disclosures
    - Detailed help articles live
    - Explains sweep mechanics, participating institutions, and insurance aggregation
    - Customers still need to monitor institution-by-institution exposure themselves
  - - App privacy / data safety labels
    - Apple and Google disclosures live
    - Trackers, linked data, encryption in transit, data deletion requests
    - No deeper public incident history or uptime reporting found
  - - iOS app quality signal
    - 4.9/5 from 81K ratings
    - Large installed-base signal for the unified mobile control surface
    - Ratings alone do not reveal servicing failure modes
  - - Android app quality signal
    - 4.4/5 from 29.5K reviews with visible complaints
    - Large installed-base signal plus recent negative reviews on payments and limits
    - Recent complaint themes imply servicing and UX ambiguity still need diligence
  - - Trustpilot sentiment
    - 4.4/5 from 44,005 reviews
    - Broad cross-product consumer feedback surface
    - Mixed customer-service and payment-resolution feedback persists
  notes: >-
    This table mixes formal controls, disclosure surfaces, and observed quality signals because public assurance evidence is thinner than product marketing evidence. Absence statements reflect the retained-source set, not a definitive statement that no such artifact exists privately.
