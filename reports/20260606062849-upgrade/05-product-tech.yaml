- id: workflow-ux
  title: Customer workflow and repayment UX
  body: >-
    The customer workflow is intentionally app-mediated from origination through servicing. Personal-loan acquisition starts with a soft rate check, then moves into verification before disbursement. Card UX is designed around control rather than float: Upgrade Card turns purchases into fixed-rate installment balances, while OneCard lets the user decide whether a transaction should behave like debit (“Pay Now”) or amortize over time (“Pay Later”). Deposit products add the other half of the loop. Rewards Checking pushes direct-deposit rewards, early paycheck, bill pay, mobile check deposit, fee-free ATMs, and smart transfer tools that automatically move money between checking and savings. The mobile app then becomes the control plane for payments, balance checks, transfers, rewards tracking, and credit-health monitoring across loans, cards, BNPL, and deposit accounts. The weak spot is exception handling: public servicing pages still describe manual check workflows that can take weeks, and
    recent Android reviews complain about payment allocation and autopay clarity.
