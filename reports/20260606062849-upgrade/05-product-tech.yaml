tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user job
  - Public status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Personal loans
    - Refinance revolving debt or fund a major expense
    - Mature flagship surface
    - Soft rate check plus fixed-rate installment terms up to 84 months
    - Need current approval-rate, funding-speed, and servicing-SLA disclosure
  - - Upgrade Card family
    - Spend on a Visa card without indefinite revolving debt
    - Mature live family
    - Installment payoff behavior plus cash-back rewards under one card construct
    - Need product-level grace-period, attrition, and issuer-evolution detail
  - - OneCard / Secured OneCard
    - Choose debit-like or installment behavior and/or build credit
    - Live extension, narrower than flagship card
    - Pay Now / Pay Later split plus collateralized savings and bureau reporting in secured variant
    - Need current adoption mix and issuer map by variant
  - - Rewards Checking Preferred
    - Use a spend account with rewards and automation
    - Mature live
    - Direct-deposit-linked debit rewards, Bill Pay Guard, Auto Balance, Allpoint access
    - Need active-account counts and engagement metrics
  - - Premier / Performance Savings
    - Earn yield and stage liquidity next to checking
    - Mature live
    - Higher APY and multi-institution insurance through custodial sweep program
    - Need current institution-allocation logic and customer take-up
  - - Flex Pay
    - Finance travel or retail purchases at checkout
    - Live but public detail thinner than core products
    - Quick application plus no late or prepayment fees
    - Need current US merchant roster, lender map, and unit economics
  - - Mobile app + Credit Health
    - Control the full account set from one device
    - Mature live
    - Single app spans loans, cards, BNPL, deposits, rewards, and score monitoring
    - Need release-note cadence and per-product feature adoption
  - - Partner-bank / control layer
    - Keep products legally operable and compliant
    - Essential but externally dependent
    - Cross River origination/accounts/cards plus Visa, Allpoint, app stores, and participating institutions
    - Need contingency planning if a major rail or bank partner changes terms
  notes: >-
    Public status reflects retained external evidence only. Rows mix customer-visible modules with the shared partner/control layer because that dependency is core to how Upgrade delivers the experience.
