evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: profitability-history
    missingEvidence: Audited or management-certified year-by-year profitability and cash-flow data back to 2020.
    whyItMatters: >-
      Public sources show cash-flow positivity and profitability commentary, but not enough to prove the stronger
      since-2020 profitability claim without caveat.
    diligencePath: >-
      Request annual management accounts, lender deck excerpts, or securitization materials that reconcile net income
      and operating cash flow by year.
    relatedQuestionRefs:
      - QO013
  - type: missing-source
    severity: material
    topic: leadership-public-disclosure
    missingEvidence: A current public or company-supplied statement clarifying Soul Htite's present role, if any, at Upgrade.
    whyItMatters: >-
      Founder attribution is central to chapter 1 and the current public record does not resolve whether Htite remains
      operationally or governantly relevant.
    diligencePath: >-
      Request a current founder and board roster, review archived team pages, and check corporate filings or direct
      company commentary on Htite's status.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Current cap table, ownership percentages, board committee assignments, and any investor governance rights tied to
      Series G.
    whyItMatters: >-
      Chapter 1 can identify named investors and a new board seat, but it cannot underwrite control, dilution, or
      liquidation dynamics from public sources alone.
    diligencePath: >-
      Request the cap table, preferred-stock term summary, board observer schedule, and any side-letter summary from the
      company or lead investors.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: borrower-fico-distribution
    missingEvidence: Product-level borrower FICO distributions or underwriting cohort summaries across loans, cards, and BNPL.
    whyItMatters: >-
      Public reviews support fair-credit and near-prime positioning, but they do not conclusively validate the exact
      claimed 580-700 focus across the full platform.
    diligencePath: Request underwriting summaries, securitization presales, or internal borrower-mix data by product and vintage.
    relatedQuestionRefs:
      - QO021
  - type: private-evidence-only
    severity: material
    topic: score-band-balance-share
    missingEvidence: >-
      A bureau- or lender-level breakout of current revolving balances held by 630-719 borrowers who would likely pass
      Upgrade underwriting.
    whyItMatters: >-
      Without a score-band balance cut, the chapter can only bound SAM using total card balances and cannot isolate the
      highest-probability refinance pool.
    diligencePath: >-
      Request bureau or servicing data that segments outstanding card balances by FICO band, utilization, and recent
      delinquency status.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-conversion
    missingEvidence: Upgrade product attach, repeat-borrow, and deposit-to-credit conversion rates by cohort.
    whyItMatters: >-
      The chapter can show that deposits are an acquisition adjacency, but it cannot quantify how much checking or
      savings meaningfully lowers CAC or raises lifetime value.
    diligencePath: >-
      Request cohort retention and product attach data showing conversion from savings/checking users into personal-loan
      or Upgrade Card borrowers.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: partner-bank-state-constraints
    missingEvidence: >-
      Publicly documentable company-specific partner-bank structure, APR-cap exceptions, and 2026 state or supervisory
      constraints tied to Upgrade's exact product stack.
    whyItMatters: >-
      Sector-wide BNPL and consumer-credit regulation is visible, but company-specific legal constraints can narrow
      where growth and pricing are actually available.
    diligencePath: >-
      Obtain partner-bank agreements, state-by-state licensing matrix, and legal counsel memos describing any
      product-specific restrictions or supervision findings.
    relatedQuestionRefs:
      - QM028
  - type: conflicting-data
    severity: minor
    topic: minimum-credit-score-disclosure
    missingEvidence: A direct official disclosure of Upgrade's minimum FICO by product and risk tier.
    whyItMatters: >-
      Third-party reviews cluster around 600 but still cite a high-500s to low-600s range, which weakens precision when
      sizing the exact borrower boundary.
    diligencePath: >-
      Ask management or underwriting for the formal minimum score policy, override logic, and realized borrower score
      distribution.
    relatedQuestionRefs:
      - QM010
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Realized approval-rate and APR distribution data for Upgrade, SoFi, LendingClub, and Upstart by borrower tier.
    whyItMatters: List-rate comparisons overstate how often consumers actually qualify for the headline floor APRs in this chapter.
    diligencePath: >-
      Request conversion funnels and funded-loan APR distributions by FICO or internal risk band from management and key
      peers where available.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: cross-sell-economics
    missingEvidence: >-
      Product-level attachment, retention, and CAC payback for Upgrade customers who add cards, checking, savings, or
      Flex Pay.
    whyItMatters: >-
      Upgrade's durability thesis depends on bundle economics, but public materials do not show whether the extra
      surfaces materially improve retention or margin.
    diligencePath: >-
      Ask management for cohort retention, product attachment, and contribution-margin bridges for single-product versus
      multi-product users.
    relatedQuestionRefs:
      - QP017
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: flex-pay-merchant-scale
    missingEvidence: Current merchant count, GMV, and repeat-use metrics for Flex Pay versus Affirm and Klarna.
    whyItMatters: >-
      Without merchant-footprint data it is hard to know whether Upgrade is building a meaningful checkout network or
      only a targeted add-on product.
    diligencePath: >-
      Request active merchant count, GMV mix, largest categories, and repeat usage for Flex Pay, then compare with
      merchant-network disclosures from BNPL peers.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: stale
    severity: material
    topic: capitalone-discover-integration
    missingEvidence: >-
      Concrete post-merger milestones showing when Capital One will unify Discover card, deposit, and network advantages
      into one proposition.
    whyItMatters: >-
      Competitive pressure from incumbents will matter more if the merged company rapidly cross-sells and rationalizes
      rewards, acceptance, and deposit distribution.
    diligencePath: >-
      Monitor quarterly integration disclosures, card portfolio migration timelines, and product-change notices for
      Discover and Capital One customers.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: gaap-profitability
    missingEvidence: >-
      Audited annual and interim income statements, cash-flow statements, and product-level revenue / margin bridge
      since 2020.
    whyItMatters: >-
      Public materials only support management-reported profitable growth and cash-flow positivity, not audited earnings
      quality or volatility across cycles.
    diligencePath: >-
      Request audited financial statements, reviewed interim statements, and a reconciliation from operating cash flow
      to GAAP net income by year.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI005
      - TI007
  - type: private-evidence-only
    severity: material
    topic: charge-offs-by-product
    missingEvidence: >-
      30+, 60+, and 90+ delinquency plus net-loss curves by product, channel, and vintage for personal loans, cards,
      BNPL, auto, and home-improvement loans.
    whyItMatters: >-
      Fitch discloses assumptions only for home-improvement ABS; the flagship unsecured businesses still cannot be
      stress-tested from public data.
    diligencePath: >-
      Request monthly servicing tapes and static-pool curves by product and channel, including recoveries and
      modification activity.
    relatedQuestionRefs:
      - QI025
    relatedTableRefs:
      - TI006
      - TI007
  - type: private-evidence-only
    severity: material
    topic: deposit-take-rate
    missingEvidence: >-
      Contractual economics for checking and savings balances, including spread share, fee share, and average balances
      by partner institution.
    whyItMatters: Deposit products may be profit centers, acquisition subsidies, or both; the public record does not quantify which.
    diligencePath: >-
      Request partner agreements, average deposit balances, gross profit per account, and attach-rate / retention
      cohorts for deposit customers.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI001
      - TI007
  - type: private-evidence-only
    severity: material
    topic: cac-and-payback
    missingEvidence: >-
      Channel-level CAC, conversion, repeat usage, servicing margin, and payback by direct, travel, contractor,
      auto-dealer, and BNPL channels.
    whyItMatters: >-
      Management's low-cost proprietary distribution claim is central to margin durability and valuation support, but
      cannot be verified from public evidence.
    diligencePath: >-
      Request cohort CAC / payback decks, marketing contribution margin by channel, and channel-specific loss and
      retention data.
    relatedQuestionRefs:
      - QI027
    relatedTableRefs:
      - TI003
      - TI007
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Public SOC 2, PCI, penetration-test summary, or customer-facing uptime/SLA documentation for current Upgrade
      products.
    whyItMatters: >-
      Security process pages exist, but institutional diligence still needs assurance artifacts or an uptime history
      before treating operational resilience as fully underwritten.
    diligencePath: >-
      Request the latest SOC 2 report, PCI attestation, incident-history summary, and any status-page or SLA documents
      from security or enterprise diligence channels.
    relatedQuestionRefs:
      - QE020
      - QE025
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: flex-pay-coverage
    missingEvidence: >-
      Current US Flex Pay merchant roster, lender/issuer map, repayment-servicing workflow, and segment-level
      origination volumes.
    whyItMatters: >-
      The retained BNPL evidence proves a live surface and partner categories, but not enough detail to size revenue
      concentration or operational exposure by merchant or funding partner.
    diligencePath: >-
      Ask management for a current Flex Pay partner list, top merchants by volume, lender map, servicing KPIs, and any
      US vs Canada product differences.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE005
  - type: private-evidence-only
    severity: material
    topic: underwriting-performance
    missingEvidence: >-
      Current approval-rate, pricing-lift, override, delinquency, and servicing-remediation metrics for the underwriting
      model across cards and loans.
    whyItMatters: >-
      The public record describes richer data usage and compliance support, but does not reveal whether the model’s
      extra complexity improves unit economics or reduces complaints in production.
    diligencePath: >-
      Request internal underwriting scorecards, approval funnels, delinquency by score band, complaint-resolution SLAs,
      and loss curves by major product.
    relatedQuestionRefs:
      - QE012
      - QE023
    relatedTableRefs:
      - TE003
      - TE004
  - type: conflicting-data
    severity: minor
