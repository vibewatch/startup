    figureRefs: []
  - id: diligence-blockers
    title: What public evidence still cannot prove
    body: >-
      The main underwriting blocker is not whether Upgrade has multiple revenue streams; it is whether the economics of those streams are durable after rewards expense, funding costs, servicing costs, and credit losses. Public evidence supports diversified revenue sources, repeated access to capital, and management-reported profitable growth, but it still does not disclose audited GAAP profitability by year, product-level charge-off curves for the flagship unsecured products, CAC and payback by acquisition channel, servicing-margin detail, or the exact revenue share on deposits gathered for partner institutions. Warehouse terms are also opaque: the facility headline is public, but advance rates, covenants, eligibility triggers, and concentration limits are not. In practice, that means the chapter can support a constructive view on revenue quality and liquidity access, yet still only a research-more underwriting verdict. A buyer should ask management to bridge origination volume to gross revenue, gross profit, operating cash generation, and required balance-sheet support by product before taking a stronger stance on normalized earnings power.
    claimRefs:
      - CI040
      - CI041
      - CI042
    tableRefs:
      - TI007
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public evidence / status
      - Revenue quality
      - Diligence ask
    rows:
      -
        - Personal loans
        - Upfront origination fee plus sale-at-par economics and retained servicing
        - Loan originated
        - Public loan example shows a 5% origination fee; interview says loans are sold to ultimate lenders at par and keep servicing fees
        - Mixed upfront plus recurring servicing; sensitive to buyer appetite and loss performance
        - Request realized fee range, sale premium / discount, and servicing bps by vintage
      -
        - Upgrade Card / personal credit lines
        - Finance charges on fixed-rate balances plus interchange, servicing, and buyer premium
        - Spend and receivable balance
        - Product pages show installment-card structure and rewards; interview says interchange, premium sale, and servicing all contribute
        - Recurring and potentially sticky, but rewards cost and credit losses matter
        - Request net interchange after rewards, APR realization, and buyer economics by cohort
      -
        - Checking accounts
        - Deposit placement or account fee-share plus cheaper credit acquisition
        - Active account / deposit balance
        - Interview says Upgrade takes a fee for providing deposits; partner pages emphasize cross-sell and lower loan rates
        - Strategic rather than purely monetary in public evidence
        - Request revenue share, balances, attach rate, and churn by cohort
      -
        - Savings accounts
        - Deposit balances gathered for partner institutions, with unclear spread sharing
        - Average savings balance
        - Current product page markets 3.05% APY and partner-bank insurance, but Upgrade's own take rate is undisclosed
        - Indirect economics likely tied to partner relationships
        - Request spread share, balance mix, and incremental cross-sell conversion
      -
        - Home improvement financing
        - Origination, servicing, contractor-channel distribution, and term ABS execution
        - Financed project / loan draw
        - 2025 press says cumulative home-improvement financing exceeded $2 billion; Fitch presale shows dedicated ABS funding
        - Attractive if loss behavior holds, but long-duration data history is short
        - Request contractor CAC, gain on sale, and static-pool loss curves
      -
        - Auto financing and BNPL / travel channels
        - Channel-specific origination or merchant economics
        - Originations / merchant volume
        - 2025 press cites $1 billion in auto financing and proprietary travel / contractor / dealer channels
        - Likely heterogeneous economics by channel and product
        - Request merchant discount, repeat usage, fraud, and loss rates by channel
    notes: >-
      Public evidence mixes current consumer-facing pricing pages with management interviews and funding releases. Upgrade does not publish product-level revenue mix, so stream quality reflects source-backed mechanics rather than disclosed percentages.
    claimRefs:
