  - id: TI007
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on underwriting
      - Best public proxy today
      - Exact diligence path
    rows:
      -
        - GAAP revenue by product
        - Cannot test revenue concentration or durability of each stream
        - CNBC's annualized revenue greater than $1 billion quote
        - Request audited annual and quarterly revenue by product since 2020
      -
        - Gross margin and servicing margin
        - Cannot bridge originations to contribution margin
        - Interviews saying servicing is retained and fee income exists
        - Request product P&Ls and servicing economics by channel
      -
        - Net income / EBITDA / cash burn
        - Cannot verify quality of profitability claims
        - CEO and investor statements about profitable growth and cash-flow positivity
        - Request audited financial statements and monthly management accounts
      -
        - Warehouse advance rates and covenants
        - Cannot model refinancing stress or borrowing-base haircuts
        - $250 million facility headline only
        - Request facility agreements, covenant package, and collateral eligibility tests
      -
        - Product-level delinquency and charge-off curves
        - Cannot validate default assumptions for personal loans or Upgrade Card
        - Fitch home-improvement ABS assumptions and macro bank proxies
        - Request static-pool tapes by product, vintage, and channel
      -
        - CAC, payback, and channel contribution
        - Cannot prove low-cost acquisition or margin durability by source channel
        - 2021 monthly-application scale and travel / contractor / dealer distribution claims
        - Request cohort CAC, repeat rates, and payback by direct, travel, contractor, auto, and BNPL channels
      -
        - Deposit spread / fee share
        - Cannot tell whether deposits are profit centers or acquisition subsidies
        - Interview says Upgrade receives a fee when institutions take deposits through the platform
        - Request partner agreements, average balances, and gross profit per account
    notes: >-
      These are not generic asks: each gap blocks a specific underwriting bridge from public originations and product claims to normalized earnings power and liquidity resilience.
    claimRefs:
      - CI042
