  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gaap-profitability
      missingEvidence: Audited annual and interim income statements, cash-flow statements, and product-level revenue / margin bridge since 2020.
      whyItMatters: Public materials only support management-reported profitable growth and cash-flow positivity, not audited earnings quality or volatility across cycles.
      diligencePath: Request audited financial statements, reviewed interim statements, and a reconciliation from operating cash flow to GAAP net income by year.
      relatedQuestionRefs:
        - QI019
      relatedTableRefs:
        - TI005
        - TI007
    - type: private-evidence-only
      severity: material
      topic: charge-offs-by-product
      missingEvidence: 30+, 60+, and 90+ delinquency plus net-loss curves by product, channel, and vintage for personal loans, cards, BNPL, auto, and home-improvement loans.
      whyItMatters: Fitch discloses assumptions only for home-improvement ABS; the flagship unsecured businesses still cannot be stress-tested from public data.
      diligencePath: Request monthly servicing tapes and static-pool curves by product and channel, including recoveries and modification activity.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI006
        - TI007
    - type: private-evidence-only
      severity: material
      topic: deposit-take-rate
      missingEvidence: Contractual economics for checking and savings balances, including spread share, fee share, and average balances by partner institution.
      whyItMatters: Deposit products may be profit centers, acquisition subsidies, or both; the public record does not quantify which.
      diligencePath: Request partner agreements, average deposit balances, gross profit per account, and attach-rate / retention cohorts for deposit customers.
      relatedQuestionRefs:
        - QI026
      relatedTableRefs:
        - TI001
        - TI007
    - type: private-evidence-only
      severity: material
      topic: cac-and-payback
      missingEvidence: Channel-level CAC, conversion, repeat usage, servicing margin, and payback by direct, travel, contractor, auto-dealer, and BNPL channels.
      whyItMatters: Management's low-cost proprietary distribution claim is central to margin durability and valuation support, but cannot be verified from public evidence.
      diligencePath: Request cohort CAC / payback decks, marketing contribution margin by channel, and channel-specific loss and retention data.
      relatedQuestionRefs:
        - QI027
      relatedTableRefs:
        - TI003
        - TI007
