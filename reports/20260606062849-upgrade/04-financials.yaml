  - id: funding-architecture
    title: Partner-bank, warehouse, and securitization architecture
    body: >-
      Upgrade's capital architecture looks intentionally asset-light but still heavily dependent on external counterparties. Official company disclosures say loans and credit lines are issued by partner banks, while partner and interview material says sold assets generally stay off Upgrade's balance sheet and remain serviced by Upgrade. That structure reduces the need for a full bank balance sheet, but it also means liquidity depends on the continued health of buyer demand, partner-bank relationships, and refinancing markets. The current evidence stack is constructive on access: Cross River-backed disclosures show a personal-credit-line facility upsized from $150 million to $250 million in 2026, KBRA says Upgrade brought a second unsecured consumer-loan term ABS in 2026, Fitch rated a separate $316.1 million home-improvement ABS in April 2026, and SEC filings show an uninterrupted ABS-15G history from 2017 through 2026. The main underwriting takeaway is that Upgrade clearly has repeat access to warehouses and capital-markets execution, but that visibility is concentrated at the asset and facility level rather than at a consolidated corporate-cash level.
    claimRefs:
      - CI002
      - CI010
      - CI011
