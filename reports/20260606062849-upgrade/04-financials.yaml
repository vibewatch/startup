company:
  name: Upgrade
chapter:
  number: 4
  title: Financials
  summary: >-
    Upgrade's public financial picture supports a diversified fee-and-funding model rather than a simple balance-sheet lender thesis. Public evidence shows recurring access to partner-bank origination, warehouse capacity, securitization, and equity, plus management-reported profitable growth, but underwriting still lacks audited profitability, product-level loss curves, and channel economics.
sections:
  - id: revenue-model
    title: Revenue model and monetization stack
    body: >-
      Upgrade's revenue model is broader than the headline personal-loan product. Current product pages and partner disclosures show three monetization layers operating at once. First, personal loans still carry explicit upfront economics: Upgrade's example APR includes a 5% origination fee, while management told The Financial Brand that personal-loan assets are typically sold to an ultimate lender at par and continue to generate servicing fees. Second, the card franchise adds recurring economics through fixed-rate balances, interchange, and servicing. Upgrade Card is explicitly positioned as a Visa card with installment-loan repayment behavior, and management told The Financial Brand that card receivables are sold at a premium while Upgrade keeps servicing and interchange. Third, checking and savings appear to be strategic economics rather than standalone bank spread revenue: current checking and savings pages emphasize rewards, APY, and insurance through partner banks, while The Financial Brand says Upgrade takes a fee when partner institutions gather deposits through the platform. Taken together, the public record supports a diversified monetization stack built on origination, servicing, interchange, and partner-economics rather than on holding loans and deposits directly on Upgrade's own balance sheet.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
