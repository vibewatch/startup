      -
        - Margin path
        - Public statements describe profitable growth and cash-flow positivity
        - promising but unaudited
        - Rewards expense, servicing cost, and credit cost are not reconciled publicly
      -
        - Capital intensity
        - Marketplace distribution plus facilities and ABS reduce the need for a bank balance sheet
        - moderate, not bank-like
        - Continued reliance on buyers, warehouses, and partner banks
      -
        - Liquidity access
        - Equity raise, warehouse upsize, and multiple 2026 ABS transactions show active financing channels
        - currently supported
        - Refinancing windows and partner concentration remain material
      -
        - Credit risk visibility
        - Ratings assumptions and macro proxies exist, but flagship product loss curves are private
        - manageable but only partially observable
        - Core card and personal-loan losses could differ from public proxies
      -
        - Overall chapter verdict
        - Revenue quality looks credible enough to keep diligence alive, but not yet precise enough for full underwriting
        - research-more
        - Key gaps still sit in audited profitability, unit economics, and covenant detail
    notes: >-
      This verdict table synthesizes the chapter's evidence rather than introducing new facts. It is intended to help an investor prioritize diligence follow-up before underwriting normalized earnings or downside liquidity.
