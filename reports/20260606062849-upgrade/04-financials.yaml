  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product
      - Public pricing / consumer charge
      - Counterparty / issuer
      - Disclosed economics lens
      - Caveat
    rows:
      -
        - Personal loans
        - Example 17.98% APR on $10,000 / 36 months including a 5% origination fee and no prepayment fee
        - Borrower; loans issued by partner banks
        - Clear evidence of upfront fee income and interest-bearing product design
        - Example pricing is not the realized portfolio average or full rate range
      -
        - Upgrade Card Cash Rewards
        - Unlimited 1.5% cash back and no annual fee
        - Cardholder spend; issued through partner-bank model
        - Supports interchange-driven economics layered on installment-card finance charges
        - Net margin after rewards expense is not disclosed
      -
        - Upgrade Card Life Rewards
        - 3% cash back on gas, groceries and more, no annual fee
        - Cardholder spend
        - Richer rewards imply lower interchange margin unless card yields or cross-sell offset
        - Marketing offer does not reveal portfolio mix or profitability
      -
        - Upgrade Select
        - $39 annual fee
        - Cardholder spend
        - Annual-fee tier suggests higher-value or segmented economics
        - Public data do not disclose adoption or retention for this tier
      -
        - Rewards Checking Preferred
        - Up to 2% cash back with a $1,000 monthly direct deposit unlocking higher APY path to Performance Savings
        - Deposit account through partner-bank structure
        - Deposit rewards appear designed to deepen attachment and reduce lending acquisition cost
        - Cash-back expense and revenue share are undisclosed
      -
        - Premier Savings
        - 3.05% APY on balances of $1,000 or more
        - Deposit account through Cross River or participating institutions
        - Attractive yield likely supports customer retention and partner deposit gathering
        - No disclosure of Upgrade's spread share or servicing cost to support the account
    notes: >-
      This table captures list or marketed pricing, not realized customer economics. Public product pages are useful for identifying monetization levers but not for measuring portfolio-average yield, reward expense, or take rate.
