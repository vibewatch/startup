  - id: TI003
    title: Partner / balance-sheet economics table
    columns:
      - Counterparty / channel
      - Partner economics
      - Upgrade economics
      - Public evidence
      - Underwriting implication
    rows:
      -
        - Credit unions and bank buyers
        - Buy loans that fit custom buy books and receive yield-bearing assets
        - Origination, servicing, and asset-sale economics
        - 200+ / about 220 institutions, custom criteria, servicing retained
        - Off-balance-sheet model lowers capital intensity but depends on secondary demand
      -
        - Institutional investors for lower-FICO assets
        - Purchase loans outside typical partner-CU filters
        - Originates and places riskier credits without holding them permanently
        - Current partner page says sub-660 FICO loans are typically sold to institutional investors
        - Liquidity for lower-credit cohorts is a key downside dependency
      -
        - Cross River and other originating banks
        - Provide charter, compliance framework, and in some cases capital support
        - Fast product launch and partner-bank origination infrastructure
        - Company releases list Cross River, Blue Ridge, Celtic, and Sutton by product role
        - Bank-partner concentration and regulatory oversight remain important diligence items
      -
        - Warehouse / PCL facility providers
        - Earn secured exposure against receivables and fee income
        - Non-deposit liquidity to scale card and PCL assets
        - Cross River facility upsized from $150 million to $250 million in 2026
        - Repricing, covenant, or renewal friction can constrain growth
      -
        - Deposit-taking partner institutions
        - Receive deposits gathered through Upgrade's front end
        - Interview says Upgrade takes a fee when institutions obtain deposits through Upgrade
        - Deposits are described as valuable again and part of partner economics
        - Deposit economics may help margins, but the actual rev-share is opaque
    notes: >-
      Upgrade appears to operate more as a marketplace and distribution layer than as a self-funded bank. The exact split between sale gains, servicing income, and partner fee share is not public and needs management materials.
    claimRefs:
      - CI002
      - CI010
      - CI011
      - CI012
      - CI014
