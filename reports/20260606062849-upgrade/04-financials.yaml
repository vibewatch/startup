callouts:
  - calloutType: insight
    title: Multi-product monetization matters more than headline APR
    body: >-
      The public record supports a revenue model built from several small economics layers—origination, servicing, interchange, and deposit-related fees—rather than from a single interest spread. That diversification is positive for revenue quality, but it also means diligence must reconcile several cost stacks before margin claims become reliable.
    claimRefs:
      - CI005
      - CI009
      - CI034
      - CI040
  - calloutType: risk
    title: Liquidity looks available, but not fully transparent
    body: >-
      Upgrade plainly has access to equity, warehouses, and term ABS markets. What is missing are the covenant, advance-rate, and cash-position details needed to know how much stress the structure can take if buyer demand or credit performance weakens.
    claimRefs:
      - CI015
      - CI017
      - CI018
      - CI031
      - CI042
