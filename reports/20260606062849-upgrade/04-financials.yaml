        - id: warehouse
          label: 2026 revolving facility
          detail: Cross River upsized a PCL facility from $150 million to $250 million
        - id: term-abs
          label: 2026 term ABS markets
          detail: $206.2 million UMPT 2026-ST2 and $316.1 million UPG HI 2026-1
