          detail: Fixed-term unsecured loans with disclosed origination fee example
        - id: card-pcl
          label: Upgrade Card / personal credit lines
          detail: Installment-style card balances with rewards and fixed-rate repayment behavior
        - id: deposits
          label: Checking and savings accounts
