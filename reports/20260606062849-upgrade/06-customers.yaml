- id: TU007
  title: Complaint and critical feedback surface table
  columns:
  - Surface
  - Observed signal
  - Date / freshness
  - Implication
  - Reader caution
  rows:
  - - BBB business profile
    - Complaints on file concern credit-reporting issues
    - Reviewed Feb. 2026
    - Credit-reporting friction is not just a random anecdote
    - BBB does not publish a normalized complaint rate in the fetched text
  - - CFPB-derived complaint compilation
    - 4,354 complaints; credit-reporting is largest bucket at 30.3%
    - Accessed 2026-06-06
    - Complaints span multiple product lines and are sizable in absolute terms
    - Compilation is derivative of CFPB data, not the official API itself
  - - WalletHub user reviews
    - Credit-line cuts despite on-time autopay are a recurring theme
    - 2026 reviews visible on page
    - Could damage card-customer trust and future usage
    - Anecdotal and self-selected reviewer sample
  - - WalletHub user reviews
    - Duplicate withdrawals and refund delays appear in multiple narratives
    - 2026 reviews visible on page
    - Payments and servicing operations deserve diligence focus
    - Individual narratives are not verified by the reviewer
  - - WalletHub Flex Pay narrative
    - Travel-refund dispute with weeks-long wait for mailed check
    - 2026 review visible on page
    - Point-of-sale partner flows can generate high-emotion support incidents
    - Single case, not a disclosed product-level complaint rate
  - - CFPB complaint database methodology
    - Complaint volume must be contextualized by company size and market share
    - Current 2026 methodology page
    - Raw counts alone should not be read as a failure rate
    - Does not eliminate the need to investigate complaint themes
  notes: This table combines formal complaint surfaces and narrative review examples to separate recurring themes from one-off anecdotes.
