company:
  name: Upgrade
chapter:
  number: 6
  title: Customers
  summary: Upgrade's public customer evidence supports a mainstream fair-credit consumer platform with real multi-channel distribution, strong surface-level satisfaction, and meaningful servicing noise around credit reporting, payments, and refunds. The company discloses large platform scale and many acquisition surfaces, but it does not publish the retention and channel-mix denominators needed to underwrite lifetime value cleanly.
sections:
- id: borrower-segments-and-positioning
  title: Borrower segments and positioning
  body: Upgrade's public customer evidence points to a lender serving broad mainstream consumer credit needs rather than only super-prime households. The company itself says it serves mainstream consumers, and the most credible review sites consistently frame Upgrade as fair-credit accessible rather than exclusive. The sharpest nuance is that consumer-facing review sites describe loan eligibility beginning around 580 to 600, while the bank- and credit-union-facing purchase programs emphasize prime-weighted loan pools with average FICOs above 720 and minimum 660+ partner criteria. That mix implies Upgrade acquires borrowers across a wider credit spectrum than the receivable pools it markets to depository partners. In practice, the clearest public customer segments are debt-consolidation borrowers, fast-funding emergency borrowers, Upgrade Card users, Rewards Checking households, and point-of-sale borrowers coming through auto, home-improvement, and BNPL surfaces.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU039
  - CU042
