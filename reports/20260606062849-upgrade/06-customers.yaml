- id: proof-of-live-customer-use
  title: Proof of live customer use
  body: 'Because Upgrade is a consumer fintech, the best customer-proof is a blend of curated company testimonials and attributable third-party reviews. Upgrade''s personal-loan and checking pages surface the same five-star Alma Lihic testimonial around easy self-service, and the reviews page says the company relies on Trustpilot-collected feedback. Independent evidence is more valuable: WalletHub includes positive accounts from repeat borrowers and emergency-use borrowers who describe fast approvals and funding, which supports the product narrative around convenience and debt consolidation. But the same third-party surface also contains detailed negative experiences, particularly around credit-line cuts, refund delays, and Flex Pay servicing. That combination is actually useful: it confirms live customer use while also showing that public proof is not just curated marketing. What is absent is any production-level breakdown of how many customers repeat, refinance, or add a second Upgrade
    product over time.'
  claimRefs:
  - CU022
  - CU037
  - CU034
  - CU035
  - CU036
  tableRefs:
  - TU003
- id: satisfaction-app-feedback-and-complaints
  title: Satisfaction, app feedback, and complaint surface
  body: 'Surface-level satisfaction looks good, but the spread between sources matters. On the positive side, the Apple App Store shows a 4.9 score from 81,000 ratings, Bankrate cites strong iOS and Google Play scores, SuperMoney shows a +77 recommendation score for Rewards Checking, and NerdWallet''s borrower panel says 85% would recommend the loan product. Editorial review sites also award strong grades, with Bankrate at 4.6 and NerdWallet treating Upgrade as a leading fair-credit lender in 2026. The adverse side is not trivial, though. BBB says complaints on file concern credit-reporting issues, and a CFPB-derived complaint compilation shows credit reporting, debt collection, and account-management problems across multiple products. WalletHub reviews provide qualitative color: some customers describe on-time accounts that still saw credit-line cuts, duplicate withdrawals, or long waits for refunds. The result is not a broken customer story, but a customer story with real servicing noise.'
  claimRefs:
