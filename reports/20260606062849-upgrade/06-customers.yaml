callouts:
- calloutType: insight
  title: Customer mix looks broader than the receivable pools sold to depositories
  body: Upgrade's front-end marketing and third-party reviews clearly court fair-credit mainstream borrowers, but the bank- and credit-union-facing loan pools are presented as prime weighted. That is a useful reminder that customer acquisition and funding presentation are not the same thing.
  claimRefs:
  - CU002
  - CU003
  - CU005
  - CU006
  - CU007
  - CU039
- calloutType: risk
  title: The visible complaint surface is concentrated in reporting, payments, and refunds
  body: Public evidence does not show a catastrophic satisfaction problem, but it does show enough recurring friction around credit reporting, credit-line actions, duplicate withdrawals, and refund timing that servicing diligence should be a chapter-level priority before leaning too hard on LTV or cross-sell assumptions.
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU033
  - CU034
  - CU035
  - CU036
