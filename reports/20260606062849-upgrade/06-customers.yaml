tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public credit-band evidence
  - Strategic value to Upgrade
  - Main diligence gap
  rows:
  - - Direct personal-loan borrower
    - Individual / individual / individual
    - Debt consolidation, emergency liquidity, large expenses
    - Independent reviews put the floor at 580-600; average NerdWallet borrower profile is 677 FICO
    - Highest-volume direct funnel and gateway product
    - No product-level active-borrower count disclosed
  - - Prime-weighted loan pool sold to banks / credit unions
    - Individual borrower / individual / depository buyer
    - Debt-consolidation and installment loans purchased by partners
    - Partner pages show weighted-average FICO 722-725 and 660+ minimum for partner programs
    - Supports funding depth and lower-cost balance-sheet demand
    - Hold-vs-sell mix by FICO band is undisclosed
  - - Upgrade Card household
    - Individual / cardholder / individual
    - Everyday spend with fixed-payoff installment structure
    - Cross-sell, bundle bonus, and app management imply mainstream near-prime household targeting
    - Improves lifetime value beyond one-off lending
    - No active cardholder count or card-retention metric disclosed
  - - Rewards Checking household
    - Individual / depositor / individual
    - Direct deposit, transaction account, cash back, app engagement
    - Checking discount and switch-kit marketing suggest broader banking relationship
    - Raises stickiness and supports card / loan cross-sell
    - No disclosed direct-deposit retention or active-checking count
  - - Point-of-sale borrower
    - Individual / purchaser / individual
    - Flex Pay BNPL, auto finance, home improvement finance
    - Public scale comes via thousands of merchants and 1,000+ auto dealers
    - Captures customers outside paid-search DTC funnels
    - No product-level channel mix or partner concentration split disclosed
  notes: Mixes company claims with independent review evidence; credit-band cells reflect public proxies rather than a disclosed internal segmentation file.
