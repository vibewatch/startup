  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: channel-mix
    missingEvidence: A channel-level origination and acquisition mix showing what share of customers come from direct digital, merchant / contractor, dealer, and bank-partner pathways.
    whyItMatters: Without channel mix, it is impossible to judge acquisition diversification, CAC durability, or whether one partner surface is dominating growth.
    diligencePath: Request quarterly originations, approvals, and active accounts by acquisition source plus CAC or payback by channel.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU002
    - TU005
  - type: private-evidence-only
    severity: material
    topic: repeat-usage
    missingEvidence: Repeat-borrowing, refinance, and multi-product attach-rate cohorts by customer vintage.
    whyItMatters: Public anecdotes suggest repeat use, but anecdotes cannot support durability or lifetime-value underwriting.
    diligencePath: Request borrower-vintage cohorts showing second-product adoption, repeat loans, refinance behavior, and household product counts.
    relatedQuestionRefs:
    - QU028
    relatedTableRefs:
    - TU003
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Formal churn, retention, GRR, NRR, or cohort-retention metrics by product line.
    whyItMatters: The chapter can describe expansion mechanisms but cannot verify true customer durability without product-level retention metrics.
    diligencePath: Request monthly and annual retention cohorts for loans, cards, checking, and BNPL/Flex Pay, including reactivation and charge-off-adjusted views.
    relatedQuestionRefs:
    - QU029
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: active-usage
    missingEvidence: Product-level active customer, active account, and active borrower counts by major segment.
    whyItMatters: Platform-scale numbers are impressive, but the lack of segment denominators makes it hard to tell which cohorts are growing or sticky.
    diligencePath: Request active-account and active-borrower counts by product, credit band, and acquisition channel for the last eight quarters.
    relatedQuestionRefs:
    - QU030
    relatedTableRefs:
    - TU001
    - TU002
