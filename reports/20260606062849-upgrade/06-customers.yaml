- id: acquisition-surfaces-and-adoption
  title: Acquisition surfaces and adoption trajectory
  body: 'Adoption proof is strongest at the platform level, not the per-product level. Upgrade said in August 2025 that it had served more than 7 million customers and delivered more than $40 billion of credit, and the same memo linked that scale to a multi-product, multi-channel model. Public materials show customer acquisition coming from the direct website, merchant and contractor networks, point-of-sale BNPL, auto dealers, and financial-institution partners that buy loans originated on the platform. The auto memo alone cited more than 1,000 dealers across 29 states, while the partner pages cite over 200 financial-institution relationships. The company also argues that this structure lowers customer-acquisition cost and raises lifetime value because it can follow a borrower with checking, cards, or other credit products after the first interaction. What remains missing is a denominator: Upgrade does not publish channel mix or active accounts by product, so the broad platform scale cannot
    be cleanly allocated to specific customer cohorts.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
