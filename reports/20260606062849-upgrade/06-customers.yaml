- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or durability risk
  - Impact
  - Diligence path
  rows:
  - - Multi-product discounts across loans, checking, and cards
    - Attach rates are not disclosed, so bundle economics cannot be measured externally
    - Could overstate lifetime value if few households actually adopt more than one product
    - Request household-level product-count cohorts and attach rates
  - - Merchant and dealer acquisition surfaces
    - Channel mix between DTC, dealer, merchant, and partner-funded channels is undisclosed
    - Hard to know whether growth is diversified or dependent on a few acquisition rails
    - Request originations, approvals, and CAC by channel
  - - Over 200 financial-institution buyers
    - Funding-partner appetite may determine which borrower cohorts Upgrade retains versus sells
    - Channel economics and borrower mix may move with partner demand
    - Request hold-vs-sell policy and buyer concentration
  - - Fair-credit accessibility
    - Lower-credit cohorts can face higher fees and complaint intensity around servicing or reporting
    - Could pressure satisfaction and repeat usage versus prime cohorts
    - Request performance and complaint rates by FICO band
  - - Flex Pay / point-of-sale products
    - Adverse refund narratives could spill into partner-brand relationships
    - Could raise support cost and damage partner trust
    - Request refund SLA, complaint incidence, and top-partner issues
  - - No published retention metrics
    - Durability cannot be underwritten from public sources alone
    - LTV assumptions remain speculative without cohort data
    - Request repeat-borrow, refinance, churn, and NRR/GRR disclosures
  notes: Focuses on expansion mechanics and concentration risk because Upgrade is a consumer platform with channel dependence rather than a classic enterprise customer concentration profile.
