callouts:
  - calloutType: insight
    title: Why the overview matters for later chapters
    body: >-
      Checkmarx should be modeled as a PE-owned, enterprise-focused AppSec platform that has moved beyond standalone SAST into a broader code-to-cloud control layer.
    claimRefs: [CO013, CO015, CO017, CO027]
  - calloutType: risk
    title: Private-company opacity is still material
    body: >-
      Customer-count, ARR, and headcount datapoints are directionally strong but not independently audited, so later investment conclusions should avoid false precision.
    claimRefs: [CO020, CO024, CO027, CO041, CO045]
