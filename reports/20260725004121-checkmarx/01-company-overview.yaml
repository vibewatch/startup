company:
  name: Checkmarx
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Checkmarx is a private application-security vendor founded in Israel in 2006 by Emmanuel Benzaquen and Maty Siman,
    later acquired by Hellman & Friedman in a $1.15 billion 2020 transaction and run since February 2023 by CEO Sandeep Johri.
    By 2024-2025 the company had repositioned around the Checkmarx One platform, serving 1,800+ customers globally,
    expanding U.S. operations in Atlanta, and adding code-to-cloud capabilities across SAST, SCA, IaC, API, container,
    and posture-management workflows. Public reporting also shows material execution risk: a roughly 10% layoff in late 2022,
    a 2024 sale process at a $2.5 billion target, and contradictory scale signals around headcount and current revenue that
    still require management diligence.
sections:
  - id: identity-and-footprint
    title: Identity, Founding, and Geographic Footprint
    body: >-
      Checkmarx was founded in 2006 in Israel by Emmanuel Benzaquen and Maty Siman, and built its brand around automated
      application security testing embedded directly in developer workflows. The company historically operated from the
      Tel Aviv / Ramat Gan base, but over time expanded aggressively in the United States and Europe as large-enterprise
      AppSec buying moved closer to security leaders, regulated industries, and cloud-native engineering teams. Checkmarx’s
      current operating identity is increasingly U.S.-centered: the company officially opened an Atlanta office to house
      U.S. sales, customer success, and technical support, and the February 2023 CEO transition press release was issued
      from Atlanta and Ramat Gan together, signaling dual-center leadership. The public footprint therefore supports the
      user-provided framing of Atlanta plus Israel rather than a single-headquarters story.

      The product identity has also shifted from a point-tool SAST vendor into a broader AppSec platform company. Checkmarx
      now describes itself as an application-security platform for the AI era, securing code, APIs, infrastructure-as-code,
      containers, and supply-chain components under the Checkmarx One brand. That positioning matters because later market,
      product, and valuation chapters should treat Checkmarx as a multi-module AST platform rather than only a legacy SAST
      vendor. Public materials consistently emphasize developer-native deployment, code-to-cloud visibility, and AI-assisted
      remediation as the firm’s current narrative.
    claimRefs: [CO001, CO002, CO003, CO004, CO015, CO016, CO029, CO030]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]
  - id: leadership-and-governance
    title: Leadership, Founders, and Governance
    body: >-
      The company’s leadership arc is one of founder continuity paired with institutionalized professional management.
      Co-founder Emmanuel Benzaquen led Checkmarx through its early product buildout, growth-equity period under Insight
      Partners, and the 2020 sale to Hellman & Friedman and TPG. In February 2023, Checkmarx appointed Sandeep Johri as
      CEO while Benzaquen remained on the board, marking the clearest handoff from founder-led scaling to private-equity
      operating discipline. Johri’s background at Tricentis, HP, and earlier security startups suggests the mandate was not
      merely steady-state stewardship: the board wanted someone experienced in enterprise software scaling, cloud transition,
      and category repositioning.

      Governance remains closely tied to owners and founders. The official leadership page still lists Benzaquen and Maty
      Siman as founder figures, while Hellman & Friedman, TPG, and Insight are represented in the broader board / advisor
      surface. Tarim Wasim of Hellman & Friedman publicly endorsed Johri as the next-stage leader, which is important for
      diligence because it shows the sponsor remains actively involved rather than purely financial. This governance model is
      supportive for disciplined execution, but it also means any eventual sale or recapitalization is likely to be heavily
      sponsor-directed. Key-person risk is lower than at many founder-led startups because the company has already proven a
      founder-to-operator transition, but product and customer continuity still depend materially on Johri and on the
      founders’ continuing board influence.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO026, CO035]
    tableRefs: [TO002]
  - id: ownership-capital-and-milestones
    title: Ownership, Capital History, and Operating Milestones
    body: >-
      Checkmarx is unusual among late-stage cybersecurity vendors in that public sources describe both a modest pre-exit
      venture-capital history and a large private-equity control transaction. Before the 2020 sale, Calcalist reported that
      the company had raised only about $100 million, with Insight Partners investing $85 million in 2015 and becoming the
      largest shareholder. Hellman & Friedman then acquired Checkmarx in an all-cash transaction valued at $1.15 billion,
      with TPG taking a minority stake and Insight retaining a minority interest. The deal was framed at the time as the
      largest application-security acquisition to date, underscoring Checkmarx’s strategic importance despite its smaller
      funding history.

      The most important post-acquisition public milestone is the September 2024 Calcalist report that Hellman & Friedman
      had begun a sale process at a target valuation of at least $2.5 billion. That report also claimed revenue had doubled
      since acquisition, albeit with a slight decline in 2023. This is the strongest public unicorn evidence for the current
      report because it is both post-July-2024 and specifically attributes the valuation target to an active sale process.
      Operating milestones since 2021 include the rollout of the global partner program, GitLab integration for open-source
      IaC scanning, FedRAMP work on Checkmarx One, cloud-native platform releases, runtime-aware container security, and
      broader code-to-cloud posture-management features.
    claimRefs: [CO013, CO014, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025]
    tableRefs: [TO003, TO004]
    figureRefs: [FO001]
  - id: platform-scale-and-customer-proof
    title: Platform Scope, Customer Base, and Proof of Adoption
    body: >-
      Public customer evidence supports the view that Checkmarx is an enterprise-focused platform rather than a small-team
      developer tool. Official materials repeatedly cite 1,800+ customers worldwide, with penetration claims ranging from
      nearly half of the Fortune 50 to 40% of the Fortune 100 depending on year and source context. The 2025 growth release
      tightened that narrative around the Checkmarx One platform specifically, stating it protected more than 865 of the
      world’s largest enterprises and had surpassed $150 million of ARR in under three years. Even allowing for vendor
      marketing bias, the direction of travel is clear: Checkmarx has real large-enterprise deployment depth.

      Customer proof also appears in implementation details rather than just logo walls. PCL Construction reported onboarding
      Checkmarx One in roughly four hours, scanning 4.4 million lines of code weekly across 21-plus applications, and valuing
      the platform’s unlimited-app licensing. Airius described competitive pricing, deployment flexibility, and a rental /
      pay-as-you-grow model inside the MSSP program. Cdiscount used Checkmarx’s assessment methodology to raise AppSec program
      maturity and ROI confidence. Apps Run the World and FeaturedCustomers add third-party support for enterprise reference
      depth, while Calcalist named Dell, Adidas, Ford, Visa, Siemens, and Salesforce among recognizable customers.
    claimRefs: [CO027, CO028, CO031, CO032, CO033, CO034, CO036, CO037, CO038, CO039, CO040]
    tableRefs: []
  - id: adverse-signals-and-diligence-gaps
    title: Adverse Signals and Diligence Gaps
    body: >-
      The positive adoption story is balanced by meaningful adverse evidence. In November 2022, Checkmarx cut roughly 100
      employees, about 10% of the workforce, citing macro pressure and a need to refocus resources. Calcalist’s later sale-
      process coverage said the company employed about 900 people in September 2024, with around half based in Israel, which
      implies slower scale than the most aggressive cyber-growth narratives and leaves uncertainty around current headcount.
      Employee review surfaces add softer but directionally relevant caution: reviewers consistently praise product quality but
      complain about management churn, weak cross-functional communication, reactive execution, and limited career paths.

      These risks do not invalidate Checkmarx’s category position, but they do shape diligence priorities. Investors still
      need current audited revenue, renewal trends, exact ownership split, current board composition, and reconciled headcount
      and geography data. Because the company remains private, multiple public datapoints are dated or marketing-framed; the
      overview chapter should therefore be treated as a high-confidence identity and milestone record, but only a medium-
      confidence read on present financial scale.
    claimRefs: [CO012, CO020, CO024, CO041, CO042, CO043, CO044, CO045]
    tableRefs: []

