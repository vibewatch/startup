  - - DAST
    - Security testers + developers
    - Mature
    - CI/CD-native testing, tunneling, complex auth and API coverage
    - Need scan speed and auth reliability validation
  - - API Security
    - AppSec + platform teams
    - Growing strategic module
    - Shadow/zombie API discovery correlated with DAST
    - Need runtime depth versus API specialists
  - - IaC Security
    - Cloud / DevOps + AppSec
    - Mature growth module
    - Line-of-code findings plus policy-as-code
    - Need cloud-scale rule coverage test
  - - Container Security
    - Cloud / DevOps + AppSec
    - Growing strategic module
    - Dockerfile-to-runtime context and registry gates
    - Need runtime telemetry dependency review
  - - Fusion / ASPM / posture
    - Security leadership
    - Newer coordination layer
    - Cross-component prioritization and unified risk view
    - Need proof of noise reduction at scale
  notes: The platform spans more than a legacy AST stack, but maturity is not uniform across modules.
