companyProfile:
  summary: Checkmarx is a private application-security company founded in 2006 in Israel by Emmanuel Benzaquen and Maty Siman. Under Hellman & Friedman's ownership since 2020, it has expanded from a legacy code-scanning vendor into the Checkmarx One platform spanning SAST, DAST, SCA, API security, IaC, container security, posture management, and AI-assisted workflows. Public evidence supports meaningful enterprise customer adoption and contemporary unicorn-level valuation interest, but current financial quality and retention metrics remain largely private.
  foundedDate: '2006-01-01'
  founders:
  - name: Emmanuel Benzaquen
    role: Co-founder; former CEO; board member
    background: Longtime company leader who ran Checkmarx through its growth-equity period and 2020 PE sale before handing the CEO role to Sandeep Johri.
    claimRefs:
    - CO002
    - CO006
    - CO007
  - name: Maty Siman
    role: Co-founder & technical leader
    background: Technical co-founder associated with the platform's scanning-engine continuity and long-term product credibility.
