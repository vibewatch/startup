  - Net retention, gross retention, churn reasons, and top-account concentration.
  - Gross margin, services mix, cash, debt, and runway under PE ownership.
  - Win/loss data versus GitHub, GitLab, Snyk, Semgrep, Veracode, and Polaris.
  - Evidence that roadmap and support investment remain aligned with long-term value during any exit process.
