  headquarters: Atlanta, Georgia / Israel
  productSummary: Unified AppSec platform covering code, dependencies, APIs, infrastructure-as-code, containers, posture management, and AI-assisted remediation across developer and security workflows.
  customerFocus: Large enterprises, regulated software organizations, public-sector buyers, and channel / MSSP-delivered AppSec programs.
  businessModel: Enterprise application-security software sold through platform subscriptions, module expansion, services, and partner / MSSP channels with flexible enterprise packaging.
  stage: Private equity-owned private company
  fundingStatus: Raised about $100M pre-exit, then sold to Hellman & Friedman for $1.15B in 2020; 2024 reporting said H&F sought at least $2.5B in a sale process.
