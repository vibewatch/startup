  topStrengths:
  - Broad Checkmarx One platform spanning SAST, DAST, SCA, API, IaC, container, posture, and AI-era workflows.
  - Strong public enterprise-adoption evidence including 1,800+ customers and 865+ large-enterprise platform users.
  - Contemporary unicorn evidence from the 2024 reported sale process at a $2.5B+ target.
  - Meaningful customer proof across enterprise, MSSP, and public-sector use cases.
  - Sponsor-backed ownership and a coherent platform-expansion roadmap.
  topRisks:
  - Current total revenue, gross margin, NRR, and concentration remain undisclosed.
  - Native and lower-friction competitors can compress pricing power and expansion.
  - Platform breadth can become operational complexity if developer trust or scan performance slip.
  - Sale-process or sponsor-governance incentives could distort long-term product investment priorities.
  - Enterprise-heavy customer concentration could create renewal and macro sensitivity.
  unresolvedGaps:
