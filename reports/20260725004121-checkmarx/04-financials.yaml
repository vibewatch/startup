- id: public-gaps
  title: Public Financial Gaps and Underwriting Limits
  body: 'Public evidence is strong enough to outline monetization logic and prove meaningful commercial scale, but not strong enough to close a financial underwriting case. Missing metrics include total current revenue, revenue split between platform and legacy products, gross margin, services mix, burn, net retention, renewal rates, payback periods, cash, debt, and cap-table economics after years of PE ownership. Even ARR itself is only partly disclosed: the official $150M+ figure is for Checkmarx One specifically, not necessarily the whole company, while Calcalist’s “revenue doubled since 2020” statement gives direction but not exact current size.


    The right financial judgment is therefore moderate confidence in commercial scale and low confidence in full economics. Checkmarx is clearly more substantial than an early-stage startup, but the public record still forces too much inference around revenue quality and capital efficiency. Any investment recommendation using this report must preserve that distinction.'
