- id: scale-and-efficiency-proxies
  title: Scale Signals and Unit-Economics Proxies
  body: 'The strongest public scale signal is Checkmarx’s October 2025 claim that Checkmarx One passed $150M ARR in less than three years while protecting more than 865 of the world’s largest enterprises and delivering over 20% customer growth plus over 30% ARR growth year to date as of September 30, 2025. The strongest independent growth signal is Calcalist’s September 2024 reporting that revenue had doubled since the 2020 acquisition, albeit with a slight decline in 2023. Taken together, these sources imply a business that continued compounding under private-equity ownership even through a softer market year.


    Unit economics remain mostly undisclosed, so the chapter has to rely on operational proxies instead of true margin math. The Forrester TEI landing page cites 50-70% fewer false positives and 50% faster scans, while platform pages claim major MTTR and triage improvements. These are not substitutes for CAC, gross margin, or NRR, but they do matter because they point to product value drivers that could support renewal and expansion. The underwriting limitation is obvious: value proxies are not revenue quality. Investors still need customer cohort behavior, dollar retention, support burden, hosting costs, and services attach economics before treating these operating improvements as margin-proof.'
