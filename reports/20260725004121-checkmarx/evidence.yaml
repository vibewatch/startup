evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Current cap table showing exact H&F, TPG, Insight, founder, and employee ownership percentages.
    whyItMatters: Exit economics, rollover incentives, and sponsor control cannot be judged precisely without it.
    diligencePath: Request the latest capitalization table and shareholder agreement summary from management.
    relatedQuestionRefs:
      - QO012
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Audited 2024-2025 company revenue, ARR bridge, and renewal metrics rather than platform-only marketing datapoints.
    whyItMatters: Valuation and financial-quality analysis later in the report requires more than directional growth claims.
    diligencePath: Request audited financial statements, board materials, and cohort retention reporting.
    relatedQuestionRefs:
      - QO014
      - QO016
      - QO024
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A management-certified employee count as of the run date and geography split by function.
    whyItMatters: Public sources range across time and methodology, which affects operating-efficiency interpretation.
    diligencePath: Obtain an HR roster summary or employee census used in current board reporting.
    relatedQuestionRefs:
      - QO003
      - QO017
      - QO024
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A current official page that explicitly states whether the principal headquarters should be described as Atlanta,
      Tel Aviv, or dual-headquartered.
    whyItMatters: Later chapters and website metadata should not overstate a single-location narrative if leadership remains split.
    diligencePath: Confirm the registered headquarters and executive operating center with investor relations or legal.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: sam-model
    missingEvidence: A bottom-up model that isolates the enterprise accounts likely to consolidate multi-module AppSec tooling.
    whyItMatters: Top-down AST estimates do not translate cleanly into Checkmarx’s serviceable market.
    diligencePath: >-
      Build a bottom-up SAM using target account counts by regulated vertical, release complexity, and secure-SDLC
      maturity.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: conflicting-data
    severity: minor
    topic: tam-dispersion
    missingEvidence: A single analyst source with a stable AST taxonomy across SAST, DAST, SCA, API, and IaC.
    whyItMatters: Cross-source estimate dispersion can distort valuation assumptions if treated as a single truth.
    diligencePath: Obtain current Gartner or Forrester AST market definitions under license and align them to Checkmarx modules.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: private-evidence-only
    severity: minor
    topic: buyer-mix
    missingEvidence: Checkmarx revenue split by geography, buyer size, and regulated vertical.
    whyItMatters: >-
      The strongest public market thesis points to enterprise and regulated concentration, but public disclosures do not
      quantify the mix.
    diligencePath: Request internal segmentation, ACV, win-rate, and renewal data by vertical and customer size.
    relatedQuestionRefs:
      - QM008
      - QM012
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Current win/loss data by competitor, segment, and module mix.
    whyItMatters: Public product pages do not reveal which competitors actually displace Checkmarx in active deals.
    diligencePath: Request pipeline and closed-lost analysis segmented by direct suite, native platform, and point-tool competitors.
    relatedQuestionRefs:
      - QP018
      - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: Realized discounting, module attach, and sales-cycle data versus public packaging alternatives.
    whyItMatters: >-
      Transparent public list pricing from challengers can distort relative value perception if Checkmarx discounting is
      not understood.
    diligencePath: >-
      Request deal-desk data showing realized ACV, discount bands, and attach rates by customer size and competitor
      faced.
    relatedQuestionRefs:
      - QP014
      - QP015
      - QP016
  - type: missing-source
    severity: minor
    topic: technical-benchmark
    missingEvidence: Independent benchmark on detection accuracy, false positives, and time-to-value across major AppSec vendors.
    whyItMatters: Marketing pages support capability breadth but do not prove superior detection or developer workflow outcomes.
    diligencePath: Run a blinded proof-of-concept with representative codebases and standardized success metrics.
    relatedQuestionRefs:
      - QP012
      - QP013
      - QP023
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, NRR, renewal, CAC payback, and sales-efficiency metrics.
    whyItMatters: These metrics determine whether growth is durable and high quality or merely expensive.
    diligencePath: Request audited SaaS metrics deck and cohort tables by segment and module count.
    relatedQuestionRefs:
      - QI014
      - QI024
      - QI025
  - type: private-evidence-only
    severity: material
    topic: balance-sheet
    missingEvidence: Current cash, debt, covenants, and runway.
    whyItMatters: Sponsor ownership can hide both strength and leverage risk.
    diligencePath: Request latest balance sheet, debt agreements, and any sponsor recapitalization history.
    relatedQuestionRefs:
      - QI016
      - QI017
  - type: missing-source
    severity: minor
    topic: pricing-realization
    missingEvidence: Realized pricing by cohort and module, not just public anecdotes.
    whyItMatters: Anecdotal packaging clues do not show actual net price or discount discipline.
    diligencePath: Request deal-desk extracts covering ACV, discounting, module attach, and marketplace mix.
    relatedQuestionRefs:
      - QI020
      - QI021
  - type: missing-source
    severity: material
    topic: benchmarking
    missingEvidence: >-
      Independent benchmark data on detection quality, false positives, and scan-time performance across representative
      codebases.
    whyItMatters: Public product claims cannot prove superiority or even parity across real workloads.
    diligencePath: >-
      Run a controlled POC across core languages, APIs, IaC, and containerized apps with measured precision / recall and
      developer time metrics.
    relatedQuestionRefs:
      - QE021
      - QE023
      - QE025
  - type: private-evidence-only
    severity: material
    topic: usage-depth
    missingEvidence: Module-level usage, active users, and attach-rate data by customer cohort.
    whyItMatters: Feature breadth only creates value if customers actually deploy and expand across modules.
    diligencePath: Request telemetry or product-ops reporting on module activation, active usage, and renewal by module mix.
    relatedQuestionRefs:
      - QE022
      - QE024
      - QE025
  - type: missing-source
    severity: minor
    topic: federal-readiness
    missingEvidence: Final authorization status, scope boundaries, and production customer depth for federal-ready offerings.
    whyItMatters: Procurement-readiness signals are strong, but the exact operational depth remains partly indirect.
    diligencePath: Confirm FedRAMP scope, FIPS boundary, and public-sector customer production references.
    relatedQuestionRefs:
      - QE015
      - QE016
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Gross retention, NRR, churn by segment, and expansion by module mix.
    whyItMatters: Adoption breadth is not enough to prove a durable customer franchise.
    diligencePath: Request cohort tables segmented by customer size, industry, geography, and paid module count.
    relatedQuestionRefs:
      - QU015
      - QU024
      - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: ARR concentration by top 10 / 20 customers and by industry / geography.
    whyItMatters: Enterprise-heavy customer bases can mask renewal dependence and macro sensitivity.
    diligencePath: Request customer concentration, ACV distribution, and top-account renewal schedule.
    relatedQuestionRefs:
      - QU017
      - QU025
  - type: missing-source
    severity: minor
    topic: independent-roi
    missingEvidence: Independent ROI or production-maturity studies beyond company-hosted case materials.
    whyItMatters: Case studies prove real deployments but only partly validate economic outcomes.
    diligencePath: Interview references directly and request third-party customer-survey outputs.
    relatedQuestionRefs:
      - QU023
      - QU025
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-quality
    missingEvidence: Cohort retention, churn reasons, expansion by module mix, and top-account concentration.
    whyItMatters: These metrics determine whether the main thesis-break risks are real or overstated.
    diligencePath: Request cohort retention and top-customer concentration tables plus closed-lost analysis.
    relatedQuestionRefs:
      - QR011
      - QR021
      - QR025
  - type: private-evidence-only
    severity: material
    topic: roadmap-governance
    missingEvidence: >-
      Evidence that product investment and support capacity remain aligned with long-term platform quality during any
      exit process.
    whyItMatters: Governance overhang can hurt execution before it shows up in public results.
    diligencePath: Review board materials, R&D budget trend, and executive incentives tied to product health.
    relatedQuestionRefs:
      - QR010
      - QR025
  - type: missing-source
    severity: minor
    topic: independent-benchmark
    missingEvidence: >-
      Independent benchmark of false positives, scan speed, and module depth across representative customer
      environments.
    whyItMatters: Most operational-risk claims remain based on product positioning and anecdotal review evidence.
    diligencePath: >-
      Run a blinded proof-of-concept against GitHub, GitLab, Snyk, Semgrep, Veracode, and Polaris on a shared code
      sample.
    relatedQuestionRefs:
      - QR016
      - QR019
      - QR020
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: current-economics
    missingEvidence: Audited current total revenue / ARR, gross margin, and services mix.
    whyItMatters: These metrics determine whether the reported $2.5B+ target is stretched, fair, or conservative.
    diligencePath: Request current finance package with revenue bridge and margin split.
    relatedQuestionRefs:
      - QV013
      - QV015
      - QV027
    relatedTableRefs:
      - TV003
  - type: private-evidence-only
    severity: material
    topic: retention-concentration
    missingEvidence: NRR, logo retention, churn reasons, and top-account concentration.
    whyItMatters: Retention quality and concentration are the biggest multiple-support variables.
    diligencePath: Request cohort retention, top-customer concentration, and renewal schedule.
    relatedQuestionRefs:
      - QV022
      - QV024
      - QV028
  - type: private-evidence-only
    severity: material
    topic: governance-exit
    missingEvidence: Evidence that roadmap and support investment remain aligned with long-term value during sale planning.
    whyItMatters: Exit-process distortion can erode product quality and customer durability before it is visible publicly.
    diligencePath: Review board materials, budget trends, and incentive plans tied to product and customer outcomes.
    relatedQuestionRefs:
      - QV025
      - QV029
      - QV030
