- id: people-execution
  title: People, Governance, and Execution Risk
  body: 'People risk is not primarily founder-departure risk anymore; it is execution quality under sponsor ownership. Checkmarx has already managed a founder-to-operator CEO transition, but employee-review and layoff evidence suggests organizational strain around communication, management churn, and reactive execution. The 2022 reduction of roughly 10% of staff demonstrates willingness to cut costs, yet it also raises questions about morale, support capacity, and the ability to keep complex platform execution on track.


    The sale-process backdrop adds another layer. A company being prepared for sale can make rational short-term decisions that are not perfectly aligned with long-term platform investment. There is no public evidence that this has happened at Checkmarx, but it is a real governance risk to diligence. Investors should test whether roadmap choices, support capacity, and sales incentives are being optimized for durable growth or for near-term exit optics.'
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  tableRefs:
  - TR004
- id: thesis-breakers
  title: Customer, Financial, and Thesis-Break Risks
  body: 'The biggest thesis-break risk is that Checkmarx’s apparent breadth and scale hide weaker retention or lower pricing power than the public story suggests. The customer base appears enterprise-heavy and likely concentrated in larger accounts, but public sources do not show renewal behavior or ARR concentration. If module expansion is weaker than expected, or if GitHub, GitLab, Snyk, Semgrep, or other substitutes are capping willingness to pay, then the business could be less durable than its platform story implies.


    This chapter therefore treats concentration, pricing compression, and exit-process uncertainty as board-level risks. The business can likely survive ordinary competition. It is more vulnerable to a combined scenario in which commoditization, slower growth, and sale-process pressures reduce investment in product quality or customer success. The right mitigation is evidence, not optimism: cohort retention, win/loss data, and roadmap-governance visibility.'
