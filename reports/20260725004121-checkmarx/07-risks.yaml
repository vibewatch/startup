  title: The central risk is not lack of demand—it is proving differentiated value
  body: Regulation, AI-generated code, and supply-chain pressure all support the category. The danger is that Checkmarx cannot convert those tailwinds into durable pricing power and expansion because native and lower-friction alternatives keep narrowing the gap.
