  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-model
    missingEvidence: A bottom-up model that isolates the enterprise accounts likely to consolidate multi-module AppSec tooling.
    whyItMatters: Top-down AST estimates do not translate cleanly into Checkmarx’s serviceable market.
    diligencePath: Build a bottom-up SAM using target account counts by regulated vertical, release complexity, and secure-SDLC maturity.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: conflicting-data
    severity: minor
    topic: tam-dispersion
    missingEvidence: A single analyst source with a stable AST taxonomy across SAST, DAST, SCA, API, and IaC.
    whyItMatters: Cross-source estimate dispersion can distort valuation assumptions if treated as a single truth.
    diligencePath: Obtain current Gartner or Forrester AST market definitions under license and align them to Checkmarx modules.
    relatedQuestionRefs:
    - QM006
    - QM007
  - type: private-evidence-only
    severity: minor
    topic: buyer-mix
    missingEvidence: Checkmarx revenue split by geography, buyer size, and regulated vertical.
    whyItMatters: The strongest public market thesis points to enterprise and regulated concentration, but public disclosures do not quantify the mix.
    diligencePath: Request internal segmentation, ACV, win-rate, and renewal data by vertical and customer size.
    relatedQuestionRefs:
    - QM008
    - QM012
