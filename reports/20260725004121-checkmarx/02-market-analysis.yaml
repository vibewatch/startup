- id: market-sizing
  title: TAM, Segment Sizes, and Estimate Dispersion
  body: 'Absolute market sizing is noisy across public reports, but the spread itself is informative. Verified Market Reports states AST software revenue was about $5.6 billion in 2024 and could reach $14.2 billion by 2033. MarketsandMarkets projects the AST market to grow from $1.83 billion in 2025 to $7.6 billion by 2031, but its lower base likely reflects a narrower scope than Verified’s broader software framing. Separate DAST-specific research from Mordor Intelligence estimates DAST alone at $3.61 billion in 2025 and $4.18 billion in 2026, reaching $8.63 billion by 2031. Because Checkmarx sells across SAST, DAST, SCA, IaC, container, and posture-management workflows, any one of these sources understates or overstates parts of the opportunity; the right use is as lensing, not arithmetic summation.


    The practical takeaway is that Checkmarx does not need a perfectly agreed top-down TAM to support a large outcome. Even the lowest fetched estimate still implies a multibillion-dollar category with double-digit growth, while the DAST submarket alone is already large enough to justify Checkmarx’s expansion beyond SAST. Buyers increasingly want consolidated platforms, so module-level TAMs also reinforce platform economics: DAST growth, supply-chain mandates, API expansion, and cloud-native complexity all enlarge the share of budgets available to an integrated vendor. The report should therefore use a range-based market lens rather than a single-point TAM claim.'
  claimRefs:
  - CM007
