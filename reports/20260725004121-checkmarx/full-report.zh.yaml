      - number: '2.4'
        title: 增长驱动因素和时间节奏
        blocks:
          - type: paragraph
            body: >-
              在抓取到的市场和监管来源中，四类需求驱动因素反复出现。第一，AI 生成代码和自主开发工具正在提高每名工程师产出的软件量，进而增加缺陷数量，也增加自动化分诊和修复需求。第二，API
              和微服务增长扩大攻击面，静态源码审查独木难支，推动买家转向 DAST、API 安全和有关联分析的平台方案。第三，供应链和安全软件强制要求正在把安全从最佳实践变成采购要求。CISA 的
              secure-by-design 项目、NIST 的 SSDF 和 EU Cyber Resilience Act
              都推动软件生产者采用内建且可审计的安全控制。第四，云原生交付压缩发布周期，周期性或手工安全审查太慢。


              这些驱动因素时间特征不同。监管和采购驱动会拉长企业销售周期，但一旦采用，会提高留存和预算耐久度。开发者体验与 CI/CD 集成驱动会加快概念验证采用，因为买家能快速衡量摩擦下降。AI
              原生安全驱动更新、叙事成分更重，但 AI 编码工具改变缺陷速度和治理预期，正越来越影响董事会层面的紧迫感。Checkmarx
              近期变现逻辑最强的地方，是监管、云复杂度和供应链要求重叠处：大型企业、政府、金融服务和软件密集型全球组织。
            claimRefs:
              - CM022
              - CM023
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
