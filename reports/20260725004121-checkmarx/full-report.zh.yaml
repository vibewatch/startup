      - number: '1.5'
        title: 负面信号和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              正面的采用故事之外，也有不容忽视的负面证据。2022 年 11 月，Checkmarx 裁员约 100 人，约占员工总数 10%，理由是宏观压力和需要重新聚焦资源。Calcalist 后续出售流程报道称，公司在
              2024 年 9 月约有 900
              名员工，其中约一半在以色列；这意味着扩张节奏慢于最激进的网络安全增长叙事，也留下当前员工数的不确定性。员工评价平台给出更软但方向一致的警示：评价者持续称赞产品质量，但抱怨管理层变动、跨职能沟通弱、执行偏被动、职业路径有限。

              这些风险并不推翻 Checkmarx
              的品类位置，但会决定尽调优先级。投资人仍需要当前审计收入、续约趋势、精确所有权拆分、当前董事会构成，以及口径统一后的员工数和地域数据。公司仍是私有企业，多个公开数据点已经过时或带有营销框架；因此，概览章节可以被视为高置信度的身份和里程碑记录，但对当前财务规模只能给出中等置信度判断。
