      - number: '3.4'
        title: 功能宽度、打包方式和采购标准
        blocks:
          - type: paragraph
            body: >-
              功能对比重要，但打包方式往往比技术评估更早决定交易。Checkmarx、Veracode、Polaris、Fortify 和 Snyk 都定位为多模块 AppSec
              平台。真正差异在默认部署模式、采购模式、模块捆绑方式，以及开发者多快看见价值。Semgrep 公布简单的免费和团队定价。Snyk 公布清晰的免费、团队和企业路径。Sonar 宣传低门槛 Team 起点和自定义
              Enterprise 定价。GitLab 使用宽平台计划结构，高级安全功能位于 Ultimate。GitHub 的价值主张则离不开 GitHub 平台合同本身。相比之下，Checkmarx
              主要靠企业销售，而不是透明公开标价；这支持更大的咨询式交易，但也会在大客户之外提高买方不确定性。


              因此，采购标准至少分成六条轴：模块宽度、开发者体验、误报控制、部署灵活性、治理 / 报告深度和定价清晰度。Checkmarx
              在宽度和治理上评分较好，工作流集成也合理，但透明打包不够清晰。原生平台厂商在工作流便利性上占优；开发者优先挑战者在低摩擦采用上占优；传统既有厂商仍在规模和策略上可信。这让 Checkmarx
              处在可防守但承压的中间地带：复杂企业整合场景强，价格敏感或偏工作流原生的买家场景弱。
