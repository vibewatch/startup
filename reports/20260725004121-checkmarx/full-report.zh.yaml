      - number: '5.2'
        title: 模块宽度和工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 公开支持大型企业越来越期待的现代 AppSec 套件模块组合。SAST 和 SCA 仍是基础；DAST、API
              发现与测试、IaC、容器安全和供应链治理，则把覆盖面从代码延伸到云原生部署表面。API 安全强调发现影子 API 和僵尸 API，并与 DAST 关联。IaC 安全强调行级代码发现和策略即代码。容器安全从
              Dockerfiles 和镜像延伸到运行时语境；供应链安全如今还包括恶意包保护、仓库健康、SBOM 和 AI-BOM。合起来，这些材料支持一个判断：Checkmarx 是为销售平台整合而建，而不是销售单一扫描器。


              工作流集成与功能宽度同样重要。平台页面和开发者体验材料强调 IDE 集成、SCM 扫描、CI/CD 原生执行、Jira/Slack/Teams 反馈和直接面向开发者的修复。DAST
              主打快速上线、内置隧道，以及支持复杂认证和 2FA。这些工作流宣称在财务和技术上都很关键，因为 AppSec 产品常在安全团队购买、开发者不用时失败。公开材料显示 Checkmarx
              非常清楚这种失效模式，并已围绕降低它来设计产品。
