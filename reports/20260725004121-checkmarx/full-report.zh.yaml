  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 勾勒 Checkmarx 当前所有权、平台战略和执行风险轮廓的主要公开里程碑。
    data:
      items:
        - label: 在以色列创立
          date: '2006'
          detail: Emmanuel Benzaquen 和 Maty Siman 创立 Checkmarx，定位为面向开发者的 AppSec 厂商
          tone: positive
        - label: Insight 成长投资
          date: '2015'
          detail: Insight 投资 $85M 后，成为退出前最大股东
          tone: positive
        - label: H&F 收购交割
          date: 2020-04
          detail: Hellman & Friedman 以 $1.15B 收购 Checkmarx，TPG 作为少数股东参投
          tone: positive
        - label: 亚特兰大办公室启用
          date: '2021'
          detail: 美国销售、支持和客户成功职能整合到亚特兰大
          tone: positive
        - label: 全球合作伙伴计划与 GitLab KICS 集成
          date: '2021'
          detail: 渠道扩张和开源 IaC 分发扩大触达
          tone: positive
        - label: 创始人到职业经理人 CEO 交接
          date: 2023-02
          detail: Sandeep Johri 出任 CEO，Benzaquen 留任董事会
          tone: neutral
        - label: 裁员与 FedRAMP 推进
          date: 2022-11
          detail: 约 100 名员工被裁，同时 Checkmarx One 启动 FedRAMP 授权流程
          tone: adverse
        - label: 从代码到云扩展
          date: '2024'
          detail: ASPM、Cloud Insights 和高级容器安全加入运行时感知覆盖
          tone: positive
        - label: 出售流程启动
          date: 2024-09
          detail: 据报道 H&F 寻求至少 $2.5B，并称收入较 2020 年翻倍
