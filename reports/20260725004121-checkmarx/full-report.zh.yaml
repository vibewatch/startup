              Checkmarx 有清晰的扩张抓手。客户可以从 SAST 扩到 SCA、API、IaC、容器、态势和托管服务工作流；从安全团队使用扩到更广泛的开发者采用；也可以从企业直销扩到伙伴、MSSP
              和公共部门采购渠道。公开产品和客户材料强烈支持一个判断：初次切入后，平台宽度能增加钱包份额机会。不限应用数量的授权、云迁移或政策驱动采购推动更大范围上线时，这一点尤其明显。


              但集中度风险仍不透明。客户集看起来偏企业级，这有利于 ACV，却也可能带来续约依赖和更长销售周期。地域和垂直行业集中度只露出一部分。Apps Run the World
              给出了银行、专业服务和交通运输案例，但公开来源没有披露按行业划分的收入组合或 Logo 集中度。因此，在管理层拿出反证前，投资人应假定存在实质性大客户集中风险。
