      - number: '4.2'
        title: 定价、打包和合同信号
        blocks:
          - type: paragraph
            body: >-
              相比开发者优先挑战者，Checkmarx 的公开定价姿态明显不透明，这与企业主导销售动作一致。不过，抓取到的来源集合仍透露了有用的变现信号。PCL 明确表示 Checkmarx
              使用不限应用数量许可方式，帮助其在大型多应用环境中证明采用合理性。Airius 称 MSSP 合作伙伴计划使用可扩展的租赁定价模型，并有基于用量的折扣。一位 PeerSpot 评论者描述了模块化、基于消耗、类似
              repo 或 LOC、以及企业协议式许可路径，还提到类似 Azure Marketplace 的计费便利性。合起来看，这些数据点意味着 Checkmarx 优先优化大客户灵活性和广泛平台采用，而不是简单自助打包。


              这种灵活性在商业上可能很强，但也让承销更复杂。公开标价缺失，实际折扣未知；相较 Semgrep、Snyk、GitHub、GitLab 或
              Sonar，最大型企业之外的买家可能感到不确定或有摩擦。按尽调语言看，Checkmarx 的定价模型像高接触度企业软件模式，具备扩张和自定义打包空间，但也更需要测试净价实现、模块附加率和销售效率。
