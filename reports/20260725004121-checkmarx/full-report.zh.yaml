      - number: '4.4'
        title: 资本充足性、所有权背景和退出逻辑
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 并不像一家明显需要再融资的风险投资支持公司。2020 年 H&F 收购是一笔全现金 $1.15B 交易，TPG 和 Insight 保留少数权益；2024 年出售流程报道也显示，发起人正在按
              $2.5B+ 目标寻求流动性，而不是寻找新的外部融资。这不能证明资产负债表强健，但确实意味着公司可从所有权获得资本通道，战略重点也更偏向价值变现，而不是为生存融资。


              同时，公开来源几乎没有硬资产负债表数据。没有经验证现金数、债务排期、烧钱率，也没有披露现金续航指标。2022
              年裁员说明，在市场更艰难时期，管理层愿意削减成本；这可被解读为纪律，也可被解读为压力证据。因此，资本充足性无法直接用公开来源承销。最可支持的结论是，Checkmarx
              获得过发起人支持，并有足够商业耐久度去推进出售流程，但其近期现金流画像仍不透明。
