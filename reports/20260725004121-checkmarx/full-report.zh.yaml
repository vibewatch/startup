        title: 架构、运营模式和关键依赖
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 当前定位中最能透露技术实质的一点，是强调混合扫描和关联分析。平台页面描述确定性规则与 AI 推理结合，Fusion
              和态势管理材料则描述跨组件优先级排序，以及横跨应用资产的单一风险视图。这意味着其架构是多种分析器喂给策略与优先级层，而不是一个单体引擎。公司还强调与 GitHub、GitLab、Azure
              DevOps、Bitbucket、Jenkins、Maven、Jira、Slack、Teams、Sysdig、Wiz、AWS 和 Zimperium 集成，说明平台依赖广泛的合作伙伴和生态界面来交付语境。


              这个依赖面既是优势也是风险。它增强产品，因为买家不用替换既有工具链也能采用 Checkmarx。它也制造风险，因为价值取决于第三方系统、云提供商和运行时语境合作伙伴的数据质量与连续性。公开来源显示
              Checkmarx 理解这一点，因此强调关联、策略和集中可见性；但真正的尽调问题是韧性：如果集成不完整、延迟或中断，还剩多少价值？
