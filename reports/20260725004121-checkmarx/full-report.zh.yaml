  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品是什么、交付什么价值
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 的产品已明显从源码扫描引擎演进为广泛的应用安全平台。当前 Checkmarx One 定位覆盖代码、依赖、API、基础设施即代码、容器、运行时语境，以及从第一行代码到生产环境的 AI
              引入风险。这很关键：产品不应被理解为单一工具，而是一个编排层，把多种扫描引擎、风险信号和治理界面合成企业团队的一个 AppSec 操作系统。


              面向客户的价值主张在较新材料中也保持一致：高保真检测、AI 辅助、统一风险智能，以及降低开发者摩擦。产品页面反复把 Checkmarx 定位为保护整个开发生命周期、跨工具关联发现结果，并在
              IDE、PR、CI/CD 系统和工单工作流中触达开发者。这是很强的架构承诺，但也正是核心尽调测试。只有当统一平台能相较单点工具加手工治理显著降低噪声和分诊负担时，产品才创造差异化价值。
            claimRefs:
