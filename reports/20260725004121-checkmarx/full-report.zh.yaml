      - number: '2.2'
        title: TAM、细分规模和估算分歧
        blocks:
          - type: paragraph
            body: >-
              公开报告里的绝对市场规模噪声很大，但分歧本身有信息量。Verified Market Reports 称，AST 软件收入在 2024 年约 $5.6 billion，到 2033 年可能达到 $14.2
              billion。MarketsandMarkets 预计 AST 市场将从 2025 年 $1.83 billion 增至 2031 年 $7.6 billion，但其较低基数可能反映了比 Verified
              更窄的口径。Mordor Intelligence 的独立 DAST 研究估计，仅 DAST 在 2025 年就是 $3.61 billion，2026 年为 $4.18 billion，到 2031 年达到
              $8.63 billion。Checkmarx 横跨 SAST、DAST、SCA、IaC、容器和态势管理工作流，任何单一来源都会低估或高估部分机会；正确用法是作为透镜，而不是做算术相加。


              实操结论是，Checkmarx 不需要一个完全一致的自上而下 TAM，才能支撑大结果。即便取抓取到的最低估算，品类仍是数十亿美元规模并保持双位数增长；仅 DAST 子市场也已足够大，能解释 Checkmarx
              为何从 SAST 向外扩张。买家越来越想要整合平台，模块级 TAM 也进一步强化平台经济性：DAST 增长、供应链强制要求、API
              扩张和云原生复杂度，都会扩大集成厂商可争取的预算份额。因此，报告应采用区间式市场视角，而不是单点 TAM 断言。
