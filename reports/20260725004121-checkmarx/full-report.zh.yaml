      - number: '8.2'
        title: 估值锚与可比先例信号
        blocks:
          - type: paragraph
            body: >-
              最清晰的硬锚，是 Hellman & Friedman 在 2020 年 4 月以 $1.15B 全现金收购 Checkmarx，TPG 和 Insight 作为少数股东参与。最清晰的近期锚点，是 2024
              年据报道启动出售进程，目标至少 $2.5B。仅这两个点就说明，在 PE 持有期间，即便尚不知道当前精确指标，价值也已大幅创造。2025 年官方 Checkmarx One 发布又提供了一个锚：披露 $150M+
              ARR 和 865 家大型企业客户；Calcalist 称，尽管 2023 年有下滑，收入自 2020 年以来已经翻倍。


              可比先例也支持后期 AppSec 价值创造，但必须带上重要限定。Snyk 的估值路径——从 2021 年的 $8.5B 到 2022 年的 $7.4B，同时到 2024 年底仍达到 $300M
              ARR——既展示了品类上行空间，也展示了倍数压缩风险。Veracode 2018 年以 $950M 出售，说明规模化 AppSec 资产即使没有 AI 时代新平台附带的叙事溢价，也能拿到战略或 PE
              价值。合在一起，这些先例支持 Checkmarx 可能值数十亿美元的判断，但不能证明每一个被报道的出售目标都合理。
            claimRefs:
              - CV009
