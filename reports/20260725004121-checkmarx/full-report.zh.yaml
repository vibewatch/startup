      - number: '4.3'
        title: 规模信号和单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              最强公开规模信号，是 Checkmarx 于 2025 年 10 月宣称 Checkmarx One 在不到三年内突破 $150M ARR，保护全球 865 家以上最大企业；截至 2025 年 9 月 30
              日，客户数年初至今增长超过 20%，ARR 增长超过 30%。最强独立增长信号，是 Calcalist 2024 年 9 月报道收入自 2020 年收购以来翻倍，尽管 2023
              年略有下滑。合并看，这些来源暗示公司在私募股权持有期间持续复合增长，即使经历了较弱的市场年份。


              单位经济大多仍未披露，因此本章必须依赖运营代理指标，而不是真正的利润率计算。Forrester TEI 着陆页提到误报减少 50-70%、扫描加快 50%，平台页面也宣称 MTTR 和分诊显著改善。这些不能替代
              CAC、毛利率或
              NRR，但它们确实重要，因为指向可支撑续约和扩张的产品价值驱动因素。承销限制也很明显：价值代理不等于收入质量。投资人仍需客户分群行为、美元留存、支持负担、托管成本和服务附加经济性，才能把这些运营改善视为利润率证据。
