      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              主导买方画像，是需要开发团队更快发版、同时又不能无限积累修复债务的企业和受监管软件组织。Mordor 称，2025 年大型企业占 DAST 市场收入的 59.2%，云交付占 73.5%
              份额，进一步说明重心在成熟软件组织：它们频繁发布，运行云原生环境。Checkmarx 自身客户材料和 DXC
              合作新闻稿也指向同一方向：平台面向复杂企业、公共部门机构和全球组织，它们需要应用安全策略、迁移、查询调优、策略执行和广泛 SDLC 集成。


              用户和付款方至少分成四类角色。开发者和 DevOps 团队是日常用户，因为 AppSec 控制必须出现在 IDE、SCM、PR 和 CI/CD 路径里。AppSec
              负责人或产品安全团队负责项目运营和治理。CISO 与合规负责人常是高层付款方，因为产品也可作为安全开发要求的策略证据。采购和平台工程职能在部署整合多个既有工具支出时也很重要。Semgrep、Snyk、GitLab
              和 GitHub 的自助与团队定价说明，较小组织可以从开发者主导或仓库主导的采用切入；但 Checkmarx 最强适配仍在高端细分市场，那里需要工作流宽度、运行时语境和统一报告来支撑更偏咨询式的企业销售。
