  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向论点
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 的正面估值逻辑很直接。公司所在的 AppSec 市场很大且仍在扩张，产品宽度可信，覆盖从代码到云的工作流，服务有意义的企业客户基础，并通过 Checkmarx One
              平台拿出了大规模经常性收入的最新证据。公司的财务投资方和治理画像也更像机构级软件资产，而不是仍带风投阶段不确定性的公司。简言之：规模化市场、规模化产品、规模化客户，以及正在发生的 $1B 以上私募市场估值讨论。


              反逻辑同样重要。公开来源没有展示当前总收入、毛利率、NRR、流失率或集中度。来自 GitHub、GitLab、Snyk、Semgrep 和其他替代方案的竞争压力，可能削弱定价权。广泛的 AppSec 套件在
              RFP 中看起来有价值，但如果开发者不信任工作流，留存仍可能令人失望。这些不确定性不会抹掉公司的价值，但会实质削弱对任何精确估值判断的信心。
            claimRefs:
              - CV001
              - CV002
