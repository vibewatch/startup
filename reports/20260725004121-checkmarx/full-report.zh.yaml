      - number: '1.3'
        title: 所有权、资本历史和运营里程碑
        blocks:
          - type: paragraph
            body: >-
              在后期网络安全厂商中，Checkmarx 有些特殊：公开来源同时呈现了规模不大的退出前 VC 历史和一笔大型私募股权控股交易。2020 年出售前，Calcalist 报道公司只融资约 $100
              million，其中 Insight Partners 于 2015 年投资 $85 million，并成为最大股东。随后 Hellman & Friedman 以全现金交易收购 Checkmarx，估值
              $1.15 billion；TPG 持有少数股权，Insight 保留少数权益。该交易当时被称为迄今最大应用安全收购案，说明 Checkmarx 尽管融资历史较小，战略重要性仍高。

              收购后最重要的公开里程碑，是 2024 年 9 月 Calcalist 报道 Hellman & Friedman 已启动出售流程，目标估值至少 $2.5 billion。该报道还称收入自收购以来翻倍，尽管
              2023 年略有下滑。它是本报告最强的公开独角兽证据，因为发布时间晚于 2024 年 7 月，且明确把估值目标指向一场正在推进的出售流程。2021 年以来的运营里程碑包括全球合作伙伴计划推出、面向开源 IaC
              扫描的 GitLab 集成、Checkmarx One 的 FedRAMP 工作、云原生平台发布、具备运行时感知的容器安全，以及更宽的代码到云态势管理功能。
