              团队和公共部门买方；这些客户不仅要漏洞检测，也要能证明政策执行。Apps Run the World 跟踪到的用户是 Truist Bank、PCL Construction、Cebu Air
              等大型组织；公开客户案例强调几十名开发者、数百万行代码，以及合规负担重或云现代化场景。


              买方、用户和付款人因此被拆开。开发者和 DevOps 团队每天用产品，因为产品嵌在 IDE、流水线和工单流里。AppSec 团队负责安全项目。CISO
              和合规负责人常常是高管层付款方，因为平台支撑安全开发要求。渠道和 MSSP 也重要：Airius 说明 Checkmarx
              可以被转售，也能嵌入托管服务。这种分层有吸引力，因为一笔交易里能站出来支持的人更多；但要向所有角色证明价值，难度也更高。
