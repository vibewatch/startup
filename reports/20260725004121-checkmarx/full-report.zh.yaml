      - number: '7.5'
        title: 客户、财务与投资逻辑破裂风险
        blocks:
          - type: paragraph
            body: >-
              最大的投资逻辑破裂风险在于，Checkmarx 表面上的宽度和规模，可能掩盖了比公开叙事更弱的留存或更低的定价权。客户基础看起来偏企业级，且很可能集中在大客户，但公开来源没有展示续约行为或 ARR
              集中度。如果模块扩张弱于预期，或 GitHub、GitLab、Snyk、Semgrep 及其他替代品压住支付意愿，那么这门生意可能没有平台故事暗示的那么耐久。


              因此，本章把集中度、定价压缩和退出进程不确定性视为董事会层面风险。业务大概率能扛住常规竞争。它更脆弱的场景，是商品化、增长放慢和出售压力叠加，进而削弱对产品质量或客户成功的投入。正确的缓释手段不是乐观，而是证据：cohort
              留存、赢单 / 输单数据和路线图治理可见度。
