      - number: '2.5'
        title: 采用约束和可能拖慢市场的因素
        blocks:
          - type: paragraph
            body: >-
              支撑市场增长的同一批来源，也指出了真实采用摩擦。MarketsandMarkets 点名碎片化多工具环境、企业级许可成本高和误报噪声等持续挑战。Verified
              提到成本、基础设施负担和对流程变化的文化阻力。Mordor 标记信噪比疲劳、AppSec 人才短缺、运行时或业务逻辑覆盖有限等重要约束。这些不是 Checkmarx 面对的抽象问题：正是这些失效模式，让
              GitHub、GitLab、Semgrep，或打包的云与平台工具，即使在宽 AppSec 套件存在时，也能靠简单性和价格赢单。


              因此，市场章节应把增长视为强劲但不无摩擦。自上而下预测默认企业能把安全开发项目落地，消化平台变化，并理顺重叠扫描器。现实中，受约束买家可能标准化到够用的原生工具，推迟全面整合，或只购买部分模块。这就是为什么买方分层和竞争性打包与
              TAM 一样重要。正确的尽调问题不只是 AST 是否增长，而是 Checkmarx 能否把增长转化为高效、高留存的企业合同，同时不被困在价格压缩或评估复杂度里。
            claimRefs:
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
