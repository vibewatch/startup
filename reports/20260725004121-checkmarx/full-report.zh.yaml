  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和收入来源
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 似乎主要围绕 Checkmarx One 平台靠企业软件订阅变现，另有附加模块、托管服务、合作伙伴渠道和培训类产品贡献收入。公开产品页面显示，一个多模块平台覆盖
              SAST、DAST、SCA、API 安全、IaC、容器安全和态势管理能力，这意味着既有初始落地后扩张的潜力，也留下较大的附加率问题。客户和合作伙伴材料显示，合同形态不止一种僵硬定价模型：PCL
              提到不限应用数量许可，Airius 则描述 MSSP 可用的租赁模型和基于用量的折扣。这些都符合面向大型企业账户、转售商和服务提供商的商业模式，而非商品化的纯按席位计价。


              主要财务含义是，Checkmarx
              可能把经常性平台收入与实施、赋能层叠加，用来支撑采用和扩张。如果软件毛利率仍高、服务是战略附着而非主导收入，这会很有吸引力。它也意味着收入质量取决于模块组合、合同期限、续约率，以及多少收入通过渠道或类似应用市场的采购方式打包。公开来源没有披露精确组合，因此收入模式章节可以说明
              Checkmarx 如何收费，但还不能判断各收入流的相对利润质量。
