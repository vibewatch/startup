      - number: '8.4'
        title: 建议、信心与决策含义
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，建议是继续研究，而不是简单的是或否。正面逻辑太强，不能忽视：大市场、宽产品、真实客户、仍在发生的独角兽证据。但承销缺口也太重要，不能无视。缺少当前总收入、留存、利润率、集中度，以及出售进程中的治理细节时，任何精确估值立场都应视为暂定。


              信心为中等，因为故事方向可信，但精确经济性不清楚。风险评级为高，因为未解决问题集中在最影响估值耐久性的变量上。因此，估值立场最适合描述为偏紧：$2.5B+ 目标并非不可置信，但相对当前公开证据负担，看起来偏贵。
