      - number: '7.4'
        title: 人员、治理与执行风险
        blocks:
          - type: paragraph
            body: >-
              人员风险的核心不再是创始人离开，而是财务投资方控股下的执行质量。Checkmarx 已经完成从创始人到职业经理人 CEO 的交接，但员工评价和裁员证据显示，组织在沟通、管理层流动和被动执行上承压。2022
              年裁掉约 10% 员工，说明公司愿意削成本；但这也引出士气、支持能力，以及复杂平台执行能否按轨道推进的问题。


              出售进程背景又加了一层风险。准备出售的公司可能做出理性的短期决策，但这些决策未必与长期平台投资完全一致。没有公开证据显示 Checkmarx
              已经这样做，但这是真实的治理尽调风险。投资人应测试路线图选择、支持能力和销售激励，究竟是在为耐久增长优化，还是在为短期退出观感优化。
