  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和纳入支出
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 所在市场，最好定义为企业应用安全测试（AST）：用于在自有代码、开源依赖、API、基础设施即代码、容器和相邻软件交付资产中发现、排序并修复漏洞的软件和服务。MarketsandMarkets
              对 AST 的定义足够宽，涵盖跨应用、部署模式、组织规模和垂直行业的 SAST、DAST、IAST、RASP 和 SCA。Verified Market Reports 使用类似宽口径的 AST
              软件框架，并明确排除以硬件为中心、网络边界和端点工具，因为这些工具不评估应用代码或逻辑。这个排除项很关键，它把边界锚定在软件开发生命周期，而不是泛网络安全预算。


              Checkmarx 真正能争取的支出，并不是每一美元网络安全预算。公司争夺的是开发工具、AppSec、云安全和合规项目之间的预算。因此，纳入支出包括代码扫描、依赖与软件供应链分析、API 与运行时感知测试、IaC
              与容器扫描、与修复相连的开发者教育，以及跨工具串联发现结果的态势管理层。排除或只部分相邻的支出包括传统 WAF、端点检测、IAM、网络防火墙、通用 SIEM，以及没有嵌入 AST
              工作流的外包渗透测试。这个更窄边界才适合后续竞品和估值工作，因为买家实际比较的是 Checkmarx 与 GitHub Advanced Security、GitLab
              Secure、Polaris、Snyk、Semgrep，而不是整个网络安全栈。
