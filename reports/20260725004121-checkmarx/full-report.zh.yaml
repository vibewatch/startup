        title: 公开财务缺口和承销边界
        blocks:
          - type: paragraph
            body: >-
              公开证据足够勾勒变现逻辑，并证明有意义的商业规模，但不足以闭合财务承销案例。缺失指标包括当前总收入、平台与传统产品收入拆分、毛利率、服务组合、烧钱、净留存、续约率、回本周期、现金、债务，以及多年 PE
              持有后的股权结构经济性。即便 ARR 本身也只披露了一部分：官方 $150M+ 数字专指 Checkmarx One，不一定代表全公司；Calcalist 的“收入自 2020
              年以来翻倍”给出方向，却没有给出当前精确规模。


              因此，正确财务判断是：对商业规模给出中等置信度，对完整经济性给出低置信度。Checkmarx
              显然比早期创业公司更有实质，但公开记录仍迫使外部分析者对收入质量和资本效率做太多推断。任何使用本报告的投资建议，都必须保留这个区别。
