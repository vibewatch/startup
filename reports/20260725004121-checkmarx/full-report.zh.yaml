        title: 路线图、成熟度和产品风险
        blocks:
          - type: paragraph
            body: >-
              公开发布中可见的路线图弧线是连贯的。Checkmarx 逐步加入 IaC 扫描、GitLab KICS 分发、FedRAMP 准备、态势管理和云洞察、高级容器安全、Fusion 跨组件优先级排序，以及以 AI
              和开发者体验为中心的 3.0 平台版本。这一顺序显示，公司有意识地从核心代码扫描走向代码到云关联和 AI 时代 AppSec 编排。它不像一包随机收购功能。


              即便如此，产品仍有真实技术风险。宽度会带来运营复杂度。AppSec 套件常被扫描时间、上线摩擦、误报和对优先级逻辑的信任卡住。PeerSpot 反馈特别指出，需要更丰富的 AI
              指引、更透明的关联逻辑、超大型代码库上的更快扫描，以及对新框架的更深支持。这些风险可管理，但正是应该测试的风险，因为它们直接决定 Checkmarx 的平台叙事能否转化为持续开发者采用和多模块扩张。
