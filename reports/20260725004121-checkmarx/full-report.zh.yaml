        - 时间较早，发生在平台加速前
      - - Checkmarx 2024 年出售流程
        - 目标估值 >= $2.5B
        - 当前私人市场传闻 / 流程锚点
        - 最强的当代独角兽证据
        - 并非已完成交易
      - - Snyk 2021 年融资
        - $8.5B 估值
        - 周期高点的开发者安全可比对象
        - 显示品类溢价潜力
        - 发生在更宽松的 2021 年市场
      - - Snyk 2022 年融资
        - $7.4B 估值
        - 已压缩但仍属高溢价可比对象
        - 显示同一品类内倍数重置风险
        - 业务组合仍不可直接对比
      - - Snyk 2024 年 ARR 信号
        - $300M ARR
        - 高溢价网络安全平台的规模参照
        - 帮助判断更高 ARR 能支撑什么估值
        - 产品组合和公开叙事不同
      - - Veracode 2018 年出售
        - $950M 交易价值
        - AppSec 并购先例
        - 显示规模化 AST 资产的战略价值
        - 交易较早，市场环境不同
    notes: 可比信号应当给讨论划边界，而不是取代对 Checkmarx 本身的直接投资测算。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
    enumerationScope:
      coverage: sample
      basis: >-
        The table covers the most relevant public valuation anchors and AppSec precedent signals available in the
        fetched source set, not every possible comparable.
  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - $150M+ 平台 ARR 扩大为强劲的公司总 ARR，高留存、强模块扩展和有纪律的执行同步成立
        - '>$2.5B 变得可支撑，甚至偏保守'
        - 需要顶级留存和护城河证明
        - 从公开数据看可能成立，但尚未证实
      - - 基准
        - 已具规模的私有平台，有真实客户，但公开经济性不完整，定价压力中等
        - ~$2.0B-$2.5B 的方向性价值区间
        - 留存和利润率仍可能低于预期
        - 最符合当前证据
      - - 悲观
        - 定价压缩、客户集中或留存疲弱，削弱平台经济性
        - <$2.0B，或高溢价出售失败
        - 叙事跑在经济质量前面
        - 没有客户批次数据前不能排除
    notes: 区间只是方向性情景锚点，不是建模后的企业价值。
    claimRefs:
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
  - id: TV005
    title: 投资论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 留存数据疲弱
        - NRR / 续约弱于高溢价软件预期
        - 削弱高溢价倍数支撑
        - 除非价格重置，否则从继续研究转向否决
      - - 公司总收入相对出售目标偏低
        - 平台 ARR 无法顺畅桥接到公司规模
        - 让 $2.5B+ 显得偏高
        - 要求修正估值立场
      - - 高集中度
        - 头部客户或垂直行业敞口过高
        - 放大续约和宏观风险
        - 下调倍数，收紧下行情景
      - - POC 中的产品信任问题
        - 误报、速度或上线体验不及预期
        - 削弱护城河和扩展逻辑
        - 重估产品驱动的上行空间
      - - 退出流程扭曲
        - 出售时点损害路线图或支持质量
        - 抬高治理风险
        - 大幅降低信心
    notes: 这些是当前公开估值叙事最快破裂的路径。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前总 ARR / 收入
        - 经审计的当前收入桥接
        - 任何估值倍数都需要这个基础
        - 管理层 + 财务尽调
      - - 留存质量
        - NRR、logo 留存、流失、按模块扩展
        - 决定高溢价估值的耐久度
        - 客户分析复核
      - - 毛利率和服务组合
        - 软件与服务经济性
        - 决定软件质量和可扩展性
        - 财务和 GTM 复核
      - - 集中度
        - 头部客户 / 垂直行业 / 地域组合
        - 决定大型企业客户账本中的下行风险
        - RevOps 和 FP&A 复核
      - - 输赢单和定价权
        - 失单模式、折扣和原生平台压力
        - 决定护城河和估值倍数支撑
        - 销售 / 交易审批复核
      - - 退出期间的路线图治理
        - 研发投入、支持能力、激励一致性
        - 判断短期流程是否扭曲长期价值
        - 董事会 / 管理层尽调
    notes: 如果这些问题得到充分回答，公开投资论点才能升级成真正的投资测算案例。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
