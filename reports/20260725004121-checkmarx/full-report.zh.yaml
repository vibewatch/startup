chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立和地理布局
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 于 2006 年由 Emmanuel Benzaquen 和 Maty Siman 在以色列创立，品牌建立在自动化应用安全测试上，直接嵌入开发者工作流。公司早期主要围绕 Tel Aviv /
              Ramat Gan 运营；后来大型企业 AppSec 采购逐渐靠近安全负责人、受监管行业和云原生工程团队，公司随即在美国和欧洲快速扩张。Checkmarx 当前运营身份越来越偏向美国：公司正式开设 Atlanta
              办公室，承载美国销售、客户成功和技术支持；2023 年 2 月 CEO 交接新闻稿也同时从 Atlanta 和 Ramat Gan 发布，显示双中心领导格局。因此，公开足迹支持用户给出的 Atlanta
              加以色列叙事，而不是单一总部故事。

              产品身份也从单点 SAST 工具厂商转向更宽的 AppSec 平台公司。Checkmarx 如今把自己描述为面向 AI 时代的应用安全平台，用 Checkmarx One
              品牌保护代码、API、基础设施即代码、容器和供应链组件。这个定位很关键，后续市场、产品和估值章节应把 Checkmarx 视为多模块 AST 平台，而不只是传统 SAST
              厂商。公开材料一贯强调贴近开发者的部署、代码到云可见性和 AI 辅助修复，这是公司当前叙事主线。
