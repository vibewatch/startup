      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 依赖庞大的平台、云和采购渠道生态。与 GitHub、GitLab、Azure DevOps、Jira、Slack、Teams、Sysdig、Wiz、AWS 等集成能提升价值；但如果供应商改
              API、打包重叠功能，或用自家平台挤掉独立 AppSec 工具，也会带来依赖风险。GitHub 和 GitLab 尤其关键，因为它们既是集成点，也是竞争替代品。渠道和 MSSP
              伙伴扩大触达，却也可能稀释利润率，并削弱对客户体验的直接控制。


              公共部门项目是另一层依赖面。NASA SEWP、FIPS 和 FedRAMP
              工作创造准入和信任，也会拉长资质周期，并让公司依赖不断变化的政府采购和合规流程。这类依赖对企业软件并不罕见。风险在于，它们有多少同时压在同一个产品论点上：如果工作流原生平台、运行时上下文伙伴或公共部门门槛转向不利，Checkmarx
              的差异化会迅速收窄。
