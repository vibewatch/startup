            body: >-
              最终尽调问题很清楚。投资人需要 cohort 留存、当前 ARR 或收入、毛利率、客户集中度、模块附加率、赢单 / 输单数据，并需要证明产品投资没有被退出规划扭曲。投资人还需要更明确的桥接关系，把 $150M+
              Checkmarx One ARR 披露连接到公司整体经济性。


              如果这些问题的答案走错方向，投资逻辑会很快破裂。收入数字温和，只要留存和利润率出色，仍可支撑强结果。收入数字很大，但若定价正在塌陷或集中度极端，仍可能令人失望。仅靠公开证据无法解决这种张力，因此本报告停在继续研究，而不是给出确信买入式建议。
