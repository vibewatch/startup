      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              公司的领导层演进，是创始人延续性与制度化职业管理搭在一起。联合创始人 Emmanuel Benzaquen 带领 Checkmarx 完成早期产品建设、Insight Partners 旗下的增长股权阶段，以及
              2020 年出售给 Hellman & Friedman 和 TPG 的交易。2023 年 2 月，Checkmarx 任命 Sandeep Johri 为 CEO，Benzaquen
              留任董事会；这是创始人主导扩张转向私募股权运营纪律的最清晰交接。Johri 曾任职 Tricentis、HP 和早期安全创业公司，说明董事会要的不只是守成管理，而是有企业软件扩张、云转型和品类再定位经验的负责人。

              治理仍与所有者和创始人紧密绑定。官方领导层页面仍把 Benzaquen 和 Maty Siman 列为创始人角色，Hellman & Friedman、TPG 和 Insight 也出现在更宽的董事会 /
              顾问界面上。Hellman & Friedman 的 Tarim Wasim 公开背书 Johri
              为下一阶段领导者，这对尽调重要：它显示发起人仍主动介入，而不是纯财务持有。此类治理模式有利于纪律化执行，但也意味着未来出售或资本重组很可能由发起人强力主导。相较许多创始人主导的创业公司，关键人风险更低，因为公司已验证从创始人到职业经理人的交接；但产品和客户连续性仍很大程度依赖
              Johri，以及创始人在董事会持续发挥影响力。
