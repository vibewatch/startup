      - number: '7.2'
        title: 运营、产品与质量风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的运营风险在于，Checkmarx 的产品宽度先变复杂，还没变成优势。AppSec 平台赢在减少误报、加快修复，并自然嵌入开发者工作流；输在扫描慢、优先级排序不透明，或上线需要太多调优。PeerSpot
              反馈明确提出几项需求：更透明的关联、更强的 API 深度、更深的语言和框架支持，以及在超大型代码库上更快的 SAST 扫描。这些不是生死缺陷，但正是会侵蚀统一平台信任的问题。


              公司的产品野心放大了这种风险。Checkmarx
              试图统一代码、供应链、API、IaC、容器和态势智能。卖出的模块越多，客户越期待一套连贯体验。也就是说，执行风险不只在于每个模块是否能用，还在于组合产品能否真正降低运营负担。风险清单应把开发者采用、信号质量和规模化性能列为第一梯队运营问题。
            claimRefs:
              - CR008
              - CR009
