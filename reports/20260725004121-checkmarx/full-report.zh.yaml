      - number: '1.4'
        title: 平台范围、客户基础和采用证据
        blocks:
          - type: paragraph
            body: >-
              公开客户证据支持一个判断：Checkmarx 是面向企业的平台，而不是小团队开发者工具。官方材料反复提到全球 1,800+ 客户，渗透率说法从接近 Fortune 50 的一半到 Fortune 100 的
              40% 不等，取决于年份和来源语境。2025 年增长新闻稿把叙事收紧到 Checkmarx One 平台本身，称其保护全球 865 家以上最大企业，并在不到三年内突破 $150 million
              ARR。即便考虑厂商营销偏差，方向很清楚：Checkmarx 具备真实的大型企业部署深度。

              客户验证也体现在实施细节中，而不只是 logo 墙。PCL Construction 报告称 Checkmarx One 约四小时完成上线，每周扫描 21 个以上应用的 4.4 million
              行代码，并看重平台不限应用数量的许可方式。Airius 在 MSSP 项目中描述了有竞争力的定价、部署灵活性和租赁 / 按增长付费模式。Cdiscount 用 Checkmarx 的评估方法提高 AppSec
              项目成熟度和 ROI 信心。Apps Run the World 与 FeaturedCustomers 提供了企业参考深度的第三方支持，Calcalist 还点名
              Dell、Adidas、Ford、Visa、Siemens 和 Salesforce 等可识别客户。
