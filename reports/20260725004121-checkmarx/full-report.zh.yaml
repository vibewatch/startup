      - number: '8.3'
        title: 乐观、基准与悲观情景逻辑
        blocks:
          - type: paragraph
            body: >-
              由于公开披露不完整，本报告更适合用情景推理，而不是给出单点 DCF 或可比公司输出。乐观情景下，Checkmarx 把平台宽度转化为强留存、有意义的模块扩张和持续企业采用，让 $2.5B+
              结果显得合理，甚至保守。基准情景下，公司仍是可信的规模化私营网络安全资产，但公开证据在经济性上仍太薄，无法完全支撑溢价倍数，因此价值区间应更谨慎，落在 2024
              年目标附近或略低。悲观情景下，定价压力、集中度风险或弱于预期的留存，会让公开出售目标相对实际收入质量显得激进。


              这套情景逻辑不是悲观，而是对缺失数据的恰当处理。业务显然比早期创业公司更扎实，但“可信的规模化平台”和“可以轻松按溢价投资”之间的缺口，正是投资人最容易失去纪律的地方。
