  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              应用安全厂商受益于监管收紧，但也会承接新的责任和合规预期。EU Cyber Resilience Act、NIS2、NIST SSDF、SEC 网络披露规则和 CISA secure-by-design
              指引，都在加重软件生产方和企业买方的负担：他们必须拿出安全开发、漏洞处理和供应链控制的证据。对 Checkmarx
              而言，这部分是顺风，因为平台能帮助客户应对这些需求；同时也是风险，因为客户会要求供应商本身满足高标准的信任、披露和支持要求，并跟上不断变化的控制框架。


              核心监管风险不是某个迫在眉睫的执法行动，而是在审视升温下能否执行到位。如果客户越来越把 AppSec
              工具当作支撑合规的基础设施来买，产品缺口、路线图响应慢或漏洞优先级排序弱，就会在采购和续约中变得更要命。抓取来源集没有显示重大未了法律争议，但软件供应商的举证压力显然在上升。
            claimRefs:
              - CR001
              - CR002
