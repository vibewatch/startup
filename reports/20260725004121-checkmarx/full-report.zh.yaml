  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图和买方选择集
        blocks:
          - type: paragraph
            body: >-
              Checkmarx 已不再只和传统 SAST 厂商竞争。买方选择集如今包括企业 AST 套件、开发者优先的 AppSec 平台、SCM 原生安全附加项、已扩展到安全领域的代码质量工具，以及内部自建 /
              维持现状、把多个扫描器拼在一起的选项。这很重要，因为不同竞争者会压迫采购流程的不同部分：受监管企业仍评估套件宽度、治理和服务深度，而更精简的工程组织越来越看重贴合工作流的采用、低摩擦和按席位或仓库计价的清晰度。


              因此，竞争框架必须区分直接、既有、相邻和替代型对手。直接对手包括 Veracode、Fortify、Polaris 和 Snyk，因为它们提供重叠的 SAST/SCA/DAST 或统一 AppSec
              项目。Semgrep、SonarQube 和 Mend 等相邻挑战者可以赢得离散用例，或靠开发者主导采用先落地、再扩张。替代品包括 GitHub Advanced Security 和 GitLab
              Secure，因为买家若已标准化在这些 DevOps 系统上，就会减少对独立 AppSec 平台的需求。现状替代方案——多个碎片化工具加手工治理——也仍常见，尤其当组织不信任大型套件迁移时。
