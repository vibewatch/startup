- id: retention-expansion
  title: Retention, Satisfaction, and Expansion Signals
  body: 'Public retention data is scarce, but the available signals are directionally positive. Forrester TEI customer quotes describe consolidated SAST, SCA, and API Security, reduced noise, and trusted support. FeaturedCustomers shows a large reference surface with thousands of ratings and dozens of case studies and testimonials. PeerSpot feedback describes scaled enterprise rollout, policy gating, 200+ repositories onboarded, and significant critical-finding reductions. These are not cohort tables, but they suggest that at least some large customers are using the platform deeply enough for stickiness and expansion to be plausible.


    The adverse evidence tempers that optimism. Public sources do not disclose NRR, gross logo retention, or churn. Employee-review and user-review surfaces suggest management and execution friction that could eventually affect customer experience if support or onboarding quality slips. The best summary is that customer satisfaction evidence exists and is materially better than a pure logo-wall story, but it is still not a substitute for retention analytics.'
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
