- id: named-proof
  title: Named Customer Proof and Use Cases
  body: 'Checkmarx’s named customer proof spans multiple buying patterns. PCL Construction used Checkmarx One with SAST and SCA to shift security across the SDLC, valued unlimited-app licensing, and scaled weekly scanning across millions of lines of code. Cdiscount used AppSec maturity assessment and roadmap work to improve ROI and confidence. Airius used the MSSP program to embed advanced AppSec into a managed-services portfolio at competitive pricing. Trade-Van and Software AG highlight cloud-native modernization, easier-to-use AppSec workflows, and faster time to market. Public-sector material plus NASA SEWP and Air Force signals show relevance in government and regulated sectors.


    This proof set matters because it demonstrates that Checkmarx is sold for more than one use case. Some customers buy code and open-source scanning; some buy workflow modernization; some buy policy evidence; some buy channel or federal readiness. Multi-use-case proof strengthens the platform story. The main limitation is that most outcomes are customer-story framed rather than independently audited, so they prove existence and direction more strongly than exact ROI.'
