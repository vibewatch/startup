company:
  name: Checkmarx
chapter:
  number: 6
  title: Customers
  summary: 'Public evidence supports a real, enterprise-oriented customer base for Checkmarx, but still leaves major unknowns around retention and concentration. Checkmarx claims 1,800+ customers globally, and its 2025 growth release says Checkmarx One protects more than 865 of the world’s largest enterprises. Third-party signals from Apps Run the World, FeaturedCustomers, and PeerSpot reinforce that the platform is used by large organizations across banking, professional services, transportation, and other software-intensive sectors. Detailed customer stories—PCL Construction, Airius, Cdiscount, Trade-Van, Software AG, and public-sector materials—show deployments that span weekly scanning at scale, fast onboarding, partner resale, and cloud-native modernization. What remains missing are the numbers that distinguish adoption proof from a durable customer franchise: segment-level revenue mix, net retention, churn, expansion, and concentration by logo or industry.'
sections:
- id: segmentation
  title: Who Buys and Uses Checkmarx
  body: 'The public customer evidence points overwhelmingly toward enterprise and software-intensive organizations rather than small-team self-serve buyers. Checkmarx’s materials repeatedly target CISOs, AppSec leaders, developers, DevOps teams, and public-sector buyers that need policy evidence as much as vulnerability detection. Apps Run the World’s tracked users are large organizations such as Truist Bank, PCL Construction, and Cebu Air, while public customer stories emphasize dozens of developers, millions of lines of code, and compliance-heavy or cloud-modernization use cases.


    The buyer, user, and payer roles are therefore split. Developers and DevOps teams are daily users because the product lives in IDEs, pipelines, and ticketing flows. AppSec teams are program owners. CISOs and compliance leaders are often executive payers because the platform supports secure-development mandates. Channels and MSSPs matter as well: Airius shows that Checkmarx can be resold or embedded in managed offerings. This segmentation is attractive because it expands the number of stakeholders who can support a deal, but it also raises the difficulty of demonstrating value across all of them.'
