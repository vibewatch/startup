- id: growth-adoption
  title: Customer Growth and Adoption Trajectory
  body: 'Checkmarx’s strongest public adoption claims come from two directions. First, the company says it serves more than 1,800 customers, and the 2025 growth release narrows the story to more than 865 large-enterprise users of Checkmarx One plus over 20% customer growth year to date. Second, case studies provide concrete deployment signals rather than only logo counts: PCL scans 4.4 million lines of code weekly and onboarded in about four hours; Apps Run the World describes Truist, PCL, and Cebu Air implementations with scaled CI/CD workflows and broader user rollout. Together these signals show that Checkmarx is not just generating trial interest; it is being operationalized in real development programs.


    The missing denominator is equally important. Public sources do not disclose paid-seat counts, active module penetration, renewal rates, or what share of the 1,800+ customers are legacy users versus Checkmarx One platform customers. That means the adoption story is credible on breadth and real-world use, but still incomplete on quality and stickiness.'
  claimRefs:
  - CU008
  - CU009
