- id: diligence-asks
  title: Thesis-Break Triggers and Final Diligence Asks
  body: 'The final diligence asks are clear. Investors need cohort retention, current ARR or revenue, gross margin, customer concentration, module attach, win/loss data, and evidence that product investment has not been distorted by exit planning. They also need a more explicit bridge from the $150M+ Checkmarx One ARR disclosure to total company economics.


    The thesis breaks quickly if these asks go the wrong way. A modest revenue number can still support a strong outcome if retention and margin are excellent. A large revenue number can still disappoint if pricing is collapsing or concentration is extreme. Public evidence alone cannot resolve that tension, which is why this report stops at research-more rather than a conviction buy-style recommendation.'
