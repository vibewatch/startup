    - Needs premium retention and moat proof
    - Possible but unproven from public data
  - - Base
    - Scaled private platform with real customers but incomplete public economics and moderate pricing pressure
    - ~$2.0B-$2.5B directional value zone
    - Retention and margin could still disappoint
    - Most consistent with current evidence
  - - Bear
    - Pricing compression, concentration, or weak retention undermine platform economics
    - <$2.0B or failed premium sale outcome
    - Narrative outruns economic quality
    - Cannot be dismissed without cohort data
