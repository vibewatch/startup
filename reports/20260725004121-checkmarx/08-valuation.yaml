- id: scenario-range
  title: Bull, Base, and Bear Scenario Logic
  body: 'Because public disclosures are incomplete, the right valuation method in this report is scenario reasoning rather than a single-point DCF or comps output. In a bull case, Checkmarx converts platform breadth into strong retention, meaningful module expansion, and continued enterprise adoption, making a $2.5B+ outcome look reasonable or conservative. In a base case, the company remains a credible scaled private cyber asset but public evidence is still too thin on economics to fully support a premium multiple, implying a more cautious value range around or modestly below the 2024 target. In a bear case, pricing pressure, concentration risk, or weaker-than-expected retention would make the public sale target look ambitious relative to actual revenue quality.


    This scenario logic is not pessimism; it is appropriate handling of missing data. The business is clearly more substantial than an early-stage startup, but the gap between “credible scaled platform” and “easy premium underwriting” is exactly where investors lose discipline.'
