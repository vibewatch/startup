chapter:
  number: 8
  title: Valuation
  summary: 'The public evidence supports Checkmarx as a real late-stage private AppSec platform with contemporary unicorn evidence, but not yet as an easy underwriting case. The strongest valuation anchors are clear: Hellman & Friedman acquired the company for $1.15B in 2020, and both Calcalist and Information Security Media Group reported that H&F sought at least $2.5B in a 2024 sale process. The strongest scale anchor is the 2025 official claim that Checkmarx One surpassed $150M ARR, alongside 865 large-enterprise customers and 20%+ customer growth. The main problem is that today’s exact revenue, margin, retention, and concentration profile remain private. That makes a sale target above $2.5B directionally plausible for a scaled cyber platform, but hard to endorse at face value without management data. The appropriate stance from public evidence alone is research-more with medium confidence and a stretched valuation read until revenue quality and retention are directly verified.'
sections:
- id: thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The pro-valuation case for Checkmarx is straightforward. It operates in a large and still-expanding AppSec market, has credible platform breadth across code-to-cloud workflows, serves a meaningful enterprise customer base, and has contemporary evidence of large-scale recurring revenue through the Checkmarx One platform. The company also has a sponsor and governance profile consistent with institutional-scale software assets rather than venture-stage uncertainty. In short: scaled market, scaled product, scaled customers, and a live private-market valuation discussion above $1B.


    The anti-thesis is equally important. Public sources do not show current total revenue, gross margin, NRR, churn, or concentration. Competitive pressure from GitHub, GitLab, Snyk, Semgrep, and other alternatives can weaken pricing power. A broad AppSec suite can appear valuable in RFPs but still disappoint on retention if developers do not trust the workflows. These uncertainties do not erase the company’s value, but they materially weaken confidence in any precise valuation claim.'
