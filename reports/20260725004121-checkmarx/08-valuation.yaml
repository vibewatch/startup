- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Weak retention data
    - NRR / renewal weaker than premium-software expectations
    - Undermines premium multiple support
    - Move from research-more toward no unless price resets
  - - Low total-company revenue relative to sale target
    - Platform ARR does not bridge cleanly to company scale
    - Makes $2.5B+ look stretched
    - Demand revised valuation stance
  - - Heavy concentration
    - Top-customer or vertical exposure too high
    - Increases renewal and macro risk
    - Discount multiple and tighten downside case
  - - Product-trust issues in POC
    - False positives, speed, or onboarding disappoint
    - Weakens moat and expansion logic
    - Reassess product-based upside
  - - Exit-process distortion
    - Roadmap or support quality compromised by sale timing
    - Raises governance risk
    - Reduce confidence materially
  notes: These are the fastest ways for the current public valuation narrative to break.
