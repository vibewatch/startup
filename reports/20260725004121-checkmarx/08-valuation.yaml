- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current total ARR / revenue
    - Audited current revenue bridge
    - Needed to ground any valuation multiple
    - Management + finance diligence
  - - Retention quality
    - NRR, logo retention, churn, expansion by module
    - Determines durability of premium valuation
    - Customer analytics review
  - - Gross margin and services mix
    - Software vs services economics
    - Determines software quality and scalability
    - Finance and GTM review
  - - Concentration
    - Top-account / vertical / geo mix
    - Determines downside risk in large-enterprise book
    - RevOps and FP&A review
  - - Win/loss and pricing power
    - Loss patterns, discounting, and native-platform pressure
    - Determines moat and multiple support
    - Sales / deal-desk review
  - - Roadmap governance during exit
    - R&D investment, support capacity, incentive alignment
    - Determines whether near-term process distorts long-term value
    - Board / management diligence
  notes: If these asks are answered well, the public thesis can graduate into a true underwriting case.
