            body: >-
              The most revealing technical detail in Checkmarx’s current positioning is its emphasis on hybrid scanning
              and correlation. The platform page describes deterministic rules combined with AI reasoning, while Fusion
              and posture-management materials describe cross-component prioritization and a single risk view across
              application assets. That implies a layered architecture with multiple analyzers feeding a policy and
