      - number: '7.4'
        title: People, Governance, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              People risk is not primarily founder-departure risk anymore; it is execution quality under sponsor
              ownership. Checkmarx has already managed a founder-to-operator CEO transition, but employee-review and
              layoff evidence suggests organizational strain around communication, management churn, and reactive
              execution. The 2022 reduction of roughly 10% of staff demonstrates willingness to cut costs, yet it also
              raises questions about morale, support capacity, and the ability to keep complex platform execution on
              track.


              The sale-process backdrop adds another layer. A company being prepared for sale can make rational
              short-term decisions that are not perfectly aligned with long-term platform investment. There is no public
              evidence that this has happened at Checkmarx, but it is a real governance risk to diligence. Investors
              should test whether roadmap choices, support capacity, and sales incentives are being optimized for
              durable growth or for near-term exit optics.
            claimRefs:
