      - number: '3.5'
        title: Moat Durability and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Checkmarx’s moat is real but mostly executional rather than absolute. The company benefits from long
              enterprise relationships, broad module coverage, policy and governance depth, and customer evidence that
              it can reduce noise, support large-scale deployments, and integrate into DevSecOps workflows. Its MSSP
              motion and consultative services add commercial stickiness that point tools often lack. The risk is that
              these strengths are expensive to maintain while rivals narrow the functionality gap with AI remediation,
              supply-chain features, secrets detection, and better in-workflow UX.


              The most durable parts of the moat are cross-module correlation, enterprise support, and the ability to
              act as a consolidation platform across code, dependencies, APIs, IaC, containers, and posture management.
              The least durable parts are basic SAST scanning, generic SCA, and developer-facing UI claims, because many
              vendors can make similar promises. If Checkmarx cannot maintain superior signal quality and time-to-value,
              native alternatives and lower-friction platforms can turn its breadth advantage into perceived complexity.
              Competitive diligence should therefore focus on win/loss drivers, net retention by module mix, and whether
              customers buy Checkmarx as a true platform or as a bundle of replaceable scanners.
