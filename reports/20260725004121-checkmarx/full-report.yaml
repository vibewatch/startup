      - number: '1.5'
        title: Adverse Signals and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The positive adoption story is balanced by meaningful adverse evidence. In November 2022, Checkmarx cut
              roughly 100 employees, about 10% of the workforce, citing macro pressure and a need to refocus resources.
              Calcalist’s later sale- process coverage said the company employed about 900 people in September 2024,
              with around half based in Israel, which implies slower scale than the most aggressive cyber-growth
              narratives and leaves uncertainty around current headcount. Employee review surfaces add softer but
              directionally relevant caution: reviewers consistently praise product quality but complain about
              management churn, weak cross-functional communication, reactive execution, and limited career paths.

              These risks do not invalidate Checkmarx’s category position, but they do shape diligence priorities.
              Investors still need current audited revenue, renewal trends, exact ownership split, current board
              composition, and reconciled headcount and geography data. Because the company remains private, multiple
              public datapoints are dated or marketing-framed; the overview chapter should therefore be treated as a
              high-confidence identity and milestone record, but only a medium- confidence read on present financial
              scale.
            claimRefs:
