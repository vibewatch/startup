      - number: '3.4'
        title: Feature Breadth, Packaging, and Buying Criteria
        blocks:
          - type: paragraph
            body: >-
              Feature comparisons matter, but packaging often decides the deal earlier than technical evaluation.
              Checkmarx, Veracode, Polaris, Fortify, and Snyk all position as multi-module AppSec platforms. The real
              differences are in default deployment model, procurement model, module bundling, and how quickly
              developers see value. Semgrep publishes simple free and team pricing. Snyk publishes clear free, team, and
              enterprise paths. Sonar advertises a low Team starting point and custom Enterprise pricing. GitLab uses a
              broad platform plan structure where advanced security lives in Ultimate. GitHub’s value proposition is
              inseparable from the GitHub platform contract itself. Checkmarx, by contrast, primarily sells through
              enterprise sales rather than transparent public list pricing, which supports larger consultative deals but
              can raise buyer uncertainty outside large accounts.


              Buying criteria therefore split into at least six vectors: breadth of modules, developer experience,
              false-positive control, deployment flexibility, governance/reporting depth, and pricing clarity. Checkmarx
              rates well on breadth and governance, reasonably on workflow integration, and less clearly on transparent
              packaging. Native platform vendors dominate on workflow convenience; developer-first challengers dominate
              on low-friction adoption; legacy incumbents remain credible on scale and policy. This leaves Checkmarx in
              a defendable but pressured middle: strong for complex enterprise consolidation, weaker for price-sensitive
              or workflow-native buyers.
