      - number: '8.2'
        title: Valuation Anchors and Precedent Signals
        blocks:
          - type: paragraph
            body: >-
              The clearest hard anchor is the April 2020 all-cash acquisition of Checkmarx by Hellman & Friedman at
              $1.15B, with TPG and Insight as minority holders. The clearest contemporary anchor is the 2024 reported
              sale process at a target of at least $2.5B. Those two points alone suggest substantial value creation
              under PE ownership even before exact current metrics are known. The official 2025 Checkmarx One release
              adds another anchor by disclosing $150M+ ARR and 865 large-enterprise customers, while Calcalist said
              revenue had doubled since 2020 despite a 2023 dip.


              Comparable precedent signals also support late-stage AppSec value creation, but with important caveats.
              Snyk’s valuation path—from $8.5B in 2021 to $7.4B in 2022 while still reaching $300M ARR by late
              2024—shows both the category’s upside and its multiple compression risk. Veracode’s sale for $950M in 2018
              shows that scaled AppSec assets can command strategic or PE value even without the narrative premium
              attached to newer AI-era platforms. Together these precedents support the idea that Checkmarx can be worth
              multiple billions, but they do not prove that every reported sale target is justified.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
