      - number: '1.3'
        title: Ownership, Capital History, and Operating Milestones
        blocks:
          - type: paragraph
            body: >-
              Checkmarx is unusual among late-stage cybersecurity vendors in that public sources describe both a modest
              pre-exit venture-capital history and a large private-equity control transaction. Before the 2020 sale,
              Calcalist reported that the company had raised only about $100 million, with Insight Partners investing
              $85 million in 2015 and becoming the largest shareholder. Hellman & Friedman then acquired Checkmarx in an
              all-cash transaction valued at $1.15 billion, with TPG taking a minority stake and Insight retaining a
              minority interest. The deal was framed at the time as the largest application-security acquisition to
              date, underscoring Checkmarx’s strategic importance despite its smaller funding history.

              The most important post-acquisition public milestone is the September 2024 Calcalist report that Hellman &
              Friedman had begun a sale process at a target valuation of at least $2.5 billion. That report also claimed
              revenue had doubled since acquisition, albeit with a slight decline in 2023. This is the strongest public
              unicorn evidence for the current report because it is both post-July-2024 and specifically attributes the
              valuation target to an active sale process. Operating milestones since 2021 include the rollout of the
              global partner program, GitLab integration for open-source IaC scanning, FedRAMP work on Checkmarx One,
              cloud-native platform releases, runtime-aware container security, and broader code-to-cloud
              posture-management features.
