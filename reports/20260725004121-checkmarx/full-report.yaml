  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Chronology of the major public milestones that define Checkmarx’s current ownership, platform strategy, and
      execution-risk profile.
    data:
      items:
        - label: Founded in Israel
          date: '2006'
          detail: Emmanuel Benzaquen and Maty Siman establish Checkmarx as a developer-focused AppSec vendor
          tone: positive
        - label: Insight growth investment
          date: '2015'
          detail: Insight becomes the largest pre-exit shareholder after investing $85M
          tone: positive
        - label: H&F acquisition closes
          date: 2020-04
          detail: Hellman & Friedman buys Checkmarx for $1.15B with TPG as minority investor
          tone: positive
        - label: Atlanta office opens
          date: '2021'
          detail: U.S. sales, support, and customer-success functions consolidated in Atlanta
          tone: positive
        - label: Global partner program and GitLab KICS integration
          date: '2021'
          detail: Channel scale-up and open-source IaC distribution broaden reach
          tone: positive
        - label: Founder-to-operator CEO transition
          date: 2023-02
          detail: Sandeep Johri becomes CEO while Benzaquen remains on the board
          tone: neutral
        - label: Layoffs and FedRAMP push
          date: 2022-11
          detail: About 100 employees laid off while Checkmarx One begins FedRAMP authorization process
          tone: adverse
        - label: Code-to-cloud expansion
          date: '2024'
          detail: ASPM, Cloud Insights, and advanced container security add runtime-aware coverage
          tone: positive
        - label: Sale process launches
          date: 2024-09
          detail: H&F reportedly seeks at least $2.5B and says revenue doubled since 2020
          tone: neutral
        - label: Checkmarx One scale milestone
          date: 2025-10
          detail: Official release cites 865 large enterprises and $150M+ ARR for the platform
          tone: positive
    approximationNotes: Some dates are year-level because source materials discuss milestone windows rather than exact launch days.
