      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The dominant buyer pattern is enterprise and regulated-software organizations that need development teams
              to ship faster without absorbing unbounded remediation debt. Mordor says large enterprises accounted for
              59.2% of DAST market revenue in 2025, while cloud-based delivery held 73.5% share, reinforcing that the
              center of gravity is mature software organizations operating frequent-release, cloud-native environments.
              Checkmarx’s own customer materials and DXC partnership release point in the same direction: the platform
              is positioned for complex enterprises, public-sector agencies, and global organizations needing
              application-security strategy, migration, query tuning, policy enforcement, and broad SDLC integration.


              Users and payers split across at least four personas. Developers and DevOps teams are the daily users
              because AppSec controls must show up in the IDE, SCM, PR, and CI/CD path. AppSec leaders or
              product-security teams are program operators and governance owners. CISOs and compliance leaders are often
              the executive payers because the product doubles as policy evidence for secure-development mandates.
              Procurement and platform-engineering functions matter when deployments consolidate spend from multiple
              incumbent tools. Self-serve and team pricing from Semgrep, Snyk, GitLab, and GitHub shows that smaller
              organizations can enter through developer-led or repository-led adoption, but Checkmarx’s strongest fit
              remains the upper segment where workflow breadth, runtime context, and unified reporting justify a more
              consultative enterprise sale.
            claimRefs:
              - CM014
