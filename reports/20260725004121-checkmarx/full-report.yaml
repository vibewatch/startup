      - number: '7.5'
        title: Customer, Financial, and Thesis-Break Risks
        blocks:
          - type: paragraph
            body: >-
              The biggest thesis-break risk is that Checkmarx’s apparent breadth and scale hide weaker retention or
              lower pricing power than the public story suggests. The customer base appears enterprise-heavy and likely
              concentrated in larger accounts, but public sources do not show renewal behavior or ARR concentration. If
              module expansion is weaker than expected, or if GitHub, GitLab, Snyk, Semgrep, or other substitutes are
              capping willingness to pay, then the business could be less durable than its platform story implies.


              This chapter therefore treats concentration, pricing compression, and exit-process uncertainty as
              board-level risks. The business can likely survive ordinary competition. It is more vulnerable to a
              combined scenario in which commoditization, slower growth, and sale-process pressures reduce investment in
              product quality or customer success. The right mitigation is evidence, not optimism: cohort retention,
              win/loss data, and roadmap-governance visibility.
