        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >-
              Checkmarx appears to monetize primarily through enterprise software subscriptions around the Checkmarx One
              platform, with additional monetization from add-on modules, managed services, partner channels, and
              training-related offerings. Public product pages show a multi-module platform spanning SAST, DAST, SCA,
              API security, IaC, container security, and posture-management capabilities, which implies both initial
              land-and-expand potential and a large attach-rate question. Customer and partner materials show evidence
              of multiple contract shapes rather than a single rigid pricing model: PCL highlighted
              unlimited-application licensing, while Airius described a rental model with volume-based discounts for
              MSSPs. These are consistent with a commercial model designed for large enterprise accounts, resellers, and
              service providers rather than commodity seat-only pricing.


              The main financial implication is that Checkmarx likely combines recurring platform revenue with
              implementation and enablement layers that support adoption and expansion. That can be attractive if the
              software gross margin remains high and services are strategically attached rather than dominant. It also
              means topline quality depends on module mix, contract duration, renewal rates, and how much revenue is
              bundled through channels or marketplace-style procurement. Public sources do not reveal the exact mix, so
              the revenue-model chapter can establish how Checkmarx gets paid, but not yet the relative margin quality
              of each stream.
