  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The pro-valuation case for Checkmarx is straightforward. It operates in a large and still-expanding AppSec
              market, has credible platform breadth across code-to-cloud workflows, serves a meaningful enterprise
              customer base, and has contemporary evidence of large-scale recurring revenue through the Checkmarx One
              platform. The company also has a sponsor and governance profile consistent with institutional-scale
              software assets rather than venture-stage uncertainty. In short: scaled market, scaled product, scaled
              customers, and a live private-market valuation discussion above $1B.


              The anti-thesis is equally important. Public sources do not show current total revenue, gross margin, NRR,
              churn, or concentration. Competitive pressure from GitHub, GitLab, Snyk, Semgrep, and other alternatives
              can weaken pricing power. A broad AppSec suite can appear valuable in RFPs but still disappoint on
              retention if developers do not trust the workflows. These uncertainties do not erase the company’s value,
              but they materially weaken confidence in any precise valuation claim.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
