  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Buyer Choice Set
        blocks:
          - type: paragraph
            body: >-
              Checkmarx is no longer competing only against classic SAST vendors. The buyer choice set now includes
              enterprise AST suites, developer-first AppSec platforms, SCM-native security add-ons, code-quality tools
              that have expanded into security, and the internal-build/status-quo option of stitching together multiple
              scanners. This matters because different competitors pressure different parts of the buying process:
              regulated enterprises still evaluate suite breadth, governance, and services depth, while leaner
              engineering organizations increasingly optimize for workflow-native adoption, lower friction, and
              seat-based or repo-based price clarity.


              The competitive frame therefore has to separate direct, incumbent, adjacent, and substitute rivals. Direct
              rivals include Veracode, Fortify, Polaris, and Snyk because they offer overlapping SAST/SCA/DAST or
              unified AppSec programs. Adjacent challengers such as Semgrep, SonarQube, and Mend can win discrete use
              cases or land-and-expand through developer-led adoption. Substitutes include GitHub Advanced Security and
              GitLab Secure because they reduce the need for a separate AppSec platform where buyers already standardize
              on those DevOps systems. The status quo alternative—multiple fragmented tools plus manual governance—also
              remains common, especially when organizations distrust large suite migrations.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
