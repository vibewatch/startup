      - number: '8.4'
        title: Recommendation, Confidence, and Decision Implication
        blocks:
          - type: paragraph
            body: >-
              The recommendation from public evidence alone is research-more rather than yes or no. The positive case is
              too strong to dismiss: large market, broad product, real customers, live unicorn evidence. But the
              underwriting gaps are too meaningful to ignore. Without current total revenue, retention, margin,
              concentration, and governance detail around the sale process, any precise valuation stance should be
              treated as provisional.


              Confidence is medium because the direction of the story is credible but the exact economics are not. Risk
              rating is high because the unresolved questions cluster around the very variables that most affect
              valuation durability. The valuation stance is therefore best described as stretched: the $2.5B+ target is
              not unbelievable, but it looks expensive relative to the current public proof burden.
            claimRefs:
