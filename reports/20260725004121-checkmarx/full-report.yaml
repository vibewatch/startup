  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Application security vendors benefit from tighter regulation, but they also inherit new liability and
              compliance expectations. The EU Cyber Resilience Act, NIS2, NIST SSDF, SEC cyber-disclosure rules, and
              CISA secure-by-design guidance all increase the burden on software producers and enterprise buyers to
              evidence secure development, vulnerability handling, and supply-chain controls. For Checkmarx this is
              partly a tailwind because the platform helps customers address those needs. It is also a risk because
              customers will expect the vendor itself to satisfy high trust, disclosure, and support standards while
              keeping pace with changing control frameworks.


              The key regulatory risk is not a single looming enforcement action. It is execution risk under rising
              scrutiny. If customers increasingly buy AppSec tools as compliance-enabling infrastructure, then product
              gaps, slow roadmap response, or weak vulnerability prioritization become more consequential in procurement
              and renewal decisions. Public evidence does not show a major active legal dispute in the fetched source
              set, but the burden of proof on software suppliers is clearly rising.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR036
