        title: Who Buys and Uses Checkmarx
        blocks:
          - type: paragraph
            body: >-
              The public customer evidence points overwhelmingly toward enterprise and software-intensive organizations
              rather than small-team self-serve buyers. Checkmarx’s materials repeatedly target CISOs, AppSec leaders,
              developers, DevOps teams, and public-sector buyers that need policy evidence as much as vulnerability
              detection. Apps Run the World’s tracked users are large organizations such as Truist Bank, PCL
              Construction, and Cebu Air, while public customer stories emphasize dozens of developers, millions of
              lines of code, and compliance-heavy or cloud-modernization use cases.


              The buyer, user, and payer roles are therefore split. Developers and DevOps teams are daily users because
              the product lives in IDEs, pipelines, and ticketing flows. AppSec teams are program owners. CISOs and
              compliance leaders are often executive payers because the platform supports secure-development mandates.
              Channels and MSSPs matter as well: Airius shows that Checkmarx can be resold or embedded in managed
              offerings. This segmentation is attractive because it expands the number of stakeholders who can support a
              deal, but it also raises the difficulty of demonstrating value across all of them.
