  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Checkmarx is best described as enterprise application security testing (AST):
              software and services used to find, prioritize, and remediate vulnerabilities across proprietary code,
              open-source dependencies, APIs, infrastructure-as-code, containers, and adjacent software-delivery assets.
              MarketsandMarkets defines AST broadly enough to include SAST, DAST, IAST, RASP, and SCA across
              applications, deployment modes, organization sizes, and verticals. Verified Market Reports uses a
              similarly broad AST-software frame and explicitly excludes hardware-centric, network-perimeter, and
              endpoint tools that do not evaluate application code or logic. That exclusion matters because it keeps the
              boundary anchored to the software-development lifecycle rather than general cybersecurity budgets.


              For Checkmarx specifically, the economically relevant spend is not every cybersecurity dollar. The company
              competes for budgets that sit between development-tooling, AppSec, cloud-security, and compliance
              programs. Included spend therefore covers code scanning, dependency and software-supply-chain analysis,
              API and runtime-aware testing, IaC and container scanning, developer education linked to remediation, and
              posture-management layers that correlate findings across tools. Excluded or only partially adjacent spend
              includes classic WAF, endpoint detection, IAM, network firewalls, generic SIEM, and outsourced pentesting
              when those are bought without an embedded AST workflow. This narrower boundary is the right one for later
              competitor and valuation work because it aligns to how buyers compare Checkmarx against GitHub Advanced
              Security, GitLab Secure, Polaris, Snyk, and Semgrep rather than against the whole cyber stack.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
