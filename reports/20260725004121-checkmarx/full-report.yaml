            body: >-
              Checkmarx’s named customer proof spans multiple buying patterns. PCL Construction used Checkmarx One with
              SAST and SCA to shift security across the SDLC, valued unlimited-app licensing, and scaled weekly scanning
              across millions of lines of code. Cdiscount used AppSec maturity assessment and roadmap work to improve
