      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Checkmarx depends on a wide ecosystem of platforms, clouds, and procurement channels. Integrations with
              GitHub, GitLab, Azure DevOps, Jira, Slack, Teams, Sysdig, Wiz, AWS, and others improve value, but they
              also create dependency risk if vendors change APIs, bundle overlapping features, or use their own
              platforms to displace standalone AppSec tools. This is especially important for GitHub and GitLab because
              they are both integration points and competitive substitutes. Channel and MSSP partners expand reach, but
              can also create margin dilution and weaker direct control over customer experience.


              Public-sector programs are another dependency surface. NASA SEWP, FIPS, and FedRAMP work create access and
              trust, but also lengthen qualification cycles and introduce reliance on evolving government procurement
              and compliance processes. None of these dependencies are unusual for enterprise software. The risk lies in
              how many of them converge on the same product thesis: if workflow-native platforms, runtime-context
              partners, or public-sector gates become less favorable, Checkmarx’s differentiation can narrow quickly.
            claimRefs:
