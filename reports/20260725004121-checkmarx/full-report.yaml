      - number: '6.5'
        title: Expansion Paths and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Checkmarx has clear expansion vectors. Customers can grow from SAST into SCA, API, IaC, container,
              posture, and managed-services workflows; from security-team use into broader developer adoption; or from
              direct enterprise deals into partner, MSSP, and public-sector procurement channels. The public product and
              customer materials strongly support the idea that platform breadth increases wallet-share opportunity
              after initial land. That is especially true when unlimited-app licensing, cloud migration, or
              policy-driven procurement encourages broader rollout.


              But concentration risk remains opaque. The customer set appears enterprise-heavy, which is good for ACV
              but can create renewal dependence and longer sales cycles. Geographic and vertical concentration are only
              partially visible. Apps Run the World suggests banking, professional services, and transportation
              examples, but public sources do not provide revenue mix by sector or logo concentration. Investors should
