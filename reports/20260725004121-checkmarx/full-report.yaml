            body: >-
              Checkmarx publicly supports the module set large enterprises increasingly expect from a modern AppSec
              suite. SAST and SCA remain foundational, while DAST, API discovery and testing, IaC, container security,
              and supply-chain governance extend coverage from code into cloud-native deployment surfaces. API security
              emphasizes shadow and zombie API discovery plus correlation with DAST. IaC security emphasizes
              line-of-code findings and policy-as-code. Container security extends from Dockerfiles and images to
              runtime context, and supply-chain security now includes malicious package protection, repository health,
              SBOMs, and AI-BOMs. Together these materials support the claim that Checkmarx is built to sell platform
              consolidation rather than a single scan.


              Workflow integration is just as important as feature breadth. The platform page and developer-experience
              materials emphasize IDE integration, SCM scanning, CI/CD-native execution, Jira/Slack/Teams feedback, and
              direct developer remediation. DAST markets fast onboarding, built-in tunneling, and support for complex
              authentication and 2FA. These workflow claims are financially and technically material because AppSec
              products fail when security teams buy them but developers do not use them. Public materials suggest
              Checkmarx is acutely aware of that failure mode and has structured the product to reduce it.
