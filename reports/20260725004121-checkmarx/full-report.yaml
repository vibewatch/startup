      - number: '1.4'
        title: Platform Scope, Customer Base, and Proof of Adoption
        blocks:
          - type: paragraph
            body: >-
              Public customer evidence supports the view that Checkmarx is an enterprise-focused platform rather than a
              small-team developer tool. Official materials repeatedly cite 1,800+ customers worldwide, with penetration
              claims ranging from nearly half of the Fortune 50 to 40% of the Fortune 100 depending on year and source
              context. The 2025 growth release tightened that narrative around the Checkmarx One platform specifically,
              stating it protected more than 865 of the world’s largest enterprises and had surpassed $150 million of
              ARR in under three years. Even allowing for vendor marketing bias, the direction of travel is clear:
              Checkmarx has real large-enterprise deployment depth.

              Customer proof also appears in implementation details rather than just logo walls. PCL Construction
              reported onboarding Checkmarx One in roughly four hours, scanning 4.4 million lines of code weekly across
              21-plus applications, and valuing the platform’s unlimited-app licensing. Airius described competitive
              pricing, deployment flexibility, and a rental / pay-as-you-grow model inside the MSSP program. Cdiscount
              used Checkmarx’s assessment methodology to raise AppSec program maturity and ROI confidence. Apps Run the
              World and FeaturedCustomers add third-party support for enterprise reference depth, while Calcalist named
              Dell, Adidas, Ford, Visa, Siemens, and Salesforce among recognizable customers.
            claimRefs:
              - CO027
              - CO028
              - CO031
              - CO032
              - CO033
              - CO034
