      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >-
              The company’s leadership arc is one of founder continuity paired with institutionalized professional
              management. Co-founder Emmanuel Benzaquen led Checkmarx through its early product buildout, growth-equity
              period under Insight Partners, and the 2020 sale to Hellman & Friedman and TPG. In February 2023,
              Checkmarx appointed Sandeep Johri as CEO while Benzaquen remained on the board, marking the clearest
              handoff from founder-led scaling to private-equity operating discipline. Johri’s background at Tricentis,
              HP, and earlier security startups suggests the mandate was not merely steady-state stewardship: the board
              wanted someone experienced in enterprise software scaling, cloud transition, and category repositioning.

              Governance remains closely tied to owners and founders. The official leadership page still lists Benzaquen
              and Maty Siman as founder figures, while Hellman & Friedman, TPG, and Insight are represented in the
              broader board / advisor surface. Tarim Wasim of Hellman & Friedman publicly endorsed Johri as the
              next-stage leader, which is important for diligence because it shows the sponsor remains actively involved
              rather than purely financial. This governance model is supportive for disciplined execution, but it also
              means any eventual sale or recapitalization is likely to be heavily sponsor-directed. Key-person risk is
              lower than at many founder-led startups because the company has already proven a founder-to-operator
              transition, but product and customer continuity still depend materially on Johri and on the founders’
              continuing board influence.
