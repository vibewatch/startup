chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Geographic Footprint
        blocks:
          - type: paragraph
            body: >-
              Checkmarx was founded in 2006 in Israel by Emmanuel Benzaquen and Maty Siman, and built its brand around
              automated application security testing embedded directly in developer workflows. The company historically
              operated from the Tel Aviv / Ramat Gan base, but over time expanded aggressively in the United States and
              Europe as large-enterprise AppSec buying moved closer to security leaders, regulated industries, and
              cloud-native engineering teams. Checkmarx’s current operating identity is increasingly U.S.-centered: the
              company officially opened an Atlanta office to house U.S. sales, customer success, and technical support,
              and the February 2023 CEO transition press release was issued from Atlanta and Ramat Gan together,
              signaling dual-center leadership. The public footprint therefore supports the user-provided framing of
              Atlanta plus Israel rather than a single-headquarters story.

              The product identity has also shifted from a point-tool SAST vendor into a broader AppSec platform
              company. Checkmarx now describes itself as an application-security platform for the AI era, securing code,
              APIs, infrastructure-as-code, containers, and supply-chain components under the Checkmarx One brand. That
              positioning matters because later market, product, and valuation chapters should treat Checkmarx as a
              multi-module AST platform rather than only a legacy SAST vendor. Public materials consistently emphasize
              developer-native deployment, code-to-cloud visibility, and AI-assisted remediation as the firm’s current
              narrative.
