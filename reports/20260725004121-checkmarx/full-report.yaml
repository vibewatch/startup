        title: Exhibits
        blocks:
          - type: callout
            title: The boundary matters more than the biggest TAM headline
            body: >-
              Checkmarx does not need to win all cybersecurity spend; it needs to win the enterprise
              software-security-control layer where CI/CD integration, policy evidence, and tool consolidation matter
              most.
            calloutType: insight
