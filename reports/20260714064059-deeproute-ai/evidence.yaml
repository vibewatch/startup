evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-disclosure
    missingEvidence: A primary source that states DeepRoute.ai's exact post-Series C1 valuation or pre/post-money terms.
    whyItMatters: >-
      Without exact valuation terms, later valuation analysis must rely on unicorn framing and comparable heuristics
      instead of a verified private-market mark.
    diligencePath: >-
      Obtain the financing announcement deck, shareholder circular, or eventual IPO filing that discloses round pricing
      and share count.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-rights
    missingEvidence: Board composition, liquidation preferences, pro-rata rights, and investor control provisions.
    whyItMatters: Strategic investor influence and downside protection materially affect underwriting and potential IPO outcomes.
    diligencePath: Review shareholder agreements or listing documents once the HK filing becomes public.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: >-
      One reconciled cumulative funding total with a round-by-round ledger accepted by the company and independent
      datasets.
    whyItMatters: >-
      Funding scale is a headline metric for stage assessment, runway assumptions, and expected IPO caliber; the current
      public range is too wide.
    diligencePath: >-
      Reconcile company IR materials, cap-table summaries, and authoritative database entries during management
      diligence.
    relatedQuestionRefs:
      - QO010
      - QO011
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: delivery-audit
    missingEvidence: >-
      Independent OEM-by-OEM shipment or activation data validating DeepRoute's 200,000-plus and 250,000-plus deployment
      claims.
    whyItMatters: >-
      Delivery scale is central to the commercialization thesis, but current evidence is still primarily
      company-reported or partner-amplified.
    diligencePath: Request signed OEM program lists, installed-base reports, or audited IPO-filing metrics.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: ex-china-sam
    missingEvidence: >-
      A source-backed market model that isolates DeepRoute’s addressable non-China intelligent-driving opportunity
      rather than simply gesturing to Europe or robotaxi expansion.
    whyItMatters: >-
      Without a clean ex-China SAM, long-run valuation upside can be overstated by extrapolating China success into very
      different regulatory and OEM environments.
    diligencePath: Obtain management’s regional pipeline breakdown or a public IPO filing with geography-specific market assumptions.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: third-party-market-open-space
    missingEvidence: >-
      A definitive 2025 full-year market-share table for all third-party city NOA suppliers, including DeepRoute’s
      annual share rather than monthly snapshots.
    whyItMatters: >-
      The current market-consolidation story is directionally clear, but precise challenger headroom cannot be
      quantified with high confidence from monthly or partial-period figures alone.
    diligencePath: Collect CAAM full-year supplier league tables or audited OEM-install base disclosures.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: oem-make-vs-buy
    missingEvidence: >-
      OEM-by-OEM procurement maps showing which brands are open to third-party suppliers versus locked into
      self-development or closed ecosystems.
    whyItMatters: DeepRoute’s true SAM depends more on make-versus-buy behavior than on gross vehicle volumes.
    diligencePath: Map target OEM stacks through program wins, supplier disclosures, and management diligence.
