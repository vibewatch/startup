    {
      "id": "capital-markets-and-financing-risk",
      "title": "The financing window is open, but public evidence suggests management is hurrying through it",
      "body": "DeepRoute's capital position should be read as good enough to scale, but not disclosed well enough to relax. The company has credible prior capital support from Alibaba, Great Wall, and other strategic backers, and CB Insights still points to roughly $450 million total raised. That is meaningful. The problem is what public coverage says about the current market rather than the historic funding base. KrASIA and 36Kr both describe a sector in which compute, data-loop, and mass-production costs keep rising while primary-market appetite for autonomous driving has cooled sharply. Their common message is that surviving companies increasingly need access to public markets because strategic money alone may not be enough for the next leg of spending. DeepRoute's confidential Hong Kong filing fits that pattern. Just as important, public AV comparables such as Pony.ai and WeRide show that an IPO is not the same thing as durable valuation support. That makes the financing path itself a risk variable: the company likely needs secondary-market optionality, but public-market buyers are already proving selective and price sensitive.",
