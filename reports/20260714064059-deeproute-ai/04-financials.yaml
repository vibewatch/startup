    {
      "id": "capital-adequacy-and-peer-triangulation",
      "title": "Capital adequacy and peer triangulation: the company has meaningful funding history, but runway is still opaque",
      "body": "DeepRoute’s funding history is clearly substantial, but present capital adequacy is not publicly knowable with precision. Independent and company-adjacent sources corroborate the 2021 $300 million Alibaba-led round and the November 2024 $100 million Series C1 round from a strategic Chinese automaker. The better-corroborated cumulative funding figure is about $450 million, supported by CB Insights and a company PR release, yet another partner-linked source claims the total exceeds $700 million, creating a clear public conflict. More importantly, funding history does not equal runway. There is no accessible public cash balance, monthly burn figure, or debt schedule for DeepRoute on the report date. Peer filings show why this gap matters. Pony.ai’s 2025 filing shows $90.0 million of revenue but far larger R&D spend and material operating cash burn, while Momenta’s IPO disclosure shows scale and high gross margin but continued losses. Waymo’s $16 billion financing round shows how capital hungry frontier autonomy can become at scale. DeepRoute may be more capital efficient than pure robotaxi players, but the public record does not yet prove that it is fully financed for its next strategic phase.",
