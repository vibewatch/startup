    {
      "id": "financial-verdict-and-diligence-blockers",
      "title": "Financial verdict and diligence blockers: the business model looks better than the disclosure set",
      "body": "The financial verdict is directionally positive on model quality but still incomplete on underwritability. DeepRoute looks stronger than a startup whose only proof is autonomous miles or promotional pilots because it appears to be generating OEM-linked commercial activity from production vehicles. That should create better long-run revenue quality than a pure robotaxi story if deployments persist. But from an investor’s perspective the disclosure set lags the business model. There is no audited revenue line, no gross-margin series, no customer concentration table, no cash position, no burn bridge, and no debt disclosure. The company may have enough capital to bridge toward IPO or broader commercialization, yet public evidence does not prove it. As a result, the correct financial posture is not bearish on the revenue mechanism itself, but cautious on any precise valuation or runway claim until audited or filing-grade DeepRoute financials appear.",
