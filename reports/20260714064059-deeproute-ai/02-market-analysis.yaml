  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "DeepRoute.ai operates inside a Chinese intelligent-driving market that is far larger than the robotaxi niche but materially narrower than total auto sales: the near-term economic prize is outsourced urban NOA and higher-level ADAS content sold into OEM programs, with robotaxi and physical-world AI as adjacent expansion pools. Public sources show China sold 34.4 million vehicles and 16.49 million NEVs in 2025, while city-NOA-equipped passenger-car sales reached about 3.129 million units in the first eleven months of 2025 and third-party supplier volume was only a fraction of that total because self-developed stacks still dominate. The market is attractive because NEV penetration, end-to-end models, and OEM demand are accelerating, but it remains constrained by safety regulation, data and compute intensity, OEM make-versus-buy decisions, and a consolidating supplier structure led by Huawei and Momenta."
  },
  "sections": [
    {
      "id": "market-boundary-and-what-counts",
      "title": "Market boundary: what spend is in scope for DeepRoute and what is not",
      "body": "The right market boundary for DeepRoute is not “all autonomous driving” and not even “all robotaxis.” Its economically relevant market is the intersection of advanced driver-assistance software, compute, validation, and integration content that automakers buy when they want city-NOA, highway-NOA, or higher-level assisted-driving capability without fully self-developing the stack. That means the broadest TAM starts with the China vehicle market, narrows to NEV and smart-vehicle volume, then narrows again to NOA-equipped vehicles, and finally narrows to the third-party supplier segment where brands choose outside technology partners instead of internal stacks. Adjacent revenue pools still matter. Robotaxi creates a future software-and-operations market with higher autonomy and richer data feedback, while “RoadAGI” or broader embodied-AI applications could reuse the same perception, planning, and world-model infrastructure. But those adjacencies should not be conflated with the current buying center. Today’s market is driven mainly by OEM product, ADAS, procurement, and chip-roadmap decisions inside the China passenger-car industry. That framing matters because it shows why total national vehicle sales overstate DeepRoute’s immediate addressable market, while robotaxi-only views understate it.",
