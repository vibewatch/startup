  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "DeepRoute.ai now has enough production-vehicle proof to justify a real late-stage valuation discussion, but not enough public economic disclosure to justify a high-conviction premium call. Public and private comps span a wide corridor—from WeRide around $1.9 billion and Pony.ai around $2.9 billion in July 2026 to Momenta's roughly $5 billion pre-IPO mark and nearly $9 billion Hong Kong IPO pricing—while Mobileye shows how multiples compress once scale and revenue become transparent. The most defensible current stance is track / fair / high risk: a low-single-digit-billion valuation can be rationalized, but prices materially above roughly $2.5 billion would look stretched without new disclosure on revenue, pricing, gross margin, and customer concentration."
  },
  "sections": [
    {
      "id": "recommendation-and-entry-discipline",
      "title": "Recommendation: commercially relevant, but still too opaque for an aggressive price-insensitive call",
      "body": "DeepRoute now looks like a real late-stage intelligent-driving supplier rather than a speculative robotaxi-only experiment. The company has strategic backing from Alibaba and Great Wall, real deployment scale, multiple OEM relationships, and a product story that extends beyond a single pilot lane. That said, the evidence still stops short of what investors need for a strong buy-style valuation call. Public materials do not disclose a clean current mark, current revenue, per-vehicle pricing, gross margin, or customer-level concentration by dollars. That leaves valuation to be triangulated rather than observed. The right present-tense call is therefore disciplined rather than bullish: track the company, assume high risk, and treat a low-single-digit-billion valuation as fair only if the price stays meaningfully below the most expensive public and private Chinese AV comparables. The nearer the entry price moves toward the $2.5 billion-plus zone without new disclosure, the more the risk-reward begins to look stretched rather than balanced.",
