              Apollo 更难归类，因为它结合开放生态、Robotaxi 车队、大模型叙事和垂直整合整车技术栈。与此同时，Mobileye 是乘用车授权最清晰的国际参照，拥有许多主机厂可逐步采用的 ADAS 到 AV
              梯子。结果是，每个主要对手都在不同维度很强，因此没有任何单一“赢家通吃”叙事能完全贴合证据。
