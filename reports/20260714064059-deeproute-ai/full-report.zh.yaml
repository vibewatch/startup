  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：DeepRoute 的相关支出范围，以及不在范围内的部分
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 的正确市场边界不是“所有自动驾驶”，甚至不是“所有 Robotaxi”。经济上真正相关的市场，是车企想获得城市 NOA、高速 NOA
              或更高阶辅助驾驶能力、又不愿完全自研技术栈时，会采购的高级驾驶辅助软件、算力、验证和集成内容的交集。这意味着，最宽口径的 TAM 从中国整车市场开始，收窄到 NEV 和智能汽车销量，再收窄到搭载 NOA
              的车辆，最后落到品牌选择外部技术伙伴、而不是内部技术栈的第三方供应商细分。相邻收入池仍然重要。Robotaxi 会形成未来的软件和运营市场，自动化程度更高，数据反馈也更丰富；“RoadAGI”或更广义具身 AI
              应用，也可能复用同一套感知、规划和世界模型基础设施。但这些相邻机会不能和当前采购中心混为一谈。今天的市场主要由中国乘用车行业内部的主机厂产品、ADAS、采购和芯片路线图决策驱动。这个框架很关键，因为它说明，全国整车销量会高估
              DeepRoute 的近期可服务市场，而只看 Robotaxi 又会低估它。
