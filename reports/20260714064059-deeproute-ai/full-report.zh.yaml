        - 报告日未找到可获取的 DeepRoute 公开数字
        - 最大的未解资本充足性缺口
        - 现金跑道决定 IPO 或下一轮私募的紧迫性
        - 当前现金、月度烧钱额和最低流动性约束
      - - 同行参照：Pony.ai 2025
        - 20-F 显示收入 $90.0M、R&D $217.4M、经营性现金消耗 $165.0M
        - 商业化牵引并不会消除 AV 的高 burn
        - 有助于衡量规模化自动驾驶仍会消耗多少资本
