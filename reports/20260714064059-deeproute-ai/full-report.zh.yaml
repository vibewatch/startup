      - number: '2.3'
        title: 买方分层：谁买、谁用、谁付款，采用如何发生
        blocks:
          - type: paragraph
            body: >-
              买方地图有多层，但中心仍是车企。对 DeepRoute 这类供应商来说，主机厂产品团队、ADAS 负责人、采购和整车平台工程团队才是真正的采购中心，因为他们决定是自研、采用 Huawei
              这类平台，还是与第三方技术栈供应商签约。使用者是驾驶员，但付款方是主机厂，后者通常把系统嵌入整车 BOM 和定价，而不是作为纯 SaaS
              订阅出售。中国本土品牌是当前最重要的买方，因为它们动作更快，容忍更快迭代，也常常需要在激烈价格竞争中拿出差异化智能驾驶功能。合资车企和全球品牌是第二个关键分层，因为 CAAM
              报告称，国际知名品牌正越来越多选择中国头部供应商来补齐能力缺口。Robotaxi 运营商不同：他们更看重安全、在线率、ODD
              扩张和运营经济性，而不是配置级别功能差异。采用路径很清楚：芯片和软件选择、集成、验证、SOP、现场数据，再到跨车型复用。这条路径更偏爱拥有大规模交付经验的供应商，而不是只有强算法的团队；这也是市场评论持续强调量产执行已成为新门槛的原因。
