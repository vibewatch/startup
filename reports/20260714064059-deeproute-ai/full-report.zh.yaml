  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：具备商业相关性，但仍过于不透明，不适合做激进且不看价格的买入判断
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 现在更像真实的后期智能驾驶供应商，而不是只押 robotaxi 的投机实验。公司有 Alibaba 和 Great Wall 的战略背书，有真实部署规模、多家 OEM
              关系，产品叙事也不再局限于单一试点车道。话虽如此，证据仍达不到投资人做强买入式估值判断所需的程度。公开材料没有披露干净的当前估值标记、当前收入、单车价格、毛利率，或按收入计的客户集中度。因此，估值只能三角测算，不能直接观察。当前更合适的判断不是看多，而是保持纪律：跟踪公司、假设高风险；只有当价格显著低于最昂贵的中国
              AV 公私市场可比公司时，低个位数十亿美元估值才算公允。如果入场价格在没有新披露的情况下逼近 $2.5B 以上区间，风险回报就会开始显得被拉伸，而不是均衡。
