      - - WeRide
        - 产品宽度、公开市场融资通道、广泛地域、多元 L2-L4 组合
        - 跨多条产品线运营复杂，可能稀释聚焦
        - 如果 DeepRoute 规模超过单一赛道，WeRide 展示了多元自动驾驶平台的样子
      - - Pony.ai
        - Robotaxi 商业化、海外扩张、单位经济性改善
