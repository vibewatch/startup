            body: >-
              DeepRoute 融资历史显然可观，但当前资本充足度无法从公开资料精确判断。独立和公司相关来源共同佐证了 2021 年 Alibaba 领投的 $300 million 轮，以及 2024 年 11
              月来自一家中国战略车企的 $100 million C1 轮。更有佐证的累计融资数字约为 $450 million，由 CB Insights 和公司公关稿支持；但另一家与伙伴有关的来源称总额超过 $700
              million，形成明确公开冲突。更重要的是，融资历史不等于资金续航。报告日没有可访问的 DeepRoute 公开现金余额、月度现金消耗或债务时间表。同行申报文件说明了这个缺口为什么重要。Pony.ai 的
              2025 年文件显示收入为 $90.0 million，但 R&D 支出大得多，并有实质性经营现金消耗；Momenta 的 IPO 披露显示已有规模和高毛利，但仍在亏损。Waymo 的 $16 billion
              融资轮显示，前沿自动驾驶做到规模后会多么吃资本。DeepRoute 可能比纯 Robotaxi 玩家资本效率更高，但公开记录尚未证明它已为下一战略阶段完全融资。
