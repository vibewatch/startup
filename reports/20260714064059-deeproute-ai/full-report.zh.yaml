      - CV035
      - CV036
      - CV037
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Pony.ai
        - 中国 / 全球 robotaxi 与自动驾驶上市公司
        - 约 $2.9B 市值；约 26.4x P/S；约 16.8x EV/Sales
        - 最接近的中国自动驾驶公开可比公司，交易逻辑仍更多押增长和叙事，而非成熟利润。
        - Robotaxi 敞口更重，且公开市场回撤扭曲了与供应商的直接比较。
      - - WeRide
        - 中国 robotaxi / 自动驾驶上市公司
        - 约 $1.9B 市值；约 17.9x P/S；约 9.9x EV/Sales
        - 展示一家已上市中国 AV 公司即便完成美国 IPO 后也可能交易到的位置。
        - 业务组合更偏 robotaxi，当前市值低于 IPO 目标。
      - - Mobileye
        - 成熟 ADAS / AV 上市供应商
        - 约 $8.2B 市值；约 4.1x P/S；FY2025 收入 $1.894B
        - 收入已披露、规模化供应商能交易到什么水平，Mobileye 是最佳基准。
        - 比 DeepRoute 大得多、更成熟，也透明得多。
      - - Momenta（Pre-IPO 轮）
        - 中国智能驾驶未上市龙头
        - 2026 年 4 月 pre-IPO 轮后投后估值约 $5.0B
        - 最接近的中国智能驾驶未上市可比公司，已披露规模更强。
        - 已披露装机基数更高，财务披露也强于 DeepRoute。
      - - Momenta（香港 IPO）
        - 中国智能驾驶 IPO 可比公司
        - 2026 年 6 月指示性 IPO 估值约 $9.0B
        - 若品类龙头规模和披露更强，市场可能支付的上限。
        - 不能直接平移到 DeepRoute，因为 Momenta 披露了更多收入和规模。
      - - DeepRoute（推导基准情景）
        - 后期私募、以 OEM 为中心的自动驾驶供应商
        - 推导合理区间 $1.2B-$1.8B
        - 反映真实量产验证，同时体现清晰披露折扣和集中度折扣。
        - 这是估算值，并非公司披露；高度依赖同业折价和未来价格发现。
    notes: 覆盖范围刻意保持局部：本表选择估值披露可用、对决策最相关的自动驾驶公开和私有可比公司，而不是列出所有智能驾驶相邻公司。
    enumerationScope:
      coverage: partial
      basis: >-
        Six selected comparables with public or broadly reported valuation anchors reviewed through 2026-07-14: two
        listed China autonomy peers, one mature public supplier, Momenta private and IPO marks, and DeepRoute's own
        inferred base case. Excludes Huawei Yinwang, Horizon Robotics, and opaque secondary marks where directly
        comparable valuation and business-model data are less clean.
    claimRefs:
      - CV013
      - CV014
      - CV016
      - CV017
      - CV020
      - CV023
      - CV024
      - CV034
      - CV037
  - id: TV005
    title: 打破论点与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 香港 IPO 进程疲弱或延迟
        - 看不到定价进展、出现重大延迟，或订单簿明显疲软
        - 削弱当前合理区间判断背后的融资窗口支撑
        - 下调估值区间，并假设资本灵活性更紧。
      - - Great Wall / Leapmotor 之外仍无多元化
        - 到下一个披露周期，仍没有更广、能贡献收入的 SOP 客户组合
        - 集中度风险过高，难以支撑接近同业的定价
        - 维持或扩大相对公开和未上市可比公司的折价。
      - - 公开可比公司压缩进一步加深
        - Pony.ai 和 WeRide 明显跌破当前水平，且其他板块也没有重估
        - 降低市场整体愿意为不透明 AV 叙事支付的价格
        - 下调熊情景和基准情景区间。
      - - 部署没有转化为经济性
        - 车辆数增长之下，仍无已披露年化收入、定价或毛利率证据
        - 打破“商业化验证最终会弥合披露缺口”这一关键假设
        - 将建议从「跟踪」转向「继续研究 / 避免追高」。
      - - 监管或算力冲击
        - 中国铺开规则明显收紧，或 AI 芯片限制更严
        - 同时抬高执行成本并拖慢论点兑现路径
        - 下调牛情景和基准情景概率。
    notes: 这些是具体的推进 / 否决触发项，不是常规季度监控点。
    claimRefs:
      - CV027
      - CV030
      - CV037
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 当前收入 / 年化收入
        - 当前年化收入或最近 12 个月 OEM 授权收入
        - 把估值从推断项变成可观察项，并为可比公司折价提供锚点
        - 要求管理层提供收入桥接表或 IPO 草稿财务摘要。
      - - 单车定价与利润率
        - 按项目拆分定价结构、硬件 / 软件组合和毛利率
        - 判断部署规模能否真正跑出供应商经济性
        - 要求在 NDA 下提供客户合同经济性和项目利润率瀑布。
      - - 按收入计的客户集中度
        - Great Wall、Leapmotor 与其他 OEM 的收入占比
        - 检验战略背书是否正在变成集中度风险
        - 要求提供头部客户收入明细表和按车型拆分的 SOP 收入计划。
      - - 当前价格锚点
        - IPO 区间、二级交易或有清晰文件支撑的当前估值标记
        - 没有价格锚点，入场纪律只能按区间把握，做不到精确定价
        - 审阅上市材料草稿、投行反馈和二级市场数据。
      - - 现金续航期
        - 当前现金余额、月度现金消耗和融资备用方案
        - 解释 IPO 时点是机会性选择还是融资必需
        - 要求提供最新预算与实际现金消耗差异和 24 个月现金预测。
      - - 治理 / IP 条款
        - 董事会厚度、接班安排和 OEM 共同开发 IP 边界
        - 判断叙事和平台价值有多少能靠制度持续
        - 审阅股权结构表、董事会材料以及 OEM / JV / 数据权利主协议。
    notes: 上述问题按其推动 DeepRoute 从可跟踪故事走向可定价资产的速度排序。
    claimRefs:
      - CV008
      - CV040
      - CV041
      - CV042
      - CV044
