      - number: '2.4'
        title: 增长驱动、约束，以及供应商市场为什么在整合
        blocks:
          - type: paragraph
            body: >-
              最强市场驱动很清楚。NEV
              渗透率持续上升，智能驾驶功能下探到更低价位，基础模型和无图方法正在降低部署摩擦，全球和本土品牌也越来越接受高阶辅助驾驶会影响整车竞争力。但约束同样重要。中国监管环境正变得更正式，而不是更宽松：北京 2025
              年监管、2026 年全国标准草案，以及 MIIT 在 2025 年对公开 beta 测试、术语、远程功能和 OTA
              节奏的限制，都提高了快速交付的合规成本。安全表现、算力成本和数据闭环速度，如今和原始算法质量同样重要。这些条件有利于少数供应商——它们拥有深数据飞轮、芯片伙伴、主机厂信任，以及已验证的规模部署。CAAM 和
              KrASIA 描述的正是这种结构：一边是自研主机厂技术栈占据主导，另一边是第三方市场越来越集中在 Huawei、Momenta 和 DeepRoute
              等少数挑战者手中。结果是，市场增长强劲，但竞争走廊正在收窄；执行和规模可能比单纯技术新意更重要。
