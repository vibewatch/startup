      - number: '2.2'
        title: 规模测算视角：从整车总需求到第三方 NOA 小众市场
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据已经足够搭出多视角图景，尽管没有任何单一来源给出完美的 DeepRoute TAM。在漏斗顶部，基于 CAAM 数据的官方政府报道显示，中国 2025 年销售 34.4 million
              辆汽车，其中 NEV 为 16.49 million 辆。这是智能驾驶内容扩散的宏观底座。更相关的中间层，是城市 NOA 和高端 ADAS 的采用。研究摘要和 CAAM 的 2025 年城市 NOA
              报告显示，市场推进很快：到 2024H1，城市 NOA 在新乘用车销售中的渗透率已达 7.6%；2025 年 1 月至 11 月，搭载城市 NOA 的乘用车销量达到 3.129 million 辆，渗透率为
              15.1%。第三方供应商层又更小。CAAM 自己的 2025 年报告称，仍有 19 个品牌在自研城市 NOA，约 29 个品牌使用第三方供应商。报告还显示，Momenta 和 Huawei
              合计控制第三方市场约五分之四，意味着外包供应商切片在 2025 年只有高几十万辆，而不是完整的 3.1 million 城市 NOA 总量。因此，DeepRoute 的机会足够大，值得重视，但远比“34
              million 辆汽车市场”式说法紧得多。
