  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 概率信号
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
    rows:
      - - 熊
        - 25%
        - IPO 窗口转弱，DeepRoute 仍集中在同一批核心 OEM，公开 AV 可比公司继续压缩，收入透明度也没有出现。
        - $0.8B-$1.1B；该区间相对 Pony / WeRide 大幅折价，且几乎不给实体 AI 叙事加分。
        - 可比公司进一步压缩、香港市场疲弱、集中度延续，以及收入不披露。
      - - 基准
        - 50%
        - 商业验证延续，至少一部分新增 OEM 广度转化，但当前收入和定价仍大体未披露。
        - $1.2B-$1.8B；相对 Pony / WeRide / Momenta 私募估值同业篮子约折价 45%-65%，符合不便宜但尚属合理的后期私募定价。
        - 披露缺口仍在，但部署验证避免了更重折扣。
      - - 牛
        - 25%
        - DeepRoute 的百万辆目标开始显得可信，公开可比公司重估，投资者更充分买入实体 AI / 平台故事。
        - $2.2B-$3.0B；相对公开和未上市同业的折价明显收窄，但仍不假设达到 Momenta 式规模或 Mobileye 式成熟度。
        - 执行和叙事溢价必须同时改善。
    notes: 这些区间是供投资委员会讨论的美元十亿级情景估值输出，不是公司发布的目标价。
    claimRefs:
