        title: 收入模式和公开牵引：DeepRoute 似乎卖什么，以及市场仍看不到什么
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一套相当清晰的收入顶层逻辑，尽管没有披露 DeepRoute 的实际收入。DeepRoute
              似乎主要靠把智能驾驶能力卖进主机厂项目变现，而不是运营大型付费消费者应用，或销售单一零售软件订阅。TechCrunch 报道称，公司向车企收取单车授权费，并收集数据来改进 AI
              技术栈；后续公司和伙伴披露则把注意力转向已交付车辆、量产项目和战略主机厂合作。因此，最好的公开牵引指标是已出货或已启用车辆，而不是 ARR、MAU 或付费行程量。这也意味着，如果部署持续转化为重复 SOP
              定点，收入质量可能比纯试点阶段 Robotaxi 运营商改善得更快。缺失层在于规模：公开来源没有披露收入结构、按客户确认的收入，或已实现单车价格，所以投资人能看到动作，却看不到财务产出。
