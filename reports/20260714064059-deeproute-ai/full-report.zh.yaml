  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层：买方、使用者、付款方，以及为什么 DeepRoute 的“客户”不是终端驾驶者
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 的客户地图有三层。直接经济付款方通常是车企或整车项目团队，它们为量产车采购智能驾驶技术栈。运营使用者是车内体验该功能的驾驶员或乘客，但终端用户不是主要签约方。第三层包括 Robotaxi
              运营商或未来出行伙伴，它们可能在车队场景使用同一核心技术。这意味着，客户证据不能按普通 B2C 或 SaaS
              公司来判断。消费者采用很重要，但主要是因为它帮助主机厂证明更多车型铺开、更高配置渗透和更大产量有理由。公开证据也显示，战略价值高度不均：Great Wall 相关项目、smart
              和其他头部主机厂集成，可能远比一长串未披露客户名更重要。因此，实际问题是哪些关系已经进入量产，哪些仍只是路线图主张，以及一个已部署项目能多快转化为重复车型定点。
