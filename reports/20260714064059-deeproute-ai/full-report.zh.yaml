        title: 判断可以上调，但前提是下一轮披露补上明显缺口
        blocks:
          - type: paragraph
            body: >-
              什么会改变这条建议？不是另一篇高层部署新闻稿。下一轮披露必须回答仍缺失的经济问题。投资人需要真实的当前收入或年化收入、单车价格或抽成率逻辑、按金额而非按客户数量口径的客户集中度、毛利率或硬件组合证据，以及来自
              IPO
              价格区间或有清晰文件支持的二级市场估值标记的真实价格锚。没有这些数据，估值只能圈定范围，无法精确承销。否决触发项因此具体且可衡量：香港上市疲弱或延期，继续依赖同两个可见锚定客户，公开可比公司估值压缩拖累行业，或者无法证明车辆部署正在转化为可见收入能力。只要这些触发项没有发生且披露改善，公允区间可以上移。在此之前，中等信心才是诚实姿态，因为合理价格和拉伸价格之间的差距，仍取决于公开档案尚未披露的事实。
