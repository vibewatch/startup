            body: >-
              DeepRoute 的资本状况可以理解为足以支撑扩张，但披露还不够充分，不能让投资人放松。公司此前获得 Alibaba、Great Wall 等战略方支持，CB Insights 仍指向累计融资约
              $450M；这有分量。问题在于，公开报道呈现的是当前市场，而不是历史融资底座。KrASIA 和 36Kr
              都描绘了一个行业：算力、数据闭环和量产成本持续上升，而自动驾驶一级市场胃口明显降温。两家的共同信息是，留在牌桌上的公司越来越需要进入公开市场，因为单靠战略资金未必足以支撑下一轮开支。DeepRoute
              秘密递交香港上市申请，正符合这个模式。同样关键的是，Pony.ai、WeRide 等上市 AV 可比公司说明，IPO
              不等于估值能长期托底。因此，融资路径本身就是风险变量：公司大概率需要二级市场选择权，但公开市场买家已经开始挑剔，也对价格敏感。
