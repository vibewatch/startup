    layout: wide
    summary: DeepRoute 的客户旅程从 OEM 采购开始，而不是终端用户自助采用。
    data:
      items:
        - label: OEM 采购需求浮现
          phase: 发现
          detail: 车企为新车型或改款寻找外包智能驾驶能力。
        - label: 技术评估与伙伴选择
          phase: 评估
          detail: OEM 比较自研、生态平台，以及 DeepRoute 这类第三方供应商。
        - label: 集成与验证
          phase: 实施
          detail: DeepRoute 与 OEM 围绕整车集成、安全检查和上市准备协作。
        - label: 量产上市与用户激活
          phase: 采用
          detail: 驾驶者在量产车内开始使用该功能，但并不是直接付款方。
        - label: 数据闭环与可能的车型扩展
          phase: 扩展
          detail: 若表现强劲，OEM 可将使用范围扩大到更多车型或地区。
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU023
      - CU028
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 真正的漏斗不是应用获客，而是 OEM 评估转化为已部署车辆规模。
    data:
      items:
        - label: OEM 洽谈 / 目标客户
          value: 100
          description: 公司推进一批候选 OEM 和车型项目。
        - label: 已验证项目
          value: 55
          description: 更小一部分项目进入集成、验证和 SOP 准备。
        - label: 量产上市
          value: 30
          description: 只有部分项目以真实量产车形式上市。
        - label: 放量车型家族
          value: 18
          description: 最成功的项目会扩展到不止一个车型铭牌或使用场景。
        - label: 战略性数据飞轮客户
          value: 10
          description: 少数锚定 OEM 可能贡献不成比例的数据和战略价值。
    claimRefs:
      - CU010
      - CU014
      - CU028
      - CU029
