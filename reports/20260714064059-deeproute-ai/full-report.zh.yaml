      - number: '5.2'
        title: 架构和数据飞轮：VLA 技术栈似乎做什么，以及如何自我改进
        blocks:
          - type: paragraph
            body: >-
              当前 DeepRoute 材料里最有辨识度的技术主张，是平台不再只是端到端驾驶软件，而是一套统一 VLA 技术栈，把感知、推理和行动放进同一模型家族。DeepRoute 称 IO 2.0 使用与大语言模型集成的
              VLA 模型，让系统具备链式推理、更广知识库、OCR、语音交互和分步决策解释。GTC 2026 材料更进一步，描述了一个 400
              亿参数基础模型，可同时充当司机、分析师和批评者。最强的架构含义不只是模型更大；而是公司试图把数据闭环中更多环节转成机器介入的推理。公开描述称，公司靠自动化事件挖掘、根因分析和行为评分，把迭代周期从超过 5
              天压缩到约 12 小时。如果属实，护城河就不再只是某一种传感器布局，而是更快自我改进的开发循环。
