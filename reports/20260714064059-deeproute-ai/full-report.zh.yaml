    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立、布局，以及公司实际卖什么
        blocks:
          - type: paragraph
            body: >-
              DeepRoute.ai 应按自动驾驶系统供应商来评估，而不只是 Robotaxi 运营商或 AI 实验室。多个公开公司画像和媒体报道在基础身份上相互印证：公司 2019 年创立，总部位于深圳，并在
              Fremont 保留布局，显示仍有美国研发或业务拓展能力。它的商业模式也不只是单一软件模块。CB Insights 将其描述为覆盖 Robotaxi、卡车和商业化服务的完整 L4 技术栈，Craft 和
              TechCrunch 则把它呈现为一家向车企和出行场景打包自动驾驶系统的公司。这个框架很关键：它解释了 DeepRoute 为什么能同时走三条线——乘用车辅助驾驶、Robotaxi 运营，以及更长期的物理世界
              AI 平台——但商业化重心仍放在量产车项目上。公开描述还体现出清晰的技术身份：无图驾驶、端到端模型，并愿意把高自动化能力下探到商品化车载硬件和大众市场价位，而不是只留给高端车队。
