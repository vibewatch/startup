            title: 监管现在是经营变量，不是背景备注
            body: 2025 年 MIIT/SAMR 规则和小米事件后的执法姿态意味着，DeepRoute 不能再在流程纪律未明显提升的情况下，依赖快速 OTA 迭代和激进营销话术。
