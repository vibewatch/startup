  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: DeepRoute 最严重的剩余风险集中在中国监管收紧、锚定 OEM 集中度、融资窗口依赖和算力约束。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 中国辅助驾驶 / OTA 收紧
          values:
            - label: 高
              tone: negative
              detail: 规则已经生效，执法也可见。
            - label: 高
              tone: negative
              detail: 会拖慢上市节奏、营销和产品迭代。
            - label: 中
              tone: warning
              detail: 合规流程存在，但公开成熟度不清楚。
            - label: 高
              tone: negative
              detail: 新监管框架下，落地稳定性得到证明前，剩余暴露仍高。
        - label: Great Wall / 核心 OEM 集中度
          values:
            - label: 高
              tone: negative
              detail: 两家核心客户主导可见商业图景。
            - label: 极高
              tone: negative
              detail: 项目滑坡会直接传导到收入和市场情绪。
            - label: 中低
              tone: warning
              detail: 已有公开多元化证据，但仍然较浅。
            - label: 高
              tone: negative
              detail: 更多 OEM 大规模达成 SOP 前，集中度仍会偏高。
        - label: 香港融资窗口依赖
          values:
            - label: 中高
              tone: warning
              detail: IPO 紧迫性在行业报道中可见。
            - label: 高
              tone: negative
              detail: 上市环境疲弱会限制资本灵活性。
            - label: 中
              tone: warning
              detail: 战略背书方有帮助，但资金续航披露缺失。
            - label: 高
              tone: negative
              detail: 公开市场胃口有选择性，剩余暴露仍高。
        - label: Nvidia / AMD 出口管制暴露
          values:
            - label: 中
              tone: warning
              detail: 限制已经生效。
            - label: 高
              tone: negative
              detail: 模型训练和路线图速度可能受到实质性冲击。
            - label: 低
              tone: warning
              detail: 未披露公开的备用算力路线图。
            - label: 高
              tone: negative
              detail: 替代方案得到验证前，暴露仍高。
        - label: Robotaxi 许可与安全执行
          values:
            - label: 中
              tone: warning
              detail: 许可在扩大，但仍按城市推进、分阶段开放。
            - label: 高
              tone: negative
              detail: 上线失败可能造成安全和品牌损害。
            - label: 中低
              tone: warning
              detail: 公开 robotaxi 运营历史仍有限。
            - label: 中高
              tone: warning
              detail: 期权价值仍有吸引力，但运营上脆弱。
        - label: 创始人集中度 / 治理不透明
          values:
            - label: 中
              tone: warning
              detail: Maxwell Zhou 在战略和叙事中仍异常居中。
            - label: 中高
              tone: warning
              detail: 领导层扰动会伤害融资和执行。
            - label: 低
              tone: warning
              detail: 公开的接班安排和董事会纵深披露很薄。
            - label: 中高
              tone: warning
              detail: 组织纵深更清晰前，剩余风险仍在。
    approximationNotes: 可能性、影响、缓释成熟度和剩余严重度标签，是基于公开证据形成的定性尽调判断，不是公司提供的风险模型。
    claimRefs:
      - CR001
      - CR007
      - CR014
      - CR020
      - CR025
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要风险通道从政策、集中度、算力获取和融资，传导到落地速度、收入转化和估值。
    data:
      nodes:
        - id: regulation
          label: 监管收紧
          detail: OTA、营销、召回和报告规则在 2025 年变得更具约束力。
          tone: warning
        - id: customer-concentration
          label: 核心 OEM 集中度
          detail: Great Wall 和 Leapmotor 主导可见客户图谱。
          tone: negative
        - id: compute
          label: AI 算力限制
          detail: 美国对输华芯片的许可限制可能拖慢模型进展。
          tone: warning
        - id: robotaxi
          label: Robotaxi 许可风险
          detail: 面向消费车的 robotaxi 增加了逐城许可和安全复杂度。
          tone: warning
        - id: runway
          label: 资金续航不透明
          detail: 公开材料未披露 DeepRoute 的烧钱速度或现金续航周期。
          tone: negative
        - id: launch-cadence
          label: 上市节奏
          detail: 产品审批和验证决定新功能上线有多快。
          tone: warning
        - id: revenue-conversion
          label: 收入转化
          detail: OEM 部署必须转化为有定价、可重复的车型项目。
          tone: warning
        - id: financing
          label: 融资可选性
          detail: IPO 通道和战略资金支撑持续的研发强度。
          tone: warning
        - id: valuation
          label: 估值 / 下行风险
          detail: 公开 AV 可比公司和上市环境决定外部定价容忍度。
          tone: negative
      edges:
        - from: regulation
          to: launch-cadence
        - from: compute
          to: launch-cadence
        - from: robotaxi
          to: launch-cadence
        - from: customer-concentration
          to: revenue-conversion
        - from: launch-cadence
          to: revenue-conversion
        - from: runway
          to: financing
        - from: revenue-conversion
          to: financing
        - from: financing
          to: valuation
        - from: revenue-conversion
          to: valuation
    approximationNotes: 因果图是定性的，用来展示依赖流向，而不是概率权重。
    claimRefs:
      - CR014
      - CR016
      - CR020
      - CR028
      - CR033
      - CR041
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: DeepRoute 的依赖网络横跨锚定 OEM、算力供应商、监管机构和公开市场融资通道。
    data:
      nodes:
        - id: deeproute
          label: DeepRoute.ai
          detail: OEM 智能驾驶系统和 robotaxi 野心的运营核心。
          tone: positive
        - id: great-wall
          label: Great Wall Motor
          detail: 核心客户和战略投资者。
          tone: warning
        - id: leapmotor
          label: Leapmotor
          detail: 2026 年资本市场报道中提到的第二个核心客户。
          tone: warning
        - id: nvidia
          label: Nvidia / 先进 AI 芯片
          detail: 受美国出口管制影响的关键算力依赖。
          tone: warning
        - id: miit
          label: MIIT / SAMR
          detail: 国家级产品准入、召回和 OTA 监管机构。
          tone: warning
        - id: city-permits
          label: Shanghai / 城市 robotaxi 许可
          detail: 付费无人驾驶服务的本地商业化门槛。
          tone: warning
        - id: hkex
          label: Hong Kong 资本市场
          detail: 可能通过 IPO 打开的后续融资通道。
          tone: warning
        - id: maxwell
          label: Maxwell Zhou
          detail: 创始人 CEO，也是主要战略叙事者。
          tone: warning
      edges:
        - from: great-wall
          to: deeproute
        - from: leapmotor
          to: deeproute
        - from: nvidia
          to: deeproute
        - from: miit
          to: deeproute
        - from: city-permits
          to: deeproute
        - from: hkex
          to: deeproute
        - from: maxwell
          to: deeproute
    approximationNotes: 节点代表运营依赖，而不是完整合同细节下的股权控制权或法律义务。
    claimRefs:
      - CR007
      - CR008
      - CR016
      - CR020
      - CR025
      - CR032
      - CR037
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: “跟踪 / 公允”的判断，来自在量产证据、市场增长，与当前经济性不透明、集中度风险之间权衡。
    data:
      nodes:
        - id: proof
          label: 商业证据
          detail: 20 万+、随后 25 万+ 辆车，加上 5 个 OEM 合作，说明公司已有商业相关性。
          tone: positive
        - id: market
          label: 市场顺风
          detail: 中国 NOA 和授权市场到 2030 年前将大幅扩张。
          tone: positive
        - id: opacity
          label: 财务不透明
          detail: 当前收入、价格和毛利率仍未公开披露。
          tone: negative
        - id: concentration
          label: 客户集中度
          detail: Great Wall 和 Leapmotor 仍主导可见客户图谱。
          tone: warning
        - id: comp-set
          label: 可比估值纪律
          detail: 公开 AV 同业的销售额倍数约 4x 到 26x 不等，且已从更早估值标记压缩。
          tone: warning
        - id: decision
          label: 跟踪 / 公允
          detail: 可以接触，但没有新披露前，避免支付高于低个位数十亿美元区间的价格。
          tone: neutral
      edges:
        - from: proof
          to: decision
        - from: market
          to: decision
        - from: opacity
          to: decision
        - from: concentration
          to: decision
        - from: comp-set
          to: decision
    approximationNotes: null
    claimRefs:
      - CV004
      - CV006
      - CV010
      - CV029
      - CV037
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最重要的敏感性驱动因素，是对 Pony.ai、WeRide 和 Momenta 私有 pre-IPO 估值标记组成的同业篮子施加多大折价。
    data:
      items:
        - label: 相对同业篮子折价约 70%
          value: 1
          detail: 如果香港窗口转弱且 DeepRoute 经济性仍不透明，极保守的私募市场定价。
          tone: negative
        - label: 相对同业篮子折价约 60%
          value: 1.3
          detail: 如果部署证据站得住但披露仍薄，这是谨慎但可支撑的区间。
          tone: warning
        - label: 相对同业篮子折价约 50%
          value: 1.6
          detail: 基准情形中位数：DeepRoute 持续交付，并在没有完整财务披露的情况下适度多元化。
          tone: neutral
        - label: 相对同业篮子折价约 40%
          value: 2
          detail: 更激进的定价，开始假设物理 AI 叙事和 OEM 广度带来更强溢价。
          tone: positive
    approximationNotes: 这些数值是以十亿美元计的情景估值，由简单同业篮子折价推导而来，并以 Pony.ai、WeRide 和 Momenta 的私有 pre-IPO 估值作为方向性锚点。
    claimRefs:
      - CV013
      - CV016
      - CV023
      - CV034
      - CV035
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: DeepRoute 的可支撑估值区间很宽：公司有实质性量产证据，但没有披露当前收入，也缺少清晰价格锚。
    data:
      items:
        - label: 悲观情形
          low: 0.8
          mid: 0.95
          high: 1.1
          displayValue: $0.8B-$1.1B
          detail: 公开可比公司压缩和疲弱上市环境主导叙事；折价最重落在集中度和不透明上。
          tone: negative
        - label: 基准情形
          low: 1.2
          mid: 1.5
          high: 1.8
          displayValue: $1.2B-$1.8B
          detail: 商业证据得到认可，但经济性披露不足，公司相对公开和私有同业仍有较大折价。
          tone: warning
        - label: 乐观情景
          low: 2.2
          mid: 2.6
          high: 3
          displayValue: $2.2B-$3.0B
          detail: 同业可比估值仍有支撑时，市场会更认可 DeepRoute 的 OEM 量产规模、百万辆叙事和 Physical AI 定位。
          tone: positive
    approximationNotes: 区间是按情景推演的估值结果，单位为十亿美元，供投资委员会讨论；不是管理层指引，也不是已有文件记录的交易价格。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: DeepRoute 在市场增长和商业化验证上得分较高，但透明度、按客户集中度调整后的经济性偏弱。
    data:
      items:
        - label: 市场增长
          score: 8
          detail: 到 2030 年，中国 NOA 与授权许可 TAM 扩张，是实打实的结构性顺风。
          tone: positive
        - label: 商业化验证
          score: 7
          detail: 200,000+ 到 250,000+ 辆车，以及多家 OEM 合作伙伴，都是有分量的验证点。
          tone: positive
        - label: 客户多元化
          score: 4
          detail: 2026 年报道中，Great Wall 和 Leapmotor 仍是两大核心客户。
          tone: warning
        - label: 财务透明度
          score: 3
          detail: 当前收入、定价、利润率和当前估值标记仍披露不足。
          tone: negative
        - label: 上市可比支撑
          score: 5
          detail: 同业可比给出可用区间，但二级市场已经压缩自动驾驶估值。
          tone: warning
        - label: 叙事溢价
          score: 6
          detail: Physical AI 定位带来上行空间，但市场仍可能压住垂直自动驾驶叙事的估值上限。
          tone: neutral
        - label: 证据质量
          score: 6
          detail: 证据足以划定区间、约束投资纪律，但还不足以为精确定价背书。
          tone: neutral
    approximationNotes: 分数是 0-10 的序位判断，综合已审阅的公开证据形成，供投资委员会讨论。
    claimRefs:
      - CV010
      - CV028
      - CV029
      - CV032
      - CV039
      - CV040
      - CV042
