      - number: '7.5'
        title: 创始人依赖和治理细节缺失让剩余风险维持高位
        blocks:
          - type: paragraph
            body: >-
              最后一层风险在组织。DeepRoute 是创始人主导的公司，对外战略叙事异乎寻常地集中在 Maxwell Zhou 身上：技术创始人、CEO、physical-AI
              叙事者，也是外界理解公司走向时最可见的解释者。公司拿客户、讲清商业化故事时，这有帮助；但这也是典型单点故障风险。本章查阅的公开记录没有解决这个问题。资料没有披露完整接班计划、清晰可见的管理梯队，也没有足够强的客户合同机制来证明业务已具备组织韧性，而不是靠创始人托举。烧钱速度、现金续航、董事会层面的治理深度也没有披露到让外部投资人能精确量化下行的程度。因此，正确的投资判断不是否认商业进展，而是在把公司视作低风险增长之前，把剩余不确定性压进可监控触发条件和硬性尽调问题。DeepRoute
              看起来能融到钱，也具备商业相关性；但透明度还不够，不足以获得宽松的风险折扣。
