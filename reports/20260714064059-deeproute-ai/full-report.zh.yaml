      - number: '8.4'
        title: 为什么股票能拿到一些溢价——以及为什么现在应给溢价封顶
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 确实有溢价理由。Great Wall 不只是财务资本；它证明这项技术与量产车有关。公司的合作面也比单一客户故事更宽，包括 smart 以及更大的 IO 2.0 OEM
              管线。管理层还在把公司包装成 physical-AI 平台，而不仅是垂直汽车软件供应商；在仍奖励宏大叙事的市场里，这一点可能有用。但今天折价理由更强。KrASIA 和 36Kr
              都把融资窗口描绘为正在收紧：规模本身不再保证溢价定价。客户集中度仍然可见，财务透明度仍薄，市场也越来越区分宽基础模型故事和垂直行业自动驾驶供应商。落到实操，这意味着上行溢价可以承认，但必须大幅打折。DeepRoute
              值得高于大宗汽车供应商折价，但还不足以抹平它相对最佳位置同行的披露、集中度和执行缺口。
