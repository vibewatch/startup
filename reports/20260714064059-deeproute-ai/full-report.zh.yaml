  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管收紧已从背景噪音变成核心经营约束
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 正在中国汽车产业链里监管者 2025 年收紧最明显的部分扩张：辅助驾驶宣传、OTA 治理、事故报告，以及围绕高阶功能的审批边界。2025 年 2 月 MIIT/SAMR
              通知不是抽象政策语言。它把智能网联汽车的产品准入、召回、报告和 OTA 义务正式化，并明确车企不能把高阶驾驶软件当作宽松管理的应用更新循环。TechCrunch、CnEVPost、Business
              Standard 和 CarNewsChina 的后续报道显示，Xiaomi SU7 致命事故之后，这套框架如何落地：营销措辞被收窄，公开 beta 测试被遏制，紧急 OTA
              被推向召回逻辑，公司被要求在发布前做更多验证。对 DeepRoute 来说，它的公开叙事依赖快速迭代和可见城市 NOA
              能力，结论很简单：产品质量已不够。执行现在必须穿过更保守的监管流程；这个流程会拖慢发布、限制营销，并提高任何错误的成本。
