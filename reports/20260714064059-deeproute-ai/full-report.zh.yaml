      - number: '5.3'
        title: 部署、路线图和依赖：技术栈哪里已经成熟，哪里仍依靠伙伴
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 的技术路线图越来越绑定量产就绪。公开发布称，IO 2.0 同时支持 LiDAR 和纯视觉配置，首发于 NVIDIA DRIVE AGX Thor 和 DriveOS，并已确认 5
              家主机厂合作。另有伙伴报道显示，公司也与 Black Sesame 合作，为 L2+/L3 和未来 Robotaxi
              应用推进下一代芯片与软件集成。这个组合说明，它有意追求架构灵活性，而不是严格依赖一条芯片路线或一种传感器哲学。历史上，公司已经展现出积极优化硬件成本的意愿；从 Driver 2.0 到 IO 2.0，再到 40B
              基础模型的路线图，也显示早期 Robotaxi 开发和更新的乘用车部署之间存在连续性。不过，依赖地图是真实的：DeepRoute 需要芯片供应商、主机厂发布项目、允许测试和 OTA
              打磨的监管空间，以及足够高价值驾驶数据来维持飞轮。这些不是边缘约束，而是技术成熟度的核心决定因素。
