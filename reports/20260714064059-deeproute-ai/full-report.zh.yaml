      - number: '1.4'
        title: 里程碑、IPO 信号，以及可能塑造下一阶段的监管背景
        blocks:
          - type: paragraph
            body: >-
              里程碑记录现在已能支撑真实商业化叙事，但也暴露了主要背景风险。公开来源勾勒出一条路径：2019 年创立，早期与 Dongfeng 和 Hangzhou 进行 Robotaxi 试点，2021 年获得
              Alibaba 轮融资，2022 年推进低成本 L4，2024 年完成 Great Wall 支持的融资，2025-2026 年加速量产车部署，并推进 smart、Black Sesame
              合作、与未具名全球车企的 L3 合作，以及 2026 年冲刺 IPO 准备。36Kr 在 2026 年报道称 DeepRoute
              秘密递交港股上市材料，说明管理层认为，在竞争进一步升温前，当前交付和订单转化窗口可以变现。概览阶段的主要风险在于，商业化扩张正进入更严格的监管环境。2025 年，致命安全事件之后，中国 MIIT 收紧了围绕公开
              beta 测试、营销措辞、无人监管泊车功能和 OTA
              管理的规则。对一家品牌与高阶驾驶和快速迭代绑定的公司来说，未来增长不只取决于模型质量和主机厂项目斩获，还取决于它能否证明大众市场部署经得起更正式的监管、更保守的宣传，以及更严格的产品治理纪律。
