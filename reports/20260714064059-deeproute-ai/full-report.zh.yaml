    title: 资本充足性表
    columns:
      - 项目
      - 公开证据
      - 解读
      - 重要性
      - 尽调问题
    rows:
      - - 2021 年重大融资轮
        - CNBC 报道 Alibaba 领投 $300M 融资
        - 证明早期就能筹集相当规模资金
        - 证明历史支持力度和投资人兴趣并不小
        - 股权结构细节，以及结转至当前期间的剩余募资款
      - - 2024 年 Series C1 轮
        - CNBC、TechCrunch 与官方稿共同印证 $100M 战略 OEM 投资
        - 强化产业协同，也可能支持了商业化推进
        - 显示有 OEM 资本支持，但不能说明当前流动性
