      - number: '8.2'
        title: 估值锚存在，但都是间接锚：融资历史、部署证据和市场增长
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 最强的估值支撑来自资本质量和商业化证据，而不是公开财务披露。融资历史可信：2021 年 Alibaba 领投 $300M Series B，2024 年底 Great Wall 战略轮
              $100M。第三方数据集仍聚在累计融资约 $450M 左右，尽管 2026
              年公司关联材料声称累计融资高得多，这也提醒我们，连基础融资总额都需要谨慎。商业上，公司有很多自动驾驶创业公司缺少的东西：公开证据显示量产车已经有相当规模部署。DeepRoute 多次表示自己达到或超过
              200,000 辆门槛，之后又称超过 250,000 辆，同时披露 DeepRoute IO 2.0 已确认五家 OEM
              合作。这些不是审计收入数字，但是真实的估值定价输入，因为它们降低了公司仍只在变现试点观感的概率。更广泛的中国 NOA 市场也在向更低价格带扩张，这很重要，因为 DeepRoute
              最好的价值路径不是豪华小众市场，而是大规模输出面向大众市场的软件。
