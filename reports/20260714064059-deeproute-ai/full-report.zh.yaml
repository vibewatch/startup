      - number: '5.4'
        title: 信任、安全和技术风险：架构细节强于独立验证
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 当前的信任与安全姿态，更多由公司自己讲清楚，而不是由独立第三方证明。公司撰写的材料强调安全优先运行、防御性驾驶、透明度、基于 OCR
              的场景读取，以及更像人的决策逻辑；伙伴和媒体来源则强化了成本效率和可规模化部署主题。公开记录尚未提供 Waymo
              式安全仪表盘、申报级可靠性序列，或关于认证、审计和事故表现的清晰开放证据。这不代表产品弱，但意味着投资人应区分架构可信度和独立证明的信任。竞争对比也凸显这一点：Waymo
              发布了远更明确的碰撞率证据，Mobileye 突出 REM/RSS/EyeQ 作为结构化安全和地图基础件，Apollo 则宣传重安全冗余和 MRC 策略。DeepRoute
              聚焦外包主机厂部署，商业上也许更聪明，但其公开信任披露仍落后于文档最充分的同行。这个缺口是关键技术尽调风险。
