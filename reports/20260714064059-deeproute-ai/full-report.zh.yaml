      - number: '5.1'
        title: 产品定义：DeepRoute 在客户工作流中实际交付什么
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 当前产品最好理解为面向车企的量产智能驾驶平台，而不只是 Robotaxi 原型。公司公开材料将 DeepRoute IO 2.0 描述为面向日常用户的智能驾驶平台，由 VLA
              模型驱动，并为跨多个车型和主机厂集成而设计。这和早期围绕专用 L4 车队的叙事不同：平台现在更贴近整车项目工作流，包括采购、集成、SOP 发布、道路数据收集和迭代更新。Robotaxi
              并未从故事中消失，但已成为相邻层，而不是唯一可见产品。这个框架很重要，因为它解释了公司为什么强调可部署性、传感器灵活性、芯片合作和防御性驾驶行为，而不只是自动驾驶炫技。因此，公开可见的产品是一套模块化智能驾驶技术栈，其价值取决于主机厂适配度、部署成熟度和数据反馈速度。
