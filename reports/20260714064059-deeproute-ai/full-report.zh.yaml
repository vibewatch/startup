        title: 成本结构和单位经济模型：成本压缩证据存在，但毛利证明不存在
        blocks:
          - type: paragraph
            body: >-
              公开证据最强的是 DeepRoute 的成本逻辑，最弱的是已实现利润率。2022 年，公司称已把 L4 硬件包成本从约 $10,000 降到约 $3,000，其中激光雷达和芯片占 BOM
              大头。这个成本披露有用，因为它说明管理层长期把可负担性视为战略问题，但不能误读为 2026 年当前毛利率披露。产品组合已经变化，客户项目已经演进，公司现在围绕端到端和 VLA 驱动的辅助驾驶定位，而不只是
              2022 年 Robotaxi
              硬件包。可能的财务形态是一种混合模型：软件和授权经济性在结构上应好于自己运营每一单行程，但持续算力、安全、验证、集成和支持成本仍很重。缺少已实现定价、合同条款、分成率或客户支持负担时，DeepRoute
              的单位经济模型仍应被视为推断，而不是已证实。
