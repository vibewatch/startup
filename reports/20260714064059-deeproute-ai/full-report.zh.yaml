        - 生态宽度会让技术栈更难被替换，也能拓宽下游分发
        - 即便开放平台不是某个车型项目的直接中标供应商，也可能具备战略影响力
      - - 封闭生态替代方案
        - Tesla FSD、OEM 自研
        - 内部车型项目和自有车队
        - 这些选择会把 OEM 支出从第三方市场移走，从而压缩供应商 SAM
        - 它们是替代方案，不是所有外部 OEM 买家都能采购的供应商
    summary: >-
      DeepRoute faces different competitors depending on whether the buyer wants outsourced NOA, robotaxi capability,
      platform leverage, or an internal stack substitute.
    claimRefs:
      - CP001
      - CP002
      - CP006
      - CP010
      - CP022
      - CP026
      - CP029
      - CP030
    notes: 竞争赛道会重叠；这些类别按主要商业化路径划分，并不意味着严格互斥。
  - id: TP002
    title: 直接同业对比
    columns:
      - 公司
      - 主要模式
      - 公开规模证明
      - 地域布局
      - 对 DeepRoute 最相关的威胁
    rows:
      - - DeepRoute.ai
        - OEM 授权的智能驾驶，并带 robotaxi 邻近选项
        - 到 2025 年底约 200k 辆交付车辆；声称 2025 年 10 月第三方城区 NOA 份额约 40%
        - 中国优先，并明确有海外雄心
        - 需要在更大生态关上战场前，把早期规模转化为持久 OEM 锁定
      - - Momenta
        - 消费级智能驾驶供应商，robotaxi 期权价值在抬升
        - 170 个定点、68 款量产车型、2025 年收入 CNY 2.41bn
        - 扎根中国，ADAS 足迹覆盖 10+ 个国家，并与跨国 OEM 有绑定
        - 在 OEM 覆盖宽度和商业化可信度上，是最直接的外包 NOA 对手
      - - Waymo
        - 全自动网约车运营商
        - 2025 年 15m 次出行；每周 400k 次出行；最新安全更新披露 220m+ 自动驾驶英里
        - 美国为主，并开始拓展早期国际城市
        - 设定 DeepRoute 未来想接近的全球安全和 robotaxi 规模标杆
      - - WeRide
        - 覆盖 robotaxi、ADAS、物流和环卫的 L2-L4 混合产品平台
        - IR 页面披露 40+ 城市 / 12 个国家；IPO 阶段为 30 城市 / 7 个国家
        - 全球多产品扩张
        - 最接近的混合模式同业：既有产品宽度，也能进入公开资本市场
      - - Pony.ai
        - 以 robotaxi 为主的自动驾驶公司，并延伸到 POV 和卡车
        - 截至 2026 年 3 月 25 日拥有 1,446 台车队车辆；目标 2026 年在 20+ 城市部署 3,000 台 robotaxi
        - 中国叠加激进海外增长
        - 中国出身运营商，单位经济性进展可见，且有跨国部署野心
      - - Baidu Apollo
        - 开放生态叠加 robotaxi 和集成 AV 技术栈
        - Apollo 称拥有 260k+ 开发者和 240+ 伙伴；Apollo Go 在部分第三方评分卡中领先
        - 以中国为中心，但生态品牌全球可见
        - 大型平台型竞争者，可把生态拉力和运营经验结合
      - - Mobileye
        - 从 ADAS 到消费级 AV 的授权平台
        - 数百万辆 ADAS 车辆；SuperVision 到 Chauffeur 的路径清晰
        - 全球 OEM 供应商
        - 国际授权类比对象，在芯片、地图和既有设计周期上优势更强
    summary: >-
      Momenta is the sharpest direct consumer-vehicle rival, while Waymo, Pony.ai, WeRide, Apollo, and Mobileye each
      threaten DeepRoute from adjacent but strategically relevant angles.
    claimRefs:
