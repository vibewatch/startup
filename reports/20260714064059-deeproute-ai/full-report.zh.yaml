      - number: '1.2'
        title: 创始人画像、管理层厚度，以及从 L4 Robotaxi 根基转向量产的战略迁移
        blocks:
          - type: paragraph
            body: >-
              创始人叙事很重要，因为 DeepRoute 是中国自动驾驶公司里仍与技术可信的创始 CEO 强绑定的少数玩家。Maxwell Zhou 在公开材料中始终是创始人兼 CEO；履历连接清华、University of
              Texas at Dallas、Texas Instruments 自动驾驶工作，以及创立 DeepRoute 前的 Baidu
              研究经历。这样的技术底色支撑了公司长期聚焦高性价比自动驾驶，而不是只做展示性演示。战略迁移同样重要。早期报道强调 DeepRoute 的 L4 Robotaxi 系统、五激光雷达 Driver 2.0
              技术栈，以及低于 $10,000 的成本目标；2022 年又提出更低的 $3,000 硬件成本。到 2024 年底，TechCrunch 和 CNBC 描述的公司已经重押 L2+/L3 量产系统、端到端 VLA
              模型和主机厂授权，同时仍把 Robotaxi 作为未来商业化层。这不是从自动驾驶撤退，更像是排序选择：DeepRoute 似乎先用辅助驾驶部署变现，借此积累数据和主机厂关系，再把同一技术内核反哺 Robotaxi
              和 RoadAGI 野心。
