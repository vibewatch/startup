  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合：DeepRoute 实际竞争的地方，以及它只是对标领导者的地方
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 位于几个相邻竞争场的中间，这会让赛道看上去比实际更拥挤。在中国外包城市 NOA 和更高阶智能驾驶中，它最直接的竞争对手，是其他把技术栈卖进主机厂项目的第三方供应商，尤其是 Momenta 和
              Huawei HI。在 Robotaxi 和 L4 运营中，Waymo、Pony.ai、WeRide 和 Baidu Apollo
              构成另一组不同但仍相关的对标对象，因为它们争夺的是自动驾驶数据、安全可信度和未来商业化路径。Mobileye 是最接近的国际类比，代表可授权的乘用车技术栈；Tesla
              和主机厂自研则更像替代方案，而不是完全同类供应商。这个框架很重要，因为它说明 DeepRoute 可以在一条线——外包主机厂智能驾驶——具备战略强度，同时尚未在全球最高关注度的 Robotaxi
              指标上领先。它也说明，Huawei HI 和主机厂自研对 DeepRoute 可服务市场的威胁，可能比 Waymo 这种知名但结构不同的运营商更大。
