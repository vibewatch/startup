    rows:
      - - DeepRoute 已进入真实量产部署阶段，公开声称车辆数先后超过 200,000 辆和 250,000 辆，并确认了五家 IO 2.0 OEM 合作。
        - 正向论点
        - 若有独立披露或达到申报文件级别、并与这些部署挂钩的收入数据，正向论点会明显增强。
      - - Great Wall 的投资和客户角色，验证了产品对量产 OEM 项目的相关性。
        - 正向论点
        - 更多非 Great Wall SOP 项目会降低集中度，并增强本轮融资的支撑价值。
      - - 中国授权 / 应用市场和 robotaxi 服务市场预计到 2030 年都将显著扩张，支撑很大的结构性增长空间。
        - 正向论点
        - NOA / 授权市场增长被下调，或旗舰项目之外的 OEM 采用疲弱，都会削弱这项支撑。
      - - 公开来源仍未披露 DeepRoute 当前收入、定价或毛利率，因此划区间容易，精确承销很难。
        - 反向论点
        - 当前收入桥和定价表会大幅提升信心。
      - - 可见客户集中度仍显得偏窄，2026 年报道中 Great Wall 和 Leapmotor 是两个突出的核心客户。
        - 反向论点
        - 更广的客户级收入披露，或多个新的 SOP 客户，会降低这一担忧。
      - - 公开 AV 可比公司已较早期估值明显压缩，说明若披露和执行令人失望，商业化本身也不能保护估值。
        - 反向论点
        - 板块重估，或同业在香港获得强劲定价，会让可比公司集合更宽容。
    notes: 正向论点说明 DeepRoute 为什么配得上一个有意义的估值走廊；反向论点说明这条走廊为什么仍该打折。
