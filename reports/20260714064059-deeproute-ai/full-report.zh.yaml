companyProfile:
  summary: >-
    DeepRoute.ai 是一家深圳自动驾驶公司，2019 年由 Maxwell Zhou 创立。公司早期身份以 Robotaxi 优先、L4 为核心，如今已转向为主机厂提供量产智能驾驶系统，同时保留 Robotaxi
    和更广义的物理世界 AI 野心。当前商业化逻辑靠量产车部署、Route PRO / DeepRoute IO 智能驾驶系统，以及 Great Wall Motor、smart 等车企战略合作支撑，而不是靠已公开披露的财务表现。
  founders:
    - name: Maxwell Zhou
      role: 创始人兼 CEO
      background: Maxwell Zhou 接受过清华和 UT Dallas 训练，是技术型创业者；此前曾在 Texas Instruments 和 Baidu 研究部门从事自动驾驶相关工作。
      claimRefs:
        - CO011
  foundingLocation: Shenzhen, Guangdong, China
  headquarters: Shenzhen, China
