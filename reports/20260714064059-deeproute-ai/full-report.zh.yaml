      - number: '1.3'
        title: 融资历史、投资人地图，以及公开可见的商业化证明
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 的资本历史说明，它多次拿到战略资金，而不只是普通风险投资。CNBC 记录了 2021 年 Alibaba 领投的 $300 million B 轮；CNBC 和 TechCrunch 在
              2024 年报道了 Great Wall Motor 投入的 $100 million 战略轮。随后，公开数据服务大致汇聚到数亿美元中段的累计融资基础，CB Insights 和公司 2025
              年英国公关稿都指向约 $450 million 融资，尽管后续宣传报道声称融资超过 $700 million。这个不一致不抹掉正向信号：DeepRoute
              显然有蓝筹支持者，也有足够资本继续扩张。2025-2026 年更有意义的变化，是商业化证明开始出现。DeepRoute 自己的英国和 PRN Asia 发布、36Kr
              以及多家行业媒体都描述，公司已从数万辆部署系统推进到 2025 年底约 200,000 辆量产车，目标是在 2026 年达到 1,000,000 辆，并在 2025 年 10 月拿下中国第三方城市 NOA 近
              40% 份额。这些数字仍是公司口径，需要独立核对，但方向上符合一家后期私营公司进入更商业化阶段的特征，明显不同于早期只讲 Robotaxi 的身份。
