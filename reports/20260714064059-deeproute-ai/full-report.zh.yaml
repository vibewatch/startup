      - number: '7.4'
        title: 算力管制、robotaxi 落地和政策碎片化都可能拖慢路线图
        blocks:
          - type: paragraph
            body: >-
              DeepRoute 的技术野心带来一个容易被低估的二阶风险：公司不只是把 ADAS 装进乘用车，还在讲更大的 physical-AI 和 robotaxi
              未来。要撑起这套叙事，模型迭代速度、算力可得性、验证能力和数据治理纪律都要跟上。2025 年 4 月，美国对 Nvidia 和 AMD 芯片出口许可的调整，加上 Nvidia 自身计提 $5.5B
              中国相关费用，说明算力供应已是现实地缘政治变量，不是假设风险。与此同时，中国最大城市的 robotaxi 商业化许可正在增加，但路径仍是分阶段、按城市、基于安全案例推进，而不是全国一键放行。如果
              DeepRoute 的消费车 robotaxi 策略能低成本做大，可能变成优势；但它也会让公司同时面对更多监管和安全接口。再叠加数据安全和网络安全义务，路线图看起来更像多线合规工程，而不是单纯的软件升级故事。
