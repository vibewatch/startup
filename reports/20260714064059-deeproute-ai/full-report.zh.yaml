        title: 公私市场可比公司给出一条很宽但仍有用的估值走廊
        blocks:
          - type: paragraph
            body: >-
              可比公司范围很宽，因为每家公司解决的是自动驾驶问题的不同环节，但足够划出边界。Pony.ai 和 WeRide
              是最接近的中国上市自动驾驶可比公司，因为它们在中国变现自动驾驶，且仍按亏损、叙事驱动型股票交易。Mobileye
              结构不同——成熟得多、收入披露也多得多——但它最清楚地说明，一旦市场真正看得见规模，倍数会压缩到哪里。Momenta
              重要，因为它是披露最接近的后期中国智能驾驶供应商可比公司：可见装机基数大得多、财务披露更多，并且在 2026 年从约 $5B 私募估值跃升到接近 $9B
              公开市场估值。这组可比同时说明两件事。第一，除非披露显著加强，DeepRoute 不应接近 Momenta 上沿或 Mobileye 的绝对市值。第二，公司也不应按早期科研项目定价，因为它的部署证据和 OEM
              足迹明显领先那个类别。因此，重折价但不惩罚性的基准情景，是最站得住脚的中间路线。
