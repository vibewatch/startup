        - 抬高了 robotaxi 准备度和商业化纪律的门槛
      - - Baidu Apollo
        - 平台触达、开发者生态、集成的大模型和 robotaxi 叙事
        - 在平台开放性和产品具体性之间取平衡，复杂度高
        - 让小公司更难只靠生态宽度取胜
      - - Mobileye
        - 芯片、地图、安全模型、OEM 存量地位
