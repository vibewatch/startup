      - number: '2.3'
        title: 'Buyer segmentation: who buys, who uses, who pays, and how adoption happens'
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-layered but still centered on automakers. OEM product teams, ADAS leadership,
              procurement, and vehicle-platform engineering are the real buying center for DeepRoute-like suppliers
              because they decide whether to self-develop, use a platform like Huawei’s, or contract with a third-party
              stack provider. The user is the driver, but the payer is the OEM, which typically embeds the system in
              vehicle BOM and pricing rather than selling it as a pure SaaS subscription. Domestic Chinese brands are
              the most important current buyers because they move faster, tolerate faster iteration, and often want
              differentiated intelligent-driving features in intense price competition. Joint ventures and global brands
              are a second critical segment because the CAAM report says internationally known brands are increasingly
              choosing top Chinese suppliers to close capability gaps. Robotaxi operators are different: they value
              safety, uptime, ODD expansion, and operational economics more than trim-level feature differentiation.
              Adoption follows a recognizable path from chip and software selection to integration, validation, SOP,
              field data, and cross-model reuse. This path favors suppliers with large-scale delivery experience rather
              than only strong algorithms, which is why market commentary keeps emphasizing mass-production execution as
              the new gating factor.
