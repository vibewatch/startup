companyProfile:
  summary: >-
    DeepRoute.ai is a Shenzhen-based autonomous-driving company founded in 2019 by Maxwell Zhou. The business has
    shifted from an earlier robotaxi-first Level 4 identity toward being a mass-production intelligent-driving supplier
    for OEMs, while still preserving robotaxi and broader physical-AI ambitions. Its current commercialization case
    rests on production-vehicle deployment, Route PRO / DeepRoute IO intelligent-driving systems, and strategic
    partnerships with automakers such as Great Wall Motor and smart, rather than on disclosed public financial
    performance.
  founders:
    - name: Maxwell Zhou
      role: Founder and CEO
      background: >-
        Tsinghua and UT Dallas trained technologist with prior autonomous-driving work at Texas Instruments and Baidu
        research.
      claimRefs:
        - CO011
  foundingLocation: Shenzhen, Guangdong, China
  headquarters: Shenzhen, China
  productSummary: >-
    Route PRO / DeepRoute IO intelligent-driving systems for highway and city NOA in production passenger vehicles, plus
    a robotaxi platform and a broader RoadAGI / physical-AI foundation-model roadmap.
  customerFocus: >-
    Automakers integrating advanced driving features into mass-production passenger vehicles; longer-term robotaxi and
    mobility partners.
  businessModel: OEM technology licensing and integration for production vehicles, with future robotaxi monetization optionality.
  stage: Late-stage private; Hong Kong IPO preparation reported in 2026
  fundingStatus: ~$450M supportable total raised; latest disclosed round was a $100M Series C1 from Great Wall Motor in Nov 2024
