      - number: '7.2'
        title: Commercial proof is real, but it still appears concentrated in a small number of OEM relationships
        blocks:
          - type: paragraph
            body: >-
              DeepRoute has crossed the pilot threshold, but the risk profile still looks concentrated rather than
              diversified. Public materials support real scale: more than 200,000 production vehicles by end-2025, a
              later 250,000-plus figure at GTC 2026, and expanding OEM integrations. Yet the most decision-relevant
              customer fact in the new 2026 capital-markets coverage is not just deployment scale; it is that Great Wall
              and Leapmotor are repeatedly described as the two core customers. Great Wall matters even more because it
              is both strategic investor and operating customer, which is positive for trust and rollout velocity but
              negative for concentration, bargaining balance, and potential roadmap dependence. The business model also
              remains opaque in the exact places investors usually use to underwrite durability: per-vehicle pricing,
              customer-level revenue share, renewal terms, exclusivity, and cross-model expansion economics are all
              missing from public disclosure. That means the headline adoption curve is believable, but the resilience
              of the revenue base still has to be inferred rather than demonstrated.
