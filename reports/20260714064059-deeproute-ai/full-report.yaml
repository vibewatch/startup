      - number: '7.5'
        title: Founder dependence and missing governance detail keep the residual risk high
        blocks:
          - type: paragraph
            body: >-
              The last risk layer is organizational. DeepRoute is a founder-led company whose external strategic story
              is unusually concentrated in Maxwell Zhou: technical founder, CEO, physical-AI narrator, and the most
              visible interpreter of what the company is becoming. That is helpful while the company is winning
              customers and telling a coherent commercialization story, but it is also a classic single-point-of-failure
              risk. The public record reviewed for this chapter does not solve the problem. It does not disclose a full
              succession plan, a clearly visible management bench, or customer-contract mechanics strong enough to prove
              that the business is institutionally durable rather than founder-carried. Nor does it disclose burn rate,
              cash runway, or board-level governance depth in a way that lets outside investors size downside precisely.
              The correct underwriting response is therefore not to deny the traction, but to force the residual
              uncertainty into monitorable triggers and hard diligence asks before treating the company as low-risk
              growth. DeepRoute looks fundable and commercially relevant, but not yet transparent enough to deserve a
              lenient risk haircut.
