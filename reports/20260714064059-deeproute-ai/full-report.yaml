      - number: '8.2'
        title: 'Valuation anchors exist, but they are indirect: funding history, deployment proof, and market growth'
        blocks:
          - type: paragraph
            body: >-
              DeepRoute's strongest valuation support comes from capital quality and commercialization proof rather than
              from public financial disclosure. The funding history is credible: a $300 million Alibaba-led Series B in
              2021 and a $100 million Great Wall strategic round in late 2024. Third-party datasets still cluster around
              roughly $450 million total raised, even though 2026 company-linked material claimed a much higher
              cumulative funding figure, underscoring that even basic capital totals require caution. Commercially, the
              company has something many autonomy startups lack: public evidence of production-vehicle deployment at
              meaningful scale. DeepRoute repeatedly said it was at or above the 200,000-vehicle threshold and later
              above 250,000, while also publicizing five confirmed OEM partnerships for DeepRoute IO 2.0. Those are not
              audited revenue figures, but they are real pricing inputs because they reduce the chance that the company
              is still only monetizing pilot optics. The broader China NOA market is also expanding into lower price
              bands, which matters because DeepRoute's best path to value is not a luxury niche; it is mass-market
              software output at scale.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
