      - number: '7.4'
        title: Compute controls, robotaxi rollout, and policy fragmentation can all slow the roadmap
        blocks:
          - type: paragraph
            body: >-
              DeepRoute's technical ambition raises a second-order risk that is easy to underestimate: the company is
              not only shipping ADAS into passenger vehicles, it is also pitching a broader physical-AI and robotaxi
              future. That ambition depends on model iteration speed, compute access, validation capacity, and data
              governance discipline. The April 2025 U.S. export-licensing shift for Nvidia and AMD chips, plus Nvidia's
              own $5.5 billion China-related charge, show that compute supply is a live geopolitical variable rather
              than a hypothetical one. At the same time, robotaxi commercialization is becoming more permitted in
              China's biggest cities, but still through staged, city-level, safety-case-based programs rather than a
              simple nationwide green light. DeepRoute's consumer-vehicle robotaxi strategy could become an advantage if
              it scales cheaply, but it also multiplies the number of regulatory and safety interfaces the company has
              to manage at once. Add in data-security and cybersecurity obligations, and the roadmap begins to look more
              like a multi-front compliance program than a pure software-upgrade story.
            claimRefs:
              - CR010
