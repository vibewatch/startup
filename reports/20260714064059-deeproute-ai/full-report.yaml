      - number: '8.3'
        title: Public and private comps define a wide but still useful valuation corridor
        blocks:
          - type: paragraph
            body: >-
              The comparable set is wide because each peer solves a different part of the autonomy problem, but it is
              still good enough to set boundaries. Pony.ai and WeRide are the closest public Chinese autonomy comps
              because they monetize autonomy in China and still trade as loss-making, narrative-heavy stocks. Mobileye
              is structurally different—far more mature and much more revenue-disclosed—but it supplies the clearest
              benchmark for where multiples compress once the market can actually see scale. Momenta matters because it
              is the closest disclosed late-stage China intelligent-driving supplier comp: much larger visible installed
              base, more disclosed financials, and a 2026 private-to-public step-up from about $5 billion to nearly $9
              billion. That set implies two things at once. First, DeepRoute should not trade anywhere near Momenta's
              upper bound or Mobileye's absolute market cap without much stronger disclosure. Second, it also should not
              be valued like an early-stage science project, because its deployment proof and OEM footprint are
              materially ahead of that category. A discount-heavy but not punitive base case is therefore the most
              supportable middle path.
            claimRefs:
