      - number: '1.2'
        title: Founder profile, leadership bench, and the strategy shift from L4 robotaxi roots to mass production
        blocks:
          - type: paragraph
            body: >-
              The founder story is important because DeepRoute is one of the Chinese autonomous-driving companies still
              visibly identified with a technically credible founding CEO. Maxwell Zhou is consistently presented as
              founder and CEO, with public biographical material tying him to Tsinghua, the University of Texas at
              Dallas, Texas Instruments autonomous-driving work, and Baidu research experience before founding
              DeepRoute. That technical profile supports the company’s long-running focus on cost-efficient autonomy
              rather than pure showcase demos. The strategic shift is equally important. Earlier reporting emphasized
              DeepRoute’s Level 4 robotaxi system, five-lidar Driver 2.0 stack, and under-$10,000 cost target, followed
              by an even lower $3,000 hardware-cost claim in 2022. By late 2024, TechCrunch and CNBC described a company
              leaning hard into Level 2+/Level 3 mass-production systems, end-to-end visual-language-action models, and
              OEM licensing, even while continuing to frame robotaxi as a future commercialization layer. This is not a
              retreat from autonomy so much as a sequencing decision: DeepRoute appears to be monetizing
              assisted-driving deployments first, using those deployments to gather data and OEM relationships, and then
              trying to feed robotaxi and RoadAGI ambitions from the same technical core.
